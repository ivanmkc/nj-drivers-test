name: iOS Build & Test

on:
  push:
    paths:
      - 'ios/**'
      - 'data/**'
      - 'tools/bundle.py'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'data/**'
      - 'tools/bundle.py'
      - '.github/workflows/ios.yml'

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/DriversTest

    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          which swiftlint || brew install swiftlint
          cd ${{ github.workspace }}/ios && swiftlint

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bundle dependencies
        run: pip install pyyaml

      - name: Bundle questions
        run: python3 ../../tools/bundle.py

      - name: Select Xcode
        run: |
          XCODE_PATH=/Applications/Xcode_26.3.app
          test -d "$XCODE_PATH" || { echo "::error::Xcode 26.3 is required"; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: List available simulators
        run: xcrun simctl list devices available | grep iPhone | head -10

      - name: Build
        run: |
          xcodebuild build -sdk iphonesimulator \
            -project DriversTest.xcodeproj \
            -scheme DriversTest \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release (unsigned, generic iOS device)
        run: |
          xcodebuild build -sdk iphoneos \
            -project DriversTest.xcodeproj \
            -scheme DriversTest \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator
        run: |
          # Find an available iPhone simulator UDID
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid']); sys.exit()
          ")
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          echo "Booting simulator: $UDID"
          test -n "$UDID" || { echo "::error::No available iPhone simulator"; exit 1; }
          if ! xcrun simctl list devices booted -j | grep -q "$UDID"; then
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b

      - name: Run UI Tests
        run: |
          echo "Testing on simulator: $SIMULATOR_UDID"
          xcodebuild test -sdk iphonesimulator \
            -project DriversTest.xcodeproj \
            -scheme DriversTest \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/DriversTest/TestResults.xcresult
