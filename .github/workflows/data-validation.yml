name: Data Validation

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tools/**'
      - 'requirements*.txt'
      - '.github/workflows/data-validation.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'tools/**'
      - 'requirements*.txt'
      - '.github/workflows/data-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Audit questions
        run: python3 tools/audit_questions.py

      - name: Build bundle
        run: python3 tools/bundle.py
