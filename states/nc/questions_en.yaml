  choices:
    A: Following too closely
    B: Illegal parking
    C: Running through a stop sign
    D: Failure to properly restrain a child in a seat belt
  answer: B
  explanation: The manual lists several offenses for which no points shall be assessed,
    including 'Illegal parking'.
- id: 118
  category: penalties_and_points
  question: What is the penalty for any person who permits their driver license to
    be used by an underage person to purchase an alcoholic beverage?
  choices:
    A: A 30-day license suspension
    B: A 6-month license suspension
    C: A one-year driver license revocation
    D: A permanent driver license revocation
  answer: C
  explanation: The law requires a one-year driver license revocation upon conviction
    for any person who permits their driver license or any other ID to be used by
    an underage person to purchase or attempt to purchase an alcoholic beverage.
- id: 119
  category: penalties_and_points
  question: The DMV can suspend your driver license if you receive two convictions
    within a 12-month period for which of the following offenses?
  choices:
    A: Speeding over 55 mph
    B: Following too closely
    C: Running through a red light
    D: Driving on the wrong side of the road
  answer: A
  explanation: The DMV can suspend your license for two convictions of speeding over
    55 mph within a period of 12 months.
- id: 120
  category: penalties_and_points
  question: Under North Carolina law, the DMV can suspend your license for which of
    the following?
  choices:
    A: One conviction of speeding over 45 mph
    B: Two convictions of speeding over 55 mph within a period of 12 months
    C: One conviction of speeding over 50 mph within 6 months
    D: Three convictions of speeding over 40 mph within 2 years
  answer: B
  explanation: The DMV can suspend your license for two convictions of speeding over
    55 mph within a period of 12 months.
- id: 121
  category: penalties_and_points
  question: 'Your driving privilege will be revoked for at least 30 days if you are
    convicted of driving any vehicle more than 15 miles per hour over the speed limit,
    provided you are driving at a speed higher than:'
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: Your driving privilege will be revoked for at least 30 days if you
    are convicted of driving any vehicle more than 15 miles per hour over the speed
    limit, if you are driving at a speed higher than 55 mph.
- id: 122
  category: penalties_and_points
  question: What is the suspension time for a conviction of prearranged racing with
    another motor vehicle on the highway?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: D
  explanation: A conviction for prearranged racing with another motor vehicle on the
    highway results in a 3-year suspension.
- id: 123
  category: alcohol_drugs_health
  question: What is the penalty for manslaughter while under the influence of an impairing
    substance?
  choices:
    A: 1 year suspension
    B: 3 year suspension
    C: 5 year suspension
    D: Permanent suspension
  answer: D
  explanation: According to the suspension time table, manslaughter while under the
    influence of an impairing substance results in a permanent suspension.
- id: 124
  category: penalties_and_points
  question: What is the penalty for failure to yield the right of way when entering
    an intersection that results in serious bodily injury?
  choices:
    A: 30 days suspension and $100 fine
    B: 60 days suspension and $250 fine
    C: 90 days suspension and $500 fine
    D: 1 year suspension and $1000 fine
  answer: C
  explanation: Failure to yield right of way resulting in serious bodily injury carries
    a penalty of a 90-day suspension and a $500 fine.
- id: 125
  category: driver_responsibility
  question: If you believe your driving privilege should not have been revoked and
    a DMV hearing gives you no help, how long do you have to appeal the decision to
    the Superior Court?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: You may appeal the DMV’s decision within 30 days to the Superior Court
    of the county where you live.
- id: 126
  category: penalties_and_points
  question: How does the North Carolina DMV handle traffic convictions that occur
    outside of the state?
  choices:
    A: They are ignored unless they involve a fatality.
    B: They may result in your license being suspended or revoked just as if the violations
      occurred in North Carolina.
    C: They only add points to your license but cannot cause a suspension.
    D: They require you to retake the driving test but carry no other penalties.
  answer: B
  explanation: Convictions occurring outside North Carolina may result in your license
    being suspended or revoked just as if the violations occurred in this state.
- id: 127
  category: license_system
  question: 'If you are a provisional licensee (under age 18), your license may be
    suspended for 90 days upon conviction of:'
  choices:
    A: A first moving violation within a 12-month period.
    B: A second moving violation within a 12-month period.
    C: A third moving violation within a 12-month period.
    D: A fourth moving violation within a 12-month period.
  answer: C
  explanation: A provisional licensee's license may be suspended for 90 days upon
    conviction of a third moving violation occurring within a 12-month period.
- id: 128
  category: penalties_and_points
  question: What is the standard restoration fee required by North Carolina law to
    clear a suspension or revocation (excluding DWI convictions or medical reasons)?
  choices:
    A: $50.00
    B: $83.50
    C: $167.25
    D: $200.00
  answer: B
  explanation: North Carolina law requires that a restoration fee of $83.50 be paid
    to the DMV before a suspension or revocation can be cleared.
- id: 129
  category: alcohol_drugs_health
  question: How much is the restoration fee when a driver's license revocation results
    from a DWI conviction?
  choices:
    A: $50.00
    B: $83.50
    C: $167.25
    D: $250.00
  answer: C
  explanation: A $167.25 restoration fee is required when the revocation results from
    a DWI conviction.
- id: 130
  category: penalties_and_points
  question: 'When restoring a revoked or suspended driver license, a $50 service fee
    is required UNLESS:'
  choices:
    A: The driver completes a defensive driving course.
    B: The driver is under 18 years of age.
    C: The license was surrendered to the court or mailed to the DMV before the effective
      date of the suspension.
    D: The driver pays the restoration fee in cash.
  answer: C
  explanation: A service fee of $50 is required upon restoration unless the license
    was surrendered to the court or mailed to the DMV before the effective date of
    the suspension or revocation.
- id: 131
  category: defensive_driving
  question: According to the manual, at 55 mph, a vehicle travels the length of a
    football field in how much time?
  choices:
    A: 2.5 seconds
    B: 3.7 seconds
    C: 4.2 seconds
    D: 5.0 seconds
  answer: B
  explanation: At 55 mph, a vehicle travels the length of a football field in 3.7
    seconds.
- id: 132
  category: defensive_driving
  question: Which of the following is a warning sign of drowsy driving?
  choices:
    A: You cannot remember the last few miles driven.
    B: You are gripping the steering wheel too tightly.
    C: You are checking your mirrors more frequently than usual.
    D: You feel an urge to increase your speed.
  answer: A
  explanation: A warning sign of drowsy driving is that you cannot remember the last
    few miles driven.
- id: 133
  category: penalties_and_points
  question: If you cannot afford to pay off a traffic ticket, what is the first step
    in Option A to ask the court to reduce or waive the amount owed?
  choices:
    A: Call the DMV to request a payment plan.
    B: Fill out the Motion for Relief (AOC-CR-415).
    C: Surrender your driver's license to the local police station.
    D: Mail a letter of explanation to the Superior Court.
  answer: B
  explanation: Step 1 of Option A (I CAN'T Afford to Pay Now) is to fill out the Motion
    for Relief, AOC-CR-415.
- id: 134
  category: safe_driving_rules
  question: To help prevent drowsy driving, what is the recommended daily driving
    limit?
  choices:
    A: 100-200 miles
    B: 300-400 miles
    C: 500-600 miles
    D: 700-800 miles
  answer: B
  explanation: The manual recommends trying to set a limit of 300-400 miles of driving
    per day to prevent drowsy driving.
- id: 135
  category: defensive_driving
  question: When driving long distances, how often should you stop to get out of the
    car, stretch, and walk briskly?
  choices:
    A: At least every 2 hours
    B: At least every 4 hours
    C: Only when you need to refuel
    D: Every 100 miles
  answer: A
  explanation: To prevent drowsy driving, the manual advises stopping regularly when
    driving long distances and getting out of the car at least every 2 hours to stretch
    and walk briskly.
- id: 136
  category: defensive_driving
  question: Why do distractions make it more difficult to conduct preventive or evasive
    moves to avoid a crash?
  choices:
    A: They increase the driver's field of vision
    B: They cause the vehicle's brakes to respond more slowly
    C: Many distractions force a driver to take at least one hand off the steering
      wheel
    D: They make the driver overly cautious
  answer: C
  explanation: The manual states that distractions make it more difficult to conduct
    preventive or evasive moves to avoid a crash because many distractions force a
    driver to take at least one hand off the steering wheel.
- id: 137
  category: safe_driving_rules
  question: Under what circumstance may a driver under the age of 18 use a cell phone
    while the vehicle is in motion?
  choices:
    A: When calling a parent or legal guardian
    B: When using a hands-free device
    C: When calling 911 in an emergency
    D: When stopped at a red light
  answer: C
  explanation: Drivers less than 18 years of age are not permitted to use a cell phone
    while the vehicle is in motion, with the exception of calling 911 in an emergency.
- id: 138
  category: safe_driving_rules
  question: Which of the following actions is unlawful while operating a vehicle on
    a public street or highway?
  choices:
    A: Listening to the radio
    B: Using a cell phone for email or text messages
    C: Talking to passengers
    D: Using the vehicle's climate control system
  answer: B
  explanation: The manual states that it is unlawful to use a cell phone for email
    or text messages while operating a vehicle on a public street or highway or public
    vehicular area.
- id: 139
  category: alcohol_drugs_health
  question: Approximately what percentage of all traffic fatalities involve alcohol?
  choices:
    A: 15 percent
    B: 25 percent
    C: 38 percent
    D: 50 percent
  answer: C
  explanation: According to the manual, about 38 percent of all traffic fatalities
    involve alcohol.
- id: 140
  category: alcohol_drugs_health
  question: Because alcohol is a depressant, how can it affect your driving behavior?
  choices:
    A: It sharpens your ability to judge distance
    B: It speeds up your brain functions and reaction times
    C: It gives you false confidence and may cause you to take greater risks
    D: It makes it easier to do more than one thing at a time
  answer: C
  explanation: Alcohol is a depressant that gives you false confidence, meaning you
    may take greater risks because you think your driving is better than it really
    is.
- id: 141
  category: alcohol_drugs_health
  question: What is the only effective way to sober up after drinking alcohol?
  choices:
    A: Drinking strong coffee
    B: Taking a cold shower
    C: Eating a big meal
    D: Allowing time to pass
  answer: D
  explanation: 'The manual explicitly states: ''The only thing that sobers up a drinker
    is time. Coffee, a big meal or cold showers will not work.'''
- id: 142
  category: safe_driving_rules
  question: Which statement is true regarding seat belts and air bags?
  choices:
    A: Seat belts are optional if the vehicle has front air bags
    B: Only the driver must wear a seat belt if the vehicle has air bags
    C: All occupants must wear seat belts even if the vehicle is equipped with air
      bags
    D: Passengers in the rear seat do not need seat belts if front air bags are present
  answer: C
  explanation: Under the seat belt law, all occupants MUST wear seat belts even if
    the vehicle is equipped with air bags.
- id: 143
  category: safe_driving_rules
  question: Which of the following is an exemption to the North Carolina seat belt
    law?
  choices:
    A: A driver making frequent delivery stops whose speed between stops does not
      exceed 20 mph
    B: A passenger riding in the back seat of a passenger car
    C: A driver operating a vehicle manufactured after 2010
    D: A driver who is traveling less than 5 miles from their home
  answer: A
  explanation: An exemption to the seat belt law includes a driver or passenger frequently
    stopping and leaving the vehicle or delivering property if the speed of the vehicle
    between stops does not exceed 20 miles per hour.
- id: 144
  category: driver_responsibility
  question: What is the number one threat to the lives of young children?
  choices:
    A: Household poisons
    B: Automobile accidents
    C: Drowning
    D: Fire hazards
  answer: B
  explanation: The manual states that the number one threat to the lives of young
    children is the automobile accident.
- id: 145
  category: safe_driving_rules
  question: A child must be properly secured in a weight-appropriate child passenger
    restraint system if they are under what age and weight?
  choices:
    A: Under age 6 and weighing less than 60 pounds
    B: Under age 7 and weighing less than 70 pounds
    C: Under age 8 and weighing less than 80 pounds
    D: Under age 9 and weighing less than 90 pounds
  answer: C
  explanation: A child under age 8 and weighing less than 80 pounds must be properly
    secured in a weight appropriate child passenger restraint system.
- id: 146
  category: safe_driving_rules
  question: Where must a child under age 5 and weighing less than 40 pounds be secured
    if the vehicle has an active passenger-side front air bag and a rear seat?
  choices:
    A: In the front passenger seat with the seat pushed all the way back
    B: In the rear seat
    C: In the front passenger seat using a lap belt only
    D: In the cargo area of an SUV
  answer: B
  explanation: If the vehicle is equipped with an active passenger-side front air
    bag and has a rear seat, a child under age 5 and weighing less than 40 pounds
    must be properly secured in the rear seat (unless the restraint system is designed
    for use with a front air bag).
- id: 147
  category: driver_responsibility
  question: During an average lifetime of driving, what is the approximate chance
    of being seriously injured or killed in a motor vehicle crash?
  choices:
    A: One-in-two
    B: One-in-three
    C: One-in-five
    D: One-in-ten
  answer: B
  explanation: During an average lifetime of driving, we face about a one-in-three
    chance of being seriously injured or killed in a motor vehicle crash.
- id: 148
  category: safe_driving_rules
  question: At what speed can an air bag come out of the dashboard during a crash?
  choices:
    A: Up to 50 miles per hour
    B: Up to 100 miles per hour
    C: Up to 150 miles per hour
    D: Up to 200 miles per hour
  answer: D
  explanation: To do its important job, an air bag comes out of the dashboard at up
    to 200 miles per hour — faster than the blink of an eye.
- id: 149
  category: safe_driving_rules
  question: According to the manual, children of what age should ride buckled up in
    a rear seat?
  choices:
    A: Age 8 and under
    B: Age 10 and under
    C: Age 12 and under
    D: Age 15 and under
  answer: C
  explanation: Child Safety Points state that children age 12 and under should ride
    buckled up in a rear seat.
- id: 150
  category: vehicle_information
  question: Which of the following is a characteristic of a legal motorcycle helmet?
  choices:
    A: A thin soft foam padding
    B: A DOT sticker purchased separately and placed by the motorcyclist
    C: A thick inner liner of polystyrene foam that is about one inch thick
    D: No manufacturer's label to reduce weight
  answer: C
  explanation: A legal helmet includes a thick inner liner which includes a firm inner
    liner of polystyrene foam that is about one inch thick.
- id: 151
  category: safe_driving_rules
  question: Under North Carolina law, children under what age are generally prohibited
    from riding in the open bed of a pick-up truck?
  choices:
    A: Age 12
    B: Age 14
    C: Age 16
    D: Age 18
  answer: C
  explanation: North Carolina law prohibits children less than age 16 from riding
    in the open bed of a pick-up truck.
- id: 152
  category: penalties_and_points
  question: What is the penalty for violating the law regarding transporting children
    in the back of a pick-up truck?
  choices:
    A: A fine of $25 and driver license points
    B: A fine of $25, with no court costs or driver license points
    C: A fine of $100 and an insurance surcharge
    D: A fine of $50 and court costs
  answer: B
  explanation: Violators are issued tickets and are subject to a fine of $25. Violations
    of this law are defined as 'infractions' and do not incur court costs, driver
    license points or insurance surcharges.
- id: 153
  category: safe_driving_rules
  question: Which of the following is an exemption to the law prohibiting children
    from riding in the open bed of a pick-up truck?
  choices:
    A: If the vehicle is traveling under 25 mph
    B: If the vehicle is being operated in a parade
    C: If the child is sitting on the tailgate
    D: If the trip is less than 5 miles
  answer: B
  explanation: The provisions for proper securement of children do not apply if the
    vehicle is being operated in a parade.
- id: 154
  category: safe_driving_rules
  question: How much higher can the temperature inside a parked vehicle rise compared
    to the outside temperature?
  choices:
    A: 10-20 degrees
    B: 20-30 degrees
    C: 40-50 degrees
    D: 60-70 degrees
  answer: C
  explanation: The temperature inside a vehicle can rise approximately 40-50 degrees
    higher than the outside temperature.
- id: 155
  category: vehicle_information
  question: What invisible, odorless, and poisonous gas can back up into a car if
    snow blocks the exhaust pipe?
  choices:
    A: Carbon dioxide
    B: Nitrogen oxide
    C: Hydrogen sulfide
    D: Carbon monoxide
  answer: D
  explanation: During winter months, snow can block a car's exhaust pipe, and warming
    up a car can cause carbon monoxide to back up into the car. Carbon monoxide is
    an invisible gas that has no smell, taste or color but is poisonous.
- id: 156
  category: sharing_the_road
  question: When a traffic signal changes to yellow or red while a pedestrian remains
    in the street, what must drivers do?
  choices:
    A: Honk their horn and proceed
    B: Swerve around the pedestrian
    C: Allow the pedestrian to complete the crossing safely
    D: Back up to give the pedestrian more room
  answer: C
  explanation: If a traffic signal changes to yellow or red while any pedestrian remains
    in the street, drivers must allow the pedestrian to complete the crossing safely.
- id: 157
  category: sharing_the_road
  question: How does the law give special consideration to a blind pedestrian at an
    intersection without traffic signals?
  choices:
    A: They have the right of way only if they are accompanied by another person
    B: They have the right of way when they extend a white cane or have a guide dog
    C: They must wait for a vehicle to stop and honk before crossing
    D: They are required to wear reflective clothing to have the right of way
  answer: B
  explanation: The law gives a blind pedestrian special consideration at an intersection
    where there are no traffic signals when the pedestrian extends a white cane, or
    a white cane with a red tip or has a guide dog.
- id: 158
  category: defensive_driving
  question: What does the law require drivers to do whenever a pedestrian may be affected
    by a turn, stop, or start from a parked position?
  choices:
    A: Flash their headlights
    B: Use the horn
    C: Roll down the window and shout
    D: Turn on their hazard lights
  answer: B
  explanation: The law requires drivers to use the horn whenever a pedestrian may
    be affected by a turn, stop or start from a parked position.
- id: 159
  category: safe_driving_rules
  question: What is the maximum speed limit for a school bus in North Carolina?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: The maximum speed limit for a school bus is 45 mph.
- id: 160
  category: sharing_the_road
  question: When a school bus stops for passengers on a two-lane roadway, who must
    stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching the bus from the opposite direction
    C: All traffic from both directions
    D: Vehicles traveling over 35 mph
  answer: C
  explanation: 'Two-lane roadway: When school bus stops for passengers, all traffic
    from both directions must stop.'
- id: 161
  category: safe_driving_rules
  question: How should the lap portion of an adult seat belt be worn?
  choices:
    A: Snugly across the stomach
    B: Under the abdomen and low across the hips
    C: Loosely across the thighs
    D: Over the ribcage
  answer: B
  explanation: The lap belt should be worn under the abdomen and low across the hips.
- id: 162
  category: sharing_the_road
  question: When a school bus stops for passengers on a four-lane roadway without
    a median separation, what must traffic do?
  choices:
    A: Only traffic following the bus must stop.
    B: All traffic from both directions must stop.
    C: Traffic in the opposite direction must slow down to 15 mph.
    D: Traffic in the adjacent lane must yield.
  answer: B
  explanation: According to the manual, on a four-lane roadway without a median separation,
    when a school bus stops for passengers, all traffic from both directions must
    stop.
- id: 163
  category: sharing_the_road
  question: On a roadway of four lanes or more with a center turning lane, which vehicles
    must stop when a school bus stops for passengers?
  choices:
    A: All traffic from both directions.
    B: Only traffic traveling in the opposite direction.
    C: Only traffic following the bus.
    D: No vehicles are required to stop if the bus is in the right lane.
  answer: C
  explanation: The manual states that on a roadway of four lanes or more with a center
    turning lane, only traffic following the bus must stop when a school bus stops
    for passengers.
- id: 164
  category: safe_driving_rules
  question: How far must you park from an emergency vehicle that has stopped to investigate
    an accident or give assistance?
  choices:
    A: At least 50 feet.
    B: At least 100 feet.
    C: At least 200 feet.
    D: At least 500 feet.
  answer: B
  explanation: 'The manual explicitly states: ''Do not park within 100 feet of an
    emergency vehicle that has stopped to investigate an accident or to give assistance.'''
- id: 165
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when driving or parking
    near fire trucks responding to a fire alarm?
  choices:
    A: 100 feet.
    B: 500 feet.
    C: One block.
    D: Two blocks.
  answer: C
  explanation: Drivers must 'not drive or park closer than one block from fire trucks
    responding to a fire alarm,' according to the driver's manual.
- id: 166
  category: sharing_the_road
  question: When are you NOT required to yield the right of way to an approaching
    emergency vehicle?
  choices:
    A: When traveling in the opposite direction on a two-lane roadway.
    B: When traveling in the opposite direction on a four-lane limited-access highway
      with a center median.
    C: When traveling in the same direction on a divided highway.
    D: When you are driving a commercial vehicle.
  answer: B
  explanation: The requirement to yield to an approaching emergency vehicle does not
    apply to vehicles traveling in the opposite direction on a four-lane limited-access
    highway with a center median.
- id: 167
  category: safe_driving_rules
  question: What must you do when approaching a parked emergency vehicle with activated
    warning lights on a highway with at least two lanes of traffic in your direction?
  choices:
    A: Stop completely until the emergency vehicle turns off its lights.
    B: Move into a lane that is not the nearest lane to the vehicle and continue until
      safely clear.
    C: Honk your horn to alert the emergency workers and maintain your speed.
    D: Pull over to the right-hand shoulder and wait for instructions.
  answer: B
  explanation: On a highway with at least two lanes in the same direction, you must
    move your vehicle into a lane that is not the lane nearest the parked emergency
    vehicle and continue until safely clear.
- id: 168
  category: safe_driving_rules
  question: If a law enforcement officer signals you to pull over but there is no
    obvious safe place to immediately stop, what should you do?
  choices:
    A: Speed up to reach the nearest exit quickly.
    B: Stop immediately in the travel lane.
    C: Turn on your 4-way flashers, reduce speed by about 10 mph, and continue to
      a safe area.
    D: Turn off your headlights and pull onto the grass.
  answer: C
  explanation: If there is no obvious safe place to stop, turn on your emergency 4-way
    flashers and reduce your speed by about 10 mph to signal the officer, then continue
    to the nearest safe area.
- id: 169
  category: defensive_driving
  question: What is the recommended action if you are being stopped by an unmarked
    car and have a legitimate concern about whether it is an actual law enforcement
    officer?
  choices:
    A: Refuse to pull over and drive home.
    B: Call 9-1-1 before pulling over to verify the officer.
    C: Pull over but refuse to roll down your window.
    D: Accelerate to the nearest police station.
  answer: B
  explanation: If an unmarked car is stopping you and you have a legitimate concern,
    you may call 9-1-1 before pulling over to verify that an actual law enforcement
    officer is conducting the stop.
- id: 170
  category: safe_driving_rules
  question: If you are stopped by a law enforcement officer at nighttime, what should
    you do to assist with visibility?
  choices:
    A: Turn on your high beam headlights.
    B: Turn on your interior lights as soon as you stop.
    C: Shine a flashlight out the window.
    D: Turn off all lights on the vehicle.
  answer: B
  explanation: If it is nighttime, you should turn on your interior lights as soon
    as you stop to help the officer see inside your vehicle.
- id: 171
  category: driver_responsibility
  question: If you have a concealed weapon permit and a weapon is in the vehicle during
    a traffic stop, what must you do?
  choices:
    A: Hide the weapon under the seat.
    B: Hand the weapon to the officer immediately.
    C: Inform the officer of that fact.
    D: Place the weapon in the glove box before the officer approaches.
  answer: C
  explanation: If you or your passenger(s) have a concealed weapon permit and a weapon
    is in the vehicle, you must inform the officer of that fact.
- id: 172
  category: penalties_and_points
  question: What does your acceptance and signature on a traffic ticket indicate?
  choices:
    A: It is an admission of guilt.
    B: It waives your right to a court hearing.
    C: It is not an admission of guilt.
    D: It means you agree with the officer's decision.
  answer: C
  explanation: The manual specifies that your acceptance and signature on a traffic
    ticket is not an admission of guilt.
- id: 173
  category: penalties_and_points
  question: 'According to North Carolina law, resisting, delaying, or obstructing
    a law enforcement officer during a traffic stop is classified as a:'
  choices:
    A: Class 1 felony.
    B: Class 2 misdemeanor.
    C: Traffic infraction.
    D: Warning offense.
  answer: B
  explanation: Resisting, delaying or obstructing a law enforcement officer during
    a traffic stop is a class 2 misdemeanor (N.C.G.S. §14-223).
- id: 174
  category: sharing_the_road
  question: Under what conditions do most crashes involving farm equipment occur?
  choices:
    A: During heavy rain or snow on unpaved roads.
    B: At night on poorly lit rural roads.
    C: On a clear day, during daylight hours, on a dry paved surface.
    D: During foggy mornings on gravel roads.
  answer: C
  explanation: Most crashes that involve farm equipment occur on a clear day, during
    daylight hours, and/or on a dry surface that is paved.
- id: 175
  category: sharing_the_road
  question: What are the typical types of crashes that occur with farm equipment?
  choices:
    A: Head-on collisions and rear-end crashes.
    B: Sideswipes and angle crashes.
    C: Rollovers and single-vehicle crashes.
    D: Backing crashes and parking lot collisions.
  answer: B
  explanation: Typical crashes with farm equipment include sideswipes and angle crashes,
    which often occur while the equipment is turning left.
- id: 176
  category: safe_driving_rules
  question: During a traffic stop, where should passengers in the back seat place
    their hands?
  choices:
    A: In their pockets.
    B: On the ceiling of the vehicle.
    C: On the back of the front seat.
    D: Out the window.
  answer: C
  explanation: During a traffic stop, passengers in the back seat should place their
    hands on the back of the front seat so they are clearly visible to the officer.
- id: 177
  category: sharing_the_road
  question: On which type of road is farm equipment legally prohibited from traveling
    in North Carolina?
  choices:
    A: Suburban roads
    B: Interstates
    C: Two-lane rural highways
    D: Unpaved public roads
  answer: B
  explanation: The manual states that farm equipment is legally entitled to travel
    on most roads in North Carolina, except interstates.
- id: 178
  category: vehicle_information
  question: What lighting is required for farm equipment operating on the road?
  choices:
    A: Two front white lights and two rear red lights visible for 1000 feet
    B: One front white light and a rear red light visible for up to 500 feet
    C: A flashing yellow beacon on the roof
    D: Only rear red reflectors are required at all times
  answer: B
  explanation: Farm equipment is required to have one front white light as well as
    a rear red light that is visible for up to 500 feet (or two red reflectors that
    are at least four inches in diameter).
- id: 179
  category: sharing_the_road
  question: What must every vehicle in a funeral procession have turned on?
  choices:
    A: High beam headlights only
    B: Headlights and hazard warning signals
    C: Interior dome lights
    D: Left turn signals
  answer: B
  explanation: Every vehicle in a funeral procession must have its headlights on,
    and the hazard warning signals must also be on, if so equipped.
- id: 180
  category: sharing_the_road
  question: When is it legal for a driver traveling in the same direction to pass
    a funeral procession?
  choices:
    A: When the procession is moving slower than 20 mph
    B: When the highway is marked for two or more lanes of moving traffic in the same
      direction
    C: When the driver sounds their horn before passing
    D: It is never legal to pass a funeral procession
  answer: B
  explanation: The driver of a vehicle traveling in the same direction shall not pass
    a funeral procession, except when the highway has been marked for two or more
    lanes of moving traffic in the same direction.
- id: 181
  category: safe_driving_rules
  question: If you are driving slower than the posted speed limit on a multi-lane
    highway, where should you drive?
  choices:
    A: In the extreme left lane
    B: In the center lane
    C: In the extreme right lane
    D: Straddling the right and center lanes
  answer: C
  explanation: When you are moving slower than the posted speed limit on a multi-lane
    highway, drive in the extreme right lane unless you are passing, turning left
    or avoiding an obstruction.
- id: 182
  category: safe_driving_rules
  question: Under ideal conditions, approximately how many feet does it take to completely
    stop a vehicle traveling at 55 miles per hour?
  choices:
    A: 100 feet
    B: 150 feet
    C: 211 feet
    D: 300 feet
  answer: C
  explanation: Even with ideal conditions, if you are traveling 55 miles per hour
    your vehicle requires approximately 211 feet to stop completely.
- id: 183
  category: safe_driving_rules
  question: What is the maximum speed limit in cities and towns unless otherwise posted?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Unless otherwise posted, the speed limit is 35 mph in cities and towns.
- id: 184
  category: defensive_driving
  question: What is the best practice for braking when approaching a curve?
  choices:
    A: Brake firmly while in the middle of the curve
    B: Slow down before entering the curve to avoid braking within it
    C: Accelerate into the curve and brake as you exit
    D: Pump the brakes continuously throughout the curve
  answer: B
  explanation: The best way to handle a curve is to slow down before you enter the
    curve so that you will not need to brake while you are in the curve.
- id: 185
  category: defensive_driving
  question: What should you do if you encounter a curve while traveling downhill?
  choices:
    A: Shift to a higher gear before moving downhill
    B: Shift to neutral to coast through the curve
    C: Shift to a lower gear before moving downhill
    D: Turn off the engine to save fuel
  answer: C
  explanation: If you encounter a curve while traveling downhill, you should shift
    to a lower gear before moving downhill and begin to brake earlier.
- id: 186
  category: safe_driving_rules
  question: What is the "two-second rule" used to determine?
  choices:
    A: The time you must wait at a stop sign
    B: A safe following distance between your vehicle and the one ahead
    C: The duration your turn signal must be on before changing lanes
    D: The maximum time you can look away from the road
  answer: B
  explanation: The "two-second rule" says that you should allow two seconds between
    the time the vehicle ahead of you passes a given point and the time your vehicle
    reaches the same point, ensuring a safe following distance.
- id: 187
  category: defensive_driving
  question: Why is it important to check over your shoulder before changing lanes?
  choices:
    A: To see if law enforcement is following you
    B: To ensure your rear-view mirror is adjusted properly
    C: To be certain the blind spot is clear
    D: To check the speed of the vehicle behind you
  answer: C
  explanation: Important rules about changing lanes include checking over your shoulder
    to be certain the blind spot is clear.
- id: 188
  category: safe_driving_rules
  question: According to the manual, what is the purpose of blowing your horn before
    passing another vehicle?
  choices:
    A: To warn oncoming traffic to move over
    B: To place the driver ahead under a legal obligation to help you pass
    C: To signal pedestrians to clear the roadway
    D: To indicate that you are traveling above the speed limit
  answer: B
  explanation: The manual states to blow the horn to signal the driver ahead, as the
    horn signal places the driver of the vehicle you are passing under a legal obligation
    to help you pass.
- id: 189
  category: safe_driving_rules
  question: When making a right turn, why should you stay close to the right edge
    of the road?
  choices:
    A: To allow faster vehicles to pass on your left
    B: To prevent another vehicle from moving between your vehicle and the curb
    C: To get a better view of oncoming traffic
    D: To avoid triggering traffic light sensors
  answer: B
  explanation: For right turns, stay close to the right edge of the road, so that
    another vehicle cannot move between your vehicle and the curb.
- id: 190
  category: safe_driving_rules
  question: What is the minimum distance you must maintain to the left of the vehicle
    you are passing?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 4 feet
  answer: B
  explanation: The law requires the passing driver to pass at least two feet to the
    left of the vehicle being passed.
- id: 191
  category: safe_driving_rules
  question: When is it illegal to pass another vehicle on a curve or hill?
  choices:
    A: When you cannot see at least 500 feet ahead
    B: When you cannot see at least 200 feet ahead
    C: When you cannot see at least 100 feet ahead
    D: When you cannot see at least 300 feet ahead
  answer: A
  explanation: Passing is always unsafe and usually illegal on any curve or hill where
    the driver cannot see at least 500 feet ahead.
- id: 192
  category: safe_driving_rules
  question: In which of the following situations is passing on the right permitted?
  choices:
    A: On a two-lane road with a solid yellow line
    B: When passing a vehicle that is in the left-turn lane
    C: At any intersection in a rural area
    D: When the vehicle ahead is driving too slowly
  answer: B
  explanation: Exceptions where passing on the right is allowed include when passing
    a vehicle that is in the left-turn lane.
- id: 193
  category: penalties_and_points
  question: What is the penalty for increasing your speed and failing to give way
    to a passing vehicle if it results in a crash causing bodily injury or property
    damage?
  choices:
    A: A written warning
    B: A felony charge
    C: A misdemeanor charge
    D: Immediate license revocation
  answer: C
  explanation: If you increase speed and fail to give way to a passing vehicle, you
    will be charged with a misdemeanor if a crash occurs resulting in bodily injury
    or property damage.
- id: 194
  category: safe_driving_rules
  question: What is the maximum speed you should travel when backing your vehicle?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: When backing your vehicle, you should back very slowly, not more than
    10 mph, because your vehicle is harder to control and to stop.
- id: 195
  category: safe_driving_rules
  question: What is the proper technique for maintaining a full view of what is behind
    your vehicle while backing?
  choices:
    A: Depend entirely on your rearview and side mirrors
    B: Steer with your right hand and look out the driver's side window
    C: Steer with your left hand and look over your right shoulder through the back
      window
    D: Ask a passenger to guide you while you look straight ahead
  answer: C
  explanation: To maintain a full view of what is behind the vehicle, steer with your
    left hand and look over your right shoulder through the back window; do not depend
    on mirrors alone.
- id: 196
  category: safe_driving_rules
  question: How far away from a fire hydrant must you park?
  choices:
    A: At least 10 feet
    B: At least 15 feet
    C: At least 20 feet
    D: At least 25 feet
  answer: B
  explanation: You should not park within 15 feet of a fire hydrant or entrance to
    a fire station.
- id: 197
  category: safe_driving_rules
  question: 'When parking on the shoulder of a highway, your parked vehicle must be
    visible to approaching drivers from both directions for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Parking on the shoulder is against the law unless the parked vehicle
    can be seen by approaching drivers from both directions for a distance of at least
    200 feet.
- id: 198
  category: defensive_driving
  question: Where do more than one-third of fatal traffic crashes involving motor
    vehicles occur?
  choices:
    A: On interstate highways
    B: At railroad crossings
    C: At intersections
    D: In parking lots
  answer: C
  explanation: Crashes occur most frequently at intersections, and more than one-third
    of fatal traffic crashes involving motor vehicles occur at intersections.
- id: 199
  category: safe_driving_rules
  question: If two vehicles reach an intersection without traffic signs or signals
    at the same time, who has the right of way?
  choices:
    A: The vehicle to the left
    B: The vehicle to the right
    C: The vehicle traveling faster
    D: The vehicle turning left
  answer: B
  explanation: In intersections without traffic signs or signals, when two or more
    vehicles reach an intersection at the same time, the vehicle to the right has
    the right of way.
- id: 200
  category: safe_driving_rules
  question: When two facing vehicles approach an intersection at the same time, and
    one driver wants to go straight while the other wants to turn left, who has the
    right of way?
  choices:
    A: The driver turning left
    B: The driver going straight ahead
    C: The driver who signals first
    D: Neither driver
  answer: B
  explanation: If one driver is going straight while the other wants to turn left,
    the driver who wants to turn must wait. Therefore, the driver who is traveling
    straight ahead has the right of way.
- id: 201
  category: safe_driving_rules
  question: What should you NEVER do while moving straight ahead through an intersection?
  choices:
    A: Change lanes
    B: Maintain a steady speed
    C: Look for pedestrians
    D: Keep your hands on the steering wheel
  answer: A
  explanation: 'The manual explicitly states: ''Never change lanes while you are moving
    straight ahead through an intersection.'''
- id: 202
  category: safe_driving_rules
  question: In which direction do all vehicles in a traffic circle or roundabout travel?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: Straight across
    D: In a figure-eight pattern
  answer: B
  explanation: All vehicles in a traffic circle travel to the right around the circle
    in a counterclockwise direction.
- id: 203
  category: safe_driving_rules
  question: Who has the right of way in a roundabout or traffic circle?
  choices:
    A: Vehicles entering the roundabout
    B: Vehicles already in the roundabout
    C: Vehicles exiting the roundabout
    D: Vehicles traveling at higher speeds
  answer: B
  explanation: Vehicles already in the circle have the right of way, and drivers entering
    must yield to any vehicles or bicyclists already in the roundabout.
- id: 204
  category: safe_driving_rules
  question: What is the typical required travel speed in a modern roundabout?
  choices:
    A: 5-10 mph
    B: 15-20 mph
    C: 25-30 mph
    D: 35-40 mph
  answer: B
  explanation: The modern roundabout is much smaller than older traffic circles and
    requires vehicles to travel at lower speeds (15–20 mph), making them safer.
- id: 205
  category: sharing_the_road
  question: Who has the right-of-way at a roundabout?
  choices:
    A: Approaching vehicles entering the roundabout
    B: Vehicles and bicyclists already in the roundabout
    C: Pedestrians walking through the middle of the roundabout
    D: Vehicles entering from the right side
  answer: B
  explanation: The manual states that drivers yield to any vehicles or bicyclists
    already in the roundabout, and those already in it do not yield to approaching
    vehicles.
- id: 206
  category: safe_driving_rules
  question: Which lane should you use to make a left turn or U-turn in a multi-lane
    roundabout?
  choices:
    A: The right lane
    B: The center lane
    C: The left lane
    D: The truck apron
  answer: C
  explanation: In a multi-lane roundabout, you stay in the left lane to go straight
    through the roundabout or make a left turn or U-turn.
- id: 207
  category: defensive_driving
  question: What should you do if you are already inside a roundabout and an emergency
    vehicle with flashing lights and sirens approaches?
  choices:
    A: Stop immediately inside the roundabout to let them pass
    B: Pull over to the inside island of the roundabout
    C: Speed up and complete your turn before exiting
    D: Exit the roundabout first, then pull over
  answer: D
  explanation: If drivers are already in the roundabout when an emergency vehicle
    approaches, they must exit first, then pull over to let the emergency vehicle
    pass.
- id: 208
  category: safe_driving_rules
  question: When required to stop at a railroad crossing, what is the required stopping
    distance from the nearest rail?
  choices:
    A: Within 25 feet, but not less than 10 feet
    B: Within 50 feet, but not less than 15 feet
    C: Within 100 feet, but not less than 25 feet
    D: Exactly 15 feet
  answer: B
  explanation: The driver of the vehicle shall stop within 50 feet, but not less than
    15 feet from the nearest rail of the railroad and shall not proceed until he/she
    can do so safely.
- id: 209
  category: sharing_the_road
  question: Which of the following vehicles does a train have to yield the right-of-way
    to?
  choices:
    A: Police vehicles with sirens on
    B: Ambulances responding to an emergency
    C: Fire trucks with flashing lights
    D: None of the above; trains always have the right-of-way
  answer: D
  explanation: Trains have the right-of-way over all highway traffic including police,
    fire and ambulance emergency vehicles.
- id: 210
  category: defensive_driving
  question: Approximately how long does it take a train traveling at 55 mph to come
    to a complete stop?
  choices:
    A: Less than half a mile
    B: About 1500 feet
    C: More than a mile
    D: Exactly 500 feet
  answer: C
  explanation: A train that is traveling at 55 mph takes more than a mile to come
    to a stop.
- id: 211
  category: safe_driving_rules
  question: What should you do if you are crossing railroad tracks and the warning
    lights begin flashing or the gates start to come down?
  choices:
    A: Stop immediately and back up
    B: Keep moving to finish driving through the crossing
    C: Stop and abandon your vehicle
    D: Put your vehicle in reverse and carefully back out
  answer: B
  explanation: If you happen to be crossing the tracks and the warning lights begin
    flashing or gates start to come down, do not stop, do not backup, KEEP MOVING.
    The warning signals allow enough time to finish crossing.
- id: 212
  category: defensive_driving
  question: What should you do if the railroad crossing gate on the far side of the
    tracks comes down before you get across?
  choices:
    A: Stop on the tracks and wait for the train
    B: Put your vehicle in reverse to avoid the gate
    C: Drive through the gate because it is flexible
    D: Exit your vehicle and manually lift the gate
  answer: C
  explanation: Railroad crossing gates cannot trap you or your vehicle; drive through
    the gate. It is flexible and will not block you in.
- id: 213
  category: signs_and_signals
  question: What information is found on the Emergency Notification System (ENS) 'Blue
    Sign' at a railroad crossing?
  choices:
    A: The train schedule and speed limit
    B: The crossing identification number, railroad company name, and emergency phone
      number
    C: The distance to the next highway exit
    D: The local police department's non-emergency number
  answer: B
  explanation: The ENS sign, known as the 'Blue sign,' contains the railroad crossing
    identification number, name of the railroad company and an emergency telephone
    number to report emergencies.
- id: 214
  category: defensive_driving
  question: What is the first thing you should do if your vehicle stalls on or near
    the railroad tracks?
  choices:
    A: Try to restart the engine for at least one minute
    B: Call a tow truck while sitting in the vehicle
    C: Get out immediately and move away from the tracks
    D: Honk your horn to warn the approaching train
  answer: C
  explanation: If your vehicle stalls on or near the tracks GET OUT IMMEDIATELY. Move
    away from your vehicle and the tracks.
- id: 215
  category: sharing_the_road
  question: How should a bicyclist navigate a multi-lane roundabout?
  choices:
    A: Ride along the shoulder of the roundabout
    B: Pick the appropriate lane and stay in the middle of it
    C: Always use the truck apron
    D: Dismount and walk the bicycle through the center island
  answer: B
  explanation: Bicyclists should pick the appropriate lane before entering a multi-lane
    roundabout and stay in the middle of their chosen lane. They should not ride along
    the shoulder.
- id: 216
  category: safe_driving_rules
  question: Why should you not proceed to move immediately after a train has passed
    a crossing?
  choices:
    A: You must wait for a police officer to wave you through
    B: The crossing gates need time to reset their sensors
    C: There may be another train moving in the opposite direction or following the
      first train
    D: You must wait exactly three minutes before crossing
  answer: C
  explanation: Do not proceed to move immediately after the train has passed — there
    may be another train moving in the opposite direction from or following the first
    train.
- id: 217
  category: sharing_the_road
  question: What is the purpose of the concrete island, or truck apron, in a roundabout?
  choices:
    A: It is a designated parking area for emergency vehicles
    B: It is a safe zone for pedestrians to cross
    C: It helps big trucks maneuver around the roundabout
    D: It is a lane specifically for bicyclists
  answer: C
  explanation: Big trucks should use the concrete island — called the truck apron
    — to help drivers maneuver around the roundabout.
- id: 218
  category: defensive_driving
  question: Which of the following vehicles are required to stop at railroad crossings,
    meaning you should be prepared to stop behind them?
  choices:
    A: Motorcycles and bicycles
    B: School buses and vehicles transporting hazardous materials
    C: Delivery vans and pickup trucks
    D: Emergency vehicles with sirens off
  answer: B
  explanation: Be prepared to stop for vehicles that must stop at crossings, such
    as school buses, motor vehicles carrying passengers, for-hire vehicles or vehicles
    transporting explosives or hazardous materials.
- id: 219
  category: safe_driving_rules
  question: Where should pedestrians walk when navigating a roundabout?
  choices:
    A: Through the middle of the roundabout
    B: Along the truck apron
    C: In the marked crosswalks along the outside of the roundabout
    D: In the left lane of the roundabout
  answer: C
  explanation: Pedestrians should use marked crosswalks along the outside of the roundabout,
    and not walk through the middle of it.
- id: 220
  category: sharing_the_road
  question: Why should you pay special attention to bicyclists when approaching and
    moving through an intersection?
  choices:
    A: They are required to yield to all motor vehicles.
    B: They are required to use the sidewalk at intersections.
    C: A crash can occur between a bicyclist moving straight and a motorist turning
      right.
    D: They travel faster than motor vehicles through intersections.
  answer: C
  explanation: Because bicyclists ride to the right of motor vehicle traffic, the
    potential exists for a crash between the bicyclist who is moving straight ahead
    through the intersection and the motorist who is turning right.
- id: 221
  category: safe_driving_rules
  question: If you intend to make a turn in a city and find that you are not in the
    proper lane, what should you do?
  choices:
    A: Stop and wait for traffic to clear before changing lanes.
    B: Continue to the next intersection and turn there.
    C: Quickly change lanes if you use your turn signal.
    D: Back up to the previous intersection.
  answer: B
  explanation: The manual states that if you intend to make a turn and find that you
    are not in the proper lane, you should continue to the next intersection and turn
    there.
- id: 222
  category: defensive_driving
  question: How can you tell if you are driving in another driver's blind spot?
  choices:
    A: You are driving in the center lane.
    B: You cannot see the inside rear-view mirror of the car ahead.
    C: The vehicle ahead is a large commercial truck.
    D: You are following closer than two seconds.
  answer: B
  explanation: Avoid driving side-by-side, especially in another driver's blind spot.
    If you cannot see the inside rear-view mirror of the car ahead, you are probably
    in the driver's blind spot.
- id: 223
  category: safe_driving_rules
  question: When driving on a one-way street, which lanes should you use for through-travel?
  choices:
    A: The rightmost lane.
    B: The leftmost lane.
    C: The center lane(s).
    D: The outside lanes.
  answer: C
  explanation: On a one-way street, use the center lane(s) for through-travel and
    the outside lanes for turning.
- id: 224
  category: defensive_driving
  question: Why is driving on rural roads often considered more dangerous than driving
    in heavy city traffic?
  choices:
    A: There are more stop signs and traffic signals.
    B: The roads may not be as wide and lighting is often not as good.
    C: There is a higher volume of commercial truck traffic.
    D: The speed limit is generally lower.
  answer: B
  explanation: Driving on rural roads is often more dangerous because the road may
    not be as wide, the lighting is often not as good, and/or the travel speeds may
    be higher.
- id: 225
  category: safe_driving_rules
  question: What is the proper procedure for entering an interstate highway?
  choices:
    A: Stop at the end of the ramp and wait for a gap in traffic.
    B: Use the acceleration lane until your speed matches other traffic, then merge
      safely.
    C: Merge directly into the left lane to avoid slow traffic.
    D: Yield to traffic on the interstate by slowing down in the acceleration lane.
  answer: B
  explanation: When entering the interstate, use the acceleration lane until your
    vehicle's speed matches that of the other traffic and then merge safely.
- id: 226
  category: defensive_driving
  question: If a vehicle breakdown forces you to stop on the interstate, what should
    you do to signal for help?
  choices:
    A: Stand in the travel lane and wave your arms.
    B: Tie a white cloth on the radio aerial or left-door handle and raise the hood.
    C: Place a red flag on the rear bumper.
    D: Honk your horn continuously until help arrives.
  answer: B
  explanation: If a vehicle breakdown forces you to stop, move far off the road. Tie
    a white cloth on the radio aerial or left-door handle and raise the hood.
- id: 227
  category: safe_driving_rules
  question: 'When leaving an interstate highway, you should:'
  choices:
    A: Slow down in the travel lane before entering the deceleration lane.
    B: Signal your turn well in advance and enter the deceleration lane without slowing
      down first.
    C: Brake hard as soon as you enter the deceleration lane.
    D: Wait until you are in the deceleration lane to use your turn signal.
  answer: B
  explanation: When leaving the highway, signal your turn well in advance, and without
    slowing down, enter the deceleration lane. Proceed at the posted exit speed limit.
- id: 228
  category: safe_driving_rules
  question: What should you do if you miss your intended exit on an interstate highway?
  choices:
    A: Proceed to the next exit and leave the highway there.
    B: Slow down and carefully back up on the shoulder.
    C: Make a U-turn through the median.
    D: Stop in the travel lane and wait for traffic to clear before backing up.
  answer: A
  explanation: If you miss an exit, do not slow down, back up or try to turn around.
    Proceed to the next exit and leave the highway there instead.
- id: 229
  category: vehicle_information
  question: When you engage the high-beam headlights at night, you should be able
    to see a person who is how far away?
  choices:
    A: 75 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: When you engage the high-beam headlights at night, you should be able
    to see a person who is 200 feet away.
- id: 230
  category: vehicle_information
  question: 'According to North Carolina law, taillights must be red in color and
    visible for at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: D
  explanation: Taillights must be red in color and visible for at least 500 feet.
- id: 231
  category: vehicle_information
  question: How should you adjust your vehicle's side mirrors before beginning to
    drive?
  choices:
    A: To show the scene directly behind the vehicle.
    B: To show the scene to the left and right rear, barely reflecting the side of
      the vehicle.
    C: To completely eliminate all blind spots.
    D: To show the front tires of the vehicle.
  answer: B
  explanation: Adjust the side mirrors to show the scene to the left and right rear
    of the vehicle. The mirrors should barely reflect the side of the vehicle.
- id: 232
  category: vehicle_information
  question: What does it indicate if your brake pedal gradually lowers under the pressure
    of your foot?
  choices:
    A: The anti-lock braking system is engaging.
    B: The brake pads are brand new.
    C: The hydraulic system must be checked.
    D: The tires are underinflated.
  answer: C
  explanation: If the pedal gradually lowers under the pressure of your foot, the
    hydraulic system must be checked.
- id: 233
  category: vehicle_information
  question: What is the correct way to use an Anti-lock Braking System (ABS) when
    stopping?
  choices:
    A: Pump the brake pedal rapidly.
    B: Brake hard and keep firm and steady pressure on the brake pedal.
    C: Lightly tap the brake pedal multiple times.
    D: Release pressure on the brake pedal if you feel it vibrating.
  answer: B
  explanation: With ABS, it is important to brake hard and keep firm and steady pressure
    on the brake pedal while stopping. Pumping the brake pedal or releasing the steady
    pressure will reduce the effectiveness of the ABS.
- id: 234
  category: vehicle_information
  question: What is the minimum allowable tread depth for tires to be considered safe
    in North Carolina?
  choices:
    A: 1/32-inch
    B: 1/16-inch
    C: 1/8-inch
    D: 1/4-inch
  answer: B
  explanation: According to the manual, tires are considered unsafe if they have less
    than 1/16-inch-tread depth.
- id: 235
  category: vehicle_information
  question: What is a negative consequence of driving with over-inflated tires?
  choices:
    A: They wear out more quickly on the outer edges.
    B: They increase the likelihood of a blowout.
    C: They reduce traction and wear heavily on the middle of the tread.
    D: They improve fuel economy by 10%.
  answer: C
  explanation: The manual states that over-inflated tires reduce traction and wear
    heavily on the middle of the tread.
- id: 236
  category: safe_driving_rules
  question: To help prevent carbon monoxide poisoning from a potential exhaust leak,
    what does the manual suggest?
  choices:
    A: Keep the air conditioning on high at all times.
    B: Keep a window open about one inch while traveling.
    C: Replace the muffler every 10,000 miles.
    D: Drive with the hazard lights on.
  answer: B
  explanation: Because a leak in the exhaust system can allow poisonous carbon monoxide
    gas to enter the vehicle, it is suggested that you keep a window open about one
    inch while traveling.
- id: 237
  category: vehicle_information
  question: Which of the following is a sign that your vehicle may have a problem
    with its suspension system?
  choices:
    A: The vehicle sways freely, leans heavily to one side during a turn, or bounces
      continuously.
    B: The engine stalls when idling for more than a couple of minutes.
    C: The steering wheel vibrates when traveling over 60 mph.
    D: The exhaust system releases excessive smoke and noise.
  answer: A
  explanation: If a vehicle sways freely, leans heavily to one side during a turn
    or seems to bounce continuously, there may be a problem with the suspension system.
- id: 238
  category: safe_driving_rules
  question: 'According to the ''Drive Green'' section, abrupt starts and hard stops
    can increase fuel consumption by up to:'
  choices:
    A: 10%
    B: 20%
    C: 30%
    D: 40%
  answer: D
  explanation: Driving green means adopting simple habits; the manual notes that abrupt
    starts and hard stops can increase fuel consumption by 40%.
- id: 239
  category: safe_driving_rules
  question: 'Every five miles per hour you drive over 60 mph can cost you up to an
    additional:'
  choices:
    A: 10 cents a gallon
    B: 15 cents a gallon
    C: 30 cents a gallon
    D: 50 cents a gallon
  answer: C
  explanation: The manual states that every five miles over 60 mph can cost you up
    to an additional 30 cents a gallon.
- id: 240
  category: defensive_driving
  question: How far ahead should a good driver try to scan on the roadway?
  choices:
    A: 3 to 5 seconds ahead
    B: 5 to 10 seconds ahead
    C: 10 to 15 seconds ahead
    D: 20 to 30 seconds ahead
  answer: C
  explanation: Good drivers try to see 10 to 15 seconds ahead on the roadway (about
    one city block) to avoid last minute moves.
- id: 241
  category: defensive_driving
  question: About how often should you check your mirrors to see if a vehicle is following
    too closely?
  choices:
    A: Every 5 seconds
    B: Every 10 seconds
    C: Every 30 seconds
    D: Every 60 seconds
  answer: B
  explanation: The manual advises checking the mirrors about every 10 seconds to see
    if any vehicle is following too closely.
- id: 242
  category: defensive_driving
  question: What is the proper way to check your blind spots before making a lane
    change?
  choices:
    A: Rely entirely on your rearview mirror.
    B: Quickly turn your head and look over your shoulder.
    C: Flash your headlights and wait for a response.
    D: Honk your horn to warn vehicles in your blind spot.
  answer: B
  explanation: Because mirrors leave blind spots, before you make any lane changes
    or turns, you should quickly turn your head and look over your shoulder to see
    what is in the blind spot.
- id: 243
  category: safe_driving_rules
  question: 'If the speed limit is 45 mph or more, you must signal your turn at least:'
  choices:
    A: 50 feet before turning
    B: 100 feet before turning
    C: 200 feet before turning
    D: 500 feet before turning
  answer: C
  explanation: Normally you signal at least the last 100 feet before turning, but
    if the speed limit is 45 mph or more, you must signal at least the last 200 feet
    before turning.
- id: 244
  category: signs_and_signals
  question: What is the correct hand signal for a right turn?
  choices:
    A: Hold the left arm and hand straight out and point the first finger.
    B: Hold the left arm straight out and the forearm and hand straight up, palm facing
      forward.
    C: Point the left arm and hand down, palm facing back.
    D: Wave the left hand in a circular motion.
  answer: B
  explanation: To signal a right turn using hand signals, hold the left arm straight
    out and the forearm and hand straight up, palm facing forward.
- id: 245
  category: signs_and_signals
  question: How do you use a hand signal to indicate that you are stopping or slowing
    down?
  choices:
    A: Point the left arm and hand down, palm facing back.
    B: Hold the left arm straight out and point the first finger.
    C: Hold the left arm straight out and the forearm straight up.
    D: Flash your brake lights three times.
  answer: A
  explanation: To signal stopping and slowing down, point the left arm and hand down,
    palm facing back.
- id: 246
  category: defensive_driving
  question: If you are faced with approaching vehicles to your left and a child on
    a bicycle to your right, how should you adjust your vehicle?
  choices:
    A: Give equal room to both hazards.
    B: Move closer to the child on the bicycle to avoid the vehicles.
    C: Sound your horn continuously until the hazards clear.
    D: Give the child more room, even if it means moving closer to the oncoming vehicles.
  answer: D
  explanation: When dealing with two or more unavoidable dangers, give the most room
    to the greatest or most likely danger. The child is most likely to make a sudden
    move, so give the child more room, even if it means moving closer to oncoming
    vehicles.
- id: 247
  category: signs_and_signals
  question: What color are the warning signs used strictly to identify highway work
    zones?
  choices:
    A: Yellow signs with black letters
    B: Orange signs with black letters
    C: White signs with black letters
    D: Red signs with white letters
  answer: B
  explanation: A highway work zone can be easily identified by unique orange warning
    signs with messages in black letters, which are reserved strictly to identify
    work zones.
- id: 248
  category: vehicle_information
  question: How far away must your vehicle's horn be loud enough to be heard?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: C
  explanation: Every licensed motor vehicle must be equipped with a horn that is loud
    enough to be heard for at least 200 feet.
- id: 249
  category: safe_driving_rules
  question: What is a major cause of rear-end crashes in work zones?
  choices:
    A: Driving faster than the posted speed limit
    B: Driving slower than the surrounding traffic
    C: Failing to use turn signals when shifting lanes
    D: Using high-beam headlights
  answer: B
  explanation: According to the manual, driving slower than the surrounding traffic
    is a major cause of rear-end crashes in work zones.
- id: 250
  category: safe_driving_rules
  question: Under North Carolina law, when are you required to use your headlights?
  choices:
    A: From sunset to sunrise and when visibility is 400 feet or less
    B: From dusk to dawn and when visibility is 500 feet or less
    C: Only when driving on unlit rural roads at night
    D: From 8 PM to 6 AM regardless of weather conditions
  answer: A
  explanation: The law requires use of headlights from sunset to sunrise and when
    visibility is 400 feet or less.
- id: 251
  category: defensive_driving
  question: What should you do if an approaching vehicle does not dim its headlights
    at night?
  choices:
    A: Turn on your high beams and leave them on until they pass
    B: Look directly at the oncoming headlights to gauge their distance
    C: Blink your high beams once, and look slightly to the right if they still do
      not dim them
    D: Pull off the road immediately and turn off all your lights
  answer: C
  explanation: The manual advises that you can remind the driver by blinking your
    high beams once. If they still do not dim the lights, keep yours on low beam and
    look slightly to the right so you will not be looking directly into the headlights.
- id: 252
  category: safe_driving_rules
  question: How much does stopping distance increase on slippery pavement compared
    to dry pavement?
  choices:
    A: It remains the same if you have anti-lock brakes
    B: It increases from two to 10 times farther
    C: It increases by exactly 50 percent
    D: It increases from 15 to 20 times farther
  answer: B
  explanation: Stopping distances on slippery pavement increases from two to 10 times
    farther than on dry pavement.
- id: 253
  category: defensive_driving
  question: Why are roads considered more dangerous for the first 10 to 15 minutes
    after rain has begun to fall?
  choices:
    A: The rain washes away the reflective paint on lane markings
    B: Rain combines with oil, dirt, dust, and rubber to create a slick surface
    C: Drivers tend to speed up to reach their destinations before the storm worsens
    D: The water immediately causes severe hydroplaning at any speed
  answer: B
  explanation: For the first 10 to 15 minutes, rain combines with oil from asphalt
    and vehicles, and with dirt, dust and rubber to create a slick surface.
- id: 254
  category: safe_driving_rules
  question: At what speed can hydroplaning begin?
  choices:
    A: As low as 15 miles per hour
    B: As low as 30 miles per hour
    C: As low as 45 miles per hour
    D: As low as 55 miles per hour
  answer: B
  explanation: Hydroplaning can start at speeds as low as 30 miles per hour and in
    water little more than 1/8 inch deep.
- id: 255
  category: defensive_driving
  question: What is the recommended action if your vehicle begins to hydroplane?
  choices:
    A: Slam on the brakes immediately to regain traction
    B: Jerk the steering wheel sharply to the right
    C: Take your foot off the gas pedal and resist your instinct to use the brakes
    D: Turn on your cruise control to maintain a steady speed
  answer: C
  explanation: If you do begin to hydroplane, take your foot off the gas pedal. Resist
    your instinct to use the brakes. Keep your steering wheel straight and let the
    car's momentum decrease.
- id: 256
  category: vehicle_information
  question: Which tire condition increases your chance of hydroplaning?
  choices:
    A: Tires with deep, open treads
    B: Tires inflated to the high side of the manufacturer's specifications
    C: Tires with worn tread that are under-inflated
    D: Snow tires used during the summer
  answer: C
  explanation: Tires with worn tread and those that are under inflated have less grip
    on the road surface, increasing your chance of hydroplaning.
- id: 257
  category: safe_driving_rules
  question: According to the manual, how much fast-moving water does it take to sweep
    a car off the highway?
  choices:
    A: 2 inches
    B: 6 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: There have been reports that six inches of fast moving water can sweep
    a car off the highway and 12 inches of fast moving water can float a car or cause
    it to turn over.
- id: 258
  category: safe_driving_rules
  question: What must North Carolina motorists do whenever they are using windshield
    wipers due to inclement weather?
  choices:
    A: Turn on their emergency flashers
    B: Drive at least 15 mph below the posted speed limit
    C: Turn on their headlights
    D: Drive only in the right-hand lane
  answer: C
  explanation: All North Carolina motorists are required to use headlights whenever
    they are using windshield wipers due to inclement weather.
- id: 259
  category: defensive_driving
  question: Which headlights should you use when driving in fog?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: 'If you must drive during fog: Turn on the low beam headlights.'
- id: 260
  category: defensive_driving
  question: What should you do if you have extreme trouble seeing while driving in
    fog?
  choices:
    A: Stop in the middle of your lane and wait for the fog to clear
    B: Turn on your high beams and speed up to exit the fog bank quickly
    C: Pull far off the roadway, stop, secure the vehicle, and turn on emergency flashers
    D: Roll down your windows and honk your horn continuously while driving
  answer: C
  explanation: 'If you have extreme trouble seeing, you need to: Pull far off the
    roadway; Stop, secure the vehicle and turn on its emergency flashers; and Leave
    the vehicle from the passenger side and stay away from the road.'
- id: 261
  category: safe_driving_rules
  question: Which areas of the road are often the first to freeze as the temperature
    drops?
  choices:
    A: Intersections and crosswalks
    B: Shady spots, bridges, and overpasses
    C: Highways with heavy traffic
    D: Tunnels and underpasses
  answer: B
  explanation: As you drive, watch for shady spots, bridges and overpasses since these
    places are often the first to freeze as the temperature drops.
- id: 262
  category: defensive_driving
  question: How much should you increase your stopping distance when slowing down
    on snowy or icy roads?
  choices:
    A: Allow at least two times the normal stopping distance
    B: Allow at least three times the normal stopping distance
    C: Allow at least five times the normal stopping distance
    D: Allow at least ten times the normal stopping distance
  answer: B
  explanation: 'When you are starting or stopping on snowy or icy roads: Allow at
    least three times the normal stopping distance to slow down.'
- id: 263
  category: safe_driving_rules
  question: When driving on ice and packed snow, how much stopping distance should
    you allow?
  choices:
    A: Twice the normal stopping distance
    B: At least three times the normal stopping distance
    C: Four times the normal stopping distance
    D: The same as normal stopping distance
  answer: B
  explanation: The manual states that when driving on ice and packed snow, you should
    allow at least three times the normal stopping distance to slow down.
- id: 264
  category: defensive_driving
  question: At what times of day are wildlife most active and likely to be on the
    road?
  choices:
    A: Mid-morning and early afternoon
    B: Only during the darkest hours of the night
    C: Dawn, dusk, and the first few hours after dark
    D: High noon and late afternoon
  answer: C
  explanation: According to the manual, wildlife can appear anywhere, anytime; however,
    they are most active at dawn, dusk, and in the first few hours after dark.
- id: 265
  category: defensive_driving
  question: Why should you be cautious about using high beams when animals are directly
    ahead?
  choices:
    A: High beams can confuse or 'freeze' some animals.
    B: High beams will cause the animal to charge the vehicle.
    C: High beams make it harder for the driver to see eye shine.
    D: High beams will permanently blind the animal.
  answer: A
  explanation: The manual advises to only use high beams when there is no oncoming
    traffic and no animals directly ahead, because high beams can confuse or 'freeze'
    some animals, causing the 'deer in headlights' behavior.
- id: 266
  category: safe_driving_rules
  question: If you hit an animal and pull off to the side of the road, what should
    you do next?
  choices:
    A: Approach the animal to check its injuries.
    B: Stay in your car, lock your doors, and turn on hazard lights.
    C: Drag the animal off the roadway immediately.
    D: Exit the vehicle and wave down other drivers for help.
  answer: B
  explanation: If you hit an animal, the manual instructs you to pull off to the side
    of the road safely, stay in your car, lock your doors, and turn on hazard lights.
    You should not approach the animal as it may be dangerous.
- id: 267
  category: vehicle_information
  question: If your vehicle is equipped with an automatic transmission and your brakes
    fail, what should you do?
  choices:
    A: Shift into park and turn off the engine.
    B: Pump the gas pedal to build brake fluid pressure.
    C: Apply the emergency brake and move the gear control lever into the low-range
      position.
    D: Shift into neutral and coast until the vehicle stops.
  answer: C
  explanation: In the event of brake failure in a vehicle with an automatic transmission,
    you should apply the emergency brake and move the gear control lever into the
    low-range position.
- id: 268
  category: vehicle_information
  question: How can you help dry wet brakes?
  choices:
    A: Drive at a high speed for several miles.
    B: Drive a short distance and apply light pressure to the brake pedal.
    C: Pump the brake pedal rapidly while in neutral.
    D: Pull over and let the brakes air dry for an hour.
  answer: B
  explanation: You can help dry wet brakes by driving a short distance and applying
    light pressure to the brake pedal. The friction generates heat that evaporates
    the water.
- id: 269
  category: safe_driving_rules
  question: 'To prevent excessive wear on your brakes when moving down a long hill
    or steep grade, you should:'
  choices:
    A: Ride the brake pedal the entire way down.
    B: Shift into neutral and coast down the hill.
    C: Turn off the engine to reduce speed.
    D: Shift to a lower gear at the top of the hill before you descend.
  answer: D
  explanation: To prevent excessive wear on brakes when moving down a long hill or
    steep grade, use a lower gear instead of the brake pedal to control speed. It
    is best to shift to the lower gear at the top of the hill before descending.
- id: 270
  category: defensive_driving
  question: What is one of the steps you should take if your gas pedal sticks?
  choices:
    A: Shift to neutral and apply firm pressure to the brakes without locking the
      wheels.
    B: Turn off the ignition immediately and remove the key.
    C: Shift into reverse to counteract the forward motion.
    D: Slam on the brakes as hard as possible to lock the wheels.
  answer: A
  explanation: If your gas pedal sticks, the manual recommends shifting to neutral
    and applying firm pressure to the brakes without locking the wheels, as well as
    tapping the pedal or finding a safe place to pull off.
- id: 271
  category: defensive_driving
  question: If a tire blowout occurs while driving, what should you do first?
  choices:
    A: Immediately apply the brakes hard to stop quickly.
    B: Hold the steering wheel tightly and try to keep the vehicle straight.
    C: Turn the steering wheel sharply toward the shoulder.
    D: Accelerate slightly to maintain control of the vehicle.
  answer: B
  explanation: If a blowout occurs, you should hold the steering wheel tightly and
    try to keep the vehicle straight on your side of the road, and reduce speed by
    lifting your foot from the accelerator without immediately applying the brakes.
- id: 272
  category: safe_driving_rules
  question: If your vehicle breaks down and you need help, how should you signal other
    drivers?
  choices:
    A: Stand in the middle of the road and wave your arms.
    B: Tie a white cloth to the left door handle or radio aerial and raise the hood.
    C: Flash your high beams continuously.
    D: Place a red flag on the rear bumper and stand behind the vehicle.
  answer: B
  explanation: If your vehicle breaks down and you need help, the manual states you
    should tie a white cloth to the left door handle or the radio aerial and raise
    the hood of the vehicle.
- id: 273
  category: defensive_driving
  question: 'If an approaching vehicle crosses the center line into the path of your
    vehicle, you should:'
  choices:
    A: Steer into the left lane to avoid them.
    B: Speed up to get past them quickly.
    C: Reduce speed immediately, sound your horn, and keep to the right.
    D: Stop immediately in your lane and flash your headlights.
  answer: C
  explanation: If an approaching vehicle crosses the center line into your path, you
    should reduce speed immediately, sound your horn, and keep to the right even if
    this means running off the road.
- id: 274
  category: defensive_driving
  question: What should you do if your vehicle runs off the pavement and onto the
    shoulder?
  choices:
    A: Immediately apply the brakes and jerk the steering wheel back toward the road.
    B: Slowly remove your foot from the accelerator and steer straight ahead.
    C: Accelerate to get back onto the pavement quickly.
    D: Shift into neutral and coast until you stop.
  answer: B
  explanation: If your vehicle runs off the pavement, you should not immediately apply
    the brakes or try to turn back. Instead, slowly remove your foot from the accelerator
    and steer straight ahead.
- id: 275
  category: defensive_driving
  question: If you find yourself in a skid, in which direction should you turn the
    steering wheel?
  choices:
    A: In the opposite direction the rear of the vehicle is skidding.
    B: Keep the steering wheel perfectly straight.
    C: In the direction the rear of the vehicle is skidding.
    D: Toward the right shoulder of the road regardless of the skid direction.
  answer: C
  explanation: If you find yourself in a skid, you should ease your foot off the accelerator
    and turn the steering wheel in the direction the rear of the vehicle is skidding.
- id: 276
  category: defensive_driving
  question: 'If you are about to be hit from the rear and there are no vehicles in
    front of you, you should:'
  choices:
    A: Press the accelerator and move away as quickly as possible.
    B: Slam on your brakes to brace for the impact.
    C: Shift into reverse and back up.
    D: Turn off your engine and release the seatbelt.
  answer: A
  explanation: If you are about to be hit from the rear and there are no vehicles
    in front of you, the manual advises to press the accelerator and move away as
    quickly as possible.
- id: 277
  category: driver_responsibility
  question: How does the law protect individuals who stop and render aid at the scene
    of an accident?
  choices:
    A: It guarantees them financial compensation for their time.
    B: It protects them from civil liability except for intentional wrongdoing or
      unruly conduct.
    C: It grants them immunity from all future traffic violations.
    D: It requires the at-fault driver's insurance to pay them a reward.
  answer: B
  explanation: The law protects persons who stop and render aid at the scene of an
    accident from civil liability except for intentional wrongdoing or unruly conduct.
- id: 278
  category: defensive_driving
  question: What should you do if you find yourself in a skid?
  choices:
    A: Brake firmly and hold the steering wheel straight.
    B: Turn the steering wheel in the opposite direction the rear is skidding.
    C: Turn the steering wheel in the direction the rear of the vehicle is skidding.
    D: Accelerate quickly to regain traction.
  answer: C
  explanation: If you find yourself in a skid, you should ease your foot off the accelerator
    and turn the steering wheel in the direction the rear of the vehicle is skidding.
- id: 279
  category: safe_driving_rules
  question: If you are involved in a crash on a main lane with no injuries or fatalities,
    what should you do with your vehicle?
  choices:
    A: Leave it exactly where it is until police arrive.
    B: Move it out of the travel lane onto the shoulder if it can be driven safely.
    C: Drive it immediately to the nearest repair shop.
    D: Abandon the vehicle and walk to safety.
  answer: B
  explanation: If the crash occurred on a main lane... and there are no injuries or
    fatalities, each vehicle should be moved out of the travel lane onto the shoulder
    of the road provided it can be driven safely under its own power.
- id: 280
  category: penalties_and_points
  question: When are you required by law to make an immediate report of a crash to
    law enforcement?
  choices:
    A: Only when a person is killed.
    B: Only when damage to property is over $5,000.
    C: When any person is killed or injured, or total property damage appears to be
      $1,000 or more.
    D: Whenever the crash involves more than two vehicles.
  answer: C
  explanation: You are required by law to make an immediate report to the nearest
    law enforcement officer or agency of any crash when any person is killed or injured
    or the total damage to vehicles and other property appears to amount to $1,000
    or more.
- id: 281
  category: driver_responsibility
  question: If you damage property in a crash and do not know the owner, what must
    you do?
  choices:
    A: Leave the scene immediately.
    B: Wait at the scene for exactly one hour.
    C: Write down all the information you can gather and give it to the nearest law
      enforcement officer.
    D: Leave a note with your phone number on the damaged property.
  answer: C
  explanation: If you do not know the occupants of the other vehicle or the owner
    of damaged property, write down all the information you can gather and give it
    to the nearest law enforcement officer.
- id: 282
  category: penalties_and_points
  question: What is the penalty for failing to yield to a pedestrian when making a
    right turn on a red light?
  choices:
    A: A warning for the first offense.
    B: A penalty of not more than $500 and not less than $100.
    C: A mandatory 30-day license suspension.
    D: A fine of exactly $50.
  answer: B
  explanation: Failure to yield to a pedestrian under these circumstances will result
    in a penalty of not more than $500 and not less than $100.
- id: 283
  category: signs_and_signals
  question: What does a yellow arrow traffic signal indicate?
  choices:
    A: The protected green arrow signal is about to turn to a regular circular green,
      circular red, or red arrow signal.
    B: You have the right-of-way to make the turn without yielding.
    C: You must stop immediately and not proceed until it turns green.
    D: The traffic light is malfunctioning.
  answer: A
  explanation: A yellow arrow indicates that the 'protected' green arrow signal is
    about to turn to a regular circular green signal, circular red signal or red arrow
    signal.
- id: 284
  category: signs_and_signals
  question: How should you proceed when approaching an intersection with a malfunctioning
    traffic light due to a power outage?
  choices:
    A: Yield to the vehicle on your right and proceed without stopping.
    B: Proceed as though the intersection is controlled by a stop sign on all approaches.
    C: Wait until a law enforcement officer arrives.
    D: Treat the intersection as a yield sign.
  answer: B
  explanation: When approaching an intersection with a traffic light that has malfunctioned
    due to a power outage... you should approach the intersection and proceed as though
    the intersection is controlled by a stop sign on all approaches.
- id: 285
  category: signs_and_signals
  question: What does a flashing red signal mean?
  choices:
    A: Slow down and proceed with caution.
    B: Stop and wait for the light to turn green.
    C: It has the same meaning as a stop sign.
    D: Yield to oncoming traffic but do not stop.
  answer: C
  explanation: 'The flashing red signal has the same meaning as the stop sign: stop
    and do not proceed to move until you can enter the intersection without interfering
    with approaching traffic.'
- id: 286
  category: signs_and_signals
  question: What must a driver do when facing a flashing yellow arrow for a turn?
  choices:
    A: Stop and wait for a solid green arrow.
    B: The turn is permitted, but the driver must yield to oncoming traffic and pedestrians.
    C: The driver has the right-of-way and oncoming traffic must yield.
    D: Prepare to stop because the light is turning red.
  answer: B
  explanation: When the flashing yellow arrow is shown, the indicated turn is permitted
    but drivers must yield to oncoming traffic and pedestrians.
- id: 287
  category: signs_and_signals
  question: When making a U-turn on a solid green arrow, what must you do?
  choices:
    A: Yield to opposing right-turning traffic when both have a green arrow.
    B: Proceed without yielding to any traffic.
    C: Stop and wait for a circular green light.
    D: Yield to all traffic behind you.
  answer: A
  explanation: U-turning traffic should yield to opposing right turning traffic when
    both movements simultaneously have their respective green arrow.
- id: 288
  category: signs_and_signals
  question: What should you do if a ramp meter signal is dark or not emitting any
    light?
  choices:
    A: Stop and wait for the light to turn green.
    B: Treat it as a four-way stop.
    C: Proceed without stopping and enter the freeway by merging or yielding as normal.
    D: Pull over to the shoulder and report the broken signal.
  answer: C
  explanation: When the display is dark or not emitting a red or green display, a
    vehicle may proceed without stopping and enter the freeway by merging or yielding
    as normal conditions allow.
- id: 289
  category: signs_and_signals
  question: How do hybrid beacons operate when first activated by a pedestrian?
  choices:
    A: They immediately turn solid red.
    B: They flash yellow, then go steady yellow, and then steady red to allow vehicles
      to stop safely.
    C: They flash red continuously until the pedestrian finishes crossing.
    D: They display a green arrow for pedestrians.
  answer: B
  explanation: Once activated, the beacons will flash yellow for a few seconds, then
    go steady yellow and steady red for a few more seconds to allow moving vehicles
    to safely stop.
- id: 290
  category: signs_and_signals
  question: Where is a stop sign usually posted?
  choices:
    A: Exactly at the intersection line.
    B: 6 to 50 feet from the intersection.
    C: 100 feet before the intersection.
    D: 50 to 100 feet from the intersection.
  answer: B
  explanation: The stop sign is usually posted six to 50 feet from the intersection.
- id: 291
  category: signs_and_signals
  question: If there is no stop line or marked crosswalk at a stop sign, where must
    the driver stop?
  choices:
    A: Even with the stop sign itself.
    B: 10 feet before the intersecting street.
    C: Before entering the intersection where they have a view of the intersecting
      street.
    D: In the middle of the intersection to check for traffic.
  answer: C
  explanation: If there is no stop line or marked crosswalk, the driver must stop
    before entering the intersection where he/she has a view of the intersecting street.
- id: 292
  category: signs_and_signals
  question: What is the shape and color of a yield sign?
  choices:
    A: Octagon shaped, red and white
    B: Triangular shaped with the point at the bottom, red and white
    C: Diamond shaped, black and yellow
    D: Pennant shaped, yellow and black
  answer: B
  explanation: According to the manual, the yield sign is triangular shaped with the
    point at the bottom, and it is red and white with the word 'YIELD' in large letters.
- id: 293
  category: signs_and_signals
  question: Where is the pennant-shaped yellow 'DO NOT PASS' warning sign located?
  choices:
    A: On the right side of the road
    B: Suspended over the center of the intersection
    C: On the left side of the road
    D: On the right shoulder before a curve
  answer: C
  explanation: The manual states that the pennant-shaped yellow warning sign is located
    on the left side of the road and points to the beginning of the no-passing zone.
- id: 294
  category: signs_and_signals
  question: What do diamond-shaped signs that are orange with black messages warn
    drivers about?
  choices:
    A: Railroad crossings
    B: School zones
    C: Construction or maintenance areas
    D: No-passing zones
  answer: C
  explanation: Diamond-shaped caution or warning signs that are orange with black
    messages warn about construction or maintenance areas.
- id: 295
  category: signs_and_signals
  question: Which sign gives advance warning of a railroad crossing?
  choices:
    A: A circular sign with a black cross and the letters 'RR' on a yellow background
    B: A white crossbuck sign with 'RAILROAD CROSSING' in black
    C: A diamond-shaped yellow sign with a black train symbol
    D: A pentagon-shaped sign with a black cross
  answer: A
  explanation: A circular sign, with a black cross and the black letters 'RR' on a
    yellow background, gives advance warning of a railroad crossing.
- id: 296
  category: signs_and_signals
  question: What does a five-sided (pentagon) sign warn drivers of?
  choices:
    A: A hospital zone
    B: A school zone or a school crossing
    C: A pedestrian crosswalk
    D: An upcoming stop sign
  answer: B
  explanation: The five-sided (or pentagon) sign warns of a school zone or a school
    crossing, where drivers should be especially watchful for children.
- id: 297
  category: signs_and_signals
  question: According to the manual, how are odd-numbered highways generally routed?
  choices:
    A: East and west
    B: North and south
    C: In a circular loop around a city
    D: Diagonally across the state
  answer: B
  explanation: The manual states that odd-numbered highways generally run north and
    south.
- id: 298
  category: signs_and_signals
  question: What shape is the route marker for a North Carolina (N.C.) highway?
  choices:
    A: Shield
    B: Rectangle
    C: Diamond
    D: Circle
  answer: C
  explanation: According to the guide/informational signs section, North Carolina
    route markers are diamond shaped.
- id: 299
  category: safe_driving_rules
  question: What is the purpose of yellow pavement lines on a roadway?
  choices:
    A: To separate travel lanes moving in the same direction
    B: To mark the right edge of the roadway
    C: To indicate a crosswalk
    D: To separate travel lanes moving in opposite directions
  answer: D
  explanation: Yellow lines separate travel lanes moving in opposite directions, while
    white lines separate travel lanes moving in the same direction.
- id: 300
  category: safe_driving_rules
  question: Which of the following is true regarding a special center lane reserved
    for two-way left-turn movements?
  choices:
    A: It can be used for passing slower vehicles
    B: It must not be used for passing or merging into traffic
    C: It is reserved exclusively for emergency vehicles
    D: It can be used as a regular travel lane during rush hour
  answer: B
  explanation: The manual explicitly states that the two-way left-turn lane must not
    be used for passing another vehicle or for the purpose of merging into traffic.
- id: 301
  category: safe_driving_rules
  question: What do red reflective pavement markers indicate to a motorist?
  choices:
    A: The location of a nearby fire hydrant
    B: A school zone is approaching
    C: Wrong-way movements
    D: A railroad crossing is ahead
  answer: C
  explanation: Red markers indicate wrong-way movements for motorists. Blue reflective
    pavement markers indicate nearby fire hydrants.
- id: 302
  category: safe_driving_rules
  question: If a traffic officer is directing traffic at an intersection with a working
    traffic light, what should you do?
  choices:
    A: Obey the traffic light
    B: Obey the officer's hand signals instead of the traffic light
    C: Treat the intersection as a four-way stop
    D: Honk your horn to acknowledge the officer
  answer: B
  explanation: Under special circumstances, an officer may be directing the flow of
    traffic. If so, you must obey the officer's hand signals instead of the normal
    traffic signals or signs.
- id: 303
  category: sharing_the_road
  question: Are bicyclists subject to Driving While Impaired (DWI) laws?
  choices:
    A: No, because bicycles are not motorized vehicles
    B: Yes, because state law considers bicycles to be vehicles
    C: Only if they are riding on a state highway
    D: Only if they are involved in a collision
  answer: B
  explanation: Because bicycles are vehicles, bicyclists must obey the same traffic
    laws as other drivers, which includes DWI laws.
- id: 304
  category: sharing_the_road
  question: What lighting equipment is required by law for a bicycle ridden at night?
  choices:
    A: A front light visible for at least 300 feet and a rear red light or reflector
      visible for at least 200 feet
    B: A front light visible for 500 feet and a rear red light visible for 500 feet
    C: Only a rear red reflector visible for 100 feet
    D: Reflective clothing and a flashing helmet light
  answer: A
  explanation: At night, the law requires that a bicycle be equipped with a light
    on the front visible for a distance of at least 300 feet and a red light or reflector
    on the rear visible for a distance of at least 200 feet.
- id: 305
  category: sharing_the_road
  question: In which direction should bicyclists ride on the roadway?
  choices:
    A: Against the flow of traffic to see oncoming cars
    B: On the left side of the road
    C: With the flow of traffic, on the right side of the road
    D: On the sidewalk whenever possible
  answer: C
  explanation: It is especially important for bicyclists to go with the flow of traffic,
    NOT against the flow. They must ride right, with the traffic.
- id: 306
  category: sharing_the_road
  question: Who is required by law to wear an approved protective bicycle helmet?
  choices:
    A: All bicycle riders regardless of age
    B: Only bicycle riders riding on interstate highways
    C: All bicycle riders and passengers under age 16
    D: Only passengers riding in a bicycle seat
  answer: C
  explanation: All bicycle riders and passengers under age 16 must wear an approved
    protective bicycle helmet and must be seated on a saddle seat.
- id: 307
  category: sharing_the_road
  question: What are the weight and height requirements for a passenger to be required
    to sit in a bicycle restraining seat?
  choices:
    A: Less than 30 pounds or less than 30 inches in height
    B: Less than 40 pounds or less than 40 inches in height
    C: Less than 50 pounds or less than 48 inches in height
    D: Less than 60 pounds or less than 50 inches in height
  answer: B
  explanation: According to the manual, a passenger weighing less than 40 pounds or
    less than 40 inches in height must be seated in a bicycle restraining seat.
- id: 308
  category: safe_driving_rules
  question: When walking along a road as a pedestrian, where should you walk?
  choices:
    A: On the right side of the road moving with traffic
    B: On the right side of the road facing traffic
    C: On the left side of the road facing traffic
    D: On the left side of the road moving with traffic
  answer: C
  explanation: The manual states that pedestrians should always walk on the left side
    of the road facing traffic.
- id: 309
  category: sharing_the_road
  question: According to the manual, which groups make up most of the pedestrians
    killed in motor vehicle crashes?
  choices:
    A: Teenagers and young adults
    B: Construction workers and joggers
    C: People walking at crosswalks and intersections
    D: Children, elderly persons, or those who have been drinking alcoholic beverages
  answer: D
  explanation: The manual notes that most of the pedestrians killed are children,
    elderly persons or those who have been drinking alcoholic beverages.
- id: 310
  category: sharing_the_road
  question: How far behind a tractor-trailer does the rear blind spot (NO-ZONE) extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 200 feet
    D: Up to 300 feet
  answer: C
  explanation: Truckers have serious blind spots or NO-ZONES into which a car can
    disappear from view, including up to 200 feet in the rear.
- id: 311
  category: defensive_driving
  question: What is a general rule for motorists sharing the road with a tractor-trailer?
  choices:
    A: If you can see the truck's tires, you are at a safe distance
    B: If you can't see the truck driver in their side-view mirror, they can't see
      you
    C: Always pass a large truck on the right side
    D: Tailgate the truck to reduce wind resistance and improve gas mileage
  answer: B
  explanation: A general rule for motorists sharing the road with a tractor-trailer
    is, 'if you can't see the truck driver in their side-view mirror, they can't see
    you.'
- id: 312
  category: sharing_the_road
  question: How much clear roadway may it take to safely pass a trailer and the towing
    vehicle?
  choices:
    A: One-quarter mile
    B: One-half mile
    C: Three-quarters of a mile
    D: One full mile
  answer: B
  explanation: You should use extreme caution while passing a trailer and the towing
    vehicle, as it may take you a half mile of clear roadway to safely pass.
- id: 313
  category: safe_driving_rules
  question: When passing a moped, you must stay at least how far to the left?
  choices:
    A: One foot
    B: Two feet
    C: Three feet
    D: Four feet
  answer: B
  explanation: A moped should travel using the right side of the lane. To pass a moped,
    you must stay at least two feet to the left.
- id: 314
  category: sharing_the_road
  question: In most motorcycle crashes involving a car in North Carolina, who is usually
    at fault?
  choices:
    A: The motorcyclist
    B: The driver of the car
    C: Both drivers equally
    D: Neither, as weather is usually the primary factor
  answer: B
  explanation: About two-thirds of motorcycle crashes in North Carolina involve a
    car. In most of these crashes, the driver of the car is at fault, usually claiming
    they did not see the motorcycle.
- id: 315
  category: license_system
  question: What is the minimum age required to operate a moped on a public roadway
    in North Carolina?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: In North Carolina you must be at least 16 years old to operate a moped
    on a public roadway or public vehicular area.
- id: 316
  category: sharing_the_road
  question: Why do large trucks require additional turning room?
  choices:
    A: Because their brakes heat up quickly on downhill grades
    B: Because their rear wheels do not follow the path of their front wheels
    C: Because they have larger blind spots than passenger cars
    D: Because they accelerate much slower than passenger vehicles
  answer: B
  explanation: Large trucks require additional turning room because their rear wheels
    do not follow the path of their front wheels.
- id: 317
  category: alcohol_drugs_health
  question: Which of the following statements is true regarding moped operators and
    driving while impaired (DWI) laws?
  choices:
    A: Moped operators are exempt from DWI laws because mopeds are not considered
      motor vehicles.
    B: DWI laws only apply to moped operators if they are traveling over 20 mph.
    C: Driving while impaired laws that apply to drivers of other motor vehicles also
      apply to moped operators.
    D: Moped operators face lesser penalties for DWI than car drivers.
  answer: C
  explanation: The manual explicitly states that driving while impaired laws that
    apply to drivers of other motor vehicles also apply to moped operators.
- id: 318
  category: defensive_driving
  question: What is a potential hazard you should be aware of when a vehicle towing
    a trailer brakes suddenly?
  choices:
    A: The trailer may detach from the towing vehicle
    B: The sudden braking might cause the trailer to jackknife
    C: The towing vehicle's engine will likely stall
    D: The trailer's brakes will overheat and catch fire
  answer: B
  explanation: When you approach a vehicle towing a trailer, be aware that sudden
    braking might cause the trailer to jackknife.
- id: 319
  category: vehicle_information
  question: What document can serve as proof of ownership for a moped if the operator
    does not have a Manufacturer's Certificate of Origin (MCO)?
  choices:
    A: A notarized bill of sale from the dealership
    B: An Affidavit of Facts for the Registration of a Moped form (MVR-58)
    C: A valid North Carolina driver license
    D: A previous owner's registration card
  answer: B
  explanation: The manual states that if an operator does not have an MCO for their
    vehicle, they can fill out an Affidavit of Facts for the Registration of a Moped
    form (MVR-58) to serve as proof of ownership.
- id: 320
  category: penalties_and_points
  question: What is the minimum fine for a first-time littering conviction in North
    Carolina?
  choices:
    A: A minimum fine of $100
    B: A minimum fine of $250
    C: A minimum fine of $500
    D: A minimum fine of $1,000
  answer: B
  explanation: When litter is thrown or blown from a vehicle, the driver is held responsible.
    If convicted, the minimum fine is $250, and the maximum fine is $1,000.
- id: 321
  category: penalties_and_points
  question: If a second littering offense occurs within three years of a prior offense,
    what is the maximum fine upon conviction?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Any second or subsequent littering offense within three years after
    the date of a prior offense is punishable by a fine of not less than $500 nor
    more than $2,000, if convicted.
- id: 322
  category: sharing_the_road
  question: How often does a volunteer group agree to pick up litter when joining
    the Adopt-A-Highway Program?
  choices:
    A: Once a month
    B: Twice a year
    C: At least four times a year
    D: Six times a year
  answer: C
  explanation: To join the Adopt-A-Highway program, a group agrees to pick up litter
    at least four times a year along a two-mile section of state-maintained roadway.
- id: 323
  category: license_system
  question: Which type of driver license record check is usually required for court
    appearances?
  choices:
    A: A non-certified full history
    B: A certified copy of the record
    C: A non-certified three-year history
    D: A copy of address history
  answer: B
  explanation: The manual specifies that a certified driver license record check usually
    is required for court appearances.
- id: 324
  category: vehicle_information
  question: Which of the following vehicles is exempt from being registered with the
    Division of Motor Vehicles?
  choices:
    A: Mopeds
    B: Motor homes
    C: Exempt road construction equipment
    D: Fleet vehicles
  answer: C
  explanation: Except for owners of exempt farm vehicles and exempt road construction
    equipment, every vehicle owner must register their motor vehicle with the Division
    of Motor Vehicles.
- id: 325
  category: vehicle_information
  question: What must a new North Carolina resident moving from out-of-state provide
    to title and register their vehicle?
  choices:
    A: A valid out-of-state driver's license and a North Carolina Temporary Driving
      Certificate (TDC)
    B: A certified copy of their driving record
    C: An Affidavit of Facts (MVR-58)
    D: A North Carolina voter registration card
  answer: A
  explanation: If you are a new North Carolina resident moving from out-of-state,
    your valid out-of-state driver’s license, along with your North Carolina Temporary
    Driving Certificate (TDC) will be required to title and register your vehicle.
- id: 326
  category: vehicle_information
  question: According to North Carolina law, which of the following is prohibited
    regarding license plates?
  choices:
    A: Displaying the plate on the rear of the vehicle
    B: Using plastic license plate covers
    C: Having validation stickers on the plate
    D: Displaying the expiration date
  answer: B
  explanation: The manual explicitly states that plastic license plate covers are
    prohibited under GS 20-63g.
- id: 327
  category: vehicle_information
  question: What information is required to change the physical address on your vehicle
    registration online?
  choices:
    A: Your social security number and date of birth
    B: Your vehicle license plate number, the last five characters of the vehicle
      title number, and a valid email address
    C: A certified copy of your driving record and proof of insurance
    D: Your out-of-state driver's license and a Temporary Driving Certificate
  answer: B
  explanation: To change your address online, you will need your vehicle license plate
    number, the last five characters of the vehicle title number, and a valid email
    address.
- id: 328
  category: vehicle_information
  question: What is the official transfer document required to register a new vehicle
    in North Carolina?
  choices:
    A: A notarized bill of sale
    B: The manufacturer's certificate of origin
    C: A certificate of self-insurance
    D: A non-certified full history record
  answer: B
  explanation: Before a vehicle can be registered, proper proof of ownership is required.
    For new vehicles, the manufacturer's certificate of origin is the official transfer
    document.
- id: 329
  category: driver_responsibility
  question: Within how many days must a license or ID holder update their physical
    address with the DMV after moving within North Carolina?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 120 days
  answer: C
  explanation: Within 60 days of moving within North Carolina, a license or ID holder
    must update their physical address with the DMV and get a duplicate license or
    ID.
- id: 330
  category: penalties_and_points
  question: What is the penalty if the DMV is notified that a vehicle owner is operating
    a motor vehicle without proper liability insurance?
  choices:
    A: The vehicle will be impounded for 60 days
    B: The vehicle's license plate could be revoked for 30 days
    C: The driver's license will be permanently suspended
    D: The owner must pay a $1,000 minimum fine
  answer: B
  explanation: If the DMV is notified that a vehicle owner is operating a motor vehicle
    without proper liability insurance, the vehicle’s license plate could be revoked
    for 30 days.
- id: 331
  category: vehicle_information
  question: In North Carolina, a certificate of self-insurance can be used as proof
    of liability insurance for fleets of at least how many vehicles?
  choices:
    A: 5 or more vehicles
    B: 10 or more vehicles
    C: 15 or more vehicles
    D: 25 or more vehicles
  answer: D
  explanation: Liability insurance can be in the form of a policy from a licensed
    company, cash or bond deposited with the State Treasurer, or a certificate of
    self-insurance for fleets of 25 or more vehicles.
- id: 332
  category: vehicle_information
  question: What is the minimum amount of liability insurance required for property
    damage in a crash in North Carolina?
  choices:
    A: $25,000
    B: $30,000
    C: $60,000
    D: $750,000
  answer: A
  explanation: The minimum amount of liability insurance required is $25,000 for all
    property damage in a crash.
- id: 333
  category: vehicle_information
  question: How long is the grace period honored by North Carolina for expired liability
    insurance policies?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: North Carolina does not honor a grace period.
  answer: D
  explanation: North Carolina does not honor a grace period. A grace period is an
    agreement between the Insured and the insurance company only.
- id: 334
  category: vehicle_information
  question: Within how many days prior to a vehicle's registration expiration must
    it receive a safety or safety and emission inspection?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Within 90 days prior to the registration expiration, all self-propelled
    vehicles are required to receive a safety or safety and emission inspection to
    renew their registration.
- id: 335
  category: driver_responsibility
  question: What should you do to avoid a fine or penalty before terminating or canceling
    your vehicle's liability insurance?
  choices:
    A: Notify your local county assessment office.
    B: Surrender the vehicle's valid license plate.
    C: Apply for a duplicate title.
    D: Pay the Tag & Tax Together fee.
  answer: B
  explanation: To avoid a fine or penalty, surrender a vehicle's valid license plate
    prior to the termination or cancellation of liability insurance.
- id: 336
  category: vehicle_information
  question: 'When transferring ownership of a motor vehicle, the reassignment of ownership
    on the certificate of title must be made in the presence of:'
  choices:
    A: A DMV inspector
    B: A law enforcement officer
    C: A Notary Public
    D: An insurance agent
  answer: C
  explanation: In order for the transfer to be valid, the reassignment must be made
    in the presence of a Notary Public and the actual delivery of the vehicle to the
    new owner must be made.
- id: 337
  category: vehicle_information
  question: Under what conditions can license plates be transferred from one vehicle
    to another?
  choices:
    A: If the vehicles are of the same category, ownership is in the same name, and
      insurance coverage has been continuous.
    B: If the new vehicle is less than three years old and has less than 70,000 miles.
    C: If the transfer is done within 15 days of purchasing the new vehicle.
    D: License plates can never be transferred between vehicles in North Carolina.
  answer: A
  explanation: License plates can be transferred from one vehicle to another of the
    same category provided ownership is in the same name and insurance coverage has
    been continuous.
- id: 338
  category: vehicle_information
  question: If a certificate of title is lost or stolen, how long must you wait before
    a duplicate title can be issued after the application and fee are received?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: A duplicate title cannot be issued until 15 days after the application
    and fee are received by the DMV.
- id: 339
  category: vehicle_information
  question: What does the "Tag & Tax Together" program require vehicle owners to do?
  choices:
    A: Pay for registration renewal tags and vehicle property taxes in one payment.
    B: Pay for vehicle inspection and registration renewal in one payment.
    C: Pay for a duplicate title and license plate transfer at the same time.
    D: Pay for liability insurance and vehicle property taxes in one payment.
  answer: A
  explanation: The "Tag & Tax Together" program requires one payment for both bills.
    Both tag renewals and tax payments must be paid in full to renew a vehicle’s annual
    registration.
- id: 340
  category: vehicle_information
  question: Who is responsible for establishing the value of a vehicle for property
    tax purposes in North Carolina?
  choices:
    A: The N.C. Division of Motor Vehicles
    B: The local county assessment office
    C: The DMV License & Theft Bureau
    D: The vehicle's insurance company
  answer: B
  explanation: DMV is not involved in establishing the value of a vehicle for property
    tax purposes. The local county assessment office determines the tax based on the
    make and model of the registered vehicle.
- id: 341
  category: vehicle_information
  question: Which of the following vehicles is exempt from the "Tag & Tax Together"
    law?
  choices:
    A: Passenger cars
    B: Mopeds
    C: Light-duty trucks
    D: Motorcycles
  answer: B
  explanation: 'The Tag & Tax Together law covers all motor vehicles except: Vehicles
    exempt from registration, Manufactured homes, Mobile classrooms and offices, Semi-trailers
    registered on a multi-year basis, Motor vehicles owned or leased by public service
    companies, Park Model Trailers, and Mopeds.'
- id: 342
  category: vehicle_information
  question: If a vehicle fails its annual inspection, it is entitled to be re-inspected
