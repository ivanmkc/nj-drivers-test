metadata:
  source: 2025 North Carolina Driver's Handbook (ncdot.gov)
  total_questions: 392
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: safe_driving_rules
  question: Approximately how many miles of state-maintained roads are there in North
    Carolina?
  choices:
    A: 50,000 miles
    B: 80,000 miles
    C: 100,000 miles
    D: 284,000 miles
  answer: B
  explanation: According to the handbook's introduction, North Carolina has more than
    80,000 miles of state-maintained roads.
- id: 2
  category: driver_responsibility
  question: Approximately how many crashes occur on North Carolina roadways each year?
  choices:
    A: 80,000
    B: 150,000
    C: 284,000
    D: 7.6 million
  answer: C
  explanation: The manual states that in the state of North Carolina, there are about
    284,000 crashes on the roadways each year.
- id: 3
  category: license_system
  question: What is the phone number for DMVdirectAccess to obtain automated information
    24 hours a day?
  choices:
    A: 919-615-6131
    B: 919-715-7000
    C: 919-814-1779
    D: 919-707-4670
  answer: B
  explanation: DMVdirectAccess can be reached by dialing 919-715-7000 from a touch-tone
    telephone to access information 24 hours a day, seven days a week.
- id: 4
  category: license_system
  question: How can you find the location of a driver license or vehicle registration
    office in your area using the DMVdirectAccess telephone system?
  choices:
    A: By entering your zip code
    B: By speaking your city name
    C: By entering your driver license number
    D: By entering your license plate number
  answer: A
  explanation: The manual states that by entering your zip code, the DMVdirectAccess
    system can give you the location of a driver license or vehicle registration office
    in your area.
- id: 5
  category: license_system
  question: Which of the following services is available online at MyNCDMV.gov?
  choices:
    A: Taking the driving skills test
    B: Ordering personalized plates
    C: Obtaining a first-time REAL ID
    D: Taking the vision test
  answer: B
  explanation: Ordering personalized plates is listed under the 'Available Online
    Services' section for MyNCDMV.gov.
- id: 6
  category: license_system
  question: What is the fee to request a duplicate driver license or identification
    card online?
  choices:
    A: $10.00
    B: $15.50
    C: $16.75
    D: $20.00
  answer: C
  explanation: A fee of $16.75 is charged to request a duplicate driver license/identification
    card online.
- id: 7
  category: license_system
  question: Which of the following is a valid reason to request a duplicate driver
    license online?
  choices:
    A: To change your legal name
    B: To upgrade to a Commercial Driver License
    C: To replace a license that is defaced or damaged
    D: To remove a corrective lenses restriction
  answer: C
  explanation: According to the manual, a duplicate license may be requested online
    to replace a lost or stolen license, change a residence/mailing address, or replace
    a license that is defaced or damaged.
- id: 8
  category: license_system
  question: How early can you renew your driver license online before its expiration
    date?
  choices:
    A: Up to 3 months
    B: Up to 6 months
    C: Up to 9 months
    D: Up to 12 months
  answer: B
  explanation: The online driver license renewal process is allowed up to six months
    before the license's expiration date.
- id: 9
  category: license_system
  question: How often is a driver allowed to use the online driver license renewal
    process?
  choices:
    A: Every time they renew
    B: Every other time they renew
    C: Only once in their lifetime
    D: Every third time they renew
  answer: B
  explanation: The manual states that the online driver license process is available
    to drivers every other time they renew their license.
- id: 10
  category: license_system
  question: Depending on the driver's age, a renewed driver license will be valid
    for how many years?
  choices:
    A: 4 or 6 years
    B: 5 or 8 years
    C: 3 or 5 years
    D: 6 or 10 years
  answer: B
  explanation: The new license will be mailed in 7-14 business days, and will be valid
    for 5 or 8 years, depending on the driver's age.
- id: 11
  category: license_system
  question: Who among the following is NOT eligible to renew their driver license
    online?
  choices:
    A: A driver with a corrective lenses restriction
    B: A driver trying to renew a commercial driver license (CDL)
    C: A driver whose license expires in 5 months
    D: A driver who renewed in person last time
  answer: B
  explanation: Online service is not available if a driver is trying to renew a commercial
    driver license; they must complete the process at a DMV license office.
- id: 12
  category: license_system
  question: After completing the online renewal process, when will the new driver
    license be mailed to the customer?
  choices:
    A: 1-3 business days
    B: 3-5 business days
    C: 7-14 business days
    D: 15-30 business days
  answer: C
  explanation: The manual states that the new license will be mailed in 7-14 business
    days after completing the online renewal.
- id: 13
  category: sharing_the_road
  question: Which division should you contact to learn more about public transportation
    options in your area?
  choices:
    A: Traffic Records Section
    B: N.C. Department of Transportation Public Transportation Division
    C: International Registration Plan Section
    D: Tag and Tax Together
  answer: B
  explanation: To learn more about public transportation options in your area, you
    should call the N.C. Department of Transportation Public Transportation Division
    at 919-707-4670.
- id: 14
  category: license_system
  question: Can you use the online system to obtain a first-time REAL ID?
  choices:
    A: Yes, if you have a valid social security number
    B: Yes, if you pay an additional fee
    C: No, first-time REAL ID issuances cannot be done online
    D: No, REAL IDs are only issued to commercial drivers
  answer: C
  explanation: 'The manual explicitly states: ''Customers cannot use the online system
    to obtain first time licenses or ID cards. This also applies to first time REAL
    ID issuances.'''
- id: 15
  category: license_system
  question: Is it legal to sit in the driver's seat of a motor vehicle while the engine
    is running without a valid driver license?
  choices:
    A: Yes, as long as the vehicle is parked.
    B: Yes, if a licensed driver is in the passenger seat.
    C: No, it is illegal.
    D: No, unless you are on private property.
  answer: C
  explanation: It is illegal to sit in the driver's seat of a motor vehicle while
    the engine is running or to steer a motor vehicle while it is being pushed or
    towed by another vehicle if you do not have a valid driver license.
- id: 16
  category: penalties_and_points
  question: What is the penalty for driving without the proper corrective lenses if
    they are required on your license?
  choices:
    A: A warning for the first offense.
    B: A $50 fine.
    C: The same penalty as driving without a license.
    D: Immediate suspension of your vehicle registration.
  answer: C
  explanation: The penalty for driving without the proper corrective lenses is the
    same as driving without a license.
- id: 17
  category: driver_testing
  question: Which of the following tests is NOT required to obtain a standard learner
    permit for persons age 18 and older?
  choices:
    A: Vision test
    B: Traffic signs test
    C: Knowledge of motor vehicle laws
    D: Driving skill (on-road test)
  answer: D
  explanation: Required testing for a learner permit includes vision, traffic signs,
    and knowledge of motor vehicle laws. The driving test is not required for a learner
    permit.
- id: 18
  category: license_system
  question: Who must accompany a learner permit holder while they are operating a
    motor vehicle?
  choices:
    A: Any adult over the age of 21.
    B: A person licensed to operate the motor vehicle being driven, seated beside
      the permit holder.
    C: A parent or legal guardian.
    D: A certified driving instructor.
  answer: B
  explanation: The permit holder must, while operating a motor vehicle over the highways,
    be accompanied by a person who is licensed to operate the motor vehicle being
    driven and is seated beside the permit holder.
- id: 19
  category: license_system
  question: How long is a motorcycle learner permit valid?
  choices:
    A: 6 months
    B: 12 months
    C: 2 years
    D: 5 years
  answer: B
  explanation: The motorcycle learner permit is valid for 12 months and may be renewed
    for one additional six-month period.
- id: 20
  category: license_system
  question: What must an applicant under 18 years old possess before applying for
    a motorcycle learner permit?
  choices:
    A: A standard learner permit
    B: A full provisional license issued by the division
    C: A commercial driver license (CDL)
    D: A high school diploma
  answer: B
  explanation: If an applicant is at least 16 years old but less than 18 years old,
    the applicant must possess a full provisional license issued by the division.
- id: 21
  category: license_system
  question: Are passengers allowed when operating a motorcycle with a motorcycle learner
    permit?
  choices:
    A: Yes, if the passenger is over 18.
    B: Yes, if the passenger is a licensed motorcycle rider.
    C: No, the permit authorizes operation without passengers.
    D: Yes, if the passenger wears a helmet.
  answer: C
  explanation: The motorcycle learner permit authorizes a person to operate a motorcycle
    without passengers.
- id: 22
  category: driver_testing
  question: What must you do to pass the traffic signs test?
  choices:
    A: Identify the signs by color and shape and explain what each means.
    B: Draw the signs from memory.
    C: Read the signs aloud from a distance of 50 feet.
    D: Identify the signs by their placement on the road.
  answer: A
  explanation: To pass the signs test, you must identify the traffic signs by color
    and shape and explain what each means.
- id: 23
  category: driver_testing
  question: What accommodation is available for the knowledge test for those who have
    difficulty reading?
  choices:
    A: A take-home exam
    B: An open-book test
    C: Audio tests upon request
    D: A practical demonstration instead of a written test
  answer: C
  explanation: Audio tests are available, upon request, for those who have difficulty
    reading.
- id: 24
  category: license_system
  question: If an applicant for a motorcycle learner permit is less than 18 years
    old, what course must they successfully complete?
  choices:
    A: A defensive driving course
    B: The Motorcycle Safety Foundation Basic Rider Course or NC Motorcycle Safety
      Education Program Basic Rider Course
    C: A high school driver's education course
    D: An advanced highway safety course
  answer: B
  explanation: If an applicant is less than 18 years old, the applicant must successfully
    complete the Motorcycle Safety Foundation Basic Rider Course or the North Carolina
    Motorcycle Safety Education Program Basic Rider Course.
- id: 25
  category: license_system
  question: Is it legal to steer a motor vehicle while it is being pushed or towed
    by another vehicle if you do not have a valid driver license?
  choices:
    A: Yes, because the engine is not running.
    B: Yes, if the towing vehicle is driven by a licensed driver.
    C: No, it is illegal.
    D: Yes, but only on secondary roads.
  answer: C
  explanation: It is illegal to sit in the driver's seat of a motor vehicle while
    the engine is running or to steer a motor vehicle while it is being pushed or
    towed by another vehicle if you do not have a valid driver license.
- id: 26
  category: driver_testing
  question: Which of the following is NOT listed as a test requirement for an original
    driver license of any type?
  choices:
    A: Vision
    B: Knowledge of motor vehicle laws
    C: Traffic signs
    D: Parallel parking proficiency
  answer: D
  explanation: 'For an original driver license of any type, you may be tested on:
    Vision, Knowledge of motor vehicle laws, Traffic signs, and Driving skill (on-road
    test). Parallel parking is not listed as a specific test requirement.'
- id: 27
  category: alcohol_drugs_health
  question: Can a person with a disability be issued a driver license?
  choices:
    A: No, individuals with disabilities cannot be licensed.
    B: Yes, a restricted license may be issued provided the condition does not keep
      them from driving safely.
    C: Yes, but only for operating specially modified commercial vehicles.
    D: Yes, but they must retake the driving test every 6 months.
  answer: B
  explanation: A person with a disability may be issued a restricted license provided
    the condition does not keep them from driving safely.
- id: 28
  category: license_system
  question: How many times can a motorcycle learner permit be renewed?
  choices:
    A: It cannot be renewed.
    B: It may be renewed for one additional six-month period.
    C: It may be renewed annually.
    D: It may be renewed for one additional 12-month period.
  answer: B
  explanation: The motorcycle learner permit is valid for 12 months and may be renewed
    for one additional six-month period.
- id: 29
  category: driver_testing
  question: When is the driving skills (on-the-road) test required?
  choices:
    A: Only when renewing a license.
    B: The first time you apply for a license, and possibly for renewal.
    C: Every time you renew your license.
    D: When applying for a learner permit.
  answer: B
  explanation: The first time you apply for a license, you must take the driving test.
    You might also have to take it to renew your license. It is not required for a
    learner permit.
- id: 30
  category: driver_testing
  question: Which of the following is a skill observed and graded during the on-the-road
    driving test?
  choices:
    A: Parallel parking between two vehicles
    B: Changing a flat tire
    C: Stopping as quickly and safely as possible when told to do so
    D: Checking engine oil levels
  answer: C
  explanation: The manual states that 'Quick stops — stopping as quickly and safely
    as possible when told to do so' is a skill observed and graded during the on-the-road
    driving test.
- id: 31
  category: license_system
  question: Which class of regular license do most drivers need to operate personal
    automobiles and small trucks?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Commercial Class C
  answer: C
  explanation: According to the manual, 'Most drivers need only a Regular Class C
    license to operate personal automobiles and small trucks.'
- id: 32
  category: safe_driving_rules
  question: When beginning a three-point turnabout, where should you start your vehicle?
  choices:
    A: From the center line of the road
    B: From the extreme right side of the road
    C: From the extreme left side of the road
    D: From a designated turning lane
  answer: B
  explanation: The manual instructs to 'Start from the extreme right side of the road'
    when performing the first step of a three-point turnabout.
- id: 33
  category: license_system
  question: Which of the following vehicles requires a Commercial Driver License (CDL)
    to operate?
  choices:
    A: A recreational vehicle (RV)
    B: Military equipment
    C: A vehicle designed to transport 16 or more passengers
    D: Fire and emergency equipment
  answer: C
  explanation: A CDL is required for a Class C motor vehicle that 'Is designed to
    transport 16 or more passengers, including the driver.' RVs, military equipment,
    and fire/emergency equipment are exempt.
- id: 34
  category: license_system
  question: How much driving experience must a person have to become a school bus
    driver?
  choices:
    A: At least three months
    B: At least six months
    C: At least one year
    D: At least five years
  answer: B
  explanation: The manual states that the driver of a school bus must be at least
    18 years of age and 'have at least six months driving experience.'
- id: 35
  category: license_system
  question: What is the minimum age to apply for a Level One Limited Learner Permit
    in North Carolina?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: To apply for a Level One Limited Learner Permit, the manual states
    'You must be at least 15 years old but less than 18 years old.'
- id: 36
  category: license_system
  question: During the first six months of holding a Level One Limited Learner Permit,
    what hours are you authorized to drive with a supervising driver?
  choices:
    A: 6 a.m. to 8 p.m.
    B: 5 a.m. to 9 p.m.
    C: 7 a.m. to 7 p.m.
    D: Anytime of day or night
  answer: B
  explanation: During the first six months, a level one permit authorizes you to drive
    'between the hours of 5 a.m. and 9 p.m., while accompanied by your supervising
    driver.'
- id: 37
  category: license_system
  question: How long must a supervising driver have been licensed?
  choices:
    A: At least one year
    B: At least three years
    C: At least five years
    D: At least ten years
  answer: C
  explanation: The manual states that a supervising driver 'must hold a valid driver
    license and must have been licensed for at least five years.'
- id: 38
  category: license_system
  question: How many total hours of operation must be detailed in the Driving Log
    before applying for a Limited Provisional License?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: D
  explanation: For a Level One Limited Learner Permit, you will be given a Driving
    Log to complete 'detailing a minimum of 60 hours of operation.'
- id: 39
  category: safe_driving_rules
  question: Under a Level One Limited Learner Permit, when are you permitted to use
    a cell phone while operating a motor vehicle?
  choices:
    A: When using a hands-free device
    B: When stopped at a red light
    C: Only to call regarding an emergency situation
    D: When communicating with your supervising driver
  answer: C
  explanation: You are not permitted to use a cell phone while operating a motor vehicle,
    with the exception that 'You can use it to call the following regarding an emergency
    situation...'
- id: 40
  category: license_system
  question: What is the minimum age requirement for a Level Two Limited Provisional
    License?
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: For a Level Two Limited Provisional License, the manual states 'Drivers
    must be at least 16 years old, but less than 18.'
- id: 41
  category: license_system
  question: 'A driver with a Level Two Limited Provisional License may drive unsupervised
    at any time when driving directly to or from:'
  choices:
    A: A school-sponsored athletic event
    B: Work or any volunteer fire, rescue or EMS
    C: A family member's household
    D: A driver education course
  answer: B
  explanation: A Level Two driver may drive unsupervised from 5 a.m. until 9 p.m.
    'and at any time when driving directly to or from work or any volunteer fire,
    rescue or emergency medical service...'
- id: 42
  category: license_system
  question: When driving unsupervised with a Level Two Limited Provisional License,
    what is the restriction on passengers under 21 who are not members of the driver's
    household?
  choices:
    A: There may be no passengers under 21
    B: There may be exactly one such passenger
    C: There may be up to two such passengers
    D: There is no restriction on the number of passengers
  answer: B
  explanation: The manual states, 'When driving unsupervised, there may be one passenger
    that is under 21 that is not a member of the same household as the driver.'
- id: 43
  category: license_system
  question: Who is allowed to sit in the front seat of a vehicle driven by a person
    holding a Level One Limited Learner Permit?
  choices:
    A: Only the driver and the supervising driver
    B: The driver and any passenger over 18
    C: The driver and up to two passengers
    D: Anyone, as long as they wear a seat belt
  answer: A
  explanation: 'The manual explicitly states for Level One permits: ''No one except
    the driver and the supervising driver are allowed in the front seat.'''
- id: 44
  category: license_system
  question: 'According to North Carolina law, the Division shall not issue a commercial
    driver license with a ''P'' or ''S'' endorsement to anyone who:'
  choices:
    A: Has less than one year of driving experience
    B: Is required to register under sex offender and public protection registration
      programs
    C: Has received a moving violation in the past six months
    D: Is under 21 years of age
  answer: B
  explanation: 'The manual notes: ''the Division shall not issue or renew a commercial
    driver license reflecting a “P” or “S” endorsement to anyone required to register
    under sex offender and public protection registration programs.'''
- id: 45
  category: license_system
  question: What are the requirements for a supervising driver?
  choices:
    A: Must be at least 21 years old and have a clean driving record
    B: Must hold a valid driver license and have been licensed for at least five years
    C: Must be a sibling over the age of 18
    D: Must have a commercial driver license
  answer: B
  explanation: A supervising driver must hold a valid driver license and must have
    been licensed for at least five years.
- id: 46
  category: penalties_and_points
  question: What is the penalty for a provisional licensee (under age 18) convicted
    of driving after consuming any amount of alcohol or drugs?
  choices:
    A: A 30-day license suspension
    B: A fine of $500
    C: A one-year license revocation
    D: Mandatory community service
  answer: C
  explanation: It is unlawful for a provisional licensee to drive a motor vehicle
    after or while consuming any amount of alcohol or drugs — a conviction of such
    a violation will result in a one-year license revocation.
- id: 47
  category: driver_testing
  question: How many hours of classroom and behind-the-wheel instruction are required
    in an approved driver education course for drivers under age 18?
  choices:
    A: 20 hours classroom, 4 hours behind-the-wheel
    B: 30 hours classroom, 6 hours behind-the-wheel
    C: 40 hours classroom, 10 hours behind-the-wheel
    D: 50 hours classroom, 12 hours behind-the-wheel
  answer: B
  explanation: Drivers under age 18 must present a certificate showing they have passed
    an approved driver education course consisting of at least 30 hours classroom
    instruction and six hours behind-the-wheel instruction.
- id: 48
  category: license_system
  question: What happens if the DMV receives notice that a person under age 18 is
    no longer eligible for a Driving Eligibility Certificate?
  choices:
    A: They are issued a hardship driving permit
    B: Their driver license is revoked until their 18th birthday or until a certificate/diploma
      is obtained
    C: They must pay a reinstatement fee
    D: They are restricted to driving only to and from work
  answer: B
  explanation: DMV must revoke the driver license of any person under age 18 when
    it receives notice they are no longer eligible for a Driving Eligibility Certificate.
    This revocation remains in effect until the person's 18th birthday unless a Driving
    Eligibility Certificate, high school diploma or GED is obtained.
- id: 49
  category: safe_driving_rules
  question: Under what circumstance is a provisional licensee permitted to use a cell
    phone while operating a motor vehicle?
  choices:
    A: When using a hands-free device
    B: When stopped at a red light
    C: To call an emergency response operator regarding an emergency situation
    D: To get directions from a GPS application
  answer: C
  explanation: Provisional licensees are not permitted to use a cell phone except
    to call regarding an emergency situation to an emergency response operator, hospital,
    fire department, law enforcement, parent, legal guardian, or spouse.
- id: 50
  category: license_system
  question: Does North Carolina issue a hardship driving permit or license for individuals
    under 18?
  choices:
    A: Yes, for driving to and from work only
    B: Yes, if approved by a school administrator
    C: No, North Carolina does not issue a hardship driving permit or license
    D: Yes, but only for medical emergencies
  answer: C
  explanation: The manual explicitly states, 'North Carolina does not issue a hardship
    driving permit or license.'
- id: 51
  category: penalties_and_points
  question: How long does the loss of license remain in effect if a student receives
    a suspension from school for more than 10 consecutive days?
  choices:
    A: 30 days
    B: 6 months
    C: 12 months or until a Driving Eligibility Certificate is obtained
    D: Until the student turns 21
  answer: C
  explanation: A loss of license due to a suspension for more than 10 consecutive
    days remains in effect for 12 months or until a Driving Eligibility Certificate
    is obtained.
- id: 52
  category: license_system
  question: What driving record requirement must be met within the preceding six months
    before graduating to a Level Three Full Provisional License?
  choices:
    A: No more than two moving violations
    B: No convictions of motor vehicle moving violations, seat belt or cell phone
      infractions
    C: Completion of an advanced defensive driving course
    D: Zero parking tickets
  answer: B
  explanation: Before graduating to level three, you must have no convictions of motor
    vehicle moving violations, seat belt or cell phone infractions within the preceding
    six months.
- id: 53
  category: license_system
  question: What is the legal consequence of driving outside the limits of a restricted
    driver license?
  choices:
    A: You will receive a warning ticket
    B: You are considered to be driving without a license
    C: Your vehicle will be impounded immediately
    D: You must retake the written knowledge test
  answer: B
  explanation: If your license is restricted, you must only drive within the limits
    of the restriction; otherwise you are considered to be driving without a license.
- id: 54
  category: license_system
  question: Which of the following is required when applying for a driver license
    for the first time in North Carolina?
  choices:
    A: Proof of vehicle liability insurance
    B: A voter registration card
    C: A letter of recommendation from an employer
    D: A certified copy of your medical records
  answer: A
  explanation: You will need to provide proof of vehicle liability insurance when
    applying for a driver license.
- id: 55
  category: license_system
  question: Beginning May 7, 2025, what will a driver license with the notation 'Not
    for Federal Identification' mean for the cardholder?
  choices:
    A: They cannot drive on interstate highways
    B: They will need additional documentation to fly on a commercial airline or enter
      federal facilities
    C: Their license is suspended until they upgrade it
    D: They are restricted to driving only within North Carolina
  answer: B
  explanation: Beginning May 7, 2025, a driver license with 'Not for Federal Identification'
    means you will need to provide additional documentation to fly on a commercial
    airline and enter any federal facility.
- id: 56
  category: license_system
  question: When using a birth certificate as proof of identity and date of birth,
    which of the following is unacceptable?
  choices:
    A: A certified copy filed with a State Office of Vital Statistics
    B: A laminated copy or plastic replica
    C: A certified copy from an equivalent agency in the state of birth
    D: A photocopy certified by the issuing agency
  answer: B
  explanation: Table 1 states that for a birth certificate, there are 'No laminated
    copies or plastic replicas' allowed.
- id: 57
  category: safe_driving_rules
  question: Who is required to have a safety belt properly fastened when a provisional
    licensee is operating a vehicle in motion?
  choices:
    A: Only the driver and front-seat passengers
    B: Only passengers under the age of 18
    C: Every person occupying the vehicle
    D: Only the driver
  answer: C
