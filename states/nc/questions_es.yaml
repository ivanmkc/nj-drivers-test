questions:
- id: 1
  category: safe_driving_rules
  question: ¿Aproximadamente cuántas millas de carreteras mantenidas por el estado
    hay en Carolina del Norte?
  choices:
    A: 50,000 millas
    B: 80,000 millas
    C: 100,000 millas
    D: 284,000 millas
  answer: B
  explanation: Según la introducción del manual, Carolina del Norte tiene más de 80,000
    millas de carreteras mantenidas por el estado.
- id: 2
  category: driver_responsibility
  question: ¿Aproximadamente cuántos choques ocurren en las carreteras de Carolina
    del Norte cada año?
  choices:
    A: 80,000
    B: 150,000
    C: 284,000
    D: 7.6 millones
  answer: C
  explanation: El manual indica que en el estado de Carolina del Norte, hay alrededor
    de 284,000 choques en las carreteras cada año.
- id: 3
  category: license_system
  question: ¿Cuál es el número de teléfono de DMVdirectAccess para obtener información
    automatizada las 24 horas del día?
  choices:
    A: 919-615-6131
    B: 919-715-7000
    C: 919-814-1779
    D: 919-707-4670
  answer: B
  explanation: Se puede contactar a DMVdirectAccess marcando el 919-715-7000 desde
    un teléfono de tonos para acceder a información las 24 horas del día, los siete
    días de la semana.
- id: 4
  category: license_system
  question: ¿Cómo puede encontrar la ubicación de una oficina de licencias de conducir
    o de registro de vehículos en su área usando el sistema telefónico DMVdirectAccess?
  choices:
    A: Ingresando su código postal
    B: Diciendo el nombre de su ciudad
    C: Ingresando su número de licencia de conducir
    D: Ingresando su número de placa
  answer: A
  explanation: El manual indica que al ingresar su código postal, el sistema DMVdirectAccess
    puede darle la ubicación de una oficina de licencias de conducir o de registro
    de vehículos en su área.
- id: 5
  category: license_system
  question: ¿Cuál de los siguientes servicios está disponible en línea en MyNCDMV.gov?
  choices:
    A: Tomar el examen de habilidades de manejo
    B: Ordenar placas personalizadas
    C: Obtener una REAL ID por primera vez
    D: Tomar el examen de la vista
  answer: B
  explanation: Ordenar placas personalizadas aparece en la sección de 'Servicios en
    línea disponibles' (Available Online Services) de MyNCDMV.gov.
- id: 6
  category: license_system
  question: ¿Cuál es la tarifa para solicitar un duplicado de la licencia de conducir
    o tarjeta de identificación en línea?
  choices:
    A: $10.00
    B: $15.50
    C: $16.75
    D: $20.00
  answer: C
  explanation: Se cobra una tarifa de $16.75 para solicitar un duplicado de la licencia
    de conducir o tarjeta de identificación en línea.
- id: 7
  category: license_system
  question: ¿Cuál de las siguientes es una razón válida para solicitar un duplicado
    de la licencia de conducir en línea?
  choices:
    A: Para cambiar su nombre legal
    B: Para ascender a una Licencia de Conducir Comercial (CDL)
    C: Para reemplazar una licencia que está ilegible o dañada
    D: Para eliminar una restricción de lentes correctivos
  answer: C
  explanation: Según el manual, se puede solicitar un duplicado de la licencia en
    línea para reemplazar una licencia perdida o robada, cambiar una dirección de
    residencia/postal, o reemplazar una licencia que está ilegible o dañada.
- id: 8
  category: license_system
  question: ¿Con cuánta anticipación puede renovar su licencia de conducir en línea
    antes de su fecha de vencimiento?
  choices:
    A: Hasta 3 meses
    B: Hasta 6 meses
    C: Hasta 9 meses
    D: Hasta 12 meses
  answer: B
  explanation: El proceso de renovación de la licencia de conducir en línea se permite
    hasta seis meses antes de la fecha de vencimiento de la licencia.
- id: 9
  category: license_system
  question: ¿Con qué frecuencia se le permite a un conductor usar el proceso de renovación
    de la licencia de conducir en línea?
  choices:
    A: Cada vez que renueva
    B: Una de cada dos veces que renueva
    C: Solo una vez en su vida
    D: Una de cada tres veces que renueva
  answer: B
  explanation: El manual indica que el proceso de licencia de conducir en línea está
    disponible para los conductores una de cada dos veces que renuevan su licencia
    (en renovaciones alternas).
- id: 10
  category: license_system
  question: Dependiendo de la edad del conductor, ¿por cuántos años será válida una
    licencia de conducir renovada?
  choices:
    A: 4 o 6 años
    B: 5 u 8 años
    C: 3 o 5 años
    D: 6 o 10 años
  answer: B
  explanation: La nueva licencia se enviará por correo en 7 a 14 días hábiles y será
    válida por 5 u 8 años, dependiendo de la edad del conductor.
- id: 11
  category: license_system
  question: ¿Quién de los siguientes NO es elegible para renovar su licencia de conducir
    en línea?
  choices:
    A: Un conductor con una restricción de lentes correctivos
    B: Un conductor que intenta renovar una licencia de conducir comercial (CDL)
    C: Un conductor cuya licencia vence en 5 meses
    D: Un conductor que renovó en persona la última vez
  answer: B
  explanation: El servicio en línea no está disponible si un conductor intenta renovar
    una licencia de conducir comercial; debe completar el proceso en una oficina de
    licencias del DMV.
- id: 12
  category: license_system
  question: Después de completar el proceso de renovación en línea, ¿cuándo se enviará
    por correo la nueva licencia de conducir al cliente?
  choices:
    A: 1-3 días hábiles
    B: 3-5 días hábiles
    C: 7-14 días hábiles
    D: 15-30 días hábiles
  answer: C
  explanation: El manual indica que la nueva licencia se enviará por correo en 7-14
    días hábiles después de completar la renovación en línea.
- id: 13
  category: sharing_the_road
  question: ¿Con qué división debe comunicarse para obtener más información sobre
    las opciones de transporte público en su área?
  choices:
    A: Sección de Registros de Tránsito
    B: División de Transporte Público del Departamento de Transporte de Carolina del
      Norte (N.C. Department of Transportation)
    C: Sección del Plan de Registro Internacional
    D: Programa Tag and Tax Together (Etiqueta e Impuestos Juntos)
  answer: B
  explanation: Para obtener más información sobre las opciones de transporte público
    en su área, debe llamar a la División de Transporte Público del Departamento de
    Transporte de Carolina del Norte al 919-707-4670.
- id: 14
  category: license_system
  question: ¿Puede usar el sistema en línea para obtener una REAL ID por primera vez?
  choices:
    A: Sí, si tiene un número de seguro social válido
    B: Sí, si paga una tarifa adicional
    C: No, las emisiones de REAL ID por primera vez no se pueden hacer en línea
    D: No, las REAL ID solo se emiten a conductores comerciales
  answer: C
  explanation: 'El manual establece explícitamente: ''Los clientes no pueden usar
    el sistema en línea para obtener licencias o tarjetas de identificación por primera
    vez. Esto también se aplica a las emisiones de REAL ID por primera vez''.'
- id: 15
  category: license_system
  question: ¿Es legal sentarse en el asiento del conductor de un vehículo motorizado
    con el motor en marcha sin una licencia de conducir válida?
  choices:
    A: Sí, siempre y cuando el vehículo esté estacionado.
    B: Sí, si un conductor con licencia está en el asiento del pasajero.
    C: No, es ilegal.
    D: No, a menos que se encuentre en una propiedad privada.
  answer: C
  explanation: Es ilegal sentarse en el asiento del conductor de un vehículo motorizado
    mientras el motor está en marcha o conducir un vehículo motorizado mientras es
    empujado o remolcado por otro vehículo si no tiene una licencia de conducir válida.
- id: 16
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir sin los lentes correctivos adecuados
    si son requeridos en su licencia?
  choices:
    A: Una advertencia por la primera infracción.
    B: Una multa de $50.
    C: La misma sanción que conducir sin licencia.
    D: Suspensión inmediata del registro de su vehículo.
  answer: C
  explanation: La sanción por conducir sin los lentes correctivos adecuados es la
    misma que por conducir sin licencia.
- id: 17
  category: driver_testing
  question: ¿Cuál de las siguientes pruebas NO es un requisito para obtener un permiso
    de aprendizaje estándar para personas de 18 años o más?
  choices:
    A: Examen de la vista
    B: Examen de señales de tránsito
    C: Conocimiento de las leyes de vehículos motorizados
    D: Habilidad de manejo (examen práctico en la calle)
  answer: D
  explanation: Las pruebas requeridas para un permiso de aprendizaje incluyen la vista,
    señales de tránsito y conocimiento de las leyes de vehículos motorizados. El examen
    de manejo no es un requisito para un permiso de aprendizaje.
- id: 18
  category: license_system
  question: ¿Quién debe acompañar al titular de un permiso de aprendizaje mientras
    opera un vehículo motorizado?
  choices:
    A: Cualquier adulto mayor de 21 años.
    B: Una persona con licencia para operar el vehículo motorizado que se conduce,
      sentada al lado del titular del permiso.
    C: Un padre o tutor legal.
    D: Un instructor de manejo certificado.
  answer: B
  explanation: El titular del permiso debe, mientras opera un vehículo motorizado
    en las carreteras, estar acompañado por una persona que tenga licencia para operar
    el vehículo motorizado que se conduce y que esté sentada al lado del titular del
    permiso.
- id: 19
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje para motocicleta?
  choices:
    A: 6 meses
    B: 12 meses
    C: 2 años
    D: 5 años
  answer: B
  explanation: El permiso de aprendizaje para motocicleta es válido por 12 meses y
    puede renovarse por un período adicional de seis meses.
- id: 20
  category: license_system
  question: ¿Qué debe poseer un solicitante menor de 18 años antes de solicitar un
    permiso de aprendizaje para motocicleta?
  choices:
    A: Un permiso de aprendizaje estándar
    B: Una licencia provisional completa emitida por la división
    C: Una licencia de conducir comercial (CDL)
    D: Un diploma de escuela secundaria
  answer: B
  explanation: Si un solicitante tiene al menos 16 años pero menos de 18 años, debe
    poseer una licencia provisional completa emitida por la división.
- id: 21
  category: license_system
  question: ¿Se permiten pasajeros al conducir una motocicleta con un permiso de aprendizaje
    para motocicleta?
  choices:
    A: Sí, si el pasajero es mayor de 18 años.
    B: Sí, si el pasajero es un motociclista con licencia.
    C: No, el permiso autoriza la conducción sin pasajeros.
    D: Sí, si el pasajero lleva casco.
  answer: C
  explanation: El permiso de aprendizaje para motocicleta autoriza a una persona a
    conducir una motocicleta sin pasajeros.
- id: 22
  category: driver_testing
  question: ¿Qué debe hacer para aprobar el examen de señales de tránsito?
  choices:
    A: Identificar las señales por su color y forma, y explicar qué significa cada
      una.
    B: Dibujar las señales de memoria.
    C: Leer las señales en voz alta desde una distancia de 50 pies.
    D: Identificar las señales por su ubicación en la vía.
  answer: A
  explanation: Para aprobar el examen de señales, debe identificar las señales de
    tránsito por su color y forma, y explicar qué significa cada una.
- id: 23
  category: driver_testing
  question: ¿Qué adaptación está disponible en el examen de conocimientos para aquellos
    que tienen dificultades para leer?
  choices:
    A: Un examen para llevar a casa
    B: Un examen a libro abierto
    C: Exámenes en audio previa solicitud
    D: Una demostración práctica en lugar de un examen escrito
  answer: C
  explanation: Los exámenes en audio están disponibles, previa solicitud, para aquellos
    que tienen dificultades para leer.
- id: 24
  category: license_system
  question: Si un solicitante de un permiso de aprendizaje para motocicleta es menor
    de 18 años, ¿qué curso debe completar con éxito?
  choices:
    A: Un curso de manejo defensivo
    B: El Curso Básico para Motociclistas de la Motorcycle Safety Foundation o el
      Curso Básico para Motociclistas del Programa de Educación de Seguridad en Motocicletas
      de Carolina del Norte (NC)
    C: Un curso de educación vial de la escuela secundaria
    D: Un curso avanzado de seguridad en las carreteras
  answer: B
  explanation: Si un solicitante es menor de 18 años, debe completar con éxito el
    Curso Básico para Motociclistas de la Motorcycle Safety Foundation o el Curso
    Básico para Motociclistas del Programa de Educación de Seguridad en Motocicletas
    de Carolina del Norte.
- id: 25
  category: license_system
  question: ¿Es legal maniobrar el volante de un vehículo motorizado mientras es empujado
    o remolcado por otro vehículo si usted no tiene una licencia de conducir válida?
  choices:
    A: Sí, porque el motor no está en marcha.
    B: Sí, si el vehículo que remolca es conducido por un conductor con licencia.
    C: No, es ilegal.
    D: Sí, pero solo en carreteras secundarias.
  answer: C
  explanation: Es ilegal sentarse en el asiento del conductor de un vehículo motorizado
    mientras el motor está en marcha o maniobrar el volante de un vehículo motorizado
    mientras es empujado o remolcado por otro vehículo si usted no tiene una licencia
    de conducir válida.
- id: 26
  category: driver_testing
  question: ¿Cuál de los siguientes NO figura como un requisito de examen para una
    licencia de conducir original de cualquier tipo?
  choices:
    A: Visión
    B: Conocimiento de las leyes de vehículos motorizados
    C: Señales de tránsito
    D: Habilidad para estacionar en paralelo
  answer: D
  explanation: 'Para una licencia de conducir original de cualquier tipo, se le puede
    evaluar en: Visión, Conocimiento de las leyes de vehículos motorizados, Señales
    de tránsito y Habilidad de manejo (examen práctico en la vía). El estacionamiento
    en paralelo no figura como un requisito de examen específico.'
- id: 27
  category: alcohol_drugs_health
  question: ¿Se le puede emitir una licencia de conducir a una persona con una discapacidad?
  choices:
    A: No, las personas con discapacidades no pueden obtener una licencia.
    B: Sí, se puede emitir una licencia restringida siempre que la condición no le
      impida conducir de manera segura.
    C: Sí, pero solo para operar vehículos comerciales especialmente modificados.
    D: Sí, pero deben volver a tomar el examen de manejo cada 6 meses.
  answer: B
  explanation: A una persona con una discapacidad se le puede emitir una licencia
    restringida siempre que la condición no le impida conducir de manera segura.
- id: 28
  category: license_system
  question: ¿Cuántas veces se puede renovar un permiso de aprendizaje para motocicleta?
  choices:
    A: No se puede renovar.
    B: Se puede renovar por un período adicional de seis meses.
    C: Se puede renovar anualmente.
    D: Se puede renovar por un período adicional de 12 meses.
  answer: B
  explanation: El permiso de aprendizaje para motocicleta es válido por 12 meses y
    se puede renovar por un período adicional de seis meses.
- id: 29
  category: driver_testing
  question: ¿Cuándo se requiere el examen de habilidades de manejo (práctico en la
    vía)?
  choices:
    A: Solo al renovar una licencia.
    B: La primera vez que solicita una licencia, y posiblemente para la renovación.
    C: Cada vez que renueva su licencia.
    D: Al solicitar un permiso de aprendizaje.
  answer: B
  explanation: La primera vez que solicita una licencia, debe tomar el examen de manejo.
    También es posible que deba tomarlo para renovar su licencia. No se requiere para
    un permiso de aprendizaje.
- id: 30
  category: driver_testing
  question: ¿Cuál de las siguientes es una habilidad que se observa y califica durante
    el examen de manejo práctico en la vía?
  choices:
    A: Estacionar en paralelo entre dos vehículos
    B: Cambiar una llanta desinflada
    C: Detenerse lo más rápido y seguro posible cuando se le indique
    D: Revisar los niveles de aceite del motor
  answer: C
  explanation: 'El manual establece que las ''Paradas rápidas: detenerse lo más rápido
    y seguro posible cuando se le indique'' es una habilidad que se observa y califica
    durante el examen de manejo práctico en la vía.'
- id: 31
  category: license_system
  question: ¿Qué clase de licencia regular necesitan la mayoría de los conductores
    para operar automóviles personales y camiones pequeños?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase C Comercial
  answer: C
  explanation: Según el manual, 'La mayoría de los conductores solo necesitan una
    licencia regular de Clase C para operar automóviles personales y camiones pequeños'.
- id: 32
  category: safe_driving_rules
  question: Al comenzar un giro de tres puntos, ¿desde dónde debe iniciar la maniobra
    con su vehículo?
  choices:
    A: Desde la línea central de la carretera
    B: Desde el extremo derecho de la carretera
    C: Desde el extremo izquierdo de la carretera
    D: Desde un carril de giro designado
  answer: B
  explanation: El manual indica 'Comience desde el extremo derecho de la carretera'
    al realizar el primer paso de un giro de tres puntos.
- id: 33
  category: license_system
  question: ¿Cuál de los siguientes vehículos requiere una Licencia de Conducir Comercial
    (CDL) para ser operado?
  choices:
    A: Un vehículo recreativo (RV)
    B: Equipo militar
    C: Un vehículo diseñado para transportar 16 o más pasajeros
    D: Equipo de bomberos y emergencias
  answer: C
  explanation: Se requiere una CDL para un vehículo motorizado de Clase C que 'esté
    diseñado para transportar 16 o más pasajeros, incluido el conductor'. Los vehículos
    recreativos (RV), el equipo militar y el equipo de bomberos/emergencias están
    exentos.
- id: 34
  category: license_system
  question: ¿Cuánta experiencia de manejo debe tener una persona para convertirse
    en conductor de un autobús escolar?
  choices:
    A: Al menos tres meses
    B: Al menos seis meses
    C: Al menos un año
    D: Al menos cinco años
  answer: B
  explanation: El manual establece que el conductor de un autobús escolar debe tener
    al menos 18 años de edad y 'tener al menos seis meses de experiencia de manejo'.
- id: 35
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un Permiso de Aprendiz Limitado
    de Nivel Uno en Carolina del Norte?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: B
  explanation: Para solicitar un Permiso de Aprendiz Limitado de Nivel Uno, el manual
    establece que 'Debe tener al menos 15 años, pero menos de 18 años'.
- id: 36
  category: license_system
  question: Durante los primeros seis meses de tener un Permiso de Aprendiz Limitado
    de Nivel Uno, ¿en qué horario está autorizado a conducir con un conductor supervisor?
  choices:
    A: De 6 a.m. a 8 p.m.
    B: De 5 a.m. a 9 p.m.
    C: De 7 a.m. a 7 p.m.
    D: En cualquier momento del día o de la noche
  answer: B
  explanation: Durante los primeros seis meses, un permiso de nivel uno le autoriza
    a conducir 'entre las 5 a.m. y las 9 p.m., mientras esté acompañado por su conductor
    supervisor'.
- id: 37
  category: license_system
  question: ¿Cuánto tiempo debe haber tenido licencia un conductor supervisor?
  choices:
    A: Al menos un año
    B: Al menos tres años
    C: Al menos cinco años
    D: Al menos diez años
  answer: C
  explanation: El manual establece que un conductor supervisor 'debe tener una licencia
    de conducir válida y debe haber tenido licencia durante al menos cinco años'.
- id: 38
  category: license_system
  question: ¿Cuántas horas totales de manejo deben detallarse en el Registro de Manejo
    antes de solicitar una Licencia Provisional Limitada?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: D
  explanation: Para un Permiso de Aprendiz Limitado de Nivel Uno, se le entregará
    un Registro de Manejo para completar 'detallando un mínimo de 60 horas de manejo'.
- id: 39
  category: safe_driving_rules
  question: Con un Permiso de Aprendiz Limitado de Nivel Uno, ¿cuándo se le permite
    usar un teléfono celular mientras opera un vehículo motorizado?
  choices:
    A: Al usar un dispositivo manos libres
    B: Al estar detenido en un semáforo en rojo
    C: Solo para llamar en relación con una situación de emergencia
    D: Al comunicarse con su conductor supervisor
  answer: C
  explanation: No se le permite usar un teléfono celular mientras opera un vehículo
    motorizado, con la excepción de que 'Puede usarlo para llamar a los siguientes
    en relación con una situación de emergencia...'.
- id: 40
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para una Licencia Provisional Limitada
    de Nivel Dos?
  choices:
    A: 15 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: B
  explanation: Para una Licencia Provisional Limitada de Nivel Dos, el manual establece
    que 'Los conductores deben tener al menos 16 años, pero menos de 18'.
- id: 41
  category: license_system
  question: 'Un conductor con una Licencia Provisional Limitada de Nivel Dos puede
    conducir sin supervisión en cualquier momento cuando se dirija directamente hacia
    o desde:'
  choices:
    A: Un evento atlético patrocinado por la escuela
    B: El trabajo o cualquier servicio voluntario de bomberos, rescate o servicios
      médicos de emergencia (EMS)
    C: La casa de un familiar
    D: Un curso de educación vial
  answer: B
  explanation: Un conductor de Nivel Dos puede conducir sin supervisión desde las
    5 a.m. hasta las 9 p.m. 'y en cualquier momento cuando se dirija directamente
    hacia o desde el trabajo o cualquier servicio voluntario de bomberos, rescate
    o servicio médico de emergencia...'.
- id: 42
  category: license_system
  question: Al conducir sin supervisión con una Licencia Provisional Limitada de Nivel
    Dos, ¿cuál es la restricción sobre los pasajeros menores de 21 años que no son
    miembros del hogar del conductor?
  choices:
    A: No puede haber pasajeros menores de 21 años
    B: Puede haber exactamente un pasajero de este tipo
    C: Puede haber hasta dos pasajeros de este tipo
    D: No hay restricción en el número de pasajeros
  answer: B
  explanation: 'El manual establece: ''Al conducir sin supervisión, puede haber un
    pasajero menor de 21 años que no sea miembro del mismo hogar que el conductor''.'
- id: 43
  category: license_system
  question: ¿A quién se le permite sentarse en el asiento delantero de un vehículo
    conducido por una persona que tiene un Permiso de Aprendizaje Limitado de Nivel
    Uno?
  choices:
    A: Solo al conductor y al conductor supervisor
    B: Al conductor y a cualquier pasajero mayor de 18 años
    C: Al conductor y hasta dos pasajeros
    D: A cualquier persona, siempre y cuando use el cinturón de seguridad
  answer: A
  explanation: 'El manual establece explícitamente para los permisos de Nivel Uno:
    ''Nadie excepto el conductor y el conductor supervisor pueden estar en el asiento
    delantero''.'
- id: 44
  category: license_system
  question: 'Según la ley de Carolina del Norte, la División no emitirá una licencia
    de conducir comercial con un endoso ''P'' o ''S'' a ninguna persona que:'
  choices:
    A: Tenga menos de un año de experiencia de manejo
    B: Esté obligada a registrarse en los programas de registro de delincuentes sexuales
      y protección pública
    C: Haya recibido una infracción de tránsito en movimiento en los últimos seis
      meses
    D: Sea menor de 21 años
  answer: B
  explanation: 'El manual señala: ''la División no emitirá ni renovará una licencia
    de conducir comercial que refleje un endoso "P" o "S" a ninguna persona que deba
    registrarse en los programas de registro de delincuentes sexuales y protección
    pública''.'
- id: 45
  category: license_system
  question: ¿Cuáles son los requisitos para un conductor supervisor?
  choices:
    A: Debe tener al menos 21 años y un historial de manejo limpio
    B: Debe tener una licencia de conducir válida y haber tenido licencia durante
      al menos cinco años
    C: Debe ser un hermano mayor de 18 años
    D: Debe tener una licencia de conducir comercial
  answer: B
  explanation: Un conductor supervisor debe tener una licencia de conducir válida
    y haber tenido licencia durante al menos cinco años.
- id: 46
  category: penalties_and_points
  question: ¿Cuál es la sanción para un titular de una licencia provisional (menor
    de 18 años) condenado por conducir después de consumir cualquier cantidad de alcohol
    o drogas?
  choices:
    A: Una suspensión de la licencia por 30 días
    B: Una multa de $500
    C: Una revocación de la licencia por un año
    D: Servicio comunitario obligatorio
  answer: C
  explanation: Es ilegal que un titular de una licencia provisional conduzca un vehículo
    motorizado después o mientras consume cualquier cantidad de alcohol o drogas;
    una condena por tal infracción resultará en la revocación de la licencia por un
    año.
- id: 47
  category: driver_testing
  question: ¿Cuántas horas de instrucción en el aula y detrás del volante se requieren
    en un curso de educación vial aprobado para conductores menores de 18 años?
  choices:
    A: 20 horas en el aula, 4 horas detrás del volante
    B: 30 horas en el aula, 6 horas detrás del volante
    C: 40 horas en el aula, 10 horas detrás del volante
    D: 50 horas en el aula, 12 horas detrás del volante
  answer: B
  explanation: Los conductores menores de 18 años deben presentar un certificado que
    demuestre que han aprobado un curso de educación vial aprobado que consta de al
    menos 30 horas de instrucción en el aula y seis horas de instrucción detrás del
    volante.
- id: 48
  category: license_system
  question: ¿Qué sucede si el DMV recibe un aviso de que una persona menor de 18 años
    ya no es elegible para un Certificado de Elegibilidad para Conducir?
  choices:
    A: Se le emite un permiso de conducir por dificultades (hardship driving permit)
    B: Su licencia de conducir es revocada hasta que cumpla 18 años o hasta que obtenga
      un certificado/diploma
    C: Debe pagar una tarifa de restablecimiento
    D: Se le restringe a conducir solo hacia y desde el trabajo
  answer: B
  explanation: El DMV debe revocar la licencia de conducir de cualquier persona menor
    de 18 años cuando reciba un aviso de que ya no es elegible para un Certificado
    de Elegibilidad para Conducir. Esta revocación permanece en vigor hasta que la
    persona cumpla 18 años, a menos que obtenga un Certificado de Elegibilidad para
    Conducir, un diploma de escuela secundaria o un GED.
- id: 49
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia se le permite a un titular de una licencia provisional
    usar un teléfono celular mientras opera un vehículo motorizado?
  choices:
    A: Al usar un dispositivo manos libres
    B: Al estar detenido en un semáforo en rojo
    C: Para llamar a un operador de respuesta a emergencias sobre una situación de
      emergencia
    D: Para obtener indicaciones de una aplicación de GPS
  answer: C
  explanation: A los titulares de licencias provisionales no se les permite usar un
    teléfono celular excepto para llamar sobre una situación de emergencia a un operador
    de respuesta a emergencias, hospital, departamento de bomberos, fuerzas del orden,
    padre, tutor legal o cónyuge.
- id: 50
  category: license_system
  question: ¿Emite Carolina del Norte un permiso o licencia de conducir por dificultades
    (hardship driving permit) para personas menores de 18 años?
  choices:
    A: Sí, solo para conducir hacia y desde el trabajo
    B: Sí, si es aprobado por un administrador escolar
    C: No, Carolina del Norte no emite un permiso o licencia de conducir por dificultades
    D: Sí, pero solo para emergencias médicas
  answer: C
  explanation: 'El manual establece explícitamente: ''Carolina del Norte no emite
    un permiso o licencia de conducir por dificultades''.'
- id: 51
  category: penalties_and_points
  question: ¿Cuánto tiempo permanece en vigor la pérdida de la licencia si un estudiante
    recibe una suspensión escolar por más de 10 días consecutivos?
  choices:
    A: 30 días
    B: 6 meses
    C: 12 meses o hasta que se obtenga un Certificado de Elegibilidad para Conducir
      (Driving Eligibility Certificate)
    D: Hasta que el estudiante cumpla 21 años
  answer: C
  explanation: La pérdida de la licencia debido a una suspensión por más de 10 días
    consecutivos permanece en vigor durante 12 meses o hasta que se obtenga un Certificado
    de Elegibilidad para Conducir.
- id: 52
  category: license_system
  question: ¿Qué requisito del historial de manejo se debe cumplir dentro de los seis
    meses anteriores antes de pasar a una Licencia Provisional Completa de Nivel Tres
    (Level Three Full Provisional License)?
  choices:
    A: No más de dos infracciones de tránsito en movimiento
    B: Ninguna condena por infracciones de tránsito en movimiento, uso del cinturón
      de seguridad o uso del teléfono celular
    C: Finalización de un curso avanzado de manejo defensivo
    D: Cero multas de estacionamiento
  answer: B
  explanation: Antes de pasar al nivel tres, no debe tener condenas por infracciones
    de tránsito en movimiento, uso del cinturón de seguridad o uso del teléfono celular
    dentro de los seis meses anteriores.
- id: 53
  category: license_system
  question: ¿Cuál es la consecuencia legal de conducir fuera de los límites de una
    licencia de conducir restringida?
  choices:
    A: Recibirá una multa de advertencia
    B: Se considera que está conduciendo sin licencia
    C: Su vehículo será incautado inmediatamente
    D: Debe volver a tomar el examen de conocimientos escrito
  answer: B
  explanation: Si su licencia está restringida, solo debe conducir dentro de los límites
    de la restricción; de lo contrario, se considera que está conduciendo sin licencia.
- id: 54
  category: license_system
  question: ¿Cuál de los siguientes requisitos es necesario al solicitar una licencia
    de conducir por primera vez en Carolina del Norte?
  choices:
    A: Comprobante de seguro de responsabilidad civil del vehículo
    B: Una tarjeta de registro de votante
    C: Una carta de recomendación de un empleador
    D: Una copia certificada de sus registros médicos
  answer: A
  explanation: Deberá presentar un comprobante de seguro de responsabilidad civil
    del vehículo al solicitar una licencia de conducir.
- id: 55
  category: license_system
  question: A partir del 7 de mayo de 2025, ¿qué significará para el titular una licencia
    de conducir con la anotación 'No válida para identificación federal' (Not for
    Federal Identification)?
  choices:
    A: No puede conducir en autopistas interestatales
    B: Necesitará documentación adicional para volar en una aerolínea comercial o
      ingresar a instalaciones federales
    C: Su licencia está suspendida hasta que la actualice
    D: Está restringido a conducir solo dentro de Carolina del Norte
  answer: B
  explanation: A partir del 7 de mayo de 2025, una licencia de conducir con la anotación
    'No válida para identificación federal' (Not for Federal Identification) significa
    que deberá presentar documentación adicional para volar en una aerolínea comercial
    e ingresar a cualquier instalación federal.
- id: 56
  category: license_system
  question: Al usar un certificado de nacimiento como prueba de identidad y fecha
    de nacimiento, ¿cuál de las siguientes opciones es inaceptable?
  choices:
    A: Una copia certificada archivada en una Oficina Estatal de Estadísticas Vitales
    B: Una copia plastificada o réplica de plástico
    C: Una copia certificada de una agencia equivalente en el estado de nacimiento
    D: Una fotocopia certificada por la agencia emisora
  answer: B
  explanation: La Tabla 1 establece que para un certificado de nacimiento, 'No se
    permiten copias plastificadas ni réplicas de plástico'.
- id: 57
  category: safe_driving_rules
  question: ¿Quién debe tener el cinturón de seguridad correctamente abrochado cuando
    un titular de una licencia provisional conduce un vehículo en movimiento?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: Todas las personas que ocupen el vehículo
    D: Solo el conductor
  answer: C
  explanation: 'El manual establece para un titular de una licencia provisional: ''Toda
    persona que ocupe un vehículo en movimiento debe tener el cinturón de seguridad
    correctamente abrochado cuando el vehículo esté en movimiento''.'
- id: 58
  category: license_system
  question: ¿Qué restricciones del Nivel Uno y Nivel Dos NO se aplican a una Licencia
    Provisional Completa de Nivel Tres (Level Three Full Provisional License)?
  choices:
    A: Los requisitos del cinturón de seguridad
    B: Las limitaciones de horario de conducción, supervisión y pasajeros
    C: La prohibición de conducir bajo los efectos del alcohol o drogas
    D: El requisito de llevar comprobante de seguro
  answer: B
  explanation: Las restricciones del nivel uno y nivel dos relativas al horario de
    conducción, supervisión y limitaciones de pasajeros no se aplican a una Licencia
    Provisional Completa.
- id: 59
  category: license_system
  question: Si se utiliza una licencia de conducir de otro estado como prueba de identidad,
    ¿cuál es el tiempo máximo que puede llevar vencida?
  choices:
    A: No puede estar vencida en absoluto
    B: Menos de 1 año
    C: Menos de 2 años
    D: Menos de 5 años
  answer: C
  explanation: La Tabla 1 establece que una licencia de conducir, permiso de aprendizaje
    o tarjeta de identificación debe ser válida o haber vencido hace menos de 2 años.
- id: 60
  category: license_system
  question: Al presentar una Tarjeta de Seguro Social para obtener una licencia de
    conducir, ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Se aceptan fotocopias si están notariadas.
    B: Se aceptan tarjetas plastificadas.
    C: No se permiten fotocopias ni tarjetas plastificadas.
    D: Se acepta una imagen digital de la tarjeta.
  answer: C
  explanation: Según la Tabla 2 sobre los requisitos del Número de Seguro Social,
    al presentar una Tarjeta de Seguro Social, 'No se permiten fotocopias ni tarjetas
    plastificadas'.
- id: 61
  category: license_system
  question: ¿Por qué las tarjetas de Medicaid o Medicare ya no se aceptan como prueba
    de un Número de Seguro Social?
  choices:
    A: Son fáciles de falsificar.
    B: Los números de seguro social se eliminaron de las tarjetas en 2019.
    C: No contienen el nombre legal del solicitante.
    D: La ley federal prohíbe su uso para identificación estatal.
  answer: B
  explanation: El manual establece que los números de seguro social ya no se imprimen
    en las tarjetas de Medicaid/Medicare; fueron eliminados en 2019 cuando se emitieron
    nuevas tarjetas con nuevos números de identificación a los participantes.
- id: 62
  category: license_system
  question: Debido a la Ley de Modernización (Modernization Act), ¿cuántas pruebas
    de residencia de Carolina del Norte se requieren para que un adulto obtenga un
    RID?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: A
  explanation: La Tabla 3 establece que, debido a la Ley de Modernización, solo se
    requiere una prueba de residencia de Carolina del Norte para obtener un RID.
- id: 63
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para probar la residencia
    en Carolina del Norte de un menor de 18 años?
  choices:
    A: Una prueba digital de seguro
    B: Suscripciones a revistas
    C: Una tarjeta de Seguro Social plastificada
    D: Una tarjeta de Medicaid emitida en 2020
  answer: B
  explanation: La Tabla 4 enumera las 'Suscripciones a revistas' como un documento
    aceptable para probar la residencia de un menor de 18 años.
- id: 64
  category: license_system
  question: Al proporcionar prueba de cobertura de seguro de responsabilidad civil
    para obtener una licencia de conducir, ¿qué formato NO se acepta?
  choices:
    A: El formulario DL-123 de un agente de seguros
    B: Una póliza provisional (insurance binder)
    C: Una póliza de seguro de vehículo impresa
    D: Una prueba digital de seguro en un dispositivo móvil
  answer: D
  explanation: El manual establece explícitamente que no se acepta una prueba digital
    de seguro, y no se aceptarán imágenes en un dispositivo móvil como prueba de seguro
    de responsabilidad civil.
- id: 65
  category: license_system
  question: ¿Qué documentación adicional debe proporcionar un solicitante legalmente
    ciego para obtener una tarjeta de identificación sin costo?
  choices:
    A: Una carta de un proveedor de atención primaria
    B: Una carta de un médico
    C: Una carta de un refugio para personas sin hogar
    D: Una identificación militar de EE. UU. válida y no vencida
  answer: B
  explanation: La Tabla 8 establece que para obtener una identificación sin costo
    (No Fee ID), un solicitante legalmente ciego debe presentar una carta de un médico.
- id: 66
  category: license_system
  question: ¿A qué edad es elegible un solicitante para una tarjeta de identificación
    sin costo (No Fee ID) sin necesidad de documentación adicional?
  choices:
    A: 60 años de edad o más
    B: 65 años de edad o más
    C: 70 años de edad o más
    D: 75 años de edad o más
  answer: C
  explanation: La Tabla 8 indica que los solicitantes de 70 años de edad o más pueden
    obtener una identificación sin costo (No Fee ID) sin necesidad de documentación
    adicional.
- id: 67
  category: license_system
  question: ¿Cuál de los siguientes solicitantes debe proporcionar una prueba impresa
    de cobertura de seguro de responsabilidad civil para automóviles?
  choices:
    A: Una persona que renueva una licencia de conducir de Carolina del Norte no vencida
    B: Una persona que solicita una licencia original, incluidas las transferencias
      de otro estado
    C: Una persona que solicita una tarjeta de identificación sin costo (No Fee ID)
    D: Una persona que actualiza su registro de votante
  answer: B
  explanation: La prueba de cobertura de seguro de responsabilidad civil se aplica
    a quienes solicitan una licencia original, incluidas las transferencias de otro
    estado.
- id: 68
  category: license_system
  question: ¿Por cuánto tiempo son válidos el Formulario DL-123, las pólizas provisionales
    (insurance binders) y los certificados a partir de la fecha de emisión?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: El manual establece que el Formulario DL-123, las pólizas provisionales
    y los certificados son válidos solo por 30 días a partir de la fecha de emisión.
- id: 69
  category: license_system
  question: Si un solicitante firma una certificación de exención (DL-123A) porque
    no posee un vehículo motorizado registrado, ¿qué restricción se impone en su licencia
    de conducir?
  choices:
    A: Solo conducción de día (Daylight Driving Only)
    B: Acompañado por un conductor con licencia
    C: Solo vehículos de flota (Fleet Vehicles Only)
    D: Solo transmisión automática
  answer: C
  explanation: La exención restringe al conductor a la operación de 'Solo vehículos
    de flota' (Fleet Vehicles Only).
- id: 70
  category: license_system
  question: ¿Qué debe hacer un conductor para eliminar la restricción de 'Solo vehículos
    de flota' (Fleet Vehicles Only) de su licencia?
  choices:
    A: Pagar una tarifa de duplicado de $16.75 y presentar prueba de responsabilidad
      financiera
    B: Aprobar un nuevo examen práctico de manejo y pagar una tarifa de $20
    C: Esperar 30 días y presentar un nuevo formulario DL-123A
    D: Entregar su licencia y solicitar un Privilegio de Conducción Limitado
  answer: A
  explanation: Para eliminar la restricción, el conductor debe pagar una tarifa de
    duplicado de $16.75 y presentar prueba de responsabilidad financiera.
- id: 71
  category: license_system
  question: ¿Qué categoría debe reflejarse en un Documento de Autorización de Empleo
    para que un solicitante de Acción Diferida para los Llegados en la Infancia (DACA)
    demuestre presencia legal?
  choices:
    A: Categoría A12
    B: Categoría C33
    C: Categoría F1
    D: Categoría J2
  answer: B
  explanation: La Tabla 6 establece que los solicitantes de DACA deben presentar un
    Documento de Autorización de Empleo que refleje la Categoría C33.
- id: 72
  category: license_system
  question: Si utiliza un formulario W-2 para comprobar su Número de Seguro Social,
    ¿cuál es un requisito específico para el formulario?
  choices:
    A: Debe estar notariado por un funcionario del estado
    B: Debe tener menos de 30 días de antigüedad
    C: No debe estar censurado y debe contener el número de seguro social completo
    D: Debe ir acompañado de un talón de pago
  answer: C
  explanation: La Tabla 2 establece que un formulario W-2 no debe estar censurado
    (ni tener partes ocultas) y debe contener el número de seguro social completo.
- id: 73
  category: license_system
  question: ¿Qué documentación se requiere para obtener una tarjeta de identificación
    gratuita (No Fee ID) basada en una discapacidad del desarrollo?
  choices:
    A: Una carta de un proveedor de atención primaria
    B: Una carta de un médico
    C: Una identificación militar de EE. UU. válida y vigente
    D: Un historial de vehículos motorizados de NC certificado
  answer: A
  explanation: La Tabla 8 establece que un solicitante con una discapacidad del desarrollo
    debe presentar una carta de un proveedor de atención primaria para obtener una
    identificación gratuita (No Fee ID).
- id: 74
  category: license_system
  question: ¿Se requiere comprobante de seguro de responsabilidad civil para alguien
    a quien el tribunal le ha otorgado un Privilegio de Conducir Limitado (Limited
    Driving Privilege)?
  choices:
    A: No, solo se requiere para licencias originales
    B: Sí, se requiere un comprobante impreso de seguro de responsabilidad civil para
      automóviles
    C: No, la orden judicial sirve como comprobante de seguro
    D: Sí, pero solo si poseen un vehículo de flotilla
  answer: B
  explanation: El manual establece que el comprobante de cobertura de seguro de responsabilidad
    civil se aplica a aquellos a quienes el tribunal les ha otorgado un Privilegio
    de Conducir Limitado.
- id: 75
  category: license_system
  question: ¿Qué restricción se le impone a un conductor que firma una certificación
    de exención (DL-123A)?
  choices:
    A: Conducción diurna únicamente
    B: Solo vehículos de flotilla (Fleet Vehicles Only)
    C: Transmisión automática únicamente
    D: Prohibido conducir en autopistas interestatales
  answer: B
  explanation: Según el manual, la exención DL-123A restringe al conductor a operar
    'Solo vehículos de flotilla' (Fleet Vehicles Only).
- id: 76
  category: license_system
  question: ¿Cómo puede identificar visualmente una licencia de conducir o tarjeta
    de identificación REAL ID de Carolina del Norte?
  choices:
    A: Tiene un borde dorado
    B: Tiene una estrella
    C: Está impresa verticalmente
    D: Muestra un holograma del sello del estado
  answer: B
  explanation: El manual establece que una REAL ID es una licencia de conducir, permiso
    de aprendizaje o tarjeta de identificación con una estrella.
- id: 77
  category: license_system
  question: ¿Qué texto exige la ley federal que se muestre en la parte frontal de
    una licencia o tarjeta de identificación que no es REAL ID?
  choices:
    A: NOT VALID FOR VOTING
    B: STATE USE ONLY
    C: NOT FOR FEDERAL IDENTIFICATION
    D: TEMPORARY IDENTIFICATION
  answer: C
  explanation: Como lo exige la ley federal, las licencias y tarjetas de identificación
    que no son REAL ID mostrarán 'NOT FOR FEDERAL IDENTIFICATION' en la parte frontal
    de la tarjeta.
- id: 78
  category: license_system
  question: ¿Cuántos días tiene un nuevo residente para obtener una licencia de conducir
    o un permiso de aprendizaje de Carolina del Norte después de establecer su residencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Un nuevo residente tiene 60 días después de establecer su residencia
    para obtener una licencia o permiso de aprendizaje de Carolina del Norte.
- id: 79
  category: license_system
  question: Si usted tiene una licencia de conducir comercial (CDL) de otra jurisdicción,
    ¿cuánto tiempo tiene para solicitar una CDL de Carolina del Norte después de convertirse
    en residente?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Si usted tiene una licencia de conducir comercial de otra jurisdicción,
    debe solicitar y recibir una licencia comercial de Carolina del Norte dentro de
    los 30 días posteriores a convertirse en residente.
- id: 80
  category: driver_testing
  question: ¿Cuál de los siguientes NO se menciona como un posible requisito de examen
    para un nuevo residente que solicita una Licencia Clase C?
  choices:
    A: Examen de la vista
    B: Examen de reconocimiento de señales de tránsito
    C: Examen de ensayo escrito
    D: Examen de conocimientos
  answer: C
  explanation: El manual enumera el examen de conocimientos, el examen de la vista,
    el examen de reconocimiento de señales de tránsito y el examen de habilidades
    de manejo como posibles requisitos. No se requiere un examen de ensayo escrito.
- id: 81
  category: license_system
  question: ¿Cuál de las siguientes personas se considera un no residente de Carolina
    del Norte?
  choices:
    A: Una persona que ha vivido en Carolina del Norte durante 2 años
    B: Un estudiante universitario de otro estado que tiene la intención de regresar
      a su estado de origen
    C: Una persona que recientemente compró una casa permanente en Carolina del Norte
    D: Un conductor comercial que acaba de transferir su licencia de conducir comercial
      (CDL) a Carolina del Norte
  answer: B
  explanation: Los ejemplos de no residentes incluyen estudiantes universitarios de
    otros estados que tienen la intención de regresar a sus estados de origen al finalizar
    su educación en Carolina del Norte.
- id: 82
  category: license_system
  question: Cuando usted toma los exámenes requeridos y se toma la foto en una oficina
    local de licencias de conducir, ¿por cuánto tiempo es válido su certificado de
    manejo temporal?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: D
  explanation: Los clientes que toman los exámenes requeridos y se toman la foto en
    la oficina local de licencias de conducir recibirán un certificado de manejo temporal
    válido por 60 días.
- id: 83
  category: license_system
  question: ¿Qué formato utiliza el DMV para las licencias de conducir y tarjetas
    de identificación emitidas a solicitantes menores de 21 años?
  choices:
    A: Formato horizontal
    B: Formato vertical
    C: Formato cuadrado
    D: Formato en blanco y negro
  answer: B
  explanation: El DMV emite una licencia/tarjeta de identificación vertical a los
    solicitantes menores de 21 años.
- id: 84
  category: license_system
  question: ¿Qué indican las barras de color rojo y amarillo en una licencia emitida
    a un solicitante menor de 18 años?
  choices:
    A: Las fechas en que cumplen 18 y 21 años
    B: Su elegibilidad para una licencia comercial
    C: Su estatus como estudiante de manejo
    D: Las fechas en que vence el registro de su vehículo
  answer: A
  explanation: Los solicitantes menores de 18 años reciben licencias/tarjetas de identificación
    con dos barras de color, rojo y amarillo, junto a su foto, que indican sus cumpleaños
    número 18 y 21.
- id: 85
  category: license_system
  question: ¿Con cuánta anticipación se puede renovar una licencia de conducir de
    Carolina del Norte antes de su fecha de vencimiento?
  choices:
    A: Hasta 30 días
    B: Hasta 60 días
    C: Hasta 180 días
    D: Hasta 365 días
  answer: C
  explanation: Una licencia de conducir puede ser renovada en cualquier momento dentro
    de los 180 días previos a su vencimiento.
- id: 86
  category: license_system
  question: Para ser elegible para renovar una licencia estándar Clase C por correo,
    ¿qué edad NO debe superar un residente en la fecha de la solicitud?
  choices:
    A: '65'
    B: '70'
    C: '72'
    D: '75'
  answer: C
  explanation: Uno de los requisitos para renovar por correo es que el cliente no
    debe ser mayor de 72 años en la fecha de la solicitud de renovación por correo.
- id: 87
  category: license_system
  question: ¿Cuántas veces durante la vida del titular de la licencia se puede renovar
    por correo una licencia de conducir con designación militar?
  choices:
    A: Una vez
    B: No más de dos veces
    C: Hasta tres veces
    D: Veces ilimitadas
  answer: B
  explanation: Una licencia de conducir con designación militar puede renovarse no
    más de dos veces durante la vida del titular de la licencia.
- id: 88
  category: license_system
  question: ¿Qué documento puede presentar un veterano militar en su oficina local
    de licencias de conducir para demostrar que fue dado de baja con honores y recibir
    la designación de 'VETERAN' (VETERANO)?
  choices:
    A: Un talón de pago reciente
    B: Un formulario de baja DD-214
    C: Una tarjeta de registro de votante
    D: Un certificado de nacimiento
  answer: B
  explanation: Los veteranos que estén interesados en solicitar la designación deben
    llevar su formulario de baja DD-214 a su oficina local de licencias de conducir
    para demostrar que han sido dados de baja con honores.
- id: 89
  category: license_system
  question: ¿Cuál es el costo adicional para obtener una REAL ID de Carolina del Norte
    en comparación con una licencia de conducir estándar?
  choices:
    A: $10.00
    B: $15.50
    C: $16.75
    D: No hay costo adicional
  answer: D
  explanation: El manual establece explícitamente que todas las tarifas actuales para
    nuevas emisiones, renovaciones y duplicados son las mismas, y no hay costo adicional
    por una REAL ID de Carolina del Norte.
- id: 90
  category: license_system
  question: ¿Cuál es la tarifa de una tarjeta de identificación del estado para un
    residente que tiene 17 años o más?
  choices:
    A: $6.50
    B: $16.75
    C: $25.50
    D: No hay tarifa
  answer: D
  explanation: Según el manual, no hay tarifa para una tarjeta de identificación del
    estado para los residentes que tienen al menos 17 años, son legalmente ciegos
    o no tienen hogar.
- id: 91
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir para una persona
    que tiene 66 años en el momento de su emisión?
  choices:
    A: 3 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: B
  explanation: El manual establece que para una persona de 66 años o más en el momento
    de la emisión, la duración de la licencia es de 5 años.
- id: 92
  category: license_system
  question: ¿Cuántos días tiene para notificar al DMV y obtener un duplicado de su
    licencia si cambia de dirección?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Si su dirección cambia con respecto a la que aparece en su licencia
    de conducir, debe notificar el cambio a la división dentro de 60 días y obtener
    un duplicado de la licencia.
- id: 93
  category: license_system
  question: Antes de cambiar su nombre en el DMV, ¿cuánto tiempo debe esperar después
    de visitar su oficina local de la Administración del Seguro Social?
  choices:
    A: Al menos 24 horas
    B: Al menos 48 horas
    C: Al menos 7 días
    D: Al menos 30 días
  answer: A
  explanation: El manual indica a los conductores que visiten su oficina local de
    la Administración del Seguro Social al menos 24 horas antes de cambiar su nombre
    en el DMV para que el sistema de verificación en línea pueda actualizarse.
- id: 94
  category: alcohol_drugs_health
  question: Según las investigaciones, ¿a qué concentración de alcohol en la sangre
    (BAC) comienza a aumentar el riesgo de verse involucrado en un accidente?
  choices:
    A: 0.02 por ciento
    B: 0.04 por ciento
    C: 0.05 por ciento
    D: 0.08 por ciento
  answer: C
  explanation: Las investigaciones muestran que el riesgo de verse involucrado en
    un accidente aumenta cuando el nivel de alcohol es del 0.05 por ciento.
- id: 95
  category: penalties_and_points
  question: ¿Cuál es la sanción por negarse a someterse a una prueba química obligatoria
    de aliento o sangre?
  choices:
    A: Revocación inmediata por 10 días y una multa de $500
    B: Revocación inmediata por al menos 30 días y una revocación adicional mínima
      de 12 meses
    C: Una advertencia por la primera infracción y una suspensión de 6 meses por la
      segunda
    D: Revocación inmediata por 6 meses sin posibilidad de privilegios de conducción
      limitados
  answer: B
  explanation: Negarse a realizar cualquier prueba obligatoria resultará en la revocación
    inmediata de su licencia de conducir por al menos 30 días y una revocación adicional
    mínima de 12 meses por parte del DMV.
- id: 96
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en la sangre (BAC)
    para un conductor que opera un Vehículo Motorizado Comercial?
  choices:
    A: 0.02 por ciento
    B: 0.04 por ciento
    C: 0.06 por ciento
    D: 0.08 por ciento
  answer: B
  explanation: Conducir bajo los efectos del alcohol puede comprobarse con una concentración
    de alcohol en la sangre del 0.08 por ciento o más, o del 0.04 o más si conduce
    un Vehículo Motorizado Comercial.
- id: 97
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes acciones está prohibida bajo las leyes de DWI
    de Carolina del Norte?
  choices:
    A: Transportar un envase abierto de una bebida alcohólica en el maletero de un
      automóvil
    B: Transportar un envase abierto de una bebida alcohólica en el área de pasajeros
      de un automóvil
    C: Transportar envases cerrados de alcohol en un vehículo personal
    D: Consumir bebidas no alcohólicas mientras se conduce
  answer: B
  explanation: Las leyes de DWI prohíben el transporte de un envase abierto de cualquier
    bebida alcohólica, incluso en el área de pasajeros del automóvil.
- id: 98
  category: penalties_and_points
  question: ¿Cuál es un requisito obligatorio para una persona condenada por un DWI
    por segunda vez?
  choices:
    A: Debe entregar su vehículo al estado
    B: Debe cumplir una condena en la cárcel
    C: Debe perder permanentemente su licencia de conducir
    D: Debe pagar una multa de $10,000
  answer: B
  explanation: Las leyes de DWI de Carolina del Norte exigen que las personas condenadas
    por DWI por segunda vez cumplan una condena en la cárcel.
- id: 99
  category: license_system
  question: ¿Cómo se indica la participación en el Programa de Donantes de Órganos
    en una licencia de conducir o tarjeta de identificación de Carolina del Norte?
  choices:
    A: Con el símbolo de una cruz roja en el reverso
    B: Con el símbolo de un corazón en el anverso
    C: Con la palabra 'DONOR' (DONANTE) impresa en letras rojas en negrita
    D: Con el símbolo de un lazo verde en el anverso
  answer: B
  explanation: Las licencias de conducir y tarjetas de identificación de los donantes
    llevan el símbolo de un corazón en el anverso de sus tarjetas, lo que representa
    su consentimiento para ser donantes de órganos y ojos.
- id: 100
  category: license_system
  question: ¿Cuántos documentos de identificación aprobados por el DMV debe mostrar
    a un examinador para reemplazar una licencia de conducir perdida o robada en persona?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para reemplazar una licencia perdida o robada, puede mostrarle al examinador
    dos documentos de identificación aprobados por el DMV.
- id: 101
  category: alcohol_drugs_health
  question: ¿Qué estableció la Ley de Carreteras Seguras (Safe Roads Act) de 1983
    en Carolina del Norte?
  choices:
    A: Creó delitos separados para conducir en estado de ebriedad y conducir bajo
      los efectos de drogas
    B: Reemplazó todas las leyes anteriores sobre conducir en estado de ebriedad con
      un solo delito de Conducir Bajo los Efectos del Alcohol o Drogas (DWI)
    C: Legalizó el transporte de envases abiertos en el área de pasajeros
    D: Redujo el límite legal de concentración de alcohol en la sangre (BAC) para
      todos los conductores al 0.04 por ciento
  answer: B
  explanation: La Ley de Carreteras Seguras derogó todas las leyes anteriores sobre
    conducir en estado de ebriedad en Carolina del Norte y las reemplazó con un solo
    delito de 'Conducir Bajo los Efectos del Alcohol o Drogas (DWI)'.
- id: 102
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restauración por una suspensión de licencia relacionada
    con el alcohol?
  choices:
    A: $25.50
    B: $51.50
    C: $83.50
    D: $167.25
  answer: D
  explanation: Según la Lista de Tarifas, la Tarifa de Restauración (por alcohol)
    es de $167.25.
- id: 103
  category: alcohol_drugs_health
  question: ¿Cuál es la regla con respecto a las bebidas alcohólicas en el área de
    pasajeros de un vehículo comercial?
  choices:
    A: Solo se permiten envases cerrados
    B: Solo están prohibidos los envases abiertos
    C: Están prohibidos tanto los envases abiertos como los cerrados
    D: Están permitidas si se guardan en una hielera
  answer: C
  explanation: Las leyes de DWI prohíben la posesión de bebidas alcohólicas (abiertas
    o cerradas) en el área de pasajeros de un vehículo comercial mientras se encuentre
    en cualquier carretera, calle o área pública vehicular.
- id: 104
  category: license_system
  question: ¿Por cuántos años es válida una licencia de conducir si se emite a una
    persona de 30 años de edad?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Para las personas de entre 18 y 65 años en el momento de la emisión,
    la duración de la licencia es de 8 años.
- id: 105
  category: license_system
  question: Según la ley de Carolina del Norte, ¿qué solicitantes deben dar su consentimiento
    para registrarse en el Sistema de Servicio Selectivo (Selective Service System)
    al solicitar una licencia de conducir o una tarjeta de identificación?
  choices:
    A: Todos los ciudadanos, hombres y mujeres, menores de 30 años
    B: Cualquier hombre ciudadano estadounidense o inmigrante entre las edades de
      18 y 25 años
    C: Cualquier hombre ciudadano mayor de 21 años
    D: Solo los hombres inmigrantes entre las edades de 18 y 25 años
  answer: B
  explanation: El manual establece que el DMV debe notificar a cualquier hombre ciudadano
    estadounidense o inmigrante de entre 18 y 25 años que su solicitud sirve como
    su consentimiento para registrarse en el Sistema de Servicio Selectivo.
- id: 106
  category: license_system
  question: Si el DMV verifica que una persona está actualmente registrada como delincuente
    sexual, ¿cuál de los siguientes endosos NO se le emitirá en una Licencia de Conducir
    Comercial?
  choices:
    A: Materiales Peligrosos (H) o Vehículo Cisterna (N)
    B: Pasajeros (P) o Autobús Escolar (S)
    C: Remolques Dobles/Triples (T)
    D: Frenos de Aire (L)
  answer: B
  explanation: Si la División verifica que la persona está actualmente registrada
    como delincuente sexual en Carolina del Norte o en cualquier otro estado, la División
    no emitirá una Licencia de Conducir Comercial con el endoso de Pasajeros (P) o
    Autobús Escolar (S).
- id: 107
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera condena por Conducir Bajo los Efectos
    del Alcohol o Drogas (DWI) en Carolina del Norte?
  choices:
    A: Revocación obligatoria de su licencia de conducir por un período de un año
    B: Revocación obligatoria de su licencia de conducir por seis meses
    C: Una suspensión de 60 días de su privilegio de conducir
    D: Instalación obligatoria de un dispositivo de bloqueo de encendido (ignition
      interlock device) por dos años
  answer: A
  explanation: Según el manual, una primera condena por DWI resulta en la revocación
    obligatoria de su licencia de conducir por un período de un año.
- id: 108
  category: penalties_and_points
  question: 'Una cuarta condena por DWI se considera un delito grave (felony) si las
    tres condenas previas por DWI ocurrieron en los últimos:'
  choices:
    A: 3 años
    B: 5 años
    C: 7 años
    D: 10 años
  answer: C
  explanation: 'El manual establece: ''Cuarta condena: Revocación permanente y obligatoria
    de la licencia de conducir. La cuarta condena se considera un delito grave si
    las tres condenas previas por DWI ocurrieron en los últimos siete años''.'
- id: 109
  category: alcohol_drugs_health
  question: ¿Cuál será la restricción de concentración de alcohol en la sangre (BAC)
    en la primera restauración de una licencia después de una suspensión por DWI?
  choices:
    A: '0.00'
    B: '0.04'
    C: '0.08'
    D: '0.15'
  answer: B
  explanation: En la primera restauración después de una suspensión por DWI, la restricción
    de concentración de alcohol será de 0.04.
- id: 110
  category: penalties_and_points
  question: 'Se requiere instalar un dispositivo de bloqueo de encendido (ignition
    interlock device) en el vehículo si un conductor es condenado por Conducir Bajo
    los Efectos del Alcohol o Drogas (DWI) con un BAC de al menos:'
  choices:
    A: '0.04'
    B: '0.08'
    C: '0.10'
    D: '0.15'
  answer: D
  explanation: Una condena por Conducir Bajo los Efectos del Alcohol o Drogas con
    un BAC de 0.15 o más, u otra condena en los últimos siete años, requerirá la instalación
    de un dispositivo de bloqueo de encendido en el vehículo.
- id: 111
  category: alcohol_drugs_health
  question: 'Si un conductor menor de 21 años es condenado por conducir con cualquier
    cantidad de alcohol o drogas en su cuerpo, su licencia será revocada por:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Si un conductor menor de 21 años es condenado por el delito de conducir
    con cualquier cantidad de alcohol o drogas en su cuerpo, su licencia será revocada
    por un año.
- id: 112
  category: penalties_and_points
  question: ¿Cuántos puntos en la licencia de conducir debe acumular antes de que
    se le pueda asignar a una clínica de mejoramiento para conductores?
  choices:
    A: 5 puntos
    B: 7 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Si acumula siete puntos, se le puede asignar a una clínica de mejoramiento
    para conductores.
- id: 113
  category: penalties_and_points
  question: ¿Cuántos puntos debe acumular en un período de tres años para que su licencia
    de conducir pueda ser suspendida?
  choices:
    A: 7 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: Si acumula hasta 12 puntos en un período de tres años, su licencia
    puede ser suspendida.
- id: 114
  category: penalties_and_points
  question: Si su licencia de conducir es suspendida por el sistema de puntos por
    primera vez, ¿por cuánto tiempo se le puede retirar?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 12 meses
  answer: B
  explanation: Si su licencia de conducir es suspendida por el sistema de puntos,
    se le puede retirar por 60 días en la primera suspensión.
- id: 115
  category: penalties_and_points
  question: ¿Cuántos puntos en la licencia de conducir se otorgan por una condena
    por rebasar a un autobús escolar detenido en un vehículo motorizado estándar (no
    comercial)?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 8 puntos
  answer: C
  explanation: Según la tabla regular de valores de puntos, rebasar a un autobús escolar
    detenido tiene un valor de 5 puntos.
- id: 116
  category: penalties_and_points
  question: ¿Cuántos puntos se imponen por rebasar a un autobús escolar detenido mientras
    se opera un vehículo motorizado comercial?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: Según la tabla de valores de puntos por infracciones mientras se opera
    un vehículo motorizado comercial, rebasar a un autobús escolar detenido tiene
    un valor de 8 puntos.
- id: 117
  category: penalties_and_points
  question: ¿Por cuál de las siguientes infracciones NO se impondrán puntos en la
    licencia de conducir?
  choices:
    A: Seguir muy de cerca a otro vehículo
    B: Estacionamiento ilegal
    C: Pasarse una señal de alto
    D: No sujetar adecuadamente a un niño con el cinturón de seguridad
  answer: B
  explanation: El manual enumera varias infracciones por las cuales no se impondrán
    puntos, incluyendo el 'Estacionamiento ilegal'.
- id: 118
  category: penalties_and_points
  question: ¿Cuál es la sanción para cualquier persona que permita que su licencia
    de conducir sea utilizada por un menor de edad para comprar una bebida alcohólica?
  choices:
    A: Una suspensión de la licencia por 30 días
    B: Una suspensión de la licencia por 6 meses
    C: Una revocación de la licencia de conducir por un año
    D: Una revocación permanente de la licencia de conducir
  answer: C
  explanation: La ley exige la revocación de la licencia de conducir por un año tras
    la condena de cualquier persona que permita que su licencia de conducir o cualquier
    otra identificación sea utilizada por un menor de edad para comprar o intentar
    comprar una bebida alcohólica.
- id: 119
  category: penalties_and_points
  question: ¿El DMV puede suspender su licencia de conducir si recibe dos condenas
    en un período de 12 meses por cuál de las siguientes infracciones?
  choices:
    A: Exceso de velocidad a más de 55 mph
    B: Seguir muy de cerca a otro vehículo
    C: Pasarse un semáforo en rojo
    D: Conducir en el lado equivocado de la vía
  answer: A
  explanation: El DMV puede suspender su licencia por dos condenas por exceso de velocidad
    a más de 55 mph en un período de 12 meses.
- id: 120
  category: penalties_and_points
  question: Según la ley de Carolina del Norte, ¿por cuál de las siguientes razones
    el DMV puede suspender su licencia?
  choices:
    A: Una condena por exceso de velocidad a más de 45 mph
    B: Dos condenas por exceso de velocidad a más de 55 mph en un período de 12 meses
    C: Una condena por exceso de velocidad a más de 50 mph en 6 meses
    D: Tres condenas por exceso de velocidad a más de 40 mph en 2 años
  answer: B
  explanation: El DMV puede suspender su licencia por dos condenas por exceso de velocidad
    a más de 55 mph en un período de 12 meses.
- id: 121
  category: penalties_and_points
  question: 'Su privilegio de conducir será revocado por al menos 30 días si es condenado
    por conducir cualquier vehículo a más de 15 millas por hora por encima del límite
    de velocidad, siempre y cuando conduzca a una velocidad superior a:'
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: Su privilegio de conducir será revocado por al menos 30 días si es
    condenado por conducir cualquier vehículo a más de 15 millas por hora por encima
    del límite de velocidad, si conduce a una velocidad superior a 55 mph.
- id: 122
  category: penalties_and_points
  question: ¿Cuál es el tiempo de suspensión por una condena por participar en una
    carrera preacordada con otro vehículo motorizado en la carretera?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: D
  explanation: Una condena por participar en una carrera preacordada con otro vehículo
    motorizado en la carretera resulta en una suspensión de 3 años.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por homicidio involuntario mientras se está bajo la
    influencia de una sustancia que altera las capacidades?
  choices:
    A: Suspensión de 1 año
    B: Suspensión de 3 años
    C: Suspensión de 5 años
    D: Suspensión permanente
  answer: D
  explanation: Según la tabla de tiempos de suspensión, el homicidio involuntario
    mientras se está bajo la influencia de una sustancia que altera las capacidades
    resulta en una suspensión permanente.
- id: 124
  category: penalties_and_points
  question: ¿Cuál es la sanción por no ceder el derecho de paso al entrar a una intersección
    y que resulte en lesiones corporales graves?
  choices:
    A: Suspensión de 30 días y multa de $100
    B: Suspensión de 60 días y multa de $250
    C: Suspensión de 90 días y multa de $500
    D: Suspensión de 1 año y multa de $1000
  answer: C
  explanation: No ceder el derecho de paso y causar lesiones corporales graves conlleva
    una sanción de suspensión de 90 días y una multa de $500.
- id: 125
  category: driver_responsibility
  question: Si cree que su privilegio de conducir no debería haber sido revocado y
    una audiencia del DMV no le ayuda, ¿cuánto tiempo tiene para apelar la decisión
    ante el Tribunal Superior (Superior Court)?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Puede apelar la decisión del DMV dentro de los 30 días ante el Tribunal
    Superior del condado donde vive.
- id: 126
  category: penalties_and_points
  question: ¿Cómo maneja el DMV de Carolina del Norte las condenas de tránsito que
    ocurren fuera del estado?
  choices:
    A: Se ignoran a menos que involucren una fatalidad.
    B: Pueden resultar en la suspensión o revocación de su licencia tal como si las
      infracciones hubieran ocurrido en Carolina del Norte.
    C: Solo agregan puntos a su licencia pero no pueden causar una suspensión.
    D: Requieren que vuelva a tomar el examen de manejo pero no conllevan otras sanciones.
  answer: B
  explanation: Las condenas que ocurren fuera de Carolina del Norte pueden resultar
    en la suspensión o revocación de su licencia tal como si las infracciones hubieran
    ocurrido en este estado.
- id: 127
  category: license_system
  question: 'Si usted es un titular de licencia provisional (menor de 18 años), su
    licencia puede ser suspendida por 90 días tras ser condenado por:'
  choices:
    A: Una primera infracción en movimiento dentro de un período de 12 meses.
    B: Una segunda infracción en movimiento dentro de un período de 12 meses.
    C: Una tercera infracción en movimiento dentro de un período de 12 meses.
    D: Una cuarta infracción en movimiento dentro de un período de 12 meses.
  answer: C
  explanation: La licencia de un titular provisional puede ser suspendida por 90 días
    tras ser condenado por una tercera infracción en movimiento que ocurra dentro
    de un período de 12 meses.
- id: 128
  category: penalties_and_points
  question: ¿Cuál es la tarifa estándar de restauración requerida por la ley de Carolina
    del Norte para anular una suspensión o revocación (excluyendo condenas por DWI
    o razones médicas)?
  choices:
    A: $50.00
    B: $83.50
    C: $167.25
    D: $200.00
  answer: B
  explanation: La ley de Carolina del Norte requiere que se pague una tarifa de restauración
    de $83.50 al DMV antes de que se pueda anular una suspensión o revocación.
- id: 129
  category: alcohol_drugs_health
  question: ¿De cuánto es la tarifa de restauración cuando la revocación de la licencia
    de conducir resulta de una condena por conducir en estado de ebriedad (DWI)?
  choices:
    A: $50.00
    B: $83.50
    C: $167.25
    D: $250.00
  answer: C
  explanation: Se requiere una tarifa de restauración de $167.25 cuando la revocación
    resulta de una condena por conducir en estado de ebriedad (DWI).
- id: 130
  category: penalties_and_points
  question: 'Al restaurar una licencia de conducir revocada o suspendida, se requiere
    una tarifa de servicio de $50 A MENOS QUE:'
  choices:
    A: El conductor complete un curso de manejo defensivo.
    B: El conductor sea menor de 18 años.
    C: La licencia haya sido entregada al tribunal o enviada por correo al DMV antes
      de la fecha de vigencia de la suspensión.
    D: El conductor pague la tarifa de restauración en efectivo.
  answer: C
  explanation: Se requiere una tarifa de servicio de $50 al momento de la restauración
    a menos que la licencia haya sido entregada al tribunal o enviada por correo al
    DMV antes de la fecha de vigencia de la suspensión o revocación.
- id: 131
  category: defensive_driving
  question: Según el manual, a 55 mph, ¿en cuánto tiempo recorre un vehículo la longitud
    de un campo de fútbol americano?
  choices:
    A: 2.5 segundos
    B: 3.7 segundos
    C: 4.2 segundos
    D: 5.0 segundos
  answer: B
  explanation: A 55 mph, un vehículo recorre la longitud de un campo de fútbol americano
    en 3.7 segundos.
- id: 132
  category: defensive_driving
  question: ¿Cuál de las siguientes es una señal de advertencia de conducir con sueño?
  choices:
    A: No puede recordar las últimas millas conducidas.
    B: Está agarrando el volante con demasiada fuerza.
    C: Está revisando sus espejos con más frecuencia de lo habitual.
    D: Siente la necesidad de aumentar su velocidad.
  answer: A
  explanation: Una señal de advertencia de conducir con sueño es que no puede recordar
    las últimas millas conducidas.
- id: 133
  category: penalties_and_points
  question: Si no puede pagar una multa de tránsito, ¿cuál es el primer paso en la
    Opción A para pedirle al tribunal que reduzca o exima la cantidad adeudada?
  choices:
    A: Llamar al DMV para solicitar un plan de pago.
    B: Completar la Moción de Alivio (AOC-CR-415).
    C: Entregar su licencia de conducir en la estación de policía local.
    D: Enviar por correo una carta de explicación al Tribunal Superior.
  answer: B
  explanation: El paso 1 de la Opción A (NO PUEDO pagar ahora) es completar la Moción
    de Alivio (Motion for Relief), AOC-CR-415.
- id: 134
  category: safe_driving_rules
  question: Para ayudar a prevenir conducir con sueño, ¿cuál es el límite diario de
    conducción recomendado?
  choices:
    A: 100-200 millas
    B: 300-400 millas
    C: 500-600 millas
    D: 700-800 millas
  answer: B
  explanation: El manual recomienda intentar establecer un límite de 300 a 400 millas
    de conducción por día para evitar conducir con sueño.
- id: 135
  category: defensive_driving
  question: Al conducir largas distancias, ¿con qué frecuencia debe detenerse para
    salir del automóvil, estirarse y caminar a paso ligero?
  choices:
    A: Al menos cada 2 horas
    B: Al menos cada 4 horas
    C: Solo cuando necesite cargar combustible
    D: Cada 100 millas
  answer: A
  explanation: Para evitar conducir con sueño, el manual aconseja detenerse regularmente
    al conducir largas distancias y salir del automóvil al menos cada 2 horas para
    estirarse y caminar a paso ligero.
- id: 136
  category: defensive_driving
  question: ¿Por qué las distracciones hacen que sea más difícil realizar maniobras
    preventivas o evasivas para evitar un choque?
  choices:
    A: Aumentan el campo de visión del conductor
    B: Hacen que los frenos del vehículo respondan más lentamente
    C: Muchas distracciones obligan al conductor a quitar al menos una mano del volante
    D: Hacen que el conductor sea demasiado cauteloso
  answer: C
  explanation: El manual indica que las distracciones hacen que sea más difícil realizar
    maniobras preventivas o evasivas para evitar un choque porque muchas distracciones
    obligan al conductor a quitar al menos una mano del volante.
- id: 137
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia puede un conductor menor de 18 años usar un teléfono
    celular mientras el vehículo está en movimiento?
  choices:
    A: Al llamar a un padre o tutor legal
    B: Al usar un dispositivo de manos libres
    C: Al llamar al 911 en una emergencia
    D: Al estar detenido en un semáforo en rojo
  answer: C
  explanation: A los conductores menores de 18 años no se les permite usar un teléfono
    celular mientras el vehículo está en movimiento, con la excepción de llamar al
    911 en una emergencia.
- id: 138
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones es ilegal al operar un vehículo en una
    calle o carretera pública?
  choices:
    A: Escuchar la radio
    B: Usar un teléfono celular para correos electrónicos o mensajes de texto
    C: Hablar con los pasajeros
    D: Usar el sistema de control de clima del vehículo
  answer: B
  explanation: El manual establece que es ilegal usar un teléfono celular para correos
    electrónicos o mensajes de texto mientras se opera un vehículo en una calle o
    carretera pública o en un área vehicular pública.
- id: 139
  category: alcohol_drugs_health
  question: ¿Aproximadamente qué porcentaje de todas las muertes por accidentes de
    tránsito involucran alcohol?
  choices:
    A: 15 por ciento
    B: 25 por ciento
    C: 38 por ciento
    D: 50 por ciento
  answer: C
  explanation: Según el manual, alrededor del 38 por ciento de todas las muertes por
    accidentes de tránsito involucran alcohol.
- id: 140
  category: alcohol_drugs_health
  question: Debido a que el alcohol es un depresor, ¿cómo puede afectar su comportamiento
    al conducir?
  choices:
    A: Agudiza su capacidad para juzgar la distancia
    B: Acelera sus funciones cerebrales y tiempos de reacción
    C: Le da una falsa confianza y puede hacer que tome mayores riesgos
    D: Hace que sea más fácil hacer más de una cosa a la vez
  answer: C
  explanation: El alcohol es un depresor que le da una falsa confianza, lo que significa
    que puede tomar mayores riesgos porque cree que su forma de conducir es mejor
    de lo que realmente es.
- id: 141
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de recuperar la sobriedad después de
    beber alcohol?
  choices:
    A: Beber café fuerte
    B: Tomar una ducha fría
    C: Comer una comida abundante
    D: Dejar pasar el tiempo
  answer: D
  explanation: 'El manual establece explícitamente: ''Lo único que le devuelve la
    sobriedad a un bebedor es el tiempo. El café, una comida abundante o las duchas
    frías no funcionarán''.'
- id: 142
  category: safe_driving_rules
  question: ¿Qué afirmación es verdadera con respecto a los cinturones de seguridad
    y las bolsas de aire (airbags)?
  choices:
    A: Los cinturones de seguridad son opcionales si el vehículo tiene bolsas de aire
      frontales
    B: Solo el conductor debe usar el cinturón de seguridad si el vehículo tiene bolsas
      de aire
    C: Todos los ocupantes deben usar cinturones de seguridad incluso si el vehículo
      está equipado con bolsas de aire
    D: Los pasajeros en el asiento trasero no necesitan cinturones de seguridad si
      hay bolsas de aire frontales
  answer: C
  explanation: Según la ley de cinturones de seguridad, todos los ocupantes DEBEN
    usar cinturones de seguridad incluso si el vehículo está equipado con bolsas de
    aire.
- id: 143
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción a la ley de cinturones de seguridad
    de Carolina del Norte?
  choices:
    A: Un conductor que hace paradas de entrega frecuentes cuya velocidad entre paradas
      no excede las 20 mph
    B: Un pasajero que viaja en el asiento trasero de un automóvil de pasajeros
    C: Un conductor que opera un vehículo fabricado después de 2010
    D: Un conductor que viaja a menos de 5 millas de su casa
  answer: A
  explanation: Una excepción a la ley de cinturones de seguridad incluye a un conductor
    o pasajero que se detiene y sale del vehículo con frecuencia o que entrega bienes,
    si la velocidad del vehículo entre paradas no excede las 20 millas por hora.
- id: 144
  category: driver_responsibility
  question: ¿Cuál es la principal amenaza para la vida de los niños pequeños?
  choices:
    A: Venenos domésticos
    B: Accidentes automovilísticos
    C: Ahogamiento
    D: Peligros de incendio
  answer: B
  explanation: El manual indica que la principal amenaza para la vida de los niños
    pequeños son los accidentes automovilísticos.
- id: 145
  category: safe_driving_rules
  question: Un niño debe estar asegurado adecuadamente en un sistema de retención
    infantil apropiado para su peso si es menor de ¿qué edad y peso?
  choices:
    A: Menor de 6 años y con un peso de menos de 60 libras
    B: Menor de 7 años y con un peso de menos de 70 libras
    C: Menor de 8 años y con un peso de menos de 80 libras
    D: Menor de 9 años y con un peso de menos de 90 libras
  answer: C
  explanation: Un niño menor de 8 años y que pese menos de 80 libras debe estar asegurado
    adecuadamente en un sistema de retención infantil apropiado para su peso.
- id: 146
  category: safe_driving_rules
  question: ¿Dónde debe asegurarse a un niño menor de 5 años y que pese menos de 40
    libras si el vehículo tiene una bolsa de aire frontal activa en el lado del pasajero
    y un asiento trasero?
  choices:
    A: En el asiento del pasajero delantero con el asiento empujado completamente
      hacia atrás
    B: En el asiento trasero
    C: En el asiento del pasajero delantero usando solo un cinturón de regazo
    D: En el área de carga de un SUV
  answer: B
  explanation: Si el vehículo está equipado con una bolsa de aire frontal activa en
    el lado del pasajero y tiene un asiento trasero, un niño menor de 5 años y que
    pese menos de 40 libras debe estar asegurado adecuadamente en el asiento trasero
    (a menos que el sistema de retención esté diseñado para usarse con una bolsa de
    aire frontal).
- id: 147
  category: driver_responsibility
  question: Durante una vida promedio de conducción, ¿cuál es la probabilidad aproximada
    de resultar gravemente herido o morir en un accidente automovilístico?
  choices:
    A: Una de cada dos
    B: Una de cada tres
    C: Una de cada cinco
    D: Una de cada diez
  answer: B
  explanation: Durante una vida promedio de conducción, enfrentamos aproximadamente
    una probabilidad de una de cada tres de resultar gravemente heridos o morir en
    un accidente automovilístico.
- id: 148
  category: safe_driving_rules
  question: ¿A qué velocidad puede salir una bolsa de aire del tablero durante un
    choque?
  choices:
    A: Hasta 50 millas por hora
    B: Hasta 100 millas por hora
    C: Hasta 150 millas por hora
    D: Hasta 200 millas por hora
  answer: D
  explanation: Para hacer su importante trabajo, una bolsa de aire sale del tablero
    a una velocidad de hasta 200 millas por hora, más rápido que un abrir y cerrar
    de ojos.
- id: 149
  category: safe_driving_rules
  question: Según el manual, ¿los niños de qué edad deben viajar abrochados en un
    asiento trasero?
  choices:
    A: De 8 años o menos
    B: De 10 años o menos
    C: De 12 años o menos
    D: De 15 años o menos
  answer: C
  explanation: Los Puntos de Seguridad Infantil establecen que los niños de 12 años
    o menos deben viajar abrochados en un asiento trasero.
- id: 150
  category: vehicle_information
  question: ¿Cuál de las siguientes es una característica de un casco de motocicleta
    legal?
  choices:
    A: Un acolchado de espuma suave y delgado
    B: Una calcomanía del DOT comprada por separado y colocada por el motociclista
    C: Un revestimiento interior grueso de espuma de poliestireno de aproximadamente
      una pulgada de grosor
    D: Sin etiqueta del fabricante para reducir el peso
  answer: C
  explanation: Un casco legal incluye un revestimiento interior grueso que contiene
    una capa interior firme de espuma de poliestireno de aproximadamente una pulgada
    de grosor.
- id: 151
  category: safe_driving_rules
  question: Según la ley de Carolina del Norte, ¿a los niños menores de qué edad se
    les prohíbe generalmente viajar en la caja abierta de una camioneta (pick-up)?
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: La ley de Carolina del Norte prohíbe a los niños menores de 16 años
    viajar en la caja abierta de una camioneta (pick-up).
- id: 152
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar la ley sobre el transporte de niños en
    la parte trasera de una camioneta (pick-up)?
  choices:
    A: Una multa de $25 y puntos en la licencia de conducir
    B: Una multa de $25, sin costos de corte ni puntos en la licencia de conducir
    C: Una multa de $100 y un recargo en el seguro
    D: Una multa de $50 y costos de corte
  answer: B
  explanation: A los infractores se les emiten multas y están sujetos a una sanción
    de $25. Las violaciones a esta ley se definen como 'infracciones' y no incurren
    en costos de corte, puntos en la licencia de conducir ni recargos en el seguro.
- id: 153
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción a la ley que prohíbe a los niños
    viajar en la caja abierta de una camioneta (pick-up)?
  choices:
    A: Si el vehículo viaja a menos de 25 mph
    B: Si el vehículo está siendo operado en un desfile
    C: Si el niño está sentado en la puerta trasera (tailgate)
    D: Si el viaje es de menos de 5 millas
  answer: B
  explanation: Las disposiciones para asegurar adecuadamente a los niños no se aplican
    si el vehículo está siendo operado en un desfile.
- id: 154
  category: safe_driving_rules
  question: ¿Cuánto más puede subir la temperatura dentro de un vehículo estacionado
    en comparación con la temperatura exterior?
  choices:
    A: 10-20 grados
    B: 20-30 grados
    C: 40-50 grados
    D: 60-70 grados
  answer: C
  explanation: La temperatura dentro de un vehículo puede subir aproximadamente entre
    40 y 50 grados más que la temperatura exterior.
- id: 155
  category: vehicle_information
  question: ¿Qué gas invisible, inodoro y venenoso puede acumularse dentro de un automóvil
    si la nieve bloquea el tubo de escape?
  choices:
    A: Dióxido de carbono
    B: Óxido de nitrógeno
    C: Sulfuro de hidrógeno
    D: Monóxido de carbono
  answer: D
  explanation: Durante los meses de invierno, la nieve puede bloquear el tubo de escape
    de un automóvil, y calentar el vehículo puede hacer que el monóxido de carbono
    se acumule en su interior. El monóxido de carbono es un gas invisible que no tiene
    olor, sabor ni color, pero es venenoso.
- id: 156
  category: sharing_the_road
  question: Cuando un semáforo cambia a amarillo o rojo mientras un peatón permanece
    en la calle, ¿qué deben hacer los conductores?
  choices:
    A: Tocar la bocina y avanzar
    B: Desviarse alrededor del peatón
    C: Permitir que el peatón termine de cruzar de manera segura
    D: Retroceder para darle más espacio al peatón
  answer: C
  explanation: Si un semáforo cambia a amarillo o rojo mientras un peatón permanece
    en la calle, los conductores deben permitir que el peatón termine de cruzar de
    manera segura.
- id: 157
  category: sharing_the_road
  question: ¿Cómo otorga la ley consideración especial a un peatón ciego en una intersección
    sin semáforos?
  choices:
    A: Tienen el derecho de paso solo si están acompañados por otra persona
    B: Tienen el derecho de paso cuando extienden un bastón blanco o tienen un perro
      guía
    C: Deben esperar a que un vehículo se detenga y toque la bocina antes de cruzar
    D: Se les exige usar ropa reflectante para tener el derecho de paso
  answer: B
  explanation: La ley otorga consideración especial a un peatón ciego en una intersección
    donde no hay semáforos cuando el peatón extiende un bastón blanco, o un bastón
    blanco con punta roja, o tiene un perro guía.
- id: 158
  category: defensive_driving
  question: ¿Qué exige la ley que hagan los conductores siempre que un peatón pueda
    verse afectado por un giro, una parada o al arrancar desde una posición de estacionamiento?
  choices:
    A: Parpadear las luces delanteras
    B: Usar la bocina
    C: Bajar la ventana y gritar
    D: Encender las luces de emergencia
  answer: B
  explanation: La ley exige a los conductores usar la bocina siempre que un peatón
    pueda verse afectado por un giro, una parada o al arrancar desde una posición
    de estacionamiento.
- id: 159
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para un autobús escolar en Carolina
    del Norte?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: El límite de velocidad máximo para un autobús escolar es de 45 mph.
- id: 160
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene para recoger o dejar pasajeros en
    una carretera de dos carriles, ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se acerca al autobús desde la dirección opuesta
    C: Todo el tráfico en ambas direcciones
    D: Los vehículos que viajan a más de 35 mph
  answer: C
  explanation: 'Carretera de dos carriles: Cuando un autobús escolar se detiene para
    recoger o dejar pasajeros, todo el tráfico en ambas direcciones debe detenerse.'
- id: 161
  category: safe_driving_rules
  question: ¿Cómo debe usarse la parte del regazo del cinturón de seguridad para adultos?
  choices:
    A: Ajustada sobre el estómago
    B: Debajo del abdomen y baja sobre las caderas
    C: Suelta sobre los muslos
    D: Sobre la caja torácica
  answer: B
  explanation: El cinturón de regazo debe usarse debajo del abdomen y bajo sobre las
    caderas.
- id: 162
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene para pasajeros en una carretera de
    cuatro carriles sin separación central (mediana), ¿qué debe hacer el tráfico?
  choices:
    A: Solo el tráfico que sigue al autobús debe detenerse.
    B: Todo el tráfico en ambas direcciones debe detenerse.
    C: El tráfico en la dirección opuesta debe reducir la velocidad a 15 mph.
    D: El tráfico en el carril adyacente debe ceder el paso.
  answer: B
  explanation: Según el manual, en una carretera de cuatro carriles sin separación
    central, cuando un autobús escolar se detiene para pasajeros, todo el tráfico
    en ambas direcciones debe detenerse.
- id: 163
  category: sharing_the_road
  question: En una carretera de cuatro carriles o más con un carril central de giro,
    ¿qué vehículos deben detenerse cuando un autobús escolar se detiene para pasajeros?
  choices:
    A: Todo el tráfico en ambas direcciones.
    B: Solo el tráfico que viaja en la dirección opuesta.
    C: Solo el tráfico que sigue al autobús.
    D: Ningún vehículo está obligado a detenerse si el autobús está en el carril derecho.
  answer: C
  explanation: El manual establece que en una carretera de cuatro carriles o más con
    un carril central de giro, solo el tráfico que sigue al autobús debe detenerse
    cuando un autobús escolar se detiene para pasajeros.
- id: 164
  category: safe_driving_rules
  question: ¿A qué distancia debe estacionarse de un vehículo de emergencia que se
    ha detenido para investigar un accidente o brindar asistencia?
  choices:
    A: Al menos a 50 pies.
    B: Al menos a 100 pies.
    C: Al menos a 200 pies.
    D: Al menos a 500 pies.
  answer: B
  explanation: 'El manual establece explícitamente: ''No se estacione a menos de 100
    pies de un vehículo de emergencia que se haya detenido para investigar un accidente
    o brindar asistencia''.'
- id: 165
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al conducir o estacionarse
    cerca de camiones de bomberos que responden a una alarma de incendio?
  choices:
    A: 100 pies.
    B: 500 pies.
    C: Una cuadra.
    D: Dos cuadras.
  answer: C
  explanation: Los conductores 'no deben conducir ni estacionarse a menos de una cuadra
    de los camiones de bomberos que responden a una alarma de incendio', según el
    manual del conductor.
- id: 166
  category: sharing_the_road
  question: ¿Cuándo NO está obligado a ceder el derecho de paso a un vehículo de emergencia
    que se aproxima?
  choices:
    A: Cuando viaja en dirección opuesta en una carretera de dos carriles.
    B: Cuando viaja en dirección opuesta en una autopista de acceso limitado de cuatro
      carriles con mediana central.
    C: Cuando viaja en la misma dirección en una carretera dividida.
    D: Cuando conduce un vehículo comercial.
  answer: B
  explanation: El requisito de ceder el paso a un vehículo de emergencia que se aproxima
    no se aplica a los vehículos que viajan en dirección opuesta en una autopista
    de acceso limitado de cuatro carriles con mediana central.
- id: 167
  category: safe_driving_rules
  question: ¿Qué debe hacer al acercarse a un vehículo de emergencia estacionado con
    las luces de advertencia activadas en una carretera con al menos dos carriles
    de tráfico en su dirección?
  choices:
    A: Detenerse por completo hasta que el vehículo de emergencia apague sus luces.
    B: Cambiarse a un carril que no sea el más cercano al vehículo y continuar hasta
      pasarlo de manera segura.
    C: Tocar la bocina para alertar a los trabajadores de emergencia y mantener su
      velocidad.
    D: Hacerse a un lado en el arcén derecho y esperar instrucciones.
  answer: B
  explanation: En una carretera con al menos dos carriles en la misma dirección, debe
    cambiar su vehículo a un carril que no sea el más cercano al vehículo de emergencia
    estacionado y continuar hasta pasarlo de manera segura.
- id: 168
  category: safe_driving_rules
  question: Si un oficial de la ley le hace señas para que se detenga pero no hay
    un lugar seguro evidente para detenerse de inmediato, ¿qué debe hacer?
  choices:
    A: Acelerar para llegar rápidamente a la salida más cercana.
    B: Detenerse inmediatamente en el carril de circulación.
    C: Encender las luces intermitentes de emergencia (4-way flashers), reducir la
      velocidad en aproximadamente 10 mph y continuar hasta un área segura.
    D: Apagar los faros y salirse hacia el césped.
  answer: C
  explanation: Si no hay un lugar seguro evidente para detenerse, encienda las luces
    intermitentes de emergencia (4-way flashers) y reduzca su velocidad en aproximadamente
    10 mph para avisarle al oficial, luego continúe hasta el área segura más cercana.
- id: 169
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si un vehículo sin identificación le pide
    que se detenga y usted tiene una preocupación legítima sobre si es un oficial
    de la ley real?
  choices:
    A: Negarse a detenerse y conducir a casa.
    B: Llamar al 9-1-1 antes de detenerse para verificar al oficial.
    C: Detenerse pero negarse a bajar la ventanilla.
    D: Acelerar hasta la estación de policía más cercana.
  answer: B
  explanation: Si un vehículo sin identificación le pide que se detenga y tiene una
    preocupación legítima, puede llamar al 9-1-1 antes de detenerse para verificar
    que un oficial de la ley real esté realizando la parada.
- id: 170
  category: safe_driving_rules
  question: Si un oficial de la ley lo detiene durante la noche, ¿qué debe hacer para
    ayudar con la visibilidad?
  choices:
    A: Encender las luces altas.
    B: Encender las luces interiores tan pronto como se detenga.
    C: Alumbrar con una linterna por la ventana.
    D: Apagar todas las luces del vehículo.
  answer: B
  explanation: Si es de noche, debe encender las luces interiores tan pronto como
    se detenga para ayudar al oficial a ver el interior de su vehículo.
- id: 171
  category: driver_responsibility
  question: Si tiene un permiso de arma oculta y hay un arma en el vehículo durante
    una parada de tráfico, ¿qué debe hacer?
  choices:
    A: Esconder el arma debajo del asiento.
    B: Entregar el arma al oficial inmediatamente.
    C: Informar al oficial de ese hecho.
    D: Colocar el arma en la guantera antes de que el oficial se acerque.
  answer: C
  explanation: Si usted o su(s) pasajero(s) tienen un permiso de arma oculta y hay
    un arma en el vehículo, debe informar al oficial de ese hecho.
- id: 172
  category: penalties_and_points
  question: ¿Qué indica su aceptación y firma en una multa de tráfico?
  choices:
    A: Es una admisión de culpabilidad.
    B: Renuncia a su derecho a una audiencia en la corte.
    C: No es una admisión de culpabilidad.
    D: Significa que está de acuerdo con la decisión del oficial.
  answer: C
  explanation: El manual especifica que su aceptación y firma en una multa de tráfico
    no es una admisión de culpabilidad.
- id: 173
  category: penalties_and_points
  question: 'Según la ley de Carolina del Norte, resistir, retrasar u obstruir a un
    oficial de la ley durante una parada de tráfico se clasifica como:'
  choices:
    A: Delito grave (felony) de Clase 1.
    B: Delito menor (misdemeanor) de Clase 2.
    C: Infracción de tráfico.
    D: Infracción de advertencia.
  answer: B
  explanation: Resistir, retrasar u obstruir a un oficial de la ley durante una parada
    de tráfico es un delito menor de Clase 2 (N.C.G.S. §14-223).
- id: 174
  category: sharing_the_road
  question: ¿Bajo qué condiciones ocurren la mayoría de los choques que involucran
    equipo agrícola?
  choices:
    A: Durante lluvia intensa o nieve en caminos sin pavimentar.
    B: De noche en caminos rurales mal iluminados.
    C: En un día despejado, durante las horas de luz, sobre una superficie pavimentada
      seca.
    D: Durante mañanas con niebla en caminos de grava.
  answer: C
  explanation: La mayoría de los choques que involucran equipo agrícola ocurren en
    un día despejado, durante las horas de luz y/o en una superficie seca que está
    pavimentada.
- id: 175
  category: sharing_the_road
  question: ¿Cuáles son los tipos típicos de choques que ocurren con el equipo agrícola?
  choices:
    A: Colisiones frontales y choques por detrás.
    B: Choques laterales y choques en ángulo.
    C: Vuelcos y choques de un solo vehículo.
    D: Choques al retroceder y colisiones en estacionamientos.
  answer: B
  explanation: Los choques típicos con equipo agrícola incluyen choques laterales
    y choques en ángulo, que a menudo ocurren mientras el equipo está girando a la
    izquierda.
- id: 176
  category: safe_driving_rules
  question: Durante una parada de tráfico, ¿dónde deben colocar las manos los pasajeros
    del asiento trasero?
  choices:
    A: En sus bolsillos.
    B: En el techo del vehículo.
    C: En el respaldo del asiento delantero.
    D: Fuera de la ventana.
  answer: C
  explanation: Durante una parada de tráfico, los pasajeros del asiento trasero deben
    colocar sus manos en el respaldo del asiento delantero para que sean claramente
    visibles para el oficial.
- id: 177
  category: sharing_the_road
  question: ¿En qué tipo de carretera está legalmente prohibido que transite el equipo
    agrícola en Carolina del Norte?
  choices:
    A: Carreteras suburbanas
    B: Autopistas interestatales
    C: Carreteras rurales de dos carriles
    D: Caminos públicos sin pavimentar
  answer: B
  explanation: El manual establece que el equipo agrícola tiene derecho legal a transitar
    por la mayoría de las carreteras en Carolina del Norte, excepto en las autopistas
    interestatales.
- id: 178
  category: vehicle_information
  question: ¿Qué iluminación se requiere para el equipo agrícola que opera en la carretera?
  choices:
    A: Dos luces blancas delanteras y dos luces rojas traseras visibles a 1000 pies
    B: Una luz blanca delantera y una luz roja trasera visible hasta a 500 pies
    C: Una baliza amarilla intermitente en el techo
    D: Solo se requieren reflectores rojos traseros en todo momento
  answer: B
  explanation: Se requiere que el equipo agrícola tenga una luz blanca delantera,
    así como una luz roja trasera que sea visible hasta a 500 pies (o dos reflectores
    rojos que tengan al menos cuatro pulgadas de diámetro).
- id: 179
  category: sharing_the_road
  question: ¿Qué debe tener encendido cada vehículo en una procesión fúnebre?
  choices:
    A: Solo las luces altas
    B: Los faros y las luces intermitentes de advertencia de peligro
    C: Las luces interiores del techo
    D: Las luces direccionales izquierdas
  answer: B
  explanation: Cada vehículo en una procesión fúnebre debe tener sus faros encendidos,
    y las luces intermitentes de advertencia de peligro también deben estar encendidas,
    si está equipado con ellas.
- id: 180
  category: sharing_the_road
  question: ¿Cuándo es legal que un conductor que viaja en la misma dirección rebase
    a una procesión fúnebre?
  choices:
    A: Cuando la procesión se mueve a menos de 20 mph
    B: Cuando la carretera está marcada para dos o más carriles de tráfico en movimiento
      en la misma dirección
    C: Cuando el conductor toca la bocina antes de rebasar
    D: Nunca es legal rebasar a una procesión fúnebre
  answer: B
  explanation: El conductor de un vehículo que viaja en la misma dirección no debe
    rebasar a una procesión fúnebre, excepto cuando la carretera haya sido marcada
    para dos o más carriles de tráfico en movimiento en la misma dirección.
- id: 181
  category: safe_driving_rules
  question: Si conduce más lento que el límite de velocidad indicado en una autopista
    de varios carriles, ¿por dónde debe conducir?
  choices:
    A: En el carril del extremo izquierdo
    B: En el carril central
    C: En el carril del extremo derecho
    D: Conduciendo sobre la línea divisoria entre los carriles derecho y central
  answer: C
  explanation: Cuando circule más lento que el límite de velocidad indicado en una
    autopista de varios carriles, conduzca en el carril del extremo derecho a menos
    que esté rebasando, girando a la izquierda o esquivando un obstáculo.
- id: 182
  category: safe_driving_rules
  question: En condiciones ideales, ¿aproximadamente cuántos pies se necesitan para
    detener por completo un vehículo que viaja a 55 millas por hora?
  choices:
    A: 100 pies
    B: 150 pies
    C: 211 pies
    D: 300 pies
  answer: C
  explanation: Incluso en condiciones ideales, si viaja a 55 millas por hora, su vehículo
    requiere aproximadamente 211 pies para detenerse por completo.
- id: 183
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en ciudades y pueblos a menos que
    se indique lo contrario?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: A menos que se indique lo contrario, el límite de velocidad es de 35
    mph en ciudades y pueblos.
- id: 184
  category: defensive_driving
  question: ¿Cuál es la mejor práctica para frenar al acercarse a una curva?
  choices:
    A: Frenar firmemente mientras está en el medio de la curva
    B: Reducir la velocidad antes de entrar a la curva para evitar frenar dentro de
      ella
    C: Acelerar al entrar a la curva y frenar al salir
    D: Bombear los frenos continuamente a lo largo de la curva
  answer: B
  explanation: La mejor manera de tomar una curva es reducir la velocidad antes de
    entrar en ella para no tener que frenar mientras está en la curva.
- id: 185
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra con una curva mientras viaja cuesta abajo?
  choices:
    A: Cambiar a una marcha más alta antes de ir cuesta abajo
    B: Cambiar a neutral para deslizarse por la curva
    C: Cambiar a una marcha más baja antes de ir cuesta abajo
    D: Apagar el motor para ahorrar combustible
  answer: C
  explanation: Si se encuentra con una curva mientras viaja cuesta abajo, debe cambiar
    a una marcha más baja antes de comenzar a descender y empezar a frenar antes.
- id: 186
  category: safe_driving_rules
  question: ¿Para qué se utiliza la "regla de los dos segundos"?
  choices:
    A: El tiempo que debe esperar en una señal de alto
    B: Una distancia de seguimiento segura entre su vehículo y el que va adelante
    C: El tiempo que debe estar encendida su luz direccional antes de cambiar de carril
    D: El tiempo máximo que puede apartar la vista de la carretera
  answer: B
  explanation: La "regla de los dos segundos" establece que debe dejar pasar dos segundos
    entre el momento en que el vehículo que va delante de usted pasa por un punto
    determinado y el momento en que su vehículo llega al mismo punto, garantizando
    así una distancia de seguimiento segura.
- id: 187
  category: defensive_driving
  question: ¿Por qué es importante mirar por encima del hombro antes de cambiar de
    carril?
  choices:
    A: Para ver si la policía lo está siguiendo
    B: Para asegurarse de que su espejo retrovisor esté ajustado correctamente
    C: Para estar seguro de que el punto ciego está despejado
    D: Para comprobar la velocidad del vehículo que va detrás de usted
  answer: C
  explanation: Las reglas importantes sobre el cambio de carril incluyen mirar por
    encima del hombro para asegurarse de que el punto ciego esté despejado.
- id: 188
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el propósito de tocar la bocina antes de rebasar
    a otro vehículo?
  choices:
    A: Para advertir al tráfico en sentido contrario que se haga a un lado
    B: Para poner al conductor de adelante bajo la obligación legal de ayudarle a
      rebasar
    C: Para indicar a los peatones que despejen la calzada
    D: Para indicar que viaja por encima del límite de velocidad
  answer: B
  explanation: El manual indica que se debe tocar la bocina para avisar al conductor
    de adelante, ya que la señal de la bocina pone al conductor del vehículo que está
    rebasando bajo la obligación legal de ayudarle a rebasar.
- id: 189
  category: safe_driving_rules
  question: Al hacer un giro a la derecha, ¿por qué debe mantenerse cerca del borde
    derecho de la carretera?
  choices:
    A: Para permitir que los vehículos más rápidos lo rebasen por la izquierda
    B: Para evitar que otro vehículo se meta entre su vehículo y el borde de la acera
    C: Para tener una mejor vista del tráfico en sentido contrario
    D: Para evitar activar los sensores de los semáforos
  answer: B
  explanation: Para los giros a la derecha, manténgase cerca del borde derecho de
    la carretera, de modo que otro vehículo no pueda meterse entre su vehículo y el
    borde de la acera.
- id: 190
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener a la izquierda del vehículo
    que está rebasando?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 4 pies
  answer: B
  explanation: La ley exige que el conductor que rebasa pase al menos a dos pies a
    la izquierda del vehículo que está siendo rebasado.
- id: 191
  category: safe_driving_rules
  question: ¿Cuándo es ilegal rebasar a otro vehículo en una curva o colina?
  choices:
    A: Cuando no puede ver al menos a 500 pies hacia adelante
    B: Cuando no puede ver al menos a 200 pies hacia adelante
    C: Cuando no puede ver al menos a 100 pies hacia adelante
    D: Cuando no puede ver al menos a 300 pies hacia adelante
  answer: A
  explanation: Rebasar siempre es inseguro y generalmente ilegal en cualquier curva
    o colina donde el conductor no pueda ver al menos a 500 pies hacia adelante.
- id: 192
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones está permitido rebasar por la derecha?
  choices:
    A: En una carretera de dos carriles con una línea amarilla continua
    B: Al rebasar a un vehículo que está en el carril para dar vuelta a la izquierda
    C: En cualquier intersección en una zona rural
    D: Cuando el vehículo de adelante conduce demasiado lento
  answer: B
  explanation: Las excepciones donde se permite rebasar por la derecha incluyen cuando
    se rebasa a un vehículo que está en el carril para dar vuelta a la izquierda.
- id: 193
  category: penalties_and_points
  question: ¿Cuál es la sanción por aumentar su velocidad y no ceder el paso a un
    vehículo que lo está rebasando si esto resulta en un choque que causa lesiones
    corporales o daños a la propiedad?
  choices:
    A: Una advertencia por escrito
    B: Un cargo por delito grave (felonía)
    C: Un cargo por delito menor
    D: Revocación inmediata de la licencia
  answer: C
  explanation: Si aumenta la velocidad y no cede el paso a un vehículo que lo rebasa,
    se le acusará de un delito menor si ocurre un choque que resulte en lesiones corporales
    o daños a la propiedad.
- id: 194
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima a la que debe viajar al retroceder (dar marcha
    atrás) su vehículo?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: Al retroceder su vehículo, debe hacerlo muy lentamente, a no más de
    10 mph, porque su vehículo es más difícil de controlar y detener.
- id: 195
  category: safe_driving_rules
  question: ¿Cuál es la técnica adecuada para mantener una vista completa de lo que
    hay detrás de su vehículo al retroceder?
  choices:
    A: Depender completamente de sus espejos retrovisores y laterales
    B: Conducir con la mano derecha y mirar por la ventana del lado del conductor
    C: Conducir con la mano izquierda y mirar por encima de su hombro derecho a través
      de la ventana trasera
    D: Pedir a un pasajero que lo guíe mientras usted mira hacia adelante
  answer: C
  explanation: Para mantener una vista completa de lo que hay detrás del vehículo,
    conduzca con la mano izquierda y mire por encima de su hombro derecho a través
    de la ventana trasera; no dependa únicamente de los espejos.
- id: 196
  category: safe_driving_rules
  question: ¿A qué distancia de una boca de incendios (hidrante) debe estacionarse?
  choices:
    A: Al menos a 10 pies
    B: Al menos a 15 pies
    C: Al menos a 20 pies
    D: Al menos a 25 pies
  answer: B
  explanation: No debe estacionarse a menos de 15 pies de una boca de incendios o
    de la entrada a una estación de bomberos.
- id: 197
  category: safe_driving_rules
  question: 'Al estacionarse en el acotamiento (hombro) de una carretera, su vehículo
    estacionado debe ser visible para los conductores que se acercan en ambas direcciones
    desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Estacionarse en el acotamiento es ilegal a menos que el vehículo estacionado
    pueda ser visto por los conductores que se acercan en ambas direcciones desde
    una distancia de al menos 200 pies.
- id: 198
  category: defensive_driving
  question: ¿Dónde ocurren más de un tercio de los choques de tránsito fatales que
    involucran vehículos motorizados?
  choices:
    A: En autopistas interestatales
    B: En cruces de ferrocarril
    C: En intersecciones
    D: En estacionamientos
  answer: C
  explanation: Los choques ocurren con mayor frecuencia en las intersecciones, y más
    de un tercio de los choques de tránsito fatales que involucran vehículos motorizados
    ocurren en intersecciones.
- id: 199
  category: safe_driving_rules
  question: Si dos vehículos llegan al mismo tiempo a una intersección sin señales
    ni semáforos, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo a la izquierda
    B: El vehículo a la derecha
    C: El vehículo que viaja más rápido
    D: El vehículo que da vuelta a la izquierda
  answer: B
  explanation: En intersecciones sin señales ni semáforos, cuando dos o más vehículos
    llegan a la intersección al mismo tiempo, el vehículo a la derecha tiene el derecho
    de paso.
- id: 200
  category: safe_driving_rules
  question: Cuando dos vehículos de frente se acercan a una intersección al mismo
    tiempo, y un conductor quiere seguir derecho mientras que el otro quiere dar vuelta
    a la izquierda, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor que da vuelta a la izquierda
    B: El conductor que sigue derecho
    C: El conductor que pone la direccional primero
    D: Ninguno de los conductores
  answer: B
  explanation: Si un conductor sigue derecho mientras que el otro quiere dar vuelta
    a la izquierda, el conductor que quiere dar vuelta debe esperar. Por lo tanto,
    el conductor que viaja derecho tiene el derecho de paso.
- id: 201
  category: safe_driving_rules
  question: ¿Qué es lo que NUNCA debe hacer mientras avanza en línea recta por una
    intersección?
  choices:
    A: Cambiar de carril
    B: Mantener una velocidad constante
    C: Estar atento a los peatones
    D: Mantener las manos en el volante
  answer: A
  explanation: 'El manual indica explícitamente: ''Nunca cambie de carril mientras
    avanza en línea recta por una intersección''.'
- id: 202
  category: safe_driving_rules
  question: ¿En qué dirección circulan todos los vehículos en una rotonda o glorieta?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En línea recta
    D: En forma de ocho
  answer: B
  explanation: Todos los vehículos en una rotonda circulan hacia la derecha alrededor
    del círculo, en sentido contrario a las agujas del reloj.
- id: 203
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso en una rotonda o glorieta?
  choices:
    A: Los vehículos que entran a la rotonda
    B: Los vehículos que ya están en la rotonda
    C: Los vehículos que salen de la rotonda
    D: Los vehículos que circulan a mayor velocidad
  answer: B
  explanation: Los vehículos que ya están en la rotonda tienen el derecho de paso,
    y los conductores que entran deben ceder el paso a cualquier vehículo o ciclista
    que ya se encuentre en la rotonda.
- id: 204
  category: safe_driving_rules
  question: ¿Cuál es la velocidad de circulación típica requerida en una rotonda moderna?
  choices:
    A: 5-10 mph
    B: 15-20 mph
    C: 25-30 mph
    D: 35-40 mph
  answer: B
  explanation: La rotonda moderna es mucho más pequeña que las antiguas glorietas
    y requiere que los vehículos circulen a velocidades más bajas (15–20 mph), lo
    que las hace más seguras.
- id: 205
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en una rotonda?
  choices:
    A: Los vehículos que se aproximan para entrar a la rotonda
    B: Los vehículos y ciclistas que ya están en la rotonda
    C: Los peatones que caminan por el medio de la rotonda
    D: Los vehículos que entran por el lado derecho
  answer: B
  explanation: El manual establece que los conductores deben ceder el paso a cualquier
    vehículo o ciclista que ya esté en la rotonda, y aquellos que ya están adentro
    no deben ceder el paso a los vehículos que se aproximan.
- id: 206
  category: safe_driving_rules
  question: ¿Qué carril debe usar para girar a la izquierda o dar vuelta en U en una
    rotonda de varios carriles?
  choices:
    A: El carril derecho
    B: El carril central
    C: El carril izquierdo
    D: La plataforma para camiones (truck apron)
  answer: C
  explanation: En una rotonda de varios carriles, debe mantenerse en el carril izquierdo
    para seguir recto por la rotonda, girar a la izquierda o dar vuelta en U.
- id: 207
  category: defensive_driving
  question: ¿Qué debe hacer si ya está dentro de una rotonda y se acerca un vehículo
    de emergencia con luces intermitentes y sirenas?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda para dejarlo pasar
    B: Hacerse a un lado hacia la isleta central de la rotonda
    C: Acelerar y completar su giro antes de salir
    D: Salir de la rotonda primero y luego hacerse a un lado
  answer: D
  explanation: Si los conductores ya están en la rotonda cuando se acerca un vehículo
    de emergencia, deben salir primero y luego hacerse a un lado para dejar pasar
    al vehículo de emergencia.
- id: 208
  category: safe_driving_rules
  question: Cuando se le requiere detenerse en un cruce de ferrocarril, ¿cuál es la
    distancia de parada requerida desde el riel más cercano?
  choices:
    A: A no más de 25 pies, pero a no menos de 10 pies
    B: A no más de 50 pies, pero a no menos de 15 pies
    C: A no más de 100 pies, pero a no menos de 25 pies
    D: Exactamente a 15 pies
  answer: B
  explanation: El conductor del vehículo debe detenerse a no más de 50 pies, pero
    a no menos de 15 pies del riel más cercano del ferrocarril y no debe avanzar hasta
    que pueda hacerlo de manera segura.
- id: 209
  category: sharing_the_road
  question: ¿A cuál de los siguientes vehículos debe cederle el derecho de paso un
    tren?
  choices:
    A: Vehículos de policía con las sirenas encendidas
    B: Ambulancias respondiendo a una emergencia
    C: Camiones de bomberos con luces intermitentes
    D: Ninguno de los anteriores; los trenes siempre tienen el derecho de paso
  answer: D
  explanation: Los trenes tienen el derecho de paso sobre todo el tráfico de la carretera,
    incluyendo los vehículos de emergencia de la policía, bomberos y ambulancias.
- id: 210
  category: defensive_driving
  question: ¿Aproximadamente qué distancia necesita un tren que viaja a 55 mph para
    detenerse por completo?
  choices:
    A: Menos de media milla
    B: Alrededor de 1500 pies
    C: Más de una milla
    D: Exactamente 500 pies
  answer: C
  explanation: Un tren que viaja a 55 mph necesita más de una milla para detenerse
    por completo.
- id: 211
  category: safe_driving_rules
  question: ¿Qué debe hacer si está cruzando las vías del tren y las luces de advertencia
    comienzan a parpadear o las barreras comienzan a bajar?
  choices:
    A: Detenerse inmediatamente y retroceder
    B: Seguir moviéndose para terminar de cruzar
    C: Detenerse y abandonar su vehículo
    D: Poner su vehículo en reversa y retroceder con cuidado
  answer: B
  explanation: Si se encuentra cruzando las vías y las luces de advertencia comienzan
    a parpadear o las barreras comienzan a bajar, no se detenga, no retroceda, SIGA
    MOVIÉNDOSE. Las señales de advertencia dan suficiente tiempo para terminar de
    cruzar.
- id: 212
  category: defensive_driving
  question: ¿Qué debe hacer si la barrera del cruce de ferrocarril en el lado opuesto
    de las vías baja antes de que usted termine de cruzar?
  choices:
    A: Detenerse en las vías y esperar al tren
    B: Poner su vehículo en reversa para evitar la barrera
    C: Conducir a través de la barrera porque es flexible
    D: Salir de su vehículo y levantar la barrera manualmente
  answer: C
  explanation: Las barreras de los cruces de ferrocarril no pueden atraparlo a usted
    ni a su vehículo; conduzca a través de la barrera. Es flexible y no lo dejará
    encerrado.
- id: 213
  category: signs_and_signals
  question: ¿Qué información se encuentra en el "Letrero Azul" del Sistema de Notificación
    de Emergencias (ENS, por sus siglas en inglés) en un cruce de ferrocarril?
  choices:
    A: El horario del tren y el límite de velocidad
    B: El número de identificación del cruce, el nombre de la compañía ferroviaria
      y el número de teléfono de emergencia
    C: La distancia a la siguiente salida de la autopista
    D: El número que no es de emergencia del departamento de policía local
  answer: B
  explanation: El letrero del ENS, conocido como el "Letrero Azul", contiene el número
    de identificación del cruce de ferrocarril, el nombre de la compañía ferroviaria
    y un número de teléfono de emergencia para reportar emergencias.
- id: 214
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si su vehículo se apaga en o cerca de
    las vías del tren?
  choices:
    A: Intentar reiniciar el motor durante al menos un minuto
    B: Llamar a una grúa mientras está sentado en el vehículo
    C: Salir inmediatamente y alejarse de las vías
    D: Tocar la bocina para advertir al tren que se aproxima
  answer: C
  explanation: Si su vehículo se apaga en o cerca de las vías, SALGA INMEDIATAMENTE.
    Aléjese de su vehículo y de las vías.
- id: 215
  category: sharing_the_road
  question: ¿Cómo debe un ciclista circular por una rotonda de varios carriles?
  choices:
    A: Conducir por el arcén (hombro) de la rotonda
    B: Elegir el carril adecuado y mantenerse en el medio del mismo
    C: Usar siempre la plataforma para camiones (truck apron)
    D: Bajarse y caminar con la bicicleta por la isla central
  answer: B
  explanation: Los ciclistas deben elegir el carril adecuado antes de entrar a una
    rotonda de varios carriles y mantenerse en el medio del carril elegido. No deben
    circular por el arcén.
- id: 216
  category: safe_driving_rules
  question: ¿Por qué no debe avanzar inmediatamente después de que un tren haya pasado
    por un cruce?
  choices:
    A: Debe esperar a que un oficial de policía le indique que pase
    B: Las barreras del cruce necesitan tiempo para reiniciar sus sensores
    C: Puede haber otro tren moviéndose en dirección opuesta o siguiendo al primer
      tren
    D: Debe esperar exactamente tres minutos antes de cruzar
  answer: C
  explanation: No avance inmediatamente después de que el tren haya pasado; puede
    haber otro tren moviéndose en dirección opuesta o siguiendo al primer tren.
- id: 217
  category: sharing_the_road
  question: ¿Cuál es el propósito de la isla de concreto, o plataforma para camiones
    (truck apron), en una rotonda?
  choices:
    A: Es un área de estacionamiento designada para vehículos de emergencia
    B: Es una zona segura para que crucen los peatones
    C: Ayuda a los camiones grandes a maniobrar alrededor de la rotonda
    D: Es un carril específicamente para ciclistas
  answer: C
  explanation: Los camiones grandes deben usar la isla de concreto, llamada plataforma
    para camiones, para ayudar a los conductores a maniobrar alrededor de la rotonda.
- id: 218
  category: defensive_driving
  question: ¿Cuáles de los siguientes vehículos están obligados a detenerse en los
    cruces de ferrocarril, lo que significa que usted debe estar preparado para detenerse
    detrás de ellos?
  choices:
    A: Motocicletas y bicicletas
    B: Autobuses escolares y vehículos que transportan materiales peligrosos
    C: Furgonetas de reparto y camionetas (pickup)
    D: Vehículos de emergencia con las sirenas apagadas
  answer: B
  explanation: Esté preparado para detenerse ante vehículos que deben detenerse en
    los cruces, como autobuses escolares, vehículos de motor que transportan pasajeros,
    vehículos de alquiler o vehículos que transportan explosivos o materiales peligrosos.
- id: 219
  category: safe_driving_rules
  question: ¿Por dónde deben caminar los peatones al transitar por una rotonda?
  choices:
    A: Por el medio de la rotonda
    B: Por la plataforma para camiones
    C: En los cruces peatonales marcados a lo largo del exterior de la rotonda
    D: En el carril izquierdo de la rotonda
  answer: C
  explanation: Los peatones deben usar los cruces peatonales marcados a lo largo del
    exterior de la rotonda y no caminar por el medio de la misma.
- id: 220
  category: sharing_the_road
  question: ¿Por qué debe prestar especial atención a los ciclistas al acercarse y
    pasar por una intersección?
  choices:
    A: Están obligados a ceder el paso a todos los vehículos de motor.
    B: Están obligados a usar la acera en las intersecciones.
    C: Puede ocurrir un choque entre un ciclista que sigue recto y un automovilista
      que gira a la derecha.
    D: Viajan más rápido que los vehículos de motor a través de las intersecciones.
  answer: C
  explanation: Debido a que los ciclistas circulan a la derecha del tráfico de vehículos
    de motor, existe la posibilidad de un choque entre el ciclista que sigue recto
    a través de la intersección y el automovilista que gira a la derecha.
- id: 221
  category: safe_driving_rules
  question: Si tiene la intención de girar en una ciudad y se da cuenta de que no
    está en el carril adecuado, ¿qué debe hacer?
  choices:
    A: Detenerse y esperar a que el tráfico se despeje antes de cambiar de carril.
    B: Continuar hasta la siguiente intersección y girar allí.
    C: Cambiar de carril rápidamente si usa su luz direccional.
    D: Retroceder hasta la intersección anterior.
  answer: B
  explanation: El manual establece que si tiene la intención de girar y se da cuenta
    de que no está en el carril adecuado, debe continuar hasta la siguiente intersección
    y girar allí.
- id: 222
  category: defensive_driving
  question: ¿Cómo puede saber si está conduciendo en el punto ciego de otro conductor?
  choices:
    A: Está conduciendo en el carril central.
    B: No puede ver el espejo retrovisor interior del vehículo de adelante.
    C: El vehículo de adelante es un camión comercial grande.
    D: Está siguiendo a menos de dos segundos de distancia.
  answer: B
  explanation: Evite conducir lado a lado, especialmente en el punto ciego de otro
    conductor. Si no puede ver el espejo retrovisor interior del vehículo de adelante,
    probablemente se encuentre en el punto ciego de ese conductor.
- id: 223
  category: safe_driving_rules
  question: Al conducir en una calle de un solo sentido, ¿qué carriles debe usar para
    el tránsito directo?
  choices:
    A: El carril del extremo derecho.
    B: El carril del extremo izquierdo.
    C: El carril o carriles centrales.
    D: Los carriles exteriores.
  answer: C
  explanation: En una calle de un solo sentido, use el carril o carriles centrales
    para el tránsito directo y los carriles exteriores para girar.
- id: 224
  category: defensive_driving
  question: ¿Por qué conducir en carreteras rurales a menudo se considera más peligroso
    que conducir en el tráfico pesado de la ciudad?
  choices:
    A: Hay más señales de alto y semáforos.
    B: Las carreteras pueden no ser tan anchas y la iluminación a menudo no es tan
      buena.
    C: Hay un mayor volumen de tráfico de camiones comerciales.
    D: El límite de velocidad es generalmente más bajo.
  answer: B
  explanation: Conducir en carreteras rurales a menudo es más peligroso porque la
    carretera puede no ser tan ancha, la iluminación a menudo no es tan buena y/o
    las velocidades de circulación pueden ser más altas.
- id: 225
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado para ingresar a una autopista interestatal?
  choices:
    A: Detenerse al final de la rampa y esperar un espacio en el tráfico.
    B: Usar el carril de aceleración hasta que su velocidad coincida con la del resto
      del tráfico, luego incorporarse de manera segura.
    C: Incorporarse directamente al carril izquierdo para evitar el tráfico lento.
    D: Ceder el paso al tráfico en la autopista disminuyendo la velocidad en el carril
      de aceleración.
  answer: B
  explanation: Al ingresar a la autopista interestatal, use el carril de aceleración
    hasta que la velocidad de su vehículo coincida con la del resto del tráfico y
    luego incorpórese de manera segura.
- id: 226
  category: defensive_driving
  question: Si una avería del vehículo lo obliga a detenerse en la autopista interestatal,
    ¿qué debe hacer para pedir ayuda?
  choices:
    A: Pararse en el carril de circulación y agitar los brazos.
    B: Atar un paño blanco en la antena del radio o en la manija de la puerta izquierda
      y levantar el capó.
    C: Colocar una bandera roja en el parachoques trasero.
    D: Tocar la bocina continuamente hasta que llegue la ayuda.
  answer: B
  explanation: Si una avería del vehículo lo obliga a detenerse, aléjese lo más posible
    de la carretera. Ate un paño blanco en la antena del radio o en la manija de la
    puerta izquierda y levante el capó.
- id: 227
  category: safe_driving_rules
  question: 'Al salir de una autopista interestatal, usted debe:'
  choices:
    A: Disminuir la velocidad en el carril de circulación antes de ingresar al carril
      de desaceleración.
    B: Señalizar su giro con mucha anticipación e ingresar al carril de desaceleración
      sin disminuir la velocidad primero.
    C: Frenar bruscamente tan pronto como ingrese al carril de desaceleración.
    D: Esperar hasta estar en el carril de desaceleración para usar su luz direccional.
  answer: B
  explanation: Al salir de la autopista, señalice su giro con mucha anticipación y,
    sin disminuir la velocidad, ingrese al carril de desaceleración. Continúe al límite
    de velocidad de salida indicado.
- id: 228
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida prevista en una autopista interestatal?
  choices:
    A: Continuar hasta la siguiente salida y salir de la autopista allí.
    B: Disminuir la velocidad y retroceder con cuidado por el arcén.
    C: Hacer un giro en U a través de la mediana.
    D: Detenerse en el carril de circulación y esperar a que el tráfico se despeje
      antes de retroceder.
  answer: A
  explanation: Si se pasa de una salida, no disminuya la velocidad, no retroceda ni
    intente dar la vuelta. En su lugar, continúe hasta la siguiente salida y salga
    de la autopista allí.
- id: 229
  category: vehicle_information
  question: Cuando enciende las luces altas por la noche, ¿a qué distancia debería
    poder ver a una persona?
  choices:
    A: 75 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Cuando enciende las luces altas por la noche, debería poder ver a una
    persona que se encuentre a 200 pies de distancia.
- id: 230
  category: vehicle_information
  question: 'Según la ley de Carolina del Norte, las luces traseras deben ser de color
    rojo y visibles desde al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: D
  explanation: Las luces traseras deben ser de color rojo y visibles desde al menos
    500 pies de distancia.
- id: 231
  category: vehicle_information
  question: ¿Cómo debe ajustar los espejos laterales de su vehículo antes de comenzar
    a conducir?
  choices:
    A: Para mostrar la escena directamente detrás del vehículo.
    B: Para mostrar la escena en la parte trasera izquierda y derecha, reflejando
      apenas el costado del vehículo.
    C: Para eliminar por completo todos los puntos ciegos.
    D: Para mostrar las llantas delanteras del vehículo.
  answer: B
  explanation: Ajuste los espejos laterales para mostrar la escena en la parte trasera
    izquierda y derecha del vehículo. Los espejos deben reflejar apenas el costado
    del vehículo.
- id: 232
  category: vehicle_information
  question: ¿Qué indica si el pedal del freno baja gradualmente bajo la presión de
    su pie?
  choices:
    A: El sistema de frenos antibloqueo se está activando.
    B: Las pastillas de freno son nuevas.
    C: Se debe revisar el sistema hidráulico.
    D: Las llantas tienen baja presión de aire.
  answer: C
  explanation: Si el pedal baja gradualmente bajo la presión de su pie, se debe revisar
    el sistema hidráulico.
- id: 233
  category: vehicle_information
  question: ¿Cuál es la forma correcta de usar un Sistema de frenos antibloqueo (ABS)
    al detenerse?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Frenar fuerte y mantener una presión firme y constante en el pedal del freno.
    C: Tocar ligeramente el pedal del freno varias veces.
    D: Soltar la presión sobre el pedal del freno si siente que vibra.
  answer: B
  explanation: Con el ABS, es importante frenar fuerte y mantener una presión firme
    y constante en el pedal del freno al detenerse. Bombear el pedal del freno o soltar
    la presión constante reducirá la eficacia del ABS.
- id: 234
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima permitida de la banda de rodadura para
    que las llantas se consideren seguras en Carolina del Norte?
  choices:
    A: 1/32 de pulgada
    B: 1/16 de pulgada
    C: 1/8 de pulgada
    D: 1/4 de pulgada
  answer: B
  explanation: Según el manual, las llantas se consideran inseguras si tienen menos
    de 1/16 de pulgada de profundidad en la banda de rodadura.
- id: 235
  category: vehicle_information
  question: ¿Cuál es una consecuencia negativa de conducir con llantas infladas en
    exceso?
  choices:
    A: Se desgastan más rápidamente en los bordes exteriores.
    B: Aumentan la probabilidad de un reventón.
    C: Reducen la tracción y se desgastan mucho en el medio de la banda de rodadura.
    D: Mejoran el ahorro de combustible en un 10%.
  answer: C
  explanation: El manual indica que las llantas infladas en exceso reducen la tracción
    y se desgastan mucho en el medio de la banda de rodadura.
- id: 236
  category: safe_driving_rules
  question: Para ayudar a prevenir la intoxicación por monóxido de carbono debido
    a una posible fuga en el escape, ¿qué sugiere el manual?
  choices:
    A: Mantener el aire acondicionado al máximo en todo momento.
    B: Mantener una ventana abierta aproximadamente una pulgada mientras viaja.
    C: Reemplazar el silenciador cada 10,000 millas.
    D: Conducir con las luces de emergencia encendidas.
  answer: B
  explanation: Debido a que una fuga en el sistema de escape puede permitir que el
    gas venenoso de monóxido de carbono entre al vehículo, se sugiere mantener una
    ventana abierta aproximadamente una pulgada mientras viaja.
- id: 237
  category: vehicle_information
  question: ¿Cuál de las siguientes es una señal de que su vehículo puede tener un
    problema con su sistema de suspensión?
  choices:
    A: El vehículo se balancea libremente, se inclina mucho hacia un lado durante
      un giro o rebota continuamente.
    B: El motor se apaga cuando está en ralentí por más de un par de minutos.
    C: El volante vibra cuando viaja a más de 60 mph.
    D: El sistema de escape libera humo y ruido excesivos.
  answer: A
  explanation: Si un vehículo se balancea libremente, se inclina mucho hacia un lado
    durante un giro o parece rebotar continuamente, puede haber un problema con el
    sistema de suspensión.
- id: 238
  category: safe_driving_rules
  question: 'Según la sección ''Conduzca Verde'' (Drive Green), los arranques bruscos
    y las paradas repentinas pueden aumentar el consumo de combustible hasta en un:'
  choices:
    A: 10%
    B: 20%
    C: 30%
    D: 40%
  answer: D
  explanation: Conducir verde significa adoptar hábitos simples; el manual señala
    que los arranques bruscos y las paradas repentinas pueden aumentar el consumo
    de combustible en un 40%.
- id: 239
  category: safe_driving_rules
  question: 'Cada cinco millas por hora que conduzca a más de 60 mph puede costarle
    hasta un adicional de:'
  choices:
    A: 10 centavos por galón
    B: 15 centavos por galón
    C: 30 centavos por galón
    D: 50 centavos por galón
  answer: C
  explanation: El manual indica que cada cinco millas por encima de 60 mph puede costarle
    hasta 30 centavos adicionales por galón.
- id: 240
  category: defensive_driving
  question: ¿Qué tan adelante debe intentar observar un buen conductor en la carretera?
  choices:
    A: De 3 a 5 segundos adelante
    B: De 5 a 10 segundos adelante
    C: De 10 a 15 segundos adelante
    D: De 20 a 30 segundos adelante
  answer: C
  explanation: Los buenos conductores intentan ver de 10 a 15 segundos adelante en
    la carretera (aproximadamente una cuadra de la ciudad) para evitar movimientos
    de último minuto.
- id: 241
  category: defensive_driving
  question: ¿Aproximadamente con qué frecuencia debe revisar sus espejos para ver
    si un vehículo lo sigue demasiado de cerca?
  choices:
    A: Cada 5 segundos
    B: Cada 10 segundos
    C: Cada 30 segundos
    D: Cada 60 segundos
  answer: B
  explanation: El manual aconseja revisar los espejos aproximadamente cada 10 segundos
    para ver si algún vehículo lo sigue demasiado de cerca.
- id: 242
  category: defensive_driving
  question: ¿Cuál es la forma correcta de revisar sus puntos ciegos antes de cambiar
    de carril?
  choices:
    A: Confiar completamente en su espejo retrovisor.
    B: Girar rápidamente la cabeza y mirar por encima del hombro.
    C: Parpadear las luces delanteras y esperar una respuesta.
    D: Tocar la bocina para advertir a los vehículos en su punto ciego.
  answer: B
  explanation: Debido a que los espejos dejan puntos ciegos, antes de hacer cualquier
    cambio de carril o giro, debe girar rápidamente la cabeza y mirar por encima del
    hombro para ver qué hay en el punto ciego.
- id: 243
  category: safe_driving_rules
  question: 'Si el límite de velocidad es de 45 mph o más, debe indicar su giro al
    menos:'
  choices:
    A: 50 pies antes de girar
    B: 100 pies antes de girar
    C: 200 pies antes de girar
    D: 500 pies antes de girar
  answer: C
  explanation: Normalmente se indica el giro al menos en los últimos 100 pies antes
    de girar, pero si el límite de velocidad es de 45 mph o más, debe indicarlo al
    menos en los últimos 200 pies antes de girar.
- id: 244
  category: signs_and_signals
  question: ¿Cuál es la señal de mano correcta para un giro a la derecha?
  choices:
    A: Mantener el brazo y la mano izquierdos rectos hacia afuera y señalar con el
      dedo índice.
    B: Mantener el brazo izquierdo recto hacia afuera y el antebrazo y la mano rectos
      hacia arriba, con la palma hacia adelante.
    C: Apuntar el brazo y la mano izquierdos hacia abajo, con la palma hacia atrás.
    D: Mover la mano izquierda en un movimiento circular.
  answer: B
  explanation: Para indicar un giro a la derecha usando señales de mano, mantenga
    el brazo izquierdo recto hacia afuera y el antebrazo y la mano rectos hacia arriba,
    con la palma hacia adelante.
- id: 245
  category: signs_and_signals
  question: ¿Cómo usa una señal de mano para indicar que se está deteniendo o reduciendo
    la velocidad?
  choices:
    A: Apuntando el brazo y la mano izquierdos hacia abajo, con la palma hacia atrás.
    B: Manteniendo el brazo izquierdo recto hacia afuera y señalando con el dedo índice.
    C: Manteniendo el brazo izquierdo recto hacia afuera y el antebrazo recto hacia
      arriba.
    D: Parpadeando las luces de freno tres veces.
  answer: A
  explanation: Para indicar que se detiene o reduce la velocidad, apunte el brazo
    y la mano izquierdos hacia abajo, con la palma hacia atrás.
- id: 246
  category: defensive_driving
  question: Si se enfrenta a vehículos que se aproximan por su izquierda y a un niño
    en bicicleta por su derecha, ¿cómo debe ajustar su vehículo?
  choices:
    A: Dar el mismo espacio a ambos peligros.
    B: Acercarse al niño en la bicicleta para evitar a los vehículos.
    C: Tocar la bocina continuamente hasta que los peligros desaparezcan.
    D: Darle más espacio al niño, incluso si eso significa acercarse a los vehículos
      que se aproximan.
  answer: D
  explanation: Al enfrentar dos o más peligros inevitables, dé más espacio al peligro
    mayor o más probable. Es más probable que el niño haga un movimiento repentino,
    así que dele más espacio al niño, incluso si eso significa acercarse a los vehículos
    que se aproximan.
- id: 247
  category: signs_and_signals
  question: ¿De qué color son las señales de advertencia que se usan estrictamente
    para identificar las zonas de trabajo en la carretera?
  choices:
    A: Señales amarillas con letras negras
    B: Señales naranjas con letras negras
    C: Señales blancas con letras negras
    D: Señales rojas con letras blancas
  answer: B
  explanation: Una zona de trabajo en la carretera se puede identificar fácilmente
    por las exclusivas señales de advertencia naranjas con mensajes en letras negras,
    las cuales están reservadas estrictamente para identificar zonas de trabajo.
- id: 248
  category: vehicle_information
  question: ¿A qué distancia debe ser lo suficientemente fuerte la bocina de su vehículo
    para ser escuchada?
  choices:
    A: Al menos a 50 pies
    B: Al menos a 100 pies
    C: Al menos a 200 pies
    D: Al menos a 500 pies
  answer: C
  explanation: Todo vehículo de motor con licencia debe estar equipado con una bocina
    que sea lo suficientemente fuerte como para escucharse a una distancia de al menos
    200 pies.
- id: 249
  category: safe_driving_rules
  question: ¿Cuál es una de las principales causas de choques por alcance (por detrás)
    en las zonas de trabajo?
  choices:
    A: Conducir más rápido que el límite de velocidad publicado
    B: Conducir más lento que el tráfico circundante
    C: No usar las luces direccionales al cambiar de carril
    D: Usar las luces altas
  answer: B
  explanation: Según el manual, conducir más lento que el tráfico circundante es una
    de las principales causas de choques por alcance en las zonas de trabajo.
- id: 250
  category: safe_driving_rules
  question: Según la ley de Carolina del Norte, ¿cuándo se requiere que use sus luces
    delanteras?
  choices:
    A: Desde el atardecer hasta el amanecer y cuando la visibilidad sea de 400 pies
      o menos
    B: Desde el anochecer hasta el alba y cuando la visibilidad sea de 500 pies o
      menos
    C: Solo al conducir de noche por caminos rurales sin iluminación
    D: De 8 PM a 6 AM independientemente de las condiciones climáticas
  answer: A
  explanation: La ley exige el uso de las luces delanteras desde el atardecer hasta
    el amanecer y cuando la visibilidad sea de 400 pies o menos.
- id: 251
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo que se aproxima no baja las luces de sus
    faros por la noche?
  choices:
    A: Encender sus luces altas y dejarlas encendidas hasta que pase
    B: Mirar directamente a los faros del vehículo que se aproxima para calcular su
      distancia
    C: Parpadear sus luces altas una vez y mirar ligeramente hacia la derecha si aún
      no las bajan
    D: Salir de la carretera inmediatamente y apagar todas sus luces
  answer: C
  explanation: El manual aconseja que puede recordárselo al conductor parpadeando
    sus luces altas una vez. Si aún no bajan las luces, mantenga las suyas en luces
    bajas y mire ligeramente hacia la derecha para no mirar directamente a los faros.
- id: 252
  category: safe_driving_rules
  question: ¿Cuánto aumenta la distancia de frenado en pavimento resbaladizo en comparación
    con el pavimento seco?
  choices:
    A: Sigue siendo la misma si tiene frenos antibloqueo (ABS)
    B: Aumenta de dos a 10 veces más
    C: Aumenta exactamente en un 50 por ciento
    D: Aumenta de 15 a 20 veces más
  answer: B
  explanation: Las distancias de frenado en pavimento resbaladizo aumentan de dos
    a 10 veces más que en pavimento seco.
- id: 253
  category: defensive_driving
  question: ¿Por qué se consideran más peligrosas las carreteras durante los primeros
    10 a 15 minutos después de que empieza a llover?
  choices:
    A: La lluvia lava la pintura reflectante de las marcas de los carriles
    B: La lluvia se combina con el aceite, la tierra, el polvo y el caucho para crear
      una superficie resbaladiza
    C: Los conductores tienden a acelerar para llegar a sus destinos antes de que
      la tormenta empeore
    D: El agua causa inmediatamente un hidroplaneo severo a cualquier velocidad
  answer: B
  explanation: Durante los primeros 10 a 15 minutos, la lluvia se combina con el aceite
    del asfalto y los vehículos, y con la tierra, el polvo y el caucho para crear
    una superficie resbaladiza.
- id: 254
  category: safe_driving_rules
  question: ¿A qué velocidad puede comenzar el hidroplaneo?
  choices:
    A: A tan solo 15 millas por hora
    B: A tan solo 30 millas por hora
    C: A tan solo 45 millas por hora
    D: A tan solo 55 millas por hora
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades de tan solo 30 millas por
    hora y en agua con poco más de 1/8 de pulgada de profundidad.
- id: 255
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si su vehículo comienza a hidroplanear?
  choices:
    A: Pisar los frenos bruscamente de inmediato para recuperar la tracción
    B: Girar el volante bruscamente hacia la derecha
    C: Quitar el pie del acelerador y resistir el instinto de usar los frenos
    D: Encender el control de crucero para mantener una velocidad constante
  answer: C
  explanation: Si comienza a hidroplanear, quite el pie del acelerador. Resista su
    instinto de usar los frenos. Mantenga el volante derecho y deje que el impulso
    del automóvil disminuya.
- id: 256
  category: vehicle_information
  question: ¿Qué condición de las llantas aumenta su probabilidad de hidroplanear?
  choices:
    A: Llantas con bandas de rodadura profundas y abiertas
    B: Llantas infladas al límite superior de las especificaciones del fabricante
    C: Llantas con la banda de rodadura desgastada y con baja presión (desinfladas)
    D: Llantas de nieve usadas durante el verano
  answer: C
  explanation: Las llantas con la banda de rodadura desgastada y aquellas que tienen
    baja presión tienen menos agarre en la superficie de la carretera, lo que aumenta
    su probabilidad de hidroplanear.
- id: 257
  category: safe_driving_rules
  question: Según el manual, ¿cuánta agua en movimiento rápido se necesita para arrastrar
    un automóvil fuera de la carretera?
  choices:
    A: 2 pulgadas
    B: 6 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Ha habido informes de que seis pulgadas de agua en movimiento rápido
    pueden arrastrar un automóvil fuera de la carretera y 12 pulgadas de agua en movimiento
    rápido pueden hacer flotar un automóvil o hacer que se vuelque.
- id: 258
  category: safe_driving_rules
  question: ¿Qué deben hacer los automovilistas de Carolina del Norte siempre que
    usen los limpiaparabrisas debido a las inclemencias del tiempo?
  choices:
    A: Encender sus luces intermitentes de emergencia
    B: Conducir al menos 15 mph por debajo del límite de velocidad publicado
    C: Encender sus faros
    D: Conducir solo en el carril derecho
  answer: C
  explanation: Se requiere que todos los automovilistas de Carolina del Norte usen
    los faros siempre que estén usando los limpiaparabrisas debido a las inclemencias
    del tiempo.
- id: 259
  category: defensive_driving
  question: ¿Qué luces de los faros debe usar al conducir en la niebla?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces intermitentes de emergencia
  answer: B
  explanation: 'Si debe conducir durante la niebla: Encienda las luces bajas.'
- id: 260
  category: defensive_driving
  question: ¿Qué debe hacer si tiene problemas extremos para ver mientras conduce
    en la niebla?
  choices:
    A: Detenerse en medio de su carril y esperar a que la niebla se disipe
    B: Encender sus luces altas y acelerar para salir rápidamente del banco de niebla
    C: Salir lo más lejos posible de la carretera, detenerse, asegurar el vehículo
      y encender las luces intermitentes de emergencia
    D: Bajar las ventanas y tocar la bocina continuamente mientras conduce
  answer: C
  explanation: 'Si tiene problemas extremos para ver, debe: Salir lo más lejos posible
    de la carretera; Detenerse, asegurar el vehículo y encender sus luces intermitentes
    de emergencia; y Salir del vehículo por el lado del pasajero y mantenerse alejado
    de la carretera.'
- id: 261
  category: safe_driving_rules
  question: ¿Qué áreas de la carretera suelen ser las primeras en congelarse cuando
    baja la temperatura?
  choices:
    A: Intersecciones y cruces peatonales
    B: Zonas sombreadas, puentes y pasos elevados
    C: Autopistas con mucho tráfico
    D: Túneles y pasos subterráneos
  answer: B
  explanation: Mientras conduce, preste atención a las zonas sombreadas, puentes y
    pasos elevados, ya que estos lugares suelen ser los primeros en congelarse cuando
    baja la temperatura.
- id: 262
  category: defensive_driving
  question: ¿Cuánto debe aumentar su distancia de frenado al reducir la velocidad
    en carreteras nevadas o heladas?
  choices:
    A: Deje al menos el doble de la distancia de frenado normal
    B: Deje al menos el triple de la distancia de frenado normal
    C: Deje al menos cinco veces la distancia de frenado normal
    D: Deje al menos diez veces la distancia de frenado normal
  answer: B
  explanation: 'Cuando arranque o se detenga en carreteras nevadas o heladas: Deje
    al menos el triple de la distancia de frenado normal para reducir la velocidad.'
- id: 263
  category: safe_driving_rules
  question: Al conducir sobre hielo y nieve compactada, ¿cuánta distancia de frenado
    debe dejar?
  choices:
    A: El doble de la distancia de frenado normal
    B: Al menos el triple de la distancia de frenado normal
    C: Cuatro veces la distancia de frenado normal
    D: La misma distancia de frenado normal
  answer: B
  explanation: El manual indica que al conducir sobre hielo y nieve compactada, debe
    dejar al menos el triple de la distancia de frenado normal para reducir la velocidad.
- id: 264
  category: defensive_driving
  question: ¿En qué momentos del día los animales silvestres son más activos y tienen
    mayor probabilidad de estar en la carretera?
  choices:
    A: A media mañana y a primera hora de la tarde
    B: Solo durante las horas más oscuras de la noche
    C: Al amanecer, al anochecer y en las primeras horas después de oscurecer
    D: Al mediodía y a última hora de la tarde
  answer: C
  explanation: Según el manual, los animales silvestres pueden aparecer en cualquier
    lugar y en cualquier momento; sin embargo, son más activos al amanecer, al anochecer
    y en las primeras horas después de oscurecer.
- id: 265
  category: defensive_driving
  question: ¿Por qué debe tener cuidado al usar las luces altas cuando hay animales
    directamente adelante?
  choices:
    A: Las luces altas pueden confundir o 'paralizar' a algunos animales.
    B: Las luces altas harán que el animal embista el vehículo.
    C: Las luces altas dificultan que el conductor vea el brillo de los ojos.
    D: Las luces altas cegarán permanentemente al animal.
  answer: A
  explanation: El manual aconseja usar las luces altas solo cuando no hay tráfico
    en sentido contrario y no hay animales directamente adelante, porque las luces
    altas pueden confundir o 'paralizar' a algunos animales, provocando el comportamiento
    de quedarse inmóviles frente a los faros.
- id: 266
  category: safe_driving_rules
  question: Si atropella a un animal y se detiene a un lado de la carretera, ¿qué
    debe hacer a continuación?
  choices:
    A: Acercarse al animal para revisar sus heridas.
    B: Quedarse en su vehículo, poner los seguros de las puertas y encender las luces
      de emergencia.
    C: Arrastrar al animal fuera de la calzada inmediatamente.
    D: Salir del vehículo y hacer señas a otros conductores para pedir ayuda.
  answer: B
  explanation: Si atropella a un animal, el manual le indica que se detenga a un lado
    de la carretera de manera segura, se quede en su vehículo, ponga los seguros de
    las puertas y encienda las luces de emergencia. No debe acercarse al animal, ya
    que puede ser peligroso.
- id: 267
  category: vehicle_information
  question: Si su vehículo está equipado con transmisión automática y le fallan los
    frenos, ¿qué debe hacer?
  choices:
    A: Cambiar a la posición de estacionamiento (Park) y apagar el motor.
    B: Bombear el pedal del acelerador para aumentar la presión del líquido de frenos.
    C: Aplicar el freno de emergencia y mover la palanca de cambios a una posición
      de marcha baja (low-range).
    D: Cambiar a punto muerto (Neutral) y deslizarse hasta que el vehículo se detenga.
  answer: C
  explanation: En caso de falla de los frenos en un vehículo con transmisión automática,
    debe aplicar el freno de emergencia y mover la palanca de cambios a una posición
    de marcha baja.
- id: 268
  category: vehicle_information
  question: ¿Cómo puede ayudar a secar los frenos mojados?
  choices:
    A: Conducir a alta velocidad durante varias millas.
    B: Conducir una distancia corta y aplicar una ligera presión al pedal del freno.
    C: Bombear el pedal del freno rápidamente mientras está en punto muerto.
    D: Detenerse a un lado y dejar que los frenos se sequen al aire durante una hora.
  answer: B
  explanation: Puede ayudar a secar los frenos mojados conduciendo una distancia corta
    y aplicando una ligera presión al pedal del freno. La fricción genera calor que
    evapora el agua.
- id: 269
  category: safe_driving_rules
  question: 'Para evitar el desgaste excesivo de los frenos al bajar por una colina
    larga o una pendiente pronunciada, usted debe:'
  choices:
    A: Mantener pisado el pedal del freno durante todo el descenso.
    B: Cambiar a punto muerto y deslizarse cuesta abajo.
    C: Apagar el motor para reducir la velocidad.
    D: Cambiar a una marcha más baja en la cima de la colina antes de descender.
  answer: D
  explanation: Para evitar el desgaste excesivo de los frenos al bajar por una colina
    larga o una pendiente pronunciada, use una marcha más baja en lugar del pedal
    del freno para controlar la velocidad. Lo mejor es cambiar a la marcha más baja
    en la cima de la colina antes de descender.
- id: 270
  category: defensive_driving
  question: ¿Cuál es uno de los pasos que debe seguir si el pedal del acelerador se
    atasca?
  choices:
    A: Cambiar a punto muerto (Neutral) y aplicar presión firme a los frenos sin bloquear
      las ruedas.
    B: Apagar el motor inmediatamente y sacar la llave.
    C: Cambiar a reversa para contrarrestar el movimiento hacia adelante.
    D: Pisar los frenos lo más fuerte posible para bloquear las ruedas.
  answer: A
  explanation: Si el pedal del acelerador se atasca, el manual recomienda cambiar
    a punto muerto y aplicar una presión firme a los frenos sin bloquear las ruedas,
    así como golpear ligeramente el pedal o buscar un lugar seguro para salirse de
    la carretera.
- id: 271
  category: defensive_driving
  question: Si ocurre un reventón de neumático mientras conduce, ¿qué debe hacer primero?
  choices:
    A: Aplicar los frenos fuertemente de inmediato para detenerse rápidamente.
    B: Sujetar el volante firmemente e intentar mantener el vehículo en línea recta.
    C: Girar el volante bruscamente hacia el arcén.
    D: Acelerar ligeramente para mantener el control del vehículo.
  answer: B
  explanation: Si ocurre un reventón, debe sujetar el volante firmemente e intentar
    mantener el vehículo en línea recta en su lado de la carretera, y reducir la velocidad
    levantando el pie del acelerador sin aplicar los frenos de inmediato.
- id: 272
  category: safe_driving_rules
  question: Si su vehículo se avería y necesita ayuda, ¿cómo debe hacer señales a
    otros conductores?
  choices:
    A: Pararse en medio de la carretera y agitar los brazos.
    B: Atar un paño blanco a la manija de la puerta izquierda o a la antena de la
      radio y levantar el capó.
    C: Parpadear las luces altas continuamente.
    D: Colocar una bandera roja en el parachoques trasero y pararse detrás del vehículo.
  answer: B
  explanation: Si su vehículo se avería y necesita ayuda, el manual indica que debe
    atar un paño blanco a la manija de la puerta izquierda o a la antena de la radio
    y levantar el capó del vehículo.
- id: 273
  category: defensive_driving
  question: 'Si un vehículo que se aproxima cruza la línea central hacia la trayectoria
    de su vehículo, usted debe:'
  choices:
    A: Girar hacia el carril izquierdo para evitarlo.
    B: Acelerar para pasarlo rápidamente.
    C: Reducir la velocidad de inmediato, tocar la bocina y mantenerse a la derecha.
    D: Detenerse de inmediato en su carril y parpadear los faros.
  answer: C
  explanation: Si un vehículo que se aproxima cruza la línea central hacia su trayectoria,
    debe reducir la velocidad de inmediato, tocar la bocina y mantenerse a la derecha,
    incluso si esto significa salirse de la carretera.
- id: 274
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se sale del pavimento y entra al arcén?
  choices:
    A: Aplicar los frenos de inmediato y dar un tirón al volante hacia la carretera.
    B: Retirar lentamente el pie del acelerador y conducir en línea recta.
    C: Acelerar para volver al pavimento rápidamente.
    D: Cambiar a punto muerto (neutral) y deslizarse hasta detenerse.
  answer: B
  explanation: Si su vehículo se sale del pavimento, no debe aplicar los frenos de
    inmediato ni intentar girar para regresar. En su lugar, retire lentamente el pie
    del acelerador y conduzca en línea recta.
- id: 275
  category: defensive_driving
  question: Si se encuentra en un derrape, ¿en qué dirección debe girar el volante?
  choices:
    A: En la dirección opuesta a la que derrapa la parte trasera del vehículo.
    B: Mantener el volante perfectamente recto.
    C: En la dirección en la que derrapa la parte trasera del vehículo.
    D: Hacia el arcén derecho de la carretera, independientemente de la dirección
      del derrape.
  answer: C
  explanation: Si se encuentra en un derrape, debe levantar suavemente el pie del
    acelerador y girar el volante en la dirección en la que derrapa la parte trasera
    del vehículo.
- id: 276
  category: defensive_driving
  question: 'Si está a punto de ser chocado por detrás y no hay vehículos delante
    de usted, debe:'
  choices:
    A: Presionar el acelerador y alejarse lo más rápido posible.
    B: Pisar los frenos a fondo para prepararse para el impacto.
    C: Cambiar a reversa y retroceder.
    D: Apagar el motor y soltarse el cinturón de seguridad.
  answer: A
  explanation: Si está a punto de ser chocado por detrás y no hay vehículos delante
    de usted, el manual aconseja presionar el acelerador y alejarse lo más rápido
    posible.
- id: 277
  category: driver_responsibility
  question: ¿Cómo protege la ley a las personas que se detienen y prestan ayuda en
    la escena de un accidente?
  choices:
    A: Les garantiza una compensación económica por su tiempo.
    B: Los protege de responsabilidad civil, excepto en casos de mala conducta intencional
      o comportamiento imprudente.
    C: Les otorga inmunidad ante todas las futuras infracciones de tránsito.
    D: Requiere que el seguro del conductor culpable les pague una recompensa.
  answer: B
  explanation: La ley protege a las personas que se detienen y prestan ayuda en la
    escena de un accidente de la responsabilidad civil, excepto en casos de mala conducta
    intencional o comportamiento imprudente.
- id: 278
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra en un derrape?
  choices:
    A: Frenar firmemente y mantener el volante recto.
    B: Girar el volante en la dirección opuesta a la que derrapa la parte trasera.
    C: Girar el volante en la dirección en la que derrapa la parte trasera del vehículo.
    D: Acelerar rápidamente para recuperar la tracción.
  answer: C
  explanation: Si se encuentra en un derrape, debe levantar suavemente el pie del
    acelerador y girar el volante en la dirección en la que derrapa la parte trasera
    del vehículo.
- id: 279
  category: safe_driving_rules
  question: Si está involucrado en un choque en un carril principal sin heridos ni
    víctimas fatales, ¿qué debe hacer con su vehículo?
  choices:
    A: Dejarlo exactamente donde está hasta que llegue la policía.
    B: Moverlo fuera del carril de circulación hacia el arcén si se puede conducir
      de manera segura.
    C: Conducirlo de inmediato al taller de reparación más cercano.
    D: Abandonar el vehículo y caminar hacia un lugar seguro.
  answer: B
  explanation: Si el choque ocurrió en un carril principal... y no hay heridos ni
    víctimas fatales, cada vehículo debe moverse fuera del carril de circulación hacia
    el arcén de la carretera, siempre que pueda conducirse de manera segura por sus
    propios medios.
- id: 280
  category: penalties_and_points
  question: ¿Cuándo le exige la ley hacer un reporte inmediato de un choque a las
    autoridades policiales?
  choices:
    A: Solo cuando una persona muere.
    B: Solo cuando los daños a la propiedad superan los $5,000.
    C: Cuando alguna persona muere o resulta herida, o el daño total a la propiedad
      parece ser de $1,000 o más.
    D: Siempre que el choque involucre a más de dos vehículos.
  answer: C
  explanation: La ley exige que haga un reporte inmediato al oficial o agencia de
    policía más cercana de cualquier choque cuando alguna persona muera o resulte
    herida, o el daño total a los vehículos y otras propiedades parezca ascender a
    $1,000 o más.
- id: 281
  category: driver_responsibility
  question: Si daña una propiedad en un choque y no conoce al dueño, ¿qué debe hacer?
  choices:
    A: Abandonar la escena inmediatamente.
    B: Esperar en la escena exactamente una hora.
    C: Anotar toda la información que pueda recopilar y entregarla al oficial de policía
      más cercano.
    D: Dejar una nota con su número de teléfono en la propiedad dañada.
  answer: C
  explanation: Si no conoce a los ocupantes del otro vehículo o al dueño de la propiedad
    dañada, anote toda la información que pueda recopilar y entréguela al oficial
    de policía más cercano.
- id: 282
  category: penalties_and_points
  question: ¿Cuál es la sanción por no ceder el paso a un peatón al girar a la derecha
    con el semáforo en rojo?
  choices:
    A: Una advertencia por la primera infracción.
    B: Una multa de no más de $500 y no menos de $100.
    C: Una suspensión obligatoria de la licencia por 30 días.
    D: Una multa de exactamente $50.
  answer: B
  explanation: No ceder el paso a un peatón bajo estas circunstancias resultará en
    una multa de no más de $500 y no menos de $100.
- id: 283
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico con una flecha amarilla?
  choices:
    A: La señal de flecha verde protegida está a punto de cambiar a una señal circular
      verde normal, circular roja o de flecha roja.
    B: Tiene el derecho de paso para hacer el giro sin ceder el paso.
    C: Debe detenerse inmediatamente y no avanzar hasta que cambie a verde.
    D: El semáforo no funciona correctamente.
  answer: A
  explanation: Una flecha amarilla indica que la señal de flecha verde 'protegida'
    está a punto de cambiar a una señal circular verde normal, circular roja o de
    flecha roja.
- id: 284
  category: signs_and_signals
  question: ¿Cómo debe proceder al acercarse a una intersección con un semáforo que
    no funciona debido a un corte de energía?
  choices:
    A: Ceder el paso al vehículo a su derecha y avanzar sin detenerse.
    B: Proceder como si la intersección estuviera controlada por una señal de alto
      (stop) en todas las direcciones.
    C: Esperar hasta que llegue un oficial de policía.
    D: Tratar la intersección como una señal de ceda el paso (yield).
  answer: B
  explanation: Al acercarse a una intersección con un semáforo que no funciona debido
    a un corte de energía... debe acercarse a la intersección y proceder como si estuviera
    controlada por una señal de alto (stop) en todas las direcciones.
- id: 285
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: Detenerse y esperar a que la luz cambie a verde.
    C: Tiene el mismo significado que una señal de alto (stop).
    D: Ceder el paso al tráfico en sentido contrario pero no detenerse.
  answer: C
  explanation: 'La luz roja intermitente tiene el mismo significado que la señal de
    alto (stop): deténgase y no avance hasta que pueda ingresar a la intersección
    sin interferir con el tráfico que se aproxima.'
- id: 286
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor cuando se encuentra con una flecha amarilla
    intermitente para girar?
  choices:
    A: Detenerse y esperar una flecha verde fija.
    B: El giro está permitido, pero el conductor debe ceder el paso al tráfico en
      sentido contrario y a los peatones.
    C: El conductor tiene el derecho de paso y el tráfico en sentido contrario debe
      ceder el paso.
    D: Prepararse para detenerse porque la luz va a cambiar a rojo.
  answer: B
  explanation: Cuando se muestra la flecha amarilla intermitente, el giro indicado
    está permitido, pero los conductores deben ceder el paso al tráfico en sentido
    contrario y a los peatones.
- id: 287
  category: signs_and_signals
  question: Al hacer un giro en U con una flecha verde fija, ¿qué debe hacer?
  choices:
    A: Ceder el paso al tráfico en sentido contrario que gira a la derecha cuando
      ambos tienen una flecha verde.
    B: Avanzar sin ceder el paso a ningún tráfico.
    C: Detenerse y esperar una luz verde circular.
    D: Ceder el paso a todo el tráfico detrás de usted.
  answer: A
  explanation: El tráfico que hace un giro en U debe ceder el paso al tráfico en sentido
    contrario que gira a la derecha cuando ambos movimientos tienen simultáneamente
    su respectiva flecha verde.
- id: 288
  category: signs_and_signals
  question: ¿Qué debe hacer si un semáforo de rampa de acceso está apagado o no emite
    ninguna luz?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Tratarlo como una parada de cuatro vías (four-way stop).
    C: Avanzar sin detenerse e ingresar a la autopista incorporándose o cediendo el
      paso de manera normal.
    D: Hacerse a un lado en el arcén y reportar la señal descompuesta.
  answer: C
  explanation: Cuando la pantalla está apagada o no emite una luz roja o verde, un
    vehículo puede avanzar sin detenerse e ingresar a la autopista incorporándose
    o cediendo el paso según lo permitan las condiciones normales.
- id: 289
  category: signs_and_signals
  question: ¿Cómo funcionan los semáforos híbridos (hybrid beacons) cuando son activados
    por primera vez por un peatón?
  choices:
    A: Cambian inmediatamente a rojo fijo.
    B: Parpadean en amarillo, luego cambian a amarillo fijo y después a rojo fijo
      para permitir que los vehículos se detengan de manera segura.
    C: Parpadean en rojo continuamente hasta que el peatón termina de cruzar.
    D: Muestran una flecha verde para los peatones.
  answer: B
  explanation: Una vez activados, los semáforos parpadearán en amarillo durante unos
    segundos, luego cambiarán a amarillo fijo y rojo fijo durante unos segundos más
    para permitir que los vehículos en movimiento se detengan de manera segura.
- id: 290
  category: signs_and_signals
  question: ¿Dónde se coloca generalmente una señal de alto (stop)?
  choices:
    A: Exactamente en la línea de la intersección.
    B: De 6 a 50 pies de la intersección.
    C: 100 pies antes de la intersección.
    D: De 50 a 100 pies de la intersección.
  answer: B
  explanation: La señal de alto (stop) generalmente se coloca de seis a 50 pies de
    la intersección.
- id: 291
  category: signs_and_signals
  question: Si no hay una línea de pare o un cruce peatonal marcado en una señal de
    alto (stop), ¿dónde debe detenerse el conductor?
  choices:
    A: A la par de la propia señal de alto.
    B: A 10 pies antes de la calle transversal.
    C: Antes de entrar a la intersección donde tenga una vista de la calle transversal.
    D: En el medio de la intersección para verificar el tráfico.
  answer: C
  explanation: Si no hay una línea de pare o un cruce peatonal marcado, el conductor
    debe detenerse antes de entrar a la intersección donde tenga una vista de la calle
    transversal.
- id: 292
  category: signs_and_signals
  question: ¿Cuál es la forma y el color de una señal de ceda el paso (yield)?
  choices:
    A: Forma de octágono, rojo y blanco
    B: Forma triangular con la punta hacia abajo, rojo y blanco
    C: Forma de diamante, negro y amarillo
    D: Forma de banderín, amarillo y negro
  answer: B
  explanation: Según el manual, la señal de ceda el paso tiene forma triangular con
    la punta hacia abajo, y es de color rojo y blanco con la palabra 'YIELD' en letras
    grandes.
- id: 293
  category: signs_and_signals
  question: ¿Dónde se encuentra la señal de advertencia amarilla en forma de banderín
    de 'NO ADELANTAR' (DO NOT PASS)?
  choices:
    A: En el lado derecho de la carretera
    B: Suspendida sobre el centro de la intersección
    C: En el lado izquierdo de la carretera
    D: En el arcén derecho antes de una curva
  answer: C
  explanation: El manual indica que la señal de advertencia amarilla en forma de banderín
    se encuentra en el lado izquierdo de la carretera y señala el comienzo de la zona
    de no adelantar.
- id: 294
  category: signs_and_signals
  question: ¿De qué advierten a los conductores las señales en forma de diamante que
    son de color naranja con mensajes en negro?
  choices:
    A: Cruces de ferrocarril
    B: Zonas escolares
    C: Áreas de construcción o mantenimiento
    D: Zonas de no adelantar
  answer: C
  explanation: Las señales de precaución o advertencia en forma de diamante que son
    de color naranja con mensajes en negro advierten sobre áreas de construcción o
    mantenimiento.
- id: 295
  category: signs_and_signals
  question: ¿Qué señal da una advertencia anticipada de un cruce de ferrocarril?
  choices:
    A: Una señal circular con una cruz negra y las letras 'RR' sobre un fondo amarillo
    B: Una señal blanca en forma de cruz (crossbuck) con 'RAILROAD CROSSING' en negro
    C: Una señal amarilla en forma de diamante con el símbolo negro de un tren
    D: Una señal en forma de pentágono con una cruz negra
  answer: A
  explanation: Una señal circular, con una cruz negra y las letras negras 'RR' sobre
    un fondo amarillo, da una advertencia anticipada de un cruce de ferrocarril.
- id: 296
  category: signs_and_signals
  question: ¿De qué advierte a los conductores una señal de cinco lados (pentágono)?
  choices:
    A: Una zona de hospital
    B: Una zona escolar o un cruce escolar
    C: Un cruce peatonal
    D: Una señal de alto próxima
  answer: B
  explanation: La señal de cinco lados (o pentágono) advierte de una zona escolar
    o un cruce escolar, donde los conductores deben estar especialmente atentos a
    los niños.
- id: 297
  category: signs_and_signals
  question: Según el manual, ¿cómo están trazadas generalmente las autopistas con
    números impares?
  choices:
    A: De este a oeste
    B: De norte a sur
    C: En un circuito circular alrededor de una ciudad
    D: Diagonalmente a través del estado
  answer: B
  explanation: El manual indica que las autopistas con números impares generalmente
    corren de norte a sur.
- id: 298
  category: signs_and_signals
  question: ¿Qué forma tiene el marcador de ruta para una autopista de Carolina del
    Norte (N.C.)?
  choices:
    A: Escudo
    B: Rectángulo
    C: Diamante
    D: Círculo
  answer: C
  explanation: Según la sección de señales de guía/informativas, los marcadores de
    ruta de Carolina del Norte tienen forma de diamante.
- id: 299
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las líneas amarillas en el pavimento de una carretera?
  choices:
    A: Separar los carriles de circulación que se mueven en la misma dirección
    B: Marcar el borde derecho de la carretera
    C: Indicar un cruce peatonal
    D: Separar los carriles de circulación que se mueven en direcciones opuestas
  answer: D
  explanation: Las líneas amarillas separan los carriles de circulación que se mueven
    en direcciones opuestas, mientras que las líneas blancas separan los carriles
    de circulación que se mueven en la misma dirección.
- id: 300
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es cierta con respecto a un carril
    central especial reservado para giros a la izquierda en ambos sentidos?
  choices:
    A: Se puede usar para rebasar a vehículos más lentos
    B: No se debe usar para rebasar ni para incorporarse al tráfico
    C: Está reservado exclusivamente para vehículos de emergencia
    D: Se puede usar como un carril de circulación normal durante las horas pico
  answer: B
  explanation: El manual establece explícitamente que el carril de giro a la izquierda
    en ambos sentidos no se debe usar para rebasar a otro vehículo ni con el propósito
    de incorporarse al tráfico.
- id: 301
  category: safe_driving_rules
  question: ¿Qué indican los marcadores reflectantes rojos en el pavimento a un conductor?
  choices:
    A: La ubicación de una boca de incendios cercana
    B: Se aproxima una zona escolar
    C: Movimientos en sentido contrario
    D: Hay un cruce de ferrocarril más adelante
  answer: C
  explanation: Los marcadores rojos indican movimientos en sentido contrario para
    los conductores. Los marcadores reflectantes azules en el pavimento indican bocas
    de incendios cercanas.
- id: 302
  category: safe_driving_rules
  question: Si un oficial de tránsito está dirigiendo el tráfico en una intersección
    con un semáforo en funcionamiento, ¿qué debe hacer usted?
  choices:
    A: Obedecer el semáforo
    B: Obedecer las señales manuales del oficial en lugar del semáforo
    C: Tratar la intersección como una parada de cuatro vías
    D: Tocar la bocina para reconocer al oficial
  answer: B
  explanation: En circunstancias especiales, un oficial puede estar dirigiendo el
    flujo del tráfico. De ser así, usted debe obedecer las señales manuales del oficial
    en lugar de las señales o semáforos normales de tránsito.
- id: 303
  category: sharing_the_road
  question: ¿Están los ciclistas sujetos a las leyes de Conducir Bajo los Efectos
    del Alcohol o Drogas (DWI)?
  choices:
    A: No, porque las bicicletas no son vehículos motorizados
    B: Sí, porque la ley estatal considera que las bicicletas son vehículos
    C: Solo si circulan por una carretera estatal
    D: Solo si están involucrados en una colisión
  answer: B
  explanation: Debido a que las bicicletas son vehículos, los ciclistas deben obedecer
    las mismas leyes de tránsito que otros conductores, lo cual incluye las leyes
    de DWI.
- id: 304
  category: sharing_the_road
  question: ¿Qué equipo de iluminación exige la ley para una bicicleta que se conduce
    de noche?
  choices:
    A: Una luz delantera visible desde al menos 300 pies y una luz o reflector rojo
      trasero visible desde al menos 200 pies
    B: Una luz delantera visible desde 500 pies y una luz roja trasera visible desde
      500 pies
    C: Solo un reflector rojo trasero visible desde 100 pies
    D: Ropa reflectante y una luz intermitente en el casco
  answer: A
  explanation: De noche, la ley exige que una bicicleta esté equipada con una luz
    en la parte delantera visible a una distancia de al menos 300 pies y una luz o
    reflector rojo en la parte trasera visible a una distancia de al menos 200 pies.
- id: 305
  category: sharing_the_road
  question: ¿En qué dirección deben circular los ciclistas en la calzada?
  choices:
    A: En contra del flujo del tráfico para ver los autos que se aproximan
    B: En el lado izquierdo de la vía
    C: Con el flujo del tráfico, en el lado derecho de la vía
    D: En la acera siempre que sea posible
  answer: C
  explanation: Es especialmente importante que los ciclistas vayan con el flujo del
    tráfico, NO en contra del flujo. Deben circular por la derecha, con el tráfico.
- id: 306
  category: sharing_the_road
  question: ¿A quién le exige la ley usar un casco protector de bicicleta aprobado?
  choices:
    A: A todos los ciclistas sin importar la edad
    B: Solo a los ciclistas que circulan por autopistas interestatales
    C: A todos los ciclistas y pasajeros menores de 16 años
    D: Solo a los pasajeros que viajan en un asiento de bicicleta
  answer: C
  explanation: Todos los ciclistas y pasajeros menores de 16 años deben usar un casco
    protector de bicicleta aprobado y deben estar sentados en un asiento tipo sillín.
- id: 307
  category: sharing_the_road
  question: ¿Cuáles son los requisitos de peso y altura para que un pasajero deba
    sentarse en un asiento de retención para bicicletas?
  choices:
    A: Menos de 30 libras o menos de 30 pulgadas de altura
    B: Menos de 40 libras o menos de 40 pulgadas de altura
    C: Menos de 50 libras o menos de 48 pulgadas de altura
    D: Menos de 60 libras o menos de 50 pulgadas de altura
  answer: B
  explanation: Según el manual, un pasajero que pese menos de 40 libras o mida menos
    de 40 pulgadas de altura debe estar sentado en un asiento de retención para bicicletas.
- id: 308
  category: safe_driving_rules
  question: Al caminar por una vía como peatón, ¿por dónde debe caminar?
  choices:
    A: En el lado derecho de la vía moviéndose con el tráfico
    B: En el lado derecho de la vía de frente al tráfico
    C: En el lado izquierdo de la vía de frente al tráfico
    D: En el lado izquierdo de la vía moviéndose con el tráfico
  answer: C
  explanation: El manual establece que los peatones siempre deben caminar por el lado
    izquierdo de la vía de frente al tráfico.
- id: 309
  category: sharing_the_road
  question: Según el manual, ¿qué grupos conforman la mayoría de los peatones que
    mueren en accidentes de vehículos motorizados?
  choices:
    A: Adolescentes y adultos jóvenes
    B: Trabajadores de la construcción y corredores
    C: Personas que caminan por cruces peatonales e intersecciones
    D: Niños, personas mayores o aquellos que han estado bebiendo bebidas alcohólicas
  answer: D
  explanation: El manual señala que la mayoría de los peatones fallecidos son niños,
    personas mayores o aquellos que han estado bebiendo bebidas alcohólicas.
- id: 310
  category: sharing_the_road
  question: ¿Hasta qué distancia detrás de un camión con remolque se extiende el punto
    ciego trasero (NO-ZONE)?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 200 pies
    D: Hasta 300 pies
  answer: C
  explanation: Los camioneros tienen puntos ciegos graves o ZONAS PROHIBIDAS (NO-ZONES)
    en las que un automóvil puede desaparecer de la vista, incluyendo hasta 200 pies
    en la parte trasera.
- id: 311
  category: defensive_driving
  question: ¿Cuál es una regla general para los conductores que comparten la carretera
    con un camión con remolque (tractor-trailer)?
  choices:
    A: Si puede ver las llantas del camión, está a una distancia segura
    B: Si no puede ver al conductor del camión en su espejo lateral, él no puede verlo
      a usted
    C: Siempre rebase a un camión grande por el lado derecho
    D: Siga de cerca al camión para reducir la resistencia del viento y mejorar el
      rendimiento de la gasolina
  answer: B
  explanation: 'Una regla general para los conductores que comparten la carretera
    con un camión con remolque es: ''si no puede ver al conductor del camión en su
    espejo lateral, él no puede verlo a usted''.'
- id: 312
  category: sharing_the_road
  question: ¿Cuánta distancia de carretera despejada puede tomar rebasar de manera
    segura a un remolque y al vehículo que lo remolca?
  choices:
    A: Un cuarto de milla
    B: Media milla
    C: Tres cuartos de milla
    D: Una milla completa
  answer: B
  explanation: Debe tener extrema precaución al rebasar a un remolque y al vehículo
    que lo remolca, ya que puede tomarle media milla de carretera despejada para rebasar
    de manera segura.
- id: 313
  category: safe_driving_rules
  question: Al rebasar un ciclomotor (moped), ¿a qué distancia mínima debe mantenerse
    a la izquierda?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies
    D: Cuatro pies
  answer: B
  explanation: Un ciclomotor debe circular por el lado derecho del carril. Para rebasar
    un ciclomotor, debe mantenerse al menos a dos pies a la izquierda.
- id: 314
  category: sharing_the_road
  question: En la mayoría de los choques de motocicletas que involucran a un automóvil
    en Carolina del Norte, ¿quién suele tener la culpa?
  choices:
    A: El motociclista
    B: El conductor del automóvil
    C: Ambos conductores por igual
    D: Ninguno, ya que el clima suele ser el factor principal
  answer: B
  explanation: Aproximadamente dos tercios de los choques de motocicletas en Carolina
    del Norte involucran a un automóvil. En la mayoría de estos choques, el conductor
    del automóvil tiene la culpa, y por lo general afirma que no vio la motocicleta.
- id: 315
  category: license_system
  question: ¿Cuál es la edad mínima requerida para conducir un ciclomotor (moped)
    en una vía pública en Carolina del Norte?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: En Carolina del Norte, debe tener al menos 16 años para conducir un
    ciclomotor en una vía pública o área vehicular pública.
- id: 316
  category: sharing_the_road
  question: ¿Por qué los camiones grandes requieren espacio adicional para girar?
  choices:
    A: Porque sus frenos se calientan rápidamente en pendientes descendentes
    B: Porque sus ruedas traseras no siguen la misma trayectoria que sus ruedas delanteras
    C: Porque tienen puntos ciegos más grandes que los automóviles de pasajeros
    D: Porque aceleran mucho más lento que los vehículos de pasajeros
  answer: B
  explanation: Los camiones grandes requieren espacio adicional para girar porque
    sus ruedas traseras no siguen la misma trayectoria que sus ruedas delanteras.
- id: 317
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los conductores
    de ciclomotores (mopeds) y las leyes de conducir bajo los efectos del alcohol
    o drogas (DWI)?
  choices:
    A: Los conductores de ciclomotores están exentos de las leyes de DWI porque los
      ciclomotores no se consideran vehículos de motor.
    B: Las leyes de DWI solo se aplican a los conductores de ciclomotores si viajan
      a más de 20 mph.
    C: Las leyes de conducir bajo los efectos del alcohol o drogas que se aplican
      a los conductores de otros vehículos de motor también se aplican a los conductores
      de ciclomotores.
    D: Los conductores de ciclomotores enfrentan sanciones menores por DWI que los
      conductores de automóviles.
  answer: C
  explanation: El manual establece explícitamente que las leyes de conducir bajo los
    efectos del alcohol o drogas que se aplican a los conductores de otros vehículos
    de motor también se aplican a los conductores de ciclomotores.
- id: 318
  category: defensive_driving
  question: ¿De qué posible peligro debe estar consciente cuando un vehículo que remolca
    un tráiler frena repentinamente?
  choices:
    A: El remolque puede desprenderse del vehículo que lo remolca
    B: El frenado repentino podría causar que el remolque se doble en forma de navaja
      (jackknife)
    C: Es probable que el motor del vehículo que remolca se apague
    D: Los frenos del remolque se sobrecalentarán y se incendiarán
  answer: B
  explanation: Cuando se acerque a un vehículo que remolca un tráiler, tenga en cuenta
    que un frenado repentino podría causar que el remolque se doble en forma de navaja
    (jackknife).
- id: 319
  category: vehicle_information
  question: ¿Qué documento puede servir como prueba de propiedad de un ciclomotor
    si el conductor no tiene un Certificado de Origen del Fabricante (MCO)?
  choices:
    A: Una factura de venta notariada del concesionario
    B: Un formulario de Declaración Jurada de Hechos para el Registro de un Ciclomotor
      (MVR-58)
    C: Una licencia de conducir válida de Carolina del Norte
    D: La tarjeta de registro de un propietario anterior
  answer: B
  explanation: El manual establece que si un conductor no tiene un MCO para su vehículo,
    puede completar un formulario de Declaración Jurada de Hechos para el Registro
    de un Ciclomotor (MVR-58) para que sirva como prueba de propiedad.
- id: 320
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una primera condena por tirar basura en Carolina
    del Norte?
  choices:
    A: Una multa mínima de $100
    B: Una multa mínima de $250
    C: Una multa mínima de $500
    D: Una multa mínima de $1,000
  answer: B
  explanation: Cuando se tira o vuela basura desde un vehículo, el conductor es considerado
    responsable. Si es condenado, la multa mínima es de $250 y la multa máxima es
    de $1,000.
- id: 321
  category: penalties_and_points
  question: Si ocurre una segunda infracción por tirar basura dentro de los tres años
    posteriores a una infracción anterior, ¿cuál es la multa máxima en caso de condena?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Cualquier segunda infracción o infracción posterior por tirar basura
    dentro de los tres años posteriores a la fecha de una infracción anterior se castiga
    con una multa de no menos de $500 ni más de $2,000, en caso de condena.
- id: 322
  category: sharing_the_road
  question: ¿Con qué frecuencia un grupo de voluntarios acepta recoger basura al unirse
    al Programa Adopt-A-Highway (Adopte una Carretera)?
  choices:
    A: Una vez al mes
    B: Dos veces al año
    C: Al menos cuatro veces al año
    D: Seis veces al año
  answer: C
  explanation: Para unirse al programa Adopt-A-Highway, un grupo acepta recoger basura
    al menos cuatro veces al año a lo largo de una sección de dos millas de una carretera
    mantenida por el estado.
- id: 323
  category: license_system
  question: ¿Qué tipo de verificación del historial de la licencia de conducir se
    requiere generalmente para las comparecencias ante el tribunal?
  choices:
    A: Un historial completo no certificado
    B: Una copia certificada del historial
    C: Un historial de tres años no certificado
    D: Una copia del historial de direcciones
  answer: B
  explanation: El manual especifica que generalmente se requiere una verificación
    certificada del historial de la licencia de conducir para las comparecencias ante
    el tribunal.
- id: 324
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos está exento de ser registrado en la
    División de Vehículos Motorizados (DMV)?
  choices:
    A: Ciclomotores (mopeds)
    B: Autocaravanas (motor homes)
    C: Equipo de construcción de carreteras exento
    D: Vehículos de flota
  answer: C
  explanation: A excepción de los propietarios de vehículos agrícolas exentos y equipos
    de construcción de carreteras exentos, todo propietario de un vehículo debe registrar
    su vehículo motorizado en la División de Vehículos Motorizados (DMV).
- id: 325
  category: vehicle_information
  question: ¿Qué debe proporcionar un nuevo residente de Carolina del Norte que se
    muda de otro estado para titular y registrar su vehículo?
  choices:
    A: Una licencia de conducir válida de otro estado y un Certificado de Conducción
      Temporal (TDC) de Carolina del Norte
    B: Una copia certificada de su historial de manejo
    C: Una Declaración Jurada de Hechos (MVR-58)
    D: Una tarjeta de registro de votante de Carolina del Norte
  answer: A
  explanation: Si usted es un nuevo residente de Carolina del Norte que se muda de
    otro estado, se requerirá su licencia de conducir válida de otro estado, junto
    con su Certificado de Conducción Temporal (TDC) de Carolina del Norte, para titular
    y registrar su vehículo.
- id: 326
  category: vehicle_information
  question: Según la ley de Carolina del Norte, ¿cuál de las siguientes opciones está
    prohibida con respecto a las placas de matrícula?
  choices:
    A: Mostrar la placa en la parte trasera del vehículo
    B: Usar cubiertas de plástico para las placas
    C: Tener calcomanías de validación en la placa
    D: Mostrar la fecha de vencimiento
  answer: B
  explanation: El manual establece explícitamente que las cubiertas de plástico para
    las placas de matrícula están prohibidas según la ley GS 20-63g.
- id: 327
  category: vehicle_information
  question: ¿Qué información se requiere para cambiar la dirección física en el registro
    de su vehículo en línea?
  choices:
    A: Su número de seguro social y fecha de nacimiento
    B: El número de placa de su vehículo, los últimos cinco caracteres del número
      de título del vehículo y una dirección de correo electrónico válida
    C: Una copia certificada de su historial de manejo y comprobante de seguro
    D: Su licencia de conducir de otro estado y un Certificado de Conducción Temporal
  answer: B
  explanation: Para cambiar su dirección en línea, necesitará el número de placa de
    su vehículo, los últimos cinco caracteres del número de título del vehículo y
    una dirección de correo electrónico válida.
- id: 328
  category: vehicle_information
  question: ¿Cuál es el documento de transferencia oficial requerido para registrar
    un vehículo nuevo en Carolina del Norte?
  choices:
    A: Una factura de venta notariada
    B: El certificado de origen del fabricante
    C: Un certificado de autoseguro
    D: Un historial completo no certificado
  answer: B
  explanation: Antes de que un vehículo pueda ser registrado, se requiere un comprobante
    de propiedad adecuado. Para los vehículos nuevos, el certificado de origen del
    fabricante es el documento de transferencia oficial.
- id: 329
  category: driver_responsibility
  question: ¿Dentro de cuántos días debe un titular de una licencia o tarjeta de identificación
    actualizar su dirección física con el DMV después de mudarse dentro de Carolina
    del Norte?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 120 días
  answer: C
  explanation: Dentro de los 60 días posteriores a una mudanza dentro de Carolina
    del Norte, el titular de una licencia o tarjeta de identificación debe actualizar
    su dirección física con el DMV y obtener un duplicado de la licencia o identificación.
- id: 330
  category: penalties_and_points
  question: ¿Cuál es la sanción si se notifica al DMV que el propietario de un vehículo
    está operando un vehículo motorizado sin el seguro de responsabilidad civil adecuado?
  choices:
    A: El vehículo será incautado por 60 días
    B: La placa del vehículo podría ser revocada por 30 días
    C: La licencia de conducir será suspendida permanentemente
    D: El propietario debe pagar una multa mínima de $1,000
  answer: B
  explanation: Si se notifica al DMV que el propietario de un vehículo está operando
    un vehículo motorizado sin el seguro de responsabilidad civil adecuado, la placa
    del vehículo podría ser revocada por 30 días.
- id: 331
  category: vehicle_information
  question: En Carolina del Norte, ¿un certificado de autoseguro puede usarse como
    prueba de seguro de responsabilidad civil para flotas de al menos cuántos vehículos?
  choices:
    A: 5 o más vehículos
    B: 10 o más vehículos
    C: 15 o más vehículos
    D: 25 o más vehículos
  answer: D
  explanation: El seguro de responsabilidad civil puede ser en forma de una póliza
    de una compañía autorizada, dinero en efectivo o fianza depositada con el Tesorero
    del Estado, o un certificado de autoseguro para flotas de 25 o más vehículos.
- id: 332
  category: vehicle_information
  question: ¿Cuál es la cantidad mínima de seguro de responsabilidad civil requerida
    para daños a la propiedad en un accidente en Carolina del Norte?
  choices:
    A: $25,000
    B: $30,000
    C: $60,000
    D: $750,000
  answer: A
  explanation: La cantidad mínima de seguro de responsabilidad civil requerida es
    de $25,000 para todos los daños a la propiedad en un accidente.
- id: 333
  category: vehicle_information
  question: ¿Cuánto dura el período de gracia que otorga Carolina del Norte para las
    pólizas de seguro de responsabilidad civil vencidas?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: Carolina del Norte no otorga un período de gracia.
  answer: D
  explanation: Carolina del Norte no otorga un período de gracia. Un período de gracia
    es un acuerdo únicamente entre el asegurado y la compañía de seguros.
- id: 334
  category: vehicle_information
  question: ¿Dentro de cuántos días antes del vencimiento del registro de un vehículo
    debe este recibir una inspección de seguridad o de seguridad y emisiones?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Dentro de los 90 días previos al vencimiento del registro, se requiere
    que todos los vehículos autopropulsados reciban una inspección de seguridad o
    de seguridad y emisiones para renovar su registro.
- id: 335
  category: driver_responsibility
  question: ¿Qué debe hacer para evitar una multa o sanción antes de terminar o cancelar
    el seguro de responsabilidad civil de su vehículo?
  choices:
    A: Notificar a la oficina de evaluación de su condado local.
    B: Entregar la placa de matrícula válida del vehículo.
    C: Solicitar un título duplicado.
    D: Pagar la tarifa del programa "Tag & Tax Together".
  answer: B
  explanation: Para evitar una multa o sanción, entregue la placa de matrícula válida
    del vehículo antes de la terminación o cancelación del seguro de responsabilidad
    civil.
- id: 336
  category: vehicle_information
  question: 'Al transferir la propiedad de un vehículo motorizado, la reasignación
    de propiedad en el certificado de título debe hacerse en presencia de:'
  choices:
    A: Un inspector del DMV
    B: Un oficial de la ley
    C: Un notario público
    D: Un agente de seguros
  answer: C
  explanation: Para que la transferencia sea válida, la reasignación debe hacerse
    en presencia de un notario público y debe realizarse la entrega física del vehículo
    al nuevo propietario.
- id: 337
  category: vehicle_information
  question: ¿Bajo qué condiciones se pueden transferir las placas de matrícula de
    un vehículo a otro?
  choices:
    A: Si los vehículos son de la misma categoría, la propiedad está a nombre de la
      misma persona y la cobertura del seguro ha sido continua.
    B: Si el vehículo nuevo tiene menos de tres años y menos de 70,000 millas.
    C: Si la transferencia se realiza dentro de los 15 días posteriores a la compra
      del vehículo nuevo.
    D: Las placas de matrícula nunca se pueden transferir entre vehículos en Carolina
      del Norte.
  answer: A
  explanation: Las placas de matrícula se pueden transferir de un vehículo a otro
    de la misma categoría, siempre que la propiedad esté a nombre de la misma persona
    y la cobertura del seguro haya sido continua.
- id: 338
  category: vehicle_information
  question: Si se pierde o se roba un certificado de título, ¿cuánto tiempo debe esperar
    antes de que se pueda emitir un título duplicado después de recibir la solicitud
    y la tarifa?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: No se puede emitir un título duplicado hasta 15 días después de que
    el DMV reciba la solicitud y la tarifa.
- id: 339
  category: vehicle_information
  question: ¿Qué requiere que hagan los propietarios de vehículos el programa "Tag
    & Tax Together"?
  choices:
    A: Pagar las etiquetas de renovación del registro y los impuestos a la propiedad
      del vehículo en un solo pago.
    B: Pagar la inspección del vehículo y la renovación del registro en un solo pago.
    C: Pagar por un título duplicado y la transferencia de la placa de matrícula al
      mismo tiempo.
    D: Pagar el seguro de responsabilidad civil y los impuestos a la propiedad del
      vehículo en un solo pago.
  answer: A
  explanation: El programa "Tag & Tax Together" requiere un solo pago para ambas facturas.
    Tanto las renovaciones de las etiquetas (placas) como los pagos de impuestos deben
    pagarse en su totalidad para renovar el registro anual de un vehículo.
- id: 340
  category: vehicle_information
  question: ¿Quién es responsable de establecer el valor de un vehículo para fines
    de impuestos a la propiedad en Carolina del Norte?
  choices:
    A: La División de Vehículos Motorizados (DMV) de Carolina del Norte
    B: La oficina de evaluación del condado local
    C: La Oficina de Licencias y Robos del DMV
    D: La compañía de seguros del vehículo
  answer: B
  explanation: El DMV no participa en el establecimiento del valor de un vehículo
    para fines de impuestos a la propiedad. La oficina de evaluación del condado local
    determina el impuesto según la marca y el modelo del vehículo registrado.
- id: 341
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos está exento de la ley "Tag & Tax Together"
    (Etiqueta e Impuestos Juntos)?
  choices:
    A: Automóviles de pasajeros
    B: Ciclomotores
    C: Camionetas de carga ligera
    D: Motocicletas
  answer: B
  explanation: 'La ley "Tag & Tax Together" cubre todos los vehículos motorizados
    excepto: vehículos exentos de registro, casas prefabricadas, aulas y oficinas
    móviles, semirremolques registrados por varios años, vehículos motorizados propiedad
    o arrendados por empresas de servicios públicos, remolques modelo de parque (Park
    Model Trailers) y ciclomotores.'
- id: 342
  category: vehicle_information
  question: Si un vehículo no pasa su inspección anual, ¿dentro de cuántos días tiene
    derecho a ser reinspeccionado en la misma estación sin pagar otra tarifa de inspección?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Un vehículo que no pasa la inspección tiene derecho a ser reinspeccionado
    en la misma estación dentro de un plazo de 60 días sin pagar otra tarifa de inspección.
- id: 343
  category: vehicle_information
  question: Un vehículo puede estar exento de una inspección de emisiones si es de
    carga ligera, propulsado por gasolina, está dentro de los tres años de modelo
    más recientes y tiene menos de ¿cuántas millas en el odómetro?
  choices:
    A: 30,000 millas
    B: 50,000 millas
    C: 70,000 millas
    D: 100,000 millas
  answer: C
  explanation: La ley exime de la prueba de emisiones a los vehículos registrados
    o vendidos en Carolina del Norte si están dentro de los tres años de modelo más
    recientes y tienen menos de 70,000 millas en el odómetro.
- id: 344
  category: vehicle_information
  question: ¿Cuál es la transmisión de luz permitida para las ventanas polarizadas
    en Carolina del Norte?
  choices:
    A: No menos del 20%
    B: No menos del 35%
    C: No menos del 50%
    D: No menos del 75%
  answer: B
  explanation: La transmisión de luz permitida para las ventanas polarizadas no debe
    ser inferior al 35%.
- id: 345
  category: vehicle_information
  question: ¿Quién tiene la autoridad para cambiar las leyes y tarifas de vehículos
    motorizados en Carolina del Norte?
  choices:
    A: El Gobernador
    B: La Asamblea General de Carolina del Norte
    C: El Comisionado del DMV
    D: El Departamento de Transporte
  answer: B
  explanation: El manual establece que las leyes y tarifas de vehículos motorizados
    están sujetas a cambios por parte de la Asamblea General de Carolina del Norte.
- id: 346
  category: vehicle_information
  question: Según el manual, ¿qué está sujeto a cambios por parte de la Asamblea General
    de Carolina del Norte?
  choices:
    A: Solo las leyes de vehículos motorizados
    B: Solo las tarifas del DMV
    C: Las leyes y tarifas de vehículos motorizados
    D: Las regulaciones federales de carreteras
  answer: C
  explanation: El manual señala que las leyes y tarifas de vehículos motorizados están
    sujetas a cambios por parte de la Asamblea General de Carolina del Norte.
- id: 347
  category: license_system
  question: ¿Dónde puede acceder en línea al Manual del Conductor de Carolina del
    Norte?
  choices:
    A: NCDOT.gov
    B: MyNCDMV.gov
    C: NCHighwayPatrol.org
    D: NorthCarolina.gov
  answer: B
  explanation: El Manual del Conductor de Carolina del Norte está disponible en línea
    en MyNCDMV.gov.
- id: 348
  category: license_system
  question: ¿Qué término de búsqueda se recomienda para encontrar el manual en MyNCDMV.gov?
  choices:
    A: Driving Rules
    B: License Guide
    C: Driver Handbook
    D: DMV Manual
  answer: C
  explanation: El manual está disponible en línea en MyNCDMV.gov buscando el término
    en inglés "Driver Handbook".
- id: 349
  category: license_system
  question: ¿En qué ciudad se encuentra la sede central del DMV de Carolina del Norte?
  choices:
    A: Raleigh
    B: Charlotte
    C: Rocky Mount
    D: Greensboro
  answer: C
  explanation: La sede central del DMV está ubicada en 1515 N. Church Street, Rocky
    Mount, NC 27804.
- id: 350
  category: license_system
  question: ¿Cuál es la dirección física de la sede central del DMV de Carolina del
    Norte?
  choices:
    A: 1515 N. Church Street
    B: 100 E. Main Street
    C: 500 Capital Blvd
    D: 1200 DMV Drive
  answer: A
  explanation: La sede central del DMV está ubicada en 1515 N. Church Street, Rocky
    Mount, NC 27804.
- id: 351
  category: license_system
  question: ¿Cuál de los siguientes servicios se ofrece en la sede central del DMV
    en Rocky Mount?
  choices:
    A: Emisión de licencias de conducir
    B: Registro de vehículos
    C: Transferencias de títulos
    D: Ninguna de las anteriores
  answer: D
  explanation: El manual indica explícitamente que no se ofrecen servicios de licencias
    de conducir/identificaciones (ID) ni de títulos/registros en la sede central del
    DMV.
- id: 352
  category: vehicle_information
  question: Si necesita registrar un vehículo recién comprado, ¿debería visitar la
    sede central del DMV en 1515 N. Church Street?
  choices:
    A: Sí, es el centro principal de procesamiento
    B: Sí, pero solo en días laborables
    C: No, en esta ubicación no se ofrecen servicios de títulos y registros
    D: No, solo procesan licencias de conducir
  answer: C
  explanation: El manual indica que no se ofrecen servicios de títulos/registros en
    la sede central del DMV.
- id: 353
  category: license_system
  question: ¿Puede obtener una tarjeta de identificación (ID) de Carolina del Norte
    en la sede central del DMV en Rocky Mount?
  choices:
    A: Sí, allí se emiten tarjetas de identificación
    B: No, en esta ubicación no se ofrecen servicios de licencias de conducir ni de
      identificación
    C: Sí, pero solo para renovaciones
    D: Sí, pero solo para solicitantes por primera vez
  answer: B
  explanation: El manual señala claramente que no se ofrecen servicios de licencias
    de conducir/identificaciones (ID) en la sede central del DMV.
- id: 354
  category: driver_responsibility
  question: ¿Cómo anima el DMV de Carolina del Norte a los conductores a mantenerse
    conectados y participar en línea?
  choices:
    A: Suscribiéndose a una revista mensual
    B: Manteniéndose activos en las redes sociales
    C: Llamando a una línea de ayuda semanal
    D: Asistiendo a reuniones comunitarias
  answer: B
  explanation: El manual incluye un mensaje para "MANTENERSE ACTIVO EN LAS REDES SOCIALES"
    (STAY ENGAGED ON SOCIAL MEDIA).
- id: 355
  category: vehicle_information
  question: ¿Cuál es la dirección web oficial proporcionada para el DMV de Carolina
    del Norte?
  choices:
    A: NCDMV.com
    B: MyNCDMV.gov
    C: NCDOT.gov
    D: DriveNC.org
  answer: B
  explanation: El sitio web oficial que figura en el manual es MyNCDMV.gov.
- id: 356
  category: license_system
  question: ¿Qué afirmación es verdadera con respecto al Manual del Conductor de Carolina
    del Norte?
  choices:
    A: Solo está disponible en formato impreso
    B: Se puede encontrar en línea en MyNCDMV.gov
    C: Se envía por correo a todos los conductores registrados anualmente
    D: El público en general no puede acceder a él
  answer: B
  explanation: 'El manual indica: "El Manual del Conductor de Carolina del Norte está
    disponible en línea en MyNCDMV.gov buscando Driver Handbook".'
- id: 357
  category: license_system
  question: Si un conductor necesita renovar su licencia de conducir en persona, ¿por
    qué la sede central del DMV en Rocky Mount es un destino incorrecto?
  choices:
    A: Está cerrada permanentemente al público
    B: Solo maneja licencias de conducir comerciales
    C: En esta ubicación no se ofrecen servicios de licencias de conducir ni de identificación
    D: Requiere una cita con seis meses de anticipación
  answer: C
  explanation: 'El texto indica explícitamente: "(En esta ubicación no se ofrecen
    servicios de licencias de conducir/identificaciones ni de títulos/registros)"
    con respecto a la sede central del DMV.'
- id: 358
  category: vehicle_information
  question: ¿Cuál es la fecha de revisión del Manual del Conductor de Carolina del
    Norte proporcionada en este texto?
  choices:
    A: Enero de 2024
    B: Mayo de 2025
    C: Diciembre de 2023
    D: Julio de 2025
  answer: B
  explanation: El texto indica que el manual fue "Revisado en mayo de 2025".
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) octagonal y roja significa que debe detenerse
    por completo en la línea de alto, en el cruce peatonal o antes de ingresar a la
    intersección. Verifique si hay tráfico y peatones antes de continuar.
  id: 359
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 360
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: Prohibido estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe ingresar a la carretera o rampa donde está colocada esta señal. Por lo general,
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 361
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que viaja en contra del tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 362
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de autopista a la izquierda
  answer: B
  explanation: Una señal en blanco y negro de UN SOLO SENTIDO (ONE WAY) con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección — la dirección
    que señala la flecha.
  id: 363
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 364
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 365
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 366
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido rebasar.
  id: 367
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye a hacer esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 368
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 369
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 370
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminar cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte sobre un cruce de peatones más adelante. Prepárese para detenerse ante
    los peatones que cruzan la calle.
  id: 371
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal verde amarillenta fluorescente en forma de pentágono (5 lados)
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 372
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no adelantar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 373
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 374
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La calle termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva hacia la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar a
    la curva.
  id: 375
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa solo girar a la derecha
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 376
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición del camino advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino se curve primero
    hacia un lado y luego hacia el otro.
  id: 377
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de camino resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a las condiciones cambiantes
    del camino.
  id: 378
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otro camino
    C: El comienzo de una autopista dividida
    D: Un camino que se estrecha a un carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otro camino se incorporará a su carril. Prepárese para ajustar su
    velocidad y posición.
  id: 379
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: Fin del carril
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Prepárese para una reducción en el ancho del camino y ajuste su
    posición en el carril.
  id: 380
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: El camino termina
    B: Tráfico de doble sentido
    C: Comienza una carretera dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    carretera dividida con una mediana (camellón) o barrera que separa el tráfico
    en sentido contrario. Manténgase a la derecha.
  id: 381
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: La carretera dividida termina y se reanuda el tráfico de doble sentido
    C: Área de incorporación más adelante
    D: Construcción en la vía más adelante
  answer: B
  explanation: Esta señal advierte que la carretera dividida termina. El tráfico en
    sentido contrario ya no estará separado por una mediana. Prepárese para el tráfico
    de doble sentido.
  id: 382
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Zona de rebase más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una carretera dividida
    y se encontrará con vehículos que viajan en dirección opuesta.
  id: 383
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición del camino advierte esta señal?
  choices:
    A: Condiciones de camino helado
    B: El camino puede estar resbaladizo cuando está mojado
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    del camino puede volverse muy resbaladiza durante la lluvia o en condiciones de
    humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 384
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un tope (resalto) en el camino
    B: Una superficie de camino irregular
    C: Una colina empinada o pendiente más adelante
    D: Construcción en la vía
  answer: C
  explanation: Esta señal advierte sobre una colina empinada o pendiente más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 385
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está roja o amarilla. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 386
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto donde debe detenerse
    D: Un tope (reductor de velocidad)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 387
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce peatonal
  answer: B
  explanation: Esta señal advierte que hay un cruce o una intersección de 4 vías más
    adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 388
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 389
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril termina
    C: Se está agregando un nuevo carril — no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de ceder el paso para incorporarse. El tráfico que
    entra por la rampa tiene su propio carril nuevo.
  id: 390
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Parar o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 391
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: A cualquier persona por menos de 15 minutos
    B: Solo a personas de la tercera edad
    C: Solo a vehículos que muestren un cartel o placa de discapacidad válido
    D: A cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de una silla de ruedas indica estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de matrícula de estacionamiento para discapacitados válido pueden
    estacionar en estos espacios. Las infracciones conllevan multas severas.
  id: 392
