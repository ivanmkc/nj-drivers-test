metadata:
  source: 2025 New Hampshire Driver's Manual
  total_questions: 244
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In New Hampshire, at what minimum age is a resident allowed to begin practice
    driving while accompanied by a licensed adult?
  choices:
    A: 15 years old
    B: 15.5 years old
    C: 16 years old
    D: 14.5 years old
  answer: B
  explanation: According to New Hampshire RSA 263:25, a person who has not been issued
    a driver's license may practice driving at the age of 15.5 years, provided they
    are accompanied by a licensed adult 25 years of age or older.
- id: 2
  category: license_system
  question: 'A New Hampshire Youth Operator license is issued to any person who is
    at least 16 years of age but under the age of:'
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: In New Hampshire, any person 16 years of age or older but less than
    21 years of age will be issued a Youth Operator license.
- id: 3
  category: license_system
  question: 'Under New Hampshire law, a Youth Operator under the age of 18 is restricted
    from driving between the hours of:'
  choices:
    A: 11:00 PM and 5:00 AM
    B: 12:00 AM and 6:00 AM
    C: 1:00 AM and 4:00 AM
    D: 10:00 PM and 4:00 AM
  answer: C
  explanation: Holders of a Youth Operator license who are under 18 years of age shall
    not operate a motor vehicle between the hours of 1:00 AM and 4:00 AM.
- id: 4
  category: license_system
  question: During the first six months of holding a Youth Operator license, how many
    non-family passengers under the age of 25 may the driver have in the vehicle?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: For the first six months after issuance of a Youth Operator license,
    the holder shall not operate a motor vehicle with more than one passenger under
    the age of 25 who is not a member of the holder's family, unless accompanied by
    a licensed adult at least 25 years of age.
- id: 5
  category: license_system
  question: If you move to New Hampshire and change your permanent residence, you
    must notify the DMV in writing within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: New Hampshire law requires that you notify the DMV in writing of any
    change of residence or name within 30 days of the change.
- id: 6
  category: license_system
  question: What is the minimum visual acuity required in both eyes to pass the New
    Hampshire vision test for a standard driver's license?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: To pass the New Hampshire vision test, you must be able to read the
    20/40 vision line with both eyes.
- id: 7
  category: license_system
  question: A Youth Operator's license may be suspended for how many days for a first-time
    speeding offense or other moving violation?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: Under RSA 263:14, the Director of Motor Vehicles is authorized to suspend
    the license of a Youth Operator for 20 days for a first offense of certain motor
    vehicle violations.
- id: 8
  category: license_system
  question: In New Hampshire, what is the legal Blood Alcohol Concentration (BAC)
    limit for a driver under the age of 21?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: For drivers under the age of 21, it is illegal to operate a vehicle
    with a BAC of 0.02% or higher.
- id: 9
  category: license_system
  question: Which of the following documents is NOT required to be in the vehicle
    while practicing driving in New Hampshire?
  choices:
    A: Proof of insurance
    B: Vehicle registration
    C: A valid birth certificate or social security card
    D: The supervisor's valid driver's license
  answer: C
  explanation: While practicing driving, the vehicle must be registered, and the supervisor
    must have a valid license. While proof of insurance is recommended, NH does not
    strictly require it for all vehicles. However, a birth certificate/SSN card is
    for the DMV application process, not for carry during practice driving.
- id: 10
  category: license_system
  question: 'In New Hampshire, a certificate of title is generally required for all
    motor vehicles except those with a model year older than:'
  choices:
    A: 15 years
    B: 20 years
    C: Year 2000
    D: Year 1995
  answer: C
  explanation: New Hampshire law requires a title for vehicles with a model year of
    2000 or newer. Vehicles with a model year of 1999 or older are title-exempt.
- id: 11
  category: license_system
  question: How many demerit points are assessed for the offense of 'Operating after
    Revocation or Suspension' in New Hampshire?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: Operating after revocation or suspension is a major motor vehicle violation
    and carries 6 demerit points in New Hampshire.
- id: 12
  category: license_system
  question: 'If you are involved in a motor vehicle accident causing death, personal
    injury, or aggregate damage over $1,000, you must file a written report with the
    DMV within:'
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 15 days
  answer: D
  explanation: According to NH RSA 264:25, if property damage is greater than $1,000,
    you must file an official accident report (DSMV 400) with the DMV within 15 days.
- id: 13
  category: license_system
  question: A standard New Hampshire driver's license is valid for how many years
    before it expires?
  choices:
    A: 4 years
    B: 5 years
    C: 6 years
    D: 8 years
  answer: B
  explanation: New Hampshire driver's licenses are generally valid for 5 years and
    expire on the applicant's birthday.
- id: 14
  category: license_system
  question: In New Hampshire, who is required by law to wear a seatbelt or be secured
    in a child restraint system?
  choices:
    A: Only the driver
    B: Only front-seat passengers
    C: Everyone in the vehicle
    D: Anyone under the age of 18
  answer: D
  explanation: New Hampshire law requires that any person under the age of 18 must
    be properly restrained by a safety belt or child restraint seat. NH is the only
    state without a mandatory adult seatbelt law.
- id: 15
  category: license_system
  question: What is the minimum age to apply for a Commercial Driver License (CDL)
    in New Hampshire for intrastate (within NH only) driving?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Applicants must be at least 18 years of age to apply for a CDL for
    intrastate use, and at least 21 years of age for interstate use or to transport
    hazardous materials.
- id: 16
  category: license_system
  question: 'A New Hampshire driver who has been issued a standard Class D operator''s
    license is authorized to drive a vehicle with a Gross Vehicle Weight Rating (GVWR)
    of no more than:'
  choices:
    A: 10,000 lbs.
    B: 18,000 lbs.
    C: 26,000 lbs.
    D: 32,000 lbs.
  answer: C
  explanation: According to the NH Driver's Manual, a Class D Operator license allows
    you to drive a vehicle with a GVWR of 26,000 lbs. or less, provided you are not
    towing a trailer over 10,000 lbs.
- id: 17
  category: license_system
  question: 'New Hampshire driver licenses generally expire on the applicant''s birthday
    every:'
  choices:
    A: 4 years
    B: 5 years
    C: 6 years
    D: 8 years
  answer: B
  explanation: In New Hampshire, a driver's license is valid for five years and expires
    on the licensee's birthday.
- id: 18
  category: license_system
  question: If you are a new resident to New Hampshire and hold a valid out-of-state
    driver's license, you must obtain a NH license within how many days of establishing
    residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: New residents have 60 days to obtain a New Hampshire driver license
    after moving to the state.
- id: 19
  category: license_system
  question: For a driver age 21 or older, the New Hampshire DMV will suspend the license
    for accumulating how many points in a single calendar year?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: An adult driver (21+) will face a license suspension if they accumulate
    12 points in one calendar year.
- id: 20
  category: license_system
  question: A driver between the ages of 18 and 20 will have their license suspended
    if they accumulate how many points within a single calendar year?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: Drivers aged 18, 19, or 20 are subject to suspension if they accumulate
    9 points in one calendar year.
- id: 21
  category: license_system
  question: If a New Hampshire driver has a physical disability that limits their
    vision to only one eye, what is the minimum visual acuity required in that eye
    to pass the vision test?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: B
  explanation: While 20/40 is the standard for both eyes, if a person has sight in
    only one eye, they must have at least 20/30 vision in that eye to pass.
- id: 22
  category: license_system
  question: Under New Hampshire's 'Habitual Offender' law, a person's license may
    be revoked for 1 to 4 years if they are convicted of how many 'major' traffic
    offenses within a 5-year period?
  choices:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
  answer: B
  explanation: The Habitual Offender law applies to drivers who accumulate 3 major
    traffic convictions (such as DWI or Reckless Driving) within a 5-year period.
- id: 23
  category: license_system
  question: 'In New Hampshire, if you change your legal name due to marriage or court
    order, you must notify the DMV and apply for a replacement license within:'
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: New Hampshire law requires drivers to notify the DMV of a name change
    within 30 days.
- id: 24
  category: license_system
  question: To qualify for a New Hampshire driver's license, an applicant under the
    age of 18 must complete a driver education program consisting of at least how
    many hours of classroom instruction?
  choices:
    A: 20 hours
    B: 30 hours
    C: 40 hours
    D: 50 hours
  answer: B
  explanation: The state-approved driver education program requires a minimum of 30
    hours of classroom instruction.
- id: 25
  category: license_system
  question: In addition to classroom and behind-the-wheel time, how many hours of
    'observation' (watching another student drive) are required in a New Hampshire
    driver education course?
  choices:
    A: 4 hours
    B: 6 hours
    C: 8 hours
    D: 10 hours
  answer: B
  explanation: New Hampshire driver education requires 6 hours of observation time
    in the vehicle.
- id: 26
  category: license_system
  question: Before applying for a license, a person under 18 must log how many total
    hours of supervised practice driving (excluding driver education time)?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: B
  explanation: NH law requires 40 hours of supervised practice driving, 10 of which
    must be at night, in addition to the hours spent in a driver education course.
- id: 27
  category: license_system
  question: What is the minimum age a New Hampshire resident can apply for a non-driver
    identification card?
  choices:
    A: 10 years old
    B: 12 years old
    C: 14 years old
    D: 16 years old
  answer: B
  explanation: Any New Hampshire resident 12 years of age or older may apply for a
    non-driver photo ID card.
- id: 28
  category: license_system
  question: Which of the following is a requirement to obtain a New Hampshire Moped
    License?
  choices:
    A: You must be at least 15 years old
    B: You must be at least 16 years old
    C: You must complete a 20-hour safety course
    D: You must hold a valid Class D license first
  answer: B
  explanation: To operate a moped in NH, you must be at least 16 years old and hold
    either a valid driver's license or a special moped license.
- id: 29
  category: license_system
  question: How many demerit points are assessed against a New Hampshire driver's
    record for 'Failure to yield right of way'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failure to yield right of way is a 4-point violation in the New Hampshire
    demerit point system.
- id: 30
  category: license_system
  question: If you are under 18 and applying for a New Hampshire driver's license,
    who must sign the 'Parental Authorization Certificate'?
  choices:
    A: A driver education instructor
    B: A school principal
    C: A parent, guardian, or responsible adult
    D: A notary public only
  answer: C
  explanation: Applicants under 18 must have a parent, legal guardian, or other responsible
    adult sign the authorization form to apply for a license.
- id: 31
  category: driver_testing
  question: The New Hampshire DMV knowledge test consists of how many multiple-choice
    questions?
  choices:
    A: '25'
    B: '30'
    C: '40'
    D: '50'
  answer: C
  explanation: The New Hampshire knowledge test is an automated touch-screen test
    consisting of 40 multiple-choice questions.
- id: 32
  category: driver_testing
  question: 'Under New Hampshire''s Implied Consent law, if you refuse to submit to
    a chemical test of your blood, breath, or urine, your license will be suspended
    for at least:'
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: B
  explanation: New Hampshire's Implied Consent law dictates that any person who operates
    a motor vehicle in the state is deemed to have given consent to chemical testing.
    Refusal results in a 180-day license suspension for a first offense.
- id: 33
  category: driver_testing
  question: In a New Hampshire school zone, the speed limit is how many miles per
    hour below the usual posted speed limit during the 45 minutes before and after
    school?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: New Hampshire law requires drivers to maintain a speed 10 mph below
    the usual posted limit in school zones during the 45 minutes before and after
    school opening and closing.
- id: 34
  category: driver_testing
  question: 'To maintain a safe following distance under normal driving conditions,
    the New Hampshire Driver''s Manual recommends following the vehicle ahead by at
    least:'
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: New Hampshire recommends the 'four-second rule' to maintain a safe
    following distance between your vehicle and the one in front of you.
- id: 35
  category: driver_testing
  question: When driving on a highway in New Hampshire, you must signal your intention
    to turn or change lanes at least how many feet before doing so?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: In New Hampshire, you must signal at least 100 feet before a turn in
    city or rural areas, but on a highway, you must signal at least 500 feet before
    turning or changing lanes.
- id: 36
  category: driver_testing
  question: When passing another vehicle on a two-lane road, you must be able to return
    to your lane before coming within how many feet of any oncoming vehicle?
  choices:
    A: 100 feet
    B: 150 feet
    C: 200 feet
    D: 300 feet
  answer: C
  explanation: New Hampshire law requires that you return to your lane of travel after
    passing before coming within 200 feet of any vehicle approaching from the opposite
    direction.
- id: 37
  category: driver_testing
  question: In New Hampshire, it is illegal to park within how many feet of a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: According to New Hampshire parking regulations, you may not park a
    vehicle within 15 feet of a fire hydrant.
- id: 38
  category: driver_testing
  question: You may not park your vehicle within how many feet of a stop sign, yield
    sign, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: New Hampshire law prohibits parking a vehicle within 30 feet of any
    stop sign, yield sign, or traffic control signal.
- id: 39
  category: driver_testing
  question: When driving at night, you must dim your high beam headlights when an
    approaching vehicle is within how many feet?
  choices:
    A: 150 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: New Hampshire law requires drivers to switch from high beams to low
    beams when an oncoming vehicle is within 500 feet.
- id: 40
  category: driver_testing
  question: 'To pass the New Hampshire vehicle inspection, tires must have a minimum
    tread depth of:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 3/32 of an inch
    D: 4/32 of an inch
  answer: B
  explanation: New Hampshire law requires that tires have at least 2/32 of an inch
    of tread depth in all areas of the tire to pass safety inspection.
- id: 41
  category: driver_testing
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended, drivers must stop at least how many feet away?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: D
  explanation: In New Hampshire, drivers approaching a school bus from any direction
    must stop at least 25 feet away when the bus has its red lights flashing.
- id: 42
  category: driver_testing
  question: When passing a bicycle in New Hampshire, a driver must maintain a distance
    of 3 feet when traveling at 30 mph. For every additional 10 mph of speed, how
    much extra distance must be added?
  choices:
    A: 6 inches
    B: 1 foot
    C: 2 feet
    D: 3 feet
  answer: B
  explanation: NH RSA 265:143-a requires 3 feet of distance at 30 mph, and an additional
    1 foot of distance for every 10 mph above 30 mph.
- id: 43
  category: driver_testing
  question: 'For an individual owner, a New Hampshire vehicle registration expires
    annually on:'
  choices:
    A: December 31st
    B: The last day of the owner's birth month
    C: One year from the date of purchase
    D: January 1st
  answer: B
  explanation: In New Hampshire, vehicle registrations for individuals expire on the
    last day of the owner's birth month.
- id: 44
  category: driver_testing
  question: 'In New Hampshire, a person 21 years of age or older is considered legally
    intoxicated if their Blood Alcohol Concentration (BAC) is:'
  choices:
    A: 0.02% or higher
    B: 0.05% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: For drivers 21 years of age or older, the legal limit for Blood Alcohol
    Concentration (BAC) in New Hampshire is 0.08%.
- id: 45
  category: driver_testing
  question: 'During the New Hampshire road test, the vehicle provided by the applicant
    must have a parking brake that is:'
  choices:
    A: Electronic only
    B: Located on the floor to the left of the driver
    C: Accessible to the examiner between the front seats
    D: Engaged automatically when the car is in Park
  answer: C
  explanation: New Hampshire law requires that the vehicle used for the road test
    have a parking brake located such that the examiner may assist in stopping the
    vehicle if necessary.
- id: 46
  category: driver_testing
  question: The New Hampshire automated knowledge (written) test consists of 40 multiple-choice
    questions. How much time is allotted to complete this test?
  choices:
    A: 20 minutes
    B: 30 minutes
    C: 40 minutes
    D: 60 minutes
  answer: C
  explanation: Applicants are given 40 minutes to complete the 40-question automated
    knowledge test at the DMV.
- id: 47
  category: driver_testing
  question: If an applicant fails any part of the New Hampshire driver's test (vision,
    knowledge, or road), how long must they wait before they are eligible to retest?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 10 days
  answer: D
  explanation: New Hampshire DMV policy requires a waiting period of 10 days before
    an applicant can retake a failed portion of the driver's examination.
- id: 48
  category: driver_testing
  question: In New Hampshire, motor vehicles must be inspected once a year. In which
    month must the inspection be performed?
  choices:
    A: January
    B: The owner's month of birth
    C: The month the vehicle was purchased
    D: December
  answer: B
  explanation: New Hampshire law requires annual vehicle inspections to be completed
    during the owner's birth month.
- id: 49
  category: driver_testing
  question: Under New Hampshire's hands-free electronic device law, what is the fine
    for a first offense of using a handheld mobile device while driving?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: The fine for a first offense of violating the hands-free law (RSA 265:79-c)
    is $100, plus a penalty assessment.
- id: 50
  category: driver_testing
  question: New Hampshire's 'Move Over' law requires drivers to vacate the lane next
    to a stationary emergency vehicle. What is the minimum fine for a first offense
    of this law?
  choices:
    A: $50
    B: $75
    C: $150
    D: $200
  answer: B
  explanation: The fine for a first offense of failing to move over for an emergency
    vehicle with flashing lights is $75 plus penalty assessment.
- id: 51
  category: driver_testing
  question: A person may be declared a 'Habitual Offender' in New Hampshire and lose
    their driving privileges for up to 4 years if they accumulate how many 'major'
    traffic convictions within a 5-year period?
  choices:
    A: '2'
    B: '3'
    C: '5'
    D: '10'
  answer: B
  explanation: Under RSA 259:39, a person who accumulates 3 major traffic convictions
    (such as DUI or Reckless Driving) within 5 years is classified as a Habitual Offender.
- id: 52
  category: driver_testing
  question: 'For a first-offense DUI conviction in New Hampshire, the court will revoke
    the driver''s license for a minimum period of:'
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 1 year
  answer: C
  explanation: A first-offense DUI conviction in New Hampshire carries a mandatory
    minimum license revocation of 9 months.
- id: 53
  category: driver_testing
  question: The New Hampshire Driver's Manual recommends that drivers hold the steering
    wheel at which clock positions to reduce the risk of injury from an airbag?
  choices:
    A: 10 and 2
    B: 9 and 3 or 8 and 4
    C: 12 and 6
    D: 7 and 5
  answer: B
  explanation: The NH Driver's Manual recommends the 9 and 3 or 8 and 4 positions
    to keep hands away from the top of the wheel where the airbag deploys.
- id: 54
  category: driver_testing
  question: Under normal driving conditions in New Hampshire, what is the recommended
    following distance behind the vehicle in front of you?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 1 car length for every 10 mph
  answer: C
  explanation: The New Hampshire Driver's Manual recommends a minimum following distance
    of 4 seconds under normal conditions.
- id: 55
  category: driver_responsibility
  question: In New Hampshire, if you are required to file proof of financial responsibility
    (SR-22 insurance) following a conviction or accident, for how many years must
    you usually maintain this proof?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Under New Hampshire law, when a driver is required to provide proof
    of financial responsibility (SR-22), it must typically be maintained for a period
    of 3 years.
- id: 56
  category: driver_responsibility
  question: When registering a motor vehicle in New Hampshire, what is the first step
    a resident must take?
  choices:
    A: Visit the State DMV office directly
    B: Visit the Town or City Clerk to pay local permit fees
    C: Get the vehicle inspected at a gas station
    D: Mail a copy of the title to the Governor's office
  answer: B
  explanation: New Hampshire is a two-step registration state. Residents must first
    go to their local Town or City Clerk to pay the local permit fees before completing
    the registration with the State DMV.
- id: 57
  category: driver_responsibility
  question: According to New Hampshire law, in which month must a privately owned
    vehicle be inspected annually?
  choices:
    A: January
    B: The owner's birth month
    C: The month the vehicle was purchased
    D: December
  answer: B
  explanation: New Hampshire requires annual vehicle safety and emissions inspections,
    which must be completed by the end of the owner's birth month.
- id: 58
  category: driver_responsibility
  question: Under New Hampshire's 'Implied Consent' law, what is the penalty for a
    first-time refusal to submit to a breath, blood, or urine test when requested
    by a law enforcement officer?
  choices:
    A: A 90-day license suspension
    B: A 180-day license suspension
    C: A mandatory 2-day jail sentence
    D: A $1,000 fine only
  answer: B
  explanation: By driving on New Hampshire roadways, you have given 'implied consent'
    to testing. Refusal to submit to a test results in an administrative license suspension
    of 180 days for a first offense.
- id: 59
  category: driver_responsibility
  question: New Hampshire law prohibits the transport of an open container of alcohol
    in which part of the vehicle?
  choices:
    A: The trunk
    B: The passenger area
    C: A locked glove compartment
    D: Behind the last upright seat of a hatchback
  answer: B
  explanation: It is illegal to have an open container of alcohol in the passenger
    area of a vehicle. It must be stored in the trunk or, in vehicles without a trunk,
    in the area least accessible to the driver.
- id: 60
  category: driver_responsibility
  question: If a New Hampshire driver is required to carry liability insurance, what
    are the minimum coverage limits required by law?
  choices:
    A: 10/20/10 ($10k/$20k/$10k)
    B: 15/30/15 ($15k/$30k/$15k)
    C: 25/50/25 ($25k/$50k/$25k)
    D: 50/100/50 ($50k/$100k/$50k)
  answer: C
  explanation: In New Hampshire, the minimum statutory limits for motor vehicle liability
    insurance are $25,000 for bodily injury to one person, $50,000 for bodily injury
    to two or more people, and $25,000 for property damage.
- id: 61
  category: driver_responsibility
  question: 'In New Hampshire, a driver can be charged with ''Aggravated DWI'' if
    they drive with a Blood Alcohol Concentration (BAC) of:'
  choices:
    A: 0.08% or higher
    B: 0.10% or higher
    C: 0.12% or higher
    D: 0.16% or higher
  answer: D
  explanation: A person can be charged with Aggravated DWI in New Hampshire if their
    BAC is 0.16% or higher, or if they are speeding or involved in an accident while
    intoxicated.
- id: 62
  category: driver_responsibility
  question: What is the minimum fine for a person found guilty of littering from a
    motor vehicle on New Hampshire roadways?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: New Hampshire RSA 265:102 states that any person who violates the littering
    law shall be guilty of a violation and may be fined a minimum of $250.
- id: 63
  category: driver_responsibility
  question: In New Hampshire, what is the minimum fine for a first offense of parking
    in a space designated for persons with disabilities without a proper plate or
    placard?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: Under RSA 265:74, the minimum fine for unauthorized parking in a space
    reserved for persons with disabilities is $250.
- id: 64
  category: driver_responsibility
  question: 'If a driver under the age of 21 is convicted of transporting alcohol
    in a motor vehicle (and is not accompanied by a parent/guardian/legal-age spouse),
    their license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: New Hampshire law (RSA 265-A:45) mandates a 60-day license suspension
    for any person under 21 convicted of transporting alcohol.
- id: 65
  category: driver_responsibility
  question: When a New Hampshire resident purchases a vehicle from a private party,
    they may obtain a temporary registration (20-day plate) from the DMV. How long
    is this plate valid?
  choices:
    A: 10 days
    B: 15 days
    C: 20 days
    D: 30 days
  answer: C
  explanation: New Hampshire provides a 20-day temporary registration plate to allow
    residents to operate a newly purchased vehicle while they complete the permanent
    registration process.
- id: 66
  category: driver_responsibility
  question: How many demerit points are assessed for a conviction of speeding 25 mph
    or more over the posted speed limit in New Hampshire?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Speeding 25 mph or more above the limit results in 4 demerit points
    on a New Hampshire driving record. Speeding 1-24 mph over results in 3 points.
- id: 67
  category: driver_responsibility
  question: While New Hampshire does not require all drivers to carry auto insurance,
    what happens if an uninsured driver is at fault in an accident and cannot pay
    for the damages?
  choices:
    A: The state pays the damages for them
    B: The driver's license and registration will be suspended
    C: The driver is required to perform 100 hours of community service
    D: Nothing, as insurance is not mandatory
  answer: B
  explanation: New Hampshire follows a 'Financial Responsibility' law. If an uninsured
    driver is at fault in an accident and fails to pay damages, the DMV will suspend
    their license and registration until they settle the claim and file proof of future
    financial responsibility (SR-22).
- id: 68
  category: driver_responsibility
  question: Although New Hampshire does not require all drivers to carry auto insurance,
    if you are required to provide proof of financial responsibility after an accident,
    what is the name of the certificate your insurance company must file with the
    DMV?
  choices:
    A: Form 10-40
    B: SR-22
    C: NH-Accident Proof
    D: Certificate of Liability
  answer: B
  explanation: In New Hampshire, an SR-22 certificate is a form of proof of financial
    responsibility that must be filed by an insurance company for individuals required
    by law to show they have the minimum required liability insurance.
- id: 69
  category: driver_responsibility
  question: In New Hampshire, a privately owned motor vehicle must be inspected annually
    during which month?
  choices:
    A: January
    B: The month the vehicle was purchased
    C: The owner's month of birth
    D: December
  answer: C
  explanation: New Hampshire law requires that motor vehicles be inspected annually
    during the owner's month of birth.
- id: 70
  category: driver_responsibility
  question: When registering a motor vehicle in New Hampshire, where must a resident
    typically go first to pay the local permit fee?
  choices:
    A: The State House
    B: The DMV Headquarters in Concord
    C: The Town or City Clerk's office
    D: The local police station
  answer: C
  explanation: New Hampshire residents must first go to their Town or City Clerk to
    pay the local permit tax before completing the registration process with the DMV.
- id: 71
  category: driver_responsibility
  question: 'Under New Hampshire''s ''Implied Consent'' law, by driving a vehicle
    in the state, you have given consent to:'
  choices:
    A: A search of your vehicle at any time
    B: Have your vehicle impounded for any traffic violation
    C: Test your blood, breath, or urine for alcohol or drugs if arrested for DWI
    D: Allow passengers to consume alcohol in your vehicle
  answer: C
  explanation: The Implied Consent law means that any person who operates a motor
    vehicle in NH is deemed to have given consent to chemical testing if arrested
    for an offense arising out of acts alleged to have been committed while driving
    under the influence.
- id: 72
  category: driver_responsibility
  question: If a New Hampshire driver refuses to submit to a chemical test of their
    blood, breath, or urine upon arrest for DWI, their license will be suspended for
    a period of how many days for a first offense?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 365 days
  answer: C
  explanation: Under the Implied Consent law, a first-time refusal to submit to a
    chemical test results in an administrative license suspension of 180 days.
- id: 73
  category: driver_responsibility
  question: For a driver age 21 or older, what is the legal Blood Alcohol Concentration
    (BAC) limit at which they are considered to be driving under the influence in
    New Hampshire?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In New Hampshire, it is illegal for any person 21 years of age or older
    to operate a vehicle with a BAC of 0.08% or higher.
- id: 74
  category: driver_responsibility
  question: If a New Hampshire driver chooses to purchase liability insurance, what
    are the minimum required limits for bodily injury for one person and for property
    damage?
  choices:
    A: $10,000 / $5,000
    B: $25,000 / $25,000
    C: $50,000 / $10,000
    D: $100,000 / $50,000
  answer: B
  explanation: The minimum financial responsibility limits in NH are $25,000 for bodily
    injury to one person, $50,000 for bodily injury to two or more people, and $25,000
    for property damage (25/50/25).
- id: 75
  category: driver_responsibility
  question: A new resident to New Hampshire must register their motor vehicle within
    how many days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: New residents have a 60-day grace period to register their vehicles
    after moving to New Hampshire.
- id: 76
  category: driver_responsibility
  question: What is the fee for a duplicate certificate of title in New Hampshire
    if the original is lost, stolen, or destroyed?
  choices:
    A: $10
    B: $15
    C: $25
    D: $50
  answer: C
  explanation: New Hampshire charges a $25 fee for the issuance of a duplicate certificate
    of title.
- id: 77
  category: driver_responsibility
  question: Demerit points assessed against a New Hampshire driver's license for a
    traffic conviction remain on the driver's record for how long from the date of
    the finding?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Points assessed for a motor vehicle conviction in New Hampshire are
    cleared from your record three years from the date of the finding.
- id: 78
  category: driver_responsibility
  question: According to New Hampshire law, where must the registration certificate
    for a motor vehicle be kept?
  choices:
    A: At the owner's residence
    B: In the vehicle's glove compartment or on the driver's person
    C: In the trunk of the vehicle
    D: At the Town Clerk's office
  answer: B
  explanation: New Hampshire law requires that the registration certificate be carried
    in the vehicle or on the person of the driver while the vehicle is being operated.
- id: 79
  category: driver_responsibility
  question: If a New Hampshire driver is required to file an SR-22 as proof of financial
    responsibility, for how many years must they typically maintain this filing?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 10 years
  answer: C
  explanation: Proof of financial responsibility (SR-22) is generally required to
    be maintained for a period of three years in New Hampshire.
- id: 80
  category: driver_responsibility
  question: When a New Hampshire resident registers a vehicle for the first time,
    they have how many days from the date of registration to have the vehicle inspected?
  choices:
    A: 5 days
    B: 10 days
    C: 20 days
    D: 30 days
  answer: B
  explanation: A vehicle must be inspected within 10 days of being registered in New
    Hampshire.
- id: 81
  category: safe_driving_rules
  question: In New Hampshire, what is the speed limit in a school zone during the
    period 45 minutes before and 45 minutes after school sessions?
  choices:
    A: 15 mph
    B: 20 mph
    C: 10 mph below the usual posted limit
    D: 25 mph
  answer: C
  explanation: According to NH RSA 265:60, the speed limit in a school zone is 10
    mph below the usual posted limit from 45 minutes before to 45 minutes after school
    sessions begin and end.
- id: 82
  category: safe_driving_rules
  question: You may not park your vehicle within how many feet of a crosswalk at an
    intersection in New Hampshire?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Under New Hampshire law, you are prohibited from parking within 20
    feet of a crosswalk at an intersection.
- id: 83
  category: safe_driving_rules
  question: When parking near a stop sign, flashing beacon, or traffic control signal
    in New Hampshire, what is the minimum required distance you must maintain?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: NH RSA 265:69 states that you cannot park within 30 feet of any flashing
    beacon, stop sign, or traffic control signal located at the side of the roadway.
- id: 84
  category: safe_driving_rules
  question: In New Hampshire, you are prohibited from passing another vehicle when
    you are within how many feet of a bridge, viaduct, or tunnel?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: NH RSA 265:19 prohibits driving on the left side of the roadway (passing)
    when approaching within 100 feet of any bridge, viaduct, or tunnel.
- id: 85
  category: safe_driving_rules
  question: New Hampshire law requires drivers to turn on their headlights during
    what time period?
  choices:
    A: From sunset to sunrise
    B: From 1/2 hour after sunset to 1/2 hour before sunrise
    C: From 1 hour after sunset to 1 hour before sunrise
    D: Only when visibility is less than 1,000 feet
  answer: B
  explanation: According to NH RSA 266:31, headlights must be turned on from 1/2 hour
    after sunset to 1/2 hour before sunrise.
- id: 86
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in a business or urban
    residence district in New Hampshire?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Under NH RSA 265:60, the default speed limit in any business or urban
    residence district is 30 mph.
- id: 87
  category: safe_driving_rules
  question: In New Hampshire, you must dim your high beam headlights when you are
    within how many feet of an oncoming vehicle?
  choices:
    A: 150 feet
    B: 250 feet
    C: 350 feet
    D: 500 feet
  answer: A
  explanation: New Hampshire law requires drivers to switch to low beams when an oncoming
    vehicle is within 150 feet or when following another vehicle within 150 feet.
- id: 88
  category: safe_driving_rules
  question: What is the minimum fine for speeding in a highway work zone in New Hampshire?
  choices:
    A: $100
    B: $200
    C: $250
    D: $500
  answer: C
  explanation: According to NH RSA 265:79-c, any person convicted of speeding in a
    highway work zone shall be fined not less than $250 nor more than $500.
- id: 89
  category: safe_driving_rules
  question: When approaching a school zone in New Hampshire, the speed limit is 10
    mph below the usual posted speed limit during specific times. When does this rule
    apply?
  choices:
    A: From 8:00 AM to 4:00 PM only
    B: Only when children are visible on the sidewalk
    C: 45 minutes before and after school opening and closing
    D: From 30 minutes before school starts until 30 minutes after school lets out
  answer: D
  explanation: 'New Hampshire law states that the speed limit in a school zone is
    10 mph below the usual posted limit from 45 minutes before school opens until
    school begins, and from the time school lets out until 45 minutes later. (Note:
    The manual specifically cites the 45-minute window for the reduced limit).'
- id: 90
  category: safe_driving_rules
  question: When you are about to make a turn in a city or town, New Hampshire law
    requires you to signal at least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: In New Hampshire, you must give a continuous turn signal for at least
    100 feet before turning. On a highway, this distance increases to 500 feet.
- id: 91
  category: safe_driving_rules
  question: In New Hampshire, you must stop at least how many feet away from a school
    bus that has its red flashing lights on and stop arm extended?
  choices:
    A: 15 feet
    B: 20 feet
    C: 25 feet
    D: 50 feet
  answer: C
  explanation: Drivers in New Hampshire must stop at least 25 feet from a school bus
    that is picking up or dropping off passengers with its red lights flashing.
- id: 92
  category: safe_driving_rules
  question: 'The New Hampshire Driver''s Manual recommends following the vehicle in
    front of you at a distance of at least:'
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: While many states use a 2 or 3-second rule, the New Hampshire Driver's
    Manual specifically recommends a 4-second following distance under normal conditions.
- id: 93
  category: safe_driving_rules
  question: According to New Hampshire law, when must you turn on your vehicle's headlights?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: Only when visibility is less than 1,000 feet
  answer: C
  explanation: New Hampshire law requires headlights to be on from 30 minutes after
    sunset to 30 minutes before sunrise, and anytime you cannot see clearly for 1,000
    feet.
- id: 94
  category: safe_driving_rules
  question: In New Hampshire, you are prohibited from parking within how many feet
    of a stop sign, flashing beacon, or yield sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: New Hampshire law prohibits parking within 30 feet of any stop sign,
    yield sign, or traffic control signal.
- id: 95
  category: safe_driving_rules
  question: In New Hampshire, you must not park within how many feet of the driveway
    entrance to any fire station?
  choices:
    A: 20 feet on the same side of the street
    B: 50 feet on the same side of the street
    C: 100 feet on the opposite side of the street
    D: 15 feet on either side
  answer: A
  explanation: New Hampshire law states you cannot park within 20 feet of a fire station
    driveway on the same side of the street, or within 75 feet on the opposite side
    of the street.
- id: 96
  category: defensive_driving
  question: According to the New Hampshire Driver's Manual, what is the recommended
    following distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: C
  explanation: The New Hampshire Driver's Manual recommends using the 'four-second
    rule' to maintain a safe following distance under ideal driving conditions.
- id: 97
  category: defensive_driving
  question: To scan the road properly and avoid last-minute braking or turning, New
    Hampshire law and safety guidelines suggest looking how many seconds ahead?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 30 seconds
  answer: C
  explanation: Drivers should look about 15 seconds ahead of their vehicle to identify
    potential hazards early, which is about one city block or a quarter-mile on the
    highway.
- id: 98
  category: defensive_driving
  question: 'Hydroplaning, where tires lose contact with the road surface and ride
    on a film of water, can begin at speeds as low as:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: In New Hampshire safety manuals, it is noted that hydroplaning can
    start at speeds as low as 35 mph, and tires may lose all face contact with the
    road at 55 mph.
- id: 99
  category: defensive_driving
  question: Under New Hampshire's 'Jessica's Law' (RSA 265:79-b), a driver can be
    cited for failing to clear snow or ice from their vehicle if it poses a threat
    to others. What is the minimum fine for a first offense?
  choices:
    A: ' $50'
    B: ' $100'
    C: ' $250'
    D: ' $500'
  answer: C
  explanation: Jessica's Law mandates that drivers clear snow and ice from their vehicles.
    A first offense carries a fine of not less than $250 and not more than $500.
- id: 100
  category: defensive_driving
  question: When driving in heavy fog in New Hampshire, which headlight setting should
    you use to maintain the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the fog particles
    and cause glare, making it harder for the driver to see.
- id: 101
  category: defensive_driving
  question: If you are driving at 55 mph, your vehicle will travel approximately how
    many feet in the time it takes for an average driver to react to a hazard and
    apply the brakes?
  choices:
    A: 20 feet
    B: 60 feet
    C: 120 feet
    D: 200 feet
  answer: B
  explanation: At 55 mph, the reaction distance (the distance traveled before the
    brakes are applied) is approximately 60 feet.
- id: 102
  category: defensive_driving
  question: 'To check your ''blind spot'' before changing lanes in New Hampshire,
    you should:'
  choices:
    A: Check your rearview mirror
    B: Check your side mirror
    C: Turn your head and look over your shoulder
    D: Honk your horn to warn others
  answer: C
  explanation: Mirrors do not show everything. To properly check a blind spot, you
    must turn your head and look over your shoulder in the direction you plan to move.
- id: 103
  category: defensive_driving
  question: New Hampshire's 'Move Over' law requires drivers to do what when approaching
    stationary emergency vehicles with flashing lights?
  choices:
    A: Maintain speed but move to the left lane
    B: Stop immediately in the roadway
    C: Vacate the lane as soon as safe and reduce speed
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: RSA 265:37-a requires drivers to move into a lane not adjacent to the
    emergency vehicle if possible, and to reduce speed to a level that is safe for
    conditions.
- id: 104
  category: defensive_driving
  question: 'In New Hampshire, if you see a pedestrian using a guide dog or carrying
    a white cane (with or without a red tip), you must:'
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Wait for them to wave you through
    D: Only stop if they are in a marked crosswalk
  answer: B
  explanation: Under RSA 265:41, drivers must yield the right-of-way to any totally
    or partially blind pedestrian carrying a cane or using a guide dog, regardless
    of where they are crossing.
- id: 105
  category: defensive_driving
  question: 'If your vehicle begins to skid on a slippery New Hampshire road, the
    correct defensive driving response is to:'
  choices:
    A: Brake hard immediately
    B: Steer in the direction the rear of the vehicle is sliding
    C: Steer in the opposite direction of the slide
    D: Shift the car into neutral
  answer: B
  explanation: To recover from a skid, you should take your foot off the gas and steer
    in the direction that the rear of the vehicle is sliding.
- id: 106
  category: defensive_driving
  question: When approaching a railroad crossing with flashing lights or a lowering
    gate, New Hampshire law requires you to stop your vehicle within what distance
    from the nearest rail?
  choices:
    A: Between 5 and 10 feet
    B: Between 15 and 50 feet
    C: Exactly 25 feet
    D: At least 100 feet
  answer: B
  explanation: RSA 265:48 requires drivers to stop not less than 15 feet and not more
    than 50 feet from the nearest rail of a railroad crossing when signals indicate
    a train is coming.
- id: 107
  category: defensive_driving
  question: New Hampshire drivers who successfully complete an approved Driver Improvement
    Course may be eligible for a reduction of how many points from their driving record?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: The New Hampshire DMV allows a 3-point reduction for drivers who voluntarily
    complete an approved defensive driving/driver improvement course.
- id: 108
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in New Hampshire,
    you should look down the road at least how many seconds ahead?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 30 seconds
  answer: C
  explanation: The New Hampshire Driver's Manual states that safe drivers try to look
    at least 15 seconds ahead to anticipate hazards.
- id: 109
  category: defensive_driving
  question: Under New Hampshire's 'Jessica's Law,' what is a driver required to do
    before operating a vehicle during winter conditions?
  choices:
    A: Warm the engine for at least 10 minutes
    B: Clear all snow and ice from the entire vehicle
    C: Only clear the windshield and front side windows
    D: Turn on hazard lights while driving in snow
  answer: B
  explanation: Jessica's Law (RSA 265:79-b) requires drivers to clear all snow and
    ice from the entire vehicle so it does not pose a danger to others; failure to
    do so can result in significant fines.
- id: 110
  category: defensive_driving
  question: 'The New Hampshire Driver''s Manual states that the average perception-reaction
    time for a driver to see a hazard and apply the brakes is:'
  choices:
    A: 1/4 of a second
    B: 1/2 of a second
    C: 3/4 of a second
    D: 1 full second
  answer: C
  explanation: The manual uses 3/4 of a second as the standard average reaction time
    for calculations regarding stopping distances.
- id: 111
  category: defensive_driving
  question: 'When passing another vehicle in New Hampshire, you should not return
    to the right lane until:'
  choices:
    A: You are 10 feet past the vehicle
    B: You can see the headlights of the vehicle you passed in your rearview mirror
    C: The other driver flashes their lights at you
    D: You have traveled at least 100 feet
  answer: B
  explanation: The NH Driver's Manual instructs drivers to wait until they can see
    the headlights of the passed vehicle in their rearview mirror before returning
    to the lane.
- id: 112
  category: defensive_driving
  question: 'In New Hampshire, a vehicle''s tires are considered unsafe if the tread
    depth is less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: New Hampshire law (RSA 266:51) requires tires to have at least 2/32
    of an inch of tread depth in all major grooves.
- id: 113
  category: defensive_driving
  question: When parking your vehicle on a public road in New Hampshire, your wheels
    must be no more than how many inches from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: New Hampshire law requires that vehicles be parked parallel to the
    curb and within 12 inches of it.
- id: 114
  category: alcohol_drugs_health
  question: 'In New Hampshire, a person is guilty of Aggravated DWI if they drive
    with a Blood Alcohol Concentration (BAC) of at least:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.16%
    D: 0.20%
  answer: C
  explanation: While the legal limit is 0.08%, NH RSA 265-A:3 defines Aggravated DWI
    as operating a vehicle with a BAC of 0.16% or higher.
- id: 115
  category: alcohol_drugs_health
  question: According to New Hampshire law, if a vehicle does not have a trunk, where
    must an open container of an alcoholic beverage be stored?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: Behind the last upright seat
    D: In a cup holder, as long as the driver is not drinking it
  answer: C
  explanation: NH RSA 265-A:44 states that if a vehicle does not have a trunk, open
    containers must be kept behind the last upright seat or in an area not normally
    occupied by the driver or passengers.
- id: 116
  category: alcohol_drugs_health
  question: 'A person convicted of a first-offense DWI in New Hampshire will have
    their driver''s license revoked for a period of at least:'
  choices:
    A: 60 days
    B: 90 days
    C: 6 months
    D: 9 months
  answer: D
  explanation: NH RSA 265-A:18 mandates a license revocation of no less than 9 months
    and up to 2 years for a first-offense DWI conviction.
- id: 117
  category: alcohol_drugs_health
  question: 'In New Hampshire, a driver can be charged with Aggravated DWI if they
    are driving while impaired and transporting a passenger under the age of:'
  choices:
    A: '12'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: NH RSA 265-A:3 states that a person is guilty of Aggravated DWI if
    they drive while impaired and transport a person under the age of 16.
- id: 118
  category: alcohol_drugs_health
  question: Which of the following is true regarding marijuana and driving in New
    Hampshire?
  choices:
    A: It is legal to drive under the influence of marijuana if you have a medical
      card
    B: Marijuana only affects driving if combined with alcohol
    C: Driving under the influence of marijuana is a DWI offense
    D: Marijuana does not impair reaction time
  answer: C
  explanation: In New Hampshire, DWI laws apply to alcohol as well as controlled drugs,
    including marijuana, regardless of whether it is used medicinally or recreationally.
- id: 119
  category: alcohol_drugs_health
  question: 'When alcohol is combined with other drugs, the effect on the body is
    often:'
  choices:
    A: Reduced
    B: Cancelled out
    C: Greater than the sum of the two (synergistic)
    D: Exactly the same as alcohol alone
  answer: C
  explanation: The 'synergistic effect' means that combining alcohol and drugs can
    multiply the impairment effects, making it much more dangerous than using either
    substance alone.
- id: 120
  category: alcohol_drugs_health
  question: 'If a driver over 21 submits to a chemical test and the results show a
    BAC of 0.08% or higher, the DMV will issue an Administrative License Suspension
    (ALS) for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: NH RSA 265-A:30 stipulates that a first-time failure of a chemical
    test (0.08% or higher) results in an administrative suspension of 6 months.
- id: 121
  category: alcohol_drugs_health
  question: Besides BAC level, which of the following actions can result in an Aggravated
    DWI charge in New Hampshire?
  choices:
    A: Driving 10 mph over the speed limit
    B: Driving 30 mph or more over the speed limit
    C: Driving with a broken taillight
    D: Driving without a valid registration
  answer: B
  explanation: NH RSA 265-A:3 includes driving 30 mph or more over the prima facie
    speed limit while impaired as a criterion for Aggravated DWI.
- id: 122
  category: alcohol_drugs_health
  question: 'Under New Hampshire law, a person under age 21 who is caught transporting
    alcohol in a motor vehicle (and is not accompanied by a parent/legal guardian
    or of legal age) faces a license suspension of:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: NH RSA 265-A:45 states that a person under 21 transporting alcohol
    shall have their license suspended for 60 days for a first offense.
- id: 123
  category: alcohol_drugs_health
  question: To have a license reinstated after a DWI conviction in New Hampshire,
    the driver must complete which program?
  choices:
    A: The National Safety Council Defensive Driving Course
    B: The Impaired Driver Intervention Program (IDIP)
    C: A standard 30-hour driver education course
    D: A community service program of 100 hours
  answer: B
  explanation: NH law requires those convicted of DWI to complete an Impaired Driver
    Intervention Program (IDIP) or an equivalent program before their license can
    be reinstated.
- id: 124
  category: alcohol_drugs_health
  question: Can a driver in New Hampshire be convicted of DWI for driving under the
    influence of prescription medications?
  choices:
    A: No, as long as the medication was prescribed by a doctor
    B: No, DWI only applies to illegal drugs and alcohol
    C: Yes, if the medication impairs the person's ability to drive safely
    D: Only if the medication is a narcotic
  answer: C
  explanation: NH RSA 265-A:2 applies to any controlled drug, prescription drug, or
    over-the-counter drug that impairs a person's ability to operate a motor vehicle.
- id: 125
  category: alcohol_drugs_health
  question: 'If a person is convicted of a second DWI offense in New Hampshire within
    a 10-year period, the minimum license revocation is:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: According to NH RSA 265-A:18, a second DWI conviction within 10 years
    results in a license revocation of not less than 3 years.
- id: 126
  category: alcohol_drugs_health
  question: Which of the following conditions would lead to a charge of 'Aggravated
    DWI' in the state of New Hampshire?
  choices:
    A: Driving with a BAC of 0.16% or higher
    B: Driving with a BAC of 0.08%
    C: Driving while wearing headphones
    D: Driving with an expired registration while intoxicated
  answer: A
  explanation: Under NH law, Aggravated DWI includes driving with a BAC of 0.16% or
    more, or driving more than 30 mph over the speed limit while intoxicated, among
    other factors.
- id: 127
  category: alcohol_drugs_health
  question: 'If a New Hampshire driver is found to have a controlled drug in their
    possession while operating a motor vehicle, their license shall be revoked for
    a period of:'
  choices:
    A: 30 days to 90 days
    B: 60 days to 2 years
    C: Exactly 1 year
    D: Life
  answer: B
  explanation: Per NH RSA 265-A:43, any person who operates a motor vehicle while
    having in their possession any controlled drug shall have their license revoked
    for a period of not less than 60 days and not more than 2 years.
- id: 128
  category: alcohol_drugs_health
  question: 'New Hampshire''s ''Open Container'' law prohibits the possession of an
    open container of alcohol in the passenger area of a vehicle by:'
  choices:
    A: The driver only
    B: The passengers only
    C: Both the driver and the passengers
    D: Only drivers under the age of 21
  answer: C
  explanation: NH RSA 265-A:44 states that no driver or passenger shall possess an
    open container of alcohol in the passenger area of a motor vehicle while on a
    way.
- id: 129
  category: alcohol_drugs_health
  question: What is the minimum fine for a first-offense DWI (Driving While Intoxicated)
    conviction in New Hampshire?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: According to NH RSA 265-A:18, a first-offense DWI conviction carries
    a minimum fine of $500.
- id: 130
  category: alcohol_drugs_health
  question: 'In New Hampshire, if you have a prior refusal or a prior DWI conviction
    on your record within the last 10 years, a subsequent refusal to submit to a chemical
    test will result in a suspension of:'
  choices:
    A: 180 days
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: Under NH RSA 265-A:14, if there is a prior refusal or alcohol-related
    conviction on the driver's record, the suspension for a subsequent refusal is
    2 years.
- id: 131
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with other drugs, such as prescription
    or over-the-counter medications?
  choices:
    A: The effects of each are cancelled out
    B: There is no change in the effect on driving
    C: It can multiply the effects of both, significantly increasing impairment
    D: It only affects the driver if the drugs are illegal
  answer: C
  explanation: Combining alcohol with other drugs creates a synergistic effect, meaning
    the combined impairment is much greater than the sum of the individual effects.
- id: 132
  category: alcohol_drugs_health
  question: 'A person is guilty of Aggravated DWI in New Hampshire if they drive while
    intoxicated and have a passenger under the age of:'
  choices:
    A: '12'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: NH law classifies a DWI as 'Aggravated' if the driver is intoxicated
    and transports a person under the age of 16.
- id: 133
  category: alcohol_drugs_health
  question: When alcohol is consumed, which of the following is the first ability
    to be affected?
  choices:
    A: Vision
    B: Muscle coordination
    C: Judgment and reasoning
    D: Hearing
  answer: C
  explanation: Alcohol affects the brain's higher functions first, meaning judgment
    and the ability to reason are impaired before physical coordination or vision.
- id: 134
  category: alcohol_drugs_health
  question: In New Hampshire, how long must a person convicted of Aggravated DWI or
    a second-offense DWI have an Ignition Interlock Device (IID) installed in their
    vehicle after license reinstatement?
  choices:
    A: At least 6 months
    B: Not less than 12 months nor more than 2 years
    C: Exactly 5 years
    D: For the rest of their life
  answer: B
  explanation: Per NH RSA 265-A:36-a, the court shall require an IID for not less
    than 12 months nor more than 2 years for Aggravated DWI or repeat offenders.
- id: 135
  category: alcohol_drugs_health
  question: Which of the following is the only way to reduce the Blood Alcohol Concentration
    (BAC) in your body?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Time
  answer: D
  explanation: Only time allows the body to metabolize (oxidize) alcohol. Coffee,
    showers, and exercise do not speed up the process of lowering BAC.
- id: 136
  category: alcohol_drugs_health
  question: 'Under New Hampshire law, a driver under age 21 who is found transporting
    alcohol in any part of a vehicle may have their license suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: NH RSA 265-A:45 states that a person under 21 transporting alcohol
    (unless with a parent/legal guardian/spouse over 21) faces a mandatory 60-day
    license suspension.
- id: 137
  category: alcohol_drugs_health
  question: 'If you are convicted of a DWI in New Hampshire, you will be required
    to file ''Proof of Financial Responsibility'' for a certain period. This is commonly
    known as:'
  choices:
    A: An SR-22 certificate
    B: A Title 21 bond
    C: A Liability Waiver
    D: A DMV Insurance Voucher
  answer: A
  explanation: Drivers convicted of alcohol-related offenses in NH are required to
    have their insurance company file an SR-22 certificate with the DMV to prove they
    carry the required liability insurance.
- id: 138
  category: penalties_and_points
  question: 'In New Hampshire, a first-time conviction for failing to stop for a school
    bus with its red lights flashing results in a mandatory license suspension of:'
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Under RSA 265:54, a first offense for passing a stopped school bus
    with flashing red lights results in a fine and a mandatory 30-day license suspension.
- id: 139
  category: penalties_and_points
  question: 'For a first-offense DWI (Driving While Intoxicated) in New Hampshire,
    the minimum period of license revocation is:'
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 1 year
  answer: C
  explanation: A first-offense DWI conviction in New Hampshire carries a minimum license
    revocation period of 9 months, which can sometimes be reduced upon completion
    of an impaired driver intervention program.
- id: 140
  category: penalties_and_points
  question: If a Youth Operator under age 21 is convicted of a second moving violation,
    their license will be suspended for how many days?
  choices:
    A: 20 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: D
  explanation: 'According to RSA 263:14, the suspension periods for Youth Operators
    are: 30 days for the 1st offense, 60 days for the 2nd offense, and 90 days for
    the 3rd offense.'
- id: 141
  category: penalties_and_points
  question: How many demerit points are assessed for 'Disobeying a Police Officer'
    in New Hampshire?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: Disobeying a police officer is considered a major violation in New
    Hampshire and carries 6 demerit points.
- id: 142
  category: penalties_and_points
  question: 'In New Hampshire, a driver convicted of having an open container of alcohol
    in the passenger area of a vehicle faces a mandatory license suspension of:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: Under RSA 265-A:44, a driver convicted of an open container violation
    faces a mandatory 60-day license suspension.
- id: 143
  category: penalties_and_points
  question: Under 'Jessica's Law' in New Hampshire, a driver who fails to clear snow
    or ice from their vehicle can face a minimum fine of how much for a first offense?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Jessica's Law (RSA 265:79-b) carries a fine of $250 to $500 for a first
    offense of Negligent Driving related to not clearing snow/ice that endangers others.
- id: 144
  category: penalties_and_points
  question: How many demerit points are assessed for a conviction of 'Conduct After
    an Accident' (Hit and Run) in New Hampshire?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Conduct After an Accident is considered a major violation in New Hampshire
    and results in 6 demerit points.
- id: 145
  category: penalties_and_points
  question: 'If a driver is convicted of an ''Open Container'' violation (carrying
    an unsealed alcoholic beverage) for the first time, their license will be suspended
    for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: Per RSA 265-A:44, a first-time conviction for an open container violation
    results in a 60-day license suspension.
- id: 146
  category: penalties_and_points
  question: 'A person found to be a Habitual Offender in New Hampshire faces a mandatory
    license revocation for a period of:'
  choices:
    A: 6 months to 1 year
    B: 1 to 4 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: Once a person is declared a Habitual Offender, their license is revoked
    for a minimum of 1 year and a maximum of 4 years.
- id: 147
  category: penalties_and_points
  question: 'If you are convicted of a second hands-free law violation within a 24-month
    period in New Hampshire, the fine is:'
  choices:
    A: $150
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: The fine for a second hands-free violation within 24 months is $250
    plus penalty assessment.
- id: 148
  category: sharing_the_road
  question: Under New Hampshire's 'Move Over' law, what must a driver do when approaching
    a stationary emergency vehicle with flashing lights on a highway with at least
    two lanes of traffic in the same direction?
  choices:
    A: Maintain speed but honk to alert the emergency workers
    B: Stop completely in the travel lane
    C: Vacate the lane as soon as it is safe to do so
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: NH RSA 265:37-a requires drivers to vacate the lane closest to a stationary
    emergency vehicle with flashing lights if it is safe to do so. If not safe, the
    driver must slow down and proceed with caution.
- id: 149
  category: sharing_the_road
  question: When passing a bicycle in New Hampshire, what is the minimum distance
    a motorist must maintain between their vehicle and the bicycle when traveling
    at 30 mph?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: NH RSA 265:143-a requires motorists to leave a reasonable and prudent
    distance when passing a bicycle, which is at least 3 feet when the vehicle is
    traveling at 30 mph or less.
- id: 150
  category: sharing_the_road
  question: In New Hampshire, for every 10 mph of speed over 30 mph, how much additional
    distance must a driver add to the minimum 3-foot passing requirement for bicycles?
  choices:
    A: 6 inches
    B: 1 foot
    C: 2 feet
    D: 3 feet
  answer: B
  explanation: NH RSA 265:143-a states that for every 10 mph over 30 mph, the driver
    shall allow an additional 1 foot of distance when passing a bicycle.
- id: 151
  category: sharing_the_road
  question: Under New Hampshire law, what is the maximum fine for a first offense
    of failing to stop for a school bus with flashing red lights?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: NH RSA 265:60 stipulates that any person who violates the law regarding
    stopping for a school bus shall be fined not less than $150 nor more than $1,000
    for a first offense.
- id: 152
  category: sharing_the_road
  question: In New Hampshire, at what age is a motorcycle operator or passenger no
    longer legally required to wear a protective helmet?
  choices:
    A: 16 years of age
    B: 18 years of age
    C: 21 years of age
    D: Helmets are always required regardless of age
  answer: B
  explanation: NH RSA 265:122 requires any person under the age of 18 who operates
    or rides upon a motorcycle to wear protective headgear. Those 18 and older are
    not legally required to wear a helmet in NH.
- id: 153
  category: sharing_the_road
  question: 'When a pedestrian is crossing a roadway within a crosswalk and there
    are no traffic control signals in place, New Hampshire law requires the driver
    to:'
  choices:
    A: Slow down and honk
    B: Yield the right-of-way by slowing down or stopping
    C: Maintain speed if the pedestrian is in the other lane
    D: Only stop if the pedestrian is using a white cane
  answer: B
  explanation: NH RSA 265:35 requires drivers to yield the right-of-way, slowing down
    or stopping if need be to yield, to a pedestrian crossing the roadway within a
    crosswalk when traffic control signals are not in place.
- id: 154
  category: sharing_the_road
  question: 'In New Hampshire, ''lane splitting'' (a motorcycle riding between two
    lanes of traffic or sharing a lane with a car) is:'
  choices:
    A: Legal at speeds under 30 mph
    B: Legal only during rush hour
    C: Illegal
    D: Legal if the car driver waves the motorcyclist through
  answer: C
  explanation: NH RSA 265:121 states that motorcycles are entitled to the full use
    of a lane and no motor vehicle shall be driven in such a manner as to deprive
    any motorcycle of the full use of a lane. Lane splitting is prohibited.
- id: 155
  category: sharing_the_road
  question: If you are walking on a New Hampshire roadway where there are no sidewalks,
    which side of the road should you walk on?
  choices:
    A: The right side, with the flow of traffic
    B: The left side, facing oncoming traffic
    C: The side with the widest shoulder
    D: Either side is acceptable as long as you wear bright clothing
  answer: B
  explanation: NH RSA 265:38 requires pedestrians, where sidewalks are not provided,
    to walk on the left side of the roadway or its shoulder facing traffic which may
    approach from the opposite direction.
- id: 156
  category: sharing_the_road
  question: 'A person riding a bicycle on a New Hampshire roadway has:'
  choices:
    A: No rights to the road and must stay on the sidewalk
    B: The same rights and duties as the driver of a motor vehicle
    C: The right-of-way over all motor vehicles at all times
    D: The duty to ride against the flow of traffic
  answer: B
  explanation: NH RSA 265:143 states that every person riding a bicycle upon a roadway
    shall be granted all of the rights and shall be subject to all of the duties applicable
    to the driver of a vehicle.
- id: 157
  category: sharing_the_road
  question: 'When following a large truck in New Hampshire, if you cannot see the
    truck driver''s side-view mirrors, you are:'
  choices:
    A: In the truck's 'No-Zone' (blind spot)
    B: In a safe drafting position
    C: Following at a legal and safe distance
    D: Ready to pass on the right
  answer: A
  explanation: Large trucks have significant blind spots called 'No-Zones.' If you
    cannot see the driver's face in their side-view mirror, the driver cannot see
    you, making it a dangerous position.
- id: 158
  category: sharing_the_road
  question: 'In New Hampshire, a driver must yield to any totally or partially blind
    pedestrian carrying a cane which is predominantly:'
  choices:
    A: Red
    B: Yellow
    C: White (or white tipped with red)
    D: Reflective silver
  answer: C
  explanation: NH RSA 265:39 requires drivers to take necessary precautions and yield
    to any pedestrian carrying a totally or partially white cane (or white tipped
    with red) or using a service animal.
- id: 159
  category: sharing_the_road
  question: 'When a school bus is stopped on a highway with separate roadways (divided
    by a physical median or barrier), a driver on the opposite roadway:'
  choices:
    A: Must still stop 25 feet away
    B: Must slow to 10 mph
    C: Does not need to stop
    D: Must stop only if there are more than 3 lanes
  answer: C
  explanation: NH RSA 265:60 states that the driver of a vehicle upon a divided highway
    with separate roadways need not stop upon meeting or passing a school bus which
    is on a different roadway.
- id: 160
  category: sharing_the_road
  question: In New Hampshire, what color flashing lights are used specifically by
    emergency vehicles like police cars to signal a driver to pull over?
  choices:
    A: Amber and White
    B: Blue and/or Red
    C: Green and Amber
    D: Purple and White
  answer: B
  explanation: NH RSA 266:78-a and 266:78-b specify that police vehicles use blue
    and/or red flashing lights, and fire/emergency vehicles use red flashing lights.
    Drivers must yield to these vehicles.
- id: 161
  category: sharing_the_road
  question: 'Under New Hampshire law, a bicyclist riding at night must be equipped
    with a lamp on the front that emits a white light visible from a distance of at
    least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: NH RSA 265:144 requires that every bicycle operated during darkness
    be equipped with a lamp on the front emitting a white light visible from a distance
    of at least 500 feet.
- id: 162
  category: sharing_the_road
  question: 'In New Hampshire, it is illegal to follow a fire truck or emergency vehicle
    responding to an alarm closer than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: NH RSA 265:100 prohibits following fire apparatus responding to an
    alarm closer than 500 feet or driving into or parking within the block where the
    fire apparatus has stopped in answer to a fire alarm.
- id: 163
  category: sharing_the_road
  question: Under New Hampshire law, which motorcycle riders are required to wear
    a safety helmet?
  choices:
    A: All riders regardless of age
    B: Only the operator, not the passenger
    C: Only riders under the age of 18
    D: Only riders with less than 2 years of experience
  answer: C
  explanation: NH RSA 265:122 states that no person less than 18 years of age may
    operate or ride upon a motorcycle unless he or she is wearing protective headgear.
- id: 164
  category: sharing_the_road
  question: 'In New Hampshire, ''lane splitting'' (operating a motorcycle between
    rows of stopped or moving vehicles in the same lane) is:'
  choices:
    A: Legal at speeds under 15 mph
    B: Legal only on highways
    C: Illegal
    D: Legal if the motorcycle has its hazard lights on
  answer: C
  explanation: NH RSA 265:121 explicitly prohibits motorcycles from being operated
    between lanes of traffic or between adjacent lines or rows of vehicles.
- id: 165
  category: sharing_the_road
  question: 'When a pedestrian is crossing the street guided by a dog or carrying
    a white cane (with or without a red tip), New Hampshire law requires you to:'
  choices:
    A: Honk to let them know you are there
    B: Take the right of way if you have a green light
    C: Yield the right of way and take necessary precautions to avoid injury
    D: Drive around them slowly
  answer: C
  explanation: NH RSA 265:41 requires drivers to yield the right of way to any blind
    pedestrian carrying a white cane or using a service animal, regardless of traffic
    signals.
- id: 166
  category: sharing_the_road
  question: 'Large trucks have ''No-Zones.'' These are areas where:'
  choices:
    A: Trucks are not allowed to drive
    B: The truck driver cannot see you in their mirrors
    C: Cars are not allowed to pass
    D: Parking is strictly prohibited
  answer: B
  explanation: No-Zones are the large blind spots around the front, back, and sides
    of a truck where the driver cannot see other vehicles. If you cannot see the truck
    driver's face in their side mirror, they cannot see you.
- id: 167
  category: sharing_the_road
  question: According to New Hampshire law, bicyclists riding on a roadway shall not
    ride more than how many abreast?
  choices:
    A: Single file only
    B: Two abreast
    C: Three abreast
    D: Four abreast
  answer: B
  explanation: NH RSA 265:144 states that persons riding bicycles upon a roadway shall
    not ride more than 2 abreast and shall not impede the normal and reasonable movement
    of traffic.
- id: 168
  category: sharing_the_road
  question: 'When a pedestrian is in a crosswalk on your half of the roadway in New
    Hampshire, you must:'
  choices:
    A: Slow down and proceed with caution
    B: Yield the right of way and stop if necessary
    C: Honk to warn the pedestrian to move faster
    D: Only stop if there is a 'Stop' sign
  answer: B
  explanation: NH RSA 265:35 requires the driver of a vehicle to yield the right of
    way, slowing down or stopping if need be to yield, to a pedestrian crossing the
    roadway within a crosswalk.
- id: 169
  category: sharing_the_road
  question: When traveling at 55 mph, a fully loaded tractor-trailer may take how
    much longer to stop than a passenger car?
  choices:
    A: The same distance
    B: Twice the distance
    C: Three times the distance
    D: Four times the distance
  answer: C
  explanation: Because of their weight and braking systems, large trucks take much
    longer to stop. At 55 mph, a truck can take over 400 feet to stop, which is roughly
    three times the distance of a car.
- id: 170
  category: sharing_the_road
  question: 'In New Hampshire, you do NOT have to stop for a school bus with flashing
    red lights if:'
  choices:
    A: You are traveling in the opposite direction on a roadway separated by a physical
      barrier or median
    B: There are at least three lanes of travel
    C: The bus is in a designated 'No Stop' zone
    D: You are traveling at least 15 mph over the speed limit
  answer: A
  explanation: NH RSA 265:60, IV states that the driver of a vehicle upon a divided
    highway with separate roadways need not stop upon meeting or passing a school
    bus which is on a different roadway.
- id: 171
  category: vehicle_information
  question: Under New Hampshire law, when must a privately owned motor vehicle be
    inspected?
  choices:
    A: Every two years during the owner's birth month
    B: Annually during the owner's birth month
    C: Every six months at a certified station
    D: Only when the vehicle is sold or transferred
  answer: B
  explanation: In New Hampshire, all registered vehicles must be inspected annually.
    For privately owned vehicles, this inspection must take place during the owner's
    month of birth.
- id: 172
  category: vehicle_information
  question: What is the minimum legal tire tread depth required for a vehicle to pass
    inspection in New Hampshire?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: New Hampshire law requires that tires have at least 2/32 of an inch
    of tread depth in all areas of the tire in contact with the road.
- id: 173
  category: vehicle_information
  question: In New Hampshire, the foot brake must be capable of stopping the vehicle
    within how many feet when traveling at 20 mph?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 45 feet
  answer: C
  explanation: According to the New Hampshire Driver's Manual, the foot brake must
    be able to stop the vehicle within 30 feet when the vehicle is going 20 mph.
- id: 174
  category: vehicle_information
  question: 'Every motor vehicle operated in New Hampshire must have a horn that can
    be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: New Hampshire safety regulations require that a vehicle's horn must
    be audible from a distance of no less than 200 feet.
- id: 175
  category: vehicle_information
  question: Regarding window tinting, New Hampshire law generally prohibits aftermarket
    tinting on which windows of a vehicle (unless a medical waiver is obtained)?
  choices:
    A: The rear window only
    B: The rear side windows only
    C: The windshield and the windows to the left and right of the driver
    D: All windows including the sunroof
  answer: C
  explanation: New Hampshire RSA 266:58-a prohibits aftermarket tinting on the windshield
    and the front side windows (to the left and right of the driver) unless the driver
    has a certified medical necessity.
- id: 176
  category: vehicle_information
  question: In New Hampshire, how often must a vehicle's registration be renewed?
  choices:
    A: Every year during the owner's birth month
    B: Every two years on the date of purchase
    C: Every year on January 1st
    D: Every five years
  answer: A
  explanation: Vehicle registrations in New Hampshire expire annually on the last
    day of the owner's birth month and must be renewed at that time.
- id: 177
  category: vehicle_information
  question: When towing a trailer in New Hampshire, what equipment is required to
    prevent the trailer from decoupling if the hitch fails?
  choices:
    A: A secondary locking pin only
    B: Safety chains or cables
    C: A weight-distribution hitch
    D: Electronic sway control
  answer: B
  explanation: New Hampshire law requires that any trailer being towed must be equipped
    with safety chains or cables to prevent the trailer from separating from the tow
    vehicle in the event of a hitch failure.
- id: 178
  category: vehicle_information
  question: 'New Hampshire law requires that every motor vehicle must be equipped
    with a muffler that is in good working order to prevent:'
  choices:
    A: Any visible smoke from the tailpipe
    B: Excessive or unusual noise
    C: The release of carbon dioxide
    D: Engine overheating
  answer: B
  explanation: RSA 266:54 requires every motor vehicle to have a muffler to prevent
    'excessive or unusual noise.' Cutouts or bypasses are illegal.
- id: 179
  category: vehicle_information
  question: 'A rearview mirror in a New Hampshire registered vehicle must be adjusted
    so that the driver can see the road to the rear for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: New Hampshire safety standards require that rearview mirrors provide
    a view of the highway to the rear for at least 200 feet.
- id: 180
  category: vehicle_information
  question: 'New Hampshire law requires that the rear license plate must be illuminated
    by a white light so that it is visible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 150 feet
  answer: B
  explanation: RSA 266:31 requires that the tail lamp or a separate lamp shall illuminate
    the rear license plate with a white light so it is visible from 50 feet to the
    rear.
- id: 181
  category: vehicle_information
  question: 'In New Hampshire, tail lamps must be red in color and visible from a
    distance of at least:'
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: New Hampshire RSA 266:31 requires that every motor vehicle have at
    least one tail lamp (two if manufactured after 1952) that emits a red light visible
    from a distance of 500 feet to the rear.
- id: 182
  category: vehicle_information
  question: 'For a vehicle to pass the New Hampshire safety inspection, the parking
    brake must be able to hold the vehicle on:'
  choices:
    A: Any hill
    B: A 10% grade
    C: A 20% grade
    D: A flat surface only
  answer: A
  explanation: The New Hampshire inspection rules state the parking brake must be
    adequate to hold the vehicle on any grade (hill) upon which it is operated.
- id: 183
  category: vehicle_information
  question: According to New Hampshire law, what is the minimum legal tread depth
    for tires?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/16 of an inch
  answer: B
  explanation: In New Hampshire, tires are considered unsafe if they are worn to a
    point where less than 2/32 of an inch of tread design remains.
- id: 184
  category: vehicle_information
  question: 'In New Hampshire, a vehicle''s horn must be loud enough to be heard from
    a distance of at least:'
  choices:
    A: 100 feet
    B: 150 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: According to the New Hampshire Driver's Manual, the horn must be audible
    from a distance of 200 feet.
- id: 185
  category: vehicle_information
  question: Between which dates are studded snow tires permitted to be used on New
    Hampshire roads?
  choices:
    A: November 1 through April 1
    B: November 15 through April 15
    C: December 1 through March 31
    D: October 15 through May 15
  answer: B
  explanation: In New Hampshire, studded tires are legally permitted for use between
    November 15 and April 15.
- id: 186
  category: vehicle_information
  question: In New Hampshire, if a load extends more than how many feet beyond the
    rear of a vehicle, a red flag or light must be attached to the end of the load?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Whenever a load extends 4 feet or more beyond the rear of the bed or
    body of a vehicle, a red flag (day) or red light (night) must be displayed.
- id: 187
  category: vehicle_information
  question: Which vehicles in New Hampshire are required to undergo an On-Board Diagnostics
    (OBD) emissions test during their annual inspection?
  choices:
    A: All vehicles regardless of age
    B: Vehicles that are 15 years old or newer
    C: Vehicles that are 20 years old or newer
    D: Only commercial vehicles
  answer: C
  explanation: New Hampshire requires an emissions test (OBD II) for most vehicles
    that are model year 20 years old or newer.
- id: 188
  category: vehicle_information
  question: 'According to New Hampshire equipment standards, the parking brake must
    be strong enough to hold the vehicle:'
  choices:
    A: On a 10% grade
    B: On any hill
    C: Only on flat surfaces
    D: When the engine is running
  answer: B
  explanation: New Hampshire law requires the parking brake to be adequate to hold
    the vehicle on any grade (hill) it is operated on.
- id: 189
  category: signs_and_signals
  question: In New Hampshire, what is the unposted speed limit in a rural residence
    district?
  choices:
    A: 30 mph
    B: 35 mph
    C: 40 mph
    D: 45 mph
  answer: B
  explanation: NH law sets the default speed limit in rural residence districts at
    35 mph when no other limit is posted.
- id: 190
  category: signs_and_signals
  question: When using hand signals in New Hampshire, how should a driver signal that
    they are slowing down or stopping?
  choices:
    A: Extend the left arm out and up
    B: Extend the left arm straight out
    C: Extend the left arm out and down
    D: Wave the left arm in a circular motion
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, the driver
    should extend their left arm out the window and point it downward.
- id: 191
  category: signs_and_signals
  question: In New Hampshire, what does a flashing yellow light at an intersection
    signify?
  choices:
    A: Stop and wait for the light to turn green
    B: The light is about to turn red
    C: Proceed with caution
    D: Yield to all traffic coming from the right only
  answer: C
  explanation: A flashing yellow light means you should proceed with caution and be
    prepared to stop if necessary, but you do not need to come to a full stop if the
    way is clear.
- id: 192
  category: signs_and_signals
  question: 'A pennant-shaped sign found on the left side of the road in New Hampshire
    indicates:'
  choices:
    A: A school zone
    B: A railroad crossing
    C: A no passing zone
    D: A one-way street
  answer: C
  explanation: The pennant-shaped sign is unique because it is placed on the left
    side of the road to mark the beginning of a no-passing zone.
- id: 193
  category: signs_and_signals
  question: In New Hampshire, what does a solid double yellow line in the center of
    the roadway mean?
  choices:
    A: Passing is allowed only during daylight hours
    B: Passing is allowed if the way is clear
    C: Passing is prohibited in both directions
    D: Passing is allowed only for motorcycles
  answer: C
  explanation: Solid double yellow lines indicate that passing is prohibited for traffic
    moving in both directions.
- id: 194
  category: signs_and_signals
  question: What is the meaning of a 'crossbuck' sign at a railroad crossing in New
    Hampshire?
  choices:
    A: It is a warning that a train is definitely coming
    B: It marks the location of the tracks and should be treated as a yield sign
    C: It means you must come to a complete stop regardless of a train
    D: It indicates a pedestrian-only crossing
  answer: B
  explanation: A crossbuck sign marks the location of the railroad tracks. Drivers
    must yield to any oncoming trains.
- id: 195
  category: signs_and_signals
  question: 'A flashing red light at an intersection in New Hampshire means:'
  choices:
    A: Slow down and proceed with caution
    B: The same as a stop sign
    C: Yield to all traffic from the left
    D: The signal is broken; ignore it
  answer: B
  explanation: A flashing red light requires a driver to come to a complete stop and
    proceed only when it is safe to do so, exactly like a stop sign.
- id: 196
  category: signs_and_signals
  question: 'When using hand signals to indicate a right turn in New Hampshire, the
    driver should:'
  choices:
    A: Extend the left arm straight out
    B: Extend the left arm out and up
    C: Extend the left arm out and down
    D: Extend the right arm straight out
  answer: B
  explanation: To signal a right turn, the driver should extend their left arm out
    the window and bend it upward at the elbow.
- id: 197
  category: signs_and_signals
  question: In New Hampshire, what do white lines painted across the pavement at an
    intersection represent?
  choices:
    A: Parking spaces
    B: Stop lines or crosswalks
    C: HOV lanes
    D: Bicycle-only zones
  answer: B
  explanation: White lines across the pavement indicate where a driver must stop for
    a stop sign or traffic signal, or they delineate a crosswalk for pedestrians.
- id: 198
  category: signs_and_signals
  question: What does a diamond-shaped orange sign signify in New Hampshire?
  choices:
    A: General warning
    B: School zone
    C: Work zone or construction
    D: Public recreation area
  answer: C
  explanation: Orange diamond-shaped signs are specifically used to warn drivers of
    construction or maintenance work zones.
- id: 199
  category: signs_and_signals
  question: In New Hampshire, what does a steady yellow arrow mean?
  choices:
    A: You have the right of way to turn
    B: The protected turning period is ending
    C: You must stop immediately
    D: Pedestrians are crossing
  answer: B
  explanation: A steady yellow arrow indicates that the 'protected' turning time is
    ending and the signal is about to change to red.
- id: 200
  category: signs_and_signals
  question: Which of the following describes a 'Yield' sign in New Hampshire?
  choices:
    A: Red and white octagon
    B: Yellow and black diamond
    C: Red and white downward-pointing triangle
    D: White and black rectangle
  answer: C
  explanation: A yield sign is an equilateral triangle with one point facing downward,
    colored red and white.
- id: 201
  category: signs_and_signals
  question: 'A solid yellow line on your side of the center line in New Hampshire
    indicates:'
  choices:
    A: You may pass if the road is clear
    B: You are in a one-way zone
    C: You are not allowed to pass
    D: You must reduce your speed by 10 mph
  answer: C
  explanation: In New Hampshire, a solid yellow line on your side of the road means
    that passing is prohibited.
- id: 202
  category: signs_and_signals
  question: Under New Hampshire law, when is a right turn on red permitted?
  choices:
    A: Only if there is a green arrow
    B: After a complete stop and yielding to traffic and pedestrians, unless a sign
      prohibits it
    C: At any time, as long as you do not cause an accident
    D: Only between the hours of 9:00 PM and 6:00 AM
  answer: B
  explanation: New Hampshire law allows a right turn on a red light after a full stop,
    provided there is no sign prohibiting it and the driver yields to pedestrians
    and other traffic.
- id: 203
  category: signs_and_signals
  question: In New Hampshire, what does a sign with a pentagon (five-sided) shape
    indicate?
  choices:
    A: A construction zone
    B: A railroad crossing
    C: A school zone or school crossing
    D: A yield requirement
  answer: C
  explanation: A five-sided (pentagon) sign is used exclusively to warn drivers that
    they are entering a school zone or approaching a school crossing.
- id: 204
  category: signs_and_signals
  question: What is the meaning of a flashing red traffic signal in New Hampshire?
  choices:
    A: The signal is broken; treat it as a four-way stop
    B: Slow down and proceed with caution
    C: Stop completely and proceed only when it is safe to do so
    D: Yield to oncoming traffic but do not stop
  answer: C
  explanation: A flashing red light means the same as a stop sign. You must come to
    a complete stop and proceed only when the way is clear.
- id: 205
  category: signs_and_signals
  question: 'When you see a ''Move Over'' sign or an emergency vehicle with flashing
    lights on a New Hampshire multi-lane highway, you must:'
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but move to the left lane
    C: Vacate the lane as soon as safe and possible, or slow down if a lane change
      is impossible
    D: Speed up to pass the emergency vehicle quickly
  answer: C
  explanation: New Hampshire's 'Move Over' law (RSA 265:37-a) requires drivers to
    vacate the lane next to a stationary emergency vehicle with flashing lights or
    to slow down and proceed with caution if changing lanes is unsafe.
- id: 206
  category: signs_and_signals
  question: In New Hampshire, what color are signs used to provide guidance and information
    about destinations or exits?
  choices:
    A: Blue
    B: Green
    C: Brown
    D: Yellow
  answer: B
  explanation: Green signs are used for directional guidance, showing destinations,
    distances, and exit information on New Hampshire roadways.
- id: 207
  category: signs_and_signals
  question: What does a round, yellow sign with a black 'X' and the letters 'RR' indicate
    in New Hampshire?
  choices:
    A: A sharp curve ahead
    B: A restricted roadway
    C: A railroad crossing ahead
    D: A road ends in a 'T' intersection
  answer: C
  explanation: The round yellow sign with a black 'X' and 'RR' is the advance warning
    sign for a railroad crossing.
- id: 208
  category: signs_and_signals
  question: 'When a New Hampshire traffic signal shows a steady red light and a steady
    green arrow, you may:'
  choices:
    A: Not move until the red light turns green
    B: Turn only in the direction of the arrow after yielding to pedestrians
    C: Go straight or turn in the direction of the arrow
    D: Turn in any direction after stopping
  answer: B
  explanation: A green arrow means you may proceed in the direction of the arrow,
    even if the main signal is red, provided you yield to pedestrians and other traffic
    already in the intersection.
- id: 209
  category: signs_and_signals
  question: In New Hampshire, what do white pavement markings (lines) indicate?
  choices:
    A: Traffic moving in opposite directions
    B: The edge of the road only
    C: Traffic moving in the same direction
    D: A no-parking zone
  answer: C
  explanation: White lines are used to separate lanes of traffic moving in the same
    direction and to mark the right edge of the roadway.
- id: 210
  category: signs_and_signals
  question: According to New Hampshire law, what is the hand signal for a right turn?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at the elbow.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 211
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 212
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 213
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 214
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 215
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 216
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 217
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 218
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 219
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 220
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 221
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 222
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 223
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 224
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 225
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 226
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 227
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 228
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 229
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 230
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 231
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 232
- image: divided_highway.png
