metadata:
  source: 2025 Utah Driver's Manual
  total_questions: 253
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Utah, what is the minimum age an individual must reach to be eligible
    to apply for a learner permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: B
  explanation: According to the Utah Driver Handbook, an individual must be at least
    15 years old to apply for a learner permit.
- id: 2
  category: license_system
  question: If you are under 18 years of age, how long must you hold a Utah learner
    permit before you can apply for a driver license?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 1 year
  answer: B
  explanation: Utah law requires applicants under the age of 18 to hold a learner
    permit for at least six months before they can apply for a driver license.
- id: 3
  category: license_system
  question: To obtain a Utah driver license, an applicant under 18 must complete how
    many hours of supervised driving, including night driving?
  choices:
    A: 30 hours total, 5 at night
    B: 40 hours total, 10 at night
    C: 50 hours total, 10 at night
    D: 60 hours total, 15 at night
  answer: B
  explanation: Applicants under 18 must complete 40 hours of driving, with at least
    10 of those hours being at night.
- id: 4
  category: license_system
  question: Under Utah's GDL laws, a driver under 18 may not drive between what hours,
    unless accompanied by a licensed adult or for specific exceptions like work or
    school?
  choices:
    A: 10:00 PM and 4:00 AM
    B: 11:00 PM and 5:00 AM
    C: 12:00 AM (Midnight) and 5:00 AM
    D: 1:00 AM and 6:00 AM
  answer: C
  explanation: Utah law restricts drivers under 18 from operating a motor vehicle
    between midnight and 5:00 AM, with certain exceptions such as employment or emergencies.
- id: 5
  category: license_system
  question: For the first ______ months after receiving a Utah driver license, a driver
    under 18 may not transport any passenger who is not an immediate family member.
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Utah's Graduated Driver License (GDL) law prohibits drivers under 18
    from carrying non-family passengers for the first six months of holding a license.
- id: 6
  category: license_system
  question: In Utah, if you are under 21 years of age, your driver license may be
    suspended if you accumulate how many points within a three-year period?
  choices:
    A: 50 points
    B: 70 points
    C: 100 points
    D: 200 points
  answer: B
  explanation: For drivers under 21, the Utah point system triggers a suspension at
    70 points. For drivers 21 and older, the threshold is 200 points.
- id: 7
  category: license_system
  question: How many days do you have to notify the Driver License Division of a change
    of address in Utah?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: Utah law requires that you notify the Driver License Division within
    10 days of changing your address.
- id: 8
  category: license_system
  question: A Utah driver license is typically valid for how many years before it
    must be renewed?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: As of current Utah regulations, a standard driver license is valid
    for 8 years.
- id: 9
  category: license_system
  question: What is the minimum blood alcohol concentration (BAC) for a driver under
    21 to have their license suspended under Utah's 'Not-a-Drop' law?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: Any measurable amount
  answer: D
  explanation: Utah's 'Not-a-Drop' law means that any person under 21 cannot have
    any measurable amount of alcohol in their system while operating a vehicle.
- id: 10
  category: license_system
  question: 'When driving with a learner permit in Utah, the supervising passenger
    must be at least 21 years old, a licensed driver, and:'
  choices:
    A: Sitting in the back seat
    B: Occupying the seat beside the driver
    C: A legal guardian only
    D: Licensed for at least 5 years
  answer: B
  explanation: The supervising driver for a permit holder must be at least 21, licensed,
    and occupying the seat next to the driver.
- id: 11
  category: license_system
  question: What are the minimum liability insurance requirements for property damage
    in a single accident in Utah?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: B
  explanation: Utah's minimum financial responsibility limits are $25,000 per person
    for bodily injury, $50,000 per accident for bodily injury, and $15,000 for property
    damage (25/50/15).
- id: 12
  category: license_system
  question: In Utah, if you are 19 years of age or older and have never been licensed,
    you must hold a learner permit for at least ______ before you can apply for a
    driver license.
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: Individuals 19 and older who have not previously held a license must
    hold a Utah learner permit for at least 90 days, unless they complete a driver
    education course.
- id: 13
  category: license_system
  question: Which of the following documents is NOT required to apply for a Utah driver
    license for the first time?
  choices:
    A: Proof of Social Security number
    B: Two proofs of Utah residency
    C: Proof of identity
    D: A high school diploma
  answer: D
  explanation: While identity, residency, and Social Security proof are required,
    a high school diploma is not a requirement for a Utah driver license.
- id: 14
  category: license_system
  question: 'If you are convicted of a ''failure to yield'' violation in Utah that
    results in bodily injury to another person, your license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Utah law mandates a 90-day license suspension for failure to yield
    if the violation causes bodily injury.
- id: 15
  category: license_system
  question: Under Utah's point system, how many points can be removed from your record
    if you complete an approved defensive driving course?
  choices:
    A: 25 points
    B: 50 points
    C: 75 points
    D: 100 points
  answer: B
  explanation: Utah allows drivers to remove 50 points from their driving record once
    every three years by completing an approved defensive driving course.
- id: 16
  category: license_system
  question: Under Utah law, how many points are removed from your driving record if
    you drive for one full year without being convicted of a moving traffic violation?
  choices:
    A: 25 points
    B: 50 points
    C: Half of the total points on your record
    D: All points are removed
  answer: C
  explanation: Utah law allows for the removal of one-half of the total points on
    a driving record if a driver completes one full year without a moving violation
    conviction.
- id: 17
  category: license_system
  question: In Utah, how many consecutive years of driving without a moving violation
    conviction will result in all points being removed from your driving record?
  choices:
    A: One year
    B: Two years
    C: Three years
    D: Five years
  answer: B
  explanation: If a driver completes two consecutive years without a moving violation
    conviction, all points are removed from their Utah driving record.
- id: 18
  category: license_system
  question: A person who moves to Utah and has a valid out-of-state license must obtain
    a Utah driver license within how many days of establishing residency?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: New residents in Utah are required to obtain a Utah driver license
    within 60 days of establishing residency.
- id: 19
  category: license_system
  question: When applying for a Utah driver license, the fee you pay entitles you
    to how many attempts to pass the written knowledge test within a six-month period?
  choices:
    A: One attempt
    B: Two attempts
    C: Three attempts
    D: Unlimited attempts
  answer: C
  explanation: The application fee for a Utah driver license covers three attempts
    to pass the written knowledge test within a six-month period.
- id: 20
  category: license_system
  question: To meet the minimum vision requirements for a Utah driver license, an
    applicant must have at least what visual acuity in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Utah requires applicants to have 20/40 vision or better in at least
    one eye to qualify for a driver license without specific restrictions.
- id: 21
  category: license_system
  question: If you change your name legally, you must visit a Utah Driver License
    Division office to update your license within how many days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: Utah law requires drivers to notify the Driver License Division of
    a legal name change and obtain a duplicate license within 10 days.
- id: 22
  category: license_system
  question: 'A Utah Class D driver license allows you to operate a passenger vehicle
    with a Gross Vehicle Weight Rating (GVWR) of up to:'
  choices:
    A: 10,000 lbs
    B: 16,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: A standard Class D license in Utah allows the operation of vehicles
    with a GVWR of 26,000 lbs or less, provided the vehicle is not a bus or carrying
    hazardous materials.
- id: 23
  category: license_system
  question: For Utah residents serving in the United States Armed Forces, their driver
    license remains valid for how long after being discharged from high-priority duty?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Utah driver licenses held by military personnel remain valid until
    90 days after their discharge from the service, regardless of the expiration date
    on the card.
- id: 24
  category: license_system
  question: In Utah, a driver's license will be suspended for three months if they
    are convicted of a second 'reckless driving' offense within what time frame?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: A second conviction for reckless driving within a 12-month period results
    in a mandatory three-month suspension of the Utah driver license.
- id: 25
  category: license_system
  question: 'Utah is a member of the Driver License Compact. This means that:'
  choices:
    A: Utah drivers can drive in any state without a license
    B: Traffic violations committed by Utah drivers in other member states are reported
      to Utah
    C: Utah drivers do not have to pay fines in other states
    D: Your Utah license is only valid in neighboring states
  answer: B
  explanation: The Driver License Compact is an agreement among states to share information
    regarding traffic convictions and license suspensions of non-residents with their
    home state.
- id: 26
  category: license_system
  question: 'In Utah, indicating ''Yes'' for organ donation on your driver license
    application serves as:'
  choices:
    A: A suggestion for your family
    B: A temporary authorization that must be renewed every year
    C: Legal authority for organ and tissue donation upon death
    D: A requirement to pay a higher license fee
  answer: C
  explanation: Under Utah's Uniform Anatomical Gift Act, the designation on the driver
    license is a legally binding document of gift for organ and tissue donation.
- id: 27
  category: license_system
  question: What is the minimum age required to apply for a Utah Commercial Driver
    License (CDL) to operate a vehicle in interstate commerce (across state lines)?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: While a person can obtain a CDL for intrastate (within Utah) driving
    at 18, federal law requires a driver to be at least 21 years old to drive a commercial
    vehicle across state lines.
- id: 28
  category: license_system
  question: Which of the following non-driving related actions can result in the suspension
    of a Utah driver license?
  choices:
    A: Failure to pay property taxes
    B: Failure to pay court-ordered child support
    C: Failure to register for the draft
    D: Failure to maintain a high school GPA of 2.0
  answer: B
  explanation: Utah law allows for the suspension of a driver license for non-driving
    reasons, including the failure to comply with court-ordered child support payments.
- id: 29
  category: license_system
  question: 'A Utah driver license that features a gold star in the top right corner
    indicates that the license:'
  choices:
    A: Belongs to a veteran
    B: Is a REAL ID-compliant document
    C: Is only for commercial use
    D: Was issued to a driver with a perfect record
  answer: B
  explanation: The gold star on a Utah driver license indicates it is a REAL ID-compliant
    document, which is required for boarding domestic flights and entering federal
    facilities.
- id: 30
  category: driver_testing
  question: What is the passing score required on the 50-question Utah written knowledge
    test?
  choices:
    A: 70% (35 correct)
    B: 75% (38 correct)
    C: 80% (40 correct)
    D: 90% (45 correct)
  answer: C
  explanation: The Utah written knowledge test consists of 50 questions, and an applicant
    must answer at least 40 correctly (80%) to pass.
- id: 31
  category: driver_testing
  question: In Utah, what is the legal blood alcohol concentration (BAC) limit for
    drivers 21 years of age or older?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: As of December 30, 2018, Utah has the strictest BAC limit in the nation
    at 0.05% for drivers 21 and older.
- id: 32
  category: driver_testing
  question: Under Utah's Implied Consent Law, what is the penalty for a first-time
    refusal to submit to a chemical test for alcohol or drugs if you are 21 or older?
  choices:
    A: 30-day license suspension
    B: 90-day license suspension
    C: 180-day license suspension
    D: 18-month license revocation
  answer: D
  explanation: If you refuse a chemical test in Utah, your license will be revoked
    for 18 months for a first offense (if 21 or older).
- id: 33
  category: driver_testing
  question: Which of the following will result in an automatic failure during the
    Utah road skills test?
  choices:
    A: Failing to use a turn signal once
    B: Driving 2 mph over the speed limit
    C: Performing an illegal maneuver or causing a collision
    D: Adjusting the mirrors while driving
  answer: C
  explanation: During the Utah road test, any action that results in a collision,
    requires the examiner to intervene, or constitutes an illegal maneuver results
    in an automatic failure.
- id: 34
  category: driver_testing
  question: In Utah, what is the fine for a first-time seat belt violation for an
    adult?
  choices:
    A: $25
    B: $45
    C: $75
    D: $100
  answer: B
  explanation: Utah law requires all occupants to wear seat belts. The fine for a
    seat belt violation is $45.
- id: 35
  category: driver_testing
  question: When approaching a school bus with its red lights flashing and stop arm
    extended on a road with a physical median or barrier, which drivers must stop?
  choices:
    A: Only drivers traveling in the same direction as the bus
    B: Only drivers traveling in the opposite direction of the bus
    C: Drivers in both directions
    D: No one is required to stop if there is a barrier
  answer: A
  explanation: In Utah, if there is a physical barrier or median, only traffic following
    the bus must stop. If there is no barrier (including turning lanes), traffic in
    both directions must stop.
- id: 36
  category: driver_testing
  question: 'Utah''s ''Move Over'' law requires drivers approaching stationary emergency
    vehicles with flashing lights to:'
  choices:
    A: Stop completely until signaled to pass
    B: Maintain speed but honk to alert the emergency workers
    C: Reduce speed and, if safe/possible, move into a lane not adjacent to the vehicle
    D: Speed up to pass the area as quickly as possible
  answer: C
  explanation: Utah law requires drivers to reduce speed and move over one lane if
    it is safe to do so when approaching stationary emergency or maintenance vehicles
    with flashing lights.
- id: 37
  category: driver_testing
  question: If you are convicted of street racing in Utah, your driver license will
    be suspended for how many days for a first offense?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: A first conviction for speed contest (street racing) in Utah results
    in a 60-day license suspension.
- id: 38
  category: driver_testing
  question: In Utah, what is the maximum fine for littering from a vehicle on a public
    highway?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Littering is illegal in Utah, and a conviction can result in a fine
    of up to $1,000.
- id: 39
  category: driver_testing
  question: According to Utah law, you must dim your high-beam headlights when you
    are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Utah law requires drivers to switch to low beams when an oncoming vehicle
    is within 500 feet.
- id: 40
  category: driver_testing
  question: In Utah, you must dim your high-beam headlights when following another
    vehicle within how many feet?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: When following another vehicle, Utah law requires you to dim your high
    beams when you are within 300 feet of the vehicle ahead.
- id: 41
  category: driver_testing
  question: If you are involved in a crash in Utah that results in injury, death,
    or total property damage of ______ or more, you must notify the police immediately.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: D
  explanation: Utah law requires immediate notification of law enforcement for any
    accident involving injury, death, or property damage estimated at $2,500 or more.
- id: 42
  category: driver_testing
  question: 'In Utah, motorcycle helmets are legally required for all operators and
    passengers under the age of:'
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: Utah law requires anyone under the age of 21 to wear a protective helmet
    while operating or riding on a motorcycle.
- id: 43
  category: driver_testing
  question: In Utah, what is the standard fee to reinstate a driver license that was
    suspended (non-alcohol related)?
  choices:
    A: $25
    B: $40
    C: $65
    D: $100
  answer: B
  explanation: The general reinstatement fee for a suspended license in Utah is $40.
    Alcohol-related reinstatements carry significantly higher fees.
- id: 44
  category: driver_testing
  question: If you fail the Utah road (skills) test, how long must you wait before
    you are eligible to retake it?
  choices:
    A: At least 24 hours
    B: At least 3 days
    C: At least one week
    D: At least 30 days
  answer: A
  explanation: If you fail the skills test in Utah, you must wait at least one day
    (24 hours) before you can attempt the test again.
- id: 45
  category: driver_testing
  question: When applying for a Utah driver license, how many proofs of Utah residency
    must you provide?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have a Social Security card
  answer: B
  explanation: Utah law requires applicants to provide two documents that show evidence
    of Utah residency.
- id: 46
  category: driver_testing
  question: A Utah driver license may be renewed up to ______ before it expires.
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: In Utah, you can renew your driver license up to six months prior to
    the expiration date.
- id: 47
  category: driver_testing
  question: If your Utah driver license has been expired for more than ______, you
    will be required to take the written and skills tests again.
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: If a license has been expired for more than six months, the Driver
    License Division requires the applicant to retake both the knowledge and skills
    tests.
- id: 48
  category: driver_testing
  question: 'To pass the Utah vision screening, your peripheral field of vision must
    be at least:'
  choices:
    A: 60 degrees
    B: 90 degrees
    C: 120 degrees
    D: 140 degrees
  answer: B
  explanation: Utah requires a peripheral field of vision of 90 degrees or better
    to qualify for a driver license.
- id: 49
  category: driver_testing
  question: 'If a parent or legal guardian who signed a minor''s Utah license application
    decides they no longer want to be responsible for the minor''s driving, they can:'
  choices:
    A: Only wait until the minor turns 18
    B: Request that the minor's license be cancelled
    C: Transfer the responsibility to a teacher
    D: Do nothing; the signature is permanent until age 21
  answer: B
  explanation: In Utah, the person who signed the application for a minor may file
    a verified written request to have the license cancelled, which relieves them
    of liability.
- id: 50
  category: driver_testing
  question: What is the fee for a duplicate Utah driver license if yours is lost or
    stolen?
  choices:
    A: $10
    B: $18
    C: $23
    D: $32
  answer: C
  explanation: The fee for a duplicate Utah driver license is $23.
- id: 51
  category: driver_testing
  question: In Utah, if you are required to file an SR-22 (Proof of Financial Responsibility),
    how long must you maintain this filing?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Utah generally requires individuals to maintain an SR-22 filing for
    three years following a suspension or conviction that requires proof of financial
    responsibility.
- id: 52
  category: driver_testing
  question: When applying for a license in Utah, you may choose to donate ______ to
    the Governor's Transplant Council for organ donation awareness.
  choices:
    A: $1
    B: $2
    C: $5
    D: $10
  answer: B
  explanation: The Utah driver license application allows you to voluntarily contribute
    $2 to the Governor's Transplant Council.
- id: 53
  category: driver_testing
  question: Which of the following is a requirement for the vehicle you provide for
    the Utah road test?
  choices:
    A: It must be a rental vehicle
    B: It must have a manual transmission
    C: It must be currently registered and insured
    D: It must be less than 10 years old
  answer: C
  explanation: The vehicle used for the Utah skills test must be properly registered,
    meet all safety standards, and be covered by the minimum required insurance.
- id: 54
  category: driver_responsibility
  question: 'In Utah, you must notify the police immediately if you are involved in
    an accident resulting in property damage to any one person''s property to an apparent
    extent of at least:'
  choices:
    A: $1,000
    B: $1,500
    C: $2,500
    D: $5,000
  answer: C
  explanation: According to Utah law, any accident resulting in injury, death, or
    total property damage to an apparent extent of $2,500 or more must be reported
    to the police immediately.
- id: 55
  category: driver_responsibility
  question: Utah's financial responsibility law requires every resident owner of a
    motor vehicle to maintain liability insurance. What is the minimum coverage required
    for bodily injury to or death of one person in any one accident?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $65,000
  answer: B
  explanation: Utah law requires a minimum of $25,000 for bodily injury to or death
    of one person in any one accident.
- id: 56
  category: driver_responsibility
  question: Utah is a 'no-fault' insurance state. What is the minimum required amount
    for Personal Injury Protection (PIP) coverage per person?
  choices:
    A: $1,000
    B: $3,000
    C: $5,000
    D: $10,000
  answer: B
  explanation: Utah law requires all motor vehicle insurance policies to include a
    minimum of $3,000 in Personal Injury Protection (PIP) coverage.
- id: 57
  category: driver_responsibility
  question: Under the Utah point system, how many points are assessed against your
    driving record for a conviction of 'Reckless Driving'?
  choices:
    A: 50 points
    B: 60 points
    C: 80 points
    D: 100 points
  answer: C
  explanation: Reckless Driving is a serious offense in Utah and results in 80 points
    being added to your driving record.
- id: 58
  category: driver_responsibility
  question: If you are convicted of speeding 21 miles per hour (or more) over the
    posted speed limit in Utah, how many points will be added to your driving record?
  choices:
    A: 35 points
    B: 55 points
    C: 75 points
    D: 100 points
  answer: C
  explanation: Speeding 21 mph or more over the limit results in 75 points. (1-10
    mph over is 35 points; 11-20 mph over is 55 points).
- id: 59
  category: driver_responsibility
  question: How many points are assessed on a Utah driving record for a conviction
    of 'Following too closely' (tailgating)?
  choices:
    A: 35 points
    B: 50 points
    C: 60 points
    D: 75 points
  answer: C
  explanation: Following too closely is considered a moving violation in Utah and
    carries a penalty of 60 points.
- id: 60
  category: driver_responsibility
  question: In Utah, if you are convicted of driving without proof of insurance, your
    driving privilege may be suspended and you will be required to maintain an SR-22
    certificate for how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers convicted of driving without insurance must typically provide
    proof of financial responsibility (SR-22) for 3 years.
- id: 61
  category: driver_responsibility
  question: Which of the following Utah counties requires an emissions test for vehicle
    registration?
  choices:
    A: Washington County
    B: Iron County
    C: Salt Lake County
    D: San Juan County
  answer: C
  explanation: Emissions tests are required for vehicle registration in Salt Lake,
    Davis, Utah, Weber, and Cache counties.
- id: 62
  category: driver_responsibility
  question: In Utah, if you are convicted of a 'Failure to Stop for a School Bus'
    violation, how many points are added to your record?
  choices:
    A: 50 points
    B: 60 points
    C: 80 points
    D: 95 points
  answer: D
  explanation: Passing or failing to stop for a school bus is a serious safety violation
    in Utah and carries a penalty of 95 points.
- id: 63
  category: driver_responsibility
  question: 'If you are involved in an accident with an unattended vehicle and cannot
    find the owner, Utah law requires you to:'
  choices:
    A: Wait for at least two hours for the owner to return
    B: Leave a note with your name, address, and vehicle registration number
    C: Drive to the nearest police station within 24 hours
    D: Only report it if the damage appears to be over $2,500
  answer: B
  explanation: Utah law requires you to either locate the owner or leave a written
    notice in a conspicuous place on the unattended vehicle providing your name, address,
    and registration number.
- id: 64
  category: driver_responsibility
  question: What is the point value for a 'Wrong Side of Road' or 'Wrong Way on One-Way
    Street' conviction in Utah?
  choices:
    A: 35 points
    B: 50 points
    C: 60 points
    D: 80 points
  answer: C
  explanation: Driving on the wrong side of the road or the wrong way on a one-way
    street results in 60 points on your Utah driving record.
- id: 65
  category: driver_responsibility
  question: In Utah, if you are under 21 and receive a citation for 'Speeding Contest'
    (racing), how many points are assessed?
  choices:
    A: 50 points
    B: 70 points
    C: 80 points
    D: 100 points
  answer: D
  explanation: A Speeding Contest (racing) conviction results in 100 points, which
    would trigger an automatic suspension for a driver under 21 (who has a 70-point
    limit).
- id: 66
  category: driver_responsibility
  question: 'Under Utah law, ''Implied Consent'' means that by operating a motor vehicle,
    you have given consent to:'
  choices:
    A: A search of your vehicle at any time
    B: A chemical test to determine the presence of alcohol or drugs
    C: Allow passengers to ride without seatbelts
    D: Maintain only the minimum amount of insurance
  answer: B
  explanation: Utah's Implied Consent law means that any person operating a motor
    vehicle is considered to have given consent to a chemical test of breath, blood,
    urine, or oral fluids to determine alcohol or drug content.
- id: 67
  category: driver_responsibility
  question: What is the minimum required Utah liability insurance coverage for bodily
    injury to two or more persons in any one accident?
  choices:
    A: $40,000
    B: $50,000
    C: $65,000
    D: $80,000
  answer: C
  explanation: Utah law requires a minimum of $65,000 for bodily injury to or death
    of two or more persons in any one accident.
- id: 68
  category: driver_responsibility
  question: Utah is a 'no-fault' insurance state. This means your insurance company
    includes Personal Injury Protection (PIP) to cover medical expenses. What is the
    minimum PIP requirement per person?
  choices:
    A: $1,000
    B: $3,000
    C: $5,000
    D: $10,000
  answer: B
  explanation: Utah's no-fault law requires all policies to include a minimum of $3,000
    per person for Personal Injury Protection (PIP).
- id: 69
  category: driver_responsibility
  question: Under Utah's Implied Consent Law, if you are 21 or older and refuse to
    submit to a chemical test to determine your BAC, your driver license will be revoked
    for ______ for a first offense.
  choices:
    A: 90 days
    B: 120 days
    C: 18 months
    D: 36 months
  answer: C
  explanation: If you refuse a chemical test in Utah and are 21 or older, your license
    will be revoked for 18 months for a first offense.
- id: 70
  category: driver_responsibility
  question: New residents to Utah must register their vehicles within how many days
    of establishing residency?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 10 days
  answer: B
  explanation: While you must obtain a Utah driver license within 30 days, you have
    60 days to register your vehicle after establishing residency in Utah.
- id: 71
  category: driver_responsibility
  question: If your Utah driver license is suspended for a DUI, you will be required
    to maintain an SR-22 financial responsibility certificate for how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers who have had their license suspended or revoked for alcohol-related
    offenses are typically required to provide proof of financial responsibility (SR-22)
    for 3 years.
- id: 72
  category: driver_responsibility
  question: 'If a police officer does not investigate an accident involving injury,
    death, or $2,500+ damage, you must file a written report with the Driver License
    Division within:'
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: If an accident is not investigated by a law enforcement officer and
    meets the reporting criteria, a written report must be submitted to the Department
    of Public Safety within 10 days.
- id: 73
  category: driver_responsibility
  question: 'For a first DUI conviction in Utah for a driver 21 years of age or older,
    the court-ordered license suspension period is typically:'
  choices:
    A: 30 days
    B: 90 days
    C: 120 days
    D: 1 year
  answer: C
  explanation: A first-time DUI conviction for an adult (21+) in Utah results in a
    120-day license suspension.
- id: 74
  category: driver_responsibility
  question: 'A person convicted of a first-time DUI in Utah is classified as an ''Interlock
    Restricted Driver'' for a period of:'
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 3 years
  answer: C
  explanation: In Utah, a first DUI offense results in being an Interlock Restricted
    Driver for 18 months. Subsequent offenses can increase this to 3 years or more.
- id: 75
  category: driver_responsibility
  question: 'Providing false information or an altered government document when applying
    for a Utah driver license is a:'
  choices:
    A: Class C Misdemeanor
    B: Class B Misdemeanor
    C: Class A Misdemeanor
    D: 3rd Degree Felony
  answer: B
  explanation: Providing false information on a driver license application or using
    fraudulent documents is a Class B Misdemeanor and will result in license suspension
    or revocation.
- id: 76
  category: driver_responsibility
  question: 'If you are involved in an accident and do not have insurance, Utah law
    may require you to deposit a security (cash or bond) with the state to cover damages.
    Failure to do so will result in:'
  choices:
    A: A $500 fine only
    B: Suspension of your driver license
    C: Impoundment of your vehicle for 1 year
    D: Mandatory community service
  answer: B
  explanation: Under the Safety Responsibility Act, if you are uninsured and at fault
    in an accident, you must post security or your license will be suspended until
    the claims are settled.
- id: 77
  category: driver_responsibility
  question: How many months before your Utah driver license expires are you allowed
    to renew it?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 12 months
  answer: C
  explanation: Utah allows drivers to renew their license up to 6 months (180 days)
    prior to the expiration date.
- id: 78
  category: driver_responsibility
  question: 'When you sign your Utah driver license application, you are given the
    opportunity to join the ''Organ Donor'' registry. If you choose to be a donor,
    this decision is:'
  choices:
    A: A legal document that cannot be changed by your family
    B: Only a suggestion for your next of kin
    C: Valid for only 2 years
    D: Only applicable if you are over 21
  answer: A
  explanation: In Utah, indicating you are an organ donor on your license is a legally
    binding document under the Uniform Anatomical Gift Act, and your decision cannot
    be overridden by others after your death.
- id: 79
  category: safe_driving_rules
  question: In Utah, what is the maximum speed limit in a business or residential
    area unless otherwise posted?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: According to the Utah Driver Handbook, the default speed limit in any
    business or residential district is 25 mph unless signs indicate otherwise.
- id: 80
  category: safe_driving_rules
  question: When passing a school zone in Utah where lights are flashing or signs
    are present, what is the speed limit?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: In Utah, the speed limit in a school zone is 20 mph when lights are
    flashing or during the hours indicated on the sign.
- id: 81
  category: safe_driving_rules
  question: As of December 2018, what is the legal blood alcohol concentration (BAC)
    limit for adult drivers (21 and older) in Utah?
  choices:
    A: 0.08%
    B: 0.07%
    C: 0.05%
    D: 0.02%
  answer: C
  explanation: Utah has the strictest BAC limit in the United States; it is illegal
    to operate a motor vehicle with a BAC of 0.05% or higher.
- id: 82
  category: safe_driving_rules
  question: In Utah, you may not park your vehicle within how many feet of a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Utah law prohibits parking a vehicle within 15 feet of a fire hydrant.
- id: 83
  category: safe_driving_rules
  question: When parking near an intersection, you must be at least how many feet
    away from a stop sign, yield sign, or traffic control signal?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Under Utah law, you are not allowed to park within 30 feet of a stop
    sign, yield sign, or traffic control signal located at the side of the roadway.
- id: 84
  category: safe_driving_rules
  question: In Utah, it is legal to make a left turn on a red light ONLY under which
    of the following conditions?
  choices:
    A: From a two-way street onto a one-way street
    B: From a one-way street onto a two-way street
    C: From a one-way street onto another one-way street
    D: At any intersection if there is no oncoming traffic
  answer: C
  explanation: Utah law allows a left turn on red only when turning from a one-way
    street onto another one-way street, after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 85
  category: safe_driving_rules
  question: You are prohibited from passing another vehicle in Utah when you are within
    how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Utah law states that you may not pass another vehicle when approaching
    within 100 feet of an intersection or a railroad crossing.
- id: 86
  category: safe_driving_rules
  question: When passing a bicyclist in Utah, what is the minimum amount of space
    you must allow between your vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Utah law requires motorists to provide at least 3 feet of space when
    passing a person operating a bicycle.
- id: 87
  category: safe_driving_rules
  question: 'When a school bus is stopped with its red lights flashing and stop arm
    extended, drivers traveling in the opposite direction on a highway with a physical
    median or barrier must:'
  choices:
    A: Stop until the lights stop flashing
    B: Slow down to 20 mph and proceed with caution
    C: Proceed without stopping
    D: Stop only if there are children crossing the barrier
  answer: C
  explanation: In Utah, if a highway is divided by a physical barrier or median, traffic
    traveling in the opposite direction of a school bus is not required to stop.
- id: 88
  category: safe_driving_rules
  question: What is the penalty for speeding in a Utah highway construction or maintenance
    zone when workers are present?
  choices:
    A: A flat fine of $500
    B: A mandatory 30-day license suspension
    C: Fines are doubled
    D: There is no additional penalty beyond a standard ticket
  answer: C
  explanation: Under Utah law, fines for speeding in a designated construction zone
    are doubled if workers are present.
- id: 89
  category: safe_driving_rules
  question: When two vehicles arrive at an uncontrolled intersection (no signs or
    signals) at the same time, which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver on the larger road
  answer: B
  explanation: At an uncontrolled intersection in Utah, the driver of the vehicle
    on the left must yield the right-of-way to the vehicle on the right.
- id: 90
  category: safe_driving_rules
  question: In Utah, you are not allowed to park within how many feet of a crosswalk
    at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Utah law prohibits parking within 20 feet of a crosswalk at an intersection.
- id: 91
  category: safe_driving_rules
  question: According to the Utah Driver Handbook, you should signal your intention
    to turn for at least how long before beginning the turn?
  choices:
    A: 1 second
    B: 2 seconds
    C: 5 seconds
    D: 10 seconds
  answer: B
  explanation: Utah law requires that you signal for at least two seconds before making
    a turn or changing lanes.
- id: 92
  category: safe_driving_rules
  question: Under Utah law, you must signal your intention to turn or change lanes
    for at least how many seconds before beginning the maneuver?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: B
  explanation: Utah law requires drivers to signal for at least two seconds before
    turning or changing lanes to give other drivers adequate warning.
- id: 93
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a stop sign, yield sign,
    or traffic control signal in Utah?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Utah law prohibits parking within 30 feet of any flashing beacon, stop
    sign, yield sign, or traffic control signal located at the side of a roadway.
- id: 94
  category: safe_driving_rules
  question: 'On a Utah highway with three or more lanes in one direction, the far-left
    lane is intended for:'
  choices:
    A: High-speed cruising
    B: Passing and HOV use (if marked)
    C: Heavy trucks and trailers
    D: Slow-moving vehicles
  answer: B
  explanation: In Utah, the left lane is primarily for passing. Drivers should not
    stay in the left lane if they are being overtaken by faster traffic, as per the
    'Keep Right' law.
- id: 95
  category: safe_driving_rules
  question: 'When parking a vehicle headed downhill on a two-way street with a curb,
    you should turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the left
  answer: A
  explanation: When parking downhill, you should turn your wheels toward the curb
    so that if the vehicle rolls, it will roll into the curb rather than into traffic.
- id: 96
  category: safe_driving_rules
  question: 'Utah law requires you to use your headlights from:'
  choices:
    A: Sunset to sunrise
    B: One hour after sunset to one hour before sunrise
    C: Half hour after sunset to half hour before sunrise
    D: 6:00 PM to 6:00 AM
  answer: C
  explanation: Headlights must be turned on from a half hour after sunset to a half
    hour before sunrise, or whenever visibility is less than 1,000 feet.
- id: 97
  category: defensive_driving
  question: According to the Utah Driver Handbook, what is the minimum recommended
    following distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 5 seconds
  answer: B
  explanation: The Utah Driver Handbook recommends a minimum following distance of
    two seconds under ideal weather and road conditions to allow enough time to react
    to hazards.
- id: 98
  category: defensive_driving
  question: To avoid a collision in Utah, how far ahead should you typically scan
    the road for potential hazards?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: Only the car immediately in front of you
  answer: B
  explanation: Defensive driving in Utah involves scanning the road 10 to 15 seconds
    ahead to identify and react to potential problems early.
- id: 99
  category: defensive_driving
  question: In Utah, at what speed can hydroplaning (tires losing contact with the
    road due to water) begin?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Only above 65 mph
    D: Only during heavy floods
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph in heavy rain. In
    a complete hydroplane, the tires may lose all contact with the road at 55 mph.
- id: 100
  category: defensive_driving
  question: When driving in heavy fog, dust, or smoke in Utah, which headlights should
    you use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights are required during the day
  answer: B
  explanation: Low beams should be used in fog, dust, or smoke. High beams reflect
    off the particles in the air, causing glare and making it harder to see.
- id: 101
  category: defensive_driving
  question: Under Utah's 'Move Over' law, what must a driver do when approaching a
    stationary emergency vehicle with flashing lights?
  choices:
    A: Maintain speed but honk to warn the officer
    B: Stop immediately in the lane of travel
    C: Reduce speed and, if safe/possible, move over one lane
    D: Speed up to pass the area quickly
  answer: C
  explanation: Utah's Move Over law requires drivers to reduce speed and move into
    a non-adjacent lane if it is safe to do so when approaching stationary emergency
    or maintenance vehicles.
- id: 102
  category: defensive_driving
  question: When approaching a railroad crossing in Utah, you must stop your vehicle
    within how many feet of the nearest rail?
  choices:
    A: 5 to 10 feet
    B: 10 to 25 feet
    C: 15 to 50 feet
    D: 50 to 100 feet
  answer: C
  explanation: Utah law requires drivers to stop between 15 and 50 feet from the nearest
    rail at a railroad crossing when warnings are active.
- id: 103
  category: defensive_driving
  question: In Utah, during winter driving, why are bridges and overpasses particularly
    dangerous?
  choices:
    A: They are usually narrower than the rest of the road
    B: They freeze before the rest of the road
    C: They are prone to high winds only
    D: Salt cannot be used on bridges
  answer: B
  explanation: Bridges and overpasses freeze before the rest of the roadway because
    cold air circulates both above and below the road surface.
- id: 104
  category: defensive_driving
  question: When entering a roundabout in Utah, whom must you yield the right-of-way
    to?
  choices:
    A: Traffic entering from the right
    B: Traffic already in the roundabout
    C: No one; you have the right of way when entering
    D: Only pedestrians on the opposite side
  answer: B
  explanation: In Utah, drivers entering a roundabout must yield to traffic already
    circulating in the intersection and to pedestrians in the crosswalk.
- id: 105
  category: defensive_driving
  question: If your vehicle starts to skid on a slippery Utah road, which direction
    should you turn the steering wheel?
  choices:
    A: In the opposite direction of the skid
    B: In the direction the rear of the vehicle is skidding
    C: Keep the wheels straight and brake hard
    D: Turn sharply toward the shoulder
  answer: B
  explanation: To recover from a skid, you should take your foot off the gas and turn
    the steering wheel in the direction the rear of the vehicle is sliding.
- id: 106
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, Utah defensive
    driving guidelines suggest you should look how far ahead of your vehicle?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 seconds
  answer: B
  explanation: The Utah Driver Handbook states that looking 10 to 15 seconds ahead
    allows you to see hazards early and provides enough time to react safely.
- id: 107
  category: defensive_driving
  question: 'In Utah, hydroplaning (where tires lose contact with the road on a film
    of water) can begin at speeds as low as:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: B
  explanation: According to the Utah Driver Handbook, hydroplaning can start at speeds
    as low as 35 mph in heavy rain.
- id: 108
  category: defensive_driving
  question: Utah law requires you to turn on your headlights from ______ after sunset
    until ______ before sunrise.
  choices:
    A: One hour; one hour
    B: 30 minutes; 30 minutes
    C: Sunset; sunrise
    D: 15 minutes; 15 minutes
  answer: B
  explanation: Utah Code 41-6a-1601 requires headlights to be turned on from a half
    hour (30 minutes) after sunset to a half hour before sunrise.
- id: 109
  category: defensive_driving
  question: When driving in fog, heavy rain, or snow in Utah, which headlight setting
    should you use to maintain the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: Low beams should be used in adverse weather like fog or snow because
    high beams reflect off the moisture in the air, causing glare and reducing visibility.
- id: 110
  category: defensive_driving
  question: If you are driving on a Utah highway and experience a tire blowout, what
    is the safest defensive driving action to take?
  choices:
    A: Brake hard immediately to stop the car
    B: Turn the steering wheel sharply toward the shoulder
    C: Hold the steering wheel tightly and take your foot off the gas pedal
    D: Shift the car into neutral immediately
  answer: C
  explanation: In the event of a blowout, the Utah Driver Handbook advises drivers
    to hold the steering wheel firmly, keep the car going straight, and gradually
    slow down by easing off the gas.
- id: 111
  category: defensive_driving
  question: What is 'over-driving your headlights' as defined by Utah safety standards?
  choices:
    A: Using high beams in the city
    B: Driving at a speed where your stopping distance is further than the distance
      you can see with your lights
    C: Driving with broken or dim headlights
    D: Leaving your headlights on during the day
  answer: B
  explanation: Over-driving your headlights means you are traveling too fast to stop
    within the distance illuminated by your headlights, which is a major cause of
    nighttime accidents.
- id: 112
  category: defensive_driving
  question: When scanning the road in Utah, how often should you check your rearview
    and side mirrors?
  choices:
    A: Every 2 to 5 seconds
    B: Every 10 to 15 seconds
    C: Every minute
    D: Only when changing lanes
  answer: A
  explanation: Defensive driving guidelines in Utah suggest checking your mirrors
    every 2 to 5 seconds to maintain awareness of the traffic surrounding your vehicle.
- id: 113
  category: defensive_driving
  question: If an oncoming vehicle at night fails to dim their high beams, where should
    a Utah driver look to avoid being temporarily blinded?
  choices:
    A: Directly at the oncoming headlights
    B: At the center line of the road
    C: Toward the right side of the road (the white line)
    D: Close your eyes briefly
  answer: C
  explanation: To avoid glare from oncoming high beams, you should look toward the
    right edge of your lane or the white 'fog line' until the vehicle passes.
- id: 114
  category: defensive_driving
  question: In Utah, why should you increase your following distance when behind a
    motorcycle?
  choices:
    A: Motorcycles always travel faster than cars
    B: Motorcycles can stop much more quickly than other vehicles
    C: Motorcycles have a larger blind spot
    D: It is required by law to stay 500 feet back
  answer: B
  explanation: Because motorcycles can stop more quickly than cars, a larger following
    distance is necessary to prevent a rear-end collision if the motorcyclist brakes
    suddenly.
- id: 115
  category: defensive_driving
  question: When approaching an intersection in Utah, what is the recommended scanning
    sequence?
  choices:
    A: Right, Left, Right
    B: Left, Right, Left
    C: Straight ahead only
    D: Check mirrors only
  answer: B
  explanation: Utah defensive driving standards recommend looking left, then right,
    then left again before entering an intersection, as vehicles from the left are
    closer to you.
- id: 116
  category: defensive_driving
  question: In Utah, which of the following road surfaces is likely to freeze first
    and remain icy longest during winter months?
  choices:
    A: Intersections
    B: Gravel roads
    C: Bridges and overpasses
    D: Tunnels
  answer: C
  explanation: Bridges and overpasses freeze before other road surfaces because cold
    air circulates both above and below the road deck, making them particularly dangerous
    in Utah winters.
- id: 117
  category: alcohol_drugs_health
  question: 'Under Utah''s ''Implied Consent'' law, by driving on Utah roads, you
    have given your consent to:'
  choices:
    A: A search of your vehicle at any time
    B: A field sobriety test only
    C: A chemical test of your breath, blood, urine, or oral fluids
    D: Allowing a police officer to drive your vehicle
  answer: C
  explanation: Implied Consent means that when you drive in Utah, you automatically
    agree to submit to chemical tests to determine the presence of alcohol or drugs
    if requested by an officer.
- id: 118
  category: alcohol_drugs_health
  question: Utah's 'Alcohol Restricted Driver' law mandates that a person convicted
    of a DUI will be restricted from operating a vehicle with any measurable amount
    of alcohol for how long after a first conviction?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: 10 years
  answer: B
  explanation: A person convicted of a DUI in Utah is classified as an Alcohol Restricted
    Driver for 2 years for a first offense, meaning they cannot drive with any alcohol
    in their system.
- id: 119
  category: alcohol_drugs_health
  question: Which of the following is true regarding Utah's 'Metabolite Law'?
  choices:
    A: It only applies to illegal drugs like heroin or cocaine
    B: It is illegal to drive with any measurable amount of a controlled substance
      or its metabolite in your body
    C: It only applies if the driver is visibly impaired
    D: It does not apply if the drug was taken more than 24 hours ago
  answer: B
  explanation: Utah law prohibits driving with any measurable controlled substance
    or metabolite in the body, unless the substance was taken pursuant to a valid
    prescription.
- id: 120
  category: alcohol_drugs_health
  question: 'If you are convicted of a DUI in Utah for the first time, you will be
    required to install an Ignition Interlock Device (IID) in your vehicle for:'
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: C
  explanation: In Utah, a first-time DUI conviction (for those 21 and older) generally
    requires the installation of an Ignition Interlock Device for 18 months.
- id: 121
  category: alcohol_drugs_health
  question: According to the Utah Driver Handbook, what is the first thing affected
    by alcohol consumption?
  choices:
    A: Coordination
    B: Vision
    C: Judgment
    D: Reaction time
  answer: C
  explanation: Judgment is the first faculty to be impaired by alcohol, often leading
    drivers to believe they are capable of driving safely when they are not.
- id: 122
  category: alcohol_drugs_health
  question: In Utah, it is illegal to possess an open container of alcohol in which
    of the following areas?
  choices:
    A: The trunk of the vehicle
    B: The passenger compartment of a motor vehicle on a public highway
    C: The living quarters of a motor home
    D: The locked glove box
  answer: B
  explanation: Utah's open container law prohibits open containers of alcohol in the
    passenger area of any motor vehicle located on a public highway.
- id: 123
  category: alcohol_drugs_health
  question: 'If you are 21 or older and convicted of a first-offense DUI in Utah,
    your license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: D
  explanation: For a driver 21 or older, a first DUI conviction results in a 120-day
    license suspension.
- id: 124
  category: alcohol_drugs_health
  question: What is the only effective way to lower your Blood Alcohol Concentration
    (BAC) and sober up?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Allowing time to pass
    D: Exercising vigorously
  answer: C
  explanation: Only time allows the body to metabolize alcohol. Coffee, showers, and
    exercise do not speed up the process of lowering BAC.
- id: 125
  category: alcohol_drugs_health
  question: 'If you use prescription drugs and then drink alcohol, the effects are
    often:'
  choices:
    A: Cancelled out by each other
    B: Reduced
    C: Multiplied (synergistic effect)
    D: Unchanged
  answer: C
  explanation: Combining alcohol with other drugs (even prescription ones) creates
    a synergistic effect, meaning the combined impact on your driving ability is much
    greater than the effects of each alone.
- id: 126
  category: alcohol_drugs_health
  question: Which of the following must you report to the Utah Driver License Division?
  choices:
    A: If you start wearing contacts or glasses
    B: If you develop a medical condition that may affect your ability to safely operate
      a vehicle
    C: If you are diagnosed with a common cold
    D: Both A and B
  answer: D
  explanation: Drivers are legally required to report any physical or mental condition
    (including vision changes) that might impair their ability to drive safely to
    the Driver License Division.
- id: 127
  category: alcohol_drugs_health
  question: 'In Utah, a person may be charged with a DUI if they are found to be in
    ''actual physical control'' of a vehicle while impaired. This means you can be
    arrested even if:'
  choices:
    A: The engine is not running
    B: You are sleeping in the driver's seat with the keys in your pocket
    C: The vehicle is parked on the side of the road
    D: All of the above
  answer: D
  explanation: Utah law allows for DUI charges if a person is in 'actual physical
    control' of the vehicle, which does not necessarily require the vehicle to be
    in motion or the engine to be on.
- id: 128
  category: alcohol_drugs_health
  question: 'If you are under 21 and are convicted of an alcohol-related offense that
    does NOT involve driving (such as illegal possession), Utah law allows the court
    to:'
  choices:
    A: Only issue a fine
    B: Suspend your driver license
    C: Require you to retake the driving test
    D: Do nothing to your driving privilege
  answer: B
  explanation: In Utah, even non-driving alcohol offenses for minors can result in
    the suspension of their driver license.
- id: 129
  category: alcohol_drugs_health
  question: If a driver over the age of 21 refuses to submit to a chemical test under
    the Implied Consent law, their license will be revoked for how long for a first
    offense?
  choices:
    A: 90 days
    B: 120 days
    C: 18 months
    D: 36 months
  answer: C
  explanation: In Utah, if you refuse a chemical test, your driving privilege will
    be revoked for 18 months for a first offense. For a second offense within 10 years,
    the revocation period is 36 months.
- id: 130
  category: alcohol_drugs_health
  question: Utah's 'Not-a-Drop' law applies to which group of drivers?
  choices:
    A: Drivers under the age of 21
    B: Commercial driver license (CDL) holders only
    C: Drivers with a history of DUI convictions only
    D: All drivers regardless of age
  answer: A
  explanation: Utah's 'Not-a-Drop' law (41-6a-517) prohibits anyone under the age
    of 21 from operating a vehicle with any measurable amount of alcohol in their
    system.
- id: 131
  category: alcohol_drugs_health
  question: Utah's 'Metabolite Law' makes it illegal to drive with ______ in your
    body, unless it was taken as prescribed by a doctor.
  choices:
    A: Any amount of caffeine
    B: Any measurable amount of a controlled substance or its metabolite
    C: Any amount of over-the-counter cold medicine
    D: Any amount of nicotine
  answer: B
  explanation: Utah Code 41-6a-517 (the Metabolite Law) makes it illegal to operate
    a vehicle with any measurable amount of a controlled substance or its metabolite
    in the person's body, unless the substance was legally prescribed.
- id: 132
  category: alcohol_drugs_health
  question: According to the Utah Driver Handbook, what is the best way to avoid a
    DUI?
  choices:
    A: Drink coffee before driving
    B: Take a cold shower before driving
    C: Wait one hour for every drink consumed
    D: Designate a sober driver or use a ride-share service
  answer: D
  explanation: The Utah Driver Handbook emphasizes that the only safe way to avoid
    a DUI is to not drive after drinking, suggesting designated drivers or ride-shares
    as the primary solution.
- id: 133
  category: alcohol_drugs_health
  question: If you are taking prescription medication and it impairs your ability
    to drive safely, you can be charged with a DUI in Utah.
  choices:
    A: True, regardless of whether the drug was legally prescribed
    B: False, as long as you have a valid prescription
    C: False, DUI only applies to alcohol and illegal drugs
    D: True, but only if you also have alcohol in your system
  answer: A
  explanation: In Utah, you can be convicted of DUI if you are under the influence
    of any drug (legal or illegal) to a degree that renders you incapable of safely
    operating a vehicle.
- id: 134
  category: alcohol_drugs_health
  question: In Utah, if you are convicted of a DUI while a passenger under the age
    of ______ is in the vehicle, the penalties are enhanced.
  choices:
    A: '12'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: Utah law provides for enhanced penalties for DUI convictions if there
    was a passenger under the age of 16 in the vehicle at the time of the offense.
- id: 135
  category: alcohol_drugs_health
  question: 'If you are under 21 and violate Utah''s ''Not-a-Drop'' law for the first
    time, your license will be suspended for:'
  choices:
    A: 30 days
    B: 6 months
    C: Until you turn 21 or for 1 year, whichever is longer
    D: Until you turn 21 or for 6 months, whichever is longer
  answer: D
  explanation: For a first violation of the 'Not-a-Drop' law by a minor, the license
    is suspended for 6 months or until the person turns 21, whichever is longer.
- id: 136
  category: alcohol_drugs_health
  question: What is the primary effect of mixing alcohol with other drugs (synergistic
    effect)?
  choices:
    A: The effects of the alcohol are canceled out
    B: The effects of both are multiplied, often becoming more dangerous
    C: The effects of the drug are delayed
    D: There is no change in the level of impairment
  answer: B
  explanation: Mixing alcohol with other drugs can create a synergistic effect, where
    the combined impact on the central nervous system is much greater than the sum
    of the parts, severely increasing impairment.
- id: 137
  category: alcohol_drugs_health
  question: 'Under Utah law, you must report any physical or mental condition that
    may impair your ability to drive safely to the:'
  choices:
    A: Local police department
    B: Utah Highway Patrol
    C: Driver License Division (DLD)
    D: Utah Department of Transportation (UDOT)
  answer: C
  explanation: Utah drivers are legally required to report to the Driver License Division
    any medical condition that may affect their ability to safely operate a motor
    vehicle.
- id: 138
  category: alcohol_drugs_health
  question: 'In Utah, a person is considered an ''Alcohol Restricted Driver'' for
    two years following a first DUI conviction. This means they:'
  choices:
    A: Can only drive to and from work
    B: Cannot drive with any measurable amount of alcohol in their system
    C: Cannot drive after 10:00 PM
    D: Must always have a sober passenger in the vehicle
  answer: B
  explanation: An 'Alcohol Restricted Driver' (ARD) in Utah is prohibited from operating
    a motor vehicle with any measurable amount of alcohol in their system, regardless
    of whether they are over 21.
- id: 139
  category: penalties_and_points
  question: What is the point value for a conviction of 'Following too closely' (tailgating)
    in the state of Utah?
  choices:
    A: 35 points
    B: 50 points
    C: 60 points
    D: 75 points
  answer: C
  explanation: Following too closely is a 60-point violation on the Utah point system.
- id: 140
  category: penalties_and_points
  question: 'For a first DUI conviction in Utah, a driver''s license will be suspended
    for a period of:'
  choices:
    A: 30 days
    B: 60 days
    C: 120 days
    D: 1 year
  answer: C
  explanation: For a first DUI conviction (age 21 and over), the license suspension
    period is typically 120 days.
- id: 141
  category: penalties_and_points
  question: In Utah, an 'Ignition Interlock Restricted Driver' is required to have
    an interlock device installed in their vehicle for a first DUI conviction for
    how long?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: C
  explanation: A first-time DUI offender in Utah is generally classified as an interlock
    restricted driver for 18 months.
- id: 142
  category: penalties_and_points
  question: How many points are assessed for running a red light or a stop sign in
    Utah?
  choices:
    A: 35 points
    B: 50 points
    C: 60 points
    D: 75 points
  answer: B
  explanation: Failure to stop for a red light or stop sign results in 50 points being
    added to your Utah driving record.
- id: 143
  category: penalties_and_points
  question: 'In Utah, if you are convicted of speeding in a highway construction zone
    when workers are present, the court is required to:'
  choices:
    A: Suspend your license for 30 days
    B: Double the standard fine
    C: Triple the standard fine
    D: Sentence you to 48 hours of community service
  answer: B
  explanation: Utah law mandates that fines for speeding in a construction zone are
    doubled if workers are present.
- id: 144
  category: penalties_and_points
  question: Under Utah law, which of the following will result in mandatory license
    revocation?
  choices:
    A: Speeding 25 mph over the limit
    B: Automobile homicide
    C: Two convictions of following too closely
    D: Failure to yield the right-of-way
  answer: B
  explanation: Automobile homicide is a serious felony that requires the mandatory
    revocation of the driver's license.
- id: 145
  category: penalties_and_points
  question: In Utah, how many points are assessed for a conviction of 'Improper Passing'?
  choices:
    A: 35 points
    B: 50 points
    C: 60 points
    D: 70 points
  answer: B
  explanation: Improper passing is a 50-point violation on the Utah point system.
- id: 146
  category: penalties_and_points
  question: If you are convicted of a 'Not-a-Drop' violation (under age 21 with any
    measurable alcohol), your license will be suspended for ______ for a first offense.
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Under Utah's 'Not-a-Drop' law, a first offense for a driver under 21
    results in a 6-month license suspension.
- id: 147
  category: penalties_and_points
  question: How many points are added to a Utah driving record for speeding 21 miles
    per hour (or more) over the posted limit?
  choices:
    A: 35 points
    B: 55 points
    C: 75 points
    D: 80 points
  answer: C
  explanation: Speeding 21 mph or more over the limit is a high-point violation in
    Utah, resulting in 75 points.
- id: 148
  category: penalties_and_points
  question: In Utah, failing to stop for a red light or a stop sign will result in
    how many points on your driving record?
  choices:
    A: 35 points
    B: 50 points
    C: 60 points
    D: 75 points
  answer: B
  explanation: Failing to stop for a red light or stop sign is a 50-point violation
    in Utah.
- id: 149
  category: penalties_and_points
  question: 'For a first DUI offense, a Utah driver 21 years of age or older is typically
    required to have an ignition interlock device installed for:'
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 3 years
  answer: C
  explanation: Utah law generally requires a first-time DUI offender (21+) to use
    an ignition interlock device for 18 months.
- id: 150
  category: penalties_and_points
  question: Your Utah driver license will be mandatorily revoked if you are convicted
    of how many reckless driving charges within a 12-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: A
  explanation: Utah law mandates a license revocation if a driver is convicted of
    two charges of reckless driving within one year.
- id: 151
  category: penalties_and_points
  question: Which of the following convictions will result in the mandatory revocation
    of your Utah driving privilege?
  choices:
    A: Failure to signal a turn
    B: Failure to stop and render aid when involved in an accident resulting in injury
      or death
    C: Speeding 15 mph over the limit
    D: Following too closely
  answer: B
  explanation: Failure to stop and render aid (hit and run) in an accident involving
    injury or death results in mandatory license revocation.
- id: 152
  category: penalties_and_points
  question: How many points are added to your Utah driving record for driving on the
    wrong side of the road (wrong way)?
  choices:
    A: 50 points
    B: 60 points
    C: 75 points
    D: 80 points
  answer: B
  explanation: Driving on the wrong side of the road is a 60-point violation in Utah.
- id: 153
  category: penalties_and_points
  question: What is the administrative fee to reinstate a Utah driver license that
    was suspended or revoked for an alcohol-related offense?
  choices:
    A: None
    B: ' $65'
    C: $150
    D: $285
  answer: D
  explanation: As of current Utah regulations, the fee to reinstate a license after
    an alcohol-related suspension is $285.
- id: 154
  category: penalties_and_points
  question: Utah law requires the mandatory revocation of a driver license for which
    of the following?
  choices:
    A: Any felony in which a motor vehicle is used
    B: Parking in a handicap zone without a permit
    C: Driving with a broken taillight
    D: Failing to wear a seatbelt
  answer: A
  explanation: The use of a motor vehicle in the commission of any felony leads to
    the mandatory revocation of the driver's license in Utah.
- id: 155
  category: sharing_the_road
  question: Under Utah law, what is the minimum distance a motorist must maintain
    when passing a bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Utah Code 41-6a-706.5 requires motorists to provide a minimum of three
    feet of space when passing a person operating a bicycle.
- id: 156
  category: sharing_the_road
  question: In Utah, 'lane filtering' by motorcyclists is legal only under which of
    the following conditions?
  choices:
    A: On any highway at any speed
    B: When the speed limit is 45 mph or less and vehicles are stopped
    C: Only during peak rush hour on I-15
    D: When the motorcyclist is traveling at least 30 mph
  answer: B
  explanation: Utah law allows lane filtering when the posted speed limit is 45 mph
    or less, the other vehicles are stopped, and the motorcycle is traveling at 15
    mph or less.
- id: 157
  category: sharing_the_road
  question: 'When approaching a stationary emergency vehicle with flashing lights
    on a Utah highway with at least two lanes traveling in the same direction, you
    must:'
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk to alert the officer
    C: Move to a lane that is not adjacent to the emergency vehicle, if safe
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: Utah's 'Move Over' law requires drivers to move into a lane not adjacent
    to the stationary emergency vehicle if it is safe to do so; otherwise, they must
    reduce speed and proceed with caution.
- id: 158
  category: sharing_the_road
  question: 'In Utah, you must yield to a pedestrian in a crosswalk when the pedestrian
    is:'
  choices:
    A: Only if they are in a school zone
    B: On the half of the roadway upon which your vehicle is traveling
    C: Only if they are using a white cane
    D: Only if they have a 'Walk' signal
  answer: B
  explanation: Utah law requires drivers to yield to pedestrians when the pedestrian
    is on the half of the roadway the vehicle is traveling on, or approaching so closely
    from the opposite half as to be in danger.
- id: 159
  category: sharing_the_road
  question: When driving near a large commercial truck, you should avoid the 'No-Zone.'
    What is the 'No-Zone'?
  choices:
    A: The area directly behind the truck's trailer where the driver cannot see you
    B: The area directly in front of the truck
    C: The areas on both sides of the truck where the driver's blind spots are located
    D: All of the above
  answer: D
  explanation: The 'No-Zone' refers to the large blind spots around the front, back,
    and sides of a truck where the driver cannot see other vehicles.
- id: 160
  category: sharing_the_road
  question: 'In Utah, if you are turning left and a bicyclist is entering the intersection
    from the opposite direction, you should:'
  choices:
    A: Yield to the bicyclist as you would for any other vehicle
    B: Turn quickly before the bicyclist reaches the intersection
    C: Honk to warn the bicyclist to stop
    D: Assume the bicyclist will stop for you
  answer: A
  explanation: Bicyclists have the same rights and responsibilities as motor vehicle
    operators. You must yield to an oncoming bicyclist when making a left turn.
- id: 161
  category: sharing_the_road
  question: When a school bus is stopped on a highway divided by a physical barrier
    or median, which vehicles are required to stop?
  choices:
    A: All vehicles in both directions
    B: Only vehicles traveling in the same direction as the bus
    C: Only vehicles in the opposite direction
    D: No vehicles are required to stop
  answer: B
  explanation: In Utah, if the highway is divided by a physical barrier or median,
    only traffic traveling in the same direction as the bus must stop.
- id: 162
  category: sharing_the_road
  question: Under Utah law, it is illegal to follow within ______ feet of any fire
    vehicle responding to an alarm.
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Utah law prohibits following a fire apparatus traveling in response
    to a fire alarm closer than 500 feet.
- id: 163
  category: sharing_the_road
  question: 'If you see a pedestrian using a white cane or a guide dog in Utah, you
    must:'
  choices:
    A: Honk to let them know you are there
    B: Stop and yield the right-of-way, even if the pedestrian is not in a crosswalk
    C: Drive around them slowly
    D: Only stop if they are at a controlled intersection
  answer: B
  explanation: Utah law requires drivers to take extra precautions and yield the right-of-way
    to blind or visually impaired pedestrians using a white cane or guide dog.
- id: 164
  category: sharing_the_road
  question: 'When a bicyclist is traveling at a speed less than the flow of traffic
    in Utah, they should generally ride:'
  choices:
    A: On the sidewalk only
    B: Against the flow of traffic
    C: As far to the right as practicable
    D: In the exact center of the lane
  answer: C
  explanation: Bicyclists are required to ride as far to the right as practicable,
    except when overtaking, preparing for a left turn, or avoiding hazards.
- id: 165
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may:'
  choices:
    A: Stay entirely in the right lane
    B: Need to swing wide into the left lane to clear the curb
    C: Always turn from the left lane
    D: Stop and wait for all traffic to clear both lanes
  answer: B
  explanation: Large trucks often need to swing wide to complete a right turn. Drivers
    should avoid 'squeezing' between the truck and the curb.
- id: 166
  category: sharing_the_road
  question: 'In Utah, motorcycles are permitted to use High Occupancy Vehicle (HOV)
    lanes:'
  choices:
    A: Only if they have two or more people on the bike
    B: Only during non-peak hours
    C: At all times, regardless of the number of passengers
    D: Never
  answer: C
  explanation: Under federal and Utah state law, motorcycles are allowed to use HOV
    lanes even with only a single rider.
- id: 167
  category: sharing_the_road
  question: Under Utah's 'Lane Filtering' law, a motorcyclist may move between lanes
    of stopped traffic only if the posted speed limit is ______ or less.
  choices:
    A: 35 mph
    B: 40 mph
    C: 45 mph
    D: 55 mph
  answer: C
  explanation: Utah law allows lane filtering by motorcycles only on roadways where
    the speed limit is 45 mph or less, the vehicles are stopped, and the motorcycle
    does not exceed 15 mph.
- id: 168
  category: sharing_the_road
  question: Large trucks have 'No-Zones' where the driver cannot see your vehicle.
    Where is the largest 'No-Zone' located on a tractor-trailer?
  choices:
    A: Directly in front of the cab
    B: The left side of the trailer
    C: The right side of the trailer
    D: Directly behind the trailer
  answer: C
  explanation: The right side of a large truck is the largest blind spot (No-Zone),
    extending across several lanes.
- id: 169
  category: sharing_the_road
  question: In Utah, how many points are assessed against your driving record for
    failing to stop for a school bus with its red lights flashing?
  choices:
    A: 35 points
    B: 50 points
    C: 60 points
    D: 100 points
  answer: C
  explanation: Passing a school bus with its red lights flashing is a serious violation
    in Utah and carries a 60-point penalty.
- id: 170
  category: sharing_the_road
  question: What is the minimum following distance you should maintain behind a motorcycle
    in Utah to ensure safety?
  choices:
    A: 1 second
    B: 2 seconds
    C: At least 4 seconds
    D: 10 feet
  answer: C
  explanation: The Utah Driver Handbook recommends a following distance of at least
    4 seconds behind motorcycles because they can stop much quicker than cars.
- id: 171
  category: sharing_the_road
  question: When an emergency vehicle is responding to a call with its siren and lights
    on, it is illegal to follow closer than ______ feet behind it.
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: In Utah, it is illegal to follow an emergency vehicle (like a fire
    truck) closer than 500 feet when it is responding to an alarm.
- id: 172
  category: sharing_the_road
  question: A slow-moving vehicle emblem is a reflective orange triangle that must
    be displayed on the rear of vehicles designed to travel at speeds of ______ or
    less.
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The slow-moving vehicle emblem is required for vehicles that travel
    at speeds of 25 mph or less, such as farm equipment or construction vehicles.
- id: 173
  category: sharing_the_road
  question: In Utah, when can a motorist legally turn right across a bicycle lane?
  choices:
    A: Never; you must turn from the vehicle lane
    B: Only after checking for bicyclists and yielding to any in the lane
    C: Only if there are no 'No Right Turn' signs
    D: Bicyclists must always yield to turning cars
  answer: B
  explanation: Motorists must check for and yield to bicyclists before crossing a
    bike lane to make a turn.
- id: 174
  category: sharing_the_road
  question: 'When a funeral procession is using flashing hazard lights and following
    an escort vehicle, other drivers in Utah should:'
  choices:
    A: Join the procession to get through traffic
    B: Pass the procession on the right
    C: Yield the right-of-way and not intersect the procession
    D: Honk to show respect
  answer: C
  explanation: Utah law grants right-of-way to funeral processions; other drivers
    should yield and not drive between vehicles in the procession.
- id: 175
  category: sharing_the_road
  question: 'If you are driving and an emergency vehicle with sirens and flashing
    lights approaches from behind, you should:'
  choices:
    A: Stop exactly where you are
    B: Pull over to the right edge of the road and stop
    C: Speed up to get out of the way
    D: Pull over to the left median and stop
  answer: B
  explanation: Utah law requires drivers to pull to the right-hand edge of the road
    and stop until the emergency vehicle has passed.
- id: 176
  category: vehicle_information
  question: 'In Utah, headlights must be turned on from a half-hour after sunset until
    a half-hour before sunrise and whenever visibility is less than:'
  choices:
    A: 500 feet
    B: 700 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: According to Utah law, headlights must be used between a half-hour
    after sunset and a half-hour before sunrise, and at any other time when conditions
    (rain, snow, fog, etc.) prevent you from seeing clearly for 1,000 feet.
- id: 177
  category: vehicle_information
  question: According to Utah window tint laws, the front side windows (to the left
    and right of the driver) must allow at least what percentage of light to pass
    through?
  choices:
    A: 25%
    B: 35%
    C: 43%
    D: 50%
  answer: C
  explanation: Utah law (41-6a-1635) specifies that the front side windows must have
    a light transmittance of no less than 43%.
- id: 178
  category: vehicle_information
  question: What is the minimum legal tire tread depth for passenger vehicles in Utah?
  choices:
    A: 1/32 inch
    B: 2/32 inch
    C: 4/32 inch
    D: 6/32 inch
  answer: B
  explanation: Tires are considered unsafe in Utah if they have less than 2/32 inch
    of tread depth in any two adjacent major grooves.
- id: 179
  category: vehicle_information
  question: 'In Utah, every motor vehicle must be equipped with a mirror mounted on
    the left side and at least one additional mirror located to reflect a view of
    the highway for at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: Utah law requires mirrors that provide a view of the highway for a
    distance of at least 200 feet to the rear of the vehicle.
- id: 180
  category: vehicle_information
  question: 'Under Utah law, a vehicle''s horn must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Every motor vehicle must be equipped with a horn in good working order
    capable of emitting sound audible under normal conditions from a distance of not
    less than 200 feet.
- id: 181
  category: vehicle_information
  question: Unless specifically exempted, how many license plates must be displayed
    on a vehicle registered in Utah?
  choices:
    A: One plate, displayed on the rear only
    B: One plate, displayed on the front only
    C: Two plates, one on the front and one on the rear
    D: Two plates, both on the rear bumper
  answer: C
  explanation: 'Utah law generally requires two license plates: one firmly attached
    to the front and one firmly attached to the rear of the vehicle.'
- id: 182
  category: vehicle_information
  question: In Utah, stop lamps (brake lights) must be visible from a distance of
    not less than ______ in normal sunlight.
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Utah equipment standards require that stop lamps be visible from at
    least 500 feet to the rear in normal sunlight.
- id: 183
  category: vehicle_information
  question: If a load extends ______ or more beyond the rear of the bed or body of
    a vehicle in Utah, a red flag (day) or red light (night) must be displayed at
    the end of the load.
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Utah law requires a red flag at least 12 inches square during the day,
    or a red light at night, if a load extends 4 feet or more beyond the rear of the
    vehicle.
- id: 184
  category: vehicle_information
  question: Utah law requires that turn signal lights be visible from a distance of
    not less than ______ feet to the front and rear in normal sunlight.
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Turn signal lamps must be visible from a distance of not less than
    100 feet in normal sunlight.
- id: 185
  category: vehicle_information
  question: Regarding vehicle exhaust systems in Utah, which of the following is illegal?
  choices:
    A: A muffler that reduces noise
    B: A tailpipe that extends to the rear of the vehicle
    C: A muffler cutout, bypass, or similar device
    D: An exhaust system that meets manufacturer specifications
  answer: C
  explanation: Utah law prohibits the use of a muffler cutout, bypass, or similar
    device on any motor vehicle operated on a highway.
- id: 186
  category: vehicle_information
  question: In Utah, if you are towing a trailer, the drawbar or other connection
    must be strong enough to pull all weight towed and must not exceed ______ feet
    in length between the vehicles.
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Utah law states that the drawbar or connection between two vehicles,
    one of which is towing the other, shall not exceed 15 feet.
- id: 187
  category: vehicle_information
  question: Which of the following is a requirement for windshields on vehicles in
    Utah?
  choices:
    A: They may be covered with a reflective film across the entire surface
    B: They must be equipped with a device for cleaning rain, snow, or other moisture
    C: They are not required if the driver wears goggles
    D: They can have cracks of any size as long as they are on the passenger side
  answer: B
  explanation: Utah law requires every motor vehicle with a windshield to be equipped
    with a windshield wiper system maintained in good working order to clear rain,
    snow, or moisture.
- id: 188
  category: vehicle_information
  question: According to the Utah Driver Handbook, when are you required to turn on
    your headlights?
  choices:
    A: From sunset to sunrise
    B: Between 30 minutes after sunset and 30 minutes before sunrise
    C: Between 1 hour after sunset and 1 hour before sunrise
    D: Only when visibility is less than 1,000 feet
  answer: B
  explanation: Utah law requires headlights to be turned on from a half hour after
    sunset to a half hour before sunrise, or whenever visibility is not sufficient
    to clearly see a person or a vehicle at a distance of 1,000 feet.
- id: 189
  category: vehicle_information
  question: Under Utah law, what is the minimum percentage of light that must be allowed
    to pass through the front side windows (the windows to the immediate left and
    right of the driver)?
  choices:
    A: 25%
    B: 35%
    C: 43%
    D: 70%
  answer: C
  explanation: Utah Code 41-6a-1635 states that the front side windows must allow
    at least 43% light transmittance.
- id: 190
  category: vehicle_information
  question: In Utah, your vehicle's foot brake must be capable of stopping the vehicle
    within how many feet when traveling at 20 mph on dry, level pavement?
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 50 feet
  answer: B
  explanation: Utah equipment standards require that the service brake (foot brake)
    must be able to stop the vehicle within 25 feet at a speed of 20 mph.
- id: 191
  category: vehicle_information
  question: How many rearview mirrors are required on a vehicle registered in Utah?
  choices:
    A: Only one on the driver's side
    B: Only one inside the vehicle
    C: At least two mirrors, one of which must be on the left side
    D: 'Three mirrors: left, right, and center'
  answer: C
  explanation: Utah law requires at least two mirrors. One must be on the left side,
    and the second can be either in the center (interior) or on the right side.
- id: 192
  category: vehicle_information
  question: 'In Utah, every motor vehicle must be equipped with a horn that can be
    heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Utah law requires a horn in good working order capable of emitting
    sound audible under normal conditions from a distance of not less than 200 feet.
- id: 193
  category: vehicle_information
  question: 'The rear license plate on a vehicle in Utah must be illuminated so that
    it is clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: Utah law requires a white light to illuminate the rear license plate
    so it is visible from at least 100 feet to the rear.
- id: 194
  category: vehicle_information
  question: 'Utah law requires tail lights to be red in color and visible from a distance
    of at least:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Tail lights on vehicles in Utah must be red and visible from a distance
    of 500 feet to the rear.
- id: 195
  category: vehicle_information
  question: 'According to Utah law, a vehicle''s parking brake must be able to hold
    the vehicle:'
  choices:
    A: Only on level ground
    B: On a 5% grade
    C: On any grade on which it is operated
    D: Only when the engine is running
  answer: C
  explanation: The parking brake must be adequate to hold the vehicle on any grade
    on which it is operated, under all conditions of loading, on a surface free from
    snow, ice, or loose material.
- id: 196
  category: signs_and_signals
  question: In Utah, what does a flashing yellow arrow at an intersection mean?
  choices:
    A: You have the right-of-way to turn left.
    B: You must stop and wait for a green arrow.
    C: Turns are allowed, but you must first yield to oncoming traffic and pedestrians.
    D: The light is about to turn red, and you should clear the intersection.
  answer: C
  explanation: According to the Utah Driver Handbook, a flashing yellow arrow means
    you may turn left after yielding to oncoming traffic and pedestrians. Oncoming
    traffic still has a green light.
- id: 197
  category: signs_and_signals
  question: When approaching a school zone in Utah where a 'School Speed Limit 20'
    sign is posted, when is the 20 mph limit in effect?
  choices:
    A: Only when children are visibly present on the sidewalk.
    B: During school hours only.
    C: When the beacons are flashing or when signs are placed in the roadway.
    D: At all times of the day and night.
  answer: C
  explanation: In Utah, school zone speed limits are in effect when indicated by flashing
    lights or when specific signs are placed in the roadway by school crossing guards.
- id: 198
  category: signs_and_signals
  question: What is the meaning of a double solid white line on a Utah roadway?
  choices:
    A: It separates traffic moving in opposite directions.
    B: It marks the edge of the roadway.
    C: It separates lanes of traffic going in the same direction, and crossing is
      prohibited.
    D: It indicates a lane that may be used for passing.
  answer: C
  explanation: A double solid white line indicates that lane changes are prohibited.
    This is commonly seen near Express Lane entrances and exits in Utah.
- id: 199
  category: signs_and_signals
  question: In Utah, what is the maximum distance you may travel in a shared center
    turn lane?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: There is no specific distance limit.
  answer: C
  explanation: Utah law specifies that a shared center turn lane may not be used for
    travel further than 500 feet. It is intended only for making left turns or for
    merging into traffic.
- id: 200
  category: signs_and_signals
  question: When you see a 'Slow Moving Vehicle' emblem (an orange triangle with a
    red border) on the rear of a vehicle, it means the vehicle is traveling at what
    speed?
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The 'Slow Moving Vehicle' emblem is required on vehicles designed to
    operate at speeds of 25 mph or less.
- id: 201
  category: signs_and_signals
  question: Under Utah law, when are you allowed to turn left on a red light?
  choices:
    A: Never; left turns on red are always illegal.
    B: Only when turning from a one-way street onto another one-way street.
    C: Any time there is no oncoming traffic.
    D: Only if a sign specifically permits it.
  answer: B
  explanation: In Utah, you may turn left on red only when turning from a one-way
    street onto another one-way street, after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 202
  category: signs_and_signals
  question: What does a flashing red light at an intersection mean in Utah?
  choices:
    A: Slow down and proceed with caution.
    B: The signal is broken; treat it as an uncontrolled intersection.
    C: Stop completely and proceed only when it is safe to do so, treating it like
      a stop sign.
    D: Wait for the light to turn green before proceeding.
  answer: C
  explanation: A flashing red light has the same meaning as a stop sign. You must
    come to a complete stop and yield the right-of-way before proceeding.
- id: 203
  category: signs_and_signals
  question: In Utah, what hand signal should a driver use to indicate they are slowing
    down or stopping?
  choices:
    A: Left arm extended straight out the window.
    B: Left arm extended upward.
    C: Left arm extended downward with palm facing the rear.
    D: Right arm waving back and forth.
  answer: C
  explanation: The standard hand signal for stopping or slowing down is the left arm
    extended downward with the palm facing toward the rear.
- id: 204
  category: signs_and_signals
  question: What do 'sharrows' (pavement markings showing a bicycle with two chevrons
    above it) indicate on Utah roads?
  choices:
    A: A dedicated bike lane where cars are prohibited.
    B: A lane that is shared by both motor vehicles and bicycles.
    C: A sidewalk area where bicycles are allowed.
    D: A crossing zone for bicycles only.
  answer: B
  explanation: Sharrows, or shared lane markings, indicate that the lane is too narrow
    for a bicycle and a vehicle to travel side-by-side safely, and motorists should
    expect to share the lane with cyclists.
- id: 205
  category: signs_and_signals
  question: According to Utah law, how far away must you stop from the nearest rail
    of a railroad crossing when a train is approaching?
  choices:
    A: Between 5 and 25 feet
    B: Between 10 and 30 feet
    C: Between 15 and 50 feet
    D: Exactly 20 feet
  answer: C
  explanation: Utah law requires drivers to stop within 15 to 50 feet from the nearest
    rail of a railroad crossing when signals are flashing or a train is approaching.
- id: 206
  category: signs_and_signals
  question: When entering a roundabout in Utah, which of the following is true regarding
    signaling?
  choices:
    A: You must signal left to enter the roundabout.
    B: You do not need to signal at any point in a roundabout.
    C: You should signal right when you are preparing to exit the roundabout.
    D: You must signal left until you reach your desired exit.
  answer: C
  explanation: Utah's Driver Handbook instructs drivers to use their right turn signal
    when they are about to exit a roundabout to let other drivers know their intentions.
- id: 207
  category: signs_and_signals
  question: A 'Wrong Way' or 'Do Not Enter' sign is typically what color and shape
    in Utah?
  choices:
    A: Yellow diamond
    B: White rectangle with black lettering
    C: Red and white square or rectangle
    D: Orange diamond
  answer: C
  explanation: Regulatory signs that prohibit certain movements, like 'Wrong Way'
    and 'Do Not Enter,' are red and white.
- id: 208
  category: signs_and_signals
  question: In Utah, what does a solid yellow line on your side of the center line
    mean?
  choices:
    A: You may pass if it is safe to do so.
    B: You are in a one-way zone.
    C: You are not allowed to pass.
    D: You must stop for a school bus.
  answer: C
  explanation: A solid yellow line on your side of the center line indicates a 'no-passing
    zone.' You may not cross the line to pass other vehicles.
- id: 209
  category: signs_and_signals
  question: What is the primary purpose of a 'gore area' on a Utah freeway, marked
    by white lines in a V-shape?
  choices:
    A: It is an emergency parking area.
    B: It is a lane for slow-moving vehicles.
    C: It is a neutral area between an acceleration lane and the through lanes where
      driving is prohibited.
    D: It is a dedicated lane for motorcycles.
  answer: C
  explanation: The gore area is the theoretical peak of the triangle between the main
    highway and an exit or entrance ramp. In Utah, it is illegal to drive across or
    park in the gore area.
- id: 210
  category: signs_and_signals
  question: What do double solid white lines painted on the pavement indicate in Utah,
    specifically regarding Express Lanes?
  choices:
    A: Lane changes are discouraged but allowed
    B: Crossing the lines is prohibited
    C: You may cross the lines to exit the HOV lane only
    D: The lane is for emergency vehicles only
  answer: B
  explanation: In Utah, double solid white lines indicate that lane changes are prohibited.
    This is strictly enforced in Express/HOV lanes; you may only enter or exit where
    the lines are broken.
- id: 211
  category: signs_and_signals
  question: Under Utah law, when must a driver stop for a pedestrian in a crosswalk
    on a multi-lane road?
  choices:
    A: Only if the pedestrian is directly in front of the car
    B: When the pedestrian is on the half of the roadway upon which the vehicle is
      traveling
    C: Only if there is a 'School Crossing' sign
    D: Only if the pedestrian makes eye contact
  answer: B
  explanation: Utah law requires drivers to stop for a pedestrian when the pedestrian
    is on the half of the roadway upon which the vehicle is traveling, or when the
    pedestrian is within one lane of the driver's half of the roadway.
- id: 212
  category: signs_and_signals
  question: If your vehicle's turn signals are not working, what is the correct hand
    signal to indicate you are stopping or slowing down?
  choices:
    A: Arm extended straight out the window
    B: Arm extended upward at a 90-degree angle
    C: Arm extended downward with palm facing the rear
    D: Waving the arm in a circular motion
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals in Utah, the
    driver should extend their left arm downward with the palm facing the rear.
- id: 213
  category: signs_and_signals
  question: When approaching a railroad crossing with flashing signals, Utah law requires
    you to stop your vehicle within ______ feet from the nearest rail.
  choices:
    A: 5 to 25 feet
    B: 10 to 30 feet
    C: 15 to 50 feet
    D: 20 to 60 feet
  answer: C
  explanation: Utah law (41-6a-1203) requires drivers to stop at least 15 feet but
    not more than 50 feet from the nearest rail of a railroad crossing when signals
    are active.
- id: 214
  category: signs_and_signals
  question: What is the rule for 'Ramp Meters' (traffic signals at freeway entrances)
    in Utah?
  choices:
    A: Two cars are allowed per green light
    B: Only one vehicle per green light is allowed per lane
    C: They are only active during snowstorms
    D: You do not have to stop if you are carpooling
  answer: B
  explanation: Utah ramp meters are designed to space out vehicles entering the freeway.
    Unless otherwise posted, only one vehicle may pass through each green light per
    lane.
- id: 215
  category: signs_and_signals
  question: 'A pavement marking with a solid yellow line next to a broken yellow line
    means:'
  choices:
    A: Passing is prohibited in both directions
    B: Passing is permitted for traffic next to the broken line
    C: Passing is permitted for traffic next to the solid line
    D: The road is a one-way street
  answer: B
  explanation: When a solid and broken yellow line are together, drivers next to the
    broken line may pass if it is safe to do so. Drivers next to the solid line are
    prohibited from passing.
- id: 216
  category: signs_and_signals
  question: Which pavement symbol identifies a lane reserved for High Occupancy Vehicles
    (HOV) in Utah?
  choices:
    A: A white square
    B: A white diamond
    C: A yellow circle
    D: A white triangle
  answer: B
  explanation: The diamond symbol on the pavement indicates a lane reserved for specific
    vehicles, such as carpools, buses, or clean-fuel vehicles (HOV/Express Lanes).
- id: 217
  category: signs_and_signals
  question: What is the correct hand signal for a right turn?
  choices:
    A: Left arm extended straight out
    B: Left arm extended downward
    C: Left arm extended upward
    D: Right arm extended straight out
  answer: C
  explanation: According to the Utah Driver Handbook, the hand signal for a right
    turn is the left arm extended upward at a 90-degree angle.
- id: 218
  category: signs_and_signals
  question: In Utah, how far are you allowed to drive in a shared center turn lane
    before making your turn?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: As far as necessary
  answer: C
  explanation: Utah law states that a shared center turn lane cannot be used for travel
    further than 500 feet. It is intended only for preparing for a left turn or for
    moving onto the highway from a driveway.
- id: 219
  category: signs_and_signals
  question: What does a steady yellow traffic light indicate?
  choices:
    A: You should speed up to clear the intersection
    B: The signal is turning red; stop if it is safe to do so
    C: You have the right-of-way to finish your turn
    D: Pedestrians have the right-of-way
  answer: B
  explanation: A steady yellow light means the red signal is about to appear. You
    should stop if you can do so safely. If you are already in the intersection, you
    should continue through cautiously.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 220
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 221
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 222
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 223
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 224
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 225
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 226
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 227
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 228
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 229
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 230
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 231
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 232
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 233
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 234
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 235
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
