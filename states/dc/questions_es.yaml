questions:
- id: 1
  category: license_system
  question: ¿Bajo el programa GRAD del Distrito de Columbia, cuál es la edad mínima
    para solicitar un permiso de aprendizaje?
  choices:
    A: 15 años
    B: 15 años y 6 meses
    C: 16 años
    D: 17 años
  answer: C
  explanation: En el Distrito de Columbia, un solicitante debe tener al menos 16 años
    para ser elegible para un permiso de aprendizaje bajo el Programa de Licencias
    Graduadas (GRAD).
- id: 2
  category: license_system
  question: ¿Un conductor con un permiso de aprendizaje de DC tiene restringido conducir
    durante cuál de los siguientes horarios nocturnos?
  choices:
    A: De 10:00 PM a 5:00 AM
    B: De 9:00 PM a 6:00 AM
    C: De 11:00 PM a 6:00 AM
    D: De medianoche a 6:00 AM
  answer: B
  explanation: Los titulares de un permiso de aprendizaje de DC tienen prohibido operar
    un vehículo motorizado entre las 9:00 PM y las 6:00 AM todos los días.
- id: 3
  category: license_system
  question: ¿Cuánto tiempo debe un conductor tener un permiso de aprendizaje de DC
    antes de ser elegible para solicitar una licencia provisional?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Bajo el programa GRAD, los titulares de permisos deben mantener un
    permiso de aprendizaje válido durante al menos 6 meses sin ninguna infracción
    que sume puntos antes de pasar a la etapa provisional.
- id: 4
  category: license_system
  question: Para el titular de una licencia provisional en DC, ¿cuáles son las horas
    de conducción restringidas los viernes y sábados por la noche?
  choices:
    A: De 9:00 PM a 6:00 AM
    B: De 11:00 PM a 6:00 AM
    C: De 12:00 AM (medianoche) a 6:00 AM
    D: De 1:00 AM a 5:00 AM
  answer: C
  explanation: Los titulares de licencias provisionales en DC no pueden conducir entre
    las 12:00 AM y las 6:00 AM los viernes y sábados por la noche (técnicamente los
    sábados y domingos por la mañana).
- id: 5
  category: license_system
  question: En el Distrito de Columbia, ¿su licencia de conducir será revocada si
    acumula cuántos puntos en su historial de conducción?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: El DMV de DC emitirá una Orden de Revocación si un conductor acumula
    12 o más puntos en su historial de conducción.
- id: 6
  category: license_system
  question: ¿En qué nivel de puntos se suspenderá (pero aún no se revocará) la licencia
    de un conductor en el Distrito de Columbia?
  choices:
    A: De 6 a 7 puntos
    B: De 8 a 9 puntos
    C: De 10 a 11 puntos
    D: 12 puntos
  answer: C
  explanation: En DC, acumular 10 u 11 puntos resulta en la suspensión de la licencia,
    mientras que 12 puntos resultan en una revocación obligatoria.
- id: 7
  category: license_system
  question: ¿Quién debe acompañar al titular de un permiso de aprendizaje de DC mientras
    opera un vehículo?
  choices:
    A: Cualquier persona de 18 años o más
    B: Un conductor con licencia de 21 años o más en el asiento delantero
    C: Un conductor con licencia de 25 años o más en el asiento trasero
    D: Un padre o tutor independientemente de su estado de licencia
  answer: B
  explanation: El titular de un permiso de aprendizaje debe estar acompañado por una
    persona que tenga al menos 21 años, posea una licencia de conducir completa válida
    y esté sentada junto al conductor en el asiento del pasajero delantero.
- id: 8
  category: license_system
  question: 'Bajo el programa GRAD, el titular de una licencia provisional no puede
    transportar a ningún pasajero excepto:'
  choices:
    A: Amigos menores de 18 años
    B: Hermanos y una persona de 21 años o más
    C: Hasta tres personas que no sean familiares
    D: Solo los padres del conductor
  answer: B
  explanation: Los titulares de licencias provisionales solo pueden transportar hermanos
    y no más de otro pasajero que tenga al menos 21 años y posea una licencia completa
    válida.
- id: 9
  category: license_system
  question: Para cumplir con los requisitos de visión del Distrito de Columbia para
    una licencia de conducir, ¿un solicitante debe tener al menos qué agudeza visual?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: El DMV de DC requiere que los solicitantes tengan al menos una visión
    de 20/40 en uno o ambos ojos (con o sin lentes correctivos).
- id: 10
  category: license_system
  question: Si cambia su dirección dentro del Distrito de Columbia, ¿debe notificar
    al DMV en un plazo de cuántos días?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: La ley de DC exige que los residentes notifiquen al DMV sobre un cambio
    de dirección dentro de los 30 días posteriores a la mudanza.
- id: 11
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un conductor con una
    licencia provisional pase a una licencia de conducir completa?
  choices:
    A: El conductor debe tener al menos 17 años de edad
    B: El conductor debe haber tenido la licencia provisional durante al menos 6 meses
    C: El conductor debe tener al menos 18 años de edad
    D: El conductor debe completar un segundo examen práctico de manejo
  answer: C
  explanation: En DC, un conductor debe tener al menos 18 años de edad y haber tenido
    una licencia provisional durante al menos 6 meses sin ninguna infracción que sume
    puntos para poder obtener una licencia completa.
- id: 12
  category: license_system
  question: En DC, ¿para qué grupo está estrictamente prohibido el uso de un teléfono
    móvil mientras conduce (incluso con un dispositivo de manos libres)?
  choices:
    A: Conductores mayores de 65 años
    B: Todos los conductores comerciales
    C: Titulares de permisos de aprendizaje y licencias provisionales
    D: Solo conductores con más de 6 puntos
  answer: C
  explanation: Bajo el programa GRAD, los conductores con un permiso de aprendizaje
    o una licencia provisional tienen prohibido el uso de cualquier teléfono móvil
    u otro dispositivo electrónico mientras conducen, incluyendo los dispositivos
    de manos libres.
- id: 13
  category: license_system
  question: Al solicitar una licencia de conducir de DC, ¿cuántos documentos debe
    presentar para demostrar la residencia en DC?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para obtener una licencia de conducir REAL ID de DC, debe presentar
    dos documentos que demuestren su residencia en el Distrito de Columbia.
- id: 14
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia de conducir completa
    (Full Driver's License) en el Distrito de Columbia?
  choices:
    A: 17 años de edad
    B: 18 años de edad
    C: 21 años de edad
    D: 16 años y 6 meses de edad
  answer: B
  explanation: La edad mínima para obtener una licencia de conducir completa en DC
    es de 18 años, siempre que el conductor haya completado los requisitos del programa
    GRAD.
- id: 15
  category: license_system
  question: Si un conductor de DC es condenado por 'conducción temeraria' (reckless
    driving), ¿cuántos puntos se asignan a su historial de conducción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: De acuerdo con el sistema de puntos del DMV de DC, la conducción temeraria
    es una infracción grave que resulta en la adición de 6 puntos al historial del
    conductor.
- id: 16
  category: license_system
  question: En el Distrito de Columbia, ¿cuáles son los requisitos mínimos de cobertura
    de seguro de responsabilidad civil para un vehículo motorizado registrado?
  choices:
    A: $10,000/$20,000/$5,000
    B: $20,000/$40,000/$10,000
    C: $25,000/$50,000/$10,000
    D: $50,000/$100,000/$25,000
  answer: C
  explanation: La ley de DC exige un seguro de responsabilidad civil mínimo de $25,000
    por lesiones/muerte de una persona, $50,000 por lesiones/muerte de más de una
    persona y $10,000 por daños a la propiedad.
- id: 17
  category: license_system
  question: Los nuevos residentes del Distrito de Columbia deben obtener una licencia
    de conducir de DC y registrar su vehículo dentro de ¿cuántos días después de mudarse
    al Distrito?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según el DMV de DC, los nuevos residentes tienen 30 días para convertir
    su licencia de conducir y el registro de su vehículo de otro estado al Distrito
    de Columbia.
- id: 18
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir estándar del Distrito
    de Columbia antes de que deba ser renovada?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Una licencia de conducir estándar de DC se emite normalmente por un
    período de 8 años.
- id: 19
  category: license_system
  question: Bajo el programa GRAD, ¿cuántas horas de conducción supervisada debe completar
    y certificar el titular de un permiso de aprendizaje antes de solicitar una licencia
    provisional?
  choices:
    A: 20 horas (5 de noche)
    B: 40 horas (10 de noche)
    C: 50 horas (15 de noche)
    D: 60 horas (20 de noche)
  answer: B
  explanation: DC exige que los titulares de permisos completen 40 horas de conducción
    supervisada, de las cuales al menos 10 deben ser de noche, certificadas por un
    conductor con licencia de 21 años o más.
- id: 20
  category: license_system
  question: En el Distrito de Columbia, ¿durante cuánto tiempo permanecen los puntos
    en su historial de conducción después de una condena de tráfico?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: B
  explanation: Los puntos asignados a un historial de conducción de DC permanecen
    durante un período de dos años a partir de la fecha de la condena.
- id: 21
  category: license_system
  question: ¿Cuántos puntos de "Conducción Segura" (Safe Driving) puede ganar un conductor
    de DC por cada año calendario que conduzca sin una infracción de tránsito?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: A
  explanation: El DMV de DC otorga un punto de "Conducción Segura" por cada año calendario
    de conducción sin una infracción de tránsito, hasta un máximo de cinco puntos.
- id: 22
  category: license_system
  question: 'La mayoría de los vehículos personales en el Distrito de Columbia deben
    someterse a una inspección de emisiones cada:'
  choices:
    A: Año
    B: 2 años
    C: 5 años
  answer: B
  explanation: En DC, generalmente se requiere que los vehículos personales pasen
    una inspección de emisiones cada dos años.
- id: 23
  category: license_system
  question: ¿Cuál de las siguientes coberturas de seguro es OBLIGATORIA para todos
    los vehículos registrados en el Distrito de Columbia?
  choices:
    A: Cobertura de colisión
    B: Cobertura a todo riesgo (Comprehensive)
    C: Cobertura de motorista sin seguro (Uninsured Motorist)
    D: Cobertura de remolque y mano de obra
  answer: C
  explanation: La ley de DC exige que todos los vehículos registrados cuenten con
    cobertura de responsabilidad civil (Liability) y de motorista sin seguro (Uninsured
    Motorist).
- id: 24
  category: license_system
  question: ¿Cuál es la sanción por una primera infracción al operar un vehículo en
    DC sin un seguro válido?
  choices:
    A: Una advertencia verbal
    B: Una multa de $150 a $1,000
    C: Sentencia obligatoria de 30 días de cárcel
    D: Pérdida permanente de los privilegios de conducir
  answer: B
  explanation: Operar un vehículo sin seguro en DC conlleva una multa que oscila entre
    $150 y $1,000 por la primera infracción.
- id: 25
  category: license_system
  question: Al solicitar una licencia REAL ID en DC, ¿cuál de los siguientes es un
    comprobante aceptable del número de Seguro Social?
  choices:
    A: Una fotocopia de una tarjeta de Seguro Social
    B: Un certificado de nacimiento
    C: Un formulario W-2 que muestre el SSN completo
    D: Un documento de póliza de seguro
  answer: C
  explanation: El DMV de DC requiere documentos originales para el comprobante del
    SSN, como una tarjeta de Seguro Social original, un formulario W-2 o un talón
    de pago que muestre el SSN completo.
- id: 26
  category: license_system
  question: ¿A qué edad dejan de aplicarse las restricciones de conducción nocturna
    del programa GRAD a un conductor de DC?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: Las restricciones del programa GRAD, incluidos los límites de conducción
    nocturna, se aplican a todos los conductores menores de 21 años.
- id: 27
  category: license_system
  question: 'En DC, el titular de una licencia provisional puede conducir durante
    las horas nocturnas restringidas ÚNICAMENTE si:'
  choices:
    A: Conduce hacia o desde una actividad escolar patrocinada
    B: Está acompañado por un padre o tutor
    C: Conduce hacia o desde su lugar de empleo
    D: Todas las anteriores
  answer: D
  explanation: Los titulares de licencias provisionales pueden conducir durante las
    horas restringidas si viajan hacia o desde el trabajo, una actividad escolar o
    si están acompañados por un conductor con licencia de 21 años o más.
- id: 28
  category: license_system
  question: Si pierde o le roban su licencia de conducir de DC, ¿cuál es la tarifa
    actual por un duplicado de la licencia?
  choices:
    A: $7
    B: $20
    C: $44
    D: $75
  answer: B
  explanation: El DMV de DC cobra una tarifa de $20 por un duplicado de la licencia
    de conducir.
- id: 29
  category: driver_testing
  question: En el Distrito de Columbia, ¿cuál es el límite legal de concentración
    de alcohol en sangre (BAC) para conductores de 21 años o más?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En DC, es ilegal que cualquier persona de 21 años o más opere un vehículo
    motorizado con un BAC de 0.08% o superior.
- id: 30
  category: driver_testing
  question: Según la ley de "Tolerancia Cero" (Zero Tolerance) de DC, ¿cuál es el
    límite de BAC para los conductores menores de 21 años?
  choices:
    A: 0.00% (Cualquier cantidad medible)
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: El Distrito de Columbia tiene una ley de Tolerancia Cero para menores;
    es ilegal que cualquier persona menor de 21 años conduzca con cualquier cantidad
    medible de alcohol en su sistema.
- id: 31
  category: driver_testing
  question: ¿A cuántos pies de un hidrante de incendios (toma de agua) debe evitar
    estacionar su vehículo en una calle de DC?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: Según las regulaciones de estacionamiento de DC, se prohíbe estacionar
    a menos de 10 pies de un hidrante de incendios.
- id: 32
  category: driver_testing
  question: En el Distrito de Columbia, ¿se prohíbe estacionar a menos de cuántos
    pies de una señal de alto (Stop) o de una señal de "Ceda el paso" (Yield)?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: D
  explanation: La ley de DC establece que no se puede estacionar a menos de 25 pies
    al aproximarse a cualquier señal de alto, señal intermitente o señal de ceda el
    paso ubicada al costado de la calzada.
- id: 33
  category: driver_testing
  question: Cuando un autobús escolar se detiene en la calzada con sus luces rojas
    intermitentes y el brazo de parada extendido, ¿qué exige la ley de DC?
  choices:
    A: Solo el tráfico que sigue al autobús debe detenerse
    B: El tráfico en ambas direcciones debe detenerse, a menos que esté separado por
      una mediana
    C: El tráfico en ambas direcciones debe detenerse, incluso si hay una mediana
    D: El tráfico puede pasar lentamente a 5 mph
  answer: B
  explanation: En DC, los automovilistas deben detenerse en ambas direcciones cuando
    un autobús escolar tiene las luces rojas intermitentes, a menos que el vehículo
    se encuentre en el lado opuesto de una carretera dividida por una mediana física.
- id: 34
  category: driver_testing
  question: Si un conductor de DC se niega a someterse a una prueba química de alcohol
    o drogas (Consentimiento Implícito), ¿cuál es el período obligatorio de revocación
    de la licencia de conducir por una primera infracción?
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito (Implied Consent) de DC, si
    usted se niega a realizarse una prueba química, su licencia será revocada por
    un período de 12 meses (1 año).
- id: 35
  category: driver_testing
  question: 'Al rebasar a un ciclista en el Distrito de Columbia, los automovilistas
    deben mantener una distancia mínima de seguridad de al menos:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de DC exige que los automovilistas dejen al menos 3 pies de
    espacio al adelantar o rebasar a una persona que circula en bicicleta.
- id: 36
  category: driver_testing
  question: En DC, ¿los niños menores de qué edad deben estar debidamente sujetos
    en un asiento de seguridad para niños o en un asiento elevado (booster seat)?
  choices:
    A: Menores de 5 años
    B: Menores de 6 años
    C: Menores de 8 años
    D: Menores de 10 años
  answer: C
  explanation: La ley de DC exige que cualquier niño menor de 8 años de edad esté
    debidamente sentado en un asiento de seguridad para bebés, convertible (para niños
    pequeños) o en un asiento elevado (booster seat) instalado.
- id: 37
  category: driver_testing
  question: ¿Cuál es la sanción por una infracción del uso del cinturón de seguridad
    en el Distrito de Columbia?
  choices:
    A: Multa de $25 y sin puntos
    B: Multa de $50 y 2 puntos
    C: Multa de $100 y 3 puntos
    D: Multa de $200 y suspensión de la licencia
  answer: B
  explanation: Una infracción de la ley del cinturón de seguridad en DC resulta en
    una multa de $50 y la asignación de 2 puntos en su historial de conducción.
- id: 38
  category: driver_testing
  question: Al realizar el examen de habilidades viales del DMV de DC, ¿qué debe tener
    el vehículo del solicitante?
  choices:
    A: Una transmisión manual
    B: Pedales de freno dobles
    C: Un freno de estacionamiento ubicado entre los asientos (consola central)
    D: Una cámara de retroceso
  answer: C
  explanation: Para el examen práctico de DC, el vehículo debe tener un freno de estacionamiento
    manual ubicado entre los asientos del conductor y del pasajero para que el examinador
    pueda alcanzarlo en caso de emergencia.
- id: 39
  category: driver_testing
  question: 'En el Distrito de Columbia, debe usar sus faros delanteros cuando la
    visibilidad se reduce a menos de:'
  choices:
    A: 200 pies
    B: 400 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de DC exige el uso de faros delanteros cuando no hay luz suficiente
    para ver claramente a personas o vehículos a una distancia de 500 pies.
- id: 40
  category: driver_testing
  question: ¿Cuántos puntos se asignan en un historial de conducción de DC por "No
    detenerse ante un autobús escolar"?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar con sus luces rojas activadas
    en el Distrito de Columbia resulta en la adición de 4 puntos a su historial de
    conducción.
- id: 41
  category: driver_testing
  question: En DC, ¿a cuántos pies de distancia de un vehículo que viene en sentido
    contrario debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Debe bajar las luces altas cuando un vehículo que viene en sentido
    contrario esté a menos de 500 pies para evitar cegar al otro conductor.
- id: 42
  category: driver_testing
  question: 'Si se ve involucrado en un accidente de tráfico en DC que resulte en
    daños a la propiedad de $250 o más, usted debe:'
  choices:
    A: Esperar 48 horas antes de informar
    B: Informar el accidente a la policía de inmediato
    C: Informar solo si alguien resulta herido
    D: Dejar una nota e irse
  answer: B
  explanation: En el Distrito de Columbia, cualquier accidente que involucre daños
    a la propiedad, independientemente del monto, o lesiones personales debe informarse
    al Departamento de Policía Metropolitana de inmediato.
- id: 43
  category: driver_testing
  question: ¿Cuál es el límite de velocidad predeterminado en las calles locales y
    callejones en el Distrito de Columbia, a menos que se indique lo contrario?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: A partir de 2020, el límite de velocidad predeterminado para las calles
    locales en el Distrito de Columbia es de 20 mph para mejorar la seguridad de peatones
    y ciclistas.
- id: 44
  category: driver_testing
  question: Si reprueba el examen de habilidades de conducción del DMV de DC, ¿cuánto
    tiempo debe esperar antes de ser elegible para realizar el examen nuevamente por
    primera vez?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 7 días
  answer: C
  explanation: Si reprueba el examen de habilidades de conducción en DC, debe esperar
    al menos 72 horas antes de ser elegible para volver a tomarlo.
- id: 45
  category: driver_testing
  question: ¿Cuál es el campo de visión mínimo requerido para aprobar el examen de
    la vista del DMV de DC sin restricciones?
  choices:
    A: 110 grados
    B: 120 grados
    C: 130 grados
    D: 140 grados
  answer: D
  explanation: Para aprobar el examen de la vista del DMV de DC, los solicitantes
    deben tener al menos 140 grados de campo de visión periférica continua.
- id: 46
  category: driver_testing
  question: Si reprueba el examen de conocimientos (escrito) del DMV de DC, ¿cuál
    es el período de espera obligatorio antes de poder volver a tomarlo?
  choices:
    A: 24 horas
    B: 3 días
    C: 7 días
    D: 10 días
  answer: B
  explanation: Si reprueba el examen de conocimientos del DMV de DC, debe esperar
    3 días antes de que se le permita realizar el examen nuevamente.
- id: 47
  category: driver_testing
  question: ¿Cuál es la multa máxima por una primera condena por DUI (conducir bajo
    la influencia) en el Distrito de Columbia?
  choices:
    A: Hasta $500
    B: Hasta $1,000
    C: Hasta $2,500
    D: Hasta $5,000
  answer: B
  explanation: Una primera condena por DUI (Driving Under the Influence) en DC puede
    resultar en una multa de hasta $1,000 y/o hasta 90 días de cárcel.
- id: 48
  category: driver_testing
  question: En DC, ¿a cuántos pies de la entrada de un callejón, entrada de vehículos
    o camino privado no se puede estacionar?
  choices:
    A: 2 pies
    B: 5 pies
    C: 10 pies
    D: 15 pies
  answer: B
  explanation: La ley de DC prohíbe estacionar a menos de 5 pies de cualquier callejón,
    entrada de vehículos o entrada a un camino privado.
- id: 49
  category: driver_testing
  question: ¿Cuántos puntos se asignan por 'abandonar la escena de un accidente donde
    ocurrieron daños a la propiedad' en DC?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: Abandonar la escena de un accidente que involucre daños a la propiedad
    resulta en 8 puntos en su historial de conducción de DC.
- id: 50
  category: driver_responsibility
  question: 'En el Distrito de Columbia, si se ve involucrado en un accidente de tráfico
    que solo resulte en daños a la propiedad, debe informar el accidente a la policía
    si se estima que el daño es de al menos:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Según el DMV de DC, cualquier accidente que involucre daños a la propiedad
    de $250 o más debe informarse al Departamento de Policía Metropolitana.
- id: 51
  category: driver_responsibility
  question: ¿Con qué frecuencia se requiere una inspección de emisiones para un vehículo
    personal estándar registrado en el Distrito de Columbia?
  choices:
    A: Cada año
    B: Cada 2 años
    C: Cada 4 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: La ley de DC exige que los vehículos personales se sometan a una inspección
    de emisiones cada dos años.
- id: 52
  category: driver_responsibility
  question: 'Un conductor de DC puede ser elegible para que se le eliminen 2 puntos
    de su historial de conducción al completar un curso aprobado de seguridad vial
    en línea una vez cada:'
  choices:
    A: 12 meses
    B: 24 meses
    C: 36 meses
    D: 5 años
  answer: B
  explanation: El DMV de DC permite que los conductores reciban una reducción de 2
    puntos por completar con éxito un curso aprobado de seguridad vial en línea una
    vez cada 24 meses.
- id: 53
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por arrojar basura desde un vehículo a las vías
    públicas del Distrito de Columbia?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Según la ley de DC, la multa por arrojar basura desde un vehículo puede
    ser de hasta $1,000.
- id: 54
  category: driver_responsibility
  question: En el Distrito de Columbia, ¿es ilegal estacionar su vehículo a menos
    de cuántos pies de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: Las regulaciones de estacionamiento de DC establecen que no se puede
    estacionar a menos de 10 pies de un hidrante de incendios.
- id: 55
  category: driver_responsibility
  question: A menos que se permita lo contrario, ¿no puede estacionar un vehículo
    a menos de cuántos pies de la intersección de dos calles cualesquiera en DC?
  choices:
    A: 10 pies
    B: 20 pies
    C: 30 pies
    D: 40 pies
  answer: D
  explanation: En el Distrito de Columbia, está prohibido estacionar a menos de 40
    pies de la intersección de dos calles cualesquiera.
- id: 56
  category: driver_responsibility
  question: En el Distrito de Columbia, ¿hasta qué edad deben los niños estar debidamente
    asegurados en un asiento de seguridad para niños (para bebés, niños pequeños o
    asiento elevado/booster)?
  choices:
    A: Menores de 5 años
    B: Menores de 6 años
    C: Menores de 8 años
    D: Menores de 10 años
  answer: C
  explanation: La ley de DC exige que todos los niños menores de 8 años estén debidamente
    sentados en un asiento de seguridad para niños instalado, ya sea para bebés, convertible
    (niños pequeños) o un asiento elevado (booster).
- id: 57
  category: driver_responsibility
  question: Si se sorprende a un pasajero de 16 años o más sin usar el cinturón de
    seguridad en un vehículo en DC, ¿quién es legalmente responsable de pagar la multa?
  choices:
    A: Solo el conductor
    B: Solo el pasajero
    C: Tanto el conductor como el pasajero
    D: El propietario del vehículo
  answer: B
  explanation: En DC, los pasajeros de 16 años o más son estrictamente responsables
    de sus propias infracciones por no usar el cinturón de seguridad y recibirán la
    citación.
- id: 58
  category: driver_responsibility
  question: Si cancela la póliza de seguro de su vehículo en el Distrito de Columbia,
    ¿qué debe hacer inmediatamente con las placas (matrículas) de su vehículo?
  choices:
    A: Conservarlas hasta que obtenga un nuevo seguro
    B: Destruirlas
    C: Devolverlas al DMV de DC
    D: Transferirlas a otro vehículo de su propiedad
  answer: C
  explanation: Si su seguro se cancela o vence, debe devolver inmediatamente las placas
    de su vehículo al DMV de DC para evitar multas por falta de seguro.
- id: 59
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan en un historial de conducción de DC por una
    condena por no cumplir con las restricciones de Vehículos de Alta Ocupación (HOV)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: Según el Sistema de Puntos del DMV de DC, el incumplimiento de las
    restricciones de HOV resulta en la adición de 3 puntos al historial del conductor.
- id: 60
  category: driver_responsibility
  question: Bajo el sistema de puntos del Distrito de Columbia, ¿cuántos puntos se
    asignan por una condena de 'Conducción Agresiva'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: A
  explanation: La conducción agresiva figura específicamente en el Sistema de Puntos
    del DMV de DC como una infracción de 2 puntos.
- id: 61
  category: driver_responsibility
  question: 'Bajo la ley de ''Tolerancia Cero'' de DC, se considera que un conductor
    menor de 21 años conduce bajo la influencia si su concentración de alcohol en
    sangre (BAC) es:'
  choices:
    A: 0.01% o más
    B: 0.02% o más
    C: 0.05% o más
    D: Cualquier cantidad medible
  answer: D
  explanation: DC tiene una política de Tolerancia Cero para conductores menores de
    21 años, lo que significa que es ilegal operar un vehículo con cualquier cantidad
    medible de alcohol en el sistema.
- id: 62
  category: driver_responsibility
  question: 'Si usted está involucrado en un accidente de vehículo motorizado en el
    Distrito de Columbia que resulta en daños a la propiedad, lesiones o muerte, la
    ley le exige:'
  choices:
    A: Esperar 24 horas antes de informarlo a la policía
    B: Detenerse inmediatamente y proporcionar su información a las otras partes involucradas
    C: Solo detenerse si el daño parece ser superior a $1,000
    D: Dejar una nota y conducir hasta la oficina del DMV más cercana
  answer: B
  explanation: En DC, la ley exige que cualquier conductor involucrado en un accidente
    que resulte en lesiones, muerte o daños a la propiedad se detenga inmediatamente
    y proporcione su nombre, dirección e información de registro del vehículo.
- id: 63
  category: driver_responsibility
  question: En el Distrito de Columbia, si la cobertura del seguro de su vehículo
    caduca, ¿cuánto cobrará el DMV como multa por los primeros 30 días de la caducidad?
  choices:
    A: $2 por día
    B: $5 por día
    C: $7 por día
    D: $10 por día
  answer: C
  explanation: El DMV de DC cobra una multa por caducidad del seguro de $7 por día
    durante los primeros 30 días, la cual aumenta a $15 por día a partir de entonces,
    hasta un límite máximo.
- id: 64
  category: driver_responsibility
  question: Cuando vende o se deshace de un vehículo registrado en DC, ¿qué debe hacer
    con las placas de matrícula para evitar multas por caducidad del seguro?
  choices:
    A: Guardarlas para su próximo vehículo
    B: Destruirlas y tirarlas a la basura
    C: Devolverlas al DMV de DC y obtener un recibo de cancelación
    D: Entregarlas al nuevo propietario del vehículo
  answer: C
  explanation: Para cancelar correctamente su registro y evitar multas por falta de
    seguro, debe devolver sus placas de matrícula de DC al DMV y recibir un recibo
    de devolución de placas.
- id: 65
  category: driver_responsibility
  question: 'Si usted está involucrado en un accidente en DC donde la policía no presenta
    un informe, se le requiere presentar un ''Informe Ciudadano'' (Citizen Report)
    ante el DMV si el daño a la propiedad es de al menos:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Según el Manual del Conductor de DC, si la policía no investiga un
    accidente, el conductor debe presentar un informe si hay daños a la propiedad
    de $250 o más.
- id: 66
  category: driver_responsibility
  question: ¿Cuántas placas de matrícula emite el Distrito de Columbia para vehículos
    de pasajeros estándar y dónde deben exhibirse?
  choices:
    A: Una placa, exhibida solo en la parte trasera
    B: Una placa, exhibida solo en la parte delantera
    C: Dos placas, una en la parte delantera y otra en la trasera
    D: Dos placas, ambas en el parachoques trasero
  answer: C
  explanation: 'El Distrito de Columbia exige que la mayoría de los vehículos motorizados
    exhiban dos placas de matrícula: una en la parte delantera y otra en la trasera.'
- id: 67
  category: driver_responsibility
  question: En el Distrito de Columbia, ¿dónde debe colocarse la calcomanía de inspección
    válida del vehículo?
  choices:
    A: En el parachoques trasero
    B: En la placa de matrícula trasera
    C: En la esquina inferior izquierda del parabrisas
    D: En la esquina inferior derecha del parabrisas
  answer: C
  explanation: La ley de DC exige que la calcomanía de inspección del vehículo se
    exhiba en la esquina inferior izquierda del parabrisas (desde la perspectiva del
    conductor).
- id: 68
  category: driver_responsibility
  question: Si usted es residente de DC y compra un vehículo a un propietario privado,
    puede obtener un registro temporal (placa física) que es válido por ¿cuántos días?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: C
  explanation: El DMV de DC emite registros temporales ('hard tags') por 45 días para
    permitir que los residentes tengan tiempo de completar el proceso completo de
    registro e inspección.
- id: 69
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un requisito para registrar un vehículo en
    el Distrito de Columbia?
  choices:
    A: El vehículo debe tener una inspección de seguridad cada año
    B: El propietario debe tener una licencia de conducir de DC o una tarjeta de identificación
      de DC válida
    C: El propietario debe demostrar que tiene un garaje para el vehículo
    D: El vehículo debe tener menos de 10 años de antigüedad
  answer: B
  explanation: Para registrar un vehículo en DC, el propietario debe proporcionar
    prueba de residencia en DC y tener una credencial válida emitida por el DMV de
    DC (licencia o identificación).
- id: 70
  category: driver_responsibility
  question: 'Si un conductor de DC está involucrado en un accidente con un vehículo
    desatendido y no se puede encontrar al propietario, el conductor debe:'
  choices:
    A: Esperar 2 horas a que regrese el propietario
    B: Dejar un aviso por escrito con su nombre, dirección e información en un lugar
      visible
    C: Irse si el daño es menor
    D: Solo informarlo si el otro vehículo es un auto del gobierno
  answer: B
  explanation: Si choca contra un vehículo desatendido en DC, debe dejar una nota
    con su información de contacto y detalles del seguro, y también debe informar
    el accidente a la policía.
- id: 71
  category: driver_responsibility
  question: 'Al solicitar el registro de un vehículo en DC, la póliza de seguro debe
    ser emitida por una compañía que esté:'
  choices:
    A: Con sede en cualquiera de los 50 estados de EE. UU.
    B: Autorizada para realizar negocios en el Distrito de Columbia
    C: Exclusivamente una compañía de seguros con sede en DC
    D: Un proveedor de seguros del gobierno federal
  answer: B
  explanation: La ley de DC exige que el seguro de su vehículo motorizado sea proporcionado
    por una compañía autorizada para vender seguros en el Distrito de Columbia.
- id: 72
  category: driver_responsibility
  question: En el Distrito de Columbia, ¿qué sucede con el registro de su vehículo
    si se cancela su seguro y usted no devuelve las placas (tags)?
  choices:
    A: El registro sigue siendo válido por 6 meses
    B: El registro se suspende automáticamente
    C: El registro se transfiere a la compañía de seguros
    D: No sucede nada hasta que intente renovar el registro
  answer: B
  explanation: Si se notifica al DMV de DC que el seguro ha sido cancelado y las placas
    no han sido devueltas, el registro del vehículo será suspendido.
- id: 73
  category: driver_responsibility
  question: ¿Cuál de los siguientes documentos debe llevarse en el vehículo en todo
    momento mientras se opera en el Distrito de Columbia?
  choices:
    A: El título del vehículo
    B: El certificado de nacimiento del propietario
    C: Una tarjeta de registro válida y comprobante de seguro
    D: El contrato de venta original
  answer: C
  explanation: La ley de DC exige que los conductores tengan una tarjeta de registro
    válida y un comprobante de seguro vigente en el vehículo siempre que esté en funcionamiento.
- id: 74
  category: safe_driving_rules
  question: Al estacionar su vehículo en DC, ¿cuál es la distancia mínima que debe
    mantener de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: De acuerdo con las regulaciones de estacionamiento de DC (DCMR Título
    18, Sección 2405), no se puede estacionar a menos de 10 pies de un hidrante de
    incendios.
- id: 75
  category: safe_driving_rules
  question: Al estacionar cerca de una intersección en DC, ¿a cuántos pies de distancia
    como mínimo debe estar del paso de peatones más cercano?
  choices:
    A: 10 pies
    B: 20 pies
    C: 30 pies
    D: 40 pies
  answer: B
  explanation: En el Distrito de Columbia, está prohibido estacionar a menos de 20
    pies de una intersección o de un paso de peatones en una intersección.
- id: 76
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en una zona escolar del Distrito
    de Columbia cuando hay niños presentes o cuando una luz de advertencia está parpadeando?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad en las zonas escolares de DC es de 15 mph durante
    las horas restringidas o cuando las señales/luces indican que el límite está en
    vigor.
- id: 77
  category: safe_driving_rules
  question: Según la ley de DC, ¿cuándo se le permite girar a la izquierda con luz
    roja?
  choices:
    A: Nunca
    B: Solo desde una calle de un solo sentido hacia otra calle de un solo sentido
    C: Solo desde una calle de doble sentido hacia una calle de un solo sentido
    D: En cualquier intersección si no viene tráfico
  answer: B
  explanation: En el Distrito de Columbia, se permite girar a la izquierda en rojo
    solo cuando se gira desde una calle de un solo sentido hacia otra calle de un
    solo sentido, después de detenerse por completo y ceder el paso al tráfico y a
    los peatones.
- id: 78
  category: safe_driving_rules
  question: En el Distrito de Columbia, ¿en cuál de los siguientes lugares están estrictamente
    prohibidos los giros en U?
  choices:
    A: En cualquier calle con más de dos carriles
    B: A menos de 500 pies de un puente
    C: En cualquier intersección donde haya un semáforo
    D: En cualquier calle durante las horas pico
  answer: C
  explanation: Las regulaciones de DC prohíben realizar un giro en U en cualquier
    intersección controlada por un semáforo o una señal de 'No U-Turn' (Prohibido
    girar en U).
- id: 79
  category: safe_driving_rules
  question: 'Al rebasar una bicicleta en el Distrito de Columbia, la ley exige que
    los automovilistas mantengan una distancia mínima de:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de DC exige que los automovilistas mantengan una distancia de
    seguridad de al menos 3 pies al alcanzar y rebasar a una persona que opera una
    bicicleta.
- id: 80
  category: safe_driving_rules
  question: Al conducir cerca de un tranvía (Streetcar) de DC, ¿cuál de las siguientes
    afirmaciones es verdadera?
  choices:
    A: Puede rebasar a un tranvía por la izquierda en cualquier momento
    B: Puede estacionar su vehículo sobre las vías del tranvía si permanece dentro
      del auto
    C: No debe rebasar a un tranvía por la izquierda
    D: Los tranvías siempre deben ceder el paso a los vehículos de pasajeros
  answer: C
  explanation: En DC, no debe rebasar a un tranvía por la izquierda. Además, es ilegal
    estacionar o detener un vehículo de manera que bloquee las vías del tranvía.
- id: 81
  category: safe_driving_rules
  question: En el Distrito de Columbia, ¿cuándo debe atenuar las luces altas de sus
    faros al acercarse a un vehículo en sentido contrario?
  choices:
    A: Dentro de 200 pies
    B: Dentro de 300 pies
    C: Dentro de 500 pies
    D: Dentro de 1,000 pies
  answer: C
  explanation: La ley de DC exige que los conductores atenúen sus luces altas cuando
    un vehículo que se aproxima está a menos de 500 pies de distancia.
- id: 82
  category: safe_driving_rules
  question: 'Si es condenado por exceso de velocidad en una zona de obras designada
    en el Distrito de Columbia, la multa se:'
  choices:
    A: Reduce a la mitad
    B: Mantiene igual que una multa normal por exceso de velocidad
    C: Duplica
    D: Triplica
  answer: C
  explanation: En DC, las multas por infracciones de movimiento, incluido el exceso
    de velocidad, se duplican cuando se cometen en una zona de construcción u obras.
- id: 83
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección no controlada
    en DC, ¿qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a una velocidad mayor
    D: El conductor que circula por la calle más grande
  answer: B
  explanation: En las intersecciones que no están controladas por señales o semáforos,
    el conductor del vehículo de la izquierda debe ceder el derecho de paso al vehículo
    de la derecha.
- id: 84
  category: safe_driving_rules
  question: En el Distrito de Columbia, ¿cuál es el límite de velocidad máximo en
    una zona escolar designada durante las horas restringidas?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad en las zonas escolares de DC es de 15 mph durante
    las horas indicadas en las señales publicadas o mientras las luces de advertencia
    de la zona escolar estén parpadeando.
- id: 85
  category: safe_driving_rules
  question: Al estacionar en paralelo en el Distrito de Columbia, ¿a cuántas pulgadas
    del bordillo (acera) deben estar sus neumáticos?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: La ley de DC exige que cuando se estacione en una calle de doble sentido,
    debe estacionar en paralelo y a no más de 12 pulgadas del bordillo.
- id: 86
  category: safe_driving_rules
  question: Bajo la ley de "Tolerancia Cero" del Distrito de Columbia, ¿cuál es la
    concentración máxima de alcohol en sangre (BAC) permitida para un conductor menor
    de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: El Distrito de Columbia tiene una política de Tolerancia Cero para
    menores; cualquier cantidad medible de alcohol (0.00% de BAC) en el sistema de
    un conductor menor de 21 años es motivo para un DUI (conducir bajo la influencia).
- id: 87
  category: safe_driving_rules
  question: Si es condenado por exceso de velocidad de 11 a 15 mph sobre el límite
    de velocidad establecido en DC, ¿cuántos puntos se asignarán a su historial de
    conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: En el sistema de puntos del Distrito de Columbia, exceder el límite
    de velocidad por 11-15 mph resulta en la adición de 3 puntos a su historial de
    conducción.
- id: 88
  category: safe_driving_rules
  question: 'En el Distrito de Columbia, se permite girar a la derecha con luz roja
    EXCEPTO:'
  choices:
    A: Cuando hay una señal que lo prohíbe
    B: Entre las 7:00 AM y las 6:30 PM
    C: Si hay peatones en el cruce peatonal lejano
    D: Los giros a la derecha en rojo nunca están permitidos en DC
  answer: A
  explanation: En DC, puede girar a la derecha en rojo después de detenerse por completo
    y ceder el paso al tráfico y a los peatones, a menos que haya una señal que indique
    "No Turn on Red" (No girar en rojo).
- id: 89
  category: safe_driving_rules
  question: 'Al conducir cerca del tranvía de DC (DC Streetcar) en H Street o Benning
    Road, NO debe:'
  choices:
    A: Conducir en el mismo carril que el tranvía
    B: Estacionar su vehículo de manera que cualquier parte del mismo sobresalga de
      las vías del tranvía
    C: Rebasar al tranvía por la izquierda
    D: Señalizar antes de girar cruzando las vías
  answer: B
  explanation: Es ilegal estacionar o detener un vehículo donde bloquee el paso del
    tranvía de DC (DC Streetcar). Los vehículos que sobresalgan de la línea blanca
    cerca de las vías están sujetos a multas y remolque.
- id: 90
  category: safe_driving_rules
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de obras designada
    en el Distrito de Columbia cuando hay trabajadores presentes?
  choices:
    A: Los puntos asignados se triplican
    B: La multa se duplica
    C: Suspensión obligatoria de la licencia por 30 días
    D: No hay ninguna sanción adicional
  answer: B
  explanation: En el Distrito de Columbia, las multas por exceso de velocidad y otras
    infracciones de tráfico se duplican en las zonas de construcción u obras.
- id: 91
  category: safe_driving_rules
  question: Bajo la ley de 'Hacerse a un lado' (Move Over) de DC, ¿qué debe hacer
    al acercarse a un vehículo de emergencia detenido con luces intermitentes?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero tocar la bocina
    C: Ceder el paso cambiando de carril o reduciendo la velocidad si cambiar de carril
      no es seguro
    D: Aumentar la velocidad para rebasar el vehículo rápidamente
  answer: C
  explanation: La ley de DC exige que los conductores se cambien a un carril que no
    sea adyacente al vehículo de emergencia o que reduzcan la velocidad a un nivel
    seguro si no es posible cambiar de carril.
- id: 92
  category: safe_driving_rules
  question: ¿En cuál de los siguientes lugares no se permite realizar un giro en U
    en el Distrito de Columbia?
  choices:
    A: En cualquier curva o colina donde su vehículo no pueda ser visto por otros
      a menos de 500 pies
    B: A menos de 100 pies de un semáforo
    '0': En una calle con un límite de velocidad superior a 15 mph
    D: Frente a una estación de bomberos
  answer: A
  explanation: Los giros en U están prohibidos en curvas o cerca de la cima de una
    colina donde el vehículo no pueda ser visto por los conductores que se aproximan
    desde cualquier dirección dentro de los 500 pies.
- id: 93
  category: safe_driving_rules
  question: 'El Manual del Conductor del Distrito de Columbia recomienda mantener
    una distancia de seguimiento de al menos:'
  choices:
    A: La longitud de un automóvil
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: C
  explanation: El DMV de DC recomienda la 'regla de los tres segundos' para mantener
    una distancia de seguimiento segura detrás del vehículo que está delante de usted.
- id: 94
  category: defensive_driving
  question: Según el Manual del Conductor del Distrito de Columbia, ¿cuál es la distancia
    de seguimiento recomendada detrás del vehículo que va delante de usted bajo condiciones
    ideales?
  choices:
    A: La longitud de un automóvil por cada 10 mph
    B: De dos a cuatro segundos
    C: Exactamente 50 pies
    D: Un segundo
  answer: B
  explanation: El DMV de DC recomienda una distancia de seguimiento de dos a cuatro
    segundos para permitir suficiente tiempo para reaccionar ante peligros o paradas
    repentinas.
- id: 95
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar en el último minuto en el tráfico
    del Distrito, ¿con cuánta anticipación debe observar el camino?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: Solo el automóvil que está inmediatamente delante de usted
  answer: B
  explanation: Las reglas de conducción defensiva de DC establecen que debe mirar
    de 10 a 15 segundos hacia adelante (aproximadamente una cuadra en la ciudad) para
    anticipar el flujo del tráfico y los peligros.
- id: 96
  category: defensive_driving
  question: En el Distrito de Columbia, ¿a qué velocidad puede comenzar el hidroplaneo
    (cuando los neumáticos pierden contacto con la carretera en una superficie mojada)?
  choices:
    A: A velocidades tan bajas como 35 mph
    B: Solo a velocidades superiores a 55 mph
    C: Solo durante tormentas eléctricas intensas
    D: A velocidades superiores a 65 mph
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 97
  category: defensive_driving
  question: 'Al seguir a otro vehículo por la noche en el Distrito de Columbia, debe
    usar sus luces bajas cuando se encuentre a una distancia de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: En DC, debe cambiar a luces bajas cuando siga a otro vehículo a menos
    de 300 pies para que sus luces no se reflejen en el espejo retrovisor del otro
    conductor.
- id: 98
  category: defensive_driving
  question: Si conduce con niebla densa dentro del Distrito, ¿cuál de las siguientes
    acciones es la más segura?
  choices:
    A: Usar las luces altas para ver más lejos
    B: Encender las luces de emergencia y mantener la velocidad
    C: Usar las luces bajas y reducir la velocidad
    D: Conducir solo con las luces de estacionamiento encendidas
  answer: C
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en la humedad del aire, causando deslumbramiento. Reducir la velocidad
    es esencial para la seguridad.
- id: 99
  category: defensive_driving
  question: En el Distrito de Columbia, ¿qué sucede con la multa por una infracción
    de exceso de velocidad si ocurre en una zona de obras vial designada?
  choices:
    A: La multa se exonera para los infractores por primera vez
    B: La multa se duplica
    C: La multa se triplica
    D: La multa sigue siendo la misma pero los puntos se duplican
  answer: B
  explanation: De acuerdo con la ley de DC, las multas por exceso de velocidad y otras
    infracciones de movimiento se duplican cuando se cometen en una zona de obras
    mientras hay trabajadores presentes.
- id: 100
  category: defensive_driving
  question: Según la ley de 'Detenerse por los peatones' de DC, ¿qué debe hacer un
    conductor cuando un peatón se encuentra en un cruce de peatones en el lado de
    la carretera del conductor?
  choices:
    A: Reducir la velocidad y ceder el paso
    B: Tocar la bocina para advertir al peatón
    C: Detenerse y permanecer detenido hasta que el peatón haya pasado
    D: Continuar si el peatón no está directamente frente al automóvil
  answer: C
  explanation: La ley de DC exige que los automovilistas se detengan y permanezcan
    detenidos ante los peatones en los cruces de peatones. No hacerlo puede resultar
    en una multa y puntos en la licencia.
- id: 101
  category: defensive_driving
  question: 'Al entrar en una glorieta (roundabout) en DC, como Dupont Circle, debe
    ceder el paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en la glorieta
    C: A nadie; usted tiene el derecho de paso al entrar
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: Los conductores que entran en una glorieta deben ceder el paso al tráfico
    que ya circula dentro de ella, el cual se aproxima por la izquierda.
- id: 102
  category: defensive_driving
  question: 'Para revisar adecuadamente sus puntos ciegos antes de cambiar de carril
    en DC, debe:'
  choices:
    A: Revisar únicamente su espejo retrovisor
    B: Revisar únicamente sus espejos laterales
    C: Girar la cabeza y mirar por encima del hombro en la dirección hacia la que
      planea moverse
    D: Aumentar la velocidad para poder ver mejor por los espejos
  answer: C
  explanation: Los espejos no lo muestran todo. Debe girar la cabeza para revisar
    los 'puntos ciegos' que los espejos no pueden captar antes de cambiar de carril.
- id: 103
  category: defensive_driving
  question: 'Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS)
    y necesita detenerse rápidamente en una emergencia, debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante al pedal del freno
    C: Presionar los frenos ligeramente
    D: Cambiar a punto muerto (neutral) y usar el freno de emergencia
  answer: B
  explanation: Con el sistema ABS, no debe bombear los frenos. En su lugar, mantenga
    una presión firme y continua en el pedal del freno para permitir que el sistema
    evite que las ruedas se bloqueen.
- id: 104
  category: defensive_driving
  question: En el Distrito de Columbia, la 'Conducción Agresiva' se define como una
    combinación de infracciones de tránsito. ¿Cuántos puntos se asignan por cada infracción
    individual que constituye conducción agresiva?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 5 puntos
    D: Los puntos solo se asignan si ocurre un accidente
  answer: B
  explanation: En DC, se asignan 2 puntos por cada infracción de tránsito individual
    que contribuya a un cargo de conducción agresiva.
- id: 105
  category: defensive_driving
  question: Al conducir en condiciones invernales en el Distrito, ¿por qué es particularmente
    peligroso conducir sobre puentes y pasos elevados?
  choices:
    A: Suelen ser más estrechos que otras carreteras
    B: Pueden congelarse antes que otras superficies de la carretera
    C: Es más probable que tengan baches
    D: El límite de velocidad suele ser más alto en los puentes
  answer: B
  explanation: Los puentes y pasos elevados se congelan más rápido que otras carreteras
    porque están expuestos al aire frío tanto por arriba como por abajo.
- id: 106
  category: defensive_driving
  question: 'Cuando un vehículo de emergencia con luces intermitentes y sirenas se
    aproxima desde cualquier dirección en DC, usted debe:'
  choices:
    A: Aumentar la velocidad para despejar el camino
    B: Mantener su velocidad y permanecer en su carril
    C: Orillarse hacia el borde derecho de la acera y detenerse
    D: Detenerse exactamente donde esté
  answer: C
  explanation: La ley del Distrito exige que los conductores se orillen a la derecha
    y se detengan ante los vehículos de emergencia para dejarles un camino libre para
    pasar.
- id: 107
  category: defensive_driving
  question: 'En el Distrito de Columbia, para evitar la necesidad de frenar o girar
    en el último momento, un conductor debe mirar hacia adelante al menos:'
  choices:
    A: 5 a 8 segundos
    B: 10 a 15 segundos
    C: 20 a 25 segundos
    D: 30 a 40 segundos
  answer: B
  explanation: Las normas de conducción de DC establecen que debe observar la carretera
    de 10 a 15 segundos por delante de su vehículo para anticipar el flujo del tráfico
    y los posibles peligros.
- id: 108
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning) bajo lluvia
    intensa, causando potencialmente que sus neumáticos pierdan todo contacto con
    la carretera?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: B
  explanation: El Manual del Conductor de DC advierte que el hidroplaneo puede comenzar
    a velocidades tan bajas como 35 mph, y a 55 mph, los neumáticos pueden perder
    todo contacto con la carretera.
- id: 109
  category: defensive_driving
  question: Según la ley del Distrito de Columbia, ¿cuándo es obligatorio encender
    los faros delanteros de su vehículo?
  choices:
    A: Solo entre la medianoche y el amanecer
    B: Cuando la visibilidad es inferior a 500 pies
    C: Solo cuando se conduce por autopistas
    D: Solo durante tormentas de nieve intensas
  answer: B
  explanation: La ley de DC exige que los faros estén encendidos desde media hora
    después de la puesta del sol hasta media hora antes de la salida del sol, y en
    cualquier momento en que la visibilidad sea inferior a 500 pies.
- id: 110
  category: defensive_driving
  question: En DC, si es condenado por 'Conducción Agresiva', que incluye infracciones
    como seguir muy de cerca al vehículo de adelante (tailgating) y cambios de carril
    inseguros, ¿cuántos puntos se asignan a su licencia?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: El Distrito de Columbia asigna 6 puntos por una condena de conducción
    agresiva, lo que refleja el alto riesgo que este comportamiento representa para
    la seguridad pública.
- id: 111
  category: defensive_driving
  question: 'Al conducir por carreteras resbaladizas en el Distrito, si su vehículo
    comienza a derrapar, la acción defensiva correcta es:'
  choices:
    A: Frenar con fuerza y mantener el pedal presionado
    B: Girar el volante en la dirección opuesta al derrape
    C: Girar el volante en la dirección en la que se desliza la parte trasera del
      vehículo
    D: Cambiar la marcha del vehículo a 'Park' (estacionamiento)
  answer: C
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que se desliza la parte trasera del vehículo
    hasta que recupere el control.
- id: 112
  category: defensive_driving
  question: ¿Qué secuencia recomienda el Manual del Conductor de DC para observar
    una intersección adecuadamente antes de entrar?
  choices:
    A: Mirar a la derecha, luego a la izquierda y luego a la derecha de nuevo
    B: Mirar a la izquierda, luego a la derecha y luego a la izquierda de nuevo
    C: Mirar hacia adelante y acelerar
    D: Revisar únicamente el espejo retrovisor
  answer: B
  explanation: Debido a que el vehículo que viene por la izquierda está más cerca
    de usted, la secuencia de observación recomendada es izquierda, luego derecha
    y luego izquierda de nuevo antes de entrar en una intersección.
- id: 113
  category: defensive_driving
  question: Si comienza a llover en el Distrito de Columbia, ¿cuándo está más resbaladiza
    la superficie de la carretera?
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Justo cuando empieza a llover
    C: Solo cuando la temperatura está bajo el punto de congelación
    D: Cuando la lluvia es muy intensa
  answer: B
  explanation: Las carreteras están más resbaladizas justo cuando empieza a llover
    porque el agua se mezcla con el aceite y el polvo de la superficie de la carretera
    que aún no han sido eliminados por el agua.
- id: 114
  category: defensive_driving
  question: Al conducir con niebla densa en DC, ¿qué luces debe utilizar para mantener
    la mejor visibilidad?
  choices:
    A: Luces delanteras de carretera (altas)
    B: Luces delanteras de cruce (bajas)
    C: Solo las luces de estacionamiento
    D: Solo las luces de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en la niebla. Las luces altas se reflejan
    en la niebla y crean un resplandor, lo que dificulta la visión.
- id: 115
  category: defensive_driving
  question: En el Distrito de Columbia, ¿cuál es la sanción por no limpiar la nieve
    o el hielo de su vehículo si estos salen volando y representan una amenaza para
    los demás?
  choices:
    A: Solo una advertencia verbal
    B: Una multa de $100
    C: Suspensión obligatoria de la licencia
    D: Una multa de $1,000
  answer: B
  explanation: La ley de DC exige que los conductores limpien la nieve y el hielo
    de sus vehículos. No hacerlo puede resultar en una multa de $100, especialmente
    si crea un peligro para otros conductores.
- id: 116
  category: defensive_driving
  question: 'Cuando alguien lo sigue demasiado de cerca (tailgated) mientras conduce
    por una calle de DC, usted debe:'
  choices:
    A: Tocar los frenos repetidamente para asustar al conductor
    B: Reducir la velocidad gradualmente y animar al conductor a que lo pase
    C: Aumentar la velocidad para mantener la brecha de dos segundos
    D: Detenerse abruptamente para darle una lección
  answer: B
  explanation: La maniobra defensiva más segura cuando alguien lo sigue de cerca es
    reducir la velocidad gradualmente para aumentar el espacio frente a usted o cambiarse
    a otro carril para permitir que el conductor lo pase.
- id: 117
  category: defensive_driving
  question: Según las pautas de conducción defensiva de DC, ¿con qué frecuencia debe
    revisar sus espejos retrovisores?
  choices:
    A: Cada 2 a 5 segundos
    B: Cada 10 a 15 segundos
    C: Solo cuando escuche una sirena
    D: Solo cuando esté a punto de detenerse
  answer: A
  explanation: Las pautas de DC sugieren revisar los espejos cada 2 a 5 segundos para
    mantenerse al tanto de las posiciones del tráfico alrededor de su vehículo.
- id: 118
  category: defensive_driving
  question: 'Al conducir a través de un túnel en el Distrito de Columbia (como el
    túnel de la calle 9), usted debe:'
  choices:
    A: Encender las luces altas
    B: Encender las luces delanteras de cruce (bajas)
    C: Apagar todas las luces para ahorrar batería
    D: Usar solo las luces de estacionamiento
  answer: B
  explanation: Los conductores deben usar las luces bajas en los túneles para aumentar
    su visibilidad ante los demás y para ayudar a ver la calzada ante los cambios
    en las condiciones de iluminación.
- id: 119
  category: alcohol_drugs_health
  question: Para los conductores de 21 años o más en DC, ¿con qué nivel de concentración
    de alcohol en sangre (BAC) se considera legalmente intoxicado (DUI)?
  choices:
    A: 0.05% o superior
    B: 0.07% o superior
    C: 0.08% o superior
    D: 0.10% o superior
  answer: C
  explanation: En el Distrito de Columbia, un conductor se considera legalmente intoxicado
    si su BAC es de 0.08% o superior.
- id: 120
  category: alcohol_drugs_health
  question: Bajo la ley de 'Consentimiento Implícito' de DC, ¿qué sucede si se niega
    a realizarse una prueba química (aliento, sangre u orina) para determinar su BAC?
  choices:
    A: Su licencia será suspendida por 90 días
    B: Su licencia será revocada por un año
    C: Se le multará con $100 y se le permitirá conducir a casa
    D: No sucede nada a menos que sea condenado por un DUI
  answer: B
  explanation: Al conducir en DC, usted ha dado su consentimiento para realizarse
    pruebas químicas. La negativa a someterse a una prueba resulta en la revocación
    automática de sus privilegios de conducir por un año.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuántos puntos se asignan a su historial de conducción de DC por una
    condena de Conducir Bajo la Influencia (DUI)?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: Una condena por DUI en el Distrito de Columbia resulta en la asignación
    de 12 puntos a su historial de conducción, lo que conlleva a la revocación obligatoria
    de la licencia.
- id: 122
  category: alcohol_drugs_health
  question: En DC, ¿cuál es la multa máxima por una primera condena por DUI?
  choices:
    A: Hasta $500
    B: Hasta $1,000
    C: Hasta $2,500
    D: Hasta $5,000
  answer: B
  explanation: Una primera infracción por DUI en el Distrito de Columbia conlleva
    una multa de hasta $1,000 y una posible pena de cárcel de hasta 180 días.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál es el límite de Concentración de Alcohol en Sangre (BAC) para los
    conductores comerciales que operan un vehículo comercial en DC?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Las regulaciones federales y de DC establecen un límite de BAC más
    estricto de 0.04% para los conductores que operan vehículos motorizados comerciales.
- id: 124
  category: alcohol_drugs_health
  question: Si un conductor de DC es condenado por una primera infracción de DUI y
    su BAC era de 0.20% o superior, ¿cuál es la sentencia mínima obligatoria de cárcel?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 20 días
  answer: B
  explanation: La ley de DC exige una sentencia mínima de cárcel de 10 días por una
    primera infracción de DUI si el BAC del conductor es de 0.20% o superior.
- id: 125
  category: alcohol_drugs_health
  question: En el Distrito de Columbia, por una primera condena por DUI, ¿cuánto tiempo
    dura el período obligatorio de revocación de la licencia de conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Una primera condena por DUI en DC resulta en un período obligatorio
    de revocación de la licencia de 6 meses.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la marihuana
    y la conducción en el Distrito de Columbia?
  choices:
    A: Es legal conducir bajo la influencia de la marihuana si se compró legalmente.
    B: Es ilegal operar un vehículo motorizado bajo la influencia de la marihuana.
    C: La marihuana no afecta la capacidad de conducción como lo hace el alcohol.
    D: Solo es ilegal fumar marihuana mientras se conduce; estar bajo sus efectos
      no lo es.
  answer: B
  explanation: A pesar de la legalización de la posesión para adultos, sigue siendo
    estrictamente ilegal operar un vehículo motorizado bajo la influencia de la marihuana
    en DC.
- id: 127
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados o de venta libre, ¿quién es responsable
    de garantizar que esté en condiciones de conducir?
  choices:
    A: El farmacéutico
    B: El médico que los recetó
    C: El oficial de policía que lo detiene
    D: Usted, el conductor
  answer: D
  explanation: Es responsabilidad del conductor leer las etiquetas y consultar con
    profesionales médicos para asegurarse de que el medicamento no afecte su capacidad
    para conducir de manera segura.
- id: 128
  category: alcohol_drugs_health
  question: 'En DC, una segunda condena por DUI dentro de un período de 15 años conlleva
    una sentencia mínima obligatoria de cárcel de:'
  choices:
    A: 5 días
    B: 10 días
    C: 30 días
    D: 90 días
  answer: B
  explanation: Una segunda condena por DUI en DC dentro de un período de 15 años requiere
    una sentencia mínima obligatoria de cárcel de 10 días.
- id: 129
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' en relación con la conducción?
  choices:
    A: El efecto del alcohol desapareciendo con el tiempo.
    B: El efecto combinado del alcohol y las drogas siendo mayor que la suma de sus
      partes.
    C: La capacidad del café para neutralizar el alcohol.
    D: El límite legal de BAC en el Distrito.
  answer: B
  explanation: Combinar alcohol con otras drogas (incluso las recetadas) puede causar
    un efecto sinérgico, donde el deterioro es mucho más grave que si se usara cualquiera
    de las sustancias por separado.
- id: 130
  category: alcohol_drugs_health
  question: Según la ley de DC, ¿cuál es la sanción para un conductor que sea sorprendido
    con un recipiente abierto de alcohol en el área de pasajeros de un vehículo en
    una vía pública?
  choices:
    A: Solo una advertencia verbal
    B: Una multa de hasta $500 y/o hasta 90 días de cárcel
    C: Revocación obligatoria de la licencia por 1 año
    D: No hay sanción si el conductor no está ebrio
  answer: B
  explanation: La ley de Recipientes Abiertos de DC prohíbe los recipientes abiertos
    de alcohol en el área de pasajeros de cualquier vehículo en una vía pública. Los
    infractores pueden enfrentar una multa de hasta $500 y/o prisión de hasta 90 días.
- id: 131
  category: alcohol_drugs_health
  question: ¿Si tiene una condición médica que pueda afectar su capacidad para conducir
    de manera segura, qué debe hacer al solicitar una licencia de DC?
  choices:
    A: Nada, el historial médico es privado.
    B: Solo informarlo si ha tenido un accidente.
    C: Informar la condición al DMV y, potencialmente, proporcionar una autorización
      médica.
    D: Entregar su licencia de inmediato.
  answer: C
  explanation: Los solicitantes deben declarar las condiciones físicas o mentales
    que podrían afectar la conducción. El DMV de DC puede requerir un Formulario de
    Certificación Médica completado por un médico.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál es la única manera de "recuperar la sobriedad" antes de conducir
    después de haber consumido alcohol?
  choices:
    A: Beber café solo (negro)
    B: Tomar una ducha fría
    C: Hacer ejercicio vigoroso
    D: Permitir que pase el tiempo para que el cuerpo procese el alcohol
  answer: D
  explanation: El tiempo es el único factor que puede reducir la concentración de
    alcohol en sangre (BAC). El café, las duchas y el ejercicio no aceleran el metabolismo
    del alcohol en el hígado.
- id: 133
  category: alcohol_drugs_health
  question: 'En el Distrito de Columbia, se considera que una persona está conduciendo
    intoxicada "per se" (DWI) si su Concentración de Alcohol en Sangre (BAC) es igual
    o superior a:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En DC, un BAC de 0.08% o superior es el límite legal para que los conductores
    de 21 años o más sean acusados de Conducir Intoxicado (DWI).
- id: 134
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de "Consentimiento Implícito" (Implied Consent)
    del Distrito de Columbia para los conductores?
  choices:
    A: Que debe proporcionar la información de su seguro a otros conductores después
      de un accidente.
    B: Que acepta someterse a una prueba química de sangre, aliento u orina si se
      sospecha de DUI.
    C: Que consiente que la policía registre su vehículo en cualquier momento.
    D: Que acepta llevar una llanta de repuesto y un kit de emergencia en todo momento.
  answer: B
  explanation: Al tener una licencia de conducir de DC, usted ha dado su "consentimiento
    implícito" para someterse a pruebas químicas de alcohol o drogas si un oficial
    de la ley tiene motivos razonables para creer que está conduciendo bajo los efectos
    de sustancias.
- id: 135
  category: alcohol_drugs_health
  question: 'Si se niega a someterse a una prueba química de alcohol o drogas cuando
    lo solicite un oficial de policía de DC, su licencia será revocada por:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Según la ley de DC, negarse a realizar una prueba química resulta en
    la revocación automática de sus privilegios de conducción por 1 año (12 meses).
- id: 136
  category: alcohol_drugs_health
  question: En el Distrito de Columbia, ¿una condena por Conducir Intoxicado (DWI)
    o Conducir Bajo la Influencia (DUI) resulta en cuántos puntos asignados a su historial
    de conducción?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: Una condena por DUI o DWI en DC resulta en 12 puntos, lo que conlleva
    la revocación automática de la licencia de conducir.
- id: 137
  category: alcohol_drugs_health
  question: 'Con respecto a los recipientes abiertos de alcohol en un vehículo motorizado,
    la ley del Distrito de Columbia establece:'
  choices:
    A: Es legal si el recipiente está en la guantera.
    B: Es legal si el pasajero está bebiendo, pero no el conductor.
    C: Es ilegal tener un recipiente abierto de alcohol en el área de pasajeros de
      cualquier vehículo en una vía pública.
    D: Solo es ilegal si el BAC del conductor es superior al 0.08%.
  answer: C
  explanation: En DC, es ilegal poseer un recipiente abierto de alcohol en el área
    de pasajeros de un vehículo motorizado ubicado en una vía pública o incluso en
    el arcén (hombro) de la carretera.
- id: 138
  category: alcohol_drugs_health
  question: En DC, ¿cuál es la diferencia entre un cargo de DWI (Conducir Intoxicado)
    y un cargo de DUI (Conducir Bajo la Influencia)?
  choices:
    A: DWI es para drogas; DUI es para alcohol.
    B: DWI se basa en un BAC de 0.08% o superior; DUI se basa en el deterioro observado
      independientemente del BAC.
    C: DUI es un delito grave; DWI es un delito menor.
    D: No hay diferencia; son el mismo cargo.
  answer: B
  explanation: DWI es una infracción "per se" por tener un BAC de 0.08% o superior.
    El DUI puede imputarse si el conductor presenta facultades disminuidas por alcohol
    o drogas, incluso si su BAC es inferior al 0.08%.
- id: 139
  category: alcohol_drugs_health
  question: 'Para los conductores de vehículos motorizados comerciales en el Distrito
    de Columbia, el límite legal de BAC es:'
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Las regulaciones federales y de DC establecen un límite de BAC más
    estricto de 0.04% para los conductores que operan vehículos motorizados comerciales.
- id: 140
  category: alcohol_drugs_health
  question: 'Una primera condena por DUI en el Distrito de Columbia puede resultar
    en una multa máxima de hasta:'
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: Un DUI por primera vez en DC conlleva una multa potencial de hasta
    $1,000, además de posible tiempo en la cárcel y la revocación de la licencia.
- id: 141
  category: alcohol_drugs_health
  question: 'Si es condenado por una primera ofensa de DUI o DWI en el Distrito de
    Columbia, su licencia de conducir generalmente será revocada por al menos:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Una condena por primera ofensa de DUI/DWI en DC generalmente resulta
    en un periodo de revocación obligatoria de la licencia de 6 meses.
- id: 142
  category: alcohol_drugs_health
  question: 'En el Distrito de Columbia, si está tomando un medicamento recetado que
    afecta su capacidad para conducir:'
  choices:
    A: No puede ser arrestado porque el medicamento fue recetado legalmente.
    B: Puede ser acusado de DUI al igual que si estuviera bajo la influencia del alcohol.
    C: Solo es responsable si también consume alcohol.
    D: Debe mostrar una calcomanía 'médica' en su ventana trasera.
  answer: B
  explanation: Conducir bajo la influencia de cualquier droga que afecte su capacidad
    para operar un vehículo de manera segura, incluidos los medicamentos recetados
    o de venta libre, es ilegal en DC.
- id: 143
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de combinar alcohol con otras drogas, como antidepresivos
    o medicamentos para el resfriado?
  choices:
    A: Los efectos del alcohol se anulan.
    B: Los efectos de la droga se anulan.
    C: Puede multiplicar los efectos de ambos, aumentando significativamente el deterioro.
    D: No hay un efecto medible en la capacidad de conducción.
  answer: C
  explanation: Combinar alcohol con otras drogas (efecto sinérgico) a menudo resulta
    en un deterioro mucho mayor que el que causaría cualquiera de las sustancias por
    sí sola.
- id: 144
  category: alcohol_drugs_health
  question: 'Si tiene una condición médica que pueda afectar su capacidad para conducir
    de manera segura (como epilepsia o diabetes), la ley de DC le exige:'
  choices:
    A: Dejar de conducir inmediata y permanentemente.
    B: Informar la condición al DMV y, potencialmente, proporcionar una autorización
      médica.
    C: Solo conducir durante las horas del día.
    D: Solo conducir con un médico con licencia en el automóvil.
  answer: B
  explanation: El DMV de DC requiere que los conductores informen sobre las condiciones
    médicas que puedan interferir con la conducción segura. Es posible que se requiera
    un Formulario de Historial Médico completado por un médico para mantener la licencia.
- id: 145
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma de 'recuperar la sobriedad'
    y reducir su BAC antes de conducir?
  choices:
    A: Beber café negro cargado.
    B: Tomar una ducha fría.
    C: Hacer ejercicio o correr.
    D: Darle tiempo a su cuerpo para procesar el alcohol.
  answer: D
  explanation: El tiempo es el único factor que puede reducir el BAC. El cuerpo procesa
    el alcohol a un ritmo constante (aproximadamente una bebida estándar por hora).
- id: 146
  category: alcohol_drugs_health
  question: 'En el Distrito de Columbia, se puede requerir un Dispositivo de Bloqueo
    de Encendido (IID) para los conductores que:'
  choices:
    A: Son condenados por un DUI por primera vez con un BAC alto o cualquier DUI posterior.
    B: No pagan tres o más multas de estacionamiento.
    C: Son sorprendidos por exceso de velocidad en una zona escolar.
    D: Son menores de 18 años y tienen un permiso de aprendizaje.
  answer: A
  explanation: El Programa de Bloqueo de Encendido de DC es obligatorio para ciertas
    infracciones relacionadas con el alcohol, incluidos niveles altos de BAC o condenas
    repetidas por DUI, para permitir privilegios de conducción restringidos.
- id: 147
  category: penalties_and_points
  question: En el Distrito de Columbia, ¿cuántos puntos se asignan a su historial
    de conducción por exceder el límite de velocidad legal entre 11 y 15 mph?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: De acuerdo con el sistema de puntos del DMV de DC, exceder el límite
    de velocidad entre 11 y 15 mph resulta en la asignación de 3 puntos al historial
    del conductor.
- id: 148
  category: penalties_and_points
  question: Si un conductor de DC es condenado por exceder el límite de velocidad
    entre 16 y 20 mph, ¿cuántos puntos se añadirán a su historial?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: El DMV de DC asigna 4 puntos por infracciones de exceso de velocidad
    que superen el límite de velocidad establecido entre 16 y 20 mph.
- id: 149
  category: penalties_and_points
  question: En el Distrito de Columbia, ¿cuál es la penalización de puntos por exceder
    el límite legal de velocidad en 21 mph o más?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 12 puntos
  answer: B
  explanation: Exceder el límite legal de velocidad en 21 mph o más resulta en la
    adición de 5 puntos al historial de un conductor en DC.
- id: 150
  category: penalties_and_points
  question: Los conductores de DC pueden ganar puntos de 'Conducción Segura' por conducir
    un año calendario completo sin infracciones de tránsito. ¿Cuál es el número máximo
    de puntos de conducción segura que un conductor puede acumular?
  choices:
    A: 3 puntos
    B: 5 puntos
    C: 10 puntos
    D: 12 puntos
  answer: B
  explanation: El DMV de DC permite a los conductores ganar un punto de conducción
    segura por año por conducir sin infracciones, hasta un máximo total de 5 puntos.
    Estos puntos pueden compensar los puntos asignados por infracciones.
- id: 151
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan al registro de un conductor de DC por no detenerse
    ante un autobús escolar que tiene sus luces rojas intermitentes?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar se considera una violación de
    seguridad grave en DC y conlleva una penalización de 4 puntos.
- id: 152
  category: penalties_and_points
  question: En DC, ¿cuántos puntos se asignan por "Conducir por el lado equivocado
    de la carretera"?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Conducir por el lado equivocado de la carretera es una infracción de
    3 puntos en el Distrito de Columbia.
- id: 153
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su registro de conducir de DC por "Seguir
    demasiado de cerca" (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: A
  explanation: Seguir demasiado de cerca es una infracción de movimiento que resulta
    en 2 puntos en el registro de un conductor de DC.
- id: 154
  category: penalties_and_points
  question: En el Distrito de Columbia, ¿cuántos puntos resultan de girar desde el
    carril equivocado?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Los giros inadecuados, como girar desde el carril equivocado, son penalizados
    con 2 puntos por el DMV de DC.
- id: 155
  category: penalties_and_points
  question: Si no se da la señal adecuada al girar o detenerse en DC, ¿cuántos puntos
    se asignan?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 0 puntos (solo multa)
  answer: A
  explanation: No señalizar es una infracción de movimiento en DC y conlleva una penalización
    de 2 puntos.
- id: 156
  category: penalties_and_points
  question: Bajo el programa GRAD de DC, si el titular de un permiso de aprendizaje
    o una licencia provisional es condenado por una infracción de movimiento, ¿qué
    sucede con su progreso?
  choices:
    A: Solo debe pagar una multa de $500
    B: El período de espera obligatorio para la siguiente etapa de la licencia se
      reinicia
    C: Su licencia es revocada permanentemente
    D: Nada, siempre y cuando asista a una escuela de tráfico
  answer: B
  explanation: En el programa GRAD, si un conductor es condenado por una infracción
    que conlleva puntos, el período de espera obligatorio de 6 o 12 meses sin infracciones
    requerido para avanzar a la siguiente etapa comienza de nuevo.
- id: 157
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por "No ceder el paso a un peatón en un cruce
    de peatones" en DC?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: No ceder el paso a un peatón en un cruce de peatones es una infracción
    de 3 puntos en el Distrito de Columbia.
- id: 158
  category: penalties_and_points
  question: En DC, ¿cuántos puntos resultan de no ceder el paso a un vehículo de emergencia
    (como una ambulancia con las sirenas encendidas)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: A
  explanation: No ceder el paso a un vehículo de emergencia es una infracción de 2
    puntos en el Distrito de Columbia.
- id: 159
  category: penalties_and_points
  question: ¿Cuántos puntos se pueden eliminar de un registro de conducir de DC si
    el conductor completa con éxito un curso de conducción defensiva aprobado por
    el DMV?
  choices:
    A: Hasta 1 punto
    B: Hasta 2 puntos
    C: Hasta 3 puntos
    D: Hasta 5 puntos
  answer: B
  explanation: Los conductores de DC pueden eliminar hasta 2 puntos de su registro
    al completar un curso de conducción defensiva aprobado una vez cada 24 meses.
- id: 160
  category: penalties_and_points
  question: En el Distrito de Columbia, ¿cuántos puntos se asignan por una infracción
    de conducción distraída que involucre el uso de un teléfono móvil manual?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: El uso de un teléfono móvil manual o un dispositivo electrónico mientras
    se conduce en DC resulta en la asignación de 3 puntos al registro del conductor.
- id: 161
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por abandonar la escena de un accidente que
    involucre lesiones personales en el Distrito de Columbia?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: Abandonar la escena de un accidente donde ocurrió una lesión personal
    es una infracción grave y resulta en 12 puntos, lo que conlleva a la revocación
    obligatoria de la licencia.
- id: 162
  category: penalties_and_points
  question: En DC, ¿cuántos puntos se asignan a su licencia si es captado por una
    cámara automatizada de control de tráfico por exceso de velocidad?
  choices:
    A: 0 puntos
    B: 2 puntos
    C: 3 puntos
    D: Los puntos varían según la velocidad
  answer: A
  explanation: Aunque las multas emitidas por cámaras en DC conllevan sanciones monetarias
    significativas, no resultan en la adición de puntos a la licencia de conducir.
- id: 163
  category: penalties_and_points
  question: ¿Cuál es la multa estándar en el Distrito de Columbia por conducir a un
    exceso de velocidad de 21 a 25 mph sobre el límite establecido?
  choices:
    A: $100
    B: $150
    C: $200
    D: $300
  answer: C
  explanation: En DC, la multa por exceder el límite de velocidad entre 21 y 25 mph
    es de $200.
- id: 164
  category: penalties_and_points
  question: 'Por una primera infracción de DUI en el Distrito de Columbia, un conductor
    puede enfrentar una pena máxima de cárcel de hasta:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Una primera condena por DUI en DC puede conllevar una pena máxima de
    hasta 180 días de cárcel.
- id: 165
  category: sharing_the_road
  question: 'En el Distrito de Columbia, cuando un peatón está cruzando la calzada
    dentro de un paso de peatones, el conductor de un vehículo debe:'
  choices:
    A: Reducir la velocidad y tocar la bocina para advertir al peatón
    B: Detenerse y permanecer detenido hasta que el peatón haya pasado el carril en
      el que el vehículo está detenido
    C: Ceder el paso solo si el peatón está usando un bastón blanco
    D: Mantener la velocidad si el peatón está en el carril opuesto
  answer: B
  explanation: Según la ley de DC, un conductor debe detenerse y permanecer detenido
    ante un peatón en un paso de peatones cuando el peatón se encuentre en la mitad
    de la calzada por la que circula el vehículo o se aproxime tanto que esté en peligro.
- id: 166
  category: sharing_the_road
  question: Al rebasar a una persona que opera una bicicleta en el Distrito de Columbia,
    ¿cuál es la distancia mínima de seguridad que debe mantener un automovilista?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de DC exige que los automovilistas mantengan una distancia de
    seguridad de al menos 3 pies al alcanzar y rebasar una bicicleta.
- id: 167
  category: sharing_the_road
  question: 'En DC, debe detenerse ante un autobús escolar con luces rojas intermitentes
    y un brazo de parada extendido, a menos que:'
  choices:
    A: Usted viaje en la dirección opuesta en una calzada dividida por una mediana
      o barrera física
    B: Haya al menos tres carriles de tráfico
    C: El autobús esté detenido en una zona escolar
    D: Usted viaje a menos de 15 mph
  answer: A
  explanation: Los conductores deben detenerse ante un autobús escolar desde cualquier
    dirección, a menos que la calzada esté separada por una barrera física o una franja
    divisoria (mediana).
- id: 168
  category: sharing_the_road
  question: Bajo la ley de 'Parada de Seguridad' (Safety Stop) de DC, ¿cómo se les
    permite a los ciclistas tratar una señal de alto cuando la intersección está despejada?
  choices:
    A: Como una luz verde
    B: Como una señal de ceder el paso
    C: Siempre deben detenerse por completo
    D: Como una luz roja intermitente
  answer: B
  explanation: La Ley de Enmienda de Seguridad para Bicicletas permite a los ciclistas
    en DC tratar las señales de alto como señales de ceder el paso, siempre que reduzcan
    la velocidad y cedan el paso a los peatones y otros vehículos con el derecho de
    paso.
- id: 169
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen 'Zonas Prohibidas' (No-Zones).
    ¿Dónde se encuentra el punto ciego más grande en un camión comercial?
  choices:
    A: Directamente frente a la cabina
    B: Directamente detrás del remolque
    C: En el lado izquierdo del remolque
    D: En la puerta del lado del conductor
  answer: B
  explanation: El área directamente detrás de un camión grande es una 'Zona Prohibida'
    (punto ciego) principal donde el conductor del camión no puede ver su vehículo
    en absoluto.
- id: 170
  category: sharing_the_road
  question: 'Si ve a un peatón con un bastón blanco o un perro guía en una intersección
    en DC, usted debe:'
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Ceder el derecho de paso y tomar precauciones adicionales
    C: Conducir alrededor de ellos si hay espacio
    D: Esperar a que le hagan una señal para pasar
  answer: B
  explanation: Los conductores deben ceder el derecho de paso a cualquier peatón ciego
    o con discapacidad visual que lleve un bastón blanco o utilice un perro guía.
- id: 171
  category: sharing_the_road
  question: ¿En el Distrito de Columbia, es ilegal estacionar o detener un vehículo
    en cuál de las siguientes áreas?
  choices:
    A: A menos de 5 pies de una entrada para autos
    B: En un carril para bicicletas designado
    C: En una calle de un solo sentido
    D: A más de 12 pulgadas de un bordillo
  answer: B
  explanation: Es ilegal estacionar, parar o detener un vehículo en un carril para
    bicicletas designado en DC, ya que crea un peligro de seguridad para los ciclistas.
- id: 172
  category: sharing_the_road
  question: ¿Es legal el 'lane splitting' (conducir una motocicleta entre filas de
    vehículos detenidos o en movimiento) en el Distrito de Columbia?
  choices:
    A: Sí, es legal en todo momento
    B: Sí, pero solo cuando el tráfico se mueve a menos de 15 mph
    C: No, no está permitido
    D: Solo para los servicios de emergencia
  answer: C
  explanation: El 'lane splitting' no está autorizado en DC; las motocicletas deben
    operar dentro de un solo carril y tienen derecho al uso total de ese carril.
- id: 173
  category: sharing_the_road
  question: 'Si un peatón ya ha entrado en el cruce peatonal y la señal de ''No cruzar''
    (Don''t Walk) comienza a parpadear, un conductor de DC debe:'
  choices:
    A: Continuar conduciendo ya que el peatón ya no tiene el derecho de paso
    B: Permitir que el peatón termine de cruzar la calle
    C: Tocar la bocina para decirle al peatón que se dé prisa
    D: Reducir la velocidad pero no detenerse
  answer: B
  explanation: Si un peatón ya está en el cruce peatonal cuando la señal cambia, el
    conductor debe ceder el paso y permitirle completar su cruce de manera segura.
- id: 174
  category: sharing_the_road
  question: ¿En el Distrito de Columbia, dónde está estrictamente prohibido que las
    personas de 16 años de edad o más anden en bicicleta por la acera?
  choices:
    A: En vecindarios residenciales
    B: Cerca de escuelas públicas
    C: En el Distrito Central de Negocios (Central Business District)
    D: En cualquier calle con un límite de velocidad superior a 25 mph
  answer: C
  explanation: La ley de DC prohíbe andar en bicicleta por las aceras dentro del Distrito
    Central de Negocios (CBD). Fuera del CBD, generalmente se permite andar por la
    acera.
- id: 175
  category: sharing_the_road
  question: 'Al seguir a un equipo de bomberos (camión de bomberos) que responde a
    una alarma en DC, debe mantener una distancia mínima de seguimiento de:'
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Es ilegal seguir a un equipo de bomberos que viaja en respuesta a una
    alarma de incendio a una distancia menor a 500 pies.
- id: 176
  category: sharing_the_road
  question: 'Al compartir la carretera con el tranvía de DC (DC Streetcar), un conductor
    nunca debe:'
  choices:
    A: Conducir sobre las vías
    B: Rebasar a un tranvía por la derecha
    C: Estacionar un vehículo dentro de las líneas blancas de 'Streetcar No-Go'
    D: Girar a la derecha en una intersección
  answer: C
  explanation: Los vehículos no deben estacionarse dentro de las líneas blancas de
    la zona del tranvía; incluso un pequeño solapamiento puede impedir que el tranvía
    pase, lo que conlleva multas y remolque.
- id: 177
  category: sharing_the_road
  question: ¿En el Distrito de Columbia, cuando un autobús escolar se detiene con
    sus luces rojas parpadeando y el brazo de parada extendido en una calle sin mediana,
    qué debe hacer un conductor?
  choices:
    A: Reducir la velocidad y pasar con precaución
    B: Detenerse solo si viaja en la misma dirección que el autobús
    C: Detenerse desde cualquier dirección y permanecer detenido hasta que las luces
      dejen de parpadear
    D: Detenerse solo si hay niños cruzando la calle en ese momento
  answer: C
  explanation: En DC, los automovilistas deben detenerse desde cualquier dirección
    cuando un autobús escolar tiene sus luces rojas parpadeando y el brazo de parada
    extendido, a menos que la carretera esté separada por una mediana física.
- id: 178
  category: sharing_the_road
  question: Según el Manual del Conductor de DC, ¿qué debe hacer cuando un vehículo
    de emergencia con sirenas y luces parpadeantes se acerca por detrás?
  choices:
    A: Acelerar para quitarse del camino
    B: Detenerse inmediatamente en su carril actual
    C: Moverse hacia el borde derecho de la carretera y detenerse
    D: Seguir de cerca al vehículo de emergencia para atravesar el tráfico
  answer: C
  explanation: Cuando se acerca un vehículo de emergencia con luces y sirenas, debe
    moverse lo más a la derecha posible y detenerse hasta que el vehículo haya pasado.
- id: 179
  category: sharing_the_road
  question: ¿En el Distrito de Columbia, es ilegal rebasar a un tranvía de DC (DC
    Streetcar) por qué lado mientras está en movimiento o detenido?
  choices:
    A: El lado derecho
    B: El lado izquierdo
    C: Ambos lados
    D: Se permite rebasar por ambos lados si hay un carril
  answer: B
  explanation: Se prohíbe a los conductores rebasar a un tranvía de DC por la izquierda,
    ya que las vías a menudo están colocadas de una manera que hace que rebasar por
    el lado izquierdo sea peligroso o imposible dentro de la configuración del carril.
- id: 180
  category: sharing_the_road
  question: Cuando un peatón está en un cruce peatonal en el Distrito de Columbia,
    ¿cuál es la obligación legal del conductor?
  choices:
    A: Reducir la velocidad y ceder el paso
    B: Detenerse y permanecer detenido hasta que el peatón haya despejado la mitad
      de la carretera por la que circula el conductor
    C: Tocar la bocina para advertir al peatón de su presencia
    D: Los conductores solo necesitan detenerse si hay una señal de 'Pare' (Stop)
  answer: B
  explanation: La ley de DC exige que los conductores se detengan y permanezcan detenidos
    ante los peatones en los cruces peatonales cuando el peatón se encuentra en la
    mitad de la calzada por la que circula el vehículo o se aproxima tanto que corre
    peligro.
- id: 181
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen 'No-Zones' (Zonas Prohibidas).
    ¿Dónde se encuentran estas zonas?
  choices:
    A: Solo directamente detrás del camión
    B: Solo en el lado izquierdo del camión
    C: Directamente al frente, directamente detrás y a ambos lados del camión
    D: Solo en el punto ciego del conductor a la derecha
  answer: C
  explanation: Las 'No-Zones' son los grandes puntos ciegos alrededor de un camión
    donde el conductor no puede ver a otros vehículos. Estas se encuentran en la parte
    delantera, trasera y en ambos lados.
- id: 182
  category: sharing_the_road
  question: En DC, cuando un automovilista va a girar a la derecha y un ciclista avanza
    recto en un carril para bicicletas o en el acotamiento, ¿quién tiene el derecho
    de paso?
  choices:
    A: El automovilista, porque está en un vehículo más grande
    B: El ciclista
    C: Quien llegue primero a la intersección
    D: El automovilista, porque las bicicletas deben ceder el paso al tráfico que
      gira
  answer: B
  explanation: Los automovilistas deben ceder el paso a los ciclistas al girar. Cortar
    el paso a un ciclista para hacer un giro a la derecha (conocido como 'right hook')
    es una causa común de accidentes y es ilegal.
- id: 183
  category: sharing_the_road
  question: Al estacionarse cerca de una vía del tranvía de DC (DC Streetcar), ¿cómo
    debe estacionar su vehículo?
  choices:
    A: A menos de 2 pies de la vía
    B: Sobre la línea blanca que marca la trayectoria del tranvía
    C: Completamente dentro del carril de estacionamiento designado, asegurándose
      de que ninguna parte del vehículo sobresalga del área de la vía
    D: En un ángulo de 45 grados con respecto a la vía
  answer: C
  explanation: Los vehículos deben estacionarse completamente dentro de las líneas
    de estacionamiento marcadas. Si cualquier parte del vehículo (incluidos los espejos)
    sobresale hacia la trayectoria del tranvía, puede ser multado y remolcado de inmediato.
- id: 184
  category: sharing_the_road
  question: En el Distrito de Columbia, ¿cuál es la sanción por 'dooring' (abrir la
    puerta de un vehículo en la trayectoria de un ciclista)?
  choices:
    A: Solo una advertencia verbal
    B: Una suspensión obligatoria de la licencia
    C: Una multa civil (actualmente de $25)
    D: No existe una ley específica contra el 'dooring' en DC
  answer: C
  explanation: La ley de DC prohíbe abrir la puerta de un vehículo de manera que interfiera
    con el movimiento del tráfico o de los ciclistas. Esto conlleva una multa específica.
- id: 185
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene en una calzada con una mediana física
    (como una barrera de concreto) que separa las direcciones de viaje, ¿deben detenerse
    los vehículos del lado opuesto?
  choices:
    A: Sí, siempre deben detenerse
    B: No, pueden proceder con precaución
    C: Sí, pero solo si el conductor del autobús les indica que se detengan
    D: No, pero deben detenerse si hay más de dos carriles
  answer: B
  explanation: En DC, si una carretera está separada por una barrera física o mediana,
    el tráfico que se mueve en la dirección opuesta a un autobús escolar detenido
    no está obligado a detenerse.
- id: 186
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que debe mantener cuando sigue a un vehículo
    de emergencia que responde a una alarma en DC?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: De acuerdo con el Manual del Conductor de DC, no debe seguir a menos
    de 500 pies a cualquier equipo de bomberos que viaje en respuesta a una alarma
    de incendio.
- id: 187
  category: sharing_the_road
  question: Al compartir la carretera con una motocicleta, ¿por qué debe permitirle
    el ancho completo de un carril?
  choices:
    A: Los motociclistas necesitan espacio para maniobrar ante peligros como baches
      o escombros
    B: Es un requisito legal en el Distrito de Columbia
    C: Para evitar el punto ciego de la motocicleta
    D: Tanto A como B
  answer: D
  explanation: Las motocicletas tienen derecho al uso completo de un carril. Los automovilistas
    nunca deben intentar compartir un carril con una motocicleta, ya que los conductores
    necesitan espacio para reaccionar a los peligros de la carretera.
- id: 188
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle estrecha de DC,
    es posible que necesite:'
  choices:
    A: Acelerar para despejar la intersección
    B: Abrirse ampliamente hacia la izquierda antes de girar a la derecha
    C: Mantenerse lo más cerca posible de la acera derecha
    D: Girar desde el carril situado más a la izquierda
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha sin golpear la acera u otros objetos. Los conductores
    nunca deben intentar meterse entre un camión y la acera durante un giro.
- id: 189
  category: vehicle_information
  question: 'En el Distrito de Columbia, debe atenuar sus luces altas (cambiar a luces
    bajas) cuando siga a otro vehículo a una distancia de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: Los conductores en DC deben cambiar a luces bajas cuando sigan a otro
    vehículo a una distancia de 300 pies.
- id: 190
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para un vehículo de pasajeros en el Distrito de Columbia?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Las normas de seguridad de vehículos de DC requieren que los neumáticos
    tengan una profundidad de banda de rodadura de al menos 2/32 de pulgada en todas
    las ranuras principales.
- id: 191
  category: vehicle_information
  question: Según la ley de DC, ¿cuál es el porcentaje máximo de bloqueo de luz (polarizado)
    permitido en las ventanas laterales delanteras de un automóvil de pasajeros?
  choices:
    A: 30% de bloqueo (70% de transmisión de luz)
    B: 50% de bloqueo (50% de transmisión de luz)
    C: 65% de bloqueo (35% de transmisión de luz)
    D: No se permite ningún tipo de polarizado en las ventanas laterales delanteras
  answer: A
  explanation: El DCMR Título 18, Sección 734, especifica que las ventanas laterales
    delanteras deben permitir el paso de al menos el 70% de la luz (lo que significa
    no más del 30% de polarizado).
- id: 192
  category: vehicle_information
  question: Para los automóviles de pasajeros en el Distrito de Columbia, ¿qué porcentaje
    de transmisión de luz deben permitir, como mínimo, las ventanas laterales traseras
    y la ventana trasera?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 20%
  answer: B
  explanation: Las regulaciones de DC establecen que las ventanas laterales traseras
    y la ventana trasera de un automóvil de pasajeros deben permitir al menos un 50%
    de transmisión de luz.
- id: 193
  category: vehicle_information
  question: En DC, ¿los frenos de servicio de su vehículo deben ser capaces de detener
    el vehículo en cuántos pies cuando viaja a 20 mph en un pavimento seco y nivelado?
  choices:
    A: 15 pies
    B: 25 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: Según las regulaciones de equipo de vehículos de DC, los frenos de
    servicio deben poder detener un vehículo de pasajeros en un máximo de 25 pies
    desde una velocidad de 20 mph.
- id: 194
  category: vehicle_information
  question: 'Todo vehículo motorizado en el Distrito de Columbia debe estar equipado
    con una bocina que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de DC exige que todos los vehículos motorizados tengan una bocina
    en buen estado de funcionamiento capaz de emitir un sonido audible en condiciones
    normales desde una distancia no menor a 200 pies.
- id: 195
  category: vehicle_information
  question: 'En DC, el sistema de escape de un vehículo debe estar equipado con un
    silenciador para evitar:'
  choices:
    A: Cualquier humo visible
    B: Ruido excesivo o inusual
    C: El uso de combustible premium
    D: El sobrecalentamiento del motor
  answer: B
  explanation: Las regulaciones de DC exigen que cada vehículo motorizado tenga un
    silenciador en buen estado de funcionamiento para evitar ruidos excesivos o inusuales
    y humo molesto.
- id: 196
  category: vehicle_information
  question: ¿Cuándo debe usar los limpiaparabrisas en el Distrito de Columbia?
  choices:
    A: Solo cuando la visibilidad es inferior a 100 pies
    B: Siempre que esté lloviendo o nevando
    C: Solo durante las horas nocturnas
    D: Siempre que esté usando sus faros delanteros
  answer: B
  explanation: La ley de DC exige el uso de limpiaparabrisas durante la lluvia, el
    aguanieve o la nieve para mantener una visión clara. Además, si usa los limpiaparabrisas,
    también debe encender los faros delanteros.
- id: 197
  category: vehicle_information
  question: Con respecto a las placas de matrícula (tags) en DC, ¿cuál de las siguientes
    afirmaciones es verdadera?
  choices:
    A: Solo necesita mostrar una placa de matrícula trasera
    B: Las placas de matrícula deben ser visibles desde 50 pies
    C: Tanto la placa delantera como la trasera deben estar colocadas y ser claramente
      visibles
    D: Las placas pueden colocarse en la ventana trasera si un soporte está roto
  answer: C
  explanation: La ley de DC exige que los vehículos motorizados (excepto motocicletas
    y remolques) muestren dos placas de identificación vigentes, una en la parte delantera
    y otra en la trasera.
- id: 198
  category: vehicle_information
  question: En el Distrito de Columbia, ¿su vehículo debe tener al menos cuántos espejos
    para proporcionar una visión de la carretera hacia atrás?
  choices:
    A: Un espejo interior
    B: Un espejo exterior en el lado del conductor
    C: Al menos dos espejos, uno de los cuales debe estar en el exterior del lado
      izquierdo
    D: Tres espejos (izquierdo, derecho y central)
  answer: C
  explanation: Las regulaciones de DC exigen al menos dos espejos, incluido uno en
    el lado exterior izquierdo, colocados para reflejar una vista de la carretera
    de al menos 200 pies hacia atrás.
- id: 199
  category: vehicle_information
  question: Si las señales de giro de su vehículo no funcionan, debe usar señales
    manuales. ¿Cuál es la señal manual correcta para un giro a la derecha?
  choices:
    A: Brazo extendido hacia afuera
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo
    D: Brazo movido en movimiento circular
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido hacia arriba en un ángulo de 90 grados.
- id: 200
  category: vehicle_information
  question: 'En DC, el freno de estacionamiento debe ser capaz de mantener el vehículo
    inmóvil en cualquier pendiente en la que se opere, incluso en ausencia de:'
  choices:
    A: El conductor
    B: El motor en marcha
    C: La transmisión engranada
    D: Todas las anteriores
  answer: D
  explanation: Las normas de seguridad de DC exigen que el freno de estacionamiento
    sea un mecanismo independiente capaz de mantener el vehículo inmóvil en cualquier
    pendiente, independientemente del estado del motor o de la posición de la marcha.
- id: 201
  category: vehicle_information
  question: En el Distrito de Columbia, ¿durante qué horas es obligatorio tener encendidas
    las luces delanteras de su vehículo?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde una hora después del atardecer hasta una hora antes del amanecer
    C: Desde media hora después del atardecer hasta media hora antes del amanecer
    D: Solo cuando la visibilidad sea inferior a 1,000 pies
  answer: C
  explanation: Según el Manual del Conductor de DC, los automovilistas deben encender
    las luces delanteras desde media hora después del atardecer hasta media hora antes
    del amanecer, y en cualquier otro momento en que la visibilidad no sea suficiente.
- id: 202
  category: vehicle_information
  question: Según las normas de equipamiento de vehículos de DC, ¿el freno de pie
    debe ser capaz de detener el vehículo en cuántos pies cuando se viaja a 20 mph?
  choices:
    A: 15 pies
    B: 20 pies
    C: 25 pies
    D: 30 pies
  answer: C
  explanation: El Manual del Conductor de DC establece que el freno de servicio (freno
    de pie) debe ser capaz de detener el vehículo en un tramo de 25 pies cuando el
    vehículo viaja a 20 millas por hora (mph).
- id: 203
  category: vehicle_information
  question: Para un sedán de pasajeros registrado en DC, ¿cuál es el nivel máximo
    de oscuridad permitido para el polarizado de las ventanas laterales delanteras?
  choices:
    A: Debe permitir más del 35% de transmisión de luz
    B: Debe permitir más del 50% de transmisión de luz
    C: Debe permitir más del 70% de transmisión de luz
    D: No se permite el polarizado en las ventanas laterales delanteras
  answer: C
  explanation: El reglamento DCMR 18-730 especifica que para los automóviles de pasajeros
    (sedanes), el parabrisas y las ventanas laterales delanteras deben permitir al
    menos un 70% de transmisión de luz.
- id: 204
  category: vehicle_information
  question: Para un sedán de pasajeros registrado en DC, ¿cuál es la transmisión de
    luz mínima requerida para las ventanas laterales traseras y la ventana trasera?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: Sin límite
  answer: B
  explanation: En el Distrito de Columbia, los sedanes de pasajeros deben tener al
    menos un 50% de transmisión de luz en las ventanas laterales traseras y en la
    ventana trasera.
- id: 205
  category: vehicle_information
  question: ¿Con qué frecuencia debe someterse a una inspección de emisiones un vehículo
    personal no comercial registrado en el Distrito de Columbia?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada cuatro años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: El DMV de DC requiere que los vehículos personales se sometan a una
    inspección de emisiones cada dos años.
- id: 206
  category: vehicle_information
  question: 'En DC, el espejo retrovisor de su vehículo debe estar ajustado de modo
    que pueda ver la carretera hacia atrás a una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las regulaciones de equipamiento de DC requieren un espejo ubicado
    de tal manera que refleje al conductor una vista de la carretera por una distancia
    de al menos 200 pies hacia atrás.
- id: 207
  category: vehicle_information
  question: 'La ley de DC exige que la placa trasera esté iluminada por una luz blanca
    para que sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: Los vehículos en DC deben tener una lámpara que haga que la placa de
    registro trasera sea claramente legible desde una distancia de 50 pies hacia atrás.
- id: 208
  category: vehicle_information
  question: Según la ley de DC, ¿hasta qué edad deben los niños estar debidamente
    sujetos en un asiento de seguridad para niños orientado hacia atrás?
  choices:
    A: 1 año
    B: 2 años
    C: 4 años
    D: 6 años
  answer: B
  explanation: La ley del Distrito de Columbia exige que los niños menores de 2 años
    estén debidamente asegurados en un sistema de retención infantil orientado hacia
    atrás.
- id: 209
  category: vehicle_information
  question: En el Distrito de Columbia, ¿cuál es la sanción para un conductor que
    no usa el cinturón de seguridad?
  choices:
    A: Una multa de $20 y ningún punto
    B: Una multa de $50 y 2 puntos
    C: Una multa de $100 y 3 puntos
    D: Reentrenamiento obligatorio para conductores
  answer: B
  explanation: En DC, la multa por una infracción del cinturón de seguridad es de
    $50 y se asignan 2 puntos a la licencia de conducir.
- id: 210
  category: vehicle_information
  question: 'En el Distrito de Columbia, es obligatorio encender las luces delanteras
    siempre que use los limpiaparabrisas debido a:'
  choices:
    A: Lluvia, aguanieve o nieve
    B: Limpiar el parabrisas
    C: Solo polvo denso
    D: Solo cuando se conduce por autopistas
  answer: A
  explanation: La ley de DC exige que los conductores usen las luces delanteras siempre
    que los limpiaparabrisas estén en uso debido a precipitaciones como lluvia, aguanieve
    o nieve.
- id: 211
  category: signs_and_signals
  question: ¿A menos que se indique lo contrario, cuál es el límite de velocidad predeterminado
    en todas las calles del Distrito de Columbia?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: A partir de junio de 2020, el Distrito de Columbia redujo el límite
    de velocidad predeterminado de 25 mph a 20 mph en todas las calles y corredores
    locales para mejorar la seguridad de los peatones.
- id: 212
  category: signs_and_signals
  question: En el Distrito de Columbia, ¿qué significa una señal de 'No Standing'
    (Prohibido permanecer estacionado)?
  choices:
    A: Puede detenerse el tiempo suficiente para recoger o dejar pasajeros, pero no
      para cargar o descargar mercancía.
    B: Puede estacionar su vehículo siempre que el motor esté en marcha.
    C: No puede detenerse por ningún motivo, ni siquiera por un momento.
  answer: A
  explanation: En DC, una señal de 'No Standing' significa que puede detenerse para
    recoger o dejar pasajeros, pero no puede detenerse para cargar/descargar mercancías
    ni dejar el vehículo desatendido.
- id: 213
  category: signs_and_signals
  question: 'Al acercarse a una intersección con la señal ''Don''t Block the Box''
    (No bloquee el recuadro) en DC, no debe ingresar a la intersección a menos que:'
  choices:
    A: El semáforo esté en verde.
    B: Esté girando a la derecha.
    C: Haya suficiente espacio para despejar completamente la intersección del otro
      lado.
    D: Esté conduciendo un vehículo de emergencia.
  answer: C
  explanation: La regla 'Don't Block the Box' de DC prohíbe a los conductores ingresar
    a una intersección a menos que haya suficiente espacio en el lado opuesto para
    que su vehículo pase sin bloquear el tráfico transversal.
- id: 214
  category: signs_and_signals
  question: 'En el Distrito de Columbia, una señal de ''X'' roja fija sobre un carril
    de tráfico significa:'
  choices:
    A: El carril está a punto de cambiar de dirección.
    B: Debe circular con precaución por este carril.
    C: No se le permite utilizar este carril.
    D: El carril está reservado únicamente para vehículos de emergencia.
  answer: C
  explanation: Una 'X' roja fija en un sistema de carriles reversibles, común en calles
    de DC como Connecticut Avenue, indica que el carril está cerrado al tráfico que
    se mueve en su dirección.
- id: 215
  category: signs_and_signals
  question: ¿Cuál es el significado de una luz amarilla intermitente en una intersección
    en DC?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Reducir la velocidad y proceder con precaución.
    C: La luz está a punto de cambiar a rojo.
    D: Ceder el paso a todo el tráfico, incluso si usted tiene el derecho de paso.
  answer: B
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y estar especialmente alerta al cruzar la intersección.
- id: 216
  category: signs_and_signals
  question: En DC, ¿cuándo puede girar legalmente a la izquierda con luz roja?
  choices:
    A: Nunca.
    B: Solo cuando se gira desde una calle de un solo sentido hacia otra calle de
      un solo sentido.
    C: Solo si no hay una señal de 'No Turn on Red' (Prohibido girar en rojo).
    D: En cualquier momento que la intersección esté despejada.
  answer: B
  explanation: Según la ley de DC, se permite un giro a la izquierda en rojo solo
    cuando se gira desde una calle de un solo sentido hacia otra calle de un solo
    sentido, siempre que se detenga primero y ceda el paso a los peatones y al resto
    del tráfico.
- id: 217
  category: signs_and_signals
  question: ¿Qué indican las marcas en el pavimento pintadas de rojo en un carril
    de tráfico en el Distrito de Columbia?
  choices:
    A: El carril es solo para vehículos de emergencia.
    B: El carril es un carril expreso de alta velocidad.
    C: El carril está reservado solo para autobuses.
    D: El carril es una zona solo para peatones.
  answer: C
  explanation: DC utiliza el pavimento de color rojo para designar los carriles 'Bus
    Only' (Solo para autobuses) con el fin de mejorar la eficiencia y visibilidad
    del transporte público.
- id: 218
  category: signs_and_signals
  question: Cuando vea una señal 'HAWK' (Cruce peatonal activado de alta intensidad)
    con dos luces rojas fijas en la parte superior, ¿qué debe hacer?
  choices:
    A: Reducir la velocidad y prepararse para detenerse.
    B: Detenerse y permanecer detenido hasta que las luces se apaguen.
    C: Detenerse y luego proceder si el cruce peatonal está despejado.
    D: Tratarlo como una parada de cuatro vías.
  answer: B
  explanation: Cuando la señal HAWK muestra dos luces rojas fijas, los conductores
    deben detenerse y permanecer detenidos mientras los peatones cruzan. Cuando las
    luces parpadean en rojo, los conductores deben detenerse pero pueden continuar
    si el cruce está despejado.
- id: 219
  category: signs_and_signals
  question: 'En DC, una señal de ''No Stopping'' (Prohibido detenerse) significa:'
  choices:
    A: Puede detenerse para recoger pasajeros.
    B: Puede detenerse para descargar víveres.
    C: No puede detenerse por ningún motivo, incluyendo recoger o dejar pasajeros.
    D: Puede detenerse solo si sus luces de emergencia están encendidas.
  answer: C
  explanation: Una señal de 'No Stopping' es la más restrictiva; significa que no
    puede detenerse por ningún motivo, ni siquiera momentáneamente para dejar a un
    pasajero.
- id: 220
  category: signs_and_signals
  question: ¿Qué indica una marca de pavimento 'Sharrow' (un símbolo de bicicleta
    con dos galones arriba)?
  choices:
    A: El carril es solo para bicicletas.
    B: Las bicicletas deben permanecer en la acera.
    C: El carril es compartido tanto por vehículos motorizados como por bicicletas.
    D: Los vehículos motorizados tienen prohibido circular por este carril.
  answer: C
  explanation: Las marcas de carril compartido (Sharrows) se utilizan en DC para indicar
    que el carril es demasiado estrecho para que un automóvil y una bicicleta circulen
    de forma segura uno al lado del otro, por lo que los ciclistas pueden usar el
    carril completo.
- id: 221
  category: signs_and_signals
  question: 'Para indicar un giro a la derecha utilizando señales manuales, un conductor
    debe:'
  choices:
    A: Extender el brazo izquierdo hacia afuera y apuntar hacia arriba.
    B: Extender el brazo izquierdo recto hacia afuera.
    C: Extender el brazo izquierdo hacia afuera y apuntar hacia abajo.
    D: Extender el brazo derecho recto hacia afuera.
  answer: A
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido fuera de la ventana y doblado hacia arriba a la altura del codo.
- id: 222
  category: signs_and_signals
  question: 'Una línea blanca continua pintada a través de una carretera en una intersección
    se conoce como:'
  choices:
    A: Línea de cruce peatonal.
    B: Línea de ceda el paso.
    C: Línea de parada.
    D: Carril para bicicletas.
  answer: C
  explanation: Una línea blanca continua a través de un carril en una intersección
    es una línea de parada, que indica el punto donde un vehículo debe detenerse ante
    una señal de alto o una luz roja.
- id: 223
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico amarilla intermitente a un conductor
    en el Distrito de Columbia?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: La luz está a punto de cambiar a rojo
    C: Reducir la velocidad y avanzar con precaución
    D: Ceder el paso a todo el tráfico que venga por la derecha
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y avanzar con precaución. No es necesario detenerse, pero debe estar alerta a
    los peligros.
- id: 224
  category: signs_and_signals
  question: En DC, ¿qué indican normalmente las marcas en el pavimento pintadas de
    rojo?
  choices:
    A: Carriles para vehículos de alta ocupación (HOV)
    B: Zonas de prohibido estacionar
    C: Carriles exclusivos para autobuses
    D: Carriles solo para vehículos de emergencia
  answer: C
  explanation: El Distrito de Columbia utiliza el pavimento pintado de rojo para designar
    carriles exclusivos para autobuses. Los conductores no deben entrar en estos carriles
    excepto para realizar un giro donde esté permitido.
- id: 225
  category: signs_and_signals
  question: Cuando un semáforo está completamente apagado debido a un corte de energía
    en DC, ¿cómo debe tratar la intersección?
  choices:
    A: Como una parada de cuatro vías (four-way stop)
    B: Ceder el paso al conductor de la derecha
    C: Mantener la velocidad y avanzar con cuidado
    D: Esperar a que llegue un oficial de policía
  answer: A
  explanation: Si un semáforo no funciona o está apagado, la ley de DC exige que trate
    la intersección como una parada de cuatro vías (four-way stop).
- id: 226
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal o marca en el pavimento de 'Don't
    Block the Box' (No bloquee el cuadro) en el Distrito?
  choices:
    A: Debe detenerse antes del cruce peatonal
    B: No puede entrar en una intersección a menos que pueda despejarla por completo
      sin detenerse
    C: No se permite estacionar en la intersección
    D: Solo los vehículos comerciales pueden entrar en el cuadro
  answer: B
  explanation: La regla 'Don't Block the Box' de DC significa que los conductores
    no pueden entrar en una intersección si el tráfico está congestionado al otro
    lado, lo que les impediría despejar la intersección. Bloquear el cuadro puede
    resultar en una multa y puntos.
- id: 227
  category: signs_and_signals
  question: 'En DC, una marca de ''sharrow'' (un símbolo de bicicleta con dos galones)
    en el pavimento indica:'
  choices:
    A: Un carril reservado exclusivamente para bicicletas
    B: Un carril donde las bicicletas y los vehículos motorizados comparten la vía
    C: Una zona solo para peatones
    D: Un carril de ciclismo de alta velocidad
  answer: B
  explanation: Un 'sharrow' indica una marca de carril compartido, alertando a los
    automovilistas que los ciclistas pueden ocupar el carril completo y ayudando a
    los ciclistas a posicionarse de manera segura.
- id: 228
  category: signs_and_signals
  question: Si se encuentra frente a una señal de X amarilla fija sobre un carril
    reversible en DC, ¿qué debe hacer?
  choices:
    A: Continuar conduciendo por ese carril
    B: Aumentar la velocidad para despejar el carril
    C: Salir de ese carril tan pronto como sea seguro hacerlo
    D: Detenerse inmediatamente
  answer: C
  explanation: Una X amarilla fija sobre un carril reversible indica que la señal
    del carril está a punto de cambiar a una X roja, y debe salir de ese carril de
    manera segura.
- id: 229
  category: signs_and_signals
  question: En DC, ¿qué indican los 'dientes de tiburón' (una línea de triángulos)
    pintados a través de un carril?
  choices:
    A: Un reductor de velocidad (speed bump) más adelante
    B: El inicio de un carril para bicicletas
    C: Una línea de ceda el paso donde debe detenerse para peatones o tráfico
    D: Una zona de no rebasar
  answer: C
  explanation: Los dientes de tiburón son líneas de ceda el paso. Indican el punto
    donde un vehículo debe ceder el paso a los peatones u otro tráfico.
- id: 230
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla circular fija?
  choices:
    A: Debe detenerse si puede hacerlo de manera segura
    B: Tiene el derecho de paso para girar
    C: La luz está cambiando a verde
    D: Los peatones tienen el derecho de paso
  answer: A
  explanation: Una luz amarilla fija significa que la señal verde está terminando.
    Debe detenerse si puede hacerlo de manera segura; si ya se encuentra en la intersección,
    debe continuar cruzando.
- id: 231
  category: signs_and_signals
  question: 'Una señal HAWK (Cruce Activado de Alta Intensidad) se utiliza en DC para:'
  choices:
    A: Controlar el tráfico de alta velocidad en autopistas
    B: Ayudar a los peatones a cruzar calles concurridas de manera segura
    C: Señalizar la entrada a un túnel
    D: Regular los carriles exclusivos para autobuses
  answer: B
  explanation: Las señales HAWK, o balizas híbridas para peatones, se utilizan en
    DC para ayudar a los peatones a cruzar a mitad de cuadra o en intersecciones concurridas
    deteniendo el tráfico vehicular.
- id: 232
  category: signs_and_signals
  question: 'Cuando un conductor extiende su brazo izquierdo recto hacia afuera de
    la ventana, está señalizando un:'
  choices:
    A: Giro a la derecha
    B: Parada
    C: Giro a la izquierda
    D: Giro en U
  answer: C
  explanation: Extender el brazo izquierdo recto hacia afuera de la ventana es la
    señal manual estándar para un giro a la izquierda.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 233
- image: yield.png
  category: signs_and_signals
  question: ¿Qué requiere que haga esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Proceder sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 234
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 235
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 236
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 237
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 238
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 239
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 240
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín de color blanco y negro que dice NO
    PASSING ZONE (zona de no rebasar) significa que no se le permite rebasar a otros
    vehículos en esta área. Marca el comienzo de una zona de no rebasar.
  id: 241
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de KEEP RIGHT (manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 242
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 243
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 244
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 245
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 246
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (rotonda) más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras 'R' es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 247
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 248
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 249
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa giro a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 250
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero en un sentido y luego en el otro.
  id: 251
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 252
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 253
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción en el ancho de la vía y ajuste su posición
    en el carril.
  id: 254
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 255
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico en ambos
    sentidos.
  id: 256
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 257
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 258
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 259
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Prepárese para detenerse
    si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde el semáforo
    puede no ser visible desde la distancia.
  id: 260
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 261
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 262
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 263
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 264
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse o dejar el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 265
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 266
