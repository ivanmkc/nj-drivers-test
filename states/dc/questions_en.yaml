metadata:
  source: 2025 District of Columbia Driver's Manual
  total_questions: 262
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: Under the District of Columbia GRAD program, what is the minimum age to
    apply for a learner's permit?
  choices:
    A: 15 years old
    B: 15 and 6 months old
    C: 16 years old
    D: 17 years old
  answer: C
  explanation: In the District of Columbia, an applicant must be at least 16 years
    old to be eligible for a learner's permit under the Graduated Licensing Program
    (GRAD).
- id: 2
  category: license_system
  question: A driver with a DC learner's permit is restricted from driving during
    which of the following nighttime hours?
  choices:
    A: 10:00 PM to 5:00 AM
    B: 9:00 PM to 6:00 AM
    C: 11:00 PM to 6:00 AM
    D: Midnight to 6:00 AM
  answer: B
  explanation: DC learner's permit holders are prohibited from operating a motor vehicle
    between the hours of 9:00 PM and 6:00 AM daily.
- id: 3
  category: license_system
  question: How long must a driver hold a DC learner's permit before they are eligible
    to apply for a provisional license?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Under the GRAD program, permit holders must maintain a valid learner's
    permit for at least 6 months without any point-earning violations before moving
    to the provisional stage.
- id: 4
  category: license_system
  question: For a provisional license holder in DC, what are the restricted driving
    hours on Friday and Saturday nights?
  choices:
    A: 9:00 PM to 6:00 AM
    B: 11:00 PM to 6:00 AM
    C: 12:00 AM (Midnight) to 6:00 AM
    D: 1:00 AM to 5:00 AM
  answer: C
  explanation: Provisional license holders in DC cannot drive between 12:00 AM and
    6:00 AM on Friday and Saturday nights (technically Saturday and Sunday mornings).
- id: 5
  category: license_system
  question: In the District of Columbia, your driver's license will be revoked if
    you accumulate how many points on your driving record?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: The DC DMV will issue an Order of Revocation if a driver accumulates
    12 or more points on their driving record.
- id: 6
  category: license_system
  question: At what point level will a driver's license be suspended (but not yet
    revoked) in the District of Columbia?
  choices:
    A: 6 to 7 points
    B: 8 to 9 points
    C: 10 to 11 points
    D: 12 points
  answer: C
  explanation: In DC, accumulating 10 or 11 points results in a license suspension,
    while 12 points results in a mandatory revocation.
- id: 7
  category: license_system
  question: Who must accompany a DC learner's permit holder while they are operating
    a vehicle?
  choices:
    A: Any person 18 years or older
    B: A licensed driver 21 years or older in the front seat
    C: A licensed driver 25 years or older in the back seat
    D: A parent or guardian regardless of license status
  answer: B
  explanation: A learner's permit holder must be accompanied by a person who is at
    least 21 years old, has a valid full driver's license, and is seated next to the
    driver in the front passenger seat.
- id: 8
  category: license_system
  question: 'Under the GRAD program, a provisional license holder may not transport
    any passengers except:'
  choices:
    A: Friends under age 18
    B: Siblings and one person 21 years or older
    C: Up to three non-family members
    D: Only the driver's parents
  answer: B
  explanation: Provisional license holders may only transport siblings and no more
    than one other passenger who is at least 21 years old and has a valid full license.
- id: 9
  category: license_system
  question: To meet the District of Columbia's vision requirements for a driver's
    license, an applicant must have at least what visual acuity?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: DC DMV requires applicants to have at least 20/40 vision in one or
    both eyes (with or without corrective lenses).
- id: 10
  category: license_system
  question: If you change your address within the District of Columbia, you must notify
    the DMV within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: DC law requires residents to notify the DMV of an address change within
    30 days of the move.
- id: 11
  category: license_system
  question: Which of the following is a requirement for a driver with a provisional
    license to graduate to a full driver's license?
  choices:
    A: The driver must be at least 17 years old
    B: The driver must have held the provisional license for at least 6 months
    C: The driver must be at least 18 years old
    D: The driver must complete a second road test
  answer: C
  explanation: In DC, a driver must be at least 18 years old and have held a provisional
    license for at least 6 months without any point-earning violations to graduate
    to a full license.
- id: 12
  category: license_system
  question: In DC, using a mobile phone while driving (even with a hands-free device)
    is strictly prohibited for which group?
  choices:
    A: Drivers over age 65
    B: All commercial drivers
    C: Learner's permit and provisional license holders
    D: Only drivers with more than 6 points
  answer: C
  explanation: Under the GRAD program, drivers with a learner's permit or provisional
    license are prohibited from using any mobile phone or other electronic device
    while driving, including hands-free devices.
- id: 13
  category: license_system
  question: When applying for a DC driver's license, how many documents must you provide
    to prove DC residency?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: To obtain a DC REAL ID driver license, you must provide two documents
    that prove your District of Columbia residency.
- id: 14
  category: license_system
  question: What is the minimum age to obtain a Full Driver's License in the District
    of Columbia?
  choices:
    A: 17 years old
    B: 18 years old
    C: 21 years old
    D: 16 and 6 months old
  answer: B
  explanation: The minimum age for a Full Driver's License in DC is 18 years old,
    provided the driver has completed the GRAD program requirements.
- id: 15
  category: license_system
  question: If a DC driver is convicted of 'reckless driving,' how many points are
    assessed to their driving record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: According to the DC DMV point system, reckless driving is a major violation
    that results in 6 points being added to the driver's record.
- id: 16
  category: license_system
  question: In the District of Columbia, what are the minimum liability insurance
    coverage requirements for a registered motor vehicle?
  choices:
    A: $10,000/$20,000/$5,000
    B: $20,000/$40,000/$10,000
    C: $25,000/$50,000/$10,000
    D: $50,000/$100,000/$25,000
  answer: C
  explanation: DC law requires minimum liability insurance of $25,000 for injury/death
    of one person, $50,000 for injury/death of more than one person, and $10,000 for
    property damage.
- id: 17
  category: license_system
  question: New residents of the District of Columbia must obtain a DC driver's license
    and register their vehicle within how many days of moving to the District?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to the DC DMV, new residents have 30 days to convert their
    out-of-state driver's license and vehicle registration to the District of Columbia.
- id: 18
  category: license_system
  question: How long is a standard District of Columbia driver's license valid before
    it must be renewed?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: A standard DC driver's license is typically issued for a period of
    8 years.
- id: 19
  category: license_system
  question: Under the GRAD program, how many hours of supervised driving must a learner's
    permit holder complete and certify before applying for a provisional license?
  choices:
    A: 20 hours (5 at night)
    B: 40 hours (10 at night)
    C: 50 hours (15 at night)
    D: 60 hours (20 at night)
  answer: B
  explanation: DC requires permit holders to complete 40 hours of supervised driving,
    at least 10 of which must be at night, certified by a licensed driver 21 years
    or older.
- id: 20
  category: license_system
  question: In the District of Columbia, for how long do points remain on your driving
    record after a traffic conviction?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: Points assigned to a DC driving record remain for a period of two years
    from the date of the conviction.
- id: 21
  category: license_system
  question: How many 'Safe Driving' points can a DC driver earn for each calendar
    year they drive without a moving violation?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: A
  explanation: DC DMV awards one 'Safe Driving' point for each calendar year of driving
    without a moving violation, up to a maximum of five points.
- id: 22
  category: license_system
  question: Which of the following insurance coverages is MANDATORY for all vehicles
    registered in the District of Columbia?
  choices:
    A: Collision coverage
    B: Comprehensive coverage
    C: Uninsured Motorist coverage
    D: Towing and Labor coverage
  answer: C
  explanation: DC law requires all registered vehicles to carry Liability and Uninsured
    Motorist coverage.
- id: 23
  category: license_system
  question: What is the penalty for a first-time offense of operating a vehicle in
    DC without valid insurance?
  choices:
    A: A verbal warning
    B: A fine of $150 to $1,000
    C: Mandatory 30-day jail sentence
    D: Permanent loss of driving privileges
  answer: B
  explanation: Operating a vehicle without insurance in DC carries a fine ranging
    from $150 to $1,000 for the first offense.
- id: 24
  category: license_system
  question: When applying for a REAL ID license in DC, which of the following is an
    acceptable proof of Social Security number?
  choices:
    A: A photocopy of a Social Security card
    B: A birth certificate
    C: A W-2 form with the full SSN displayed
    D: An insurance policy document
  answer: C
  explanation: DC DMV requires original documents for SSN proof, such as an original
    Social Security card, a W-2 form, or a pay stub showing the full SSN.
- id: 25
  category: license_system
  question: At what age do the nighttime driving restrictions of the GRAD program
    no longer apply to a DC driver?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: The GRAD program restrictions, including nighttime driving limits,
    apply to all drivers under the age of 21.
- id: 26
  category: license_system
  question: 'In DC, a provisional license holder may drive during restricted nighttime
    hours ONLY if they are:'
  choices:
    A: Driving to or from a sponsored school activity
    B: Accompanied by a parent or guardian
    C: Driving to or from their place of employment
    D: All of the above
  answer: D
  explanation: Provisional license holders may drive during restricted hours if traveling
    to/from work, a school activity, or if accompanied by a licensed driver 21+.
- id: 27
  category: license_system
  question: If your DC driver's license is lost or stolen, what is the current fee
    for a duplicate license?
  choices:
    A: $7
    B: $20
    C: $44
    D: $75
  answer: B
  explanation: The DC DMV charges a $20 fee for a duplicate driver's license.
- id: 28
  category: driver_testing
  question: In the District of Columbia, what is the legal blood alcohol concentration
    (BAC) limit for drivers age 21 or older?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In DC, it is illegal for any person 21 years of age or older to operate
    a motor vehicle with a BAC of 0.08% or higher.
- id: 29
  category: driver_testing
  question: Under DC's 'Zero Tolerance' law, what is the BAC limit for drivers under
    the age of 21?
  choices:
    A: 0.00% (Any measurable amount)
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: The District of Columbia has a Zero Tolerance law for minors; it is
    illegal for anyone under 21 to drive with any measurable amount of alcohol in
    their system.
- id: 30
  category: driver_testing
  question: When parking your vehicle on a DC street, you must not park within how
    many feet of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: According to DC parking regulations, you are prohibited from parking
    within 10 feet of a fire hydrant.
- id: 31
  category: driver_testing
  question: In the District of Columbia, you are prohibited from parking within how
    many feet of a stop sign or 'Yield' sign?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: D
  explanation: DC law states that you may not park within 25 feet of the approach
    to any stop sign, flashing signal, or yield sign located at the side of the roadway.
- id: 32
  category: driver_testing
  question: When a school bus has stopped on a roadway with its red lights flashing
    and stop arm extended, DC law requires which of the following?
  choices:
    A: Only traffic following the bus must stop
    B: Traffic in both directions must stop, unless separated by a median
    C: Traffic in both directions must stop, even if there is a median
    D: Traffic may pass slowly at 5 mph
  answer: B
  explanation: In DC, motorists must stop from both directions when a school bus is
    flashing red lights, unless the vehicle is on the opposite side of a divided highway
    with a physical median.
- id: 33
  category: driver_testing
  question: If a DC driver refuses to submit to a chemical test for alcohol or drugs
    (Implied Consent), what is the mandatory driver license revocation period for
    a first offense?
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Under DC's Implied Consent law, if you refuse to take a chemical test,
    your license will be revoked for a period of 12 months (1 year).
- id: 34
  category: driver_testing
  question: 'When passing a bicyclist in the District of Columbia, motorists must
    maintain a minimum safe distance of at least:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: DC law requires motorists to allow at least 3 feet of space when overtaking
    or passing a person riding a bicycle.
- id: 35
  category: driver_testing
  question: In DC, children under what age must be properly restrained in a child
    safety seat or booster seat?
  choices:
    A: Under 5 years old
    B: Under 6 years old
    C: Under 8 years old
    D: Under 10 years old
  answer: C
  explanation: DC law requires that any child under 8 years of age be properly seated
    in an installed infant, convertible (toddler), or booster child safety seat.
- id: 36
  category: driver_testing
  question: What is the penalty for a seat belt violation in the District of Columbia?
  choices:
    A: $25 fine and no points
    B: $50 fine and 2 points
    C: $100 fine and 3 points
    D: $200 fine and license suspension
  answer: B
  explanation: A violation of the seat belt law in DC results in a $50 fine and the
    assessment of 2 points on your driving record.
- id: 37
  category: driver_testing
  question: When performing the DC DMV road skills test, the applicant's vehicle must
    have which of the following?
  choices:
    A: A manual transmission
    B: Dual brake pedals
    C: A parking brake located between the seats (center console)
    D: A backup camera
  answer: C
  explanation: For the DC road test, the vehicle must have a hand-controlled parking
    brake located between the driver and passenger seats so the examiner can reach
    it in an emergency.
- id: 38
  category: driver_testing
  question: 'In the District of Columbia, you must use your headlights when visibility
    is reduced to less than:'
  choices:
    A: 200 feet
    B: 400 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: DC law requires the use of headlights when there is not sufficient
    light to clearly see persons or vehicles at a distance of 500 feet.
- id: 39
  category: driver_testing
  question: How many points are assessed on a DC driving record for 'Failing to stop
    for a school bus'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Failing to stop for a school bus with its red lights activated in the
    District of Columbia results in 4 points being added to your driving record.
- id: 40
  category: driver_testing
  question: In DC, you must dim your high beam headlights when you are within how
    many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: You must dim your high beams when an oncoming vehicle is within 500
    feet to avoid blinding the other driver.
- id: 41
  category: driver_testing
  question: 'If you are involved in a traffic accident in DC that results in property
    damage of $250 or more, you must:'
  choices:
    A: Wait 48 hours before reporting
    B: Report the accident to the police immediately
    C: Only report if someone is injured
    D: Leave a note and drive away
  answer: B
  explanation: In the District of Columbia, any accident involving property damage,
    regardless of the amount, or personal injury must be reported to the Metropolitan
    Police Department immediately.
- id: 42
  category: driver_testing
  question: In the District of Columbia, what is the default speed limit on local
    streets and laneways unless otherwise posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: As of 2020, the default speed limit for local streets in the District
    of Columbia is 20 mph to improve pedestrian and cyclist safety.
- id: 43
  category: driver_testing
  question: If you fail the DC DMV road skills test, how long must you wait before
    you are eligible to take the test again for the first time?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 7 days
  answer: C
  explanation: If you fail the road skills test in DC, you must wait at least 72 hours
    before you are eligible to retake it.
- id: 44
  category: driver_testing
  question: What is the minimum field of vision required to pass the DC DMV vision
    screening without restrictions?
  choices:
    A: 110 degrees
    B: 120 degrees
    C: 130 degrees
    D: 140 degrees
  answer: D
  explanation: To pass the DC DMV vision test, applicants must have at least 140 degrees
    of continuous peripheral field of vision.
- id: 45
  category: driver_testing
  question: If you fail the DC DMV knowledge (written) test, what is the mandatory
    waiting period before you can retake it?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 10 days
  answer: B
  explanation: If you fail the DC DMV knowledge test, you must wait 3 days before
    you are allowed to take the test again.
- id: 46
  category: driver_testing
  question: What is the maximum fine for a first-offense DUI (Driving Under the Influence)
    conviction in the District of Columbia?
  choices:
    A: Up to $500
    B: Up to $1,000
    C: Up to $2,500
    D: Up to $5,000
  answer: B
  explanation: A first-offense DUI conviction in DC can result in a fine of up to
    $1,000 and/or up to 90 days in jail.
- id: 47
  category: driver_testing
  question: In DC, you may not park within how many feet of the entrance to an alley,
    driveway, or private road?
  choices:
    A: 2 feet
    B: 5 feet
    C: 10 feet
    D: 15 feet
  answer: B
  explanation: DC law prohibits parking within 5 feet of any alley, driveway, or private
    road entrance.
- id: 48
  category: driver_testing
  question: How many points are assessed for 'Leaving the scene of an accident where
    property damage occurred' in DC?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Leaving the scene of an accident involving property damage results
    in 8 points on your DC driving record.
- id: 49
  category: driver_responsibility
  question: 'In the District of Columbia, if you are involved in a traffic accident
    that results in property damage only, you must report the accident to the police
    if the damage is estimated to be at least:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: According to the DC DMV, any accident involving property damage of
    $250 or more must be reported to the Metropolitan Police Department.
- id: 50
  category: driver_responsibility
  question: For a standard personal vehicle registered in the District of Columbia,
    how often is a vehicle emissions inspection required?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 4 years
    D: Only when the vehicle is sold
  answer: B
  explanation: DC law requires that personal vehicles undergo an emissions inspection
    every two years.
- id: 51
  category: driver_responsibility
  question: 'A DC driver may be eligible to have 2 points removed from their driving
    record by completing an approved online traffic safety course once every:'
  choices:
    A: 12 months
    B: 24 months
    C: 36 months
    D: 5 years
  answer: B
  explanation: The DC DMV allows drivers to receive a 2-point reduction for the successful
    completion of an approved online traffic safety course once every 24 months.
- id: 52
  category: driver_responsibility
  question: What is the maximum fine for littering from a vehicle onto the public
    routes of the District of Columbia?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Under DC law, the fine for littering from a vehicle can be as high
    as $1,000.
- id: 53
  category: driver_responsibility
  question: In the District of Columbia, it is illegal to park your vehicle within
    how many feet of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: DC parking regulations state that you may not park within 10 feet of
    a fire hydrant.
- id: 54
  category: driver_responsibility
  question: Unless otherwise permitted, you may not park a vehicle within how many
    feet of the intersection of any two streets in DC?
  choices:
    A: 10 feet
    B: 20 feet
    C: 30 feet
    D: 40 feet
  answer: D
  explanation: In the District of Columbia, parking is prohibited within 40 feet of
    the intersection of any two streets.
- id: 55
  category: driver_responsibility
  question: In the District of Columbia, children must be properly secured in a child
    safety seat (infant, toddler, or booster) until they reach what age?
  choices:
    A: Under 5 years old
    B: Under 6 years old
    C: Under 8 years old
    D: Under 10 years old
  answer: C
  explanation: DC law requires all children under 8 years of age to be properly seated
    in an installed infant, convertible (toddler), or booster child safety seat.
- id: 56
  category: driver_responsibility
  question: If a passenger 16 years of age or older is caught not wearing a seatbelt
    in a vehicle in DC, who is legally responsible for paying the fine?
  choices:
    A: The driver only
    B: The passenger only
    C: Both the driver and the passenger
    D: The owner of the vehicle
  answer: B
  explanation: In DC, passengers 16 years of age and older are strictly liable for
    their own seatbelt violations and will receive the citation.
- id: 57
  category: driver_responsibility
  question: If you cancel your vehicle's insurance policy in the District of Columbia,
    what must you do immediately with your vehicle's license plates (tags)?
  choices:
    A: Keep them until you get new insurance
    B: Destroy them
    C: Return them to the DC DMV
    D: Transfer them to another vehicle you own
  answer: C
  explanation: If your insurance is canceled or expires, you must immediately return
    your vehicle tags to the DC DMV to avoid fines for lack of insurance.
- id: 58
  category: driver_responsibility
  question: How many points are assessed on a DC driving record for a conviction of
    failing to comply with High Occupancy Vehicle (HOV) restrictions?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: According to the DC DMV Point System, failure to comply with HOV restrictions
    results in 3 points being added to the driver's record.
- id: 59
  category: driver_responsibility
  question: Under the District of Columbia's point system, how many points are assessed
    for a conviction of 'Aggressive Driving'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: A
  explanation: Aggressive driving is specifically listed in the DC DMV Point System
    as a 2-point violation.
- id: 60
  category: driver_responsibility
  question: 'Under DC''s ''Zero Tolerance'' law, a driver under the age of 21 is considered
    to be driving under the influence if their Blood Alcohol Concentration (BAC) is:'
  choices:
    A: 0.01% or higher
    B: 0.02% or higher
    C: 0.05% or higher
    D: Any measurable amount
  answer: D
  explanation: DC has a Zero Tolerance policy for drivers under 21, meaning it is
    illegal to operate a vehicle with any measurable amount of alcohol in the system.
- id: 61
  category: driver_responsibility
  question: 'If you are involved in a motor vehicle accident in the District of Columbia
    that results in property damage, injury, or death, you are required by law to:'
  choices:
    A: Wait 24 hours before reporting it to the police
    B: Stop immediately and provide your information to the other parties involved
    C: Only stop if the damage appears to be over $1,000
    D: Leave a note and drive to the nearest DMV office
  answer: B
  explanation: In DC, the law requires any driver involved in an accident resulting
    in injury, death, or property damage to stop immediately and provide their name,
    address, and vehicle registration information.
- id: 62
  category: driver_responsibility
  question: In the District of Columbia, if your vehicle's insurance coverage lapses,
    the DMV will assess a fine of how much for the first 30 days of the lapse?
  choices:
    A: $2 per day
    B: $5 per day
    C: $7 per day
    D: $10 per day
  answer: C
  explanation: DC DMV charges an insurance lapse fee of $7 per day for the first 30
    days, which increases to $15 per day thereafter, up to a maximum limit.
- id: 63
  category: driver_responsibility
  question: When you sell or dispose of a vehicle registered in DC, what must you
    do with the license plates to avoid insurance lapse fees?
  choices:
    A: Keep them for your next vehicle
    B: Destroy them and throw them away
    C: Return them to the DC DMV and obtain a cancellation receipt
    D: Give them to the new owner of the vehicle
  answer: C
  explanation: To properly cancel your registration and avoid fines for a lack of
    insurance, you must return your DC license plates to the DMV and receive a tag
    return receipt.
- id: 64
  category: driver_responsibility
  question: 'If you are involved in an accident in DC where the police do not file
    a report, you are required to file a ''Citizen Report'' with the DMV if the property
    damage is at least:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: According to the DC Driver Manual, if the police do not investigate
    an accident, a driver must file a report if there is property damage of $250 or
    more.
- id: 65
  category: driver_responsibility
  question: How many license plates are issued by the District of Columbia for standard
    passenger vehicles, and where must they be displayed?
  choices:
    A: One plate, displayed on the rear only
    B: One plate, displayed on the front only
    C: Two plates, one on the front and one on the rear
    D: Two plates, both on the rear bumper
  answer: C
  explanation: 'The District of Columbia requires most motor vehicles to display two
    license plates: one on the front and one on the rear.'
- id: 66
  category: driver_responsibility
  question: In the District of Columbia, where must the vehicle's valid inspection
    sticker be placed?
  choices:
    A: On the rear bumper
    B: On the rear license plate
    C: In the lower left corner of the windshield
    D: In the lower right corner of the windshield
  answer: C
  explanation: DC law requires the vehicle inspection sticker to be displayed in the
    lower left corner of the windshield (from the driver's perspective).
- id: 67
  category: driver_responsibility
  question: If you are a DC resident and purchase a vehicle from a private owner,
    you can obtain a temporary registration (hard tag) that is valid for how many
    days?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: C
  explanation: The DC DMV issues temporary registration 'hard tags' for 45 days to
    allow residents time to complete the full registration and inspection process.
- id: 68
  category: driver_responsibility
  question: Which of the following is a requirement for registering a vehicle in the
    District of Columbia?
  choices:
    A: The vehicle must have a safety inspection every year
    B: The owner must have a valid DC driver's license or DC identification card
    C: The owner must prove they have a garage for the vehicle
    D: The vehicle must be less than 10 years old
  answer: B
  explanation: To register a vehicle in DC, the owner must provide proof of DC residency
    and have a valid DC DMV-issued credential (license or ID).
- id: 69
  category: driver_responsibility
  question: 'If a DC driver is involved in an accident with an unattended vehicle,
    and the owner cannot be found, the driver must:'
  choices:
    A: Wait for 2 hours for the owner to return
    B: Leave a written notice with their name, address, and information in a conspicuous
      place
    C: Drive away if the damage is minor
    D: Only report it if the other vehicle is a government car
  answer: B
  explanation: If you hit an unattended vehicle in DC, you must leave a note with
    your contact information and insurance details, and you must also report the accident
    to the police.
- id: 70
  category: driver_responsibility
  question: 'When applying for a DC vehicle registration, the insurance policy must
    be issued by a company that is:'
  choices:
    A: Based in any of the 50 US states
    B: Authorized to do business in the District of Columbia
    C: Exclusively a DC-based insurance company
    D: A federal government insurance provider
  answer: B
  explanation: DC law requires that your motor vehicle insurance be provided by a
    company authorized to sell insurance in the District of Columbia.
- id: 71
  category: driver_responsibility
  question: In the District of Columbia, what happens to your vehicle registration
    if your insurance is cancelled and you do not return your tags?
  choices:
    A: The registration remains valid for 6 months
    B: The registration is automatically suspended
    C: The registration is transferred to the insurance company
    D: Nothing happens until you try to renew the registration
  answer: B
  explanation: If the DC DMV is notified that insurance has been cancelled and the
    tags have not been returned, the vehicle's registration will be suspended.
- id: 72
  category: driver_responsibility
  question: Which of the following documents must be carried in the vehicle at all
    times while operating it in the District of Columbia?
  choices:
    A: The vehicle's title
    B: The owner's birth certificate
    C: A valid registration card and proof of insurance
    D: The original sales contract
  answer: C
  explanation: DC law requires drivers to have a valid registration card and current
    proof of insurance in the vehicle whenever it is being operated.
- id: 73
  category: safe_driving_rules
  question: When parking your vehicle in DC, what is the minimum distance you must
    maintain from a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: According to DC parking regulations (DCMR Title 18, Section 2405),
    you may not park within 10 feet of a fire hydrant.
- id: 74
  category: safe_driving_rules
  question: When parking near an intersection in DC, you must be at least how many
    feet away from the nearest crosswalk?
  choices:
    A: 10 feet
    B: 20 feet
    C: 30 feet
    D: 40 feet
  answer: B
  explanation: In the District of Columbia, you are prohibited from parking within
    20 feet of an intersection or a crosswalk at an intersection.
- id: 75
  category: safe_driving_rules
  question: What is the maximum speed limit in a District of Columbia school zone
    when children are present or when a warning light is flashing?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The speed limit in DC school zones is 15 mph during restricted hours
    or when signs/lights indicate the limit is in effect.
- id: 76
  category: safe_driving_rules
  question: Under DC law, when are you allowed to make a left turn on a red light?
  choices:
    A: Never
    B: Only from a one-way street onto another one-way street
    C: Only from a two-way street onto a one-way street
    D: At any intersection if no traffic is coming
  answer: B
  explanation: In the District of Columbia, a left turn on red is permitted only when
    turning from a one-way street onto another one-way street, after coming to a complete
    stop and yielding to traffic and pedestrians.
- id: 77
  category: safe_driving_rules
  question: In the District of Columbia, U-turns are strictly prohibited at which
    of the following locations?
  choices:
    A: On any street with more than two lanes
    B: Within 500 feet of a bridge
    C: At any intersection where there is a traffic light
    D: On any street during rush hour
  answer: C
  explanation: DC regulations prohibit making a U-turn at any intersection controlled
    by a traffic light or 'No U-Turn' sign.
- id: 78
  category: safe_driving_rules
  question: 'When passing a bicycle in the District of Columbia, motorists are required
    by law to maintain a minimum distance of:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: DC law requires motorists to allow a safe distance of at least 3 feet
    when overtaking and passing a person operating a bicycle.
- id: 79
  category: safe_driving_rules
  question: When driving near a DC Streetcar, which of the following is true?
  choices:
    A: You may pass a streetcar on the left at any time
    B: You may park your vehicle on the streetcar tracks if you stay inside the car
    C: You must not pass a streetcar on the left
    D: Streetcars must always yield to passenger vehicles
  answer: C
  explanation: In DC, you must not pass a streetcar on the left. Additionally, it
    is illegal to park or stop a vehicle in a way that blocks the streetcar tracks.
- id: 80
  category: safe_driving_rules
  question: In the District of Columbia, when must you dim your high-beam headlights
    when approaching an oncoming vehicle?
  choices:
    A: Within 200 feet
    B: Within 300 feet
    C: Within 500 feet
    D: Within 1,000 feet
  answer: C
  explanation: DC law requires drivers to dim their high beams when an oncoming vehicle
    is within 500 feet.
- id: 81
  category: safe_driving_rules
  question: 'If you are convicted of speeding in a designated work zone in the District
    of Columbia, the fine is:'
  choices:
    A: Reduced by half
    B: The same as a normal speeding ticket
    C: Doubled
    D: Tripled
  answer: C
  explanation: In DC, fines for moving violations, including speeding, are doubled
    when committed in a construction or work zone.
- id: 82
  category: safe_driving_rules
  question: When two vehicles reach an uncontrolled intersection in DC at the same
    time, which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver on the larger street
  answer: B
  explanation: At intersections not controlled by signs or signals, the driver of
    the vehicle on the left must yield the right-of-way to the vehicle on the right.
- id: 83
  category: safe_driving_rules
  question: In the District of Columbia, what is the maximum speed limit in a designated
    school zone during restricted hours?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The speed limit in DC school zones is 15 mph during the hours indicated
    on posted signs or while school zone warning lights are flashing.
- id: 84
  category: safe_driving_rules
  question: When parallel parking in the District of Columbia, your tires must be
    within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: DC law requires that when you park on a two-way street, you must park
    parallel to and within 12 inches of the curb.
- id: 85
  category: safe_driving_rules
  question: Under the District of Columbia's 'Zero Tolerance' law, what is the maximum
    Blood Alcohol Concentration (BAC) allowed for a driver under the age of 21?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: The District of Columbia has a Zero Tolerance policy for minors; any
    measurable amount of alcohol (0.00% BAC) in the system of a driver under 21 is
    grounds for a DUI.
- id: 86
  category: safe_driving_rules
  question: If you are convicted of speeding 11 to 15 mph over the posted speed limit
    in DC, how many points will be assessed on your driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: In the District of Columbia point system, speeding 11-15 mph over the
    limit results in 3 points being added to your driving record.
- id: 87
  category: safe_driving_rules
  question: 'In the District of Columbia, making a right turn on a red light is permitted
    EXCEPT:'
  choices:
    A: When there is a sign prohibiting it
    B: Between the hours of 7:00 AM and 6:30 PM
    C: If there are pedestrians in the far crosswalk
    D: Right turns on red are never permitted in DC
  answer: A
  explanation: In DC, you may turn right on red after coming to a complete stop and
    yielding to traffic and pedestrians, unless a sign is posted stating 'No Turn
    on Red'.
- id: 88
  category: safe_driving_rules
  question: 'When driving near the DC Streetcar on H Street or Benning Road, you must
    NOT:'
  choices:
    A: Drive in the same lane as the streetcar
    B: Park your vehicle in a way that any part of it overlaps the streetcar tracks
    C: Pass the streetcar on the left
    D: Signal before turning across the tracks
  answer: B
  explanation: It is illegal to park or stop a vehicle where it blocks the path of
    the DC Streetcar. Vehicles overlapping the white line near the tracks are subject
    to ticketing and towing.
- id: 89
  category: safe_driving_rules
  question: What is the penalty for speeding in a designated work zone in the District
    of Columbia when workers are present?
  choices:
    A: The points assessed are tripled
    B: The fine is doubled
    C: Mandatory 30-day license suspension
    D: There is no additional penalty
  answer: B
  explanation: In the District of Columbia, fines for speeding and other traffic violations
    are doubled in construction or work zones.
- id: 90
  category: safe_driving_rules
  question: Under DC's 'Move Over' law, what must you do when approaching a stationary
    emergency vehicle with flashing lights?
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk your horn
    C: Yield the right-of-way by making a lane change or slowing down if a lane change
      is unsafe
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: DC law requires drivers to shift into a lane not adjacent to the emergency
    vehicle or slow down to a safe speed if changing lanes is not possible.
- id: 91
  category: safe_driving_rules
  question: 'The District of Columbia Driver''s Manual recommends maintaining a following
    distance of at least:'
  choices:
    A: One car length
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: C
  explanation: The DC DMV recommends the 'three-second rule' to maintain a safe following
    distance behind the vehicle in front of you.
- id: 92
  category: defensive_driving
  question: According to the District of Columbia Driver Manual, what is the recommended
    following distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: One car length for every 10 mph
    B: Two to four seconds
    C: Exactly 50 feet
    D: One second
  answer: B
  explanation: The DC DMV recommends a following distance of two to four seconds to
    allow enough time to react to hazards or sudden stops.
- id: 93
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in District traffic,
    how far ahead should you scan the road?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: Only the car immediately in front of you
  answer: B
  explanation: DC defensive driving rules state you should look 10 to 15 seconds ahead
    (about one block in the city) to anticipate traffic flow and hazards.
- id: 94
  category: defensive_driving
  question: In the District of Columbia, at what speed can hydroplaning (tires losing
    contact with the road on a wet surface) begin?
  choices:
    A: At speeds as low as 35 mph
    B: Only at speeds above 55 mph
    C: Only during heavy thunderstorms
    D: At speeds above 65 mph
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 55 mph.
- id: 95
  category: defensive_driving
  question: 'When following another vehicle at night in the District of Columbia,
    you must use your low beam headlights when you are within:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: In DC, you must switch to low beams when following another vehicle
    within 300 feet so your lights do not reflect in their rearview mirror.
- id: 96
  category: defensive_driving
  question: If you are driving in heavy fog within the District, which of the following
    is the safest action to take?
  choices:
    A: Use your high beam headlights to see further
    B: Turn on your emergency flashers and maintain speed
    C: Use your low beam headlights and reduce your speed
    D: Drive with only your parking lights on
  answer: C
  explanation: Low beams should be used in fog because high beams reflect off the
    moisture in the air, causing glare. Reducing speed is essential for safety.
- id: 97
  category: defensive_driving
  question: In the District of Columbia, what happens to the fine for a speeding violation
    if it occurs in a designated highway work zone?
  choices:
    A: The fine is waived for first-time offenders
    B: The fine is doubled
    C: The fine is tripled
    D: The fine remains the same but points are doubled
  answer: B
  explanation: According to DC law, fines for speeding and other moving violations
    are doubled when committed in a work zone while workers are present.
- id: 98
  category: defensive_driving
  question: According to the DC 'Stop for Pedestrians' law, what must a driver do
    when a pedestrian is in a crosswalk on the driver's side of the road?
  choices:
    A: Slow down and yield
    B: Honk to warn the pedestrian
    C: Stop and remain stopped until the pedestrian has passed
    D: Proceed if the pedestrian is not directly in front of the car
  answer: C
  explanation: DC law requires motorists to stop and stay stopped for pedestrians
    in crosswalks. Failure to do so can result in a fine and points.
- id: 99
  category: defensive_driving
  question: 'When entering a traffic circle (roundabout) in DC, such as Dupont Circle,
    you must yield the right-of-way to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; you have the right of way when entering
    D: Only emergency vehicles
  answer: B
  explanation: Drivers entering a traffic circle must yield to the traffic already
    circulating within the circle, which approaches from the left.
- id: 100
  category: defensive_driving
  question: 'To properly check your blind spots before changing lanes in DC, you should:'
  choices:
    A: Check your rearview mirror only
    B: Check your side mirrors only
    C: Turn your head and look over your shoulder in the direction you plan to move
    D: Speed up so you can see better in the mirrors
  answer: C
  explanation: Mirrors do not show everything. You must turn your head to check the
    'blind spots' that mirrors cannot capture before changing lanes.
- id: 101
  category: defensive_driving
  question: 'If your vehicle is equipped with an Anti-lock Braking System (ABS) and
    you need to stop quickly in an emergency, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Lightly tap the brakes
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should not pump the brakes. Instead, maintain firm and
    continuous pressure on the brake pedal to allow the system to prevent wheel lock-up.
- id: 102
  category: defensive_driving
  question: In the District of Columbia, 'Aggressive Driving' is defined as a combination
    of moving violations. How many points are assessed for each individual infraction
    that constitutes aggressive driving?
  choices:
    A: 1 point
    B: 2 points
    C: 5 points
    D: Points are only assessed if an accident occurs
  answer: B
  explanation: In DC, 2 points are assessed for each individual moving violation that
    contributes to an aggressive driving charge.
- id: 103
  category: defensive_driving
  question: When driving in winter conditions in the District, why is it particularly
    dangerous to drive over bridges and overpasses?
  choices:
    A: They are usually narrower than other roads
    B: They may freeze before other road surfaces
    C: They are more likely to have potholes
    D: The speed limit is usually higher on bridges
  answer: B
  explanation: Bridges and overpasses freeze more quickly than other roadways because
    they are exposed to cold air on both the top and bottom.
- id: 104
  category: defensive_driving
  question: 'When an emergency vehicle with flashing lights and sirens is approaching
    from either direction in DC, you must:'
  choices:
    A: Speed up to get out of the way
    B: Maintain your speed and stay in your lane
    C: Pull over to the right edge of the curb and stop
    D: Stop exactly where you are
  answer: C
  explanation: District law requires drivers to pull to the right and stop for emergency
    vehicles to provide a clear path for them to pass.
- id: 105
  category: defensive_driving
  question: 'In the District of Columbia, to avoid the need for last-minute braking
    or turning, a driver should look ahead at least:'
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: DC driving rules state that you should scan the road 10 to 15 seconds
    ahead of your vehicle to anticipate traffic flow and potential hazards.
- id: 106
  category: defensive_driving
  question: At what speed can hydroplaning begin in heavy rain, potentially causing
    your tires to lose all contact with the road?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: B
  explanation: The DC Driver Manual warns that hydroplaning can start at speeds as
    low as 35 mph, and at 55 mph, tires may lose all contact with the road.
- id: 107
  category: defensive_driving
  question: Under District of Columbia law, when are you required to turn on your
    vehicle's headlights?
  choices:
    A: Only between midnight and sunrise
    B: When visibility is less than 500 feet
    C: Only when driving on highways
    D: Only during heavy snowstorms
  answer: B
  explanation: DC law requires headlights to be on from a half-hour after sunset to
    a half-hour before sunrise, and at any time visibility is less than 500 feet.
- id: 108
  category: defensive_driving
  question: In DC, if you are convicted of 'Aggressive Driving,' which includes offenses
    like tailgating and unsafe lane changes, how many points are assessed to your
    license?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: The District of Columbia assesses 6 points for a conviction of aggressive
    driving, reflecting the high risk this behavior poses to public safety.
- id: 109
  category: defensive_driving
  question: 'When driving on slippery roads in the District, if your vehicle starts
    to skid, the correct defensive action is to:'
  choices:
    A: Brake hard and hold it
    B: Steer in the opposite direction of the skid
    C: Steer in the direction the rear of the vehicle is sliding
    D: Shift the car into 'Park'
  answer: C
  explanation: To recover from a skid, you should take your foot off the gas and steer
    in the direction the rear of the vehicle is sliding until you regain control.
- id: 110
  category: defensive_driving
  question: To scan an intersection properly before entering, the DC Driver Manual
    recommends which sequence?
  choices:
    A: Look right, then left, then right again
    B: Look left, then right, then left again
    C: Look straight ahead and accelerate
    D: Check your rearview mirror only
  answer: B
  explanation: Because the vehicle coming from the left is closer to you, the recommended
    scanning sequence is left, then right, then left again before entering an intersection.
- id: 111
  category: defensive_driving
  question: If it begins to rain in the District of Columbia, when is the road surface
    most slippery?
  choices:
    A: After it has been raining for several hours
    B: Just as it starts to rain
    C: Only when the temperature is below freezing
    D: When the rain is very heavy
  answer: B
  explanation: Roads are most slippery just as it starts to rain because the water
    mixes with oil and dust on the road surface that has not yet been washed away.
- id: 112
  category: defensive_driving
  question: When driving in heavy fog in DC, which lighting should you use to maintain
    the best visibility?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the fog and
    create glare, making it harder for you to see.
- id: 113
  category: defensive_driving
  question: In the District of Columbia, what is the penalty for failing to clear
    snow or ice from your vehicle if it flies off and poses a threat to others?
  choices:
    A: A verbal warning only
    B: A fine of $100
    C: Mandatory license suspension
    D: A fine of $1,000
  answer: B
  explanation: DC law requires drivers to clear snow and ice from their vehicles.
    Failure to do so can result in a $100 fine, especially if it creates a hazard
    for other drivers.
- id: 114
  category: defensive_driving
  question: 'When being followed too closely (tailgated) while driving on a DC street,
    you should:'
  choices:
    A: Tap your brakes repeatedly to scare the driver
    B: Slow down gradually and encourage the driver to pass
    C: Speed up to maintain the two-second gap
    D: Stop abruptly to teach them a lesson
  answer: B
  explanation: The safest defensive move when being tailgated is to slow down gradually
    to increase the space in front of you or move to another lane to allow the tailgater
    to pass.
- id: 115
  category: defensive_driving
  question: According to DC defensive driving guidelines, how often should you check
    your rearview mirrors?
  choices:
    A: Every 2 to 5 seconds
    B: Every 10 to 15 seconds
    C: Only when you hear a siren
    D: Only when you are about to stop
  answer: A
  explanation: DC guidelines suggest checking your mirrors every 2 to 5 seconds to
    stay aware of the traffic positions around your vehicle.
- id: 116
  category: defensive_driving
  question: 'When driving through a tunnel in the District of Columbia (such as the
    9th Street Tunnel), you should:'
  choices:
    A: Turn on your high beams
    B: Turn on your low-beam headlights
    C: Turn off all lights to save battery
    D: Use only your parking lights
  answer: B
  explanation: Drivers should use low-beam headlights in tunnels to increase their
    visibility to others and to help see the roadway in the changed lighting conditions.
- id: 117
  category: alcohol_drugs_health
  question: For drivers age 21 and older in DC, at what Blood Alcohol Concentration
    (BAC) level are you considered legally intoxicated (DUI)?
  choices:
    A: 0.05% or higher
    B: 0.07% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: In the District of Columbia, a driver is considered legally intoxicated
    if their BAC is 0.08% or higher.
- id: 118
  category: alcohol_drugs_health
  question: Under DC's 'Implied Consent' law, what happens if you refuse to take a
    chemical test (breath, blood, or urine) to determine your BAC?
  choices:
    A: Your license will be suspended for 90 days.
    B: Your license will be revoked for one year.
    C: You will be fined $100 and allowed to drive home.
    D: Nothing happens unless you are convicted of a DUI.
  answer: B
  explanation: By driving in DC, you have given consent to chemical testing. Refusal
    to submit to a test results in an automatic one-year revocation of your driving
    privileges.
- id: 119
  category: alcohol_drugs_health
  question: How many points are assessed to your DC driving record for a conviction
    of Driving Under the Influence (DUI)?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: A DUI conviction in the District of Columbia results in 12 points being
    assessed to your driving record, which leads to mandatory license revocation.
- id: 120
