- id: 140
  category: alcohol_drugs_health
  question: What is the effect of combining alcohol with other drugs, such as antidepressants
    or cold medicine?
  choices:
    A: The effects of the alcohol are cancelled out.
    B: The effects of the drug are cancelled out.
    C: It can multiply the effects of both, significantly increasing impairment.
