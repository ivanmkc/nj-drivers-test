- id: 128
  category: alcohol_drugs_health
  question: If you have a medical condition that may affect your ability to drive
    safely, what must you do when applying for a DC license?
  choices:
    A: Nothing, medical history is private.
    B: Only report it if you have been in an accident.
    C: Disclose the condition to the DMV and potentially provide a medical clearance.
    D: Surrender your license immediately.
  answer: C
  explanation: Applicants must disclose physical or mental conditions that could impair
    driving. The DC DMV may require a Medical Certification Form from a physician.
- id: 129
  category: alcohol_drugs_health
  question: What is the only way to 'sober up' before driving after consuming alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time for the body to process the alcohol
  answer: D
  explanation: Time is the only factor that can lower BAC. Coffee, showers, and exercise
    do not speed up the liver's metabolism of alcohol.
- id: 130
  category: alcohol_drugs_health
  question: 'In the District of Columbia, a person is considered to be driving ''per
    se'' intoxicated (DWI) if their Blood Alcohol Concentration (BAC) is at or above:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In DC, a BAC of 0.08% or higher is the legal limit for drivers age
