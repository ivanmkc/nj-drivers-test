    C: The ability of coffee to neutralize alcohol.
    D: The legal limit for BAC in the District.
  answer: B
  explanation: Combining alcohol with other drugs (even prescription ones) can cause
    a synergistic effect, where the impairment is much more severe than if either
    substance were used alone.
- id: 127
  category: alcohol_drugs_health
  question: Under DC law, what is the penalty for a driver found with an open container
    of alcohol in the passenger area of a vehicle on a public street?
  choices:
    A: A verbal warning only
    B: A fine of up to $500 and/or up to 90 days in jail
    C: Mandatory 1-year license revocation
    D: There is no penalty if the driver is not intoxicated
  answer: B
  explanation: DC's Open Container law prohibits open containers of alcohol in the
