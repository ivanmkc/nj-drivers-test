  explanation: Drivers are prohibited from passing a DC Streetcar on the left, as
    the tracks are often positioned in a way that makes left-side passing dangerous
    or impossible within the lane configuration.
- id: 177
  category: sharing_the_road
  question: When a pedestrian is in a crosswalk in the District of Columbia, what
    is the driver's legal obligation?
  choices:
    A: Slow down and yield
    B: Stop and remain stopped until the pedestrian has cleared the driver's half
      of the roadway
    C: Honk to warn the pedestrian of your presence
    D: Drivers only need to stop if there is a 'Stop' sign
  answer: B
  explanation: DC law requires drivers to stop and stay stopped for pedestrians in
    crosswalks when the pedestrian is on the half of the roadway upon which the vehicle
    is traveling or approaching so closely as to be in danger.
- id: 178
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' Where are these zones located?
  choices:
    A: Only directly behind the truck
    B: Only on the left side of the truck
    C: Directly in front, directly behind, and on both sides of the truck
    D: Only in the driver's blind spot on the right
  answer: C
  explanation: No-Zones are the large blind spots around a truck where the driver
    cannot see other vehicles. These are located in the front, rear, and on both sides.
- id: 179
  category: sharing_the_road
  question: In DC, when a motorist is turning right and a bicyclist is proceeding
    straight in a bike lane or on the shoulder, who has the right-of-way?
  choices:
    A: The motorist, because they are in a larger vehicle
    B: The bicyclist
    C: Whoever reaches the intersection first
    D: The motorist, because bicycles must yield to turning traffic
  answer: B
  explanation: Motorists must yield to bicyclists when turning. Cutting off a cyclist
    to make a right turn (a 'right hook') is a common cause of accidents and is illegal.
- id: 180
  category: sharing_the_road
  question: When parking near a DC Streetcar track, how must you park your vehicle?
  choices:
    A: Within 2 feet of the track
    B: On top of the white line marking the streetcar's path
    C: Completely within the designated parking lane, ensuring no part of the vehicle
      overhangs the track area
    D: At a 45-degree angle to the track
  answer: C
  explanation: Vehicles must be parked entirely within the marked parking lines. If
    any part of the vehicle (including mirrors) hangs over the streetcar's path, it
    can be ticketed and towed immediately.
- id: 181
  category: sharing_the_road
  question: In the District of Columbia, what is the penalty for 'dooring' (opening
    a vehicle door into the path of a bicyclist)?
  choices:
    A: A verbal warning only
    B: A mandatory license suspension
    C: A civil fine (currently $25)
    D: There is no specific law against dooring in DC
  answer: C
  explanation: DC law prohibits opening a vehicle door in a manner that interferes
    with the movement of traffic or bicyclists. It carries a specific fine.
- id: 182
  category: sharing_the_road
  question: When a school bus is stopped on a roadway with a physical median (such
    as a concrete barrier) separating the directions of travel, do vehicles on the
    opposite side need to stop?
  choices:
    A: Yes, they must always stop
    B: No, they may proceed with caution
    C: Yes, but only if the bus driver signals them to stop
    D: No, but they must stop if there are more than two lanes
  answer: B
  explanation: In DC, if a highway is separated by a physical barrier or median, traffic
    moving in the opposite direction of a stopped school bus is not required to stop.
- id: 183
  category: sharing_the_road
  question: What is the minimum distance you must maintain when following an emergency
    vehicle responding to an alarm in DC?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: According to the DC Driver's Manual, you must not follow within 500
    feet of any fire apparatus traveling in response to a fire alarm.
- id: 184
  category: sharing_the_road
  question: When sharing the road with a motorcycle, why should you allow for a full
    lane width?
  choices:
    A: Motorcyclists need the room to maneuver around hazards like potholes or debris
    B: It is required by law in the District of Columbia
    C: To avoid the motorcycle's blind spot
    D: Both A and B
  answer: D
  explanation: Motorcycles are entitled to the full use of a lane. Motorists should
    never attempt to share a lane with a motorcycle, as riders need space to react
    to road hazards.
- id: 185
  category: sharing_the_road
  question: 'When a large truck is turning right onto a narrow DC street, it may need
    to:'
  choices:
    A: Speed up to clear the intersection
    B: Swing wide to the left before turning right
    C: Stay as close to the right curb as possible
    D: Turn from the left-most lane
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn
    without hitting the curb or other objects. Drivers should never try to squeeze
    between a truck and the curb during a turn.
- id: 186
  category: vehicle_information
  question: 'In the District of Columbia, you must dim your high beams when following
    another vehicle within a distance of:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: Drivers in DC must switch to low beams when following another vehicle
    within 300 feet.
- id: 187
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle in
    the District of Columbia?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: DC vehicle safety standards require that tires have a tread depth of
    at least 2/32 of an inch in all major grooves.
- id: 188
  category: vehicle_information
  question: According to DC law, what is the maximum percentage of light blockage
    (tint) allowed on the front side windows of a passenger car?
  choices:
    A: 30% blockage (70% light transmission)
    B: 50% blockage (50% light transmission)
    C: 65% blockage (35% light transmission)
    D: No tint is allowed on front side windows
  answer: A
  explanation: DCMR Title 18, Section 734, specifies that front side windows must
    allow at least 70% of light to pass through (meaning no more than 30% tint).
- id: 189
  category: vehicle_information
  question: For passenger cars in the District of Columbia, the rear side windows
    and the rear window must allow at least what percentage of light transmission?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 20%
  answer: B
  explanation: DC regulations state that the rear side windows and the back window
    of a passenger car must allow at least 50% light transmission.
- id: 190
  category: vehicle_information
  question: In DC, your vehicle's service brakes must be capable of stopping the vehicle
    within how many feet when traveling at 20 mph on a dry, level pavement?
  choices:
    A: 15 feet
    B: 25 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Under DC vehicle equipment regulations, the service brakes must be
    able to stop a passenger vehicle within 25 feet from a speed of 20 mph.
- id: 191
  category: vehicle_information
  question: 'Every motor vehicle in the District of Columbia must be equipped with
    a horn that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: DC law requires all motor vehicles to have a horn in good working order
    capable of emitting sound audible under normal conditions from a distance of not
    less than 200 feet.
- id: 192
  category: vehicle_information
  question: 'In DC, a vehicle''s exhaust system must be equipped with a muffler to
    prevent:'
  choices:
    A: Any visible smoke
    B: Excessive or unusual noise
    C: The use of premium fuel
    D: Engine overheating
  answer: B
  explanation: DC regulations require every motor vehicle to have a muffler in good
    working order to prevent excessive or unusual noise and annoying smoke.
- id: 193
  category: vehicle_information
  question: When must you use your windshield wipers in the District of Columbia?
  choices:
    A: Only when visibility is less than 100 feet
    B: Whenever it is raining or snowing
    C: Only during nighttime hours
    D: Whenever you are using your headlights
  answer: B
  explanation: DC law requires the use of windshield wipers during rain, sleet, or
    snow to maintain clear vision. Additionally, if you use wipers, you must also
    turn on your headlights.
- id: 194
  category: vehicle_information
  question: Regarding license plates (tags) in DC, which of the following is true?
  choices:
    A: You only need to display a rear license plate
    B: License plates must be visible from 50 feet
    C: Both front and rear plates must be displayed and clearly visible
    D: Plates can be placed in the rear window if a bracket is broken
  answer: C
  explanation: DC law requires that motor vehicles (except motorcycles and trailers)
    display two current identification tags, one on the front and one on the rear.
- id: 195
  category: vehicle_information
  question: In the District of Columbia, your vehicle must have at least how many
    mirrors to provide a view of the highway to the rear?
  choices:
    A: One interior mirror
    B: One exterior mirror on the driver's side
    C: At least two mirrors, one of which must be on the left side exterior
    D: Three mirrors (left, right, and center)
  answer: C
  explanation: DC regulations require at least two mirrors, including one on the left
    exterior side, positioned to reflect a view of the highway for at least 200 feet
    to the rear.
- id: 196
  category: vehicle_information
  question: If your vehicle's turn signals are not working, you must use hand signals.
    What is the correct hand signal for a right turn?
  choices:
    A: Arm extended straight out
    B: Arm extended upward
    C: Arm extended downward
    D: Arm moved in a circular motion
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    upward at a 90-degree angle.
- id: 197
  category: vehicle_information
  question: 'In DC, the parking brake must be able to hold the vehicle stationary
    on any grade upon which it is operated, even in the absence of:'
  choices:
    A: The driver
    B: The engine running
    C: The transmission being in gear
    D: All of the above
  answer: D
  explanation: DC safety standards require the parking brake to be a separate mechanism
    capable of holding the vehicle stationary on any grade regardless of engine status
    or gear position.
- id: 198
  category: vehicle_information
  question: In the District of Columbia, during what hours are you required to have
    your vehicle's headlights turned on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From one-half hour after sunset to one-half hour before sunrise
    D: Only when visibility is less than 1,000 feet
  answer: C
  explanation: According to the DC Driver Manual, motorists must turn on headlights
    from one-half hour after sunset to one-half hour before sunrise, and at any other
    time when visibility is not sufficient.
- id: 199
  category: vehicle_information
  question: Under DC vehicle equipment standards, the foot brake must be capable of
    stopping the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 15 feet
    B: 20 feet
    C: 25 feet
    D: 30 feet
  answer: C
  explanation: The DC Driver Manual states that the service (foot) brake must be able
    to stop the vehicle within 25 feet when the vehicle is traveling at 20 miles per
    hour.
- id: 200
  category: vehicle_information
  question: For a passenger sedan registered in DC, what is the maximum allowable
    darkness for window tint on the front side windows?
  choices:
    A: Must allow more than 35% light transmittance
    B: Must allow more than 50% light transmittance
    C: Must allow more than 70% light transmittance
    D: Tinting is not allowed on front side windows
  answer: C
  explanation: DCMR 18-730 specifies that for passenger cars (sedans), the windshield
    and front side windows must allow at least 70% light transmittance.
- id: 201
  category: vehicle_information
  question: For a passenger sedan registered in DC, what is the minimum light transmittance
    required for the rear side windows and the rear window?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: No limit
  answer: B
  explanation: In the District of Columbia, passenger sedans are required to have
    at least 50% light transmittance on the rear side windows and the rear window.
- id: 202
  category: vehicle_information
  question: How often must a personal, non-commercial vehicle registered in the District
    of Columbia undergo an emissions inspection?
  choices:
    A: Every year
    B: Every two years
    C: Every four years
    D: Only when the vehicle is sold
  answer: B
  explanation: DC DMV requires that personal vehicles undergo an emissions inspection
    every two years.
- id: 203
  category: vehicle_information
  question: 'In DC, your vehicle''s rearview mirror must be adjusted so that you can
    see the highway to the rear for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: DC equipment regulations require a mirror so located as to reflect
    to the driver a view of the highway for a distance of at least 200 feet to the
    rear.
- id: 204
  category: vehicle_information
  question: 'DC law requires that your rear license plate must be illuminated by a
    white light so that it is clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Vehicles in DC must have a lamp that renders the rear registration
    plate clearly legible from a distance of 50 feet to the rear.
- id: 205
  category: vehicle_information
  question: According to DC law, children must be properly restrained in a rear-facing
    child safety seat until they reach what age?
  choices:
    A: 1 year old
    B: 2 years old
    C: 4 years old
    D: 6 years old
  answer: B
  explanation: District of Columbia law requires children under the age of 2 to be
    properly secured in a rear-facing child restraint system.
- id: 206
  category: vehicle_information
  question: In the District of Columbia, what is the penalty for a driver who fails
    to wear a seat belt?
  choices:
    A: A $20 fine and no points
    B: A $50 fine and 2 points
    C: A $100 fine and 3 points
    D: Mandatory driver retraining
  answer: B
  explanation: In DC, the fine for a seat belt violation is $50 and 2 points are assessed
    on the driver's license.
- id: 207
  category: vehicle_information
  question: 'In the District of Columbia, you are required to turn on your headlights
    whenever you are using your windshield wipers due to:'
  choices:
    A: Rain, sleet, or snow
    B: Cleaning the windshield
    C: Heavy dust only
    D: Only when driving on highways
  answer: A
  explanation: DC law requires drivers to use headlights whenever windshield wipers
    are in use due to precipitation such as rain, sleet, or snow.
- id: 208
  category: signs_and_signals
  question: Unless otherwise posted, what is the default speed limit on all District
    of Columbia streets?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Effective June 2020, the District of Columbia reduced the default speed
    limit from 25 mph to 20 mph on all local streets and corridors to improve pedestrian
    safety.
- id: 209
  category: signs_and_signals
  question: 'When approaching a ''Don''t Block the Box'' intersection in DC, you should
    not enter the intersection unless:'
  choices:
    A: The light is green.
    B: You are turning right.
    C: There is enough space to completely clear the intersection on the other side.
    D: You are driving an emergency vehicle.
  answer: C
  explanation: DC's 'Don't Block the Box' rule prohibits drivers from entering an
    intersection unless there is sufficient space on the opposite side to pull their
    vehicle through without blocking cross traffic.
- id: 210
  category: signs_and_signals
  question: 'In the District of Columbia, a steady red ''X'' signal over a traffic
    lane means:'
  choices:
    A: The lane is about to change direction.
    B: You must travel with caution in this lane.
    C: You are not allowed to use this lane.
    D: The lane is reserved for emergency vehicles only.
  answer: C
  explanation: A steady red 'X' in a reversible lane system, common on DC streets
    like Connecticut Avenue, indicates that the lane is closed to traffic moving in
    your direction.
- id: 211
  category: signs_and_signals
  question: What is the meaning of a flashing yellow traffic light at an intersection
    in DC?
  choices:
    A: Stop and wait for the light to turn green.
    B: Slow down and proceed with caution.
    C: The light is about to turn red.
    D: Yield to all traffic, even if you have the right-of-way.
  answer: B
  explanation: A flashing yellow light means you should slow down and be especially
    alert as you proceed through the intersection.
- id: 212
  category: signs_and_signals
  question: In DC, when can you legally turn left on a red light?
  choices:
    A: Never.
    B: Only when turning from a one-way street onto another one-way street.
    C: Only if there is no 'No Turn on Red' sign.
    D: Anytime the intersection is clear.
  answer: B
  explanation: Under DC law, a left turn on red is permitted only when turning from
    a one-way street onto another one-way street, provided you stop first and yield
    to pedestrians and other traffic.
- id: 213
  category: signs_and_signals
  question: What do red-painted pavement markings in a traffic lane indicate in the
    District of Columbia?
  choices:
    A: The lane is for emergency vehicles only.
    B: The lane is a high-speed express lane.
    C: The lane is reserved for buses only.
    D: The lane is a pedestrian-only zone.
  answer: C
  explanation: DC uses red-colored pavement to designate 'Bus Only' lanes to improve
    transit efficiency and visibility.
- id: 214
  category: signs_and_signals
  question: When you see a 'HAWK' (High-Intensity Activated Crosswalk) signal with
    two solid red lights at the top, what must you do?
  choices:
    A: Slow down and prepare to stop.
    B: Stop and remain stopped until the lights turn off.
    C: Stop, then proceed if the crosswalk is clear.
    D: Treat it like a four-way stop.
  answer: B
  explanation: When the HAWK signal displays two solid red lights, drivers must stop
    and stay stopped while pedestrians cross. When the lights flash red, drivers must
    stop but may proceed if the crosswalk is clear.
- id: 215
  category: signs_and_signals
  question: 'In DC, a ''No Stopping'' sign means:'
  choices:
    A: You may stop to pick up passengers.
    B: You may stop to unload groceries.
    C: You may not stop for any reason, including picking up or dropping off passengers.
    D: You may stop only if your hazard lights are on.
  answer: C
  explanation: A 'No Stopping' sign is the most restrictive; it means you cannot stop
    for any reason, even momentarily to discharge a passenger.
- id: 216
  category: signs_and_signals
  question: What does a 'Sharrow' pavement marking (a bicycle symbol with two chevrons
    above it) indicate?
  choices:
    A: The lane is for bicycles only.
    B: Bicycles must stay on the sidewalk.
    C: The lane is shared by both motor vehicles and bicycles.
    D: Motor vehicles are prohibited from this lane.
  answer: C
  explanation: Shared Lane Markings (Sharrows) are used in DC to indicate that the
    lane is too narrow for a car and a bike to travel side-by-side safely, so cyclists
    may use the full lane.
- id: 217
  category: signs_and_signals
  question: 'To signal a right turn using hand signals, a driver should:'
  choices:
    A: Extend the left arm out and point it upward.
    B: Extend the left arm straight out.
    C: Extend the left arm out and point it downward.
    D: Extend the right arm straight out.
  answer: A
  explanation: The standard hand signal for a right turn is the left arm extended
    out of the window and bent upward at the elbow.
- id: 218
  category: signs_and_signals
  question: 'A solid white line painted across a road at an intersection is known
    as a:'
  choices:
    A: Crosswalk line.
    B: Yield line.
    C: Stop line.
    D: Bicycle lane.
  answer: C
  explanation: A solid white line across a lane at an intersection is a stop line,
    indicating the point where a vehicle must stop for a stop sign or red light.
- id: 219
  category: signs_and_signals
  question: What does a flashing yellow traffic signal indicate to a driver in the
    District of Columbia?
  choices:
    A: Stop and wait for the light to turn green
    B: The light is about to turn red
    C: Slow down and proceed with caution
    D: Yield to all traffic coming from the right
  answer: C
  explanation: A flashing yellow light means you should slow down and proceed with
    caution. You do not need to stop, but you must be alert for hazards.
- id: 220
  category: signs_and_signals
  question: In DC, what do red-painted pavement markings typically indicate?
  choices:
    A: High-occupancy vehicle (HOV) lanes
    B: No parking zones
    C: Dedicated bus lanes
    D: Emergency vehicle only lanes
  answer: C
  explanation: The District of Columbia uses red-painted pavement to designate dedicated
    bus lanes. Drivers should not enter these lanes except to make a turn where permitted.
- id: 221
  category: signs_and_signals
  question: When a traffic signal is completely dark due to a power outage in DC,
    how should you treat the intersection?
  choices:
    A: As a four-way stop
    B: Yield to the driver on the right
    C: Maintain speed and proceed carefully
    D: Wait for a police officer to arrive
  answer: A
  explanation: If a traffic signal is not working or is dark, DC law requires you
    to treat the intersection as a four-way stop.
- id: 222
  category: signs_and_signals
  question: What is the meaning of a 'Don't Block the Box' sign or pavement marking
    in the District?
  choices:
    A: You must stop before the crosswalk
    B: You may not enter an intersection unless you can clear it completely without
      stopping
    C: No parking is allowed in the intersection
    D: Only commercial vehicles may enter the box
  answer: B
  explanation: DC's 'Don't Block the Box' rule means drivers may not enter an intersection
    if traffic is backed up on the other side, preventing them from clearing the intersection.
    Blocking the box can result in a fine and points.
- id: 223
  category: signs_and_signals
  question: 'In DC, a ''sharrow'' marking (a bicycle symbol with two chevrons) on
    the pavement indicates:'
  choices:
    A: A lane reserved exclusively for bicycles
    B: A lane where bicycles and motor vehicles share the road
    C: A pedestrian-only zone
    D: A high-speed cycling lane
  answer: B
  explanation: A sharrow indicates a shared-lane marking, alerting motorists that
    bicyclists may occupy the full lane and helping bicyclists position themselves
    safely.
- id: 224
  category: signs_and_signals
  question: If you are facing a steady yellow X signal over a reversible lane in DC,
    what should you do?
  choices:
    A: Continue driving in that lane
    B: Speed up to clear the lane
    C: Move out of that lane as soon as it is safe to do so
    D: Stop immediately
  answer: C
  explanation: A steady yellow X over a reversible lane indicates that the lane signal
    is about to change to a red X, and you must safely move out of that lane.
- id: 225
  category: signs_and_signals
  question: In DC, what do 'shark's teeth' (a line of triangles) painted across a
    lane indicate?
  choices:
    A: A speed bump ahead
    B: The start of a bike lane
    C: A yield line where you must stop for pedestrians or traffic
    D: A no-passing zone
  answer: C
  explanation: Shark's teeth are yield lines. They indicate the point where a vehicle
    must yield to pedestrians or other traffic.
- id: 226
  category: signs_and_signals
  question: What does a steady circular yellow light mean?
  choices:
    A: You must stop if you can do so safely
    B: You have the right of way to turn
    C: The light is turning green
    D: Pedestrians have the right of way
  answer: A
  explanation: A steady yellow light means the green signal is ending. You must stop
    if you can do so safely; if you are already in the intersection, you should continue
    through.
- id: 227
  category: signs_and_signals
  question: 'A HAWK (High-Intensity Activated Crosswalk) signal is used in DC to:'
  choices:
    A: Control high-speed highway traffic
    B: Help pedestrians cross busy streets safely
    C: Signal the entrance to a tunnel
    D: Regulate bus-only lanes
  answer: B
  explanation: HAWK signals, or Pedestrian Hybrid Beacons, are used in DC to assist
    pedestrians in crossing mid-block or at busy intersections by stopping vehicular
    traffic.
- id: 228
  category: signs_and_signals
  question: 'When a driver extends their left arm straight out the window, they are
    signaling a:'
  choices:
    A: Right turn
    B: Stop
    C: Left turn
    D: U-turn
  answer: C
  explanation: Extending the left arm straight out the window is the standard hand
    signal for a left turn.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 229
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 230
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 231
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 232
- image: one_way_left.png
