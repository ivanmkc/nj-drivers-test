    C: You consent to have your vehicle searched at any time by police.
    D: You agree to carry a spare tire and emergency kit at all times.
  answer: B
  explanation: By holding a DC driver's license, you have given 'implied consent'
    to submit to chemical testing for alcohol or drugs if a law enforcement officer
    has reasonable grounds to believe you are driving while impaired.
- id: 132
  category: alcohol_drugs_health
  question: 'If you refuse to submit to a chemical test for alcohol or drugs when
    requested by a DC police officer, your license will be revoked for:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
