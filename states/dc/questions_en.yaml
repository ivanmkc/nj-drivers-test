- id: 135
  category: alcohol_drugs_health
  question: In DC, what is the difference between a DWI (Driving While Intoxicated)
    and a DUI (Driving Under the Influence) charge?
  choices:
    A: DWI is for drugs; DUI is for alcohol.
    B: DWI is based on a BAC of 0.08% or higher; DUI is based on observed impairment
      regardless of BAC.
    C: DUI is a felony; DWI is a misdemeanor.
    D: There is no difference; they are the same charge.
  answer: B
  explanation: DWI is a 'per se' offense for having a BAC of 0.08% or higher. DUI
    can be charged if the driver is impaired by alcohol or drugs, even if their BAC
    is below 0.08%.
- id: 136
  category: alcohol_drugs_health
  question: 'For drivers of commercial motor vehicles in the District of Columbia,
    the legal BAC limit is:'
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
