  question: When passing a person operating a bicycle in the District of Columbia,
    what is the minimum safe distance a motorist must maintain?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: DC law requires motorists to maintain a safe distance of at least 3
    feet when overtaking and passing a bicycle.
- id: 164
  category: sharing_the_road
  question: 'In DC, you must stop for a school bus with flashing red lights and an
