  choices:
    A: Yes, it is legal at all times
    B: Yes, but only when traffic is moving slower than 15 mph
    C: No, it is not permitted
    D: Only for emergency responders
  answer: C
  explanation: Lane splitting is not authorized in DC; motorcycles must operate within
