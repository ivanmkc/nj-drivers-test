  explanation: The area directly behind a large truck is a major 'No-Zone' (blind
    spot) where the truck driver cannot see your vehicle at all.
- id: 167
  category: sharing_the_road
  question: 'If you see a pedestrian with a white cane or a guide dog at an intersection
