  question: In the District of Columbia, where is it strictly prohibited for persons
    16 years of age or older to ride a bicycle on the sidewalk?
  choices:
    A: In residential neighborhoods
    B: Near public schools
    C: In the Central Business District
    D: On any street with a speed limit over 25 mph
  answer: C
  explanation: DC law prohibits riding bicycles on sidewalks within the Central Business
    District (CBD). Outside the CBD, sidewalk riding is generally permitted.
- id: 172
  category: sharing_the_road
  question: 'When following a fire apparatus (fire truck) responding to an alarm in
    DC, you must maintain a minimum following distance of:'
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: It is illegal to follow a fire apparatus traveling in response to a
    fire alarm closer than 500 feet.
- id: 173
  category: sharing_the_road
  question: 'When sharing the road with the DC Streetcar, a driver should never:'
  choices:
    A: Drive on the tracks
    B: Pass a streetcar on the right
    C: Park a vehicle within the 'Streetcar No-Go' white lines
    D: Turn right at an intersection
