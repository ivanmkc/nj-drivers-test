metadata:
  source: 2025 Delaware Driver's Manual
  total_questions: 251
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Delaware, what is the minimum age to be eligible for a Level 1 Learner's
    Permit?
  choices:
    A: 15 years old
    B: 15 years and 6 months old
    C: 16 years old
    D: 17 years old
  answer: C
  explanation: According to the Delaware Driver Manual, an applicant must be at least
    16 years old to be eligible for a Level 1 Learner's Permit as part of the Graduated
    Driver License (GDL) program.
- id: 2
  category: license_system
  question: During the first six months of holding a Delaware Level 1 Learner's Permit,
    how many hours of driving must be supervised by a licensed adult?
  choices:
    A: 30 hours, including 5 hours at night
    B: 40 hours, including 10 hours at night
    C: 50 hours, including 10 hours at night
    D: 60 hours, including 15 hours at night
  answer: C
  explanation: Delaware law requires the permit holder to complete 50 hours of driving,
    with at least 10 of those hours being at night, verified by a sponsor.
- id: 3
  category: license_system
  question: Under the Delaware GDL program, for the first six months of the Level
    1 Learner's Permit, who is required to be in the front seat with the driver?
  choices:
    A: Any licensed driver over the age of 18
    B: A licensed parent or guardian only
    C: A licensed driver who is at least 25 years old and has held a license for at
      least 5 years
    D: A licensed driver who is at least 21 years old and has held a license for at
      least 1 year
  answer: C
  explanation: The supervisor must be a licensed driver at least 25 years of age who
    has held a Class D license for at least 5 years.
- id: 4
  category: license_system
  question: During the second six months of the Delaware Level 1 Learner's Permit,
    when is the driver allowed to drive unsupervised?
  choices:
    A: At any time of day or night
    B: Only between 6:00 AM and 10:00 PM
    C: Only between 5:00 AM and Midnight
    D: Only when driving to school or work
  answer: B
  explanation: After the first six months, the permit holder may drive unsupervised
    between 6:00 AM and 10:00 PM. Driving between 10:00 PM and 6:00 AM still requires
    supervision unless traveling to/from work, church, or school activities.
- id: 5
  category: license_system
  question: What is the passenger restriction for a Delaware Level 1 Learner's Permit
    holder during the entire first year?
  choices:
    A: No passengers are allowed at any time
    B: Only family members are allowed
    C: Only one non-family passenger is allowed in addition to the supervisor
    D: Up to three passengers are allowed if they are over 21
  answer: C
  explanation: Except for immediate family members, only one additional passenger
    is permitted in the vehicle, provided the supervisor is present (during the first
    6 months) or while driving unsupervised (during the second 6 months).
- id: 6
  category: license_system
  question: If you move to Delaware from another state, within how many days must
    you apply for a Delaware driver's license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: New residents must apply for a Delaware driver's license within 60
    days of establishing residency in the state.
- id: 7
  category: license_system
  question: After changing your name or address, how many days do you have to notify
    the Delaware DMV?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Delaware law requires you to notify the DMV of a name or address change
    within 30 days.
- id: 8
  category: license_system
  question: In Delaware, what is the standard expiration period for a newly issued
    Class D driver's license?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: A standard Delaware driver's license is valid for a period of 8 years.
- id: 9
  category: license_system
  question: Under Delaware's 'Zero Tolerance' law, what is the BAC limit for drivers
    under the age of 21?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Delaware's Zero Tolerance law states that anyone under 21 who drives,
    operates, or is in physical control of a vehicle with a BAC of 0.02% or higher
    will have their license revoked.
- id: 10
  category: license_system
  question: How many points are assessed on a Delaware driving record for speeding
    1-9 mph over the posted speed limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: In Delaware, speeding 1 to 9 mph over the limit results in 2 points
    on your driving record.
- id: 11
  category: license_system
  question: Which of the following violations carries the highest point value (6 points)
    in the Delaware point system?
  choices:
    A: Following too closely
    B: Passing a stopped school bus
    C: Speeding 15-19 mph over the limit
    D: Failure to yield right of way
  answer: B
  explanation: Passing a stopped school bus with flashing red lights is a serious
    offense in Delaware and carries 6 points.
- id: 12
  category: license_system
  question: In Delaware, how long do points remain at their full value on your driving
    record before being reduced to half-point credit?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: Points are assessed at full value for the first 12 months. After 12
    months, the points are credited at one-half value for the next 12 months.
- id: 13
  category: license_system
  question: To satisfy Delaware's financial responsibility law, what is the minimum
    amount of liability insurance required for the bodily injury of one person in
    an accident?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Delaware requires minimum liability coverage of $25,000 for bodily
    injury or death of one person in any one accident.
- id: 14
  category: license_system
  question: A Delaware driver can be charged with 'Aggressive Driving' if they commit
    how many specific traffic offenses in a single incident?
  choices:
    A: Two or more
    B: Three or more
    C: Four or more
    D: Five or more
  answer: B
  explanation: According to Title 21, Section 4175A, a person is guilty of aggressive
    driving if they violate three or more specific titles (such as speeding, following
    too closely, or failing to yield) in a single incident.
- id: 15
  category: license_system
  question: What is the penalty for a first-offense conviction of driving without
    a valid license in Delaware?
  choices:
    A: A fine of $50 to $200
    B: Mandatory 30 days in jail
    C: Permanent revocation of driving privileges
    D: A fine of $500 to $1,000
  answer: A
  explanation: A first offense for driving without a license in Delaware typically
    carries a fine ranging from $50 to $200.
- id: 16
  category: license_system
  question: In Delaware, how many points are credited toward your driving record for
    completing a DMV-approved defensive driving course?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Delaware law allows a 3-point credit to be applied to a driver's record
    upon the successful completion of a DMV-approved defensive driving course.
- id: 17
  category: license_system
  question: To pass the vision screening for a Delaware driver's license, an applicant
    must have at least what visual acuity in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Delaware requires drivers to have at least 20/40 vision in at least
    one eye, with or without corrective lenses.
- id: 18
  category: license_system
  question: Under Delaware law, who is legally responsible for the negligent or willful
    misconduct of a minor driver under the age of 18?
  choices:
    A: The minor driver only
    B: The driving instructor
    C: The person who signed the minor's application for a license
    D: The state DMV
  answer: C
  explanation: The person who signs (sponsors) the minor's application for a Delaware
    license is held jointly and severally liable with the minor for any damages caused
    by the minor's negligence or willful misconduct while driving.
- id: 19
  category: license_system
  question: What is the standard fee for an 8-year Delaware Class D driver's license?
  choices:
    A: $25
    B: $40
    C: $50
    D: $60
  answer: B
  explanation: The fee for a standard 8-year Delaware Class D driver's license is
    $40.00.
- id: 20
  category: license_system
  question: In the Delaware point system, how many points are assessed for passing
    a stopped school bus with its red lights flashing?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Passing a stopped school bus with red lights flashing is a serious
    violation in Delaware and results in 6 points on the driver's record and an immediate
    suspension.
- id: 21
  category: license_system
  question: In Delaware, failing to stop at a red light will result in how many points
    being added to your driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failing to stop at a red light is a 3-point violation in the state
    of Delaware.
- id: 22
  category: license_system
  question: A Delaware driver's license will be revoked for how long if the driver
    is convicted of leaving the scene of an accident (Hit and Run) that resulted in
    injury or death?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: Delaware law mandates a 1-year revocation of driving privileges for
    any conviction of leaving the scene of an accident involving physical injury or
    death.
- id: 23
  category: license_system
  question: Under Delaware's Implied Consent Law, what is the penalty for a first-time
    refusal to submit to a chemical test for alcohol or drugs?
  choices:
    A: 3-month license suspension
    B: 6-month license suspension
    C: 12-month license revocation
    D: 24-month license revocation
  answer: C
  explanation: If you refuse a chemical test in Delaware, your license will be revoked
    for 12 months for a first offense under the Implied Consent Law.
- id: 24
  category: license_system
  question: At what age do the restrictions of the Delaware Graduated Driver License
    (GDL) program officially end, provided the driver has held the permit for at least
    12 months?
  choices:
    A: '17'
    B: '18'
    C: '19'
    D: '21'
  answer: B
  explanation: The Delaware GDL program and its associated restrictions end when the
    driver reaches the age of 18.
- id: 25
  category: license_system
  question: To obtain a Delaware federally compliant 'REAL ID,' how many documents
    proving Delaware residency must an applicant provide?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Delaware DMV requires two separate documents showing the applicant's
    name and Delaware residential address to issue a REAL ID.
- id: 26
  category: license_system
  question: If you fail to renew your Delaware vehicle registration before it expires,
    what is the mandatory late fee?
  choices:
    A: $10
    B: $20
    C: $30
    D: $50
  answer: B
  explanation: Delaware charges a $20.00 late fee if a vehicle registration is not
    renewed by the expiration date.
- id: 27
  category: license_system
  question: New residents to Delaware must have their vehicle inspected and registered
    within how many days of establishing residency?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: New residents have 60 days to register their vehicles in Delaware after
    establishing residency.
- id: 28
  category: license_system
  question: Under the Delaware Driver Improvement Program, at how many points will
    the DMV send the driver an advisory letter and require a mandatory interview?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 14 points
  answer: C
  explanation: When a driver reaches 12 points on their Delaware record, they are
    sent an advisory letter and must attend a mandatory interview/behavior modification
    program.
- id: 29
  category: driver_testing
  question: When taking the Delaware road test, which of the following is a requirement
    for the vehicle you provide?
  choices:
    A: It must be a manual transmission vehicle
    B: It must have a backup camera that is fully functional
    C: The examiner must have clear access to the foot brake or a center-mounted parking
      brake
    D: It must be a vehicle manufactured within the last 10 years
  answer: C
  explanation: For the Delaware road test, the vehicle must allow the examiner to
    reach either a foot brake or a parking brake located on a center console in case
    of an emergency.
- id: 30
  category: driver_testing
  question: In Delaware, what is the maximum speed limit for two-lane roads unless
    otherwise posted?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: B
  explanation: According to the Delaware Driver Manual, the speed limit for two-lane
    roads is 50 mph unless signs indicate otherwise.
- id: 31
  category: driver_testing
  question: If a Delaware driver is convicted of a first-offense DUI with a BAC of
    .15 to .19, how long is the license revocation period?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: C
  explanation: For a first offense DUI in Delaware with a BAC between .15 and .19,
    the revocation period is 18 months.
- id: 32
  category: driver_testing
  question: What is the speed limit in a Delaware school zone when children are present
    or when lights are flashing?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The speed limit in Delaware school zones is 20 mph.
- id: 33
  category: driver_testing
  question: According to Delaware law, children must be restrained in a child safety
    seat or booster seat until they reach what age or weight?
  choices:
    A: Age 6 or 50 pounds
    B: Age 7 or 60 pounds
    C: Age 8 or 65 pounds
    D: Age 10 or 80 pounds
  answer: C
  explanation: Delaware law requires all children to be in a child safety seat or
    booster seat until they are 8 years old OR 65 pounds.
- id: 34
  category: driver_testing
  question: In Delaware, when are you required to turn on your headlights in relation
    to weather conditions?
  choices:
    A: Only when visibility is less than 100 feet
    B: Only after sunset
    C: Whenever you use your windshield wipers
    D: Only during heavy snow or fog
  answer: C
  explanation: Delaware law requires drivers to turn on headlights whenever the vehicle's
    windshield wipers are in use due to rain, snow, or sleet.
- id: 35
  category: driver_testing
  question: What is the fine for a first-offense violation of Delaware's law prohibiting
    the use of a handheld cell phone while driving?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: The fine for a first-offense handheld cell phone violation in Delaware
    is $100, plus additional court costs.
- id: 36
  category: driver_testing
  question: How many points are assessed on a Delaware driving record for failing
    to stop at a red light?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: In Delaware, failing to stop at a red light results in 3 points being
    added to your driving record.
- id: 37
  category: driver_testing
  question: If you fail the Delaware road test, how long must you wait before you
    are eligible to retake it?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 10 days
  answer: D
  explanation: If you fail the road test in Delaware, you must wait at least 10 days
    before you can take the test again.
- id: 38
  category: driver_testing
  question: After purchasing a vehicle in Delaware, within how many days must you
    apply for a new title and registration?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Delaware law requires that you apply for a title and registration within
    30 days of purchasing a vehicle.
- id: 39
  category: driver_testing
  question: What is the late fee for renewing a vehicle registration after it has
    expired in Delaware?
  choices:
    A: $10.00
    B: $20.00
    C: $50.00
    D: Double the registration cost
  answer: B
  explanation: Delaware charges a $20.00 late fee if you renew your vehicle registration
    after the expiration date.
- id: 40
  category: driver_testing
  question: How many points are assessed on your Delaware driving record for 'Following
    Too Closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Following too closely is a 3-point violation in the Delaware point
    system.
- id: 41
  category: driver_testing
  question: To prevent injury from an air bag, Delaware's manual recommends that children
    sit in the back seat until they are at least what age or height?
  choices:
    A: Age 10 or 60 inches
    B: Age 12 or 65 inches
    C: Age 13 or 60 inches
    D: Age 15 or 65 inches
  answer: B
  explanation: The Delaware Driver Manual recommends that children under age 12 or
    under 65 inches tall should sit in the back seat to avoid air bag injuries.
- id: 42
  category: driver_testing
  question: Under Delaware's 'Move Over' law, what must you do when approaching a
    stationary emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk your horn
    C: Move to a lane that is not adjacent to the emergency vehicle, if safe to do
      so
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Delaware's Move Over law requires drivers to change lanes to a lane
    not adjacent to the emergency vehicle, or slow down significantly if a lane change
    is unsafe.
- id: 43
  category: driver_testing
  question: To pass the Delaware written knowledge exam, what is the minimum passing
    score required?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: The Delaware knowledge test consists of 30 questions, and an applicant
    must answer at least 24 correctly (80%) to pass.
- id: 44
  category: driver_testing
  question: Under Delaware's 'Implied Consent Law,' by driving a motor vehicle, you
    have agreed to what?
  choices:
    A: To always carry a passenger.
    B: To take a chemical test for alcohol or drugs if requested by police.
    C: To allow any police officer to search your vehicle at any time.
    D: To maintain a clean driving record for at least five years.
  answer: B
  explanation: Delaware's Implied Consent Law means that any person who operates a
    motor vehicle is deemed to have given consent to a chemical test of their breath,
    blood, or urine to determine the presence of alcohol or drugs.
- id: 45
  category: driver_testing
  question: At what point level does the Delaware DMV send a warning letter to a driver
    regarding their point accumulation?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: The Delaware DMV sends a warning letter to the driver when they reach
    8 points on their driving record.
- id: 46
  category: driver_testing
  question: 'Delaware law requires drivers to use their headlights whenever they are
    using their:'
  choices:
    A: Hazard lights
    B: Windshield wipers
    C: Defroster
    D: Turn signals
  answer: B
  explanation: Delaware law requires that headlights must be on when windshield wipers
    are in use due to rain, snow, or sleet.
- id: 47
  category: driver_testing
  question: In Delaware, you may not park your vehicle within how many feet of a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Delaware law prohibits parking within 15 feet of a fire hydrant.
- id: 48
  category: driver_testing
  question: What is the base fine for a first offense of using a handheld cell phone
    while driving in Delaware?
  choices:
    A: 25 dollars
    B: 50 dollars
    C: 100 dollars
    D: 250 dollars
  answer: C
  explanation: The base fine for a first offense of violating Delaware's hands-free
    cell phone law is $100.
- id: 49
  category: driver_testing
  question: When following another vehicle under normal driving conditions in Delaware,
    what is the recommended following distance?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Delaware Driver's Manual recommends a following distance of at
    least 3 seconds behind the vehicle in front of you.
- id: 50
  category: driver_testing
  question: 'When entering a roundabout in Delaware, drivers must yield the right-of-way
    to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; the entering driver has the right-of-way
    D: Traffic exiting the circle only
  answer: B
  explanation: In Delaware, traffic entering a roundabout must yield to the traffic
    already circulating within the roundabout.
- id: 51
  category: driver_testing
  question: Delaware's 'Move Over' law requires drivers to do what when approaching
    a stationary emergency vehicle with flashing lights?
  choices:
    A: Stop completely until the vehicle leaves
    B: Maintain speed but honk to alert the emergency workers
    C: Move to a non-adjacent lane or slow down significantly if a lane change is
      unsafe
    D: Speed up to pass the scene as quickly as possible
  answer: C
  explanation: Delaware law requires drivers to move over a lane or slow down when
    approaching emergency vehicles, tow trucks, and utility vehicles stopped on the
    shoulder with flashing lights.
- id: 52
  category: driver_testing
  question: In Delaware, you must use your turn signal at least how many feet before
    turning?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: D
  explanation: Delaware law requires drivers to signal their intention to turn at
    least 300 feet before the turn.
- id: 53
  category: driver_testing
  question: In Delaware, if a driver is convicted of driving 25 mph over the posted
    speed limit, what is the mandatory penalty in addition to points?
  choices:
    A: A mandatory 1-month license suspension
    B: A mandatory 1-year license revocation
    C: The driver must appear in person for a DMV interview
    D: The driver must retake the road test
  answer: C
  explanation: In Delaware, for speeding 25 mph or more over the limit, the driver
    must appear for a DMV interview. At 25 mph over, a 1-month suspension is also
    authorized.
- id: 54
  category: driver_responsibility
  question: In Delaware, what is the minimum liability insurance coverage required
    for the bodily injury or death of two or more persons in any one accident?
  choices:
    A: $25,000
    B: $30,000
    C: $50,000
    D: $100,000
  answer: C
  explanation: Delaware's minimum liability insurance requirements are $25,000 for
    one person and $50,000 for two or more persons for bodily injury.
- id: 55
  category: driver_responsibility
  question: Under Delaware law, you must immediately report an accident to the police
    if the property damage exceeds what amount?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Accidents must be reported to the police immediately if they result
    in injury or death, or if property damage appears to exceed $1,500.
- id: 56
  category: driver_responsibility
  question: Under Delaware's Implied Consent Law, if you refuse to submit to a chemical
    test to determine your BAC, your driving privilege will be revoked for how long
    for a first offense?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: D
  explanation: Under the Implied Consent Law, a first-offense refusal to submit to
    a chemical test results in a 12-month revocation of driving privileges.
- id: 57
  category: driver_responsibility
  question: If you become a resident of Delaware, within how many days must you register
    your vehicle in the state?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: New residents must register their vehicles in Delaware within 60 days
    of establishing residency.
- id: 58
  category: driver_responsibility
  question: In Delaware, what is the base fine for a first offense of failing to wear
    a seat belt?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: The fine for a seat belt violation in Delaware is $25, plus additional
    court costs and assessments.
- id: 59
  category: driver_responsibility
  question: In the Delaware point system, a driver's license will be suspended for
    4 months once the point total reaches what level?
  choices:
    A: 10 points
    B: 12 points
    C: 14 points
    D: 16 points
  answer: C
  explanation: A mandatory 4-month suspension is triggered when a driver reaches 14
    points on their record.
- id: 60
  category: driver_responsibility
  question: What is the minimum fine for a first offense of operating a vehicle without
    the required insurance in Delaware?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: The fine for a first offense of driving without insurance in Delaware
    ranges from $1,500 to $2,000.
- id: 61
  category: driver_responsibility
  question: When purchasing a vehicle from another person, within how many days must
    the title be transferred to the new owner in Delaware?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: The purchaser of a vehicle must apply for a new title within 30 days
    of the purchase date to avoid a late fee.
- id: 62
  category: driver_responsibility
  question: For a first DUI offense in Delaware with a BAC between .08 and .15, what
    is the typical length of license revocation?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: A first-offense DUI conviction with a BAC in the .08 to .15 range results
    in a 12-month revocation of driving privileges.
- id: 63
  category: driver_responsibility
  question: In Delaware, what is the minimum fine for a first offense of parking in
    a designated handicapped parking space without a valid permit?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: B
  explanation: The minimum fine for a first offense of illegally parking in a handicapped
    space in Delaware is $100.
- id: 64
  category: driver_responsibility
  question: 'In Delaware, the police must be notified of an accident if the property
    damage appears to be at least:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: According to the Delaware Driver Manual, the police must be notified
    of any accident involving a motor vehicle which results in property damage to
    an apparent extent of $1,500 or more.
- id: 65
  category: driver_responsibility
  question: When purchasing a vehicle from a private party in Delaware, within how
    many days must the purchaser apply for a new certificate of title?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The purchaser of a vehicle must apply for a new certificate of title
    at the DMV within 30 days of the purchase date.
- id: 66
  category: driver_responsibility
  question: Which of the following is required to register a vehicle in Delaware?
  choices:
    A: Proof of any valid US auto insurance
    B: Proof of Delaware liability insurance
    C: A notarized letter from an employer
    D: A valid passport
  answer: B
  explanation: To register a vehicle in Delaware, you must provide proof of Delaware
    liability insurance. Insurance policies from other states are not accepted for
    registration.
- id: 67
  category: driver_responsibility
  question: If you cancel your auto insurance in Delaware, what must you do with your
    license plate?
  choices:
    A: Keep it until you get new insurance
    B: Destroy it immediately
    C: Surrender it to the DMV immediately
    D: Transfer it to a friend
  answer: C
  explanation: If you cancel your insurance, you must surrender your license plate
    to the DMV immediately. Failure to do so can result in the suspension of your
    registration and driver's license.
- id: 68
  category: driver_responsibility
  question: 'If you strike an unattended vehicle in Delaware and cannot find the owner,
    you must:'
  choices:
    A: Wait for 2 hours for the owner to return
    B: Leave a note with your information and notify the nearest police station
    C: Only leave a note with your phone number
    D: Drive away if there is no visible damage
  answer: B
  explanation: Delaware law requires you to either locate the owner or leave a written
    notice in a conspicuous place and notify the nearest police station.
- id: 69
  category: driver_responsibility
  question: In Delaware, most standard vehicle registrations can be renewed for which
    of the following periods?
  choices:
    A: 6 months or 1 year
    B: 1 year or 2 years
    C: 3 years or 5 years
    D: 1 year only
  answer: B
  explanation: Standard vehicle registrations in Delaware may be renewed for either
    one or two years.
- id: 70
  category: driver_responsibility
  question: The Delaware DMV conducts a random audit program to verify which of the
    following?
  choices:
    A: Vehicle mileage
    B: Voter registration status
    C: Valid auto insurance
    D: Window tint percentage
  answer: C
  explanation: The DMV conducts a random audit of all vehicles registered in Delaware
    to verify that they are continuously insured. Failure to respond or provide proof
    results in suspension.
- id: 71
  category: driver_responsibility
  question: 'Before a vehicle can be registered or have its registration renewed in
    Delaware, it must pass:'
  choices:
    A: A road test
    B: A safety and emissions inspection
    C: A background check of the owner
    D: A weight station check
  answer: B
  explanation: All vehicles registered in Delaware must pass a safety inspection,
    and most vehicles must also pass an exhaust emissions test.
- id: 72
  category: driver_responsibility
  question: 'In Delaware, you are required to report an accident to the police immediately
    if it involves:'
  choices:
    A: A driver who has a learner's permit
    B: Any injury or death
    C: A vehicle older than 10 years
    D: A flat tire
  answer: B
  explanation: Delaware law requires immediate reporting of any accident resulting
    in injury or death to any person, regardless of the amount of property damage.
- id: 73
  category: driver_responsibility
  question: What is the late fee in Delaware for failing to apply for a title transfer
    within 30 days of purchase?
  choices:
    A: $10
    B: $25
    C: $35
    D: $50
  answer: C
  explanation: A late fee of $35 is charged if the application for a certificate of
    title is made after the 30-day legal limit.
- id: 74
  category: driver_responsibility
  question: Where must the registration card be kept in a Delaware-registered vehicle?
  choices:
    A: In the driver's wallet at all times
    B: In the vehicle at all times
    C: At the owner's residence
    D: In the trunk
  answer: B
  explanation: Under Delaware law, the registration card must be carried in the vehicle
    at all times while it is being operated.
- id: 75
  category: safe_driving_rules
  question: When parking near an intersection in Delaware, you must be at least how
    many feet away from any stop sign or traffic signal?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Delaware law prohibits parking within 30 feet of any flashing beacon,
    stop sign, or traffic control signal located at the side of a roadway.
- id: 76
  category: safe_driving_rules
  question: 'Under Delaware law, you are required to turn on your headlights whenever
    you are using your:'
  choices:
    A: Hazard lights
    B: Windshield wipers
    C: High beams
    D: Cruise control
  answer: B
  explanation: Delaware law requires drivers to turn on their headlights when windshield
    wipers are in use due to rain, snow, or sleet.
- id: 77
  category: safe_driving_rules
  question: In Delaware, you are prohibited from passing another vehicle when you
    are within how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: You must not pass another vehicle when approaching within 100 feet
    of an intersection or a railroad crossing.
- id: 78
  category: safe_driving_rules
  question: 'When driving on a multi-lane highway in Delaware, such as I-95 or SR-1,
    the left lane is intended for:'
  choices:
    A: Cruising at the speed limit
    B: Passing only
    C: Emergency vehicles only
    D: Vehicles with more than two passengers
  answer: B
  explanation: Delaware law requires drivers to stay in the right lane except when
    overtaking and passing another vehicle.
- id: 79
  category: safe_driving_rules
  question: 'You should not make a U-turn on a curve or hill in Delaware if your vehicle
    cannot be seen by other drivers approaching from either direction within:'
  choices:
    A: 300 feet
    B: 400 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Delaware law prohibits U-turns where the driver cannot see 500 feet
    in each direction.
- id: 80
  category: safe_driving_rules
  question: 'To maintain a safe following distance in Delaware, the driver manual
    recommends following the vehicle in front of you by at least:'
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: One car length for every 10 mph
  answer: B
  explanation: The Delaware Driver Manual recommends a following distance of at least
    three seconds under normal conditions.
- id: 81
  category: safe_driving_rules
  question: On a Delaware roadway with four or more lanes (such as Route 13), which
    traffic must stop when a school bus is stopped with red lights flashing and the
    stop arm extended?
  choices:
    A: Traffic in all lanes and directions
    B: Only traffic following the bus
    C: Only traffic in the lane immediately next to the bus
    D: No traffic is required to stop if there is a median
  answer: B
  explanation: In Delaware, on a roadway with four or more lanes, only traffic following
    the bus must stop. Traffic approaching from the opposite direction does not stop
    but should proceed with caution.
- id: 82
  category: safe_driving_rules
  question: 'In Delaware, you must report a crash to the police immediately if the
    estimated property damage is at least:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Delaware law requires reporting any accident involving property damage
    of $1,500 or more to the police.
- id: 83
  category: safe_driving_rules
  question: Under Delaware law, you are prohibited from parking within how many feet
    of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Delaware law states that you must not park within 15 feet of a fire
    hydrant.
- id: 84
  category: safe_driving_rules
  question: In Delaware, how far must you park away from a stop sign, flashing beacon,
    or traffic control signal?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: You are not permitted to park within 30 feet of any flashing beacon,
    stop sign, or traffic-control signal located at the side of a roadway.
- id: 85
  category: safe_driving_rules
  question: When parking near an intersection in Delaware, what is the minimum distance
    you must maintain from a crosswalk?
  choices:
    A: 15 feet
    B: 20 feet
    C: 25 feet
    D: 30 feet
  answer: B
  explanation: Delaware regulations prohibit parking within 20 feet of a crosswalk
    at an intersection.
- id: 86
  category: safe_driving_rules
  question: In Delaware, when you are parallel parked, your tires must be within how
    many inches of the curb?
  choices:
    A: 6 inches
    B: 10 inches
    C: 12 inches
    D: 18 inches
  answer: C
  explanation: When parking along the curb, Delaware law requires your wheels to be
    within 12 inches of the curb.
- id: 87
  category: safe_driving_rules
  question: According to the Delaware Driver Manual, what is the recommended following
    distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: Delaware recommends a 'three-second rule' to maintain a safe following
    distance behind other vehicles.
- id: 88
  category: safe_driving_rules
  question: What happens to traffic violation fines in Delaware when the offense is
    committed in a designated work zone?
  choices:
    A: Fines are reduced by half
    B: Fines remain the same
    C: Fines are doubled
    D: Fines are tripled
  answer: C
  explanation: In Delaware, fines for speeding and other traffic violations are doubled
    when they occur in a work zone.
- id: 89
  category: safe_driving_rules
  question: Delaware's 'Move Over' law requires drivers to change lanes or slow down
    when approaching which of the following stopped on the shoulder?
  choices:
    A: Only police cars
    B: Only ambulances and fire trucks
    C: Any vehicle with flashing hazard lights
    D: Emergency vehicles, tow trucks, and utility vehicles with flashing lights
  answer: D
  explanation: Delaware's Move Over Law applies to emergency vehicles, tow trucks,
    and utility vehicles (like DelDOT or electric company trucks) that are stopped
    with their lights flashing.
- id: 90
  category: safe_driving_rules
  question: In Delaware, you must dim your high beam headlights when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Delaware law requires you to dim your high beams when you are within
    500 feet of an oncoming vehicle.
- id: 91
  category: safe_driving_rules
  question: Under Delaware law, it is illegal to use a handheld cell phone while driving.
    Which of the following is true?
  choices:
    A: It is only illegal for drivers under 18
    B: It is legal if you are stopped at a red light
    C: It is illegal for all drivers to use a handheld device while the vehicle is
      in motion
    D: It is legal on highways but not in cities
  answer: C
  explanation: In Delaware, the use of handheld cell phones while driving is prohibited
    for all drivers. This includes talking, texting, or browsing while the vehicle
    is in motion.
- id: 92
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, Delaware law
    and safety guidelines suggest you should look how far ahead?
  choices:
    A: 5 to 8 seconds
    B: 10 to 12 seconds
    C: 15 to 20 seconds
    D: 25 to 30 seconds
  answer: B
  explanation: Delaware safety guidelines state that drivers should look at least
    10 to 12 seconds ahead of their vehicle to identify potential hazards early.
- id: 93
  category: defensive_driving
  question: 'In Delaware, you must dim your high beams when following another vehicle
    from behind within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: According to the Delaware Driver's Manual, you should use your low
    beams when following another vehicle within 200 feet.
- id: 94
  category: defensive_driving
  question: At what speed can hydroplaning begin in Delaware, causing tires to lose
    some contact with the road surface?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Delaware Driver's Manual warns that hydroplaning can start at speeds
    as low as 35 mph, and at 50 mph, tires may lose all contact with the road.
- id: 95
  category: defensive_driving
  question: If you are driving in heavy fog in Delaware, which set of lights should
    you use for the best visibility?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Emergency flashers
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    fog and actually decrease visibility.
- id: 96
  category: defensive_driving
  question: 'If your vehicle is equipped with Anti-lock Braking System (ABS) and you
    need to stop quickly on a slippery Delaware road, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Press the brake pedal hard and hold it
    C: Lightly tap the brakes
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: The Delaware Driver's Manual instructs drivers with ABS to press the
    brake pedal hard and keep it depressed; the system will automatically pump the
    brakes for you.
- id: 97
  category: defensive_driving
  question: When changing lanes in Delaware, what is the most effective way to check
    your 'blind spots'?
  choices:
    A: Look in your rearview mirror
    B: Look in your side mirrors
    C: Turn your head and look over your shoulder
    D: Check your backup camera
  answer: C
  explanation: Mirrors do not show everything; Delaware guidelines state you must
    turn your head and look over your shoulder in the direction you plan to move to
    check blind spots.
- id: 98
  category: defensive_driving
  question: Under Delaware's safety guidelines, how should you adjust your following
    distance when driving on slippery roads or in poor visibility?
  choices:
    A: Keep it at four seconds
    B: Increase it to six seconds or more
    C: Decrease it to two seconds to stay close to the car ahead
    D: Following distance does not need to change if you have winter tires
  answer: B
  explanation: Delaware recommends increasing your following distance to six seconds
    or more during adverse conditions like rain, snow, or ice to allow for longer
    stopping distances.
- id: 99
  category: defensive_driving
  question: When approaching an intersection in Delaware, in what order should you
    scan for traffic?
  choices:
    A: Right, then left, then right again
    B: Left, then right, then left again
    C: Straight ahead only
    D: Only in the direction of oncoming traffic
  answer: B
  explanation: 'Delaware''s manual teaches the ''Left, Right, Left'' rule: look left
    first (as traffic from the left is closer), then right, then left again just before
    entering the intersection.'
- id: 100
  category: defensive_driving
  question: In Delaware, if you are driving at night and your high beams allow you
    to see 350 feet ahead, what is the maximum safe speed you should drive to avoid
    'overdriving' your headlights?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: Delaware safety manuals suggest that at 50 mph, it takes about 400
    feet to come to a complete stop; therefore, driving faster than 50 mph with headlights
    only reaching 350 feet is 'overdriving' your lights.
- id: 101
  category: defensive_driving
  question: When driving on a Delaware highway with three or more lanes, which lane
    is generally the smoothest for through traffic?
  choices:
    A: The left lane
    B: The right lane
    C: The middle lane
    D: The shoulder
  answer: C
  explanation: The Delaware Driver's Manual suggests the middle lane is usually the
    smoothest for through traffic, as the right lane is for slower traffic/merging
    and the left lane is for passing.
- id: 102
  category: defensive_driving
  question: 'To avoid last-minute braking or the need to turn suddenly, Delaware law
    suggests you should look ahead of your vehicle at least:'
  choices:
    A: 3 to 5 seconds
    B: 5 to 8 seconds
    C: 10 to 12 seconds
    D: 20 to 25 seconds
  answer: C
  explanation: The Delaware Driver Manual states that scanning 10 to 12 seconds ahead
    allows you to see hazards early and provides enough time to react safely.
- id: 103
  category: defensive_driving
  question: 'When driving at night in Delaware, you must dim your high beam headlights
    when an oncoming vehicle is within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Delaware law requires drivers to switch to low beams when an oncoming
    vehicle is within 500 feet to prevent blinding the other driver.
- id: 104
  category: defensive_driving
  question: 'In Delaware, hydroplaning (where tires lose contact with the road and
    ride on a thin film of water) can begin at speeds as low as:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Delaware Driver Manual warns that hydroplaning can start at speeds
    as low as 35 mph, and in a heavy rain, your tires can lose all contact with the
    road at 55 mph.
- id: 105
  category: defensive_driving
  question: When driving in fog, which headlight setting should you use in Delaware
    to ensure maximum visibility and safety?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights are required during daytime fog
  answer: B
  explanation: You should use low beams in fog because high beams reflect off the
    water droplets in the fog, causing glare and making it harder to see.
- id: 106
  category: defensive_driving
  question: 'In Delaware, completing a state-approved defensive driving course entitles
    a driver to a mandatory insurance premium reduction of:'
  choices:
    A: 5% for two years
    B: 10% for three years
    C: 15% for one year
    D: 20% for five years
  answer: B
  explanation: Delaware law mandates that insurance companies provide a 10% discount
    on the liability portion of automobile insurance for three years upon completion
    of an approved defensive driving course.
- id: 107
  category: defensive_driving
  question: 'When scanning ahead in a city environment, the Delaware Driver Manual
    recommends looking at least:'
  choices:
    A: One block ahead
    B: Two blocks ahead
    C: Three blocks ahead
    D: Half a mile ahead
  answer: A
  explanation: In the city, looking 10 to 12 seconds ahead corresponds to approximately
    one city block.
- id: 108
  category: defensive_driving
  question: According to the Delaware Driver Manual, at 55 mph, it takes about how
    many feet to react and bring your vehicle to a complete stop?
  choices:
    A: 100 feet
    B: 150 feet
    C: 225 feet
    D: 400 feet
  answer: C
  explanation: At 55 mph, the total stopping distance (including reaction time and
    braking distance) is approximately 225 feet.
- id: 109
  category: defensive_driving
  question: 'When sharing the road with large trucks, Delaware drivers should be aware
    of ''No-Zones.'' These are:'
  choices:
    A: Areas where trucks are not allowed to drive
    B: Blind spots where the truck driver cannot see your vehicle
    C: Special lanes reserved for emergency vehicles
    D: Speed-restricted zones for commercial vehicles
  answer: B
  explanation: No-Zones are the large blind spots around a truck (front, back, and
    sides) where your car disappears from the truck driver's view, increasing the
    risk of a collision.
- id: 110
  category: alcohol_drugs_health
  question: Under Delaware's 'Implied Consent' law, what does a driver agree to by
    operating a motor vehicle?
  choices:
    A: To maintain full coverage insurance at all times
    B: To submit to a chemical test of breath, blood, or urine if suspected of driving
      under the influence
    C: To allow police to search their vehicle without a warrant
    D: To carry their registration and proof of insurance in the glove box
  answer: B
  explanation: Delaware's Implied Consent law means that any person who operates a
    motor vehicle is deemed to have given consent to a chemical test to determine
    the presence of alcohol or drugs.
- id: 111
  category: alcohol_drugs_health
  question: In Delaware, what is the license revocation period for a first-offense
    DUI conviction if the driver's BAC was less than 0.15?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: For a first DUI offense in Delaware with a BAC below 0.15, the license
    revocation period is 12 months.
- id: 112
  category: alcohol_drugs_health
  question: 'In Delaware, if you refuse to submit to a chemical test for alcohol or
    drugs (first offense), your license will be revoked for:'
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: Under the Implied Consent law, a first-time refusal of a chemical test
    results in a 12-month license revocation.
- id: 113
  category: alcohol_drugs_health
  question: Under Delaware's Zero Tolerance Law, a driver under 21 who is found with
    a BAC of 0.02 or higher will have their license revoked for how long for a first
    offense?
  choices:
    A: 30 days
    B: 2 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: For drivers under 21, a first Zero Tolerance violation results in a
    2-month license revocation.
- id: 114
  category: alcohol_drugs_health
  question: In Delaware, what is the minimum fine for a first-offense DUI conviction?
  choices:
    A: $250
    B: $575
    C: $1,000
    D: $2,300
  answer: B
  explanation: The fine for a first-offense DUI in Delaware ranges from $575 to $2,300.
- id: 115
  category: alcohol_drugs_health
  question: Which of the following is true regarding the Ignition Interlock Device
    (IID) program in Delaware?
  choices:
    A: It is only required for third-offense DUI drivers
    B: It is optional for all DUI offenders
    C: All DUI offenders are required to have an IID installed to regain driving privileges
    D: It is only required if the BAC was above 0.20
  answer: C
  explanation: Delaware law requires all DUI offenders (including first offenders)
    to participate in the Ignition Interlock Device program to obtain a conditional
    license or reinstate their driving privileges.
- id: 116
  category: alcohol_drugs_health
  question: In Delaware, if you are convicted of a DUI while transporting a child
    under the age of 17, what is the additional penalty?
  choices:
    A: There is no additional penalty
    B: An additional fine and possible community service
    C: Automatic permanent revocation of your license
    D: Mandatory 30-day jail sentence
  answer: B
  explanation: Transporting a child while under the influence is an aggravating factor
    in Delaware, leading to additional fines and potential community service.
- id: 117
  category: alcohol_drugs_health
  question: How many days does a Delaware driver have to request an administrative
    hearing with the DMV after being arrested for a DUI?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: A driver has 15 days from the date of the DUI arrest to request an
    administrative hearing to contest the license revocation.
- id: 118
  category: alcohol_drugs_health
  question: What is the only way to effectively reduce the blood alcohol concentration
    (BAC) in your body?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Time
    D: Exercising vigorously
  answer: C
  explanation: Time is the only factor that can lower BAC. The body metabolizes alcohol
    at a steady rate that cannot be accelerated by coffee, food, or showers.
- id: 119
  category: alcohol_drugs_health
  question: 'In Delaware, if you are taking a prescription drug and it impairs your
    driving, you can:'
  choices:
    A: Not be charged with DUI because the drug was legal
    B: Be charged with DUI just as if you were drinking alcohol
    C: Only be charged if you also have alcohol in your system
    D: Be charged with a minor traffic violation only
  answer: B
  explanation: Under Delaware law, driving under the influence of any drug—whether
    prescription, over-the-counter, or illegal—that impairs your ability to drive
    is a DUI offense.
- id: 120
  category: alcohol_drugs_health
  question: What happens if a Delaware driver is convicted of a second DUI offense
    within 5 years of the first?
  choices:
    A: License revocation for 12 months
    B: License revocation for 18 months
    C: License revocation for 24 months
    D: License revocation for 60 months
  answer: C
  explanation: A second DUI offense within 5 years results in a 24-month license revocation
    in Delaware, regardless of the BAC level.
- id: 121
  category: alcohol_drugs_health
  question: According to the Delaware Driver's Manual, what effect does mixing alcohol
    and drugs (synergism) have on a driver?
  choices:
    A: The effects of the drug are canceled out by the alcohol
    B: The effects of the alcohol are canceled out by the drug
    C: The combined effect is much greater than the sum of the parts
    D: There is no measurable difference in impairment
  answer: C
  explanation: Mixing alcohol and drugs creates a synergistic effect, meaning the
    impairment is significantly worse than if either substance were used alone.
- id: 122
  category: alcohol_drugs_health
  question: In Delaware, if you have a medical condition that causes a loss of consciousness
    (like epilepsy), you must be seizure-free for how long before you can be licensed?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Delaware generally requires individuals with conditions causing loss
    of consciousness to be free from such episodes for at least 6 months before they
    can drive.
- id: 123
  category: alcohol_drugs_health
  question: If a Delaware driver is convicted of a first-offense 'Zero Tolerance'
    violation (under age 21 with a BAC of .01 or higher), how long will their license
    be revoked?
  choices:
    A: 30 days
    B: 2 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: Under Delaware's Zero Tolerance law, a first offense for a driver under
    21 results in a 2-month license revocation.
- id: 124
  category: alcohol_drugs_health
  question: In Delaware, an Ignition Interlock Device (IID) is mandatory for a first-offense
    DUI if the driver's Blood Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: '0.08'
    B: '0.10'
    C: '0.15'
    D: '0.20'
  answer: C
  explanation: Delaware law requires the installation of an Ignition Interlock Device
    (IID) for a first-offense DUI if the offender's BAC is 0.15 or higher.
- id: 125
  category: alcohol_drugs_health
  question: According to the Delaware Driver Manual, what is the first faculty to
    be affected by the consumption of alcohol?
  choices:
    A: Vision
    B: Muscle coordination
    C: Judgment
    D: Speech
  answer: C
  explanation: Alcohol reaches the brain almost immediately. The first faculty to
    be affected is a person's judgment, followed by their reflexes and coordination.
- id: 126
  category: alcohol_drugs_health
  question: If a Delaware driver is under 21 and is convicted of purchasing or possessing
    alcohol, even if not driving, their license will be revoked for how long for a
    first offense?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: A
  explanation: In Delaware, any person under 21 who is convicted of purchasing or
    possessing alcohol faces a 30-day license revocation for a first offense.
- id: 127
  category: alcohol_drugs_health
  question: Which of the following statements about drugs and driving is true according
    to Delaware law?
  choices:
    A: Only illegal drugs can result in a DUI charge
    B: Prescription drugs are always safe to use while driving
    C: Over-the-counter cold medicines cannot affect driving ability
    D: A driver can be charged with DUI for being under the influence of any drug,
      including prescription and over-the-counter medications
  answer: D
  explanation: In Delaware, a DUI charge can apply to any substance that impairs driving,
    including illegal drugs, prescription medications, and over-the-counter drugs.
- id: 128
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' mentioned in the Delaware Driver Manual
    regarding alcohol and drugs?
  choices:
    A: The effect of alcohol wearing off faster when taking medicine
    B: The combined effect of alcohol and drugs being greater than the sum of their
      parts
    C: The ability of the body to process alcohol more efficiently with food
    D: The legal limit for BAC being higher if medication is present
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs (even legal ones)
    are taken together, causing a much more severe impact on the central nervous system
    than either would alone.
- id: 129
  category: alcohol_drugs_health
  question: In Delaware, how many hours does it typically take for the body to eliminate
    the alcohol contained in one standard drink?
  choices:
    A: 30 minutes
    B: 1 hour
    C: 2 hours
    D: 5 hours
  answer: B
  explanation: The body chemically breaks down alcohol at a steady rate. It takes
    about one hour for the body to get rid of the alcohol in one standard drink (e.g.,
    12 oz beer, 5 oz wine, or 1.5 oz shot).
- id: 130
  category: alcohol_drugs_health
  question: If a driver is convicted of a DUI in Delaware and had a minor (under age
    18) in the vehicle at the time of the offense, what happens?
  choices:
    A: The fine is waived if the driver attends counseling
    B: The driver faces additional fines and a longer period of revocation
    C: The driver's license is permanently revoked
    D: The driver is only charged with a passenger violation
  answer: B
  explanation: In Delaware, having a minor in the vehicle during a DUI offense is
    an aggravating factor that results in additional penalties, including higher fines
    and extended license revocation periods.
- id: 131
  category: alcohol_drugs_health
  question: Which of the following is NOT a factor that determines a person's Blood
    Alcohol Concentration (BAC)?
  choices:
    A: The amount of alcohol consumed
    B: The person's body weight
    C: The type of alcoholic beverage (e.g., beer vs. vodka)
    D: The amount of time over which the alcohol was consumed
  answer: C
  explanation: BAC is determined by the amount of alcohol, body weight, and time.
    The 'type' of drink doesn't matter as much as the actual alcohol content; a standard
    beer, glass of wine, and shot of liquor all contain roughly the same amount of
    alcohol.
- id: 132
  category: alcohol_drugs_health
  question: In Delaware, if you are involved in a crash resulting in injury or death,
    you must submit to a chemical test. If you refuse, how long is the revocation
    period for a first offense?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: D
  explanation: While a standard first-offense refusal is 12 months, Delaware law specifies
    that if a driver refuses a chemical test after a crash involving injury or death,
    the revocation period is 24 months for a first offense.
- id: 133
  category: penalties_and_points
  question: Under the Delaware point system, what action is taken by the DMV when
    a driver reaches 12 points on their record?
  choices:
    A: An advisory letter is sent to the driver
    B: The driver's license is suspended for 2 months
    C: The driver must attend a driver improvement interview
    D: The driver's license is revoked for 1 year
  answer: C
  explanation: In Delaware, reaching 12 points requires the driver to attend a driver
    improvement interview. An advisory letter is sent at 8 points.
- id: 134
  category: penalties_and_points
  question: If a Delaware driver accumulates 14 points on their record, for how long
    will their driving privileges be suspended?
  choices:
    A: 2 months
    B: 4 months
    C: 6 months
    D: 12 months
  answer: B
  explanation: In Delaware, accumulating 14 points results in a mandatory 4-month
    license suspension.
- id: 135
  category: penalties_and_points
  question: What is the mandatory license suspension period for a Delaware driver
    convicted of 'Speed Exhibitions' (racing) on a highway?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Delaware law mandates a 6-month license suspension for any person convicted
    of racing or speed exhibitions.
- id: 136
  category: penalties_and_points
  question: For a first-offense DUI conviction in Delaware with a BAC of less than
    0.15, how long is the driver's license revoked?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: A first-offense DUI conviction with a BAC below 0.15 results in a 12-month
    revocation. Higher BAC levels result in longer revocations (18 or 24 months).
- id: 137
  category: penalties_and_points
  question: In the Delaware point system, how many points are assessed for a 'Failure
    to Yield Right of Way' violation?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: A violation for failing to yield the right of way carries a 3-point
    penalty in Delaware.
- id: 138
  category: penalties_and_points
  question: In Delaware, what is the fine for a first-offense conviction of operating
    a vehicle that is not covered by the required insurance?
  choices:
    A: $500 to $1,000
    B: $1,000 to $1,500
    C: $1,500 to $2,000
    D: $2,500 to $4,000
  answer: C
  explanation: Operating an uninsured vehicle for the first time in Delaware carries
    a fine of $1,500 to $2,000 and a mandatory 6-month license suspension.
- id: 139
  category: penalties_and_points
  question: At what point threshold does a Delaware driver face a mandatory 12-month
    license suspension?
  choices:
    A: 18 points
    B: 20 points
    C: 22 points
    D: 24 points
  answer: C
  explanation: In Delaware, reaching 22 points on a driving record results in a mandatory
    12-month (1 year) license suspension.
- id: 140
  category: penalties_and_points
  question: In Delaware, children must be properly secured in a child restraint system
    until they reach what age or weight?
  choices:
    A: 6 years old or 50 lbs
    B: 7 years old or 60 lbs
    C: 8 years old or 65 lbs
    D: 10 years old or 80 lbs
  answer: C
  explanation: Delaware law requires children to be in a child restraint system until
    they are 8 years old OR weigh 65 lbs.
- id: 141
  category: penalties_and_points
  question: Under Delaware's Habitual Offender law, a person's license may be revoked
    if they are convicted of how many 'major' traffic offenses within a 5-year period?
  choices:
    A: '2'
    B: '3'
    C: '5'
    D: '10'
  answer: B
  explanation: The Habitual Offender law applies to drivers who commit 3 major traffic
    offenses (like DUI or reckless driving) within a 5-year period.
- id: 142
  category: penalties_and_points
  question: In Delaware, what is the reinstatement fee for a driver's license that
    was revoked for a DUI-related offense?
  choices:
    A: $25
    B: $50
    C: $143.75
    D: $200
  answer: D
  explanation: While a standard reinstatement fee is lower, Delaware charges a $200
    fee to reinstate a license revoked for alcohol-related offenses.
- id: 143
  category: penalties_and_points
  question: In Delaware, reaching 16 points on your driving record will result in
    a mandatory license suspension of how many months?
  choices:
    A: 4 months
    B: 6 months
    C: 8 months
    D: 12 months
  answer: B
  explanation: According to the Delaware point system, accumulating 16 points leads
    to a mandatory 6-month license suspension.
- id: 144
  category: sharing_the_road
  question: In Delaware, if you are on a roadway with four or more lanes, when are
    you required to stop for a school bus with its red lights flashing and stop arm
    extended?
  choices:
    A: Only if you are traveling in the same direction as the bus
    B: Only if you are traveling in the opposite direction of the bus
    C: You must stop regardless of which direction you are traveling
    D: You only need to stop if there is no physical median
  answer: A
  explanation: According to the Delaware Driver's Manual, on a roadway with four or
    more lanes, you must stop only if you are traveling in the same direction as the
    bus.
- id: 145
  category: sharing_the_road
  question: When passing a bicyclist in Delaware, what is the minimum amount of space
    a motorist must maintain between their vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Delaware law requires motorists to leave a safe distance when passing
    a bicycle, which is defined as not less than 3 feet.
- id: 146
  category: sharing_the_road
  question: Under Delaware law, who is required to wear a safety helmet while operating
    or riding on a motorcycle?
  choices:
    A: Every person regardless of age
    B: Only persons under the age of 19 or those who have held a license for less
      than two years
    C: Only persons under the age of 21
    D: No one is legally required to wear a helmet in Delaware
  answer: B
  explanation: In Delaware, every person up to 19 years of age must wear a helmet.
    Additionally, any person who has held a motorcycle endorsement or license for
    less than two years must also wear a helmet.
- id: 147
  category: sharing_the_road
  question: When driving near a large commercial truck, what is the 'No-Zone'?
  choices:
    A: The area where trucks are prohibited from driving
    B: The blind spots around the front, back, and sides of the truck where the driver
      cannot see you
    C: The lane designated specifically for passing trucks
    D: The area directly in front of the truck only
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck. If you
    cannot see the truck driver's face in their side-view mirror, they cannot see
    you.
- id: 148
  category: sharing_the_road
  question: In Delaware, when a pedestrian is in an unmarked crosswalk at an intersection,
    who has the right-of-way?
  choices:
    A: The motorist, because there are no painted lines
    B: The pedestrian
    C: Whoever arrives at the intersection first
    D: The motorist, but only if they use their horn
  answer: B
  explanation: Delaware law states that drivers must yield the right-of-way to pedestrians
    crossing the highway within any marked or unmarked crosswalk at an intersection.
- id: 149
  category: sharing_the_road
  question: Which of the following is true regarding bicyclists' rights on Delaware
    roads?
  choices:
    A: Bicyclists must always ride on the sidewalk
    B: Bicyclists have the same rights and must obey the same laws as motor vehicle
      operators
    C: Bicyclists always have the right-of-way over cars at all times
    D: Bicyclists are not allowed on any public roads in Delaware
  answer: B
  explanation: In Delaware, a person riding a bicycle has all the rights and all the
    duties applicable to the driver of a vehicle, with certain exceptions.
- id: 150
  category: sharing_the_road
  question: 'For a first offense of passing a stopped school bus with red lights flashing
    in Delaware, the fine shall be at least:'
  choices:
    A: $50
    B: $115
    C: $500
    D: $1,000
  answer: B
  explanation: Under Delaware Title 21 § 4166, the fine for a first offense of passing
    a stopped school bus is not less than $115 nor more than $230.
- id: 151
  category: sharing_the_road
  question: When an emergency vehicle with sirens and flashing lights is approaching
    from behind, what should a Delaware driver do?
  choices:
    A: Speed up to stay ahead of the vehicle
    B: Stop immediately in the current lane of travel
    C: Pull over to the right edge of the roadway and stop until the vehicle has passed
    D: Pull over to the left median and stop
  answer: C
  explanation: Upon the approach of an authorized emergency vehicle, drivers must
    yield the right-of-way and immediately drive to a position parallel to, and as
    close as possible to, the right-hand edge or curb of the highway.
- id: 152
  category: sharing_the_road
  question: 'In Delaware, if you see a pedestrian carrying a white cane or using a
    guide dog, you must:'
  choices:
    A: Honk to alert them of your presence
    B: Yield the right-of-way and take precautions to avoid injury
    C: Pass them quickly to avoid confusing the dog
    D: Only stop if they are in a marked crosswalk
  answer: B
  explanation: Delaware law requires drivers to yield the right-of-way to any totally
    or partially blind pedestrian carrying a white cane or using a guide dog.
- id: 153
  category: sharing_the_road
  question: 'To provide a safe following distance behind a motorcycle, the Delaware
    Driver''s Manual suggests a minimum gap of at least:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 5 seconds
    D: 10 seconds
  answer: B
  explanation: The Delaware Driver's Manual recommends a following distance of at
    least 2 seconds for all vehicles under ideal conditions, though it notes that
    more space is safer when following motorcycles.
- id: 154
  category: sharing_the_road
  question: When riding a bicycle on a Delaware roadway, in which direction should
    the bicyclist travel?
  choices:
    A: Facing oncoming traffic
    B: In the same direction as motor vehicle traffic
    C: On the left side of the road only
    D: Against the flow of traffic to see cars better
  answer: B
  explanation: Bicyclists are required to ride with the flow of traffic, just like
    motor vehicles.
- id: 155
  category: sharing_the_road
  question: Why should you avoid 'sandwiching' your vehicle between a truck and the
    curb when the truck is approaching an intersection?
  choices:
    A: Trucks often need to swing wide to the left to make a right turn
    B: Trucks are required by law to turn from the center lane
    C: Trucks have a shorter stopping distance than cars
    D: It is illegal to drive in the lane next to a truck
  answer: A
  explanation: Large trucks often need to swing wide to the left to clear the curb
    when making a right turn. If you try to pass on the right, you may be squeezed
    between the truck and the curb.
- id: 156
  category: sharing_the_road
  question: 'In Delaware, vehicles in a funeral procession that are following a lead
    vehicle with its lights on:'
  choices:
    A: Must yield to all other traffic at intersections
    B: May proceed through a red light or stop sign if the lead vehicle has entered
      the intersection lawfully
    C: Must stop at all red lights regardless of the lead vehicle's position
    D: Are only allowed to drive on the shoulder of the road
  answer: B
  explanation: Delaware law (Title 21 § 4124) allows vehicles in a funeral procession
    to follow the lead vehicle through an intersection despite a traffic control device,
    provided they exercise due care.
- id: 157
  category: sharing_the_road
  question: 'If you are walking along a Delaware highway where there are no sidewalks,
    you should walk:'
  choices:
    A: On the right side with the flow of traffic
    B: On the left side facing oncoming traffic
    C: In the center of the lane to be more visible
    D: Only during daylight hours
  answer: B
  explanation: When sidewalks are not provided, pedestrians shall walk only on the
    left side of the roadway or its shoulder facing traffic which may approach from
    the opposite direction.
- id: 158
  category: sharing_the_road
  question: When passing a bicycle traveling in the same direction on a Delaware roadway,
    how much space must a motorist maintain between their vehicle and the bicycle?
  choices:
    A: At least 1 foot
    B: At least 2 feet
    C: At least 3 feet
    D: At least 5 feet
  answer: C
  explanation: Delaware law requires motorists to leave a minimum of three feet of
    clearance when passing a bicyclist.
- id: 159
  category: sharing_the_road
  question: Under the 'Delaware Yield' law, how should a bicyclist approach a stop
    sign when no other traffic is present at the intersection?
  choices:
    A: They must come to a complete stop and wait 3 seconds
    B: They may slow down and proceed through the stop sign without stopping
    C: They must stop and dismount the bicycle
    D: They must stop and wait for a green light
  answer: B
  explanation: The Delaware Yield law allows bicyclists to treat stop signs as yield
    signs, meaning they can proceed without stopping if it is safe to do so and there
    is no cross traffic.
- id: 160
  category: sharing_the_road
  question: In Delaware, what is the helmet requirement for motorcycle operators and
    passengers 19 years of age or older?
  choices:
    A: They must wear a helmet at all times
    B: They are not required to have a helmet at all
    C: They must have an approved helmet in their possession on the motorcycle
    D: They only need a helmet when riding on highways
  answer: C
  explanation: In Delaware, every person up to 19 years of age must wear a helmet.
    Those 19 or older must have an approved helmet in their possession, though wearing
    it is optional for that age group.
- id: 161
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the driver may need to:'
  choices:
    A: Stay strictly in the right lane
    B: Swing wide to the left to complete the turn
    C: Speed up to clear the intersection
    D: Turn from the left lane only
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn
    without the rear wheels hitting the curb or other objects.
- id: 162
  category: sharing_the_road
  question: If you are driving and an emergency vehicle with sirens and flashing lights
    approaches from behind, what is the correct action in Delaware?
  choices:
    A: Stop immediately in your lane
    B: Speed up to get out of the way
    C: Pull over to the right edge of the road and stop
    D: Move to the left lane and slow down
  answer: C
  explanation: Delaware law requires drivers to yield the right-of-way by pulling
    as close as possible to the right-hand edge or curb of the roadway and stopping
    until the emergency vehicle has passed.
- id: 163
  category: sharing_the_road
  question: In Delaware, where are the 'No-Zones' of a large truck located?
  choices:
    A: Only directly behind the truck
    B: Only on the left side of the truck
    C: Directly in front, directly behind, and on both sides of the truck
    D: Only in the front of the truck
  answer: C
  explanation: The 'No-Zones' are the large blind spots around a truck where the truck
    driver cannot see other vehicles. These are located in the front, rear, and on
    both sides.
- id: 164
  category: sharing_the_road
  question: 'According to Delaware law, if there are no sidewalks, pedestrians should
    walk:'
  choices:
    A: On the right side of the road with the flow of traffic
    B: On the left side of the road facing oncoming traffic
    C: In the middle of the road
    D: On the shoulder in the same direction as traffic
  answer: B
  explanation: When sidewalks are not provided, pedestrians should walk on the left
    side of the road or its shoulder, facing traffic which approaches from the opposite
    direction.
- id: 165
  category: sharing_the_road
  question: In Delaware, what is the minimum following distance you should maintain
    behind a motorcycle?
  choices:
    A: 2 seconds
    B: 4 seconds
    C: 1 car length
    D: 50 feet
  answer: B
  explanation: The Delaware Driver's Manual recommends a following distance of at
    least 4 seconds behind a motorcycle to allow for sudden maneuvers or stops.
- id: 166
  category: sharing_the_road
  question: What does a reflective orange triangle on the rear of a vehicle signify
    in Delaware?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is a student driver
    C: The vehicle is a slow-moving vehicle (25 mph or less)
    D: The vehicle is an oversized load
  answer: C
  explanation: A reflective orange triangle indicates a slow-moving vehicle, such
    as farm equipment or construction machinery, which travels at speeds of 25 mph
    or less.
- id: 167
  category: sharing_the_road
  question: When a school bus is stopped on a two-lane road with its red lights flashing,
    who must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic in the opposite direction
    C: Traffic in both directions
    D: No one, if the speed limit is over 35 mph
  answer: C
  explanation: On a two-lane road in Delaware, traffic in both directions must stop
    for a school bus with flashing red lights and an extended stop arm.
- id: 168
  category: sharing_the_road
  question: If you are turning right and a bicyclist is to your right and slightly
    ahead of you, what should you do?
  choices:
    A: Speed up and turn in front of the bicyclist
    B: Honk to warn the bicyclist to stop
    C: Yield and let the bicyclist clear the intersection before turning
    D: Force the bicyclist onto the sidewalk
  answer: C
  explanation: Motorists must yield to bicyclists who are traveling straight through
    an intersection before making a right turn.
- id: 169
  category: sharing_the_road
  question: 'In Delaware, pedestrians have the right-of-way in a crosswalk:'
  choices:
    A: Only if the crosswalk is marked with white lines
    B: Only at intersections with traffic lights
    C: In both marked and unmarked crosswalks at intersections
    D: Only during daylight hours
  answer: C
  explanation: Drivers must yield to pedestrians in both marked crosswalks and unmarked
    crosswalks at intersections.
- id: 170
  category: sharing_the_road
  question: 'When following a large truck at night, you should dim your headlights
    because:'
  choices:
    A: The truck's mirrors will reflect the light into the driver's eyes
    B: Truck drivers have better night vision
    C: High beams can damage the truck's reflectors
    D: It is required by law to use parking lights only
  answer: A
  explanation: Bright lights reflecting off the large side mirrors of a truck can
    blind the driver, making it difficult for them to see the road ahead.
- id: 171
  category: vehicle_information
  question: According to Delaware law, when are you required to have your headlights
    turned on?
  choices:
    A: Only between the hours of midnight and 6:00 AM
    B: Whenever you use your windshield wipers
    C: Only when driving on unlit rural roads
    D: Only when visibility is less than 500 feet
  answer: B
  explanation: Delaware law requires headlights to be on when windshield wipers are
    in use, from sunset to sunrise, or any time visibility is less than 1,000 feet.
- id: 172
  category: vehicle_information
  question: 'Under Delaware law, a tire is considered unsafe if the tread is worn
    down to less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are legally considered unsafe in Delaware if the tread depth
    is less than 2/32 of an inch.
- id: 173
  category: vehicle_information
  question: What is the Delaware requirement for the audibility of a vehicle's horn?
  choices:
    A: It must be heard from at least 100 feet away
    B: It must be heard from at least 200 feet away
    C: It must be heard from at least 500 feet away
    D: It must be heard from at least 1,000 feet away
  answer: B
  explanation: Every motor vehicle in Delaware must be equipped with a horn that can
    be heard under normal conditions from a distance of at least 200 feet.
- id: 174
  category: vehicle_information
  question: In Delaware, how many feet before turning must you continuously signal
    your intention to turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: D
  explanation: Delaware law requires drivers to signal their intention to turn at
    least 300 feet before the turn.
- id: 175
  category: vehicle_information
  question: Regarding window tinting in Delaware, which of the following is true for
    the front side windows?
  choices:
    A: Any level of darkness is allowed as long as the driver is visible
    B: Aftermarket tinting is prohibited on the front side windows without a medical
      waiver
    C: Tinting is allowed up to 50% light transmission
    D: Only the top 4 inches of the front side windows may be tinted
  answer: B
  explanation: Delaware law prohibits the use of aftermarket window tinting on the
    front side windows and the windshield unless the driver has a specific medical
    waiver.
- id: 176
  category: vehicle_information
  question: 'In Delaware, your vehicle''s rear license plate must be illuminated so
    that it is legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The rear license plate must be illuminated by a white light so that
    it is clearly legible from a distance of 50 feet to the rear.
- id: 177
  category: vehicle_information
  question: What is the maximum bumper height allowed for a passenger car in Delaware?
  choices:
    A: 18 inches
    B: 20 inches
    C: 22 inches
    D: 24 inches
  answer: C
  explanation: In Delaware, the maximum height for both front and rear bumpers on
    a passenger car is 22 inches from the ground.
- id: 178
  category: vehicle_information
  question: Under Delaware law, children in which of the following categories are
    prohibited from sitting in the front passenger seat of a vehicle equipped with
    a passenger-side airbag?
  choices:
    A: Children under 5 years old or under 40 pounds
    B: Children under 8 years old or under 50 inches tall
    C: Children under 12 years old or under 65 inches tall
    D: Children under 16 years old or under 100 pounds
  answer: C
  explanation: Delaware law states that children who are under age 12 or less than
    65 inches in height shall not occupy the front passenger seat of any vehicle equipped
    with a passenger-side airbag.
- id: 179
  category: vehicle_information
  question: How often must most vehicles older than seven years undergo safety and
    emissions inspections in Delaware?
  choices:
    A: Every year
    B: Every two years
    C: Every five years
    D: Only when the title is transferred
  answer: B
  explanation: In Delaware, vehicles that are not exempt (generally those older than
    7 model years) must be inspected every two years for safety and emissions.
- id: 180
  category: vehicle_information
  question: What is the minimum property damage liability insurance coverage required
    for a motor vehicle registered in Delaware?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: B
  explanation: Delaware's minimum liability insurance requirements include $10,000
    for property damage in any one accident.
- id: 181
  category: vehicle_information
  question: Which of the following is a prohibited equipment item for private passenger
    vehicles in Delaware?
  choices:
    A: A red light visible from the front of the vehicle
    B: A trailer hitch
    C: An adjustable driver's seat
    D: A third brake light
  answer: A
  explanation: Delaware law prohibits private vehicles from being equipped with a
    red light visible from directly in front of the center thereof, as these are reserved
    for emergency vehicles.
- id: 182
  category: vehicle_information
  question: 'In Delaware, every motor vehicle must be equipped with a rearview mirror
    that allows the driver to see the highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: Delaware requires at least one rearview mirror that provides a view
    of the highway for at least 200 feet to the rear of the vehicle.
- id: 183
  category: vehicle_information
  question: In Delaware, what is the minimum legal tire tread depth for a passenger
    vehicle to pass inspection?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Delaware law requires that tires have a tread depth of at least 2/32
    of an inch in all major tread grooves.
- id: 184
  category: vehicle_information
  question: In Delaware, within how many feet must you dim your high-beam headlights
    when following another vehicle from behind?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: You must dim your high beams when you are following another vehicle
    within 200 feet so that you do not cause glare in the lead driver's rearview mirror.
- id: 185
  category: vehicle_information
  question: Under Delaware law, for how many feet must you signal your intention to
    turn before making the actual turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 300 feet
    D: At least 500 feet
  answer: C
  explanation: Delaware law requires drivers to signal their intention to turn at
    least 300 feet before the turn is made.
- id: 186
  category: vehicle_information
  question: 'Every motor vehicle operated on Delaware highways must be equipped with
    a horn that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Delaware equipment regulations require a horn in good working order
    capable of emitting sound audible under normal conditions from a distance of not
    less than 200 feet.
- id: 187
  category: vehicle_information
  question: New passenger vehicles in Delaware are generally exempt from safety and
    emissions inspection for the first ____ years of the vehicle's life.
  choices:
    A: 2 years
    B: 3 years
    C: 5 years
    D: 7 years
  answer: D
  explanation: Delaware provides a 7-year inspection exemption for new passenger vehicles,
    though owners must still pay the appropriate registration fees.
- id: 188
  category: vehicle_information
  question: 'In Delaware, if your vehicle''s view to the rear is obstructed by a trailer
    or load, you are required to have:'
  choices:
    A: A passenger to act as a spotter at all times
    B: Mirrors on both the left and right sides of the vehicle
    C: A wide-angle interior rearview mirror
    D: A backup camera system
  answer: B
  explanation: If the interior rearview mirror does not provide a clear view to the
    rear (due to a load or trailer), Delaware law requires both left and right outside
    mirrors.
- id: 189
  category: vehicle_information
  question: 'Delaware law requires that a vehicle''s parking brake must be able to
    hold the vehicle:'
  choices:
    A: Only on flat surfaces
    B: On any grade (hill) on which it is operated
    C: Only when the vehicle is in gear
    D: For at least 10 minutes
  answer: B
  explanation: The parking brake must be adequate to hold the vehicle on any grade
    on which it is operated, regardless of the load.
- id: 190
  category: vehicle_information
  question: In which Delaware counties is emissions testing required as part of the
    vehicle inspection process?
  choices:
    A: Only New Castle County
    B: New Castle and Kent Counties
    C: Kent and Sussex Counties
    D: All three counties (New Castle, Kent, and Sussex)
  answer: B
  explanation: Emissions testing is required for vehicles registered in New Castle
    County and Kent County. Sussex County currently only requires safety inspections
    for older vehicles.
- id: 191
  category: vehicle_information
  question: Except for emergency vehicles, Delaware law prohibits the use of which
    color light visible from directly in front of the center of the vehicle?
  choices:
    A: White
    B: Amber
    C: Red
    D: Yellow
  answer: C
  explanation: Delaware law prohibits any vehicle other than an authorized emergency
    vehicle from displaying a red light visible from directly in front of the center
    thereof.
- id: 192
  category: vehicle_information
  question: 'Every motor vehicle in Delaware must be equipped with at least two tail
    lamps on the rear that emit a red light plainly visible from a distance of:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Tail lamps must be red and must be visible from a distance of 500 feet
    to the rear under normal atmospheric conditions.
- id: 193
  category: vehicle_information
  question: Where should the registration expiration sticker (tag) be placed on a
    Delaware license plate?
  choices:
    A: In the upper left corner
    B: In the upper right corner
    C: In the bottom left corner
    D: In the bottom right corner
  answer: D
  explanation: In Delaware, the validation sticker showing the expiration date must
    be placed in the lower right-hand corner of the license plate.
- id: 194
  category: signs_and_signals
  question: In Delaware, what must you do before turning right on a red light?
  choices:
    A: Slow down and turn if no traffic is coming
    B: Come to a complete stop and yield to traffic and pedestrians
    C: You are never allowed to turn right on red in Delaware
    D: Wait for the light to turn green
  answer: B
  explanation: According to the Delaware Driver's Manual, you may turn right on red
    after coming to a complete stop and yielding to all traffic and pedestrians, provided
    there is no sign prohibiting the turn.
- id: 195
  category: signs_and_signals
  question: Under Delaware law, when is a left turn on a red light permitted?
  choices:
    A: Never
    B: From a two-way street onto a one-way street
    C: From a one-way street onto another one-way street
    D: Only during emergency situations
  answer: C
  explanation: In Delaware, a left turn on red is only permitted when turning from
    a one-way street onto another one-way street after a complete stop and yielding
    to traffic.
- id: 196
  category: signs_and_signals
  question: 'A flashing red light at an intersection in Delaware means:'
  choices:
    A: Slow down and proceed with caution
    B: The signal is broken; treat it as a four-way stop
    C: Stop completely and proceed only when it is safe to do so
    D: Yield to traffic on the right only
  answer: C
  explanation: A flashing red light has the same meaning as a stop sign. You must
    come to a complete stop and proceed when safe.
- id: 197
  category: signs_and_signals
  question: What does a flashing yellow light indicate to a Delaware driver?
  choices:
    A: Stop and wait for the light to turn green
    B: The light is about to turn red
    C: Proceed with caution
    D: Yield to all pedestrians but not to other vehicles
  answer: C
  explanation: A flashing yellow light means you should slow down and proceed with
    caution, staying alert for hazards.
- id: 198
  category: signs_and_signals
  question: 'In Delaware, a steady yellow light means:'
  choices:
    A: Speed up to clear the intersection before the red light
    B: The signal is changing to red and you should stop if it is safe to do so
    C: You have the right-of-way over turning traffic
    D: Stop immediately, even if you are in the middle of the intersection
  answer: B
  explanation: A steady yellow light indicates the signal is about to turn red. Drivers
    should stop if they can do so safely; otherwise, they should clear the intersection.
- id: 199
  category: signs_and_signals
  question: What is the meaning of a pennant-shaped sign placed on the left side of
    the road in Delaware?
  choices:
    A: School Zone
    B: No Passing Zone
    C: Yield Right-of-Way
    D: Railroad Crossing
  answer: B
  explanation: A pennant-shaped sign is used specifically to mark the beginning of
    a 'No Passing Zone' and is placed on the left side of the road to be visible to
    drivers attempting to pass.
- id: 200
  category: signs_and_signals
  question: In Delaware, what do white 'sharrow' symbols (a bicycle with two chevrons)
    on a lane indicate?
  choices:
    A: The lane is reserved for bicycles only
    B: Bicycles are not allowed in this lane
    C: Motorists should expect bicycles to occupy the full travel lane
    D: Bicycles must stay on the shoulder
  answer: C
  explanation: Shared Lane Markings (sharrows) alert motorists that bicyclists may
    be in the travel lane and help bicyclists position themselves safely away from
    parked cars.
- id: 201
  category: signs_and_signals
  question: 'When a Delaware driver extends their left arm and hand straight out the
    window, they are signaling:'
  choices:
    A: A right turn
    B: A left turn
    C: A stop or decrease in speed
    D: An emergency
  answer: B
  explanation: The standard hand signal for a left turn is the left arm and hand extended
    straight out horizontally.
- id: 202
  category: signs_and_signals
  question: What does a round-shaped sign indicate in Delaware?
  choices:
    A: Yield
    B: Stop
    C: Railroad Crossing ahead
    D: Hospital nearby
  answer: C
  explanation: A circular (round) sign is used exclusively to warn drivers that they
    are approaching a railroad crossing.
- id: 203
  category: signs_and_signals
  question: In Delaware, what is the civil penalty for a first-offense violation caught
    by a red light signal camera?
  choices:
    A: $25.00
    B: $75.00
    C: $112.50
    D: $250.00
  answer: C
  explanation: The Delaware Driver's Manual specifies that the civil penalty for a
    red light camera violation is $112.50.
- id: 204
  category: signs_and_signals
  question: What does a solid white line between two lanes of traffic moving in the
    same direction mean in Delaware?
  choices:
    A: You may cross it at any time
    B: It separates traffic moving in opposite directions
    C: Lane changes are discouraged
    D: The lane is for HOV vehicles only
  answer: C
  explanation: A solid white line indicates that drivers should stay in their lane
    and that lane changes are discouraged due to potential hazards.
- id: 205
  category: signs_and_signals
  question: What color are Delaware's 'Incident Management' signs, used for temporary
    traffic control during emergencies?
  choices:
    A: Orange
    B: Fluorescent Pink
    C: Fluorescent Yellow-Green
    D: Bright Red
  answer: B
  explanation: Fluorescent pink signs are used in Delaware for incident management
    to warn of temporary emergency situations like crashes or fires.
- id: 206
  category: signs_and_signals
  question: 'If you are signaling a stop using hand signals, your arm should be:'
  choices:
    A: Straight out
    B: Bent upward at a 90-degree angle
    C: Bent downward at a 90-degree angle
    D: Waving up and down
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, the left
    arm and hand should be extended downward at a 90-degree angle.
- id: 207
  category: signs_and_signals
  question: In Delaware, what does a steady red arrow signal mean?
  choices:
    A: You may turn cautiously in the direction of the arrow after stopping.
    B: You must stop and you cannot turn in the direction of the arrow.
    C: You may turn only if there is no oncoming traffic.
    D: The signal is about to change to green.
  answer: B
  explanation: According to the Delaware Driver's Manual, a steady red arrow means
    you must stop and you cannot turn in the direction of the arrow. You must wait
    for the signal to change to a green arrow or a green light.
- id: 208
  category: signs_and_signals
  question: Under Delaware law, when are you permitted to make a left turn on a red
    light?
  choices:
    A: Never
    B: From a one-way street onto another one-way street after a full stop.
    C: From a two-way street onto a one-way street.
    D: Anytime there is no cross traffic.
  answer: B
  explanation: Delaware law allows a left turn on red only when turning from a one-way
    street onto another one-way street, provided the driver comes to a complete stop
    and yields to traffic and pedestrians.
- id: 209
  category: signs_and_signals
  question: 'In Delaware, a flashing yellow light at an intersection means you should:'
  choices:
    A: Stop and wait for the light to turn green.
    B: Speed up to clear the intersection quickly.
    C: Slow down and proceed with caution.
    D: Treat it like a four-way stop.
  answer: C
  explanation: A flashing yellow light indicates that you should slow down and be
    especially alert as you proceed through the intersection with caution.
- id: 210
  category: signs_and_signals
  question: What does a 'Red X' displayed over a reversible lane indicate in Delaware?
  choices:
    A: The lane is reserved for emergency vehicles only.
    B: The lane is about to change direction.
    C: You are not allowed to use the lane.
    D: You must exit the highway immediately.
  answer: C
  explanation: In Delaware, overhead signals are used for reversible lanes. A 'Red
    X' means the lane is closed to traffic moving in your direction.
- id: 211
  category: signs_and_signals
  question: Which hand signal is the correct way to indicate a right turn in Delaware?
  choices:
    A: Left arm extended straight out the window.
    B: Left arm extended upward out the window.
    C: Left arm extended downward out the window.
    D: Right arm extended straight out the window.
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at the elbow.
- id: 212
  category: signs_and_signals
  question: In Delaware, what do double solid yellow lines in the center of the road
    signify?
  choices:
    A: Passing is permitted from either side.
    B: Passing is permitted only on the right.
    C: Passing is prohibited in both directions.
    D: The road is a one-way street.
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    vehicles traveling in either direction.
- id: 213
  category: signs_and_signals
  question: What is the meaning of a 'Flashing Red' traffic signal in Delaware?
  choices:
    A: Slow down and prepare to stop.
    B: The signal is broken; proceed with caution.
    C: The same as a stop sign; stop completely and yield before proceeding.
    D: Yield to oncoming traffic but do not stop.
  answer: C
  explanation: A flashing red light means the same as a stop sign. You must come to
    a complete stop and yield the right-of-way to any vehicle or pedestrian in the
    intersection before proceeding.
- id: 214
  category: signs_and_signals
  question: In Delaware, what does a white diamond symbol painted on the pavement
    indicate?
  choices:
    A: A pedestrian crosswalk is ahead.
    B: The lane is reserved for specific vehicles like buses or HOVs.
    C: A railroad crossing is ahead.
    D: The lane is for emergency stopping only.
  answer: B
  explanation: The diamond symbol on the pavement indicates a restricted lane, such
    as a High Occupancy Vehicle (HOV) lane or a bus lane.
- id: 215
  category: signs_and_signals
  question: What do broken white lines on the pavement mean in Delaware?
  choices:
    A: They separate lanes of traffic moving in opposite directions.
    B: They indicate the edge of the roadway.
    C: They separate lanes of traffic moving in the same direction.
    D: They indicate a 'No Passing' zone.
  answer: C
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    You may cross these lines to change lanes if it is safe to do so.
- id: 216
  category: signs_and_signals
  question: What does a solid white line on the right edge of the highway indicate?
  choices:
    A: A lane for slow-moving vehicles.
    B: The edge of the travel lane (fog line).
    C: A bicycle-only lane.
    D: A zone where passing is allowed.
  answer: B
  explanation: A solid white line along the side of the road marks the edge of the
    travel lane and is often referred to as the fog line.
- id: 217
  category: signs_and_signals
  question: In Delaware, what is the meaning of a 'Steady Yellow' traffic light?
  choices:
    A: Stop immediately, even if you are in the intersection.
    B: The signal is changing to red; clear the intersection.
    C: You may enter the intersection if you speed up.
    D: The signal is changing to green.
  answer: B
  explanation: A steady yellow light means the signal is changing from green to red.
    It warns you to clear the intersection or stop if you can do so safely.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 218
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 219
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 220
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 221
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 222
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 223
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 224
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 225
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 226
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 227
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 228
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 229
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 230
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 231
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 232
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 233
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 234
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 235
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 236
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 237
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 238
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
