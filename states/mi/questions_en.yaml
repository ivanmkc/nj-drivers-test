metadata:
  source: 2025 Michigan Driver's Manual
  total_questions: 243
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Michigan, what is the minimum age to apply for a Level 1 Learner's
    License?
  choices:
    A: 14 years old
    B: 14 years and 9 months old
    C: 15 years old
    D: 15 years and 6 months old
  answer: B
  explanation: According to the Michigan Graduated Driver Licensing (GDL) system,
    a teen must be at least 14 years and 9 months old to apply for a Level 1 Learner's
    License after completing Segment 1 of driver education.
- id: 2
  category: license_system
  question: Under Michigan's Level 2 Intermediate License, what are the restricted
    hours for driving without a parent, guardian, or licensed adult over 21?
  choices:
    A: Midnight to 5:00 AM
    B: 11:00 PM to 6:00 AM
    C: 10:00 PM to 5:00 AM
    D: 9:00 PM to 4:00 AM
  answer: C
  explanation: Michigan Level 2 License holders are prohibited from driving between
    10:00 PM and 5:00 AM unless driving to/from employment, an authorized activity,
    or with a parent/guardian/licensed adult over 21.
- id: 3
  category: license_system
  question: How many passengers under the age of 21 is a Level 2 Michigan license
    holder permitted to carry, excluding immediate family members?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Michigan law restricts Level 2 license holders to no more than one
    passenger under the age of 21, unless the passengers are immediate family members
    or the driver is traveling to/from work or a school-sanctioned event.
- id: 4
  category: license_system
  question: To qualify for a Level 2 Intermediate License in Michigan, how many hours
    of behind-the-wheel experience must a teen log, and how many must be at night?
  choices:
    A: 40 hours total, 5 at night
    B: 50 hours total, 10 at night
    C: 30 hours total, 2 at night
    D: 60 hours total, 15 at night
  answer: B
  explanation: Before taking the driving skills test for a Level 2 license, a teen
    must log 50 hours of driving, including at least 10 hours at night.
- id: 5
  category: license_system
  question: In Michigan, how long must a teen hold a Level 1 Learner's License before
    they are eligible to take the driving skills test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 1 year
  answer: B
  explanation: Michigan law requires a teen to hold a Level 1 Learner's License for
    a minimum of six months before they can take the driving skills test for a Level
    2 license.
- id: 6
  category: license_system
  question: What is the maximum blood alcohol concentration (BAC) allowed for a driver
    under the age of 21 in Michigan under the 'Zero Tolerance' law?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Michigan's Zero Tolerance law for drivers under 21 prohibits driving
    with a BAC of 0.02% or higher, or any presence of alcohol in the body from consumption.
- id: 7
  category: license_system
  question: How many points are added to a Michigan driving record for Operating While
    Intoxicated (OWI)?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: In Michigan, an OWI (Operating While Intoxicated) conviction results
    in 6 points being added to the driver's record.
- id: 8
  category: license_system
  question: If you change your address within Michigan, you must notify the Secretary
    of State within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: Immediately
  answer: D
  explanation: Michigan law requires you to notify the Secretary of State immediately
    when you change your address. This can be done online, by mail, or at a branch
    office.
- id: 9
  category: license_system
  question: Under Michigan's Implied Consent law, what is the penalty for a first-time
    refusal to take a chemical test (breath, blood, or urine)?
  choices:
    A: A $100 fine
    B: 6 points and a 1-year license suspension
    C: 2 points and a 30-day suspension
    D: No points, but a mandatory 6-month suspension
  answer: B
  explanation: Under Michigan's Implied Consent law, if you refuse a chemical test
    for the first time, 6 points are added to your record and your license is suspended
    for one year.
- id: 10
  category: license_system
  question: How many points are assessed for a speeding violation of 1 to 10 mph over
    the legal limit in Michigan?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: In Michigan, speeding 1-10 mph over the posted limit results in 2 points
    on your driving record.
- id: 11
  category: license_system
  question: At what age does a Michigan teen driver automatically graduate to a Level
    3 Full License if they have met all requirements?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: A teen is eligible for a Level 3 Full License at age 17, provided they
    have held a Level 2 license for at least six months and have been violation-free
    and accident-free for 12 consecutive months.
- id: 12
  category: license_system
  question: In Michigan, how many points are assessed for 'Careless Driving'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Careless driving is a 3-point offense in Michigan, whereas Reckless
    driving is a 6-point offense.
- id: 13
  category: license_system
  question: Which of the following is a requirement to enroll in Segment 2 of Michigan's
    Driver Education?
  choices:
    A: Hold a Level 1 license for at least 3 months
    B: Complete 30 hours of driving, including 2 hours at night
    C: Both A and B
    D: Hold a Level 1 license for 6 months
  answer: C
  explanation: To enroll in Segment 2, a student must have held a Level 1 Learner's
    License for at least 3 continuous months and completed 30 hours of driving (including
    2 hours at night).
- id: 14
  category: license_system
  question: Michigan's 'Super Drunk' law applies to drivers with a Blood Alcohol Concentration
    (BAC) of what level or higher?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.17%
  answer: D
  explanation: Michigan's 'High BAC' law, often called the 'Super Drunk' law, carries
    enhanced penalties for drivers with a BAC of 0.17% or higher.
- id: 15
  category: license_system
  question: What type of insurance is mandatory for all registered motor vehicles
    in Michigan?
  choices:
    A: Collision insurance
    B: Comprehensive insurance
    C: No-fault insurance
    D: Uninsured motorist coverage
  answer: C
  explanation: Michigan is a no-fault insurance state. All registered vehicles must
    be covered by a no-fault policy that includes Personal Protection Insurance (PIP),
    Property Protection Insurance (PPI), and Residual Liability Insurance.
- id: 16
  category: license_system
  question: In Michigan, how many points are added to your driving record for a conviction
    of 'Reckless Driving'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: According to the Michigan Department of State, Reckless Driving is
    a major violation that results in 6 points being added to the driver's record.
- id: 17
  category: license_system
  question: How many points are assessed on a Michigan driving record for 'Drag Racing'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 0 points, but license is revoked
  answer: B
  explanation: Michigan law assigns 4 points to a driver's record for the offense
    of drag racing.
- id: 18
  category: license_system
  question: At what point threshold is a Michigan driver required to appear for a
    driver re-examination to determine their fitness to drive?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: The Michigan Secretary of State requires a driver to appear for a re-examination
    if they accumulate 12 or more points within a two-year period.
- id: 19
  category: license_system
  question: How long is the probationary period for all new drivers in Michigan, including
    those who have graduated from the GDL program?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: D
  explanation: In Michigan, all new drivers (regardless of age) are on probation for
    at least three years.
- id: 20
  category: license_system
  question: To obtain a Michigan driver's license that is REAL ID-compliant, how many
    documents must you provide to prove Michigan residency?
  choices:
    A: One document
    B: Two documents
    C: Three documents
    D: No documents are required if you have a Social Security card
  answer: B
  explanation: Michigan requires two valid documents (such as a utility bill or bank
    statement) to prove Michigan residency for a REAL ID-compliant license.
- id: 21
  category: license_system
  question: What is the minimum age required to apply for a Chauffeur's license in
    the state of Michigan?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: C
  explanation: To be eligible for a Michigan chauffeur's license, an applicant must
    be at least 18 years of age.
- id: 22
  category: license_system
  question: How many points are added to a Michigan driving record for having an open
    alcohol container in a vehicle?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Under Michigan law, a conviction for an open alcohol container in a
    vehicle results in 2 points on the driver's record.
- id: 23
  category: license_system
  question: How long do points remain on a Michigan driving record from the date of
    the conviction?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: In Michigan, points for traffic violations remain on your driving record
    for two years from the date of the conviction.
- id: 24
  category: license_system
  question: In Michigan, how many points are assessed for fleeing or eluding a police
    officer?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Fleeing or eluding a police officer is a serious offense that carries
    6 points in Michigan.
- id: 25
  category: license_system
  question: How many points are added to your Michigan record if you fail to stop
    for a school bus?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failing to stop for a school bus or for a school crossing guard results
    in 3 points on a Michigan driving record.
- id: 26
  category: license_system
  question: If a driver under the age of 21 refuses to take a Preliminary Breath Test
    (PBT) in Michigan, how many points are added to their record?
  choices:
    A: 0 points
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: While PBT refusal for adults is a civil infraction with no points,
    Michigan law specifically adds 2 points to the record of a driver under 21 who
    refuses a PBT.
- id: 27
  category: license_system
  question: What is the standard fee for a four-year renewal of a Michigan operator's
    license (if renewed on time)?
  choices:
    A: ' $10'
    B: ' $18'
    C: ' $25'
    D: ' $45'
  answer: B
  explanation: The standard renewal fee for a Michigan operator's license is $18.
- id: 28
  category: license_system
  question: A standard Michigan driver's license is typically valid for how many years?
  choices:
    A: 2 years
    B: 4 years
    C: 5 years
    D: 8 years
  answer: B
  explanation: Standard Michigan driver's licenses are valid for up to four years
    and expire on the driver's birthday.
- id: 29
  category: license_system
  question: How many points are assessed for driving while your license is suspended
    or revoked (DWLS) in Michigan?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Driving while your license is suspended or revoked (DWLS) results in
    2 points being added to your Michigan driving record.
- id: 30
  category: driver_testing
  question: To pass the vision screening for a Michigan driver's license, what is
    the minimum visual acuity required in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Michigan requires a minimum visual acuity of 20/40 in at least one
    eye to qualify for an unrestricted license.
- id: 31
  category: driver_testing
  question: During the Michigan driving skills test, which of the following will result
    in an automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: Driving over the curb during the parking maneuver
    C: A traffic violation or an accident where you are at fault
    D: Adjusting your mirrors while the vehicle is in motion
  answer: C
  explanation: According to the Michigan Department of State, any traffic violation,
    dangerous action, or at-fault accident during the road test results in an automatic
    failure.
- id: 32
  category: driver_testing
  question: Under Michigan's 'Move Over Law,' how many points are assessed for failing
    to yield or slow down for a stationary emergency vehicle with its lights flashing?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Michigan law assesses 2 points for failing to exhibit due care (moving
    over or slowing down) when approaching a stationary emergency vehicle.
- id: 33
  category: driver_testing
  question: How many points are added to a Michigan driving record for a speeding
    violation of 11 through 15 mph over the posted limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Michigan's point system assigns 3 points for speeding 11-15 mph over
    the legal limit.
- id: 34
  category: driver_testing
  question: In Michigan, how many points are assessed for failing to stop for a school
    bus with its red lights flashing?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Failing to stop for a school bus in Michigan results in 3 points being
    added to the driver's record.
- id: 35
  category: driver_testing
  question: When does a Michigan vehicle registration (license plate) typically expire?
  choices:
    A: On December 31st of every year
    B: On the owner's birthday
    C: Exactly one year from the date of purchase
    D: On the last day of the month the vehicle was purchased
  answer: B
  explanation: In Michigan, vehicle registrations for individuals expire on the owner's
    birthday.
- id: 36
  category: driver_testing
  question: If a Michigan driver is required to attend a driver re-examination but
    fails to appear, what is the immediate consequence?
  choices:
    A: A $500 fine
    B: A mandatory jail sentence of 10 days
    C: License suspension until the driver appears
    D: The driver's points are doubled
  answer: C
  explanation: If you fail to appear for a scheduled driver re-examination in Michigan,
    your license will be suspended until you attend the hearing.
- id: 37
  category: driver_testing
  question: Under Michigan's Zero Tolerance law, what is the penalty for a driver
    under 21 who refuses a Preliminary Breath Test (PBT)?
  choices:
    A: 1 point on the driving record
    B: 2 points on the driving record
    C: Immediate 1-year license revocation
    D: No points, but a $500 fine
  answer: B
  explanation: A driver under age 21 who refuses a PBT will have 2 points added to
    their driving record, as it is considered a civil infraction.
- id: 38
  category: driver_testing
  question: What is the minimum age a teen must be to enroll in Segment 1 of a Driver
    Education course in Michigan?
  choices:
    A: 14 years old
    B: 14 years and 8 months old
    C: 14 years and 9 months old
    D: 15 years old
  answer: B
  explanation: Michigan law requires a student to be at least 14 years and 8 months
    old to begin Segment 1 of driver education.
- id: 39
  category: driver_testing
  question: In Michigan, what is the speed limit in a highway work zone where a lane
    is closed, unless otherwise posted?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: Michigan law sets a speed limit of 45 mph in highway work zones where
    a lane is closed, unless a different speed limit is posted.
- id: 40
  category: driver_testing
  question: When purchasing a vehicle in a private sale, how many days does the buyer
    have to transfer the title into their name in Michigan?
  choices:
    A: 7 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: In Michigan, the buyer of a vehicle must apply for a new title at a
    Secretary of State office within 15 days of the purchase date.
- id: 41
  category: driver_testing
  question: How many points are assessed for failing to yield the right-of-way to
    an emergency vehicle in Michigan?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Failing to yield the right-of-way to an emergency vehicle results in
    2 points on a Michigan driving record.
- id: 42
  category: driver_testing
  question: When arriving for a Michigan driving skills test, which documents must
    be provided for the vehicle being used?
  choices:
    A: The vehicle's title and a maintenance log
    B: Valid vehicle registration and proof of Michigan No-Fault insurance
    C: The owner's manual and a bill of sale
    D: Only a valid driver's license from the accompanying adult
  answer: B
  explanation: Michigan law requires that any vehicle used for a driving skills test
    must have a valid registration and current proof of Michigan No-Fault insurance.
- id: 43
  category: driver_testing
  question: In Michigan, what is the default speed limit within a mobile home park
    unless otherwise posted?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Under the Michigan Vehicle Code (MCL 257.627), the speed limit in a
    mobile home park is 15 mph.
- id: 44
  category: driver_testing
  question: 'In Michigan, you must immediately report a traffic accident to the police
    if it results in injury, death, or property damage of at least:'
  choices:
    A: $400
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Michigan law requires drivers to report accidents to the police if
    there is an injury, a fatality, or if the property damage appears to be $1,000
    or more.
- id: 45
  category: driver_testing
  question: In Michigan, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Michigan law prohibits parking a vehicle within 15 feet of a fire hydrant.
- id: 46
  category: driver_testing
  question: If you fail the Michigan driving skills test, how long must you wait before
    you are eligible to attempt the test again?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 30 days
  answer: A
  explanation: Michigan regulations require a minimum waiting period of 24 hours before
    a driver can retake a failed driving skills test.
- id: 47
  category: driver_testing
  question: Unless otherwise posted, what is the speed limit on Michigan highways
    and paved county roads?
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 70 mph
  answer: B
  explanation: In Michigan, the default speed limit on highways and paved county roads
    is 55 mph unless signs indicate otherwise.
- id: 48
  category: driver_responsibility
  question: 'Driving a vehicle in Michigan without valid no-fault insurance is a:'
  choices:
    A: Civil infraction with no fine
    B: Felony
    C: Misdemeanor
    D: Minor offense that does not appear on a driving record
  answer: C
  explanation: In Michigan, driving without insurance is a misdemeanor. Convicted
    drivers may face fines, jail time, and a driver's license suspension.
- id: 49
  category: driver_responsibility
  question: Under Michigan's No-Fault Insurance law, which part of the policy pays
    for your medical expenses if you are injured in a car accident?
  choices:
    A: Property Protection (PPI)
    B: Personal Injury Protection (PIP)
    C: Residual Liability Insurance
    D: Collision Coverage
  answer: B
  explanation: Personal Injury Protection (PIP) is the component of Michigan No-Fault
    insurance that pays for medical costs, lost wages, and replacement services if
    you are injured in an auto accident.
- id: 50
  category: driver_responsibility
  question: When you buy a vehicle from an individual (private sale) in Michigan,
    you must transfer the title within how many days?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: Michigan law requires that a vehicle title be transferred within 15
    days of the date of purchase to avoid a late fee.
- id: 51
  category: driver_responsibility
  question: In Michigan, when you sell your car, what should you do with the license
    plate?
  choices:
    A: Leave it on the car for the new owner
    B: Return it to the Secretary of State immediately
    C: Keep the plate for your next vehicle or destroy it
    D: Give it to the police for disposal
  answer: C
  explanation: In Michigan, license plates belong to the owner, not the vehicle. When
    a vehicle is sold, the owner should remove the plate and may transfer it to another
    vehicle they own.
- id: 52
  category: driver_responsibility
  question: How many points are assessed on your Michigan driving record for failing
    to yield to an emergency vehicle (Move Over Law)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Failing to yield to an authorized emergency vehicle, or failing to
    move over/slow down for a stationary emergency vehicle with lights flashing, results
    in 2 points on your Michigan driving record.
- id: 53
  category: driver_responsibility
  question: In Michigan, if you are convicted of a moving violation in a work zone
    when workers are present, what happens to the fine?
  choices:
    A: It is waived for first-time offenders
    B: It is doubled
    C: It is tripled
    D: It is increased by a flat $500 fee
  answer: B
  explanation: Michigan law dictates that traffic fines are doubled for moving violations
    committed in work zones when workers are present.
- id: 54
  category: driver_responsibility
  question: Michigan's 'Property Protection Insurance' (PPI) covers up to how much
    in damage that your vehicle does to other people's property (such as buildings
    or properly parked vehicles) within the state?
  choices:
    A: $10,000
    B: $50,000
    C: $100,000
    D: $1,000,000
  answer: D
  explanation: PPI pays up to $1 million for damage your vehicle does in Michigan
    to other people's property, such as buildings and fences, and to properly parked
    vehicles.
- id: 55
  category: driver_responsibility
  question: For most passenger vehicles in Michigan, when does the vehicle registration
    (license plate) expire?
  choices:
    A: On December 31st of every year
    B: On the owner's birthday
    C: Exactly one year from the date of purchase
    D: On the last day of the month it was issued
  answer: B
  explanation: In Michigan, vehicle registrations for individuals expire on the owner's
    birthday.
- id: 56
  category: driver_responsibility
  question: 'If you are a Michigan resident and own a car, you must have ''Residual
    Liability Insurance'' to cover:'
  choices:
    A: Your own medical bills
    B: Damage to your own car if you are at fault
    C: Legal suits if you are sued because of an accident
    D: Theft or vandalism of the vehicle
  answer: C
  explanation: Residual Liability Insurance protects you from being sued if you are
    involved in an accident that causes serious injury, death, or certain types of
    property damage.
- id: 57
  category: driver_responsibility
  question: If you are involved in an accident in Michigan and fail to stop at the
    scene (Hit and Run) where an injury occurred, how many points are added to your
    record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failing to stop and reveal your identity at the scene of an accident
    where a personal injury or death occurred is a serious offense that carries 6
    points.
- id: 58
  category: driver_responsibility
  question: 'In Michigan, a person who refuses a Preliminary Breath Test (PBT) by
    a police officer for the first time is subject to:'
  choices:
    A: A 6-month license suspension
    B: A civil infraction and a fine
    C: Automatic jail time of 48 hours
    D: 6 points on their record
  answer: B
  explanation: Refusing a Preliminary Breath Test (PBT) on the roadside is a civil
    infraction. This is different from refusing a chemical test at the police station,
    which falls under the Implied Consent law.
- id: 59
  category: driver_responsibility
  question: Under Michigan No-Fault insurance, Property Protection Insurance (PPI)
    pays up to what amount for damage your vehicle causes to fixed property (like
    buildings or fences) within the state?
  choices:
    A: $50,000
    B: $100,000
    C: $500,000
    D: $1 million
  answer: D
  explanation: Michigan No-Fault insurance includes Property Protection Insurance
    (PPI), which provides up to $1 million in coverage for damage your vehicle does
    to other people's property (such as buildings, fences, and properly parked vehicles)
    in Michigan.
- id: 60
  category: driver_responsibility
  question: As of July 2020, what are the default Michigan residual liability insurance
    limits for bodily injury or death involving one person in an accident?
  choices:
    A: $20,000
    B: $50,000
    C: $100,000
    D: $250,000
  answer: D
  explanation: Effective July 2, 2020, Michigan law set the default residual liability
    limits at $250,000 for bodily injury to or death of one person in any one accident,
    though drivers may choose to purchase lower limits down to $50,000.
- id: 61
  category: driver_responsibility
  question: Which of the following is true regarding proof of insurance during a traffic
    stop in Michigan?
  choices:
    A: Only a paper certificate is legally valid
    B: Drivers may display an electronic copy of their insurance certificate on a
      mobile device
    C: Insurance is verified automatically by the police computer, so no proof is
      needed
    D: Drivers have 48 hours to bring a paper copy to the police station
  answer: B
  explanation: Michigan law allows drivers to provide proof of insurance to a law
    enforcement officer by displaying an electronic copy of the certificate on a smartphone
    or other electronic device.
- id: 62
  category: driver_responsibility
  question: When a vehicle is sold in Michigan, the buyer must apply for a new title
    in their name within how many days?
  choices:
    A: 7 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: The Michigan Secretary of State requires a vehicle buyer to apply for
    a title transfer within 15 days of the date of sale to avoid late fees.
- id: 63
  category: driver_responsibility
  question: If you strike and kill or injure a domestic animal in Michigan and cannot
    find the owner, what is your legal responsibility?
  choices:
    A: You have no legal responsibility for animals
    B: You must leave a note at the nearest house
    C: You must report the accident to the police
    D: You must take the animal to the nearest veterinarian
  answer: C
  explanation: Michigan law states that if you hit a domestic animal, you should try
    to find the owner. If the owner cannot be found, you must report the accident
    to the police.
- id: 64
  category: driver_responsibility
  question: In Michigan, what symbol is placed on your driver's license to indicate
    you have joined the state's Organ Donor Registry?
  choices:
    A: A red cross
    B: A green leaf
    C: A heart with a 'donors' logo
    D: A blue star
  answer: C
  explanation: When you join the Michigan Organ Donor Registry, a heart symbol is
    placed on your driver's license or state ID card to indicate your decision.
- id: 65
  category: safe_driving_rules
  question: Under Michigan law, when is it legal to turn left on a red light?
  choices:
    A: Never, left turns on red are always prohibited.
    B: Only when turning from a one-way street onto another one-way street.
    C: When turning from a one-way or two-way street onto a one-way street in the
      direction of traffic.
    D: Only during emergency situations.
  answer: C
  explanation: In Michigan, you may turn left on a red light when turning from a one-way
    or two-way street onto a one-way street going left, after coming to a complete
    stop and yielding to traffic and pedestrians.
- id: 66
  category: safe_driving_rules
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended, Michigan law requires drivers to stop at least how many feet from the
    bus?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: C
  explanation: Michigan law requires drivers to stop at least 20 feet from a school
    bus that has its red lights flashing and stop arm extended.
- id: 67
  category: safe_driving_rules
  question: What is the unposted speed limit in Michigan work zones where workers
    are present, unless otherwise signs indicate?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: In Michigan, the speed limit in a highway work zone is 45 mph where
    workers are present, unless otherwise posted.
- id: 68
  category: safe_driving_rules
  question: 'When performing a ''Michigan Left'' (a U-turn using a median crossover),
    you should generally:'
  choices:
    A: Turn right, then immediately left across all lanes.
    B: Go straight through the intersection, then use the designated crossover to
      turn around.
    C: Wait in the middle of the intersection and turn when clear.
    D: Only perform the turn if a police officer is present.
  answer: B
  explanation: A 'Michigan Left' involves driving through or turning right at an intersection,
    then using a median crossover to complete the U-turn or left-turn maneuver.
- id: 69
  category: safe_driving_rules
  question: In Michigan, you are prohibited from parking within how many feet of a
    stop sign, flashing beacon, or traffic-control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Michigan law states you may not park within 30 feet of any flashing
    beacon, stop sign, or traffic-control signal located at the side of a highway.
- id: 70
  category: safe_driving_rules
  question: When passing a bicyclist in Michigan, what is the minimum legal distance
    you must maintain between your vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Michigan law requires motorists to provide at least 3 feet of space
    when passing a bicyclist.
- id: 71
  category: safe_driving_rules
  question: 'When entering a multi-lane roundabout in Michigan, you must yield to
    traffic in:'
  choices:
    A: The right lane only.
    B: The left lane only.
    C: Both lanes of the roundabout.
    D: Only vehicles that are exiting.
  answer: C
  explanation: When entering a multi-lane roundabout, you must yield to vehicles in
    all lanes of the roundabout, not just the lane closest to you.
- id: 72
  category: safe_driving_rules
  question: 'Michigan law requires you to turn on your headlights from:'
  choices:
    A: Sunset to sunrise.
    B: One hour after sunset to one hour before sunrise.
    C: 30 minutes after sunset until 30 minutes before sunrise.
    D: Whenever it is cloudy.
  answer: C
  explanation: Headlights must be turned on from a half-hour after sunset until a
    half-hour before sunrise, and at any time when visibility is less than 500 feet.
- id: 73
  category: safe_driving_rules
  question: At what speed can hydroplaning (where tires lose contact with the road
    and float on a layer of water) begin in Michigan weather conditions?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: According to the Michigan driver's manual, hydroplaning can begin at
    speeds as low as 35 mph in heavy rain.
- id: 74
  category: safe_driving_rules
  question: What is the recommended following distance for most driving conditions
    in Michigan?
  choices:
    A: 1 car length for every 10 mph.
    B: 2 seconds.
    C: 3 to 4 seconds.
    D: 50 feet.
  answer: C
  explanation: The Michigan Secretary of State recommends a following distance of
    3 to 4 seconds under normal driving conditions.
- id: 75
  category: safe_driving_rules
  question: In Michigan, you must dim your high-beam headlights when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Michigan law requires you to dim your high beams when you are within
    500 feet of an oncoming vehicle.
- id: 76
  category: safe_driving_rules
  question: In Michigan, what is the maximum speed limit for vehicles in a mobile
    home park?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: According to the Michigan Vehicle Code, the speed limit within mobile
    home parks is 15 mph.
- id: 77
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit on unpaved (gravel) roads
    in Michigan?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: In Michigan, the general speed limit for unposted gravel roads is 55
    mph, though drivers must always adjust for conditions.
- id: 78
  category: safe_driving_rules
  question: In Michigan, when are you allowed to turn left on a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: From a two-way street onto a one-way street
    D: From a one-way street onto either a one-way or two-way street
  answer: B
  explanation: Michigan law allows a left turn on red only when turning from a one-way
    street onto another one-way street, after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 79
  category: safe_driving_rules
  question: Under Michigan's 'Move Over' law, if you cannot safely move over for an
    emergency vehicle with flashing lights, what must you do?
  choices:
    A: Maintain speed but honk your horn
    B: Stop immediately in your lane
    C: Slow down to at least 10 mph below the posted speed limit
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: If you cannot safely move over a lane for an emergency, maintenance,
    or utility vehicle, Michigan law requires you to slow down to at least 10 mph
    below the posted speed limit.
- id: 80
  category: safe_driving_rules
  question: When a school bus has its red lights flashing and stop arm extended, how
    many feet away must you stop your vehicle?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: C
  explanation: Michigan law requires drivers to stop at least 20 feet from a school
    bus when it has its red lights flashing and stop arm extended.
- id: 81
  category: safe_driving_rules
  question: Under Michigan's 'Andy's Law,' what is the maximum penalty for injuring
    a worker in a construction zone?
  choices:
    A: A $500 fine and 90 days in jail
    B: A $1,000 fine and 1 year in jail
    C: A $7,500 fine and 15 years in prison
    D: A $5,000 fine and 1 year in jail
  answer: D
  explanation: Andy's Law provides for a fine of up to $5,000 and up to one year in
    jail for injuring a worker in a construction zone. If a worker is killed, the
    penalty increases to a $7,500 fine and up to 15 years in prison.
- id: 82
  category: safe_driving_rules
  question: What is the purpose of a 'Michigan Left' turn?
  choices:
    A: To allow drivers to turn left directly across several lanes of traffic
    B: To reduce accidents by requiring drivers to go past an intersection and make
      a U-turn at a designated median opening
    C: To allow left turns on red from any lane
    D: To give priority to left-turning vehicles over oncoming traffic
  answer: B
  explanation: The 'Michigan Left' is designed to improve traffic flow and safety
    by preventing direct left turns at busy intersections, instead requiring drivers
    to make a U-turn at a median crossover.
- id: 83
  category: safe_driving_rules
  question: What is the minimum speed limit on Michigan freeways, unless otherwise
    posted?
  choices:
    A: 40 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: B
  explanation: On Michigan freeways, the minimum speed limit is 45 mph, unless weather
    or road conditions make it unsafe to drive that fast.
- id: 84
  category: safe_driving_rules
  question: In Michigan, you must activate your turn signal at least how many feet
    before turning?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Michigan law requires drivers to signal their intention to turn at
    least 100 feet before the turn.
- id: 85
  category: safe_driving_rules
  question: When stopping for a railroad crossing with lowered gates or flashing lights,
    you must stop your vehicle within what distance from the nearest rail?
  choices:
    A: 5 to 25 feet
    B: 10 to 30 feet
    C: 15 to 50 feet
    D: 20 to 60 feet
  answer: C
  explanation: Michigan law requires drivers to stop between 15 and 50 feet from the
    nearest rail at a railroad crossing when signals indicate a train is approaching.
- id: 86
  category: defensive_driving
  question: According to the Michigan 'What Every Driver Must Know' manual, what is
    the recommended following distance behind the vehicle in front of you under ideal
    conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 to 4 seconds
    D: At least 6 seconds
  answer: C
  explanation: Michigan's official driver manual recommends a following distance of
    3 to 4 seconds to allow enough time to react to hazards under ideal conditions.
- id: 87
  category: defensive_driving
  question: In Michigan, how far ahead should you scan the road to identify potential
    hazards in city driving?
  choices:
    A: 5 seconds
    B: 12 seconds
    C: 25 seconds
    D: One full block
  answer: B
  explanation: Michigan defensive driving guidelines suggest scanning at least 12
    seconds ahead of your vehicle to anticipate traffic flow and hazards.
- id: 88
  category: defensive_driving
  question: 'Under Michigan law, you must turn on your headlights if you cannot clearly
    see people or vehicles on the highway at a distance of:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Michigan law (MCL 257.684) requires headlights to be on from a half-hour
    after sunset to a half-hour before sunrise, or whenever visibility is reduced
    to 500 feet or less.
- id: 89
  category: defensive_driving
  question: 'In Michigan, you must dim your high-beam headlights when following another
    vehicle within a distance of:'
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 800 feet
  answer: C
  explanation: The Michigan driver's manual states you should dim your high beams
    when you are within 500 feet of the vehicle ahead of you.
- id: 90
  category: defensive_driving
  question: 'Michigan''s ''Move Over'' law requires drivers to move over one lane
    or slow down for stationary emergency vehicles. If you cannot move over, you must
    slow down to:'
  choices:
    A: The posted speed limit
    B: 10 mph below the posted speed limit
    C: 20 mph below the posted speed limit
    D: A complete stop
  answer: B
  explanation: Michigan law requires drivers to vacate the lane closest to stationary
    emergency vehicles with lights flashing. If moving over is unsafe, you must slow
    down to at least 10 mph below the posted speed limit.
- id: 91
  category: defensive_driving
  question: Hydroplaning can occur on Michigan roads during heavy rain. At what speed
    can tires lose all contact with the road surface?
  choices:
    A: 25 mph
    B: 35 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: While hydroplaning can start at lower speeds (around 35 mph), Michigan's
    manual notes that at 55 mph, tires can lose all contact with the road entirely.
- id: 92
  category: defensive_driving
  question: 'Michigan has a high rate of deer-vehicle crashes. If a deer jumps in
    front of your car, the official state recommendation is to:'
  choices:
    A: Swerve quickly to the left
    B: Swerve quickly to the right
    C: Brake firmly but do not swerve
    D: Speed up to minimize the impact
  answer: C
  explanation: Michigan safety officials advise drivers to 'brake and stay in your
    lane.' Swerving can cause a more serious crash with another vehicle or a fixed
    object like a tree.
- id: 93
  category: defensive_driving
  question: When driving in heavy fog in Michigan, which light setting should you
    use?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Hazard flashers only
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    fog droplets, creating a 'white wall' effect and reducing visibility further.
- id: 94
  category: defensive_driving
  question: In Michigan, it is a legal requirement to clear which of the following
    from your vehicle before driving in winter?
  choices:
    A: Only the driver's side of the windshield
    B: The windshield and front side windows only
    C: All windows, including the rear window and side mirrors
    D: Only the headlights and taillights
  answer: C
  explanation: Michigan law requires that a driver's vision not be obstructed. You
    must clear snow and ice from all windows to ensure a full field of vision.
- id: 95
  category: defensive_driving
  question: When temperatures are near freezing, which of the following Michigan road
    surfaces is likely to freeze first?
  choices:
    A: Gravel roads
    B: Asphalt highways
    C: Bridges and overpasses
    D: Intersections with traffic lights
  answer: C
  explanation: Bridges and overpasses freeze before other road surfaces because cold
    air circulates both above and below the road deck.
- id: 96
  category: defensive_driving
  question: 'To avoid a collision with a vehicle in your blind spot while changing
    lanes in Michigan, you should:'
  choices:
    A: Check your rearview mirror only
    B: Check your side mirrors only
    C: Turn your head and glance over your shoulder
    D: Honk your horn before moving
  answer: C
  explanation: Mirrors do not show everything. A shoulder check is necessary to see
    vehicles in the 'blind spots' not covered by mirrors.
- id: 97
  category: defensive_driving
  question: 'If your vehicle begins to skid on a slippery Michigan road, you should:'
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Turn the steering wheel in the direction you want the vehicle to go
    D: Shift the car into neutral
  answer: C
  explanation: If you skid, take your foot off the accelerator and steer in the direction
    you want the front of the vehicle to go. This is often described as 'steering
    into the skid.'
- id: 98
  category: defensive_driving
  question: 'Total stopping distance is the sum of perception distance, reaction distance,
    and braking distance. At 55 mph, an average vehicle''s total stopping distance
    is approximately:'
  choices:
    A: 100 feet
    B: 150 feet
    C: 290 feet
    D: 500 feet
  answer: C
  explanation: According to the Michigan driver's manual, at 55 mph, it takes about
    290 feet to come to a complete stop (roughly the length of a football field).
- id: 99
  category: defensive_driving
  question: To maintain proper 'visual search' while driving in Michigan, how far
    ahead should you look to identify potential problems?
  choices:
    A: 5 seconds
    B: 12 seconds
    C: 20 seconds
    D: 30 seconds
  answer: B
  explanation: Michigan's driving manual instructs drivers to look at least 12 seconds
    ahead of their vehicle to anticipate traffic flow and hazards.
- id: 100
  category: defensive_driving
  question: In Michigan, at what speed can hydroplaning begin to occur on wet roads?
  choices:
    A: As low as 20 mph
    B: As low as 35 mph
    C: Only above 55 mph
    D: Only above 70 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph in heavy rain. At
    55 mph, tires may lose all contact with the road.
- id: 101
  category: defensive_driving
  question: When following another vehicle at night in Michigan, you must dim your
    high beams when you are within how many feet of the vehicle ahead?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 800 feet
  answer: C
  explanation: Michigan law requires drivers to dim their high beams when following
    another vehicle within 500 feet to avoid blinding the driver in front.
- id: 102
  category: defensive_driving
  question: Michigan's 'Move Over Law' requires drivers to move over one lane for
    stationary emergency vehicles with lights flashing. If moving over is not possible,
    what must the driver do?
  choices:
    A: Maintain speed but honk the horn
    B: Slow down to at least 10 mph below the posted speed limit
    C: Stop completely until signaled to pass
    D: Speed up to pass the area quickly
  answer: B
  explanation: Under Michigan law (MCL 257.653a), if you cannot move over for an authorized
    emergency vehicle, you must slow down to at least 10 mph below the posted speed
    limit and proceed with caution.
- id: 103
  category: defensive_driving
  question: Michigan has a high population of deer. If a deer jumps in front of your
    vehicle, what is the safest defensive action?
  choices:
    A: Swerve sharply into the other lane
    B: Swerve onto the shoulder of the road
    C: Brake firmly but do not swerve
    D: Speed up to minimize the impact
  answer: C
  explanation: Michigan safety experts advise drivers to 'Brake, stay in your lane,
    and do not swerve.' Swerving can lead to more serious head-on collisions or rollovers.
- id: 104
  category: defensive_driving
  question: When entering a construction zone in Michigan, what happens to the fines
    for moving violations?
  choices:
    A: They are reduced by half
    B: They remain the same
    C: They are doubled
    D: They are tripled
  answer: C
  explanation: In Michigan, traffic fines are doubled for moving violations committed
    in work zones.
- id: 105
  category: defensive_driving
  question: What is the 'Basic Speed Law' in Michigan?
  choices:
    A: Always drive at the posted speed limit
    B: Drive at a speed that is careful and prudent for current conditions
    C: Never drive slower than 45 mph on highways
    D: The speed limit is 55 mph on all rural roads
  answer: B
  explanation: Michigan's Basic Speed Law requires drivers to drive at a careful and
    prudent speed in all driving conditions, even if it means driving slower than
    the posted limit.
- id: 106
  category: defensive_driving
  question: 'In Michigan, if you are driving on a road with three or more lanes and
    an emergency vehicle with flashing lights is stopped on the right shoulder, you
    must:'
  choices:
    A: Stop in your lane
    B: Move over at least one lane to the left
    C: Maintain your speed and stay in the right lane
    D: Turn on your hazard lights and stop
  answer: B
  explanation: Michigan's Move Over Law requires drivers to move over at least one
    lane for stationary emergency vehicles if there are at least two lanes available
    in that direction.
- id: 107
  category: defensive_driving
  question: When driving in winter conditions in Michigan, why are bridges and overpasses
    particularly dangerous?
  choices:
    A: They are usually narrower than the road
    B: They freeze before the rest of the roadway
    C: They have a higher speed limit
    D: They are not salted by road crews
  answer: B
  explanation: Bridges and overpasses lack the insulation of the ground underneath,
    causing them to freeze faster than normal roads, often creating 'black ice'.
- id: 108
  category: defensive_driving
  question: 'If your vehicle is equipped with Anti-lock Brakes (ABS) and you need
    to stop quickly on a slippery road in Michigan, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Lightly tap the brakes
    D: Shift into neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. The system will automatically
    pump the brakes for you to prevent wheel lock-up.
- id: 109
  category: defensive_driving
  question: In Michigan, what is the '3-second rule' used for?
  choices:
    A: Determining how long to wait at a stop sign
    B: Measuring safe following distance
    C: Timing how long to use a turn signal before a lane change
    D: Calculating the time needed to cross an intersection
  answer: B
  explanation: The 3-second rule is a defensive driving technique used to ensure a
    safe following distance behind the vehicle ahead.
- id: 110
  category: alcohol_drugs_health
  question: In Michigan, what is the legal Blood Alcohol Concentration (BAC) limit
    for a driver age 21 or older?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: For drivers 21 and older, it is illegal to drive with a BAC of 0.08%
    or higher in Michigan.
- id: 111
  category: alcohol_drugs_health
  question: Under Michigan law, what is the penalty regarding points for driving with
    any presence of a Schedule 1 controlled substance or cocaine in your body?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: No points, only a fine
  answer: C
  explanation: Operating with the presence of a Schedule 1 drug or cocaine results
    in 6 points being added to your Michigan driving record.
- id: 112
  category: alcohol_drugs_health
  question: If you are under 21, where must unopened alcohol be kept in a vehicle
    if you are not accompanied by a parent or guardian?
  choices:
    A: In the glove compartment
    B: On the floor of the back seat
    C: In the trunk
    D: Under the driver's seat
  answer: C
  explanation: Drivers under 21 may not transport alcohol unless accompanied by an
    adult 21 or older; if they do, the alcohol must be in the trunk or a compartment
    not readily accessible to the passenger area if there is no trunk.
- id: 113
  category: alcohol_drugs_health
  question: Michigan's 'Open Container' law prohibits which of the following?
  choices:
    A: Carrying an unsealed container of alcohol in the passenger area of a vehicle
    B: Carrying an empty beer bottle in the trunk
    C: Transporting sealed wine in the back seat
    D: Drinking water while driving
  answer: A
  explanation: It is illegal to transport or possess an open container of alcohol
    in the passenger area of a vehicle on Michigan roads, regardless of whether the
    vehicle is moving or parked.
- id: 114
  category: alcohol_drugs_health
  question: A driver convicted under Michigan's 'Super Drunk' law (BAC 0.17 or higher)
    must use an Ignition Interlock Device (IID) to drive during their restricted period.
    Who is responsible for the costs of this device?
  choices:
    A: The State of Michigan
    B: The Secretary of State
    C: The driver
    D: The driver's insurance company
  answer: C
  explanation: The driver is responsible for all costs associated with the installation
    and maintenance of an Ignition Interlock Device.
- id: 115
  category: alcohol_drugs_health
  question: According to the Michigan Driver's Manual, if you have a medical condition
    such as epilepsy, you must be seizure-free for how long before you can be considered
    for a license?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Michigan requires drivers with conditions like epilepsy to be seizure-free
    for at least 6 months before they are eligible for a driver's license.
- id: 116
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with other drugs, such as cold medicine
    or prescriptions?
  choices:
    A: The effects of each are cancelled out
    B: The alcohol will prevent the drug from working
    C: The combined effect is often greater than the sum of the two
    D: There is no combined effect on driving ability
  answer: C
  explanation: Mixing alcohol and drugs can cause a synergistic effect, meaning the
    impairment is much worse than if only one substance was used.
- id: 117
  category: alcohol_drugs_health
  question: Under Michigan law, how does the legalization of recreational marijuana
    affect driving rules?
  choices:
    A: It is legal to drive while using marijuana
    B: It is legal to drive as long as you have a medical card
    C: It remains illegal to drive while under the influence of marijuana
    D: Marijuana use does not affect driving ability
  answer: C
  explanation: Despite the legalization of marijuana in Michigan, it remains strictly
    illegal to operate a motor vehicle while impaired by marijuana.
- id: 118
  category: alcohol_drugs_health
  question: What is the mandatory 'hard' suspension period for a first-time OWI (non-High
    BAC) conviction in Michigan before a restricted license can be issued?
  choices:
    A: None; restricted driving starts immediately
    B: 30 days
    C: 45 days
    D: 90 days
  answer: B
  explanation: A first-time OWI conviction results in a 180-day license suspension,
    with no driving allowed (hard suspension) for the first 30 days, followed by 150
    days of restricted driving.
- id: 119
  category: alcohol_drugs_health
  question: How many points are assessed for a conviction of Manslaughter or Negligent
    Homicide involving the use of a motor vehicle in Michigan?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Manslaughter, Negligent Homicide, or any felony involving a motor vehicle
    results in 6 points on the Michigan driving record.
- id: 120
  category: alcohol_drugs_health
  question: In Michigan, what is the 'hard' suspension period for a first-time 'High
    BAC' (Super Drunk) offense before a restricted license with an IID can be granted?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 1 year
  answer: B
  explanation: For a 'High BAC' (0.17 or higher) offense, the license is suspended
    for 1 year. No driving is allowed for the first 45 days, followed by 320 days
    of restricted driving with an Ignition Interlock Device.
- id: 121
  category: alcohol_drugs_health
  question: 'Under Michigan law, a person under 21 may only transport alcohol in a
    vehicle if:'
  choices:
    A: The container is unopened and in the back seat.
    B: They are accompanied by a person at least 21 years of age.
    C: The vehicle is a commercial vehicle.
    D: The alcohol is for a religious ceremony.
  answer: B
  explanation: Michigan law prohibits persons under 21 from transporting alcohol unless
    they are accompanied by a person 21 or older (such as a parent or guardian). If
    unaccompanied, they can be charged even if the container is unopened.
- id: 122
  category: alcohol_drugs_health
  question: What is the maximum jail time for a first-offense standard Operating While
    Intoxicated (OWI) in Michigan?
  choices:
    A: 30 days
    B: 93 days
    C: 180 days
    D: 1 year
  answer: B
  explanation: A first-offense OWI (BAC below 0.17) in Michigan carries a potential
    jail sentence of up to 93 days.
- id: 123
  category: alcohol_drugs_health
  question: For a first-time 'High BAC' (Super Drunk) conviction in Michigan, what
    is the maximum fine that can be imposed?
  choices:
    A: $300
    B: $500
    C: $700
    D: $1,000
  answer: C
  explanation: A 'High BAC' conviction (0.17 or higher) carries a fine ranging from
    $200 to $700 for a first offense, which is higher than the standard OWI fine.
- id: 124
  category: alcohol_drugs_health
  question: How many points are added to a Michigan driving record for operating a
    vehicle with any presence of a Schedule 1 controlled substance?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: No points, only a fine
  answer: C
  explanation: Michigan has a zero-tolerance policy for Schedule 1 drugs. Operating
    with any amount of these substances in your system results in 6 points, the same
    as an OWI.
- id: 125
  category: alcohol_drugs_health
  question: According to the Michigan Driver's Manual, what is the only way to reduce
    your blood alcohol concentration (BAC)?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time to pass
  answer: D
  explanation: Only time can reduce BAC. The body processes alcohol at a steady rate,
    and stimulants like coffee or cold water do not speed up the detoxification process.
- id: 126
  category: alcohol_drugs_health
  question: In Michigan, a conviction for Operating While Intoxicated (OWI) causing
    serious injury to another person results in how many points?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Any OWI conviction involving injury or death results in 6 points being
    added to the driver's record, along with severe criminal penalties.
- id: 127
  category: alcohol_drugs_health
  question: Under Michigan's Zero Tolerance law, a first-offense conviction for a
    driver under 21 can include up to how many hours of community service?
  choices:
    A: 40 hours
    B: 100 hours
    C: 360 hours
    D: 500 hours
  answer: C
  explanation: A first-offense Zero Tolerance conviction (BAC 0.02-0.07) for a minor
    may include up to 360 hours of community service.
- id: 128
  category: alcohol_drugs_health
  question: A person convicted of a 'High BAC' (Super Drunk) offense in Michigan must
    wait how many days before they are eligible for a restricted license with an ignition
    interlock?
  choices:
    A: 30 days
    B: 45 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: For a High BAC offense, the license is suspended for one year. The
    driver is not eligible for a restricted license until after 45 days of 'hard'
    suspension, and then only with a Breath Alcohol Ignition Interlock Device (BAIID).
- id: 129
  category: alcohol_drugs_health
  question: Which of the following is usually the first driving ability affected by
    alcohol consumption?
  choices:
    A: Coordination
    B: Vision
    C: Judgment
    D: Reaction time
  answer: C
  explanation: Judgment is the first ability to be impaired by alcohol, often leading
    drivers to take risks they otherwise wouldn't, even before physical coordination
    is noticeably affected.
- id: 130
  category: alcohol_drugs_health
  question: In Michigan, what is the maximum jail sentence for a first-offense OWI
    with a passenger under the age of 16 (Child Endangerment)?
  choices:
    A: 93 days
    B: 180 days
    C: 1 year
    D: 5 years
  answer: C
  explanation: Operating While Intoxicated with a minor under 16 in the vehicle is
    a misdemeanor punishable by up to 1 year in jail for a first offense.
- id: 131
  category: alcohol_drugs_health
  question: 'If an adult driver (21+) refuses a Preliminary Breath Test (PBT) requested
    by a police officer in Michigan, it is considered:'
  choices:
    A: A felony
    B: A 6-point offense
    C: A civil infraction
    D: Legal, as it is not the evidentiary test
  answer: C
  explanation: Refusing a PBT (the roadside breathalyzer) is a civil infraction for
    adults. This is separate from refusing the chemical test at the station (Implied
    Consent), which carries much harsher penalties.
- id: 132
  category: alcohol_drugs_health
  question: 'Michigan drivers are required by law to report any physical or mental
    condition that may affect their ability to drive safely to:'
  choices:
    A: Their insurance company
    B: The local police department
    C: The Secretary of State
    D: The Department of Transportation
  answer: C
  explanation: Michigan law requires drivers to report any medical conditions that
    could impair their driving to the Secretary of State when applying for or renewing
    a license.
- id: 133
  category: alcohol_drugs_health
  question: What is the primary difference between OWI and OWVI in Michigan?
  choices:
    A: OWI is for drugs, OWVI is for alcohol.
    B: OWVI means your ability to drive was visibly affected by alcohol, regardless
      of BAC.
    C: OWI only applies to drivers under 21.
    D: OWVI does not result in any points on the record.
  answer: B
  explanation: Operating While Visibly Impaired (OWVI) means that because of alcohol
    or drug consumption, your ability to operate a motor vehicle was visibly reduced.
    You can be convicted of OWVI even if your BAC is below 0.08.
- id: 134
  category: penalties_and_points
  question: If a Michigan driver is convicted of speeding 16 mph or more over the
    legal limit, how many points are added to their record?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: Speeding 16 mph or more over the legal limit results in 4 points being
    added to a Michigan driving record.
- id: 135
  category: penalties_and_points
  question: How many points are assessed on a Michigan driving record for failing
    to stop and reveal your identity at the scene of an accident?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failing to stop and reveal identity after an accident is a major violation
    in Michigan and carries a penalty of 6 points.
- id: 136
  category: penalties_and_points
  question: In Michigan, a conviction for 'Following Too Closely' (tailgating) results
    in how many points?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 0 points
  answer: A
  explanation: Following too closely is considered a moving violation in Michigan
    and is assigned 2 points.
- id: 137
  category: penalties_and_points
  question: In Michigan, how many points are assessed for operating a vehicle with
    any presence of a Schedule 1 drug or cocaine in your body?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: License revocation with 0 points
  answer: C
  explanation: Operating with the presence of a Schedule 1 drug or cocaine (OWPD)
    is treated similarly to OWI and results in 6 points.
- id: 138
  category: penalties_and_points
  question: Under Michigan's 2023 distracted driving laws, at which offense of using
    a handheld mobile device while driving do points begin to be assessed?
  choices:
    A: The first offense
    B: The second offense
    C: The third offense
    D: Points are never assessed for texting
  answer: C
  explanation: Under the law effective June 30, 2023, the first and second offenses
    for handheld device use carry fines/community service but no points. The third
    and subsequent offenses result in 2 points.
- id: 139
  category: penalties_and_points
  question: How many points are added to a Michigan driving record for Manslaughter
    or Negligent Homicide involving a motor vehicle?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Manslaughter, Negligent Homicide, or any felony involving the use of
    a motor vehicle results in 6 points in Michigan.
- id: 140
  category: penalties_and_points
  question: In Michigan, failing to stop and reveal your identity at the scene of
    an accident results in how many points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: Points are only assessed if there is an injury
  answer: C
  explanation: Failure to stop and give identification at the scene of an accident
    (hit and run) is a serious violation that carries 6 points.
- id: 141
  category: penalties_and_points
  question: 'A Michigan Level 1 or Level 2 GDL driver who is responsible for a traffic
    accident may be required to:'
  choices:
    A: Pay a $1,000 surcharge
    B: Attend a driver re-examination
    C: Restart Segment 1 of Driver Education
    D: Wait until age 21 for a Level 3 license
  answer: B
  explanation: Under the Graduated Driver Licensing (GDL) program, drivers with a
    Level 1 or Level 2 license who are involved in an at-fault accident or receive
    a ticket must attend a driver re-examination.
- id: 142
  category: penalties_and_points
  question: Under Michigan's Implied Consent law, how many points are added to a driver's
    record for refusing a chemical test for the first time?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: No points, but the license is suspended
  answer: C
  explanation: Refusing a chemical test (breath, blood, or urine) under the Implied
    Consent law results in 6 points and a one-year license suspension.
- id: 143
  category: sharing_the_road
  question: Under Michigan's 'Move Over Law,' what must you do when approaching a
    stationary emergency vehicle with its lights flashing on a road with at least
    two lanes in your direction?
  choices:
    A: Maintain your speed but move to the left lane
    B: Move over one lane, or if not possible, slow down to at least 10 mph below
      the posted limit
    C: Stop completely until the emergency vehicle moves
    D: Speed up to pass the vehicle as quickly as possible
  answer: B
  explanation: Michigan law requires drivers to move over one lane for stationary
    emergency vehicles. If moving over is not possible or safe, the driver must slow
    down to at least 10 mph below the posted speed limit.
- id: 144
  category: sharing_the_road
  question: 'In Michigan, you are NOT required to stop for a school bus with red lights
    flashing if:'
  choices:
    A: You are traveling in the opposite direction on a road divided by a barrier
      or median
    B: The bus is stopped in a turn lane
    C: You are in a residential zone
    D: There are more than four lanes of traffic
  answer: A
  explanation: Drivers traveling in the opposite direction on a highway divided by
    a physical barrier or median (such as a concrete wall or grass strip) are not
    required to stop for a school bus.
- id: 145
  category: sharing_the_road
  question: To legally ride a motorcycle without a helmet in Michigan, a driver must
    be at least 21 years old and carry at least how much in first-party medical benefits?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $50,000
  answer: C
  explanation: Michigan law allows riders 21 and older to ride without a helmet if
    they have at least $20,000 in first-party medical benefits and have held a motorcycle
    endorsement for at least two years or passed a safety course.
- id: 146
  category: sharing_the_road
  question: When following a large truck, why should you increase your following distance
    to more than the standard 3-4 seconds?
  choices:
    A: Trucks have smaller blind spots than cars
    B: To allow the truck driver to see you in their side mirrors
    C: Trucks are required to stop at all railroad crossings
    D: Trucks always travel faster than the speed limit
  answer: B
  explanation: If you cannot see the truck driver's face in their side mirrors, they
    cannot see you. Increasing following distance ensures you are out of the 'No-Zone'
    (blind spot).
- id: 147
  category: sharing_the_road
  question: In Michigan, what must you do when you see a pedestrian with a white cane
    or a guide dog at an intersection?
  choices:
    A: Honk your horn to let them know you are there
    B: Stop and stay stopped until the pedestrian has finished crossing the street
    C: Drive around them if there is enough room
    D: Slow down and proceed with caution
  answer: B
  explanation: Michigan law requires drivers to come to a complete stop and yield
    the right-of-way to any blind pedestrian carrying a white cane or using a guide
    dog.
- id: 148
  category: sharing_the_road
  question: When a funeral procession is using a fluorescent orange, white, or purple
    flag with a religious symbol, what is the rule regarding right-of-way in Michigan?
  choices:
    A: The procession must yield to all other traffic
    B: The procession has the right-of-way at intersections, regardless of traffic
      lights
    C: Only the lead vehicle has the right-of-way
    D: Processions are only allowed on Sundays
  answer: B
  explanation: Under Michigan law (MCL 257.654), a funeral procession has the right-of-way
    over all other vehicles (except emergency vehicles) at any intersection when the
    vehicles in the procession display the proper flags.
- id: 149
  category: sharing_the_road
  question: What does a flashing yellow light on a school bus indicate to Michigan
    drivers?
  choices:
    A: The bus is about to stop and drivers should prepare to stop
    B: The bus is unloading children and you must stop immediately
    C: The bus is broken down
    D: The bus is turning left
  answer: A
  explanation: Flashing yellow lights on a school bus are a warning that the bus is
    preparing to stop to load or unload children. Drivers should slow down and be
    prepared to stop when the lights turn red.
- id: 150
  category: sharing_the_road
  question: In Michigan, which of the following vehicles are covered under the 'Move
    Over Law' when they are stationary with flashing lights?
  choices:
    A: Police and Fire vehicles only
    B: Ambulances and Tow trucks only
    C: Police, Fire, Rescue, Road Service (Tow Trucks), and Utility vehicles
    D: Only vehicles with blue and red lights
  answer: C
  explanation: Michigan's Move Over Law applies to all stationary authorized emergency
    vehicles, including police, fire, rescue, tow trucks, and utility service vehicles
    with flashing lights.
- id: 151
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may need to:'
  choices:
    A: Stay entirely in the right lane
    B: Swing wide to the left before turning right
    C: Turn from the left lane
    D: Stop and wait for all traffic to clear in both directions
  answer: B
  explanation: Large trucks have a wide turning radius and often need to swing wide
    to the left to clear the curb when making a right turn.
- id: 152
  category: sharing_the_road
  question: 'Under Michigan law, it is illegal to pass a bicycle on the right unless:'
  choices:
    A: The bicyclist is signaling a left turn
    B: The bicyclist is traveling below 10 mph
    C: There is a dedicated bike lane
    D: It is never legal to pass a bicycle on the right
  answer: A
  explanation: Similar to passing other vehicles, you may pass a bicyclist on the
    right only if they are making or about to make a left turn and there is sufficient
    pavement to do so safely.
- id: 153
  category: sharing_the_road
  question: 'In Michigan, if you are involved in a crash with a stationary emergency
    vehicle because you failed to move over, and it results in an injury to emergency
    personnel, the penalty can include:'
  choices:
    A: A fine of $500 and no jail time
    B: A felony charge and up to 2 years in prison
    C: A simple traffic ticket
    D: A 30-day license suspension only
  answer: B
  explanation: Violating the Move Over Law and causing injury to emergency response
    personnel is a felony in Michigan, punishable by up to 2 years in prison and/or
    a fine of up to $1,000.
- id: 154
  category: sharing_the_road
  question: Under Michigan's 'Move Over Law,' if you are unable to move over for a
    stationary emergency vehicle with its lights flashing, what must you do?
  choices:
    A: Maintain your speed but honk your horn
    B: Slow down to at least 10 mph below the posted speed limit
    C: Slow down to 25 mph regardless of the posted limit
    D: Stop completely until the emergency vehicle leaves
  answer: B
  explanation: Michigan law requires drivers to move over one lane for stationary
    emergency vehicles. If moving over is unsafe, the driver must slow down to at
    least 10 mph below the posted speed limit.
- id: 155
  category: sharing_the_road
  question: In Michigan, you are approaching a school bus stopped on the opposite
    side of a roadway that is divided by a barrier or median. What are you required
    to do?
  choices:
    A: Stop at least 20 feet away
    B: Stop only if there are children crossing
    C: You are not required to stop
    D: Slow down to 10 mph
  answer: C
  explanation: On a highway divided by a barrier or median, drivers on the opposite
    side of the road from a stopped school bus are not required to stop.
- id: 156
  category: sharing_the_road
  question: What is the penalty in Michigan for failing to yield to a person using
    a white cane or a guide dog?
  choices:
    A: A civil infraction and a fine
    B: A 30-day license suspension
    C: A misdemeanor charge
    D: No penalty if the pedestrian was outside a crosswalk
  answer: C
  explanation: Under Michigan law, failing to yield to a blind pedestrian carrying
    a white cane or using a guide dog is a misdemeanor.
- id: 157
  category: sharing_the_road
  question: 'According to Michigan law, a person under 21 may operate a motorcycle
    without a helmet only if they:'
  choices:
    A: Have 5 years of riding experience
    B: Are riding on a road with a speed limit under 45 mph
    C: They cannot; all riders under 21 must wear a helmet
    D: Carry $100,000 in medical insurance
  answer: C
  explanation: In Michigan, while some riders over 21 may opt out of wearing a helmet
    if they meet specific insurance and licensing requirements, all operators and
    passengers under the age of 21 must wear a helmet.
- id: 158
  category: sharing_the_road
  question: 'When following a motorcycle in Michigan, you should maintain a following
    distance of at least:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 to 4 seconds
    D: 10 seconds
  answer: C
  explanation: Because motorcycles can stop more quickly than cars and are more easily
    affected by road conditions, a following distance of 3 to 4 seconds is recommended.
- id: 159
  category: sharing_the_road
  question: What does a slow-moving vehicle sign look like in Michigan?
  choices:
    A: A square blue sign
    B: A circular yellow sign
    C: A triangular fluorescent orange sign with a red reflective border
    D: A diamond-shaped green sign
  answer: C
  explanation: Slow-moving vehicles, such as farm equipment or horse-drawn carriages,
    must display a triangular fluorescent orange sign with a red reflective border
    when traveling on public roads.
- id: 160
  category: sharing_the_road
  question: In Michigan, when are you allowed to drive between vehicles that are part
    of a funeral procession?
  choices:
    A: When the procession is moving slower than the speed limit
    B: Never, unless directed by a police officer
    C: Only if your turn is coming up
    D: If there is a gap of more than 20 feet
  answer: B
  explanation: Michigan law gives funeral processions the right of way at intersections.
    It is illegal to pass through or interrupt a funeral procession unless directed
    to do so by a law enforcement officer.
- id: 161
  category: sharing_the_road
  question: 'When a school bus has its overhead yellow lights flashing, it means:'
  choices:
    A: The bus is about to stop and you should prepare to stop
    B: The bus is speeding up
    C: You must stop immediately
    D: There is a mechanical emergency
  answer: A
  explanation: Flashing yellow lights on a school bus are a warning to motorists that
    the bus is preparing to stop to load or unload students.
- id: 162
  category: sharing_the_road
  question: 'If you are involved in a crash with a stationary emergency vehicle in
    Michigan and it results in the injury of a responder, you may face:'
  choices:
    A: A $100 fine only
    B: A felony charge punishable by up to 2 years in prison
    C: A misdemeanor with no jail time
    D: A mandatory 10-year license revocation
  answer: B
  explanation: Violating the Move Over Law and causing injury to emergency response
    personnel is a felony in Michigan, punishable by up to 2 years in prison and/or
    a fine of up to $1,000.
- id: 163
  category: sharing_the_road
  question: 'In Michigan, bicyclists are required to ride:'
  choices:
    A: Against the flow of traffic
    B: Only on sidewalks
    C: With the flow of traffic, as close to the right side of the road as safe
    D: In the center of the lane at all times
  answer: C
  explanation: Michigan law requires bicyclists to ride with the flow of traffic and
    as close to the right side of the road as practicable and safe.
- id: 164
  category: vehicle_information
  question: According to the Michigan Vehicle Code, what is the minimum legal tread
    depth for tires on a passenger vehicle?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Michigan law requires that tires have a tread depth of at least 2/32
    of an inch in the major tread grooves to be considered safe and legal.
- id: 165
  category: vehicle_information
  question: In Michigan, when are you required by law to use your vehicle's headlights?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From a half-hour after sunset to a half-hour before sunrise
    D: Only when visibility is less than 100 feet
  answer: C
  explanation: Michigan law (MCL 257.684) requires headlights to be turned on from
    a half-hour after sunset until a half-hour before sunrise, and at any time when
    visibility is not sufficient to see clearly at a distance of 500 feet.
- id: 166
  category: vehicle_information
  question: What are the Michigan restrictions regarding window tinting on the front
    side windows (to the left and right of the driver)?
  choices:
    A: No tinting of any kind is allowed.
    B: Tinting is allowed as long as it transmits at least 35% of light.
    C: Tinting is allowed only on the top 4 inches of the window.
    D: Full tinting is allowed if the driver has a doctor's note for any reason.
  answer: C
  explanation: Michigan law prohibits tinting on the front side windows except for
    the top 4 inches. A medical exception may apply for specific conditions, but the
    standard rule is the 4-inch strip.
- id: 167
  category: vehicle_information
  question: Under Michigan law, every motor vehicle must be equipped with a mirror
    so located as to reflect to the driver a view of the highway for a distance of
    at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Michigan law (MCL 257.708) requires a rearview mirror that provides
    a view of the highway for at least 200 feet to the rear of the vehicle.
- id: 168
  category: vehicle_information
  question: If a load extends more than how many feet beyond the rear of your vehicle's
    body in Michigan, it must be marked with a red flag during the day?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: MCL 257.693 states that whenever a load extends 4 feet or more beyond
    the rear of the bed or body of a vehicle, a red flag (12 inches square) must be
    displayed during the day, and a red light must be used at night.
- id: 169
  category: vehicle_information
  question: 'In Michigan, service brakes on a passenger vehicle must be capable of
    stopping the vehicle from a speed of 20 mph within a distance of:'
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 45 feet
  answer: C
  explanation: Michigan's equipment standards require that the service brakes on a
    passenger vehicle be able to stop the car within 30 feet when traveling at 20
    mph on a dry, level surface.
- id: 170
  category: vehicle_information
  question: Which of the following is true regarding Michigan's laws on vehicle mufflers
    and exhaust systems?
  choices:
    A: Muffler cutouts or bypasses are legal for off-road use only.
    B: Exhaust systems may produce any amount of noise as long as they are factory
      installed.
    C: A vehicle must have a muffler in good working order to prevent excessive or
      unusual noise.
    D: Mufflers are only required on vehicles manufactured after 2010.
  answer: C
  explanation: MCL 257.707 requires every motor vehicle to be equipped with a muffler
    in good working order to prevent excessive noise and smoke. Cutouts, bypasses,
    or similar devices are prohibited.
- id: 171
  category: vehicle_information
  question: 'Michigan law prohibits hanging objects from the rearview mirror or placing
    stickers on the windshield if they:'
  choices:
    A: Are not related to vehicle registration.
    B: Obstruct the driver's clear view of the highway.
    C: Are larger than 2 inches by 2 inches.
    D: Are visible to other drivers.
  answer: B
  explanation: MCL 257.709 prohibits any object that obstructs the driver's clear
    view of the highway or any intersecting highway. This includes dangling ornaments
    and non-transparent materials.
- id: 172
  category: vehicle_information
  question: 'In Michigan, the rear registration plate (license plate) must be illuminated
    by a white light so that it is clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Michigan law requires a white light to illuminate the rear license
    plate so that it is visible and legible from a distance of 50 feet to the rear.
- id: 173
  category: vehicle_information
  question: 'Every motor vehicle in Michigan must be equipped with a horn that can
    be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: According to MCL 257.706, a motor vehicle must have a horn in good
    working order capable of emitting sound audible under normal conditions from a
    distance of not less than 200 feet.
- id: 174
  category: vehicle_information
  question: In Michigan, what is the height requirement for the mounting of headlamps
    on a motor vehicle (measured from the center of the lamp to the level ground)?
  choices:
    A: Between 12 and 36 inches
    B: Between 24 and 54 inches
    C: Between 15 and 48 inches
    D: There is no height requirement.
  answer: B
  explanation: MCL 257.685 specifies that headlamps on motor vehicles must be located
    at a height of not more than 54 inches nor less than 24 inches above the ground.
- id: 175
  category: vehicle_information
  question: Michigan law requires that turn signal lamps be visible from a distance
    of at least how many feet to the front and rear in normal sunlight?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Turn signals in Michigan must be visible from a distance of 100 feet
    to both the front and the rear of the vehicle during normal sunlight.
- id: 176
  category: vehicle_information
  question: Which of the following equipment is mandatory for all trailers or semi-trailers
    in Michigan that have a gross weight of 3,000 pounds or more?
  choices:
    A: A backup camera
    B: Brakes acting on all wheels
    C: Chrome bumpers
    D: Fog lights
  answer: B
  explanation: MCL 257.705 requires that every trailer or semi-trailer of a gross
    weight of 3,000 pounds or more be equipped with brakes acting on all wheels.
- id: 177
  category: vehicle_information
  question: According to the Michigan Vehicle Code, when must a driver turn on their
    headlights?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From a half-hour after sunset to a half-hour before sunrise
    D: Only when it is raining or snowing
  answer: C
  explanation: In Michigan, headlights must be turned on from a half-hour after sunset
    until a half-hour before sunrise, and at any time when visibility is less than
    500 feet.
- id: 178
  category: vehicle_information
  question: 'Under Michigan law, you must dim your high beams when following another
    vehicle from the rear within a distance of:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 150 feet
  answer: C
  explanation: Michigan law requires drivers to dim their high beams when following
    another vehicle within 500 feet.
- id: 179
  category: vehicle_information
  question: 'A ''Slow Moving Vehicle'' emblem (an orange triangle) must be displayed
    on the rear of any vehicle in Michigan that is designed to operate at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The Slow Moving Vehicle (SMV) emblem is required on all vehicles designed
    to travel at speeds of 25 mph or less on public highways.
- id: 180
  category: vehicle_information
  question: Under Michigan law, if a load extends more than how many feet beyond the
    rear of the vehicle body, a red flag (day) or red light (night) must be attached
    to the extreme rear of the load?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: Whenever a load extends 4 feet or more beyond the rear of the bed or
    body of a vehicle, a red flag or red light must be displayed at the end of the
    load.
- id: 181
  category: vehicle_information
  question: Which of the following is true regarding Michigan's requirements for windshield
    washers?
  choices:
    A: They are only required for commercial vehicles
    B: They are recommended but not legally required
    C: Every motor vehicle manufactured after January 1, 1956, must be equipped with
      them
    D: They are only required if the vehicle does not have wipers
  answer: C
  explanation: Michigan law requires all motor vehicles manufactured after Jan. 1,
    1956, to be equipped with a windshield washer system in good working order.
- id: 182
  category: vehicle_information
  question: 'In Michigan, children must be properly buckled into a booster seat until
    they are:'
  choices:
    A: 6 years old or 4 feet tall
    B: 8 years old or 4 feet 9 inches tall
    C: 10 years old or 5 feet tall
    D: 12 years old or 4 feet 9 inches tall
  answer: B
  explanation: Michigan law requires children to be in a booster seat until they are
    8 years old or 4'9" tall, whichever comes first.
- id: 183
  category: vehicle_information
  question: Michigan law prohibits the use of which equipment on a passenger vehicle
    unless it is an emergency vehicle?
  choices:
    A: Fog lights
    B: Running board lights
    C: A siren, whistle, or bell
    D: LED headlights
  answer: C
  explanation: Under Michigan law, no vehicle shall be equipped with, nor shall any
    person use upon a vehicle, any siren, whistle, or bell, except for authorized
    emergency vehicles.
- id: 184
  category: vehicle_information
  question: In Michigan, what is the legal requirement for a vehicle's exhaust system?
  choices:
    A: It must be loud enough to be heard from 100 feet
    B: It must have a muffler in good working order to prevent excessive noise
    C: Exhaust cutouts are permitted for highway use
    D: Mufflers are only required on vehicles with more than 4 cylinders
  answer: B
  explanation: Michigan law requires every motor vehicle to have a muffler in good
    working order and in constant operation to prevent excessive or unusual noise
    and annoying smoke.
- id: 185
  category: signs_and_signals
  question: 'According to Michigan law, a left turn on a red light is legal when turning
    from a one-way or two-way street onto:'
  choices:
    A: A two-way street
    B: A one-way street carrying traffic in the direction of the turn
    C: Any street, as long as no traffic is coming
    D: A left turn on red is never legal in Michigan
  answer: B
  explanation: Michigan law (MCL 257.612) is unique in that it allows drivers to turn
    left on a red light from either a one-way or a two-way street onto a one-way street
    carrying traffic in the direction of the turn, after a complete stop and yielding.
- id: 186
  category: signs_and_signals
  question: When approaching a flashing red traffic signal in Michigan, what must
    you do?
  choices:
    A: Slow down and proceed with caution
    B: Stop completely and proceed only when it is safe to do so
    C: Stop and wait for the light to turn green
    D: Yield to traffic on the right only
  answer: B
  explanation: In Michigan, a flashing red light is treated the same as a stop sign.
    You must come to a complete stop and may proceed only when it is safe.
- id: 187
  category: signs_and_signals
  question: What does a flashing yellow traffic signal indicate to a driver in Michigan?
  choices:
    A: The light is about to turn red; stop if you can do so safely
    B: Stop and yield to all cross-traffic
    C: Proceed with caution through the intersection
    D: Pedestrians are present in the crosswalk
  answer: C
  explanation: A flashing yellow light means you should proceed with caution. You
    do not need to stop, but you must be alert and prepared for potential hazards.
- id: 188
  category: signs_and_signals
  question: What is the standard shape and color of a Yield sign in Michigan?
  choices:
    A: An equilateral triangle pointing down, red and white
    B: A diamond shape, yellow and black
    C: An octagon, red and white
    D: A rectangle, white and black
  answer: A
  explanation: Yield signs are downward-pointing triangles with a red border and white
    interior.
- id: 189
  category: signs_and_signals
  question: 'A five-sided (pentagon) sign that is fluorescent yellow-green in color
    indicates:'
  choices:
    A: A construction zone
    B: A no-passing zone
    C: A school zone or school crossing
    D: A hospital nearby
  answer: C
  explanation: The pentagon shape is reserved for school-related warnings, such as
    school zones or school crossings, and is usually fluorescent yellow-green.
- id: 190
  category: signs_and_signals
  question: 'In Michigan, a solid white line between lanes of traffic moving in the
    same direction indicates:'
  choices:
    A: Lane changes are strictly prohibited
    B: Lane changes are discouraged but allowed with caution
    C: The start of a bike lane
    D: You are approaching a stop sign
  answer: B
  explanation: The Michigan Driver's Manual states that solid white lines separate
    lanes of traffic moving in the same direction and are used to discourage lane
    changes in high-risk areas, though they are not strictly prohibited as double
    solid lines would be.
- id: 191
  category: signs_and_signals
  question: 'A double solid yellow line down the center of a Michigan roadway means:'
  choices:
    A: Passing is permitted if no traffic is coming
    B: Passing is permitted only during daylight hours
    C: Passing is prohibited in both directions
    D: Passing is permitted only for motorcycles
  answer: C
  explanation: Double solid yellow lines indicate that passing is prohibited for traffic
    moving in both directions.
- id: 192
  category: signs_and_signals
  question: If your vehicle's turn signals are not working, how should you signal
    a left turn using hand signals?
  choices:
    A: Extend your left arm straight out the window
    B: Extend your left arm upward
    C: Extend your left arm downward
    D: Wave your hand in a circular motion
  answer: A
  explanation: To signal a left turn, the driver should extend their left arm horizontally
    out the window.
- id: 193
  category: signs_and_signals
  question: What is the correct hand signal for slowing down or stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward with palm facing the rear
    D: Right arm extended out the passenger window
  answer: C
  explanation: To signal a stop or decrease in speed, extend your left arm downward
    with your palm facing backward.
- id: 194
  category: signs_and_signals
  question: What color are Michigan's temporary traffic control signs used in construction
    and maintenance work zones?
  choices:
    A: Yellow
    B: Orange
    C: Red
    D: Blue
  answer: B
  explanation: Orange is the standard color for warning signs in construction, maintenance,
    and utility work zones.
- id: 195
  category: signs_and_signals
  question: In Michigan, what does a flashing yellow arrow at an intersection mean?
  choices:
    A: You have a protected turn; oncoming traffic is stopped
    B: You must stop and wait for a green arrow
    C: You may turn left after yielding to oncoming traffic and pedestrians
    D: The intersection is closed to left turns
  answer: C
  explanation: A flashing yellow arrow means left turns are permitted, but they are
    unprotected. You must yield to oncoming traffic and pedestrians before completing
    the turn.
- id: 196
  category: signs_and_signals
  question: On a Michigan school bus, what do flashing overhead yellow lights indicate?
  choices:
    A: The bus is loading or unloading children; you must stop
    B: The bus is preparing to stop; you should prepare to stop
    C: The bus has a mechanical failure
    D: You may pass the bus with caution
  answer: B
  explanation: Flashing overhead yellow lights on a school bus warn drivers that the
    bus is about to stop to load or unload children. Drivers should prepare to stop.
- id: 197
  category: signs_and_signals
  question: 'A round yellow sign with a black ''X'' and the letters ''RR'' is placed:'
  choices:
    A: At the tracks of a railroad crossing
    B: In advance of a railroad crossing
    C: Only at rural intersections
    D: Where a road ends in a 'T' intersection
  answer: B
  explanation: The round yellow advance warning sign tells drivers that a railroad
    crossing is ahead.
- id: 198
  category: signs_and_signals
  question: 'In Michigan, a sign showing a white U-shaped arrow pointing toward a
    median crossover is used for:'
  choices:
    A: Emergency vehicles only
    B: An indirect left turn, commonly known as a 'Michigan Left'
    C: Indicating a dead-end street
    D: Warning of a sharp curve ahead
  answer: B
  explanation: Michigan uses indirect left turns (Michigan Lefts) at many intersections.
    Drivers must go past the intersection, use a median crossover, and then make a
    right turn or proceed straight.
- id: 199
  category: signs_and_signals
  question: What does a flashing yellow arrow mean at a Michigan intersection?
  choices:
    A: Stop and wait for a green arrow
    B: The turn is protected; oncoming traffic has a red light
    C: Yield to oncoming traffic and pedestrians, then turn with caution
    D: Speed up to complete the turn before the light changes
  answer: C
  explanation: A flashing yellow arrow means you may turn in the direction of the
    arrow after yielding to oncoming traffic and pedestrians. Oncoming traffic has
    a green light.
- id: 200
  category: signs_and_signals
  question: 'When you see a flashing red traffic light in Michigan, you should:'
  choices:
    A: Slow down and proceed with caution
    B: Stop completely and proceed only when it is safe to do so
    C: Stop and wait for the light to turn green
    D: Yield only if other vehicles are present
  answer: B
  explanation: A flashing red light must be treated the same as a stop sign. You must
    come to a complete stop and may proceed only when it is safe.
- id: 201
  category: signs_and_signals
  question: In Michigan, what do 'sharrows' (pavement markings showing a bicycle with
    two arrows above it) indicate?
  choices:
    A: A lane reserved exclusively for bicycles
    B: A lane where motorists are prohibited
    C: A lane shared by both motorists and bicyclists
    D: A pedestrian-only zone
  answer: C
  explanation: Sharrows, or shared-lane markings, indicate that bicyclists may use
    the full lane and help motorists and bicyclists share the road safely.
- id: 202
  category: signs_and_signals
  question: When approaching a 'Michigan Left' (a median crossover), what is the first
    step a driver must take to turn left?
  choices:
    A: Turn left directly at the intersection
    B: Pass the intersection, then turn right into the area designated for the U-turn
    C: Drive past the intersection, perform a U-turn in the middle of the block
    D: Turn right at the intersection, then make a U-turn
  answer: B
  explanation: To perform a Michigan Left, you typically drive through or turn right
    at the intersection, then use a designated median crossover to complete the U-turn
    and head in the desired direction.
- id: 203
  category: signs_and_signals
  question: 'According to Michigan law, you must stop for a school bus with its overhead
    red lights flashing unless:'
  choices:
    A: The bus is on the opposite side of a divided highway separated by a barrier
    B: The bus is stopped in a residential zone
    C: You are traveling at less than 25 mph
    D: There are no children visible
  answer: A
  explanation: Drivers are not required to stop for a school bus with flashing red
    lights if they are traveling in the opposite direction on a divided highway separated
    by a barrier or median island.
- id: 204
  category: signs_and_signals
  question: What does a pentagon-shaped sign indicate in Michigan?
  choices:
    A: Yield
    B: Railroad crossing
    C: School zone or school crossing
    D: No passing zone
  answer: C
  explanation: A five-sided (pentagon) sign is used exclusively to warn drivers that
    they are approaching a school zone or a school pedestrian crossing.
- id: 205
  category: signs_and_signals
  question: 'When approaching a stationary emergency vehicle with its lights flashing
    on the side of a Michigan highway with at least two lanes moving in your direction,
    you must:'
  choices:
    A: Stop and wait for the vehicle to move
    B: Maintain speed but move to the left lane
    C: Move over one lane, or if unsafe, slow down and pass with caution
    D: Honk your horn to alert the emergency workers
  answer: C
  explanation: Michigan's 'Move Over' law requires drivers to move over one lane for
    stationary emergency vehicles with flashing lights. If moving over is unsafe,
    the driver must slow down and pass with caution.
- id: 206
  category: signs_and_signals
  question: What is the correct hand signal to indicate a stop or a decrease in speed?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward with palm facing the rear
    D: Right arm extended straight out
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, extend your
    left arm downward with the palm facing toward the rear.
- id: 207
  category: signs_and_signals
  question: 'In Michigan, a ''Double Fines in Work Zones'' sign means that traffic
    fines are doubled for:'
  choices:
    A: All violations committed within the work zone
    B: Only speeding violations when workers are present
    C: All moving violations when workers are present
    D: Parking violations within the work zone
  answer: C
  explanation: Under Michigan law, fines are doubled for moving violations in work
    zones when workers are present.
- id: 208
  category: signs_and_signals
  question: 'A solid yellow line on your side of a broken yellow center line means:'
  choices:
    A: You may pass if it is safe
    B: Passing is prohibited on your side
    C: The road ahead is a one-way street
    D: You must stop before proceeding
  answer: B
  explanation: A solid yellow line on your side of the center line indicates a no-passing
    zone for your direction of travel.
- id: 209
  category: signs_and_signals
  question: In Michigan, when approaching a railroad crossing with flashing red lights
    and bells, you must stop no closer than how many feet from the nearest rail?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: B
  explanation: Michigan law requires drivers to stop at least 15 feet, but no more
    than 50 feet, from the nearest rail at a railroad crossing when signals indicate
    a train is approaching.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 210
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 211
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 212
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 213
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 214
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 215
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 216
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 217
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 218
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 219
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 220
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 221
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 222
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 223
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 224
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 225
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 226
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 227
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 228
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 229
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 230
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 231
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 232
