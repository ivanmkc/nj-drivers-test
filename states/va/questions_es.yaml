metadata:
  source: 2025 Virginia Driver's Manual (dmv.virginia.gov)
  source_original: 2025 Virginia Driver's Manual (dmv.virginia.gov)
  total_questions: 235
  language: es
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
