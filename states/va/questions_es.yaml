questions:
- id: 1
  category: driver_responsibility
  question: Según los datos de 2024 en el manual, ¿qué porcentaje de todas las personas
    que murieron en accidentes en Virginia eran hombres?
  choices:
    A: 31%
    B: 50%
    C: 71%
    D: 85%
  answer: C
  explanation: El manual indica que el 71% de todas las personas que murieron en accidentes
    en 2024 en Virginia eran hombres, a pesar de representar un poco menos de la mitad
    de la población.
- id: 2
  category: safe_driving_rules
  question: ¿Qué porcentaje de los ocupantes de vehículos que murieron en un accidente
    en Virginia en 2024 NO llevaban puesto el cinturón de seguridad?
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 71%
  answer: C
  explanation: Según el manual, en 2024, el 50% de los ocupantes de vehículos que
    murieron en un accidente no llevaban puesto el cinturón de seguridad.
- id: 3
  category: alcohol_drugs_health
  question: ¿Cuántas personas murieron en accidentes relacionados con el alcohol en
    Virginia en 2024?
  choices:
    A: '318'
    B: '410'
    C: '500'
    D: '710'
  answer: A
  explanation: El manual señala que los accidentes por conducir en estado de ebriedad
    son 100% prevenibles; sin embargo, en 2024, 318 personas murieron en accidentes
    relacionados con el alcohol en Virginia.
- id: 4
  category: alcohol_drugs_health
  question: ¿Cuál es la postura legal de Virginia sobre el consumo de alcohol en menores
    de edad?
  choices:
    A: Se aplica un límite de 0.08% de concentración de alcohol en la sangre (BAC)
    B: Es una ley de tolerancia cero
    C: Se aplica un límite de 0.02% de concentración de alcohol en la sangre (BAC)
    D: Está permitido si está acompañado por un adulto
  answer: B
  explanation: 'El manual establece explícitamente: "Recuerde, Virginia tiene una
    ley de tolerancia cero para el consumo de alcohol en menores de edad".'
- id: 5
  category: safe_driving_rules
  question: Al leer o enviar un mensaje de texto mientras conduce, ¿cuánto tiempo
    aparta normalmente la vista de la carretera?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: D
  explanation: El manual indica que al leer o enviar un mensaje de texto, aparta la
    vista de la carretera durante cinco segundos.
- id: 6
  category: defensive_driving
  question: Si viaja a 55 mph y aparta la vista de la carretera para enviar un mensaje
    de texto, recorrerá la longitud de un campo de fútbol americano esencialmente
    con los ojos vendados en ¿cuántos segundos?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: D
  explanation: A 55 mph, al leer o enviar un mensaje de texto, aparta la vista de
    la carretera durante cinco segundos, lo cual es tiempo suficiente para recorrer
    la longitud de un campo de fútbol americano esencialmente con los ojos vendados.
- id: 7
  category: safe_driving_rules
  question: ¿Cuántas muertes ocurrieron en accidentes relacionados con el exceso de
    velocidad en Virginia en 2024?
  choices:
    A: '318'
    B: '410'
    C: '500'
    D: '71'
  answer: B
  explanation: El manual indica que en 2024, 410 personas murieron en accidentes relacionados
    con el exceso de velocidad en Virginia.
- id: 8
  category: defensive_driving
  question: ¿Qué regla debe usar para determinar una distancia de seguimiento segura
    detrás del vehículo que va delante de usted?
  choices:
    A: La regla de la longitud de un automóvil
    B: La regla de los dos, tres y cuatro segundos
    C: La regla de los cinco segundos
    D: La regla de los diez pies
  answer: B
  explanation: El manual aconseja a los conductores usar la regla de los dos, tres
    y cuatro segundos al tratar de determinar el espacio detrás del vehículo que va
    delante de ellos.
- id: 9
  category: driver_testing
  question: Según la sección de exámenes del Manual del Conductor de Virginia, ¿qué
    formato tiene el examen de conocimientos?
  choices:
    A: Un examen de una sola parte
    B: Un examen de dos partes
    C: Un examen de tres partes
    D: Un examen de cuatro partes
  answer: B
  explanation: La Sección 1 del Índice del manual enumera un "Examen de conocimientos
    de dos partes".
- id: 10
  category: penalties_and_points
  question: Según el manual, ¿cuál de las siguientes infracciones no relacionadas
    con la conducción puede resultar en la suspensión de la licencia?
  choices:
    A: No pagar multas de estacionamiento
    B: No cumplir con los requisitos relacionados con la manutención de los hijos
    C: No registrarse para votar
    D: No renovar un pasaporte
  answer: B
  explanation: La Sección 5 del manual enumera la "Suspensión por no cumplir con los
    requisitos relacionados con la manutención de los hijos" bajo los requisitos,
    suspensiones y revocaciones del DMV.
- id: 11
  category: safe_driving_rules
  question: ¿Cuál de los siguientes se enumera explícitamente como un "comportamiento
    de conducción peligroso" en el Manual del Conductor de Virginia?
  choices:
    A: Conducir con mascotas en el vehículo
    B: Conducir somnoliento
    C: Escuchar música a un volumen alto
    D: Comer mientras se conduce
  answer: B
  explanation: La Sección 3 del manual enumera la conducción agresiva, la conducción
    distraída, conducir somnoliento y beber y conducir bajo "Comportamientos de conducción
    peligrosos".
- id: 12
  category: penalties_and_points
  question: ¿Qué programa se enumera en el manual como un requisito del DMV que puede
    llevar a suspensiones y revocaciones de la licencia?
  choices:
    A: Programa de emisiones de vehículos
    B: Programa de monitoreo de seguros
    C: Programa de limpieza de autopistas
    D: Programa de educación vial
  answer: B
  explanation: La Sección 5 del manual enumera el "Programa de monitoreo de seguros"
    bajo otros requisitos, suspensiones y revocaciones del DMV.
- id: 13
  category: sharing_the_road
  question: ¿El Manual del Conductor de Virginia incluye instrucciones específicas
    para compartir la vía con cuál de los siguientes?
  choices:
    A: Aviones
    B: Tren ligero
    C: Aerotablas (Hoverboards)
    D: Vehículos todo terreno (ATV)
  answer: B
  explanation: La Sección 3 del manual incluye una subsección específica para compartir
    la vía con el "Tren ligero".
- id: 14
  category: penalties_and_points
  question: ¿Qué tipo de suspensión de licencia está específicamente asociada con
    el alcohol y la ley en Virginia?
  choices:
    A: Suspensión administrativa de la licencia
    B: Suspensión por responsabilidad financiera
    C: Suspensión por revisión médica
    D: Suspensión por acumulación de puntos
  answer: A
  explanation: La Sección 5 del manual enumera la "Suspensión administrativa de la
    licencia" en la sección de "El alcohol y la ley".
- id: 15
  category: driver_testing
  question: ¿Qué tipo de examen es una parte obligatoria del proceso de evaluación
    según la Sección 1 del manual?
  choices:
    A: Examen de audición
    B: Examen de reflejos
    C: Examen de la vista
    D: Examen de daltonismo
  answer: C
  explanation: El índice de la Sección 1 del manual enumera el "Examen de la vista"
    y los "Estándares de visión" como parte del proceso de evaluación.
- id: 16
  category: driver_testing
  question: ¿Cuántas preguntas sobre señales de tránsito debe responder correctamente
    en la primera parte del examen de conocimientos para pasar a la segunda parte?
  choices:
    A: 7 de 10
    B: 8 de 10
    C: 9 de 10
    D: Las 10
  answer: D
  explanation: Debe responder correctamente las diez preguntas sobre señales de tránsito
    en la primera parte del examen antes de poder tomar la segunda parte.
- id: 17
  category: driver_testing
  question: ¿Cuál es la puntuación mínima para aprobar la segunda parte del examen
    de conocimientos generales?
  choices:
    A: 70 por ciento
    B: 75 por ciento
    C: 80 por ciento
    D: 85 por ciento
  answer: C
  explanation: La segunda parte evalúa sus conocimientos generales con preguntas de
    opción múltiple. Debe responder correctamente al menos el 80 por ciento de estas
    preguntas para aprobar la segunda parte.
- id: 18
  category: driver_testing
  question: Si es menor de 18 años y reprueba el examen de conocimientos, ¿cuánto
    tiempo debe esperar antes de poder volver a tomarlo?
  choices:
    A: 2 días
    B: 5 días
    C: 10 días
    D: 15 días
  answer: D
  explanation: Si reprueba el examen y es menor de 18 años, por ley debe esperar 15
    días completos antes de poder volver a tomarlo.
- id: 19
  category: driver_testing
  question: ¿Qué sucede si reprueba el examen de conocimientos tres veces?
  choices:
    A: Se le prohíbe permanentemente obtener una licencia.
    B: Debe esperar un año antes de volver a tomar el examen.
    C: Debe completar y aprobar el componente de aula de la educación vial.
    D: Debe pagar una multa de $100 para volver a tomar el examen.
  answer: C
  explanation: Si reprueba el examen de conocimientos tres veces, no podrá tomarlo
    por cuarta vez hasta que complete y apruebe el componente de aula de la educación
    vial.
- id: 20
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos NO está permitido para realizar el examen
    práctico de manejo?
  choices:
    A: Una camioneta (pickup)
    B: Un sedán de cuatro puertas
    C: Un autociclo
    D: Un vehículo con transmisión manual
  answer: C
  explanation: Debe proporcionar un vehículo para el examen práctico de manejo (no
    se puede realizar en un autociclo).
- id: 21
  category: driver_testing
  question: Si tiene 18 años o más y decide no tomar un curso de educación vial, ¿cuánto
    tiempo debe tener un permiso de aprendizaje antes de su primera prueba práctica
    de manejo?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Los solicitantes de 18 años o más deben tener el permiso de aprendizaje
    durante 60 días antes de la primera prueba práctica de manejo o completar un curso
    de educación vial.
- id: 22
  category: driver_testing
  question: Si no aprueba la prueba práctica de manejo, ¿cuánto tiempo debe esperar
    antes de poder tomarla de nuevo?
  choices:
    A: 2 días
    B: 5 días
    C: 7 días
    D: 15 días
  answer: A
  explanation: Si no aprueba la prueba práctica de manejo, debe esperar dos días para
    tomarla de nuevo.
- id: 23
  category: license_system
  question: ¿Qué indica una restricción "C" en su licencia de conducir?
  choices:
    A: Está restringido a conducir solo de día.
    B: Debe usar anteojos o lentes de contacto cuando conduce.
    C: Solo puede conducir un vehículo comercial.
    D: Debe tener un adulto con licencia en el vehículo.
  answer: B
  explanation: Si necesita usar anteojos o lentes de contacto para aprobar el examen
    de la vista, debe usarlos cuando conduzca. Su licencia mostrará una C por esta
    restricción.
- id: 24
  category: license_system
  question: ¿Cuáles son los estándares de visión para una licencia de conducir sin
    restricciones en Virginia?
  choices:
    A: Visión 20/20 en ambos ojos y visión horizontal de 180 grados.
    B: Visión 20/40 o mejor en uno o ambos ojos y visión horizontal de 110 grados.
    C: Visión 20/70 o mejor en un ojo y visión horizontal de 70 grados.
    D: Visión 20/50 en ambos ojos y visión horizontal de 90 grados.
  answer: B
  explanation: El estándar para una licencia de conducir sin restricciones es una
    visión de 20/40 o mejor en uno o ambos ojos, y una visión horizontal de 110 grados
    o mejor.
- id: 25
  category: license_system
  question: ¿Cuáles son las horas de conducción permitidas para un conductor con una
    licencia restringida a conducir solo de día?
  choices:
    A: De 6:00 AM a 6:00 PM.
    B: Desde el amanecer hasta el atardecer.
    C: Media hora después del amanecer hasta media hora antes del atardecer.
    D: Media hora antes del amanecer hasta media hora después del atardecer.
  answer: C
  explanation: Una licencia restringida a conducir solo de día le permite conducir
    únicamente durante el período de tiempo que comienza media hora después del amanecer
    y termina media hora antes del atardecer.
- id: 26
  category: safe_driving_rules
  question: ¿Es legal evitar los controles de tráfico acortando camino a través de
    un estacionamiento o campo?
  choices:
    A: Sí, si la intersección está bloqueada por un accidente.
    B: Sí, si conduce un vehículo comercial.
    C: No, es ilegal evitar los controles de tráfico de esta manera.
    D: No, a menos que esté girando a la derecha.
  answer: C
  explanation: Es ilegal evitar estos controles de tráfico acortando camino a través
    de un estacionamiento o campo.
- id: 27
  category: signs_and_signals
  question: ¿Cuándo NO se le permite girar a la derecha en luz roja?
  choices:
    A: Cuando hay una señal de "No Turn on Red" (No girar en rojo) o una flecha roja
      apuntando a la derecha.
    B: Cuando gira desde una calle de un solo sentido hacia otra calle de un solo
      sentido.
    C: Cuando no hay peatones en el cruce peatonal.
    D: Cuando conduce un vehículo con transmisión manual.
  answer: A
  explanation: No puede girar a la derecha en luz roja si hay señales en la intersección
    que dicen "No Turn on Red" (No girar en rojo), o si se muestra una flecha roja
    apuntando a la derecha.
- id: 28
  category: signs_and_signals
  question: ¿Bajo qué condición se permite girar a la izquierda en luz roja?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido.
    C: Al girar desde una calle de doble sentido hacia otra calle de doble sentido.
    D: Nunca se permite girar a la izquierda en luz roja.
  answer: B
  explanation: Puede girar a la izquierda en un semáforo en rojo si se encuentra en
    una calle de un solo sentido y gira a la izquierda hacia otra calle de un solo
    sentido mientras el semáforo muestra una luz roja.
- id: 29
  category: signs_and_signals
  question: Si un oficial de policía le indica que cruce una intersección a pesar
    de que el semáforo está en rojo, ¿qué debe hacer?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Seguir las indicaciones del oficial de policía.
    C: Tocar la bocina para advertir a otros conductores antes de avanzar.
    D: Hacerse a un lado y esperar a que el oficial se vaya.
  answer: B
  explanation: Obedezca todas las señales y semáforos a menos que un oficial de policía
    le indique lo contrario; siempre siga las indicaciones del oficial.
- id: 30
  category: driver_testing
  question: ¿Qué se requiere si no aprueba la prueba práctica de manejo en el DMV
    tres veces?
  choices:
    A: Debe esperar 60 días antes de volver a tomar la prueba.
    B: Debe volver a tomar el examen de conocimientos de dos partes.
    C: Debe completar y aprobar la parte práctica en el vehículo de la educación vial.
    D: Debe pagar una multa de $50.
  answer: C
  explanation: Si no aprueba la prueba práctica de manejo en el DMV tres veces, no
    podrá tomarla por cuarta vez hasta que complete y apruebe la parte práctica en
    el vehículo de la educación vial en una escuela de manejo aprobada por el DMV
    o el Departamento de Educación.
- id: 31
  category: signs_and_signals
  question: ¿Bajo qué condiciones puede girar a la izquierda en un semáforo en rojo
    en Virginia?
  choices:
    A: En cualquier momento que la intersección esté libre de tráfico en sentido contrario.
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
      después de detenerse por completo.
    C: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    D: Los giros a la izquierda en rojo nunca están permitidos bajo ninguna circunstancia.
  answer: B
  explanation: Puede girar a la izquierda en un semáforo en rojo si se encuentra en
    una calle de un solo sentido y gira a la izquierda hacia otra calle de un solo
    sentido mientras el semáforo muestra una luz roja, siempre y cuando se detenga
    por completo primero.
- id: 32
  category: signs_and_signals
  question: ¿Qué significa un semáforo con una flecha roja?
  choices:
    A: Puede avanzar en la dirección de la flecha después de ceder el paso a los peatones.
    B: Debe detenerse y no puede avanzar en la dirección de la flecha a menos que
      una señal lo permita.
    C: Puede girar en la dirección de la flecha después de detenerse por completo.
    D: La luz está a punto de cambiar a verde, así que prepárese para acelerar.
  answer: B
  explanation: Una flecha roja significa que debe detenerse si tiene la intención
    de moverse en la dirección de la flecha. No puede avanzar a menos que haya señales
    publicadas que digan 'Right on Red Arrow After Stop' (Giro a la derecha con flecha
    roja después de parar) o 'Left on Red Arrow After Stop' (Giro a la izquierda con
    flecha roja después de parar).
- id: 33
  category: safe_driving_rules
  question: ¿Cómo debe proceder si se acerca a una intersección donde los semáforos
    no funcionan debido a un corte de energía?
  choices:
    A: Ceda el paso al vehículo a su derecha y avance sin detenerse.
    B: Reduzca la velocidad y avance con precaución sin detenerse por completo.
    C: Deténgase y cruce la intersección como si fuera una parada de cuatro vías (all-way
      stop).
    D: Espere en la intersección hasta que llegue un oficial de policía.
  answer: C
  explanation: Cuando los semáforos no funcionan debido a un corte de energía u otro
    problema y no muestran ninguna luz, se le exige que se detenga y cruce la intersección
    como si fuera una parada de cuatro vías (all-way stop).
- id: 34
  category: signs_and_signals
  question: ¿Qué indica una señal de uso de carril con una X amarilla o una flecha
    amarilla diagonal hacia abajo?
  choices:
    A: Debe salir del carril tan pronto como sea seguro hacerlo.
    B: Se le permite conducir en ese carril al límite de velocidad indicado.
    C: Debe detenerse por completo en ese carril.
    D: Solo puede usar ese carril para hacer giros a la izquierda.
  answer: A
  explanation: Una X amarilla o una flecha amarilla diagonal hacia abajo significa
    que debe salir del carril tan pronto como sea seguro hacerlo.
- id: 35
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor cuando un semáforo híbrido para peatones
    (PHB, por sus siglas en inglés) muestra luces rojas intermitentes alternas?
  choices:
    A: Prepararse para detenerse porque la luz está a punto de cambiar a rojo fijo.
    B: Avanzar con precaución si el cruce peatonal ya está despejado.
    C: Detenerse y esperar indefinidamente a que las luces cambien a verde.
    D: Acelerar para despejar la intersección rápidamente.
  answer: B
  explanation: Mientras la señal de caminar hace la cuenta regresiva para los peatones,
    las dos luces rojas del PHB parpadean alternativamente, indicando al conductor
    que si el cruce peatonal ya está despejado, puede avanzar con precaución.
- id: 36
  category: signs_and_signals
  question: ¿Qué tipo de información transmiten las señales de tráfico de color rosa
    y negro?
  choices:
    A: Áreas de construcción.
    B: Servicios para automovilistas.
    C: Lugares de interés histórico o cultural.
    D: Áreas de incidentes.
  answer: D
  explanation: Las señales de color rosa y negro se utilizan para informar y advertir
    en áreas de incidentes.
- id: 37
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico en forma de pentágono?
  choices:
    A: Pare (Alto).
    B: Ceda el paso.
    C: Zonas escolares y cruces escolares.
    D: Condiciones especiales o peligros más adelante.
  answer: C
  explanation: La forma de pentágono de cinco lados marca las zonas escolares y le
    advierte sobre los cruces escolares.
- id: 38
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de tráfico en forma de diamante (rombo)?
  choices:
    A: Da instrucciones o le indica la ley.
    B: Le advierte de condiciones especiales o peligros más adelante.
    C: Marca el comienzo de una zona de no adelantar.
    D: Indica un cruce de ferrocarril más adelante.
  answer: B
  explanation: Las señales en forma de diamante le advierten de condiciones especiales
    o peligros más adelante. Debe reducir la velocidad y conducir con precaución.
- id: 39
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es cierta con respecto a las señales
    de límite de velocidad y las condiciones climáticas?
  choices:
    A: No puede recibir una multa si conduce al límite de velocidad indicado, independientemente
      del clima.
    B: El límite de velocidad indicado se aplica solo durante lluvia, nieve o hielo.
    C: Puede recibir una multa por conducir demasiado rápido para las condiciones,
      incluso si conduce al límite de velocidad indicado o por debajo de este.
    D: Los límites de velocidad disminuyen automáticamente en 10 mph cuando llueve.
  answer: C
  explanation: Durante la lluvia, la nieve y el hielo, puede recibir una multa por
    conducir demasiado rápido para las condiciones, incluso si conduce al límite de
    velocidad indicado o a una velocidad menor.
- id: 40
  category: safe_driving_rules
  question: En Virginia, ¿están permitidos los giros en U en una intersección donde
    hay una señal de 'No Left Turn' (No girar a la izquierda)?
  choices:
    A: Sí, a menos que también haya una señal de 'No U-Turn' (No girar en U).
    B: Sí, pero solo si la intersección está completamente libre de tráfico.
    C: No, porque los giros en U se consideran como dos giros a la izquierda y son
      ilegales si hay una señal de 'No Left Turn'.
    D: No, los giros en U son ilegales en todas las intersecciones en Virginia.
  answer: C
  explanation: En Virginia, los giros en U se consideran como dos giros a la izquierda
    y son ilegales si hay una señal de 'No Left Turn' (No girar a la izquierda).
- id: 41
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla intermitente en un semáforo?
  choices:
    A: Deténgase por completo y ceda el paso a los vehículos que se aproximan.
    B: Reduzca la velocidad y proceda con precaución.
    C: El semáforo está fuera de servicio.
    D: Deténgase si tiene la intención de moverse en la dirección de la flecha.
  answer: B
  explanation: Una luz amarilla intermitente significa reducir la velocidad y proceder
    con precaución. Las luces amarillas intermitentes se encuentran en lugares con
    condiciones de peligro superiores a lo normal.
- id: 42
  category: signs_and_signals
  question: ¿Cuál es el propósito de las señales de tránsito marrones y blancas?
  choices:
    A: Proporcionar información sobre destinos.
    B: Informar sobre los servicios para automovilistas.
    C: Avisar sobre lugares de interés histórico o cultural en la zona.
    D: Advertir sobre trabajos de construcción.
  answer: C
  explanation: La señal marrón se utiliza para avisar sobre lugares de interés histórico
    o cultural que puedan existir en la zona.
- id: 43
  category: signs_and_signals
  question: ¿Qué debe hacer si se acerca a una intersección con una luz amarilla fija
    y aún no ha ingresado a la intersección?
  choices:
    A: Acelerar para ganarle a la luz antes de que cambie a rojo.
    B: Detenerse, a menos que no sea seguro hacerlo.
    C: Continuar por la intersección a su velocidad actual.
    D: Hacerse a un lado de la carretera.
  answer: B
  explanation: Una luz amarilla es una advertencia de precaución de que la luz está
    a punto de cambiar. Si no ha ingresado a la intersección, deténgase; o, si no
    es seguro detenerse, crúcela con precaución.
- id: 44
  category: sharing_the_road
  question: Si un semáforo cambia de rojo a una flecha amarilla intermitente mientras
    un peatón está en la intersección, ¿qué debe hacer?
  choices:
    A: Tocar la bocina para alertar al peatón de que se mueva rápidamente.
    B: Girar inmediatamente, ya que usted tiene el derecho de paso.
    C: Permitir que el peatón cruce la calle antes de girar.
    D: Conducir lentamente alrededor del peatón para despejar la intersección.
  answer: C
  explanation: Si un semáforo cambia de rojo a una flecha amarilla intermitente mientras
    un peatón está en la intersección, permita que el peatón cruce la calle antes
    de girar.
- id: 45
  category: safe_driving_rules
  question: En una parada de 4 vías (4-Way stop), si llega a la intersección al mismo
    tiempo que otro vehículo, ¿quién debe ceder el paso?
  choices:
    A: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    B: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    C: El conductor que va en línea recta debe ceder el paso al conductor que gira.
    D: El conductor del vehículo más grande tiene el derecho de paso.
  answer: B
  explanation: En las intersecciones con una parada de 'Todas las vías' (All Way)
    o '4 vías' (4 Way), si llega a la intersección al mismo tiempo que otros vehículos,
    el conductor de la izquierda debe ceder el paso al conductor de la derecha.
- id: 46
  category: signs_and_signals
  question: ¿Qué indica una señal de velocidad recomendada (Advisory Speed)?
  choices:
    A: El límite de velocidad mínima en una autopista.
    B: La velocidad máxima segura para una salida de autopista.
    C: El límite de velocidad para una zona escolar.
    D: La velocidad recomendada para rebasar.
  answer: B
  explanation: Según el manual, una señal de velocidad recomendada indica la velocidad
    máxima segura para una salida de autopista.
- id: 47
  category: sharing_the_road
  question: ¿Cuánto espacio libre exige la ley estatal al rebasar carruajes tirados
    por caballos?
  choices:
    A: Al menos dos pies
    B: Al menos tres pies
    C: Al menos cuatro pies
    D: Al menos cinco pies
  answer: B
  explanation: La ley estatal exige a los automovilistas rebasar los carruajes tirados
    por caballos con al menos tres pies de espacio libre cuando la vía esté despejada.
- id: 48
  category: safe_driving_rules
  question: ¿Qué debe hacer si conduce por una carretera marcada con una señal de
    'Resbaladizo cuando está mojado' (Slippery When Wet) y el pavimento está mojado?
  choices:
    A: Frenar bruscamente para probar su tracción.
    B: Disminuir la distancia entre su vehículo y el que va adelante.
    C: Aumentar la distancia entre su vehículo y el vehículo que va adelante.
    D: Mantener su velocidad normal y cambiar de carril con frecuencia.
  answer: C
  explanation: Cuando el pavimento está mojado, el manual indica que debe reducir
    la velocidad, no frenar bruscamente ni cambiar de dirección de repente, y aumentar
    la distancia entre su vehículo y el que va adelante.
- id: 49
  category: signs_and_signals
  question: ¿Cuál es el procedimiento adecuado al acercarse a una rotonda (glorieta)?
  choices:
    A: Entrar sin ceder el paso y circular en el sentido de las agujas del reloj.
    B: Ceder el paso al tráfico que ya está en la rotonda y circular en sentido contrario
      a las agujas del reloj.
    C: Detenerse por completo y esperar una luz verde.
    D: Ceder el paso al tráfico que entra a la rotonda y circular en el sentido de
      las agujas del reloj.
  answer: B
  explanation: En una rotonda, el tráfico que entra debe ceder el derecho de paso
    al tráfico que ya está en la rotonda y circular en sentido contrario a las agujas
    del reloj.
- id: 50
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se apaga (se detiene) en las vías del tren?
  choices:
    A: Quedarse en el vehículo y llamar al 911.
    B: Salir y correr en la misma dirección en la que viaja el tren.
    C: Intentar empujar el vehículo fuera de las vías usted mismo.
    D: Salir de inmediato y correr en diagonal alejándose de las vías en dirección
      al tren que se aproxima.
  answer: D
  explanation: Si su vehículo se apaga en las vías, el manual indica que debe salir
    del vehículo de inmediato y correr en diagonal alejándose de las vías en dirección
    al tren que se aproxima.
- id: 51
  category: penalties_and_points
  question: ¿Cuál es la sanción por ser condenado por usar un dispositivo de comunicación
    portátil en una zona de obras en la carretera?
  choices:
    A: Una multa de $100
    B: Una multa de $250
    C: Una multa de $500
    D: Suspensión de la licencia por 30 días
  answer: B
  explanation: Si es condenado por usar un dispositivo de comunicación portátil en
    una zona de obras en la carretera, recibirá una multa de $250.
- id: 52
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por exceder el límite de velocidad en una zona
    de obras en la carretera?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Si es condenado por exceder el límite de velocidad en una zona de obras
    en la carretera, puede recibir una multa de hasta $500.
- id: 53
  category: signs_and_signals
  question: ¿Qué significa una señal de "Zona de no adelantar" (No Passing Zone)?
  choices:
    A: Puede adelantar a otros vehículos si la vía está despejada.
    B: No puede adelantar a los vehículos que van delante de usted en su carril, incluso
      si la vía está despejada.
    C: Solo los vehículos comerciales tienen prohibido adelantar.
    D: Puede adelantar solo si el vehículo de adelante se mueve por debajo del límite
      de velocidad.
  answer: B
  explanation: Una señal de Zona de no adelantar marca el comienzo de una zona donde
    no puede adelantar a los vehículos que van delante de usted en su carril, incluso
    si la vía está despejada.
- id: 54
  category: sharing_the_road
  question: ¿Qué vehículos están obligados a detenerse siempre en los cruces de ferrocarril,
    incluso cuando las luces no parpadean?
  choices:
    A: Automóviles de pasajeros
    B: Motocicletas
    C: Autobuses escolares
    D: Camiones de reparto
  answer: C
  explanation: El manual indica que los autobuses escolares siempre deben detenerse
    en los cruces de ferrocarril, incluso cuando las luces no parpadean.
- id: 55
  category: safe_driving_rules
  question: Al conducir por una zona de obras cerca de dispositivos de control de
    tráfico como barricadas y conos, ¿qué debe hacer?
  choices:
    A: Mantener su vehículo en el medio del carril y no cambiar de carril hasta haber
      salido completamente de la zona.
    B: Conducir lo más cerca posible de los dispositivos para dejar espacio a otros
      vehículos.
    C: Cambiar de carril con frecuencia para evitar los dispositivos.
    D: Aumentar su velocidad para salir rápidamente de la zona de obras.
  answer: A
  explanation: Al conducir cerca de dispositivos de control de tráfico en una zona
    de obras, mantenga su vehículo en el medio del carril, respete el límite de velocidad
    y no cambie de carril hasta que haya salido completamente de la zona de obras.
- id: 56
  category: signs_and_signals
  question: ¿Qué color marca una zona de obras y significa que debe reducir la velocidad
    y estar alerta?
  choices:
    A: Rojo
    B: Amarillo
    C: Naranja
    D: Verde
  answer: C
  explanation: El color naranja marca una zona de obras y significa que debe reducir
    la velocidad y estar alerta.
- id: 57
  category: sharing_the_road
  question: ¿Por qué una señal de "Juntas abiertas" (Open Joints) es particularmente
    importante para los motociclistas?
  choices:
    A: Indica un área de estacionamiento designada para motocicletas.
    B: Las juntas abiertas pueden hacer que un motociclista pierda el control de la
      motocicleta.
    C: Marca un carril exclusivo para motocicletas.
    D: Advierte sobre vientos fuertes que solo afectan a las motocicletas.
  answer: B
  explanation: El manual advierte que se debe reducir la velocidad porque las juntas
    abiertas en puentes o rampas podrían hacer que un motociclista pierda el control
    de la motocicleta.
- id: 58
  category: safe_driving_rules
  question: Cuando dos carriles de tráfico que se mueven en la misma dirección están
    a punto de convertirse en uno (Fusión/Merge), ¿quién es responsable de incorporarse
    de manera segura?
  choices:
    A: Solo el conductor del carril derecho.
    B: Solo el conductor del carril izquierdo.
    C: Los conductores de ambos carriles son responsables de incorporarse de manera
      segura.
    D: El conductor del vehículo más grande.
  answer: C
  explanation: En una incorporación donde dos carriles se convierten en uno, los conductores
    de ambos carriles son responsables de incorporarse de manera segura.
- id: 59
  category: signs_and_signals
  question: ¿Sobre qué advierte a los conductores una señal de "Cruce de ferrocarril
    a bajo nivel" (Low Ground Railroad Crossing)?
  choices:
    A: Las vías del tren están actualmente en construcción.
    B: Los trenes viajan a velocidades más bajas en esta área.
    C: La parte inferior de los vehículos bajos puede quedar atrapada o arrastrarse
      por las vías debido a una pendiente pronunciada.
    D: Solo se permite el cruce a vehículos de baja altura.
  answer: C
  explanation: Esta señal advierte sobre una pendiente pronunciada donde las vías
    del tren cruzan la carretera, lo que puede causar que la parte inferior de los
    vehículos bajos quede atrapada o se arrastre por las vías.
- id: 60
  category: safe_driving_rules
  question: ¿Qué debe hacer al salir de una zona de obras?
  choices:
    A: Acelerar inmediatamente para reanudar el flujo normal de tráfico.
    B: Cambiar de carril para evitar los vehículos de construcción.
    C: Mantenerse en su carril y mantener su velocidad hasta haber salido completamente.
    D: Detenerse y revisar su vehículo en busca de daños por escombros.
  answer: C
  explanation: Al salir de la zona de obras, manténgase en su carril y mantenga su
    velocidad. No cambie de carril hasta que haya salido completamente de la zona
    de obras.
- id: 61
  category: signs_and_signals
  question: ¿A qué velocidad máxima viajan los vehículos que muestran una señal de
    vehículo de movimiento lento?
  choices:
    A: 15 MPH
    B: 25 MPH
    C: 35 MPH
    D: 45 MPH
  answer: B
  explanation: Los vehículos de movimiento lento que viajan a 25 MPH o menos, como
    equipos agrícolas, vehículos tirados por caballos o vehículos de mantenimiento
    de carreteras, deben mostrar estas señales cuando usan una vía pública.
- id: 62
  category: signs_and_signals
  question: ¿Qué indican los reflectores rojos en el pavimento?
  choices:
    A: Hay una boca de incendios cerca.
    B: Se aproxima a una intersección con paradas en las cuatro direcciones.
    C: Circula en la dirección equivocada y no debe entrar.
    D: Hay una zona escolar más adelante.
  answer: C
  explanation: Los reflectores rojos en el pavimento muestran áreas en las que no
    se debe entrar ni usar. Están colocados en la superficie de la carretera de manera
    que solo el tráfico que circula en la dirección equivocada los observaría.
- id: 63
  category: safe_driving_rules
  question: ¿Cuándo se le permite cruzar líneas amarillas continuas dobles en el centro
    de la carretera?
  choices:
    A: Al rebasar a un tractor de movimiento lento.
    B: Al hacer un giro a la izquierda o al rebasar a peatones y ciclistas.
    C: Cuando el vehículo de adelante viaja por debajo del límite de velocidad.
    D: Nunca se le permite cruzar líneas amarillas continuas dobles.
  answer: B
  explanation: No se permite rebasar en ninguna dirección. No puede cruzar las líneas
    a menos que esté haciendo un giro a la izquierda o rebasando a peatones, ciclistas
    y usuarios de patinetes o patinetas, siempre que el carril opuesto esté despejado.
- id: 64
  category: signs_and_signals
  question: ¿Cuál es el propósito de las líneas blancas punteadas que consisten en
    pequeños rectángulos muy juntos?
  choices:
    A: Indicar un cruce peatonal.
    B: Mostrar la asignación de carriles en intersecciones e intercambiadores.
    C: Marcar el borde derecho del pavimento.
    D: Separar el tráfico que se mueve en direcciones opuestas.
  answer: B
  explanation: Las líneas blancas punteadas son en realidad pequeños rectángulos en
    serie... Se utilizan para mostrar la asignación de carriles en intersecciones
    e intercambiadores donde, de otro modo, habría una tendencia a salirse del carril.
- id: 65
  category: safe_driving_rules
  question: En una carretera de tres carriles, si ambos lados del carril central están
    marcados por una línea amarilla continua y una línea amarilla discontinua, ¿qué
    distancia puede recorrer en este carril?
  choices:
    A: Hasta 50 pies.
    B: Hasta 100 pies.
    C: Hasta 150 pies.
    D: Hasta 200 pies.
  answer: C
  explanation: Si ambos lados del carril central están marcados por una línea amarilla
    continua y una línea amarilla discontinua, los conductores que viajan en cualquier
    dirección pueden usar el carril para hacer giros a la izquierda. Sin embargo,
    no pueden recorrer más de 150 pies en este carril.
- id: 66
  category: sharing_the_road
  question: ¿Qué indica una marca de carril compartido (sharrow)?
  choices:
    A: El carril está reservado exclusivamente para bicicletas.
    B: El carril es demasiado estrecho para que los vehículos de motor y las bicicletas
      lo compartan uno al lado del otro.
    C: Las bicicletas deben ceder el paso a los vehículos de motor en todo momento.
    D: Se prohíbe la entrada de vehículos de motor al carril.
  answer: B
  explanation: Una marca de carril compartido, o "sharrow"... se usa en carriles de
    circulación que son demasiado estrechos para que los vehículos de motor y las
    bicicletas los compartan uno al lado del otro.
- id: 67
  category: sharing_the_road
  question: Si se acerca a una intersección con una caja para bicicletas pintada y
    un semáforo en rojo, ¿dónde debe detenerse?
  choices:
    A: Dentro de la caja para bicicletas.
    B: Detrás de todas las cajas para bicicletas.
    C: Más allá de la caja para bicicletas, dentro de la intersección.
    D: No tiene que detenerse si gira a la derecha.
  answer: B
  explanation: Los conductores deben detenerse ante un semáforo en rojo detrás de
    todas las cajas para bicicletas, no dentro de la caja.
- id: 68
  category: sharing_the_road
  question: ¿Se le permite hacer un giro a la derecha en rojo en una intersección
    con una caja para bicicletas?
  choices:
    A: Sí, si primero cede el paso a las bicicletas.
    B: Sí, pero solo si la caja para bicicletas está pintada de verde.
    C: No, los giros a la derecha en rojo no están permitidos en estas intersecciones.
    D: No, a menos que conduzca un vehículo de alta ocupación (HOV).
  answer: C
  explanation: Los giros a la derecha en rojo no están permitidos en estas intersecciones
    [con cajas para bicicletas].
- id: 69
  category: safe_driving_rules
  question: ¿A cuál de los siguientes vehículos se le permite generalmente usar los
    carriles para Vehículos de Alta Ocupación (HOV) durante períodos de tráfico pesado?
  choices:
    A: Cualquier vehículo que viaje a más de 65 MPH.
    B: Camiones de carga comercial.
    C: Motocicletas.
    D: Vehículos que remolcan tráileres.
  answer: C
  explanation: Durante los períodos de tráfico pesado, los carriles HOV están reservados
    para autobuses, camionetas compartidas, viajes compartidos (carpools), otros vehículos
    de alta ocupación, motocicletas y ciertos vehículos de combustibles especiales
    limpios.
- id: 70
  category: safe_driving_rules
  question: ¿Qué debe hacer si ingresa por error a un carril de peaje de alta velocidad
    E-ZPass sin un transpondedor?
  choices:
    A: Detenerse inmediatamente y retroceder.
    B: Hacerse a un lado en el arcén y esperar a un empleado del peaje.
    C: Detenerse y pagar en efectivo en la cámara.
    D: No detenerse; se le cobrará el peaje al propietario registrado.
  answer: D
  explanation: Si ingresa a uno de esos carriles por error, no se detenga. Detenerse
    es inseguro y podría causar un choque por detrás. Las cámaras fotografiarán el
    número de placa del automóvil y se le cobrará el peaje al propietario registrado
    del vehículo.
- id: 71
  category: signs_and_signals
  question: ¿Qué significa un bordillo pintado de amarillo?
  choices:
    A: Detenerse solo el tiempo suficiente para recoger o dejar pasajeros.
    B: Detenerse solo el tiempo suficiente para cargar o descargar, y permanecer con
      su vehículo.
    C: No detenerse, pararse ni estacionarse.
    D: Se permite estacionar hasta por 30 minutos.
  answer: B
  explanation: 'Amarillo: Detenerse solo el tiempo suficiente para cargar o descargar.
    Permanezca con su vehículo.'
- id: 72
  category: safe_driving_rules
  question: ¿Cómo debe un conductor manejar las bandas sonoras (rumble strips) colocadas
    a lo ancho de los carriles de circulación antes de una zona de trabajo?
  choices:
    A: Esquivarlas para evitar daños en las llantas.
    B: Acelerar para pasar sobre ellas rápidamente.
    C: Conducir sobre ellas lentamente, sin esquivarlas.
    D: Detenerse inmediatamente antes de cruzarlas.
  answer: C
  explanation: Las bandas sonoras deben cruzarse conduciendo lentamente, no esquivándolas.
- id: 73
  category: signs_and_signals
  question: ¿Cuál es la regla para cruzar líneas blancas continuas dobles?
  choices:
    A: Puede cruzarlas con precaución para cambiar de carril.
    B: Puede cruzarlas solo al rebasar a un vehículo que se mueve lentamente.
    C: No puede cruzar estas líneas.
    D: Puede cruzarlas para hacer un giro en U.
  answer: C
  explanation: Las líneas blancas continuas dobles separan los carriles de tráfico
    que van en la misma dirección... No puede cruzar estas líneas.
- id: 74
  category: signs_and_signals
  question: ¿Qué figura se utiliza para crear una línea de ceda el paso que se extiende
    a lo ancho de la calzada?
  choices:
    A: Cuadrados
    B: Círculos
    C: Triángulos
    D: Diamantes
  answer: C
  explanation: Una línea de ceda el paso es una línea de triángulos que se extiende
    a lo ancho de la calzada y que puede usarse con una señal de ceda el paso para
    mostrar el punto en el que debe ceder el paso o detenerse.
- id: 75
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos en el volante?
  choices:
    A: A las 10 y a las 2
    B: A las 9 y a las 3
    C: A las 8 y a las 4
    D: A las 7 y a las 5
  answer: C
  explanation: El manual indica que si su volante fuera un reloj, sus manos deberían
    estar en las posiciones de las 8 y las 4.
- id: 76
  category: penalties_and_points
  question: 'Según la ley de Virginia, usted puede ser acusado de conducir de manera
    temeraria (reckless driving) si conduce:'
  choices:
    A: A 10 o más millas por hora por encima del límite de velocidad.
    B: A 15 o más millas por hora por encima del límite de velocidad.
    C: A 20 o más millas por hora por encima del límite de velocidad, o a más de 85
      MPH.
    D: A más de 75 MPH en cualquier autopista.
  answer: C
  explanation: Según la ley de Virginia, si conduce a 20 o más millas por hora (MPH)
    por encima del límite de velocidad, o a más de 85 MPH, un oficial de la ley puede
    acusarlo de conducir de manera temeraria.
- id: 77
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    para vehículos de pasajeros en caminos sin pavimentar?
  choices:
    A: 25 MPH
    B: 35 MPH
    C: 45 MPH
    D: 55 MPH
  answer: B
  explanation: A menos que haya una señal de límite de velocidad que indique lo contrario,
    el límite de velocidad máximo para vehículos de pasajeros y motocicletas es de
    35 MPH en caminos sin pavimentar.
- id: 78
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones sobre los detectores de radar es
    cierta en Virginia?
  choices:
    A: Son legales solo en autopistas interestatales.
    B: Son legales para vehículos de pasajeros pero no para vehículos comerciales.
    C: Es ilegal usar detectores de radar en Virginia.
    D: Están permitidos si conduce por debajo del límite de velocidad.
  answer: C
  explanation: 'El manual establece explícitamente: "Es ilegal usar detectores de
    radar en Virginia".'
- id: 79
  category: penalties_and_points
  question: Si usted no obedece la señal de alto de un oficial de la ley, y el oficial
    lo persigue y muere como resultado directo, ¿cuál es la sanción?
  choices:
    A: Un delito menor de Clase 1
    B: Un delito grave de Clase 4
    C: Una multa de $500 y la suspensión de la licencia
    D: Una infracción de tránsito
  answer: B
  explanation: Si no obedece la señal de alto de un oficial de la ley y el oficial
    lo persigue y muere como resultado directo de la persecución, será culpable de
    un delito grave de Clase 4.
- id: 80
  category: sharing_the_road
  question: ¿Cuándo NO está obligado a detenerse ante un autobús escolar detenido
    con luces rojas intermitentes?
  choices:
    A: Cuando viaja en la misma dirección en una carretera de múltiples carriles.
    B: Cuando viaja en dirección opuesta en una calzada con una mediana o barrera
      que divide la vía.
    C: Cuando se encuentra en un camino privado o en la entrada de una escuela.
    D: Cuando el autobús está subiendo pasajeros pero la señal de alto no está extendida.
  answer: B
  explanation: No tiene que detenerse si viaja en dirección opuesta en una calzada
    con una mediana o barrera que divide la vía y el autobús está en el lado opuesto.
- id: 81
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones describe la 'distancia de reacción'?
  choices:
    A: El tiempo que le toma reconocer un peligro.
    B: La distancia que recorre su vehículo entre el momento en que reconoce un problema
      y el momento en que aplica los frenos.
    C: La distancia que recorre su automóvil después de aplicar los frenos.
    D: La distancia total que se necesita para detener su vehículo desde 60 MPH.
  answer: B
  explanation: La distancia de reacción se define como la distancia que recorre su
    vehículo entre el momento en que reconoce un problema y el momento en que aplica
    los frenos.
- id: 82
  category: safe_driving_rules
  question: ¿Cómo puede afectar el pavimento mojado la distancia de frenado de su
    vehículo?
  choices:
    A: Puede duplicar su distancia de frenado.
    B: Reduce su tiempo de percepción.
    C: Disminuye su distancia de reacción.
    D: No tiene ningún efecto si tiene frenos antibloqueo (ABS).
  answer: A
  explanation: El manual indica que la condición del pavimento afecta la distancia
    de frenado y, por ejemplo, el pavimento mojado puede duplicar su distancia de
    frenado.
- id: 83
  category: vehicle_information
  question: ¿Qué debe recordar hacer si su vehículo está equipado con frenos antibloqueo
    (ABS)?
  choices:
    A: Bombear los frenos suavemente al detenerse en carreteras resbaladizas.
    B: Nunca bombear los frenos antibloqueo.
    C: Aplicar el freno de estacionamiento simultáneamente.
    D: Apagar el sistema en clima húmedo.
  answer: B
  explanation: El manual advierte explícitamente a los conductores que "nunca bombeen
    los frenos antibloqueo".
- id: 84
  category: sharing_the_road
  question: Al rebasar un vehículo de recolección de basura estacionado en una carretera
    con menos de cuatro carriles, ¿qué debe hacer si no puede cambiar de carril?
  choices:
    A: Detenerse y esperar a que el vehículo se mueva.
    B: Tocar la bocina y mantener su velocidad.
    C: Reducir la velocidad a 10 millas por hora por debajo del límite de velocidad
      publicado y rebasar al menos a dos pies a la izquierda.
    D: Acelerar para rebasar el vehículo lo más rápido posible.
  answer: C
  explanation: Si se encuentra en una carretera de menos de cuatro carriles o si no
    puede cambiar de carril, reduzca la velocidad a 10 millas por hora por debajo
    del límite de velocidad publicado y rebase al menos a dos pies a la izquierda
    del vehículo.
- id: 85
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de seguimiento que debe mantener detrás de
    un vehículo de emergencia cuando sus luces están parpadeando?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: 'El manual establece: "Nunca siga a un vehículo de emergencia a menos
    de 500 pies cuando sus luces estén parpadeando".'
- id: 86
  category: safe_driving_rules
  question: ¿En qué dirección deben circular los conductores después de entrar a una
    rotonda (glorieta)?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: Recto a través de la isla central
    D: En la dirección que sea más corta hacia su salida
  answer: B
  explanation: Después de entrar a la rotonda, los conductores deben circular en sentido
    contrario a las agujas del reloj.
- id: 87
  category: safe_driving_rules
  question: Cuando dos vehículos de diferentes direcciones llegan al mismo tiempo
    a una intersección sin señales ni semáforos, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda debe permitir que el conductor de la derecha pase
      primero.
    B: El conductor de la derecha debe permitir que el conductor de la izquierda pase
      primero.
    C: El vehículo que viaja a mayor velocidad pasa primero.
    D: El vehículo que gira a la izquierda pasa primero.
  answer: A
  explanation: Cuando vehículos de diferentes direcciones llegan al mismo tiempo a
    una intersección sin señales ni semáforos, el conductor de la izquierda debe permitir
    que el conductor de la derecha pase primero.
- id: 88
  category: signs_and_signals
  question: ¿Qué debe hacer si los semáforos en una intersección no funcionan?
  choices:
    A: Avanzar por la intersección sin detenerse si la vía está despejada.
    B: Tratar la intersección como una señal de ceda el paso.
    C: Todos los vehículos deben detenerse, y el conductor de la izquierda debe ceder
      el paso al conductor de la derecha.
    D: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
  answer: C
  explanation: Si los semáforos en una intersección no funcionan, todos los vehículos
    que lleguen a la intersección deben detenerse. El conductor de la izquierda debe
    ceder el paso al conductor de la derecha.
- id: 89
  category: safe_driving_rules
  question: ¿Qué debe hacer al ingresar a una vía pública desde un camino privado
    o entrada de vehículos?
  choices:
    A: Acelerar rápidamente para incorporarse al tráfico.
    B: Detenerse y ceder el paso a todo el tráfico y a los peatones.
    C: Tocar la bocina y avanzar sin detenerse.
    D: Ceder el paso solo a los vehículos que se aproximan por la izquierda.
  answer: B
  explanation: El manual establece que al ingresar a una vía pública desde un camino
    privado o entrada de vehículos, debe detenerse y ceder el paso a todo el tráfico
    y a los peatones.
- id: 90
  category: sharing_the_road
  question: ¿Cómo debe interactuar con una procesión fúnebre en la carretera?
  choices:
    A: Puede atravesar la procesión si tiene prisa.
    B: Debe ceder el paso a la procesión y nunca atravesarla ni unirse a ella.
    C: Debe unirse a la procesión para evitar los semáforos.
    D: Debe rebasar la procesión por el lado derecho.
  answer: B
  explanation: Debe ceder el paso a las procesiones fúnebres. El manual establece
    explícitamente que nunca debe atravesar, unirse ni interferir con una procesión
    fúnebre.
- id: 91
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por no avanzar con precaución y cambiar de
    carril de manera segura al acercarse a un vehículo de emergencia estacionado con
    luces intermitentes?
  choices:
    A: Una advertencia por escrito para la primera infracción.
    B: Servicio comunitario obligatorio.
    C: Suspensión judicial de su licencia de conducir y puntos de demérito.
    D: Incautación inmediata del vehículo.
  answer: C
  explanation: Las infracciones a las reglas para acercarse a vehículos estacionados
    con luces intermitentes pueden resultar en la suspensión judicial de su licencia
    de conducir y puntos de demérito en su historial de manejo.
- id: 92
  category: safe_driving_rules
  question: ¿Qué señal debe usar mientras está dentro de una rotonda para que los
    conductores sepan que desea salir?
  choices:
    A: Señal de giro a la izquierda.
    B: Señal de giro a la derecha.
    C: Luces de emergencia.
    D: No se requiere ninguna señal en una rotonda.
  answer: B
  explanation: Mientras esté dentro de la rotonda, debe usar la señal de giro a la
    derecha de su vehículo para que los conductores a su alrededor sepan lo que desea
    hacer cuando esté listo para salir.
- id: 93
  category: safe_driving_rules
  question: Al conducir en una autopista de varios carriles, ¿para qué se utiliza
    principalmente el carril izquierdo?
  choices:
    A: Circular al límite de velocidad.
    B: Tráfico más lento.
    C: Solo para rebasar.
    D: Salir de la autopista.
  answer: C
  explanation: El manual especifica que al conducir en una autopista de varios carriles,
    el carril izquierdo es solo para rebasar, no para circular.
- id: 94
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuándo es seguro regresar al carril derecho?
  choices:
    A: Tan pronto como esté paralelo al otro vehículo.
    B: Cuando pueda ver la parte delantera del vehículo rebasado en su espejo retrovisor.
    C: Tres segundos después de pasar el parachoques trasero del vehículo.
    D: Cuando el vehículo rebasado parpadee sus luces delanteras.
  answer: B
  explanation: Debe regresar al carril derecho tan pronto como pueda ver la parte
    delantera del vehículo rebasado en su espejo retrovisor.
- id: 95
  category: sharing_the_road
  question: ¿Cuánto espacio de separación debe dejar al acercarse o rebasar a una
    persona que anda en bicicleta?
  choices:
    A: Al menos dos pies a la izquierda.
    B: Al menos tres pies a la izquierda.
    C: Al menos cuatro pies a la izquierda.
    D: Al menos cinco pies a la izquierda.
  answer: B
  explanation: Al acercarse o rebasar a una persona que anda en bicicleta, ciclomotor
    o bicicleta asistida por motor, debe reducir la velocidad y pasar al menos a tres
    pies a la izquierda.
- id: 96
  category: defensive_driving
  question: ¿Qué debe hacer cuando otro vehículo lo está rebasando?
  choices:
    A: Acelerar para evitar que lo rebasen.
    B: Moverse al carril izquierdo.
    C: Mantener una velocidad constante o reducir la velocidad.
    D: Parpadear sus luces altas.
  answer: C
  explanation: El manual aconseja que cuando lo estén rebasando, no debe acelerar.
    Debe mantener una velocidad constante o reducir la velocidad.
- id: 97
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones se considera ilegal e inseguro
    rebasar?
  choices:
    A: En una autopista de varios carriles con tráfico moviéndose en la misma dirección.
    B: Cuando una línea continua marca el lado izquierdo de su carril.
    C: Cuando el vehículo de adelante está girando a la izquierda y usted se mantiene
      en el pavimento.
    D: Cuando puede ver claramente a 500 pies hacia adelante.
  answer: B
  explanation: Rebasar es ilegal e inseguro cuando una línea continua marca el lado
    izquierdo de su carril.
- id: 98
  category: defensive_driving
  question: ¿Qué debe hacer si se sale de una carretera curva o recta para evitar
    perder el control?
  choices:
    A: Entrar en pánico y frenar bruscamente de inmediato.
    B: Girar el volante bruscamente de regreso hacia la carretera.
    C: Acelerar para recuperar la tracción.
    D: Reducir gradualmente la velocidad, mirar en la dirección a la que desea ir
      y girar lentamente de regreso.
  answer: D
  explanation: Si se sale de la carretera, no entre en pánico. Reduzca gradualmente
    su velocidad, mire en la dirección a la que desea ir y gire lentamente de regreso
    a la calzada para evitar corregir en exceso.
- id: 99
  category: defensive_driving
  question: ¿Por qué debe mantener las ruedas delanteras apuntando hacia adelante
    mientras espera para girar a la izquierda?
  choices:
    A: Le ayuda a acelerar más rápido cuando el semáforo cambia a verde.
    B: Evita que sea empujado hacia el tráfico en sentido contrario si lo chocan por
      detrás.
    C: Reduce el desgaste de su sistema de dirección asistida.
    D: Indica a otros conductores que está cediendo el paso.
  answer: B
  explanation: Mantener las ruedas delanteras apuntando hacia adelante hasta que realmente
    vaya a girar a la izquierda evita que sea empujado hacia el tráfico en sentido
    contrario si otro vehículo choca contra usted por detrás.
- id: 100
  category: safe_driving_rules
  question: ¿Cómo deben proceder dos vehículos que se acercan entre sí y señalan para
    girar a la izquierda?
  choices:
    A: Ambos vehículos deben girar uno detrás del otro.
    B: El vehículo de la derecha tiene el derecho de paso.
    C: Ambos vehículos deben girar uno frente al otro para que sus lados del pasajero
      queden uno al lado del otro.
    D: Ambos vehículos deben detenerse y esperar una flecha verde.
  answer: C
  explanation: Cuando dos vehículos se acercan entre sí y señalan para girar a la
    izquierda, ambos vehículos deben girar uno frente al otro para que los lados del
    pasajero de los vehículos queden uno al lado del otro.
- id: 101
  category: safe_driving_rules
  question: ¿Dónde están permitidos los giros en U en distritos comerciales, ciudades
    y pueblos?
  choices:
    A: En cualquier lugar donde haya una línea amarilla discontinua.
    B: Solo en las intersecciones.
    C: En cualquier carretera.
    D: En el medio de la cuadra si la vía está despejada.
  answer: B
  explanation: En distritos comerciales, ciudades y pueblos, los giros en U solo están
    permitidos en las intersecciones.
- id: 102
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalar su intención de girar?
  choices:
    A: Al menos uno o dos segundos, 50 pies antes.
    B: Al menos tres o cuatro segundos, 100 pies antes.
    C: Al menos cinco o seis segundos, 200 pies antes.
    D: Justo cuando comienza a girar el volante.
  answer: B
  explanation: Debe poner la luz direccional al menos tres o cuatro segundos, o 100
    pies, antes de girar.
- id: 103
  category: signs_and_signals
  question: ¿Qué indica una mano y un brazo izquierdo apuntando hacia abajo?
  choices:
    A: Giro a la izquierda.
    B: Giro a la derecha.
    C: Disminuir la velocidad o detenerse.
    D: Proceder con precaución.
  answer: C
  explanation: Según la guía de señales manuales del manual, una mano y un brazo izquierdo
    apuntando hacia abajo indica 'Disminuir la velocidad o detenerse'.
- id: 104
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir a velocidades
    entre 35 y 45 MPH en superficies secas?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: B
  explanation: Según el manual, la distancia de seguimiento recomendada es de 3 segundos
    para velocidades de 35 a 45 MPH.
- id: 105
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones debe aumentar su distancia de seguimiento?
  choices:
    A: Al conducir detrás de un vehículo grande que bloquea su visión.
    B: Al conducir en una carretera recién pavimentada.
    C: Al ingresar a una autopista.
    D: Al conducir detrás de un vehículo con un escape ruidoso.
  answer: A
  explanation: El manual indica a los conductores que aumenten su distancia de seguimiento
    al conducir detrás de un vehículo grande que bloquea su visión, entre otras situaciones
    como mal tiempo o cuando otro vehículo los sigue muy de cerca.
- id: 106
  category: defensive_driving
  question: ¿Qué debe hacer si se da cuenta de que otro vehículo lo sigue muy de cerca
    (tailgating)?
  choices:
    A: Frenar bruscamente para advertir al conductor.
    B: Acelerar para aumentar la distancia entre ustedes.
    C: Cambiarse a otro carril o tocar suavemente los frenos para que parpadeen las
      luces de freno.
    D: Encender las luces de emergencia y detenerse en su carril.
  answer: C
  explanation: Si lo siguen muy de cerca, el manual aconseja no frenar bruscamente.
    En su lugar, cámbiese a otro carril si es posible, o toque suavemente los frenos
    para que parpadeen las luces de freno y disminuya la velocidad.
- id: 107
  category: defensive_driving
  question: ¿A qué distancia hacia adelante intentan enfocar la vista los conductores
    expertos al observar la carretera?
  choices:
    A: De 5 a 10 segundos hacia adelante
    B: De 10 a 15 segundos hacia adelante
    C: De 20 a 30 segundos hacia adelante
    D: De 45 a 60 segundos hacia adelante
  answer: C
  explanation: Mirar hacia adelante ayuda a identificar los riesgos a tiempo. Los
    conductores expertos intentan enfocar la vista de 20 a 30 segundos hacia adelante,
    lo que equivale aproximadamente a una cuadra en la ciudad.
- id: 108
  category: safe_driving_rules
  question: Al llegar a una intersección, ¿en qué orden debe revisar el tráfico?
  choices:
    A: Derecha, izquierda, luego derecha otra vez
    B: Izquierda, derecha, luego izquierda otra vez
    C: Hacia adelante, luego a la izquierda
    D: Derecha, hacia adelante, luego a la izquierda
  answer: B
  explanation: En cualquier intersección, mire primero a la izquierda, ya que los
    vehículos que vienen por la izquierda estarán más cerca de usted. Luego mire a
    la derecha y eche un último vistazo rápido a la izquierda antes de cruzar.
- id: 109
  category: defensive_driving
  question: ¿Con qué frecuencia debe usar su espejo retrovisor para revisar el tráfico
    detrás de usted?
  choices:
    A: Aproximadamente cada 5 segundos
    B: Aproximadamente cada 10 segundos
    C: Aproximadamente cada 30 segundos
    D: Solo al cambiar de carril
  answer: B
  explanation: El manual indica que debe usar su espejo retrovisor para revisar el
    tráfico detrás de usted con frecuencia, aproximadamente cada 10 segundos.
- id: 110
  category: defensive_driving
  question: ¿Cuál es la mejor manera de ver un vehículo en su punto ciego?
  choices:
    A: Ajustar su espejo retrovisor interior a un ángulo más amplio.
    B: Confiar en la cámara de marcha atrás de su vehículo.
    C: Girar rápidamente la cabeza y mirar por encima del hombro.
    D: Estar atento a las sombras en la superficie de la carretera.
  answer: C
  explanation: La mejor manera de ver un vehículo en su punto ciego es girando rápidamente
    la cabeza y mirando por encima del hombro para asegurarse de que la vía esté despejada
    antes de cambiar de carril o rebasar.
- id: 111
  category: penalties_and_points
  question: ¿Cuál es la posible sanción por no detenerse ante un peatón que cruza
    legalmente y causarle daños corporales graves o la muerte?
  choices:
    A: Un delito grave de Clase 3
    B: Un delito menor de Clase 1
    C: Una multa de $500 y sin tiempo en la cárcel
    D: Una advertencia por la primera infracción
  answer: B
  explanation: No detenerse ante los peatones que cruzan legalmente una vía y causarles
    daños corporales graves o la muerte puede resultar en un delito menor de Clase
    1.
- id: 112
  category: sharing_the_road
  question: ¿Bajo qué circunstancias se le permite a un ciclista circular por el centro
    del carril?
  choices:
    A: Siempre que circulen por una autopista interestatal.
    B: Solo cuando viajen al límite de velocidad publicado.
    C: Cuando están a punto de girar a la izquierda o cuando el carril es demasiado
      estrecho para compartirlo lado a lado con un automóvil.
    D: A los ciclistas nunca se les permite circular por el centro del carril.
  answer: C
  explanation: A los ciclistas se les permite circular por el centro del carril cuando
    sea necesario, como cuando están a punto de girar a la izquierda o cuando el carril
    es demasiado estrecho para compartirlo lado a lado con un automóvil.
- id: 113
  category: sharing_the_road
  question: ¿Cómo debe ajustar su distancia de seguimiento cuando conduce detrás de
    una motocicleta en condiciones climáticas adversas?
  choices:
    A: Mantener la distancia de seguimiento estándar de 2 segundos.
    B: Agregar un segundo adicional a la regla de distancia de seguimiento.
    C: Duplicar la distancia de seguimiento después de agregar un segundo adicional.
    D: Reducir su distancia de seguimiento para mantenerse en el rebufo de la motocicleta.
  answer: C
  explanation: El manual indica que se debe dejar suficiente distancia de frenado
    agregando un segundo adicional a la regla de distancia de seguimiento para motocicletas,
    y en condiciones climáticas adversas, duplicar esta distancia.
- id: 114
  category: sharing_the_road
  question: ¿Por qué es especialmente importante ceder el paso a las motocicletas
    antes de incorporarse al tráfico?
  choices:
    A: Las motocicletas siempre viajan más rápido que el límite de velocidad publicado.
    B: El tamaño de una motocicleta puede hacer que usted calcule mal su velocidad
      y distancia.
    C: Las motocicletas tienen el derecho de paso en todas las intersecciones.
    D: Las motocicletas no pueden usar sus frenos con tanta eficacia como los automóviles.
  answer: B
  explanation: Ceda el paso a las motocicletas porque el tamaño de una motocicleta
    puede hacer que usted calcule mal su velocidad y distancia.
- id: 115
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al encontrarse con un peatón que usa un bastón
    o un perro guía?
  choices:
    A: Tocar la bocina para alertar al peatón de la presencia del vehículo.
    B: Reducir la velocidad a 10 MPH y proceder con precaución.
    C: Detenerse por completo, ya que esto indica ceguera o discapacidad visual.
    D: Ceder el paso solo si el peatón está en un cruce peatonal marcado.
  answer: C
  explanation: Se requiere que los conductores se detengan por completo ante un peatón
    que usa un bastón o un perro guía, ya que esto indica ceguera o discapacidad visual.
- id: 116
  category: sharing_the_road
  question: ¿Cuál es una regla de seguridad importante a seguir al conducir cerca
    de vías de tren ligero (light rail)?
  choices:
    A: Puede rebasar a otros vehículos mientras esté sobre las vías del tren.
    B: Nunca se detenga, rebase ni cambie de marcha sobre las vías del tren.
    C: Puede rodear las barreras de cruce bajadas si no hay ningún tren visible.
    D: Los trenes solo viajan en una dirección en una vía única.
  answer: B
  explanation: Al conducir cerca de trenes ligeros, nunca debe detenerse, rebasar
    ni cambiar de marcha sobre las vías del tren.
- id: 117
  category: vehicle_information
  question: 'Los vehículos de baja velocidad pueden ser operados en vías públicas
    con un límite de velocidad máximo de:'
  choices:
    A: 25 MPH o menos
    B: 35 MPH o menos
    C: 45 MPH o menos
    D: 55 MPH o menos
  answer: B
  explanation: Los vehículos de baja velocidad pueden ser operados en vías públicas
    con límites de velocidad de 35 MPH o menos por conductores con licencia o titulares
    de un permiso de aprendizaje acompañados por un conductor con licencia.
- id: 118
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego lateral o 'Zona
    Ciega' (No-Zone) de un camión grande?
  choices:
    A: Está conduciendo a menos de 500 pies de la parte trasera del camión.
    B: Las luces direccionales del camión están parpadeando.
    C: No puede ver el rostro del conductor del camión en su espejo retrovisor lateral.
    D: Está conduciendo en una carretera de dos carriles.
  answer: C
  explanation: Los camiones tienen grandes Zonas Ciegas (No-Zones) en ambos lados.
    Si no puede ver el rostro del conductor en su espejo retrovisor lateral, entonces
    él no puede verlo a usted.
- id: 119
  category: sharing_the_road
  question: Al rebasar a un camión grande, autobús o vehículo recreativo (RV), ¿cuándo
    es seguro volver al carril delante del vehículo?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del camión.
    B: Cuando pueda ver toda la parte delantera del camión en su espejo retrovisor.
    C: Cuando esté exactamente a 50 pies por delante del camión.
    D: Cuando el conductor del camión parpadee sus faros.
  answer: B
  explanation: Al rebasar, busque ver toda la parte delantera del camión en su espejo
    retrovisor antes de colocarse delante para evitar la Zona Ciega (No-Zone) frontal.
- id: 120
  category: vehicle_information
  question: ¿Qué debe hacer si el remolque ligero o mediano que está remolcando comienza
    a balancearse?
  choices:
    A: Acelerar para enderezar el remolque.
    B: Girar el volante bruscamente de lado a lado.
    C: Aplicar los frenos firmemente.
    D: Reducir la velocidad.
  answer: D
  explanation: Al conducir un vehículo con un remolque ligero o mediano acoplado,
    si su remolque comienza a balancearse, debe reducir la velocidad.
- id: 121
  category: safe_driving_rules
  question: ¿Cuál es el error más común que cometen los conductores al dar marcha
    atrás?
  choices:
    A: Depender únicamente del espejo retrovisor.
    B: No mirar hacia ambos lados detrás de ellos.
    C: Dar marcha atrás demasiado despacio.
    D: Mantener ambas manos en el volante.
  answer: B
  explanation: El error más común que cometen los conductores al dar marcha atrás
    es no mirar hacia ambos lados detrás de ellos.
- id: 122
  category: safe_driving_rules
  question: Al estacionar junto a un bordillo en una vía pública, ¿cuál es la distancia
    máxima a la que puede estar su vehículo del bordillo?
  choices:
    A: 6 pulgadas
    B: 1 pie
    C: 18 pulgadas
    D: 2 pies
  answer: B
  explanation: Si se estaciona junto a un bordillo, acérquese a él. No puede estacionarse
    a más de un pie del bordillo.
- id: 123
  category: safe_driving_rules
  question: ¿Cómo debe colocar las ruedas delanteras al estacionar cuesta arriba junto
    a un bordillo?
  choices:
    A: Girar las ruedas delanteras hacia la izquierda
    B: Girar las ruedas delanteras hacia la derecha
    C: Mantener las ruedas perfectamente rectas
    D: Girar las ruedas traseras hacia la izquierda
  answer: A
  explanation: Al estacionar cuesta arriba con un bordillo, gire las ruedas delanteras
    hacia la izquierda para evitar que el vehículo ruede hacia la calle.
- id: 124
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios se le prohíbe estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: No puede estacionarse a menos de 15 pies de un hidrante de incendios.
- id: 125
  category: safe_driving_rules
  question: ¿A cuántos pies de un cruce de ferrocarril es ilegal estacionar su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 50 pies
    D: 500 pies
  answer: C
  explanation: No puede estacionarse a menos de 50 pies de un cruce de ferrocarril.
- id: 126
  category: defensive_driving
  question: Según el manual, ¿cuál es el factor que más contribuye a los choques?
  choices:
    A: Exceso de velocidad
    B: Conducir bajo los efectos del alcohol o drogas
    C: No identificar un riesgo
    D: Seguir muy de cerca a otro vehículo
  answer: C
  explanation: El factor que más contribuye a los choques es no identificar un riesgo.
    Para ser un buen conductor, necesita saber qué buscar y dónde mirar.
- id: 127
  category: safe_driving_rules
  question: 'La ley de Virginia exige que los conductores usen los faros durante las
    inclemencias del tiempo cuando la visibilidad se reduce a:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: La ley de Virginia exige que los conductores usen los faros durante
    las inclemencias del tiempo, como lluvia, niebla, nieve o aguanieve, cuando la
    visibilidad se reduce a 500 pies.
- id: 128
  category: safe_driving_rules
  question: ¿Cuándo debe usar los faros en relación con los limpiaparabrisas?
  choices:
    A: Solo al conducir de noche.
    B: Siempre que use los limpiaparabrisas debido al mal tiempo.
    C: Solo cuando los limpiaparabrisas estén en la velocidad más alta.
    D: No se requieren los faros al usar los limpiaparabrisas durante el día.
  answer: B
  explanation: Debe usar los faros siempre que use los limpiaparabrisas debido al
    mal tiempo.
- id: 129
  category: safe_driving_rules
  question: Al seguir a otro vehículo de noche, ¿a qué distancia del vehículo de adelante
    debe usar las luces bajas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Al seguir a otro vehículo, use las luces bajas siempre que esté a menos
    de 200 pies del vehículo de adelante.
- id: 130
  category: defensive_driving
  question: ¿Qué debe hacer si las luces altas de un vehículo que se aproxima están
    encendidas?
  choices:
    A: Encender sus luces altas para advertir al conductor.
    B: Mirar directamente a las luces brillantes para seguir al vehículo.
    C: Mirar de reojo hacia el lado de la carretera y luego mirar rápidamente hacia
      adelante.
    D: Parpadear los faros rápidamente y tocar la bocina.
  answer: C
  explanation: Si las luces altas de un vehículo que se aproxima están encendidas,
    evite mirar directamente a las luces brillantes. Mire de reojo hacia el lado de
    la carretera y luego mire rápidamente hacia adelante para determinar la posición
    del otro vehículo.
- id: 131
  category: safe_driving_rules
  question: Al conducir en una autopista, ¿a qué distancia debe bajar las luces altas
    cuando se aproxima un vehículo en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El manual indica que se deben usar las luces bajas en las autopistas,
    a menos que no haya otro vehículo acercándose en sentido contrario a menos de
    500 pies de distancia.
- id: 132
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo que se aproxima en sentido contrario no
    baja sus luces altas?
  choices:
    A: Encender sus luces altas para advertirles
    B: Mirar de reojo hacia el borde de la carretera y luego mirar rápidamente hacia
      adelante
    C: Mirar directamente a los faros para calcular su distancia
    D: Detenerse a un lado de la carretera inmediatamente y esperar a que pasen
  answer: B
  explanation: Si las luces altas de un automóvil que se aproxima están encendidas,
    evite mirar directamente a las luces brillantes. Mire de reojo hacia el borde
    de la carretera y luego mire rápidamente hacia adelante. No encienda sus luces
    altas.
- id: 133
  category: safe_driving_rules
  question: ¿Qué luces debe usar al conducir con niebla densa?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo las luces de estacionamiento
    D: Luces intermitentes de emergencia
  answer: B
  explanation: Use las luces bajas con niebla densa porque la niebla refleja la luz
    y puede reflejar sus propios faros hacia sus ojos.
- id: 134
  category: safe_driving_rules
  question: ¿Por qué es más probable que las carreteras estén resbaladizas durante
    la primera media hora después de que comienza a llover?
  choices:
    A: La lluvia lava el material de tracción de la carretera
    B: El aceite en la superficie de la carretera se mezcla con el agua
    C: La temperatura desciende rápidamente causando la formación de hielo
    D: Los neumáticos hidroplanean más fácilmente en aguas poco profundas que en aguas
      profundas
  answer: B
  explanation: Cuando comienza a llover, durante la primera media hora, es más probable
    que las carreteras estén resbaladizas debido a que el aceite en la superficie
    de la carretera se mezcla con el agua.
- id: 135
  category: vehicle_information
  question: Antes de conducir en condiciones de nieve, ¿de qué partes de su vehículo
    debe quitar la nieve y el hielo?
  choices:
    A: Solo del parabrisas y las ventanas delanteras
    B: Solo de las luces delanteras y traseras
    C: De todo el automóvil, incluyendo el techo, el capó y la parte trasera
    D: Solo de los limpiaparabrisas y los espejos
  answer: C
  explanation: Quite la nieve y el hielo de todo su automóvil, incluyendo el techo,
    el capó y la parte trasera del vehículo, antes de comenzar a conducir para que
    no salgan volando y creen un peligro.
- id: 136
  category: safe_driving_rules
  question: ¿Dónde debe estar especialmente atento al hielo en la carretera durante
    el clima frío?
  choices:
    A: En puentes y en áreas sombreadas
    B: En túneles y pasos subterráneos
    C: En intersecciones con semáforos
    D: En las cimas de las colinas
  answer: A
  explanation: Esté atento al hielo en puentes y en áreas sombreadas. Los puentes
    se congelan antes que otras superficies de la carretera.
- id: 137
  category: penalties_and_points
  question: 'Si es condenado por conducir de manera agresiva en Virginia, su licencia
    podría ser suspendida por:'
  choices:
    A: 5 días a 30 días
    B: 10 días a 6 meses
    C: 30 días a 1 año
    D: 6 meses a 2 años
  answer: B
  explanation: Si es condenado por conducir de manera agresiva, su licencia podría
    ser suspendida por diez días o hasta por seis meses.
- id: 138
  category: defensive_driving
  question: ¿Cómo debe reaccionar si se encuentra con un conductor agresivo en la
    carretera?
  choices:
    A: Acelerar para mantenerse delante de él
    B: Hacer contacto visual para demostrar que no está intimidado
    C: Intentar superarlo con maniobras
    D: Apartarse del camino y evitar el contacto visual
  answer: D
  explanation: Si ve a un conductor agresivo, apártese de su camino. No desafíe al
    conductor agresivo, evite el contacto visual e ignore sus gestos y gritos.
- id: 139
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma efectiva y confiable de prevenir
    la conducción somnolienta?
  choices:
    A: Bajar una ventana
    B: Masticar chicle y subir el volumen de la radio
    C: Consumir cafeína o bebidas energéticas
    D: Detenerse en un lugar seguro y tomar una siesta de 10 a 20 minutos
  answer: D
  explanation: Deténgase en un lugar seguro y tome una siesta. Tan solo 10 a 20 minutos
    de sueño pueden hacer una gran diferencia. Bajar una ventana, masticar chicle,
    subir el volumen de la radio o consumir cafeína no son métodos confiables.
- id: 140
  category: alcohol_drugs_health
  question: 'En Virginia, se considera legalmente que un conductor de 21 años o más
    conduce bajo la influencia del alcohol (DUI) si su concentración de alcohol en
    la sangre (BAC) es de al menos:'
  choices:
    A: .02 por ciento
    B: .04 por ciento
    C: .08 por ciento
    D: .10 por ciento
  answer: C
  explanation: Legalmente, se considera que los conductores de 21 años o más conducen
    bajo la influencia del alcohol (DUI) si su concentración de alcohol en la sangre
    (BAC) es del .08 por ciento o más.
- id: 141
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años, puede ser condenado por consumo ilegal de alcohol
    si su concentración de alcohol en la sangre (BAC) es:'
  choices:
    A: De al menos .02 pero menos de .08
    B: De al menos .01 pero menos de .05
    C: De al menos .05 pero menos de .10
    D: Exactamente .00
  answer: A
  explanation: Si es menor de 21 años, puede ser condenado por consumo ilegal de alcohol
    si su concentración de alcohol en la sangre (BAC) es de al menos .02 pero menos
    de .08.
- id: 142
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes opciones contiene la misma cantidad de alcohol
    que un vaso de cerveza de 12 onzas?
  choices:
    A: Una copa de vino de 12 onzas
    B: Una copa de vino de 5 onzas
    C: Dos tragos (shots) de licor
    D: Una copa de vino de 8 onzas
  answer: B
  explanation: Doce onzas de cerveza equivalen a un trago de licor o a una copa de
    vino de cinco onzas.
- id: 143
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de disminuir la intoxicación?
  choices:
    A: Beber café negro
    B: Tomar una ducha fría
    C: Hacer ejercicio vigoroso
    D: El tiempo
  answer: D
  explanation: Solo el tiempo puede disminuir la intoxicación. El café, las duchas
    frías o el ejercicio no lo pondrán sobrio.
- id: 144
  category: safe_driving_rules
  question: Según la ley de Virginia, ¿cuándo se le permite a un conductor sostener
    un teléfono celular mientras conduce?
  choices:
    A: Cuando lo usa para fines de navegación
    B: Cuando está detenido en un semáforo en rojo
    C: Solo en una emergencia del conductor o cuando está legalmente estacionado o
      detenido
    D: Cuando habla por el altavoz
  answer: C
  explanation: La ley de Virginia prohíbe a los conductores sostener teléfonos celulares
    o cualquier otro dispositivo de comunicación inalámbrica mientras conducen, excepto
    en una emergencia del conductor o si el vehículo está legalmente estacionado o
    detenido.
- id: 145
  category: driver_responsibility
  question: ¿Aproximadamente qué porcentaje de todos los accidentes de tránsito en
    Virginia anualmente se debe a la distracción del conductor?
  choices:
    A: 10 por ciento
    B: 17 por ciento
    C: 25 por ciento
    D: 33 por ciento
  answer: B
  explanation: Anualmente, la distracción del conductor representa aproximadamente
    el 17 por ciento de todos los accidentes de tránsito en Virginia.
- id: 146
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de combinar alcohol con otros medicamentos, como los
    medicamentos para la alergia o el resfriado?
  choices:
    A: Neutraliza los efectos del alcohol
    B: Generalmente multiplica los efectos de ambos
    C: No tiene impacto en su capacidad de conducción
    D: Mejora su tiempo de reacción
  answer: B
  explanation: Combinar alcohol con otros medicamentos generalmente multiplica los
    efectos de ambos y puede tener un efecto desastroso en su capacidad para conducir.
    Incluso una sola bebida tomada con un medicamento para la alergia o el resfriado
    puede tener el mismo efecto que varias bebidas alcohólicas.
- id: 147
  category: driver_responsibility
  question: Si se ve involucrado en un accidente de tránsito, ¿cuándo debe mover su
    vehículo de la carretera inmediatamente?
  choices:
    A: Solo si un oficial de la ley se lo indica
    B: Si los vehículos se pueden mover, nadie está herido y es seguro hacerlo
    C: Nunca debe mover su vehículo hasta que llegue la policía
    D: Solo si los daños son menores a $3,000
  answer: B
  explanation: Los conductores deben mover los vehículos de la carretera inmediatamente
    si los vehículos se pueden mover, nadie está herido y el conductor es capaz de
    hacerlo de manera segura.
- id: 148
  category: driver_responsibility
  question: Los oficiales de la ley están obligados a enviar un informe de accidente
    por escrito al DMV cuando un accidente de tránsito resulta en lesiones, muerte
    o daños totales a la propiedad que exceden ¿qué cantidad?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $3,000
  answer: D
  explanation: Los oficiales de la ley deben enviar un informe de accidente por escrito
    al DMV cuando un accidente de tránsito resulta en lesiones o la muerte de cualquier
    persona, o si los daños totales a la propiedad superan los $3,000.
- id: 149
  category: driver_responsibility
  question: Si choca contra un vehículo desatendido y no puede localizar al propietario,
    ¿qué debe hacer?
  choices:
    A: Abandonar la escena y esperar a que el propietario lo contacte
    B: Dejar una nota con su información de contacto y reportar el accidente a la
      policía dentro de las 24 horas
    C: Esperar en la escena hasta que el propietario regrese, sin importar cuánto
      tiempo tome
    D: Reportar el accidente a su compañía de seguros dentro de las 48 horas y retirarse
  answer: B
  explanation: Si no puede localizar al propietario de un vehículo desatendido que
    usted dañó, debe dejar una nota que se pueda encontrar fácilmente en la escena
    con su información de contacto y los detalles del accidente, y reportar el accidente
    a la policía dentro de las 24 horas.
- id: 150
  category: defensive_driving
  question: Si una colisión con un ciervo u otro animal grande es inevitable, ¿qué
    debe hacer?
  choices:
    A: Desviarse bruscamente hacia el carril contrario
    B: Acelerar para minimizar el tiempo de impacto
    C: Frenar firmemente, mantenerse en su carril y detenerse de manera controlada
    D: Desviarse fuera de la carretera hacia la zanja
  answer: C
  explanation: Si una colisión con un ciervo u otro animal es inevitable, no se desvíe.
    Frene firmemente, manténgase en su carril y deténgase de manera controlada.
- id: 151
  category: safe_driving_rules
  question: Si un oficial de policía lo detiene por la noche, ¿cuál es una de las
    acciones que debe tomar?
  choices:
    A: Apagar sus faros inmediatamente
    B: Encender las luces interiores de su vehículo
    C: Salir del vehículo para saludar al oficial
    D: Mantener las manos ocultas hasta que le pidan identificación
  answer: B
  explanation: Durante una parada de tráfico por la noche, debe encender las luces
    interiores de su vehículo para ayudar al oficial a ver el interior.
- id: 152
  category: driver_responsibility
  question: ¿Qué significa firmar una citación de tráfico emitida por un oficial de
    policía?
  choices:
    A: Es una admisión de culpa
    B: Es una renuncia a su derecho a una audiencia en la corte
    C: No es una admisión de culpa, pero negarse a firmar puede resultar en su arresto
    D: Significa que acepta pagar la multa inmediatamente
  answer: C
  explanation: Se le pedirá que firme la citación. Firme la citación; esto no es una
    admisión de culpa. Negarse a firmar la citación puede resultar en su arresto.
- id: 153
  category: safe_driving_rules
  question: Según la ley de Virginia, ¿quiénes están obligados a usar cinturones de
    seguridad en un vehículo?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: El conductor y todos los pasajeros, tanto en la parte delantera como en la
      trasera
    D: Solo el conductor
  answer: C
  explanation: Según la ley de Virginia, el conductor y todos los pasajeros, tanto
    en la parte delantera como en la trasera, deben usar cinturones de seguridad.
- id: 154
  category: safe_driving_rules
  question: ¿Cómo debe usar el cinturón de seguridad una mujer embarazada?
  choices:
    A: Con la correa de la cintura lo más bajo posible sobre la pelvis
    B: Con la correa de la cintura cruzando el medio del estómago
    C: Sin la correa del hombro
    D: Las mujeres embarazadas están exentas de usar cinturones de seguridad
  answer: A
  explanation: Las mujeres embarazadas están mucho más seguras si se abrochan el cinturón
    llevando la correa lo más bajo posible sobre la pelvis.
- id: 155
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera condena por violar la ley de sistemas
    de retención infantil en Virginia?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: B
  explanation: Si es condenado por violar la ley de sistemas de retención infantil,
    recibirá una multa de $50. Una segunda ofensa o una posterior podría significar
    una multa de $500.
- id: 156
  category: safe_driving_rules
  question: ¿Dónde es el lugar más seguro para instalar un asiento de seguridad para
    niños en un vehículo?
  choices:
    A: El asiento del pasajero delantero
    B: El centro del asiento trasero
    C: El asiento trasero del lado del conductor
    D: El asiento trasero del lado del pasajero
  answer: B
  explanation: El lugar más seguro para instalar un asiento de seguridad para niños
    es en el centro del asiento trasero.
- id: 157
  category: safe_driving_rules
  question: En Virginia, ¿es ilegal transportar a niños menores de qué edad en la
    caja de una camioneta (pickup)?
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: Es ilegal transportar a niños menores de 16 años en la caja de una
    camioneta, incluso si está equipada con una cubierta o camper.
- id: 158
  category: vehicle_information
  question: Si su vehículo está equipado con bolsas de aire, ¿qué tan atrás debe mover
    su asiento del volante?
  choices:
    A: Al menos 5 pulgadas
    B: Al menos 10 pulgadas
    C: Al menos 15 pulgadas
    D: Tan atrás como el asiento lo permita
  answer: B
  explanation: Si su vehículo está equipado con bolsas de aire, debe mover su asiento
    hacia atrás para estar al menos a diez pulgadas del volante.
- id: 159
  category: vehicle_information
  question: ¿Cómo debe ajustar su volante si su vehículo está equipado con bolsas
    de aire?
  choices:
    A: Inclinarlo hacia arriba, hacia su cabeza
    B: Inclinarlo hacia abajo, hacia su pecho
    C: Tirarlo lo más cerca posible de su cuerpo
    D: Bloquearlo en la posición más alta
  answer: B
  explanation: Si su volante es ajustable, debe inclinarlo hacia abajo. Esto apunta
    la bolsa de aire hacia su pecho en lugar de hacia su cabeza y cuello.
- id: 160
  category: safe_driving_rules
  question: ¿Hasta qué edad deben todos los niños estar asegurados adecuadamente en
    un asiento de seguridad para niños o asiento elevado (booster seat)?
  choices:
    A: Menores de 5 años
    B: Menores de 6 años
    C: Menores de 8 años
    D: Menores de 10 años
  answer: C
  explanation: Todos los niños menores de 8 años deben estar asegurados adecuadamente
    en un asiento de seguridad para niños o asiento elevado (booster seat) cuando
    viajen en vehículos fabricados después del 1 de enero de 1968.
- id: 161
  category: safe_driving_rules
  question: Según el manual, ¿cuánto tiempo deben viajar los niños en un asiento de
    seguridad infantil orientado hacia atrás?
  choices:
    A: Desde el nacimiento hasta 1 año
    B: Desde el nacimiento hasta los 2 años
    C: Desde el nacimiento hasta los 3 años
    D: Desde el nacimiento hasta los 4 años
  answer: B
  explanation: Los niños deben viajar orientados hacia atrás desde el nacimiento hasta
    los 2 años, o durante el tiempo que lo permita el fabricante del asiento de seguridad.
- id: 162
  category: safe_driving_rules
  question: ¿Cuándo es aceptable colocar un asiento infantil orientado hacia atrás
    en el asiento del pasajero delantero?
  choices:
    A: Siempre que el conductor quiera vigilar de cerca al niño
    B: Solo si el vehículo no tiene asiento trasero y la bolsa de aire (airbag) del
      pasajero está desactivada o no está equipada
    C: Solo si el niño tiene más de 1 año
    D: Nunca es aceptable bajo ninguna circunstancia
  answer: B
  explanation: Si el vehículo no tiene asiento trasero, se puede colocar un asiento
    infantil orientado hacia atrás en el asiento del pasajero delantero si el vehículo
    no está equipado con una bolsa de aire (airbag) del lado del pasajero o si la
    bolsa de aire del pasajero está desactivada.
- id: 163
  category: penalties_and_points
  question: ¿Cuál es la diferencia entre que le suspendan su licencia de conducir
    y que se la revoquen?
  choices:
    A: La suspensión es permanente, mientras que la revocación es temporal.
    B: La suspensión significa que su privilegio se retira temporalmente, mientras
      que la revocación significa que se cancela definitivamente.
    C: La suspensión requiere que vuelva a tomar el examen práctico de manejo, mientras
      que la revocación solo requiere el pago de una tarifa.
    D: No hay diferencia; ambas significan que su licencia se cancela permanentemente.
  answer: B
  explanation: Si su licencia es suspendida, su privilegio para conducir ha sido retirado
    temporalmente. La revocación significa que su privilegio para conducir ha sido
    cancelado definitivamente.
- id: 164
  category: penalties_and_points
  question: ¿Por cuál de las siguientes condenas el tribunal o el DMV suspenderá o
    revocará automáticamente su privilegio de conducir?
  choices:
    A: Hacer una declaración falsa al DMV
    B: Conducir sin una licencia de conducir válida
    C: Negarse a realizar una prueba de sangre/aliento
    D: Conducción imprudente o agresiva
  answer: A
  explanation: El tribunal o el DMV suspenderá o revocará su privilegio de conducir
    si es condenado por hacer una declaración falsa al DMV. Las otras opciones son
    infracciones por las cuales el tribunal PUEDE suspender o revocar su privilegio.
- id: 165
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones PUEDE resultar en que el tribunal
    suspenda o revoque su privilegio de conducir, en lugar de ser un requisito automático?
  choices:
    A: Eludir a la policía
    B: Cometer un delito grave (felony) que involucre un vehículo motorizado
    C: Conducción imprudente o agresiva
    D: Operar un vehículo motorizado bajo la influencia del alcohol o drogas (DUI)
  answer: C
  explanation: El manual enumera la 'conducción imprudente o agresiva' entre las infracciones
    donde el tribunal PUEDE suspender o revocar su privilegio de conducir, a diferencia
    de un DUI, eludir a la policía o cometer un delito grave con un vehículo, que
    resultarán en suspensión o revocación automática.
- id: 166
  category: penalties_and_points
  question: Si es menor de 18 años, ¿cuál es la sanción por su segunda condena de
    una infracción de tránsito con puntos de demérito?
  choices:
    A: Una suspensión de 30 días de su privilegio de conducir
    B: Una suspensión de 90 días de su privilegio de conducir
    C: Revocación de su privilegio de conducir por un año
    D: Una carta de advertencia del DMV
  answer: B
  explanation: Después de su segunda condena por una infracción de tránsito con puntos
    de demérito cometida cuando era menor de 18 años, el DMV suspenderá su privilegio
    de conducir por 90 días.
- id: 167
  category: penalties_and_points
  question: ¿Qué sucede si un conductor menor de 18 años recibe una tercera condena
    por una infracción de tránsito con puntos de demérito?
  choices:
    A: Su privilegio de conducir es revocado por un año o hasta que cumpla 18 años,
      lo que sea más largo.
    B: Su privilegio de conducir es suspendido por 90 días.
    C: Debe pagar una multa de $500 y volver a tomar el examen práctico de manejo.
    D: Su privilegio de conducir es revocado permanentemente.
  answer: A
  explanation: Para un conductor menor de 18 años, una tercera condena resultará en
    la revocación de su privilegio de conducir por un año o hasta que cumpla 18 años,
    lo que sea más largo.
- id: 168
  category: penalties_and_points
  question: Si tiene 18 años o más, el DMV le exigirá que complete una clínica de
    mejoramiento del conductor si acumula ¿cuántos puntos de demérito?
  choices:
    A: 10 puntos en 12 meses
    B: 12 puntos en 12 meses o 18 puntos en 24 meses
    C: 15 puntos en 12 meses
    D: 18 puntos en 12 meses o 24 puntos en 24 meses
  answer: B
  explanation: Para los conductores de 18 años o más, el DMV exigirá que completen
    una clínica de mejoramiento del conductor si acumulan 12 puntos de demérito en
    12 meses o 18 puntos en 24 meses.
- id: 169
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor adulto (de 18 años o más) que acumula
    18 puntos de demérito en 12 meses?
  choices:
    A: Una suspensión de 30 días
    B: Una suspensión de 60 días
    C: Una suspensión de 90 días y la finalización obligatoria de una clínica de mejoramiento
      del conductor
    D: Una revocación de 1 año de los privilegios de conducir
  answer: C
  explanation: Si recibe 18 puntos de demérito en 12 meses o 24 puntos en 24 meses,
    el DMV suspenderá su privilegio de conducir por 90 días y le exigirá que complete
    una clínica de mejoramiento del conductor.
- id: 170
  category: driver_responsibility
  question: 'Bajo el Programa de Revisión Médica, al DMV le preocupa cualquier condición
    física o mental que afecte:'
  choices:
    A: La audición, el habla y los reflejos del conductor
    B: El nivel de conciencia, percepción, juicio o habilidades motoras del conductor
    C: La capacidad del conductor para leer las señales de tránsito en inglés
    D: La salud cardiovascular y la frecuencia respiratoria del conductor
  answer: B
  explanation: Al DMV le preocupa cualquier condición que afecte el nivel de conciencia,
    la percepción (visión), el juicio y las habilidades motoras del conductor.
- id: 171
  category: penalties_and_points
  question: Al registrar un vehículo motorizado en Virginia, ¿qué debe hacer si no
    tiene cobertura de seguro de responsabilidad civil para el vehículo?
  choices:
    A: Pagar una tarifa de $500 por vehículo motorizado no asegurado.
    B: Entregar su licencia de conducir.
    C: Pagar una multa de $250 y tomar una clínica de mejoramiento del conductor.
    D: No puede registrar un vehículo sin seguro de responsabilidad civil bajo ninguna
      circunstancia.
  answer: A
  explanation: Al registrar un vehículo motorizado, debe firmar una declaración de
    que tiene cobertura de seguro de responsabilidad civil o pagar la tarifa de $500
    por vehículo motorizado no asegurado.
- id: 172
  category: license_system
  question: ¿Qué debe hacer para restablecer su privilegio de conducir si su licencia
    ha estado vencida por un año o más durante un período de suspensión?
  choices:
    A: Solo pagar las tarifas de restablecimiento requeridas.
    B: Mostrar prueba de presencia legal y aprobar los exámenes de la vista, conocimientos
      y habilidades prácticas de manejo.
    C: Completar una clínica de mejoramiento del conductor y pagar una tarifa de $500.
    D: Esperar 90 días adicionales antes de volver a presentar la solicitud.
  answer: B
  explanation: Durante el período de suspensión, si su licencia ha estado vencida
    por un año o más, debe mostrar prueba de presencia legal y aprobar el examen de
    conocimientos de dos partes, el examen de habilidades prácticas de manejo y el
    examen de la vista para que se le restablezca su privilegio de conducir.
- id: 173
  category: penalties_and_points
  question: 'El DMV suspenderá su privilegio de conducir si se atrasa en los pagos
    de manutención infantil por:'
  choices:
    A: 30 días o $1,000
    B: 60 días o $2,500
    C: 90 días o $5,000
    D: 120 días o $10,000
  answer: C
  explanation: La División de Cumplimiento de Manutención Infantil ordenará al DMV
    que suspenda su privilegio de conducir si se atrasa en los pagos de manutención
    infantil por 90 días o $5,000.
- id: 174
  category: alcohol_drugs_health
  question: 'Según las leyes de consentimiento implícito de Virginia, operar un vehículo
    motorizado en vías públicas significa que usted acepta:'
  choices:
    A: Permitir que las fuerzas del orden registren su vehículo en cualquier momento
    B: Someterse a una prueba de aliento si se le solicita
    C: Pagar restitución por cualquier choque que cause
    D: Llevar una licencia de conducir internacional
  answer: B
  explanation: Según las leyes de consentimiento implícito, si opera un vehículo motorizado
    en las vías públicas de Virginia, acepta someterse a una prueba de aliento si
    se le solicita.
- id: 175
  category: penalties_and_points
  question: 'Si es acusado de una primera infracción por conducir bajo los efectos
    del alcohol o drogas (DUI) y su concentración de alcohol en la sangre (BAC) es
    de .08 por ciento o más, su privilegio de conducir será suspendido automáticamente
    por:'
  choices:
    A: 7 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: A
  explanation: Si su concentración de alcohol en la sangre (BAC) es de .08 por ciento
    o más mientras conduce y las fuerzas del orden lo acusan de conducir bajo los
    efectos del alcohol o drogas (DUI)... su privilegio de conducir será suspendido
    automáticamente por siete días, por una primera infracción.
- id: 176
  category: alcohol_drugs_health
  question: 'Para ser acusado de beber mientras opera un vehículo motorizado debido
    a un envase abierto, el envase debe estar ubicado en el área de pasajeros, lo
    cual incluye:'
  choices:
    A: El maletero del vehículo
    B: Una guantera cerrada con llave
    C: Una guantera sin seguro
    D: La caja de una camioneta (pickup)
  answer: C
  explanation: El área de pasajeros significa el área donde se sientan el conductor
    y los pasajeros y cualquier área al alcance del conductor, incluyendo una guantera
    sin seguro.
- id: 177
  category: penalties_and_points
  question: 'Una condena por una infracción de DUI que involucre a un pasajero menor
    de edad (de 17 años o menos) conlleva una pena de cárcel obligatoria adicional
    de:'
  choices:
    A: 48 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: La condena por cualquier infracción de DUI que involucre a un pasajero
    menor de edad (de 17 años o menos) en el vehículo en el momento de la infracción
    conlleva una pena de cárcel obligatoria adicional de cinco días, además de todas
    las demás multas y sentencias de cárcel.
- id: 178
  category: penalties_and_points
  question: 'Si lo sorprenden conduciendo después de que su licencia haya sido suspendida
    por una infracción relacionada con el alcohol, su vehículo será incautado inmediatamente
    por:'
  choices:
    A: 3 días
    B: 7 días
    C: 30 días
    D: 90 días
  answer: C
  explanation: Su vehículo será incautado inmediatamente por 30 días si lo sorprenden
    conduciendo después de que su licencia haya sido suspendida por una infracción
    relacionada con el alcohol.
- id: 179
  category: driver_responsibility
  question: ¿Hasta qué cantidad podría ser responsable de pagar por el personal de
    emergencia que responda a un choque resultante de su infracción de DUI?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: Usted puede ser responsable de pagar el costo (hasta $1,000) de las
    fuerzas del orden, servicios médicos de emergencia, bomberos y personal de rescate
    que respondan a un choque o incidente resultante de su infracción de DUI.
- id: 180
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años y es condenado por conducir con una concentración
    de alcohol en la sangre (BAC) de al menos .02 por ciento pero menos de .08 por
    ciento, su privilegio de conducir será suspendido por:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que cumpla 21 años
  answer: B
  explanation: Si es condenado por conducir después de consumir alcohol ilegalmente,
    y su BAC fue de al menos .02 por ciento y menos de .08 por ciento, la sanción
    del tribunal incluirá una suspensión de su privilegio de conducir por un año a
    partir de la fecha de la condena.
- id: 181
  category: penalties_and_points
  question: 'Si es menor de 21 años y usa una identificación falsa para intentar comprar
    alcohol, se enfrenta a una suspensión obligatoria de su licencia de conducir por:'
  choices:
    A: Al menos 30 días
    B: Al menos 90 días
    C: Al menos seis meses pero no más de un año
    D: Exactamente dos años
  answer: C
  explanation: Si es menor de 21 años y usa o intenta usar una identificación falsa...
    se enfrentará a la suspensión obligatoria de su licencia de conducir por al menos
    seis meses pero no más de un año.
- id: 182
  category: license_system
  question: 'Al conducir con un permiso de aprendizaje, el conductor con licencia
    en el asiento del pasajero delantero debe tener al menos 21 años, A MENOS QUE
    sea su tutor legal o hermano, en cuyo caso puede tener:'
  choices:
    A: 16, 17 o 18 años
    B: 18, 19 o 20 años
    C: Cualquier edad siempre y cuando tenga una licencia
    D: 25 años
  answer: B
  explanation: El conductor con licencia que lo acompañe puede tener 18, 19 o 20 años
    si es su tutor legal, hermano, hermana, medio hermano, media hermana, hermanastro
    o hermanastra.
- id: 183
  category: license_system
  question: Si tiene 19 años o más, ¿cuánto tiempo debe tener un permiso de aprendizaje
    antes de solicitar una licencia de conducir (si no presenta un certificado de
    educación vial)?
  choices:
    A: 30 días
    B: 60 días
    C: 9 meses
    D: 1 año
  answer: B
  explanation: Si tiene 19 años o más, debe tener un permiso de aprendizaje durante
    60 días, o presentar un certificado de finalización de educación vial para solicitar
    una licencia de conducir.
- id: 184
  category: license_system
  question: 'Una licencia de conducir estándar le permite operar cualquier vehículo
    o camión pequeño que esté exento de los requisitos de la Licencia de Conducir
    Comercial (CDL) y pese menos de:'
  choices:
    A: 10,000 libras
    B: 16,000 libras
    C: 26,001 libras
    D: 32,000 libras
  answer: C
  explanation: Una licencia de conducir le permite operar cualquier vehículo o camión
    pequeño de menos de 26,001 libras que esté exento de los requisitos de la licencia
    de conducir comercial (CDL).
- id: 185
  category: license_system
  question: 'Para operar un autobús escolar diseñado para transportar a 15 ocupantes
    (incluido el conductor), usted debe:'
  choices:
    A: Obtener una Licencia de Conducir Comercial (CDL) completa
    B: Tomar los exámenes de conductor comercial y de autobús escolar para obtener
      un endoso
    C: Tener al menos 25 años
    D: Tener una licencia de conducir internacional
  answer: B
  explanation: Si desea operar un autobús escolar diseñado para transportar a 15 ocupantes
    (incluido el conductor), no necesita obtener una licencia de conducir comercial.
    Sin embargo, deberá tomar los exámenes de conductor comercial y de autobús escolar
    para obtener el endoso de autobús escolar en su licencia de conducir.
- id: 186
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es cierta con respecto a una licencia
    de conducir internacional?
  choices:
    A: Es una licencia de conducir válida que le permite conducir en cualquier lugar
      de los EE. UU.
    B: Reemplaza su licencia de conducir emitida por el estado
    C: Es solo una traducción a un idioma extranjero de su licencia de conducir válida
      existente
    D: Se puede comprar legalmente en empresas del sector privado
  answer: C
  explanation: Una licencia de conducir internacional no es una licencia de conducir
    válida y no le permite conducir. Es solo una traducción a un idioma extranjero
    de su licencia de conducir válida existente para ser utilizada cuando viaja fuera
    de los EE. UU.
- id: 187
  category: license_system
  question: ¿Cuál es el estado legal de las licencias de conducir internacionales
    comercializadas por empresas del sector privado en Virginia?
  choices:
    A: Son válidas hasta por 60 días después de llegar a los EE. UU.
    B: Son obligatorias si está de visita desde un país extranjero.
    C: No son válidas y no le permiten operar legalmente un vehículo motorizado.
    D: Son válidas solo si van acompañadas de un pasaporte válido.
  answer: C
  explanation: Según el manual, las licencias de conducir internacionales comercializadas
    por empresas del sector privado no son válidas y no le permiten operar legalmente
    un vehículo motorizado.
- id: 188
  category: license_system
  question: ¿Cómo recibirá su nueva licencia de conducir de Virginia?
  choices:
    A: Se imprimirá inmediatamente en el centro de servicio al cliente del DMV.
    B: Se le enviará por correo.
    C: Debe recogerla en una estación de policía local.
    D: Se le enviará por correo electrónico como una copia digital temporal.
  answer: B
  explanation: El manual establece que recibirá su nueva licencia de conducir por
    correo, ya que el DMV no emite licencias en los centros de servicio al cliente
    por razones de seguridad.
- id: 189
  category: driver_responsibility
  question: Si se muda, ¿cuántos días tiene para notificar al DMV su cambio de dirección?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Si se muda, debe notificar al DMV dentro de 30 días. El servicio postal
    no reenviará su licencia a otra dirección.
- id: 190
  category: license_system
  question: Si es un nuevo residente de Virginia y conduce, ¿dentro de cuántos días
    debe obtener una licencia de conducir de Virginia?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Si es un nuevo residente de Virginia y conduce, debe obtener una licencia
    de conducir de Virginia dentro de los 60 días posteriores a su mudanza.
- id: 191
  category: vehicle_information
  question: ¿Dentro de cuántos días después de mudarse a Virginia debe titular y registrar
    su vehículo y obtener placas de Virginia?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Debe titular y registrar su vehículo y obtener placas de Virginia dentro
    de los 30 días posteriores a su mudanza a Virginia.
- id: 192
  category: vehicle_information
  question: ¿Dónde deben mostrarse las placas en un vehículo registrado en Virginia?
  choices:
    A: Solo en la parte trasera del vehículo.
    B: Solo en la parte delantera del vehículo.
    C: En la parte delantera y trasera del vehículo.
    D: En la parte trasera y dentro del parabrisas delantero.
  answer: C
  explanation: El manual especifica que las placas deben mostrarse en la parte delantera
    y trasera del vehículo.
- id: 193
  category: vehicle_information
  question: Al usar la prueba de la moneda de un centavo (penny test) para revisar
    la banda de rodadura de las llantas, ¿qué indica que está conduciendo con una
    cantidad segura de banda de rodadura?
  choices:
    A: Puede ver toda la cabeza de Abraham Lincoln.
    B: Cualquier parte de la cabeza de Lincoln está cubierta por la banda de rodadura.
    C: La moneda se cae de la ranura.
    D: La banda de rodadura está completamente plana contra la moneda.
  answer: B
  explanation: Durante la prueba de la moneda de un centavo, si alguna parte de la
    cabeza de Lincoln está cubierta por la banda de rodadura, está conduciendo con
    una cantidad segura de banda de rodadura.
- id: 194
  category: vehicle_information
  question: ¿Dónde puede encontrar la presión recomendada en PSI (libras por pulgada
    cuadrada) para las llantas de su vehículo?
  choices:
    A: En la placa del vehículo.
    B: En el manual del propietario del vehículo o en el marco de la puerta del lado
      del conductor.
    C: En el volante.
    D: Impresa en la tarjeta de registro del vehículo.
  answer: B
  explanation: La presión recomendada en PSI se encuentra en el manual del propietario
    del vehículo o en el marco de la puerta del lado del conductor del vehículo.
- id: 195
  category: driver_responsibility
  question: ¿Qué proporciona el pago de la tarifa de $500 por vehículo motorizado
    sin seguro?
  choices:
    A: Cobertura mínima de seguro de responsabilidad civil por un año.
    B: Seguro de cobertura total por un año.
    C: Le permite registrar y operar el vehículo en Virginia por un año sin cobertura
      de seguro.
    D: Cubre daños a la propiedad pero no lesiones corporales.
  answer: C
  explanation: Pagar la tarifa por vehículo motorizado sin seguro no proporciona cobertura
    de seguro, pero le permite registrar y operar el vehículo en Virginia por un período
    de un año.
- id: 196
  category: driver_responsibility
  question: ¿Qué debe hacer antes de cancelar la póliza de seguro de su vehículo en
    Virginia?
  choices:
    A: Pagar una tarifa de cancelación de $500.
    B: Devolver las placas al DMV y cancelar el registro.
    C: Notificar a su departamento de policía local.
    D: Obtener una firma de un representante del DMV.
  answer: B
  explanation: Antes de cancelar su seguro, debe devolver las placas al DMV y cancelar
    el registro.
- id: 197
  category: penalties_and_points
  question: Si lo sorprenden conduciendo sin seguro y no pagó la tarifa por vehículo
    motorizado sin seguro, ¿cuál es uno de los requisitos para recuperar sus privilegios
    de conducir?
  choices:
    A: Pagar una tarifa por incumplimiento de $600.
    B: Pagar una tarifa por vehículo motorizado sin seguro de $500.
    C: Cumplir 30 días en la cárcel.
    D: Entregar su vehículo al estado.
  answer: A
  explanation: Si lo sorprenden conduciendo sin seguro y no pagó la tarifa, el DMV
    suspenderá su privilegio de conducir hasta que pague una tarifa por incumplimiento
    de $600 (o se le apruebe un plan de pago) y presente un certificado de seguro
    por tres años.
- id: 198
  category: driver_responsibility
  question: Si es menor de 18 años y marca 'sí' para convertirse en donante de órganos
    en su solicitud, ¿quién toma la decisión final con respecto a la donación?
  choices:
    A: El comisionado del DMV.
    B: Sus padres y tutores.
    C: El personal del hospital.
    D: Usted toma la decisión final independientemente de su edad.
  answer: B
  explanation: Si es menor de 18 años, puede indicar su deseo de donar marcando 'sí';
    sin embargo, por ley, sus padres y tutores deben tomar la decisión final.
- id: 199
  category: safe_driving_rules
  question: Si conduce por una carretera helada o resbaladiza y tiene que detenerse,
    ¿qué debe hacer?
  choices:
    A: Presionar los frenos firmemente.
    B: Aplicar los frenos suavemente.
    C: Mantener el pie fuera del freno y dejar que la compresión lo detenga.
    D: Bombear los frenos lo más rápido posible.
  answer: B
  explanation: Según el examen de conocimientos de muestra en el manual, si conduce
    por una carretera helada o resbaladiza y tiene que detenerse, debe aplicar los
    frenos suavemente.
- id: 200
  category: safe_driving_rules
  question: ¿Cuál es la señal de mano correcta para detenerse?
  choices:
    A: Mano y brazo izquierdos apuntando hacia afuera.
    B: Mano y brazo izquierdos apuntando hacia arriba.
    C: Mano y brazo derechos apuntando hacia abajo.
    D: Mano y brazo izquierdos apuntando hacia abajo.
  answer: D
  explanation: El examen de conocimientos de muestra establece que la señal de mano
    correcta para detenerse es la mano y el brazo izquierdos apuntando hacia abajo.
- id: 201
  category: driver_responsibility
  question: Si se ve involucrado en un choque, ¿cuáles son las acciones requeridas?
  choices:
    A: Llevar a la persona al hospital más cercano de inmediato.
    B: Continuar a casa y presentar un informe del choque en línea.
    C: Detenerse, ayudar a los heridos, reportar el choque a la policía, intercambiar
      información y notificar a su compañía de seguros.
    D: Revisar su vehículo en busca de daños y retirarse si se puede conducir.
  answer: C
  explanation: El examen de conocimientos de muestra indica que si se ve involucrado
    en un choque, debe detenerse, ayudar a los heridos, reportar el choque a la policía,
    intercambiar información y notificar a su compañía de seguros.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal roja octagonal de ALTO (STOP) significa que debe detenerse
    por completo en la línea de alto, el cruce peatonal o antes de ingresar a la intersección.
    Verifique el tráfico y los peatones antes de avanzar.
  id: 202
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Avanzar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 203
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entrar en esta vía
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe ingresar a la calle o rampa donde está colocada esta señal. Por lo general,
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde ingresar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 204
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que viaja en contra del tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera segura.
  id: 205
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de autopista a la izquierda
  answer: B
  explanation: Una señal en blanco y negro de UN SOLO SENTIDO (ONE WAY) con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección — la dirección
    que señala la flecha.
  id: 206
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en esta ubicación.
  id: 207
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir derecho
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 208
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en esta
    ubicación.
  id: 209
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde se prohíbe rebasar.
  id: 210
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal a los conductores que deben hacer?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un separador o una obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 211
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 212
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 213
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminar cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que cruzan la carretera.
  id: 214
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal verde amarillenta fluorescente en forma de pentágono (5 lados)
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 215
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no adelantar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 216
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 217
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Se requiere girar a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 218
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 219
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera se curve
    primero hacia un lado y luego hacia el otro.
  id: 220
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté atento a las condiciones cambiantes
    de la carretera.
  id: 221
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una carretera dividida
    D: Una carretera que se estrecha a un carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 222
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: Fin de carril
    D: Fin de carretera dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la vía y ajuste
    su posición en el carril.
  id: 223
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: Fin de la carretera
    B: Tráfico de doble sentido
    C: Comienza una carretera dividida
    D: Salida de autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    carretera dividida con una mediana o barrera que separa el tráfico en sentido
    contrario. Manténgase a la derecha.
  id: 224
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Termina la carretera dividida y se reanuda el tráfico de doble sentido
    C: Área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la carretera dividida termina. El tráfico en
    sentido contrario ya no estará separado por una mediana. Esté preparado para el
    tráfico de doble sentido.
  id: 225
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Desvío de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de sentido único o de una carretera dividida
    y se encontrará con vehículos que viajan en dirección opuesta.
  id: 226
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera helada
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 227
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache o tope en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 228
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está roja o amarilla. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 229
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 230
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce o una intersección de 4 vías más
    adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 231
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que ingresa por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que ingresa por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 232
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se unen
    B: Un carril termina
    C: Se agrega un carril nuevo — no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que ingresa desde la rampa
    tiene su propio carril nuevo.
  id: 233
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Parar o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 234
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: A cualquier persona por menos de 15 minutos
    B: Solo a personas de la tercera edad
    C: Solo a vehículos que muestren un cartel o placa de discapacidad válida
    D: A cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de una silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de estacionamiento para discapacitados válida pueden estacionar
    en estos espacios. Las infracciones conllevan multas severas.
  id: 235
