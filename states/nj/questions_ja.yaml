questions:
- id: 1
  category: license_system
  question: ニュージャージー州の運転者が自動車を運転する際、携帯しなければならないものは何ですか？
  choices:
    A: 有効な運転免許証のみ
    B: 有効な運転免許証、有効な保険証、および車両登録証
    C: 有効な運転免許証と車両登録証のみ
    D: 有効な運転免許証と住所証明書
  answer: B
  explanation: 運転者は、有効な運転免許証（または仮免許証）、有効な保険証、および車両登録証を携帯しなければなりません。（N.J.S.A. 39:3-29）
- id: 2
  category: license_system
  question: 運転者が住所変更をした場合、どれくらいの期間内にMVC（自動車委員会）に報告しなければなりませんか？
  choices:
    A: 30日以内
    B: 2週間以内
    C: 1週間以内
    D: 60日以内
  answer: C
  explanation: 住所を変更した運転者は、引っ越し後1週間以内にMVCにその変更を報告しなければなりません。（N.J.S.A. 39:3-36）
- id: 3
  category: license_system
  question: 運転者が法的な氏名変更をした場合、どれくらいの期間内にMVCに報告しなければなりませんか？
  choices:
    A: 1週間以内
    B: 2週間以内
    C: 30日以内
    D: 60日以内
  answer: B
  explanation: 法的に氏名を変更した運転者は、2週間以内にMVCにその変更を報告しなければなりません。（N.J.S.A. 39:3-9a）
- id: 4
  category: license_system
  question: 有効な他州の運転免許証を持つ運転者がニュージャージー州に引っ越した場合、どれくらいの期間内にニュージャージー州の免許証を申請しなければなりませんか？
  choices:
    A: 30日以内
    B: 90日以内
    C: 60日以内、または現在の免許証の有効期限が切れる前のいずれか早い方
    D: 1年以内
  answer: C
  explanation: 他州の運転者は、60日以内、または現在の免許証の有効期限が切れる前のいずれか早い方までに申請しなければなりません。CDL（商用運転免許証）所持者は30日以内です。（N.J.S.A.
    39:3-17.1）
- id: 5
  category: license_system
  question: ニュージャージー州の運転免許証の有効期間はどれくらいですか？
  choices:
    A: 2年
    B: 4年
    C: 5年
    D: 6年
  answer: B
  explanation: ニュージャージー州の運転免許証の有効期間は4年です。
- id: 6
  category: license_system
  question: ニュージャージー州で特別仮免許証（Special Learner Permit）を取得するための最低年齢は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 17歳
    D: 18歳
  answer: B
  explanation: 特別仮免許証は、GDL（段階的運転免許）オプションAに基づき、16歳で取得できます。
- id: 7
  category: license_system
  question: GDLプログラムにおいて、路上試験の前に必要な運転練習時間は何時間ですか？
  choices:
    A: 25時間（うち夜間5時間を含む）
    B: 30時間（うち夜間10時間を含む）
    C: 50時間（うち夜間10時間を含む）
    D: 40時間（うち夜間15時間を含む）
  answer: C
  explanation: GDL仮免許証の所持者は、夜間10時間を含む最低50時間の運転練習を完了しなければなりません。
- id: 8
  category: license_system
  question: 21歳未満のGDL仮免許証および試用免許証（probationary license）所持者の運転時間制限は何ですか？
  choices:
    A: 午後10時から午前6時までは運転禁止
    B: 午後11時1分から午前5時までは運転禁止
    C: 深夜0時から午前5時までは運転禁止
    D: 午後9時から午前6時までは運転禁止
  answer: B
  explanation: 21歳未満のGDL仮免許証および試用免許証所持者は、午後11時1分から午前5時までの間は運転できません。
- id: 9
  category: license_system
  question: 21歳未満のGDL運転者に対する携帯電話に関する要件は何ですか？
  choices:
    A: ハンズフリー機器のみ使用できる
    B: 手持ち式またはハンズフリーの携帯電話、およびその他の電子機器は一切使用できない
    C: 緊急時にのみ携帯電話を使用できる
    D: 赤信号の時にのみテキスト送信ができる
  answer: B
  explanation: GDL所持者は、運転中に手持ち式またはハンズフリーの携帯電話、およびその他の電子機器を使用することはできません。
- id: 10
  category: license_system
  question: GDLステッカー（decals）はいくつ、どこに表示しなければなりませんか？
  choices:
    A: 後部のナンバープレートに1枚
    B: 車両の両側面に1枚ずつ、計2枚
    C: 前部のナンバープレートの左上と後部のナンバープレートの左上に1枚ずつ、計2枚
    D: 後部窓に2枚
  answer: C
  explanation: 視認できる赤い反射ステッカーを2枚表示しなければなりません。1枚は前部のナンバープレートの左上隅に、もう1枚は後部のナンバープレートの左上隅に貼ります。
- id: 11
  category: license_system
  question: GDL（段階的運転免許）仮免許所持者を同乗者として監督するための最低年齢は何歳ですか？
  choices:
    A: 有効なニュージャージー州の運転免許証を持つ18歳
    B: 有効なニュージャージー州の運転免許証を持ち、最低3年の運転経験がある21歳
    C: 有効なニュージャージー州の運転免許証を持つ25歳
    D: ニュージャージー州の運転免許証を持つすべての運転手
  answer: B
  explanation: 監督する運転手は21歳以上であり、有効なニュージャージー州の運転免許証を所持し、最低3年間の運転経験がなければなりません。
- id: 12
  category: license_system
  question: 基本免許（basic license）を取得するまでの試用免許（probationary license）の期間はどのくらいですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 18ヶ月
  answer: B
  explanation: 試用免許の所持者は、基本免許を取得する前に、監督者なしでの運転を少なくとも1年間練習しなければなりません。
- id: 13
  category: license_system
  question: ニュージャージー州の運転免許証には、何ポイント分の身分証明（ID verification）が必要ですか？
  choices:
    A: 4ポイント
    B: 5ポイント
    C: 6ポイント
    D: 8ポイント
  answer: C
  explanation: すべての申請者は、6ポイント分の身分証明を提示しなければなりません。
- id: 14
  category: license_system
  question: 他国の有効な運転免許証を持つ運転手は、ニュージャージー州で最大どのくらいの期間運転できますか？
  choices:
    A: 30日
    B: 60日
    C: 6ヶ月
    D: 1年
  answer: D
  explanation: 他国の有効な運転免許証を持つ運転手は、その免許証で最大1年間運転することができます。（N.J.A.C. 13:21-8.2(f)）
- id: 15
  category: license_system
  question: 運転免許証を改ざんする、または改ざんされた免許証を提示した場合の罰則は何ですか？
  choices:
    A: 警告
    B: 100ドルの罰金
    C: 運転特権の喪失、最大1,000ドルの罰金、および/または禁錮刑
    D: 社会奉仕活動のみ
  answer: C
  explanation: 運転免許証を改ざんする、または改ざんされたものを提示すると、運転特権の喪失、最大1,000ドルの罰金、および/または禁錮刑が科される可能性があります。
- id: 16
  category: license_system
  question: GDLのオプションC（成人向けルート：Adult Road）の場合、最低年齢と監督下での練習期間はどのくらいですか？
  choices:
    A: 18歳、6ヶ月の監督下での運転
    B: 21歳、3ヶ月の監督下での運転
    C: 21歳、6ヶ月の監督下での運転
    D: 25歳、1ヶ月の監督下での運転
  answer: B
  explanation: GDLのオプションCでは、最低年齢が21歳であり、少なくとも3ヶ月の監督下での運転練習が必要です。
- id: 17
  category: driver_testing
  question: ニュージャージー州MVCの学科試験（knowledge test）に合格するには、どのくらいのスコアが必要ですか？
  choices:
    A: 70%（50問中35問正解）
    B: 75%（50問中37問正解）
    C: 80%（50問中40問正解）
    D: 90%（50問中45問正解）
  answer: C
  explanation: 80パーセント、つまり50問中40問に正解する必要があります。
- id: 18
  category: driver_testing
  question: 基本免許の申請者に必要な最低視力の要件は何ですか？
  choices:
    A: 視力20/20
    B: 視力20/40
    C: 矯正レンズの有無にかかわらず視力20/50
    D: 視力20/70
  answer: C
  explanation: 基本免許の申請者は、矯正レンズの有無にかかわらず20/50の視力が必要です。
- id: 19
  category: driver_testing
  question: CDL（商用運転免許）の申請者に必要な最低視力の要件は何ですか？
  choices:
    A: 両眼で20/50
    B: 矯正レンズの有無にかかわらず両眼で20/40
    C: 両眼で20/20
    D: 片眼で20/30
  answer: B
  explanation: CDLの申請者は、矯正レンズの有無にかかわらず両眼で20/40の視力があり、さらに赤、緑、黄色の光を識別できる能力が必要です。
- id: 20
  category: driver_testing
  question: ニュージャージー州MVCの学科試験は何問ありますか？
  choices:
    A: 25問
    B: 40問
    C: 50問と臓器提供に関するアンケート1問
    D: 100問
  answer: C
  explanation: 学科試験は50問の質問と、臓器提供に関するアンケート1問で構成されています。
- id: 21
  category: driver_responsibility
  question: ニュージャージー州のシートベルト着用義務法において、18歳未満の同乗者にシートベルトを着用させる責任は誰にありますか？
  choices:
    A: 同乗者自身
    B: 運転手
    C: 親（車内にいなくても）
    D: 誰にもない（未成年者の着用は任意）
  answer: B
  explanation: 18歳未満のすべての同乗者にシートベルトを着用させる責任は、運転手にあります。
- id: 22
  category: driver_responsibility
  question: シートベルトを着用することで、衝突事故での生存率は何パーセント向上しますか？
  choices:
    A: 30パーセント
    B: 45パーセント
    C: 60パーセント
    D: 80パーセント
  answer: C
  explanation: シートベルトを着用することで、衝突事故での生存率は60パーセント向上します。
- id: 23
  category: driver_responsibility
  question: 後部座席に乗車しなければならないのは、何歳未満の子供ですか？
  choices:
    A: 5歳
    B: 6歳
    C: 8歳
    D: 10歳
  answer: C
  explanation: 8歳未満のすべての子供は、後部座席に乗車しなければなりません。
- id: 24
  category: driver_responsibility
  question: 2歳未満または体重30ポンド未満の子供は、何に乗車しなければなりませんか？
  choices:
    A: 前向きのチャイルドシート
    B: ブースターシート（学童用シート）
    C: 5点式ハーネス付きの後ろ向きチャイルドシート
    D: 通常のシートベルト
  answer: C
  explanation: 2歳未満および体重30ポンド未満の子供は、連邦政府に承認された5点式ハーネス付きの後ろ向きチャイルドシートに乗車しなければなりません。
- id: 25
  category: driver_responsibility
  question: ステアリングホイール（ハンドル）の正しい手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置
    C: 8時と4時の位置
    D: 片手で12時の位置
  answer: B
  explanation: 運転手は、親指をハンドルの表面に沿わせながら、9時と3時の位置でステアリングホイールを握る必要があります。
- id: 26
  category: driver_responsibility
  question: 時速20マイル（20 mph）で走行している場合、運転手はどのくらいの距離で停止できなければなりませんか？
  choices:
    A: 15フィート
    B: 25フィート
    C: 35フィート
    D: 50フィート
  answer: B
  explanation: 運転手は、時速20マイル（20 mph）のとき、25フィート以内で停止できなければなりません。
- id: 27
  category: driver_responsibility
  question: 曲がる前に、どのくらい手前から方向指示器（ウィンカー）を出さなければなりませんか？
  choices:
    A: 50フィート
    B: 75フィート
    C: 100フィート
    D: 200フィート
  answer: C
  explanation: 運転手は、曲がる少なくとも100フィート手前で方向指示器を出さなければなりません。（N.J.S.A. 39:4-126）
- id: 28
  category: driver_responsibility
  question: 右折の正しい手信号（ハンドシグナル）はどれですか？
  choices:
    A: 手と腕をまっすぐ横に出す
    B: 手と腕を上に向ける
    C: 手と腕を下に向ける
    D: 手を振る動作
  answer: B
  explanation: 右折：手と腕を上に向ける。左折：手と腕をまっすぐ横に出す。停止：手と腕を下に向ける。
- id: 29
  category: driver_responsibility
  question: 縁石のある上り坂に駐車する場合、前輪はどちらの方向に向けなければなりませんか？
  choices:
    A: 縁石の方向
    B: 縁石とは反対の方向
    C: まっすぐ前
    D: どちらでもよい
  answer: B
  explanation: 上り坂に駐車する場合、前輪は縁石とは反対の方向に向けなければなりません。
- id: 30
  category: driver_responsibility
  question: 縁石のある下り坂に駐車する場合、前輪はどちらの方向に向けなければなりませんか？
  choices:
    A: 縁石の方向
    B: 縁石とは反対の方向
    C: まっすぐ前
    D: どちらでもよい
  answer: A
  explanation: 下り坂に駐車する場合、前輪は縁石の方向に向けなければなりません。
- id: 31
  category: driver_responsibility
  question: 縦列駐車をする際、車のタイヤから縁石までの最大距離はどれくらいですか？
  choices:
    A: 12インチ
    B: 6インチ
    C: 18インチ
    D: 3インチ
  answer: B
  explanation: 縦列駐車をする際、車のタイヤは縁石から6インチ以内でなければなりません。
- id: 32
  category: driver_responsibility
  question: ニュージャージー州法により、車のアイドリングは何分までに制限されていますか？
  choices:
    A: 1分
    B: 3分
    C: 5分
    D: 10分
  answer: B
  explanation: ニュージャージー州法では、すべての運転手に対し、車のアイドリングを3分以下に制限することが義務付けられています。（N.J.A.C. 7:27-15.8）
- id: 33
  category: driver_responsibility
  question: 運転前に車から雪や氷を取り除かなかった場合の罰金はいくらですか？
  choices:
    A: $10から$25
    B: $25から$75
    C: $100から$500
    D: $500から$1,000
  answer: B
  explanation: 雪や氷が落下したかどうかにかかわらず、$25から$75の罰金が適用されます。落下した雪や氷が怪我や器物損壊を引き起こした場合、最大$1,500の罰金が科せられる可能性があります。
- id: 34
  category: driver_responsibility
  question: ダッシュボードやフロントガラスに衝突した際の衝撃が、3階建ての建物から転落した時と同じになるのは、どの速度ですか？
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: 30 mphでダッシュボードやフロントガラスに衝突することは、3階建ての建物の屋上から転落するのと同じ衝撃です。
- id: 35
  category: driver_responsibility
  question: エアバッグは最大でどのくらいの速度で膨らみますか？
  choices:
    A: 50 mph
    B: 100 mph
    C: 150 mph
    D: 200 mph
  answer: D
  explanation: エアバッグは最大200 mphの速度で膨らみます。
- id: 36
  category: driver_responsibility
  question: 運転手はハンドルから最低どれくらいの距離を離して座るべきですか？
  choices:
    A: 6インチ
    B: ハンドルの中心から胸骨の中心まで10インチ
    C: 12インチ
    D: 18インチ
  answer: B
  explanation: 運転手は、ハンドルの中心と胸骨の中心との間に少なくとも10インチの距離を保つ必要があります。
- id: 37
  category: driver_responsibility
  question: 後退（バック）する際、車はどのくらいの速度で走行するべきですか？
  choices:
    A: 5〜10 mph
    B: 歩行速度（2〜4 mph）
    C: 10〜15 mph
    D: 20 mph未満
  answer: B
  explanation: 車を後退させる際は、ゆっくりと（通常は歩行速度である2〜4 mphで）運転する必要があります。
- id: 38
  category: driver_responsibility
  question: 路上試験では、運転手は後退（バック）でどれくらいの距離を走行できなければなりませんか？
  choices:
    A: 50フィート
    B: 75フィート
    C: 100フィート
    D: 200フィート
  answer: C
  explanation: 路上試験では、運転手は車を直線で約100フィート後退させるよう求められます。
- id: 39
  category: driver_responsibility
  question: 安全なタイヤの最小トレッド（溝）の深さはどれくらいですか？
  choices:
    A: 1/8インチ
    B: 1/16インチ
    C: 1/4インチ
    D: 1/32インチ
  answer: B
  explanation: トレッドの深さが1/16インチ（ペニー硬貨の縁くらい）未満のタイヤで車を運転してはいけません。
- id: 40
  category: driver_responsibility
  question: 通常の状況下で、クラクションは少なくともどれくらいの距離まで聞こえる必要がありますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 通常の状況下では、クラクションは少なくとも200フィート先まで聞こえる必要があります。（N.J.S.A. 39:3-69）
- id: 41
  category: safe_driving_rules
  question: スクールゾーン、商業地域、または住宅街での制限速度はどれくらいですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: スクールゾーン、商業地域、または住宅街では25 mphです。
- id: 42
  category: safe_driving_rules
  question: 郊外の商業地域および住宅街での制限速度はどれくらいですか？
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: C
  explanation: 郊外の商業地域および住宅街では35 mphです。
- id: 43
  category: safe_driving_rules
  question: 標識のない田舎道（地方道路）での制限速度はどれくらいですか？
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: C
  explanation: 標識のない田舎道（地方道路）では50 mphです。
- id: 44
  category: safe_driving_rules
  question: 制限速度65 mphを10 mph以上超過した場合、罰金はどうなりますか？
  choices:
    A: 3倍になる
    B: 2倍になる
    C: 追加で100ドル加算される
    D: 特に変わらない
  answer: B
  explanation: 制限速度65 mphを10 mph以上超過した場合、運転手は2倍の罰金を支払います。(N.J.S.A. 39:4-98.6)
- id: 45
  category: safe_driving_rules
  question: 右側からの追い越しが許可されるのはどのような場合ですか？
  choices:
    A: 決して許可されない
    B: 同一方向に複数の車線がある道路、または前方の車両が左折しようとしており、右側に十分なスペースがある場合のみ
    C: 高速道路ではいつでも許可される
    D: 路肩でのみ許可される
  answer: B
  explanation: 右側からの追い越しは、同一方向に複数の車線がある道路、または前方の車両が左折しようとしており、右側に十分なスペースがある場合のみ許可されます。右側の路肩を使って追い越しをしてはいけません。
- id: 46
  category: safe_driving_rules
  question: 2本の実線の中央線（ダブルソリッドライン）は何を意味しますか？
  choices:
    A: 注意して追い越しができる
    B: どちらの側からでも追い越しができる
    C: どちらの方向からも追い越しは禁止されている
    D: トラックのみ追い越しができる
  answer: C
  explanation: 両方の中央線が実線の場合、追い越しは禁止されています。
- id: 47
  category: safe_driving_rules
  question: 多方向一時停止（マルチウェイストップ）の交差点で、2台の車が同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の運転手
    B: 右側の運転手
    C: 直進する運転手
    D: 右折する運転手
  answer: B
  explanation: 多方向一時停止の交差点で同時に到着した場合、運転手は右側の車に道を譲らなければなりません。
- id: 48
  category: safe_driving_rules
  question: 停電により信号機が作動していない場合、どのように対処すべきですか？
  choices:
    A: 譲れ（Yield）の標識として扱う
    B: 注意信号として扱う
    C: 4方向一時停止（4-way stop）として扱う
    D: 青信号であるかのように扱う
  answer: C
  explanation: 停電により信号機が点灯していない場合は、4方向一時停止（4-way stop）の信号として扱います。(N.J.S.A. 39:4-81)
- id: 49
  category: safe_driving_rules
  question: ニュージャージー州では、赤信号での右折は合法ですか？
  choices:
    A: いいえ、決して合法ではない
    B: はい。「赤信号右折禁止（No Turn on Red）」の標識がない限り、完全に一時停止し、交通状況を確認した後であれば合法である
    C: はい。道が空いていれば一時停止せずに右折できる
    D: 高速道路でのみ合法である
  answer: B
  explanation: ニュージャージー州の法律では、「赤信号右折禁止（No Turn on Red）」の標識がない限り、完全に一時停止し、交通状況を確認した後の赤信号での右折が認められています。(N.J.S.A.
    39:4-115)
- id: 50
  category: safe_driving_rules
  question: 赤いランプを点滅させているスクールバスに近づいた場合、運転手は何をしなければなりませんか？
  choices:
    A: 25 mphに減速し、注意して進む
    B: 少なくとも25フィート手前で停止する
    C: 少なくとも15フィート手前で停止する
    D: 10 mphに減速して進む
  answer: B
  explanation: 州法により、運転手は赤いランプを点滅させているスクールバスから少なくとも25フィート手前で停止することが義務付けられています。(N.J.S.A.
    39:4-128.1)
- id: 51
  category: safe_driving_rules
  question: スクールバスが学校の真ん前に停車している場合、運転者は時速何マイル以下で追い越すことができますか？
  choices:
    A: 時速5マイル (5 mph)
    B: 時速10マイル (10 mph)
    C: 時速15マイル (15 mph)
    D: 時速25マイル (25 mph)
  answer: B
  explanation: スクールバスが学校の真ん前に停車している場合、運転者はいずれの方向からも時速10マイル以下の速度で追い越すことができます。
- id: 52
  category: safe_driving_rules
  question: 警報機が作動している場合、運転者は踏切からどのくらい離れた位置で停止しなければなりませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 25フィート
    D: 50フィート
  answer: B
  explanation: 赤い点滅灯、鳴り響くベル、または遮断機が下りている（あるいは下りようとしている）場合、運転者は踏切から少なくとも15フィート手前で停止しなければなりません。（N.J.S.A.
    39:4-127.1）
- id: 53
  category: safe_driving_rules
  question: 運転者は緊急車両からどのくらい後方を維持しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: 運転者は、サイレンやランプを作動させている緊急車両から少なくとも300フィート後方を維持する必要があります。（N.J.S.A. 39:4-92）
- id: 54
  category: safe_driving_rules
  question: ヘッドライトはいつ使用しなければなりませんか？
  choices:
    A: 日没後のみ
    B: 日没の30分後から日の出の30分前まで、視界が500フィート以下の場合、またはワイパーを使用している場合
    C: 完全に暗くなった時のみ
    D: 雨天時のみ
  answer: B
  explanation: ヘッドライトは、日没の30分後から日の出の30分前まで、視界が500フィート以下の場合、およびワイパーを使用している場合に使用しなければなりません。（N.J.S.A.
    39:3-46）
- id: 55
  category: safe_driving_rules
  question: 消火栓からどのくらいの距離での駐車が禁止されていますか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 15フィート
    D: 25フィート
  answer: B
  explanation: 消火栓から10フィート以内での駐車は禁止されています。（N.J.S.A. 39:4-138）
- id: 56
  category: safe_driving_rules
  question: 交差点の横断歩道からどのくらいの距離での駐車が禁止されていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 25フィート
    D: 50フィート
  answer: C
  explanation: 交差点の横断歩道から25フィート以内での駐車は禁止されています。（N.J.S.A. 39:4-138）
- id: 57
  category: safe_driving_rules
  question: 一時停止標識（止まれの標識）からどのくらいの距離での駐車が禁止されていますか？
  choices:
    A: 25フィート
    B: 35フィート
    C: 50フィート
    D: 75フィート
  answer: C
  explanation: 一時停止標識から50フィート以内での駐車は禁止されています。（N.J.S.A. 39:4-138）
- id: 58
  category: safe_driving_rules
  question: 踏切からどのくらいの距離での駐車が禁止されていますか？
  choices:
    A: 25フィート
    B: 35フィート
    C: 50フィート
    D: 75フィート
  answer: C
  explanation: 踏切から50フィート以内での駐車は禁止されています。（N.J.S.A. 39:4-138）
- id: 59
  category: safe_driving_rules
  question: 消防署の出入口（ドライブウェイ）からどのくらいの距離での駐車が禁止されていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 25フィート
  answer: C
  explanation: 消防署の出入口から20フィート以内、および消防署の出入口の反対側の道路では75フィート以内での駐車が禁止されています。
- id: 60
  category: safe_driving_rules
  question: 車両を縁石から何インチ以上離して駐車することは違法ですか？
  choices:
    A: 3インチ
    B: 6インチ
    C: 12インチ
    D: 18インチ
  answer: B
  explanation: 車両を縁石から6インチ以上離して駐車することは違法です。（N.J.S.A. 39:4-135）
- id: 61
  category: safe_driving_rules
  question: 運転中の手持ち携帯電話の使用による初回違反の罰金はいくらですか？
  choices:
    A: $100～$200
    B: $200～$400
    C: $400～$600
    D: $600～$800
  answer: B
  explanation: 初回違反の罰金は$200～$400です。2回目の違反は$400～$600、3回目の違反は$600～$800です。（N.J.S.A. 39:4-97.3）
- id: 62
  category: safe_driving_rules
  question: ムーブ・オーバー法（Move Over law：車線変更義務）では何が義務付けられていますか？
  choices:
    A: すべての車両に対して車線を譲ること
    B: 停車中の緊急車両、レッカー車、または故障車から離れた車線に変更すること。車線変更が不可能な場合は減速すること
    C: 常に右側の車線に移動すること
    D: 合流してくる交通に道を譲ること
  answer: B
  explanation: ムーブ・オーバー法により、運転者は停車中の緊急車両から離れた車線に変更するか、車線変更が不可能な場合は減速することが義務付けられています。罰金：$100～$500。（N.J.S.A.
    39:4-92.2）
- id: 63
  category: safe_driving_rules
  question: 活動中の消防車両から何フィート以内に駐車してはいけませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 運転者は、活動中の消防車両から200フィート以内に駐車してはいけません。
- id: 64
  category: safe_driving_rules
  question: 赤いライトを点滅させているアイスクリーム販売車（frozen dessert truck）に近づく際、運転者はどうしなければなりませんか？
  choices:
    A: 時速25マイルに減速する
    B: 一時停止し、時速15マイル以下の速度で通り過ぎる
    C: 一時停止し、時速10マイル以下の速度で通り過ぎる
    D: 歩行者に道を譲るだけでよい
  answer: B
  explanation: 運転者は一時停止し、横断する人に道を譲り、子供に注意しながら、時速15マイル以下の速度で通り過ぎなければなりません。（N.J.S.A.
    39:4-128.4）
- id: 65
  category: safe_driving_rules
  question: 横断歩道にいる歩行者のために一時停止しなかった場合の罰則は何ですか？
  choices:
    A: 最高$200の罰金および2点の違反点数
    B: 最高$500の罰金、最長25日の拘留、社会奉仕活動、最長6ヶ月の免許停止、および2点の違反点数
    C: $100の罰金のみ
    D: 警告のみ
  answer: B
  explanation: 一時停止を怠った場合、最高$500の罰金、最長25日の拘留、社会奉仕活動、最長6ヶ月の免許停止、および2点の違反点数が科せられます。（N.J.S.A.
    39:4-36）
- id: 66
  category: safe_driving_rules
  question: 交通信号や標識を避けるために私有地を走行することは：
  choices:
    A: 安全に行われれば合法である
    B: 自動車の交通違反である
    C: 住宅街でのみ違法である
    D: 緊急時には許可される
  answer: B
  explanation: 交通信号や標識を避けるために私有地を走行することは、自動車の交通違反となります。（N.J.S.A. 39:4-66.2）
- id: 67
  category: safe_driving_rules
  question: ニュージャージー州法では、車両のどの窓に後付けのカーフィルム（tinting）を貼ることを禁止していますか？
  choices:
    A: 後部窓（リアウィンドウ）のみ
    B: すべての窓
    C: フロントガラスおよび前部側面の窓
    D: 運転席側の窓のみ
  answer: C
  explanation: ニュージャージー州法では、フロントガラスおよび前部側面の窓に後付けのカーフィルムを貼ることを禁止しています。（N.J.S.A. 39:3-74）
- id: 68
  category: safe_driving_rules
  question: 安全地帯（safety island）のある分割された幹線道路（dual-lane highway）で、反対車線にスクールバスがいる場合、運転者はどうするべきですか？
  choices:
    A: 完全に停止する
    B: 時速10マイルに減速する
    C: 制限速度のまま走行を続ける
    D: 時速25マイルに減速する
  answer: B
  explanation: 分割された幹線道路を走行中、安全地帯または盛り上がった中央分離帯の反対側にスクールバスがいる場合、運転者は時速10マイルに減速する必要があります。
- id: 69
  category: safe_driving_rules
  question: 交差点に近づいて停止する際、運転者はどこで停止しなければなりませんか？
  choices:
    A: 最寄りの横断歩道から10フィート以内
    B: 最寄りの横断歩道または停止線から5フィート以内
    C: 交差点から少なくとも15フィート手前
    D: 停止線、または交差点の25フィート手前
  answer: B
  explanation: 運転者は、最寄りの横断歩道または停止線から5フィート以内で車両を完全に停止させなければなりません。
- id: 70
  category: defensive_driving
  question: 3秒プラスのルール（three-second-plus rule）とは何ですか？
  choices:
    A: 車線変更の前に3秒先を見る
    B: 信号が青に変わってから3秒待って進む
    C: 前方の車両との間に少なくとも3秒の車間距離を保つ
    D: 曲がる3秒前に合図を出す
  answer: C
  explanation: 前方の固定された目標物を選びます。前の車がその目標物を通過してから、自分の車が同じ目標物を通過するまでに少なくとも3秒かかれば、急停止に十分な車間距離が保たれています。
- id: 71
  category: defensive_driving
  question: 悪天候の場合、3秒間の車間距離ルール（three-second following rule）は何秒に増やすべきですか？
  choices:
    A: 3秒
    B: 4秒以上
    C: 2秒
    D: ちょうど6秒
  answer: B
  explanation: 悪天候の間は、車間距離の時間を4秒以上に増やす必要があります。
- id: 72
  category: defensive_driving
  question: 車間距離に関する経験則（一般的な目安）は次のうちどれですか？
  choices:
    A: 時速10マイル（10 mph）につき車2台分
    B: 時速10マイル（10 mph）につき車1台分（約20フィート）
    C: 時速20マイル（20 mph）につき車1台分
    D: すべての速度において車3台分
  answer: B
  explanation: 最もよく使われる経験則は、時速10マイル（10 mph）ごとに車1台分（約20フィート）の車間距離を保つことです。
- id: 73
  category: defensive_driving
  question: 通常の昼間の条件下で、時速60マイル（60 mph）での総停止距離はどれくらいですか？
  choices:
    A: 247フィート
    B: 302フィート
    C: 343フィート
    D: 409フィート
  answer: C
  explanation: 時速60マイル（60 mph）の場合：空走距離（66フィート）＋ 制動距離（277フィート）＝ 総停止距離 343フィートとなります。
- id: 74
  category: defensive_driving
  question: 車両が時速60マイル（60 mph）で走行している場合、1秒間に何フィート進みますか？
  choices:
    A: 44フィート
    B: 66フィート
    C: 88フィート
    D: 110フィート
  answer: C
  explanation: 車両は時速60マイル（60 mph）で走行時、1秒間に88フィート進みます。
- id: 75
  category: defensive_driving
  question: ハイドロプレーニング現象はどの速度から起こり始めますか？
  choices:
    A: 時速25マイル（25 mph）
    B: 時速35マイル（35 mph）
    C: 時速45マイル（45 mph）
    D: 時速55マイル（55 mph）
  answer: B
  explanation: 濡れた路面では、時速約35マイル（35 mph）からタイヤのハイドロプレーニング現象が起こる可能性があります。時速55マイル（55 mph）を超えると、タイヤが完全に路面から浮いてしまうことがあります。
- id: 76
  category: defensive_driving
  question: スキッド（横滑り）を起こした場合、運転者はどうするべきですか？
  choices:
    A: ブレーキを急激に踏み込む
    B: スキッドしている方向とは逆の方向にハンドルを切る
    C: ハンドルを切りすぎないように注意しながら、車両の後部がスキッドしている方向にハンドルを切る
    D: 加速する
  answer: C
  explanation: スピンを避けるため、運転者はハンドルを切りすぎないように注意しながら、車両の後部がスキッドしている方向にハンドルを切る必要があります。進みたい方向を見るようにしてください。
- id: 77
  category: defensive_driving
  question: ハイウェイ・ヒプノシス（高速道路催眠現象）の原因は何ですか？
  choices:
    A: スピードの出しすぎ
    B: 長時間の運転中に、一つのものを数秒以上見つめ続けること
    C: 窓を閉め切って運転すること
    D: 大音量の音楽
  answer: B
  explanation: ハイウェイ・ヒプノシスは、一つのものを数秒以上見つめ続けないようにすることで防ぐことができます。2時間ごとに休憩を取りましょう。
- id: 78
  category: defensive_driving
  question: マギーズ法（Maggie's Law）とは何ですか？
  choices:
    A: 携帯電話に関する運転法
    B: 疲労状態での運転を、車両による殺人罪（vehicular homicide statute）における無謀運転とみなす法律
    C: シートベルト着用法
    D: 制限速度に関する法律
  answer: B
  explanation: マギーズ法は、睡眠不足により運転能力が低下していることを知りながら運転することを違法とし、疲労状態での運転を車両による殺人罪における無謀運転と定めています。（N.J.S.A.
    2C:11-5）
- id: 79
  category: defensive_driving
  question: 車両の車輪が路肩にそれてしまった場合、運転者はどうするべきですか？
  choices:
    A: すぐに舗装路に戻るようにハンドルを切る
    B: 路肩にとどまり、アクセルを緩めて時速25マイル（25 mph）以下に減速してから、ハンドルを4分の1回転させて道路に戻る
    C: ブレーキを急激に踏み込む
    D: 加速して道路に戻る
  answer: B
