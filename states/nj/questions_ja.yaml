- id: 126
  category: sharing_the_road
  question: 安全追い越し法（Safe Passing Law）では、単車線の道路で自転車を追い越す際、運転者は少なくともどのくらいの間隔を空けることが義務付けられていますか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 6フィート
  answer: C
  explanation: 単車線の道路では、運転者は交通弱者を追い越す際に少なくとも4フィートの安全地帯を確保しなければなりません。(N.J.S.A. 39:4-92.4)
- id: 127
  category: sharing_the_road
  question: 追い越しのための4フィートの間隔が確保できない場合、運転者はどうしなければなりませんか？
  choices:
    A: クラクションを鳴らして素早く追い越す
    B: 時速25マイルまで減速し、安全に追い越せるようになるまで停止する準備をする
    C: 自転車が移動するまで完全に停止する
    D: 路肩を走行する
  answer: B
  explanation: 4フィートの間隔が確保できない場合、運転者は時速25マイルまで減速し、安全に追い越せるようになるまで停止する準備をしなければなりません。
- id: 128
  category: sharing_the_road
  question: 交通の流れに再合流しようとしている場合、常に優先権を譲らなければならないのはどの車両に対してですか？
  choices:
    A: パトカーのみ
    B: バスおよび郵便車両
    C: タクシーおよびライドシェア車両
    D: トラックのみ
  answer: B
  explanation: 運転者は、バスや郵便車両が交通の流れに再合流する際、それらに道を譲らなければなりません。
- id: 129
  category: sharing_the_road
  question: オートバイ事故の最も一般的な原因は何ですか？
  choices:
    A: オートバイ運転者のスピード違反
    B: 劣悪な道路状況
    C: 自動車の運転者が交通の中でオートバイを発見・認識できないこと
    D: 機械的故障
  answer: C
  explanation: 自動車の運転者が交通の中でオートバイを発見・認識できないことが、オートバイ事故の最も一般的な原因です。
- id: 130
  category: sharing_the_road
  question: 悪天候時、トラックが停止するまでにどれくらい余分に時間がかかることがありますか？
  choices:
    A: 10%長くかかる
    B: 25%長くかかる
    C: 50%長くかかる
    D: 75%長くかかる
  answer: B
  explanation: 悪天候時には、トラック、トラクタートレーラー、またはバスが停止するまでに最大25%長く時間がかかることがあります。
- id: 131
  category: sharing_the_road
  question: 大型トラックの後方にあるノーゾーン（死角）はどのくらいの距離ですか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: C
  explanation: トラックの後方のノーゾーンは、最大200フィートまで及ぶことがあります。
- id: 132
  category: sharing_the_road
  question: 白または金属製の杖を使用している人に近づいた際、運転者が停止しなければならない理由は次のうちどれですか？
  choices:
    A: 礼儀だから
    B: その人が視覚障害者であり、法律で義務付けられているから
    C: その人が高齢者だから
    D: 推奨されているが義務ではないから
  answer: B
  explanation: 法律により、すべての運転者は、白または金属製の杖を使用している、または盲導犬を伴っている視覚障害者のために停止することが義務付けられています。（N.J.S.A.
    39:4-37.1）
- id: 133
  category: sharing_the_road
  question: 車両の速度が何mphから何mphに上がると、歩行者の死亡率は5%から85%に跳ね上がりますか？
  choices:
    A: 15 mphから35 mph
    B: 20 mphから40 mph
    C: 25 mphから45 mph
    D: 30 mphから50 mph
  answer: B
  explanation: 車両と歩行者の衝突事故における死亡率は、20 mphでは5%ですが、40 mphになると85%に跳ね上がります。
- id: 134
  category: sharing_the_road
  question: 多車線道路の横断歩道で停止する場合、横断歩道の約どのくらい手前で停止すべきですか？
  choices:
    A: 10フィート
    B: 20フィート
    C: 30フィート
    D: 50フィート
  answer: C
  explanation: 隣の車線（第2車線）の運転者の視界を遮らないようにするため、多車線道路の横断歩道では約30フィート手前で停止してください。
- id: 135
  category: sharing_the_road
  question: 乗馬している人に近づく際、運転者は速度をどのくらいまで落とさなければなりませんか？
  choices:
    A: 10 mph以下
    B: 15 mph以下
    C: 25 mph以下
    D: 35 mph以下
  answer: C
  explanation: 乗馬している人や馬車に近づいたり追い越したりする際、運転者は速度を25 mph以下に落とさなければなりません。（N.J.S.A. 39:4-72）
- id: 136
  category: sharing_the_road
  question: 55 mphで走行している貨物列車が停止するまでに、どのくらいの距離がかかることがありますか？
  choices:
    A: 500フィート
    B: 半マイル
    C: 1マイル以上
    D: 2マイル
  answer: C
  explanation: 55 mphで走行している貨物列車は、停止するまでに1マイル以上の距離がかかることがあります。
- id: 137
  category: sharing_the_road
  question: 踏切からどのくらいの距離以内では、他の車両を追い越してはいけませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: B
  explanation: 踏切から100フィート以内では、他の車両を追い越してはいけません。
- id: 138
  category: sharing_the_road
  question: ニュージャージー州法において、自転車、スケートボード、インラインスケートの利用者はどのような扱いを受けますか？
  choices:
    A: 道路上での権利が制限されている
    B: 自動車と同じ権利と責任を持つ
    C: 常に自動車に道を譲らなければならない
    D: 自転車専用レーンのみを使用できる
  answer: B
  explanation: ニュージャージー州法の下では、自転車、スケートボード、インラインスケートの利用者は、自動車と同じ権利と責任を持っています。
- id: 139
  category: sharing_the_road
  question: モペッド（原動機付自転車）の制限速度は次のうちどれですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: モペッドの運転者は25 mphを超えて運転してはいけません。
- id: 140
  category: sharing_the_road
  question: アンマークド・クロスウォーク（標示のない横断歩道）とは何ですか？
  choices:
    A: ペンキが色あせた横断歩道
    B: ペンキの線で標示されていなくても、すべての交差点に存在する横断歩道
    C: ジェイウォーク（乱横断）エリア
    D: 私有地にある横断歩道
  answer: B
  explanation: 標示がなくても、すべての交差点には横断歩道が存在します。これはアンマークド・クロスウォーク（標示のない横断歩道）として知られています。
- id: 141
  category: vehicle_information
  question: 自動車の自賠責保険（liability insurance）は：
  choices:
    A: ニュージャージー州では任意である
    B: ニュージャージー州では義務である
    C: 新車にのみ義務付けられている
    D: 商用車にのみ義務付けられている
  answer: B
  explanation: ニュージャージー州では、自動車の自賠責保険（liability insurance）は義務付けられています。登録されたすべての車両は保険に加入していなければなりません。（N.J.S.A.
    39:6B-1）
- id: 142
  category: vehicle_information
  question: ニュージャージー州に引っ越してから、どのくらいの期間内に車両の権利書（title）の取得と登録を行わなければなりませんか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 1年
  answer: B
  explanation: 運転者がニュージャージー州に引っ越してきた場合、60日以内、または他州の登録がそれより早く期限切れになる場合はその期限までに、車両の権利書（title）の取得と登録を行わなければなりません。
- id: 143
  category: vehicle_information
  question: 製造年から5年以上経過した乗用車は、どのくらいの頻度で州の車検（state inspection）に合格しなければなりませんか？
  choices:
    A: 毎年
    B: 2年ごと
    C: 3年ごと
    D: 5年ごと
  answer: B
  explanation: 製造年から5年以上経過した乗用車は、2年ごとに州の車検（state inspection）に合格しなければなりません。
- id: 144
  category: vehicle_information
  question: 製造年から5年未満の新しい乗用車に交付されるディーラーステッカーの有効期限はいつですか？
  choices:
    A: 登録から1年後
    B: 登録から2年後
    C: 初回登録から5年後
    D: 登録から3年後
  answer: C
  explanation: 製造年から5年未満の新しい乗用車には、初回登録から5年後に有効期限が切れるステッカーが交付されます。
- id: 145
  category: vehicle_information
  question: ニュージャージー州に引っ越して車両を登録した後、どのくらいの期間内に車検を受けなければなりませんか（製造年から5年以上経過している場合）？
  choices:
    A: 7日
    B: 14日
    C: 30日
    D: 60日
  answer: B
  explanation: 製造年から5年以上経過している車両は、ニュージャージー州で登録してから14日以内に車検を受けなければなりません。
- id: 146
  category: vehicle_information
  question: ナンバープレートは夜間に50フィート離れた場所から見える必要があります。どのくらいの高さに取り付けなければなりませんか？
  choices:
    A: 6インチ以上36インチ未満
    B: 地上から12インチ以上48インチ未満
    C: 18インチ以上60インチ未満
    D: 任意の高さ
  answer: B
  explanation: ナンバープレートは地上から12インチ以上48インチ未満の高さに取り付けなければなりません。（N.J.S.A. 39:3-33）
- id: 147
  category: vehicle_information
  question: 運転者が自動車保険を解約した場合、ナンバープレートはどうしなければなりませんか？
  choices:
    A: 次の車のために保管する
    B: 自動車委員会（MVC）に返却する
    C: 破棄する
    D: 何もしない
  answer: B
  explanation: 運転者が自動車保険を解約した場合、ナンバープレートは自動車委員会（MVC）に返却しなければなりません。
- id: 148
  category: vehicle_information
  question: 文字を隠すようなナンバープレートカバーを使用した場合の罰金はいくらですか？
  choices:
    A: 最高50ドル
    B: 最高100ドル
    C: 最高200ドル
    D: 最高500ドル
  answer: B
  explanation: 文字を隠したり見えなくしたりするナンバープレートカバーやホルダーの使用は違反であり、最高100ドルの罰金が科せられます。
- id: 149
  category: signs_and_signals
  question: 黄色の信号機は何を意味しますか？
  choices:
    A: 通過するためにスピードを上げる
    B: 安全に停止するには近すぎる場合を除き、交差点に入る前に停止する
    C: 注意して進む
    D: 対向車に道を譲る
  answer: B
  explanation: 青信号の後に黄色の信号が点灯した場合、運転者は安全に停止するには近すぎる場合を除き、交差点に入る前に停止しなければなりません。
- id: 150
  category: signs_and_signals
  question: 赤の点滅信号が意味するのは：
  choices:
    A: 道を譲ってから進む
    B: 停止し、安全を確認してから進む
    C: 減速する
    D: 緊急車両が接近している
  answer: B
  explanation: 赤の点滅信号では、完全に停止（complete stop）し、安全を確認してから進む必要があります。
- id: 151
  category: signs_and_signals
  question: 「ステール・グリーン・ライト（stale green light）」とは何を意味しますか？
  choices:
    A: 故障した信号機
    B: しばらく青（緑）のままで、まもなく変わる可能性のある信号
    C: 青の矢印信号
    D: 夜間の青信号
  answer: B
  explanation: ステール・グリーン・ライトとは、しばらく青（緑）のままになっている信号のことです。黄色、そして赤に変わることに備えてください。
- id: 152
  category: signs_and_signals
  question: 破線の中央線が意味するのは次のうちどれですか：
  choices:
    A: 追い越し禁止
    B: 破線がある側からは追い越しが許可されている
    C: 道路が工事中である
    D: 一方通行
  answer: B
  explanation: 片側が破線の中央線：破線がある側からのみ追い越しが許可されています。
- id: 153
  category: signs_and_signals
  question: 警戒標識（warning sign）は何色ですか？
  choices:
    A: 赤色
    B: 緑色
    C: 黄色（ひし形）
    D: 青色
  answer: C
  explanation: 警戒標識は黄色でひし形をしています。
- id: 154
  category: signs_and_signals
  question: 規制標識（一時停止や制限速度など）は何色ですか？
  choices:
    A: 黄色
    B: 白地に黒文字（一時停止やゆずり合いの場合は赤色）
    C: 緑色
    D: 青色
  answer: B
  explanation: 規制標識は通常、白地に黒文字です。一時停止（Stop）標識は赤色です。ゆずり合い（Yield）標識は赤と白です。
- id: 155
  category: signs_and_signals
  question: 一時停止（Stop）標識はどのような形をしていますか？
  choices:
    A: 円形
    B: 正方形
    C: ひし形
    D: 八角形
  answer: D
  explanation: 一時停止標識は八角形であり、この形をした唯一の標識です。
- id: 156
  category: signs_and_signals
  question: ゆずり合い（Yield）標識はどのような形をしていますか？
  choices:
    A: 八角形
    B: 逆三角形
    C: ひし形
    D: 長方形
  answer: B
  explanation: ゆずり合い（Yield）標識は逆三角形をしています。
- id: 157
  category: signs_and_signals
  question: 高速道路の案内/情報標識は何色ですか？
  choices:
    A: 黄色
    B: 白色
    C: 緑色
    D: オレンジ色
  answer: C
  explanation: 緑色の標識は、高速道路にある案内/情報標識で、方向や距離を示しています。
- id: 158
  category: signs_and_signals
  question: 工事区間の標識は何色ですか？
  choices:
    A: 黄色
    B: 赤色
    C: オレンジ色
    D: 緑色
  answer: C
  explanation: 工事区間の警戒標識はオレンジ色です。
- id: 159
  category: signs_and_signals
  question: 交差点で道路を横切る1本の実線の白線が意味するのは次のうちどれですか：
  choices:
    A: 合流する
    B: 信号や標識に従い、線の手前で停止する
    C: 加速する
    D: この先工事区間
  answer: B
  explanation: 交差点で道路を横切る1本の実線の白線（停止線）は、運転者が信号や標識に従ってその線の手前で停止しなければならないことを意味します。
- id: 160
  category: signs_and_signals
  question: 高速道路の青色の標識は何を示していますか？
  choices:
    A: 警告
    B: 規制
    C: サービス（ガソリンスタンド、食事、病院）
    D: 工事
  answer: C
  explanation: 青色の標識は、ガソリンスタンド、食事、病院など、高速道路の近くで利用できるサービスを示しています。
- id: 161
  category: safe_driving_rules
  question: 走行中の車両からのポイ捨ては、以下の結果を招く可能性があります：
  choices:
    A: 警告
    B: 最大1,000ドルの罰金および免許取り消しの可能性
    C: 50ドルの罰金
    D: 社会奉仕活動のみ
  answer: B
  explanation: 危険物を投げ捨てた場合、最大1,000ドルの罰金が科せられます。走行中の車両から投げ捨てた場合、運転者は免許を失う可能性があります。（N.J.S.A.
    39:4-63）
- id: 162
  category: driver_responsibility
  question: 一酸化炭素（CO）とは何ですか？
  choices:
    A: 排気ガスから出る目に見えるガス
    B: 車の排気ガスに含まれる無臭・無色のガス
    C: エンジンの無害な副産物
    D: 腐った卵のような臭いのするガス
  answer: B
  explanation: 一酸化炭素は、車の排気ガスに含まれる無臭・無色のガスであり、致命的な結果を招く可能性があります。
- id: 163
  category: defensive_driving
  question: 衝突が避けられない場合、衝突する対象として選ぶべきなのは：
  choices:
    A: 正面から向かってくるもの
    B: 向かってくるものより動いていないもの、硬いものより衝撃を吸収してくれる（壊れやすい）もの
    C: 可能な限り最も大きな物体
    D: 何も選ばない。常に道路外に急ハンドルを切る
  answer: B
  explanation: 正面から向かってくるものよりも、同じ方向に動いているもの、次に動いていないものを選びます。硬い物体よりも、衝撃を吸収してくれる物体（茂みなど）を選びます。
- id: 164
  category: safe_driving_rules
  question: 標識のないトラフィックサークル（環状交差点）では、誰に優先権がありますか？
  choices:
    A: サークルに進入する車両
    B: 右側から接近する車両
    C: すでにサークル内にいる車両
    D: 最も大きな車両
  answer: B
  explanation: 信号や標識のない交差点・サークルの基本ルール：左側の車両は、右側から接近する車両に道を譲らなければなりません。
- id: 165
  category: safe_driving_rules
  question: 高速道路で出口を通り過ぎてしまった場合、どうするべきですか？
  choices:
    A: 出口のランプ（傾斜路）をバックする
    B: 高速道路上で停止してバックする
    C: 次の出口まで進む
    D: Uターンする
  answer: C
  explanation: 出口を通り過ぎてしまった場合は、次の出口まで進んでください。出口のランプや高速道路上で絶対にバックしてはいけません。
- id: 166
  category: penalties_and_points
  question: ニュージャージー州で合法的にアルコールを購入または消費できる最低年齢は何歳ですか？
  choices:
    A: 18歳
    B: 19歳
    C: 20歳
    D: 21歳
  answer: D
  explanation: ニュージャージー州では、アルコールの購入、所持、または消費は21歳以上でなければなりません。
- id: 167
  category: alcohol_drugs_health
  question: 「クレシュ、クバーツ、ボリス法（Kulesh's, Kuberts' and Bolis' Law）」により、運転中の違法な携帯電話の使用は以下に該当すると定められています：
  choices:
    A: 軽微な交通違反
    B: 車両による殺人および自動車による暴行の法律に基づく無謀行為
    C: 軽犯罪
    D: 駐車違反
  answer: B
  explanation: この法律は、運転中の違法な携帯電話の使用を、車両による殺人および自動車による暴行の法律に基づく無謀行為として定めています。
- id: 168
  category: sharing_the_road
  question: トラックに関する「ノーゾーン（no-zone）」とは何を意味しますか？
  choices:
    A: トラック付近の駐車禁止区域
    B: トラックの運転手が他の車両を見ることができない死角
    C: 速度制限区域
    D: 高速道路の追い越し禁止区域
  answer: B
  explanation: ノーゾーンとは、トラックの周囲にある、トラックの運転手が他の車両を見ることができない死角のことです。
- id: 169
  category: sharing_the_road
  question: 安全追い越し法（Safe Passing Law）に違反し、人身傷害を引き起こした場合の罰金はいくらですか？
  choices:
    A: 100ドル
    B: 250ドル
    C: 500ドルの罰金および自動車違反点数2点
    D: 1,000ドル
  answer: C
  explanation: 人身傷害が生じた場合：500ドルの罰金および2点。傷害がない場合：100ドルの罰金および点数なし。（N.J.S.A. 39:4-92.4）
- id: 170
  category: defensive_driving
  question: ABS（アンチロック・ブレーキ・システム）について、運転者はどのように操作するべきですか？
  choices:
    A: 緊急時にはブレーキをポンピングする（何度も踏み直す）
    B: 一定の圧力をかける。ABSブレーキをポンピングしたり、ハンドルを急に切ったりしてはならない
    C: 雨天時のみ使用する
    D: 軽く叩くように踏む
  answer: B
  explanation: ABS搭載車では、ブレーキペダルに一定の圧力をかけます。ブレーキをかける際に、ABSブレーキをポンピングしたり、ハンドルを激しく切ったりしてはいけません。
- id: 171
  category: driver_responsibility
  question: 児童乗員安全法（チャイルドシート着用義務）に違反した場合の罰金は以下の通りです：
  choices:
    A: 25ドル以上50ドル以下
    B: 50ドル以上75ドル以下、および手数料と裁判費用
    C: 100ドル以上200ドル以下
    D: 500ドル
  answer: B
  explanation: 児童乗員安全法への違反：50ドル以上75ドル以下の罰金、および手数料と裁判費用が科せられます。
- id: 172
  category: safe_driving_rules
  question: 対向車がハイビーム（上向きライト）を使用している場合、運転者は次のようにすべきです：
  choices:
    A: ハイビームを点滅させてやり返す
    B: 車が通り過ぎるまで道路の右側を見る
    C: 片目を閉じる
    D: 早くすれ違うために加速する
  answer: B
  explanation: 車が通り過ぎるまで道路の右側を見ます。接近してくる運転者に対して絶対にハイビームを点滅させてはいけません。
- id: 173
  category: defensive_driving
  question: 接近するハイビームのまぶしさから視力が回復するのにどれくらいの時間がかかりますか？
  choices:
    A: 1〜2秒
    B: 3〜5秒
    C: 7〜10秒
    D: 15秒
  answer: B
  explanation: 接近するハイビームのヘッドライトのまぶしさから視力が回復するのに3〜5秒かかることがあります。
- id: 174
  category: penalties_and_points
  question: 飲酒運転（DUI）または呼気検査拒否に対する追加徴収金（サーチャージ）はいくらですか？
  choices:
    A: 3年間、毎年500ドル
    B: 3年間、毎年750ドル
    C: 3年間、毎年1,000ドル
    D: 5年間、毎年1,500ドル
  answer: C
  explanation: 飲酒運転（DUI）または検査拒否に対する違反追加徴収金は、3年間、毎年1,000ドルです。
- id: 175
  category: penalties_and_points
  question: イグニッション・インターロック装置（呼気吹込み式エンジン始動制限装置）は、運転者の血中アルコール濃度（BAC）が次の値を超えた場合に車の始動を防ぎます：
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: イグニッション・インターロック装置は、運転者の血中アルコール濃度（BAC）が0.05%を超えた場合に車の始動を防ぎます。
- id: 176
  category: safe_driving_rules
  question: スクールバスの運転手が携帯電話を使用できるのは次の場合のみです：
  choices:
    A: ハンズフリーであればいつでも
    B: 緊急時、またはバスが公道から離れた安全な場所に駐車している時
    C: 生徒がバスに乗っていない時
    D: いかなる場合も使用できない
  answer: B
  explanation: スクールバスの運転手は、緊急時またはバスが公道から離れた安全な場所に駐車している場合を除き、携帯電話を使用することはできません。（N.J.S.A.
    39:3B-25）
- id: 177
  category: sharing_the_road
  question: 17歳未満の歩行者が歩行者に関する法律に違反した場合、どのような罰則を受けますか？
  choices:
    A: 10ドルの罰金
    B: 22ドルの罰金
    C: 54ドルの罰金
    D: 警告のみ
  answer: B
  explanation: 歩行者に関する法律に違反した17歳未満の歩行者には22ドルの罰金が科せられます。大人の場合は54ドルの罰金が科せられます。
- id: 178
  category: driver_responsibility
  question: アイドリング違反の罰金は以下の範囲です：
  choices:
    A: 50ドルから250ドル
    B: 100ドルから500ドル
    C: 250ドルから1,000ドル
    D: 500ドルから2,000ドル
  answer: C
  explanation: 車両および敷地の所有者は、アイドリング違反1回につき250ドルから1,000ドルの罰金に処せられます。（N.J.S.A. 39:3-70.2）
- id: 179
  category: penalties_and_points
  question: 開封済みまたは未密封のアルコール飲料の容器を車内に持ち込んだ場合の罰金は以下の通りです：
  choices:
    A: 初回違反で100ドル
    B: 初回違反で200ドル
    C: 初回違反で300ドル
    D: 初回違反で500ドル
  answer: B
  explanation: 初回違反は200ドル、2回目以降の違反は250ドルまたは10日間の社会奉仕活動が科せられます。（N.J.S.A. 39:4-51a）
- id: 180
  category: license_system
  question: モペッド（原動機付自転車）免許を取得できる最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 17歳
  answer: B
  explanation: モペッド免許を取得できる最低年齢は15歳です。
- id: 181
  category: defensive_driving
  question: 時速30マイル（mph）の濡れた路面において、安全な最小車間距離は次のうちどれですか？
  choices:
    A: 車3台分
    B: 車4台分
    C: 車6台分
    D: 車9台分
  answer: C
  explanation: 時速30マイル（mph）の濡れた路面において、安全な最小車間距離は車6台分です。
- id: 182
  category: defensive_driving
  question: 時速20マイル（mph）の凍結路面において、安全な最小車間距離は次のうちどれですか？
  choices:
    A: 車4台分
    B: 車6台分
    C: 車10台分
    D: 車12台分
  answer: D
  explanation: 時速20マイル（mph）の凍結路面において、安全な最小車間距離は車12台分です。
- id: 183
  category: safe_driving_rules
  question: 加速車線から高速道路に進入する際、運転者はどうするべきですか？
  choices:
    A: 停止して空きができるのを待つ
    B: 交通の流れに合わせて加速し、本線の車両に道を譲り、右側車線に進入する
    C: 任意の速度で進入する
    D: より早く合流するために左側車線に進入する
  answer: B
  explanation: 加速車線を出る際は交通の流れに合わせて加速し、すでに高速道路を走行している車両に道を譲り、安全が確認できたら右側の車線に進入します。
- id: 184
  category: driver_responsibility
  question: 横滑り（スリップ）している際、従来型（非ABS）ブレーキの正しい操作方法は何ですか？
  choices:
    A: ブレーキペダルを強く踏み込む
    B: ペダルを離し、車両を制御できるようになるまで少し弱めの力で踏み直す
    C: ブレーキを素早くポンピングする
    D: パーキングブレーキを使用する
  answer: B
  explanation: ブレーキがロックした場合はペダルを離し、少し弱めの力で踏み直します。車両を制御できるようになるまで、さらに弱い力でこれを繰り返します。
- id: 185
  category: alcohol_drugs_health
  question: 2回目の違反から10年以内に発生した3回目の飲酒・薬物運転（DUI）の罰則は何ですか（2019年12月1日以降の違反の場合）？
  choices:
    A: 免許停止2年
    B: 免許停止5年
    C: 免許停止8年
    D: 免許の永久取消
  answer: C
  explanation: 2019年12月1日以降の3回目のDUI違反：8年間の免許停止、1,000ドルの罰金、3年間にわたり年間1,500ドルの追加徴収金（サーチャージ）。
- id: 186
  category: safe_driving_rules
  question: ニュージャージー州における「セーフ・コリドー（Safe Corridors）」とは何ですか？
  choices:
    A: 制限速度が引き下げられた幹線道路
    B: 事故率の統計が高いため、罰金が2倍になる幹線道路
    C: スクールゾーンのエリア
    D: 工事区間
  answer: B
  explanation: セーフ・コリドーでは、州内のさまざまな幹線道路での罰金が2倍になります。これらは、事故率が州の平均を50%上回り、かつ3年間で1,000件以上の事故が発生していることに基づいて指定されます。
- id: 187
  category: penalties_and_points
  question: 横断歩道で歩行者に道を譲らなかった場合、何ポイントが加算されますか？
  choices:
    A: 1ポイント
    B: 2ポイント
    C: 3ポイント
    D: 4ポイント
  answer: B
  explanation: 横断歩道で歩行者に道を譲らなかった場合：2ポイント。（N.J.S.A. 39:4-35）
- id: 188
  category: penalties_and_points
  question: 不適切なUターンをした場合、何ポイントが加算されますか？
  choices:
    A: 2ポイント
    B: 3ポイント
    C: 4ポイント
    D: 5ポイント
  answer: B
  explanation: 不適切なUターン：3ポイント。（N.J.S.A. 39:4-125）
- id: 189
  category: penalties_and_points
  question: 対向車（反対方向に進行する車両）の右側を通過しなかった場合、何ポイントが加算されますか？
  choices:
    A: 2ポイント
    B: 3ポイント
    C: 4ポイント
    D: 5ポイント
  answer: D
  explanation: 対向車の右側を通過しなかった場合：5ポイント。（N.J.S.A. 39:4-84）
- id: 190
  category: safe_driving_rules
  question: 運転者はカーブにどのように進入するべきですか？
  choices:
    A: カーブを通過する間、速度を維持する
    B: カーブに入る前に減速し、他の車線にはみ出さないようにする
    C: カーブを通過しながら加速する
    D: カーブの途中で急ブレーキをかける
  answer: B
  explanation: カーブに入る前に減速し、他の車線にはみ出さないようにします。
- id: 191
  category: sharing_the_road
  question: 乗馬している人が手を挙げて合図をした場合、運転者はどうしなければなりませんか？
  choices:
    A: 時速25マイルに減速して追い越す
    B: 停止し、馬が通り過ぎるまで動かずに待機する
    C: クラクションを鳴らして馬に警告する
    D: 車線を変更して追い越す
  answer: B
  explanation: 乗馬している人の合図があった場合、運転者は停止し、馬が通り過ぎるまで動かずに待機しなければなりません。（N.J.S.A. 39:4-72）
- id: 192
  category: defensive_driving
  question: 車両火災の主な原因は何ですか？
  choices:
    A: エンジンのオーバーヒート
    B: 燃料漏れ
    C: 電気系統のショート
    D: 喫煙
  answer: C
  explanation: 車両火災のほとんどは、電気系統のショートによって引き起こされます。
- id: 193
  category: driver_responsibility
  question: ニュージャージー州法では、車両が前進している間にどのライトを点灯させることが禁止されていますか？
  choices:
    A: フォグランプ
    B: パーキングライト
    C: バックアップライト（後退灯）
    D: ダッシュボードライト
  answer: C
  explanation: 車両が前進している間にバックアップライト（後退灯）を点灯させることは、ニュージャージー州法違反です。（N.J.S.A. 39:3-52）
- id: 194
  category: safe_driving_rules
  question: ニキル法（Nikhil's Law）の安全誓約において、運転者が誓約しなければならないことは何ですか？
  choices:
    A: 絶対にスピード違反をしないこと
    B: 一時停止標識で完全に停止すること、常に注意を払うこと、ハンズフリー電話を使用すること、事前に計画を立てること
    C: 常にシートベルトを着用すること
    D: 絶対に飲酒運転をしないこと
  answer: B
  explanation: ニキル法の誓約には、「完全に停止する（Stop Completely）」、「常に注意を払う（Stay Alert）」、「安全に通話する（ハンズフリー）（Talk
    Safe）」、「事前に計画を立てる（Plan Ahead）」が含まれます。
- id: 195
  category: vehicle_information
  question: ニュージャージー州におけるオートバイの年間登録料はいくらですか？
  choices:
    A: 24ドル
    B: 35ドル
    C: 50ドル
    D: 65ドル
  answer: D
  explanation: ニュージャージー州のオートバイの年間登録料は65ドルです。
- id: 196
  category: penalties_and_points
  question: 冷凍デザートトラック（アイスクリームトラックなど）の不適切な追い越しには、何ポイントが加算されますか？
  choices:
    A: 2ポイント
    B: 3ポイント
    C: 4ポイント
    D: 5ポイント
  answer: C
  explanation: 冷凍デザートトラックの不適切な追い越しには4ポイントが加算されます。（N.J.S.A. 39:4-128.4）
- id: 197
  category: penalties_and_points
  question: 12〜14ポイント以上累積した運転者はどうなりますか？
  choices:
    A: 警告状を受け取る
    B: 免許停止予定通知書（Notice of Scheduled Suspension）を受け取る
    C: 自動的に免許停止になる
    D: 義務的な出廷が命じられる
  answer: B
  explanation: 24ヶ月の間に12〜14ポイント以上累積した運転者は、免許停止予定通知書（Notice of Scheduled Suspension）を受け取ります。
- id: 198
  category: safe_driving_rules
  question: 選挙前の有権者登録の締め切りはいつですか？
  choices:
    A: 7日前
    B: 14日前
    C: 21日前
    D: 30日前
  answer: C
  explanation: 有権者登録の締め切りは、選挙の21日前です。
- id: 199
  category: penalties_and_points
  question: 飲酒運転（DUI）関連の違反による免許停止中に運転した場合の罰則は何ですか？
  choices:
    A: 罰金200ドル
    B: 罰金500ドル、1〜2年の追加免許停止、および10〜90日の禁錮刑の可能性
    C: 罰金100ドルと30日間の免許停止
    D: 警告のみ
  answer: B
  explanation: DUIまたは呼気検査拒否による免許停止中の運転：罰金500ドル、1〜2年の追加免許停止、および10〜90日の禁錮刑の可能性があります。
- id: 200
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）が0.01%以上の未成年（21歳未満）の運転者は、どのような罰則を受けますか？
  choices:
    A: 警告
    B: 30〜90日間の免許停止、15〜30日間の社会奉仕活動、およびIDRC（飲酒運転者リソースセンター）への参加
    C: 罰金100ドルのみ
    D: 成人と同じ罰則
  answer: B
  explanation: BACが0.01%〜0.08%の未成年の初犯：30〜90日間の免許停止、15〜30日間の社会奉仕活動、およびIDRC/アルコール教育プログラムへの参加。
- id: 201
  category: safe_driving_rules
  question: 'Always signal when:'
  choices:
    A: Changing lanes.
    B: Pulling into or out of a parking space.
    C: Pulling into traffic from a parking area or alley.
    D: All of the above.
  answer: D
  explanation: Your turn signals should always be used when you make any movement
    to the left or right. You should use your signal when pulling into traffic from
    a curbside parking space, moving into a new lane, or passing another vehicle.
- id: 202
  category: safe_driving_rules
  question: 'When driving on major highways:'
  choices:
    A: Stay alert.
    B: Keep your eyes moving.
    C: Be ready to react to road hazards.
    D: All of the above.
  answer: D
  explanation: It is important to stay alert on highways and be ready to react to
    unexpected hazards. To avoid "highway hypnosis," you should avoid looking at any
    one thing for more than a few seconds.
- id: 203
  category: sharing_the_road
  question: 'You are driving up a hill and are approaching a heavy truck from the
    rear. You should know that:'
  choices:
    A: The truck may be traveling at a speed slower than the posted speed limit.
    B: You may not be able to safely pass the truck.
    C: You may not be able to legally pass the truck.
    D: All of the above.
  answer: D
  explanation: Drivers must be aware that large vehicles often travel at a speed slower
    than the posted speed limit, especially when driving on an incline, and should
    use caution when approaching a large vehicle from the rear. When on a hill with
    limited visibility, it is unlawful to pass another vehicle.
- id: 204
  category: defensive_driving
  question: 'When you see other drivers around you acting or reacting in anger:'
  choices:
    A: Don’t make eye contact.
    B: Don't react with hand gestures.
    C: Distance yourself from the situation.
    D: All of these.
  answer: D
  explanation: When other drivers are behaving angrily, you should take action to
    physically and mentally distance yourself from the situation. Avoid making eye
    contact with them, or making body movements or gestures that could provoke them.
    Slow down, move over, or do whatever you safely can to put yourself out of danger.
- id: 205
  category: safe_driving_rules
  question: 'A person walking with a white cane or guide dog is likely to be:'
  choices:
    A: A deaf person.
    B: A person involved with a traffic study.
    C: A blind person.
    D: None of the above.
  answer: C
  explanation: Drivers must always yield the right-of-way to a pedestrian when the
    pedestrian is a blind person who is using a white cane or guide dog.
- id: 206
  category: safe_driving_rules
  question: 'On a freeway, you realize you missed your turn or exit. You should:'
  choices:
    A: Make the turn quickly from your lane of travel.
    B: Stop and back up.
    C: Continue driving until you reach the next turn, exit, or other location where
      you can safely turn around.
    D: Signal other drivers to stop so you can turn.
  answer: C
  explanation: If you miss your turn or exit, do not back up, but go on to the next
    turn or exit where you can safely turn around. It is illegal to back up on a shoulder
    or a freeway.
- id: 207
  category: safe_driving_rules
  question: 'When turning or changing lanes, you must:'
  choices:
    A: Always signal your intentions, even when no visible traffic is present.
    B: Signal only if there is visible traffic.
    C: Signal only when driving at night.
    D: Signal only when driving in heavy traffic at night.
  answer: A
  explanation: Always signal your intentions when changing lanes, turning, or pulling
    away from a curb. Do not allow yourself to become lazy and form the bad habit
    of not following this law.
- id: 208
  category: alcohol_drugs_health
  question: 'Taking drugs along with alcohol:'
  choices:
    A: Increases the risk of causing a crash.
    B: Is no more dangerous than consuming alcohol by itself.
    C: Lessens the effect of alcohol on your ability to drive.
    D: Has no effect on your general driving ability.
  answer: A
  explanation: Drugs (including illegal, prescription, and over-the-counter medications)
    can affect your brain function and impair your ability to drive safely. Combining
    alcohol with other drugs will increase the risk of a crash.
- id: 209
  category: signs_and_signals
  question: 'When driving on wet pavement, it''s important to remember:'
  choices:
    A: That pavement is especially slippery right after it starts to rain.
    B: That wet roads can cause hydroplaning.
    C: To give yourself additional space when coming to a stop.
    D: All of the above.
  answer: D
  explanation: Wet roadway surfaces can be dangerously slick, especially immediately
    following a rainfall. When you are driving on wet roads, your vehicle is traveling
    on a thin layer of oil, dirt, and water. Slow down when there is heavy rain, standing
    water, or slush on the road to reduce the risk of your wheels losing traction
    on the slick surface.
- id: 210
  category: signs_and_signals
  question: 'A diamond-shaped yellow sign with a curved arrow pointing right indicates:'
  choices:
    A: One-way road.
    B: No right turn.
    C: Exit.
    D: Sharp right turn in the road ahead.
  answer: D
  explanation: Diamond-shaped yellow warning signs with curve arrows warn drivers
    of upcoming sharp turns in the road.
- id: 211
  category: safe_driving_rules
  question: 交差点での青信号（点灯）が意味するのは次のうちどれですか：
  choices:
    A: 減速して停止する準備をしなければならない。
    B: 進行する前に停止し、対向車を確認しなければならない。
    C: 道路が安全であれば、交差点を通過してもよい。
    D: 右折してはならない。
  answer: C
  explanation: 青信号（点灯）は、道路が安全であれば交差点を通過してもよいことを意味します。また、標識で禁止されていない限り、青信号で右折または左折することもできます。曲がる際は、交差点内の他の車両や歩行者に道を譲らなければなりません。
- id: 212
  category: vehicle_information
  question: シートベルトはどのように調整するべきですか：
  choices:
    A: 緩くする。
    B: 骨盤と下腹部を横切るようにぴったりと締める。
    C: 座席の下に隠す。
    D: シートベルトの警告音や警告灯が作動しないようにする。
  answer: B
  explanation: ラップベルト（腰ベルト）は、骨盤と下腹部を横切るようにぴったりと合わせる必要があります。ショルダーベルト（肩ベルト）は、ベルトと胸の間に拳が入る程度の余裕を持たせ、快適にフィットするようにします。
- id: 213
  category: safe_driving_rules
  question: 夜間に道路沿いに停車する場合：
  choices:
    A: すべてのライトを消す。
    B: パーキングライトのみを使用する。
    C: ヘッドライトのみを使用する。
    D: ハザードランプ（非常点滅表示灯）を点灯させ、ロービームを点灯したままにする。
  answer: D
  explanation: 夜間に道路沿いに停車する場合は、ハザードランプ（非常点滅表示灯）を点灯させ、ロービームのヘッドライトを点灯したままにしてください。他の道路利用者があなたの車両をはっきりと確認できるようにする必要があります。
- id: 214
  category: safe_driving_rules
  question: 対面通行の2車線道路で安全に追い越しを行うためには、次のどの条件を満たす必要がありますか：
  choices:
    A: 前方の道路がはっきりと見える。
    B: 対向車とすれ違う前に自分の車線に戻ることができる。
    C: 自分の車両が追い越しに必要な速度を出せる。
    D: 上記のすべて。
  answer: D
  explanation: 対面通行の2車線道路を走行中、前方の道路がはっきりと見え、対向車とすれ違う前に自分の車線に戻ることができ、かつ自分の車両が追い越しに必要な速度を出せる場合でなければ、安全に追い越しを行うことはできません。違法で危険な場所では追い越しをしないでください。
- id: 215
  category: signs_and_signals
  question: 道路上の2本の実線の黄色い線が意味するのは次のうちどれですか：
  choices:
    A: 両方向の運転手に対して追い越しが許可されている。
    B: 追い越しは禁止されている。
    C: 丘の頂上にいる場合は追い越しが許可されている。
    D: 日中のみ追い越しが許可されている。
  answer: B
  explanation: 黄色い線は、線の反対側の交通が反対方向に進んでいることを示しています。どちらの方向からであっても、2本の実線の黄色い線を越えて追い越しをしてはいけません。
- id: 216
  category: safe_driving_rules
  question: 運転手が他の車両の右側から合法的に追い越しできるのは次の場合です：
  choices:
    A: その車両が左折待ちをしており、利用可能な追い越し車線がある場合。
    B: 舗装道路から外れて走行することになってもよい。
    C: 狭い橋の上。
    D: いつでも。
  answer: A
  explanation: 利用可能な追い越し車線がある場合、左折中または左折待ちをしている車両や自転車の右側から追い越しをすることができます。また、同じ方向に進む2車線以上の多車線道路を走行している場合も、右側からの追い越しは合法です。他の車両を追い越すために、舗装道路や道路の主要な走行部分から外れて走行することは絶対に禁止されています。
- id: 217
  category: sharing_the_road
  question: スクールゾーンで交通誘導員（クロッシングガード）が交通整理をしている場合、あなたは次のようにしなければなりません：
  choices:
    A: 交通誘導員の指示に従う。
    B: 交通誘導員の指示に関わらず、周囲の交通の動きを真似る。
    C: 誘導員が交通整理をする権限がないとみなす。
    D: 子供がいない場合に適用されるルールに従う。
  answer: A
  explanation: 標識、交通誘導員、または警察官から指示された場合は、減速して注意を払う準備をしてください。スクールゾーンでは常に細心の注意を払って運転してください。
- id: 218
  category: safe_driving_rules
  question: 曲がる、車線変更する、または縁石から発進する前に合図（ウィンカー）を出すことは：
  choices:
    A: 他の車両がいる場合のみ必要である。
    B: 良い運転習慣であり、法律で義務付けられている。
    C: 操作中のみ必要であり、その前には必要ない。
    D: ゆっくりと操作を行う場合は必要ない。
  answer: B
  explanation: 車線変更や右左折をする際は、十分前もって合図を出してください。法律では、車両を左右に動かす少なくとも100フィート（約30メートル）手前から合図を出すことが義務付けられています。縁石から発進する前には、通過する運転手に自分の意図を知らせるために必ず合図を出してください。
- id: 219
  category: signs_and_signals
  question: 点滅灯をつけた緊急車両があなたの運転している地域を走行している場合、次のようにすべきです：
  choices:
    A: 緊急車両を避けるためにスピードを上げる。
    B: すぐに車両を停止させ、緊急車両が通過するのを妨げる。
    C: 緊急車両の進路を空けるためにあらゆる努力をする。
    D: 緊急車両があなたを追い越しても安全な時に合図を送る。
  answer: C
  explanation: 点滅灯をつけた緊急車両があなたの運転している地域を走行している場合、緊急車両の進路を空けるためにあらゆる努力をしなければなりません。安全であれば、車両を道路の端に寄せて緊急車両の通り道を確保してください。
- id: 220
  category: safe_driving_rules
  question: 高速道路（フリーウェイ）を降りたいのに出口を通り過ぎてしまった場合、次のようにすべきです：
  choices:
    A: 次の出口まで進む。
    B: 中央分離帯を通ってUターンする。
    C: 路肩に寄せて出口まで車をバックさせる。
    D: 警察官を呼び止め、出口まで誘導してもらう。
  answer: A
  explanation: 出口を通り過ぎてしまった場合は、次の出口を利用してください。高速道路上で停止したりバックしたり、直前で出口に向かおうとして複数の車線をまたいで急ハンドルを切ったり、中央分離帯を越えてUターンしたりしないでください。これらの操作はすべて違法であり、非常に危険です。
- id: 221
  category: safe_driving_rules
  question: 次の記述のうち、正しいものはどれですか？
  choices:
    A: 追い越しのために車線変更をする少なくとも100フィート手前で合図を出し、対向車がいないことを確認する。
    B: 左側から追い越す際は、ミラーを使い、左肩越しに振り返って死角（ブラインドスポット）を確認する。
    C: 追い越しをする際は、追い越した車の両方のヘッドライトがルームミラーに映るまで待ってから、元の車線に戻る。
    D: 上記のすべて。
  answer: D
  explanation: 追い越しをする際は、車線変更の少なくとも100フィート手前で常に合図を出さなければなりません。常にミラーで後方を確認し、肩越しに振り返って死角を確認してください。追い越した車の両方のヘッドライトがルームミラーに映るまで待ってから、元の車線に戻ってください。
- id: 222
  category: safe_driving_rules
  question: 4方向一時停止（フォーウェイ・ストップ）の交差点では：
  choices:
    A: 最初に到着した運転手に優先権（ライト・オブ・ウェイ）がある。
    B: 最後に到着した運転手に優先権がある。
    C: 1人の運転手は停止せずに運転を続けるべきである。
    D: 1人の運転手が他の運転手に先に行くよう手で合図するべきである。
  answer: A
  explanation: 4方向一時停止の交差点では、4方向すべての交通が停止しなければなりません。最初に交差点に到達した車両が先に進むべきです。2台の車両が同時に交差点に到達した場合、左側の運転手は右側の運転手に道を譲ります。
- id: 223
  category: safe_driving_rules
  question: 公道上の車両内でアルコール飲料を飲んでもよいのは次の場合です：
  choices:
    A: 運転していない場合。
    B: 後部座席に乗っている場合。
    C: ピックアップトラックの荷台に乗っている場合。
    D: いかなる状況でも許可されない。
  answer: D
  explanation: 公道や歩道でアルコール飲料を消費または所持することは法律違反です。さらに、公道上において、運転手や同乗者が通常乗車する車両内のスペースに、開封済みのアルコール飲料の容器を保管することも禁止されています。
- id: 224
  category: safe_driving_rules
  question: 青信号で右折する場合、次のことをしなければなりません：
  choices:
    A: 通常の走行速度を維持する。
    B: 停止して近くにパトカーがいないか確認する。
    C: 歩行者に道を譲る。
    D: 通常の走行速度を上げる。
  answer: C
  explanation: 標識で禁止されていない限り、青の点灯信号で右折または左折することができます。曲がる際は、交差点内の他の車両や歩行者に道を譲らなければなりません。
- id: 225
  category: vehicle_information
  question: ハイドロプレーニング現象は通常、何によって引き起こされますか？
  choices:
    A: 過度な停止。
    B: 急停止。
    C: 急な方向転換。
    D: 速度の出しすぎ。
  answer: D
  explanation: 速度を上げるにつれて、タイヤが路面の水を排除する効果が低下します。スピードを出しすぎると、タイヤのグリップが完全に失われ、車両が水膜の上を滑る状態になることがあります。これは「ハイドロプレーニング現象」として知られています。
- id: 226
  category: signs_and_signals
  question: 交通標識と路面標示は：
  choices:
    A: 常に従わなければならない。
    B: 単なる提案である。
    C: 他の交通がある場合にのみ従わなければならない。
    D: 警察官がいる場合にのみ従わなければならない。
  answer: A
  explanation: 交通の流れは、路面標示、安全地帯（トラフィックアイランド）、信号機、および標識によって制御されています。これらの設備は、運転手に道路状況を知らせ、目的地まで安全に誘導する役割を果たします。交通標識、信号機、および路面標示には常に従わなければなりません。
- id: 227
  category: signs_and_signals
  question: クロスバック標識（X字型の踏切標識）が示しているのは：
  choices:
    A: 踏切。
    B: スクールゾーン。
    C: 追い越し禁止区域。
    D: 病院。
  answer: A
  explanation: クロスバック標識は、踏切で列車に道を譲るよう運転手に指示するものです。運転手は列車より先に通り抜けようとしてはいけません。
- id: 228
  category: defensive_driving
  question: 滑りやすい道路を運転する際、次のことを行うべきです：
  choices:
    A: 別のルートを使用する。
    B: 乾いた道路と同じように運転する。
    C: 車間距離を広げる。
    D: 橋や交差点を渡るのを避ける。
  answer: C
  explanation: 滑りやすい道路では、車間距離を広げるべきです。通常の状況よりも車両を停止させるのに時間がかかる場合があります。
- id: 229
  category: safe_driving_rules
  question: 信号機のない場所で運転手が曲がろうとしており、歩行者が横断している場合、誰が道を譲らなければなりませんか？
  choices:
    A: 最後に動き始めた方
    B: 運転手
    C: 遅い方
    D: 歩行者
  answer: B
  explanation: 横断歩道の有無にかかわらず、信号機のない交差点を横断している歩行者に対して、運転手は道を譲らなければなりません。
- id: 230
  category: alcohol_drugs_health
  question: どのような種類の薬が運転能力に影響を与える可能性がありますか？
  choices:
    A: アレルギー薬
    B: マリファナ（大麻）
    C: 風邪薬
    D: これらの選択肢すべて
  answer: D
  explanation: 多くの種類の薬が運転能力を低下させる可能性があります。これには、違法薬物だけでなく、合法的な処方薬や市販薬も含まれます。いかなる薬物であっても、その影響下で運転することは犯罪となる可能性があります。
- id: 231
  category: vehicle_information
  question: 死角とは、道路上の次のどのエリアのことですか：
  choices:
    A: 頭を動かさなければ見えないエリア。
    B: 車の真後ろのエリア。
    C: ルームミラーで見えるエリア。
    D: サイドミラーで見えるエリア。
  answer: A
  explanation: 死角とは、運転手が頭を動かさなければ見えないエリアのことです。死角は車の側面や後方に存在することがあります。
- id: 232
  category: safe_driving_rules
  question: 他の車で塞がれている交差点に差し掛かりました。あなたはどうするべきですか：
  choices:
    A: 前方の車が動くまでゆっくり進む。
    B: 前の車にできるだけ近づく。
    C: 通過できるようになるまで交差点に入らない。
    D: クラクションを鳴らして車を前に進ませる。
  answer: C
  explanation: 交差点の先が渋滞しており、完全に通過できない場合は、交差点に進入してはいけません。交差点を塞がないように、前方の交通が解消されるまで待ってください。
- id: 233
  category: signs_and_signals
  question: 信号機のマークが描かれた黄色のひし形の標識は、何を示していますか：
  choices:
    A: 現在の速度で進み続ける。
    B: 前方で停止しなければならない。
    C: スピード違反は許可されていない。
    D: 前方に信号機がある。
  answer: D
  explanation: 信号機のマークが描かれた黄色の警戒標識は、前方に信号機があることを運転手に警告するものです。停止する準備をしてください。
- id: 234
  category: defensive_driving
  question: 視界が悪くなったときの最初の対応として、どうするべきですか：
  choices:
    A: ヘッドライトを点灯する。
    B: 速度を落とす。
    C: ワイパーを作動させる。
    D: 道路の端の標示をガイドとして探す。
  answer: B
  explanation: 視界の低下や危険な道路状況に対する最初の対応は、速度を落とすことです。
- id: 235
  category: safe_driving_rules
  question: 車線を横切るように引かれた2本の実線の白線は、横断歩道の境界を示しています。運転手として知っておくべきことは何ですか：
  choices:
    A: 横断歩道では、自動車が歩行者よりも優先権を持つ。
    B: 歩行者が横断歩道にいるときは、歩行者に優先権を譲らなければならない。
    C: 横断歩道では誰も優先権を持たない。
    D: 歩行者はすべての交通の邪魔にならないようにする責任がある。
  answer: B
  explanation: 横断歩道の線は、歩行者が安全に道路を渡る場所を示しています。横断歩道は水平線、垂直線、またはその組み合わせで標示されることがあります。横断歩道内にいる歩行者のためには、必ず停止しなければなりません。
- id: 236
  category: safe_driving_rules
  question: 次の場合、他の運転手に道を譲らなければなりません：
  choices:
    A: 車庫や路地から道路に出るとき。
    B: 相手が左側の道路におり、標識のない交差点に同時に到達したとき。
    C: 自分の信号が緑の矢印のとき。
    D: 上記のすべて。
  answer: A
  explanation: 路地、私道、または車庫から道路に出る際は、他の運転手に道を譲らなければなりません。また、交差する歩道にいる歩行者にも道を譲る必要があります。
- id: 237
  category: safe_driving_rules
  question: 緊急車両に道を譲らなければならないのはいつですか：
  choices:
    A: いかなる状況でも譲る必要はない。
    B: 赤や青の点滅灯が見えたとき、またはサイレンが聞こえたとき。
    C: 他の車が道を譲ったときのみ。
    D: 上記のどれでもない。
  answer: B
  explanation: サイレンを鳴らしている、または警告灯を点滅させているすべての緊急車両に対して、優先権を譲らなければなりません。
- id: 238
  category: safe_driving_rules
  question: 私道や専用道路から公道に出る運転手は：
  choices:
    A: 優先権を持っている。
    B: すでに公道を走っている運転手に道を譲るべきである。
    C: 無理やり交通に割り込んでもよい。
    D: 他の運転手が車線を変更してスペースを空けてくれると想定してよい。
  answer: B
  explanation: 私道や専用道路から公道に出る場合は、すでに公道を走っている運転手に道を譲るべきです。安全に合流できる状態になってから交通に合流してください。
- id: 239
  category: safe_driving_rules
  question: 次のどの信号機で左折する場合、あなたに優先権がありますか？
  choices:
    A: 点灯している緑色の信号
    B: 点滅している黄色の信号
    C: 左を指す緑色の矢印信号
    D: 点滅している赤色の信号
  answer: C
  explanation: 点灯している緑色の矢印は、矢印が指す方向へ交差点を通過してよいことを意味します。対向車は、曲がる車のために停止することが義務付けられています。
- id: 240
  category: safe_driving_rules
  question: 車が停止するまでに必要な距離を決定する要因ではないものはどれですか？
  choices:
    A: ハンドル操作能力
    B: 制動距離
    C: 反応距離
    D: 認知時間
  answer: A
  explanation: 車が停止するまでに必要な距離は、認知時間、反応距離、および制動距離に依存します。これは速度や道路状況によって変化します。
- id: 241
  category: safe_driving_rules
  question: 速度制限標識（または推奨速度標識）は：
  choices:
    A: 雨、雪、または凍結した状態では無視してもよい。
    B: 三角形である。
    C: 青地に黒字である。
    D: カーブや曲がり角での推奨速度を示している。
  answer: D
  explanation: カーブや曲がり角の警告標識には、カーブや曲がり角での推奨運転速度を示す推奨速度標識が取り付けられていることがよくあります。天候が良い場合はより高い速度で運転しても快適に感じるかもしれませんが、雨、雪、または凍結した状態では絶対にそうしてはいけません。
- id: 242
  category: safe_driving_rules
  question: 交通を横切るために必要なスペースの広さは、以下によって異なります：
  choices:
    A: 道路状況、天候状況、および対向車。
    B: 一時停止標識の有無。
    C: 方向指示器（ウィンカー）の使用。
    D: 後続車。
  answer: A
  explanation: 交通を横切るために必要なスペースの広さは、道路状況、天候状況、および対向車によって異なります。
- id: 243
  category: safe_driving_rules
  question: 追い越しをしてはいけないのは：
  choices:
    A: 坂道やカーブ。
    B: スクールバスのライトが点滅しているとき。
    C: 交差点に近づいているとき。
    D: 上記すべて。
  answer: D
  explanation: 追い越し車線に対向車がいる場合、カーブや坂道で視界が遮られている場合、交差点、踏切や橋の手前またはその上、その他追い越し禁止区域では、絶対に追い越しをしてはいけません。中央分離帯または共有の中央右左折車線がある多車線道路の反対側にいる場合を除き、赤いライトを点滅させて停車しているスクールバスを追い越すことはできません。
- id: 244
  category: safe_driving_rules
  question: 工事区間で交通誘導員が交通整理をしている場合、あなたは次のようにしなければなりません：
  choices:
    A: 交通誘導員の指示に従う。
    B: 交通誘導員の指示に関わらず、周囲の車と同じ行動をとる。
    C: 交通誘導員は交通整理をする権限がないとみなす。
    D: その場所が工事中でない場合に適用される法律に従う。
  answer: A
  explanation: 標識、交通誘導員、または警察官から指示された場合は、速度を落として注意を払う準備をしてください。これに従わないことは違法であり、工事区間で働く人々にとって危険です。
- id: 245
  category: sharing_the_road
  question: 緊急車両が近づいてくるのを見たり聞いたりした場合、次のようにすべきです：
  choices:
    A: すぐに停止し、車両を通過させる。
    B: 安全な範囲で道路の右端にできるだけ寄って停止する。
    C: ゆっくりと進み、車両を通過させる。
    D: 道路の右側に寄りながら、ゆっくりと進み続ける。
  answer: B
  explanation: 2車線道路または中央分離帯のない幹線道路を運転している場合、ライトやサイレンを使用している緊急車両には、どの方向から接近してきても道を譲らなければなりません。交差点内で停止しないように注意しながら、直ちに道路の右端にできるだけ寄って停止してください。
- id: 246
  category: safe_driving_rules
  question: 交差点に近づいており、信号は青です。歩行者が赤信号を無視して横断しています。あなたは次のようにすべきです：
  choices:
    A: クラクションを鳴らす。
    B: 速度を上げて歩行者の前を通り過ぎる。
    C: 停止して歩行者を安全に横断させる。
    D: 歩行者に近づいて驚かせ、赤信号で横断するのをためらわせる。
  answer: C
  explanation: 自分の信号が青であっても、交差点内に取り残されている可能性のある歩行者や車には道を譲ってください。いかなる状況でも歩行者の周囲では注意してください。
- id: 247
  category: safe_driving_rules
  question: 高速道路（フリーウェイ）に合流するには：
  choices:
    A: 方向指示器を出し、本線の車に道を譲り、本線の流れと同じ速度で合流する。
    B: 方向指示器を出して高速道路に合流する。本線の車が道を譲らなければならない。
    C: 交通状況を確認できるようにゆっくり運転する。
    D: 常にまず完全に停止する。
  answer: A
  explanation: 交通の流れに合流する際は、方向指示器を出し、本線の流れと同じ速度で合流する必要があります。道路に進入する際は、常に他の車に道を譲ってください。
- id: 248
  category: defensive_driving
  question: 夜間の運転でより一層の注意が必要な理由は次のうちどれですか：
  choices:
    A: 夜間は車の流れが速くなるため。
    B: 夜間は交通量が多くなるため。
    C: 夜間は運転手の視界が悪くなるため。
    D: 夜間は事故がより頻繁に発生するため。
  answer: C
  explanation: 暗いため、運転手は日中ほど夜間はよく見えません。日没の30分後から日の出の30分前まで、または人や車両が500フィート先から見えない場合はいつでも、運転手はヘッドライトを使用しなければなりません。
- id: 249
  category: penalties_and_points
  question: 段階的運転免許（GDL）に課せられた制限に従わない場合：
  choices:
    A: 大した問題ではない。
    B: 運転免許の違反点数が加算されるだけである。
    C: 悪影響は生じない。
    D: 罰金および免許停止の処分を受ける可能性がある。
  answer: D
  explanation: 段階的運転免許（GDL）を取得した初心運転者は、厳格な運転制限に従わなければなりません。これらの制限に従わない場合、100ドルの罰金およびGDLの停止処分を受ける可能性があります。
- id: 250
  category: safe_driving_rules
  question: 2台の車両が異なる道路から同時に交差点に進入した場合、どちらの車両が優先権を譲らなければなりませんか？
  choices:
    A: どちらか一方
    B: 左側の車両
    C: 右側の車両
    D: どちらでもない
  answer: B
  explanation: 標識や信号で制御されている交差点、および制御されていない交差点において、2台の車両が同時に交差点に到着した場合、左側の運転手は右側の運転手に優先権を譲らなければなりません。
- id: 251
  category: safe_driving_rules
  question: 信号機には、特定の車線からの右左折を制御するために矢印が表示されることがあります。青（緑）の矢印は：
  choices:
    A: 一方通行の道路でのみ使用される。
    B: 円形の青信号と同じ意味を持つが、車両は矢印が示す方向に曲がらなければならない。
    C: 進むことができるが、青の矢印が円形の青信号と一緒に点灯している場合のみである。
    D: 空港への方向を示している。
  answer: B
  explanation: 青（緑）の矢印は円形の青信号と同じ意味を持ちますが、指定された車線の車両は矢印が示す方向に曲がらなければなりません。
- id: 252
  category: safe_driving_rules
  question: 反対方向に進む車線は、____の線で区切られています。
  choices:
    A: 白
    B: 赤
    C: 黒
    D: 黄色
  answer: D
  explanation: 黄色の線は、反対方向に進む車線を区切るために使用されます。
- id: 253
  category: defensive_driving
  question: ハイドロプレーニング現象のリスクをどのように下げることができますか？
  choices:
    A: 道路が濡れているときはスピードを出さない。
    B: 適切な空気圧のタイヤを使用する。
    C: 溝のすり減ったタイヤを交換する。
    D: 上記のすべて。
  answer: D
  explanation: ハイドロプレーニング現象は、タイヤと路面の間の薄い水膜の上を車両が滑るように進むときに発生します。空気圧が低いタイヤや溝のすり減ったタイヤは、ハイドロプレーニングのリスクを高める可能性があります。また、スピードの出しすぎもリスクを高めます。
- id: 254
  category: signs_and_signals
  question: 夜間、ヘッドライトの眩しさ（グレア）の影響を軽減するために、どこを見るべきですか？
  choices:
    A: まっすぐ前。
    B: 肩越しに後ろ。
    C: 道路の中央。
    D: 道路の右端。
  answer: D
  explanation: 対向車の運転手がヘッドライトを暗く（下向きに）しない場合は、前方の道路の右側に視線を保ちます。対向車のヘッドライトを直接見ないでください。眩しさで数秒間視界が奪われる可能性があります。
- id: 255
  category: safe_driving_rules
  question: 交差点で次を見た場合、停止しなければなりません：
  choices:
    A: 赤の点滅信号。
    B: 黄色の点灯信号。
    C: 黄色の矢印信号。
    D: 黄色の点滅信号。
  answer: A
  explanation: 赤の点滅信号は一時停止の標識と同じ意味を持ちます。赤の点滅信号がある交差点では、完全に停止し、左右を確認し、交差点の安全が確認できた後にのみ進むことができます。
- id: 256
  category: alcohol_drugs_health
  question: アルコールが反射神経や判断力に与える影響は：
  choices:
    A: ワインの代わりにビールを飲んだ場合の方が影響が少ない。
    B: ビールの代わりにワインを飲んだ場合の方が影響が少ない。
    C: ハードシードルやカクテルを飲んだ場合が最も影響が大きい。
    D: 血中のアルコール量（BAC）に依存する。
  answer: D
  explanation: どのような種類のアルコールを摂取しても、反射神経や判断力に悪影響を及ぼす可能性があります。どの種類のアルコールを飲んだかは問題ではなく、血中にどれだけのアルコールが入ったかだけが重要です。
- id: 257
  category: vehicle_information
  question: ニュージャージー州で車両を登録するには、____歳以上でなければなりません。
  choices:
    A: '17'
    B: '25'
    C: '18'
    D: '21'
  answer: A
  explanation: ニュージャージー州で自動車を登録するには、17歳以上である必要があります。身分証明書と車両の所有権の証明が必要です。
- id: 258
  category: vehicle_information
  question: 運転中にタイヤがパンク（バースト）しました。あなたはどうするべきですか？
  choices:
    A: 急ブレーキをかける。
    B: ハンドルをしっかりと握り、減速して停止する。
    C: そのまま普通に運転を続ける。
    D: ハザードランプを点灯させ、運転を続ける。
  answer: B
  explanation: タイヤがパンク（バースト）した場合は、すぐにブレーキをかけないでください。ハンドルをしっかりと握り、車線を維持するように操作します。アクセルから足を離し、ブレーキを踏まずに徐々にスピードを落とします。非常に遅い速度になったら、軽くブレーキをかけ、道路脇の安全な場所に車を停めます。
- id: 259
  category: defensive_driving
  question: 次場合は車間距離を広げてください：
  choices:
    A: 視界を遮る大型車の後ろを運転しているとき。
    B: 高速道路を降りるとき。
    C: オートバイの後ろを走っているとき。
    D: 上記のすべて。
  answer: D
  explanation: 視界を遮る大型車の後ろにいるとき、悪天候や渋滞の中を運転しているとき、高速道路を降りるとき、オートバイや自転車の後ろにいるとき、または後続車に煽られている（車間距離を詰められている）ときは、車間距離を広げる必要があります。
- id: 260
  category: safe_driving_rules
  question: 運転手の左腕と手が下に向かって伸ばされています。この手信号（ハンドシグナル）は、運転手が何をしようとしていることを意味しますか？
  choices:
    A: 左折する。
    B: 右折する。
    C: 停止する。
    D: 発進する。
  answer: C
  explanation: 運転手の左腕と手が下に向かって伸ばされている場合、停止する意図があることを示しています。この手信号を使用している運転手の後ろを走っている場合は、それに応じて運転を調整してください。
- id: 261
  category: signs_and_signals
  question: 白または黄色の1本破線を越えてはいけないのは次の場合です：
  choices:
    A: そうすることで交通の妨げになる場合。
    B: 私道へ左折して入る場合。
    C: 前方の車が故障している場合。
    D: 一方通行の道路で右側を追い越す場合。
  answer: A
  explanation: 安全に、かつ交通の妨げになることなく行える限り、追い越しや車線変更のために1本破線を越えることができます。
- id: 262
  category: safe_driving_rules
  question: 自分の体調が原因で危険な運転をしないようにするためには、次のようにすべきです：
  choices:
    A: 健康を維持し、定期的に健康診断を受ける。
    B: 薬が運転能力に与える影響を知っておく。
    C: 自分の身体的な限界の範囲内で運転する。
    D: 上記のすべて。
  answer: D
  explanation: 体調は安全に運転する能力に重要な影響を与えます。運転者は自分の身体的な限界を認識し、安全である場合にのみ運転するべきです。
- id: 263
  category: signs_and_signals
  question: オレンジ色の標識は次のうちどれですか：
  choices:
    A: 作業区間（工事区間）の標識。
    B: 規制標識。
    C: スクールゾーンの標識。
    D: 案内標識。
  answer: A
  explanation: 道路上の作業区間は、道路沿いで行われている作業の種類に応じて設けられます。作業区域の標識は通常、ひし形でオレンジ色をしており、黒い文字や記号が描かれ、道路上やその近くで人が作業していることを警告する役割を果たします。
- id: 264
  category: vehicle_information
  question: 車に乗る際、小さな子供は：
  choices:
    A: 力の強い大人が抱っこしていれば安全である。
    B: 車の後部座席の床に立っていれば安全である。
    C: 体が小さいため、事故に遭っても怪我をしない。
    D: 車内で立ったまま乗車させては絶対にいけない。
  answer: D
  explanation: 通常のシートベルトを着用するには小さすぎる子供のために、専用のチャイルドシートがあります。事故や急ブレーキの際に、どんな体格の子供であっても安全に抱きかかえていられるほど力の強い人はいません。子供が座席に適切に固定されていない状態で、絶対に車に乗せないでください。
- id: 265
  category: vehicle_information
  question: 自分の車と周囲との間にスペースクッション（安全な車間距離）を確保することが重要なのは、次の理由からです：
  choices:
    A: 他の車からの気を散らす要因を防ぐため。
    B: 予期せぬ状況に反応するための時間的余裕ができるため。
    C: 交通の流れを安全なペースに保つため。
    D: 他の運転手の注意力を保つため。
  answer: B
  explanation: 他の運転手のミスに反応するための十分な時間を確実に確保する唯一の方法は、自分の車と周囲の車との間に十分なスペースを空けることです。
- id: 266
  category: safe_driving_rules
  question: 緊急車両を通過させるために、道路の端に車を寄せて停止しなければならないのは次の場合です：
  choices:
    A: 自分の進行方向に関係なく。
    B: 緊急車両が自分の後ろを走っている場合のみ。
    C: 緊急車両が対向車線から近づいてくる場合のみ。
    D: 上記のどれでもない。
  answer: A
  explanation: 点滅するライトをつけた緊急車両に対しては、それが後ろから近づいてくるか対向車線から近づいてくるかに関わらず、道路の右端に車を寄せて停止しなければなりません。
- id: 267
  category: alcohol_drugs_health
  question: 一酸化炭素中毒を防ぐために、運転者は次のようにすべきです：
  choices:
    A: 排気システムを定期的に点検し、漏れがないことを確認する。
    B: 密閉されたガレージに車があるときはエンジンを切っておく。
    C: 他の車のすぐ後ろを走るときは通気口を閉める。
    D: 上記のすべて。
  answer: D
  explanation: 一酸化炭素のガスは無臭であり、致命的です。一酸化炭素中毒の症状には、突然の疲労感、あくび、めまい、吐き気などがあります。唯一の治療法は、新鮮な空気を十分に供給することです。
- id: 268
  category: safe_driving_rules
  question: 運転手の左腕と手が上に向かって伸ばされています。この手信号（ハンドシグナル）は、運転手が次のようにする予定であることを意味します：
  choices:
    A: 左折する。
    B: 右折する。
    C: 停止する。
    D: 直進する。
  answer: B
  explanation: 運転手の左腕と手が上に向かって伸ばされている場合、右折する意図があることを示しています。この手信号を使っている運転手の後ろを走る場合は、それに応じて自分の運転を調整してください。
- id: 269
  category: safe_driving_rules
  question: 車線変更をする際、してはいけないことは次のうちどれですか：
  choices:
    A: サイドミラーとルームミラーを確認する。
    B: 方向指示器（ウィンカー）を出して意図を伝える。
    C: 自分と同じ車線に移動してくる可能性のある他の運転手を確認する。
    D: 携帯電話を使って警察に連絡し、前方の道路が空いているか確認する。
  answer: D
  explanation: 車線変更をする前に、サイドミラーとルームミラーで後方から近づいてくる車を確認してください。方向指示器を使って、車線変更する予定であることを他の運転手に知らせます。また、同じ車線に移動してくる可能性のある他の運転手も確認してください。
- id: 270
  category: sharing_the_road
  question: 低速走行車の標識（エンブレム）は次のうちどれですか：
  choices:
    A: 長方形の赤い標識。
    B: 円形の緑の標識。
    C: ひし形の黄色の標識。
    D: 三角形のオレンジ色の標識。
  answer: D
  explanation: 低速走行車のシンボルは、反射材を使用したオレンジ色の三角形です。この標識を使用している車両は、25 mph以下の速度で走行していると予想してください。
- id: 271
  category: vehicle_information
  question: ハイビームを使用している対向車が近づいてきた場合、道路の____を見るべきです。
  choices:
    A: どちらかの端
    B: 中央
    C: 右側
    D: 左側
  answer: C
  explanation: 対向車がハイビームを使用しており、ロービームに切り替えない場合は、道路の右側に視線を向けるべきです。これにより、対向車のヘッドライトで目が眩むのを防ぎ、車が通り過ぎるまで進路を維持するのに十分な視界を確保できます。
- id: 272
  category: safe_driving_rules
  question: 高速道路の出口ランプの正しい使用方法は次のうちどれですか。
  choices:
    A: 出口ランプに入る前に減速する。
    B: 出口ランプに入ってから減速する。
    C: 出口ランプに入ったら速度を一定に保つ。
    D: 出口ランプで遅い車を追い越す。
  answer: B
  explanation: 高速道路の出口ランプを使用する際は、出口ランプに入るまで減速しないでください。
- id: 273
  category: vehicle_information
  question: 車に積もった雪や氷は、次のどの部分から取り除くべきですか。
  choices:
    A: 車の窓。
    B: 車のボンネット。
    C: 車の屋根。
    D: 上記すべて。
  answer: D
  explanation: 州法により、運転者は運転前に車からすべての雪と氷を取り除くことが義務付けられています。この法律に従わない運転者には罰金が科せられる場合があります。
- id: 274
  category: safe_driving_rules
  question: 黄色信号の交差点を注意して進み続けてもよいのは、次の場合です。
  choices:
    A: 緊急車両が自分の車線を横切っている場合。
    B: 歩行者が横断している場合。
    C: 右折（または左折）している場合。
    D: 信号が黄色に変わったとき、すでに交差点内にいる場合。
  answer: D
  explanation: すでに交差点内にいるときに黄色の点灯信号が現れた場合は、注意して交差点を通り抜けるべきです。
- id: 275
  category: safe_driving_rules
  question: 交差点に近づいているとき、信号が緑から黄色の点灯に変わりました。あなたはどうするべきですか。
  choices:
    A: 警戒標識と同じとみなし、そのまま交差点を通過する。
    B: 直ちに停止する。
    C: 安全に停止できないほど近づいている場合を除き、交差点に入る前に停止する。
    D: 赤信号になる前に交差点を通過するために加速する。
  answer: C
  explanation: 黄色の点灯信号がある交差点に近づくときは、安全に停止できる場合、交差点に入る前に減速して停止してください。安全に停止できない場合は、注意して交差点を通過してください。
- id: 276
  category: signs_and_signals
  question: 黄色の実線を越えてもよいのは次の場合です。
  choices:
    A: 同じ方向に進む車を追い越すため。
    B: 日中のみ。
    C: いつでも。
    D: 曲がるとき。
  answer: D
  explanation: 原則として、破線の車線は越えることができますが、実線は越えてはいけません。黄色の実線は、運転者が曲がるときにのみ越えることができます。
- id: 277
  category: defensive_driving
  question: 雨天時に運転する場合、次を行わなければなりません。
  choices:
    A: ロービームのヘッドライトを使用する。
    B: ハイビームのヘッドライトを使用する。
    C: パーキングライトを使用する。
    D: ライトを使用しない。
  answer: A
  explanation: 雨天時には、ロービームのヘッドライトを使用するべきです。
- id: 278
  category: vehicle_information
  question: 走行中の自動車内でシートベルトの着用が義務付けられているのは誰ですか。
  choices:
    A: 運転手のみ
    B: 大人の同乗者のみ
    C: 子供の同乗者のみ
    D: 自動車のすべての乗員
  answer: D
  explanation: 州法により、乗用車の運転手およびすべての同乗者はシートベルトを着用しなければなりません。運転手、助手席の同乗者、または18歳未満の子供がシートベルトを着用しない場合、第一級違反（プライマリー・オフェンス）となります。運転手は18歳未満のすべての同乗者に対して責任を負います。第二級違反（セカンダリー・オフェンス）の法律により、別の理由で車両が停止させられた場合、シートベルトを着用していない18歳以上の後部座席の乗員全員に違反切符（呼出状）が発行される可能性があります。
- id: 279
  category: alcohol_drugs_health
  question: 後続車が渋滞するほど遅い速度で運転している場合、あなたはどうするべきですか。
  choices:
    A: 速度を落とす。
    B: 道路の右側に車を寄せて、後続車を先に行かせる。
    C: 他の車に自分の車を追い越させない。
    D: ハザードランプを使用する。
  answer: B
  explanation: 交通の流れよりも遅く運転することは危険を伴う場合があります。片側1車線の対面通行道路で、後続車が渋滞するほど遅く運転している場合は、道路脇に車を寄せて他の車を先に行かせることが義務付けられています。状況により必要な場合にのみ、制限速度を大幅に下回る速度で運転してください。
- id: 280
  category: alcohol_drugs_health
  question: 排気システムの漏れは、次の原因となる可能性があります。
  choices:
    A: 過剰なオイル消費を引き起こす。
    B: 通常よりも早く車のチューンアップが必要になる。
    C: 運転中に眠気を引き起こす。
    D: 田舎道で草火事を起こす。
  answer: C
  explanation: 排気システムは、有毒ガスを排出し、騒音を減らし、稼働中のエンジンから出る高温のガスを冷却する役割を果たします。漏れのある排気システムからの排気ガスは、ごく短時間で死に至る原因となることがあります。また、運転中に眠気を引き起こすこともあります。
- id: 281
  category: safe_driving_rules
  question: 悪天候の場合、トラクタートレーラーが停止するまでに必要な距離は、理想的な運転条件の場合と比べて最大____パーセント長くなる可能性があります。
  choices:
    A: '10'
    B: '25'
    C: '40'
    D: '55'
  answer: B
  explanation: トラクタートレーラーの近くを運転する際は、その大きさが運転にどのような影響を与えるかを認識してください。悪天候の場合、大型車両が完全に停止するまでに必要な距離は、理想的な条件で運転している場合と比べて最大25パーセント長くなる可能性があります。
- id: 282
  category: safe_driving_rules
  question: 大型トラックの近くを運転する際、他のドライバーや道路利用者は次のことを考慮しなければなりません：
  choices:
    A: 大型車両が必要とする停止距離の増加。
    B: 大型車両が必要とする停止距離の減少。
    C: 大型車両の騒音の減少。
    D: 大型車両の速度の増加。
  answer: A
  explanation: 大型トラックの近くを運転する際、他のドライバーや道路利用者は、大型車両が必要とする停止距離の増加を考慮しなければなりません。小型車両のドライバーは、大型車両のドライバーから見える位置に留まり、かつ大型車両によって交通の視界が遮られない位置を維持する必要があります。
- id: 283
  category: safe_driving_rules
  question: 車両の停止距離が依存しないものは次のうちどれですか：
  choices:
    A: あなた自身の反応時間。
    B: 時間帯。
    C: 車両のブレーキの状態。
    D: 車両のタイヤの状態と種類。
  answer: B
  explanation: 車両が停止するために必要な距離は、ドライバーの反応時間、天候や視界の条件、車両の重量、車両のブレーキの状態、車両のタイヤの状態と種類、道路状況、および速度に依存します。
- id: 284
  category: sharing_the_road
  question: 交通法規に従わない自転車の運転手は：
  choices:
    A: 自転車は交通法規に従う必要がないため、正しい。
    B: 交通違反切符を切られる可能性がある。
    C: 常に警察から警告を受ける。
    D: 自転車を押収される。
  answer: B
  explanation: すべての自転車の運転手は、自動車のドライバーと同じ権利、義務、および責任を持っています。交通法規に従わない自動車のドライバーや自転車の運転手は、交通違反切符を切られる可能性があります。
- id: 285
  category: safe_driving_rules
  question: 反対方向に進む車線を分ける路面標示は何色ですか？
  choices:
    A: 黄色
    B: 白色
    C: 黄色と白色
    D: 黄色、白色、黒色
  answer: A
  explanation: 黄色の線は、反対方向に進む車線を分けるために道路の中央で使用されます。
- id: 286
  category: signs_and_signals
  question: 下向きの三角形の標識は：
  choices:
    A: スクールゾーンを示す。
    B: ドライバーに道を譲る（ゆずれ）よう指示する。
    C: 工事区間を示す。
    D: 踏切を示す。
  answer: B
  explanation: 下向きの三角形の標識は、通常、ドライバーが道を譲る（ゆずれ）べきであることを示します。道路に他の車両や歩行者がおらず、安全が確認できたら、ドライバーは進行することができます。
- id: 287
  category: vehicle_information
  question: 死角にいる車両との衝突を避けるために、あなたは次のことを行うべきです：
  choices:
    A: 車線変更をする前に、素早く首を回して死角に車両がいないか確認する。
    B: 数分おきにバックミラーを調整する。
    C: 曲がる直前や車線変更の直前にクラクションを鳴らす。
    D: 上記のどれでもない。
  answer: A
  explanation: 曲がったり車線変更をしたりする前に、移動する方向に首を回して肩越しにちらりと確認し、死角に車両がいないか確認してください。決してミラーだけに頼ってはいけません。
- id: 288
  category: safe_driving_rules
  question: 信号機や遮断機のない踏切を渡る車列にいる場合：
  choices:
    A: あなたに優先権があるため、列車を確認する必要はない。
    B: 踏切を渡っている間、遅い車を追い越してもよい。
    C: 途中で止まることなく、車両が踏切を完全に渡り切るためのスペースがあることを確認する必要がある。
    D: 上記のすべて
  answer: C
  explanation: 踏切で他の車両に続いている場合、線路に進入する前に、完全に渡り切るための十分なスペースがあることを確認してください。踏切に近づく際や渡る際には、決して他の車両を追い越そうとしてはいけません。踏切を渡る前には、常に列車が来ていないか確認してください。
- id: 289
  category: signs_and_signals
  question: 赤い八角形の標識を見た場合、あなたは次のことをしなければなりません：
  choices:
    A: 完全に停止し、歩行者や交差する交通を確認する。
    B: 完全に停止せずに減速する。
    C: 完全に停止し、青信号を待つ。
    D: 減速し、交通を確認する。
  answer: A
  explanation: 八角形の標識はすべて「止まれ（一時停止）」の標識です。一時停止標識のある交差点では、完全に停止し、交差点内の歩行者や交差する交通を確認しなければなりません。交差点の安全が確認できるまで待ってから進行してください。
- id: 290
  category: safe_driving_rules
  question: 複数車線の一方通行の道路や幹線道路から左折する場合、どこから曲がり始めるべきですか：
  choices:
    A: 交差点の中央。
    B: 右車線。
    C: 左車線。
    D: どの車線からでもよい。
  answer: C
  explanation: 複数車線の道路や幹線道路から左折する場合は、左車線から曲がり始めてください。
- id: 291
  category: safe_driving_rules
  question: 作業区間（工事現場）では：
  choices:
    A: 移動している場合と、固定されている場合がある。
    B: 白黒の標識で示されている。
    C: 運転者が減速したり、特別な注意を払う必要はない。
    D: 上記すべて。
  answer: A
  explanation: 作業区間は固定されていることが多いですが、白線引き、草刈り、除雪などの移動する車両の形で存在することもあります。作業区間は、黒い文字や記号が描かれたオレンジ色の標識で示されます。作業区間に近づくときや通過するときは、減速して特別な注意を払ってください。
- id: 292
  category: safe_driving_rules
  question: 点滅する黄色の矢印を表示している信号機に近づいた場合、運転者は：
  choices:
    A: 矢印の方向の車線に合流しなければならない。
    B: 完全に停止しなければならない。
    C: 対向車や歩行者に道を譲った後、左折することができる。
    D: 優先権があり、対向車が自分のために停止することを期待してよい。
  answer: C
  explanation: 点滅する黄色の矢印は、矢印の方向への左折が許可されていることを示します。ただし、対向車線は青信号であるため、対向車や歩行者に道を譲らなければなりません。
- id: 293
  category: safe_driving_rules
  question: 信号や標識のない交差点（無信号交差点）に2台の車両が同時に到着した場合：
  choices:
    A: 最も大きい車両に優先権がある。
    B: 左側の車に優先権がある。
    C: 左側の車は右側の車に道を譲らなければならない。
    D: 右側の車は左側の車に道を譲らなければならない。
  answer: C
  explanation: 信号や標識のない交差点に2台の車両が同時に到着した場合、左側の運転者は右側の運転者に道を譲らなければなりません。その後、左側の運転者は安全が確認できたら進むことができます。
- id: 294
  category: signs_and_signals
  question: 案内標識（Guide signs）は、運転者に方向や距離の情報を提供する____の標識です。
  choices:
    A: 黄色
    B: 赤色
    C: 緑色
    D: 白色
  answer: C
  explanation: 案内標識（目的地標識とも呼ばれます）は緑色の背景で、特定の目的地までの方向や距離の情報を提供します。不慣れな場所を運転する際に役立つ情報源となります。
- id: 295
  category: safe_driving_rules
  question: 追い越しのために二重の黄色い実線の中央線を越えることは合法ですか？
  choices:
    A: はい。
    B: いいえ。
    C: 対向車がいない場合のみ合法。
    D: 前方の車両が制限速度未満で走行している場合のみ合法。
  answer: B
  explanation: 対面通行の道路の中央にある2本の黄色い実線は、道路から曲がって出る場合を除き、どちらの車線からも線を越えてはならないことを意味します。運転者は、私道や商業施設の入り口に出入りする際に二重の黄色い線を越えることができます。黄色い実線を越えての追い越しは禁止されています。
- id: 296
  category: safe_driving_rules
  question: 運転中、以下の状況で車両を停止させることが義務付けられています：
  choices:
    A: 一時停止標識のある交差点。
    B: 赤信号がある場所。
    C: 交通警察官に停止を命じられたとき。
    D: 上記すべて。
  answer: D
  explanation: 運転者が停止を義務付けられる状況には、一時停止標識のある交差点に近づいたとき、赤信号が点滅または点灯している交差点に近づいたとき、または交通警察官が車両に停止を命じたときが含まれます。
- id: 297
  category: penalties_and_points
  question: 次の場合、MVC（自動車委員会）は開始前に路上試験を中止することがあります：
  choices:
    A: 安全でない試験車両を持ち込んだ場合。
    B: 車両のセンターコンソールやその他の装備が、試験官のブレーキペダルへのアクセスを妨げている場合。
    C: 車両にシートベルトがない場合。
    D: 上記すべて。
  answer: D
  explanation: 試験官が試験車両を安全でない、または不適切であると判断した場合、開始前に路上試験が拒否されることがあります。シートベルトがない場合や、試験官がフットブレーキまたはパーキングブレーキにアクセスできない場合、その車両は安全ではないと見なされることがあります。
- id: 298
  category: defensive_driving
  question: 後続車が攻撃的な運転（あおり運転）をしている場合、どうするべきですか？
  choices:
    A: 攻撃的な運転手の進路から外れるようにする。
    B: 追い越していく運転手をじっと見つめる。
    C: 追い越されそうになったらスピードを上げる。
    D: 追い越し車線を塞ぐ。
  answer: A
  explanation: 攻撃的な運転手に遭遇した場合は、できる限りその進路から外れるように努めるべきです。敵対的な運転手とは目を合わせないようにしてください。スピードを上げて敵対的な運転手に対抗しようとすると、相手をさらに怒らせ、危険性を高めるだけです。
- image: stop.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。交通状況や歩行者を確認してから進んでください。
  id: 299
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何を求めていますか？
  choices:
    A: 完全に停止する
    B: スピードを上げて交通に合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 止まらずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（ゆずれ）」の標識は、減速して他の車両や歩行者に優先権を譲らなければならないことを意味します。他の人が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 300
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「進入禁止（DO NOT ENTER）」の標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路で見られ、進入すると対向車と衝突する危険がある場所に設置されています。
  id: 301
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見たら、どうするべきですか？
  choices:
    A: Uターンする
    B: 注意して運転を続ける
    C: 停止して後退するか、方向転換する（逆走しているため）
    D: スピードを上げてそのエリアを早く抜け出す
  answer: C
  explanation: 赤と白の「逆走（WRONG WAY）」の標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に方向転換するか後退してください。
  id: 302
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方向（左方向）に流れている
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「一方通行（ONE WAY）」の標識は、この道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 303
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 他の車両の追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、この場所でのUターン（転回）が禁止されていることを意味します。
  id: 304
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行動は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、この交差点での左折が禁止されていることを意味します。
  id: 305
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、この場所での右折が禁止されていることを意味します。
  id: 306
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道路が狭くなる
    B: この区間では他の車両を追い越してはならない
    C: この先、対面通行
    D: 右側を通行する
  answer: B
  explanation: 黒と白のペナント型（横向きの三角形）の「追い越し禁止区間（NO PASSING ZONE）」の標識は、このエリアで他の車両を追い越してはならないことを意味します。これは追い越し禁止区間の始まりを示しています。
  id: 307
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線減少
  answer: C
  explanation: 矢印が描かれた白い規制標識「右側通行（KEEP RIGHT）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 308
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色から判断して、これはどのような種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事用標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 309
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は、何を警告していますか？
  choices:
    A: この先、動物園またはアニマルパークがある
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟エリアがある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。特に夜明けや夕暮れ時は、速度を落として動物に注意してください。
  id: 310
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先にスクールゾーンあり
    B: この先に横断歩道あり
    C: 近くにハイキングコースあり
    D: この先にバス停あり
  answer: B
  explanation: 歩行者のマークが描かれた黄色いひし形の標識は、この先に横断歩道があることを警告しています。道路を横断する歩行者のために停止する準備をしてください。
  id: 311
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは学校近くの横断歩道
    D: 病院周辺の区域
  answer: C
  explanation: 五角形の蛍光黄緑色の標識は、スクールゾーンまたは学校近くの横断歩道を示しています。減速し、子供に注意してください。
  id: 312
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い丸型の標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウト（環状交差点）あり
    B: 病院周辺の区域
    C: この先に踏切あり
    D: 追い越し禁止区間
  answer: C
  explanation: 黒い「X」と2つの「R」が描かれた黄色い丸型の標識は、この先に踏切があることを事前に警告する標識です。減速し、列車の接近を目と耳で確認してください。
  id: 313
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 学校近くの横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型の踏切標識（クロスバック）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は、停止しなければなりません。
  id: 314
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先行き止まり
    B: 右折必須
    C: この先に右カーブあり
    D: この先に迂回路あり
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先にカーブがあることを警告しています。カーブに入る前に減速してください。
  id: 315
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどう違いますか？
  choices:
    A: より緩やかな曲がり角であることを示している
    B: より大幅な減速を必要とする急カーブを警告している
    C: 右折専用を意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に減速する必要があります。
  id: 316
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道路
    B: この先に単一のカーブあり
    C: 反対方向への2つの連続するカーブ
    D: この先にラウンドアバウト（環状交差点）あり
  answer: C
  explanation: リバースカーブ（S字カーブ）の標識は、この先に反対方向への2つのカーブがあることを警告しています。減速し、道路が一方に曲がった後、もう一方に曲がることに備えてください。
  id: 317
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 単一の急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブや曲がり角あり
    D: この先に坂道あり
  answer: C
  explanation: 連続カーブ（つづら折り）の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 318
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう指示していますか？
  choices:
    A: 車線の減少
    B: 別の道路からの合流車両
    C: 中央分離帯のある道路の始まり
    D: 1車線への道幅減少
  answer: B
  explanation: 黄色いひし形の合流標識は、別の道路からの車両があなたの車線に合流してくることを警告しています。速度と位置を調整する準備をしてください。
  id: 319
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に橋あり
    B: この先、道幅が狭くなる
    C: 車線減少
    D: 中央分離帯のある道路の終わり
  answer: B
  explanation: この警戒標識は、この先の道路が狭くなることを示しています。道路幅の減少に備え、車線内の位置を調整してください。
  id: 320
- image: divided_highway.png
  category: signs_and_signals
  question: この標識は前方に何があることを示していますか？
  choices:
    A: 道路の終点
    B: 対面通行
    C: 中央分離帯のある幹線道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、前方の道路が中央分離帯や防護柵で対向車線と区切られた幹線道路（divided highway）になることを警告しています。右側を通行してください。
  id: 321
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある幹線道路の始まり
    B: 中央分離帯のある幹線道路が終わり、対面通行に戻る
    C: 前方に合流地点がある
    D: 前方で道路工事中
  answer: B
  explanation: この標識は、中央分離帯のある幹線道路が終了することを警告しています。対向車線との間を区切る中央分離帯がなくなります。対面通行に備えてください。
  id: 322
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある幹線道路の始まり
    B: 前方に追い越し可能区間がある
    C: 前方は対面通行 — 車両が双方向に通行する
    D: 前方で車線がシフトする
  answer: C
  explanation: この標識は、前方が対面通行になることを警告しています。一方通行の道路や中央分離帯のある幹線道路から外れ、反対方向に向かう車両とすれ違うことになります。
  id: 323
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状況を警告していますか？
  choices:
    A: 凍結した路面状況
    B: 濡れると滑りやすくなる道路
    C: 前方に曲がりくねった道路がある
    D: でこぼこした舗装
  answer: B
  explanation: 「濡れると滑りやすい（slippery when wet）」の標識は、雨天時や路面が濡れている状態では非常に滑りやすくなることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 324
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 道路の段差
    B: でこぼこした路面
    C: 前方に急な坂道や勾配がある
    D: 道路工事
  answer: C
  explanation: この標識は、前方に急な坂道や勾配があることを警告しています。特にトラックを運転している場合や牽引している場合は、速度を調整し、低速ギアにシフトダウンする必要があるかもしれません。
  id: 325
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: 前方に一時停止標識がある
    B: 前方に信号機がある
    C: 横断歩道（スクールゾーン）
    D: 警察の検問所
  answer: B
  explanation: この標識は、前方に信号機があることを警告しています。信号が赤や黄色の場合は停止する準備をしてください。この標識は、遠くから信号機が見えにくい場所によく設置されます。
  id: 326
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識は前方に何があることを示していますか？
  choices:
    A: 「ゆずれ」の標識 (Yield sign)
    B: 信号機
    C: 必ず停止しなければならない一時停止標識
    D: スピードバンプ（減速帯）
  answer: C
  explanation: この標識は、前方に一時停止標識（Stop sign）があることを警告しています。減速を始め、一時停止標識で完全に停止する準備をしてください。
  id: 327
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 前方に踏切がある
    B: 前方に十字路または交差点がある
    C: 前方に病院がある
    D: 横断歩道
  answer: B
  explanation: この標識は、前方に十字路または4方向の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 328
- image: side_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 前方にT字路がある
    B: 右側から合流する脇道がある
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は、右側から合流する脇道があることを警告しています。脇道から幹線道路に進入してくる車両に注意してください。
  id: 329
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流する
    B: 車線が減少する
    C: 新しい車線が追加される — 合流の必要なし
    D: 右折必須
  answer: C
  explanation: 車線追加（added lane）の標識は、合流を必要とせずに新しい車線が幹線道路に加わることを意味します。ランプから進入する車両には専用の新しい車線が用意されています。
  id: 330
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時の停車
    B: このエリアでの駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「NO PARKING（駐車禁止）」の標識は、このエリアに車を駐車してはならないことを意味します。ただし、乗客の乗り降りのために短時間停車することは認められています。
  id: 331
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識があるスペースには、誰が駐車できますか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用プラカードまたはナンバープレートを掲示している車両のみ
    D: 障害のある同乗者がいるすべての運転手
  answer: C
  explanation: 車椅子のマークが描かれた青い標識は、障害者専用の駐車スペースであることを示しています。有効な障害者用駐車プラカードまたはナンバープレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 332
