questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un Permiso de Instrucción en Nuevo
    México?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: B
  explanation: Según el Manual del Conductor de Nuevo México, una persona debe tener
    al menos 15 años de edad para solicitar un Permiso de Instrucción y debe estar
    inscrita en un programa de educación vial aprobado por el estado o haberlo completado.
- id: 2
  category: license_system
  question: Bajo el sistema de Licencia Graduada (GDL) de Nuevo México, ¿cuánto tiempo
    debe un conductor tener un Permiso de Instrucción antes de solicitar una Licencia
    Provisional?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Nuevo México exige que los conductores adolescentes mantengan
    un Permiso de Instrucción durante un mínimo de seis meses antes de ser elegibles
    para pasar a la etapa de Licencia Provisional.
- id: 3
  category: license_system
  question: Para obtener una Licencia Provisional en Nuevo México, ¿cuántas horas
    de práctica de conducción supervisada se deben registrar, incluyendo horas nocturnas?
  choices:
    A: 40 horas totales, 5 de noche
    B: 50 horas totales, 10 de noche
    C: 60 horas totales, 15 de noche
    D: 30 horas totales, 10 de noche
  answer: B
  explanation: Los solicitantes de una Licencia Provisional deben completar 50 horas
    de conducción supervisada, de las cuales 10 deben ser nocturnas, y estas horas
    deben estar certificadas por un padre o tutor.
- id: 4
  category: license_system
  question: ¿Entre qué horas tiene restringido conducir el titular de una Licencia
    Provisional de Nuevo México, a menos que sea por trabajo o escuela?
  choices:
    A: 10:00 PM y 4:00 AM
    B: 11:00 PM y 5:00 AM
    C: Medianoche y 5:00 AM
    D: Medianoche y 6:00 AM
  answer: C
  explanation: Los titulares de una Licencia Provisional en Nuevo México no pueden
    conducir entre la medianoche y las 5:00 AM, a menos que estén acompañados por
    un adulto con licencia o por razones específicas como empleo o actividades escolares.
- id: 5
  category: license_system
  question: Bajo las leyes de GDL de Nuevo México, ¿cuántos pasajeros menores de 21
    años (que no sean familiares directos) puede tener en el vehículo el titular de
    una Licencia Provisional?
  choices:
    A: Ninguno
    B: No más de uno
    C: No más de dos
    D: No más de tres
  answer: B
  explanation: El titular de una Licencia Provisional no puede tener más de un pasajero
    menor de 21 años que no sea un familiar directo en el vehículo.
- id: 6
  category: license_system
  question: Para pasar de una Licencia Provisional a una Licencia Sin Restricciones
    en Nuevo México, ¿cuántos días antes de la solicitud debe haber estado el conductor
    sin recibir multas?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Nuevo México exige que un conductor no haya sido condenado por una
    infracción de tráfico en los 90 días inmediatamente anteriores a la solicitud
    de una Licencia Sin Restricciones.
- id: 7
  category: license_system
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil por daños
    a la propiedad requerido por ley en Nuevo México?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: B
  explanation: La Ley de Responsabilidad Financiera Obligatoria de Nuevo México exige
    límites mínimos de responsabilidad de $25,000 por lesiones corporales o muerte
    de una persona, $50,000 por lesiones corporales o muerte de dos o más personas,
    y $10,000 por daños a la propiedad (25/50/10).
- id: 8
  category: license_system
  question: Si se muda a una nueva dirección dentro de Nuevo México, ¿cuántos días
    tiene para notificar a la División de Vehículos Motorizados (MVD)?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Nuevo México exige que notifique a la MVD cualquier cambio
    de dirección dentro de los 10 días posteriores a la mudanza.
- id: 9
  category: license_system
  question: En Nuevo México, su licencia de conducir será suspendida por 12 meses
    si acumula ¿cuántos puntos en un período de 12 meses?
  choices:
    A: 6 puntos
    B: 9 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: Si un conductor acumula 12 o más puntos en su historial de manejo dentro
    de un período de 12 meses, su licencia será suspendida por 12 meses.
- id: 10
  category: license_system
  question: Para los conductores menores de 21 años en Nuevo México, ¿cuál es el límite
    de concentración de alcohol en sangre (BAC) que resulta en la revocación de la
    licencia?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: B
  explanation: Nuevo México tiene una ley de 'Tolerancia Cero' para menores; un BAC
    de 0.02% o superior para un conductor menor de 21 años resultará en la revocación
    de la licencia.
- id: 11
  category: license_system
  question: ¿Qué significa la "Ley de Consentimiento Implícito" de Nuevo México para
    los conductores?
  choices:
    A: Usted acepta portar un seguro en todo momento.
    B: Usted acepta someterse a una prueba de aliento o de sangre si un oficial de
      policía sospecha que está conduciendo bajo la influencia (DUI).
    C: Usted acepta permitir pasajeros en su vehículo.
    D: Usted acepta ceder el paso a todos los vehículos de emergencia.
  answer: B
  explanation: La Ley de Consentimiento Implícito significa que, al conducir en Nuevo
    México, usted ha dado su consentimiento para una prueba química de su aliento
    o sangre para determinar el contenido de alcohol o drogas.
- id: 12
  category: license_system
  question: Las licencias de conducir estándar de Nuevo México se emiten típicamente
    por ¿cuál de los siguientes períodos?
  choices:
    A: 2 o 4 años
    B: 4 u 8 años
    C: 5 o 10 años
    D: Anualmente
  answer: B
  explanation: En Nuevo México, los conductores tienen la opción de renovar su licencia
    por un período de 4 u 8 años, con las tarifas ajustadas en consecuencia.
- id: 13
  category: license_system
  question: Para solicitar una licencia de conducir de Nuevo México que cumpla con
    la ley REAL ID, ¿cuántos documentos que prueben la residencia en Nuevo México
    se requieren?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene un certificado de nacimiento
  answer: B
  explanation: Para obtener una REAL ID en Nuevo México, debe proporcionar prueba
    de identificación, prueba del Número de Seguro Social y dos documentos que demuestren
    la residencia en Nuevo México.
- id: 14
  category: license_system
  question: Si un conductor de Nuevo México es menor de 18 años y recibe una citación
    de tráfico, ¿a quién notifica el MVD?
  choices:
    A: Al director de la escuela del conductor
    B: Solo a la compañía de seguros del conductor
    C: Al padre, madre o tutor legal del conductor
    D: No se notifica a nadie excepto al conductor
  answer: C
  explanation: La ley de Nuevo México exige que el MVD (División de Vehículos Motorizados)
    notifique al padre, madre o tutor legal de cualquier conductor menor de 18 años
    que reciba una citación de tráfico.
- id: 15
  category: license_system
  question: ¿Cuál es la edad mínima en la que un conductor puede obtener una Licencia
    sin restricciones en Nuevo México, siempre que haya cumplido con todos los requisitos
    de GDL?
  choices:
    A: 16 años
    B: 16 años y medio
    C: 17 años
    D: 18 años
  answer: B
  explanation: Un conductor que haya tenido una Licencia Provisional durante al menos
    12 meses y haya cumplido con todos los demás requisitos (incluyendo 90 días sin
    citaciones) puede obtener una Licencia sin restricciones a los 16.5 años.
- id: 16
  category: license_system
  question: En Nuevo México, los solicitantes de licencia de conducir por primera
    vez entre las edades de 18 y 24 años deben proporcionar prueba de haber completado
    ¿qué programa específico?
  choices:
    A: El curso de conducción defensiva del National Safety Council
    B: La clase de concientización sobre DWI "None for the Road"
    C: Un registro de 50 horas al volante
    D: El programa AAA Roadwise Driver
  answer: B
  explanation: La ley de Nuevo México exige que todos los solicitantes de licencia
    por primera vez entre 18 y 24 años completen el programa de concientización sobre
    DWI "None for the Road", el cual es administrado por la UNM.
- id: 17
  category: license_system
  question: Para cumplir con los requisitos mínimos de visión para una licencia de
    conducir de Nuevo México, ¿un solicitante debe tener al menos qué agudeza visual
    en al menos un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Según el Manual del Conductor de Nuevo México, los solicitantes deben
    tener una agudeza visual de al menos 20/40 en al menos un ojo, con o sin lentes
    correctivos.
- id: 18
  category: license_system
  question: Si la licencia de conducir de un residente de Nuevo México ha estado vencida
    por más de ______, debe volver a tomar tanto el examen escrito como el de conducción.
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Si una licencia ha estado vencida por un año o más, el solicitante
    debe completar con éxito los exámenes de conocimiento (escrito) y de habilidades
    (conducción) nuevamente.
- id: 19
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para obtener una Tarjeta de Autorización
    de Conducción (DAC) de Nuevo México que difiere de una licencia REAL ID?
  choices:
    A: Debe tener al menos 21 años de edad
    B: No es necesario proporcionar prueba de estatus legal en los Estados Unidos
    C: No es necesario realizar un examen de conducción
    D: Es válida por 10 años en lugar de 8
  answer: B
  explanation: La Tarjeta de Autorización de Conducción (DAC) está disponible para
    los residentes de Nuevo México que no pueden o no desean proporcionar prueba de
    estatus legal o un número de Seguro Social.
- id: 20
  category: license_system
  question: Al solicitar una licencia de conducir de Nuevo México, ¿cuántos documentos
    se requieren para probar su Número de Seguro Social para una licencia que cumpla
    con REAL ID?
  choices:
    A: Un documento
    B: Dos documentos
    C: Tres documentos
    D: Ninguno, puede ser verbal
  answer: A
  explanation: Para una licencia que cumpla con REAL ID en Nuevo México, debe proporcionar
    un documento como prueba de su Número de Seguro Social (como una tarjeta de Seguro
    Social, W-2 o formulario 1099).
- id: 21
  category: license_system
  question: Si cambia su nombre legalmente, la ley de Nuevo México exige que solicite
    una licencia de conducir corregida en un plazo de ¿cuántos días?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: A
  explanation: La ley de Nuevo México (Sección 66-5-22 NMSA 1978) exige que los conductores
    notifiquen al MVD sobre un cambio de nombre y obtengan una licencia de reemplazo
    en un plazo de 10 días.
- id: 22
  category: license_system
  question: Bajo el sistema de puntos de Nuevo México, si acumula entre 6 y 11 puntos
    en un período de 12 meses, ¿qué medida toma el MVD?
  choices:
    A: Suspensión inmediata de 30 días
    B: Escuela de manejo obligatoria
    C: Envía una carta de advertencia
    D: Requiere un nuevo examen de manejo
  answer: C
  explanation: El MVD de Nuevo México envía una carta de advertencia a los conductores
    que acumulan de 6 a 11 puntos en un año para alertarlos sobre el estado de su
    historial de conducción.
- id: 23
  category: license_system
  question: ¿Cuál es la tarifa estándar para restablecer una licencia de conducir
    de Nuevo México que fue suspendida por motivos ajenos a un DWI o manutención infantil?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: La tarifa general de restablecimiento de una licencia suspendida en
    Nuevo México es de $25, aunque las tarifas por revocaciones relacionadas con un
    DWI son significativamente más altas.
- id: 24
  category: license_system
  question: En Nuevo México, ¿qué edad mínima debe tener una persona para solicitar
    una Licencia de Conducir Comercial (CDL) para conducir en el comercio interestatal?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: Si bien una persona puede obtener una CDL para conducir de manera intraestatal
    (dentro de NM) a los 18 años, las leyes federales y estatales exigen que un conductor
    tenga al menos 21 años para conducir en el comercio interestatal.
- id: 25
  category: license_system
  question: Los residentes de Nuevo México que tienen 75 años de edad o más, ¿cada
    cuánto tiempo deben renovar su licencia de conducir?
  choices:
    A: Cada año
    B: Cada 2 años
    C: Cada 4 años
    D: Cada 8 años
  answer: A
  explanation: Los conductores de 75 años de edad o más deben renovar su licencia
    de conducir de Nuevo México anualmente, y se les exonera del pago de la tarifa
    de renovación.
- id: 26
  category: license_system
  question: ¿Cuál de los siguientes es un requisito obligatorio para cualquier conductor
    condenado por un DWI en Nuevo México que desee obtener una licencia restringida
    para conducir al trabajo?
  choices:
    A: Una carta de su empleador
    B: Una Licencia de Interbloqueo de Encendido (Ignition Interlock License)
    C: Una fianza en efectivo de $500
    D: Una evaluación psicológica
  answer: B
  explanation: Nuevo México requiere una Licencia de Interbloqueo de Encendido para
    cualquier persona cuyos privilegios de conducción hayan sido revocados por un
    DWI, lo que les permite conducir vehículos equipados con un dispositivo de interbloqueo.
- id: 27
  category: license_system
  question: ¿Cuántos días antes de que expire su licencia de conducir actual de Nuevo
    México se le permite renovarla?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: En Nuevo México, puede renovar su licencia de conducir hasta 90 días
    antes de la fecha de vencimiento.
- id: 28
  category: license_system
  question: 'Para obtener un endoso de motocicleta (Clase M) en Nuevo México, los
    solicitantes menores de 18 años deben:'
  choices:
    A: Hacer que un padre viaje con ellos durante 50 horas
    B: Completar un curso básico de seguridad para motociclistas
    C: Solo aprobar un examen escrito
    D: Esperar hasta tener una licencia Clase D sin restricciones
  answer: B
  explanation: Nuevo México exige que los solicitantes menores de 18 años completen
    con éxito un curso de seguridad para motociclistas aprobado por el MVD para recibir
    un endoso de motocicleta.
- id: 29
  category: license_system
  question: Si es menor de 18 años y solicita un Permiso de Instrucción de Nuevo México,
    ¿de quién se requiere la firma en la solicitud?
  choices:
    A: Solo la del solicitante
    B: La del director de una escuela
    C: La de un padre o tutor legal
    D: Solo la de un notario público
  answer: C
  explanation: Para los solicitantes menores de 18 años, un padre o tutor legal debe
    firmar la solicitud, aceptando la responsabilidad financiera por la conducción
    del menor.
- id: 30
  category: license_system
  question: ¿Cuál de las siguientes NO es una razón válida para que el MVD de Nuevo
    México se niegue a emitir o renovar una licencia de conducir?
  choices:
    A: Falta de pago de la manutención infantil
    B: Órdenes de arresto de tráfico pendientes
    C: Falta de un diploma de escuela secundaria
    D: Condiciones médicas que hacen que la conducción sea insegura
  answer: C
  explanation: Nuevo México no requiere un diploma de escuela secundaria para tener
    una licencia de conducir. Sin embargo, la morosidad en la manutención infantil,
    las órdenes de arresto y los problemas de seguridad médica son motivos legales
    para la denegación.
- id: 31
  category: driver_testing
  question: Además del requisito de agudeza visual de 20/40, ¿cuál es el campo de
    visión mínimo requerido para aprobar el examen de la vista de Nuevo México?
  choices:
    A: 90 grados
    B: 100 grados
    C: 120 grados
    D: 140 grados
  answer: C
  explanation: Para aprobar el examen de la vista de Nuevo México, el solicitante
    debe tener un campo de visión de al menos 120 grados en al menos un ojo o en ambos
    ojos juntos.
- id: 32
  category: driver_testing
  question: Si un solicitante reprueba el examen de manejo (habilidades) de Nuevo
    México, ¿cuánto tiempo debe esperar antes de ser elegible para volver a tomarlo?
  choices:
    A: 24 horas
    B: 3 días
    C: 1 semana
    D: 30 días
  answer: C
  explanation: Según el MVD de Nuevo México, si no aprueba el examen de manejo, debe
    esperar al menos una semana antes de poder realizar el examen nuevamente.
- id: 33
  category: driver_testing
  question: ¿Cuál es la puntuación mínima de aprobación para el examen escrito de
    conocimientos de Nuevo México?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: El examen escrito de Nuevo México consta de 25 preguntas; un solicitante
    debe responder correctamente al menos 20 (80%) para aprobar.
- id: 34
  category: driver_testing
  question: La ley de Nuevo México requiere un mínimo de ¿cuánto seguro de responsabilidad
    civil por 'lesiones corporales' por la muerte o lesión de una persona en cualquier
    accidente?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La Ley de Responsabilidad Financiera Obligatoria requiere una cobertura
    mínima por lesiones corporales de $25,000 para una persona y $50,000 para dos
    o más personas.
- id: 35
  category: driver_testing
  question: Bajo el sistema de puntos de Nuevo México, ¿cuántos puntos se asignan
    a su historial de manejo por conducir a 26 mph o más sobre el límite de velocidad
    establecido?
  choices:
    A: 3 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: Conducir a 26 mph o más sobre el límite es una de las infracciones
    con mayor puntaje en Nuevo México, resultando en 8 puntos.
- id: 36
  category: driver_testing
  question: ¿Cuántos puntos se agregan a un historial de manejo de Nuevo México por
    la infracción de 'rebasar un autobús escolar' mientras sus luces rojas parpadean
    y el brazo de parada está extendido?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Rebasar un autobús escolar que está detenido para recoger o dejar niños
    es una infracción grave en Nuevo México y conlleva una penalización de 6 puntos.
- id: 37
  category: driver_testing
  question: En Nuevo México, la 'conducción temeraria' (Reckless Driving) conlleva
    una penalización de ¿cuántos puntos en su historial de manejo?
  choices:
    A: 3 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción temeraria está categorizada como una infracción de 6
    puntos en el sistema de puntos de Nuevo México.
- id: 38
  category: driver_testing
  question: Si cambia legalmente su nombre (por ejemplo, por matrimonio o por orden
    judicial), debe solicitar una licencia de reemplazo de Nuevo México dentro de
    ¿cuántos días?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: La ley de Nuevo México exige que notifique al MVD y actualice su licencia
    dentro de los 30 días posteriores a un cambio de nombre legal.
- id: 39
  category: driver_testing
  question: El curso de concientización sobre DWI 'None for the Road', requerido para
    ciertos solicitantes de Nuevo México, es administrado por ¿qué institución?
  choices:
    A: Policía Estatal de Nuevo México
    B: Universidad de Nuevo México (UNM)
    C: Departamento de Transporte
    D: Sede Central del MVD
  answer: B
  explanation: El curso de concientización sobre DWI 'None for the Road' es un programa
    de autoestudio administrado por el departamento de Educación Continua de la Universidad
    de Nuevo México (UNM).
- id: 40
  category: driver_testing
  question: Si aprueba el examen de la vista solo mientras usa anteojos o lentes de
    contacto, ¿qué código de restricción se colocará en su licencia de Nuevo México?
  choices:
    A: Restricción A
    B: Restricción B
    C: Restricción C
    D: Restricción G
  answer: B
  explanation: La Restricción B es el código estándar utilizado en Nuevo México para
    indicar que el conductor debe usar lentes correctivos al operar un vehículo.
- id: 41
  category: driver_testing
  question: Antes de comenzar el examen de conducción de Nuevo México, el examinador
    realizará una inspección de seguridad del vehículo. ¿Cuál de las siguientes situaciones
    causaría que el examen se posponga?
  choices:
    A: La falta de radio
    B: Luces direccionales o de freno rotas
    C: Una pequeña abolladura en el parachoques
    D: Líquido limpiaparabrisas vacío
  answer: B
  explanation: El vehículo utilizado para el examen de conducción debe estar en condiciones
    de funcionamiento seguras. Las luces direccionales o de freno que no funcionan
    son peligros de seguridad que resultarán en la posposición del examen.
- id: 42
  category: driver_testing
  question: Para los conductores menores de 18 años, ¿quién tiene la autoridad legal
    para solicitar que el MVD cancele la licencia o el permiso del menor en cualquier
    momento?
  choices:
    A: El director de la escuela del menor
    B: El agente de seguros del menor
    C: La persona que firmó el formulario de consentimiento de los padres
    D: Cualquier pariente adulto mayor de 21 años
  answer: C
  explanation: La persona que firma el formulario de responsabilidad financiera o
    consentimiento para un menor puede retirar su consentimiento en cualquier momento
    presentando una solicitud por escrito, lo que conlleva la cancelación de los privilegios
    de conducción del menor.
- id: 43
  category: driver_testing
  question: Si un residente de Nuevo México se encuentra en servicio militar activo
    fuera del estado, ¿su licencia de conducir sigue siendo válida hasta cuántos días
    después de su baja del servicio?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Nuevo México ofrece una extensión para el personal militar en servicio
    activo; su licencia sigue siendo válida hasta 30 días después de que sean dados
    de baja o regresen al estado.
- id: 44
  category: driver_testing
  question: ¿Cuál es el costo del curso de autoestudio de concientización sobre DWI
    "None for the Road" requerido para quienes obtienen su licencia por primera vez
    en Nuevo México y tienen entre 18 y 24 años?
  choices:
    A: $10
    B: $25
    C: $50
    D: $75
  answer: B
  explanation: El costo del curso "None for the Road" es de $25, lo cual cubre los
    materiales de estudio y la administración del programa por parte de la UNM.
- id: 45
  category: driver_testing
  question: Antes de comenzar el examen de habilidades de conducción de Nuevo México,
    ¿qué documentos debe proporcionar el solicitante para el vehículo que se utilizará?
  choices:
    A: El título del vehículo y una factura de venta
    B: Registro vigente del vehículo y comprobante de seguro de responsabilidad civil
      actual
    C: Una carta notariada del propietario del vehículo
    D: Los registros de mantenimiento del vehículo de los últimos 12 meses
  answer: B
  explanation: Para realizar el examen de conducción en Nuevo México, debe proporcionar
    un vehículo que esté en condiciones de funcionamiento seguras, junto con su registro
    vigente y comprobante de seguro de responsabilidad civil actual.
- id: 46
  category: driver_testing
  question: Para aprobar el examen escrito de conocimientos de Nuevo México, ¿un solicitante
    debe responder correctamente al menos cuántas preguntas de 25?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '22'
  answer: B
  explanation: El examen escrito del MVD de Nuevo México consta de 25 preguntas, y
    la puntuación para aprobar es del 72%, lo que requiere responder correctamente
    al menos 18 preguntas.
- id: 47
  category: driver_testing
  question: Si se le condena por exceso de velocidad de 16 a 25 millas por hora sobre
    el límite de velocidad indicado en Nuevo México, ¿cuántos puntos se añadirán a
    su historial de conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: C
  explanation: El sistema de puntos de Nuevo México asigna 5 puntos por exceder el
    límite de velocidad entre 16 y 25 mph. Exceder el límite entre 6 y 15 mph resulta
    en 3 puntos.
- id: 48
  category: driver_testing
  question: Los nuevos residentes de Nuevo México deben registrar sus vehículos dentro
    de ¿cuántos días después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: De acuerdo con la ley de Nuevo México, los nuevos residentes deben
    registrar sus vehículos y obtener una placa de Nuevo México dentro de los 30 días
    posteriores al establecimiento de su residencia.
- id: 49
  category: driver_testing
  question: ¿A qué nivel de puntos enviará el MVD de Nuevo México una carta de advertencia
    a la dirección del domicilio de un conductor con respecto a sus puntos acumulados?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 9 puntos
    D: 12 puntos
  answer: B
  explanation: El MVD envía una carta de advertencia a los conductores que han acumulado
    6 puntos en un período de 12 meses para informarles sobre el estado de su historial
    de conducción.
- id: 50
  category: driver_testing
  question: Durante el examen de habilidades de conducción de Nuevo México, ¿cuál
    de las siguientes acciones resultará en una reprobación inmediata?
  choices:
    A: No usar una luz direccional una vez
    B: Golpear un bordillo o acera
    C: Ajustar los espejos antes de comenzar
    D: Conducir a 2 mph por debajo del límite de velocidad
  answer: B
  explanation: Golpear un bordillo, acera o cualquier otro objeto, así como cometer
    cualquier infracción de tráfico o maniobra peligrosa, resulta en la reprobación
    inmediata del examen de conducción de Nuevo México.
- id: 51
  category: driver_testing
  question: ¿Qué maniobra específica es un requisito estándar del examen de habilidades
    viales de Nuevo México para una licencia Clase D?
  choices:
    A: Incorporación a alta velocidad
    B: Estacionamiento en paralelo
    C: Recuperación fuera de la carretera
    D: Conducir en una rotonda
  answer: B
  explanation: El estacionamiento en paralelo es un componente obligatorio del examen
    de habilidades viales de Nuevo México para demostrar la capacidad del conductor
    para controlar el vehículo en espacios reducidos.
- id: 52
  category: driver_testing
  question: En Nuevo México, ¿cuántos puntos se asignan por 'No ceder el paso' (Failure
    to Yield)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: B
  explanation: No ceder el derecho de paso en Nuevo México resulta en la adición de
    3 puntos a su historial de manejo.
- id: 53
  category: driver_testing
  question: ¿Cuál es la penalización de puntos en Nuevo México por 'Seguir demasiado
    de cerca' (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: A
  explanation: Seguir demasiado de cerca, o 'tailgating', es una infracción de 2 puntos
    en el estado de Nuevo México.
- id: 54
  category: driver_testing
  question: Al renovar una licencia de conducir de Nuevo México, ¿cuántos días antes
    de la fecha de vencimiento se le permite solicitar la renovación?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Los residentes de Nuevo México pueden renovar su licencia de conducir
    hasta 90 días antes de que expire la licencia actual.
- id: 55
  category: driver_testing
  question: Si un vehículo utilizado para el examen vial de Nuevo México tiene una
    grieta en el parabrisas que obstruye la vista del conductor, ¿qué sucederá?
  choices:
    A: El examinador la ignorará si es pequeña
    B: Se le permitirá al solicitante realizar el examen pero deberá repararla más
      tarde
    C: El vehículo será rechazado y el examen será pospuesto
    D: El solicitante recibirá una deducción automática de 10 puntos
  answer: C
  explanation: El vehículo utilizado para el examen vial debe estar en condiciones
    seguras de funcionamiento. Las grietas en el parabrisas que obstruyan la vista
    del conductor o del examinador son motivo para rechazar el vehículo para la prueba.
- id: 56
  category: driver_testing
  question: En Nuevo México, ¿cuántos puntos se asignan por una condena de 'No señalar'
    (Failure to Signal) al girar o cambiar de carril?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: No utilizar la señal de giro (direccional) cuando es necesario resulta
    en la adición de 2 puntos a su historial de manejo de Nuevo México.
- id: 57
  category: driver_responsibility
  question: En Nuevo México, debe notificar inmediatamente a la policía sobre un accidente
    si este resulta en lesiones, muerte o daños a la propiedad que excedan ¿qué cantidad?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: De acuerdo con el Manual del Conductor de Nuevo México, cualquier accidente
    que resulte en lesiones corporales, muerte o daños a la propiedad de $500 o más
    debe informarse a la policía de inmediato.
- id: 58
  category: driver_responsibility
  question: Bajo la Ley de Responsabilidad Financiera Obligatoria de Nuevo México,
    ¿cuál es el monto mínimo de seguro de responsabilidad por lesiones corporales
    requerido para una persona?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: D
  explanation: La ley de Nuevo México requiere un mínimo de $25,000 por lesiones corporales
    o muerte de una persona en cualquier accidente.
- id: 59
  category: driver_responsibility
  question: Cuando compra un vehículo a un particular en Nuevo México, ¿cuántos días
    tiene para registrar el vehículo y transferir el título?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: En Nuevo México, debe solicitar un certificado de título y registro
    dentro de los 30 días posteriores a la compra de un vehículo a un particular.
- id: 60
  category: driver_responsibility
  question: 'Una primera condena por DWI (conducir bajo la influencia) en Nuevo México
    puede resultar en una sentencia de cárcel de hasta:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Una primera condena por DWI es un delito menor que puede resultar en
    una sentencia de cárcel de hasta 90 días, junto con multas y otras penalizaciones.
- id: 61
  category: driver_responsibility
  question: ¿En Nuevo México, por cuánto tiempo debe un conductor condenado por una
    primera infracción de DWI utilizar un dispositivo de interbloqueo de encendido?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: B
  explanation: La ley de Nuevo México exige que todos los infractores de DWI por primera
    vez instalen y utilicen un dispositivo de interbloqueo de encendido por un período
    de un año.
- id: 62
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por una primera condena por arrojar basura desde
    un vehículo en Nuevo México?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Arrojar basura en Nuevo México es un delito menor leve y puede resultar
    en una multa de hasta $1,000 y/o hasta 90 días de cárcel.
- id: 63
  category: driver_responsibility
  question: 'Bajo la Ley de Responsabilidad Parental de Nuevo México, su licencia
    de conducir puede ser suspendida por:'
  choices:
    A: No asistir a una conferencia de padres y maestros
    B: Falta de pago de la manutención infantil
    C: Permitir que un menor conduzca sin un permiso
    D: No firmar el boletín de calificaciones de un niño
  answer: B
  explanation: La Ley de Responsabilidad Parental permite al MVD suspender la licencia
    de conducir de cualquier persona que no cumpla con una orden de manutención infantil.
- id: 64
  category: driver_responsibility
  question: Si no renueva el registro de su vehículo en Nuevo México dentro de los
    30 días posteriores a su vencimiento, ¿cuál es el cargo por penalización por retraso?
  choices:
    A: Tarifa fija de $10
    B: 25% de la tarifa de registro
    C: 50% de la tarifa de registro
    D: 75% de la tarifa de registro
  answer: D
  explanation: La ley de Nuevo México impone una penalización del 75% de la tarifa
    de registro si la renovación tiene más de 30 días de retraso.
- id: 65
  category: driver_responsibility
  question: Si usted está involucrado en un accidente en Nuevo México y la policía
    no investiga, ¿dentro de cuántos días debe presentar un informe por escrito (Formulario
    MVD-10279)?
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: Si un accidente no es investigado por un oficial de la ley y resulta
    en lesiones o daños superiores a $500, debe presentar un informe por escrito al
    MVD dentro de los 5 días.
- id: 66
  category: driver_responsibility
  question: 'En Nuevo México, una condena por ''Recipiente Abierto'' (primera infracción)
    puede resultar en una multa de hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Una primera infracción por recipiente abierto es un delito menor castigado
    con una multa de hasta $500 y/o hasta 90 días de cárcel.
- id: 67
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan por 'Seguir demasiado de cerca' (tailgating)
    en Nuevo México?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Seguir demasiado de cerca es una infracción de 3 puntos en el historial
    de conducción de Nuevo México.
- id: 68
  category: driver_responsibility
  question: ¿En Nuevo México, cuál es la cobertura mínima de seguro de responsabilidad
    civil requerida por lesiones corporales o muerte de dos o más personas en un solo
    accidente?
  choices:
    A: $30,000
    B: $40,000
    C: $50,000
    D: $60,000
  answer: C
  explanation: La Ley de Responsabilidad Financiera Obligatoria de Nuevo México exige
    un mínimo de $50,000 por lesiones corporales o muerte de dos o más personas en
    un solo accidente.
- id: 69
  category: driver_responsibility
  question: Si usted está involucrado en un accidente de vehículo motorizado en Nuevo
    México que resulta en daños a la propiedad, ¿a partir de qué cantidad en dólares
    debe informarse el accidente a la policía de inmediato?
  choices:
    A: Más de $100
    B: Más de $250
    C: Más de $500
    D: Más de $1,000
  answer: C
  explanation: De acuerdo con la ley de Nuevo México (66-7-207), cualquier accidente
    que resulte en lesiones corporales, muerte o daños a la propiedad de $500 o más
    debe informarse a la policía de inmediato.
- id: 70
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por una primera infracción por no presentar evidencia
    de responsabilidad financiera (seguro) en Nuevo México?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: Una primera condena por conducir sin seguro en Nuevo México puede resultar
    en una multa de hasta $300 y la suspensión del registro del vehículo.
- id: 71
  category: driver_responsibility
  question: Si cambia su nombre debido a un matrimonio o una orden judicial, ¿cuántos
    días tiene para notificar al MVD de Nuevo México y obtener una licencia corregida?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: La ley de Nuevo México exige que los conductores notifiquen al MVD
    sobre un cambio de nombre o dirección en un plazo de 10 días.
- id: 72
  category: driver_responsibility
  question: En Nuevo México, ¿cuántos puntos se asignan a su historial de conducción
    por una condena de 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción grave en Nuevo
    México y resulta en la adición de 6 puntos al historial del conductor.
- id: 73
  category: driver_responsibility
  question: ¿Por cuánto tiempo permanecen generalmente en el historial de conducción
    los puntos asignados a una licencia de conducir de Nuevo México por infracciones
    de tráfico?
  choices:
    A: 6 meses
    B: 12 meses
    C: 24 meses
    D: 36 meses
  answer: B
  explanation: En Nuevo México, los puntos por la mayoría de las infracciones de tráfico
    se eliminan del historial de conducción 12 meses después de la fecha de la infracción.
- id: 74
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al registro
    de un vehículo en Nuevo México?
  choices:
    A: El certificado de registro debe mantenerse en el vehículo o ser portado por
      el conductor.
    B: El certificado de registro debe guardarse en casa en un lugar seguro.
    C: Solo se requiere que la tarjeta de seguro esté en el vehículo.
    D: El registro solo es obligatorio para los vehículos que circulan por autopistas
      interestatales.
  answer: A
  explanation: La ley de Nuevo México exige que el certificado de registro se lleve
    en el vehículo o que lo porte la persona que conduce el vehículo en todo momento.
- id: 75
  category: driver_responsibility
  question: Si un conductor de Nuevo México es condenado por un DUI, ¿cuál de los
    siguientes debe obtener para continuar conduciendo legalmente durante su período
    de revocación?
  choices:
    A: Un permiso de trabajo restringido
    B: Una Licencia de Dispositivo de Bloqueo de Encendido (Ignition Interlock License)
    C: Un permiso temporal de papel
    D: Una exención por dificultades económicas
  answer: B
  explanation: Nuevo México exige que todos los infractores de DUI obtengan una Licencia
    de Dispositivo de Bloqueo de Encendido e instalen un dispositivo de bloqueo en
    cualquier vehículo que conduzcan.
- id: 76
  category: driver_responsibility
  question: En Nuevo México, ¿qué sucede si no comparece (FTA) ante el tribunal por
    una citación de tráfico?
  choices:
    A: Sus tarifas de seguro se duplicarán automáticamente.
    B: El MVD suspenderá su privilegio de conducir.
    C: Los puntos por la infracción se duplicarán.
    D: No sucede nada hasta que intente renovar su licencia.
  answer: B
  explanation: No comparecer ante el tribunal o no pagar una multa por una citación
    de tráfico en Nuevo México resultará en la suspensión de su licencia de conducir.
- id: 77
  category: driver_responsibility
  question: 'Bajo la ley de ''Contenedor Abierto'' (Open Container) de Nuevo México,
    es ilegal:'
  choices:
    A: Tener cualquier bebida alcohólica en el maletero del coche.
    B: Tener un contenedor abierto de alcohol en la guantera.
    C: Transportar cerveza sin abrir en el área de pasajeros.
    D: Tener un contenedor abierto de alcohol en el área de pasajeros de un vehículo
      motorizado en una vía pública.
  answer: D
  explanation: La ley de Nuevo México prohíbe que cualquier persona tenga un contenedor
    abierto de una bebida alcohólica en el área de pasajeros de un vehículo motorizado
    mientras se encuentre en una vía pública.
- id: 78
  category: driver_responsibility
  question: Si usted es residente de Nuevo México y compra un vehículo a un concesionario,
    ¿quién es normalmente responsable de presentar la solicitud de título y registro?
  choices:
    A: El comprador siempre debe hacerlo personalmente.
    B: El concesionario está obligado a presentar los documentos al MVD.
    C: El departamento de policía local.
    D: La compañía de seguros.
  answer: B
  explanation: En Nuevo México, cuando se compra un vehículo a un concesionario autorizado,
    la ley exige que el concesionario se encargue de los trámites de título y registro
    para el comprador.
- id: 79
  category: driver_responsibility
  question: En Nuevo México, si su licencia es suspendida debido a la acumulación
    de 12 puntos en 12 meses, ¿cuánto tiempo dura el período de suspensión?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Si un conductor acumula 12 o más puntos en un período de 12 meses,
    su licencia de conducir de Nuevo México será suspendida por un período de 12 meses.
- id: 80
  category: safe_driving_rules
  question: En Nuevo México, ¿cuál es el límite de velocidad estándar en una zona
    escolar cuando hay niños presentes o cuando lo indican las señales?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Según el Manual del Conductor de Nuevo México, el límite de velocidad
    en una zona escolar es de 15 mph, a menos que se indique lo contrario.
- id: 81
  category: safe_driving_rules
  question: ¿Al estacionar su vehículo cerca de un hidrante de incendios en Nuevo
    México, cuál es la distancia mínima que debe mantener?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Nuevo México prohíbe estacionarse a menos de 15 pies de un
    hidrante de incendios.
- id: 82
  category: safe_driving_rules
  question: En Nuevo México, ¿se prohíbe estacionar a menos de cuántos pies de una
    señal de alto (stop), una señal de ceder el paso (yield) o un semáforo?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Según la ley de Nuevo México, no puede estacionarse a menos de 30 pies
    de cualquier baliza intermitente, señal de alto, señal de ceder el paso o semáforo
    ubicado al lado de una calzada.
- id: 83
  category: safe_driving_rules
  question: De acuerdo con la ley de 'Moverse' (Move Over) de Nuevo México, ¿qué debe
    hacer un conductor al acercarse a un vehículo de emergencia estacionado con sus
    luces intermitentes en una carretera de varios carriles?
  choices:
    A: Detenerse por completo hasta que el vehículo de emergencia se retire.
    B: Mantener la velocidad pero tocar la bocina para alertar a los socorristas.
    C: Cambiarse a un carril que no sea adyacente al vehículo, o reducir la velocidad
      si cambiar de carril no es seguro.
    D: Aumentar la velocidad para pasar por el área lo más rápido posible.
  answer: C
  explanation: La ley de Moverse de Nuevo México exige que los conductores se muevan
    a un carril que no sea adyacente al vehículo de emergencia si es posible; de lo
    contrario, deben reducir la velocidad y proceder con precaución.
- id: 84
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene en una carretera con una mediana
    física o divisor, ¿qué vehículos están obligados a detenerse ante las luces rojas
    intermitentes del autobús?
  choices:
    A: Todos los vehículos en ambas direcciones.
    B: Solo los vehículos que viajan en la misma dirección que el autobús.
    C: Solo los vehículos que viajan en la dirección opuesta al autobús.
    D: No se requiere que ningún vehículo se detenga si hay una mediana.
  answer: B
  explanation: En Nuevo México, si un autobús se detiene en una carretera dividida
    con una mediana física, solo el tráfico que sigue al autobús debe detenerse. El
    tráfico al otro lado de la mediana no necesita detenerse.
- id: 85
  category: safe_driving_rules
  question: Al rebasar una bicicleta en Nuevo México, ¿cuál es la distancia legal
    mínima que un automovilista debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Nuevo México exige que los automovilistas dejen al menos
    tres pies de espacio al rebasar una bicicleta.
- id: 86
  category: safe_driving_rules
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de construcción
    señalizada en Nuevo México cuando hay trabajadores presentes?
  choices:
    A: Una multa fija de $500.
    B: Suspensión obligatoria de la licencia.
    C: Las multas se duplican.
    D: Se requiere servicio comunitario.
  answer: C
  explanation: En Nuevo México, las multas de tráfico se duplican por infracciones
    que ocurren en una zona de obras viales designada cuando hay trabajadores presentes.
- id: 87
  category: safe_driving_rules
  question: ¿Cuántos pies antes de girar debe activar su señal de giro en Nuevo México?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: La ley de Nuevo México exige que los conductores indiquen su intención
    de girar al menos 100 pies antes del giro real.
- id: 88
  category: safe_driving_rules
  question: 'En Nuevo México, es ilegal dar una vuelta en U en una curva o cerca de
    la cima de una colina si su vehículo no puede ser visto por otros conductores
    que se acerquen desde cualquier dirección dentro de:'
  choices:
    A: 500 pies
    B: 750 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: El estatuto 66-7-323 de Nuevo México establece que las vueltas en U
    están prohibidas en curvas o colinas donde la visibilidad sea inferior a 1,000
    pies en cualquier dirección.
- id: 89
  category: safe_driving_rules
  question: 'Un conductor en Nuevo México debe presentar un informe de accidente a
    la policía si el choque resulta en lesiones, muerte o daños a la propiedad que
    excedan los:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,500
  answer: B
  explanation: La ley de Nuevo México exige un informe inmediato a la policía por
    cualquier accidente que involucre lesiones, muerte o daños a la propiedad de $500
    o más.
- id: 90
  category: safe_driving_rules
  question: Al conducir de noche en Nuevo México, ¿debe bajar las luces altas (cambiar
    a luz de cruce) cuando se encuentre a cuántos pies de un vehículo que viene en
    sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Nuevo México exige que los conductores bajen las luces altas
    cuando un vehículo que viene en sentido contrario está a menos de 500 pies.
- id: 91
  category: safe_driving_rules
  question: ¿Hacia dónde deben girarse las ruedas delanteras al estacionar un vehículo
    cuesta abajo en una calle de doble sentido con bordillo?
  choices:
    A: Hacia el bordillo.
    B: Lejos del bordillo.
    C: Paralelo al bordillo.
    D: Hacia la izquierda.
  answer: A
  explanation: Al estacionar cuesta abajo, debe girar las ruedas hacia el bordillo
    para que, si el vehículo rueda, lo haga hacia el bordillo en lugar de hacia el
    tráfico.
- id: 92
  category: safe_driving_rules
  question: En Nuevo México, ¿para qué se utiliza la "Regla de los tres segundos"?
  choices:
    A: El tiempo permitido para pasar por una luz amarilla.
    B: El tiempo que debe esperar después de que una luz cambie a verde.
    C: Determinar una distancia de seguimiento segura detrás del vehículo que va delante
      de usted.
    D: El tiempo permitido para permanecer detenido en una señal de alto.
  answer: C
  explanation: El Manual del Conductor de Nuevo México recomienda una distancia de
    seguimiento de tres segundos para asegurar que tenga suficiente tiempo para reaccionar
    ante peligros.
- id: 93
  category: safe_driving_rules
  question: Según la ley de Nuevo México, ¿cuándo se permite girar a la derecha con
    luz roja?
  choices:
    A: Nunca.
    B: Solo si hay una flecha verde.
    C: Después de detenerse por completo y ceder el paso a peatones y al tráfico transversal,
      a menos que una señal lo prohíba.
    D: Solo durante las horas del día.
  answer: C
  explanation: En Nuevo México, puede girar a la derecha en rojo después de una parada
    completa y de ceder el paso al tráfico y a los peatones, siempre que no haya una
    señal que prohíba el giro.
- id: 94
  category: safe_driving_rules
  question: En Nuevo México, ¿cuál es el límite de velocidad máximo para un distrito
    comercial o residencial a menos que se indique lo contrario?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: Según la ley estatal de Nuevo México (66-7-301 NMSA), el límite de
    velocidad en cualquier distrito comercial o residencial es de 25 mph a menos que
    se indique una velocidad diferente.
- id: 95
  category: safe_driving_rules
  question: Según la ley de Nuevo México, ¿a cuántos pies de distancia debe estacionarse
    de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Nuevo México prohíbe estacionar a menos de 15 pies de un
    hidrante de incendios.
- id: 96
  category: safe_driving_rules
  question: Al rebasar a otro vehículo en Nuevo México, ¿a cuántos pies de un vehículo
    que viene en sentido contrario debe estar antes de regresar a su carril?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Al rebasar, debe regresar a su carril antes de estar a menos de 200
    pies de cualquier vehículo que se aproxime en dirección opuesta.
- id: 97
  category: safe_driving_rules
  question: Según el Manual del Conductor de Nuevo México, ¿cuál es la distancia mínima
    que un automovilista debe mantener al rebasar una bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: C
  explanation: La ley de Nuevo México exige que los automovilistas den a los ciclistas
    al menos 5 pies de espacio al rebasarlos.
- id: 98
  category: safe_driving_rules
  question: En Nuevo México, ¿qué sucede con las multas por infracciones de exceso
    de velocidad cometidas en una zona designada de construcción o mantenimiento de
    carreteras?
  choices:
    A: Se exoneran por las primeras infracciones
    B: Se reducen a la mitad
    C: Se duplican
    D: Siguen siendo las mismas que las multas estándar
  answer: C
  explanation: Según la ley de Nuevo México, las multas por exceso de velocidad se
    duplican cuando la infracción ocurre dentro de una zona de construcción o mantenimiento
    señalizada donde hay trabajadores presentes.
- id: 99
  category: safe_driving_rules
  question: 'La ley de Nuevo México exige que encienda los faros delanteros desde:'
  choices:
    A: El atardecer hasta el amanecer
    B: Una hora después del atardecer hasta una hora antes del amanecer
    C: 1/2 hora después del atardecer hasta 1/2 hora antes del amanecer
    D: Siempre que use los limpiaparabrisas
  answer: C
  explanation: Los faros delanteros deben usarse en Nuevo México desde 1/2 hora después
    del atardecer hasta 1/2 hora antes del amanecer, y en cualquier otro momento en
    que la visibilidad sea inferior a 500 pies.
- id: 100
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en la mayoría de las autopistas
    interestatales en las zonas rurales de Nuevo México?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: El límite de velocidad máximo en las autopistas interestatales rurales
    en Nuevo México es de 75 mph a menos que se indique lo contrario.
- id: 101
  category: safe_driving_rules
  question: 'En Nuevo México, usted NO tiene que detenerse ante un autobús escolar
    con sus luces rojas parpadeando y el brazo de parada extendido si:'
  choices:
    A: Usted viaja en la dirección opuesta en una carretera dividida con una mediana
      física
    B: Usted tiene prisa y el autobús ha estado detenido por más de 5 minutos
    C: El autobús está detenido en una zona residencial
    D: Usted viaja en la dirección opuesta en una carretera de dos carriles
  answer: A
  explanation: Los conductores que viajan en la dirección opuesta en una carretera
    dividida con una barrera física o mediana (como un muro de concreto o una franja
    sin pavimentar) no están obligados a detenerse ante un autobús escolar.
- id: 102
  category: safe_driving_rules
  question: La ley de 'Hacerse a un lado' (Move Over) de Nuevo México requiere que
    los conductores hagan ¿qué al acercarse a un vehículo de emergencia con luces
    parpadeantes en el acotamiento?
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Cambiar de carril para alejarse del vehículo si es seguro, o reducir la velocidad
      significativamente si no es posible cambiar de carril
    C: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    D: Aumentar la velocidad para pasar el área lo más rápido posible
  answer: B
  explanation: La ley Move Over requiere que los conductores se muevan a un carril
    no adyacente si es seguro hacerlo. Si no es seguro, el conductor debe reducir
    la velocidad y estar preparado para detenerse.
- id: 103
  category: safe_driving_rules
  question: En Nuevo México, ¿es ilegal estacionarse a menos de cuántos pies de un
    paso de peatones en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Está prohibido estacionarse a menos de 20 pies de un paso de peatones
    en una intersección en Nuevo México.
- id: 104
  category: safe_driving_rules
  question: Si las direccionales de su vehículo no funcionan, ¿cuál es la señal manual
    correcta para un giro a la izquierda en Nuevo México?
  choices:
    A: Brazo extendido hacia arriba
    B: Brazo extendido hacia abajo
    C: Brazo extendido horizontalmente hacia afuera de la ventana
    D: Agitar el brazo en movimiento circular
  answer: C
  explanation: Para señalar un giro a la izquierda mediante señales manuales, el conductor
    debe extender el brazo izquierdo horizontalmente hacia afuera de la ventana.
- id: 105
  category: safe_driving_rules
  question: 'Bajo condiciones climáticas y de carretera normales, el Manual del Conductor
    de Nuevo México recomienda una distancia de seguimiento de al menos:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: Nuevo México recomienda la 'regla de los tres segundos' para mantener
    una distancia de seguimiento segura detrás del vehículo que va delante de usted.
- id: 106
  category: defensive_driving
  question: Según el Manual del Conductor de Nuevo México, ¿cuál es la distancia de
    seguimiento recomendada detrás del vehículo delante de usted bajo condiciones
    normales de conducción?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Nuevo México recomienda usar la 'regla de
    los tres segundos' para mantener una distancia de seguimiento segura bajo condiciones
    normales.
- id: 107
  category: defensive_driving
  question: ¿Con cuánta anticipación debe explorar el camino para identificar posibles
    peligros y ser un conductor seguro en Nuevo México?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 15 segundos
    C: De 20 a 25 segundos
    D: De 30 a 40 segundos
  answer: B
  explanation: Las pautas de conducción defensiva de Nuevo México establecen que debe
    mirar hacia adelante de 10 a 15 segundos para tener tiempo suficiente de reaccionar
    ante los cambios en las condiciones del tráfico.
- id: 108
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (las llantas pierden contacto
    con la carretera debido al agua) en las condiciones de lluvia de Nuevo México?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: Solo por encima de 65 mph
    D: A cualquier velocidad superior a 20 mph
  answer: A
  explanation: El Manual del Conductor de Nuevo México advierte que el hidroplaneo
    puede comenzar a velocidades tan bajas como 35 mph, y a 55 mph, las llantas pueden
    perder todo contacto con la carretera.
- id: 109
  category: defensive_driving
  question: Bajo la ley de Nuevo México, ¿cuándo se requiere que tenga encendidos
    los faros delanteros?
  choices:
    A: Solo entre la puesta del sol y el amanecer
    B: Siempre que no pueda ver claramente a una distancia de al menos 500 pies
    C: Solo cuando está lloviendo
    D: Solo cuando conduce en autopistas
  answer: B
  explanation: La ley de Nuevo México requiere que los faros delanteros estén encendidos
    desde media hora después de la puesta del sol hasta media hora antes del amanecer,
    o siempre que la visibilidad sea inferior a 500 pies debido a las condiciones
    climáticas o de luz.
- id: 110
  category: defensive_driving
  question: Si se encuentra con una tormenta de polvo mientras conduce en Nuevo México,
    ¿cuál es la acción de conducción defensiva más segura a tomar?
  choices:
    A: Encender las luces altas y continuar a una velocidad más lenta
    B: Detenerse en medio del carril y encender las luces de emergencia
    C: Salir de la carretera lo más lejos posible, apagar todas las luces y quitar
      el pie del freno
    D: Aumentar la velocidad para atravesar la nube de polvo rápidamente
  answer: C
  explanation: En las tormentas de polvo de Nuevo México, debe salir de la carretera,
    apagar todas las luces (incluidas las de freno) para que otros conductores no
    lo sigan fuera del camino pensando que todavía está en un carril, y esperar a
    que mejore la visibilidad.
- id: 111
  category: defensive_driving
  question: ¿Al conducir por las carreteras de montaña de Nuevo México en invierno,
    qué áreas tienen más probabilidades de ocultar 'hielo negro' (black ice)?
  choices:
    A: Campos abiertos junto a la carretera
    B: El centro de las intersecciones
    C: Áreas sombreadas y puentes
    D: Pendientes ascendentes pronunciadas
  answer: C
  explanation: El Manual del Conductor de Nuevo México señala que los puentes y las
    áreas sombreadas se congelan primero y permanecen congelados por más tiempo, ocultando
    a menudo el peligroso hielo negro.
- id: 112
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza de Nuevo
    México, ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Frenar con fuerza para detener el movimiento
    B: Girar el volante en la dirección opuesta al derrape
    C: No pisar el freno y girar el volante en la dirección en la que desea que vaya
      el vehículo
    D: Acelerar ligeramente para recuperar la tracción
  answer: C
  explanation: El Manual del Conductor de Nuevo México instruye a los conductores
    a no pisar los frenos y girar el volante en la dirección en la que desean que
    vaya la parte delantera del vehículo para recuperarse de un derrape.
- id: 113
  category: defensive_driving
  question: Al conducir con niebla densa en Nuevo México, ¿qué ajuste de luces debe
    utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia (hazard lights)
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en la niebla y causan deslumbramiento, lo que dificulta la visión.
- id: 114
  category: defensive_driving
  question: Para evitar la 'hipnosis de carretera' (highway hypnosis) durante viajes
    largos por Nuevo México, ¿con qué frecuencia recomienda el manual estatal tomar
    un descanso?
  choices:
    A: Cada hora
    B: Cada 2 horas o cada 100 millas
    C: Cada 4 horas
    D: Solo cuando se sienta somnoliento
  answer: B
  explanation: El Manual del Conductor de Nuevo México sugiere tomar un descanso cada
    2 horas o cada 100 millas para mantenerse alerta y evitar la fatiga.
- id: 115
  category: defensive_driving
  question: 'En Nuevo México, si está conduciendo y un neumático estalla repentinamente,
    usted debe:'
  choices:
    A: Frenar bruscamente de inmediato
    B: Sujetar el volante con firmeza y mantener el vehículo recto
    C: Poner el vehículo en punto muerto (neutral) de inmediato
    D: Girar bruscamente hacia el arcén
  answer: B
  explanation: Si un neumático estalla, debe sujetar el volante con firmeza, mantener
    el vehículo recto y reducir la velocidad gradualmente quitando el pie del acelerador;
    no frene hasta que el vehículo esté bajo control.
- id: 116
  category: defensive_driving
  question: Al entrar en una rotonda en Nuevo México, ¿a quién debe ceder el paso?
  choices:
    A: Al tráfico que entra por la derecha
    B: Al tráfico que ya está en la rotonda
    C: A nadie; usted tiene el derecho de paso al entrar
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: En las rotondas de Nuevo México, el tráfico que entra debe ceder siempre
    el paso al tráfico que ya circula por la rotonda.
- id: 117
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente
    en Nuevo México, ¿con cuánta anticipación debe observar la carretera?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 25 segundos
    D: 30 segundos
  answer: B
  explanation: El Manual del Conductor de Nuevo México establece que observar con
    una anticipación de 10 a 15 segundos le permite ver los peligros a tiempo y ajustar
    su velocidad o posición de manera segura.
- id: 118
  category: defensive_driving
  question: 'Al seguir a otro vehículo por la noche en Nuevo México, debe atenuar
    las luces altas cuando se encuentre a menos de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Según la ley de Nuevo México, debe atenuar las luces altas cuando siga
    a otro vehículo a menos de 200 pies para que sus luces no se reflejen en el espejo
    retrovisor del otro conductor.
- id: 119
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning) en carreteras
    mojadas de Nuevo México cuando los neumáticos pierden contacto con el pavimento?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: Solo por encima de 65 mph
    D: Exactamente a 50 mph
  answer: A
  explanation: Según el Manual del Conductor de Nuevo México, el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph bajo lluvia intensa, y los neumáticos
    pueden perder todo contacto con la carretera a 55 mph.
- id: 120
  category: defensive_driving
  question: 'Al adelantar a otro vehículo en una carretera de dos carriles en Nuevo
    México, no debe regresar a su carril hasta que:'
  choices:
    A: Esté 10 pies por delante del vehículo.
    B: Pueda ver ambos faros delanteros del vehículo adelantado en su espejo retrovisor.
    C: El otro conductor toque la bocina.
    D: Haya pasado su parachoques delantero por la longitud de un automóvil.
  answer: B
  explanation: El Manual del Conductor de Nuevo México aconseja que debe ver ambos
    faros delanteros del vehículo que adelantó en su espejo retrovisor antes de volver
    a incorporarse al carril.
- id: 121
  category: defensive_driving
  question: Si sus frenos dejan de funcionar mientras conduce, ¿cuál es la primera
    acción defensiva recomendada por el Manual del Conductor de Nuevo México?
  choices:
    A: Apagar el motor inmediatamente.
    B: Poner el auto en punto muerto (neutral).
    C: Bombear el pedal del freno varias veces para aumentar la presión.
    D: Saltar fuera del vehículo.
  answer: C
  explanation: Si sus frenos fallan, debe bombear el pedal del freno varias veces.
    Si eso no funciona, use el freno de estacionamiento lentamente y cambie a una
    marcha más baja.
- id: 122
  category: defensive_driving
  question: Al conducir por las carreteras de montaña de Nuevo México en invierno,
    ¿por qué es particularmente peligroso el "hielo negro" (black ice)?
  choices:
    A: Solo se encuentra en caminos de tierra.
    B: Es invisible para el conductor y hace que la carretera parezca mojada en lugar
      de helada.
    C: Solo se forma cuando la temperatura es superior a 40 grados.
    D: Proporciona tracción adicional para los neumáticos de nieve.
  answer: B
  explanation: El hielo negro es una capa de hielo fina y transparente que es difícil
    de ver, a menudo apareciendo como una mancha húmeda en la carretera, lo que lo
    convierte en un peligro importante en los inviernos de Nuevo México.
- id: 123
  category: defensive_driving
  question: En Nuevo México, ¿un conductor puede ser acusado de "DWI Agravado" si
    su concentración de alcohol en sangre (BAC) es igual o superior a qué nivel?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.16%
    D: 0.20%
  answer: C
  explanation: Bajo la ley de Nuevo México, un BAC de 0.16% o superior se clasifica
    como DWI Agravado, lo que conlleva sanciones obligatorias más severas.
- id: 124
  category: alcohol_drugs_health
  question: 'En Nuevo México, se considera que un conductor de 21 años de edad o más
    conduce bajo la influencia si su concentración de alcohol en sangre (BAC) es igual
    o superior a:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: De acuerdo con la ley de Nuevo México, el límite legal de concentración
    de alcohol en sangre (BAC) para conductores de 21 años o más es de 0.08%.
- id: 125
  category: alcohol_drugs_health
  question: 'Si opera un vehículo motorizado comercial en Nuevo México, se le considera
    legalmente intoxicado si su BAC es:'
  choices:
    A: 0.01% o superior
    B: 0.04% o superior
    C: 0.07% o superior
    D: 0.08% o superior
  answer: B
  explanation: Para los conductores comerciales en Nuevo México, el límite legal de
    BAC es más bajo que para los conductores estándar, establecido en 0.04%.
- id: 126
  category: alcohol_drugs_health
  question: 'Bajo la Ley de Consentimiento Implícito de Nuevo México, si se niega
    a hacerse una prueba de aliento o de sangre cuando lo solicite un oficial, su
    licencia será revocada por:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Negarse a una prueba química bajo la Ley de Consentimiento Implícito
    de Nuevo México resulta en una revocación automática de la licencia de conducir
    por un año.
- id: 127
  category: alcohol_drugs_health
  question: En Nuevo México, ¿por cuánto tiempo se requiere una Licencia de Dispositivo
    de Bloqueo de Encendido (Ignition Interlock) para una primera condena por DWI?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: B
  explanation: La ley de Nuevo México exige que todos los infractores de DWI por primera
    vez tengan instalado un dispositivo de bloqueo de encendido en su vehículo por
    un período de un año.
- id: 128
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es una sanción obligatoria por una primera condena
    por DWI en Nuevo México?
  choices:
    A: Un mínimo de 10 días en la cárcel
    B: Una multa de al menos $1,000
    C: Completar una escuela de DWI
    D: Pérdida permanente de los privilegios de conducir
  answer: C
  explanation: Una primera condena por DWI en Nuevo México requiere completar obligatoriamente
    una escuela de DWI y un panel de impacto en las víctimas, junto con otras sanciones
    como el bloqueo de encendido.
- id: 129
  category: alcohol_drugs_health
  question: En Nuevo México, ¿para qué grupo de solicitantes se requiere la clase
    de concientización sobre DWI "None for the Road"?
  choices:
    A: Solo conductores menores de 18 años
    B: Conductores entre 18 y 24 años que solicitan una licencia de NM por primera
      vez
    C: Solo conductores con un DUI previo fuera del estado
    D: Todos los conductores mayores de 65 años
  answer: B
  explanation: Nuevo México requiere que los solicitantes de licencia por primera
    vez entre 18 y 24 años (o aquellos de 25 años o más con un DWI previo) completen
    el curso de autoestudio de concientización sobre DWI "None for the Road".
- id: 130
  category: alcohol_drugs_health
  question: La ley de "Contenedor Abierto" (Open Container) de Nuevo México prohíbe
    ¿cuál de los siguientes?
  choices:
    A: Cualquier alcohol en el maletero del coche
    B: Alcohol sin abrir en el área de pasajeros
    C: Contenedores de bebidas alcohólicas abiertos en el área de pasajeros de un
      vehículo motorizado
    D: Transportar alcohol en un camión de reparto
  answer: C
  explanation: La ley de Nuevo México prohíbe que cualquier persona tenga un contenedor
    abierto de alcohol en el área de pasajeros de un vehículo motorizado mientras
    se encuentre en una vía pública.
- id: 131
  category: alcohol_drugs_health
  question: 'Si un conductor es condenado por un DWI en Nuevo México y un menor de
    13 años estaba en el vehículo, el conductor también puede ser acusado de:'
  choices:
    A: Conducción temeraria
    B: Poner en peligro a un menor
    C: Agresión vehicular
    D: Menor en posesión
  answer: B
  explanation: Conducir intoxicado con un menor en el vehículo se considera poner
    en peligro a un menor en Nuevo México, lo que puede dar lugar a cargos penales
    adicionales.
- id: 132
  category: alcohol_drugs_health
  question: En Nuevo México, ¿qué sucede si lo sorprenden conduciendo un vehículo
    que no está equipado con un interbloqueo de encendido (ignition interlock) mientras
    su licencia está restringida únicamente a la conducción con interbloqueo?
  choices:
    A: Recibe una advertencia
    B: Su vehículo puede ser incautado y enfrenta tiempo adicional en la cárcel
    C: Debe pagar una multa de $50
    D: Nada, siempre y cuando esté sobrio
  answer: B
  explanation: Violar las restricciones del interbloqueo de encendido es una ofensa
    grave en Nuevo México, lo que potencialmente puede llevar a la inmovilización
    o incautación del vehículo y tiempo de cárcel obligatorio.
- id: 133
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de Nuevo México, ¿cuánto tiempo le toma
    al cuerpo deshacerse del alcohol de una bebida estándar?
  choices:
    A: Aproximadamente 30 minutos
    B: Aproximadamente 1 hora
    C: Aproximadamente 2 horas
    D: Aproximadamente 3 horas
  answer: B
  explanation: El cuerpo humano procesa el alcohol a un ritmo constante, tomando típicamente
    alrededor de una hora para eliminar el alcohol de una bebida estándar.
- id: 134
  category: alcohol_drugs_health
  question: 'En Nuevo México, un conductor puede ser condenado por un DWI incluso
    si su BAC es inferior al 0.08% si:'
  choices:
    A: Conduce un auto rojo
    B: Conduce después de la medianoche
    C: Su capacidad para conducir de manera segura está afectada por el alcohol o
      las drogas
    D: No lleva su licencia consigo
  answer: C
  explanation: La ley de Nuevo México permite una condena por DWI basada en el 'deterioro
    en el grado más mínimo', lo que significa que puede ser condenado si el alcohol
    o las drogas afectan su conducción, independientemente del nivel específico de
    BAC.
- id: 135
  category: alcohol_drugs_health
  question: 'Si usted es menor de 21 años, la ley de ''Tolerancia Cero'' de Nuevo
    México significa que su licencia será revocada si su BAC es tan bajo como:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Nuevo México aplica una política de 'Tolerancia Cero' para conductores
    menores de 21 años, donde un BAC de 0.02% o superior resulta en la revocación
    de la licencia.
- id: 136
  category: alcohol_drugs_health
  question: En Nuevo México, ¿cuál de los siguientes es un motivo automático para
    un cargo de 'DWI Agravado', independientemente del nivel de BAC?
  choices:
    A: Conducir con un menor en el auto
    B: Negarse a someterse a una prueba química
    C: Conducir a 20 mph sobre el límite de velocidad mientras está intoxicado
    D: Conducir sin seguro mientras está intoxicado
  answer: B
  explanation: La ley de Nuevo México define el DWI Agravado como tener un BAC de
    0.16% o superior, causar lesiones corporales mientras se conduce bajo los efectos
    del alcohol (DWI), O negarse a realizar una prueba química.
- id: 137
  category: alcohol_drugs_health
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) para los
    conductores comerciales (titulares de CDL) en Nuevo México?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: En Nuevo México, se considera que los conductores comerciales están
    legalmente intoxicados si su BAC es de 0.04% o superior mientras operan un vehículo
    comercial.
- id: 138
  category: alcohol_drugs_health
  question: Si es condenado por un segundo DWI en Nuevo México, ¿por cuánto tiempo
    se le revocará su licencia de conducir?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: Una segunda condena por DWI en Nuevo México resulta en una revocación
    obligatoria de la licencia por 2 años.
- id: 139
  category: alcohol_drugs_health
  question: En Nuevo México, si tiene una condición médica como la epilepsia, ¿cuánto
    tiempo debe estar sin convulsiones antes de poder conducir legalmente?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Las pautas del MVD de Nuevo México generalmente requieren que un conductor
    esté libre de convulsiones durante al menos 6 meses, respaldado por una declaración
    del médico, para mantener los privilegios de conducción.
- id: 140
  category: alcohol_drugs_health
  question: En Nuevo México, ¿una cuarta condena por DWI o subsiguiente se clasifica
    como qué tipo de delito?
  choices:
    A: Delito menor leve (Petty Misdemeanor)
    B: Delito menor (Misdemeanor)
    C: Delito grave (Felony)
    D: Infracción de tráfico
  answer: C
  explanation: Una cuarta condena por DWI o subsiguiente en Nuevo México es un delito
    grave (felony), que conlleva sanciones mucho más severas y tiempo en prisión.
- id: 141
  category: alcohol_drugs_health
  question: ¿Qué proporciona el "Fondo para Interbloqueos de Indigentes" (Indigent
    Interlock Fund) de Nuevo México?
  choices:
    A: Asesoría legal gratuita para acusados de DWI
    B: Asistencia financiera para los costos del dispositivo de interbloqueo de encendido
      para quienes califiquen
    C: Transporte gratuito para personas intoxicadas
    D: Pago de facturas médicas de las víctimas de DWI
  answer: B
  explanation: El Fondo para Interbloqueos de Indigentes es un programa estatal que
    ayuda a las personas de bajos ingresos a pagar los costos asociados con el dispositivo
    obligatorio de interbloqueo de encendido.
- id: 142
  category: alcohol_drugs_health
  question: ¿Cómo afecta el consumo de marihuana a un conductor en Nuevo México?
  choices:
    A: Es legal conducir después de consumirla si tiene una tarjeta médica
    B: No tiene efecto en el tiempo de reacción
    C: Es ilegal conducir si la droga afecta su capacidad para conducir de manera
      segura
    D: Solo afecta la conducción si se combina con alcohol
  answer: C
  explanation: Según las leyes de DWI de Nuevo México, es ilegal conducir bajo la
    influencia de cualquier droga, incluida la marihuana, si esta afecta su capacidad
    para operar un vehículo de manera segura.
- id: 143
  category: alcohol_drugs_health
  question: En Nuevo México, ¿cuál es la única forma de reducir su Concentración de
    Alcohol en Sangre (BAC) después de beber?
  choices:
    A: Beber café negro cargado
    B: Tomar una ducha fría
    C: Hacer ejercicio o sudar
    D: Darle tiempo a su cuerpo para procesar el alcohol
  answer: D
  explanation: Solo el tiempo puede reducir el BAC de una persona. El café, las duchas
    y el ejercicio no aceleran la eliminación del alcohol del torrente sanguíneo.
- id: 144
  category: alcohol_drugs_health
  question: Si un conductor de Nuevo México es condenado por un tercer DWI, ¿cuánto
    tiempo dura el período de revocación obligatoria de la licencia?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: Permanentemente
  answer: C
  explanation: Una tercera condena por DWI en Nuevo México resulta en una revocación
    obligatoria de la licencia de conducir por 3 años.
- id: 145
  category: penalties_and_points
  question: Según la ley de Nuevo México, ¿cuál es el valor en puntos por una infracción
    de "conducción temeraria" (Reckless Driving)?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: La conducción temeraria se considera una infracción grave en Nuevo
    México y conlleva una penalización de 6 puntos en el registro del conductor.
- id: 146
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan al registro de conducir de Nuevo México por
    no detenerse ante un autobús escolar que muestra su señal de parada?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Rebasar ilegalmente a un autobús escolar detenido es una violación
    de seguridad importante en Nuevo México y resulta en 6 puntos.
- id: 147
  category: penalties_and_points
  question: ¿Cuántos puntos se agregan a su registro de conducir de Nuevo México por
    "seguir demasiado de cerca" (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: A
  explanation: Seguir demasiado de cerca es una infracción de 2 puntos en el sistema
    de puntos de Nuevo México.
- id: 148
  category: penalties_and_points
  question: ¿Cuál es la penalización en puntos por "no ceder el paso" (Failure to
    Yield Right-of-Way) en Nuevo México?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: B
  explanation: No ceder el paso resulta en la asignación de 3 puntos contra su licencia
    de conducir de Nuevo México.
- id: 149
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por no detenerse ante una luz roja o una señal
    de alto en Nuevo México?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: No detenerse ante una señal de tráfico (luz roja) o una señal de alto
    es una infracción de 3 puntos en Nuevo México.
- id: 150
  category: penalties_and_points
  question: Según la ley de envases abiertos de Nuevo México, ¿dónde es legal llevar
    un envase abierto de alcohol en un vehículo?
  choices:
    A: En la guantera
    B: En la consola central
    C: En el maletero (cajuela)
    D: Debajo del asiento del conductor
  answer: C
  explanation: La ley de Nuevo México prohíbe los envases abiertos de alcohol en el
    área de pasajeros de un vehículo. Deben mantenerse en el maletero o en un área
    que no sea ocupada normalmente por el conductor o los pasajeros si el vehículo
    no tiene maletero.
- id: 151
  category: penalties_and_points
  question: ¿Según la ley de Nuevo México, cuál es la penalización de puntos por 'No
    ceder el paso a un vehículo de emergencia'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: D
  explanation: No ceder el paso a un vehículo de emergencia se considera una infracción
    de seguridad grave en Nuevo México y conlleva una penalización de 6 puntos.
- id: 152
  category: penalties_and_points
  question: ¿Cuál es la multa base por una primera infracción de enviar mensajes de
    texto mientras se conduce en Nuevo México?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: A
  explanation: En Nuevo México, la primera infracción por enviar mensajes de texto
    mientras se conduce conlleva una multa de $25. Las infracciones posteriores conllevan
    una multa de $50.
- id: 153
  category: penalties_and_points
  question: ¿A qué nivel de puntos enviará el MVD de Nuevo México una carta de advertencia
    a un conductor sobre la posible suspensión de la licencia?
  choices:
    A: De 3 a 5 puntos
    B: 6 puntos
    C: De 7 a 11 puntos
    D: 12 puntos
  answer: C
  explanation: Cuando un conductor acumula de 7 a 11 puntos en un período de 12 meses,
    el MVD envía una carta de advertencia. A los 12 puntos, la licencia se suspende.
- id: 154
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una infracción de la ley de cinturones
    de seguridad o la ley de sistemas de retención infantil de Nuevo México?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 0 puntos (solo multa)
  answer: A
  explanation: La ley de Nuevo México asigna 2 puntos por no usar el cinturón de seguridad
    o por infracciones de los sistemas de retención infantil.
- id: 155
  category: penalties_and_points
  question: Si se le condena por una infracción de 'Contenedor Abierto' (tener una
    bebida alcohólica abierta en el área de pasajeros) en Nuevo México, ¿cuántos puntos
    se añaden a su registro?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: B
  explanation: Una infracción por contenedor abierto en Nuevo México resulta en la
    asignación de 3 puntos contra la licencia de conducir.
- id: 156
  category: sharing_the_road
  question: 'Al seguir a un camión grande en Nuevo México, si no puede ver los espejos
    laterales del camión, usted está:'
  choices:
    A: En la 'No-Zone' (punto ciego) del camión
    B: A una distancia de seguimiento segura
    C: En la 'Zona Segura' del camión
    D: Obligado a encender sus luces altas
  answer: A
  explanation: El Manual del Conductor de Nuevo México establece que si no puede ver
    la cara del conductor en su espejo lateral, él no puede verlo a usted, lo que
    significa que está en su punto ciego o 'No-Zone'.
- id: 157
  category: sharing_the_road
  question: En Nuevo México, ¿cuál es la distancia mínima que debe mantener al seguir
    a un aparato de bomberos (camión de bomberos) que responde a una alarma?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Estatuto de NM 66-7-333 prohíbe a los conductores seguir a un aparato
    de bomberos que viaja en respuesta a una alarma de incendio a una distancia menor
    de 500 pies.
- id: 158
  category: sharing_the_road
  question: 'Cuando un peatón cruza la calle guiado por un animal de servicio o llevando
    un bastón blanco, la ley de Nuevo México exige que los conductores:'
  choices:
    A: Toquen la bocina para avisar que están allí
    B: Cedan el paso y tomen las precauciones necesarias para evitar lesiones
    C: Conduzcan alrededor de ellos si hay suficiente espacio
    D: Esperen a que un oficial de policía dirija el tráfico
  answer: B
  explanation: El Estatuto de NM 66-7-334 exige que los conductores cedan el paso
    a cualquier peatón que sea total o parcialmente ciego y que lleve un bastón o
    utilice un animal de servicio.
- id: 159
  category: sharing_the_road
  question: En Nuevo México, ¿se les permite a los ciclistas circular por el arcén
    (hombro) de una carretera?
  choices:
    A: No, siempre deben estar en el carril de circulación
    B: Sí, pueden circular por el arcén
    C: Solo si el arcén está pavimentado y tiene al menos 10 pies de ancho
    D: Solo durante las horas del día
  answer: B
  explanation: En Nuevo México, generalmente se les permite a los ciclistas circular
    por el arcén de la carretera para mantenerse seguros y fuera del camino del tráfico
    de vehículos motorizados más rápidos.
- id: 160
  category: sharing_the_road
  question: 'Al girar a la izquierda cruzando un carril utilizado por ciclistas que
    vienen en sentido contrario, un conductor de Nuevo México debe:'
  choices:
    A: Ceder el paso al ciclista, ya que este tiene la preferencia
    B: Hacer una señal al ciclista para que se detenga
    C: Acelerar para girar antes de que llegue el ciclista
    D: Esperar que el ciclista se mueva a la acera
  answer: A
  explanation: Las bicicletas se consideran vehículos en Nuevo México. Los conductores
    deben ceder el paso al tráfico que viene en sentido contrario, incluidas las bicicletas,
    al realizar un giro a la izquierda.
- id: 161
  category: sharing_the_road
  question: ¿Cuál es el estatus legal de la "división de carril" (motocicletas que
    conducen entre filas de autos detenidos o en movimiento) en Nuevo México?
  choices:
    A: Es explícitamente legal
    B: Es legal solo en embotellamientos de tráfico
    C: No está autorizada y generalmente se cita como una infracción de carril
    D: Es legal para motocicletas de menos de 250cc
  answer: C
  explanation: La ley de Nuevo México exige que los vehículos permanezcan dentro de
    un solo carril (Estatuto de NM 66-7-317). La división de carril no está autorizada
    y puede resultar en una citación por no mantener el carril.
- id: 162
  category: sharing_the_road
  question: 'En Nuevo México, si conduce detrás de un vehículo agrícola de movimiento
    lento, usted debe:'
  choices:
    A: Tocar la bocina hasta que se detengan a un lado
    B: Rebasar inmediatamente, incluso si es una zona donde se prohíbe adelantar
    C: Ser paciente y esperar hasta que sea seguro y legal rebasar
    D: Seguirlo lo más cerca posible para animarlo a acelerar
  answer: C
  explanation: La maquinaria agrícola a menudo viaja a velocidades de 25 mph o menos.
    Los conductores deben ser pacientes y solo rebasar cuando haya una zona legal
    para hacerlo y sea seguro.
- id: 163
  category: sharing_the_road
  question: Según el Manual del Conductor de Nuevo México, ¿cuánto espacio debe dejar
    al seguir a una motocicleta?
  choices:
    A: El mismo que a un auto
    B: Menos que a un auto porque son más pequeñas
    C: Al menos una distancia de seguimiento de cuatro segundos
    D: Exactamente 10 pies
  answer: C
  explanation: Debido a que las motocicletas pueden detenerse más rápido que los autos
    y se ven afectadas más fácilmente por las condiciones de la carretera, Nuevo México
    recomienda una distancia de seguimiento de al menos cuatro segundos.
- id: 164
  category: sharing_the_road
  question: Cuando un peatón se encuentra en un cruce de peatones no marcado en una
    intersección en Nuevo México, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor del vehículo
    B: El peatón
    C: Quien haya llegado primero a la intersección
    D: El peatón, pero solo si lleva ropa reflectante
  answer: B
  explanation: El Estatuto de NM 66-7-334 establece que los conductores deben ceder
    el derecho de paso a un peatón que cruza la calzada dentro de cualquier cruce
    de peatones no marcado en una intersección.
- id: 165
  category: sharing_the_road
  question: 'En Nuevo México, una bicicleta operada de noche debe estar equipada con
    una lámpara en la parte delantera que emita una luz blanca visible desde una distancia
    de al menos:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Estatuto de NM 66-3-707 exige que las bicicletas utilizadas de noche
    tengan una lámpara delantera visible desde al menos 500 pies y un reflector rojo
    en la parte trasera visible desde 300 pies.
- id: 166
  category: sharing_the_road
  question: En Nuevo México, cuando un autobús escolar se detiene en una carretera
    no dividida con sus luces rojas intermitentes encendidas y el brazo de parada
    extendido, ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima por delante
    C: El tráfico en ambas direcciones
    D: Nadie, si hay al menos tres carriles
  answer: C
  explanation: Según el Manual del Conductor de Nuevo México, en una calzada no dividida,
    todo el tráfico en ambas direcciones debe detenerse ante un autobús escolar con
    luces rojas intermitentes y un brazo de parada extendido.
- id: 167
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir detrás de
    una motocicleta en Nuevo México para permitir un tiempo de reacción seguro?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: El Manual del Conductor de Nuevo México recomienda una distancia de
    seguimiento de al menos cuatro segundos cuando se está detrás de una motocicleta,
    ya que estas pueden detenerse mucho más rápido que los autos.
- id: 168
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con sirena y luces intermitentes se
    aproxima por detrás, la ley de Nuevo México le exige:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Dirigirse al borde derecho de la carretera y detenerse
    C: Acelerar para mantenerse delante del vehículo
    D: Moverse al acotamiento izquierdo y detenerse
  answer: B
  explanation: La ley de Nuevo México exige que los conductores cedan el derecho de
    paso moviéndose hacia el borde derecho o la orilla de la calzada, despejando las
    intersecciones, y deteniéndose hasta que el vehículo de emergencia haya pasado.
- id: 169
  category: sharing_the_road
  question: En Nuevo México, es ilegal seguir a menos de ______ pies de distancia
    a cualquier camión de bomberos que responda a una alarma de incendio.
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Estatuto de NM 66-7-332.1 prohíbe seguir a los aparatos de bomberos
    a menos de 500 pies cuando responden a una alarma.
- id: 170
  category: sharing_the_road
  question: Según la ley de Nuevo México, ¿quién está obligado a usar un casco de
    seguridad mientras opera o viaja en una motocicleta?
  choices:
    A: Solo el operador
    B: Todos los pasajeros independientemente de su edad
    C: Solo los conductores o pasajeros menores de 18 años
    D: Solo los conductores con un permiso de aprendizaje
  answer: C
  explanation: La ley de Nuevo México (Estatuto 66-7-356) exige que todas las personas
    menores de 18 años usen un casco de seguridad al operar o viajar en una motocicleta.
- id: 171
  category: sharing_the_road
  question: Los camiones grandes tienen 'No-Zones' (zonas prohibidas) donde el conductor
    no puede ver su vehículo. ¿Dónde se encuentran estos puntos ciegos?
  choices:
    A: Solo directamente detrás del camión
    B: Solo en el lado izquierdo del camión
    C: Directamente adelante, directamente atrás y en ambos lados
    D: Solo en el lado derecho del camión
  answer: C
  explanation: Las 'No-Zones' de los camiones grandes se encuentran en la parte delantera,
    trasera y en ambos lados del vehículo, donde la visibilidad del conductor del
    camión es limitada.
- id: 172
  category: sharing_the_road
  question: 'En Nuevo México, si usted está conduciendo y una bicicleta circula por
    su carril y no hay suficiente espacio para rebasarla de forma segura, usted debe:'
  choices:
    A: Esperar detrás de la bicicleta hasta que sea seguro rebasarla
    B: Tocar la bocina hasta que el ciclista se mueva a la acera
    C: Obligar al ciclista a salir de la carretera
    D: Pasar lo más cerca posible para animarlo a moverse
  answer: A
  explanation: El Manual del Conductor de Nuevo México establece que si no hay suficiente
    espacio para rebasar a un ciclista de manera segura, debe esperar detrás de él
    hasta que sea seguro pasarlo con al menos cinco pies de distancia.
- id: 173
  category: sharing_the_road
  question: Un emblema de 'Vehículo de movimiento lento', que es un triángulo naranja
    con un borde rojo, debe mostrarse en los vehículos que viajan a velocidades de
    ______ o menos.
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio para los
    vehículos diseñados para viajar a velocidades de 25 mph o menos, como equipos
    agrícolas o maquinaria de construcción.
- id: 174
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión puede:'
  choices:
    A: Girar desde el carril izquierdo
    B: Permanecer totalmente en el carril derecho
    C: Abrirse hacia la izquierda para completar el giro
    D: Detenerse y esperar a que el tráfico despeje ambas calles
  answer: C
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha sin que el remolque golpee el bordillo u otros
    objetos.
- id: 175
  category: sharing_the_road
  question: 'Si usted está girando a la izquierda en una intersección y un ciclista
    se aproxima desde la dirección opuesta, usted debe:'
  choices:
    A: Girar rápidamente antes de que el ciclista llegue a la intersección
    B: Ceder el paso al ciclista como lo haría con cualquier otro vehículo
    C: Tocar la bocina para advertir al ciclista que se detenga
    D: Asumir que el ciclista se subirá a la acera
  answer: B
  explanation: Los ciclistas tienen los mismos derechos y responsabilidades que los
    automovilistas. Debe ceder el paso a un ciclista que se aproxima al girar a la
    izquierda, tal como lo haría con un automóvil.
- id: 176
  category: vehicle_information
  question: 'En Nuevo México, debe encender sus faros siempre que no pueda ver claramente
    a personas o vehículos a una distancia de:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Según el Manual del Conductor de Nuevo México, los faros deben encenderse
    si no se pueden ver personas o vehículos adelante a una distancia de 500 pies.
- id: 177
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para vehículos de pasajeros en Nuevo México?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros e ilegales en Nuevo México si
    tienen menos de 2/32 de pulgada de profundidad en la banda de rodadura.
- id: 178
  category: vehicle_information
  question: ¿En qué condado de Nuevo México se requiere una prueba de emisiones (Air
    Care) para el registro del vehículo?
  choices:
    A: Condado de Santa Fe
    B: Condado de Doña Ana
    C: Condado de Bernalillo
    D: Condado de Chaves
  answer: C
  explanation: Actualmente, la prueba de emisiones de vehículos solo es obligatoria
    para los vehículos registrados en el Condado de Bernalillo (programa Air Care
    New Mexico).
- id: 179
  category: vehicle_information
  question: 'Según la ley de Nuevo México, todo vehículo motorizado debe estar equipado
    con una bocina que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las regulaciones de equipamiento de Nuevo México establecen que la
    bocina de un vehículo debe ser audible en condiciones normales desde una distancia
    no menor a 200 pies.
- id: 180
  category: vehicle_information
  question: 'La ley de Nuevo México exige que los espejos retrovisores permitan al
    conductor ver la carretera por una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: Los vehículos deben estar equipados con un espejo ubicado de tal manera
    que refleje al conductor una vista de la carretera por una distancia de al menos
    200 pies hacia atrás.
- id: 181
  category: vehicle_information
  question: En Nuevo México, el freno de servicio (freno de pie) debe ser capaz de
    detener un vehículo que viaja a 20 mph en ¿cuántos pies?
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 50 pies
  answer: B
  explanation: Las normas de seguridad de Nuevo México requieren que el freno de pie
    pueda detener el vehículo en un máximo de 25 pies cuando viaja a una velocidad
    de 20 mph en un pavimento seco y nivelado.
- id: 182
  category: vehicle_information
  question: Según la ley de Nuevo México, ¿cuál es la reducción máxima de luz permitida
    (polarizado) para las ventanas laterales y traseras?
  choices:
    A: No más del 10% de reducción de luz
    B: No más del 35% de reducción de luz
    C: Debe permitir al menos el 20% de transmisión de luz
    D: Debe permitir al menos el 50% de transmisión de luz
  answer: C
  explanation: La ley de Nuevo México prohíbe el polarizado de ventanas que permita
    menos del 20% de transmisión de luz a través del vidrio.
- id: 183
  category: vehicle_information
  question: Si una carga se extiende ______ o más allá de la parte trasera de la caja
    o carrocería del vehículo en Nuevo México, se debe colocar una bandera roja en
    el extremo posterior de la carga.
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: Siempre que una carga se extienda 4 pies o más allá de la parte trasera
    de un vehículo, se debe mostrar una bandera roja (de al menos 12 pulgadas cuadradas)
    al final de la carga.
- id: 184
  category: vehicle_information
  question: En Nuevo México, ¿quién está obligado por ley a usar el cinturón de seguridad
    en un vehículo en movimiento?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: El conductor y todos los pasajeros, independientemente de su posición en el
      asiento
    D: Solo el conductor
  answer: C
  explanation: Nuevo México tiene una ley de uso obligatorio del cinturón de seguridad
    de cumplimiento primario, lo que significa que el conductor y todos los pasajeros
    en todas las posiciones de asiento deben usar el cinturón de seguridad.
- id: 185
  category: vehicle_information
  question: 'Según la ley de Nuevo México, los niños deben estar asegurados en un
    sistema de retención para niños (asiento de seguridad o elevador/booster) hasta
    que tengan al menos:'
  choices:
    A: 5 años
    B: 7 años
    C: 9 años
    D: 12 años
  answer: B
  explanation: La ley de Nuevo México exige que los niños utilicen un sistema de retención
    infantil hasta que tengan al menos 7 años. Los niños de 7 a 12 años deben usar
    un asiento elevador (booster) hasta que el cinturón de seguridad de adulto les
    ajuste correctamente.
- id: 186
  category: vehicle_information
  question: 'Todo vehículo motorizado en Nuevo México debe tener al menos dos luces
    traseras en la parte posterior que emitan una luz roja claramente visible desde
    una distancia de:'
  choices:
    A: 250 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Las luces traseras de los vehículos en Nuevo México deben ser visibles
    desde una distancia de 500 pies hacia atrás.
- id: 187
  category: vehicle_information
  question: 'En Nuevo México, la luz que ilumina la placa de registro trasera (matrícula)
    debe hacer que la placa sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Nuevo México exige una luz blanca para iluminar la placa
    trasera de modo que sea claramente legible desde una distancia de 50 pies.
- id: 188
  category: vehicle_information
  question: ¿Cuándo debe usar sus faros delanteros en Nuevo México además de durante
    la noche?
  choices:
    A: Solo cuando está lloviendo
    B: Solo cuando está nevando
    C: Siempre que use los limpiaparabrisas
    D: En cualquier momento en que la visibilidad sea inferior a 500 pies debido al
      clima u otras condiciones
  answer: D
  explanation: Además de la regla de media hora después de la puesta del sol hasta
    media hora antes del amanecer, Nuevo México exige el uso de faros siempre que
    la visibilidad se reduzca a 500 pies o menos por lluvia, nieve, niebla o polvo.
- id: 189
  category: vehicle_information
  question: Según la ley de Nuevo México, ¿cuándo debe encender sus faros delanteros?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes del amanecer
    B: Solo cuando está lloviendo o nevando
    C: Desde media hora después de la puesta del sol hasta media hora antes del amanecer
    D: Solo cuando conduce en carreteras rurales sin iluminación
  answer: C
  explanation: La ley de Nuevo México exige que los faros estén encendidos desde media
    hora después de la puesta del sol hasta media hora antes del amanecer, o siempre
    que la visibilidad sea inferior a 500 pies.
- id: 190
  category: vehicle_information
  question: Según la ley de Nuevo México, todo vehículo motorizado debe tener un freno
    de pie que sea capaz de detener el vehículo en ¿cuántos pies al viajar a 20 mph?
  choices:
    A: 15 pies
    B: 25 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: El Estatuto de Nuevo México 66-3-840 exige que el freno de servicio
    (de pie) pueda detener el vehículo en un máximo de 25 pies a una velocidad de
    20 mph en una superficie seca y nivelada.
- id: 191
  category: vehicle_information
  question: En Nuevo México, el espejo retrovisor de su vehículo debe permitirle ver
    la carretera hacia atrás por una distancia de al menos ¿cuántos pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El Estatuto de Nuevo México 66-3-845 requiere un espejo ubicado de
    tal manera que refleje al conductor una vista de la carretera por una distancia
    de al menos 200 pies hacia atrás.
- id: 192
  category: vehicle_information
  question: La ley de Nuevo México exige que el polarizado de las ventanas laterales
    y traseras debe permitir el paso de al menos ¿qué porcentaje de luz?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: A
  explanation: El Estatuto de Nuevo México 66-3-846.1 especifica que el polarizado
    de las ventanas debe permitir al menos un 20% de transmisión de luz en las ventanas
    laterales delanteras, laterales traseras y traseras.
- id: 193
  category: vehicle_information
  question: 'La luz trasera o una lámpara independiente en un vehículo en Nuevo México
    debe iluminar la placa de matrícula trasera para que sea claramente legible desde
    una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El Estatuto de Nuevo México 66-3-805 requiere que la placa de matrícula
    trasera esté iluminada y sea visible desde una distancia de 50 pies.
- id: 194
  category: vehicle_information
  question: En Nuevo México, las luces direccionales deben ser visibles desde una
    distancia no menor a ______ pies bajo la luz solar normal.
  choices:
    A: 50 pies
    B: 100 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El Estatuto de Nuevo México 66-3-824 requiere que las lámparas de señalización
    sean visibles desde una distancia de 100 pies tanto hacia adelante como hacia
    atrás bajo la luz solar normal.
- id: 195
  category: vehicle_information
  question: En el condado de Bernalillo, Nuevo México, ¿con qué frecuencia se requiere
    que la mayoría de los vehículos se sometan a una inspección de emisiones (Air
    Care)?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada cinco años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: En el condado de Bernalillo, los vehículos deben aprobar una prueba
    de emisiones cada dos años (bienalmente) o al cambiar de propietario.
- id: 196
  category: vehicle_information
  question: 'Según la ley de Nuevo México, es ilegal operar un vehículo motorizado
    que esté equipado con:'
  choices:
    A: Un recorte o derivación del silenciador (muffler cutout)
    B: Un sistema de escape instalado de fábrica
    C: Tubos de escape dobles
    D: Un convertidor catalítico
  answer: A
  explanation: El Estatuto de Nuevo México 66-3-844 prohíbe el uso de un recorte de
    silenciador, derivación o dispositivo similar en cualquier vehículo motorizado
    utilizado en una carretera.
- id: 197
  category: vehicle_information
  question: 'En Nuevo México, se debe mostrar un emblema de ''Vehículo de movimiento
    lento'' (Slow Moving Vehicle) en la parte trasera de los vehículos diseñados para
    operar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El Estatuto de Nuevo México 66-3-887 requiere el emblema de vehículo
    de movimiento lento en los vehículos diseñados para una velocidad máxima de 25
    millas por hora o menos.
- id: 198
  category: signs_and_signals
  question: En Nuevo México, ¿qué significa una luz de tráfico roja intermitente?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: La luz está a punto de ponerse roja fija
    C: Detenerse por completo y avanzar cuando sea seguro hacerlo
    D: Ceder el paso al tráfico que viene en sentido contrario pero no detenerse
  answer: C
  explanation: Según el Manual del Conductor de Nuevo México, una luz roja intermitente
    significa lo mismo que una señal de alto. Debe detenerse por completo y luego
    avanzar cuando sea seguro.
- id: 199
  category: signs_and_signals
  question: Cuando un conductor tiene el brazo izquierdo extendido directamente hacia
    afuera de la ventana, ¿qué maniobra está señalando?
  choices:
    A: Un giro a la derecha
    B: Un giro a la izquierda
    C: Reducir la velocidad o detenerse
    D: Giro en U
  answer: B
  explanation: 'La ley de Nuevo México reconoce las señales manuales estándar: brazo
    extendido hacia afuera para un giro a la izquierda, brazo doblado hacia arriba
    para un giro a la derecha y brazo doblado hacia abajo para detenerse o reducir
    la velocidad.'
- id: 200
  category: signs_and_signals
  question: 'Una señal en forma de banderín (triángulo isósceles que apunta a la derecha)
    que se encuentra en el lado izquierdo de la carretera indica:'
  choices:
    A: Una zona escolar más adelante
    B: Un requisito de ceder el paso
    C: Una zona de no rebasar (no-passing zone)
    D: Un cruce de ferrocarril
  answer: C
  explanation: La señal en forma de banderín es única porque se coloca en el lado
    izquierdo de la carretera para advertir a los conductores que están entrando en
    una zona de no rebasar.
- id: 201
  category: signs_and_signals
  question: En Nuevo México, ¿qué significa una señal de 'X' amarilla fija sobre un
    carril de tráfico?
  choices:
    A: El carril es solo para giros a la izquierda
    B: Debe salir de este carril tan pronto como sea seguro porque la señal está a
      punto de cambiar a rojo
    C: El carril está abierto para circular en su dirección
    D: El carril está reservado para vehículos de emergencia
  answer: B
  explanation: Una 'X' amarilla fija sobre un carril indica que la señal de control
    de carril está a punto de cambiar a una 'X' roja, y usted debe desalojar el carril
    de manera segura.
- id: 202
  category: signs_and_signals
  question: ¿Qué significan las marcas viales amarillas en las carreteras de Nuevo
    México?
  choices:
    A: Tráfico moviéndose en la misma dirección
    B: El borde derecho de la calzada
    C: Tráfico moviéndose en sentidos opuestos
    D: Zonas de cruce de peatones
  answer: C
  explanation: Las líneas amarillas separan los carriles de tráfico que se mueven
    en sentidos opuestos. Las líneas blancas separan los carriles de tráfico que se
    mueven en la misma dirección.
- id: 203
  category: signs_and_signals
  question: Según la ley de Nuevo México, ¿cuándo se permite un giro a la izquierda
    con luz roja?
  choices:
    A: Nunca
    B: Solo cuando se gira desde una calle de sentido único hacia otra calle de sentido
      único
    C: En cualquier momento que no haya tráfico en sentido contrario
    D: Solo entre las doce de la noche y las 5:00 AM
  answer: B
  explanation: La ley de Nuevo México permite un giro a la izquierda en rojo solo
    si está girando desde una calle de sentido único hacia otra calle de sentido único,
    siempre que se detenga primero y ceda el paso a los peatones y a otros vehículos.
- id: 204
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla circular con una 'X' negra y las letras
    'RR'?
  choices:
    A: Una zona de reparación de carreteras
    B: Una calzada restringida
    C: Un cruce de ferrocarril más adelante
    D: Una superficie de carretera irregular
  answer: C
  explanation: La señal amarilla circular es una señal de advertencia redonda que
    se utiliza específicamente para alertar a los conductores de que se aproximan
    a un cruce de ferrocarril.
- id: 205
  category: signs_and_signals
  question: 'En Nuevo México, una señal en forma de diamante con fondo naranja se
    utiliza para:'
  choices:
    A: Advertencias generales sobre las condiciones de la carretera
    B: Señales de servicio (gasolina, comida, alojamiento)
    C: Zonas de construcción y mantenimiento
    D: Guía de áreas recreativas
  answer: C
  explanation: El naranja es el color estándar para las señales de construcción y
    mantenimiento en Nuevo México. Estas señales alertan a los conductores sobre trabajadores,
    equipos o desvíos.
- id: 206
  category: signs_and_signals
  question: ¿Una señal de 'aspa' (crossbuck) en un cruce de ferrocarril debe tratarse
    igual que qué otra señal de tráfico?
  choices:
    A: Una señal de Pare (Stop)
    B: Una señal de Ceda el paso (Yield)
    C: Una señal de Límite de velocidad
    D: Una señal de No entrar
  answer: B
  explanation: Una señal de aspa de ferrocarril es una señal reguladora que debe tratarse
    como una señal de ceda el paso. Debe ceder el paso a cualquier tren que se aproxime.
- id: 207
  category: signs_and_signals
  question: ¿Cuál es el propósito de un carril central compartido marcado con líneas
    amarillas continuas y discontinuas en ambos lados?
  choices:
    A: Rebasar vehículos más lentos
    B: Viaje de vehículos de alta ocupación
    C: Realizar giros a la izquierda únicamente
    D: Estacionamiento de emergencia únicamente
  answer: C
  explanation: Los carriles centrales compartidos están reservados para realizar giros
    a la izquierda y pueden ser utilizados por vehículos que viajan en cualquier dirección,
    pero no pueden usarse para rebasar o para circular de paso.
- id: 208
  category: signs_and_signals
  question: 'Si se aproxima a una glorieta (roundabout) en Nuevo México, debe ceder
    el derecho de paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en el círculo
    C: A nadie; usted tiene el derecho de paso al entrar
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: Al entrar en una glorieta, la ley de Nuevo México exige que ceda el
    paso al tráfico que ya circula en ella, el cual vendrá por su izquierda.
- id: 209
  category: signs_and_signals
  question: ¿Qué representa una línea blanca continua pintada a través de un carril
    de tráfico en una intersección?
  choices:
    A: Un cruce de peatones
    B: Una línea de parada
    C: Un límite de carril para bicicletas
    D: Una zona de 'prohibido estacionar'
  answer: B
  explanation: Una línea blanca continua a través de un carril es una línea de parada,
    que indica el punto exacto donde un vehículo debe detenerse ante una luz roja
    o una señal de pare.
- id: 210
  category: signs_and_signals
  question: ¿Una señal de carretera estatal de Nuevo México se identifica fácilmente
    por qué símbolo?
  choices:
    A: Una silueta de una planta de Yuca
    B: Un Correcaminos
    C: El símbolo del sol de Zia
    D: Una silueta de un globo aerostático
  answer: C
  explanation: Los marcadores de carreteras estatales de Nuevo México presentan el
    símbolo del sol de Zia, que también se encuentra en la bandera del estado.
- id: 211
  category: signs_and_signals
  question: ¿Qué significa una señal de flecha roja fija en Nuevo México?
  choices:
    A: Puede girar después de detenerse por completo
    B: Debe detenerse y no puede girar en la dirección de la flecha
    C: La flecha está a punto de cambiar a verde
    D: Ceda el paso a los peatones, luego puede girar
  answer: B
  explanation: Una flecha roja fija significa que debe detenerse y no puede realizar
    un giro en la dirección que apunta la flecha hasta que la señal cambie a una flecha
    verde o una luz verde.
- id: 212
  category: signs_and_signals
  question: En Nuevo México, ¿qué indica una señal en forma de banderín ubicada en
    el lado izquierdo de la carretera?
  choices:
    A: Zona escolar
    B: Zona de no rebasar
    C: Ceda el paso adelante
    D: Cruce de ferrocarril
  answer: B
  explanation: De acuerdo con el Manual del Conductor de Nuevo México, una señal en
    forma de banderín se coloca en el lado izquierdo de la carretera para marcar el
    inicio de una zona de no rebasar (No Passing Zone).
- id: 213
  category: signs_and_signals
  question: Cuando vea una luz amarilla intermitente en una intersección en Nuevo
    México, ¿qué debe hacer?
  choices:
    A: Detenerse por completo y esperar a que cambie a verde
    B: Acelerar para despejar la intersección rápidamente
    C: Reducir la velocidad y proceder con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con precaución, tal como se describe en el Manual del Conductor de
    Nuevo México.
- id: 214
  category: signs_and_signals
  question: Si extiende el brazo izquierdo recto hacia afuera de la ventana, ¿qué
    maniobra está señalizando en Nuevo México?
  choices:
    A: Giro a la derecha
    B: Detenerse o reducir la velocidad
    C: Giro a la izquierda
    D: Giro en U
  answer: C
  explanation: Las señales manuales estándar en Nuevo México definen el brazo izquierdo
    extendido hacia afuera como una señal para un giro a la izquierda.
- id: 215
  category: signs_and_signals
  question: ¿Cómo son las 'señales de servicio' (como las de gasolina, comida o alojamiento)
    en Nuevo México?
  choices:
    A: Verdes con letras blancas
    B: Azules con letras blancas
    C: Marrones con letras blancas
    D: Amarillas con letras negras
  answer: B
  explanation: En Nuevo México y en todo EE. UU., las señales azules con letras blancas
    brindan información sobre los servicios para automovilistas, como combustible,
    comida e instalaciones médicas.
- id: 216
  category: signs_and_signals
  question: En Nuevo México, ¿qué indica una línea blanca continua entre carriles
    de tráfico que se mueven en la misma dirección?
  choices:
    A: Se le anima a cambiar de carril
    B: Debe permanecer en su carril; se desaconsejan o restringen los cambios de carril
    C: La carretera está a punto de convertirse en una calle de un solo sentido
    D: Debe detenerse inmediatamente
  answer: B
  explanation: Una línea blanca continua indica que los conductores deben permanecer
    en su carril y que se desaconsejan los cambios de carril porque pueden ser peligrosos.
- id: 217
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de color rosa fluorescente en Nuevo
    México?
  choices:
    A: Advertencia de zona escolar
    B: Guía escénica y de recreación pública
    C: Gestión de incidentes (accidentes, inundaciones o escenas de emergencia)
    D: Advertencia de construcción o mantenimiento
  answer: C
  explanation: Las señales de color rosa fluorescente se utilizan específicamente
    para la gestión de incidentes para advertir a los conductores sobre escenas de
    emergencia como choques o desastres naturales.
- id: 218
  category: signs_and_signals
  question: Al acercarse a un cruce de ferrocarril con una señal de 'Aspa' (Crossbuck)
    y sin señales luminosas, ¿qué exige la ley de Nuevo México?
  choices:
    A: Detenerse siempre por completo
    B: Ceder el paso a cualquier tren que se aproxime y proceder solo cuando sea seguro
    C: Acelerar para cruzar las vías antes de que llegue un tren
    D: Detenerse solo si hay más de dos vías
  answer: B
  explanation: Una señal de aspa (Crossbuck) debe tratarse como una señal de ceda
    el paso; debe reducir la velocidad y ceder el paso a cualquier tren que se aproxime.
- id: 219
  category: signs_and_signals
  question: En Nuevo México, ¿qué indica generalmente un bordillo (curb) pintado de
    amarillo?
  choices:
    A: Zona de carga u otra restricción
    B: No se permite estacionar en ningún momento
    C: Estacionamiento solo para personas con discapacidad
    D: Estacionamiento público sin restricciones
  answer: A
  explanation: Los bordillos amarillos en Nuevo México suelen indicar una zona de
    carga u otras restricciones de estacionamiento específicas definidas por las ordenanzas
    locales.
- id: 220
  category: signs_and_signals
  question: ¿Qué significa una señal en forma de diamante en Nuevo México?
  choices:
    A: Información reglamentaria
    B: Ceder el derecho de paso
    C: Advertencia o peligro adelante
    D: Destino y distancia
  answer: C
  explanation: Las señales en forma de diamante se utilizan como señales de advertencia
    para alertar a los conductores sobre condiciones peligrosas existentes o potenciales
    en la carretera o junto a ella.
- id: 221
  category: signs_and_signals
  question: ¿Si se encuentra en una intersección con una luz roja y una flecha verde
    apuntando a la derecha, qué se le permite hacer en Nuevo México?
  choices:
    A: Detenerse y esperar a que la luz principal cambie a verde
    B: Girar a la derecha solo después de detenerse por completo
    C: Girar a la derecha sin detenerse, cediendo el paso a los peatones en el cruce
    D: Girar a la derecha solo si no hay una señal de 'No girar en rojo'
  answer: C
  explanation: Una flecha verde significa que tiene un giro 'protegido'. Puede avanzar
    en la dirección de la flecha, aunque aún debe ceder el paso a los peatones que
    ya se encuentren en la intersección.
- id: 222
  category: signs_and_signals
  question: ¿Para qué propósito se utiliza un carril central marcado en ambos lados
    por una línea amarilla continua y una línea amarilla discontinua en Nuevo México?
  choices:
    A: Rebasar tráfico más lento por la izquierda
    B: Solo para estacionamiento de emergencia
    C: Solo para giros a la izquierda (carril de giro compartido)
    D: Solo para vehículos de alta ocupación (HOV)
  answer: C
  explanation: Esta marca indica un carril de giro a la izquierda compartido, que
    es utilizado por vehículos que viajan en cualquier dirección para realizar giros
    a la izquierda.
- id: 223
  category: signs_and_signals
  question: En Nuevo México, ¿cuál es la señal manual correcta para un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido recto hacia afuera
  answer: B
  explanation: Para señalar un giro a la derecha usando señales manuales, el conductor
    debe extender su brazo izquierdo por la ventana y doblarlo hacia arriba a la altura
    del codo.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, en el cruce de peatones o antes de entrar
    en la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 224
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) roja y blanca en forma de triángulo
    significa que debe reducir la velocidad y ceder el paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen con seguridad.
  id: 225
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 226
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 227
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 228
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 229
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 230
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite dar vuelta en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 231
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 232
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha únicamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 233
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 234
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 235
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 236
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 237
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 238
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de tren. Significa que debe ceder el paso a los trenes. Si
    se acerca un tren, debe detenerse.
  id: 239
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 240
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 241
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 242
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté atento a los cambios en las condiciones
    de la carretera.
  id: 243
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal de incorporación amarilla en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 244
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la carretera y ajuste
    su posición en el carril.
  id: 245
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 246
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 247
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 248
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 249
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 250
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 251
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (yield)
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 252
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 253
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 254
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario fusionarse
    D: Se requiere girar a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de fusionarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 255
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 256
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de estacionamiento para personas con discapacidad vigente pueden
    estacionarse en estos espacios. Las infracciones conllevan multas elevadas.
  id: 257
