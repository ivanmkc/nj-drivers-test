metadata:
  source: //mva.maryland.gov/Documents/DL-002.pdf:2025 Maryland Driver's Handbook
    (mva.maryland.gov)
  total_questions: 218
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: What is the Maryland Motor Vehicle Administration's goal regarding fatalities
    on Maryland's roads?
  choices:
    A: Reduce fatalities by 50%
    B: Reach zero fatalities
    C: Limit fatalities to under 100 per year
    D: Decrease fatalities in work zones only
  answer: B
  explanation: The Administrator's Message states, 'Our goal is to reach zero fatalities
    (no deaths) on Maryland’s roads, because even one life lost is one too many.'
- id: 2
  category: safe_driving_rules
  question: According to the Administrator's Message, which of the following is a
    responsibility every time you get behind the wheel?
  choices:
    A: Drive sober
    B: Drive at least 10 mph under the speed limit
    C: Only wear a seat belt on highways
    D: Yield to motorcycles only at night
  answer: A
  explanation: The Administrator's Message explicitly lists 'Drive sober' as one of
    the responsibilities every driver has every time they get behind the wheel.
- id: 3
  category: driver_responsibility
  question: 'The Administrator''s Message reminds new drivers that driving is considered
    a:'
  choices:
    A: Constitutional right
    B: Privilege
    C: Requirement for citizenship
    D: Federal mandate
  answer: B
  explanation: The Administrator's Message states, 'It is important to remember that
    driving is a privilege, and you play a part in making sure that everyone stays
    safe on our roads.'
- id: 4
  category: sharing_the_road
  question: To help keep everyone safe on the road, the Administrator's Message specifically
    advises drivers to look how many times for motorcycles?
  choices:
    A: Once
    B: Twice
    C: Three times
    D: Only when changing lanes
  answer: B
  explanation: The Administrator's Message includes 'Look twice for motorcycles' in
    its list of responsibilities for making safe choices behind the wheel.
- id: 5
  category: driver_testing
  question: Where can you find the Online Driver Test Tutorial to test your understanding
    of the rules of the road?
  choices:
    A: On the MVA mobile app
    B: At any local public library
    C: On the MVA website at mva.maryland.gov/drivers
    D: By calling the TTY number
  answer: C
  explanation: The Administrator's Message states that the Online Driver Test Tutorial
    is located on the MVA website, mva.maryland.gov/drivers.
- id: 6
  category: license_system
  question: According to the Table of Contents, which section covers the Rookie Driver/Graduated
    Licensing System?
  choices:
    A: Section 1
    B: Section 2
    C: Section 3
    D: Section 4
  answer: B
  explanation: According to the Table of Contents, Section 2 is titled 'Licensing
    Requirements and Process' and includes the 'Rookie Driver/Graduated Licensing
    System'.
- id: 7
  category: defensive_driving
  question: Which of the following topics is categorized under 'Dangerous Driving
    Behaviors' in Section 6 of the manual?
  choices:
    A: Hydroplaning
    B: Distracted Driving
    C: Highway-Railroad Crossings
    D: Passing
  answer: B
  explanation: 'The Table of Contents lists ''Distracted Driving'' under Section 6:
    Dangerous Driving Behaviors.'
- id: 8
  category: penalties_and_points
  question: The 'Drug and Alcohol Test – Implied Consent' rule is covered under which
    section of the manual?
  choices:
    A: 'Section 6: Dangerous Driving Behaviors'
    B: 'Section 8: Crashes and Traffic Stops'
    C: 'Section 9: Other Restrictions, Violations and Penalties'
    D: 'Section 10: Other Important Information'
  answer: C
  explanation: 'The Table of Contents lists ''Drug and Alcohol Test – Implied Consent''
    under Section 9: Other Restrictions, Violations and Penalties.'
- id: 9
  category: sharing_the_road
  question: Section 7, 'Sharing the Road,' includes information on interacting with
    which of the following?
  choices:
    A: Slow Moving Vehicles
    B: Funeral Processions
    C: School Buses
    D: Traffic Circles
  answer: C
  explanation: 'According to the Table of Contents, Section 7: Sharing the Road includes
    a subsection specifically on ''School Buses''.'
- id: 10
  category: safe_driving_rules
  question: If you need to learn about driving in fog or inclement weather, which
    section of the manual should you consult?
  choices:
    A: 'Section 3: Basic Driving'
    B: 'Section 4: Signs, Signals and Pavement Markings'
    C: 'Section 5: Driving Situations and Conditions'
    D: 'Section 8: Crashes and Traffic Stops'
  answer: C
  explanation: 'The Table of Contents shows that ''Driving in Fog'' and ''Driving
    in Inclement Weather'' are covered in Section 5: Driving Situations and Conditions.'
- id: 11
  category: license_system
  question: What is the TTY phone number provided for the Hearing Impaired to contact
    the Maryland MVA?
  choices:
    A: 410-768-7000
    B: 1-800-492-4575
    C: 1-800-555-1234
    D: 410-768-7001
  answer: B
  explanation: The contact information on the first page of the manual lists the TTY
    for the Hearing Impaired as 1-800-492-4575.
- id: 12
  category: driver_responsibility
  question: According to the Administrator's Message, how will a new driver get better
    at driving?
  choices:
    A: By driving only during daylight hours
    B: With more experience on different roads and under different conditions
    C: By avoiding heavy traffic entirely
    D: By only driving with a supervising driver
  answer: B
  explanation: The Administrator's Message states, 'you will get better at driving
    with more experience on different roads, under different conditions, and in different
    environments.'
- id: 13
  category: safe_driving_rules
  question: The 'Move Over Law' is discussed in which section of the Maryland Driver's
    Manual?
  choices:
    A: 'Section 3: Basic Driving'
    B: 'Section 6: Dangerous Driving Behaviors'
    C: 'Section 7: Sharing the Road'
    D: 'Section 8: Crashes and Traffic Stops'
  answer: D
  explanation: 'According to the Table of Contents, the ''Move Over Law'' is located
    in Section 8: Crashes and Traffic Stops.'
- id: 14
  category: driver_testing
  question: 'Which of the following is listed as a requirement under Section 1: Driving
    Tests Requirements?'
  choices:
    A: Vision Screening
    B: Co-Signer Application
    C: Provisional License
    D: Organ Donor
  answer: A
  explanation: 'The Table of Contents lists ''Vision Screening'' as subsection A under
    Section 1: Driving Tests Requirements.'
- id: 15
  category: license_system
  question: According to the copyright information in the manual, which of the following
    actions is prohibited?
  choices:
    A: Using the content for free to study the Maryland Vehicle Law
    B: Reading the manual online
    C: Any unauthorized reprint, use, distribution, or sale of the material
    D: Sharing the manual with a driving instructor
  answer: C
  explanation: The copyright section explicitly states, 'Any unauthorized reprint,
    use, distribution, or sale of this material is prohibited.'
- id: 16
  category: driver_testing
  question: What is the minimum visual acuity required in each eye to qualify for
    a Maryland driver's license?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: To qualify for a driver's license, the applicant must have visual acuity
    of at least 20/40 in each eye.
- id: 17
  category: driver_testing
  question: How many questions are on the Maryland driver's knowledge test, and how
    much time do you have to complete it?
  choices:
    A: 20 questions, 15 minutes
    B: 25 questions, 20 minutes
    C: 30 questions, 25 minutes
    D: 50 questions, 45 minutes
  answer: B
  explanation: There are 25 questions on the knowledge test, and you will have 20
    minutes to take the test.
- id: 18
  category: driver_testing
  question: 'When bringing a vehicle to the MVA for your driving skills test, the
    vehicle must have at least:'
  choices:
    A: A quarter tank of gas
    B: A half tank of gas
    C: Three-quarters of a tank of gas
    D: A full tank of gas
  answer: B
  explanation: The vehicle used for the driving skills test must be safe to drive,
    have no windshield cracks affecting vision, and have at least a half tank of gas.
- id: 19
  category: driver_testing
  question: Who is allowed in the vehicle with you during the driving skills test?
  choices:
    A: Only you and the MVA examiner, plus an approved interpreter if needed
    B: You, the MVA examiner, and your supervising driver
    C: You, the MVA examiner, and one family member
    D: You, the MVA examiner, and your driver education instructor
  answer: A
  explanation: Only you and the person giving you the test are allowed in the vehicle
    during the test. An interpreter that the MVA approves can also be in the car if
    you need one.
- id: 20
  category: penalties_and_points
  question: What is the maximum penalty for littering on state roads in Maryland?
  choices:
    A: A $500 fine
    B: A $1000 fine and 15 days in prison
    C: A $1500 fine or 30 days in prison
    D: A $2000 fine or 60 days in prison
  answer: C
  explanation: Fines for littering can cost up to $1500 or 30 days in prison.
- id: 21
  category: license_system
  question: When applying for a noncommercial driver's license, how many documents
    must you bring to prove that you live in Maryland?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: When you apply, you must bring two documents that prove that you live
    in Maryland.
- id: 22
  category: license_system
  question: Which of the following types of documents will the MVA accept when you
    apply for a driver's license?
  choices:
    A: Original documents or certified copies
    B: Notarized photocopies
    C: High-quality color photocopies
    D: Documents with erased and corrected information
  answer: A
  explanation: You must bring original documents or copies certified by the agency
    that provided them to you. The MVA will not accept photocopies, notarized copies,
    or documents with changed or erased information.
- id: 23
  category: license_system
  question: What class of license is a standard noncommercial driver's license used
    for regular cars, pickup trucks, and vans?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class M
  answer: C
  explanation: A noncommercial driver's license allows you to drive regular vehicles
    like cars, pickup trucks, and vans. It is also called a Class C driver's license.
- id: 24
  category: license_system
  question: How long is a Type 1 Learner's Instructional Permit valid for?
  choices:
    A: 6 months
    B: 1 year
    C: 18 months
    D: Up to 2 years
  answer: D
  explanation: If you have never had a noncommercial driver's license you must get
    a Type 1 Learner's Instructional Permit. The Permit lasts up to 2 years.
- id: 25
  category: license_system
  question: 'A Type 2 Learner''s Instructional Permit is required if you:'
  choices:
    A: Have never had a driver's license before
    B: Already have a driver's license and want a different class of license
    C: Are under 16 years old
    D: Have had your license suspended for a moving violation
  answer: B
  explanation: If you already have a driver's license and want a different class of
    driver's license, you must apply for a Type 2 Learner's Instructional Permit.
- id: 26
  category: license_system
  question: What is the minimum age required to apply for a Learner's Instructional
    Permit if you are under 25 years old?
  choices:
    A: 15 years and 6 months
    B: 15 years and 9 months
    C: 16 years
    D: 16 years and 3 months
  answer: B
  explanation: Applicants younger than 25 must be at least 15 years and 9 months old.
- id: 27
  category: driver_testing
  question: How many total practice driving hours must an applicant under 25 years
    old complete with a supervising driver?
  choices:
    A: 14 hours
    B: 30 hours
    C: 45 hours
    D: 60 hours
  answer: D
  explanation: Applicants younger than 25 must practice driving at least 60 hours
    with a supervising driver.
- id: 28
  category: driver_testing
  question: If an applicant is 25 years old or older, how many practice driving hours
    must they complete before taking the driving skills test?
  choices:
    A: 14 hours
    B: 30 hours
    C: 45 hours
    D: 60 hours
  answer: A
  explanation: Applicants 25 years old and older must complete at least 14 practice
    hours with a supervising driver.
- id: 29
  category: license_system
  question: How long must an applicant who is 25 years old or older hold their Learner's
    Instructional Permit before becoming eligible for a Provisional License?
  choices:
    A: At least 14 days
    B: At least 30 days
    C: At least 45 days
    D: At least 9 months
  answer: C
  explanation: Applicants 25 years old and older must have their permit for at least
    45 days before they are eligible for a Provisional License.
- id: 30
  category: penalties_and_points
  question: If you are convicted of a moving violation while holding a Learner's Instructional
    Permit, how long must you hold the permit from the date of the conviction before
    becoming eligible for a Provisional License?
  choices:
    A: 45 days
    B: 3 months
    C: 6 months
    D: 9 months
  answer: D
  explanation: At any age, if you have been convicted of or given a Probation Before
    Judgement (PBJ) for a moving violation, you must hold the Learner's Instructional
    Permit at least 9 months following the most recent date you were convicted.
- id: 31
  category: license_system
  question: How long must a driver under age 18 hold their Learner's Instructional
    Permit without a violation before being eligible for a Provisional License?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 18 months
  answer: C
  explanation: According to the manual, if you are under age 18, you must hold the
    Permit for at least 9 months without a violation before being eligible for a Provisional
    License.
- id: 32
  category: license_system
  question: If you are 25 years or older, how many practice driving hours must be
    recorded on your Practice and Skills Log to get a Provisional License?
  choices:
    A: 14 hours
    B: 30 hours
    C: 45 hours
    D: 60 hours
  answer: A
  explanation: The manual states that you must submit a Practice and Skills Log showing
    you completed at least 60 practice hours driving with a supervising driver, or
    14 hours if you are 25 or older.
- id: 33
  category: license_system
  question: What happens when you meet all the requirements to graduate from a Provisional
    License to a regular Driver's License?
  choices:
    A: You must retake the driving skills test.
    B: You must visit an MVA branch to apply for the upgrade.
    C: The MVA will automatically switch your license and mail you a card.
    D: You must complete another 60 hours of supervised driving.
  answer: C
  explanation: When you have met all the requirements, the MVA will automatically
    switch your Provisional License to a Driver's License and a card showing the switch
    will be mailed to you.
- id: 34
  category: driver_responsibility
  question: Who is eligible to co-sign a minor's application for a license if the
    minor is married?
  choices:
    A: Any licensed driver over the age of 21.
    B: The minor's husband or wife, if they are 18 or older.
    C: Only a parent or legal guardian.
    D: An MVA approved driving instructor.
  answer: B
  explanation: 'The manual states: ''If you are married and your husband or wife is
    18 or older, they can co-sign. You must provide proof that you are married.'''
- id: 35
  category: driver_responsibility
  question: How can a co-signer cancel a minor's driver's license?
  choices:
    A: By verbally requesting cancellation at any MVA branch.
    B: By submitting a written request to the MVA's Administrative Adjudication Division.
    C: By confiscating the minor's physical license card.
    D: By removing the minor from their auto insurance policy.
  answer: B
  explanation: The co-signer may cancel a minor's license by submitting a written
    request to the MVA's Administrative Adjudication Division.
- id: 36
  category: driver_testing
  question: If you have an out-of-country license, which of the following is required
    to get a Maryland license?
  choices:
    A: A 3-hour roadway safety driving education program.
    B: A 14-hour supervised driving log.
    C: A letter of recommendation from the embassy.
    D: A minimum of 18 months of driving experience in Maryland.
  answer: A
  explanation: To get a Maryland license with an out-of-country license, you must
    successfully complete a vision screening, knowledge test, driving skills test,
    and a three-hour roadway safety driving education program approved by the MVA.
- id: 37
  category: driver_testing
  question: If the MVA offers the knowledge test in your spoken language, how many
    times must you take it before you are allowed to use an interpreter?
  choices:
    A: 2 times
    B: 3 times
    C: 5 times
    D: You cannot use an interpreter if the test is offered in your language.
  answer: C
  explanation: 'The manual states: ''If we offer the knowledge test in the language
    that you speak, you must take it at least 5 times before using an interpreter.'''
- id: 38
  category: driver_testing
  question: Which of the following is a rule regarding interpreters providing services
    for knowledge or skills testing at the MVA?
  choices:
    A: The MVA charges a standard fee for the interpreter's services.
    B: The interpreter must be a family member of the applicant.
    C: The interpreter may also certify the customer's residence.
    D: The interpreter may not provide other services to the customer being tested.
  answer: D
  explanation: Interpreters providing services for knowledge/skills testing may not
    provide other services to the customer being tested, such as certifying residence
    or conducting driving school business.
- id: 39
  category: alcohol_drugs_health
  question: What documentation will the MVA ask you to provide to obtain a Developmental
    Disability Disclosure Card?
  choices:
    A: A signed letter from a licensed physician.
    B: Court documents proving legal guardianship.
    C: Medical records detailing your specific disability.
    D: The MVA will NOT ask you to provide documentation about your disability.
  answer: D
  explanation: 'Carrying a Developmental Disability Disclosure Card is voluntary,
    and the manual explicitly states: ''MVA will NOT ask you to provide information
    or documentation about your disability to get this card.'''
- id: 40
  category: safe_driving_rules
  question: What documents must you have with you before you drive a vehicle?
  choices:
    A: A valid permit or license, and the vehicle registration card.
    B: A valid permit or license, and your birth certificate.
    C: The vehicle title and proof of insurance.
    D: A Developmental Disability Disclosure Card and a valid license.
  answer: A
  explanation: Before you drive, you must have a valid Learner's Permit or driver's
    license, and vehicle registration card with you.
- id: 41
  category: defensive_driving
  question: What does the manual describe as 'defensive driving'?
  choices:
    A: Assuming other drivers will always follow the rules of the road.
    B: Searching ahead and being ready to change speed or lanes to identify risks.
    C: Yielding the right-of-way only when directed by a traffic signal.
    D: Driving at a constant speed regardless of road conditions.
  answer: B
  explanation: 'The manual defines defensive driving as: ''By searching ahead and
    being ready to change speed or change lanes, you can drive more safely and have
    time to identify risks. This is called defensive driving.'''
- id: 42
  category: safe_driving_rules
  question: Who should you yield the right-of-way to if you and another driver arrive
    at an intersection at the same time?
  choices:
    A: The driver on your left.
    B: The driver on your right.
    C: The driver going straight.
    D: The driver turning left.
  answer: B
  explanation: You should yield the right-of-way to the driver on your right, if both
    of you arrive at an intersection at the same time.
- id: 43
  category: defensive_driving
  question: Which of the following is a recommended step to manage risk while operating
    a motor vehicle?
  choices:
    A: Assume that other drivers will do what they are supposed to do.
    B: Decrease the time you have to respond to your surroundings.
    C: Maintain a safe distance between your vehicle and other people using the road.
    D: Rely solely on your mirrors to know what is happening around your vehicle.
  answer: C
  explanation: To manage risk, the manual recommends that you 'Maintain a safe distance
    between your vehicle and other people using the road' and explicitly says 'Do
    not assume that other drivers will do what they are supposed to do.'
- id: 44
  category: license_system
  question: What is a restriction placed on a Provisional Driver's License?
  choices:
    A: You must drive with a supervising driver at all times.
    B: You are not allowed to drive on interstate highways.
    C: You are restricted from having passengers and driving at night.
    D: You must log an additional 60 hours of practice driving.
  answer: C
  explanation: A Provisional Driver's License permits you to drive without supervision
    but with restrictions, such as no passengers and no driving at night.
- id: 45
  category: safe_driving_rules
  question: 'When making a left turn, you must yield the right-of-way to:'
  choices:
    A: Drivers in the opposing traffic lane
    B: Drivers behind you
    C: Drivers turning right from the intersecting road
    D: No one, you automatically have the right-of-way
  answer: A
  explanation: You should yield the right-of-way to drivers in the opposing traffic
    lane when you are making a left turn.
- id: 46
  category: safe_driving_rules
  question: What does the posted speed limit represent?
  choices:
    A: The suggested speed for all weather conditions
    B: The minimum legal speed you can travel
    C: The maximum legal speed you can travel under ideal conditions
    D: The speed you must maintain regardless of traffic
  answer: C
  explanation: The posted speed limit is the maximum legal speed you can travel on
    a road under ideal (perfect) conditions.
- id: 47
  category: defensive_driving
  question: Why is it dangerous to drive at a speed significantly lower than other
    traffic?
  choices:
    A: It causes excessive wear on your brakes
    B: It encourages other vehicles to constantly pass you, increasing the chances
      of a crash
    C: It is illegal on all Maryland roads
    D: It decreases your ability to handle curves
  answer: B
  explanation: Driving at a speed lower than other traffic encourages other vehicles
    to constantly pass you, which increases the chances of a crash.
- id: 48
  category: safe_driving_rules
  question: Under ideal driving conditions, what is the minimum following distance
    recommended by the MVA?
  choices:
    A: 1 to 2 seconds
    B: 3 to 4 seconds
    C: 5 to 6 seconds
    D: 10 seconds
  answer: B
  explanation: The MVA recommends a minimum following distance of 3 to 4 seconds under
    ideal driving conditions.
- id: 49
  category: defensive_driving
  question: 'When following vehicles that stop often, such as buses or delivery vans,
    you should increase your following distance to:'
  choices:
    A: Two or three seconds
    B: Three or four seconds
    C: Four or five seconds
    D: Seven or eight seconds
  answer: C
  explanation: When following vehicles that stop often, you should increase the distance
    between your vehicle and the one ahead of you to four or five seconds, and possibly
    more if needed.
- id: 50
  category: safe_driving_rules
  question: When is it generally acceptable to drive to the left of the center of
    the road?
  choices:
    A: When you are passing another vehicle going in the same direction
    B: When you are approaching a blind curve
    C: When you are driving in a residential area
    D: When you are preparing to park on the right shoulder
  answer: A
  explanation: You should keep your vehicle to the right of the center of the road
    unless you are passing another vehicle going in the same direction, a sign/signal
    allows it, or there is an obstacle.
- id: 51
  category: safe_driving_rules
  question: When making a legal U-turn, which lane should you turn into?
  choices:
    A: The inside or left-hand lane traveling in the opposite direction
    B: The outside or right-hand lane traveling in the opposite direction
    C: The center turn lane
    D: Any available lane
  answer: B
  explanation: When making a U-turn, after yielding to traffic and ensuring the way
    is clear, turn into the outside or right-hand lane traveling in the opposite direction.
- id: 52
  category: safe_driving_rules
  question: 'Before returning to your original lane after passing another vehicle,
    you should:'
  choices:
    A: Honk your horn to alert the other driver
    B: See both headlights of the passed vehicle in your rear-view mirror
    C: Flash your high beams
    D: Ensure you are at least 10 feet ahead of the passed vehicle
  answer: B
  explanation: When passing, you must see both headlights of the passed vehicle in
    your rear-view mirror before returning to the lane you came from.
- id: 53
  category: safe_driving_rules
  question: In which of the following situations is it illegal to pass another vehicle?
  choices:
    A: On an unobstructed one-way road with two or more lanes
    B: When the other vehicle is about to make a left turn
    C: When crossing or within 100 feet of an intersection
    D: When you are on an unobstructed road with two or more lanes moving in the same
      direction
  answer: C
  explanation: You may not pass when crossing or within 100 feet of an intersection
    or railroad grade crossing.
- id: 54
  category: sharing_the_road
  question: What must you do when another vehicle is passing you?
  choices:
    A: Speed up to get out of their way
    B: Move onto the right shoulder
    C: Yield to the other vehicle and not increase your speed
    D: Honk your horn to acknowledge them
  answer: C
  explanation: When being passed by another vehicle, you must yield to the other vehicle
    and not increase your speed.
- id: 55
  category: vehicle_information
  question: 'When parking a vehicle with a manual transmission, you should set the
    parking brake and:'
  choices:
    A: Place the vehicle in neutral
    B: Place the vehicle in gear
    C: Place the vehicle in 'park'
    D: Turn the steering wheel sharply to the left
  answer: B
  explanation: When parking, you should set your parking brake and place the vehicle
    in gear if it has a manual transmission (or in 'park' if it has an automatic transmission).
- id: 56
  category: signs_and_signals
  question: When are you permitted to disobey a traffic control device?
  choices:
    A: When you are running late for an emergency
    B: When a police officer tells you to do something different
    C: When there is no other traffic around
    D: When you are driving a commercial vehicle
  answer: B
  explanation: The only time you do not have to obey all traffic control devices is
    when a police officer, other emergency personnel, or a school crossing guard tells
    you to do something different.
- id: 57
  category: signs_and_signals
  question: 'Unless a sign prohibits it, you may turn right at a steady red signal:'
  choices:
    A: Without stopping if the intersection is clear
    B: Only if you are in the rightmost lane and honk your horn
    C: After coming to a complete stop and yielding to pedestrians and other traffic
    D: Only between the hours of 6 AM and 6 PM
  answer: C
  explanation: Unless a sign prohibits turning on red, after coming to a complete
    stop, you may turn right. You must yield the right-of-way to pedestrians and all
    other traffic.
- id: 58
  category: signs_and_signals
  question: What should you do if you approach an intersection where the traffic signal
    is not working?
  choices:
    A: Proceed through the intersection without stopping if you have the right-of-way
    B: Stop at a clearly marked stop line or before entering the crosswalk
    C: Treat the intersection as a yield sign
    D: Wait for a police officer to arrive
  answer: B
  explanation: When a traffic signal is not working, you must stop at a clearly marked
    stop line. If there is no clearly marked stop line, you must stop before entering
    a crosswalk.
- id: 59
  category: signs_and_signals
  question: What does a fluorescent pink traffic sign indicate?
  choices:
    A: School zones and pedestrian crossings
    B: Emergency traffic incidents
    C: Construction and maintenance work areas
    D: Recreation and cultural interest areas
  answer: B
  explanation: According to the manual, fluorescent pink signs are used to indicate
    emergency traffic incidents.
- id: 60
  category: signs_and_signals
  question: What does a steady yellow 'X' lane use signal mean?
  choices:
    A: You can use the lane for a left turn.
    B: You must never drive in that lane.
    C: You should move out of the lane as soon as you safely can.
    D: You may drive in the lane but must reduce your speed.
  answer: C
  explanation: A steady yellow 'X' signal means you should move out of the lane as
    soon as you safely can.
- id: 61
  category: signs_and_signals
  question: Which sign shape is used exclusively to warn of school zones and mark
    school crossings?
  choices:
    A: Diamond
    B: Pentagon
    C: Pennant
    D: Octagon
  answer: B
  explanation: The pentagon (five-sided) shape warns you of school zones and marks
    school crossings.
- id: 62
  category: signs_and_signals
  question: How should a driver respond to a flashing red traffic signal?
  choices:
    A: Slow down and proceed with caution without stopping.
    B: Come to a complete stop, yield to traffic and pedestrians, and proceed when
      clear.
    C: Stop only if other vehicles are approaching the intersection.
    D: Yield to traffic on the right without coming to a full stop.
  answer: B
  explanation: For a flashing red signal, you must come to a complete stop at the
    stop line, yield to all other traffic and pedestrians, and proceed when the way
    is clear.
- id: 63
  category: signs_and_signals
  question: What type of information is typically found on brown traffic signs?
  choices:
    A: Destinations, distances, and directions
    B: Services like food, gas, and rest areas
    C: Recreation and cultural interest areas
    D: Construction and maintenance work areas
  answer: C
  explanation: Brown traffic signs indicate recreation and cultural interest areas.
- id: 64
  category: signs_and_signals
  question: What does a flashing yellow 'X' signal above a reversible lane indicate?
  choices:
    A: The lane is closed to all traffic.
    B: You must move out of the lane immediately.
    C: You can use the lane for a left turn, sharing it with opposite traffic.
    D: You have the exclusive right-of-way to travel straight.
  answer: C
  explanation: A flashing yellow 'X' signal or two-way left-turn arrows mean you can
    use the lane for a left turn, and you will likely be sharing the lane with left-turning
    vehicles coming from the opposite direction.
- id: 65
  category: safe_driving_rules
  question: What should you do if you are approaching an intersection and the signal
    changes to a steady yellow?
  choices:
    A: Speed up to beat the red light.
    B: Stop immediately, even if you are in the middle of the intersection.
    C: Carefully continue through if you are too close to the intersection to stop
      safely.
    D: Reverse your vehicle to clear the crosswalk.
  answer: C
  explanation: A steady yellow signal gives you time to stop safely. If you are too
    close to the intersection to stop safely, carefully continue through the intersection.
- id: 66
  category: signs_and_signals
  question: Which color is used for signs that warn of school, pedestrian, and bicycle
    crossings?
  choices:
    A: Yellow
    B: Fluorescent Yellow-Green
    C: White
    D: Orange
  answer: B
  explanation: Fluorescent Yellow-Green is the color used for school, pedestrian,
    and bicycle signs.
- id: 67
  category: signs_and_signals
  question: What is the purpose of mile marker signs located on interstate highways?
  choices:
    A: They indicate the current maximum speed limit.
    B: They provide location information in case you need emergency assistance.
    C: They show the exact distance to the next gas station or rest area.
    D: They mark the beginning of a new county or state line.
  answer: B
  explanation: Mile marker signs provide location information you can use if you need
    someone to find you, such as a tow truck or emergency personnel.
- id: 68
  category: sharing_the_road
  question: When a crosswalk signal shows a solid red light to drivers, what must
    the driver do?
  choices:
    A: Stop and wait until the light changes.
    B: Slow down and proceed if no pedestrians are visible.
    C: Stop, then proceed with caution.
    D: Honk to warn pedestrians before crossing.
  answer: A
  explanation: According to the crosswalk signals chart, a solid red light for drivers
    means 'Stop!' and they must wait while pedestrians cross.
- id: 69
  category: signs_and_signals
  question: Which shape is used to identify the location of a highway-rail grade crossing?
  choices:
    A: Round
    B: Crossbuck
    C: Trapezoid
    D: Diamond
  answer: B
  explanation: The Crossbuck shape identifies the location of a highway-rail grade
    crossing.
- id: 70
  category: safe_driving_rules
  question: What is the correct action when approaching a flashing yellow traffic
    signal?
  choices:
    A: Come to a complete stop and wait for a green light.
    B: Treat it as a four-way stop.
    C: Slow down and proceed with caution.
    D: Accelerate to clear the intersection quickly.
  answer: C
  explanation: A flashing yellow signal means you must slow down and proceed with
    caution.
- id: 71
  category: signs_and_signals
  question: What do rectangular signs with black lettering on a white background typically
    indicate?
  choices:
    A: General warnings of hazards ahead
    B: Regulatory information and traffic laws you must obey
    C: Directions to hospitals and airports
    D: Emergency traffic incidents
  answer: B
  explanation: Rectangular (4-Sided) Signs that are Black on White regulate traffic.
    They are about traffic laws and you must obey them.
- id: 72
  category: signs_and_signals
  question: What type of information do Service Information and Guide Signs provide?
  choices:
    A: The speed limit on the upcoming road
    B: Businesses and services you can find if you take certain exits
    C: The route number and type of road
    D: Areas where parking is strictly prohibited
  answer: B
  explanation: According to the manual, Service Information and Guide Signs identify
    the businesses and services (such as lodging, hospitals, gas, and food) you can
    find if you take certain exits.
- id: 73
  category: signs_and_signals
  question: What does a single broken yellow line on the road indicate?
  choices:
    A: Traffic is traveling in the same direction and lane changing is prohibited.
    B: Traffic is traveling in opposite directions and passing with care is permitted.
    C: It marks the right edge of the roadway.
    D: It indicates a reversible lane where traffic flows change direction.
  answer: B
  explanation: A single broken yellow line separates lanes where vehicles are traveling
    in opposite directions, and passing with care is permitted in either direction.
- id: 74
  category: signs_and_signals
  question: Where are single solid yellow lines typically used?
  choices:
    A: On the right edge of a two-way road
    B: To separate general lanes from HOV lanes
    C: To mark left edge lines on divided highways, one-way roads, and ramps
    D: In the center of a two-way road where passing is permitted
  answer: C
  explanation: The manual states that a single solid yellow line marks left edge lines
    on divided highways, one-way roads, and ramps.
- id: 75
  category: signs_and_signals
  question: What is the purpose of double (side-by-side) broken yellow lines?
  choices:
    A: They mark the edges of reversible lanes.
    B: They indicate a shared two-way left-turn lane.
    C: They mark a pedestrian crosswalk.
    D: They separate bicycle lanes from motor vehicle lanes.
  answer: A
  explanation: Double broken yellow lines mark the edges of reversible lanes, which
    are lanes where traffic flows in one direction sometimes and the other direction
    other times.
- id: 76
  category: safe_driving_rules
  question: Are you allowed to turn left across a double solid yellow line?
  choices:
    A: No, crossing a double solid yellow line is strictly prohibited under all circumstances.
    B: Yes, but only if you are passing a slow-moving vehicle.
    C: Yes, you may make a left turn across it, such as when turning into a driveway.
    D: Yes, but only during daylight hours.
  answer: C
  explanation: While passing is not allowed in either direction, the manual specifies
    that you may make a left turn across a double solid yellow line, for example,
    when turning into a driveway.
- id: 77
  category: signs_and_signals
  question: How are yield lines marked on the pavement?
  choices:
    A: As a single solid white line
    B: As rows of small triangles across the lane
    C: As double solid yellow lines
    D: As a single dotted white line
  answer: B
  explanation: Yield lines are marked as rows of small triangles across the lane that
    show where a vehicle must yield to other vehicles or pedestrians.
- id: 78
  category: sharing_the_road
  question: What is one purpose of shared-use lane markings for bicycles?
  choices:
    A: To prohibit motor vehicles from using the lane
    B: To indicate where bicycles must park
    C: To discourage biking in the wrong direction
    D: To warn bicyclists of an upcoming railroad crossing
  answer: C
  explanation: Shared-use lane markings alert drivers that bicyclists may be on the
    road, tell bicyclists where to ride, and discourage biking in the wrong direction.
- id: 79
  category: defensive_driving
  question: According to the National Highway Traffic Safety Administration, how much
    more likely is a crash to result in death on a road with a 65 mph speed limit
    compared to a 45 or 50 mph limit?
  choices:
    A: It is equally likely
    B: More than twice as likely
    C: Nearly five times as likely
    D: Ten times as likely
  answer: B
  explanation: A crash on a road with a speed limit of 65 mph or higher is more than
    twice as likely to result in death than a crash on a road with a speed limit of
    45 or 50 mph.
- id: 80
  category: safe_driving_rules
  question: When driving in reduced visibility situations, what should you use as
    a guide to stay in your lane?
  choices:
    A: The taillights of the vehicle ahead of you
    B: The center double yellow line
    C: The lines on the edge of the road or the right side of the road
    D: The headlights of oncoming traffic
  answer: C
  explanation: When driving in reduced visibility situations, you should use the lines
    on the edge of the road or the right side of the road as a guide.
- id: 81
  category: safe_driving_rules
  question: Under Maryland law, you must turn on your headlights anytime there is
    not enough light to clearly see at least how far in front of your vehicle?
  choices:
    A: 300 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: You must turn on your headlights anytime there is not enough light
    to clearly see at least 1,000 feet in front of your vehicle.
- id: 82
  category: safe_driving_rules
  question: 'Maryland law requires you to turn on your headlights when you are:'
  choices:
    A: Driving in the left lane of a divided highway
    B: Using your windshield wipers in inclement weather
    C: Approaching a railroad crossing
    D: Parking on the side of a road at night
  answer: B
  explanation: Maryland law requires that you turn on your headlights when using your
    windshield wipers in inclement weather.
- id: 83
  category: safe_driving_rules
  question: When using high beam headlights, at what distance must you change to low
    beams when following another vehicle?
  choices:
    A: 100 feet or less
    B: 200 feet or less
    C: 300 feet or less
    D: 500 feet or less
  answer: C
  explanation: You must change to low beams when following a vehicle that is 300 feet
    or less in front of you.
- id: 84
  category: defensive_driving
  question: What should you do to avoid being blinded by the headlights of oncoming
    traffic at night?
  choices:
    A: Turn on your high beams to see better
    B: Look slightly to the right of the lane you are traveling in
    C: Close one eye until the vehicle passes
    D: Stare directly at the center line of the road
  answer: B
  explanation: Do not stare into the headlights of traffic coming toward you. Instead,
    look at the road in front of you, or slightly to the right of the lane you are
    traveling in.
- id: 85
  category: safe_driving_rules
  question: Which headlights should you use when driving in fog?
  choices:
    A: High beam headlights only
    B: Low beam headlights only
    C: Parking lights only
    D: Emergency flashers and high beams
  answer: B
  explanation: When driving in fog, you should use low beam headlights only, and also
    use fog lights if you have them.
- id: 86
  category: defensive_driving
  question: What should you do if the fog is so thick that you cannot safely drive
    your vehicle?
  choices:
    A: Stop in the middle of your lane and wait for it to clear
    B: Turn on your high beams and drive at 10 mph
    C: Pull completely off the road to a safe location and turn on your emergency
      flashers
    D: Follow closely behind a large truck to use its taillights as a guide
  answer: C
  explanation: If the fog is so thick that you cannot safely drive your vehicle, pull
    completely off the road to a safe location and turn on your emergency flashers.
- id: 87
  category: vehicle_information
  question: If your vehicle does NOT have an anti-lock braking system (ABS), what
    should you do to prevent skidding on wet or icy roads?
  choices:
    A: Slam on the brakes firmly.
    B: Pump the brakes.
    C: Pull the emergency brake.
    D: Shift into neutral and coast.
  answer: B
  explanation: According to the manual, 'If your vehicle does not have an anti-lock
    braking system, pump the brakes to prevent skidding.'
- id: 88
  category: defensive_driving
  question: Which areas of the road tend to freeze before the rest of the road?
  choices:
    A: Intersections and crosswalks
    B: Ramps and bridges
    C: Tunnels and underpasses
    D: Straightaways and shoulders
  answer: B
  explanation: The manual warns that 'Ramps and bridges freeze before roads.'
- id: 89
  category: defensive_driving
  question: What is 'black ice'?
  choices:
    A: Ice that forms exclusively at night
    B: A thick layer of snow mixed with dirt
    C: A thin layer of ice on blacktop roads that is hard to see
    D: Ice that forms only on bridges and overpasses
  answer: C
  explanation: The manual describes black ice as a thin layer of ice on blacktop (asphalt)
    roads that can be very hard or impossible to see, caused by ice or snow melting
    and re-freezing.
- id: 90
  category: vehicle_information
  question: Which of the following items is recommended to keep in your car's emergency
    kit for traction on snow and ice?
  choices:
    A: Kitty litter or sand
    B: Extra engine oil
    C: A spare tire
    D: Road flares
  answer: A
  explanation: The Emergency Kit Supplies list in the manual includes 'Kitty litter
    or sand (for traction on snow and ice).'
- id: 91
  category: defensive_driving
  question: If your vehicle begins to skid, what is a basic rule to help regain control?
  choices:
    A: Slam on the brakes immediately.
    B: Steer in the opposite direction of the skid.
    C: Steer in the direction you are skidding.
    D: Close your eyes and brace for impact.
  answer: C
  explanation: If your vehicle begins to skid, basic rules include to 'Steer in the
    direction you are skidding' and to release the accelerator or brake pedal.
- id: 92
  category: defensive_driving
  question: What should you do if your vehicle begins to hydroplane?
  choices:
    A: Apply the brakes firmly.
    B: Take your foot off the gas and keep your vehicle going straight.
    C: Turn the steering wheel sharply to regain traction.
    D: Accelerate to push through the water.
  answer: B
  explanation: 'If you start to lose control due to hydroplaning, the manual instructs:
    ''Take your foot off the gas. Do not apply your brakes. Keep your vehicle going
    straight. Slow down until you get control back.'''
- id: 93
  category: sharing_the_road
  question: Which of the following vehicles are required to stop before every railroad
    crossing?
  choices:
    A: Motorcycles and mopeds
    B: Passenger cars and SUVs
    C: Buses, school buses, and trucks carrying hazardous materials
    D: Emergency vehicles with flashing lights
  answer: C
  explanation: 'The manual states: ''Buses, school buses, and trucks carrying hazardous
    materials must stop before every railroad crossing.'''
- id: 94
  category: safe_driving_rules
  question: If you have an emergency on or near a railroad crossing, what should you
    do first?
  choices:
    A: Stay in the vehicle and call 911.
    B: Get out of the vehicle and move away from the tracks.
    C: Try to push the vehicle off the tracks yourself.
    D: Wave a flag to stop the oncoming train.
  answer: B
  explanation: 'The manual advises: ''If you have an emergency on or near a railroad
    crossing, get out of the vehicle and move away from the tracks.'''
- id: 95
  category: signs_and_signals
  question: What color are the signs that indicate a work zone?
  choices:
    A: Green
    B: Blue
    C: Orange
    D: Red
  answer: C
  explanation: According to the manual, 'Orange is the color for work zones. If you
    see orange signs when driving, pay close attention...'
- id: 96
  category: signs_and_signals
  question: In a work zone, what do flashing blue lights indicate?
  choices:
    A: Workers are present
    B: Highway maintenance vehicles are ahead
    C: Active speed cameras
    D: A detour is approaching
  answer: C
  explanation: The manual's section on Lights In Work Zones specifies that 'Flashing
    blue lights' indicate 'Active speed cameras'.
- id: 97
  category: signs_and_signals
  question: What do flashing amber or yellow lights in a work zone mean?
  choices:
    A: Active speed cameras
    B: Active work zone or workers present
    C: Highway maintenance vehicles
    D: The work zone has ended
  answer: B
  explanation: The manual states that 'Flashing amber/yellow lights' mean 'Active
    work zone/workers present'.
- id: 98
  category: safe_driving_rules
  question: When approaching a traffic circle (roundabout), who has the right-of-way?
  choices:
    A: Vehicles entering the traffic circle
    B: Traffic already in the circle
    C: Vehicles on the right side
    D: Larger vehicles such as trucks and buses
  answer: B
  explanation: 'The manual dictates: ''When you come to a traffic circle, you must
    always yield to traffic already in the circle.'''
- id: 99
  category: safe_driving_rules
  question: When preparing to exit a multi-lane traffic circle, what should you do?
  choices:
    A: Turn on your left turn signal and stop.
    B: Turn on your right turn signal and move to the outside lane after passing the
      exit before yours.
    C: Accelerate rapidly to cut in front of other vehicles.
    D: Sound your horn to warn other drivers you are exiting.
  answer: B
  explanation: 'The manual explains: ''When preparing to exit, turn on your right
    turn signal and move to the outside lane after you pass the exit before the one
    you plan to take.'''
- id: 100
  category: safe_driving_rules
  question: What is the purpose of an acceleration lane when entering an interstate?
  choices:
    A: To pass slower vehicles on the right.
    B: To adjust your speed to the flow of traffic already on the interstate.
    C: To park your vehicle in an emergency.
    D: To safely exit the highway.
  answer: B
  explanation: According to the manual, you use the acceleration lane to adjust your
    speed to the flow of traffic already on the interstate.
- id: 101
  category: safe_driving_rules
  question: What should you do if you exit an interstate at the wrong place?
  choices:
    A: Stop and back up on the shoulder.
    B: Make a U-turn on the exit ramp.
    C: Continue until you are off the exit ramp and look for a way to re-enter.
    D: Stop in the deceleration lane and wait for traffic to clear.
  answer: C
  explanation: 'The manual states: ''If you exit at the wrong place, continue until
    you are off the exit ramp. Then look for a way to re-enter the road. Never stop
    and back up on any part of the highway.'''
- id: 102
  category: safe_driving_rules
  question: When are you allowed to stop on the shoulder of an interstate or limited
    access highway?
  choices:
    A: When you need to answer a cell phone call.
    B: When you want to take a rest break.
    C: Only when your vehicle is disabled or you have another emergency.
    D: When you need to check your GPS.
  answer: C
  explanation: You may stop on the shoulder, but only when your vehicle is disabled
    (stops running) or you have another emergency.
- id: 103
  category: sharing_the_road
  question: How must other vehicles react to a funeral procession?
  choices:
    A: They must yield the right-of-way even if they have a green signal.
    B: They can proceed normally if they have a green signal.
    C: They should honk their horn to show respect.
    D: They may pass the procession on the right side.
  answer: A
  explanation: 'The manual states: ''Even if they have a green signal, other vehicles
    must yield the right-of-way to vehicles in a funeral procession.'''
- id: 104
  category: signs_and_signals
  question: A slow-moving vehicle sign on the back of a vehicle warns that the vehicle
    is traveling at what speed?
  choices:
    A: 15 miles per hour or less
    B: 25 miles per hour or less
    C: 35 miles per hour or less
    D: 45 miles per hour or less
  answer: B
  explanation: Some slow moving vehicles may have the slow-moving sign on the back
    to warn you they are only going 25 miles per hour or less.
- id: 105
  category: alcohol_drugs_health
  question: In Maryland, a driver is considered to be driving under the influence
    of alcohol when their blood alcohol concentration (BAC) is at or above what level?
  choices:
    A: '.04'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: Maryland considers drivers to be driving under the influence of alcohol
    when their blood alcohol concentration is .08 or higher.
- id: 106
  category: penalties_and_points
  question: What is the legal consequence if a driver under the age of 21 is stopped
    by law enforcement and has been drinking?
  choices:
    A: They will receive a warning for the first offense.
    B: Their license will be suspended or revoked.
    C: They must attend a mandatory defensive driving class without losing their license.
    D: They will only be fined if their BAC is .08 or higher.
  answer: B
  explanation: If you are not yet 21 years old and law enforcement stops you and you
    have been drinking, your license will be suspended or revoked.
- id: 107
  category: alcohol_drugs_health
  question: Which of the following is considered part of the 'passenger area' where
    open containers of alcohol are illegal?
  choices:
    A: Only the driver's seat.
    B: The trunk of the vehicle.
    C: Any place the driver or passengers can easily reach from where they are sitting.
    D: Only the back seats of the vehicle.
  answer: C
  explanation: The passenger area of a vehicle includes the driver and passenger seats,
    and any place the driver or passengers can easily reach from where they are sitting.
- id: 108
  category: penalties_and_points
  question: What can happen if you are convicted of a drunk or drugged driving offense
    with a child in your vehicle?
  choices:
    A: The judge can double your fine and jail time.
    B: Your vehicle will be permanently confiscated.
    C: You will be banned from driving for life.
    D: You will receive a standard traffic ticket.
  answer: A
  explanation: If you are convicted of a drunk or drugged driving offense with a child
    in your vehicle, the judge can double your fine and jail time.
- id: 109
  category: defensive_driving
  question: Which of the following is an example of aggressive driving?
  choices:
    A: Yielding the right-of-way to pedestrians.
    B: Using turn signals before changing lanes.
    C: Making unsafe lane changes and tailgating.
    D: Driving in the right lane when traveling slower than traffic.
  answer: C
  explanation: 'Examples of aggressive driving include: speeding, tailgating, ignoring
    traffic signals and devices, making unsafe lane changes, not yielding the right-of-way,
    and unsafe or illegal passing.'
- id: 110
  category: safe_driving_rules
  question: What is the cell phone usage rule for drivers who are under 18 years old?
  choices:
    A: They may use a cell phone hands-free at any time.
    B: They may text while stopped at a red light.
    C: They may not use a cell phone while driving, except to make a 911 emergency
      call.
    D: They may use a hand-held cell phone if they have a parent in the car.
  answer: C
  explanation: If you are under 18 years old, you may not use a cell phone while driving,
    even hands-free. The only exception is that you may use it to make a 911 emergency
    call.
- id: 111
  category: safe_driving_rules
  question: Which of the following statements is true regarding cell phone use while
    driving for adults in Maryland?
  choices:
    A: It is legal to text while driving if you are on an interstate.
    B: It is illegal to use a hand-held cell phone, but hands-free use is allowed.
    C: All cell phone use, including hands-free, is completely illegal for all drivers.
    D: You may hold your phone to make a call if you are driving under the speed limit.
  answer: B
  explanation: It is illegal to use a hand-held cell phone, including texting, while
    driving. You can use your phone for calls while driving if you are not holding
    it (hands-free).
- id: 112
  category: alcohol_drugs_health
  question: How does not getting enough sleep affect your ability to drive?
  choices:
    A: It increases your reaction time and improves awareness.
    B: It slows reaction time, decreases awareness, and impairs judgment.
    C: It only affects your vision but not your judgment.
    D: It makes you more likely to drive aggressively but does not impair coordination.
  answer: B
  explanation: Sleepiness slows reaction time, decreases awareness, and impairs judgment,
    just like drugs or alcohol.
- id: 113
  category: defensive_driving
  question: Which of the following is considered a danger sign that you are driving
    while drowsy?
  choices:
    A: Remembering the last few miles clearly
    B: Keeping a consistent speed
    C: Having wandering, disconnected thoughts
    D: Checking your mirrors frequently
  answer: C
  explanation: According to the manual, danger signs for drowsy drivers include having
    wandering, disconnected thoughts, not remembering driving the last few miles,
    and keeping changing your speed.
- id: 114
  category: penalties_and_points
  question: What are the potential consequences of being arrested for impaired driving
    in Maryland?
  choices:
    A: A warning for the first offense
    B: Big fines, possible jail time, and thousands of dollars in court costs
    C: Only a temporary license suspension
    D: Mandatory community service without fines
  answer: B
  explanation: The manual states that being arrested for impaired driving has serious
    consequences including big fines, possible jail time, and thousands of dollars
    in court costs.
- id: 115
  category: defensive_driving
  question: According to the manual, what proportion of fatal crashes are caused by
    distracted driving?
  choices:
    A: One-quarter
    B: One-third
    C: One-half
    D: Two-thirds
  answer: B
  explanation: The manual explicitly states that one-third of fatal crashes are caused
    by distracted driving.
- id: 116
  category: sharing_the_road
  question: If a vehicle ahead of you is stopped at a crosswalk, what must you do?
  choices:
    A: Pass the vehicle on the left
    B: Honk to alert the pedestrians
    C: Pass the vehicle on the right if there is room
    D: Not pass the stopped vehicle
  answer: D
  explanation: 'The manual states as a basic rule for crosswalks: ''You may not pass
    any vehicle that is stopped at a crosswalk.'''
- id: 117
  category: safe_driving_rules
  question: What must you do immediately after seeing or hearing an approaching emergency
    vehicle using its signals?
  choices:
    A: Speed up to get out of its way
    B: Move as close as possible to the edge of the road and stop
    C: Stop immediately in the middle of the intersection
    D: Continue at your current speed but move to the right lane
  answer: B
  explanation: When an emergency vehicle approaches using its signals, you must move
    as close as possible to the edge of the road, stay out of intersections, and remain
    stopped until it has passed.
- id: 118
  category: safe_driving_rules
  question: What should you do if you approach a tow truck stopped on the side of
    the road and cannot safely move to a non-adjacent lane?
  choices:
    A: Maintain your speed and honk your horn
    B: Stop completely until the tow truck leaves
    C: Slow down to a safe speed and prepare to stop if necessary
    D: Accelerate to pass the vehicle quickly
  answer: C
  explanation: If it is not possible to move over to a lane not immediately adjacent
    to a stopped emergency or service vehicle, you must slow down to a safe speed
    and prepare to stop if necessary.
- id: 119
  category: sharing_the_road
  question: Why is it risky to pass a large truck on the right when approaching an
    intersection?
  choices:
    A: The truck may be preparing to make a wide right turn
    B: Trucks are not allowed to turn right at intersections
    C: The truck will accelerate faster than a car
    D: Trucks always turn left from the right lane
  answer: A
  explanation: Trucks make wide turns and will often move left before making a right
    turn. Passing on the right is risky because you could get caught between the turning
    truck and the curb.
- id: 120
  category: vehicle_information
  question: Approximately how much distance does a fully loaded, 80,000-pound truck
    need to come to a complete stop?
  choices:
    A: The length of a standard car
    B: 50 feet
    C: The length of a football field
    D: Half a mile
  answer: C
  explanation: The manual states that fully loaded trucks can weigh more than 80,000
    pounds and take the length of a football field to stop.
- id: 121
  category: sharing_the_road
  question: When passing a large truck, when is it safe to move back into the lane
    in front of the truck?
  choices:
    A: As soon as your rear bumper clears the truck's front bumper
    B: When you can see both of the truck's headlights in your rear-view mirror
    C: When the truck driver flashes their high beams
    D: After you have maintained your passing speed for 10 seconds
  answer: B
  explanation: You should move back into the lane with the truck only when you can
    see both of its headlights in your rear-view mirror, ensuring you do not cut into
    its Front No-Zone.
- id: 122
  category: safe_driving_rules
  question: How far away must you stop from a school bus that has stopped on the road
    with its flashing red lights on?
  choices:
    A: At least 10 feet
    B: At least 15 feet
    C: At least 20 feet
    D: At least 50 feet
  answer: C
  explanation: Drivers must stop at least 20 feet from the front or back of a school
    bus if it has stopped on the road with its flashing red lights on.
- id: 123
  category: safe_driving_rules
  question: When are you NOT required to stop for a school bus with flashing red lights?
  choices:
    A: When you are traveling in the opposite direction on a two-lane road
    B: When you are on a multiple-lane road divided by a physical barrier and the
      bus is on the other side
    C: When you are running late for work
    D: When the bus is stopped at a railroad crossing
  answer: B
  explanation: If you are on a multiple lane road divided by a physical barrier, you
    do not stop if the bus is on the other side of the barrier.
- id: 124
  category: sharing_the_road
  question: In over half of car crashes involving motorcycles, who is at fault?
  choices:
    A: The motorcyclist
    B: The car driver
    C: Both drivers equally
    D: Pedestrians
  answer: B
  explanation: The manual notes that drivers are at fault in over half of car crashes
    with motorcycles, particularly when failing to yield the right-of-way during left
    turns.
- id: 125
  category: safe_driving_rules
  question: What is the recommended minimum following distance you should leave when
    driving behind a motorcycle?
  choices:
    A: 1 to 2 seconds
    B: 3 to 4 seconds
    C: 5 to 6 seconds
    D: 10 seconds
  answer: B
  explanation: You should leave at least a 3 to 4-second following distance between
    your vehicle and the motorcycle in front of you.
- id: 126
  category: sharing_the_road
  question: Why should you never share a lane with a motorcycle?
  choices:
    A: Motorcycles are required to stay on the shoulder
    B: Motorcyclists are allowed to use the whole lane and may move around to avoid
      hazards
    C: It is illegal for cars to drive in the right lane
    D: Motorcycles are too loud and will distract you
  answer: B
  explanation: You should not share a lane with a motorcycle because motorcyclists
    are allowed to use the whole lane and often move around to avoid road hazards,
    wind, or to be seen.
- id: 127
  category: sharing_the_road
  question: How does Maryland law classify bicycles?
  choices:
    A: As pedestrian accessories
    B: As recreational toys
    C: As vehicles that must obey all traffic signals
    D: As motorized scooters
  answer: C
  explanation: According to Maryland law, bicycles are vehicles. Bicyclists are allowed
    to use the road and must obey all traffic signals.
- id: 128
  category: sharing_the_road
  question: Where are bicyclists NOT expected or allowed to ride?
  choices:
    A: Residential streets
    B: Interstate highways and toll bridges
    C: Roads without shoulders
    D: Traffic circles
  answer: B
  explanation: According to the manual, you should expect to find bicyclists on all
    types of roads except interstate highways, and bridges and tunnels with tolls.
- id: 129
  category: sharing_the_road
  question: When passing a bicyclist, what is the minimum distance you must leave
    between your vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: The manual states that you must leave at least 3 feet between your
    vehicle and the bicycle when passing.
- id: 130
  category: safe_driving_rules
  question: When a bicyclist is riding in a crosswalk, what right-of-way rules apply?
  choices:
    A: They must yield to all motor vehicles.
    B: They have the same right-of-way as pedestrians.
    C: They only have right-of-way if they dismount their bicycle.
    D: They are not allowed to use crosswalks.
  answer: B
  explanation: The manual specifies that bicycles have the same right of way as pedestrians
    in a crosswalk.
- id: 131
  category: defensive_driving
  question: Why might a bicyclist legally ride in the center of the travel lane instead
    of on the right edge?
  choices:
    A: To intentionally slow down traffic behind them.
    B: Because the road is narrow or to avoid obstacles.
    C: Only when preparing to make a U-turn.
    D: Bicyclists are never allowed to ride in the center of the travel lane.
  answer: B
  explanation: Bicyclists may ride out in the travel lane for their own safety because
    the road is narrow, to avoid obstacles or pavement hazards, or when cars are parked
    along the right side.
- id: 132
  category: sharing_the_road
  question: What should you do when approaching a bicyclist from behind?
  choices:
    A: Honk your horn to let them know you are there.
    B: Speed up to pass them as quickly as possible.
    C: Slow down and do not honk your horn.
    D: Flash your high beams repeatedly.
  answer: C
  explanation: As you approach a bicyclist, you should slow down and do not honk your
    horn, as loud noises can startle them and cause a crash.
- id: 133
  category: sharing_the_road
  question: On what types of roads are mopeds and motor scooters allowed to be ridden?
  choices:
    A: Only on roads with a speed limit of 35 mph or less.
    B: Any road with a posted maximum speed limit of 50 mph or less.
    C: All interstate highways.
    D: Only on roads with designated bike lanes.
  answer: B
  explanation: Mopeds and scooters may be ridden on any road with a posted maximum
    speed limit of 50 miles per hour or less.
- id: 134
  category: vehicle_information
  question: What is a known limitation of Advanced Driver Assistance Systems (ADAS)?
  choices:
    A: They only work during daylight hours.
    B: They may not work properly in rain, snow, fog, on hills, and around curves.
    C: They completely replace the need for the driver to check mirrors.
    D: They are guaranteed to prevent 100% of crashes.
  answer: B
  explanation: The manual warns that ADAS technology has limitations and may not work
    properly in rain, snow, fog, on hills, and around curves.
- id: 135
  category: driver_responsibility
  question: If you are involved in a crash where someone has been injured, what must
    you do with the vehicles?
  choices:
    A: Move them to the shoulder immediately.
    B: Drive them to the nearest police station.
    C: Do not move the vehicles.
    D: Move them only if they are blocking a driveway.
  answer: C
  explanation: If you are involved in a crash where someone has been injured, you
    must remain at the scene, call 911, and do not move the vehicles.
- id: 136
  category: penalties_and_points
  question: What is the penalty for leaving the scene of a crash where someone dies?
  choices:
    A: A misdemeanor and a $500 fine.
    B: A felony, up to 10 years in prison, and up to a $10,000 fine.
    C: Up to 5 years in prison and a $5,000 fine.
    D: A warning and 3 points on your license.
  answer: B
  explanation: Leaving the scene of a crash where someone dies is a felony. You could
    go to prison for up to 10 years and be fined up to $10,000.
- id: 137
  category: driver_responsibility
  question: If you are in a crash where there are no injuries and your vehicle CAN
    move, what is your first responsibility?
  choices:
    A: Leave the vehicle exactly where it is until police arrive.
    B: Move your vehicle off the road as close as possible to where the crash occurred.
    C: Stop traffic to take pictures of the vehicles in the roadway.
    D: Drive home and report the crash the next day.
  answer: B
  explanation: If there are no injuries and your vehicle can move, you should move
    your vehicle off the road as close as possible to where the crash occurred to
    keep everyone safe and prevent backups.
- id: 138
  category: driver_responsibility
  question: In which of the following situations must you ALWAYS call the police after
    a crash?
  choices:
    A: Only when the damage exceeds $1,000.
    B: When a driver appears to be under the influence of alcohol or drugs.
    C: Only if the crash happens on an interstate highway.
    D: Whenever you hit an animal.
  answer: B
  explanation: You must always call the police when someone has been injured, a vehicle
    cannot be moved, or a driver appears to be under the influence of alcohol or drugs.
- id: 139
  category: safe_driving_rules
  question: When preparing to make a right turn, what should you do regarding bicyclists?
  choices:
    A: Make the turn from the through lane immediately after passing the bike.
    B: Honk to force the bicyclist onto the sidewalk before turning.
    C: Move as far to the right as possible within the bike lane, shoulder, or right
      turn lane.
    D: Always turn left instead to avoid the bicyclist.
  answer: C
  explanation: Before starting a right turn, you should move as far to the right as
    possible within the bike lane, shoulder, or right turn lane.
- id: 140
  category: defensive_driving
  question: What should you do if you see a dim reflective object on the road at night?
  choices:
    A: Turn on your high beams to blind the bicyclist.
    B: Assume it is off the road and maintain your speed.
    C: Do not assume it is off the road, and use your low beam headlights when approaching.
    D: Honk your horn continuously until you pass it.
  answer: C
  explanation: If you see a dim reflective object at night, do not assume it is off
    the road; it could be a bicycle. When approaching a bicycle, use your low beam
    headlights.
- id: 141
  category: sharing_the_road
  question: When a bicyclist is riding on a sidewalk, what rule must they follow?
  choices:
    A: They must ride at least 15 mph.
    B: They have the right-of-way over all pedestrians.
    C: They must give pedestrians and those in assisted mobility devices the right-of-way.
    D: They must ride in the opposite direction of traffic.
  answer: C
  explanation: When riding a bicycle on a sidewalk, bicyclists must remember to give
    pedestrians and those in assisted mobility devices the right-of-way.
- id: 142
  category: vehicle_information
  question: According to the manual, what percentage of crashes do Advanced Driver
    Assistance Systems (ADAS) prevent when used properly?
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 75%
  answer: C
  explanation: The manual states that when used properly, ADAS technologies prevent
    40% of crashes.
- id: 143
  category: driver_responsibility
  question: If you strike an unattended vehicle and cannot find the owner, what are
    you required to do?
  choices:
    A: Wait by the vehicle until the owner returns
    B: Call a tow truck to move the vehicle
    C: Leave a note with your contact information where it can be easily found
    D: Report the incident to your insurance company within 24 hours and leave the
      scene
  answer: C
  explanation: If you cannot find the owner of unattended property you struck, you
    must leave them a note about what happened with your contact information where
    they can easily find it.
- id: 144
  category: safe_driving_rules
  question: What must you do immediately if you hit and injure a domestic animal,
    such as a dog or cow, with your vehicle?
  choices:
    A: Call the police
    B: Move the animal to the side of the road
    C: Locate the animal's owner
    D: Take the animal to the nearest veterinarian
  answer: A
  explanation: The manual states that if you hit and injure a domestic animal with
    your vehicle, you must immediately call the police.
- id: 145
  category: defensive_driving
  question: During a roadside emergency, where should you NEVER stop or park your
    vehicle?
  choices:
    A: On the shoulder of the road
    B: In a nearby parking lot
    C: On an off-ramp
    D: In the triangular shaped painted zones where a ramp exits the road
  answer: D
  explanation: The manual explicitly states, "Never stop or park in the triangular
    shaped painted zones where a ramp exits the road."
- id: 146
  category: defensive_driving
  question: If it is not safe to remain in your vehicle during a roadside emergency,
    how should you position yourself outside?
  choices:
    A: Stand directly behind your vehicle to warn others
    B: Move behind a traffic barrier or guard-rail and face oncoming traffic
    C: Stand in the nearest lane of traffic to wave for help
    D: Sit on the shoulder of the road facing away from traffic
  answer: B
  explanation: If you cannot remain in your vehicle, you should move quickly away
    from the road, get behind an embankment or guard-rail, and face oncoming traffic.
- id: 147
  category: safe_driving_rules
  question: What is the best place to keep your hands when you are stopped by a law
    enforcement officer?
  choices:
    A: In your pockets
    B: Reaching for your glove compartment
    C: In plain view on the steering wheel
    D: Outside the driver's side window
  answer: C
  explanation: During a traffic stop, you should keep your hands in plain view, and
    the manual notes that "on the steering wheel is best."
- id: 148
  category: safe_driving_rules
  question: According to Maryland's Move Over Law, what must you do if it is not safe
    or possible to move over for a stopped vehicle with flashing lights?
  choices:
    A: Stop your vehicle completely until the flashing lights are turned off
    B: Honk your horn to alert the stopped vehicle
    C: Maintain your speed but move to the edge of your lane
    D: Slow down to a safe speed
  answer: D
  explanation: If it is not safe or possible to move over for a vehicle with flashing
    lights, the Move Over Law requires you to slow down to a safe speed.
- id: 149
  category: penalties_and_points
  question: What is the penalty for violating the Move Over Law if the violation causes
    a crash?
  choices:
    A: A $110 fine and one point on your license
    B: A $150 fine and three points on your license
    C: A $750 fine and three points on your license
    D: A $500 fine and license suspension
  answer: B
  explanation: Violating the Move Over Law is a misdemeanor that carries a $150 fine
    and three points if the violation causes a crash.
- id: 150
  category: sharing_the_road
  question: In crashes involving a car and a motorcycle, who is at fault more than
    half of the time?
  choices:
    A: The motorcyclist
    B: The car driver
    C: Both drivers equally
    D: Neither driver
  answer: B
  explanation: The manual states that when there is a crash involving a car and a
    motorcycle, the car driver is at fault more than half of the time.
- id: 151
  category: license_system
  question: For the first 151 days of holding a Provisional License (under age 18),
    who are you allowed to drive with unsupervised?
  choices:
    A: Any passengers under the age of 18
    B: Only immediate family members
    C: Up to three friends
    D: No passengers are allowed under any circumstances
  answer: B
  explanation: If you have a Provisional License and are under 18, you may not drive
    unsupervised with passengers under 18 for the first 151 days unless they are immediate
    family members.
- id: 152
  category: license_system
  question: Under which condition is a Provisional License holder allowed to drive
    unsupervised between 12:00 midnight and 5:00 a.m.?
  choices:
    A: When driving to or from an official school activity
    B: When driving home from a friend's house
    C: When running errands for a parent
    D: When practicing driving skills on empty roads
  answer: A
  explanation: Provisional License holders may drive unsupervised between midnight
    and 5:00 a.m. ONLY if driving to/from a job, volunteer program, official school
    activity, or athletic event/training.
- id: 153
  category: safe_driving_rules
  question: What is the wireless device restriction for drivers holding a Learner's
    Permit or Provisional License?
  choices:
    A: They may only use hands-free devices while driving
    B: They may use wireless devices only when stopped at a red light
    C: They may not use any wireless communication device while driving, except for
      a 911 emergency call
    D: They may use wireless devices for GPS navigation only
  answer: C
  explanation: Provisional License or Learner's Permit holders may not use any wireless
    communication device (including hands-free) while driving, with the only exception
    being a 911 emergency call.
- id: 154
  category: alcohol_drugs_health
  question: What does Maryland's Implied Consent law require you to do?
  choices:
    A: Consent to a vehicle search at any traffic stop
    B: Agree to take a drug or alcohol test if asked by a law enforcement officer
    C: Consent to having your vehicle towed if you are arrested
    D: Agree to answer all questions without a lawyer present
  answer: B
  explanation: In Maryland, driving on a public road means you consent to take a drug
    or alcohol test if a law enforcement officer asks you to.
- id: 155
  category: alcohol_drugs_health
  question: At what blood alcohol concentration (BAC) will your driver's license be
    suspended in Maryland?
  choices:
    A: 0.04 percent or higher
    B: 0.06 percent or higher
    C: 0.08 percent or higher
    D: 0.10 percent or higher
  answer: C
  explanation: Your license will be suspended if your blood alcohol concentration
    is .08 percent or higher.
- id: 156
  category: penalties_and_points
  question: If your driver's license is suspended or revoked, when does the suspension
    or revocation period officially begin?
  choices:
    A: On the date the citation was issued
    B: On the date of your court hearing
    C: When you receive the notice in the mail
    D: When the MVA receives your license
  answer: D
  explanation: The manual states that if your license is suspended, revoked, refused,
    or cancelled, you must give your license to the MVA, and the suspension or revocation
    periods begin when the MVA receives your license.
- id: 157
  category: penalties_and_points
  question: What is the penalty for a FIRST moving violation offense for a driver
    under 18 with a Provisional License?
  choices:
    A: A 30-day suspension of the driver's license
    B: Completion of a driver improvement program
    C: Immediate license revocation
    D: A 180-day suspension of the driver's license
  answer: B
  explanation: According to the manual, if you are under 18 with a Provisional License,
    the FIRST offense for a moving violation requires you to complete a driver improvement
    program.
- id: 158
  category: penalties_and_points
  question: If you are under 18 with a Provisional License, what happens if you commit
    a FOURTH or more moving violation offense?
  choices:
    A: Your license is suspended for 180 days
    B: Your license is suspended for 30 days
    C: Your license is revoked and you must pass all licensing tests to get it back
    D: Your driving privileges are permanently cancelled
  answer: C
  explanation: The manual states that for minors with a Provisional License, a FOURTH
    or MORE offenses will result in your license being revoked, and you must pass
    all licensing tests to get it back.
- id: 159
  category: license_system
  question: Which of the following is a reason the MVA may cancel your driver's license?
  choices:
    A: You committed fraud when you applied for or obtained your license
    B: You received a parking ticket in a commercial zone
    C: You drove 5 mph over the posted speed limit
    D: You failed to renew your vehicle's registration on time
  answer: A
  explanation: Cancellation of a driver's license means your driving privilege is
    terminated. The MVA may cancel it if they determine you committed fraud when you
    applied for or obtained your license.
- id: 160
  category: penalties_and_points
  question: For an adult (18 years of age or older) holding a Provisional License,
    what is the penalty for a SECOND moving violation conviction?
  choices:
    A: A 180-day suspension of the license
    B: Revocation of the license
    C: A 30-day suspension of the license
    D: A mandatory warning letter from the MVA
  answer: C
  explanation: For adults 18 or older with a Provisional License, a SECOND offense
    will result in a 30-day suspension of your license.
- id: 161
  category: driver_responsibility
  question: Is it legal to park on an access aisle next to a disability parking space
    if you have a valid disability placard?
  choices:
    A: Yes, if the disabled person is present in the vehicle
    B: Yes, but only for a maximum of 15 minutes
    C: No, it is a violation even if you have a disability license plate or placard
    D: Yes, if there are no other disability parking spaces available
  answer: C
  explanation: Citations may be issued for parking on any part of an access aisle
    next to a disability parking space, even if you have a disability license plate
    or placard.
- id: 162
  category: alcohol_drugs_health
  question: What device will you have to install in your vehicle if you are caught
    drinking and driving?
  choices:
    A: A GPS tracking device
    B: A speed limiter
    C: A breathalyzer car lock
    D: An electronic logbook
  answer: C
  explanation: If you are caught drinking and driving, you will have to install a
    breathalyzer car lock that will prevent you from starting the vehicle if alcohol
    is detected.
- id: 163
  category: alcohol_drugs_health
  question: Which of the following medical conditions must be reported to the MVA
    when applying for or renewing a driver's license?
  choices:
    A: A broken arm that healed 5 years ago
    B: High blood pressure
    C: A heart condition that has caused a loss of consciousness in the past 6 months
    D: Seasonal allergies
  answer: C
  explanation: You must notify the MVA if you have a heart condition that has caused
    a loss of consciousness in the past 6 months, as it could affect your ability
    to drive.
- id: 164
  category: license_system
  question: What are the requirements for a supervising driver when you hold a Maryland
    Learner's Permit?
  choices:
    A: At least 18 years old and licensed for 1 year
    B: At least 21 years old and currently licensed for at least three years to drive
      the same class of vehicle
    C: At least 25 years old and licensed for 5 years
    D: Any licensed driver regardless of age or experience
  answer: B
  explanation: A supervising driver must be at least 21 years old, currently licensed
    for at least three years in Maryland or another state to drive the same class
    of vehicles, and seated beside you.
- id: 165
  category: driver_responsibility
  question: Can a 16-year-old minor become an organ donor in Maryland?
  choices:
    A: No, you must be 18 or older to be an organ donor
    B: Yes, but only for certain specific organs
    C: Yes, if a parent or guardian consents in writing
    D: Yes, without any restrictions or consent required
  answer: C
  explanation: Minors at least 16 years old may be organ donors if a parent or guardian
    consents (agrees) in writing.
- id: 166
  category: driver_responsibility
  question: Which of the following is true regarding your vehicle's insurance identification
    card?
  choices:
    A: It must be a physical paper card; electronic formats are not accepted
    B: You only need to show it to law enforcement if you are involved in a crash
    C: You must always have it with you when driving, and it may be in electronic
      format
    D: It is optional to carry it as long as the vehicle is properly registered
  answer: C
  explanation: You must always have a valid insurance identification card with you
    when driving a motor vehicle, and this card may be in electronic format.
- id: 167
  category: safe_driving_rules
  question: According to Maryland seat belt law, who is required to wear a safety
    belt or be buckled in a child safety seat?
  choices:
    A: Only the driver and front-seat passengers
    B: Only passengers under the age of 18
    C: The driver and all passengers of a motor vehicle
    D: Only the driver
  answer: C
  explanation: By law, the driver and all passengers of a motor vehicle must wear
    a safety belt or be buckled in a child safety seat.
- id: 168
  category: safe_driving_rules
  question: At what age and height is a child no longer required by law to ride in
    a child safety seat?
  choices:
    A: Age 6 or 4'5" tall
    B: Age 8 or 4'9" tall
    C: Age 10 or 5'0" tall
    D: Age 5 or 40 pounds
  answer: B
  explanation: All children under age 8 must ride in a child safety seat, unless the
    child is 4'9" or taller.
- id: 169
  category: safe_driving_rules
  question: How long must a child ride in a rear-facing child safety seat?
  choices:
    A: Until they are 1 year old
    B: Until they are younger than 2 and reach the height or weight specified by the
      manufacturer
    C: Until they are 3 years old
    D: Until they weigh 20 pounds
  answer: B
  explanation: Children younger than 2 must ride in a rear-facing child safety seat
    that meets federal guidelines until they reach the height or weight specified
    by the manufacturer.
- id: 170
  category: vehicle_information
  question: For the best protection from air bags, how far back should you try to
    sit from the steering wheel?
  choices:
    A: 5 to 7 inches
    B: 10 to 12 inches
    C: 15 to 18 inches
    D: 20 to 24 inches
  answer: B
  explanation: For the best protection in crashes, you should try to keep 10-12 inches
    between the steering wheel and your chest.
- id: 171
  category: license_system
  question: What is the difference between a license suspension and a license revocation?
  choices:
    A: A suspension is permanent, while a revocation is temporary
    B: A revocation means your driving privilege is terminated and not reinstated
    C: A revocation is more severe than a suspension and requires a minimum waiting
      period before requesting reinstatement
    D: A suspension requires you to retake all licensing tests, while a revocation
      does not
  answer: C
  explanation: The revocation of a Maryland driver's license is more severe than a
    suspension. If revoked, there is a minimum waiting period before you can request
    that the MVA reinstate it.
- id: 172
  category: safe_driving_rules
  question: Children under what age should ride buckled up in a rear seat in a child
    safety seat or with a seat belt?
  choices:
    A: Age 8
    B: Age 10
    C: Age 12
    D: Age 13
  answer: D
  explanation: The manual states that children under age 13 should ride buckled up
    in a rear seat in a child safety seat or with a seat belt.
- id: 173
  category: vehicle_information
  question: What should you expect to happen when your Anti-Lock Braking System (ABS)
    engages?
  choices:
    A: The steering wheel will lock in place.
    B: The brake pedal will vibrate under your foot.
    C: The vehicle will immediately come to a complete stop.
    D: The brake pedal will drop to the floor.
  answer: B
  explanation: When the ABS engages, you may hear a rumble from the brakes and the
    brake pedal will vibrate under your foot as it pumps the brakes to prevent locking.
- id: 174
  category: safe_driving_rules
  question: What is the Maryland law regarding the use of headsets, earphones, and
    earplugs while driving?
  choices:
    A: You may not drive with them in both ears.
    B: You may use them if you are listening to a GPS device.
    C: They are permitted only on highways.
    D: You may use them as long as the volume is low.
  answer: A
  explanation: You may not drive with earplugs, headsets, or earphones in both ears.
    Hearing aid devices are allowed.
- id: 175
  category: driver_testing
  question: Which parking maneuver is no longer required when you take your Maryland
    driving test?
  choices:
    A: Pull-in parking
    B: Back-in parking
    C: Parallel parking
    D: Reverse two-point turn
  answer: C
  explanation: Parallel parking is no longer required when you take your driving test,
    though the same skills are covered in a reverse two-point turn.
- id: 176
  category: driver_testing
  question: During the driving test, the pull-in and back-in parking maneuvers are
    performed in a space of what size?
  choices:
    A: 8' by 15'
    B: 10' by 20'
    C: 12' by 24'
    D: 16' by 20'
  answer: B
  explanation: The parking is done in a 10' by 20' space during the test, and the
    three-point turn is done in a 16' by 20' space.
- id: 177
  category: sharing_the_road
  question: 'When riding a bicycle on the road, bicyclists must:'
  choices:
    A: Ride facing oncoming traffic.
    B: Ride on the sidewalk whenever possible.
    C: Always ride on the right side with traffic.
    D: Weave between lanes to avoid slow vehicles.
  answer: C
  explanation: Bicyclists must ride with traffic, meaning they should always ride
    on the right side.
- id: 178
  category: penalties_and_points
  question: What is the maximum fine per vehicle each year for driving without vehicle
    insurance?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: D
  explanation: If you do not keep insurance on all vehicles, you will be fined up
    to $2,500 per vehicle each year.
- id: 179
  category: sharing_the_road
  question: 'By law, bicycle helmets are required for anyone riding on a bike who
    is under the age of:'
  choices:
    A: '12'
    B: '14'
    C: '16'
    D: '18'
  answer: C
  explanation: Helmets are required for anyone under age 16 riding on a bike, including
    passengers that are not steering.
- id: 180
  category: vehicle_information
  question: By law, all bicycles must have brakes that can stop the bicycle within
    15 feet when traveling at what speed on dry, level, clean pavement?
  choices:
    A: 10 miles per hour
    B: 15 miles per hour
    C: 20 miles per hour
    D: 25 miles per hour
  answer: A
  explanation: Bicycles must have brakes that can stop the bicycle within 15 feet
    when it is going 10 miles per hour on dry, level, clean pavement.
- id: 181
  category: sharing_the_road
  question: When riding a bicycle at night, Maryland law requires a red rear reflector
    that can be seen from at least how far away?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: D
  explanation: Maryland State Law requires a white headlight on the front and a red
    reflector on the back that must be visible from at least 600 feet away.
- id: 182
  category: vehicle_information
  question: A Class 1 electric bicycle has a motor that provides assistance only when
    the rider is pedaling and stops providing assistance when the bicycle reaches
    what speed?
  choices:
    A: 15 miles per hour
    B: 20 miles per hour
    C: 25 miles per hour
    D: 28 miles per hour
  answer: B
  explanation: Class 1 electric bicycles have a motor that provides assistance only
    when the rider is pedaling, and stops providing assistance when the bicycle reaches
    a speed of 20 miles per hour.
- id: 183
  category: vehicle_information
  question: Which of the following is a characteristic of an Electric Low-Speed Vehicle?
  choices:
    A: It is designed to transport up to two people.
    B: It weighs more than 150 pounds.
    C: It has a platform the rider stands on.
    D: It can operate at speeds up to 35 miles per hour.
  answer: C
  explanation: Electric Low-Speed Vehicles have handlebars and a platform the rider
    stands on. They are designed to transport only the operator, weigh less than 100
    pounds, and operate at speeds up to 20 mph.
- id: 184
  category: safe_driving_rules
  question: How should a pregnant woman position the lap part of her seat belt?
  choices:
    A: Over the rounding of the belly.
    B: Under the abdomen as low as possible on the hips and across the upper thighs.
    C: Loosely across the middle of the stomach.
    D: Pregnant women are exempt from wearing the lap portion of the belt.
  answer: B
  explanation: Pregnant women should place the lap part of the seat belt under the
    abdomen as low as possible on the hips and across the upper thighs.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 185
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 186
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 187
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 188
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 189
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 190
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 191
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 192
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 193
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 194
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 195
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 196
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 197
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 198
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 199
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 200
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 201
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 202
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 203
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 204
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 205
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 206
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 207
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 208
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 209
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 210
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 211
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 212
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 213
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 214
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 215
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 216
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 217
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 218
