    D: Second degree felony
  answer: D
  explanation: Intoxication manslaughter is a second degree felony punishable by a
    fine not to exceed $10,000 and imprisonment for 2 to 20 years.
- id: 281
  category: alcohol_drugs_health
  question: In addition to having a BAC of 0.08 or more, how else is the legal limit
    of intoxication defined in Texas?
  choices:
    A: Having any detectable amount of alcohol in the system
    B: Any amount which results in the loss of normal use of mental or physical faculties
    C: Refusing to take a breathalyzer test
    D: Driving with an open container in the vehicle
  answer: B
  explanation: The legal limit in Texas is 0.08 BAC or any amount which results in
    the loss of normal use of mental or physical faculties.
- id: 282
  category: penalties_and_points
  question: What is the penalty if a minor refuses to provide a breath or blood specimen
    for a second or subsequent time?
  choices:
    A: Driver license suspended for 180 days
    B: Driver license suspended for 1 year
    C: Driver license suspended for 2 years
    D: Driver license permanently revoked
  answer: C
  explanation: For a minor's 2nd and subsequent offenses of refusing to provide a
    specimen, their driver license will be suspended for 2 years.
- id: 283
  category: penalties_and_points
  question: How many hours of community service are required for a minor's first offense
    of Driving Under the Influence (DUI) of Alcohol and Drugs?
  choices:
    A: 8 to 12 hours
    B: 20 to 40 hours
    C: 40 to 60 hours
    D: 80 to 100 hours
  answer: B
  explanation: A minor's 1st DUI offense is a Class C misdemeanor that requires community
    service of 20 to 40 hours.
- id: 284
  category: alcohol_drugs_health
  question: According to the manual, which of the following combinations represents
    approximately the same amount of alcohol?
  choices:
    A: A 16 ounce can of beer, a mixed drink with 2 ounces of liquor, or an 8 ounce
      glass of wine
    B: A 12 ounce can of beer, a mixed drink with 1.5 ounces of liquor, or a 5 ounce
      glass of wine
    C: An 8 ounce can of beer, a mixed drink with 1 ounce of liquor, or a 4 ounce
      glass of wine
    D: A 12 ounce can of beer, a mixed drink with 2 ounces of liquor, or a 6 ounce
      glass of wine
  answer: B
  explanation: The manual states that a drink may include a 12 ounce can of beer,
    a mixed drink with 1.5 ounces of liquor, or a 5 ounce glass of wine, and they
    all contain approximately the same amount of alcohol.
- id: 285
  category: driver_responsibility
  question: If you are involved in a crash that is not investigated by a law enforcement
    officer and results in property damage of $1,000 or more, what is the deadline
    to file a written report with TxDOT?
  choices:
    A: No later than the 5th day after the date of the crash
    B: No later than the 10th day after the date of the crash
    C: No later than the 15th day after the date of the crash
    D: No later than the 30th day after the date of the crash
  answer: B
  explanation: If a crash is not investigated by law enforcement and results in damage
    of $1,000 or more, you must make a written report and file it with TxDOT no later
    than the 10th day after the date of the crash.
- id: 286
  category: driver_responsibility
  question: In which of the following situations should you always notify the appropriate
    law enforcement agency as soon as possible after a crash?
  choices:
    A: When the damage to either vehicle appears to be less than $500
    B: When you suspect a driver involved is intoxicated
    C: When the crash occurs in a residential neighborhood
    D: When both vehicles can be safely driven away from the scene
  answer: B
  explanation: 'The manual lists four specific situations where you should always
    notify law enforcement: injury or fatality, vehicles cannot be moved, a driver
    leaves the scene, or you suspect a driver is intoxicated.'
- id: 287
  category: safe_driving_rules
  question: What must you do if you are in a crash resulting ONLY in damage to a vehicle,
    and the vehicles can be normally and safely driven?
  choices:
    A: Leave the vehicles exactly where they are until police arrive to take pictures
    B: Move the vehicles as soon as possible to a designated crash investigation site
      or other suitable location
    C: Drive home immediately and call your insurance company
    D: Push the vehicles into the center median and wait for a tow truck
  answer: B
  explanation: If a crash results only in damage to a vehicle and each vehicle can
    be normally and safely driven, drivers must move their vehicle as soon as possible
    to a designated crash investigation site, frontage road, or nearest suitable cross
    street.
- id: 288
  category: driver_responsibility
  question: What is required if you collide with and damage an unattended vehicle
    and cannot locate the operator or owner?
  choices:
    A: Leave the scene if the damage appears to be less than $200
    B: Wait by the vehicle for up to one hour before leaving
    C: Securely attach a written notice in a visible way providing your name, address,
      and a statement of the circumstances
    D: Call a tow truck to have the unattended vehicle removed from the roadway
  answer: C
  explanation: If you damage an unattended vehicle and cannot locate the owner, you
    must securely attach a written notice in a visible way providing your name, address,
    and a statement of the circumstances of the collision.
- id: 289
  category: penalties_and_points
  question: What is the penalty for a first offense of failing to stop at the scene
    of a crash resulting in the death of a person?
  choices:
    A: Class A misdemeanor punishable by up to 1 year in jail
    B: First degree felony punishable by life in prison
    C: Second degree felony punishable by a fine up to $10,000 and 2 to 20 years imprisonment
    D: Third degree felony punishable by a fine up to $10,000 and 2 to 10 years imprisonment
  answer: C
  explanation: A 1st offense crash resulting in a death of a person where the driver
    fails to stop is a Second degree felony punishable by a fine not to exceed $10,000
    and imprisonment in the TDCJ for 2 to 20 years.
- id: 290
  category: penalties_and_points
  question: What is the penalty for failing to stop at a crash resulting in less than
    $200 in damages to a vehicle (1st offense)?
  choices:
    A: Class C misdemeanor punishable by a fine not to exceed $500
    B: Class B misdemeanor punishable by a fine not to exceed $2,000
    C: Class A misdemeanor punishable by up to 1 year in jail
    D: State jail felony punishable by up to 2 years in jail
  answer: A
  explanation: For a 1st offense failure to stop with less than $200 in damages, the
    penalty is a Class C misdemeanor punishable by a fine not to exceed $500.
- id: 291
  category: driver_responsibility
  question: When aiding an injured person at the scene of a crash, what is the proper
    protocol regarding moving the victim?
  choices:
    A: Move them to the side of the road immediately to prevent further injury from
      traffic
    B: Do not move or lift the victim unless it is absolutely necessary
    C: Have the victim stand up and walk around to check for broken bones
    D: Place the victim in your vehicle to keep them warm until the ambulance arrives
  answer: B
  explanation: 'The manual advises: ''Do not move or lift the victim(s) unless it
    is absolutely necessary. If a victim must be moved, get help and try not to change
    the position in which the victim was found.'''
- id: 292
  category: sharing_the_road
  question: According to pedestrian safety rules, where should you walk if there are
    no sidewalks available?
  choices:
    A: On the right side of the road with the flow of traffic
    B: On the left side of the road facing traffic
    C: In the center of the road where you are most visible
    D: On the shoulder of the road walking in a zigzag pattern
  answer: B
  explanation: 'Pedestrian safety rules state: ''Walk on the left side of the road
    if there are no sidewalks. Step off the pavement when a car approaches.'''
- id: 293
  category: sharing_the_road
  question: Who has the right-of-way if a pedestrian crosses a street at any point
    other than within a crosswalk at an intersection?
  choices:
    A: The pedestrian always has the right-of-way
    B: The pedestrian must yield the right-of-way to all vehicles
    C: Vehicles must yield the right-of-way to the pedestrian
    D: The right-of-way goes to whoever arrived at the crossing point first
  answer: B
  explanation: 'The manual states: ''If you cross a street at any point other than
    within a crosswalk at an intersection, you (the pedestrian) must yield the right-of-way
    to all vehicles.'''
- id: 294
  category: safe_driving_rules
  question: According to the Texas Driver Handbook, what are the most common causes
    of crashes in Texas?
  choices:
    A: Poor weather conditions, road construction, and vehicle malfunctions
    B: Speeding, failure to yield or stop appropriately, and driving under the influence
      of alcohol
    C: Distracted driving, inexperienced drivers, and nighttime driving
    D: Tailgating, improper passing, and ignoring traffic signals
  answer: B
  explanation: 'The manual explicitly states: ''Most crashes in Texas result from
    speeding, failure to yield or stop appropriately, and driving under the influence
    of alcohol.'''
- id: 295
  category: driver_responsibility
  question: If you need the address and telephone number of the other driver's insurance
    company after a crash and it is not listed on their card, who should you call?
  choices:
    A: The Texas Department of Transportation
    B: The Texas Department of Public Safety
    C: The Texas Department of Insurance
    D: The local police department's non-emergency line
  answer: C
  explanation: 'The manual instructs: ''If you have the name of the driver''s insurance
    company and the information is not listed directly on the insurance card, call
    the Texas Department of Insurance at (800) 252-3439 to get the company address
    and telephone number.'''
- id: 296
  category: vehicle_information
  question: According to the Texas Department of Insurance, what type of coverage
    will pay for damages in hit-and-run crashes if reported to a law enforcement agency?
  choices:
    A: Comprehensive coverage
    B: Collision coverage
    C: Liability coverage
    D: Uninsured motorist coverage
  answer: D
  explanation: 'The manual states: ''The Texas Department of Insurance advises uninsured
    motorist coverage will pay for damages in hit-and-run crashes reported to a law
    enforcement agency.'''
- id: 297
  category: sharing_the_road
  question: When crossing a street at a crosswalk, what position should a pedestrian
    maintain?
  choices:
    A: Keep to the left side of the crosswalk
    B: Keep to the right side of the crosswalk if possible
    C: Walk exactly in the center of the crosswalk
    D: Walk diagonally across the crosswalk
  answer: B
  explanation: 'The pedestrian safety rules state: ''When crossing at a crosswalk,
    keep right if possible.'''
- id: 298
  category: sharing_the_road
  question: Who is legally permitted to carry a white cane on a public street or highway?
  choices:
    A: Any pedestrian walking at night.
    B: Pedestrians crossing outside of a crosswalk.
    C: Blind, partially blind, or disabled individuals.
    D: Traffic control officers and crossing guards.
  answer: C
  explanation: The manual states that blind, partially blind, or disabled individuals
    may carry a white cane while walking. Others must not display a white cane on
    any public street or highway.
- id: 299
  category: sharing_the_road
  question: How are traffic law violations handled for a person operating a bicycle?
  choices:
    A: They receive a warning instead of a citation.
    B: They are subject to the same penalties as a person operating a motor vehicle.
    C: They are only fined half the amount of a motor vehicle violation.
    D: Bicycle violations are not placed on an individual's driver record.
  answer: B
  explanation: Any person who operates a bicycle is subject to the same penalties
    for violating a traffic law as a person operating a motor vehicle, and convictions
    will be placed on their driver record.
- id: 300
  category: safe_driving_rules
  question: How should a bicyclist signal that they are stopping?
  choices:
    A: By pointing their left arm horizontally.
    B: By pointing their right arm horizontally.
    C: By pointing their left arm upward.
    D: By pointing their left arm downward.
  answer: D
  explanation: Bicyclists must signal a stop by using their left arm pointed downward.
- id: 301
  category: safe_driving_rules
  question: Where should a bicyclist ride when operating on a one-way road with two
    or more marked traffic lanes?
  choices:
    A: In the center of the rightmost lane.
    B: As near as possible to the left curb or edge of the road.
    C: As near as possible to the right curb or edge of the road.
    D: In any lane that is moving faster than traffic.
  answer: B
  explanation: When operating a bicycle on a one-way road with two or more marked
    traffic lanes, the rider must ride as near as possible to the left curb or edge
    of the road.
- id: 302
  category: vehicle_information
  question: What type of front light is required on a bicycle used at nighttime?
  choices:
    A: A yellow light visible from 300 feet.
    B: A white light visible from at least 500 feet.
    C: A flashing red light visible from 200 feet.
    D: A white light visible from at least 1000 feet.
  answer: B
  explanation: Every bicycle used at nighttime must be equipped with a lamp on the
    front that emits a white light visible from a distance of at least 500 feet.
- id: 303
  category: safe_driving_rules
  question: What is the rule regarding bicyclists carrying packages or bundles?
  choices:
    A: They must not carry any packages weighing more than 10 pounds.
    B: They must use a front basket for all packages.
    C: They must not carry anything that prevents keeping at least one hand on the
      handlebars.
    D: They are prohibited from carrying any packages while riding on a public road.
  answer: C
  explanation: A bicyclist must never carry any package, bundle, or article which
    prevents the rider from keeping at least one hand on the handlebars.
- id: 304
  category: defensive_driving
  question: According to defensive driving principles, what does the law require drivers
    to do regarding other drivers' mistakes?
  choices:
    A: Report them immediately to law enforcement.
    B: Honk their horn to alert the other driver.
    C: Protect each other from their own mistakes.
    D: Maintain their right-of-way regardless of the mistake.
  answer: C
  explanation: To avoid crashes, the defensive driver should know that the law requires
    drivers to protect each other from their own mistakes.
- id: 305
  category: safe_driving_rules
  question: Under what conditions is a child under 8 years old exempt from being secured
    in a child car seat?
  choices:
    A: If they are riding in the back seat of a pickup truck.
    B: If they are more than 4'9" tall.
    C: If they are wearing a standard adult safety belt.
    D: If they are accompanied by a parent or guardian.
  answer: B
  explanation: Any child under 8 years old must be secured in a federally approved
    child car seat if occupying a seat in a vehicle equipped with a safety belt, unless
    the child is more than 4’9” tall.
- id: 306
  category: driver_responsibility
  question: How much greater are your chances of being killed in a crash if you are
    thrown from your car?
  choices:
    A: Two times greater.
    B: Three times greater.
    C: Four times greater.
    D: Five times greater.
  answer: D
  explanation: Safety belts help keep you from being thrown from your car. Your chances
    of being killed are five times greater if you are thrown from your car.
- id: 307
  category: penalties_and_points
  question: What is the penalty assessed to a driver if a passenger under 17 years
    old is riding without a safety belt?
  choices:
    A: A fine of $25 to $50.
    B: A fine of $50 to $100.
    C: A fine of $100 to $200.
    D: A fine of $200 to $500.
  answer: C
  explanation: According to the penalties table, passengers under 17 years old riding
    without a safety belt result in a fine assessed to the driver of $100 to $200.
- id: 308
  category: safe_driving_rules
  question: It is generally an offense to allow a child to occupy the bed of an open
    bed truck or trailer if they are younger than what age?
  choices:
    A: 15 years of age.
    B: 16 years of age.
    C: 17 years of age.
    D: 18 years of age.
  answer: D
  explanation: It is an offense to drive an open bed truck, an open flatbed truck,
    or to draw an open flatbed trailer when a child who is younger than 18 years of
    age is occupying the bed of the truck or trailer.
- id: 309
  category: penalties_and_points
  question: Which of the following is a valid defense to prosecution for driving with
    a child younger than 18 in the open bed of a pickup truck?
  choices:
    A: The vehicle is traveling under 25 mph.
    B: The vehicle is being operated on a beach.
    C: The child is accompanied by an adult in the truck bed.
    D: The vehicle is traveling a distance of less than 5 miles.
  answer: B
  explanation: It is a defense to prosecution that the driver was operating or towing
    the vehicle on a beach, in a parade/emergency, transporting farm-workers, in the
    only vehicle owned by the household, or in a permitted hayride.
- id: 310
  category: sharing_the_road
  question: What is one purpose of a shared lane marking on a roadway?
  choices:
    A: To designate a lane exclusively for bicycle use.
    B: To reduce the chance of a bicyclist impacting the open door of a parked vehicle.
    C: To indicate where bicyclists must dismount and walk.
    D: To warn motorists of an upcoming pedestrian crosswalk.
  answer: B
  explanation: The shared lane marking may be used to assist bicyclists with lateral
    positioning in a shared lane with on-street parallel parking in order to reduce
    the chance of a bicyclist impacting the open door of a parked vehicle.
- id: 311
  category: alcohol_drugs_health
  question: What does the manual state regarding pedestrians and alcohol?
  choices:
    A: Pedestrians under the influence must walk on the left side of the road.
    B: Pedestrians may consume alcohol on the road if they wear reflective clothing.
    C: Pedestrians should not walk on a road when under the influence of alcohol.
    D: Pedestrians under the influence have the right-of-way over vehicles.
  answer: C
  explanation: 'The manual states: "Do not walk on a road when you are under the influence
    or consuming an alcoholic beverage. Alcohol is a contributing factor to pedestrian
    traffic crashes."'
- id: 312
  category: safe_driving_rules
  question: Under Texas law, it is an offense to operate a motor vehicle towing a
    boat or personal watercraft if a person riding in or on the boat is younger than
    what age?
  choices:
    A: 15 years of age
    B: 16 years of age
    C: 18 years of age
    D: 21 years of age
  answer: C
  explanation: It is an offense for a person to operate a motor vehicle that is towing
    a boat or personal watercraft in or on which a person who is younger than 18 years
    of age is riding.
- id: 313
  category: safe_driving_rules
  question: Which of the following is a valid defense to prosecution for operating
    a truck while another person occupies a trailer being drawn by the truck?
  choices:
    A: The person in the trailer is over 21 years old.
    B: The vehicle is traveling on an interstate highway.
    C: The trailer is designed for human habitation.
    D: The driver is traveling under 30 mph.
  answer: C
  explanation: It is a defense to prosecution that the person occupying the trailer
    or semi-trailer was in a part of the vehicle designed for human habitation.
- id: 314
  category: safe_driving_rules
  question: What should you do with your vehicle's lights if you are stopped by law
    enforcement at night?
  choices:
    A: Turn off all lights to avoid blinding the officer.
    B: Turn on your high beams.
    C: Turn on the interior dome light.
    D: Flash your headlights repeatedly.
  answer: C
  explanation: If stopped by law enforcement at night, you should turn on the interior
    dome light.
- id: 315
  category: safe_driving_rules
  question: When stopped by a law enforcement officer, where should you keep your
    hands while waiting for instructions?
  choices:
    A: In your lap or pockets.
    B: Clearly in sight on top of the steering wheel.
    C: Outside the driver's side window.
    D: Reaching into the glove box for your license.
  answer: B
  explanation: You should keep both hands clearly in sight on top of the steering
    wheel and wait for the law enforcement officer to give you instructions.
- id: 316
  category: defensive_driving
  question: If an authorized emergency vehicle approaches to stop you, but you feel
    the area is unsafe to stop immediately, what is one step you should take?
  choices:
    A: Speed up to find a safe location faster.
    B: Turn on your hazard lights and drive slowly below the posted speed limit.
    C: Turn off all your lights so the officer knows you are looking for a spot.
    D: Stop abruptly in the middle of the lane.
  answer: B
  explanation: If you feel the area is unsafe to stop immediately, you can turn on
    your hazard lights and drive slowly and carefully below the posted speed limit.
- id: 317
  category: driver_responsibility
  question: Why should drivers and passengers remain in the vehicle during a traffic
    stop unless asked to exit?
  choices:
    A: Exiting the vehicle is a traffic violation that carries a fine.
    B: Exiting the vehicle may be perceived as aggressive behavior and a threat to
      the officer's safety.
    C: It is illegal to stand on the side of a highway.
    D: The officer needs to inspect the exterior of the vehicle first.
  answer: B
  explanation: Drivers and passengers should not exit the vehicle unless asked to
    do so. Exiting your vehicle may be perceived as aggressive behavior and a threat
    to the officer’s safety.
- id: 318
  category: safe_driving_rules
  question: When is the best time to retrieve your driver license and insurance documents
    during a traffic stop?
  choices:
    A: As soon as you see the police lights behind you.
    B: While the officer is walking up to your vehicle.
    C: After informing the officer where they are located and following their directions.
    D: Only after the officer threatens to arrest you.
  answer: C
  explanation: Before reaching into your glove box or under the seat to retrieve your
    proof of insurance or driver’s license, inform the officer of where the items
    are located and follow the officer’s directions.
- id: 319
  category: driver_responsibility
  question: If you are lawfully arrested during a traffic stop, what information are
    you required by law to provide to the officer?
  choices:
    A: Your name, residence address, and date of birth.
    B: Your social security number and employer.
    C: Only your name and phone number.
    D: You are not required to provide any information.
  answer: A
  explanation: If you are lawfully arrested, you are also required to give your name,
    residence address, and date of birth.
- id: 320
  category: driver_responsibility
  question: Under what circumstance can a law enforcement officer search your vehicle
    without your consent?
  choices:
    A: If you are driving a red sports car.
    B: If you refuse to answer their questions.
    C: If the officer has probable cause to believe your vehicle contains evidence
      of a crime.
    D: An officer can never search your vehicle without your consent.
  answer: C
  explanation: If an officer has probable cause to believe that your vehicle contains
    evidence of a crime, it can be searched without your consent.
- id: 321
  category: penalties_and_points
  question: What offense is committed if a person gives a fictitious name to a law
    enforcement officer who has lawfully detained them?
  choices:
    A: Evading arrest
    B: False Identification Offense
    C: Aggressive driving
    D: Class C Misdemeanor
  answer: B
  explanation: A person commits a False Identification Offense if he/she gives a false
    or fictitious name to a law enforcement officer who has lawfully arrested or detained
    the person.
- id: 322
  category: penalties_and_points
  question: Which of the following actions will subject you to higher penalties if
    you are evading arrest or detention?
  choices:
    A: Fleeing on foot through a residential neighborhood.
    B: Using a vehicle or watercraft while evading arrest.
    C: Refusing to answer the officer's questions.
    D: Denying consent to search your vehicle.
  answer: B
  explanation: You will be subject to higher penalties if you use a vehicle or watercraft
    while evading arrest or cause injury to another person.
- id: 323
  category: defensive_driving
  question: To help avoid road rage, how should you use your vehicle's horn if necessary?
  choices:
    A: Hold the horn down for at least five seconds.
    B: Tap the horn.
    C: Sound the horn repeatedly while making eye contact.
    D: Never use the horn under any circumstances.
  answer: B
  explanation: Should you need to use the horn, tap the horn; do not hold down the
    horn.
- id: 324
  category: defensive_driving
  question: Which of the following is an example of aggressive driving behavior that
    should be avoided?
  choices:
    A: Using your turn signal before changing lanes.
    B: Intentionally speeding up to keep someone from passing or entering your lane.
    C: Allowing extra time for your trip in case of traffic.
    D: Following other vehicles at a safe distance.
  answer: B
  explanation: 'Tips to Avoid Road Rage include: Do not intentionally slow down, slam
    on your brakes, or speed up to keep someone from passing or entering your lane
    of travel.'
- id: 325
  category: safe_driving_rules
  question: If you are transporting a handgun in your vehicle, what are you encouraged
    to do regarding your license and insurance documentation?
  choices:
    A: Keep the handgun in the exact same compartment as your documents.
    B: Hand the weapon to the officer along with your documents.
    C: Keep the handgun in a separate location from your license and insurance documentation.
    D: Place the handgun on the passenger seat before the officer approaches.
  answer: C
  explanation: Drivers who transport handguns in their vehicles are encouraged to
    keep them in a separate location from license and insurance documentation.
- id: 326
  category: safe_driving_rules
  question: 'A neighborhood electronic vehicle may only be operated on a street or
    highway if the posted speed limit is:'
  choices:
    A: 30 mph or less
    B: 35 mph or less
    C: 45 mph or less
    D: 55 mph or less
  answer: C
  explanation: Neighborhood electronic vehicles may only be operated on a street or
    highway when the posted speed limit is 45 mph or less.
- id: 327
  category: safe_driving_rules
  question: What is the maximum posted speed limit for a street or highway where a
    motor assisted scooter may be operated?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: C
  explanation: A motor assisted scooter may only be operated on a street or highway
    when the posted speed limit is 35 mph or less.
- id: 328
  category: vehicle_information
  question: How does the Texas Driver Handbook define an Electronic Personal Assistive
    Mobility Device (EPAMD)?
  choices:
    A: A four-wheeled off-road vehicle with a gas motor
    B: A two, non-tandem wheeled device designed for transporting one person that
      is self-balancing
    C: A gas-powered scooter with a motor not exceeding 40 cc
    D: A bicycle with wheels larger than 14 inches in diameter
  answer: B
  explanation: An EPAMD, such as a Segway, is defined as a two, non-tandem wheeled
    device designed for transporting one person that is self-balancing and propelled
    by an electric propulsion system.
- id: 329
  category: sharing_the_road
  question: When operating an Electronic Personal Assistive Mobility Device (EPAMD)
    on a public roadway, where should it be ridden?
  choices:
    A: In the center of the lane
    B: As close as practicable to the left-hand edge
    C: As close as practicable to the right-hand edge
    D: On the shoulder facing oncoming traffic
  answer: C
  explanation: When operated on a public roadway, an EPAMD shall be ridden as close
    as practicable to the right-hand edge.
- id: 330
  category: defensive_driving
  question: According to the 'Keys to Safe Driving', which of the following is true
    regarding courtesy and right-of-way?
  choices:
    A: Right-of-way comes before safety
    B: Safety comes before the right-of-way
    C: You should always insist on taking the right-of-way
    D: Courtesy is only required in residential areas
  answer: B
  explanation: 'Under ''Your Keys to Safe Driving'', the manual states for Courtesy:
    ''Safety comes before the right-of-way''.'
- id: 331
  category: vehicle_information
  question: When transporting loose materials on public highways, the load must be
    completely enclosed and covered. Which of the following materials is exempt from
    this requirement?
  choices:
    A: Dirt and sand
    B: Gravel
    C: Wood chips
    D: Agricultural products in their natural state
  answer: D
  explanation: The manual states that no person shall transport loose material capable
    of blowing or spilling (such as dirt, sand, gravel, wood chips) unless enclosed
    and covered, except for agricultural products in their natural state.
- id: 332
  category: safe_driving_rules
  question: 'When one vehicle is towing another, the drawbar, chain, rope, cable,
    or other connection must not be longer than:'
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: When one vehicle is towing another, the connection must not be longer
    than 15 feet from one vehicle to another.
- id: 333
  category: vehicle_information
  question: What type of flag must be attached to the connection when one vehicle
    is towing another?
  choices:
    A: A red flag not less than 10 inches square
    B: A white flag not less than 12 inches square
    C: A yellow flag not less than 15 inches square
    D: An orange flag not less than 18 inches square
  answer: B
  explanation: When towing, you must attach a white flag not less than 12 inches square
    to the connection.
- id: 334
  category: driver_responsibility
  question: To prevent carbon monoxide poisoning, which of the following should you
    NOT do?
  choices:
    A: Make sure you are getting plenty of fresh air
    B: Leave vents open when following closely behind another car
    C: Move a poisoning victim to fresh air
    D: Call 911 if you encounter a poisoning victim
  answer: B
  explanation: The manual explicitly lists 'Leave vents open when following closely
    behind another car' under the 'Don't' section for preventing carbon monoxide poisoning.
- id: 335
  category: license_system
  question: If you apply for the 'Communication Impediment with a Peace Officer' restriction
    code on your Texas driver license, where will the code be placed?
  choices:
    A: On the front of the license in red text
    B: On the back of your license
    C: On your vehicle's license plate
    D: On your vehicle's registration sticker
  answer: B
  explanation: The code for 'Communication Impediment with a Peace Officer' will go
    on the back of your license, similar to other codes like organ donor or corrective
    lenses.
- id: 336
  category: license_system
  question: According to the glossary, an autocycle can be operated under which type
    of driver license?
  choices:
    A: Class A driver license
    B: Class B driver license
    C: Class C driver license
    D: Class M (Motorcycle) driver license
  answer: C
  explanation: The glossary states that an autocycle can be operated under a Class
    C driver license.
- id: 337
  category: safe_driving_rules
  question: What is the definition of the 'basic speed law'?
  choices:
    A: You must always drive exactly at the posted speed limit
    B: You may not drive faster than is safe and prudent for existing conditions,
      regardless of posted speed limits
    C: You can exceed the speed limit by 5 mph to pass another vehicle
    D: You must drive at least 10 mph below the speed limit in bad weather
  answer: B
  explanation: The basic speed law means you may not drive faster than is safe and
    prudent for existing conditions, regardless of posted speed limits.
- id: 338
  category: vehicle_information
  question: According to the glossary, a bicycle is propelled by human power and has
    two tandem wheels. To be classified as a bicycle, at least one of these wheels
    must be more than what size in diameter?
  choices:
    A: 10 inches
    B: 12 inches
    C: 14 inches
    D: 16 inches
  answer: C
  explanation: A bicycle is defined as having two tandem wheels either of which is
    more than 14 inches in diameter.
- id: 339
  category: vehicle_information
  question: Safety chains are generally required when towing a trailer. Which of the
    following is an exception to this rule?
  choices:
    A: Towing a house trailer for recreational use
    B: Towing a boat trailer to a lake
    C: Towing a trailer or semi-trailer used for agricultural purposes
    D: Towing a broken-down vehicle to a mechanic
  answer: C
  explanation: The requirements for safety chains do not apply to a passenger car
    or light truck towing a trailer or semi-trailer used for agricultural purposes.
- id: 340
  category: safe_driving_rules
  question: When changing lanes, what should you do with your turn signal after the
    lane change is complete?
  choices:
    A: Leave your turn signal on for at least one mile
    B: Turn your turn signal off after you complete your lane change
    C: Only use your turn signal if there is a vehicle directly behind you
    D: Honk your horn before changing lanes instead of using a signal
  answer: B
  explanation: 'The manual states: ''Properly signal your intentions to change lanes
    and change lanes when it is safe to do so. Turn your turn signal off after you
    complete your lane change.'''
- id: 341
  category: safe_driving_rules
  question: What is a blind spot?
  choices:
    A: An area where the driver's vision is blocked by the sun
    B: An area rearview mirrors cannot show
    C: A zone in front of the vehicle where small objects are hidden
    D: A section of the road without streetlights
  answer: B
  explanation: According to the manual, a blind spot is an area rearview mirrors cannot
    show.
- id: 342
  category: alcohol_drugs_health
  question: What does blood-alcohol concentration (BAC) measure?
  choices:
    A: The amount of alcohol in the blood expressed as a percentage of ethyl alcohol
      related to the volume of fluids in the bloodstream
    B: The number of alcoholic drinks consumed in one hour
    C: The legal limit of alcohol allowed for commercial drivers
    D: The rate at which the liver processes alcohol
  answer: A
  explanation: Blood-alcohol concentration (BAC) is defined as the amount of alcohol
    in the blood expressed as a percentage of ethyl alcohol related to the volume
    of fluids in the bloodstream.
- id: 343
  category: vehicle_information
  question: A vehicle is considered a commercial motor vehicle if it is designed to
    transport how many passengers (including the driver)?
  choices:
    A: 8 or more
    B: 10 or more
    C: 12 or more
    D: 16 or more
  answer: D
  explanation: A commercial motor vehicle includes a vehicle that is designed to transport
    16 or more passengers, including the driver.
- id: 344
  category: signs_and_signals
  question: What is a crossbuck?
  choices:
    A: A pedestrian crossing zone in a school area
    B: A large white X-shaped sign located prior to a railroad crossing
    C: An intersection where four roads meet at equal angles
    D: A warning sign for deer crossings
  answer: B
  explanation: A crossbuck is a large white X-shaped sign located prior to a railroad
    crossing.
- id: 345
  category: defensive_driving
  question: What is the definition of defensive driving?
  choices:
    A: Driving below the speed limit at all times to avoid collisions
    B: Protecting yourself and others from dangerous and unexpected driving situations
      by using a space management system
    C: Yielding the right-of-way to all other vehicles at intersections
    D: Swerving to avoid obstacles in the roadway
  answer: B
  explanation: Defensive driving is protecting yourself and others from dangerous
    and unexpected driving situations by using a space management system.
- id: 346
  category: alcohol_drugs_health
  question: 'In Texas, a minor can be charged with Driving Under the Influence (DUI)
    if they are driving with:'
  choices:
    A: A blood-alcohol concentration of 0.08% or higher
    B: Any detectable amount of alcohol in their system
    C: A blood-alcohol concentration above 0.05%
    D: Open containers of alcohol in the vehicle
  answer: B
  explanation: Driving under the influence (DUI) is a Class C misdemeanor for which
    a minor can be charged in Texas if driving with any detectable amount of alcohol
    in the minor’s system.
- id: 347
  category: driver_responsibility
  question: What causes highway hypnosis?
  choices:
    A: Driving under the influence of hallucinogens
    B: Staring at the headlights of oncoming traffic at night
    C: Concentration on the road ahead and the monotony of driving
    D: Lack of sleep before a long road trip
  answer: C
  explanation: Highway hypnosis is a drowsy or trance-like condition caused by concentration
    on the road ahead and monotony of driving.
- id: 348
  category: safe_driving_rules
  question: 'Hydroplaning occurs when:'
  choices:
    A: A vehicle's brakes fail due to excessive moisture
    B: A tire patch loses contact with the road by rising up on top of water
    C: A driver loses visibility during a heavy rainstorm
    D: A vehicle is driven into a flooded intersection
  answer: B
  explanation: Hydroplaning occurs when a tire patch loses contact with the road by
    rising up on top of water.
- id: 349
  category: penalties_and_points
  question: What does the implied-consent law mean for drivers?
  choices:
    A: Drivers automatically consent to vehicle searches at border checkpoints
    B: Drivers automatically consent to be tested for blood-alcohol content and other
      drugs if stopped for suspicion of usage
    C: Drivers agree to pay all fines for traffic violations within 30 days
    D: Drivers consent to organ donation upon receiving their license
  answer: B
  explanation: The implied-consent law means anyone who receives a driver license
    automatically consents to be tested for blood-alcohol content and other drugs
    if stopped for suspicion of alcohol or drug usage while driving.
- id: 350
  category: driver_responsibility
  question: What type of insurance provides compensation for damages which the insured
    is legally obligated to pay and covers others when you are at fault?
  choices:
    A: Collision insurance
    B: Comprehensive insurance
    C: Liability insurance
    D: No-fault insurance
  answer: C
  explanation: Liability insurance provides compensation for damages which the insured
    is legally obligated to pay; covers others when you are at fault.
- id: 351
  category: vehicle_information
  question: 'A moped is a motor-driven cycle that cannot attain a speed in one mile
    of more than:'
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: A moped is a motor-driven cycle that cannot attain a speed in one mile
    of more than 30 mph.
- id: 352
  category: license_system
  question: What is the difference between the cancellation and denial of a driver
    license?
  choices:
    A: Cancellation is temporary, while denial is permanent
    B: Cancellation is the withdrawal of a license until the driver is qualified,
      while denial is withholding a license because the person is ineligible
    C: Cancellation applies to commercial drivers, while denial applies to regular
      drivers
    D: Cancellation is issued by a court, while denial is issued by a police officer
  answer: B
  explanation: Cancellation is the withdrawal of a driver license or privilege until
    the driver is qualified or eligible. Denial is the withholding of a driver license
    or privilege because the person is ineligible for a license.
- id: 353
  category: penalties_and_points
  question: What is an ignition interlock device?
  choices:
    A: A device that prevents a vehicle from being stolen by locking the steering
      wheel
    B: A mechanical control device where a driver must exhale into it to start the
      vehicle
    C: A system that automatically turns off the engine if the vehicle idles for too
      long
    D: A tool used by mechanics to test the emissions of a vehicle
  answer: B
  explanation: An ignition interlock device is a special mechanical control device
    installed on a motor vehicle’s dashboard. A driver must exhale into the device
    to start the vehicle.
- id: 354
  category: safe_driving_rules
  question: Which of the following describes a drag race?
  choices:
    A: Driving a vehicle off-road in a reckless manner
    B: Two or more vehicles accelerating side by side in a competitive attempt to
      outdistance each other
    C: Weaving in and out of traffic on a controlled-access highway
    D: Fleeing from a law enforcement vehicle at high speeds
  answer: B
  explanation: A drag race is the operation of two or more vehicles from a point side
    by side at accelerating speeds in a competitive attempt to outdistance each other,
    or comparing speeds over a selected course.
- id: 355
  category: safe_driving_rules
  question: What does it mean to 'over drive' your headlights?
  choices:
    A: Driving with high beams on in foggy conditions
    B: Driving at a speed making your stopping distance longer than the distance lighted
      by your headlights
    C: Using headlights during daylight hours to increase visibility
    D: Driving with headlights aimed too high, blinding oncoming traffic
  answer: B
  explanation: Over driving headlights means driving at a speed making your stopping
    distance longer than the distance lighted by your headlights.
- id: 356
  category: safe_driving_rules
  question: When parallel parking, how far must your vehicle be from the curb?
  choices:
    A: 6 to 18 inches
    B: 12 to 24 inches
    C: 2 to 10 inches
    D: 18 to 24 inches
  answer: A
  explanation: When parallel parking, the vehicle lines up parallel or going the same
    direction as the curb and must be 6 to 18 inches from the curb.
- id: 357
  category: vehicle_information
  question: Which of the following is an example of a passive restraint device?
  choices:
    A: A manual lap belt
    B: A child safety seat
    C: An airbag
    D: A headrest
  answer: C
  explanation: A passive restraint device, such as an airbag or an automatic safety
    belt, works without the passenger or driver initiating the device.
- id: 358
  category: signs_and_signals
  question: What defines a protected left turn?
  choices:
    A: A left turn made at a stop sign
    B: A left turn made from a shared center lane
    C: A left turn made without a special left turn light
    D: A left turn made on a left-turn green arrow while oncoming traffic is stopped
  answer: D
  explanation: A protected left turn is a left turn made on a left-turn, green arrow,
    or delayed green light while oncoming traffic is stopped.
- id: 359
  category: penalties_and_points
  question: What is the definition of a driver license revocation?
  choices:
    A: The temporary withdrawal of a driver license for a definite period of time
    B: The termination of a driver license or privilege for an indefinite period of
      time
    C: A restriction placed on a license requiring an ignition interlock device
    D: A warning issued before a license is suspended
  answer: B
  explanation: Revocation is the termination of a driver license or privilege for
    an indefinite period of time. It may be restored when all requirements have been
    satisfied.
- id: 360
  category: safe_driving_rules
  question: When making a right turn on red, what must you do before turning?
  choices:
    A: Slow down to 5 mph and proceed if clear
    B: Stop behind the intersection guides
    C: Honk your horn to warn pedestrians
    D: Wait for the pedestrian signal to flash
  answer: B
  explanation: A right turn on red involves turning right when the red signal is on,
    after stopping behind the intersection guides, unless specifically prohibited
    to turn.
- id: 361
  category: signs_and_signals
  question: What is the purpose of rumble strips on the pavement?
  choices:
    A: To provide better traction in rain or snow
    B: To alert drivers of approaching roadway construction, tollbooth plazas, or
      other traffic conditions
    C: To mark the boundary of a school zone
    D: To indicate a shared left-turn lane
  answer: B
  explanation: Rumble strips are sections of rough pavement intended to alert drivers
    of approaching roadway construction, tollbooth plaza, or other traffic conditions.
- id: 362
  category: defensive_driving
  question: What is a staggered stop?
  choices:
    A: Stopping when the white line visually disappears under the hood line to allow
      extra space for left-turning vehicles
    B: Stopping at a stop sign, moving forward, and stopping again
    C: Pumping the brakes repeatedly to come to a gradual stop
    D: Stopping behind a vehicle with enough space to steer around it
  answer: A
  explanation: A staggered stop is stopping when the white line visually disappears
    under the hood line. This allows extra space for left-turning vehicles.
- id: 363
  category: penalties_and_points
  question: How does a license suspension differ from a revocation?
  choices:
    A: A suspension is for an indefinite period, while a revocation is permanent
    B: A suspension is the temporary withdrawal of a license for a definite period
      of time
    C: A suspension only applies to commercial drivers
    D: A suspension requires the installation of an interlock device
  answer: B
  explanation: Suspension is the temporary withdrawal of a driver license or privilege
    for a definite period of time, whereas revocation is for an indefinite period.
- id: 364
  category: alcohol_drugs_health
  question: What is tunnel vision?
  choices:
    A: The inability to see clearly at night
    B: When objects in your peripheral vision become blurred as speed increases
    C: The ability to see in a narrow field of vision of 140 degrees or less with
      little effective peripheral vision
    D: The area a person can see around the central field of vision
  answer: C
  explanation: Tunnel vision is the ability to see in a narrow field of vision of
    140 degrees or less with little effective peripheral vision.
- id: 365
  category: safe_driving_rules
  question: What defines an uncontrolled intersection?
  choices:
    A: An intersection where the traffic lights are flashing yellow
    B: An intersection that has no signs or signals to regulate traffic
    C: An intersection with a traffic circle
    D: An intersection where multiple lanes merge into one
  answer: B
  explanation: An uncontrolled intersection is an intersection that has no signs or
    signals to regulate traffic, including railroad crossings that do not have flashing
    red lights or crossing gates.
- id: 366
  category: alcohol_drugs_health
  question: What does the zero tolerance law state?
  choices:
    A: It is illegal for anyone to drive with a blood alcohol concentration over 0.08%
    B: It is illegal for individuals under 21 years of age to drive with any measurable
      amount of alcohol in their blood
    C: Drivers will lose their license immediately if caught speeding in a school
      zone
    D: No driver may refuse a breathalyzer test
  answer: B
  explanation: The zero tolerance law states it is illegal for individuals who are
    under 21 years of age to drive with any measurable amount of alcohol in their
    blood.
- id: 367
  category: defensive_driving
  question: What visual effect occurs when objects in your peripheral vision become
    blurred and distorted as your speed increases?
  choices:
    A: Tunnel vision
    B: Night blindness
    C: Speed smear
    D: Reduced visibility
  answer: C
  explanation: Speed smear occurs when objects in your peripheral vision become blurred
    and distorted as your speed increases.
- id: 368
  category: safe_driving_rules
  question: What is the technique of 'rocking a vehicle' used for?
  choices:
    A: Testing the suspension system of the vehicle
    B: Moving a vehicle out of deep snow, mud, or sand
    C: Warning other drivers of a vehicle malfunction
    D: Executing a turnabout in a narrow driveway
  answer: B
  explanation: Rocking a vehicle is repeating the sequence of driving forward a little
    then back a little to move your vehicle out of deep snow, mud, or sand.
- id: 369
  category: driver_responsibility
  question: Which type of insurance covers costs up to a certain amount if you are
    struck by another vehicle whose driver has no insurance?
  choices:
    A: No-fault insurance
    B: Property-damage insurance
    C: Under-insured motorist insurance
    D: Uninsured motorist insurance
  answer: D
  explanation: Uninsured motorist insurance covers costs up to a certain amount if
    you are struck by another vehicle whose driver has no insurance.
- id: 370
  category: safe_driving_rules
  question: How does the Texas Driver Handbook define 'visibility'?
  choices:
    A: The distance a vehicle takes to stop
    B: The ability to see
    C: The brightness of a vehicle's headlights
    D: The clarity of the windshield
  answer: B
  explanation: The manual defines visibility simply as 'the ability to see'.
- id: 371
  category: signs_and_signals
  question: What is the purpose of a warning sign?
  choices:
    A: To indicate the maximum speed limit
    B: To alert you to possible hazards and road conditions
    C: To provide directions to a destination
    D: To show where parking is prohibited
  answer: B
  explanation: A warning sign is defined as 'a sign alerting you to possible hazards
    and road conditions'.
- id: 372
  category: vehicle_information
  question: What does it mean if a warning light on your instrument panel stays on?
  choices:
    A: The system is functioning optimally
    B: It is a reminder to turn on your headlights
    C: There is a system malfunction
    D: The vehicle is due for an oil change
  answer: C
  explanation: A warning light is an instrument panel light warning of a system malfunction
    and usually stays on while the system is malfunctioning.
- id: 373
  category: safe_driving_rules
  question: What does it mean to 'yield' on the roadway?
  choices:
    A: To come to a complete stop and wait for a green light
    B: To allow another vehicle or roadway user to proceed first
    C: To merge into traffic without slowing down
    D: To honk your horn to warn other drivers
  answer: B
  explanation: To yield means 'to allow another vehicle or roadway user to proceed
    first'.
- id: 374
  category: alcohol_drugs_health
  question: The 'zero tolerance law' applies to individuals under what age?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '16'
  answer: B
  explanation: The zero tolerance law makes it illegal for individuals who are under
    21 years of age to drive with any measurable amount of alcohol in their blood.
- id: 375
  category: alcohol_drugs_health
  question: Under the zero tolerance law, how much alcohol is an individual under
    21 allowed to have in their blood while driving?
  choices:
    A: Less than 0.08%
    B: Less than 0.04%
    C: Any measurable amount is illegal
    D: Up to one standard drink
  answer: C
  explanation: The zero tolerance law states it is illegal for individuals under 21
    to drive with 'any measurable amount of alcohol in their blood'.
- id: 376
  category: license_system
  question: Approximately how many driver license offices (DLO) does the DPS offer
    statewide for in-person services?
  choices:
    A: More than 50
    B: More than 100
    C: More than 220
    D: More than 500
  answer: C
  explanation: DPS offers appointments for in-person DL/ID services at more than 220
    driver license offices (DLO) statewide.
- id: 377
  category: license_system
  question: How many service counters can be found at DPS 'mega centers'?
  choices:
    A: Up to 10
    B: Up to 15
    C: Up to 20
    D: Up to 25
  answer: D
  explanation: Mega centers offer up to 25 service counters to serve customers.
- id: 378
  category: license_system
  question: Which of the following is an alternative service option encouraged by
    the DPS for eligible driver license renewals?
  choices:
    A: Online renewals
    B: Drive-thru renewals
    C: Kiosk renewals at grocery stores
    D: Home visit renewals
  answer: A
  explanation: The DPS encourages customers to utilize alternative service options
    such as online, telephone, or mail-in renewals when eligible.
- id: 379
  category: license_system
  question: What is required to receive in-person Driver License or ID services at
    a DPS office?
  choices:
    A: A scheduled appointment
    B: A walk-in ticket
    C: A written request by mail
    D: A referral from a driving school
  answer: A
  explanation: According to the manual, 'All in person DL/ID services are provided
    by scheduled appointment.'
- id: 380
  category: license_system
  question: How far in advance can you book an appointment for in-person driver license
    services?
  choices:
    A: Up to one month
    B: Up to three months
    C: Up to six months
    D: Up to one year
  answer: C
  explanation: Appointments for in-person DL/ID services may be booked up to six months
    in advance.
- id: 381
  category: license_system
  question: What should you do if you are unable to keep your scheduled driver license
    appointment?
  choices:
    A: Transfer it to a friend
    B: Cancel it so other customers may be served
    C: Show up the next day instead
    D: Nothing, it will automatically expire
  answer: B
  explanation: 'The manual states: ''If you are unable to keep your appointment, please
    cancel it so other customers may be served promptly.'''
- id: 382
  category: driver_testing
  question: Why is the DPS expanding third-party education and testing options?
  choices:
    A: To replace all state-run driver license offices
    B: To provide more flexibility to customers getting a license for the first time
    C: To increase the cost of getting a driver license
    D: To make the driving test more difficult
  answer: B
  explanation: The department is expanding third-party education and testing options
    'to provide more flexibility to customers who are getting a license for the first
    time.'
- id: 383
  category: license_system
  question: Why is the DPS working to make more service options available online?
  choices:
    A: To reduce the number of required driver license office visits
    B: To eliminate the need for driving tests
    C: To phase out physical driver licenses
    D: To increase state revenue
  answer: A
  explanation: The department is working to make more service options available online
    'to reduce the number of required DLO visits.'
- id: 384
  category: driver_testing
  question: Appendix C of the Texas Driver Handbook provides study and review questions
    for which type of operators?
  choices:
    A: Class A Operators
    B: Class B Operators
    C: Class C Operators
    D: Commercial Drivers
  answer: C
  explanation: The title of Appendix C is 'Study and Review Questions for Class C
    Operators.'
- id: 385
  category: license_system
  question: When is the $1 administrative fee NOT charged for a driver's license transaction?
  choices:
    A: When the transaction is completed online
    B: When the transaction is completed in person
    C: When the transaction is conducted through the mail
    D: When completing more than one transaction at the same time
  answer: C
  explanation: 'According to Appendix D: Fees, the $1 administrative fee is not charged
    for transactions conducted through the mail.'
- id: 386
  category: license_system
  question: How long is a new Class C driver's license valid for a person between
    the ages of 18 and 84?
  choices:
    A: 2 years
    B: 4 years
    C: 6 years
    D: 8 years
  answer: D
  explanation: The manual states that a new driver license (Class A, B or C) for ages
    18 to 84 expires after eight years on the driver's birthday.
- id: 387
  category: license_system
  question: What is the renewal fee and expiration period for a driver's license for
    an individual age 85 and older?
  choices:
    A: $33, expires in 8 years
    B: $16, expires in 6 years
    C: $9, expires in 2 years
    D: Free, expires in 4 years
  answer: C
  explanation: For individuals age 85 and older, a driver license renewal costs $9
    and expires two years after the previous expiration date.
- id: 388
  category: license_system
  question: What is the fee for a new or renewed driver's license for a 60% disabled
    veteran who meets the fee exemption requirements?
  choices:
    A: $9
    B: $11
    C: $16
    D: Free
  answer: D
  explanation: Appendix D indicates that a new or renewed driver license for a 60%
    disabled veteran is free, provided they meet the requirements for fee exemption.
- id: 389
  category: license_system
  question: How much does it cost to replace a lost, stolen, or damaged driver's license?
  choices:
    A: $9
    B: $11
    C: $16
    D: $33
  answer: B
  explanation: The fee to replace a lost, stolen, or damaged driver license is $11,
    and the current expiration date does not change.
- id: 390
  category: license_system
  question: What is the fee for a new or renewed Identification (ID) card for an individual
    age 60 and older?
  choices:
    A: $6
    B: $11
    C: $16
    D: $21
  answer: A
