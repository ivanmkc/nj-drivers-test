metadata:
  source: 2025 Texas Driver Handbook (dps.texas.gov)
  total_questions: 433
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: What are the primary purposes of the Texas Driver Handbook?
  choices:
    A: To serve as an official legal reference in court and provide insurance rates.
    B: To help you qualify for a Texas driver license and help you become a safer
      driver.
    C: To register your vehicle and provide a list of local driving schools.
    D: To outline the Texas Penal Code and schedule driving exams.
  answer: B
  explanation: 'The handbook states its primary purpose is: 1) to help you qualify
    for a Texas driver license, and 2) to help you become a safer driver.'
- id: 2
  category: safe_driving_rules
  question: If you want to read the actual language of traffic or criminal laws referenced
    in the handbook, which documents should you consult?
  choices:
    A: The Texas Driver Handbook Appendix
    B: The Texas Administrative Code
    C: The Texas Transportation Code and Texas Penal Code
    D: The Department of Public Safety Rulebook
  answer: C
  explanation: The handbook is not an official legal reference. To know the actual
    language of traffic or criminal laws, you must refer to the Texas Transportation
    Code and Texas Penal Code.
- id: 3
  category: license_system
  question: How often does the Texas Legislature meet to regularly make changes to
    traffic laws?
  choices:
    A: Every six months
    B: Every year
    C: Every two years
    D: Every four years
  answer: C
  explanation: The text notes that the Texas Legislature meets every two years and
    regularly makes changes to traffic laws.
- id: 4
  category: license_system
  question: How much notice should you provide if you need to make special arrangements
    to accommodate a disability prior to visiting a driver license office?
  choices:
    A: At least 24 hours
    B: At least 48 hours
    C: At least three to four business days
    D: At least five to seven business days
  answer: D
  explanation: The manual requests that you contact them at least five to seven business
    days prior to your visit to allow time to accommodate an ADA request.
- id: 5
  category: safe_driving_rules
  question: Approximately how many miles of public roadways are there in the state
    of Texas?
  choices:
    A: More than 100,000 miles
    B: More than 250,000 miles
    C: More than 314,000 miles
    D: More than 500,000 miles
  answer: C
  explanation: According to the letter from the Colonel, Texas is a large state with
    more than 314,000 miles of public roadways.
- id: 6
  category: defensive_driving
  question: Approximately how many people are killed in traffic crashes every year
    in Texas?
  choices:
    A: 1,500
    B: 3,500
    C: 5,000
    D: 10,000
  answer: B
  explanation: The handbook states that tragically, every year in Texas, approximately
    3,500 people are killed in traffic crashes.
- id: 7
  category: defensive_driving
  question: To prevent tragic consequences on the road, the Texas Department of Public
    Safety advises drivers to stay alert for impaired drivers and avoid what in their
    own vehicles?
  choices:
    A: Listening to the radio
    B: Distractions
    C: Having passengers
    D: Driving at night
  answer: B
  explanation: The manual emphasizes that drivers must avoid distractions in their
    own vehicle while staying alert for impaired or unsafe drivers.
- id: 8
  category: license_system
  question: According to the Table of Contents, an Occupational License is also known
    as what?
  choices:
    A: A Hardship License
    B: An Essential Need License
    C: A Provisional License
    D: A Restricted License
  answer: B
  explanation: The Table of Contents lists 'Occupational License (Essential Need License)'
    under Chapter 1.
- id: 9
  category: driver_responsibility
  question: Which chapter of the Texas Driver Handbook covers the Liability Insurance
    Law and Evidence of Financial Responsibility?
  choices:
    A: Chapter 1
    B: Chapter 2
    C: Chapter 3
    D: Chapter 4
  answer: C
  explanation: 'According to the Table of Contents, Chapter 3: Safety Responsibility
    covers the Liability Insurance Law and Evidence of Financial Responsibility.'
- id: 10
  category: sharing_the_road
  question: 'According to the Table of Contents, which of the following topics is
    covered under Chapter 4: Right-of-Way?'
  choices:
    A: Yield Right-of-Way to School Buses
    B: Required Equipment for Vehicles
    C: Penalties for Driving Without a License
    D: Traffic Signals
  answer: A
  explanation: 'The Table of Contents shows that ''Yield Right-of-Way to School Buses''
    is a section within Chapter 4: Right-of-Way.'
- id: 11
  category: license_system
  question: Where can the Texas Department of Public Safety Grievance Procedures be
    found if you fail to receive reasonable ADA accommodations?
  choices:
    A: The Texas Penal Code
    B: 37 Texas Administrative Code §1.41
    C: The Texas Transportation Code
    D: Chapter 5 of the Texas Driver Handbook
  answer: B
  explanation: The manual states that DPS Grievance Procedures can be found in the
    37 Texas Administrative Code §1.41.
- id: 12
  category: vehicle_information
  question: In which chapter of the handbook would you find information regarding
    'Equipment You Must Not Have' on your vehicle?
  choices:
    A: 'Chapter 1: Your License to Drive'
    B: 'Chapter 2: Vehicle Inspection and Registration'
    C: 'Chapter 3: Safety Responsibility'
    D: 'Chapter 5: Signals, Signs, and Markers'
  answer: B
  explanation: 'The Table of Contents lists ''Equipment You Must Not Have'' under
    Chapter 2: Vehicle Inspection and Registration.'
- id: 13
  category: license_system
  question: Which division of the Texas Department of Public Safety is responsible
    for publishing the Texas Driver Handbook?
  choices:
    A: The Highway Patrol Division
    B: The Vehicle Inspection Division
    C: The Driver License Division
    D: The Traffic Safety Division
  answer: C
  explanation: The introduction states that the Texas Department of Public Safety,
    Driver License Division, provides the handbook.
- id: 14
  category: penalties_and_points
  question: According to the Table of Contents, Chapter 1 includes information on
    penalties for which of the following offenses committed by minors?
  choices:
    A: Speeding in a school zone
    B: Non-Driving Alcohol-Related Offenses
    C: Driving without a seatbelt
    D: Texting while driving
  answer: B
  explanation: The Table of Contents for Chapter 1 lists a section titled 'Penalties
    for Non-Driving Alcohol-Related Offenses by Minors'.
- id: 15
  category: alcohol_drugs_health
  question: According to the manual, what is the number one killer on the roads?
  choices:
    A: Speeding
    B: Distracted driving
    C: Alcohol
    D: Bad weather
  answer: C
  explanation: The manual explicitly states 'The Number One Killer is Alcohol' in
    the chapter covering the impact of alcohol and drugs on driving ability.
- id: 16
  category: safe_driving_rules
  question: How does increasing your speed affect your driving ability?
  choices:
    A: It increases your reaction time
    B: It reduces your field of vision
    C: It improves your vehicle's traction
    D: It widens your field of vision
  answer: B
  explanation: The manual includes a specific section titled 'Speed Reduces Your Field
    of Vision' under the Speed and Speed Limits chapter.
- id: 17
  category: safe_driving_rules
  question: When approaching stopped emergency vehicles or law enforcement on the
    side of the road, what specific action is highlighted in the speed limits chapter?
  choices:
    A: Honk your horn
    B: Maintain your speed
    C: Slow Down or Move Over
    D: Stop immediately
  answer: C
  explanation: The manual includes the 'Slow Down or Move Over' rule in the chapter
    regarding speed and speed limits.
- id: 18
  category: signs_and_signals
  question: What type of emblem is specifically required for certain vehicles that
    travel at lower speeds?
  choices:
    A: High-occupancy vehicle emblem
    B: Slow-Moving Vehicle Emblem
    C: Commercial vehicle emblem
    D: Wide load emblem
  answer: B
  explanation: The manual lists the 'Slow-Moving Vehicle Emblem' under the signs and
    signals section.
- id: 19
  category: defensive_driving
  question: Which of the following is explicitly categorized as a 'Special Driving
    Situation' in the manual?
  choices:
    A: Driving in a school zone
    B: Parallel parking
    C: Winter Driving
    D: Yielding at an intersection
  answer: C
  explanation: '''Winter Driving'' is listed under the chapter titled ''Some Special
    Driving Situations''.'
- id: 20
  category: sharing_the_road
  question: What type of pavement marking is specifically mentioned in the bicycle
    laws and safety chapter?
  choices:
    A: Solid yellow line
    B: Shared Lane Marking
    C: Broken white line
    D: Crosswalk marking
  answer: B
  explanation: The 'Shared Lane Marking' is specifically listed under the Bicycle
    Laws and Safety chapter.
- id: 21
  category: driver_responsibility
  question: Which of the following is a specific type of crash outlined in the motor
    vehicle crashes chapter?
  choices:
    A: Crash Involving an Unattended Vehicle
    B: Crash Involving a Pedestrian
    C: Crash Involving a Bicycle
    D: Crash Involving a Train
  answer: A
  explanation: '''Crash Involving an Unattended Vehicle'' is explicitly listed as
    a section in the Motor Vehicle Crashes chapter.'
- id: 22
  category: signs_and_signals
  question: What must a driver do regarding warning signs and barricades?
  choices:
    A: Drive around them carefully
    B: Move them if they block the path
    C: Obey Warning Signs and Barricades
    D: Report them to law enforcement
  answer: C
  explanation: The manual explicitly instructs drivers to 'Obey Warning Signs and
    Barricades' in the traffic signs section.
- id: 23
  category: vehicle_information
  question: What dangerous gas is specifically highlighted as an additional safety
    tip to be aware of?
  choices:
    A: Nitrogen dioxide
    B: Carbon Monoxide
    C: Sulfur dioxide
    D: Ozone
  answer: B
  explanation: '''Carbon Monoxide'' is listed under the Additional Safety Tips chapter.'
- id: 24
  category: sharing_the_road
  question: Which of the following is considered a 'Large truck' according to the
    sharing the road section?
  choices:
    A: A delivery van
    B: A pickup truck with a trailer
    C: A truck-tractor combination
    D: A heavy-duty passenger vehicle
  answer: C
  explanation: The manual specifies 'Large trucks and truck-tractor combinations'
    in the section on sharing the road with trucks.
- id: 25
  category: driver_responsibility
  question: What is a driver's responsibility when involved in a crash where someone
    is hurt, according to the crash chapter?
  choices:
    A: Wait for emergency services without intervening
    B: Aiding the Injured
    C: Directing traffic around the crash
    D: Moving the vehicles immediately
  answer: B
  explanation: '''Aiding the Injured'' is listed as a specific section under the Motor
    Vehicle Crashes chapter.'
- id: 26
  category: signs_and_signals
  question: Which of the following is listed as a specific category of traffic signs?
  choices:
    A: Suggestive Signs
    B: Guide Signs
    C: Optional Signs
    D: Temporary Signs
  answer: B
  explanation: '''Guide Signs'' are explicitly listed as a category under Traffic
    Signs.'
- id: 27
  category: sharing_the_road
  question: In addition to large trucks, motorcycles, and bicycles, what other specific
    mode of transportation does the manual instruct drivers to 'Share the Road' with?
  choices:
    A: Light Rail
    B: Airplanes
    C: Horse-drawn carriages
    D: Pedestrians
  answer: A
  explanation: '''Share the Road with Light Rail'' is a specific section in the Special
    Driving Situations chapter.'
- id: 28
  category: penalties_and_points
  question: What type of crash involves a driver leaving the scene without providing
    their information?
  choices:
    A: Unattended crash
    B: Hit-and-Run Crashes
    C: Fixture crash
    D: Moving violation crash
  answer: B
  explanation: '''Hit-and-Run Crashes'' are explicitly listed in the Motor Vehicle
    Crashes chapter.'
- id: 29
  category: sharing_the_road
  question: What is required of bicycles before they can be safely operated on the
    road?
  choices:
    A: They must be registered with the state
    B: They must have a motor attached
    C: They must be properly equipped
    D: They must be painted a bright color
  answer: C
  explanation: The manual states 'Bicycles Must Be Properly Equipped' in the Bicycle
    Laws and Safety chapter.
- id: 30
  category: license_system
  question: How many days does a new resident with a valid out-of-state license have
    to establish residency and secure a Texas driver license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: According to the manual, new residents who are exchanging a valid out-of-state
    license have 90 days to establish residency in Texas in order to secure a Texas
    driver license.
- id: 31
  category: license_system
  question: Which of the following individuals is exempt from having a Texas driver
    license?
  choices:
    A: A person driving a commercial motor vehicle across state lines
    B: A person temporarily operating a farm tractor on a highway
    C: A 16-year-old driving a family car to school
    D: A new resident who has lived in Texas for 6 months
  answer: B
  explanation: Any person temporarily operating or moving a road machine, farm tractor,
    or implement of husbandry on a highway is exempt from having a Texas license,
    unless the vehicle is a commercial motor vehicle.
- id: 32
  category: license_system
  question: What is the minimum age for a nonresident to drive a Class C or Class
    M vehicle in Texas using a valid driver license from their home state or Canadian
    province?
  choices:
    A: 15 years old
    B: 16 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: Any nonresident who is at least 16 years of age and possesses a valid
    driver license issued in their home state or Canadian province may drive a vehicle
    permitted to be operated with a Class C or Class M driver license in Texas.
- id: 33
  category: license_system
  question: How long does a Texas driver license remain valid for a person in the
    U.S. armed forces after they are honorably separated from service or return to
    Texas?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: A Texas driver license held by a person in the U.S. armed forces remains
    valid as long as service continues and the person remains absent from Texas, provided
    the absence does not exceed 90 days from the date they are honorably separated
    from service or return to Texas.
- id: 34
  category: license_system
  question: What are the requirements for the licensed driver who must accompany a
    student driver with a learner license?
  choices:
    A: Must be at least 18 years old with 6 months of driving experience
    B: Must be at least 21 years old with at least one year of driving experience
    C: Must be a parent or legal guardian over 25 years old
    D: Must be a certified driving instructor
  answer: B
  explanation: The licensed driver accompanying a learner must be at least 21 years
    of age with at least one year of driving experience, must occupy the seat beside
    the driver, and cannot be intoxicated, asleep, or distracted.
- id: 35
  category: license_system
  question: When does a learner license expire for an applicant under 18 years of
    age?
  choices:
    A: On their 16th birthday
    B: On their 18th birthday
    C: On their 21st birthday
    D: One year from the date of issuance
  answer: B
  explanation: A learner license will indicate 'Learner License' on the front of the
    card and expire on the minor's 18th birthday.
- id: 36
  category: license_system
  question: How long is a Verification of Enrollment and Attendance (VOE) form valid
    during the summer?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: D
  explanation: The VOE may not be dated more than 30 days before the date of application
    for a license during the school year or more than 90 days during the summer.
- id: 37
  category: license_system
  question: To obtain a Verification of Enrollment and Attendance (VOE) form, how
    many days must a student have attended school in the fall or spring semester preceding
    the application?
  choices:
    A: At least 45 days
    B: At least 60 days
    C: At least 80 days
    D: At least 90 days
  answer: C
  explanation: A student must have attended school for at least 80 days in the fall
    or spring semester preceding the date of application to satisfy the VOE requirement.
- id: 38
  category: license_system
  question: What is the minimum age requirement to apply for a hardship license in
    Texas?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 17 years of age
  answer: B
  explanation: A person applying for a hardship license must be at least 15 years
    of age but not more than 18.
- id: 39
  category: license_system
  question: Which of the following is a valid reason for the Department of Public
    Safety (DPS) to issue a hardship license to a minor?
  choices:
    A: The minor needs to drive to social events
    B: The minor is enrolled in a vocational education program that requires a license
    C: The minor's parents do not have time to drive them to school
    D: The minor wants to get a head start on the Graduated Driver License program
  answer: B
  explanation: DPS will issue a hardship license if it is determined that it is necessary
    because the minor applicant is enrolled in a vocational education program that
    requires a license for participation.
- id: 40
  category: driver_responsibility
  question: According to the Texas Driver Handbook, young drivers make up 6.5 percent
    of the driving population but are responsible for what percentage of fatal crashes?
  choices:
    A: 6.5 percent
    B: 10 percent
    C: 13 percent
    D: 25 percent
  answer: C
  explanation: Young drivers make up 6.5 percent of the driving population but are
    responsible for 13 percent of fatal crashes.
- id: 41
  category: license_system
  question: Under Phase One of the Graduated Driver License (GDL) program, how long
    must an applicant under 18 hold a learner or hardship license before a provisional
    license can be issued?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Phase One requires applicants under 18 years of age to hold a valid
    learner, hardship, or combination of learner and hardship license for a minimum
    of six months prior to the issuance of a provisional license.
- id: 42
  category: penalties_and_points
  question: What happens if a minor's learner license is suspended during Phase One
    of the Graduated Driver License (GDL) program?
  choices:
    A: The minor must restart the six-month period from the beginning.
    B: The minor is permanently disqualified from getting a provisional license.
    C: The initial six-month period is extended by the number of days of the suspension.
    D: The suspension has no effect on the six-month requirement.
  answer: C
  explanation: If your license is suspended during Phase One, then the initial six-month
    period is extended by the number of days of the suspension because your license
    is invalid during the suspension period.
- id: 43
  category: license_system
  question: Which type of license is exempt from the Phase One requirements of the
    Graduated Driver License (GDL) program?
  choices:
    A: Class A licenses
    B: Class B licenses
    C: Class C licenses
    D: Class M (motorcycle) licenses
  answer: D
  explanation: Phase One requirements do not apply to Class M (motorcycle) licenses.
    Under the GDL program, there is no minimum time a person must hold a restricted
    motorcycle license before applying for a Class M license.
- id: 44
  category: license_system
  question: What must an applicant do with their previously issued valid driver licenses
    and IDs before receiving a new Texas driver license?
  choices:
    A: Keep them as a backup form of identification.
    B: Surrender them to the Department of Public Safety.
    C: Mail them to their previous home state.
    D: Destroy them at home.
  answer: B
  explanation: 'A Special Note in the manual states: ''You may not receive a Texas
    driver license until all valid driver licenses and IDs issued are surrendered.'''
- id: 45
  category: license_system
  question: How long must an individual hold a Texas learner license before they are
    eligible for Phase Two of the Graduated Driver License (GDL) program?
  choices:
    A: Three months
    B: Six months
    C: Nine months
    D: Twelve months
  answer: B
  explanation: According to the manual, a Texas learner license must be held for six
    months from the date of issuance before the individual is eligible for Phase Two.
- id: 46
  category: safe_driving_rules
  question: During Phase Two of the GDL program, a driver may not operate a motor
    vehicle with more than how many passengers under the age of 21 who are not family
    members?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: During Phase Two, individuals may not drive a motor vehicle with more
    than one passenger in the vehicle under the age of 21 who is not a family member.
- id: 47
  category: safe_driving_rules
  question: What are the restricted driving hours for an individual in Phase Two of
    the GDL program, unless driving for work, school, or a medical emergency?
  choices:
    A: 10:00 p.m. to 4:00 a.m.
    B: 11:00 p.m. to 6:00 a.m.
    C: Midnight to 5:00 a.m.
    D: 1:00 a.m. to 5:00 a.m.
  answer: C
  explanation: Phase Two restricts individuals from driving between midnight and 5:00
    a.m. unless the operation is necessary for work, a school-related activity, or
    a medical emergency.
- id: 48
  category: safe_driving_rules
  question: What is the rule regarding wireless communication devices for drivers
    under 18 years of age?
  choices:
    A: They may use hands-free devices only.
    B: They may use wireless devices only when stopped at a red light.
    C: They are restricted from using any wireless communication device, including
      hands-free, except in an emergency.
    D: They may use wireless devices if a licensed adult is in the passenger seat.
  answer: C
  explanation: All drivers who are under 18 years of age are restricted from using
    a wireless communication device, including a hands-free device, except in case
    of an emergency.
- id: 49
  category: license_system
  question: When does a provisional driver license expire?
  choices:
    A: On the license holder's 18th birthday
    B: On the license holder's 21st birthday
    C: Four years from the date of issuance
    D: Eight years from the date of issuance
  answer: A
  explanation: A provisional license is issued to persons 16 to 18 years of age, is
    marked 'PROVISIONAL', and expires on the license holder's 18th birthday.
- id: 50
  category: license_system
  question: If an applicant is 16 years old and presents a valid out-of-state driver
    license, what type of Texas license will they be issued after passing the driving
    exam?
  choices:
    A: A Phase One learner license
    B: A Phase Two provisional license
    C: A standard Class C driver license
    D: A Class M motorcycle license
  answer: B
  explanation: Applicants who are at least 16 but less than 18 years of age and present
    a valid out-of-state driver license will be issued a Phase Two provisional license
    with passenger and time restrictions.
- id: 51
  category: license_system
  question: How will a driver license be marked if it is issued to a person who is
    less than 21 years of age?
  choices:
    A: MINOR
    B: PROVISIONAL
    C: UNDER 21
    D: RESTRICTED
  answer: C
  explanation: The manual states that all licenses issued to persons less than 21
    years of age will be marked 'UNDER 21'.
- id: 52
  category: license_system
  question: For how many years is a standard non-commercial driver license typically
    valid for persons 18 years of age and older?
  choices:
    A: Four years
    B: Five years
    C: Six years
    D: Eight years
  answer: D
  explanation: Most non-commercial driver licenses issued to persons 18 years of age
    and older are valid for eight years.
- id: 53
  category: license_system
  question: Which of the following is a reason an applicant might receive a driver
    license with a shorter term than the standard eight years?
  choices:
    A: Being 85 years of age or older
    B: Having a history of parking tickets
    C: Driving a recreational vehicle
    D: Holding a Class M license
  answer: A
  explanation: Some applicants receive licenses with shorter terms due to restrictions
    including verification of lawful presence, sex offender registration requirements,
    or being 85 years of age or older.
- id: 54
  category: vehicle_information
  question: Which of the following vehicles is exempt from requiring a Commercial
    Driver License (CDL)?
  choices:
    A: A delivery truck used for a commercial enterprise
    B: A recreational vehicle driven for personal use
    C: A passenger bus carrying 20 people for hire
    D: A tractor-trailer used for interstate commerce
  answer: B
  explanation: Individuals who operate a recreational vehicle driven for personal
    use are exempt from obtaining a CDL.
- id: 55
  category: vehicle_information
  question: A Class A driver license permits a person to drive a vehicle with a gross
    combination weight rating (GCWR) of 26,001 lbs. or more, provided the towed vehicle
    exceeds what weight?
  choices:
    A: 5,000 lbs.
    B: 10,000 lbs.
    C: 15,000 lbs.
    D: 20,000 lbs.
  answer: B
  explanation: A Class A driver license permits driving a vehicle or combination of
    vehicles with a GCWR of 26,001 lbs. or more, provided the gross vehicle weight
    rating (GVWR) of the vehicle(s) towed is in excess of 10,000 lbs.
- id: 56
  category: vehicle_information
  question: Under a Class C driver license, an autocycle is defined as a motor vehicle
    that meets several requirements. Which of the following is ONE of those requirements?
  choices:
    A: It must have four wheels on the ground when moving.
    B: It must be equipped with handlebars instead of a steering wheel.
    C: It must be equipped with seats that do not require the operator to straddle
      or sit astride the seat.
    D: It must not be certified to comply with federal motorcycle safety requirements.
  answer: C
  explanation: An autocycle is defined as having no more than three wheels, equipped
    with a steering wheel, equipped with seats that do not require the operator to
    straddle or sit astride the seat, and manufactured to comply with federal safety
    requirements for a motorcycle.
- id: 57
  category: vehicle_information
  question: What is the gross vehicle weight rating (GVWR) limit for a single vehicle
    driven with a standard Class C driver license?
  choices:
    A: Less than 10,000 lbs.
    B: Less than 20,000 lbs.
    C: Less than 26,001 lbs.
    D: 26,001 lbs. or more
  answer: C
  explanation: A Class C driver license permits a person to drive a single vehicle
    with a gross vehicle weight rating (GVWR) of less than 26,001 lbs.
- id: 58
  category: driver_testing
  question: What must an individual pass before applying for a Class M (motorcycle)
    driver license?
  choices:
    A: A commercial vehicle driving test
    B: A state approved motorcycle operator training course
    C: An autocycle certification exam
    D: A defensive driving course
  answer: B
  explanation: Before applying for a Class M license, you must pass a state approved
    motorcycle operator training course.
- id: 59
  category: license_system
  question: What is the minimum age requirement to obtain a Class M license for a
    motorcycle over 250 cc?
  choices:
    A: 15 years of age
    B: 16 years of age with completion of required education and training courses
    C: 18 years of age
    D: 21 years of age
  answer: B
  explanation: The minimum age for a motorcycle license is 16 with completion of the
    classroom phase of a driver education course (32 hours) and a state approved motorcycle
    operator training course (16 hours).
- id: 60
  category: license_system
  question: Under what condition can a 15-year-old obtain a license to operate a motorcycle
    of 250 cc or less?
  choices:
    A: If they hold a valid Class C license
    B: If they are accompanied by a licensed parent or guardian at all times
    C: With DPS approval for a hardship driver license or completion of required education
      courses
    D: 15-year-olds cannot obtain a motorcycle license under any circumstances
  answer: C
  explanation: For a motorcycle of 250 cc or less, the minimum age is 15 years of
    age with DPS approval for a hardship driver license or completion of the classroom
    phase of a driver education course and a state approved motorcycle operator training
    course.
- id: 61
  category: license_system
  question: Which veterans are eligible to be exempt from paying driver license and
    ID card fees?
  choices:
    A: All honorably discharged veterans
    B: Veterans who served in a designated combat zone
    C: Veterans with at least a 30 percent service-related disability
    D: Honorably discharged veterans who receive compensation for a service-related
      disability of at least 60 percent
  answer: D
  explanation: Veterans who are honorably discharged and receive compensation for
    a service-related disability of at least 60 percent are exempt from paying driver
    license and ID card fees.
- id: 62
  category: license_system
  question: 'A veteran who meets the disability requirements for a fee exemption will
    still have to pay fees if they are applying for:'
  choices:
    A: A Class M motorcycle license
    B: A commercial driver license (CDL)
    C: An identification (ID) card
    D: A Class C driver license
  answer: B
  explanation: Individuals applying for a CDL or who are required to register as a
    sex offender are not eligible for the veteran fee exemption.
- id: 63
  category: license_system
  question: How are Texas identification (ID) cards formatted for individuals who
    are younger than 21 years of age?
  choices:
    A: They are printed in a horizontal format
    B: They are printed in a vertical format
    C: They have a red border around the photograph
    D: They do not include a photograph
  answer: B
  explanation: ID cards are displayed in a vertical format for individuals who are
    younger than 21 years of age and are horizontal for individuals who are 21 years
    of age and older.
- id: 64
  category: license_system
  question: What is the minimum age requirement to be issued a Texas Identification
    (ID) card?
  choices:
    A: 15 years old
    B: 16 years old
    C: 18 years old
    D: ID cards can be issued to any person of any age
  answer: D
  explanation: According to the ID Cards table in the manual, ID cards can be issued
    to any person of any age.
- id: 65
  category: driver_responsibility
  question: How should you add information about an allergic reaction to drugs to
    your driver license?
  choices:
    A: Request DPS to print it on the front of the card during your application
    B: Submit a medical form to the Medical Advisory Board
    C: Use a permanent ink pen to write the medication name on the back of the card
    D: Attach a medical alert sticker to the front of the card
  answer: C
  explanation: DPS does not print medical information on driver licenses. To add medical
    information, use a permanent ink pen and write the name of medication that may
    cause an allergic reaction on the back of your card.
- id: 66
  category: driver_responsibility
  question: If you choose to register as an organ donor, how will this be indicated
    on your driver license?
  choices:
    A: A small heart with the word 'donor' will be printed on the front
    B: The words 'Organ Donor' will be printed in red on the back
    C: Your license will have a special blue background
    D: A medical code will be added to your driver record
  answer: A
  explanation: If you choose to be an organ donor, a small heart with the word 'donor'
    will be printed on the front of the card.
- id: 67
  category: license_system
  question: At what age are in-office driver license applicants provided the opportunity
    to complete a voter registration application?
  choices:
    A: 16 years old
    B: 17 years and 10 months old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: All in-office applicants who are at least 17 years and 10 months old
    are provided the opportunity to complete a voter registration application.
- id: 68
  category: license_system
  question: Who is automatically registered for selective service upon issuance of
    an ID card or driver license?
  choices:
    A: All applicants between 18 and 25 years of age
    B: All men 18-25 years of age who are U.S. citizens or immigrants
    C: Only male U.S. citizens who are exactly 18 years old
    D: Anyone applying for a commercial driver license (CDL)
  answer: B
  explanation: All men 18-25 years of age who are U.S. citizens or immigrants are
    automatically registered for selective service upon issuance of an ID card or
    driver license.
- id: 69
  category: license_system
  question: When applying for a Texas driver license, what must you do with any valid
    out-of-state driver license you currently hold?
  choices:
    A: Keep it as a secondary form of identification
    B: Surrender it
    C: Mail it back to the issuing state
    D: Pay an additional fee to keep both licenses active
  answer: B
  explanation: To apply for a Texas driver license, you must surrender any valid out-of-state
    driver license.
- id: 70
  category: penalties_and_points
  question: Which of the following will be recorded as part of your permanent driving
    record?
  choices:
    A: Only traffic convictions that occur within the state of Texas
    B: Parking tickets and toll violations
    C: Convictions for moving traffic violations or crashes, including out-of-state
      records
    D: Voluntary contributions made during the license application
  answer: C
  explanation: Any convictions for moving traffic violations or crashes, including
    out of state records of convictions, will be recorded as part of your permanent
    driving record.
- id: 71
  category: driver_responsibility
  question: When applying for an original driver license, what must you provide regarding
    financial responsibility?
  choices:
    A: Proof of health insurance
    B: Evidence of vehicle insurance or a statement that you do not own a motor vehicle
    C: A deposit of $500 to the Department of Public Safety
    D: A credit report showing a good credit score
  answer: B
  explanation: When applying for an original driver license, you must provide evidence
    of financial responsibility or a statement that you do not own a motor vehicle
    that requires the maintenance of financial responsibility.
- id: 72
  category: license_system
  question: Which of the following is a program you can voluntarily make a monetary
    contribution to when applying for a driver license?
  choices:
    A: The Texas Highway Maintenance Fund
    B: The Blindness Education, Screening, and Treatment Program
    C: The Public School Transportation Fund
    D: The State Parks and Wildlife Account
  answer: B
  explanation: Applicants can voluntarily contribute to several programs, including
    The Blindness Education, Screening, and Treatment Program administered by the
    Texas Commission for the Blind.
- id: 73
  category: license_system
  question: How is the $1 administrative fee handled if you are completing multiple
    driver license transactions at the same time in-person?
  choices:
    A: You are charged $1 for each separate transaction
    B: The fee is waived entirely for in-person visits
    C: You will only be charged the $1 administrative fee once
    D: The fee is increased to $5 for multiple transactions
  answer: C
  explanation: If you are completing multiple transactions at the same time, in-person,
    telephone and online, then you will only be charged the $1 administrative fee
    once.
- id: 74
  category: driver_testing
  question: What is the passing score required for any knowledge exam?
  choices:
    A: 75 percent
    B: 80 percent
    C: 70 percent
    D: 85 percent
  answer: C
  explanation: You must score a grade of 70 percent or better to pass any knowledge
    exam.
- id: 75
  category: driver_testing
  question: How long is a temporary driver license valid for after passing all applicable
    exams?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: After you have passed all applicable exams, you will be issued a temporary
    license, which you may use for 45 days or until you receive your permanent license
    in the mail.
- id: 76
  category: driver_responsibility
  question: What must a new Texas resident submit when surrendering an out-of-state
    driver license?
  choices:
    A: A birth certificate and passport
    B: Evidence that each motor vehicle owned is currently registered in Texas
    C: A driving record from their previous state
    D: Proof of completion of a Texas driver education course
  answer: B
  explanation: A new Texas resident must submit, with a driver license application,
    evidence that each motor vehicle owned by the person is currently registered in
    Texas, or indicate they do not own a motor vehicle.
- id: 77
  category: driver_testing
  question: What happens if you do not pass the knowledge and driving exams on your
    first attempt?
  choices:
    A: You must pay a new fee immediately
    B: Your application will be held for 90 days
    C: You must wait one year before reapplying
    D: You are permanently disqualified from getting a license
  answer: B
  explanation: If you do not pass the knowledge and driving exams on your first attempt,
    your application will be held for 90 days.
- id: 78
  category: driver_testing
  question: At what age are individuals required to successfully complete an approved
    driver education course to apply for a license?
  choices:
    A: Younger than 18 years of age
    B: Younger than 21 years of age
    C: Younger than 25 years of age
    D: All applicants regardless of age
  answer: C
  explanation: Individuals younger than 25 years of age are required to successfully
    complete an approved driver education course.
- id: 79
  category: license_system
  question: Who may ask the DPS to cancel the license of a minor under 18 years of
    age?
  choices:
    A: A school principal
    B: The person who signed the application under oath
    C: Any licensed driver over 21
    D: A law enforcement officer
  answer: B
  explanation: The person who signs (parent, guardian, employer, or county judge)
    may ask DPS to cancel your license any time before your 18th birthday.
- id: 80
  category: driver_testing
  question: Which of the following will result in an automatic failure of your driving
    exam?
  choices:
    A: Having more than 10 points deducted
    B: Asking the examiner to repeat an instruction
    C: Refusing to follow instructions
    D: Using a back-up camera while parallel parking
  answer: C
  explanation: 'Your application for a license will not be approved if you: 1. Violate
    the law 2. Refuse to follow instructions 3. Drive dangerously or have a crash
    4. Have more than 30 points deducted.'
- id: 81
  category: vehicle_information
  question: When taking the driving exam, what is the policy regarding the use of
    vehicle parking technology?
  choices:
    A: You may use an automated vehicle parking function
    B: You may use a back-up camera, but not an automated vehicle parking function
    C: You cannot use mirrors or cameras
    D: You must disable all electronic sensors
  answer: B
  explanation: You may use the back-up camera on your vehicle for parallel parking;
    however, the use of an automated vehicle parking function will not be allowed.
- id: 82
  category: safe_driving_rules
  question: During the quick stop portion of the driving exam, at what speed may you
    be asked to stop your car as quickly as possible?
  choices:
    A: About 10 mph
    B: About 20 mph
    C: About 30 mph
    D: About 40 mph
  answer: B
  explanation: Quick stop – You may be asked to stop your car as quickly as possible
    at about 20 mph without skidding your tires.
- id: 83
  category: penalties_and_points
  question: What is the penalty for a first conviction of driving without a license?
  choices:
    A: A fine of up to $200
    B: A fine of $25 to $200
    C: Confinement in jail for up to 30 days
    D: A fine up to $4,000
  answer: A
  explanation: According to the Penalties for Driving Without a License table, a 1st
    conviction results in a fine of up to $200.
- id: 84
  category: penalties_and_points
  question: What is the penalty if a driver operates a vehicle without a license and
    insurance, and causes a crash resulting in serious bodily injury or death?
  choices:
    A: A fine of up to $500
    B: A Class C misdemeanor
    C: A Class A misdemeanor punishable by a fine up to $4,000 and/or up to 365 days
      in jail
    D: A felony punishable by up to 5 years in prison
  answer: C
  explanation: Driving without a license, operating a vehicle without insurance at
    the time of the offense, and driver causes a crash resulting in serious bodily
    injury or death is a Class A misdemeanor punishable by a fine up to $4,000 and/or
    confinement in jail for not more than 365 days.
- id: 85
  category: driver_testing
  question: Which of the following is NOT one of the four basic skills all drivers
    are graded on during the driving exam?
  choices:
    A: Control
    B: Observation
    C: Speeding
    D: Positioning
  answer: C
  explanation: 'All drivers are graded on four basic skills: Control, Observation,
    Positioning, and Signaling.'
- id: 86
  category: driver_responsibility
  question: If you pass the driving exam, to whom must you show your driver license
    upon request?
  choices:
    A: Only a state trooper
    B: Any peace officer, judge, or anyone with whom you are involved in a crash
    C: Any licensed driver who asks to see it
    D: Only a judge or justice of the peace
  answer: B
  explanation: 'If you pass the driving exam, always carry your license with you when
    driving and upon request, show it to: 1. Any peace officer, sheriff, constable,
    judge, justice of the peace, or state trooper 2. Anyone with whom you are involved
    in a crash.'
- id: 87
  category: driver_testing
  question: How many times can you fail the knowledge and driving exams before a new
    application and fee are required?
  choices:
    A: Two times
    B: Three times
    C: Four times
    D: Five times
  answer: B
  explanation: After 90 days or three failed exams, a new application and fee will
    be required.
- id: 88
  category: vehicle_information
  question: When operating a standard transmission vehicle during the driving exam,
    when should you hold the clutch all the way down?
  choices:
    A: Only when starting the motor
    B: Whenever you are driving above 30 mph
    C: When starting the motor, shifting gears, stopping, and when speed drops below
      10 mph
    D: You should drive with your foot resting on the clutch at all times
  answer: C
  explanation: On standard transmissions, hold the clutch all the way down when starting
    the motor, shifting gears, when stopping, and once your speed drops below 10 mph.
    Do not drive with your foot resting on the clutch.
- id: 89
  category: license_system
  question: How many days do you have to report a change of address to the Texas DPS?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: According to the manual, a change of address must be reported to DPS
    within 30 days.
- id: 90
  category: license_system
  question: How often must a Texas driver license be renewed?
  choices:
    A: Every 4 years
    B: Every 6 years
    C: Every 8 years
    D: Every 10 years
  answer: C
  explanation: The manual states that a Texas driver license must be renewed every
    eight years.
- id: 91
  category: license_system
  question: How often must a person appear in a driver license office in person for
    a vision exam and to update their photo, signature, and fingerprints?
  choices:
    A: At least once every 8 years
    B: At least once every 10 years
    C: At least once every 12 years
    D: At least once every 16 years
  answer: D
  explanation: A person must appear in a driver license office at least once every
    sixteen (16) years for a vision exam and to update the photo, signature, and fingerprints.
- id: 92
  category: penalties_and_points
  question: What is the reinstatement fee for an Administrative License Revocation
    (ALR)?
  choices:
    A: $50
    B: $100
    C: $125
    D: $200
  answer: C
  explanation: The manual specifies that Administrative License Revocations (ALR)
    require a $125 reinstatement fee.
- id: 93
  category: license_system
  question: Which of the following groups of drivers is NOT eligible to renew their
    driver license using alternate methods like online or by mail?
  choices:
    A: Drivers over the age of 50
    B: Commercial driver license (CDL) holders
    C: Drivers who have held a license for more than 10 years
    D: Active duty military personnel
  answer: B
  explanation: Alternate methods to renew will not be extended to Commercial driver
    license (CDL) holders, among other specific groups.
- id: 94
  category: penalties_and_points
  question: 'Under Administrative Suspensions and Revocations, your license may be
    suspended for repeated traffic violations if you have:'
  choices:
    A: Two or more traffic convictions within any 12-month period
    B: Three or more traffic convictions within any 24-month period
    C: Four or more traffic convictions occurring separately within any 12-month period
    D: Five or more traffic convictions within any 24-month period
  answer: C
  explanation: DPS has the authority to suspend or revoke a license for repeated violations
    of traffic laws, including four or more traffic convictions occurring separately
    within any 12-month period.
- id: 95
  category: license_system
  question: If you are returning to Texas from military service and your license has
    been expired for over two years, how long do you have after being honorably discharged
    to renew without taking the knowledge and driving exams?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Within 90 days of being honorably discharged, military personnel returning
    from active duty can present separation papers to obtain a renewal without taking
    the exams when the license has been expired for over two years.
- id: 96
  category: penalties_and_points
  question: Which of the following offenses will result in an automatic suspension
    of driving privileges for individuals under 21 years of age?
  choices:
    A: Failure to complete a tobacco awareness class when required
    B: Parking in a loading zone
    C: Driving with an expired vehicle registration
    D: Failing to wear a seatbelt
  answer: A
  explanation: For individuals under 21, failure to complete a tobacco awareness class
    when required is a Health and Safety Code Violation that will result in automatic
    suspension of the driving privilege.
- id: 97
  category: license_system
  question: What must you do to change information on your driver license other than
    your address?
  choices:
    A: Mail a completed DL-64 form
    B: Visit a driver license office
    C: Call the DPS hotline
    D: Update it through the online portal
  answer: B
  explanation: 'The manual states: ''To change any other information on your driver
    license or ID card, you will need to visit a driver license office.'''
- id: 98
  category: license_system
  question: What is the purpose of a restriction placed on your driver license?
  choices:
    A: To punish you for past traffic violations
    B: To increase the cost of your auto insurance
    C: To make you a safer driver
    D: To limit the number of passengers you can carry
  answer: C
  explanation: A restriction may be placed on your license. This is not meant to interfere
    with your driving but to make you a safer driver.
- id: 99
  category: penalties_and_points
  question: What is the reinstatement fee required for a Drug Education Course suspension?
  choices:
    A: $10
    B: $50
    C: $100
    D: $125
  answer: C
  explanation: The manual notes that there is a $100 reinstatement fee for a Drug
    Education Course.
- id: 100
  category: license_system
  question: If an eligible out-of-state Texas licensee renews by mail, how long is
    the renewed license valid once they return to Texas?
  choices:
    A: Until 30 days after returning to Texas
    B: Until 60 days after returning to Texas
    C: Until 90 days after returning to Texas or the expiration date, whichever comes
      first
    D: Until 180 days after returning to Texas
  answer: C
  explanation: For out-of-state Texas licensees renewing by mail, the license will
    be renewed and valid to the expiration date shown or until 90 days after your
    return to Texas, whichever comes first.
- id: 101
  category: penalties_and_points
  question: Which of the following is considered a reason for an Administrative Suspension
    or Revocation rather than an automatic Mandatory Suspension?
  choices:
    A: Driving while intoxicated (DWI) by use of alcohol or drugs
    B: Intoxication manslaughter or intoxication assault
    C: Causing a serious crash while driving a motor vehicle
    D: Overtaking and passing a school bus (subsequent conviction)
  answer: C
  explanation: Causing a serious crash while driving a motor vehicle is listed under
    Administrative Suspensions and Revocations, whereas DWI, intoxication manslaughter,
    and passing a school bus are Mandatory Suspensions.
- id: 102
  category: alcohol_drugs_health
  question: 'Under the Administrative License Revocation (ALR) law, DPS is authorized
    to suspend the license of an individual over 21 years of age who fails a breath
    or blood test indicating a blood alcohol content (BAC) of at least:'
  choices:
    A: '0.02'
    B: '0.04'
    C: '0.08'
    D: '0.10'
  answer: C
  explanation: DPS is authorized to suspend a license for individuals over 21 who
    fail a breath or blood test indicating a BAC level of 0.08 or more.
- id: 103
  category: alcohol_drugs_health
  question: For individuals under 21 years of age, DPS is authorized to suspend a
    license or driving privilege for what amount of alcohol under the ALR law?
  choices:
    A: A BAC of 0.08 or more
    B: A BAC of 0.04 or more
    C: A BAC of 0.02 or more
    D: Any detectable amount of alcohol
  answer: D
  explanation: DPS is authorized to suspend the license of individuals under 21 years
    of age for any detectable amount of alcohol.
- id: 104
  category: license_system
  question: Which of the following situations requires the cancellation of a driver
    license or ID card?
  choices:
    A: Receiving a single speeding ticket
    B: Incomplete driver education
    C: Parking in a handicapped zone without a permit
    D: Failing to wear a seatbelt
  answer: B
  explanation: Cases that require cancellation of a driver license or ID card include
    incomplete driver education, false statements on an application, and parental
    authorization withdrawn for minors.
- id: 105
  category: penalties_and_points
  question: Upon receipt of a court order, DPS will suspend, revoke, or cancel a license
    or driving privilege for which of the following reasons?
  choices:
    A: Delinquent child support
    B: Accumulating two parking tickets
    C: Driving 5 mph over the speed limit
    D: Failing to yield right-of-way at a yield sign
  answer: A
  explanation: Upon receipt of a court order, DPS will suspend, revoke, or cancel
    a license for delinquent child support, among other reasons like being mentally
    incapacitated or chemically dependent.
- id: 106
  category: penalties_and_points
  question: What is the penalty for a first offense of driving a motor vehicle while
    your driver license is suspended, cancelled, denied, or revoked (DWLI) without
    any aggravating factors?
  choices:
    A: Class A misdemeanor, punishable by up to a $4,000 fine
    B: Class B misdemeanor, punishable by up to a $2,000 fine
    C: Class C misdemeanor, punishable by a fine of up to $500
    D: A fine of $125 and 10 hours of community service
  answer: C
  explanation: Driving while a license is suspended, cancelled, denied, or revoked
    is a Class C misdemeanor, punishable by a fine of up to $500.
- id: 107
  category: penalties_and_points
  question: 'Driving While License Invalid (DWLI) becomes a Class A misdemeanor punishable
    by a fine up to $4,000 and/or up to 365 days in jail if the person was operating
    without insurance and:'
  choices:
    A: Was caught speeding more than 20 mph over the limit
    B: Caused a crash which resulted in serious bodily injury or death of another
    C: Refused to submit to a breathalyzer test
    D: Had a previous conviction for the exact same offense
  answer: B
  explanation: DWLI is a Class A misdemeanor if the person was operating without insurance
    at the time of the offense and caused a crash which resulted in serious bodily
    injury or death of another.
- id: 108
  category: alcohol_drugs_health
  question: For a first offense non-driving alcohol-related violation by a minor,
    how long will their driver license be suspended (or privilege denied)?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: A
  explanation: For a 1st offense non-driving alcohol-related violation by a minor,
    the driver license will be suspended (or privilege denied if not licensed) for
    30 days.
- id: 109
  category: penalties_and_points
  question: What is the penalty for a 3rd offense non-driving alcohol-related violation
    for a minor who is at least 17 years of age but less than 21?
  choices:
    A: Class C misdemeanor with a 30-day suspension
    B: Class C misdemeanor with a 60-day suspension
    C: Class B misdemeanor punishable by a fine of $250 to $2,000 and a 180-day suspension
    D: Class A misdemeanor punishable by up to a $4,000 fine and a 365-day suspension
  answer: C
  explanation: A 3rd offense for a minor at least 17 but less than 21 is a Class B
    misdemeanor punishable by a fine of $250 to $2,000, and the driver license will
    be suspended for 180 days.
- id: 110
  category: penalties_and_points
  question: What is the penalty for a person who purchases, furnishes, or sells an
    alcoholic beverage to a minor?
  choices:
    A: A fine of up to $500 and 20 hours of community service
    B: A fine of up to $2,000 and/or confinement in jail for up to 180 days
    C: A fine of up to $4,000 and/or confinement in jail for up to one year
    D: A mandatory 180-day driver license suspension
  answer: C
  explanation: A person who purchases, furnishes, or sells an alcoholic beverage to
    a minor is subject to a fine of up to $4,000 and/or confinement in jail for up
    to one year.
- id: 111
  category: license_system
  question: What is an occupational license (also called an essential need license)?
  choices:
    A: A license issued exclusively to commercial truck drivers
    B: A special restricted license for individuals whose license has been suspended
      or revoked but who can prove an essential need to drive
    C: A license that allows minors to drive to and from school
    D: A temporary permit issued while waiting for a permanent ID card in the mail
  answer: B
  explanation: An occupational license is a special type of restricted license issued
    to individuals whose driver license has been canceled, suspended, revoked, or
    denied, and who can prove to a court there is an essential need to drive.
- id: 112
  category: license_system
  question: What is the fee for an occupational license if it is authorized for one
    year?
  choices:
    A: $10
    B: $20
    C: $50
    D: $125
  answer: A
  explanation: The fee for an occupational license is $10 for one year or $20 if authorized
    for two years.
- id: 113
  category: license_system
  question: How long may the court order for an occupational license be used for driving
    purposes while the official license is being processed?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: C
  explanation: The court order may be used for 45 days for driving purposes while
    the occupational license is being processed.
- id: 114
  category: license_system
  question: Which type of vehicle may NOT be driven with an occupational license?
  choices:
    A: A passenger car
    B: A pickup truck
    C: A commercial motor vehicle
    D: A sports utility vehicle
  answer: C
  explanation: The manual states that an occupational license may not be issued to
    drive a commercial motor vehicle.
- id: 115
  category: license_system
  question: DPS is authorized to deny the issuance of a driver license to an applicant
    for which of the following reasons?
  choices:
    A: Acquiring motor vehicle fuel without payment
    B: Receiving a single parking violation
    C: Failing to register to vote
    D: Having out-of-state vehicle insurance
  answer: A
  explanation: An applicant may be denied a driver license for acquiring motor vehicle
    fuel without payment, among other reasons like delinquent child support or certain
    criminal mischief.
- id: 116
  category: vehicle_information
  question: For registration purposes, how long is a passing Vehicle Inspection Report
    (VIR) valid?
  choices:
    A: 30 days from the month of inspection
    B: 60 days from the month of inspection
    C: 90 days from the month of inspection
    D: 1 year from the month of inspection
  answer: C
  explanation: The VIR is only valid for 90 days from the month of inspection for
    registration purposes.
- id: 117
  category: vehicle_information
  question: A vehicle's foot brake must be able to stop the car within a distance
    of 25 feet when traveling at what speed?
  choices:
    A: 10 mph
    B: 20 mph
    C: 30 mph
    D: 40 mph
  answer: B
  explanation: The foot brake must stop the car within a distance of 25 feet at a
    speed of 20 mph.
- id: 118
  category: vehicle_information
  question: 'A vehicle''s horn must be capable of being heard for a minimum distance
    of:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Horns must be heard for a minimum distance of 200 feet.
- id: 119
  category: vehicle_information
  question: What is the minimum required tread depth for tires on a vehicle?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 3/32 of an inch
    D: 4/32 of an inch
  answer: B
  explanation: All vehicles are required to have tires in proper and safe condition
    with a minimum depth of 2/32 of an inch.
- id: 120
  category: signs_and_signals
  question: A slow-moving vehicle emblem must be displayed on certain vehicles, such
    as farm tractors, that are assigned to travel at or below what speed?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: Farm tractors and machinery, road construction machinery, animal-drawn
    vehicles and certain other motor vehicles assigned to travel at 25 mph or less
    must display the slow-moving vehicle emblem.
- id: 121
  category: vehicle_information
  question: It is illegal to have anything extending more than how many inches beyond
    the left side of your car's body, running board, or fenders?
  choices:
    A: 2 inches
    B: 3 inches
    C: 5 inches
    D: 6 inches
  answer: B
  explanation: You must not have anything extending more than three inches beyond
    the left side or six inches beyond the right side of the body, running board,
    or fenders of your car.
- id: 122
  category: vehicle_information
  question: Which of the following is considered unsafe and is NOT allowed on a standard
    passenger vehicle?
  choices:
    A: A red light showing from the front
    B: A white license plate light
    C: Amber parking lights on the front
    D: Two backup lights
  answer: A
  explanation: A red light showing from the front is considered unsafe and is not
    allowed except on an emergency vehicle.
- id: 123
  category: vehicle_information
  question: What is the state requirement regarding minimum road clearance for a modified
    vehicle?
  choices:
    A: The body must be at least 6 inches above the ground.
    B: The body must not be below the lowest part of the wheel rims.
    C: The vehicle must have at least 10 inches of clearance.
    D: The bumpers must be at least 16 inches from the road surface.
  answer: B
  explanation: A vehicle must not be modified or weighted in such a manner where the
    body is below the lowest part of the rims of the wheels.
- id: 124
  category: safe_driving_rules
  question: When is it illegal to use your vehicle's backup lights?
  choices:
    A: When parking in a dark area
    B: When the vehicle is in forward motion
    C: When backing out of a driveway
    D: When warning of unusual traffic hazards
  answer: B
  explanation: Two backup lights are permitted separately or in combination with other
    lights, but you must not use them when the vehicle is in forward motion.
- id: 125
  category: license_system
  question: How many days does an owner have to register a newly purchased vehicle?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: An owner must register a newly purchased vehicle within 30 days of
    purchase.
- id: 126
  category: license_system
  question: How long are buyers' temporary tags recognized as valid?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: Buyers' temporary tags are recognized for 60 days.
- id: 127
  category: vehicle_information
  question: 'A vehicle''s rearview mirror must be able to reflect a view of the highway
    for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: A rearview mirror must be able to reflect a view of the highway for
    a distance of at least 200 feet to the rear of the vehicle.
- id: 128
  category: vehicle_information
  question: At what height must the two red reflectors on the rear of a vehicle be
    placed?
  choices:
    A: 10 to 40 inches
    B: 15 to 60 inches
    C: 20 to 70 inches
    D: 24 to 80 inches
  answer: B
  explanation: Reflectors must be placed at a height of 15 to 60 inches and be visible
    up to 600 feet.
- id: 129
  category: vehicle_information
  question: Which of the following devices is strictly prohibited on your vehicle?
  choices:
    A: A radar interference device
    B: A GPS navigation system
    C: A dashboard camera
    D: A hands-free communication device
  answer: A
  explanation: A radar interference device designed, manufactured, used, or intended
    to be used to interfere with, scramble, disrupt, or cause to malfunction a radar
    or laser device used to measure a vehicle's speed is not allowed.
- id: 130
  category: vehicle_information
  question: For which of the following purposes may a farm registered vehicle NOT
    be used?
  choices:
    A: Attending church or school
    B: Visiting doctors for medical treatment
    C: Gainful employment
    D: Transporting family members for home necessities
  answer: C
  explanation: The manual states that farm registered vehicles may be used for family
    necessities like church, school, or medical visits, but they may not be used for
    gainful employment.
- id: 131
  category: vehicle_information
  question: Which of the following vehicles is NOT required to be registered or inspected
    when temporarily operated on highways?
  choices:
    A: Passenger cars
    B: Power sweepers
    C: Commercial delivery trucks
    D: Motorcycles
  answer: B
  explanation: Power sweepers are included in the list of vehicles that are not required
    to be registered, inspected, or display a license plate when temporarily operated
    on highways.
- id: 132
  category: license_system
  question: How many days does a nonresident have to register their vehicle in Texas
    after establishing residency or entering into gainful employment?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: When a nonresident establishes residency in Texas or enters into gainful
    employment, his/her vehicle may be operated for 30 days. After 30 days, the vehicle
    must be registered in Texas.
- id: 133
  category: license_system
  question: What must a new Texas resident do before applying for a Texas driver license?
  choices:
    A: Register every vehicle he/she owns
    B: Surrender their out-of-state license plates
    C: Complete a defensive driving course
    D: Pay a $55,000 deposit to the state comptroller
  answer: A
  explanation: A new Texas resident must register every vehicle he/she owns before
    applying for a Texas driver license.
- id: 134
  category: driver_responsibility
  question: What is the minimum amount of liability insurance required against property
    damage in Texas?
  choices:
    A: $15,000
    B: $25,000
    C: $30,000
    D: $60,000
  answer: B
  explanation: As of January 1, 2011, the minimum amount of liability insurance includes
    $25,000 against property damage.
- id: 135
  category: driver_responsibility
  question: Under the Texas Motor Vehicle Safety Responsibility Act, what is the minimum
    liability insurance required against injury or death of two or more individuals?
  choices:
    A: $25,000
    B: $30,000
    C: $50,000
    D: $60,000
  answer: D
  explanation: The minimum amount of liability insurance includes $60,000 against
    injury or death of two or more individuals.
- id: 136
  category: driver_responsibility
  question: Which of the following is an acceptable form of evidence of financial
    responsibility in Texas?
  choices:
    A: A verbal promise to pay for damages
    B: A certificate showing a $55,000 deposit with the state comptroller
    C: A valid Texas driver license
    D: A vehicle inspection report
  answer: B
  explanation: Accepted evidence of financial responsibility includes a certificate
    issued by the state comptroller showing the owner has on deposit money or securities
    for at least $55,000.
- id: 137
  category: penalties_and_points
  question: If a driver receives a second conviction for driving without evidence
    of financial responsibility, how long will their vehicle be impounded?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: D
  explanation: For a 2nd and subsequent conviction, the vehicle driven or operated
    by the person shall be impounded for 180 days, provided the defendant was an owner
    at the time of the offense and conviction.
- id: 138
  category: driver_responsibility
  question: A driver's license or driving privilege will be suspended if a judgment
    resulting from a crash has not been satisfied within how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: The vehicle registration, license or driving privilege of a driver
    will be suspended if a judgment resulting from a crash has not been satisfied
    within 60 days of the judgment.
- id: 139
  category: safe_driving_rules
  question: When driving on an unpaved road that intersects with a paved road, what
    must you do?
  choices:
    A: Yield the right-of-way to vehicles traveling on the paved road
    B: Take the right-of-way if you arrive first
    C: Yield only to vehicles approaching from the right
    D: Stop and wait for a signal from other drivers
  answer: A
  explanation: If you are driving on an unpaved road that intersects with a paved
    road, you must yield the right-of-way to vehicles traveling on the paved road.
- id: 140
  category: safe_driving_rules
  question: If you are driving on a single or two-lane road that intersects with a
    divided road or a road with three or more lanes, who has the right-of-way?
  choices:
    A: The vehicle on the single or two-lane road
    B: The vehicle that arrives at the intersection first
    C: Vehicles traveling on the divided or three or more lane road
    D: The vehicle approaching from the left
  answer: C
  explanation: You must yield the right-of-way to vehicles traveling on the divided
    or three (3) or more lane road when intersecting from a single or two-lane road.
- id: 141
  category: safe_driving_rules
  question: When approaching an intersection not controlled by signs, signals, multi-lanes,
    or pavement, to which vehicle must you yield the right-of-way?
  choices:
    A: Any vehicle approaching on your left
    B: Any vehicle approaching on your right
    C: The largest vehicle at the intersection
    D: The vehicle traveling at the highest speed
  answer: B
  explanation: When approaching this type of intersection, yield the right-of-way
    to any vehicle that has entered or is approaching the intersection on your right.
- id: 142
  category: safe_driving_rules
  question: What must you do when entering a street from a private road, alley, or
    driveway?
  choices:
    A: Sound your horn and proceed without stopping
    B: Stop prior to the sidewalk and yield to all approaching vehicles and pedestrians
    C: Yield only to vehicles, as pedestrians must yield to you
    D: Accelerate quickly to merge into traffic
  answer: B
  explanation: When entering or crossing a road, street, or highway from a private
    road, alley, building, or driveway, you must stop prior to the sidewalk and yield
    the right-of-way to all approaching vehicles and pedestrians.
- id: 143
  category: penalties_and_points
  question: What is the penalty if a driver fails to yield the right-of-way and causes
    serious bodily injury to another person?
  choices:
    A: A fine of $175 to $350
    B: A fine of $500 to $2,000
    C: A fine of $1,000 to $4,000
    D: A fine of $5,000 and license revocation
  answer: C
  explanation: If a driver commits a traffic offense of failing to yield the right-of-way
    and causes serious bodily injury to another, the penalty is a fine of $1,000 to
    $4,000.
- id: 144
  category: safe_driving_rules
  question: 'When approaching a T-intersection from a street that ends at the intersection,
    you must:'
  choices:
    A: Maintain your speed and merge into the right lane.
    B: Stop and yield the right-of-way to vehicles on the through street.
    C: Yield only if there is a posted stop or yield sign.
    D: Take the right-of-way if you are turning right.
  answer: B
  explanation: When approaching an intersection of a through street traveling from
    a street that ends at the intersection, you must stop and yield the right-of-way
    to vehicles on the through street.
- id: 145
  category: sharing_the_road
  question: On a road divided into three or more lanes with traffic moving in the
    same direction, if a vehicle entering a lane from the right meets a vehicle entering
    the same lane from the left, who must yield?
  choices:
    A: The vehicle entering from the right must yield the right-of-way.
    B: The vehicle entering from the left must yield the right-of-way.
    C: Both vehicles must stop and wait for the other to proceed.
    D: The vehicle traveling at the faster speed has the right-of-way.
  answer: A
  explanation: On a road divided into three or more lanes, a vehicle entering a lane
    of traffic from the right must yield the right-of-way to a vehicle entering the
    same lane of traffic from the left.
- id: 146
  category: safe_driving_rules
  question: When approaching a railroad grade crossing where a train is approaching,
    at what distance must you stop your vehicle?
  choices:
    A: Between 10 and 30 feet from the nearest rail.
    B: Between 15 and 50 feet from the nearest rail.
    C: Exactly 20 feet from the nearest rail.
    D: At least 100 feet from the nearest rail.
  answer: B
  explanation: When approaching a railroad grade crossing, you must stop between 15
    and 50 feet from the nearest rail if a train is approaching, a signal warns of
    a train, or a crossing gate is lowered.
- id: 147
  category: penalties_and_points
  question: What is the fine for failing to obey the law regarding railroad grade
    crossings?
  choices:
    A: $50 to $200
    B: $100 to $500
    C: $200 to $1,000
    D: $500 to $1,250
  answer: A
  explanation: A person who fails to obey the law regarding railroad grade crossings
    is subject to a fine of $50 to $200.
- id: 148
  category: defensive_driving
  question: If your car stalls on railroad tracks and a train is approaching, what
    is the safest course of action?
  choices:
    A: Stay in the vehicle, buckle your seatbelt, and call 911 immediately.
    B: Get out and run straight down the tracks away from the train.
    C: Get out quickly and run toward the approaching train to the side of the tracks.
    D: Try to restart the car until the train is within 500 feet, then exit.
  answer: C
  explanation: If a train is approaching and your vehicle is stalled, get out quickly
    and move away from the tracks. Run toward the approaching train to the side of
    the tracks and avoid flying debris.
- id: 149
  category: sharing_the_road
  question: You are not allowed to follow within how many feet of a fire truck answering
    an alarm or an ambulance when its flashing red lights are on?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You are not allowed to follow within 500 feet of a fire truck answering
    an alarm or an ambulance when the flashing red lights are on.
- id: 150
  category: safe_driving_rules
  question: 'If you approach a stopped emergency vehicle with its lights activated
    on a highway with a speed limit of 45 mph, and you cannot vacate the closest lane,
    you must:'
  choices:
    A: Slow to a speed of 25 mph or less.
    B: Slow to a speed of 15 mph or less.
    C: Slow to a speed of 5 mph or less.
    D: Maintain your speed but proceed with extreme caution.
  answer: A
  explanation: If you cannot vacate the lane closest to the emergency vehicle, you
    must slow to a speed not more than 20 mph less than the posted speed limit when
    the posted speed limit is 25 mph or more. (45 mph - 20 mph = 25 mph).
- id: 151
  category: sharing_the_road
  question: 'When you approach a school bus displaying alternately flashing red lights,
    you must stop and may NOT pass until:'
  choices:
    A: The children have safely crossed the street and reached the sidewalk.
    B: You have waited for at least 60 seconds.
    C: The bus has resumed motion, the driver signals you to proceed, or the red lights
      stop flashing.
    D: The bus driver turns on the yellow hazard lights.
  answer: C
  explanation: 'Do not pass the school bus until: 1. The school bus has resumed motion;
    2. You are signaled by the driver to proceed; or 3. The red lights are no longer
    flashing.'
- id: 152
  category: safe_driving_rules
  question: In which of the following situations are you NOT required to stop for
    a school bus?
  choices:
    A: When you are traveling in the opposite direction on a two-lane road.
    B: When you are on a different road or a controlled-access highway where the bus
      is in a loading zone and pedestrians aren't permitted to cross.
    C: When you are driving a commercial vehicle or an emergency vehicle.
    D: When the bus is stopped at a railroad crossing with its hazard lights on.
  answer: B
  explanation: It is not necessary to stop when passing a school bus on a different
    road or when on a controlled-access highway where the bus is stopped in a loading
    zone and pedestrians aren’t permitted to cross.
- id: 153
  category: penalties_and_points
  question: What is the penalty for a first conviction of failing to yield the right-of-way
    to a school bus?
  choices:
    A: A fine of $50 to $200.
    B: A fine of $200 to $500.
    C: A fine of $500 to $1,250.
    D: A fine of $1,000 to $2,000.
  answer: C
  explanation: According to Table 15, the penalty for a 1st conviction of failing
    to yield the right-of-way to a school bus is a fine of $500 - $1,250.
- id: 154
  category: sharing_the_road
  question: If a traffic light changes to green while a pedestrian is still in the
    crosswalk, what should you do?
  choices:
    A: Sound your horn to warn the pedestrian to hurry.
    B: Proceed carefully around the pedestrian.
    C: Give the pedestrian the right-of-way to finish crossing.
    D: The pedestrian must immediately turn back to the sidewalk.
  answer: C
  explanation: If the light changes after the pedestrian has entered the crosswalk,
    still give the pedestrian the right-of-way.
- id: 155
  category: signs_and_signals
  question: Where are 'In-Street Pedestrian Crossing' signs placed?
  choices:
    A: On the left- or right-hand side of the road.
    B: Over the roadway at the crosswalk.
    C: In the road at the crosswalk location on the center line, on a lane line, or
      on a median island.
    D: 500 feet before the crosswalk on the right shoulder.
  answer: C
  explanation: The 'In-Street Pedestrian Crossing' signs are placed in the road at
    the crosswalk location on the center line, on a lane line, or on a median island.
    They will not be posted on the left- or right-hand side of the road.
- id: 156
  category: signs_and_signals
  question: What information is provided on the blue and white Emergency Notification
    System (ENS) sign at a railroad crossing?
  choices:
    A: The train schedule and maximum speed limit.
    B: The railroad's emergency contact number and the USDOT National Crossing Inventory
      Number.
    C: The distance to the nearest hospital and police station.
    D: The fine amount for stopping on the tracks.
  answer: B
  explanation: The ENS sign includes the railroad's emergency contact number and the
    U.S. Department of Transportation (USDOT) National Crossing Inventory Number,
    which identifies the exact location.
- id: 157
  category: signs_and_signals
  question: What is the purpose of in-roadway lights?
  choices:
    A: To illuminate the highway during severe power outages.
    B: To warn roadway users they are approaching a condition on or near the road
      that might require them to slow down or stop.
    C: To indicate the speed limit in a school zone during active hours.
    D: To guide emergency vehicles to the scene of an accident.
  answer: B
  explanation: In-roadway lights are special types of lights installed in the roadway
    surface to warn roadway users they are approaching a condition on or near the
    road they may not see, which might require them to slow down or come to a complete
    stop.
- id: 158
  category: signs_and_signals
  question: What must you do when approaching a steady red light at an intersection?
  choices:
    A: Stop only if pedestrians are present.
    B: Stop before entering the crosswalk or intersection.
    C: Slow down and proceed with caution.
    D: Yield to traffic on the right and proceed.
  answer: B
  explanation: 'The manual states for a Steady Red Light (Stop): "Stop before entering
    the crosswalk or intersection."'
- id: 159
  category: safe_driving_rules
  question: If a law enforcement officer is directing traffic and tells you to do
    something ordinarily considered against the law, what should you do?
  choices:
    A: Obey the traffic signals instead of the officer.
    B: Ask the officer for clarification before proceeding.
    C: Obey the law enforcement officer at all times.
    D: Pull over and wait for the officer to leave.
  answer: C
  explanation: 'The manual states: "You must obey a law enforcement officer at all
    times when they are directing traffic even if he/she is telling you to do something
    which is ordinarily considered against the law."'
- id: 160
  category: signs_and_signals
  question: What does a flashing yellow arrow for left-turns indicate?
  choices:
    A: You have the right-of-way to turn left.
    B: You are not allowed to turn left.
    C: You may turn left, but must yield the right-of-way to oncoming traffic.
    D: You must stop completely before turning left.
  answer: C
  explanation: According to the manual, "A flashing yellow arrow allows a driver to
    turn left, but the driver must yield the right-of-way to oncoming traffic."
- id: 161
  category: signs_and_signals
  question: What does a brown traffic sign indicate?
  choices:
    A: Motorist services guidance
    B: Public recreation and scenic guidance
    C: Construction and maintenance warning
    D: General warning or caution
  answer: B
  explanation: The Standard Colors table describes brown signs as indicating "Public
    recreation and scenic guidance."
- id: 162
  category: signs_and_signals
  question: Which sign shape is used exclusively to warn of existing or possible hazards
    on roads or adjacent areas?
  choices:
    A: Diamond
    B: Pentagon
    C: Pennant
    D: Round
  answer: A
  explanation: The Signs by Shape table states that a Diamond shape is "Exclusively
    to warn of existing or possible hazards on roads or adjacent areas."
- id: 163
  category: signs_and_signals
  question: What type of sign is shaped like a pennant?
  choices:
    A: School advance warning
    B: Yield sign
    C: Advance warning of no pass zones
    D: Railroad advance warning
  answer: C
  explanation: The Signs by Shape table indicates that a Pennant shape is used for
    "Advance warning of no pass zones."
- id: 164
  category: signs_and_signals
  question: When you encounter a warning sign, what is one of the actions you must
    take?
  choices:
    A: Stop immediately
    B: Reduce speed to at least the posted speed signs
    C: Honk your horn to alert others
    D: Pull over to the shoulder
  answer: B
  explanation: 'The manual states that when you encounter a warning sign, you must:
    "1. Pay attention 2. Follow instructions 3. Reduce speed to at least the posted
    speed signs."'
- id: 165
  category: defensive_driving
  question: When driving on a wet road and approaching a sign warning you to slow
    down, what actions should you avoid?
  choices:
    A: Using your windshield wipers
    B: Suddenly turning, speeding up, or stopping
    C: Checking your rearview mirror
    D: Driving in the right-hand lane
  answer: B
  explanation: 'The description for the wet road warning sign advises: "Slow down
    on wet road. Do not suddenly turn, speed up, or stop."'
- id: 166
  category: defensive_driving
  question: How should you drive when you see a warning sign indicating the road surface
    is covered with loose gravel?
  choices:
    A: Speed up to maintain traction
    B: Apply brakes suddenly if you start to slide
    C: Go slow enough to keep complete control and do not make sharp turns
    D: Shift into neutral gear
  answer: C
  explanation: 'The manual states for loose gravel: "Go slow enough to keep complete
    control of your vehicle. Do not apply brakes suddenly or make sharp turns."'
- id: 167
  category: safe_driving_rules
  question: Why must you use extreme caution to avoid running off the paved portion
    of the highway when a soft shoulder sign is present?
  choices:
    A: The dirt on the side of the pavement is soft and may cause you to lose control.
    B: There are hidden ditches that will damage your tires.
    C: Pedestrians frequently walk on soft shoulders.
    D: It is illegal to drive on the shoulder under any circumstances.
  answer: A
  explanation: The manual explains that for a soft shoulder, you should "Use extreme
    caution to avoid running off the paved portion of the highway, because the dirt
    on the side of the pavement is soft and may cause you to lose control of the car."
- id: 168
  category: sharing_the_road
  question: Why is pavement sometimes grooved, and who should be especially cautious
    when encountering it?
  choices:
    A: To reduce noise; large trucks should use caution.
    B: To lessen the possibility of slippery pavement in wet weather; motorcyclists
      should use caution.
    C: To slow down speeding vehicles; sports cars should use caution.
    D: To mark pedestrian crossings; bicyclists should use caution.
  answer: B
  explanation: 'The manual states: "The pavement has been grooved to lessen the possibility
    of slippery pavement in wet weather. Motorcyclists should use caution."'
- id: 169
  category: vehicle_information
  question: What action may be necessary when you see a warning sign indicating you
    are approaching a downgrade?
  choices:
    A: Shift into a higher gear to save fuel.
    B: Turn off your engine to prevent overheating.
    C: Use a lower gear to slow your vehicle.
    D: Apply the parking brake lightly.
  answer: C
  explanation: 'The manual advises for a downgrade: "You are approaching a downgrade;
    all drivers approach with caution. It may be necessary to use a lower gear to
    slow your vehicle."'
- id: 170
  category: signs_and_signals
  question: What does it mean if a green arrow is displayed at the same time as a
    red light?
  choices:
    A: You must stop and wait for a solid green light before turning.
    B: You can proceed carefully in the direction of the arrow after yielding the
      right-of-way to other vehicles and pedestrians.
    C: The traffic signal is malfunctioning and should be treated as a four-way stop.
    D: You may only proceed straight ahead, but cannot turn.
  answer: B
  explanation: 'The manual states: "A green arrow displayed at the same time as a
    red light means the driver can proceed carefully in the direction of the arrow
    after yielding the right-of-way to other vehicles and pedestrians."'
- id: 171
  category: signs_and_signals
  question: Which shape is used exclusively for stop signs?
  choices:
    A: Pentagon
    B: Octagon
    C: Equilateral Triangle
    D: Vertical Rectangle
  answer: B
  explanation: The Signs by Shape table lists "Octagon" with the description "Exclusively
    for stop signs."
- id: 172
  category: safe_driving_rules
  question: When you see a warning sign indicating that two roads come together and
    an additional lane begins, what are you required to do?
  choices:
    A: You must merge immediately into the left lane.
    B: You must come to a complete stop before entering the new lane.
    C: You are not required to merge, but you should watch for traffic in the new
      lane.
    D: You must yield the right-of-way to all vehicles in the adjacent lane.
  answer: C
  explanation: 'The manual describes the added lane sign: "You are approaching a point
    where two roads come together and an additional lane begins. You are not required
    to merge. Watch for traffic in the new lane."'
- id: 173
  category: safe_driving_rules
  question: On a roadway with multiple lanes traveling in the same direction, what
    is the farthest left lane intended for?
  choices:
    A: Slower traffic
    B: Passing only
    C: Emergency stopping
    D: Carpools only
  answer: B
  explanation: According to the manual, on roadways with more than one lane with vehicles
    traveling in the same direction, slower traffic should travel in a lane other
    than the farthest left lane. The farthest left lane is for passing only.
- id: 174
  category: safe_driving_rules
  question: When is it permissible to use the center turn lane for passing other vehicles?
  choices:
    A: When traffic is moving below the posted speed limit
    B: During daylight hours only
    C: When the right lane is blocked by construction
    D: It should never be used for passing
  answer: D
  explanation: The manual states that the center lane is only used for vehicles turning
    left, and should never be used for passing or moving through traffic.
- id: 175
  category: safe_driving_rules
  question: When required to stop at a railroad crossing, what is the correct stopping
    distance from the nearest rail?
  choices:
    A: Within 5 to 10 feet
    B: Within 15 to 50 feet
    C: Within 50 to 100 feet
    D: At least 100 feet away
  answer: B
  explanation: At railroad crossings, you must stop within 15 feet to 50 feet of the
    nearest rail when directed by a flag person, when there are flashing red lights,
    or when a warning device tells you a train is coming.
- id: 176
  category: signs_and_signals
  question: What does a steady yellow 'X' on an overhead lane-use control signal indicate?
  choices:
    A: You are permitted to drive in the lane
    B: You must stop immediately in that lane
    C: You should prepare to safely vacate the lane
    D: The lane is reserved for left turns only
  answer: C
  explanation: A steady yellow X means a driver should prepare to safely vacate the
    lane over which the signal is located because a lane control change is being made.
- id: 177
  category: safe_driving_rules
  question: What restriction applies to the use of wireless communication devices
    in a school zone?
  choices:
    A: They may only be used with a hands-free accessory
    B: Their use is completely prohibited
    C: They may be used if driving under 15 mph
    D: They are permitted for texting but not calling
  answer: B
  explanation: The manual explicitly states that the use of a wireless communication
    device is prohibited in the school zone.
- id: 178
  category: safe_driving_rules
  question: If two vehicles arrive at an all-way stop intersection at the exact same
    time, who has the right-of-way?
  choices:
    A: The vehicle turning left
    B: The vehicle on the left
    C: The vehicle on the right
    D: The larger vehicle
  answer: C
  explanation: At an intersection where all approaching traffic must stop, if two
    vehicles arrive at the same time, you must yield to the vehicle on your right.
- id: 179
  category: safe_driving_rules
  question: For which of the following reasons is it acceptable to stop on the shoulder
    of the road?
  choices:
    A: To answer a phone call
    B: To rest if you are tired
    C: To check a map for directions
    D: For a mechanical breakdown or tire trouble
  answer: D
  explanation: The manual designates that the shoulder of the road should only be
    used by vehicles required to stop because of mechanical breakdown, tire trouble,
    lack of fuel, or other emergencies.
- id: 180
  category: signs_and_signals
  question: What does a double white line on the roadway indicate to drivers?
  choices:
    A: Drivers should not change lanes or turn across the lines
    B: The lane is ending and drivers must merge left
    C: Passing is permitted if the way is clear
    D: The road is changing from one-way to two-way traffic
  answer: A
  explanation: According to the manual, drivers should not change lanes or turn across
    double white lines.
- id: 181
  category: signs_and_signals
  question: What is the primary purpose of mileposts erected on interstate highways?
  choices:
    A: To indicate the current speed limit
    B: To identify the location of crashes or emergencies
    C: To show the distance to the next rest area
    D: To mark the boundary of a different county
  answer: B
  explanation: Mileposts provide a means of identifying the location of crashes, breakdowns,
    or other emergencies. They are erected every mile on interstate highways.
- id: 182
  category: signs_and_signals
  question: During what hours are High Occupancy Vehicle (HOV) preferential lanes
    restricted to buses and carpools according to the provided text?
  choices:
    A: 7 a.m. to 10 a.m., Monday through Friday
    B: 6 a.m. to 9 a.m., Monday through Friday
    C: 3 p.m. to 6 p.m., Monday through Friday
    D: 24 hours a day, seven days a week
  answer: B
  explanation: The manual states that buses and vehicles used for carpools may use
    the HOV lane only between the hours of 6 a.m. to 9 a.m., Monday through Friday.
- id: 183
  category: signs_and_signals
  question: When approaching a stop sign, which of the following actions is required?
  choices:
    A: Slow down to 5 mph and proceed if the intersection is clear
    B: Come to a complete stop before the crosswalk or intersection
    C: Yield only to vehicles approaching from the right
    D: Stop only if pedestrians are actively crossing
  answer: B
  explanation: The stop sign means come to a complete stop, yield to pedestrians or
    other vehicles, and then proceed carefully. Stop before the crosswalk, intersection,
    or stop sign. Slowing down is not adequate.
- id: 184
  category: signs_and_signals
  question: What does an Advisory Speed Sign placed before a curve indicate?
  choices:
    A: The minimum speed required on the highway
    B: The highest speed at which you can safely travel around the curve ahead
    C: The speed limit for commercial trucks only
    D: The speed at which you must enter the freeway
  answer: B
  explanation: An Advisory Speed Sign gives the highest speed which you can safely
    travel around the curve ahead.
- id: 185
  category: signs_and_signals
  question: What is the function of a ramp meter?
  choices:
    A: It weighs commercial vehicles entering the highway
    B: It directs motorists when to enter the freeway
    C: It measures the speed of vehicles on the exit ramp
    D: It counts the number of passengers in a carpool
  answer: B
  explanation: The ramp meter (red or green) directs motorists when to enter the freeway.
- id: 186
  category: safe_driving_rules
  question: On a multi-lane highway with four or more lanes, what does a double yellow
    line indicate?
  choices:
    A: You may cross to pass if the way is clear
    B: You are entering a school zone
    C: Do not cross the double yellow line to pass
    D: The lane is reserved for left turns only
  answer: C
  explanation: On a multi-lane highway (four or more lanes), you must not cross the
    double yellow line to pass. You should stay in your lane as much as possible.
- id: 187
  category: safe_driving_rules
  question: What is the proper use of a center lane on a multi-lane highway?
  choices:
    A: As a through-traffic lane for faster vehicles
    B: For passing slower vehicles on the left
    C: To slow down or stop in order to make a safe left turn
    D: For parking in emergency situations
  answer: C
  explanation: The center lane is at a point where the vehicle will have time to slow
    down or stop in order to make a safe left turn maneuver. It should never be used
    for passing or as a through-traffic lane.
- id: 188
  category: signs_and_signals
  question: What does a solid yellow line on your side of the road indicate?
  choices:
    A: A no-passing zone
    B: Passing is permitted if safe
    C: You are approaching a crosswalk
    D: The lane is ending
  answer: A
  explanation: A solid yellow line on your side of the road marks a 'no-passing zone.'
    Broken or dashed lines permit you to pass or change lanes, if safe.
- id: 189
  category: signs_and_signals
  question: What is the rule regarding pavement markings consisting of double solid
    white lines?
  choices:
    A: Crossing is permitted with caution
    B: Crossing is prohibited
    C: They indicate a pedestrian crosswalk
    D: They mark a center left-turn lane
  answer: B
  explanation: According to the manual, crossing is prohibited where there is a pavement
    marking of double solid white lines.
- id: 190
  category: penalties_and_points
  question: What happens to traffic fines for violations that occur in construction
    zones?
  choices:
    A: They remain the same as normal violations
    B: They are reduced by half
    C: They double when workers are present
    D: They triple regardless of worker presence
  answer: C
  explanation: Traffic fines double for violations that occur in construction zones
    where workers are present anywhere in the construction zone.
- id: 191
  category: signs_and_signals
  question: When approaching a barricade or vertical panel, what do diagonal stripes
    sloping downward to the right indicate?
  choices:
    A: The road is completely closed
    B: The driver should bear to the left
    C: The driver should bear to the right
    D: There is a pedestrian crossing ahead
  answer: C
  explanation: Stripes sloping downward to the right means the driver should bear
    to the right to pass.
- id: 192
  category: safe_driving_rules
  question: What should you do if a flag person in a work zone instructs you to stop?
  choices:
    A: Stop in your lane and do not veer right or left
    B: Pull over to the right shoulder and stop
    C: Slowly roll forward until the flag person moves
    D: Honk your horn to acknowledge the instruction
  answer: A
  explanation: When instructed to stop by a flag person, you must do so in your lane
    and do not veer right or left. You must not attempt to go forward until instructed
    to do so.
- id: 193
  category: penalties_and_points
  question: What is the penalty for driving around a barricade where water is over
    any portion of a road, street, or highway?
  choices:
    A: A fine of $1 to $200
    B: A Class C misdemeanor with no jail time
    C: A Class B misdemeanor punishable by a fine up to $2,000 and/or up to 180 days
      in jail
    D: Immediate license suspension for one year
  answer: C
  explanation: The offense is a Class B misdemeanor punishable by a fine of up to
    $2,000 and/or up to 180 days in jail when a warning sign or barricade has been
    placed at a location where water is over any portion of a road, street, or highway.
- id: 194
  category: vehicle_information
  question: 'A slow-moving vehicle emblem is required for vehicles designed to operate
    at a maximum speed of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: Slow-moving vehicles are those designed to operate at a maximum speed
    of 25 mph or less, and the emblem is required for all such vehicles.
- id: 195
  category: safe_driving_rules
  question: How far in advance must you signal continuously before turning or stopping?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: You must signal continuously for at least 100 feet before turning or
    stopping, and be sure to turn off your signal lights once your turn is complete.
- id: 196
  category: safe_driving_rules
  question: You must never drive on the left side of the road to pass another vehicle
    when you are within how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Never drive on the left side of the road when within 100 feet of or
    crossing an intersection or railroad crossing.
- id: 197
  category: safe_driving_rules
  question: 'According to the manual, you must always signal your intentions in all
    of the following situations EXCEPT:'
  choices:
    A: Changing lanes
    B: Pulling away from a parking space parallel to the curb
    C: Driving straight through a green light
    D: Entering or leaving a highway
  answer: C
  explanation: You must always signal when changing lanes, making a turn, pulling
    away from a parallel parking space, slowing down or stopping, entering or leaving
    a highway, or pulling over to the side of the road. Driving straight does not
    require a signal.
- id: 198
  category: sharing_the_road
  question: What does a special flag on the back of a bicycle indicate to other drivers?
  choices:
    A: The bicyclist is carrying hazardous materials
    B: The bicyclist is a beginner
    C: The bicycle operator may be hearing impaired
    D: The bicycle is part of a race
  answer: C
  explanation: If you see this flag on the back of a bicycle, slow down, as the bicycle
    operator may be hearing impaired.
- id: 199
  category: signs_and_signals
  question: What is the basic color used for traffic control devices in construction
    and maintenance work zones?
  choices:
    A: Red
    B: Yellow
    C: Orange
    D: Green
  answer: C
  explanation: Orange is the basic color for construction and maintenance devices,
    such as signs, barricades, vertical panels, drums, cones, and tubes.
- id: 200
  category: safe_driving_rules
  question: 'You should always keep to the right side of the road EXCEPT when:'
  choices:
    A: Approaching a hill or curve
    B: Driving on a one-way street
    C: Within 100 feet of a bridge
    D: Approaching a railroad crossing
  answer: B
  explanation: Always keep to the right side of the road except when passing another
    vehicle on a two- or three-lane street, driving on a one-way street, or when the
    right side of the road is blocked.
- id: 201
  category: signs_and_signals
  question: What is the purpose of barrels installed in front of solid obstacles and
    in areas of high crash frequency?
  choices:
    A: To store emergency water supplies
    B: To act as an impact cushion and reduce the seriousness of crashes
    C: To mark pedestrian crosswalks
    D: To indicate a detour route
  answer: B
  explanation: Barrels that are engineered to act as an impact cushion reduce the
    seriousness of crashes. They are usually installed in front of a solid obstacle
    and in areas of high crash frequency.
- id: 202
  category: safe_driving_rules
  question: When passing on a two-lane road, you must return to the right lane before
    an approaching car comes within how many feet of you?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The manual states you must be sure you have enough time and space to
    overtake the car ahead and return to the right lane before an approaching car
    comes within 200 feet of you.
- id: 203
  category: safe_driving_rules
  question: Under which of the following conditions is it permissible to pass on the
    right using a paved shoulder?
  choices:
    A: When traffic is moving below the posted speed limit
    B: When the vehicle you are passing is preparing to make a left turn
    C: When you are driving on an unpaved country road
    D: When you want to bypass a stopped school bus
  answer: B
  explanation: You may pass on a paved shoulder when the vehicle you are passing is
    slowing or stopped on the main traveled portion of the highway, disabled, or preparing
    to make a left turn.
- id: 204
  category: defensive_driving
  question: What should you do when another vehicle is passing you?
  choices:
    A: Speed up to get out of their way quickly
    B: Move to the left to block them if they are speeding
    C: Do not increase your speed and stay in your lane
    D: Honk your horn to alert them of your presence
  answer: C
  explanation: When another vehicle is passing, you should not increase your speed,
    stay in your lane, and make it as safe and easy as possible for the other driver
    to pass you.
- id: 205
  category: defensive_driving
  question: If you cannot get into the proper lane within one-half block before a
    turn, what is the safest action to take?
  choices:
    A: Stop in your current lane and wait for traffic to clear
    B: Make the turn from your current lane as quickly as possible
    C: Do not turn, and continue straight ahead
    D: Reverse your vehicle until you can enter the proper lane
  answer: C
  explanation: The manual advises that if you cannot get into the proper lane within
    one-half block before turning, do not turn, and continue straight ahead.
- id: 206
  category: safe_driving_rules
  question: How far in advance must you give a proper turn signal before making a
    turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: You must give the proper turn signal at least 100 feet before you turn.
- id: 207
  category: safe_driving_rules
  question: When making a left turn from a one-way street onto a two-way street, how
    should you complete the turn?
  choices:
    A: Turn from the left lane into the right lane
    B: Turn from the right lane into the left lane
    C: Turn from the center lane into the right lane
    D: Turn from the left lane into the left lane
  answer: A
  explanation: If you are turning left from a one-way street you should turn from
    the left lane into the right lane, moving in the same direction.
- id: 208
  category: safe_driving_rules
  question: How close to a fire hydrant is it illegal to park or stand a vehicle?
  choices:
    A: Within 10 feet
    B: Within 15 feet
    C: Within 20 feet
    D: Within 30 feet
  answer: B
  explanation: You must not park or allow a vehicle to stand idling within 15 feet
    of a fire hydrant.
- id: 209
  category: safe_driving_rules
  question: In which of the following locations is it illegal to park, stop, or stand
    a vehicle?
  choices:
    A: On a bridge or within a highway tunnel
    B: In a private residential driveway
    C: On a paved shoulder outside an urban area
    D: Next to a curb in a business district
  answer: A
  explanation: You should not park, stop, or allow a vehicle to stand idling on a
    bridge or other elevated structure on a highway or within a highway tunnel.
- id: 210
  category: safe_driving_rules
  question: How far away from a crosswalk at an intersection is it illegal to park
    or stand a vehicle?
  choices:
    A: Within 10 feet
    B: Within 15 feet
    C: Within 20 feet
    D: Within 30 feet
  answer: C
  explanation: You must not park or allow a vehicle to stand idling within 20 feet
    of a crosswalk at an intersection.
- id: 211
  category: safe_driving_rules
  question: You must not park a vehicle within how many feet of the nearest rail of
    a railroad crossing?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: D
  explanation: Do not park a vehicle, occupied or not, within 50 feet of the nearest
    rail of a railroad crossing.
- id: 212
  category: penalties_and_points
  question: What is the penalty for a first offense of illegally parking in a space
    reserved for individuals with disabilities?
  choices:
    A: A fine of $100 to $200
    B: A fine of $250 to $500
    C: A fine of $500 to $750
    D: A fine of $1,000 to $1,250
  answer: C
  explanation: Illegally parking in a space reserved for individuals with disabilities
    is a misdemeanor punishable by a fine of $500 to $750 for the first offense.
- id: 213
  category: driver_responsibility
  question: Under what condition may you use a disabled parking windshield identification
    card?
  choices:
    A: Whenever you are running a quick errand for a disabled family member
    B: Only when transporting the disabled person to whom it was issued
    C: If you borrowed it from a friend who is not currently using it
    D: When all other regular parking spaces are full
  answer: B
  explanation: Texas law specifically states you may not use a disabled parking windshield
    identification card unless transporting the disabled person to whom it was issued.
- id: 214
  category: defensive_driving
  question: How do you know it is safe to return to the right lane after passing a
    vehicle on the left?
  choices:
    A: When you are 50 feet ahead of the vehicle
    B: When you can see the car you just passed in your rearview mirror
    C: When the driver you passed flashes their headlights
    D: When you have accelerated to 10 mph over the speed limit
  answer: B
  explanation: Wait until you can see the car you have just passed in your rearview
    mirror before returning to the right lane.
- id: 215
  category: safe_driving_rules
  question: If you must park on a highway outside of a business or residential district
    at night, what must you do?
  choices:
    A: Turn on your high beam headlights
    B: Leave your hazard lights flashing and doors unlocked
    C: Use your parking lights or leave your headlights on dim
    D: Turn off all lights to save your vehicle's battery
  answer: C
  explanation: If you cannot park off the road at night on a highway outside an urban
    area, use your parking lights or leave your headlights on dim.
- id: 216
  category: vehicle_information
  question: When preparing to turn, what should you avoid doing while actually executing
    the turn?
  choices:
    A: Using both hands on the steering wheel
    B: Looking in all directions for traffic
    C: Using the brake or clutch
    D: Staying in the proper turn lane
  answer: C
  explanation: The manual instructs drivers to slow down to a reasonable turning speed
    prior to making the turn and says, 'Don’t use the brake or clutch while turning.'
- id: 217
  category: safe_driving_rules
  question: What is the purpose of the striped areas adjacent to disabled parking
    spaces?
  choices:
    A: They are designated for motorcycle parking.
    B: They are for wheelchair lifts.
    C: They are designated for loading and unloading commercial goods.
    D: They are reserved for compact cars only.
  answer: B
  explanation: According to the manual, you must not park in striped areas adjacent
    to disabled parking spaces because these striped areas are for wheelchair lifts.
- id: 218
  category: safe_driving_rules
  question: When leaving a motor vehicle unattended, which of the following is NOT
    required by law (unless using a remote starter)?
  choices:
    A: Turning off the engine
    B: Locking the ignition
    C: Removing the key from the ignition
    D: Turning on the hazard lights
  answer: D
  explanation: It is illegal to permit a car to stand idling unattended without turning
    off the engine, locking the ignition, removing the key, and setting the brake.
    Turning on hazard lights is not a stated requirement.
- id: 219
  category: safe_driving_rules
  question: When parallel parking on a roadway that allows two-way traffic, how close
    must your vehicle's right-hand wheels be to the right-hand curb or edge of the
    roadway?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: C
  explanation: On a roadway that allows two-way traffic, the driver must park with
    the vehicle's right-hand wheels within 18 inches of the right-hand curb or edge
    of the roadway.
- id: 220
  category: safe_driving_rules
  question: Is it legal to coast on a downgrade with the gears or transmission in
    neutral?
  choices:
    A: Yes, but only in rural areas.
    B: Yes, it is a recommended way to save fuel.
    C: No, it is illegal.
    D: No, unless you are driving a manual transmission.
  answer: C
  explanation: The manual explicitly states that it is illegal to coast on a downgrade
    with the gears or transmission in neutral.
- id: 221
  category: defensive_driving
  question: Under good road conditions, what is the minimum recommended following
    distance for speeds above 30 mph?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: C
  explanation: For speeds above 30 mph, you should maintain a 4-second gap between
    cars during good road conditions.
- id: 222
  category: defensive_driving
  question: How can you tell if you are following the vehicle ahead of you too closely?
  choices:
    A: You cannot see their side mirrors.
    B: You reach the same fixed object as the vehicle ahead in less than two seconds.
    C: You are traveling at the exact same speed as the vehicle ahead.
    D: You can read their license plate clearly.
  answer: B
  explanation: 'A special note in the manual states: When the vehicle ahead of you
    passes a fixed object and you reach the same fixed object in less than two seconds,
    you are following too closely.'
- id: 223
  category: defensive_driving
  question: According to the Texas Driver Handbook, how long does it take the average
    person to think, react, and apply the brakes?
  choices:
    A: 1/2 second
    B: 1 second
    C: 1-1/2 seconds
    D: 2 seconds
  answer: C
  explanation: It takes the average person 1-1/2 seconds to think, react and apply
    the brakes.
- id: 224
  category: defensive_driving
  question: How does driving at 60 mph affect your field of vision compared to being
    stationary?
  choices:
    A: It is reduced to about 2/3.
    B: It is reduced to about 1/2.
    C: It is reduced to about 2/5.
    D: It is reduced to about 1/5.
  answer: D
  explanation: The manual states that at 60 MPH, your field of vision is reduced to
    about 1/5 compared to a stationary field of vision of 180 degrees or more.
- id: 225
  category: safe_driving_rules
  question: What is the maximum speed limit in an urban district unless otherwise
    posted?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: The Speed Limits table lists the maximum speed limit for an Urban District
    as 30 MPH.
- id: 226
  category: safe_driving_rules
  question: When entities establish or alter a speed limit, how must daytime and nighttime
    speed limits compare?
  choices:
    A: Nighttime limits must be 5 mph lower than daytime limits.
    B: Nighttime limits must be 10 mph lower than daytime limits.
