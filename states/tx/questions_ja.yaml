- id: 340
  category: safe_driving_rules
  question: 車線変更を行う際、車線変更が完了した後に方向指示器（ウィンカー）をどうするべきですか？
  choices:
    A: 少なくとも1マイルは方向指示器を点灯させたままにする
    B: 車線変更が完了したら方向指示器を消す
    C: 真後ろに車両がいる場合のみ方向指示器を使用する
    D: 方向指示器を使用する代わりに、車線変更前にクラクションを鳴らす
