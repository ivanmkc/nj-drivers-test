    A: 太陽の光によって運転者の視界が遮られるエリア
    B: バックミラーでは見えないエリア
    C: 車両の前方で小さな物体が隠れてしまうゾーン
    D: 街灯のない道路の区間
  answer: B
  explanation: マニュアルによると、死角とはバックミラーでは見えないエリアのことです。
- id: 342
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）は何を測定するものですか？
  choices:
    A: 血流中の体液の量に対するエチルアルコールの割合として表される、血中のアルコール量
    B: 1時間に消費されたアルコール飲料の数
