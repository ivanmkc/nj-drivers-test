- id: 337
  category: safe_driving_rules
  question: 「基本速度法（basic speed law）」の定義は何ですか？
  choices:
    A: 常に標識に表示された制限速度と全く同じ速度で運転しなければならない
    B: 標識に表示された制限速度に関係なく、現在の状況において安全かつ慎重な速度を超えて運転してはならない
    C: 他の車両を追い越すために制限速度を5 mph超えることができる
    D: 悪天候時には制限速度より少なくとも10 mph遅い速度で運転しなければならない
  answer: B
  explanation: 基本速度法とは、標識に表示された制限速度に関係なく、現在の状況において安全かつ慎重な速度を超えて運転してはならないことを意味します。
- id: 338
  category: vehicle_information
  question: 用語集によると、自転車は人力で推進し、2つの車輪が前後に並んでいるものとされています。自転車として分類されるためには、これらの車輪の少なくとも1つの直径がどのサイズを超えていなければなりませんか？
