questions:
- id: 1
  category: driver_responsibility
  question: テキサス州運転免許ハンドブックの主な目的は何ですか？
  choices:
    A: 法廷での公式な法的参考資料として機能し、保険料率を提供すること。
    B: テキサス州の運転免許証の取得資格を得るのを助け、より安全な運転手になるのを助けること。
    C: 車両を登録し、地元の自動車学校のリストを提供すること。
    D: テキサス州刑法の概要を説明し、運転免許試験のスケジュールを立てること。
  answer: B
  explanation: ハンドブックには、主な目的として、1) テキサス州の運転免許証の取得資格を得るのを助けること、2) より安全な運転手になるのを助けること、と記載されています。
- id: 2
  category: safe_driving_rules
  question: ハンドブックで言及されている交通法や刑法の実際の条文を読みたい場合、どの文書を参照すべきですか？
  choices:
    A: テキサス州運転免許ハンドブックの付録
    B: テキサス州行政法典
    C: テキサス州交通法典およびテキサス州刑法典
    D: 公安局の規則書
  answer: C
  explanation: ハンドブックは公式な法的参考資料ではありません。交通法や刑法の実際の条文を知るには、テキサス州交通法典およびテキサス州刑法典を参照する必要があります。
- id: 3
  category: license_system
  question: テキサス州議会は、交通法を定期的に改正するためにどのくらいの頻度で開かれますか？
  choices:
    A: 6ヶ月ごと
    B: 毎年
    C: 2年ごと
    D: 4年ごと
  answer: C
  explanation: テキストには、テキサス州議会は2年ごとに開かれ、定期的に交通法を改正していると記されています。
- id: 4
  category: license_system
  question: 運転免許センターを訪問する前に、障害に対する特別な配慮（合理的配慮）を依頼する必要がある場合、どのくらい前に通知すべきですか？
  choices:
    A: 少なくとも24時間前
    B: 少なくとも48時間前
    C: 少なくとも3〜4営業日前
    D: 少なくとも5〜7営業日前
  answer: D
  explanation: マニュアルでは、ADA（障害者法）に基づく配慮の準備期間を確保するため、訪問の少なくとも5〜7営業日前までに連絡するよう求めています。
- id: 5
  category: safe_driving_rules
  question: テキサス州には、約何マイルの公道がありますか？
  choices:
    A: 100,000マイル以上
    B: 250,000マイル以上
    C: 314,000マイル以上
    D: 500,000マイル以上
  answer: C
  explanation: 大佐からの手紙によると、テキサス州は広大な州であり、314,000マイル以上の公道があります。
- id: 6
  category: defensive_driving
  question: テキサス州では、毎年約何人が交通事故で亡くなっていますか？
  choices:
    A: 1,500人
    B: 3,500人
    C: 5,000人
    D: 10,000人
  answer: B
  explanation: ハンドブックには、悲惨なことに、テキサス州では毎年約3,500人が交通事故で亡くなっていると記載されています。
- id: 7
  category: defensive_driving
  question: 道路上での悲惨な結果を防ぐため、テキサス州公安局は運転手に対し、飲酒・薬物等の影響下にある運転手に警戒するとともに、自身の車内で何を避けるよう助言していますか？
  choices:
    A: ラジオを聴くこと
    B: 気を散らす行為（注意散漫）
    C: 同乗者を乗せること
    D: 夜間に運転すること
  answer: B
  explanation: マニュアルでは、運転手は飲酒・薬物等の影響下にある運転手や危険な運転手に警戒しつつ、自身の車内では気を散らす行為を避けなければならないと強調しています。
- id: 8
  category: license_system
  question: 目次によると、職業運転免許証（Occupational License）は別名何と呼ばれていますか？
  choices:
    A: ハードシップ免許証（Hardship License）
    B: 必要不可欠なニーズ免許証（Essential Need License）
    C: 仮免許証（Provisional License）
    D: 制限付き免許証（Restricted License）
  answer: B
  explanation: 目次には、第1章の項目として「職業運転免許証（必要不可欠なニーズ免許証：Essential Need License）」が記載されています。
- id: 9
  category: driver_responsibility
  question: テキサス州運転免許ハンドブックのどの章で、賠償責任保険法（Liability Insurance Law）および資力証明（Evidence
    of Financial Responsibility）について説明されていますか？
  choices:
    A: 第1章
    B: 第2章
    C: 第3章
    D: 第4章
  answer: C
  explanation: 目次によると、第3章：安全責任（Safety Responsibility）で、賠償責任保険法および資力証明について説明されています。
- id: 10
  category: sharing_the_road
  question: 目次によると、次のトピックのうち「第4章：通行権（Right-of-Way）」で説明されているものはどれですか？
  choices:
    A: スクールバスへの通行権の譲歩（Yield Right-of-Way to School Buses）
    B: 車両の必須装備
    C: 無免許運転の罰則
    D: 交通信号
  answer: A
  explanation: 目次には、「スクールバスへの通行権の譲歩（Yield Right-of-Way to School Buses）」が第4章：通行権のセクション内にあることが示されています。
- id: 11
  category: license_system
  question: 合理的なADA（障害者法）の配慮を受けられなかった場合、テキサス州公安局の苦情処理手続きはどこで確認できますか？
  choices:
    A: テキサス州刑法
    B: テキサス州行政規則第37編第1.41条
    C: テキサス州交通法
    D: テキサス州運転免許ハンドブックの第5章
  answer: B
  explanation: マニュアルには、DPS（公安局）の苦情処理手続きはテキサス州行政規則第37編第1.41条（37 Texas Administrative
    Code §1.41）に記載されていると明記されています。
- id: 12
  category: vehicle_information
  question: 車両に「装備してはならないもの（Equipment You Must Not Have）」に関する情報は、ハンドブックのどの章に記載されていますか？
  choices:
    A: 第1章：運転免許証
    B: 第2章：車両検査と登録
    C: 第3章：安全責任
    D: 第5章：信号、標識、および表示
  answer: B
  explanation: 目次には、「装備してはならないもの」が第2章：車両検査と登録（Vehicle Inspection and Registration）の項目に記載されています。
- id: 13
  category: license_system
  question: テキサス州運転免許ハンドブックの発行を担当しているテキサス州公安局の部門はどれですか？
  choices:
    A: ハイウェイパトロール部門
    B: 車両検査部門
    C: 運転免許部門
    D: 交通安全部門
  answer: C
  explanation: はじめに（Introduction）において、テキサス州公安局の運転免許部門（Driver License Division）がハンドブックを提供していると記載されています。
- id: 14
  category: penalties_and_points
  question: 目次によると、第1章には未成年者が犯した次のどの違反に対する罰則情報が含まれていますか？
  choices:
    A: スクールゾーンでのスピード違反
    B: 運転を伴わないアルコール関連の違反
    C: シートベルト非着用での運転
    D: 運転中のテキストメッセージ送信
  answer: B
  explanation: 第1章の目次には、「未成年者による運転を伴わないアルコール関連の違反に対する罰則（Penalties for Non-Driving
    Alcohol-Related Offenses by Minors）」というセクションが記載されています。
- id: 15
  category: alcohol_drugs_health
  question: マニュアルによると、道路上での死亡原因の第1位は何ですか？
  choices:
    A: スピード違反
    B: わき見運転（注意散漫な運転）
    C: アルコール
    D: 悪天候
  answer: C
  explanation: マニュアルでは、アルコールや薬物が運転能力に与える影響について解説する章で、「死亡原因の第1位はアルコールである（The Number
    One Killer is Alcohol）」と明記されています。
- id: 16
  category: safe_driving_rules
  question: 速度を上げると、運転能力にどのような影響がありますか？
  choices:
    A: 反応時間が長くなる
    B: 視野が狭くなる
    C: 車両のトラクション（駆動力）が向上する
    D: 視野が広くなる
  answer: B
  explanation: マニュアルの「速度と制限速度」の章には、「速度は視野を狭める（Speed Reduces Your Field of Vision）」という特定のセクションが含まれています。
- id: 17
  category: safe_driving_rules
  question: 道路脇に停車している緊急車両や法執行機関の車両に近づく際、制限速度の章で強調されている具体的な行動は何ですか？
  choices:
    A: クラクションを鳴らす
    B: 速度を維持する
    C: 減速するか、車線を変更する（Slow Down or Move Over）
    D: 直ちに停止する
  answer: C
  explanation: マニュアルの速度と制限速度に関する章には、「減速するか、車線を変更する（Slow Down or Move Over）」という規則が含まれています。
- id: 18
  category: signs_and_signals
  question: 低速で走行する特定の車両に義務付けられているエンブレム（標識）の種類は何ですか？
  choices:
    A: 多人数乗車車両（HOV）エンブレム
    B: 低速走行車エンブレム（Slow-Moving Vehicle Emblem）
    C: 商用車エンブレム
    D: 幅広積載物エンブレム
  answer: B
  explanation: マニュアルの信号と標識のセクションには、「低速走行車エンブレム（Slow-Moving Vehicle Emblem）」が記載されています。
- id: 19
  category: defensive_driving
  question: マニュアルにおいて、「特殊な運転状況（Special Driving Situation）」として明確に分類されているのは次のうちどれですか？
  choices:
    A: スクールゾーンでの運転
    B: 縦列駐車
    C: 冬季の運転（Winter Driving）
    D: 交差点での譲り合い
  answer: C
  explanation: 「冬季の運転（Winter Driving）」は、「いくつかの特殊な運転状況（Some Special Driving Situations）」というタイトルの章に記載されています。
- id: 20
  category: sharing_the_road
  question: 自転車の法律と安全に関する章で、具体的に言及されている路面標示の種類は何ですか？
  choices:
    A: 黄色の実線
    B: 共有車線標示（Shared Lane Marking）
    C: 白の破線
    D: 横断歩道の標示
  answer: B
  explanation: 「共有車線標示（Shared Lane Marking）」は、自転車の法律と安全に関する章に具体的に記載されています。
- id: 21
  category: driver_responsibility
  question: 自動車事故の章で概説されている特定の種類の事故は、次のうちどれですか？
  choices:
    A: 放置車両が関与する事故
    B: 歩行者が関与する事故
    C: 自転車が関与する事故
    D: 列車が関与する事故
  answer: A
  explanation: 「放置車両が関与する事故（Crash Involving an Unattended Vehicle）」は、自動車事故の章のセクションとして明記されています。
- id: 22
  category: signs_and_signals
  question: 運転者は警告標識やバリケードに関して何をしなければなりませんか？
  choices:
    A: 注意してそれらを迂回する
    B: 進路を塞いでいる場合はそれらを移動させる
    C: 警告標識とバリケードに従う
    D: 法執行機関に報告する
  answer: C
  explanation: マニュアルの交通標識のセクションでは、運転者に対して「警告標識とバリケードに従う（Obey Warning Signs and Barricades）」よう明確に指示しています。
- id: 23
  category: vehicle_information
  question: 追加の安全上のヒントとして、注意すべき危険なガスとして特に強調されているものはどれですか？
  choices:
    A: 二酸化窒素
    B: 一酸化炭素
    C: 二酸化硫黄
    D: オゾン
  answer: B
  explanation: 「一酸化炭素（Carbon Monoxide）」は、追加の安全上のヒントの章に記載されています。
- id: 24
  category: sharing_the_road
  question: 道路の共有に関するセクションにおいて、「大型トラック」と見なされるのは次のうちどれですか？
  choices:
    A: 配送用バン
    B: トレーラー付きのピックアップトラック
    C: トラックとトラクターの連結車両
    D: 大型乗用車
  answer: C
  explanation: マニュアルでは、トラックとの道路の共有に関するセクションで「大型トラックおよびトラックとトラクターの連結車両」と明記しています。
- id: 25
  category: driver_responsibility
  question: 事故の章によると、負傷者がいる事故に関与した場合、運転者の責任は何ですか？
  choices:
    A: 介入せずに救急隊の到着を待つ
    B: 負傷者を救護する
    C: 事故現場周辺の交通整理をする
    D: 直ちに車両を移動させる
  answer: B
  explanation: 「負傷者の救護（Aiding the Injured）」は、自動車事故の章の特定のセクションとして記載されています。
- id: 26
  category: signs_and_signals
  question: 交通標識の特定のカテゴリとして記載されているのは、次のうちどれですか？
  choices:
    A: 提案標識
    B: 案内標識
    C: 任意標識
    D: 一時標識
  answer: B
  explanation: 「案内標識（Guide Signs）」は、交通標識のカテゴリとして明記されています。
- id: 27
  category: sharing_the_road
  question: マニュアルでは、大型トラック、オートバイ、自転車に加えて、他のどの特定の交通機関と「道路を共有する（Share the Road）」よう運転者に指示していますか？
  choices:
    A: ライトレール（次世代型路面電車）
    B: 飛行機
    C: 馬車
    D: 歩行者
  answer: A
  explanation: 「ライトレールとの道路の共有（Share the Road with Light Rail）」は、特別な運転状況の章にある特定のセクションです。
- id: 28
  category: penalties_and_points
  question: 運転者が自身の情報を提供せずに現場から立ち去る事故は、どの種類の事故ですか？
  choices:
    A: 放置事故
    B: ひき逃げ・当て逃げ事故
    C: 建造物衝突事故
    D: 交通違反事故
  answer: B
  explanation: 「ひき逃げ・当て逃げ事故（Hit-and-Run Crashes）」は、自動車事故の章に明記されています。
- id: 29
  category: sharing_the_road
  question: 自転車を道路で安全に運転する前に、何が義務付けられていますか？
  choices:
    A: 州に登録されていなければならない
    B: モーターが取り付けられていなければならない
    C: 適切な装備を備えていなければならない
    D: 明るい色で塗装されていなければならない
  answer: C
  explanation: マニュアルの自転車の法律と安全の章には、「自転車は適切な装備を備えていなければならない（Bicycles Must Be Properly
    Equipped）」と記載されています。
- id: 30
  category: license_system
  question: 有効な州外の運転免許証を持つ新しい居住者は、居住地を確立し、テキサス州の運転免許証を取得するまでに何日間の猶予がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 120日
  answer: C
  explanation: マニュアルによると、有効な州外の運転免許証を切り替える新しい居住者は、テキサス州の運転免許証を取得するために、テキサス州に居住地を確立するまでに90日間の猶予があります。
- id: 31
  category: license_system
  question: 次のうち、テキサス州の運転免許証の取得を免除されているのは誰ですか？
  choices:
    A: 州境を越えて商用自動車を運転する人
    B: 公道（ハイウェイ）で農業用トラクターを一時的に運転する人
    C: 家族の車を運転して通学する16歳の人
    D: テキサス州に6ヶ月間居住している新しい住民
  answer: B
  explanation: 道路工事用機械、農業用トラクター、または農機具を公道（ハイウェイ）で一時的に運転または移動させる人は、その車両が商用自動車でない限り、テキサス州の運転免許証の取得を免除されます。
- id: 32
  category: license_system
  question: 非居住者が、出身州またはカナダの州で発行された有効な運転免許証を使用して、テキサス州でクラスCまたはクラスMの車両を運転するための最低年齢は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 18歳
    D: 21歳
  answer: B
  explanation: 16歳以上で、出身州またはカナダの州で発行された有効な運転免許証を所持している非居住者は、テキサス州でクラスCまたはクラスMの運転免許証での運転が許可されている車両を運転することができます。
- id: 33
  category: license_system
  question: アメリカ軍に所属する人のテキサス州運転免許証は、名誉除隊またはテキサス州に帰還した後、どのくらいの期間有効ですか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 180日間
  answer: C
  explanation: アメリカ軍に所属する人が所持するテキサス州の運転免許証は、軍の任務が継続し、テキサス州を離れている間は有効です。ただし、名誉除隊またはテキサス州に帰還した日から90日を超えない範囲に限られます。
- id: 34
  category: license_system
  question: 仮免許（learner license）を持つ教習生に同乗しなければならない免許所持者の要件は何ですか？
  choices:
    A: 18歳以上で、6ヶ月の運転経験があること
    B: 21歳以上で、少なくとも1年の運転経験があること
    C: 25歳以上の親または法定後見人であること
    D: 認定された運転指導員であること
  answer: B
  explanation: 仮免許所持者に同乗する免許所持者は、21歳以上で少なくとも1年の運転経験があり、運転者の隣の席に座らなければなりません。また、酩酊状態、睡眠中、または注意散漫な状態であってはなりません。
- id: 35
  category: license_system
  question: 18歳未満の申請者の場合、仮免許（learner license）の有効期限はいつ切れますか？
  choices:
    A: 16歳の誕生日
    B: 18歳の誕生日
    C: 21歳の誕生日
    D: 発行日から1年後
  answer: B
  explanation: 仮免許証の表面には「Learner License（仮免許）」と記載され、未成年者の18歳の誕生日に有効期限が切れます。
- id: 36
  category: license_system
  question: 夏季期間中、在学・出席証明書（VOE）の有効期間はどのくらいですか？
  choices:
    A: 15日間
    B: 30日間
    C: 60日間
    D: 90日間
  answer: D
  explanation: VOE（在学・出席証明書）の日付は、学期中であれば免許申請日の30日前まで、夏季期間中であれば90日前までのものしか有効と認められません。
- id: 37
  category: license_system
  question: 在学・出席証明書（VOE）を取得するには、申請前の秋学期または春学期に何日間学校に出席していなければなりませんか？
  choices:
    A: 少なくとも45日間
    B: 少なくとも60日間
    C: 少なくとも80日間
    D: 少なくとも90日間
  answer: C
  explanation: VOEの要件を満たすには、学生は申請日の前の秋学期または春学期に少なくとも80日間学校に出席していなければなりません。
- id: 38
  category: license_system
  question: テキサス州でハードシップ免許（特別な事情による免許）を申請するための最低年齢要件は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 17歳
  answer: B
  explanation: ハードシップ免許を申請する人は、15歳以上18歳以下でなければなりません。
- id: 39
  category: license_system
  question: 公安局（DPS）が未成年者にハードシップ免許を発行する正当な理由は、次のうちどれですか？
  choices:
    A: 未成年者が社交行事に車で行く必要があるため
    B: 未成年者が免許を必要とする職業教育プログラムに登録しているため
    C: 未成年者の親が学校まで車で送る時間がないため
    D: 未成年者が段階的運転免許（GDL）プログラムを早く始めたいと考えているため
  answer: B
  explanation: 未成年者の申請者が、参加に免許を必要とする職業教育プログラムに登録しており、免許が必要であると判断された場合、DPSはハードシップ免許を発行します。
- id: 40
  category: driver_responsibility
  question: テキサス州の運転手引書（Texas Driver Handbook）によると、若年ドライバーは運転人口の6.5%を占めていますが、死亡事故の何パーセントを引き起こしていますか？
  choices:
    A: 6.5%
    B: 10%
    C: 13%
    D: 25%
  answer: C
  explanation: 若年ドライバーは運転人口の6.5%を占めていますが、死亡事故の13%を引き起こしています。
- id: 41
  category: license_system
  question: 段階的運転免許 (GDL) プログラムの第1段階 (フェーズ1) において、18歳未満の申請者が暫定免許 (provisional license)
    の交付を受ける前に、仮免許 (learner license) またはハードシップ免許 (hardship license) を保持しなければならない期間はどれくらいですか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 9ヶ月
    D: 12ヶ月
  answer: B
  explanation: 第1段階では、18歳未満の申請者は、暫定免許の交付を受ける前に、有効な仮免許、ハードシップ免許、またはその両方を最低6ヶ月間保持することが義務付けられています。
- id: 42
  category: penalties_and_points
  question: 段階的運転免許 (GDL) プログラムの第1段階 (フェーズ1) 中に、未成年者の仮免許が免停 (停止) になった場合、どうなりますか？
  choices:
    A: 未成年者は6ヶ月の期間を最初からやり直さなければならない。
    B: 未成年者は暫定免許を取得する資格を永久に失う。
    C: 最初の6ヶ月の期間が、免停の日数分だけ延長される。
    D: 免停は6ヶ月の要件に影響を与えない。
  answer: C
  explanation: 第1段階中に免許が停止された場合、停止期間中は免許が無効となるため、最初の6ヶ月の期間は停止された日数分だけ延長されます。
- id: 43
  category: license_system
  question: 段階的運転免許 (GDL) プログラムの第1段階 (フェーズ1) の要件が免除される免許の種類はどれですか？
  choices:
    A: クラスA免許
    B: クラスB免許
    C: クラスC免許
    D: クラスM (二輪車) 免許
  answer: D
  explanation: 第1段階の要件は、クラスM (二輪車) 免許には適用されません。GDLプログラムでは、クラスM免許を申請する前に制限付き二輪車免許を保持しなければならない最低期間はありません。
- id: 44
  category: license_system
  question: 新しいテキサス州の運転免許証を受け取る前に、申請者は以前に発行された有効な運転免許証および身分証明書 (ID) をどうしなければなりませんか？
  choices:
    A: 予備の身分証明書として保管する。
    B: 公安局 (DPS) に返納する。
    C: 以前住んでいた州に郵送する。
    D: 自宅で破棄する。
  answer: B
  explanation: マニュアルの特記事項には、「発行されたすべての有効な運転免許証および身分証明書 (ID) を返納するまで、テキサス州の運転免許証を受け取ることはできません」と記載されています。
- id: 45
  category: license_system
  question: 段階的運転免許 (GDL) プログラムの第2段階 (フェーズ2) の資格を得るには、テキサス州の仮免許をどれくらいの期間保持しなければなりませんか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 9ヶ月
    D: 12ヶ月
  answer: B
  explanation: マニュアルによると、第2段階の資格を得るには、テキサス州の仮免許を発行日から6ヶ月間保持しなければなりません。
- id: 46
  category: safe_driving_rules
  question: GDLプログラムの第2段階 (フェーズ2) 中、運転者は家族ではない21歳未満の同乗者を何人より多く乗せて自動車を運転してはいけませんか？
  choices:
    A: 0人
    B: 1人
    C: 2人
    D: 3人
  answer: B
  explanation: 第2段階中、運転者は家族ではない21歳未満の同乗者を車内に1人より多く乗せて自動車を運転することはできません。
- id: 47
  category: safe_driving_rules
  question: 仕事、学校、または医療上の緊急事態のために運転する場合を除き、GDLプログラムの第2段階 (フェーズ2) にある個人の運転制限時間は何時ですか？
  choices:
    A: 午後10時から午前4時
    B: 午後11時から午前6時
    C: 深夜0時から午前5時
    D: 午前1時から午前5時
  answer: C
  explanation: 第2段階では、仕事、学校関連の活動、または医療上の緊急事態に運転が必要な場合を除き、深夜0時から午前5時までの間の運転が制限されます。
- id: 48
  category: safe_driving_rules
  question: 18歳未満の運転者に対するワイヤレス通信機器に関する規則は何ですか？
  choices:
    A: ハンズフリー機器のみ使用できる。
    B: 赤信号で停車している時のみワイヤレス機器を使用できる。
    C: 緊急時を除き、ハンズフリー機器を含むすべてのワイヤレス通信機器の使用が制限される。
    D: 助手席に免許を持った大人が同乗している場合はワイヤレス機器を使用できる。
  answer: C
  explanation: 18歳未満のすべての運転者は、緊急時を除き、ハンズフリー機器を含むワイヤレス通信機器の使用が制限されています。
- id: 49
  category: license_system
  question: 暫定運転免許証 (provisional driver license) の有効期限はいつですか？
  choices:
    A: 免許保持者の18歳の誕生日
    B: 免許保持者の21歳の誕生日
    C: 発行日から4年
    D: 発行日から8年
  answer: A
  explanation: 暫定免許証は16歳から18歳までの人に発行され、「PROVISIONAL (暫定)」と明記されており、免許保持者の18歳の誕生日に有効期限が切れます。
- id: 50
  category: license_system
  question: 申請者が16歳で、他州の有効な運転免許証を提示した場合、運転試験に合格した後に発行されるテキサス州の免許証の種類は何ですか？
  choices:
    A: 第1段階 (フェーズ1) の仮免許
    B: 第2段階 (フェーズ2) の暫定免許
    C: 標準のクラスC運転免許証
    D: クラスM二輪車免許
  answer: B
  explanation: 16歳以上18歳未満で、他州の有効な運転免許証を提示する申請者には、同乗者および時間の制限が付いた第2段階 (フェーズ2) の暫定免許証が発行されます。
- id: 51
  category: license_system
  question: 21歳未満の人物に発行される運転免許証には、どのような表記がされますか？
  choices:
    A: '"MINOR"'
    B: '"PROVISIONAL"'
    C: '"UNDER 21"'
    D: '"RESTRICTED"'
  answer: C
  explanation: マニュアルには、21歳未満の人物に発行されるすべての免許証には「UNDER 21」と表記されると記載されています。
- id: 52
  category: license_system
  question: 18歳以上の人物に対する標準的な非商業用運転免許証の有効期間は、通常何年ですか？
  choices:
    A: 4年
    B: 5年
    C: 6年
    D: 8年
  answer: D
  explanation: 18歳以上の人物に発行されるほとんどの非商業用運転免許証の有効期間は8年です。
- id: 53
  category: license_system
  question: 申請者が標準の8年よりも短い有効期間の運転免許証を受け取る理由として、次のうちどれが当てはまりますか？
  choices:
    A: 85歳以上であるため
    B: 駐車違反の切符を切られた履歴があるため
    C: レクリエーショナルビークルを運転するため
    D: クラスM免許を所持しているため
  answer: A
  explanation: 合法的な滞在の確認、性犯罪者登録の要件、または85歳以上であることなどの制限により、一部の申請者は有効期間が短い免許証を受け取ります。
- id: 54
  category: vehicle_information
  question: 次の車両のうち、商業用運転免許証（CDL）の取得が免除されるのはどれですか？
  choices:
    A: 営利目的で使用される配送トラック
    B: 個人目的で運転されるレクリエーショナルビークル
    C: 運賃をとって20人を乗せる旅客バス
    D: 州間通商で使用されるトラクタートレーラー
  answer: B
  explanation: 個人目的でレクリエーショナルビークルを運転する人は、CDLの取得が免除されます。
- id: 55
  category: vehicle_information
  question: クラスA運転免許証では、連結車両総重量定格（GCWR）が26,001ポンド以上の車両を運転できますが、牽引される車両の重量が何ポンドを超えている必要がありますか？
  choices:
    A: 5,000ポンド
    B: 10,000ポンド
    C: 15,000ポンド
    D: 20,000ポンド
  answer: B
  explanation: クラスA運転免許証では、牽引される車両の車両総重量定格（GVWR）が10,000ポンドを超えている場合、GCWRが26,001ポンド以上の車両または連結車両を運転することが許可されます。
- id: 56
  category: vehicle_information
  question: クラスC運転免許証において、オートサイクルはいくつかの要件を満たす自動車として定義されています。次のうち、その要件の1つはどれですか？
  choices:
    A: 走行時に4つの車輪が接地していなければならない。
    B: ステアリングホイール（円形ハンドル）の代わりに、バー型のハンドルが装備されていなければならない。
    C: 運転者がまたがって座る必要のない座席が装備されていなければならない。
    D: 連邦のオートバイ安全基準に適合していると認定されていてはならない。
  answer: C
  explanation: オートサイクルは、車輪が3つ以下であり、ステアリングホイールが装備され、運転者がまたがって座る必要のない座席があり、連邦のオートバイ安全基準に適合するように製造されたものと定義されています。
- id: 57
  category: vehicle_information
  question: 標準のクラスC運転免許証で運転できる単一車両の車両総重量定格（GVWR）の制限はどれくらいですか？
  choices:
    A: 10,000ポンド未満
    B: 20,000ポンド未満
    C: 26,001ポンド未満
    D: 26,001ポンド以上
  answer: C
  explanation: クラスC運転免許証では、車両総重量定格（GVWR）が26,001ポンド未満の単一車両を運転することが許可されます。
- id: 58
  category: driver_testing
  question: クラスM（オートバイ）運転免許証を申請する前に、合格しなければならないものは何ですか？
  choices:
    A: 商用車の運転免許試験
    B: 州が承認したオートバイ運転者トレーニングコース
    C: オートサイクル認定試験
    D: ディフェンシブ・ドライビング・コース
  answer: B
  explanation: クラスM免許を申請する前に、州が承認したオートバイ運転者トレーニングコースに合格する必要があります。
- id: 59
  category: license_system
  question: 排気量250ccを超えるオートバイのクラスM免許を取得するための最低年齢要件は何歳ですか？
  choices:
    A: 15歳
    B: 必要な教育およびトレーニングコースを修了した16歳
    C: 18歳
    D: 21歳
  answer: B
  explanation: オートバイ免許の最低年齢は、運転者教育コースの座学（32時間）および州が承認したオートバイ運転者トレーニングコース（16時間）を修了した16歳です。
- id: 60
  category: license_system
  question: 15歳が排気量250cc以下のオートバイを運転する免許を取得できるのは、どのような条件の場合ですか？
  choices:
    A: 有効なクラスC免許を所持している場合
    B: 免許を持った親または保護者が常に同乗している場合
    C: 公安局（DPS）によるハードシップ運転免許証の承認、または必要な教育コースを修了している場合
    D: 15歳はいかなる状況でもオートバイ免許を取得できない
  answer: C
  explanation: 排気量250cc以下のオートバイの場合、最低年齢は15歳であり、公安局（DPS）によるハードシップ運転免許証の承認、または運転者教育コースの座学および州が承認したオートバイ運転者トレーニングコースの修了が必要です。
- id: 61
  category: license_system
  question: 運転免許証および身分証明書（IDカード）の交付手数料が免除される対象となる退役軍人は誰ですか？
  choices:
    A: 名誉除隊したすべての退役軍人
    B: 指定された戦闘地域で任務に就いた退役軍人
    C: 少なくとも30％の公務関連の障害を持つ退役軍人
    D: 名誉除隊し、少なくとも60％の公務関連の障害に対する補償を受けている退役軍人
  answer: D
  explanation: 名誉除隊し、少なくとも60％の公務関連の障害に対する補償を受けている退役軍人は、運転免許証および身分証明書（IDカード）の交付手数料が免除されます。
- id: 62
  category: license_system
  question: 手数料免除の障害要件を満たす退役軍人であっても、次のどれを申請する場合は手数料を支払う必要がありますか？
  choices:
    A: クラスMの二輪車（オートバイ）免許
    B: 商業用運転免許証（CDL）
    C: 身分証明書（IDカード）
    D: クラスCの運転免許証
  answer: B
  explanation: 商業用運転免許証（CDL）を申請する個人、または性犯罪者としての登録が義務付けられている個人は、退役軍人の手数料免除の対象にはなりません。
- id: 63
  category: license_system
  question: 21歳未満の個人の場合、テキサス州の身分証明書（IDカード）はどのような形式になっていますか？
  choices:
    A: 横向きの形式で印刷されている
    B: 縦向きの形式で印刷されている
    C: 写真の周りに赤い枠線がある
    D: 写真が含まれていない
  answer: B
  explanation: 身分証明書（IDカード）は、21歳未満の個人の場合は縦向きの形式で表示され、21歳以上の個人の場合は横向きになります。
- id: 64
  category: license_system
  question: テキサス州の身分証明書（IDカード）の発行を受けるための最低年齢要件は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 18歳
    D: IDカードは年齢に関係なく誰にでも発行できる
  answer: D
  explanation: マニュアルのIDカードの表によると、IDカードは年齢に関係なく誰にでも発行できます。
- id: 65
  category: driver_responsibility
  question: 薬物に対するアレルギー反応に関する情報を運転免許証に追加するにはどうすればよいですか？
  choices:
    A: 申請時に公安局（DPS）にカードの表面に印刷するよう依頼する
    B: 医療諮問委員会（Medical Advisory Board）に医療フォームを提出する
    C: 消えないインクのペンを使用して、カードの裏面に薬の名前を書く
    D: カードの表面に医療アラートステッカーを貼る
  answer: C
  explanation: 公安局（DPS）は運転免許証に医療情報を印刷しません。医療情報を追加するには、消えないインクのペンを使用し、アレルギー反応を引き起こす可能性のある薬の名前をカードの裏面に記入してください。
- id: 66
  category: driver_responsibility
  question: 臓器提供者（ドナー）として登録することを選択した場合、運転免許証にはどのように表示されますか？
  choices:
    A: 表面に「donor」という文字が入った小さなハートマークが印刷される
    B: 裏面に「Organ Donor」という文字が赤色で印刷される
    C: 免許証の背景が特別な青色になる
    D: 運転記録に医療コードが追加される
  answer: A
  explanation: 臓器提供者になることを選択した場合、カードの表面に「donor」という文字が入った小さなハートマークが印刷されます。
- id: 67
  category: license_system
  question: 窓口で運転免許証を申請する際、有権者登録の申請を行う機会が提供されるのは何歳からですか？
  choices:
    A: 16歳
    B: 17歳10ヶ月
    C: 18歳
    D: 21歳
  answer: B
  explanation: 17歳10ヶ月以上のすべての窓口申請者には、有権者登録の申請を行う機会が提供されます。
- id: 68
  category: license_system
  question: 身分証明書（IDカード）または運転免許証の発行時に、選抜徴兵制度（selective service）に自動的に登録されるのは誰ですか？
  choices:
    A: 18歳から25歳までのすべての申請者
    B: 米国市民または移民である18歳から25歳までのすべての男性
    C: ちょうど18歳の米国の男性市民のみ
    D: 商業用運転免許証（CDL）を申請するすべての人
  answer: B
  explanation: 米国市民または移民である18歳から25歳までのすべての男性は、身分証明書（IDカード）または運転免許証の発行時に、選抜徴兵制度（selective
    service）に自動的に登録されます。
- id: 69
  category: license_system
  question: テキサス州の運転免許証を申請する際、現在所持している他州の有効な運転免許証はどうしなければなりませんか？
  choices:
    A: 第二の身分証明書として保管する
    B: 返納する
    C: 発行元の州に郵送で返却する
    D: 追加料金を支払い、両方の免許証を有効なままにする
  answer: B
  explanation: テキサス州の運転免許証を申請するには、他州の有効な運転免許証を返納しなければなりません。
- id: 70
  category: penalties_and_points
  question: 次のうち、あなたの永久的な運転記録の一部として記録されるものはどれですか？
  choices:
    A: テキサス州内で発生した交通違反の有罪判決のみ
    B: 駐車違反切符および通行料違反
    C: 他州での記録を含む、走行中の交通違反または交通事故による有罪判決
    D: 免許申請時に行った任意の寄付
  answer: C
  explanation: 他州での有罪判決の記録を含む、走行中の交通違反または交通事故によるすべての有罪判決は、永久的な運転記録の一部として記録されます。
- id: 71
  category: driver_responsibility
  question: 新規の運転免許証を申請する際、経済的責任に関して何を提出しなければなりませんか？
  choices:
    A: 健康保険の証明書
    B: 自動車保険の証明書、または自動車を所有していないという申告書
    C: 公安局（DPS）への500ドルの保証金
    D: 良好なクレジットスコアを示す信用情報レポート
  answer: B
  explanation: 新規の運転免許証を申請する際、経済的責任の証明書、または経済的責任の維持が義務付けられる自動車を所有していないという申告書を提出する必要があります。
- id: 72
  category: license_system
  question: 運転免許証の申請時に、任意で寄付を行うことができるプログラムは次のうちどれですか？
  choices:
    A: テキサス州幹線道路維持基金
    B: 視覚障害教育・検査・治療プログラム
    C: 公立学校交通基金
    D: 州立公園・野生生物口座
  answer: B
  explanation: 申請者は、テキサス州盲人委員会が運営する「視覚障害教育・検査・治療プログラム」を含む、いくつかのプログラムに任意で寄付することができます。
- id: 73
  category: license_system
  question: 対面で同時に複数の運転免許証の手続きを行う場合、1ドルの事務手数料はどのように扱われますか？
  choices:
    A: 各手続きにつき1ドル請求される
    B: 対面での手続きの場合、手数料は完全に免除される
    C: 1ドルの事務手数料は1回のみ請求される
    D: 複数の手続きを行う場合、手数料は5ドルに増額される
  answer: C
  explanation: 対面、電話、またはオンラインで同時に複数の手続きを行う場合、1ドルの事務手数料は1回のみ請求されます。
- id: 74
  category: driver_testing
  question: 学科試験の合格に必要なスコアはどれくらいですか？
  choices:
    A: 75パーセント
    B: 80パーセント
    C: 70パーセント
    D: 85パーセント
  answer: C
  explanation: 学科試験に合格するには、70パーセント以上の成績を取る必要があります。
- id: 75
  category: driver_testing
  question: 該当するすべての試験に合格した後、仮運転免許証の有効期間はどのくらいですか？
  choices:
    A: 30日間
    B: 45日間
    C: 60日間
    D: 90日間
  answer: B
  explanation: 該当するすべての試験に合格すると仮免許証が発行され、45日間、または郵送で正式な免許証を受け取るまで使用することができます。
- id: 76
  category: driver_responsibility
  question: テキサス州の新しい居住者が他州の運転免許証を返納する際、何を提出しなければなりませんか？
  choices:
    A: 出生証明書とパスポート
    B: 所有する各自動車が現在テキサス州で登録されていることの証明
    C: 以前の州での運転記録
    D: テキサス州の運転者教育コースの修了証明書
  answer: B
  explanation: テキサス州の新しい居住者は、運転免許証の申請書とともに、本人が所有する各自動車が現在テキサス州で登録されていることの証明を提出するか、自動車を所有していない旨を申告しなければなりません。
- id: 77
  category: driver_testing
  question: 最初の受験で学科試験および実技試験に合格しなかった場合、どうなりますか？
  choices:
    A: すぐに新たな手数料を支払わなければならない
    B: 申請は90日間保留される
    C: 再申請するまで1年間待たなければならない
    D: 免許取得の資格を永久に失う
  answer: B
  explanation: 最初の受験で学科試験および実技試験に合格しなかった場合、申請は90日間保留されます。
- id: 78
  category: driver_testing
  question: 免許を申請するために、認可された運転者教育コースを修了することが義務付けられているのは何歳未満の人ですか？
  choices:
    A: 18歳未満
    B: 21歳未満
    C: 25歳未満
    D: 年齢に関係なくすべての申請者
  answer: C
  explanation: 25歳未満の人は、認可された運転者教育コースを修了することが義務付けられています。
- id: 79
  category: license_system
  question: 18歳未満の未成年者の免許取り消しを公安局（DPS）に要請できるのは誰ですか？
  choices:
    A: 学校の校長
    B: 宣誓の上で申請書に署名した人物
    C: 21歳以上の免許を持つ運転手
    D: 法執行官（警察官）
  answer: B
  explanation: 署名した人物（親、保護者、雇用主、または郡裁判官）は、本人が18歳の誕生日を迎える前であればいつでも、DPSに免許の取り消しを要請することができます。
- id: 80
  category: driver_testing
  question: 実技試験で自動的に不合格となるのは、次のうちどれですか？
  choices:
    A: 10点以上減点される
    B: 試験官に指示を繰り返すよう頼む
    C: 指示に従うことを拒否する
    D: 縦列駐車中にバックカメラを使用する
  answer: C
  explanation: 次の場合、免許の申請は承認されません：1. 法律に違反する、2. 指示に従うことを拒否する、3. 危険な運転をするか衝突事故を起こす、4.
    30点以上減点される。
- id: 81
  category: vehicle_information
  question: 運転試験を受ける際、車両の駐車支援技術の使用に関する規定はどのようなものですか？
  choices:
    A: 自動駐車機能を使用してもよい
    B: バックカメラは使用してもよいが、自動駐車機能は使用してはならない
    C: ミラーやカメラは使用してはならない
    D: すべての電子センサーを無効にしなければならない
  answer: B
  explanation: 縦列駐車の際に車両のバックカメラを使用することは許可されていますが、自動駐車機能の使用は許可されません。
- id: 82
  category: safe_driving_rules
  question: 運転試験の急停止（クイックストップ）の項目では、時速何マイルで走行中にできるだけ早く車を停止させるよう求められることがありますか？
  choices:
    A: 約10 mph
    B: 約20 mph
    C: 約30 mph
    D: 約40 mph
  answer: B
  explanation: 急停止（クイックストップ） – タイヤをスリップさせることなく、約20 mphの速度からできるだけ早く車を停止させるよう求められることがあります。
- id: 83
  category: penalties_and_points
  question: 無免許運転で初めて有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 最大200ドルの罰金
    B: 25ドルから200ドルの罰金
    C: 最大30日間の拘留
    D: 最大4,000ドルの罰金
  answer: A
  explanation: 「無免許運転の罰則」の表によると、1回目の有罪判決では最大200ドルの罰金が科せられます。
- id: 84
  category: penalties_and_points
  question: 運転者が無免許および無保険で車両を運転し、重傷または死亡に至る事故を引き起こした場合の罰則は何ですか？
  choices:
    A: 最大500ドルの罰金
    B: クラスCの軽犯罪（Misdemeanor）
    C: 最大4,000ドルの罰金および/または最大365日間の拘留が科せられるクラスAの軽犯罪（Misdemeanor）
    D: 最大5年間の懲役が科せられる重犯罪（Felony）
  answer: C
  explanation: 無免許運転、違反時の無保険での車両運転、および運転者が重傷または死亡に至る事故を引き起こした場合はクラスAの軽犯罪（Misdemeanor）となり、最大4,000ドルの罰金および/または365日以下の拘留が科せられます。
- id: 85
  category: driver_testing
  question: 運転試験で全運転者が評価される4つの基本スキルのうち、該当しないものは次のうちどれですか？
  choices:
    A: コントロール（操作）
    B: オブザベーション（観察）
    C: スピーディング（速度超過）
    D: ポジショニング（位置取り）
  answer: C
  explanation: すべての運転者は、コントロール（操作）、オブザベーション（観察）、ポジショニング（位置取り）、シグナリング（合図）の4つの基本スキルで評価されます。
- id: 86
  category: driver_responsibility
  question: 運転試験に合格した場合、提示を求められた際に運転免許証を見せなければならない相手は誰ですか？
  choices:
    A: 州警察官（State trooper）のみ
    B: 警察官（Peace officer）、裁判官、または事故の当事者
    C: 提示を求めてきた免許を持つすべての運転者
    D: 裁判官または治安判事（Justice of the peace）のみ
  answer: B
  explanation: 運転試験に合格した後は、運転時に常に免許証を携帯し、求められた場合は以下の人に提示しなければなりません：1. 警察官（Peace officer）、保安官（Sheriff）、巡査（Constable）、裁判官、治安判事（Justice
    of the peace）、または州警察官（State trooper） 2. 事故の当事者。
- id: 87
  category: driver_testing
  question: 新たな申請と手数料が必要になるまでに、学科試験および実技試験に何回不合格になることができますか？
  choices:
    A: 2回
    B: 3回
    C: 4回
    D: 5回
  answer: B
  explanation: 90日が経過するか、試験に3回不合格になった場合、新たな申請と手数料が必要になります。
- id: 88
  category: vehicle_information
  question: 運転試験中にマニュアル車（標準トランスミッション車）を運転する場合、クラッチを最後まで踏み込むべきなのはいつですか？
  choices:
    A: エンジンをかける時のみ
    B: 30 mph以上で走行している時は常に
    C: エンジンをかける時、ギアを変える時、停止する時、および速度が10 mphを下回った時
    D: 常にクラッチに足を乗せたまま運転するべきである
  answer: C
  explanation: マニュアル車（標準トランスミッション車）では、エンジンをかける時、ギアを変える時、停止する時、および速度が10 mphを下回った時にクラッチを最後まで踏み込みます。クラッチに足を乗せたまま運転してはいけません。
- id: 89
  category: license_system
  question: 住所変更をテキサス州公安局（DPS）に報告しなければならない期限は何日以内ですか？
  choices:
    A: 10日
    B: 15日
    C: 30日
    D: 60日
  answer: C
  explanation: マニュアルによると、住所変更は30日以内にDPSに報告しなければなりません。
- id: 90
  category: license_system
  question: テキサス州の運転免許証はどのくらいの頻度で更新しなければなりませんか？
  choices:
    A: 4年ごと
    B: 6年ごと
    C: 8年ごと
    D: 10年ごと
  answer: C
  explanation: マニュアルには、テキサス州の運転免許証は8年ごとに更新しなければならないと記載されています。
- id: 91
  category: license_system
  question: 視力検査を受け、写真、署名、指紋を更新するために、本人が運転免許センターに直接出向かなければならない頻度はどれくらいですか？
  choices:
    A: 少なくとも8年に1回
    B: 少なくとも10年に1回
    C: 少なくとも12年に1回
    D: 少なくとも16年に1回
  answer: D
  explanation: 視力検査を受け、写真、署名、指紋を更新するために、少なくとも16年に1回は本人が運転免許センターに直接出向かなければなりません。
- id: 92
  category: penalties_and_points
  question: '行政による免許取り消し（ALR: Administrative License Revocation）の免許復帰手数料はいくらですか？'
  choices:
    A: 50ドル
    B: 100ドル
    C: 125ドル
    D: 200ドル
  answer: C
  explanation: マニュアルには、行政による免許取り消し（ALR）には125ドルの免許復帰手数料が必要であると規定されています。
- id: 93
  category: license_system
  question: オンラインや郵送などの代替方法を使用して運転免許証を更新する資格が「ない」ドライバーのグループは、次のうちどれですか？
  choices:
    A: 50歳以上のドライバー
    B: 商用運転免許（CDL）の保持者
    C: 免許を10年以上保持しているドライバー
    D: 現役の軍人
  answer: B
  explanation: 特定のグループの中でも、商用運転免許（CDL）の保持者には、代替方法による更新は適用されません。
- id: 94
  category: penalties_and_points
  question: 行政による免許停止および取り消しにおいて、度重なる交通違反により免許が停止される可能性があるのは、次のどの条件に当てはまる場合ですか？
  choices:
    A: 任意の12ヶ月間に2回以上の交通違反の有罪判決を受けた場合
    B: 任意の24ヶ月間に3回以上の交通違反の有罪判決を受けた場合
    C: 任意の12ヶ月間に別々に発生した4回以上の交通違反の有罪判決を受けた場合
    D: 任意の24ヶ月間に5回以上の交通違反の有罪判決を受けた場合
  answer: C
  explanation: テキサス州公安局（DPS）は、任意の12ヶ月間に別々に発生した4回以上の交通違反の有罪判決を含む、交通法の度重なる違反に対して免許を停止または取り消す権限を持っています。
- id: 95
  category: license_system
  question: 兵役からテキサス州に帰還し、免許証の有効期限が2年以上切れている場合、名誉除隊後、学科試験と実技試験を受けずに更新できる期間はどれくらいですか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: C
  explanation: 現役から帰還した軍人は、免許証の有効期限が2年以上切れている場合でも、名誉除隊から90日以内であれば、除隊証明書を提示することで試験を受けずに更新することができます。
- id: 96
  category: penalties_and_points
  question: 21歳未満の個人において、運転特権の自動停止をもたらす違反は次のうちどれですか？
  choices:
    A: 義務付けられたタバコ啓発クラスを修了しなかった場合
    B: 荷積みゾーンに駐車した場合
    C: 期限切れの車両登録で運転した場合
    D: シートベルトを着用しなかった場合
  answer: A
  explanation: 21歳未満の個人の場合、義務付けられたタバコ啓発クラスを修了しないことは健康安全法（Health and Safety Code）違反となり、運転特権が自動的に停止されます。
- id: 97
  category: license_system
  question: 住所「以外」の運転免許証の情報を変更するには、何をしなければなりませんか？
  choices:
    A: 記入済みのDL-64フォームを郵送する
    B: 運転免許センターを訪問する
    C: DPSのホットラインに電話する
    D: オンラインポータルを通じて更新する
  answer: B
  explanation: マニュアルには次のように記載されています。「運転免許証またはIDカードのその他の情報を変更するには、運転免許センターを訪問する必要があります。」
- id: 98
  category: license_system
  question: 運転免許証に課される制限（restriction）の目的は何ですか？
  choices:
    A: 過去の交通違反に対して罰を与えるため
    B: 自動車保険の費用を上げるため
    C: より安全なドライバーにするため
    D: 乗車できる同乗者の数を制限するため
  answer: C
  explanation: 免許証に制限が課される場合があります。これは運転を妨げるためのものではなく、あなたをより安全なドライバーにするためのものです。
- id: 99
  category: penalties_and_points
  question: 薬物教育講習（Drug Education Course）に関連する免許停止の復帰手数料はいくらですか？
  choices:
    A: 10ドル
    B: 50ドル
    C: 100ドル
    D: 125ドル
  answer: C
  explanation: マニュアルには、薬物教育講習に関連する免許復帰手数料として100ドルが必要であると記載されています。
- id: 100
  category: license_system
  question: 資格のある州外在住のテキサス州免許保持者が郵送で更新した場合、テキサス州に戻った後、更新された免許証はどのくらいの期間有効ですか？
  choices:
    A: テキサス州に戻ってから30日間
    B: テキサス州に戻ってから60日間
    C: テキサス州に戻ってから90日間、または有効期限のいずれか早い方まで
    D: テキサス州に戻ってから180日間
  answer: C
  explanation: 郵送で更新する州外在住のテキサス州免許保持者の場合、免許証は更新され、記載されている有効期限まで、またはテキサス州に戻ってから90日間のいずれか早い方まで有効となります。
- id: 101
  category: penalties_and_points
  question: 自動的な義務的停止（Mandatory Suspension）ではなく、行政処分による停止または取消し（Administrative Suspension
    or Revocation）の理由とみなされるのは、次のうちどれですか？
  choices:
    A: アルコールまたは薬物の影響下での運転（DWI）
    B: 酩酊状態での過失致死または過失傷害
    C: 自動車の運転中に重大な衝突事故を引き起こすこと
    D: スクールバスの追い越し（2回目以降の有罪判決）
  answer: C
  explanation: 自動車の運転中に重大な衝突事故を引き起こすことは「行政処分による停止および取消し」に分類されますが、DWI、酩酊状態での過失致死、スクールバスの追い越しは「義務的停止」となります。
- id: 102
  category: alcohol_drugs_health
  question: 行政免許取消（ALR）法に基づき、公安局（DPS）は、呼気または血液検査で血中アルコール濃度（BAC）が少なくとも以下の数値を示した21歳以上の個人の免許を停止する権限を持っています：
  choices:
    A: '0.02'
    B: '0.04'
    C: '0.08'
    D: '0.10'
  answer: C
  explanation: 公安局（DPS）は、呼気または血液検査で血中アルコール濃度（BAC）が0.08以上を示した21歳以上の個人の免許を停止する権限を持っています。
- id: 103
  category: alcohol_drugs_health
  question: 21歳未満の個人について、行政免許取消（ALR）法に基づき、公安局（DPS）はどの程度のアルコール量が検出された場合に免許または運転特権を停止する権限を持っていますか？
  choices:
    A: BACが0.08以上
    B: BACが0.04以上
    C: BACが0.02以上
    D: 検出可能な量のアルコールすべて
  answer: D
  explanation: 公安局（DPS）は、検出可能な量であればいかなるアルコール量であっても、21歳未満の個人の免許を停止する権限を持っています。
- id: 104
  category: license_system
  question: 運転免許証または身分証明書（IDカード）の無効化（cancellation）が必要となる状況は、次のうちどれですか？
  choices:
    A: 1回のスピード違反切符を切られること
    B: 運転者教育が未修了であること
    C: 許可証なしで障害者専用駐車スペースに駐車すること
    D: シートベルトを着用しないこと
  answer: B
  explanation: 運転免許証または身分証明書の無効化が必要となるケースには、運転者教育の未修了、申請時の虚偽の申告、未成年者に対する親の同意の撤回などが含まれます。
- id: 105
  category: penalties_and_points
  question: 裁判所の命令を受けた際、公安局（DPS）が免許または運転特権を停止、取消し、または無効にする理由となるのは、次のうちどれですか？
  choices:
    A: 養育費の滞納
    B: 駐車違反切符を2回累積すること
    C: 制限速度を5 mph超過して運転すること
    D: 「ゆずれ（Yield）」の標識で優先権を譲らないこと
  answer: A
  explanation: 裁判所の命令を受けた際、公安局（DPS）は、精神的無能力や薬物依存などの理由のほか、養育費の滞納を理由として免許を停止、取消し、または無効にします。
- id: 106
  category: penalties_and_points
  question: 加重要因がない場合、運転免許が停止、取消し、拒否、または無効にされている状態での自動車の運転（DWLI）の初回違反に対する罰則は何ですか？
  choices:
    A: クラスAの軽犯罪で、最大4,000ドルの罰金
    B: クラスBの軽犯罪で、最大2,000ドルの罰金
    C: クラスCの軽犯罪で、最大500ドルの罰金
    D: 125ドルの罰金および10時間の社会奉仕活動
  answer: C
  explanation: 免許が停止、取消し、拒否、または無効にされている状態での運転はクラスCの軽犯罪であり、最大500ドルの罰金が科せられます。
- id: 107
  category: penalties_and_points
  question: 無効免許での運転（DWLI）が、最大4,000ドルの罰金および/または最大365日の拘留が科せられるクラスAの軽犯罪となるのは、その人物が保険に加入せずに運転しており、かつ次のどの条件に当てはまる場合ですか？
  choices:
    A: 制限速度を20 mph以上超過して捕まった場合
    B: 他人に重傷を負わせるか死亡させる衝突事故を引き起こした場合
    C: 呼気検査の提出を拒否した場合
    D: 全く同じ違反で過去に有罪判決を受けている場合
  answer: B
  explanation: 違反時に保険に加入せずに運転しており、他人に重傷を負わせるか死亡させる衝突事故を引き起こした場合、DWLIはクラスAの軽犯罪となります。
- id: 108
  category: alcohol_drugs_health
  question: 未成年者による運転を伴わないアルコール関連の初回違反の場合、運転免許（または運転特権）はどのくらいの期間停止（または拒否）されますか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 180日間
  answer: A
  explanation: 未成年者による運転を伴わないアルコール関連の初回違反の場合、運転免許は30日間停止されます（免許を持っていない場合は運転特権が拒否されます）。
- id: 109
  category: penalties_and_points
  question: 17歳以上21歳未満の未成年者による、運転を伴わないアルコール関連の3回目の違反に対する罰則は何ですか？
  choices:
    A: クラスCの軽犯罪および30日間の免許停止
    B: クラスCの軽犯罪および60日間の免許停止
    C: 250ドルから2,000ドルの罰金が科せられるクラスBの軽犯罪および180日間の免許停止
    D: 最大4,000ドルの罰金が科せられるクラスAの軽犯罪および365日間の免許停止
  answer: C
  explanation: 17歳以上21歳未満の未成年者による3回目の違反はクラスBの軽犯罪であり、250ドルから2,000ドルの罰金が科せられ、運転免許は180日間停止されます。
- id: 110
  category: penalties_and_points
  question: 未成年者にアルコール飲料を購入、提供、または販売した者に対する罰則は何ですか？
  choices:
    A: 最大500ドルの罰金および20時間の社会奉仕活動
    B: 最大2,000ドルの罰金および/または最大180日間の拘留
    C: 最大4,000ドルの罰金および/または最大1年間の拘留
    D: 義務的な180日間の運転免許停止
  answer: C
  explanation: 未成年者にアルコール飲料を購入、提供、または販売した者は、最大4,000ドルの罰金および/または最大1年間の拘留の対象となります。
- id: 111
  category: license_system
  question: 職業運転免許（必要不可欠な運転免許とも呼ばれます）とは何ですか？
  choices:
    A: 商用トラック運転手専用に発行される免許
    B: 免許が停止または取り消されたものの、運転する必要不可欠な理由を証明できる個人のための特別な制限付き免許
    C: 未成年者が学校への通学のために運転することを許可する免許
    D: 正式な身分証明書が郵送されるのを待つ間に発行される仮許可証
  answer: B
  explanation: 職業運転免許は、運転免許がキャンセル、停止、取り消し、または拒否された個人で、運転する必要不可欠な理由があることを裁判所に証明できる人に発行される特別な種類の制限付き免許です。
- id: 112
  category: license_system
  question: 職業運転免許が1年間許可された場合、手数料はいくらですか？
  choices:
    A: $10
    B: $20
    C: $50
    D: $125
  answer: A
  explanation: 職業運転免許の手数料は、1年間の場合は$10、2年間許可された場合は$20です。
- id: 113
  category: license_system
  question: 正式な免許証の処理中、職業運転免許の裁判所命令を運転目的で使用できる期間はどれくらいですか？
  choices:
    A: 10日間
    B: 30日間
    C: 45日間
    D: 60日間
  answer: C
  explanation: 職業運転免許の処理中、裁判所命令は運転目的で45日間使用できます。
- id: 114
  category: license_system
  question: 職業運転免許で運転してはならない車両の種類はどれですか？
  choices:
    A: 乗用車
    B: ピックアップトラック
    C: 商用自動車
    D: スポーツ用多目的車（SUV）
  answer: C
  explanation: マニュアルには、商用自動車を運転するための職業運転免許は発行されないと記載されています。
- id: 115
  category: license_system
  question: DPS（公安局）が申請者への運転免許証の発行を拒否する権限を持つ理由は、次のうちどれですか？
  choices:
    A: 代金を支払わずに自動車燃料を取得したこと
    B: 1回の駐車違反を受けたこと
    C: 有権者登録を怠ったこと
    D: 州外の自動車保険に加入していること
  answer: A
  explanation: 申請者は、養育費の滞納や特定の器物損壊などの理由のほか、代金を支払わずに自動車燃料を取得したこと（ガソリンの持ち逃げ）を理由に運転免許証の発行を拒否される場合があります。
- id: 116
  category: vehicle_information
  question: 車両登録の目的において、合格した車両検査報告書（VIR）の有効期間はどれくらいですか？
  choices:
    A: 検査月から30日間
    B: 検査月から60日間
    C: 検査月から90日間
    D: 検査月から1年間
  answer: C
  explanation: 車両検査報告書（VIR）は、車両登録の目的において、検査月から90日間のみ有効です。
- id: 117
  category: vehicle_information
  question: 車両のフットブレーキは、どの速度で走行しているときに25フィートの距離内で車を停止できなければなりませんか？
  choices:
    A: 10 mph
    B: 20 mph
    C: 30 mph
    D: 40 mph
  answer: B
  explanation: フットブレーキは、20 mphの速度で走行しているときに25フィートの距離内で車を停止できなければなりません。
- id: 118
  category: vehicle_information
  question: 車両のクラクションは、最低でもどの距離まで聞こえる必要がありますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: クラクションは、最低でも200フィートの距離まで聞こえる必要があります。
- id: 119
  category: vehicle_information
  question: 車両のタイヤに義務付けられている最小のトレッド（溝）の深さはどれくらいですか？
  choices:
    A: 1/32インチ
    B: 2/32インチ
    C: 3/32インチ
    D: 4/32インチ
  answer: B
  explanation: すべての車両は、適切かつ安全な状態で、最小の深さが2/32インチのタイヤを装着することが義務付けられています。
- id: 120
  category: signs_and_signals
  question: 農業用トラクターなど、どの速度以下で走行するように指定された特定の車両に、低速走行車マーク（エンブレム）を表示する必要がありますか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: 農業用トラクターや機械、道路建設機械、動物牽引車両、および25 mph以下で走行するように指定されたその他の特定の自動車は、低速走行車マークを表示する必要があります。
- id: 121
  category: vehicle_information
  question: 車の車体、ランニングボード、またはフェンダーの左側から何インチ以上はみ出して物を積むことは違法ですか？
  choices:
    A: 2インチ
    B: 3インチ
    C: 5インチ
    D: 6インチ
  answer: B
  explanation: 車の車体、ランニングボード、またはフェンダーの左側から3インチ以上、または右側から6インチ以上はみ出して物を積んではなりません。
- id: 122
  category: vehicle_information
  question: 次のうち、危険とみなされ、標準的な乗用車での使用が許可されていないものはどれですか？
  choices:
    A: 前方から見える赤色のライト
    B: 白色のナンバープレート灯
    C: 前方の琥珀色（アンバー）のパーキングライト
    D: 2つのバックアップライト（後退灯）
  answer: A
  explanation: 前方から見える赤色のライトは危険とみなされ、緊急車両を除いて許可されていません。
- id: 123
  category: vehicle_information
  question: 改造車の最低地上高に関する州の要件は何ですか？
  choices:
    A: 車体は地上から少なくとも6インチ以上高くなければならない。
    B: 車体がホイールリムの最下部より下になってはならない。
    C: 車両は少なくとも10インチの地上高がなければならない。
    D: バンパーは路面から少なくとも16インチ離れていなければならない。
  answer: B
  explanation: 車体がホイールリムの最下部より下になるような方法で、車両を改造したり重量を加えたりしてはなりません。
- id: 124
  category: safe_driving_rules
  question: 車両のバックアップライト（後退灯）を使用することが違法となるのはいつですか？
  choices:
    A: 暗い場所に駐車するとき
    B: 車両が前進しているとき
    C: 私道からバックで出るとき
    D: 異常な交通の危険を警告するとき
  answer: B
  explanation: 2つのバックアップライトは単独または他のライトと組み合わせて許可されていますが、車両が前進しているときに使用してはなりません。
- id: 125
  category: license_system
  question: 新しく購入した車両を所有者が登録しなければならない期限は何日以内ですか？
  choices:
    A: 10日
    B: 15日
    C: 30日
    D: 60日
  answer: C
  explanation: 所有者は、新しく購入した車両を購入から30日以内に登録しなければなりません。
- id: 126
  category: license_system
  question: 購入者の仮ナンバープレート（temporary tags）の有効期間はどのくらいですか？
  choices:
    A: 15日
    B: 30日
    C: 60日
    D: 90日
  answer: C
  explanation: 購入者の仮ナンバープレートは60日間有効と認められます。
- id: 127
  category: vehicle_information
  question: 車両のバックミラー（ルームミラー）は、少なくとも後方のどの距離までの道路の視界を映し出せなければなりませんか？
  choices:
    A: 後方100フィート
    B: 後方200フィート
    C: 後方300フィート
    D: 後方500フィート
  answer: B
  explanation: バックミラーは、車両の後方少なくとも200フィートの距離までの道路の視界を映し出せるものでなければなりません。
- id: 128
  category: vehicle_information
  question: 車両の後部にある2つの赤色反射板は、どの高さに設置しなければなりませんか？
  choices:
    A: 10〜40インチ
    B: 15〜60インチ
    C: 20〜70インチ
    D: 24〜80インチ
  answer: B
  explanation: 反射板は15〜60インチの高さに設置し、最大600フィート離れた場所から見えるようにしなければなりません。
- id: 129
  category: vehicle_information
  question: 次の装置のうち、車両への搭載が厳しく禁止されているものはどれですか？
  choices:
    A: レーダー妨害装置
    B: GPSナビゲーションシステム
    C: ドライブレコーダー
    D: ハンズフリー通信装置
  answer: A
  explanation: 車両の速度を測定するために使用されるレーダーまたはレーザー装置を妨害、スクランブル、混乱、または誤動作させるように設計、製造、使用、または使用を意図されたレーダー妨害装置は許可されていません。
- id: 130
  category: vehicle_information
  question: 農業用登録車両（farm registered vehicle）を次のどの目的で使用することはできませんか？
  choices:
    A: 教会や学校への出席
    B: 治療のための通院
    C: 利益を得るための就労
    D: 家庭の必需品のための家族の送迎
  answer: C
  explanation: マニュアルには、農業用登録車両は教会、学校、通院などの家族の必需品のために使用できると記載されていますが、利益を得るための就労に使用することはできません。
- id: 131
  category: vehicle_information
  question: 公道（ハイウェイ）を一時的に走行する際、登録や車検が義務付けられていない車両は次のうちどれですか？
  choices:
    A: 乗用車
    B: 動力式路面清掃車（Power sweepers）
    C: 商業用配達トラック
    D: オートバイ
  answer: B
  explanation: 動力式路面清掃車は、公道（ハイウェイ）を一時的に走行する際に、登録、車検、またはナンバープレートの表示が義務付けられていない車両のリストに含まれています。
- id: 132
  category: license_system
  question: 非居住者がテキサス州に居住地を定めるか、有給の職業に就いた後、車両をテキサス州で登録するまでに何日間の猶予がありますか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: B
  explanation: 非居住者がテキサス州に居住地を定めるか、有給の職業に就いた場合、その車両は30日間運転することができます。30日経過後は、車両をテキサス州で登録しなければなりません。
- id: 133
  category: license_system
  question: テキサス州の新しい居住者が、テキサス州の運転免許証を申請する前にしなければならないことは何ですか？
  choices:
    A: 所有するすべての車両を登録する
    B: 州外のナンバープレートを返納する
    C: ディフェンシブ・ドライビング・コース（安全運転講習）を修了する
    D: 州会計監査官に55,000ドルの保証金を支払う
  answer: A
  explanation: テキサス州の新しい居住者は、テキサス州の運転免許証を申請する前に、所有するすべての車両を登録しなければなりません。
- id: 134
  category: driver_responsibility
  question: テキサス州で義務付けられている、物的損害に対する賠償責任保険の最低金額はいくらですか？
  choices:
    A: 15,000ドル
    B: 25,000ドル
    C: 30,000ドル
    D: 60,000ドル
  answer: B
  explanation: 2011年1月1日現在、賠償責任保険の最低金額には、物的損害に対する25,000ドルが含まれています。
- id: 135
  category: driver_responsibility
  question: テキサス州自動車安全責任法（Texas Motor Vehicle Safety Responsibility Act）の下で、2人以上の負傷または死亡に対して義務付けられている賠償責任保険の最低金額はいくらですか？
  choices:
    A: 25,000ドル
    B: 30,000ドル
    C: 50,000ドル
    D: 60,000ドル
  answer: D
  explanation: 賠償責任保険の最低金額には、2人以上の負傷または死亡に対する60,000ドルが含まれています。
- id: 136
  category: driver_responsibility
  question: テキサス州において、経済的責任（自動車保険等の支払い能力）の証明として認められる形式は次のうちどれですか？
  choices:
    A: 損害を賠償するという口頭での約束
    B: 州会計監査官に55,000ドルが預託されていることを示す証明書
    C: 有効なテキサス州の運転免許証
    D: 車両検査（車検）報告書
  answer: B
  explanation: 認められる経済的責任の証明には、所有者が少なくとも55,000ドルの金銭または有価証券を預託していることを示す、州会計監査官発行の証明書が含まれます。
- id: 137
  category: penalties_and_points
  question: 経済的責任の証明なしで運転し、2回目の有罪判決を受けた場合、車両はどのくらいの期間押収されますか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 180日間
  answer: D
  explanation: 2回目以降の有罪判決の場合、違反および有罪判決時に被告が所有者であったことを条件として、その人が運転または操作した車両は180日間押収されます。
- id: 138
  category: driver_responsibility
  question: 交通事故による判決（損害賠償等）が何日以内に履行されない場合、運転免許証または運転の特権が停止されますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: B
  explanation: 交通事故による判決が、判決から60日以内に履行されない場合、運転者の車両登録、免許証、または運転の特権は停止されます。
- id: 139
  category: safe_driving_rules
  question: 舗装道路と交差する未舗装道路を運転している場合、どうしなければなりませんか？
  choices:
    A: 舗装道路を走行している車両に通行権（優先権）を譲る
    B: 先に到着した場合は通行権を得る
    C: 右側から接近する車両にのみ譲る
    D: 停止して他の運転手からの合図を待つ
  answer: A
  explanation: 舗装道路と交差する未舗装道路を運転している場合、舗装道路を走行している車両に通行権（優先権）を譲らなければなりません。
- id: 140
  category: safe_driving_rules
  question: 中央分離帯のある道路、または3車線以上の道路と交差する1車線または2車線の道路を運転している場合、誰に通行権（優先権）がありますか？
  choices:
    A: 1車線または2車線の道路を走行している車両
    B: 交差点に先に到着した車両
    C: 中央分離帯のある道路、または3車線以上の道路を走行している車両
    D: 左側から接近する車両
  answer: C
  explanation: 1車線または2車線の道路から交差点に進入する場合、中央分離帯のある道路、または3車線以上の道路を走行している車両に通行権（優先権）を譲らなければなりません。
- id: 141
  category: safe_driving_rules
  question: 標識、信号、複数車線、または舗装によって規制されていない交差点に近づく際、どの車両に優先権を譲らなければなりませんか？
  choices:
    A: 左側から近づいてくるすべての車両
    B: 右側から近づいてくるすべての車両
    C: 交差点内で最も大きな車両
    D: 最も速い速度で走行している車両
  answer: B
  explanation: このような交差点に近づく際は、すでに交差点に進入している、または右側から交差点に近づいてくるすべての車両に優先権を譲らなければなりません。
- id: 142
  category: safe_driving_rules
  question: 私道、路地、またはドライブウェイから道路に進入する際、何をしなければなりませんか？
  choices:
    A: クラクションを鳴らし、止まらずに進む
    B: 歩道の手前で停止し、近づいてくるすべての車両と歩行者に道を譲る
    C: 歩行者はあなたに道を譲らなければならないため、車両にのみ道を譲る
    D: 素早く加速して交通に合流する
  answer: B
  explanation: 私道、路地、建物、またはドライブウェイから道路、市街地、または幹線道路に進入または横断する際は、歩道の手前で停止し、近づいてくるすべての車両と歩行者に優先権を譲らなければなりません。
- id: 143
  category: penalties_and_points
  question: 運転者が優先権を譲らず、他人に重傷を負わせた場合の罰則は何ですか？
  choices:
    A: 175ドルから350ドルの罰金
    B: 500ドルから2,000ドルの罰金
    C: 1,000ドルから4,000ドルの罰金
    D: 5,000ドルの罰金と免許取り消し
  answer: C
  explanation: 運転者が優先権を譲らないという交通違反を犯し、他人に重傷を負わせた場合、罰則は1,000ドルから4,000ドルの罰金となります。
- id: 144
  category: safe_driving_rules
  question: 交差点で終わる道路から丁字路（T字路）に近づく際、何をしなければなりませんか？
  choices:
    A: 速度を維持し、右車線に合流する。
    B: 停止し、通過道路（優先道路）の車両に優先権を譲る。
    C: 停止標識または「譲れ」の標識がある場合にのみ道を譲る。
    D: 右折する場合は優先権を得る。
  answer: B
  explanation: 交差点で終わる道路から通過道路（優先道路）の交差点に近づく際は、停止し、通過道路の車両に優先権を譲らなければなりません。
- id: 145
  category: sharing_the_road
  question: 同じ方向に進む3車線以上に分割された道路で、右側から車線に進入する車両と左側から同じ車線に進入する車両が鉢合わせた場合、どちらが道を譲らなければなりませんか？
  choices:
    A: 右側から進入する車両が優先権を譲らなければならない。
    B: 左側から進入する車両が優先権を譲らなければならない。
    C: 両方の車両が停止し、相手が進むのを待たなければならない。
    D: より速い速度で走行している車両に優先権がある。
  answer: A
  explanation: 3車線以上に分割された道路では、右側から車線に進入する車両は、左側から同じ車線に進入する車両に優先権を譲らなければなりません。
- id: 146
  category: safe_driving_rules
  question: 列車が近づいている踏切に近づく際、どの距離で車両を停止させなければなりませんか？
  choices:
    A: 最も近いレールから10フィート以上30フィート以内。
    B: 最も近いレールから15フィート以上50フィート以内。
    C: 最も近いレールからちょうど20フィート。
    D: 最も近いレールから少なくとも100フィート。
  answer: B
  explanation: 踏切に近づく際、列車が近づいている場合、列車の接近を警告する信号が出ている場合、または遮断機が下りている場合は、最も近いレールから15フィート以上50フィート以内の位置で停止しなければなりません。
- id: 147
  category: penalties_and_points
  question: 踏切に関する法令に従わなかった場合の罰金はいくらですか？
  choices:
    A: 50ドルから200ドル
    B: 100ドルから500ドル
    C: 200ドルから1,000ドル
    D: 500ドルから1,250ドル
  answer: A
  explanation: 踏切に関する法令に従わなかった者は、50ドルから200ドルの罰金が科せられます。
- id: 148
  category: defensive_driving
  question: 線路上で車がエンストし、列車が近づいている場合、最も安全な行動は何ですか？
  choices:
    A: 車内に留まり、シートベルトを締め、すぐに911に電話する。
    B: 車から降りて、列車から遠ざかるように線路に沿ってまっすぐ走る。
    C: すぐに車から降りて、近づいてくる列車に向かって線路の脇を走る。
    D: 列車が500フィート以内に近づくまで車の再始動を試み、その後車から降りる。
  answer: C
  explanation: 列車が近づいており、車両がエンストした場合は、すぐに車から降りて線路から離れてください。飛散物を避けるため、近づいてくる列車に向かって線路の脇を走って逃げてください。
- id: 149
  category: sharing_the_road
  question: 出動中の消防車、または赤色点滅灯を点灯させている救急車の後方何フィート以内を追従してはいけませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: D
  explanation: 出動中の消防車、または赤色点滅灯を点灯させている救急車の後方500フィート以内を追従することは禁止されています。
- id: 150
  category: safe_driving_rules
  question: 制限速度が時速45マイルの幹線道路で、ライトを点灯させて停止している緊急車両に近づいた際、最も近い車線を空けることができない場合、何をしなければなりませんか？
  choices:
    A: 時速25マイル以下に減速する。
    B: 時速15マイル以下に減速する。
    C: 時速5マイル以下に減速する。
    D: 速度を維持するが、細心の注意を払って進む。
  answer: A
  explanation: 緊急車両に最も近い車線を空けることができない場合、指定された制限速度が時速25マイル以上の場合は、制限速度から時速20マイルを引いた速度以下に減速しなければなりません。（時速45マイル
    - 時速20マイル = 時速25マイル）。
- id: 151
  category: sharing_the_road
  question: 交互に点滅する赤色灯を表示しているスクールバスに近づいた場合、停止しなければならず、次のいずれかになるまで追い越してはいけません：
  choices:
    A: 子供たちが安全に道路を横断し、歩道に到着するまで。
    B: 少なくとも60秒間待機するまで。
    C: バスが動き出すか、運転手が進むように合図するか、赤色灯の点滅が止まるまで。
    D: バスの運転手が黄色のハザードランプを点灯させるまで。
  answer: C
  explanation: 次のいずれかになるまでスクールバスを追い越してはいけません：1. スクールバスが動き出したとき、2. 運転手から進むように合図されたとき、または
    3. 赤色灯の点滅が止まったとき。
- id: 152
  category: safe_driving_rules
  question: 次のどの状況において、スクールバスのために停止する必要はありませんか？
  choices:
    A: 2車線道路で反対方向を走行している場合。
    B: 別の道路にいる場合、またはアクセス制限のある高速道路でバスが乗降所にあり、歩行者の横断が許可されていない場合。
    C: 商用車または緊急車両を運転している場合。
    D: バスがハザードランプを点灯させて踏切で停止している場合。
  answer: B
  explanation: 別の道路でスクールバスとすれ違う場合、またはアクセス制限のある高速道路でバスが乗降所に停車しており、歩行者の横断が許可されていない場合は、停止する必要はありません。
- id: 153
  category: penalties_and_points
  question: スクールバスに通行権を譲らなかったことによる最初の有罪判決に対する罰則は何ですか？
  choices:
    A: 50ドルから200ドルの罰金。
    B: 200ドルから500ドルの罰金。
    C: 500ドルから1,250ドルの罰金。
    D: 1,000ドルから2,000ドルの罰金。
  answer: C
  explanation: 表15によると、スクールバスに通行権を譲らなかったことによる最初の有罪判決に対する罰則は、500ドルから1,250ドルの罰金です。
- id: 154
  category: sharing_the_road
  question: 歩行者がまだ横断歩道にいる間に信号が青に変わった場合、どうすべきですか？
  choices:
    A: クラクションを鳴らして歩行者に急ぐよう警告する。
    B: 歩行者を避けて慎重に進む。
    C: 歩行者に通行権を譲り、横断を終えさせる。
    D: 歩行者はすぐに歩道に引き返さなければならない。
  answer: C
  explanation: 歩行者が横断歩道に入った後に信号が変わった場合でも、歩行者に通行権を譲らなければなりません。
- id: 155
  category: signs_and_signals
  question: 「路上歩行者横断（In-Street Pedestrian Crossing）」の標識はどこに設置されますか？
  choices:
    A: 道路の左側または右側。
    B: 横断歩道の上空。
    C: 横断歩道がある場所の道路上のセンターライン、車線境界線、または中央分離帯。
    D: 横断歩道の500フィート手前の右側路肩。
  answer: C
  explanation: 「路上歩行者横断」の標識は、横断歩道がある場所の道路上のセンターライン、車線境界線、または中央分離帯に設置されます。道路の左側や右側には設置されません。
- id: 156
  category: signs_and_signals
  question: 踏切にある青と白の緊急通知システム（ENS）の標識には、どのような情報が記載されていますか？
  choices:
    A: 列車の時刻表と最高速度制限。
    B: 鉄道会社の緊急連絡先番号と米国運輸省（USDOT）の全国踏切インベントリ番号。
    C: 最寄りの病院と警察署までの距離。
    D: 線路上で停止した場合の罰金額。
  answer: B
  explanation: ENSの標識には、鉄道会社の緊急連絡先番号と、正確な場所を特定するための米国運輸省（USDOT）の全国踏切インベントリ番号が記載されています。
- id: 157
  category: signs_and_signals
  question: 道路埋め込み型ライト（in-roadway lights）の目的は何ですか？
  choices:
    A: 深刻な停電時に高速道路を照らすため。
    B: 道路利用者に、減速または停止が必要になる可能性のある道路上またはその近くの状況に近づいていることを警告するため。
    C: スクールゾーンの有効時間帯における制限速度を示すため。
    D: 緊急車両を事故現場に誘導するため。
  answer: B
  explanation: 道路埋め込み型ライトは、道路利用者に、見えにくい道路上またはその近くの状況に近づいており、減速または完全に停止する必要があるかもしれないことを警告するために、路面に設置される特殊なライトです。
- id: 158
  category: signs_and_signals
  question: 交差点で点滅しない赤信号（steady red light）に近づいた場合、どうしなければなりませんか？
  choices:
    A: 歩行者がいる場合のみ停止する。
    B: 横断歩道または交差点に入る前に停止する。
    C: 減速し、注意して進む。
    D: 右側の交通に道を譲り、進む。
  answer: B
  explanation: マニュアルには、点滅しない赤信号（停止）について「横断歩道または交差点に入る前に停止してください」と記載されています。
- id: 159
  category: safe_driving_rules
  question: 警察官が交通整理をしており、通常は違法と見なされることをするように指示した場合、どうすべきですか？
  choices:
    A: 警察官ではなく交通信号に従う。
    B: 進む前に警察官に説明を求める。
    C: 常に警察官に従う。
    D: 車を停めて警察官が立ち去るのを待つ。
  answer: C
  explanation: マニュアルには次のように記載されています。「警察官が交通整理をしているときは、たとえ通常は違法と見なされることを指示されたとしても、常に警察官に従わなければなりません。」
- id: 160
  category: signs_and_signals
  question: 左折用の黄色の点滅矢印は何を示していますか？
  choices:
    A: 左折する通行権がある。
    B: 左折は許可されていない。
    C: 左折してもよいが、対向車に通行権を譲らなければならない。
    D: 左折する前に完全に停止しなければならない。
  answer: C
  explanation: マニュアルによると、「黄色の点滅矢印は左折を許可しますが、運転手は対向車に通行権を譲らなければなりません。」
- id: 161
  category: signs_and_signals
  question: 茶色の道路標識は何を示していますか？
  choices:
    A: 運転者向けのサービス案内
    B: 公共のレクリエーションおよび景勝地の案内
    C: 工事および維持管理の警告
    D: 一般的な警告または注意
  answer: B
  explanation: 標準色の一覧表では、茶色の標識は「公共のレクリエーションおよび景勝地の案内」を示すと説明されています。
- id: 162
  category: signs_and_signals
  question: 道路や隣接するエリアに存在する、または起こりうる危険を警告するためだけに使用される標識の形状はどれですか？
  choices:
    A: ひし形
    B: 五角形
    C: ペナント型（三角旗型）
    D: 丸型
  answer: A
  explanation: 形状別標識の一覧表には、ひし形は「道路や隣接するエリアに存在する、または起こりうる危険を警告するためだけに使用される」と記載されています。
- id: 163
  category: signs_and_signals
  question: ペナント型（三角旗型）の標識はどのような種類の標識ですか？
  choices:
    A: 学校の事前警告
    B: ゆずり合い（徐行）標識
    C: 追い越し禁止区間の事前警告
    D: 踏切の事前警告
  answer: C
  explanation: 形状別標識の一覧表には、ペナント型は「追い越し禁止区間の事前警告」に使用されると示されています。
- id: 164
  category: signs_and_signals
  question: 警戒標識（警告標識）に遭遇した場合、取らなければならない行動の1つは何ですか？
  choices:
    A: 直ちに停止する
    B: 少なくとも掲示されている制限速度まで減速する
    C: クラクションを鳴らして他の人に警告する
    D: 路肩に車を寄せる
  answer: B
  explanation: マニュアルには、警戒標識に遭遇した場合は「1. 注意を払う、2. 指示に従う、3. 少なくとも掲示されている制限速度まで減速する」必要があると記載されています。
- id: 165
  category: defensive_driving
  question: 濡れた道路を走行中、減速を促す警戒標識に近づいた場合、避けるべき行動は何ですか？
  choices:
    A: ワイパーを使用すること
    B: 急なハンドル操作、急加速、または急停止
    C: バックミラーを確認すること
    D: 右側の車線を走行すること
  answer: B
  explanation: 濡れた道路の警戒標識の説明には、「濡れた道路では減速してください。急なハンドル操作、急加速、または急停止をしないでください」とアドバイスされています。
- id: 166
  category: defensive_driving
  question: 路面が浮き砂利（loose gravel）で覆われていることを示す警戒標識を見た場合、どのように運転すべきですか？
  choices:
    A: トラクションを維持するために加速する
    B: 滑り始めたら急ブレーキをかける
    C: 車両を完全にコントロールできる速度まで減速し、急なハンドル操作をしない
    D: ギアをニュートラルに入れる
  answer: C
  explanation: マニュアルには浮き砂利について、「車両を完全にコントロールできる速度まで減速してください。急ブレーキをかけたり、急なハンドル操作をしたりしないでください」と記載されています。
- id: 167
  category: safe_driving_rules
  question: 軟弱な路肩（soft shoulder）の標識がある場合、舗装された道路部分から外れないように細心の注意を払わなければならないのはなぜですか？
  choices:
    A: 舗装路の横の土が柔らかく、車両のコントロールを失う原因となる可能性があるため。
    B: タイヤに損傷を与える隠れた溝があるため。
    C: 歩行者が軟弱な路肩を頻繁に歩いているため。
    D: いかなる状況でも路肩を走行することは違法であるため。
  answer: A
  explanation: マニュアルでは、軟弱な路肩について「舗装路の横の土が柔らかく、車のコントロールを失う原因となる可能性があるため、舗装された道路部分から外れないように細心の注意を払う」べきだと説明されています。
- id: 168
  category: sharing_the_road
  question: 舗装路に溝（グルーブ）が掘られていることがあるのはなぜですか？また、それに遭遇した際に特に注意すべきなのは誰ですか？
  choices:
    A: 騒音を減らすため。大型トラックが注意すべきである。
    B: 雨天時に路面が滑りやすくなる可能性を減らすため。オートバイの運転手が注意すべきである。
    C: スピード違反の車両を減速させるため。スポーツカーが注意すべきである。
    D: 横断歩道を示すため。自転車の運転手が注意すべきである。
  answer: B
  explanation: マニュアルには、「雨天時に路面が滑りやすくなる可能性を減らすために、舗装路に溝が掘られています。オートバイの運転手は注意する必要があります」と記載されています。
- id: 169
  category: vehicle_information
  question: 下り坂に近づいていることを示す警戒標識を見た場合、どのような行動が必要になることがありますか？
  choices:
    A: 燃料を節約するために高いギアに入れる。
    B: オーバーヒートを防ぐためにエンジンを切る。
    C: 車両を減速させるために低いギアを使用する。
    D: パーキングブレーキを軽くかける。
  answer: C
  explanation: マニュアルでは下り坂について、「下り坂に近づいています。すべての運転手は注意して接近してください。車両を減速させるために低いギアを使用する必要があるかもしれません」とアドバイスしています。
- id: 170
  category: signs_and_signals
  question: 赤信号と同時に緑の矢印が表示されている場合、それは何を意味しますか？
  choices:
    A: 停止し、曲がる前に青の点灯信号を待たなければならない。
    B: 他の車両や歩行者に通行権を譲った後、矢印の方向に注意して進むことができる。
    C: 信号機が故障しており、四方向一時停止として扱うべきである。
    D: 直進のみ可能であり、曲がることはできない。
  answer: B
  explanation: マニュアルには、「赤信号と同時に表示される緑の矢印は、運転手が他の車両や歩行者に通行権を譲った後、矢印の方向に注意して進むことができることを意味します」と記載されています。
- id: 171
  category: signs_and_signals
  question: 一時停止（ストップ）標識にのみ使用される形状はどれですか？
  choices:
    A: 五角形
    B: 八角形
    C: 正三角形
    D: 縦長の長方形
  answer: B
  explanation: 『形状別の標識』の表には、「八角形」が「一時停止標識専用」という説明とともに記載されています。
- id: 172
  category: safe_driving_rules
  question: 2つの道路が合流し、追加の車線が始まることを示す警戒標識を見た場合、どうしなければなりませんか？
  choices:
    A: すぐに左車線に合流しなければならない。
    B: 新しい車線に入る前に完全に一時停止しなければならない。
    C: 合流する必要はないが、新しい車線の交通に注意しなければならない。
    D: 隣の車線のすべての車両に道を譲らなければならない。
  answer: C
  explanation: 運転マニュアルでは、車線追加の標識について次のように説明しています。『2つの道路が合流し、追加の車線が始まる地点に近づいています。合流する必要はありません。新しい車線の交通に注意してください。』
- id: 173
  category: safe_driving_rules
  question: 同じ方向に進む複数の車線がある道路において、一番左側の車線は何のために設けられていますか？
  choices:
    A: 低速車両用
    B: 追い越し専用
    C: 緊急停止用
    D: カープール（相乗り）専用
  answer: B
  explanation: 運転マニュアルによると、同じ方向に進む車両が走る複数の車線がある道路では、低速車両は一番左側の車線以外の車線を走行する必要があります。一番左側の車線は追い越し専用です。
- id: 174
  category: safe_driving_rules
  question: 他の車両を追い越すために中央の左折車線（センターターンレーン）を使用することが許可されるのはいつですか？
  choices:
    A: 交通が制限速度以下で流れている場合
    B: 日中のみ
    C: 右車線が工事で塞がっている場合
    D: 追い越しには絶対に使用してはならない
  answer: D
  explanation: 運転マニュアルには、中央車線は左折する車両のみが使用するものであり、追い越しや交通を通り抜けるために使用してはならないと記載されています。
- id: 175
  category: safe_driving_rules
  question: 踏切で停止する必要がある場合、最も近いレールからの正しい停止距離はどれくらいですか？
  choices:
    A: 5〜10フィート以内
    B: 15〜50フィート以内
    C: 50〜100フィート以内
    D: 少なくとも100フィート離れた場所
  answer: B
  explanation: 踏切では、旗振り員の指示がある場合、赤色の点滅信号がある場合、または警報装置が列車の接近を知らせている場合、最も近いレールから15フィート以上50フィート以内の位置で停止しなければなりません。
- id: 176
  category: signs_and_signals
  question: 頭上の車線利用制御信号にある黄色の『X』の点灯は何を示していますか？
  choices:
    A: その車線を走行することが許可されている
    B: その車線ですぐに停止しなければならない
    C: 安全にその車線から出る準備をしなければならない
    D: その車線は左折専用である
  answer: C
  explanation: 黄色の『X』の点灯は、車線規制の変更が行われているため、運転者がその信号の下にある車線から安全に出る準備をすべきであることを意味します。
- id: 177
  category: safe_driving_rules
  question: スクールゾーンでのワイヤレス通信機器の使用にはどのような制限が適用されますか？
  choices:
    A: ハンズフリーのアクセサリーを使用する場合にのみ使用できる
    B: 使用は完全に禁止されている
    C: 時速15マイル未満で走行している場合は使用できる
    D: テキストメッセージの送信は許可されているが、通話は許可されていない
  answer: B
  explanation: 運転マニュアルには、スクールゾーンでのワイヤレス通信機器の使用は禁止されていると明記されています。
- id: 178
  category: safe_driving_rules
  question: 全方向一時停止（オールウェイストップ）の交差点に2台の車両が全く同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左折する車両
    B: 左側にいる車両
    C: 右側にいる車両
    D: 大きい方の車両
  answer: C
  explanation: 接近するすべての車両が停止しなければならない交差点で、2台の車両が同時に到着した場合、右側にいる車両に道を譲らなければなりません。
- id: 179
  category: safe_driving_rules
  question: 道路の路肩に停止することが許される理由は、次のうちどれですか？
  choices:
    A: 電話に出るため
    B: 疲れたときに休むため
    C: 道順を確認するために地図を見るため
    D: 機械的な故障やタイヤのトラブルのため
  answer: D
  explanation: 運転マニュアルでは、道路の路肩は、機械的な故障、タイヤのトラブル、燃料切れ、またはその他の緊急事態のために停止する必要がある車両のみが使用すべきであると指定されています。
- id: 180
  category: signs_and_signals
  question: 道路上の二重の白線（ダブルホワイトライン）は運転者に何を示していますか？
  choices:
    A: 運転者は車線を変更したり、線を越えて曲がったりしてはならない
    B: 車線が終了するため、運転者は左に合流しなければならない
    C: 安全が確認できれば追い越しが許可されている
    D: 道路が一方通行から対面通行に変わる
  answer: A
  explanation: 運転マニュアルによると、運転者は二重の白線を越えて車線を変更したり、曲がったりしてはなりません。
- id: 181
  category: signs_and_signals
  question: 州間高速道路（インターステート・ハイウェイ）に設置されているマイルポストの主な目的は何ですか？
  choices:
    A: 現在の制限速度を示すため
    B: 衝突事故や緊急事態の発生場所を特定するため
    C: 次の休憩所（レストエリア）までの距離を示すため
    D: 別の郡（カウンティ）との境界を示すため
  answer: B
  explanation: マイルポストは、衝突事故、故障、その他の緊急事態の発生場所を特定する手段となります。州間高速道路では1マイルごとに設置されています。
- id: 182
  category: signs_and_signals
  question: 提供されたテキストによると、多人数乗車車両（HOV）優先車線がバスと相乗り車両（カープール）に制限される時間帯はいつですか？
  choices:
    A: 月曜日から金曜日の午前7時から午前10時まで
    B: 月曜日から金曜日の午前6時から午前9時まで
    C: 月曜日から金曜日の午後3時から午後6時まで
    D: 24時間年中無休
  answer: B
  explanation: マニュアルには、バスおよび相乗り（カープール）に使用される車両は、月曜日から金曜日の午前6時から午前9時までの間のみHOV車線を使用できると記載されています。
- id: 183
  category: signs_and_signals
  question: 止まれ（Stop）の標識に近づく際、次のうちどのアクションが必要ですか？
  choices:
    A: 時速5マイル（5 mph）まで減速し、交差点に他の車両がいなければ進行する
    B: 横断歩道または交差点の手前で完全に停止する
    C: 右側から接近する車両にのみ道を譲る
    D: 歩行者が実際に横断している場合のみ停止する
  answer: B
  explanation: 止まれの標識は、完全に停止し、歩行者や他の車両に道を譲った後、注意して進行することを意味します。横断歩道、交差点、または止まれの標識の手前で停止してください。単なる減速では不十分です。
- id: 184
  category: signs_and_signals
  question: カーブの手前に設置されている推奨速度標識（Advisory Speed Sign）は何を示していますか？
  choices:
    A: 高速道路で要求される最低速度
    B: 前方のカーブを安全に走行できる最高速度
    C: 商用トラックのみに適用される制限速度
    D: フリーウェイに進入しなければならない速度
  answer: B
  explanation: 推奨速度標識は、前方のカーブを安全に走行できる最高速度を示しています。
- id: 185
  category: signs_and_signals
  question: ランプメーター（進入規制信号）の機能は何ですか？
  choices:
    A: 高速道路に進入する商用車の重量を量る
    B: 運転手にフリーウェイへ進入するタイミングを指示する
    C: 出口ランプでの車両の速度を測定する
    D: 相乗り車両（カープール）の乗客数を数える
  answer: B
  explanation: ランプメーター（赤または緑の信号）は、運転手にフリーウェイへ進入するタイミングを指示します。
- id: 186
  category: safe_driving_rules
  question: 4車線以上の多車線幹線道路において、二重の黄色い線（ダブルイエローライン）は何を示していますか？
  choices:
    A: 安全が確認できれば、線を越えて追い越しをしてもよい
    B: スクールゾーンに進入している
    C: 追い越しのために二重の黄色い線を越えてはならない
    D: その車線は左折専用である
  answer: C
  explanation: 多車線幹線道路（4車線以上）では、追い越しのために二重の黄色い線を越えてはなりません。できる限り自分の車線を維持する必要があります。
- id: 187
  category: safe_driving_rules
  question: 多車線幹線道路における中央車線の適切な使用方法は何ですか？
  choices:
    A: より速い車両のための通過車線として
    B: 遅い車両を左側から追い越すため
    C: 安全に左折するために減速または停止するため
    D: 緊急時の駐車のため
  answer: C
  explanation: 中央車線は、車両が安全に左折を行うために減速または停止する時間を持てる場所にあります。追い越しや通過車線として使用してはなりません。
- id: 188
  category: signs_and_signals
  question: 道路の自分の側に引かれた黄色の実線は何を示していますか？
  choices:
    A: 追い越し禁止区域
    B: 安全であれば追い越し可能
    C: 横断歩道に近づいている
    D: 車線が終了する
  answer: A
  explanation: 道路の自分の側に引かれた黄色の実線は「追い越し禁止区域」を示します。破線または点線の場合は、安全であれば追い越しや車線変更が許可されます。
- id: 189
  category: signs_and_signals
  question: 二重の白い実線で構成される路面標示に関する規則は何ですか？
  choices:
    A: 注意して越えることが許可されている
    B: 越えることは禁止されている
    C: 歩行者用横断歩道を示している
    D: 中央の左折専用車線を示している
  answer: B
  explanation: マニュアルによると、二重の白い実線の路面標示がある場所では、線を越えることが禁止されています。
- id: 190
  category: penalties_and_points
  question: 工事区間で発生した交通違反の罰金はどうなりますか？
  choices:
    A: 通常の違反と同じまま
    B: 半額に減額される
    C: 作業員がいる場合は2倍になる
    D: 作業員の有無にかかわらず3倍になる
  answer: C
  explanation: 工事区間内のどこかに作業員がいる場合、その工事区間で発生した交通違反の罰金は2倍になります。
- id: 191
  category: signs_and_signals
  question: バリケードや垂直パネルに近づく際、右下がりの斜めの縞模様は何を示していますか？
  choices:
    A: 道路が完全に閉鎖されている
    B: 運転者は左側に寄るべきである
    C: 運転者は右側に寄るべきである
    D: 前方に横断歩道がある
  answer: C
  explanation: 右下がりの縞模様は、運転者が通過するために右側に寄るべきであることを意味します。
- id: 192
  category: safe_driving_rules
  question: 工事区間で交通誘導員に停止するよう指示された場合、どうすればよいですか？
  choices:
    A: 自分の車線で停止し、左右に進路を変えない
    B: 右側の路肩に寄せて停止する
    C: 誘導員が動くまでゆっくりと前進する
    D: クラクションを鳴らして指示を確認したことを伝える
  answer: A
  explanation: 交通誘導員に停止するよう指示された場合は、自分の車線で停止し、左右に進路を変えてはいけません。指示があるまで前進しようとしてはいけません。
- id: 193
  category: penalties_and_points
  question: 道路、市街地、または幹線道路の一部が冠水している場所で、バリケードを迂回して運転した場合の罰則は何ですか？
  choices:
    A: 1ドルから200ドルの罰金
    B: 懲役刑なしのクラスC軽犯罪
    C: 最大2,000ドルの罰金および/または最大180日の懲役が科されるクラスB軽犯罪
    D: 即座に1年間の免許停止
  answer: C
  explanation: 道路、市街地、または幹線道路の一部が冠水している場所に警告標識やバリケードが設置されている場合、この違反はクラスB軽犯罪となり、最大2,000ドルの罰金および/または最大180日の懲役が科されます。
- id: 194
  category: vehicle_information
  question: 低速車マーク（エンブレム）は、最高速度が以下の速度で走行するように設計された車両に義務付けられています：
  choices:
    A: 15 mph以下
    B: 25 mph以下
    C: 35 mph以下
    D: 45 mph以下
  answer: B
  explanation: 低速車とは、最高速度25 mph以下で走行するように設計された車両のことであり、そのようなすべての車両にエンブレムの装着が義務付けられています。
- id: 195
  category: safe_driving_rules
  question: 曲がる、または停止する前に、どれくらい手前から継続して合図（ウインカー）を出さなければなりませんか？
  choices:
    A: 少なくとも50フィート
    B: 少なくとも100フィート
    C: 少なくとも200フィート
    D: 少なくとも300フィート
  answer: B
  explanation: 曲がる、または停止する前の少なくとも100フィートの間は継続して合図を出し、曲がり終えたら必ず方向指示器を消さなければなりません。
- id: 196
  category: safe_driving_rules
  question: 交差点や踏切から何フィート以内にいる場合、他の車両を追い越すために道路の左側を走行してはいけませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: 交差点や踏切から100フィート以内にいる場合、またはそれらを通過している間は、絶対に道路の左側を走行してはいけません。
- id: 197
  category: safe_driving_rules
  question: マニュアルによると、以下の状況のうち、常に合図を出す必要が「ない」ものはどれですか？
  choices:
    A: 車線を変更するとき
    B: 縁石に平行駐車したスペースから発進するとき
    C: 青信号を直進するとき
    D: 幹線道路（ハイウェイ）に合流、または退出するとき
  answer: C
  explanation: 車線変更、右左折、縦列駐車スペースからの発進、減速や停止、幹線道路への合流や退出、または道路脇への幅寄せを行う際は、常に合図を出さなければなりません。直進する場合は合図を出す必要はありません。
- id: 198
  category: sharing_the_road
  question: 自転車の後部にある特別な旗は、他の運転者に何を示していますか？
  choices:
    A: 自転車の運転者が危険物を運んでいる
    B: 自転車の運転者が初心者である
    C: 自転車の運転者に聴覚障害がある可能性がある
    D: その自転車がレースに参加している
  answer: C
  explanation: 自転車の後部にこの旗が見えた場合は、運転者に聴覚障害がある可能性があるため、減速してください。
- id: 199
  category: signs_and_signals
  question: 建設および維持管理の作業区間（工事区間）における交通規制装置に使用される基本の色は何ですか？
  choices:
    A: 赤
    B: 黄
    C: オレンジ
    D: 緑
  answer: C
  explanation: オレンジ色は、標識、バリケード、垂直パネル、ドラム、コーン、チューブなどの建設および維持管理用装置の基本色です。
- id: 200
  category: safe_driving_rules
  question: 以下の状況を除き、常に道路の右側を走行しなければなりません。例外となるのはどれですか？
  choices:
    A: 丘やカーブに近づくとき
    B: 一方通行の道路を走行するとき
    C: 橋から100フィート以内にいるとき
    D: 踏切に近づくとき
  answer: B
  explanation: 2車線または3車線の道路で他の車両を追い越すとき、一方通行の道路を走行するとき、または道路の右側が塞がれているときを除き、常に道路の右側を走行してください。
- id: 201
  category: signs_and_signals
  question: 固い障害物の前や衝突事故が多発する場所に設置されている樽（バレル）の目的は何ですか？
  choices:
    A: 非常用の飲料水を備蓄するため
    B: 衝撃吸収材として機能し、衝突時の重大性を軽減するため
    C: 横断歩道を示すため
    D: 迂回路を示すため
  answer: B
  explanation: 衝撃吸収材として機能するように設計された樽（バレル）は、衝突時の重大性を軽減します。これらは通常、固い障害物の前や衝突事故が多発する場所に設置されます。
- id: 202
  category: safe_driving_rules
  question: 2車線道路で追い越しをする際、対向車が何フィート以内に接近する前に右側の車線に戻らなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: マニュアルには、前方の車を追い越し、対向車が200フィート以内に接近する前に右側の車線に戻るための十分な時間とスペースがあることを確認しなければならないと記載されています。
- id: 203
  category: safe_driving_rules
  question: 舗装された路肩を使用して右側から追い越しをすることが許可されるのは、次のうちどの条件のときですか？
  choices:
    A: 交通の流れが制限速度を下回っているとき
    B: 追い越そうとしている車両が左折の準備をしているとき
    C: 未舗装の田舎道を運転しているとき
    D: 停車中のスクールバスを迂回したいとき
  answer: B
  explanation: 追い越そうとしている車両が、本線上で減速または停止している場合、故障している場合、または左折の準備をしている場合は、舗装された路肩を通って追い越しをすることができます。
- id: 204
  category: defensive_driving
  question: 他の車両があなたを追い越そうとしているとき、どうすべきですか？
  choices:
    A: 速度を上げて素早く道を譲る
    B: 相手がスピード違反をしている場合は、左に寄って進路を塞ぐ
    C: 速度を上げず、自分の車線を維持する
    D: クラクションを鳴らして自分の存在を知らせる
  answer: C
  explanation: 他の車両が追い越しをしているときは、速度を上げずに自分の車線を維持し、他の運転手が可能な限り安全かつ容易に追い越しできるようにしなければなりません。
- id: 205
  category: defensive_driving
  question: 曲がる前の半ブロック以内に適切な車線に入ることができない場合、最も安全な行動は何ですか？
  choices:
    A: 現在の車線で停止し、交通が途切れるのを待つ
    B: 現在の車線からできるだけ早く曲がる
    C: 曲がらずに、そのまま直進する
    D: 適切な車線に入れるまで車を後退させる
  answer: C
  explanation: マニュアルでは、曲がる前の半ブロック以内に適切な車線に入れない場合は、曲がらずにそのまま直進するよう推奨しています。
- id: 206
  category: safe_driving_rules
  question: 曲がる前に、どれくらい手前から適切な方向指示器（ウィンカー）を出さなければなりませんか？
  choices:
    A: 少なくとも50フィート手前
    B: 少なくとも100フィート手前
    C: 少なくとも200フィート手前
    D: 少なくとも300フィート手前
  answer: B
  explanation: 曲がる少なくとも100フィート手前で、適切な方向指示器を出さなければなりません。
- id: 207
  category: safe_driving_rules
  question: 一方通行の道路から対面通行（双方向）の道路へ左折する場合、どのように曲がり終えるべきですか？
  choices:
    A: 左車線から右車線へ曲がる
    B: 右車線から左車線へ曲がる
    C: 中央車線から右車線へ曲がる
    D: 左車線から左車線へ曲がる
  answer: A
  explanation: 一方通行の道路から左折する場合は、左車線から曲がり始め、同じ進行方向の右車線に入るべきです。
- id: 208
  category: safe_driving_rules
  question: 消火栓からどれくらい以内の距離に車を駐車または停車させることは違法ですか？
  choices:
    A: 10フィート以内
    B: 15フィート以内
    C: 20フィート以内
    D: 30フィート以内
  answer: B
  explanation: 消火栓から15フィート以内に駐車したり、アイドリング状態で停車させたりしてはいけません。
- id: 209
  category: safe_driving_rules
  question: 次の場所のうち、車両を駐車、停止、または停車させることが違法なのはどこですか？
  choices:
    A: 橋の上、または高速道路のトンネル内
    B: 個人の住宅の私道
    C: 市街地以外の舗装された路肩
    D: 商業地域の縁石の横
  answer: A
  explanation: 橋の上や高速道路の高架構造物の上、または高速道路のトンネル内に駐車、停止、またはアイドリング状態で停車させてはいけません。
- id: 210
  category: safe_driving_rules
  question: 交差点の横断歩道からどれくらい以内の距離に車を駐車または停車させることは違法ですか？
  choices:
    A: 10フィート以内
    B: 15フィート以内
    C: 20フィート以内
    D: 30フィート以内
  answer: C
  explanation: 交差点の横断歩道から20フィート以内に駐車したり、アイドリング状態で停車させたりしてはいけません。
- id: 211
  category: safe_driving_rules
  question: 踏切の最も近いレールから何フィート以内に車を駐車してはいけませんか？
  choices:
    A: 15フィート
    B: 20フィート
    C: 30フィート
    D: 50フィート
  answer: D
  explanation: 人が乗っているかどうかにかかわらず、踏切の最も近いレールから50フィート以内に車を駐車してはいけません。
- id: 212
  category: penalties_and_points
  question: 障害者専用駐車スペースに違法に駐車した場合の、初犯の罰則は何ですか？
  choices:
    A: $100から$200の罰金
    B: $250から$500の罰金
    C: $500から$750の罰金
    D: $1,000から$1,250の罰金
  answer: C
  explanation: 障害者専用駐車スペースへの違法駐車は軽犯罪であり、初犯の場合は$500から$750の罰金が科せられます。
- id: 213
  category: driver_responsibility
  question: どのような条件で、障害者用駐車フロントガラス識別カード（プラカード）を使用できますか？
  choices:
    A: 障害のある家族のためにちょっとした用事を済ませる場合
    B: カードが発行された障害者本人を乗せて運転している場合のみ
    C: 現在使用していない友人から借りた場合
    D: 他の通常の駐車スペースがすべて満車の場合
  answer: B
  explanation: テキサス州法では、カードが発行された障害者本人を乗せて運転している場合を除き、障害者用駐車フロントガラス識別カードを使用してはならないと明確に定められています。
- id: 214
  category: defensive_driving
  question: 左側から他の車両を追い越した後、右側の車線に戻るのが安全であるとどのように判断しますか？
  choices:
    A: その車両の50フィート前方に達したとき
    B: 追い越した車がルームミラーで見えるようになったとき
    C: 追い越されたドライバーがヘッドライトを点滅させたとき
    D: 制限速度より10 mph（マイル毎時）速く加速したとき
  answer: B
  explanation: 右側の車線に戻る前に、追い越したばかりの車がルームミラーで見えるようになるまで待ってください。
- id: 215
  category: safe_driving_rules
  question: 夜間、商業地域や住宅街以外の幹線道路（ハイウェイ）に駐車しなければならない場合、どうしなければなりませんか？
  choices:
    A: ハイビームのヘッドライトを点灯する
    B: ハザードランプを点滅させたままにし、ドアの鍵を開けておく
    C: パーキングライトを使用するか、ヘッドライトをロービームのままにしておく
    D: 車のバッテリーを節約するためにすべてのライトを消す
  answer: C
  explanation: 夜間、市街地以外の幹線道路で道路外に駐車できない場合は、パーキングライトを使用するか、ヘッドライトをロービームのままにしておいてください。
- id: 216
  category: vehicle_information
  question: 曲がる準備をする際、実際に曲がっている最中に避けるべきことは何ですか？
  choices:
    A: 両手でハンドルを握ること
    B: あらゆる方向の交通を確認すること
    C: ブレーキやクラッチを使用すること
    D: 適切な右左折車線にとどまること
  answer: C
  explanation: マニュアルでは、曲がる前に適切な速度まで減速するよう指示しており、「曲がっている最中はブレーキやクラッチを使用しないでください」と記載されています。
- id: 217
  category: safe_driving_rules
  question: 障害者用駐車スペースに隣接する縞模様のエリアの目的は何ですか？
  choices:
    A: オートバイの駐車用に指定されている。
    B: 車椅子用リフトのためのものである。
    C: 商業用貨物の積み下ろし用に指定されている。
    D: 小型車専用である。
  answer: B
  explanation: マニュアルによると、障害者用駐車スペースに隣接する縞模様のエリアは車椅子用リフトのためのものであるため、そこに駐車してはいけません。
- id: 218
  category: safe_driving_rules
  question: 自動車から離れて放置する場合、法律で義務付けられていないものは次のうちどれですか（リモートスターターを使用する場合を除く）？
  choices:
    A: エンジンを切ること
    B: イグニッションをロックすること
    C: イグニッションからキーを抜くこと
    D: ハザードランプを点灯させること
  answer: D
  explanation: エンジンを切り、イグニッションをロックし、キーを抜き、パーキングブレーキをかけずに、車をアイドリング状態のまま放置することは違法です。ハザードランプの点灯は義務付けられていません。
- id: 219
  category: safe_driving_rules
  question: 対面通行の道路で縦列駐車をする場合、車の右側の車輪は、右側の縁石または道路の端からどのくらい近づけなければなりませんか？
  choices:
    A: 6インチ以内
    B: 12インチ以内
    C: 18インチ以内
    D: 24インチ以内
  answer: C
  explanation: 対面通行の道路では、ドライバーは車の右側の車輪を右側の縁石または道路の端から18インチ以内に寄せて駐車しなければなりません。
- id: 220
  category: safe_driving_rules
  question: ギアやトランスミッションをニュートラルにして下り坂を惰性走行（コースティング）することは合法ですか？
  choices:
    A: はい、ただし地方部でのみ合法です。
    B: はい、燃料を節約するための推奨される方法です。
    C: いいえ、違法です。
    D: いいえ、マニュアル車を運転している場合を除き違法です。
  answer: C
  explanation: マニュアルには、ギアやトランスミッションをニュートラルにして下り坂を惰性走行することは違法であると明記されています。
- id: 221
  category: defensive_driving
  question: 良好な道路状況において、時速30マイル（30 mph）を超える速度で走行する場合、推奨される最小車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: C
  explanation: 良好な道路状況において、時速30マイル（30 mph）を超える速度で走行する場合は、車間に4秒の隙間を保つ必要があります。
- id: 222
  category: defensive_driving
  question: 前の車との車間距離が近すぎるかどうかは、どのようにして判断できますか？
  choices:
    A: 前の車のサイドミラーが見えない。
    B: 前の車が通過した固定物に、2秒未満で到達してしまう。
    C: 前の車と全く同じ速度で走行している。
    D: 前の車のナンバープレートがはっきりと読める。
  answer: B
  explanation: マニュアルの特記には、「前の車が固定物を通過してから、あなたが同じ固定物に到達するまでの時間が2秒未満の場合、車間距離が近すぎます」と記載されています。
- id: 223
  category: defensive_driving
  question: テキサス州運転免許ハンドブック（Texas Driver Handbook）によると、平均的な人が考えて反応し、ブレーキをかけるまでにどれくらいの時間がかかりますか？
  choices:
    A: 0.5秒
    B: 1秒
    C: 1.5秒
    D: 2秒
  answer: C
  explanation: 平均的な人が考えて反応し、ブレーキをかけるまでには1.5秒かかります。
- id: 224
  category: defensive_driving
  question: 時速60マイル（60 mph）で走行している場合、静止している時と比べて視野はどのように変化しますか？
  choices:
    A: 約2/3に減少する。
    B: 約1/2に減少する。
    C: 約2/5に減少する。
    D: 約1/5に減少する。
  answer: D
  explanation: マニュアルには、静止時の視野が180度以上であるのに対し、時速60マイル（60 mph）では視野が約1/5に減少すると記載されています。
- id: 225
  category: safe_driving_rules
  question: 標識で別途指定されていない場合、市街地（Urban District）の最高速度制限はどれくらいですか？
  choices:
    A: 時速20マイル（20 mph）
    B: 時速25マイル（25 mph）
    C: 時速30マイル（30 mph）
    D: 時速35マイル（35 mph）
  answer: C
  explanation: 速度制限の表には、市街地（Urban District）の最高速度制限は時速30マイル（30 mph）と記載されています。
- id: 226
  category: safe_driving_rules
  question: 自治体などの機関が速度制限を設定または変更する場合、昼間と夜間の速度制限はどのように比較されなければなりませんか？
  choices:
    A: 夜間の制限速度は昼間より時速5マイル（5 mph）低くしなければならない。
    B: 夜間の制限速度は昼間より時速10マイル（10 mph）低くしなければならない。
    C: 昼間と夜間で同じ制限速度を設定しなければならない。
    D: 昼間の制限速度は学校の授業時間帯にのみ適用される。
  answer: C
  explanation: 速度制限を設定または変更する機関は、昼間と夜間で同じ制限速度を設定しなければなりません。
- id: 227
  category: penalties_and_points
  question: 公道レース（street racing）で有罪判決を受けた場合の刑事罰の範囲はどれくらいですか？
  choices:
    A: クラスC軽犯罪からクラスA軽犯罪まで
    B: クラスB軽犯罪から第2級重罪まで
    C: 交通違反切符と500ドルの罰金
    D: 第1級重罪のみ
  answer: B
  explanation: スピードレース（公道レース）で有罪判決を受けた場合の刑事罰は、クラスB軽犯罪から第2級重罪の範囲に及びます。
- id: 228
  category: defensive_driving
  question: 乾燥した平坦な舗装道路で、ブレーキとタイヤの状態が良好な場合、時速50マイル（50 mph）で走行しているときの概算の総停止距離はどれくらいですか？
  choices:
    A: 109フィート
    B: 164フィート
    C: 229フィート
    D: 303フィート
  answer: C
  explanation: 概算停止距離の表によると、時速50マイル（50 mph）で走行している場合、停止するのに229フィート必要です。
- id: 229
  category: safe_driving_rules
  question: 現在の駐車スペースから発進する際、他の運転手に知らせるために何をすべきですか？
  choices:
    A: クラクションを2回鳴らす。
    B: ハイビームを点滅させる。
    C: 方向指示器（ウィンカー）を使用する。
    D: 窓から手を出して振る。
  answer: C
  explanation: マニュアルには、「現在の駐車スペースから発進することを他の運転手に知らせるために、必ず方向指示器を使用してください」と記載されています。
- id: 230
  category: safe_driving_rules
  question: 近代的なラウンドアバウト（環状交差点）では、交通はどの方向に流れますか？
  choices:
    A: 中央島の周りを時計回り
    B: 中央島の周りを反時計回り
    C: 中央島を直進して通り抜ける
    D: 車線に応じて時計回りと反時計回りの両方
  answer: B
  explanation: マニュアルには、近代的なラウンドアバウトは一方通行の円形交差点であり、交通は中央島の周りを反時計回りに流れると記載されています。
- id: 231
  category: defensive_driving
  question: 従来の信号機のある十字路交差点と比較して、現代のラウンドアバウト（環状交差点）には潜在的な交錯点がいくつありますか？
  choices:
    A: 32か所に対して8か所の潜在的な交錯点
    B: 32か所に対して16か所の潜在的な交錯点
    C: 8か所に対して32か所の潜在的な交錯点
    D: 16か所に対して4か所の潜在的な交錯点
  answer: A
  explanation: マニュアルによると、従来の信号機のある十字路交差点には32か所の潜在的な交錯点があるのに対し、現代のラウンドアバウトの設計では潜在的な交錯点はわずか8か所です。
- id: 232
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）内を走行中に緊急車両が接近してきた場合、どうすればよいですか？
  choices:
    A: 通過させるために、交差点内ですぐに停止する
    B: 加速して、できるだけ早くラウンドアバウトから退出する
    C: まず交差点から退出してから、緊急車両のために車を寄せて停止する
    D: 中央島の左側に車を寄せる
  answer: C
  explanation: マニュアルには明確に次のように記載されています。「ラウンドアバウト内では緊急車両のために停止しないでください。まず交差点から退出してから、緊急車両のために車を寄せて停止してください。」
- id: 233
  category: safe_driving_rules
  question: マニュアルによると、ピックアップトラック、SUV、およびその他のほとんどの車両が押し流されるには、どのくらいの深さの激しい水流が必要ですか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 2フィート
  answer: D
  explanation: マニュアルには、2フィートの激しい水流でピックアップトラック、SUV、およびその他のほとんどの車両が押し流されると記載されています。
- id: 234
  category: defensive_driving
  question: 冠水した道路で車がエンストした場合、推奨される行動は何ですか？
  choices:
    A: 車内にとどまり、救急隊員の到着を待つ
    B: すぐに車から降りて、高台に避難する
    C: 窓を開けて、シートベルトを締めたままにする
    D: エンジンがかかるまで何度も再始動を試みる
  answer: B
  explanation: 国立気象局およびテキサス州危機管理庁の職員は、冠水した道路で車がエンストした場合は、すぐに車から降りて高台に避難するよう述べています。
- id: 235
  category: sharing_the_road
  question: 平坦な幹線道路において、トラックを追い越すには乗用車を追い越す場合と比べてどのくらい長く時間がかかりますか？
  choices:
    A: 1〜2秒長くかかる
    B: 3〜5秒長くかかる
    C: 5〜7秒長くかかる
    D: 7〜10秒長くかかる
  answer: B
  explanation: マニュアルには、平坦な幹線道路では、トラックを追い越すには乗用車を追い越す場合と比べて3〜5秒長くかかると記されています。
- id: 236
  category: sharing_the_road
  question: あなたがトラックを追い越した後に、トラックの運転手がヘッドライトを点滅させた場合、それは何を意味しますか？
  choices:
    A: あなたの運転が遅すぎるため、スピードを上げる必要がある
    B: 前方に危険物や警察官がいる
    C: トラックの前に車線変更しても安全であるという合図
    D: あなたのハイビームがトラックの運転手の目を眩ませている
  answer: C
  explanation: あなたが追い越した後にトラックの運転手がライトを点滅させた場合、それはトラックの前に車線変更しても安全であるという合図です。
- id: 237
  category: sharing_the_road
  question: 対向車線から来るトラックとすれ違う際、なぜ車線の端にできるだけ寄るべきなのですか？
  choices:
    A: 側面衝突を避け、車両を互いに遠ざけようとする乱気流を減らすため
    B: 側面衝突を避け、車両を互いに引き寄せようとする乱気流を減らすため
    C: トラックの運転手にあなたのヘッドライトを見やすくするため
    D: 石や破片がフロントガラスに当たるのを防ぐため
  answer: A
  explanation: マニュアルでは、側面衝突を避け、乱気流を減らすためにできるだけ端に寄ることを推奨しており、「乱気流は車両を互いに遠ざけようとするものであり、引き寄せるものではない」と記しています。
- id: 238
  category: sharing_the_road
  question: 時速55マイル（55 mph）で走行している満載のトラクタートレーラーが完全に停止するまでに、およそどのくらいの距離が必要になる場合がありますか？
  choices:
    A: 150フィート
    B: 240フィート
    C: 300フィート
    D: 400フィート以上
  answer: D
  explanation: 時速55マイル（55 mph）で走行する平均的な乗用車は約240フィートで停止しますが、満載のトラクタートレーラーが完全に停止するには400フィート以上かかる場合があります。
- id: 239
  category: sharing_the_road
  question: トラクタートレーラーと道路を共有する運転手が死角を避けるための、優れた経験則は何ですか？
  choices:
    A: トラックのテールランプが見えれば、安全な距離にいる
    B: トラックのサイドミラーに運転手の姿が見えなければ、運転手からもあなたは見えていない
    C: 常にトラックのリアバンパーから車1台分の距離以内を保つ
    D: トラックの右側を走行していれば、安全地帯にいる
  answer: B
  explanation: マニュアルには、優れた経験則として次のように記載されています。「トラックのサイドミラーに運転手の姿が見えなければ、運転手からもあなたは見えていない。」
- id: 240
  category: sharing_the_road
  question: 夜間にトラックの後ろを走行する際、常にヘッドライトを下向き（ロービーム）にしなければならないのはなぜですか？
  choices:
    A: 明るいライトは車のバッテリーの消耗を早めるため
    B: 明るいライトがトラックの大きなサイドミラーに反射して、トラックの運転手の目を眩ませるため
    C: トラックにはハイビームによって妨害される特殊なセンサーがあるため
    D: 複数車線の幹線道路でハイビームを使用することは違法であるため
  answer: B
  explanation: 夜間にトラックの後ろを走行する際は、後続車の明るいライトがトラックの大きなサイドミラーに反射してトラックの運転手の目を眩ませるため、常にヘッドライトを下向き（ロービーム）にしてください。
- id: 241
  category: sharing_the_road
  question: 交差点でトラックを右側から追い越すのが危険なのはなぜですか？
  choices:
    A: トラックは停止状態から乗用車よりもはるかに速く加速するため
    B: トラックは大回りをして右折するため、右折の直前に右側にスペースを空けることがあるため
    C: 市街地の交通では、通常トラック運転手の右側ミラーが無効になっているため
    D: トラックは右折する前に必ずバックギアに入れるため
  answer: B
  explanation: トラックは大回りをして右折するため、右折の直前に右側にスペースを空けることがあります。右側から追い越そうとすると、トラックが右折した際に衝突する恐れがあります。
- id: 242
  category: sharing_the_road
  question: 複数車線の高速道路で、トラクタートレーラーが中央車線を走行することが多いのはなぜですか？
  choices:
    A: 高速道路への合流や退出などの局地的な交通の流れを助け、衝突を避けるための選択肢を増やすため
    B: 中央車線が法的に唯一のトラック専用車線として指定されているため
    C: 乗用車に両側から追い越されるのを防ぐため
    D: 通常、中央車線はより強固な素材で舗装されているため
  answer: A
  explanation: 複数車線の高速道路では、トラクタートレーラーは高速道路への合流や退出などの局地的な交通の流れを助け、衝突を避けるために車線を変更しなければならない場合の運転手の選択肢を増やすために中央車線を走行します。
- id: 243
  category: sharing_the_road
  question: 交差点で乗用車とトラックの衝突事故が多数発生するのはなぜですか？
  choices:
    A: トラックは黄信号で停止する義務がないため
    B: 乗用車からはトラック越しに信号機が見えないため
    C: トラクタートレーラーはその大きさゆえに、実際の速度よりも遅く走っているように見えることが多いため
    D: トラックの運転手は運転席が高いため信号機が見えないため
  answer: C
  explanation: マニュアルでは、トラクタートレーラーはその大きさゆえに実際の速度よりも遅く走っているように見えることが多く、そのため交差点で運転手がトラックの接近距離や速度を見誤ることが原因であると説明されています。
- id: 244
  category: sharing_the_road
  question: マニュアルによると、運転手が接近してくるオートバイを見落とす理由の一つは何ですか？
  choices:
    A: オートバイにはヘッドライトの装備が義務付けられていないため
    B: オートバイの車体の輪郭は乗用車の輪郭よりもはるかに小さいため
    C: オートバイは通常、乗用車よりもはるかに遅い速度で走行するため
    D: オートバイの運転手は法的に路肩を走行することが義務付けられているため
  answer: B
  explanation: 運転手がオートバイを見落とす一般的な理由の一つは、オートバイの車体の輪郭が乗用車の輪郭よりもはるかに小さく、視認しにくいためです。
- id: 245
  category: sharing_the_road
  question: 米国運輸省道路交通安全局（NHTSA）によると、オートバイの運転手が交通事故で死亡する確率は、乗用車の乗員と比べてどのくらい高いですか？
  choices:
    A: 10倍高い
    B: 20倍高い
    C: 35倍高い
    D: 50倍高い
  answer: C
  explanation: マニュアルには、米国運輸省道路交通安全局（NHTSA）によると、オートバイの運転手が交通事故で死亡する確率は乗用車の乗員に比べて約35倍高いと記載されています。
- id: 246
  category: sharing_the_road
  question: 乗用車とオートバイの間で最も一般的な衝突事故のタイプは何ですか？
  choices:
    A: 一時停止標識で乗用車がオートバイに追突する事故
    B: 交差点で乗用車がオートバイの目の前で左折する事故
    C: オートバイが乗用車の右側から追い越す事故
    D: 高速道路で乗用車とオートバイが側面衝突する事故
  answer: B
  explanation: マニュアルには、乗用車とオートバイの最も一般的な衝突事故は、交差点で乗用車の運転手がオートバイの目の前で左折する際に発生すると記されています。
- id: 247
  category: safe_driving_rules
  question: オートバイの後ろを走行する際、推奨される車間距離はどのくらいですか？
  choices:
    A: 2〜3秒
    B: 少なくとも4〜6秒
    C: 車両1台分
    D: 10秒
  answer: B
  explanation: マニュアルでは、緊急時にオートバイの運転手が回避行動をとったり停止したりするのに十分な時間を確保できるよう、オートバイの後ろを走行する際は少なくとも4〜6秒のより長い車間距離を空けるよう推奨しています。
- id: 248
  category: defensive_driving
  question: オートバイの方向指示器（ウィンカー）が点滅していても、運転手が進行する前にオートバイが確実に曲がるのを待つべきなのはなぜですか？
  choices:
    A: オートバイの方向指示器は通常オートキャンセル機能がなく、運転手が消し忘れることが時々あるため
    B: オートバイは電気系統の故障がよくあるため
    C: オートバイの運転手は減速を示すために方向指示器を使用するため
    D: いずれかの車両の方向指示器が点滅している間に進行することは違法であるため
  answer: A
  explanation: マニュアルでは、オートバイの方向指示器は通常オートキャンセル機能がなく、運転手が消し忘れることが時々あるため、点滅している方向指示器に惑わされないよう運転手に警告しています。
- id: 249
  category: sharing_the_road
  question: 運転手はオートバイの車線スペースをどのように扱うべきですか？
  choices:
    A: オートバイが一番右側を走行している場合は車線を共有する
    B: オートバイに車線幅全体を与え、車線を共有しようとしない
    C: 十分なスペースがある場合は、同じ車線内でオートバイを追い越す
    D: より速い車を通過させるために、オートバイを路肩に追いやる
  answer: B
  explanation: マニュアルには、オートバイに車線幅全体を与えるよう記載されています。十分なスペースがあるように見えても、オートバイには車線全体を使用する権利があり、車線を共有しようとしてはなりません。
- id: 250
  category: safe_driving_rules
  question: 交差点、信号、または踏切などでオートバイの後ろに停止する際、どのくらいのスペースを空けることが推奨されていますか？
  choices:
    A: 車両半分
    B: 車両1台分
    C: 車両3台分
    D: 4〜6秒
  answer: B
  explanation: 自分の車が追突された場合にオートバイへの衝撃を防ぐため、オートバイの後ろに停止する際は車両1台分のスペースを空けることが推奨されています。
- id: 251
  category: license_system
  question: 2020年現在、テキサス州の二輪車運転者訓練・安全プログラム（Motorcycle Operator Training and Safety
    program）を管理している機関はどれですか？
  choices:
    A: テキサス州公安局 (DPS)
    B: テキサス州運輸省 (TxDOT)
    C: テキサス州ライセンス規制局 (TDLR)
    D: 米国運輸省道路交通安全局 (NHTSA)
  answer: C
  explanation: テキサス州議会は、2020年に二輪車運転者訓練・安全プログラムの管理をDPSからTDLRに移管しました。
- id: 252
  category: sharing_the_road
  question: 運転手や歩行者が常に高い警戒を保つ必要がある、ライトレール（次世代型路面電車）の列車の特徴は次のうちどれですか？
  choices:
    A: 一般の交通よりもかなり速く走行する。
    B: 非常に静かで、多くの場合、ほとんどのバスや車よりも静かである。
    C: 警告なしに頻繁に線路を変更する。
    D: 緊急車両よりも常に優先権がある。
  answer: B
  explanation: マニュアルでは、ライトレールは非常に静かであり、実際にはほとんどのバスや車よりも静かであるため、接近する音が聞こえない場合があることが強調されています。
- id: 253
  category: sharing_the_road
  question: 自転車が可能な限り右端を走行する代わりに、車線全体を使用することが許可されるのはどのような条件のときですか？
  choices:
    A: 自転車が制限速度以下で走行しているとき。
    B: 車線の幅が基準未満であり、車と並走して共有するのが安全ではないとき。
    C: 自転車が複数車線の幹線道路を走行しているとき。
    D: 状況に関係なく、自転車は常に一番右側を走行しなければならない。
  answer: B
  explanation: 車線の幅が基準未満であり、車と自転車が安全に並走して車線を共有できない場合、自転車は車線全体を使用することができます。
- id: 254
  category: safe_driving_rules
  question: 自転車の交通の近くで右折の準備をする際、運転手はどうすべきですか？
  choices:
    A: 加速して自転車を追い越してから右折する。
    B: クラクションを鳴らして、自転車に道を譲るよう警告する。
    C: 自転車の進路を直接横切って右折する。
    D: 減速し、自転車の交通に合流して安全に右折する。
  answer: D
  explanation: マニュアルには、運転手は右折の準備をする際、自転車の進路を直接横切ることを避け、減速して自転車の交通に合流すべきであると記載されています。
- id: 255
  category: sharing_the_road
  question: 道路上での自転車の権利を正確に説明している記述はどれですか？
  choices:
    A: 自転車はすべての自動車に優先権を譲らなければならない。
    B: 自転車は歩道または指定された自転車道のみを走行するように制限されている。
    C: 自転車に乗る人は、車両の運転手と同じすべての権利と責任を持つ。
    D: 自転車は制限速度が35 mph未満の道路でのみ許可されている。
  answer: C
  explanation: マニュアルには次のように明記されています。「自転車は車両です。自転車に乗る人は、車両の運転手と同じすべての権利と責任を持ちます。」
- id: 256
  category: driver_responsibility
  question: マニュアルによると、注意散漫により運転手の反応が0.5秒遅れた場合、衝突事故の発生率はどうなりますか？
  choices:
    A: 衝突事故が25%増加する
    B: 衝突事故が50%増加する
    C: 衝突事故が2倍になる
    D: 衝突事故が3倍になる
  answer: C
  explanation: マニュアルには、「注意散漫により運転手の反応が0.5秒遅れると、衝突事故は2倍になる」と記載されています。
- id: 257
  category: defensive_driving
  question: オートバイの運転手が突然速度を変えたり、車線内の位置を調整したりするのはなぜですか？
  choices:
    A: 後続の交通を意図的に妨害するため。
    B: くぼみや砂利など、天候、道路、または交通状況の変化に対応するため。
    C: オートバイは一定の速度を維持できないため。
    D: Uターンしようとしていることを合図するため。
  answer: B
  explanation: オートバイの運転手は、天候、道路、または交通状況の変化（くぼみ、砂利、踏切、濡れた路面や滑りやすい路面など）に対応するため、突然速度を変えたり、車線内の位置を調整したりすることがあります。
- id: 258
  category: safe_driving_rules
  question: ライトレール（次世代型路面電車）の線路付近を運転する際の重要な安全規則は何ですか？
  choices:
    A: ハザードランプを点灯させたままにすれば、線路上に駐車してもよい。
    B: 列車が見えない場合は、踏切の遮断機を迂回して運転してもよい。
    C: 線路上を運転したり、停車したり、駐車したりしてはならない。
    D: 遅れを避けるため、踏切まで列車と競争すべきである。
  answer: C
  explanation: ライトレールの安全規則には次のように明記されています。「線路上を運転したり、停車したり、駐車したりしないでください。それは危険であり、違法です。」
- id: 259
  category: sharing_the_road
  question: 一時停止標識のある交差点での車と自転車の衝突事故の一般的な原因は何ですか？
  choices:
    A: 自転車が交差点を速すぎる速度で通過する。
    B: 運転手が一時停止標識から発進する際、交差する自転車の交通に優先権を譲らない。
    C: 自転車が手信号を使用しない。
    D: 運転手が一時停止標識で長すぎる時間停止する。
  answer: B
  explanation: 運転手が引き起こす車と自転車の衝突事故で最も一般的な原因の1つは、運転手が一時停止標識から発進する際、交差する自転車の交通に優先権を譲らないことです。
- id: 260
  category: safe_driving_rules
  question: 運転中の注意散漫を防ぐための推奨されるヒントは、次のうちどれですか？
  choices:
    A: 低速で運転しながらミラーを調整する
    B: 眠気を覚ますために複雑な会話をする
    C: 運転を始める前に地図を確認し、ルートを計画する
    D: 赤信号で停止しているときにのみテキストメッセージを送信する
  answer: C
  explanation: 注意散漫を防ぐため、マニュアルでは「運転を始める前に地図を確認し、ルートを計画する」ことを推奨しています。
- id: 261
  category: safe_driving_rules
  question: 運転中に合法的に携帯電話を使用できるのはどのような状況ですか？
  choices:
    A: 返信しない場合にテキストメッセージを読むため
    B: 警察などの法執行機関に連絡するため、または緊急時
    C: 時速20マイル未満で走行している場合
    D: ハンズフリー機器を使用してテキストメッセージを送信する場合
  answer: B
  explanation: マニュアルには次のように記載されています。「警察などの法執行機関に連絡するため、または緊急時には携帯電話を使用することができます。」
- id: 262
  category: alcohol_drugs_health
  question: アルコールを飲んだり薬物を使用したりした際、最初に現れる影響の1つは何ですか？
  choices:
    A: 判断力が低下し、視覚が損なわれる
    B: 音に対する反応時間が速くなる
    C: 速度を判断する能力が向上する
    D: 身体の協調性が高まる
  answer: A
  explanation: マニュアルによると、「アルコールを飲んだり薬物を使用したりした際、最初に現れる影響の1つは、判断力が低下し、視覚が損なわれることです...」
- id: 263
  category: alcohol_drugs_health
  question: カフェインは飲酒運転者にどのような影響を与えますか？
  choices:
    A: 車両を操作する能力を向上させる
    B: 酔いが覚めるまでの時間を早める
    C: 眠気を覚ます効果はあるが、酔いを覚ますことはできない
    D: 血中アルコール濃度を低下させる
  answer: C
  explanation: マニュアルには次のように記されています。「カフェインは眠気を感じている運転者の目を覚ますのに役立ちますが、飲酒運転者の酔いを覚ますことはできません。研究によると、通常の量のカフェインでは飲酒運転者の車両操作能力は向上しないことが示されています。」
- id: 264
  category: alcohol_drugs_health
  question: アルコールと他の薬物を混ぜて摂取することの危険な結果は何ですか？
  choices:
    A: アルコールが他の薬物の影響を隠してしまう可能性がある
    B: アルコールが精神安定剤の効果を中和する
    C: 運転者の反応速度を向上させる
    D: 薬物の全体的な相乗効果を減少させる
  answer: A
  explanation: マニュアルでは、複数の薬物を摂取することは危険であると警告しています。「他の薬物の全体的な影響を増幅させるだけでなく、アルコールがそれらの薬物の影響を隠してしまい、誤った判断を下すリスクを高めるためです...」
- id: 265
  category: alcohol_drugs_health
  question: テキサス州では、21歳以上の人は血中アルコール濃度（BAC）がどのくらいの場合、法的に酩酊状態（飲酒運転）とみなされますか？
  choices:
    A: 0.04以上
    B: 0.06以上
    C: 0.08以上
    D: 0.10以上
  answer: C
  explanation: マニュアルには次のように記載されています。「テキサス州では、21歳以上の人は血中アルコール濃度（BAC）が0.08以上の場合、法的に酩酊状態とみなされます。」
- id: 266
  category: penalties_and_points
  question: 自動車の乗車スペースで開封済みのアルコール容器を所持して有罪となった場合の最高罰金額はいくらですか？
  choices:
    A: 200ドル
    B: 500ドル
    C: 1,000ドル
    D: 2,000ドル
  answer: B
  explanation: 自動車の乗車スペースで開封済みのアルコール容器を所持して有罪となった場合、500ドル以下の罰金が科せられます。
- id: 267
  category: alcohol_drugs_health
  question: アルコールの影響を最小限に抑え、酔いを覚ますための唯一の方法は次のうちどれですか？
  choices:
    A: 冷たいシャワーを浴びる
    B: ブラックコーヒーを飲む
    C: 激しい運動をする
    D: 時間
  answer: D
  explanation: マニュアルは酔いを覚ますことに関する迷信を否定し、次のように述べています。「体重、飲酒量、食事の摂取量に基づく『時間』だけが、アルコールの影響を最小限に抑えることができます。」
- id: 268
  category: alcohol_drugs_health
  question: 摂取したアルコール飲料1杯分を体が分解して排出するのに、およそどのくらいの時間がかかりますか？
  choices:
    A: 30分
    B: 1時間
    C: 2時間
    D: 4時間
  answer: B
  explanation: マニュアルによると、「摂取したアルコール飲料1杯分を体が排出するのに約1時間かかります。」
- id: 269
  category: penalties_and_points
  question: 未成年者が自動車を運転する場合、テキサス州のゼロ・トレランス（不寛容）法は何を意味しますか？
  choices:
    A: 罰則なしでBAC 0.02まで許容される
    B: 運転1時間につき1杯の飲酒が許可される
    C: 体内から検出可能な量のアルコールが少しでもあれば犯罪となる
    D: BACが0.08以上の場合にのみ罰せられる
  answer: C
  explanation: ゼロ・トレランスとは、未成年者が「公共の場所で自動車を運転中に、体内から検出可能な量のアルコールが少しでもあった場合...その未成年者は未成年者飲酒運転（DUI）の犯罪を犯したことになる」という意味です。
- id: 270
  category: penalties_and_points
  question: 未成年者の運転を伴わないアルコール関連の初回違反に対する、運転免許の停止期間はどのくらいですか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 180日間
  answer: A
  explanation: 未成年者の運転を伴わないアルコール関連の初回違反の場合、罰則として「運転免許が30日間停止される（免許を持っていない場合は取得の権利が拒否される）」ことが含まれます。
- id: 271
  category: defensive_driving
  question: 次のうち、他の運転手が注意散漫（わき見運転など）になっている可能性がある兆候はどれですか？
  choices:
    A: 一定の速度を保っている
    B: 一貫性のない速度で走行している
    C: 方向指示器（ウィンカー）を適切に使用している
    D: 安全な車間距離を保っている
  answer: B
  explanation: 注意散漫な運転手を認識するために、マニュアルでは「一貫性のない速度で走行している車両」に注意するようアドバイスしています。
- id: 272
  category: alcohol_drugs_health
  question: マニュアルによると、一般的な社交的用量のマリファナは運転手にどのような影響を与えますか？
  choices:
    A: 感覚および知覚能力を向上させる
    B: 集中力に影響を与えない
    C: 感覚および知覚能力を低下させる
    D: 運転手の協調性を高め、より機敏にする
  answer: C
  explanation: マニュアルには「マリファナの影響下にある人は、感覚および知覚能力が低下する」と記載されています。
- id: 273
  category: alcohol_drugs_health
  question: 暗黙の同意法（Implied Consent Law）の下で、未成年者が呼気または血液のサンプルの提供を拒否した場合の初回違反の罰則は何ですか？
  choices:
    A: 60日間の免許停止
    B: 90日間の免許停止
    C: 180日間の免許停止
    D: 1年間の免許停止
  answer: C
  explanation: 未成年者がサンプルの提供を拒否した初回違反の場合、運転免許証が180日間停止されます（免許を持っていない場合は取得の権利が拒否されます）。
- id: 274
  category: penalties_and_points
  question: 未成年者が呼気または血液のサンプルを提供し、血中アルコール濃度（BAC）の法定基準値0.08未満であっても検出可能な量のアルコールが確認された場合、初回違反での免許停止期間はどれくらいですか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 120日間
  answer: B
  explanation: 未成年者がサンプルを提供し、法定基準値0.08 BAC未満であっても検出可能な量のアルコールが確認された場合、初回違反で60日間の免許停止となります。
- id: 275
  category: penalties_and_points
  question: 15歳未満の同乗者がいる状態での飲酒運転（DWI）は、どのような種類の犯罪になりますか？
  choices:
    A: クラスAの軽犯罪（Misdemeanor）
    B: クラスBの軽犯罪（Misdemeanor）
    C: 州刑務所行きの重罪（State jail felony）
    D: 第2級重罪（Second degree felony）
  answer: C
  explanation: 15歳未満の同乗者がいるDWIは州刑務所行きの重罪（State jail felony）であり、最高10,000ドルの罰金および180日から2年間の州刑務所への収監が科せられます。
- id: 276
  category: alcohol_drugs_health
  question: 成人が分析のための血液または呼気のサンプルの提供を拒否した場合、初回違反で運転免許証はどのくらいの期間停止されますか？
  choices:
    A: 90日間
    B: 180日間
    C: 365日間
    D: 730日間
  answer: B
  explanation: 分析のための血液または呼気のサンプルの提供を拒否した人は、初回違反で運転免許証が180日間停止されます。
- id: 277
  category: alcohol_drugs_health
  question: 次のうち、12オンスの缶ビールとほぼ同じ量のアルコールが含まれているものはどれですか？
  choices:
    A: 3オンスのグラスワイン
    B: 5オンスのグラスワイン
    C: 10オンスのワインクーラー
    D: 3オンスの蒸留酒（リカー）を使ったミックスドリンク
  answer: B
  explanation: 1杯のアルコール飲料の目安は、12オンスの缶ビール、1.5オンスの蒸留酒を使ったミックスドリンク、または5オンスのグラスワインです。これらはすべてほぼ同じ量のアルコールを含んでいます。
- id: 278
  category: penalties_and_points
  question: 未成年者の初回の飲酒運転（DWI）違反において、開封済みのアルコール飲料の容器を所持していた場合、最低収監期間はどれくらいに増えますか？
  choices:
    A: 3日間
    B: 6日間
    C: 10日間
    D: 30日間
  answer: B
  explanation: 未成年者の初回のDWI違反において、開封済みのアルコール飲料の容器を所持していた場合、最低収監期間は6日間に増えます。
- id: 279
  category: penalties_and_points
  question: 成人の初回の飲酒運転（DWI）違反に対する最高罰金額はいくらですか？
  choices:
    A: 最高500ドル
    B: 最高1,000ドル
    C: 最高2,000ドル
    D: 最高4,000ドル
  answer: C
  explanation: 成人の初回のDWI違反の罰則には、最高2,000ドルの罰金が含まれます。
- id: 280
  category: penalties_and_points
  question: 酩酊過失致死罪（Intoxication manslaughter）は次のように分類されます：
  choices:
    A: クラスAの軽犯罪（Misdemeanor）
    B: 州刑務所行きの重罪（State jail felony）
    C: 第3級重罪（Third degree felony）
    D: 第2級重罪（Second degree felony）
  answer: D
  explanation: 酩酊過失致死罪は第2級重罪（Second degree felony）であり、最高10,000ドルの罰金および2年から20年の懲役が科せられます。
- id: 281
  category: alcohol_drugs_health
  question: テキサス州において、血中アルコール濃度（BAC）が0.08以上であること以外に、法的な酩酊の基準はどのように定義されていますか？
  choices:
    A: 体内に検出可能な量のアルコールがあること
    B: 精神的または身体的機能の正常な使用を失わせる結果となる任意の量
    C: 呼気検査を拒否すること
    D: 車内に開封済みの容器を置いて運転すること
  answer: B
  explanation: テキサス州の法定基準は、血中アルコール濃度（BAC）0.08、または精神的または身体的機能の正常な使用を失わせる結果となる任意の量です。
- id: 282
  category: penalties_and_points
  question: 未成年者が呼気または血液の検体提供を2回目以降に拒否した場合の罰則は何ですか？
  choices:
    A: 運転免許証の180日間の停止
    B: 運転免許証の1年間の停止
    C: 運転免許証の2年間の停止
    D: 運転免許証の永久取消し
  answer: C
  explanation: 未成年者が検体提供を拒否する2回目以降の違反の場合、運転免許証は2年間停止されます。
- id: 283
  category: penalties_and_points
  question: 未成年者のアルコールおよび薬物の影響下での運転（DUI）の初回違反には、何時間の社会奉仕活動が必要ですか？
  choices:
    A: 8〜12時間
    B: 20〜40時間
    C: 40〜60時間
    D: 80〜100時間
  answer: B
  explanation: 未成年者の初回のDUI違反はクラスCの軽犯罪であり、20〜40時間の社会奉仕活動が義務付けられています。
- id: 284
  category: alcohol_drugs_health
  question: マニュアルによると、次のどの組み合わせがほぼ同じアルコール量を表していますか？
  choices:
    A: 16オンスの缶ビール、2オンスの蒸留酒を使ったミックスドリンク、または8オンスのグラスワイン
    B: 12オンスの缶ビール、1.5オンスの蒸留酒を使ったミックスドリンク、または5オンスのグラスワイン
    C: 8オンスの缶ビール、1オンスの蒸留酒を使ったミックスドリンク、または4オンスのグラスワイン
    D: 12オンスの缶ビール、2オンスの蒸留酒を使ったミックスドリンク、または6オンスのグラスワイン
  answer: B
  explanation: マニュアルには、1杯の酒には12オンスの缶ビール、1.5オンスの蒸留酒を使ったミックスドリンク、または5オンスのグラスワインが含まれ、これらはすべてほぼ同じ量のアルコールを含んでいると記載されています。
- id: 285
  category: driver_responsibility
  question: 法執行官による調査が行われず、1,000ドル以上の物的損害が発生した事故に関与した場合、テキサス州運輸省（TxDOT）に書面による報告書を提出する期限はいつですか？
  choices:
    A: 事故発生日から5日以内
    B: 事故発生日から10日以内
    C: 事故発生日から15日以内
    D: 事故発生日から30日以内
  answer: B
  explanation: 事故が法執行機関によって調査されず、1,000ドル以上の損害が発生した場合、事故発生日から10日以内に書面による報告書を作成し、テキサス州運輸省（TxDOT）に提出しなければなりません。
- id: 286
  category: driver_responsibility
  question: 次のどの状況において、事故後できるだけ早く適切な法執行機関に常に通報すべきですか？
  choices:
    A: どちらかの車両の損害が500ドル未満と思われる場合
    B: 関与した運転手が酩酊していると疑われる場合
    C: 事故が住宅街で発生した場合
    D: 両方の車両が安全に現場から走り去ることができる場合
  answer: B
  explanation: マニュアルには、法執行機関に常に通報すべき4つの特定の状況が挙げられています：負傷者や死者が出た場合、車両を動かせない場合、運転手が現場から逃走した場合、または運転手が酩酊していると疑われる場合です。
- id: 287
  category: safe_driving_rules
  question: 車両への損害のみが発生した事故に遭い、車両が正常かつ安全に運転できる場合、何をしなければなりませんか？
  choices:
    A: 警察が到着して写真を撮るまで、車両をそのままの場所に残しておく
    B: できるだけ早く、指定された事故調査場所またはその他の適切な場所に車両を移動させる
    C: すぐに家に帰り、保険会社に電話する
    D: 車両を中央分離帯に押し込み、レッカー車を待つ
  answer: B
  explanation: 事故が車両への損害のみをもたらし、各車両が正常かつ安全に運転できる場合、運転手はできるだけ早く、指定された事故調査場所、側道、または最寄りの適切な交差道路に車両を移動させなければなりません。
- id: 288
  category: driver_responsibility
  question: 無人の車両に衝突して損害を与え、その運転手または所有者を見つけることができない場合、何が求められますか？
  choices:
    A: 損害が200ドル未満と思われる場合は現場を離れる
    B: 現場を離れる前に最大1時間車両のそばで待つ
    C: 自分の名前、住所、および状況の説明を記載した書面による通知を、目立つ方法でしっかりと取り付ける
    D: レッカー車を呼び、無人の車両を道路から撤去してもらう
  answer: C
  explanation: 無人の車両に損害を与え、所有者を見つけることができない場合、自分の名前、住所、および衝突の状況の説明を記載した書面による通知を、目立つ方法でしっかりと取り付けなければなりません。
- id: 289
  category: penalties_and_points
  question: 人の死亡をもたらした事故現場で停止しなかった場合の初回違反の罰則は何ですか？
  choices:
    A: 最長1年の懲役が科されるクラスAの軽犯罪
    B: 終身刑が科される第1級重罪
    C: 最高10,000ドルの罰金および2〜20年の懲役が科される第2級重罪
    D: 最高10,000ドルの罰金および2〜10年の懲役が科される第3級重罪
  answer: C
  explanation: 人の死亡をもたらした事故で運転手が停止しなかった場合の初回違反は、10,000ドル以下の罰金およびテキサス州刑事司法省（TDCJ）での2〜20年の懲役が科される第2級重罪です。
- id: 290
  category: penalties_and_points
  question: 車両への損害が200ドル未満の事故で停止しなかった場合の罰則（初回違反）は何ですか？
  choices:
    A: 500ドル以下の罰金が科されるクラスCの軽犯罪
    B: 2,000ドル以下の罰金が科されるクラスBの軽犯罪
    C: 最長1年の懲役が科されるクラスAの軽犯罪
    D: 最長2年の懲役が科される州立刑務所重罪
  answer: A
  explanation: 損害が200ドル未満で停止しなかった場合の初回違反の罰則は、500ドル以下の罰金が科されるクラスCの軽犯罪です。
- id: 291
  category: driver_responsibility
  question: 事故現場で負傷者を救護する際、被害者の移動に関する適切な手順は何ですか？
  choices:
    A: 交通による二次被害を防ぐため、直ちに道路の端に移動させる
    B: 絶対に必要でない限り、被害者を動かしたり持ち上げたりしない
    C: 骨折がないか確認するため、被害者を立ち上がらせて歩かせる
    D: 救急車が到着するまで暖かく保つため、被害者を自分の車に乗せる
  answer: B
  explanation: マニュアルには次のように記載されています。「絶対に必要でない限り、被害者を動かしたり持ち上げたりしないでください。被害者を移動させなければならない場合は、助けを求め、被害者が発見された時の体勢を変えないようにしてください。」
- id: 292
  category: sharing_the_road
  question: 歩行者の安全規則によると、歩道がない場合はどこを歩くべきですか？
  choices:
    A: 車の流れと同じ方向になる道路の右側
    B: 車の進行方向に対面する道路の左側
    C: 最も目立ちやすい道路の中央
    D: ジグザグに歩きながら道路の路肩
  answer: B
  explanation: 歩行者の安全規則には次のように記載されています。「歩道がない場合は、道路の左側を歩いてください。車が近づいてきたら舗装路から降りてください。」
- id: 293
  category: sharing_the_road
  question: 歩行者が交差点の横断歩道以外の場所で道路を横断する場合、誰に優先権がありますか？
  choices:
    A: 常に歩行者に優先権がある
    B: 歩行者はすべての車両に優先権を譲らなければならない
    C: 車両は歩行者に優先権を譲らなければならない
    D: 横断地点に先に到着した方に優先権がある
  answer: B
  explanation: マニュアルには次のように記載されています。「交差点の横断歩道以外の場所で道路を横断する場合、あなた（歩行者）はすべての車両に優先権を譲らなければなりません。」
- id: 294
  category: safe_driving_rules
  question: テキサス州運転免許ハンドブックによると、テキサス州における交通事故の最も一般的な原因は何ですか？
  choices:
    A: 悪天候、道路工事、および車両の故障
    B: スピード違反、適切な譲り合いや一時停止の不履行、および飲酒運転
    C: わき見運転、経験不足の運転手、および夜間運転
    D: 煽り運転（車間距離の不保持）、不適切な追い越し、および交通信号の無視
  answer: B
  explanation: マニュアルには明確に次のように記載されています。「テキサス州におけるほとんどの交通事故は、スピード違反、適切な譲り合いや一時停止の不履行、および飲酒運転が原因です。」
- id: 295
  category: driver_responsibility
  question: 事故後、相手の運転手の保険会社の住所と電話番号が必要な場合で、それが保険証券に記載されていない場合、どこに電話すべきですか？
  choices:
    A: テキサス州運輸省
    B: テキサス州公安局
    C: テキサス州保険局
    D: 地元警察署の非緊急ダイヤル
  answer: C
  explanation: マニュアルには次のように指示されています。「運転手の保険会社の名前が分かっており、その情報が保険証券に直接記載されていない場合は、テキサス州保険局（(800)
    252-3439）に電話して、会社の住所と電話番号を入手してください。」
- id: 296
  category: vehicle_information
  question: テキサス州保険局によると、法執行機関に報告された場合、ひき逃げ事故の損害を支払うのはどの種類の保険ですか？
  choices:
    A: 車両保険（総合補償）
    B: 衝突保険
    C: 賠償責任保険
    D: 無保険車傷害保険
  answer: D
  explanation: マニュアルには次のように記載されています。「テキサス州保険局は、法執行機関に報告されたひき逃げ事故の損害については、無保険車傷害保険が支払われると助言しています。」
- id: 297
  category: sharing_the_road
  question: 横断歩道で道路を横断する際、歩行者はどの位置を保つべきですか？
  choices:
    A: 横断歩道の左側を保つ
    B: 可能であれば横断歩道の右側を保つ
    C: 横断歩道のちょうど中央を歩く
    D: 横断歩道を斜めに歩く
  answer: B
  explanation: 歩行者の安全規則には次のように記載されています。「横断歩道を渡る際は、可能であれば右側を通行してください。」
- id: 298
  category: sharing_the_road
  question: 公道や幹線道路で白杖を携帯することが法的に許可されているのは誰ですか？
  choices:
    A: 夜間を歩くすべての歩行者
    B: 横断歩道外を横断する歩行者
    C: 盲目、弱視、または障害のある人
    D: 交通整理員および横断歩道指導員
  answer: C
  explanation: マニュアルには、盲目、弱視、または障害のある人は歩行中に白杖を携帯できると記載されています。それ以外の人は、公道や幹線道路で白杖を提示してはなりません。
- id: 299
  category: sharing_the_road
  question: 自転車を運転している人の交通違反はどのように扱われますか？
  choices:
    A: 交通反則切符の代わりに警告を受ける
    B: 自動車を運転している人と同じ罰則の対象となる
    C: 自動車の違反の半額の罰金のみが科せられる
    D: 自転車の違反は個人の運転記録には記載されない
  answer: B
  explanation: 自転車を運転する人は誰でも、交通法違反に対して自動車を運転する人と同じ罰則の対象となり、有罪判決は運転記録に記載されます。
- id: 300
  category: safe_driving_rules
  question: 自転車の運転手は停止することをどのように合図すべきですか？
  choices:
    A: 左腕を水平に伸ばす
    B: 右腕を水平に伸ばす
    C: 左腕を上に向ける
    D: 左腕を下に向ける
  answer: D
  explanation: 自転車の運転手は、左腕を下に向けて停止の合図をしなければなりません。
- id: 301
  category: safe_driving_rules
  question: 2つ以上の車線が標示されている一方通行の道路を走行する場合、自転車はどこを走るべきですか？
  choices:
    A: 一番右側の車線の中央。
    B: できるだけ左側の縁石または道路の端の近く。
    C: できるだけ右側の縁石または道路の端の近く。
    D: 他の交通よりも速く流れている車線ならどこでも。
  answer: B
  explanation: 2つ以上の車線が標示されている一方通行の道路で自転車を運転する場合、運転者はできるだけ左側の縁石または道路の端の近くを走行しなければなりません。
- id: 302
  category: vehicle_information
  question: 夜間に自転車を使用する場合、どのような前照灯が必要ですか？
  choices:
    A: 300フィート先から見える黄色のライト。
    B: 少なくとも500フィート先から見える白色のライト。
    C: 200フィート先から見える点滅する赤色のライト。
    D: 少なくとも1000フィート先から見える白色のライト。
  answer: B
  explanation: 夜間に使用されるすべての自転車は、少なくとも500フィートの距離から見える白色の光を発するランプを前面に装備しなければなりません。
- id: 303
  category: safe_driving_rules
  question: 自転車の運転者が荷物や包みを運ぶ際の規則は何ですか？
  choices:
    A: 10ポンドを超える荷物を運んではならない。
    B: すべての荷物に前かごを使用しなければならない。
    C: 少なくとも片手をハンドルから離さずにいられないようなものを運んではならない。
    D: 公道を走行中に荷物を運ぶことは禁止されている。
  answer: C
  explanation: 自転車の運転者は、少なくとも片手をハンドルから離さずにいられないような荷物、包み、または物品を運んではなりません。
- id: 304
  category: defensive_driving
  question: 防衛運転の原則によれば、他の運転者のミスに関して、法律は運転者に何を求めていますか？
  choices:
    A: 直ちに警察に通報する。
    B: クラクションを鳴らして他の運転者に警告する。
    C: お互いのミスから互いを守る。
    D: ミスに関係なく、自分の優先通行権を維持する。
  answer: C
  explanation: 衝突を避けるため、防衛運転をする者は、法律が運転者に対し、お互いのミスから互いを守ることを求めていると知っておくべきです。
- id: 305
  category: safe_driving_rules
  question: 8歳未満の子供がチャイルドシートの着用を免除されるのはどのような条件のときですか？
  choices:
    A: ピックアップトラックの後部座席に乗っている場合。
    B: 身長が4フィート9インチ（4'9"）を超えている場合。
    C: 標準的な大人用のシートベルトを着用している場合。
    D: 親または保護者が同伴している場合。
  answer: B
  explanation: 8歳未満の子供は、身長が4フィート9インチ（4'9"）を超えていない限り、シートベルトが装備された車両の座席に乗る場合、連邦政府が承認したチャイルドシートに固定されなければなりません。
- id: 306
  category: driver_responsibility
  question: 車から投げ出された場合、衝突事故で死亡する確率はどのくらい高くなりますか？
  choices:
    A: 2倍。
    B: 3倍。
    C: 4倍。
    D: 5倍。
  answer: D
  explanation: シートベルトは車から投げ出されるのを防ぐのに役立ちます。車から投げ出された場合、死亡する確率は5倍高くなります。
- id: 307
  category: penalties_and_points
  question: 17歳未満の同乗者がシートベルトを着用せずに乗車していた場合、運転者に科される罰則は何ですか？
  choices:
    A: $25から$50の罰金。
    B: $50から$100の罰金。
    C: $100から$200の罰金。
    D: $200から$500の罰金。
  answer: C
  explanation: 罰則表によると、17歳未満の同乗者がシートベルトを着用せずに乗車した場合、運転者には$100から$200の罰金が科されます。
- id: 308
  category: safe_driving_rules
  question: オープンベッドトラック（屋根のない荷台のトラック）やトレーラーの荷台に子供を乗せることが一般的に違法となるのは、子供が何歳未満の場合ですか？
  choices:
    A: 15歳。
    B: 16歳。
    C: 17歳。
    D: 18歳。
  answer: D
  explanation: 18歳未満の子供がトラックやトレーラーの荷台に乗っている状態で、オープンベッドトラック、オープンフラットベッドトラックを運転すること、またはオープンフラットベッドトレーラーを牽引することは違法です。
- id: 309
  category: penalties_and_points
  question: ピックアップトラックの荷台に18歳未満の子供を乗せて運転したことに対する起訴の抗弁として、有効なものは次のうちどれですか？
  choices:
    A: 車両が25 mph未満で走行している。
    B: 車両がビーチで運転されている。
    C: 荷台で子供に大人が同伴している。
    D: 車両の走行距離が5マイル未満である。
  answer: B
  explanation: 運転者がビーチで車両を運転または牽引していた場合、パレードや緊急時、農作業員の輸送、世帯が所有する唯一の車両である場合、または許可されたヘイライド（干し草を積んだ荷台に乗る娯楽）である場合は、起訴に対する抗弁となります。
- id: 310
  category: sharing_the_road
  question: 道路上の共有車線標示（シェアードレーン・マーキング）の目的の1つは何ですか？
  choices:
    A: 自転車専用の車線を指定するため。
    B: 自転車が駐車車両の開いたドアに衝突する可能性を減らすため。
    C: 自転車から降りて歩かなければならない場所を示すため。
    D: 前方に横断歩道があることを運転者に警告するため。
  answer: B
  explanation: 共有車線標示は、路上に縦列駐車がある共有車線において、自転車が駐車車両の開いたドアに衝突する可能性を減らすために、自転車の横方向の位置取りを支援する目的で使用されることがあります。
- id: 311
  category: alcohol_drugs_health
  question: マニュアルには、歩行者とアルコールについてどのように記載されていますか？
  choices:
    A: 影響下にある歩行者は、道路の左側を歩かなければならない。
    B: 反射材のついた衣服を着用していれば、歩行者は道路上でアルコールを消費してもよい。
    C: アルコールの影響下にある場合、歩行者は道路を歩くべきではない。
    D: 影響下にある歩行者は、車両よりも優先権（通行権）がある。
  answer: C
  explanation: マニュアルには次のように記載されています。「アルコールの影響下にある場合、またはアルコール飲料を消費している場合は、道路を歩かないでください。アルコールは歩行者の交通事故の一因となります。」
- id: 312
  category: safe_driving_rules
  question: テキサス州法では、ボートや水上オートバイを牽引して自動車を運転する際、そのボートに乗っている人が何歳未満の場合、違法となりますか？
  choices:
    A: 15歳
    B: 16歳
    C: 18歳
    D: 21歳
  answer: C
  explanation: 18歳未満の人が乗っているボートや水上オートバイを牽引して自動車を運転することは違法です。
- id: 313
  category: safe_driving_rules
  question: トラックが牽引するトレーラーに他の人が乗っている状態でトラックを運転したことに対する起訴において、有効な抗弁となるのは次のうちどれですか？
  choices:
    A: トレーラーに乗っている人が21歳以上である。
    B: 車両が州間高速道路を走行している。
    C: トレーラーが人が居住できるように設計されている。
    D: 運転手が時速30マイル未満で走行している。
  answer: C
  explanation: トレーラーまたはセミトレーラーに乗っている人が、人が居住できるように設計された車両の一部にいた場合は、起訴に対する抗弁となります。
- id: 314
  category: safe_driving_rules
  question: 夜間に警察官に車を止められた場合、車のライトはどうするべきですか？
  choices:
    A: 警察官の目を眩ませないよう、すべてのライトを消す。
    B: ハイビームを点灯する。
    C: 車内のルームランプ（ドームライト）を点灯する。
    D: ヘッドライトを繰り返し点滅させる。
  answer: C
  explanation: 夜間に警察官に止められた場合は、車内のルームランプ（ドームライト）を点灯する必要があります。
- id: 315
  category: safe_driving_rules
  question: 警察官に車を止められた際、指示を待つ間、両手はどこに置いておくべきですか？
  choices:
    A: 膝の上やポケットの中。
    B: はっきりと見えるようにハンドルの上。
    C: 運転席側の窓の外。
    D: 免許証を取るためにグローブボックスに手を入れる。
  answer: B
  explanation: 両手をはっきりと見えるようにハンドルの上に置き、警察官が指示を出すのを待つ必要があります。
- id: 316
  category: defensive_driving
  question: 認可された緊急車両があなたを止めるために接近してきたが、すぐに停車するにはその場所が安全ではないと感じた場合、取るべき行動の1つは何ですか？
  choices:
    A: より早く安全な場所を見つけるためにスピードを上げる。
    B: ハザードランプを点灯し、制限速度を下回る速度でゆっくりと運転する。
    C: 場所を探していることを警察官に知らせるため、すべてのライトを消す。
    D: 車線の中央で急停車する。
  answer: B
  explanation: すぐに停車するにはその場所が安全ではないと感じた場合は、ハザードランプを点灯し、制限速度を下回る速度でゆっくりと慎重に運転することができます。
- id: 317
  category: driver_responsibility
  question: 交通違反の取り締まり（トラフィックストップ）の際、車から降りるよう指示されない限り、運転手と乗客が車内に留まるべきなのはなぜですか？
  choices:
    A: 車から降りることは罰金を伴う交通違反だから。
    B: 車から降りることは攻撃的な行動とみなされ、警察官の安全に対する脅威となる可能性があるから。
    C: 高速道路の路肩に立つことは違法だから。
    D: 警察官がまず車の外観を検査する必要があるから。
  answer: B
  explanation: 運転手と乗客は、指示されない限り車から降りるべきではありません。車から降りることは攻撃的な行動とみなされ、警察官の安全に対する脅威となる可能性があります。
- id: 318
  category: safe_driving_rules
  question: 交通違反の取り締まり（トラフィックストップ）の際、運転免許証と保険の書類を取り出すのに最適なタイミングはいつですか？
  choices:
    A: 後ろにパトカーのランプが見えたらすぐ。
    B: 警察官があなたの車に歩いて近づいてくる間。
    C: 警察官にそれらがある場所を伝え、指示に従った後。
    D: 警察官に逮捕すると脅された後のみ。
  answer: C
  explanation: 保険証明書や運転免許証を取り出すためにグローブボックスやシートの下に手を伸ばす前に、警察官にそれらのアイテムがある場所を伝え、警察官の指示に従ってください。
- id: 319
  category: driver_responsibility
  question: 交通違反の取り締まり（トラフィックストップ）中に合法的に逮捕された場合、法律により警察官に提供することが義務付けられている情報は何ですか？
  choices:
    A: 氏名、居住地住所、生年月日。
    B: 社会保障番号と雇用主。
    C: 氏名と電話番号のみ。
    D: 情報を提供する必要はない。
  answer: A
  explanation: 合法的に逮捕された場合、氏名、居住地住所、生年月日を提供することも義務付けられています。
- id: 320
  category: driver_responsibility
  question: どのような状況下で、警察官はあなたの同意なしにあなたの車を捜索することができますか？
  choices:
    A: 赤いスポーツカーを運転している場合。
    B: 質問に答えるのを拒否した場合。
    C: あなたの車に犯罪の証拠が含まれていると信じるに足る相当な理由（プロバブル・コーズ）が警察官にある場合。
    D: 警察官はあなたの同意なしに車を捜索することは絶対にできない。
  answer: C
  explanation: 警察官が、あなたの車に犯罪の証拠が含まれていると信じるに足る相当な理由（プロバブル・コーズ）を持っている場合、あなたの同意なしに車を捜索することができます。
- id: 321
  category: penalties_and_points
  question: 適法に拘束された人が、法執行官（警察官など）に架空の名前を告げた場合、どのような罪になりますか？
  choices:
    A: 逮捕逃亡
    B: 虚偽身分証明罪 (False Identification Offense)
    C: 攻撃的な運転（あおり運転）
    D: クラスCの軽犯罪
  answer: B
  explanation: 適法に逮捕または拘束された人が、法執行官に虚偽または架空の名前を告げた場合、虚偽身分証明罪（False Identification
    Offense）となります。
- id: 322
  category: penalties_and_points
  question: 逮捕や拘束から逃れようとする際、より重い罰則の対象となる行動は次のうちどれですか？
  choices:
    A: 住宅街を徒歩で逃走する。
    B: 逮捕から逃れる際に車両や船舶を使用する。
    C: 警察官の質問に答えることを拒否する。
    D: 車両の捜索への同意を拒否する。
  answer: B
  explanation: 逮捕から逃れる際に車両や船舶を使用したり、他人に怪我を負わせたりした場合、より重い罰則の対象となります。
- id: 323
  category: defensive_driving
  question: ロードレイジ（あおり運転や路上でのトラブル）を避けるため、必要に応じてクラクションをどのように使用するべきですか？
  choices:
    A: クラクションを5秒以上鳴らし続ける。
    B: クラクションを軽く鳴らす（タップする）。
    C: アイコンタクトを取りながらクラクションを繰り返し鳴らす。
    D: いかなる状況でもクラクションを使用しない。
  answer: B
  explanation: クラクションを使用する必要がある場合は、軽く鳴らす（タップする）ようにし、鳴らし続けてはいけません。
- id: 324
  category: defensive_driving
  question: 避けるべき攻撃的な運転（アグレッシブ・ドライビング）の例は、次のうちどれですか？
  choices:
    A: 車線変更の前に方向指示器（ウィンカー）を使用する。
    B: 他の車が追い越したり車線に入ったりするのを防ぐため、意図的にスピードを上げる。
    C: 渋滞に備えて移動時間に余裕を持たせる。
    D: 安全な車間距離を保って他の車両に続く。
  answer: B
  explanation: ロードレイジを避けるためのヒントには、「他の車が追い越したり車線に入ったりするのを防ぐために、意図的に減速したり、急ブレーキをかけたり、スピードを上げたりしないこと」が含まれます。
- id: 325
  category: safe_driving_rules
  question: 車内に拳銃を積載している場合、運転免許証や保険の書類に関してどのようにすることが推奨されていますか？
  choices:
    A: 拳銃を書類と全く同じ収納スペースに保管する。
    B: 書類と一緒に武器を警察官に渡す。
    C: 拳銃を運転免許証や保険の書類とは別の場所に保管する。
    D: 警察官が近づく前に、拳銃を助手席に置く。
  answer: C
  explanation: 車内に拳銃を積載する運転手は、運転免許証や保険の書類とは別の場所に拳銃を保管することが推奨されています。
- id: 326
