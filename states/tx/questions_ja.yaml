  question: モーター付きスクーター（Motor Assisted Scooter）を運転できる道路または高速道路の、標識で示された最高制限速度はどれくらいですか？
  choices:
    A: 時速25マイル
    B: 時速30マイル
    C: 時速35マイル
    D: 時速45マイル
  answer: C
