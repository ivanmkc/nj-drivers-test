- id: 344
  category: signs_and_signals
  question: クロスバック（踏切標識）とは何ですか？
  choices:
    A: スクールゾーンにある横断歩道
    B: 踏切の手前に設置されている、大きな白いX型の標識
    C: 4つの道路が等しい角度で交わる交差点
    D: 鹿の横断に対する警告標識
  answer: B
  explanation: クロスバックとは、踏切の手前に設置されている、大きな白いX型の標識のことです。
- id: 345
  category: defensive_driving
  question: 防衛運転（defensive driving）の定義は何ですか？
  choices:
    A: 衝突を避けるため、常に制限速度以下で運転すること
    B: 車間距離管理システム（スペースマネジメント）を用いて、危険や予期せぬ運転状況から自分自身と他者を守ること
    C: 交差点で他のすべての車両に通行権を譲ること
    D: 道路上の障害物を避けるために急ハンドルを切ること
  answer: B
  explanation: 防衛運転とは、車間距離管理システム（スペースマネジメント）を用いて、危険や予期せぬ運転状況から自分自身と他者を守ることです。
- id: 346
  category: alcohol_drugs_health
  question: テキサス州では、未成年者が以下の状態で運転した場合、飲酒運転（DUI）で告発される可能性があります：
  choices:
    A: 血中アルコール濃度が0.08%以上
    B: 体内から検出可能な量のアルコールが少しでもある
    C: 血中アルコール濃度が0.05%を超えている
    D: 車内に開封済みのアルコール容器がある
  answer: B
  explanation: 飲酒運転（DUI）はクラスCの軽犯罪であり、テキサス州では未成年者の体内に検出可能な量のアルコールが少しでもある状態で運転した場合、告発される可能性があります。
- id: 347
  category: driver_responsibility
  question: 高速道路催眠現象（ハイウェイ・ヒプノーシス）の原因は何ですか？
  choices:
    A: 幻覚剤の影響下での運転
    B: 夜間に、対向車のヘッドライトを見つめること
    C: 前方の道路への集中と、単調な運転
    D: 長距離ドライブ前の睡眠不足
  answer: C
  explanation: 高速道路催眠現象とは、前方の道路への集中と単調な運転によって引き起こされる、眠気やトランス状態のような状態のことです。
- id: 348
  category: safe_driving_rules
  question: ハイドロプレーニング現象はどのような時に発生しますか：
  choices:
    A: 過剰な水分により車両のブレーキが効かなくなった時
    B: タイヤの接地面が水の上に浮き上がり、道路との接触を失った時
    C: 激しい暴風雨で運転者が視界を失った時
    D: 冠水した交差点に車両が進入した時
  answer: B
  explanation: ハイドロプレーニング現象は、タイヤの接地面が水の上に浮き上がり、道路との接触を失った時に発生します。
- id: 349
  category: penalties_and_points
  question: 黙示の同意法（implied-consent law）は運転手にとって何を意味しますか？
  choices:
    A: 運転手は国境検問所での車両検査に自動的に同意する
    B: 運転手は、使用の疑いで停止を求められた場合、血中アルコール濃度やその他の薬物の検査を受けることに自動的に同意する
    C: 運転手は交通違反のすべての罰金を30日以内に支払うことに同意する
    D: 運転手は免許証を受け取る際に臓器提供に同意する
  answer: B
  explanation: 黙示の同意法とは、運転免許証を取得した者は誰でも、運転中にアルコールや薬物使用の疑いで停止を求められた場合、血中アルコール濃度やその他の薬物の検査を受けることに自動的に同意することを意味します。
- id: 350
  category: driver_responsibility
  question: 被保険者が法的に支払う義務がある損害に対する補償を提供し、自分に過失がある場合に他者をカバーする保険の種類は何ですか？
  choices:
    A: 衝突保険（車両保険）
    B: 総合保険
    C: 賠償責任保険
    D: 無過失保険
  answer: C
  explanation: 賠償責任保険は、被保険者が法的に支払う義務がある損害に対する補償を提供し、自分に過失がある場合に他者をカバーします。
- id: 351
  category: vehicle_information
  question: モペッド（原動機付自転車）は、1マイルの区間で次のどの速度を超えることができない原動機付二輪車ですか？
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: モペッドは、1マイルの区間で30 mphを超える速度を出すことができない原動機付二輪車です。
- id: 352
  category: license_system
  question: 運転免許の「取り消し（cancellation）」と「拒否（denial）」の違いは何ですか？
  choices:
    A: 取り消しは一時的なものだが、拒否は永久的なものである
    B: 取り消しは運転者が資格を満たすまで免許を撤回することであり、拒否は不適格であることを理由に免許の交付を保留することである
    C: 取り消しは商用運転手に適用され、拒否は一般運転手に適用される
    D: 取り消しは裁判所によって発行され、拒否は警察官によって発行される
  answer: B
  explanation: 取り消し（cancellation）とは、運転者が資格または適格性を満たすまで、運転免許または運転特権を撤回することです。拒否（denial）とは、その人が免許に対して不適格であることを理由に、運転免許または運転特権の交付を保留することです。
- id: 353
  category: penalties_and_points
  question: イグニッション・インターロック・デバイス（呼気アルコール検知器連動型エンジン始動装置）とは何ですか？
  choices:
    A: ハンドルをロックして車両の盗難を防ぐ装置
    B: 車両のエンジンを始動するために、運転者が息を吹き込まなければならない機械的制御装置
    C: 車両のアイドリングが長すぎた場合に自動的にエンジンを切るシステム
    D: 整備士が車両の排気ガスを検査するために使用するツール
  answer: B
  explanation: イグニッション・インターロック・デバイスは、自動車のダッシュボードに設置される特殊な機械的制御装置です。運転者は車両のエンジンを始動するために、この装置に息を吹き込まなければなりません。
- id: 354
  category: safe_driving_rules
  question: 次のうち、ドラッグレースについて説明しているものはどれですか？
  choices:
    A: オフロードで車両を無謀に運転すること
    B: 2台以上の車両が並んで加速し、互いに相手を引き離そうと競い合うこと
    C: アクセス制限のある高速道路で、他の車を縫うように走行すること
    D: 警察車両から高速で逃走すること
  answer: B
  explanation: ドラッグレースとは、2台以上の車両が並んだ状態から加速して互いに相手を引き離そうと競い合ったり、決められたコースで速度を競い合ったりする運転行為のことです。
- id: 355
  category: safe_driving_rules
  question: ヘッドライトを「オーバードライブ」するとはどういう意味ですか？
  choices:
    A: 霧の中でハイビームを点灯して運転すること
    B: 停止距離がヘッドライトで照らされている距離よりも長くなるような速度で運転すること
    C: 視認性を高めるために日中にヘッドライトを使用すること
    D: ヘッドライトの向きが高すぎて、対向車の目を眩ませながら運転すること
  answer: B
  explanation: ヘッドライトのオーバードライブとは、停止距離がヘッドライトで照らされている距離よりも長くなるような速度で運転することを意味します。
- id: 356
  category: safe_driving_rules
  question: 縦列駐車をする際、車両は縁石からどのくらい離れていなければなりませんか？
  choices:
    A: 6～18インチ
    B: 12～24インチ
    C: 2～10インチ
    D: 18～24インチ
  answer: A
  explanation: 縦列駐車をする際、車両は縁石と平行に、または同じ方向に向けて並べ、縁石から6～18インチの距離に駐車しなければなりません。
- id: 357
  category: vehicle_information
  question: 次のうち、パッシブ・レストレイント（受動的拘束）装置の例はどれですか？
  choices:
    A: 手動のラップベルト（2点式シートベルト）
    B: チャイルドシート
    C: エアバッグ
    D: ヘッドレスト
  answer: C
  explanation: エアバッグや自動シートベルトなどのパッシブ・レストレイント装置は、同乗者や運転者が自ら操作しなくても作動します。
- id: 358
  category: signs_and_signals
  question: 保護された左折（protected left turn）の定義は何ですか？
  choices:
    A: 一時停止標識で行う左折
    B: 共有の中央車線から行う左折
    C: 専用の左折信号なしで行う左折
    D: 対向車が停止している間に、左折用の緑色の矢印信号で行う左折
  answer: D
  explanation: 保護された左折とは、対向車が停止している間に、左折信号、緑色の矢印信号、または遅延緑信号（ディレイド・グリーン）に従って行う左折のことです。
- id: 359
  category: penalties_and_points
  question: 運転免許の「取消処分（revocation）」の定義は何ですか？
  choices:
    A: 一定期間、運転免許を一時的に撤回すること
    B: 無期限に運転免許または運転特権を終了させること
    C: イグニッション・インターロック・デバイスを必要とする制限を免許に課すこと
    D: 免許が停止される前に発せられる警告
  answer: B
  explanation: 取消処分（revocation）とは、無期限に運転免許または運転特権を終了させることです。すべての要件が満たされた場合に回復されることがあります。
- id: 360
  category: safe_driving_rules
  question: 赤信号での右折（right turn on red）を行う際、曲がる前に何をしなければなりませんか？
  choices:
    A: 5 mphまで減速し、安全であれば進む
    B: 交差点の停止線（ガイド）の手前で停止する
    C: 歩行者に警告するためにクラクションを鳴らす
    D: 歩行者用信号が点滅するのを待つ
  answer: B
  explanation: 赤信号での右折とは、特に右折が禁止されていない限り、交差点の停止線（ガイド）の手前で停止した後に、赤信号の状態で右折することです。
- id: 361
  category: signs_and_signals
  question: 舗装路面にあるランブルストリップス（段差舗装）の目的は何ですか？
  choices:
    A: 雨や雪の日のトラクション（牽引力）を向上させるため
    B: 道路工事、料金所、またはその他の交通状況が近づいていることを運転手に警告するため
    C: スクールゾーンの境界を示すため
    D: 共用左折車線を示すため
  answer: B
  explanation: ランブルストリップス（段差舗装）は、道路工事、料金所、またはその他の交通状況が近づいていることを運転手に警告することを目的とした、粗い舗装路面の部分です。
- id: 362
  category: defensive_driving
  question: スタッガード・ストップとは何ですか？
  choices:
    A: 左折車両に十分なスペースを確保するため、ボンネットのラインの下に白線が視覚的に隠れた時点で停止すること
    B: 一時停止標識で停止し、前進してから再び停止すること
    C: ブレーキを何度も踏んで徐々に停止すること
    D: 前方の車両を避けてハンドルを切れる十分なスペースを空けて停止すること
  answer: A
  explanation: スタッガード・ストップとは、ボンネットのラインの下に白線が視覚的に隠れた時点で停止することです。これにより、左折車両のための余分なスペースを確保できます。
- id: 363
  category: penalties_and_points
  question: 免許停止（suspension）と免許取消し（revocation）の違いは何ですか？
  choices:
    A: 免許停止は無期限であり、免許取消しは永久的である
    B: 免許停止は、一定期間、一時的に免許を取り上げることである
    C: 免許停止は商用車の運転手にのみ適用される
    D: 免許停止はインターロック装置の設置を必要とする
  answer: B
  explanation: 免許停止（suspension）は一定期間、運転免許または運転の特権を一時的に取り上げることを指しますが、免許取消し（revocation）は無期限に取り上げることを指します。
- id: 364
  category: alcohol_drugs_health
  question: トンネルビジョン（視野狭窄）とは何ですか？
  choices:
    A: 夜間にはっきりと見ることができないこと
    B: 速度が上がるにつれて、周辺視野にある対象物がぼやけること
    C: 有効な周辺視野がほとんどなく、140度以下の狭い視野でしか見えない状態
    D: 中心視野の周りに見える領域
  answer: C
  explanation: トンネルビジョン（視野狭窄）とは、有効な周辺視野がほとんどなく、140度以下の狭い視野でしか見えない状態のことです。
- id: 365
  category: safe_driving_rules
  question: 信号や標識のない交差点（uncontrolled intersection）の定義は何ですか？
  choices:
    A: 信号機が黄色に点滅している交差点
    B: 交通を規制する標識や信号がない交差点
    C: ロータリー（トラフィックサークル）のある交差点
    D: 複数の車線が1つに合流する交差点
  answer: B
  explanation: 信号や標識のない交差点（uncontrolled intersection）とは、交通を規制する標識や信号がない交差点のことであり、赤色の点滅信号や遮断機がない踏切もこれに含まれます。
- id: 366
  category: alcohol_drugs_health
  question: ゼロ・トレランス法（飲酒運転に対する絶対的容認不可法）では何が定められていますか？
  choices:
    A: 血中アルコール濃度が0.08%を超えた状態で運転することは、誰であっても違法である
    B: 21歳未満の者が、血中から測定可能な量のアルコールが検出された状態で運転することは違法である
    C: スクールゾーンでの速度超過で捕まった場合、運転手は直ちに免許を失う
    D: いかなる運転手も呼気検査を拒否することはできない
  answer: B
  explanation: ゼロ・トレランス法では、21歳未満の者が、血中から測定可能な量のアルコールが検出された状態で運転することは違法であると定められています。
- id: 367
  category: defensive_driving
  question: 速度が上がるにつれて、周辺視野にある対象物がぼやけたり歪んだりする視覚効果を何と呼びますか？
  choices:
    A: トンネルビジョン（視野狭窄）
    B: 夜盲症（鳥目）
    C: スピードスミア
    D: 視界不良
  answer: C
  explanation: スピードスミアとは、速度が上がるにつれて周辺視野にある対象物がぼやけたり歪んだりする現象のことです。
- id: 368
  category: safe_driving_rules
  question: 「車両のロッキング（前後の揺さぶり）」というテクニックは何のために使われますか？
  choices:
    A: 車両のサスペンションシステムをテストするため
    B: 深い雪、泥、または砂から車両を脱出させるため
    C: 車両の故障を他の運転手に警告するため
    D: 狭い私道で方向転換を行うため
  answer: B
  explanation: 車両のロッキングとは、少し前進しては少し後退するという動作を繰り返し、深い雪、泥、または砂から車両を脱出させる方法です。
- id: 369
  category: driver_responsibility
  question: 無保険の運転手が運転する他の車両に衝突された場合、一定額まで費用を補償する保険はどれですか？
  choices:
    A: ノーフォールト保険（無過失保険）
    B: 対物賠償保険
    C: 過少保険自動車保険
    D: 無保険自動車保険
  answer: D
  explanation: 無保険自動車保険（Uninsured motorist insurance）は、無保険の運転手が運転する他の車両に衝突された場合、一定額まで費用を補償します。
- id: 370
  category: safe_driving_rules
  question: テキサス州のドライバーズハンドブックでは、「視認性（visibility）」をどのように定義していますか？
  choices:
    A: 車両が停止するまでの距離
    B: 見る能力
    C: 車両のヘッドライトの明るさ
    D: フロントガラスの透明度
  answer: B
  explanation: ハンドブックでは、視認性を単に「見る能力（the ability to see）」と定義しています。
- id: 371
  category: signs_and_signals
  question: 警戒標識（warning sign）の目的は何ですか？
  choices:
    A: 最高速度制限を示すため
    B: 起こりうる危険や道路状況を警告するため
    C: 目的地への道順を案内するため
    D: 駐車禁止場所を示すため
  answer: B
  explanation: 警戒標識は、「起こりうる危険や道路状況を警告する標識」と定義されています。
- id: 372
  category: vehicle_information
  question: 計器盤（インストルメントパネル）の警告灯が点灯したままの場合、それは何を意味しますか？
  choices:
    A: システムが最適に機能している
    B: ヘッドライトの点灯を促すリマインダーである
    C: システムに異常（故障）がある
    D: 車のオイル交換の時期である
  answer: C
  explanation: 警告灯はシステムの異常を警告する計器盤のライトであり、通常、システムが故障している間は点灯したままになります。
- id: 373
  category: safe_driving_rules
  question: 道路上で「道を譲る（yield）」とはどういう意味ですか？
  choices:
    A: 完全に停止し、青信号を待つこと
    B: 他の車両や道路利用者を先に進ませること
    C: 減速せずに交通に合流すること
    D: クラクションを鳴らして他の運転手に警告すること
  answer: B
  explanation: 道を譲る（yield）とは、「他の車両や道路利用者を先に進ませること」を意味します。
- id: 374
  category: alcohol_drugs_health
  question: 「ゼロ・トレランス法（絶対的非容認法）」は何歳未満の個人に適用されますか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 16歳
  answer: B
  explanation: ゼロ・トレランス法により、21歳未満の個人が血中に少しでも測定可能な量のアルコールを含んだ状態で運転することは違法とされています。
- id: 375
  category: alcohol_drugs_health
  question: ゼロ・トレランス法の下では、21歳未満の個人が運転中に血中に含むことが許されるアルコール量はどれくらいですか？
  choices:
    A: 0.08%未満
    B: 0.04%未満
    C: 測定可能な量であればいかなる量でも違法
    D: 標準的なアルコールドリンク1杯まで
  answer: C
  explanation: ゼロ・トレランス法では、21歳未満の個人が「血中に少しでも測定可能な量のアルコールを含んだ状態」で運転することは違法であると定められています。
- id: 376
  category: license_system
  question: 公安局（DPS）は、対面サービスを提供するための運転免許センター（DLO）を州内に約いくつ設けていますか？
  choices:
    A: 50カ所以上
    B: 100カ所以上
    C: 220カ所以上
    D: 500カ所以上
  answer: C
  explanation: 公安局（DPS）は、州内220カ所以上の運転免許センター（DLO）で、対面での運転免許証/身分証明書（DL/ID）サービスの予約を受け付けています。
- id: 377
  category: license_system
  question: DPSの「メガセンター」には、最大でいくつのサービス窓口がありますか？
  choices:
    A: 最大10カ所
    B: 最大15カ所
    C: 最大20カ所
    D: 最大25カ所
  answer: D
  explanation: メガセンターでは、顧客に対応するために最大25カ所のサービス窓口を設けています。
- id: 378
  category: license_system
  question: 条件を満たす運転免許証の更新において、DPSが推奨している代替サービス・オプションは次のうちどれですか？
  choices:
    A: オンライン更新
    B: ドライブスルー更新
    C: スーパーマーケットのキオスク端末での更新
    D: 訪問更新
  answer: A
  explanation: DPSは、条件を満たす場合、オンライン、電話、または郵送による更新などの代替サービス・オプションを利用することを顧客に推奨しています。
- id: 379
  category: license_system
  question: DPSオフィスで対面での運転免許証または身分証明書（ID）のサービスを受けるには何が必要ですか？
  choices:
    A: 事前予約
    B: 当日の整理券
    C: 郵送による書面での申請
    D: 自動車学校からの紹介状
  answer: A
  explanation: マニュアルによると、「対面での運転免許証/身分証明書（DL/ID）サービスはすべて事前予約制で提供されます」。
- id: 380
  category: license_system
  question: 対面での運転免許サービスは、どれくらい前から予約できますか？
  choices:
    A: 最大1カ月前
    B: 最大3カ月前
    C: 最大6カ月前
    D: 最大1年前
  answer: C
  explanation: 対面での運転免許証/身分証明書（DL/ID）サービスの予約は、最大6カ月前から行うことができます。
- id: 381
  category: license_system
  question: 予定していた運転免許証の手続きの予約に行けなくなった場合、どうすればよいですか？
  choices:
    A: 友人に譲る
    B: 他の利用者が対応を受けられるようにキャンセルする
    C: 代わりに翌日に行く
    D: 何もしない（自動的に期限切れになるため）
  answer: B
  explanation: マニュアルには次のように記載されています。「予約に行けなくなった場合は、他の利用者が迅速に対応を受けられるようにキャンセルしてください。」
- id: 382
  category: driver_testing
  question: なぜDPS（公安局）は、第三者機関による講習および試験の選択肢を拡大しているのですか？
  choices:
    A: 州営の運転免許センターをすべて置き換えるため
    B: 初めて免許を取得する利用者に、より柔軟な選択肢を提供するため
    C: 運転免許証の取得費用を上げるため
    D: 運転免許試験をより難しくするため
  answer: B
  explanation: DPSは、「初めて免許を取得する利用者に、より柔軟な選択肢を提供するため」に、第三者機関による講習および試験の選択肢を拡大しています。
- id: 383
  category: license_system
  question: なぜDPS（公安局）は、より多くのサービスをオンラインで利用できるように取り組んでいるのですか？
  choices:
    A: 運転免許センター（DLO）への訪問が必要な回数を減らすため
    B: 運転免許試験の必要性をなくすため
    C: 物理的な運転免許証を段階的に廃止するため
    D: 州の税収を増やすため
  answer: A
  explanation: DPSは、「運転免許センター（DLO）への訪問が必要な回数を減らすため」に、より多くのサービスをオンラインで利用できるように取り組んでいます。
- id: 384
  category: driver_testing
  question: テキサス州運転手引書（Texas Driver Handbook）の付録Cには、どの種類の運転者向けの学習・復習問題が掲載されていますか？
  choices:
    A: クラスAの運転者
    B: クラスBの運転者
    C: クラスCの運転者
    D: 商業運転手
  answer: C
  explanation: 付録Cのタイトルは「クラスC運転者向けの学習・復習問題（Study and Review Questions for Class C
    Operators）」です。
- id: 385
  category: license_system
  question: 運転免許証の手続きにおいて、1ドルの事務手数料が請求されないのはどのような場合ですか？
  choices:
    A: 手続きがオンラインで完了した場合
    B: 手続きが直接窓口で完了した場合
    C: 手続きが郵送で行われた場合
    D: 複数の手続きを同時に完了した場合
  answer: C
  explanation: 「付録D：手数料」によると、郵送で行われる手続きには1ドルの事務手数料は請求されません。
- id: 386
  category: license_system
  question: 18歳から84歳までの人が新規取得したクラスC運転免許証の有効期間はどのくらいですか？
  choices:
    A: 2年
    B: 4年
    C: 6年
    D: 8年
  answer: D
  explanation: マニュアルには、18歳から84歳までの新規運転免許証（クラスA、B、またはC）は、8年後の誕生日に有効期限が切れると記載されています。
- id: 387
  category: license_system
  question: 85歳以上の人の運転免許証の更新手数料と有効期間はいくら（どのくらい）ですか？
  choices:
    A: 33ドル、有効期間8年
    B: 16ドル、有効期間6年
    C: 9ドル、有効期間2年
    D: 無料、有効期間4年
  answer: C
  explanation: 85歳以上の人の場合、運転免許証の更新手数料は9ドルで、前回の有効期限から2年後に有効期限が切れます。
- id: 388
  category: license_system
  question: 手数料免除の要件を満たす、障害度60%の退役軍人の新規または更新運転免許証の手数料はいくらですか？
  choices:
    A: 9ドル
    B: 11ドル
    C: 16ドル
    D: 無料
  answer: D
  explanation: 付録Dには、手数料免除の要件を満たしている場合、障害度60%の退役軍人の新規または更新運転免許証は無料であると記載されています。
- id: 389
  category: license_system
  question: 紛失、盗難、または破損した運転免許証の再発行にはいくらかかりますか？
  choices:
    A: 9ドル
    B: 11ドル
    C: 16ドル
    D: 33ドル
  answer: B
  explanation: 紛失、盗難、または破損した運転免許証の再発行手数料は11ドルで、現在の有効期限は変更されません。
- id: 390
  category: license_system
  question: 60歳以上の人の新規または更新身分証明書（IDカード）の手数料はいくらですか？
  choices:
    A: 6ドル
    B: 11ドル
    C: 16ドル
    D: 21ドル
  answer: A
  explanation: 「身分証明書（ID）手数料」の表によると、60歳以上の人の新規または更新IDカードの手数料は6ドルです。
- id: 391
  category: license_system
  question: テキサス州の運転免許証の制限コードA（Restriction Code A）は何を示していますか？
  choices:
    A: 昼間のみ運転可能
    B: 視力矯正レンズの着用
    C: オートマチック車限定
    D: パワーステアリング限定
  answer: B
  explanation: 付録E：制限コード（Restriction Codes）には、コードAは「視力矯正レンズの着用（With corrective lenses）」で運転することが義務付けられていると記載されています。
- id: 392
  category: license_system
  question: 運転免許証に制限コードBがある場合、運転時に何が義務付けられますか？
  choices:
    A: 時速45マイルを超えてはならない
    B: オートマチック車を運転しなければならない
    C: 21歳以上の免許所持者が助手席に乗っていなければならない
    D: 昼間のみの運転に制限される
  answer: C
  explanation: 制限コードBは、「21歳以上の免許所持者（LOFS）が助手席に乗っていなければならない」と規定しています。
- id: 393
  category: license_system
  question: 運転者が「昼間のみ運転可能（Daytime driving only）」に制限されていることを示す制限コードはどれですか？
  choices:
    A: コードA
    B: コードC
    C: コードD
    D: コードF
  answer: B
  explanation: 付録Eには、制限コードCは「昼間のみ運転可能（Daytime driving only）」であると記載されています。
- id: 394
  category: safe_driving_rules
  question: 制限コードDの運転者にはどのような制限が課せられますか？
  choices:
    A: 速度は時速45マイルを超えないこと
    B: 速度は時速55マイルを超えないこと
    C: 車両重量は26,000ポンドを超えないこと
    D: 州内での運転のみ
  answer: A
  explanation: 付録Eによると、制限コードDは「速度は時速45マイルを超えないこと（Speed not to exceed 45 mph）」を意味します。
- id: 395
  category: vehicle_information
  question: 制限コードIはオートバイに適用されます。これは何を規定していますか？
  choices:
    A: オートバイはオートマチック車でなければならない
    B: オートバイの排気量は250ccを超えてはならない
    C: 運転者はヘルメットを着用しなければならない
    D: オートバイは三輪に制限される
  answer: B
  explanation: 付録Eによると、制限コードIは「排気量250cc以下のオートバイ（Motorcycle not to exceed 250cc）」と規定しています。
- id: 396
  category: alcohol_drugs_health
  question: 制限コードP39は、運転者の車両に何を装備することを義務付けていますか？
  choices:
    A: パワーステアリング
    B: 適切な義肢装具
    C: イグニッション・インターロック装置（呼気アルコール検査装置）
    D: 外部バックミラー
  answer: C
  explanation: 付録Eには、制限コードP39は「イグニッション・インターロック装置の義務付け（Ignition Interlock required）」と記載されています。
- id: 397
  category: license_system
  question: 職業運転免許証（Occupational driver's license）の年間手数料はいくらですか？
  choices:
    A: 10ドル
    B: 16ドル
    C: 21ドル
    D: 25ドル
  answer: A
  explanation: 運転免許証手数料表（Driver License Fees table）によると、職業運転免許証の新規取得または更新には年間10ドルかかります。
- id: 398
  category: vehicle_information
  question: 運転者に外部バックミラーまたは補聴器の使用を義務付ける制限コードはどれですか？
  choices:
    A: コードH
    B: コードS
    C: コードU
    D: コードW
  answer: B
  explanation: 制限コードSは、付録Eで「外部バックミラーまたは補聴器（Outside rearview mirror or hearing aid）」と説明されています。
- id: 399
  category: license_system
  question: 米国への一時滞在者に発行される期間限定運転免許証（Limited term driver's license）の手数料はいくらですか？
  choices:
    A: 16ドル
    B: 21ドル
    C: 25ドル
    D: 33ドル
  answer: C
  explanation: 運転免許証手数料表に記載されているように、米国への一時滞在者向けの期間限定運転免許証の手数料は25ドルです。
- image: stop.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に進入する前に完全に停止しなければならないことを意味します。交通状況や歩行者を確認してから進んでください。
  id: 400
- image: yield.png
  category: signs_and_signals
  question: この標識は運転者に何を求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通に合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 止まらずに進行する
  answer: C
  explanation: 赤と白の三角形の「YIELD（ゆずれ）」標識は、減速して他の車両や歩行者に優先権（right-of-way）を譲らなければならないことを意味します。他の人や車が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 401
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路など、進入すると対向車と衝突する危険がある場所で見られます。
  id: 402
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見たら、どうするべきですか？
  choices:
    A: Uターンする
    B: 注意しながら運転を続ける
    C: 停止して後退するか、方向転換する（逆走しているため）
    D: 加速してそのエリアから素早く抜け出す
  answer: C
  explanation: 赤と白の「WRONG WAY（逆走）」標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に方向転換するか後退してください。
  id: 403
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方向（左方向）に流れている
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、この道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 404
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 他の車両の追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、この場所でのUターン（転回）が禁止されていることを意味します。
  id: 405
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行動は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、この交差点での左折が許可されていないことを意味します。
  id: 406
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、この場所での右折が禁止されていることを意味します。
  id: 407
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道路が狭くなる
    B: この区間では他の車両を追い越してはならない
    C: この先、対面通行
    D: 右側を通行する
  answer: B
  explanation: 白黒のペナント型（三角旗型）の「NO PASSING ZONE（追い越し禁止区間）」標識は、このエリアで他の車両を追い越すことが許可されていないことを意味します。これは追い越し禁止区間の始まりを示しています。
  id: 408
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線が終了する
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 409
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色から判断して、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事用標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 410
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: 前方に動物園またはアニマルパークがある
    B: このエリアでは鹿が頻繁に道路を横断する
    C: 前方に狩猟エリアがある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 411
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 前方にスクールゾーンがある
    B: 前方に横断歩道がある
    C: 近くにハイキングコースがある
    D: 前方にバス停がある
  answer: B
  explanation: 歩行者の図が描かれた黄色いひし形の標識は、前方に横断歩道があることを警告しています。道路を横断する歩行者のために停止する準備をしてください。
  id: 412
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは学校の横断歩道
    D: 病院の区域
  answer: C
  explanation: 五角形の蛍光黄緑色の標識は、スクールゾーンまたは学校の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 413
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い円形の標識は何を警告していますか？
  choices:
    A: 前方にラウンドアバウトがある
    B: 病院の区域
    C: 前方に踏切がある
    D: 追い越し禁止区間
  answer: C
  explanation: 黒い「X」と2つの「R」が描かれた黄色い円形の標識は、前方に踏切があることを示す事前警告標識です。速度を落とし、列車の接近を目と耳で確認してください。
  id: 414
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 学校の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型の踏切標識（クロスバック）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は、停止しなければなりません。
  id: 415
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: 前方の道路が行き止まりである
    B: 右折必須
    C: 前方に右カーブがある
    D: 前方に迂回路がある
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、前方の道路にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 416
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示す
    B: より大幅な減速を必要とする急な曲がり角を警告する
    C: 右折専用を意味する
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角を示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 417
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道路
    B: 前方に単一のカーブがある
    C: 反対方向への2つの連続するカーブ
    D: 前方にラウンドアバウトがある
  answer: C
  explanation: リバースカーブ（S字カーブ）の標識は、前方に反対方向への2つのカーブがあることを警告しています。速度を落とし、道路が最初に一方へ、次に他方へ曲がることに備えてください。
  id: 418
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 単一の急カーブ
    B: 滑りやすい路面
    C: 前方に連続するカーブや曲がり角がある
    D: 前方に丘がある
  answer: C
  explanation: つづら折りの標識は、前方に連続するカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 419
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線が終了する
    B: 別の道路からの合流車両がある
    C: 中央分離帯のある幹線道路が始まる
    D: 道路が1車線に狭まる
  answer: B
  explanation: 黄色いひし形の合流標識は、別の道路からの車両があなたの車線に合流してくることを警告しています。速度と位置を調整する準備をしてください。
  id: 420
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、橋あり
    B: この先、幅員減少
    C: 車線終了
    D: 中央分離帯のある幹線道路の終了
  answer: B
  explanation: この警戒標識は、この先の道路が狭くなることを示しています。道路幅の減少に備え、車線内の位置を調整してください。
  id: 421
- image: divided_highway.png
  category: signs_and_signals
  question: この標識は、この先に何があることを示していますか？
  choices:
    A: 道路の終点
    B: 対面通行
    C: 中央分離帯のある幹線道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や防護柵で対向車線と区切られた幹線道路（ディバイデッド・ハイウェイ）になることを警告しています。右側を通行してください。
  id: 422
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある幹線道路の始まり
    B: 中央分離帯のある幹線道路が終わり、対面通行に戻る
    C: この先、合流地点あり
    D: この先、道路工事中
  answer: B
  explanation: この標識は、中央分離帯のある幹線道路が終了することを警告しています。対向車線との間を区切る中央分離帯がなくなります。対面通行に備えてください。
  id: 423
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある幹線道路の始まり
    B: この先、追い越し可能区間
    C: この先、対面通行 — 車両が双方向に通行する
    D: この先、車線変更あり
  answer: C
  explanation: この標識は、この先が対面通行になることを警告しています。一方通行の道路や中央分離帯のある幹線道路が終わり、反対方向に向かう車両とすれ違うことになります。
  id: 424
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状況を警告していますか？
  choices:
    A: 凍結した路面状況
    B: 濡れると滑りやすい道路
    C: この先、曲がりくねった道路
    D: でこぼこした路面
  answer: B
  explanation: 「濡れると滑りやすい（Slippery when wet）」の標識は、雨天時や路面が濡れているときに非常に滑りやすくなることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 425
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 道路の段差
    B: でこぼこした路面
    C: この先、急な坂道または勾配あり
    D: 道路工事
  answer: C
  explanation: この標識は、この先に急な坂道や勾配があることを警告しています。特にトラックの運転時や牽引時には、速度を調整し、低速ギアにシフトダウンする必要があるかもしれません。
  id: 426
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は、何に備えるよう警告していますか？
  choices:
    A: この先、一時停止標識あり
    B: この先、信号機あり
    C: 横断歩道（スクールゾーン）
    D: 警察の検問所
  answer: B
  explanation: この標識は、この先に信号機があることを警告しています。信号が赤または黄色の場合は停止する準備をしてください。この標識は、遠くから信号機が見えにくい場所によく設置されます。
  id: 427
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識は、この先に何があることを示していますか？
  choices:
    A: ゆずりあえ（Yield）の標識
    B: 信号機
    C: 必ず停止しなければならない一時停止標識
    D: スピードバンプ（減速帯）
  answer: C
  explanation: この標識は、この先に一時停止標識があることを警告しています。減速を始め、一時停止標識で完全に停止する準備をしてください。
  id: 428
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、踏切あり
    B: この先、十字路または交差点あり
    C: この先、病院あり
    D: 横断歩道
  answer: B
  explanation: この標識は、この先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 429
- image: side_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、T字路あり
    B: 右側から合流する脇道あり
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は、右側から合流する脇道があることを警告しています。脇道から幹線道路に進入してくる車両に注意してください。
  id: 430
- image: added_lane.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 車線が合流する
    B: 車線が減少する
    C: 新しい車線が追加されるため、合流の必要はない
    D: 右折が義務付けられている
  answer: C
  explanation: 車線追加の標識は、合流を必要とせずに新しい車線が幹線道路に加わることを意味します。ランプ（進入路）から進入する車両には専用の新しい車線があります。
  id: 431
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時も停止すること
    B: このエリアでの駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろしや乗降
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」の標識は、このエリアに車両を駐車できないことを意味します。乗客の乗降のために短時間停止することは許可されています。
  id: 432
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識があるスペースには誰が駐車できますか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用プラカードまたはナンバープレートを掲示している車両のみ
    D: 障害のある同乗者がいるすべての運転手
  answer: C
  explanation: 車椅子のマークが描かれた青い標識は、障害者専用の駐車場を示しています。有効な障害者用駐車プラカードまたはナンバープレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 433
