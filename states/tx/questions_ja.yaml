- id: 334
  category: driver_responsibility
  question: 一酸化炭素中毒を防ぐために、してはいけないことは次のうちどれですか？
  choices:
    A: 新鮮な空気を十分に取り入れるようにする
    B: 別の車に接近して追従しているときに通気口を開けたままにする
    C: 中毒の被害者を新鮮な空気の場所に移動させる
    D: 中毒の被害者に遭遇した場合は911に電話する
