    D: 肝臓がアルコールを処理する速度
  answer: A
  explanation: 血中アルコール濃度（BAC）は、血流中の体液の量に対するエチルアルコールの割合として表される、血中のアルコール量と定義されています。
- id: 343
  category: vehicle_information
  question: 運転手を含め、何人以上の乗客を輸送するように設計されている場合、その車両は商用自動車（commercial motor vehicle）とみなされますか？
