questions:
- id: 1
  category: license_system
  question: ¿En Ohio, cuál es la edad mínima que una persona debe cumplir para solicitar
    una Tarjeta de Identificación de Permiso de Instrucción Temporal (TIPIC)?
  choices:
    A: 15 años
    B: 15 años y 6 meses
    C: 16 años
    D: 14 años y 9 meses
  answer: B
  explanation: Según el BMV de Ohio, un solicitante debe tener al menos 15 años y
    seis meses de edad para solicitar una Tarjeta de Identificación de Permiso de
    Instrucción Temporal (TIPIC).
- id: 2
  category: license_system
  question: ¿Cuánto tiempo debe tener su TIPIC de Ohio un solicitante menor de 18
    años antes de ser elegible para realizar el examen de habilidades viales?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Ohio exige que los conductores menores de 18 años mantengan
    su permiso temporal durante al menos seis meses antes de solicitar una licencia
    de conducir a prueba (probationary license).
- id: 3
  category: license_system
  question: Durante los primeros 12 meses de tener una licencia a prueba de Ohio,
    ¿entre qué horas tiene prohibido conducir un conductor de 16 años a menos que
    esté acompañado por un padre o tutor?
  choices:
    A: 11 p.m. a 5 a.m.
    B: 10 p.m. a 6 a.m.
    C: Medianoche a 6 a.m.
    D: 1 a.m. a 5 a.m.
  answer: C
  explanation: Los titulares de licencias a prueba que tienen 16 años tienen restringido
    conducir entre la medianoche y las 6 a.m., a menos que estén con un padre o tutor,
    o viajen hacia/desde el trabajo, la escuela o la iglesia con la documentación
    correspondiente.
- id: 4
  category: license_system
  question: Una vez que el titular de una licencia a prueba de Ohio cumple 17 años,
    la restricción de conducción nocturna cambia. ¿Entre qué horas tienen restringido
    conducir?
  choices:
    A: Medianoche a 6 a.m.
    B: 1 a.m. a 5 a.m.
    C: 11 p.m. a 4 a.m.
    D: 2 a.m. a 6 a.m.
  answer: B
  explanation: Para los titulares de licencias a prueba de 17 años en Ohio, la restricción
    de conducción es de 1 a.m. a 5 a.m., a menos que estén acompañados por un padre
    o tutor.
- id: 5
  category: license_system
  question: Durante los primeros 12 meses de tener una licencia a prueba de Ohio,
    ¿cuántas personas que no sean familiares tiene permitido llevar el conductor como
    pasajeros sin la presencia de un padre o tutor?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Las leyes de GDL (Licencia de Conducir Graduada) de Ohio establecen
    que, durante los primeros 12 meses, el titular de una licencia a prueba no puede
    operar un vehículo con más de una persona que no sea un familiar, a menos que
    esté acompañado por un padre o tutor.
- id: 6
  category: license_system
  question: Para obtener una licencia a prueba en Ohio, ¿cuántas horas de experiencia
    de conducción certificada debe completar un conductor menor de 18 años, incluyendo
    la conducción nocturna?
  choices:
    A: 40 horas totales, 5 de noche
    B: 50 horas totales, 10 de noche
    C: 60 horas totales, 15 de noche
    D: 30 horas totales, 10 de noche
  answer: B
  explanation: Ohio requiere 50 horas de experiencia de conducción, de las cuales
    al menos 10 deben ser de noche, verificadas por un padre o tutor.
- id: 7
  category: license_system
  question: Si se muda a una nueva residencia dentro de Ohio, ¿dentro de cuántos días
    debe notificar al BMV su cambio de dirección?
  choices:
    A: 10 días
    B: 30 días
    C: 7 días
    D: 14 días
  answer: A
  explanation: La ley de Ohio exige que los titulares de licencias notifiquen a la
    Oficina de Vehículos Motorizados (BMV) cualquier cambio de dirección dentro de
    los 10 días posteriores a la mudanza.
- id: 8
  category: license_system
  question: Bajo el sistema de puntos de Ohio, ¿con cuántos puntos dentro de un período
    de dos años se suspenderá automáticamente la licencia de un conductor?
  choices:
    A: 6 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: En Ohio, si un conductor acumula 12 puntos en un período de dos años,
    sus privilegios de conducción serán suspendidos por seis meses.
- id: 9
  category: license_system
  question: En Ohio, un conductor que ha acumulado al menos dos pero menos de 12 puntos
    puede obtener un crédito de dos puntos al completar un curso de conducción correctiva
    aprobado. ¿Con qué frecuencia se puede aplicar este crédito?
  choices:
    A: Una vez al año
    B: Una vez cada 3 años
    C: Una vez cada 5 años
    D: Solo una vez en la vida
  answer: B
  explanation: Ohio permite a los conductores tomar un curso de conducción correctiva
    para obtener un crédito de dos puntos una vez cada tres años, hasta cinco veces
    en la vida.
- id: 10
  category: license_system
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    un conductor en Ohio que es menor de 21 años?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: Ohio tiene una política de 'tolerancia cero' para el consumo de alcohol
    y la conducción de menores de edad; el límite legal de BAC para conductores menores
    de 21 años es de 0.02%.
- id: 11
  category: license_system
  question: Cuando el titular de un TIPIC es menor de 18 años, debe estar acompañado
    por un padre, tutor o custodio con licencia. Si el titular tiene 18 años o más,
    ¿quién debe acompañarlo?
  choices:
    A: Cualquier persona con una licencia válida
    B: Un conductor con licencia de al menos 21 años de edad
    C: Un conductor con licencia de al menos 25 años de edad
    D: Puede conducir solo durante las horas del día
  answer: B
  explanation: Independientemente de la edad del titular del permiso, debe estar acompañado
    por un conductor con licencia que tenga al menos 21 años de edad, sentado en el
    asiento del pasajero delantero.
- id: 12
  category: license_system
  question: ¿Cuál es el monto mínimo de cobertura requerido para 'daños a la propiedad'
    (property damage) en una póliza de seguro de automóvil válida en Ohio?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de responsabilidad financiera de Ohio requiere un mínimo de
    $25,000 para daños a la propiedad en cualquier accidente.
- id: 13
  category: license_system
  question: Si un conductor de Ohio es condenado por una infracción de 'Operar un
    vehículo después del consumo por menores de edad' (OVUAC), ¿cuántos puntos se
    asignan a su licencia?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 0 puntos, pero se suspende la licencia
  answer: B
  explanation: Una condena por OVUAC en Ohio resulta en la adición de 4 puntos al
    registro del conductor.
- id: 14
  category: license_system
  question: ¿Cuándo vence normalmente una licencia de prueba (probationary license)
    en Ohio?
  choices:
    A: Cuatro años a partir de la fecha de emisión
    B: En el cumpleaños número 18 del conductor
    C: En el cumpleaños número 21 del conductor
    D: Dos años a partir de la fecha de emisión
  answer: C
  explanation: En Ohio, una licencia de prueba es válida hasta que el conductor cumple
    21 años.
- id: 15
  category: license_system
  question: Para cumplir con los requisitos federales de 'REAL ID' para abordar vuelos
    nacionales, ¿qué tipo de credencial de Ohio debe obtener un residente?
  choices:
    A: Tarjeta estándar (Standard Card)
    B: Tarjeta de cumplimiento (Compliant Card)
    C: Permiso temporal
    D: Solo licencia de conducir comercial
  answer: B
  explanation: Ohio ofrece tarjetas 'Compliant' (de cumplimiento) que cumplen con
    los estándares federales de REAL ID para la seguridad nacional y son necesarias
    para abordar vuelos comerciales y entrar en instalaciones federales.
- id: 16
  category: license_system
  question: Los nuevos residentes de Ohio que posean una licencia de conducir válida
    de otro estado deben obtener una licencia de Ohio dentro de ¿cuántos días después
    de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según el BMV de Ohio, los nuevos residentes deben obtener una licencia
    de conducir de Ohio dentro de los 30 días posteriores a establecer su residencia
    en el estado.
- id: 17
  category: license_system
  question: Para aprobar el examen de la vista para una licencia de conducir de Ohio
    sin restricciones, ¿qué agudeza visual mínima debe tener el solicitante en cada
    ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/70
  answer: C
  explanation: Ohio requiere una agudeza visual mínima de 20/40 en cada ojo para calificar
    para una licencia de conducir sin restricciones.
- id: 18
  category: license_system
  question: Si una licencia de conducir de Ohio ha estado vencida por más de ______,
    la persona debe realizar nuevamente los exámenes de conocimientos y de habilidades
    de manejo para obtener una nueva licencia.
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: En Ohio, si una licencia está vencida por más de seis meses, el titular
    ya no es elegible para una renovación simple y debe completar todo el proceso
    de evaluación nuevamente.
- id: 19
  category: license_system
  question: Bajo el sistema de puntos de Ohio, ¿cuántos puntos se asignan al registro
    de un conductor por una condena de 'Operar un vehículo bajo la influencia del
    alcohol y/o drogas' (OVI)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Las infracciones de tráfico graves en Ohio, como OVI, carreras de autos
    (drag racing) o huir de un oficial de la ley, resultan en la adición de 6 puntos
    al registro del conductor.
- id: 20
  category: license_system
  question: ¿Por cuánto tiempo es válida una Tarjeta de Identificación de Permiso
    de Instrucción Temporal (TIPIC) de Ohio a partir de la fecha de su emisión?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 4 años
  answer: B
  explanation: Un TIPIC de Ohio vence exactamente un año después de la fecha de emisión.
- id: 21
  category: license_system
  question: ¿En Ohio, quién tiene la autoridad legal para firmar la solicitud de licencia
    de un menor y también se reserva el derecho de retirar ese consentimiento en cualquier
    momento antes de que el menor cumpla 18 años?
  choices:
    A: Solo un padre biológico
    B: Un padre, tutor u otra persona que tenga la custodia legal
    C: Cualquier conductor con licencia mayor de 21 años
    D: El director de la escuela secundaria del menor
  answer: B
  explanation: La ley de Ohio exige que un padre, tutor o persona con custodia legal
    firme por un menor. Esta persona también puede presentar una solicitud por escrito
    al BMV para cancelar la licencia del menor.
- id: 22
  category: license_system
  question: ¿Cuál es el monto mínimo de cobertura de seguro de responsabilidad civil
    requerido en Ohio por 'lesiones corporales' a una persona en cualquier accidente?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: La ley de Responsabilidad Financiera de Ohio exige un mínimo de $25,000
    por lesiones corporales a una persona.
- id: 23
  category: license_system
  question: Si se le condena por una primera infracción de 'Incumplimiento' (falta
    de presentación de prueba de seguro) en Ohio, ¿cuál es la tarifa de restablecimiento
    para recuperar su licencia?
  choices:
    A: $50
    B: $100
    C: $150
    D: $600
  answer: C
  explanation: Para una primera infracción de incumplimiento de la ley de responsabilidad
    financiera, Ohio cobra una tarifa de restablecimiento de $150. Las infracciones
    posteriores conllevan tarifas más altas ($300 y $600).
- id: 24
  category: license_system
  question: ¿Una licencia de conducir estándar Clase D de Ohio le permite operar cuál
    de los siguientes vehículos?
  choices:
    A: Cualquier vehículo con una Clasificación de Peso Bruto del Vehículo (GVWR)
      superior a 26,001 lb
    B: Una motocicleta sin un endoso por separado
    C: Un automóvil de pasajeros o vehículo comercial que no exceda las 26,000 lb
      de GVWR
    D: Un autobús escolar diseñado para transportar a más de 15 pasajeros
  answer: C
  explanation: Una licencia Clase D es la licencia no comercial estándar para automóviles
    de pasajeros y camiones pequeños de menos de 26,001 lb que no requieren una CDL.
- id: 25
  category: license_system
  question: ¿En Ohio, cuántos puntos se asignan a su historial de conducción por una
    condena de 'Carreras de velocidad' (Drag Racing)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Las carreras de velocidad se consideran una infracción de tráfico grave
    en Ohio y conllevan una penalización de 6 puntos.
- id: 26
  category: license_system
  question: Si un conductor de Ohio menor de 18 años acumula tres puntos en su historial
    de conducción, ¿cuál es la sanción obligatoria?
  choices:
    A: Una revocación permanente de la licencia
    B: Una suspensión de la licencia por 90 días
    C: Solo una carta de advertencia del BMV
    D: El conductor debe volver a tomar solo el examen escrito
  answer: B
  explanation: Según la ley de Ohio, si el titular de una licencia de prueba (menor
    de 18 años) acumula tres puntos, su licencia se suspende por 90 días.
- id: 27
  category: license_system
  question: 'Para obtener una licencia de conducir de Ohio ''Cumplidora'' (REAL ID),
    el solicitante debe presentar pruebas de todo lo siguiente, EXCEPTO:'
  choices:
    A: Nombre legal completo y fecha de nacimiento
    B: Número de Seguro Social
    C: Dos documentos que acrediten la dirección residencial en Ohio
    D: Prueba de un diploma de escuela secundaria o GED
  answer: D
  explanation: El nivel educativo no es un requisito para una REAL ID. Los solicitantes
    deben demostrar identidad, número de seguro social, presencia legal y residencia.
- id: 28
  category: license_system
  question: 'Si un conductor de Ohio menor de 21 años es condenado por una primera
    infracción de OVI (Operar un vehículo después del consumo por parte de un menor),
    su licencia será suspendida por al menos:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: La suspensión por un OVI de un menor de edad (OVUAC) en Ohio varía
    desde un mínimo de 90 días hasta un máximo de dos años.
- id: 29
  category: license_system
  question: 'Al solicitar una licencia de Ohio, si tiene una condición física o mental
    que pueda afectar su capacidad para conducir de manera segura, usted debe:'
  choices:
    A: Serle denegada la licencia permanentemente
    B: Presentar un informe médico de un médico para su revisión por parte del BMV
    C: Conducir solo durante las horas del día
    D: Tener un pasajero con licencia con usted en todo momento
  answer: B
  explanation: Ohio requiere que los conductores con ciertas condiciones médicas presenten
    un perfil médico completado por un médico para garantizar que puedan operar un
    vehículo de manera segura.
- id: 30
  category: driver_testing
  question: ¿En Ohio, cuál es el límite de velocidad máximo en los callejones municipales?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Según el Compendio de Leyes de Vehículos Motorizados de Ohio, el límite
    de velocidad en los callejones municipales es de 15 mph.
- id: 31
  category: driver_testing
  question: ¿Cuál es el límite de velocidad en una zona escolar de Ohio durante el
    recreo escolar o mientras los niños entran o salen de la escuela durante las horas
    de apertura o cierre?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: La ley de Ohio exige un límite de velocidad de 20 mph en las zonas
    escolares durante las horas restringidas cuando hay niños presentes.
- id: 32
  category: driver_testing
  question: Si un solicitante reprueba el examen de conducción o de maniobrabilidad
    de Ohio, ¿cuánto tiempo debe esperar antes de ser elegible para realizar el examen
    nuevamente?
  choices:
    A: 24 horas
    B: 48 horas
    C: 7 días
    D: 14 días
  answer: C
  explanation: Si reprueba el examen de habilidades (conducción o maniobrabilidad),
    debe esperar al menos siete días antes de volver a realizar la prueba.
- id: 33
  category: driver_testing
  question: En Ohio, ¿cuáles son los requisitos mínimos estatales para la cobertura
    del seguro de responsabilidad civil por 'lesiones corporales'?
  choices:
    A: $15,000 por persona / $30,000 por accidente
    B: $25,000 por persona / $50,000 por accidente
    C: $50,000 por persona / $100,000 por accidente
    D: $10,000 por persona / $20,000 por accidente
  answer: B
  explanation: La ley de Ohio exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones corporales o muerte de una persona en cualquier accidente,
    y de $50,000 por lesiones corporales o muerte de dos o más personas en cualquier
    accidente.
- id: 34
  category: driver_testing
  question: Bajo el sistema de puntos de Ohio, ¿cuántos puntos se asignan por una
    infracción de exceso de velocidad en la que el conductor supera el límite por
    30 mph o más?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Exceder el límite de velocidad por 30 mph o más resulta en la adición
    de 4 puntos al registro del conductor en Ohio.
- id: 35
  category: driver_testing
  question: Cuando un autobús escolar se detiene en una carretera con menos de cuatro
    carriles y sus luces rojas están parpadeando, ¿a cuántos pies de distancia como
    mínimo deben detenerse los conductores que se aproximan desde cualquier dirección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: A
  explanation: La ley de Ohio exige que los conductores se detengan al menos a 10
    pies de la parte delantera o trasera de un autobús escolar cuando este esté dejando
    o recogiendo pasajeros en carreteras con menos de cuatro carriles.
- id: 36
  category: driver_testing
  question: En Ohio, ¿hasta qué edad o estatura se requiere que los niños utilicen
    un asiento elevador (booster seat)?
  choices:
    A: 6 años o 4 pies 5 pulgadas
    B: 7 años o 4 pies 7 pulgadas
    C: 8 años o 4 pies 9 pulgadas
    D: 10 años o 5 pies de altura
  answer: C
  explanation: La ley de Ohio exige que los niños menores de 8 años o que midan menos
    de 4 pies y 9 pulgadas de estatura utilicen un asiento elevador (booster seat).
- id: 37
  category: driver_testing
  question: ¿Cuál es el límite legal de Concentración de Alcohol en Sangre (BAC) para
    conductores adultos (21 años o más) en Ohio?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En Ohio, es ilegal que un conductor adulto (21+) opere un vehículo
    con un BAC de 0.08% o superior.
- id: 38
  category: driver_testing
  question: ¿Cuántos puntos se asignan al registro de un conductor de Ohio por una
    condena de 'Carreras callejeras' (Drag Racing)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Las carreras callejeras son una infracción grave en Ohio y conllevan
    una penalización de 6 puntos en la licencia de conducir.
- id: 39
  category: driver_testing
  question: Para aprobar el examen de conocimientos (escrito) de Ohio, ¿qué porcentaje
    de las preguntas debe responder correctamente el solicitante como mínimo?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: B
  explanation: El BMV de Ohio requiere una puntuación aprobatoria del 75% en el examen
    de conocimientos (30 de 40 preguntas correctas).
- id: 40
  category: driver_testing
  question: A partir de julio de 2020, ¿dónde deben mostrar las placas de matrícula
    los residentes de Ohio en sus vehículos de pasajeros?
  choices:
    A: Solo en el parachoques delantero
    B: Solo en el parachoques trasero
    C: Tanto en el parachoques delantero como en el trasero
    D: En la ventana trasera
  answer: B
  explanation: A partir del 1 de julio de 2020, la ley de Ohio ya no exige una placa
    de matrícula delantera en la mayoría de los vehículos de pasajeros; solo se requiere
    la placa trasera.
- id: 41
  category: driver_testing
  question: ¿En una autopista con un límite de velocidad de 55 mph o más, cuántos
    puntos se asignan si lo sorprenden conduciendo a 15 mph por encima del límite?
  choices:
    A: 0 puntos
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: En Ohio, exceder el límite de velocidad entre 11 y 29 mph en una autopista
    con un límite de 55 mph o más resulta en la asignación de 2 puntos.
- id: 42
  category: driver_testing
  question: La ley 'Move Over' (Hacerse a un lado) de Ohio exige que los conductores
    hagan ¿qué al acercarse a un vehículo de emergencia estacionado con luces intermitentes?
  choices:
    A: Detenerse por completo hasta que el vehículo se retire
    B: Mantener la velocidad pero cambiarse al carril izquierdo
    C: Proceder con precaución y, si es posible, cambiarse a un carril adyacente
    D: Aumentar la velocidad para rebasar el vehículo rápidamente
  answer: C
  explanation: La ley 'Move Over' de Ohio exige que los conductores se cambien a un
    carril adyacente si es posible o reduzcan la velocidad y procedan con precaución
    al pasar vehículos de emergencia o de seguridad pública estacionados.
- id: 43
  category: driver_testing
  question: Al solicitar un TIPIC (permiso de instrucción temporal) en Ohio, se le
    pregunta al solicitante si desea unirse al registro 'Donate Life Ohio'. ¿Qué significa
    este registro?
  choices:
    A: Registro de votantes
    B: Donación de órganos y tejidos
    C: Donaciones caritativas para la reparación de carreteras
    D: Sistema de notificación de contactos de emergencia
  answer: B
  explanation: El registro 'Donate Life Ohio' es la base de datos del estado para
    personas que desean ser donantes de órganos, ojos y tejidos.
- id: 44
  category: driver_testing
  question: ¿Qué tipo de señal se utiliza en Ohio para identificar un 'Vehículo de
    movimiento lento' (uno que viaja a 25 mph o menos)?
  choices:
    A: Una señal circular amarilla
    B: Una señal cuadrada verde
    C: Una señal triangular de color naranja fluorescente
    D: Una señal rectangular blanca
  answer: C
  explanation: Los vehículos de movimiento lento, como la maquinaria agrícola o los
    carruajes tirados por caballos, deben mostrar un emblema triangular de color naranja
    fluorescente con un borde reflectante rojo.
- id: 45
  category: driver_testing
  question: Durante la prueba de maniobrabilidad de Ohio, ¿cuál de las siguientes
    acciones resultará en una reprobación automática?
  choices:
    A: Detenerse para revisar los espejos
    B: Poner la marcha atrás más de una vez
    C: Golpear o derribar un marcador
    D: Tardar más de 2 minutos en completar la prueba
  answer: C
  explanation: En la prueba de habilidades viales de Ohio, golpear o derribar un marcador
    durante la parte de maniobrabilidad es motivo de reprobación inmediata.
- id: 46
  category: driver_testing
  question: 'La ley de responsabilidad financiera de Ohio exige que los conductores
    cuenten con una cantidad mínima de seguro por ''lesiones corporales o muerte de
    una persona en cualquier accidente'' por un monto de:'
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Ohio exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones corporales o muerte de una persona en cualquier accidente.
- id: 47
  category: driver_testing
  question: En Ohio, ¿es legal girar a la izquierda con el semáforo en rojo?
  choices:
    A: No, nunca es legal
    B: Sí, pero solo desde una calle de un solo sentido hacia otra calle de un solo
      sentido
    C: Sí, desde cualquier calle siempre que se detenga primero
    D: Sí, pero solo entre la medianoche y las 5:00 AM
  answer: B
  explanation: La ley de Ohio permite girar a la izquierda en rojo solo cuando se
    gira desde una calle de un solo sentido hacia otra calle de un solo sentido, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 48
  category: driver_testing
  question: En una carretera con cuatro o más carriles, si un autobús escolar se detiene
    con sus luces rojas intermitentes y el brazo de parada extendido, ¿qué tráfico
    debe detenerse?
  choices:
    A: Todo el tráfico en ambas direcciones
    B: Solo el tráfico que circula detrás del autobús
    C: Solo el tráfico que se aproxima por el frente
    D: No se requiere que el tráfico se detenga si hay cuatro carriles
  answer: B
  explanation: En Ohio, en una carretera con cuatro o más carriles, solo el tráfico
    que circula en la misma dirección que el autobús escolar debe detenerse. En carreteras
    con menos de cuatro carriles, todo el tráfico debe detenerse.
- id: 49
  category: driver_testing
  question: 'Si un conductor de Ohio se niega a realizarse una prueba química (sangre,
    aliento u orina) cuando lo solicita la policía, su licencia estará sujeta a una
    Suspensión Administrativa de Licencia (ALS) inmediata por al menos:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito de Ohio, la primera negativa
    a realizarse una prueba química resulta en una suspensión automática de la licencia
    por un año.
- id: 50
  category: driver_testing
  question: 'Según la ley de Ohio, los niños deben estar asegurados en un asiento
    de seguridad infantil si:'
  choices:
    A: Tienen menos de 4 años O pesan menos de 40 libras
    B: Tienen menos de 6 años O pesan menos de 60 libras
    C: Tienen menos de 2 años O pesan menos de 20 libras
    D: Tienen menos de 5 años O pesan menos de 50 libras
  answer: A
  explanation: La ley de Ohio exige que los niños menores de 4 años o que pesen menos
    de 40 libras estén debidamente asegurados en un asiento de seguridad infantil.
- id: 51
  category: driver_testing
  question: ¿En Ohio, los niños menores de qué edad y estatura deben usar un asiento
    elevador (booster seat)?
  choices:
    A: Menores de 6 años y menos de 4 pies de estatura
    B: Menores de 8 años y menos de 4 pies y 9 pulgadas de estatura
    C: Menores de 10 años y menos de 5 pies de estatura
    D: Menores de 7 años y menos de 4 pies y 6 pulgadas de estatura
  answer: B
  explanation: La ley de Ohio exige que los niños menores de 8 años usen un asiento
    elevador a menos que hayan alcanzado una estatura de 4 pies y 9 pulgadas.
- id: 52
  category: driver_testing
  question: ¿Cuál es la distancia de seguimiento recomendada detrás de otro vehículo
    en Ohio bajo condiciones normales de conducción?
  choices:
    A: La longitud de un vehículo
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: C
  explanation: El Manual del Conductor de Ohio recomienda una distancia de seguimiento
    mínima de tres segundos para permitir un tiempo de reacción seguro.
- id: 53
  category: driver_testing
  question: 'En Ohio, una condena por arrojar basura desde un vehículo motorizado
    puede resultar en una multa máxima de hasta:'
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Arrojar basura es un delito menor de tercer grado en Ohio, punible
    con una multa de hasta $1,000 y/o hasta seis meses de cárcel.
- id: 54
  category: driver_testing
  question: 'Cuando se aproxima un vehículo de emergencia con luces intermitentes
    y sirena, la ley de Ohio le exige:'
  choices:
    A: Detenerse exactamente donde está
    B: Aumentar la velocidad para despejar el camino
    C: Detenerse en el borde derecho de la carretera y parar
    D: Detenerse en el borde izquierdo de la carretera y parar
  answer: C
  explanation: La ley de Ohio exige que los conductores se dirijan al borde derecho
    de la carretera o a la acera y se detengan hasta que el vehículo de emergencia
    haya pasado.
- id: 55
  category: driver_testing
  question: Al estacionar un vehículo en paralelo a una acera en Ohio, ¿las ruedas
    no deben estar a más de cuántas pulgadas de la acera?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: La ley de Ohio establece que un vehículo debe estacionarse en paralelo
    a la acera y a no más de 12 pulgadas de la misma.
- id: 56
  category: driver_testing
  question: En Ohio, ¿debe activar su señal de giro al menos cuántos pies antes de
    girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Ohio exige que los conductores indiquen su intención de girar
    al menos 100 pies antes de realizar el giro.
- id: 57
  category: driver_responsibility
  question: En Ohio, ¿cuál es la cobertura mínima de seguro requerida por lesiones
    corporales o muerte de dos o más personas en un solo accidente?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: La ley de Responsabilidad Financiera de Ohio exige un mínimo de $50,000
    por lesiones corporales o muerte de dos o más personas en un solo accidente.
- id: 58
  category: driver_responsibility
  question: Si un conductor de Ohio se ve involucrado en un choque que resulte en
    lesiones, muerte o daños a la propiedad que superen los $400 y no tiene seguro,
    ¿dentro de cuántos meses debe presentar un informe de choque al BMV?
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: 12 meses
  answer: C
  explanation: Si un conductor no tiene seguro en el momento de un choque que involucre
    lesiones, muerte o daños superiores a $400, se debe presentar un informe ante
    el BMV dentro de los seis meses posteriores al accidente.
- id: 59
  category: driver_responsibility
  question: A partir del 1 de julio de 2020, ¿cuáles son los requisitos de exhibición
    de placas de matrícula para vehículos de pasajeros en Ohio?
  choices:
    A: Se debe exhibir una placa solo en la parte delantera
    B: Se debe exhibir una placa solo en la parte trasera
    C: Se deben exhibir dos placas, una en la parte delantera y otra en la trasera
    D: Las placas solo son obligatorias para vehículos comerciales
  answer: B
  explanation: A partir del 1 de julio de 2020, la ley de Ohio cambió para exigir
    que se exhiba solo una placa de matrícula en la parte trasera de los vehículos
    de pasajeros.
- id: 60
  category: driver_responsibility
  question: ¿Cuál es el cargo de restablecimiento por una primera infracción por no
    mostrar prueba de responsabilidad financiera (seguro) en Ohio?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: B
  explanation: Por una primera infracción por no mantener o mostrar prueba de seguro,
    el BMV de Ohio cobra un cargo de restablecimiento de $100.
- id: 61
  category: driver_responsibility
  question: Si se suspende la licencia de conducir de Ohio por una segunda infracción
    de Responsabilidad Financiera (seguro) dentro de un periodo de cinco años, ¿cuál
    es la duración del periodo de suspensión?
  choices:
    A: 30 días
    B: 90 días
    C: Un año
    D: Dos años
  answer: C
  explanation: Una segunda infracción por no presentar prueba de responsabilidad financiera
    dentro de un periodo de cinco años resulta en una suspensión de los privilegios
    de conducir por un año.
- id: 62
  category: driver_responsibility
  question: Cuando un conductor de Ohio es condenado por una tercera o subsiguiente
    infracción de Responsabilidad Financiera, ¿cuál es el cargo por restablecimiento?
  choices:
    A: $100
    B: $300
    C: $600
    D: $1,000
  answer: C
  explanation: El cargo por restablecimiento para una tercera o subsiguiente infracción
    por no mostrar prueba de seguro en Ohio es de $600.
- id: 63
  category: driver_responsibility
  question: Después de una suspensión por Responsabilidad Financiera, ¿durante cuántos
    años debe un conductor de Ohio mantener un certificado de seguro especial "SR-22"
    (u otra prueba de responsabilidad futura) ante el BMV?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores a quienes se les ha suspendido la licencia por infracciones
    de seguro generalmente deben mantener una prueba de responsabilidad financiera
    futura (como un SR-22) durante tres a cinco años, típicamente tres años para las
    infracciones iniciales.
- id: 64
  category: driver_responsibility
  question: Según la ley de Ohio, ¿cuántos puntos se asignan al registro de un conductor
    por "Huir o eludir a un oficial de la ley"?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Huir o eludir a un oficial de la ley es una infracción grave en Ohio
    y conlleva una penalización de 6 puntos.
- id: 65
  category: driver_responsibility
  question: Si usted se ve involucrado en una colisión con un vehículo desatendido
    en Ohio y no puede localizar al propietario, ¿qué debe hacer?
  choices:
    A: Abandonar la escena inmediatamente para evitar bloquear el tráfico
    B: Esperar al menos 4 horas a que regrese el propietario
    C: Dejar una nota con su nombre, dirección y número de registro del vehículo
    D: Solo reportarlo si el daño parece ser superior a $1,000
  answer: C
  explanation: La ley de Ohio exige que los conductores que choquen contra un vehículo
    desatendido dejen su nombre, dirección y número de registro del vehículo en un
    lugar visible del vehículo dañado.
- id: 66
  category: driver_responsibility
  question: En Ohio, ¿cuál de las siguientes infracciones no relacionadas con la conducción
    puede dar lugar a la suspensión de su licencia de conducir?
  choices:
    A: Falta de pago de la manutención infantil
    B: No registrarse para el servicio militar obligatorio (si es requerido)
    C: Falta de pago de impuestos sobre la propiedad
    D: No mantener una tarjeta de biblioteca válida
  answer: A
  explanation: La ley de Ohio permite la suspensión de una licencia de conducir por
    falta de pago de la manutención infantil o por no cumplir con una citación judicial
    relacionada con la manutención infantil.
- id: 67
  category: driver_responsibility
  question: Al vender un vehículo en Ohio, ¿quién es legalmente responsable de completar
    la "Asignación de Propiedad" en el reverso del título y hacer que se notarice?
  choices:
    A: El comprador
    B: El vendedor
    C: El empleado del BMV
    D: El agente de seguros
  answer: B
  explanation: El vendedor es responsable de completar la asignación de propiedad
    en el reverso del título y debe firmarlo en presencia de un notario público antes
    de entregarlo al comprador.
- id: 68
  category: driver_responsibility
  question: 'En Ohio, si usted se ve involucrado en un choque, la ley le exige compartir
    toda la siguiente información con la otra parte, EXCEPTO:'
  choices:
    A: Su nombre y dirección
    B: Su número de registro del vehículo
    C: Su Número de Seguro Social
    D: El nombre y la dirección del propietario del vehículo (si no es usted)
  answer: C
  explanation: Usted debe proporcionar su nombre, dirección y registro del vehículo,
    pero no está legalmente obligado a proporcionar su Número de Seguro Social al
    otro conductor.
- id: 69
  category: driver_responsibility
  question: ¿Cuál es la penalización de puntos por "Carreras" (Racing) en vías públicas
    en Ohio?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Las carreras callejeras son una infracción de tráfico grave en Ohio
    y resultan en la adición de 6 puntos al registro del conductor.
- id: 70
  category: driver_responsibility
  question: Si un conductor de Ohio es sorprendido operando un vehículo sin prueba
    de responsabilidad financiera (seguro), ¿cuál es el cargo por restablecimiento
    para una primera infracción?
  choices:
    A: $50
    B: $100
    C: $300
    D: $600
  answer: B
  explanation: Para una primera infracción por falta de cumplimiento (seguro), el
    conductor debe pagar un cargo de restablecimiento de $100 y proporcionar una prueba
    de seguro (SR-22) durante tres a cinco años.
- id: 71
  category: driver_responsibility
  question: Según la ley de Ohio, un conductor debe presentar un informe de accidente
    ante el BMV si el accidente resultó en daños a la propiedad que superen los ______
    y el conductor no tenía seguro.
  choices:
    A: $100
    B: $250
    C: $400
    D: $1,000
  answer: C
  explanation: Si un accidente involucra más de $400 en daños a la propiedad o cualquier
    lesión personal o muerte y el conductor no tiene seguro, se debe presentar un
    informe ante el BMV.
- id: 72
  category: driver_responsibility
  question: Si la licencia de conducir de un conductor de Ohio es suspendida por una
    segunda infracción por no mostrar prueba de responsabilidad financiera, ¿cuánto
    tiempo dura el "embargo" (impoundment) de sus placas y el registro del vehículo?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: D
  explanation: Por una segunda infracción de incumplimiento dentro de un periodo de
    cinco años, el conductor se enfrenta a una suspensión de un año de la licencia
    y del registro/placas.
- id: 73
  category: driver_responsibility
  question: En Ohio, si un conductor es condenado por "huir o eludir" a un oficial
    de la ley, ¿cuántos puntos se asignan a su historial de conducción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Huir o eludir a un oficial de policía es una infracción grave en Ohio
    y conlleva una asignación automática de 6 puntos.
- id: 74
  category: driver_responsibility
  question: Bajo el "Programa de Selección Aleatoria" de Ohio, ¿qué porcentaje de
    vehículos registrados selecciona el BMV cada semana para que proporcionen prueba
    de seguro?
  choices:
    A: 1%
    B: 5%
    C: 10%
    D: 25%
  answer: B
  explanation: El BMV de Ohio selecciona al azar el 5% de los vehículos registrados
    para verificar que mantienen la responsabilidad financiera (seguro) requerida.
- id: 75
  category: driver_responsibility
  question: Si un conductor de Ohio se ve involucrado en un accidente en el que es
    culpable y no tiene seguro, ¿por cuánto tiempo mínimo se suspenderá su licencia?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: Hasta que se paguen todos los daños y se cumplan los requisitos
  answer: D
  explanation: Se impone una suspensión de seguridad a un conductor sin seguro culpable
    en un accidente hasta que pague los daños, firme un acuerdo de pago o se determine
    que no es responsable.
- id: 76
  category: driver_responsibility
  question: ¿Cuál de las siguientes NO es una forma válida de demostrar responsabilidad
    financiera en Ohio?
  choices:
    A: Una póliza de seguro de responsabilidad civil de automóvil válida
    B: Un certificado de autoseguro emitido por el BMV
    C: Una declaración por escrito de un padre prometiendo pagar los daños
    D: Un bono de $30,000 con el tesorero del estado
  answer: C
  explanation: Las promesas o declaraciones personales no son prueba legal de responsabilidad
    financiera. Las formas válidas incluyen pólizas de seguro, certificados del BMV
    o bonos gubernamentales.
- id: 77
  category: driver_responsibility
  question: En Ohio, ¿cuántos puntos se asignan por una infracción de exceso de velocidad
    en la que el conductor circula a 30 mph por encima del límite establecido?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 0 puntos
  answer: B
  explanation: En Ohio, exceder el límite de velocidad por 30 mph o más resulta en
    una asignación de 4 puntos en el historial del conductor.
- id: 78
  category: driver_responsibility
  question: Si un conductor de Ohio es condenado por "Abandonar la escena de un accidente"
    (atropello y fuga), ¿cuántos puntos se añaden a su licencia?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: No detenerse e identificar su identidad en la escena de una colisión
    (atropello y fuga) resulta en 6 puntos en Ohio.
- id: 79
  category: driver_responsibility
  question: ¿Qué sucede si un residente de Ohio no comparece ante el tribunal por
    una multa de tráfico recibida en otro estado que es miembro del Pacto de Infractores
    No Residentes (Non-Resident Violator Compact)?
  choices:
    A: Nada, Ohio solo rastrea las multas dentro del estado
    B: El conductor debe pagar una multa de $500 al BMV de Ohio
    C: El BMV de Ohio suspenderá la licencia del conductor hasta que se resuelva la
      multa
    D: El conductor deberá volver a realizar el examen de conducir
  answer: C
  explanation: Bajo el Pacto de Infractores No Residentes, Ohio suspenderá la licencia
    de un residente que no resuelva una citación de tráfico en otro estado miembro.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para los vehículos que circulan
    por un callejón dentro de una corporación municipal en Ohio?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: En Ohio, el límite de velocidad legal para cualquier callejón dentro
    de una corporación municipal es de 15 mph.
- id: 81
  category: safe_driving_rules
  question: ¿En Ohio, a cuántos pies de un hidrante de incendios está prohibido estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 5 pies
  answer: A
  explanation: La ley de Ohio prohíbe estacionar un vehículo a menos de 10 pies de
    un hidrante de incendios.
- id: 82
  category: safe_driving_rules
  question: La ley 'Move Over' (Hacerse a un lado) de Ohio exige que los conductores
    se cambien a otro carril, si es posible, al pasar por ¿cuál de los siguientes
    vehículos estacionarios con luces intermitentes?
  choices:
    A: Solo vehículos de policía y bomberos
    B: Solo ambulancias y grúas
    C: Solo vehículos de mantenimiento de carreteras
    D: Todos los anteriores
  answer: D
  explanation: La ley 'Move Over' de Ohio se aplica a todos los vehículos estacionarios
    con luces intermitentes, incluidos los de las fuerzas del orden, servicios de
    emergencia, grúas y vehículos de mantenimiento de carreteras.
- id: 83
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en las rutas estatales dentro de corporaciones
    municipales fuera de los distritos comerciales, a menos que se indique lo contrario?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 50 mph
  answer: B
  explanation: El límite de velocidad para las rutas estatales dentro de corporaciones
    municipales fuera de los distritos comerciales es de 35 mph, a menos que se indique
    un límite diferente.
- id: 84
  category: safe_driving_rules
  question: ¿En Ohio, a cuántos pies de un paso de peatones en una intersección no
    se permite estacionar su vehículo?
  choices:
    A: 10 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: B
  explanation: La ley de Ohio establece que no se puede estacionar un vehículo a menos
    de 20 pies de un paso de peatones en una intersección.
- id: 85
  category: safe_driving_rules
  question: Al usar señales manuales para indicar un giro, ¿qué posición representa
    un giro a la izquierda?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo doblado hacia arriba en un ángulo de 90 grados
    C: Brazo doblado hacia abajo en un ángulo de 90 grados
    D: Brazo agitándose en movimiento circular
  answer: A
  explanation: Para señalar un giro a la izquierda mediante señales manuales, el conductor
    debe extender el brazo izquierdo horizontalmente hacia afuera de la ventana.
- id: 86
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada que se debe mantener
    detrás del vehículo que va delante de usted en condiciones climáticas normales
    en Ohio?
  choices:
    A: La longitud de un vehículo
    B: Dos segundos
    C: Tres segundos
    D: Cinco segundos
  answer: C
  explanation: El manual del conductor de Ohio recomienda una distancia de seguimiento
    de al menos tres segundos para permitir un tiempo de reacción adecuado.
- id: 87
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección sin señales
    de control de tráfico, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda
    B: El vehículo de la derecha
    C: El vehículo que viaja a mayor velocidad
    D: El vehículo que es más grande
  answer: B
  explanation: De acuerdo con las reglas de derecho de paso de Ohio, cuando dos vehículos
    llegan a una intersección al mismo tiempo, el conductor del vehículo de la izquierda
    debe ceder el paso al vehículo de la derecha.
- id: 88
  category: safe_driving_rules
  question: ¿En Ohio, a cuántos pies de un vehículo que viene en sentido contrario
    debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Ohio exige que los conductores bajen las luces altas cuando
    un vehículo que viene en sentido contrario se encuentra a menos de 500 pies.
- id: 89
  category: safe_driving_rules
  question: ¿En Ohio, es ilegal estacionarse a cuántos pies de una señal de alto,
    una baliza intermitente o una señal de control de tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: En Ohio, se prohíbe a los conductores estacionarse a menos de 30 pies
    de cualquier baliza intermitente, señal de alto o señal de control de tráfico
    ubicada al costado de una calzada.
- id: 90
  category: safe_driving_rules
  question: Bajo la ley 'Move Over' de Ohio, ¿qué debe hacer un conductor al acercarse
    a un vehículo de emergencia estacionario con luces intermitentes en una carretera
    con al menos dos carriles de tráfico en la misma dirección?
  choices:
    A: Detenerse inmediatamente en el carril actual
    B: Mantener la velocidad pero tocar la bocina para alertar al oficial
    C: Moverse a un carril que no sea adyacente al vehículo si es seguro hacerlo
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley de Ohio exige que los conductores se muevan a un carril adyacente
    al acercarse a vehículos estacionarios de emergencia, de asistencia en carretera
    o de recolección de residuos con luces intermitentes. Si no es seguro cambiarse
    de carril, el conductor debe reducir la velocidad.
- id: 91
  category: safe_driving_rules
  question: Según la ley de Ohio, ¿a cuántos pies de un hidrante de incendios (fire
    hydrant) está prohibido estacionarse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: El Código Revisado de Ohio prohíbe estacionar un vehículo a menos de
    10 pies de un hidrante de incendios.
- id: 92
  category: safe_driving_rules
  question: 'La ley de Ohio exige que las luces delanteras (headlights) estén encendidas
    siempre que el conductor esté utilizando sus:'
  choices:
    A: Limpiaparabrisas
    B: Luces de emergencia
    C: Direccionales
    D: Aire acondicionado
  answer: A
  explanation: La ley de Ohio exige que las luces delanteras se utilicen en cualquier
    momento en que los limpiaparabrisas del vehículo estén en uso debido a la precipitación
    o condiciones atmosféricas desfavorables.
- id: 93
  category: safe_driving_rules
  question: Para mantener una distancia de seguimiento segura en Ohio bajo condiciones
    normales de conducción, ¿qué regla se recomienda?
  choices:
    A: Regla de la longitud de un vehículo
    B: Regla de los dos segundos
    C: Regla de los tres segundos
    D: Regla de los cinco segundos
  answer: C
  explanation: El Manual del Conductor de Ohio recomienda la 'regla de los tres segundos'
    para mantener una distancia de seguimiento segura detrás del vehículo que va delante.
- id: 94
  category: safe_driving_rules
  question: 'En Ohio, se le permite rebasar por la derecha a otro vehículo solo si
    ese vehículo está girando a la izquierda y:'
  choices:
    A: Usted conduce por el acotamiento para hacerlo
    B: El pavimento es lo suficientemente ancho para dos o más filas de vehículos
      que se mueven en la misma dirección
    C: Usted se encuentra en un vecindario residencial
    D: El otro conductor le hace una señal para pasar
  answer: B
  explanation: Rebasar por la derecha está permitido en Ohio cuando el vehículo que
    se está adelantando está girando a la izquierda, siempre que haya suficiente ancho
    de pavimento para dos o más filas de tráfico y el adelantamiento no se realice
    conduciendo fuera de la calzada.
- id: 95
  category: safe_driving_rules
  question: ¿Qué señal manual indica que un conductor de Ohio tiene la intención de
    detenerse o disminuir la velocidad?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido hacia afuera
  answer: C
  explanation: Para señalar una parada o una disminución de la velocidad mediante
    señales manuales, el conductor debe extender su brazo izquierdo hacia abajo con
    la palma hacia atrás.
- id: 96
  category: safe_driving_rules
  question: Según la ley de Ohio, ¿cuál es la multa para un conductor que no usa el
    cinturón de seguridad?
  choices:
    A: La multa es de $30
    B: La multa es de $100
    C: La multa es de $250
    D: No hay multa, solo una advertencia
  answer: A
  explanation: En Ohio, la multa para un conductor que no usa el cinturón de seguridad
    es de $30. Para un pasajero en el asiento delantero, la multa es de $20.
- id: 97
  category: safe_driving_rules
  question: 'Al girar a la izquierda desde una calle de doble sentido hacia otra calle
    de doble sentido en Ohio, debe ceder el paso al tráfico que viene en sentido contrario
    y luego girar hacia:'
  choices:
    A: El carril de la derecha
    B: El carril más cercano a la línea central
    C: El acotamiento de la carretera
    D: Cualquier carril que esté vacío
  answer: B
  explanation: Al girar a la izquierda en Ohio, debe ceder el derecho de paso a cualquier
    vehículo que se aproxime en dirección opuesta y completar el giro en el carril
    más cercano a la línea central.
- id: 98
  category: defensive_driving
  question: Para mantener un 'margen de espacio' (space cushion) seguro y buscar peligros,
    ¿qué tan adelante de su vehículo deben mirar los conductores de Ohio?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 12 segundos
    C: De 20 a 30 segundos
    D: La distancia de una cuadra de la ciudad
  answer: B
  explanation: El manual del conductor de Ohio sugiere escanear la carretera de 10
    a 12 segundos por delante para anticipar posibles problemas.
- id: 99
  category: defensive_driving
  question: Según la ley de Ohio, ¿cuándo deben los conductores tener encendidas las
    luces delanteras durante condiciones climáticas adversas?
  choices:
    A: Solo durante aguaceros fuertes
    B: Siempre que los limpiaparabrisas estén en uso
    C: Solo entre la puesta y la salida del sol
    D: Cuando la visibilidad es inferior a 1,000 pies
  answer: B
  explanation: El Código Revisado de Ohio exige que las luces delanteras estén encendidas
    siempre que los limpiaparabrisas estén en uso debido a la precipitación.
- id: 100
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (hydroplaning
    - cuando los neumáticos pierden contacto con la superficie de la carretera) bajo
    lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: En los materiales de educación vial de Ohio, se señala que el hidroplaneo
    puede comenzar a velocidades tan bajas como 35 mph, y los neumáticos pueden perder
    todo contacto a las 55 mph.
- id: 101
  category: defensive_driving
  question: ¿A qué distancia debe bajar las luces altas cuando sigue a otro vehículo
    por la noche en Ohio?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Ohio exige que los conductores cambien a luces bajas cuando
    sigan a otro vehículo a una distancia de 300 pies o menos.
- id: 102
  category: defensive_driving
  question: Durante los inviernos en Ohio, ¿por qué se consideran especialmente peligrosos
    los puentes y los pasos elevados?
  choices:
    A: Por lo general son más estrechos que el resto de la carretera
    B: Se congelan antes que otras superficies de la carretera
    C: Es más probable que tengan baches
    D: La sal no funciona en superficies elevadas
  answer: B
  explanation: Los puentes y pasos elevados se congelan antes que el resto de la calzada
    porque el aire frío circula tanto por encima como por debajo de la estructura.
- id: 103
  category: defensive_driving
  question: Al conducir con niebla densa en Ohio, ¿qué ajuste de luces debe utilizar
    para garantizar la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Luces intermitentes de emergencia (hazard flashers)
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en la humedad del aire, lo que provoca deslumbramiento y reduce la visibilidad.
- id: 104
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza en Ohio,
    ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Frenar con fuerza para detener el movimiento
    B: Girar el volante en la dirección opuesta al derrape
    C: Girar el volante en la dirección hacia la que se desliza la parte trasera del
      vehículo
    D: Poner el coche en punto muerto (neutral) inmediatamente
  answer: C
  explanation: Para recuperar el control durante un derrape, retire el pie del acelerador
    y gire el volante en la dirección hacia la que se desliza la parte trasera del
    vehículo.
- id: 105
  category: defensive_driving
  question: Al prepararse para cambiar de carril en una autopista de Ohio, ¿cómo debe
    revisar sus "puntos ciegos"?
  choices:
    A: Revisar solo el espejo retrovisor interior
    B: Revisar ambos espejos laterales y el espejo retrovisor
    C: Girar la cabeza y mirar sobre su hombro en la dirección hacia la que planea
      moverse
    D: Reducir la velocidad para que otros conductores salgan de su punto ciego
  answer: C
  explanation: Los espejos no lo muestran todo; se requiere una comprobación física
    mirando sobre el hombro para ver los vehículos en los puntos ciegos antes de cambiar
    de carril.
- id: 106
  category: defensive_driving
  question: 'En Ohio, si conduce por una carretera de cuatro o más carriles y un autobús
    escolar se detiene con las luces rojas intermitentes en el lado opuesto de la
    carretera, usted debe:'
  choices:
    A: Detenerse al menos a 10 pies del autobús
    B: Detenerse solo si no hay una mediana
    C: Continuar conduciendo con precaución
    D: Reducir la velocidad a 10 mph
  answer: C
  explanation: En una carretera con cuatro o más carriles, en Ohio solo el tráfico
    que se mueve en la misma dirección que el autobús está obligado a detenerse. El
    tráfico que se aproxima desde la dirección opuesta puede continuar con precaución.
- id: 107
  category: defensive_driving
  question: Al detenerse en una intersección en Ohio, ¿cuál es la secuencia de observación
    recomendada antes de continuar?
  choices:
    A: Mirar a la izquierda, luego a la derecha
    B: Mirar a la derecha, luego a la izquierda, luego a la derecha de nuevo
    C: Mirar a la izquierda, luego a la derecha, luego a la izquierda de nuevo
    D: Mirar solo hacia adelante
  answer: C
  explanation: El manual de Ohio recomienda mirar a la izquierda, luego a la derecha
    y luego a la izquierda de nuevo porque el primer peligro proviene de la izquierda.
- id: 108
  category: defensive_driving
  question: Cuando empieza a llover en Ohio, ¿por qué las carreteras están más resbaladizas?
  choices:
    A: El agua enfría el asfalto demasiado rápido
    B: La lluvia se mezcla con el aceite y la grasa en la superficie de la carretera
    C: Los neumáticos todavía están calientes por la conducción en seco
    D: El hidroplaneo (hydroplaning) solo ocurre en los primeros 5 minutos de lluvia
  answer: B
  explanation: Las carreteras están más resbaladizas durante los primeros minutos
    de lluvia porque el agua se mezcla con el aceite, la suciedad y la grasa que se
    han acumulado en el pavimento.
- id: 109
  category: defensive_driving
  question: Según el Compendio de Leyes de Vehículos Motorizados de Ohio (Digest of
    Ohio Motor Vehicle Laws), ¿cuál es la distancia de seguimiento recomendada detrás
    del vehículo que va delante de usted para permitir un tiempo de frenado suficiente?
  choices:
    A: La longitud de un coche por cada 10 mph
    B: Un mínimo de dos segundos
    C: Un mínimo de tres segundos
    D: At menos 50 pies en todo momento
  answer: C
  explanation: La ley de Ohio y el manual del conductor recomiendan una "regla de
    tres segundos" para mantener una distancia de seguimiento segura en condiciones
    normales de conducción.
- id: 110
  category: defensive_driving
  question: En Ohio, ¿cuándo exige la ley que los conductores tengan encendidos los
    faros delanteros?
  choices:
    A: Solo entre el atardecer y el amanecer
    B: Siempre que los limpiaparabrisas estén en uso
    C: Solo cuando la visibilidad sea inferior a 1,000 pies
    D: Siempre que se conduzca por una autopista de varios carriles
  answer: B
  explanation: El Código Revisado de Ohio 4513.03 exige que los faros estén encendidos
    entre el atardecer y el amanecer, durante cualquier período de lluvia, nieve,
    niebla u otras condiciones atmosféricas desfavorables, y siempre que los limpiaparabrisas
    estén en uso.
- id: 111
  category: defensive_driving
  question: Para observar la carretera de manera efectiva mientras conduce en Ohio,
    ¿con cuánta anticipación debe mirar un conductor para identificar posibles peligros?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 12 segundos
    C: De 20 a 30 segundos
    D: Exactamente una cuadra de la ciudad
  answer: B
  explanation: Las pautas de conducción defensiva de Ohio sugieren mirar de 10 a 12
    segundos hacia adelante para tener tiempo de reaccionar ante cambios en los patrones
    de tráfico o peligros.
- id: 112
  category: defensive_driving
  question: Si su vehículo comienza a deslizarse sobre el agua (hidroplaneo) en una
    carretera mojada de Ohio, ¿cuál es la acción de conducción defensiva más segura
    que debe tomar?
  choices:
    A: Frenar bruscamente para recuperar la tracción
    B: Girar el volante bruscamente en la dirección opuesta al derrape
    C: Quitar el pie del acelerador y dejar que el coche disminuya la velocidad
    D: Poner el coche en punto muerto (neutral) inmediatamente
  answer: C
  explanation: Si ocurre hidroplaneo (hydroplaning), el manual de Ohio aconseja a
    los conductores soltar el acelerador y evitar frenar para permitir que los neumáticos
    recuperen el contacto con la superficie de la carretera.
- id: 113
  category: defensive_driving
  question: Durante los inviernos de Ohio, ¿cuál de las siguientes superficies de
    la carretera es probable que se congele primero y se vuelva resbaladiza antes
    que las demás?
  choices:
    A: Intersecciones
    B: Caminos de grava
    C: Puentes y pasos elevados
    D: Autopistas de asfalto
  answer: C
  explanation: Los puentes y pasos elevados se congelan antes que otras superficies
    de la carretera porque el aire frío circula tanto por encima como por debajo de
    la estructura.
- id: 114
  category: defensive_driving
  question: 'Antes de cambiar de carril en una carretera de varios carriles en Ohio,
    un conductor defensivo debe revisar sus "puntos ciegos" (blind spots) de la siguiente
    manera:'
  choices:
    A: Mirando solo por el espejo retrovisor
    B: Mirando solo por los espejos laterales
    C: Girando la cabeza para mirar por encima del hombro en la dirección del movimiento
    D: Revisando la pantalla de navegación GPS
  answer: C
  explanation: Los espejos no lo muestran todo; las pautas de Ohio establecen que
    debe girar la cabeza para revisar las áreas que no son visibles en los espejos
    antes de cambiar de carril.
- id: 115
  category: defensive_driving
  question: La distancia total de parada consiste en la distancia de percepción, la
    distancia de reacción y la distancia de frenado. A 50 mph, ¿aproximadamente cuántos
    pies recorrerá un vehículo en Ohio antes de detenerse por completo?
  choices:
    A: De 50 a 75 pies
    B: De 100 a 125 pies
    C: De 150 a 200 pies
    D: Más de 400 pies
  answer: C
  explanation: A 50 mph, la distancia total de parada suele ser de entre 158 y 200
    pies, dependiendo de las condiciones de la carretera y el tiempo de reacción del
    conductor.
- id: 116
  category: defensive_driving
  question: Si otro vehículo lo sigue demasiado cerca (tailgating) mientras conduce
    por una carretera de Ohio, ¿cuál es la mejor estrategia de conducción defensiva?
  choices:
    A: Tocar los frenos repetidamente para asustar al conductor
    B: Reducir la velocidad gradualmente y animar al conductor a que lo pase
    C: Aumentar la velocidad para incrementar la distancia
    D: Detener su vehículo en medio del carril
  answer: B
  explanation: La forma más segura de manejar a alguien que lo sigue de cerca es reducir
    la velocidad gradualmente y dejar más espacio delante de usted, o moverse al carril
    derecho para permitirle pasar.
- id: 117
  category: alcohol_drugs_health
  question: Bajo la ley de "Consentimiento Implícito" (Implied Consent) de Ohio, ¿cuál
    es la consecuencia por negarse por primera vez a someterse a una prueba química
    de sangre, aliento u orina?
  choices:
    A: Una suspensión de la licencia por 90 días
    B: Una suspensión automática de la licencia por 1 año
    C: Una multa de $1,000 y ninguna suspensión
    D: Una suspensión de la licencia por 6 meses
  answer: B
  explanation: De acuerdo con el Compendio de Leyes de Vehículos Motorizados de Ohio,
    bajo la ley de Consentimiento Implícito, si es arrestado por OVI y se niega a
    realizar la prueba química, el Registrador de Vehículos Motorizados suspenderá
    su licencia por un año por una primera infracción.
- id: 118
  category: alcohol_drugs_health
  question: En Ohio, ¿cuál es el tiempo mínimo obligatorio de cárcel por una primera
    condena por OVI con un BAC inferior al 0.17%?
  choices:
    A: 24 horas consecutivas
    B: 48 horas consecutivas
    C: 72 horas consecutivas
    D: 10 días
  answer: C
  explanation: Una primera condena por OVI en Ohio conlleva un mínimo obligatorio
    de 72 horas consecutivas (3 días) de cárcel, que a veces pueden cumplirse en un
    programa certificado de intervención para conductores.
- id: 119
  category: alcohol_drugs_health
  question: La ley de Ohio define un "BAC alto" (concentración prohibida) para conductores
    de 21 años o más como una concentración de alcohol en el aliento igual o superior
    a qué nivel?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.17%
  answer: D
  explanation: En Ohio, un BAC de 0.17% o superior se considera un OVI de "nivel alto"
    o "agravado", lo que conlleva sanciones obligatorias más severas que un OVI estándar.
- id: 120
  category: alcohol_drugs_health
  question: ¿Cuál es la tarifa actual de restablecimiento de una licencia de conducir
    de Ohio que fue suspendida debido a una condena por OVI?
  choices:
    A: $100
    B: $250
    C: $475
    D: $600
  answer: C
  explanation: Según las regulaciones actuales del BMV de Ohio, la tarifa de restablecimiento
    para una Suspensión Administrativa de Licencia (ALS) o una suspensión relacionada
    con OVI es de $475.
- id: 121
  category: alcohol_drugs_health
  question: En Ohio, un conductor puede ser acusado de 'Tener el control físico de
    un vehículo bajo la influencia' (Physical Control) incluso si el vehículo no está
    en movimiento. ¿Qué implica normalmente este cargo?
  choices:
    A: Estar en el asiento del conductor con la llave de encendido en su poder mientras
      está incapacitado
    B: Estar de pie junto a un coche con una bebida en la mano
    C: Estar sentado en el asiento del pasajero con el motor en marcha
    D: Caminar hacia su coche mientras está intoxicado
  answer: A
  explanation: El Código Revisado de Ohio 4511.194 define el 'Control Físico' como
    estar en la posición del conductor de un vehículo y tener la posesión de la llave
    de encendido del vehículo u otro dispositivo de encendido mientras se está bajo
    la influencia.
- id: 122
  category: alcohol_drugs_health
  question: Para una segunda infracción de OVI dentro de un periodo de 10 años en
    Ohio, ¿cuál es el tiempo mínimo obligatorio que el vehículo del infractor debe
    permanecer inmovilizado y las placas confiscadas?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Para una segunda infracción de OVI dentro de un período de 10 años,
    la ley de Ohio exige una inmovilización obligatoria de 90 días del vehículo y
    la confiscación de las placas de matrícula.
- id: 123
  category: alcohol_drugs_health
  question: Si un conductor de Ohio menor de 21 años es condenado por Operar un Vehículo
    después del Consumo por Menores de Edad (OVUAC), ¿cuál es la duración máxima de
    la suspensión de la licencia ordenada por el tribunal?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Para una condena por OVUAC (BAC entre 0.02% y 0.08% para menores de
    21 años), la suspensión ordenada por el tribunal puede oscilar entre 60 días y
    hasta 2 años.
- id: 124
  category: alcohol_drugs_health
  question: En Ohio, ¿de qué color son las 'Placas Restringidas' (a menudo llamadas
    'party plates') que pueden ser requeridas para los infractores de OVI a quienes
    se les conceden privilegios de conducción limitados?
  choices:
    A: Texto rojo sobre fondo blanco
    B: Amarillas con letras/números rojos
    C: Azules con letras/números blancos
    D: Negras con letras/números amarillos
  answer: B
  explanation: La ley de Ohio puede exigir que los infractores de OVI utilicen placas
    de matrícula restringidas, que son amarillas con letras rojas, como condición
    para recibir privilegios de conducción limitados.
- id: 125
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única manera de 'recuperar la sobriedad'
    y reducir su BAC antes de conducir?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Darle tiempo a su cuerpo para procesar el alcohol
    D: Hacer ejercicio vigorosamente
  answer: C
  explanation: El Manual del Conductor de Ohio establece que el tiempo es el único
    factor que reducirá el BAC de una persona. El café, las duchas y el ejercicio
    no aceleran la oxidación del alcohol por parte del hígado.
- id: 126
  category: alcohol_drugs_health
  question: En Ohio, ¿cuál es el límite legal de concentración de marihuana (THC)
    en la sangre completa de un conductor para evitar un cargo de OVI?
  choices:
    A: 1 nanogramo por mililitro
    B: 2 nanogramos por mililitro
    C: 5 nanograms por mililitro
    D: 10 nanogramos por mililitro
  answer: B
  explanation: Según la ley de Ohio (ORC 4511.19), el límite legal de marihuana en
    sangre completa es de 2 nanogramos de concentración prohibida por el estado por
    mililitro.
- id: 127
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado y un médico no le dijo específicamente
    que no condujera, ¿aún puede ser arrestado por OVI en Ohio?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, a menos que también haya consumido alcohol
    C: Sí, si el medicamento afecta su capacidad para conducir de manera segura
    D: Sí, pero solo si es un narcótico de la Lista I
  answer: C
  explanation: En Ohio, usted puede ser condenado por OVI por conducir bajo la influencia
    de cualquier droga de abuso, incluidos los medicamentos recetados o de venta libre,
    si estos afectan su capacidad de conducción.
- id: 128
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' cuando se refiere al alcohol y otras drogas?
  choices:
    A: Las drogas anulan los efectos del alcohol
    B: El alcohol acelera el metabolismo de la droga
    C: El efecto combinado es mayor que la suma de los efectos individuales
    D: No hay un cambio medible en el deterioro
  answer: C
  explanation: El efecto sinérgico ocurre cuando se consumen alcohol y drogas juntos,
    lo que causa un deterioro mucho mayor que el que causaría cualquiera de las sustancias
    por sí sola.
- id: 129
  category: alcohol_drugs_health
  question: ¿Cuántas condenas por OVI dentro de un período de 10 años resultan en
    que un conductor de Ohio sea acusado de un delito grave de cuarto grado?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: C
  explanation: En Ohio, una cuarta condena por OVI dentro de un período de 10 años
    se clasifica como un delito grave de cuarto grado.
- id: 130
  category: alcohol_drugs_health
  question: ¿Cuándo entra en vigor una Suspensión Administrativa de la Licencia (ALS)
    si usted no pasa o se niega a realizar una prueba química en Ohio?
  choices:
    A: Inmediatamente después de la negativa o el fallo
    B: Después de un período de gracia de 30 días
    C: Solo después de ser condenado en el tribunal
    D: 10 días después del arresto
  answer: A
  explanation: Una Suspensión Administrativa de la Licencia (ALS) es impuesta por
    el oficial en nombre del BMV inmediatamente en el momento de la negativa o el
    fallo de la prueba.
- id: 131
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes condiciones médicas debe informarse al BMV de
    Ohio al solicitar o renovar una licencia?
  choices:
    A: Cualquier condición que cause un deterioro episódico de la conciencia o del
      control muscular
    B: Solo la ceguera permanente en un ojo
    C: Alergias estacionales
    D: Asma leve
  answer: A
  explanation: La ley de Ohio exige que los solicitantes revelen cualquier condición
    médica, como la epilepsia o la diabetes, que pueda resultar en un deterioro episódico
    de la conciencia o la pérdida del control muscular.
- id: 132
  category: alcohol_drugs_health
  question: Bajo la ley de 'Consentimiento Implícito' (Implied Consent) de Ohio, ¿qué
    acepta usted al operar un vehículo en las carreteras de Ohio?
  choices:
    A: Mantener el registro de su vehículo en la guantera en todo momento
    B: Ceder el paso a todos los vehículos de emergencia
    C: Someterse a una prueba de concentración de alcohol en sangre (BAC) o contenido
      de drogas si es arrestado por OVI
    D: Mantener un historial de conducción limpio durante al menos cinco años
  answer: C
  explanation: La ley de Consentimiento Implícito de Ohio significa que, al conducir
    en el estado, usted ha dado su consentimiento para una prueba química de sangre,
    aliento u orina si un oficial de la ley tiene motivos razonables para creer que
    está conduciendo bajo la influencia.
- id: 133
  category: alcohol_drugs_health
  question: En Ohio, un cargo de OVI por 'BAC alto', que conlleva sanciones más severas,
    se activa si la concentración de alcohol en sangre de un conductor es igual o
    superior a ¿qué nivel?
  choices:
    A: 0.10%
    B: 0.15%
    C: 0.17%
    D: 0.20%
  answer: C
  explanation: La ley de Ohio define un OVI de 'nivel alto' o 'prueba alta' como tener
    un BAC de 0.17% o superior. Este nivel resulta en el doble del tiempo mínimo obligatorio
    en la cárcel (6 días en lugar de 3).
- id: 134
  category: alcohol_drugs_health
  question: Si un conductor de Ohio se niega a someterse a una prueba química tras
    un primer arresto por OVI, su licencia estará sujeta a una Suspensión Administrativa
    de Licencia (ALS) por ¿cuánto tiempo?
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito de Ohio, la primera negativa
    a realizar una prueba química resulta en una Suspensión Administrativa de Licencia
    automática de un año.
- id: 135
  category: alcohol_drugs_health
  question: 'En Ohio, se le puede acusar de ''Control Físico'' (Physical Control)
    si se le encuentra bajo la influencia del alcohol mientras:'
  choices:
    A: Camina cerca de su vehículo con las llaves en el bolsillo
    B: Está sentado en el asiento del conductor de un vehículo estacionado en posesión
      de la llave de encendido
    C: Viaja como pasajero en un vehículo conducido por otra persona intoxicada
    D: Repara un vehículo en su propia propiedad privada
  answer: B
  explanation: La ley de 'Control Físico' en Ohio se aplica al estar en el asiento
    del conductor de un vehículo con las llaves, incluso si el vehículo no se está
    moviendo o el motor no está funcionando.
- id: 136
  category: alcohol_drugs_health
  question: Para una primera condena por 'Operar un vehículo después del consumo de
    un menor de edad' (OVUAC), ¿por cuánto tiempo mínimo debe un tribunal de Ohio
    suspender la licencia del conductor?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: C
  explanation: Una primera condena por OVUAC (para conductores menores de 21 años
    con un BAC entre 0.02% y 0.08%) conlleva una suspensión obligatoria de la licencia
    que va desde 90 días hasta dos años.
- id: 137
  category: alcohol_drugs_health
  question: Si un conductor de Ohio es condenado por un segundo OVI dentro de un período
    de 10 años, ¿cuál es el tiempo mínimo obligatorio en la cárcel?
  choices:
    A: 3 días
    B: 10 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Una segunda condena por OVI dentro de 10 años en Ohio requiere un mínimo
    obligatorio de 10 días consecutivos en la cárcel (o 5 días de cárcel más 18 días
    de arresto domiciliario con monitoreo electrónico).
- id: 138
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los medicamentos
    recetados y la conducción en Ohio?
  choices:
    A: No se le puede acusar de OVI si el medicamento fue recetado legalmente por
      un médico
    B: Los medicamentos recetados solo afectan la conducción si se mezclan con alcohol
    C: Se le puede acusar de OVI si un medicamento recetado afecta su capacidad para
      conducir de manera segura
    D: Los medicamentos recetados no se verifican durante una prueba química
  answer: C
  explanation: En Ohio, las leyes de OVI se aplican a cualquier droga de abuso, incluidos
    los medicamentos recetados y de venta libre, si estos afectan su capacidad para
    conducir.
- id: 139
  category: alcohol_drugs_health
  question: Bajo la ley de Contenedor Abierto (Open Container) de Ohio, ¿en cuál de
    los siguientes lugares es ilegal poseer un recipiente abierto de alcohol?
  choices:
    A: El maletero de un coche
    B: El área de pasajeros de cualquier vehículo motorizado en una vía pública
    C: La zona de vivienda de una casa rodante
    D: Una caja de herramientas cerrada con llave en la plataforma de una camioneta
      pickup
  answer: B
  explanation: La ley de Ohio prohíbe tener un recipiente abierto de alcohol en el
    área de pasajeros de un vehículo motorizado mientras se encuentra en una vía pública
    o en cualquier propiedad pública o privada utilizada por el público para estacionarse.
- id: 140
  category: alcohol_drugs_health
  question: En Ohio, las autoridades pueden utilizar ¿cuál de los siguientes métodos
    para determinar la concentración de alcohol o drogas de un conductor?
  choices:
    A: Solo aliento y sangre
    B: Solo aliento y orina
    C: Solo sangre y orina
    D: Sangre, aliento y orina
  answer: D
  explanation: La ley de Ohio permite realizar pruebas de sangre, aliento u orina
    para determinar la concentración de alcohol o drogas en el sistema de un conductor.
- id: 141
  category: alcohol_drugs_health
  question: 'Bajo la ''Ley de Annie'' en Ohio, los infractores de OVI por primera
    vez pueden ser elegibles para reducir su suspensión de licencia a la mitad si
    aceptan:'
  choices:
    A: Realizar 100 horas de servicio comunitario
    B: Instalar un dispositivo de interbloqueo de encendido (IID) en su vehículo
    C: Entregar su vehículo al estado
    D: Asistir a una escuela secundaria para dar charlas de seguridad
  answer: B
  explanation: La Ley de Annie permite que los infractores de OVI por primera vez
    soliciten privilegios de conducción ilimitados si instalan un dispositivo de interbloqueo
    de encendido, lo que también puede reducir el período de suspensión.
- id: 142
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' en relación con la conducción en Ohio?
  choices:
    A: El efecto del alcohol desapareciendo con el tiempo
    B: El efecto combinado del alcohol y las drogas siendo mayor que cada uno por
      separado
    C: La velocidad a la que el hígado procesa una bebida estándar
    D: El impulso psicológico de conducir más rápido después de consumir cafeína
  answer: B
  explanation: El efecto sinérgico ocurre cuando se consumen alcohol y drogas juntos,
    lo que resulta en niveles de deterioro mucho más altos de lo que cualquiera de
    las sustancias causaría por sí sola.
- id: 143
  category: alcohol_drugs_health
  question: En Ohio, ¿cómo elimina el cuerpo principalmente el alcohol?
  choices:
    A: A través del ejercicio y la transpiración
    B: Bebiendo grandes cantidades de café
    C: A través del paso del tiempo mientras el hígado lo procesa
    D: Tomando una ducha fría para estimular el sistema nervioso
  answer: C
  explanation: El tiempo es la única forma de eliminar el alcohol del sistema. El
    hígado procesa el alcohol a un ritmo constante, y el café, las duchas o el ejercicio
    no aceleran este proceso.
- id: 144
  category: alcohol_drugs_health
  question: 'En Ohio, una tercera condena por OVI en un plazo de 10 años se clasifica
    como un delito menor de primer grado y puede resultar en:'
  choices:
    A: Una revocación obligatoria de la licencia por 10 años
    B: El decomiso penal del vehículo utilizado en la infracción
    C: Una prohibición permanente de poseer un vehículo
    D: Inscripción obligatoria en el ejército
  answer: B
  explanation: Para una tercera condena por OVI en un plazo de 10 años en Ohio, el
    tribunal puede ordenar el decomiso penal del vehículo utilizado en la infracción
    si está registrado a nombre del infractor.
- id: 145
  category: penalties_and_points
  question: Si un conductor de Ohio es condenado por exceder el límite de velocidad
    en 30 mph o más, ¿cuántos puntos se añadirán a su historial de conducción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: No se añaden puntos, solo una multa
  answer: B
  explanation: En Ohio, exceder el límite de velocidad en 30 mph o más resulta en
    4 puntos. Si la infracción es de entre 6 y 29 mph por encima (en una zona de menos
    de 55 mph) o de entre 11 y 29 mph por encima (en una zona de 55 mph o más), resulta
    en 2 puntos.
- id: 146
  category: penalties_and_points
  question: Según la ley de Ohio, ¿cuál es el tiempo mínimo de cárcel por una primera
    condena de OVI (Operar un Vehículo Bajo la Influencia)?
  choices:
    A: 24 horas consecutivas
    B: 48 horas consecutivas
    C: 72 horas consecutivas
    D: 7 días consecutivos
  answer: C
  explanation: Una primera condena por OVI en Ohio conlleva un mínimo obligatorio
    de 72 horas consecutivas en la cárcel, aunque un tribunal puede permitir que el
    conductor asista a un programa certificado de intervención para conductores en
    su lugar.
- id: 147
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'Operar un vehículo motorizado mientras
    la licencia está suspendida' en el estado de Ohio?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Conducir mientras su licencia está suspendida se considera una infracción
    grave en Ohio y resulta en la adición de 6 puntos a su historial.
- id: 148
  category: penalties_and_points
  question: En Ohio, si se le condena por 'Desprecio deliberado o injustificado por
    la seguridad de las personas o la propiedad' (Conducción temeraria), ¿cuántos
    puntos se asignan?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 0 puntos, es solo una multa
  answer: B
  explanation: La conducción temeraria, definida como el desprecio deliberado o injustificado
    por la seguridad, conlleva una penalización de 4 puntos en el historial de conducción
    de Ohio.
- id: 149
  category: penalties_and_points
  question: Bajo la ley de 'Consentimiento Implícito' de Ohio, ¿cuál es la consecuencia
    inmediata de negarse a realizar una prueba química cuando lo solicita un oficial
    de la ley?
  choices:
    A: Solo una multa de $1,000
    B: Incautación inmediata de la licencia de conducir y una Suspensión Administrativa
      de la Licencia (ALS)
    C: Una estancia obligatoria de 48 horas en la cárcel
    D: Nada, siempre que sea la primera vez que lo detienen
  answer: B
  explanation: Al conducir por las carreteras de Ohio, usted otorga su 'consentimiento
    implícito' para las pruebas químicas. La negativa resulta en que el oficial confisque
    inmediatamente su licencia y entre en vigor una Suspensión Administrativa de la
    Licencia.
- id: 150
  category: penalties_and_points
  question: Cuando la licencia de un conductor de Ohio es suspendida bajo la regla
    de los 12 puntos, ¿cuánto tiempo dura el período de suspensión obligatoria?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Acumular 12 puntos en un período de dos años resulta en una suspensión
    obligatoria de seis meses de los privilegios de conducción en Ohio.
- id: 151
  category: penalties_and_points
  question: ¿Para restablecer una licencia después de una suspensión de 12 puntos
    en Ohio, cuál de los siguientes NO es un requisito?
  choices:
    A: Completar un curso de conducción correctiva
    B: Pago de una tarifa de restablecimiento
    C: Volver a tomar el examen de la licencia de conducir (práctico y de conocimientos)
    D: Esperar un mínimo de dos años a partir de la fecha de la suspensión
  answer: D
  explanation: La suspensión es de 6 meses, no de 2 años. Para restablecerla, el conductor
    debe completar un curso correctivo, pagar una tarifa y volver a tomar el examen
    de conducir.
- id: 152
  category: penalties_and_points
  question: Según la ley de Ohio, ¿los niños deben usar un asiento de seguridad infantil
    si son menores de qué edad O pesan menos de qué cantidad?
  choices:
    A: Menores de 2 años o menos de 20 libras
    B: Menores de 4 años o menos de 40 libras
    C: Menores de 6 años o menos de 60 libras
    D: Menores de 8 años o menos de 80 libras
  answer: B
  explanation: La ley de Ohio exige que los niños menores de 4 años o que pesen menos
    de 40 libras estén debidamente sujetos en un asiento de seguridad infantil.
- id: 153
  category: penalties_and_points
  question: En Ohio, ¿los niños que tienen al menos 4 años pero menos de 8 años deben
    usar un asiento elevado (booster seat) a menos que hayan alcanzado qué estatura?
  choices:
    A: 4 pies 2 pulgadas
    B: 4 pies 6 pulgadas
    C: 4 pies 9 pulgadas
    D: 5 pies
  answer: C
  explanation: La ley de Ohio exige que los niños de entre 4 y 8 años usen un asiento
    elevado a menos que midan al menos 4 pies 9 pulgadas de estatura.
- id: 154
  category: penalties_and_points
  question: Si se le condena por una infracción de exceso de velocidad en Ohio donde
    el límite de velocidad es de 55 mph o más, y usted viajaba a 10 mph por encima
    del límite, ¿cuántos puntos se le asignan?
  choices:
    A: 0 puntos
    B: 1 punto
    C: 2 puntos
    D: 4 puntos
  answer: A
  explanation: En Ohio, si el límite de velocidad es de 55 mph o más, una infracción
    de 1 a 10 mph por encima del límite resulta en 0 puntos. Los puntos solo se asignan
    a partir de 11 mph por encima del límite en estas zonas.
- id: 155
  category: penalties_and_points
  question: En Ohio, ¿cuántos puntos se asignan por 'No detenerse y revelar la identidad
    en la escena de una colisión' (Hit and Run)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: Abandonar la escena de un accidente (Hit and Run) es una infracción
    de 6 puntos en el estado de Ohio.
- id: 156
  category: penalties_and_points
  question: Según la ley de Ohio, ¿una condena por 'Carreras de autos' (Drag Racing)
    resulta en cuántos puntos en la licencia de conducir?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Las carreras de autos se consideran una infracción de tráfico grave
    en Ohio y conllevan una penalización de 6 puntos en la licencia de conducir.
- id: 157
  category: penalties_and_points
  question: Bajo la Ley de Consentimiento Implícito de Ohio, si se niega a hacerse
    una prueba química cuando lo solicita un oficial, ¿por cuánto tiempo se suspenderá
    su licencia como mínimo por una primera infracción?
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: La primera negativa a someterse a una prueba química en Ohio resulta
    en una Suspensión Administrativa de la Licencia (ALS) automática de un año.
- id: 158
  category: penalties_and_points
  question: 'En Ohio, una condena por OVI por primera vez con una concentración de
    alcohol en sangre (BAC) de 0.17% o más (High Test) conlleva una pena de cárcel
    mínima obligatoria de:'
  choices:
    A: 24 horas
    B: 3 días
    C: 6 días
    D: 10 días
  answer: C
  explanation: Para un OVI de 'Prueba Alta' (BAC de 0.17% o más), la sentencia de
    cárcel mínima obligatoria es de 6 días, que es el doble del mínimo de 3 días para
    un OVI estándar.
- id: 159
  category: penalties_and_points
  question: 'Si un conductor de Ohio menor de 18 años es condenado por una segunda
    infracción de tránsito en movimiento, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: C
  explanation: La ley de Ohio exige una suspensión de la licencia de 90 días para
    cualquier titular de una licencia de prueba (menor de 18 años) que sea condenado
    por dos infracciones de tránsito en movimiento.
- id: 160
  category: penalties_and_points
  question: ¿Operar un vehículo motorizado mientras su licencia de Ohio está suspendida
    es una infracción que conlleva cuántos puntos?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Conducir bajo suspensión es una infracción grave en Ohio y resulta
    en la adición de 6 puntos al registro del conductor.
- id: 161
  category: penalties_and_points
  question: ¿En Ohio, cuál es la penalización de puntos por 'Huir o Eludir' a un oficial
    de la ley?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Huir o eludir a un oficial de policía es una infracción de 6 puntos
    en el estado de Ohio.
- id: 162
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera infracción de la ley de retención
    infantil de Ohio?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: Una primera infracción de la ley de retención infantil en Ohio puede
    resultar en una multa de hasta $100.
- id: 163
  category: penalties_and_points
  question: Para los conductores de vehículos motorizados comerciales en Ohio, ¿cuál
    es el límite legal máximo de BAC (concentración de alcohol en sangre) antes de
    que se considere que conducen bajo la influencia?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: En Ohio, el límite legal de BAC para conductores comerciales es del
    0.04%, el cual es más estricto que el límite del 0.08% para conductores adultos
    no comerciales.
- id: 164
  category: sharing_the_road
  question: La ley de Ohio exige que los automovilistas mantengan una distancia mínima
    de ¿cuántos pies al rebasar una bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: El Código Revisado de Ohio exige que el operador de un vehículo motorizado
    mantenga una distancia segura de no menos de tres pies al alcanzar y rebasar una
    bicicleta.
- id: 165
  category: sharing_the_road
  question: Bajo la 'Ley de Hacerse a un Lado' (Move Over Law) de Ohio, ¿qué debe
    hacer un conductor al acercarse a un vehículo de emergencia estacionado con luces
    intermitentes en una carretera de varios carriles?
  choices:
    A: Detenerse inmediatamente en el carril actual
    B: Mantener la velocidad pero tocar la bocina
    C: Cambiarse a un carril que no sea adyacente al vehículo, si es seguro hacerlo
    D: Acelerar para despejar el área rápidamente
  answer: C
  explanation: La Ley de Hacerse a un Lado de Ohio exige que los conductores se cambien
    a un carril alejado para todos los vehículos estacionados con luces intermitentes.
    Si cambiarse de carril no es posible o es inseguro, el conductor debe reducir
    la velocidad y proceder con precaución.
- id: 166
  category: sharing_the_road
  question: ¿Cuál es la multa máxima por una primera condena por no detenerse ante
    un autobús escolar en Ohio?
  choices:
    A: $150
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Los conductores en Ohio que no se detengan ante un autobús escolar
    pueden ser multados con hasta $500 y se les puede suspender la licencia de conducir
    por hasta un año.
- id: 167
  category: sharing_the_road
  question: 'Al seguir a un camión grande, si no puede ver la cara del conductor del
    camión en sus espejos laterales, usted se encuentra:'
  choices:
    A: En la 'Zona No' (No-Zone) del camión (punto ciego)
    B: En una posición de seguimiento segura
    C: Obligado a encender sus luces altas
    D: Lo suficientemente cerca para ir a rebufo y ahorrar combustible
  answer: A
  explanation: Si no puede ver la cara del conductor en sus espejos laterales, él
    no puede verlo a usted. Usted se encuentra en una de las 'Zonas No' (No-Zones)
    o puntos ciegos del camión, lo que aumenta el riesgo de una colisión.
- id: 168
  category: sharing_the_road
  question: 'Cuando un peatón cruza una calle guiado por un perro o portando un bastón
    blanco, la ley de Ohio exige que los conductores:'
  choices:
    A: Toquen la bocina para hacerles saber que usted está allí
    B: Cedan el derecho de paso y tomen precauciones para evitar lesiones
    C: Conduzcan alrededor de ellos si hay suficiente espacio
    D: Esperen a que ellos les indiquen con la mano que pueden pasar
  answer: B
  explanation: La ley de Ohio ordena que los conductores deben ceder el paso a todo
    peatón ciego guiado por un perro o que porte un bastón blanco.
- id: 169
  category: sharing_the_road
  question: 'Al compartir la carretera con una motocicleta, un conductor de Ohio debe:'
  choices:
    A: Compartir el carril con la motocicleta si es lo suficientemente ancho
    B: Usar las luces altas para alertar al motociclista
    C: Permitir que la motocicleta use el ancho total del carril
    D: Seguirla más de cerca de lo que seguiría a un automóvil
  answer: C
  explanation: Las motocicletas tienen derecho al ancho total de un carril de tráfico.
    Los conductores nunca deben intentar compartir un carril con una motocicleta.
- id: 170
  category: sharing_the_road
  question: En Ohio, ¿cuál de los siguientes vehículos NO está cubierto por la 'Ley
    de Hacerse a un Lado' (Move Over Law)?
  choices:
    A: Vehículos de policía y bomberos
    B: Grúas y vehículos de mantenimiento de carreteras
    C: Vehículos de servicio de servicios públicos
    D: Automóviles de pasajeros estándar estacionados en el arcén sin luces
  answer: D
  explanation: La Ley de Hacerse a un Lado se aplica específicamente a vehículos de
    emergencia estacionados, grúas y vehículos de mantenimiento/servicios públicos
    que muestran luces intermitentes o giratorias.
- id: 171
  category: sharing_the_road
  question: 'Cuando una procesión funeraria está en curso, la ley de Ohio establece
    que los otros conductores:'
  choices:
    A: Pueden unirse a la procesión para avanzar entre el tráfico
    B: Deben ceder el derecho de paso a la procesión en las intersecciones
    C: Deben rebasar la procesión por la derecha
    D: No están obligados a ceder el paso a menos que haya un oficial presente
  answer: B
  explanation: En Ohio, las procesiones funerarias tienen el derecho de paso en las
    intersecciones. Los conductores deben ceder el paso a los vehículos de la procesión,
    que generalmente se identifican por llevar los faros encendidos y banderas moradas
    y blancas.
- id: 172
  category: sharing_the_road
  question: 'Si usted va a girar a la derecha en una intersección y un ciclista está
    posicionado a su derecha, usted debe:'
  choices:
    A: Acelerar para girar antes de que el ciclista llegue a la intersección
    B: Tocar la bocina para advertir al ciclista que se detenga
    C: Ceder el paso y dejar que el ciclista pase primero por la intersección
    D: Girar de todos modos, ya que las bicicletas deben ceder el paso a los autos
  answer: C
  explanation: Los conductores deben ceder el paso a los ciclistas de la misma manera
    que lo harían con otros vehículos motorizados. No debe 'cerrar el paso' a un ciclista
    girando a la derecha inmediatamente delante de él.
- id: 173
  category: sharing_the_road
  question: 'En Ohio, los peatones tienen el derecho de paso en las intersecciones:'
  choices:
    A: Solo si el cruce de peatones está marcado con pintura
    B: Solo si hay una señal de 'Caminar' (Walk)
    C: Ya sea que el cruce de peatones esté marcado o no
    D: Solo durante las horas del día
  answer: C
  explanation: Los conductores deben ceder el paso a los peatones tanto en los cruces
    de peatones marcados como en los no marcados en las intersecciones.
- id: 174
  category: sharing_the_road
  question: Cuando un conductor de Ohio se aproxima a un vehículo de emergencia estacionado
    con luces intermitentes en una autopista de varios carriles, ¿qué le exige la
    'Ley de hacerse a un lado' (Move Over Law)?
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Acelerar para rebasar el vehículo rápidamente
    C: Cambiar de carril para desocupar el carril más cercano al vehículo, si es seguro
      hacerlo
    D: Mantener la velocidad y permanecer en el carril actual
  answer: C
  explanation: La Ley de hacerse a un lado de Ohio (ORC 4511.213) exige que los conductores
    se muevan un carril cuando haya vehículos de emergencia, de las fuerzas del orden
    o de mantenimiento estacionados. Si no es posible o seguro cambiarse de carril,
    el conductor debe reducir la velocidad y proceder con precaución.
- id: 175
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que un automovilista debe mantener entre
    su vehículo y la bicicleta al rebasar una bicicleta que viaja en la misma dirección
    en Ohio?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: El Código Revisado de Ohio 4511.27 exige que los operadores de vehículos
    motorizados dejen una distancia segura al rebasar una bicicleta, la cual se define
    como no menos de tres pies.
- id: 176
  category: sharing_the_road
  question: 'Según la ley de Ohio, una persona que monta una bicicleta en una calzada
    tiene:'
  choices:
    A: Ningún derecho legal en la vía
    B: Los mismos derechos y responsabilidades que el conductor de un vehículo motorizado
    C: El derecho de paso sobre todos los vehículos motorizados en todo momento
    D: La obligación de circular únicamente por la acera
  answer: B
  explanation: En Ohio, las bicicletas se consideran legalmente vehículos. Los ciclistas
    tienen los mismos derechos y deben obedecer las mismas leyes de tránsito que los
    automovilistas, incluyendo detenerse en los semáforos en rojo y en las señales
    de alto.
- id: 177
  category: sharing_the_road
  question: En Ohio, ¿qué debe hacer un conductor cuando ve a un peatón usando un
    bastón blanco o un perro guía?
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Ceder el derecho de paso y tomar precauciones para evitar lesiones
    C: Solo detenerse si el peatón está en un cruce marcado
    D: Rodearlos si se mueven lentamente
  answer: B
  explanation: La ley de Ohio (ORC 4511.47) otorga privilegios especiales de derecho
    de paso a los peatones ciegos. Los conductores deben ceder el derecho de paso
    a cualquier persona que lleve un bastón blanco o use un perro guía.
- id: 178
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene para subir o bajar niños, ¿a cuántos
    pies de distancia como mínimo deben detenerse los conductores de Ohio?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: El Código Revisado de Ohio 4511.75 exige que los conductores se detengan
    al menos a 10 pies de la parte delantera o trasera de un autobús escolar cuando
    este se detiene con el fin de recibir o dejar niños en edad escolar.
- id: 179
  category: sharing_the_road
  question: ¿Qué significa en Ohio una señal naranja triangular con un borde rojo
    en la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo es un conductor estudiante
    C: El vehículo es un vehículo de movimiento lento (que viaja a 25 mph o menos)
    D: El vehículo es una carga de gran tamaño
  answer: C
  explanation: El emblema de vehículo de movimiento lento (un triángulo naranja con
    un borde reflectante rojo) es obligatorio en Ohio para los vehículos diseñados
    para viajar a velocidades de 25 mph o menos, como maquinaria agrícola o carruajes
    tirados por caballos.
- id: 180
  category: sharing_the_road
  question: En Ohio, ¿cuál de las siguientes afirmaciones es verdadera con respecto
    a las leyes sobre el casco de motocicleta?
  choices:
    A: El uso del casco es opcional para todos los conductores
    B: El casco solo es obligatorio para los pasajeros
    C: El casco es obligatorio para todos los conductores menores de 18 años y aquellos
      con una licencia de 'novato' (novice)
    D: El casco es obligatorio para todos los conductores independientemente de su
      edad
  answer: C
  explanation: La ley de Ohio exige el uso de casco para los operadores de motocicletas
    menores de 18 años, los pasajeros menores de 18 años y todos los operadores que
    posean una licencia de 'novato' (novice license, durante el primer año de obtención
    de la licencia).
- id: 181
  category: sharing_the_road
  question: 'Los camiones grandes tienen puntos ciegos donde el conductor no puede
    ver a otros vehículos. Estas áreas se denominan comúnmente:'
  choices:
    A: Zonas seguras
    B: No-Zones (Zonas Prohibidas)
    C: Zonas despejadas
    D: Zonas de amortiguamiento
  answer: B
  explanation: El término 'No-Zone' se refiere a los grandes puntos ciegos alrededor
    de la parte delantera, trasera y laterales de un camión o autobús donde los autos
    desaparecen de la vista del conductor.
- id: 182
  category: sharing_the_road
  question: 'Al seguir a una motocicleta en Ohio, un conductor debe mantener una distancia
    de seguimiento de al menos:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 a 4 segundos
    D: 10 pies
  answer: C
  explanation: Debido a que las motocicletas pueden detenerse más rápido que los automóviles
    y son más susceptibles a los peligros de la carretera, el manual de Ohio recomienda
    una distancia de seguimiento de al menos 3 a 4 segundos.
- id: 183
  category: sharing_the_road
  question: En Ohio, si se le declara culpable de violar la 'Ley de Moverse al Carril
    de al Lado' (Move Over Law) (no ceder el paso a un vehículo de emergencia estacionado),
    ¿cuántos puntos se sumarán a su registro de conducir?
  choices:
    A: 0 puntos
    B: 2 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: Una violación de la Ley de Moverse al Carril de al Lado de Ohio (ORC
    4511.213) es un delito menor en la primera infracción y resulta en la adición
    de 2 puntos al registro del conductor.
- id: 184
  category: sharing_the_road
  question: 'Según la ley de Ohio, cuando un peatón se encuentra en un paso de peatones
    marcado o no marcado, el conductor debe:'
  choices:
    A: Ceder el derecho de paso
    B: Tocar la bocina para advertirle que se apresure
    C: Solo ceder el paso si el peatón está en una zona escolar
    D: Mantener la velocidad si el peatón no está en el carril del conductor
  answer: A
  explanation: El Código Revisado de Ohio 4511.46 establece que el conductor de un
    vehículo debe ceder el derecho de paso a un peatón que cruza la calzada dentro
    de cualquier paso de peatones claramente marcado o cualquier paso de peatones
    no marcado en una intersección.
- id: 185
  category: sharing_the_road
  question: En Ohio, ¿cuál es la regla con respecto a los cortejos fúnebres?
  choices:
    A: Deben ceder el paso a todo el resto del tráfico
    B: Tienen el derecho de paso en las intersecciones si tienen los faros encendidos
      y son parte del cortejo
    C: Solo se permiten los domingos
    D: Deben seguir todas las señales de tráfico incluso si esto interrumpe el cortejo
  answer: B
  explanation: El Código Revisado de Ohio 4511.451 otorga a los cortejos fúnebres
    el derecho de paso en las intersecciones, siempre que los vehículos tengan los
    faros encendidos y exhiban un banderín morado y blanco. Otros conductores deben
    ceder el paso y no interrumpir el cortejo.
- id: 186
  category: vehicle_information
  question: Según el Compendio de Leyes de Vehículos Motorizados de Ohio, ¿cuál es
    la profundidad mínima legal de la banda de rodadura para los neumáticos de un
    vehículo de pasajeros?
  choices:
    A: 1/32 de pulgada
    B: 1/16 de pulgada
    C: 1/8 de pulgada
    D: 1/4 de pulgada
  answer: B
  explanation: En Ohio, los neumáticos se consideran inseguros si están desgastados
    hasta el punto en que queda menos de 1/16 de pulgada de banda de rodadura en cualquiera
    de las dos ranuras principales adyacentes.
- id: 187
  category: vehicle_information
  question: Según la ley de Ohio, ¿cuándo están obligados los automovilistas a encender
    los faros delanteros?
  choices:
    A: Solo entre las horas de medianoche y las 5:00 AM
    B: Solo cuando la visibilidad es inferior a 500 pies
    C: Desde el atardecer hasta el amanecer y siempre que los limpiaparabrisas estén
      en uso
    D: Solo cuando se conduce por autopistas interestatales durante la lluvia
  answer: C
  explanation: La ley de Ohio exige que los faros estén encendidos desde el atardecer
    hasta el amanecer, durante cualquier período de lluvia, nieve, niebla u otras
    condiciones atmosféricas desfavorables, y siempre que los limpiaparabrisas estén
    en uso.
- id: 188
  category: vehicle_information
  question: En Ohio, ¿cuál es el nivel máximo de polarizado de ventanas permitido
    en las ventanas laterales delanteras (a la izquierda y derecha del conductor)?
  choices:
    A: Debe permitir al menos un 70% de transmisión de luz
    B: Debe permitir al menos un 50% de transmisión de luz
    C: Debe permitir al menos un 35% de transmisión de luz
    D: El polarizado de ventanas está prohibido en todas las ventanas laterales
  answer: B
  explanation: El Código Administrativo de Ohio 4501-41-03 especifica que el polarizado
    de las ventanas laterales delanteras debe permitir una transmisión de luz total
    no inferior al 50 por ciento (más o menos un 3 por ciento).
- id: 189
  category: vehicle_information
  question: Todo vehículo motorizado en Ohio, que no sea una motocicleta, debe estar
    equipado con ¿cuál de los siguientes sistemas de frenado?
  choices:
    A: Solo un freno de pie
    B: Solo un freno de estacionamiento de emergencia
    C: Tanto un freno de pie como un freno de estacionamiento
    D: Un sistema de frenado automático (ABS) es el único requisito legal
  answer: C
  explanation: 'La ley de Ohio exige que todo vehículo motorizado tenga dos medios
    separados para aplicar los frenos: un freno de servicio (freno de pie) y un freno
    de estacionamiento.'
- id: 190
  category: vehicle_information
  question: En Ohio, la placa de matrícula trasera de un vehículo debe estar iluminada
    de modo que sea legible desde una distancia de al menos ¿cuántos pies?
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El Código Revisado de Ohio exige que una luz blanca ilumine la placa
    de registro trasera y la haga claramente legible desde una distancia de 50 pies
    hacia atrás.
- id: 191
  category: vehicle_information
  question: El programa de pruebas de emisiones de automóviles E-Check de Ohio se
    requiere actualmente para vehículos registrados en ¿cuántos condados específicos?
  choices:
    A: Los 88 condados
    B: Solo el condado de Franklin
    C: 7 condados en el noreste de Ohio
    D: 15 condados a lo largo del río Ohio
  answer: C
  explanation: El programa E-Check es obligatorio para los vehículos registrados en
    los condados de Cuyahoga, Geauga, Lake, Lorain, Medina, Portage y Summit.
- id: 192
  category: vehicle_information
  question: 'Según la ley de Ohio, todo vehículo motorizado debe estar equipado con
    un espejo ubicado de tal manera que refleje al operador una vista de la carretera
    hacia la parte trasera de dicho vehículo por una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Ohio exige al menos un espejo retrovisor que permita al conductor
    ver al menos 200 pies hacia la parte trasera del vehículo.
- id: 193
  category: vehicle_information
  question: 'En Ohio, todo vehículo motorizado debe estar equipado con una bocina
    capaz de emitir un sonido audible en condiciones normales desde una distancia
    de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Según el Código Revisado de Ohio 4513.21, un vehículo motorizado debe
    tener una bocina en buen estado de funcionamiento capaz de emitir un sonido audible
    desde una distancia no menor a 200 pies.
- id: 194
  category: vehicle_information
  question: La ley de Ohio exige que las luces direccionales sean visibles desde una
    distancia no menor a ______ pies bajo la luz solar normal.
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Las luces direccionales de un vehículo deben ser visibles desde una
    distancia no menor a 300 pies bajo la luz solar normal.
- id: 195
  category: vehicle_information
  question: En Ohio, ¿entre qué fechas es legal usar neumáticos con clavos (studded
    tires) en un vehículo motorizado?
  choices:
    A: Del 1 de octubre al 1 de mayo
    B: Del 1 de noviembre al 15 de abril
    C: Del 1 de diciembre al 31 de marzo
    D: Los neumáticos con clavos están prohibidos durante todo el año en Ohio
  answer: B
  explanation: El Código Revisado de Ohio 4513.25 permite el uso de neumáticos con
    clavos únicamente desde el 1 de noviembre hasta el 15 de abril.
- id: 196
  category: vehicle_information
  question: La ley de cinturón de seguridad obligatorio de Ohio exige que ¿cuál de
    los siguientes use un cinturón de seguridad debidamente ajustado?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros menores de 18 años
    C: El conductor y todos los pasajeros del asiento delantero
    D: Todos los ocupantes del vehículo, independientemente de su posición en el asiento
  answer: C
  explanation: En Ohio, el conductor y todos los pasajeros del asiento delantero están
    obligados a usar cinturones de seguridad. Los niños deben estar en sistemas de
    retención adecuados para su edad, independientemente de dónde se sienten.
- id: 197
  category: vehicle_information
  question: Se debe exhibir un emblema de "Vehículo de movimiento lento" (SMV) en
    la parte trasera de cualquier vehículo diseñado para operar a velocidades de ______
    o menos.
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: El emblema triangular naranja de "Vehículo de movimiento lento" (Slow
    Moving Vehicle - SMV) es obligatorio en los vehículos diseñados para viajar a
    velocidades de 25 mph o menos.
- id: 198
  category: vehicle_information
  question: 'En Ohio, todo vehículo motorizado debe estar equipado con al menos una
    luz trasera que emita una luz roja visible desde una distancia de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Ohio exige que las luces traseras sean visibles desde una
    distancia de 500 pies hacia atrás.
- id: 199
  category: vehicle_information
  question: En Ohio, ¿cuándo se requiere que los conductores tengan encendidas las
    luces delanteras (faros), además del período entre la puesta del sol y el amanecer?
  choices:
    A: Solo cuando se conduce por la carretera interestatal
    B: Siempre que los limpiaparabrisas estén en uso debido a la precipitación
    C: Solo durante tormentas eléctricas fuertes
    D: Siempre que se conduzca en una zona de construcción
  answer: B
  explanation: La ley de Ohio exige que las luces delanteras estén encendidas siempre
    que los limpiaparabrisas estén en uso debido a la lluvia, nieve, aguanieve u otras
    condiciones atmosféricas desfavorables.
- id: 200
  category: vehicle_information
  question: La ley de Ohio exige que todo vehículo motorizado (que no sea una motocicleta)
    esté equipado con un freno de pie que sea capaz de detener el vehículo en ¿cuántos
    pies cuando viaja a 20 mph?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: El freno de pie debe poder detener el vehículo en una distancia de
    30 pies a una velocidad de 20 mph sobre una superficie seca, nivelada y dura.
- id: 201
  category: vehicle_information
  question: 'En Ohio, la luz blanca que ilumina la placa de matrícula trasera debe
    hacer que la placa sea legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El Código Revisado de Ohio exige que una luz blanca ilumine la placa
    de registro trasera para que sea claramente legible desde una distancia de 50
    pies hacia atrás.
- id: 202
  category: vehicle_information
  question: Cuando se tiene la intención de girar o cambiar de carril en Ohio, ¿durante
    cuántos pies, como mínimo, debe un conductor dar una señal continua antes del
    giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley de Ohio exige que se dé una señal de giro de forma continua
    durante al menos 100 pies antes del giro o cambio de carril previsto.
- id: 203
  category: vehicle_information
  question: En ciertos condados de Ohio, se requiere que los vehículos pasen una prueba
    de emisiones E-Check. ¿Con qué frecuencia deben ser probados estos vehículos normalmente?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada cinco años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: En los siete condados de Ohio que requieren el E-Check (Cuyahoga, Geauga,
    Lake, Lorain, Medina, Portage y Summit), las pruebas se requieren cada dos años
    según el año del modelo del vehículo.
- id: 204
  category: vehicle_information
  question: ¿La ley de Ohio prohíbe el uso de cuál de los siguientes equipos en un
    vehículo utilizado en carreteras públicas?
  choices:
    A: Un recorte o derivación del silenciador (muffler cutout or bypass)
    B: Un enganche de remolque
    C: Un portaequipajes de techo
    D: Luces antiniebla
  answer: A
  explanation: El Código Revisado de Ohio 4513.22 prohíbe el uso de un recorte de
    silenciador, derivación o dispositivo similar en un vehículo motorizado en una
    carretera.
- id: 205
  category: vehicle_information
  question: ¿Un vehículo motorizado en Ohio debe tener un espejo retrovisor que permita
    al conductor ver al menos cuántos pies hacia la parte trasera del vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Ohio exige que los vehículos estén equipados con un espejo
    ubicado de tal manera que refleje al conductor una vista de la carretera por una
    distancia de al menos 200 pies hacia atrás.
- id: 206
  category: vehicle_information
  question: Bajo la Ley de Uso Obligatorio del Cinturón de Seguridad de Ohio, ¿quién
    está obligado a usar el cinturón de seguridad cuando se opera un automóvil de
    pasajeros?
  choices:
    A: Solo el conductor
    B: El conductor y todos los pasajeros del asiento delantero
    C: Solo los pasajeros menores de 18 años
    D: Cada ocupante del vehículo independientemente de su posición de asiento
  answer: B
  explanation: 'La ley de Ohio exige que el conductor y todos los pasajeros del asiento
    delantero usen cinturones de seguridad. (Nota: Los niños están cubiertos por leyes
    de retención infantil separadas).'
- id: 207
  category: signs_and_signals
  question: Cuando un conductor extiende su brazo izquierdo por la ventana y lo dobla
    hacia arriba por el codo, ¿qué señal está haciendo?
  choices:
    A: Giro a la izquierda
    B: Giro a la derecha
    C: Disminución de velocidad o parada
    D: Advertencia de peligro
  answer: B
  explanation: La señal manual para un giro a la derecha es el brazo izquierdo extendido
    hacia afuera y doblado hacia arriba por el codo.
- id: 208
  category: signs_and_signals
  question: En Ohio, una señal en forma de banderín (un triángulo isósceles) se encuentra
    en el lado izquierdo de la carretera e indica ¿qué?
  choices:
    A: Ceda el paso
    B: Zona escolar
    C: Zona de no rebasar (No Passing Zone)
    D: Cruce de ferrocarril
  answer: C
  explanation: Se coloca una señal en forma de banderín en el lado izquierdo de la
    carretera para marcar el comienzo de una 'Zona de no rebasar'.
- id: 209
  category: signs_and_signals
  question: Según la ley de Ohio, ¿cuándo se le permite girar a la derecha con luz
    roja?
  choices:
    A: Nunca
    B: Solo si hay una flecha verde
    C: Después de detenerse por completo y ceder el paso al tráfico y a los peatones,
      a menos que una señal lo prohíba
    D: Solo entre las 9:00 PM y las 6:00 AM
  answer: C
  explanation: La ley de Ohio permite un giro a la derecha en rojo después de una
    parada completa, siempre que el camino esté despejado y no haya una señal que
    prohíba el giro.
- id: 210
  category: signs_and_signals
  question: En Ohio, ¿qué significa una luz de tráfico amarilla intermitente?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Acelerar para despejar la intersección
    C: Reducir la velocidad y proceder con precaución
    D: Ceder el paso a todo el tráfico que viene por la derecha
  answer: C
  explanation: Una luz amarilla intermitente es una advertencia para reducir la velocidad
    y avanzar por la intersección con precaución.
- id: 211
  category: signs_and_signals
  question: De acuerdo con la ley de Ohio, si usted conduce por una carretera con
    menos de cuatro carriles y un autobús escolar se detiene con sus luces rojas intermitentes,
    ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima por el frente
    C: El tráfico de ambas direcciones
    D: Nadie, si el autobús está en un carril de giro
  answer: C
  explanation: En una carretera con menos de cuatro carriles, todo el tráfico que
    se aproxime al autobús desde cualquier dirección debe detenerse al menos a 10
    pies de la parte delantera o trasera del autobús.
- id: 212
  category: signs_and_signals
  question: Si una carretera de Ohio tiene cuatro o más carriles y un autobús escolar
    se detiene con las luces rojas intermitentes, ¿qué conductores están obligados
    a detenerse?
  choices:
    A: Todos los conductores en ambas direcciones
    B: Solo los conductores que viajan en la misma dirección que el autobús
    C: Solo los conductores en los carriles contrarios
    D: Solo los conductores en el carril del extremo derecho
  answer: B
  explanation: En Ohio, si un autobús se detiene en una carretera con cuatro o más
    carriles, solo el tráfico que circula en la misma dirección que el autobús debe
    detenerse.
- id: 213
  category: signs_and_signals
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de construcción
    en Ohio cuando hay señales colocadas y trabajadores presentes?
  choices:
    A: La multa se exonera para los infractores por primera vez
    B: La multa se duplica
    C: La multa se triplica
    D: La licencia del conductor se suspende de inmediato
  answer: B
  explanation: La ley de Ohio exige que las multas por infracciones de exceso de velocidad
    en una zona de construcción se dupliquen cuando hay señales colocadas y trabajadores
    presentes.
- id: 214
  category: signs_and_signals
  question: En Ohio, ¿cuándo se permite girar a la izquierda con luz roja?
  choices:
    A: Nunca
    B: Desde cualquier calle hacia una calle de sentido único
    C: Solo desde una calle de sentido único hacia otra calle de sentido único
    D: Solo si no hay tráfico en dos cuadras
  answer: C
  explanation: La ley de Ohio permite girar a la izquierda en rojo solo cuando se
    gira desde una calle de sentido único hacia otra calle de sentido único, después
    de detenerse por completo y ceder el paso al tráfico.
- id: 215
  category: signs_and_signals
  question: ¿Qué indica una señal naranja triangular con un borde reflectante rojo
    colocada en la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo es un vehículo de movimiento lento (25 mph o menos)
    C: El vehículo es una carga de gran tamaño
    D: El vehículo es un conductor estudiante
  answer: B
  explanation: El emblema de vehículo de movimiento lento es una señal naranja fluorescente
    triangular con un borde reflectante rojo, que se utiliza en vehículos que viajan
    a velocidades de 25 mph o menos.
- id: 216
  category: signs_and_signals
  question: ¿Qué representa una línea blanca continua pintada a través de un carril
    en una intersección?
  choices:
    A: Un cruce de peatones
    B: Una línea de parada
    C: Un límite de estacionamiento
    D: Un carril para bicicletas
  answer: B
  explanation: Una línea blanca continua a través de un carril es una línea de parada,
    que indica el punto donde un vehículo debe detenerse ante una señal de tráfico
    o una señal de pare (stop).
- id: 217
  category: signs_and_signals
  question: Cuando ve una señal de "Ceda el paso" (Yield), ¿qué le exige la ley de
    Ohio que haga?
  choices:
    A: Detenerse por completo siempre
    B: Acelerar para incorporarse antes de que lleguen otros autos
    C: Reducir la velocidad y detenerse si es necesario para dejar pasar a cualquier
      vehículo o peatón
    D: Ignorarla si no hay otros autos visibles
  answer: C
  explanation: Una señal de ceda el paso significa que debe reducir la velocidad y
    ceder el derecho de paso a cualquier vehículo o peatón que esté en la intersección
    o se aproxime a ella, deteniéndose si es necesario.
- id: 218
  category: signs_and_signals
  question: ¿Cuál es el significado de una luz de tráfico roja intermitente en Ohio?
  choices:
    A: La señal está averiada; proceda con precaución
    B: Ceda el paso a todo el tráfico, pero no se detenga
    C: Deténgase por completo y proceda solo cuando sea seguro hacerlo
    D: Deténgase y espere a que la luz cambie a verde
  answer: C
  explanation: 'Una luz roja intermitente debe tratarse igual que una señal de pare
    (stop): deténgase por completo y proceda solo cuando sea seguro.'
- id: 219
  category: signs_and_signals
  question: En Ohio, ¿qué indican las líneas blancas discontinuas en el pavimento?
  choices:
    A: Tráfico moviéndose en direcciones opuestas; se permite rebasar
    B: Tráfico moviéndose en la misma dirección; se permite rebasar
    C: El borde de la calzada
    D: Una zona de no rebasar
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Los conductores pueden cruzar estas líneas para
    cambiar de carril cuando sea seguro.
- id: 220
  category: signs_and_signals
  question: Si las luces direccionales de su vehículo no funcionan, ¿cómo debe indicar
    un giro a la derecha utilizando señales manuales en Ohio?
  choices:
    A: Extender el brazo y la mano rectos hacia afuera de la ventana
    B: Extender el brazo y la mano hacia arriba
    C: Extender el brazo y la mano hacia abajo
    D: Mover la mano en movimiento circular
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    y la mano extendidos hacia arriba.
- id: 221
  category: signs_and_signals
  question: 'En Ohio, una señal en forma de banderín (un triángulo isósceles que apunta
    hacia la derecha) se utiliza para indicar:'
  choices:
    A: Una zona escolar
    B: Un requisito de ceder el paso
    C: Una zona de no rebasar
    D: Un cruce de ferrocarril
  answer: C
  explanation: La señal en forma de banderín se encuentra en el lado izquierdo de
    la carretera y marca el inicio de una zona de no rebasar (no-passing zone).
- id: 222
  category: signs_and_signals
  question: Cuando ve una señal amarilla circular con una 'X' negra grande y las letras
    'RR', ¿a qué se está aproximando?
  choices:
    A: Una zona de construcción vial
    B: Un intercambio de autopistas
    C: Un cruce de ferrocarril
    D: Una calzada restringida
  answer: C
  explanation: La señal amarilla circular es la señal de advertencia anticipada para
    un cruce de ferrocarril.
- id: 223
  category: signs_and_signals
  question: Usted conduce por una carretera con dos carriles en su dirección. Hay
    una línea blanca continua pintada entre los carriles. ¿Qué indica esto?
  choices:
    A: Está en un carril para vehículos compartidos (carpool)
    B: Debe permanecer en su carril; se desaconseja cambiar de carril
    C: Debe girar a la derecha en la próxima intersección
    D: Rebasar está estrictamente prohibido
  answer: B
  explanation: Las líneas blancas continuas se utilizan para desaconsejar los cambios
    de carril en áreas donde pueden ser peligrosos, aunque no los prohíben estrictamente
    como una línea continua doble.
- id: 224
  category: signs_and_signals
  question: En Ohio, ¿qué debe hacer al acercarse a un vehículo de seguridad pública
    estacionado (como una patrulla de policía o una ambulancia) con sus luces intermitentes
    encendidas?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero cambiarse al carril izquierdo
    C: Cambiarse a un carril que no sea adyacente al vehículo, o reducir la velocidad
      si no es posible cambiarse de carril
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: C
  explanation: La 'Ley de Moverse' (Move Over Law) de Ohio exige que los conductores
    se cambien de carril o, si no es posible o seguro hacerlo, reduzcan la velocidad
    significativamente al pasar junto a vehículos de emergencia o de servicio estacionados
    con luces intermitentes.
- id: 225
  category: signs_and_signals
  question: En Ohio, ¿qué significa una línea amarilla continua en su lado de la línea
    central discontinua?
  choices:
    A: Puede rebasar con precaución
    B: Está en una zona de sentido único
    C: Está prohibido rebasar
    D: Debe girar a la izquierda
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central indica una
    zona de no rebasar.
- id: 226
  category: signs_and_signals
  question: Según la ley de Ohio, ¿cuál es el procedimiento adecuado para girar a
    la derecha con luz roja?
  choices:
    A: Reducir la velocidad y girar si no viene tráfico
    B: Detenerse, ceder el paso a todo el tráfico y peatones, luego proceder si ninguna
      señal prohíbe el giro
    C: Solo girar si hay una flecha verde presente
    D: Los giros a la derecha en rojo son ilegales en Ohio
  answer: B
  explanation: La ley de Ohio permite los giros a la derecha en rojo después de hacer
    una parada completa y ceder el paso a todo el tráfico y peatones, siempre que
    no haya una señal que prohíba el giro.
- id: 227
  category: signs_and_signals
  question: ¿Cuál es la señal manual para 'Reducir la velocidad o Detenerse' en Ohio?
  choices:
    A: Brazo y mano extendidos rectos hacia afuera
    B: Brazo y mano extendidos hacia arriba
    C: Brazo y mano extendidos hacia abajo
    D: Brazo y mano agitando hacia el suelo
  answer: C
  explanation: La señal manual para reducir la velocidad o detenerse es el brazo izquierdo
    y la mano extendidos hacia abajo.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Hacer una parada completa
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe hacer
    una parada completa en la línea de parada, el cruce peatonal o antes de entrar
    en la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 228
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Hacer una parada completa
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Proceder sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) roja y blanca de forma triangular
    significa que debe reducir la velocidad y ceder el paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 229
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 230
- image: wrong_way.png
  category: signs_and_signals
  question: ¿Qué debe hacer si ve esta señal?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de sentido único o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de forma
    segura.
  id: 231
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de SENTIDO ÚNICO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 232
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 233
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 234
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 235
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona donde está prohibido adelantar.
  id: 236
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 237
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 238
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 239
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 240
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o un cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de color amarillo verdoso fluorescente en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 241
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (rotonda) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras "R" es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 242
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (conocida como "crossbuck") se coloca
    en los cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si
    se aproxima un tren, debe detenerse.
  id: 243
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva hacia la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 244
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 245
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta (rotonda) más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino gire primero
    en un sentido y luego en el otro.
  id: 246
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 247
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Un camino que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 248
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: El carril termina
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 249
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: El camino termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  id: 250
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción vial más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Prepárese para el
    tráfico en ambos sentidos.
  id: 251
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: Tráfico en ambos sentidos más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Es
    posible que esté saliendo de una calle de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 252
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 253
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción vial
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 254
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un puesto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Prepárese para detenerse
    si la luz está roja o amarilla. Esta señal a menudo se coloca donde el semáforo
    puede no ser visible desde la distancia.
  id: 255
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 256
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 257
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de un camino lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la autopista desde el camino lateral.
  id: 258
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril — no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir una incorporación. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 259
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer de pie o al ralentí
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 260
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 261
