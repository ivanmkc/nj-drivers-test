metadata:
  source: 2025 Kentucky Driver's Manual
  total_questions: 252
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Kentucky, what is the minimum age to apply for a learner's permit?
  choices:
    A: 15 years old
    B: 15 and a half years old
    C: 16 years old
    D: 17 years old
  answer: C
  explanation: According to Kentucky law, an applicant must be at least 16 years of
    age to apply for an instruction permit.
- id: 2
  category: license_system
  question: Under Kentucky's Graduated Driver Licensing (GDL) law, how long must a
    driver under age 18 hold an instruction permit before they can take the road test?
  choices:
    A: 30 days
    B: 60 days
    C: 120 days
    D: 180 days
  answer: D
  explanation: Kentucky law requires permit holders under the age of 18 to hold their
    permit for at least 180 days before being eligible for the road skills test.
- id: 3
  category: license_system
  question: What is the curfew for a Kentucky driver with an intermediate license?
  choices:
    A: 10:00 PM to 5:00 AM
    B: 11:00 PM to 6:00 AM
    C: 12:00 AM (Midnight) to 6:00 AM
    D: 1:00 AM to 5:00 AM
  answer: C
  explanation: Intermediate license holders are not permitted to drive between the
    hours of 12:00 AM (midnight) and 6:00 AM, unless they can prove a good cause (such
    as school or work-related activities).
- id: 4
  category: license_system
  question: Under the Kentucky GDL program, how many unrelated people under age 20
    may an intermediate license holder have in the vehicle?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Kentucky intermediate license holders are restricted to carrying only
    one unrelated person under the age of 20 in the vehicle.
- id: 5
  category: license_system
  question: To move from the intermediate license phase to a full, unrestricted license
    in Kentucky, a driver must complete which of the following?
  choices:
    A: A 4-hour Graduated Licensing Program (GLP) course
    B: A 10-hour defensive driving course
    C: A second written exam
    D: A second road test
  answer: A
  explanation: Kentucky requires all drivers who obtained their permit under age 18
    to complete a 4-hour Graduated Licensing Program (GLP) class or an approved equivalent
    before receiving a full license.
- id: 6
  category: license_system
  question: 'The Kentucky ''No Pass/No Drive'' law can result in the suspension of
    a license or permit for a 16 or 17-year-old if they:'
  choices:
    A: Fail more than one class in a semester
    B: Have 9 or more unexcused absences in a semester
    C: Drop out of school
    D: All of the above
  answer: D
  explanation: The 'No Pass/No Drive' law (KRS 159.051) applies to 16 and 17-year-olds
    who drop out of school, are academically deficient (fail 2 or more courses), or
    have 9 or more unexcused absences.
- id: 7
  category: license_system
  question: In Kentucky, how many points accumulated within a two-year period will
    result in a license suspension for a driver under age 18?
  choices:
    A: 5 points
    B: 7 points
    C: 10 points
    D: 12 points
  answer: B
  explanation: For drivers under age 18, the Kentucky Transportation Cabinet will
    send a suspension notice if the driver accumulates 7 or more points within a two-year
    period.
- id: 8
  category: license_system
  question: In Kentucky, what is the legal Blood Alcohol Concentration (BAC) limit
    for drivers under the age of 21?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Kentucky has a 'Zero Tolerance' law for minors, setting the legal BAC
    limit at 0.02% for drivers under age 21.
- id: 9
  category: license_system
  question: When driving with a Kentucky instruction permit, the licensed driver supervising
    you must be at least how old?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: Any age, as long as they have a license
  answer: B
  explanation: A permit holder must be accompanied by a person who is at least 21
    years of age and possesses a valid operator's license at the time of operation.
- id: 10
  category: license_system
  question: To satisfy Kentucky's vision requirement for an unrestricted license,
    an applicant must have at least what visual acuity?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Kentucky requires applicants to have at least 20/40 visual acuity in
    at least one eye to obtain an unrestricted operator's license.
- id: 11
  category: license_system
  question: If you move to Kentucky from another state, you must apply for a Kentucky
    license within how many days of becoming a resident?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents of Kentucky have 30 days to obtain a Kentucky driver's
    license.
- id: 12
  category: license_system
  question: A standard Kentucky driver's license is typically valid for how many years
    before it must be renewed?
  choices:
    A: 2 or 4 years
    B: 4 or 8 years
    C: 5 or 10 years
    D: Every year
  answer: B
  explanation: Kentucky offers drivers the choice of a 4-year or an 8-year renewal
    cycle for standard and REAL ID licenses.
- id: 13
  category: license_system
  question: Which of the following is a requirement for a Kentucky permit holder under
    age 18 to take the road test?
  choices:
    A: Completion of 60 hours of practice (10 at night)
    B: Completion of 40 hours of practice (5 at night)
    C: Completion of 50 hours of practice (5 at night)
    D: Completion of 60 hours of practice (15 at night)
  answer: A
  explanation: Kentucky requires permit holders under 18 to complete 60 hours of driving
    practice, 10 of which must be at night, documented on a practice driving log.
- id: 14
  category: license_system
  question: If a Kentucky driver is convicted of driving without insurance, what is
    the minimum period their license may be suspended for a first offense?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: A first-time conviction for failure to maintain required insurance
    in Kentucky can lead to a license suspension of 90 days to one year.
- id: 15
  category: license_system
  question: In Kentucky, if you change your legal name or your residential address,
    you must apply for a duplicate license within how many days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: According to the Kentucky Driver Manual, if you change your name or
    address, you must apply for a duplicate license within 10 days.
- id: 16
  category: license_system
  question: Under the Kentucky point system, how long do points remain on a driver's
    record from the date of conviction?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: Points assessed against a Kentucky driver's record remain for a period
    of two years from the date of conviction.
- id: 17
  category: license_system
  question: If your Kentucky driving privilege is suspended, what is the standard
    fee required to reinstate the license?
  choices:
    A: $25
    B: $40
    C: $100
    D: $200
  answer: B
  explanation: Kentucky law requires a $40 reinstatement fee to be paid after a license
    suspension period has ended.
- id: 18
  category: license_system
  question: 'Kentucky''s ''Implied Consent'' law means that by operating a vehicle
    on Kentucky''s roadways, you have given consent to:'
  choices:
    A: A search of your vehicle's trunk
    B: A blood, breath, or urine test for alcohol or drugs
    C: A review of your cell phone records
    D: A mandatory defensive driving course
  answer: B
  explanation: The Implied Consent law states that any person who operates a motor
    vehicle in Kentucky has given consent to a chemical test of their blood, breath,
    or urine to determine alcohol or drug content.
- id: 19
  category: license_system
  question: In Kentucky, what is the minimum age to operate a moped on public roads
    without a traditional driver's license, provided you have a moped license?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: C
  explanation: In Kentucky, you must be at least 16 years of age to operate a moped
    and possess either a valid operator's license or a special moped license.
- id: 20
  category: license_system
  question: If you fail the Kentucky road skills test, how long must you wait before
    you are eligible to take the test again?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 14 days
  answer: C
  explanation: Kentucky regulations require applicants who fail the road skills test
    to wait at least seven days before attempting the test again.
- id: 21
  category: license_system
  question: If you fail the Kentucky written permit knowledge test, when is the earliest
    you can attempt the test again?
  choices:
    A: The next available business day
    B: After 48 hours
    C: After 7 days
    D: After 30 days
  answer: A
  explanation: If you fail the written knowledge test in Kentucky, you may take the
    test again on the next available business day.
- id: 22
  category: license_system
  question: In Kentucky, how many points are assessed against your license for speeding
    16-25 mph over the limit?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: Speeding 16-25 mph over the limit in Kentucky results in 6 points being
    added to your driving record.
- id: 23
  category: license_system
  question: How many points are added to a Kentucky driving record for a conviction
    of 'Reckless Driving'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: A conviction for Reckless Driving in Kentucky results in 4 points being
    assessed against the driver's license.
- id: 24
  category: license_system
  question: To obtain a Kentucky REAL ID, which of the following is an acceptable
    document to prove your Social Security number?
  choices:
    A: A handwritten note from an employer
    B: A Social Security Card, W-2, or 1099 form
    C: A birth certificate
    D: A utility bill
  answer: B
  explanation: To prove a Social Security number for a REAL ID in Kentucky, applicants
    must provide a Social Security Card, a W-2 form, or a 1099 form.
- id: 25
  category: license_system
  question: Kentucky residents serving in the military stationed outside the state
    may renew their license by mail how many times?
  choices:
    A: Once
    B: Twice
    C: Unlimited times while on active duty
    D: Never; they must return to Kentucky
  answer: A
  explanation: Kentucky military personnel stationed out of state may renew their
    license by mail once, but the next renewal must be done in person.
- id: 26
  category: license_system
  question: Under Kentucky's 'No Pass/No Drive' law, a student's license or permit
    can be revoked if they have how many unexcused absences in a single semester?
  choices:
    A: 3 or more
    B: 5 or more
    C: 9 or more
    D: 12 or more
  answer: C
  explanation: The 'No Pass/No Drive' law states that a student may lose their license
    if they have 9 or more unexcused absences in one semester.
- id: 27
  category: license_system
  question: In Kentucky, speeding 26 mph or more over the limit will result in which
    of the following?
  choices:
    A: Automatic permanent license revocation
    B: A mandatory hearing and a potential 90-day suspension
    C: A flat fine of $500 with no points
    D: A 3-point assessment
  answer: B
  explanation: Speeding 26 mph or more over the limit in Kentucky is a serious offense
    that requires a hearing and can lead to a 90-day license suspension.
- id: 28
  category: license_system
  question: 'If a Kentucky driver has a physical or mental condition that may affect
    their ability to drive safely, they are required by law to:'
  choices:
    A: Stop driving immediately and forever
    B: Report the condition to the Division of Driver Licensing
    C: Only drive during daylight hours
    D: Carry a doctor's note at all times
  answer: B
  explanation: Kentucky law requires drivers to report any physical or mental condition
    that may affect their driving to the Division of Driver Licensing for evaluation
    by the Medical Review Board.
- id: 29
  category: license_system
  question: What is the fee for a duplicate Kentucky standard driver's license if
    the original is lost or stolen?
  choices:
    A: $5
    B: $15
    C: $25
    D: $40
  answer: B
  explanation: The fee for a duplicate standard Kentucky driver's license is $15.
- id: 30
  category: driver_testing
  question: In Kentucky, what is the speed limit on all state highways or in any business
    or residential district, unless otherwise posted?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: C
  explanation: According to the Kentucky Driver's Manual, the speed limit is 35 mph
    on all state highways or in any business or residential district unless a different
    speed is posted.
- id: 31
  category: driver_testing
  question: What is the maximum speed limit for vehicles in off-street parking facilities
    in Kentucky?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: C
  explanation: Kentucky law sets the speed limit at 15 mph in off-street parking facilities.
- id: 32
  category: driver_testing
  question: In Kentucky, you must dim your high beams to low beams when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Kentucky law requires drivers to dim their headlights when an oncoming
    vehicle is within 500 feet.
- id: 33
  category: driver_testing
  question: When following another vehicle at night in Kentucky, at what distance
    must you dim your high beams to low beams?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Drivers in Kentucky must switch to low beams when following another
    vehicle within a distance of 200 feet.
- id: 34
  category: driver_testing
  question: Under Kentucky's point system, how many points are assessed for speeding
    16-25 mph over the limit on a limited-access highway?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: Speeding 16-25 mph over the limit results in 6 points being added to
    your Kentucky driving record.
- id: 35
  category: driver_testing
  question: In Kentucky, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Kentucky law prohibits parking within 15 feet of a fire hydrant.
- id: 36
  category: driver_testing
  question: In Kentucky, you are prohibited from parking within how many feet of a
    stop sign, flashing beacon, or traffic control signal?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Kentucky law states you cannot park within 30 feet of any flashing
    beacon, stop sign, or traffic control signal.
- id: 37
  category: driver_testing
  question: If you are involved in a collision in Kentucky that results in property
    damage of $500 or more, you must file a written report (form OCR-88) within how
    many days if the police did not file one?
  choices:
    A: 3 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: Kentucky law requires a written accident report to be filed within
    10 days if damage exceeds $500 and no police report was filed.
- id: 38
  category: driver_testing
  question: When passing a bicycle in Kentucky, what is the minimum amount of space
    a motorist must leave between the vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Kentucky's '3-foot law' requires motorists to leave at least three
    feet of space when passing a person riding a bicycle.
- id: 39
  category: driver_testing
  question: On a highway with four or more lanes, if a school bus is stopped on the
    opposite side of a median or barrier, what must a Kentucky driver do?
  choices:
    A: Stop until the bus moves
    B: Stop until the stop arm is retracted
    C: Slow down to 15 mph and proceed with caution
    D: Proceed with caution; stopping is not required for traffic in the opposite
      direction
  answer: D
  explanation: In Kentucky, on a highway of four or more lanes, traffic approaching
    from the opposite direction of a stopped school bus is not required to stop, though
    caution is advised.
- id: 40
  category: driver_testing
  question: Kentucky law requires you to use your turn signal at least how many feet
    before making a turn or changing lanes?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Drivers in Kentucky must signal their intention to turn or change lanes
    at least 100 feet in advance.
- id: 41
  category: driver_testing
  question: For a first DUI conviction in Kentucky (over age 21), what is the range
    of the fine that may be imposed?
  choices:
    A: No fine, only community service
    B: $100 to $300
    C: $200 to $500
    D: $500 to $1,000
  answer: C
  explanation: A first-offense DUI conviction for an adult in Kentucky carries a fine
    ranging from $200 to $500, plus court costs and fees.
- id: 42
  category: driver_testing
  question: In Kentucky, what happens to the fine for speeding in a highway work zone
    when workers are present?
  choices:
    A: The fine is waived for first offenders
    B: The fine is doubled
    C: The fine is tripled
    D: The fine is increased by a flat fee of $500
  answer: B
  explanation: Kentucky law mandates that fines for speeding and other traffic violations
    are doubled in highway work zones when workers are present.
- id: 43
  category: driver_testing
  question: To pass the Kentucky written knowledge test, what is the minimum score
    required?
  choices:
    A: 70% (28 out of 40 questions)
    B: 75% (30 out of 40 questions)
    C: 80% (32 out of 40 questions)
    D: 90% (36 out of 40 questions)
  answer: C
  explanation: The Kentucky written permit test consists of 40 questions. An applicant
    must answer at least 80% (32 questions) correctly to pass.
- id: 44
  category: driver_testing
  question: During the Kentucky road skills test, you will be required to parallel
    park. Your vehicle must be parked within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: The Kentucky Driver's Manual specifies that when parallel parking,
    the vehicle must be within 12 inches of the curb.
- id: 45
  category: driver_testing
  question: 'In Kentucky, you must use your headlights when visibility is reduced
    to less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Kentucky law requires the use of headlights when there is not sufficient
    light to clearly see persons or vehicles at a distance of 500 feet ahead.
- id: 46
  category: driver_testing
  question: Kentucky's 'Move Over' law requires motorists to do what when approaching
    a stationary emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Stop immediately in the lane of travel
    B: Maintain speed but honk to alert the emergency workers
    C: Move to the lane farthest away from the emergency vehicle if safe to do so
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Kentucky law requires drivers to move to the lane not adjacent to the
    emergency vehicle on multi-lane highways. If changing lanes is impossible or unsafe,
    the driver must slow down and maintain a safe speed.
- id: 47
  category: driver_testing
  question: If you are involved in a collision in Kentucky that is not investigated
    by a law enforcement officer, and the damage exceeds ______, you must file a written
    report (form 740) with the Kentucky State Police.
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: According to Kentucky law (KRS 189.635), if a collision results in
    property damage of $500 or more and is not investigated by an officer, a report
    must be filed within 10 days.
- id: 48
  category: driver_testing
  question: In Kentucky, you are required to signal your intention to turn at least
    how many feet before making the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: The Kentucky Driver's Manual states that you must give a signal at
    least 100 feet before the turn.
- id: 49
  category: driver_testing
  question: According to the Kentucky Driver's Manual, what is the recommended following
    distance behind the vehicle in front of you under good driving conditions?
  choices:
    A: One car length
    B: Two seconds
    C: Three seconds
    D: Five seconds
  answer: C
  explanation: Kentucky recommends the 'three-second rule' to maintain a safe following
    distance under normal driving conditions.
- id: 50
  category: driver_testing
  question: If you are convicted of speeding 15 mph or more over the limit on a Kentucky
    highway, how many points will be added to your driving record?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: Automatic suspension
  answer: C
  explanation: In Kentucky, speeding 15 mph or more over the limit results in 6 points
    being added to the driver's record.
- id: 51
  category: driver_testing
  question: In Kentucky, when a school bus is stopped on a four-lane highway (two
    lanes in each direction) with its red lights flashing and stop arm extended, who
    must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic in the lane furthest from the bus
    C: Traffic in all directions must stop
    D: No one is required to stop if there are four lanes
  answer: C
  explanation: In Kentucky, on a highway with four or more lanes, all traffic must
    stop for a school bus unless there is a median or physical barrier separating
    the directions of travel.
- id: 52
  category: driver_testing
  question: What are the minimum liability insurance requirements for a private passenger
    vehicle in Kentucky?
  choices:
    A: $10,000/$20,000/$5,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$50,000
    D: $100,000/$300,000/$50,000
  answer: B
  explanation: Kentucky law requires minimum liability coverage of $25,000 for bodily
    injury to one person, $50,000 for bodily injury to all persons in one accident,
    and $25,000 for property damage.
- id: 53
  category: driver_testing
  question: When taking the Kentucky road skills test, which of the following is an
    automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: Touching a cone during parallel parking
    C: An accident involving any degree of property damage or personal injury
    D: Adjusting the radio while driving
  answer: C
  explanation: According to Kentucky State Police testing standards, any accident
    or traffic violation committed during the road test results in an automatic failure.
- id: 54
  category: driver_responsibility
  question: Kentucky is a 'no-fault' insurance state. What is the minimum amount of
    Personal Injury Protection (PIP) coverage required for all motor vehicles (excluding
    motorcycles)?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: B
  explanation: Kentucky's no-fault law requires a minimum of $10,000 in Personal Injury
    Protection (PIP) coverage to pay for medical expenses and lost wages regardless
    of who is at fault.
- id: 55
  category: driver_responsibility
  question: When must a Kentucky resident renew their vehicle registration and pay
    the associated taxes?
  choices:
    A: Every two years on the date of purchase
    B: Annually during the owner's birth month
    C: Every January 1st
    D: Annually on the date the title was issued
  answer: B
  explanation: In Kentucky, vehicle registration must be renewed annually. For individuals,
    the renewal period is the owner's birth month.
- id: 56
  category: driver_responsibility
  question: If you purchase a vehicle in Kentucky, within how many days must you have
    the title and registration transferred into your name?
  choices:
    A: 7 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: Kentucky law requires that a vehicle title and registration be transferred
    within 15 days of the date of purchase.
- id: 57
  category: driver_responsibility
  question: Under the Kentucky point system, how many points are assessed against
    your driving record for 'Reckless Driving'?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: B
  explanation: Reckless driving in Kentucky results in 4 points being added to the
    driver's record.
- id: 58
  category: driver_responsibility
  question: In Kentucky, if a driver is convicted of speeding 16 mph to 25 mph over
    the posted limit, how many points are added to their record?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: License is automatically revoked
  answer: C
  explanation: Speeding 16-25 mph over the limit in Kentucky results in 6 points.
    Speeding 15 mph or less over the limit results in 3 points.
- id: 59
  category: driver_responsibility
  question: Instead of the standard 25/50/25 liability limits, a Kentucky vehicle
    owner may opt for a 'single limit' policy. What is the minimum required amount
    for this type of policy?
  choices:
    A: $50,000
    B: $60,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: Kentucky law allows for a single limit policy with a minimum of $60,000
    to satisfy financial responsibility requirements.
- id: 60
  category: driver_responsibility
  question: If a Kentucky driver under age 21 is convicted of a DUI with a BAC between
    0.02% and 0.08%, for how long can their license be suspended for a first offense?
  choices:
    A: 30 days to 6 months
    B: 6 months to 1 year
    C: 1 year to 2 years
    D: Until they turn 21
  answer: A
  explanation: For drivers under 21 with a BAC of 0.02 to 0.08, the first offense
    suspension period is 30 days to 6 months.
- id: 61
  category: driver_responsibility
  question: A Kentucky driver who is convicted of 'Racing' on public highways will
    have how many points added to their driving record?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: Conviction for racing on public highways in Kentucky results in 6 points
    being added to the driver's record.
- id: 62
