  explanation: According to the Kentucky Driver's Manual, the speed limit on off-street
    parking facilities is 15 mph unless otherwise posted.
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: C
- id: 79
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in a Kentucky business
    or residential district?
  explanation: In Kentucky, the statutory speed limit for business or residential
    districts is 35 mph unless signs indicate a different limit.
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: C
- id: 80
  category: safe_driving_rules
  question: Under Kentucky law, you must not pass another vehicle within how many
    feet of an intersection or railroad crossing?
  explanation: Kentucky law prohibits passing another vehicle when you are within
    100 feet of any intersection or railroad crossing.
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
- id: 81
  category: safe_driving_rules
  question: When parking a vehicle on a Kentucky roadway, how far must you be from
