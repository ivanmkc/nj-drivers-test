  explanation: Kentucky law states that you may not park within 15 feet of a fire
    hydrant.
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
- id: 82
  category: safe_driving_rules
  question: When a school bus is stopped on a highway with four or more lanes and
