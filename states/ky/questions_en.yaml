  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: Failing to stop for a school bus is a serious violation in Kentucky
    and carries a 6-point penalty on the driver's record.
- id: 78
  category: safe_driving_rules
  question: In Kentucky, what is the speed limit on off-street parking facilities
