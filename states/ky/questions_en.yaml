  explanation: In Kentucky, if a school bus is stopped on a highway with four or more
    lanes and has a median or barrier, only traffic following the bus must stop. Traffic
    in the opposite direction is not required to stop.
  choices:
    A: All traffic in both directions
    B: Only traffic following the bus
    C: Only traffic in the opposite direction
    D: No traffic is required to stop if there are four lanes
  answer: B
- id: 83
  category: safe_driving_rules
  question: When parking uphill on a Kentucky street with a curb, which way should
    you turn your front wheels?
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    (to the left) so that if the vehicle rolls, the back of the front tire will hit
    the curb.
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
- id: 84
  category: safe_driving_rules
  question: At what speed can hydroplaning begin to occur on wet Kentucky roads?
  explanation: The Kentucky Driver's Manual states that hydroplaning can begin at
    speeds as low as 35 mph, where tires may lose contact with the road surface.
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
- id: 85
  category: safe_driving_rules
  question: Kentucky's 'Move Over' law requires drivers to move to the left lane or
    slow down when approaching which type of stationary vehicle with flashing lights?
  explanation: Kentucky's Move Over law applies to emergency vehicles, towing vehicles,
    and highway maintenance/utility vehicles with flashing lights.
  choices:
    A: Only police cars
    B: Only ambulances and fire trucks
    C: Emergency, towing, and maintenance vehicles
    D: Any vehicle parked on the shoulder
  answer: C
- id: 86
  category: safe_driving_rules
  question: 'In Kentucky, when entering a roundabout, you must yield the right-of-way
    to:'
