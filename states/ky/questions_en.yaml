    circulating in the roundabout coming from your left.
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; you have the right of way
    D: Only pedestrians
  answer: B
- id: 87
  category: safe_driving_rules
  question: 'In Kentucky, it is illegal to follow a fire apparatus responding to an
    alarm closer than:'
  explanation: According to the Kentucky Driver's Manual, you must not follow a fire
    truck or other fire apparatus closer than 500 feet.
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
- id: 88
  category: safe_driving_rules
  question: How many feet must you park away from any flashing beacon, stop sign,
    or traffic-control signal in Kentucky?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Kentucky law requires drivers to park at least 30 feet away from any
    flashing beacon, stop sign, or traffic-control signal located at the side of a
    roadway.
- id: 89
  category: safe_driving_rules
  question: On a Kentucky highway with four or more lanes, which vehicles must stop
    for a school bus with red lights flashing and a stop arm extended?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching from the opposite direction
    C: All traffic in both directions
    D: No vehicles are required to stop on a 4-lane road
  answer: A
  explanation: In Kentucky, on a highway with four or more lanes, the driver of a
    vehicle approaching a stopped school bus from the opposite direction does not
    need to stop. Only traffic following the bus must stop.
- id: 90
  category: safe_driving_rules
  question: Under the Kentucky point system, how many points are assessed for a conviction
    of reckless driving?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Reckless driving is a 4-point violation under the Kentucky Driver Point
    System.
- id: 91
  category: safe_driving_rules
  question: In Kentucky, how many points are added to your driving record for 'following
    too closely'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Following too closely (tailgating) results in 3 points being added
    to a driver's record in Kentucky.
- id: 92
  category: safe_driving_rules
  question: 'When meeting an oncoming vehicle at night in Kentucky, you must dim your
    high-beam headlights when the vehicle is within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Kentucky law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet.
- id: 93
  category: safe_driving_rules
  question: According to the Kentucky Driver's Manual, at what speed can hydroplaning
    (tires losing contact with the road) begin?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Kentucky Driver's Manual states that hydroplaning can begin at
    speeds as low as 35 mph.
- id: 94
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, Kentucky law
    and safety guidelines suggest you should look how far ahead of your vehicle?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: One city block
  answer: B
  explanation: Kentucky safety guidelines state that you should look 10 to 15 seconds
    ahead of your vehicle to anticipate hazards and manage traffic flow.
- id: 95
  category: defensive_driving
  question: In Kentucky, when following another vehicle at night, you must dim your
    high-beam headlights when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Kentucky law requires drivers to dim high beams when following another
    vehicle within a distance of 200 feet.
- id: 96
  category: defensive_driving
  question: 'Kentucky law requires you to turn on your headlights whenever you are
    using your windshield wipers due to rain, snow, or sleet, and whenever visibility
    is less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Kentucky law states that headlights must be on when windshield wipers
    are in use and whenever visibility is reduced to 500 feet or less.
- id: 97
  category: defensive_driving
  question: When driving in heavy fog in Kentucky, which headlight setting should
    you use to maintain the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard flashers
  answer: B
  explanation: In fog, you should use low-beam headlights. High beams reflect off
    the fog and actually decrease visibility.
- id: 98
  category: defensive_driving
  question: If your vehicle starts to skid on a slippery Kentucky road, what is the
    correct defensive driving response?
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Turn the steering wheel in the direction the rear of the vehicle is sliding
    D: Shift the car into neutral and turn off the engine
  answer: C
  explanation: To recover from a skid, you should take your foot off the gas and turn
    the steering wheel in the direction the rear of the vehicle is skidding.
- id: 99
  category: defensive_driving
  question: When entering a curve in Kentucky, what is the safest defensive driving
    practice to maintain control?
  choices:
    A: Brake hard while in the middle of the curve
    B: Slow down before you enter the curve
    C: Accelerate as you enter the curve
    D: Maintain your highway speed throughout the curve
  answer: B
  explanation: The Kentucky Driver Manual advises slowing down before entering a curve
    so you can maintain better control and avoid skidding.
- id: 100
  category: defensive_driving
  question: In Kentucky, when you are stopped at an intersection and the light turns
    green, what is the recommended scanning sequence before proceeding?
  choices:
    A: Look straight ahead and go
    B: Look right, then left
    C: Look left, then right, then left again
    D: Check your rearview mirror only
  answer: C
  explanation: Kentucky safety guidelines recommend looking left, then right, and
    then left again before entering an intersection to ensure no cross-traffic is
    running a red light.
- id: 101
  category: defensive_driving
  question: When driving on a Kentucky highway with three or more lanes, which lane
    is generally used for the smoothest flow of traffic?
  choices:
    A: The left lane
    B: The right lane
    C: The middle lane
    D: The shoulder
  answer: C
  explanation: On a road with three or more lanes, the middle lane usually offers
    the smoothest flow of traffic, while the left is for passing and the right is
    for entering/exiting.
- id: 102
  category: defensive_driving
  question: If you are following a large truck or commercial vehicle in Kentucky,
    how can you tell if you are in the driver's 'No-Zone' (blind spot)?
  choices:
    A: If you are closer than 50 feet
    B: If you cannot see the truck driver's face in their side-view mirror
    C: If you are driving in the left lane
    D: If the truck is traveling faster than 55 mph
  answer: B
  explanation: A general rule for Kentucky drivers is that if you cannot see the truck
    driver's face in their side-view mirror, the truck driver cannot see you.
- id: 103
  category: defensive_driving
  question: During a heavy Kentucky rainstorm, when is the road surface likely to
    be the most slippery?
  choices:
    A: After it has been raining for several hours
    B: Just after the rain stops
    C: During the first few minutes of rainfall
    D: When the temperature is above 80 degrees
  answer: C
  explanation: Roads are most slippery during the first few minutes of rain because
    the water mixes with oil and grease on the pavement that hasn't washed away yet.
- id: 104
  category: defensive_driving
  question: If your gas pedal sticks while driving on a Kentucky roadway, what should
    be your first defensive action?
  choices:
    A: Turn off the engine immediately
    B: Shift to neutral and apply the brakes
    C: Pull the emergency brake
    D: Open the car door to slow down
  answer: B
  explanation: If your accelerator sticks, you should shift to neutral, apply the
    brakes, and look for a safe way to pull off the road.
- id: 105
  category: defensive_driving
  question: To avoid glare from the headlights of an oncoming vehicle at night, where
    should a Kentucky driver direct their eyes?
  choices:
    A: Directly at the oncoming headlights
    B: At the center line of the road
    C: Toward the right edge of the road
    D: Close their eyes briefly
  answer: C
  explanation: The Kentucky Driver Manual suggests looking toward the right side of
    the road or the white line to avoid being blinded by oncoming high beams.
- id: 106
  category: defensive_driving
  question: According to the Kentucky Driver Manual, at what speed can hydroplaning
    begin, where tires start to ride up on a film of water?
  choices:
    A: As low as 25 mph
    B: As low as 35 mph
    C: Only above 55 mph
    D: Only during heavy thunderstorms
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph. At 55 mph, tires
    may lose all contact with the road surface.
- id: 107
  category: defensive_driving
  question: To maintain proper 'situational awareness,' the Kentucky Driver Manual
    suggests scanning the road ahead at least how many seconds?
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 10 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Drivers are encouraged to look 10 to 15 seconds ahead to identify potential
    hazards early and avoid last-minute maneuvers.
- id: 108
  category: defensive_driving
  question: In Kentucky, when are roads most slippery during a rainstorm?
  choices:
    A: After it has been raining for several hours
    B: During a light drizzle that lasts all day
    C: Just after the rain begins
    D: When the sun comes out after the rain
  answer: C
  explanation: Roads are most slippery right after rain begins because the water mixes
    with oil and dust on the pavement that has not yet washed away.
- id: 109
  category: defensive_driving
  question: When approaching a railroad crossing in Kentucky with a stop sign or signal,
    you must stop your vehicle within what distance from the nearest rail?
  choices:
    A: Between 5 and 20 feet
    B: Between 10 and 25 feet
    C: Between 15 and 50 feet
    D: Exactly 50 feet
  answer: C
  explanation: Kentucky law requires drivers to stop between 15 and 50 feet from the
    nearest rail at a railroad crossing when a stop is required.
- id: 110
  category: defensive_driving
  question: If your brakes fail while driving, what should be your first defensive
    action according to Kentucky safety guidelines?
  choices:
    A: Turn off the ignition immediately
    B: Shift to a lower gear and pump the brake pedal fast and hard several times
    C: Jump out of the vehicle
    D: Shift the car into 'Park'
  answer: B
  explanation: Pumping the brakes can often build up enough hydraulic pressure to
    stop the car, and downshifting uses the engine to help slow the vehicle.
- id: 111
  category: defensive_driving
  question: In Kentucky, what is the 'Total Stopping Distance' comprised of?
  choices:
    A: Braking distance only
    B: Reaction distance and braking distance
    C: Perception distance, reaction distance, and braking distance
    D: Perception distance and speed
  answer: C
  explanation: Total stopping distance is the sum of the time it takes to see the
    hazard (perception), the time to move your foot to the brake (reaction), and the
    distance the car travels once the brakes are applied (braking).
- id: 112
  category: defensive_driving
  question: 'If you are driving on a Kentucky highway and a tire blows out, you should:'
  choices:
    A: Brake hard immediately to stop
    B: Grip the steering wheel firmly and keep the vehicle straight while slowing
      down gradually
    C: Quickly steer toward the shoulder
    D: Accelerate to maintain momentum
  answer: B
  explanation: In a blowout, sudden braking can cause a swerve. You should maintain
    a firm grip, stay straight, and ease off the gas to slow down safely.
- id: 113
  category: alcohol_drugs_health
  question: If a Kentucky driver is convicted of a first-offense DUI with an 'aggravating
    circumstance,' what is the mandatory minimum jail sentence?
  choices:
    A: 24 hours
    B: 48 hours
    C: 4 days
    D: 10 days
  answer: C
  explanation: For a first DUI offense in Kentucky, if an aggravating circumstance
    is present, there is a mandatory minimum jail sentence of 4 days.
- id: 114
  category: alcohol_drugs_health
  question: Kentucky's 'Open Container' law prohibits the possession of an open alcoholic
    beverage container in the passenger area of a vehicle. Where is it legal to store
    an open container?
  choices:
    A: In the glove compartment
    B: In the center console
    C: In the trunk
    D: Under the driver's seat
  answer: C
  explanation: Open containers must be kept in the trunk or an area not normally occupied
    by the driver or passengers. A glove compartment is generally considered part
    of the passenger area.
- id: 115
  category: alcohol_drugs_health
  question: 'A Kentucky driver convicted of a first-offense DUI must complete a substance
    abuse education or treatment program for a period of:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Kentucky law requires first-time DUI offenders to complete a 90-day
    alcohol or substance abuse education or treatment program.
- id: 116
  category: alcohol_drugs_health
  question: In Kentucky, at what Blood Alcohol Concentration (BAC) level is a driver
    considered to be operating under an 'aggravated' level, regardless of other factors?
  choices:
    A: 0.10% or higher
    B: 0.15% or higher
    C: 0.20% or higher
    D: 0.25% or higher
  answer: B
  explanation: Operating a motor vehicle with a BAC of 0.15% or more is specifically
    listed as an aggravating circumstance in Kentucky DUI statutes.
- id: 117
  category: alcohol_drugs_health
  question: If you are taking prescription medication in Kentucky, can you be convicted
    of DUI?
  choices:
    A: No, as long as you have a valid prescription
    B: No, DUI only applies to alcohol and illegal drugs
    C: Yes, if the medication impairs your ability to drive safely
    D: Yes, but only if you mix it with alcohol
  answer: C
  explanation: Kentucky law prohibits driving under the influence of any substance
    which may impair one's driving ability, including prescription or over-the-counter
    medications.
- id: 118
  category: alcohol_drugs_health
  question: According to Kentucky medical standards, a person who has experienced
    a seizure or blackout must be seizure-free for how long before they can legally
    drive?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: Kentucky administrative regulations generally require a driver to be
    seizure-free or blackout-free for at least 90 days to be eligible for a license.
- id: 119
  category: alcohol_drugs_health
  question: 'In Kentucky, the ''lookback period'' for prior DUI convictions to determine
    if a current offense is a second or subsequent offense is:'
  choices:
    A: 3 years
    B: 5 years
    C: 10 years
    D: Permanent
  answer: C
  explanation: Kentucky uses a 10-year 'lookback' period (also known as a 'washout'
    period) for DUI offenses.
- id: 120
  category: alcohol_drugs_health
  question: Which of the following is an aggravating circumstance for a DUI in Kentucky
    that involves speed?
  choices:
    A: Exceeding the speed limit by 15 mph
    B: Exceeding the speed limit by 20 mph
    C: Exceeding the speed limit by 25 mph
    D: Exceeding the speed limit by 30 mph or more
  answer: D
  explanation: Operating a motor vehicle in excess of 30 miles per hour over the posted
    speed limit while under the influence is an aggravating circumstance in Kentucky.
- id: 121
  category: alcohol_drugs_health
  question: In Kentucky, who can be charged under the Open Container law if an open
    alcoholic beverage is found in the passenger area of a vehicle?
  choices:
    A: Only the driver
    B: Only the person holding the container
    C: The driver and/or any passenger in possession of the container
    D: Only passengers
  answer: C
  explanation: Kentucky's open container law applies to both the driver and the passengers.
    No person shall have an open alcoholic beverage container in their possession
    while in the passenger area of a motor vehicle on a public highway.
- id: 122
  category: alcohol_drugs_health
  question: What is the primary effect of combining alcohol with other drugs while
    driving?
  choices:
    A: The drugs cancel out the alcohol
    B: The alcohol cancels out the drugs
    C: The effects are multiplied (synergistic effect)
    D: There is no change in impairment
  answer: C
  explanation: Combining alcohol with other drugs, even over-the-counter ones, creates
    a synergistic effect where the level of impairment is much greater than either
    substance alone.
- id: 123
  category: alcohol_drugs_health
  question: 'In Kentucky, if a driver is convicted of a DUI while driving the ''wrong
    way'' on a limited-access highway, this is classified as:'
  choices:
    A: A standard DUI
    B: An aggravating circumstance
    C: A felony on the first offense
    D: A non-moving violation
  answer: B
  explanation: Operating a motor vehicle in the wrong direction on a limited-access,
    divided highway is one of the specific aggravating circumstances defined by Kentucky
    DUI law.
- id: 124
  category: alcohol_drugs_health
  question: In Kentucky, a DUI conviction is considered 'aggravated' if the driver's
    Blood Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: 0.10%
    B: 0.15%
    C: 0.18%
    D: 0.20%
  answer: B
  explanation: Kentucky law defines a BAC of 0.15% or higher as an 'aggravating circumstance,'
    which triggers mandatory minimum jail time and higher penalties.
- id: 125
  category: alcohol_drugs_health
  question: Under Kentucky law, what is the 'look-back' period for counting prior
    DUI convictions for sentencing purposes?
  choices:
    A: 3 years
    B: 5 years
    C: 10 years
    D: 15 years
  answer: C
  explanation: Kentucky uses a 10-year look-back period. If a driver is convicted
    of a DUI, any other DUI convictions within the previous 10 years are counted to
    determine if it is a second, third, or subsequent offense.
- id: 126
  category: alcohol_drugs_health
  question: Kentucky's 'Open Container' law prohibits which of the following?
  choices:
    A: Possessing an open alcoholic beverage container in the passenger area of a
      vehicle on a public highway
    B: Possessing an unopened bottle of wine in the front seat
    C: Possessing an open container in the trunk of the vehicle
    D: Possessing an open container in the locked glove compartment
  answer: A
  explanation: Kentucky law prohibits the possession of an open alcoholic beverage
    container in the passenger area of a motor vehicle while it is located on a public
    highway. This applies to both drivers and passengers.
- id: 127
  category: alcohol_drugs_health
  question: If a Kentucky driver refuses to submit to a chemical test for alcohol
    or drugs, what is the immediate consequence under the Implied Consent law for
    a first offense?
  choices:
    A: A mandatory 48-hour jail stay
    B: A $1,000 fine
    C: Suspension of driving privileges by the court at the time of arraignment
    D: Permanent loss of the vehicle
  answer: C
  explanation: If you refuse a chemical test in Kentucky, your license will be suspended
    by the court at the time of arraignment. For a first offense, the suspension typically
    lasts for the duration of the court case (usually 6 months).
- id: 128
  category: alcohol_drugs_health
  question: In Kentucky, can you be convicted of a DUI if you are driving under the
    influence of legally prescribed medication?
  choices:
    A: No, as long as you have a valid prescription
    B: No, the DUI law only applies to alcohol and illegal drugs
    C: Yes, if the medication impairs your ability to drive safely
    D: Yes, but only if you also have alcohol in your system
  answer: C
  explanation: Kentucky's DUI law applies to any substance that impairs a driver's
    ability to operate a motor vehicle, including prescription drugs, over-the-counter
    medications, and inhalants.
- id: 129
  category: alcohol_drugs_health
  question: What is the mandatory minimum jail time for a second DUI offense within
    a 10-year period in Kentucky?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 30 days
  answer: C
  explanation: For a second DUI conviction within 10 years in Kentucky, the law requires
    a mandatory minimum of 7 days in jail, which can extend up to 6 months.
- id: 130
  category: alcohol_drugs_health
  question: 'In Kentucky, a fourth or subsequent DUI conviction within a 10-year period
    is classified as:'
  choices:
    A: A Class A Misdemeanor
    B: A Class B Misdemeanor
    C: A Class D Felony
    D: A violation with no jail time
  answer: C
  explanation: In Kentucky, a fourth DUI offense within a 10-year period is a Class
    D Felony, which carries a mandatory minimum sentence of 120 days of imprisonment
    without probation.
- id: 131
  category: alcohol_drugs_health
  question: According to the Kentucky Driver's Manual, what is the first thing affected
    by alcohol consumption?
  choices:
    A: Vision
    B: Muscle coordination
    C: Judgment
    D: Speech
  answer: C
  explanation: Alcohol affects judgment first. Drivers may feel more confident and
    take risks they wouldn't normally take before their physical coordination or vision
    shows obvious signs of impairment.
- id: 132
  category: alcohol_drugs_health
  question: To reinstate a Kentucky driver's license after a DUI conviction, the driver
    must complete which of the following?
  choices:
    A: A 4-hour defensive driving course
    B: A state-approved substance abuse program
    C: A new written and road test only
    D: 100 hours of community service
  answer: B
  explanation: Kentucky law requires all persons convicted of a DUI to successfully
    complete a substance abuse education or treatment program licensed by the Cabinet
    for Health and Family Services before their license can be reinstated.
- id: 133
  category: alcohol_drugs_health
  question: Which of the following is an 'aggravating circumstance' involving a passenger
    in a Kentucky DUI case?
  choices:
    A: Having more than 3 passengers in the vehicle
    B: Having a passenger who is also intoxicated
    C: Transporting a passenger under the age of 12
    D: Transporting a passenger who does not have a license
  answer: C
  explanation: Operating a motor vehicle while under the influence with a passenger
    under the age of 12 is specifically listed as an aggravating circumstance in Kentucky
    (KRS 189A.010).
- id: 134
  category: penalties_and_points
  question: For a first DUI conviction in Kentucky, for how long will your driver's
    license typically be suspended?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: A first-offense DUI conviction in Kentucky usually carries a license
    suspension period of 6 months.
- id: 135
  category: penalties_and_points
  question: How often is a Kentucky driver eligible to attend State Traffic School
    to reduce points on their license?
  choices:
    A: Once every 6 months
    B: Once every 12 months
    C: Once every 2 years
    D: Once every 5 years
  answer: B
  explanation: Kentucky law allows drivers to attend State Traffic School for point
    reduction once every 12 months.
- id: 136
  category: penalties_and_points
  question: In Kentucky, being convicted of 'Reckless Driving' will result in how
    many points on your driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Reckless driving is a 4-point violation under the Kentucky point system.
- id: 137
  category: penalties_and_points
  question: What is the point penalty for a Kentucky driver who is convicted of passing
    a loading or unloading school bus?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 12 points (Automatic Suspension)
  answer: C
  explanation: Improperly passing a school bus that is loading or unloading is a serious
    violation worth 6 points in Kentucky.
- id: 138
  category: penalties_and_points
  question: What is the standard fine for a first-time seat belt violation for an
    adult in Kentucky?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: Kentucky's primary seat belt law carries a $25 fine for violations.
- id: 139
  category: penalties_and_points
  question: 'In Kentucky, you must file a written accident report (Form KSP 232) if
    the accident resulted in property damage exceeding:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Kentucky law requires a written report to the Department of State Police
    within 10 days if property damage exceeds $500.
- id: 140
  category: penalties_and_points
  question: For a driver age 18 or older, a conviction for texting while driving in
    Kentucky results in how many points?
  choices:
    A: 0 points (Fine only)
    B: 3 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: Texting while driving is a 3-point violation for drivers 18 and older
    in Kentucky.
- id: 141
  category: penalties_and_points
  question: 'If a Kentucky driver is convicted of ''Racing'' on a public highway,
    their license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Kentucky law mandates a 90-day license suspension for a conviction
    of racing on a public highway.
- id: 142
  category: penalties_and_points
  question: 'In Kentucky, littering from a motor vehicle is a violation that can result
    in a fine of up to:'
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: C
  explanation: Littering is a criminal violation in Kentucky, and offenders can be
    fined up to $500.
- id: 143
  category: penalties_and_points
  question: For a first DUI conviction in Kentucky, what is the standard license suspension
    period for a driver over age 21?
  choices:
    A: 30 to 60 days
    B: 4 to 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: A first-offense DUI conviction for a driver 21 or older in Kentucky
    typically results in a license suspension of 4 to 6 months.
- id: 144
  category: penalties_and_points
  question: How many points are assessed for 'Reckless Driving' in the state of Kentucky?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Kentucky's point system assigns 4 points to a driver's record for a
    conviction of reckless driving.
- id: 145
  category: penalties_and_points
  question: What is the Blood Alcohol Concentration (BAC) limit for commercial drivers
    (CDL holders) operating a commercial vehicle in Kentucky?
  choices:
    A: '0.01'
    B: '0.02'
    C: '0.04'
    D: '0.08'
  answer: C
  explanation: In accordance with federal and Kentucky state law, the BAC limit for
    commercial drivers operating a commercial vehicle is 0.04.
- id: 146
  category: penalties_and_points
  question: In Kentucky, how many points are assessed for a conviction of 'Failure
    to stop for a school or church bus'?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: No points, but a $500 fine
  answer: C
  explanation: Failing to stop for a school or church bus that is loading or unloading
    is a serious 6-point violation in Kentucky.
- id: 147
  category: penalties_and_points
  question: Under Kentucky law, what is the fine for a first-time 'Texting While Driving'
    violation for a driver over age 18?
  choices:
    A: $25
    B: $100
    C: $250
    D: $500
  answer: A
  explanation: For drivers 18 and over in Kentucky, the fine for a first texting-while-driving
    offense is $25 plus court costs.
- id: 148
  category: sharing_the_road
  question: Under Kentucky law, which of the following motorcycle operators is REQUIRED
    to wear a protective helmet?
  choices:
    A: Only those under the age of 18
    B: Only those with a motorcycle instruction permit
    C: Operators under 21, those with a permit, or those licensed for less than one
      year
    D: All motorcycle operators regardless of age or experience
  answer: C
  explanation: KRS 189.285 states that helmets are required for operators under 21,
    those with a motorcycle instruction permit, and those who have held their motorcycle
    license for less than one year.
- id: 149
  category: sharing_the_road
  question: In Kentucky, what must a driver do when a pedestrian is crossing the street
    guided by a dog or carrying a white cane (which may have a red tip)?
  choices:
    A: Honk to let them know you are there
    B: Give them the right-of-way and take precautions to avoid injury
    C: Drive around them if there is enough room
    D: Wait for them to cross only if there is a marked crosswalk
  answer: B
  explanation: Kentucky law requires drivers to yield the right-of-way to blind pedestrians
    using a guide dog or a white cane, regardless of whether they are in a marked
    crosswalk.
- id: 150
  category: sharing_the_road
  question: A first-time conviction for passing a stopped school bus in Kentucky while
    it is loading or unloading passengers results in how many points on your driving
    record?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Under the Kentucky point system, 'Failure to stop for a school bus'
    is a 6-point violation.
- id: 151
  category: sharing_the_road
  question: 'When encountering a horse-drawn vehicle on Kentucky roadways, you should:'
  choices:
    A: Honk your horn to warn the driver of your approach
    B: Use your high beams to see the carriage better
    C: Slow down and pass only when it is safe and will not spook the horse
    D: Always maintain a speed of at least 55 mph to pass quickly
  answer: C
  explanation: Kentucky has many Amish and Mennonite communities. Drivers should be
    cautious, avoid loud noises like honking, and pass slowly to avoid startling the
    animals.
- id: 152
  category: sharing_the_road
  question: In Kentucky, is 'lane splitting' (a motorcycle driving between two lanes
    of stopped or moving traffic) legal?
  choices:
    A: Yes, it is legal at speeds under 30 mph
    B: Yes, it is legal if the cars are stopped at a light
    C: No, it is illegal and motorcycles must operate within a single lane
    D: It is only legal for emergency responders
  answer: C
  explanation: In Kentucky, motorcycles are entitled to the full use of a lane, and
    lane splitting is not permitted; motorcycles must follow the same lane rules as
    other vehicles.
- id: 153
  category: sharing_the_road
  question: According to Kentucky law, what is the minimum distance you must maintain
    when following an emergency vehicle responding to an alarm?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: KRS 189.930(5) prohibits drivers from following any emergency vehicle
    closer than 500 feet when it is responding to an emergency.
- id: 154
  category: sharing_the_road
  question: 'When a large truck is turning right onto a narrow street, it may need
    to:'
  choices:
    A: Swing wide to the left before turning
    B: Stop and back up to make the turn
    C: Turn from the left lane
    D: Speed up to clear the intersection
  answer: A
  explanation: Large trucks have a wide turning radius. To clear the curb, they often
    swing wide to the left. Drivers should never try to squeeze between a truck and
    the curb during a right turn.
- id: 155
  category: sharing_the_road
  question: 'In Kentucky, bicyclists are required by law to:'
  choices:
    A: Ride on the sidewalk at all times
    B: Ride against the flow of traffic
    C: Obey the same traffic laws and signs as motor vehicle drivers
    D: Only ride on designated bike paths
  answer: C
  explanation: Bicyclists have the same rights and responsibilities as motorists in
    Kentucky and must obey all traffic signals, signs, and pavement markings.
- id: 156
  category: sharing_the_road
  question: If you are turning at an intersection and a pedestrian is crossing in
    an unmarked crosswalk, who has the right-of-way in Kentucky?
  choices:
    A: The driver, because the crosswalk is not marked
    B: The pedestrian
    C: Whomever arrived at the intersection first
    D: The pedestrian, but only if they are wearing reflective clothing
  answer: B
  explanation: Kentucky law requires drivers to yield to pedestrians in both marked
    and unmarked crosswalks at intersections.
- id: 157
  category: sharing_the_road
  question: Under Kentucky law (KRS 189.378), what is the rule regarding funeral processions?
  choices:
    A: They must yield to all other traffic
    B: They have the right-of-way at intersections regardless of traffic signals,
      if the lead vehicle entered legally
    C: They are only allowed on Sundays
    D: They must not exceed 25 mph on any road
  answer: B
  explanation: Funeral processions have the right-of-way at intersections. Once the
    lead vehicle enters an intersection lawfully, the remaining vehicles in the procession
    may follow regardless of traffic lights, provided they exercise due care.
- id: 158
  category: sharing_the_road
  question: 'In Kentucky, motorcycles are required to have their headlights on:'
  choices:
    A: Only at night
    B: Only during inclement weather
    C: At all times when in operation
    D: Only when traveling on the interstate
  answer: C
  explanation: Kentucky law requires motorcycles to have their headlights on at all
    times while in operation to increase visibility to other drivers.
- id: 159
  category: sharing_the_road
  question: In Kentucky, when a school bus is stopped on a four-lane highway that
    is NOT divided by a median or physical barrier, which traffic must stop?
  choices:
    A: Only the traffic following the bus
    B: Only the traffic in the lane furthest from the bus
    C: Traffic in all directions
    D: No one is required to stop on a four-lane highway
  answer: C
  explanation: According to the Kentucky Driver's Manual, on a highway of four or
    more lanes, all traffic must stop for a school bus unless the roadway is divided
    by a median or physical barrier. If there is no barrier, all lanes in both directions
    must stop.
- id: 160
  category: sharing_the_road
  question: 'When following a large commercial truck, if you cannot see the truck
    driver''s side-view mirrors, you are:'
  choices:
    A: In the truck's 'No-Zone' (blind spot)
    B: In the ideal position to pass
    C: Safe from any debris falling from the truck
    D: Following at a legal and safe distance
  answer: A
  explanation: The Kentucky Driver's Manual emphasizes that if you cannot see the
    driver's face in their side-view mirror, they cannot see you. This area is known
    as the 'No-Zone' or blind spot.
- id: 161
  category: sharing_the_road
  question: In Kentucky, what must you do when you see a pedestrian with a white cane
    or a guide dog entering an intersection?
  choices:
    A: Honk your horn to let them know you are there
    B: Slow down and proceed with caution
    C: Give them the right-of-way and come to a complete stop
    D: Drive around them if there is enough room
  answer: C
  explanation: Kentucky law requires drivers to yield the right-of-way to blind pedestrians
    using a guide dog or carrying a white cane (with or without a red tip).
- id: 162
  category: sharing_the_road
  question: On a Kentucky roadway divided by a median or physical barrier, when is
    traffic traveling in the opposite direction of a stopped school bus required to
    stop?
  choices:
    A: Always
    B: Only if there are more than three children crossing
    C: Never
    D: Only if the bus driver signals them to stop
  answer: C
  explanation: If a school bus is stopped on a highway divided by a median or physical
    barrier, only traffic following the bus must stop. Traffic in the opposite direction
    is not required to stop.
- id: 163
  category: sharing_the_road
  question: In Kentucky, it is illegal to follow closer than how many feet to an emergency
    vehicle answering an alarm?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: KRS 189.930(4) states that the driver of any vehicle, other than one
    on official business, shall not follow any emergency vehicle or public safety
    vehicle closer than 500 feet.
- id: 164
  category: sharing_the_road
  question: Which of the following is true regarding bicyclists on Kentucky roadways?
  choices:
    A: They must always ride on the sidewalk
    B: They are required to ride against the flow of traffic
    C: They have the same rights and responsibilities as motor vehicle drivers
    D: They are not allowed on any road with a speed limit over 35 mph
  answer: C
  explanation: In Kentucky, bicycles are considered vehicles. Cyclists have the same
    rights to the road and must obey the same traffic laws as motorists.
- id: 165
  category: sharing_the_road
  question: If you are driving and a funeral procession approaches an intersection,
    what is the law in Kentucky?
  choices:
    A: The procession must yield to all other traffic
    B: You must yield the right-of-way to the entire procession until all vehicles
      have passed
    C: Only the lead vehicle in the procession has the right-of-way
    D: You may cut through the procession if there is a large gap
  answer: B
  explanation: Under Kentucky law (KRS 189.378), funeral processions have the right-of-way
    at intersections. Drivers must yield to the entire procession and are prohibited
    from driving between or joining vehicles in the procession.
- id: 166
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may:'
  choices:
    A: Stay entirely in the right lane
    B: Swing wide into the left lane to complete the turn
    C: Turn from the left lane only
    D: Stop and wait for all traffic to clear both lanes
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn.
    Drivers should avoid 'squeezing' between the truck and the curb.
- id: 167
  category: sharing_the_road
  question: In Kentucky, what does a slow-moving vehicle emblem look like?
  choices:
    A: A circular blue sign
    B: A triangular orange-red emblem
    C: A square yellow sign
    D: A rectangular white sign
  answer: B
  explanation: Slow-moving vehicles (those traveling 25 mph or less), such as farm
    machinery or horse-drawn buggies, must display a triangular fluorescent orange-red
    emblem with a reflective border.
- id: 168
  category: sharing_the_road
  question: 'If an emergency vehicle with activated lights and sirens is approaching
    you from behind while you are in the middle of an intersection, you should:'
  choices:
    A: Stop immediately in the intersection
    B: Turn left to get out of the way
    C: Proceed through the intersection and then pull to the right and stop
    D: Back up to clear the intersection
  answer: C
  explanation: The Kentucky Driver's Manual instructs drivers never to stop in an
    intersection. If an emergency vehicle approaches, finish crossing the intersection
    and then pull over to the right.
- id: 169
  category: sharing_the_road
  question: 'When passing a horse-drawn vehicle in Kentucky, a driver should:'
  choices:
    A: Honk the horn to alert the driver
    B: Speed up to pass as quickly as possible
    C: Slow down and pass with caution, avoiding loud noises
    D: Turn on high-beam headlights to see the vehicle better
  answer: C
  explanation: When sharing the road with horse-drawn vehicles, drivers should slow
    down, provide plenty of room, and avoid sudden movements or loud noises like honking,
    which could spook the horse.
- id: 170
  category: sharing_the_road
  question: 'In Kentucky, pedestrians must use a sidewalk when one is provided. If
    no sidewalk is available, they should walk:'
  choices:
    A: On the right side of the road with the flow of traffic
    B: On the left side of the road facing oncoming traffic
    C: In the middle of the road where they are most visible
    D: Only during daylight hours
  answer: B
  explanation: The Kentucky Driver's Manual states that if there is no sidewalk, pedestrians
    should walk on the left side of the road, facing traffic, to better see and react
    to approaching vehicles.
- id: 171
  category: vehicle_information
  question: According to the Kentucky Driver's Manual, you must use your headlights
    from sunset to sunrise and at any other time when you cannot see clearly for at
    least how many feet ahead?
  choices:
    A: 300 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Kentucky law requires headlights to be on from sunset to sunrise, or
    whenever weather conditions or lack of light make it impossible to see at least
    500 feet ahead.
- id: 172
  category: vehicle_information
  question: Under Kentucky law, what is the minimum legal tread depth for tires on
    a passenger vehicle?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe and illegal in Kentucky if the tread is
    cut, damaged, or worn to a depth of less than 2/32 of an inch.
- id: 173
  category: vehicle_information
  question: 'Kentucky law requires that the light illuminating the rear registration
    plate (license plate) must make the plate legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 150 feet
  answer: B
  explanation: Every motor vehicle in Kentucky must have a white light that illuminates
    the rear license plate so that it can be clearly read from a distance of 50 feet.
- id: 174
  category: vehicle_information
  question: 'For a vehicle to be legally operated in Kentucky, the horn must be capable
    of emitting sound audible under normal conditions from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Kentucky Revised Statutes require every motor vehicle to be equipped
    with a horn in good working order capable of emitting sound audible from a distance
    of not less than 200 feet.
- id: 175
  category: vehicle_information
  question: What is the maximum legal percentage of light blockage (tint) allowed
    on the front side windows of a vehicle in Kentucky?
  choices:
    A: 25% light blockage
    B: 35% light blockage
    C: 50% light blockage
    D: 65% light blockage
  answer: B
  explanation: Kentucky law (KRS 189.110) specifies that front side windows must allow
    at least 35% of light to pass through (meaning no more than 65% blockage, though
    the rule is often phrased as '35% tint' in common parlance referring to the transmission).
- id: 176
  category: vehicle_information
  question: In Kentucky, if a load extends more than how many feet beyond the rear
    of the bed or body of a vehicle, a red flag or red light must be displayed at
    the end of the load?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: Kentucky law requires a red flag (day) or red light (night) to be attached
    to the extreme rear of any load that extends more than four feet beyond the rear
    of the vehicle.
- id: 177
  category: vehicle_information
  question: Every motor vehicle in Kentucky must be equipped with a mirror so located
    as to reflect to the driver a view of the highway for a distance of at least how
    many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Kentucky law requires vehicles to have a mirror that provides a view
    of the road for at least 200 feet behind the vehicle.
- id: 178
  category: vehicle_information
  question: Under Kentucky's mandatory insurance law, what is the minimum amount of
    'property damage' liability coverage required per accident?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Kentucky's minimum liability insurance requirements are $25,000 for
    bodily injury per person, $50,000 for bodily injury per accident, and $25,000
    for property damage.
- id: 179
  category: vehicle_information
  question: Kentucky law requires that children who are under what age AND between
    40 and 57 inches tall must be secured in a booster seat?
  choices:
    A: Under 6 years old
    B: Under 7 years old
    C: Under 8 years old
    D: Under 10 years old
  answer: C
  explanation: According to Kentucky law, any child who is under 8 years of age and
    who is between 40 and 57 inches tall must be properly secured in a child booster
    seat.
- id: 180
  category: vehicle_information
  question: In Kentucky, a vehicle's brake lights must be red and must be visible
    from a distance of at least how many feet in normal sunlight?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Kentucky vehicle equipment standards require brake lights to be visible
    from a distance of 500 feet during the day.
- id: 181
  category: vehicle_information
  question: Regarding steering, a vehicle in Kentucky is considered unsafe if there
    is more than how much 'play' (free turn) in a steering wheel with a diameter of
    18 inches or less?
  choices:
    A: 1 inch
    B: 2 inches
    C: 3 inches
    D: 4 inches
  answer: B
  explanation: The Kentucky Driver's Manual states that steering is unsafe if there
    is more than two inches of 'play' in the steering wheel.
- id: 182
  category: vehicle_information
  question: In Kentucky, the back side windows and the rear window of a passenger
    car may be tinted to allow a minimum of what percentage of light transmission?
  choices:
    A: 18%
    B: 25%
    C: 35%
    D: 50%
  answer: A
  explanation: While front side windows must allow 35% light transmission, Kentucky
    law allows the back side windows and rear window to be darker, requiring only
    18% light transmission.
- id: 183
  category: vehicle_information
  question: In Kentucky, turn signals must be used to indicate an intention to turn
    for at least how many feet before the turn is made?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Kentucky law requires drivers to signal their intention to turn at
    least 100 feet before reaching the point of turning.
- id: 184
  category: vehicle_information
  question: 'According to the Kentucky Driver''s Manual, headlights must be used when
    visibility is limited to less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 700 feet
    D: 1,000 feet
  answer: B
  explanation: Kentucky law requires the use of headlights when there is not sufficient
    light to clearly see persons or vehicles 500 feet ahead.
- id: 185
  category: vehicle_information
  question: What is the minimum legal tire tread depth for passenger vehicles in Kentucky?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe and do not meet Kentucky legal standards
    if they are worn to a point where less than 2/32 of an inch of tread remains.
- id: 186
  category: vehicle_information
  question: Under Kentucky law, every motor vehicle's service (foot) brake must be
    capable of stopping the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 45 feet
  answer: C
  explanation: The Kentucky Driver's Manual states that the service brake must be
    able to stop the vehicle within 30 feet at a speed of 20 mph.
- id: 187
  category: vehicle_information
  question: Kentucky law requires all motor vehicles to have a rearview mirror that
    provides a view of the highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Every motor vehicle must be equipped with a mirror so located as to
    reflect to the driver a view of the highway for a distance of at least 200 feet
    to the rear.
- id: 188
  category: vehicle_information
  question: 'According to Kentucky equipment regulations, the rear registration plate
    must be illuminated so that it is legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Kentucky law requires a white light to illuminate the rear license
    plate so that it is clearly legible from a distance of 50 feet to the rear.
- id: 189
  category: vehicle_information
  question: Under Kentucky law (KRS 189.110), what is the maximum allowable tint darkness
    for the front side windows (to the immediate left and right of the driver)?
  choices:
    A: 25% light transmission
    B: 35% light transmission
    C: 50% light transmission
    D: 70% light transmission
  answer: B
  explanation: Kentucky law requires that front side windows allow at least 35% of
    light to pass through (plus or minus 3% tolerance).
- id: 190
  category: vehicle_information
  question: For passenger cars in Kentucky, what is the maximum allowable tint darkness
    for the rear side windows and the back window?
  choices:
    A: 8% light transmission
    B: 18% light transmission
    C: 35% light transmission
    D: 50% light transmission
  answer: B
  explanation: Kentucky law specifies that for passenger cars, the rear side windows
    and the back window must allow at least 18% of light to pass through.
- id: 191
  category: vehicle_information
  question: 'In Kentucky, a ''Slow Moving Vehicle'' emblem must be displayed on the
    rear of any vehicle that is designed to operate at speeds of:'
  choices:
    A: 15 mph or less
    B: 20 mph or less
    C: 25 mph or less
    D: 35 mph or less
  answer: C
  explanation: The triangular slow-moving vehicle emblem is required for vehicles
    designed to travel at speeds of 25 miles per hour or less.
- id: 192
  category: vehicle_information
  question: Kentucky law requires that every motor vehicle be equipped with at least
    how many red tail lamps mounted on the rear?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Kentucky law requires motor vehicles to have at least two red tail
    lamps (one on each side) visible from a distance of 500 feet to the rear.
- id: 193
  category: vehicle_information
  question: What is the Kentucky requirement regarding a vehicle's exhaust system?
  choices:
    A: It must have a bypass or cutout
    B: It must be equipped with a muffler in good working order to prevent excessive
      noise
    C: It must be modified to increase engine sound
    D: It only needs to be functional during the winter months
  answer: B
  explanation: KRS 189.140 requires every motor vehicle to be equipped with a muffler
    in good working order and in constant operation to prevent excessive or unusual
    noise and annoying smoke.
- id: 194
  category: vehicle_information
  question: 'In Kentucky, turn signals must be visible from a distance of not less
    than:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Kentucky equipment standards require that turn signals be visible for
    a distance of at least 100 feet to both the front and the rear.
- id: 195
  category: vehicle_information
  question: Which of the following is a requirement for windshields on vehicles operated
    in Kentucky?
  choices:
    A: They must be made of safety glass
    B: They can have cracks up to 12 inches long
    C: They are not required if the driver wears goggles
    D: They must be tinted to at least 50% darkness
  answer: A
  explanation: Kentucky law requires all motor vehicles to be equipped with a windshield
    made of safety glass, and it must be clear of any obstructions that hamper the
    driver's view.
- id: 196
  category: signs_and_signals
  question: In Kentucky, when are you permitted to turn left on a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: Only when turning from a two-way street onto a one-way street
    D: Whenever there is no oncoming traffic
  answer: B
  explanation: According to the Kentucky Driver Manual, you may turn left on red only
    when turning from a one-way street onto another one-way street, after coming to
    a complete stop and yielding to traffic and pedestrians.
- id: 197
  category: signs_and_signals
  question: What does a flashing yellow arrow signal mean in Kentucky?
  choices:
    A: Stop and wait for a green light
    B: The signal is about to turn red; clear the intersection
    C: Turns are permitted, but you must first yield to oncoming traffic and pedestrians
    D: You have a protected turn; oncoming traffic is stopped
  answer: C
  explanation: A flashing yellow arrow means left turns are permitted, but they are
    'unprotected,' meaning you must yield to oncoming traffic and pedestrians before
    completing the turn.
- id: 198
  category: signs_and_signals
  question: 'To signal a right turn using hand signals, a Kentucky driver should:'
  choices:
    A: Extend the left arm straight out the window
    B: Extend the left arm out and point it upward
    C: Extend the left arm out and point it downward
    D: Extend the right arm out the passenger window
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at the elbow.
- id: 199
  category: signs_and_signals
  question: What is the meaning of a solid white line painted on the right edge of
    the roadway?
  choices:
    A: It marks the edge of the travel lane and should not be crossed except in emergencies
    B: It indicates a lane where parking is permitted
    C: It marks the beginning of a school zone
    D: It indicates that passing is allowed on the right
  answer: A
  explanation: Solid white lines along the edge of the pavement (fog lines) serve
    as a guide to help drivers stay on the road, especially at night or in bad weather.
- id: 200
  category: signs_and_signals
  question: 'When approaching an intersection with a flashing red light in Kentucky,
    you must:'
  choices:
    A: Slow down and proceed with caution
    B: Stop only if there is cross traffic
    C: Stop completely and yield the right-of-way as you would at a stop sign
    D: Treat it like a yellow light and speed up to clear the intersection
  answer: C
  explanation: A flashing red light means the same as a stop sign. You must come to
    a complete stop and yield to traffic and pedestrians before proceeding.
- id: 201
  category: signs_and_signals
  question: What is the specific shape of a 'Yield' sign used on Kentucky roadways?
  choices:
    A: Octagon
    B: Diamond
    C: Equilateral triangle pointing down
    D: Pennant
  answer: C
  explanation: A yield sign is an equilateral triangle with the point facing downward,
    typically red and white.
- id: 202
  category: signs_and_signals
  question: In Kentucky, what does a fluorescent pink traffic sign indicate?
  choices:
    A: School zone
    B: Public recreation or cultural interest
    C: Incident management (accidents or emergency scenes)
    D: Construction or maintenance
  answer: C
  explanation: Fluorescent pink signs are used for incident management to warn drivers
    of temporary emergencies like accidents or floods.
- id: 203
  category: signs_and_signals
  question: What do double solid white lines painted between travel lanes indicate?
  choices:
    A: You may cross them to change lanes at any time
    B: They separate traffic moving in opposite directions
    C: Crossing the lines is prohibited
    D: They indicate a shared turn lane
  answer: C
  explanation: Double solid white lines indicate that lane changes are prohibited
    between those lanes.
- id: 204
  category: signs_and_signals
  question: 'A pennant-shaped sign found on the left side of a two-lane road indicates:'
  choices:
    A: A school zone ahead
    B: A no-passing zone
    C: A railroad crossing
    D: A sharp curve to the left
  answer: B
  explanation: A pennant-shaped sign is placed on the left side of the road to mark
    the beginning of a no-passing zone.
- id: 205
  category: signs_and_signals
  question: In Kentucky, what is the purpose of a lane marked with both a solid yellow
    line and a broken yellow line on each side?
  choices:
    A: It is a high-occupancy vehicle (HOV) lane
    B: It is a shared left-turn lane for vehicles in both directions
    C: It is a lane reserved for emergency vehicles only
    D: It is a passing lane for uphill traffic
  answer: B
  explanation: These markings define a shared left-turn lane, which is used by vehicles
    traveling in either direction to make left turns.
- id: 206
  category: signs_and_signals
  question: 'To signal that you are slowing down or stopping using hand signals, you
    should:'
  choices:
    A: Extend the left arm straight out
    B: Extend the left arm upward
    C: Extend the left arm downward with the palm facing backward
    D: Wave your hand out the window
  answer: C
  explanation: The hand signal for slowing or stopping is the left arm extended out
    and bent downward at the elbow.
- id: 207
  category: signs_and_signals
  question: What is the meaning of a 'Wrong Way' sign in Kentucky?
  choices:
    A: You are approaching a one-way street from the correct direction
    B: You are driving against the flow of traffic
    C: The road ahead is closed for construction
    D: You must make a U-turn immediately
  answer: B
  explanation: A 'Wrong Way' sign indicates you are traveling in the opposite direction
    of traffic. You should stop and pull over immediately, then turn around when safe.
- id: 208
  category: signs_and_signals
  question: In Kentucky, what is the specific shape of a 'No Passing Zone' sign found
    on the left side of the road?
  choices:
    A: Diamond
    B: Rectangle
    C: Pennant
    D: Round
  answer: C
  explanation: According to the Kentucky Driver Manual, a pennant-shaped sign is placed
    on the left side of the road to indicate the beginning of a no-passing zone.
- id: 209
  category: signs_and_signals
  question: When you see a flashing yellow light at an intersection in Kentucky, what
    should you do?
  choices:
    A: Stop completely and wait for the light to turn green.
    B: Slow down and proceed with caution.
    C: Speed up to clear the intersection quickly.
    D: Treat it like a four-way stop.
  answer: B
  explanation: A flashing yellow light means you should slow down and proceed with
    caution, as outlined in the Kentucky Driver Manual.
- id: 210
  category: signs_and_signals
  question: In Kentucky, under what specific condition may you turn left on a red
    light?
  choices:
    A: You may never turn left on a red light.
    B: When turning from a two-way street onto a one-way street.
    C: When turning from a one-way street onto another one-way street.
    D: Only if there is no traffic coming from the right.
  answer: C
  explanation: Kentucky law allows a left turn on red only when turning from a one-way
    street onto another one-way street, after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 211
  category: signs_and_signals
  question: According to the Kentucky Driver Manual, what does a solid yellow line
    on your side of the center dash line mean?
  choices:
    A: You may pass if it is safe to do so.
    B: You are in a no-passing zone.
    C: The road ahead is under construction.
    D: You must turn right at the next intersection.
  answer: B
  explanation: A solid yellow line on your side of the center line indicates a no-passing
    zone where it is illegal and unsafe to pass other vehicles.
- id: 212
  category: signs_and_signals
  question: 'The ''Slow Moving Vehicle'' emblem, a triangular orange sign with a red
    border, must be displayed on vehicles that travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: In Kentucky, the slow-moving vehicle emblem is required for vehicles
    designed to operate at speeds of 25 miles per hour or less.
- id: 213
  category: signs_and_signals
  question: If your vehicle's turn signals are not working, what is the Kentucky hand
    signal for a right turn?
  choices:
    A: Arm extended straight out the window.
    B: Arm extended upward at a 90-degree angle.
    C: Arm extended downward at a 90-degree angle.
    D: Waving the arm in a circular motion.
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at the elbow.
- id: 214
  category: signs_and_signals
  question: In Kentucky, what do broken white lines painted on the pavement indicate?
  choices:
    A: Traffic moving in opposite directions.
    B: The edge of the roadway.
    C: Traffic moving in the same direction.
    D: A pedestrian crosswalk.
  answer: C
  explanation: Broken white lines separate lanes of traffic moving in the same direction
    and indicate that lane changes are permitted when safe.
- id: 215
  category: signs_and_signals
  question: What does a flashing red light at an intersection mean in Kentucky?
  choices:
    A: Slow down and proceed if the way is clear.
    B: Stop and wait for the light to turn green.
    C: Stop completely and proceed only when it is safe to do so.
    D: The signal is broken; treat it as an uncontrolled intersection.
  answer: C
  explanation: A flashing red light has the same meaning as a stop sign. You must
    come to a complete stop and may proceed only when it is safe and you have yielded
    to other traffic.
- id: 216
  category: signs_and_signals
  question: What is the Kentucky hand signal for stopping or decreasing speed?
  choices:
    A: Arm extended straight out.
    B: Arm extended upward.
    C: Arm extended downward.
    D: Arm moved in a back-and-forth motion.
  answer: C
  explanation: To signal that you are stopping or slowing down, extend your left arm
    out the window and point it downward.
- id: 217
  category: signs_and_signals
  question: A 'Yield' sign in Kentucky is what shape and color?
  choices:
    A: A red and white equilateral triangle pointing down.
    B: A yellow and black circle.
    C: A red octagon.
    D: A white rectangle.
  answer: A
  explanation: A yield sign is a downward-pointing triangle, usually red and white
    (though some older versions may be yellow and black).
- id: 218
  category: signs_and_signals
  question: When you see a 'Road Construction Ahead' sign in Kentucky, what color
    is it likely to be?
  choices:
    A: Yellow
    B: Green
    C: Orange
    D: Brown
  answer: C
  explanation: Orange is the standard color for highway construction and maintenance
    signs in Kentucky and across the US.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 219
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
