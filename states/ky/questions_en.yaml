  question: If you are involved in an accident in Kentucky, what information are you
    legally required to exchange with the other driver?
  choices:
    A: Name and address only
    B: Name, address, and vehicle registration number
    C: Name, address, vehicle registration, and insurance information
    D: No information is required if there are no injuries
  answer: C
  explanation: Kentucky law requires drivers involved in a collision to exchange names,
    addresses, registration numbers, and proof of insurance.
- id: 63
  category: driver_responsibility
  question: What is the penalty for a first-time conviction of operating a motor vehicle
    in Kentucky without the required liability insurance?
  choices:
    A: A fine of $100 to $250
    B: A fine of $500 to $1,000 and/or up to 90 days in jail
    C: Permanent revocation of the driver's license
    D: A mandatory 5-year prison sentence
  answer: B
  explanation: A first offense for driving without insurance in Kentucky carries a
    fine of $500 to $1,000 and/or up to 90 days in jail, plus license and registration
    suspension.
- id: 64
  category: driver_responsibility
  question: In Kentucky, how many points are assessed for 'Failure to yield' the right-of-way?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
