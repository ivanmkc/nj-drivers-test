    If a law enforcement officer does not file a report, the operators must file a
    CR-88 report within 10 days.
- id: 66
  category: driver_responsibility
  question: 'Kentucky''s mandatory ''No-Fault'' insurance law requires every owner
    of a motor vehicle to carry Personal Injury Protection (PIP) coverage in the minimum
    amount of:'
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: B
  explanation: Kentucky is a 'No-Fault' state. Motor vehicle owners are required to
    carry a minimum of $10,000 in Personal Injury Protection (PIP) coverage to pay
    for medical expenses and lost wages regardless of who is at fault.
- id: 67
  category: driver_responsibility
  question: What are the minimum liability insurance coverage limits required for
    a single person's bodily injury in the state of Kentucky?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Kentucky law requires minimum liability coverage of $25,000 for bodily
    injury to one person, $50,000 for bodily injury to all persons in one accident,
    and $25,000 for property damage (25/50/25).
- id: 68
  category: driver_responsibility
  question: When you purchase a vehicle in Kentucky, you must provide proof of insurance
    and have the vehicle registered in your name within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: Kentucky law requires that when a vehicle is purchased or transferred,
    the new owner must register the vehicle and provide proof of insurance within
    15 days.
- id: 69
  category: driver_responsibility
  question: In Kentucky, what is the maximum fine for a first-offense conviction of
    littering from a motor vehicle?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Littering is illegal in Kentucky. A person found guilty of littering
    from a vehicle can be fined up to $500 and/or spend up to a year in jail.
- id: 70
  category: driver_responsibility
  question: 'For drivers age 21 or older, a first-offense DUI conviction in Kentucky
    can result in a jail sentence of:'
  choices:
    A: 24 hours to 7 days
    B: 48 hours to 30 days
    C: 10 days to 6 months
    D: 30 days to 1 year
  answer: B
  explanation: For a first DUI offense in Kentucky (age 21+), the potential jail time
    ranges from 48 hours to 30 days.
- id: 71
  category: driver_responsibility
  question: In Kentucky, which of the following is considered an 'aggravating circumstance'
    that can double the mandatory minimum jail time for a DUI conviction?
  choices:
    A: Driving with a passenger under age 12
    B: Driving 15 mph over the speed limit
    C: Refusing a blood test if it is your first offense
    D: Driving with a BAC of 0.10%
  answer: A
  explanation: 'Aggravating circumstances in Kentucky include: BAC of 0.15% or more,
    driving the wrong way on a limited-access highway, causing an accident resulting
    in death or serious injury, or driving with a passenger under age 12.'
- id: 72
  category: driver_responsibility
  question: How many points are assessed against a Kentucky driver for failing to
    yield the right-of-way to an emergency vehicle?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: Failing to yield the right-of-way to an emergency vehicle is a 4-point
    violation in the Kentucky point system.
- id: 73
  category: driver_responsibility
  question: If you are a Kentucky resident and purchase a vehicle from out-of-state,
    you must have the vehicle inspected by whom before it can be registered?
  choices:
    A: A certified private mechanic
    B: The Kentucky State Police
    C: The County Sheriff
    D: The Department of Transportation
  answer: C
  explanation: In Kentucky, any vehicle brought into the state from another jurisdiction
    must be inspected by the County Sheriff in the county where the vehicle will be
    registered.
- id: 74
  category: driver_responsibility
  question: Under Kentucky law, how many points are assessed for 'Following too closely'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Following too closely (tailgating) is a 3-point violation under the
    Kentucky point system.
- id: 75
  category: driver_responsibility
  question: In Kentucky, if you are convicted of 'Improper Passing,' how many points
    will be added to your driving record?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: A
  explanation: Improper passing is categorized as a 3-point violation in Kentucky.
- id: 76
  category: driver_responsibility
  question: Which of the following is a legal requirement regarding your Kentucky
    insurance card?
  choices:
    A: It must be kept at your primary residence
    B: It must be kept in the vehicle at all times
    C: It must be filed with the County Clerk annually
    D: It is only required when renewing your license
  answer: B
  explanation: Kentucky law requires that proof of insurance (the insurance card)
    must be kept in the vehicle at all times while it is being operated.
- id: 77
  category: driver_responsibility
  question: In Kentucky, a conviction for 'Failure to stop for a school bus' (first
