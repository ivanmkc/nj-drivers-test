- id: 56
  category: vehicle_information
  question: ハンドブックの目次によると、「財政的責任、保険の要件、および衝突事故」について記載されているのはどのセクションですか？
  choices:
    A: セクション7
    B: セクション8
    C: セクション9
    D: セクション10
  answer: D
  explanation: 提供された目次には、「セクション10：財政的責任、保険の要件、および衝突事故」と記載されています。
- id: 57
  category: safe_driving_rules
  question: 歩行者用信号のない横断歩道では、誰に優先権がありますか？
  choices:
    A: 制限速度で走行している場合は、車両。
    B: 横断歩道では常に歩行者に優先権がある。
    C: 歩行者が標示のある横断歩道にいない場合は、車両。
    D: 歩行者。ただし、運転手とアイコンタクトを取った場合のみ。
  answer: B
  explanation: 標示の有無にかかわらず、横断歩道では歩行者に優先権があります。運転手は道を譲り、歩行者の安全を確保するために必要に応じて減速または停止しなければなりません。
- id: 58
  category: defensive_driving
  question: 車間距離の詰めすぎを避けるため、通常の状況下では前の車との間にどのくらいの距離を空けるべきですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: B
  explanation: 車間距離の詰めすぎを避けるため、カリフォルニア州運転手ハンドブックでは「3秒ルール」の使用を推奨しています。前の車がある地点を通過したときから3秒数えることで、安全な車間距離を確保します。
- id: 59
  category: vehicle_information
  question: 日没から___後にはヘッドライトを点灯し、日の出の___前まで点灯したままにしなければなりません。
  choices:
    A: 30分；30分
    B: 1時間；1時間
    C: 15分；15分
    D: 直後；直前
  answer: A
  explanation: カリフォルニア州法では、日没の30分後にヘッドライトを点灯し、日の出の30分前まで点灯したままにすることが義務付けられています。
- id: 60
  category: defensive_driving
  question: 車線変更をする前に死角を確認する最も良い方法は何ですか？
  choices:
    A: バックミラーを見る。
    B: サイドミラーを見る。
    C: 首を回して肩越しに目視する。
    D: クラクションを鳴らして他の運転手に警告する。
  answer: C
  explanation: 死角を確認するには、移動しようとする方向に首を回し、肩越しに目視して、ミラーに映らない車両を確認しなければなりません。
- id: 61
  category: penalties_and_points
  question: 職務中の警察官から逃走し、人身傷害を伴わない有罪判決を受けた場合、次のどの罰則を受ける可能性がありますか？
  choices:
    A: 郡刑務所で最長1年の拘禁。
    B: 警告および罰金。
    C: 義務的な社会奉仕活動。
    D: 免許の永久取消し。
  answer: A
  explanation: 追跡を引き起こし、警察官から逃走して有罪判決を受けた者は、1年以下の郡刑務所での拘禁によって罰せられます。
- id: 62
  category: signs_and_signals
  question: 赤と白の3角形の標識は、次の何をしなければならないことを示していますか？
  choices:
    A: 交差点に入る前に完全に停止する。
    B: 他の車両や歩行者に通行権（優先権）を譲る。
    C: 速度を維持して合流する。
    D: 他の車両が見えない場合は標識を無視する。
  answer: B
  explanation: 3角形の赤い「YIELD（ゆずれ）」の標識は、減速し、必要に応じて停止する準備をして、他の車両、自転車、または歩行者を先に通過させてから進まなければならないことを示しています。
- id: 63
  category: sharing_the_road
  question: 走行車線で自転車を追い越す際、自転車のための十分な幅を確保し、最低限どれだけの安全間隔を保たなければなりませんか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 4フィート
  answer: C
  explanation: カリフォルニア州法では、自転車の安全を確保するため、追い越す際には少なくとも3フィートの距離を空けることが運転者に義務付けられています。
- id: 64
  category: safe_driving_rules
  question: 次のどの状況でUターンをすることが合法ですか？
  choices:
    A: 分離帯、縁石、または地帯を横切っての中央分離帯のある幹線道路（ディバイデッド・ハイウェイ）でのUターン。
    B: 安全かつ合法である場合の、二重の黄色い線を越えてのUターン。
    C: 踏切でのUターン。
    D: 一方通行の道路でのUターン。
  answer: B
  explanation: 安全かつ合法である場合、二重の黄色い線を越えてUターンすることができます。一方通行の道路、踏切、または中央分離帯のある幹線道路のバリアを越えてUターンすることは違法です。
- id: 65
  category: alcohol_drugs_health
  question: 21歳未満の場合、カリフォルニア州の「ゼロ・トレランス（不寛容）」法により、血中アルコール濃度（BAC）がどれくらいで運転することが違法とされていますか？
  choices:
    A: 0.01%以上
    B: 0.04%以上
    C: 0.05%以上
    D: 0.08%以上
  answer: A
  explanation: カリフォルニア州のゼロ・トレランス法により、21歳未満の人が血中アルコール濃度（BAC）0.01%以上で運転することは違法とされています。
- id: 66
  category: driver_responsibility
  question: 負傷者または死者が出る衝突事故に関与した場合、何日以内にDMV（車両管理局）に報告しなければなりませんか？
  choices:
    A: 24時間以内
    B: 5日以内
    C: 10日以内
    D: 30日以内
  answer: C
  explanation: 負傷者や死者が出た場合、または物的損害が1,000ドルを超える場合、あなた（またはあなたの保険代理店、ブローカー、法定代理人）は10日以内にDMVに衝突事故を報告しなければなりません。
- image: stop.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。交通状況や歩行者を確認してから進んでください。
  id: 67
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何を求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通に合流する
    C: 減速し、他の車両や歩行者に通行権（優先権）を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の3角形の「YIELD（ゆずれ）」の標識は、減速し、他の車両や歩行者に通行権（優先権）を譲らなければならないことを意味します。他の人が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 68
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」の標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、進入すると対向車と正面衝突する危険がある高速道路の出口ランプや一方通行の道路で見られます。
  id: 69
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見たら、どうするべきですか？
  choices:
    A: Uターンする
    B: 注意して運転を続ける
    C: 停止して後退するか、方向転換する（逆走しているため）
    D: 加速してそのエリアから素早く抜け出す
  answer: C
  explanation: 赤と白の「WRONG WAY（逆走）」の標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に方向転換するか後退してください。
  id: 70
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方向（左方向）にのみ流れる
    C: 中央分離帯の左側を通行する
    D: 高速道路の出口が左側にある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、この道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 71
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 他の車両の追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、この場所でのUターン（転回）が禁止されていることを意味します。
  id: 72
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行動は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、この交差点での左折が許可されていないことを意味します。
  id: 73
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、この場所での右折が禁止されていることを意味します。
  id: 74
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道路が狭くなる
    B: この区間では他の車両を追い越してはならない
    C: この先、対面通行
    D: 右側を通行する
  answer: B
  explanation: 白黒のペナント型（三角旗型）の「NO PASSING ZONE（追い越し禁止区間）」標識は、このエリアで他の車両を追い越すことが許可されていないことを意味します。これは追い越し禁止区間の始まりを示しています。
  id: 75
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転手に何を指示していますか？
  choices:
    A: 右に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線が減少する
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 76
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形状と色から判断して、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事用標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 77
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先、動物園またはアニマルパークがある
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟エリアがある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。特に夜明けや夕暮れ時は、速度を落として動物に注意してください。
  id: 78
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、スクールゾーン（学校区）がある
    B: この先、横断歩道がある
    C: 近くにハイキングコースがある
    D: この先、バス停がある
  answer: B
  explanation: 歩行者の図が描かれた黄色いひし形の標識は、この先に横断歩道があることを警告しています。道路を横断する歩行者のために停止する準備をしてください。
  id: 79
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形状は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーン（学校区）または学校横断歩道
    D: 病院区間
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーン（学校区）または学校横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 80
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い丸型の標識は、何を警告していますか？
  choices:
    A: この先にラウンドアバウト（環状交差点）あり
    B: 病院の区域
    C: この先に踏切あり
    D: 追い越し禁止区域
  answer: C
  explanation: 黒い「X」と2つの「R」が描かれた黄色い丸型の標識は、この先に踏切があることを示す事前警告標識です。減速し、列車の接近を目と耳で確認してください。
  id: 81
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常、どこで見かけますか？
  choices:
    A: 学校の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型の踏切標識（クロスバック）は、踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は、一時停止しなければなりません。
  id: 82
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先行き止まり
    B: 右折必須
    C: この先右カーブあり
    D: この先迂回路あり
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先にカーブがあることを警告しています。カーブに入る前に減速してください。
  id: 83
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識は通常のカーブの標識とどう違いますか？
  choices:
    A: より緩やかな曲がり角であることを示している
    B: より大幅な減速が必要な急カーブを警告している
    C: 右折専用を意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に減速する必要があります。
  id: 84
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道路
    B: この先単一のカーブあり
    C: 反対方向の2つの連続するカーブ
    D: この先にラウンドアバウト（環状交差点）あり
  answer: C
  explanation: リバースカーブ（S字カーブ）の標識は、この先に反対方向の2つのカーブがあることを警告しています。減速し、道路が一方に曲がった後、もう一方に曲がることに備えてください。
  id: 85
- image: winding_road.png
  category: signs_and_signals
  question: この標識はどのような状況を警告していますか？
  choices:
    A: 単一の急カーブ
    B: 滑りやすい路面
    C: この先連続するカーブや曲がり角あり
    D: この先上り坂あり
  answer: C
  explanation: つづら折りの標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 86
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう指示していますか？
  choices:
    A: 車線の減少
    B: 別の道路からの車両の合流
    C: 中央分離帯のある道路の始まり
    D: 1車線への幅員減少
  answer: B
  explanation: 黄色いひし形の合流標識は、別の道路からの車両があなたの車線に合流してくることを警告しています。速度と位置を調整する準備をしてください。
  id: 87
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先橋あり
    B: この先幅員減少
    C: 車線減少
    D: 中央分離帯のある道路の終わり
  answer: B
  explanation: この警告標識は、この先の道路が狭くなることを示しています。道幅が狭くなることに備え、車線内の位置を調整してください。
  id: 88
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 道路の終わり
    B: 対面通行
    C: 中央分離帯のある道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や防護柵で対向車線と区切られた分離道路（Divided highway）になることを警告しています。右側を通行してください。
  id: 89
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある道路の始まり
    B: 中央分離帯のある道路が終わり、対面通行に戻る
    C: この先合流エリアあり
    D: この先道路工事あり
  answer: B
  explanation: この標識は、中央分離帯のある道路（分離道路）が終わることを警告しています。対向車線との間を区切る中央分離帯がなくなります。対面通行に備えてください。
  id: 90
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある幹線道路の始まり
    B: この先、追い越し可能区間
    C: この先、対面通行 — 車両が双方向に通行します
    D: この先、車線変更（シフト）あり
  answer: C
  explanation: この標識は、この先が対面通行であることを警告しています。一方通行の道路や中央分離帯のある幹線道路が終わり、対向車とすれ違うことになります。
  id: 91
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状況を警告していますか？
  choices:
    A: 凍結した路面状況
    B: 濡れていると滑りやすい道路
    C: この先、連続カーブ
    D: 凹凸のある舗装
  answer: B
  explanation: 「濡れていると滑りやすい（Slippery when wet）」の標識は、雨天時や路面が濡れている状態では非常に滑りやすくなることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 92
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 道路の段差（バンプ）
    B: 凹凸のある路面
    C: この先、急な坂道または勾配
    D: 道路工事
  answer: C
  explanation: この標識は、この先に急な坂道や勾配があることを警告しています。特にトラックや牽引中の場合は、速度を調整し、低速ギアにシフトダウンする必要があるかもしれません。
  id: 93
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先、一時停止標識
    B: この先、信号機
    C: 横断歩道（スクールゾーン）
    D: 警察の検問所
  answer: B
  explanation: この標識は、この先に信号機があることを警告しています。信号が赤や黄色の場合は停止できるように準備してください。この標識は、遠くから信号機が見えにくい場所によく設置されます。
  id: 94
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識は、この先に何があることを示していますか？
  choices:
    A: ゆずりあえ（Yield）の標識
    B: 信号機
    C: 必ず停止しなければならない一時停止標識
    D: スピードバンプ（減速帯）
  answer: C
  explanation: この標識は、この先に一時停止標識があることを警告しています。減速を始め、一時停止標識で完全に停止する準備をしてください。
  id: 95
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、踏切
    B: この先、十字路または交差点
    C: この先、病院
    D: 横断歩道
  answer: B
  explanation: この標識は、この先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 96
- image: side_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、T字路
    B: 右側から合流する脇道
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は、右側から合流する脇道があることを警告しています。脇道から幹線道路に進入してくる車両に注意してください。
  id: 97
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流する
    B: 車線が減少する
    C: 新しい車線が追加される — 合流の必要なし
    D: 右折必須
  answer: C
  explanation: 「車線追加（Added lane）」の標識は、合流を必要とせずに新しい車線が幹線道路に加わることを意味します。ランプから進入する車両には専用の新しい車線があります。
  id: 98
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 終日停車禁止
    B: このエリアでの駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」の標識は、このエリアに車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは許可されています。
  id: 99
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識があるスペースには誰が駐車できますか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用プラカードまたはナンバープレートを掲示している車両のみ
    D: 障害のある同乗者がいるすべての運転手
  answer: C
  explanation: 車椅子のマークが描かれた青い標識は、障害者専用の駐車スペースを示しています。有効な障害者用駐車プラカードまたはナンバープレートを掲示している車両のみが、これらのスペースに駐車できます。違反すると高額な罰金が科せられます。
  id: 100
