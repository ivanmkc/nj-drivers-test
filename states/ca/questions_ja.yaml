  explanation: 長官のメッセージでは、「ハンドルを握る時は携帯電話を置いてください。注意散漫な状態や判断力が低下した状態で、自動車、オートバイ、自転車を運転しないでください」と明確にアドバイスしています。
- id: 45
  category: license_system
