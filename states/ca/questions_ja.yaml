questions:
- id: 1
  category: safe_driving_rules
  question: 別の標識がない限り、子供がいるスクールゾーンでの制限速度はどれくらいですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: カリフォルニア州運転免許ハンドブック（California Driver's Handbook）によると、別の標識がない限り、子供が外にいるか道路を横断している状態で学校から500フィート以内を走行する場合の制限速度は25
    mphです。
- id: 2
  category: safe_driving_rules
  question: カリフォルニア州の「基本速度法（Basic Speed Law）」では、次のように定められています：
  choices:
    A: 標識で指定された制限速度を超えて運転してはならない
    B: 現在の状況において安全な速度を超えて運転してはならない
    C: 常に交通の流れに合わせて運転しなければならない
    D: 他の車両と近い速度を保たなければならない
  answer: B
  explanation: 基本速度法（Basic Speed Law）では、標識で指定された制限速度に関わらず、現在の状況において安全な速度を超えて運転してはならないと定められています。
- id: 3
  category: alcohol_drugs_health
  question: 21歳以上の人が、血中アルコール濃度（BAC）が___以上で運転することは違法です。
  choices:
    A: 0.04%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: カリフォルニア州法では、21歳以上の人が0.08%以上の血中アルコール濃度（BAC）で運転することを違法としています。
- id: 4
  category: sharing_the_road
  question: 進行方向の同じ側の道路で、赤いライトを点滅させているスクールバスが前方に停車している場合、あなたは次のようにしなければなりません：
  choices:
    A: すべての子供が降りたと思うまで停止する
    B: 赤いライトの点滅が止まるまで停止する
    C: 車線を変更し、ゆっくりと注意して追い越す
    D: 追い越す際に15 mphまで減速する
  answer: B
  explanation: 赤いライトを点滅させているスクールバスに対しては停止しなければならず、ライトの点滅が止まるまで停止したままでいなければなりません。これに違反すると、罰金および免許停止の処分を受ける可能性があります。
- id: 5
  category: sharing_the_road
  question: 緊急車両に通行権（right-of-way）を譲るには、次のようにしなければなりません：
  choices:
    A: できるだけ道路の右端に寄って停止する
    B: 右車線に移動し、ゆっくりと走行する
    C: 現在の車線で直ちに停止する
    D: 速度を上げて進路を空ける
  answer: A
  explanation: 緊急車両のサイレンが聞こえたり、赤い点滅ライトが見えたりした場合は、道路の右端に車を寄せて、緊急車両が通り過ぎるまで停止しなければなりません。
- id: 6
  category: driver_responsibility
  question: カリフォルニア州法において、運転中に手持ちの携帯電話（ハンドヘルド携帯電話）を使用できるのはどのような場合ですか？
  choices:
    A: 赤信号で停止している時
    B: 助けを呼ぶための緊急時のみ
    C: 交通の流れが15 mph未満の時
    D: 郊外の幹線道路を運転している時
  answer: B
  explanation: 運転中に手持ちの携帯電話を使用できるのは、警察、医療機関、消防署、またはその他の緊急サービスに電話をかける緊急事態の場合のみです。
- id: 7
  category: safe_driving_rules
  question: 縁石のない対面通行の道路で上り坂に駐車する場合、前輪はどのように向けるべきですか？
  choices:
    A: 左に向ける（道路側）
    B: 右に向ける（道路から遠ざける側）
    C: 道路の端と平行にする
    D: まっすぐ前を向ける
  answer: B
  explanation: 縁石のない上り坂または下り坂に駐車する場合は、ブレーキが故障した際に車両が道路の中央から離れる方向に転がるよう、車輪を右（道路の端側）に向けます。
- id: 8
  category: signs_and_signals
  question: 交差点での赤の点滅信号が意味するのは次のうちどれですか？
  choices:
    A: 進入する前に減速する
    B: 進入する前に停止し、安全を確認してから進む
    C: 停止して青信号を待つ
    D: 進入する前にすべての交通に道を譲る
  answer: B
  explanation: 赤の点滅信号は「停止（STOP）」を意味します。停止した後、通行権（right-of-way）の規則に従い、安全であれば進むことができます。
- id: 9
  category: signs_and_signals
  question: 道路の中央にある2本の実線の黄色い線が意味するのは次のうちどれですか？
  choices:
    A: どちらの方向からも追い越しが許可されている
    B: 自分が右側にいる場合のみ追い越しが許可されている
    C: どちらの方向からも追い越しは許可されていない
    D: この先、道路が狭くなっている
  answer: C
  explanation: 2本の実線の黄色い線は追い越し禁止を示しています。他の車両を追い越すためにこれらの線を越えて運転してはいけません。
- id: 10
  category: defensive_driving
  question: 車間距離の詰めすぎ（tailgating）を防ぐため、カリフォルニア州運転免許ハンドブックでは次のどれを使用することを推奨していますか？
  choices:
    A: 2秒ルール
    B: 3秒ルール
    C: 4秒ルール
    D: 5秒ルール
  answer: B
  explanation: 車間距離の詰めすぎ（tailgating）を防ぐため、「3秒ルール」を使用して、前方の車両が急ブレーキをかけた場合に安全に停止できる十分なスペースを確保してください。
- id: 11
  category: penalties_and_points
  question: 以下の原因となる衝突事故を起こした場合、10日以内にDMVに報告しなければなりません：
  choices:
    A: 車両のいかなる損傷
    B: 500ドルを超える損傷
    C: 1,000ドルを超える損傷、または負傷者や死者が出た場合
    D: 自分の車両がレッカー移動された場合
  answer: C
  explanation: 1,000ドルを超える物的損害が発生した場合、または負傷者や死者が出た場合、あなた（またはあなたの保険代理店、ブローカー、法定代理人）は10日以内にDMVに衝突事故を報告しなければなりません。
- id: 12
  category: sharing_the_road
  question: 歩行者が横断歩道にいる場合、次のようにしなければなりません：
  choices:
    A: クラクションを鳴らして警告する
    B: 歩行者に通行権（優先権）を譲る
    C: 注意して歩行者を避けて運転する
    D: 歩行者が道路の自分と同じ側にいる場合のみ停止する
  answer: B
  explanation: 標示の有無にかかわらず、横断歩道では歩行者に通行権があります。歩行者に道を譲り、安全に横断させなければなりません。
- id: 13
  category: license_system
  question: 基本的なクラスCの運転免許証で運転できるのは次のうちどれですか：
  choices:
    A: 車両総重量が6,000ポンド未満の3軸車両
    B: すべての商用車
    C: 2つのトレーラーを牽引する車両
    D: オートバイ
  answer: A
  explanation: クラスCの運転免許証では、車両総重量定格（GVWR）が26,000ポンド以下の2軸車両、または総重量が6,000ポンド以下の3軸車両を運転することができます。
- id: 14
  category: defensive_driving
  question: 車線変更をする際、死角を確認するには次のようにします：
  choices:
    A: ルームミラーを見る
    B: サイドミラーを見る
    C: 頭を回して肩越しに目視する
    D: バックカメラを使用する
  answer: C
  explanation: ミラーには死角は映りません。車線変更をする前に、頭を回して肩越しに目視し、車線が空いていることを確認しなければなりません。
- id: 15
  category: safe_driving_rules
  question: カリフォルニア州の「基本速度法（Basic Speed Law）」の基本原則は何ですか？
  choices:
    A: 標識で示された制限速度を超えて運転してはならない。
    B: 現在の状況において安全な速度を超えて運転してはならない。
    C: 制限速度にかかわらず、常に交通の流れに合わせて運転しなければならない。
    D: 悪天候時は、制限速度より少なくとも10 mph遅く運転しなければならない。
  answer: B
  explanation: カリフォルニア州の「基本速度法」では、標識で示された制限速度にかかわらず、現在の状況において安全な速度を超えて運転してはならないと定められています。
- id: 16
  category: alcohol_drugs_health
  question: 21歳以上の運転者の法的な血中アルコール濃度（BAC）の制限値はいくつですか？
  choices:
    A: 0.04%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: 21歳以上の人が血中アルコール濃度（BAC）0.08%以上で車両を運転することは違法です。
- id: 17
  category: safe_driving_rules
  question: 見通しの悪い交差点（blind intersection）での制限速度はいくつですか？
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: 見通しの悪い交差点での制限速度は15 mphです。交差点のどの角にも一時停止標識がなく、交差点に進入する手前100フィートの地点で左右どちらの方向も100フィート先まで見通せない場合、その交差点は「見通しが悪い（blind）」とみなされます。
- id: 18
  category: safe_driving_rules
  question: カリフォルニア州のほとんどの商業地域または住宅地域での最高制限速度はいくつですか？
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: A
  explanation: 別の標識がない限り、ほとんどの商業地域および住宅地域での最高制限速度は25 mphです。
- id: 19
  category: safe_driving_rules
  question: 縁石のある上り坂に駐車する場合、タイヤをどの方向に向けなければなりませんか？
  choices:
    A: タイヤを縁石の方向に向ける。
    B: タイヤを縁石とは反対の方向に向ける。
    C: タイヤを完全にまっすぐにする。
    D: タイヤを道路と平行にする。
  answer: B
  explanation: 縁石のある上り坂に駐車する場合は、前輪を縁石とは反対の方向に向け、前輪の後部が縁石に軽く触れるまで車両を数インチ後退させます。
- id: 20
  category: signs_and_signals
  question: 赤の点滅信号は何を意味しますか？
  choices:
    A: 減速し、他の交通に道を譲る。
    B: 停止し、安全を確認してから進む。
    C: 停止し、青信号を待つ。
    D: 信号機が故障しているため、注意して進む。
  answer: B
  explanation: 赤の点滅信号は「一時停止（STOP）」を意味します。停止後、通行権のルールに従い、安全が確認できたら進むことができます。
- id: 21
  category: signs_and_signals
  question: 2フィート以上離れた2組の黄色い実線の二重線は何を表していますか？
  choices:
    A: カープール車線（相乗り車線）。
    B: 追い越し区間。
    C: 物理的な壁（分離帯）；その上を走行したり越えたりしてはいけません。
    D: 共用の中央右左折車線。
  answer: C
  explanation: 2フィート以上離れた2組の黄色い実線の二重線は、分離帯とみなされます。この分離帯の上を走行したり越えたり、これを横切って左折やUターンをしてはいけません。
- id: 22
  category: sharing_the_road
  question: 横断歩道では誰に優先権がありますか？
  choices:
    A: 歩行者が交通規則を無視して横断（ジェイウォーク）している場合、車両に優先権がある。
    B: 標示の有無にかかわらず、横断歩道では常に歩行者に優先権がある。
    C: 横断歩道に標示がない場合、車両に優先権がある。
    D: 自転車は歩行者よりも優先権がある。
  answer: B
  explanation: 標示の有無にかかわらず、横断歩道では歩行者に優先権があります。運転者は道を譲り、歩行者の安全を確保するために必要に応じて減速または停止しなければなりません。
- id: 23
  category: defensive_driving
  question: 追突事故を防ぐため、通常の運転状況下で推奨される最小車間距離はどれくらいですか？
  choices:
    A: 1秒
    B: 2秒
    C: 3秒
    D: 5秒
  answer: C
  explanation: 煽り運転（車間距離不保持）や追突事故を防ぐため、通常の運転状況下では「3秒ルール」を用いて安全な車間距離を保つ必要があります。
- id: 24
  category: driver_responsibility
  question: 交通事故をDMV（車両管理局）に報告しなければならないのはどのような場合ですか？
  choices:
    A: 死者が出た場合のみ。
    B: 損害額が1,000ドルを超える場合、または負傷者や死者が出た場合、10日以内。
    C: 損害額が500ドルを超える場合、5日以内。
    D: 警察が報告書を作成しない場合のみ。
  answer: B
  explanation: 誰かの財産に1,000ドルを超える損害が発生した場合、または（どんなに軽傷であっても）負傷者や死者が出た場合、あなた（またはあなたの保険代理店、ブローカー、法的代理人）は10日以内にDMVに事故を報告しなければなりません。
- id: 25
  category: safe_driving_rules
  question: 車両のヘッドライトを点灯することが義務付けられているのはいつですか？
  choices:
    A: 街灯のない道路を走行している時のみ。
    B: 日没の30分後から日の出の30分前まで。
    C: 日没の1時間後から日の出の1時間前まで。
    D: 500フィート先が見えない時のみ。
  answer: B
  explanation: 日没の30分後から日の出の30分前まで、または1,000フィート離れた場所から人や車両をはっきりと認識できない場合は常に、ヘッドライトを点灯しなければなりません。
- id: 26
  category: sharing_the_road
  question: サイレンを鳴らし、赤色灯を点滅させた緊急車両が後方から接近してきた場合、どうすればよいですか？
  choices:
    A: 加速して緊急車両の前方を走り続ける。
    B: 現在の車線で直ちに停止する。
    C: 道路の右端に寄せて停止する。
    D: 左車線に移動し、右側を通過させる。
  answer: C
  explanation: サイレンと赤色灯を使用している警察車両、消防車、救急車、その他の緊急車両には優先権を譲らなければなりません。道路の右端に寄せて、緊急車両が通過するまで停止してください。
- id: 27
  category: signs_and_signals
  question: 黄色の信号（点滅ではない実灯）は何を示していますか？
  choices:
    A: 信号がまもなく青に変わる。
    B: 注意：まもなく赤信号に変わる。
    C: 交差点内の位置に関係なく、直ちに停止する。
    D: 加速して交差点を素早く通過する。
  answer: B
  explanation: 黄色の信号は「注意」を意味します。まもなく赤信号に変わります。黄色の信号を見たとき、安全に停止できる場合は停止してください。安全に停止できない場合は、注意して交差点を通過してください。
- id: 28
  category: driver_responsibility
  question: DMVバーチャルアシスタントを利用する際、どのような情報を含めないようにすべきですか？
  choices:
    A: 車両のメーカーとモデル
    B: 個人情報
    C: 一般的な運転に関する質問
    D: ウェブサイトへのフィードバック
  answer: B
  explanation: 一般免責事項には、「車両管理局（DMV）のバーチャルアシスタントを利用する際は、個人情報を含めないでください」と記載されています。
- id: 29
  category: license_system
  question: DMVのウェブサイト上で、英語のコンテンツとサードパーティによる翻訳との間に相違が生じた場合、どちらのバージョンに法的拘束力がありますか？
  choices:
    A: 翻訳されたバージョン
    B: 両方のバージョンに同等の拘束力がある
    C: 英語のバージョン
    D: どちらのバージョンにもない
  answer: C
  explanation: サードパーティ翻訳の免責事項には、英語のコンテンツが公式な情報源であり、翻訳におけるいかなる相違も「拘束力を持たず、コンプライアンスや法執行の目的において法的効力を持たない」と記されています。
- id: 30
  category: vehicle_information
  question: 次のうち、「車両登録（Vehicle Registration）」セクションで提供されているサービスはどれですか？
  choices:
    A: mDL（モバイル運転免許証）パイロットプログラムへの参加
    B: 保険証明書の提出
    C: 免許復帰手数料の支払い
    D: オンラインテスト
  answer: B
  explanation: メインナビゲーションメニューによると、「保険証明書の提出（Submit Proof of Insurance）」は車両登録のサービスとしてリストされています。
- id: 31
  category: license_system
  question: 「運転免許証および身分証明書（Driver's Licenses & IDs）」のサービスにおいて、ユーザーはどのパイロットプログラムへの参加を案内されますか？
  choices:
    A: mDL（モバイル運転免許証）パイロット
    B: バーチャルオフィス・パイロット
    C: セーフドライバー・パイロット
    D: オンラインテスト・パイロット
  answer: A
  explanation: 「運転免許証および身分証明書」のナビゲーションメニューには、「mDLパイロットに参加する（Join the mDL Pilot）」というオプションが含まれています。
- id: 32
  category: penalties_and_points
  question: 次のうち、DMVのオンライン支払いシステムを通じて支払うことができる罰則関連の料金はどれですか？
  choices:
    A: スピード違反の罰金
    B: 駐車違反の罰金
    C: 不渡り小切手の支払い（Dishonored Check Payment）
    D: 裁判所の事務手数料
  answer: C
  explanation: 「支払いをする（Make a Payment）」のセクションには、オンライン支払いのオプションとして「不渡り小切手の支払い（Dishonored
    Check Payment）」と「免許復帰手数料の支払い（Pay Reinstatement Fee）」が明記されています。
- id: 33
  category: driver_testing
  question: カリフォルニア州運転免許ハンドブックの中で、「試験のプロセス（The Testing Process）」について説明しているのはどのセクションですか？
  choices:
