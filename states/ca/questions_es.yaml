questions:
- id: 1
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una zona escolar cuando hay niños presentes,
    a menos que se indique lo contrario?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: Según el Manual del Automovilista de California, el límite de velocidad
    es de 25 mph cuando se conduce a menos de 500 pies de una escuela mientras los
    niños están afuera o cruzando la calle, a menos que se indique lo contrario.
- id: 2
  category: safe_driving_rules
  question: 'La ''Ley Básica de Velocidad'' de California establece que usted debe:'
  choices:
    A: Nunca conducir más rápido que el límite de velocidad publicado
    B: Nunca conducir más rápido de lo que sea seguro para las condiciones actuales
    C: Siempre conducir al ritmo del tráfico
    D: Mantener su velocidad cerca de la de otros vehículos
  answer: B
  explanation: La Ley Básica de Velocidad establece que nunca debe conducir más rápido
    de lo que sea seguro para las condiciones actuales, independientemente del límite
    de velocidad publicado.
- id: 3
  category: alcohol_drugs_health
  question: Es ilegal que una persona de 21 años de edad o mayor conduzca con una
    Concentración de Alcohol en la Sangre (BAC) de ___ o más.
  choices:
    A: 0.04%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: La ley de California hace que sea ilegal para cualquier persona de
    21 años o mayor conducir con una BAC de 0.08% o más.
- id: 4
  category: sharing_the_road
  question: 'Cuando un autobús escolar con sus luces rojas intermitentes está detenido
    más adelante en su lado de la calle, usted debe:'
  choices:
    A: Detenerse hasta que crea que todos los niños han bajado
    B: Detenerse hasta que las luces rojas dejen de parpadear
    C: Cambiar de carril, conducir lentamente y rebasar con cuidado
    D: Reducir la velocidad a 15 mph al rebasar
  answer: B
  explanation: Debe detenerse ante un autobús escolar con luces rojas intermitentes
    y permanecer detenido hasta que las luces dejen de parpadear. No hacerlo puede
    resultar en una multa y la suspensión de la licencia.
- id: 5
  category: sharing_the_road
  question: 'Debe ceder el derecho de paso a un vehículo de emergencia:'
  choices:
    A: Conduciendo lo más cerca posible del borde derecho de la calle y deteniéndose
    B: Moviéndose al carril derecho y conduciendo lentamente
    C: Deteniéndose inmediatamente en su carril actual
    D: Acelerando para apartarse de su camino
  answer: A
  explanation: Cuando escuche una sirena o vea luces rojas intermitentes de un vehículo
    de emergencia, debe orillarse al borde derecho de la calle y detenerse hasta que
    pase.
- id: 6
  category: driver_responsibility
  question: Según la ley de California, ¿cuándo puede usar un teléfono celular de
    mano mientras conduce?
  choices:
    A: Cuando está detenido en un semáforo en rojo
    B: Solo en una emergencia para pedir ayuda
    C: Cuando el tráfico se mueve a menos de 15 mph
    D: Cuando conduce por una carretera rural
  answer: B
  explanation: Solo puede usar un teléfono celular de mano mientras conduce en una
    situación de emergencia para llamar a la policía, a un proveedor médico, al departamento
    de bomberos u otros servicios de emergencia.
- id: 7
  category: safe_driving_rules
  question: 'Al estacionarse cuesta arriba en una calle de doble sentido sin acera
    (bordillo), sus ruedas delanteras deben estar:'
  choices:
    A: Giradas hacia la izquierda (hacia la calle)
    B: Giradas hacia la derecha (lejos de la calle)
    C: Paralelas al borde de la calle
    D: Apuntando hacia adelante
  answer: B
  explanation: Al estacionarse cuesta arriba o cuesta abajo sin acera, gire las ruedas
    hacia la derecha (hacia el lado de la calle) para que el vehículo ruede lejos
    del centro de la calle si fallan los frenos.
- id: 8
  category: signs_and_signals
  question: 'Un semáforo rojo intermitente en una intersección significa:'
  choices:
    A: Reducir la velocidad antes de entrar
    B: Detenerse antes de entrar, luego avanzar cuando sea seguro
    C: Detenerse y esperar la luz verde
    D: Ceder el paso a todo el tráfico antes de entrar
  answer: B
  explanation: Un semáforo rojo intermitente significa 'ALTO'. Después de detenerse,
    puede avanzar cuando sea seguro, respetando las reglas del derecho de paso.
- id: 9
  category: signs_and_signals
  question: 'Dos líneas amarillas continuas en el centro de la calle significan:'
  choices:
    A: Se permite rebasar desde cualquier dirección
    B: Se permite rebasar solo si usted está en el lado derecho
    C: No se permite rebasar desde ninguna dirección
    D: La calle se estrecha más adelante
  answer: C
  explanation: Dos líneas amarillas continuas indican que no se puede rebasar. No
    debe conducir sobre estas líneas para rebasar a otros vehículos.
- id: 10
  category: defensive_driving
  question: 'Para evitar seguir muy de cerca a otro vehículo, el Manual del Automovilista
    de California recomienda usar la:'
  choices:
    A: Regla de los 2 segundos
    B: Regla de los 3 segundos
    C: Regla de los 4 segundos
    D: Regla de los 5 segundos
  answer: B
  explanation: Para evitar seguir muy de cerca a otro vehículo, use la 'regla de los
    3 segundos' para asegurarse de tener suficiente espacio para detenerse de manera
    segura si el vehículo de adelante frena repentinamente.
- id: 11
  category: penalties_and_points
  question: 'Debe notificar al DMV dentro de 10 días si está en un choque que cause:'
  choices:
    A: Cualquier daño al vehículo
    B: Más de $500 en daños
    C: Más de $1,000 en daños o si alguien resulta herido o muerto
    D: Que su vehículo sea remolcado
  answer: C
  explanation: Usted (o su agente de seguros, corredor o representante legal) debe
    reportar un choque al DMV dentro de 10 días si causó más de $1,000 en daños a
    la propiedad o si alguien resultó herido o muerto.
- id: 12
  category: sharing_the_road
  question: 'Si un peatón está en un cruce peatonal, usted debe:'
  choices:
    A: Tocar la bocina para advertirle
    B: Ceder el derecho de paso al peatón
    C: Conducir alrededor de él con cuidado
    D: Detenerse solo si está en su lado de la calle
  answer: B
  explanation: Los peatones tienen el derecho de paso en cruces peatonales marcados
    o no marcados. Debe ceder el paso y permitirles cruzar de manera segura.
- id: 13
  category: license_system
  question: 'Con una licencia de conducir básica Clase C, una persona puede conducir:'
  choices:
    A: Un vehículo de 3 ejes si el peso bruto del vehículo es menor a 6,000 libras
    B: Cualquier vehículo comercial
    C: Un vehículo que remolca dos tráileres
    D: Una motocicleta
  answer: A
  explanation: Una licencia de conducir Clase C le permite conducir un vehículo de
    2 ejes con una clasificación de peso bruto vehicular (GVWR) de 26,000 libras o
    menos, o un vehículo de 3 ejes que pese 6,000 libras o menos de peso bruto.
- id: 14
  category: defensive_driving
  question: 'Al cambiar de carril, debe revisar sus puntos ciegos:'
  choices:
    A: Mirando por el espejo retrovisor
    B: Mirando por los espejos laterales
    C: Girando la cabeza y mirando por encima del hombro
    D: Usando su cámara de reversa
  answer: C
  explanation: Los espejos no muestran sus puntos ciegos. Debe girar la cabeza y mirar
    por encima del hombro para asegurarse de que el carril esté libre antes de cambiar
    de carril.
- id: 15
  category: safe_driving_rules
  question: ¿Cuál es el principio fundamental de la 'Ley Básica de Velocidad' de California?
  choices:
    A: Nunca debe conducir más rápido que el límite de velocidad publicado.
    B: Nunca debe conducir más rápido de lo que sea seguro para las condiciones actuales.
    C: Siempre debe conducir al ritmo del tráfico, sin importar el límite de velocidad.
    D: Debe conducir al menos 10 mph por debajo del límite de velocidad en caso de
      mal tiempo.
  answer: B
  explanation: La 'Ley Básica de Velocidad' de California establece que nunca debe
    conducir más rápido de lo que sea seguro para las condiciones actuales, independientemente
    del límite de velocidad publicado.
- id: 16
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en la sangre (BAC)
    para un conductor de 21 años de edad o mayor?
  choices:
    A: 0.04%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Es ilegal que cualquier persona de 21 años de edad o mayor opere un
    vehículo con una concentración de alcohol en la sangre (BAC) de 0.08% o más.
- id: 17
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una intersección ciega?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad para una intersección ciega es de 15 mph. Una
    intersección se considera 'ciega' si no hay señales de alto en ninguna esquina
    y no puede ver a 100 pies en ninguna dirección durante los últimos 100 pies antes
    de cruzar.
- id: 18
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en la mayoría de los distritos
    comerciales o residenciales en California?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: A
  explanation: A menos que se indique lo contrario, el límite de velocidad máximo
    en la mayoría de los distritos comerciales y residenciales es de 25 mph.
- id: 19
  category: safe_driving_rules
  question: ¿Cómo debe girar las ruedas al estacionarse cuesta arriba junto a un borde
    de la acera (bordillo)?
  choices:
    A: Girar las ruedas hacia el borde de la acera.
    B: Girar las ruedas en dirección opuesta al borde de la acera.
    C: Mantener las ruedas perfectamente rectas.
    D: Girar las ruedas paralelas a la calle.
  answer: B
  explanation: Al estacionarse cuesta arriba junto a un borde de la acera, debe girar
    las ruedas delanteras en dirección opuesta al borde de la acera y dejar que su
    vehículo retroceda unas pulgadas hasta que la parte trasera de la rueda delantera
    toque suavemente el borde de la acera.
- id: 20
  category: signs_and_signals
  question: ¿Qué significa un semáforo en rojo intermitente?
  choices:
    A: Reducir la velocidad y ceder el paso al tráfico.
    B: Detenerse, luego avanzar cuando sea seguro.
    C: Detenerse y esperar la luz verde.
    D: El semáforo está descompuesto; avanzar con precaución.
  answer: B
  explanation: Un semáforo en rojo intermitente significa 'ALTO'. Después de detenerse,
    puede avanzar cuando sea seguro, respetando las reglas de derecho de paso.
- id: 21
  category: signs_and_signals
  question: ¿Qué representan dos conjuntos de líneas amarillas dobles y continuas
    que están separadas por dos o más pies de distancia?
  choices:
    A: Un carril de uso compartido (carpool).
    B: Una zona para rebasar.
    C: Un muro sólido; no conduzca sobre ni a través de ellas.
    D: Un carril central compartido para dar vuelta.
  answer: C
  explanation: Dos conjuntos de líneas amarillas dobles y continuas que están separadas
    por dos o más pies de distancia se consideran una barrera. No conduzca sobre ni
    a través de esta barrera, ni dé vuelta a la izquierda o en "U" cruzándola.
- id: 22
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en un cruce peatonal?
  choices:
    A: Los vehículos tienen el derecho de paso si el peatón está cruzando imprudentemente
      (jaywalking).
    B: Los peatones siempre tienen el derecho de paso en cruces peatonales marcados
      o no marcados.
    C: Los vehículos tienen el derecho de paso si el cruce peatonal no está marcado.
    D: Las bicicletas tienen el derecho de paso sobre los peatones.
  answer: B
  explanation: Los peatones tienen el derecho de paso en cruces peatonales marcados
    o no marcados. Los conductores deben ceder el paso y reducir su velocidad o detenerse
    si es necesario para garantizar la seguridad del peatón.
- id: 23
  category: defensive_driving
  question: ¿Cuál es la distancia mínima de seguimiento recomendada en condiciones
    normales de manejo para evitar un choque por detrás?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: Para evitar seguir muy de cerca a otro vehículo y los choques por detrás,
    debe usar la "regla de los 3 segundos" para mantener una distancia de seguimiento
    segura en condiciones normales de manejo.
- id: 24
  category: driver_responsibility
  question: ¿Cuándo debe reportar un choque de tránsito al DMV?
  choices:
    A: Solo si alguien muere.
    B: Dentro de 10 días si los daños superan los $1,000 o si alguien resulta herido
      o muere.
    C: Dentro de 5 días si los daños superan los $500.
    D: Solo si la policía no presenta un reporte.
  answer: B
  explanation: Usted (o su agente de seguros, corredor o representante legal) debe
    reportar un choque al DMV dentro de 10 días si hay más de $1,000 en daños a la
    propiedad de cualquier persona, o si alguien resulta herido (por leve que sea)
    o muere.
- id: 25
  category: safe_driving_rules
  question: ¿Cuándo se requiere que encienda los faros delanteros de su vehículo?
  choices:
    A: Solo cuando conduzca en carreteras sin iluminación.
    B: Desde 30 minutos después del atardecer hasta 30 minutos antes del amanecer.
    C: Desde 1 hora después del atardecer hasta 1 hora antes del amanecer.
    D: Solo cuando no pueda ver a 500 pies por delante de usted.
  answer: B
  explanation: Debe encender los faros delanteros 30 minutos después del atardecer
    y dejarlos encendidos hasta 30 minutos antes del amanecer, o en cualquier momento
    en que no pueda reconocer claramente a una persona o vehículo desde una distancia
    de 1,000 pies.
- id: 26
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un vehículo de emergencia con sirena y luces intermitentes
    se acerca por detrás?
  choices:
    A: Acelerar para mantenerse delante del vehículo de emergencia.
    B: Detenerse inmediatamente en su carril actual.
    C: Orillarse hacia el borde derecho de la calle y detenerse.
    D: Moverse al carril izquierdo para dejarlo pasar por la derecha.
  answer: C
  explanation: Debe ceder el derecho de paso a cualquier vehículo de policía, camión
    de bomberos, ambulancia u otro vehículo de emergencia que use una sirena y luces
    rojas. Conduzca hacia el borde derecho de la calle y deténgase hasta que el (los)
    vehículo(s) de emergencia haya(n) pasado.
- id: 27
  category: signs_and_signals
  question: ¿Qué indica un semáforo en amarillo continuo?
  choices:
    A: La luz está a punto de cambiar a verde.
    B: 'PRECAUCIÓN: La luz roja está a punto de aparecer.'
    C: Detenerse inmediatamente, sin importar su posición en la intersección.
    D: Acelerar para despejar la intersección rápidamente.
  answer: B
  explanation: Un semáforo en amarillo continuo significa "PRECAUCIÓN". La luz roja
    del semáforo está a punto de aparecer. Cuando vea la luz amarilla del semáforo,
    deténgase si puede hacerlo de manera segura. Si no puede detenerse de manera segura,
    cruce la intersección con precaución.
- id: 28
  category: driver_responsibility
  question: Al interactuar con el Asistente Virtual del DMV, ¿qué tipo de información
    debe evitar incluir?
  choices:
    A: Marca y modelo del vehículo
    B: Información personal
    C: Preguntas generales de manejo
    D: Comentarios sobre el sitio web
  answer: B
  explanation: 'El Descargo de Responsabilidad General establece: "Al interactuar
    con el Asistente Virtual del Departamento de Vehículos Motorizados (DMV), por
    favor no incluya ninguna información personal".'
- id: 29
  category: license_system
  question: Si surge una discrepancia entre el contenido en inglés y una traducción
    de terceros en el sitio web del DMV, ¿qué versión es legalmente vinculante?
  choices:
    A: La versión traducida
    B: Ambas versiones son igualmente vinculantes
    C: La versión en inglés
    D: Ninguna de las versiones
  answer: C
  explanation: El Descargo de Responsabilidad de Traducciones de Terceros señala que
    el contenido en inglés es la fuente oficial, y cualquier discrepancia en la traducción
    "no es vinculante y no tiene efecto legal para fines de cumplimiento o aplicación
    de la ley".
- id: 30
  category: vehicle_information
  question: ¿Cuál de los siguientes es un servicio proporcionado bajo la sección de
    Registro de Vehículos?
  choices:
    A: Unirse al programa piloto de mDL
    B: Enviar comprobante de seguro
    C: Pagar tarifa de restitución
    D: Pruebas en línea
  answer: B
  explanation: Según el menú de navegación principal, "Enviar comprobante de seguro"
    aparece como un servicio bajo Registro de Vehículos.
- id: 31
  category: license_system
  question: En los servicios de Licencias de Conducir y Tarjetas de Identificación
    (Driver's Licenses & IDs), ¿a qué programa piloto se invita a los usuarios a unirse?
  choices:
    A: El piloto de mDL (Licencia de Conducir Móvil)
    B: El piloto de Oficina Virtual
    C: El piloto de Conductor Seguro
    D: El piloto de Pruebas en Línea
  answer: A
  explanation: El menú de navegación para Licencias de Conducir y Tarjetas de Identificación
    incluye una opción para "Unirse al piloto de mDL" (Join the mDL Pilot).
- id: 32
  category: penalties_and_points
  question: ¿Cuál de los siguientes cargos relacionados con multas se puede pagar
    a través del sistema de pago en línea del DMV?
  choices:
    A: Multas por exceso de velocidad
    B: Multas de estacionamiento
    C: Pago de cheques sin fondos (Dishonored Check Payment)
    D: Cargos administrativos de la corte
  answer: C
  explanation: La sección "Hacer un pago" (Make a Payment) enumera explícitamente
    "Pago de cheques sin fondos" (Dishonored Check Payment) y "Pagar tarifa de restitución"
    (Pay Reinstatement Fee) como opciones de pago en línea.
- id: 33
  category: driver_testing
  question: ¿Qué sección del Manual del Automovilista de California cubre "El proceso
    de exámenes" (The Testing Process)?
  choices:
    A: Sección 1
    B: Sección 2
    C: Sección 3
    D: Sección 4
  answer: C
  explanation: 'El índice incluye la "Sección 3: El proceso de exámenes" (Section
    3: The Testing Process) en el Manual del Automovilista de California.'
- id: 34
  category: safe_driving_rules
  question: Según el índice del Manual del Automovilista de California, ¿qué sección
    está dedicada a "Leyes y reglas de la calle" (Laws and Rules of the Road)?
  choices:
    A: Sección 5
    B: Sección 6
    C: Sección 7
    D: Sección 8
  answer: C
  explanation: 'El índice enumera explícitamente la "Sección 7: Leyes y reglas de
    la calle" (Section 7: Laws and Rules of the Road).'
- id: 35
  category: defensive_driving
  question: ¿Qué sección del Manual del Automovilista de California presenta el tema
    de "Manejo seguro" (Safe Driving)?
  choices:
    A: Sección 5
    B: Sección 6
    C: Sección 7
    D: Sección 8
  answer: D
  explanation: 'El índice detalla la "Sección 8: Manejo seguro" (Section 8: Safe Driving)
    para el Manual del Automovilista de California.'
- id: 36
  category: driver_testing
  question: ¿Qué recursos están disponibles en el menú de Exámenes (Testing) en línea
    del DMV para ayudar a prepararse para un examen de manejo?
  choices:
    A: Instructores virtuales en vivo
    B: Exámenes de práctica y videos instructivos (Practice Tests and How-To Videos)
    C: Simuladores de manejo detrás del volante
    D: Servicios de calificación acelerada
  answer: B
  explanation: El menú de Exámenes (Testing) incluye opciones para "Exámenes de práctica"
    (Practice Tests), "Videos instructivos" (How-To Videos), "Manuales del automovilista"
    (Driver Handbooks) y "Guías de manejo especializadas" (Specialty Driver Guides).
- id: 37
  category: driver_responsibility
  question: ¿Qué debe hacer un usuario para activar el chatbot del Asistente Virtual
    del DMV?
  choices:
    A: Crear una cuenta MyDMV
    B: Aceptar los descargos de responsabilidad
    C: Ingresar su número de licencia de conducir
    D: Pagar una tarifa de conveniencia
  answer: B
  explanation: La interfaz del chatbot incluye un estado de error que requiere que
    los usuarios marquen una casilla indicando "Acepto" (I agree) a los descargos
    de responsabilidad para activar el Asistente Virtual.
- id: 38
  category: license_system
  question: ¿Cuál de los siguientes estados de casos se puede verificar en línea a
    través del portal del DMV?
  choices:
    A: Estado de caso de la corte de tránsito
    B: Estado de caso de seguridad del conductor (Driver Safety Case Status)
    C: Estado de incautación del vehículo
    D: Estado de la prueba de emisiones (Smog check)
  answer: B
  explanation: El menú "Verificar estado" (Check Status) ofrece una opción para verificar
    el "Estado de caso de seguridad del conductor" (Driver Safety Case Status) entre
    otros servicios.
- id: 39
  category: license_system
  question: ¿Qué sección del Manual del Automovilista de California cubre "Cambiar,
    reemplazar y renovar su licencia de conducir" (Changing, Replacing, and Renewing
    Your Driver’s License)?
  choices:
    A: Sección 1
    B: Sección 2
    C: Sección 3
    D: Sección 4
  answer: D
  explanation: 'El índice incluye la "Sección 4: Cambiar, reemplazar y renovar su
    licencia de conducir" (Section 4: Changing, Replacing, and Renewing Your Driver’s
    License).'
- id: 40
  category: vehicle_information
  question: Si necesita solicitar un registro de su vehículo, ¿en qué menú del DMV
    debe buscar?
  choices:
    A: Registro de Vehículos (Vehicle Registration)
    B: Licencias de Conducir y Tarjetas de Identificación (Driver's Licenses & IDs)
    C: Verificar Estado (Check Status)
    D: Citas (Appointments)
  answer: A
  explanation: '"Solicitar registro del vehículo" (Request Vehicle Record) aparece
    como un servicio en el menú de navegación de "Registro de Vehículos" (Vehicle
    Registration).'
- id: 41
  category: license_system
  question: ¿Qué servicio permite a los clientes asegurar un lugar en una oficina
    del DMV sin programar una cita tradicional?
  choices:
    A: Oficina Virtual
    B: Póngase en fila ahora (Get in Line Now)
    C: Vía rápida de MyDMV (MyDMV Fast Track)
    D: Pruebas en línea
  answer: B
  explanation: En el menú de 'Citas' (Appointments), el DMV ofrece el servicio 'Póngase
    en fila ahora' (Get in Line Now) junto con la programación de citas tradicionales.
- id: 42
  category: license_system
  question: Según el descargo de responsabilidad de traducción, ¿por qué el DMV proporciona
    traducción automática a través de proveedores externos?
  choices:
    A: Para reemplazar la versión en inglés por completo
    B: Solo para fines de información y conveniencia
    C: Para proporcionar documentos legalmente vinculantes en todos los idiomas
    D: Para recopilar datos sobre personas que no hablan inglés
  answer: B
  explanation: 'El descargo de responsabilidad establece: ''La traducción automática
    se proporciona solo para fines de información y conveniencia''.'
- id: 43
  category: driver_responsibility
  question: 'Según el Mensaje del Secretario en el Manual del Automovilista de California,
    conducir o viajar en las carreteras de California se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio
    C: Un requisito para todos los adultos
    D: Un pasatiempo opcional
  answer: B
  explanation: 'El Mensaje del Secretario establece: ''Recuerde que conducir o viajar
    como pasajero es un privilegio y, sobre todo, la seguridad debe ser la prioridad''.'
- id: 44
  category: safe_driving_rules
  question: ¿Qué aconseja el Secretario de la Agencia de Transporte del Estado de
    California sobre el uso del teléfono celular mientras se conduce?
  choices:
    A: Usarlo solo para navegación
    B: Dejarlo a un lado cuando esté al volante o al manubrio
    C: Usar solo dispositivos de manos libres
    D: Es aceptable durante las horas del día
  answer: B
  explanation: El Mensaje del Secretario aconseja explícitamente 'dejar a un lado
    el teléfono celular cuando esté al volante o al manubrio. No opere un vehículo,
    motocicleta o bicicleta mientras esté distraído o incapacitado'.
- id: 45
  category: license_system
  question: ¿Dónde puede un californiano comenzar su solicitud de licencia de conducir
    desde la comodidad de su hogar?
  choices:
    A: Llamando a la línea directa del DMV
    B: Visitando el sitio web del DMV en dmv.ca.gov
    C: A través de la barra de herramientas de Google Translate
    D: Enviando un correo electrónico al Secretario de Transporte
  answer: B
  explanation: 'El texto indica: ''La solicitud de la licencia de conducir se puede
    comenzar desde la comodidad del hogar visitando el sitio web del DMV en dmv.ca.gov''.'
- id: 46
  category: driver_testing
  question: ¿En cuántos idiomas está disponible el Manual del Automovilista de California?
  choices:
    A: '3'
    B: '5'
    C: '9'
    D: '12'
  answer: C
  explanation: El Mensaje del Secretario señala que 'El Manual del Automovilista de
    California está disponible en nueve idiomas...'.
- id: 47
  category: alcohol_drugs_health
  question: 'Según la introducción del manual, operar un vehículo, motocicleta o bicicleta
    mientras está distraído o incapacitado podría significar:'
  choices:
    A: Una infracción de tránsito menor
    B: La diferencia entre la vida y la muerte
    C: Una suspensión automática de la licencia
    D: Un aumento en las primas de seguro
  answer: B
  explanation: 'El Mensaje del Secretario advierte: ''No opere un vehículo, motocicleta
    o bicicleta mientras esté distraído o incapacitado; podría significar la diferencia
    entre la vida y la muerte''.'
- id: 48
  category: defensive_driving
  question: ¿Cuál de las siguientes opciones se menciona como una prioridad de seguridad
    para los conductores en el Mensaje del Secretario?
  choices:
    A: Conducir siempre por debajo del límite de velocidad
    B: Ceder el paso solo a vehículos comerciales
    C: Abrocharse siempre el cinturón de seguridad y prestar atención a los demás
    D: Cambiar a un vehículo más nuevo
  answer: C
  explanation: 'El texto aconseja: ''Abróchese siempre el cinturón de seguridad, respete
    las leyes de tránsito, preste atención a otros conductores, ciclistas y peatones...''.'
- id: 49
  category: license_system
  question: ¿Qué versión del sitio web del DMV se considera la fuente oficial y exacta
    de información sobre programas y servicios?
  choices:
    A: La versión en español
    B: La versión traducida por Google
    C: La versión en inglés
    D: La versión en lenguaje de señas americano
  answer: C
  explanation: 'El descargo de responsabilidad de Google Translate establece: ''Las
    páginas web que actualmente están en inglés en el sitio web del DMV son la fuente
    oficial y exacta de la información de los programas y servicios que ofrece el
    DMV''.'
- id: 50
  category: license_system
  question: Según el descargo de responsabilidad del sitio web del DMV, ¿cuál de las
    siguientes páginas NO se puede traducir usando Google Translate?
  choices:
    A: El Mensaje del Secretario
    B: El Glosario
    C: Las solicitudes en línea
    D: La sección de Manejo Seguro
  answer: C
  explanation: El descargo de responsabilidad enumera 'Formularios, Publicaciones,
    Ubicaciones de oficinas locales, Solicitudes en línea' como páginas que no se
    pueden traducir usando Google Translate.
- id: 51
  category: vehicle_information
  question: Debido a la expansión de los servicios en línea del DMV, ¿cuál de los
    siguientes trámites se puede completar en el sitio web del DMV?
  choices:
    A: Revisiones de smog (emisiones)
    B: Registro de vehículos y renovación de la licencia de conducir
    C: Exámenes prácticos de manejo
    D: Exámenes de la vista
  answer: B
  explanation: 'El Mensaje del Secretario indica: "Algunos de estos trámites incluyen
    la renovación de la licencia de conducir, el registro de vehículos y otros".'
- id: 52
  category: driver_responsibility
  question: ¿Qué aconseja el DMV si decide guardar la transcripción de su chat con
    el Asistente Virtual en una computadora pública?
  choices:
    A: Tener precaución
    B: Imprimirla inmediatamente
    C: Enviarla por correo electrónico al DMV
    D: Compartirla con el administrador del sitio
  answer: A
  explanation: 'El descargo de responsabilidad del chatbot advierte: "Cuando termine
    su chat, puede guardar la transcripción. Tenga precaución al usar una computadora
    o dispositivo público".'
- id: 53
  category: license_system
  question: Si surgen discrepancias en la traducción del sitio web del DMV, ¿cuál
    es el efecto legal para fines de cumplimiento o aplicación de la ley?
  choices:
    A: El texto traducido reemplaza al texto en inglés
    B: Las discrepancias no son vinculantes y no tienen efecto legal
    C: El usuario queda exento de la regla
    D: El DMV debe proporcionar un traductor certificado
  answer: B
  explanation: 'El descargo de responsabilidad establece: "Cualquier discrepancia
    o diferencia creada en la traducción no es vinculante y no tiene efecto legal
    para fines de cumplimiento o aplicación de la ley".'
- id: 54
  category: sharing_the_road
  question: Según el Mensaje del Secretario, ¿a quiénes deben prestar atención los
    conductores para compartir la vía de manera segura?
  choices:
    A: Solo a otros conductores
    B: Solo a los peatones en los cruces peatonales
    C: A otros conductores, ciclistas y peatones
    D: Solo a los conductores de camiones comerciales
  answer: C
  explanation: El Mensaje del Secretario recuerda a los californianos "prestar atención
    a otros conductores, ciclistas y peatones...".
- id: 55
  category: license_system
  question: ¿Con qué propósito proporciona el DMV servicios de traducción automática
    en su sitio web y chatbot?
  choices:
    A: Para documentación legal oficial
    B: Solo para fines de información y conveniencia
    C: Para reemplazar el inglés como idioma oficial
    D: Para garantizar una precisión perfecta para las personas que no hablan inglés
  answer: B
  explanation: Los descargos de responsabilidad establecen que "La traducción automática
    se proporciona solo para fines de información y conveniencia".
- id: 56
  category: vehicle_information
  question: Según el índice del manual, ¿qué sección cubre la Responsabilidad Financiera,
    los Requisitos de Seguro y los Choques?
  choices:
    A: Sección 7
    B: Sección 8
    C: Sección 9
    D: Sección 10
  answer: D
  explanation: 'El índice proporcionado enumera la "Sección 10: Responsabilidad Financiera,
    Requisitos de Seguro y Choques".'
- id: 57
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso en un cruce peatonal sin semáforos para
    peatones?
  choices:
    A: Los vehículos, si viajan al límite de velocidad.
    B: Los peatones siempre tienen el derecho de paso en los cruces peatonales.
    C: Los vehículos, si el peatón no está en un cruce peatonal marcado.
    D: Los peatones, pero solo si hacen contacto visual con el conductor.
  answer: B
  explanation: Los peatones tienen el derecho de paso en cruces peatonales marcados
    o no marcados. Los conductores deben ceder el paso y reducir la velocidad o detenerse
    si es necesario para garantizar la seguridad del peatón.
- id: 58
  category: defensive_driving
  question: Para evitar seguir muy de cerca a otro vehículo (tailgating), ¿cuánto
    espacio debe dejar entre su vehículo y el vehículo de adelante en condiciones
    normales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: B
  explanation: 'Para evitar seguir muy de cerca a otro vehículo, el Manual del Automovilista
    de California recomienda usar la ''regla de los 3 segundos'': cuando el vehículo
    que va adelante pase por un punto determinado, cuente tres segundos para asegurar
    una distancia de seguimiento segura.'
- id: 59
  category: vehicle_information
  question: Debe encender sus faros ___ después del atardecer y dejarlos encendidos
    hasta ___ antes del amanecer.
  choices:
    A: 30 minutos; 30 minutos
    B: 1 hora; 1 hora
    C: 15 minutos; 15 minutos
    D: Inmediatamente; inmediatamente
  answer: A
  explanation: La ley de California requiere que encienda sus faros 30 minutos después
    del atardecer y los deje encendidos hasta 30 minutos antes del amanecer.
- id: 60
  category: defensive_driving
  question: ¿Cuál es la mejor manera de revisar sus puntos ciegos antes de cambiar
    de carril?
  choices:
    A: Mirar por el espejo retrovisor.
    B: Mirar por los espejos laterales.
    C: Girar la cabeza y mirar por encima del hombro.
    D: Tocar la bocina para advertir a otros conductores.
  answer: C
  explanation: Para revisar sus puntos ciegos, debe girar la cabeza y mirar por encima
    del hombro en la dirección en la que planea moverse para ver los vehículos que
    no son visibles en sus espejos.
- id: 61
  category: penalties_and_points
  question: Si es condenado por huir de un agente del orden público en servicio sin
    causar lesiones corporales, ¿cuál de las siguientes sanciones podría enfrentar?
  choices:
    A: Hasta 1 año en una cárcel del condado.
    B: Una advertencia y una multa.
    C: Servicio comunitario obligatorio.
    D: Revocación permanente de su licencia.
  answer: A
  explanation: Cualquier persona condenada por provocar una persecución y huir de
    un agente del orden público será castigada con encarcelamiento en una cárcel del
    condado por no más de un año.
- id: 62
  category: signs_and_signals
  question: 'Una señal de tres lados, roja y blanca, indica que usted debe:'
  choices:
    A: Detenerse por completo antes de ingresar a la intersección.
    B: Ceder el derecho de paso a otros vehículos y peatones.
    C: Mantener su velocidad e incorporarse.
    D: Ignorar la señal si no hay otros vehículos visibles.
  answer: B
  explanation: Una señal roja de tres lados de CEDA EL PASO (YIELD) indica que debe
    reducir la velocidad y estar preparado para detenerse, si es necesario, para dejar
    pasar a cualquier vehículo, ciclista o peatón antes de continuar.
- id: 63
  category: sharing_the_road
  question: 'Al rebasar a un ciclista en un carril de circulación, debe asegurarse
    de que haya suficiente espacio para el ciclista y mantener una distancia mínima
    de:'
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 4 pies
  answer: C
  explanation: La ley de California exige que los conductores dejen una distancia
    de al menos tres pies al rebasar a un ciclista para garantizar su seguridad.
- id: 64
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es legal hacer un giro en U?
  choices:
    A: En una carretera dividida cruzando una sección divisoria, acera o franja de
      tierra.
    B: Cruzando una doble línea amarilla cuando sea seguro y legal.
    C: En un cruce de ferrocarril.
    D: En una calle de un solo sentido.
  answer: B
  explanation: Puede hacer un giro en U cruzando una doble línea amarilla cuando sea
    seguro y legal. Es ilegal hacer un giro en U en una calle de un solo sentido,
    en un cruce de ferrocarril o cruzando la barrera de una carretera dividida.
- id: 65
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años, la ley de ''Tolerancia Cero'' de California establece
    que es ilegal conducir con una concentración de alcohol en la sangre (BAC) de:'
  choices:
    A: 0.01% o más
    B: 0.04% o más
    C: 0.05% o más
    D: 0.08% o más
  answer: A
  explanation: La ley de Tolerancia Cero de California hace que sea ilegal para cualquier
    persona menor de 21 años conducir con un BAC de 0.01% o más.
- id: 66
  category: driver_responsibility
  question: 'Si se ve involucrado en una colisión que resulte en lesiones o muerte,
    debe reportarlo al DMV dentro de:'
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Usted (o su agente de seguros, corredor o representante legal) debe
    reportar la colisión al DMV dentro de 10 días si alguien resulta herido o muerto,
    o si los daños a la propiedad superan los $1,000.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal roja octagonal de ALTO (STOP) significa que debe detenerse
    por completo en la línea de alto, en el cruce peatonal o antes de ingresar a la
    intersección. Revise si hay tráfico y peatones antes de continuar.
  id: 67
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 68
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre a esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe ingresar a la calle o rampa donde está colocada esta señal. Por lo general,
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde ingresar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 69
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: 'Detenerse y retroceder o dar la vuelta: va en sentido contrario'
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que viaja en contra del tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera segura.
  id: 70
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 71
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en esta ubicación.
  id: 72
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Ir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 73
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite adelantar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en esta
    ubicación.
  id: 74
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No adelante a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO ADELANTAR
    (NO PASSING ZONE) significa que no se le permite adelantar a otros vehículos en
    esta área. Marca el comienzo de una zona donde se prohíbe adelantar.
  id: 75
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye a hacer esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un separador u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 76
- image: speed_limit_25.png
  category: signs_and_signals
  question: Según su forma y color, ¿qué tipo de señal es esta?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 77
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 78
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminar cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que cruzan la carretera.
  id: 79
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de color amarillo verdoso fluorescente en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 80
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no adelantar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 81
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 82
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro obligatorio a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar a
    la curva.
  id: 83
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa solo girar a la derecha
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 84
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición del camino advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino se curve primero
    hacia un lado y luego hacia el otro.
  id: 85
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de camino resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a las condiciones cambiantes
    del camino.
  id: 86
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otro camino
    C: El comienzo de una carretera dividida
    D: Un camino que se estrecha a un carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otro camino se incorporará a su carril. Prepárese para ajustar su
    velocidad y posición.
  id: 87
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: Fin del carril
    D: Fin de la carretera dividida
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Prepárese para una reducción en el ancho del camino y ajuste su
    posición en el carril.
  id: 88
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: Fin del camino
    B: Tráfico de doble sentido
    C: Comienza una carretera dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    carretera dividida con una mediana o barrera que separa el tráfico en sentido
    opuesto. Manténgase a la derecha.
  id: 89
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: La carretera dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de camino más adelante
  answer: B
  explanation: Esta señal advierte que la carretera dividida termina. El tráfico en
    sentido opuesto ya no estará separado por una mediana. Prepárese para el tráfico
    de doble sentido.
  id: 90
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Desvío de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de sentido único o de una autopista dividida
    y se encontrará con vehículos que viajan en dirección opuesta.
  id: 91
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera helada
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 92
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina empinada o pendiente más adelante
    D: Construcción en la carretera
  answer: C
  explanation: Esta señal advierte de una colina empinada o pendiente más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 93
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Prepárese para detenerse
    si la luz está roja o amarilla. Esta señal a menudo se coloca donde el semáforo
    puede no ser visible desde la distancia.
  id: 94
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (badén)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 95
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce o una intersección de 4 vías más
    adelante. Esté atento al tráfico que ingresa desde las carreteras laterales.
  id: 96
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la autopista desde la carretera lateral.
  id: 97
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando (fusionando)
    B: Un carril termina
    C: Se añade un nuevo carril — no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin necesidad de incorporarse (fusionarse). El tráfico que entra
    por la rampa tiene su propio carril nuevo.
  id: 98
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Detenerse o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    cargar o descargar pasajeros.
  id: 99
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: A cualquier persona por menos de 15 minutos
    B: Solo a personas de la tercera edad
    C: Solo a vehículos que muestren un cartel o placa de discapacidad válida
    D: A cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de una silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de matrícula de estacionamiento para discapacitados válidos pueden
    estacionar en estos espacios. Las infracciones conllevan multas severas.
  id: 100
