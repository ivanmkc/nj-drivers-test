questions:
- id: 1
  category: license_system
  question: ¿En Georgia, cuál es la edad mínima para solicitar un Permiso de Instrucción
    Clase CP?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 15 años y medio de edad
  answer: B
  explanation: Según el Departamento de Servicios al Conductor de Georgia (DDS), una
    persona debe tener al menos 15 años de edad para solicitar un Permiso de Instrucción
    Clase CP.
- id: 2
  category: license_system
  question: Bajo la Ley de Joshua (Joshua's Law), para obtener una Licencia Provisional
    Clase D a los 16 años, un adolescente debe completar un curso de educación vial
    aprobado y ¿cuántas horas de conducción supervisada?
  choices:
    A: 20 horas, incluyendo 5 por la noche
    B: 30 horas, incluyendo 10 por la noche
    C: 40 horas, incluyendo 6 por la noche
    D: 50 horas, incluyendo 15 por la noche
  answer: C
  explanation: La Ley de Joshua requiere que los jóvenes de 16 años completen un curso
    de educación vial aprobado más 40 horas de conducción supervisada, de las cuales
    al menos 6 deben ser nocturnas.
- id: 3
  category: license_system
  question: 'El titular de una Licencia Provisional Clase D de Georgia no tiene permitido
    conducir entre las horas de:'
  choices:
    A: 10:00 PM y 5:00 AM
    B: 11:00 PM y 6:00 AM
    C: 12:00 de la medianoche y 5:00 AM
    D: 1:00 AM y 5:00 AM
  answer: C
  explanation: La ley de Georgia prohíbe a los titulares de licencias Clase D conducir
    en caminos públicos, calles o autopistas entre las 12:00 de la medianoche y las
    5:00 AM.
- id: 4
  category: license_system
  question: Durante los primeros seis meses de tener una licencia Clase D, ¿quién
    tiene permitido viajar como pasajero en el vehículo?
  choices:
    A: Solo un amigo menor de 21 años
    B: Solo miembros de la familia inmediata
    C: No se permiten pasajeros
    D: Cualquier persona, siempre que un padre esté presente
  answer: B
  explanation: Durante los primeros seis meses posteriores a la emisión de una licencia
    Clase D, solo los miembros de la familia inmediata pueden viajar en el vehículo.
- id: 5
  category: license_system
  question: Durante el segundo período de seis meses después de recibir una licencia
    Clase D, ¿cuántos pasajeros menores de 21 años que NO sean miembros de la familia
    inmediata del conductor pueden viajar en el vehículo?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante el segundo período de seis meses, solo un pasajero menor de
    21 años que no sea miembro de la familia inmediata del conductor puede viajar
    en el vehículo.
- id: 6
  category: license_system
  question: En Georgia, a un conductor menor de 21 años se le suspenderá la licencia
    por una sola condena de ¿cuál de las siguientes infracciones?
  choices:
    A: Conducir a 15 mph sobre el límite de velocidad
    B: No señalar un giro
    C: Atropello y fuga (hit and run) o abandonar la escena de un accidente
    D: Registro vencido
  answer: C
  explanation: Para conductores menores de 21 años, una condena por atropello y fuga,
    carreras, conducción temeraria o cualquier infracción por la cual se asignen 4
    o más puntos resulta en la suspensión automática de la licencia.
- id: 7
  category: license_system
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) para conductores
    menores de 21 años en Georgia?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Georgia tiene una política de 'Tolerancia Cero' para el consumo de
    alcohol y la conducción de menores de edad; un BAC de 0.02% o superior para un
    conductor menor de 21 años se considera un DUI.
- id: 8
  category: license_system
  question: 'De acuerdo con la ley ''Super Speeder'' de Georgia, se añade una tarifa
    estatal adicional de $200 a cualquier multa local por exceso de velocidad si el
    conductor es condenado por conducir a:'
  choices:
    A: 75 mph o más en cualquier carretera de dos carriles
    B: 80 mph o más en cualquier carretera
    C: 10 mph sobre el límite establecido
    D: 90 mph o más en una carretera interestatal
  answer: A
  explanation: La ley Super Speeder se aplica a los conductores condenados por exceso
    de velocidad a 75 mph o más en cualquier carretera de dos carriles, u 85 mph o
    más en cualquier carretera o autopista en Georgia.
- id: 9
  category: license_system
  question: ¿Cuántos puntos debe acumular un conductor (de 21 años o más) en un período
    de 24 meses para recibir una suspensión de licencia?
  choices:
    A: 10 puntos
    B: 12 puntos
    C: 15 puntos
    D: 18 puntos
  answer: C
  explanation: El DDS de Georgia suspenderá la licencia de cualquier conductor que
    acumule 15 o más puntos en un plazo de 24 meses.
- id: 10
  category: license_system
  question: ¿Cuál es el plazo estándar de vencimiento de una licencia de conducir
    de Georgia para residentes menores de 64 años?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Las licencias de conducir estándar de Georgia se emiten normalmente
    por un período de 8 años.
- id: 11
  category: license_system
  question: Si se muda a Georgia desde otro estado, ¿cuántos días tiene para actualizar
    su licencia de conducir ante el DDS?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes deben solicitar una licencia de conducir de Georgia
    dentro de los 30 días posteriores a convertirse en residentes.
- id: 12
  category: license_system
  question: ¿Qué programa es obligatorio para todos los adolescentes menores de 18
    años para obtener una licencia de conducir en Georgia, el cual se enfoca en la
    concientización sobre el alcohol y las drogas?
  choices:
    A: D.A.R.E.
    B: ADAP
    C: MADD
    D: GOHS
  answer: B
  explanation: El Programa de Concientización sobre el Alcohol y las Drogas (ADAP)
    es un curso obligatorio para que los adolescentes menores de 18 años obtengan
    una licencia de conducir en Georgia.
- id: 13
  category: license_system
  question: Para cumplir con los requisitos de 'Secure ID' de Georgia, ¿cuántos documentos
    que demuestren la dirección residencial se deben proporcionar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene un certificado de nacimiento
  answer: B
  explanation: El programa Secure ID de Georgia requiere que los solicitantes proporcionen
    dos documentos que demuestren su dirección residencial en Georgia.
- id: 14
  category: license_system
  question: ¿A qué edad puede el titular de una licencia Clase D ascender a una licencia
    Clase C (menores de 21 años), siempre que no haya tenido condenas de tráfico graves
    en los 12 meses anteriores?
  choices:
    A: 17 años
    B: 18 años
    C: 19 años
    D: 21 años
  answer: B
  explanation: Un titular de Clase D puede solicitar una licencia Clase C al cumplir
    los 18 años, siempre que no haya sido condenado por ninguna infracción de tráfico
    grave durante los 12 meses anteriores a la solicitud.
- id: 15
  category: license_system
  question: Si un conductor de Georgia es condenado por 'Conducción agresiva', ¿cuántos
    puntos se asignan a su historial de conducción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción agresiva es una infracción de alto puntaje en Georgia,
    lo que resulta en la adición de 6 puntos al historial del conductor.
- id: 16
  category: license_system
  question: Si reprueba el examen de conocimientos de Georgia en su primer intento,
    ¿cuánto tiempo debe esperar antes de ser elegible para volver a tomar la prueba?
  choices:
    A: 24 horas
    B: 48 horas
    C: 7 días
    D: 30 días
  answer: A
  explanation: Según el Departamento de Servicios al Conductor (DDS) de Georgia, si
    reprueba el examen de conocimientos, debe esperar al menos un día (24 horas) para
    volver a tomarlo. Los fallos posteriores requieren un período de espera más largo
    de 7 días.
- id: 17
  category: license_system
  question: Si reprueba el examen de habilidades de conducción en carretera de Georgia
    en su primer intento, ¿cuál es el período de espera obligatorio antes del segundo
    intento?
  choices:
    A: 1 día
    B: 3 días
    C: 7 días
    D: 14 días
  answer: A
  explanation: En Georgia, si reprueba el examen de habilidades en carretera, el primer
    período de espera es de un día. El segundo y todos los fallos posteriores requieren
    un período de espera de 7 días.
- id: 18
  category: license_system
  question: ¿Qué documento específico deben proporcionar los solicitantes menores
    de 18 años para demostrar que están inscritos actualmente en la escuela al solicitar
    un permiso o licencia de Georgia?
  choices:
    A: Una boleta de calificaciones del semestre anterior
    B: Una carta firmada por un maestro
    C: Formulario DS-1 Certificado de Inscripción
    D: Una tarjeta de identificación de estudiante
  answer: C
  explanation: La ley de Georgia exige que los solicitantes menores de 18 años presenten
    un formulario de Certificado de Inscripción (DS-1) completado, firmado y ante
    notario por su escuela, dentro de los últimos 30 días.
- id: 19
  category: license_system
  question: ¿Cuántos puntos se asignan al historial de un conductor de Georgia por
    la infracción de 'Rebase ilegal de un autobús escolar'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Rebasar ilegalmente un autobús escolar se considera una infracción
    grave en Georgia y resulta en la adición de 6 puntos al historial del conductor.
- id: 20
  category: license_system
  question: En Georgia, ¿cuántos puntos se asignan por una condena de 'Seguir demasiado
    de cerca'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: Una condena por seguir demasiado de cerca en Georgia resulta en la
    asignación de 3 puntos contra la licencia de conducir.
- id: 21
  category: license_system
  question: 'Según la ley de Georgia, cualquier hombre de al menos 18 años de edad
    pero menor de 26 años que solicite una licencia de conducir o un permiso:'
  choices:
    A: Está obligado a pagar una tarifa de solicitud más alta
    B: Es registrado automáticamente en el Sistema de Servicio Selectivo de los EE.
      UU. (U.S. Selective Service System)
    C: Está obligado a realizar un examen obligatorio de historia militar
    D: Está exento de la prueba de habilidades viales
  answer: B
  explanation: La ley de Georgia (O.C.G.A. § 40-5-8) exige que cualquier solicitante
    masculino entre 18 y 26 años sea registrado en el Servicio Selectivo como parte
    del proceso de obtención de la licencia.
- id: 22
  category: license_system
  question: Si cambia legalmente su nombre por matrimonio o por orden judicial, ¿dentro
    de cuántos días debe notificar al DDS de Georgia y obtener una licencia de reemplazo?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Georgia exige que los conductores actualicen su licencia
    con un cambio de nombre legal dentro de los 30 días posteriores al cambio.
- id: 23
  category: license_system
  question: 'Para cumplir con los requisitos mínimos de visión para una licencia de
    conducir no comercial de Georgia, un solicitante debe tener al menos:'
  choices:
    A: Visión 20/20 en ambos ojos
    B: Visión 20/40 en ambos ojos
    C: Visión 20/60 en al menos un ojo
    D: Visión 20/100 en al menos un ojo
  answer: C
  explanation: Georgia exige que los conductores no comerciales tengan una visión
    de al menos 20/60 en al menos un ojo, con o sin lentes correctivos, y un campo
    de visión horizontal de al menos 140 grados.
- id: 24
  category: license_system
  question: En Georgia, ¿puede un padre o tutor legal que firmó la solicitud de licencia
    de conducir de un menor retirar su consentimiento más adelante?
  choices:
    A: No, una vez firmada, es permanente hasta los 18 años
    B: Sí, pero solo si el menor es condenado por un DUI
    C: Sí, enviando una solicitud formal al DDS para cancelar la licencia del menor
    D: No, solo un juez puede cancelar la licencia de un menor
  answer: C
  explanation: La persona que firmó la solicitud de la licencia o permiso de un menor
    puede solicitar el retiro de su consentimiento en cualquier momento hasta que
    el menor cumpla 18 años, lo que resulta en la cancelación de la licencia.
- id: 25
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia de Conducir Comercial
    (CDL) Clase A o B en Georgia con el propósito de comercio interestatal?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: Aunque Georgia permite que los jóvenes de 18 años obtengan una CDL
    para conducir dentro del estado (intraestatal), la ley federal y las regulaciones
    de Georgia exigen que un conductor tenga al menos 21 años para conducir un vehículo
    comercial a través de las fronteras estatales (interestatal).
- id: 26
  category: license_system
  question: ¿Cuántos puntos se asignan por una condena por exceso de velocidad entre
    15 mph y 18 mph sobre el límite de velocidad establecido en Georgia?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
  explanation: El sistema de puntos de Georgia asigna 2 puntos por exceder el límite
    de velocidad entre 15 y 18 mph. (19-23 mph son 3 puntos; 24-33 mph son 4 puntos;
    34+ mph son 6 puntos).
- id: 27
  category: license_system
  question: ¿Cuál es la tarifa estándar de restablecimiento en persona para una primera
    suspensión de una licencia de conducir de Georgia debido a la acumulación de puntos?
  choices:
    A: $50
    B: $100
    C: $210
    D: $500
  answer: C
  explanation: Para una primera suspensión por acumulación de puntos, la tarifa de
    restablecimiento es de $210 si se paga en persona, o de $200 si se paga por correo.
- id: 28
  category: license_system
  question: En Georgia, ¿cuántos puntos se asignan por 'Rebasar incorrectamente en
    una colina o una curva'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Rebasar incorrectamente en una colina o curva es una infracción de
    4 puntos en el estado de Georgia.
- id: 29
  category: license_system
  question: ¿Qué deben hacer los conductores de Georgia que tienen 64 años o más en
    cada renovación de su licencia?
  choices:
    A: Volver a tomar la prueba de habilidades viales
    B: Aprobar un examen de la vista
    C: Proporcionar una nota del médico sobre su salud cardíaca
    D: Renovar su licencia cada 2 años
  answer: B
  explanation: La ley de Georgia exige que los conductores de 64 años o más aprueben
    un examen de la vista en cada período de renovación, independientemente de si
    renuevan en persona o por otros métodos.
- id: 30
  category: license_system
  question: Normalmente, ¿a qué grupo de personas se le expide una licencia de conducir
    de 'Término Limitado' (Limited Term) en Georgia?
  choices:
    A: Conductores con un historial de múltiples accidentes
    B: No ciudadanos a quienes se les ha otorgado presencia legal temporal en los
      EE. UU.
    C: Conductores que solo necesitan una licencia para trabajo estacional
    D: Menores que están en libertad condicional académica
  answer: B
  explanation: Se expide una licencia de Término Limitado a los no ciudadanos que
    tienen evidencia documental válida de presencia legal en los Estados Unidos por
    un período específico.
- id: 31
  category: driver_testing
  question: Para aprobar el examen de la vista para una licencia de conducir de Georgia,
    ¿qué agudeza visual mínima debe tener el solicitante en al menos un ojo, con o
    sin lentes correctivos?
  choices:
    A: 20/20
    B: 20/40
    C: 20/60
    D: 20/100
  answer: B
  explanation: Según el Departamento de Servicios al Conductor de Georgia (DDS), un
    solicitante debe tener al menos una visión de 20/40 en al menos un ojo y un campo
    de visión horizontal de al menos 140 grados para aprobar el examen de la vista.
- id: 32
  category: driver_testing
  question: En Georgia, ¿cuáles son los límites mínimos requeridos de seguro de responsabilidad
    civil por lesiones corporales por persona y por accidente?
  choices:
    A: $15,000 / $30,000
    B: $20,000 / $40,000
    C: $25,000 / $50,000
    D: $50,000 / $100,000
  answer: C
  explanation: La ley de Georgia exige un seguro de responsabilidad civil mínimo de
    $25,000 por lesiones corporales de una persona, $50,000 por lesiones corporales
    a varias personas en un accidente y $25,000 por daños a la propiedad.
- id: 33
  category: driver_testing
  question: Bajo la "Ley de Georgia de Manos Libres" (Hands-Free Georgia Act), ¿cuál
    es la multa por una primera condena por sujetar o sostener un dispositivo de telecomunicaciones
    inalámbrico mientras se conduce?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: B
  explanation: Una primera condena por violar la Ley de Georgia de Manos Libres resulta
    en una multa de $50 y 1 punto en el historial de conducción.
- id: 34
  category: driver_testing
  question: ¿Cuántos puntos se asignan a una licencia de conducir de Georgia por una
    condena por exceso de velocidad de 19 mph a 23 mph sobre el límite de velocidad
    señalizado?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: En Georgia, el exceso de velocidad de 15-18 mph sobre el límite es
    de 2 puntos, de 19-23 mph es de 3 puntos, de 24-33 mph es de 4 puntos, y 34 mph
    o más es de 6 puntos.
- id: 35
  category: driver_testing
  question: La ley "Move Over" (Hacerse a un lado) de Georgia exige que los conductores
    se muevan al siguiente carril si es posible hacerlo de manera segura al acercarse
    a vehículos de emergencia estacionados. Si no es seguro moverse de carril, ¿qué
    debe hacer el conductor?
  choices:
    A: Mantener la velocidad pero tocar la bocina para advertir a los trabajadores
      de emergencia
    B: Detenerse por completo en el carril de circulación
    C: Reducir la velocidad a una velocidad que sea razonable y menor que el límite
      de velocidad señalizado
    D: Aumentar la velocidad para pasar la escena lo más rápido posible
  answer: C
  explanation: Si un conductor no puede moverse de carril de manera segura en una
    autopista de carriles múltiples, debe reducir la velocidad por debajo del límite
    de velocidad señalizado y estar preparado para detenerse.
- id: 36
  category: driver_testing
  question: 'Bajo la ley de Consentimiento Implícito (Implied Consent) de Georgia,
    si usted se niega a someterse a pruebas químicas de sangre, aliento u orina con
    el fin de determinar si está bajo la influencia, su licencia será suspendida por
    un mínimo de:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: La negativa a someterse a las pruebas químicas administradas por el
    estado en Georgia resulta en una suspensión de la licencia por 1 año por cada
    negativa bajo la ley de Consentimiento Implícito.
- id: 37
  category: driver_testing
  question: Los nuevos residentes que se mudan a Georgia deben registrar sus vehículos
    y obtener una placa de Georgia dentro de ¿cuántos días después de establecer la
    residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Georgia exige que los nuevos residentes registren sus vehículos
    y obtengan una etiqueta o calcomanía de Georgia dentro de los 30 días posteriores
    a su mudanza al estado.
- id: 38
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en un camino del condado sin pavimentar en Georgia?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: C
  explanation: En Georgia, el límite de velocidad máximo en caminos del condado sin
    pavimentar es de 35 mph, a menos que se indique un límite de velocidad diferente.
- id: 39
  category: driver_testing
  question: En Georgia, ¿es ilegal estacionar un vehículo a menos de cuántos pies
    de un hidrante (toma de agua para incendios)?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: La ley de Georgia prohíbe estacionar a menos de 15 pies de un hidrante.
- id: 40
  category: driver_testing
  question: Según la ley de Georgia, ¿los niños menores de qué edad deben estar debidamente
    sujetos en un sistema de retención infantil (asiento de seguridad o asiento elevado)?
  choices:
    A: Menores de 6 años de edad
    B: Menores de 8 años de edad
    C: Menores de 10 años de edad
    D: Menores de 12 años de edad
  answer: B
  explanation: La ley de Georgia exige que los niños menores de 8 años de edad utilicen
    un sistema de retención infantil aprobado que sea adecuado para su altura y peso.
- id: 41
  category: driver_testing
  question: 'Una condena por arrojar basura en Georgia puede resultar en una multa
    de hasta:'
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $5,000
  answer: C
  explanation: Arrojar basura es un delito en Georgia. Las condenas pueden resultar
    en multas de hasta $1,000 y la orden de limpiar la basura en un área designada.
- id: 42
  category: driver_testing
  question: 'En Georgia, si se le condena por exceso de velocidad en una zona de obras
    viales, la multa será:'
  choices:
    A: Una tarifa fija de $500
    B: Entre $100 y $2,000
    C: Exenta para infractores por primera vez
    D: Exactamente el doble de la multa normal por exceso de velocidad
  answer: B
  explanation: El exceso de velocidad en una zona de obras en Georgia conlleva una
    multa de no menos de $100 ni más de $2,000, y también puede incluir el encarcelamiento
    por hasta 12 meses.
- id: 43
  category: driver_testing
  question: 'Al realizar el examen de habilidades de conducción de Georgia, el solicitante
    debe proporcionar un vehículo que:'
  choices:
    A: Tenga menos de 10 años de antigüedad
    B: Esté equipado con un sistema de doble freno
    C: Tenga un registro válido y comprobante de seguro
    D: Sea un vehículo de transmisión manual
  answer: C
  explanation: Para el examen práctico, el solicitante debe proporcionar un vehículo
    que sea seguro, esté debidamente registrado y tenga un comprobante de seguro válido.
- id: 44
  category: driver_testing
  question: Para una primera condena por DUI en Georgia, ¿cuál es el número mínimo
    de horas de servicio comunitario requerido para un conductor de 21 años o más
    cuyo BAC (concentración de alcohol en sangre) fue de .08 o superior?
  choices:
    A: 20 horas
    B: 40 horas
    C: 60 horas
    D: 100 horas
  answer: B
  explanation: Una primera condena por DUI en Georgia para un adulto con un BAC de
    .08 o superior requiere un mínimo de 40 horas de servicio comunitario.
- id: 45
  category: driver_testing
  question: 'El Examen de Conocimientos de Georgia consta de dos secciones: Reglas
    de la Carretera y Señales de Tránsito. ¿Cuántas preguntas hay en cada sección
    y cuál es la puntuación mínima para aprobar cada una?'
  choices:
    A: 10 preguntas; debe responder 8 correctamente
    B: 20 preguntas; debe responder 15 correctamente
    C: 25 preguntas; debe responder 20 correctamente
    D: 50 preguntas; debe responder 40 correctamente
  answer: B
  explanation: El Examen de Conocimientos de Georgia tiene dos secciones con 20 preguntas
    cada una. Debe responder correctamente al menos 15 preguntas en cada sección para
    aprobar.
- id: 46
  category: driver_testing
  question: Bajo la "Ley de Georgia de Manos Libres" (Hands-Free Georgia Act), ¿cuál
    es la multa y la evaluación de puntos por una tercera condena dentro de un período
    de 24 meses?
  choices:
    A: $100 y 2 puntos
    B: $150 y 3 puntos
    C: $250 y 4 puntos
    D: $500 y 5 puntos
  answer: B
  explanation: Una tercera condena o posterior de la Ley de Georgia de Manos Libres
    dentro de 24 meses resulta en una multa de $150 y 3 puntos en el historial de
    conducción.
- id: 47
  category: driver_testing
  question: 'De acuerdo con la "Ley del Conductor Lento" (Slow Poke Law) de Georgia,
    un conductor en el carril del extremo izquierdo en una autopista de carriles múltiples
    debe moverse a la derecha si:'
  choices:
    A: Está conduciendo exactamente al límite de velocidad indicado
    B: Está siendo alcanzado por detrás por un vehículo más rápido
    C: Es después del atardecer
    D: Está conduciendo un vehículo comercial
  answer: B
  explanation: La ley de Georgia (O.C.G.A. 40-6-184) exige que los conductores se
    muevan fuera del carril del extremo izquierdo para permitir que el tráfico más
    rápido pase, incluso si el conductor en el carril izquierdo viaja al límite de
    velocidad.
- id: 48
  category: driver_testing
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    para un vehículo de pasajeros registrado en Georgia?
  choices:
    A: $15,000/$30,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$50,000
    D: $100,000/$300,000/$50,000
  answer: B
  explanation: La ley de Georgia exige un seguro de responsabilidad civil mínimo de
    $25,000 por lesiones corporales por persona, $50,000 por lesiones corporales por
    accidente y $25,000 por daños a la propiedad.
- id: 49
  category: driver_testing
  question: Cuando un autobús escolar se detiene en una carretera con dos o más carriles
    en cada dirección y una mediana de césped o barrera física, ¿qué vehículos están
    obligados a detenerse?
  choices:
    A: Todos los vehículos en ambas direcciones
    B: Solo los vehículos que siguen al autobús
    C: Solo los vehículos que viajan en la dirección opuesta
    D: No se requiere que ningún vehículo se detenga
  answer: B
  explanation: En Georgia, si hay una barrera física o una mediana de césped que separa
    las direcciones del tráfico, solo el tráfico que sigue al autobús debe detenerse.
    Si no existe tal barrera (incluso en una carretera de carriles múltiples), todo
    el tráfico debe detenerse.
- id: 50
  category: driver_testing
  question: 'Durante el Examen de Habilidades de Conducción de Georgia, el componente
    de "Retroceso" (Backing) requiere que el solicitante haga retroceder el vehículo
    por una distancia de aproximadamente:'
  choices:
    A: 20 pies
    B: 30 pies
    C: 50 pies
    D: 100 pies
  answer: C
  explanation: El Examen de Habilidades de Conducción de Georgia requiere que el solicitante
    haga retroceder el vehículo suavemente durante unos 50 pies a baja velocidad mientras
    mira por encima del hombro.
- id: 51
  category: driver_responsibility
  question: 'En Georgia, debe informar de inmediato sobre un accidente de tráfico
    a la policía local, al alguacil del condado (sheriff) o a la Patrulla Estatal
    si el accidente resulta en lesiones, muerte o daños a la propiedad que superen
    los:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: Según el Manual del Conductor de Georgia, cualquier accidente que resulte
    en lesiones, muerte o daños a la propiedad de $500 o más debe informarse de inmediato
    a las autoridades policiales.
- id: 52
  category: driver_responsibility
  question: ¿Cuántos días tiene un nuevo residente de Georgia para registrar su vehículo
    y obtener una placa de matrícula de Georgia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes deben registrar sus vehículos y obtener una placa
    de matrícula de Georgia dentro de los 30 días posteriores al establecimiento de
    la residencia.
- id: 53
  category: driver_responsibility
  question: 'Si un conductor de Georgia es condenado por operar un vehículo motorizado
    sin un seguro válido, su licencia de conducir será suspendida por un período de:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: Una primera condena por conducir sin seguro en Georgia resulta en una
    suspensión de 60 días de la licencia de conducir.
- id: 54
  category: driver_responsibility
  question: Para restablecer una licencia de conducir de Georgia suspendida por una
    infracción de seguro por primera vez, ¿cuánto debe pagar el conductor como tarifa
    de restablecimiento (si se paga en persona)?
  choices:
    A: $100
    B: $210
    C: $310
    D: $500
  answer: B
  explanation: Para una suspensión por seguro por primera vez, la tarifa de restablecimiento
    es de $210 si se paga en persona (o $200 si se paga por correo).
- id: 55
  category: driver_responsibility
  question: La 'Ley de Hacerse a un Lado' (Move Over Law) de Georgia exige que los
    conductores se cambien a un carril contiguo, si es seguro hacerlo, al acercarse
    a ¿cuál de los siguientes vehículos estacionarios con luces intermitentes?
  choices:
    A: Solo vehículos de policía y bomberos
    B: Solo ambulancias y unidades HERO
    C: Vehículos de emergencia, vehículos de remolque y vehículos de mantenimiento
      de carreteras
    D: Solo autobuses escolares
  answer: C
  explanation: La Ley de Hacerse a un Lado se aplica a todos los vehículos de emergencia,
    vehículos de remolque y vehículos de mantenimiento de carreteras estacionarios
    que muestren luces intermitentes amarillas, ámbar, blancas, rojas o azules.
- id: 56
  category: driver_responsibility
  question: 'Si cambia su dirección dentro del estado de Georgia, debe notificar al
    Departamento de Servicios al Conductor (DDS) dentro de:'
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: La ley de Georgia exige que notifique al DDS cualquier cambio de dirección
    dentro de los 60 días posteriores a la mudanza.
- id: 57
  category: driver_responsibility
  question: 'En Georgia, el Impuesto Ad Valorem sobre el Título (TAVT) es:'
  choices:
    A: Un impuesto que se paga cada año en el cumpleaños del propietario del vehículo
    B: Una tarifa de pago único que se paga cuando el vehículo se titula a nombre
      del propietario
    C: Una tarifa mensual solo para vehículos comerciales
    D: Un impuesto que solo se aplica a vehículos de más de 25 años
  answer: B
  explanation: El TAVT es un impuesto de pago único que reemplazó al impuesto anual
    sobre las ventas y al impuesto ad valorem anual para la mayoría de los vehículos
    titulados en Georgia después del 1 de marzo de 2013.
- id: 58
  category: driver_responsibility
  question: 'Si un conductor de Georgia es condenado por arrojar basura (littering),
    podría enfrentar una multa de hasta:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: B
  explanation: Arrojar basura es un delito en Georgia. Una condena puede resultar
    en una multa de hasta $1,000 y/o 12 meses de cárcel.
- id: 59
  category: driver_responsibility
  question: En Georgia, si se ve involucrado en un accidente, la ley le exige que
    proporcione su nombre, dirección y ¿qué otra información a las otras partes involucradas?
  choices:
    A: Número de Seguro Social
    B: Número de registro del vehículo
    C: Información de contacto de su empleador
    D: Una copia de su certificado de nacimiento
  answer: B
  explanation: Los conductores involucrados en un accidente deben proporcionar su
    nombre, dirección y el número de registro del vehículo que conducen.
- id: 60
  category: driver_responsibility
  question: La ley de Georgia exige que toda persona menor de ¿qué edad esté debidamente
    sujeta en un sistema de retención para niños mientras viaja en un vehículo de
    pasajeros?
  choices:
    A: 6 años de edad
    B: 8 años de edad
    C: 10 años de edad
    D: 12 años de edad
  answer: B
  explanation: La ley de Georgia exige que todos los niños menores de 8 años de edad
    estén debidamente asegurados en un asiento de seguridad para el automóvil o un
    asiento elevado (booster seat) aprobado mientras viajan en un vehículo de pasajeros.
- id: 61
  category: driver_responsibility
  question: 'Si se le condena por una tercera infracción de la ''Ley de Manos Libres
    de Georgia'' (Hands-Free Georgia Act) en un plazo de 24 meses, la multa aumenta
    a:'
  choices:
    A: $100
    B: $150
    C: $200
    D: $500
  answer: B
  explanation: Una tercera condena o posterior por una infracción de manos libres
    en un plazo de 24 meses resulta en una multa de $150 y 3 puntos en el historial
    de conducción.
- id: 62
  category: driver_responsibility
  question: Según la ley de Georgia, ¿debe notificar inmediatamente a la agencia de
    seguridad pública más cercana sobre un accidente si los daños a la propiedad superan
    qué cantidad?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: Los conductores en Georgia están obligados a informar cualquier accidente
    que involucre lesiones, muerte o daños a la propiedad de $500 o más a la policía,
    al alguacil (sheriff) o a la Patrulla Estatal de Georgia.
- id: 63
  category: driver_responsibility
  question: 'La ''Ley de Hacerse a un Lado'' (Move-Over Law) de Georgia exige que
    los conductores se cambien a otro carril, si es seguro hacerlo, ante vehículos
    de emergencia detenidos. Si no es posible cambiarse de carril, el conductor debe:'
  choices:
    A: Detenerse por completo hasta que se le indique que puede pasar
    B: Mantener la velocidad pero tocar la bocina
    C: Reducir la velocidad a una que sea razonable y menor que el límite de velocidad
      indicado
    D: Aumentar la velocidad para rebasar el vehículo rápidamente
  answer: C
  explanation: Si un conductor no puede cambiarse de carril de manera segura, debe
    reducir la velocidad a una que sea razonable y menor que el límite de velocidad
    indicado y estar preparado para detenerse.
- id: 64
  category: driver_responsibility
  question: En Georgia, ¿qué es el 'TAVT' que debe pagarse cuando se registra el título
    de un vehículo en el estado?
  choices:
    A: Impuesto Anual Total del Vehículo
    B: Impuesto Ad Valorem sobre el Título
    C: Fondo para Víctimas de Accidentes de Tránsito
    D: Impuesto sobre el Valor de la Autoridad de Transporte
  answer: B
  explanation: El Impuesto Ad Valorem sobre el Título (TAVT) es un impuesto de pago
    único que se abona al momento de titular un vehículo en Georgia, reemplazando
    el antiguo 'impuesto de cumpleaños' anual y el impuesto sobre las ventas.
- id: 65
  category: driver_responsibility
  question: Si cambia su dirección dentro de Georgia, ¿dentro de cuántos días debe
    notificar al Departamento de Ingresos (para fines de registro de vehículos)?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: La ley de Georgia exige que los propietarios de vehículos notifiquen
    a la Oficina de Etiquetas del Condado (County Tag Office) sobre un cambio de dirección
    en un plazo de 30 días.
- id: 66
  category: driver_responsibility
  question: Para una primera condena por DUI en Georgia de un conductor de 21 años
    o más con un BAC de 0.08 o superior, ¿cuál es el periodo mínimo obligatorio de
    encarcelamiento?
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: B
  explanation: La ley de Georgia exige un mínimo de 24 horas de cárcel por una primera
    condena por DUI si el BAC del conductor era de 0.08 o superior.
- id: 67
  category: driver_responsibility
  question: Bajo la Ley de Contenedores Abiertos de Georgia, ¿cuál es la multa máxima
    para una persona condenada por poseer un contenedor abierto de una bebida alcohólica
    mientras opera un vehículo?
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: Una persona condenada por violar la Ley de Contenedores Abiertos de
    Georgia está sujeta a una multa que no excederá los $200.
- id: 68
  category: driver_responsibility
  question: En Georgia, a menudo se requiere un certificado SR-22 para demostrar la
    'responsabilidad financiera futura' después de ciertas suspensiones de licencia.
    ¿Qué es un SR-22?
  choices:
    A: Un tipo especial de permiso de conducción a alta velocidad
    B: Un documento de una compañía de seguros que certifica que el conductor tiene
      el seguro de responsabilidad civil requerido
    C: Un certificado médico para conductores comerciales
    D: Un documento de registro para vehículos antiguos
  answer: B
  explanation: Un SR-22 es un formulario emitido por una compañía de seguros al DDS,
    que certifica que un conductor tiene vigente al menos el seguro de responsabilidad
    civil mínimo requerido.
- id: 69
  category: safe_driving_rules
  question: Según la 'Ley de Hacerse a un Lado' (Move Over Law) de Georgia, ¿qué debe
    hacer un conductor al acercarse a un vehículo de emergencia autorizado que esté
    detenido con las luces intermitentes encendidas en una carretera con al menos
    dos carriles en la misma dirección?
  choices:
    A: Detenerse por completo hasta que el vehículo de emergencia se retire
    B: Cambiarse al siguiente carril si es seguro hacerlo, o reducir la velocidad
      por debajo del límite y estar preparado para detenerse
    C: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    D: Solo cambiarse de carril si el vehículo de emergencia es una ambulancia
  answer: B
  explanation: La Ley de Hacerse a un Lado de Georgia (OCGA 40-6-16) exige que los
    conductores se cambien a un carril si es posible. Si un cambio de carril es inseguro
    o imposible, el conductor debe reducir la velocidad por debajo del límite de velocidad
    indicado y estar preparado para detenerse.
- id: 70
  category: safe_driving_rules
  question: Bajo la ley 'Slow Poke' (para conductores lentos) de Georgia, ¿qué se
    requiere de un conductor en el carril del extremo izquierdo o carril 'rápido'
    de una carretera de varios carriles?
  choices:
    A: Siempre deben conducir al menos a 10 mph por encima del límite de velocidad
    B: Deben moverse a la derecha si un vehículo más rápido los alcanza por detrás,
      incluso si están viajando al límite de velocidad
    C: Pueden permanecer en el carril izquierdo siempre que vayan exactamente al límite
      de velocidad
    D: Deben permanecer en el carril izquierdo para evitar que otros excedan la velocidad
  answer: B
  explanation: La ley 'Slow Poke' de Georgia (OCGA 40-6-184) establece que en carreteras
    con dos o más carriles en la misma dirección, un conductor en el carril izquierdo
    debe moverse a la derecha si está siendo alcanzado por un vehículo más rápido,
    independientemente del límite de velocidad.
- id: 71
  category: safe_driving_rules
  question: Al realizar un giro en Georgia, ¿durante cuántos pies como mínimo debe
    un conductor activar la señal de giro de forma continua antes de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley de Georgia exige que los conductores indiquen su intención de
    girar al menos 100 pies antes del giro real.
- id: 72
  category: safe_driving_rules
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    por lesiones corporales o muerte de dos o más personas en un solo accidente en
    Georgia?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: Los requisitos mínimos de seguro de responsabilidad civil de Georgia
    son $25,000 por lesiones corporales por persona, $50,000 por lesiones corporales
    por accidente (dos o más personas) y $25,000 por daños a la propiedad.
- id: 73
  category: safe_driving_rules
  question: En Georgia, ¿cuál es la multa máxima por una condena de una infracción
    de tráfico en una zona de obras viales?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: En Georgia, la seguridad en las zonas de obras se aplica estrictamente.
    Las condenas pueden resultar en multas de hasta $2,000 y/o encarcelamiento por
    hasta 12 meses.
- id: 74
  category: safe_driving_rules
  question: En Georgia, ¿cuándo es legal realizar un giro a la izquierda con luz roja?
  choices:
    A: Nunca
    B: Solo cuando se gira desde una calle de sentido único hacia otra calle de sentido
      único
    C: En cualquier momento en que no haya tráfico en sentido contrario
    D: Solo entre las doce de la noche y las 5:00 AM
  answer: B
  explanation: En Georgia, puede realizar un giro a la izquierda en rojo solo si está
    girando desde una calle de sentido único hacia otra calle de sentido único, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 75
  category: safe_driving_rules
  question: ¿Cuántos segundos de distancia de seguimiento recomienda mantener el Manual
    del Conductor de Georgia como mínimo detrás del vehículo que va delante de usted?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Departamento de Servicios al Conductor de Georgia recomienda una
    distancia de seguimiento mínima de 3 segundos para permitir un tiempo de reacción
    seguro.
- id: 76
  category: safe_driving_rules
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (hydroplaning)
    en las carreteras mojadas de Georgia, haciendo que los neumáticos pierdan contacto
    con la superficie de la carretera?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, los neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 77
  category: safe_driving_rules
  question: En Georgia, ¿a cuántos pies del vehículo que sigue debe bajar las luces
    altas de sus faros?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Georgia exige que los conductores bajen las luces altas cuando
    se encuentren a menos de 500 pies de un vehículo que se aproxima o a menos de
    200 pies cuando sigan a otro vehículo.
- id: 78
  category: safe_driving_rules
  question: 'En Georgia, es ilegal seguir a un equipo de bomberos que responde a una
    alarma a una distancia menor de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Georgia prohíbe seguir a un camión de bomberos u otro equipo
    de bomberos que responda a una alarma a menos de 500 pies.
- id: 79
  category: safe_driving_rules
  question: Al adelantar a una bicicleta en Georgia, ¿cuál es la distancia legal mínima
    que un automovilista debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: La longitud de un automóvil
  answer: B
  explanation: La ley de Georgia exige que los automovilistas dejen al menos 3 pies
    de espacio al adelantar a un ciclista.
- id: 80
  category: safe_driving_rules
  question: Según la 'Ley Slow Poke' de Georgia, ¿qué debe hacer un conductor en el
    carril del extremo izquierdo de una carretera de varios carriles?
  choices:
    A: Mantener el límite de velocidad exacto
    B: Moverse a la derecha si un vehículo más rápido lo está alcanzando por detrás
    C: Permanecer en el carril izquierdo para evitar que otros excedan la velocidad
    D: Solo usar el carril izquierdo si conduce al menos a 10 mph por encima del límite
  answer: B
  explanation: La 'Ley Slow Poke' (O.C.G.A. § 40-6-184) exige que los conductores
    en el carril izquierdo se muevan a la derecha si un vehículo más rápido los está
    alcanzando, incluso si el conductor en el carril izquierdo está viajando al límite
    de velocidad establecido.
- id: 81
  category: safe_driving_rules
  question: ¿En Georgia, a cuántos pies de una señal de alto no se permite estacionar
    un vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Georgia prohíbe estacionar a menos de 30 pies de cualquier
    señal intermitente, señal de alto, señal de ceda el paso o señal de control de
    tráfico ubicada al costado de una carretera.
- id: 82
  category: safe_driving_rules
  question: 'En Georgia, debe bajar las luces altas cuando sigue a otro vehículo a
    una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Georgia exige que los conductores bajen las luces altas cuando
    sigan a otro vehículo a una distancia de 200 pies o menos.
- id: 83
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en una autopista interestatal rural
    en Georgia?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: El límite de velocidad máximo en las autopistas interestatales rurales
    en Georgia es de 70 mph.
- id: 84
  category: defensive_driving
  question: Según el Manual del Conductor de Georgia, ¿cuál es la distancia mínima
    de seguimiento recomendada detrás del vehículo que va delante de usted en condiciones
    de conducción ideales?
  choices:
    A: El largo de un vehículo
    B: Dos segundos
    C: Cuatro segundos
    D: El largo de cinco vehículos
  answer: B
  explanation: El Manual del Conductor de Georgia recomienda la 'regla de los dos
    segundos' para mantener una distancia de seguimiento segura en condiciones ideales.
    Esta distancia debe aumentarse durante condiciones climáticas adversas o al conducir
    de noche.
- id: 85
  category: defensive_driving
  question: En Georgia, ¿a qué velocidad pueden sus neumáticos perder todo contacto
    con la carretera durante una lluvia intensa, un fenómeno conocido como hidroplaneo
    (hydroplaning) total?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 70 mph
  answer: C
  explanation: Si bien el hidroplaneo parcial puede comenzar a las 35 mph, el Manual
    del Conductor de Georgia establece que a las 55 mph, los neumáticos pueden perder
    todo contacto con la carretera (hidroplaneo total).
- id: 86
  category: defensive_driving
  question: Bajo la 'Ley de Georgia de Manos Libres' (Hands-Free Georgia Act), ¿cuál
    de las siguientes acciones es ilegal que realice un conductor mientras opera un
    vehículo motorizado en una vía pública?
  choices:
    A: Usar una aplicación de GPS que esté montada en el tablero
    B: Sostener o apoyar físicamente un dispositivo inalámbrico con cualquier parte
      del cuerpo
    C: Usar un auricular Bluetooth de un solo oído
    D: Usar funciones de voz a texto a través de un sistema de manos libres
  answer: B
  explanation: La Ley de Georgia de Manos Libres prohíbe a los conductores sostener
    o apoyar físicamente un dispositivo de telecomunicaciones inalámbrico o un dispositivo
    electrónico independiente con cualquier parte de su cuerpo mientras conducen.
- id: 87
  category: defensive_driving
  question: La Ley 'Move Over' (Hacerse a un lado) de Georgia exige que los conductores
    se cambien a un carril contiguo, si es seguro hacerlo, ante vehículos de emergencia
    estacionados. Si un conductor no puede cambiarse de carril de manera segura, ¿qué
    debe hacer?
  choices:
    A: Detenerse en el carril de tráfico hasta que el vehículo de emergencia se retire
    B: Mantener la velocidad pero moverse al extremo izquierdo de su carril actual
    C: Reducir la velocidad a una velocidad que sea razonable y menor que el límite
      establecido
    D: Aumentar la velocidad para rebasar el vehículo de emergencia lo más rápido
      posible
  answer: C
  explanation: Si un conductor no puede cambiarse de carril de manera segura ante
    un vehículo de emergencia con luces intermitentes en el arcén, debe reducir su
    velocidad a una velocidad que sea razonable y menor que el límite de velocidad
    indicado y estar preparado para detenerse.
- id: 88
  category: defensive_driving
  question: Para practicar un escaneo adecuado, el Manual del Conductor de Georgia
    sugiere que debe mirar hacia adelante a donde estará su vehículo en ¿cuántos segundos?
  choices:
    A: 2 a 5 segundos
    B: 5 a 10 segundos
    C: 10 a 15 segundos
    D: 20 a 30 segundos
  answer: C
  explanation: La conducción defensiva en Georgia implica escanear la carretera de
    10 a 15 segundos por delante para identificar posibles peligros a tiempo.
- id: 89
  category: defensive_driving
  question: Según la ley de Georgia, los faros delanteros deben usarse durante ¿cuál
    de los siguientes períodos de tiempo?
  choices:
    A: De 6:00 PM a 6:00 AM
    B: Desde una hora después de la puesta del sol hasta una hora antes del amanecer
    C: Desde media hora después de la puesta del sol hasta media hora antes del amanecer
    D: Solo cuando esté completamente oscuro
  answer: C
  explanation: La ley de Georgia (O.C.G.A. § 40-8-20) exige que los faros estén encendidos
    desde media hora después de la puesta del sol hasta media hora antes del amanecer,
    y en cualquier momento en que esté lloviendo o la visibilidad sea limitada.
- id: 90
  category: defensive_driving
  question: 'Si su vehículo comienza a derrapar en una carretera mojada o con hielo
    en Georgia, la respuesta correcta de conducción defensiva es:'
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante en la dirección opuesta al derrape
    C: Girar el volante en la dirección en la que la parte trasera del vehículo está
      derrapando
    D: Poner el auto en punto muerto (neutral) y apagar el motor
  answer: C
  explanation: Para recuperarse de un derrape, debe soltar el acelerador y girar el
    volante en la dirección en la que la parte trasera del vehículo está derrapando.
- id: 91
  category: defensive_driving
  question: ¿Al conducir con niebla densa en Georgia, qué ajuste de los faros delanteros
    debe usar para mantener la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia (intermitentes)
  answer: B
  explanation: En la niebla, las luces altas se reflejan en las gotas de agua y causan
    deslumbramiento. Las luces bajas dirigen la luz hacia abajo y proporcionan una
    mejor visibilidad.
- id: 92
  category: defensive_driving
  question: 'En Georgia, la ley exige que tenga los faros delanteros encendidos cuando
    la visibilidad se reduce a menos de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: B
  explanation: La ley de Georgia exige el uso de faros delanteros cuando la visibilidad
    se limita a 500 pies o menos debido a la falta de luz o a condiciones atmosféricas
    desfavorables.
- id: 93
  category: defensive_driving
  question: Si se le condena por una primera infracción de la Ley de Georgia de Manos
    Libres (Hands-Free Georgia Act), ¿cuántos puntos se le asignarán a su licencia
    de conducir de Georgia?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: A
  explanation: Una primera condena por una infracción de la Ley de Georgia de Manos
    Libres resulta en 1 punto y una multa de $50. Una segunda condena es de 2 puntos
    ($100), y una tercera es de 3 puntos ($150).
- id: 94
  category: defensive_driving
  question: Al conducir en una carretera de varios carriles en Georgia y acercarse
    a una curva, ¿cuál es la forma más segura de manejar su velocidad?
  choices:
    A: Frenar bruscamente mientras está en medio de la curva
    B: Aumentar la velocidad ligeramente al entrar en la curva para mantener el impulso
    C: Reducir su velocidad antes de entrar en la curva
    D: Mantener su velocidad de carretera y usar el arcén si es necesario
  answer: C
  explanation: El Manual del Conductor de Georgia aconseja a los conductores reducir
    la velocidad antes de entrar en una curva para evitar derrapar o perder el control.
- id: 95
  category: defensive_driving
  question: En Georgia, ¿cuál es la multa de la ley 'Move Over' (Hacerse a un lado)
    para un infractor por primera vez que no se hace a un lado ante un vehículo de
    emergencia?
  choices:
    A: Hasta $100
    B: Hasta $250
    C: Hasta $500
    D: Exactamente $1,000
  answer: C
  explanation: Violar la Ley Move Over de Georgia puede resultar en una multa de hasta
    $500 por una primera infracción.
- id: 96
  category: defensive_driving
  question: 'El Manual del Conductor de Georgia advierte que el ''hidroplaneo'' (hydroplaning)
    puede comenzar a velocidades tan bajas como:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El hidroplaneo ocurre cuando los neumáticos pierden contacto con la
    superficie de la carretera y se desplazan sobre una capa de agua; esto puede comenzar
    a velocidades tan bajas como 35 mph bajo lluvia intensa.
- id: 97
  category: defensive_driving
  question: 'Para mantener una atención adecuada al conducir, el Manual del Conductor
    de Georgia sugiere que debe observar el camino por delante al menos:'
  choices:
    A: 5 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: 60 segundos
  answer: B
  explanation: Observar de 10 a 15 segundos por delante permite al conductor anticipar
    peligros y reaccionar a tiempo para evitarlos.
- id: 98
  category: defensive_driving
  question: Según la Ley 'Move Over' de Georgia, ¿qué debe hacer un conductor al acercarse
    a un vehículo de emergencia autorizado que está detenido en el arcén con luces
    intermitentes?
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Mantener la velocidad pero tocar la bocina
    C: Cambiarse al siguiente carril si es seguro hacerlo, o reducir la velocidad
      por debajo del límite de velocidad y estar preparado para detenerse
    D: Aumentar la velocidad para pasar el vehículo rápidamente
  answer: C
  explanation: La Ley Move Over exige que los conductores se cambien de carril si
    es posible. Si no es seguro cambiarse, el conductor debe reducir la velocidad
    por debajo del límite de velocidad indicado y estar preparado para detenerse.
- id: 99
  category: defensive_driving
  question: Bajo la 'Ley de Georgia de Manos Libres' (Hands-Free Georgia Act), ¿cuál
    de las siguientes acciones es legal para un conductor mayor de 21 años?
  choices:
    A: Sostener un teléfono para enviar mensajes de texto mientras está detenido en
      un semáforo en rojo
    B: Usar una aplicación de GPS mientras el teléfono está montado en el tablero
    C: Ver un video en un teléfono mientras hay mucho tráfico
    D: Grabar un video mientras conduce
  answer: B
  explanation: Los conductores pueden usar el GPS o las funciones de voz a texto si
    el dispositivo está montado o se usa con manos libres, pero no pueden sostener
    ni apoyar el dispositivo con ninguna parte de su cuerpo.
- id: 100
  category: defensive_driving
  question: 'La ''Ley Slow Poke'' de Georgia (HB 459) exige que los conductores en
    el carril del extremo izquierdo en carreteras de varios carriles:'
  choices:
    A: Conducir exactamente al límite de velocidad en todo momento
    B: Moverse a la derecha si están siendo alcanzados por un vehículo más rápido,
      incluso si viajan al límite de velocidad
    C: Permanecer en el carril izquierdo para evitar que otros excedan la velocidad
    D: Solo usar el carril izquierdo para salidas a la izquierda
  answer: B
  explanation: La 'Ley Slow Poke' dicta que los conductores más lentos deben salirse
    del carril de rebase (carril izquierdo) para permitir que el tráfico más rápido
    pase, independientemente del límite de velocidad.
- id: 101
  category: defensive_driving
  question: 'Al conducir con niebla densa en Georgia, debe usar:'
  choices:
    A: Luces altas
    B: Luces bajas
    C: Luces de estacionamiento solamente
    D: Luces de emergencia (hazard flashers) solamente
  answer: B
  explanation: Las luces bajas deben usarse con niebla porque las luces altas se reflejan
    en la humedad del aire, lo que provoca deslumbramiento y dificulta la visión.
- id: 102
  category: defensive_driving
  question: 'Si su vehículo comienza a derrapar en una carretera resbaladiza de Georgia,
    debe:'
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante en la dirección opuesta al derrape
    C: Retirar suavemente el pie del acelerador y girar el volante en la dirección
      en que derrapa la parte trasera del vehículo
    D: Poner el vehículo en punto muerto (neutral) y apagar el motor
  answer: C
  explanation: Para recuperarse de un derrape, retire el pie del acelerador y gire
    el volante en la dirección en que se desliza la parte trasera del automóvil.
- id: 103
  category: defensive_driving
  question: Al conducir un vehículo sin frenos antibloqueo (ABS) en una carretera
    resbaladiza, ¿cómo debe detenerse en una emergencia?
  choices:
    A: Presionar el pedal del freno lo más fuerte posible y mantenerlo presionado
    B: Bombear los frenos suavemente
    C: Usar solo el freno de mano (estacionamiento) de emergencia
    D: Cambiar a una marcha más alta
  answer: B
  explanation: En vehículos sin ABS, bombear los frenos ayuda a evitar que las ruedas
    se bloqueen y permite mantener el control de la dirección.
- id: 104
  category: defensive_driving
  question: 'En Georgia, al acercarse a un cruce de ferrocarril con luces de señalización
    intermitentes, debe detener su vehículo a una distancia de:'
  choices:
    A: Entre 5 y 10 pies del riel más cercano
    B: Entre 15 y 50 pies del riel más cercano
    C: Entre 50 y 100 pies del riel más cercano
    D: Exactamente a 25 pies del riel más cercano
  answer: B
  explanation: La ley de Georgia exige que los conductores se detengan a una distancia
    de entre 15 y 50 pies del riel más cercano en un cruce de ferrocarril cuando las
    señales indiquen que se aproxima un tren.
- id: 105
  category: defensive_driving
  question: 'Si conduce por una autopista de Georgia y se revienta un neumático, debe:'
  choices:
    A: Frenar rápida y firmemente
    B: Sujetar el volante con firmeza y retirar el pie del acelerador
    C: Salir inmediatamente al arcén (hombro) a alta velocidad
    D: Girar el volante bruscamente hacia el lado del reventón
  answer: B
  explanation: En caso de un reventón, debe mantener el control sujetando el volante,
    evitar frenar hasta que el vehículo haya disminuido la velocidad y luego salir
    de la carretera.
- id: 106
  category: defensive_driving
  question: 'En Georgia, las multas por exceso de velocidad en ''Zonas de Trabajo''
    (Work Zones) son:'
  choices:
    A: Las mismas que las multas normales por exceso de velocidad
    B: Exoneradas si no hay trabajadores presentes
    C: Aumentadas, y pueden resultar en una multa de hasta $2,000 y comparecencia
      obligatoria ante el tribunal
    D: Reducidas si tiene un historial de conducción limpio
  answer: C
  explanation: La ley de Georgia impone sanciones severas por exceso de velocidad
    en zonas de trabajo para proteger a los trabajadores de la carretera, incluyendo
    multas de hasta $2,000 y posible tiempo en la cárcel.
- id: 107
  category: alcohol_drugs_health
  question: 'En Georgia, se considera que una persona de 21 años o más conduce bajo
    los efectos del alcohol o drogas (DUI) si su concentración de alcohol en sangre
    (BAC) es igual o superior a:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: Según la ley de Georgia (O.C.G.A. § 40-6-391), es ilegal que cualquier
    persona de 21 años o más conduzca o tenga el control físico real de cualquier
    vehículo en movimiento mientras su concentración de alcohol sea de 0.08 gramos
    o más.
- id: 108
  category: alcohol_drugs_health
  question: Bajo la ley de 'Consentimiento Implícito' (Implied Consent) de Georgia,
    ¿cuál es la sanción por negarse a someterse a una prueba química administrada
    por el estado de su sangre, aliento u orina?
  choices:
    A: Una multa de $500 y 2 puntos en su licencia
    B: Su licencia de conducir será suspendida por un mínimo de un año
    C: Una sentencia de cárcel obligatoria de 48 horas
    D: Su vehículo será confiscado por 30 días
  answer: B
  explanation: La ley de Consentimiento Implícito de Georgia significa que, al conducir
    por las carreteras de Georgia, usted acepta someterse a pruebas químicas si se
    sospecha de DUI. La negativa resulta en una suspensión mínima de un año de su
    licencia de conducir.
- id: 109
  category: alcohol_drugs_health
  question: En Georgia, ¿cuál es la multa máxima por una condena de DUI por primera
    vez (excluyendo costos judiciales y recargos)?
  choices:
    A: Hasta $500
    B: Hasta $1,000
    C: Hasta $2,500
    D: Hasta $5,000
  answer: B
  explanation: Una primera condena por DUI en Georgia conlleva una multa que oscila
    entre $300 y $1,000, más las tasas judiciales y los recargos correspondientes.
- id: 110
  category: alcohol_drugs_health
  question: ¿Una persona condenada por DUI mientras transporta a un niño menor de
    qué edad también será acusada de 'Poner en peligro a un niño por DUI' (DUI Child
    Endangerment) en Georgia?
  choices:
    A: Menor de 12 años
    B: Menor de 14 años
    C: Menor de 16 años
    D: Menor de 18 años
  answer: B
  explanation: En Georgia, transportar a un niño menor de 14 años mientras se conduce
    bajo los efectos del alcohol o drogas es un delito independiente conocido como
    DUI Child Endangerment, el cual conlleva sanciones adicionales.
- id: 111
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    una persona que opera un Vehículo Motorizado Comercial (CMV) en Georgia?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Para los operadores de vehículos motorizados comerciales en Georgia,
    el límite legal de BAC es más estricto, de 0.04%.
- id: 112
  category: alcohol_drugs_health
  question: En Georgia, si se le condena por un segundo DUI en un período de 5 años,
    ¿cuál es el tiempo mínimo obligatorio de cárcel?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 10 días
  answer: C
  explanation: Una segunda condena por DUI en un plazo de cinco años en Georgia requiere
    un mínimo de 72 horas de cárcel, aunque la sentencia total puede ser de hasta
    12 meses.
- id: 113
  category: alcohol_drugs_health
  question: La 'Ley de Contenedor Abierto' de Georgia prohíbe la posesión de cualquier
    contenedor de bebida alcohólica abierto en el área de pasajeros de un vehículo
    motorizado. ¿Cuál es la multa máxima por violar esta ley?
  choices:
    A: Hasta $100
    B: Hasta $200
    C: Hasta $500
    D: Hasta $1,000
  answer: B
  explanation: Una violación de la Ley de Contenedor Abierto de Georgia es sancionable
    con una multa que no exceda los $200.
- id: 114
  category: alcohol_drugs_health
  question: ¿Cuál es uno de los requisitos para restablecer una licencia de conducir
    de Georgia después de una suspensión por DUI?
  choices:
    A: Repetir únicamente el examen de habilidades de conducción
    B: Completar un Programa de Reducción de Riesgos por Uso de Alcohol o Drogas (DUI)
      aprobado por el DDS
    C: Esperar 5 años independientemente de la infracción
    D: Pagar una tarifa de restablecimiento de $1,000 por una primera infracción
  answer: B
  explanation: Para restablecer una licencia después de una suspensión por DUI en
    Georgia, el conductor debe completar un Programa de Reducción de Riesgos certificado
    (Escuela de DUI) y pagar la tarifa de restablecimiento requerida.
- id: 115
  category: alcohol_drugs_health
  question: 'En Georgia, un conductor puede ser condenado por DUI incluso si su BAC
    es inferior al 0.08% si:'
  choices:
    A: Conduce un auto rojo
    B: Está involucrado en cualquier accidente
    C: Es 'menos seguro' (less safe) para conducir debido al consumo de alcohol
    D: Lleva un pasajero en el vehículo
  answer: C
  explanation: La ley de Georgia permite una condena por 'DUI Menos Seguro' (DUI Less
    Safe) si se puede demostrar que la capacidad del conductor para operar el vehículo
    de manera segura se vio afectada por el alcohol o las drogas, independientemente
    del nivel específico de BAC.
- id: 116
  category: alcohol_drugs_health
  question: 'Según la ley de Georgia, una tercera condena por DUI en un período de
    cinco años resultará en que el conductor sea declarado:'
  choices:
    A: Delincuente de Felonía
    B: Infractor Habitual
    C: Conductor de Alto Riesgo
    D: Conductor en Libertad Condicional
  answer: B
  explanation: Una persona que es condenada por tres DUI en un período de cinco años
    en Georgia es declarada 'Infractor Habitual' (Habitual Violator), lo que conlleva
    una revocación de la licencia por cinco años.
- id: 117
  category: alcohol_drugs_health
  question: 'Si un conductor de Georgia menor de 21 años es condenado por DUI con
    un BAC de 0.08% o superior, su licencia será suspendida por:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Para conductores menores de 21 años, un BAC de 0.02% a 0.08% resulta
    en una suspensión de 6 meses, pero un BAC de 0.08% o superior resulta en una suspensión
    de 12 meses.
- id: 118
  category: alcohol_drugs_health
  question: 'En Georgia, el uso de medicamentos recetados mientras se conduce es:'
  choices:
    A: Siempre legal si tiene una receta válida
    B: Solo ilegal si el medicamento es un narcótico
    C: Ilegal si el medicamento hace que el conductor sea 'menos seguro' para conducir
    D: Solo ilegal si se mezcla con alcohol
  answer: C
  explanation: Tener una receta médica no es una defensa contra el DUI en Georgia.
    Si un medicamento recetado o de venta libre afecta su capacidad de conducción,
    puede ser acusado de DUI.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la marihuana
    y la conducción en Georgia?
  choices:
    A: Es legal conducir si tiene una tarjeta de marihuana medicinal
    B: Solo es ilegal si su BAC también es superior al 0.05%
    C: Georgia tiene una política de tolerancia cero para cualquier cantidad de drogas
      ilegales en el sistema de un conductor
    D: Solo se le puede acusar si se le sorprende fumando mientras conduce
  answer: C
  explanation: La ley de Georgia (O.C.G.A. § 40-6-391) prohíbe conducir con cualquier
    cantidad de marihuana u otras sustancias controladas en la sangre u orina, independientemente
    de si fue recetada legalmente en otro estado.
- id: 120
  category: alcohol_drugs_health
  question: Si se le condena por un primer DUI en Georgia y su BAC era de 0.08% o
    superior, ¿cuál es el tiempo mínimo obligatorio de cárcel que no puede ser aplazado
    ni suspendido?
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: B
  explanation: Para una primera condena por DUI con un BAC de 0.08% o superior, la
    ley de Georgia exige un mínimo de 24 horas de cárcel.
- id: 121
  category: alcohol_drugs_health
  question: 'En Georgia, si es condenado por un segundo DUI en un período de 5 años,
    se le requiere instalar un dispositivo de interbloqueo de encendido (ignition
    interlock device) en su vehículo por un mínimo de:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 24 meses
    D: 5 años
  answer: B
  explanation: Para una segunda condena por DUI en un plazo de cinco años, la ley
    de Georgia exige la instalación de un dispositivo de interbloqueo de encendido
    durante al menos 12 meses como parte del proceso de restablecimiento de la licencia.
- id: 122
  category: alcohol_drugs_health
  question: 'En Georgia, una persona puede ser acusada de ''Poner en peligro a un
    niño por DUI'' (DUI Child Endangerment) si conduce bajo la influencia con un niño
    en el automóvil menor de:'
  choices:
    A: '12'
    B: '14'
    C: '16'
    D: '18'
  answer: B
  explanation: El código O.C.G.A. § 40-6-391(l) establece que transportar a un niño
    menor de 14 años mientras se conduce bajo la influencia (DUI) es un delito separado
    de poner en peligro a un niño, lo cual también cuenta como un DUI adicional para
    fines de suspensión de la licencia.
- id: 123
  category: alcohol_drugs_health
  question: ¿A un conductor de Georgia se le declarará como 'Infractor Habitual' (Habitual
    Violator) y se le revocará la licencia por 5 años si recibe cuántas condenas por
    DUI en un período de 5 años?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Según la ley de Georgia, tres condenas por DUI (u otros delitos graves)
    en un período de cinco años resultan en el estatus de Infractor Habitual y una
    revocación de la licencia por cinco años.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es la tarifa estándar de restablecimiento de la licencia para una
    primera condena por DUI en Georgia si se procesa por correo?
  choices:
    A: $100
    B: $150
    C: $210
    D: $500
  answer: C
  explanation: La tarifa de restablecimiento para una primera suspensión por DUI en
    Georgia es de $210 por correo o $200 si se realiza en persona.
- id: 125
  category: alcohol_drugs_health
  question: 'Para una segunda o subsiguiente condena por DUI en Georgia, el conductor
    debe completar una evaluación clínica de:'
  choices:
    A: Visión y audición
    B: Abuso de sustancias
    C: Manejo de la ira
    D: Conducción defensiva
  answer: B
  explanation: La ley de Georgia exige una evaluación clínica por abuso de sustancias
    (y un posible tratamiento) para todos los infractores con una segunda o subsiguiente
    condena por DUI antes del restablecimiento de la licencia.
- id: 126
  category: alcohol_drugs_health
  question: 'Si un conductor de Georgia es condenado por cualquier delito relacionado
    con drogas (posesión, venta, etc.), incluso si no involucró un vehículo motorizado,
    su licencia de conducir será:'
  choices:
    A: Suspendida por ministerio de ley
    B: Sin cambios, ya que no fue un delito de conducción
    C: Suspendida solo si era menor de 21 años
    D: Restringida solo a la conducción diurna
  answer: A
  explanation: En Georgia, una condena por cualquier delito de sustancias controladas
    o marihuana resulta en una suspensión obligatoria de la licencia de conducir,
    independientemente de si hubo un vehículo involucrado.
- id: 127
  category: alcohol_drugs_health
  question: De acuerdo con los requisitos médicos del DDS de Georgia, ¿cuánto tiempo
    debe pasar usualmente una persona con un trastorno de convulsiones sin tener convulsiones
    antes de que se le pueda otorgar la licencia para conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Georgia generalmente requiere que las personas con antecedentes de
    convulsiones estén libres de ellas durante al menos 6 meses, respaldado por una
    recomendación médica, para mantener los privilegios de conducción.
- id: 128
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de mezclar alcohol y drogas (incluso medicamentos de
    venta libre) en la capacidad de conducción?
  choices:
    A: Los efectos se cancelan entre sí.
    B: No hay ningún efecto adicional.
    C: El efecto a menudo se multiplica (efecto sinérgico).
    D: Solo importa si el alcohol supera el límite del 0.08%.
  answer: C
  explanation: Combinar alcohol y drogas puede producir un efecto sinérgico, lo que
    significa que el impacto combinado en el sistema nervioso central es mucho mayor
    que la suma de los efectos individuales, perjudicando gravemente la conducción.
- id: 129
  category: penalties_and_points
  question: Bajo la ley de 'Manos Libres' (Hands-Free) de Georgia, ¿cuál es la penalización
    de puntos por una primera condena por operar un vehículo motorizado mientras se
    sostiene o sujeta un dispositivo de telecomunicaciones inalámbrico?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 0 puntos, solo una multa
  answer: A
  explanation: Una primera condena de la Ley de Georgia de Manos Libres resulta en
    1 punto en el historial de conducción y una multa de $50.
- id: 130
  category: penalties_and_points
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil por daños
    a la propiedad requerido por la ley para un vehículo motorizado registrado en
    Georgia?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Georgia exige un seguro de responsabilidad civil mínimo de
    $25,000 por lesiones corporales por persona, $50,000 por lesiones corporales por
    accidente y $25,000 por daños a la propiedad.
- id: 131
  category: penalties_and_points
  question: ¿Si un conductor no paga la tarifa estatal de $200 por 'Super Speeder'
    dentro de los 120 días posteriores a la notificación, cuál es la consecuencia
    en Georgia?
  choices:
    A: La multa se duplica a $400
    B: Se emite una orden de arresto
    C: Suspensión de la licencia y una tarifa adicional de $50 por restablecimiento
    D: El registro del vehículo se revoca permanentemente
  answer: C
  explanation: El incumplimiento del pago de la tarifa de Super Speeder dentro de
    los 120 días posteriores a la notificación resultará en la suspensión de la licencia
    de conducir o de los privilegios de conducción y requerirá una tarifa de restablecimiento
    de $50.
- id: 132
  category: penalties_and_points
  question: En Georgia, ¿una condena por 'Conducción Temeraria' (Reckless Driving)
    resulta en cuántos puntos añadidos a su historial de conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: La conducción temeraria es una infracción grave en Georgia y conlleva
    una penalización de 4 puntos en la licencia de conducir.
- id: 133
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera infracción de la ley 'Move Over'
    (hacerse a un lado) de Georgia?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Violar la ley Move Over de Georgia, que exige que los conductores se
    muevan de carril ante vehículos de emergencia, puede resultar en una multa de
    hasta $500.
- id: 134
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una primera condena de 'Uso inadecuado
    de un sistema de retención infantil' (por ejemplo, un niño que no está en un asiento
    de seguridad) en Georgia?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 0 puntos
  answer: A
  explanation: Una primera condena por uso inadecuado de un sistema de retención infantil
    resulta en 1 punto. Una segunda condena o posterior resulta en 2 puntos.
- id: 135
  category: penalties_and_points
  question: En Georgia, ¿cuál es la tarifa estándar para restablecer una licencia
    de conducir después de una primera suspensión por acumulación de puntos si se
    tramita en persona?
  choices:
    A: $100
    B: $150
    C: $210
    D: $300
  answer: C
  explanation: La tarifa de restablecimiento para una primera suspensión (por puntos
    u otras infracciones generales) es de $210 cuando se paga en persona, o de $200
    si se paga por correo.
- id: 136
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una cuarta condena o posterior de 'Uso
    inadecuado de un carril para vehículos de alta ocupación (HOV)' en Georgia?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: A
  explanation: Aunque las tres primeras infracciones de HOV no conllevan puntos, una
    cuarta condena o posterior resulta en la adición de 1 punto al historial de conducción.
- id: 137
  category: penalties_and_points
  question: En Georgia, ¿exceder el límite de velocidad de 15 mph a 18 mph por encima
    del límite señalizado resultará en cuántos puntos?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Exceder el límite de velocidad entre 15 y 18 mph resulta en 2 puntos
    en el historial de conducción de Georgia.
- id: 138
  category: penalties_and_points
  question: ¿Cuál es la penalización de puntos para un conductor de Georgia condenado
    por exceder el límite de velocidad en 34 mph o más?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Exceder el límite de velocidad en 34 mph o más es el nivel más alto
    de puntos por exceso de velocidad en Georgia, lo que resulta en 6 puntos.
- id: 139
  category: penalties_and_points
  question: Para un conductor de Georgia menor de 18 años, ¿su licencia será suspendida
    si acumula cuántos puntos en un período de 12 meses?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 15 puntos
  answer: B
  explanation: La licencia de cualquier persona menor de 18 años será suspendida si
    acumula 4 o más puntos en cualquier período de 12 meses.
- id: 140
  category: penalties_and_points
  question: En Georgia, ¿cuántos puntos se asignan a su licencia de conducir por una
    condena de exceso de velocidad de 24 millas por hora pero menos de 34 millas por
    hora sobre el límite de velocidad?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 6 puntos
  answer: B
  explanation: Según el sistema de puntos del DDS de Georgia, exceder el límite de
    velocidad entre 24 y 33 mph resulta en 4 puntos.
- id: 141
  category: penalties_and_points
  question: ¿Bajo la Ley de Manos Libres de Georgia (Hands-Free Georgia Act), cuál
    es la multa por una segunda condena por usar un dispositivo inalámbrico portátil
    mientras conduce dentro de un período de 24 meses?
  choices:
    A: Hasta $50
    B: Hasta $100
    C: Hasta $150
    D: Hasta $200
  answer: B
  explanation: Una segunda condena dentro de los 24 meses por violar la Ley de Manos
    Libres de Georgia resulta en una multa de $100.00 y 2 puntos en el historial de
    conducción.
- id: 142
  category: penalties_and_points
  question: Para una primera condena por DUI en Georgia, si la concentración de alcohol
    en sangre (BAC) del conductor era de .08 o superior, ¿cuál es el período mínimo
    obligatorio de encarcelamiento?
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: B
  explanation: Para una primera condena por DUI con un BAC de .08 o superior, la ley
    de Georgia exige un mínimo obligatorio de 24 horas en la cárcel.
- id: 143
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan al historial de un conductor de Georgia por
    una primera condena por no sujetar adecuadamente a un niño menor de 8 años en
    un vehículo de pasajeros?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: A
  explanation: Una primera condena por una violación de los sistemas de retención
    infantil en Georgia resulta en 1 punto. Las condenas posteriores resultan en 2
    puntos.
- id: 144
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una condena por poseer un contenedor abierto
    de una bebida alcohólica mientras se conduce en Georgia?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: La posesión de un contenedor abierto de una bebida alcohólica mientras
    se conduce resulta en 2 puntos en el historial de conducción de Georgia.
- id: 145
  category: penalties_and_points
  question: 'Violar la Ley de "Hacerse a un lado" (Move Over Law) de Georgia, que
    requiere que los conductores se muevan de carril ante vehículos de emergencia
    detenidos con luces intermitentes, puede resultar en una multa de hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Una violación de la Ley Move Over de Georgia es una infracción de tráfico
    sancionable con una multa de hasta $500.
- id: 146
  category: penalties_and_points
  question: Para reinstaurar una licencia de conducir de Georgia después de una primera
    suspensión por DUI, el conductor debe pagar una tarifa de reinstalación de _______
    si paga en persona.
  choices:
    A: $100
    B: $150
    C: $200
    D: $210
  answer: C
  explanation: La tarifa de reinstalación para una primera suspensión por DUI en Georgia
    es de $210 por correo o $200 si se realiza en persona o en línea.
- id: 147
  category: sharing_the_road
  question: En Georgia, ¿cuándo NO es obligatorio detenerse ante un autobús escolar
    que está detenido con sus luces rojas intermitentes y subiendo o bajando pasajeros?
  choices:
    A: Cuando viaja en la dirección opuesta en una carretera de dos carriles.
    B: Cuando viaja en la dirección opuesta en una carretera con un carril central
      para girar.
    C: Cuando viaja en la dirección opuesta en una carretera dividida por una mediana
      de césped o concreto.
    D: Siempre debe detenerse ante un autobús escolar, independientemente del tipo
      de carretera.
  answer: C
  explanation: Según la ley de Georgia, los conductores que viajan en la dirección
    opuesta a un autobús escolar solo están exentos de detenerse si la carretera está
    separada por una barrera física o una mediana de césped o sin pavimentar. Un carril
    central para girar no se considera una barrera física.
- id: 148
  category: sharing_the_road
  question: 'La ley de Georgia de "Detenerse y permanecer detenido" para peatones
    exige que los conductores se detengan y permanezcan detenidos ante un peatón en
    un paso de peatones cuando:'
  choices:
    A: El peatón se encuentra en cualquier lugar de toda la calzada.
    B: El peatón se encuentra a menos de un carril de la mitad de la calzada por la
      que circula el vehículo.
    C: El peatón ha llegado al centro de la carretera.
    D: Solo si el peatón utiliza un bastón blanco o un perro guía.
  answer: B
  explanation: La ley de Georgia exige que los conductores se detengan y permanezcan
    detenidos ante los peatones que se encuentren a menos de un carril de la mitad
    de la calzada del conductor.
- id: 149
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es VERDADERA con respecto a la "división
    de carril" (lane splitting) de motocicletas (operar entre filas de vehículos detenidos
    o en movimiento) en Georgia?
  choices:
    A: Es legal si la motocicleta viaja a menos de 15 mph.
    B: Es legal solo en autopistas interestatales de varios carriles.
    C: Es ilegal en el estado de Georgia.
    D: Es legal solo durante las horas pico de tráfico.
  answer: C
  explanation: En Georgia, la división de carril (lane splitting) es ilegal. Los motociclistas
    tienen derecho al uso completo de un carril, y ningún vehículo de motor debe conducirse
    de manera que prive a cualquier motocicleta del uso completo de un carril.
- id: 150
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen "Zonas No" (No-Zones). ¿Dónde
    se encuentran estos puntos ciegos?
  choices:
    A: Directamente detrás del camión y directamente delante del camión.
    B: Solo en el lado derecho del camión.
    C: Solo en el lado izquierdo del camión.
    D: En la parte delantera, la trasera y en ambos lados del camión.
  answer: D
  explanation: Las "Zonas No" son los grandes puntos ciegos alrededor de un camión
    donde el conductor no puede ver a otros vehículos. Estos se encuentran en la parte
    delantera, la trasera y en ambos lados (especialmente el lado derecho).
- id: 151
  category: sharing_the_road
  question: ¿Cuándo un autobús escolar se detiene en una carretera con un carril central
    para girar y sin mediana física, qué conductores deben detenerse?
  choices:
    A: Solo los conductores que siguen al autobús.
    B: Solo los conductores en el carril central para girar.
    C: Los conductores en todos los carriles y en ambas direcciones.
    D: Nadie está obligado a detenerse si hay más de dos carriles.
  answer: C
  explanation: Si no hay una mediana física (como césped o un muro), todo el tráfico
    en ambas direcciones debe detenerse ante un autobús escolar con sus luces rojas
    intermitentes y el brazo de parada extendido, incluso si hay un carril central
    para girar.
- id: 152
  category: sharing_the_road
  question: 'Según la ley de Georgia, una persona que monta en bicicleta tiene todos
    los derechos y deberes del conductor de un vehículo, EXCEPTO:'
  choices:
    A: No tienen que obedecer las señales de tráfico.
    B: No están obligados a señalar los giros.
    C: Disposiciones que por su naturaleza no pueden tener aplicación (como las leyes
      del cinturón de seguridad).
    D: Pueden circular por la acera en cualquier ciudad independientemente de su edad.
  answer: C
  explanation: Los ciclistas deben seguir las mismas normas de circulación que los
    conductores de vehículos motorizados, excepto aquellas normas que físicamente
    no pueden aplicarse a una bicicleta.
- id: 153
  category: sharing_the_road
  question: 'Al acercarse a una persona que cruza la calle con un bastón blanco o
    un perro guía, la ley de Georgia le exige:'
  choices:
    A: Tocar la bocina para avisarles que usted está allí.
    B: Detenerse y tomar todas las precauciones necesarias para evitar lesiones al
      peatón.
    C: Conducir alrededor de ellos lentamente si hay espacio.
    D: Esperar a que le indiquen con la mano que puede pasar.
  answer: B
  explanation: La ley de Georgia (O.C.G.A. § 40-6-94) establece que los conductores
    deben tomar todas las precauciones necesarias para evitar lesiones a cualquier
    peatón ciego que lleve un bastón blanco o utilice un perro guía.
- id: 154
  category: sharing_the_road
  question: En Georgia, ¿cuál de los siguientes requisitos es obligatorio para todos
    los conductores y pasajeros de motocicletas?
  choices:
    A: Deben usar un casco aprobado por el Comisionado de Seguridad Pública.
    B: Deben usar chaquetas de cuero.
    C: Deben tener un asiento para pasajeros para transportar a un pasajero.
    D: Tanto A como C
  answer: D
  explanation: La ley de Georgia exige que todos los motociclistas usen casco y, si
    transportan a un pasajero, la motocicleta debe estar equipada con un asiento permanente
    y reposapiés para ese pasajero.
- id: 155
  category: sharing_the_road
  question: 'Cuando un camión comercial está haciendo un giro a la derecha en una
    intersección, un conductor debe:'
  choices:
    A: Intentar meterse entre el camión y el bordillo.
    B: Rebasar al camión por la izquierda antes de que complete el giro.
    C: Mantenerse atrás y darle al camión suficiente espacio para completar el giro.
    D: Tocar la bocina para que el conductor del camión sepa que usted está en su
      punto ciego.
  answer: C
  explanation: Los camiones a menudo necesitan abrirse hacia la izquierda para hacer
    un giro a la derecha. Los conductores nunca deben intentar meterse entre el camión
    y el bordillo, ya que el conductor del camión no puede verle y usted podría ser
    aplastado.
- id: 156
  category: sharing_the_road
  question: En Georgia, ¿cómo es el emblema de 'Vehículo de Movimiento Lento'?
  choices:
    A: Un círculo azul con un borde blanco.
    B: Un emblema triangular naranja con un borde rojo reflectante.
    C: Una señal cuadrada amarilla con letras negras.
    D: Una señal redonda verde con una 'X' blanca.
  answer: B
  explanation: Un vehículo de movimiento lento (que viaja a 25 mph o menos) debe exhibir
    un emblema triangular naranja con un borde rojo reflectante en la parte trasera
    del vehículo.
- id: 157
  category: sharing_the_road
  question: 'Si usted sigue a un equipo de bomberos (camión de bomberos) que responde
    a una alarma de incendio, la ley de Georgia le prohíbe seguirlo a una distancia
    menor de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Según O.C.G.A. § 40-6-247, es ilegal seguir a cualquier equipo de bomberos
    que responda a una alarma a menos de 500 pies o conducir o estacionar dentro de
    la cuadra donde el equipo de bomberos se ha detenido en respuesta a una alarma
    de incendio.
- id: 158
  category: sharing_the_road
  question: Con respecto al uso de carriles para motocicletas en Georgia, ¿cuál de
    las siguientes afirmaciones es VERDADERA?
  choices:
    A: A las motocicletas se les permite 'dividir carriles' (lane split) entre filas
      de autos detenidos
    B: Se permite que dos motocicletas operen una al lado de la otra en un solo carril
    C: Las motocicletas siempre deben circular por el arcén de la carretera
    D: Las motocicletas solo pueden usar la mitad izquierda de un carril de circulación
  answer: B
  explanation: En Georgia, las motocicletas tienen derecho al uso total de un carril,
    y dos motocicletas pueden circular legalmente una al lado de la otra en un solo
    carril. Dividir carriles (circular entre carriles) es ilegal.
- id: 159
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con luces azules o rojas intermitentes
    y una sirena se aproxima desde cualquier dirección en una carretera de dos carriles,
    un conductor en Georgia debe:'
  choices:
    A: Reducir la velocidad y seguir conduciendo
    B: Detenerse en el borde derecho de la carretera y parar
    C: Detenerse exactamente donde está en el carril
    D: Encender las luces de emergencia y aumentar la velocidad
  answer: B
  explanation: Ante la aproximación de un vehículo de emergencia con luces y sirenas
    activadas, la ley de Georgia exige que los conductores cedan el paso acercándose
    lo más posible al borde o bordillo derecho y deteniéndose.
- id: 160
  category: sharing_the_road
  question: En una carretera de dos carriles sin mediana, ¿qué debe hacer un conductor
    cuando un autobús escolar se detiene y activa sus luces rojas intermitentes y
    su brazo de 'parada'?
  choices:
    A: Solo el tráfico que sigue al autobús debe detenerse
    B: Solo el tráfico que viene en sentido contrario al autobús debe detenerse
    C: El tráfico en ambas direcciones debe detenerse
    D: Los conductores pueden pasar a 15 mph si no hay niños visibles
  answer: C
  explanation: En cualquier carretera de dos carriles, o cualquier carretera sin una
    mediana física, todo el tráfico de ambas direcciones debe detenerse ante un autobús
    escolar que esté cargando o descargando pasajeros.
- id: 161
  category: sharing_the_road
  question: En Georgia, ¿están obligados los ciclistas a seguir las mismas leyes de
    tránsito que los conductores de vehículos motorizados?
  choices:
    A: No, se consideran peatones
    B: Sí, las bicicletas se consideran legalmente vehículos
    C: Solo cuando circulan por la acera
    D: Solo cuando circulan por autopistas
  answer: B
  explanation: En Georgia, las bicicletas se consideran legalmente vehículos. Los
    ciclistas tienen los mismos derechos y responsabilidades en la carretera que los
    conductores de vehículos motorizados, incluyendo obedecer las señales y los signos
    de tránsito.
- id: 162
  category: sharing_the_road
  question: 'Cuando vea a un peatón que lleva un bastón blanco o usa un perro guía
    en una intersección, usted debe:'
  choices:
    A: Tocar la bocina para avisarles que usted está allí
    B: Conducir alrededor de ellos si hay espacio
    C: Detenerse y permanecer detenido hasta que el peatón haya cruzado toda la calzada
    D: Esperar a que crucen su carril y luego continuar
  answer: C
  explanation: La ley de Georgia exige que los conductores cedan el paso a cualquier
    peatón ciego. Debe detenerse y permanecer detenido hasta que hayan cruzado con
    seguridad toda la calzada.
- id: 163
  category: sharing_the_road
  question: ¿Por qué debe evitar seguir a un camión grande demasiado de cerca?
  choices:
    A: El escape del camión dañará su motor
    B: Estará en el punto ciego trasero del conductor del camión (No-Zone)
    C: Los camiones están obligados a detenerse en todos los cruces ferroviarios
    D: Es ilegal conducir detrás de un camión por más de 5 millas
  answer: B
  explanation: Seguir a un camión demasiado de cerca lo sitúa en la "Zona Prohibida"
    (No-Zone) trasera, donde el conductor del camión no puede verlo. Esto también
    limita su propia visión de la carretera por delante.
- id: 164
  category: sharing_the_road
  question: ¿Cuál de los siguientes es un requisito legal para los motociclistas en
    Georgia?
  choices:
    A: Los cascos solo son obligatorios para conductores menores de 21 años
    B: Los cascos son opcionales si el conductor tiene seguro
    C: Todos los conductores y pasajeros deben usar un casco aprobado por el DOT
    D: Los cascos solo son obligatorios en las autopistas interestatales
  answer: C
  explanation: La ley de Georgia exige que todos los operadores y pasajeros de una
    motocicleta usen un casco protector que cumpla con los estándares del DOT (Departamento
    de Transporte).
- id: 165
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a los cortejos fúnebres en Georgia?
  choices:
    A: Los cortejos deben ceder el paso a todo el resto del tráfico
    B: Los cortejos tienen el derecho de paso en las intersecciones independientemente
      de las señales de tráfico, si son guiados por un vehículo policial
    C: Los cortejos solo están permitidos los domingos
    D: Los conductores individuales en un cortejo deben detenerse en todos los semáforos
      en rojo
  answer: B
  explanation: En Georgia, los cortejos fúnebres tienen el derecho de paso en las
    intersecciones. Otros conductores deben ceder el paso al cortejo y no pueden conducir
    entre los vehículos que lo integran.
- id: 166
  category: sharing_the_road
  question: En Georgia, es ilegal que cualquier persona de ____ años o más circule
    en bicicleta por una acera, a menos que las ordenanzas locales lo permitan.
  choices:
    A: '10'
    B: '12'
    C: '16'
    D: '18'
  answer: B
  explanation: Según la ley de Georgia, ninguna persona de 12 años o más debe conducir
    ningún vehículo (incluidas las bicicletas) sobre una acera o área de acera, excepto
    en entradas para vehículos permanentes o debidamente autorizadas.
- id: 167
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el conductor puede:'
  choices:
    A: Permanecer estrictamente en el carril derecho
    B: Necesitar abrirse hacia la izquierda para completar el giro
    C: Girar desde el carril izquierdo
    D: Detenerse y esperar a que el tráfico se despeje en todas las direcciones
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para hacer un giro a la derecha. Los conductores deben evitar "apretarse" entre
    el camión y la acera cuando un camión está señalizando un giro a la derecha.
- id: 168
  category: vehicle_information
  question: Según la ley de Georgia, ¿cuándo es obligatorio tener encendidas las luces
    delanteras?
  choices:
    A: Solo entre las horas de la puesta del sol y la salida del sol
    B: Solo cuando está lloviendo o hay niebla
    C: Desde media hora después de la puesta del sol hasta media hora antes de la
      salida del sol, y cuando esté lloviendo
    D: Solo cuando la visibilidad sea inferior a 1,000 pies
  answer: C
  explanation: La ley de Georgia (O.C.G.A. § 40-8-20) exige que las luces delanteras
    estén encendidas desde media hora después de la puesta del sol hasta media hora
    antes de la salida del sol, en cualquier momento en que esté lloviendo o cuando
    la visibilidad sea limitada.
- id: 169
  category: vehicle_information
  question: ¿Cuál es el nivel máximo legal de oscuridad permitido para el polarizado
    de las ventanas laterales de un vehículo de pasajeros en Georgia?
  choices:
    A: No menos del 20% de transmisión de luz
    B: No menos del 32% de transmisión de luz
    C: No menos del 50% de transmisión de luz
    D: El polarizado de las ventanas laterales es ilegal en Georgia
  answer: B
  explanation: La ley de Georgia (O.C.G.A. § 40-8-73.1) prohíbe el polarizado de ventanas
    que permita menos del 32% de transmisión de luz (más o menos un 3%) en las ventanas
    laterales o traseras.
- id: 170
  category: vehicle_information
  question: 'En Georgia, un neumático se considera inseguro si la profundidad de la
    banda de rodadura es inferior a:'
  choices:
    A: 1/16 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/8 de pulgada
  answer: B
  explanation: La ley de Georgia especifica que los neumáticos son inseguros si tienen
    menos de 2/32 de pulgada de profundidad en la banda de rodadura.
- id: 171
  category: vehicle_information
  question: 'Todo vehículo motorizado en Georgia debe estar equipado con un espejo
    que permita al conductor ver la carretera a una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: La ley de Georgia exige un espejo retrovisor que proporcione una visión
    de la carretera de al menos 200 pies hacia la parte trasera del vehículo.
- id: 172
  category: vehicle_information
  question: 'La bocina de un vehículo motorizado en Georgia debe ser audible en condiciones
    normales desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según el Código de Georgia § 40-8-70, todo vehículo motorizado debe
    estar equipado con una bocina en buen estado de funcionamiento capaz de emitir
    un sonido audible desde una distancia no inferior a 200 pies.
- id: 173
  category: vehicle_information
  question: En Georgia, ¿los niños menores de qué edad deben estar debidamente sujetos
    en un sistema de retención infantil adecuado para su altura y peso?
  choices:
    A: Menores de 4 años de edad
    B: Menores de 6 años de edad
    C: Menores de 8 años de edad
    D: Menores de 10 años de edad
  answer: C
  explanation: La ley de Georgia exige que los niños menores de 8 años estén debidamente
    asegurados en un asiento de seguridad para el automóvil o un asiento elevado (booster
    seat) aprobado mientras viajan en un automóvil de pasajeros, camioneta o pickup.
- id: 174
  category: vehicle_information
  question: ¿En cuántos condados de Georgia se requiere una prueba anual de emisiones
    para la mayoría de los vehículos de pasajeros que funcionan con gasolina?
  choices:
    A: Los 159 condados
    B: Los 5 condados más poblados
    C: 13 condados del área metropolitana de Atlanta
    D: Solo la ciudad de Atlanta
  answer: C
  explanation: 'La Fuerza de Aire Limpio de Georgia (Georgia Clean Air Force) requiere
    pruebas de emisiones en 13 condados del área metropolitana de Atlanta: Cherokee,
    Clayton, Cobb, Coweta, DeKalb, Douglas, Fayette, Forsyth, Fulton, Gwinnett, Henry,
    Paulding y Rockdale.'
- id: 175
  category: vehicle_information
  question: La ley de Georgia exige que los frenos de servicio de un vehículo de pasajeros
    puedan detener el vehículo en cuántos pies cuando viaja a 20 mph?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 40 pies
  answer: C
  explanation: Según el Código de Georgia § 40-8-53, los frenos de servicio de un
    vehículo de pasajeros deben poder detener el vehículo en un tramo de 30 pies cuando
    viaja a 20 mph en un pavimento seco y nivelado.
- id: 176
  category: vehicle_information
  question: En Georgia, ¿qué tipo de vehículo debe mostrar un emblema de 'vehículo
    de movimiento lento' (una señal naranja triangular)?
  choices:
    A: Cualquier vehículo que viaje 10 mph por debajo del límite de velocidad
    B: Vehículos diseñados para viajar a velocidades de 25 mph o menos
    C: Solo carruajes tirados por caballos
    D: Camiones semirremolque de gran tamaño
  answer: B
  explanation: La ley de Georgia exige el emblema de vehículo de movimiento lento
    en maquinaria agrícola y otros vehículos diseñados para operar a velocidades de
    25 mph o menos.
- id: 177
  category: vehicle_information
  question: 'La ley de Georgia exige que las luces direccionales sean visibles desde
    una distancia no inferior a:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Según el Código de Georgia § 40-8-25, las señales de giro deben ser
    visibles desde una distancia de 300 pies tanto hacia adelante como hacia atrás
    bajo la luz solar normal.
- id: 178
  category: vehicle_information
  question: 'Todo vehículo motorizado en Georgia debe tener al menos una luz trasera
    que emita una luz roja visible desde una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Georgia exige que las luces traseras sean visibles desde
    una distancia de 500 pies hacia atrás.
- id: 179
  category: vehicle_information
  question: Según la Ley del Cinturón de Seguridad de Georgia, ¿cuál de las siguientes
    afirmaciones es verdadera para los ocupantes de un vehículo de pasajeros?
  choices:
    A: Solo el conductor debe usar el cinturón de seguridad
    B: Solo los pasajeros menores de 18 años deben usar el cinturón de seguridad
    C: Cada ocupante en el asiento delantero debe estar sujeto por un cinturón de
      seguridad
    D: Los cinturones de seguridad son opcionales si el vehículo tiene bolsas de aire
      (airbags)
  answer: C
  explanation: La ley primaria de cinturones de seguridad de Georgia (O.C.G.A. § 40-8-76.1)
    exige que todos los ocupantes de los asientos delanteros de los vehículos de pasajeros
    usen el cinturón de seguridad.
- id: 180
  category: vehicle_information
  question: En Georgia, ¿es ilegal modificar el sistema de suspensión de un vehículo
    de modo que la altura del parachoques se altere en más de cuántas pulgadas con
    respecto al diseño original del fabricante?
  choices:
    A: 1 pulgada
    B: 2 pulgadas
    C: 4 pulgadas
    D: 6 pulgadas
  answer: B
  explanation: La ley de Georgia (O.C.G.A. § 40-8-6) prohíbe alterar la suspensión
    o el chasis de un automóvil de pasajeros de modo que la altura del parachoques
    sea más de 2 pulgadas superior o inferior a la original de fábrica.
- id: 181
  category: vehicle_information
  question: ¿Según la ley de Georgia, cuál es la profundidad mínima legal de la banda
    de rodadura de los neumáticos de un vehículo de pasajeros?
  choices:
    A: 1/32 de pulgada
    B: 2/32 (1/16) de pulgada
    C: 4/32 (1/8) de pulgada
    D: 6/32 de pulgada
    E: Ninguna de las anteriores
  answer: B
  explanation: La ley de Georgia exige que los neumáticos tengan al menos 2/32 (o
    1/16) de pulgada de profundidad de la banda de rodadura en todas las ranuras principales
    para que se consideren seguros y legales.
- id: 182
  category: vehicle_information
  question: 'En Georgia, debe usar sus faros delanteros entre media hora después de
    la puesta del sol y media hora antes de la salida del sol, o cuando la visibilidad
    sea inferior a:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Georgia (O.C.G.A. § 40-8-20) exige que los faros delanteros
    estén encendidos cuando esté lloviendo o cuando la visibilidad se limite a menos
    de 500 pies.
- id: 183
  category: vehicle_information
  question: Según la ley de Georgia, el polarizado de las ventanas laterales delanteras
    de un automóvil de pasajeros debe permitir al menos ¿qué porcentaje de transmisión
    de luz?
  choices:
    A: 20%
    B: 25%
    C: 32%
    D: 50%
  answer: C
  explanation: La ley de Georgia (O.C.G.A. § 40-8-73.1) prohíbe el polarizado de ventanas
    que reduzca la transmisión de luz a menos del 32%, más o menos un 3%.
- id: 184
  category: vehicle_information
  question: 'La ley de Georgia exige que todo vehículo motorizado tenga una bocina
    que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La bocina de un vehículo motorizado debe estar en buen estado de funcionamiento
    y ser capaz de emitir un sonido audible en condiciones normales desde una distancia
    no inferior a 200 pies.
- id: 185
  category: vehicle_information
  question: En Georgia, las luces de las señales de giro deben ser visibles desde
    una distancia no inferior a ¿cuántos pies hacia adelante y hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Georgia exige que las señales de giro sean visibles desde
    una distancia de 300 pies bajo la luz solar normal.
- id: 186
  category: vehicle_information
  question: 'Un emblema de "Vehículo de movimiento lento" (un letrero triangular naranja/rojo)
    debe exhibirse en la parte trasera de cualquier vehículo diseñado para viajar
    a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: En Georgia, los vehículos diseñados para viajar a 25 mph o menos, como
    maquinaria agrícola o equipo de construcción, deben exhibir el emblema de Vehículo
    de movimiento lento (Slow Moving Vehicle).
- id: 187
  category: vehicle_information
  question: 'La ley de Georgia exige que la placa de matrícula trasera esté iluminada
    de modo que sea legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La luz de la placa de matrícula debe hacer que la placa sea claramente
    legible desde una distancia de 50 pies hacia atrás.
- id: 188
  category: vehicle_information
  question: Según la ley de Georgia, ¿cuál es el número máximo de luces de conducción
    auxiliares (como las luces antiniebla) que se pueden montar en la parte delantera
    de un vehículo?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: La ley de Georgia permite que se monten no más de dos luces de conducción
    auxiliares o dos luces antiniebla en la parte delantera de un vehículo.
- id: 189
  category: vehicle_information
  question: Con respecto a los sistemas de escape de los vehículos, ¿qué prohíbe específicamente
    la ley de Georgia?
  choices:
    A: Tubos de escape dobles
    B: Tubos de escape cromados
    C: Recortes o derivaciones del silenciador (muffler cut-outs)
    D: Sistemas de escape que salen por el lateral
  answer: C
  explanation: La ley de Georgia (O.C.G.A. § 40-8-71) exige que cada vehículo tenga
    un silenciador en buen estado de funcionamiento y prohíbe el uso de un recorte
    de silenciador (muffler cut-out), derivación o dispositivo similar.
- id: 190
  category: signs_and_signals
  question: En Georgia, ¿qué indica una flecha amarilla intermitente en una intersección?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: El giro a la izquierda está protegido y el tráfico que viene en sentido contrario
      está detenido
    C: Se permiten los giros después de ceder el paso al tráfico que viene en sentido
      contrario y a los peatones
    D: La señal está averiada y debe tratarse como una parada de cuatro vías
  answer: C
  explanation: Según el Manual del Conductor de Georgia, una flecha amarilla intermitente
    significa que puede girar a la izquierda después de ceder el paso al tráfico que
    viene en sentido contrario y a los peatones. El tráfico que viene en sentido contrario
    todavía tiene luz verde.
- id: 191
  category: signs_and_signals
  question: ¿En Georgia, qué significan las líneas amarillas continuas dobles en el
    centro de la carretera?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo desde su lado
    C: Está prohibido rebasar desde cualquier lado
    D: La carretera es una calle de un solo sentido
  answer: C
  explanation: Las líneas amarillas continuas dobles indican que está prohibido rebasar
    en ambas direcciones. Solo puede cruzarlas al realizar un giro hacia o desde un
    callejón, camino privado o entrada.
- id: 192
  category: signs_and_signals
  question: Al usar señales manuales en Georgia, ¿qué significa cuando el brazo de
    un conductor se extiende recto hacia afuera de la ventana?
  choices:
    A: El conductor está disminuyendo la velocidad
    B: El conductor está realizando un giro a la derecha
    C: El conductor está realizando un giro a la izquierda
    D: El conductor se está deteniendo
  answer: C
  explanation: La señal manual estándar para un giro a la izquierda es el brazo y
    la mano extendidos horizontalmente hacia afuera de la ventana.
- id: 193
  category: signs_and_signals
  question: ¿En Georgia, cuál es la distancia máxima que un vehículo puede recorrer
    en un carril central compartido para girar antes de realizar un giro?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Georgia especifica que un carril central compartido para
    girar (marcado por líneas amarillas continuas y discontinuas) no puede usarse
    para rebasar o para tránsito directo, y un vehículo no puede viajar más de 300
    pies en este carril.
- id: 194
  category: signs_and_signals
  question: ¿Qué representa una línea blanca continua pintada a través de una carretera
    en una intersección en Georgia?
  choices:
    A: Un cruce peatonal para peatones
    B: Una línea de parada
    C: Una línea de ceda el paso
    D: Un límite de estacionamiento
  answer: B
  explanation: Una línea blanca continua a través de un carril en una intersección
    es una línea de parada. Indica el punto donde un vehículo debe detenerse ante
    una señal de pare o una luz roja.
- id: 195
  category: signs_and_signals
  question: ¿En Georgia, a qué se refiere el área de 'gore' (zona neutral o de convergencia)
    en una autopista?
  choices:
    A: Una zona de alta accidentalidad
    B: El área triangular entre un carril de paso y una rampa de salida o entrada
    C: El arcén de la carretera reservado para vehículos de emergencia
    D: Un lugar designado para la recogida de viajes compartidos
  answer: B
  explanation: El 'gore' es el área de convergencia o divergencia entre carriles de
    tráfico, típicamente marcada por líneas blancas. En Georgia, es ilegal conducir
    sobre o estacionarse en un 'gore'.
- id: 196
  category: signs_and_signals
  question: ¿Cuál es el significado de una 'Baliza Híbrida para Peatones' (señal HAWK)
    cuando las dos luces rojas superiores parpadean de forma alterna?
  choices:
    A: Los conductores deben detenerse y permanecer detenidos hasta que las luces
      se apaguen
    B: Los conductores deben detenerse y pueden proceder si el camino está despejado,
      de manera similar a una señal de pare
    C: Los conductores pueden proceder con precaución sin detenerse
    D: La señal está funcionando mal
  answer: B
  explanation: Cuando la señal HAWK parpadea en rojo, los conductores deben detenerse
    por completo y pueden proceder solo después de ceder el paso a los peatones en
    el cruce peatonal.
- id: 197
  category: signs_and_signals
  question: 'En Georgia, una señal en forma de diamante con fondo naranja se utiliza
    para indicar:'
  choices:
    A: Una zona escolar
    B: Un cruce de ferrocarril
    C: Zonas de construcción o mantenimiento
    D: Áreas de recreación pública
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para operaciones de construcción, mantenimiento o servicios públicos para advertir
    a los conductores sobre trabajadores y equipos más adelante.
- id: 198
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla redonda con una 'X' negra y las letras
    'RR'?
  choices:
    A: Una curva cerrada adelante
    B: Una intersección de autopistas
    C: Un cruce de ferrocarril adelante
    D: Una zona de no rebasar
  answer: C
  explanation: La señal amarilla circular es una señal de advertencia anticipada de
    ferrocarril, que alerta a los conductores de que se aproximan a un cruce de ferrocarril.
- id: 199
  category: signs_and_signals
  question: 'En Georgia, cuando ve un emblema de ''Vehículo de Movimiento Lento''
    (un triángulo naranja con borde rojo) en la parte trasera de un vehículo, significa
    que el vehículo viaja a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de Vehículo de Movimiento Lento es obligatorio en vehículos
    diseñados para viajar a velocidades de 25 mph o menos, como maquinaria agrícola
    o carruajes tirados por caballos.
- id: 200
  category: signs_and_signals
  question: ¿Cuál es el propósito de una 'Baliza Rectangular de Destello Rápido' (RRFB)
    en Georgia?
  choices:
    A: Advertir sobre tráfico de alta velocidad adelante
    B: Alertar a los conductores sobre un cambio en el límite de velocidad
    C: Alertar a los conductores sobre peatones en un cruce peatonal
    D: Señalizar la aproximación de un vehículo de emergencia
  answer: C
  explanation: Las RRFB son luces LED de color ámbar activadas por el usuario que
    se utilizan en intersecciones sin semáforos o cruces peatonales a mitad de cuadra
    para aumentar la conciencia del conductor sobre los peatones.
- id: 201
  category: signs_and_signals
  question: 'Una señal en forma de pentágono (cinco lados) indica que usted está cerca
    de:'
  choices:
    A: Un hospital
    B: Una línea del condado
    C: Una zona escolar o cruce escolar
    D: Un parque estatal
  answer: C
  explanation: La forma de pentágono de cinco lados se reserva exclusivamente para
    zonas escolares y cruces escolares.
- id: 202
  category: signs_and_signals
  question: En Georgia, ¿qué significa una línea amarilla continua en su lado de una
    línea central amarilla discontinua?
  choices:
    A: Puede rebasar si el camino está despejado
    B: Se encuentra en una zona de sentido único
    C: Se le prohíbe rebasar
    D: Debe acelerar para despejar el carril
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central significa
    que se encuentra en una zona de no rebasar y no puede adelantar legalmente a otros
    vehículos.
- id: 203
  category: signs_and_signals
  question: Cuando el brazo izquierdo de un conductor está extendido por la ventana
    y doblado hacia abajo en el codo, ¿qué señal está dando?
  choices:
    A: Giro a la izquierda
    B: Giro a la derecha
    C: Detenerse o disminuir la velocidad
    D: Giro en U
  answer: C
  explanation: En Georgia, la señal manual para detenerse o disminuir la velocidad
    es el brazo izquierdo extendido hacia abajo en el codo.
- id: 204
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de banderín ubicada en el
    lado izquierdo de la carretera?
  choices:
    A: Zona escolar más adelante
    B: Ceder el paso (Yield)
    C: Zona de no rebasar
    D: Cruce de ferrocarril
  answer: C
  explanation: Una señal en forma de banderín se coloca en el lado izquierdo de la
    carretera para indicar el comienzo de una zona de no rebasar.
- id: 205
  category: signs_and_signals
  question: En Georgia, ¿de qué color son las señales utilizadas para proporcionar
    información sobre las zonas de construcción y mantenimiento?
  choices:
    A: Amarillo
    B: Naranja
    C: Verde
    D: Azul
  answer: B
  explanation: El naranja es el color estándar para el fondo de las señales utilizadas
    en las zonas de trabajo de construcción y mantenimiento en Georgia.
- id: 206
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para las señales de "Ceder
    el paso" (Yield) en Georgia?
  choices:
    A: Octágono
    B: Diamante
    C: Triángulo equilátero que apunta hacia abajo
    D: Pentágono
  answer: C
  explanation: La señal de ceder el paso es un triángulo equilátero con la punta en
    la parte inferior, con un borde rojo e interior blanco.
- id: 207
  category: signs_and_signals
  question: 'Un símbolo de diamante blanco pintado en el pavimento de un carril de
    una autopista de Georgia indica:'
  choices:
    A: El carril es solo para vehículos de emergencia
    B: El carril está reservado para Vehículos de Alta Ocupación (HOV)
    C: El carril terminará pronto
    D: Hay un cruce de ferrocarril más adelante
  answer: B
  explanation: El símbolo del diamante indica un carril reservado para vehículos específicos,
    más comúnmente Vehículos de Alta Ocupación (HOV) como autobuses o vehículos compartidos.
- id: 208
  category: signs_and_signals
  question: En una intersección de Georgia, ¿qué significa una flecha amarilla intermitente?
  choices:
    A: Detenerse y esperar una flecha verde
    B: El giro a la izquierda está protegido; el tráfico que viene en sentido contrario
      está detenido
    C: Se permiten los giros después de ceder el paso al tráfico que viene en sentido
      contrario y a los peatones
    D: La intersección está cerrada para todos los giros
  answer: C
  explanation: Una flecha amarilla intermitente significa que puede girar en la dirección
    de la flecha después de ceder el paso al tráfico que viene en sentido contrario
    y a los peatones. El tráfico que viene en sentido contrario tiene luz verde.
- id: 209
  category: signs_and_signals
  question: ¿Cuál es la forma de una señal que advierte de una zona escolar o un cruce
    escolar?
  choices:
    A: Diamante
    B: Círculo
    C: Pentágono
    D: Rectángulo
  answer: C
  explanation: Se utiliza una señal de cinco lados (pentágono) para advertir a los
    conductores que se aproximan a una zona escolar o a un cruce escolar.
- id: 210
  category: signs_and_signals
  question: 'Una señal naranja triangular con un borde reflectante rojo en la parte
    trasera de un vehículo indica:'
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo es un vehículo de movimiento lento (25 mph o menos)
    C: El vehículo es una carga de gran tamaño
    D: El vehículo es un conductor estudiante
  answer: B
  explanation: Este emblema es obligatorio en la parte trasera de todos los vehículos
    de movimiento lento, como maquinaria agrícola o equipo de construcción, diseñados
    para viajar a velocidades de 25 mph o menos.
- id: 211
  category: signs_and_signals
  question: 'Para indicar un giro a la derecha mediante señales manuales, un conductor
    de Georgia debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo derecho recto hacia afuera
    D: Extender el brazo izquierdo hacia abajo
  answer: B
  explanation: La señal manual adecuada para un giro a la derecha es el brazo izquierdo
    extendido hacia arriba a la altura del codo.
- id: 212
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas en el pavimento?
  choices:
    A: El tráfico se mueve en direcciones opuestas; prohibido adelantar
    B: El tráfico se mueve en la misma dirección; se permite adelantar
    C: El borde de la calzada
    D: Un cruce de peatones
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Puede cruzar estas líneas para cambiar de carril
    cuando sea seguro hacerlo.
- id: 213
  category: signs_and_signals
  question: 'Un círculo rojo con una barra horizontal blanca en el medio es la señal
    de:'
  choices:
    A: Ceda el paso (Yield)
    B: Prohibido estacionar
    C: No entrar (Do Not Enter)
    D: Una vía (One Way)
  answer: C
  explanation: La señal de 'No entrar' (Do Not Enter) es un cuadrado con un círculo
    rojo y una barra horizontal blanca, lo que indica que no se le permite entrar
    en la carretera desde esa dirección.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) octogonal roja significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 214
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 215
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 216
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 217
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 218
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 219
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 220
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite dar vuelta en U
    B: No se permite dar vuelta a la izquierda
    C: No se permite dar vuelta a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 221
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 222
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 223
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 224
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 225
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 226
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 227
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 228
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de ferrocarril. Significa que debe ceder el paso a los trenes.
    Si se acerca un tren, debe detenerse.
  id: 229
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Se requiere giro a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 230
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 231
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 232
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 233
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 234
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la carretera y ajuste
    su posición en el carril.
  id: 235
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 236
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Una zona de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico en ambos
    sentidos.
  id: 237
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Puede
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 238
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 239
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 240
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 241
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (yield)
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 242
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 243
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 244
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 245
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 246
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 247
