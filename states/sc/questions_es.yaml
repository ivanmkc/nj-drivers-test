questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un Permiso de Principiante (Beginner's
    Permit) en Carolina del Sur?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 17 años
  answer: B
  explanation: En Carolina del Sur, una persona debe tener al menos 15 años de edad
    para solicitar un Permiso de Principiante (Beginner's Permit).
- id: 2
  category: license_system
  question: ¿Cuánto tiempo debe tener un conductor de Carolina del Sur un Permiso
    de Principiante (Beginner's Permit) antes de poder solicitar una licencia Condicional
    o Especial Restringida?
  choices:
    A: 90 días
    B: 120 días
    C: 180 días
    D: Un año
  answer: C
  explanation: La ley de Carolina del Sur exige que los conductores mantengan su Permiso
    de Principiante durante al menos 180 días antes de ser elegibles para una licencia.
- id: 3
  category: license_system
  question: Si se muda a una nueva dirección dentro de Carolina del Sur, ¿dentro de
    cuántos días debe notificar al SCDMV su cambio de domicilio?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Carolina del Sur le exige notificar al SCDMV sobre un cambio
    de dirección o de nombre en un plazo de 10 días.
- id: 4
  category: license_system
  question: Bajo una Licencia Condicional de Carolina del Sur, durante el Horario
    Estándar (Standard Time), ¿entre qué horas no puede conducir solo un conductor
    menor de 17 años?
  choices:
    A: 10 PM y 5 AM
    B: Medianoche y 6 AM
    C: 6 PM y 6 AM
    D: 8 PM y 6 AM
  answer: C
  explanation: Los conductores con una Licencia Condicional pueden conducir solos
    de 6 AM a 6 PM durante el Horario Estándar. Durante el Horario de Verano (Daylight
    Saving Time), este periodo se extiende hasta las 8 PM.
- id: 5
  category: license_system
  question: El titular de un Permiso de Principiante de Carolina del Sur debe estar
    acompañado en el asiento delantero por un conductor con licencia que tenga al
    menos ¿qué edad?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: Sin límite de edad, solo necesita licencia
  answer: B
  explanation: El conductor acompañante debe tener al menos 21 años de edad, contar
    con al menos un año de experiencia de conducción y estar sentado en el asiento
    delantero.
- id: 6
  category: license_system
  question: ¿Cuántos puntos acumulados en un historial de conducción de Carolina del
    Sur en un periodo de dos años resultarán en la suspensión de la licencia?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: En Carolina del Sur, si alcanza 12 puntos o más en su historial de
    conducción, su licencia de conducir será suspendida.
- id: 7
  category: license_system
  question: En Carolina del Sur, ¿cuál es el valor de puntos asignado a una condena
    por Conducción Temeraria (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La Conducción Temeraria es una infracción grave en Carolina del Sur
    y conlleva una penalización de 6 puntos en su historial de conducción.
- id: 8
  category: license_system
  question: ¿Cuál es la penalización de puntos por exceder el límite de velocidad
    por más de 10 mph pero menos de 25 mph en Carolina del Sur?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: Sin puntos, solo una multa
  answer: B
  explanation: Exceder el límite de velocidad por más de 10 mph pero menos de 25 mph
    resulta en 4 puntos en su historial de conducción de Carolina del Sur.
- id: 9
  category: license_system
  question: Si es menor de 21 años, ¿cuál es el límite de Concentración de Alcohol
    en Sangre (BAC) que provocará una suspensión automática de la licencia en Carolina
    del Sur?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Carolina del Sur tiene una política de 'Tolerancia Cero' para conductores
    menores de 21 años; un BAC de 0.02% o superior resulta en una suspensión automática.
- id: 10
  category: license_system
  question: ¿Cuál de las siguientes es la cobertura mínima de seguro de responsabilidad
    civil requerida en Carolina del Sur para daños a la propiedad en un solo accidente?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Carolina del Sur exige un mínimo de $25,000 para la responsabilidad
    por daños a la propiedad.
- id: 11
  category: license_system
  question: Para obtener una licencia de conducir de Carolina del Sur, un solicitante
    menor de 18 años debe completar ¿cuántas horas de práctica de manejo con un padre
    o tutor legal?
  choices:
    A: 30 horas (incluyendo 5 por la noche)
    B: 40 horas (incluyendo 10 por la noche)
    C: 50 horas (incluyendo 10 por la noche)
    D: 60 horas (incluyendo 15 por la noche)
  answer: B
  explanation: Los solicitantes menores de 18 años deben certificar que han tenido
    al menos 40 horas de práctica de manejo, incluyendo 10 horas de manejo nocturno.
- id: 12
  category: license_system
  question: Si un conductor de Carolina del Sur es condenado por exceso de velocidad
    de 25 mph o más sobre el límite, ¿cuántos puntos se añaden a su registro?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Exceder el límite de velocidad establecido por 25 mph o más resulta
    en la adición de 6 puntos al registro del conductor.
- id: 13
  category: license_system
  question: Una Licencia Especial Restringida de Carolina del Sur (para jóvenes de
    16 años) permite conducir con ¿cuántos pasajeros menores de 21 años que no sean
    familiares, a menos que esté acompañado por un adulto con licencia?
  choices:
    A: Ninguno
    B: No más de dos
    C: No más de tres
    D: Sin límite
  answer: B
  explanation: Los conductores con una licencia Especial Restringida o Condicional
    no pueden transportar a más de dos pasajeros menores de 21 años a menos que sean
    familiares o estén acompañados por un adulto con licencia de 21 años o más.
- id: 14
  category: license_system
  question: ¿Qué sucede con los puntos en su registro de conducir de Carolina del
    Sur después de un año de la fecha de la infracción?
  choices:
    A: Se eliminan por completo
    B: Se reducen a la mitad
    C: Permanecen hasta que tome un curso de manejo defensivo
    D: Se reducen en 2 puntos
  answer: B
  explanation: En Carolina del Sur, los puntos se reducen a la mitad después de un
    año de la fecha de la infracción.
- id: 15
  category: license_system
  question: Al solicitar una licencia de Carolina del Sur, debe proporcionar un comprobante
    del número de Seguro Social, comprobante de residencia y ¿qué otro documento principal?
  choices:
    A: Comprobante de empleo
    B: Comprobante de identidad y ciudadanía/presencia legal
    C: Diploma de escuela secundaria
    D: Una carta de recomendación
  answer: B
  explanation: El SCDMV requiere comprobante de identidad, ciudadanía estadounidense/presencia
    legal, número de Seguro Social y dos comprobantes de residencia en Carolina del
    Sur (SC).
- id: 16
  category: license_system
  question: ¿Cuál es la agudeza visual mínima requerida en al menos un ojo, con o
    sin lentes correctivos, para obtener una licencia de conducir de Carolina del
    Sur?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Según el Manual del Conductor de Carolina del Sur, un solicitante debe
    tener una visión de al menos 20/40 en al menos un ojo para aprobar el examen de
    la vista.
- id: 17
  category: license_system
  question: Una licencia de conducir estándar de Carolina del Sur suele ser válida
    por ¿cuántos años antes de que deba renovarse?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: En Carolina del Sur, una licencia de conducir estándar Clase D se emite
    por un período de ocho años.
- id: 18
  category: license_system
  question: En Carolina del Sur, al solicitar una licencia de conducir o tarjeta de
    identificación, cualquier solicitante masculino menor de 26 años también está
    autorizando al SCDMV a hacer ¿qué?
  choices:
    A: Registrarlo para el reclutamiento militar (Servicio Selectivo)
    B: Inscribirlo en un curso de seguridad obligatorio
    C: Compartir sus datos con compañías de seguros privadas
    D: Registrarlo automáticamente como donante de órganos
  answer: A
  explanation: La ley de Carolina del Sur exige que cualquier ciudadano estadounidense
    o inmigrante masculino que tenga al menos 18 años pero menos de 26 años sea registrado
    en el Sistema de Servicio Selectivo al solicitar una licencia o identificación.
- id: 19
  category: license_system
  question: Bajo el sistema de puntos de Carolina del Sur, ¿cuántos puntos se asignan
    a su registro de conducir por rebasar ilegalmente un autobús escolar detenido?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Rebasar ilegalmente un autobús escolar detenido es una infracción grave
    en Carolina del Sur y conlleva una penalización de 6 puntos.
- id: 20
  category: license_system
  question: ¿Cuántos puntos se añaden a un registro de conducir de Carolina del Sur
    por la infracción de 'Seguir demasiado de cerca'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 0 puntos (solo multa)
  answer: B
  explanation: Según la Sección 56-1-720 del Código de Carolina del Sur (SC), 'Seguir
    demasiado de cerca' es una infracción de 4 puntos.
- id: 21
  category: license_system
  question: Si usted es un nuevo residente de Carolina del Sur y posee una licencia
    de conducir válida de otro estado, ¿cuántos días tiene para solicitar una licencia
    de Carolina del Sur?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Los nuevos residentes tienen 90 días para transferir su licencia de
    conducir de otro estado a una licencia de Carolina del Sur.
- id: 22
  category: license_system
  question: ¿Qué clase de licencia específica se requiere en Carolina del Sur para
    operar un ciclomotor (moped) si aún no posee una licencia Clase D, E o F?
  choices:
    A: Clase M
    B: Clase G
    C: Clase C
    D: Clase H
  answer: B
  explanation: Carolina del Sur emite una licencia Clase G específicamente para la
    operación de ciclomotores (mopeds).
- id: 23
  category: license_system
  question: Si cambia legalmente su nombre por matrimonio o por una orden judicial,
    ¿dentro de cuántos días debe solicitar una licencia corregida de Carolina del
    Sur?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Carolina del Sur exige que los conductores notifiquen al
    SCDMV y obtengan una licencia corregida dentro de los 10 días posteriores a un
    cambio de nombre legal.
- id: 24
  category: license_system
  question: Bajo la ley de Infractores Habituales de Carolina del Sur, se revocará
    la licencia de conducir si se acumulan ¿cuántas condenas 'mayores' (como DUI o
    conducción temeraria) en un período de tres años?
  choices:
    A: 2 condenas
    B: 3 condenas
    C: 5 condenas
    D: 10 condenas
  answer: B
  explanation: Un Infractor Habitual se define como alguien que obtiene 3 o más condenas
    mayores o 10 o más condenas menores (de 4 puntos o más) en un período de 3 años.
- id: 25
  category: license_system
  question: En Carolina del Sur, ¿qué clase de licencia se requiere para operar un
    vehículo motorizado único no comercial con una Clasificación de Peso Bruto Vehicular
    (GVWR) de más de 26,000 libras?
  choices:
    A: Clase D
    B: Clase E
    C: Clase F
    D: Clase M
  answer: B
  explanation: Se requiere una licencia Clase E para vehículos únicos no comerciales
    con un GVWR de más de 26,000 libras, como las casas rodantes (motorhomes) grandes.
- id: 26
  category: license_system
  question: ¿Cuántos puntos se asignan contra una licencia de Carolina del Sur por
    'No ceder el paso'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 1 punto
  answer: B
  explanation: No ceder el paso (Failing to yield the right of way) es una infracción
    de 4 puntos en Carolina del Sur.
- id: 27
  category: license_system
  question: Si usted es residente de Carolina del Sur y su vehículo no está asegurado,
    es posible que deba pagar una tarifa al Fondo de Automovilistas No Asegurados.
    ¿De cuánto es esta tarifa anual?
  choices:
    A: No se permite ninguna tarifa; el seguro es obligatorio
    B: $300
    C: $550
    D: $1,000
  answer: C
  explanation: Carolina del Sur permite a los residentes registrarse como automovilistas
    no asegurados pagando una tarifa de $550, aunque esto no proporciona cobertura
    de seguro; solo permite que el vehículo sea registrado.
- id: 28
  category: license_system
  question: Bajo el sistema de puntos de Carolina del Sur, ¿una condena por 'Giro
    indebido' resulta en cuántos puntos?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 0 puntos
  answer: A
  explanation: Un giro indebido (Improper turn) se categoriza como una infracción
    de 2 puntos en Carolina del Sur.
- id: 29
  category: license_system
  question: En Carolina del Sur, si es condenado por 'Operar un vehículo de manera
    temeraria', ¿cuántos puntos se agregan a su historial?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción temeraria (Reckless driving) es una infracción de 6 puntos
    en Carolina del Sur.
- id: 30
  category: license_system
  question: ¿Cuál de las siguientes situaciones puede llevar a la suspensión de su
    licencia de conducir de Carolina del Sur, incluso si la infracción no ocurrió
    mientras conducía?
  choices:
    A: Falta de pago de la manutención infantil (child support)
    B: Falta de pago de los impuestos sobre la propiedad de un vehículo
    C: Falta de pago de los impuestos estatales sobre la renta de Carolina del Sur
    D: Todas las anteriores
  answer: D
  explanation: El SCDMV tiene la autoridad para suspender licencias por razones no
    relacionadas con la conducción, incluyendo la falta de pago de la manutención
    infantil, los impuestos sobre la propiedad del vehículo y los impuestos estatales
    sobre la renta.
- id: 31
  category: driver_testing
  question: Bajo la Ley de Consentimiento Implícito (Implied Consent Law) de Carolina
    del Sur, si usted se niega a someterse a una prueba química de alcohol o drogas,
    sus privilegios de conducción serán suspendidos automáticamente por cuánto tiempo?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: De acuerdo con el Manual del Conductor de Carolina del Sur, bajo la
    Ley de Consentimiento Implícito, la negativa a realizar una prueba de aliento,
    sangre u orina resulta en una suspensión automática de la licencia por 6 meses.
- id: 32
  category: driver_testing
  question: ¿En Carolina del Sur, cuál es el límite de velocidad máximo para caminos
    no pavimentados a menos que se indique lo contrario?
  choices:
    A: 30 mph
    B: 40 mph
    C: 45 mph
    D: 50 mph
  answer: B
  explanation: La ley de Carolina del Sur establece que el límite de velocidad máximo
    en caminos no pavimentados es de 40 millas por hora, a menos que se publique una
    velocidad diferente.
- id: 33
  category: driver_testing
  question: En Carolina del Sur, ¿con cuántos pies de antelación, como mínimo, debe
    señalizar su intención de girar antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Carolina del Sur exige que los conductores proporcionen una
    señal continua durante al menos 100 pies antes de girar o cambiar de carril.
- id: 34
  category: driver_testing
  question: Al estacionar cerca de un hidrante de incendios en Carolina del Sur, ¿cuál
    es la distancia mínima que debe mantener?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: Es ilegal estacionar a menos de 15 pies de un hidrante de incendios
    en Carolina del Sur.
- id: 35
  category: driver_testing
  question: En Carolina del Sur, ¿a cuántos pies de distancia de un vehículo que se
    aproxima en sentido contrario debe atenuar sus luces altas (cambiar a luces bajas)?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Carolina del Sur exige que los conductores atenúen sus luces
    altas cuando un vehículo que viene en sentido contrario está a menos de 500 pies
    para evitar cegar al otro conductor.
- id: 36
  category: driver_testing
  question: De acuerdo con la 'Ley de Moverse a un Lado' (Move Over Law) de Carolina
    del Sur, ¿qué debe hacer al acercarse a un vehículo de emergencia con luces intermitentes
    detenido a un lado de una carretera de varios carriles?
  choices:
    A: Detenerse inmediatamente en la calzada
    B: Mantener la velocidad pero tocar la bocina
    C: Cambiarse a un carril que no esté al lado del vehículo de emergencia, si es
      seguro hacerlo
    D: Aumentar la velocidad para pasar el vehículo rápidamente
  answer: C
  explanation: La Ley de Moverse a un Lado exige que los conductores se muevan a un
    carril no adyacente o reduzcan la velocidad significativamente si cambiar de carril
    no es seguro al pasar vehículos de emergencia, de recuperación o de servicios
    públicos.
- id: 37
  category: driver_testing
  question: 'En Carolina del Sur, si un oficial de la ley no investiga un accidente,
    el conductor debe presentar un informe por escrito (Formulario FR-311) si el accidente
    resultó en daños totales a la propiedad de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: B
  explanation: Si un accidente no es investigado por las autoridades y resulta en
    lesiones, muerte o daños a la propiedad de $1,000 o más, se debe presentar un
    informe ante el SCDMV.
- id: 38
  category: driver_testing
  question: 'Para conductores de 21 años o más, es ilegal conducir en Carolina del
    Sur con una Concentración de Alcohol en Sangre (BAC) de:'
  choices:
    A: 0.02% o superior
    B: 0.05% o superior
    C: 0.10% o superior
  answer: C
  explanation: En Carolina del Sur, el límite legal de BAC para conductores de 21
    años o más es de 0.08%.
- id: 39
  category: driver_testing
  question: Bajo la ley de Carolina del Sur, ¿los niños menores de qué edad deben
    estar asegurados en un sistema de sujeción para niños orientado hacia atrás?
  choices:
    A: Menores de 1 año
    B: Menores de 2 años
    C: Menores de 4 años
    D: Menores de 5 años
  answer: B
  explanation: La ley de Carolina del Sur exige que los niños menores de 2 años de
    edad estén asegurados en un asiento de seguridad para niños orientado hacia atrás
    hasta que el niño exceda el límite de altura o peso permitido por el fabricante.
- id: 40
  category: driver_testing
  question: En Carolina del Sur, ¿es ilegal estacionar a menos de cuántos pies de
    una señal de alto (pare)?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Se prohíbe a los conductores estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico ubicada al costado
    de una calzada.
- id: 41
  category: driver_testing
  question: ¿A qué velocidad puede comenzar el hidroplaneo (cuando los neumáticos
    pierden contacto con la carretera debido al agua) en las condiciones climáticas
    de Carolina del Sur?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: Solo por encima de 65 mph
    D: A cualquier velocidad superior a 10 mph
  answer: A
  explanation: El Manual del Conductor de Carolina del Sur advierte que el hidroplaneo
    puede comenzar a velocidades tan bajas como 35 mph bajo lluvia intensa.
- id: 42
  category: driver_testing
  question: Bajo el sistema de puntos de Carolina del Sur, ¿cuántos puntos se asignan
    a su licencia por 'Desobedecer un dispositivo de control de tráfico' (como una
    luz roja)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Desobedecer un dispositivo de control de tráfico o la señal de un oficial
    de tránsito resulta en la adición de 4 puntos a su historial de conducción de
    Carolina del Sur.
- id: 43
  category: driver_testing
  question: La ley de Carolina del Sur exige que los automovilistas tengan un mínimo
    de ¿cuánto seguro de responsabilidad civil por lesiones corporales a una persona
    en cualquier accidente?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: La cobertura mínima de seguro de responsabilidad civil requerida en
    Carolina del Sur es de $25,000 por lesiones corporales a una persona.
- id: 44
  category: driver_testing
  question: En Carolina del Sur, si reprueba el examen de conducción en su primer
    intento, ¿cuánto tiempo debe esperar antes de poder realizar el examen nuevamente?
  choices:
    A: 24 horas
    B: 2 días
    C: 7 días
    D: 30 días
  answer: B
  explanation: Según el SCDMV, si reprueba el examen de conducción, debe esperar dos
    días para el primer reintento, siete días para el segundo y 30 días para cualquier
    falla posterior.
- id: 45
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en un distrito urbano de Carolina del Sur?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: En Carolina del Sur, el límite de velocidad legal es de 30 millas por
    hora en distritos urbanos y residenciales, a menos que se indique un límite diferente.
- id: 46
  category: driver_testing
  question: Según la ley de Carolina del Sur, ¿cuándo está obligado a encender los
    faros delanteros de su vehículo en relación con las condiciones climáticas?
  choices:
    A: Solo cuando la visibilidad es inferior a 200 pies
    B: Solo después del atardecer
    C: Siempre que sus limpiaparabrisas estén en uso continuo debido a la lluvia,
      aguanieve o nieve
    D: Solo cuando conduzca por autopistas durante una tormenta
  answer: C
  explanation: La ley de Carolina del Sur exige que los conductores enciendan los
    faros siempre que los limpiaparabrisas estén en uso debido a las inclemencias
    del tiempo.
- id: 47
  category: driver_testing
  question: Si ha acumulado puntos en su historial de conducción de Carolina del Sur,
    ¿cuántos puntos como máximo se le pueden eliminar al completar un Curso de Manejo
    Defensivo aprobado?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: La mitad de sus puntos actuales
  answer: B
  explanation: Carolina del Sur permite a los conductores reducir su total de puntos
    en 4 puntos tras completar con éxito un curso de manejo defensivo aprobado por
    el SCDMV una vez cada tres años.
- id: 48
  category: driver_testing
  question: Al estacionar cerca de una intersección, ¿a cuántos pies de distancia
    debe estar como mínimo de una señal de pare, una baliza intermitente o una señal
    de control de tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Carolina del Sur prohíbe estacionar a menos de 30 pies de
    cualquier baliza intermitente, señal de pare o señal de control de tráfico ubicada
    al costado de una carretera.
- id: 49
  category: driver_testing
  question: Bajo el sistema de puntos de Carolina del Sur, ¿cuántos puntos se asignan
    a su licencia por la infracción de 'Conducir por el lado equivocado de la carretera'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Conducir por el lado equivocado de la carretera es una infracción de
    4 puntos en Carolina del Sur.
- id: 50
  category: driver_testing
  question: 'Al seguir a un camión de bomberos u otro vehículo de bomberos que responde
    a una alarma, la ley de Carolina del Sur exige que mantenga una distancia de seguimiento
    mínima de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Es ilegal seguir a un vehículo de bomberos a menos de 500 pies o estacionar
    dentro de la cuadra donde el vehículo de bomberos se ha detenido para responder
    a una alarma de incendio.
- id: 51
  category: driver_testing
  question: Para operar un ciclomotor en las vías públicas de Carolina del Sur, una
    persona debe poseer una licencia de conducir válida o una licencia de ciclomotor
    (Clase G). ¿Cuál es la edad mínima para solicitar una licencia Clase G?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: B
  explanation: En Carolina del Sur, debe tener al menos 15 años para ser elegible
    para una licencia de ciclomotor (Clase G).
- id: 52
  category: driver_testing
  question: Para aprobar el examen de la vista de Carolina del Sur, ¿un solicitante
    debe tener un campo de visión de al menos cuántos grados?
  choices:
    A: 90 grados
    B: 110 grados
    C: 120 grados
    D: 140 grados
  answer: D
  explanation: El SCDMV requiere que los solicitantes tengan un campo de visión de
    al menos 140 grados para calificar para una licencia sin restricciones.
- id: 53
  category: driver_responsibility
  question: En Carolina del Sur, si usted se ve involucrado en un accidente de tráfico
    que resulte en lesiones o muerte, o daños a la propiedad de $1,000 o más, y el
    accidente no es investigado por un oficial de la ley, ¿dentro de cuántos días
    debe presentar un informe por escrito (Formulario FR-309) ante el SCDMV?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: Según el Manual del Conductor de Carolina del Sur, si un accidente
    no es investigado por las autoridades y resulta en lesiones, muerte o daños a
    la propiedad de $1,000 o más, debe presentar un informe ante el SCDMV dentro de
    los 15 días.
- id: 54
  category: driver_responsibility
  question: ¿Cuál es el requisito mínimo de seguro de responsabilidad civil en Carolina
    del Sur por lesiones corporales a dos o más personas en un solo accidente?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: La ley de Carolina del Sur requiere un mínimo de $50,000 por lesiones
    corporales a dos o más personas en un solo accidente.
- id: 55
  category: driver_responsibility
  question: Si un conductor de Carolina del Sur elige no tener seguro de responsabilidad
    civil, puede pagar una tarifa anual al SCDMV para conducir como 'automovilista
    sin seguro'. ¿De cuánto es esta tarifa?
  choices:
    A: $300
    B: $500
    C: $600
    D: $1,000
  answer: C
  explanation: En Carolina del Sur, una persona puede registrarse como automovilista
    sin seguro pagando una tarifa anual de $600, aunque esto no proporciona cobertura
    de seguro; el conductor sigue siendo personalmente responsable de todos los daños.
- id: 56
  category: driver_responsibility
  question: Si se cancela su seguro de automóvil en Carolina del Sur y no devuelve
    su placa (matrícula) al SCDMV, ¿se le podría exigir que pague una tarifa de restablecimiento
    de hasta cuánto por día?
  choices:
    A: $2
    B: $5
    C: $10
    D: $20
  answer: B
  explanation: Si se cancela el seguro y no se devuelve la placa, Carolina del Sur
    cobra una tarifa de $5 por día por cada día que el vehículo estuvo sin seguro,
    hasta un máximo de $200 por la primera infracción.
- id: 57
  category: driver_responsibility
  question: ¿Dentro de cuántos días después de establecer su residencia deben los
    nuevos residentes de Carolina del Sur registrar sus vehículos?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: C
  explanation: La ley de Carolina del Sur exige que los nuevos residentes registren
    sus vehículos dentro de los 45 días posteriores a su mudanza al estado.
- id: 58
  category: driver_responsibility
  question: Al vender un vehículo en Carolina del Sur, ¿qué formulario debe completar
    el vendedor para notificar al SCDMV que ya no es responsable del vehículo?
  choices:
    A: Formulario FR-10
    B: Formulario 416 (Aviso de Venta)
    C: Formulario DL-44
    D: Formulario SR-22
  answer: B
  explanation: Completar el Formulario 416 (Aviso de Venta) notifica al SCDMV sobre
    la transferencia de propiedad y protege al vendedor de la responsabilidad por
    el vehículo después de la venta.
- id: 59
  category: driver_responsibility
  question: En Carolina del Sur, ¿cuántos puntos se pueden eliminar de su historial
    de manejo si completa un curso de conducción defensiva aprobado por el SCDMV?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Un conductor puede solicitar que se le eliminen 4 puntos de su historial
    de manejo una vez cada tres años al completar un curso de conducción defensiva
    aprobado.
- id: 60
  category: driver_responsibility
  question: ¿Por cuánto tiempo resulta la suspensión obligatoria de la licencia de
    conducir por una primera condena por DUI en Carolina del Sur?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Una primera condena por DUI en Carolina del Sur conlleva una suspensión
    obligatoria de la licencia de 6 meses.
- id: 61
  category: driver_responsibility
  question: ¿En cuál de los siguientes lugares es ilegal tener un recipiente abierto
    de cerveza o vino en Carolina del Sur?
  choices:
    A: El maletero
    B: La guantera
    C: El área de pasajeros
    D: Un portaequipajes con llave
  answer: C
  explanation: La ley de recipientes abiertos de Carolina del Sur prohíbe tener un
    recipiente abierto de cerveza o vino en el área de pasajeros de un vehículo motorizado.
- id: 62
  category: driver_responsibility
  question: Si un conductor de Carolina del Sur debe presentar una prueba de responsabilidad
    financiera (SR-22) tras una condena, ¿por cuántos años debe mantener generalmente
    este registro?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Normalmente se requiere mantener un certificado de seguro SR-22 durante
    3 años después de una suspensión por ciertas infracciones como conducir bajo los
    efectos del alcohol (DUI).
- id: 63
  category: driver_responsibility
  question: Si se muda fuera de Carolina del Sur, ¿qué debe hacer con su placa (matrícula)
    de Carolina del Sur?
  choices:
    A: Guardarla como recuerdo
    B: Transferirla a su nuevo estado
    C: Devolverla al SCDMV
    D: Destruirla
  answer: C
  explanation: Cuando se muda fuera del estado o cancela su seguro, la ley le exige
    devolver su placa de Carolina del Sur al SCDMV.
- id: 64
  category: driver_responsibility
  question: Antes de poder registrar un vehículo en Carolina del Sur, ¿qué debe pagar
    primero al tesorero de su condado?
  choices:
    A: Una tarifa de registro
    B: Impuesto sobre la propiedad personal
    C: Una tarifa de inspección
    D: Un impuesto por uso de carretera
  answer: B
  explanation: En Carolina del Sur, debe pagar el impuesto sobre la propiedad personal
    de su vehículo al condado en el que reside antes de poder registrarlo en el SCDMV.
- id: 65
  category: driver_responsibility
  question: Si se muda a Carolina del Sur desde otro estado, ¿cuántos días tiene para
    registrar su vehículo en el SCDMV?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: C
  explanation: Los nuevos residentes deben registrar sus vehículos dentro de los 45
    días posteriores a la fijación de su residencia en Carolina del Sur.
- id: 66
  category: driver_responsibility
  question: 'Bajo la Ley de Consentimiento Implícito (Implied Consent Law) de Carolina
    del Sur, al conducir un vehículo en el estado, usted ha aceptado:'
  choices:
    A: Portar un mínimo de $100,000 en seguros
    B: Someterse a pruebas químicas de aliento, sangre u orina para detectar alcohol
      o drogas
    C: Permitir el registro de su vehículo en cualquier momento
    D: Mantener un historial de manejo limpio durante al menos cinco años
  answer: B
  explanation: La Ley de Consentimiento Implícito significa que, al operar un vehículo
    motorizado en SC, usted acepta someterse a pruebas si un oficial sospecha que
    está conduciendo bajo la influencia.
- id: 67
  category: driver_responsibility
  question: Si un conductor de Carolina del Sur se ve involucrado en un accidente,
    ¿qué formulario utiliza el oficial investigador para verificar la cobertura del
    seguro?
  choices:
    A: FR-10
    B: SR-22
    C: DL-123
    D: SCDMV-447
  answer: A
  explanation: El formulario FR-10 (Verificación de Seguro) se entrega a los conductores
    en la escena de un accidente. El conductor debe hacer que su compañía de seguros
    lo complete y lo devuelva al SCDMV.
- id: 68
  category: driver_responsibility
  question: Si vende o transfiere su vehículo en Carolina del Sur, ¿qué debe hacer
    con las placas (matrículas)?
  choices:
    A: Dejarlas en el vehículo para el nuevo propietario
    B: Destruirlas inmediatamente
    C: Quitarlas y devolverlas a una oficina del SCDMV o transferirlas a otro vehículo
    D: Guardarlas como recuerdo sin notificar al estado
  answer: C
  explanation: Las placas son propiedad del estado. Cuando se vende un vehículo, las
    placas deben retirarse y devolverse al SCDMV o transferirse a otro vehículo de
    su propiedad.
- id: 69
  category: driver_responsibility
  question: En Carolina del Sur, ¿cuántos puntos se asignan a su historial de manejo
    por 'No dar una señal' o 'Dar una señal incorrecta'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: A
  explanation: De acuerdo con el sistema de puntos de Carolina del Sur, no señalar
    o dar una señal incorrecta resulta en 2 puntos.
- id: 70
  category: driver_responsibility
  question: Si su licencia de conducir de Carolina del Sur es suspendida debido a
    una interrupción en la cobertura del seguro, ¿cuál es la tarifa de restablecimiento
    para una primera infracción?
  choices:
    A: $50
    B: $100
    C: $200
    D: $400
  answer: C
  explanation: La tarifa de restablecimiento para una licencia suspendida debido a
    la cancelación o interrupción del seguro es de $200 en Carolina del Sur.
- id: 71
  category: driver_responsibility
  question: 'Un conductor de Carolina del Sur que sea condenado por una primera ofensa
    de DUI con un nivel de alcohol en sangre (BAC) de 0.15% o superior enfrenta una
    suspensión obligatoria de la licencia de:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Una condena por primera ofensa de DUI en Carolina del Sur resulta en
    una suspensión de 6 meses, independientemente de si el BAC era de 0.08% o 0.15%
    (aunque los niveles de BAC más altos conllevan sanciones penales más severas).
- id: 72
  category: driver_responsibility
  question: 'Si usted se ve involucrado en un accidente con un vehículo desatendido
    y no puede localizar al propietario, debe dejar una nota y:'
  choices:
    A: Esperar 24 horas antes de irse
    B: Informar el accidente a la autoridad policial correspondiente
    C: Tomar una foto y no hacer nada más
    D: Informarlo solo si el daño es superior a $5,000
  answer: B
  explanation: La ley de Carolina del Sur exige que deje una nota con su información
    y se comunique con la policía de inmediato si choca contra un vehículo desatendido.
- id: 73
  category: driver_responsibility
  question: Si se le requiere presentar un certificado SR-22 (Responsabilidad Financiera)
    en Carolina del Sur, ¿por cuánto tiempo debe mantener típicamente este comprobante
    de seguro?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: En Carolina del Sur, los conductores obligados a proporcionar una prueba
    de responsabilidad financiera (SR-22) generalmente deben mantenerla durante 3
    años.
- id: 74
  category: safe_driving_rules
  question: Según la ley de Carolina del Sur, ¿a cuántos pies de un hidrante de incendios
    no debe estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Carolina del Sur prohíbe estacionar un vehículo a menos de
    15 pies de un hidrante de incendios.
- id: 75
  category: safe_driving_rules
  question: 'En Carolina del Sur, la ley le exige encender las luces delanteras siempre
    que esté utilizando sus:'
  choices:
    A: Limpiaparabrisas de forma continua debido a la lluvia o la nieve
    B: Luces de emergencia
    C: Luces de giro
    D: Control de crucero
  answer: A
  explanation: La ley de Carolina del Sur exige que las luces delanteras se enciendan
    cuando los limpiaparabrisas están en uso como resultado de la lluvia, el aguanieve
    o la nieve.
- id: 76
  category: safe_driving_rules
  question: 'En Carolina del Sur, un conductor puede girar a la izquierda con luz
    roja ÚNICAMENTE cuando:'
  choices:
    A: Gira desde una calle de doble sentido hacia una calle de sentido único
    B: Gira desde una calle de sentido único hacia otra calle de sentido único
    C: La intersección está libre de todo tráfico
    D: Es después de la medianoche y no hay otros autos presentes
  answer: B
  explanation: La ley de Carolina del Sur permite girar a la izquierda en rojo solo
    cuando se gira desde una calle de sentido único hacia otra calle de sentido único,
    después de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 77
  category: safe_driving_rules
  question: Si se ve involucrado en un accidente de tráfico en Carolina del Sur que
    resulte en lesiones o daños a la propiedad de ________ o más, debe presentar un
    informe por escrito (Formulario FR-311) ante el SCDMV si el oficial no lo hace.
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: La ley de Carolina del Sur exige que se presente un informe por escrito
    si un accidente resulta en lesiones corporales, muerte o daños totales a la propiedad
    por un monto aparente de $1,000 o más.
- id: 78
  category: safe_driving_rules
  question: Al seguir a otro vehículo por la noche en Carolina del Sur, ¿a cuántos
    pies del vehículo de adelante debe bajar las luces altas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los conductores en Carolina del Sur deben bajar sus luces altas cuando
    sigan a otro vehículo a menos de 200 pies.
- id: 79
  category: safe_driving_rules
  question: ¿Cuántos puntos se asignan a su historial de conducción de Carolina del
    Sur por una condena de 'arrojar basura' (littering) desde un vehículo motorizado?
  choices:
    A: 0 puntos
    B: 2 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: En Carolina del Sur, una condena por arrojar basura desde un vehículo
    motorizado resulta en la adición de 2 puntos a su historial de conducción.
- id: 80
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril, ¿a cuántos pies del riel más cercano
    debe detenerse?
  choices:
    A: Entre 5 y 25 pies
    B: Entre 10 y 30 pies
    C: Entre 15 y 50 pies
    D: Exactamente 20 pies
  answer: C
  explanation: La ley de Carolina del Sur exige que los conductores se detengan entre
    15 y 50 pies del riel más cercano en un cruce de ferrocarril cuando las señales
    están parpadeando o se acerca un tren.
- id: 81
  category: safe_driving_rules
  question: 'En Carolina del Sur, es ilegal seguir a un camión de bomberos u otro
    vehículo de emergencia que responda a una alarma a una distancia menor de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Se prohíbe a los conductores seguir a un equipo de bomberos que se
    desplaza en respuesta a una alarma de incendio a una distancia menor de 500 pies.
- id: 82
  category: safe_driving_rules
  question: Al girar o cambiar de carril en Carolina del Sur, ¿con cuántos pies de
    antelación, como mínimo, debe señalizar antes de realizar la maniobra prevista?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Los conductores en Carolina del Sur están obligados a señalizar su
    intención de girar o cambiar de carril al menos 100 pies antes del movimiento.
- id: 83
  category: safe_driving_rules
  question: En Carolina del Sur, ¿se le prohíbe adelantar a otro vehículo cuando se
    encuentra a menos de cuántos pies de una intersección o un cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Es ilegal adelantar a otro vehículo a menos de 100 pies de una intersección
    o un cruce a nivel de ferrocarril en Carolina del Sur.
- id: 84
  category: safe_driving_rules
  question: En una carretera de cuatro o más carriles, cuando un autobús escolar se
    detiene con sus luces rojas intermitentes y el brazo de parada extendido, ¿qué
    conductores deben detenerse?
  choices:
    A: Solo los conductores que viajan en la misma dirección que el autobús
    B: Todos los conductores en todos los carriles y direcciones
    C: Solo los conductores en el carril directamente detrás del autobús
    D: Solo los conductores que viajan en la dirección opuesta
  answer: A
  explanation: En Carolina del Sur, en una carretera de cuatro o más carriles, solo
    el tráfico que sigue al autobús debe detenerse. El tráfico que viaja en la dirección
    opuesta no tiene que detenerse, aunque debe reducir la velocidad y tener precaución.
- id: 85
  category: safe_driving_rules
  question: 'La ley de Carolina del Sur exige que encienda los faros delanteros siempre
    que use los limpiaparabrisas debido a la lluvia, el aguanieve o la nieve, y también
    desde:'
  choices:
    A: Una hora después de la puesta del sol hasta una hora antes del amanecer
    B: Desde la puesta del sol hasta el amanecer
    C: Media hora después de la puesta del sol hasta media hora antes del amanecer
    D: De 9:00 PM a 6:00 AM
  answer: C
  explanation: La ley de Carolina del Sur exige que los faros delanteros estén encendidos
    desde media hora después de la puesta del sol hasta media hora antes del amanecer,
    y siempre que los limpiaparabrisas estén en uso.
- id: 86
  category: safe_driving_rules
  question: En Carolina del Sur, ¿no puede estacionar su vehículo a menos de cuántos
    pies de un paso de peatones en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: El estacionamiento está prohibido a menos de 20 pies de un paso de
    peatones en una intersección en Carolina del Sur.
- id: 87
  category: safe_driving_rules
  question: Al estacionar en paralelo en Carolina del Sur, ¿sus ruedas deben estar
    a menos de cuántas pulgadas del bordillo o acera?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: La ley de Carolina del Sur exige que, al estacionar en paralelo, las
    ruedas del vehículo deben estar a menos de 18 pulgadas del bordillo.
- id: 88
  category: safe_driving_rules
  question: En Carolina del Sur, ¿cuál es el límite de velocidad máximo en un distrito
    comercial o residencial sin señalización?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: A menos que se indique lo contrario, el límite de velocidad legal en
    distritos comerciales o residenciales en Carolina del Sur es de 30 mph.
- id: 89
  category: safe_driving_rules
  question: ¿No puede estacionar a menos de cuántos pies de la entrada de una estación
    de bomberos en el mismo lado de la calle?
  choices:
    A: 15 pies
    B: 20 pies
    C: 50 pies
    D: 75 pies
  answer: B
  explanation: La ley de Carolina del Sur prohíbe estacionar a menos de 20 pies de
    la entrada de acceso de cualquier estación de bomberos en el mismo lado de la
    calle.
- id: 90
  category: safe_driving_rules
  question: 'Al conducir con niebla densa en Carolina del Sur, debe usar:'
  choices:
    A: Luces altas (faros de largo alcance)
    B: Luces bajas (faros de corto alcance)
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia (intermitentes)
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en la humedad del aire, lo que provoca deslumbramiento y reduce aún más
    la visibilidad.
- id: 91
  category: defensive_driving
  question: Según el Manual del Conductor de Carolina del Sur, ¿cuál es la distancia
    mínima de seguimiento que debe mantener detrás del vehículo que le precede en
    condiciones ideales?
  choices:
    A: El largo de un vehículo
    B: Dos segundos
    C: Cuatro segundos
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de Carolina del Sur recomienda la 'regla de
    los dos segundos' como la distancia mínima de seguimiento bajo condiciones climáticas
    y de carretera ideales.
- id: 92
  category: defensive_driving
  question: En Carolina del Sur, ¿a qué velocidad puede comenzar a ocurrir el hidroplaneo
    (hydroplaning) bajo una lluvia intensa?
  choices:
    A: 55 mph
    B: 45 mph
    C: 35 mph
    D: 25 mph
  answer: C
  explanation: El Manual del Conductor de Carolina del Sur establece que el hidroplaneo
    (donde los neumáticos pierden contacto con la carretera y se deslizan sobre el
    agua) puede comenzar a velocidades tan bajas como 35 mph.
- id: 93
  category: defensive_driving
  question: 'Según la ley de Carolina del Sur, debe atenuar las luces altas cuando
    sigue a otro vehículo a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: La ley de Carolina del Sur (Sección 56-5-4830) exige que los conductores
    usen las luces bajas cuando sigan a otro vehículo a menos de 200 pies.
- id: 94
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente,
    ¿qué tan adelante sugiere el Manual del Conductor de Carolina del Sur que debe
    mirar?
  choices:
    A: 5 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: Solo una cuadra de la ciudad
  answer: B
  explanation: El manual aconseja observar de 10 a 15 segundos por delante de su vehículo
    para identificar posibles peligros con anticipación.
- id: 95
  category: defensive_driving
  question: Si queda deslumbrado por las luces altas de un vehículo que viene en sentido
    contrario en Carolina del Sur, ¿hacia dónde debe mirar para mantenerse en su carril?
  choices:
    A: A la línea central de la carretera
    B: Directamente a las luces que se aproximan
    C: Hacia el borde derecho de la carretera
    D: Cerrar los ojos momentáneamente
  answer: C
  explanation: Si queda deslumbrado por las luces altas que vienen en sentido contrario,
    el manual de SC recomienda mirar hacia el borde derecho de la carretera o hacia
    la línea blanca para evitar quedar totalmente cegado y mantenerse en su carril.
- id: 96
  category: defensive_driving
  question: 'Si su vehículo comienza a derrapar en una carretera resbaladiza de Carolina
    del Sur, usted debe:'
  choices:
    A: Frenar a fondo inmediatamente
    B: Girar el volante en la dirección opuesta al derrape
    C: Girar el volante en la dirección en la que derrapa la parte trasera del vehículo
    D: Acelerar para ganar tracción
  answer: C
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que se desliza la parte trasera del vehículo.
- id: 97
  category: defensive_driving
  question: ¿Si sus frenos dejan de funcionar mientras conduce, cuál es la primera
    acción defensiva que debe tomar según el manual de SC?
  choices:
    A: Apagar el motor inmediatamente
    B: Cambiar a punto muerto (neutral)
    C: Bombear el pedal del freno varias veces
    D: Saltar fuera del auto
  answer: C
  explanation: Si los frenos fallan, primero debe intentar bombear el pedal del freno
    para generar presión. Si eso falla, use el freno de estacionamiento y cambie a
    una marcha más baja.
- id: 98
  category: defensive_driving
  question: 'En Carolina del Sur, cuando sigue a un camión grande, debe aumentar su
    distancia de seguimiento para:'
  choices:
    A: Permitir que el conductor del camión lo vea en sus espejos laterales
    B: Evitar que el camión ruede hacia atrás y lo golpee
    C: Asegurarse de que puede ver el parachoques delantero del camión
    D: Tanto A como B
  answer: D
  explanation: Aumentar la distancia de seguimiento detrás de un camión asegura que
    no se encuentre en su 'No-Zone' (punto ciego) y proporciona un margen de seguridad
    si el camión retrocede en una pendiente.
- id: 99
  category: defensive_driving
  question: ¿Cuál es el requisito de la 'Ley de Moverse a un Lado' (Move Over Law)
    en Carolina del Sur al acercarse a un vehículo de emergencia con luces intermitentes
    en el arcén?
  choices:
    A: Detenerse completamente en el carril
    B: Mantener la velocidad pero tocar la bocina
    C: Moverse a un carril adyacente si es seguro, o reducir la velocidad significativamente
    D: Solo moverse a un lado si el vehículo de emergencia está en su carril
  answer: C
  explanation: La Ley de Moverse a un Lado de Carolina del Sur exige que los conductores
    se muevan a un carril adyacente si es posible, o que reduzcan la velocidad significativamente
    si cambiar de carril no es seguro al pasar vehículos de emergencia.
- id: 100
  category: defensive_driving
  question: 'Si experimenta el reventón de un neumático mientras conduce por una autopista
    de Carolina del Sur, debe:'
  choices:
    A: Frenar a fondo para detenerse rápidamente
    B: Sujetar el volante con firmeza y mantener el vehículo recto
    C: Girar inmediatamente hacia el arcén
    D: Acelerar para evitar que el neumático se deshaga
  answer: B
  explanation: En caso de un reventón, debe sujetar el volante con firmeza, quitar
    el pie del acelerador y dejar que el vehículo disminuya la velocidad gradualmente
    antes de salir de la carretera. Frenar repentinamente puede causar la pérdida
    de control.
- id: 101
  category: defensive_driving
  question: ¿Al entrar en una curva en Carolina del Sur, cuál es el momento más seguro
    para reducir la velocidad?
  choices:
    A: Mientras está en medio de la curva
    B: Justo al salir de la curva
    C: Antes de entrar en la curva
    D: Solo si siente que los neumáticos se deslizan
  answer: C
  explanation: La práctica de conducción defensiva dicta reducir la velocidad antes
    de entrar en una curva para mantener la tracción y el control durante todo el
    giro.
- id: 102
  category: defensive_driving
  question: 'La ley de Carolina del Sur exige que los automovilistas enciendan sus
    faros delanteros siempre que estén utilizando sus:'
  choices:
    A: Luces de emergencia
    B: Limpiaparabrisas
    C: Luces direccionales
    D: Aire acondicionado
  answer: B
  explanation: Según la ley de Carolina del Sur, los conductores deben encender sus
    faros delanteros cuando los limpiaparabrisas están en uso debido a la lluvia,
    el aguanieve o la nieve.
- id: 103
  category: defensive_driving
  question: Para practicar una conducción defensiva adecuada en Carolina del Sur,
    ¿con cuánta antelación debe observar la carretera en busca de posibles peligros?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 15 segundos
    C: De 20 a 25 segundos
    D: De 30 a 40 segundos
  answer: B
  explanation: Observar de 10 a 15 segundos hacia adelante le permite ver los peligros
    con anticipación y le brinda tiempo suficiente para ajustar su velocidad o posición
    de manera segura.
- id: 104
  category: defensive_driving
  question: Al conducir con niebla densa en Carolina del Sur, ¿qué luces debe utilizar
    para garantizar la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en la niebla. Las luces altas se reflejan
    en la humedad del aire, lo que provoca deslumbramiento y dificulta la visión.
- id: 105
  category: defensive_driving
  question: Al acercarse a una intersección en Carolina del Sur, ¿cuál es la secuencia
    de observación correcta para garantizar la seguridad?
  choices:
    A: Derecha, Izquierda, Derecha
    B: Izquierda, Derecha, Izquierda
    C: Recto, Izquierda, Derecha
    D: Izquierda, Recto, Derecha
  answer: B
  explanation: Debe mirar a la izquierda, luego a la derecha y luego a la izquierda
    nuevamente antes de entrar en una intersección, ya que los vehículos que vienen
    por la izquierda están más cerca de su trayectoria.
- id: 106
  category: defensive_driving
  question: Si su vehículo en Carolina del Sur está equipado con un Sistema de Frenos
    Antibloqueo (ABS) y necesita detenerse rápidamente, ¿cómo debe aplicar los frenos?
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante sin bombear
    C: Tocar ligeramente los frenos
    D: Poner el vehículo en punto muerto y usar el freno de emergencia
  answer: B
  explanation: Con el ABS, debe presionar el pedal del freno con firmeza y mantenerlo
    presionado. Bombear los frenos desactivará la eficacia del sistema ABS.
- id: 107
  category: defensive_driving
  question: 'Para revisar sus puntos ciegos antes de cambiar de carril en Carolina
    del Sur, usted debe:'
  choices:
    A: Revisar solo su espejo retrovisor
    B: Revisar solo sus espejos laterales
    C: Girar la cabeza y mirar por encima del hombro
    D: Confiar únicamente en el monitor de punto ciego de su automóvil
  answer: C
  explanation: Los espejos no lo muestran todo. Debe girar la cabeza y realizar una
    comprobación por encima del hombro para ver los vehículos en sus puntos ciegos
    antes de cambiar de carril.
- id: 108
  category: defensive_driving
  question: Durante una tormenta de lluvia en Carolina del Sur, ¿cuándo están las
    carreteras más resbaladizas?
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Justo cuando deja de llover
    C: Durante los primeros minutos de lluvia
    D: Solo cuando la temperatura es bajo cero
  answer: C
  explanation: Las carreteras están más resbaladizas durante los primeros minutos
    de lluvia porque el agua se mezcla con el aceite y la grasa del pavimento que
    aún no se han lavado.
- id: 109
  category: defensive_driving
  question: En Carolina del Sur, ¿en cuál de los siguientes momentos debe tener encendidos
    los faros delanteros?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde una hora después del atardecer hasta una hora antes del amanecer
    C: Desde media hora después del atardecer hasta media hora antes del amanecer
    D: Solo cuando está completamente oscuro
  answer: C
  explanation: La ley de Carolina del Sur establece que los faros delanteros deben
    estar encendidos desde media hora después del atardecer hasta media hora antes
    del amanecer, y en cualquier otro momento en que la visibilidad sea inferior a
    500 pies.
- id: 110
  category: alcohol_drugs_health
  question: Bajo la Ley de Consentimiento Implícito de Carolina del Sur, al conducir
    un vehículo en el estado, usted ha aceptado someterse a una prueba química de
    alcohol o drogas. ¿Cuál es la sanción por negarse por primera vez a realizar esta
    prueba?
  choices:
    A: Una multa de $500 y 30 días de cárcel
    B: Suspensión automática de su licencia de conducir por seis meses
    C: Suspensión automática de su licencia de conducir por 90 días
    D: Una revocación permanente de sus privilegios de conducir
  answer: B
  explanation: De acuerdo con la Ley de Consentimiento Implícito de Carolina del Sur
    (Sección 56-5-2950), si se niega a someterse a una prueba química, su licencia
    será suspendida automáticamente por al menos seis meses por una primera infracción.
- id: 111
  category: alcohol_drugs_health
  question: En Carolina del Sur, ¿se considera que una persona de 21 años o más está
    conduciendo bajo la influencia (DUI) si su concentración de alcohol en sangre
    (BAC) es igual o superior a qué nivel?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En Carolina del Sur, el límite legal de concentración de alcohol en
    sangre (BAC) para conductores de 21 años o más es de 0.08%.
- id: 112
  category: alcohol_drugs_health
  question: Si es condenado por una primera infracción de DUI en Carolina del Sur
    con un BAC inferior al 0.10%, ¿cuál es la pena máxima de cárcel posible?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Para una condena por primera infracción de DUI en Carolina del Sur
    con un BAC inferior al 0.10%, la sanción incluye una multa de $400 (más costas
    judiciales) o prisión de 48 horas a 30 días.
- id: 113
  category: alcohol_drugs_health
  question: Según la Ley de Emma (Emma's Law) en Carolina del Sur, ¿un infractor de
    DUI por primera vez debe instalar un dispositivo de interbloqueo de encendido
    (IID) si su BAC fue igual o superior a qué nivel?
  choices:
    A: 0.08%
    B: 0.12%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: La Ley de Emma exige que los infractores de DUI por primera vez con
    un BAC de 0.15% o superior instalen un dispositivo de interbloqueo de encendido
    (IID) en su vehículo para recuperar los privilegios de conducción.
- id: 114
  category: alcohol_drugs_health
  question: De acuerdo con la ley de envases abiertos de Carolina del Sur, ¿dónde
    es legal llevar un envase abierto de cerveza o vino en un vehículo motorizado?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: En el maletero o área de equipaje
    D: En la consola central
  answer: C
  explanation: La ley de Carolina del Sur prohíbe los envases abiertos de cerveza
    o vino en un vehículo motorizado, excepto en el maletero o el área de equipaje.
    Es ilegal tener un envase abierto en el área de pasajeros.
- id: 115
  category: alcohol_drugs_health
  question: Si su licencia de conducir de Carolina del Sur es suspendida por una condena
    de DUI, ¿qué programa debe completar antes de poder solicitar la reinstalación?
  choices:
    A: El Curso de Conducción Defensiva de Carolina del Sur
    B: El Programa de Acción para la Seguridad contra el Alcohol y las Drogas (ADSAP)
    C: El Panel de Impacto a las Víctimas
    D: La Clínica de Mejora del Conductor
  answer: B
  explanation: La ley de Carolina del Sur exige que cualquier persona condenada por
    DUI o cuya licencia sea suspendida bajo la Ley de Consentimiento Implícito complete
    el Programa de Acción para la Seguridad contra el Alcohol y las Drogas (ADSAP)
    antes de poder recuperar su licencia.
- id: 116
  category: alcohol_drugs_health
  question: Cuando se consume alcohol, ¿cuál de las siguientes capacidades suele ser
    la primera en verse afectada?
  choices:
    A: La visión y la audición
    B: La coordinación muscular
    C: El juicio y la toma de decisiones
    D: El equilibrio y el habla
  answer: C
  explanation: El juicio es la primera facultad afectada por el alcohol. La capacidad
    de un conductor para evaluar riesgos y tomar decisiones seguras se ve comprometida
    mucho antes de que se pierda la coordinación física.
- id: 117
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de mezclar alcohol con otras drogas, como medicamentos
    recetados o sustancias ilegales?
  choices:
    A: Los efectos de la droga son anulados por el alcohol
    B: El alcohol evita que la droga entre en el torrente sanguíneo
    C: Crea un efecto sinérgico, haciendo que la alteración sea mucho peor que con
      cualquiera de los dos por separado
    D: No hay un cambio significativo en los niveles de alteración
  answer: C
  explanation: Mezclar alcohol y drogas crea un efecto sinérgico, lo que significa
    que el impacto combinado en el sistema nervioso central es mayor que la suma de
    los efectos individuales, lo que provoca una alteración grave.
- id: 118
  category: alcohol_drugs_health
  question: Si un conductor menor de 21 años es sorprendido con un BAC de 0.02% o
    superior, ¿por cuánto tiempo se le suspenderá la licencia por una primera infracción?
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Bajo la ley de Tolerancia Cero de Carolina del Sur, a un conductor
    menor de 21 años con un BAC de 0.02% o superior se le suspenderá la licencia por
    3 meses por una primera infracción.
- id: 119
  category: alcohol_drugs_health
  question: 'En Carolina del Sur, un ''DUI por delito grave'' (Felony DUI) ocurre
    cuando un conductor bajo la influencia causa un accidente que resulta en:'
  choices:
    A: Daños a la propiedad que superen los $5,000
    B: La muerte de otra persona o lesiones corporales graves
    C: Una persecución a alta velocidad con las fuerzas del orden
    D: Daños a un vehículo propiedad del estado
  answer: B
  explanation: Un DUI por delito grave en Carolina del Sur es un cargo serio que se
    aplica cuando una persona que conduce bajo la influencia causa lesiones corporales
    graves o la muerte a otra persona.
- id: 120
  category: alcohol_drugs_health
  question: ¿Puede ser condenado por DUI en Carolina del Sur si conduce bajo la influencia
    de un medicamento recetado legalmente?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, el DUI solo se aplica al alcohol y a las drogas ilegales
    C: Sí, si el medicamento afecta su capacidad para conducir de manera segura
    D: Solo si también tiene alcohol en su sistema
  answer: C
  explanation: La ley de Carolina del Sur establece que es ilegal conducir bajo la
    influencia de cualquier sustancia, incluidos los medicamentos recetados o de venta
    libre, que afecte su capacidad para operar un vehículo de manera segura.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma efectiva de reducir su concentración
    de alcohol en sangre (BAC) después de beber?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Darle tiempo a su cuerpo para procesar el alcohol
  answer: D
  explanation: El tiempo es el único factor que reducirá el BAC. El cuerpo procesa
    el alcohol a un ritmo constante (aproximadamente una bebida estándar por hora),
    y el café, las duchas o la comida no aceleran este proceso.
- id: 122
  category: alcohol_drugs_health
  question: Si es condenado por conducir bajo los efectos del alcohol o drogas (DUI)
    en Carolina del Sur, ¿durante cuántos años se le exigirá que proporcione una prueba
    de responsabilidad financiera?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: Los conductores condenados por DUI en Carolina del Sur deben presentar
    un certificado SR-22 (prueba de responsabilidad financiera) ante el SCDMV durante
    tres años.
- id: 123
  category: alcohol_drugs_health
  question: 'Si tiene una condición médica que pueda afectar su capacidad para conducir,
    como epilepsia o diabetes, usted debe:'
  choices:
    A: Dejar de conducir inmediatamente y entregar su licencia
    B: Informar la condición al SCDMV al solicitar o renovar su licencia
    C: Informar la condición solo si se ve involucrado en un accidente
    D: Mantener la condición en privado para evitar restricciones en la licencia
  answer: B
  explanation: Carolina del Sur exige que los conductores declaren las condiciones
    físicas o mentales que puedan afectar su capacidad para conducir de manera segura.
    El SCDMV puede requerir un informe médico de un médico.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción para un conductor menor de 21 años que es condenado
    por comprar o poseer alcohol en Carolina del Sur?
  choices:
    A: Solo una multa
    B: Solo servicio comunitario obligatorio
    C: Una suspensión obligatoria de la licencia de conducir
    D: No hay sanción si no estaba conduciendo en ese momento
  answer: C
  explanation: En Carolina del Sur, si una persona menor de 21 años es condenada por
    comprar, consumir o poseer alcohol (incluso si no es en un vehículo), se le suspenderá
    la licencia de conducir.
- id: 125
  category: alcohol_drugs_health
  question: Bajo la ley de 'Consentimiento Implícito' de Carolina del Sur, ¿qué está
    aceptando al operar un vehículo motorizado?
  choices:
    A: Mantener un seguro de responsabilidad civil en todo momento
    B: Dar sangre si se ve involucrado en cualquier accidente
    C: Someterse a una prueba de aliento, sangre u orina si un oficial de la ley sospecha
      que conduce bajo la influencia
    D: Permitir el registro de su vehículo en cualquier momento sin una orden judicial
  answer: C
  explanation: La ley de Consentimiento Implícito de Carolina del Sur significa que,
    al conducir por las carreteras del estado, usted ya ha dado su consentimiento
    para ser sometido a pruebas de alcohol o drogas si lo solicita un oficial que
    tenga una causa probable.
- id: 126
  category: alcohol_drugs_health
  question: En Carolina del Sur, ¿cuál es el período de suspensión automática de la
    licencia por negarse por primera vez a someterse a una prueba de alcoholemia bajo
    la ley de Consentimiento Implícito?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 1 año
  answer: B
  explanation: Si se niega a realizar una prueba química en Carolina del Sur por primera
    vez, sus privilegios de conducir se suspenden automáticamente por seis meses.
- id: 127
  category: alcohol_drugs_health
  question: ¿Cuál es el programa obligatorio que los conductores de Carolina del Sur
    deben completar para restablecer su licencia después de una condena por DUI o
    una suspensión por Consentimiento Implícito?
  choices:
    A: El Curso de Conducción Defensiva de Carolina del Sur (SCDDC)
    B: El Programa de Acción de Seguridad contra el Alcohol y las Drogas (ADSAP)
    C: El Programa de Mejora del Conductor (DIP)
    D: El Panel de Impacto en las Víctimas (VIP)
  answer: B
  explanation: La ley de Carolina del Sur exige que cualquier persona cuya licencia
    haya sido suspendida por un DUI o una violación del Consentimiento Implícito complete
    el Programa de Acción de Seguridad contra el Alcohol y las Drogas (ADSAP) antes
    de poder recuperar su licencia.
- id: 128
  category: alcohol_drugs_health
  question: De acuerdo con la 'Ley de Emma' de Carolina del Sur, un infractor de DUI
    por primera vez con un BAC de _____ o superior debe tener instalado un dispositivo
    de bloqueo de encendido (IID) en su vehículo.
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.12%
    D: 0.15%
  answer: D
  explanation: La Ley de Emma exige que los infractores de DUI por primera vez en
    Carolina del Sur con un BAC de 0.15% o superior instalen un dispositivo de bloqueo
    de encendido (IID) durante seis meses.
- id: 129
  category: alcohol_drugs_health
  question: ¿Cuál es la sentencia mínima de cárcel por una primera condena por DUI
    en Carolina del Sur si el BAC del conductor era inferior al 0.10%?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 1 semana
  answer: B
  explanation: Una primera condena por DUI en Carolina del Sur conlleva una sentencia
    mínima obligatoria de 48 horas de cárcel, que a veces puede cumplirse como servicio
    comunitario.
- id: 130
  category: alcohol_drugs_health
  question: 'Si está tomando un medicamento recetado y un médico no le ha advertido
    sobre la conducción, usted debe:'
  choices:
    A: Asumir que es seguro conducir
    B: Revisar la etiqueta para ver si hay advertencias sobre 'operar maquinaria pesada'
      o somnolencia
    C: Conducir solo si tiene un pasajero con usted
    D: Conducir solo durante las horas del día
  answer: B
  explanation: En Carolina del Sur, puede ser condenado por DUI incluso si el medicamento
    es recetado legalmente. Siempre revise las etiquetas para detectar efectos secundarios
    como somnolencia o alteración del juicio.
- id: 131
  category: alcohol_drugs_health
  question: Para solicitar una licencia de conducir de Carolina del Sur, ¿una persona
    con antecedentes de convulsiones debe haber estado libre de convulsiones durante
    cuánto tiempo como mínimo?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Los estándares médicos de Carolina del Sur generalmente requieren que
    una persona con un trastorno convulsivo esté libre de convulsiones durante 6 meses
    antes de que se le autorice a conducir.
- id: 132
  category: alcohol_drugs_health
  question: En Carolina del Sur, si es condenado por conducir bajo los efectos del
    alcohol o drogas (DUI), ¿cuánto tiempo permanece la infracción en su historial
    de manejo para fines de contabilizar ofensas posteriores?
  choices:
    A: 3 años
    B: 5 años
    C: 10 años
    D: Permanentemente
  answer: C
  explanation: Carolina del Sur utiliza un período de "mirada hacia atrás" (look-back)
    de 10 años para las infracciones de DUI. Una segunda infracción de DUI dentro
    de los 10 años posteriores a la primera conlleva sanciones mucho más severas.
- id: 133
  category: alcohol_drugs_health
  question: Si un conductor de Carolina del Sur es condenado por una primera ofensa
    de DUI, su licencia se suspende por 6 meses. Sin embargo, ¿podría ser elegible
    para una "Licencia Provisional" si cumple con qué criterios?
  choices:
    A: No tienen otras suspensiones de licencia y se inscriben en ADSAP
    B: Solo conducen hacia y desde el trabajo
    C: Pagan una multa de $5,000 de inmediato
    D: Son mayores de 25 años
  answer: A
  explanation: Un infractor de DUI por primera vez en SC puede ser elegible para una
    licencia provisional si poseía una licencia válida al momento del arresto, no
    tiene otras suspensiones y se inscribe en el programa ADSAP.
- id: 134
  category: penalties_and_points
  question: En Carolina del Sur, ¿cuántos puntos se asignan a su historial de manejo
    por la infracción de "Conducir demasiado rápido para las condiciones"?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 1 punto
  answer: A
  explanation: De acuerdo con el sistema de puntos de Carolina del Sur, "Conducir
    demasiado rápido para las condiciones" es una infracción de 2 puntos.
- id: 135
  category: penalties_and_points
  question: Si un conductor de Carolina del Sur acumula de 16 a 17 puntos en su historial
    de manejo, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 3 meses
    B: 4 meses
    C: 5 meses
    D: 6 meses
  answer: B
  explanation: En Carolina del Sur, un total de 16 o 17 puntos resulta en una suspensión
    de 4 meses de los privilegios de conducir.
- id: 136
  category: penalties_and_points
  question: Un conductor de Carolina del Sur puede reducir su total de puntos en 4
    puntos al completar ¿cuál de los siguientes?
  choices:
    A: Un reexamen escrito del examen de permiso
    B: Un curso de manejo defensivo aprobado por el SCDMV
    C: Un año de conducción sin nuevas infracciones
    D: Pagar una tarifa de "reducción de puntos" de $200
  answer: B
  explanation: Los conductores pueden eliminar 4 puntos de su historial al completar
    con éxito un curso de manejo defensivo aprobado por el SCDMV, siempre que los
    puntos estuvieran en el historial antes del curso.
- id: 137
  category: penalties_and_points
  question: En Carolina del Sur, ¿cuál es el valor en puntos por "No señalizar" o
    "Dar una señal inadecuada"?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 0 puntos
  answer: A
  explanation: El sistema de puntos de Carolina del Sur asigna 2 puntos por no señalizar
    o usar una señal inadecuada.
- id: 138
  category: penalties_and_points
  question: Para una condena por primera ofensa de DUI en Carolina del Sur con un
    nivel de alcohol en sangre (BAC) entre 0.08% y 0.10%, ¿cuál es el posible término
    de encarcelamiento?
  choices:
    A: Sin tiempo de cárcel, solo multa
    B: 48 horas a 30 días
    C: 10 días a 90 días
    D: 30 días a 6 meses
  answer: B
  explanation: Una condena por primera ofensa de DUI con un BAC de al menos 0.08%
    pero menos de 0.10% conlleva una sanción de 48 horas a 30 días de cárcel, aunque
    a veces se puede realizar servicio público en lugar de la cárcel.
- id: 139
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera infracción del uso del cinturón
    de seguridad en Carolina del Sur?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: En Carolina del Sur, la multa por una infracción del cinturón de seguridad
    no supera los $25 y no se pueden imponer costos judiciales.
- id: 140
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por "Cambiar de carril sin seguridad" en Carolina
    del Sur?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 3 puntos
  answer: A
  explanation: Cambiar de carril sin seguridad (cambio de carril inadecuado) es una
    infracción de 2 puntos en el estado de Carolina del Sur.
- id: 141
  category: penalties_and_points
  question: Si acumula de 18 a 19 puntos en su historial de conducción de Carolina
    del Sur, ¿por cuántos meses se suspenderá su licencia?
  choices:
    A: 4 meses
    B: 5 meses
    C: 6 meses
    D: 12 meses
  answer: B
  explanation: La ley de Carolina del Sur exige una suspensión de 5 meses para los
    conductores que acumulen 18 o 19 puntos.
- id: 142
  category: penalties_and_points
  question: En Carolina del Sur, ¿cuántos puntos se asignan por 'Desobediencia a un
    oficial de tránsito'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: La desobediencia a cualquier oficial que actúe oficialmente como tal
    y tenga autoridad para dirigir el tránsito es una infracción de 4 puntos.
- id: 143
  category: penalties_and_points
  question: En Carolina del Sur, ¿cuántos puntos se asignan a su historial de conducción
    por no atenuar las luces delanteras cuando sea necesario?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: Sin puntos, solo una multa
  answer: A
  explanation: Según el sistema de puntos de Carolina del Sur, operar con luces inadecuadas
    o no atenuar las luces resulta en la adición de 2 puntos a su historial de conducción.
- id: 144
  category: penalties_and_points
  question: Si decide no comprar un seguro de responsabilidad civil para su vehículo
    en Carolina del Sur, ¿cuál es la tarifa anual que debe pagar al SCDMV para registrarse
    como automovilista sin seguro?
  choices:
    A: 250 dólares
    B: 400 dólares
    C: 550 dólares
    D: 600 dólares
  answer: D
  explanation: Carolina del Sur permite a los propietarios de vehículos motorizados
    pagar una tarifa anual de $600 por automovilista sin seguro si no tienen seguro
    de responsabilidad civil. Esta tarifa no proporciona protección de seguro; solo
    permite que el vehículo sea registrado.
- id: 145
  category: penalties_and_points
  question: 'En Carolina del Sur, debe presentar un informe de accidente (Formulario
    FR-309) si hay lesiones personales, muerte o daños a la propiedad de cualquier
    persona por un monto de:'
  choices:
    A: 500 dólares o más
    B: 750 dólares o más
    C: 1,000 dólares o más
    D: 2,000 dólares o más
  answer: C
  explanation: La ley estatal exige que notifique a la policía de inmediato y presente
    un informe si un accidente resulta en lesiones, muerte o daños a la propiedad
    de $1,000 o más.
- id: 146
  category: penalties_and_points
  question: ¿Se considera a un conductor de Carolina del Sur como un 'Infractor Habitual'
    si acumula cuántas condenas mayores (como DUI o conducción temeraria) en un período
    de tres años?
  choices:
    A: 2 condenas
    B: 3 condenas
    C: 5 condenas
    D: 10 condenas
  answer: B
  explanation: Según la ley de Carolina del Sur, un Infractor Habitual es cualquier
    persona que acumule tres o más condenas mayores (como DUI, conducción temeraria
    o conducir bajo suspensión) en un período de tres años.
- id: 147
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de la ley de Carolina del
    Sur contra el envío de mensajes de texto mientras se conduce?
  choices:
    A: 25 dólares
    B: 50 dólares
    C: 100 dólares
    D: 200 dólares
  answer: A
  explanation: En Carolina del Sur, la multa por una primera infracción de enviar
    mensajes de texto mientras se conduce es de $25. Es una infracción civil y no
    se asignan puntos al historial de conducción.
- id: 148
  category: penalties_and_points
  question: 'Si un conductor de Carolina del Sur acumula 20 puntos o más, su licencia
    será suspendida por:'
  choices:
    A: 3 meses
    B: 4 meses
    C: 5 meses
    D: 6 meses
  answer: D
  explanation: El período máximo de suspensión por acumulación de puntos en Carolina
    del Sur es de 6 meses, lo cual ocurre cuando un conductor alcanza 20 puntos o
    más.
- id: 149
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resulta en 2 puntos en un historial
    de conducción de Carolina del Sur?
  choices:
    A: Exceder el límite de velocidad por 10 mph o menos
    B: Conducción temeraria
    C: Rebasar un autobús escolar
    D: No ceder el derecho de paso
  answer: A
  explanation: Exceder el límite de velocidad por 10 mph o menos es una infracción
    de 2 puntos. La conducción temeraria y rebasar un autobús escolar son 6 puntos,
    y no ceder el paso son 4 puntos.
- id: 150
  category: penalties_and_points
  question: 'En Carolina del Sur, una condena por DUI por primera vez con una concentración
    de alcohol en sangre (BAC) de 0.15% o superior requiere la instalación obligatoria
    de:'
  choices:
    A: Un regulador de velocidad
    B: Un dispositivo de bloqueo de encendido (IID)
    C: Una unidad de seguimiento por GPS
    D: Nuevas luces de freno
  answer: B
  explanation: La ley de Carolina del Sur (Ley de Emma) exige que los infractores
    de DUI por primera vez con un BAC de 0.15% o superior utilicen un dispositivo
    de bloqueo de encendido (IID) durante seis meses.
- id: 151
  category: penalties_and_points
  question: ¿Cuántos puntos se le asignan a un conductor de Carolina del Sur por un
    "atropello y fuga" (hit-and-run) que solo involucre daños a la propiedad?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Una condena por atropello y fuga que resulte solo en daños a la propiedad
    es una infracción de 6 puntos en Carolina del Sur.
- id: 152
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento para una licencia de conducir de
    Carolina del Sur que fue suspendida únicamente debido a la acumulación de puntos?
  choices:
    A: 50 dólares
    B: 100 dólares
    C: 200 dólares
    D: 300 dólares
  answer: B
  explanation: Para restablecer una licencia suspendida bajo el sistema de puntos
    en Carolina del Sur, el conductor debe pagar una tarifa de restablecimiento de
    $100 al SCDMV.
- id: 153
  category: sharing_the_road
  question: En Carolina del Sur, ¿cuándo NO es obligatorio detenerse ante un autobús
    escolar que tiene sus luces rojas intermitentes y el brazo de parada extendido?
  choices:
    A: Cuando circula por una carretera de dos carriles en dirección opuesta
    B: Cuando circula por una carretera de cuatro o más carriles en dirección opuesta
    C: Cuando el autobús está detenido en un carril de giro
    D: Siempre debe detenerse ante un autobús escolar, independientemente del tipo
      de carretera
  answer: B
  explanation: Según la Sección 56-5-2770 del Código de Carolina del Sur, un conductor
    no necesita detenerse ante un autobús escolar cuando viaja en la dirección opuesta
    en una carretera de carriles múltiples (cuatro o más carriles), independientemente
    de si hay una mediana.
- id: 154
  category: sharing_the_road
  question: Bajo la "Ley de Moverse a un Lado" (Move Over Law) de Carolina del Sur,
    ¿cuál es la multa por no cambiarse a un carril adyacente (si es seguro) al acercarse
    a un vehículo de emergencia estacionado con luces intermitentes?
  choices:
    A: Entre $50 y $100
    B: Entre $100 y $250
    C: Entre $300 y $500
    D: Exactamente $1,000
  answer: C
  explanation: La Sección 56-5-1538 del Código de Carolina del Sur estipula que una
    persona que viole la Ley de Moverse a un Lado es culpable de un delito menor y,
    tras ser condenada, debe ser multada con no menos de $300 ni más de $500.
- id: 155
  category: sharing_the_road
  question: Al rebasar a un ciclista en Carolina del Sur, ¿cuál es la distancia mínima
    de seguridad que un automovilista debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La Sección 56-5-3435 del Código de Carolina del Sur exige que los automovilistas
    mantengan una distancia de operación segura al rebasar a una persona que monta
    en bicicleta, la cual se define como al menos tres pies.
- id: 156
  category: sharing_the_road
  question: En Carolina del Sur, ¿a qué edad un operador o pasajero de motocicleta
    ya no está legalmente obligado a usar casco?
  choices:
    A: 16 años de edad
    B: 18 años de edad
    C: 21 años de edad
    D: 25 años de edad
  answer: C
  explanation: La Sección 56-5-3660 del Código de Carolina del Sur establece que es
    ilegal que cualquier persona menor de 21 años opere o viaje en una motocicleta
    de dos ruedas a menos que use un casco protector aprobado por el Departamento
    de Seguridad Pública.
- id: 157
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor en Carolina del Sur al acercarse a un peatón
    que lleva un bastón blanco o usa un perro guía?
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Ceder el paso y tomar precauciones para evitar lesiones
    C: Esperar a que el peatón le haga una señal para pasar
    D: Conducir alrededor de ellos a una distancia de al menos 10 pies
  answer: B
  explanation: La Sección 56-5-3200 del Código de Carolina del Sur exige que los conductores
    tomen todas las precauciones necesarias para evitar lesiones a cualquier peatón
    guiado por un perro o que lleve un bastón blanco (con o sin punta roja).
- id: 158
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    acerca por detrás, la ley de Carolina del Sur le exige:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Acelerar para apartarse del camino
    C: Detenerse en el borde derecho de la carretera y parar
    D: Detenerse en el borde izquierdo de la carretera y parar
  answer: C
  explanation: La ley de Carolina del Sur exige que los conductores cedan el paso
    dirigiéndose al borde derecho o al bordillo de la carretera, despejando cualquier
    intersección, y deteniéndose hasta que el vehículo de emergencia haya pasado.
- id: 159
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen "No-Zones" (Zonas No). ¿Qué son
    estas?
  choices:
    A: Áreas donde no se permite circular a los camiones
    B: Puntos ciegos donde el conductor del camión no puede verlo
    C: Zonas de velocidad restringida para vehículos pesados
    D: Áreas de estacionamiento reservadas para tractocamiones
  answer: B
  explanation: El Manual del Conductor de Carolina del Sur define las "No-Zones" como
    los grandes puntos ciegos alrededor de un camión (delantero, trasero y laterales)
    donde la visibilidad del conductor es limitada y es más probable que ocurran accidentes.
- id: 160
  category: sharing_the_road
  question: 'Por una primera infracción de rebasar ilegalmente a un autobús escolar
    detenido en Carolina del Sur, la multa puede ser de hasta:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Según la Sección 56-5-2770 del Código de Carolina del Sur, una primera
    infracción por rebasar ilegalmente a un autobús escolar detenido conlleva una
    multa de no menos de $1,000 ni más de $2,000, o encarcelamiento por 30 días.
- id: 161
  category: sharing_the_road
  question: 'Al andar en bicicleta de noche en Carolina del Sur, la bicicleta debe
    estar equipada con una lámpara en la parte delantera que emita una luz blanca
    visible desde una distancia de al menos:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La Sección 56-5-3470 del Código de Carolina del Sur exige que toda
    bicicleta utilizada de noche debe estar equipada con una lámpara en la parte delantera
    que emita una luz blanca visible desde una distancia de al menos 500 pies.
- id: 162
  category: sharing_the_road
  question: 'Si no puede cambiarse a un carril adyacente al acercarse a un vehículo
    de emergencia estacionado en una carretera de Carolina del Sur, usted debe:'
  choices:
    A: Mantener su velocidad pero tocar la bocina
    B: Reducir la velocidad a una velocidad segura para las condiciones
    C: Detenerse por completo en su carril actual
    D: Encender las luces de emergencia y mantener la velocidad
  answer: B
  explanation: Según la Ley de Moverse a un Lado (Move Over Law) de Carolina del Sur,
    si un cambio de carril no es posible o seguro, el conductor debe reducir la velocidad
    a una velocidad segura para las circunstancias y de una manera que no ponga en
    peligro al personal de emergencia.
- id: 163
  category: sharing_the_road
  question: ¿Es legal el 'lane splitting' (conducir una motocicleta entre filas de
    vehículos detenidos o en movimiento en el mismo carril) en Carolina del Sur?
  choices:
    A: Sí, es legal a velocidades inferiores a 20 mph
    B: Sí, es legal en todas las carreteras de carriles múltiples
    C: No, es ilegal
    D: Solo si la motocicleta está refrigerada por aire
  answer: C
  explanation: La Sección 56-5-3640 del Código de Carolina del Sur prohíbe a los operadores
    de motocicletas adelantar y rebasar en el mismo carril ocupado por el vehículo
    que se está adelantando y prohíbe operar una motocicleta entre carriles de tráfico.
- id: 164
  category: sharing_the_road
  question: En Carolina del Sur, si no hay aceras, ¿por dónde debe caminar un peatón?
  choices:
    A: En el arcén derecho, con el flujo del tráfico
    B: En el arcén izquierdo, de frente al tráfico que viene en sentido contrario
    C: En el centro del carril
    D: En el lado que tenga más sombra
  answer: B
  explanation: La Sección 56-5-3160 del Código de Carolina del Sur establece que donde
    no se proporcionen aceras, cualquier peatón que camine a lo largo de una carretera
    deberá, cuando sea factible, caminar únicamente por el lado izquierdo de la calzada
    o su arcén, de frente al tráfico que pueda acercarse desde la dirección opuesta.
- id: 165
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el conductor puede:'
  choices:
    A: Girar desde el carril izquierdo
    B: Abrirse hacia la izquierda antes de girar a la derecha
    C: Mantenerse lo más cerca posible del bordillo
    D: Detenerse y esperar a que el tráfico se despeje en ambas calles
  answer: B
  explanation: Debido a su longitud, los camiones grandes a menudo necesitan abrirse
    hacia la izquierda para realizar un giro a la derecha sin que las ruedas traseras
    golpeen el bordillo u otros objetos.
- id: 166
  category: sharing_the_road
  question: Según la ley de Carolina del Sur, los ciclistas no pueden circular más
    de ______ a la par en una calzada.
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: En fila india únicamente
  answer: A
  explanation: La Sección 56-5-3430 del Código de Carolina del Sur establece que las
    personas que montan en bicicleta por una calzada no deben circular más de dos
    a la par, excepto en senderos o partes de calzadas reservadas para el uso exclusivo
    de bicicletas.
- id: 167
  category: sharing_the_road
  question: Según la Ley de Moverse a un Lado (Move Over Law) de Carolina del Sur,
    ¿qué debe hacer al acercarse a un vehículo de emergencia estacionado con luces
    intermitentes en una carretera con al menos dos carriles que viajan en la misma
    dirección?
  choices:
    A: Detenerse por completo hasta que el vehículo de emergencia se retire.
    B: Mantener su velocidad pero moverse al carril más cercano al vehículo de emergencia.
    C: Moverse a un carril que no sea adyacente al vehículo de emergencia, si es seguro
      hacerlo.
    D: Aumentar su velocidad para rebasar el vehículo de emergencia lo más rápido
      posible.
  answer: C
  explanation: El Código de SC § 56-5-1538 requiere que los conductores se muevan
    a un carril que no sea adyacente al vehículo de emergencia estacionado si la carretera
    tiene al menos dos carriles en esa dirección y es seguro hacerlo. Si no es seguro,
    el conductor debe reducir la velocidad.
- id: 168
  category: sharing_the_road
  question: En Carolina del Sur, la ley exige que los operadores y pasajeros de motocicletas
    usen casco si son menores de ¿qué edad?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: El Código de SC § 56-5-3660 requiere que cualquier persona menor de
    21 años que opere o viaje en una motocicleta de dos ruedas use un casco protector
    aprobado por el Departamento de Seguridad Pública.
- id: 169
  category: sharing_the_road
  question: 'Al seguir a un camión comercial grande, si no puede ver los espejos laterales
    del conductor del camión, usted está:'
  choices:
    A: En la 'Zona Ciega' (No-Zone) del camión.
    B: En una posición segura de succión para ahorrar combustible.
    C: En la línea de visión clara del conductor del camión.
    D: Obligado a encender sus luces altas.
  answer: A
  explanation: Los camiones grandes tienen puntos ciegos significativos conocidos
    como 'No-Zones'. Si no puede ver los espejos del conductor, el conductor no puede
    verlo a usted, lo que aumenta el riesgo de una colisión.
- id: 170
  category: sharing_the_road
  question: Según la ley de Carolina del Sur, ¿qué debe hacer un conductor cuando
    un peatón cruza la calle guiado por un perro o lleva un bastón blanco (con o sin
    punta roja)?
  choices:
    A: Tocar la bocina para avisarles que está allí.
    B: Tomar el derecho de paso si el semáforo está en verde.
    C: Detenerse y tomar las precauciones necesarias para evitar herir al peatón.
    D: Reducir la velocidad y pasar cerca de ellos.
  answer: C
  explanation: El Código de SC § 56-5-3200 ordena que los conductores deben tomar
    todas las precauciones necesarias para evitar lesiones a un peatón ciego o parcialmente
    ciego que lleve un bastón blanco o utilice un perro guía.
- id: 171
  category: sharing_the_road
  question: ¿Cuál es el rango de multa específico por una primera infracción de la
    Ley de Hacerse a un Lado (Move Over Law) de Carolina del Sur que no resulte en
    lesiones?
  choices:
    A: Entre $10 y $25
    B: Entre $50 y $100
    C: Entre $300 y $500
    D: Exactamente $1,000
  answer: C
  explanation: El Código de SC § 56-5-1538 especifica que una persona que viole la
    Ley de Hacerse a un Lado (Move Over Law) es culpable de un delito menor y, tras
    ser condenada, debe ser multada con no menos de $300 ni más de $500.
- id: 172
  category: sharing_the_road
  question: En Carolina del Sur, ¿se les permite a los ciclistas circular por el sistema
    de autopistas interestatales del estado?
  choices:
    A: Sí, si se mantienen en el arcén (shoulder).
    B: Sí, pero solo durante las horas del día.
    C: No, está prohibido por ley.
    D: Solo si están en un grupo de cinco o más.
  answer: C
  explanation: Por razones de seguridad, generalmente se prohíbe el uso de bicicletas
    en las autopistas de acceso totalmente controlado (interestatales) en Carolina
    del Sur.
- id: 173
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la 'división
    de carril' (lane splitting) (operar entre carriles de tráfico) para motocicletas
    en Carolina del Sur?
  choices:
    A: Es legal cuando el tráfico se mueve a menos de 15 mph.
    B: Es legal solo en autopistas de varios carriles.
    C: Es ilegal en Carolina del Sur.
    D: Se fomenta para reducir la congestión del tráfico.
  answer: C
  explanation: El Código de SC § 56-5-3640 establece que ninguna persona debe operar
    una motocicleta entre carriles de tráfico o entre líneas o filas adyacentes de
    vehículos.
- id: 174
  category: sharing_the_road
  question: Si usted sigue a un aparato de bomberos (camión de bomberos) que responde
    a una alarma en Carolina del Sur, ¿cuál es la distancia mínima de seguimiento
    que debe mantener?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Código de SC § 56-5-1960 prohíbe seguir a un aparato de bomberos
    que viaja en respuesta a una alarma de incendio a una distancia menor de 500 pies.
- id: 175
  category: sharing_the_road
  question: Según la ley de Carolina del Sur, ¿qué privilegio de derecho de paso se
    le otorga a un cortejo fúnebre?
  choices:
    A: Deben obedecer todas las señales de tráfico como cualquier otro vehículo.
    B: El cortejo tiene el derecho de paso en las intersecciones si el vehículo guía
      entró legalmente.
    C: Solo tienen el derecho de paso si son escoltados por la policía.
    D: Deben ceder el paso a todos los peatones pero no a otros vehículos.
  answer: B
  explanation: El Código de SC § 56-5-3150 establece que un cortejo fúnebre tiene
    el derecho de paso en una intersección, independientemente de los dispositivos
    de control de tráfico, si el vehículo guía entró en la intersección legalmente.
- id: 176
  category: sharing_the_road
  question: 'El emblema de vehículo de movimiento lento es una señal naranja triangular.
    En Carolina del Sur, este emblema debe mostrarse en vehículos diseñados para viajar
    a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de vehículo de movimiento lento (triángulo naranja con borde
    rojo) es obligatorio en vehículos diseñados para operar a velocidades de 25 mph
    o menos, como la maquinaria agrícola.
- id: 177
  category: vehicle_information
  question: Según la ley de Carolina del Sur, ¿cuándo debe tener encendidas las luces
    delanteras?
  choices:
    A: Solo entre las 10:00 PM y las 6:00 AM
    B: Siempre que use los limpiaparabrisas debido a las inclemencias del tiempo
    C: Solo cuando conduzca por autopistas rurales
    D: Solo cuando esté lloviendo lo suficientemente fuerte como para detenerse a
      un lado
  answer: B
  explanation: La ley de Carolina del Sur exige que las luces delanteras se enciendan
    desde media hora después de la puesta del sol hasta media hora antes de la salida
    del sol, y en cualquier momento en que se utilicen los limpiaparabrisas debido
    a la lluvia, el aguanieve o la nieve.
- id: 178
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    en un vehículo de pasajeros en Carolina del Sur?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Carolina del Sur exige que los neumáticos tengan al menos
    2/32 (o 1/16) de pulgada de profundidad de la banda de rodadura para que se consideren
    seguros y legales para su operación.
- id: 179
  category: vehicle_information
  question: La ley de Carolina del Sur exige que todo vehículo motorizado tenga un
    espejo que permita al conductor ver la carretera hacia atrás por al menos ¿cuántos
    pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Todo vehículo motorizado debe estar equipado con un espejo ubicado
    de tal manera que refleje al conductor una vista de la carretera por una distancia
    de al menos 200 pies hacia atrás.
- id: 180
  category: vehicle_information
  question: 'Según la ley de Carolina del Sur, la bocina de un vehículo debe ser audible
    en condiciones normales desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las regulaciones de equipamiento de vehículos de Carolina del Sur establecen
    que una bocina debe ser capaz de emitir un sonido audible en condiciones normales
    desde una distancia no menor a 200 pies.
- id: 181
  category: vehicle_information
  question: ¿Cuál es el nivel máximo de oscuridad permitido legalmente para el polarizado
    de las ventanas laterales de un vehículo en Carolina del Sur?
  choices:
    A: Debe permitir el paso de al menos el 20% de la luz
    B: Debe permitir el paso de al menos el 27% de la luz
    C: Debe permitir el paso de al menos el 32% de la luz
    D: Debe permitir el paso de al menos el 50% de la luz
  answer: B
  explanation: La ley de Carolina del Sur exige que el polarizado de las ventanas
    delanteras, laterales y traseras debe permitir al menos un 27% de transmisión
    de luz.
- id: 182
  category: vehicle_information
  question: En Carolina del Sur, ¿el freno de servicio (pedal) debe ser capaz de detener
    un vehículo que viaja a 20 mph en cuántos pies?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 40 pies
  answer: C
  explanation: Los estándares de equipamiento de Carolina del Sur exigen que el freno
    de pedal debe ser capaz de detener el vehículo en un máximo de 30 pies cuando
    viaja a una velocidad de 20 mph.
- id: 183
  category: vehicle_information
  question: Si una carga se extiende más de ____ pies más allá de la parte trasera
    de un vehículo en Carolina del Sur, se debe colocar una bandera roja o una luz
    roja al final de la carga.
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: Siempre que una carga se extienda más de cuatro pies más allá de la
    plataforma o carrocería de un vehículo, se debe mostrar una bandera roja (durante
    el día) o una luz roja (por la noche) al final de la carga.
- id: 184
  category: vehicle_information
  question: 'Las señales de giro en un vehículo en Carolina del Sur deben ser visibles
    desde una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Carolina del Sur exige que las luces direccionales utilizadas
    para indicar un giro deben ser visibles desde una distancia de al menos 100 pies
    bajo la luz solar normal.
- id: 185
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los sistemas
    de escape en Carolina del Sur?
  choices:
    A: Los cortes o derivaciones del silenciador (muffler cutouts) son legales para
      su uso en autopistas
    B: Cada vehículo debe tener un silenciador en buen estado de funcionamiento para
      evitar ruidos excesivos
    C: Los sistemas de escape no se inspeccionan ni regulan en SC
    D: Se permite un escape ruidoso si el vehículo tiene más de 20 años
  answer: B
  explanation: La ley de Carolina del Sur exige que todo vehículo motorizado esté
    equipado con un silenciador en buen estado de funcionamiento para evitar ruidos
    excesivos o inusuales y humo molesto. Los cortes o derivaciones del silenciador
    son ilegales.
- id: 186
  category: vehicle_information
  question: 'En Carolina del Sur, debe encender sus faros delanteros si no puede ver
    claramente a personas o vehículos en la carretera a una distancia de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Se requieren faros delanteros en Carolina del Sur siempre que la visibilidad
    se reduzca a 500 pies o menos debido a luz insuficiente o condiciones atmosféricas
    desfavorables.
- id: 187
  category: vehicle_information
  question: 'La placa de matrícula trasera de un vehículo en Carolina del Sur debe
    estar iluminada de modo que sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Carolina del Sur exige una luz blanca para iluminar la placa
    de matrícula trasera de modo que sea claramente legible desde una distancia de
    50 pies hacia atrás.
- id: 188
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos NO es obligatorio en todos los vehículos
    de pasajeros en Carolina del Sur?
  choices:
    A: Un velocímetro que funcione
    B: Limpiaparabrisas
    C: Luces antiniebla
    D: Un espejo retrovisor
  answer: C
  explanation: Si bien los limpiaparabrisas, los espejos y los velocímetros son requisitos
    de seguridad estándar, las luces antiniebla son equipo opcional y no son obligatorias
    por la ley de Carolina del Sur para todos los vehículos.
- id: 189
  category: vehicle_information
  question: En Carolina del Sur, ¿cuál es la sanción por una primera infracción por
    conducir un vehículo que no está cubierto por el seguro de responsabilidad civil
    obligatorio?
  choices:
    A: Una multa de $5.00 por día y la suspensión de la licencia
    B: Mandato de 30 días en la cárcel
    C: Pérdida permanente del registro del vehículo
    D: No hay sanción si usted no tuvo la culpa en un accidente
  answer: A
  explanation: Si lo sorprenden conduciendo sin seguro en Carolina del Sur, se enfrenta
    a una multa de $5.00 por cada día que el vehículo no estuvo asegurado, y su licencia
    de conducir y el registro serán suspendidos hasta que se pague una tarifa de restablecimiento
    de $600 y se obtenga el seguro.
- id: 190
  category: vehicle_information
  question: Según la ley de Carolina del Sur, ¿cuál es el porcentaje mínimo de transmisión
    de luz permitido para el polarizado de las ventanas laterales y traseras de un
    automóvil de pasajeros?
  choices:
    A: 20%
    B: 27%
    C: 32%
    D: 35%
  answer: B
  explanation: La ley de Carolina del Sur (Sección 56-5-5015) prohíbe el polarizado
    de ventanas que reduzca la transmisión de luz a menos del 27%.
- id: 191
  category: vehicle_information
  question: 'En relación con los sistemas de frenado, la ley de Carolina del Sur exige
    que todo vehículo motorizado debe tener un sistema de freno de estacionamiento
    que sea capaz de:'
  choices:
    A: Detener el automóvil en un tramo de 30 pies a 20 mph
    B: Mantener el vehículo en cualquier pendiente en la que se opere
    C: Funcionar automáticamente si falla el freno de pie
    D: Usarse únicamente al estacionar en una colina
  answer: B
  explanation: La Sección 56-5-4850 del Código de Carolina del Sur especifica que
    el freno de estacionamiento debe ser adecuado para mantener el vehículo en cualquier
    pendiente en la que se opere, bajo todas las condiciones de carga.
- id: 192
  category: vehicle_information
  question: 'La ley de Carolina del Sur exige que todo vehículo motorizado esté equipado
    con un espejo ubicado de tal manera que refleje al conductor una vista de la carretera
    por una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: La Sección 56-5-4990 del Código de Carolina del Sur exige un espejo
    retrovisor que proporcione una vista de al menos 200 pies hacia la parte trasera
    del vehículo.
- id: 193
  category: vehicle_information
  question: 'Según la Ley de Protección de Niños Pasajeros de Carolina del Sur, los
    niños deben estar asegurados en un asiento de seguridad para niños orientado hacia
    atrás hasta que tengan al menos:'
  choices:
    A: 1 año de edad
    B: 2 años de edad
    C: 3 años de edad
    D: 4 años de edad
  answer: B
  explanation: La ley de Carolina del Sur exige que los niños utilicen un asiento
    de seguridad orientado hacia atrás hasta que tengan al menos 2 años de edad o
    hayan superado los límites de altura y peso del asiento.
- id: 194
  category: vehicle_information
  question: En Carolina del Sur, un niño debe estar asegurado en un asiento elevado
    (booster seat) de posicionamiento de cinturón hasta que cumpla con cuál de los
    siguientes criterios?
  choices:
    A: Tengan al menos 6 años de edad
    B: Tengan al menos 8 años de edad o al menos 4 pies y 9 pulgadas de altura
    C: Pesen al menos 60 libras
    D: Tengan al menos 10 años de edad
  answer: B
  explanation: La Sección 56-5-6410 del Código de Carolina del Sur establece que los
    niños deben usar un asiento elevado (booster seat) hasta que cumplan 8 años o
    alcancen una altura de 4 pies y 9 pulgadas.
- id: 195
  category: vehicle_information
  question: ¿Cuál es la multa civil por violar la ley de Carolina del Sur que exige
    que los faros delanteros estén encendidos cuando los limpiaparabrisas están en
    uso?
  choices:
    A: Ninguna multa, solo una advertencia
    B: $25
    C: $100
    D: $200
  answer: B
  explanation: Una violación de la ley de 'limpiaparabrisas encendidos, luces encendidas'
    en Carolina del Sur es una infracción civil sancionable con una multa de $25.
- id: 196
  category: vehicle_information
  question: 'La ley de Carolina del Sur exige que todo vehículo motorizado debe estar
    equipado con un silenciador (muffler) en buen estado de funcionamiento para evitar:'
  choices:
    A: Cualquier humo visible
    B: Ruido excesivo o inusual y humo molesto
    C: Emisiones de dióxido de carbono
    D: El sobrecalentamiento del motor
  answer: B
  explanation: La Sección 56-5-5020 del Código de Carolina del Sur exige silenciadores
    para evitar 'ruidos excesivos o inusuales y humo molesto'. Los recortes o derivaciones
    del silenciador son ilegales.
- id: 197
  category: signs_and_signals
  question: En Carolina del Sur, ¿qué significa una luz de tráfico amarilla intermitente?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Proceder con precaución
    C: La luz está a punto de cambiar a rojo
    D: Ceder el paso a todo el tráfico que viene únicamente por la derecha
  answer: B
  explanation: Según el Manual del Conductor de Carolina del Sur, una luz amarilla
    intermitente significa que debe reducir la velocidad y proceder con precaución.
- id: 198
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para las zonas de 'No Rebasar'
    (No Passing) en Carolina del Sur y se coloca en el lado izquierdo de la carretera?
  choices:
    A: Diamante
    B: Rectángulo
    C: Banderín (Pennant)
    D: Pentágono
  answer: C
  explanation: Se utiliza una señal en forma de banderín (pennant) para marcar el
    inicio de una zona de no rebasar y se coloca de manera única en el lado izquierdo
    de la carretera para que sea visible para los conductores que intentan rebasar.
- id: 199
  category: signs_and_signals
  question: Según la ley de Carolina del Sur, ¿cuándo se le permite girar a la izquierda
    con luz roja?
  choices:
    A: Nunca
    B: Solo cuando se gira desde una calle de un solo sentido hacia otra calle de
      un solo sentido
    C: Siempre que no haya tráfico en sentido contrario
    D: Solo entre las 12:00 AM y las 5:00 AM
  answer: B
  explanation: En Carolina del Sur, se permite un giro a la izquierda en rojo solo
    cuando se gira desde una calle de un solo sentido hacia otra calle de un solo
    sentido después de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 200
  category: signs_and_signals
  question: En Carolina del Sur, ¿qué indican las líneas amarillas sólidas dobles
    en el centro de la calzada?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Se prohíbe rebasar desde cualquier dirección
    D: La carretera es una calle de un solo sentido
  answer: C
  explanation: Las líneas amarillas sólidas dobles indican que está prohibido rebasar
    para el tráfico que circula en ambas direcciones.
- id: 201
  category: signs_and_signals
  question: De acuerdo con el Manual del Conductor de Carolina del Sur, ¿cuál es la
    señal manual correcta para indicar un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: Para señalar un giro a la derecha utilizando señales manuales en Carolina
    del Sur, el conductor debe extender el brazo izquierdo por la ventana y doblarlo
    hacia arriba a la altura del codo.
- id: 202
  category: signs_and_signals
  question: 'Al acercarse a un autobús escolar con sus luces rojas intermitentes y
    el brazo de parada extendido en una autopista de carriles múltiples (cuatro o
    más carriles) en Carolina del Sur, usted debe detenerse si:'
  choices:
    A: Viaja en la dirección opuesta al autobús
    B: Viaja en la misma dirección que el autobús
    C: Se encuentra en cualquier parte de la autopista, independientemente de la dirección
    D: El autobús está detenido únicamente en una intersección designada
  answer: B
  explanation: La Sección 56-5-2770 del Código de Carolina del Sur establece que en
    una autopista de cuatro o más carriles, un conductor no necesita detenerse ante
    un autobús escolar si viaja en la dirección opuesta. Sin embargo, los conductores
    que viajan en la misma dirección que el autobús siempre deben detenerse.
- id: 203
  category: signs_and_signals
  question: En Carolina del Sur, ¿una señal de forma redonda se utiliza específicamente
    para cuál de los siguientes casos?
  choices:
    A: Señales de ceder el paso
    B: Zonas escolares
    C: Advertencia anticipada de cruce de ferrocarril
    D: Señales de alto
  answer: C
  explanation: Una señal circular (redonda) se utiliza casi exclusivamente para la
    advertencia anticipada de ferrocarril, con el fin de alertar a los conductores
    de que se están acercando a un cruce ferroviario.
- id: 204
  category: signs_and_signals
  question: ¿Qué representa una línea blanca continua pintada a través de un carril
    en una intersección en Carolina del Sur?
  choices:
    A: Un paso de peatones únicamente
    B: Una línea de parada, que indica dónde detenerse ante una señal o semáforo
    C: Un divisor de carril para vehículos HOV (vehículos de alta ocupación)
    D: Un límite de estacionamiento
  answer: B
  explanation: Una línea blanca continua a través de un carril es una línea de parada.
    Indica a los conductores dónde detener su vehículo cuando lo requiera una señal
    de alto o un semáforo.
- id: 205
  category: signs_and_signals
  question: En Carolina del Sur, ¿cuál es el significado de una señal en forma de
    pentágono?
  choices:
    A: Zona de no adelantar
    B: Hospital adelante
    C: Zona escolar o cruce escolar
    D: Parque público adelante
  answer: C
  explanation: Una señal de cinco lados (pentágono) indica una zona escolar o un cruce
    escolar.
- id: 206
  category: signs_and_signals
  question: En Carolina del Sur, ¿qué significa una señal de 'X' amarilla fija sobre
    un carril reversible?
  choices:
    A: El carril está abierto para todo el tráfico
    B: Debe salir de este carril lo antes posible porque la señal está a punto de
      cambiar a una X roja
    C: El carril está reservado únicamente para vehículos de emergencia
    D: Puede usar el carril solo para giros a la izquierda
  answer: B
  explanation: Una 'X' amarilla fija sobre un carril significa que la dirección del
    carril está cambiando y usted debe salir de ese carril de manera segura.
- id: 207
  category: signs_and_signals
  question: ¿Cuál es el color estándar para las señales reglamentarias, como las que
    indican límites de velocidad o 'Prohibido estacionar', en Carolina del Sur?
  choices:
    A: Amarillo
    B: Naranja
    C: Blanco con letras negras
    D: Verde
  answer: C
  explanation: Las señales reglamentarias, que informan a los conductores sobre las
    leyes y regulaciones, suelen ser rectangulares y de color blanco con letras o
    símbolos negros.
- id: 208
  category: signs_and_signals
  question: Si se acerca a una intersección y la luz del semáforo cambia de verde
    a amarillo, ¿qué debe hacer según las pautas de Carolina del Sur?
  choices:
    A: Acelerar para despejar la intersección antes de que cambie a rojo
    B: Detenerse si puede hacerlo de manera segura
    C: Detenerse inmediatamente, incluso si está en medio de la intersección
    D: Tocar la bocina y continuar
  answer: B
  explanation: Una luz amarilla fija significa que la señal está a punto de cambiar
    a rojo. Debe detenerse si puede hacerlo de manera segura; de lo contrario, proceda
    con precaución a través de la intersección.
- id: 209
  category: signs_and_signals
  question: En Carolina del Sur, ¿qué significa una señal naranja en forma de diamante?
  choices:
    A: Advertencia general de peligros en la carretera
    B: Zona de obras de construcción o mantenimiento
    C: Guía direccional hacia parques estatales
    D: Área de descanso adelante
  answer: B
  explanation: Las señales naranjas se utilizan específicamente para zonas de obras
    de construcción y mantenimiento para alertar a los conductores sobre los trabajadores
    y las condiciones cambiantes de la carretera.
- id: 210
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas en una calzada de Carolina
    del Sur?
  choices:
    A: El tráfico se mueve en direcciones opuestas; se permite adelantar
    B: El borde de la calzada
    C: El tráfico se mueve en la misma dirección; se permiten los cambios de carril
      cuando sea seguro
    D: Hay un paso de peatones adelante
  answer: C
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Se permite cruzar estas líneas para cambiar de
    carril cuando sea seguro hacerlo.
- id: 211
  category: signs_and_signals
  question: ¿En Carolina del Sur, cuando usted está en un semáforo en rojo y tiene
    la intención de girar a la derecha, cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Puede girar a la derecha sin detenerse si no viene tráfico.
    B: Debe esperar a que la luz cambie a verde antes de girar a la derecha.
    C: Puede girar a la derecha después de detenerse por completo y ceder el paso
      a los peatones y a otro tráfico, a menos que una señal lo prohíba.
    D: Solo puede girar a la derecha en rojo si hay un oficial de policía dirigiendo
      el tráfico.
  answer: C
  explanation: De acuerdo con el Manual del Conductor de Carolina del Sur, los conductores
    pueden girar a la derecha con el semáforo en rojo después de detenerse por completo
    y ceder el paso al tráfico y a los peatones, siempre que no haya una señal instalada
    que diga 'No Turn on Red' (No girar en rojo).
- id: 212
  category: signs_and_signals
  question: Si las luces de giro de su vehículo no funcionan, ¿cuál es la señal manual
    correcta en Carolina del Sur para indicar que está disminuyendo la velocidad o
    deteniéndose?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana.
    B: Brazo extendido hacia arriba en un ángulo de 90 grados.
    C: Brazo extendido hacia abajo con la palma de la mano hacia atrás.
    D: Mover el brazo en un movimiento circular.
  answer: C
  explanation: Para señalar una parada o una disminución de la velocidad mediante
    señales manuales en Carolina del Sur, el conductor debe extender el brazo izquierdo
    hacia abajo con la palma de la mano hacia atrás.
- id: 213
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para indicar un giro a la derecha en
    Carolina del Sur?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera.
    B: Brazo izquierdo extendido hacia arriba en un ángulo de 90 grados.
    C: Brazo izquierdo extendido hacia abajo.
    D: Brazo derecho extendido recto hacia afuera.
  answer: B
  explanation: La señal manual para un giro a la derecha es el brazo izquierdo extendido
    por la ventana y doblado hacia arriba en un ángulo de 90 grados.
- id: 214
  category: signs_and_signals
  question: 'En Carolina del Sur, una línea amarilla continua en su lado de la línea
    central significa:'
  choices:
    A: Puede adelantar si el camino por delante está despejado.
    B: Se encuentra en una zona de construcción.
    C: Está prohibido adelantar en su carril.
    D: Debe disminuir la velocidad a 25 mph.
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central indica una
    'zona de no adelantar'. No debe cruzar esta línea para adelantar a otros vehículos.
- id: 215
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas sólidas dobles pintadas en el pavimento
    en Carolina del Sur?
  choices:
    A: Puede cruzarlas para cambiar de carril si es seguro.
    B: Separan el tráfico que se mueve en direcciones opuestas.
    C: Está prohibido cruzar las líneas.
    D: Indican un área de estacionamiento designada.
  answer: C
  explanation: Las líneas blancas sólidas dobles se utilizan para separar carriles
    de tráfico que se mueven en la misma dirección donde está prohibido cruzar las
    líneas.
- id: 216
  category: signs_and_signals
  question: Al acercarse a una rotonda en Carolina del Sur, ¿a quién debe ceder el
    derecho de paso?
  choices:
    A: Al tráfico que entra por la derecha.
    B: Al tráfico que ya está dentro de la rotonda.
    C: A nadie; el tráfico dentro del círculo debe cederle el paso a usted.
    D: Solo a los vehículos de emergencia.
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el derecho de
    paso al tráfico que ya está circulando dentro de la rotonda.
- id: 217
  category: signs_and_signals
  question: ¿Para qué propósito se utiliza exclusivamente una señal en forma de pentágono
    (cinco lados) en Carolina del Sur?
  choices:
    A: Señales de pare (Stop).
    B: Señales de ceda el paso (Yield).
    C: Zonas escolares o cruces escolares.
    D: Cruces de ferrocarril.
  answer: C
  explanation: La forma de pentágono está reservada para las señales de zonas escolares
    y cruces escolares para alertar a los conductores sobre la presencia de niños.
- id: 218
  category: signs_and_signals
  question: ¿Dónde se ubica una señal de 'No Passing Zone' (Zona de no adelantar)
    en forma de banderín en una carretera de Carolina del Sur?
  choices:
    A: En el lado derecho de la carretera al comienzo de la zona.
    B: En el lado izquierdo de la carretera al comienzo de la zona.
    C: Elevada sobre el centro de la carretera.
    D: En el lado derecho de la carretera al final de la zona.
  answer: B
  explanation: La señal de 'No Passing Zone' en forma de banderín es única porque
    se coloca en el lado izquierdo de la carretera para proporcionar una advertencia
    adicional a los conductores que puedan estar intentando adelantar.
- id: 219
  category: signs_and_signals
  question: ¿Qué significa una señal de flecha amarilla fija en Carolina del Sur?
  choices:
    A: Usted tiene el derecho de paso para girar.
    B: El período de giro protegido está terminando; prepárese para detenerse o ceder
      el paso.
    C: Puede girar solo después de detenerse por completo.
    D: Los peatones están cruzando en este momento.
  answer: B
  explanation: Una flecha amarilla fija significa que el tiempo de giro 'protegido'
    está terminando. Los conductores deben estar preparados para que la señal cambie
    a rojo y deben ceder el paso a cualquier tráfico que venga en sentido contrario
    si continúan el giro.
- id: 220
  category: signs_and_signals
  question: Al acercarse a un cruce de ferrocarril con una señal de 'aspa' (crossbuck)
    y sin otras señales, ¿qué debe hacer?
  choices:
    A: Detenerse siempre, incluso si no viene ningún tren.
    B: Acelerar para cruzar las vías rápidamente.
    C: Disminuir la velocidad, mirar y escuchar si viene un tren, y ceder el derecho
      de paso a cualquier tren que se aproime.
    D: Ignorar la señal si no ve un tren.
  answer: C
  explanation: Una señal de aspa (crossbuck) es una señal reglamentaria que requiere
    que usted ceda el derecho de paso a los trenes. Debe disminuir la velocidad y
    estar preparado para detenerse si se acerca un tren.
- id: 221
  category: signs_and_signals
  question: ¿En Carolina del Sur, qué color y forma se utilizan para las señales de
    advertencia de construcción y mantenimiento?
  choices:
    A: Diamante amarillo.
    B: Diamante naranja.
    C: Rectángulo blanco.
    D: Rectángulo verde.
  answer: B
  explanation: Las señales de advertencia de construcción y mantenimiento en Carolina
    del Sur tienen forma de diamante y son de color naranja para alertar a los conductores
    sobre las zonas de trabajo.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y continúe con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 222
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 223
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 224
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 225
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de SENTIDO ÚNICO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 226
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 227
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 228
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 229
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro con forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 230
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que deben hacer los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 231
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 232
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 233
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 234
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 235
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 236
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 237
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 238
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 239
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera gire
    primero en un sentido y luego en el otro.
  id: 240
- image: winding_road.png
  category: signs_and_signals
  id: 241
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
- image: merge.png
  category: signs_and_signals
  id: 242
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
- image: road_narrows.png
  category: signs_and_signals
  id: 243
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la carretera y
    ajuste su posición en el carril.
- image: divided_highway.png
  category: signs_and_signals
  id: 244
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
- image: divided_highway_ends.png
  category: signs_and_signals
  id: 245
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
- image: two_way_traffic.png
  category: signs_and_signals
  id: 246
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
- image: slippery_when_wet.png
  category: signs_and_signals
  id: 247
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
- image: hill.png
  category: signs_and_signals
  id: 248
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente empinada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente empinada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
- image: signal_ahead.png
  category: signs_and_signals
  id: 249
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de pare (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un puesto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
- image: stop_ahead.png
  category: signs_and_signals
  id: 250
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de pare (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de pare (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de pare.
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 251
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 252
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 253
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse o permanecer con el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 254
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 255
