metadata:
  source: 2025 Pennsylvania Driver's Manual
  total_questions: 261
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Pennsylvania, what is the minimum age required to apply for a learner's
    permit?
  choices:
    A: 15 years old
    B: 15 and 6 months old
    C: 16 years old
    D: 17 years old
  answer: C
  explanation: According to the Pennsylvania Driver's Manual, an individual must be
    at least 16 years of age to apply for a learner's permit.
- id: 2
  category: license_system
  question: How long is a Pennsylvania learner's permit valid for from the date of
    issue?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 4 years
  answer: B
  explanation: A Pennsylvania learner's permit is valid for one year. If it expires
    before the road test is passed, the applicant must apply for an extension.
- id: 3
  category: license_system
  question: Under Pennsylvania's GDL laws, how many hours of behind-the-wheel skill-building
    must a permit holder under 18 complete before taking the road test?
  choices:
    A: 40 hours
    B: 50 hours
    C: 65 hours
    D: 75 hours
  answer: C
  explanation: Pennsylvania requires 65 hours of supervised behind-the-wheel experience,
    which must include 10 hours of nighttime driving and 5 hours of bad weather driving.
- id: 4
  category: license_system
  question: A Pennsylvania Junior License holder is generally not permitted to drive
    between what hours?
  choices:
    A: 9:00 PM to 5:00 AM
    B: 10:00 PM to 6:00 AM
    C: 11:00 PM to 5:00 AM
    D: Midnight to 6:00 AM
  answer: C
  explanation: Junior License holders may not drive between 11:00 PM and 5:00 AM unless
    they are involved in public or charitable service, or are traveling for employment
    or volunteer fire company duties.
- id: 5
  category: license_system
  question: If you move to a new address within Pennsylvania, you must notify PennDOT
    of your change of address within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: Pennsylvania law requires drivers to notify PennDOT of a change of
    name or address within 15 days.
- id: 6
  category: license_system
  question: During the first six months of holding a Junior License, how many passengers
    under the age of 18 (who are not immediate family members) are allowed in the
    vehicle?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: For the first six months of holding a Junior License, a driver may
    not carry more than one passenger under age 18 who is not an immediate family
    member unless accompanied by a parent or guardian.
- id: 7
  category: license_system
  question: In Pennsylvania, a Junior License will be suspended for 90 days if the
    driver accumulates how many points?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: PennDOT will suspend a Junior License for 90 days if the driver accumulates
    six or more points or is convicted of driving 26 mph or more over the posted speed
    limit.
- id: 8
  category: license_system
  question: If a permit holder under the age of 18 fails the road test, how long must
    they wait before they can take the test again?
  choices:
    A: 2 days
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: Drivers under age 18 who fail the road test must wait seven days before
    they can retake the test. This allows time for additional practice.
- id: 9
  category: license_system
  question: When driving with a learner's permit, the supervisor in the front seat
    must be at least how old (if they are not a spouse or guardian)?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: B
  explanation: The person accompanying a permit holder must be at least 21 years of
    age, or at least 18 years of age if they are the permit holder's spouse, guardian,
    or parent.
- id: 10
  category: license_system
  question: 'A Pennsylvania Junior License holder can apply for a regular Senior License
    before age 18 if they have held the Junior License for one year, have no accidents
    or convictions, and:'
  choices:
    A: Are at least 16 and a half years old
    B: Are at least 17 years old
    C: Have completed a state-approved driver education course
    D: Have completed 100 hours of driving
  answer: C
  explanation: A Junior License holder can apply for a Senior License at age 17 and
    a half if they have passed an approved driver training course and have not been
    involved in a reportable crash or convicted of a violation for one year.
- id: 11
  category: license_system
  question: Of the 65 required practice hours for a Pennsylvania learner's permit,
    how many must be dedicated specifically to bad weather driving?
  choices:
    A: 2 hours
    B: 5 hours
    C: 10 hours
    D: 15 hours
  answer: B
  explanation: Pennsylvania law requires that at least 5 of the 65 supervised practice
    hours be conducted in inclement weather conditions.
- id: 12
  category: license_system
  question: 'After holding a Junior License for six months, the passenger limit for
    non-family members under 18 increases to:'
  choices:
    A: Two
    B: Three
    C: Four
    D: Unlimited
  answer: B
  explanation: After the first six months of holding a Junior License, the limit increases
    to three passengers under age 18 who are not immediate family members, provided
    the driver has not been involved in an accident or convicted of a violation.
- id: 13
  category: license_system
  question: Which form must be completed by a medical professional before a Pennsylvania
    learner's permit can be issued?
  choices:
    A: DL-180
    B: DL-80
    C: MV-1
    D: DL-102
  answer: A
  explanation: The DL-180 (Non-Commercial Learner's Permit Application) includes a
    medical qualification section that must be completed by a physician, physician
    assistant, or certified registered nurse practitioner.
- id: 14
  category: license_system
  question: In Pennsylvania, what is the required visual acuity (with or without corrective
    lenses) to obtain an unrestricted driver's license?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Pennsylvania requires a visual acuity of at least 20/40 in the better
    eye for an unrestricted license.
- id: 15
  category: license_system
  question: New residents who move to Pennsylvania and possess a valid out-of-state
    driver's license must apply for a PA license within how many days of establishing
    residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: According to the Pennsylvania Driver's Manual, new residents must apply
    for a Pennsylvania driver's license within 60 days of establishing residency in
    the state.
- id: 16
  category: license_system
  question: 'In Pennsylvania, drivers who are 65 years of age or older have the option
    to renew their driver''s license every:'
  choices:
    A: Year
    B: Two years
    C: Five years
    D: Six years
  answer: B
  explanation: While the standard renewal period is four years, Pennsylvania law allows
    drivers aged 65 and older to choose a two-year license renewal cycle.
- id: 17
  category: license_system
  question: Under the Pennsylvania point system, how many points are removed from
    a driving record for every 12 consecutive months a person drives without a violation?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: PennDOT removes three points from a driver's record for every 12 consecutive
    months in which the driver is not under suspension or revocation and has not committed
    any violations.
- id: 18
  category: license_system
  question: A Pennsylvania driver whose license is suspended may be eligible for an
    Occupational Limited License (OLL). For which of the following is an OLL NOT valid?
  choices:
    A: Driving to and from work
    B: Driving to a medical appointment
    C: Driving to a grocery store or social event
    D: Driving to an accredited program of higher education
  answer: C
  explanation: An OLL is restricted to driving for work, school, or medical treatment.
    It cannot be used for recreational or general personal errands.
- id: 19
  category: license_system
  question: A Pennsylvania motorcycle learner's permit holder is prohibited from which
    of the following activities?
  choices:
    A: Driving between sunset and sunrise
    B: Driving on a highway
    C: Driving a motorcycle with more than 500cc
    D: Driving without a helmet
  answer: A
  explanation: Pennsylvania motorcycle permit holders are restricted from operating
    a motorcycle between sunset and sunrise and are not permitted to carry any passengers
    except a licensed instructor.
- id: 20
  category: license_system
  question: If a Pennsylvania driver is convicted of failing to stop for a school
    bus with its red lights flashing and stop arm extended, how many points are added
    to their driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: Failing to stop for a school bus with its red lights flashing and stop
    arm extended results in a 60-day suspension and 5 points on the driving record.
- id: 21
  category: license_system
  question: 'When a Pennsylvania driver reaches 6 or more points for the first time,
    they will receive a notice to:'
  choices:
    A: Surrender their license immediately
    B: Take a special written point examination
    C: Attend a mandatory court hearing
    D: Pay a $500 surcharge
  answer: B
  explanation: When a driving record reaches 6 or more points for the first time,
    the driver must take a special written examination regarding safe driving practices
    and the point system.
- id: 22
  category: license_system
  question: If you change your name due to marriage or a court order, you must notify
    PennDOT and apply for a corrected license within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: Pennsylvania law requires drivers to report a name change to PennDOT
    within 15 days of the change.
- id: 23
  category: license_system
  question: Which of the following is a requirement for a Pennsylvania resident to
    apply for a Commercial Driver's License (CDL) to operate a vehicle in 'interstate'
    commerce?
  choices:
    A: Must be at least 16 years old
    B: Must be at least 18 years old
    C: Must be at least 21 years old
    D: Must have held a Class C license for 5 years
  answer: C
  explanation: Federal and Pennsylvania regulations require a driver to be at least
    21 years old to operate a commercial vehicle across state lines (interstate commerce).
- id: 24
  category: license_system
  question: 'In Pennsylvania, the parent, guardian, or spouse (18 or older) who signed
    the consent form for a minor''s learner''s permit has the right to:'
  choices:
    A: Withdraw consent at any time until the minor turns 18
    B: Withdraw consent only if the minor gets a ticket
    C: Only withdraw consent within the first 30 days
    D: Cannot withdraw consent once the permit is issued
  answer: A
  explanation: The person who signed the consent form for a minor (under 18) can withdraw
    that consent by filing form DL-180C, which will result in the suspension of the
    minor's driving privilege until they turn 18.
- id: 25
  category: license_system
  question: A Pennsylvania 'Probationary License' (PL) is specifically designed for
    which group of individuals?
  choices:
    A: Drivers under the age of 18
    B: Drivers with a history of DUI only
    C: Drivers with long-term license suspensions who have served a portion of their
      suspension
    D: New residents with out-of-country licenses
  answer: C
  explanation: A Probationary License (PL) is a class C license issued to individuals
    whose driving privilege has been suspended or revoked for 5 years or more, provided
    they meet specific eligibility requirements.
- id: 26
  category: license_system
  question: To be eligible for a Pennsylvania Senior License (Class C) before age
    18, a driver must have held a Junior License for one year and have not been involved
    in an accident where they were partially or fully at fault for how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: The entire time they held the Junior License
  answer: B
  explanation: To graduate to a Senior License before 18, the driver must have no
    accidents (where they were partially or fully at fault) and no convictions of
    any violation of the Vehicle Code for one year.
- id: 27
  category: license_system
  question: 'In Pennsylvania, if a driver is convicted of driving 31 mph or more over
    the posted speed limit, they are required to attend a departmental hearing. Failure
    to attend this hearing results in:'
  choices:
    A: A $1,000 fine
    B: An immediate 60-day license suspension
    C: A permanent mark on the driving record
    D: Vehicle impoundment
  answer: B
  explanation: For extreme speeding (31+ mph over), failure to attend the mandatory
    departmental hearing results in an immediate 60-day license suspension.
- id: 28
  category: license_system
  question: 'When applying for a Pennsylvania learner''s permit, male applicants between
    the ages of 18 and 25 are:'
  choices:
    A: Required to provide proof of employment
    B: Automatically registered for the Selective Service if they give consent
    C: Required to pay a higher application fee
    D: Exempt from the vision test
  answer: B
  explanation: In compliance with state law, PennDOT provides for the automatic registration
    of male applicants aged 18-25 with the Selective Service System when they apply
    for a license or permit.
- id: 29
  category: license_system
  question: If a Pennsylvania driver's license is lost or stolen, the driver must
    apply for a duplicate. Which of the following is true regarding driving while
    waiting for the duplicate?
  choices:
    A: They may drive as long as they have the receipt for the duplicate
    B: They may drive for 48 hours without a license
    C: They are not permitted to drive until the duplicate license is in their possession
    D: They may drive only during daylight hours
  answer: C
  explanation: Pennsylvania law requires drivers to have their valid license in their
    possession while operating a motor vehicle. Driving without the physical license,
    even if one has been ordered, is a violation.
- id: 30
  category: driver_testing
  question: In Pennsylvania, what is the minimum combined horizontal field of vision
    required to pass the vision screening for an unrestricted license?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 140 degrees
  answer: C
  explanation: According to the Pennsylvania Driver's Manual, an applicant must have
    a combined field of vision of at least 120 degrees to pass the vision screening.
- id: 31
  category: driver_testing
  question: When arriving for the Pennsylvania road test, which of the following documents
    must be presented for the vehicle being used?
  choices:
    A: The vehicle's title
    B: A valid registration card and proof of insurance
    C: The vehicle's maintenance log
    D: A bill of sale
  answer: B
  explanation: To take the road test, you must provide the valid registration card
    and proof of insurance for the vehicle you will be driving.
- id: 32
  category: driver_testing
  question: During the Pennsylvania road test, how many attempts are you permitted
    to successfully parallel park the vehicle?
  choices:
    A: One attempt
    B: Two attempts
    C: Three attempts
    D: Four attempts
  answer: C
  explanation: The Pennsylvania Driver's Manual states that applicants are given three
    attempts to successfully park the vehicle during the parallel parking portion
    of the road test.
- id: 33
  category: driver_testing
  question: Under Pennsylvania law, what happens the first time a driver accumulates
    six or more points on their driving record?
  choices:
    A: Their license is automatically suspended for 30 days
    B: They are required to attend a departmental hearing
    C: They must take a special written examination on safe driving practices
    D: They must retake the road test
  answer: C
  explanation: When a driving record reaches six or more points for the first time,
    the driver will receive a notice to take a special written point system examination.
- id: 34
  category: driver_testing
  question: 'In Pennsylvania, if you are convicted of failing to stop for a school
    bus with its red lights flashing and stop arm extended, your license will be suspended
    for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: Conviction of failing to stop for a school bus results in a 60-day
    suspension, a fine, and five points on your driving record.
- id: 35
  category: driver_testing
  question: What is the minimum amount of property damage liability insurance required
    for a registered vehicle in Pennsylvania?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: A
  explanation: Pennsylvania law requires a minimum of $5,000 in property damage liability
    insurance coverage.
- id: 36
  category: driver_testing
  question: 'Under Pennsylvania''s ''Zero Tolerance'' law, a driver under the age
    of 21 is considered to be driving under the influence if their Blood Alcohol Content
    (BAC) is:'
  choices:
    A: 0.01% or higher
    B: 0.02% or higher
    C: 0.05% or higher
    D: 0.08% or higher
  answer: B
  explanation: For drivers under 21, Pennsylvania's Zero Tolerance law sets the legal
    limit at 0.02% BAC.
- id: 37
  category: driver_testing
  question: 'Under Pennsylvania''s Implied Consent law, if you refuse to submit to
    a chemical test (breath, blood, or urine) after being arrested for DUI, your license
    will be suspended for at least:'
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: If you refuse a chemical test in Pennsylvania, your operating privilege
    will be suspended for at least 12 months for a first offense.
- id: 38
  category: driver_testing
  question: Which of the following is an automatic failure during the Pennsylvania
    road test?
  choices:
    A: Adjusting the mirrors before starting
    B: Using the turn signal too early
    C: Violating any traffic law
    D: Stopping completely at a stop sign
  answer: C
  explanation: Violating any traffic law, such as failing to stop for a red light
    or stop sign, results in an automatic failure of the road test.
- id: 39
  category: driver_testing
  question: 'In Pennsylvania, if you are convicted of driving 11 miles per hour or
    more over the speed limit in an active work zone, the penalty includes:'
  choices:
    A: A 15-day license suspension
    B: A 30-day license suspension
    C: A mandatory 24-hour jail stay
    D: Permanent revocation of the license
  answer: A
  explanation: Pennsylvania law mandates a 15-day license suspension if you are convicted
    of speeding 11 mph or more over the limit in an active work zone.
- id: 40
  category: driver_testing
  question: How many points are added to a Pennsylvania driving record for 'Failure
    to stop for a red light'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: According to the Pennsylvania Point System, failure to stop for a red
    light results in 3 points being added to the driver's record.
- id: 41
  category: driver_testing
  question: Before the road test begins, the examiner will check the vehicle for safety.
    Which of the following would cause the test to be postponed?
  choices:
    A: A missing radio
    B: Non-functioning turn signals
    C: A dirty windshield
    D: Low fuel level
  answer: B
  explanation: The vehicle must be in safe operating condition. Non-functioning turn
    signals, brake lights, or a missing rearview mirror are grounds for postponing
    the test.
- id: 42
  category: driver_testing
  question: In Pennsylvania, how many points are assigned for 'Leaving the scene of
    an accident that causes property damage only'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Leaving the scene of an accident involving property damage results
    in 4 points on your Pennsylvania driving record.
- id: 43
  category: driver_testing
  question: If you are under 18 and applying for a Pennsylvania driver's license,
    which form must your parent or guardian sign at the Driver License Center to certify
    you completed your 65 hours of practice?
  choices:
    A: DL-180
    B: DL-180TD
    C: DL-180C
    D: DL-714
  answer: C
  explanation: The Parent or Guardian Certification Form (DL-180C) must be completed
    and signed to verify the 65 hours of behind-the-wheel training.
- id: 44
  category: driver_testing
  question: In addition to visual acuity, Pennsylvania requires what minimum combined
    horizontal peripheral vision to qualify for an unrestricted license?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 140 degrees
  answer: C
  explanation: Pennsylvania requires a combined field of vision of at least 120 degrees
    in the horizontal meridian to pass the vision screening for a standard driver's
    license.
- id: 45
  category: driver_testing
  question: If a Pennsylvania driver fails to maintain financial responsibility (insurance)
    on their vehicle for more than 31 days, their registration will be suspended for
    how long?
  choices:
    A: 30 days
    B: 60 days
    C: 3 months
    D: 6 months
  answer: C
  explanation: If a lapse in insurance coverage lasts longer than 31 days, PennDOT
    will suspend the vehicle registration for three months.
- id: 46
  category: driver_testing
  question: 'According to Pennsylvania''s ''Implied Consent'' law, if you refuse to
    submit to a chemical test of blood, breath, or urine, your driving privilege will
    be automatically suspended for at least:'
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 2 years
  answer: B
  explanation: Under Implied Consent, refusal to take a chemical test results in an
    automatic 12-month license suspension for a first offense, independent of any
    DUI court penalties.
- id: 47
  category: driver_testing
  question: Pennsylvania law requires drivers to turn on their headlights whenever
    they are using their windshield wipers on what setting?
  choices:
    A: Intermittent only
    B: Continuous or intermittent
    C: High speed only
    D: Headlights are not required for wipers
  answer: B
  explanation: Pennsylvania law requires headlights to be on when wipers are in continuous
    or intermittent use due to rain, snow, or sleet.
- id: 48
  category: driver_testing
  question: Under Pennsylvania law, children in which age range must be restrained
    in an appropriate booster seat?
  choices:
    A: Birth to 2 years old
    B: 2 to 4 years old
    C: 4 to 8 years old
    D: 8 to 12 years old
  answer: C
  explanation: Pennsylvania law requires children ages 4 to 8 to be fastened in a
    system that includes a booster seat.
- id: 49
  category: driver_testing
  question: 'Pennsylvania''s ''Move Over'' law requires drivers to move into a lane
    not adjacent to an emergency response area. If they cannot move over, they must:'
  choices:
    A: Stop completely until the emergency ends
    B: Maintain speed but honk the horn
    C: Reduce speed to no more than 20 mph below the posted limit
    D: Pass at a speed that is no more than 10 mph
  answer: C
  explanation: If a driver cannot safely move over, they must reduce their speed to
    a speed that is at least 20 mph less than the posted speed limit.
- id: 50
  category: driver_testing
  question: In Pennsylvania, a driver's license will be suspended for 15 days if they
    are convicted of speeding by how much in an active work zone?
  choices:
    A: 5 mph or more
    B: 11 mph or more
    C: 15 mph or more
    D: 20 mph or more
  answer: B
  explanation: Conviction for speeding 11 mph or more over the limit in an active
    work zone results in a 15-day license suspension in Pennsylvania.
- id: 51
  category: driver_testing
  question: In Pennsylvania, when are you allowed to turn left on a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: Only when turning from a two-way street onto a one-way street
    D: Whenever there is no oncoming traffic
  answer: B
  explanation: In Pennsylvania, you may turn left on red only when turning from a
    one-way street onto another one-way street, after coming to a complete stop and
    yielding to traffic and pedestrians.
- id: 52
  category: driver_testing
  question: According to the Pennsylvania Driver's Manual, you may not park within
    how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: B
  explanation: Pennsylvania law prohibits parking within 15 feet of a fire hydrant.
- id: 53
  category: driver_testing
  question: The Pennsylvania Driver's Manual recommends using which rule to maintain
    a safe following distance behind the vehicle in front of you?
  choices:
    A: The 2-second rule
    B: The 3-second rule
    C: The 4-second rule
    D: The 1-car-length rule
  answer: C
  explanation: While many states use a 2 or 3-second rule, the Pennsylvania Driver's
    Manual specifically recommends a 4-second following distance for safety.
- id: 54
  category: driver_testing
  question: 'In Pennsylvania, an Ignition Interlock device is required for at least
    one year for a first-time DUI offense if the driver''s BAC was at least:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.16%
    D: Any BAC level
  answer: B
  explanation: Pennsylvania requires an Ignition Interlock for first-time offenders
    in the 'High Rate' of alcohol category (0.10% to 0.159%) and 'Highest Rate' category
    (0.16% and up).
- id: 55
  category: driver_responsibility
  question: 'In Pennsylvania, if you are involved in a crash that is not investigated
    by police and results in injury, death, or damage to a vehicle requiring it to
    be towed, you must file a report with PennDOT within:'
  choices:
    A: 24 hours
    B: 48 hours
    C: 5 days
    D: 10 days
  answer: C
  explanation: According to the PA Driver's Manual, if a police officer does not investigate
    a crash involving death, injury, or severe vehicle damage (towing required), you
    must file a Driver's Accident Report (Form AA-600) within 5 days.
- id: 56
  category: driver_responsibility
  question: Pennsylvania law requires all registered motor vehicles to carry liability
    insurance. What is the minimum coverage required for bodily injury to one person
    in any one accident?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $30,000
  answer: C
  explanation: Pennsylvania's financial responsibility law requires a minimum of $15,000
    for bodily injury to one person.
- id: 57
  category: driver_responsibility
  question: What is the minimum amount of coverage Pennsylvania drivers must have
    for property damage in a single accident?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: A
  explanation: The minimum limit for property damage liability in Pennsylvania is
    $5,000.
- id: 58
  category: driver_responsibility
  question: 'If PennDOT determines that you were driving without the required insurance,
    your vehicle registration and driver''s license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 3 months
    D: 6 months
  answer: C
  explanation: If you are caught driving without insurance, Pennsylvania law mandates
    a three-month suspension of both your vehicle registration and your driver's license.
- id: 59
  category: driver_responsibility
  question: In Pennsylvania, most vehicles must undergo a safety inspection how often?
  choices:
    A: Every 6 months
    B: Once a year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: Pennsylvania requires an annual safety inspection for most vehicles
    to ensure they are safe to operate on public roads.
- id: 60
  category: driver_responsibility
  question: For drivers under the age of 21 in Pennsylvania, what is the maximum Blood
    Alcohol Content (BAC) limit before they are considered to be driving under the
    influence?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Pennsylvania has a 'Zero Tolerance' policy for minors; a BAC of 0.02%
    or higher for a driver under 21 is considered a DUI.
- id: 61
  category: driver_responsibility
  question: In Pennsylvania, what is the legal BAC limit for an adult driver operating
    a commercial motor vehicle?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: For commercial drivers in PA, the legal BAC limit is 0.04%, which is
    stricter than the 0.08% limit for non-commercial adult drivers.
- id: 62
  category: driver_responsibility
  question: 'If you are involved in a crash with a parked vehicle and cannot find
    the owner, you must:'
  choices:
    A: Wait at the scene for at least 2 hours
    B: Drive away if there is no visible damage
    C: Leave a note with your contact information and insurance details
    D: Only report it if the damage exceeds $1,000
  answer: C
  explanation: PA law requires you to stop and attempt to locate the owner. If they
    cannot be found, you must leave a written notice with your name, address, and
    insurance information in a conspicuous place on the vehicle.
- id: 63
  category: driver_responsibility
  question: When selling a vehicle in Pennsylvania, what must the seller do with the
    license plate?
  choices:
    A: Leave it on the car for the new owner
    B: Remove it and return it to PennDOT or transfer it to another vehicle
    C: Throw it away in the trash
    D: Give it to the local police department
  answer: B
  explanation: In PA, the license plate belongs to the seller, not the vehicle. It
    must be removed upon sale and either transferred to another vehicle or returned
    to PennDOT.
- id: 64
  category: driver_responsibility
  question: 'A first-time DUI conviction in Pennsylvania for the ''High Rate of Alcohol''
    (BAC 0.10% to 0.159%) results in a mandatory license suspension of:'
  choices:
    A: No suspension
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: For the 'High Rate' tier of DUI in PA, even a first offense carries
    a mandatory 12-month license suspension.
- id: 65
  category: driver_responsibility
  question: 'In Pennsylvania, littering from a vehicle is illegal. A conviction for
    littering can result in a fine of up to:'
  choices:
    A: $50
    B: $100
    C: $300
    D: $1,000
  answer: C
  explanation: Under PA Vehicle Code Section 3709, littering is a summary offense
    punishable by a fine of up to $300.
- id: 66
  category: driver_responsibility
  question: 'If your Pennsylvania driver''s license is suspended, you must pay a ''restoration
    fee'' to PennDOT before your license can be returned. This fee is generally at
    least:'
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: As of current PA regulations, the standard restoration fee for a non-commercial
    driver's license is approximately $100 (subject to change by legislation).
- id: 67
  category: driver_responsibility
  question: In Pennsylvania, what are the minimum liability insurance coverage limits
    required by law?
  choices:
    A: $10,000 for bodily injury / $20,000 per accident / $5,000 for property damage
    B: $15,000 for bodily injury / $30,000 per accident / $5,000 for property damage
    C: $25,000 for bodily injury / $50,000 per accident / $10,000 for property damage
    D: $20,000 for bodily injury / $40,000 per accident / $15,000 for property damage
  answer: B
  explanation: Pennsylvania law requires minimum liability coverage of $15,000 for
    bodily injury to one person, $30,000 for bodily injury to more than one person
    in an accident, and $5,000 for property damage.
- id: 68
  category: driver_responsibility
  question: If PennDOT determines that a driver has operated a vehicle without the
    required financial responsibility (insurance), what is the mandatory suspension
    period for the vehicle registration and the driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 3 months
    D: 6 months
  answer: C
  explanation: Under Section 1786 of the PA Vehicle Code, if a person fails to maintain
    financial responsibility, PennDOT shall suspend the registration of the vehicle
    and the person's operating privilege for three months.
- id: 69
  category: driver_responsibility
  question: If you are involved in an accident that requires a report to be filed
    with PennDOT, how many days do you have to submit the written report?
  choices:
    A: 2 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: According to the Pennsylvania Driver's Manual, if the police do not
    investigate an accident involving injury or severe vehicle damage, you must send
    a written report to PennDOT within 5 days.
- id: 70
  category: driver_responsibility
  question: Under Pennsylvania's 'Zero Tolerance' law, what is the Blood Alcohol Content
    (BAC) limit for drivers under the age of 21?
  choices:
    A: 0.00%
    B: 0.01%
    C: 0.02%
    D: 0.08%
  answer: C
  explanation: Pennsylvania's Zero Tolerance law sets the BAC limit for minors (under
    21) at 0.02%. This is a very low threshold meant to account for incidental alcohol
    consumption while strictly prohibiting drinking and driving.
- id: 71
  category: driver_responsibility
  question: In Pennsylvania, a driver is considered legally intoxicated if their Blood
    Alcohol Content (BAC) is at or above what level?
  choices:
    A: 0.05%
    B: 0.07%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: For drivers 21 and older in Pennsylvania, the legal limit for BAC is
    0.08%.
- id: 72
  category: driver_responsibility
  question: Under Pennsylvania law, if you are convicted of fleeing or attempting
    to elude a police officer, what is the penalty regarding your driving privilege?
  choices:
    A: 3 points on your record
    B: A 6-month suspension
    C: A 1-year suspension
    D: A mandatory 5-year revocation
  answer: C
  explanation: Fleeing or attempting to elude a police officer is a serious offense
    in PA and carries a mandatory 1-year suspension of your driving privilege.
- id: 73
  category: driver_responsibility
  question: Which of the following is NOT an acceptable form of proof of financial
    responsibility (insurance) in Pennsylvania?
  choices:
    A: A valid insurance identification card issued by an insurance company
    B: A copy of the declaration page of an insurance policy
    C: A handwritten note from an insurance agent
    D: A copy of a valid binder of insurance
  answer: C
  explanation: Acceptable proof includes the official ID card, the declaration page,
    a valid binder, or an application for the PA Assigned Risk Plan. A handwritten
    note is not a legal form of proof.
- id: 74
  category: driver_responsibility
  question: If a Pennsylvania driver is convicted of a DUI for the first time, they
    may be required to use an Ignition Interlock Device (IID) for what period of time?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: Permanently
  answer: C
  explanation: For many DUI offenses in Pennsylvania, including first-time high-rate
    offenses or subsequent offenses, an Ignition Interlock Device is required for
    a period of 12 months before full driving privileges are restored.
- id: 75
  category: driver_responsibility
  question: What is the penalty for a Pennsylvania driver who is convicted of driving
    while their license is suspended due to a DUI-related offense?
  choices:
    A: A $100 fine only
    B: A $500 fine and 60 to 90 days in jail
    C: A warning and 2 points
    D: No additional penalty if it is the first time
  answer: B
  explanation: Driving while suspended for a DUI-related offense carries a mandatory
    fine of $500 and a mandatory term of imprisonment of 60 to 90 days.
- id: 76
  category: safe_driving_rules
  question: In Pennsylvania, what is the speed limit in a school zone during restricted
    hours when the lights are flashing?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: According to the Pennsylvania Driver's Manual, the speed limit in a
    school zone is 15 mph when the lights are flashing or during the time periods
    indicated on the sign.
- id: 77
  category: safe_driving_rules
  question: Under Pennsylvania law, you must use your turn signals at least how many
    feet before turning if you are traveling less than 35 mph?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Pennsylvania law requires drivers to signal at least 100 feet before
    a turn when traveling less than 35 mph. If traveling 35 mph or more, you must
    signal at least 300 feet in advance.
- id: 78
  category: safe_driving_rules
  question: In Pennsylvania, it is illegal to park your vehicle within how many feet
    of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Pennsylvania law prohibits parking within 15 feet of a fire hydrant.
- id: 79
  category: safe_driving_rules
  question: When parking near an intersection in Pennsylvania, you must be at least
    how many feet away from a stop sign, flashing beacon, or yield sign?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Drivers in Pennsylvania are prohibited from parking within 30 feet
    of any flashing beacon, stop sign, yield sign, or traffic control signal located
    at the side of a roadway.
- id: 80
  category: safe_driving_rules
  question: According to Pennsylvania's 'Wiper-on, Headlight-on' law, when must your
    headlights be turned on?
  choices:
    A: Only during heavy downpours
    B: Only between sunset and sunrise
    C: Whenever your windshield wipers are in continuous or intermittent use due to
      precipitation
    D: Only when visibility is less than 1,000 feet
  answer: C
  explanation: Pennsylvania law requires motorists to turn on their headlights anytime
    the vehicle's wipers are in continuous or intermittent use due to rain, snow,
    sleet, or mist.
- id: 81
  category: safe_driving_rules
  question: When approaching a school bus with its red lights flashing and stop arm
    extended on a roadway that is NOT separated by a physical barrier, you must stop
    at least how many feet away?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: In Pennsylvania, you must stop at least 10 feet away from a school
    bus when its red lights are flashing and the stop arm is extended, regardless
    of which direction you are traveling, unless on a divided highway.
- id: 82
  category: safe_driving_rules
  question: What is the penalty for a first-time conviction of violating Pennsylvania's
    school bus stopping law?
  choices:
    A: A $100 fine and 2 points
    B: A $250 fine, 5 points, and a 60-day license suspension
    C: A $500 fine and 3 points
    D: A $1,000 fine and a 1-year license suspension
  answer: B
  explanation: Violating Pennsylvania's school bus stopping law results in a $250
    fine, five points on your driving record, and a mandatory 60-day suspension of
    your operating privilege.
- id: 83
  category: safe_driving_rules
  question: Under Pennsylvania's 'Steer Clear' law, what must you do when approaching
    an emergency scene or a stationary response vehicle with lights flashing?
  choices:
    A: Maintain speed but move to the left lane
    B: Stop immediately
    C: Move to a lane not adjacent to the scene or slow down to a speed that is reasonable
      and prudent
    D: Honk your horn to alert workers
  answer: C
  explanation: The 'Steer Clear' law (Move Over Law) requires drivers to move into
    a lane that is not adjacent to the emergency response area. if they cannot move
    over, they must slow down to a speed that is safe for the conditions.
- id: 84
  category: safe_driving_rules
  question: In Pennsylvania, you must dim your high beams to low beams when you are
    within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Pennsylvania law requires drivers to switch to low beams when an oncoming
    vehicle is within 500 feet.
- id: 85
  category: safe_driving_rules
  question: What is the maximum speed limit on Pennsylvania interstate highways, where
    posted?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: The maximum speed limit on certain sections of Pennsylvania interstate
    highways is 70 mph, as indicated by posted signs.
- id: 86
  category: safe_driving_rules
  question: In Pennsylvania, if you are involved in a crash that requires a police
    report, you must file a 'Driver's Accident Report' (Form AA-600) within how many
    days if the police do not investigate the crash?
  choices:
    A: 2 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: If the police do not investigate a crash that involves death, injury,
    or severe damage to any vehicle, you must file a report with PennDOT within 5
    days.
- id: 87
  category: safe_driving_rules
  question: If you are driving in an active work zone in Pennsylvania and fail to
    turn on your headlights, what is the penalty?
  choices:
    A: A $25 fine
    B: A $100 fine
    C: 2 points on your license
    D: A 15-day license suspension
  answer: A
  explanation: In Pennsylvania, it is mandatory to turn on your headlights in active
    work zones. Failure to do so results in a $25 fine.
- id: 88
  category: safe_driving_rules
  question: If you are convicted of violating Pennsylvania's school bus stopping law,
    what are the penalties for a first offense?
  choices:
    A: 3 points and a $100 fine
    B: 2 points and a 30-day suspension
    C: 5 points, a $250 fine, and a 60-day license suspension
    D: 6 points and a 90-day license suspension
  answer: C
  explanation: In Pennsylvania, the penalty for failing to stop for a school bus includes
    a 60-day suspension of your operating privilege, five points on your driving record,
    and a $250 fine.
- id: 89
  category: safe_driving_rules
  question: In Pennsylvania, if you are driving at a speed of 35 mph or more, you
    must signal your intention to turn at least how many feet before the turn?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Pennsylvania law requires drivers to signal at least 100 feet before
    turning if traveling less than 35 mph, and at least 300 feet before turning if
    traveling 35 mph or faster.
- id: 90
  category: safe_driving_rules
  question: In Pennsylvania, you may not park your vehicle within how many feet of
    a stop sign, flashing beacon, or yield sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Pennsylvania law states that you cannot park within 30 feet of any
    flashing signal, stop sign, yield sign, or traffic-control signal located at the
    side of a roadway.
- id: 91
  category: safe_driving_rules
  question: In Pennsylvania, if you are caught speeding by 11 mph or more in an active
    work zone, what is the mandatory penalty?
  choices:
    A: A $500 fine
    B: A 15-day license suspension
    C: A 30-day license suspension
    D: Double the points on your record
  answer: B
  explanation: Pennsylvania law mandates a 15-day license suspension if you are convicted
    of driving 11 mph or more over the posted speed limit in an active work zone.
- id: 92
  category: safe_driving_rules
  question: According to Pennsylvania law, when must you turn on your headlights?
  choices:
    A: Only between sunset and sunrise
    B: Whenever you cannot see clearly for 500 feet
    C: Whenever your windshield wipers are in continuous or intermittent use due to
      weather
    D: Both B and C
  answer: D
  explanation: In Pennsylvania, headlights must be on between sunset and sunrise,
    in any area where you cannot see 1,000 feet ahead, and whenever your wipers are
    in use due to rain, snow, or sleet.
- id: 93
  category: safe_driving_rules
  question: In Pennsylvania, you are permitted to pass a vehicle on the right only
    under which of the following conditions?
  choices:
    A: When the vehicle ahead is making or about to make a left turn
    B: When you are on a highway with two or more lanes of traffic moving in the same
      direction
    C: When you are in a hurry and the left lane is blocked
    D: Both A and B
  answer: D
  explanation: Pennsylvania law allows passing on the right when the vehicle being
    overtaken is making a left turn, or upon a roadway with unobstructed pavement
    of sufficient width for two or more lines of vehicles moving in the same direction.
- id: 94
  category: safe_driving_rules
  question: When parking a vehicle on a hill in Pennsylvania, which way should you
    turn your front wheels if you are parked facing uphill with a curb?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    so that if the vehicle rolls, the back of the front tire will hit the curb and
    stop the car.
- id: 95
  category: safe_driving_rules
  question: In Pennsylvania, what happens when a driver's record reaches 6 or more
    points for the first time?
  choices:
    A: Automatic 30-day suspension
    B: The driver must attend a departmental hearing
    C: The driver is required to take a special written point system examination
    D: The driver must retake the road test
  answer: C
  explanation: When any person's driving record reaches 6 or more points for the first
    time, they will receive a notice to take a special written examination. They have
    30 days to pass it or their license will be suspended.
- id: 96
  category: defensive_driving
  question: According to the Pennsylvania Driver's Manual, what is the recommended
    following distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: C
  explanation: Pennsylvania's official manual recommends a four-second following distance
    to allow enough time to react to hazards or sudden stops.
- id: 97
  category: defensive_driving
  question: 'In Pennsylvania, you are required by law to turn on your headlights whenever
    you are using your windshield wipers due to rain, snow, or sleet. This is known
    as:'
  choices:
    A: The Visibility Act
    B: The Wipers-On, Lights-On Law
    C: The All-Weather Safety Law
    D: The Clear View Mandate
  answer: B
  explanation: Pennsylvania law (Act 159) requires motorists to turn on their headlights
    anytime their vehicle’s wipers are in continuous or intermittent use due to weather
    conditions.
- id: 98
  category: defensive_driving
  question: Under Pennsylvania's 'Move Over' law, what must you do when approaching
    an emergency response area on a multi-lane highway?
  choices:
    A: Stop completely until signaled to pass
    B: Move into a lane that is not adjacent to the emergency response area
    C: Maintain speed but honk to alert emergency workers
    D: Speed up to clear the area as quickly as possible
  answer: B
  explanation: Pennsylvania law requires drivers to move into a lane not adjacent
    to an emergency response area. If they cannot move over safely, they must slow
    down to a speed of no more than 20 mph less than the posted speed limit.
- id: 99
  category: defensive_driving
  question: In Pennsylvania, how many points are added to your driving record for
    'Following too closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Under the Pennsylvania Department of Transportation (PennDOT) point
    system, following too closely is a 3-point violation.
- id: 100
  category: defensive_driving
  question: According to the PA Driver's Manual, at what speed can hydroplaning begin
    as water builds up between the tires and the road surface?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph, and tires may lose
    all contact with the road at 50 mph during heavy rain.
- id: 101
  category: defensive_driving
  question: 'In Pennsylvania, if you are driving through an active work zone, you
    are required by law to:'
  choices:
    A: Turn on your hazard lights
    B: Turn on your headlights
    C: Honk your horn every 100 feet
    D: Drive at exactly 15 mph regardless of the posted limit
  answer: B
  explanation: Pennsylvania law requires motorists to turn on their headlights in
    all active work zones to increase visibility.
- id: 102
  category: defensive_driving
  question: When scanning the road ahead to avoid hazards, the Pennsylvania Driver's
    Manual recommends looking how far ahead?
  choices:
    A: 5 to 8 seconds
    B: 12 to 15 seconds
    C: 20 to 30 seconds
    D: Only at the vehicle directly in front of you
  answer: B
  explanation: Drivers should scan the road 12 to 15 seconds ahead to anticipate potential
    problems and have enough time to react.
- id: 103
  category: defensive_driving
  question: Under Pennsylvania's 'Christine's Law,' drivers can be fined if they fail
    to remove what from their vehicle within 24 hours of a storm?
  choices:
    A: Mud and dirt
    B: Fallen leaves
    C: Ice and snow
    D: Fog from the windows
  answer: C
  explanation: Act 90 (Christine's Law) requires drivers to remove accumulated ice
    or snow from their vehicle within 24 hours of a storm to prevent it from flying
    off and causing injury or property damage.
- id: 104
  category: defensive_driving
  question: When driving in heavy fog in Pennsylvania, which lights should you use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Low beams should be used in fog because the light from high beams reflects
    off the fog and back into the driver's eyes, reducing visibility.
- id: 105
  category: defensive_driving
  question: If you are driving on a road with a school bus that has its red lights
    flashing and stop arm extended, Pennsylvania law requires you to stop at least
    how many feet away?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Pennsylvania law requires motorists to stop at least 10 feet away from
    a school bus when its red lights are flashing and the stop arm is extended.
- id: 106
  category: defensive_driving
  question: 'If your vehicle is equipped with an Anti-lock Braking System (ABS) and
    you need to stop quickly in an emergency, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Lightly tap the brakes to avoid locking
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. Pumping the brakes
    is for older vehicles without ABS and will actually deactivate the ABS system's
    benefits.
- id: 107
  category: defensive_driving
  question: 'When approaching a curve, the safest defensive driving practice is to:'
  choices:
    A: Brake hard while in the middle of the curve
    B: Speed up to maintain traction
    C: Slow down before you enter the curve
    D: Shift into neutral
  answer: C
  explanation: The PA Driver's Manual states you should slow down before entering
    a curve so you can accelerate slightly as you exit, which helps maintain vehicle
    stability.
- id: 108
  category: defensive_driving
  question: When entering an intersection, the Pennsylvania Driver's Manual recommends
    looking in which order?
  choices:
    A: Right, Left, Right
    B: Left, Right, Left
    C: Straight, Left, Right
    D: Only in the direction you are turning
  answer: B
  explanation: Drivers should look left, then right, then left again before entering
    an intersection, as traffic from the left is closer to you.
- id: 109
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, the Pennsylvania
    Driver's Manual suggests scanning the road ahead at least how many seconds?
  choices:
    A: 5 to 8 seconds
    B: 10 to 12 seconds
    C: 12 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Scanning 12 to 15 seconds ahead allows you to see hazards early and
    plan your path safely.
- id: 110
  category: defensive_driving
  question: When following another vehicle at night in Pennsylvania, you must switch
    to low beams when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: Pennsylvania law requires drivers to switch to low beams when following
    another vehicle within 300 feet.
- id: 111
  category: defensive_driving
  question: 'Under Pennsylvania law, if snow or ice falls from your moving vehicle
    and causes death or serious bodily injury to another person, you may face a fine
    of up to:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $5,000
  answer: C
  explanation: Pennsylvania law (Act 89) allows police to cite drivers if snow or
    ice falls from a vehicle and causes injury or death, with fines ranging from $200
    to $1,500.
- id: 112
  category: defensive_driving
  question: Hydroplaning can occur at speeds as low as ____ mph when there is heavy
    rain or standing water on a Pennsylvania roadway.
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: In heavy rain, your tires can lose all contact with the road (hydroplaning)
    at speeds as low as 35 mph.
- id: 113
  category: defensive_driving
  question: When driving through heavy fog in Pennsylvania, which lighting should
    you use to ensure the best visibility?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Low beams should be used in fog because the light from high beams reflects
    off the moisture in the air, making it harder to see.
- id: 114
  category: defensive_driving
  question: 'In Pennsylvania, you are required to turn on your headlights when driving
    through:'
  choices:
    A: Any residential street
    B: Active work zones
    C: School zones during arrival hours
    D: Parking garages
  answer: B
  explanation: Pennsylvania law requires headlights to be on in all active work zones,
    regardless of the time of day.
- id: 115
  category: defensive_driving
  question: 'If your rear wheels begin to skid on an icy Pennsylvania road, you should:'
  choices:
    A: Steer in the opposite direction of the skid
    B: Steer in the direction the rear of the vehicle is skidding
    C: Brake hard immediately
    D: Accelerate to regain traction
  answer: B
  explanation: To recover from a skid, take your foot off the gas and steer in the
    direction the rear of the car is sliding.
- id: 116
  category: defensive_driving
  question: 'When sharing the road with large trucks, ''The No-Zone'' refers to:'
  choices:
    A: The truck's cargo area
    B: The speed-limited lanes on the PA Turnpike
    C: The blind spots around the truck where your car cannot be seen
    D: The area where trucks are prohibited from driving
  answer: C
  explanation: The 'No-Zone' represents the large blind spots around a truck (front,
    back, and sides) where the truck driver cannot see your vehicle.
- id: 117
  category: defensive_driving
  question: Pennsylvania is a high-risk state for deer-vehicle collisions. According
    to the manual, when are deer most active?
  choices:
    A: Mid-day (12 PM - 2 PM)
    B: Late morning (9 AM - 11 AM)
    C: Dusk and Dawn
    D: Late night (2 AM - 4 AM)
  answer: C
  explanation: Deer are most active during dusk and dawn, which are also times when
    visibility is reduced for drivers.
- id: 118
  category: defensive_driving
  question: In Pennsylvania, you must stop at least how many feet away from a school
    bus that has its red lights flashing and stop arm extended?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Pennsylvania law requires motorists to stop at least 10 feet away from
    a school bus with its red lights flashing and stop arm extended.
- id: 119
  category: alcohol_drugs_health
  question: Under Pennsylvania's Implied Consent law, what is the penalty for a first-time
    refusal to submit to a chemical test (blood, breath, or urine)?
  choices:
    A: A 6-month license suspension
    B: A 12-month license suspension
    C: A $100 fine only
    D: No penalty if you are found not guilty of DUI
  answer: B
  explanation: If you refuse to take a chemical test in PA, your driving privilege
    will be automatically suspended for 12 months for a first offense, regardless
    of whether you are convicted of DUI.
- id: 120
  category: alcohol_drugs_health
  question: Pennsylvania's DUI laws are categorized into three levels based on BAC.
    Which range defines the 'High Rate of Alcohol' tier?
  choices:
    A: 0.05% to 0.079%
    B: 0.08% to 0.099%
    C: 0.10% to 0.159%
    D: 0.16% and higher
  answer: C
  explanation: In PA, the 'High Rate' tier applies to drivers with a BAC of 0.10%
    to 0.159%. The 'General Impairment' tier is 0.08% to 0.099%, and 'Highest Rate'
    is 0.16% or higher.
- id: 121
  category: alcohol_drugs_health
  question: If a driver is convicted of a DUI involving a controlled substance (drugs)
    in Pennsylvania, they are subject to penalties at which tier?
  choices:
    A: General Impairment (Lowest Tier)
    B: High Rate (Middle Tier)
    C: Highest Rate (Top Tier)
    D: A separate drug-only tier with no license suspension
  answer: C
  explanation: In Pennsylvania, driving under the influence of a controlled substance
    (illegal drugs or prescription drugs without a prescription) carries the same
    penalties as the 'Highest Rate' BAC tier (0.16% or higher).
- id: 122
  category: alcohol_drugs_health
  question: What is the maximum BAC limit for a Commercial Driver's License (CDL)
    holder operating a commercial vehicle in Pennsylvania?
  choices:
    A: 0.08%
    B: 0.04%
    C: 0.02%
    D: 0.01%
  answer: B
  explanation: For commercial drivers in Pennsylvania, the legal BAC limit is 0.04%.
    If a CDL holder's BAC is 0.04% or higher while driving a commercial vehicle, they
    are subject to DUI penalties.
- id: 123
  category: alcohol_drugs_health
  question: 'In Pennsylvania, a first-offense DUI conviction at the ''Highest Rate''
    (BAC 0.16%+) carries a mandatory minimum jail sentence of:'
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 10 days
  answer: C
  explanation: A first-time DUI conviction in the Highest Rate tier (0.16% or higher)
    in PA requires a mandatory minimum of 72 hours in jail, along with a 12-month
    license suspension and a fine of $1,000 to $5,000.
- id: 124
  category: alcohol_drugs_health
  question: Which of the following is true regarding Pennsylvania's Open Container
    Law?
  choices:
    A: Passengers may drink alcohol as long as the driver is sober.
    B: It is illegal to have an open alcoholic beverage container in the passenger
      area of a vehicle on a highway.
    C: Open containers are allowed if they are placed in the glove compartment.
    D: The law only applies to the driver, not the passengers.
  answer: B
  explanation: Pennsylvania law prohibits the possession of an open alcoholic beverage
    container in the passenger area of a motor vehicle while it is on a highway. This
    applies to both drivers and passengers.
- id: 125
  category: alcohol_drugs_health
  question: If you are convicted of a second DUI offense in Pennsylvania, you will
    be required to have an Ignition Interlock system installed in your vehicle for
    how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Permanently
  answer: B
  explanation: In Pennsylvania, repeat DUI offenders (and certain first-time offenders
    in high tiers) are required to install an Ignition Interlock system for a period
    of one year before they can regain full driving privileges.
- id: 126
  category: alcohol_drugs_health
  question: According to Pennsylvania law, if you have a medical condition like epilepsy,
    how long must you be seizure-free before you can legally drive?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Pennsylvania requires individuals with a seizure disorder to be seizure-free
    for at least six months, with or without medication, before they are permitted
    to drive.
- id: 127
  category: alcohol_drugs_health
  question: What effect does combining alcohol with another drug (like a cold medicine
    or prescription) have on your driving ability?
  choices:
    A: The effects of the drug and alcohol cancel each other out.
    B: The alcohol prevents the drug from working.
    C: The combination increases the effects of both, often drastically impairing
      the driver.
    D: There is no combined effect unless the drug is illegal.
  answer: C
  explanation: Combining alcohol with other drugs (synergistic effect) can multiply
    the impairment, making it much more dangerous than using either substance alone.
- id: 128
  category: alcohol_drugs_health
  question: In Pennsylvania, what is the 'Accelerated Rehabilitative Disposition'
    (ARD) program?
  choices:
    A: A program for repeat DUI offenders to avoid jail.
    B: A program for first-time DUI offenders that can lead to the charges being dismissed
      and the record expunged.
    C: A mandatory driving school for people with too many points.
    D: A medical evaluation for elderly drivers.
  answer: B
  explanation: ARD is a program often offered to first-time DUI offenders in PA. Successful
    completion of the program's requirements (probation, community service, etc.)
    allows the offender to have their charges dismissed and their record expunged.
- id: 129
  category: alcohol_drugs_health
  question: 'If you are under 21 and are convicted of purchasing, consuming, or possessing
    alcohol (even if not driving), Pennsylvania law mandates:'
  choices:
    A: Only a $50 fine.
    B: A mandatory 90-day suspension of your driving privilege for a first offense.
    C: No license suspension unless you were in a car.
    D: Mandatory enrollment in the military.
  answer: B
  explanation: Pennsylvania enforces a suspension of driving privileges for minors
    convicted of alcohol-related offenses (underage drinking), even if a vehicle was
    not involved. A first offense results in a 90-day suspension.
- id: 130
  category: alcohol_drugs_health
  question: Which of the following is a symptom of 'Highway Hypnosis'?
  choices:
    A: Increased alertness and focus.
    B: A trance-like state caused by staring at the road for long periods.
    C: Extreme physical pain in the legs.
    D: Sudden urges to speed.
  answer: B
  explanation: Highway hypnosis is a state of unawareness or a trance-like condition
    caused by long periods of monotonous driving, which can be just as dangerous as
    driving while tired or impaired.
- id: 131
  category: alcohol_drugs_health
  question: How does alcohol first affect a driver's ability?
  choices:
    A: It improves reaction time.
    B: It impairs judgment and self-control.
    C: It sharpens peripheral vision.
    D: It has no effect until the BAC reaches 0.08%.
  answer: B
  explanation: Alcohol affects judgment and self-control long before it affects physical
    coordination or reaction time. This is why drivers often feel they are capable
    of driving when they are actually impaired.
- id: 132
  category: alcohol_drugs_health
  question: 'In Pennsylvania, if you are involved in a crash while your BAC is over
    the legal limit, you may be required to:'
  choices:
    A: Pay for all damages out of pocket regardless of insurance.
    B: Undergo a full clinical evaluation for alcohol or drug addiction.
    C: Forfeit your vehicle to the state immediately.
    D: Only pay a small surcharge on your registration.
  answer: B
  explanation: Pennsylvania law requires DUI offenders to undergo a CRN (Court Reporting
    Network) evaluation, and depending on the results and the tier of the offense,
    a full drug and alcohol clinical evaluation may be required.
- id: 133
  category: alcohol_drugs_health
  question: According to Pennsylvania's 'Implied Consent' law, what happens if you
    refuse to take a chemical test (blood, breath, or urine) when requested by an
    officer?
  choices:
    A: Your license will be suspended for at least 12 months.
    B: You will be fined $50 and allowed to drive home.
    C: Your license will be suspended for 30 days.
    D: Nothing, as long as it is your first offense.
  answer: A
  explanation: By driving in PA, you imply consent to chemical testing. Refusal results
    in an automatic 12-month license suspension for a first offense, regardless of
    whether you are later convicted of DUI.
- id: 134
  category: alcohol_drugs_health
  question: Pennsylvania uses a three-tier DUI penalty system. Which BAC range is
    classified as the 'Highest Rate of Alcohol' tier?
  choices:
    A: 0.08% to 0.099%
    B: 0.10% to 0.159%
    C: 0.16% or higher
    D: 0.02% to 0.079%
  answer: C
  explanation: Pennsylvania classifies a BAC of 0.16% or higher as the 'Highest Rate
    of Alcohol,' which carries the most severe penalties.
- id: 135
  category: alcohol_drugs_health
  question: 'In Pennsylvania, a commercial driver (CDL holder) is considered DUI if
    their BAC is at or above:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: Commercial drivers in Pennsylvania are held to a stricter standard
    and are considered DUI with a BAC of 0.04% or higher while operating a commercial
    vehicle.
- id: 136
  category: alcohol_drugs_health
  question: Pennsylvania law requires physicians to report to PennDOT any patient
    aged 15 or older who has been diagnosed with a condition that could impair their
    ability to drive within how many days?
  choices:
    A: 5 days
    B: 10 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: Physicians must report patients with potentially impairing conditions
    (like epilepsy or unstable diabetes) to PennDOT within 10 days of the diagnosis.
- id: 137
  category: alcohol_drugs_health
  question: If you are convicted of a first-offense DUI in the 'High Rate' tier (0.10%
    to 0.159% BAC), how long will your Pennsylvania driver's license be suspended?
  choices:
    A: No suspension, only a fine
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: A first-offense DUI at the 'High Rate' (0.10% - 0.159%) results in
    a mandatory 12-month license suspension.
- id: 138
  category: alcohol_drugs_health
  question: Pennsylvania's 'Open Container Law' prohibits which of the following?
  choices:
    A: Only the driver from drinking alcohol while driving.
    B: Only the driver from having an open alcoholic beverage in the passenger area.
    C: Both the driver and passengers from having an open alcoholic beverage in the
      passenger area.
    D: Possessing any alcohol in the car, even if sealed.
  answer: C
  explanation: Pennsylvania law prohibits both the driver and all passengers from
    possessing an open alcoholic beverage container in the passenger area of a vehicle
    on a public highway.
- id: 139
  category: alcohol_drugs_health
  question: What is the minimum jail time for a first-offense DUI conviction in the
    'Highest Rate' tier (0.16% BAC or higher) in Pennsylvania?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 10 days
  answer: C
  explanation: A first-offense DUI at the 'Highest Rate' tier carries a mandatory
    minimum of 72 consecutive hours in jail.
- id: 140
  category: alcohol_drugs_health
  question: If a Pennsylvania driver has a medical condition that causes a lapse of
    consciousness (such as a seizure), they must typically be seizure-free for how
    long before they can resume driving?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: PennDOT regulations generally require a person with a condition causing
    lapses of consciousness to be seizure-free for at least 6 months before driving
    privileges are restored.
- id: 141
  category: alcohol_drugs_health
  question: In Pennsylvania, the 'ARD' program is often available for first-time DUI
    offenders. What does ARD stand for?
  choices:
    A: Alcohol Rehabilitation Department
    B: Automated Roadway Detection
    C: Accelerated Rehabilitative Disposition
    D: Advanced Roadside Discipline
  answer: C
  explanation: ARD stands for Accelerated Rehabilitative Disposition. It is a program
    for first-time, non-violent offenders that can lead to the dismissal of charges
    upon successful completion.
- id: 142
  category: alcohol_drugs_health
  question: Which of the following is true regarding prescription or over-the-counter
    drugs and driving in Pennsylvania?
  choices:
    A: They are always legal to use while driving because they are not 'street drugs'.
    B: You can only be charged with DUI if you take more than the recommended dose.
    C: If a drug impairs your ability to drive safely, you can be charged with DUI.
    D: Only drugs with a 'warning' label can lead to a DUI.
  answer: C
  explanation: In Pennsylvania, you can be convicted of DUI if any drug (legal or
    illegal) impairs your ability to safely operate a motor vehicle.
- id: 143
  category: alcohol_drugs_health
  question: If a driver under 21 is convicted of DUI for the first time in Pennsylvania,
    what is the mandatory license suspension period?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 18 months
  answer: C
  explanation: A first-time DUI conviction for a minor (under 21) in Pennsylvania
    results in a mandatory 12-month license suspension.
- id: 144
  category: penalties_and_points
  question: Under Pennsylvania law, what is the mandatory license suspension period
    for a first-time refusal to submit to a chemical test (breath, blood, or urine)
    for DUI?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: Under Pennsylvania's Implied Consent law, if you refuse to take a chemical
    test, your operating privilege will be suspended for at least 12 months.
- id: 145
  category: penalties_and_points
  question: When a Pennsylvania driver's record reaches 6 points for the first time,
    what action is required by PennDOT?
  choices:
    A: An automatic 15-day license suspension
    B: A mandatory departmental hearing
    C: The driver must take a special written point examination
    D: The driver must complete a 4-hour safe driving course
  answer: C
  explanation: When any person's record for the first time shows as many as 6 points,
    they will receive a notice to take a special written point examination. They have
    30 days to pass it or the license is suspended.
- id: 146
  category: penalties_and_points
  question: In Pennsylvania, if you are convicted of speeding 11 to 15 miles per hour
    over the posted speed limit, how many points will be added to your record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Speeding 11 to 15 mph over the limit results in 3 points. Speeding
    6-10 mph results in 2 points, and 16-25 mph results in 4 points.
- id: 147
  category: penalties_and_points
  question: What is the penalty for a Pennsylvania driver who is convicted of speeding
    11 mph or more over the limit in an active work zone?
  choices:
    A: A $500 fine only
    B: A 15-day license suspension
    C: A 30-day license suspension
    D: The vehicle is impounded for 48 hours
  answer: B
  explanation: In Pennsylvania, if you are convicted of speeding 11 mph or more over
    the limit in an active work zone, your driving privilege will be suspended for
    15 days.
- id: 148
  category: penalties_and_points
  question: If a Pennsylvania driver's record reaches 11 points or more, what is the
    consequence?
  choices:
    A: A mandatory departmental hearing
    B: A $1,000 fine
    C: Automatic license suspension
    D: The driver must retake the road test
  answer: C
  explanation: When any driving record reaches 11 points or more, the driver's license
    will be automatically suspended. The length of suspension depends on how many
    times it has been suspended before.
- id: 149
  category: penalties_and_points
  question: How many points are assigned to a Pennsylvania driver convicted of 'Following
    too closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: A conviction for 'Following too closely' results in 3 points being
    added to the Pennsylvania driving record.
- id: 150
  category: penalties_and_points
  question: In Pennsylvania, if you fail to maintain financial responsibility (insurance)
    on your vehicle for more than 31 days, what is the penalty?
  choices:
    A: A $100 fine only
    B: A 3-month suspension of your vehicle registration and driver's license
    C: A 6-month suspension of your driver's license only
    D: Permanent revocation of your license
  answer: B
  explanation: If PennDOT determines you have operated your vehicle without insurance
    for more than 31 days, your vehicle registration and driver's license will be
    suspended for 3 months.
- id: 151
  category: penalties_and_points
  question: If a Pennsylvania driver is convicted of 'Improper passing on a hill',
    how many points are added to their record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Improper passing on a hill is considered a serious safety violation
    and results in 4 points on the driving record.
- id: 152
  category: penalties_and_points
  question: Besides points and suspension, what is the mandatory fine for failing
    to stop for a school bus with red lights flashing in Pennsylvania?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: The law requires a mandatory $250 fine for failing to stop for a school
    bus with its red lights flashing and stop arm extended.
- id: 153
  category: penalties_and_points
  question: A Pennsylvania driver convicted of 'Fleeing or attempting to elude a police
    officer' faces which of the following license penalties?
  choices:
    A: 6-month suspension
    B: 1-year suspension
    C: 2-year suspension
    D: 5 points and no suspension
  answer: B
  explanation: Fleeing or attempting to elude a police officer is a serious offense
    that results in a 1-year suspension of driving privileges.
- id: 154
  category: penalties_and_points
  question: In Pennsylvania, how many points are assessed for 'Failure to yield to
    an emergency vehicle'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failure to yield to an emergency vehicle (like an ambulance or fire
    truck) results in 3 points on your Pennsylvania driving record.
- id: 155
  category: penalties_and_points
  question: If a Pennsylvania driver's record reaches 6 points for a second time,
    they will be required to attend a departmental hearing. What may happen if they
    fail to attend this hearing?
  choices:
    A: Their license will be suspended for 60 days
    B: Their license will be suspended until they attend the hearing
    C: They will be fined $1,000
    D: Their points will double automatically
  answer: B
  explanation: If a driver fails to attend a required departmental hearing for point
    accumulation, their driving privilege will be suspended until they attend the
    hearing.
- id: 156
  category: penalties_and_points
  question: Under Pennsylvania law, what is the Blood Alcohol Content (BAC) limit
    for a person under the age of 21 to be charged with DUI?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Pennsylvania has a 'Zero Tolerance' policy for minors. A driver under
    21 is considered DUI if their BAC is 0.02% or higher.
- id: 157
  category: penalties_and_points
  question: How many points are assigned for 'Improper passing' on a Pennsylvania
    driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Improper passing is a 3-point violation in the Pennsylvania point system.
- id: 158
  category: penalties_and_points
  question: A Pennsylvania driver's license is automatically suspended if the driver
    accumulates a total of how many points?
  choices:
    A: 6 points
    B: 8 points
    C: 11 points
    D: 15 points
  answer: C
  explanation: When any person's driving record reaches 11 points or more, their license
    will be automatically suspended.
- id: 159
  category: sharing_the_road
  question: Pennsylvania's 'Move Over' Law (Steer Clear Law) requires drivers to do
    what when approaching an emergency response area?
  choices:
    A: Stop immediately in the lane of travel
    B: Speed up to pass the area quickly
    C: Move into a lane not adjacent to the emergency response area, if possible
    D: Turn on hazard lights and maintain speed
  answer: C
  explanation: The Steer Clear Law requires drivers to move into a lane that is not
    next to an emergency response area. If they cannot move over safely, they must
    slow down to a speed that is safe and prudent.
- id: 160
  category: sharing_the_road
  question: When passing a bicyclist in Pennsylvania, what is the minimum amount of
    'buffer' space you must allow between your vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Pennsylvania law requires motorists to leave at least four feet of
    'buffer' space when passing a bicycle at a careful and reduced speed.
- id: 161
  category: sharing_the_road
  question: 'Under Pennsylvania law, you do NOT have to stop for a school bus with
    red lights flashing if:'
  choices:
    A: The bus is on the opposite side of a highway separated by a physical barrier
      like a median strip
    B: The bus is stopped in a residential zone
    C: You are traveling in the same direction but there are four lanes of travel
    D: The bus driver signals you to pass
  answer: A
  explanation: Drivers do not need to stop for a school bus if they are on the opposite
    side of a divided highway where the lanes are separated by a physical barrier,
    such as a concrete wall or grass median.
- id: 162
  category: sharing_the_road
  question: In Pennsylvania, motorcycle operators are required to wear a helmet UNLESS
    they meet which of the following criteria?
  choices:
    A: They are over 18 and have 1 year of experience
    B: They are at least 21 years old and have been licensed for at least 2 full years
      or completed a safety course
    C: They are riding on a road with a speed limit under 35 mph
    D: They are only carrying one passenger
  answer: B
  explanation: Pennsylvania law allows motorcycle operators 21 and older to ride without
    a helmet if they have been licensed for at least two years or have completed a
    motorcycle safety course approved by PennDOT.
- id: 163
  category: sharing_the_road
  question: 'When following a large truck, if you cannot see the truck driver''s side-view
    mirrors, you are:'
  choices:
    A: In a good position to pass
    B: In the truck's 'No-Zone' (blind spot)
    C: Safe because the truck driver can see you in the rearview mirror
    D: Following at a safe distance
  answer: B
  explanation: Large trucks have significant blind spots known as 'No-Zones.' If you
    cannot see the driver's face in their side-view mirrors, they cannot see you.
- id: 164
  category: sharing_the_road
  question: In Pennsylvania, what is the minimum distance you must maintain when following
    an emergency vehicle with its lights and sirens active?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: It is illegal in Pennsylvania to follow an emergency vehicle (like
    a fire truck or ambulance) closer than 500 feet when it is responding to an emergency.
- id: 165
  category: sharing_the_road
  question: 'When you see a pedestrian with a white cane or a guide dog at an intersection,
    you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Slow down and proceed with caution
    C: Stop and yield the right-of-way
    D: Drive around them if there is enough space
  answer: C
  explanation: Pennsylvania law requires drivers to come to a complete stop and yield
    the right-of-way to any blind pedestrian carrying a white cane or using a guide
    dog.
- id: 166
  category: sharing_the_road
  question: 'When approaching a horse-drawn vehicle in Pennsylvania''s ''Amish Country''
    or rural areas, you should:'
  choices:
    A: Honk your horn to warn the driver you are passing
    B: Slow down and pass only when it is safe, avoiding sudden noises
    C: Flash your high beams to signal your presence
    D: Pass as quickly as possible to get out of their way
  answer: B
  explanation: Drivers should be cautious around horse-drawn vehicles. Horses can
    be spooked by loud noises like horns or fast-moving vehicles; slow down and give
    them plenty of room.
- id: 167
  category: sharing_the_road
  question: In Pennsylvania, how many motorcycles are legally allowed to operate side-by-side
    in a single lane?
  choices:
    A: One
    B: Two
    C: Three
    D: None; they must stagger
  answer: B
  explanation: Pennsylvania law allows two motorcycles to operate side-by-side (abreast)
    in a single lane of travel.
- id: 168
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may:'
  choices:
    A: Stay entirely in the right lane
    B: Need to swing wide to the left to clear the curb
    C: Stop and wait for all traffic to clear before turning
    D: Turn from the left lane only
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn
    without hitting the curb or other objects. Drivers should never try to squeeze
    between a turning truck and the curb.
- id: 169
  category: sharing_the_road
  question: At an intersection where there are no marked crosswalks, what is the rule
    regarding pedestrians?
  choices:
    A: Pedestrians must yield to all vehicles
    B: Vehicles have the right-of-way because there is no marked path
    C: Every intersection is considered a 'legal' crosswalk, and drivers must yield
      to pedestrians
    D: Pedestrians are only allowed to cross at traffic lights
  answer: C
  explanation: In Pennsylvania, pedestrians have the right-of-way at all intersections,
    whether the crosswalks are marked or unmarked.
- id: 170
  category: sharing_the_road
  question: 'If you are driving behind a motorcycle, you should allow for:'
  choices:
    A: Less following distance than a car because they stop faster
    B: The same following distance as a car
    C: At least a 4-second following distance
    D: A 1-second following distance
  answer: C
  explanation: Pennsylvania's driver manual recommends a following distance of at
    least four seconds when behind a motorcycle to allow for their ability to stop
    quickly and for road hazards that might affect them differently.
- id: 171
  category: sharing_the_road
  question: 'According to Pennsylvania law, a bicyclist on the roadway is:'
  choices:
    A: Required to ride on the sidewalk
    B: Considered a vehicle operator and must obey all traffic laws
    C: Not allowed on roads with speed limits over 25 mph
    D: Required to ride against the flow of traffic
  answer: B
  explanation: In Pennsylvania, bicycles are considered vehicles. Bicyclists have
    the same rights and must obey the same rules of the road as motor vehicle drivers,
    including stopping at red lights and stop signs.
- id: 172
  category: sharing_the_road
  question: When a school bus is stopped on the opposite side of a highway separated
    by a physical barrier (such as a concrete median or guide rail), what must a Pennsylvania
    driver do?
  choices:
    A: Stop at least 10 feet away from the bus.
    B: Stop only if children are currently crossing.
    C: Slow down to 15 mph and proceed with caution.
    D: You are not required to stop.
  answer: D
  explanation: In Pennsylvania, you do not have to stop for a school bus if you are
    on the opposite side of a highway that is separated by a physical barrier, such
    as a median strip or guide rail.
- id: 173
  category: sharing_the_road
  question: According to Pennsylvania's 'Steer Clear' law, what must you do when approaching
    an emergency vehicle with its lights flashing that is stopped on the side of the
    road?
  choices:
    A: Maintain speed but move to the left lane.
    B: Move into a lane that is not adjacent to the emergency vehicle, if possible.
    C: Stop immediately in your lane of travel.
    D: Honk your horn to alert the emergency workers of your presence.
  answer: B
  explanation: Pennsylvania's Steer Clear law requires drivers to move into a lane
    not adjacent to the emergency response area. If they cannot move over safely,
    they must slow down to a speed that is safe and lower than the posted limit.
- id: 174
  category: sharing_the_road
  question: In Pennsylvania, if you are following a motorcycle, what is the recommended
    following distance to allow for safety?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: The Pennsylvania Driver’s Manual recommends a following distance of
    at least four seconds when following a motorcycle to allow for sudden stops or
    changes in road conditions.
- id: 175
  category: sharing_the_road
  question: Under Pennsylvania law, which of the following is true regarding a driver's
    responsibility toward a blind pedestrian carrying a white cane or using a guide
    dog?
  choices:
    A: You must yield only if they are in a marked crosswalk.
    B: You must yield the right-of-way, even if they are not in a crosswalk.
    C: You should honk to let them know you are passing.
    D: They must yield to motor vehicles between intersections.
  answer: B
  explanation: Pennsylvania law requires drivers to yield the right-of-way to any
    totally or partially blind pedestrian carrying a white cane or using a guide dog,
    regardless of where they are crossing.
- id: 176
  category: sharing_the_road
  question: Large trucks have 'No-Zones' where the driver cannot see your vehicle.
    Where is the largest 'No-Zone' located on a tractor-trailer?
  choices:
    A: Directly behind the trailer.
    B: Directly in front of the cab.
    C: On the left side of the cab.
    D: On the right side of the truck.
  answer: D
  explanation: While trucks have blind spots on all sides, the right-side blind spot
    is the largest and most dangerous, extending across several lanes.
- id: 177
  category: sharing_the_road
  question: In Pennsylvania, what is the maximum fine for a first-time violation of
    the 'Steer Clear' law if no injury occurred?
  choices:
    A: Up to $100
    B: Up to $250
    C: Up to $500
    D: Up to $1,000
  answer: C
  explanation: A first-time violation of Pennsylvania's Steer Clear law (Move Over
    Law) can result in a fine of up to $500.
- id: 178
  category: sharing_the_road
  question: 'In Pennsylvania, bicyclists are generally required to:'
  choices:
    A: Ride on the sidewalk at all times.
    B: Ride against the flow of traffic.
    C: Ride in the same direction as motor vehicles.
    D: Yield to all motor vehicles at all intersections.
  answer: C
  explanation: In Pennsylvania, bicycles are considered vehicles and must be operated
    in the same direction as motor vehicle traffic.
- id: 179
  category: sharing_the_road
  question: 'If you are stopped behind a truck at an intersection on an upgrade, you
    should:'
  choices:
    A: Stop very close to the truck to save space.
    B: Leave space in case the truck rolls backward slightly when starting.
    C: Keep your high beams on so the truck driver can see you.
    D: Honk your horn when the light turns green.
  answer: B
  explanation: Large vehicles may roll backward slightly when the driver takes their
    foot off the brake to engage the clutch or accelerator on a hill.
- id: 180
  category: sharing_the_road
  question: 'When an emergency vehicle using sirens and/or flashing lights approaches
    you from behind on a standard two-lane road, you must:'
  choices:
    A: Stop exactly where you are.
    B: Speed up to get out of the way.
    C: Pull over to the right edge of the road and stop.
    D: Pull over to the left edge of the road and stop.
  answer: C
  explanation: Pennsylvania law requires drivers to pull over to the right-hand edge
    or curb of the road, clear of any intersection, and stop until the emergency vehicle
    has passed.
- id: 181
  category: sharing_the_road
  question: 'In Pennsylvania, you may pass a bicycle in a ''no-passing zone'' if:'
  choices:
    A: The bicyclist waves you through.
    B: It is safe to do so and you maintain the 4-foot clearance.
    C: You are traveling at least 20 mph faster than the bicycle.
    D: Passing a bicycle in a no-passing zone is never legal.
  answer: B
  explanation: Pennsylvania law allows motorists to pass a bicycle in a no-passing
    zone if it can be done safely and while maintaining the required 4-foot distance.
- id: 182
  category: sharing_the_road
  question: Which of the following is a common cause of accidents involving motorcycles
    at intersections?
  choices:
    A: Motorcycles stopping too quickly.
    B: Motorcycles having better traction than cars.
    C: A driver turning left in front of an oncoming motorcycle.
    D: Motorcycles being unable to use turn signals.
  answer: C
  explanation: The most common cause of car-motorcycle accidents is a driver turning
    left in front of an oncoming motorcycle because they did not see the smaller vehicle
    or misjudged its speed.
- id: 183
  category: vehicle_information
  question: Under Pennsylvania law, when must your vehicle's headlights be turned
    on in relation to windshield wipers?
  choices:
    A: Only if it is dark outside
    B: Only when using wipers on the 'high' setting
    C: Whenever the wipers are in continuous or intermittent use due to precipitation
    D: Only when driving on the Pennsylvania Turnpike
  answer: C
  explanation: Pennsylvania law requires motorists to turn on their headlights whenever
    their windshield wipers are in continuous or intermittent use due to rain, snow,
    or sleet.
- id: 184
  category: vehicle_information
  question: 'In Pennsylvania, a tire is considered unsafe if the tread is cut or worn
    to a depth of less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Pennsylvania safety inspection standards state that a tire is unsafe
    if it has a tread depth of less than 2/32 of an inch.
- id: 185
  category: vehicle_information
  question: According to Pennsylvania's 'Christine's Law' (Act 90), what must a driver
    do before operating a vehicle after a snowfall?
  choices:
    A: Turn on hazard lights for the first 5 miles
    B: Wait at least 24 hours for the snow to melt
    C: Make reasonable efforts to remove accumulated ice or snow from the hood, trunk,
      and roof
    D: Only clear the driver's side of the windshield
  answer: C
  explanation: Act 90 requires drivers to remove accumulated ice or snow from their
    vehicles within 24 hours of a storm, or before driving if the accumulation poses
    a threat to others.
- id: 186
  category: vehicle_information
  question: Pennsylvania law requires that children under what age be secured in a
    rear-facing child passenger restraint system?
  choices:
    A: Under 1 year of age
    B: Under 2 years of age
    C: Under 4 years of age
    D: Under 5 years of age
  answer: B
  explanation: Pennsylvania law was updated to require children to remain in a rear-facing
    car seat until they are 2 years of age or until they reach the maximum weight
    or height limit of the seat.
- id: 187
  category: vehicle_information
  question: For most passenger cars in Pennsylvania, what is the legal limit for window
    tint light transmittance on side windows?
  choices:
    A: At least 25% of light must pass through
    B: At least 35% of light must pass through
    C: At least 50% of light must pass through
    D: At least 70% of light must pass through
  answer: D
  explanation: Pennsylvania regulations generally require that window tinting on passenger
    cars allow at least 70% of light to pass through (70% light transmittance).
- id: 188
  category: vehicle_information
  question: 'In Pennsylvania, your vehicle''s horn must be audible from a distance
    of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Pennsylvania vehicle equipment standards require a horn to be heard
    for a distance of not less than 200 feet.
- id: 189
  category: vehicle_information
  question: In Pennsylvania, if your vehicle's load extends more than ____ beyond
    the rear of the body, a red flag or cloth must be displayed during the day.
  choices:
    A: 2 feet
    B: 4 feet
    C: 6 feet
    D: 8 feet
  answer: B
  explanation: According to the PA Driver's Manual, if a load extends more than four
    feet beyond the rear of the vehicle, a 12-inch square red flag or cloth must be
    attached to the end of the load.
- id: 190
  category: vehicle_information
  question: Which of the following equipment is NOT required for a vehicle to pass
    a Pennsylvania safety inspection?
  choices:
    A: Working windshield wipers
    B: Functional parking brake
    C: Air conditioning system
    D: Functional speedometer
  answer: C
  explanation: While wipers, parking brakes, and speedometers are safety-critical
    items checked during inspection, an air conditioning system is not a safety requirement.
- id: 191
  category: vehicle_information
  question: In Pennsylvania, when are you allowed to use your hazard lights while
    driving on a highway?
  choices:
    A: Whenever you are in a hurry
    B: When your vehicle is traveling at a speed of less than 25 mph
    C: To signal that you are turning left
    D: When it is raining lightly
  answer: B
  explanation: Pennsylvania law permits the use of hazard lights when a vehicle is
    traveling at a speed of less than 25 mph, or when the vehicle is part of a funeral
    procession.
- id: 192
  category: vehicle_information
  question: 'According to Pennsylvania law, the rear registration plate must be illuminated
    so it is visible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Pennsylvania law requires the rear license plate to be illuminated
    by a white light so that it is clearly legible from a distance of 50 feet to the
    rear.
- id: 193
  category: vehicle_information
  question: In Pennsylvania, what is the maximum fine for a driver who fails to clear
    snow or ice from their vehicle that subsequently falls and causes serious injury
    or death to another person?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $5,000
  answer: C
  explanation: Under Act 90 (Christine's Law), if snow or ice falls from a moving
    vehicle and strikes another vehicle or pedestrian causing serious bodily injury
    or death, the driver can be fined up to $1,500.
- id: 194
  category: vehicle_information
  question: 'Under Pennsylvania law, you must turn on your headlights whenever you
    are using your windshield wipers on a continuous or intermittent basis due to
    weather. This is known as the:'
  choices:
    A: Wiper-Light Law
    B: Visibility Act
    C: Safe Sight Rule
    D: Inclement Weather Mandate
  answer: A
  explanation: Pennsylvania's 'Wiper-Light Law' requires motorists to turn on their
    headlights whenever their windshield wipers are in use due to rain, snow, or sleet.
- id: 195
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle to
    pass inspection in Pennsylvania?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: In Pennsylvania, tires are considered unsafe and will fail inspection
    if the tread depth is less than 2/32 of an inch.
- id: 196
  category: vehicle_information
  question: According to Pennsylvania's 'Christine's Law' (Act 90), what are the potential
    consequences if snow or ice falls from your vehicle and causes serious injury
    or death to another person?
  choices:
    A: A verbal warning only
    B: A fine of $50
    C: A fine ranging from $200 to $1,500
    D: Mandatory license revocation for 5 years
  answer: C
  explanation: Act 90 allows police to fine drivers $200 to $1,500 if snow or ice
    falls from their vehicle and causes serious bodily injury or death to another
    person.
- id: 197
  category: vehicle_information
  question: In Pennsylvania, window tinting on the windshield and front side windows
    of a passenger car must allow at least what percentage of light to pass through?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 90%
  answer: C
  explanation: Pennsylvania law generally requires that window tinting on the windshield
    and front side windows of passenger cars allow at least 70% light transmittance.
- id: 198
  category: vehicle_information
  question: In Pennsylvania, an emissions inspection is required for vehicles registered
    in how many of the state's 67 counties?
  choices:
    A: All 67 counties
    B: Only 5 counties
    C: 25 counties
    D: 42 counties
  answer: C
  explanation: Pennsylvania requires emissions inspections for vehicles registered
    in 25 specific counties, primarily those in more urban or high-traffic regions.
- id: 199
  category: vehicle_information
  question: 'If your vehicle''s view to the rear is obstructed by a trailer or the
    load you are carrying, Pennsylvania law requires you to have:'
  choices:
    A: A passenger to act as a spotter
    B: A camera system only
    C: Dual side mirrors (left and right)
    D: A wide-angle interior mirror
  answer: C
  explanation: If the inside rearview mirror is obstructed, Pennsylvania law requires
    the vehicle to be equipped with both a left and right outside rearview mirror.
- id: 200
  category: vehicle_information
  question: 'Pennsylvania law requires that every motor vehicle be equipped with a
    horn that can be heard from a distance of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: The Pennsylvania Vehicle Code requires that a vehicle's horn must be
    audible under normal conditions from a distance of not less than 200 feet.
- id: 201
  category: vehicle_information
  question: Which of the following is an illegal equipment modification in Pennsylvania?
  choices:
    A: Installing a trailer hitch
    B: Using a muffler cutout or bypass
    C: Replacing a standard steering wheel with an aftermarket one (with airbag)
    D: Adding a roof rack
  answer: B
  explanation: Pennsylvania law prohibits the use of muffler cutouts, bypasses, or
    similar devices that increase noise or allow exhaust gases to bypass the muffler.
- id: 202
  category: vehicle_information
  question: 'In Pennsylvania, the parking brake must be capable of holding the vehicle
    stationary on:'
  choices:
    A: Only flat surfaces
    B: A 10% grade
    C: Any grade (hill) upon which it is operated
    D: Only when the engine is running
  answer: C
  explanation: Pennsylvania safety inspection standards require the parking brake
    to be able to hold the vehicle on any grade on which it is driven.
- id: 203
  category: signs_and_signals
  question: When you encounter a flashing red light at an intersection in Pennsylvania,
    how must you respond?
  choices:
    A: Slow down and proceed with caution without stopping
    B: Stop only if there is cross traffic approaching
    C: Stop completely and proceed only when it is safe to do so
    D: Treat it as a yield sign and slow to 5 mph
  answer: C
  explanation: A flashing red light has the same meaning as a stop sign. You must
    come to a complete stop, look both ways, and proceed only when the way is clear.
- id: 204
  category: signs_and_signals
  question: 'Pennsylvania law requires drivers to turn on their headlights in work
    zones when:'
  choices:
    A: It is raining or snowing only
    B: The sun has set
    C: Signs are posted stating 'Headlights Must Be On'
    D: They are driving through any active work zone, regardless of the time of day
  answer: C
  explanation: In Pennsylvania, you must turn on your headlights in any work zone
    where signs are posted requiring them. This increases visibility for workers and
    other drivers.
- id: 205
  category: signs_and_signals
  question: If your vehicle's turn signals are not working, what is the correct hand
    signal to indicate a right turn in Pennsylvania?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward at a 90-degree angle
    C: Left arm extended downward with palm facing back
    D: Right arm waving out the passenger window
  answer: B
  explanation: The standard hand signal for a right turn is the left arm and hand
    bent upward at a 90-degree angle.
- id: 206
  category: signs_and_signals
  question: What do double solid yellow lines painted in the center of a Pennsylvania
    roadway indicate?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right side
    C: Passing is prohibited in both directions
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines mean that passing is not allowed for vehicles
    traveling in either direction.
- id: 207
  category: signs_and_signals
  question: 'In Pennsylvania, a ''No Passing Zone'' sign is uniquely shaped as a pennant
    (sideways triangle) and is placed:'
  choices:
    A: On the right side of the road at the beginning of the zone
    B: On the left side of the road at the beginning of the zone
    C: Overhead above the center lane
    D: Every 500 feet throughout the zone
  answer: B
  explanation: The pennant-shaped 'No Passing Zone' sign is placed on the left side
    of the road to provide additional warning to drivers that they may not pass.
- id: 208
  category: signs_and_signals
  question: 'A steady yellow traffic light at an intersection means:'
  choices:
    A: Speed up to clear the intersection before the red light
    B: The signal is about to turn green
    C: The signal is about to turn red and you should stop if it is safe to do so
    D: You have the right of way over turning traffic
  answer: C
  explanation: A steady yellow light warns that the signal is about to change to red.
    You should stop if you can do so safely; if you are already in the intersection,
    you should continue through cautiously.
- id: 209
  category: signs_and_signals
  question: Which sign shape is used exclusively for railroad advance warning in Pennsylvania?
  choices:
    A: Diamond
    B: Octagon
    C: Round
    D: Pentagon
  answer: C
  explanation: A round yellow sign with a black 'X' and the letters 'RR' is used as
    an advance warning sign for a railroad crossing.
- id: 210
  category: signs_and_signals
  question: 'When driving in a Pennsylvania school zone where lights are flashing,
    the speed limit is typically:'
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: In Pennsylvania, the speed limit in a school zone is 15 mph when the
    lights are flashing or during the time periods indicated on the sign.
- id: 211
  category: signs_and_signals
  question: What does a solid white line painted on the pavement between lanes of
    traffic moving in the same direction mean?
  choices:
    A: You are required to change lanes immediately
    B: Lane changes are discouraged for safety reasons
    C: You are on a one-way street
    D: The lane is reserved for bicycles only
  answer: B
  explanation: A solid white line indicates that lane changes are discouraged. Drivers
    should stay in their lane unless it is necessary to move.
- id: 212
  category: signs_and_signals
  question: In Pennsylvania, what is the meaning of a traffic sign with a fluorescent
    pink background?
  choices:
    A: Public recreation and scenic guidance
    B: Pedestrian crossing warning
    C: Incident management (e.g., traffic accidents or floods)
    D: School zone warning
  answer: C
  explanation: Fluorescent pink signs are used for incident management to warn drivers
    of temporary emergency situations like crashes or natural disasters.
- id: 213
  category: signs_and_signals
  question: 'To signal that you are slowing down or stopping using hand signals, you
    should:'
  choices:
    A: Extend your left arm straight out
    B: Extend your left arm upward
    C: Extend your left arm downward with the palm facing backward
    D: Wave your hand in a circular motion
  answer: C
  explanation: The hand signal for slowing or stopping is the left arm extended downward
    with the palm of the hand facing to the rear.
- id: 214
  category: signs_and_signals
  question: What does a steady yellow arrow indicate on a Pennsylvania traffic signal?
  choices:
    A: You may turn in the direction of the arrow after yielding
    B: The movement permitted by the green arrow is about to end
    C: You must stop and wait for a green circle
    D: Emergency vehicles are approaching from that direction
  answer: B
  explanation: A steady yellow arrow means the 'protected' turning time is ending.
    You should prepare to stop or complete your turn if you are already in the intersection.
- id: 215
  category: signs_and_signals
  question: 'A five-sided sign (pentagon) shaped like a house is used in Pennsylvania
    to warn of:'
  choices:
    A: Residential areas
    B: Hospital zones
    C: School zones or school crossings
    D: Public parks
  answer: C
  explanation: The pentagon shape is reserved exclusively for school zones and school
    crossing signs.
- id: 216
  category: signs_and_signals
  question: 'In Pennsylvania, a pennant-shaped sign found on the left side of the
    road indicates:'
  choices:
    A: A school zone
    B: A railroad crossing ahead
    C: A no-passing zone
    D: A yield requirement
  answer: C
  explanation: According to the PennDOT Driver's Manual, a pennant-shaped sign is
    placed on the left side of the road to mark the beginning of a no-passing zone.
- id: 217
  category: signs_and_signals
  question: When you see a steady yellow 'X' signal over a traffic lane in Pennsylvania,
    what does it signify?
  choices:
    A: The lane is for turning only
    B: You must move out of this lane as soon as it is safe to do so
    C: The lane is closed to all traffic
    D: You may use the lane with caution
  answer: B
  explanation: A steady yellow 'X' over a lane means that the direction of the lane
    is about to change and you must prepare to vacate the lane safely.
- id: 218
  category: signs_and_signals
  question: Under Pennsylvania law, what must you do when approaching a flashing red
    traffic signal?
  choices:
    A: Slow down and proceed with caution
    B: Stop only if there is cross traffic
    C: Stop completely and proceed only when it is safe
    D: Yield to traffic on the right but do not stop
  answer: C
  explanation: A flashing red light has the same meaning as a stop sign. You must
    come to a complete stop and proceed only when it is safe to do so.
- id: 219
  category: signs_and_signals
  question: 'In Pennsylvania, you may turn left on a red light ONLY if you are turning
    from:'
  choices:
    A: A two-way street onto a one-way street
    B: A one-way street onto another one-way street
    C: A one-way street onto a two-way street
    D: Any street, provided there is no 'No Turn on Red' sign
  answer: B
  explanation: Pennsylvania law allows a left turn on red only when turning from a
    one-way street onto another one-way street, after coming to a complete stop and
    yielding to pedestrians and other traffic.
- id: 220
  category: signs_and_signals
  question: What does a steady green arrow displayed with a red light mean in Pennsylvania?
  choices:
    A: You must wait for the red light to change to green before turning
    B: You may proceed in the direction of the arrow, but you must yield to pedestrians
    C: You have a 'protected' turn and may proceed in the direction of the arrow
    D: The green arrow is a warning that the light is about to turn red
  answer: C
  explanation: A steady green arrow means you may proceed in the direction the arrow
    points. This is a 'protected' turn, meaning oncoming traffic is stopped by a red
    light.
- id: 221
  category: signs_and_signals
  question: What is the standard color and shape for a 'Warning' sign in Pennsylvania?
  choices:
    A: Red and white octagon
    B: Yellow and black diamond
    C: White and black rectangle
    D: Green and white rectangle
  answer: B
  explanation: Warning signs in Pennsylvania are typically diamond-shaped with a yellow
    background and black symbols or lettering.
- id: 222
  category: signs_and_signals
  question: 'In Pennsylvania, double solid yellow lines painted down the center of
    the road mean:'
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is not permitted from either side
    D: Passing is permitted if the road is clear
  answer: C
  explanation: Double solid yellow lines indicate that passing is prohibited for vehicles
    traveling in either direction.
- id: 223
  category: signs_and_signals
  question: 'A broken white line on a Pennsylvania multi-lane highway indicates:'
  choices:
    A: Traffic is moving in opposite directions
    B: Traffic is moving in the same direction and lane changes are permitted
    C: The edge of the roadway
    D: A restricted HOV lane
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    Drivers may cross these lines to change lanes when it is safe to do so.
- id: 224
  category: signs_and_signals
  question: 'When approaching a railroad crossbuck sign in Pennsylvania that does
    not have a signal, you should:'
  choices:
    A: Always come to a full stop
    B: Speed up to clear the tracks quickly
    C: Treat it like a yield sign; slow down and prepare to stop if a train is approaching
    D: Ignore it if you do not see a train
  answer: C
  explanation: A railroad crossbuck sign should be treated as a yield sign. Drivers
    must slow down, look, and listen for a train, and be prepared to stop if one is
    coming.
- id: 225
  category: signs_and_signals
  question: In Pennsylvania, what color are signs used to provide information about
    work zones and maintenance projects?
  choices:
    A: Yellow
    B: Fluorescent Pink
    C: Orange
    D: Blue
  answer: C
  explanation: Orange is the standard background color for work zone signs in Pennsylvania,
    indicating construction or maintenance areas ahead.
- id: 226
  category: signs_and_signals
  question: What does a white diamond symbol painted on the pavement of a lane signify
    in Pennsylvania?
  choices:
    A: The lane is reserved for high-occupancy vehicles (HOV)
    B: The lane is for emergency vehicles only
    C: The lane is ending
    D: The lane is a designated bike lane only
  answer: A
  explanation: The diamond symbol on the pavement indicates a restricted lane, such
    as an HOV lane for buses or carpools.
- id: 227
  category: signs_and_signals
  question: 'A center lane marked on both sides by a solid yellow line and a broken
    yellow line is used for:'
  choices:
    A: Passing slower traffic
    B: Emergency parking only
    C: Left turns only
    D: High-speed travel
  answer: C
  explanation: This marking indicates a 'Center Turn Lane,' which is reserved for
    vehicles making left turns from either direction. It is not to be used for passing
    or through travel.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 228
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 229
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 230
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 231
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 232
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 233
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 234
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 235
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 236
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 237
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 238
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 239
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 240
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 241
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 242
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 243
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 244
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 245
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 246
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 247
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 248
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 249
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 250
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 251
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 252
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 253
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 254
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 255
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 256
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 257
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 258
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 259
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 260
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 261
