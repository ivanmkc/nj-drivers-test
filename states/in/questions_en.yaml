  source: //www.in.gov/bmv/licenses-permits-ids/files/drivers-manual.pdf:2025 Indiana
    Driver's Manual (in.gov)
  total_questions: 362
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What visual indicator on an Indiana license, ID, or permit signifies that
    it is a Real ID?
  choices:
    A: A hologram of the state seal
    B: A star in the upper right hand corner
    C: A barcode on the front
    D: A blue stripe across the top
  answer: B
  explanation: According to the manual, a Real ID is indicated by a star in the upper
    right hand corner of licenses, IDs, and permits.
- id: 2
  category: license_system
  question: Which of the following is a benefit of holding a Real ID?
  choices:
    A: You can drive commercial vehicles without a CDL.
    B: You can board commercial flights within the United States.
    C: You are exempt from paying tolls on interstate highways.
    D: You can travel internationally without a passport.
  answer: B
  explanation: The manual states that with a Real ID, you can board commercial flights
    within the United States.
- id: 3
  category: license_system
  question: In addition to boarding domestic commercial flights, what else does a
    Real ID allow you to do?
  choices:
    A: Enter certain federal facilities and visit military bases
    B: Bypass security checkpoints at airports
    C: Operate a watercraft without a separate license
    D: Park in designated handicap parking spaces
  answer: A
  explanation: The manual specifies that a Real ID allows you to visit military bases
    and enter certain federal facilities.
- id: 4
  category: license_system
  question: Where can Indiana residents find information about the documents needed
    to upgrade to a Real ID?
  choices:
    A: BMV.IN.gov
    B: RealID.IN.gov
    C: Indiana.gov/ID
    D: HoosierDrive.com
  answer: B
  explanation: The manual directs individuals to visit RealID.IN.gov to learn what
    documents are needed to upgrade to a Real ID.
- id: 5
  category: license_system
  question: According to the Indiana Bureau of Motor Vehicles mission statement, how
    does the BMV aim to provide driver and vehicle services?
  choices:
    A: By prioritizing commercial drivers over standard drivers
    B: In a timely and accurate manner while ensuring security and transparency
    C: By offering free credential replacements to all Hoosiers
    D: Through exclusively online platforms
  answer: B
  explanation: The BMV's mission is to serve all Hoosiers by providing best-in-class
    driver and vehicle services in a timely and accurate manner while ensuring security
    and transparency.
- id: 6
  category: driver_testing
  question: Based on the manual's section on obtaining a new credential, which of
    the following screenings or exams is required?
  choices:
    A: Hearing Exam
    B: Vision Screening
    C: Physical Fitness Test
    D: Psychological Evaluation
  answer: B
  explanation: Chapter 1 of the manual, which covers Obtaining a New Credential, lists
    'Vision Screening' as a required component.
- id: 7
  category: driver_responsibility
  question: Which topic is covered under the process of obtaining a new credential
    regarding potential accidents or damages?
  choices:
    A: Financial Liability for Injury or Damage
    B: Comprehensive Collision Coverage
    C: Medical Malpractice Insurance
    D: Vehicle Warranty Registration
  answer: A
  explanation: Chapter 1 of the manual includes a specific section on 'Financial Liability
    for Injury or Damage' when obtaining a new credential.
- id: 8
  category: license_system
  question: Which of the following is listed as a specific endorsement or license
    type in the Indiana Driver's Manual?
  choices:
    A: Heavy Machinery Operator's License
    B: For-Hire Endorsement
    C: Agricultural Vehicle Permit
    D: Recreational Vehicle (RV) License
  answer: B
  explanation: Chapter 2 of the manual covers Restrictions and Endorsements, which
    explicitly includes the 'For-Hire Endorsement'.
- id: 9
  category: license_system
  question: What type of military indicator can be added to an Indiana credential?
  choices:
    A: Retired Reserve Indicator
    B: Active Duty and Veteran Military Indicator
    C: National Guard Dependent Indicator
    D: Overseas Deployment Indicator
  answer: B
  explanation: Chapter 3 of the manual lists the 'Active Duty and Veteran Military
    Indicator' as an option for credentials.
- id: 10
  category: penalties_and_points
  question: Which program is associated with points and suspensions in the Indiana
    Driver's Manual?
  choices:
    A: Driver Safety Program
    B: Highway Watch Program
    C: Hoosier Helper Initiative
    D: Accident Forgiveness Program
  answer: A
  explanation: Chapter 5 of the manual, which covers Points, Suspensions, and Insurance
    Requirements, includes information on the 'Driver Safety Program'.
- id: 11
  category: penalties_and_points
  question: What term does the Indiana Driver's Manual use to describe drivers with
    multiple severe traffic offenses?
  choices:
    A: Chronic Traffic Offenders
    B: Habitual Traffic Violators
    C: Repeat Moving Violators
    D: High-Risk Motorists
  answer: B
  explanation: Chapter 5 of the manual covers points and suspensions, including a
    specific section dedicated to 'Habitual Traffic Violators'.
- id: 12
  category: signs_and_signals
  question: Which of the following is a specific category of traffic signs discussed
    in the manual?
  choices:
    A: Traffic Suggestion Signs
    B: Traffic Guidance Signs
    C: Traffic Enforcement Signs
    D: Traffic Observation Signs
  answer: B
  explanation: Chapter 6 of the manual covers Traffic Signs and Signals, which includes
    a specific section on 'Traffic Guidance Signs'.
- id: 13
  category: vehicle_information
  question: According to the manual's section on safe vehicle operation, what vehicle
    maintenance topic is specifically addressed alongside tire pressure?
  choices:
    A: Oil Life
    B: Brake Pad Wear
    C: Tread Depth
    D: Coolant Levels
  answer: C
  explanation: Chapter 7 of the manual covers Safe Vehicle Operation, which includes
    a section specifically titled 'Tire Pressure and Tread Depth'.
- id: 14
  category: safe_driving_rules
  question: Which of the following driving behaviors are specifically addressed in
    the Safe Vehicle Operation chapter?
  choices:
    A: Distracted Driving and Aggressive Driving
    B: Joyriding and Street Racing
    C: Tailgating and Brake Checking
    D: Carpooling and Ridesharing
  answer: A
  explanation: Chapter 7 of the manual covers Safe Vehicle Operation, which includes
    specific sections on 'Distracted Driving' and 'Aggressive Driving'.
- id: 15
  category: license_system
  question: What specific type of cycle, other than a motorcycle, has its own section
    under Restrictions and Endorsements?
  choices:
    A: Bicycles
    B: Motor Driven Cycle (MDC)
    C: Electric Scooters
    D: All-Terrain Vehicles (ATVs)
  answer: B
  explanation: Chapter 2 of the manual covers Restrictions and Endorsements, including
    a specific section for the 'Motor Driven Cycle (MDC)'.
- id: 16
  category: license_system
  question: What format are credentials issued to Indiana residents who are under
    21 years of age?
  choices:
    A: Horizontal format
    B: Vertical format
    C: Square format
    D: Booklet format
  answer: B
  explanation: All credentials issued to Indiana residents who are under 21 years
    of age have a vertical format and display the dates the cardholder turns 18 and
    21 years of age.
- id: 17
  category: license_system
  question: What does a star marker in the upper right-hand corner of an Indiana credential
    indicate?
  choices:
    A: The driver is an organ donor.
    B: The driver has a commercial driver's license.
    C: The credential is Real ID-compliant.
    D: The driver is under 21 years of age.
  answer: C
  explanation: A star marker appears in the upper right-hand corner to indicate that
    a credential is Real ID-compliant and may be used as identification for federal
    purposes.
- id: 18
  category: license_system
  question: How long does a new Indiana resident have to obtain a new Indiana driver's
    license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: When you become an Indiana resident, you have 60 days to obtain a new
    Indiana driver's license.
- id: 19
  category: license_system
  question: If you are a new Indiana resident who has never held a valid driver's
    license from another state, how long must you hold an Indiana learner's permit
    before applying for a driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: D
  explanation: If you have never held a valid driver's license from another state,
    you must hold an Indiana learner's permit for 180 days before you can apply for
    an Indiana driver's license.
- id: 20
  category: driver_testing
  question: What tests must you pass if your out-of-state driver's license has been
    expired for more than five years?
  choices:
    A: Only a standard vision screening
    B: Only a knowledge exam
    C: A knowledge exam and a driving skills test
    D: A driving skills test and a physical exam
  answer: C
  explanation: If your out-of-state driver's license has been expired for more than
    five years, you must pass a knowledge exam and a driving skills test to obtain
    an Indiana driver's license.
- id: 21
  category: driver_testing
  question: What test is required for an 18-year-old new resident whose out-of-state
    driver's license has been expired for less than five years?
  choices:
    A: A driving skills test
    B: A knowledge exam
    C: A physical examination
    D: A hearing test
  answer: B
  explanation: If your out-of-state driver's license has been expired for less than
    five years, or you have held an unrevoked out-of-state driver's license for less
    than one year, you must pass a knowledge exam to obtain an Indiana driver's license.
- id: 22
  category: license_system
  question: Which of the following is considered evidence of Indiana residency?
  choices:
    A: Being a temporary employee in the state
    B: Being a registered voter in Indiana
    C: Being enrolled at a post-secondary institution without claiming Indiana residency
    D: Being an active-duty military member claiming residency in another state
  answer: B
  explanation: Evidence of Indiana residency includes maintaining a residential address
    in Indiana, being a registered voter in Indiana, or having a dependent enrolled
    in an elementary or secondary school located in Indiana.
- id: 23
  category: license_system
  question: Who is eligible to receive an Indiana Identification Card at no cost?
  choices:
    A: Any individual under the age of 18
    B: Individuals who are or will be 18 years of age on or before the next General
      or Municipal Election
    C: Any new resident of Indiana
    D: Individuals who have surrendered an out-of-state driver's license
  answer: B
  explanation: Identification cards are issued at no cost to individuals who are or
    will be 18 years of age on or before the next General or Municipal Election.
- id: 24
  category: license_system
  question: What is the deadline established by the DHS and TSA for requiring a Real
    ID-compliant credential to board an aircraft?
  choices:
    A: January 1, 2010
    B: December 31, 2022
    C: May 7, 2025
    D: January 1, 2026
  answer: C
  explanation: The Department of Homeland Security (DHS) and Transportation Security
    Administration (TSA) have established May 7, 2025, as the deadline for when they
    will begin requiring those boarding an aircraft using a driver's license or identification
    card to have a Real ID-compliant credential.
- id: 25
  category: license_system
  question: Which of the following documents is NOT explicitly listed as required
    to upgrade to a Real ID-compliant credential?
  choices:
    A: Proof of identity
    B: Proof of lawful status
    C: Social Security number
    D: Proof of vehicle insurance
  answer: D
  explanation: To upgrade to a Real ID-compliant credential, you must provide original
    versions or certified copies of your identity, lawful status, Social Security
    number, and proof of Indiana residency. Proof of vehicle insurance is not required.
- id: 26
  category: license_system
  question: What happens if the BMV discovers an applicant holds a credential from
    another state during the verification process?
  choices:
    A: The applicant must pay a dual-residency fee.
    B: The applicant will be required to surrender the out-of-state credential.
    C: The applicant will be issued a temporary Indiana credential for 60 days.
    D: The applicant is permanently banned from obtaining an Indiana credential.
  answer: B
  explanation: If during verification, the BMV discovers another credential has been
    issued to an applicant in another state... the applicant will be required to surrender
    the out-of-state credential before the BMV will process an application for an
    Indiana credential.
- id: 27
  category: license_system
  question: What dates are prominently displayed on an Indiana credential issued to
    a resident under 21 years of age?
  choices:
    A: The dates the cardholder turns 18 and 21 years of age
    B: The dates the cardholder turns 16 and 18 years of age
    C: The dates the cardholder obtained their permit and license
    D: The dates of the next General and Municipal Elections
  answer: A
  explanation: All credentials issued to Indiana residents who are under 21 years
    of age have a vertical format and display the dates the cardholder turns 18 and
    21 years of age.
- id: 28
  category: driver_testing
  question: In addition to providing required documentation, what screening must all
    new Indiana residents pass when obtaining an Indiana driver's license?
  choices:
    A: A standard hearing screening
    B: A standard vision screening
    C: A drug and alcohol screening
    D: A physical agility screening
  answer: B
  explanation: Individuals in all the above listed categories must also present documentation
    proving your identity, lawful status, Social Security number, and Indiana residency...
    You are also required to pass a standard vision screening.
- id: 29
  category: license_system
  question: Which of the following individuals is NOT considered an Indiana resident
    for the purpose of obtaining a credential?
  choices:
    A: A person maintaining a residential address in Indiana and not claiming residency
      elsewhere
    B: A registered voter in Indiana
    C: A person with a dependent enrolled in an Indiana elementary school
    D: Active-duty military personnel in the armed forces who do not claim Indiana
      as their state of residence
  answer: D
  explanation: For the purposes of obtaining a credential, active-duty military personnel
    in the armed forces who do not claim Indiana as their state of residence are not
    considered Indiana residents.
- id: 30
  category: license_system
  question: If you are 18 years of age or older and hold a valid out-of-state driver's
    license, which of the following items can you bring to the branch to apply for
    an Indiana license?
  choices:
    A: A copy of your high school diploma
    B: A copy of your official driving record
    C: A letter from your previous state's governor
    D: A utility bill from your previous state
  answer: B
  explanation: 'If you are at least 18 years of age and you hold a valid out-of-state
    driver''s license, you must bring one of the following three items to the branch:
    your current out-of-state driver''s license, a copy of your official driving record,
    or a verification letter.'
- id: 31
  category: license_system
  question: How long is a standard Indiana identification card valid for?
  choices:
    A: 2 years
    B: 4 years
    C: 6 years
    D: 8 years
  answer: C
  explanation: According to the manual, an identification card and an MDC endorsement
    are valid for six years.
- id: 32
  category: license_system
  question: If you are applying for an Indiana identification card but already hold
    a credential from another state, what must you do?
  choices:
    A: Keep both credentials as long as they are from different states
    B: Surrender the other credential to the Indiana BMV
    C: Pay an additional fee to hold multiple credentials
    D: Destroy the out-of-state credential yourself
  answer: B
  explanation: Indiana residents cannot hold more than one credential at the same
    time. Therefore, you must surrender any other credential to the Indiana BMV to
    complete an application for an identification card.
- id: 33
  category: license_system
  question: What is the minimum age required to obtain a Motor Driven Cycle (MDC)
    endorsement on an identification card?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 18 years of age
  answer: B
  explanation: Identification cards may provide privileges to operate a Motor Driven
    Cycle (MDC) as long as you are at least 15 years of age and pass an MDC knowledge
    exam.
- id: 34
  category: driver_testing
  question: If you are under 16 years of age applying for a learner's permit, which
    of the following is NOT an acceptable document to prove driver education enrollment?
  choices:
    A: A Certificate of Driver Education Enrollment from the school
    B: A certificate dated two weeks prior to the start of the class
    C: An online course certificate of completion for theoretical training
    D: A document proving enrollment in a BMV licensed Behind-the-wheel training provider
  answer: C
  explanation: The manual explicitly states that the online course certificate of
    completion for theoretical training is not an acceptable document to prove enrollment.
- id: 35
  category: license_system
  question: How long is a standard learner's permit valid from the date of issuance?
  choices:
    A: 1 year
    B: 2 years
    C: 4 years
    D: 6 years
  answer: B
  explanation: According to the Learner's Permit Validity section, learner's permits
    are valid for two years from the date of issuance.
- id: 36
  category: driver_testing
  question: You must retest when renewing your learner's permit if it has been expired
    for more than how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: D
  explanation: If you are visiting a BMV branch to renew your learner's permit and
    it has been expired more than 180 days, you are required to retest.
- id: 37
  category: safe_driving_rules
  question: If you are under 16 years of age and practicing driving with a relative,
    what is the minimum age the licensed relative must be?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: C
  explanation: You may practice driving with a licensed driver who has valid driving
    privileges and is 25 years of age or older, provided they are related to you by
    blood, marriage, or legal status.
- id: 38
  category: driver_testing
  question: How early must you arrive at a BMV branch before it closes to take the
    computer-based knowledge exam?
  choices:
    A: At least 15 minutes
    B: At least 30 minutes
    C: At least 45 minutes
    D: At least 1 hour
  answer: B
  explanation: You must arrive at the branch at least 30 minutes before the branch
    closes to take the computer-based knowledge exam that day.
- id: 39
  category: driver_testing
  question: What must you do if you fail the driver's knowledge exam?
  choices:
    A: Retake it immediately after paying a fee
    B: Wait at least 30 minutes to retake it
    C: Wait until the next business day to retake it
    D: Wait one full week to retake it
  answer: C
  explanation: 'The manual states: ''If you fail the knowledge exam, you must wait
    until the next business day to retake it.'''
- id: 40
  category: penalties_and_points
  question: A driver renewing their Indiana driver's license must take the knowledge
    exam if they have at least how many active points on their driving record?
  choices:
    A: 2 or more active points
    B: 4 or more active points
    C: 6 or more active points
    D: 8 or more active points
  answer: C
  explanation: The driver's knowledge exam is required for a driver who has six or
    more active points on an Indiana driving record and is renewing their driver's
    license.
- id: 41
  category: driver_testing
  question: What should you do if you normally wear glasses or contacts while driving
    and are taking the vision screening?
  choices:
    A: Remove them to test your natural vision
    B: Wear them during the vision screening
    C: Only wear them if you fail the initial screening
    D: Provide a doctor's note instead of taking the screening
  answer: B
  explanation: If you normally wear glasses or contacts while driving, you should
    inform the BMV branch personnel and wear them during the vision screening.
- id: 42
  category: license_system
  question: If you are under 18 years old and applying for a learner's permit, you
    must provide an emergency contact who is at least what age?
  choices:
    A: 18 years of age or older
    B: 21 years of age or older
    C: 25 years of age or older
    D: Any age as long as they are a relative
  answer: A
  explanation: An individual less than 18 years old applying for a learner's permit
    is required to provide an emergency contact that is at least 18 years of age or
    older.
- id: 43
  category: safe_driving_rules
  question: If you are under 18 and under the care of the Department of Child Services
    (DCS), you may practice driving with a non-relative licensed driver if they are
    approved by DCS and at least what age?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: C
  explanation: If under the care of the Department of Child Services, you may choose
    to practice driving with a licensed driver who is 25 years of age or older and
    approved by the Department of Child Services.
- id: 44
  category: driver_testing
  question: If you fail the computer-based knowledge exam, how long must you wait
    before you can retake it?
  choices:
    A: Until the next business day
    B: 48 hours
    C: 7 days
    D: 14 days
  answer: A
  explanation: If you fail the knowledge exam, you must wait until the next business
    day to retake it.
- id: 45
  category: driver_testing
  question: When scheduling a driving skills exam at the BMV, what is the maximum
    amount of time in advance you can schedule the appointment?
  choices:
    A: One week
    B: Two weeks
    C: Three weeks
    D: One month
  answer: C
  explanation: A driving skills exam may be scheduled no more than three weeks, and
    no less than 48 business hours, ahead of time.
- id: 46
  category: vehicle_information
  question: Which of the following is a valid reason for a BMV examiner to reject
    a vehicle for the driving skills exam?
  choices:
    A: The vehicle has a manual transmission
    B: The vehicle has an inoperative door
    C: The vehicle is more than 10 years old
    D: The vehicle does not have a backup camera
  answer: B
  explanation: Examples of reasons vehicles may be rejected for the driving skills
    exam include an inoperative door, unsafe tires, missing bumper, broken glass/mirrors,
    or not being properly registered.
- id: 47
  category: driver_testing
  question: Which of the following actions will result in an automatic failure of
    the driving skills exam?
  choices:
    A: Leaving your turn signal on after a completed lane change
    B: Failing to check your blind spot
    C: Backing over a curb
    D: Reversing too fast
  answer: C
  explanation: Backing over a curb is listed as an action that shall result in the
    automatic failure of the driving skills exam. The other options are actions that
    could affect your final score or cause you to fail, but are not listed as automatic
    failures.
- id: 48
  category: driver_testing
  question: Who is allowed in the vehicle with you when you take the driving skills
    exam?
  choices:
    A: A licensed parent or guardian
    B: A certified driving instructor
    C: Only the BMV examiner or authorized BMV personnel
    D: Anyone with a valid driver's license
  answer: C
  explanation: No one other than the BMV examiner(s) conducting the skills exam or
    other authorized BMV personnel is allowed in your vehicle when you take the driving
    skills exam.
- id: 49
  category: driver_testing
  question: What happens if you fail a third driving skills exam while holding a learner's
    permit?
  choices:
    A: You must wait two months before taking the exam again
    B: Your learner's permit is permanently revoked
    C: You must retake the driver education course
    D: You must wait six months before taking the exam again
  answer: A
  explanation: Upon failure of a third driving skills exam while holding a learner’s
    permit, you must wait for two months from the date of the last failed driving
    skills exam before taking the exam again.
- id: 50
  category: driver_responsibility
  question: Who has the first order of preference to sign a sworn statement of financial
    liability for an applicant under 18 years of age?
  choices:
    A: The noncustodial parent
    B: The guardian having custody of the minor
    C: Any adult willing to assume the obligation
    D: The parent having custody of the minor applicant
  answer: D
  explanation: The lawful order of preference for financial liability is first the
    parent having custody of the minor applicant (or a designee specified by the custodial
    parent).
- id: 51
  category: driver_responsibility
  question: What happens if the adult who co-signed for financial liability files
    a written request to withdraw their financial liability for a minor?
  choices:
    A: The minor must pay a fine
    B: The minor's learner's permit or driver's license will be canceled
    C: The minor must find a new co-signer within 30 days to keep their license
    D: The minor is restricted to driving only to and from school
  answer: B
  explanation: A written request to withdraw financial liability will cancel the minor’s
    learner’s permit or driver’s license.
- id: 52
  category: license_system
  question: If a minor applicant is under the care of the Department of Child Services
    (DCS), what must they provide instead of an adult's signature for financial liability?
  choices:
    A: A letter of recommendation from a judge
    B: Proof of a motor vehicle insurance policy meeting minimum liability standards
    C: A cash deposit of $1,000 to the BMV
    D: Proof of completion of an advanced defensive driving course
  answer: B
  explanation: If the DCS applicant is applying for a driver’s license or learner’s
    permit, the applicant must also provide proof of a motor vehicle insurance policy
    that meets the minimum liability standards set forth in Indiana law.
- id: 53
  category: license_system
  question: If you are applying for a driver's license and are under the age of 21,
    what type of license will you receive?
  choices:
    A: A restricted license
    B: A commercial driver's license (CDL)
    C: A probationary driver's license
    D: A learner's permit
  answer: C
  explanation: If you are under the age of 21, then your driver’s license is considered
    a "probationary" license.
- id: 54
  category: driver_testing
  question: During the driving skills exam, which of the following will cause an automatic
    failure?
  choices:
    A: Failing to use a seat belt
    B: Failing to use the defroster when needed
    C: Driving too slowly
    D: Slowing speed when changing lanes
  answer: A
  explanation: Failure to use a seat belt is listed under the actions that shall result
    in the automatic failure of the driving skills exam. The other options are actions
    that could affect your final score or cause you to fail, but are not automatic
    failures.
- id: 55
  category: driver_testing
  question: How much does the BMV charge to administer a driving skills exam?
  choices:
    A: $15
    B: $25
    C: $50
    D: There is no charge
  answer: D
  explanation: There is no charge for the driving skills exam administered by the
    BMV.
- id: 56
  category: license_system
  question: How old must you be to apply for a driver's license if you have NOT completed
    a BMV licensed driver education program?
  choices:
    A: 16 years and 90 days of age
    B: 16 years and 180 days of age
    C: 16 years and 270 days of age
    D: 18 years of age
  answer: C
  explanation: According to the manual, you must be at least 16 years and 270 days
    of age without completion of a BMV licensed driver education program.
- id: 57
  category: license_system
  question: How long is a standard driver's license valid for a person who is 80 years
    old?
  choices:
    A: Two years
    B: Three years
    C: Four years
    D: Six years
  answer: B
  explanation: The manual states that a driver's license is valid for three years
    if you are aged 75 through 84.
- id: 58
  category: safe_driving_rules
  question: During the first 180 days of holding a probationary driver's license,
    which of the following passengers are you allowed to drive with unaccompanied
    by a qualifying adult?
  choices:
    A: Your friends from school
    B: Your sibling
    C: Your cousin
    D: Your neighbor
  answer: B
  explanation: You may drive with your child, stepchild, sibling, step or half-sibling,
    or spouse without another accompanying individual during the first 180 days after
    obtaining your probationary driver's license.
- id: 59
  category: safe_driving_rules
  question: For the first 180 days after obtaining your probationary driver's license,
    you may not drive between what hours?
  choices:
    A: 10 p.m. and 5 a.m.
    B: 11 p.m. and 6 a.m.
    C: Midnight and 5 a.m.
    D: 9 p.m. and 6 a.m.
  answer: A
  explanation: 'The manual states: "For the first 180 days after obtaining your probationary
    driver''s license, you may not drive between 10 p.m. and 5 a.m."'
- id: 60
  category: safe_driving_rules
  question: When is a probationary driver's license holder permitted to use a telecommunications
    device while operating a motor vehicle?
  choices:
    A: When using a hands-free device
    B: When texting a parent or guardian
    C: When stopped at a red light
    D: When making a 911 emergency call
  answer: D
  explanation: Indiana law prohibits all drivers from operating a motor vehicle while
    using any form of telecommunications device unless the device is being used to
    make a 911 emergency call.
- id: 61
  category: penalties_and_points
  question: 'The BMV is required to suspend a juvenile''s driving privileges upon
    notification from a school administrator if the juvenile:'
  choices:
    A: Receives a single detention
    B: Is determined to be a habitual truant
    C: Fails a driver education course
    D: Is late to school three times
  answer: B
  explanation: Indiana law requires the BMV to suspend the driving privileges of a
    juvenile if they are under an expulsion/exclusion/second suspension, have withdrawn
    from school, or have been determined to be a habitual truant.
- id: 62
  category: license_system
  question: What is the minimum age required to apply for a Commercial Driver's License
    (CDL) with passenger and/or school bus endorsements?
  choices:
    A: 18 years of age
    B: 21 years of age
    C: 25 years of age
    D: 16 years and 270 days
  answer: B
  explanation: You must be at least 18 years of age to apply for a CDL and 21 years
    of age to apply for a CDL with passenger and/or school bus endorsements.
- id: 63
  category: driver_testing
  question: If you are applying for a driver's license and are at least 18 years of
    age, how many hours of supervised driving practice must you complete?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: If you are applying for a driver's license and you are at least 18
    years of age, you must complete at least 50 hours of supervised driving practice.
- id: 64
  category: driver_testing
  question: Of the required 50 hours of supervised driving practice, how many hours
    must be completed at night (unless you have a daytime-only restriction)?
  choices:
    A: 5 hours
    B: 10 hours
    C: 15 hours
    D: 20 hours
  answer: B
  explanation: At least 10 hours of supervised driving practice must be completed
    at night, unless you have a daytime-only restriction on your learner's permit.
- id: 65
  category: license_system
  question: 'If you obtain a driver''s license before the age of 21, your probationary
    driver''s license is valid until you are:'
  choices:
    A: 21 years of age exactly
    B: 21 years and 30 days of age
    C: 21 years and 90 days of age
    D: 25 years of age
  answer: B
  explanation: Your probationary driver's license is valid until you are 21 years
    and 30 days of age.
- id: 66
  category: license_system
  question: After applying for a new credential, within how many calendar days will
    it arrive at your mailing address?
  choices:
    A: 7 calendar days
    B: 10 calendar days
    C: 14 calendar days
    D: 21 calendar days
  answer: C
  explanation: Your credential will be sent to the mailing address on file with the
    BMV and will arrive at your mailing address within 14 calendar days.
- id: 67
  category: license_system
  question: For what reasons are photo-exempt identification cards available?
  choices:
    A: Medical reasons only
    B: Religious reasons only
    C: Both medical and religious reasons
    D: Privacy reasons only
  answer: B
  explanation: Photo-exempt learner's permits and driver's licenses are available
    for medical and religious reasons. Photo-exempt identification cards are available
    for religious reasons only.
- id: 68
  category: driver_testing
  question: When applying for a driver's license, which of the following is true regarding
    the knowledge and skills exams?
  choices:
    A: The skills exam must be completed prior to the knowledge exam
    B: The knowledge exam must be completed prior to the skills exam
    C: Both exams must be taken on the same day
    D: The knowledge exam is waived if you pass the skills exam
  answer: B
  explanation: To obtain a driver's license, you must pass a knowledge exam for the
    driver's license you want to obtain, which must be complete prior to the skills
    exam.
- id: 69
  category: safe_driving_rules
  question: 'After holding a probationary license for 180 days (and being under 18),
    you may drive during restricted hours if you are participating in, going to, or
    returning from:'
  choices:
    A: A school-sanctioned activity
    B: A friend's house
    C: A local sporting event as a spectator
    D: A public park
  answer: A
  explanation: You may drive during the restricted periods if you are participating
    in, going to, or returning from lawful employment, a school-sanctioned activity,
    or a religious event.
- id: 70
  category: vehicle_information
  question: 'An Indiana CDL allows the holder to operate commercial motor vehicles
    with gross vehicle weight ratings in excess of:'
  choices:
    A: 10,000 pounds
    B: 16,000 pounds
    C: 20,000 pounds
    D: 26,000 pounds
  answer: D
  explanation: An Indiana CDL allows the holder to operate commercial motor vehicles
    or combination of vehicles with gross vehicle weight ratings in excess of 26,000
    pounds.
- id: 71
  category: license_system
  question: What happens if you change your mailing address with the United States
    Postal Service but forget to update it with the Indiana BMV?
  choices:
    A: The USPS will automatically forward your credential to your new address.
    B: Your credential will be held at the local post office for pickup.
    C: Your credential will not be forwarded, preventing delivery.
    D: The BMV will email you a digital copy of your credential instead.
  answer: C
  explanation: The manual states that credentials will only be mailed to the address
    on file with the BMV and will not be forwarded. Failure to update your address
    with the BMV will prevent delivery.
- id: 72
  category: safe_driving_rules
  question: Under Indiana law, who is required to wear a seat belt when a motor vehicle
    is in motion?
  choices:
    A: Only the driver and front-seat passengers
    B: All occupants of a motor vehicle equipped with a standard installation seat
      belt
    C: Only passengers under the age of 18
    D: The driver, unless they are operating a commercial vehicle
  answer: B
  explanation: Indiana law requires all occupants of a motor vehicle equipped with
    a seat belt that is standard equipment installed by the manufacturer to wear the
    seat belt any time the vehicle is in motion.
- id: 73
  category: driver_responsibility
  question: When is it legally permissible to use a telecommunications device to type
    or read a text message while operating a moving motor vehicle?
  choices:
    A: When traveling at speeds under 15 mph
    B: When stopped at a red traffic light
    C: When using hands-free technology or making a 911 emergency call
    D: When driving on a rural highway with no other traffic
  answer: C
  explanation: Indiana law prohibits typing, transmitting, or reading a text or email
    while operating a moving vehicle unless the device is used with hands-free or
    voice-operated technology, or to make a 911 emergency call.
- id: 74
  category: driver_responsibility
  question: Which of the following is NOT considered a restricted telecommunications
    device under Indiana's driving laws?
  choices:
    A: A wireless telephone
    B: A personal digital assistant (PDA)
    C: A text messaging device
    D: Citizen band (CB) radio equipment operated by a licensed operator
  answer: D
  explanation: The definition of a telecommunications device does not include citizen
    band (CB) radio equipment operated by a person licensed by the FCC.
- id: 75
  category: license_system
  question: What does Restriction G indicate when placed on an Indiana driver's license?
  choices:
    A: Glasses or contact lenses required
    B: Outside rearview mirrors required
    C: Daylight driving only
    D: Interlock device required
  answer: C
  explanation: According to the Base Driver's License Restrictions chart, Restriction
    G stands for 'Daylight Driving Only'.
- id: 76
  category: safe_driving_rules
  question: What are the permitted riding hours for an individual holding a motorcycle
    learner's permit?
  choices:
    A: Between 6:00 AM and 6:00 PM
    B: One-half hour before sunrise until one-half hour after sunset
    C: From sunrise to sunset only
    D: There are no time restrictions for permit holders
  answer: B
  explanation: If you hold a motorcycle learner's permit, you may only ride during
    the period of one-half hour before sunrise and one-half hour after sunset.
- id: 77
  category: license_system
  question: If you are obtaining your Indiana driver's license for the first time,
    what is the minimum age requirement to get a motorcycle endorsement at the same
    time?
  choices:
    A: 15 years of age
    B: 16 years of age
    C: 16 years and 90 days of age
    D: 18 years of age
  answer: C
  explanation: You can get a motorcycle endorsement at the same time as your first
    driver's license provided you are 16 years and 90 days of age or older and have
    completed a motorcycle safety course.
- id: 78
  category: vehicle_information
  question: 'To be defined as a Motor Driven Cycle (MDC) under Indiana law, the vehicle''s
    cylinder capacity must not exceed:'
  choices:
    A: 35 cubic centimeters
    B: 50 cubic centimeters
    C: 150 cubic centimeters
    D: 250 cubic centimeters
  answer: B
  explanation: Indiana law defines a vehicle as an MDC if, among other requirements,
    it has a cylinder capacity not exceeding 50 cubic centimeters.
- id: 79
  category: safe_driving_rules
  question: Which of the following is a restriction that applies to the operation
    of a Motor Driven Cycle (MDC)?
  choices:
    A: Must operate at no more than 35 miles per hour
    B: May carry one passenger if they wear a helmet
    C: Can be operated on interstate highways
    D: Must be operated in the center of the roadway
  answer: A
  explanation: Restrictions for operating an MDC include operating at no more than
    35 miles per hour, not carrying passengers, and not operating on an interstate
    highway.
- id: 80
  category: vehicle_information
  question: Which of the following features is required for a three-wheeled motor
    vehicle to be legally defined as an autocycle in Indiana?
  choices:
    A: Handlebars for steering
    B: Anti-lock brakes
    C: A saddle-style seat
    D: A cylinder capacity under 50cc
  answer: B
  explanation: An autocycle must be equipped with a roll cage/hoops, safety belts,
    anti-lock brakes, and be designed to be controlled with a steering wheel and pedals.
- id: 81
  category: license_system
  question: What credential is required to legally operate an autocycle on Indiana
    roadways?
  choices:
    A: A motorcycle learner's permit
    B: A motorcycle endorsement
    C: A valid Indiana driver's license
    D: A commercial driver's license (CDL)
  answer: C
  explanation: You may operate an autocycle on Indiana roadways if you possess a valid
    Indiana driver's license. A motorcycle learner's permit or endorsement is not
    required.
- id: 82
  category: driver_testing
  question: Which of the following is prohibited when operating an autocycle?
  choices:
    A: Driving on interstate highways
    B: Using the autocycle for a driving skills exam for a driver's license
    C: Operating the vehicle without a motorcycle helmet
    D: Carrying a passenger in the enclosed seating area
  answer: B
  explanation: The manual explicitly states that an autocycle 'May not be used for
    the purpose of a driving skills exam for a driver's license.'
- id: 83
  category: license_system
  question: A for-hire endorsement allows the credential holder to operate a motor
    vehicle designed to transport fewer than how many passengers for hire?
  choices:
    A: 10 passengers
    B: 12 passengers
    C: 15 passengers
    D: 16 passengers
  answer: D
  explanation: A for-hire endorsement provides privileges to operate a motor vehicle
    designed to transport fewer than 16 passengers, including the driver, for the
    purpose of transporting passengers for hire.
- id: 84
  category: license_system
  question: What are the age and experience requirements to obtain a for-hire endorsement
    in Indiana?
  choices:
    A: At least 16 years old with 6 months of driving experience
    B: At least 18 years old and held a valid Indiana driver's license for at least
      one year
    C: At least 21 years old with a clean driving record
    D: At least 18 years old and held a valid Indiana driver's license for at least
      two years
  answer: B
  explanation: According to the manual, a for-hire endorsement may be issued to Indiana
    residents who are at least 18 years of age and who have held a valid Indiana driver's
    license for at least one year.
- id: 85
  category: license_system
  question: Does the Indiana BMV require a medical examination report to issue a driver's
    license with a for-hire endorsement?
  choices:
    A: Yes, it must be updated every two years.
    B: Yes, but only for drivers over the age of 65.
    C: No, the BMV does not require a medical examination report for a for-hire endorsement.
    D: No, unless the driver is transporting hazardous materials.
  answer: C
  explanation: 'The manual states: ''The BMV does not require a medical examination
    report in order to issue a driver''s license with the for-hire endorsement.'''
- id: 86
  category: vehicle_information
  question: Which of the following is NOT considered transporting for hire according
    to the Indiana driver's manual?
  choices:
    A: Operating a ride share vehicle
    B: Operating a medical services vehicle
    C: Operating a cab or limousine
    D: Operating a bus used to carry passengers for compensation
  answer: B
  explanation: The manual explicitly lists 'Operating a medical services vehicle'
    as an exception that is not considered transporting for hire.
- id: 87
  category: driver_responsibility
  question: Under Indiana's Donor Choice Law, what happens if an individual who is
    18 years of age or older declares their intention to be an organ donor?
  choices:
    A: Their family members can override the decision at the time of death.
    B: They must renew their declaration every four years.
    C: Their family members cannot override their intention at the time of death.
    D: They must carry a separate organ donor card at all times.
  answer: C
  explanation: The manual states that under Indiana's Donor Choice Law, individuals
    18 years of age and older may declare their intention to be organ donors and their
    family members cannot override their intention at the time of death.
- id: 88
  category: license_system
  question: What document must a veteran provide to obtain a veteran indicator on
    their credential?
  choices:
    A: A Common Access Card (CAC)
    B: A DD 214 issued by the United States Department of Defense
    C: A letter from the Department of Veterans Affairs
    D: A valid military ID card
  answer: B
  explanation: To obtain the veteran indicator, you must provide a DD 214 issued by
    the United States Department of Defense verifying your discharge.
- id: 89
  category: safe_driving_rules
  question: Indiana law requires the operator of a watercraft to carry a valid driver's
    license if the engine produces more than how many horsepower?
  choices:
    A: 5 horsepower
    B: 10 horsepower
    C: 15 horsepower
    D: 25 horsepower
  answer: B
  explanation: Indiana law requires the operator of a watercraft with an engine that
    produces more than 10 horsepower to carry a valid driver's license.
- id: 90
  category: license_system
  question: If you are 15 years of age or older and do not have a driver's license,
    what must you do to legally operate a watercraft with an engine over 10 horsepower?
  choices:
    A: Successfully complete an approved boater education course and carry a valid
      Indiana ID card.
    B: Have a licensed adult over the age of 21 in the watercraft with you.
    C: Apply for a temporary watercraft permit at the BMV.
    D: You cannot operate a watercraft under any circumstances without a driver's
      license.
  answer: A
  explanation: If you are 15 or older without a driver's license, you may operate
    a watercraft only after successfully completing an approved boater education course,
    and you must have a valid Indiana identification card in your possession.
- id: 91
  category: penalties_and_points
  question: What happens to your ability to operate a watercraft if your driver's
    license is suspended?
  choices:
    A: You may only operate a watercraft during daylight hours.
    B: You may operate a watercraft if you complete a boater education course.
    C: You may not operate a watercraft.
    D: You may operate a watercraft as long as it has less than 25 horsepower.
  answer: C
  explanation: 'The manual states: ''If your driver''s license is suspended, you may
    not operate a watercraft.'''
- id: 92
  category: vehicle_information
  question: When does a parking placard issued for a temporary disability expire?
  choices:
    A: On the date indicated by the health care provider or one year after issuance,
      whichever occurs first.
    B: Two years from the date of issuance.
    C: On the driver's next birthday.
    D: Six months from the date of issuance.
  answer: A
  explanation: If you have a temporary disability, your parking placard expires on
    the date indicated by the health care provider or one year after the date of issuance,
    whichever occurs first.
- id: 93
  category: vehicle_information
  question: What is the fee for obtaining a permanent parking placard in Indiana?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: There is no fee for a permanent parking placard.
  answer: D
  explanation: 'The manual explicitly states: ''There is no fee for a permanent parking
    placard.'''
- id: 94
  category: safe_driving_rules
  question: Is it permissible to park in the diagonally striped space next to a reserved
    parking space if you have a valid parking placard?
  choices:
    A: Yes, but only for loading and unloading passengers.
    B: Yes, if the main reserved space is already occupied.
    C: No, parking in the diagonally striped space is prohibited at all times.
    D: No, unless you are driving a wheelchair-accessible van.
  answer: C
  explanation: 'The manual states: ''Parking in the diagonally striped space next
    to a reserved parking space is prohibited at all times, even with a valid placard.'''
- id: 95
  category: license_system
  question: When does an Indiana probationary driver's license expire?
  choices:
    A: At midnight on the driver's 21st birthday.
    B: When the card holder is 21 years and 30 days of age.
    C: Four years from the date of issuance.
    D: At midnight on the driver's 18th birthday.
  answer: B
  explanation: According to the manual, a probationary driver's license expires when
    the card holder is 21 years and 30 days of age.
- id: 96
  category: license_system
  question: If your birthday falls on a day when BMV branches are closed, when does
    your credential expire?
  choices:
    A: At midnight on the day before your birthday.
    B: At midnight on your birthday regardless of BMV hours.
    C: At midnight on the next business day.
    D: Seven days after your birthday.
  answer: C
  explanation: 'The manual notes: ''If your birthday falls on a day when BMV branches
    are closed, your credential expires at midnight on the next business day.'''
- id: 97
  category: penalties_and_points
  question: Can you receive points on your driver record for infractions committed
    while operating a watercraft?
  choices:
    A: No, watercraft infractions are handled separately from driving records.
    B: Yes, if you operate your watercraft recklessly, while intoxicated, or break
      private watercraft laws.
    C: Yes, but only if you are operating a watercraft with more than 50 horsepower.
    D: No, unless the watercraft is involved in a collision with a motor vehicle.
  answer: B
  explanation: The manual states that if you operate your watercraft recklessly, while
    intoxicated, or break private watercraft laws, you may have points assessed against
    your driver record.
- id: 98
  category: license_system
  question: How early can you renew your driver's license with a for-hire endorsement
    before it expires?
  choices:
    A: Up to 30 days before it expires.
    B: Up to 90 days before it expires.
    C: Up to six months before it expires.
    D: Up to one year before it expires.
  answer: D
  explanation: You may renew your driver's license with a for-hire endorsement at
    any Indiana BMV branch or online up to one year before the license expires.
- id: 99
  category: license_system
  question: At what time does an Indiana driver's license typically expire on your
    birthday?
  choices:
    A: Noon
    B: 5:00 PM
    C: Midnight
    D: 11:59 AM
  answer: C
  explanation: According to the manual, all other credentials expire at midnight on
    your birthday. If the branch is closed, it expires at midnight on the next business
    day.
- id: 100
  category: driver_testing
  question: What must you do to renew a driver's license that has been expired for
    three years?
  choices:
    A: Pay a penalty and pass a vision screening only
    B: Pay a penalty, pass a knowledge exam, and pass a vision screening
    C: Pass a driving skills exam and vision screening
    D: Pay a penalty, pass a knowledge exam, driving skills exam, and vision screening
  answer: B
  explanation: If you are renewing a driver's license that has been expired for at
    least 180 days but not more than five years, you must pay an administrative penalty,
    pass a knowledge exam, and pass a standard vision screening.
- id: 101
  category: license_system
  question: How far in advance can a U.S. citizen or individual with permanent lawful
    status renew their driver's license?
  choices:
    A: Up to 30 days before expiration
    B: Up to 6 months before expiration
    C: Up to 12 months before expiration
    D: Up to 24 months before expiration
  answer: D
  explanation: A driver's license or identification card may be renewed by U.S. citizens
    or individuals with permanent lawful status up to 24 months before the credential
    expiration.
- id: 102
  category: driver_testing
  question: If you are at least 21 years of age and have six or more active points
    on your driving record, what is required to renew your driver's license?
  choices:
    A: You must take a driving skills exam
    B: You must take the knowledge exam
    C: You must complete a Driver Safety Program
    D: You must pay double the renewal fee
  answer: B
  explanation: If you are at least 21 years of age and have six or more active points
    on your driving record, you must take the knowledge exam to renew your driver's
    license.
- id: 103
  category: license_system
  question: If you are temporarily living outside Indiana serving in the U.S. Armed
    Forces, how long does your driver's license remain valid following your discharge?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Your driver's license remains valid for 90 days following your discharge
    from service, post-deployment, or after you are no longer temporarily residing
    outside Indiana because of service.
- id: 104
  category: driver_responsibility
  question: Within how many days must you notify the BMV and apply for an amended
    credential after changing your principal address?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: If you have an Indiana credential, you must notify the BMV of a change
    of your principal (legal) address and apply for an amended credential within 30
    days of the address change.
- id: 105
  category: license_system
  question: What must you do before visiting a BMV branch to officially change your
    name on your driver's license?
  choices:
    A: Change your name on your vehicle registration online
    B: Visit a Social Security Administration office and wait at least one business
      day
    C: Update your mailing address at a BMV Connect kiosk
    D: Complete a Driver Safety Program
  answer: B
  explanation: You must visit a Social Security Administration office to officially
    change your name on Social Security documentation and allow at least one business
    day after your name change transaction is completed before visiting a BMV branch.
- id: 106
  category: penalties_and_points
  question: How many points are assessed to your driving record for speeding 16 to
    25 miles per hour over the speed limit?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: According to the point values table, speeding 16 - 25 miles per hour
    over the speed limit results in 4 points.
- id: 107
  category: penalties_and_points
  question: How long do points stay active on your Indiana driver record?
  choices:
    A: One year from the conviction date
    B: Two years from the conviction date
    C: Three years from the conviction date
    D: Five years from the conviction date
  answer: B
  explanation: Points stay active on your driver record for two years from the conviction
    date.
- id: 108
  category: defensive_driving
  question: How many point credits can an Indiana driver receive for completing a
    BMV-approved Driver Safety Program (DSP)?
  choices:
    A: A two-point credit
    B: A three-point credit
    C: A four-point credit
    D: A six-point credit
  answer: C
  explanation: Any Indiana driver may complete a DSP course from a BMV-approved provider
    and receive a four-point credit.
- id: 109
  category: penalties_and_points
  question: The BMV may require drivers 21 years of age and older to complete a Driver
    Safety Program (DSP) if they are convicted of how many traffic offenses within
    a 12-month period?
  choices:
    A: Two or more
    B: Three or more
    C: Four or more
    D: Five or more
  answer: A
  explanation: The BMV may require drivers 21 years of age and older who are convicted
    of two or more traffic offenses within a 12-month period to complete a BMV-approved
    DSP course.
- id: 110
  category: driver_responsibility
  question: What is the state minimum insurance standard for property damages in any
    one accident in Indiana?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The state minimum insurance standard includes $25,000 for property
    damages in any one accident, commonly referred to as part of the 25/50/25 liability
    insurance.
- id: 111
  category: driver_responsibility
  question: If the BMV requests proof of financial responsibility, within how many
    days must the Certificate of Compliance (COC) be received electronically from
    your insurer?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: D
  explanation: The COC must be received electronically from your insurer and processed
    by the BMV within 90 days of the BMV's mailing of a request to verify financial
    responsibility.
- id: 112
  category: penalties_and_points
  question: How many points are assessed for driving while suspended or participating
    in a speed contest on the road?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 10 points
  answer: C
  explanation: The manual lists both 'Driving while suspended' and 'Speed contest
    on road' as violations that result in 8 points.
- id: 113
  category: license_system
  question: What is the maximum number of times you may replace your credential online
    before you are required to visit a BMV branch?
  choices:
    A: 3 times
    B: 5 times
    C: 10 times
    D: 15 times
  answer: C
  explanation: You may replace your credential online a maximum of 10 times before
    you are required to visit a BMV branch for a replacement.
- id: 114
  category: driver_responsibility
  question: What is the state's minimum motor vehicle liability protection in Indiana?
  choices:
    A: 20/40/20
    B: 25/50/25
    C: 50/100/50
    D: 10/25/10
  answer: B
  explanation: The manual states that the state's minimum motor vehicle liability
    protection is 25/50/25.
- id: 115
  category: penalties_and_points
  question: How many days do you have for your insurer to electronically process a
    Certificate of Compliance (COC) after the BMV mails a request to verify financial
    responsibility?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The COC must be received electronically from your insurer and processed
    by the BMV within 90 days of the BMV's mailing of a request to verify financial
    responsibility.
- id: 116
  category: driver_responsibility
  question: What is the purpose of an SR22 form?
  choices:
    A: To report a traffic accident to the BMV
    B: To demonstrate proof of future financial responsibility
    C: To cancel an existing insurance policy
    D: To register a company-owned vehicle
  answer: B
  explanation: Indiana law requires that you have your insurance provider electronically
    file proof of future financial responsibility with an SR22 form in order for your
    driving privileges to be reinstated.
- id: 117
  category: penalties_and_points
  question: What happens if the BMV receives an SR26 notice from your insurance provider
    while you have an SR22 requirement?
  choices:
    A: Your driving privileges will be suspended until an effective SR22 is received
      or the period expires.
    B: Your insurance premiums will be reduced.
    C: You will be required to retake the driving skills test.
    D: Your vehicle registration will be permanently revoked.
  answer: A
  explanation: If the BMV receives an SR26 (cancellation of SR22 insurance) notice,
    Indiana law requires the BMV to suspend your driving privileges until it receives
    an effective SR22 policy, or until the SR22 requirement period expires.
- id: 118
  category: penalties_and_points
  question: What is the reinstatement fee for a first no-insurance suspension that
    occurred after January 1, 2015?
  choices:
    A: $150
    B: $225
    C: $250
    D: $500
  answer: C
  explanation: Reinstatement fees are $250 for a first no-insurance suspension that
    occurred after Jan. 1, 2015.
- id: 119
  category: penalties_and_points
  question: How can a driver reinstate their driving privileges without paying a no-insurance
    reinstatement fee?
  choices:
    A: By completing a defensive driving course
    B: By submitting proof of future financial responsibility (SR22) and maintaining
      it continuously for 180 days
    C: By paying the original traffic ticket in full
    D: By writing an appeal letter to the BMV
  answer: B
  explanation: A driver may reinstate their driving privileges without having to pay
    a no-insurance reinstatement fee by having their insurance provider electronically
    submit proof of future financial responsibility (SR22 form) and maintain SR22
    continuously for 180-days.
- id: 120
  category: alcohol_drugs_health
  question: Operating a vehicle is considered a criminal offense if your blood alcohol
    concentration (BAC) is in excess of what legal limit?
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: Operating a vehicle while intoxicated or with a blood alcohol concentration
    (BAC) in excess of the legal limit (.08) is a criminal offense.
- id: 121
  category: alcohol_drugs_health
  question: Which of the following is listed as a primary factor in determining an
    individual's blood alcohol concentration (BAC)?
  choices:
    A: The individual's height
    B: The type of alcohol consumed
    C: The individual's body weight
    D: The amount of food eaten before drinking
  answer: C
  explanation: The primary factors in determining an individual's BAC are the amount
    of alcohol consumed, how quickly the alcohol is consumed, and the individual's
    body weight.
- id: 122
  category: penalties_and_points
  question: What is the penalty for a motorist who fails a chemical test for alcohol?
  choices:
    A: A 90-day suspension of driving privileges
    B: A 180-day suspension of driving privileges
    C: A one-year suspension of driving privileges
    D: A two-year suspension of driving privileges
  answer: B
  explanation: A motorist who fails a chemical test will face a suspension of driving
    privileges for 180 days.
- id: 123
  category: penalties_and_points
  question: If a motorist refuses to submit to a chemical test, how long will their
    driving privileges be suspended?
  choices:
    A: 180 days
    B: One year
    C: Two years
    D: Three years
  answer: B
  explanation: A motorist who refuses to submit to a chemical test will face a suspension
    of driving privileges for one year.
- id: 124
  category: alcohol_drugs_health
  question: What is the function of an ignition interlock device?
  choices:
    A: It tracks the vehicle's speed and location for law enforcement.
    B: It mechanically tests the driver's blood alcohol level before the car can be
      started.
    C: It automatically contacts emergency services in the event of a crash.
    D: It prevents the vehicle from exceeding the posted speed limit.
  answer: B
  explanation: The court may also require the installation of an ignition interlock
    device, which mechanically tests the driver's blood alcohol level before his or
    her car can be started.
- id: 125
  category: alcohol_drugs_health
  question: How does a conviction for operating a watercraft while intoxicated affect
    your driving record?
  choices:
    A: It has no effect on your motor vehicle driving record.
    B: It results in a warning letter but no suspension.
    C: It is forwarded to the BMV and becomes part of your driver record.
    D: It only affects your boating license, not your driver's license.
  answer: C
  explanation: A conviction of operating a watercraft while intoxicated is forwarded
    to the BMV and the conviction becomes part of your driver record.
- id: 126
  category: penalties_and_points
  question: What action can the BMV take if a court determines a parent is delinquent
    in paying child support?
  choices:
    A: Immediately suspend the delinquent parent's driving privileges.
    B: Confiscate the parent's vehicle.
    C: Double the parent's vehicle registration fees.
    D: Require the parent to retake the driving skills test.
  answer: A
  explanation: A court that has determined a parent is delinquent in paying child
    support may order the BMV to immediately suspend the delinquent parent's driving
    privileges.
- id: 127
  category: penalties_and_points
  question: What will happen if you submit a payment to the BMV for services or fees
    and the payment is not honored (e.g., a bounced check)?
  choices:
    A: You will receive a warning letter giving you 30 days to pay.
    B: Your driving privileges will be indefinitely suspended.
    C: You will be required to perform community service.
    D: Your vehicle will be impounded.
  answer: B
  explanation: The BMV will indefinitely suspend your driving privileges if you submit
    payment to the BMV for any services or fees and that payment was not honored.
- id: 128
  category: driver_responsibility
  question: How much does it cost to view your driver record online at IN.gov/BMV?
  choices:
    A: $5.00 per view
    B: $10.00 annually
    C: There is no charge.
    D: $15.00 for a certified copy
  answer: C
  explanation: Your first resource should be to check your driver record, which you
    may view anytime at no charge at IN.gov/BMV.
- id: 129
  category: license_system
  question: What is the cost of purchasing an Official Driver Record in Indiana?
  choices:
    A: Free
    B: $4
    C: $10
    D: $15
  answer: B
  explanation: According to the manual, an Official Driver Record may be purchased
    for $4.
- id: 130
  category: penalties_and_points
  question: How long does it typically take the BMV to process reinstatement information
    once it is received from a court?
  choices:
    A: Up to 48 hours
    B: Up to 5 business days
    C: Up to 10 business days
    D: Up to 30 days
  answer: C
  explanation: Processing by the BMV may take up to 10 business days once the reinstatement
    information is received from the court.
- id: 131
  category: license_system
  question: Which of the following is true regarding the Viewable Driver Record?
  choices:
    A: It costs $4 to view.
    B: It can be used as an official transcript for employers.
    C: It cannot be printed and should not be used as an official transcript.
    D: It is only available at a BMV Connect kiosk.
  answer: C
  explanation: The Viewable Driver Record cannot be printed and should not be used
    as an official transcript of your driver record.
- id: 132
  category: penalties_and_points
  question: Under Section A of the Habitual Traffic Violator (HTV) laws, how long
    will a driver's privileges be suspended if they accumulate two judgments within
    a 10-year period for operating a motor vehicle while intoxicated resulting in
    death?
  choices:
    A: 5 years
    B: 10 years
    C: 15 years
    D: For life
  answer: D
  explanation: Drivers who accumulate two judgments within a 10-year period for operating
    a motor vehicle while intoxicated resulting in death will have their driving privileges
    suspended for life.
- id: 133
  category: penalties_and_points
  question: A driver who accumulates three major offenses, such as reckless driving
    or drag racing, within a 10-year period will face a driving privilege suspension
    of what length?
  choices:
    A: 3 years
    B: 5 years
    C: 10 years
    D: For life
  answer: C
  explanation: Under Section B, drivers who accumulate three major offenses from the
    provided list within a 10-year period will have their driving privileges suspended
    for 10 years.
- id: 134
  category: penalties_and_points
  question: What is the penalty for a driver who accumulates 10 or more traffic violations
    in a 10-year period, including at least one major offense?
  choices:
    A: A 1-year suspension
    B: A 5-year suspension
    C: A 10-year suspension
    D: A lifetime suspension
  answer: B
  explanation: Under Section C, an HTV is subject to a five-year driving privilege
    suspension for accumulating 10 or more traffic violations in a 10-year period,
    one of which is a major offense.
- id: 135
  category: license_system
  question: What does a 'Restriction 5' on an Indiana driver's license indicate?
  choices:
    A: The driver must wear corrective lenses.
    B: The driver is restricted to daylight driving only.
    C: The driver has been granted hardship, probationary, conditional, or specialized
      driving privileges.
    D: The driver must operate a vehicle with an ignition interlock device.
  answer: C
  explanation: A 'Restriction 5' is placed on the driver's license of a person who
    has been granted hardship, probationary, conditional, or specialized driving privileges
    by court order.
- id: 136
  category: penalties_and_points
  question: Which of the following is a requirement for a person who has been granted
    specialized driving privileges by a court?
  choices:
    A: Maintain an effective SR22 on file with the BMV.
    B: Complete a defensive driving course every 6 months.
    C: Only drive a vehicle with a manual transmission.
    D: Surrender their validly issued credential to the BMV.
  answer: A
  explanation: A person granted specialized driving privileges must maintain an effective
    SR22 on file with the BMV for the duration of the specialized driving privileges.
- id: 137
  category: signs_and_signals
  question: What type of information do brown traffic signs indicate?
  choices:
    A: Temporary traffic conditions
    B: Road services and amenities
    C: Nearby recreational and cultural interest sites
    D: Permitted movements and directions
  answer: C
  explanation: Brown traffic signs indicate nearby recreational and cultural interest
    sites, such as a state park.
- id: 138
  category: signs_and_signals
  question: A traffic sign displaying information about amenities at an upcoming exit
    will typically have what background color?
  choices:
    A: Green
    B: Blue
    C: White
    D: Orange
  answer: B
  explanation: Blue traffic signs display road services and information, such as amenities
    at an upcoming exit.
- id: 139
  category: signs_and_signals
  question: Which color is used for traffic signs that warn drivers of temporary traffic
    conditions, such as highway construction?
  choices:
    A: Yellow
    B: Red
    C: Orange
    D: Brown
  answer: C
  explanation: Orange traffic signs warn drivers of temporary traffic conditions,
    often due to highway construction and maintenance projects.
- id: 140
  category: signs_and_signals
  question: What do white traffic signs typically display?
  choices:
    A: Traffic regulations such as speed limits
    B: Warnings for specific road hazards
    C: Directions to nearby hospitals
    D: Recreational and cultural interest sites
  answer: A
  explanation: White traffic signs display traffic regulations, such as speed limits,
    that drivers must obey, as well as helpful information like state highway markers.
- id: 141
  category: signs_and_signals
  question: A 'Slippery When Wet' sign is an example of a sign that prepares drivers
    for specific road conditions. What color is its background?
  choices:
    A: Red
    B: Orange
    C: Yellow
    D: Green
  answer: C
  explanation: Yellow or fluorescent yellow-green signs prepare drivers for specific
    road conditions and hazards ahead. A 'Slippery When Wet' sign is an example of
    a traffic sign with a yellow background.
- id: 142
  category: signs_and_signals
  question: What do red traffic signs convey to drivers?
  choices:
    A: Permitted movements and guidance
    B: Traffic regulations that require immediate action to avoid threats to safety
    C: Nearby school zones and pedestrian crossings
    D: Temporary traffic conditions due to construction
  answer: B
  explanation: Red traffic signs convey traffic regulations that require drivers to
    take immediate action to avoid threats to traffic safety, such as a 'Wrong Way'
    sign.
- id: 143
  category: penalties_and_points
  question: Which of the following offenses is considered a major offense under Section
    A of the Habitual Traffic Violator laws, potentially leading to a 10-year suspension
    if two judgments are accumulated?
  choices:
    A: Nine speeding tickets in a 10-year period
    B: Reckless homicide resulting from operation of a motor vehicle
    C: Driving with a suspended license
    D: Failing to use a turn signal
  answer: B
  explanation: Reckless homicide resulting from operation of a motor vehicle is listed
    under Section A as a major offense resulting in injury or death.
- id: 144
  category: signs_and_signals
  question: What do fluorescent yellow-green traffic signs warn drivers of?
  choices:
    A: Highway construction zones
    B: Nearby schools, pedestrians, and bicycles
    C: Upcoming railroad crossings
    D: Traffic regulations requiring immediate action
  answer: B
  explanation: Fluorescent yellow-green signs warn drivers of nearby schools, pedestrians,
    bicycles, playgrounds, and school bus routes.
- id: 145
  category: signs_and_signals
  question: Where are pennant-shaped traffic signs posted and what do they indicate?
  choices:
    A: On the right side of the road to indicate a school zone
    B: On the left-hand side of two-way roads to warn not to pass on the left
    C: At intersections to indicate a required stop
    D: Before railroad crossings to warn of approaching trains
  answer: B
  explanation: Pennant-shaped traffic signs are posted on the left-hand side of two-way
    roads to warn drivers not to pass other vehicles on the left.
- id: 146
  category: signs_and_signals
  question: What type of hazard or condition does a circular traffic sign alert drivers
    to?
  choices:
    A: Upcoming railroad crossings
    B: Slippery road conditions
    C: Sharp curves ahead
    D: Highway construction zones
  answer: A
  explanation: Circular traffic signs alert drivers to upcoming railroad crossings.
- id: 147
  category: signs_and_signals
  question: 'A five-sided traffic sign indicates that you are approaching:'
  choices:
    A: A stop intersection
    B: A yield intersection
    C: An area near a school where children may be crossing
    D: A no-passing zone
  answer: C
  explanation: Five-sided traffic signs warn drivers that they are entering an area
    near a school in which children may be crossing the road.
- id: 148
  category: vehicle_information
  question: A slow-moving vehicle emblem indicates that the vehicle cannot exceed
    what speed?
  choices:
    A: 15 miles per hour
    B: 20 miles per hour
    C: 25 miles per hour
    D: 30 miles per hour
  answer: C
  explanation: A slow-moving vehicle emblem has an orange, fluorescent center and
    red reflective borders, and indicates a slow-moving vehicle which cannot exceed
    25 miles per hour.
- id: 149
  category: signs_and_signals
  question: What colors make up a slow-moving vehicle emblem?
  choices:
    A: A yellow background with black borders
    B: An orange, fluorescent center and red reflective borders
    C: A red center with white reflective borders
    D: A fluorescent yellow-green center with black borders
  answer: B
  explanation: A slow-moving vehicle emblem has an orange, fluorescent center and
    red reflective borders.
- id: 150
  category: signs_and_signals
  question: What do orange traffic signs generally indicate?
  choices:
    A: Driver services and recreation areas
    B: Highway construction and maintenance zones
    C: School zones and pedestrian crossings
    D: Traffic regulations that must be obeyed immediately
  answer: B
  explanation: Orange highway construction traffic signs warn drivers to be careful
    when approaching construction zones.
- id: 151
  category: safe_driving_rules
  question: What should you do if you are approaching an intersection and facing a
    steady yellow light, but you are too close to stop safely?
  choices:
    A: Brake hard and stop in the intersection
    B: Speed up to beat the red light
    C: You may complete your movement through the intersection
    D: Pull over to the right side of the road immediately
  answer: C
  explanation: If you are facing a steady yellow light, your right of way is ending.
    If you are approaching the intersection and are too close to stop safely, you
    may complete your movement.
- id: 152
  category: safe_driving_rules
  question: When turning left at an intersection with a green light displayed without
    an arrow, how many vehicles may move into the intersection at a time to turn?
  choices:
    A: As many as can fit
    B: Only one vehicle at a time
    C: Two vehicles at a time
    D: No vehicles may enter until the light turns red
  answer: B
  explanation: If you are facing a green light displayed without an arrow, you may
    turn through an intersection as long as the intersection is clear... Only one
    vehicle at a time may move into an intersection to turn left.
- id: 153
  category: safe_driving_rules
  question: What does a yellow flashing arrow for a turning movement mean?
  choices:
    A: You have the right of way and oncoming traffic must yield
    B: You may proceed with the turn only after yielding to pedestrians and oncoming
      traffic
    C: You must come to a complete stop and wait for a green arrow
    D: The intersection is closed to turning traffic
  answer: B
  explanation: A yellow flashing arrow for a turning movement means that you may proceed
    with the turn only after you have yielded the right of way to pedestrians and
    oncoming traffic.
- id: 154
  category: safe_driving_rules
  question: Under what condition are you permitted to turn left through an intersection
    with a solid red light?
  choices:
    A: When turning from a two-way street onto a one-way street
    B: When turning from a one-way street onto a two-way street
    C: When turning from a one-way street onto a one-way street
    D: You are never permitted to turn left on a red light
  answer: C
  explanation: You may turn left through an intersection with a red light or arrow
    if you are turning from a one-way street onto a one-way street.
- id: 155
  category: safe_driving_rules
  question: Which of the following is a requirement before making a permissible right
    turn on a red light?
  choices:
    A: Slow down to 5 mph before turning
    B: Come to a full stop and check for vehicles and pedestrians
    C: Honk your horn to warn cross traffic
    D: Turn on your hazard lights
  answer: B
  explanation: To turn right through an intersection with a red light or arrow, when
    permissible, you must come to a full stop, check to make sure that there are no
    vehicles and pedestrians in the path of your turn or about to enter the path of
    your turn...
- id: 156
  category: signs_and_signals
  question: What should you do when approaching an intersection with a yellow flashing
    light displayed without an arrow?
  choices:
    A: Come to a complete stop and wait for a green light
    B: Treat the intersection as a four-way stop
    C: Slow down and use caution when traveling through the intersection
    D: Accelerate to clear the intersection quickly
  answer: C
  explanation: A yellow flashing light displayed without an arrow at an intersection
    means that you should slow down and use caution when traveling through an intersection.
- id: 157
  category: signs_and_signals
  question: What does an equilateral triangle traffic sign indicate?
  choices:
    A: Warns drivers to slow down and be prepared to come to a complete stop to yield
    B: Indicates a school zone is ahead
    C: Alerts drivers to an upcoming railroad crossing
    D: Marks the beginning of a no-passing zone
  answer: A
  explanation: Traffic signs with three sides of equal length warn drivers to slow
    down when approaching an intersection, and to be prepared to come to a complete
    stop in order to yield to other drivers or pedestrians.
- id: 158
  category: signs_and_signals
  question: What is the purpose of a supplemental plaque added to the bottom of a
    stop sign?
  choices:
    A: To indicate the speed limit of the cross street
    B: To indicate directions in which the intersection must stop
    C: To warn of a nearby school zone
    D: To provide distance to the next town
  answer: B
  explanation: Supplemental plaques are sometimes added to the bottom of stop signs
    to indicate directions in which the intersection must stop.
- id: 159
  category: signs_and_signals
  question: What does a yellow flashing light displayed without an arrow at an intersection
    mean?
  choices:
    A: Stop and wait for a green light.
    B: Slow down and use caution when traveling through the intersection.
    C: You have the right-of-way and do not need to slow down.
    D: The traffic signal is broken and should be treated as a four-way stop.
  answer: B
  explanation: According to the manual, a yellow flashing light displayed without
    an arrow means that you should slow down and use caution when traveling through
    an intersection.
- id: 160
  category: signs_and_signals
  question: If you and another driver arrive at a red flashing light at the same time
    at an intersection where all traffic is required to stop, who must yield the right-of-way?
  choices:
    A: The vehicle on the right.
    B: The vehicle on the left.
    C: The vehicle traveling faster.
    D: The vehicle turning right.
  answer: B
  explanation: The manual states that if you arrive at the same time as another driver
    at an intersection where all traffic is required to stop, the vehicle on the left
    shall yield the right-of-way.
- id: 161
  category: vehicle_information
  question: Under what condition may a person operating a motorcycle proceed through
    a steady red light that fails to change to green?
  choices:
    A: After coming to a complete stop for at least two minutes and exercising due
      caution.
    B: After honking the horn and waiting 30 seconds.
    C: Only if there is a police officer present to direct traffic.
    D: Motorcycles are never allowed to proceed through a steady red light.
  answer: A
  explanation: Operators of motorcycles and motor driven cycles approaching an intersection
    controlled by a traffic signal may proceed through a steady red light if the operator
    comes to a complete stop for at least two minutes and exercises due caution.
- id: 162
  category: vehicle_information
  question: Does the rule allowing motorcycles to proceed through a steady red light
    after waiting two minutes apply to autocycles?
  choices:
    A: Yes, autocycles follow all motorcycle rules.
    B: Yes, but they must wait three minutes instead of two.
    C: No, this rule does not apply to autocycles.
    D: No, autocycles must treat all red lights as yield signs.
  answer: C
  explanation: The manual explicitly states that the rule allowing operators to avoid
    prolonged waits at red lights by waiting two minutes does not apply to autocycles.
- id: 163
  category: signs_and_signals
  question: How should you proceed when approaching an intersection with a non-operating
    traffic signal?
  choices:
    A: Proceed through the intersection without stopping if the road is clear.
    B: Stop before entering the intersection and yield to vehicles that arrived before
      you or are to your right.
    C: Treat the intersection as a yield sign and slow down.
    D: Wait until a traffic enforcement officer arrives to direct traffic.
  answer: B
  explanation: If approaching an intersection with a non-operating signal, you should
    stop before entering and proceed with caution after yielding to cross-traffic,
    vehicles that stopped before you, vehicles that arrived at the same time on your
    right, and pedestrians.
- id: 164
  category: signs_and_signals
  question: What does a pedestrian hybrid beacon display immediately after a pedestrian
    activates it?
  choices:
    A: A steady red light.
    B: A flashing yellow light.
    C: A steady yellow light.
    D: Two flashing red lights.
  answer: B
  explanation: Once activated by a pedestrian, the pedestrian hybrid beacon will display
    a flashing yellow light to allow drivers to clear the crossing.
- id: 165
  category: safe_driving_rules
  question: What do yellow lane markings indicate on a roadway?
  choices:
    A: They separate multiple lanes of traffic going in the same direction.
    B: They indicate a bus or transit lane.
    C: They separate multiple lanes of traffic going in opposite directions.
    D: They indicate a pedestrian crossing zone.
  answer: C
  explanation: According to the manual, yellow lane markings separate multiple lanes
    of traffic going in opposite directions.
- id: 166
  category: safe_driving_rules
  question: When passing another vehicle, how much distance must you leave before
    returning to the right side of the road in front of an oncoming vehicle?
  choices:
    A: No less than 50 feet.
    B: No less than 100 feet.
    C: No less than 200 feet.
    D: No less than 500 feet.
  answer: B
  explanation: You must return to the right side of the road no less than 100 feet
    before any oncoming vehicle when passing.
- id: 167
  category: defensive_driving
  question: What should you do to check your blind spot before changing lanes?
  choices:
    A: Rely entirely on your rearview mirror.
    B: Briefly turn your head toward the lane that you are entering.
    C: Honk your horn to alert vehicles in your blind spot.
    D: Flash your headlights twice.
  answer: B
  explanation: When changing lanes, you should briefly turn your head toward the lane
    that you are entering to make sure that there is no vehicle in your blind spot.
- id: 168
  category: safe_driving_rules
  question: In which of the following situations is it dangerous and illegal to pass
    another vehicle?
  choices:
    A: When driving on a road with a broken yellow line.
    B: Within 100 feet of an intersection, railroad crossing, bridge, viaduct, or
      tunnel.
    C: When the vehicle ahead is traveling below the speed limit.
    D: On a multi-lane highway with broken white lines.
  answer: B
  explanation: It is dangerous and illegal to try to pass other vehicles within 100
    feet of an intersection, railroad crossing, bridge, viaduct, or tunnel.
- id: 169
  category: sharing_the_road
  question: What should you do if another vehicle is passing you on the left-hand
    side of the road?
  choices:
    A: Increase your speed to prevent them from passing.
    B: Move into the left lane to block them.
    C: Allow the other vehicle to pass safely and do not increase your speed.
    D: Honk your horn to warn them of oncoming traffic.
  answer: C
  explanation: If another vehicle is passing you on the left-hand side of the road,
    allow the other vehicle to pass safely and do not increase your speed.
- id: 170
  category: safe_driving_rules
  question: What is the proper lane position when preparing to make a right turn?
  choices:
    A: The far-left lane for your direction of travel.
    B: The center lane.
    C: The far-right lane for your direction of travel.
    D: Any lane, as long as you use your turn signal.
  answer: C
  explanation: To turn right, be in the far-right lane for your direction of travel.
- id: 171
  category: signs_and_signals
  question: What does a bicycle signal displaying a yellow bicycle symbol indicate
    to a bicyclist?
  choices:
    A: The right-of-way is ending.
    B: Proceed with caution.
    C: Yield to pedestrians.
    D: The bicycle lane is ending.
  answer: A
  explanation: As with vehicular signals, a yellow bicycle signal means the right-of-way
    is ending.
- id: 172
  category: signs_and_signals
  question: What type of signal controls a bus or transit lane and is only applicable
    to bus or transit operators?
  choices:
    A: A signal displaying a yellow triangle.
    B: A signal displaying white rectangular bars.
    C: A signal displaying a flashing red circle.
    D: A signal displaying a green arrow.
  answer: B
  explanation: A signal that displays white rectangular bars controls a bus or transit
    lane and is only applicable to bus or transit operators.
- id: 173
  category: safe_driving_rules
  question: Where should you stop if you are approaching a stop sign at an intersection
    that does not have a stop line or a crosswalk?
  choices:
    A: At the edge of the intersecting roadway.
    B: Before entering the intersection.
    C: Ten feet before the stop sign.
    D: In the middle of the intersection to check for traffic.
  answer: B
  explanation: If there is no stop line and no crosswalk, you should come to a complete
    stop before entering the intersection.
- id: 174
  category: driver_testing
  question: Are you allowed to use hand signals during a driving skills exam?
  choices:
    A: Yes, but only if your lighted signals are malfunctioning.
    B: Yes, hand signals are preferred over lighted signals.
    C: No, you may not use hand signals on a driving skills exam.
    D: Yes, as long as you use them well before the turn.
  answer: C
  explanation: According to the manual, you may not use hand signals on a driving
    skills exam.
- id: 175
  category: safe_driving_rules
  question: What is the proper use of a specially-designated center lane?
  choices:
    A: Passing slower vehicles
    B: Making left turns only
    C: Making right turns only
    D: Parking in an emergency
  answer: B
  explanation: Busy roads often have a center lane designated solely for left-turning
    vehicles. You should never use this type of center lane for passing other vehicles.
- id: 176
  category: safe_driving_rules
  question: Where is it explicitly prohibited to make a U-turn?
  choices:
    A: At a median U-turn intersection
    B: On a county road
    C: On an interstate highway
    D: In an urban residential area
  answer: C
  explanation: The manual states to never make a U-turn on an interstate highway.
    Instead, proceed to the next exit and re-enter the highway in the opposite direction.
- id: 177
  category: safe_driving_rules
  question: If two vehicles arrive at an all-way stop at the same time, which vehicle
    must yield the right-of-way?
  choices:
    A: The vehicle on the right
    B: The vehicle on the left
    C: The larger vehicle
    D: The vehicle traveling faster
  answer: B
  explanation: If you arrive at an all-way stop sign at the same time as another driver,
    the vehicle on the left shall yield the right-of-way.
- id: 178
  category: safe_driving_rules
  question: In which direction does traffic proceed in a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: Both clockwise and counterclockwise
    D: In a straight line
  answer: B
  explanation: A roundabout is a circular intersection in which traffic enters or
    exits only through right turns and proceeds in a counterclockwise direction.
- id: 179
  category: sharing_the_road
  question: If two large trucks are approaching or driving through a roundabout at
    the same time, what must happen?
  choices:
    A: The driver in the left lane must yield to the driver in the right lane.
    B: The driver in the right lane must yield to the driver in the left lane.
    C: Both trucks must stop and wait for a police officer.
    D: The truck carrying heavier cargo has the right-of-way.
  answer: B
  explanation: If two large trucks are approaching or driving through a roundabout
    at the same time, the driver in the right lane must yield the right of way to
    the driver in the left lane.
- id: 180
  category: safe_driving_rules
  question: What is the maximum speed limit for passenger vehicles on a rural interstate
    highway?
  choices:
    A: 55 miles per hour
    B: 60 miles per hour
    C: 65 miles per hour
    D: 70 miles per hour
  answer: D
  explanation: On rural interstate highways, passenger vehicles may not exceed 70
    miles per hour or the posted speed limit.
- id: 181
  category: safe_driving_rules
  question: What is the maximum speed limit in alleys?
  choices:
    A: 10 miles per hour
    B: 15 miles per hour
    C: 20 miles per hour
    D: 25 miles per hour
  answer: B
  explanation: In alleys, vehicles may not exceed 15 miles per hour or the posted
    speed limit.
- id: 182
  category: defensive_driving
  question: What is a good rule for drivers to follow regarding following distance?
  choices:
    A: Stay at least one second behind the vehicle ahead
    B: Stay at least two to three seconds behind the vehicle ahead
    C: Stay at least four to five seconds behind the vehicle ahead
    D: Stay at least one car length behind the vehicle ahead for every 10 mph
  answer: B
  explanation: A good rule for drivers to follow is to stay at least two to three
    seconds behind the vehicle ahead.
- id: 183
  category: safe_driving_rules
  question: How do work site speed limits compare to the maximum established speed
    limit for the area?
  choices:
    A: They are at least 5 miles per hour below the maximum established speed limit.
    B: They are at least 10 miles per hour below the maximum established speed limit.
    C: They are at least 15 miles per hour below the maximum established speed limit.
    D: They are the same as the maximum established speed limit.
  answer: B
  explanation: Work site speed limits are always at least 10 miles per hour below
    the maximum established speed limit for the area.
- id: 184
  category: signs_and_signals
  question: How does a traffic circle differ from a roundabout?
  choices:
    A: A traffic circle only has counterclockwise traffic.
    B: A traffic circle is always controlled by traffic lights.
    C: A traffic circle may have clockwise and counterclockwise traffic and may be
      controlled by stop signs.
    D: A traffic circle is only found in rural areas.
  answer: C
  explanation: A traffic circle differs from a roundabout in that it may have clockwise
    and counterclockwise traffic, and its approaches may be controlled by stop signs
    instead of yield signs.
- id: 185
  category: defensive_driving
  question: Which of the following is a factor that affects a vehicle's ability to
    stop?
  choices:
    A: The color of the vehicle
    B: The type and condition of the tires
    C: The time of day
    D: The number of passengers in the vehicle
  answer: B
  explanation: Many factors affect a vehicle's ability to stop, including the weight
    of the vehicle, type and condition of brakes and tires, physical condition and
    slickness of the pavement, and the grade of the road.
- id: 186
  category: sharing_the_road
  question: What is the maximum speed limit for a truck with a declared gross vehicle
    weight greater than 26,000 pounds on a rural interstate highway?
  choices:
    A: 55 miles per hour
    B: 60 miles per hour
    C: 65 miles per hour
    D: 70 miles per hour
  answer: C
  explanation: On rural interstate highways, trucks that have a declared gross vehicle
    weight greater than 26,000 pounds may not exceed 65 miles per hour or the posted
    speed limit.
- id: 187
  category: defensive_driving
  question: If your vehicle begins to skid and is equipped with an anti-lock brake
    system (ABS), what should you do?
  choices:
    A: Pump the brakes rapidly
    B: Keep your foot on the brake pedal with firm and continuous pressure
    C: Slam on the brakes and turn the steering wheel sharply
    D: Apply the parking brake immediately
  answer: B
  explanation: If your vehicle has an anti-lock brake system (ABS), keep your foot
    on the brake pedal, maintaining firm and continuous pressure, while steering normally.
    Do not pump the brakes.
- id: 188
  category: defensive_driving
  question: What is the proper maneuvering technique if your vehicle leaves the roadway?
  choices:
    A: Turn back onto the pavement immediately
    B: Slam on the brakes and steer sharply
    C: Ease up on the gas pedal and gradually turn back when safe
    D: Accelerate to regain traction before turning back
  answer: C
  explanation: If your vehicle leaves the roadway, do not turn back onto the pavement
    right away. Ease up on the gas pedal. When it's safe to do so, gradually turn
    back onto the road.
- id: 189
  category: vehicle_information
  question: How does traveling at 75 miles per hour affect fuel consumption compared
    to traveling at 55 miles per hour for passenger cars and light trucks?
  choices:
    A: It uses approximately 10 percent more fuel
    B: It uses approximately 25 percent more fuel
    C: It uses approximately 50 percent more fuel
    D: It uses approximately 75 percent more fuel
  answer: C
  explanation: Fuel consumption increases steadily above 45 miles per hour, with passenger
    cars and light trucks using approximately 50 percent more fuel traveling at 75
    miles per hour than at 55 miles per hour.
- id: 190
  category: vehicle_information
  question: Where should you look to find your vehicle's recommended tire pressure
    (psi)?
  choices:
    A: On the tire's sidewall
    B: On a sticker inside the driver's door jamb or the owner's manual
    C: On the vehicle's license plate
    D: On the engine block
  answer: B
  explanation: Compare the measured psi to the psi found on the sticker inside the
    driver's door of your vehicle or in owner's manual-DO NOT compare to the psi on
    your tire's sidewall.
- id: 191
  category: vehicle_information
  question: When using the penny test to check tire wear, what indicates that your
    tread is at a legal and safe depth?
  choices:
    A: Lincoln's head is completely visible
    B: Any part of Lincoln's head is covered by the tread
    C: The penny falls out of the groove
    D: The tread is exactly 1/32 of an inch deep
  answer: B
  explanation: If any part of Lincoln's head is covered by the tread, you're driving
    with the legal and safe amount of tread.
- id: 192
  category: safe_driving_rules
  question: During winter weather, which areas of the roadway are likely to freeze
    before other sections?
  choices:
    A: Intersections and crosswalks
    B: Rural dirt roads
    C: Ramps, bridges, and overpasses
    D: Multi-lane highways
  answer: C
  explanation: Be aware that moisture on ramps, bridges, and overpasses may occasionally
    freeze before other sections of the driving roadway.
- id: 193
  category: defensive_driving
  question: What causes a vehicle to hydroplane on wet roads?
  choices:
    A: Traveling on a thin layer of oil, dirt, and water
    B: Driving with over-inflated tires
    C: Using high headlight beams in the rain
    D: Pumping the brakes too frequently
  answer: A
  explanation: When you are driving on wet roads, your vehicle is actually traveling
    on a thin layer of oil, dirt, and water which can lead to hydroplaning.
- id: 194
  category: defensive_driving
  question: What should you do after driving through water puddles to help dry your
    brakes?
  choices:
    A: Accelerate rapidly
    B: Shift into a lower gear
    C: Test your brakes by pumping them
    D: Apply the parking brake for a few seconds
  answer: C
  explanation: After driving through water puddles, test your brakes by pumping them.
    Doing so will help to dry them.
- id: 195
  category: safe_driving_rules
  question: Which headlight setting should you use when driving in fog?
  choices:
    A: High headlight beams
    B: Low headlight beams
    C: Parking lights only
    D: No headlights, only flashing emergency signals
  answer: B
  explanation: Do not use high headlight beams. Low headlight beams better illuminate
    the road and objects ahead.
- id: 196
  category: defensive_driving
  question: What is the safest course of action if your vehicle stalls in a flooded
    area?
  choices:
    A: Stay in the vehicle and wait for rescue
    B: Roll up the windows and lock the doors
    C: Abandon the vehicle as soon as possible
    D: Attempt to restart the engine repeatedly
  answer: C
  explanation: If your car stalls in a flooded area, abandon it as soon as possible,
    because flood waters can rise rapidly and sweep a car and its occupants away.
- id: 197
  category: defensive_driving
  question: How can you avoid the glare of oncoming headlights when driving at night?
  choices:
    A: Look directly at the oncoming vehicle's headlights
    B: Focus on the right side of the road
    C: Turn on your high beams to counter the glare
    D: Close one eye until the vehicle passes
  answer: B
  explanation: To avoid glare, do not look directly into the lights of an approaching
    vehicle, and instead focus on the right side of the road.
- id: 198
  category: safe_driving_rules
  question: When are drivers required to use their headlights?
  choices:
    A: Only between 10 PM and 6 AM
    B: Between sunset and sunrise or when visibility is less than 500 feet
    C: Only when driving on unlit rural roads
    D: Between sunrise and sunset or when visibility is less than 1,000 feet
  answer: B
  explanation: Drivers must use headlights between sunset and sunrise as well as at
    any other time in which visibility is less than 500 feet.
- id: 199
  category: safe_driving_rules
  question: When must you use your lower headlight beams?
  choices:
    A: Within 500 feet of an oncoming vehicle or 200 feet of the rear of another vehicle
    B: Within 1,000 feet of an oncoming vehicle or 500 feet of the rear of another
      vehicle
    C: Within 200 feet of an oncoming vehicle or 100 feet of the rear of another vehicle
    D: Only when driving in city limits
  answer: A
  explanation: When headlights are on, lower headlight beams must be used when approaching
    within 500 feet of an oncoming vehicle or when following within 200 feet of the
    rear of another vehicle.
- id: 200
  category: vehicle_information
  question: According to the manual, what is the most important factor in reducing
    the chance of a rollover?
  choices:
    A: Avoiding rural roads entirely
    B: Maintaining your tires properly
    C: Driving a vehicle with a low center of gravity
    D: Never driving above 45 miles per hour
  answer: B
  explanation: Improperly inflated and worn tires inhibit your ability to maintain
    vehicle control, which is the most important factor in reducing the chance of
    rollover.
- id: 201
  category: safe_driving_rules
  question: When must drivers use their headlights according to Indiana law?
  choices:
    A: Between sunset and sunrise or when visibility is less than 500 feet
    B: Only when driving on unlit rural roads
    C: Between 8:00 PM and 6:00 AM
    D: Whenever driving at speeds over 55 mph
  answer: A
  explanation: Drivers must use headlights between sunset and sunrise as well as at
    any other time in which visibility is less than 500 feet.
- id: 202
  category: safe_driving_rules
  question: When following another vehicle, at what distance must you lower your headlight
    beams?
  choices:
    A: Within 100 feet
    B: Within 200 feet
    C: Within 300 feet
    D: Within 500 feet
  answer: B
  explanation: Lower headlight beams must be used when approaching within 500 feet
    of an oncoming vehicle or when following within 200 feet of the rear of another
    vehicle.
- id: 203
  category: alcohol_drugs_health
  question: Studies show that going 18 hours without sleep leaves a driver equally
    impaired to a driver with a Blood Alcohol Content (BAC) of what level?
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: Studies have shown that going 18 hours without sleep leaves a driver
    equally impaired to a driver with a .08 Blood Alcohol Content (BAC), which is
    the legal alcohol limit.
- id: 204
  category: driver_responsibility
  question: Which age group is at the highest risk for fatigue-related accidents,
    accounting for 64 percent of them?
  choices:
    A: 16-29
    B: 30-45
    C: 46-60
    D: 61 and older
  answer: A
  explanation: Although anyone can make the fatal mistake of driving without adequate
    rest, young adults ages 16-29 are at the highest risk, accounting for 64 percent
    of fatigue-related accidents.
- id: 205
  category: safe_driving_rules
  question: What is the only legal exception for using a handheld telecommunications
    device while operating a motor vehicle in Indiana?
  choices:
    A: Checking a GPS navigation map
    B: Reading an urgent text message
    C: Contacting 911 for a bona fide emergency
    D: Making a phone call while stopped at a red light
  answer: C
  explanation: The only exceptions to this prohibition are when hands-free communication
    is enabled or if the telecommunications device is being used to contact 911 for
    a bona fide emergency.
- id: 206
  category: defensive_driving
  question: Sending or reading a text takes your eyes off the road for five seconds.
    At 55 mph, this is equivalent to driving what distance blindfolded?
  choices:
    A: The length of a basketball court
    B: The length of an entire football field
    C: One full mile
    D: 500 feet
  answer: B
  explanation: Sending or reading a text takes your eyes off the road for five seconds.
    At 55 mph, that’s like driving the length of an entire football field with your
    eyes closed.
- id: 207
  category: penalties_and_points
  question: Under Indiana law, a person engages in aggressive driving if they commit
    at least how many specific unsafe actions during one episode of continuous driving?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: According to Indiana law, a person engages in aggressive driving if,
    during one episode of continuous driving of a vehicle, the person does or commits
    at least three of the following [unsafe actions].
- id: 208
  category: defensive_driving
  question: Why is stopping and turning more difficult on loose gravel roads?
  choices:
    A: Gravel roads are usually wider than paved roads
    B: Your traction is reduced, which can cause skidding
    C: Gravel roads always have higher speed limits
    D: The dust completely blocks your view of the road
  answer: B
  explanation: Stopping and turning is more difficult on loose gravel because your
    traction is reduced. When traction is reduced, skidding can occur.
- id: 209
  category: safe_driving_rules
  question: What should you do before approaching the crest of a steep hill on a rural
    road?
  choices:
    A: Speed up to maintain momentum
    B: Move to the left side of the road
    C: Sound your horn continuously
    D: Slow down, move to the right side of the road, and watch for oncoming vehicles
  answer: D
  explanation: Before approaching the crest of a steep hill, slow down, move to the
    right side of the road, and watch for oncoming vehicles.
- id: 210
  category: safe_driving_rules
  question: What must you do if you miss your intended exit on an interstate highway?
  choices:
    A: Stop and carefully back up on the shoulder
    B: Make a U-turn across the median
    C: Drive to the next exit
    D: Stop in the right lane and wait for traffic to clear before reversing
  answer: C
  explanation: It is unsafe to back up on an interstate highway to reach a missed
    exit. If you miss an exit, you must drive to the next exit.
- id: 211
  category: sharing_the_road
  question: On an interstate highway with three or more lanes in one direction, where
    are trucks restricted to drive?
  choices:
    A: The left two lanes
    B: The center lane only
    C: The right two lanes
    D: Any lane they choose
  answer: C
  explanation: Trucks are restricted to the right lane on sections of interstate with
    two lanes in one direction and restricted to the right two lanes of interstate
    with three lanes or more in one direction.
- id: 212
  category: signs_and_signals
  question: What does a flashing arrow board in a work zone that does NOT indicate
    a direction mean?
  choices:
    A: You must immediately move to the left lane
    B: You must immediately move to the right lane
    C: It is a signal to use caution, but does not require moving to another lane
    D: The road is completely closed ahead
  answer: C
  explanation: A flashing arrow board not indicating a direction either way is a signal
    to use caution but does not require a driver to move to another lane.
- id: 213
  category: signs_and_signals
  question: What must you do when a flagger at a work site extends a fluorescent orange/red
    flag in a horizontal position into the line of traffic?
  choices:
    A: Proceed at your current speed
    B: Stop
    C: Move to the left lane
    D: Honk your horn and proceed slowly
  answer: B
  explanation: You must stop when a flagger extends a fluorescent orange/red flag
    in a horizontal position into the line of traffic.
- id: 214
  category: safe_driving_rules
  question: At what distance must certain vehicles, such as school buses, stop from
    the nearest rail at a railroad crossing?
  choices:
    A: Not closer than 10 feet or farther than 30 feet
    B: Not closer than 15 feet or farther than 50 feet
    C: Not closer than 20 feet or farther than 100 feet
    D: Exactly 25 feet
  answer: B
  explanation: Some vehicles are required by law to always stop at railroad crossings
    not closer than 15 feet or farther than 50 feet from the nearest rail.
- id: 215
  category: signs_and_signals
  question: How should you treat a railroad crossbuck sign when it is displayed alone?
  choices:
    A: As a stop sign
    B: As a yield sign
    C: As a speed limit sign
    D: As a warning for a dead end
  answer: B
  explanation: When displayed alone, you should treat a crossbuck as a yield sign
    and the decision to stop or cross the tracks is yours.
- id: 216
  category: signs_and_signals
  question: What should you do when you approach a railroad crossing that has a crossbuck
    displayed alone?
  choices:
    A: Come to a complete stop regardless of whether a train is approaching.
    B: Treat it as a yield sign and stop if a train is approaching.
    C: Speed up to clear the tracks as quickly as possible.
    D: Honk your horn and proceed without slowing down.
  answer: B
  explanation: When displayed alone, you should treat a crossbuck as a yield sign
    and the decision to stop or cross the tracks is yours. You must stop if there
    is a train approaching.
- id: 217
  category: safe_driving_rules
  question: Which of the following vehicles are required to stop at all railroad crossings?
  choices:
    A: All vehicles carrying passengers for hire
    B: All pickup trucks
    C: All passenger cars
    D: All motorcycles
  answer: A
  explanation: Vehicles required to stop at all railroad crossings include all vehicles
    carrying passengers for hire, all school buses, and all vehicles carrying explosives
    or flammable liquids.
- id: 218
  category: safe_driving_rules
  question: It is illegal to pass another vehicle within how many feet of a railroad
    crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: 'The manual states: Do not pass another vehicle within 100 feet of
    a railroad crossing.'
- id: 219
  category: defensive_driving
  question: If your vehicle gets stuck on railroad tracks and a train is approaching,
    in which direction should you run after evacuating?
  choices:
    A: At a 45-degree angle away from the tracks in the direction of the oncoming
      train
    B: Straight down the tracks away from the train
    C: At a 90-degree angle directly away from the tracks
    D: At a 45-degree angle away from the tracks in the same direction the train is
      traveling
  answer: A
  explanation: In the event that you are stuck on the tracks, you should evacuate
    the area and run at a 45-degree angle away from the tracks in the direction of
    the oncoming train.
- id: 220
  category: safe_driving_rules
  question: Once the track crossing lights begin to flash and the gate begins to lower,
    approximately how much time do you have to escape from the crossing?
  choices:
    A: 10 seconds
    B: 20 seconds
    C: 30 seconds
    D: 45 seconds
  answer: B
  explanation: Once the track crossing lights begin to flash and the gate begins to
    lower, you have approximately 20 seconds to escape from the crossing.
- id: 221
  category: vehicle_information
  question: What is the maximum height of any vehicle that may be operated without
    a special permit in Indiana?
  choices:
    A: 12 feet, 6 inches
    B: 13 feet, 6 inches
    C: 14 feet
    D: 14 feet, 6 inches
  answer: B
  explanation: The maximum height of any vehicle that may be operated without a special
    permit is 13 feet, 6 inches.
- id: 222
  category: sharing_the_road
  question: Approximately how many feet does it take a fully loaded tractor-trailer
    with hot brakes to come to a complete stop when traveling at 55 miles per hour?
  choices:
    A: 130 to 140 feet
    B: 200 feet
    C: 300 feet
    D: More than 400 feet
  answer: D
  explanation: A fully loaded tractor-trailer with hot brakes may take more than 400
    feet to come to a complete stop, or more than the length of a football field.
- id: 223
  category: sharing_the_road
  question: How far behind a tractor-trailer can its rear blind spot extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 150 feet
    D: Up to 200 feet
  answer: D
  explanation: Blind spots for the tractor-trailer driver will be up to 20 feet in
    front of the cab, on either side of the trailer, alongside the cab, and up to
    200 feet behind the vehicle.
- id: 224
  category: sharing_the_road
  question: Why do tractor-trailers often stay in the center lane on multi-lane highways?
  choices:
    A: To drive faster than the posted speed limit.
    B: To help the flow of local traffic on and off the highway and increase options
      to avoid dangerous situations.
    C: Because it is illegal for them to drive in the right lane.
    D: To prevent passenger cars from passing them.
  answer: B
  explanation: On multi-lane highways, tractor-trailers stay in the center lane to
    help the flow of local traffic on and off the highway. Staying in the middle lane
    also increases the tractor-trailer driver's options if he or she has to switch
    lanes to avoid a dangerous situation.
- id: 225
  category: sharing_the_road
  question: When passing a tractor-trailer, on which side should you pass?
  choices:
    A: Always on the left side
    B: Always on the right side
    C: Whichever side has less traffic
    D: You should never pass a tractor-trailer
  answer: A
  explanation: Always pass a tractor-trailer completely and always on the left side.
    Lingering makes it impossible for the tractor-trailer driver to take evasive action.
- id: 226
  category: safe_driving_rules
  question: Under Indiana's Move Over Law, what must you do if you cannot move over
    to another lane when approaching an emergency vehicle with flashing lights?
  choices:
    A: Maintain your speed and proceed with caution.
    B: Reduce your speed to 10 mph under the posted limit and proceed with caution.
    C: Stop immediately in your lane.
    D: Speed up to pass the emergency vehicle quickly.
  answer: B
  explanation: If you cannot move over, the motorists shall reduce their speed to
    10 mph under the posted limit and proceed with caution.
- id: 227
  category: penalties_and_points
  question: 'Failure to comply with Indiana''s Move Over Law is considered a:'
  choices:
    A: Class A Misdemeanor
    B: Class B Infraction
    C: Class A Infraction
    D: Felony
  answer: C
  explanation: Motorists who approach an emergency vehicle displaying alternately
    flashing lights are required to change lanes or reduce speed. Failure to comply
    is a Class A Infraction.
- id: 228
  category: defensive_driving
  question: If your vehicle becomes disabled on a railroad crossing and no train is
    approaching, what is the first thing you should do?
  choices:
    A: Call a tow truck.
    B: Try to push the vehicle off the tracks yourself.
    C: Immediately call the Emergency Notification System (ENS) using the number on
      the blue sign.
    D: Flag down a passing motorist.
  answer: C
  explanation: If your vehicle becomes disabled on the crossing and no train is approaching,
    immediately call the Emergency Notification System (ENS). The phone number is
    located on the blue sign attached to the railroad track crossing gate.
- id: 229
  category: sharing_the_road
  question: When a tractor-trailer is making a tight turn, what should you expect?
  choices:
    A: The rear wheels will follow a wider path than the front wheels.
    B: The driver may swing out as the first step in making the turn.
    C: The vehicle will always turn from the center lane.
    D: The trailer will stop completely before turning.
  answer: B
  explanation: With any turning vehicle, the rear wheels follow a shorter path than
    the front wheels. Tractor-trailer drivers often swing out as the first step in
    making a tight turn.
- id: 230
  category: safe_driving_rules
  question: What should you avoid doing while driving across railroad tracks?
  choices:
    A: Looking both ways
    B: Stopping or shifting gears
    C: Turning on your headlights
    D: Using your windshield wipers
  answer: B
  explanation: Avoid stopping or shifting gears while crossing railroad tracks. A
    driver should never begin to cross railroad tracks unless the tracks can be cleared
    without stopping.
- id: 231
  category: penalties_and_points
  question: What is the penalty for failing to move over or reduce speed for an authorized
    emergency vehicle?
  choices:
    A: Class A Infraction
    B: Class B Infraction
    C: Class A Misdemeanor
    D: Level 6 Felony
  answer: A
  explanation: According to the manual, if a motorist cannot move over for an authorized
    emergency vehicle, they must reduce their speed to 10 mph under the posted limit.
    Failure to comply is a Class A Infraction.
- id: 232
  category: safe_driving_rules
  question: If you cannot change lanes to move away from an authorized parked vehicle
    with amber flashing lights, what action must you take?
  choices:
    A: Stop completely and wait for the vehicle to move
    B: Reduce your speed to 10 mph under the posted limit and proceed with caution
    C: Reduce your speed to 15 mph and proceed with caution
    D: Maintain your speed but honk your horn to alert the workers
  answer: B
  explanation: The manual states that if you cannot move over for an authorized parked
    vehicle with amber flashing lights, you shall reduce your speed to 10 mph under
    the posted limit and proceed with caution.
- id: 233
  category: safe_driving_rules
  question: When are you NOT required to stop for a school bus with flashing red lights
    and an extended stop arm?
  choices:
    A: When you are traveling in the opposite direction on a roadway divided by a
      barrier or unimproved median
    B: When you are traveling on a two-lane road in the opposite direction
    C: When you are traveling in the same direction as the bus on a divided highway
    D: When the school bus is stopped at a railroad crossing
  answer: A
  explanation: If you are driving on a roadway divided by a barrier or unimproved
    median, you are required to stop only if you are traveling in the same direction
    as the school bus.
- id: 234
  category: penalties_and_points
  question: What is the penalty for disregarding a school bus stop arm if the offense
    results in bodily injury?
  choices:
    A: Class A Infraction
    B: Class B Infraction
    C: Class A Misdemeanor
    D: Level 6 felony
  answer: D
  explanation: Disregarding a school bus stop arm can result in a Class A misdemeanor,
    but it becomes a Level 6 felony if the offense results in bodily injury.
- id: 235
  category: sharing_the_road
  question: How much following distance should you allow when driving behind a motorcycle?
  choices:
    A: One or two seconds
    B: At least three or four seconds
    C: Five or six seconds
    D: One car length for every 10 mph
  answer: B
  explanation: The manual advises to allow at least three or four seconds when following
    a motorcycle so the motorcyclist has enough time to maneuver or stop in an emergency.
- id: 236
  category: sharing_the_road
  question: Why should you wait to be sure a motorcyclist is going to turn before
    proceeding, even if their turn signal is flashing?
  choices:
    A: Motorcycles often have faulty wiring that causes random flashing
    B: Motorcycle turn signals are usually not self-canceling, and riders sometimes
      forget to turn them off
    C: Motorcyclists frequently change their minds about turning
    D: The law requires a mandatory five-second wait time before proceeding
  answer: B
  explanation: Do not assume that a flashing turn signal on a motorcycle means a turn
    is coming soon, because these vehicles have signals that are usually not self-canceling,
    and riders sometimes forget to turn them off.
- id: 237
  category: sharing_the_road
  question: What is the minimum safe amount of room a driver must leave when passing
    a bicyclist?
  choices:
    A: One foot
    B: Two feet
    C: Three feet
    D: Five feet
  answer: C
  explanation: Drivers may pass a bicyclist when there is a safe amount of room beside
    the bicyclist, which is a minimum of three feet.
- id: 238
  category: sharing_the_road
  question: What is the general rule regarding bicyclists riding abreast on roadways?
  choices:
    A: They must always ride single file
    B: They may ride up to three abreast
    C: They may not ride more than two abreast except on exclusive bicycle paths
    D: They can ride as many abreast as the lane width allows
  answer: C
  explanation: Bicyclists may not ride more than two (2) abreast except on paths or
    parts of roadways set aside for the exclusive use of bicycles.
- id: 239
  category: sharing_the_road
  question: When is a driver permitted to cross a bicycle path or lane?
  choices:
    A: When preparing for a turn 100 feet in advance
    B: When passing a slower motor vehicle
    C: Only when turning or when entering or leaving an alley, driveway, or private
      road
    D: Whenever the bicycle lane is clear of cyclists
  answer: C
  explanation: Drivers may cross a bicycle path or lane only when turning or when
    entering or leaving an alley, driveway, or private road.
- id: 240
  category: signs_and_signals
  question: What is the purpose of 'Sharrow' markings on the pavement?
  choices:
    A: To indicate a lane exclusively for bicycles
    B: To warn drivers of an upcoming pedestrian crossing
    C: To help cyclists position themselves away from parked cars and alert drivers
      to expect cyclists
    D: To mark a designated parking area for bicycles
  answer: C
  explanation: Sharrow markings are intended to help cyclists position themselves
    away from parked cars and to alert other road users to expect cyclists to occupy
    travel lanes.
- id: 241
  category: signs_and_signals
  question: What does red colored pavement indicate on a roadway?
  choices:
    A: A designated bicycle lane
    B: A lane designated for buses, taxis, or other modes of public transit
    C: A no-parking zone
    D: An upcoming stop sign or traffic signal
  answer: B
  explanation: Red colored pavement may be used to enhance the visibility of bus or
    transit lanes that are designated for buses, taxis, or other modes of public transit.
- id: 242
  category: safe_driving_rules
  question: If a law enforcement officer is directing traffic at an intersection and
    gives a command that contradicts a green traffic signal, what must you do?
  choices:
    A: Follow the traffic signal
    B: Obey the law enforcement officer's command
    C: Wait until the traffic signal turns red before moving
    D: Honk to alert the officer that you have a green light
  answer: B
  explanation: A law enforcement officer’s command may be different from a traffic
    signal or sign. In such a case, the law enforcement officer’s command is the one
    that must be obeyed.
- id: 243
  category: safe_driving_rules
  question: When beginning to parallel park, how far should you position your vehicle
    from the vehicle parked in front of the empty space?
  choices:
    A: At least one foot
    B: At least two feet
    C: At least three feet
    D: At least four feet
  answer: B
  explanation: When parallel parking, you should position your vehicle parallel with
    the vehicle parked in front of the empty space and maintain at least two feet
    from this vehicle.
- id: 244
  category: penalties_and_points
  question: What is the penalty for failing to move over or appropriately reduce speed
    for a disabled stationary vehicle with flashing hazard warning signals?
  choices:
    A: Class A Infraction
    B: Class B Infraction
    C: Class C Infraction
    D: Class A Misdemeanor
  answer: B
  explanation: Motorists who approach a disabled stationary vehicle with flashing
    hazard warning signals must move over or reduce speed to 10 mph under the limit.
    Failure to do so is a Class B Infraction.
- id: 245
  category: sharing_the_road
  question: Is a bicyclist required to ride in a designated bike lane if one is available?
  choices:
    A: Yes, they must always use the bike lane
    B: Yes, unless the bike lane is blocked by debris
    C: No, they have the right to use either the bike lane or the travel lane
    D: No, but only if they are traveling faster than 15 mph
  answer: C
  explanation: A bicyclist is not required to ride in a designated bike lane because
    the bicyclist has the right to use either the bike lane or the travel lane.
- id: 246
  category: safe_driving_rules
  question: How should you turn your vehicle's wheels when parking facing downhill?
  choices:
    A: Away from the curb
    B: Toward the curb
    C: Parallel to the curb
    D: Toward the street
  answer: B
  explanation: When you park facing downhill, turn your vehicle's wheels toward the
    curb.
- id: 247
  category: safe_driving_rules
  question: If you are parking facing uphill and there is no curb, which way should
    you turn your wheels?
  choices:
    A: Toward the street
    B: Parallel to the street
    C: Away from the street
    D: Straight ahead
  answer: C
  explanation: If there is no curb, turn your vehicle's wheels away from the street
    when parking facing uphill.
- id: 248
  category: safe_driving_rules
  question: What is the proper technique for reversing a vehicle?
  choices:
    A: Rely entirely on your rearview mirror
    B: Turn your body to the left to look out the side window
    C: Turn your body to the right to look through the back window
    D: Use only your side mirrors
  answer: C
  explanation: To reverse, turn your body to the right to look through the back window.
    Never use only the rearview mirror for reversing.
- id: 249
  category: safe_driving_rules
  question: Which of the following is an illegal parking area?
  choices:
    A: Within 15 feet of a fire hydrant
    B: Within 25 feet of a fire hydrant
    C: Within 50 feet of a railroad crossing
    D: Adjacent to a white curb
  answer: A
  explanation: Parking is prohibited within 15 feet of a fire hydrant or in fire lanes.
- id: 250
  category: sharing_the_road
  question: What traveling aids often indicate that a pedestrian is visually impaired?
  choices:
    A: A yellow jacket or reflective vest
    B: A white cane or a trained guide dog
    C: A red cane or a motorized wheelchair
    D: A flashing light or a walker
  answer: B
  explanation: Traveling aids for a person who is visually impaired are often a white
    cane or a trained guide dog.
- id: 251
  category: vehicle_information
  question: By what percentage do seat belts increase the chance of survival for drivers
    and front-seat passengers?
  choices:
    A: 25 percent
    B: 35 percent
    C: 45 percent
    D: 50 percent
  answer: C
  explanation: When worn, seat belts for drivers and front-seat passengers increase
    the chance of survival by 45 percent.
- id: 252
  category: safe_driving_rules
  question: How should a driver position themselves in relation to the steering wheel
    to maximize safety?
  choices:
    A: At least 6 inches away
    B: At least 10 inches away
    C: At least 12 inches away
    D: As close as comfortably possible
  answer: C
  explanation: To maximize safety, the driver should sit at least 12 inches away from
    the steering wheel.
- id: 253
  category: safe_driving_rules
  question: Which of the following individuals is exempt from wearing a seat belt?
  choices:
    A: A passenger in the back seat of a passenger car
    B: A driver of a commercial vehicle on a long-haul trip
    C: A newspaper motor route carrier who stops to make deliveries
    D: A teenager driving to school
  answer: C
  explanation: A newspaper motor route carrier or newspaper bundle hauler who stops
    to make deliveries from a vehicle is exempt from wearing a seat belt.
- id: 254
  category: driver_responsibility
  question: Under Indiana law, passengers younger than what age are required to be
    properly secured in a child restraint system?
  choices:
    A: Six years of age
    B: Seven years of age
    C: Eight years of age
    D: Ten years of age
  answer: C
  explanation: Passengers younger than eight years of age are required by law to be
    properly secured in a child restraint system such as a child car seat or booster
    seat.
- id: 255
  category: vehicle_information
  question: If a car is equipped with a passenger-side air bag, the National Safety
    Council recommends putting children younger than what age in the back seat?
  choices:
    A: 8 years of age
    B: 10 years of age
    C: 12 years of age
    D: 14 years of age
  answer: C
  explanation: If a car is equipped with an air bag on the passenger side, the National
    Safety Council recommends putting children younger than 12 years of age in the
    back seat.
- id: 256
  category: vehicle_information
  question: If a vehicle's load extends farther than four feet beyond the rear of
    the vehicle between sunrise and sunset, what must be mounted at the extreme rear
    end?
  choices:
    A: A red lamp visible from 500 feet
    B: A red flag not less than 12 square inches
    C: Two flashing yellow lights
    D: A "Wide Load" sign
  answer: B
  explanation: Between sunrise and sunset, a red flag must be mounted at the extreme
    rear end of the vehicle's load. The red flag must be not less than 12 square inches.
- id: 257
  category: defensive_driving
  question: If your car is disabled in the daytime, where must you display two red
    flags?
  choices:
    A: 50 feet in front and 50 feet behind the car
    B: 100 feet in front and 100 feet behind the car
    C: 200 feet in front and 200 feet behind the car
    D: On the roof and the trunk of the car
  answer: B
  explanation: 'In the daytime, drivers of disabled cars must display two red flags:
    one approximately 100 feet in front of the car and the other approximately 100
    feet behind it.'
- id: 258
  category: defensive_driving
  question: If your car is stopped within 500 feet of a curve or hilltop, at what
    distance must a warning device be displayed?
  choices:
    A: At least 100 feet from your car
    B: At least 200 feet from your car
    C: At least 300 feet from your car
    D: At least 500 feet from your car
  answer: D
  explanation: If your car is stopped within 500 feet of a curve, hilltop, or other
    obstruction, a warning device must be displayed at least 500 feet from your car.
- id: 259
  category: safe_driving_rules
  question: How should seat belts be worn on the body to maximize safety?
  choices:
    A: High on the stomach and under the arm
    B: Low on the hips and flat across the collar bone
    C: Loosely across the waist and neck
    D: High on the hips and across the chest
  answer: B
  explanation: Everyone should wear their seat belts low on the hips and flat across
    the collar bone.
- id: 260
  category: safe_driving_rules
  question: If your vehicle is disabled on a divided highway, how far from your vehicle
    must a warning device be placed?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: According to the manual, if your vehicle is disabled on a divided highway,
    the emergency warning device must be placed 200 feet from your vehicle.
- id: 261
  category: defensive_driving
  question: What is the most common factor in all collisions in Indiana?
  choices:
    A: Speeding
    B: Driving under the influence
    C: Failure to yield the right of way
    D: Distracted driving
  answer: C
  explanation: The manual states that among all collisions in Indiana, failure to
    yield the right of way is the most common factor.
- id: 262
  category: driver_responsibility
  question: Under which condition should you NOT move your vehicle off the highway
    after an accident?
  choices:
    A: If the accident occurs during rush hour traffic
    B: If the accident involves the transportation of hazardous materials
    C: If the vehicle has a flat tire
    D: If the other driver refuses to move their vehicle
  answer: B
  explanation: The driver should not move the motor vehicle if the accident involves
    the transportation of hazardous materials or results in injury, death, or entrapment.
- id: 263
  category: driver_responsibility
  question: What must you do if you collide with an unattended vehicle and cannot
    locate the owner?
  choices:
    A: Leave a note on the windshield and drive away
    B: Call a tow truck to remove the vehicle
    C: Call a law enforcement agency to provide information
    D: Wait at the scene for exactly one hour before leaving
  answer: C
  explanation: If the collision was with an unattended vehicle and the owner cannot
    be located, you must call a law enforcement agency in order to provide information.
- id: 264
  category: license_system
  question: After an accident, what document must your insurance provider electronically
    file to the BMV to prove financial responsibility?
  choices:
    A: Certificate of Compliance (COC)
    B: Proof of Liability (POL)
    C: Accident Report Form (ARF)
    D: Vehicle Registration Certificate (VRC)
  answer: A
  explanation: Your insurance provider must electronically file proof of financial
    responsibility in the form of a Certificate of Compliance (COC).
- id: 265
  category: defensive_driving
  question: If a collision is unavoidable, which of the following is the safest choice
    to minimize impact?
  choices:
    A: Hit something hard rather than something that will give way
    B: Hit something moving in the opposite direction
    C: Hit something that is not moving rather than something moving in the same direction
    D: Hit something moving in the same direction as you rather than something that
      is not moving
  answer: D
  explanation: The manual advises to hit something moving in the same direction as
    you rather than something that is not moving, and to choose to hit something that
    will give way.
- id: 266
  category: safe_driving_rules
  question: What is the correct action to take if your vehicle's wheels drift onto
    the shoulder of the road?
  choices:
    A: Turn the steering wheel sharply back toward the pavement
    B: Slam on the brakes to stop immediately
    C: Drive along the shoulder, ease up on the gas pedal, and turn back onto the
      road gradually
    D: Accelerate to safely merge back into traffic
  answer: C
  explanation: If your wheels drift onto the shoulder, do not try to turn back right
    away. Instead, drive along the shoulder and ease up on the gas pedal. After slowing
    down, turn back onto the road gradually.
- id: 267
  category: defensive_driving
  question: Why should you NOT attempt to open a door if your vehicle plunges into
    water?
  choices:
    A: It will cause the electrical system to short out immediately
    B: The weight of the water will make it nearly impossible, and water will flood
      the passenger compartment
    C: The door locks will automatically jam
    D: It will cause the vehicle to sink instantly
  answer: B
  explanation: The weight of the water will make it nearly impossible to open a door
    and water will flood the passenger compartment through an open door.
- id: 268
  category: alcohol_drugs_health
  question: Which of the following behaviors is a sign that a driver may be impaired?
  choices:
    A: Driving slightly below the speed limit in heavy rain
    B: Making wide turns and straddling the center line
    C: Using turn signals consistently
    D: Driving with headlights on during the day
  answer: B
  explanation: A driver may be impaired if the vehicle makes wide turns, straddles
    the center line, weaves, or exhibits other erratic behaviors.
- id: 269
  category: safe_driving_rules
  question: If you must exit your vehicle while on a roadside shoulder during an emergency,
    how should you do so?
  choices:
    A: Exit on the driver's side as quickly as possible
    B: Exit on the passenger side after checking the immediate vicinity
    C: Climb out through the sunroof to remain visible
    D: Wait until a police officer arrives to open the door
  answer: B
  explanation: If you must exit the vehicle while on a roadside shoulder, exit the
    vehicle on the passenger side and only after checking your immediate vicinity
    for other motor vehicles or obstructions.
- id: 270
  category: vehicle_information
  question: What should you do if you experience a tire blowout while driving?
  choices:
    A: Apply the brakes firmly and immediately
    B: Turn the steering wheel sharply to the right
    C: Hold the steering wheel firmly, take your foot off the gas pedal, and do not
      apply the brakes
    D: Shift into neutral and pump the brakes
  answer: C
  explanation: In a tire blowout, hold the steering wheel firmly and keep the car
    going straight. Slow down gradually, take your foot off the gas pedal, but do
    not apply the brakes until almost stopped.
- id: 271
  category: vehicle_information
  question: What is the first thing you should do if your vehicle's conventional disc
    or drum brakes suddenly fail?
  choices:
    A: Shift to a lower gear and pump the brake pedal fast and hard
    B: Turn off the ignition immediately
    C: Pull the parking brake up as hard as possible
    D: Steer into the nearest ditch
  answer: A
  explanation: If your brakes suddenly fail, you should shift to a lower gear, if
    possible, and pump the brake pedal fast and hard several times to build up brake
    pressure.
- id: 272
  category: safe_driving_rules
  question: If your vehicle is disabled within 500 feet of a curve or hill crest where
    a driver's view may be blocked, where should you place the emergency warning device?
  choices:
    A: 100 feet from your vehicle
    B: 200 feet from your vehicle
    C: At least 500 feet from your vehicle
    D: Directly on the roof of your vehicle
  answer: C
  explanation: If your vehicle is disabled within 500 feet of a curve, hill crest,
    or other area where a driver's view may be blocked, place the device at least
    500 feet from your vehicle.
- id: 273
  category: defensive_driving
  question: What should you do if your vehicle plunges into water and you need to
    escape?
  choices:
    A: Wait for the vehicle to fill completely with water before opening the door
    B: Remove your seat belt, open a window, and move to the roof
    C: Gather your valuable possessions before exiting
    D: Swim for shore immediately, even if emergency personnel are arriving
  answer: B
  explanation: If your vehicle plunges into water, remove your seat belt, open a window,
    exit the vehicle, and move to the roof. Never re-enter to gather possessions,
    and swim for shore only as a last resort.
- id: 274
  category: vehicle_information
  question: Why should you never turn the ignition to the lock position while your
    vehicle is in motion?
  choices:
    A: It will cause the engine to overheat.
    B: It will permanently damage the transmission.
    C: The steering will lock as the wheel is turned, causing a loss of control.
    D: The brakes will immediately lock up and cause a skid.
  answer: C
  explanation: When operating a vehicle with a steering wheel interlock system, turning
    the ignition to the lock position while moving will lock the steering as the wheel
    is turned, causing a loss of control of the vehicle.
- id: 275
  category: safe_driving_rules
  question: To help reduce the chances of your vehicle being stolen, how should you
    park your vehicle?
  choices:
    A: With the front wheels turned sharply to the left.
    B: With the front wheels turned sharply to the right and the emergency brake applied.
    C: With the windows slightly cracked for ventilation.
    D: With the vehicle in neutral and the emergency brake applied.
  answer: B
  explanation: To reduce the chances of vehicle theft, the manual recommends parking
    with the front wheels turned sharply to the right and applying the emergency brake.
- id: 276
  category: driver_responsibility
  question: How should you first acknowledge a law enforcement officer's presence
    when being pulled over?
  choices:
    A: By turning on your hazard lights immediately.
    B: By waving your hand out the window.
    C: By turning on your right turn signal.
    D: By honking your horn twice.
  answer: C
  explanation: You should acknowledge the officer's presence by turning on your right
    turn signal. This lets the officer know that you recognize their presence.
- id: 277
  category: safe_driving_rules
  question: When pulled over by law enforcement on a freeway, where should you stop
    your vehicle?
  choices:
    A: On the right-side shoulder of the road.
    B: In the center median.
    C: In the right-most travel lane.
    D: On the left-side shoulder of the road.
  answer: A
  explanation: You should move your vehicle to the right-side shoulder of the road.
    You must not stop in the center median of a freeway, as this places both the driver
    and the officer in danger.
- id: 278
  category: safe_driving_rules
  question: If you are being stopped by law enforcement at night, what are you encouraged
    to do?
  choices:
    A: Turn off your headlights.
    B: Turn on your high beams.
    C: Turn on the interior light of the vehicle.
    D: Step out of the vehicle so the officer can see you.
  answer: C
  explanation: If you are being stopped at night, you are encouraged to turn on the
    interior light of the vehicle and look for well-lit locations to pull over.
- id: 279
  category: safe_driving_rules
  question: What should you do if you cannot immediately find a safe place to pull
    over during a traffic stop?
  choices:
    A: Maintain your speed until a safe area appears.
    B: Slow down and turn on your hazard lights.
    C: Stop in the middle of the travel lane.
    D: Speed up to reach the next exit faster.
  answer: B
  explanation: If you cannot find a safe place immediately, slow down and turn on
    hazard lights. This indicates to the officer that you acknowledge their presence
    and are actively trying to find a safe place to stop.
- id: 280
  category: driver_responsibility
  question: During a traffic stop, where should the driver and passengers keep their
    hands?
  choices:
    A: The driver should keep hands on the steering wheel and passengers' hands should
      be visible on their laps.
    B: Everyone should hold their hands up in the air.
    C: Hands should be kept in pockets or out of sight.
    D: The driver should reach for the glove box immediately.
  answer: A
  explanation: The driver should keep their hands on the steering wheel and passenger
    hands should be visible on their laps. An inability to see hands can cause the
    officer to feel threatened.
- id: 281
  category: driver_responsibility
  question: If your proof of insurance is stored on your cellphone during a traffic
    stop, what should you do?
  choices:
    A: Quickly grab your phone before the officer approaches.
    B: Hand the phone out the window as the officer walks up.
    C: Inform the police officer of that fact first, then follow their directions
      before retrieving it.
    D: Refuse to show it, as officers cannot look at cellphones.
  answer: C
  explanation: If proof of insurance is stored on a cellphone, you should first inform
    the police officer of that fact and then follow the officer's directions before
    reaching to retrieve the information.
- id: 282
  category: penalties_and_points
  question: What does signing a traffic ticket issued by a police officer mean?
  choices:
    A: It is an admission of your guilt.
    B: It waives your right to a trial in traffic court.
    C: It is only an acknowledgment of receiving the ticket.
    D: It means you agree with the reason for the stop.
  answer: C
  explanation: Signing a ticket is not an admission of the driver's guilt, but only
    an acknowledgment of receiving the ticket.
- id: 283
  category: alcohol_drugs_health
  question: Which of the following is a symptom of carbon monoxide poisoning?
  choices:
    A: A strong smell of exhaust in the cabin.
    B: Increased sensitivity to light.
    C: A sudden burst of energy.
    D: A reddish tinge to your skin or lips.
  answer: B
  explanation: Symptoms of carbon monoxide poisoning can include drowsiness or dizziness,
    a bluish tinge to your skin or lips, a headache, and increased sensitivity to
    light. You cannot see, smell, or taste carbon monoxide.
- id: 284
  category: safe_driving_rules
  question: How can you help avoid carbon monoxide poisoning when driving in congested
    traffic?
  choices:
    A: Open all the windows fully.
    B: Turn on the vehicle's heater to maximum.
    C: Close the fresh-air vent.
    D: Open the fresh-air vent.
  answer: C
  explanation: To avoid carbon monoxide poisoning in congested traffic, you should
    close the fresh-air vent so exhaust fumes from other vehicles are not breathed
    in.
- id: 285
  category: signs_and_signals
  question: According to the manual's traffic rules, when may a legal left turn be
    made at a red light?
  choices:
    A: When there are no other vehicles present.
    B: When turning from a one-way street onto another one-way street.
    C: When another driver sounds their horn.
    D: Never.
  answer: B
  explanation: A legal left turn at a red light may be made when the driver is turning
    from a one-way street onto another one-way street.
- id: 286
  category: sharing_the_road
  question: How far may a fully loaded tractor-trailer with hot brakes traveling at
    55 mph take to stop?
  choices:
    A: 50 feet or more.
    B: 100 feet or more.
    C: 200 feet or more.
    D: 400 feet or more.
  answer: D
  explanation: A fully loaded tractor-trailer with hot brakes traveling at fifty-five
    (55) mph may take 400 feet or more to stop.
- id: 287
  category: safe_driving_rules
  question: According to Indiana law, during what period of time must a vehicle have
    its headlights turned on?
  choices:
    A: Between sunset and sunrise when visibility is less than 500 feet
    B: Between 6:30 p.m. and 6:30 a.m.
    C: Whenever the driver is tired
    D: Only when driving on unlit rural roads
  answer: A
  explanation: Indiana law requires a vehicle to have its headlights turned on between
    sunset and sunrise when visibility is less than 500 feet.
- id: 288
  category: safe_driving_rules
  question: If the road you will be turning from has more than one lane, which lane
    should you turn from?
  choices:
    A: The middle lane
    B: The lane farthest to the direction you will be turning
    C: The lane nearest to the direction you will be turning
    D: Any lane as long as you use your turn signal
  answer: C
  explanation: If turning from a road with more than one lane, you should turn from
    the lane nearest to the direction you will be turning.
- id: 289
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit on a rural state divided
    highway?
  choices:
    A: 50 miles per hour
    B: 55 miles per hour
    C: 60 miles per hour
    D: 65 miles per hour
  answer: C
  explanation: Unless otherwise posted, the speed limit on a rural state divided highway
    is 60 miles per hour.
- id: 290
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit for a passenger
    vehicle on an interstate located outside of an urbanized area?
  choices:
    A: 55 miles per hour
    B: 60 miles per hour
    C: 65 miles per hour
    D: 70 miles per hour
  answer: D
  explanation: The maximum speed limit for a passenger vehicle on an interstate located
    outside of an urbanized area is 70 miles per hour, unless otherwise posted.
- id: 291
  category: safe_driving_rules
  question: When driving at night, you must use low beam headlights when following
    another vehicle within what distance?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: When driving at night, low beam headlights must be used when following
    a vehicle within 200 feet.
- id: 292
  category: safe_driving_rules
  question: When driving at night, lower headlight beams must be used when approaching
    oncoming traffic within what distance?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: Lower headlight beams must be used when approaching oncoming traffic
    within 500 feet.
- id: 293
  category: defensive_driving
  question: What should you do in a situation with a flat tire or tire blowout?
  choices:
    A: Apply the brakes right away
    B: Hold the steering wheel firmly and keep the car going straight
    C: Increase your driving speed
    D: Continue driving on the rim until the destination is reached
  answer: B
  explanation: In a situation with a flat tire or tire blowout, you should hold the
    steering wheel firmly and keep the car going straight.
- id: 294
  category: license_system
  question: If you are transporting property for hire with a for-hire endorsement,
    what is the vehicle's gross vehicle weight limit?
  choices:
    A: It must not exceed 16,000 pounds
    B: It must not exceed 26,000 pounds
    C: It must exceed 26,000 pounds
    D: It must exceed 28,000 pounds
  answer: B
  explanation: When transporting property for hire with a for-hire endorsement, the
    vehicle's gross weight must not exceed 26,000 pounds.
- id: 295
  category: safe_driving_rules
  question: Vehicles carrying passengers for hire are required to stop within how
    many feet of railroad tracks?
  choices:
    A: 5 to 45 feet
    B: 10 to 40 feet
    C: 15 to 50 feet
    D: 20 to 60 feet
  answer: C
  explanation: Vehicles carrying passengers for hire must stop within 15 to 50 feet
    of railroad tracks.
- id: 296
  category: vehicle_information
  question: Which of the following is an acceptable warning device for a truck, bus,
    or tractor-trailer that is disabled on a traveled roadway or its shoulder?
  choices:
    A: Three federally conforming, bi-directional emergency reflective triangles
    B: Three liquid-burning flares
    C: At least six fuses
    D: All answers are correct
  answer: D
  explanation: Acceptable warning devices for a disabled truck, bus, or tractor-trailer
    include three federally conforming bi-directional emergency reflective triangles,
    three liquid-burning flares, or at least six fuses. Therefore, all answers are
    correct.
- id: 297
  category: signs_and_signals
  question: When a law enforcement officer is directing traffic and their command
    is different from a traffic signal or sign, what should you do?
  choices:
    A: Obey the traffic sign or signal
    B: Obey the command of the officer
    C: Continue on without reducing speed
    D: Submit an alert on social media
  answer: B
  explanation: When a law enforcement officer is directing traffic, you should obey
    the command of the officer, even if it is different from a traffic signal or sign.
- id: 298
  category: license_system
  question: When applying for a new driver's license, how many documents proving your
    Indiana residency must you present?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: To obtain a new driver's license, learner's permit, or identification
    card, you must present two documents proving your Indiana residency.
- id: 299
  category: license_system
  question: Which of the following is an acceptable document to prove your Social
    Security number?
  choices:
    A: A utility bill
    B: A W-2 Form
    C: A bank statement
    D: An Indiana voter registration card
  answer: B
  explanation: According to the manual, documents containing your name and full Social
    Security number which qualify include a Social Security card, W-2 Form, 1099 Form,
    Non-SSA 1099 Form, or a pre-printed pay stub.
- id: 300
  category: license_system
  question: How recent must a computer-generated bill from a utility company be to
    prove Indiana residency?
  choices:
    A: Issued within 30 days of the application date
    B: Issued within 60 days of the application date
    C: Issued within 90 days of the application date
    D: Issued within one year of the application date
  answer: B
  explanation: The manual states that a computer-generated bill from a utility company
    must be issued within 60 days of the application date and contain your name and
    residential address.
- id: 301
  category: license_system
  question: Under what condition can a post office box be used as a residential address
    for BMV documents?
  choices:
    A: If the applicant receives all their mail there
    B: If the applicant is homeless
    C: If the applicant is enrolled in the Indiana Attorney General’s Address Confidentiality
      Program
    D: Post office boxes can never be used under any circumstances
  answer: C
  explanation: Post office boxes may not be used as a residential address, unless
    the applicant is enrolled in the Indiana Attorney General’s Address Confidentiality
    Program.
- id: 302
  category: license_system
  question: If you are living with a relative or friend and cannot provide two documents
    proving your residency, what must the relative or friend do?
  choices:
    A: Sign an Indiana Residency Affidavit at a BMV branch
    B: Provide their own Social Security card
    C: Write a letter on official letterhead
    D: Pay a residency verification fee
  answer: A
  explanation: If you are living with a relative or friend, an Indiana Residency Affidavit
    must be signed at a BMV branch by the relative or friend with whom you live.
- id: 303
  category: license_system
  question: What is required if you submit a document to the BMV that is in a language
    other than English?
  choices:
    A: A verbal translation by a family member at the branch
    B: A complete translation typed on the letterhead of an approved entity
    C: A notarized copy of the original document
    D: A translation provided by a friend
  answer: B
  explanation: The translation must be typed on a separate page on the letterhead
    of a government entity, accredited educational institution, or translation agency.
- id: 304
  category: license_system
  question: Who is explicitly prohibited from translating a document for your BMV
    application?
  choices:
    A: A government entity
    B: An accredited educational institution
    C: A translation agency
    D: A family member, friend, or business associate
  answer: D
  explanation: The translator must state that the document has not been translated
    for a family member, friend, or business associate.
- id: 305
  category: defensive_driving
  question: According to the manual, what is the most common contributing factor in
    teen crashes?
  choices:
    A: Excessive speed
    B: Errant and risky driving and distraction
    C: Driving with other teens
    D: Failure to wear a seat belt
  answer: B
  explanation: The manual states that errant and risky driving and distraction is
    the most common contributing factor in teen crashes.
- id: 306
  category: defensive_driving
  question: What happens to the chance of a crash when a teen driver has passengers
    in the vehicle?
  choices:
    A: It decreases slightly due to extra sets of eyes
    B: It remains the same as driving alone
    C: It doubles with each passenger present
    D: It triples with each passenger present
  answer: C
  explanation: The chance of a crash doubles with each passenger present in the vehicle.
- id: 307
  category: safe_driving_rules
  question: Where do most multi-vehicle crashes involving teens occur?
  choices:
    A: On highways
    B: In parking lots
    C: At intersections
    D: On rural roads
  answer: C
  explanation: Most multi-vehicle crashes involving teens occur at intersections.
    Teen drivers need to be free from distractions and focused on other vehicles at
    intersections.
- id: 308
  category: safe_driving_rules
  question: Why does the manual advise against playing music loudly while driving?
  choices:
    A: It drains the vehicle's battery
    B: It is illegal in the state of Indiana
    C: You might miss hearing a siren or a horn
    D: It causes the driver to speed
  answer: C
  explanation: Do not play music loudly. You might miss hearing a siren or a horn
    that could warn you of possible trouble.
- id: 309
  category: defensive_driving
  question: What is a common contributing factor in single-vehicle crashes involving
    teens?
  choices:
    A: Inattentiveness
    B: Excessive speed
    C: Driving with other teens
    D: Adjusting the radio
  answer: B
  explanation: Excessive speed. Illegal or unsafe speed is a common contributing factor
    in single vehicle crashes.
- id: 310
  category: license_system
  question: If you do not qualify for a Social Security number, what document may
    you be asked to provide in lieu of it?
  choices:
    A: A valid I-94
    B: A W-2 Form
    C: A 1099 Form
    D: An Indiana voter registration card
  answer: A
  explanation: If you are not authorized to work in the United States, you may be
    asked to provide a valid I-94 in lieu of a Social Security number.
- id: 311
  category: license_system
  question: How old must a homeowner's, renter's, or motor vehicle insurance policy
    be to qualify as proof of Indiana residency?
  choices:
    A: Dated within 30 days of the application date
    B: Dated within 60 days of the application date
    C: Dated within 90 days of the application date
    D: Dated within one year of the application date
  answer: D
  explanation: A current valid homeowner’s, renter’s, or motor vehicle insurance policy
    showing your name and residential address must be dated within one year of the
    application date.
- id: 312
  category: license_system
  question: What must a homeless applicant provide along with an Indiana Residency
    Affidavit?
  choices:
    A: A W-2 form
    B: A letter on letterhead from the government entity or not-for-profit organization
      providing services
    C: Proof of paying Indiana income taxes
    D: A valid Indiana handgun permit
  answer: B
  explanation: Homeless applicants must provide a letter from the government entity
    or not-for-profit organization on its letterhead showing its name, address, and
    telephone number and showing the legal representative’s name, signature, and signature
    date.
- id: 313
  category: driver_responsibility
  question: When is the best time to adjust your seats and mirrors?
  choices:
    A: While stopped at a red light
    B: Before starting each drive
    C: While driving at a low speed
    D: Only when driving a new vehicle
  answer: B
  explanation: The manual advises to always adjust your seats and mirrors for the
    best visibility before starting each drive.
- id: 314
  category: safe_driving_rules
  question: Why should you wait until your vehicle is stopped before adjusting your
    radio?
  choices:
    A: It drains the car's battery if the vehicle is moving.
    B: Taking your focus off the road for even a few seconds could lead to a collision.
    C: The radio signal is weaker while the vehicle is in motion.
    D: It is illegal to touch the radio while driving in Indiana.
  answer: B
  explanation: The manual states it is better to wait until you are stopped to adjust
    your radio because taking your focus off the road for even a few seconds could
    lead to a collision.
- id: 315
  category: safe_driving_rules
  question: What is a potential danger of playing music loudly while driving?
  choices:
    A: You might miss hearing a siren or a horn that could warn you of possible trouble.
    B: It can damage the vehicle's electrical system over time.
    C: It causes the driver to subconsciously drive faster than the speed limit.
    D: It is considered a noise violation and is a felony offense.
  answer: A
  explanation: According to the manual, you should not play music loudly because you
    might miss hearing a siren or a horn that could warn you of possible trouble.
- id: 316
  category: safe_driving_rules
  question: Which of the following activities is explicitly stated as being against
    the law while driving?
  choices:
    A: Adjusting the radio.
    B: Talking on the phone or texting.
    C: Eating a meal.
    D: Combing your hair.
  answer: B
  explanation: 'The manual explicitly states: "Do not talk on the phone or text while
    driving, it''s against the law."'
- id: 317
  category: alcohol_drugs_health
  question: What effect can some over-the-counter drugs have on your driving?
  choices:
    A: They can improve your reaction time.
    B: They can make you drowsy.
    C: They increase your visual acuity.
    D: They have no effect on driving ability.
  answer: B
  explanation: The manual warns drivers not to drive under the influence, noting that
    "Even some over-the-counter drugs can make you drowsy."
- id: 318
  category: safe_driving_rules
  question: What should you do if you are approaching an intersection and the green
    light turns yellow?
  choices:
    A: Speed up to make it through the intersection before it turns red.
    B: Enter the intersection cautiously and yield to crossing traffic.
    C: You should not enter the intersection after the light turns yellow unless you
      are already in it.
    D: Stop immediately, even if you are already in the middle of the intersection.
  answer: C
  explanation: 'The manual states: "Unless you are already in an intersection when
    the light turns yellow, you should not enter the intersection after the light
    turns yellow."'
- id: 319
  category: safe_driving_rules
  question: Why is it important to obey the speed limit?
  choices:
    A: Going too fast increases your vehicle's fuel efficiency.
    B: Going too fast gives you less time to stop or react.
    C: It prevents excessive wear and tear on your tires.
    D: It ensures you will not encounter yellow traffic lights.
  answer: B
  explanation: 'The manual states: "Obey the speed limit. Going too fast gives you
    less time to stop or react."'
- id: 320
  category: driver_responsibility
  question: When choosing a vehicle for a teen driver, what should parents prioritize?
  choices:
    A: The vehicle's image and style.
    B: The vehicle's top speed capabilities.
    C: Safety.
    D: The vehicle's audio and entertainment system.
  answer: C
  explanation: The "Tips for Parents of Teens" section advises parents to "Choose
    vehicles for safety, not image."
- id: 321
  category: driver_responsibility
  question: What strategy is recommended for parents as their teen driver gains experience
    and demonstrates appropriate decisions?
  choices:
    A: Granting immediate unrestricted driving privileges.
    B: Developing a strategy for progressive privileges.
    C: Revoking the learner's permit to test their knowledge.
    D: Decreasing the amount of supervised driving practice time.
  answer: B
  explanation: The manual recommends developing a strategy for progressive privileges,
    allowing the teen to move up to a higher level of driving responsibility as they
    gain experience.
- id: 322
  category: vehicle_information
  question: What is the age requirement for wearing a DOT-approved helmet when operating
    or riding an Off-Road Vehicle (ORV)?
  choices:
    A: Anyone under 16 years of age.
    B: Anyone under 18 years of age.
    C: Anyone under 21 years of age.
    D: All riders, regardless of age.
  answer: B
  explanation: 'The manual states: "Anyone under 18 years of age who is operating
    or riding an ORV shall wear a helmet that meets the standards established by the
    United States Department of Transportation."'
- id: 323
  category: driver_responsibility
  question: If you own an Off-Road Vehicle (ORV), what are you prohibited from doing
    regarding minors?
  choices:
    A: Knowingly permitting an individual under 18 to operate the ORV without a DOT-approved
      helmet.
    B: Allowing an individual under 18 to ride the ORV on private property under any
      circumstances.
    C: Selling the ORV to anyone under the age of 21.
    D: Allowing an individual under 16 to perform maintenance on the ORV.
  answer: A
  explanation: An owner or possessor of an ORV may not knowingly authorize or permit
    an individual under 18 years of age to operate the ORV without wearing a DOT-approved
    helmet.
- id: 324
  category: license_system
  question: When can an eligible individual apply to register to vote through the
    BMV?
  choices:
    A: Only when obtaining a completely new credential.
    B: Only during a presidential election year.
    C: When obtaining a new, renewed, replacement, or amended credential.
    D: Only when visiting a physical BMV branch in person.
  answer: C
  explanation: 'The manual states: "Any individual obtaining a new, renewed, replacement,
    or amended credential may also apply to register to vote if that individual is
    eligible to vote."'
- id: 325
  category: license_system
  question: Indiana law requires the BMV to submit information to the Selective Service
    system for which group of individuals getting a new or renewed driver's license?
  choices:
    A: All individuals under 18 years of age.
    B: Males younger than 26 years of age.
    C: Females younger than 26 years of age.
    D: All individuals over 18 years of age.
  answer: B
  explanation: The BMV is required to submit necessary information to register males
    younger than 26 years of age with the Selective Service system when getting a
    new or renewed driver's license.
- id: 326
  category: penalties_and_points
  question: What is the penalty for failing to register with the Selective Service
    system when required?
  choices:
    A: A misdemeanor punishable by a $500 fine.
    B: A felony punishable by up to five years imprisonment and a $250,000 fine.
    C: Immediate suspension of driving privileges for one year.
    D: A written warning and a mandatory court appearance.
  answer: B
  explanation: According to the manual, failure to register with the Selective Service
    system is a felony and is punishable by up to five years imprisonment and a $250,000
    fine.
- id: 327
  category: vehicle_information
  question: Approximately how long does it take for license plates and stickers to
    arrive by mail after renewing your vehicle registration?
  choices:
    A: 7 days
    B: 14 days
    C: 21 days
    D: 30 days
  answer: C
  explanation: The manual repeatedly states across different renewal methods (online,
    phone, mail) that "Plates and stickers arrive in approximately 21 days."
- id: 328
  category: vehicle_information
  question: Which of the following is NOT listed as a convenient way to renew your
    vehicle registration through the BMV?
  choices:
    A: Visiting a BMV Connect kiosk.
    B: Renewing by phone.
    C: Renewing by mail.
    D: Renewing through a third-party mobile app.
  answer: D
  explanation: 'The BMV offers four ways to renew: online (IN.gov/BMV), by phone,
    at a BMV Connect kiosk, or by mail. Third-party mobile apps are not mentioned
    as an option.'
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 329
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 330
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 331
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 332
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 333
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 334
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 335
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 336
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 337
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 338
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
