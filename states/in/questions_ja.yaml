    B: いかなる状況下でも、18歳未満の人が私有地でORVに乗ることを許可すること。
    C: 21歳未満の人にORVを販売すること。
    D: 16歳未満の人にORVのメンテナンスを行わせること。
  answer: A
  explanation: ORVの所有者または占有者は、18歳未満の人がDOT承認のヘルメットを着用せずにORVを運転することを、承知の上で承認または許可してはなりません。
- id: 324
  category: license_system
  question: 資格のある個人が、自動車局（BMV）を通じて有権者登録を申請できるのはいつですか？
  choices:
    A: 完全に新規の証明書を取得する場合のみ。
    B: 大統領選挙の年のみ。
    C: 新規、更新、再発行、または記載事項変更の証明書を取得する際。
    D: BMVの実際の支局を直接訪問する場合のみ。
  answer: C
  explanation: マニュアルには次のように記載されています。「新規、更新、再発行、または記載事項変更の証明書を取得する個人は、投票資格がある場合、有権者登録も申請することができます。」
- id: 325
