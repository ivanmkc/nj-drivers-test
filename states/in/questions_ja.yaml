  explanation: 閲覧可能な運転記録（Viewable Driver Record）は印刷することができず、運転記録の公式な証明書として使用するべきではありません。
- id: 132
  category: penalties_and_points
  question: 常習的交通違反者（HTV）法のセクションAにおいて、飲酒運転により死亡事故を引き起こしたことによる有罪判決を10年以内に2回受けた場合、運転免許はどのくらいの期間停止されますか？
  choices:
    A: 5年
    B: 10年
    C: 15年
    D: 生涯（永久）
  answer: D
  explanation: 飲酒運転により死亡事故を引き起こしたことによる有罪判決を10年以内に2回受けた運転者は、運転免許が生涯（永久）停止されます。
- id: 133
  category: penalties_and_points
  question: 無謀運転やドラッグレースなどの重大な違反（major offenses）を10年以内に3回繰り返した運転者は、どのくらいの期間の運転免許停止処分を受けますか？
  choices:
    A: 3年
    B: 5年
    C: 10年
    D: 生涯（永久）
  answer: C
  explanation: セクションBに基づき、指定されたリストにある重大な違反を10年以内に3回繰り返した運転者は、運転免許が10年間停止されます。
- id: 134
  category: penalties_and_points
  question: 少なくとも1回の重大な違反を含む、10回以上の交通違反を10年以内に繰り返した運転者に対する罰則は何ですか？
  choices:
    A: 1年間の免許停止
    B: 5年間の免許停止
    C: 10年間の免許停止
    D: 生涯（永久）免許停止
  answer: B
  explanation: セクションCに基づき、常習的交通違反者（HTV）は、10年以内に10回以上の交通違反（そのうち1回は重大な違反）を繰り返した場合、5年間の運転免許停止処分の対象となります。
- id: 135
  category: license_system
  question: インディアナ州の運転免許証にある「制限5（Restriction 5）」は何を示していますか？
  choices:
    A: 運転者は視力矯正レンズを着用しなければならない。
    B: 運転者は日中の運転のみに制限されている。
    C: 運転者は、生活困窮、保護観察、条件付き、または特別な運転特権（specialized driving privileges）を付与されている。
    D: 運転者はイグニッション・インターロック装置（呼気アルコール検知器）が装備された車両を運転しなければならない。
  answer: C
  explanation: 「制限5（Restriction 5）」は、裁判所の命令により、生活困窮、保護観察、条件付き、または特別な運転特権を付与された人の運転免許証に記載されます。
- id: 136
  category: penalties_and_points
  question: 裁判所から特別な運転特権（specialized driving privileges）を付与された人に対する要件は、次のうちどれですか？
  choices:
    A: 有効なSR22（自動車保険証明書）をBMVに提出し維持する。
    B: 6ヶ月ごとに防衛運転講習を修了する。
    C: マニュアルトランスミッション車のみを運転する。
    D: 有効に発行された証明書をBMVに返納する。
  answer: A
  explanation: 特別な運転特権を付与された人は、その特権の期間中、有効なSR22をBMVに提出し維持しなければなりません。
- id: 137
  category: signs_and_signals
  question: 茶色の交通標識はどのような情報を示していますか？
  choices:
    A: 一時的な交通状況
    B: 道路サービスと施設
    C: 近くのレクリエーション施設や文化的な名所
    D: 許可された進行方向と方角
  answer: C
  explanation: 茶色の交通標識は、州立公園など、近くのレクリエーション施設や文化的な名所を示しています。
- id: 138
  category: signs_and_signals
  question: 次の出口の施設に関する情報を表示する交通標識は、通常どのような背景色をしていますか？
  choices:
    A: 緑色
    B: 青色
    C: 白色
    D: オレンジ色
  answer: B
  explanation: 青色の交通標識は、次の出口の施設など、道路サービスや情報を表示します。
- id: 139
  category: signs_and_signals
  question: 高速道路の工事など、一時的な交通状況を運転者に警告する交通標識には何色が使われますか？
  choices:
    A: 黄色
    B: 赤色
    C: オレンジ色
    D: 茶色
  answer: C
  explanation: オレンジ色の交通標識は、主に高速道路の工事や維持管理プロジェクトによる一時的な交通状況を運転者に警告します。
- id: 140
  category: signs_and_signals
  question: 白色の交通標識は通常何を表示していますか？
  choices:
    A: 制限速度などの交通規制
    B: 特定の道路の危険に対する警告
    C: 近くの病院への道順
    D: レクリエーション施設や文化的な名所
  answer: A
  explanation: 白色の交通標識は、運転者が従わなければならない制限速度などの交通規制や、州道マーカーなどの役立つ情報を表示します。
- id: 141
  category: signs_and_signals
  question: 「濡れると滑りやすい（Slippery When Wet）」の標識は、特定の道路状況に対して運転者に注意を促す標識の一例です。この標識の背景は何色ですか？
  choices:
    A: 赤色
    B: オレンジ色
    C: 黄色
    D: 緑色
  answer: C
  explanation: 黄色または蛍光黄緑色の標識は、前方の特定の道路状況や危険に対して運転者に注意を促します。「濡れると滑りやすい」の標識は、黄色の背景を持つ交通標識の一例です。
- id: 142
  category: signs_and_signals
  question: 赤色の交通標識は運転者に何を伝えますか？
  choices:
    A: 許可された進行方向や案内
    B: 安全への脅威を避けるために直ちに行動を起こす必要がある交通規制
    C: 近くのスクールゾーンや横断歩道
    D: 工事による一時的な交通状況
  answer: B
  explanation: 赤色の交通標識は、「逆走（Wrong Way）」の標識のように、交通安全への脅威を避けるために運転者が直ちに行動を起こす必要がある交通規制を伝えます。
- id: 143
  category: penalties_and_points
  question: 常習的交通違反者（Habitual Traffic Violator）法のセクションAにおいて重大な違反とみなされ、2回の有罪判決が蓄積されると10年間の免許停止につながる可能性があるのは、次のうちどれですか？
  choices:
    A: 10年間で9回のスピード違反切符
    B: 自動車の運転に起因する無謀運転致死
    C: 免許停止中の運転
    D: 方向指示器（ウィンカー）の使用義務違反
  answer: B
  explanation: 自動車の運転に起因する無謀運転致死は、負傷または死亡をもたらす重大な違反としてセクションAに記載されています。
- id: 144
  category: signs_and_signals
  question: 蛍光黄緑色の交通標識は、運転者に何を警告していますか？
  choices:
    A: 高速道路の工事区間
    B: 近くの学校、歩行者、自転車
    C: 前方の踏切
    D: 直ちに行動を起こす必要がある交通規制
  answer: B
  explanation: 蛍光黄緑色の標識は、近くの学校、歩行者、自転車、遊び場、スクールバスのルートを運転者に警告します。
- id: 145
  category: signs_and_signals
  question: ペナント型（三角旗型）の交通標識はどこに設置され、何を示していますか？
  choices:
    A: 道路の右側に設置され、スクールゾーンを示す
    B: 対面通行の道路の左側に設置され、左側からの追い越し禁止を警告する
    C: 交差点に設置され、一時停止の義務を示す
    D: 踏切の手前に設置され、列車の接近を警告する
  answer: B
  explanation: ペナント型の交通標識は、対面通行の道路の左側に設置され、他の車両を左側から追い越さないよう運転者に警告します。
- id: 146
  category: signs_and_signals
  question: 円形の交通標識は、どのような危険や状況を運転者に警告しますか？
  choices:
    A: 前方の踏切
    B: 滑りやすい道路状況
    C: 前方の急カーブ
    D: 高速道路の工事区間
  answer: A
  explanation: 円形の交通標識は、前方に踏切があることを運転者に警告します。
- id: 147
  category: signs_and_signals
  question: 5角形の交通標識は、あなたが次に近づいていることを示しています：
  choices:
    A: 一時停止の交差点
    B: ゆずり合い（Yield）の交差点
    C: 子供が横断する可能性のある学校周辺のエリア
    D: 追い越し禁止区域
  answer: C
  explanation: 5角形の交通標識は、子供が道路を横断する可能性のある学校周辺のエリアに進入していることを運転者に警告します。
- id: 148
  category: vehicle_information
  question: 低速走行車（slow-moving vehicle）のエンブレムは、その車両が時速何マイルを超えられないことを示していますか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速30マイル
  answer: C
  explanation: 低速走行車のエンブレムは、中央が蛍光オレンジ色で縁が赤色の反射材になっており、時速25マイルを超えられない低速走行車であることを示しています。
- id: 149
  category: signs_and_signals
  question: 低速走行車のエンブレムは、何色で構成されていますか？
  choices:
    A: 黄色の背景に黒色の縁取り
    B: 蛍光オレンジ色の中央部分と赤色の反射材の縁取り
    C: 赤色の中央部分と白色の反射材の縁取り
    D: 蛍光黄緑色の中央部分と黒色の縁取り
  answer: B
  explanation: 低速走行車のエンブレムは、蛍光オレンジ色の中央部分と赤色の反射材の縁取りで構成されています。
- id: 150
  category: signs_and_signals
  question: オレンジ色の交通標識は、一般的に何を示していますか？
  choices:
    A: 運転者向けのサービスやレクリエーションエリア
    B: 高速道路の工事および維持管理区間
    C: スクールゾーンや横断歩道
    D: 直ちに従わなければならない交通規制
  answer: B
  explanation: オレンジ色の高速道路工事用交通標識は、工事区間に近づく際に注意するよう運転者に警告します。
- id: 151
  category: safe_driving_rules
  question: 交差点に近づいていて、黄色の点灯信号に直面しているが、安全に停止するには近すぎる場合、どうすればよいですか？
  choices:
    A: 急ブレーキをかけて交差点内で停止する
    B: 赤信号になる前に通過するためにスピードを上げる
    C: そのまま交差点を通過してよい
    D: すぐに道路の右側に車を寄せる
  answer: C
  explanation: 黄色の点灯信号に直面している場合、あなたの優先権は終了しようとしています。交差点に近づいており、安全に停止するには近すぎる場合は、そのまま進行を完了することができます。
- id: 152
  category: safe_driving_rules
  question: 矢印のない青信号が表示されている交差点で左折する場合、一度に何台の車両が左折のために交差点に進入できますか？
  choices:
    A: 入れるだけの台数
    B: 一度に1台のみ
    C: 一度に2台
    D: 赤信号になるまで進入してはならない
  answer: B
  explanation: 矢印のない青信号に直面している場合、交差点内がクリアであれば交差点を通過して曲がることができます。左折のために交差点に進入できるのは、一度に1台の車両のみです。
- id: 153
  category: safe_driving_rules
  question: 進行方向を示す黄色の点滅矢印信号は何を意味しますか？
  choices:
    A: あなたに優先権があり、対向車は道を譲らなければならない
    B: 歩行者と対向車に道を譲った後にのみ、曲がることができる
    C: 完全に停止し、青の矢印信号を待たなければならない
    D: 交差点での右左折は禁止されている
  answer: B
  explanation: 進行方向を示す黄色の点滅矢印信号は、歩行者や対向車に優先権を譲った後にのみ、曲がることができることを意味します。
- id: 154
  category: safe_driving_rules
  question: 赤の点灯信号がある交差点で左折が許可されるのは、どのような条件のときですか？
  choices:
    A: 対面通行の道路から一方通行の道路へ曲がる場合
    B: 一方通行の道路から対面通行の道路へ曲がる場合
    C: 一方通行の道路から一方通行の道路へ曲がる場合
    D: 赤信号での左折は決して許可されない
  answer: C
  explanation: 一方通行の道路から一方通行の道路へ曲がる場合、赤信号または赤の矢印信号の交差点でも左折することができます。
- id: 155
  category: safe_driving_rules
  question: 赤信号で許可された右折をする前に、必要な条件は次のうちどれですか？
  choices:
    A: 曲がる前に時速5マイルまで減速する
    B: 完全に停止し、車両や歩行者がいないか確認する
    C: 交差する交通に警告するためにクラクションを鳴らす
    D: ハザードランプを点灯させる
  answer: B
  explanation: 許可されている場合に、赤信号または赤の矢印信号の交差点で右折するには、完全に停止し、曲がる進路上やその進路に入ろうとしている車両や歩行者がいないことを確認しなければなりません。
- id: 156
  category: signs_and_signals
  question: 矢印のない黄色の点滅信号が表示されている交差点に近づいた場合、どうすればよいですか？
  choices:
    A: 完全に停止し、青信号を待つ
    B: 交差点を四方向一時停止として扱う
    C: 減速し、注意して交差点を通過する
    D: 加速して素早く交差点を通過する
  answer: C
  explanation: 交差点での矢印のない黄色の点滅信号は、減速し、注意して交差点を通過すべきであることを意味します。
- id: 157
  category: signs_and_signals
  question: 正三角形の交通標識は何を示していますか？
  choices:
    A: 運転者に減速を促し、道を譲るために完全に停止する準備をするよう警告する
    B: 前方にスクールゾーンがあることを示す
    C: 前方に踏切があることを運転者に警告する
    D: 追い越し禁止区域の始まりを示す
  answer: A
  explanation: 3つの辺の長さが等しい交通標識（正三角形）は、交差点に近づく際に減速し、他の運転者や歩行者に道を譲るために完全に停止する準備をするよう運転者に警告します。
- id: 158
  category: signs_and_signals
  question: 一時停止標識（STOPサイン）の下に追加される補助標識（プラーク）の目的は何ですか？
  choices:
    A: 交差する道路の制限速度を示すため
    B: 交差点で一時停止しなければならない方向を示すため
    C: 近くのスクールゾーンを警告するため
    D: 次の町までの距離を示すため
  answer: B
  explanation: 交差点で一時停止しなければならない方向を示すために、一時停止標識の下に補助標識が追加されることがあります。
- id: 159
  category: signs_and_signals
  question: 交差点で矢印なしで表示される黄色の点滅信号は何を意味しますか？
  choices:
    A: 停止して青信号を待つ。
    B: 減速し、注意して交差点を通過する。
    C: あなたに優先権があり、減速する必要はない。
    D: 信号機が故障しており、四方向一時停止として扱うべきである。
  answer: B
  explanation: マニュアルによると、矢印なしで表示される黄色の点滅信号は、減速し、注意して交差点を通過すべきであることを意味します。
- id: 160
  category: signs_and_signals
  question: すべての交通が停止を義務付けられている交差点の赤の点滅信号に、あなたと他の運転者が同時に到着した場合、誰が優先権を譲らなければなりませんか？
  choices:
    A: 右側の車両。
    B: 左側の車両。
    C: より速く走行している車両。
    D: 右折する車両。
  answer: B
  explanation: マニュアルには、すべての交通が停止を義務付けられている交差点に他の運転者と同時に到着した場合、左側の車両が優先権を譲らなければならないと記載されています。
- id: 161
  category: vehicle_information
  question: オートバイの運転者が、青に変わらない点灯した赤信号を通過できるのはどのような条件のときですか？
  choices:
    A: 少なくとも2分間完全に停止し、十分な注意を払った後。
    B: クラクションを鳴らし、30秒待った後。
    C: 交通整理をする警察官がいる場合のみ。
    D: オートバイは点灯した赤信号を通過することは決して許されない。
  answer: A
  explanation: 信号機のある交差点に接近するオートバイおよび原動機付自転車の運転者は、少なくとも2分間完全に停止し、十分な注意を払う場合、点灯した赤信号を通過することができます。
- id: 162
  category: vehicle_information
  question: オートバイが2分間待った後に点灯した赤信号を通過できるという規則は、オートサイクル（三輪自動車）にも適用されますか？
  choices:
    A: はい、オートサイクルはすべてのオートバイの規則に従います。
    B: はい、ただし2分ではなく3分待たなければなりません。
    C: いいえ、この規則はオートサイクルには適用されません。
    D: いいえ、オートサイクルはすべての赤信号を「ゆずれ」の標識として扱わなければなりません。
  answer: C
  explanation: マニュアルには、運転者が赤信号での長時間の待機を避けるために2分間待つことを許可する規則は、オートサイクルには適用されないと明記されています。
- id: 163
  category: signs_and_signals
  question: 信号機が作動していない交差点に接近した場合、どのように進むべきですか？
  choices:
    A: 道路が空いていれば、止まらずに交差点を通過する。
    B: 交差点に入る前に停止し、自分より先に到着した車両や右側にいる車両に道を譲る。
    C: 交差点を「ゆずれ」の標識として扱い、減速する。
    D: 交通整理の警察官が到着するまで待つ。
  answer: B
  explanation: 作動していない信号機のある交差点に接近した場合は、交差点に入る前に停止し、交差する交通、先に停止した車両、右側に同時に到着した車両、および歩行者に道を譲った後、注意して進む必要があります。
- id: 164
  category: signs_and_signals
  question: 歩行者が歩行者用ハイブリッドビーコンを作動させた直後、何が表示されますか？
  choices:
    A: 点灯した赤信号。
    B: 点滅する黄信号。
    C: 点灯した黄信号。
    D: 2つの点滅する赤信号。
  answer: B
  explanation: 歩行者によって作動されると、歩行者用ハイブリッドビーコンは点滅する黄信号を表示し、運転者が横断歩道を通過できるようにします。
- id: 165
  category: safe_driving_rules
  question: 道路上の黄色の車線表示は何を示していますか？
  choices:
    A: 同じ方向に進む複数の車線を区切る。
    B: バスまたは交通機関専用車線を示す。
    C: 反対方向に進む複数の車線を区切る。
    D: 横断歩道ゾーンを示す。
  answer: C
  explanation: マニュアルによると、黄色の車線表示は反対方向に進む複数の車線を区切るものです。
- id: 166
  category: safe_driving_rules
  question: 他の車両を追い越す際、対向車の前で道路の右側に戻るまでに、どのくらいの距離を空けなければなりませんか？
  choices:
    A: 50フィート以上。
    B: 100フィート以上。
    C: 200フィート以上。
    D: 500フィート以上。
  answer: B
  explanation: 追い越しをする際は、対向車から100フィート以上の距離を保って道路の右側に戻らなければなりません。
- id: 167
  category: defensive_driving
  question: 車線変更をする前に死角を確認するには、どうすればよいですか？
  choices:
    A: ルームミラーのみに頼る。
    B: 進入する車線の方向に少しだけ顔を向ける。
    C: クラクションを鳴らして死角にいる車両に警告する。
    D: ヘッドライトを2回点滅させる。
  answer: B
  explanation: 車線変更をする際は、進入する車線の方向に少しだけ顔を向け、死角に車両がいないことを確認する必要があります。
- id: 168
  category: safe_driving_rules
  question: 次のうち、他の車両を追い越すことが危険かつ違法となる状況はどれですか？
  choices:
    A: 黄色の破線がある道路を走行しているとき。
    B: 交差点、踏切、橋、高架橋、またはトンネルから100フィート以内の場所。
    C: 前方の車両が制限速度未満で走行しているとき。
    D: 白の破線がある複数車線の幹線道路。
  answer: B
  explanation: 交差点、踏切、橋、高架橋、またはトンネルから100フィート以内で他の車両を追い越そうとすることは、危険であり違法です。
- id: 169
  category: sharing_the_road
  question: 他の車両が道路の左側からあなたを追い越そうとしている場合、どうするべきですか？
  choices:
    A: 速度を上げて追い越しを防ぐ。
    B: 左車線に移動して進路を塞ぐ。
    C: 他の車両が安全に追い越せるようにし、速度を上げない。
    D: クラクションを鳴らして対向車を警告する。
  answer: C
  explanation: 他の車両が道路の左側からあなたを追い越そうとしている場合は、他の車両が安全に追い越せるようにし、速度を上げてはいけません。
- id: 170
  category: safe_driving_rules
  question: 右折の準備をする際の適切な車線位置はどこですか？
  choices:
    A: 進行方向の最も左側の車線。
    B: 中央の車線。
    C: 進行方向の最も右側の車線。
    D: 方向指示器を使用していれば、どの車線でもよい。
  answer: C
  explanation: 右折するには、進行方向の最も右側の車線に入ります。
- id: 171
  category: signs_and_signals
  question: 黄色の自転車マークを表示している自転車用信号は、自転車の運転者に何を示していますか？
  choices:
    A: 優先通行権が終了しようとしている。
    B: 注意して進む。
    C: 歩行者に道を譲る。
    D: 自転車専用レーンが終了しようとしている。
  answer: A
  explanation: 車両用の信号と同様に、黄色の自転車用信号は優先通行権が終了しようとしていることを意味します。
- id: 172
  category: signs_and_signals
  question: バスまたはトランジット（公共交通機関）レーンを制御し、バスまたはトランジットの運転手のみに適用されるのはどのタイプの信号ですか？
  choices:
    A: 黄色の三角形を表示する信号。
    B: 白い長方形のバーを表示する信号。
    C: 点滅する赤色の丸を表示する信号。
    D: 緑色の矢印を表示する信号。
  answer: B
  explanation: 白い長方形のバーを表示する信号は、バスまたはトランジットレーンを制御し、バスまたはトランジットの運転手のみに適用されます。
- id: 173
  category: safe_driving_rules
  question: 停止線や横断歩道がない交差点で一時停止標識に近づいている場合、どこで停止すべきですか？
  choices:
    A: 交差する道路の端。
    B: 交差点に進入する前。
    C: 一時停止標識の10フィート手前。
    D: 交通状況を確認するために交差点の中央。
  answer: B
  explanation: 停止線も横断歩道もない場合は、交差点に進入する前に完全に停止しなければなりません。
- id: 174
  category: driver_testing
  question: 運転技能試験中に手信号を使用することは許可されていますか？
  choices:
    A: はい、ただし方向指示器（ランプ）が故障している場合のみです。
    B: はい、方向指示器よりも手信号が推奨されます。
    C: いいえ、運転技能試験で手信号を使用することはできません。
    D: はい、曲がる十分前に使用する限り許可されます。
  answer: C
  explanation: マニュアルによると、運転技能試験で手信号を使用することはできません。
- id: 175
  category: safe_driving_rules
  question: 特別な指定を受けた中央車線の正しい使用方法は何ですか？
  choices:
    A: 遅い車両を追い越すため
    B: 左折のみを行うため
    C: 右折のみを行うため
    D: 緊急時に駐車するため
  answer: B
  explanation: 交通量の多い道路には、左折車両専用に指定された中央車線が設けられていることがよくあります。このタイプの中央車線を他の車両の追い越しに使用してはなりません。
- id: 176
  category: safe_driving_rules
  question: Uターンをすることが明確に禁止されているのはどこですか？
  choices:
    A: 中央分離帯のUターン交差点
    B: 郡道
    C: 州間高速道路
    D: 都市部の住宅街
  answer: C
  explanation: マニュアルには、州間高速道路では絶対にUターンをしてはならないと記載されています。代わりに、次の出口まで進み、反対方向から高速道路に入り直してください。
- id: 177
  category: safe_driving_rules
  question: 2台の車両が全方向一時停止（オールウェイ・ストップ）の交差点に同時に到着した場合、どちらの車両が優先通行権を譲らなければなりませんか？
  choices:
    A: 右側の車両
    B: 左側の車両
    C: 大きい方の車両
    D: 速度が速い方の車両
  answer: B
  explanation: 他の運転手と同時に全方向一時停止標識に到着した場合、左側の車両が優先通行権を譲らなければなりません。
- id: 178
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）では、交通はどの方向に進みますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 時計回りと反時計回りの両方
    D: 直線
  answer: B
  explanation: ラウンドアバウトは、右折のみで進入または退出を行い、反時計回りに進む円形の交差点です。
- id: 179
  category: sharing_the_road
  question: 2台の大型トラックが同時にラウンドアバウトに近づいている、または走行している場合、どうしなければなりませんか？
  choices:
    A: 左車線の運転手は右車線の運転手に道を譲らなければならない。
    B: 右車線の運転手は左車線の運転手に道を譲らなければならない。
    C: 両方のトラックが停止し、警察官を待たなければならない。
    D: より重い荷物を積んでいるトラックに優先通行権がある。
  answer: B
  explanation: 2台の大型トラックが同時にラウンドアバウトに近づいている、または走行している場合、右車線の運転手は左車線の運転手に優先通行権を譲らなければなりません。
- id: 180
  category: safe_driving_rules
  question: 地方の州間高速道路における乗用車の最高制限速度はどれくらいですか？
  choices:
    A: 時速55マイル
    B: 時速60マイル
    C: 時速65マイル
    D: 時速70マイル
  answer: D
  explanation: 地方の州間高速道路では、乗用車は時速70マイルまたは標識で示された制限速度を超えてはなりません。
- id: 181
  category: safe_driving_rules
  question: 路地での最高速度制限はどれくらいですか？
  choices:
    A: 時速10マイル
    B: 時速15マイル
    C: 時速20マイル
    D: 時速25マイル
  answer: B
  explanation: 路地では、車両は時速15マイルまたは標識で指定された制限速度を超えてはなりません。
- id: 182
  category: defensive_driving
  question: 車間距離に関して、運転者が従うべき良いルールは何ですか？
  choices:
    A: 前の車から少なくとも1秒の距離を保つ
    B: 前の車から少なくとも2〜3秒の距離を保つ
    C: 前の車から少なくとも4〜5秒の距離を保つ
    D: 時速10マイルごとに、前の車から少なくとも車1台分の距離を保つ
  answer: B
  explanation: 運転者が従うべき良いルールは、前の車から少なくとも2〜3秒の距離を保つことです。
- id: 183
  category: safe_driving_rules
  question: 作業現場の制限速度は、その地域の法定最高速度と比べてどのようになっていますか？
  choices:
    A: 法定最高速度より少なくとも時速5マイル低く設定されている。
    B: 法定最高速度より少なくとも時速10マイル低く設定されている。
    C: 法定最高速度より少なくとも時速15マイル低く設定されている。
    D: 法定最高速度と同じである。
  answer: B
  explanation: 作業現場の制限速度は、常にその地域の法定最高速度より少なくとも時速10マイル低く設定されています。
- id: 184
  category: signs_and_signals
  question: トラフィックサークル（円形交差点）はラウンドアバウト（環状交差点）とどのように異なりますか？
  choices:
    A: トラフィックサークルは反時計回りの交通のみである。
    B: トラフィックサークルは常に信号機によって制御されている。
    C: トラフィックサークルは時計回りと反時計回りの交通がある場合があり、一時停止標識によって制御されることがある。
    D: トラフィックサークルは地方にのみ存在する。
  answer: C
  explanation: トラフィックサークルは、時計回りと反時計回りの交通がある場合があり、進入路が「ゆずれ（Yield）」の標識ではなく「一時停止（Stop）」の標識で制御されることがある点で、ラウンドアバウトと異なります。
- id: 185
  category: defensive_driving
  question: 車両の停止能力に影響を与える要因は、次のうちどれですか？
  choices:
    A: 車両の色
    B: タイヤの種類と状態
    C: 時間帯
    D: 車の乗車人数
  answer: B
  explanation: 車両の停止能力には、車両の重量、ブレーキやタイヤの種類と状態、路面の物理的状態や滑りやすさ、道路の勾配など、多くの要因が影響します。
- id: 186
  category: sharing_the_road
  question: 地方の州間高速道路において、申告車両総重量が26,000ポンドを超えるトラックの最高速度制限はどれくらいですか？
  choices:
    A: 時速55マイル
    B: 時速60マイル
    C: 時速65マイル
    D: 時速70マイル
  answer: C
  explanation: 地方の州間高速道路では、申告車両総重量が26,000ポンドを超えるトラックは、時速65マイルまたは標識で指定された制限速度を超えてはなりません。
- id: 187
  category: defensive_driving
  question: 車がスリップし始め、アンチロック・ブレーキ・システム（ABS）が装備されている場合、どうするべきですか？
  choices:
    A: ブレーキを素早くポンピングする（何度も踏み込む）
    B: ブレーキペダルに足を乗せ、しっかりと継続的に圧力をかけ続ける
    C: ブレーキを急激に踏み込み、ハンドルを急に切る
    D: すぐにパーキングブレーキをかける
  answer: B
  explanation: 車にアンチロック・ブレーキ・システム（ABS）が装備されている場合は、ブレーキペダルに足を乗せ、しっかりと継続的に圧力をかけ続けながら、通常通りにハンドル操作を行ってください。ブレーキをポンピングしてはいけません。
- id: 188
  category: defensive_driving
  question: 車両が道路から外れてしまった場合の適切な操作方法は何ですか？
  choices:
    A: すぐに舗装路に戻るようにハンドルを切る
    B: ブレーキを急激に踏み込み、ハンドルを急に切る
    C: アクセルペダルを緩め、安全が確認できたら徐々に道路に戻る
    D: 道路に戻る前に加速してトラクション（駆動力）を回復させる
  answer: C
  explanation: 車両が道路から外れてしまった場合は、すぐに舗装路に戻ろうとしないでください。アクセルペダルを緩め、安全が確認できたら、徐々に道路に戻るようにハンドルを切ってください。
- id: 189
  category: vehicle_information
  question: 乗用車や小型トラックの場合、時速75マイルで走行すると、時速55マイルで走行する場合と比べて燃料消費にどのような影響がありますか？
  choices:
    A: 約10％多く燃料を消費する
    B: 約25％多く燃料を消費する
    C: 約50％多く燃料を消費する
    D: 約75％多く燃料を消費する
  answer: C
  explanation: 燃料消費量は時速45マイルを超えると着実に増加し、乗用車や小型トラックでは、時速75マイルで走行すると時速55マイルで走行する場合に比べて約50％多く燃料を消費します。
- id: 190
  category: vehicle_information
  question: 車両の推奨タイヤ空気圧（psi）を確認するには、どこを見るべきですか？
  choices:
    A: タイヤのサイドウォール（側面）
    B: 運転席側のドア枠の内側にあるステッカー、または取扱説明書
    C: 車両のナンバープレート
    D: エンジンブロック
  answer: B
  explanation: 測定した空気圧（psi）は、運転席側のドアの内側にあるステッカー、または取扱説明書に記載されている空気圧（psi）と比較してください。タイヤのサイドウォールに記載されている空気圧と比較してはいけません。
- id: 191
  category: vehicle_information
  question: タイヤの摩耗を確認するためにペニー硬貨テスト（1セント硬貨を使ったテスト）を行う際、トレッド（溝）が合法的かつ安全な深さであることを示すものはどれですか？
  choices:
    A: リンカーンの頭が完全に見える
    B: リンカーンの頭の一部がトレッド（溝）に隠れている
    C: ペニー硬貨が溝から落ちる
    D: トレッドの深さが正確に1/32インチである
  answer: B
  explanation: リンカーンの頭の一部がトレッド（溝）に隠れていれば、合法的かつ安全なトレッドの深さで運転していることになります。
- id: 192
  category: safe_driving_rules
  question: 冬の天候において、道路の他の部分よりも先に凍結しやすい場所はどこですか？
  choices:
    A: 交差点と横断歩道
    B: 郊外の未舗装道路
    C: ランプ（出入り口の傾斜路）、橋、高架橋
    D: 多車線ハイウェイ
  answer: C
  explanation: ランプ、橋、高架橋の上の水分は、道路の他の部分よりも先に凍結することがあるため注意してください。
- id: 193
  category: defensive_driving
  question: 濡れた道路で車両がハイドロプレーニング現象を起こす原因は何ですか？
  choices:
    A: 油、泥、水の薄い層の上を走行すること
    B: 空気圧が高すぎるタイヤで運転すること
    C: 雨の中でヘッドライトのハイビームを使用すること
    D: ブレーキを頻繁にポンピングすること
  answer: A
  explanation: 濡れた道路を運転しているとき、車両は実際には油、泥、水の薄い層の上を走行しており、これがハイドロプレーニング現象を引き起こす原因となります。
- id: 194
  category: defensive_driving
  question: 水たまりを走行した後、ブレーキを乾かすために何をすべきですか？
  choices:
    A: 急加速する
    B: 低いギアに変速する
    C: ブレーキをポンピングしてテストする
    D: パーキングブレーキを数秒間かける
  answer: C
  explanation: 水たまりを走行した後は、ブレーキをポンピングしてテストしてください。そうすることでブレーキを乾かすことができます。
- id: 195
  category: safe_driving_rules
  question: 霧の中で運転する際、どのヘッドライトの設定を使用すべきですか？
  choices:
    A: ヘッドライトのハイビーム
    B: ヘッドライトのロービーム
    C: パーキングライトのみ
    D: ヘッドライトはつけず、ハザードランプのみ点滅させる
  answer: B
  explanation: ハイビームは使用しないでください。ロービームの方が、前方の道路や障害物をより良く照らします。
- id: 196
  category: defensive_driving
  question: 冠水した場所で車両がエンストした場合、最も安全な行動は何ですか？
  choices:
    A: 車内にとどまり、救助を待つ
    B: 窓を閉めてドアをロックする
    C: できるだけ早く車両を放棄して避難する
    D: 何度もエンジンの再始動を試みる
  answer: C
  explanation: 冠水した場所で車がエンストした場合は、できるだけ早く車を放棄して避難してください。洪水は急速に水位が上がり、車や乗員を押し流す危険があるためです。
- id: 197
  category: defensive_driving
  question: 夜間運転時、対向車のヘッドライトのまぶしさ（グレア）を避けるにはどうすればよいですか？
  choices:
    A: 対向車のヘッドライトを直接見る
    B: 道路の右側に視線を向ける
    C: まぶしさに対抗するためにハイビームを点灯する
    D: 対向車が通り過ぎるまで片目を閉じる
  answer: B
  explanation: まぶしさを避けるため、接近してくる車両のライトを直接見ないようにし、代わりに道路の右側に視線を向けてください。
- id: 198
  category: safe_driving_rules
  question: 運転者がヘッドライトを使用しなければならないのはいつですか？
  choices:
    A: 午後10時から午前6時の間のみ
    B: 日没から日の出までの間、または視界が500フィート未満のとき
    C: 街灯のない郊外の道路を運転するときのみ
    D: 日の出から日没までの間、または視界が1,000フィート未満のとき
  answer: B
  explanation: 運転者は、日没から日の出までの間、および視界が500フィート未満になるその他の時間帯には、ヘッドライトを使用しなければなりません。
- id: 199
  category: safe_driving_rules
  question: ヘッドライトのロービームを使用しなければならないのはいつですか？
  choices:
    A: 対向車から500フィート以内、または先行車の後方200フィート以内に接近したとき
    B: 対向車から1,000フィート以内、または先行車の後方500フィート以内に接近したとき
    C: 対向車から200フィート以内、または先行車の後方100フィート以内に接近したとき
    D: 市街地を運転するときのみ
  answer: A
  explanation: ヘッドライトを点灯している場合、対向車から500フィート以内に接近したとき、または先行車の後方200フィート以内を追従するときは、ロービームを使用しなければなりません。
- id: 200
  category: vehicle_information
  question: マニュアルによると、横転の可能性を減らすための最も重要な要因は何ですか？
  choices:
    A: 郊外の道路を完全に避けること
    B: タイヤを適切にメンテナンスすること
    C: 重心の低い車両を運転すること
    D: 時速45マイルを超えて運転しないこと
  answer: B
  explanation: 不適切な空気圧や摩耗したタイヤは、車両のコントロールを維持する能力を低下させます。車両のコントロールを維持することは、横転の可能性を減らすための最も重要な要因です。
- id: 201
  category: safe_driving_rules
  question: インディアナ州法によると、運転手はいつヘッドライトを使用しなければなりませんか？
  choices:
    A: 日没から日の出までの間、または視界が500フィート未満のとき
    B: 街灯のない田舎道を運転しているときのみ
    C: 午後8時から午前6時までの間
    D: 時速55マイル（mph）を超える速度で運転するときはいつでも
  answer: A
  explanation: 運転手は、日没から日の出までの間、および視界が500フィート未満になるその他のすべての時間帯にヘッドライトを使用しなければなりません。
- id: 202
  category: safe_driving_rules
  question: 他の車両の後ろを走行している場合、どのくらいの距離でヘッドライトを下向き（ロービーム）にしなければなりませんか？
  choices:
    A: 100フィート以内
    B: 200フィート以内
    C: 300フィート以内
    D: 500フィート以内
  answer: B
  explanation: 対向車に500フィート以内に接近したとき、または他の車両の後方200フィート以内を走行しているときは、ヘッドライトを下向き（ロービーム）にしなければなりません。
- id: 203
  category: alcohol_drugs_health
  question: 研究によると、18時間睡眠をとらない状態は、血中アルコール濃度（BAC）がどのレベルの運転手と同じくらい運転能力が低下するとされていますか？
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: 研究により、18時間睡眠をとらない状態は、法定アルコール基準値である血中アルコール濃度（BAC）.08の運転手と同じくらい運転能力が低下することが示されています。
- id: 204
  category: driver_responsibility
  question: 疲労に関連する事故の64パーセントを占め、最もリスクが高いのはどの年齢層ですか？
  choices:
    A: 16〜29歳
    B: 30〜45歳
    C: 46〜60歳
    D: 61歳以上
  answer: A
  explanation: 十分な休息をとらずに運転するという致命的なミスは誰にでも起こり得ますが、16〜29歳の若年層が最もリスクが高く、疲労に関連する事故の64パーセントを占めています。
- id: 205
  category: safe_driving_rules
  question: インディアナ州で自動車を運転中に、手持ちの通信機器（携帯電話など）を使用することが法的に認められる唯一の例外は何ですか？
  choices:
    A: GPSナビゲーションの地図を確認すること
    B: 緊急のテキストメッセージを読むこと
    C: 真の緊急事態のために911に連絡すること
    D: 赤信号で停車中に電話をかけること
  answer: C
  explanation: この禁止事項の唯一の例外は、ハンズフリー通信が有効になっている場合、または通信機器を使用して真の緊急事態のために911に連絡する場合です。
- id: 206
  category: defensive_driving
  question: テキストメッセージの送信や閲覧により、5秒間道路から目を離すことになります。時速55マイル（mph）で走行している場合、これは目隠しをしてどのくらいの距離を運転することに相当しますか？
  choices:
    A: バスケットボールコートの長さ
    B: アメリカンフットボールのフィールド全体の長さ
    C: 1マイル（約1.6km）
    D: 500フィート
  answer: B
  explanation: テキストメッセージの送信や閲覧により、5秒間道路から目を離すことになります。時速55マイル（mph）で走行している場合、それは目を閉じたままアメリカンフットボールのフィールド全体の長さを運転するのと同じです。
- id: 207
  category: penalties_and_points
  question: インディアナ州法の下では、1回の継続した運転中に特定の危険な行為を少なくともいくつ犯した場合、アグレッシブ・ドライビング（危険運転）とみなされますか？
  choices:
    A: 2つ
    B: 3つ
    C: 4つ
    D: 5つ
  answer: B
  explanation: インディアナ州法によると、車両の1回の継続した運転中に、以下の［危険な行為］のうち少なくとも3つを行った、または犯した場合、その人はアグレッシブ・ドライビング（危険運転）を行っているとみなされます。
- id: 208
  category: defensive_driving
  question: 砂利道（未舗装路）で停止したり曲がったりするのがより難しいのはなぜですか？
  choices:
    A: 砂利道は通常、舗装道路よりも広いため
    B: タイヤの牽引力（トラクション）が低下し、スリップ（横滑り）を引き起こす可能性があるため
    C: 砂利道は常に制限速度が高いため
    D: 砂埃で道路の視界が完全に遮られるため
  answer: B
  explanation: 砂利道ではタイヤの牽引力（トラクション）が低下するため、停止したり曲がったりするのがより難しくなります。トラクションが低下すると、スリップ（横滑り）が発生する可能性があります。
- id: 209
  category: safe_driving_rules
  question: 田舎道で急な丘の頂上に近づく前に、何をすべきですか？
  choices:
    A: 勢いを保つために加速する
    B: 道路の左側に寄る
    C: クラクションを鳴らし続ける
    D: 減速し、道路の右側に寄り、対向車に注意する
  answer: D
  explanation: 急な丘の頂上に近づく前に、減速し、道路の右側に寄り、対向車に注意してください。
- id: 210
  category: safe_driving_rules
  question: 州間高速道路（インターステート・ハイウェイ）で目的の出口を通り過ぎてしまった場合、どうしなければなりませんか？
  choices:
    A: 停止し、路肩を慎重に後退（バック）する
    B: 中央分離帯を横切ってUターンする
    C: 次の出口まで運転する
    D: 右車線に停止し、交通が途切れるのを待ってから後退（バック）する
  answer: C
  explanation: 通り過ぎた出口に戻るために州間高速道路を後退（バック）するのは危険です。出口を通り過ぎてしまった場合は、次の出口まで運転しなければなりません。
- id: 211
  category: sharing_the_road
  question: 片側3車線以上の州間高速道路（インターステート）では、トラックはどの車線を走行するように制限されていますか？
  choices:
    A: 左側の2車線
    B: 中央の車線のみ
    C: 右側の2車線
    D: 任意の車線
  answer: C
  explanation: トラックは、片側2車線の州間高速道路の区間では右側の車線に、片側3車線以上の州間高速道路では右側の2車線に走行が制限されています。
- id: 212
  category: signs_and_signals
  question: 作業区間において、方向を指示していない点滅する矢印板（アローボード）は何を意味しますか？
  choices:
    A: 直ちに左車線に移動しなければならない
    B: 直ちに右車線に移動しなければならない
    C: 注意を促す合図であるが、別の車線への移動は必要ない
    D: この先、道路は完全に閉鎖されている
  answer: C
  explanation: どちらの方向も指示していない点滅する矢印板は、注意を促す合図ですが、運転者に別の車線への移動を求めるものではありません。
- id: 213
  category: signs_and_signals
  question: 作業現場の交通誘導員が、蛍光オレンジ色または赤色の旗を交通の流れに対して水平に伸ばしている場合、どうしなければなりませんか？
  choices:
    A: 現在の速度で進行する
    B: 停止する
    C: 左車線に移動する
    D: クラクションを鳴らしてゆっくり進行する
  answer: B
  explanation: 交通誘導員が蛍光オレンジ色または赤色の旗を交通の流れに対して水平に伸ばしている場合は、停止しなければなりません。
- id: 214
  category: safe_driving_rules
  question: スクールバスなどの特定の車両は、踏切の最も手前にあるレールからどのくらいの距離で停止しなければなりませんか？
  choices:
    A: 10フィート以上、30フィート以内
    B: 15フィート以上、50フィート以内
    C: 20フィート以上、100フィート以内
    D: ちょうど25フィート
  answer: B
  explanation: 一部の車両は法律により、踏切の最も手前にあるレールから15フィート以上、50フィート以内の距離で必ず停止することが義務付けられています。
- id: 215
  category: signs_and_signals
  question: 踏切のクロストラック標識（X字型の標識）が単独で設置されている場合、どのように扱うべきですか？
  choices:
    A: 一時停止標識として扱う
    B: ゆずりあい（Yield）標識として扱う
    C: 制限速度標識として扱う
    D: 行き止まりの警告として扱う
  answer: B
  explanation: 単独で設置されている場合、クロストラック標識はゆずりあい（Yield）標識として扱うべきであり、停止するか線路を渡るかの判断は運転者に委ねられます。
- id: 216
  category: signs_and_signals
  question: クロストラック標識（X字型の標識）が単独で設置されている踏切に近づいた場合、どうするべきですか？
  choices:
    A: 列車の接近に関わらず、完全に停止する。
    B: ゆずりあい（Yield）標識として扱い、列車が接近している場合は停止する。
    C: できるだけ早く線路を通過するために加速する。
    D: クラクションを鳴らし、減速せずに進行する。
  answer: B
  explanation: 単独で設置されている場合、クロストラック標識はゆずりあい（Yield）標識として扱うべきであり、停止するか線路を渡るかの判断は運転者に委ねられます。列車が接近している場合は停止しなければなりません。
- id: 217
  category: safe_driving_rules
  question: 次のうち、すべての踏切で停止することが義務付けられている車両はどれですか？
  choices:
    A: 運賃をとって乗客を乗せているすべての車両
    B: すべてのピックアップトラック
    C: すべての乗用車
    D: すべてのオートバイ
  answer: A
  explanation: すべての踏切で停止することが義務付けられている車両には、運賃をとって乗客を乗せているすべての車両、すべてのスクールバス、および爆発物や引火性液体を積載しているすべての車両が含まれます。
- id: 218
  category: safe_driving_rules
  question: 踏切から何フィート以内で他の車両を追い越すことは違法ですか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: マニュアルには「踏切から100フィート以内では他の車両を追い越してはならない」と記載されています。
- id: 219
  category: defensive_driving
  question: 車両が線路内で立ち往生し、列車が接近している場合、避難後はどの方向に逃げるべきですか？
  choices:
    A: 接近してくる列車の方向に向かって、線路から45度の角度で離れる
    B: 列車から遠ざかるように線路に沿ってまっすぐ進む
    C: 線路から直接90度の角度で離れる
    D: 列車の進行方向と同じ方向に向かって、線路から45度の角度で離れる
  answer: A
  explanation: 線路内で立ち往生した場合は、その場から避難し、接近してくる列車の方向に向かって、線路から45度の角度で離れるように走って逃げるべきです。（※衝突時の破片が列車の進行方向に飛散するため）
- id: 220
  category: safe_driving_rules
  question: 踏切の警報機が点滅し始め、遮断機が下り始めたら、踏切から脱出するのに約どれくらいの時間がありますか？
  choices:
    A: 10秒
    B: 20秒
    C: 30秒
    D: 45秒
  answer: B
  explanation: 踏切の警報機が点滅し始め、遮断機が下り始めたら、踏切から脱出するのに約20秒の猶予があります。
- id: 221
  category: vehicle_information
  question: インディアナ州において、特別許可なしで運転できる車両の最大高はどれくらいですか？
  choices:
    A: 12フィート6インチ
    B: 13フィート6インチ
    C: 14フィート
    D: 14フィート6インチ
  answer: B
  explanation: 特別許可なしで運転できる車両の最大高は13フィート6インチです。
- id: 222
  category: sharing_the_road
  question: 時速55マイルで走行している、ブレーキが加熱した満載のトラクタートレーラーが完全に停止するまでに、およそ何フィートかかりますか？
  choices:
    A: 130〜140フィート
    B: 200フィート
    C: 300フィート
    D: 400フィート以上
  answer: D
  explanation: ブレーキが加熱した満載のトラクタートレーラーが完全に停止するまでには、400フィート以上、つまりアメリカンフットボールのフィールドの長さ以上かかる場合があります。
- id: 223
  category: sharing_the_road
  question: トラクタートレーラーの後方の死角は、車両の後ろ何フィートまで及ぶ可能性がありますか？
  choices:
    A: 最大50フィート
    B: 最大100フィート
    C: 最大150フィート
    D: 最大200フィート
  answer: D
  explanation: トラクタートレーラーの運転手にとっての死角は、運転席（キャブ）の前方最大20フィート、トレーラーの両側、運転席の横、および車両の後方最大200フィートに及びます。
- id: 224
  category: sharing_the_road
  question: 複数車線の高速道路で、トラクタートレーラーが中央車線を走行することが多いのはなぜですか？
  choices:
    A: 制限速度より速く走るため。
    B: 高速道路への合流や退出をスムーズにし、危険な状況を回避するための選択肢を増やすため。
    C: 右側車線を走行することが法律で禁止されているため。
    D: 乗用車に追い越されるのを防ぐため。
  answer: B
  explanation: 複数車線の高速道路では、トラクタートレーラーは高速道路への合流や退出をスムーズにするために中央車線を走行します。また、中央車線にいることで、危険な状況を回避するために車線変更をしなければならない場合の選択肢が増えます。
- id: 225
  category: sharing_the_road
  question: トラクタートレーラーを追い越す場合、どちら側から追い越すべきですか？
  choices:
    A: 常に左側から
    B: 常に右側から
    C: 交通量が少ない側から
    D: トラクタートレーラーを追い越してはならない
  answer: A
  explanation: トラクタートレーラーを追い越す際は、常に左側から完全に追い越してください。横に並んだまま走行すると、トラクタートレーラーの運転手が回避行動をとることができなくなります。
- id: 226
  category: safe_driving_rules
  question: インディアナ州のムーブオーバー法（Move Over Law）に基づき、点滅するライトをつけた緊急車両に近づいた際、別の車線に移動できない場合はどうしなければなりませんか？
  choices:
    A: 速度を維持し、注意して進む。
    B: 制限速度より時速10マイル低い速度まで減速し、注意して進む。
    C: 現在の車線で直ちに停止する。
    D: 速度を上げて緊急車両を素早く追い越す。
  answer: B
  explanation: 車線変更ができない場合、運転手は制限速度より時速10マイル低い速度まで減速し、注意して進まなければなりません。
- id: 227
  category: penalties_and_points
  question: インディアナ州のムーブオーバー法（Move Over Law）に従わなかった場合、何とみなされますか？
  choices:
    A: クラスA軽犯罪 (Class A Misdemeanor)
    B: クラスB違反 (Class B Infraction)
    C: クラスA違反 (Class A Infraction)
    D: 重罪 (Felony)
  answer: C
  explanation: 交互に点滅するライトを表示している緊急車両に近づく運転手は、車線を変更するか減速することが義務付けられています。これに従わない場合はクラスA違反（Class
    A Infraction）となります。
- id: 228
  category: defensive_driving
  question: 踏切内で車両が動かなくなり、列車が近づいていない場合、最初に何をすべきですか？
  choices:
    A: レッカー車を呼ぶ。
    B: 自分で車両を線路から押し出そうとする。
    C: 青い標識にある番号を使って、直ちに緊急通報システム（ENS）に電話する。
    D: 通りすがりの運転手を呼び止める。
  answer: C
  explanation: 踏切内で車両が動かなくなり、列車が近づいていない場合は、直ちに緊急通報システム（ENS）に電話してください。電話番号は、踏切の遮断機に取り付けられている青い標識に記載されています。
- id: 229
  category: sharing_the_road
  question: トラクタートレーラーが急なカーブを曲がる際、何を予測すべきですか？
  choices:
    A: 後輪が前輪よりも外側の軌道を通る。
    B: 運転手が曲がるための最初のステップとして、外側に大きく膨らむことがある。
    C: 車両は常に中央車線から曲がる。
    D: トレーラーは曲がる前に完全に停止する。
  answer: B
  explanation: どの車両でも曲がる際、後輪は前輪よりも内側の短い軌道を通ります（内輪差）。トラクタートレーラーの運転手は、急なカーブを曲がるための最初のステップとして、外側に大きく膨らむことがよくあります。
- id: 230
  category: safe_driving_rules
  question: 踏切を通過する際、避けるべきことは何ですか？
  choices:
    A: 左右を確認すること
    B: 停止したりギアをチェンジしたりすること
    C: ヘッドライトを点灯すること
    D: ワイパーを使用すること
  answer: B
  explanation: 踏切を通過する際は、停止したりギアをチェンジしたりすることを避けてください。運転手は、途中で停止することなく線路を渡りきれる場合を除き、踏切への進入を開始してはなりません。
- id: 231
  category: penalties_and_points
  question: 認可された緊急車両に対して車線を変更するか減速することを怠った場合の罰則は何ですか？
  choices:
    A: クラスAの違反 (Class A Infraction)
    B: クラスBの違反 (Class B Infraction)
    C: クラスAの軽犯罪 (Class A Misdemeanor)
    D: レベル6の重罪 (Level 6 Felony)
  answer: A
  explanation: マニュアルによると、運転手が認可された緊急車両のために車線を変更できない場合、制限速度より10 mph低い速度まで減速しなければなりません。これに従わない場合はクラスAの違反（Class
    A Infraction）となります。
- id: 232
  category: safe_driving_rules
  question: 黄色の点滅灯をつけて駐車している認可された車両から離れるために車線変更ができない場合、どのような行動をとらなければなりませんか？
  choices:
    A: 完全に停止し、車両が動くのを待つ
    B: 制限速度より10 mph低い速度まで減速し、注意して進む
    C: 15 mphまで減速し、注意して進む
    D: 速度を維持するが、作業員に警告するためにクラクションを鳴らす
  answer: B
  explanation: マニュアルには、黄色の点滅灯をつけて駐車している認可された車両のために車線変更ができない場合、制限速度より10 mph低い速度まで減速し、注意して進まなければならないと記載されています。
- id: 233
  category: safe_driving_rules
  question: 赤いライトを点滅させ、ストップアームを出しているスクールバスに対して、停止しなくてもよいのはどのような場合ですか？
  choices:
    A: 防護柵や未舗装の中央分離帯で区切られた道路で、反対方向に向かって走行している場合
    B: 2車線道路で反対方向に向かって走行している場合
    C: 分離道路でバスと同じ方向に向かって走行している場合
    D: スクールバスが踏切で停止している場合
  answer: A
  explanation: 防護柵や未舗装の中央分離帯で区切られた道路を走行している場合、スクールバスと同じ方向に走行している場合にのみ停止することが義務付けられています。
- id: 234
  category: penalties_and_points
  question: スクールバスのストップアームを無視し、その違反が人身傷害を引き起こした場合の罰則は何ですか？
  choices:
    A: クラスAの違反 (Class A Infraction)
    B: クラスBの違反 (Class B Infraction)
    C: クラスAの軽犯罪 (Class A Misdemeanor)
    D: レベル6の重罪 (Level 6 Felony)
  answer: D
  explanation: スクールバスのストップアームを無視するとクラスAの軽犯罪（Class A Misdemeanor）になる可能性がありますが、その違反が人身傷害を引き起こした場合はレベル6の重罪（Level
    6 Felony）になります。
- id: 235
  category: sharing_the_road
  question: オートバイの後ろを走行する場合、どのくらいの車間距離を空けるべきですか？
  choices:
    A: 1〜2秒
    B: 少なくとも3〜4秒
    C: 5〜6秒
    D: 10 mphごとに車1台分の長さ
  answer: B
  explanation: マニュアルでは、緊急時にオートバイの運転手が操作や停止をするための十分な時間を確保できるよう、オートバイの後ろを走行する際は少なくとも3〜4秒の車間距離を空けることを推奨しています。
- id: 236
  category: sharing_the_road
  question: オートバイの方向指示器（ウィンカー）が点滅していても、進行する前にオートバイが確実に曲がるのを確認して待つべきなのはなぜですか？
  choices:
    A: オートバイは配線不良によりランダムに点滅することがよくあるため
    B: オートバイの方向指示器は通常オートキャンセル式ではなく、運転手が消し忘れることが時々あるため
    C: オートバイの運転手は曲がるのを頻繁にやめるため
    D: 法律で進行する前に5秒間の待機が義務付けられているため
  answer: B
  explanation: オートバイの方向指示器が点滅しているからといって、すぐに曲がるとは思い込まないでください。これらの車両の方向指示器は通常オートキャンセル式ではなく、運転手が消し忘れることが時々あるためです。
- id: 237
  category: sharing_the_road
  question: 運転手が自転車を追い越す際、最低限空けなければならない安全な間隔はどれくらいですか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 5フィート
  answer: C
  explanation: 運転手は、自転車の横に安全な間隔がある場合に自転車を追い越すことができます。その間隔は最低3フィートです。
- id: 238
  category: sharing_the_road
  question: 道路上で自転車が並走することに関する一般的な規則は何ですか？
  choices:
    A: 常に1列で走行しなければならない
    B: 最大3台まで並走できる
    C: 自転車専用道を除き、2台を超えて並走してはならない
    D: 車線の幅が許す限り何台でも並走できる
  answer: C
  explanation: 自転車は、自転車専用に設けられた道や道路の一部を除き、2台を超えて並走してはなりません。
- id: 239
  category: sharing_the_road
  question: 運転手が自転車道や自転車レーンを横切ることが許可されるのはどのような場合ですか？
  choices:
    A: 100フィート手前で右左折の準備をする場合
    B: 遅い自動車を追い越す場合
    C: 右左折する場合、または路地、私道、専用道路に出入りする場合のみ
    D: 自転車レーンに自転車がいない場合はいつでも
  answer: C
  explanation: 運転手が自転車道や自転車レーンを横切ることができるのは、右左折する場合、または路地、私道、専用道路に出入りする場合のみです。
- id: 240
  category: signs_and_signals
  question: 路面にある「シャロー（Sharrow）」マークの目的は何ですか？
  choices:
    A: 自転車専用レーンであることを示すため
    B: 前方に横断歩道があることを運転手に警告するため
    C: 自転車が駐車車両から離れた位置を走行できるようにし、運転手に自転車がいることを予測させるため
    D: 自転車の指定駐輪場をマークするため
  answer: C
  explanation: シャロー（Sharrow）マークは、自転車が駐車車両から離れた位置を走行できるように支援し、他の道路利用者に自転車が走行車線を通行することを予測させることを目的としています。
- id: 241
  category: signs_and_signals
  question: 道路上の赤く塗られた舗装は何を示していますか？
  choices:
    A: 自転車専用レーン
    B: バス、タクシー、またはその他の公共交通機関専用のレーン
    C: 駐車禁止区域
    D: 前方に一時停止標識または信号機があること
  answer: B
  explanation: 赤く塗られた舗装は、バス、タクシー、またはその他の公共交通機関専用に指定されたバスレーンやトランジットレーンの視認性を高めるために使用されることがあります。
- id: 242
  category: safe_driving_rules
  question: 警察官が交差点で交通整理をしており、青信号と矛盾する指示を出した場合、どうしなければなりませんか？
  choices:
    A: 信号機に従う
    B: 警察官の指示に従う
    C: 信号が赤に変わるまで待ってから進む
    D: クラクションを鳴らして、青信号であることを警察官に知らせる
  answer: B
  explanation: 警察官の指示は、信号機や標識と異なる場合があります。そのような場合は、警察官の指示に従わなければなりません。
- id: 243
  category: safe_driving_rules
  question: 縦列駐車を始める際、空きスペースの前に駐車している車両からどのくらい離れた位置に自分の車を停めるべきですか？
  choices:
    A: 少なくとも1フィート
    B: 少なくとも2フィート
    C: 少なくとも3フィート
    D: 少なくとも4フィート
  answer: B
  explanation: 縦列駐車をする際は、空きスペースの前に駐車している車両と平行に自分の車を配置し、その車両から少なくとも2フィートの距離を保つ必要があります。
- id: 244
  category: penalties_and_points
  question: ハザードランプを点滅させて停車している故障車に対して、車線を変更するか適切に減速することを怠った場合の罰則は何ですか？
  choices:
    A: クラスAの違反 (Class A Infraction)
    B: クラスBの違反 (Class B Infraction)
    C: クラスCの違反 (Class C Infraction)
    D: クラスAの軽犯罪 (Class A Misdemeanor)
  answer: B
  explanation: ハザードランプを点滅させて停車している故障車に接近する運転者は、車線を変更するか、制限速度より10 mph低い速度まで減速しなければなりません。これを怠るとクラスBの違反（Class
    B Infraction）となります。
- id: 245
  category: sharing_the_road
  question: 自転車専用レーンがある場合、自転車利用者はそこを走行する義務がありますか？
  choices:
    A: はい、常に自転車専用レーンを使用しなければなりません
    B: はい、ただし自転車専用レーンが障害物で塞がれている場合を除きます
    C: いいえ、自転車専用レーンと車線のどちらを使用する権利もあります
    D: いいえ、ただし時速15マイル（15 mph）以上で走行している場合に限ります
  answer: C
  explanation: 自転車利用者は自転車専用レーンと車線のどちらを使用する権利も持っているため、指定された自転車専用レーンを走行する義務はありません。
- id: 246
  category: safe_driving_rules
  question: 下り坂に向かって駐車する場合、車のタイヤをどちらに向けるべきですか？
  choices:
    A: 縁石から遠ざける方向
    B: 縁石の方向
    C: 縁石と平行
    D: 車道の方向
  answer: B
  explanation: 下り坂に向かって駐車する場合は、車のタイヤを縁石の方向に向けます。
- id: 247
  category: safe_driving_rules
  question: 縁石のない上り坂に向かって駐車する場合、タイヤをどちらに向けるべきですか？
  choices:
    A: 車道の方向
    B: 車道と平行
    C: 車道から遠ざける方向
    D: まっすぐ前
  answer: C
  explanation: 縁石がない場合、上り坂に向かって駐車する際は、車のタイヤを車道から遠ざける方向に向けます。
- id: 248
  category: safe_driving_rules
  question: 車を後退（バック）させる際の正しいテクニックは何ですか？
  choices:
    A: ルームミラーのみに頼る
    B: 体を左にひねり、サイドウィンドウから外を見る
    C: 体を右にひねり、リアウィンドウ（後ろの窓）から後ろを見る
    D: サイドミラーのみを使用する
  answer: C
  explanation: 後退する際は、体を右にひねり、リアウィンドウから後ろを見ます。後退時にルームミラーのみを使用することは絶対に避けてください。
- id: 249
  category: safe_driving_rules
  question: 次のうち、違法な駐車区域はどれですか？
  choices:
    A: 消火栓から15フィート以内
    B: 消火栓から25フィート以内
    C: 踏切から50フィート以内
    D: 白い縁石の隣
  answer: A
  explanation: 消火栓から15フィート以内、または消防車線（ファイヤーレーン）での駐車は禁止されています。
- id: 250
  category: sharing_the_road
  question: 歩行者が視覚障害者であることを示すことが多い移動補助具は何ですか？
  choices:
    A: 黄色いジャケットまたは反射ベスト
    B: 白杖または訓練された盲導犬
    C: 赤い杖または電動車椅子
    D: 点滅するライトまたは歩行器
  answer: B
  explanation: 視覚障害者の移動補助具は、多くの場合、白杖または訓練された盲導犬です。
- id: 251
  category: vehicle_information
  question: 運転者および助手席の同乗者がシートベルトを着用した場合、生存率は何パーセント上昇しますか？
  choices:
    A: 25パーセント
    B: 35パーセント
    C: 45パーセント
    D: 50パーセント
  answer: C
  explanation: 運転者および助手席の同乗者がシートベルトを着用した場合、生存率は45パーセント上昇します。
- id: 252
  category: safe_driving_rules
  question: 安全性を最大限に高めるため、運転者はハンドルからどのくらい離れて座るべきですか？
  choices:
    A: 少なくとも6インチ離れる
    B: 少なくとも10インチ離れる
    C: 少なくとも12インチ離れる
    D: 快適に運転できる範囲でできるだけ近づく
  answer: C
  explanation: 安全性を最大限に高めるため、運転者はハンドルから少なくとも12インチ離れて座る必要があります。
- id: 253
  category: safe_driving_rules
  question: 次のうち、シートベルトの着用が免除されているのは誰ですか？
  choices:
    A: 乗用車の後部座席の同乗者
    B: 長距離移動中の商用車の運転者
    C: 配達のために停車する新聞配達員
    D: 車で通学する10代の運転者
  answer: C
  explanation: 車両から配達するために停車する新聞配達員や新聞の束を運ぶ業者は、シートベルトの着用が免除されています。
- id: 254
  category: driver_responsibility
  question: インディアナ州法では、何歳未満の同乗者がチャイルドシート（幼児用補助装置）に適切に固定されることが義務付けられていますか？
  choices:
    A: 6歳
    B: 7歳
    C: 8歳
    D: 10歳
  answer: C
  explanation: 8歳未満の同乗者は、チャイルドシートやジュニアシートなどの幼児用補助装置に適切に固定されることが法律で義務付けられています。
- id: 255
  category: vehicle_information
  question: 助手席にエアバッグが装備されている車の場合、全米安全評議会（National Safety Council）は何歳未満の子供を後部座席に乗せることを推奨していますか？
  choices:
    A: 8歳
    B: 10歳
    C: 12歳
    D: 14歳
  answer: C
  explanation: 助手席にエアバッグが装備されている車の場合、全米安全評議会は12歳未満の子供を後部座席に乗せることを推奨しています。
- id: 256
  category: vehicle_information
  question: 日の出から日没までの間に、車両の積載物が車両の後端から4フィート以上はみ出している場合、その後端には何を取り付けなければなりませんか？
  choices:
    A: 500フィート先から見える赤いランプ
    B: 12平方インチ以上の赤い旗
    C: 2つの点滅する黄色いライト
    D: 「Wide Load（幅広積載物）」の標識
  answer: B
  explanation: 日の出から日没までの間は、積載物の最後端に赤い旗を取り付けなければなりません。この赤い旗は12平方インチ以上でなければなりません。
- id: 257
  category: defensive_driving
  question: 昼間に車が故障した場合、2つの赤い旗をどこに表示しなければなりませんか？
  choices:
    A: 車の前方50フィートおよび後方50フィート
    B: 車の前方100フィートおよび後方100フィート
    C: 車の前方200フィートおよび後方200フィート
    D: 車の屋根とトランクの上
  answer: B
  explanation: 昼間に車が故障した場合、運転者は2つの赤い旗を表示しなければなりません。1つは車の前方約100フィート、もう1つは後方約100フィートの場所です。
- id: 258
  category: defensive_driving
  question: カーブや丘の頂上から500フィート以内の場所に車を停止させた場合、どのくらい離れた場所に警告装置を設置しなければなりませんか？
  choices:
    A: 車から少なくとも100フィート
    B: 車から少なくとも200フィート
    C: 車から少なくとも300フィート
    D: 車から少なくとも500フィート
  answer: D
  explanation: カーブ、丘の頂上、またはその他の障害物から500フィート以内の場所に車を停止させた場合、車から少なくとも500フィート離れた場所に警告装置を設置しなければなりません。
- id: 259
  category: safe_driving_rules
  question: 安全性を最大限に高めるため、シートベルトは体のどの部分に着用すべきですか？
  choices:
    A: 胃の高い位置と脇の下
    B: 腰の低い位置と鎖骨の上を平らに通す
    C: ウエストと首の周りに緩く通す
    D: 腰の高い位置と胸の上
  answer: B
  explanation: すべての人が、シートベルトを腰の低い位置に合わせ、鎖骨の上を平らに通して着用する必要があります。
- id: 260
  category: safe_driving_rules
  question: 中央分離帯のある幹線道路（ディバイデッド・ハイウェイ）で車が故障した場合、車からどのくらい離れた場所に警告装置を設置しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: マニュアルによると、中央分離帯のある幹線道路で車が故障した場合、緊急警告装置は車から200フィート離れた場所に設置しなければなりません。
- id: 261
  category: defensive_driving
  question: インディアナ州におけるすべての衝突事故で最も一般的な要因は何ですか？
  choices:
    A: スピード違反
    B: 飲酒・薬物運転
    C: 優先権（Right of way）を譲らないこと
    D: わき見運転
  answer: C
  explanation: マニュアルによると、インディアナ州におけるすべての衝突事故の中で、優先権を譲らないことが最も一般的な要因であると記載されています。
- id: 262
  category: driver_responsibility
  question: 事故後、車を幹線道路（ハイウェイ）から移動させるべきではないのはどのような状況ですか？
  choices:
    A: ラッシュアワーの渋滞中に事故が発生した場合
    B: 事故に危険物の輸送が関与している場合
    C: 車がパンクしている場合
    D: 相手の運転手が車の移動を拒否した場合
  answer: B
  explanation: 事故に危険物の輸送が関与している場合、または負傷、死亡、車内への閉じ込めが発生した場合は、運転手は車を移動させるべきではありません。
- id: 263
  category: driver_responsibility
  question: 持ち主のいない駐車車両に衝突し、持ち主が見つからない場合、どうしなければなりませんか？
  choices:
    A: フロントガラスにメモを残して走り去る
    B: レッカー車を呼んで車を撤去する
    C: 法執行機関（警察）に電話して情報を提供する
    D: 現場でちょうど1時間待ってから立ち去る
  answer: C
  explanation: 持ち主のいない車両と衝突し、持ち主が見つからない場合は、情報を提供するために法執行機関（警察）に電話しなければなりません。
- id: 264
  category: license_system
  question: 事故後、経済的責任を証明するために、保険会社がBMV（車両管理局）に電子的に提出しなければならない書類は何ですか？
  choices:
    A: 遵守証明書 (COC)
    B: 賠償責任証明書 (POL)
    C: 事故報告書 (ARF)
    D: 車両登録証明書 (VRC)
  answer: A
  explanation: 保険会社は、遵守証明書（COC）の形式で経済的責任の証明を電子的に提出しなければなりません。
- id: 265
  category: defensive_driving
  question: 衝突が避けられない場合、衝撃を最小限に抑えるための最も安全な選択肢は次のうちどれですか？
  choices:
    A: 衝撃を吸収するもの（壊れやすいもの）よりも、硬いものにぶつかる
    B: 反対方向に動いているものにぶつかる
    C: 同じ方向に動いているものよりも、動いていないものにぶつかる
    D: 動いていないものよりも、自分と同じ方向に動いているものにぶつかる
  answer: D
  explanation: マニュアルでは、動いていないものよりも自分と同じ方向に動いているものにぶつかること、そして衝撃を吸収してくれる（壊れやすい）ものにぶつかることを推奨しています。
- id: 266
  category: safe_driving_rules
  question: 車の車輪が道路の路肩にはみ出した場合、取るべき正しい行動は何ですか？
  choices:
    A: ハンドルを急に切って舗装路に戻る
    B: ブレーキを強く踏んで直ちに停止する
    C: 路肩に沿って走り、アクセルペダルを緩め、徐々に道路に戻る
    D: 加速して安全に交通の流れに合流する
  answer: C
  explanation: 車輪が路肩にはみ出した場合、すぐに戻ろうとしてはいけません。代わりに、路肩に沿って走り、アクセルペダルを緩めます。減速した後、徐々に道路に戻ってください。
- id: 267
  category: defensive_driving
  question: 車が水没した場合、ドアを開けようとするべきではないのはなぜですか？
  choices:
    A: 電気系統が即座にショートするから
    B: 水の重みで開けるのがほぼ不可能になり、開いたドアから車内に水が流れ込むから
    C: ドアロックが自動的に作動して開かなくなるから
    D: 車が瞬時に沈む原因になるから
  answer: B
  explanation: 水の重みでドアを開けることはほぼ不可能になり、開いたドアから車内に水が流れ込むためです。
- id: 268
  category: alcohol_drugs_health
  question: 次の行動のうち、運転手が影響下（飲酒や薬物など）にある可能性がある兆候はどれですか？
  choices:
    A: 大雨の中で制限速度を少し下回って運転する
    B: 大回りをして曲がり、センターラインをまたいで運転する
    C: 常に方向指示器（ウィンカー）を使用する
    D: 日中にヘッドライトを点灯して運転する
  answer: B
  explanation: 車が大回りをして曲がったり、センターラインをまたいだり、蛇行したり、その他の異常な行動を示したりする場合、運転手は影響下（飲酒や薬物など）にある可能性があります。
- id: 269
  category: safe_driving_rules
  question: 緊急時に路肩で車から降りなければならない場合、どのように降りるべきですか？
  choices:
    A: できるだけ早く運転席側から降りる
    B: 周囲の状況を確認した後、助手席側から降りる
    C: 目立つようにサンルーフから這い出る
    D: 警察官が到着してドアを開けるまで待つ
  answer: B
  explanation: 路肩で車から降りなければならない場合は、他の車や障害物がないか周囲の状況を確認した上で、助手席側から降りてください。
- id: 270
  category: vehicle_information
  question: 運転中にタイヤがパンク（バースト）した場合、どうするべきですか？
  choices:
    A: すぐにブレーキを強く踏む
    B: ハンドルを急に右に切る
    C: ハンドルをしっかりと握り、アクセルペダルから足を離し、ブレーキは踏まない
    D: ニュートラルに入れ、ポンピングブレーキをする
  answer: C
  explanation: タイヤがパンク（バースト）した場合は、ハンドルをしっかりと握り、車をまっすぐに保ちます。徐々に減速し、アクセルペダルから足を離しますが、ほぼ停止するまでブレーキを踏まないでください。
- id: 271
  category: vehicle_information
  question: 車の従来のディスクブレーキまたはドラムブレーキが突然故障した場合、最初にすべきことは何ですか？
  choices:
    A: 低いギアにシフトダウンし、ブレーキペダルを速く強くポンピングする
    B: すぐにイグニッションをオフにする
    C: パーキングブレーキをできるだけ強く引く
    D: 最寄りの溝にハンドルを切る
  answer: A
  explanation: ブレーキが突然故障した場合は、可能であれば低いギアにシフトダウンし、ブレーキペダルを速く強く数回ポンピングしてブレーキ圧を高める必要があります。
- id: 272
  category: safe_driving_rules
  question: 運転者の視界が遮られる可能性のあるカーブや丘の頂上から500フィート以内で車が動かなくなった場合、緊急警告表示板はどこに置くべきですか？
  choices:
    A: 車から100フィートの場所
    B: 車から200フィートの場所
    C: 車から少なくとも500フィートの場所
    D: 車の屋根の上に直接置く
  answer: C
  explanation: カーブや丘の頂上など、運転者の視界が遮られる可能性のある場所から500フィート以内で車が動かなくなった場合は、車から少なくとも500フィート離れた場所に警告表示板を設置してください。
- id: 273
  category: defensive_driving
  question: 車が水没し、脱出する必要がある場合はどうすべきですか？
  choices:
    A: 車内が完全に水で満たされるのを待ってからドアを開ける
    B: シートベルトを外し、窓を開けて屋根に移動する
    C: 脱出する前に貴重品を集める
    D: 救急隊員が到着しそうであっても、すぐに岸に向かって泳ぐ
  answer: B
  explanation: 車が水没した場合は、シートベルトを外し、窓を開けて車から脱出し、屋根に移動してください。貴重品を集めるために車内に戻ることは絶対に避け、岸に向かって泳ぐのは最終手段としてのみ行ってください。
- id: 274
  category: vehicle_information
  question: 走行中にイグニッションをロック位置に回してはいけないのはなぜですか？
  choices:
    A: エンジンがオーバーヒートする原因になるため。
    B: トランスミッションに永久的な損傷を与えるため。
    C: ハンドルを切ったときにステアリングがロックされ、コントロールを失う原因になるため。
    D: ブレーキが即座にロックされ、スリップを引き起こすため。
  answer: C
  explanation: ステアリングホイールのインターロックシステムを搭載した車を運転している際、走行中にイグニッションをロック位置に回すと、ハンドルを切ったときにステアリングがロックされ、車のコントロールを失う原因になります。
- id: 275
  category: safe_driving_rules
  question: 車の盗難の可能性を減らすために、どのように駐車すべきですか？
  choices:
    A: 前輪を左に鋭く切った状態にする。
    B: 前輪を右に鋭く切り、エマージェンシーブレーキ（パーキングブレーキ）をかける。
    C: 換気のために窓を少し開けた状態にする。
    D: ギアをニュートラルにし、エマージェンシーブレーキをかける。
  answer: B
  explanation: 車の盗難の可能性を減らすため、マニュアルでは前輪を右に鋭く切り、エマージェンシーブレーキ（パーキングブレーキ）をかけて駐車することを推奨しています。
- id: 276
  category: driver_responsibility
  question: 警察官に車を止められる際、最初にどのようにして警察官の存在に気づいたことを知らせるべきですか？
  choices:
    A: すぐにハザードランプを点灯させる。
    B: 窓から手を出して振る。
    C: 右の方向指示器（ウィンカー）を点灯させる。
    D: クラクションを2回鳴らす。
  answer: C
  explanation: 右の方向指示器（ウィンカー）を点灯させて、警察官の存在に気づいたことを知らせるべきです。これにより、あなたが警察官の存在を認識していることが伝わります。
- id: 277
  category: safe_driving_rules
  question: 高速道路（フリーウェイ）で警察官に車を止められた場合、どこに車を停めるべきですか？
  choices:
    A: 道路の右側の路肩。
    B: 中央分離帯。
    C: 最も右側の走行車線。
    D: 道路の左側の路肩。
  answer: A
  explanation: 車を道路の右側の路肩に移動させる必要があります。高速道路の中央分離帯に停めてはいけません。運転者と警察官の双方を危険にさらすことになります。
- id: 278
  category: safe_driving_rules
  question: 夜間に警察官に車を止められた場合、何をすることが推奨されていますか？
  choices:
    A: ヘッドライトを消す。
    B: ハイビームを点灯させる。
    C: 車内のルームランプを点灯させる。
    D: 警察官から見えるように車から降りる。
  answer: C
  explanation: 夜間に車を止められた場合は、車内のルームランプを点灯させ、明るい場所を探して車を停めることが推奨されています。
- id: 279
  category: safe_driving_rules
  question: 交通取締りで車を止める際、安全に停められる場所がすぐに見つからない場合はどうすべきですか？
  choices:
    A: 安全な場所が現れるまで速度を維持する。
    B: 減速し、ハザードランプを点灯させる。
    C: 走行車線の真ん中で停止する。
    D: 次の出口に早く着くために加速する。
  answer: B
  explanation: 安全な場所がすぐに見つからない場合は、減速してハザードランプを点灯させてください。これにより、警察官の存在を認識しており、安全に停止できる場所を積極的に探していることを警察官に伝えることができます。
- id: 280
  category: driver_responsibility
  question: 交通取締りで車を止められた際、運転者と同乗者は手をどこに置いておくべきですか？
  choices:
    A: 運転者は両手をハンドルに置き、同乗者は両手が見えるように膝の上に置く。
    B: 全員が両手を空中に挙げる。
    C: 両手をポケットに入れるか、見えない場所に隠す。
    D: 運転者はすぐにグローブボックスに手を伸ばす。
  answer: A
  explanation: 運転者は両手をハンドルに置き、同乗者は両手が見えるように膝の上に置いておくべきです。手が見えないと、警察官に脅威を感じさせる可能性があります。
- id: 281
  category: driver_responsibility
  question: 交通違反の取り締まり（トラフィックストップ）の際、保険証明書が携帯電話に保存されている場合、どうすべきですか？
  choices:
    A: 警察官が近づいてくる前に、急いで携帯電話を手に取る。
    B: 警察官が歩み寄ってきたら、窓から携帯電話を差し出す。
    C: まず警察官にその旨を伝え、指示に従ってから携帯電話を取り出す。
    D: 警察官は携帯電話を見ることはできないため、提示を拒否する。
  answer: C
  explanation: 保険証明書が携帯電話に保存されている場合、まず警察官にその旨を伝え、警察官の指示に従ってから情報を取り出すようにしてください。
- id: 282
  category: penalties_and_points
  question: 警察官から発行された交通違反切符（トラフィックチケット）に署名することは、何を意味しますか？
  choices:
    A: 自分の有罪を認めること。
    B: 交通裁判所での裁判を受ける権利を放棄すること。
    C: 単に違反切符を受け取ったことの確認。
    D: 停止させられた理由に同意すること。
  answer: C
  explanation: 違反切符への署名は、運転者が有罪を認めるものではなく、単に違反切符を受け取ったことを確認するものです。
- id: 283
  category: alcohol_drugs_health
  question: 一酸化炭素中毒の症状は次のうちどれですか？
  choices:
    A: 車内に排気ガスの強い臭いがする。
    B: 光に対する過敏性が増す。
    C: 突然エネルギーが湧いてくる。
    D: 肌や唇が赤みがかる。
  answer: B
  explanation: 一酸化炭素中毒の症状には、眠気やめまい、肌や唇が青白くなること、頭痛、光に対する過敏性の増加などがあります。一酸化炭素は目に見えず、臭いも味もありません。
- id: 284
  category: safe_driving_rules
  question: 渋滞の中を運転する際、一酸化炭素中毒を防ぐにはどうすればよいですか？
  choices:
    A: すべての窓を全開にする。
    B: 車のヒーターを最大にする。
    C: 外気導入ベントを閉じる。
    D: 外気導入ベントを開ける。
  answer: C
  explanation: 渋滞時に一酸化炭素中毒を防ぐには、他の車の排気ガスを吸い込まないように外気導入ベントを閉じる必要があります。
- id: 285
  category: signs_and_signals
  question: マニュアルの交通規則によると、赤信号で合法的に左折できるのはどのような場合ですか？
  choices:
    A: 他の車両がいない場合。
    B: 一方通行の道路から別の一方通行の道路へ曲がる場合。
    C: 他の運転手がクラクションを鳴らした場合。
    D: いかなる場合も左折できない。
  answer: B
  explanation: 赤信号での合法的な左折は、運転者が一方通行の道路から別の一方通行の道路へ曲がる場合に許可されます。
- id: 286
  category: sharing_the_road
  question: 時速55マイル（55 mph）で走行し、ブレーキが過熱している満載のトラクタートレーラーが停止するまでに、どのくらいの距離が必要になる場合がありますか？
  choices:
    A: 50フィート以上。
    B: 100フィート以上。
    C: 200フィート以上。
    D: 400フィート以上。
  answer: D
  explanation: 時速55マイル（55 mph）で走行し、ブレーキが過熱している満載のトラクタートレーラーは、停止するまでに400フィート以上かかる場合があります。
- id: 287
  category: safe_driving_rules
  question: インディアナ州法によると、車両のヘッドライトを点灯しなければならないのはどの時間帯ですか？
  choices:
    A: 日没から日の出までの間、および視界が500フィート未満のとき
    B: 午後6時30分から午前6時30分までの間
    C: 運転者が疲れているときはいつでも
    D: 街灯のない郊外の道路を運転しているときのみ
  answer: A
  explanation: インディアナ州法では、日没から日の出までの間、および視界が500フィート未満の場合、車両のヘッドライトを点灯することが義務付けられています。
- id: 288
  category: safe_driving_rules
  question: 曲がろうとしている道路に複数の車線がある場合、どの車線から曲がるべきですか？
  choices:
    A: 中央の車線
    B: 曲がる方向から最も遠い車線
    C: 曲がる方向に最も近い車線
    D: 方向指示器（ウィンカー）を使用していれば、どの車線でもよい
  answer: C
  explanation: 複数の車線がある道路から曲がる場合は、曲がる方向に最も近い車線から曲がる必要があります。
- id: 289
  category: safe_driving_rules
  question: 標識等で別の指示がない限り、郊外の州道分離多車線道路（rural state divided highway）の制限速度は時速何マイルですか？
  choices:
    A: 時速50マイル
    B: 時速55マイル
    C: 時速60マイル
    D: 時速65マイル
  answer: C
  explanation: 標識等で別の指示がない限り、郊外の州道分離多車線道路の制限速度は時速60マイルです。
- id: 290
  category: safe_driving_rules
  question: 標識等で別の指示がない限り、都市部の外にある州間高速道路（interstate）での乗用車の最高制限速度は時速何マイルですか？
  choices:
    A: 時速55マイル
    B: 時速60マイル
    C: 時速65マイル
    D: 時速70マイル
  answer: D
  explanation: 標識等で別の指示がない限り、都市部の外にある州間高速道路での乗用車の最高制限速度は時速70マイルです。
- id: 291
  category: safe_driving_rules
  question: 夜間運転時、前方の車両に何フィート以内の距離まで近づいて追従する場合、ロービーム（下向き）ヘッドライトを使用しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 夜間運転時、前方の車両に200フィート以内の距離で追従する場合は、ロービームヘッドライトを使用しなければなりません。
- id: 292
  category: safe_driving_rules
  question: 夜間運転時、対向車に何フィート以内の距離まで近づいた場合、ロービーム（下向き）ヘッドライトを使用しなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: D
  explanation: 対向車に500フィート以内の距離まで近づいた場合は、ロービームヘッドライトを使用しなければなりません。
- id: 293
  category: defensive_driving
  question: タイヤがパンクしたりバースト（破裂）したりした状況では、どうするべきですか？
  choices:
    A: すぐにブレーキをかける
    B: ハンドルをしっかりと握り、車をまっすぐ進ませる
    C: 走行速度を上げる
    D: 目的地に到着するまでホイールのリムで走り続ける
  answer: B
  explanation: タイヤがパンクしたりバーストしたりした状況では、ハンドルをしっかりと握り、車をまっすぐ進ませる必要があります。
- id: 294
  category: license_system
  question: 営業用（for-hire）の免許条件（endorsement）で貨物を有償で運送する場合、車両の車両総重量の制限はどれくらいですか？
  choices:
    A: 16,000ポンドを超えてはならない
    B: 26,000ポンドを超えてはならない
    C: 26,000ポンドを超えなければならない
    D: 28,000ポンドを超えなければならない
  answer: B
  explanation: 営業用の免許条件で貨物を有償で運送する場合、車両の総重量は26,000ポンドを超えてはなりません。
- id: 295
  category: safe_driving_rules
  question: 旅客を有償で運送する車両は、踏切から何フィート以内で一時停止することが義務付けられていますか？
  choices:
    A: 5～45フィート
    B: 10～40フィート
    C: 15～50フィート
    D: 20～60フィート
  answer: C
  explanation: 旅客を有償で運送する車両は、踏切から15～50フィート以内で一時停止しなければなりません。
- id: 296
  category: vehicle_information
  question: トラック、バス、またはトラクタートレーラーが車道や路肩で故障して動けなくなった場合、許容される警告装置は次のうちどれですか？
  choices:
    A: 連邦規格に適合した双方向の緊急用反射三角表示板3つ
    B: 液体燃焼式発炎筒3本
    C: 少なくとも6本の発炎筒（ヒューズ式）
    D: すべての答えが正しい
  answer: D
  explanation: 故障したトラック、バス、またはトラクタートレーラーの許容される警告装置には、連邦規格に適合した双方向の緊急用反射三角表示板3つ、液体燃焼式発炎筒3本、または少なくとも6本の発炎筒（ヒューズ式）が含まれます。したがって、すべての答えが正解です。
- id: 297
  category: signs_and_signals
  question: 警察官が交通整理を行っており、その指示が交通信号や標識と異なる場合、どうするべきですか？
  choices:
    A: 交通標識や信号に従う
    B: 警察官の指示に従う
    C: 減速せずに進み続ける
    D: ソーシャルメディアで警告を投稿する
  answer: B
  explanation: 警察官が交通整理を行っている場合は、交通信号や標識と異なる場合であっても、警察官の指示に従わなければなりません。
- id: 298
  category: license_system
  question: 新しい運転免許証を申請する際、インディアナ州の居住を証明する書類をいくつ提示しなければなりませんか？
  choices:
    A: 1つ
    B: 2つ
    C: 3つ
    D: 4つ
  answer: B
  explanation: 新しい運転免許証、仮免許証（learner's permit）、または身分証明書を取得するには、インディアナ州の居住を証明する書類を2つ提示しなければなりません。
- id: 299
  category: license_system
  question: 社会保障番号（SSN）を証明するための有効な書類は、次のうちどれですか？
  choices:
    A: 公共料金の請求書
    B: W-2フォーム（源泉徴収票）
    C: 銀行の取引明細書
    D: インディアナ州の有権者登録カード
  answer: B
  explanation: マニュアルによると、氏名と完全な社会保障番号が記載された有効な書類には、社会保障カード、W-2フォーム、1099フォーム、非SSA 1099フォーム、またはあらかじめ印刷された給与明細書が含まれます。
- id: 300
  category: license_system
  question: インディアナ州の居住を証明するための公共料金のコンピューター作成の請求書は、どれくらい最近のものでなければなりませんか？
  choices:
    A: 申請日から30日以内に発行されたもの
    B: 申請日から60日以内に発行されたもの
    C: 申請日から90日以内に発行されたもの
    D: 申請日から1年以内に発行されたもの
  answer: B
  explanation: マニュアルには、公共料金のコンピューター作成の請求書は、申請日から60日以内に発行されたものであり、氏名と居住地の住所が記載されていなければならないと記載されています。
- id: 301
  category: license_system
  question: BMV（車両管理局）の書類において、私書箱を居住地住所として使用できるのはどのような条件の場合ですか？
  choices:
    A: 申請者がすべての郵便物をそこで受け取っている場合
    B: 申請者がホームレスである場合
    C: 申請者がインディアナ州司法長官の住所秘匿プログラム（Address Confidentiality Program）に登録している場合
    D: いかなる状況でも私書箱を使用することはできない
  answer: C
  explanation: 申請者がインディアナ州司法長官の住所秘匿プログラムに登録していない限り、私書箱を居住地住所として使用することはできません。
- id: 302
  category: license_system
  question: 親戚や友人と同居しており、居住地を証明する書類を2点提出できない場合、その親戚や友人は何をしなければなりませんか？
  choices:
    A: BMVの支局でインディアナ州居住宣誓書（Indiana Residency Affidavit）に署名する
    B: 自身のソーシャルセキュリティカード（社会保障カード）を提示する
    C: 公式なレターヘッドで手紙を書く
    D: 居住地確認手数料を支払う
  answer: A
  explanation: 親戚や友人と同居している場合、同居している親戚または友人がBMVの支局でインディアナ州居住宣誓書に署名する必要があります。
- id: 303
  category: license_system
  question: 英語以外の言語で書かれた書類をBMVに提出する場合、何が必要ですか？
  choices:
    A: 支局での家族による口頭翻訳
    B: 承認された機関のレターヘッドにタイプされた完全な翻訳
    C: 原本を公証したコピー
    D: 友人による翻訳
  answer: B
  explanation: 翻訳は、政府機関、認可された教育機関、または翻訳会社のレターヘッドを使用した別紙にタイプされていなければなりません。
- id: 304
  category: license_system
  question: BMVへの申請書類の翻訳を行うことが明確に禁止されているのは誰ですか？
  choices:
    A: 政府機関
    B: 認可された教育機関
    C: 翻訳会社
    D: 家族、友人、または仕事関係者
  answer: D
  explanation: 翻訳者は、その書類が家族、友人、または仕事関係者のために翻訳されたものではないことを明記しなければなりません。
- id: 305
  category: defensive_driving
  question: マニュアルによると、10代のドライバーによる衝突事故の最も一般的な要因は何ですか？
  choices:
    A: 速度超過
    B: 危険で無謀な運転および注意力散漫
    C: 他の10代の若者との同乗
    D: シートベルトの非着用
  answer: B
  explanation: マニュアルには、危険で無謀な運転および注意力散漫が、10代の衝突事故の最も一般的な要因であると記載されています。
- id: 306
  category: defensive_driving
  question: 10代のドライバーが車に同乗者を乗せている場合、衝突事故の確率はどうなりますか？
  choices:
    A: 目が増えるためわずかに減少する
    B: 1人で運転している時と同じである
    C: 同乗者が1人増えるごとに2倍になる
    D: 同乗者が1人増えるごとに3倍になる
  answer: C
  explanation: 衝突事故の確率は、車内に同乗者が1人増えるごとに2倍になります。
- id: 307
  category: safe_driving_rules
  question: 10代のドライバーが関与する複数車両の衝突事故は、主にどこで発生しますか？
  choices:
    A: 高速道路
    B: 駐車場
    C: 交差点
    D: 郊外の道路
  answer: C
  explanation: 10代のドライバーが関与する複数車両の衝突事故の多くは交差点で発生します。10代のドライバーは、交差点では気を散らさず、他の車両に集中する必要があります。
- id: 308
  category: safe_driving_rules
  question: マニュアルで、運転中に大音量で音楽を流さないよう推奨しているのはなぜですか？
  choices:
    A: 車のバッテリーを消耗させるため
    B: インディアナ州では違法であるため
    C: サイレンやクラクションの音を聞き逃す可能性があるため
    D: ドライバーの速度超過を招くため
  answer: C
  explanation: 大音量で音楽を流さないでください。起こりうるトラブルを警告するサイレンやクラクションの音を聞き逃す可能性があります。
- id: 309
  category: defensive_driving
  question: 10代のドライバーが関与する単独車両事故の一般的な要因は何ですか？
  choices:
    A: 不注意
    B: 速度超過
    C: 他の10代の若者との同乗
    D: ラジオの調整
  answer: B
  explanation: 速度超過です。違法または危険な速度は、単独車両事故の一般的な要因です。
- id: 310
  category: license_system
  question: ソーシャルセキュリティナンバー（社会保障番号）の取得資格がない場合、その代わりにどのような書類の提出を求められることがありますか？
  choices:
    A: 有効なI-94
    B: W-2フォーム（源泉徴収票）
    C: 1099フォーム
