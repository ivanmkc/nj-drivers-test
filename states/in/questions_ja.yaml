  explanation: ホームレスの申請者は、政府機関または非営利団体のレターヘッドに、その名称、住所、電話番号、および法的代表者の氏名、署名、署名日が記載された証明書を提出する必要があります。
- id: 313
  category: driver_responsibility
  question: 座席とミラーを調整するのに最適なタイミングはいつですか？
  choices:
    A: 赤信号で停車しているとき
    B: 毎回運転を始める前
    C: 低速で運転しているとき
    D: 新しい車を運転するときのみ
  answer: B
  explanation: マニュアルでは、毎回運転を始める前に、常に最適な視界が得られるように座席とミラーを調整することを推奨しています。
- id: 314
  category: safe_driving_rules
  question: ラジオの調整は、車が停止するまで待つべきなのはなぜですか？
  choices:
    A: 車が動いているときに操作すると、車のバッテリーを消耗するからです。
    B: ほんの数秒でも道路から注意をそらすと、衝突事故につながる可能性があるからです。
    C: 車が動いている間はラジオの電波が弱くなるからです。
    D: インディアナ州では運転中にラジオに触れることは違法だからです。
  answer: B
  explanation: マニュアルには、ほんの数秒でも道路から注意をそらすと衝突事故につながる可能性があるため、ラジオの調整は車が停止するまで待つ方が良いと記載されています。
- id: 315
  category: safe_driving_rules
  question: 運転中に大音量で音楽を流すことの潜在的な危険性は何ですか？
  choices:
    A: 起こりうるトラブルを警告するサイレンやクラクションの音を聞き逃す可能性がある。
    B: 時間の経過とともに車の電気系統に損傷を与える可能性がある。
    C: 運転者が無意識のうちに制限速度を超えて運転する原因となる。
    D: 騒音違反とみなされ、重罪となる。
  answer: A
  explanation: マニュアルによると、起こりうるトラブルを警告するサイレンやクラクションの音を聞き逃す可能性があるため、大音量で音楽を流すべきではありません。
- id: 316
  category: safe_driving_rules
  question: 次の行動のうち、運転中に行うことが法律違反であると明記されているものはどれですか？
  choices:
    A: ラジオの調整。
    B: 電話での通話やテキストメッセージの送信。
    C: 食事。
    D: 髪をとかすこと。
  answer: B
  explanation: マニュアルには「運転中に電話で話したり、テキストメッセージを送信したりしないでください。それは法律違反です」と明記されています。
- id: 317
