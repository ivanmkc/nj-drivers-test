questions:
- id: 1
  category: license_system
  question: インディアナ州の運転免許証、身分証明書（ID）、または仮免許証において、それがリアルID（Real ID）であることを示す視覚的な目印は何ですか？
  choices:
    A: 州の印章のホログラム
    B: 右上の星印
    C: 表面のバーコード
    D: 上部の青いストライプ
  answer: B
  explanation: マニュアルによると、リアルIDは運転免許証、身分証明書、仮免許証の右上にある星印によって示されます。
- id: 2
  category: license_system
  question: リアルIDを所持する利点は、次のうちどれですか？
  choices:
    A: CDL（商用運転免許証）なしで商用車を運転できる。
    B: 米国内の民間航空機に搭乗できる。
    C: 州間高速道路の通行料が免除される。
    D: パスポートなしで海外旅行ができる。
  answer: B
  explanation: マニュアルには、リアルIDがあれば米国内の民間航空機に搭乗できると記載されています。
- id: 3
  category: license_system
  question: 国内の民間航空機への搭乗に加えて、リアルIDで可能になることは何ですか？
  choices:
    A: 特定の連邦施設への立ち入りや軍事基地の訪問
    B: 空港の保安検査場の通過を省略する
    C: 別途免許を取得せずに船舶を操縦する
    D: 指定された身障者用駐車スペースに駐車する
  answer: A
  explanation: マニュアルには、リアルIDによって軍事基地の訪問や特定の連邦施設への立ち入りが可能になると明記されています。
- id: 4
  category: license_system
  question: インディアナ州の居住者は、リアルIDへのアップグレードに必要な書類に関する情報をどこで確認できますか？
  choices:
    A: BMV.IN.gov
    B: RealID.IN.gov
    C: Indiana.gov/ID
    D: HoosierDrive.com
  answer: B
  explanation: マニュアルでは、リアルIDへのアップグレードに必要な書類を確認するために、RealID.IN.govにアクセスするよう案内しています。
- id: 5
  category: license_system
  question: インディアナ州車両管理局（BMV）のミッションステートメントによると、BMVはどのように運転者および車両サービスを提供することを目指していますか？
  choices:
    A: 一般の運転者よりも商用車の運転者を優先する
    B: 安全性と透明性を確保しつつ、迅速かつ正確な方法で
    C: すべてのインディアナ州民に無料で証明書の再発行を提供する
    D: 完全にオンラインのプラットフォームを通じて
  answer: B
  explanation: BMVの使命は、安全性と透明性を確保しつつ、迅速かつ正確な方法で最高クラスの運転者および車両サービスを提供することにより、すべてのインディアナ州民（Hoosiers）に奉仕することです。
- id: 6
  category: driver_testing
  question: 新しい証明書の取得に関するマニュアルのセクションに基づくと、次のどの検査または試験が必要ですか？
  choices:
    A: 聴力検査
    B: 視力検査
    C: 体力テスト
    D: 心理評価
  answer: B
  explanation: 新しい証明書の取得について記載されているマニュアルの第1章では、必須項目として「視力検査（Vision Screening）」が挙げられています。
- id: 7
  category: driver_responsibility
  question: 新しい証明書を取得するプロセスにおいて、潜在的な事故や損害に関して扱われているトピックはどれですか？
  choices:
    A: 負傷または損害に対する財政的責任
    B: 総合衝突補償
    C: 医療過誤保険
    D: 車両保証登録
  answer: A
  explanation: マニュアルの第1章には、新しい証明書を取得する際の「負傷または損害に対する財政的責任（Financial Liability for
    Injury or Damage）」に関する特定のセクションが含まれています。
- id: 8
  category: license_system
  question: インディアナ州の運転者マニュアルに、特定の裏書（エンドースメント）または免許の種類として記載されているものは次のうちどれですか？
  choices:
    A: 重機操作者免許
    B: 営業用裏書（For-Hire Endorsement）
    C: 農業用車両許可証
    D: キャンピングカー（RV）免許
  answer: B
  explanation: マニュアルの第2章では制限と裏書について説明されており、その中に「営業用裏書（For-Hire Endorsement）」が明記されています。
- id: 9
  category: license_system
  question: インディアナ州の証明書には、どのような種類の軍歴表示（ミリタリー・インジケーター）を追加できますか？
  choices:
    A: 退役予備役表示
    B: 現役および退役軍人表示
    C: 州兵扶養家族表示
    D: 海外派遣表示
  answer: B
  explanation: マニュアルの第3章では、証明書のオプションとして「現役および退役軍人表示（Active Duty and Veteran Military
    Indicator）」が挙げられています。
- id: 10
  category: penalties_and_points
  question: インディアナ州の運転者マニュアルにおいて、違反点数および免許停止に関連するプログラムはどれですか？
  choices:
    A: 運転者安全プログラム（Driver Safety Program）
    B: ハイウェイ・ウォッチ・プログラム
    C: フージャー・ヘルパー・イニシアチブ
    D: 事故免責プログラム
  answer: A
  explanation: 違反点数、免許停止、および保険要件について記載されているマニュアルの第5章には、「運転者安全プログラム（Driver Safety Program）」に関する情報が含まれています。
- id: 11
  category: penalties_and_points
  question: インディアナ州運転免許マニュアルでは、重大な交通違反を複数回犯した運転手をどのような用語で説明していますか？
  choices:
    A: 慢性的な交通違反者 (Chronic Traffic Offenders)
    B: 常習的な交通違反者 (Habitual Traffic Violators)
    C: 反復的な走行違反者 (Repeat Moving Violators)
    D: 高リスク運転手 (High-Risk Motorists)
  answer: B
  explanation: マニュアルの第5章では違反点数と免許停止について説明しており、「常習的な交通違反者 (Habitual Traffic Violators)」に特化したセクションが含まれています。
- id: 12
  category: signs_and_signals
  question: マニュアルで説明されている道路標識の特定のカテゴリは、次のうちどれですか？
  choices:
    A: 交通提案標識 (Traffic Suggestion Signs)
    B: 交通案内標識 (Traffic Guidance Signs)
    C: 交通取締標識 (Traffic Enforcement Signs)
    D: 交通監視標識 (Traffic Observation Signs)
  answer: B
  explanation: マニュアルの第6章では道路標識と信号について説明しており、「交通案内標識 (Traffic Guidance Signs)」に関する特定のセクションが含まれています。
- id: 13
  category: vehicle_information
  question: 安全な車両操作に関するマニュアルのセクションによると、タイヤの空気圧と一緒に具体的に取り上げられている車両メンテナンスのトピックは何ですか？
  choices:
    A: オイルの寿命
    B: ブレーキパッドの摩耗
    C: トレッド（溝）の深さ
    D: 冷却水の量
  answer: C
  explanation: マニュアルの第7章では安全な車両操作について説明しており、「タイヤの空気圧とトレッドの深さ (Tire Pressure and Tread
    Depth)」というタイトルのセクションが含まれています。
- id: 14
  category: safe_driving_rules
  question: 「安全な車両操作」の章で具体的に取り上げられている運転行動は、次のうちどれですか？
  choices:
    A: わき見運転とあおり運転（攻撃的な運転）
    B: ジョイライディング（無断借用運転）と公道レース
    C: 車間距離の詰めすぎ（あおり運転）と急ブレーキ（ブレーキチェック）
    D: 相乗り（カープール）とライドシェア
  answer: A
  explanation: マニュアルの第7章では安全な車両操作について説明しており、「わき見運転 (Distracted Driving)」と「あおり運転/攻撃的な運転
    (Aggressive Driving)」に関する特定のセクションが含まれています。
- id: 15
  category: license_system
  question: 「制限と裏書（条件追加）」の項目において、オートバイ（モーターサイクル）以外で独自のセクションが設けられている二輪車はどれですか？
  choices:
    A: 自転車
    B: 原動機付自転車 (MDC)
    C: 電動スクーター
    D: 全地形対応車 (ATV)
  answer: B
  explanation: 'マニュアルの第2章では制限と裏書（条件追加）について説明しており、「原動機付自転車 (Motor Driven Cycle: MDC)」に関する特定のセクションが含まれています。'
- id: 16
  category: license_system
  question: 21歳未満のインディアナ州居住者に発行される身分証明書（運転免許証など）は、どのような形式ですか？
  choices:
    A: 横型フォーマット
    B: 縦型フォーマット
    C: 正方形フォーマット
    D: ブックレット（手帳）形式
  answer: B
  explanation: 21歳未満のインディアナ州居住者に発行されるすべての身分証明書は縦型フォーマットであり、所持者が18歳および21歳になる日付が表示されています。
- id: 17
  category: license_system
  question: インディアナ州の身分証明書の右上隅にある星印は何を示していますか？
  choices:
    A: 運転手が臓器提供者（ドナー）であること。
    B: 運転手が商用運転免許証 (CDL) を持っていること。
    C: 身分証明書がリアルID (Real ID) に準拠していること。
    D: 運転手が21歳未満であること。
  answer: C
  explanation: 右上隅の星印は、その身分証明書がリアルID (Real ID) に準拠しており、連邦政府の目的での身分証明として使用できることを示しています。
- id: 18
  category: license_system
  question: インディアナ州の新しい居住者は、インディアナ州の新しい運転免許証を何日以内に取得する必要がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: B
  explanation: インディアナ州の居住者になった場合、60日以内にインディアナ州の新しい運転免許証を取得する必要があります。
- id: 19
  category: license_system
  question: 他州の有効な運転免許証を一度も取得したことがないインディアナ州の新しい居住者の場合、運転免許証を申請する前にインディアナ州の仮免許証（学習者用許可証）をどのくらいの期間保持しなければなりませんか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: D
  explanation: 他州の有効な運転免許証を一度も取得したことがない場合、インディアナ州の運転免許証を申請する前に、インディアナ州の仮免許証を180日間保持する必要があります。
- id: 20
  category: driver_testing
  question: 他州の運転免許証の有効期限が5年以上切れている場合、どの試験に合格する必要がありますか？
  choices:
    A: 標準的な視力検査のみ
    B: 学科試験のみ
    C: 学科試験と技能試験
    D: 技能試験と身体検査
  answer: C
  explanation: 他州の運転免許証の有効期限が5年以上切れている場合、インディアナ州の運転免許証を取得するには、学科試験と技能試験に合格する必要があります。
- id: 21
  category: driver_testing
  question: 他州の運転免許証の有効期限が切れてから5年未満の18歳の新しい居住者には、どの試験が必要ですか？
  choices:
    A: 技能試験
    B: 学科試験
    C: 身体検査
    D: 聴力検査
  answer: B
  explanation: 他州の運転免許証の有効期限が切れてから5年未満の場合、または取り消されていない他州の運転免許証の保有期間が1年未満の場合、インディアナ州の運転免許証を取得するには学科試験に合格する必要があります。
- id: 22
  category: license_system
  question: 次のうち、インディアナ州の居住証明とみなされるものはどれですか？
  choices:
    A: 州内の一時的な従業員であること
    B: インディアナ州の登録有権者であること
    C: インディアナ州の居住権を主張せずに高等教育機関に在籍していること
    D: 他州に居住権を主張している現役軍人であること
  answer: B
  explanation: インディアナ州の居住証明には、インディアナ州内に居住住所を維持していること、インディアナ州の登録有権者であること、または扶養家族がインディアナ州内の小中学校に在籍していることが含まれます。
- id: 23
  category: license_system
  question: インディアナ州の身分証明書（IDカード）を無料で受け取る資格があるのは誰ですか？
  choices:
    A: 18歳未満のすべての人
    B: 次の一般選挙または地方選挙の当日までに18歳に達する、またはすでに18歳である人
    C: インディアナ州のすべての新しい居住者
    D: 他州の運転免許証を返納した人
  answer: B
  explanation: 身分証明書（IDカード）は、次の一般選挙または地方選挙の当日までに18歳に達する、またはすでに18歳である人に対して無料で発行されます。
- id: 24
  category: license_system
  question: 航空機に搭乗する際にリアルID（Real ID）準拠の身分証明書が必要となる、国土安全保障省（DHS）および運輸保安庁（TSA）が定めた期限はいつですか？
  choices:
    A: 2010年1月1日
    B: 2022年12月31日
    C: 2025年5月7日
    D: 2026年1月1日
  answer: C
  explanation: 国土安全保障省（DHS）および運輸保安庁（TSA）は、運転免許証または身分証明書を使用して航空機に搭乗する人にリアルID（Real ID）準拠の証明書の所持を義務付ける期限を、2025年5月7日と定めています。
- id: 25
  category: license_system
  question: リアルID（Real ID）準拠の身分証明書にアップグレードするために必要な書類として、明記されていないものは次のうちどれですか？
  choices:
    A: 身元証明書
    B: 合法的な滞在資格の証明書
    C: ソーシャルセキュリティ番号（社会保障番号）
    D: 自動車保険の証明書
  answer: D
  explanation: リアルID（Real ID）準拠の身分証明書にアップグレードするには、身元、合法的な滞在資格、ソーシャルセキュリティ番号、およびインディアナ州の居住証明の原本または認証済みの写しを提出する必要があります。自動車保険の証明書は必要ありません。
- id: 26
  category: license_system
  question: 確認プロセスの間に、申請者が他州の身分証明書を保持していることをBMV（車両管理局）が発見した場合、どうなりますか？
  choices:
    A: 申請者は二重居住費を支払わなければならない。
    B: 申請者は他州の身分証明書を返納するよう求められる。
    C: 申請者には60日間のインディアナ州の仮身分証明書が発行される。
    D: 申請者はインディアナ州の身分証明書の取得を永久に禁止される。
  answer: B
  explanation: 確認中に、申請者に対して他州で別の身分証明書が発行されていることをBMVが発見した場合、BMVがインディアナ州の身分証明書の申請を処理する前に、申請者は他州の身分証明書を返納するよう求められます。
- id: 27
  category: license_system
  question: 21歳未満の居住者に発行されるインディアナ州の身分証明書に、目立つように表示されている日付は何ですか？
  choices:
    A: カード保持者が18歳および21歳になる日付
    B: カード保持者が16歳および18歳になる日付
    C: カード保持者が仮免許および本免許を取得した日付
    D: 次の一般選挙および地方選挙の日付
  answer: A
  explanation: 21歳未満のインディアナ州居住者に発行されるすべての身分証明書は縦型のフォーマットであり、カード保持者が18歳および21歳になる日付が表示されています。
- id: 28
  category: driver_testing
  question: インディアナ州の新しい居住者がインディアナ州の運転免許証を取得する際、必要書類の提出に加えて、どの検査に合格する必要がありますか？
  choices:
    A: 標準的な聴力検査
    B: 標準的な視力検査
    C: 薬物およびアルコール検査
    D: 身体的敏捷性検査
  answer: B
  explanation: 上記のすべてのカテゴリーに該当する個人は、身元、合法的な滞在資格、ソーシャルセキュリティ番号、およびインディアナ州の居住を証明する書類も提示する必要があります。また、標準的な視力検査に合格することも義務付けられています。
- id: 29
  category: license_system
  question: 身分証明書を取得する目的において、インディアナ州の居住者とみなされないのは次のうち誰ですか？
  choices:
    A: インディアナ州内に居住住所を維持し、他の場所に居住権を主張していない人
    B: インディアナ州の登録有権者
    C: インディアナ州の小学校に在籍する扶養家族がいる人
    D: インディアナ州を居住州として主張していない軍の現役軍人
  answer: D
  explanation: 身分証明書を取得する目的において、インディアナ州を居住州として主張していない軍の現役軍人は、インディアナ州の居住者とはみなされません。
- id: 30
  category: license_system
  question: 18歳以上で有効な他州の運転免許証を保持している場合、インディアナ州の免許証を申請するために支局に持参できるものは次のうちどれですか？
  choices:
    A: 高校の卒業証書のコピー
    B: 公式な運転記録のコピー
    C: 以前の州の知事からの手紙
    D: 以前の州の公共料金の請求書
  answer: B
  explanation: 18歳以上で有効な他州の運転免許証を保持している場合、現在の他州の運転免許証、公式な運転記録のコピー、または確認書のいずれか1つを支局に持参する必要があります。
- id: 31
  category: license_system
  question: 標準的なインディアナ州の身分証明書（IDカード）の有効期間はどのくらいですか？
  choices:
    A: 2年
    B: 4年
    C: 6年
    D: 8年
  answer: C
  explanation: マニュアルによると、身分証明書およびMDC（原動機付自転車）の裏書（endorsement）の有効期間は6年です。
- id: 32
  category: license_system
  question: インディアナ州の身分証明書を申請する際、すでに他州の証明書（免許証など）を所持している場合、どうしなければなりませんか？
  choices:
    A: 異なる州のものである限り、両方の証明書を保持する
    B: もう一方の証明書をインディアナ州BMVに返納する
    C: 複数の証明書を保持するために追加料金を支払う
    D: 他州の証明書を自分で破棄する
  answer: B
  explanation: インディアナ州の居住者は、同時に複数の証明書を保持することはできません。したがって、身分証明書の申請を完了するには、他の証明書をインディアナ州BMV（車両管理局）に返納する必要があります。
- id: 33
  category: license_system
  question: 身分証明書に原動機付自転車（MDC）の裏書（endorsement）を取得するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: B
  explanation: 15歳以上であり、MDCの学科試験に合格していれば、身分証明書に原動機付自転車（MDC）を運転する特権を付与することができます。
- id: 34
  category: driver_testing
  question: 16歳未満で仮免許証（learner's permit）を申請する場合、運転者教育プログラムの受講登録を証明する書類として認められないものは次のうちどれですか？
  choices:
    A: 学校が発行する運転者教育受講登録証明書
    B: 授業開始の2週間前の日付が記載された証明書
    C: 座学講習のオンラインコース修了証明書
    D: BMV認可の実車訓練提供機関への登録を証明する書類
  answer: C
  explanation: マニュアルには、座学講習のオンラインコース修了証明書は受講登録を証明する書類として認められないと明記されています。
- id: 35
  category: license_system
  question: 標準的な仮免許証（learner's permit）の有効期間は、発行日からどのくらいですか？
  choices:
    A: 1年
    B: 2年
    C: 4年
    D: 6年
  answer: B
  explanation: 「仮免許証の有効期間」のセクションによると、仮免許証は発行日から2年間有効です。
- id: 36
  category: driver_testing
  question: 仮免許証の更新時、有効期限が何日以上過ぎていると再試験を受けなければなりませんか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: D
  explanation: 仮免許証を更新するためにBMVの支局を訪れた際、有効期限が180日以上過ぎている場合は、再試験を受ける必要があります。
- id: 37
  category: safe_driving_rules
  question: 16歳未満で親族と同乗して運転の練習をする場合、免許を持った親族の最低年齢は何歳でなければなりませんか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 30歳
  answer: C
  explanation: 血縁、婚姻、または法的な関係がある場合、有効な運転特権を持つ25歳以上の免許所持者と同乗して運転の練習をすることができます。
- id: 38
  category: driver_testing
  question: コンピューターベースの学科試験を受けるには、BMV支局の閉館時間のどれくらい前までに到着しなければなりませんか？
  choices:
    A: 少なくとも15分前
    B: 少なくとも30分前
    C: 少なくとも45分前
    D: 少なくとも1時間前
  answer: B
  explanation: その日のうちにコンピューターベースの学科試験を受けるには、支局が閉まる少なくとも30分前までに到着する必要があります。
- id: 39
  category: driver_testing
  question: 運転免許の学科試験に不合格になった場合、どうしなければなりませんか？
  choices:
    A: 手数料を支払ってすぐに再受験する
    B: 再受験するまで少なくとも30分待つ
    C: 再受験するまで翌営業日まで待つ
    D: 再受験するまで丸1週間待つ
  answer: C
  explanation: マニュアルには次のように記載されています。「学科試験に不合格になった場合、再受験するには翌営業日まで待たなければなりません。」
- id: 40
  category: penalties_and_points
  question: インディアナ州の運転免許証を更新する運転者は、運転記録に少なくとも何点のアクティブポイント（累積違反点数）がある場合、学科試験を受けなければなりませんか？
  choices:
    A: 2点以上のアクティブポイント
    B: 4点以上のアクティブポイント
    C: 6点以上のアクティブポイント
    D: 8点以上のアクティブポイント
  answer: C
  explanation: インディアナ州の運転記録に6点以上のアクティブポイント（累積違反点数）があり、運転免許証を更新する運転者には、学科試験の受験が義務付けられています。
- id: 41
  category: driver_testing
  question: 普段運転する際にメガネやコンタクトレンズを着用しており、視力検査を受ける場合、どうすればよいですか？
  choices:
    A: 裸眼視力を測るために外す
    B: 視力検査中も着用する
    C: 最初の検査に不合格だった場合のみ着用する
    D: 検査を受ける代わりに医師の診断書を提出する
  answer: B
  explanation: 普段運転する際にメガネやコンタクトレンズを着用している場合は、BMV（車両管理局）の職員にその旨を伝え、視力検査中も着用する必要があります。
- id: 42
  category: license_system
  question: 18歳未満で仮免許（learner's permit）を申請する場合、緊急連絡先として指定する人物は最低何歳以上でなければなりませんか？
  choices:
    A: 18歳以上
    B: 21歳以上
    C: 25歳以上
    D: 親族であれば年齢は問わない
  answer: A
  explanation: 18歳未満の人が仮免許を申請する場合、18歳以上の緊急連絡先を提供することが義務付けられています。
- id: 43
  category: safe_driving_rules
  question: 18歳未満で児童サービス局（DCS）の保護下にある場合、DCSの承認を受けていれば親族以外の免許所持者と運転の練習をすることができますが、その人は最低何歳以上でなければなりませんか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 30歳
  answer: C
  explanation: 児童サービス局の保護下にある場合、児童サービス局の承認を受けた25歳以上の免許所持者と一緒に運転の練習をすることを選択できます。
- id: 44
  category: driver_testing
  question: コンピューターベースの学科試験に不合格となった場合、再受験するまでにどれくらいの期間待たなければなりませんか？
  choices:
    A: 翌営業日まで
    B: 48時間
    C: 7日間
    D: 14日間
  answer: A
  explanation: 学科試験に不合格となった場合、再受験するには翌営業日まで待つ必要があります。
- id: 45
  category: driver_testing
  question: BMVで技能試験の予約をする際、最大でどれくらい前から予約を入れることができますか？
  choices:
    A: 1週間前
    B: 2週間前
    C: 3週間前
    D: 1ヶ月前
  answer: C
  explanation: 技能試験は、最大で3週間前から、遅くとも48営業時間前までに予約する必要があります。
- id: 46
  category: vehicle_information
  question: BMVの試験官が技能試験において車両を不合格（使用不可）とする正当な理由は、次のうちどれですか？
  choices:
    A: 車両がマニュアルトランスミッションである
    B: 車両に作動しないドアがある
    C: 車両が製造から10年以上経過している
    D: 車両にバックカメラが搭載されていない
  answer: B
  explanation: 技能試験で車両が使用不可となる理由の例として、作動しないドア、安全でないタイヤ、バンパーの欠落、ガラスやミラーの破損、または適切に登録されていないことなどが挙げられます。
- id: 47
  category: driver_testing
  question: 次の行動のうち、技能試験で即座に不合格となるものはどれですか？
  choices:
    A: 車線変更が完了した後も方向指示器を点滅させたままにする
    B: 死角の確認を怠る
    C: 後退時に縁石に乗り上げる
    D: 後退する速度が速すぎる
  answer: C
  explanation: 後退時に縁石に乗り上げる行為は、技能試験で即座に不合格となる行動として挙げられています。その他の選択肢は、最終スコアに影響を与えたり不合格の原因になったりする可能性はありますが、即座に不合格となる行動としては挙げられていません。
- id: 48
  category: driver_testing
  question: 技能試験を受ける際、車両に同乗できるのは誰ですか？
  choices:
    A: 運転免許を持つ親または保護者
    B: 認定された運転指導員
    C: BMVの試験官または承認されたBMV職員のみ
    D: 有効な運転免許証を持っている人なら誰でも
  answer: C
  explanation: 技能試験を受ける際、試験を実施するBMVの試験官またはその他の承認されたBMV職員以外は、車両に同乗することは許可されていません。
- id: 49
  category: driver_testing
  question: 仮免許（learner's permit）を所持している状態で、技能試験に3回不合格になった場合、どうなりますか？
  choices:
    A: 再受験するまでに2ヶ月間待たなければならない
    B: 仮免許が永久に取り消される
    C: 運転者教育コースを再受講しなければならない
    D: 再受験するまでに6ヶ月間待たなければならない
  answer: A
  explanation: 仮免許を所持している状態で技能試験に3回不合格になった場合、最後に不合格となった技能試験の日から2ヶ月間待たなければ再受験することはできません。
- id: 50
  category: driver_responsibility
  question: 18歳未満の申請者のための経済的責任の宣誓書に署名する際、第一優先権を持つのは誰ですか？
  choices:
    A: 親権を持たない親
    B: 未成年者の親権を持つ後見人
    C: 義務を引き受ける意思のある成人なら誰でも
    D: 未成年の申請者の親権を持つ親
  answer: D
  explanation: 経済的責任に関する法的な優先順位は、第一に未成年の申請者の親権を持つ親（または親権を持つ親が指定した代理人）となります。
- id: 51
  category: driver_responsibility
  question: 未成年者の経済的責任の連帯保証人である大人が、その経済的責任を取り下げるための書面による要求を提出した場合、どうなりますか？
  choices:
    A: 未成年者は罰金を支払わなければならない
    B: 未成年者の仮免許証または運転免許証は取り消される
    C: 未成年者は免許を維持するために30日以内に新しい連帯保証人を見つけなければならない
    D: 未成年者は学校の行き帰りのみの運転に制限される
  answer: B
  explanation: 経済的責任を取り下げる書面による要求があると、未成年者の仮免許証または運転免許証は取り消されます。
- id: 52
  category: license_system
  question: 未成年者の申請者が児童サービス局（DCS）の保護下にある場合、経済的責任に関する大人の署名の代わりに何を提出しなければなりませんか？
  choices:
    A: 裁判官からの推薦状
    B: 最低限の賠償責任基準を満たす自動車保険の証明書
    C: BMVへの1,000ドルの現金保証金
    D: 上級防衛運転コースの修了証明書
  answer: B
  explanation: DCSの保護下にある申請者が運転免許証または仮免許証を申請する場合、インディアナ州法で定められた最低限の賠償責任基準を満たす自動車保険の証明書も提出する必要があります。
- id: 53
  category: license_system
  question: 21歳未満で運転免許証を申請する場合、どの種類の免許証を受け取りますか？
  choices:
    A: 制限付き免許証
    B: 商業用運転免許証（CDL）
    C: 見習い運転免許証（Probationary driver's license）
    D: 仮免許証（Learner's permit）
  answer: C
  explanation: 21歳未満の場合、運転免許証は「見習い（probationary）」免許証とみなされます。
- id: 54
  category: driver_testing
  question: 運転技能試験中、次のうち自動的に不合格となるのはどれですか？
  choices:
    A: シートベルトを着用しないこと
    B: 必要な時にデフロスターを使用しないこと
    C: 遅すぎる速度で運転すること
    D: 車線変更時に減速すること
  answer: A
  explanation: シートベルトの不着用は、運転技能試験で自動的に不合格となる行為として挙げられています。その他の選択肢は、最終スコアに影響を与えたり不合格の原因になる可能性はありますが、自動的に不合格になるものではありません。
- id: 55
  category: driver_testing
  question: BMVが運転技能試験を実施するための料金はいくらですか？
  choices:
    A: 15ドル
    B: 25ドル
    C: 50ドル
    D: 無料である
  answer: D
  explanation: BMVが実施する運転技能試験は無料です。
- id: 56
  category: license_system
  question: BMV認定の運転者教育プログラムを修了していない場合、運転免許証を申請するには何歳である必要がありますか？
  choices:
    A: 16歳と90日
    B: 16歳と180日
    C: 16歳と270日
    D: 18歳
  answer: C
  explanation: マニュアルによると、BMV認定の運転者教育プログラムを修了していない場合、少なくとも16歳と270日である必要があります。
- id: 57
  category: license_system
  question: 80歳の人の場合、標準の運転免許証の有効期間はどのくらいですか？
  choices:
    A: 2年
    B: 3年
    C: 4年
    D: 6年
  answer: B
  explanation: マニュアルには、75歳から84歳までの場合、運転免許証の有効期間は3年であると記載されています。
- id: 58
  category: safe_driving_rules
  question: 見習い運転免許証（Probationary driver's license）を取得してからの最初の180日間、資格を持つ大人の同乗なしで一緒に車に乗せることが許可されている同乗者は次のうち誰ですか？
  choices:
    A: 学校の友人
    B: 兄弟姉妹
    C: いとこ
    D: 近所の人
  answer: B
  explanation: 見習い運転免許証を取得してからの最初の180日間は、他の同伴者がいなくても、自分の子供、継子、兄弟姉妹、義理または異父・異母の兄弟姉妹、または配偶者を乗せて運転することができます。
- id: 59
  category: safe_driving_rules
  question: 見習い運転免許証を取得してからの最初の180日間は、何時から何時までの間、運転してはいけませんか？
  choices:
    A: 午後10時から午前5時
    B: 午後11時から午前6時
    C: 深夜0時から午前5時
    D: 午後9時から午前6時
  answer: A
  explanation: マニュアルには次のように記載されています。「見習い運転免許証を取得してからの最初の180日間は、午後10時から午前5時までの間は運転してはいけません。」
- id: 60
  category: safe_driving_rules
  question: 見習い運転免許証の保持者が、自動車の運転中に通信機器を使用することが許可されるのはどのような場合ですか？
  choices:
    A: ハンズフリー機器を使用する場合
    B: 親または保護者にテキストメッセージを送信する場合
    C: 赤信号で停車している場合
    D: 911の緊急通報を行う場合
  answer: D
  explanation: インディアナ州法では、911の緊急通報を行うために使用される場合を除き、すべての運転者がいかなる形式の通信機器を使用しながら自動車を運転することも禁止しています。
- id: 61
  category: penalties_and_points
  question: 学校の管理者から通知を受けた場合、BMV（自動車局）は未成年者の運転特権を停止することが義務付けられています。その条件となる未成年者の行動は次のうちどれですか？
  choices:
    A: 1回の居残り処分（ディテンション）を受けた
    B: 常習的な無断欠席者（不登校）であると判断された
    C: 運転者教育コースに不合格になった
    D: 学校に3回遅刻した
  answer: B
  explanation: インディアナ州法により、未成年者が退学/除外/2回目の停学処分を受けている場合、学校を中退した場合、または常習的な無断欠席者であると判断された場合、BMVはその未成年者の運転特権を停止することが義務付けられています。
- id: 62
  category: license_system
  question: 旅客および/またはスクールバスの裏書（エンドースメント）付きの商用運転免許証（CDL）を申請するために必要な最低年齢は何歳ですか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 16歳と270日
  answer: B
  explanation: CDLを申請するには18歳以上である必要があり、旅客および/またはスクールバスの裏書付きのCDLを申請するには21歳以上である必要があります。
- id: 63
  category: driver_testing
  question: 運転免許証を申請する際、18歳以上の場合、監督者同乗での運転練習を何時間完了する必要がありますか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: C
  explanation: 運転免許証を申請する際、18歳以上の場合、監督者同乗での運転練習を少なくとも50時間完了する必要があります。
- id: 64
  category: driver_testing
  question: 義務付けられている50時間の監督者同乗での運転練習のうち、夜間に完了しなければならないのは何時間ですか（昼間のみの制限がある場合を除く）？
  choices:
    A: 5時間
    B: 10時間
    C: 15時間
    D: 20時間
  answer: B
  explanation: 仮免許証（仮免）に昼間のみの制限がない限り、監督者同乗での運転練習のうち少なくとも10時間は夜間に完了する必要があります。
- id: 65
  category: license_system
  question: 21歳未満で運転免許証を取得した場合、その試用運転免許証（プロベイショナリー・ライセンス）の有効期限はいつまでですか？
  choices:
    A: ちょうど21歳になるまで
    B: 21歳と30日になるまで
    C: 21歳と90日になるまで
    D: 25歳になるまで
  answer: B
  explanation: 試用運転免許証は、21歳と30日になるまで有効です。
- id: 66
  category: license_system
  question: 新しい証明書（免許証など）を申請した後、郵送先住所に届くまでに暦日で何日かかりますか？
  choices:
    A: 暦日で7日以内
    B: 暦日で10日以内
    C: 暦日で14日以内
    D: 暦日で21日以内
  answer: C
  explanation: 証明書はBMVに登録されている郵送先住所に送付され、暦日で14日以内に届きます。
- id: 67
  category: license_system
  question: 写真なしの身分証明書（IDカード）が発行されるのは、どのような理由によるものですか？
  choices:
    A: 医療上の理由のみ
    B: 宗教上の理由のみ
    C: 医療上および宗教上の理由の両方
    D: プライバシー上の理由のみ
  answer: B
  explanation: 写真なしの仮免許証および運転免許証は、医療上および宗教上の理由で発行されます。写真なしの身分証明書（IDカード）は、宗教上の理由でのみ発行されます。
- id: 68
  category: driver_testing
  question: 運転免許証を申請する際、学科試験（知識試験）と技能試験について正しいものは次のうちどれですか？
  choices:
    A: 学科試験の前に技能試験を完了しなければならない
    B: 技能試験の前に学科試験を完了しなければならない
    C: 両方の試験を同じ日に受けなければならない
    D: 技能試験に合格すれば学科試験は免除される
  answer: B
  explanation: 運転免許証を取得するには、取得したい運転免許証の学科試験に合格する必要があり、これは技能試験の前に完了しなければなりません。
- id: 69
  category: safe_driving_rules
  question: 試用免許証を180日間保持した後（かつ18歳未満の場合）、次のいずれかに参加する、向かう、または帰る場合であれば、制限時間帯でも運転することができます。
  choices:
    A: 学校が認可した活動
    B: 友人の家
    C: 観客としての地元のスポーツイベント
    D: 公園
  answer: A
  explanation: 合法的な雇用、学校が認可した活動、または宗教行事に参加する、向かう、または帰る場合であれば、制限時間帯でも運転することができます。
- id: 70
  category: vehicle_information
  question: インディアナ州のCDL（商用運転免許証）の保持者は、車両総重量定格がどれを超える商用自動車を運転できますか？
  choices:
    A: 10,000ポンド
    B: 16,000ポンド
    C: 20,000ポンド
    D: 26,000ポンド
  answer: D
  explanation: インディアナ州のCDLにより、保持者は車両総重量定格が26,000ポンドを超える商用自動車または連結車両を運転することができます。
- id: 71
  category: license_system
  question: 米国郵便公社（USPS）で郵送先住所を変更したものの、インディアナ州BMV（車両管理局）での更新を忘れた場合、どうなりますか？
  choices:
    A: USPSが自動的に新しい住所へ証明書を転送する。
    B: 証明書は地元の郵便局で保管され、受け取りが必要になる。
    C: 証明書は転送されず、配達されない。
    D: 代わりにBMVが証明書のデジタルコピーをメールで送信する。
  answer: C
  explanation: マニュアルには、証明書はBMVに登録されている住所にのみ郵送され、転送はされないと記載されています。BMVで住所を更新しないと、配達されなくなります。
- id: 72
  category: safe_driving_rules
  question: インディアナ州法において、自動車の走行中にシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転手と助手席の乗客のみ
    B: 標準装備としてシートベルトが設置されている自動車のすべての乗員
    C: 18歳未満の乗客のみ
    D: 商用車を運転している場合を除く運転手
  answer: B
  explanation: インディアナ州法では、メーカーによって標準装備としてシートベルトが設置されている自動車のすべての乗員に対し、車両の走行中は常にシートベルトを着用することを義務付けています。
- id: 73
  category: driver_responsibility
  question: 走行中の自動車を運転しながら、通信機器を使用してテキストメッセージを入力または読むことが法的に許可されるのはいつですか？
  choices:
    A: 時速15マイル未満で走行しているとき
    B: 赤信号で停止しているとき
    C: ハンズフリー技術を使用しているとき、または911の緊急電話をかけるとき
    D: 他の交通がない田舎の幹線道路を運転しているとき
  answer: C
  explanation: インディアナ州法では、ハンズフリー技術や音声操作技術を使用する場合、または911の緊急電話をかける場合を除き、走行中の車両を運転しながらテキストやメールを入力、送信、または読むことを禁止しています。
- id: 74
  category: driver_responsibility
  question: インディアナ州の運転法において、制限される通信機器とみなされないものは次のうちどれですか？
  choices:
    A: 携帯電話
    B: 携帯情報端末（PDA）
    C: テキストメッセージングデバイス
    D: 免許を持ったオペレーターによって操作される市民ラジオ（CB）無線設備
  answer: D
  explanation: 通信機器の定義には、FCC（連邦通信委員会）の免許を受けた者が操作する市民ラジオ（CB）無線設備は含まれません。
- id: 75
  category: license_system
  question: インディアナ州の運転免許証に記載される制限事項「G」は何を示していますか？
  choices:
    A: 眼鏡またはコンタクトレンズが必要
    B: 外部バックミラーが必要
    C: 昼間運転のみ
    D: インターロック装置が必要
  answer: C
  explanation: 基本運転免許証の制限事項一覧表によると、制限事項「G」は「昼間運転のみ（Daylight Driving Only）」を意味します。
- id: 76
  category: safe_driving_rules
  question: オートバイの仮免許（learner's permit）を所持している人が運転を許可されている時間帯はいつですか？
  choices:
    A: 午前6時から午後6時の間
    B: 日の出の30分前から日没の30分後まで
    C: 日の出から日没までのみ
    D: 仮免許所持者に時間制限はない
  answer: B
  explanation: オートバイの仮免許を所持している場合、日の出の30分前から日没の30分後までの期間にのみ運転することができます。
- id: 77
  category: license_system
  question: インディアナ州の運転免許証を初めて取得する場合、同時にオートバイの免許区分（endorsement）を取得するための最低年齢要件は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 16歳と90日
    D: 18歳
  answer: C
  explanation: 16歳と90日以上であり、オートバイ安全講習を修了している場合、最初の運転免許証と同時にオートバイの免許区分を取得することができます。
- id: 78
  category: vehicle_information
  question: インディアナ州法において原動機付自転車（MDC）として定義されるためには、車両のシリンダー排気量が次の値を超えてはなりません：
  choices:
    A: 35 cc（立方センチメートル）
    B: 50 cc（立方センチメートル）
    C: 150 cc（立方センチメートル）
    D: 250 cc（立方センチメートル）
  answer: B
  explanation: インディアナ州法では、他の要件に加えて、シリンダー排気量が50 cc（立方センチメートル）を超えない車両をMDC（原動機付自転車）と定義しています。
- id: 79
  category: safe_driving_rules
  question: 原動機付自転車（MDC）の運転に適用される制限は、次のうちどれですか？
  choices:
    A: 時速35マイル以下で運転しなければならない
    B: ヘルメットを着用していれば乗客を1名乗せることができる
    C: 州間高速道路で運転できる
    D: 道路の中央を運転しなければならない
  answer: A
  explanation: MDC（原動機付自転車）の運転に関する制限には、時速35マイル以下で運転すること、乗客を乗せないこと、および州間高速道路で運転しないことが含まれます。
- id: 80
  category: vehicle_information
  question: インディアナ州において、三輪自動車が法的にオートサイクル（autocycle）として定義されるために必要な装備は次のうちどれですか？
  choices:
    A: 操縦用のハンドルバー
    B: アンチロックブレーキ
    C: サドル型のシート
    D: 50cc未満のシリンダー排気量
  answer: B
  explanation: オートサイクルは、ロールケージ/フープ、シートベルト、アンチロックブレーキを装備し、ステアリングホイール（丸型ハンドル）とペダルで制御できるように設計されている必要があります。
- id: 81
  category: license_system
  question: インディアナ州の公道でオートサイクルを合法的に運転するには、どの資格が必要ですか？
  choices:
    A: オートバイの仮免許
    B: オートバイの特記（免種追加）
    C: 有効なインディアナ州の運転免許証
    D: 商用運転免許 (CDL)
  answer: C
  explanation: 有効なインディアナ州の運転免許証を所持していれば、インディアナ州の公道でオートサイクルを運転することができます。オートバイの仮免許や特記（免種追加）は必要ありません。
- id: 82
  category: driver_testing
  question: オートサイクルを運転する際、禁止されているのは次のうちどれですか？
  choices:
    A: 州間高速道路を走行すること
    B: 運転免許の技能試験にオートサイクルを使用すること
    C: オートバイ用ヘルメットを着用せずに車両を運転すること
    D: 密閉された座席エリアに同乗者を乗せること
  answer: B
  explanation: マニュアルには、オートサイクルは「運転免許の技能試験の目的で使用してはならない」と明記されています。
- id: 83
  category: license_system
  question: 有償運送特記（for-hire endorsement）を持つ資格保持者は、有償で乗客を輸送するために設計された自動車を運転できますが、その乗車定員は何人未満である必要がありますか？
  choices:
    A: 10人
    B: 12人
    C: 15人
    D: 16人
  answer: D
  explanation: 有償運送特記は、有償で乗客を輸送する目的で、運転手を含めて16人未満の乗客を輸送するように設計された自動車を運転する特権を与えるものです。
- id: 84
  category: license_system
  question: インディアナ州で有償運送特記（for-hire endorsement）を取得するための年齢および経験の要件は何ですか？
  choices:
    A: 16歳以上で、6ヶ月の運転経験があること
    B: 18歳以上で、有効なインディアナ州の運転免許証を1年以上保持していること
    C: 21歳以上で、無事故無違反の運転記録があること
    D: 18歳以上で、有効なインディアナ州の運転免許証を2年以上保持していること
  answer: B
  explanation: マニュアルによると、有償運送特記は、18歳以上で、有効なインディアナ州の運転免許証を1年以上保持しているインディアナ州居住者に発行されます。
- id: 85
  category: license_system
  question: インディアナ州BMV（車両管理局）は、有償運送特記（for-hire endorsement）付きの運転免許証を発行するために健康診断書を要求しますか？
  choices:
    A: はい、2年ごとに更新する必要があります。
    B: はい、ただし65歳以上の運転手のみです。
    C: いいえ、BMVは有償運送特記のために健康診断書を要求しません。
    D: いいえ、運転手が危険物を輸送する場合を除きます。
  answer: C
  explanation: マニュアルには、「BMVは、有償運送特記付きの運転免許証を発行するために健康診断書を要求しません」と記載されています。
- id: 86
  category: vehicle_information
  question: インディアナ州の運転マニュアルによると、有償運送（transporting for hire）とみなされないのは次のうちどれですか？
  choices:
    A: ライドシェア車両の運転
    B: 医療サービス車両の運転
    C: タクシーやリムジンの運転
    D: 報酬を得て乗客を運ぶバスの運転
  answer: B
  explanation: マニュアルには、有償運送とみなされない例外として「医療サービス車両の運転」が明記されています。
- id: 87
  category: driver_responsibility
  question: インディアナ州のドナー選択法（Donor Choice Law）の下で、18歳以上の個人が臓器提供者（臓器ドナー）になる意思を表明した場合、どうなりますか？
  choices:
    A: 死亡時に家族がその決定を覆すことができる。
    B: 4年ごとに意思表示を更新しなければならない。
    C: 死亡時に家族がその意思を覆すことはできない。
    D: 常に別の臓器ドナーカードを携帯しなければならない。
  answer: C
  explanation: マニュアルには、インディアナ州のドナー選択法に基づき、18歳以上の個人は臓器ドナーになる意思を表明することができ、死亡時に家族がその意思を覆すことはできないと記載されています。
- id: 88
  category: license_system
  question: 退役軍人が身分証明書に退役軍人表示（veteran indicator）を追加するには、どの書類を提出する必要がありますか？
  choices:
    A: 共通アクセスカード (CAC)
    B: 米国国防総省が発行したDD 214
    C: 退役軍人省からの手紙
    D: 有効な軍の身分証明書
  answer: B
  explanation: 退役軍人表示を取得するには、除隊を証明する米国国防総省発行のDD 214を提出する必要があります。
- id: 89
  category: safe_driving_rules
  question: インディアナ州法では、エンジンの出力が何馬力を超える船舶（watercraft）を操縦する場合、有効な運転免許証の携帯が義務付けられていますか？
  choices:
    A: 5馬力
    B: 10馬力
    C: 15馬力
    D: 25馬力
  answer: B
  explanation: インディアナ州法では、10馬力を超えるエンジンを搭載した船舶の操縦者に対し、有効な運転免許証の携帯を義務付けています。
- id: 90
  category: license_system
  question: 15歳以上で運転免許証を持っていない場合、10馬力を超えるエンジンの船舶を合法的に操縦するには何をしなければなりませんか？
  choices:
    A: 承認されたボート教育コースを修了し、有効なインディアナ州の身分証明書（IDカード）を携帯する。
    B: 21歳以上の免許を持った大人を船舶に同乗させる。
    C: BMVで一時的な船舶許可証を申請する。
    D: 運転免許証がない場合、いかなる状況でも船舶を操縦することはできない。
  answer: A
  explanation: 15歳以上で運転免許証を持っていない場合、承認されたボート教育コースを修了した後にのみ船舶を操縦することができ、有効なインディアナ州の身分証明書（IDカード）を携帯していなければなりません。
- id: 91
  category: penalties_and_points
  question: 運転免許証が停止された場合、水上船舶（ウォータークラフト）を操縦する資格はどうなりますか？
  choices:
    A: 日中のみ水上船舶を操縦できる。
    B: ボート教育講習を修了すれば水上船舶を操縦できる。
    C: 水上船舶を操縦することはできない。
    D: 25馬力未満であれば水上船舶を操縦できる。
  answer: C
  explanation: マニュアルには「運転免許証が停止されている場合、水上船舶を操縦することはできません」と記載されています。
- id: 92
  category: vehicle_information
  question: 一時的な障害のために発行された駐車プラカード（駐車許可証）の有効期限はいつですか？
  choices:
    A: 医療提供者が指定した日付、または発行から1年後のいずれか早い方。
    B: 発行日から2年後。
    C: 運転者の次の誕生日。
    D: 発行日から6ヶ月後。
  answer: A
  explanation: 一時的な障害がある場合、駐車プラカードの有効期限は、医療提供者が指定した日付、または発行日から1年後のいずれか早い方となります。
- id: 93
  category: vehicle_information
  question: インディアナ州で恒久的な駐車プラカード（駐車許可証）を取得するための手数料はいくらですか？
  choices:
    A: 5.00ドル
    B: 10.00ドル
    C: 15.00ドル
    D: 恒久的な駐車プラカードに手数料はかからない（無料）。
  answer: D
  explanation: マニュアルには「恒久的な駐車プラカードに手数料はかかりません」と明記されています。
- id: 94
  category: safe_driving_rules
  question: 有効な駐車プラカードを持っている場合、専用駐車スペースの隣にある斜め線の入ったスペースに駐車することは許可されていますか？
  choices:
    A: はい、ただし乗客の乗り降りのためのみ許可される。
    B: はい、メインの専用スペースがすでに埋まっている場合は許可される。
    C: いいえ、斜め線の入ったスペースへの駐車は常に禁止されている。
    D: いいえ、車椅子対応のバンを運転している場合を除き禁止されている。
  answer: C
  explanation: マニュアルには「有効なプラカードを持っていても、専用駐車スペースの隣にある斜め線の入ったスペースへの駐車は常に禁止されています」と記載されています。
- id: 95
  category: license_system
  question: インディアナ州の試用運転免許証（プロベイショナリー・ライセンス）の有効期限はいつですか？
  choices:
    A: 運転者の21歳の誕生日の深夜0時。
    B: 免許証保持者が21歳と30日になったとき。
    C: 発行日から4年後。
    D: 運転者の18歳の誕生日の深夜0時。
  answer: B
  explanation: マニュアルによると、試用運転免許証の有効期限は、免許証保持者が21歳と30日になったときです。
- id: 96
  category: license_system
  question: 誕生日がBMV（車両管理局）の休業日と重なった場合、免許証などの証明書の有効期限はいつになりますか？
  choices:
    A: 誕生日の前日の深夜0時。
    B: BMVの営業時間に関係なく、誕生日の深夜0時。
    C: 翌営業日の深夜0時。
    D: 誕生日の7日後。
  answer: C
  explanation: マニュアルには「誕生日がBMVの休業日と重なった場合、証明書の有効期限は翌営業日の深夜0時になります」と記されています。
- id: 97
  category: penalties_and_points
  question: 水上船舶を操縦中に犯した違反によって、運転記録に違反点数が加算されることはありますか？
  choices:
    A: いいえ、水上船舶の違反は運転記録とは別に処理される。
    B: はい、水上船舶を無謀に操縦したり、飲酒状態で操縦したり、個人用水上船舶の法律に違反した場合は加算される。
    C: はい、ただし50馬力以上の水上船舶を操縦している場合のみ加算される。
    D: いいえ、水上船舶が自動車との衝突事故に関与しない限り加算されない。
  answer: B
  explanation: マニュアルには、水上船舶を無謀に操縦したり、飲酒状態で操縦したり、個人用水上船舶の法律に違反した場合、運転記録に違反点数が加算される可能性があると記載されています。
- id: 98
  category: license_system
