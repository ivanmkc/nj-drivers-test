- id: 322
  category: vehicle_information
  question: オフロード車（ORV）を運転または乗車する際、米国運輸省（DOT）承認のヘルメット着用が義務付けられている年齢要件は何ですか？
  choices:
    A: 16歳未満のすべての人。
    B: 18歳未満のすべての人。
    C: 21歳未満のすべての人。
    D: 年齢に関係なく、すべての乗員。
  answer: B
  explanation: マニュアルには次のように記載されています。「ORVを運転または乗車する18歳未満のすべての人は、米国運輸省（DOT）が定めた基準を満たすヘルメットを着用しなければなりません。」
