- id: 311
  category: license_system
  question: インディアナ州の居住証明として認められるためには、住宅所有者保険、賃借人保険、または自動車保険の証券は発行からどのくらい経過している必要がありますか？
  choices:
    A: 申請日から30日以内の日付のもの
    B: 申請日から60日以内の日付のもの
    C: 申請日から90日以内の日付のもの
