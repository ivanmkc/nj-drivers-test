  question: 一部の市販薬は運転にどのような影響を与える可能性がありますか？
  choices:
    A: 反応時間を向上させる可能性がある。
    B: 眠気を引き起こす可能性がある。
    C: 視力を向上させる。
    D: 運転能力には影響を与えない。
  answer: B
  explanation: マニュアルでは、影響下での運転をしないよう警告しており、「一部の市販薬でも眠気を引き起こす可能性がある」と指摘しています。
- id: 318
  category: safe_driving_rules
  question: 交差点に近づいているときに、青信号が黄色に変わった場合はどうすべきですか？
  choices:
    A: 赤に変わる前に交差点を通過するためにスピードを上げる。
    B: 慎重に交差点に進入し、交差する交通に道を譲る。
    C: すでに交差点内にいる場合を除き、信号が黄色に変わった後は交差点に進入すべきではない。
    D: すでに交差点の真ん中にいる場合でも、直ちに停止する。
  answer: C
  explanation: マニュアルには「信号が黄色に変わったときにすでに交差点内にいる場合を除き、信号が黄色に変わった後は交差点に進入すべきではありません」と記載されています。
- id: 319
  category: safe_driving_rules
  question: 制限速度を守ることが重要なのはなぜですか？
  choices:
    A: スピードを出しすぎると車の燃費が向上するから。
    B: スピードを出しすぎると、停止したり反応したりする時間が短くなるから。
    C: タイヤの過度な摩耗を防ぐから。
    D: 黄色信号に遭遇しないことが保証されるから。
  answer: B
  explanation: マニュアルには「制限速度を守ってください。スピードを出しすぎると、停止したり反応したりする時間が短くなります」と記載されています。
- id: 320
  category: driver_responsibility
  question: 10代の運転者のために車を選ぶ際、親は何を優先すべきですか？
  choices:
    A: 車のイメージやスタイル。
    B: 車の最高速度の性能。
    C: 安全性。
    D: 車のオーディオやエンターテインメントシステム。
  answer: C
  explanation: 「10代の若者の親へのアドバイス」のセクションでは、「イメージではなく、安全性を重視して車を選ぶ」よう親に助言しています。
- id: 321
  category: driver_responsibility
  question: 10代のドライバーが経験を積み、適切な判断ができるようになった際、保護者に推奨される戦略は何ですか？
