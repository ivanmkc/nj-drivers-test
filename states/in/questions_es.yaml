questions:
- id: 1
  category: license_system
  question: ¿Qué indicador visual en una licencia, identificación o permiso de Indiana
    significa que es un Real ID?
  choices:
    A: Un holograma del sello del estado
    B: Una estrella en la esquina superior derecha
    C: Un código de barras en la parte delantera
    D: Una franja azul en la parte superior
  answer: B
  explanation: Según el manual, un Real ID se indica con una estrella en la esquina
    superior derecha de las licencias, identificaciones y permisos.
- id: 2
  category: license_system
  question: ¿Cuál de los siguientes es un beneficio de tener un Real ID?
  choices:
    A: Puede conducir vehículos comerciales sin una licencia de conducir comercial
      (CDL).
    B: Puede abordar vuelos comerciales dentro de los Estados Unidos.
    C: Está exento de pagar peajes en las autopistas interestatales.
    D: Puede viajar internacionalmente sin pasaporte.
  answer: B
  explanation: El manual establece que con un Real ID, puede abordar vuelos comerciales
    dentro de los Estados Unidos.
- id: 3
  category: license_system
  question: Además de abordar vuelos comerciales nacionales, ¿qué más le permite hacer
    un Real ID?
  choices:
    A: Ingresar a ciertas instalaciones federales y visitar bases militares
    B: Evitar los controles de seguridad en los aeropuertos
    C: Operar una embarcación sin una licencia separada
    D: Estacionar en espacios designados para personas con discapacidades
  answer: A
  explanation: El manual especifica que un Real ID le permite visitar bases militares
    e ingresar a ciertas instalaciones federales.
- id: 4
  category: license_system
  question: ¿Dónde pueden encontrar los residentes de Indiana información sobre los
    documentos necesarios para actualizar a un Real ID?
  choices:
    A: BMV.IN.gov
    B: RealID.IN.gov
    C: Indiana.gov/ID
    D: HoosierDrive.com
  answer: B
  explanation: El manual indica a las personas que visiten RealID.IN.gov para saber
    qué documentos se necesitan para actualizar a un Real ID.
- id: 5
  category: license_system
  question: Según la declaración de la misión de la Oficina de Vehículos Motorizados
    (BMV) de Indiana, ¿cómo pretende la BMV proporcionar servicios de conductores
    y vehículos?
  choices:
    A: Priorizando a los conductores comerciales sobre los conductores estándar
    B: De manera oportuna y precisa, garantizando al mismo tiempo la seguridad y la
      transparencia
    C: Ofreciendo reemplazos de credenciales gratuitos a todos los habitantes de Indiana
      (Hoosiers)
    D: A través de plataformas exclusivamente en línea
  answer: B
  explanation: La misión de la BMV es servir a todos los habitantes de Indiana (Hoosiers)
    proporcionando los mejores servicios de conductores y vehículos de manera oportuna
    y precisa, garantizando al mismo tiempo la seguridad y la transparencia.
- id: 6
  category: driver_testing
  question: Según la sección del manual sobre la obtención de una nueva credencial,
    ¿cuál de las siguientes evaluaciones o exámenes es obligatorio?
  choices:
    A: Examen de audición
    B: Examen de la vista
    C: Prueba de aptitud física
    D: Evaluación psicológica
  answer: B
  explanation: El Capítulo 1 del manual, que cubre la Obtención de una Nueva Credencial,
    enumera el 'Examen de la vista' como un componente obligatorio.
- id: 7
  category: driver_responsibility
  question: ¿Qué tema se cubre en el proceso de obtención de una nueva credencial
    con respecto a posibles accidentes o daños?
  choices:
    A: Responsabilidad financiera por lesiones o daños
    B: Cobertura integral contra choques
    C: Seguro de negligencia médica
    D: Registro de garantía del vehículo
  answer: A
  explanation: El Capítulo 1 del manual incluye una sección específica sobre la 'Responsabilidad
    financiera por lesiones o daños' al obtener una nueva credencial.
- id: 8
  category: license_system
  question: ¿Cuál de los siguientes se enumera como un endoso específico o tipo de
    licencia en el Manual del Conductor de Indiana?
  choices:
    A: Licencia de operador de maquinaria pesada
    B: Endoso de conductor de alquiler (For-Hire)
    C: Permiso de vehículo agrícola
    D: Licencia de vehículo recreativo (RV)
  answer: B
  explanation: El Capítulo 2 del manual cubre Restricciones y Endosos, que incluye
    explícitamente el 'Endoso de conductor de alquiler (For-Hire)'.
- id: 9
  category: license_system
  question: ¿Qué tipo de indicador militar se puede agregar a una credencial de Indiana?
  choices:
    A: Indicador de reserva retirada
    B: Indicador militar de servicio activo y veterano
    C: Indicador de dependiente de la Guardia Nacional
    D: Indicador de despliegue en el extranjero
  answer: B
  explanation: El Capítulo 3 del manual enumera el 'Indicador militar de servicio
    activo y veterano' como una opción para las credenciales.
- id: 10
  category: penalties_and_points
  question: ¿Qué programa está asociado con puntos y suspensiones en el Manual del
    Conductor de Indiana?
  choices:
    A: Programa de seguridad del conductor
    B: Programa de vigilancia de carreteras
    C: Iniciativa Hoosier Helper
    D: Programa de perdón de accidentes
  answer: A
  explanation: El Capítulo 5 del manual, que cubre Puntos, Suspensiones y Requisitos
    de Seguro, incluye información sobre el 'Programa de seguridad del conductor'.
- id: 11
  category: penalties_and_points
  question: ¿Qué término utiliza el Manual del Conductor de Indiana para describir
    a los conductores con múltiples infracciones de tránsito graves?
  choices:
    A: Infractores de tránsito crónicos
    B: Infractores de tránsito habituales
    C: Infractores reincidentes en movimiento
    D: Automovilistas de alto riesgo
  answer: B
  explanation: El Capítulo 5 del manual cubre puntos y suspensiones, e incluye una
    sección específica dedicada a los 'Infractores de tránsito habituales' (Habitual
    Traffic Violators).
- id: 12
  category: signs_and_signals
  question: ¿Cuál de las siguientes es una categoría específica de señales de tránsito
    que se analiza en el manual?
  choices:
    A: Señales de sugerencia de tránsito
    B: Señales de guía de tránsito
    C: Señales de control de tránsito
    D: Señales de observación de tránsito
  answer: B
  explanation: El Capítulo 6 del manual cubre Señales y Semáforos de Tránsito, el
    cual incluye una sección específica sobre 'Señales de guía de tránsito' (Traffic
    Guidance Signs).
- id: 13
  category: vehicle_information
  question: Según la sección del manual sobre la operación segura del vehículo, ¿qué
    tema de mantenimiento del vehículo se aborda específicamente junto con la presión
    de las llantas?
  choices:
    A: Vida útil del aceite
    B: Desgaste de las pastillas de freno
    C: Profundidad de la banda de rodadura
    D: Niveles de refrigerante
  answer: C
  explanation: El Capítulo 7 del manual cubre la Operación Segura del Vehículo, que
    incluye una sección titulada específicamente 'Presión de las llantas y profundidad
    de la banda de rodadura' (Tire Pressure and Tread Depth).
- id: 14
  category: safe_driving_rules
  question: ¿Cuáles de los siguientes comportamientos de manejo se abordan específicamente
    en el capítulo de Operación Segura del Vehículo?
  choices:
    A: Manejo distraído y manejo agresivo
    B: Paseos imprudentes (joyriding) y carreras callejeras
    C: Seguir muy de cerca (tailgating) y frenar bruscamente (brake checking)
    D: Viajes compartidos (carpooling) y servicios de transporte (ridesharing)
  answer: A
  explanation: El Capítulo 7 del manual cubre la Operación Segura del Vehículo, que
    incluye secciones específicas sobre 'Manejo distraído' (Distracted Driving) y
    'Manejo agresivo' (Aggressive Driving).
- id: 15
  category: license_system
  question: ¿Qué tipo específico de ciclo, aparte de la motocicleta, tiene su propia
    sección bajo Restricciones y Endosos?
  choices:
    A: Bicicletas
    B: Ciclo impulsado por motor (MDC)
    C: Scooters eléctricos
    D: Vehículos todoterreno (ATV)
  answer: B
  explanation: El Capítulo 2 del manual cubre Restricciones y Endosos, e incluye una
    sección específica para el 'Ciclo impulsado por motor (MDC)'.
- id: 16
  category: license_system
  question: ¿En qué formato se emiten las credenciales a los residentes de Indiana
    menores de 21 años?
  choices:
    A: Formato horizontal
    B: Formato vertical
    C: Formato cuadrado
    D: Formato de libreta
  answer: B
  explanation: Todas las credenciales emitidas a los residentes de Indiana menores
    de 21 años tienen un formato vertical y muestran las fechas en que el titular
    cumple 18 y 21 años de edad.
- id: 17
  category: license_system
  question: ¿Qué indica una marca de estrella en la esquina superior derecha de una
    credencial de Indiana?
  choices:
    A: El conductor es donante de órganos.
    B: El conductor tiene una licencia de conducir comercial.
    C: La credencial cumple con la ley Real ID.
    D: El conductor es menor de 21 años.
  answer: C
  explanation: Una marca de estrella aparece en la esquina superior derecha para indicar
    que una credencial cumple con la ley Real ID y puede usarse como identificación
    para fines federales.
- id: 18
  category: license_system
  question: ¿Cuánto tiempo tiene un nuevo residente de Indiana para obtener una nueva
    licencia de conducir de Indiana?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Cuando usted se convierte en residente de Indiana, tiene 60 días para
    obtener una nueva licencia de conducir de Indiana.
- id: 19
  category: license_system
  question: Si usted es un nuevo residente de Indiana que nunca ha tenido una licencia
    de conducir válida de otro estado, ¿por cuánto tiempo debe tener un permiso de
    aprendizaje de Indiana antes de solicitar una licencia de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: D
  explanation: Si nunca ha tenido una licencia de conducir válida de otro estado,
    debe tener un permiso de aprendizaje de Indiana durante 180 días antes de poder
    solicitar una licencia de conducir de Indiana.
- id: 20
  category: driver_testing
  question: ¿Qué exámenes debe aprobar si su licencia de conducir de otro estado ha
    estado vencida por más de cinco años?
  choices:
    A: Solo un examen de la vista estándar
    B: Solo un examen de conocimientos
    C: Un examen de conocimientos y un examen de habilidades de manejo
    D: Un examen de habilidades de manejo y un examen físico
  answer: C
  explanation: Si su licencia de conducir de otro estado ha estado vencida por más
    de cinco años, debe aprobar un examen de conocimientos y un examen de habilidades
    de manejo para obtener una licencia de conducir de Indiana.
- id: 21
  category: driver_testing
  question: ¿Qué examen se requiere para un nuevo residente de 18 años cuya licencia
    de conducir de otro estado ha estado vencida por menos de cinco años?
  choices:
    A: Una prueba de habilidades de manejo
    B: Un examen de conocimientos
    C: Un examen físico
    D: Una prueba de audición
  answer: B
  explanation: Si su licencia de conducir de otro estado ha estado vencida por menos
    de cinco años, o si ha tenido una licencia de conducir de otro estado no revocada
    por menos de un año, debe aprobar un examen de conocimientos para obtener una
    licencia de conducir de Indiana.
- id: 22
  category: license_system
  question: ¿Cuál de las siguientes opciones se considera prueba de residencia en
    Indiana?
  choices:
    A: Ser un empleado temporal en el estado
    B: Ser un votante registrado en Indiana
    C: Estar inscrito en una institución postsecundaria sin reclamar residencia en
      Indiana
    D: Ser un miembro militar en servicio activo que reclama residencia en otro estado
  answer: B
  explanation: La prueba de residencia en Indiana incluye mantener una dirección residencial
    en Indiana, ser un votante registrado en Indiana o tener un dependiente inscrito
    en una escuela primaria o secundaria ubicada en Indiana.
- id: 23
  category: license_system
  question: ¿Quién es elegible para recibir una Tarjeta de Identificación de Indiana
    sin costo?
  choices:
    A: Cualquier individuo menor de 18 años
    B: Las personas que tienen o tendrán 18 años de edad en o antes de la próxima
      Elección General o Municipal
    C: Cualquier nuevo residente de Indiana
    D: Las personas que han entregado una licencia de conducir de otro estado
  answer: B
  explanation: Las tarjetas de identificación se emiten sin costo a las personas que
    tienen o tendrán 18 años de edad en o antes de la próxima Elección General o Municipal.
- id: 24
  category: license_system
  question: ¿Cuál es la fecha límite establecida por el DHS y la TSA para exigir una
    credencial que cumpla con Real ID para abordar un avión?
  choices:
    A: 1 de enero de 2010
    B: 31 de diciembre de 2022
    C: 7 de mayo de 2025
    D: 1 de enero de 2026
  answer: C
  explanation: El Departamento de Seguridad Nacional (DHS) y la Administración de
    Seguridad en el Transporte (TSA) han establecido el 7 de mayo de 2025 como la
    fecha límite en la que comenzarán a exigir que quienes aborden un avión utilizando
    una licencia de conducir o tarjeta de identificación tengan una credencial que
    cumpla con Real ID.
- id: 25
  category: license_system
  question: ¿Cuál de los siguientes documentos NO está explícitamente listado como
    requisito para actualizar a una credencial que cumpla con Real ID?
  choices:
    A: Prueba de identidad
    B: Prueba de estatus legal
    C: Número de Seguro Social
    D: Prueba de seguro de vehículo
  answer: D
  explanation: Para actualizar a una credencial que cumpla con Real ID, debe proporcionar
    versiones originales o copias certificadas de su identidad, estatus legal, número
    de Seguro Social y prueba de residencia en Indiana. No se requiere prueba de seguro
    de vehículo.
- id: 26
  category: license_system
  question: ¿Qué sucede si la BMV descubre que un solicitante posee una credencial
    de otro estado durante el proceso de verificación?
  choices:
    A: El solicitante debe pagar una tarifa de doble residencia.
    B: Se le exigirá al solicitante que entregue la credencial del otro estado.
    C: Se le emitirá al solicitante una credencial temporal de Indiana por 60 días.
    D: El solicitante tiene prohibido permanentemente obtener una credencial de Indiana.
  answer: B
  explanation: Si durante la verificación, la BMV descubre que se ha emitido otra
    credencial a un solicitante en otro estado... se le exigirá al solicitante que
    entregue la credencial del otro estado antes de que la BMV procese una solicitud
    para una credencial de Indiana.
- id: 27
  category: license_system
  question: ¿Qué fechas se muestran de manera destacada en una credencial de Indiana
    emitida a un residente menor de 21 años?
  choices:
    A: Las fechas en que el titular de la tarjeta cumple 18 y 21 años de edad
    B: Las fechas en que el titular de la tarjeta cumple 16 y 18 años de edad
    C: Las fechas en que el titular de la tarjeta obtuvo su permiso y licencia
    D: Las fechas de las próximas Elecciones Generales y Municipales
  answer: A
  explanation: Todas las credenciales emitidas a residentes de Indiana menores de
    21 años tienen un formato vertical y muestran las fechas en que el titular de
    la tarjeta cumple 18 y 21 años de edad.
- id: 28
  category: driver_testing
  question: Además de proporcionar la documentación requerida, ¿qué examen deben aprobar
    todos los nuevos residentes de Indiana al obtener una licencia de conducir de
    Indiana?
  choices:
    A: Un examen de audición estándar
    B: Un examen de la vista estándar
    C: Un examen de drogas y alcohol
    D: Un examen de agilidad física
  answer: B
  explanation: Las personas en todas las categorías mencionadas anteriormente también
    deben presentar documentación que demuestre su identidad, estatus legal, número
    de Seguro Social y residencia en Indiana... También se requiere que apruebe un
    examen de la vista estándar.
- id: 29
  category: license_system
  question: ¿Cuál de las siguientes personas NO se considera residente de Indiana
    para fines de obtener una credencial?
  choices:
    A: Una persona que mantiene una dirección residencial en Indiana y no reclama
      residencia en otro lugar
    B: Un votante registrado en Indiana
    C: Una persona con un dependiente inscrito en una escuela primaria de Indiana
    D: Personal militar en servicio activo en las fuerzas armadas que no reclama a
      Indiana como su estado de residencia
  answer: D
  explanation: Para fines de obtener una credencial, el personal militar en servicio
    activo en las fuerzas armadas que no reclama a Indiana como su estado de residencia
    no se considera residente de Indiana.
- id: 30
  category: license_system
  question: Si tiene 18 años de edad o más y posee una licencia de conducir válida
    de otro estado, ¿cuál de los siguientes documentos puede llevar a la sucursal
    para solicitar una licencia de Indiana?
  choices:
    A: Una copia de su diploma de escuela secundaria
    B: Una copia de su historial de manejo oficial
    C: Una carta del gobernador de su estado anterior
    D: Una factura de servicios públicos de su estado anterior
  answer: B
  explanation: 'Si tiene al menos 18 años de edad y posee una licencia de conducir
    válida de otro estado, debe llevar uno de los siguientes tres documentos a la
    sucursal: su licencia de conducir actual de otro estado, una copia de su historial
    de manejo oficial o una carta de verificación.'
- id: 31
  category: license_system
  question: ¿Por cuánto tiempo es válida una tarjeta de identificación estándar de
    Indiana?
  choices:
    A: 2 años
    B: 4 años
    C: 6 años
    D: 8 años
  answer: C
  explanation: Según el manual, una tarjeta de identificación y un endoso de ciclo
    impulsado por motor (MDC) son válidos por seis años.
- id: 32
  category: license_system
  question: Si está solicitando una tarjeta de identificación de Indiana pero ya posee
    una credencial de otro estado, ¿qué debe hacer?
  choices:
    A: Conservar ambas credenciales siempre que sean de estados diferentes
    B: Entregar la otra credencial a la BMV de Indiana
    C: Pagar una tarifa adicional para tener múltiples credenciales
    D: Destruir usted mismo la credencial de fuera del estado
  answer: B
  explanation: Los residentes de Indiana no pueden tener más de una credencial al
    mismo tiempo. Por lo tanto, debe entregar cualquier otra credencial a la BMV de
    Indiana para completar una solicitud de tarjeta de identificación.
- id: 33
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener un endoso de ciclo impulsado
    por motor (MDC) en una tarjeta de identificación?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: B
  explanation: Las tarjetas de identificación pueden otorgar privilegios para operar
    un ciclo impulsado por motor (MDC) siempre que tenga al menos 15 años de edad
    y apruebe un examen de conocimientos de MDC.
- id: 34
  category: driver_testing
  question: Si tiene menos de 16 años y solicita un permiso de aprendizaje, ¿cuál
    de los siguientes NO es un documento aceptable para demostrar la inscripción en
    educación vial?
  choices:
    A: Un Certificado de Inscripción en Educación Vial de la escuela
    B: Un certificado con fecha de dos semanas antes del inicio de la clase
    C: Un certificado de finalización de un curso en línea de formación teórica
    D: Un documento que demuestre la inscripción en un proveedor de capacitación práctica
      al volante con licencia de la BMV
  answer: C
  explanation: El manual establece explícitamente que el certificado de finalización
    del curso en línea de formación teórica no es un documento aceptable para demostrar
    la inscripción.
- id: 35
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje estándar a partir
    de la fecha de emisión?
  choices:
    A: 1 año
    B: 2 años
    C: 4 años
    D: 6 años
  answer: B
  explanation: Según la sección de Validez del Permiso de Aprendizaje, los permisos
    de aprendizaje son válidos por dos años a partir de la fecha de emisión.
- id: 36
  category: driver_testing
  question: Al renovar su permiso de aprendizaje, ¿después de cuántos días de vencimiento
    debe volver a tomar el examen?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: D
  explanation: Si visita una sucursal de la BMV para renovar su permiso de aprendizaje
    y este ha estado vencido por más de 180 días, se le exigirá que vuelva a tomar
    el examen.
- id: 37
  category: safe_driving_rules
  question: Si tiene menos de 16 años y está practicando la conducción con un familiar,
    ¿cuál es la edad mínima que debe tener el familiar con licencia?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: C
  explanation: Puede practicar la conducción con un conductor con licencia que tenga
    privilegios de conducción válidos y tenga 25 años de edad o más, siempre que esté
    emparentado con usted por consanguinidad, matrimonio o estatus legal.
- id: 38
  category: driver_testing
  question: ¿Con cuánta anticipación debe llegar a una sucursal de la BMV antes de
    que cierre para tomar el examen de conocimientos por computadora?
  choices:
    A: Al menos 15 minutos
    B: Al menos 30 minutos
    C: Al menos 45 minutos
    D: Al menos 1 hora
  answer: B
  explanation: Debe llegar a la sucursal al menos 30 minutos antes de que cierre para
    poder tomar el examen de conocimientos por computadora ese día.
- id: 39
  category: driver_testing
  question: ¿Qué debe hacer si no aprueba el examen de conocimientos de manejo?
  choices:
    A: Volver a tomarlo inmediatamente después de pagar una tarifa
    B: Esperar al menos 30 minutos para volver a tomarlo
    C: Esperar hasta el siguiente día hábil para volver a tomarlo
    D: Esperar una semana completa para volver a tomarlo
  answer: C
  explanation: 'El manual establece: ''Si no aprueba el examen de conocimientos, debe
    esperar hasta el siguiente día hábil para volver a tomarlo''.'
- id: 40
  category: penalties_and_points
  question: Un conductor que renueva su licencia de conducir de Indiana debe tomar
    el examen de conocimientos si tiene al menos ¿cuántos puntos activos en su historial
    de manejo?
  choices:
    A: 2 o más puntos activos
    B: 4 o más puntos activos
    C: 6 o más puntos activos
    D: 8 o más puntos activos
  answer: C
  explanation: Se requiere el examen de conocimientos de manejo para un conductor
    que tiene seis o más puntos activos en su historial de manejo de Indiana y está
    renovando su licencia de conducir.
- id: 41
  category: driver_testing
  question: ¿Qué debe hacer si normalmente usa anteojos o lentes de contacto al conducir
    y va a realizar el examen de la vista?
  choices:
    A: Quitárselos para evaluar su visión natural
    B: Usarlos durante el examen de la vista
    C: Usarlos solo si no aprueba el examen inicial
    D: Presentar una nota médica en lugar de realizar el examen
  answer: B
  explanation: Si normalmente usa anteojos o lentes de contacto al conducir, debe
    informar al personal de la sucursal de la BMV y usarlos durante el examen de la
    vista.
- id: 42
  category: license_system
  question: Si es menor de 18 años y solicita un permiso de aprendizaje, debe proporcionar
    un contacto de emergencia que tenga al menos ¿qué edad?
  choices:
    A: 18 años de edad o más
    B: 21 años de edad o más
    C: 25 años de edad o más
    D: Cualquier edad siempre y cuando sea un familiar
  answer: A
  explanation: A una persona menor de 18 años que solicita un permiso de aprendizaje
    se le exige proporcionar un contacto de emergencia que tenga al menos 18 años
    de edad o más.
- id: 43
  category: safe_driving_rules
  question: Si es menor de 18 años y está bajo el cuidado del Departamento de Servicios
    para Niños (DCS), puede practicar la conducción con un conductor con licencia
    que no sea familiar si está aprobado por el DCS y tiene al menos ¿qué edad?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: C
  explanation: Si está bajo el cuidado del Departamento de Servicios para Niños (DCS),
    puede optar por practicar la conducción con un conductor con licencia que tenga
    25 años de edad o más y esté aprobado por el Departamento de Servicios para Niños.
- id: 44
  category: driver_testing
  question: Si no aprueba el examen de conocimientos por computadora, ¿cuánto tiempo
    debe esperar antes de poder volver a tomarlo?
  choices:
    A: Hasta el siguiente día hábil
    B: 48 horas
    C: 7 días
    D: 14 días
  answer: A
  explanation: Si no aprueba el examen de conocimientos, debe esperar hasta el siguiente
    día hábil para volver a tomarlo.
- id: 45
  category: driver_testing
  question: Al programar un examen de habilidades de manejo en la BMV, ¿cuál es el
    tiempo máximo de anticipación con el que puede programar la cita?
  choices:
    A: Una semana
    B: Dos semanas
    C: Tres semanas
    D: Un mes
  answer: C
  explanation: Un examen de habilidades de manejo puede programarse con no más de
    tres semanas y no menos de 48 horas hábiles de anticipación.
- id: 46
  category: vehicle_information
  question: ¿Cuál de las siguientes es una razón válida para que un examinador de
    la BMV rechace un vehículo para el examen de habilidades de manejo?
  choices:
    A: El vehículo tiene transmisión manual
    B: El vehículo tiene una puerta que no funciona
    C: El vehículo tiene más de 10 años de antigüedad
    D: El vehículo no tiene cámara de reversa
  answer: B
  explanation: Ejemplos de razones por las que los vehículos pueden ser rechazados
    para el examen de habilidades de manejo incluyen una puerta que no funciona, llantas
    inseguras, falta de parachoques, vidrios/espejos rotos o no estar debidamente
    registrados.
- id: 47
  category: driver_testing
  question: ¿Cuál de las siguientes acciones resultará en la reprobación automática
    del examen de habilidades de manejo?
  choices:
    A: Dejar la luz direccional encendida después de completar un cambio de carril
    B: No revisar su punto ciego
    C: Retroceder sobre un bordillo
    D: Retroceder demasiado rápido
  answer: C
  explanation: Retroceder sobre un bordillo está catalogado como una acción que resultará
    en la reprobación automática del examen de habilidades de manejo. Las otras opciones
    son acciones que podrían afectar su puntaje final o causar que repruebe, pero
    no están catalogadas como reprobaciones automáticas.
- id: 48
  category: driver_testing
  question: ¿A quién se le permite estar en el vehículo con usted cuando realiza el
    examen de habilidades de manejo?
  choices:
    A: Un padre o tutor con licencia
    B: Un instructor de manejo certificado
    C: Solo el examinador de la BMV o personal autorizado de la BMV
    D: Cualquier persona con una licencia de conducir válida
  answer: C
  explanation: No se permite a nadie más que al examinador (o examinadores) de la
    BMV que realiza el examen de habilidades u otro personal autorizado de la BMV
    en su vehículo cuando realiza el examen de habilidades de manejo.
- id: 49
  category: driver_testing
  question: ¿Qué sucede si reprueba un tercer examen de habilidades de manejo mientras
    tiene un permiso de aprendizaje?
  choices:
    A: Debe esperar dos meses antes de volver a tomar el examen
    B: Su permiso de aprendizaje es revocado permanentemente
    C: Debe volver a tomar el curso de educación vial
    D: Debe esperar seis meses antes de volver a tomar el examen
  answer: A
  explanation: Al reprobar un tercer examen de habilidades de manejo mientras tiene
    un permiso de aprendizaje, debe esperar dos meses a partir de la fecha del último
    examen de habilidades de manejo reprobado antes de volver a tomar el examen.
- id: 50
  category: driver_responsibility
  question: ¿Quién tiene el primer orden de preferencia para firmar una declaración
    jurada de responsabilidad financiera para un solicitante menor de 18 años de edad?
  choices:
    A: El padre sin custodia
    B: El tutor que tiene la custodia del menor
    C: Cualquier adulto dispuesto a asumir la obligación
    D: El padre que tiene la custodia del solicitante menor
  answer: D
  explanation: El orden legal de preferencia para la responsabilidad financiera es
    primero el padre que tiene la custodia del solicitante menor (o una persona designada
    especificada por el padre con custodia).
- id: 51
  category: driver_responsibility
  question: ¿Qué sucede si el adulto que firmó conjuntamente la responsabilidad financiera
    presenta una solicitud por escrito para retirar su responsabilidad financiera
    por un menor?
  choices:
    A: El menor debe pagar una multa
    B: El permiso de aprendizaje o la licencia de conducir del menor será cancelado
    C: El menor debe encontrar un nuevo cofirmante dentro de los 30 días para conservar
      su licencia
    D: El menor está restringido a conducir solo hacia y desde la escuela
  answer: B
  explanation: Una solicitud por escrito para retirar la responsabilidad financiera
    cancelará el permiso de aprendizaje o la licencia de conducir del menor.
- id: 52
  category: license_system
  question: Si un solicitante menor de edad está bajo el cuidado del Departamento
    de Servicios para Niños (DCS), ¿qué debe proporcionar en lugar de la firma de
    un adulto para la responsabilidad financiera?
  choices:
    A: Una carta de recomendación de un juez
    B: Prueba de una póliza de seguro de vehículo motorizado que cumpla con los estándares
      mínimos de responsabilidad
    C: Un depósito en efectivo de $1,000 a la BMV
    D: Prueba de haber completado un curso avanzado de manejo defensivo
  answer: B
  explanation: Si el solicitante del DCS está solicitando una licencia de conducir
    o un permiso de aprendizaje, también debe proporcionar prueba de una póliza de
    seguro de vehículo motorizado que cumpla con los estándares mínimos de responsabilidad
    establecidos en la ley de Indiana.
- id: 53
  category: license_system
  question: Si está solicitando una licencia de conducir y es menor de 21 años, ¿qué
    tipo de licencia recibirá?
  choices:
    A: Una licencia restringida
    B: Una licencia de conducir comercial (CDL)
    C: Una licencia de conducir probatoria
    D: Un permiso de aprendizaje
  answer: C
  explanation: Si es menor de 21 años, su licencia de conducir se considera una licencia
    "probatoria".
- id: 54
  category: driver_testing
  question: Durante el examen de habilidades de manejo, ¿cuál de las siguientes acciones
    causará una reprobación automática?
  choices:
    A: No usar el cinturón de seguridad
    B: No usar el desempañador cuando sea necesario
    C: Conducir demasiado despacio
    D: Disminuir la velocidad al cambiar de carril
  answer: A
  explanation: No usar el cinturón de seguridad está incluido en las acciones que
    resultarán en la reprobación automática del examen de habilidades de manejo. Las
    otras opciones son acciones que podrían afectar su puntaje final o causar que
    repruebe, pero no son reprobaciones automáticas.
- id: 55
  category: driver_testing
  question: ¿Cuánto cobra la BMV por administrar un examen de habilidades de manejo?
  choices:
    A: $15
    B: $25
    C: $50
    D: No tiene costo
  answer: D
  explanation: El examen de habilidades de manejo administrado por la BMV no tiene
    costo.
- id: 56
  category: license_system
  question: ¿Qué edad debe tener para solicitar una licencia de conducir si NO ha
    completado un programa de educación vial autorizado por la BMV?
  choices:
    A: 16 años y 90 días de edad
    B: 16 años y 180 días de edad
    C: 16 años y 270 días de edad
    D: 18 años de edad
  answer: C
  explanation: Según el manual, debe tener al menos 16 años y 270 días de edad si
    no ha completado un programa de educación vial autorizado por la BMV.
- id: 57
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir estándar para una
    persona de 80 años?
  choices:
    A: Dos años
    B: Tres años
    C: Cuatro años
    D: Seis años
  answer: B
  explanation: El manual establece que una licencia de conducir es válida por tres
    años si tiene entre 75 y 84 años de edad.
- id: 58
  category: safe_driving_rules
  question: Durante los primeros 180 días de tener una licencia de conducir probatoria,
    ¿con cuál de los siguientes pasajeros se le permite conducir sin estar acompañado
    por un adulto calificado?
  choices:
    A: Sus amigos de la escuela
    B: Su hermano o hermana
    C: Su primo
    D: Su vecino
  answer: B
  explanation: Puede conducir con su hijo, hijastro, hermano, hermanastro, medio hermano
    o cónyuge sin otro individuo que lo acompañe durante los primeros 180 días después
    de obtener su licencia de conducir probatoria.
- id: 59
  category: safe_driving_rules
  question: Durante los primeros 180 días después de obtener su licencia de conducir
    probatoria, ¿entre qué horas no puede conducir?
  choices:
    A: 10 p.m. y 5 a.m.
    B: 11 p.m. y 6 a.m.
    C: Medianoche y 5 a.m.
    D: 9 p.m. y 6 a.m.
  answer: A
  explanation: 'El manual establece: "Durante los primeros 180 días después de obtener
    su licencia de conducir probatoria, no puede conducir entre las 10 p.m. y las
    5 a.m."'
- id: 60
  category: safe_driving_rules
  question: ¿Cuándo se le permite a un titular de una licencia de conducir probatoria
    usar un dispositivo de telecomunicaciones mientras opera un vehículo motorizado?
  choices:
    A: Al usar un dispositivo manos libres
    B: Al enviar mensajes de texto a un padre o tutor
    C: Al estar detenido en un semáforo en rojo
    D: Al hacer una llamada de emergencia al 911
  answer: D
  explanation: La ley de Indiana prohíbe a todos los conductores operar un vehículo
    motorizado mientras usan cualquier forma de dispositivo de telecomunicaciones,
    a menos que el dispositivo se esté utilizando para hacer una llamada de emergencia
    al 911.
- id: 61
  category: penalties_and_points
  question: 'La BMV está obligada a suspender los privilegios de manejo de un menor
    tras la notificación de un administrador escolar si el menor:'
  choices:
    A: Recibe una sola detención escolar
    B: Se determina que es un ausentista habitual
    C: Reprueba un curso de educación vial
    D: Llega tarde a la escuela tres veces
  answer: B
  explanation: La ley de Indiana exige que la BMV suspenda los privilegios de manejo
    de un menor si está bajo expulsión/exclusión/segunda suspensión, se ha retirado
    de la escuela o se ha determinado que es un ausentista habitual.
- id: 62
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar una Licencia de Conducir
    Comercial (CDL) con endosos de pasajeros y/o autobús escolar?
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: 16 años y 270 días
  answer: B
  explanation: Debe tener al menos 18 años de edad para solicitar una CDL y 21 años
    de edad para solicitar una CDL con endosos de pasajeros y/o autobús escolar.
- id: 63
  category: driver_testing
  question: Si está solicitando una licencia de conducir y tiene al menos 18 años
    de edad, ¿cuántas horas de práctica de manejo supervisada debe completar?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Si está solicitando una licencia de conducir y tiene al menos 18 años
    de edad, debe completar al menos 50 horas de práctica de manejo supervisada.
- id: 64
  category: driver_testing
  question: De las 50 horas requeridas de práctica de manejo supervisada, ¿cuántas
    horas deben completarse de noche (a menos que tenga una restricción de solo conducir
    de día)?
  choices:
    A: 5 horas
    B: 10 horas
    C: 15 horas
    D: 20 horas
  answer: B
  explanation: Al menos 10 horas de práctica de manejo supervisada deben completarse
    de noche, a menos que tenga una restricción de solo conducir de día en su permiso
    de aprendizaje.
- id: 65
  category: license_system
  question: 'Si obtiene una licencia de conducir antes de los 21 años, su licencia
    de conducir probatoria es válida hasta que tenga:'
  choices:
    A: 21 años de edad exactamente
    B: 21 años y 30 días de edad
    C: 21 años y 90 días de edad
    D: 25 años de edad
  answer: B
  explanation: Su licencia de conducir probatoria es válida hasta que tenga 21 años
    y 30 días de edad.
- id: 66
  category: license_system
  question: Después de solicitar una nueva credencial, ¿dentro de cuántos días calendario
    llegará a su dirección postal?
  choices:
    A: 7 días calendario
    B: 10 días calendario
    C: 14 días calendario
    D: 21 días calendario
  answer: C
  explanation: Su credencial se enviará a la dirección postal registrada en la BMV
    y llegará a su dirección postal dentro de 14 días calendario.
- id: 67
  category: license_system
  question: ¿Por qué motivos están disponibles las tarjetas de identificación exentas
    de fotografía?
  choices:
    A: Solo por motivos médicos
    B: Solo por motivos religiosos
    C: Por motivos médicos y religiosos
    D: Solo por motivos de privacidad
  answer: B
  explanation: Los permisos de aprendizaje y las licencias de conducir exentos de
    fotografía están disponibles por motivos médicos y religiosos. Las tarjetas de
    identificación exentas de fotografía están disponibles solo por motivos religiosos.
- id: 68
  category: driver_testing
  question: Al solicitar una licencia de conducir, ¿cuál de las siguientes afirmaciones
    es verdadera con respecto a los exámenes de conocimientos y habilidades?
  choices:
    A: El examen de habilidades debe completarse antes que el examen de conocimientos
    B: El examen de conocimientos debe completarse antes que el examen de habilidades
    C: Ambos exámenes deben tomarse el mismo día
    D: El examen de conocimientos se exime si aprueba el examen de habilidades
  answer: B
  explanation: Para obtener una licencia de conducir, debe aprobar un examen de conocimientos
    para la licencia de conducir que desea obtener, el cual debe completarse antes
    del examen de habilidades.
- id: 69
  category: safe_driving_rules
  question: 'Después de tener una licencia probatoria durante 180 días (y ser menor
    de 18 años), puede conducir durante las horas restringidas si participa, va o
    regresa de:'
  choices:
    A: Una actividad autorizada por la escuela
    B: La casa de un amigo
    C: Un evento deportivo local como espectador
    D: Un parque público
  answer: A
  explanation: Puede conducir durante los períodos restringidos si participa, va o
    regresa de un empleo legal, una actividad autorizada por la escuela o un evento
    religioso.
- id: 70
  category: vehicle_information
  question: 'Una CDL de Indiana permite al titular operar vehículos motorizados comerciales
    con clasificaciones de peso bruto del vehículo que superen las:'
  choices:
    A: 10,000 libras
    B: 16,000 libras
    C: 20,000 libras
    D: 26,000 libras
  answer: D
  explanation: Una CDL de Indiana permite al titular operar vehículos motorizados
    comerciales o combinaciones de vehículos con clasificaciones de peso bruto del
    vehículo que superen las 26,000 libras.
- id: 71
  category: license_system
  question: ¿Qué sucede si cambia su dirección postal con el Servicio Postal de los
    Estados Unidos (USPS) pero olvida actualizarla con la BMV de Indiana?
  choices:
    A: El USPS reenviará automáticamente su credencial a su nueva dirección.
    B: Su credencial será retenida en la oficina de correos local para que la recoja.
    C: Su credencial no será reenviada, lo que impedirá su entrega.
    D: En su lugar, la BMV le enviará por correo electrónico una copia digital de
      su credencial.
  answer: C
  explanation: El manual establece que las credenciales solo se enviarán por correo
    a la dirección registrada en la BMV y no serán reenviadas. No actualizar su dirección
    con la BMV impedirá la entrega.
- id: 72
  category: safe_driving_rules
  question: Según la ley de Indiana, ¿quién está obligado a usar el cinturón de seguridad
    cuando un vehículo motorizado está en movimiento?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero.
    B: Todos los ocupantes de un vehículo motorizado equipado con un cinturón de seguridad
      de instalación estándar.
    C: Solo los pasajeros menores de 18 años.
    D: El conductor, a menos que esté operando un vehículo comercial.
  answer: B
  explanation: La ley de Indiana exige que todos los ocupantes de un vehículo motorizado
    equipado con un cinturón de seguridad que sea equipo estándar instalado por el
    fabricante usen el cinturón de seguridad en todo momento que el vehículo esté
    en movimiento.
- id: 73
  category: driver_responsibility
  question: ¿Cuándo es legalmente permitido usar un dispositivo de telecomunicaciones
    para escribir o leer un mensaje de texto mientras opera un vehículo motorizado
    en movimiento?
  choices:
    A: Cuando viaja a velocidades inferiores a 15 mph.
    B: Cuando está detenido en un semáforo en rojo.
    C: Cuando usa tecnología de manos libres o hace una llamada de emergencia al 911.
    D: Cuando conduce en una carretera rural sin otro tráfico.
  answer: C
  explanation: La ley de Indiana prohíbe escribir, transmitir o leer un texto o correo
    electrónico mientras se opera un vehículo en movimiento, a menos que el dispositivo
    se use con tecnología de manos libres o controlada por voz, o para hacer una llamada
    de emergencia al 911.
- id: 74
  category: driver_responsibility
  question: ¿Cuál de los siguientes NO se considera un dispositivo de telecomunicaciones
    restringido según las leyes de conducción de Indiana?
  choices:
    A: Un teléfono inalámbrico.
    B: Un asistente digital personal (PDA).
    C: Un dispositivo de mensajería de texto.
    D: Equipo de radio de banda ciudadana (CB) operado por un operador con licencia.
  answer: D
  explanation: La definición de un dispositivo de telecomunicaciones no incluye el
    equipo de radio de banda ciudadana (CB) operado por una persona con licencia de
    la FCC.
- id: 75
  category: license_system
  question: ¿Qué indica la Restricción G cuando se coloca en una licencia de conducir
    de Indiana?
  choices:
    A: Se requieren anteojos o lentes de contacto.
    B: Se requieren espejos retrovisores exteriores.
    C: Conducción solo de día (luz diurna).
    D: Se requiere dispositivo de bloqueo de encendido (interlock).
  answer: C
  explanation: Según la tabla de Restricciones Básicas de la Licencia de Conducir,
    la Restricción G significa 'Conducción solo de día' (Daylight Driving Only).
- id: 76
  category: safe_driving_rules
  question: ¿Cuáles son las horas permitidas para conducir para una persona que tiene
    un permiso de aprendizaje de motocicleta?
  choices:
    A: Entre las 6:00 AM y las 6:00 PM.
    B: Media hora antes del amanecer hasta media hora después del atardecer.
    C: Solo desde el amanecer hasta el atardecer.
    D: No hay restricciones de tiempo para los titulares de permisos.
  answer: B
  explanation: Si tiene un permiso de aprendizaje de motocicleta, solo puede conducir
    durante el período de media hora antes del amanecer y media hora después del atardecer.
- id: 77
  category: license_system
  question: Si está obteniendo su licencia de conducir de Indiana por primera vez,
    ¿cuál es el requisito de edad mínima para obtener un endoso de motocicleta al
    mismo tiempo?
  choices:
    A: 15 años de edad.
    B: 16 años de edad.
    C: 16 años y 90 días de edad.
    D: 18 años de edad.
  answer: C
  explanation: Puede obtener un endoso de motocicleta al mismo tiempo que su primera
    licencia de conducir, siempre que tenga 16 años y 90 días de edad o más y haya
    completado un curso de seguridad para motocicletas.
- id: 78
  category: vehicle_information
  question: 'Para ser definido como un Ciclo Motorizado (MDC) según la ley de Indiana,
    la capacidad del cilindro del vehículo no debe exceder:'
  choices:
    A: 35 centímetros cúbicos.
    B: 50 centímetros cúbicos.
    C: 150 centímetros cúbicos.
    D: 250 centímetros cúbicos.
  answer: B
  explanation: La ley de Indiana define un vehículo como un MDC si, entre otros requisitos,
    tiene una capacidad de cilindro que no excede los 50 centímetros cúbicos.
- id: 79
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una restricción que se aplica a la operación
    de un Ciclo Motorizado (MDC)?
  choices:
    A: Debe operar a no más de 35 millas por hora.
    B: Puede llevar un pasajero si usa casco.
    C: Puede ser operado en autopistas interestatales.
    D: Debe ser operado en el centro de la calzada.
  answer: A
  explanation: Las restricciones para operar un MDC incluyen operar a no más de 35
    millas por hora, no llevar pasajeros y no operar en una autopista interestatal.
- id: 80
  category: vehicle_information
  question: ¿Cuál de las siguientes características se requiere para que un vehículo
    motorizado de tres ruedas se defina legalmente como un autociclo en Indiana?
  choices:
    A: Manubrios para la dirección.
    B: Frenos antibloqueo.
    C: Un asiento tipo silla de montar.
    D: Una capacidad de cilindro inferior a 50 cc.
  answer: B
  explanation: Un autociclo debe estar equipado con una jaula/barras antivuelco, cinturones
    de seguridad, frenos antibloqueo y estar diseñado para ser controlado con un volante
    y pedales.
- id: 81
  category: license_system
  question: ¿Qué credencial se requiere para operar legalmente un autociclo en las
    carreteras de Indiana?
  choices:
    A: Un permiso de aprendizaje para motocicleta
    B: Un endoso para motocicleta
    C: Una licencia de conducir válida de Indiana
    D: Una licencia de conducir comercial (CDL)
  answer: C
  explanation: Puede operar un autociclo en las carreteras de Indiana si posee una
    licencia de conducir válida de Indiana. No se requiere un permiso de aprendizaje
    ni un endoso para motocicleta.
- id: 82
  category: driver_testing
  question: ¿Cuál de las siguientes acciones está prohibida al operar un autociclo?
  choices:
    A: Conducir en autopistas interestatales
    B: Usar el autociclo para un examen de habilidades de manejo para obtener una
      licencia de conducir
    C: Operar el vehículo sin un casco de motocicleta
    D: Llevar un pasajero en el área de asientos cerrada
  answer: B
  explanation: El manual establece explícitamente que un autociclo 'No puede usarse
    para el propósito de un examen de habilidades de manejo para obtener una licencia
    de conducir'.
- id: 83
  category: license_system
  question: ¿Un endoso de transporte por contrato (for-hire) permite al titular de
    la credencial operar un vehículo motorizado diseñado para transportar a menos
    de cuántos pasajeros por contrato?
  choices:
    A: 10 pasajeros
    B: 12 pasajeros
    C: 15 pasajeros
    D: 16 pasajeros
  answer: D
  explanation: Un endoso de transporte por contrato (for-hire) otorga privilegios
    para operar un vehículo motorizado diseñado para transportar a menos de 16 pasajeros,
    incluido el conductor, con el propósito de transportar pasajeros por contrato.
- id: 84
  category: license_system
  question: ¿Cuáles son los requisitos de edad y experiencia para obtener un endoso
    de transporte por contrato (for-hire) en Indiana?
  choices:
    A: Al menos 16 años de edad con 6 meses de experiencia de manejo
    B: Al menos 18 años de edad y haber tenido una licencia de conducir válida de
      Indiana durante al menos un año
    C: Al menos 21 años de edad con un historial de manejo limpio
    D: Al menos 18 años de edad y haber tenido una licencia de conducir válida de
      Indiana durante al menos dos años
  answer: B
  explanation: Según el manual, se puede emitir un endoso de transporte por contrato
    (for-hire) a los residentes de Indiana que tengan al menos 18 años de edad y que
    hayan tenido una licencia de conducir válida de Indiana durante al menos un año.
- id: 85
  category: license_system
  question: ¿Requiere la BMV de Indiana un informe de examen médico para emitir una
    licencia de conducir con un endoso de transporte por contrato (for-hire)?
  choices:
    A: Sí, debe actualizarse cada dos años.
    B: Sí, pero solo para conductores mayores de 65 años.
    C: No, la BMV no requiere un informe de examen médico para un endoso de transporte
      por contrato (for-hire).
    D: No, a menos que el conductor transporte materiales peligrosos.
  answer: C
  explanation: 'El manual establece: ''La BMV no requiere un informe de examen médico
    para emitir una licencia de conducir con el endoso de transporte por contrato
    (for-hire)''.'
- id: 86
  category: vehicle_information
  question: Según el manual del conductor de Indiana, ¿cuál de las siguientes opciones
    NO se considera transporte por contrato (for-hire)?
  choices:
    A: Operar un vehículo de viaje compartido (ride share)
    B: Operar un vehículo de servicios médicos
    C: Operar un taxi o limusina
    D: Operar un autobús utilizado para transportar pasajeros por compensación
  answer: B
  explanation: El manual enumera explícitamente 'Operar un vehículo de servicios médicos'
    como una excepción que no se considera transporte por contrato (for-hire).
- id: 87
  category: driver_responsibility
  question: Según la Ley de Elección de Donantes (Donor Choice Law) de Indiana, ¿qué
    sucede si una persona de 18 años o más declara su intención de ser donante de
    órganos?
  choices:
    A: Sus familiares pueden anular la decisión en el momento del fallecimiento.
    B: Deben renovar su declaración cada cuatro años.
    C: Sus familiares no pueden anular su intención en el momento del fallecimiento.
    D: Deben llevar una tarjeta de donante de órganos separada en todo momento.
  answer: C
  explanation: El manual establece que, según la Ley de Elección de Donantes de Indiana,
    las personas de 18 años o más pueden declarar su intención de ser donantes de
    órganos y sus familiares no pueden anular su intención en el momento del fallecimiento.
- id: 88
  category: license_system
  question: ¿Qué documento debe proporcionar un veterano para obtener un indicador
    de veterano en su credencial?
  choices:
    A: Una Tarjeta de Acceso Común (CAC)
    B: Un formulario DD 214 emitido por el Departamento de Defensa de los Estados
      Unidos
    C: Una carta del Departamento de Asuntos de Veteranos
    D: Una tarjeta de identificación militar válida
  answer: B
  explanation: Para obtener el indicador de veterano, debe proporcionar un formulario
    DD 214 emitido por el Departamento de Defensa de los Estados Unidos que verifique
    su baja.
- id: 89
  category: safe_driving_rules
  question: La ley de Indiana requiere que el operador de una embarcación lleve una
    licencia de conducir válida si el motor produce más de ¿cuántos caballos de fuerza?
  choices:
    A: 5 caballos de fuerza
    B: 10 caballos de fuerza
    C: 15 caballos de fuerza
    D: 25 caballos de fuerza
  answer: B
  explanation: La ley de Indiana requiere que el operador de una embarcación con un
    motor que produzca más de 10 caballos de fuerza lleve una licencia de conducir
    válida.
- id: 90
  category: license_system
  question: Si tiene 15 años o más y no tiene una licencia de conducir, ¿qué debe
    hacer para operar legalmente una embarcación con un motor de más de 10 caballos
    de fuerza?
  choices:
    A: Completar con éxito un curso de educación para navegantes aprobado y llevar
      una tarjeta de identificación válida de Indiana.
    B: Tener a un adulto con licencia mayor de 21 años en la embarcación con usted.
    C: Solicitar un permiso temporal para embarcaciones en la BMV.
    D: No puede operar una embarcación bajo ninguna circunstancia sin una licencia
      de conducir.
  answer: A
  explanation: Si tiene 15 años o más y no tiene una licencia de conducir, puede operar
    una embarcación solo después de completar con éxito un curso de educación para
    navegantes aprobado, y debe tener en su poder una tarjeta de identificación válida
    de Indiana.
- id: 91
  category: penalties_and_points
  question: ¿Qué sucede con su capacidad para operar una embarcación si su licencia
    de conducir está suspendida?
  choices:
    A: Solo puede operar una embarcación durante las horas de luz diurna.
    B: Puede operar una embarcación si completa un curso de educación para navegantes.
    C: No puede operar una embarcación.
    D: Puede operar una embarcación siempre que tenga menos de 25 caballos de fuerza.
  answer: C
  explanation: 'El manual establece: ''Si su licencia de conducir está suspendida,
    no puede operar una embarcación''.'
- id: 92
  category: vehicle_information
  question: ¿Cuándo vence un cartel de estacionamiento emitido por una discapacidad
    temporal?
  choices:
    A: En la fecha indicada por el proveedor de atención médica o un año después de
      su emisión, lo que ocurra primero.
    B: Dos años a partir de la fecha de emisión.
    C: En el próximo cumpleaños del conductor.
    D: Seis meses a partir de la fecha de emisión.
  answer: A
  explanation: Si tiene una discapacidad temporal, su cartel de estacionamiento vence
    en la fecha indicada por el proveedor de atención médica o un año después de la
    fecha de emisión, lo que ocurra primero.
- id: 93
  category: vehicle_information
  question: ¿Cuál es la tarifa para obtener un cartel de estacionamiento permanente
    en Indiana?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: No hay tarifa para un cartel de estacionamiento permanente.
  answer: D
  explanation: 'El manual establece explícitamente: ''No hay tarifa para un cartel
    de estacionamiento permanente''.'
- id: 94
  category: safe_driving_rules
  question: ¿Está permitido estacionar en el espacio con rayas diagonales junto a
    un espacio de estacionamiento reservado si tiene un cartel de estacionamiento
    válido?
  choices:
    A: Sí, pero solo para subir y bajar pasajeros.
    B: Sí, si el espacio reservado principal ya está ocupado.
    C: No, estacionar en el espacio con rayas diagonales está prohibido en todo momento.
    D: No, a menos que conduzca una camioneta accesible para sillas de ruedas.
  answer: C
  explanation: 'El manual establece: ''Estacionar en el espacio con rayas diagonales
    junto a un espacio de estacionamiento reservado está prohibido en todo momento,
    incluso con un cartel válido''.'
- id: 95
  category: license_system
  question: ¿Cuándo vence una licencia de conducir probatoria de Indiana?
  choices:
    A: A la medianoche del cumpleaños número 21 del conductor.
    B: Cuando el titular de la tarjeta tiene 21 años y 30 días de edad.
    C: Cuatro años a partir de la fecha de emisión.
    D: A la medianoche del cumpleaños número 18 del conductor.
  answer: B
  explanation: Según el manual, una licencia de conducir probatoria vence cuando el
    titular de la tarjeta tiene 21 años y 30 días de edad.
- id: 96
  category: license_system
  question: Si su cumpleaños cae en un día en que las sucursales de la BMV están cerradas,
    ¿cuándo vence su credencial?
  choices:
    A: A la medianoche del día anterior a su cumpleaños.
    B: A la medianoche de su cumpleaños, independientemente del horario de la BMV.
    C: A la medianoche del siguiente día hábil.
    D: Siete días después de su cumpleaños.
  answer: C
  explanation: 'El manual señala: ''Si su cumpleaños cae en un día en que las sucursales
    de la BMV están cerradas, su credencial vence a la medianoche del siguiente día
    hábil''.'
- id: 97
  category: penalties_and_points
  question: ¿Puede recibir puntos en su historial de manejo por infracciones cometidas
    mientras opera una embarcación?
  choices:
    A: No, las infracciones de embarcaciones se manejan por separado de los historiales
      de manejo.
    B: Sí, si opera su embarcación de manera imprudente, en estado de ebriedad o infringe
      las leyes de embarcaciones privadas.
    C: Sí, pero solo si opera una embarcación con más de 50 caballos de fuerza.
    D: No, a menos que la embarcación esté involucrada en una colisión con un vehículo
      motorizado.
  answer: B
  explanation: El manual establece que si opera su embarcación de manera imprudente,
    en estado de ebriedad o infringe las leyes de embarcaciones privadas, se le pueden
    asignar puntos en su historial de manejo.
- id: 98
  category: license_system
  question: ¿Con cuánta anticipación puede renovar su licencia de conducir con un
    endoso de transporte de pasajeros (for-hire) antes de que venza?
  choices:
    A: Hasta 30 días antes de que venza.
    B: Hasta 90 días antes de que venza.
    C: Hasta seis meses antes de que venza.
    D: Hasta un año antes de que venza.
  answer: D
  explanation: Puede renovar su licencia de conducir con un endoso de transporte de
    pasajeros (for-hire) en cualquier sucursal de la BMV de Indiana o en línea hasta
    un año antes de que venza la licencia.
- id: 99
  category: license_system
  question: ¿A qué hora suele vencer una licencia de conducir de Indiana en su cumpleaños?
  choices:
    A: Al mediodía
    B: A las 5:00 PM
    C: A la medianoche
    D: A las 11:59 AM
  answer: C
  explanation: Según el manual, todas las demás credenciales vencen a la medianoche
    de su cumpleaños. Si la sucursal está cerrada, vencen a la medianoche del siguiente
    día hábil.
- id: 100
  category: driver_testing
  question: ¿Qué debe hacer para renovar una licencia de conducir que ha estado vencida
    por tres años?
  choices:
    A: Pagar una multa y aprobar un examen de la vista solamente
    B: Pagar una multa, aprobar un examen de conocimientos y aprobar un examen de
      la vista
    C: Aprobar un examen de habilidades de manejo y un examen de la vista
    D: Pagar una multa, aprobar un examen de conocimientos, un examen de habilidades
      de manejo y un examen de la vista
  answer: B
  explanation: Si está renovando una licencia de conducir que ha estado vencida por
    al menos 180 días pero no más de cinco años, debe pagar una multa administrativa,
    aprobar un examen de conocimientos y aprobar un examen de la vista estándar.
- id: 101
  category: license_system
  question: ¿Con cuánta anticipación puede un ciudadano estadounidense o una persona
    con estatus legal permanente renovar su licencia de conducir?
  choices:
    A: Hasta 30 días antes de su vencimiento
    B: Hasta 6 meses antes de su vencimiento
    C: Hasta 12 meses antes de su vencimiento
    D: Hasta 24 meses antes de su vencimiento
  answer: D
  explanation: Una licencia de conducir o tarjeta de identificación puede ser renovada
    por ciudadanos estadounidenses o personas con estatus legal permanente hasta 24
    meses antes del vencimiento de la credencial.
- id: 102
  category: driver_testing
  question: Si tiene al menos 21 años de edad y tiene seis o más puntos activos en
    su historial de manejo, ¿qué se requiere para renovar su licencia de conducir?
  choices:
    A: Debe tomar un examen de habilidades de manejo
    B: Debe tomar el examen de conocimientos
    C: Debe completar un Programa de Seguridad para Conductores
    D: Debe pagar el doble de la tarifa de renovación
  answer: B
  explanation: Si tiene al menos 21 años de edad y tiene seis o más puntos activos
    en su historial de manejo, debe tomar el examen de conocimientos para renovar
    su licencia de conducir.
- id: 103
  category: license_system
  question: Si vive temporalmente fuera de Indiana sirviendo en las Fuerzas Armadas
    de los EE. UU., ¿por cuánto tiempo sigue siendo válida su licencia de conducir
    después de su baja?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Su licencia de conducir sigue siendo válida durante 90 días después
    de su baja del servicio, después de su despliegue o después de que ya no resida
    temporalmente fuera de Indiana debido al servicio.
- id: 104
  category: driver_responsibility
  question: ¿Dentro de cuántos días debe notificar a la BMV y solicitar una credencial
    modificada después de cambiar su dirección principal?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Si tiene una credencial de Indiana, debe notificar a la BMV sobre un
    cambio en su dirección principal (legal) y solicitar una credencial modificada
    dentro de los 30 días posteriores al cambio de dirección.
- id: 105
  category: license_system
  question: ¿Qué debe hacer antes de visitar una sucursal de la BMV para cambiar oficialmente
    su nombre en su licencia de conducir?
  choices:
    A: Cambiar su nombre en el registro de su vehículo en línea
    B: Visitar una oficina de la Administración del Seguro Social y esperar al menos
      un día hábil
    C: Actualizar su dirección postal en un quiosco BMV Connect
    D: Completar un Programa de Seguridad para Conductores
  answer: B
  explanation: Debe visitar una oficina de la Administración del Seguro Social para
    cambiar oficialmente su nombre en la documentación del Seguro Social y dejar pasar
    al menos un día hábil después de que se complete su transacción de cambio de nombre
    antes de visitar una sucursal de la BMV.
- id: 106
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su historial de manejo por conducir a exceso
    de velocidad de 16 a 25 millas por hora por encima del límite de velocidad?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Según la tabla de valores de puntos, conducir a exceso de velocidad
    de 16 a 25 millas por hora por encima del límite de velocidad resulta en 4 puntos.
- id: 107
  category: penalties_and_points
  question: ¿Por cuánto tiempo permanecen activos los puntos en su historial de manejo
    de Indiana?
  choices:
    A: Un año a partir de la fecha de condena
    B: Dos años a partir de la fecha de condena
    C: Tres años a partir de la fecha de condena
    D: Cinco años a partir de la fecha de condena
  answer: B
  explanation: Los puntos permanecen activos en su historial de manejo durante dos
    años a partir de la fecha de condena.
- id: 108
  category: defensive_driving
  question: ¿Cuántos créditos de puntos puede recibir un conductor de Indiana por
    completar un Programa de Seguridad para Conductores (DSP) aprobado por la BMV?
  choices:
    A: Un crédito de dos puntos
    B: Un crédito de tres puntos
    C: Un crédito de cuatro puntos
    D: Un crédito de seis puntos
  answer: C
  explanation: Cualquier conductor de Indiana puede completar un curso DSP de un proveedor
    aprobado por la BMV y recibir un crédito de cuatro puntos.
- id: 109
  category: penalties_and_points
  question: La BMV puede exigir a los conductores de 21 años de edad o más que completen
    un Programa de Seguridad para Conductores (DSP) si son condenados por ¿cuántas
    infracciones de tránsito dentro de un período de 12 meses?
  choices:
    A: Dos o más
    B: Tres o más
    C: Cuatro o más
    D: Cinco o más
  answer: A
  explanation: La BMV puede exigir a los conductores de 21 años de edad o más que
    sean condenados por dos o más infracciones de tránsito dentro de un período de
    12 meses que completen un curso DSP aprobado por la BMV.
- id: 110
  category: driver_responsibility
  question: ¿Cuál es el estándar mínimo de seguro del estado para daños a la propiedad
    en cualquier accidente en Indiana?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: El estándar mínimo de seguro del estado incluye $25,000 para daños
    a la propiedad en cualquier accidente, comúnmente conocido como parte del seguro
    de responsabilidad civil 25/50/25.
- id: 111
  category: driver_responsibility
  question: Si la BMV solicita prueba de responsabilidad financiera, ¿dentro de cuántos
    días debe recibirse electrónicamente el Certificado de Cumplimiento (COC) de su
    aseguradora?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: D
  explanation: El COC debe recibirse electrónicamente de su aseguradora y ser procesado
    por la BMV dentro de los 90 días posteriores al envío por correo de la solicitud
    de la BMV para verificar la responsabilidad financiera.
- id: 112
  category: penalties_and_points
  question: ¿Cuántos puntos se imponen por conducir con la licencia suspendida o por
    participar en una competencia de velocidad en la vía pública?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 10 puntos
  answer: C
  explanation: El manual enumera tanto 'Conducir con la licencia suspendida' como
    'Competencia de velocidad en la vía pública' como infracciones que resultan en
    8 puntos.
- id: 113
  category: license_system
  question: ¿Cuál es el número máximo de veces que puede reemplazar su credencial
    en línea antes de que se le exija visitar una sucursal de la BMV?
  choices:
    A: 3 veces
    B: 5 veces
    C: 10 veces
    D: 15 veces
  answer: C
  explanation: Puede reemplazar su credencial en línea un máximo de 10 veces antes
    de que se le exija visitar una sucursal de la BMV para un reemplazo.
- id: 114
  category: driver_responsibility
  question: ¿Cuál es la protección mínima de responsabilidad civil para vehículos
    motorizados del estado en Indiana?
  choices:
    A: 20/40/20
    B: 25/50/25
    C: 50/100/50
    D: 10/25/10
  answer: B
  explanation: El manual establece que la protección mínima de responsabilidad civil
    para vehículos motorizados del estado es de 25/50/25.
- id: 115
  category: penalties_and_points
  question: ¿Cuántos días tiene para que su aseguradora procese electrónicamente un
    Certificado de Cumplimiento (COC) después de que la BMV envíe por correo una solicitud
    para verificar la responsabilidad financiera?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El COC debe recibirse electrónicamente de su aseguradora y ser procesado
    por la BMV dentro de los 90 días posteriores al envío por correo de la solicitud
    de la BMV para verificar la responsabilidad financiera.
- id: 116
  category: driver_responsibility
  question: ¿Cuál es el propósito de un formulario SR22?
  choices:
    A: Reportar un accidente de tránsito a la BMV
    B: Demostrar prueba de responsabilidad financiera futura
    C: Cancelar una póliza de seguro existente
    D: Registrar un vehículo propiedad de una empresa
  answer: B
  explanation: La ley de Indiana exige que su proveedor de seguros presente electrónicamente
    una prueba de responsabilidad financiera futura con un formulario SR22 para que
    se le restablezcan sus privilegios de conducir.
- id: 117
  category: penalties_and_points
  question: ¿Qué sucede si la BMV recibe un aviso SR26 de su proveedor de seguros
    mientras usted tiene un requisito de SR22?
  choices:
    A: Sus privilegios de conducir serán suspendidos hasta que se reciba un SR22 vigente
      o el período expire.
    B: Sus primas de seguro se reducirán.
    C: Se le exigirá que vuelva a tomar el examen de habilidades de manejo.
    D: El registro de su vehículo será revocado permanentemente.
  answer: A
  explanation: Si la BMV recibe un aviso SR26 (cancelación del seguro SR22), la ley
    de Indiana exige que la BMV suspenda sus privilegios de conducir hasta que reciba
    una póliza SR22 vigente, o hasta que expire el período del requisito del SR22.
- id: 118
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento por una primera suspensión por
    falta de seguro que ocurrió después del 1 de enero de 2015?
  choices:
    A: $150
    B: $225
    C: $250
    D: $500
  answer: C
  explanation: Las tarifas de restablecimiento son de $250 por una primera suspensión
    por falta de seguro que ocurrió después del 1 de enero de 2015.
- id: 119
  category: penalties_and_points
  question: ¿Cómo puede un conductor restablecer sus privilegios de conducir sin pagar
    una tarifa de restablecimiento por falta de seguro?
  choices:
    A: Completando un curso de manejo defensivo
    B: Presentando prueba de responsabilidad financiera futura (SR22) y manteniéndola
      continuamente durante 180 días
    C: Pagando la multa de tránsito original en su totalidad
    D: Escribiendo una carta de apelación a la BMV
  answer: B
  explanation: Un conductor puede restablecer sus privilegios de conducir sin tener
    que pagar una tarifa de restablecimiento por falta de seguro haciendo que su proveedor
    de seguros presente electrónicamente una prueba de responsabilidad financiera
    futura (formulario SR22) y mantenga el SR22 continuamente durante 180 días.
- id: 120
  category: alcohol_drugs_health
  question: Operar un vehículo se considera un delito penal si su concentración de
    alcohol en la sangre (BAC) excede ¿qué límite legal?
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: Operar un vehículo en estado de ebriedad o con una concentración de
    alcohol en la sangre (BAC) que exceda el límite legal (.08) es un delito penal.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes se enumera como un factor principal para determinar
    la concentración de alcohol en la sangre (BAC) de un individuo?
  choices:
    A: La estatura del individuo
    B: El tipo de alcohol consumido
    C: El peso corporal del individuo
    D: La cantidad de comida ingerida antes de beber
  answer: C
  explanation: Los factores principales para determinar el BAC de un individuo son
    la cantidad de alcohol consumida, la rapidez con la que se consume el alcohol
    y el peso corporal del individuo.
- id: 122
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor que no pasa una prueba química de
    alcohol?
  choices:
    A: Una suspensión de 90 días de los privilegios de conducir
    B: Una suspensión de 180 días de los privilegios de conducir
    C: Una suspensión de un año de los privilegios de conducir
    D: Una suspensión de dos años de los privilegios de conducir
  answer: B
  explanation: Un conductor que no pase una prueba química enfrentará una suspensión
    de sus privilegios de conducir por 180 días.
- id: 123
  category: penalties_and_points
  question: Si un conductor se niega a someterse a una prueba química, ¿por cuánto
    tiempo se suspenderán sus privilegios de conducir?
  choices:
    A: 180 días
    B: Un año
    C: Dos años
    D: Tres años
  answer: B
  explanation: Un conductor que se niegue a someterse a una prueba química enfrentará
    una suspensión de sus privilegios de conducir por un año.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es la función de un dispositivo de bloqueo de encendido (ignition
    interlock device)?
  choices:
    A: Rastrea la velocidad y ubicación del vehículo para las autoridades.
    B: Prueba mecánicamente el nivel de alcohol en la sangre del conductor antes de
      que se pueda arrancar el automóvil.
    C: Contacta automáticamente a los servicios de emergencia en caso de un choque.
    D: Evita que el vehículo exceda el límite de velocidad publicado.
  answer: B
  explanation: El tribunal también puede exigir la instalación de un dispositivo de
    bloqueo de encendido, el cual prueba mecánicamente el nivel de alcohol en la sangre
    del conductor antes de que pueda arrancar su automóvil.
- id: 125
  category: alcohol_drugs_health
  question: ¿Cómo afecta a su historial de manejo una condena por operar una embarcación
    en estado de ebriedad?
  choices:
    A: No tiene ningún efecto en su historial de manejo de vehículos motorizados.
    B: Resulta en una carta de advertencia pero no en una suspensión.
    C: Se envía a la BMV y pasa a formar parte de su historial de conductor.
    D: Solo afecta su licencia de navegación, no su licencia de conducir.
  answer: C
  explanation: Una condena por operar una embarcación en estado de ebriedad se envía
    a la BMV y la condena pasa a formar parte de su historial de conductor.
- id: 126
  category: penalties_and_points
  question: ¿Qué medida puede tomar la BMV si un tribunal determina que un padre es
    moroso en el pago de la manutención infantil?
  choices:
    A: Suspender inmediatamente los privilegios de conducir del padre moroso.
    B: Confiscar el vehículo del padre.
    C: Duplicar las tarifas de registro del vehículo del padre.
    D: Exigir al padre que vuelva a tomar la prueba de habilidades de manejo.
  answer: A
  explanation: Un tribunal que haya determinado que un padre es moroso en el pago
    de la manutención infantil puede ordenar a la BMV que suspenda inmediatamente
    los privilegios de conducir del padre moroso.
- id: 127
  category: penalties_and_points
  question: ¿Qué sucederá si envía un pago a la BMV por servicios o tarifas y el pago
    no es aceptado (por ejemplo, un cheque sin fondos)?
  choices:
    A: Recibirá una carta de advertencia dándole 30 días para pagar.
    B: Sus privilegios de conducir serán suspendidos indefinidamente.
    C: Se le exigirá realizar servicio comunitario.
    D: Su vehículo será incautado.
  answer: B
  explanation: La BMV suspenderá indefinidamente sus privilegios de conducir si envía
    un pago a la BMV por cualquier servicio o tarifa y dicho pago no es aceptado.
- id: 128
  category: driver_responsibility
  question: ¿Cuánto cuesta ver su historial de conductor en línea en IN.gov/BMV?
  choices:
    A: $5.00 por vista
    B: $10.00 anualmente
    C: No tiene costo.
    D: $15.00 por una copia certificada
  answer: C
  explanation: Su primer recurso debe ser verificar su historial de conductor, el
    cual puede ver en cualquier momento sin costo en IN.gov/BMV.
- id: 129
  category: license_system
  question: ¿Cuál es el costo de comprar un Historial de Conductor Oficial (Official
    Driver Record) en Indiana?
  choices:
    A: Gratis
    B: $4
    C: $10
    D: $15
  answer: B
  explanation: Según el manual, un Historial de Conductor Oficial se puede comprar
    por $4.
- id: 130
  category: penalties_and_points
  question: ¿Cuánto tiempo le toma típicamente a la BMV procesar la información de
    restablecimiento una vez que se recibe de un tribunal?
  choices:
    A: Hasta 48 horas
    B: Hasta 5 días hábiles
    C: Hasta 10 días hábiles
    D: Hasta 30 días
  answer: C
  explanation: El procesamiento por parte de la BMV puede tomar hasta 10 días hábiles
    una vez que se recibe la información de restablecimiento del tribunal.
- id: 131
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es cierta con respecto al Historial
    de Manejo Visible (Viewable Driver Record)?
  choices:
    A: Cuesta $4 para verlo.
    B: Puede usarse como un registro oficial para los empleadores.
    C: No se puede imprimir y no debe usarse como un registro oficial.
    D: Solo está disponible en un quiosco BMV Connect.
  answer: C
  explanation: El Historial de Manejo Visible (Viewable Driver Record) no se puede
    imprimir y no debe usarse como un registro oficial de su historial de manejo.
- id: 132
  category: penalties_and_points
  question: Según la Sección A de las leyes de Infractor de Tránsito Habitual (HTV),
    ¿por cuánto tiempo se suspenderán los privilegios de un conductor si acumula dos
    sentencias en un período de 10 años por operar un vehículo motorizado en estado
    de ebriedad que resulte en muerte?
  choices:
    A: 5 años
    B: 10 años
    C: 15 años
    D: De por vida
  answer: D
  explanation: Los conductores que acumulen dos sentencias en un período de 10 años
    por operar un vehículo motorizado en estado de ebriedad que resulte en muerte
    tendrán sus privilegios de manejo suspendidos de por vida.
- id: 133
  category: penalties_and_points
  question: Un conductor que acumule tres infracciones mayores, como manejo imprudente
    o carreras de resistencia (drag racing), en un período de 10 años, ¿enfrentará
    una suspensión de sus privilegios de manejo de qué duración?
  choices:
    A: 3 años
    B: 5 años
    C: 10 años
    D: De por vida
  answer: C
  explanation: Según la Sección B, los conductores que acumulen tres infracciones
    mayores de la lista provista en un período de 10 años tendrán sus privilegios
    de manejo suspendidos por 10 años.
- id: 134
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor que acumula 10 o más infracciones
    de tránsito en un período de 10 años, incluyendo al menos una infracción mayor?
  choices:
    A: Una suspensión de 1 año
    B: Una suspensión de 5 años
    C: Una suspensión de 10 años
    D: Una suspensión de por vida
  answer: B
  explanation: Según la Sección C, un Infractor de Tránsito Habitual (HTV) está sujeto
    a una suspensión de privilegios de manejo de cinco años por acumular 10 o más
    infracciones de tránsito en un período de 10 años, de las cuales una es una infracción
    mayor.
- id: 135
  category: license_system
  question: ¿Qué indica una 'Restricción 5' (Restriction 5) en una licencia de conducir
    de Indiana?
  choices:
    A: El conductor debe usar lentes correctivos.
    B: El conductor está restringido a manejar solo durante el día.
    C: Al conductor se le han otorgado privilegios de manejo por dificultades, probatorios,
      condicionales o especializados.
    D: El conductor debe operar un vehículo con un dispositivo de bloqueo de encendido
      (ignition interlock device).
  answer: C
  explanation: Una 'Restricción 5' se coloca en la licencia de conducir de una persona
    a la que se le han otorgado privilegios de manejo por dificultades, probatorios,
    condicionales o especializados por orden judicial.
- id: 136
  category: penalties_and_points
  question: ¿Cuál de los siguientes es un requisito para una persona a la que un tribunal
    le ha otorgado privilegios de manejo especializados?
  choices:
    A: Mantener un formulario SR22 vigente archivado en la BMV.
    B: Completar un curso de manejo defensivo cada 6 meses.
    C: Conducir únicamente un vehículo con transmisión manual.
    D: Entregar su credencial válidamente emitida a la BMV.
  answer: A
  explanation: Una persona a la que se le otorgan privilegios de manejo especializados
    debe mantener un formulario SR22 vigente archivado en la BMV durante la duración
    de los privilegios de manejo especializados.
- id: 137
  category: signs_and_signals
  question: ¿Qué tipo de información indican las señales de tránsito de color marrón?
  choices:
    A: Condiciones temporales de tránsito
    B: Servicios y comodidades en la carretera
    C: Sitios cercanos de interés recreativo y cultural
    D: Movimientos y direcciones permitidos
  answer: C
  explanation: Las señales de tránsito de color marrón indican sitios cercanos de
    interés recreativo y cultural, como un parque estatal.
- id: 138
  category: signs_and_signals
  question: Una señal de tránsito que muestra información sobre las comodidades en
    una próxima salida, por lo general, ¿qué color de fondo tendrá?
  choices:
    A: Verde
    B: Azul
    C: Blanco
    D: Naranja
  answer: B
  explanation: Las señales de tránsito azules muestran servicios e información de
    la carretera, como las comodidades en una próxima salida.
- id: 139
  category: signs_and_signals
  question: ¿Qué color se utiliza para las señales de tránsito que advierten a los
    conductores sobre condiciones temporales de tránsito, como la construcción de
    carreteras?
  choices:
    A: Amarillo
    B: Rojo
    C: Naranja
    D: Marrón
  answer: C
  explanation: Las señales de tránsito de color naranja advierten a los conductores
    sobre condiciones temporales de tránsito, a menudo debido a proyectos de construcción
    y mantenimiento de carreteras.
- id: 140
  category: signs_and_signals
  question: ¿Qué muestran típicamente las señales de tránsito blancas?
  choices:
    A: Regulaciones de tránsito, como los límites de velocidad
    B: Advertencias de peligros específicos en la carretera
    C: Direcciones a hospitales cercanos
    D: Sitios de interés recreativo y cultural
  answer: A
  explanation: Las señales de tránsito blancas muestran regulaciones de tránsito,
    como los límites de velocidad, que los conductores deben obedecer, así como información
    útil como los marcadores de carreteras estatales.
- id: 141
  category: signs_and_signals
  question: Una señal de "Resbaladizo cuando está mojado" (Slippery When Wet) es un
    ejemplo de una señal que prepara a los conductores para condiciones específicas
    de la carretera. ¿De qué color es su fondo?
  choices:
    A: Rojo
    B: Naranja
    C: Amarillo
    D: Verde
  answer: C
  explanation: Las señales amarillas o amarillo-verde fluorescentes preparan a los
    conductores para condiciones específicas de la carretera y peligros más adelante.
    Una señal de "Resbaladizo cuando está mojado" es un ejemplo de una señal de tráfico
    con fondo amarillo.
- id: 142
  category: signs_and_signals
  question: ¿Qué indican las señales de tráfico rojas a los conductores?
  choices:
    A: Movimientos permitidos y orientación
    B: Regulaciones de tráfico que requieren acción inmediata para evitar amenazas
      a la seguridad
    C: Zonas escolares cercanas y cruces peatonales
    D: Condiciones temporales de tráfico debido a construcción
  answer: B
  explanation: Las señales de tráfico rojas indican regulaciones de tráfico que requieren
    que los conductores tomen medidas inmediatas para evitar amenazas a la seguridad
    del tráfico, como una señal de "Sentido contrario" (Wrong Way).
- id: 143
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones se considera una infracción mayor
    bajo la Sección A de las leyes de Infractor de Tráfico Habitual, lo que podría
    llevar a una suspensión de 10 años si se acumulan dos sentencias?
  choices:
    A: Nueve multas por exceso de velocidad en un período de 10 años
    B: Homicidio imprudente resultante de la operación de un vehículo motorizado
    C: Conducir con una licencia suspendida
    D: No usar la luz direccional
  answer: B
  explanation: El homicidio imprudente resultante de la operación de un vehículo motorizado
    está catalogado en la Sección A como una infracción mayor que resulta en lesiones
    o muerte.
- id: 144
  category: signs_and_signals
  question: ¿De qué advierten a los conductores las señales de tráfico amarillo-verde
    fluorescentes?
  choices:
    A: Zonas de construcción en la carretera
    B: Escuelas cercanas, peatones y bicicletas
    C: Próximos cruces de ferrocarril
    D: Regulaciones de tráfico que requieren acción inmediata
  answer: B
  explanation: Las señales amarillo-verde fluorescentes advierten a los conductores
    sobre escuelas cercanas, peatones, bicicletas, parques infantiles y rutas de autobuses
    escolares.
- id: 145
  category: signs_and_signals
  question: ¿Dónde se colocan las señales de tráfico en forma de banderín y qué indican?
  choices:
    A: En el lado derecho de la carretera para indicar una zona escolar
    B: En el lado izquierdo de las carreteras de doble sentido para advertir que no
      se debe rebasar por la izquierda
    C: En las intersecciones para indicar una parada obligatoria
    D: Antes de los cruces de ferrocarril para advertir sobre la aproximación de trenes
  answer: B
  explanation: Las señales de tráfico en forma de banderín se colocan en el lado izquierdo
    de las carreteras de doble sentido para advertir a los conductores que no rebasen
    a otros vehículos por la izquierda.
- id: 146
  category: signs_and_signals
  question: ¿A qué tipo de peligro o condición alerta a los conductores una señal
    de tráfico circular?
  choices:
    A: Próximos cruces de ferrocarril
    B: Condiciones de carretera resbaladiza
    C: Curvas cerradas más adelante
    D: Zonas de construcción en la carretera
  answer: A
  explanation: Las señales de tráfico circulares alertan a los conductores sobre próximos
    cruces de ferrocarril.
- id: 147
  category: signs_and_signals
  question: 'Una señal de tráfico de cinco lados indica que usted se aproxima a:'
  choices:
    A: Una intersección con parada (alto)
    B: Una intersección de ceder el paso
    C: Un área cerca de una escuela donde los niños pueden estar cruzando
    D: Una zona de no rebasar
  answer: C
  explanation: Las señales de tráfico de cinco lados advierten a los conductores que
    están ingresando a un área cerca de una escuela en la cual los niños pueden estar
    cruzando la calle.
- id: 148
  category: vehicle_information
  question: Un emblema de vehículo de movimiento lento indica que el vehículo no puede
    exceder ¿qué velocidad?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 30 millas por hora
  answer: C
  explanation: Un emblema de vehículo de movimiento lento tiene un centro naranja
    fluorescente y bordes reflectantes rojos, e indica un vehículo de movimiento lento
    que no puede exceder las 25 millas por hora.
- id: 149
  category: signs_and_signals
  question: ¿De qué colores está compuesto un emblema de vehículo de movimiento lento?
  choices:
    A: Un fondo amarillo con bordes negros
    B: Un centro naranja fluorescente y bordes reflectantes rojos
    C: Un centro rojo con bordes reflectantes blancos
    D: Un centro amarillo-verde fluorescente con bordes negros
  answer: B
  explanation: Un emblema de vehículo de movimiento lento tiene un centro naranja
    fluorescente y bordes reflectantes rojos.
- id: 150
  category: signs_and_signals
  question: ¿Qué indican generalmente las señales de tráfico naranjas?
  choices:
    A: Servicios para conductores y áreas de recreación
    B: Zonas de construcción y mantenimiento en la carretera
    C: Zonas escolares y cruces peatonales
    D: Regulaciones de tráfico que deben obedecerse de inmediato
  answer: B
  explanation: Las señales de tráfico naranjas de construcción en la carretera advierten
    a los conductores que tengan cuidado al acercarse a zonas de construcción.
- id: 151
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca a una intersección y se encuentra con una
    luz amarilla fija, pero está demasiado cerca para detenerse de manera segura?
  choices:
    A: Frenar bruscamente y detenerse en la intersección
    B: Acelerar para ganarle a la luz roja
    C: Puede completar su movimiento a través de la intersección
    D: Orillarse al lado derecho de la carretera inmediatamente
  answer: C
  explanation: Si se encuentra con una luz amarilla fija, su derecho de paso está
    terminando. Si se acerca a la intersección y está demasiado cerca para detenerse
    de manera segura, puede completar su movimiento.
- id: 152
  category: safe_driving_rules
  question: Al girar a la izquierda en una intersección con una luz verde sin flecha,
    ¿cuántos vehículos pueden ingresar a la intersección a la vez para girar?
  choices:
    A: Tantos como quepan
    B: Solo un vehículo a la vez
    C: Dos vehículos a la vez
    D: Ningún vehículo puede ingresar hasta que la luz cambie a roja
  answer: B
  explanation: Si se encuentra con una luz verde sin flecha, puede girar a través
    de una intersección siempre que esté despejada... Solo un vehículo a la vez puede
    ingresar a una intersección para girar a la izquierda.
- id: 153
  category: safe_driving_rules
  question: ¿Qué significa una flecha amarilla intermitente para un movimiento de
    giro?
  choices:
    A: Usted tiene el derecho de paso y el tráfico en sentido contrario debe ceder
      el paso
    B: Puede proceder con el giro solo después de ceder el paso a los peatones y al
      tráfico en sentido contrario
    C: Debe detenerse por completo y esperar una flecha verde
    D: La intersección está cerrada para el tráfico que gira
  answer: B
  explanation: Una flecha amarilla intermitente para un movimiento de giro significa
    que puede proceder con el giro solo después de haber cedido el derecho de paso
    a los peatones y al tráfico en sentido contrario.
- id: 154
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite girar a la izquierda en una intersección
    con una luz roja fija?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido
    B: Al girar desde una calle de un solo sentido hacia una calle de doble sentido
    C: Al girar desde una calle de un solo sentido hacia una calle de un solo sentido
    D: Nunca se le permite girar a la izquierda con luz roja
  answer: C
  explanation: Puede girar a la izquierda en una intersección con una luz roja o flecha
    roja si está girando desde una calle de un solo sentido hacia una calle de un
    solo sentido.
- id: 155
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un requisito antes de hacer un giro permitido
    a la derecha con luz roja?
  choices:
    A: Reducir la velocidad a 5 mph antes de girar
    B: Detenerse por completo y verificar si hay vehículos y peatones
    C: Tocar la bocina para advertir al tráfico transversal
    D: Encender las luces de emergencia
  answer: B
  explanation: Para girar a la derecha en una intersección con una luz roja o flecha
    roja, cuando esté permitido, debe detenerse por completo, verificar para asegurarse
    de que no haya vehículos ni peatones en la trayectoria de su giro o a punto de
    ingresar a la trayectoria de su giro...
- id: 156
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a una intersección con una luz amarilla intermitente
    sin flecha?
  choices:
    A: Detenerse por completo y esperar una luz verde
    B: Tratar la intersección como una parada de cuatro vías
    C: Reducir la velocidad y tener precaución al transitar por la intersección
    D: Acelerar para despejar la intersección rápidamente
  answer: C
  explanation: Una luz amarilla intermitente sin flecha en una intersección significa
    que debe reducir la velocidad y tener precaución al transitar por la intersección.
- id: 157
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico en forma de triángulo equilátero?
  choices:
    A: Advierte a los conductores que reduzcan la velocidad y estén preparados para
      detenerse por completo para ceder el paso
    B: Indica que hay una zona escolar más adelante
    C: Alerta a los conductores sobre un próximo cruce de ferrocarril
    D: Marca el comienzo de una zona de no adelantar
  answer: A
  explanation: Las señales de tráfico con tres lados de igual longitud advierten a
    los conductores que reduzcan la velocidad al acercarse a una intersección, y que
    estén preparados para detenerse por completo a fin de ceder el paso a otros conductores
    o peatones.
- id: 158
  category: signs_and_signals
  question: ¿Cuál es el propósito de una placa suplementaria agregada en la parte
    inferior de una señal de alto (stop)?
  choices:
    A: Indicar el límite de velocidad de la calle transversal
    B: Indicar las direcciones en las que la intersección debe detenerse
    C: Advertir sobre una zona escolar cercana
    D: Proporcionar la distancia hasta el próximo pueblo
  answer: B
  explanation: A veces se agregan placas suplementarias en la parte inferior de las
    señales de alto para indicar las direcciones en las que la intersección debe detenerse.
- id: 159
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla intermitente sin flecha en una intersección?
  choices:
    A: Deténgase y espere una luz verde.
    B: Reduzca la velocidad y tenga precaución al transitar por la intersección.
    C: Usted tiene el derecho de paso y no necesita reducir la velocidad.
    D: El semáforo está descompuesto y debe tratarse como una parada de cuatro vías.
  answer: B
  explanation: Según el manual, una luz amarilla intermitente sin flecha significa
    que debe reducir la velocidad y tener precaución al transitar por una intersección.
- id: 160
  category: signs_and_signals
  question: Si usted y otro conductor llegan al mismo tiempo a una luz roja intermitente
    en una intersección donde todo el tráfico debe detenerse, ¿quién debe ceder el
    derecho de paso?
  choices:
    A: El vehículo a la derecha.
    B: El vehículo a la izquierda.
    C: El vehículo que viaja más rápido.
    D: El vehículo que gira a la derecha.
  answer: B
  explanation: El manual establece que si llega al mismo tiempo que otro conductor
    a una intersección donde todo el tráfico debe detenerse, el vehículo a la izquierda
    debe ceder el derecho de paso.
- id: 161
  category: vehicle_information
  question: ¿Bajo qué condición puede una persona que conduce una motocicleta avanzar
    en un semáforo en rojo fijo que no cambia a verde?
  choices:
    A: Después de detenerse por completo durante al menos dos minutos y actuar con
      la debida precaución.
    B: Después de tocar la bocina y esperar 30 segundos.
    C: Solo si hay un oficial de policía presente para dirigir el tráfico.
    D: A las motocicletas nunca se les permite avanzar con un semáforo en rojo fijo.
  answer: A
  explanation: Los conductores de motocicletas y ciclos motorizados que se acercan
    a una intersección controlada por un semáforo pueden avanzar con una luz roja
    fija si el conductor se detiene por completo durante al menos dos minutos y actúa
    con la debida precaución.
- id: 162
  category: vehicle_information
  question: ¿La regla que permite a las motocicletas avanzar en un semáforo en rojo
    fijo después de esperar dos minutos se aplica a los autociclos (autocycles)?
  choices:
    A: Sí, los autociclos siguen todas las reglas de las motocicletas.
    B: Sí, pero deben esperar tres minutos en lugar de dos.
    C: No, esta regla no se aplica a los autociclos.
    D: No, los autociclos deben tratar todos los semáforos en rojo como señales de
      ceda el paso.
  answer: C
  explanation: El manual establece explícitamente que la regla que permite a los conductores
    evitar esperas prolongadas en los semáforos en rojo esperando dos minutos no se
    aplica a los autociclos.
- id: 163
  category: signs_and_signals
  question: ¿Cómo debe proceder al acercarse a una intersección con un semáforo que
    no funciona?
  choices:
    A: Avanzar por la intersección sin detenerse si la vía está despejada.
    B: Detenerse antes de entrar a la intersección y ceder el paso a los vehículos
      que llegaron antes que usted o que están a su derecha.
    C: Tratar la intersección como una señal de ceda el paso y reducir la velocidad.
    D: Esperar hasta que llegue un oficial de tránsito para dirigir el tráfico.
  answer: B
  explanation: Si se acerca a una intersección con un semáforo que no funciona, debe
    detenerse antes de entrar y avanzar con precaución después de ceder el paso al
    tráfico transversal, a los vehículos que se detuvieron antes que usted, a los
    vehículos que llegaron al mismo tiempo a su derecha y a los peatones.
- id: 164
  category: signs_and_signals
  question: ¿Qué muestra un semáforo híbrido para peatones (pedestrian hybrid beacon)
    inmediatamente después de que un peatón lo activa?
  choices:
    A: Una luz roja fija.
    B: Una luz amarilla intermitente.
    C: Una luz amarilla fija.
    D: Dos luces rojas intermitentes.
  answer: B
  explanation: Una vez activado por un peatón, el semáforo híbrido para peatones mostrará
    una luz amarilla intermitente para permitir que los conductores despejen el cruce.
- id: 165
  category: safe_driving_rules
  question: ¿Qué indican las marcas de carril amarillas en una vía?
  choices:
    A: Separan múltiples carriles de tráfico que van en la misma dirección.
    B: Indican un carril para autobuses o de tránsito.
    C: Separan múltiples carriles de tráfico que van en direcciones opuestas.
    D: Indican una zona de cruce peatonal.
  answer: C
  explanation: Según el manual, las marcas de carril amarillas separan múltiples carriles
    de tráfico que van en direcciones opuestas.
- id: 166
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuánta distancia debe dejar antes de regresar
    al lado derecho de la vía frente a un vehículo que se aproxima en sentido contrario?
  choices:
    A: No menos de 50 pies.
    B: No menos de 100 pies.
    C: No menos de 200 pies.
    D: No menos de 500 pies.
  answer: B
  explanation: Al rebasar, debe regresar al lado derecho de la vía a no menos de 100
    pies antes de cualquier vehículo que se aproxime en sentido contrario.
- id: 167
  category: defensive_driving
  question: ¿Qué debe hacer para revisar su punto ciego antes de cambiar de carril?
  choices:
    A: Confiar completamente en su espejo retrovisor.
    B: Girar brevemente la cabeza hacia el carril al que va a entrar.
    C: Tocar la bocina para alertar a los vehículos en su punto ciego.
    D: Parpadear las luces delanteras dos veces.
  answer: B
  explanation: Al cambiar de carril, debe girar brevemente la cabeza hacia el carril
    al que va a entrar para asegurarse de que no haya ningún vehículo en su punto
    ciego.
- id: 168
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es peligroso e ilegal rebasar a
    otro vehículo?
  choices:
    A: Al conducir en una vía con una línea amarilla discontinua.
    B: A menos de 100 pies de una intersección, cruce de ferrocarril, puente, viaducto
      o túnel.
    C: Cuando el vehículo de adelante viaja por debajo del límite de velocidad.
    D: En una autopista de varios carriles con líneas blancas discontinuas.
  answer: B
  explanation: Es peligroso e ilegal intentar rebasar a otros vehículos a menos de
    100 pies de una intersección, cruce de ferrocarril, puente, viaducto o túnel.
- id: 169
  category: sharing_the_road
  question: ¿Qué debe hacer si otro vehículo lo está rebasando por el lado izquierdo
    de la vía?
  choices:
    A: Aumentar su velocidad para evitar que lo rebasen.
    B: Moverse al carril izquierdo para bloquearlos.
    C: Permitir que el otro vehículo lo rebase de manera segura y no aumentar su velocidad.
    D: Tocar la bocina para advertirles del tráfico en sentido contrario.
  answer: C
  explanation: Si otro vehículo lo está rebasando por el lado izquierdo de la vía,
    permita que el otro vehículo lo rebase de manera segura y no aumente su velocidad.
- id: 170
  category: safe_driving_rules
  question: ¿Cuál es la posición correcta en el carril al prepararse para girar a
    la derecha?
  choices:
    A: El carril del extremo izquierdo para su dirección de viaje.
    B: El carril central.
    C: El carril del extremo derecho para su dirección de viaje.
    D: Cualquier carril, siempre y cuando use su luz direccional.
  answer: C
  explanation: Para girar a la derecha, ubíquese en el carril del extremo derecho
    para su dirección de viaje.
- id: 171
  category: signs_and_signals
  question: ¿Qué indica a un ciclista un semáforo para bicicletas que muestra el símbolo
    de una bicicleta en amarillo?
  choices:
    A: El derecho de paso está por terminar.
    B: Proceda con precaución.
    C: Ceda el paso a los peatones.
    D: El carril para bicicletas está por terminar.
  answer: A
  explanation: Al igual que con los semáforos vehiculares, un semáforo amarillo para
    bicicletas significa que el derecho de paso está por terminar.
- id: 172
  category: signs_and_signals
  question: ¿Qué tipo de señal controla un carril para autobuses o de tránsito y solo
    es aplicable a los operadores de autobuses o de tránsito?
  choices:
    A: Una señal que muestra un triángulo amarillo.
    B: Una señal que muestra barras rectangulares blancas.
    C: Una señal que muestra un círculo rojo intermitente.
    D: Una señal que muestra una flecha verde.
  answer: B
  explanation: Una señal que muestra barras rectangulares blancas controla un carril
    para autobuses o de tránsito y solo es aplicable a los operadores de autobuses
    o de tránsito.
- id: 173
  category: safe_driving_rules
  question: ¿Dónde debe detenerse si se acerca a una señal de alto (stop) en una intersección
    que no tiene una línea de alto ni un cruce peatonal?
  choices:
    A: En el borde de la vía que se cruza.
    B: Antes de entrar a la intersección.
    C: Diez pies antes de la señal de alto.
    D: En el medio de la intersección para verificar el tráfico.
  answer: B
  explanation: Si no hay línea de alto ni cruce peatonal, debe detenerse por completo
    antes de entrar a la intersección.
- id: 174
  category: driver_testing
  question: ¿Se permite usar señales con la mano durante un examen práctico de manejo?
  choices:
    A: Sí, pero solo si sus luces direccionales no funcionan correctamente.
    B: Sí, se prefieren las señales con la mano sobre las luces direccionales.
    C: No, no puede usar señales con la mano en un examen práctico de manejo.
    D: Sí, siempre y cuando las use con suficiente anticipación antes de dar la vuelta.
  answer: C
  explanation: Según el manual, no se pueden usar señales con la mano en un examen
    práctico de manejo.
- id: 175
  category: safe_driving_rules
  question: ¿Cuál es el uso correcto de un carril central especialmente designado?
  choices:
    A: Para rebasar a vehículos más lentos.
    B: Solo para dar vueltas a la izquierda.
    C: Solo para dar vueltas a la derecha.
    D: Para estacionarse en caso de emergencia.
  answer: B
  explanation: Las calles concurridas a menudo tienen un carril central designado
    exclusivamente para los vehículos que dan vuelta a la izquierda. Nunca debe usar
    este tipo de carril central para rebasar a otros vehículos.
- id: 176
  category: safe_driving_rules
  question: ¿Dónde está explícitamente prohibido dar una vuelta en U?
  choices:
    A: En una intersección con vuelta en U en el camellón (mediana).
    B: En una carretera del condado.
    C: En una autopista interestatal.
    D: En un área residencial urbana.
  answer: C
  explanation: El manual indica que nunca se debe dar una vuelta en U en una autopista
    interestatal. En su lugar, continúe hasta la siguiente salida y vuelva a entrar
    a la autopista en la dirección opuesta.
- id: 177
  category: safe_driving_rules
  question: Si dos vehículos llegan a una intersección de alto en todas las direcciones
    (all-way stop) al mismo tiempo, ¿qué vehículo debe ceder el derecho de paso?
  choices:
    A: El vehículo de la derecha.
    B: El vehículo de la izquierda.
    C: El vehículo más grande.
    D: El vehículo que viaja más rápido.
  answer: B
  explanation: Si llega a una señal de alto en todas las direcciones al mismo tiempo
    que otro conductor, el vehículo de la izquierda debe ceder el derecho de paso.
- id: 178
  category: safe_driving_rules
  question: ¿En qué dirección avanza el tráfico en una rotonda (glorieta)?
  choices:
    A: En el sentido de las agujas del reloj.
    B: En sentido contrario a las agujas del reloj.
    C: Tanto en el sentido de las agujas del reloj como en sentido contrario.
    D: En línea recta.
  answer: B
  explanation: Una rotonda es una intersección circular en la que el tráfico entra
    o sale solo mediante vueltas a la derecha y avanza en sentido contrario a las
    agujas del reloj.
- id: 179
  category: sharing_the_road
  question: Si dos camiones grandes se acercan o conducen a través de una rotonda
    al mismo tiempo, ¿qué debe suceder?
  choices:
    A: El conductor del carril izquierdo debe ceder el paso al conductor del carril
      derecho.
    B: El conductor del carril derecho debe ceder el paso al conductor del carril
      izquierdo.
    C: Ambos camiones deben detenerse y esperar a un oficial de policía.
    D: El camión que lleva la carga más pesada tiene el derecho de paso.
  answer: B
  explanation: Si dos camiones grandes se acercan o conducen a través de una rotonda
    al mismo tiempo, el conductor del carril derecho debe ceder el derecho de paso
    al conductor del carril izquierdo.
- id: 180
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para vehículos de pasajeros en
    una autopista interestatal rural?
  choices:
    A: 55 millas por hora
    B: 60 millas por hora
    C: 65 millas por hora
    D: 70 millas por hora
  answer: D
  explanation: En las autopistas interestatales rurales, los vehículos de pasajeros
    no pueden exceder las 70 millas por hora o el límite de velocidad publicado.
- id: 181
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máxima en los callejones?
  choices:
    A: 10 millas por hora
    B: 15 millas por hora
    C: 20 millas por hora
    D: 25 millas por hora
  answer: B
  explanation: En los callejones, los vehículos no deben exceder las 15 millas por
    hora o el límite de velocidad indicado.
- id: 182
  category: defensive_driving
  question: ¿Cuál es una buena regla que los conductores deben seguir con respecto
    a la distancia de seguimiento?
  choices:
    A: Mantenerse al menos a un segundo detrás del vehículo de adelante
    B: Mantenerse al menos a dos o tres segundos detrás del vehículo de adelante
    C: Mantenerse al menos a cuatro o cinco segundos detrás del vehículo de adelante
    D: Mantenerse al menos a la distancia de un automóvil detrás del vehículo de adelante
      por cada 10 mph
  answer: B
  explanation: Una buena regla que los conductores deben seguir es mantenerse al menos
    a dos o tres segundos detrás del vehículo de adelante.
- id: 183
  category: safe_driving_rules
  question: ¿Cómo se comparan los límites de velocidad en zonas de obras con el límite
    de velocidad máximo establecido para el área?
  choices:
    A: Son al menos 5 millas por hora inferiores al límite de velocidad máximo establecido.
    B: Son al menos 10 millas por hora inferiores al límite de velocidad máximo establecido.
    C: Son al menos 15 millas por hora inferiores al límite de velocidad máximo establecido.
    D: Son iguales al límite de velocidad máximo establecido.
  answer: B
  explanation: Los límites de velocidad en zonas de obras son siempre al menos 10
    millas por hora inferiores al límite de velocidad máximo establecido para el área.
- id: 184
  category: signs_and_signals
  question: ¿En qué se diferencia un círculo de tráfico (traffic circle) de una rotonda
    (roundabout)?
  choices:
    A: Un círculo de tráfico solo tiene tráfico en sentido contrario a las agujas
      del reloj.
    B: Un círculo de tráfico siempre está controlado por semáforos.
    C: Un círculo de tráfico puede tener tráfico en el sentido de las agujas del reloj
      y en sentido contrario, y puede estar controlado por señales de alto (STOP).
    D: Un círculo de tráfico solo se encuentra en áreas rurales.
  answer: C
  explanation: Un círculo de tráfico se diferencia de una rotonda en que puede tener
    tráfico en el sentido de las agujas del reloj y en sentido contrario, y sus accesos
    pueden estar controlados por señales de alto (STOP) en lugar de señales de ceda
    el paso (YIELD).
- id: 185
  category: defensive_driving
  question: ¿Cuál de los siguientes es un factor que afecta la capacidad de frenado
    de un vehículo?
  choices:
    A: El color del vehículo
    B: El tipo y estado de los neumáticos
    C: La hora del día
    D: El número de pasajeros en el vehículo
  answer: B
  explanation: Muchos factores afectan la capacidad de frenado de un vehículo, incluyendo
    el peso del vehículo, el tipo y estado de los frenos y neumáticos, la condición
    física y lo resbaladizo del pavimento, y la inclinación de la carretera.
- id: 186
  category: sharing_the_road
  question: ¿Cuál es el límite de velocidad máxima para un camión con un peso bruto
    vehicular declarado superior a 26,000 libras en una autopista interestatal rural?
  choices:
    A: 55 millas por hora
    B: 60 millas por hora
    C: 65 millas por hora
    D: 70 millas por hora
  answer: C
  explanation: En las autopistas interestatales rurales, los camiones que tienen un
    peso bruto vehicular declarado superior a 26,000 libras no deben exceder las 65
    millas por hora o el límite de velocidad indicado.
- id: 187
  category: defensive_driving
  question: Si su vehículo comienza a patinar y está equipado con un sistema de frenos
    antibloqueo (ABS), ¿qué debe hacer?
  choices:
    A: Bombear los frenos rápidamente
    B: Mantener el pie en el pedal del freno con una presión firme y continua
    C: Pisar los frenos de golpe y girar el volante bruscamente
    D: Aplicar el freno de estacionamiento inmediatamente
  answer: B
  explanation: Si su vehículo tiene un sistema de frenos antibloqueo (ABS), mantenga
    el pie en el pedal del freno, aplicando una presión firme y continua, mientras
    gira el volante con normalidad. No bombee los frenos.
- id: 188
  category: defensive_driving
  question: ¿Cuál es la técnica de maniobra adecuada si su vehículo se sale de la
    carretera?
  choices:
    A: Volver al pavimento inmediatamente
    B: Pisar los frenos de golpe y girar bruscamente
    C: Soltar el pedal del acelerador y volver a girar gradualmente cuando sea seguro
    D: Acelerar para recuperar la tracción antes de volver a girar
  answer: C
  explanation: Si su vehículo se sale de la carretera, no vuelva al pavimento de inmediato.
    Suelte el pedal del acelerador. Cuando sea seguro hacerlo, vuelva a girar gradualmente
    hacia la carretera.
- id: 189
  category: vehicle_information
  question: ¿Cómo afecta viajar a 75 millas por hora el consumo de combustible en
    comparación con viajar a 55 millas por hora para automóviles de pasajeros y camionetas
    ligeras?
  choices:
    A: Consume aproximadamente un 10 por ciento más de combustible
    B: Consume aproximadamente un 25 por ciento más de combustible
    C: Consume aproximadamente un 50 por ciento más de combustible
    D: Consume aproximadamente un 75 por ciento más de combustible
  answer: C
  explanation: El consumo de combustible aumenta de manera constante por encima de
    las 45 millas por hora; los automóviles de pasajeros y las camionetas ligeras
    consumen aproximadamente un 50 por ciento más de combustible viajando a 75 millas
    por hora que a 55 millas por hora.
- id: 190
  category: vehicle_information
  question: ¿Dónde debe buscar para encontrar la presión de neumáticos recomendada
    (psi) para su vehículo?
  choices:
    A: En la pared lateral del neumático
    B: En una etiqueta dentro del marco de la puerta del conductor o en el manual
      del propietario
    C: En la placa (matrícula) del vehículo
    D: En el bloque del motor
  answer: B
  explanation: Compare los psi medidos con los psi que se encuentran en la etiqueta
    dentro de la puerta del conductor de su vehículo o en el manual del propietario;
    NO los compare con los psi en la pared lateral de su neumático.
- id: 191
  category: vehicle_information
  question: Al usar la prueba de la moneda de un centavo (penny) para revisar el desgaste
    de las llantas, ¿qué indica que la banda de rodadura tiene una profundidad legal
    y segura?
  choices:
    A: La cabeza de Lincoln es completamente visible
    B: Cualquier parte de la cabeza de Lincoln está cubierta por la banda de rodadura
    C: La moneda se cae de la ranura
    D: La banda de rodadura tiene exactamente 1/32 de pulgada de profundidad
  answer: B
  explanation: Si cualquier parte de la cabeza de Lincoln está cubierta por la banda
    de rodadura, usted está conduciendo con la cantidad legal y segura de banda de
    rodadura.
- id: 192
  category: safe_driving_rules
  question: Durante el clima invernal, ¿qué áreas de la carretera tienden a congelarse
    antes que otras secciones?
  choices:
    A: Intersecciones y cruces peatonales
    B: Caminos rurales de tierra
    C: Rampas, puentes y pasos elevados
    D: Autopistas de múltiples carriles
  answer: C
  explanation: Tenga en cuenta que la humedad en rampas, puentes y pasos elevados
    ocasionalmente puede congelarse antes que en otras secciones de la carretera.
- id: 193
  category: defensive_driving
  question: ¿Qué causa que un vehículo patine sobre el agua (hydroplane) en carreteras
    mojadas?
  choices:
    A: Conducir sobre una fina capa de aceite, tierra y agua
    B: Conducir con llantas infladas en exceso
    C: Usar las luces altas bajo la lluvia
    D: Bombear los frenos con demasiada frecuencia
  answer: A
  explanation: Cuando conduce en carreteras mojadas, su vehículo en realidad se desplaza
    sobre una fina capa de aceite, tierra y agua, lo que puede provocar que patine
    sobre el agua (hydroplaning).
- id: 194
  category: defensive_driving
  question: ¿Qué debe hacer después de conducir a través de charcos de agua para ayudar
    a secar sus frenos?
  choices:
    A: Acelerar rápidamente
    B: Cambiar a una marcha más baja
    C: Probar sus frenos bombeándolos
    D: Aplicar el freno de estacionamiento por unos segundos
  answer: C
  explanation: Después de conducir a través de charcos de agua, pruebe sus frenos
    bombeándolos. Hacerlo ayudará a secarlos.
- id: 195
  category: safe_driving_rules
  question: ¿Qué configuración de luces delanteras debe usar al conducir en la niebla?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Sin luces delanteras, solo luces intermitentes de emergencia
  answer: B
  explanation: No use las luces altas. Las luces bajas iluminan mejor la carretera
    y los objetos más adelante.
- id: 196
  category: defensive_driving
  question: ¿Cuál es la acción más segura si su vehículo se apaga en un área inundada?
  choices:
    A: Quedarse en el vehículo y esperar a ser rescatado
    B: Subir las ventanas y poner los seguros de las puertas
    C: Abandonar el vehículo lo antes posible
    D: Intentar encender el motor repetidamente
  answer: C
  explanation: Si su automóvil se apaga en un área inundada, abandónelo lo antes posible,
    ya que las aguas de la inundación pueden subir rápidamente y arrastrar el automóvil
    y a sus ocupantes.
- id: 197
  category: defensive_driving
  question: ¿Cómo puede evitar el resplandor de las luces delanteras de los vehículos
    que se aproximan al conducir de noche?
  choices:
    A: Mirar directamente a las luces del vehículo que se aproxima
    B: Enfocarse en el lado derecho de la carretera
    C: Encender sus luces altas para contrarrestar el resplandor
    D: Cerrar un ojo hasta que pase el vehículo
  answer: B
  explanation: Para evitar el resplandor, no mire directamente a las luces de un vehículo
    que se aproxima; en su lugar, enfóquese en el lado derecho de la carretera.
- id: 198
  category: safe_driving_rules
  question: ¿Cuándo se requiere que los conductores usen sus luces delanteras?
  choices:
    A: Solo entre las 10 PM y las 6 AM
    B: Entre el atardecer y el amanecer o cuando la visibilidad sea menor a 500 pies
    C: Solo al conducir en caminos rurales sin iluminación
    D: Entre el amanecer y el atardecer o cuando la visibilidad sea menor a 1,000
      pies
  answer: B
  explanation: Los conductores deben usar las luces delanteras entre el atardecer
    y el amanecer, así como en cualquier otro momento en que la visibilidad sea menor
    a 500 pies.
- id: 199
  category: safe_driving_rules
  question: ¿Cuándo debe usar sus luces delanteras bajas?
  choices:
    A: A menos de 500 pies de un vehículo que se aproxima o a 200 pies de la parte
      trasera de otro vehículo
    B: A menos de 1,000 pies de un vehículo que se aproxima o a 500 pies de la parte
      trasera de otro vehículo
    C: A menos de 200 pies de un vehículo que se aproxima o a 100 pies de la parte
      trasera de otro vehículo
    D: Solo al conducir dentro de los límites de la ciudad
  answer: A
  explanation: Cuando las luces delanteras están encendidas, se deben usar las luces
    bajas al acercarse a menos de 500 pies de un vehículo que viene en sentido contrario
    o al seguir a menos de 200 pies de la parte trasera de otro vehículo.
- id: 200
  category: vehicle_information
  question: Según el manual, ¿cuál es el factor más importante para reducir la probabilidad
    de una volcadura?
  choices:
    A: Evitar por completo los caminos rurales
    B: Mantener sus llantas adecuadamente
    C: Conducir un vehículo con un centro de gravedad bajo
    D: Nunca conducir a más de 45 millas por hora
  answer: B
  explanation: Las llantas desgastadas y mal infladas limitan su capacidad para mantener
    el control del vehículo, lo cual es el factor más importante para reducir la probabilidad
    de una volcadura.
- id: 201
  category: safe_driving_rules
  question: ¿Cuándo deben los conductores usar sus faros según la ley de Indiana?
  choices:
    A: Entre el atardecer y el amanecer o cuando la visibilidad sea menor a 500 pies
    B: Solo al conducir en caminos rurales sin iluminación
    C: Entre las 8:00 PM y las 6:00 AM
    D: Siempre que se conduzca a velocidades superiores a 55 mph
  answer: A
  explanation: Los conductores deben usar los faros entre el atardecer y el amanecer,
    así como en cualquier otro momento en el que la visibilidad sea menor a 500 pies.
- id: 202
  category: safe_driving_rules
  question: Al seguir a otro vehículo, ¿a qué distancia debe bajar las luces de sus
    faros (luces bajas)?
  choices:
    A: A menos de 100 pies
    B: A menos de 200 pies
    C: A menos de 300 pies
    D: A menos de 500 pies
  answer: B
  explanation: Se deben usar las luces bajas al acercarse a menos de 500 pies de un
    vehículo que se aproxima en sentido contrario o al seguir a menos de 200 pies
    de la parte trasera de otro vehículo.
- id: 203
  category: alcohol_drugs_health
  question: Los estudios muestran que pasar 18 horas sin dormir deja a un conductor
    con el mismo nivel de deterioro que un conductor con un nivel de Concentración
    de Alcohol en la Sangre (BAC) de ¿cuánto?
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: Los estudios han demostrado que pasar 18 horas sin dormir deja a un
    conductor con el mismo nivel de deterioro que un conductor con una Concentración
    de Alcohol en la Sangre (BAC) de .08, que es el límite legal de alcohol.
- id: 204
  category: driver_responsibility
  question: ¿Qué grupo de edad tiene el mayor riesgo de sufrir accidentes relacionados
    con la fatiga, representando el 64 por ciento de ellos?
  choices:
    A: 16-29
    B: 30-45
    C: 46-60
    D: 61 y mayores
  answer: A
  explanation: Aunque cualquiera puede cometer el error fatal de conducir sin el descanso
    adecuado, los adultos jóvenes de 16 a 29 años tienen el mayor riesgo, representando
    el 64 por ciento de los accidentes relacionados con la fatiga.
- id: 205
  category: safe_driving_rules
  question: ¿Cuál es la única excepción legal para usar un dispositivo de telecomunicaciones
    portátil mientras se opera un vehículo motorizado en Indiana?
  choices:
    A: Revisar un mapa de navegación GPS
    B: Leer un mensaje de texto urgente
    C: Contactar al 911 por una emergencia real
    D: Hacer una llamada telefónica mientras está detenido en un semáforo en rojo
  answer: C
  explanation: Las únicas excepciones a esta prohibición son cuando la comunicación
    manos libres está activada o si el dispositivo de telecomunicaciones se utiliza
    para contactar al 911 por una emergencia real.
- id: 206
  category: defensive_driving
  question: Enviar o leer un mensaje de texto aparta sus ojos de la carretera durante
    cinco segundos. A 55 mph, ¿a qué distancia equivale esto a conducir con los ojos
    vendados?
  choices:
    A: La longitud de una cancha de baloncesto
    B: La longitud de un campo de fútbol americano entero
    C: Una milla completa
    D: 500 pies
  answer: B
  explanation: Enviar o leer un mensaje de texto aparta sus ojos de la carretera durante
    cinco segundos. A 55 mph, eso es como conducir la longitud de un campo de fútbol
    americano entero con los ojos cerrados.
- id: 207
  category: penalties_and_points
  question: Según la ley de Indiana, una persona participa en conducción agresiva
    si comete al menos ¿cuántas acciones inseguras específicas durante un episodio
    de conducción continua?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Según la ley de Indiana, una persona participa en conducción agresiva
    si, durante un episodio de conducción continua de un vehículo, la persona realiza
    o comete al menos tres de las siguientes [acciones inseguras].
- id: 208
  category: defensive_driving
  question: ¿Por qué es más difícil detenerse y girar en caminos de grava suelta?
  choices:
    A: Los caminos de grava suelen ser más anchos que los caminos pavimentados
    B: Su tracción se reduce, lo que puede causar derrapes
    C: Los caminos de grava siempre tienen límites de velocidad más altos
    D: El polvo bloquea completamente su vista de la carretera
  answer: B
  explanation: Detenerse y girar es más difícil en grava suelta porque su tracción
    se reduce. Cuando la tracción se reduce, pueden ocurrir derrapes.
- id: 209
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de acercarse a la cima de una colina empinada en
    un camino rural?
  choices:
    A: Acelerar para mantener el impulso
    B: Moverse al lado izquierdo de la carretera
    C: Tocar la bocina continuamente
    D: Reducir la velocidad, moverse al lado derecho de la carretera y estar atento
      a los vehículos que se aproximan
  answer: D
  explanation: Antes de acercarse a la cima de una colina empinada, reduzca la velocidad,
    muévase al lado derecho de la carretera y esté atento a los vehículos que se aproximan
    en sentido contrario.
- id: 210
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida prevista en una autopista interestatal?
  choices:
    A: Detenerse y retroceder con cuidado por el arcén
    B: Hacer un giro en U a través de la mediana
    C: Conducir hasta la siguiente salida
    D: Detenerse en el carril derecho y esperar a que el tráfico se despeje antes
      de retroceder
  answer: C
  explanation: Es inseguro retroceder en una autopista interestatal para llegar a
    una salida que se pasó. Si se pasa de una salida, debe conducir hasta la siguiente
    salida.
- id: 211
  category: sharing_the_road
  question: En una autopista interestatal con tres o más carriles en una dirección,
    ¿en qué carriles se restringe la circulación de los camiones?
  choices:
    A: Los dos carriles izquierdos
    B: Solo el carril central
    C: Los dos carriles derechos
    D: Cualquier carril que elijan
  answer: C
  explanation: Los camiones están restringidos al carril derecho en tramos de autopistas
    interestatales con dos carriles en una dirección, y restringidos a los dos carriles
    derechos en autopistas interestatales con tres o más carriles en una dirección.
- id: 212
  category: signs_and_signals
  question: ¿Qué significa un panel de flecha intermitente en una zona de obras que
    NO indica una dirección?
  choices:
    A: Debe moverse inmediatamente al carril izquierdo
    B: Debe moverse inmediatamente al carril derecho
    C: Es una señal para tener precaución, pero no requiere cambiarse a otro carril
    D: La carretera está completamente cerrada más adelante
  answer: C
  explanation: Un panel de flecha intermitente que no indica una dirección hacia ningún
    lado es una señal para tener precaución, pero no requiere que el conductor se
    cambie a otro carril.
- id: 213
  category: signs_and_signals
  question: ¿Qué debe hacer cuando un abanderado en una zona de obras extiende una
    bandera naranja/roja fluorescente en posición horizontal hacia la línea de tráfico?
  choices:
    A: Continuar a su velocidad actual
    B: Detenerse
    C: Moverse al carril izquierdo
    D: Tocar la bocina y avanzar lentamente
  answer: B
  explanation: Debe detenerse cuando un abanderado extiende una bandera naranja/roja
    fluorescente en posición horizontal hacia la línea de tráfico.
- id: 214
  category: safe_driving_rules
  question: ¿A qué distancia deben detenerse ciertos vehículos, como los autobuses
    escolares, del riel más cercano en un cruce de ferrocarril?
  choices:
    A: A no menos de 10 pies ni a más de 30 pies
    B: A no menos de 15 pies ni a más de 50 pies
    C: A no menos de 20 pies ni a más de 100 pies
    D: Exactamente a 25 pies
  answer: B
  explanation: Por ley, algunos vehículos están obligados a detenerse siempre en los
    cruces de ferrocarril a no menos de 15 pies ni a más de 50 pies del riel más cercano.
- id: 215
  category: signs_and_signals
  question: ¿Cómo debe tratar una señal de cruz de San Andrés (crossbuck) de ferrocarril
    cuando se muestra sola?
  choices:
    A: Como una señal de alto (Stop)
    B: Como una señal de ceda el paso (Yield)
    C: Como una señal de límite de velocidad
    D: Como una advertencia de calle sin salida
  answer: B
  explanation: Cuando se muestra sola, debe tratar la señal de cruz de San Andrés
    como una señal de ceda el paso, y la decisión de detenerse o cruzar las vías es
    suya.
- id: 216
  category: signs_and_signals
  question: ¿Qué debe hacer cuando se acerca a un cruce de ferrocarril que tiene una
    señal de cruz de San Andrés (crossbuck) mostrada sola?
  choices:
    A: Detenerse por completo independientemente de si se acerca un tren.
    B: Tratarla como una señal de ceda el paso y detenerse si se acerca un tren.
    C: Acelerar para despejar las vías lo más rápido posible.
    D: Tocar la bocina y continuar sin reducir la velocidad.
  answer: B
  explanation: Cuando se muestra sola, debe tratar la señal de cruz de San Andrés
    como una señal de ceda el paso, y la decisión de detenerse o cruzar las vías es
    suya. Debe detenerse si se acerca un tren.
- id: 217
  category: safe_driving_rules
  question: ¿Cuáles de los siguientes vehículos están obligados a detenerse en todos
    los cruces de ferrocarril?
  choices:
    A: Todos los vehículos que transportan pasajeros por contrato
    B: Todas las camionetas (pickup)
    C: Todos los automóviles de pasajeros
    D: Todas las motocicletas
  answer: A
  explanation: Los vehículos obligados a detenerse en todos los cruces de ferrocarril
    incluyen todos los vehículos que transportan pasajeros por contrato, todos los
    autobuses escolares y todos los vehículos que transportan explosivos o líquidos
    inflamables.
- id: 218
  category: safe_driving_rules
  question: ¿A cuántos pies de un cruce de ferrocarril es ilegal rebasar a otro vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: 'El manual establece: No rebase a otro vehículo a menos de 100 pies
    de un cruce de ferrocarril.'
- id: 219
  category: defensive_driving
  question: Si su vehículo se queda atascado en las vías del ferrocarril y se acerca
    un tren, ¿en qué dirección debe correr después de evacuar?
  choices:
    A: En un ángulo de 45 grados alejándose de las vías en dirección al tren que se
      aproxima
    B: Directamente por las vías alejándose del tren
    C: En un ángulo de 90 grados alejándose directamente de las vías
    D: En un ángulo de 45 grados alejándose de las vías en la misma dirección en la
      que viaja el tren
  answer: A
  explanation: En caso de que se quede atascado en las vías, debe evacuar el área
    y correr en un ángulo de 45 grados alejándose de las vías en dirección al tren
    que se aproxima.
- id: 220
  category: safe_driving_rules
  question: Una vez que las luces del cruce de vías comienzan a parpadear y la barrera
    comienza a bajar, ¿aproximadamente cuánto tiempo tiene para escapar del cruce?
  choices:
    A: 10 segundos
    B: 20 segundos
    C: 30 segundos
    D: 45 segundos
  answer: B
  explanation: Una vez que las luces del cruce de vías comienzan a parpadear y la
    barrera comienza a bajar, tiene aproximadamente 20 segundos para escapar del cruce.
- id: 221
  category: vehicle_information
  question: ¿Cuál es la altura máxima de cualquier vehículo que se puede operar sin
    un permiso especial en Indiana?
  choices:
    A: 12 pies, 6 pulgadas
    B: 13 pies, 6 pulgadas
    C: 14 pies
    D: 14 pies, 6 pulgadas
  answer: B
  explanation: La altura máxima de cualquier vehículo que se puede operar sin un permiso
    especial es de 13 pies y 6 pulgadas.
- id: 222
  category: sharing_the_road
  question: Aproximadamente, ¿cuántos pies le toma a un camión con remolque completamente
    cargado y con los frenos calientes detenerse por completo cuando viaja a 55 millas
    por hora?
  choices:
    A: De 130 a 140 pies
    B: 200 pies
    C: 300 pies
    D: Más de 400 pies
  answer: D
  explanation: Un camión con remolque completamente cargado y con los frenos calientes
    puede tardar más de 400 pies en detenerse por completo, o más de la longitud de
    un campo de fútbol americano.
- id: 223
  category: sharing_the_road
  question: ¿Qué tan lejos detrás de un camión con remolque puede extenderse su punto
    ciego trasero?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 150 pies
    D: Hasta 200 pies
  answer: D
  explanation: Los puntos ciegos para el conductor del camión con remolque serán de
    hasta 20 pies frente a la cabina, a ambos lados del remolque, junto a la cabina
    y hasta 200 pies detrás del vehículo.
- id: 224
  category: sharing_the_road
  question: ¿Por qué los camiones con remolque a menudo se mantienen en el carril
    central en las autopistas de varios carriles?
  choices:
    A: Para conducir más rápido que el límite de velocidad indicado.
    B: Para ayudar al flujo del tráfico local al entrar y salir de la autopista y
      aumentar las opciones para evitar situaciones peligrosas.
    C: Porque es ilegal que conduzcan en el carril derecho.
    D: Para evitar que los vehículos de pasajeros los rebasen.
  answer: B
  explanation: En las autopistas de varios carriles, los camiones con remolque se
    mantienen en el carril central para ayudar al flujo del tráfico local al entrar
    y salir de la autopista. Mantenerse en el carril central también aumenta las opciones
    del conductor del camión con remolque si tiene que cambiar de carril para evitar
    una situación peligrosa.
- id: 225
  category: sharing_the_road
  question: Al rebasar a un camión con remolque, ¿por qué lado debe rebasar?
  choices:
    A: Siempre por el lado izquierdo
    B: Siempre por el lado derecho
    C: Por el lado que tenga menos tráfico
    D: Nunca debe rebasar a un camión con remolque
  answer: A
  explanation: Siempre rebase a un camión con remolque por completo y siempre por
    el lado izquierdo. Demorarse al rebasar hace imposible que el conductor del camión
    con remolque tome medidas evasivas.
- id: 226
  category: safe_driving_rules
  question: Según la Ley de Hacerse a un Lado (Move Over Law) de Indiana, ¿qué debe
    hacer si no puede cambiarse a otro carril al acercarse a un vehículo de emergencia
    con luces intermitentes?
  choices:
    A: Mantener su velocidad y proceder con precaución.
    B: Reducir su velocidad a 10 mph por debajo del límite indicado y proceder con
      precaución.
    C: Detenerse inmediatamente en su carril.
    D: Acelerar para rebasar rápidamente al vehículo de emergencia.
  answer: B
  explanation: Si no puede hacerse a un lado, los automovilistas deben reducir su
    velocidad a 10 mph por debajo del límite indicado y proceder con precaución.
- id: 227
  category: penalties_and_points
  question: 'El incumplimiento de la Ley de Hacerse a un Lado (Move Over Law) de Indiana
    se considera:'
  choices:
    A: Delito menor de Clase A
    B: Infracción de Clase B
    C: Infracción de Clase A
    D: Delito grave
  answer: C
  explanation: Los automovilistas que se acercan a un vehículo de emergencia que muestra
    luces intermitentes alternas están obligados a cambiar de carril o reducir la
    velocidad. El incumplimiento es una Infracción de Clase A.
- id: 228
  category: defensive_driving
  question: Si su vehículo se descompone en un cruce de ferrocarril y no se acerca
    ningún tren, ¿qué es lo primero que debe hacer?
  choices:
    A: Llamar a una grúa.
    B: Intentar empujar el vehículo fuera de las vías usted mismo.
    C: Llamar inmediatamente al Sistema de Notificación de Emergencias (ENS) usando
      el número en el letrero azul.
    D: Hacer señas a un automovilista que pase.
  answer: C
  explanation: Si su vehículo se descompone en el cruce y no se acerca ningún tren,
    llame inmediatamente al Sistema de Notificación de Emergencias (ENS). El número
    de teléfono se encuentra en el letrero azul adherido a la barrera del cruce de
    las vías del ferrocarril.
- id: 229
  category: sharing_the_road
  question: Cuando un camión con remolque está haciendo un giro cerrado, ¿qué debe
    esperar?
  choices:
    A: Las ruedas traseras seguirán una trayectoria más amplia que las ruedas delanteras.
    B: El conductor puede abrirse hacia afuera como primer paso para hacer el giro.
    C: El vehículo siempre girará desde el carril central.
    D: El remolque se detendrá por completo antes de girar.
  answer: B
  explanation: En cualquier vehículo que gira, las ruedas traseras siguen una trayectoria
    más corta que las ruedas delanteras. Los conductores de camiones con remolque
    a menudo se abren hacia afuera como primer paso para hacer un giro cerrado.
- id: 230
  category: safe_driving_rules
  question: ¿Qué debe evitar hacer mientras conduce a través de las vías del ferrocarril?
  choices:
    A: Mirar a ambos lados
    B: Detenerse o cambiar de marcha
    C: Encender sus faros
    D: Usar sus limpiaparabrisas
  answer: B
  explanation: Evite detenerse o cambiar de marcha mientras cruza las vías del ferrocarril.
    Un conductor nunca debe comenzar a cruzar las vías del ferrocarril a menos que
    pueda despejarlas sin detenerse.
- id: 231
  category: penalties_and_points
  question: ¿Cuál es la sanción por no cambiar de carril o reducir la velocidad ante
    un vehículo de emergencia autorizado?
  choices:
    A: Infracción de Clase A
    B: Infracción de Clase B
    C: Delito menor de Clase A
    D: Delito grave de Nivel 6
  answer: A
  explanation: Según el manual, si un conductor no puede cambiar de carril ante un
    vehículo de emergencia autorizado, debe reducir su velocidad a 10 mph por debajo
    del límite publicado. El incumplimiento de esta norma es una Infracción de Clase
    A.
- id: 232
  category: safe_driving_rules
  question: Si no puede cambiar de carril para alejarse de un vehículo estacionado
    autorizado con luces intermitentes ámbar, ¿qué acción debe tomar?
  choices:
    A: Detenerse por completo y esperar a que el vehículo se mueva
    B: Reducir su velocidad a 10 mph por debajo del límite publicado y continuar con
      precaución
    C: Reducir su velocidad a 15 mph y continuar con precaución
    D: Mantener su velocidad pero tocar la bocina para alertar a los trabajadores
  answer: B
  explanation: El manual establece que si no puede cambiar de carril ante un vehículo
    estacionado autorizado con luces intermitentes ámbar, debe reducir su velocidad
    a 10 mph por debajo del límite publicado y continuar con precaución.
- id: 233
  category: safe_driving_rules
  question: ¿Cuándo NO está obligado a detenerse ante un autobús escolar con luces
    rojas intermitentes y el brazo de parada extendido?
  choices:
    A: Cuando viaja en dirección opuesta en una vía dividida por una barrera o una
      mediana no pavimentada
    B: Cuando viaja en una carretera de dos carriles en dirección opuesta
    C: Cuando viaja en la misma dirección que el autobús en una carretera dividida
    D: Cuando el autobús escolar está detenido en un cruce de ferrocarril
  answer: A
  explanation: Si conduce por una vía dividida por una barrera o una mediana no pavimentada,
    solo está obligado a detenerse si viaja en la misma dirección que el autobús escolar.
- id: 234
  category: penalties_and_points
  question: ¿Cuál es la sanción por ignorar el brazo de parada de un autobús escolar
    si la infracción resulta en lesiones corporales?
  choices:
    A: Infracción de Clase A
    B: Infracción de Clase B
    C: Delito menor de Clase A
    D: Delito grave de Nivel 6
  answer: D
  explanation: Ignorar el brazo de parada de un autobús escolar puede resultar en
    un delito menor de Clase A, pero se convierte en un delito grave de Nivel 6 si
    la infracción resulta en lesiones corporales.
- id: 235
  category: sharing_the_road
  question: ¿Cuánta distancia de seguimiento debe dejar al conducir detrás de una
    motocicleta?
  choices:
    A: Uno o dos segundos
    B: Al menos tres o cuatro segundos
    C: Cinco o seis segundos
    D: La longitud de un automóvil por cada 10 mph
  answer: B
  explanation: El manual aconseja dejar al menos tres o cuatro segundos al seguir
    a una motocicleta para que el motociclista tenga suficiente tiempo para maniobrar
    o detenerse en caso de emergencia.
- id: 236
  category: sharing_the_road
  question: ¿Por qué debe esperar para asegurarse de que un motociclista va a girar
    antes de avanzar, incluso si su luz direccional está parpadeando?
  choices:
    A: Las motocicletas a menudo tienen cableado defectuoso que causa parpadeos aleatorios
    B: Las luces direccionales de las motocicletas generalmente no se apagan automáticamente,
      y los conductores a veces olvidan apagarlas
    C: Los motociclistas cambian de opinión frecuentemente sobre girar
    D: La ley exige un tiempo de espera obligatorio de cinco segundos antes de avanzar
  answer: B
  explanation: No asuma que una luz direccional parpadeando en una motocicleta significa
    que pronto habrá un giro, ya que estos vehículos tienen señales que generalmente
    no se apagan automáticamente, y los conductores a veces olvidan apagarlas.
- id: 237
  category: sharing_the_road
  question: ¿Cuál es el espacio mínimo seguro que un conductor debe dejar al rebasar
    a un ciclista?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies
    D: Cinco pies
  answer: C
  explanation: Los conductores pueden rebasar a un ciclista cuando hay una cantidad
    segura de espacio al lado del ciclista, que es un mínimo de tres pies.
- id: 238
  category: sharing_the_road
  question: ¿Cuál es la regla general con respecto a los ciclistas que viajan en paralelo
    (uno al lado del otro) en las carreteras?
  choices:
    A: Siempre deben viajar en fila india
    B: Pueden viajar hasta tres en paralelo
    C: No pueden viajar más de dos en paralelo, excepto en ciclovías exclusivas
    D: Pueden viajar tantos en paralelo como lo permita el ancho del carril
  answer: C
  explanation: Los ciclistas no pueden viajar más de dos (2) en paralelo, excepto
    en caminos o partes de la vía reservadas para el uso exclusivo de bicicletas.
- id: 239
  category: sharing_the_road
  question: ¿Cuándo se le permite a un conductor cruzar una ciclovía o carril para
    bicicletas?
  choices:
    A: Al prepararse para un giro con 100 pies de anticipación
    B: Al rebasar a un vehículo de motor más lento
    C: Solo al girar o al entrar o salir de un callejón, entrada de vehículos o camino
      privado
    D: Siempre que el carril para bicicletas esté libre de ciclistas
  answer: C
  explanation: Los conductores pueden cruzar una ciclovía o carril para bicicletas
    solo al girar o al entrar o salir de un callejón, entrada de vehículos o camino
    privado.
- id: 240
  category: signs_and_signals
  question: ¿Cuál es el propósito de las marcas de carril compartido ('Sharrow') en
    el pavimento?
  choices:
    A: Indicar un carril exclusivo para bicicletas
    B: Advertir a los conductores de un próximo cruce de peatones
    C: Ayudar a los ciclistas a posicionarse lejos de los autos estacionados y alertar
      a los conductores para que esperen ciclistas
    D: Marcar un área de estacionamiento designada para bicicletas
  answer: C
  explanation: Las marcas de carril compartido ('Sharrow') tienen el propósito de
    ayudar a los ciclistas a posicionarse lejos de los autos estacionados y alertar
    a otros usuarios de la vía para que esperen que los ciclistas ocupen los carriles
    de circulación.
- id: 241
  category: signs_and_signals
  question: ¿Qué indica el pavimento de color rojo en una vía?
  choices:
    A: Un carril designado para bicicletas
    B: Un carril designado para autobuses, taxis u otros medios de transporte público
    C: Una zona de no estacionar
    D: Una próxima señal de alto o semáforo
  answer: B
  explanation: El pavimento de color rojo se puede usar para mejorar la visibilidad
    de los carriles de tránsito que están designados para autobuses, taxis u otros
    medios de transporte público.
- id: 242
  category: safe_driving_rules
  question: Si un oficial de la ley está dirigiendo el tráfico en una intersección
    y da una orden que contradice un semáforo en verde, ¿qué debe hacer usted?
  choices:
    A: Seguir el semáforo
    B: Obedecer la orden del oficial de la ley
    C: Esperar hasta que el semáforo se ponga en rojo antes de moverse
    D: Tocar la bocina para alertar al oficial que tiene luz verde
  answer: B
  explanation: La orden de un oficial de la ley puede ser diferente a la de un semáforo
    o señal de tráfico. En tal caso, la orden del oficial de la ley es la que se debe
    obedecer.
- id: 243
  category: safe_driving_rules
  question: Al comenzar a estacionarse en paralelo, ¿a qué distancia debe colocar
    su vehículo del vehículo estacionado frente al espacio vacío?
  choices:
    A: Al menos a un pie
    B: Al menos a dos pies
    C: Al menos a tres pies
    D: Al menos a cuatro pies
  answer: B
  explanation: Al estacionarse en paralelo, debe colocar su vehículo paralelo al vehículo
    estacionado frente al espacio vacío y mantener al menos dos pies de distancia
    de este vehículo.
- id: 244
  category: penalties_and_points
  question: ¿Cuál es la sanción por no hacerse a un lado o no reducir adecuadamente
    la velocidad ante un vehículo estacionado averiado con las luces intermitentes
    de advertencia de peligro encendidas?
  choices:
    A: Infracción de Clase A
    B: Infracción de Clase B
    C: Infracción de Clase C
    D: Delito menor de Clase A
  answer: B
  explanation: Los conductores que se acercan a un vehículo estacionado averiado con
    las luces intermitentes de advertencia de peligro encendidas deben cambiar de
    carril o reducir la velocidad a 10 mph por debajo del límite. No hacerlo es una
    Infracción de Clase B.
- id: 245
  category: sharing_the_road
  question: ¿Está obligado un ciclista a circular por un carril designado para bicicletas
    si hay uno disponible?
  choices:
    A: Sí, siempre deben usar el carril para bicicletas
    B: Sí, a menos que el carril para bicicletas esté bloqueado por escombros
    C: No, tienen derecho a usar tanto el carril para bicicletas como el carril de
      circulación
    D: No, pero solo si viajan a más de 15 mph
  answer: C
  explanation: Un ciclista no está obligado a circular por un carril designado para
    bicicletas porque tiene el derecho de usar tanto el carril para bicicletas como
    el carril de circulación general.
- id: 246
  category: safe_driving_rules
  question: ¿Cómo debe girar las ruedas de su vehículo al estacionarse cuesta abajo?
  choices:
    A: Lejos del borde de la acera
    B: Hacia el borde de la acera
    C: Paralelas al borde de la acera
    D: Hacia la calle
  answer: B
  explanation: Cuando se estacione cuesta abajo, gire las ruedas de su vehículo hacia
    el borde de la acera.
- id: 247
  category: safe_driving_rules
  question: Si se estaciona cuesta arriba y no hay borde de acera, ¿hacia qué lado
    debe girar las ruedas?
  choices:
    A: Hacia la calle
    B: Paralelas a la calle
    C: Lejos de la calle
    D: Recto hacia adelante
  answer: C
  explanation: Si no hay borde de acera, gire las ruedas de su vehículo lejos de la
    calle al estacionarse cuesta arriba.
- id: 248
  category: safe_driving_rules
  question: ¿Cuál es la técnica adecuada para dar marcha atrás a un vehículo?
  choices:
    A: Depender completamente de su espejo retrovisor
    B: Girar su cuerpo hacia la izquierda para mirar por la ventana lateral
    C: Girar su cuerpo hacia la derecha para mirar por la ventana trasera
    D: Usar solo sus espejos laterales
  answer: C
  explanation: Para dar marcha atrás, gire su cuerpo hacia la derecha para mirar por
    la ventana trasera. Nunca use solo el espejo retrovisor para dar marcha atrás.
- id: 249
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es un área de estacionamiento ilegal?
  choices:
    A: A menos de 15 pies de un hidrante de incendios
    B: A menos de 25 pies de un hidrante de incendios
    C: A menos de 50 pies de un cruce de ferrocarril
    D: Junto a un borde de acera blanco
  answer: A
  explanation: Está prohibido estacionar a menos de 15 pies de un hidrante de incendios
    o en carriles de bomberos.
- id: 250
  category: sharing_the_road
  question: ¿Qué ayudas de movilidad a menudo indican que un peatón tiene discapacidad
    visual?
  choices:
    A: Una chaqueta amarilla o chaleco reflectante
    B: Un bastón blanco o un perro guía entrenado
    C: Un bastón rojo o una silla de ruedas motorizada
    D: Una luz intermitente o un andador
  answer: B
  explanation: Las ayudas de movilidad para una persona con discapacidad visual suelen
    ser un bastón blanco o un perro guía entrenado.
- id: 251
  category: vehicle_information
  question: ¿En qué porcentaje aumentan los cinturones de seguridad las probabilidades
    de supervivencia de los conductores y los pasajeros del asiento delantero?
  choices:
    A: 25 por ciento
    B: 35 por ciento
    C: 45 por ciento
    D: 50 por ciento
  answer: C
  explanation: Cuando se usan, los cinturones de seguridad para los conductores y
    los pasajeros del asiento delantero aumentan las probabilidades de supervivencia
    en un 45 por ciento.
- id: 252
  category: safe_driving_rules
  question: ¿Cómo debe posicionarse un conductor en relación con el volante para maximizar
    la seguridad?
  choices:
    A: A por lo menos 6 pulgadas de distancia
    B: A por lo menos 10 pulgadas de distancia
    C: A por lo menos 12 pulgadas de distancia
    D: Tan cerca como sea cómodamente posible
  answer: C
  explanation: Para maximizar la seguridad, el conductor debe sentarse a por lo menos
    12 pulgadas de distancia del volante.
- id: 253
  category: safe_driving_rules
  question: ¿Cuál de las siguientes personas está exenta de usar el cinturón de seguridad?
  choices:
    A: Un pasajero en el asiento trasero de un automóvil de pasajeros
    B: Un conductor de un vehículo comercial en un viaje de larga distancia
    C: Un repartidor de periódicos motorizado que se detiene para hacer entregas
    D: Un adolescente conduciendo a la escuela
  answer: C
  explanation: Un repartidor de periódicos motorizado o un transportista de paquetes
    de periódicos que se detiene para hacer entregas desde un vehículo está exento
    de usar el cinturón de seguridad.
- id: 254
  category: driver_responsibility
  question: Según la ley de Indiana, ¿los pasajeros menores de qué edad deben estar
    debidamente asegurados en un sistema de retención infantil?
  choices:
    A: Seis años de edad
    B: Siete años de edad
    C: Ocho años de edad
    D: Diez años de edad
  answer: C
  explanation: Por ley, los pasajeros menores de ocho años de edad deben estar debidamente
    asegurados en un sistema de retención infantil, como un asiento de seguridad para
    niños o un asiento elevado (booster seat).
- id: 255
  category: vehicle_information
  question: Si un automóvil está equipado con una bolsa de aire (airbag) en el lado
    del pasajero, ¿el Consejo Nacional de Seguridad recomienda colocar a los niños
    menores de qué edad en el asiento trasero?
  choices:
    A: 8 años de edad
    B: 10 años de edad
    C: 12 años de edad
    D: 14 años de edad
  answer: C
  explanation: Si un automóvil está equipado con una bolsa de aire en el lado del
    pasajero, el Consejo Nacional de Seguridad recomienda colocar a los niños menores
    de 12 años de edad en el asiento trasero.
- id: 256
  category: vehicle_information
  question: Si la carga de un vehículo se extiende más de cuatro pies más allá de
    la parte trasera del vehículo entre el amanecer y el atardecer, ¿qué se debe montar
    en el extremo posterior?
  choices:
    A: Una luz roja visible desde 500 pies
    B: Una bandera roja de no menos de 12 pulgadas cuadradas
    C: Dos luces amarillas intermitentes
    D: Un letrero de "Carga Ancha" (Wide Load)
  answer: B
  explanation: Entre el amanecer y el atardecer, se debe montar una bandera roja en
    el extremo posterior de la carga del vehículo. La bandera roja no debe tener menos
    de 12 pulgadas cuadradas.
- id: 257
  category: defensive_driving
  question: Si su automóvil se avería durante el día, ¿dónde debe colocar dos banderas
    rojas?
  choices:
    A: A 50 pies delante y 50 pies detrás del automóvil
    B: A 100 pies delante y 100 pies detrás del automóvil
    C: A 200 pies delante y 200 pies detrás del automóvil
    D: En el techo y en el maletero del automóvil
  answer: B
  explanation: 'Durante el día, los conductores de automóviles averiados deben colocar
    dos banderas rojas: una aproximadamente a 100 pies delante del automóvil y la
    otra aproximadamente a 100 pies detrás de él.'
- id: 258
  category: defensive_driving
  question: Si su automóvil está detenido a menos de 500 pies de una curva o la cima
    de una colina, ¿a qué distancia se debe colocar un dispositivo de advertencia?
  choices:
    A: A por lo menos 100 pies de su automóvil
    B: A por lo menos 200 pies de su automóvil
    C: A por lo menos 300 pies de su automóvil
    D: A por lo menos 500 pies de su automóvil
  answer: D
  explanation: Si su automóvil está detenido a menos de 500 pies de una curva, la
    cima de una colina u otra obstrucción, se debe colocar un dispositivo de advertencia
    a por lo menos 500 pies de su automóvil.
- id: 259
  category: safe_driving_rules
  question: ¿Cómo se deben usar los cinturones de seguridad en el cuerpo para maximizar
    la seguridad?
  choices:
    A: Alto en el estómago y debajo del brazo
    B: Bajo en las caderas y plano sobre la clavícula
    C: Suelto a través de la cintura y el cuello
    D: Alto en las caderas y a través del pecho
  answer: B
  explanation: Todos deben usar sus cinturones de seguridad bajos en las caderas y
    planos sobre la clavícula.
- id: 260
  category: safe_driving_rules
  question: Si su vehículo se avería en una carretera dividida, ¿a qué distancia de
    su vehículo se debe colocar un dispositivo de advertencia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según el manual, si su vehículo se avería en una carretera dividida,
    el dispositivo de advertencia de emergencia debe colocarse a 200 pies de su vehículo.
- id: 261
  category: defensive_driving
  question: ¿Cuál es el factor más común en todas las colisiones en Indiana?
  choices:
    A: Exceso de velocidad
    B: Conducir bajo los efectos del alcohol o drogas (DUI)
    C: No ceder el derecho de paso
    D: Conducir distraído
  answer: C
  explanation: El manual establece que, entre todas las colisiones en Indiana, no
    ceder el derecho de paso es el factor más común.
- id: 262
  category: driver_responsibility
  question: ¿Bajo qué condición NO debe mover su vehículo fuera de la carretera después
    de un accidente?
  choices:
    A: Si el accidente ocurre durante el tráfico de la hora pico
    B: Si el accidente involucra el transporte de materiales peligrosos
    C: Si el vehículo tiene una llanta desinflada
    D: Si el otro conductor se niega a mover su vehículo
  answer: B
  explanation: El conductor no debe mover el vehículo motorizado si el accidente involucra
    el transporte de materiales peligrosos o resulta en lesiones, muerte o atrapamiento.
- id: 263
  category: driver_responsibility
  question: ¿Qué debe hacer si choca con un vehículo desatendido y no puede localizar
    al propietario?
  choices:
    A: Dejar una nota en el parabrisas y alejarse
    B: Llamar a una grúa para retirar el vehículo
    C: Llamar a una agencia de aplicación de la ley para proporcionar información
    D: Esperar en la escena durante exactamente una hora antes de irse
  answer: C
  explanation: Si la colisión fue con un vehículo desatendido y no se puede localizar
    al propietario, debe llamar a una agencia de aplicación de la ley para proporcionar
    información.
- id: 264
  category: license_system
  question: Después de un accidente, ¿qué documento debe presentar electrónicamente
    su proveedor de seguros a la BMV para demostrar responsabilidad financiera?
  choices:
    A: Certificado de Cumplimiento (COC)
    B: Prueba de Responsabilidad (POL)
    C: Formulario de Informe de Accidente (ARF)
    D: Certificado de Registro del Vehículo (VRC)
  answer: A
  explanation: Su proveedor de seguros debe presentar electrónicamente una prueba
    de responsabilidad financiera en forma de un Certificado de Cumplimiento (COC).
- id: 265
  category: defensive_driving
  question: Si una colisión es inevitable, ¿cuál de las siguientes es la opción más
    segura para minimizar el impacto?
  choices:
    A: Golpear algo duro en lugar de algo que ceda
    B: Golpear algo que se mueva en la dirección opuesta
    C: Golpear algo que no se mueve en lugar de algo que se mueve en la misma dirección
    D: Golpear algo que se mueve en la misma dirección que usted en lugar de algo
      que no se mueve
  answer: D
  explanation: El manual aconseja golpear algo que se mueva en la misma dirección
    que usted en lugar de algo que no se mueve, y elegir golpear algo que ceda.
- id: 266
  category: safe_driving_rules
  question: ¿Cuál es la acción correcta a tomar si las ruedas de su vehículo se desvían
    hacia el arcén (acotamiento) de la carretera?
  choices:
    A: Girar el volante bruscamente hacia el pavimento
    B: Pisar los frenos a fondo para detenerse de inmediato
    C: Conducir por el arcén, soltar suavemente el pedal del acelerador y regresar
      a la carretera gradualmente
    D: Acelerar para reincorporarse de manera segura al tráfico
  answer: C
  explanation: Si sus ruedas se desvían hacia el arcén, no intente regresar de inmediato.
    En su lugar, conduzca por el arcén y suelte suavemente el pedal del acelerador.
    Después de reducir la velocidad, regrese a la carretera gradualmente.
- id: 267
  category: defensive_driving
  question: ¿Por qué NO debe intentar abrir una puerta si su vehículo cae al agua?
  choices:
    A: Causará que el sistema eléctrico haga cortocircuito de inmediato
    B: El peso del agua lo hará casi imposible, y el agua inundará el compartimiento
      de pasajeros
    C: Las cerraduras de las puertas se atascarán automáticamente
    D: Hará que el vehículo se hunda al instante
  answer: B
  explanation: El peso del agua hará que sea casi imposible abrir una puerta y el
    agua inundará el compartimiento de pasajeros a través de una puerta abierta.
- id: 268
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes comportamientos es una señal de que un conductor
    puede estar bajo los efectos del alcohol o drogas (impaired)?
  choices:
    A: Conducir ligeramente por debajo del límite de velocidad bajo lluvia intensa
    B: Hacer giros amplios y conducir sobre la línea central
    C: Usar las luces direccionales de manera constante
    D: Conducir con los faros encendidos durante el día
  answer: B
  explanation: Un conductor puede estar bajo los efectos del alcohol o drogas si el
    vehículo hace giros amplios, conduce sobre la línea central, zigzaguea o exhibe
    otros comportamientos erráticos.
- id: 269
  category: safe_driving_rules
  question: Si debe salir de su vehículo mientras está en el arcén de la carretera
    durante una emergencia, ¿cómo debe hacerlo?
  choices:
    A: Salir por el lado del conductor lo más rápido posible
    B: Salir por el lado del pasajero después de revisar las inmediaciones
    C: Salir por el techo corredizo para permanecer visible
    D: Esperar hasta que llegue un oficial de policía para abrir la puerta
  answer: B
  explanation: Si debe salir del vehículo mientras está en el arcén de la carretera,
    salga por el lado del pasajero y solo después de revisar las inmediaciones en
    busca de otros vehículos motorizados u obstrucciones.
- id: 270
  category: vehicle_information
  question: ¿Qué debe hacer si experimenta un reventón de llanta mientras conduce?
  choices:
    A: Pisar los frenos con firmeza y de inmediato
    B: Girar el volante bruscamente hacia la derecha
    C: Sostener el volante con firmeza, quitar el pie del pedal del acelerador y no
      pisar los frenos
    D: Cambiar a neutral y bombear los frenos
  answer: C
  explanation: En un reventón de llanta, sostenga el volante con firmeza y mantenga
    el automóvil en línea recta. Reduzca la velocidad gradualmente, quite el pie del
    pedal del acelerador, pero no pise los frenos hasta que esté casi detenido.
- id: 271
  category: vehicle_information
  question: ¿Qué es lo primero que debe hacer si los frenos convencionales de disco
    o de tambor de su vehículo fallan repentinamente?
  choices:
    A: Cambiar a una marcha más baja y bombear el pedal del freno rápida y fuertemente.
    B: Apagar el motor inmediatamente.
    C: Tirar del freno de mano hacia arriba lo más fuerte posible.
    D: Dirigirse hacia la zanja más cercana.
  answer: A
  explanation: Si sus frenos fallan repentinamente, debe cambiar a una marcha más
    baja, si es posible, y bombear el pedal del freno rápida y fuertemente varias
    veces para aumentar la presión de frenado.
- id: 272
  category: safe_driving_rules
  question: Si su vehículo queda averiado a menos de 500 pies de una curva o la cima
    de una colina donde la vista de un conductor pueda estar bloqueada, ¿dónde debe
    colocar el dispositivo de advertencia de emergencia?
  choices:
    A: A 100 pies de su vehículo.
    B: A 200 pies de su vehículo.
    C: Al menos a 500 pies de su vehículo.
    D: Directamente en el techo de su vehículo.
  answer: C
  explanation: Si su vehículo queda averiado a menos de 500 pies de una curva, la
    cima de una colina u otra área donde la vista de un conductor pueda estar bloqueada,
    coloque el dispositivo al menos a 500 pies de su vehículo.
- id: 273
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se hunde en el agua y necesita escapar?
  choices:
    A: Esperar a que el vehículo se llene completamente de agua antes de abrir la
      puerta.
    B: Quitarse el cinturón de seguridad, abrir una ventana y subir al techo.
    C: Recoger sus pertenencias de valor antes de salir.
    D: Nadar hacia la orilla inmediatamente, incluso si el personal de emergencia
      está llegando.
  answer: B
  explanation: Si su vehículo se hunde en el agua, quítese el cinturón de seguridad,
    abra una ventana, salga del vehículo y suba al techo. Nunca vuelva a entrar para
    recoger pertenencias, y nade hacia la orilla solo como último recurso.
- id: 274
  category: vehicle_information
  question: ¿Por qué nunca debe girar la llave de encendido a la posición de bloqueo
    (lock) mientras su vehículo está en movimiento?
  choices:
    A: Causará que el motor se sobrecaliente.
    B: Dañará permanentemente la transmisión.
    C: La dirección se bloqueará al girar el volante, causando la pérdida de control.
    D: Los frenos se bloquearán inmediatamente y causarán un derrape.
  answer: C
  explanation: Al operar un vehículo con un sistema de bloqueo del volante, girar
    el encendido a la posición de bloqueo mientras está en movimiento bloqueará la
    dirección al girar el volante, causando la pérdida de control del vehículo.
- id: 275
  category: safe_driving_rules
  question: Para ayudar a reducir las posibilidades de que le roben su vehículo, ¿cómo
    debe estacionarlo?
  choices:
    A: Con las ruedas delanteras giradas bruscamente hacia la izquierda.
    B: Con las ruedas delanteras giradas bruscamente hacia la derecha y el freno de
      emergencia puesto.
    C: Con las ventanas ligeramente abiertas para ventilación.
    D: Con el vehículo en punto muerto (neutral) y el freno de emergencia puesto.
  answer: B
  explanation: Para reducir las posibilidades de robo del vehículo, el manual recomienda
    estacionar con las ruedas delanteras giradas bruscamente hacia la derecha y aplicar
    el freno de emergencia.
- id: 276
  category: driver_responsibility
  question: ¿Cómo debe reconocer primero la presencia de un oficial de la ley cuando
    le piden que se detenga?
  choices:
    A: Encendiendo las luces de emergencia inmediatamente.
    B: Agitando la mano por la ventana.
    C: Encendiendo la luz direccional derecha.
    D: Tocando la bocina dos veces.
  answer: C
  explanation: Debe reconocer la presencia del oficial encendiendo su luz direccional
    derecha. Esto le permite al oficial saber que usted reconoce su presencia.
- id: 277
  category: safe_driving_rules
  question: Cuando un oficial de la ley le pida que se detenga en una autopista, ¿dónde
    debe detener su vehículo?
  choices:
    A: En el arcén (acotamiento) del lado derecho de la carretera.
    B: En la mediana central.
    C: En el carril de circulación más a la derecha.
    D: En el arcén (acotamiento) del lado izquierdo de la carretera.
  answer: A
  explanation: Debe mover su vehículo hacia el arcén del lado derecho de la carretera.
    No debe detenerse en la mediana central de una autopista, ya que esto pone en
    peligro tanto al conductor como al oficial.
- id: 278
  category: safe_driving_rules
  question: Si un oficial de la ley lo detiene de noche, ¿qué se le recomienda hacer?
  choices:
    A: Apagar los faros delanteros.
    B: Encender las luces altas.
    C: Encender la luz interior del vehículo.
    D: Salir del vehículo para que el oficial pueda verlo.
  answer: C
  explanation: Si lo detienen de noche, se le recomienda encender la luz interior
    del vehículo y buscar lugares bien iluminados para detenerse.
- id: 279
  category: safe_driving_rules
  question: ¿Qué debe hacer si no puede encontrar inmediatamente un lugar seguro para
    detenerse durante una parada de tráfico?
  choices:
    A: Mantener su velocidad hasta que aparezca un área segura.
    B: Reducir la velocidad y encender las luces de emergencia.
    C: Detenerse en medio del carril de circulación.
    D: Acelerar para llegar más rápido a la siguiente salida.
  answer: B
  explanation: Si no puede encontrar un lugar seguro inmediatamente, reduzca la velocidad
    y encienda las luces de emergencia. Esto le indica al oficial que usted reconoce
    su presencia y está intentando activamente encontrar un lugar seguro para detenerse.
- id: 280
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿dónde deben mantener las manos el conductor
    y los pasajeros?
  choices:
    A: El conductor debe mantener las manos en el volante y las manos de los pasajeros
      deben estar visibles en sus regazos.
    B: Todos deben mantener las manos en alto.
    C: Las manos deben mantenerse en los bolsillos o fuera de la vista.
    D: El conductor debe alcanzar la guantera inmediatamente.
  answer: A
  explanation: El conductor debe mantener las manos en el volante y las manos de los
    pasajeros deben estar visibles en sus regazos. La incapacidad de ver las manos
    puede hacer que el oficial se sienta amenazado.
- id: 281
  category: driver_responsibility
  question: Si su comprobante de seguro está guardado en su teléfono celular durante
    una parada de tráfico, ¿qué debe hacer?
  choices:
    A: Agarrar rápidamente su teléfono antes de que el oficial se acerque.
    B: Entregar el teléfono por la ventana mientras el oficial se acerca.
    C: Informar primero al oficial de policía de ese hecho, y luego seguir sus instrucciones
      antes de buscarlo.
    D: Negarse a mostrarlo, ya que los oficiales no pueden mirar los teléfonos celulares.
  answer: C
  explanation: Si el comprobante de seguro está guardado en un teléfono celular, primero
    debe informar al oficial de policía de ese hecho y luego seguir las instrucciones
    del oficial antes de alcanzar o buscar la información.
- id: 282
  category: penalties_and_points
  question: ¿Qué significa firmar una multa de tráfico emitida por un oficial de policía?
  choices:
    A: Es una admisión de su culpabilidad.
    B: Renuncia a su derecho a un juicio en el tribunal de tráfico.
    C: Es solo un acuse de recibo de la multa.
    D: Significa que está de acuerdo con el motivo de la parada.
  answer: C
  explanation: Firmar una multa no es una admisión de la culpabilidad del conductor,
    sino solo un acuse de recibo de la multa.
- id: 283
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de intoxicación por monóxido de
    carbono?
  choices:
    A: Un fuerte olor a escape en la cabina.
    B: Mayor sensibilidad a la luz.
    C: Un repentino aumento de energía.
    D: Un tono rojizo en la piel o los labios.
  answer: B
  explanation: Los síntomas de intoxicación por monóxido de carbono pueden incluir
    somnolencia o mareos, un tono azulado en la piel o los labios, dolor de cabeza
    y mayor sensibilidad a la luz. No se puede ver, oler ni saborear el monóxido de
    carbono.
- id: 284
  category: safe_driving_rules
  question: ¿Cómo puede ayudar a evitar la intoxicación por monóxido de carbono al
    conducir en tráfico congestionado?
  choices:
    A: Abrir todas las ventanas por completo.
    B: Encender la calefacción del vehículo al máximo.
    C: Cerrar la ventilación de aire fresco.
    D: Abrir la ventilación de aire fresco.
  answer: C
  explanation: Para evitar la intoxicación por monóxido de carbono en tráfico congestionado,
    debe cerrar la ventilación de aire fresco para no inhalar los gases de escape
    de otros vehículos.
- id: 285
  category: signs_and_signals
  question: Según las reglas de tráfico del manual, ¿cuándo se puede hacer un giro
    legal a la izquierda con el semáforo en rojo?
  choices:
    A: Cuando no hay otros vehículos presentes.
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido.
    C: Cuando otro conductor toca la bocina.
    D: Nunca.
  answer: B
  explanation: Se puede hacer un giro legal a la izquierda con el semáforo en rojo
    cuando el conductor gira desde una calle de un solo sentido hacia otra calle de
    un solo sentido.
- id: 286
  category: sharing_the_road
  question: ¿Qué distancia puede necesitar para detenerse un camión con remolque (tractor-trailer)
    completamente cargado, con los frenos calientes y viajando a 55 mph?
  choices:
    A: 50 pies o más.
    B: 100 pies o más.
    C: 200 pies o más.
    D: 400 pies o más.
  answer: D
  explanation: Un camión con remolque completamente cargado, con los frenos calientes
    y viajando a cincuenta y cinco (55) mph, puede necesitar 400 pies o más para detenerse.
- id: 287
  category: safe_driving_rules
  question: Según la ley de Indiana, ¿durante qué período de tiempo debe un vehículo
    tener los faros encendidos?
  choices:
    A: Entre el atardecer y el amanecer cuando la visibilidad es menor a 500 pies.
    B: Entre las 6:30 p.m. y las 6:30 a.m.
    C: Siempre que el conductor esté cansado.
    D: Solo al conducir en caminos rurales sin iluminación.
  answer: A
  explanation: La ley de Indiana requiere que un vehículo tenga los faros encendidos
    entre el atardecer y el amanecer cuando la visibilidad es menor a 500 pies.
- id: 288
  category: safe_driving_rules
  question: Si la calle desde la que va a girar tiene más de un carril, ¿desde qué
    carril debe girar?
  choices:
    A: El carril central.
    B: El carril más alejado de la dirección en la que va a girar.
    C: El carril más cercano a la dirección en la que va a girar.
    D: Cualquier carril siempre y cuando use su señal de giro.
  answer: C
  explanation: Si gira desde una calle con más de un carril, debe girar desde el carril
    más cercano a la dirección en la que va a girar.
- id: 289
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    una carretera estatal rural dividida?
  choices:
    A: 50 millas por hora
    B: 55 millas por hora
    C: 60 millas por hora
    D: 65 millas por hora
  answer: C
  explanation: A menos que se indique lo contrario, el límite de velocidad en una
    carretera estatal rural dividida es de 60 millas por hora.
- id: 290
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    para un vehículo de pasajeros en una autopista interestatal ubicada fuera de un
    área urbanizada?
  choices:
    A: 55 millas por hora
    B: 60 millas por hora
    C: 65 millas por hora
    D: 70 millas por hora
  answer: D
  explanation: El límite de velocidad máximo para un vehículo de pasajeros en una
    autopista interestatal ubicada fuera de un área urbanizada es de 70 millas por
    hora, a menos que se indique lo contrario.
- id: 291
  category: safe_driving_rules
  question: Al conducir de noche, ¿a qué distancia debe usar las luces bajas al seguir
    a otro vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Al conducir de noche, se deben usar las luces bajas al seguir a un
    vehículo a menos de 200 pies de distancia.
- id: 292
  category: safe_driving_rules
  question: Al conducir de noche, ¿a qué distancia se deben usar las luces bajas al
    acercarse al tráfico en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Se deben usar las luces bajas al acercarse al tráfico en sentido contrario
    a menos de 500 pies de distancia.
- id: 293
  category: defensive_driving
  question: ¿Qué debe hacer en caso de una llanta desinflada o un reventón de llanta?
  choices:
    A: Aplicar los frenos de inmediato
    B: Sostener el volante con firmeza y mantener el vehículo en línea recta
    C: Aumentar la velocidad de conducción
    D: Continuar conduciendo sobre el rin (aro) hasta llegar a su destino
  answer: B
  explanation: En caso de una llanta desinflada o un reventón de llanta, debe sostener
    el volante con firmeza y mantener el vehículo en línea recta.
- id: 294
  category: license_system
  question: Si transporta bienes por contrato con un endoso de transporte de alquiler
    (for-hire endorsement), ¿cuál es el límite de peso bruto del vehículo?
  choices:
    A: No debe exceder las 16,000 libras
    B: No debe exceder las 26,000 libras
    C: Debe exceder las 26,000 libras
    D: Debe exceder las 28,000 libras
  answer: B
  explanation: Al transportar bienes por contrato con un endoso de transporte de alquiler,
    el peso bruto del vehículo no debe exceder las 26,000 libras.
- id: 295
  category: safe_driving_rules
  question: ¿A cuántos pies de las vías del tren deben detenerse los vehículos que
    transportan pasajeros por contrato (de alquiler)?
  choices:
    A: De 5 a 45 pies
    B: De 10 a 40 pies
    C: De 15 a 50 pies
    D: De 20 a 60 pies
  answer: C
  explanation: Los vehículos que transportan pasajeros por contrato deben detenerse
    a una distancia de entre 15 y 50 pies de las vías del tren.
- id: 296
  category: vehicle_information
  question: ¿Cuál de los siguientes es un dispositivo de advertencia aceptable para
    un camión, autobús o camión con remolque que queda averiado en una vía transitada
    o en su arcén (hombro)?
  choices:
    A: Tres triángulos reflectantes de emergencia bidireccionales que cumplan con
      las normas federales
    B: Tres bengalas de combustible líquido
    C: Al menos seis bengalas (fusees)
    D: Todas las respuestas son correctas
  answer: D
  explanation: Los dispositivos de advertencia aceptables para un camión, autobús
    o camión con remolque averiado incluyen tres triángulos reflectantes de emergencia
    bidireccionales que cumplan con las normas federales, tres bengalas de combustible
    líquido o al menos seis bengalas (fusees). Por lo tanto, todas las respuestas
    son correctas.
- id: 297
  category: signs_and_signals
  question: Cuando un oficial de la ley está dirigiendo el tráfico y su orden es diferente
    a la de un semáforo o señal de tráfico, ¿qué debe hacer?
  choices:
    A: Obedecer la señal de tráfico o el semáforo
    B: Obedecer la orden del oficial
    C: Continuar sin reducir la velocidad
    D: Enviar una alerta en las redes sociales
  answer: B
  explanation: Cuando un oficial de la ley está dirigiendo el tráfico, debe obedecer
    la orden del oficial, incluso si es diferente a la de un semáforo o señal de tráfico.
- id: 298
  category: license_system
  question: Al solicitar una nueva licencia de conducir, ¿cuántos documentos que comprueben
    su residencia en Indiana debe presentar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para obtener una nueva licencia de conducir, permiso de aprendizaje
    o tarjeta de identificación, debe presentar dos documentos que comprueben su residencia
    en Indiana.
- id: 299
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para comprobar su número
    de Seguro Social?
  choices:
    A: Una factura de servicios públicos
    B: Un formulario W-2
    C: Un estado de cuenta bancario
    D: Una tarjeta de registro de votante de Indiana
  answer: B
  explanation: Según el manual, los documentos que contienen su nombre y número de
    Seguro Social completo que califican incluyen una tarjeta de Seguro Social, un
    formulario W-2, un formulario 1099, un formulario 1099 que no sea de la SSA o
    un talón de pago preimpreso.
- id: 300
  category: license_system
  question: ¿Qué tan reciente debe ser una factura generada por computadora de una
    compañía de servicios públicos para comprobar la residencia en Indiana?
  choices:
    A: Emitida dentro de los 30 días previos a la fecha de solicitud
    B: Emitida dentro de los 60 días previos a la fecha de solicitud
    C: Emitida dentro de los 90 días previos a la fecha de solicitud
    D: Emitida dentro de un año previo a la fecha de solicitud
  answer: B
  explanation: El manual establece que una factura generada por computadora de una
    compañía de servicios públicos debe haber sido emitida dentro de los 60 días previos
    a la fecha de solicitud y contener su nombre y dirección residencial.
- id: 301
  category: license_system
  question: ¿Bajo qué condición se puede usar un apartado postal como dirección residencial
    para los documentos de la BMV?
  choices:
    A: Si el solicitante recibe todo su correo allí
    B: Si el solicitante no tiene hogar
    C: Si el solicitante está inscrito en el Programa de Confidencialidad de Direcciones
      del Fiscal General de Indiana
    D: Los apartados postales nunca se pueden usar bajo ninguna circunstancia
  answer: C
  explanation: Los apartados postales no se pueden usar como dirección residencial,
    a menos que el solicitante esté inscrito en el Programa de Confidencialidad de
    Direcciones del Fiscal General de Indiana.
- id: 302
  category: license_system
  question: Si vive con un familiar o amigo y no puede proporcionar dos documentos
    que prueben su residencia, ¿qué debe hacer el familiar o amigo?
  choices:
    A: Firmar una Declaración Jurada de Residencia de Indiana en una sucursal de la
      BMV
    B: Proporcionar su propia tarjeta de Seguro Social
    C: Escribir una carta en papel membretado oficial
    D: Pagar una tarifa de verificación de residencia
  answer: A
  explanation: Si vive con un familiar o amigo, el familiar o amigo con el que vive
    debe firmar una Declaración Jurada de Residencia de Indiana en una sucursal de
    la BMV.
- id: 303
  category: license_system
  question: ¿Qué se requiere si presenta un documento a la BMV que está en un idioma
    distinto al inglés?
  choices:
    A: Una traducción verbal por parte de un familiar en la sucursal
    B: Una traducción completa escrita a máquina en papel membretado de una entidad
      aprobada
    C: Una copia notariada del documento original
    D: Una traducción proporcionada por un amigo
  answer: B
  explanation: La traducción debe estar escrita a máquina en una página separada en
    papel membretado de una entidad gubernamental, institución educativa acreditada
    o agencia de traducción.
- id: 304
  category: license_system
  question: ¿A quién se le prohíbe explícitamente traducir un documento para su solicitud
    de la BMV?
  choices:
    A: A una entidad gubernamental
    B: A una institución educativa acreditada
    C: A una agencia de traducción
    D: A un familiar, amigo o socio comercial
  answer: D
  explanation: El traductor debe declarar que el documento no ha sido traducido para
    un familiar, amigo o socio comercial.
- id: 305
  category: defensive_driving
  question: Según el manual, ¿cuál es el factor contribuyente más común en los choques
    de adolescentes?
  choices:
    A: El exceso de velocidad
    B: La conducción errática y riesgosa y la distracción
    C: Conducir con otros adolescentes
    D: No usar el cinturón de seguridad
  answer: B
  explanation: El manual establece que la conducción errática y riesgosa y la distracción
    son el factor contribuyente más común en los choques de adolescentes.
- id: 306
  category: defensive_driving
  question: ¿Qué sucede con la probabilidad de un choque cuando un conductor adolescente
    lleva pasajeros en el vehículo?
  choices:
    A: Disminuye ligeramente debido a que hay más ojos observando
    B: Sigue siendo la misma que al conducir solo
    C: Se duplica con cada pasajero presente
    D: Se triplica con cada pasajero presente
  answer: C
  explanation: La probabilidad de un choque se duplica con cada pasajero presente
    en el vehículo.
- id: 307
  category: safe_driving_rules
  question: ¿Dónde ocurren la mayoría de los choques de múltiples vehículos que involucran
    a adolescentes?
  choices:
    A: En las autopistas
    B: En los estacionamientos
    C: En las intersecciones
    D: En caminos rurales
  answer: C
  explanation: La mayoría de los choques de múltiples vehículos que involucran a adolescentes
    ocurren en las intersecciones. Los conductores adolescentes deben estar libres
    de distracciones y concentrados en otros vehículos en las intersecciones.
- id: 308
  category: safe_driving_rules
  question: ¿Por qué el manual aconseja no escuchar música a un volumen alto mientras
    se conduce?
  choices:
    A: Agota la batería del vehículo
    B: Es ilegal en el estado de Indiana
    C: Podría no escuchar una sirena o una bocina
    D: Hace que el conductor exceda el límite de velocidad
  answer: C
  explanation: No escuche música a un volumen alto. Podría no escuchar una sirena
    o una bocina que podría advertirle de un posible problema.
- id: 309
  category: defensive_driving
  question: ¿Cuál es un factor contribuyente común en los choques de un solo vehículo
    que involucran a adolescentes?
  choices:
    A: La falta de atención
    B: El exceso de velocidad
    C: Conducir con otros adolescentes
    D: Ajustar la radio
  answer: B
  explanation: El exceso de velocidad. La velocidad ilegal o insegura es un factor
    contribuyente común en los choques de un solo vehículo.
- id: 310
  category: license_system
  question: Si no califica para obtener un número de Seguro Social, ¿qué documento
    se le puede pedir que proporcione en su lugar?
  choices:
    A: Un formulario I-94 válido
    B: Un formulario W-2
    C: Un formulario 1099
    D: Una tarjeta de registro de votante de Indiana
  answer: A
  explanation: Si no está autorizado para trabajar en los Estados Unidos, se le puede
    pedir que proporcione un formulario I-94 válido en lugar de un número de Seguro
    Social.
- id: 311
  category: license_system
  question: ¿Qué antigüedad debe tener una póliza de seguro de propietario, inquilino
    o vehículo de motor para calificar como prueba de residencia en Indiana?
  choices:
    A: Fechada dentro de los 30 días previos a la fecha de solicitud
    B: Fechada dentro de los 60 días previos a la fecha de solicitud
    C: Fechada dentro de los 90 días previos a la fecha de solicitud
    D: Fechada dentro de un año previo a la fecha de solicitud
  answer: D
  explanation: Una póliza de seguro de propietario, inquilino o vehículo de motor
    actual y válida que muestre su nombre y dirección residencial debe estar fechada
    dentro de un año previo a la fecha de solicitud.
- id: 312
  category: license_system
  question: ¿Qué debe proporcionar un solicitante sin hogar junto con una Declaración
    Jurada de Residencia de Indiana?
  choices:
    A: Un formulario W-2
    B: Una carta con membrete de la entidad gubernamental u organización sin fines
      de lucro que brinda los servicios
    C: Prueba de pago de impuestos sobre la renta de Indiana
    D: Un permiso válido para portar armas de fuego de Indiana
  answer: B
  explanation: Los solicitantes sin hogar deben proporcionar una carta de la entidad
    gubernamental u organización sin fines de lucro en su papel membretado que muestre
    su nombre, dirección y número de teléfono, y que muestre el nombre, la firma y
    la fecha de la firma del representante legal.
- id: 313
  category: driver_responsibility
  question: ¿Cuándo es el mejor momento para ajustar sus asientos y espejos?
  choices:
    A: Mientras está detenido en un semáforo en rojo
    B: Antes de comenzar cada viaje
    C: Mientras conduce a baja velocidad
    D: Solo cuando conduce un vehículo nuevo
  answer: B
  explanation: El manual aconseja ajustar siempre sus asientos y espejos para obtener
    la mejor visibilidad antes de comenzar cada viaje.
- id: 314
  category: safe_driving_rules
  question: ¿Por qué debería esperar hasta que su vehículo esté detenido antes de
    ajustar su radio?
  choices:
    A: Agota la batería del automóvil si el vehículo está en movimiento.
    B: Apartar la atención de la carretera, incluso por unos segundos, podría provocar
      una colisión.
    C: La señal de radio es más débil mientras el vehículo está en movimiento.
    D: Es ilegal tocar la radio mientras se conduce en Indiana.
  answer: B
  explanation: El manual indica que es mejor esperar hasta estar detenido para ajustar
    su radio porque apartar la atención de la carretera, incluso por unos segundos,
    podría provocar una colisión.
- id: 315
  category: safe_driving_rules
  question: ¿Cuál es un peligro potencial de escuchar música a un volumen alto mientras
    conduce?
  choices:
    A: Podría no escuchar una sirena o una bocina que podría advertirle de un posible
      problema.
    B: Puede dañar el sistema eléctrico del vehículo con el tiempo.
    C: Hace que el conductor conduzca inconscientemente más rápido que el límite de
      velocidad.
    D: Se considera una infracción por ruido y es un delito grave.
  answer: A
  explanation: Según el manual, no debe escuchar música a un volumen alto porque podría
    no escuchar una sirena o una bocina que podría advertirle de un posible problema.
- id: 316
  category: safe_driving_rules
  question: ¿Cuál de las siguientes actividades se indica explícitamente que es ilegal
    mientras se conduce?
  choices:
    A: Ajustar la radio.
    B: Hablar por teléfono o enviar mensajes de texto.
    C: Comer.
    D: Peinarse.
  answer: B
  explanation: 'El manual establece explícitamente: "No hable por teléfono ni envíe
    mensajes de texto mientras conduce, es ilegal".'
- id: 317
  category: alcohol_drugs_health
  question: ¿Qué efecto pueden tener algunos medicamentos de venta libre en su conducción?
  choices:
    A: Pueden mejorar su tiempo de reacción.
    B: Pueden causarle somnolencia.
    C: Aumentan su agudeza visual.
    D: No tienen ningún efecto sobre la capacidad de conducción.
  answer: B
  explanation: El manual advierte a los conductores que no conduzcan bajo la influencia,
    señalando que "Incluso algunos medicamentos de venta libre pueden causarle somnolencia".
- id: 318
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca a una intersección y la luz verde cambia
    a amarilla?
  choices:
    A: Acelerar para atravesar la intersección antes de que cambie a rojo.
    B: Ingresar a la intersección con precaución y ceder el paso al tráfico transversal.
    C: No debe ingresar a la intersección después de que la luz cambie a amarilla
      a menos que ya esté dentro de ella.
    D: Detenerse inmediatamente, incluso si ya está en el medio de la intersección.
  answer: C
  explanation: 'El manual establece: "A menos que ya esté en una intersección cuando
    la luz cambie a amarilla, no debe ingresar a la intersección después de que la
    luz cambie a amarilla".'
- id: 319
  category: safe_driving_rules
  question: ¿Por qué es importante obedecer el límite de velocidad?
  choices:
    A: Ir demasiado rápido aumenta la eficiencia de combustible de su vehículo.
    B: Ir demasiado rápido le da menos tiempo para detenerse o reaccionar.
    C: Evita el desgaste excesivo de sus neumáticos.
    D: Garantiza que no encontrará semáforos en amarillo.
  answer: B
  explanation: 'El manual establece: "Obedezca el límite de velocidad. Ir demasiado
    rápido le da menos tiempo para detenerse o reaccionar".'
- id: 320
  category: driver_responsibility
  question: Al elegir un vehículo para un conductor adolescente, ¿qué deben priorizar
    los padres?
  choices:
    A: La imagen y el estilo del vehículo.
    B: Las capacidades de velocidad máxima del vehículo.
    C: La seguridad.
    D: El sistema de audio y entretenimiento del vehículo.
  answer: C
  explanation: La sección "Consejos para padres de adolescentes" aconseja a los padres
    "Elegir vehículos por seguridad, no por imagen".
- id: 321
  category: driver_responsibility
  question: ¿Qué estrategia se recomienda para los padres a medida que su conductor
    adolescente adquiere experiencia y demuestra tomar decisiones adecuadas?
  choices:
    A: Otorgar privilegios de conducir sin restricciones de inmediato.
    B: Desarrollar una estrategia de privilegios progresivos.
    C: Revocar el permiso de aprendizaje para evaluar sus conocimientos.
    D: Disminuir la cantidad de tiempo de práctica de manejo supervisada.
  answer: B
  explanation: El manual recomienda desarrollar una estrategia de privilegios progresivos,
    permitiendo que el adolescente avance a un nivel superior de responsabilidad al
    conducir a medida que adquiere experiencia.
- id: 322
  category: vehicle_information
  question: ¿Cuál es el requisito de edad para usar un casco aprobado por el DOT al
    operar o viajar en un vehículo todoterreno (ORV)?
  choices:
    A: Cualquier persona menor de 16 años.
    B: Cualquier persona menor de 18 años.
    C: Cualquier persona menor de 21 años.
    D: Todos los pasajeros, independientemente de su edad.
  answer: B
  explanation: 'El manual establece: "Cualquier persona menor de 18 años que opere
    o viaje en un vehículo todoterreno (ORV) debe usar un casco que cumpla con los
    estándares establecidos por el Departamento de Transporte de los Estados Unidos
    (DOT)".'
- id: 323
  category: driver_responsibility
  question: Si usted es propietario de un vehículo todoterreno (ORV), ¿qué se le prohíbe
    hacer con respecto a los menores?
  choices:
    A: Permitir a sabiendas que una persona menor de 18 años opere el ORV sin un casco
      aprobado por el DOT.
    B: Permitir que una persona menor de 18 años viaje en el ORV en propiedad privada
      bajo cualquier circunstancia.
    C: Vender el ORV a cualquier persona menor de 21 años.
    D: Permitir que una persona menor de 16 años realice el mantenimiento del ORV.
  answer: A
  explanation: El propietario o poseedor de un ORV no puede autorizar ni permitir
    a sabiendas que una persona menor de 18 años opere el ORV sin usar un casco aprobado
    por el DOT.
- id: 324
  category: license_system
  question: ¿Cuándo puede una persona elegible solicitar registrarse para votar a
    través de la BMV?
  choices:
    A: Solo al obtener una credencial completamente nueva.
    B: Solo durante un año de elecciones presidenciales.
    C: Al obtener una credencial nueva, renovada, de reemplazo o modificada.
    D: Solo al visitar una sucursal física de la BMV en persona.
  answer: C
  explanation: 'El manual establece: "Cualquier persona que obtenga una credencial
    nueva, renovada, de reemplazo o modificada también puede solicitar registrarse
    para votar si es elegible para hacerlo".'
- id: 325
  category: license_system
  question: La ley de Indiana exige que la BMV envíe información al sistema del Servicio
    Selectivo (Selective Service system) ¿para qué grupo de personas que obtienen
    una licencia de conducir nueva o renovada?
  choices:
    A: Todas las personas menores de 18 años.
    B: Hombres menores de 26 años.
    C: Mujeres menores de 26 años.
    D: Todas las personas mayores de 18 años.
  answer: B
  explanation: La BMV está obligada a enviar la información necesaria para registrar
    a los hombres menores de 26 años en el sistema del Servicio Selectivo al obtener
    una licencia de conducir nueva o renovada.
- id: 326
  category: penalties_and_points
  question: ¿Cuál es la sanción por no registrarse en el sistema del Servicio Selectivo
    cuando es obligatorio?
  choices:
    A: Un delito menor castigado con una multa de $500.
    B: Un delito grave castigado con hasta cinco años de prisión y una multa de $250,000.
    C: Suspensión inmediata de los privilegios de conducir por un año.
    D: Una advertencia por escrito y una comparecencia obligatoria ante el tribunal.
  answer: B
  explanation: Según el manual, no registrarse en el sistema del Servicio Selectivo
    es un delito grave y se castiga con hasta cinco años de prisión y una multa de
    $250,000.
- id: 327
  category: vehicle_information
  question: Aproximadamente, ¿cuánto tiempo tardan en llegar por correo las placas
    y calcomanías después de renovar el registro de su vehículo?
  choices:
    A: 7 días
    B: 14 días
    C: 21 días
    D: 30 días
  answer: C
  explanation: El manual indica repetidamente en los diferentes métodos de renovación
    (en línea, por teléfono, por correo) que "Las placas y calcomanías llegan en aproximadamente
    21 días".
- id: 328
  category: vehicle_information
  question: ¿Cuál de las siguientes opciones NO se menciona como una forma conveniente
    de renovar el registro de su vehículo a través de la BMV?
  choices:
    A: Visitar un quiosco BMV Connect.
    B: Renovar por teléfono.
    C: Renovar por correo.
    D: Renovar a través de una aplicación móvil de terceros.
  answer: D
  explanation: 'La BMV ofrece cuatro formas de renovar: en línea (IN.gov/BMV), por
    teléfono, en un quiosco BMV Connect o por correo. Las aplicaciones móviles de
    terceros no se mencionan como una opción.'
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) octagonal y roja significa que debe detenerse
    por completo en la línea de alto, en el cruce peatonal o antes de ingresar a la
    intersección. Verifique si hay tráfico y peatones antes de continuar.
  id: 329
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 330
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: Prohibido estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe ingresar a la calle o rampa donde está colocada. Por lo general, se ve en
    las rampas de salida de las autopistas o en calles de un solo sentido donde entrar
    lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 331
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que viaja en contra del tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 332
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de autopista a la izquierda
  answer: B
  explanation: Una señal en blanco y negro de UN SOLO SENTIDO (ONE WAY) con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección — la dirección
    que señala la flecha.
  id: 333
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 334
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Ir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 335
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 336
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido rebasar.
  id: 337
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye a hacer esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un separador u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 338
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 339
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 340
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminar cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte sobre un cruce de peatones más adelante. Esté preparado para detenerse
    ante los peatones que cruzan la calle.
  id: 341
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de color amarillo verdoso fluorescente en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 342
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no adelantar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 343
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 344
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La calle termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva hacia la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 345
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa solo girar a la derecha
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 346
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera se curve
    primero hacia un lado y luego hacia el otro.
  id: 347
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a las condiciones cambiantes
    de la carretera.
  id: 348
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una carretera dividida
    D: Una carretera que se estrecha a un carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 349
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: Fin de carril
    D: Fin de carretera dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la carretera y
    ajuste la posición de su carril.
  id: 350
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una carretera dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    carretera dividida con una mediana (camellón) o barrera que separa el tráfico
    en sentido contrario. Manténgase a la derecha.
  id: 351
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: La carretera dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la carretera dividida termina. El tráfico en
    sentido contrario ya no estará separado por una mediana. Prepárese para el tráfico
    de doble sentido.
  id: 352
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Una zona de rebase más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una carretera dividida
    y se encontrará con vehículos que viajan en dirección opuesta.
  id: 353
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera helada
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 354
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un tope (resalto) en la carretera
    B: Una superficie de carretera irregular
    C: Una colina empinada o pendiente más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina empinada o pendiente más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 355
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 356
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto donde debe detenerse
    D: Un tope (reductor de velocidad)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 357
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce peatonal
  answer: B
  explanation: Esta señal advierte que hay un cruce o una intersección de 4 vías más
    adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 358
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 359
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril termina
    C: Se agrega un nuevo carril — no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra por la rampa
    tiene su propio carril nuevo.
  id: 360
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Parar o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 361
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: A cualquier persona por menos de 15 minutos
    B: Solo a personas de la tercera edad
    C: Solo a vehículos que muestren un cartel o placa de discapacidad válido
    D: A cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de una silla de ruedas indica estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de matrícula de estacionamiento para discapacitados válido pueden
    estacionar en estos espacios. Las infracciones conllevan multas severas.
  id: 362
