questions:
- id: 1
  category: license_system
  question: ¿En Iowa, cuál es la edad mínima para solicitar un permiso de instrucción?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: A
  explanation: Según el Manual del Conductor de Iowa, una persona debe tener al menos
    14 años de edad para ser elegible para un permiso de instrucción.
- id: 2
  category: license_system
  question: Bajo el sistema de Licencia de Conducir Graduada (GDL) de Iowa, ¿cuánto
    tiempo debe un menor mantener un permiso de instrucción antes de ser elegible
    para una licencia intermedia?
  choices:
    A: 6 meses consecutivos
    B: 9 meses consecutivos
    C: 12 meses consecutivos
    D: 18 meses consecutivos
  answer: C
  explanation: La ley de Iowa exige que los conductores menores de 18 años mantengan
    un permiso de instrucción durante al menos 12 meses consecutivos y permanezcan
    libres de accidentes e infracciones antes de pasar a una licencia intermedia.
- id: 3
  category: license_system
  question: Durante los primeros seis meses de tener una licencia intermedia de Iowa,
    ¿cuántos pasajeros menores de 18 años que no sean familiares están permitidos
    en el vehículo?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante los primeros seis meses de tener una licencia intermedia, el
    conductor está limitado a un solo pasajero menor de 18 años que no sea familiar,
    a menos que un padre o tutor renuncie a esta restricción.
- id: 4
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para una Licencia Escolar para Menores
    (MSL) de Iowa?
  choices:
    A: 14 años
    B: 14 años y medio
    C: 15 años
    D: 16 años
  answer: B
  explanation: Para ser elegible para una Licencia Escolar para Menores en Iowa, el
    estudiante debe tener al menos 14 años y medio y cumplir con requisitos específicos
    de la escuela y de residencia.
- id: 5
  category: license_system
  question: Si se muda a una nueva residencia dentro de Iowa, ¿cuántos días tiene
    para notificar al DOT sobre su cambio de dirección?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Iowa exige que notifique al DOT sobre un cambio de dirección
    dentro de los 30 días posteriores a la mudanza.
- id: 6
  category: license_system
  question: Para obtener una licencia intermedia de Iowa, ¿cuántas horas de conducción
    supervisada deben completarse y registrarse mientras se tiene un permiso?
  choices:
    A: 15 horas, 2 de las cuales deben ser nocturnas
    B: 20 horas, 2 de las cuales deben ser nocturnas
    C: 30 horas, 5 de las cuales deben ser nocturnas
    D: 40 horas, 10 de las cuales deben ser nocturnas
  answer: B
  explanation: Los requisitos de la GDL de Iowa establecen que el titular de un permiso
    debe completar 20 horas de conducción supervisada, incluyendo al menos 2 horas
    de conducción nocturna, antes de solicitar una licencia intermedia.
- id: 7
  category: license_system
  question: En Iowa, ¿cuál es el límite de concentración de alcohol en sangre (BAC)
    para conductores menores de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Iowa tiene una ley de 'tolerancia cero' para menores. Si se descubre
    a un conductor menor de 21 años con un BAC de 0.02% o superior, se le revocarán
    sus privilegios de conducción.
- id: 8
  category: license_system
  question: ¿Cuál es el requisito de visión estándar para obtener una licencia de
    conducir de Iowa sin restricciones?
  choices:
    A: 20/20 en ambos ojos
    B: 20/30 en al menos un ojo
    C: 20/40 en al menos un ojo
    D: 20/50 en ambos ojos
  answer: C
  explanation: Iowa requiere una visión mínima de 20/40 en al menos un ojo, con o
    sin lentes correctivos, para una licencia estándar no comercial.
- id: 9
  category: license_system
  question: Según la ley de Iowa, ¿se considera a una persona como 'infractor habitual'
    si es condenada por cuántas infracciones de tránsito 'graves' dentro de un período
    de 12 meses?
  choices:
    A: Dos
    B: Tres
    C: Cinco
    D: Seis
  answer: B
  explanation: Iowa puede suspender la licencia de un 'infractor habitual', que se
    define como un conductor condenado por tres o más infracciones de tránsito rastreables
    por el servicio dentro de cualquier período de 12 meses.
- id: 10
  category: license_system
  question: ¿Cuáles son las horas de conducción restringidas (toque de queda) para
    un conductor con una licencia intermedia de Iowa?
  choices:
    A: 10:00 PM a 6:00 AM
    B: 11:00 PM a 5:00 AM
    C: 12:00 AM a 6:00 AM
    D: 12:30 AM a 5:00 AM
  answer: D
  explanation: Los conductores con una licencia intermedia de Iowa no pueden conducir
    entre las 12:30 AM y las 5:00 AM a menos que tengan una exención por escuela o
    trabajo, o estén acompañados por un adulto designado.
- id: 11
  category: license_system
  question: Si usted es residente de Iowa y compra un vehículo, ¿cuántos días tiene
    para registrarlo?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: La ley de Iowa exige que registre su vehículo dentro de los 30 días
    a partir de la fecha en que se compró el vehículo o se trasladó al estado.
- id: 12
  category: license_system
  question: Al conducir con un permiso de instrucción en Iowa, ¿quién debe estar en
    el asiento del pasajero delantero?
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Un padre, tutor o familiar directo con licencia mayor de 21 años, u otro adulto
      con licencia mayor de 25 años
    C: Un padre/tutor con licencia, o una persona de al menos 21 años con permiso
      por escrito de un padre/tutor
    D: Cualquier persona con al menos 5 años de experiencia en la conducción
  answer: C
  explanation: El supervisor debe ser un padre/tutor con licencia, o un familiar con
    licencia de al menos 21 años, u otro adulto con licencia de al menos 21 años con
    permiso por escrito del padre/tutor.
- id: 13
  category: license_system
  question: En Iowa, si es menor de 18 años y recibe una condena por una infracción
    de tránsito (moving violation) mientras tiene una licencia intermedia, ¿cuál es
    la consecuencia obligatoria?
  choices:
    A: Suspensión inmediata de 1 año
    B: Requisito de reiniciar el período de 12 meses sin infracciones
    C: Sentencia de cárcel obligatoria de 30 días
    D: Revocación permanente de la licencia
  answer: B
  explanation: Bajo el sistema de licencia de conducir graduada (GDL), cualquier condena
    por una infracción de tránsito o estar involucrado en un accidente con responsabilidad
    requiere que el conductor reinicie el período de 12 meses sin infracciones antes
    de poder pasar a la siguiente etapa de la licencia.
- id: 14
  category: license_system
  question: ¿Por cuántos años es válida una licencia de conducir estándar de Iowa
    si el conductor tiene entre 18 y 72 años?
  choices:
    A: 2 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Para la mayoría de los conductores entre las edades de 18 y 72 años,
    la licencia de conducir de Iowa se emite por un período de ocho años.
- id: 15
  category: license_system
  question: ¿Cuál es la edad mínima para ser elegible para una licencia de conducir
    de Iowa "Completa" (no provisional)?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: En Iowa, un conductor puede obtener una licencia completa y no provisional
    a los 17 años, siempre que haya cumplido con todos los requisitos de la etapa
    de licencia intermedia durante al menos 12 meses.
- id: 16
  category: license_system
  question: Para obtener una licencia de conducir o tarjeta de identificación de Iowa,
    ¿cuántos documentos que demuestren la residencia en Iowa debe proporcionar el
    solicitante?
  choices:
    A: Un documento
    B: Dos documentos
    C: Tres documentos
    D: No se requieren documentos si tiene un certificado de nacimiento
  answer: B
  explanation: Según el DOT de Iowa, los solicitantes deben proporcionar dos documentos
    que demuestren la residencia en Iowa, como una factura de servicios públicos,
    un estado de cuenta bancario o un comprobante de pago.
- id: 17
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una licencia Clase D de Iowa (Chauffeur's),
    que se requiere para personas que transportan 15 pasajeros o menos por contrato?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: C
  explanation: En Iowa, debe tener al menos 18 años para calificar para una licencia
    Clase D (Chauffeur's).
- id: 18
  category: license_system
  question: La ley de Iowa exige un seguro de responsabilidad civil para vehículos
    motorizados. ¿Cuál es la cobertura mínima requerida por lesiones corporales o
    muerte de dos o más personas en un solo accidente?
  choices:
    A: $20,000
    B: $40,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: Los requisitos mínimos de seguro de responsabilidad civil de Iowa son
    $20,000 por lesiones corporales a una persona, $40,000 por lesiones corporales
    a dos o más personas y $15,000 por daños a la propiedad.
- id: 19
  category: license_system
  question: Si su licencia de conducir de Iowa es revocada por una infracción de OWI
    (Operar Mientras está Intoxicado), ¿cuál es el cargo de sanción civil requerido
    para la restitución?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: La ley de Iowa exige una sanción civil de $200 para la restitución
    de una licencia revocada por infracciones relacionadas con OWI.
- id: 20
  category: license_system
  question: Un padre o tutor que haya dado su consentimiento para la solicitud de
    licencia de conducir de un menor puede retirar ese consentimiento presentando
    un formulario ante el DOT. ¿Hasta qué edad del menor existe este derecho?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: C
  explanation: En Iowa, un padre o tutor puede retirar su consentimiento para la licencia
    de un menor en cualquier momento hasta que el menor cumpla 18 años.
- id: 21
  category: license_system
  question: ¿Cuántos días antes de la fecha de vencimiento se le permite renovar su
    licencia de conducir de Iowa?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: D
  explanation: Los residentes de Iowa tienen permitido renovar su licencia de conducir
    hasta 180 días antes de la fecha de vencimiento.
- id: 22
  category: license_system
  question: Los nuevos residentes de Iowa deben obtener una licencia de conducir de
    Iowa dentro de ¿cuántos días después de establecer su residencia en el estado?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según la ley de Iowa, se le considera residente de Iowa y debe obtener
    una licencia de Iowa dentro de los 30 días posteriores al establecimiento de su
    residencia.
- id: 23
  category: license_system
  question: Si es menor de 18 años y posee un permiso de instrucción o una licencia
    intermedia de Iowa, ¿cuál es la consecuencia de ser condenado por una infracción
    de tránsito o estar involucrado en un accidente con responsabilidad?
  choices:
    A: Revocación permanente e inmediata de los privilegios de conducir
    B: Una suspensión obligatoria de 12 meses
    C: Requisito de asistir a una entrevista de Mejora de Conducción Correctiva (Remedial
      Driver Improvement)
    D: Una multa de $500 y ninguna otra acción
  answer: C
  explanation: Bajo el programa de Licencia de Conducir Graduada (GDL) de Iowa, cualquier
    condena por infracción de tránsito o accidente con responsabilidad activa una
    entrevista obligatoria de Mejora de Conducción Correctiva.
- id: 24
  category: license_system
  question: Generalmente, ¿por cuántos días se considera válida una licencia de conducir
    de Iowa para fines de conducción después de la fecha de vencimiento impresa en
    la licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: No hay período de gracia
  answer: B
  explanation: La ley de Iowa otorga un período de gracia de 60 días después de la
    fecha de vencimiento, durante el cual la licencia sigue siendo válida para conducir
    en Iowa.
- id: 25
  category: license_system
  question: Para calificar para una Licencia Escolar para Menores (MSL) de Iowa, ¿a
    qué distancia mínima debe vivir el estudiante de la escuela a la que asiste?
  choices:
    A: 0.5 millas
    B: 1 milla
    C: 2 millas
    D: 5 millas
  answer: B
  explanation: Para ser elegible para una Licencia Escolar en Iowa, el estudiante
    debe vivir a una milla o más de la escuela en la que está inscrito.
- id: 26
  category: license_system
  question: ¿Cuál es el número mínimo de horas de clase requeridas para un curso de
    educación vial aprobado por el estado en Iowa?
  choices:
    A: 15 horas
    B: 20 horas
    C: 30 horas
    D: 40 horas
  answer: C
  explanation: La educación vial en Iowa debe incluir un mínimo de 30 horas de instrucción
    en el aula y 6 horas de instrucción de laboratorio (detrás del volante).
- id: 27
  category: license_system
  question: Si reprueba el examen de conocimientos (escrito) para la licencia de conducir
    de Iowa, ¿cuánto tiempo debe esperar antes de ser elegible para volver a tomarlo?
  choices:
    A: Hasta el siguiente día hábil
    B: 3 días
    C: 7 días
    D: 30 días
  answer: A
  explanation: La política del DOT de Iowa permite que los solicitantes que reprueben
    el examen de conocimientos lo vuelvan a tomar tan pronto como el siguiente día
    hábil.
- id: 28
  category: license_system
  question: Al solicitar una Licencia Intermedia de Iowa, ¿cuántas de las 20 horas
    requeridas de conducción supervisada deben completarse por la noche (entre el
    atardecer y el amanecer)?
  choices:
    A: 1 hora
    B: 2 horas
    C: 5 horas
    D: 10 horas
  answer: B
  explanation: Mientras se tiene un permiso de instrucción, Iowa requiere 20 horas
    de conducción supervisada, de las cuales al menos 2 horas deben ser nocturnas.
- id: 29
  category: license_system
  question: 'Si un conductor de Iowa es condenado por una primera ofensa de OWI y
    su BAC (concentración de alcohol en sangre) era de .08 o superior, su licencia
    será revocada por un mínimo de:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: Un año
  answer: C
  explanation: Una condena por primera ofensa de OWI en Iowa resulta en una revocación
    de la licencia por un mínimo de 180 días.
- id: 30
  category: license_system
  question: En Iowa, si es menor de 18 años y desea pasar de una Licencia Intermedia
    a una Licencia Completa, ¿durante cuántos meses consecutivos debe haber estado
    libre de accidentes e infracciones?
  choices:
    A: 6 meses
    B: 9 meses
    C: 12 meses
    D: 18 meses
  answer: C
  explanation: Para obtener una Licencia Completa a los 17 años, un conductor de Iowa
    debe haber tenido una Licencia Intermedia durante al menos 12 meses consecutivos
    sin accidentes ni infracciones de tránsito.
- id: 31
  category: driver_testing
  question: ¿Si reprueba el examen de conducción (práctico) de Iowa, cuál es el período
    mínimo de espera antes de ser elegible para volver a tomarlo?
  choices:
    A: El mismo día
    B: Un día
    C: Siete días
    D: Treinta días
  answer: B
  explanation: Según el Manual del Conductor de Iowa, si reprueba el examen de conducción,
    debe esperar al menos un día antes de poder tomarlo nuevamente.
- id: 32
  category: driver_testing
  question: El examen de conocimientos (escrito) de Iowa consta de 35 preguntas de
    opción múltiple. ¿Cuál es el número mínimo de respuestas correctas requeridas
    para aprobar?
  choices:
    A: '25'
    B: '28'
    C: '30'
    D: '32'
  answer: B
  explanation: Para aprobar el examen de conocimientos de Iowa, debe responder correctamente
    al menos 28 de las 35 preguntas, lo que representa una puntuación de aprobación
    del 80%.
- id: 33
  category: driver_testing
  question: Para calificar para una licencia de conducir de Iowa sin la restricción
    de 'espejo retrovisor exterior izquierdo y derecho', ¿cuál es la visión periférica
    mínima requerida?
  choices:
    A: 90 grados
    B: 110 grados
    C: 140 grados
    D: 180 grados
  answer: C
  explanation: Iowa requiere un campo visual de al menos 140 grados. Si el campo de
    visión es inferior a 140 grados, la licencia estará restringida para incluir espejos
    retrovisores exteriores.
- id: 34
  category: driver_testing
  question: Si cambia legalmente su nombre (por ejemplo, por matrimonio o por orden
    judicial), ¿cuántos días tiene para notificar al DOT de Iowa y obtener una licencia
    de reemplazo?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Según la ley de Iowa, debe notificar al DOT sobre un cambio de nombre
    legal dentro de los 30 días.
- id: 35
  category: driver_testing
  question: Una licencia de conducir no comercial estándar Clase C de Iowa le permite
    operar vehículos con una Clasificación de Peso Bruto Vehicular (GVWR) de hasta
    ¿cuántas libras?
  choices:
    A: 10,000 lbs
    B: 16,000 lbs
    C: 26,000 lbs
    D: 33,000 lbs
  answer: C
  explanation: Una licencia Clase C permite la operación de un vehículo con un GVWR
    de menos de 26,001 libras.
- id: 36
  category: driver_testing
  question: Si su licencia de conducir de Iowa es suspendida por una infracción de
    tránsito no relacionada con el alcohol, ¿cuál es la tarifa estándar de restablecimiento
    que debe pagar?
  choices:
    A: $20
    B: $50
    C: $100
    D: $200
  answer: A
  explanation: El Código de Iowa 321.191 especifica una tarifa de restablecimiento
    de $20 para la mayoría de las suspensiones que no están relacionadas con delitos
    de OWI (Operar Mientras se está Intoxicado).
- id: 37
  category: driver_testing
  question: Bajo la opción de 'Educación Vial Impartida por los Padres' de Iowa, ¿cuántas
    horas de instrucción en el aula debe completar el estudiante?
  choices:
    A: 15 horas
    B: 30 horas
    C: 45 horas
    D: 60 horas
  answer: B
  explanation: El programa de educación vial impartido por los padres en Iowa requiere
    30 horas de instrucción en el aula y 40 horas de conducción (incluyendo 4 horas
    de conducción nocturna).
- id: 38
  category: driver_testing
  question: Si reprueba el examen de la vista en el centro de servicio del DOT de
    Iowa, ¿cuál es el siguiente paso requerido?
  choices:
    A: Se le prohíbe permanentemente conducir
    B: Debe esperar 30 días para volver a realizar el examen
    C: Debe realizar un examen de conducción de inmediato
    D: Debe presentar un Informe de Visión (Formulario 430032) completado por un especialista
      de la vista con licencia
  answer: D
  explanation: Si reprueba el examen de la vista, el DOT le proporcionará un formulario
    de Informe de Visión para que sea completado por un oftalmólogo u optometrista.
- id: 39
  category: driver_testing
  question: Al realizar el examen práctico de Iowa, ¿cuál de los siguientes debe presentarse
    para el vehículo que se está utilizando?
  choices:
    A: Registro actual y comprobante de seguro
    B: El título del vehículo
    C: Una carta notariada del propietario del vehículo
    D: Un registro de mantenimiento de los últimos 12 meses
  answer: A
  explanation: El solicitante debe proporcionar el vehículo para el examen práctico,
    y este debe tener un registro actual y un comprobante válido de responsabilidad
    financiera (seguro).
- id: 40
  category: driver_testing
  question: Bajo la ley 'Motor Voter' (Votante Motorizado), ¿a qué edad puede un residente
    de Iowa registrarse para votar por primera vez en el centro de servicio del DOT
    mientras solicita una licencia?
  choices:
    A: 14 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: C
  explanation: En Iowa, puede registrarse para votar cuando tenga al menos 17 años,
    aunque no puede votar realmente hasta los 18 (o 17 para las elecciones primarias
    si cumplirá 18 para la elección general).
- id: 41
  category: driver_testing
  question: ¿Cuántas veces al día se le permite a un solicitante intentar el examen
    de conocimientos (escrito) de Iowa?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Ilimitadas hasta que apruebe
  answer: A
  explanation: La política del DOT de Iowa generalmente limita a los solicitantes
    a un intento del examen de conocimientos por día.
- id: 42
  category: driver_testing
  question: Si se muda a Iowa y tiene una licencia válida de otro estado, ¿cuál es
    generalmente el único examen requerido para obtener una licencia de Iowa?
  choices:
    A: El examen de manejo
    B: El examen de conocimientos
    C: El examen de la vista
    D: No se requieren exámenes
  answer: C
  explanation: Generalmente, si tiene una licencia válida de otro estado, se omiten
    los exámenes de conocimientos y de manejo, pero aún debe aprobar el examen de
    la vista.
- id: 43
  category: driver_testing
  question: En Iowa, ¿por cuántos años es válida una licencia de conducir si el solicitante
    tiene 72 años de edad o más?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: 8 años
  answer: B
  explanation: Mientras que las licencias para adultos más jóvenes son válidas por
    8 años, una vez que un conductor alcanza los 72 años, la licencia es válida por
    solo 2 años.
- id: 44
  category: driver_testing
  question: Para operar un ciclomotor (moped) en Iowa, una persona debe tener una
    licencia válida. Si no tiene una licencia de conducir estándar, ¿qué edad mínima
    debe tener para solicitar una licencia solo para ciclomotores?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: A
  explanation: En Iowa, una persona debe tener al menos 14 años para solicitar una
    licencia solo para ciclomotores (Clase C - Restringida) después de completar un
    curso de educación para ciclomotores.
- id: 45
  category: driver_testing
  question: En Iowa, ¿cuál es el límite de velocidad máximo para vehículos en autopistas
    interestatales rurales a menos que se indique lo contrario?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: B
  explanation: Según el Manual del Conductor de Iowa, el límite de velocidad en las
    autopistas interestatales rurales es de 70 mph, a menos que las señales indiquen
    lo contrario.
- id: 46
  category: driver_testing
  question: 'Según la ley de Iowa, debe presentar un ''Informe de Accidente de Iowa''
    si un accidente resulta en muerte, lesiones personales o daños totales a la propiedad
    de cualquier persona de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: La ley de Iowa requiere que se presente un informe por escrito al DOT
    si el accidente involucra una muerte, lesiones personales o daños totales a la
    propiedad de $1,500 o más.
- id: 47
  category: driver_testing
  question: 'Bajo la Ley de Consentimiento Implícito (Implied Consent Law) de Iowa,
    si se niega a someterse a una prueba química por primera vez, sus privilegios
    de conducir serán revocados por:'
  choices:
    A: 90 días
    B: 180 días
    C: Un año
    D: Dos años
  answer: C
  explanation: Si se niega a realizar una prueba química cuando lo solicite un oficial
    de paz (Consentimiento Implícito), su licencia será revocada por un año por una
    primera infracción.
- id: 48
  category: driver_testing
  question: En Iowa, ¿cuál es el período de suspensión obligatoria de la licencia
    de conducir por una primera condena por rebasar ilegalmente un autobús escolar
    con sus luces rojas intermitentes y el brazo de parada extendido?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Una primera condena por rebasar un autobús escolar con luces rojas
    intermitentes resulta en una suspensión obligatoria de la licencia de 30 días,
    además de una multa.
- id: 49
  category: driver_testing
  question: 'La ley ''Move Over'' (Hacerse a un lado) de Iowa requiere que los conductores
    que se aproximen a un vehículo de emergencia o de mantenimiento estacionado con
    luces intermitentes deban:'
  choices:
    A: Detenerse por completo y esperar una señal para pasar
    B: Mantener la velocidad pero moverse al carril izquierdo
    C: Cambiar de carril si es posible, o reducir la velocidad y estar preparado para
      detenerse si no es posible cambiar de carril
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley de Iowa exige que los conductores se muevan a un carril que
    no sea adyacente al vehículo de emergencia o mantenimiento estacionado si es posible;
    de lo contrario, deben reducir la velocidad y estar preparados para detenerse.
- id: 50
  category: driver_testing
  question: Si la visión de un conductor de Iowa está entre 20/41 y 20/70 en su mejor
    ojo, ¿qué restricción se colocará típicamente en su licencia de conducir?
  choices:
    A: Sin restricciones
    B: Conducción solo durante el día
    C: Conducción solo en carreteras con límites de velocidad inferiores a 45 mph
    D: No se requieren lentes correctivos
  answer: B
  explanation: En Iowa, si su visión está entre 20/41 y 20/70, es posible que se le
    restrinja a 'Conducción solo durante el día' (Restricción 1).
- id: 51
  category: driver_testing
  question: En Iowa, ¿qué pasajeros están obligados por ley a usar el cinturón de
    seguridad o estar en un sistema de sujeción para niños?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los niños menores de 12 años
    C: El conductor, los pasajeros del asiento delantero y todos los pasajeros menores
      de 18 años, independientemente de su posición en el vehículo
    D: Solo los pasajeros del asiento delantero y los niños menores de 6 años
  answer: C
  explanation: La ley de Iowa exige que el conductor y todos los pasajeros del asiento
    delantero usen cinturones de seguridad. Además, todos los pasajeros menores de
    18 años deben estar asegurados por un cinturón de seguridad o un sistema de sujeción
    para niños, independientemente de dónde se sienten en el vehículo.
- id: 52
  category: driver_testing
  question: 'Para mantener una distancia de seguimiento segura en condiciones normales
    de conducción en Iowa, se recomienda a los conductores utilizar la:'
  choices:
    A: Regla de la longitud de un vehículo
    B: Regla de los dos segundos
    C: Regla de los tres segundos
    D: Regla de los cinco segundos
  answer: C
  explanation: El Manual del Conductor de Iowa recomienda la "regla de los tres segundos"
    para mantener una distancia de seguimiento segura detrás del vehículo que está
    delante de usted.
- id: 53
  category: driver_testing
  question: Al estacionar un vehículo en una calle pública en Iowa, ¿las ruedas deben
    estar paralelas y a cuántas pulgadas del bordillo (curb)?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: El Código de Iowa 321.361 establece que los vehículos deben estacionarse
    con las ruedas del lado derecho paralelas y a no más de 18 pulgadas del bordillo
    derecho.
- id: 54
  category: driver_testing
  question: En Iowa, ¿es ilegal estacionar su vehículo a menos de cuántos pies de
    un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: A
  explanation: Según el Código de Iowa 321.358, no se puede detener, parar ni estacionar
    un vehículo a menos de 5 pies de un hidrante de incendios.
- id: 55
  category: driver_testing
  question: Al conducir de noche en Iowa, debe bajar las luces altas cuando se encuentre
    a ____ pies de un vehículo que viene en sentido contrario y a ____ pies cuando
    siga a otro vehículo.
  choices:
    A: 500; 200
    B: 500; 400
    C: 1,000; 500
    D: 300; 300
  answer: B
  explanation: La ley de Iowa exige que baje las luces altas a menos de 500 pies de
    un vehículo que se aproxima y a menos de 400 pies cuando sigue a otro vehículo.
- id: 56
  category: driver_testing
  question: La ley de responsabilidad financiera de Iowa exige que los conductores
    tengan un seguro de responsabilidad civil. ¿Cuál es la cobertura mínima requerida
    para daños a la propiedad en un solo accidente?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: C
  explanation: Los requisitos mínimos de seguro de responsabilidad civil en Iowa son
    $20,000 por lesiones corporales a una persona, $40,000 por lesiones corporales
    a dos o más personas y $15,000 por daños a la propiedad.
- id: 57
  category: driver_testing
  question: En Iowa, ¿cuál es la multa para una persona que se estacione incorrectamente
    en un espacio designado para personas con discapacidades?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: La multa por estacionarse incorrectamente en un espacio reservado para
    personas con discapacidades en Iowa es de $200.
- id: 58
  category: driver_responsibility
  question: Si usted está involucrado en un accidente en Iowa que cumple con el umbral
    de notificación, ¿cuántas horas tiene para presentar el informe ante el DOT?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 96 horas
  answer: C
  explanation: La ley de Iowa exige que se presente un informe por escrito de un accidente
    calificado ante el DOT dentro de las 72 horas posteriores al suceso.
- id: 59
  category: driver_responsibility
  question: Según las leyes de responsabilidad financiera de Iowa, ¿cuál es la cobertura
    mínima requerida de seguro de responsabilidad civil para daños a la propiedad?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: C
  explanation: La ley de Iowa exige un mínimo de $15,000 en cobertura de responsabilidad
    civil por daños a la propiedad en cualquier accidente.
- id: 60
  category: driver_responsibility
  question: ¿Qué significa la ley de "Consentimiento Implícito" (Implied Consent)
    de Iowa para los conductores?
  choices:
    A: Usted acepta mantener su vehículo en condiciones seguras de funcionamiento.
    B: Usted acepta someterse a una prueba química de alcohol o drogas si un oficial
      de la paz tiene motivos razonables para creer que está conduciendo bajo la influencia
      (OWI).
    C: Usted acepta portar seguro en todo momento.
    D: Usted acepta que su vehículo sea registrado en cualquier momento.
  answer: B
  explanation: La ley de Consentimiento Implícito significa que, al operar un vehículo
    motorizado en Iowa, usted ha dado su consentimiento para una prueba química (aliento,
    sangre u orina) para determinar la concentración de alcohol o la presencia de
    drogas.
- id: 61
  category: driver_responsibility
  question: Al vender un vehículo en Iowa, ¿qué debe hacer el vendedor con las placas
    de matrícula?
  choices:
    A: Dejarlas en el vehículo para el nuevo propietario.
    B: Devolverlas al DOT inmediatamente.
    C: Quitarlas y conservarlas; no se quedan con el vehículo.
    D: Destruirlas en presencia de un notario.
  answer: C
  explanation: En Iowa, las placas de matrícula pertenecen al propietario, no al vehículo.
    Cuando vende o transfiere un vehículo, debe quitar las placas.
- id: 62
  category: driver_responsibility
  question: Si un conductor de Iowa debe presentar un SR-22 (Prueba de Responsabilidad
    Financiera) tras una suspensión, ¿por cuánto tiempo debe mantener generalmente
    este registro?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: En la mayoría de los casos, Iowa exige que se mantenga un SR-22 durante
    dos años a partir de la fecha de la suspensión o revocación.
- id: 63
  category: driver_responsibility
  question: Según el Acuerdo de Infractores No Residentes (Non-Resident Violator Compact),
    ¿qué puede suceder si un conductor de Iowa no paga una multa de tráfico en otro
    estado miembro?
  choices:
    A: Nada; Iowa solo rastrea las infracciones dentro del estado.
    B: La licencia de Iowa del conductor puede ser suspendida hasta que se pague la
      multa.
    C: Se le prohibirá al conductor salir de Iowa.
    D: La multa se duplica automáticamente pero la licencia no se ve afectada.
  answer: B
  explanation: Iowa es miembro del Acuerdo de Infractores No Residentes. Si no resuelve
    una citación de tráfico en otro estado miembro, el DOT de Iowa puede suspender
    sus privilegios de conducción.
- id: 64
  category: driver_responsibility
  question: Para la mayoría de los vehículos de pasajeros en Iowa, ¿dónde deben exhibirse
    las placas de matrícula?
  choices:
    A: Solo en la parte trasera
    B: Solo en la parte delantera
    C: Tanto en la parte delantera como en la trasera
    D: En la parte trasera y dentro del parabrisas delantero
  answer: C
  explanation: La ley de Iowa exige que la mayoría de los vehículos motorizados (excepto
    motocicletas y ciertos camiones) exhiban placas de matrícula tanto en la parte
    delantera como en la trasera del vehículo.
- id: 65
  category: driver_responsibility
  question: Si se muda a Iowa desde otro estado, ¿cuántos días tiene para obtener
    una licencia de conducir de Iowa?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes que no sean estudiantes ni personal militar deben
    obtener una licencia de conducir de Iowa dentro de los 30 días posteriores al
    establecimiento de la residencia.
- id: 66
  category: driver_responsibility
  question: En Iowa, ¿cuál es el período mínimo de revocación por una primera condena
    de OWI (Operar Mientras se está Intoxicado)?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Un primer OWI en Iowa generalmente resulta en un período de revocación
    de la licencia de 180 días.
- id: 67
  category: driver_responsibility
  question: 'Si un conductor de Iowa se niega a someterse a una prueba química bajo
    la Ley de Consentimiento Implícito (Implied Consent Law) por primera vez, su licencia
    será revocada por:'
  choices:
    A: 180 días
    B: 1 año
    C: 2 años
    D: Permanentemente
  answer: B
  explanation: Según la ley de Iowa, negarse a una prueba química por primera vez
    resulta en una revocación obligatoria de la licencia por un año.
- id: 68
  category: driver_responsibility
  question: 'La ley de ''Contenedor Abierto'' (Open Container) de Iowa prohíbe la
    posesión de un recipiente de bebida alcohólica abierto en:'
  choices:
    A: Solo en la mano del conductor
    B: El área de pasajeros de cualquier vehículo motorizado en una calle o carretera
      pública
    C: El maletero del vehículo
    D: La guantera si está cerrada con llave
  answer: B
  explanation: La ley de Iowa prohíbe los recipientes abiertos de alcohol en el área
    de pasajeros de un vehículo motorizado, lo que incluye cualquier área de fácil
    acceso para el conductor o los pasajeros mientras están sentados.
- id: 69
  category: driver_responsibility
  question: Si es condenado por conducir sin un seguro de responsabilidad civil válido
    en Iowa y se ve involucrado en un accidente, ¿cuál es una posible sanción?
  choices:
    A: Solo una multa
    B: Suspensión de la licencia de conducir y del registro
    C: 30 días obligatorios de cárcel
    D: Ninguna sanción si fue su primer accidente
  answer: B
  explanation: No presentar una prueba de responsabilidad financiera (seguro) puede
    llevar a la suspensión de su licencia de conducir y del registro del vehículo.
- id: 70
  category: driver_responsibility
  question: Cuando compra un vehículo en Iowa, ¿dentro de cuántos días debe solicitar
    un nuevo título y registro?
  choices:
    A: 7 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Iowa exige que solicite un título y registro dentro de los
    30 días posteriores a la fecha de compra para evitar sanciones.
- id: 71
  category: driver_responsibility
  question: 'En Iowa, si se le condena por una ''violación grave'' como exceder el
    límite de velocidad por 25 mph, el DOT puede:'
  choices:
    A: Solo emitir una advertencia
    B: Suspender su licencia
    C: Requerir que repita solo el examen de conducir
    D: Aumentar sus tarifas de registro
  answer: B
  explanation: El DOT de Iowa tiene la autoridad para suspender la licencia de cualquier
    'infractor habitual' o de cualquier persona condenada por una 'violación grave',
    lo que incluye el exceso de velocidad excesivo (25+ mph por encima del límite).
- id: 72
  category: driver_responsibility
  question: Si un conductor de Iowa es condenado por operar un vehículo motorizado
    sin el seguro de responsabilidad civil requerido, ¿cuál es la multa mínima (excluyendo
    recargos y costos judiciales)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Según el Código de Iowa 321.20B, la multa por no presentar prueba de
    responsabilidad financiera (seguro) es de $250, aunque puede estar sujeta a recargos
    adicionales.
- id: 73
  category: driver_responsibility
  question: Bajo la ley de 'Consentimiento Implícito' de Iowa, ¿qué sucede si se niega
    a someterse a una prueba química de alcohol o drogas cuando lo solicita un oficial
    de la paz?
  choices:
    A: Su licencia será revocada por al menos un año.
    B: Se le multará con $5,000 de inmediato.
    C: Se le sentenciará a 30 días de cárcel.
    D: Nada, siempre que sea su primera infracción.
  answer: A
  explanation: La ley de Consentimiento Implícito de Iowa significa que, al conducir,
    usted acepta ser sometido a pruebas. La negativa a realizar una prueba de aliento,
    sangre u orina resulta en la revocación automática de la licencia por un año para
    una primera infracción.
- id: 74
  category: driver_responsibility
  question: 'En Iowa, la presentación del seguro SR-22 es un certificado de ''alto
    riesgo'' requerido para los conductores que han:'
  choices:
    A: No pagado una multa por exceso de velocidad.
    B: Tenido su licencia revocada por un OWI o bajo la ley de Responsabilidad Financiera.
    C: Comprado un vehículo de más de 20 años.
    D: Fallado un examen de la vista en el DOT.
  answer: B
  explanation: Un SR-22 es una forma de prueba de responsabilidad financiera requerida
    para personas cuyas licencias han sido revocadas o suspendidas debido a un OWI
    (conducir bajo la influencia), o por no pagar una sentencia resultante de un accidente.
- id: 75
  category: driver_responsibility
  question: 'Si usted está involucrado en un accidente en Iowa y no tiene seguro,
    y se le encuentra responsable de los daños, su licencia será suspendida hasta
    que:'
  choices:
    A: Pague una multa de $50.
    B: Espere 30 días.
    C: Proporcione prueba de un acuerdo, una liberación de responsabilidad o un acuerdo
      de pago.
    D: Complete un curso de conducción defensiva.
  answer: C
  explanation: Bajo la ley de Responsabilidad Financiera de Iowa, si no tiene seguro
    y se ve involucrado en un accidente con daños superiores a $1,500, su licencia
    se suspende hasta que satisfaga las reclamaciones en su contra o proporcione un
    depósito de garantía.
- id: 76
  category: driver_responsibility
  question: 'En Iowa, el uso de un dispositivo electrónico portátil para escribir,
    enviar o leer un mensaje de texto mientras conduce se considera una:'
  choices:
    A: Infracción secundaria (deben detenerlo por otra cosa primero).
    B: Infracción primaria (pueden detenerlo únicamente por esta violación).
    C: Acción legal si es mayor de 21 años.
    D: Violación que no conlleva multa por la primera infracción.
  answer: B
  explanation: A partir del 1 de julio de 2017, enviar mensajes de texto mientras
    se conduce es una infracción primaria en Iowa, lo que significa que las autoridades
    pueden detenerlo específicamente por ese motivo.
- id: 77
  category: driver_responsibility
  question: Según la ley de Iowa, los niños deben estar asegurados en un sistema de
    retención infantil (asiento de seguridad) hasta que alcancen ¿qué edad?
  choices:
    A: 4 años
    B: 6 años
    C: 8 años
    D: 12 años
  answer: B
  explanation: La ley de Iowa exige que los niños deben estar en un sistema de retención
    infantil hasta que cumplan 6 años. Desde los 6 hasta los 18 años, deben estar
    asegurados por un asiento de seguridad o un cinturón de seguridad.
- id: 78
  category: driver_responsibility
  question: 'La ley ''Move Over'' (Hacerse a un lado) de Iowa exige que los conductores
    cambien de carril o reduzcan la velocidad al acercarse a un vehículo con luces
    intermitentes. No hacerlo y provocar un choque puede resultar en una suspensión
    de la licencia de hasta:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: D
  explanation: Las violaciones de la ley 'Move Over' que resulten en daños a la propiedad
    o lesiones corporales pueden conllevar multas significativas y una suspensión
    de la licencia de hasta un año.
- id: 79
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por tirar basura en las carreteras de Iowa?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Tirar basura es ilegal en Iowa y puede resultar en una multa de hasta
    $1,000 y/o servicio comunitario.
- id: 80
  category: driver_responsibility
  question: La ley 'Motor Voter' en Iowa permite a los ciudadanos hacer ¿qué en la
    estación de licencias de conducir del DOT?
  choices:
    A: Pagar impuestos sobre la propiedad.
    B: Registrarse para votar o actualizar el registro de votantes.
    C: Solicitar un pasaporte.
    D: Votar en una elección primaria.
  answer: B
  explanation: La Ley Nacional de Registro de Votantes (Motor Voter) permite a los
    ciudadanos elegibles registrarse para votar o actualizar su información al solicitar
    o renovar una licencia de conducir.
- id: 81
  category: driver_responsibility
  question: Para los conductores de vehículos motorizados comerciales en Iowa, ¿cuál
    es el límite de concentración de alcohol en sangre (BAC) a partir del cual se
    considera que conducen bajo la influencia?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: Mientras que el límite para conductores estándar es 0.08%, el límite
    de BAC para conductores comerciales (titulares de CDL) en Iowa es 0.04%.
- id: 82
  category: driver_responsibility
  question: 'Iowa forma parte del "Convenio de Infractores No Residentes" (Non-Resident
    Violator Compact). Esto significa que si recibe una multa en otro estado miembro
    y no la procesa (no la paga ni acude al tribunal):'
  choices:
    A: El otro estado enviará una factura a su compañía de seguros.
    B: El DOT de Iowa puede suspender su licencia de Iowa hasta que se resuelva la
      multa.
    C: Se le prohibirá la entrada a ese estado por 5 años.
    D: No sucede nada a menos que regrese a ese estado específico.
  answer: B
  explanation: El Convenio de Infractores No Residentes garantiza que las infracciones
    de tráfico fuera del estado se informen al estado de origen del conductor. Si
    ignora una multa en otro estado, el DOT de Iowa suspenderá su licencia.
- id: 83
  category: safe_driving_rules
  question: En Iowa, ¿cuál es el límite de velocidad en un distrito comercial a menos
    que se indique lo contrario?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Según el Manual del Conductor de Iowa, el límite de velocidad en cualquier
    distrito comercial es de 20 mph a menos que se indique una velocidad diferente.
- id: 84
  category: safe_driving_rules
  question: En las carreteras secundarias de Iowa, ¿cuál es el límite de velocidad
    no señalizado durante el día?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: El límite de velocidad para las carreteras secundarias de Iowa es de
    55 mph a menos que se indique lo contrario.
- id: 85
  category: safe_driving_rules
  question: En Iowa, ¿está prohibido estacionar a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: A
  explanation: La ley de Iowa establece que no se puede estacionar un vehículo a menos
    de 5 pies de un hidrante de incendios.
- id: 86
  category: safe_driving_rules
  question: Al estacionar cerca de una señal de alto, una baliza intermitente o una
    señal de control de tráfico en Iowa, ¿cuál es la distancia mínima requerida que
    debe mantener?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: La ley de Iowa prohíbe estacionar a menos de 20 pies de una señal de
    alto, una baliza intermitente o una señal de control de tráfico ubicada al costado
    de una calzada.
- id: 87
  category: safe_driving_rules
  question: Según la ley de "Hacerse a un lado" (Move Over) de Iowa, ¿qué debe hacer
    un conductor al acercarse a un vehículo de emergencia estacionario con sus luces
    intermitentes en una carretera de carriles múltiples?
  choices:
    A: Detenerse por completo hasta que el vehículo se mueva
    B: Mantener la velocidad pero tocar la bocina para alertar a los socorristas
    C: Cambiarse a un carril que no sea adyacente al vehículo de emergencia, si es
      seguro hacerlo
    D: Acelerar para pasar el área lo más rápido posible
  answer: C
  explanation: La ley "Move Over" de Iowa exige que los conductores se cambien a un
    carril no adyacente o reduzcan la velocidad y estén preparados para detenerse
    al acercarse a vehículos de emergencia, de servicios públicos o de mantenimiento
    estacionarios con luces intermitentes.
- id: 88
  category: safe_driving_rules
  question: En Iowa, ¿a menos de cuántos pies de la entrada de una estación de bomberos
    en el mismo lado de la calle no se puede estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 25 pies
    D: 50 pies
  answer: B
  explanation: La ley de Iowa prohíbe estacionar a menos de 20 pies de la entrada
    de la entrada de cualquier estación de bomberos en el mismo lado de la calle.
- id: 89
  category: safe_driving_rules
  question: Al seguir a otro vehículo en Iowa, ¿cuál es la distancia mínima de seguimiento
    recomendada en condiciones ideales?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Iowa recomienda una distancia mínima de
    seguimiento de al menos tres segundos para permitir suficiente tiempo para reaccionar
    ante los peligros.
- id: 90
  category: safe_driving_rules
  question: Si conduce por una carretera de dos carriles en Iowa y se acerca a un
    autobús escolar con sus luces ámbar (amarillas) intermitentes, ¿qué indica esto?
  choices:
    A: El autobús está a punto de detenerse y usted debe prepararse para detenerse
    B: El autobús está acelerando y usted debe pasar rápidamente
    C: El autobús está averiado
    D: Debe detenerse inmediatamente
  answer: A
  explanation: En Iowa, las luces ámbar intermitentes en un autobús escolar indican
    que el autobús se está preparando para detenerse para cargar o descargar niños.
    Los conductores deben reducir la velocidad y estar preparados para detenerse.
- id: 91
  category: safe_driving_rules
  question: 'En Iowa, debe usar sus faros delanteros siempre que la visibilidad se
    reduzca a menos de:'
  choices:
    A: 200 pies
    B: 400 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Iowa exige el uso de faros delanteros desde el atardecer
    hasta el amanecer y en cualquier momento en que las condiciones (como niebla,
    nieve o lluvia) le impidan ver otros vehículos o personas a menos de 500 pies.
- id: 92
  category: safe_driving_rules
  question: Al adelantar a otro vehículo en una carretera de dos carriles en Iowa,
    ¿debe regresar a su carril antes de estar a cuántos pies de un vehículo que viene
    en sentido contrario?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: A
  explanation: La ley de Iowa exige que complete un adelantamiento y regrese a su
    carril antes de estar a menos de 100 pies de cualquier vehículo que se aproxime
    en dirección opuesta.
- id: 93
  category: safe_driving_rules
  question: ¿Cuál es la sanción por una infracción por exceso de velocidad cometida
    en una zona de obras viales en Iowa cuando hay trabajadores presentes?
  choices:
    A: La multa se triplica
    B: La multa se duplica
    C: Suspensión obligatoria de la licencia por 30 días
    D: No hay sanción adicional
  answer: B
  explanation: En Iowa, las multas programadas por infracciones de tráfico en movimiento
    se duplican si la infracción ocurre en una zona de obras viales.
- id: 94
  category: safe_driving_rules
  question: En Iowa, si se ve involucrado en un accidente que resulte en lesiones,
    muerte o daños a la propiedad combinados de _____ o más, debe presentar un informe
    de accidente ante el DOT.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: La ley de Iowa exige que se presente un informe por escrito (Formulario
    433002) ante el DOT si un accidente resulta en muerte, lesiones personales o daños
    totales a la propiedad de $1,500 o más.
- id: 95
  category: safe_driving_rules
  question: Al estacionar un vehículo cuesta arriba en una calle de doble sentido
    con bordillo (curb) en Iowa, ¿hacia dónde deben girarse las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: Paralelas al bordillo
    C: En dirección contraria al bordillo
    D: Hacia la derecha
  answer: C
  explanation: Al estacionar cuesta arriba con un bordillo, gire las ruedas en dirección
    contraria al bordillo para que, si el vehículo rueda, la parte trasera de la llanta
    delantera golpee el bordillo y detenga el automóvil.
- id: 96
  category: safe_driving_rules
  question: Al conducir en una carretera con tres o más carriles en Iowa, ¿qué carril
    está destinado normalmente al tráfico más lento?
  choices:
    A: El carril izquierdo
    B: El carril central
    C: El carril derecho
    D: El carril HOV
  answer: C
  explanation: En Iowa, al igual que en la mayoría de los estados, el carril derecho
    está destinado al tráfico más lento, mientras que los carriles izquierdos se utilizan
    para adelantar y para viajar a mayor velocidad.
- id: 97
  category: safe_driving_rules
  question: En Iowa, ¿cuándo se permite un giro a la izquierda con luz roja?
  choices:
    A: Nunca
    B: Desde una calle de doble sentido hacia una calle de sentido único
    C: Desde una calle de sentido único hacia otra calle de sentido único
    D: Solo durante horas designadas
  answer: C
  explanation: La ley de Iowa permite un giro a la izquierda en rojo solo cuando se
    gira desde una calle de sentido único hacia otra calle de sentido único, siempre
    que se detenga por completo y ceda el paso al tráfico y a los peatones.
- id: 98
  category: safe_driving_rules
  question: En una carretera de dos carriles en Iowa, ¿qué debe hacer cuando un autobús
    escolar se detiene con sus luces rojas intermitentes y el brazo de parada extendido?
  choices:
    A: Detenerse solo si viene detrás del autobús
    B: Reducir la velocidad a 15 mph y pasar con precaución
    C: Detenerse si viaja en cualquier dirección
    D: Detenerse solo si hay niños cruzando la calle
  answer: C
  explanation: En una carretera de dos carriles, el tráfico en ambas direcciones debe
    detenerse cuando un autobús escolar tiene sus luces rojas intermitentes y el brazo
    de parada extendido.
- id: 99
  category: safe_driving_rules
  question: En Iowa, ¿se le prohíbe adelantar a otro vehículo a menos de cuántos pies
    de una intersección o cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley de Iowa establece que no debe adelantar a otro vehículo cuando
    se aproxime a menos de 100 pies de una intersección, cruce de ferrocarril, puente,
    viaducto o túnel.
- id: 100
  category: safe_driving_rules
  question: La ley 'Move Over' (Hacerse a un lado) de Iowa exige que los conductores
    cambien de carril o reduzcan la velocidad al acercarse a ¿qué vehículos detenidos
    a un lado de la carretera con luces intermitentes activadas?
  choices:
    A: Solo vehículos de policía y bomberos
    B: Solo ambulancias
    C: Solo grúas y vehículos de mantenimiento de carreteras
    D: Cualquier vehículo con luces intermitentes, incluidos los de emergencia, mantenimiento
      y remolque
  answer: D
  explanation: La ley Move Over de Iowa se aplica a todos los vehículos estacionarios
    con luces intermitentes, incluidos los de respuesta a emergencias, los vehículos
    de mantenimiento y las grúas.
- id: 101
  category: safe_driving_rules
  question: 'Al conducir en una carretera de varios carriles en Iowa, el carril izquierdo
    está destinado principalmente para:'
  choices:
    A: Conducir al límite de velocidad
    B: Rebasar y girar a la izquierda
    C: Camiones pesados
    D: Vehículos de movimiento lento
  answer: B
  explanation: En Iowa, debe conducir en el carril derecho, excepto cuando esté rebasando
    o preparándose para girar a la izquierda.
- id: 102
  category: safe_driving_rules
  question: ¿Cuántos segundos de distancia de seguimiento mínima recomienda el Manual
    del Conductor de Iowa bajo condiciones de conducción ideales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: B
  explanation: Iowa recomienda una 'regla de los tres segundos' para mantener una
    distancia de seguimiento segura detrás del vehículo que está delante de usted.
- id: 103
  category: safe_driving_rules
  question: 'Al rebasar un vehículo comercial grande en Iowa, no debe volver al carril
    hasta que pueda ver:'
  choices:
    A: Al conductor del camión en su espejo lateral
    B: Los faros delanteros del camión en su espejo retrovisor
    C: El parachoques delantero del camión en su espejo lateral
    D: La parte superior de la cabina del camión
  answer: B
  explanation: Para asegurarse de tener suficiente espacio después de rebasar un camión
    grande, no vuelva al carril hasta que pueda ver toda la parte delantera del camión
    (ambos faros) en su espejo retrovisor interior.
- id: 104
  category: defensive_driving
  question: Según el Manual del Conductor de Iowa, ¿cuál es la distancia de seguimiento
    recomendada detrás del vehículo que está delante de usted bajo condiciones ideales?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: La longitud de un automóvil por cada 10 mph
  answer: B
  explanation: El DOT de Iowa recomienda usar la 'regla de los tres segundos' para
    mantener una distancia de seguimiento segura bajo condiciones de conducción ideales.
- id: 105
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente,
    las leyes y pautas de seguridad de Iowa sugieren que debe mirar hacia adelante
    al menos a qué distancia?
  choices:
    A: 5 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: Una cuadra de la ciudad
  answer: B
  explanation: Las pautas de seguridad de Iowa recomiendan observar el camino de 10
    a 15 segundos hacia adelante para anticipar peligros y gestionar el flujo de tráfico.
- id: 106
  category: defensive_driving
  question: En Iowa, debe atenuar sus luces altas cuando se encuentre a cuántos pies
    de un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Iowa exige que los conductores cambien a luces bajas cuando
    un vehículo que viene en sentido contrario está a menos de 500 pies.
- id: 107
  category: defensive_driving
  question: 'Según la ley de Iowa, debe usar sus faros delanteros siempre que no pueda
    ver claramente a una distancia de al menos:'
  choices:
    A: 250 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Iowa establece que los faros deben estar encendidos si la
    visibilidad se reduce a 500 pies o menos debido a condiciones como lluvia, nieve
    o niebla.
- id: 108
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (donde los neumáticos pierden
    contacto con la carretera y se deslizan sobre una capa de agua) en las condiciones
    climáticas de Iowa?
  choices:
    A: Tan bajo como 35 mph
    B: Solo por encima de 55 mph
    C: Exactamente 45 mph
    D: Solo durante aguaceros torrenciales a 65 mph
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 109
  category: defensive_driving
  question: ¿Cuál es el límite de velocidad en las carreteras secundarias de Iowa
    (carreteras no pavimentadas o del condado) durante el día, a menos que se indique
    lo contrario?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: El límite de velocidad para la mayoría de las carreteras secundarias
    de Iowa es de 55 mph, a menos que las señales indiquen lo contrario.
- id: 110
  category: defensive_driving
  question: 'En Iowa, se requiere una señal de ''Vehículo de movimiento lento'' (un
    triángulo naranja con una franja roja en cada lado) en los vehículos diseñados
    para viajar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: La ley de Iowa exige el emblema de vehículo de movimiento lento en
    todos los vehículos diseñados para viajar a velocidades de 25 mph o menos.
- id: 111
  category: defensive_driving
  question: Al conducir con niebla densa en Iowa, ¿qué ajuste de luces debe utilizar
    para mantener la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Luces de emergencia (intermitentes)
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en la niebla y, de hecho, disminuyen la visibilidad.
- id: 112
  category: defensive_driving
  question: En una autopista interestatal rural de Iowa, ¿cuál es el límite de velocidad
    máximo para vehículos de pasajeros bajo condiciones normales?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: B
  explanation: El límite de velocidad en las autopistas interestatales rurales en
    Iowa es de 70 mph, a menos que se indique lo contrario.
- id: 113
  category: defensive_driving
  question: En Iowa, ¿cuál es el límite de velocidad en un 'distrito suburbano' (un
    área donde la distancia promedio entre casas ocupadas es menor a 200 pies) a menos
    que se indique lo contrario?
  choices:
    A: 35 mph
    B: 40 mph
    C: 45 mph
    D: 50 mph
  answer: C
  explanation: La ley de Iowa establece el límite de velocidad en los distritos suburbanos
    en 45 mph, a menos que se indique lo contrario.
- id: 114
  category: defensive_driving
  question: Al seguir a una motocicleta en Iowa, ¿por qué debería dejar una distancia
    de seguimiento mayor que la que dejaría para un automóvil?
  choices:
    A: Las motocicletas tienen una distancia de frenado más corta
    B: Es más probable que las motocicletas se apaguen
    C: Las motocicletas siempre viajan más lento que los automóviles
    D: La ley de Iowa requiere un espacio de 10 segundos para las motocicletas
  answer: A
  explanation: Las motocicletas pueden detenerse mucho más rápido que otros vehículos.
    Seguir demasiado de cerca aumenta el riesgo de una colisión por alcance si el
    motociclista frena repentinamente.
- id: 115
  category: defensive_driving
  question: 'Si su vehículo comienza a derrapar en un camino con hielo en Iowa, la
    técnica correcta de conducción defensiva es:'
  choices:
    A: Frenar fuerte y girar el volante en dirección opuesta al derrape
    B: Acelerar ligeramente para recuperar la tracción
    C: Girar las ruedas delanteras en la dirección en que la parte trasera del vehículo
      está derrapando
    D: Poner el auto en neutral y cerrar los ojos
  answer: C
  explanation: Para recuperarse de un derrape, retire el pie del acelerador y gire
    el volante en la dirección en que se desliza la parte trasera del automóvil.
- id: 116
  category: defensive_driving
  question: Para ser un conductor seguro en Iowa, ¿con cuánta anticipación debería
    explorar el camino para identificar posibles peligros?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 15 segundos
    C: De 20 a 25 segundos
    D: Un minuto completo
  answer: B
  explanation: Explorar el camino con 10 a 15 segundos de anticipación le permite
    ver los peligros a tiempo y evitar maniobras de último minuto.
- id: 117
  category: defensive_driving
  question: 'En Iowa, al seguir a otro vehículo desde atrás por la noche, debe bajar
    sus luces altas cuando se encuentre a una distancia de:'
  choices:
    A: 200 pies
    B: 400 pies
    C: 600 pies
    D: 800 pies
  answer: B
  explanation: La ley de Iowa exige que los conductores cambien a luces bajas cuando
    sigan a otro vehículo a menos de 400 pies.
- id: 118
  category: defensive_driving
  question: Al conducir por los caminos de Iowa en invierno, si su vehículo está equipado
    con un Sistema de Frenos Antibloqueo (ABS) y comienza a derrapar, ¿cómo debe aplicar
    los frenos?
  choices:
    A: Bombear los frenos rápidamente
    B: Presionar el pedal del freno con firmeza y mantenerlo presionado
    C: Tocar ligeramente los frenos
    D: Cambiar a neutral y no usar los frenos
  answer: B
  explanation: Para vehículos con ABS, debe aplicar una presión constante y firme.
    Bombear los frenos es para vehículos más antiguos que no tienen ABS.
- id: 119
  category: defensive_driving
  question: Al compartir el camino con camiones grandes en Iowa, ¿qué es la 'No-Zone'
    (Zona Prohibida)?
  choices:
    A: El área donde los camiones no tienen permitido conducir
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: El carril rápido en la interestatal
    D: La entrada a la estación de pesaje
  answer: B
  explanation: La 'No-Zone' se refiere a los grandes puntos ciegos alrededor de un
    camión donde el conductor no puede ver su vehículo.
- id: 120
  category: defensive_driving
  question: De acuerdo con las leyes de rebase seguro de Iowa, ¿cuánto espacio debe
    dejar entre su vehículo y una bicicleta al rebasar?
  choices:
    A: Al menos 1 pie
    B: Al menos 3 pies
    C: Al menos 5 pies
    D: Exactamente el ancho de un automóvil
  answer: B
  explanation: La ley de Iowa (321.281) exige que los automovilistas rebasen a las
    bicicletas a una distancia segura, lo que generalmente se interpreta como al menos
    3 pies de espacio libre.
- id: 121
  category: defensive_driving
  question: 'En Iowa, NO es obligatorio detenerse ante un autobús escolar con luces
    rojas intermitentes y un brazo de parada extendido si:'
  choices:
    A: Viaja en la dirección opuesta en una carretera de dos carriles
    B: El autobús está detenido en un cruce de ferrocarril
    C: Viaja en la dirección opuesta en una calzada con dos o más carriles en cada
      dirección separados por una mediana
    D: Es después de la puesta del sol
  answer: C
  explanation: En una carretera dividida con una mediana o barrera, el tráfico que
    se mueve en la dirección opuesta al autobús no tiene que detenerse.
- id: 122
  category: defensive_driving
  question: Al entrar en una intersección en Iowa, ¿cuál es la secuencia de escaneo
    recomendada?
  choices:
    A: Derecha, luego izquierda
    B: Izquierda, luego derecha, luego izquierda otra vez
    C: Solo hacia adelante
    D: Revisar primero el espejo retrovisor
  answer: B
  explanation: El manual de Iowa recomienda mirar a la izquierda, luego a la derecha
    y luego a la izquierda otra vez porque el primer peligro proviene de la izquierda.
- id: 123
  category: defensive_driving
  question: Al conducir por carreteras resbaladizas de Iowa (hielo o nieve), ¿cómo
    debe ajustar su distancia de seguimiento?
  choices:
    A: Mantenerla en 3 segundos
    B: Reducirla a 1 segundo para mantenerse en las huellas del coche de adelante
    C: Aumentarla a al menos 6 segundos o más
    D: La distancia de seguimiento no importa sobre el hielo
  answer: C
  explanation: En condiciones adversas como hielo o nieve, debe al menos duplicar
    su distancia de seguimiento para proporcionar un mayor margen de seguridad.
- id: 124
  category: defensive_driving
  question: ¿Qué significa el término 'sobrepasar el alcance de sus faros' (overdriving
    your headlights) en el contexto de la conducción nocturna en Iowa?
  choices:
    A: Conducir con las luces altas encendidas en la ciudad
    B: Conducir tan rápido que su distancia de frenado es mayor que la distancia iluminada
      por sus faros
    C: Usar los faros durante el día
    D: Dejar los faros encendidos después de estacionar el coche
  answer: B
  explanation: Sobrepasar el alcance de los faros es peligroso porque no puede ver
    los peligros a tiempo para detenerse antes de chocar con ellos.
- id: 125
  category: alcohol_drugs_health
  question: Según la ley de Iowa, ¿cuál es la concentración máxima de alcohol en sangre
    (BAC) permitida para una persona que opera un vehículo motorizado comercial?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.04%
    D: 0.02%
  answer: C
  explanation: En Iowa, el límite legal de BAC para conductores comerciales es del
    0.04%. Para conductores adultos no comerciales, el límite es del 0.08%.
- id: 126
  category: alcohol_drugs_health
  question: 'La ley de ''Consentimiento Implícito'' (Implied Consent) de Iowa significa
    que, al operar un vehículo motorizado en el estado, usted ha dado su consentimiento
    para:'
  choices:
    A: Un registro del maletero de su vehículo en cualquier momento
    B: Una prueba química de su aliento, sangre u orina para determinar el contenido
      de alcohol o drogas
    C: El embargo de su vehículo si lo detienen por exceso de velocidad
    D: Permitir que los pasajeros beban alcohol siempre que el conductor esté sobrio
  answer: B
  explanation: La ley de Consentimiento Implícito de Iowa establece que cualquier
    persona que opere un vehículo motorizado en el estado acepta que se le realice
    una prueba química para determinar la presencia de alcohol o drogas.
- id: 127
  category: alcohol_drugs_health
  question: 'Si la prueba química de un conductor indica un BAC del 0.08% o más por
    primera vez en Iowa, su licencia será revocada por:'
  choices:
    A: 30 días
    B: 60 días
    C: 180 días
    D: Un año
  answer: C
  explanation: En Iowa, una primera infracción de OWI que involucre una prueba química
    fallida (0.08% o superior) resulta en una revocación de la licencia por 180 días.
- id: 128
  category: alcohol_drugs_health
  question: En Iowa, ¿quién puede ser acusado de una violación de la ley de 'Contenedor
    Abierto' (Open Container) si se encuentra una botella de alcohol sin sellar en
    el área de pasajeros de un vehículo?
  choices:
    A: Solo el conductor
    B: Solo la persona que sostiene el contenedor
    C: Tanto el conductor como el/los pasajero(s)
    D: Solo el propietario del vehículo
  answer: C
  explanation: La ley de Iowa prohíbe tanto a los conductores como a los pasajeros
    poseer un contenedor abierto de una bebida alcohólica en el área de pasajeros
    de un vehículo motorizado en una calle o carretera pública.
- id: 129
  category: alcohol_drugs_health
  question: 'En Iowa, un dispositivo de bloqueo de encendido (IID) es obligatorio
    para una primera infracción de OWI si el BAC del conductor fue igual o superior
    a:'
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.10%
    D: 0.15%
  answer: C
  explanation: La ley de Iowa requiere la instalación de un dispositivo de bloqueo
    de encendido para todas las revocaciones de OWI por primera infracción donde el
    BAC fue de 0.10% o superior, o si ocurrió un accidente.
- id: 130
  category: alcohol_drugs_health
  question: 'Cuando el alcohol se combina con otras drogas, el efecto sobre su capacidad
    de conducción suele ser:'
  choices:
    A: Reducido
    B: El mismo que el del alcohol solo
    C: Mayor que la suma de los efectos por separado
    D: Anulado
  answer: C
  explanation: Combinar alcohol con otras drogas (sinergismo) crea un deterioro mucho
    mayor que cualquiera de las sustancias por sí sola, aumentando significativamente
    el riesgo de un accidente.
- id: 131
  category: alcohol_drugs_health
  question: ¿Según los estándares médicos de Iowa, una persona que tiene una afección
    que causa pérdida del conocimiento (como la epilepsia) debe permanecer libre de
    convulsiones durante cuánto tiempo antes de que se le pueda otorgar la licencia
    para conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Las regulaciones del DOT de Iowa generalmente requieren que una persona
    con antecedentes de episodios de pérdida del conocimiento esté libre de episodios
    durante al menos seis meses antes de ser elegible para una licencia.
- id: 132
  category: alcohol_drugs_health
  question: 'Si es condenado por una segunda infracción de OWI (Operar Bajo la Influencia)
    en Iowa dentro de un período de 12 años, el período de revocación obligatoria
    de la licencia es:'
  choices:
    A: Un año
    B: Dos años
    C: Cinco años
    D: Permanente
  answer: B
  explanation: Una segunda infracción de OWI dentro de un período de 12 años en Iowa
    resulta en una revocación obligatoria de la licencia por dos años.
- id: 133
  category: alcohol_drugs_health
  question: 'En Iowa, el término OWI (Operar Bajo la Influencia) se aplica a los conductores
    bajo la influencia de:'
  choices:
    A: Solo alcohol
    B: Solo drogas ilegales
    C: Alcohol, drogas ilegales o medicamentos recetados/de venta libre
    D: Solo alcohol y drogas ilegales
  answer: C
  explanation: El OWI en Iowa cubre el deterioro por alcohol, cualquier droga (incluyendo
    las recetadas o de venta libre) o una combinación de sustancias.
- id: 134
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un requisito para que un conductor de Iowa
    restablezca su licencia después de una revocación por OWI?
  choices:
    A: Finalización de una evaluación de abuso de sustancias
    B: Finalización de un curso para 'conductores que beben' aprobado por el estado
    C: Pago de una multa civil de $200
    D: Todas las anteriores
  answer: D
  explanation: Para restablecer una licencia de Iowa después de un OWI, un conductor
    debe completar una evaluación y tratamiento de abuso de sustancias (si se recomienda),
    aprobar un curso para conductores que beben y pagar la multa civil requerida.
- id: 135
  category: alcohol_drugs_health
  question: Bajo la ley de Consentimiento Implícito de Iowa, ¿quién determina qué
    prueba química (aliento, sangre u orina) se administrará?
  choices:
    A: El conductor
    B: El oficial de paz
    C: El abogado del conductor
    D: El médico tratante
  answer: B
  explanation: En Iowa, el oficial de paz que solicita la prueba determina si la prueba
    será de aliento, sangre u orina de la persona.
- id: 136
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado y un médico no le dijo que afectaría
    su conducción, ¿aún puede ser condenado por OWI en Iowa?
  choices:
    A: No, porque fue recetado legalmente
    B: No, si tiene el frasco de la receta con usted
    C: Sí, si el medicamento afecta su capacidad para conducir de manera segura
    D: Solo si también consumió alcohol
  answer: C
  explanation: Bajo la ley de Iowa, tener una receta válida no es una defensa para
    el OWI si el medicamento hace que la persona sea incapaz de conducir de manera
    segura.
- id: 137
  category: alcohol_drugs_health
  question: Si un conductor de Iowa menor de 21 años es sorprendido con un BAC (concentración
    de alcohol en sangre) de 0.02% o superior por primera vez, ¿por cuánto tiempo
    se le revocarán sus privilegios de conducir bajo la ley de 'Tolerancia Cero'?
  choices:
    A: 30 días
    B: 60 días
    C: 180 días
    D: 1 año
  answer: B
  explanation: Bajo la ley de Tolerancia Cero de Iowa, a un infractor por primera
    vez menor de 21 años con un BAC de 0.02% o superior se le revocará la licencia
    por 60 días.
- id: 138
  category: alcohol_drugs_health
  question: Bajo la ley de Consentimiento Implícito de Iowa, ¿cuál es el período de
    revocación obligatoria por negarse por primera vez a someterse a una prueba química?
  choices:
    A: 180 días
    B: 90 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Si se niega a someterse a una prueba química en Iowa por primera vez,
    su licencia de conducir será revocada por un año.
- id: 139
  category: alcohol_drugs_health
  question: En Iowa, una condena por OWI (Operar Bajo la Influencia) por primera vez
    conlleva una sentencia de cárcel mínima obligatoria de ¿cuántas horas?
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: C
  explanation: Un OWI por primera vez en Iowa es un delito menor grave y conlleva
    un mínimo obligatorio de 48 horas en la cárcel.
- id: 140
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la ley
    de 'Contenedor Abierto' de Iowa?
  choices:
    A: Es legal que los pasajeros tengan contenedores abiertos en el asiento trasero.
    B: Es ilegal que cualquier persona en un vehículo motorizado en una calle o carretera
      pública posea un contenedor abierto de una bebida alcohólica en el área de pasajeros.
    C: Se permiten contenedores abiertos si el conductor no está bebiendo.
    D: Los contenedores abiertos solo son ilegales si el vehículo está en movimiento.
  answer: B
  explanation: La ley de Iowa prohíbe tanto a los conductores como a los pasajeros
    poseer un contenedor abierto de alcohol en el área de pasajeros de un vehículo
    motorizado en una vía pública.
- id: 141
  category: alcohol_drugs_health
  question: En Iowa, si es condenado por un OWI (operar bajo la influencia), ¿cuál
    de los siguientes requisitos debe completar antes de que se pueda restablecer
    su licencia?
  choices:
    A: Un curso de conducción defensiva
    B: Una evaluación de abuso de sustancias y un curso para conductores que beben
      aprobado por el estado
    C: 100 horas de servicio comunitario
    D: Una nueva prueba de habilidades de conducción
  answer: B
  explanation: La ley de Iowa exige que los infractores de OWI se sometan a una evaluación
    de abuso de sustancias y completen un curso para conductores que beben antes del
    restablecimiento de la licencia.
- id: 142
  category: alcohol_drugs_health
  question: ¿Cuál es el límite de BAC (concentración de alcohol en sangre) para los
    conductores de vehículos motorizados comerciales en Iowa?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Para los titulares de una licencia de conducir comercial (CDL) que
    operan un vehículo comercial, el límite legal de BAC es de 0.04%.
- id: 143
  category: alcohol_drugs_health
  question: ¿De qué manera afecta el alcohol primero la capacidad de un conductor?
  choices:
    A: Retrasa el tiempo de reacción.
    B: Afecta la coordinación y el equilibrio.
    C: Afecta el juicio y la toma de decisiones.
    D: Causa visión borrosa.
  answer: C
  explanation: El alcohol afecta primero el juicio y el autocontrol, los cuales son
    fundamentales para una conducción segura, incluso antes de que la coordinación
    física se vea notablemente afectada.
- id: 144
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados y se siente 'aturdido' o somnoliento,
    ¿qué debe hacer según el Manual del Conductor de Iowa?
  choices:
    A: Conducir solo durante el día.
    B: Beber café para mantenerse alerta mientras conduce.
    C: No conducir; es su responsabilidad conocer los efectos de su medicamento.
    D: Conducir más lento que el límite de velocidad indicado.
  answer: C
  explanation: Es responsabilidad del conductor asegurarse de no estar bajo los efectos
    de ninguna sustancia, incluidos los medicamentos recetados legales o los de venta
    libre.
- id: 145
  category: alcohol_drugs_health
  question: En Iowa, ¿cuál es la sanción para un conductor condenado por 'Operar bajo
    la influencia' (OWI) que resultó en la muerte de otra persona?
  choices:
    A: Un delito menor simple y una multa de $500.
    B: Un delito grave de Clase B y tiempo de prisión obligatorio.
    C: Un delito grave de Clase D y 1 año de libertad condicional.
    D: Una suspensión de la licencia de 90 días.
  answer: B
  explanation: Un OWI que resulta en muerte es un delito grave de Clase B en Iowa,
    que conlleva una sentencia de hasta 25 años de prisión.
- id: 146
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su concentración de alcohol
    en sangre (BAC) después de beber?
  choices:
    A: Tomar una ducha fría
    B: Beber café solo
    C: Hacer ejercicio vigorosamente
    D: Darle tiempo a su cuerpo para procesar el alcohol
  answer: D
  explanation: Solo el tiempo permite que el cuerpo metabolice el alcohol. El café,
    las duchas y el ejercicio no reducen el BAC ni aceleran el proceso de sobriedad.
- id: 147
  category: alcohol_drugs_health
  question: En Iowa, si es menor de 21 años y es condenado por 'Posesión de alcohol
    siendo menor de la edad legal' mientras se encuentra en un vehículo motorizado,
    ¿qué sucede con su licencia?
  choices:
    A: Nada, es solo una multa.
    B: Su licencia será suspendida por 30 días.
    C: Su licencia será revocada por 60 días por una primera infracción.
    D: Debe esperar hasta los 21 años para obtener una licencia completa.
  answer: C
  explanation: Según la ley de Iowa, una persona menor de 21 años condenada por poseer
    alcohol en un vehículo motorizado se enfrenta a una revocación obligatoria de
    la licencia (60 días por una primera infracción).
- id: 148
  category: penalties_and_points
  question: Un conductor de Iowa es considerado un 'Infractor Habitual' si acumula
    ____ o más infracciones de tránsito en movimiento dentro de un período de 2 años.
  choices:
    A: '4'
    B: '6'
    C: '8'
    D: '10'
  answer: B
  explanation: El Código de Iowa define a un infractor habitual como una persona que
    ha sido condenada por seis o más infracciones de tránsito en movimiento dentro
    de cualquier período de 24 meses.
- id: 149
  category: penalties_and_points
  question: 'Una primera condena por rebasar ilegalmente un autobús escolar detenido
    en Iowa resulta en una suspensión obligatoria de la licencia por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: A
  explanation: Según la Ley de Kadyn, una primera infracción por rebasar un autobús
    escolar detenido con su brazo de parada extendido resulta en una suspensión de
    la licencia de 30 días y una multa significativa.
- id: 150
  category: penalties_and_points
  question: En Iowa, si un pasajero menor de 18 años no usa el cinturón de seguridad,
    ¿a quién se le emite la citación?
  choices:
    A: Solo al pasajero
    B: Solo al conductor
    C: Tanto al conductor como al pasajero
    D: Solo al padre del pasajero
  answer: B
  explanation: En Iowa, el conductor es responsable de asegurar que todos los pasajeros
    menores de 18 años estén debidamente sujetos. Si no lo están, la citación se emite
    al conductor.
- id: 151
  category: penalties_and_points
  question: En Iowa, las multas por exceso de velocidad se ____ en las zonas de obras
    viales cuando hay trabajadores presentes.
  choices:
    A: Triplican
    B: Duplican
    C: Aumentan en un monto fijo de $50
    D: Aumentan en un monto fijo de $100
  answer: B
  explanation: La ley de Iowa exige que las multas programadas por exceso de velocidad
    se dupliquen en las zonas de obras viales para proteger a los trabajadores de
    la carretera.
- id: 152
  category: penalties_and_points
  question: Para los conductores de 21 años o más en Iowa, es ilegal operar un vehículo
    motorizado con una concentración de alcohol en sangre (BAC) de ____ o superior.
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: El límite legal para OWI (operar bajo la influencia) en Iowa para adultos
    de 21 años o más es de 0.08% de BAC.
- id: 153
  category: penalties_and_points
  question: En Iowa, una infracción por exceso de velocidad se considera una 'infracción
    grave' que puede llevar a la suspensión de la licencia si el conductor viaja a
    más de ____ mph sobre el límite establecido.
  choices:
    A: '15'
    B: '20'
    C: '25'
    D: '30'
  answer: C
  explanation: Exceder el límite de velocidad por más de 24 mph (25 o más) se clasifica
    como una infracción grave en Iowa y puede resultar en la suspensión de la licencia.
- id: 154
  category: penalties_and_points
  question: 'Si un conductor de Iowa se ve involucrado en un accidente y no tiene
    el seguro de responsabilidad civil requerido, debe proporcionar una prueba de
    responsabilidad financiera (SR-22) por un período de:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores que no presenten una prueba de responsabilidad financiera
    después de un accidente o ciertas condenas deben presentar un certificado SR-22
    ante el DOT durante 3 años.
- id: 155
  category: penalties_and_points
  question: Bajo la ley de 'Contenedor Abierto' de Iowa, ¿cuál de las siguientes afirmaciones
    es verdadera con respecto a una botella de alcohol abierta en un vehículo en una
    vía pública?
  choices:
    A: Se permite en la guantera
    B: Se permite si el conductor no está bebiendo
    C: Está prohibido tanto para conductores como para pasajeros
    D: Solo está prohibido para el conductor
  answer: C
  explanation: La ley de contenedor abierto de Iowa prohíbe tanto a los conductores
    como a los pasajeros poseer un contenedor abierto de una bebida alcohólica en
    el área de pasajeros de un vehículo motorizado en una calle o carretera pública.
- id: 156
  category: penalties_and_points
  question: 'Si se le declara Infractor Habitual en Iowa basándose en su historial
    de conducción, su licencia puede ser suspendida por un período que oscila entre:'
  choices:
    A: 6 meses a 1 año
    B: 1 a 3 años
    C: 2 a 6 años
    D: 5 a 10 años
  answer: C
  explanation: Una persona que sea declarada infractor habitual en Iowa enfrenta un
    período de revocación de la licencia de no menos de dos años ni más de seis años.
- id: 157
  category: penalties_and_points
  question: 'En Iowa, no ceder el paso a un vehículo de emergencia (Ley de Hacerse
    a un Lado o Move Over Law) que resulte en un choque que cause lesiones corporales
    a otra persona puede resultar en una suspensión de la licencia de:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Si una violación de la ley 'Move Over' causa lesiones corporales a
    otra persona, el DOT suspenderá la licencia del conductor por 180 días.
- id: 158
  category: penalties_and_points
  question: 'En Iowa, debe presentar un ''Informe Oficial de Accidente de Vehículo
    Motorizado'' ante el DOT si un accidente resulta en muerte, lesiones personales
    o daños totales a la propiedad de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: La ley de Iowa requiere que se presente un informe por escrito si el
    accidente resulta en lesiones, muerte o daños a la propiedad combinados de $1,500
    o más.
- id: 159
  category: penalties_and_points
  question: 'Si se le declara ''Infractor Habitual'' bajo la ley de Iowa, su licencia
    de conducir puede ser revocada por un período de:'
  choices:
    A: 6 meses a 1 año
    B: 1 a 3 años
    C: 2 a 6 años
    D: Permanentemente
  answer: C
  explanation: La ley de Infractores Habituales de Iowa (Código de Iowa 321.555) puede
    resultar en una revocación de la licencia que dura de dos a seis años, dependiendo
    de las infracciones.
- id: 160
  category: penalties_and_points
  question: 'En Iowa, si se le condena por exceso de velocidad en una zona de obras
    viales cuando hay trabajadores presentes, la multa puede ser de hasta:'
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: D
  explanation: Las multas por infracciones de tráfico en zonas de obras viales son
    más altas en Iowa; específicamente, las multas por exceso de velocidad en estas
    zonas pueden alcanzar hasta $1,000 cuando hay trabajadores presentes.
- id: 161
  category: penalties_and_points
  question: 'La ley de "Hacerse a un lado" (Move Over) de Iowa exige que los conductores
    cambien de carril o reduzcan la velocidad ante vehículos de emergencia estacionados.
    Una infracción de esta ley que no resulte en un accidente conlleva una multa programada
    de:'
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: La multa programada por una infracción de la ley Move Over de Iowa
    (Código de Iowa 321.323A) es de $100 más recargos.
- id: 162
  category: penalties_and_points
  question: En Iowa, una licencia de conducir puede ser suspendida por una "infracción
    grave". El exceso de velocidad se considera una infracción grave si se le sorprende
    conduciendo a cuántas millas por hora sobre el límite?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: El DOT de Iowa define una "infracción grave" como el exceso de velocidad
    de 25 mph o más sobre el límite legal, lo que puede llevar a la suspensión de
    la licencia.
- id: 163
  category: penalties_and_points
  question: 'Si su licencia de Iowa es suspendida o revocada debido a un OWI (conducir
    bajo los efectos del alcohol o drogas) o falta de seguro, debe mantener una presentación
    de seguro SR-22 durante:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: B
  explanation: La ley de Iowa exige que los conductores mantengan un SR-22 (prueba
    de responsabilidad financiera) durante dos años a partir de la fecha en que finaliza
    la suspensión o revocación.
- id: 164
  category: penalties_and_points
  question: En Iowa, ¿cuál es la multa programada para un conductor o pasajero del
    asiento delantero (de 18 años o más) que no lleva puesto el cinturón de seguridad?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: La multa programada por una infracción del cinturón de seguridad en
    Iowa para adultos es de $50 más recargos y costos judiciales.
- id: 165
  category: penalties_and_points
  question: Para restablecer una licencia de conducir después de haber sido suspendida
    por razones DISTINTAS a un OWI (como el impago de multas), ¿cuál es la tarifa
    de restablecimiento en Iowa?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: La tarifa estándar de restablecimiento para una suspensión no relacionada
    con un OWI en Iowa es de $20.
- id: 166
  category: penalties_and_points
  question: En Iowa, ¿cuál es la multa programada para un conductor que sea sorprendido
    con un recipiente abierto de una bebida alcohólica en el área de pasajeros de
    un vehículo en una vía pública?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: La multa programada por una infracción de recipiente abierto en Iowa
    es de $200 más recargos.
- id: 167
  category: penalties_and_points
  question: 'Según la ley de Iowa, una condena por "carreras de velocidad" (drag racing)
    en una carretera pública resulta en:'
  choices:
    A: Una simple advertencia
    B: Una suspensión de 30 días
    C: Revocación obligatoria de la licencia
    D: Solo una multa de $50
  answer: C
  explanation: El Código de Iowa 321.278 establece que a una persona condenada por
    carreras de velocidad se le revocará la licencia de conducir por parte del DOT.
- id: 168
  category: sharing_the_road
  question: Según la ley de Iowa, ¿cuál es la multa mínima por una condena de primera
    ofensa por rebasar ilegalmente un autobús escolar?
  choices:
    A: $100
    B: $250
    C: $345
    D: $500
  answer: C
  explanation: La ley de Iowa (321.372) exige una multa significativa por rebasar
    ilegalmente un autobús escolar. Según las actualizaciones recientes, la multa
    base para una primera ofensa es de $345, más recargos y costos judiciales.
- id: 169
  category: sharing_the_road
  question: Al rebasar a un ciclista en Iowa, ¿qué exige la ley que haga con respecto
    al uso del carril?
  choices:
    A: Permanecer en su carril y tocar la bocina para advertirles
    B: Rebasar con al menos un pie de distancia
    C: Cambiar de carril para rebasar si es una carretera de varios carriles, o rebasar
      a una distancia segura
    D: Las bicicletas deben moverse al arcén para dejarle pasar
  answer: C
  explanation: La ley de Iowa exige que los vehículos motorizados rebasen a las bicicletas
    a una "distancia segura". En carreteras de varios carriles, debe cambiarse al
    carril que no esté ocupado por el ciclista.
- id: 170
  category: sharing_the_road
  question: En Iowa, si conduce por una carretera con al menos dos carriles en cada
    dirección y un autobús escolar está detenido en la dirección opuesta con las luces
    rojas intermitentes, ¿es necesario detenerse?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar
    B: No, puede continuar con precaución
    C: Solo si hay una mediana física
    D: Solo si el conductor del autobús le indica que continúe
  answer: B
  explanation: En Iowa, en una carretera con al menos dos carriles en cada dirección,
    no tiene que detenerse si viaja en la dirección opuesta a un autobús escolar,
    aunque debe mantener la precaución.
- id: 171
  category: sharing_the_road
  question: ¿Qué es la 'No-Zone' (Zona de No Visibilidad) en relación con los camiones
    grandes en Iowa?
  choices:
    A: La zona de límite de velocidad para camiones
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: Un carril restringido solo para camiones
    D: El área donde no se permite estacionar camiones
  answer: B
  explanation: La 'No-Zone' se refiere a los grandes puntos ciegos alrededor de un
    camión donde el conductor no puede ver su vehículo. Si usted no puede ver la cara
    del conductor del camión en su espejo lateral, él no puede verlo a usted.
- id: 172
  category: sharing_the_road
  question: 'Cuando un peatón cruza la calle guiado por un perro de servicio o lleva
    un bastón blanco, la ley de Iowa le exige:'
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Ceder el derecho de paso y tomar precauciones adicionales
    C: Continuar si no están en su carril específico
    D: Esperar a que le hagan una señal para pasar
  answer: B
  explanation: La ley de Iowa establece que los conductores deben ceder el derecho
    de paso a cualquier peatón ciego que lleve un bastón blanco o utilice un perro
    de servicio.
- id: 173
  category: sharing_the_road
  question: En cuanto a la seguridad de las motocicletas, ¿cuál es la distancia de
    seguimiento recomendada para un vehículo detrás de una motocicleta en Iowa?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: Al menos 3 a 4 segundos
    D: Exactamente la longitud de dos autos
  answer: C
  explanation: Debido a que las motocicletas pueden detenerse mucho más rápido que
    los autos y se ven afectadas más fácilmente por las condiciones de la carretera,
    Iowa recomienda una distancia de seguimiento de al menos 3 a 4 segundos.
- id: 174
  category: sharing_the_road
  question: En Iowa, ¿es legal que una motocicleta realice 'lane splitting' (circular
    entre filas de vehículos detenidos o en movimiento)?
  choices:
    A: Sí, es legal a bajas velocidades
    B: Sí, pero solo en autopistas interestatales
    C: No, es ilegal en Iowa
    D: Es legal solo durante una congestión de tráfico intensa
  answer: C
  explanation: El 'lane splitting' (división de carril) no está permitido en Iowa.
    Las motocicletas tienen derecho al uso total de un carril, y ningún vehículo motorizado
    debe conducirse de manera que prive a cualquier motocicleta del uso total de un
    carril.
- id: 175
  category: sharing_the_road
  question: Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, ¿cuál es el procedimiento correcto en Iowa?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Acelerar para salir del camino
    C: Hacerse a la orilla derecha de la carretera y detenerse
    D: Moverse al carril izquierdo para dejarlos pasar por la derecha
  answer: C
  explanation: La ley de Iowa exige que los conductores se muevan hacia el borde derecho
    o la acera de la carretera, lejos de las intersecciones, y se detengan hasta que
    el vehículo de emergencia haya pasado.
- id: 176
  category: sharing_the_road
  question: 'Un emblema de vehículo de movimiento lento (un triángulo naranja con
    un borde reflectante rojo) debe mostrarse en vehículos que viajan a velocidades
    de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: En Iowa, el emblema de vehículo de movimiento lento es obligatorio
    en todos los vehículos diseñados para viajar a velocidades de 25 mph o menos,
    como maquinaria agrícola o carruajes tirados por caballos.
- id: 177
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión a menudo puede:'
  choices:
    A: Girar desde el carril izquierdo
    B: Permanecer completamente en el carril derecho
    C: Abrirse ampliamente hacia la izquierda para completar el giro
    D: Detenerse y esperar a que todo el tráfico se despeje antes de girar
  answer: C
  explanation: Los camiones grandes tienen un radio de giro amplio y pueden necesitar
    abrirse hacia la izquierda para no subir al bordillo al hacer un giro a la derecha.
    Los conductores nunca deben intentar meterse entre el camión y el bordillo.
- id: 178
  category: sharing_the_road
  question: 'En Iowa, si se le condena por no ceder el paso a un vehículo de emergencia
    y ocurre un accidente que causa daños a la propiedad, su licencia será suspendida
    por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Bajo las sanciones de la ley 'Move Over' (Hacerse a un lado) de Iowa,
    si una infracción resulta en daños a la propiedad, la licencia del conductor será
    suspendida por 90 días además de las multas.
- id: 179
  category: sharing_the_road
  question: 'Los ciclistas en Iowa tienen los mismos derechos y responsabilidades
    que:'
  choices:
    A: Los peatones
    B: Los conductores de vehículos motorizados
    C: El equipo agrícola de movimiento lento
    D: No tienen derechos específicos en la carretera
  answer: B
  explanation: En Iowa, los ciclistas están sujetos a las mismas leyes de tránsito
    que los operadores de vehículos motorizados, incluyendo detenerse en las señales
    de alto y señalar los giros.
- id: 180
  category: sharing_the_road
  question: 'Al seguir a un camión grande por la noche, debe bajar sus luces (usar
    luces cortas) porque:'
  choices:
    A: Los espejos del camión reflejarán la luz brillante hacia los ojos del conductor
    B: Los conductores de camiones tienen mejor visión nocturna
    C: Las luces brillantes pueden dañar la cinta reflectante del camión
    D: No es necesario bajar las luces para los camiones
  answer: A
  explanation: Al igual que con los autos de pasajeros, debe bajar las luces altas
    cuando sigue a un camión para evitar cegar al conductor a través de sus grandes
    espejos laterales.
- id: 181
  category: sharing_the_road
  question: ¿Cuál es la regla para el tráfico en sentido contrario cuando un autobús
    escolar se detiene con las luces rojas parpadeando en el lado opuesto de la mediana
    en una carretera con al menos dos carriles en cada dirección y una mediana o barrera?
  choices:
    A: El tráfico en sentido contrario debe detenerse
    B: El tráfico en sentido contrario no está obligado a detenerse, pero debe proceder
      con precaución
    C: El tráfico en sentido contrario debe reducir la velocidad a 10 mph
    D: El tráfico en sentido contrario debe orillarse al acotamiento
  answer: B
  explanation: La ley de Iowa (321.372) establece que si un autobús está en una carretera
    con dos o más carriles en cada dirección y la vía está separada por una mediana
    o barrera, el conductor de un vehículo en el lado opuesto de la calzada no está
    obligado a detenerse.
- id: 182
  category: sharing_the_road
  question: Al rebasar a una bicicleta en Iowa, ¿cuánto espacio debe dejar un automovilista
    entre su vehículo y el ciclista?
  choices:
    A: Al menos un pie
    B: Al menos dos pies
    C: Una distancia segura hasta que el vehículo haya pasado la bicicleta de forma
      segura
    D: Las bicicletas deben rebasarse por la derecha
  answer: C
  explanation: La ley de Iowa exige que los automovilistas rebasen a las bicicletas
    a una "distancia segura" y no regresen al lado derecho de la carretera hasta estar
    a una distancia segura del ciclista.
- id: 183
  category: sharing_the_road
  question: En Iowa, ¿cuál de las siguientes afirmaciones es verdadera con respecto
    a las motocicletas y el uso del carril?
  choices:
    A: Las motocicletas no tienen derecho al ancho total de un carril
    B: Dos motocicletas pueden compartir legalmente un solo carril (circular en paralelo)
    C: Las motocicletas pueden realizar "filtrado de carril" (lane split) entre filas
      de autos detenidos
    D: Las motocicletas siempre deben circular por el acotamiento
  answer: B
  explanation: La ley de Iowa permite que dos motocicletas operen una al lado de la
    otra en un solo carril, pero el filtrado de carril (circular entre carriles de
    tráfico) es ilegal.
- id: 184
  category: sharing_the_road
  question: 'Los camiones comerciales grandes tienen puntos ciegos donde el conductor
    no puede ver a otros vehículos. Estos se denominan comúnmente:'
  choices:
    A: Zonas seguras (Safe Zones)
    B: Zonas prohibidas (No-Zones)
    C: Zonas despejadas (Clear Zones)
    D: Zonas amplias (Wide Zones)
  answer: B
  explanation: La "No-Zone" se refiere a los grandes puntos ciegos alrededor de la
    parte delantera, trasera y los lados de un camión donde el conductor del camión
    no puede ver a otros vehículos.
- id: 185
  category: sharing_the_road
  question: 'Si usted sigue a un camión y no puede ver la cara del conductor del camión
    en sus espejos laterales, usted está:'
  choices:
    A: En una buena posición para rebasar
    B: En el punto ciego del camión (No-Zone)
    C: A salvo de escombros en la carretera
    D: Siguiendo a una distancia legal
  answer: B
  explanation: 'Una regla general para compartir la carretera con camiones es: "Si
    no puedes ver al conductor en su espejo, él no puede verte a ti".'
- id: 186
  category: sharing_the_road
  question: En Iowa, ¿cuándo debe un ciclista usar una luz delantera y un reflector
    o luz trasera?
  choices:
    A: En todo momento
    B: Solo cuando circule por la acera
    C: Desde el atardecer hasta el amanecer
    D: Solo durante condiciones climáticas adversas
  answer: C
  explanation: La ley de Iowa (321.397) exige que las bicicletas estén equipadas con
    una luz blanca en la parte delantera y un reflector o luz roja en la parte trasera
    cuando se utilicen desde el atardecer hasta el amanecer.
- id: 187
  category: sharing_the_road
  question: En Iowa, si un peatón cruza la calle en un cruce de peatones no marcado
    en una intersección, ¿quién tiene el derecho de paso?
  choices:
    A: El automovilista
    B: El peatón
    C: Quien haya llegado primero a la intersección
    D: El automovilista, porque el cruce de peatones no está marcado
  answer: B
  explanation: La ley de Iowa (321.327) establece que los conductores deben ceder
    el paso a los peatones dentro de cualquier cruce de peatones marcado o no marcado
    en una intersección.
- id: 188
  category: sharing_the_road
  question: La ley de Iowa de "Hacerse a un lado" (Move Over) se aplica a ¿cuál de
    los siguientes vehículos estacionarios con luces intermitentes activadas?
  choices:
    A: Solo patrullas de policía y camiones de bomberos
    B: Solo ambulancias y grúas
    C: Solo vehículos de mantenimiento de servicios públicos y de construcción de
      carreteras
    D: Todos los anteriores, incluido cualquier vehículo estacionado con luces de
      emergencia intermitentes
  answer: D
  explanation: La ley Move Over de Iowa se amplió para incluir no solo a los vehículos
    de emergencia y mantenimiento, sino a cualquier vehículo estacionado con luces
    intermitentes, incluidas las luces de emergencia (hazards).
- id: 189
  category: vehicle_information
  question: Según el Manual del Conductor de Iowa, ¿cuándo debe encender los faros
    delanteros?
  choices:
    A: Desde 30 minutos después del atardecer hasta 30 minutos antes del amanecer
    B: Desde el atardecer hasta el amanecer
    C: Solo cuando esté lloviendo o nevando
    D: Desde una hora después del atardecer hasta una hora antes del amanecer
  answer: B
  explanation: La ley de Iowa exige que los faros delanteros estén encendidos desde
    el atardecer hasta el amanecer, o siempre que la visibilidad sea inferior a 500
    pies debido a condiciones como lluvia, nieve o niebla.
- id: 190
  category: vehicle_information
  question: 'En Iowa, los neumáticos se consideran inseguros y no cumplen con los
    requisitos legales si la banda de rodadura es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 1/16 de pulgada
    C: 1/8 de pulgada
    D: 1/4 de pulgada
  answer: B
  explanation: La ley de Iowa establece que los neumáticos son inseguros si están
    desgastados hasta el punto en que queda menos de 1/16 de pulgada de banda de rodadura.
- id: 191
  category: vehicle_information
  question: Si una carga se extiende ______ o más allá de la parte trasera de la carrocería
    de su vehículo en Iowa, debe colocar una bandera roja al final de la carga durante
    el día.
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: La ley de Iowa exige que se coloque una bandera roja (de al menos 16
    pulgadas cuadradas) al final de cualquier carga que se extienda cuatro pies o
    más más allá de la parte trasera del vehículo.
- id: 192
  category: vehicle_information
  question: ¿La ley de Iowa exige que el parabrisas y las ventanas laterales delanteras
    de un vehículo permitan el paso de al menos qué porcentaje de luz?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 90%
  answer: C
  explanation: El Código Administrativo de Iowa especifica que el parabrisas y las
    ventanas laterales delanteras deben tener una transmisión de luz de al menos el
    70%.
- id: 193
  category: vehicle_information
  question: 'Todo vehículo motorizado que circule por las autopistas de Iowa debe
    estar equipado con una bocina que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Iowa exige que todos los vehículos motorizados tengan una
    bocina en buen estado de funcionamiento capaz de emitir un sonido audible en condiciones
    normales desde una distancia no inferior a 200 pies.
- id: 194
  category: vehicle_information
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil por daños
    a la propiedad requerido para un vehículo de pasajeros estándar en Iowa?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: C
  explanation: La ley de responsabilidad financiera de Iowa exige una cobertura mínima
    de responsabilidad civil de $20,000 por lesiones o muerte de una persona, $40,000
    por dos o más personas y $15,000 por daños a la propiedad (20/40/15).
- id: 195
  category: vehicle_information
  question: 'En Iowa, se debe exhibir un emblema de "Vehículo de movimiento lento"
    (Slow Moving Vehicle) en la parte trasera de cualquier vehículo que esté diseñado
    para una velocidad máxima de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema triangular reflectante naranja y rojo es obligatorio en
    los vehículos diseñados para viajar a velocidades de 25 mph o menos.
- id: 196
  category: vehicle_information
  question: 'Según la Ley de Restricción para Niños de Iowa, un niño debe estar asegurado
    en un sistema de retención infantil orientado hacia atrás hasta que tenga al menos:'
  choices:
    A: 1 año de edad Y pese 20 libras
    B: 2 años de edad
    C: 6 meses de edad
    D: 1 año de edad, independientemente del peso
  answer: A
  explanation: La ley de Iowa (321.446) exige que los niños menores de un año y que
    pesen menos de 20 libras estén asegurados en un sistema de retención infantil
    orientado hacia atrás.
- id: 197
  category: vehicle_information
  question: 'En Iowa, la placa de matrícula trasera debe estar iluminada por una luz
    blanca para que sea claramente legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Iowa exige que la placa de matrícula trasera esté iluminada
    para que sea visible y legible desde una distancia de 50 pies hacia atrás.
- id: 198
  category: vehicle_information
  question: ¿Cuándo es legal usar un "muffler cutout" (recorte de silenciador) o un
    dispositivo de derivación similar en una autopista de Iowa?
  choices:
    A: Solo en caminos rurales de grava
    B: Solo si el vehículo tiene más de 25 años
    C: Solo durante eventos de carreras autorizados
    D: Nunca es legal
  answer: D
  explanation: La ley de Iowa prohíbe el uso de recortes de silenciador, derivaciones
    o dispositivos similares en vehículos motorizados que circulen por vías públicas.
- id: 199
  category: vehicle_information
  question: La ley de Iowa exige que un vehículo tenga un espejo en el lado del conductor
    y un espejo adicional (interior o en el lado del pasajero) si la vista desde el
    espejo central está obstruida. ¿A qué distancia hacia atrás deben permitir ver
    estos espejos al conductor?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Iowa exige que los espejos estén colocados de manera que
    el conductor pueda ver la carretera a una distancia de al menos 200 pies hacia
    atrás.
- id: 200
  category: vehicle_information
  question: ¿Cuál es la regla de aplicación primaria con respecto a los cinturones
    de seguridad en Iowa?
  choices:
    A: La policía solo puede citarlo por el cinturón de seguridad si lo detienen por
      otro motivo
    B: La policía puede detenerlo y citarlo únicamente por no usar el cinturón de
      seguridad
    C: Los cinturones de seguridad solo son obligatorios para pasajeros menores de
      18 años
    D: Los cinturones de seguridad solo son obligatorios en las carreteras interestatales
  answer: B
  explanation: Iowa tiene una ley de cinturón de seguridad primaria, lo que significa
    que un oficial puede detener un vehículo y emitir una citación si observa que
    el conductor o los pasajeros del asiento delantero no usan el cinturón de seguridad.
- id: 201
  category: vehicle_information
  question: En Iowa, si las luces direccionales de su vehículo no funcionan, debe
    usar señales manuales. ¿Cuál es la señal manual correcta para un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido recto hacia afuera
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido hacia arriba en un ángulo de 90 grados.
- id: 202
  category: vehicle_information
  question: Al encontrarse con un vehículo que viene en sentido contrario por la noche
    en Iowa, ¿a cuántos pies de distancia debe bajar las luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Iowa exige que los conductores bajen sus luces altas cuando
    se encuentren a menos de 500 pies de un vehículo que viene en sentido contrario.
- id: 203
  category: vehicle_information
  question: 'Según la ley de Iowa, los neumáticos se consideran inseguros y deben
    reemplazarse si la profundidad de la banda de rodadura es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Iowa (y la mayoría de los estándares de seguridad) especifica
    que los neumáticos son inseguros si tienen menos de 2/32 de pulgada de banda de
    rodadura.
- id: 204
  category: vehicle_information
  question: En Iowa, ¿en qué período de tiempo está legalmente permitido el uso de
    neumáticos para nieve con clavos?
  choices:
    A: Del 1 de octubre al 1 de marzo
    B: Del 1 de noviembre al 1 de abril
    C: Del 1 de diciembre al 31 de marzo
    D: Del 15 de noviembre al 15 de abril
  answer: B
  explanation: La ley de Iowa permite el uso de neumáticos con clavos únicamente desde
    el 1 de noviembre hasta el 1 de abril de cada año.
- id: 205
  category: vehicle_information
  question: La ley de Iowa exige que el freno de pie sea capaz de detener el vehículo
    a una distancia de ____ pies cuando se viaja a 20 mph en pavimento seco.
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de Iowa establece que el freno de pie debe
    ser capaz de detener el vehículo en un tramo de 30 pies a una velocidad de 20
    mph.
- id: 206
  category: vehicle_information
  question: Todo vehículo motorizado en Iowa debe tener un espejo retrovisor que permita
    al conductor ver la carretera a una distancia de al menos ____ pies hacia atrás.
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Iowa exige un espejo ubicado para reflejar al conductor una
    vista de la carretera a una distancia de al menos 200 pies hacia atrás.
- id: 207
  category: vehicle_information
  question: Las luces direccionales de un vehículo en Iowa deben ser visibles desde
    una distancia no menor a ____ pies bajo la luz solar normal.
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: El Código de Iowa exige que las señales de giro sean visibles desde
    una distancia no menor a 100 pies.
- id: 208
  category: vehicle_information
  question: La ley de Iowa especifica que los faros delanteros deben estar montados
    a una altura no menor de 24 pulgadas y no más de ____ pulgadas del suelo.
  choices:
    A: 48 pulgadas
    B: 54 pulgadas
    C: 60 pulgadas
    D: 72 pulgadas
  answer: B
  explanation: El Código de Iowa 321.385 especifica que los faros delanteros deben
    estar montados entre 24 y 54 pulgadas del suelo.
- id: 209
  category: vehicle_information
  question: Todo vehículo motorizado en Iowa debe estar equipado con al menos una
    luz trasera que emita una luz roja claramente visible desde una distancia de ____
    pies hacia atrás.
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Iowa exige que las luces traseras sean visibles desde una
    distancia de 500 pies hacia atrás.
- id: 210
  category: signs_and_signals
  question: En Iowa, se coloca un triángulo naranja fluorescente con un borde rojo
    reflectante en la parte trasera de los vehículos que viajan a ¿qué velocidad máxima?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Según el Manual del Conductor de Iowa, el símbolo de vehículo de movimiento
    lento es obligatorio en todos los vehículos diseñados para viajar a velocidades
    de 35 mph o menos.
- id: 211
  category: signs_and_signals
  question: ¿Dónde se coloca normalmente una señal en forma de banderín de "Zona de
    No Rebasar" en las carreteras de Iowa?
  choices:
    A: En el lado derecho de la carretera al comienzo de la zona
    B: En el lado izquierdo de la carretera al comienzo de la zona
    C: Elevada sobre el carril central
    D: Solo al final de la zona
  answer: B
  explanation: En Iowa, la señal amarilla en forma de banderín de "Zona de No Rebasar"
    es única porque se coloca en el lado izquierdo de la carretera para que sea visible
    para los conductores que intentan rebasar.
- id: 212
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico amarilla intermitente en una intersección
    de Iowa?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Acelerar para despejar la intersección
    C: Proceder con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con precaución a través de la intersección.
- id: 213
  category: signs_and_signals
  question: En Iowa, ¿qué significan las líneas amarillas continuas dobles en el centro
    de la carretera?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Está prohibido rebasar en ambas direcciones
    D: Tráfico en un solo sentido
  answer: C
  explanation: Las líneas amarillas continuas dobles indican que no se permite rebasar
    a los vehículos que viajan en ninguna de las dos direcciones.
- id: 214
  category: signs_and_signals
  question: Cuando ve una flecha amarilla intermitente en un carril de giro exclusivo
    en Iowa, ¿qué debe hacer?
  choices:
    A: Detenerse y esperar a una flecha verde
    B: Girar inmediatamente ya que usted tiene el derecho de paso
    C: Ceder el paso al tráfico en sentido contrario y a los peatones, luego girar
      con precaución
    D: Solo girar si hay un oficial de policía presente
  answer: C
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero primero debe ceder el paso al tráfico en sentido contrario
    y a los peatones.
- id: 215
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de pentágono (cinco lados)
    en Iowa?
  choices:
    A: Ceder el derecho de paso
    B: Cruce de ferrocarril más adelante
    C: Zona escolar o cruce escolar
    D: Zona de no rebasar
  answer: C
  explanation: Una señal de cinco lados se utiliza exclusivamente para advertir a
    los conductores que están entrando en una zona escolar o que se aproximan a un
    cruce escolar.
- id: 216
  category: signs_and_signals
  question: Para usar una señal manual para un giro a la derecha en Iowa, ¿cómo debe
    posicionarse el brazo del conductor?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba en un ángulo de 90 grados
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    doblado hacia arriba en un ángulo de 90 grados.
- id: 217
  category: signs_and_signals
  question: 'En Iowa, una línea blanca continua pintada en el pavimento en el lado
    derecho de la carretera se conoce como:'
  choices:
    A: Línea de parada
    B: Línea central
    C: Línea de niebla (fog line)
    D: Línea de ceder el paso
  answer: C
  explanation: El Manual del Conductor de Iowa se refiere a la línea blanca continua
    en el borde derecho de la carretera como una "línea de niebla", la cual ayuda
    a los conductores a mantenerse en la carretera durante condiciones de poca visibilidad.
- id: 218
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla redonda con una "X" negra y las letras
    "RR"?
  choices:
    A: Hay un área de descanso más adelante
    B: Una intersección de camino rural
    C: Un cruce de ferrocarril más adelante
    D: Una superficie de carretera irregular
  answer: C
  explanation: Una señal amarilla redonda con una "X" negra y "RR" es una señal circular
    de advertencia avanzada para un cruce de ferrocarril.
- id: 219
  category: signs_and_signals
  question: 'Cuando un autobús escolar en Iowa tiene sus luces ámbar (amarillas) intermitentes,
    significa que:'
  choices:
    A: El autobús se está averiando
    B: El autobús se está preparando para detenerse para cargar o descargar niños
    C: El autobús viaja por encima del límite de velocidad
    D: Usted debe detenerse inmediatamente
  answer: B
  explanation: Las luces ámbar intermitentes en un autobús escolar advierten a los
    conductores que el autobús está a punto de detenerse. Los conductores deben reducir
    la velocidad y estar preparados para detenerse cuando las luces rojas parpadeen.
- id: 220
  category: signs_and_signals
  question: En Iowa, ¿cuál es el significado de una señal naranja en forma de diamante?
  choices:
    A: Información reglamentaria
    B: Servicio y guía
    C: Advertencia de construcción o mantenimiento
    D: Área de recreación pública
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan para alertar
    a los conductores sobre operaciones de construcción, mantenimiento o servicios
    públicos en la carretera o cerca de ella.
- id: 221
  category: signs_and_signals
  question: ¿Qué debe hacer ante un semáforo en rojo intermitente en Iowa?
  choices:
    A: Reducir la velocidad y continuar si el camino está despejado
    B: Detenerse solo si hay otro tráfico
    C: Detenerse por completo y luego continuar cuando sea seguro hacerlo
    D: Esperar a que la luz cambie a verde fijo
  answer: C
  explanation: Una luz roja intermitente se trata exactamente como una señal de alto
    (stop); debe detenerse por completo y ceder el paso.
- id: 222
  category: signs_and_signals
  question: 'Un carril marcado con una línea amarilla continua y una línea amarilla
    discontinua a cada lado, utilizado por vehículos que viajan en cualquier dirección
    para girar, se llama:'
  choices:
    A: Carril para vehículos de alta ocupación
    B: Carril compartido para girar a la izquierda
    C: Carril reversible
    D: Carril de rebase
  answer: B
  explanation: Un carril compartido para girar a la izquierda se encuentra en el centro
    de una calle y es utilizado por vehículos que giran a la izquierda desde cualquier
    dirección.
- id: 223
  category: signs_and_signals
  question: En Iowa, ¿qué significa una señal blanca con un círculo rojo y una barra
    roja sobre un símbolo?
  choices:
    A: La acción mostrada es recomendada
    B: La acción mostrada está prohibida
    C: La acción mostrada es solo para camiones
    D: La acción mostrada está permitida después de detenerse
  answer: B
  explanation: Un círculo rojo con una barra es una señal estándar de 'prohibición',
    lo que significa que la acción representada (como un giro en U o un giro a la
    derecha) no está permitida.
- id: 224
  category: signs_and_signals
  question: En Iowa, se utiliza una señal en forma de banderín (un triángulo que apunta
    a la derecha) para indicar una 'Zona de No Rebase'. ¿Dónde se coloca esta señal
    de manera única?
  choices:
    A: En el lado derecho de la carretera al comienzo de la zona
    B: En el lado izquierdo de la carretera al comienzo de la zona
    C: Elevada en el centro del carril
    D: Solo en la parte trasera de vehículos de movimiento lento
  answer: B
  explanation: En Iowa, la señal de 'Zona de No Rebase' en forma de banderín se coloca
    en el lado izquierdo de la carretera para proporcionar una advertencia adicional
    a los conductores de que no pueden rebasar.
- id: 225
  category: signs_and_signals
  question: 'Según el Manual del Conductor de Iowa, el emblema de ''Vehículo de Movimiento
    Lento'' (un triángulo naranja reflectante) debe mostrarse en la parte trasera
    de los vehículos que viajan a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: La ley de Iowa exige que cualquier vehículo diseñado para viajar a
    velocidades de 25 mph o menos debe mostrar un emblema de vehículo de movimiento
    lento cuando se opera en carreteras públicas.
- id: 226
  category: signs_and_signals
  question: En Iowa, ¿qué significa una luz de semáforo amarilla intermitente?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Lo mismo que una señal de alto
    C: Continuar con precaución
    D: Ceder el paso solo al tráfico que viene en sentido contrario
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y continuar con precaución en la intersección.
- id: 227
  category: signs_and_signals
  question: 'Según la ley de Iowa, se le permite girar a la izquierda con luz roja
    ÚNICAMENTE cuando:'
  choices:
    A: Gira desde una calle de doble sentido hacia una calle de un solo sentido
    B: Gira desde una calle de un solo sentido hacia otra calle de un solo sentido
    C: No hay tráfico en sentido contrario
    D: Los giros a la izquierda en rojo nunca están permitidos en Iowa
  answer: B
  explanation: La ley de Iowa permite un giro a la izquierda en rojo solo si está
    girando desde el carril izquierdo de una calle de un solo sentido hacia otra calle
    de un solo sentido, después de detenerse por completo y ceder el paso al tráfico
    y a los peatones.
- id: 228
  category: signs_and_signals
  question: Al acercarse a un cruce de ferrocarril en Iowa que tiene una señal de
    advertencia amarilla circular con una 'X' y las letras 'RR', ¿qué debe hacer?
  choices:
    A: Acelerar para cruzar las vías rápidamente
    B: Detenerse inmediatamente y esperar un tren
    C: Reducir la velocidad y estar preparado para detenerse
    D: Ignorar la señal si no hay luces parpadeando
  answer: C
  explanation: La señal amarilla circular es una señal de advertencia anticipada que
    le indica que debe reducir la velocidad, mirar y escuchar si viene un tren, y
    estar preparado para detenerse si es necesario.
- id: 229
  category: signs_and_signals
  question: ¿Cuál es el significado de una línea blanca continua pintada en el pavimento
    entre carriles de tráfico que se mueven en la misma dirección?
  choices:
    A: Se le anima a cambiar de carril
    B: Debe permanecer en su carril; se desaconseja el cambio de carril
    C: El carril es solo para vehículos compartidos (carpools)
    D: El tráfico se mueve en la dirección opuesta
  answer: B
  explanation: Una línea blanca continua indica que se desaconsejan los cambios de
    carril por razones de seguridad, aunque no están estrictamente prohibidos como
    una línea continua doble.
- id: 230
  category: signs_and_signals
  question: 'En Iowa, una señal en forma de diamante con fondo naranja se utiliza
    para:'
  choices:
    A: Zonas escolares
    B: Advertencias generales
    C: Zonas de construcción y mantenimiento
    D: Señales de guía e información
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para advertir a los conductores sobre condiciones en áreas de construcción o mantenimiento.
- id: 231
  category: signs_and_signals
  question: ¿Qué significa una señal de 'Aspa' (Crossbuck) en un cruce de ferrocarril
    en Iowa?
  choices:
    A: Es lo mismo que una señal de Ceda el Paso; debe ceder el paso a cualquier tren
    B: Debe detenerse en todo momento
    C: Es solo una sugerencia para reducir la velocidad
    D: Indica el número de vías
  answer: A
  explanation: La señal de aspa de ferrocarril es una señal reguladora que tiene el
    mismo significado que una señal de ceda el paso; debe ceder el derecho de paso
    a cualquier tren que se aproxime.
- id: 232
  category: signs_and_signals
  question: En Iowa, ¿de qué color son las señales de 'Servicio' que proporcionan
    información sobre gasolina, comida y alojamiento?
  choices:
    A: Verde
    B: Azul
    C: Marrón
    D: Amarillo
  answer: B
  explanation: Las señales azules se utilizan para proporcionar información sobre
    servicios para el viajero, como gasolina, comida, alojamiento e instalaciones
    médicas.
- id: 233
  category: signs_and_signals
  question: 'Cuando un semáforo se pone en verde en Iowa, usted puede avanzar:'
  choices:
    A: Inmediatamente sin mirar
    B: Solo después de ceder el paso a los peatones y vehículos que aún se encuentran
      en la intersección
    C: Solo si va a girar a la derecha
    D: Después de esperar 3 segundos
  answer: B
  explanation: Una luz verde significa que puede avanzar, pero primero debe ceder
    el paso a cualquier vehículo o peatón que permanezca en la intersección del ciclo
    de señal anterior.
- id: 234
  category: signs_and_signals
  question: En Iowa, ¿cuál es el significado de un 'Carril Central Compartido' marcado
    con líneas amarillas continuas y discontinuas en ambos lados?
  choices:
    A: Es para rebasar el tráfico más lento
    B: Es solo para vehículos de emergencia
    C: Es solo para realizar giros a la izquierda
    D: Es para estacionarse
  answer: C
  explanation: Un carril central compartido para girar está reservado para vehículos
    que realizan giros a la izquierda desde cualquier dirección y no debe usarse para
    rebasar o para el tránsito directo.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 235
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Avanzar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen con seguridad.
  id: 236
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 237
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 238
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 239
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reguladora blanca con una flecha de giro en U tachada significa
    que los giros en U están prohibidos en este lugar.
  id: 240
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 241
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 242
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 243
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 244
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 245
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 246
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de caminata cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 247
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 248
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 249
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces ferroviarios. Significa que debe ceder el paso a los trenes.
    Si se acerca un tren, debe detenerse.
  id: 250
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 251
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte sobre un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 252
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que el camino gire
    primero en un sentido y luego en el otro.
  id: 253
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 254
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 255
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Prepárese para una reducción en el ancho de la carretera y ajuste
    su posición en el carril.
  id: 256
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: El camino termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 257
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 258
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 259
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: El camino puede estar resbaladizo cuando está mojado
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 260
- image: hill.png
  category: signs_and_signals
  id: 261
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en el camino
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción en la carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
- image: signal_ahead.png
  category: signs_and_signals
  id: 262
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
- image: stop_ahead.png
  category: signs_and_signals
  id: 263
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
- image: cross_road.png
  category: signs_and_signals
  id: 264
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
- image: side_road.png
  category: signs_and_signals
  id: 265
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
- image: added_lane.png
  category: signs_and_signals
  id: 266
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere girar a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir incorporación (merging). El tráfico que entra desde
    la rampa tiene su propio carril nuevo.
- image: no_parking.png
  category: signs_and_signals
  id: 267
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
- image: handicap_parking.png
  category: signs_and_signals
  id: 268
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para discapacitados vigente pueden
    estacionar en estos espacios. Las infracciones conllevan multas elevadas.
