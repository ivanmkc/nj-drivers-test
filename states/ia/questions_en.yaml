metadata:
  source: 2025 Iowa Driver's Manual
  total_questions: 266
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Iowa, what is the minimum age to apply for an instruction permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: A
  explanation: According to the Iowa Driver's Manual, a person must be at least 14
    years old to be eligible for an instruction permit.
- id: 2
  category: license_system
  question: Under Iowa's Graduated Driver Licensing (GDL) system, how long must a
    minor hold an instruction permit before they are eligible for an intermediate
    license?
  choices:
    A: 6 consecutive months
    B: 9 consecutive months
    C: 12 consecutive months
    D: 18 consecutive months
  answer: C
  explanation: Iowa law requires drivers under age 18 to hold an instruction permit
    for at least 12 consecutive months and remain accident and violation-free before
    upgrading to an intermediate license.
- id: 3
  category: license_system
  question: For the first six months of holding an Iowa intermediate license, how
    many unrelated passengers under age 18 are allowed in the vehicle?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: For the first six months of holding an intermediate license, the driver
    is limited to only one unrelated passenger under age 18, unless this restriction
    is waived by a parent or guardian.
- id: 4
  category: license_system
  question: What is the minimum age requirement for an Iowa Minor School License (MSL)?
  choices:
    A: 14 years old
    B: 14 and a half years old
    C: 15 years old
    D: 16 years old
  answer: B
  explanation: To be eligible for a Minor School License in Iowa, the student must
    be at least 14 and a half years old and meet specific school and residency requirements.
- id: 5
  category: license_system
  question: If you move to a new residence within Iowa, how many days do you have
    to notify the DOT of your address change?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Iowa law requires you to notify the DOT of a change of address within
    30 days of the move.
- id: 6
  category: license_system
  question: To obtain an Iowa intermediate license, how many hours of supervised driving
    must be completed and logged while holding a permit?
  choices:
    A: 15 hours, 2 of which must be at night
    B: 20 hours, 2 of which must be at night
    C: 30 hours, 5 of which must be at night
    D: 40 hours, 10 of which must be at night
  answer: B
  explanation: Iowa GDL requirements state that a permit holder must complete 20 hours
    of supervised driving, including at least 2 hours of night driving, before applying
    for an intermediate license.
- id: 7
  category: license_system
  question: In Iowa, what is the Blood Alcohol Concentration (BAC) limit for drivers
    under the age of 21?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Iowa has a 'zero tolerance' law for minors. If a driver under 21 is
    found with a BAC of 0.02% or higher, their driving privileges will be revoked.
- id: 8
  category: license_system
  question: What is the standard vision requirement to obtain an Iowa driver's license
    without restrictions?
  choices:
    A: 20/20 in both eyes
    B: 20/30 in at least one eye
    C: 20/40 in at least one eye
    D: 20/50 in both eyes
  answer: C
  explanation: Iowa requires a minimum vision of 20/40 in at least one eye, with or
    without corrective lenses, for a standard non-commercial license.
- id: 9
  category: license_system
  question: Under Iowa law, a person is considered a 'Habitual Offender' if they are
    convicted of how many 'serious' moving violations within a 12-month period?
  choices:
    A: Two
    B: Three
    C: Five
    D: Six
  answer: B
  explanation: Iowa may suspend the license of a 'habitual violator,' which is defined
    as a driver convicted of three or more service-traceable moving violations within
    any 12-month period.
- id: 10
  category: license_system
  question: What are the restricted driving hours (curfew) for a driver with an Iowa
    intermediate license?
  choices:
    A: 10:00 PM to 6:00 AM
    B: 11:00 PM to 5:00 AM
    C: 12:00 AM to 6:00 AM
    D: 12:30 AM to 5:00 AM
  answer: D
  explanation: Drivers with an Iowa intermediate license may not drive between 12:30
    AM and 5:00 AM unless they have a waiver for school or work, or are accompanied
    by a designated adult.
- id: 11
  category: license_system
  question: If you are an Iowa resident and purchase a vehicle, how many days do you
    have to register it?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: Iowa law requires that you register your vehicle within 30 days from
    the date the vehicle was purchased or moved into the state.
- id: 12
  category: license_system
  question: When driving with an instruction permit in Iowa, who must be in the front
    passenger seat?
  choices:
    A: Any licensed driver over age 18
    B: A licensed parent, guardian, or immediate family member over 21, or another
      licensed adult over 25
    C: A licensed parent/guardian, or a person at least 21 years old with written
      permission from a parent/guardian
    D: Any person with at least 5 years of driving experience
  answer: C
  explanation: The supervisor must be a licensed parent/guardian, or a licensed family
    member at least 21, or another licensed adult at least 21 with written permission
    from the parent/guardian.
- id: 13
  category: license_system
  question: In Iowa, if you are under 18 and receive a moving violation conviction
    while holding an intermediate license, what is the mandatory consequence?
  choices:
    A: Immediate 1-year suspension
    B: Requirement to restart the 12-month violation-free period
    C: Mandatory 30-day jail sentence
    D: Permanent revocation of the license
  answer: B
  explanation: Under the GDL system, any conviction for a moving violation or being
    involved in a contributed accident requires the driver to restart the 12-month
    violation-free period before they can move to the next license stage.
- id: 14
  category: license_system
  question: How many years is a standard Iowa driver's license valid for if the driver
    is between the ages of 18 and 72?
  choices:
    A: 2 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: For most drivers between the ages of 18 and 72, the Iowa driver's license
    is issued for a period of eight years.
- id: 15
  category: license_system
  question: What is the minimum age to be eligible for a 'Full' (non-provisional)
    Iowa driver's license?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: In Iowa, a driver can obtain a full, non-provisional license at age
    17, provided they have met all the requirements of the intermediate license stage
    for at least 12 months.
- id: 16
  category: license_system
  question: To obtain an Iowa driver's license or ID card, how many documents proving
    Iowa residency must an applicant provide?
  choices:
    A: One document
    B: Two documents
    C: Three documents
    D: No documents are required if you have a birth certificate
  answer: B
  explanation: According to the Iowa DOT, applicants must provide two documents that
    prove Iowa residency, such as a utility bill, bank statement, or pay stub.
- id: 17
  category: license_system
  question: What is the minimum age to apply for an Iowa Class D (Chauffeur's) license,
    which is required for persons transporting 15 or fewer passengers for hire?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: C
  explanation: In Iowa, you must be at least 18 years old to qualify for a Class D
    (Chauffeur's) license.
- id: 18
  category: license_system
  question: Iowa law requires motor vehicle liability insurance. What is the minimum
    required coverage for bodily injury to or death of two or more persons in any
    one accident?
  choices:
    A: $20,000
    B: $40,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: Iowa's minimum liability insurance requirements are $20,000 for bodily
    injury to one person, $40,000 for bodily injury to two or more people, and $15,000
    for property damage.
- id: 19
  category: license_system
  question: If your Iowa driver's license is revoked for an OWI (Operating While Intoxicated)
    offense, what is the civil penalty fee required for reinstatement?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Iowa law mandates a $200 civil penalty for the reinstatement of a license
    revoked for OWI-related offenses.
- id: 20
  category: license_system
  question: A parent or guardian who has consented to a minor's driver's license application
    may withdraw that consent by filing a form with the DOT. This right exists until
    the minor reaches what age?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: C
  explanation: In Iowa, a parent or guardian can withdraw their consent for a minor's
    license at any time until the minor turns 18.
- id: 21
  category: license_system
  question: How many days before the expiration date are you allowed to renew your
    Iowa driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: D
  explanation: Iowa residents are permitted to renew their driver's license up to
    180 days before the expiration date.
- id: 22
  category: license_system
  question: New residents to Iowa must obtain an Iowa driver's license within how
    many days of establishing residency in the state?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Under Iowa law, you are considered an Iowa resident and must get an
    Iowa license within 30 days of establishing residency.
- id: 23
  category: license_system
  question: If you are under 18 and hold an Iowa instruction permit or intermediate
    license, what is the consequence of being convicted of a moving violation or being
    involved in a contributed accident?
  choices:
    A: Immediate permanent revocation of driving privileges
    B: A mandatory 12-month suspension
    C: Requirement to attend a Remedial Driver Improvement interview
    D: A $500 fine and no further action
  answer: C
  explanation: Under Iowa's GDL program, any moving violation conviction or contributed
    accident triggers a mandatory Remedial Driver Improvement interview.
- id: 24
  category: license_system
  question: An Iowa driver's license is generally considered valid for driving purposes
    for how many days after the expiration date printed on the license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: There is no grace period
  answer: B
  explanation: Iowa law provides a 60-day grace period after the expiration date during
    which the license is still valid for driving in Iowa.
- id: 25
  category: license_system
  question: To qualify for an Iowa Minor School License (MSL), the student must live
    at least how far from the school they are attending?
  choices:
    A: 0.5 miles
    B: 1 mile
    C: 2 miles
    D: 5 miles
  answer: B
  explanation: To be eligible for a School License in Iowa, the student must live
    one mile or more from the school they are enrolled in.
- id: 26
  category: license_system
  question: What is the minimum number of classroom hours required for a state-approved
    driver education course in Iowa?
  choices:
    A: 15 hours
    B: 20 hours
    C: 30 hours
    D: 40 hours
  answer: C
  explanation: Iowa driver education must include a minimum of 30 hours of classroom
    instruction and 6 hours of laboratory (behind-the-wheel) instruction.
- id: 27
  category: license_system
  question: If you fail the Iowa driver's license knowledge (written) test, how long
    must you wait before you are eligible to retake it?
  choices:
    A: Until the next business day
    B: 3 days
    C: 7 days
    D: 30 days
  answer: A
  explanation: Iowa DOT policy allows applicants who fail the knowledge test to retake
    it as early as the next business day.
- id: 28
  category: license_system
  question: When applying for an Iowa Intermediate License, how many of the 20 required
    hours of supervised driving must be completed at night (between sunset and sunrise)?
  choices:
    A: 1 hour
    B: 2 hours
    C: 5 hours
    D: 10 hours
  answer: B
  explanation: While holding an instruction permit, Iowa requires 20 hours of supervised
    driving, of which at least 2 hours must be at night.
- id: 29
  category: license_system
  question: 'If an Iowa driver is convicted of a first-offense OWI and their BAC was
    .08 or greater, their license will be revoked for a minimum of:'
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: One year
  answer: C
  explanation: A first-offense OWI conviction in Iowa results in a minimum 180-day
    license revocation.
- id: 30
  category: license_system
  question: In Iowa, if you are under age 18 and want to upgrade from an Intermediate
    License to a Full License, you must have been accident-free and violation-free
    for how many consecutive months?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 18 months
  answer: C
  explanation: To obtain a Full License at age 17, an Iowa driver must have held an
    Intermediate License for at least 12 consecutive months without any accidents
    or moving violations.
- id: 31
  category: driver_testing
  question: If you fail the Iowa driving (road) test, what is the minimum waiting
    period before you are eligible to retake it?
  choices:
    A: The same day
    B: One day
    C: Seven days
    D: Thirty days
  answer: B
  explanation: According to the Iowa Driver's Manual, if you fail the driving test,
    you must wait at least one day before you can take it again.
- id: 32
  category: driver_testing
  question: The Iowa knowledge (written) test consists of 35 multiple-choice questions.
    What is the minimum number of correct answers required to pass?
  choices:
    A: '25'
    B: '28'
    C: '30'
    D: '32'
  answer: B
  explanation: To pass the Iowa knowledge test, you must answer at least 28 out of
    35 questions correctly, which is a passing score of 80%.
- id: 33
  category: driver_testing
  question: To qualify for an Iowa driver's license without a 'left and right outside
    rearview mirror' restriction, what is the minimum required peripheral vision?
  choices:
    A: 90 degrees
    B: 110 degrees
    C: 140 degrees
    D: 180 degrees
  answer: C
  explanation: Iowa requires a visual field of at least 140 degrees. If the field
    of vision is less than 140 degrees, the license will be restricted to include
    outside rearview mirrors.
- id: 34
  category: driver_testing
  question: If you legally change your name (e.g., through marriage or court order),
    how many days do you have to notify the Iowa DOT and obtain a replacement license?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Under Iowa law, you must notify the DOT of a legal name change within
    30 days.
- id: 35
  category: driver_testing
  question: A standard Iowa Class C non-commercial driver's license allows you to
    operate vehicles with a Gross Vehicle Weight Rating (GVWR) of up to how many pounds?
  choices:
    A: 10,000 lbs
    B: 16,000 lbs
    C: 26,000 lbs
    D: 33,000 lbs
  answer: C
  explanation: A Class C license allows the operation of a vehicle with a GVWR of
    less than 26,001 pounds.
- id: 36
  category: driver_testing
  question: If your Iowa driver's license is suspended for a non-alcohol related moving
    violation, what is the standard reinstatement fee you must pay?
  choices:
    A: $20
    B: $50
    C: $100
    D: $200
  answer: A
  explanation: Iowa Code 321.191 specifies a $20 reinstatement fee for most suspensions
    that are not related to OWI (Operating While Intoxicated) offenses.
- id: 37
  category: driver_testing
  question: Under Iowa's 'Parent-Taught Driver Education' option, how many hours of
    classroom instruction must the student complete?
  choices:
    A: 15 hours
    B: 30 hours
    C: 45 hours
    D: 60 hours
  answer: B
  explanation: The Iowa parent-taught driver education program requires 30 hours of
    classroom instruction and 40 hours of driving (including 4 hours of night driving).
- id: 38
  category: driver_testing
  question: If you fail the vision screening at the Iowa DOT service center, what
    is the required next step?
  choices:
    A: You are permanently barred from driving
    B: You must wait 30 days to retake the screening
    C: You must take a driving test immediately
    D: You must have a Vision Report (Form 430032) completed by a licensed vision
      specialist
  answer: D
  explanation: If you fail the vision screening, the DOT will provide you with a Vision
    Report form to be completed by an ophthalmologist or optometrist.
- id: 39
  category: driver_testing
  question: When taking the Iowa road test, which of the following must be presented
    for the vehicle being used?
  choices:
    A: Current registration and proof of insurance
    B: The vehicle's title
    C: A notarized letter from the vehicle owner
    D: A maintenance log from the last 12 months
  answer: A
  explanation: The applicant must provide the vehicle for the road test, and it must
    have a current registration and valid proof of financial responsibility (insurance).
- id: 40
  category: driver_testing
  question: Under the 'Motor Voter' law, at what age can an Iowa resident first register
    to vote at the DOT service center while applying for a license?
  choices:
    A: 14 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: C
  explanation: In Iowa, you can register to vote when you are at least 17 years old,
    though you cannot actually vote until you are 18 (or 17 for primary elections
    if you will be 18 by the general election).
- id: 41
  category: driver_testing
  question: How many times per day is an applicant permitted to attempt the Iowa knowledge
    (written) test?
  choices:
    A: Once
    B: Twice
    C: Three times
    D: Unlimited until they pass
  answer: A
  explanation: Iowa DOT policy generally limits applicants to one attempt at the knowledge
    test per day.
- id: 42
  category: driver_testing
  question: If you move to Iowa and have a valid out-of-state license, which test
    is typically the only one required to obtain an Iowa license?
  choices:
    A: The road test
    B: The knowledge test
    C: The vision test
    D: No tests are required
  answer: C
  explanation: Generally, if you have a valid out-of-state license, the knowledge
    and driving tests are waived, but you must still pass the vision screening.
- id: 43
  category: driver_testing
  question: In Iowa, for how many years is a driver's license valid if the applicant
    is 72 years of age or older?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: 8 years
  answer: B
  explanation: While licenses for younger adults are valid for 8 years, once a driver
    reaches age 72, the license is valid for only 2 years.
- id: 44
  category: driver_testing
  question: To operate a moped in Iowa, a person must have a valid license. If they
    do not have a standard driver's license, they must be at least what age to apply
    for a moped-only license?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: A
  explanation: In Iowa, a person must be at least 14 years old to apply for a moped-only
    license (Class C - Restricted) after completing a moped education course.
- id: 45
  category: driver_testing
  question: In Iowa, what is the maximum speed limit for vehicles on rural interstate
    highways unless otherwise posted?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: B
  explanation: According to the Iowa Driver's Manual, the speed limit on rural interstate
    highways is 70 mph unless signs indicate otherwise.
- id: 46
  category: driver_testing
  question: 'Under Iowa law, you must file an ''Iowa Accident Report'' if an accident
    results in death, personal injury, or total property damage to any one person''s
    property of at least:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Iowa law requires a written report to be filed with the DOT if the
    accident involves a death, personal injury, or total property damage of $1,500
    or more.
- id: 47
  category: driver_testing
  question: 'Under Iowa''s Implied Consent Law, if you refuse to submit to chemical
    testing for the first time, your driving privileges will be revoked for:'
  choices:
    A: 90 days
    B: 180 days
    C: One year
    D: Two years
  answer: C
  explanation: If you refuse to take a chemical test when requested by a peace officer
    (Implied Consent), your license will be revoked for one year for a first offense.
- id: 48
  category: driver_testing
  question: In Iowa, what is the mandatory driver's license suspension period for
    a first-time conviction of unlawfully passing a school bus with its red lights
    flashing and stop arm extended?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: A first conviction for passing a school bus with flashing red lights
    results in a mandatory 30-day license suspension in addition to a fine.
- id: 49
  category: driver_testing
  question: 'Iowa''s ''Move Over'' law requires drivers approaching a stationary emergency
    or maintenance vehicle with flashing lights to:'
  choices:
    A: Stop completely and wait for a signal to pass
    B: Maintain speed but move to the left lane
    C: Change lanes if possible, or slow down and be prepared to stop if a lane change
      is not possible
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Iowa law requires drivers to move to a lane not adjacent to the stationary
    emergency/maintenance vehicle if possible; if not, they must slow down and be
    prepared to stop.
- id: 50
  category: driver_testing
  question: If an Iowa driver's vision is between 20/41 and 20/70 in their best eye,
    what restriction will typically be placed on their driver's license?
  choices:
    A: No restrictions
    B: Daylight driving only
    C: Driving only on roads with speed limits under 45 mph
    D: Corrective lenses not required
  answer: B
  explanation: In Iowa, if your vision is between 20/41 and 20/70, you may be restricted
    to 'Daylight driving only' (Restriction 1).
- id: 51
  category: driver_testing
  question: In Iowa, which passengers are required by law to wear a seat belt or be
    in a child restraint system?
  choices:
    A: Only the driver and front-seat passengers
    B: Only children under the age of 12
    C: The driver, front-seat passengers, and all passengers under age 18 regardless
      of seating position
    D: Only passengers in the front seat and children under age 6
  answer: C
  explanation: Iowa law requires the driver and all front-seat passengers to wear
    seat belts. Additionally, all passengers under age 18 must be secured by a seat
    belt or child restraint, regardless of where they sit in the vehicle.
- id: 52
  category: driver_testing
  question: 'To maintain a safe following distance under normal driving conditions
    in Iowa, drivers are encouraged to use the:'
  choices:
    A: One-car-length rule
    B: Two-second rule
    C: Three-second rule
    D: Five-second rule
  answer: C
  explanation: The Iowa Driver's Manual recommends the 'three-second rule' to maintain
    a safe following distance behind the vehicle in front of you.
- id: 53
  category: driver_testing
  question: When parking a vehicle on a public street in Iowa, the wheels must be
    parallel to and within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: Iowa Code 321.361 states that vehicles must be parked with the right-hand
    wheels parallel to and within 18 inches of the right-hand curb.
- id: 54
  category: driver_testing
  question: In Iowa, it is illegal to park your vehicle within how many feet of a
    fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: A
  explanation: According to Iowa Code 321.358, you may not stop, stand, or park a
    vehicle within 5 feet of a fire hydrant.
- id: 55
  category: driver_testing
  question: When driving at night in Iowa, you must dim your high beam headlights
    when you are within ____ feet of an oncoming vehicle and ____ feet when following
    another vehicle.
  choices:
    A: 500; 200
    B: 500; 400
    C: 1,000; 500
    D: 300; 300
  answer: B
  explanation: Iowa law requires you to dim your high beams within 500 feet of an
    oncoming vehicle and within 400 feet when following another vehicle.
- id: 56
  category: driver_testing
  question: Iowa's financial responsibility law requires drivers to carry liability
    insurance. What is the minimum required coverage for property damage in a single
    accident?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: C
  explanation: The minimum liability insurance requirements in Iowa are $20,000 for
    bodily injury to one person, $40,000 for bodily injury to two or more people,
    and $15,000 for property damage.
- id: 57
  category: driver_testing
  question: In Iowa, what is the fine for an individual improperly parking in a space
    designated for persons with disabilities?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: The fine for improperly parking in a space reserved for people with
    disabilities in Iowa is $200.
- id: 58
  category: driver_responsibility
  question: If you are involved in an accident in Iowa that meets the reporting threshold,
    how many hours do you have to file the report with the DOT?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 96 hours
  answer: C
  explanation: Iowa law requires that a written report of a qualifying accident be
    filed with the DOT within 72 hours of the occurrence.
- id: 59
  category: driver_responsibility
  question: Under Iowa's financial responsibility laws, what is the minimum required
    liability insurance coverage for property damage?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: C
  explanation: Iowa law requires a minimum of $15,000 in liability coverage for property
    damage in any one accident.
- id: 60
  category: driver_responsibility
  question: What does Iowa's 'Implied Consent' law mean for drivers?
  choices:
    A: You agree to keep your vehicle in safe working order.
    B: You consent to a chemical test for alcohol or drugs if a peace officer has
      reasonable grounds to believe you are OWI.
    C: You agree to carry insurance at all times.
    D: You consent to have your vehicle searched at any time.
  answer: B
  explanation: The Implied Consent law means that by operating a motor vehicle in
    Iowa, you have given consent to a chemical test (breath, blood, or urine) to determine
    alcohol concentration or the presence of drugs.
- id: 61
  category: driver_responsibility
  question: When selling a vehicle in Iowa, what should the seller do with the license
    plates?
  choices:
    A: Leave them on the vehicle for the new owner.
    B: Return them to the DOT immediately.
    C: Remove them and keep them; they do not stay with the vehicle.
    D: Destroy them in the presence of a notary.
  answer: C
  explanation: In Iowa, license plates belong to the owner, not the vehicle. When
    you sell or transfer a vehicle, you must remove the plates.
- id: 62
  category: driver_responsibility
  question: If an Iowa driver is required to file an SR-22 (Proof of Financial Responsibility)
    following a suspension, for how long must they usually maintain this filing?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: In most cases, Iowa requires an SR-22 to be maintained for two years
    from the date of the suspension or revocation.
- id: 63
  category: driver_responsibility
  question: Under the Non-Resident Violator Compact, what can happen if an Iowa driver
    fails to pay a traffic fine in another member state?
  choices:
    A: Nothing; Iowa only tracks in-state violations.
    B: The driver's Iowa license may be suspended until the fine is paid.
    C: The driver will be barred from leaving Iowa.
    D: The fine is automatically doubled but the license is unaffected.
  answer: B
  explanation: Iowa is a member of the Non-Resident Violator Compact. If you fail
    to resolve a traffic citation in another member state, the Iowa DOT can suspend
    your driving privileges.
- id: 64
  category: driver_responsibility
  question: For most passenger vehicles in Iowa, where must license plates be displayed?
  choices:
    A: Rear only
    B: Front only
    C: Both front and rear
    D: Rear and inside the front windshield
  answer: C
  explanation: Iowa law requires that most motor vehicles (except motorcycles and
    certain trucks) display license plates on both the front and the rear of the vehicle.
- id: 65
  category: driver_responsibility
  question: If you move to Iowa from another state, how many days do you have to obtain
    an Iowa driver's license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents who are not students or military personnel must obtain
    an Iowa driver's license within 30 days of establishing residency.
- id: 66
  category: driver_responsibility
  question: In Iowa, what is the minimum revocation period for a first-offense OWI
    (Operating While Intoxicated) conviction?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: A first-offense OWI in Iowa typically results in a license revocation
    period of 180 days.
- id: 67
  category: driver_responsibility
  question: 'If an Iowa driver refuses to submit to a chemical test under the Implied
    Consent Law for the first time, their license will be revoked for:'
  choices:
    A: 180 days
    B: 1 year
    C: 2 years
    D: Permanently
  answer: B
  explanation: Under Iowa law, refusing a chemical test for the first time results
    in a mandatory one-year license revocation.
- id: 68
  category: driver_responsibility
  question: 'Iowa''s ''Open Container'' law prohibits the possession of an open alcoholic
    beverage container in:'
  choices:
    A: Only the driver's hand
    B: The passenger area of any motor vehicle on a public street or highway
    C: The trunk of the vehicle
    D: The glove compartment if it is locked
  answer: B
  explanation: Iowa law prohibits open containers of alcohol in the passenger area
    of a motor vehicle, which includes any area readily accessible to the driver or
    passengers while seated.
- id: 69
  category: driver_responsibility
  question: If you are convicted of driving without valid liability insurance in Iowa
    and are involved in an accident, what is a potential penalty?
  choices:
    A: A fine only
    B: Suspension of driver's license and registration
    C: Mandatory 30 days in jail
    D: No penalty if it was your first accident
  answer: B
  explanation: Failure to show proof of financial responsibility (insurance) can lead
    to the suspension of your driver's license and vehicle registration.
- id: 70
  category: driver_responsibility
  question: When you purchase a vehicle in Iowa, you must apply for a new title and
    registration within how many days?
  choices:
    A: 7 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Iowa law requires that you apply for a title and registration within
    30 days of the date of purchase to avoid penalties.
- id: 71
  category: driver_responsibility
  question: 'In Iowa, if you are convicted of a ''serious violation'' such as speeding
    25 mph over the limit, the DOT may:'
  choices:
    A: Only issue a warning
    B: Suspend your license
    C: Require you to retake the driving test only
    D: Increase your registration fees
  answer: B
  explanation: The Iowa DOT has the authority to suspend the license of any 'habitual
    violator' or anyone convicted of a 'serious violation,' which includes excessive
    speeding (25+ mph over).
- id: 72
  category: driver_responsibility
  question: If an Iowa driver is convicted of operating a motor vehicle without the
    required liability insurance, what is the minimum fine (excluding surcharges and
    court costs)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Under Iowa Code 321.20B, the fine for failing to provide proof of financial
    responsibility (insurance) is $250, though it may be subject to additional surcharges.
- id: 73
  category: driver_responsibility
  question: Under Iowa's 'Implied Consent' law, what happens if you refuse to submit
    to a chemical test for alcohol or drugs when requested by a peace officer?
  choices:
    A: Your license will be revoked for at least one year.
    B: You will be fined $5,000 immediately.
    C: You will be sentenced to 30 days in jail.
    D: Nothing, as long as it is your first offense.
  answer: A
  explanation: Iowa's Implied Consent law means that by driving, you agree to be tested.
    Refusal to take a breath, blood, or urine test results in an automatic license
    revocation of one year for a first offense.
- id: 74
  category: driver_responsibility
  question: 'In Iowa, an SR-22 insurance filing is a ''high-risk'' certificate required
    for drivers who have:'
  choices:
    A: Failed to pay a speeding ticket.
    B: Had their license revoked for an OWI or under the Financial Responsibility
      law.
    C: Purchased a vehicle older than 20 years.
    D: Failed a vision screening at the DOT.
  answer: B
  explanation: An SR-22 is a form of proof of financial responsibility required for
    individuals whose licenses have been revoked or suspended due to OWI, or for failing
    to pay a judgment resulting from an accident.
- id: 75
  category: driver_responsibility
  question: 'If you are involved in an accident in Iowa and do not have insurance,
    and you are found liable for damages, your license will be suspended until:'
  choices:
    A: You pay a $50 fine.
    B: You wait 30 days.
    C: You provide proof of a settlement, a release from liability, or a payment agreement.
    D: You complete a defensive driving course.
  answer: C
  explanation: Under Iowa's Financial Responsibility law, if you are uninsured and
    involved in an accident with damage over $1,500, your license is suspended until
    you satisfy the claims against you or provide a security deposit.
- id: 76
  category: driver_responsibility
  question: 'In Iowa, using a hand-held electronic device to write, send, or read
    a text message while driving is considered a:'
  choices:
    A: Secondary offense (you must be stopped for something else first).
    B: Primary offense (you can be stopped solely for this violation).
    C: Legal action if you are over the age of 21.
    D: Violation that carries no fine for the first offense.
  answer: B
  explanation: As of July 1, 2017, texting while driving is a primary offense in Iowa,
    meaning law enforcement can pull you over specifically for that reason.
- id: 77
  category: driver_responsibility
  question: Under Iowa law, children must be secured in a child restraint system (car
    seat) until they reach what age?
  choices:
    A: 4 years old
    B: 6 years old
    C: 8 years old
    D: 12 years old
  answer: B
  explanation: Iowa law requires that children must be in a child restraint system
    until they are 6 years old. From age 6 to 18, they must be secured by a car seat
    or a seat belt.
- id: 78
  category: driver_responsibility
  question: 'Iowa''s ''Move Over'' law requires drivers to change lanes or slow down
    when approaching a vehicle with flashing lights. Failure to do so resulting in
    a crash can lead to a license suspension of up to:'
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: D
  explanation: Violations of the Move Over law that result in property damage or bodily
    injury can lead to significant fines and a license suspension of up to one year.
- id: 79
  category: driver_responsibility
  question: What is the maximum fine for littering on Iowa highways?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Littering is illegal in Iowa and can result in a fine of up to $1,000
    and/or community service.
- id: 80
  category: driver_responsibility
  question: The 'Motor Voter' law in Iowa allows citizens to do what at the DOT driver's
    license station?
  choices:
    A: Pay property taxes.
    B: Register to vote or update voter registration.
    C: Apply for a passport.
    D: Vote in a primary election.
  answer: B
  explanation: The National Voter Registration Act (Motor Voter) allows eligible citizens
    to register to vote or update their information when applying for or renewing
    a driver's license.
- id: 81
  category: driver_responsibility
  question: For drivers of commercial motor vehicles in Iowa, what is the Blood Alcohol
    Concentration (BAC) limit at which they are considered to be driving under the
    influence?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: While the limit for standard drivers is 0.08%, the BAC limit for commercial
    drivers (CDL holders) in Iowa is 0.04%.
- id: 82
  category: driver_responsibility
  question: 'Iowa is part of the ''Non-Resident Violator Compact.'' This means if
    you get a ticket in another member state and do not process it (pay it or go to
    court):'
  choices:
    A: The other state will send a bill to your insurance company.
    B: The Iowa DOT can suspend your Iowa license until the ticket is resolved.
    C: You will be banned from that state for 5 years.
    D: Nothing happens unless you return to that specific state.
  answer: B
  explanation: The Non-Resident Violator Compact ensures that out-of-state traffic
    violations are reported to the driver's home state. If you ignore a ticket in
    another state, the Iowa DOT will suspend your license.
- id: 83
  category: safe_driving_rules
  question: In Iowa, what is the speed limit in a business district unless otherwise
    posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: According to the Iowa Driver's Manual, the speed limit in any business
    district is 20 mph unless a different speed is posted.
- id: 84
  category: safe_driving_rules
  question: On Iowa secondary roads, what is the unposted speed limit during the day?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: The speed limit for Iowa secondary roads is 55 mph unless otherwise
    posted.
- id: 85
  category: safe_driving_rules
  question: In Iowa, you are prohibited from parking within how many feet of a fire
    hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: A
  explanation: Iowa law states that you may not park a vehicle within 5 feet of a
    fire hydrant.
- id: 86
  category: safe_driving_rules
  question: When parking near a stop sign, flashing beacon, or traffic control signal
    in Iowa, what is the minimum required distance you must maintain?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Iowa law prohibits parking within 20 feet of a stop sign, flashing
    beacon, or traffic control signal located at the side of a roadway.
- id: 87
  category: safe_driving_rules
  question: Under Iowa's 'Move Over' law, what must a driver do when approaching a
    stationary emergency vehicle with its lights flashing on a multi-lane highway?
  choices:
    A: Stop completely until the vehicle moves
    B: Maintain speed but honk to alert the responders
    C: Move to a lane that is not adjacent to the emergency vehicle, if safe to do
      so
    D: Speed up to pass the area as quickly as possible
  answer: C
  explanation: Iowa's 'Move Over' law requires drivers to move to a non-adjacent lane
    or slow down and be prepared to stop when approaching stationary emergency, utility,
    or maintenance vehicles with flashing lights.
- id: 88
  category: safe_driving_rules
  question: In Iowa, you may not park within how many feet of the entrance to a fire
    station on the same side of the street?
  choices:
    A: 15 feet
    B: 20 feet
    C: 25 feet
    D: 50 feet
  answer: B
  explanation: Iowa law prohibits parking within 20 feet of the driveway entrance
    to any fire station on the same side of the street.
- id: 89
  category: safe_driving_rules
  question: When following another vehicle in Iowa, what is the recommended minimum
    following distance under ideal conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Iowa Driver's Manual recommends a minimum following distance of
    at least three seconds to allow enough time to react to hazards.
- id: 90
  category: safe_driving_rules
  question: If you are driving on a two-lane road in Iowa and approach a school bus
    with its amber (yellow) lights flashing, what does this indicate?
  choices:
    A: The bus is about to stop and you should prepare to stop
    B: The bus is speeding up and you should pass quickly
    C: The bus is broken down
    D: You must stop immediately
  answer: A
  explanation: In Iowa, amber flashing lights on a school bus indicate the bus is
    preparing to stop to load or unload children. Drivers should slow down and be
    prepared to stop.
- id: 91
  category: safe_driving_rules
  question: 'In Iowa, you must use your headlights whenever visibility is reduced
    to less than:'
  choices:
    A: 200 feet
    B: 400 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Iowa law requires the use of headlights from sunset to sunrise and
    at any time conditions (such as fog, snow, or rain) prevent you from seeing other
    vehicles or persons within 500 feet.
- id: 92
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane road in Iowa, you must return
    to your lane before coming within how many feet of an oncoming vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: A
  explanation: Iowa law requires that you complete a pass and return to your lane
    before coming within 100 feet of any vehicle approaching from the opposite direction.
- id: 93
  category: safe_driving_rules
  question: What is the penalty for a speeding violation committed in an Iowa road
    work zone when workers are present?
  choices:
    A: The fine is tripled
    B: The fine is doubled
    C: Mandatory 30-day license suspension
    D: There is no extra penalty
  answer: B
  explanation: In Iowa, scheduled fines for moving traffic violations are doubled
    if the violation occurs in a road work zone.
- id: 94
  category: safe_driving_rules
  question: In Iowa, if you are involved in an accident resulting in injury, death,
    or combined property damage of _____ or more, you must file an accident report
    with the DOT.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Iowa law requires a written report (Form 433002) to be filed with the
    DOT if an accident results in death, personal injury, or total property damage
    of $1,500 or more.
- id: 95
  category: safe_driving_rules
  question: When parking a vehicle uphill on a two-way street with a curb in Iowa,
    how should the front wheels be turned?
  choices:
    A: Toward the curb
    B: Parallel to the curb
    C: Away from the curb
    D: To the right
  answer: C
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    so that if the vehicle rolls, the back of the front tire will hit the curb and
    stop the car.
- id: 96
  category: safe_driving_rules
  question: When driving on a road with three or more lanes in Iowa, which lane is
    typically intended for slower traffic?
  choices:
    A: The left lane
    B: The center lane
    C: The right lane
    D: The HOV lane
  answer: C
  explanation: In Iowa, as in most states, the right lane is intended for slower traffic,
    while the left lanes are used for passing and higher-speed travel.
- id: 97
  category: safe_driving_rules
  question: In Iowa, when is a left turn on a red light permitted?
  choices:
    A: Never
    B: From a two-way street onto a one-way street
    C: From a one-way street onto another one-way street
    D: Only during designated hours
  answer: C
  explanation: Iowa law allows a left turn on red only when turning from a one-way
    street onto another one-way street, provided you come to a complete stop and yield
    to traffic and pedestrians.
- id: 98
  category: safe_driving_rules
  question: On a two-lane road in Iowa, what must you do when a school bus is stopped
    with its red lights flashing and stop arm extended?
  choices:
    A: Stop only if you are following the bus
    B: Slow down to 15 mph and pass with caution
    C: Stop if you are traveling in either direction
    D: Stop only if there are children crossing the road
  answer: C
  explanation: On a two-lane road, traffic in both directions must stop when a school
    bus has its red lights flashing and stop arm extended.
- id: 99
  category: safe_driving_rules
  question: In Iowa, you are prohibited from passing another vehicle within how many
    feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Iowa law states you must not pass another vehicle when approaching
    within 100 feet of an intersection, railroad crossing, bridge, viaduct, or tunnel.
- id: 100
  category: safe_driving_rules
  question: 'When driving on a multi-lane highway in Iowa, the left lane is primarily
    intended for:'
  choices:
    A: Driving at the speed limit
    B: Passing and turning left
    C: Heavy trucks
    D: Slow-moving vehicles
  answer: B
  explanation: In Iowa, you should drive in the right-hand lane except when passing
    or preparing for a left turn.
- id: 101
  category: safe_driving_rules
  question: The Iowa Driver's Manual recommends a minimum following distance of how
    many seconds under ideal driving conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: B
  explanation: Iowa recommends a 'three-second rule' to maintain a safe following
    distance behind the vehicle in front of you.
- id: 102
  category: safe_driving_rules
  question: 'When passing a large commercial vehicle in Iowa, you should not pull
    back into the lane until you can see:'
  choices:
    A: The truck's driver in your side mirror
    B: The truck's headlights in your rearview mirror
    C: The truck's front bumper in your side mirror
    D: The top of the truck's cab
  answer: B
  explanation: To ensure you have enough space after passing a large truck, do not
    pull back into the lane until you can see the entire front of the truck (both
    headlights) in your inside rearview mirror.
- id: 103
  category: defensive_driving
  question: According to the Iowa Driver's Manual, what is the recommended following
    distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: One car length for every 10 mph
  answer: B
  explanation: The Iowa DOT recommends using the 'three-second rule' to maintain a
    safe following distance under ideal driving conditions.
- id: 104
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, Iowa law and
    safety guidelines suggest you should look at least how far ahead?
  choices:
    A: 5 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: One city block
  answer: B
  explanation: Iowa safety guidelines recommend scanning the road 10 to 15 seconds
    ahead to anticipate hazards and manage traffic flow.
- id: 105
  category: defensive_driving
  question: In Iowa, you must dim your high-beam headlights when you are within how
    many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Iowa law requires drivers to switch to low beams when an oncoming vehicle
    is within 500 feet.
- id: 106
  category: defensive_driving
  question: 'Under Iowa law, you must use your headlights whenever you cannot see
    clearly for a distance of at least:'
  choices:
    A: 250 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Iowa law states that headlights must be on if visibility is reduced
    to 500 feet or less due to conditions like rain, snow, or fog.
- id: 107
  category: defensive_driving
  question: At what speed can hydroplaning (where tires lose contact with the road
    and ride on a layer of water) begin in Iowa weather conditions?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Exactly 45 mph
    D: Only during torrential downpours at 65 mph
  answer: A
  explanation: Hydroplaning can start at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 55 mph.
- id: 108
  category: defensive_driving
  question: What is the speed limit on Iowa secondary roads (unpaved or county roads)
    during the day unless otherwise posted?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: The speed limit for most Iowa secondary roads is 55 mph unless signs
    indicate otherwise.
- id: 109
  category: defensive_driving
  question: 'In Iowa, a ''Slow Moving Vehicle'' sign (an orange triangle with a red
    strip on each side) is required on vehicles designed to travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: Iowa law requires the slow-moving vehicle emblem on all vehicles designed
    to travel at speeds of 25 mph or less.
- id: 110
  category: defensive_driving
  question: When driving in heavy fog in Iowa, which light setting should you use
    to maintain the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Emergency flashers
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    fog and actually decrease visibility.
- id: 111
  category: defensive_driving
  question: On a rural Iowa interstate highway, what is the maximum speed limit for
    passenger vehicles under normal conditions?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: B
  explanation: The speed limit on rural interstate highways in Iowa is 70 mph unless
    otherwise posted.
- id: 112
  category: defensive_driving
  question: In Iowa, what is the speed limit in a 'suburban district' (an area where
    the average distance between occupied houses is less than 200 feet) unless otherwise
    posted?
  choices:
    A: 35 mph
    B: 40 mph
    C: 45 mph
    D: 50 mph
  answer: C
  explanation: Iowa law sets the speed limit in suburban districts at 45 mph unless
    otherwise posted.
- id: 113
  category: defensive_driving
  question: When following a motorcycle in Iowa, why should you allow for a larger
    following distance than you would for a car?
  choices:
    A: Motorcycles have a shorter stopping distance
    B: Motorcycles are more likely to stall
    C: Motorcycles always travel slower than cars
    D: Iowa law requires a 10-second gap for motorcycles
  answer: A
  explanation: Motorcycles can stop much more quickly than other vehicles. Following
    too closely increases the risk of a rear-end collision if the motorcyclist brakes
    suddenly.
- id: 114
  category: defensive_driving
  question: 'If your vehicle begins to skid on an icy Iowa road, the correct defensive
    driving technique is to:'
  choices:
    A: Brake hard and turn the wheel away from the skid
    B: Accelerate slightly to regain traction
    C: Turn the front wheels in the direction the rear of the vehicle is skidding
    D: Shift the car into neutral and close your eyes
  answer: C
  explanation: To recover from a skid, take your foot off the gas and turn the steering
    wheel in the direction the rear of the car is sliding.
- id: 115
  category: defensive_driving
  question: To be a safe driver in Iowa, how far ahead should you typically scan the
    road to identify potential hazards?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: One full minute
  answer: B
  explanation: Scanning 10 to 15 seconds ahead allows you to see hazards early and
    avoid last-minute maneuvers.
- id: 116
  category: defensive_driving
  question: 'In Iowa, when following another vehicle from behind at night, you must
    dim your high beams when you are within:'
  choices:
    A: 200 feet
    B: 400 feet
    C: 600 feet
    D: 800 feet
  answer: B
  explanation: Iowa law requires drivers to switch to low beams when following another
    vehicle within 400 feet.
- id: 117
  category: defensive_driving
  question: When driving on Iowa roads in winter, if your vehicle is equipped with
    Anti-lock Braking System (ABS) and you begin to skid, how should you apply the
    brakes?
  choices:
    A: Pump the brakes rapidly
    B: Press the brake pedal firmly and hold it
    C: Lightly tap the brakes
    D: Shift to neutral and do not use the brakes
  answer: B
  explanation: For vehicles with ABS, you should apply steady, firm pressure. Pumping
    the brakes is for older vehicles without ABS.
- id: 118
  category: defensive_driving
  question: When sharing the road with large trucks in Iowa, what is the 'No-Zone'?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the front, back, and sides of the truck
    C: The fast lane on the interstate
    D: The weigh station entrance
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck where
    the driver cannot see your vehicle.
- id: 119
  category: defensive_driving
  question: According to Iowa's safe passing laws, how much space should you leave
    between your vehicle and a bicycle when passing?
  choices:
    A: At least 1 foot
    B: At least 3 feet
    C: At least 5 feet
    D: Exactly one car width
  answer: B
  explanation: Iowa law (321.281) requires motorists to pass bicycles at a safe distance,
    generally interpreted as at least 3 feet of clearance.
- id: 120
  category: defensive_driving
  question: 'In Iowa, you are NOT required to stop for a school bus with flashing
    red lights and an extended stop arm if:'
  choices:
    A: You are traveling in the opposite direction on a two-lane road
    B: The bus is stopped at a railroad crossing
    C: You are traveling in the opposite direction on a roadway with two or more lanes
      in each direction separated by a median
    D: It is after sunset
  answer: C
  explanation: On a divided highway with a median or barrier, traffic moving in the
    opposite direction of the bus does not have to stop.
- id: 121
  category: defensive_driving
  question: When entering an intersection in Iowa, what is the recommended scanning
    sequence?
  choices:
    A: Right, then left
    B: Left, then right, then left again
    C: Straight ahead only
    D: Check your rearview mirror first
  answer: B
  explanation: The Iowa manual recommends looking left, then right, then left again
    because the first danger comes from the left.
- id: 122
  category: defensive_driving
  question: When driving on slippery Iowa roads (ice or snow), how should you adjust
    your following distance?
  choices:
    A: Keep it at 3 seconds
    B: Decrease it to 1 second to stay in the tracks of the car ahead
    C: Increase it to at least 6 seconds or more
    D: Following distance does not matter on ice
  answer: C
  explanation: In adverse conditions like ice or snow, you should at least double
    your following distance to provide a larger safety cushion.
- id: 123
  category: defensive_driving
  question: What does the term 'overdriving your headlights' mean in the context of
    Iowa night driving?
  choices:
    A: Driving with your high beams on in the city
    B: Driving so fast that your stopping distance is farther than the distance illuminated
      by your headlights
    C: Using your headlights during the daytime
    D: Leaving your headlights on after parking the car
  answer: B
  explanation: Overdriving your headlights is dangerous because you cannot see hazards
    in time to stop before hitting them.
- id: 124
  category: alcohol_drugs_health
  question: Under Iowa law, what is the maximum Blood Alcohol Concentration (BAC)
    allowed for a person operating a commercial motor vehicle?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.04%
    D: 0.02%
  answer: C
  explanation: In Iowa, the legal BAC limit for commercial drivers is 0.04%. For non-commercial
    adult drivers, the limit is 0.08%.
- id: 125
  category: alcohol_drugs_health
  question: 'Iowa''s ''Implied Consent'' law means that by operating a motor vehicle
    in the state, you have given consent to:'
  choices:
    A: A search of your vehicle's trunk at any time
    B: A chemical test of your breath, blood, or urine to determine alcohol or drug
      content
    C: The impoundment of your vehicle if you are stopped for speeding
    D: Allowing passengers to drink alcohol as long as the driver is sober
  answer: B
  explanation: Iowa's Implied Consent law states that any person who operates a motor
    vehicle in the state agrees to have a chemical test performed to determine the
    presence of alcohol or drugs.
- id: 126
  category: alcohol_drugs_health
  question: 'If a driver''s chemical test indicates a BAC of 0.08% or more for the
    first time in Iowa, their license will be revoked for:'
  choices:
    A: 30 days
    B: 60 days
    C: 180 days
    D: One year
  answer: C
  explanation: In Iowa, a first-offense OWI involving a failed chemical test (0.08%
    or higher) results in a 180-day license revocation.
- id: 127
  category: alcohol_drugs_health
  question: In Iowa, who can be charged with a violation of the 'Open Container' law
    if an unsealed bottle of alcohol is found in the passenger area of a vehicle?
  choices:
    A: Only the driver
    B: Only the person holding the container
    C: Both the driver and the passenger(s)
    D: Only the owner of the vehicle
  answer: C
  explanation: Iowa law prohibits both drivers and passengers from possessing an open
    container of an alcoholic beverage in the passenger area of a motor vehicle on
    a public street or highway.
- id: 128
  category: alcohol_drugs_health
  question: 'In Iowa, an Ignition Interlock Device (IID) is mandatory for a first-offense
    OWI if the driver''s BAC was at or above:'
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.10%
    D: 0.15%
  answer: C
  explanation: Iowa law requires the installation of an Ignition Interlock Device
    for all first-offense OWI revocations where the BAC was 0.10% or higher, or if
    an accident occurred.
- id: 129
  category: alcohol_drugs_health
  question: 'When alcohol is combined with other drugs, the effect on your driving
    ability is usually:'
  choices:
    A: Reduced
    B: The same as alcohol alone
    C: Greater than the sum of the separate effects
    D: Cancelled out
  answer: C
  explanation: Combining alcohol with other drugs (synergism) creates a much greater
    impairment than either substance alone, significantly increasing the risk of an
    accident.
- id: 130
  category: alcohol_drugs_health
  question: According to Iowa medical standards, a person who has a condition that
    causes loss of consciousness (such as epilepsy) must remain seizure-free for how
    long before they can be licensed to drive?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Iowa DOT regulations generally require a person with a history of episodes
    of loss of consciousness to be episode-free for at least six months before being
    eligible for a license.
- id: 131
  category: alcohol_drugs_health
  question: 'If you are convicted of a second OWI offense in Iowa within 12 years,
    the mandatory license revocation period is:'
  choices:
    A: One year
    B: Two years
    C: Five years
    D: Permanent
  answer: B
  explanation: A second OWI offense within a 12-year period in Iowa results in a mandatory
    two-year license revocation.
- id: 132
  category: alcohol_drugs_health
  question: 'In Iowa, the term OWI (Operating While Intoxicated) applies to drivers
    under the influence of:'
  choices:
    A: Alcohol only
    B: Illegal drugs only
    C: Alcohol, illegal drugs, or prescription/over-the-counter medications
    D: Alcohol and illegal drugs only
  answer: C
  explanation: OWI in Iowa covers impairment by alcohol, any drug (including prescription
    or over-the-counter), or a combination of substances.
- id: 133
  category: alcohol_drugs_health
  question: Which of the following is a requirement for an Iowa driver to reinstate
    their license after an OWI revocation?
  choices:
    A: Completion of a substance abuse evaluation
    B: Completion of a state-approved 'drinking drivers' course
    C: Payment of a $200 civil penalty
    D: All of the above
  answer: D
  explanation: To reinstate an Iowa license after an OWI, a driver must complete a
    substance abuse evaluation and treatment (if recommended), pass a course for drinking
    drivers, and pay the required civil penalty.
- id: 134
  category: alcohol_drugs_health
  question: Under Iowa's Implied Consent law, who determines which chemical test (breath,
    blood, or urine) will be administered?
  choices:
    A: The driver
    B: The peace officer
    C: The driver's attorney
    D: The attending physician
  answer: B
  explanation: In Iowa, the peace officer who requests the test determines whether
    the test will be of the person's breath, blood, or urine.
- id: 135
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and a doctor did not tell you it
    would affect your driving, can you still be convicted of OWI in Iowa?
  choices:
    A: No, because it was legally prescribed
    B: No, if you have the prescription bottle with you
    C: Yes, if the drug impairs your ability to drive safely
    D: Only if you also consumed alcohol
  answer: C
  explanation: Under Iowa law, having a valid prescription is not a defense to OWI
    if the drug makes the person incapable of driving safely.
- id: 136
  category: alcohol_drugs_health
  question: If an Iowa driver under the age of 21 is caught with a BAC of 0.02% or
    higher for the first time, how long will their driving privileges be revoked under
    the 'Zero Tolerance' law?
  choices:
    A: 30 days
    B: 60 days
    C: 180 days
    D: 1 year
  answer: B
  explanation: Under Iowa's Zero Tolerance law, a first-time offender under age 21
    with a BAC of 0.02% or higher will have their license revoked for 60 days.
- id: 137
  category: alcohol_drugs_health
  question: Under Iowa's Implied Consent law, what is the mandatory revocation period
    for a first-time refusal to submit to a chemical test?
  choices:
    A: 180 days
    B: 90 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: If you refuse to submit to a chemical test in Iowa for the first time,
    your driver's license will be revoked for one year.
- id: 138
  category: alcohol_drugs_health
  question: In Iowa, a first-offense OWI (Operating While Intoxicated) conviction
    carries a mandatory minimum jail sentence of how many hours?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: C
  explanation: A first-offense OWI in Iowa is a serious misdemeanor and carries a
    mandatory minimum of 48 hours in jail.
- id: 139
  category: alcohol_drugs_health
  question: Which of the following is true regarding Iowa's 'Open Container' law?
  choices:
    A: It is legal for passengers to have open containers in the back seat.
    B: It is illegal for any person in a motor vehicle on a public street or highway
      to possess an open container of an alcoholic beverage in the passenger area.
    C: Open containers are allowed if the driver is not drinking.
    D: Open containers are only illegal if the vehicle is in motion.
  answer: B
  explanation: Iowa law prohibits both drivers and passengers from possessing an open
    container of alcohol in the passenger area of a motor vehicle on a public road.
- id: 140
  category: alcohol_drugs_health
  question: In Iowa, if you are convicted of an OWI, you must complete which of the
    following before your license can be reinstated?
  choices:
    A: A defensive driving course
    B: A substance abuse evaluation and a state-approved drinking driver course
    C: 100 hours of community service
    D: A new driving skills test
  answer: B
  explanation: Iowa law requires OWI offenders to undergo a substance abuse evaluation
    and complete a course for drinking drivers before reinstatement.
- id: 141
  category: alcohol_drugs_health
  question: What is the BAC limit for drivers of commercial motor vehicles in Iowa?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: For commercial driver's license (CDL) holders operating a commercial
    vehicle, the legal BAC limit is 0.04%.
- id: 142
  category: alcohol_drugs_health
  question: How does alcohol first affect a driver's ability?
  choices:
    A: It slows down reaction time.
    B: It impairs coordination and balance.
    C: It affects judgment and decision-making.
    D: It causes blurred vision.
  answer: C
  explanation: Alcohol affects judgment and self-control first, which are critical
    for safe driving, even before physical coordination is noticeably impaired.
- id: 143
  category: alcohol_drugs_health
  question: If you are taking prescription drugs and feel 'fuzzy' or drowsy, what
    should you do according to the Iowa Driver's Manual?
  choices:
    A: Drive only in the daylight.
    B: Drink coffee to stay alert while driving.
    C: Do not drive; it is your responsibility to know the effects of your medication.
    D: Drive slower than the posted speed limit.
  answer: C
  explanation: It is the driver's responsibility to ensure they are not impaired by
    any substance, including legal prescription or over-the-counter drugs.
- id: 144
  category: alcohol_drugs_health
  question: In Iowa, what is the penalty for a driver convicted of 'Operating While
    Intoxicated' that resulted in the death of another person?
  choices:
    A: A simple misdemeanor and a $500 fine.
    B: A Class B felony and mandatory prison time.
    C: A Class D felony and 1 year of probation.
    D: A license suspension of 90 days.
  answer: B
  explanation: OWI resulting in death is a Class B felony in Iowa, carrying a sentence
    of up to 25 years in prison.
- id: 145
  category: alcohol_drugs_health
  question: What is the only effective way to reduce your Blood Alcohol Concentration
    (BAC) after drinking?
  choices:
    A: Taking a cold shower
    B: Drinking black coffee
    C: Exercising vigorously
    D: Giving your body time to process the alcohol
  answer: D
  explanation: Only time allows the body to metabolize alcohol. Coffee, showers, and
    exercise do not lower BAC or speed up the sobering process.
- id: 146
  category: alcohol_drugs_health
  question: In Iowa, if you are under 21 and convicted of 'Possession of Alcohol Under
    Legal Age' while in a motor vehicle, what happens to your license?
  choices:
    A: Nothing, it is only a fine.
    B: Your license will be suspended for 30 days.
    C: Your license will be revoked for 60 days for a first offense.
    D: You must wait until age 21 to get a full license.
  answer: C
  explanation: Under Iowa law, a person under 21 convicted of possessing alcohol in
    a motor vehicle faces a mandatory license revocation (60 days for a first offense).
- id: 147
  category: penalties_and_points
  question: An Iowa driver is considered a 'Habitual Offender' if they accumulate
    ____ or more moving violations within a 2-year period.
  choices:
    A: '4'
    B: '6'
    C: '8'
    D: '10'
  answer: B
  explanation: Iowa Code defines a habitual offender as a person who has been convicted
    of six or more moving violations within any 24-month period.
- id: 148
  category: penalties_and_points
  question: 'A first conviction for unlawfully passing a stopped school bus in Iowa
    results in a mandatory license suspension for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: A
  explanation: Under Kadyn's Law, a first offense for passing a stopped school bus
    with its stop arm extended results in a 30-day license suspension and a significant
    fine.
- id: 149
  category: penalties_and_points
  question: In Iowa, if a passenger under the age of 18 is not wearing a seat belt,
    who is issued the citation?
  choices:
    A: The passenger only
    B: The driver only
    C: Both the driver and the passenger
    D: The parent of the passenger only
  answer: B
  explanation: In Iowa, the driver is responsible for ensuring all passengers under
    the age of 18 are properly secured. If they are not, the citation is issued to
    the driver.
- id: 150
  category: penalties_and_points
  question: In Iowa, speeding fines are ____ in road work zones when workers are present.
  choices:
    A: Tripled
    B: Doubled
    C: Increased by a flat $50
    D: Increased by a flat $100
  answer: B
  explanation: Iowa law mandates that scheduled fines for speeding are doubled in
    road work zones to protect highway workers.
- id: 151
  category: penalties_and_points
  question: For drivers age 21 or older in Iowa, it is illegal to operate a motor
    vehicle with a Blood Alcohol Concentration (BAC) of ____ or higher.
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: The legal limit for OWI in Iowa for adults 21 and older is 0.08% BAC.
- id: 152
  category: penalties_and_points
  question: In Iowa, a speeding violation is considered a 'serious violation' that
    can lead to license suspension if the driver is traveling more than ____ mph over
    the posted limit.
  choices:
    A: '15'
    B: '20'
    C: '25'
    D: '30'
  answer: C
  explanation: Speeding more than 24 mph over the limit (25+) is classified as a serious
    violation in Iowa and may result in a license suspension.
- id: 153
  category: penalties_and_points
  question: 'If an Iowa driver is involved in an accident and does not have the required
    liability insurance, they must provide proof of financial responsibility (SR-22)
    for a period of:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers who fail to show proof of financial responsibility following
    an accident or certain convictions must file an SR-22 certificate with the DOT
    for 3 years.
- id: 154
  category: penalties_and_points
  question: Under Iowa's 'Open Container' law, which of the following is true regarding
    an open bottle of alcohol in a vehicle on a public street?
  choices:
    A: It is allowed in the glove box
    B: It is allowed if the driver is not drinking
    C: It is prohibited for both drivers and passengers
    D: It is only prohibited for the driver
  answer: C
  explanation: Iowa's open container law prohibits both drivers and passengers from
    possessing an open container of an alcoholic beverage in the passenger area of
    a motor vehicle on a public street or highway.
- id: 155
  category: penalties_and_points
  question: 'If you are declared a Habitual Offender in Iowa based on your driving
    record, your license may be suspended for a period ranging from:'
  choices:
    A: 6 months to 1 year
    B: 1 to 3 years
    C: 2 to 6 years
    D: 5 to 10 years
  answer: C
  explanation: A person found to be a habitual offender in Iowa faces a license revocation
    period of not less than two years nor more than six years.
- id: 156
  category: penalties_and_points
  question: 'In Iowa, failing to yield to an emergency vehicle (Move Over Law) that
    results in a crash causing bodily injury to another person can result in a license
    suspension of:'
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: If a violation of the 'Move Over' law causes bodily injury to another
    person, the DOT shall suspend the driver's license for 180 days.
- id: 157
  category: penalties_and_points
  question: 'In Iowa, you must file an ''Official Report of Motor Vehicle Accident''
    with the DOT if an accident results in death, personal injury, or total property
    damage of at least:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Iowa law requires a written report to be filed if the accident results
    in injury, death, or combined property damage of $1,500 or more.
- id: 158
  category: penalties_and_points
  question: 'If you are declared a ''Habitual Offender'' under Iowa law, your driver''s
    license may be revoked for a period of:'
  choices:
    A: 6 months to 1 year
    B: 1 to 3 years
    C: 2 to 6 years
    D: Permanently
  answer: C
  explanation: Iowa's Habitual Offender law (Iowa Code 321.555) can result in a license
    revocation lasting from two to six years depending on the violations.
- id: 159
  category: penalties_and_points
  question: 'In Iowa, if you are convicted of speeding in a road work zone when workers
    are present, the fine can be as high as:'
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: D
  explanation: Fines for traffic violations in road work zones are higher in Iowa;
    specifically, speeding fines in these zones can reach up to $1,000 when workers
    are present.
- id: 160
  category: penalties_and_points
  question: 'Iowa''s ''Move Over'' law requires drivers to change lanes or slow down
    for stationary emergency vehicles. A violation of this law that does not result
    in an accident carries a scheduled fine of:'
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: The scheduled fine for a violation of Iowa's Move Over law (Iowa Code
    321.323A) is $100 plus surcharges.
- id: 161
  category: penalties_and_points
  question: In Iowa, a driver's license may be suspended for a 'serious violation.'
    Speeding is considered a serious violation if you are caught driving how many
    miles per hour over the limit?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: The Iowa DOT defines a 'serious violation' as speeding 25 mph or more
    over the legal limit, which can lead to a license suspension.
- id: 162
  category: penalties_and_points
  question: 'If your Iowa license is suspended or revoked due to an OWI or lack of
    insurance, you must maintain an SR-22 insurance filing for:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: Iowa law requires drivers to maintain an SR-22 (proof of financial
    responsibility) for two years from the date the suspension or revocation ends.
- id: 163
  category: penalties_and_points
  question: In Iowa, what is the scheduled fine for a driver or front-seat passenger
    (age 18 or older) who is not wearing a safety belt?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: The scheduled fine for a seat belt violation in Iowa for adults is
    $50 plus surcharges and court costs.
- id: 164
  category: penalties_and_points
  question: To reinstate a driver's license after it has been suspended for reasons
    OTHER than an OWI (such as non-payment of fines), what is the reinstatement fee
    in Iowa?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: The standard reinstatement fee for a non-OWI related suspension in
    Iowa is $20.
- id: 165
  category: penalties_and_points
  question: In Iowa, what is the scheduled fine for a driver found with an open container
    of an alcoholic beverage in the passenger area of a vehicle on a public street?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: The scheduled fine for an open container violation in Iowa is $200
    plus surcharges.
- id: 166
  category: penalties_and_points
  question: 'Under Iowa law, a conviction for ''drag racing'' on a public highway
    results in:'
  choices:
    A: A simple warning
    B: A 30-day suspension
    C: Mandatory license revocation
    D: A $50 fine only
  answer: C
  explanation: Iowa Code 321.278 states that a person convicted of drag racing shall
    have their driver's license revoked by the DOT.
- id: 167
  category: sharing_the_road
  question: Under Iowa law, what is the minimum fine for a first-offense conviction
    of unlawfully passing a school bus?
  choices:
    A: $100
    B: $250
    C: $345
    D: $500
  answer: C
  explanation: Iowa law (321.372) mandates a significant fine for passing a school
    bus illegally. As of recent updates, the base fine for a first offense is $345,
    plus surcharges and court costs.
- id: 168
  category: sharing_the_road
  question: When passing a bicyclist in Iowa, what does the law require you to do
    regarding lane usage?
  choices:
    A: Stay in your lane and honk to warn them
    B: Pass with at least one foot of clearance
    C: Change lanes to pass if a multi-lane highway, or pass with a safe distance
    D: Bicycles must move to the shoulder to let you pass
  answer: C
  explanation: Iowa law requires motor vehicles to pass bicycles at a 'safe distance.'
    On multi-lane roads, you must move into the lane not occupied by the bicyclist.
- id: 169
  category: sharing_the_road
  question: In Iowa, if you are driving on a road with at least two lanes in each
    direction and a school bus is stopped in the opposite direction with red lights
    flashing, do you need to stop?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, you may proceed with caution
    C: Only if there is a physical median
    D: Only if the bus driver signals you to proceed
  answer: B
  explanation: In Iowa, on a highway with at least two lanes in each direction, you
    do not have to stop if you are traveling in the opposite direction of a school
    bus, though you should remain cautious.
- id: 170
  category: sharing_the_road
  question: What is the 'No-Zone' in relation to large trucks in Iowa?
  choices:
    A: The speed limit zone for trucks
    B: The blind spots around the front, back, and sides of the truck
    C: A restricted lane for trucks only
    D: The area where trucks are not allowed to park
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck where
    the driver cannot see your vehicle. If you cannot see the truck driver's face
    in their side mirror, they cannot see you.
- id: 171
  category: sharing_the_road
  question: 'When a pedestrian is crossing the street guided by a service dog or carrying
    a white cane, Iowa law requires you to:'
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take extra precautions
    C: Proceed if they are not in your specific lane
    D: Wait for them to signal you to pass
  answer: B
  explanation: Iowa law states that drivers must yield the right-of-way to any blind
    pedestrian carrying a white cane or using a service dog.
- id: 172
  category: sharing_the_road
  question: Regarding motorcycle safety, what is the recommended following distance
    for a vehicle behind a motorcycle in Iowa?
  choices:
    A: 1 second
    B: 2 seconds
    C: At least 3 to 4 seconds
    D: Exactly two car lengths
  answer: C
  explanation: Because motorcycles can stop much faster than cars and are more easily
    affected by road conditions, Iowa recommends a following distance of at least
    3 to 4 seconds.
- id: 173
  category: sharing_the_road
  question: In Iowa, is it legal for a motorcycle to 'lane split' (drive between rows
    of stopped or moving vehicles)?
  choices:
    A: Yes, it is legal at low speeds
    B: Yes, but only on interstate highways
    C: No, it is illegal in Iowa
    D: It is legal only during heavy traffic congestion
  answer: C
  explanation: Lane splitting is not permitted in Iowa. Motorcycles are entitled to
    the full use of a lane, and no motor vehicle shall be driven in such a manner
    as to deprive any motorcycle of the full use of a lane.
- id: 174
  category: sharing_the_road
  question: When an emergency vehicle with sirens and flashing lights is approaching
    from behind, what is the correct procedure in Iowa?
  choices:
    A: Stop immediately in your lane
    B: Speed up to get out of the way
    C: Pull to the right edge of the road and stop
    D: Move to the left lane to let them pass on the right
  answer: C
  explanation: Iowa law requires drivers to pull over to the right-hand edge or curb
    of the road, clear of intersections, and stop until the emergency vehicle has
    passed.
- id: 175
  category: sharing_the_road
  question: 'A slow-moving vehicle emblem (an orange triangle with a red reflective
    border) must be displayed on vehicles that travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: In Iowa, the slow-moving vehicle emblem is required on all vehicles
    designed for travel at speeds of 25 mph or less, such as farm machinery or horse-drawn
    buggies.
- id: 176
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may often:'
  choices:
    A: Turn from the left lane
    B: Stay entirely in the right lane
    C: Swing wide to the left to complete the turn
    D: Stop and wait for all traffic to clear before turning
  answer: C
  explanation: Large trucks have a wide turning radius and may need to swing wide
    to the left to clear the curb when making a right turn. Drivers should never try
    to squeeze between the truck and the curb.
- id: 177
  category: sharing_the_road
  question: 'In Iowa, if you are convicted of failing to yield to an emergency vehicle
    and an accident occurs causing property damage, your license will be suspended
    for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Under Iowa's Move Over law penalties, if a violation results in property
    damage, the driver's license shall be suspended for 90 days in addition to fines.
- id: 178
  category: sharing_the_road
  question: 'Bicyclists in Iowa have the same rights and responsibilities as:'
  choices:
    A: Pedestrians
    B: Motor vehicle drivers
    C: Slow-moving farm equipment
    D: They have no specific rights on the road
  answer: B
  explanation: In Iowa, bicyclists are subject to the same traffic laws as operators
    of motor vehicles, including stopping at stop signs and signaling turns.
- id: 179
  category: sharing_the_road
  question: 'When following a large truck at night, you should dim your headlights
    because:'
  choices:
    A: The truck's mirrors will reflect the bright light into the driver's eyes
    B: Truck drivers have better night vision
    C: Bright lights can damage the truck's reflective tape
    D: It is not necessary to dim lights for trucks
  answer: A
  explanation: Just like with passenger cars, you should dim your high beams when
    following a truck to avoid blinding the driver through their large side mirrors.
- id: 180
  category: sharing_the_road
  question: On a highway with at least two lanes in each direction and a median or
    barrier, what is the rule for oncoming traffic when a school bus is stopped with
    red lights flashing on the opposite side of the median?
  choices:
    A: Oncoming traffic must stop
    B: Oncoming traffic is not required to stop but should proceed with caution
    C: Oncoming traffic must slow to 10 mph
    D: Oncoming traffic must pull over to the shoulder
  answer: B
  explanation: Iowa law (321.372) states that if a bus is on a highway with two or
    more lanes in each direction and the road is separated by a median or barrier,
    the driver of a vehicle on the opposite side of the roadway is not required to
    stop.
- id: 181
  category: sharing_the_road
  question: When passing a bicycle in Iowa, how much space should a motorist leave
    between their vehicle and the bicyclist?
  choices:
    A: At least one foot
    B: At least two feet
    C: A safe distance until the vehicle is safely past the bicycle
    D: Bicycles must be passed on the right
  answer: C
  explanation: Iowa law requires motorists to pass bicycles at a 'safe distance' and
    not return to the right side of the road until safely clear of the bicyclist.
- id: 182
  category: sharing_the_road
  question: In Iowa, which of the following is true regarding motorcycles and lane
    usage?
  choices:
    A: Motorcycles are not entitled to a full lane width
    B: Two motorcycles may legally share a single lane (ride abreast)
    C: Motorcycles may 'lane split' between rows of stopped cars
    D: Motorcycles must always ride on the shoulder
  answer: B
  explanation: Iowa law allows two motorcycles to operate side-by-side in a single
    lane, but lane splitting (riding between lanes of traffic) is illegal.
- id: 183
  category: sharing_the_road
  question: 'Large commercial trucks have blind spots where the driver cannot see
    other vehicles. These are commonly called:'
  choices:
    A: Safe Zones
    B: No-Zones
    C: Clear Zones
    D: Wide Zones
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around the front, back,
    and sides of a truck where the truck driver cannot see other vehicles.
- id: 184
  category: sharing_the_road
  question: 'If you are following a truck and cannot see the truck driver''s face
    in their side-view mirrors, you are:'
  choices:
    A: In a good position to pass
    B: In the truck's blind spot (No-Zone)
    C: Safe from road debris
    D: Following at a legal distance
  answer: B
  explanation: 'A general rule for sharing the road with trucks is: ''If you can''t
    see the driver in their mirror, they can''t see you.'''
- id: 185
  category: sharing_the_road
  question: In Iowa, when must a bicyclist use a front light and a rear reflector/light?
  choices:
    A: At all times
    B: Only when riding on the sidewalk
    C: From sunset to sunrise
    D: Only during inclement weather
  answer: C
  explanation: Iowa law (321.397) requires bicycles to be equipped with a white light
    on the front and a red reflector or light on the rear when used from sunset to
    sunrise.
- id: 186
  category: sharing_the_road
  question: In Iowa, if a pedestrian is crossing the street in an unmarked crosswalk
    at an intersection, who has the right-of-way?
  choices:
    A: The motorist
    B: The pedestrian
    C: Whoever arrived at the intersection first
    D: The motorist, because the crosswalk is not marked
  answer: B
  explanation: Iowa law (321.327) states that drivers must yield to pedestrians within
    any marked or unmarked crosswalk at an intersection.
- id: 187
  category: sharing_the_road
  question: Iowa's 'Move Over' law applies to which of the following stationary vehicles
    with activated flashing lights?
  choices:
    A: Police cars and fire trucks only
    B: Ambulances and tow trucks only
    C: Utility maintenance and highway construction vehicles only
    D: All of the above, including any stationary vehicle with flashing hazard lights
  answer: D
  explanation: Iowa's Move Over law was expanded to include not just emergency and
    maintenance vehicles, but any stationary vehicle with flashing lights, including
    hazard lights.
- id: 188
  category: vehicle_information
  question: According to the Iowa Driver's Manual, when must you turn on your headlights?
  choices:
    A: From 30 minutes after sunset to 30 minutes before sunrise
    B: From sunset to sunrise
    C: Only when it is raining or snowing
    D: From one hour after sunset to one hour before sunrise
  answer: B
  explanation: Iowa law requires headlights to be on from sunset to sunrise, or whenever
    visibility is less than 500 feet due to conditions like rain, snow, or fog.
- id: 189
  category: vehicle_information
  question: 'In Iowa, tires are considered unsafe and do not meet legal requirements
    if the tread is less than:'
  choices:
    A: 1/32 of an inch
    B: 1/16 of an inch
    C: 1/8 of an inch
    D: 1/4 of an inch
  answer: B
  explanation: Iowa law states that tires are unsafe if they are worn to the point
    where less than 1/16 of an inch of tread remains.
- id: 190
  category: vehicle_information
  question: If a load extends ______ or more past the rear of your vehicle's body
    in Iowa, you must attach a red flag to the end of the load during the day.
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Iowa law requires a red flag (at least 16 inches square) to be attached
    to the end of any load that extends four feet or more beyond the rear of the vehicle.
- id: 191
  category: vehicle_information
  question: Iowa law requires that the windshield and front side windows of a vehicle
    allow at least what percentage of light to pass through?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 90%
  answer: C
  explanation: Iowa Administrative Code specifies that the windshield and front side
    windows must have a light transmittance of at least 70%.
- id: 192
  category: vehicle_information
  question: 'Every motor vehicle operated on Iowa highways must be equipped with a
    horn that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Iowa law requires all motor vehicles to have a horn in good working
    order capable of emitting sound audible under normal conditions from a distance
    of not less than 200 feet.
- id: 193
  category: vehicle_information
  question: What is the minimum amount of property damage liability insurance required
    for a standard passenger vehicle in Iowa?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: C
  explanation: Iowa's financial responsibility law requires minimum liability coverage
    of $20,000 for one person's injury/death, $40,000 for two or more people, and
    $15,000 for property damage (20/40/15).
- id: 194
  category: vehicle_information
  question: 'In Iowa, a ''Slow Moving Vehicle'' emblem must be displayed on the rear
    of any vehicle that is designed for a maximum speed of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The reflective orange and red triangular emblem is required on vehicles
    designed to travel at speeds of 25 mph or less.
- id: 195
  category: vehicle_information
  question: 'Under Iowa''s Child Restraint Law, a child must be secured in a rear-facing
    child restraint system until they are at least:'
  choices:
    A: 1 year old AND weigh 20 pounds
    B: 2 years old
    C: 6 months old
    D: 1 year old, regardless of weight
  answer: A
  explanation: Iowa law (321.446) requires children under one year of age and weighing
    less than 20 pounds to be secured in a rear-facing child restraint system.
- id: 196
  category: vehicle_information
  question: 'In Iowa, the rear registration plate must be illuminated by a white light
    so it is clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Iowa law requires that the rear license plate be illuminated so that
    it is visible and legible from a distance of 50 feet to the rear.
- id: 197
  category: vehicle_information
  question: When is it legal to use a 'muffler cutout' or similar bypass device on
    an Iowa highway?
  choices:
    A: Only on rural gravel roads
    B: Only if the vehicle is more than 25 years old
    C: Only during sanctioned racing events
    D: It is never legal
  answer: D
  explanation: Iowa law prohibits the use of muffler cutouts, bypasses, or similar
    devices on motor vehicles operated on public highways.
- id: 198
  category: vehicle_information
  question: Iowa law requires a vehicle to have a driver's side mirror and an additional
    mirror (inside or passenger side) if the view from the center mirror is obstructed.
    How far to the rear must these mirrors allow the driver to see?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Iowa law requires mirrors to be positioned so the driver can see the
    highway for a distance of at least 200 feet to the rear.
- id: 199
  category: vehicle_information
  question: What is the primary enforcement rule regarding seat belts in Iowa?
  choices:
    A: Police can only cite you for seat belts if they stop you for another reason
    B: Police can stop and cite you solely for not wearing a seat belt
    C: Seat belts are only required for passengers under 18
    D: Seat belts are only required on interstates
  answer: B
  explanation: Iowa has a primary seat belt law, meaning an officer can stop a vehicle
    and issue a citation if they observe the driver or front-seat passengers not wearing
    a seat belt.
- id: 200
  category: vehicle_information
  question: In Iowa, if your vehicle's turn signals are not working, you must use
    hand signals. What is the correct hand signal for a right turn?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    upward at a 90-degree angle.
- id: 201
  category: vehicle_information
  question: When meeting an oncoming vehicle at night in Iowa, you must dim your high
    beams within how many feet?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Iowa law requires drivers to dim their high beams when within 500 feet
    of an oncoming vehicle.
- id: 202
  category: vehicle_information
  question: 'According to Iowa law, tires are considered unsafe and must be replaced
    if the tread depth is less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Iowa law (and most safety standards) specifies that tires are unsafe
    if they have less than 2/32 of an inch of tread.
- id: 203
  category: vehicle_information
  question: In Iowa, studded snow tires are legally permitted to be used only during
    which time frame?
  choices:
    A: October 1 to March 1
    B: November 1 to April 1
    C: December 1 to March 31
    D: November 15 to April 15
  answer: B
  explanation: Iowa law permits the use of studded tires only from November 1 to April
    1 of each year.
- id: 204
  category: vehicle_information
  question: Iowa law requires the foot brake to be capable of stopping the vehicle
    within ____ feet when traveling at 20 mph on dry pavement.
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: The Iowa Driver's Manual states that the foot brake must be able to
    stop the vehicle within 30 feet at a speed of 20 mph.
- id: 205
  category: vehicle_information
  question: Every motor vehicle in Iowa must have a rearview mirror that allows the
    driver to see the highway for a distance of at least ____ feet to the rear.
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Iowa law requires a mirror located to reflect to the driver a view
    of the highway for a distance of at least 200 feet to the rear.
- id: 206
  category: vehicle_information
  question: Turn signal lamps on a vehicle in Iowa must be visible from a distance
    of not less than ____ feet in normal sunlight.
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Iowa Code requires turn signals to be visible from a distance of not
    less than 100 feet.
- id: 207
  category: vehicle_information
  question: Iowa law specifies that headlights must be mounted at a height of no less
    than 24 inches and no more than ____ inches from the ground.
  choices:
    A: 48 inches
    B: 54 inches
    C: 60 inches
    D: 72 inches
  answer: B
  explanation: Iowa Code 321.385 specifies that headlamps must be mounted between
    24 and 54 inches from the ground.
- id: 208
  category: vehicle_information
  question: Every motor vehicle in Iowa must be equipped with at least one tail lamp
    that emits a red light plainly visible from a distance of ____ feet to the rear.
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Iowa law requires tail lamps to be visible from a distance of 500 feet
    to the rear.
- id: 209
  category: signs_and_signals
  question: In Iowa, a fluorescent orange triangle with a reflective red border is
    placed on the back of vehicles that travel at what maximum speed?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: According to the Iowa Driver's Manual, the slow-moving vehicle symbol
    is required on all vehicles designed to travel at speeds of 35 mph or less.
- id: 210
  category: signs_and_signals
  question: Where is a 'No Passing Zone' pennant-shaped sign typically placed on Iowa
    roads?
  choices:
    A: On the right side of the road at the beginning of the zone
    B: On the left side of the road at the beginning of the zone
    C: Overhead above the center lane
    D: Only at the end of the zone
  answer: B
  explanation: In Iowa, the yellow pennant-shaped 'No Passing Zone' sign is unique
    because it is placed on the left side of the road to be visible to drivers attempting
    to pass.
- id: 211
  category: signs_and_signals
  question: What does a flashing yellow traffic signal mean at an Iowa intersection?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection
    C: Proceed with caution
    D: Treat it like a four-way stop
  answer: C
  explanation: A flashing yellow light means you should slow down and proceed with
    caution through the intersection.
- id: 212
  category: signs_and_signals
  question: When you see a flashing yellow arrow in a dedicated turn lane in Iowa,
    what must you do?
  choices:
    A: Stop and wait for a green arrow
    B: Turn immediately as you have the right-of-way
    C: Yield to oncoming traffic and pedestrians, then turn with caution
    D: Only turn if there is a police officer present
  answer: C
  explanation: A flashing yellow arrow means left turns are permitted, but you must
    first yield to oncoming traffic and pedestrians.
- id: 213
  category: signs_and_signals
  question: What is the meaning of a pentagon-shaped (five-sided) sign in Iowa?
  choices:
    A: Yield right-of-way
    B: Railroad crossing ahead
    C: School zone or school crossing
    D: No passing zone
  answer: C
  explanation: A five-sided sign is used exclusively to warn drivers that they are
    entering a school zone or approaching a school crossing.
- id: 214
  category: signs_and_signals
  question: To use a hand signal for a right turn in Iowa, how should the driver's
    arm be positioned?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward at a 90-degree angle
    C: Left arm extended downward
    D: Right arm extended straight out the window
  answer: B
  explanation: The standard hand signal for a right turn is the left arm bent upward
    at a 90-degree angle.
- id: 215
  category: signs_and_signals
  question: 'In Iowa, a solid white line painted on the pavement on the right side
    of the road is known as a:'
  choices:
    A: Stop line
    B: Center line
    C: Fog line
    D: Yield line
  answer: C
  explanation: The Iowa Driver's Manual refers to the solid white line on the right
    edge of the road as a 'fog line,' which helps drivers stay on the road during
    poor visibility.
- id: 216
  category: signs_and_signals
  question: What does a round yellow sign with a black 'X' and the letters 'RR' indicate?
  choices:
    A: A rest area is ahead
    B: A rural road intersection
    C: A railroad crossing is ahead
    D: A rough road surface
  answer: C
  explanation: A round yellow sign with a black 'X' and 'RR' is a circular advance
    warning sign for a railroad crossing.
- id: 217
  category: signs_and_signals
  question: 'When a school bus in Iowa has its amber (yellow) lights flashing, it
    means:'
  choices:
    A: The bus is breaking down
    B: The bus is preparing to stop to load or unload children
    C: The bus is traveling over the speed limit
    D: You must stop immediately
  answer: B
  explanation: Flashing amber lights on a school bus warn drivers that the bus is
    about to stop. Drivers should slow down and be prepared to stop when the red lights
    flash.
- id: 218
  category: signs_and_signals
  question: In Iowa, what is the meaning of a diamond-shaped orange sign?
  choices:
    A: Regulatory information
    B: Service and guidance
    C: Construction or maintenance warning
    D: Public recreation area
  answer: C
  explanation: Orange diamond-shaped signs are used to alert drivers to construction,
    maintenance, or utility operations on or near the road.
- id: 219
  category: signs_and_signals
  question: What must you do at a flashing red traffic signal in Iowa?
  choices:
    A: Slow down and proceed if the way is clear
    B: Stop only if there is other traffic
    C: Stop completely, then proceed when it is safe to do so
    D: Wait for the light to turn solid green
  answer: C
  explanation: A flashing red light is treated exactly like a stop sign; you must
    come to a complete stop and yield the right-of-way.
- id: 220
  category: signs_and_signals
  question: 'A lane marked with both a solid yellow line and a dashed yellow line
    on each side, used by vehicles traveling in either direction to turn, is called
    a:'
  choices:
    A: High-occupancy vehicle lane
    B: Shared left turn lane
    C: Reversible lane
    D: Passing lane
  answer: B
  explanation: A shared left turn lane is located in the center of a street and is
    used by vehicles turning left from either direction.
- id: 221
  category: signs_and_signals
  question: In Iowa, what does a white sign with a red circle and a red slash over
    a symbol mean?
  choices:
    A: The action shown is recommended
    B: The action shown is prohibited
    C: The action shown is only for trucks
    D: The action shown is permitted after stopping
  answer: B
  explanation: A red circle with a slash is a standard 'prohibitory' sign, meaning
    the action pictured (such as a U-turn or right turn) is not allowed.
- id: 222
  category: signs_and_signals
  question: In Iowa, a pennant-shaped sign (a triangle pointing right) is used to
    indicate a 'No Passing Zone.' Where is this sign uniquely placed?
  choices:
    A: On the right side of the road at the beginning of the zone
    B: On the left side of the road at the beginning of the zone
    C: Overhead in the center of the lane
    D: Only on the back of slow-moving vehicles
  answer: B
  explanation: In Iowa, the pennant-shaped 'No Passing Zone' sign is placed on the
    left side of the road to provide additional warning to drivers that they may not
    pass.
- id: 223
  category: signs_and_signals
  question: 'According to the Iowa Driver''s Manual, a ''Slow Moving Vehicle'' emblem
    (a reflective orange triangle) must be displayed on the rear of vehicles that
    travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: Iowa law requires that any vehicle designed to travel at speeds of
    25 mph or less must display a slow-moving vehicle emblem when operated on public
    highways.
- id: 224
  category: signs_and_signals
  question: In Iowa, what does a flashing yellow traffic light signify?
  choices:
    A: Stop and wait for the light to turn green
    B: The same as a stop sign
    C: Proceed with caution
    D: Yield to oncoming traffic only
  answer: C
  explanation: A flashing yellow light means you should slow down and proceed with
    caution at the intersection.
- id: 225
  category: signs_and_signals
  question: 'Under Iowa law, you are permitted to make a left turn on a red light
    ONLY when:'
  choices:
    A: Turning from a two-way street onto a one-way street
    B: Turning from a one-way street onto another one-way street
    C: There is no oncoming traffic
    D: Left turns on red are never permitted in Iowa
  answer: B
  explanation: Iowa law allows a left turn on red only if you are turning from the
    left lane of a one-way street onto another one-way street, after coming to a complete
    stop and yielding to traffic and pedestrians.
- id: 226
  category: signs_and_signals
  question: When approaching a railroad crossing in Iowa that has a circular yellow
    warning sign with an 'X' and the letters 'RR', what should you do?
  choices:
    A: Speed up to cross the tracks quickly
    B: Stop immediately and wait for a train
    C: Slow down and be prepared to stop
    D: Ignore the sign if no lights are flashing
  answer: C
  explanation: The circular yellow sign is an advance warning sign telling you to
    slow down, look, and listen for a train, and be prepared to stop if necessary.
- id: 227
  category: signs_and_signals
  question: What is the meaning of a solid white line painted on the pavement between
    lanes of traffic moving in the same direction?
  choices:
    A: You are encouraged to change lanes
    B: You should stay in your lane; lane changes are discouraged
    C: The lane is for carpools only
    D: Traffic is moving in the opposite direction
  answer: B
  explanation: A solid white line indicates that lane changes are discouraged for
    safety reasons, though not strictly prohibited like a double solid line.
- id: 228
  category: signs_and_signals
  question: 'In Iowa, a diamond-shaped sign with an orange background is used for:'
  choices:
    A: School zones
    B: General warnings
    C: Construction and maintenance zones
    D: Guide and information signs
  answer: C
  explanation: Orange diamond-shaped signs are specifically used to warn drivers of
    conditions in construction or maintenance areas.
- id: 229
  category: signs_and_signals
  question: What does a 'Crossbuck' sign at a railroad crossing signify in Iowa?
  choices:
    A: It is the same as a Yield sign; you must yield to any train
    B: You must stop at all times
    C: It is only a suggestion to slow down
    D: It indicates the number of tracks
  answer: A
  explanation: The railroad crossbuck sign is a regulatory sign that has the same
    meaning as a yield sign; you must yield the right-of-way to any approaching train.
- id: 230
  category: signs_and_signals
  question: In Iowa, what color are 'Service' signs that provide information about
    gas, food, and lodging?
  choices:
    A: Green
    B: Blue
    C: Brown
    D: Yellow
  answer: B
  explanation: Blue signs are used to provide information about traveler services
    such as gas, food, lodging, and medical facilities.
- id: 231
  category: signs_and_signals
  question: 'When a traffic signal turns green in Iowa, you may proceed:'
  choices:
    A: Immediately without looking
    B: Only after yielding to pedestrians and vehicles still in the intersection
    C: Only if you are turning right
    D: After waiting for 3 seconds
  answer: B
  explanation: A green light means you may go, but you must first yield to any vehicles
    or pedestrians remaining in the intersection from the previous signal cycle.
- id: 232
  category: signs_and_signals
  question: In Iowa, what is the meaning of a 'Shared Center Lane' marked with solid
    and broken yellow lines on both sides?
  choices:
    A: It is for passing slower traffic
    B: It is for emergency vehicles only
    C: It is for making left turns only
    D: It is for parking
  answer: C
  explanation: A shared center turn lane is reserved for vehicles making left turns
    from either direction and should not be used for passing or through travel.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
