metadata:
  source: 2025 Minnesota Driver's Manual
  total_questions: 249
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Minnesota, what is the minimum age to apply for an instruction permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: B
  explanation: According to the Minnesota Driver's Manual, an applicant must be at
    least 15 years old to qualify for an instruction permit.
- id: 2
  category: license_system
  question: How long is a Minnesota instruction permit valid?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 4 years
  answer: C
  explanation: A Minnesota instruction permit is valid for two years from the date
    of application.
- id: 3
  category: license_system
  question: Under Minnesota's GDL system, how long must a person under age 18 hold
    an instruction permit before they are eligible to take the road test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Minnesota law requires permit holders under the age of 18 to hold their
    permit for at least six months of compliant driving before taking the road test.
- id: 4
  category: license_system
  question: During the first six months of holding a provisional license, what are
    the nighttime driving restrictions for a Minnesota driver under 18?
  choices:
    A: No driving between 9:00 p.m. and 4:00 a.m.
    B: No driving between 10:00 p.m. and 5:00 a.m.
    C: No driving between 11:00 p.m. and 5:00 a.m.
    D: No driving between midnight and 5:00 a.m.
  answer: D
  explanation: For the first six months of licensure, provisional drivers are prohibited
    from driving between midnight and 5:00 a.m. unless accompanied by a licensed driver
    age 25 or older, or for specific work/school/emergency reasons.
- id: 5
  category: license_system
  question: If a Minnesota driver changes their name or address, within how many days
    must they apply for a replacement license?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Minnesota law requires you to apply for a duplicate or replacement
    license within 30 days of changing your name or address.
- id: 6
  category: license_system
  question: Under 'Vanessa's Law,' an unlicensed teen driver who receives a crash-related
    moving violation or an alcohol/controlled substance violation cannot be given
    a license until what age?
  choices:
    A: 17 years old
    B: 18 years old
    C: 19 years old
    D: 21 years old
  answer: B
  explanation: Vanessa's Law states that an unlicensed teen driver with such violations
    cannot receive a license until they turn 18 and meet several other requirements,
    including retaking driver education.
- id: 7
  category: license_system
  question: What is the minimum vision requirement to pass the vision screening for
    a standard Class D driver's license in Minnesota?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: To pass the Minnesota vision screening, your peripheral vision must
    be at least 105 degrees and your visual acuity must be at least 20/40.
- id: 8
  category: license_system
  question: For a provisional license applicant whose parents completed a supplemental
    parent class, how many hours of supervised driving must be logged?
  choices:
    A: 30 hours (10 at night)
    B: 40 hours (15 at night)
    C: 50 hours (15 at night)
    D: 60 hours (20 at night)
  answer: B
  explanation: In Minnesota, if a parent/guardian completes the supplemental parent
    class, the required supervised driving hours are reduced from 50 to 40 hours (15
    of which must be at night).
- id: 9
  category: license_system
  question: What is the standard fee for a non-alcohol-related driver's license reinstatement
    in Minnesota?
  choices:
    A: $20
    B: $30
    C: $50
    D: $100
  answer: B
  explanation: The reinstatement fee for a license that was suspended or revoked for
    reasons other than alcohol or drugs is $30.
- id: 10
  category: license_system
  question: During the first six months of holding a provisional license, how many
    passengers under the age of 20 are allowed (excluding immediate family)?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: For the first six months of holding a provisional license, only one
    passenger under age 20 is permitted, unless accompanied by a parent or guardian.
- id: 11
  category: license_system
  question: Which of the following is considered a 'Secondary Document' for a Minnesota
    license application?
  choices:
    A: A certified birth certificate
    B: A valid unexpired U.S. passport
    C: A Social Security Card
    D: A Certificate of Citizenship
  answer: C
  explanation: While passports and birth certificates are primary documents, a Social
    Security Card is listed as a secondary document in the Minnesota Driver's Manual.
- id: 12
  category: license_system
  question: A person with a Minnesota instruction permit must be supervised by a licensed
    driver who is at least how old?
  choices:
    A: 18 years old
    B: 19 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: The supervising driver for a permit holder must be 21 years of age
    or older and hold a valid license for the type of vehicle being driven.
- id: 13
  category: license_system
  question: To qualify for a Class D driver's license (full license) in Minnesota,
    a person must be at least 18 years of age or have held a provisional license for
    at least how many consecutive months?
  choices:
    A: 6 months
    B: 10 months
    C: 12 months
    D: 18 months
  answer: C
  explanation: To graduate from a provisional license to a Class D license, you must
    be 18 or have held a provisional license for 12 consecutive months with no convictions
    for alcohol or controlled substance violations.
- id: 14
  category: license_system
  question: In Minnesota, if you are under 18, who must sign your application for
    an instruction permit or driver's license?
  choices:
    A: A teacher
    B: A police officer
    C: A parent or legal guardian
    D: No signature is required if you have a birth certificate
  answer: C
  explanation: If you are under 18, your application must be approved by a parent
    or legal guardian. If you have no parent or guardian, a close relative or employer
    may sign.
- id: 15
  category: license_system
  question: After moving to Minnesota from another state, how many days do you have
    to obtain a Minnesota driver's license if you have a valid license from your previous
    state?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: According to the Minnesota Driver's Manual, new residents have 60 days
    after becoming a resident of the state to obtain a Minnesota driver's license
    (30 days for commercial licenses).
- id: 16
  category: license_system
  question: A Minnesota Class D driver's license allows you to operate a single-unit
    vehicle (car, pickup, or truck) with a Gross Vehicle Weight Rating (GVWR) of up
    to how many pounds?
  choices:
    A: 10,000 lbs
    B: 15,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: A Class D license is the most common and allows the operation of all
    single-unit vehicles (cars, pickups, and small trucks) except those with a GVWR
    of more than 26,000 pounds.
- id: 17
  category: license_system
  question: In Minnesota, if you fail the knowledge test for your permit, how many
    times can you take it for free before you are charged a fee for subsequent attempts?
  choices:
    A: One time
    B: Two times
    C: Three times
    D: Four times
  answer: B
  explanation: Minnesota law dictates that you may take two knowledge tests at no
    cost. A fee of $10 is charged for the third and any subsequent knowledge tests.
- id: 18
  category: license_system
  question: At what minimum age can a Minnesota resident apply for a restricted Farm
    Work Driver's License?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 17 years old
  answer: B
  explanation: A restricted farm work driver's license may be issued to a 15-year-old
    whose help is needed for farm work, provided they meet specific criteria and pass
    the required tests.
- id: 19
  category: license_system
  question: Once you have reached age 21, how often does a standard Minnesota Class
    D driver's license expire?
  choices:
    A: Every 2 years
    B: Every 4 years
    C: Every 5 years
    D: Every 8 years
  answer: B
  explanation: Standard Minnesota driver's licenses for persons age 21 and older expire
    every four years on the person's birthday.
- id: 20
  category: license_system
  question: To operate a motorized bicycle (moped) on Minnesota public roads, a person
    must have at least which of the following?
  choices:
    A: A specialized moped-only license
    B: A motorized bicycle operator's permit
    C: A Class A commercial license
    D: No license is required for mopeds under 50cc
  answer: B
  explanation: To operate a moped, you must have a valid driver's license or a motorized
    bicycle operator's permit (available at age 15).
- id: 21
  category: license_system
  question: Under Minnesota law, what happens to male applicants between the ages
    of 18 and 26 when they apply for a driver's license or state ID?
  choices:
    A: They are automatically registered for the military draft (Selective Service)
    B: They are required to pay a 'young driver' surcharge
    C: They must provide proof of high school graduation
    D: They are issued a provisional license regardless of age
  answer: A
  explanation: Minnesota law requires the Department of Public Safety to provide information
    from license applications to the Selective Service System for males aged 18 to
    26.
- id: 22
  category: license_system
  question: What is the minimum age to apply for a Commercial Driver's License (CDL)
    in Minnesota for intrastate (within MN only) commerce?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 25 years old
  answer: B
  explanation: In Minnesota, you must be at least 18 years old to obtain a CDL for
    intrastate commerce. You must be 21 to drive a commercial vehicle across state
    lines (interstate).
- id: 23
  category: license_system
  question: What is the reinstatement fee for a Minnesota driver's license that was
    revoked due to an alcohol-related offense (DWI)?
  choices:
    A: $30
    B: $250
    C: $680
    D: $1,000
  answer: C
  explanation: The reinstatement fee for a driver's license revoked for alcohol or
    controlled substance-related violations is $680, which is significantly higher
    than non-alcohol-related fees.
- id: 24
  category: license_system
  question: Which license endorsement is required in Minnesota to operate a vehicle
    designed to transport more than 15 passengers (including the driver)?
  choices:
    A: Motorcycle (M) endorsement
    B: Hazardous Materials (H) endorsement
    C: Passenger (P) endorsement
    D: Tanker (T) endorsement
  answer: C
  explanation: A Passenger (P) endorsement is required to operate any vehicle designed
    to carry 16 or more persons, including the driver.
- id: 25
  category: license_system
  question: When applying for a Minnesota driver's license, permit, or ID card, you
    are required to provide which of the following numbers on the application?
  choices:
    A: Your Social Security Number
    B: Your health insurance policy number
    C: Your high school student ID number
    D: Your vehicle's VIN number
  answer: A
  explanation: Applicants for Minnesota driver's licenses or ID cards must provide
    their Social Security number on the application form, as required by state and
    federal law.
- id: 26
  category: license_system
  question: In Minnesota, which of the following license endorsements requires a criminal
    background check?
  choices:
    A: Motorcycle (M)
    B: School Bus (S)
    C: Tanker (T)
    D: Double/Triple Trailers (D)
  answer: B
  explanation: Applicants for a School Bus (S) endorsement must undergo a criminal
    background check and a check of driving records before the endorsement is issued.
- id: 27
  category: driver_testing
  question: When taking the Minnesota road test, what must you provide as proof of
    the vehicle's safety and legality?
  choices:
    A: A notarized letter from a mechanic
    B: A valid insurance identification card or policy
    C: The vehicle's original window sticker
    D: A receipt for a recent oil change
  answer: B
  explanation: To take the road test in Minnesota, you must provide valid proof of
    insurance for the vehicle used during the test.
- id: 28
  category: driver_testing
  question: What is the minimum age to apply for a motorized bicycle (moped) operator's
    permit in Minnesota?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: B
  explanation: In Minnesota, you must be at least 15 years old to apply for a motorized
    bicycle (moped) permit.
- id: 29
  category: driver_testing
  question: Minnesota is a 'No-Fault' insurance state. What does this specifically
    mean for drivers involved in an accident?
  choices:
    A: No one is ever ticketed for a crash
    B: The state pays for all vehicle repairs
    C: Your insurance company pays for your medical costs regardless of who caused
      the crash
    D: Drivers do not need to exchange insurance information
  answer: C
  explanation: Minnesota's No-Fault Act requires policyholders to have Personal Injury
    Protection, which pays for their own medical expenses and other economic losses
    regardless of fault.
- id: 30
  category: driver_testing
  question: 'In Minnesota, a crash report must be filed with Driver and Vehicle Services
    if the crash results in injury, death, or total property damage of at least:'
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,500
  answer: C
  explanation: Drivers involved in a crash resulting in injury, death, or property
    damage of $1,000 or more must file a crash report within 10 days.
- id: 31
  category: driver_testing
  question: If a Minnesota driver has only one usable eye, what is the minimum field
    of vision required to pass the vision screening?
  choices:
    A: 75 degrees
    B: 90 degrees
    C: 105 degrees
    D: 120 degrees
  answer: C
  explanation: If you have only one usable eye, you must have a field of vision of
    at least 105 degrees to pass the Minnesota vision screening.
- id: 32
  category: driver_testing
  question: If you fail the Minnesota road test four times, you must complete how
    many hours of behind-the-wheel instruction before you are allowed to take the
    test again?
  choices:
    A: 2 hours
    B: 4 hours
    C: 6 hours
    D: 10 hours
  answer: C
  explanation: After four failed road tests, Minnesota law requires the applicant
    to complete 6 hours of behind-the-wheel instruction from a licensed driving school.
- id: 33
  category: driver_testing
  question: If you move to Minnesota from a country other than the United States,
    Canada, or US territories, what is the testing requirement to obtain a license?
  choices:
    A: You only need to pass the vision screening
    B: You only need to pass the knowledge test
    C: You must pass the knowledge test and the road test
    D: Your foreign license is automatically converted without testing
  answer: C
  explanation: Drivers moving to Minnesota from countries other than the US, Canada,
    or US territories must pass both the knowledge (written) and road (skills) tests.
- id: 34
  category: driver_testing
  question: According to Minnesota law, when must vehicle registration tabs be displayed
    on your license plate?
  choices:
    A: By the first day of the month following the expiration month
    B: By the 15th of the expiration month
    C: Exactly 30 days after the expiration date
    D: Only if you are driving out of state
  answer: A
  explanation: Registration tabs must be displayed on your license plate by the first
    day of the month following the month of registration/expiration.
- id: 35
  category: driver_testing
  question: Which letter code is used on a Minnesota driver's license to indicate
    a motorcycle endorsement?
  choices:
    A: C
    B: M
    C: S
    D: X
  answer: B
  explanation: The letter 'M' on a Minnesota driver's license indicates that the driver
    is endorsed to operate a motorcycle.
- id: 36
  category: driver_testing
  question: Who is authorized to certify a permanent or temporary disability for a
    Minnesota disability parking certificate?
  choices:
    A: Any licensed driver over age 21
    B: A police officer
    C: A physician, physician assistant, advanced practice registered nurse, or chiropractor
    D: Only the Commissioner of Public Safety
  answer: C
  explanation: A medical professional such as a physician, PA, APRN, or chiropractor
    must certify the disability on the application form.
- id: 37
  category: driver_testing
  question: In Minnesota, if you are at least 18 years old, can you register to vote
    when you apply for a driver's license?
  choices:
    A: No, you must go to a separate election office
    B: Yes, the driver's license application includes a voter registration section
    C: Only if you are applying for a Commercial Driver's License
    D: Only during presidential election years
  answer: B
  explanation: Minnesota law allows eligible citizens to register to vote at the same
    time they apply for or renew a driver's license or ID card.
- id: 38
  category: driver_testing
  question: What is the minimum age requirement to apply for a Minnesota Identification
    Card?
  choices:
    A: 12 years old
    B: 15 years old
    C: 16 years old
    D: There is no minimum age
  answer: D
  explanation: In Minnesota, there is no minimum age requirement to apply for a state
    identification card, though applicants under 18 need parental consent.
- id: 39
  category: driver_testing
  question: To pass the Minnesota knowledge test, you must score at least what percentage?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: The Minnesota knowledge test consists of 40 questions, and you must
    answer at least 80% (32 questions) correctly to pass.
- id: 40
  category: driver_testing
  question: When taking the Minnesota road test, which of the following must you provide
    for the vehicle you are using?
  choices:
    A: A valid vehicle registration and proof of insurance
    B: A notarized letter from the vehicle owner
    C: The vehicle's original title
    D: A maintenance log from the past 12 months
  answer: A
  explanation: Applicants must provide valid proof of insurance and current vehicle
    registration for the vehicle used during the road test.
- id: 41
  category: driver_testing
  question: If you have a medical condition that may affect your ability to drive
    safely, you must notify the Driver and Vehicle Services (DVS) within how many
    days of the diagnosis?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Minnesota law requires drivers to report any medical condition that
    could affect safe driving within 30 days of the diagnosis or change in condition.
- id: 42
  category: driver_testing
  question: Which of the following is an example of a 'Primary Document' required
    when applying for a Minnesota driver's license?
  choices:
    A: A certified U.S. birth certificate
    B: A Social Security card
    C: A high school transcript
    D: A utility bill
  answer: A
  explanation: A certified U.S. birth certificate is considered a primary document.
    Items like Social Security cards are secondary documents, and utility bills are
    proof of residency.
- id: 43
  category: driver_testing
  question: During the Minnesota road test, which of the following actions will result
    in an immediate failure?
  choices:
    A: Failing to use a turn signal once
    B: Disobeying a traffic law
    C: Touching the curb while parallel parking
    D: Driving 2 mph under the speed limit
  answer: B
  explanation: Disobeying a traffic law, dangerous driving, or causing an accident
    are grounds for immediate failure of the Minnesota road test.
- id: 44
  category: driver_testing
  question: To apply for a Minnesota motorized bicycle (moped) operator's permit,
    an applicant must be at least how old?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: In Minnesota, you must be at least 15 years old to apply for a motorized
    bicycle (moped) operator's permit.
- id: 45
  category: driver_testing
  question: If you are under 18 and have a provisional license, you must remain conviction-free
    for how many consecutive months to be eligible for a Class D license?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: Provisional license holders must have no convictions for a moving violation
    or an alcohol/controlled substance violation for 12 consecutive months to upgrade
    to a Class D license.
- id: 46
  category: driver_testing
  question: Which of these is a requirement for the vehicle used during the Minnesota
    road test?
  choices:
    A: It must be a mid-size sedan
    B: The passenger door must open from both the inside and outside
    C: It must have a manual transmission
    D: It must be less than 10 years old
  answer: B
  explanation: For safety and examiner access, the vehicle used for the road test
    must have doors that open from both the inside and outside.
- id: 47
  category: driver_testing
  question: If you fail the Minnesota vision screening, what is the next step required
    by the DVS?
  choices:
    A: You are permanently barred from driving
    B: You must wait 6 months to retest
    C: You must see an eye doctor and have them complete a Vision Report
    D: You must take the knowledge test again
  answer: C
  explanation: If you fail the vision screening, you will be asked to see an eye doctor
    and return with a completed Vision Report to determine if you can drive with restrictions.
- id: 48
  category: driver_testing
  question: During the pre-trip inspection portion of the Minnesota road test, you
    must demonstrate knowledge of which vehicle equipment?
  choices:
    A: How to check the oil level
    B: How to change a flat tire
    C: How to operate the defroster and fan
    D: How to jump-start a battery
  answer: C
  explanation: The road test includes a vehicle safety equipment check where you must
    show you know how to operate the lights, wipers, defroster, and other essential
    controls.
- id: 49
  category: driver_responsibility
  question: After moving to Minnesota and becoming a resident, how many days do you
    have to register your passenger vehicle?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: New Minnesota residents have 60 days to register their passenger vehicle
    or second-stage vehicle after establishing residency.
- id: 50
  category: driver_responsibility
  question: 'If a Minnesota driver is convicted of operating a motor vehicle without
    no-fault insurance, their license may be revoked for up to:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: Driving without insurance in Minnesota is a misdemeanor and can lead
    to license revocation for up to one year and fines.
- id: 51
  category: driver_responsibility
  question: 'Under Minnesota''s Implied Consent Law, by operating a motor vehicle,
    you automatically consent to:'
  choices:
    A: A search of your vehicle's trunk at any time.
    B: A test of your blood, breath, or urine to determine alcohol or drug concentration.
    C: A mandatory 10-year driving ban if you are involved in any crash.
    D: Allowing the police to track your vehicle via GPS.
  answer: B
  explanation: The Implied Consent Law means that if you drive in Minnesota, you consent
    to a chemical test of your blood, breath, or urine if an officer has probable
    cause to believe you are driving under the influence.
- id: 52
  category: driver_responsibility
  question: 'In Minnesota, a person with a standard Class D license is considered
    legally intoxicated (DWI) if their blood alcohol concentration (BAC) reaches:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: For drivers 21 and older, the legal threshold for DWI in Minnesota
    is a BAC of 0.08% or higher.
- id: 53
  category: driver_responsibility
  question: 'Minnesota''s ''Not a Drop'' law states that if a driver under age 21
    is caught driving with any detectable amount of alcohol, their license will be
    suspended for at least:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: A
  explanation: Under the 'Not a Drop' law, a driver under 21 convicted of drinking
    any amount of alcohol while driving will have their driving privileges suspended
    for 30 days for a first offense.
- id: 54
  category: driver_responsibility
  question: 'In Minnesota, fleeing a police officer in a motor vehicle is a serious
    crime classified as a:'
  choices:
    A: Petty misdemeanor
    B: Misdemeanor
    C: Gross misdemeanor
    D: Felony
  answer: D
  explanation: Fleeing a police officer in a motor vehicle is a felony in Minnesota,
    which can result in imprisonment and heavy fines.
- id: 55
  category: driver_responsibility
  question: 'According to Minnesota''s ''Open Bottle Law,'' it is illegal to:'
  choices:
    A: Have an open container of alcohol in the glove compartment.
    B: Have an open container of alcohol in the trunk.
    C: Drink alcohol in the passenger area of a vehicle, but only if the engine is
      running.
    D: Possess an open container of alcohol in the passenger area of a motor vehicle
      on a public highway.
  answer: D
  explanation: Minnesota law prohibits having an open container of alcohol in the
    passenger area of a motor vehicle, regardless of whether the vehicle is moving
    or parked on a public highway.
- id: 56
  category: driver_responsibility
  question: What is the minimum fine for speeding in a Minnesota work zone when workers
    are present?
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: C
  explanation: Minnesota law mandates a minimum fine of $300 for speeding in a work
    zone when workers are present.
- id: 57
  category: driver_responsibility
  question: What is the minimum fine for failing to stop for a school bus with its
    red lights flashing and stop arm extended in Minnesota?
  choices:
    A: $250
    B: $300
    C: $500
    D: $1,000
  answer: C
  explanation: The minimum fine for violating the school bus stop arm law in Minnesota
    is $500.
- id: 58
  category: driver_responsibility
  question: 'Minnesota''s ''Move Over Law'' requires drivers to move to the lane farthest
    away from a stopped emergency vehicle with flashing lights. If you cannot safely
    move over, you must:'
  choices:
    A: Stop in your current lane.
    B: Maintain your current speed and honk.
    C: Reduce your speed and pass with caution.
    D: Turn on your hazard lights and speed up to pass quickly.
  answer: C
  explanation: If you cannot safely move into the lane farthest from the emergency
    vehicle, the law requires you to reduce your speed and pass with caution.
- id: 59
  category: driver_responsibility
  question: 'In Minnesota, the reinstatement fee for a driver''s license revoked due
    to an alcohol-related violation (DWI) is:'
  choices:
    A: $30
    B: $100
    C: $250
    D: $680
  answer: D
  explanation: Drivers whose licenses are revoked for alcohol-related offenses must
    pay a $680 reinstatement fee, in addition to other requirements like passing a
    DWI knowledge test.
- id: 60
  category: driver_responsibility
  question: If you are involved in a crash in Minnesota, you are legally required
    to provide which of the following to other drivers involved?
  choices:
    A: Your vehicle's title and registration history.
    B: Your name, address, date of birth, and insurance information.
    C: Your social security number.
    D: A copy of your driving record.
  answer: B
  explanation: Drivers involved in a crash must provide their name, address, date
    of birth, driver's license number, vehicle registration, and insurance information
    to other drivers involved.
- id: 61
  category: driver_responsibility
  question: 'A Minnesota driver convicted of a first-time DWI with a BAC of 0.16 or
    higher is subject to more severe penalties, which may include:'
  choices:
    A: A simple verbal warning.
    B: Mandatory installation of an ignition interlock device.
    C: A maximum fine of only $50.
    D: No license revocation.
  answer: B
  explanation: For high-BAC offenses (0.16 or higher), Minnesota law requires more
    stringent penalties, including the mandatory use of an ignition interlock device
    or a longer period of license revocation.
- id: 62
  category: driver_responsibility
  question: In Minnesota, every traffic crash that results in injury, death, or total
    property damage of at least how much must be reported to the Commissioner of Public
    Safety?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: C
  explanation: According to the Minnesota Driver's Manual, any crash involving injury,
    death, or total property damage of $1,000 or more must be reported.
- id: 63
  category: driver_responsibility
  question: After a crash that requires a report to the Commissioner of Public Safety,
    within how many days must the report be filed?
  choices:
    A: 24 hours
    B: 72 hours
    C: 10 days
    D: 30 days
  answer: C
  explanation: Minnesota law requires drivers to file a crash report within 10 days
    of the incident if it meets the reporting criteria (injury, death, or $1,000+
    damage).
- id: 64
  category: driver_responsibility
  question: What is the minimum amount of liability insurance coverage required in
    Minnesota for property damage in a single accident?
  choices:
    A: $5,000
    B: $10,000
    C: $25,000
    D: $30,000
  answer: B
  explanation: Minnesota's 'No-Fault' insurance law requires a minimum of $10,000
    for destruction of property of others.
- id: 65
  category: driver_responsibility
  question: Under Minnesota's No-Fault insurance law, what is the minimum required
    liability coverage for injuries to or death of one person?
  choices:
    A: $15,000
    B: $20,000
    C: $30,000
    D: $60,000
  answer: C
  explanation: Minnesota law requires a minimum of $30,000 for injuries to or death
    of one person in any one accident.
- id: 66
  category: driver_responsibility
  question: If you are a new resident of Minnesota, how many days do you have to register
    your vehicle in the state?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: New residents have up to 60 days after becoming a resident to register
    their passenger vehicle or truck, provided the vehicle has a current registration
    in another state.
- id: 67
  category: driver_responsibility
  question: In Minnesota, what does the 'Implied Consent' law mean?
  choices:
    A: You agree to follow all speed limits.
    B: You agree to submit to a chemical test for alcohol or controlled substances
      if requested by an officer.
    C: You agree to carry insurance at all times.
    D: You agree to stop for all school buses.
  answer: B
  explanation: The Implied Consent Law means that if you drive a motor vehicle in
    Minnesota, you automatically consent to a test of your blood, breath, or urine
    to determine alcohol or drug concentration.
- id: 68
  category: driver_responsibility
  question: What is the penalty for a driver who refuses to take a breath test under
    Minnesota's Implied Consent Law?
  choices:
    A: A $50 fine.
    B: A 30-day license suspension.
    C: Revocation of driving privileges for at least one year.
    D: There is no penalty if it is a first offense.
  answer: C
  explanation: Refusal to take the test will result in a one-year revocation of driving
    privileges and is a crime in Minnesota.
- id: 69
  category: driver_responsibility
  question: What is the maximum BAC limit for a person operating a commercial motor
    vehicle in Minnesota?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: The legal BAC limit for commercial vehicle drivers in Minnesota is
    0.04%.
- id: 70
  category: driver_responsibility
  question: Under Minnesota's 'Not a Drop' law, what happens to a driver under age
    21 who is caught operating a vehicle with any detectable amount of alcohol?
  choices:
    A: They receive a warning.
    B: Their driving privileges will be suspended for 30 to 180 days.
    C: They must pay a $1,000 fine but keep their license.
    D: They are only penalized if their BAC is over 0.08%.
  answer: B
  explanation: The 'Not a Drop' law states that any driver under 21 convicted of driving
    with any amount of alcohol will have their driving privileges suspended for 30
    days for a first offense and 180 days for a second offense.
- id: 71
  category: driver_responsibility
  question: Minnesota's 'Open Bottle' law prohibits which of the following?
  choices:
    A: Drinking alcohol in a private residence.
    B: Possessing an open container of alcohol in the passenger area of a motor vehicle
      on a public highway.
    C: Selling alcohol after 10:00 PM.
    D: Transporting unopened alcohol in the trunk.
  answer: B
  explanation: The Open Bottle law makes it illegal to drink or possess an open container
    of alcohol within the passenger area of any motor vehicle on a public highway,
    whether the vehicle is moving or parked.
- id: 72
  category: driver_responsibility
  question: 'In Minnesota, failure to provide proof of insurance at the request of
    a law enforcement officer can lead to:'
  choices:
    A: A verbal warning only.
    B: Revocation of your driver's license and vehicle registration.
    C: A mandatory 5-year prison sentence.
    D: Nothing, if you can prove you have it within 60 days.
  answer: B
  explanation: Operating a vehicle without insurance is a misdemeanor and can lead
    to the revocation of your driver’s license and vehicle registration.
- id: 73
  category: driver_responsibility
  question: Which Minnesota law requires drivers to reduce speed and move to the lane
    farthest away from stopped emergency vehicles with flashing lights?
  choices:
    A: The Vanessa Law
    B: The Ted Foss Move Over Law
    C: The Implied Consent Law
    D: The No-Fault Law
  answer: B
  explanation: The Ted Foss Move Over Law requires drivers to move to the lane farthest
    away from stopped emergency vehicles, tow trucks, or maintenance vehicles with
    flashing lights.
- id: 74
  category: safe_driving_rules
  question: In Minnesota, what is the statutory speed limit in an alley unless otherwise
    posted?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: According to the Minnesota Drivers Manual, the statutory speed limit
    for alleys is 10 mph unless otherwise posted.
- id: 75
  category: safe_driving_rules
  question: When parking your vehicle near a fire hydrant in Minnesota, what is the
    minimum required distance you must maintain?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Minnesota law prohibits parking a vehicle within 10 feet of a fire
    hydrant.
- id: 76
  category: safe_driving_rules
  question: In Minnesota, you are prohibited from parking within how many feet of
    a crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Drivers in Minnesota may not park a vehicle within 20 feet of a crosswalk
    at an intersection.
- id: 77
  category: safe_driving_rules
  question: How far back must you park from a flashing beacon, stop sign, or traffic
    control signal located at the side of a roadway?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Minnesota law requires that you do not park within 30 feet of any flashing
    beacon, stop sign, or traffic control signal.
- id: 78
  category: safe_driving_rules
  question: 'In Minnesota, you must use your headlights when you cannot clearly see
    the road ahead for a distance of at least:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Headlights must be used in Minnesota when visibility is reduced to
    500 feet or less due to weather or darkness.
- id: 79
  category: safe_driving_rules
  question: 'U-turns are illegal in Minnesota if they are made where drivers of other
    vehicles cannot see you from a distance of:'
  choices:
    A: 500 feet
    B: 700 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Minnesota law prohibits U-turns on any curve or near the crest of a
    hill where the vehicle cannot be seen by other drivers within 1,000 feet.
- id: 80
  category: safe_driving_rules
  question: When signaling for a turn or a lane change in Minnesota, you must activate
    your signal at least how many feet before the move?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Minnesota law requires drivers to signal their intent to turn or change
    lanes at least 100 feet before the maneuver.
- id: 81
  category: safe_driving_rules
  question: 'In Minnesota, if you are driving on a two-lane highway with a speed limit
    of 55 mph or higher, you may exceed the limit by 10 mph only when:'
  choices:
    A: It is after midnight and traffic is light
    B: You are passing another vehicle traveling in the same direction
    C: You are driving an emergency vehicle without sirens
    D: You are in a construction zone
  answer: B
  explanation: Minnesota law allows a driver to increase their speed by 10 mph over
    the posted limit to pass another vehicle moving in the same direction on two-lane
    highways with a speed limit of 55 mph or higher.
- id: 82
  category: safe_driving_rules
  question: When parking uphill on a road with a curb, in which direction should you
    turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    so that if the vehicle rolls, the back of the front tire will hit the curb and
    stop the car.
- id: 83
  category: safe_driving_rules
  question: Under Minnesota's 'Not a Drop' law, what is the legal alcohol limit for
    a driver under the age of 21?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: A
  explanation: Minnesota's 'Not a Drop' law means it is illegal for anyone under 21
    to operate a motor vehicle with any detectable amount of alcohol in their system.
- id: 84
  category: safe_driving_rules
  question: In Minnesota, you must dim your high-beam headlights when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: D
  explanation: You must dim your high beams when you are within 1,000 feet of an oncoming
    vehicle or within 200 feet of a vehicle you are following.
- id: 85
  category: safe_driving_rules
  question: When two vehicles reach an intersection at the same time and there is
    no traffic light or signal, which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver who honks first
  answer: B
  explanation: In Minnesota, at an uncontrolled intersection, the driver on the left
    must yield to the driver on the right.
- id: 86
  category: safe_driving_rules
  question: How far in advance must you activate your turn signal before making a
    turn in Minnesota?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: Minnesota law requires drivers to signal their intent to turn at least
    100 feet before the actual turn.
- id: 87
  category: safe_driving_rules
  question: When parking a vehicle on a public road in Minnesota, how far must your
    wheels be from the curb?
  choices:
    A: No more than 6 inches
    B: No more than 12 inches
    C: No more than 18 inches
    D: No more than 24 inches
  answer: B
  explanation: When parallel parking on a public road, your vehicle's wheels must
    be within 12 inches of the curb.
- id: 88
  category: safe_driving_rules
  question: In Minnesota, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Minnesota law prohibits parking a vehicle within 10 feet of a fire
    hydrant.
- id: 89
  category: safe_driving_rules
  question: You may not park your vehicle within how many feet of a crosswalk at an
    intersection in Minnesota?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: In Minnesota, parking is prohibited within 20 feet of a crosswalk at
    an intersection.
- id: 90
  category: safe_driving_rules
  question: In Minnesota, you must not park within how many feet of any flashing beacon,
    stop sign, or traffic control signal?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Drivers are prohibited from parking within 30 feet of any flashing
    beacon, stop sign, or traffic control signal located at the side of a roadway.
- id: 91
  category: safe_driving_rules
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended, how far away must you stop your vehicle in Minnesota?
  choices:
    A: At least 10 feet
    B: At least 20 feet
    C: At least 25 feet
    D: At least 50 feet
  answer: B
  explanation: Minnesota law requires drivers to stop at least 20 feet from a school
    bus that is displaying flashing red lights and an extended stop arm.
- id: 92
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane highway in Minnesota, you must
    return to the right side of the road before coming within how many feet of an
    oncoming vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: A
  explanation: Minnesota law states that you must return to the right lane before
    coming within 100 feet of an oncoming vehicle when passing.
- id: 93
  category: safe_driving_rules
  question: In Minnesota, passing is prohibited on a hill or curve where you cannot
    see clearly for at least how many feet?
  choices:
    A: 500 feet
    B: 700 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: B
  explanation: You may not pass on a hill or curve where you cannot see clearly for
    at least 700 feet.
- id: 94
  category: safe_driving_rules
  question: In Minnesota, U-turns are illegal unless you can see clearly in both directions
    for at least how many feet?
  choices:
    A: 500 feet
    B: 700 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: U-turns are prohibited unless they can be made safely and without interfering
    with other traffic, and only where the driver has at least 1,000 feet of clear
    visibility in both directions.
- id: 95
  category: safe_driving_rules
  question: Under the 'Move Over Law' (Ted Foss Law) in Minnesota, what must you do
    when approaching a stopped emergency vehicle with its lights flashing on a multi-lane
    highway?
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk your horn
    C: Move to the lane farthest away from the vehicle if safe to do so
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: The Ted Foss Law requires drivers to move to the lane farthest away
    from a stopped emergency vehicle with flashing lights if a lane is available;
    if not, the driver must slow down.
- id: 96
  category: defensive_driving
  question: According to the Minnesota Driver's Manual, what is the recommended following
    distance under ideal driving conditions?
  choices:
    A: One car length for every 10 mph
    B: The two-second rule
    C: The three-second rule
    D: The five-second rule
  answer: C
  explanation: Minnesota's manual recommends the 'three-second rule' as a standard
    following distance under ideal conditions to allow enough time to react to hazards.
- id: 97
  category: defensive_driving
  question: Under Minnesota law, you must have your headlights on during which of
    the following conditions?
  choices:
    A: Only between sunset and sunrise
    B: Whenever it is raining, snowing, sleeting, or hailing
    C: Only when visibility is less than 200 feet
    D: Only when driving on highways
  answer: B
  explanation: Minnesota law requires headlights to be on when it is raining, snowing,
    sleeting, or hailing, and any time you cannot clearly see the road ahead for a
    distance of at least 500 feet.
- id: 98
  category: defensive_driving
  question: At what speed can hydroplaning begin to occur on wet Minnesota roads?
  choices:
    A: At speeds as low as 35 mph
    B: Only at speeds above 55 mph
    C: Only during heavy downpours at 65 mph
    D: At speeds as low as 20 mph
  answer: A
  explanation: According to the Minnesota Driver's Manual, hydroplaning (where tires
    lose contact with the road and float on water) can begin at speeds as low as 35
    mph.
- id: 99
  category: defensive_driving
  question: To maintain proper 'scanning' and awareness, the Minnesota Driver's Manual
    suggests looking how far down the road?
  choices:
    A: 5 to 8 seconds ahead
    B: 10 to 15 seconds ahead
    C: 20 to 30 seconds ahead
    D: Exactly one mile ahead
  answer: B
  explanation: Drivers are encouraged to look 10 to 15 seconds ahead to anticipate
    traffic flow and potential hazards.
- id: 100
  category: defensive_driving
  question: If your vehicle becomes stranded in a severe Minnesota winter storm, what
    is the safest course of action?
  choices:
    A: Walk to the nearest house for help regardless of distance
    B: Stay in the vehicle and keep the exhaust pipe clear of snow
    C: Leave the engine running continuously to stay warm
    D: Keep all windows tightly closed to trap heat
  answer: B
  explanation: In a winter survival situation, you should stay with your vehicle.
    It is critical to keep the exhaust pipe clear of snow to prevent carbon monoxide
    poisoning and slightly crack a window for fresh air.
- id: 101
  category: defensive_driving
  question: When driving in heavy fog in Minnesota, which light setting should you
    use?
  choices:
    A: High beams to cut through the fog
    B: Parking lights only
    C: Low beams
    D: Hazard lights only
  answer: C
  explanation: Low beams should be used in fog. High beams reflect off the fog particles,
    creating a 'white wall' effect that reduces visibility further.
- id: 102
  category: defensive_driving
  question: When passing a bicyclist in Minnesota, what is the minimum legal distance
    you must maintain between your vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Minnesota law requires a minimum of 3 feet of clearance between your
    vehicle and a bicycle when passing.
- id: 103
  category: defensive_driving
  question: If you are involved in a skid on an icy Minnesota road, how should you
    steer?
  choices:
    A: In the opposite direction of the skid
    B: In the direction you want the front of the vehicle to go
    C: Keep the steering wheel perfectly straight
    D: Turn the wheel sharply to the left
  answer: B
  explanation: If you begin to skid, take your foot off the accelerator and steer
    in the direction you want the front of the vehicle to go.
- id: 104
  category: defensive_driving
  question: What is the 'zipper merge' recommended by MnDOT when a lane is closed
    due to construction?
  choices:
    A: Merge as early as possible into the open lane
    B: Stop in the closed lane and wait for someone to let you in
    C: Stay in your lane until the point of merge, then take turns with other drivers
    D: Speed up to get ahead of the queue before the lane ends
  answer: C
  explanation: The zipper merge encourages drivers to use both lanes until the merge
    point and then take turns, which reduces traffic backup and improves safety.
- id: 105
  category: defensive_driving
  question: When driving on Minnesota roads where deer are active, what is the best
    defensive driving practice?
  choices:
    A: Always swerve to avoid hitting a deer
    B: Blow your horn continuously while driving through woods
    C: Scan the sides of the road and be prepared to brake, but do not swerve into
      oncoming traffic
    D: Drive with your hazard lights on at all times
  answer: C
  explanation: The Minnesota manual advises drivers to avoid swerving if a deer is
    encountered, as swerving can lead to more serious head-on collisions or rollovers.
    Braking firmly is the safer option.
- id: 106
  category: defensive_driving
  question: When entering a roundabout in Minnesota, whom must you yield to?
  choices:
    A: Traffic entering from the right
    B: Vehicles already in the roundabout
    C: Only emergency vehicles
    D: No one; you have the right of way when entering
  answer: B
  explanation: Drivers entering a roundabout must yield to vehicles already circulating
    within the intersection.
- id: 107
  category: defensive_driving
  question: Under normal conditions, the Minnesota Driver's Manual recommends which
    following distance to ensure a safe gap between you and the vehicle ahead?
  choices:
    A: A one-second rule
    B: A two-second rule
    C: A three-second rule
    D: A five-second rule
  answer: C
  explanation: The Minnesota Driver's Manual recommends the 'three-second rule' under
    normal driving conditions to maintain a safe following distance.
- id: 108
  category: defensive_driving
  question: According to the Minnesota Driver's Manual, at what speed can hydroplaning
    begin, where tires lose contact with the road surface on wet pavement?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph. At speeds of 55
    mph or higher, tires may lose all contact with the road.
- id: 109
  category: defensive_driving
  question: 'In Minnesota, headlights must be turned on during any weather condition
    (rain, snow, sleet, hail, or fog) and any time you cannot clearly see the road
    ahead for a distance of at least:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Minnesota law requires headlights to be on when visibility is reduced
    to 500 feet or less, and during precipitation.
- id: 110
  category: defensive_driving
  question: To scan the road properly and avoid last-minute maneuvers, the Minnesota
    Driver's Manual suggests looking ahead at least how many seconds?
  choices:
    A: 3 to 5 seconds
    B: 5 to 8 seconds
    C: 10 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Scanning the road 10 to 15 seconds ahead allows you to anticipate hazards
    and adjust your driving accordingly.
- id: 111
  category: defensive_driving
  question: 'Minnesota law allows a driver to increase their speed by 10 mph over
    the posted limit only when:'
  choices:
    A: Driving on a multi-lane freeway
    B: Passing another vehicle on a two-lane highway with a posted limit of 55 mph
      or higher
    C: Driving in a rural residential area
    D: The driver is late for an emergency
  answer: B
  explanation: The speed limit is increased by 10 mph when the driver is lawfully
    passing another vehicle in the same direction on a two-lane highway with a posted
    speed limit of 55 mph or higher.
- id: 112
  category: defensive_driving
  question: In Minnesota, you are prohibited from following within how many feet of
    a fire truck or other fire apparatus traveling in response to an alarm?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Minnesota law states you must not follow within 500 feet of any fire
    apparatus traveling in response to a fire alarm.
- id: 113
  category: defensive_driving
  question: 'To maintain safe traction and prevent hydroplaning, Minnesota law requires
    tires to have a minimum tread depth of:'
  choices:
    A: 1/32 of an inch
    B: 1/16 of an inch
    C: 1/8 of an inch
    D: 1/4 of an inch
  answer: B
  explanation: In Minnesota, it is illegal to drive a vehicle with tires that have
    less than 1/16 of an inch of tread depth.
- id: 114
  category: defensive_driving
  question: 'In Minnesota, you may not make a U-turn unless you can be seen by drivers
    approaching from either direction for at least:'
  choices:
    A: 500 feet
    B: 700 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: U-turns are prohibited unless they can be made safely and without interfering
    with other traffic, and only where you are visible for 1,000 feet in both directions.
- id: 115
  category: alcohol_drugs_health
  question: 'Under Minnesota''s Implied Consent Law, if you refuse to submit to a
    chemical test for intoxication, your driving privileges will be revoked for at
    least:'
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: One year
  answer: D
  explanation: Under the Implied Consent Law, refusal to take a breath, blood, or
    urine test results in a minimum one-year revocation of driving privileges.
- id: 116
  category: alcohol_drugs_health
  question: According to Vanessa's Law, an unlicensed teen driver who receives an
    alcohol-related violation cannot get a license until age 18. At age 18, which
    of these is a requirement they must fulfill?
  choices:
    A: Pay a reinstatement fee of up to $680
    B: Pass the knowledge test
    C: Hold an instruction permit for six months
    D: All of the above
  answer: D
  explanation: Under Vanessa's Law, an alcohol-violator must wait until 18, pay the
    $680 reinstatement fee, pass the knowledge test, hold a permit for 6 months, and
    then pass the road test.
- id: 117
  category: alcohol_drugs_health
  question: 'For a first-time DWI offense in Minnesota with a BAC of less than 0.16,
    the minimum period of driver''s license revocation is typically:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: A first-time DWI offense with a BAC below 0.16 generally carries a
    90-day revocation period (which can sometimes be reduced with a guilty plea).
- id: 118
  category: alcohol_drugs_health
  question: 'In Minnesota, it is illegal to possess an open container of an alcoholic
    beverage in a motor vehicle unless the container is:'
  choices:
    A: In the glove compartment
    B: In the trunk (or an area not normally occupied by passengers)
    C: On the floor of the back seat
    D: Held by a passenger over age 21
  answer: B
  explanation: The Open Container Law prohibits open bottles or cans of alcohol in
    the passenger area; they must be kept in the trunk or another area not occupied
    by passengers.
- id: 119
  category: alcohol_drugs_health
  question: In Minnesota, if a driver is arrested for a first-time DWI and their BAC
    is ______ or higher, they face much more severe 'aggravating' penalties.
  choices:
    A: '0.10'
    B: '0.12'
    C: '0.16'
    D: '0.20'
  answer: C
  explanation: A BAC of 0.16 or higher is considered an aggravating factor in Minnesota,
    leading to doubled fines, longer revocation periods, and mandatory ignition interlock
    or vehicle forfeiture.
- id: 120
  category: alcohol_drugs_health
  question: 'For drivers of commercial motor vehicles (CMV) in Minnesota, the legal
    BAC limit is:'
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Federal and Minnesota state laws set a stricter BAC limit of 0.04%
    for drivers operating commercial motor vehicles.
- id: 121
  category: alcohol_drugs_health
  question: Which of the following is true regarding prescription drugs and driving
    in Minnesota?
  choices:
    A: You cannot be charged with a DWI if the drug was prescribed by a doctor
    B: You can be charged with a DWI if the drug impairs your ability to drive safely
    C: Prescription drugs only affect driving if mixed with alcohol
    D: Only illegal 'street' drugs result in a DWI charge
  answer: B
  explanation: Minnesota's DWI laws apply to alcohol, controlled substances, and hazardous
    substances. If a prescription drug impairs your driving, you can be arrested for
    DWI.
- id: 122
  category: alcohol_drugs_health
  question: 'In Minnesota, a DWI offense is considered a felony if it is the driver''s:'
  choices:
    A: Second offense within 5 years
    B: Third offense within 10 years
    C: Fourth offense within 10 years
    D: Any offense involving a crash
  answer: C
  explanation: A fourth DWI conviction within a 10-year period is a felony in Minnesota,
    which can result in up to seven years in prison.
- id: 123
  category: alcohol_drugs_health
  question: If your license is revoked for a DWI, you may be required to participate
    in the Ignition Interlock Device Program. What is the primary function of this
    device?
  choices:
    A: It tracks the vehicle's location via GPS
    B: It limits the vehicle's speed to 55 mph
    C: It prevents the vehicle from starting if it detects alcohol on the driver's
      breath
    D: It records video of the driver while the car is in motion
  answer: C
  explanation: An Ignition Interlock Device (IID) is a breathalyzer installed in a
    vehicle that prevents the engine from starting if the driver's BAC exceeds a pre-set
    low limit.
- id: 124
  category: alcohol_drugs_health
  question: Alcohol is a depressant. Which of the following is typically the first
    ability affected by alcohol consumption?
  choices:
    A: Vision
    B: Judgment
    C: Muscle coordination
    D: Reaction time
  answer: B
  explanation: Judgment is the first ability to be impaired by alcohol. Drivers may
    take risks they otherwise wouldn't and fail to recognize they are becoming impaired.
- id: 125
  category: alcohol_drugs_health
  question: 'Under Minnesota law, refusing to submit to a chemical test (breath, blood,
    or urine) for intoxication is:'
  choices:
    A: A civil infraction only
    B: A crime
    C: Legal if you haven't been in a crash
    D: Only punishable by a $50 fine
  answer: B
  explanation: In Minnesota, refusing to take a court-ordered chemical test is a crime
    and carries criminal penalties in addition to administrative license revocation.
- id: 126
  category: alcohol_drugs_health
  question: 'If you are a Minnesota driver with a medical condition like insulin-treated
    diabetes or epilepsy, you must:'
  choices:
    A: Never drive at night
    B: Only drive with a passenger
    C: Report the condition and provide a physician's statement to Driver and Vehicle
      Services
    D: Wait until you are 21 to get a license
  answer: C
  explanation: Drivers with certain medical conditions must submit a medical statement
    from a physician to DVS to ensure the condition is controlled and they can drive
    safely.
- id: 127
  category: alcohol_drugs_health
  question: What does Minnesota's 'Implied Consent' law mean for drivers?
  choices:
    A: You agree to obey all speed limits
    B: You agree to a breath, blood, or urine test if an officer has probable cause
      to believe you are impaired
    C: You agree to carry insurance at all times
    D: You agree to allow passengers to drink alcohol as long as you remain sober
  answer: B
  explanation: The Implied Consent law means that if you drive a motor vehicle in
    Minnesota, you consent to a chemical test of your blood, breath, or urine to determine
    the presence of alcohol or controlled substances.
- id: 128
  category: alcohol_drugs_health
  question: In Minnesota, what is the maximum fine for a first-offense DWI (misdemeanor)?
  choices:
    A: $500
    B: $1,000
    C: $3,000
    D: $5,000
  answer: B
  explanation: A first-offense DWI in Minnesota is a misdemeanor punishable by up
    to 90 days in jail and/or a $1,000 fine.
- id: 129
  category: alcohol_drugs_health
  question: Under Minnesota law, where is it legal to keep an open container of alcohol
    in a motor vehicle?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: In the trunk or an area not normally occupied by passengers
    D: In the center console
  answer: C
  explanation: Minnesota's Open Container law prohibits having open bottles or containers
    of alcohol in the passenger area. They must be kept in the trunk or another area
    not occupied by passengers.
- id: 130
  category: alcohol_drugs_health
  question: In Minnesota, a driver can be charged with a felony DWI if they commit
    a fourth DWI violation within how many years?
  choices:
    A: 5 years
    B: 10 years
    C: 15 years
    D: 20 years
  answer: B
  explanation: A fourth DWI offense within a ten-year period may result in a felony
    DWI charge in Minnesota.
- id: 131
  category: alcohol_drugs_health
  question: Which of the following is considered an 'aggravating factor' that can
    lead to harsher DWI penalties in Minnesota?
  choices:
    A: Driving with a BAC of 0.16 or higher
    B: Having a child under age 16 in the vehicle
    C: Having a prior DWI conviction within the past 10 years
    D: All of the above
  answer: D
  explanation: Aggravating factors in Minnesota include a BAC of 0.16 or higher, prior
    DWI convictions within 10 years, and having a child under age 16 in the vehicle
    at the time of the offense.
- id: 132
  category: alcohol_drugs_health
  question: If a Minnesota law enforcement officer asks you to take a 'pre-arrest'
    breath test (PBT) and you refuse, what happens?
  choices:
    A: Your license is automatically revoked for 1 year
    B: The officer may still arrest you based on other evidence and then require a
      formal test
    C: You will be fined $500 on the spot
    D: Nothing, the PBT is completely voluntary with no consequences
  answer: B
  explanation: While refusal to take the formal evidentiary test (after arrest) leads
    to revocation, refusal of the roadside pre-arrest breath test can still lead to
    an arrest based on other observations, which then triggers the Implied Consent
    requirements.
- id: 133
  category: alcohol_drugs_health
  question: For a commercial motor vehicle driver in Minnesota, what is the BAC limit
    at which they can be charged with a DWI?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: Drivers of commercial motor vehicles are subject to a stricter BAC
    limit of 0.04% in Minnesota.
- id: 134
  category: alcohol_drugs_health
  question: When alcohol is consumed, which of the following functions is usually
    the first to be affected?
  choices:
    A: Vision
    B: Muscle coordination
    C: Judgment
    D: Hearing
  answer: C
  explanation: Alcohol affects the central nervous system. Judgment is typically the
    first function to be impaired, even before physical coordination or vision.
- id: 135
  category: alcohol_drugs_health
  question: Is it legal to drive in Minnesota if you are using a prescription drug
    that makes you drowsy?
  choices:
    A: Yes, as long as the drug was legally prescribed by a doctor
    B: Yes, if you only drive during daylight hours
    C: No, it is illegal to drive while under the influence of any substance that
      impairs your ability to drive safely
    D: No, unless you have a written note from your pharmacist
  answer: C
  explanation: Minnesota law prohibits driving while under the influence of any controlled
    substance or drug, including legal prescription medications, if they impair your
    ability to operate a vehicle safely.
- id: 136
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in the context of driving safety?
  choices:
    A: The effect of mixing different types of alcohol
    B: The combined effect of alcohol and another drug, which is greater than the
      sum of each separately
    C: The speed at which the liver processes alcohol
    D: The recovery time after a DWI conviction
  answer: B
  explanation: The synergistic effect occurs when alcohol is combined with other drugs
    (even over-the-counter ones), resulting in much higher levels of impairment than
    either substance would cause alone.
- id: 137
  category: alcohol_drugs_health
  question: 'In Minnesota, a driver under age 21 who is convicted of a second ''Not
    a Drop'' violation will have their license suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: One year
  answer: C
  explanation: A second violation of the 'Not a Drop' law for a driver under 21 results
    in a 180-day suspension of driving privileges.
- id: 138
  category: penalties_and_points
  question: In Minnesota, if you are caught driving in excess of 100 mph, your driving
    privileges will be revoked for at least how long?
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: According to the Minnesota Driver's Manual, if you are caught driving
    in excess of 100 mph, your driving privileges will be revoked for a minimum of
    six months.
- id: 139
  category: penalties_and_points
  question: Under Minnesota's Implied Consent Law, what happens if you refuse to submit
    to a chemical test of your blood, breath, or urine?
  choices:
    A: Your license will be suspended for 30 days.
    B: Your driving privileges will be revoked for at least one year.
    C: You will be required to pay a $100 fine only.
    D: Nothing, as long as it is your first offense.
  answer: B
  explanation: Minnesota's Implied Consent Law states that if you refuse to take a
    chemical test to determine alcohol concentration, your driving privileges will
    be revoked for a period of one to six years.
- id: 140
  category: penalties_and_points
  question: 'For a second or subsequent violation of Minnesota''s ''Hands-Free'' law
    (texting or using a wireless device), the fine is:'
  choices:
    A: ' $50 plus court fees'
    B: ' $150 plus court fees'
    C: ' $275 plus court fees'
    D: ' $500 plus court fees'
  answer: C
  explanation: While the first offense for violating the hands-free law is a $50 fine,
    the second and subsequent violations carry a $275 fine plus court costs.
- id: 141
  category: penalties_and_points
  question: A Minnesota driver's license may be suspended if the driver is convicted
    of how many moving violations within a 12-month period?
  choices:
    A: 2 violations
    B: 3 violations
    C: 4 violations
    D: 5 violations
  answer: C
  explanation: Minnesota does not use a point system, but the DVS may suspend the
    license of a driver who is convicted of four moving violations within 12 months,
    or five within 24 months.
- id: 142
  category: penalties_and_points
  question: 'If your license is revoked for a DWI, you may be eligible to regain driving
    privileges by enrolling in the:'
  choices:
    A: Safe Driver Program
    B: Ignition Interlock Device Program
    C: Minnesota Speed Awareness Course
    D: Habitual Offender Program
  answer: B
  explanation: The Ignition Interlock Device Program allows drivers with revoked licenses
    due to alcohol violations to regain legal driving status by installing a breath-testing
    device in their vehicle.
- id: 143
  category: penalties_and_points
  question: Under Minnesota's 'Hands-Free' law, what is the fine for a second or subsequent
    violation for using a wireless communication device while driving?
  choices:
    A: $50 plus court fees
    B: $125 plus court fees
    C: $225 plus court fees
    D: $275 plus court fees
  answer: D
  explanation: While the first offense for violating the hands-free law is $50 plus
    court fees, the second and subsequent violations carry a fine of $275 plus court
    fees.
- id: 144
  category: penalties_and_points
  question: In Minnesota, a person with a Blood Alcohol Concentration (BAC) of ____
    or higher who is in control of a moving or parked vehicle can be arrested for
    DWI.
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: In Minnesota, the legal limit for BAC while operating or being in physical
    control of a motor vehicle is 0.08% for drivers age 21 and older.
- id: 145
  category: penalties_and_points
  question: What is the fine for a violation of the 'Move Over Law' in Minnesota,
    which requires drivers to move to the lane farthest away from stopped emergency
    vehicles?
  choices:
    A: $50
    B: Greater than $100
    C: $500
    D: $1,000
  answer: B
  explanation: Violating the 'Move Over Law' (Ted Foss Law) in Minnesota is a petty
    misdemeanor, and the fine is typically greater than $100.
- id: 146
  category: penalties_and_points
  question: 'In Minnesota, if you are convicted of speeding in a marked construction
    zone, the fine is:'
  choices:
    A: Waived for first-time offenders
    B: The same as a normal speeding ticket
    C: Doubled
    D: A flat $300 regardless of speed
  answer: C
  explanation: Minnesota law dictates that fines for speeding in a work zone are doubled
    when workers are present or when specific signage is posted.
- id: 147
  category: penalties_and_points
  question: 'In Minnesota, it is illegal to possess an open container of alcohol or
    consume alcohol inside a motor vehicle when it is on a public highway. This is
    known as the:'
  choices:
    A: Zero Tolerance Law
    B: Open Container Law
    C: Dram Shop Act
    D: Implied Consent Law
  answer: B
  explanation: The Open Container Law makes it a crime to have an open container of
    an alcoholic beverage in the passenger area of a motor vehicle on a public highway,
    regardless of whether the vehicle is moving or parked.
- id: 148
  category: penalties_and_points
  question: 'A first-offense DWI in Minnesota is typically classified as a:'
  choices:
    A: Petty Misdemeanor
    B: Misdemeanor
    C: Gross Misdemeanor
    D: Felony
  answer: B
  explanation: A first-offense DWI with a BAC under 0.16 is usually a misdemeanor
    in Minnesota, punishable by up to 90 days in jail and/or a $1,000 fine.
- id: 149
  category: penalties_and_points
  question: For commercial motor vehicle drivers in Minnesota, what is the maximum
    Blood Alcohol Concentration (BAC) allowed before they are considered to be driving
    under the influence?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: The legal BAC limit for drivers of commercial motor vehicles in Minnesota
    is 0.04%, which is stricter than the 0.08% limit for standard Class D drivers.
- id: 150
  category: penalties_and_points
  question: What is the 'Not-a-Drop' law in Minnesota?
  choices:
    A: A law prohibiting open containers in the trunk
    B: A law requiring zero alcohol consumption for drivers under 21
    C: A law prohibiting any alcohol in commercial vehicles
    D: A law requiring immediate license revocation for any BAC over 0.08%
  answer: B
  explanation: Minnesota's 'Not-a-Drop' law states that it is illegal for a person
    under age 21 to operate a motor vehicle with any detectable amount of alcohol
    in their system.
- id: 151
  category: sharing_the_road
  question: In Minnesota, it is illegal to follow a fire truck or other emergency
    vehicle answering an alarm within how many feet?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Minnesota law prohibits following a fire apparatus (fire truck) traveling
    on an emergency run within 500 feet.
- id: 152
  category: sharing_the_road
  question: If you are driving and a pedestrian is crossing the road at an intersection
    without a marked crosswalk, what is the rule in Minnesota?
  choices:
    A: The pedestrian must yield to all motor vehicles
    B: You must yield the right-of-way to the pedestrian
    C: You only yield if the pedestrian is in a marked crosswalk
    D: You should honk to warn the pedestrian to get out of the way
  answer: B
  explanation: In Minnesota, every corner is considered a crosswalk, whether it is
    marked or unmarked. Drivers must yield the right-of-way to pedestrians crossing
    at intersections.
- id: 153
  category: sharing_the_road
  question: Under Minnesota law, which of the following motorcycle riders is required
    to wear a helmet?
  choices:
    A: Only the passenger, regardless of age
    B: Only the operator, regardless of age
    C: All riders under the age of 18 and those with a learner's permit
    D: Helmets are optional for all riders over the age of 16
  answer: C
  explanation: In Minnesota, motorcycle helmets are required for all operators and
    passengers under 18 years of age, and for all operators driving with a motorcycle
    instruction permit.
- id: 154
  category: sharing_the_road
  question: When driving near large commercial trucks, what are 'No-Zones'?
  choices:
    A: Areas where trucks are not allowed to drive
    B: Blind spots where the truck driver cannot see your vehicle
    C: Special lanes reserved for high-occupancy vehicles
    D: Parking areas specifically for semi-trucks
  answer: B
  explanation: No-Zones are the large blind spots around a commercial truck (front,
    back, and sides) where the driver has limited or no visibility of other vehicles.
- id: 155
  category: sharing_the_road
  question: In which situation are you NOT required to stop for a school bus with
    its red lights flashing in Minnesota?
  choices:
    A: When you are on the opposite side of a divided highway separated by a physical
      barrier
    B: When you are behind the bus on a four-lane road
    C: When the bus is stopped in a residential zone
    D: When you are traveling in the opposite direction on an undivided two-lane road
  answer: A
  explanation: Drivers traveling in the opposite direction of a school bus on a divided
    highway (separated by a physical barrier like a median) are not required to stop.
- id: 156
  category: sharing_the_road
  question: Is 'lane splitting' (operating a motorcycle between rows of stopped or
    moving vehicles) legal in Minnesota?
  choices:
    A: Yes, but only if traffic is moving slower than 15 mph
    B: Yes, it is legal for all motorcycles
    C: No, it is illegal in Minnesota
    D: Yes, but only on highways with 3 or more lanes
  answer: C
  explanation: Lane splitting is illegal in Minnesota. However, two motorcycles are
    permitted to operate side-by-side in a single lane.
- id: 157
  category: sharing_the_road
  question: If an emergency vehicle with sirens and lights is approaching you while
    you are in the middle of an intersection, what should you do?
  choices:
    A: Stop immediately in the intersection
    B: Turn left to get out of the way
    C: Drive through the intersection and then pull over to the right
    D: Back up out of the intersection
  answer: C
  explanation: If you are in an intersection when an emergency vehicle approaches,
    do not stop. Proceed through the intersection before pulling over to the right
    side of the road.
- id: 158
  category: sharing_the_road
  question: When you are preparing to make a right turn and a bicyclist is in the
    bike lane to your right, what must you do?
  choices:
    A: Speed up to pass the bicyclist before turning
    B: Yield to the bicyclist and wait for them to pass before turning
    C: Honk to signal the bicyclist to stop
    D: Turn immediately; the bicyclist must yield to turning vehicles
  answer: B
  explanation: Drivers must yield to bicyclists when turning. You should not 'hook'
    a bicyclist by turning across their path; wait for them to clear the intersection.
- id: 159
  category: sharing_the_road
  question: In Minnesota, what must you do when you see a pedestrian with a white
    cane or a guide dog?
  choices:
    A: Honk your horn to let them know you are there
    B: Slow down and proceed with caution
    C: Give them the right-of-way and stop at least 10 feet away
    D: Yield the right-of-way and use extra caution to ensure their safety
  answer: D
  explanation: Minnesota law requires drivers to yield the right-of-way to blind pedestrians
    carrying a white cane or using a guide dog. You must use extreme caution.
- id: 160
  category: sharing_the_road
  question: Why do large trucks often swing wide to the left before making a right
    turn?
  choices:
    A: To check for traffic in the left lane
    B: Because they are required to by law
    C: To clear the curb with their rear wheels
    D: To signal other drivers to stay back
  answer: C
  explanation: Because of their length, large trucks must swing wide to the left to
    avoid driving over the curb or hitting objects on the sidewalk with their rear
    wheels during a right turn.
- id: 161
  category: sharing_the_road
  question: The Minnesota 'Move Over Law' applies to which of the following stationary
    vehicles with flashing lights?
  choices:
    A: Ambulances and fire trucks only
    B: Police cars only
    C: Tow trucks, service vehicles, and road maintenance vehicles
    D: All of the above
  answer: D
  explanation: The Move Over Law applies to all emergency vehicles, as well as tow
    trucks, service vehicles, and road maintenance vehicles that are stopped on the
    side of the road with flashing lights.
- id: 162
  category: sharing_the_road
  question: 'In Minnesota, if you are driving and encounter a pedestrian with a white
    cane or a guide dog, you must:'
  choices:
    A: Honk to let them know you are there
    B: Slow down and proceed with caution
    C: Come to a complete stop and yield the right-of-way
    D: Drive around them if there is enough space
  answer: C
  explanation: Minnesota law states that drivers must come to a complete stop and
    yield the right-of-way to any pedestrian carrying a white cane or using a guide
    dog.
- id: 163
  category: sharing_the_road
  question: When following a fire apparatus (fire truck) that is responding to an
    emergency in Minnesota, what is the minimum distance you must maintain?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Minnesota law prohibits following a fire truck responding to an alarm
    closer than 500 feet.
- id: 164
  category: sharing_the_road
  question: 'In Minnesota, a commercial truck''s ''No-Zones'' refer to:'
  choices:
    A: Areas where trucks are not allowed to drive
    B: The blind spots around the front, back, and sides of the truck
    C: Loading zones for commercial vehicles
    D: Weight-restricted bridges
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a commercial truck
    where the driver cannot see other vehicles.
- id: 165
  category: sharing_the_road
  question: 'When a bicycle is operating on a Minnesota roadway, they generally have:'
  choices:
    A: No legal right to be on the road
    B: The same rights and duties as a motor vehicle driver
    C: The right to ignore traffic signals
    D: The requirement to always ride on the sidewalk
  answer: B
  explanation: Under Minnesota law, bicyclists generally have the same rights and
    responsibilities as drivers of motor vehicles.
- id: 166
  category: sharing_the_road
  question: 'In Minnesota, if an emergency vehicle with sirens and flashing lights
    is approaching you from behind on a two-way street, you should:'
  choices:
    A: Stop exactly where you are
    B: Pull to the right and stop
    C: Speed up to get out of the way
    D: Pull to the left and stop
  answer: B
  explanation: When an emergency vehicle with active sirens/lights approaches, you
    must pull to the right and stop until the vehicle has passed.
- id: 167
  category: sharing_the_road
  question: According to Minnesota law, who has the right-of-way at an intersection
    with no marked crosswalks?
  choices:
    A: The motorist, because there is no marked crosswalk
    B: The pedestrian, because every intersection is considered a crosswalk
    C: Whoever arrives at the intersection first
    D: The motorist, but only if they honk first
  answer: B
  explanation: In Minnesota, every intersection is considered a crosswalk, whether
    it is marked or unmarked, and motorists must yield to pedestrians.
- id: 168
  category: sharing_the_road
  question: 'When turning right across a bicycle lane in Minnesota, you should:'
  choices:
    A: Turn quickly from your current lane without looking
    B: Signal, check for bicyclists, and move into the bike lane before turning
    C: Stop in the middle of the road and wait for all bikes to pass
    D: Always yield to bikes, but never enter the bike lane
  answer: B
  explanation: The Minnesota Driver's Manual instructs drivers to signal, check for
    bicyclists, and move into the bike lane (if clear) before making a right turn.
- id: 169
  category: sharing_the_road
  question: 'In Minnesota, it is illegal to pass a school bus on the right when the
    bus is displaying:'
  choices:
    A: Hazard lights only
    B: Pre-warning amber (yellow) flashing lights
    C: A turn signal
    D: Any lights at all
  answer: B
  explanation: In Minnesota, it is illegal to pass a school bus on the right when
    it is displaying flashing amber (yellow) lights.
- id: 170
  category: sharing_the_road
  question: 'When a commercial truck is making a right turn at an intersection, you
    should be aware that:'
  choices:
    A: It will always stay in the right-most lane
    B: It may need to swing wide to the left to complete the turn
    C: It can stop faster than a passenger car
    D: It has a smaller blind spot on the right side
  answer: B
  explanation: Because of their length, large trucks often need to swing wide to the
    left to clear the curb when making a right turn.
- id: 171
  category: vehicle_information
  question: 'In Minnesota, you must dim your high-beam headlights when you are following
    another vehicle at a distance of:'
  choices:
    A: 200 feet or less
    B: 300 feet or less
    C: 500 feet or less
    D: 1,000 feet or less
  answer: A
  explanation: When following another vehicle from behind, you must use low beams
    if you are within 200 feet of that vehicle.
- id: 172
  category: vehicle_information
  question: What is the minimum legal tread depth for tires on a passenger vehicle
    in Minnesota?
  choices:
    A: 1/32 of an inch
    B: 1/16 of an inch
    C: 1/8 of an inch
    D: 1/4 of an inch
  answer: B
  explanation: Minnesota law states that tires are considered unsafe if they have
    a tread depth of less than 1/16 of an inch.
- id: 173
  category: vehicle_information
  question: In Minnesota, for most passenger cars, what is the maximum level of window
    tint allowed on side and rear windows?
  choices:
    A: No more than 20% light transmission
    B: No more than 35% light transmission
    C: No less than 50% light transmission
    D: No less than 70% light transmission
  answer: C
  explanation: Minnesota law generally prohibits window tint on passenger cars that
    allows less than 50% light transmission or has a luminous reflectance of more
    than 20%.
- id: 174
  category: vehicle_information
  question: 'Every motor vehicle in Minnesota must be equipped with a muffler that
    prevents:'
  choices:
    A: Any visible exhaust
    B: Carbon dioxide emissions
    C: Sudden backfires only
    D: Loud or explosive noise and excessive smoke
  answer: D
  explanation: Minnesota law requires all motor vehicles to have a muffler in good
    working order to prevent loud or explosive noise and abnormal or excessive smoke.
- id: 175
  category: vehicle_information
  question: 'In Minnesota, the white light that illuminates your rear license plate
    must make the plate visible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 200 feet
  answer: B
  explanation: The rear license plate must be illuminated by a white light so that
    it is clearly legible from a distance of 50 feet to the rear.
- id: 176
  category: vehicle_information
  question: 'Minnesota law requires that every motor vehicle be equipped with a horn
    that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: A vehicle's horn must be audible under normal conditions from a distance
    of at least 200 feet.
- id: 177
  category: vehicle_information
  question: Under Minnesota law, which of the following is true regarding windshields?
  choices:
    A: Posters or stickers are allowed anywhere on the windshield
    B: Cracks that obstruct the driver's vision are prohibited
    C: Windshield wipers are optional if you use rain-repellent spray
    D: The windshield may be completely tinted to block UV rays
  answer: B
  explanation: Minnesota law prohibits driving a vehicle with a windshield that is
    cracked or discolored in a way that obstructs the driver's clear view.
- id: 178
  category: vehicle_information
  question: All passenger vehicles in Minnesota must be equipped with which two types
    of functional brake systems?
  choices:
    A: Front brakes and rear brakes
    B: Foot brake and parking/emergency brake
    C: Manual brake and automatic brake
    D: Hydraulic brake and air brake
  answer: B
  explanation: 'Minnesota law requires all motor vehicles to be equipped with two
    separate brake systems: a foot brake and a parking/emergency brake.'
- id: 179
  category: vehicle_information
  question: In Minnesota, what color are the lights required on the front of a vehicle
    to indicate turn signals?
  choices:
    A: White or amber
    B: Red or amber
    C: Blue or white
    D: Green or amber
  answer: A
  explanation: Front turn signals in Minnesota must be white or amber, while rear
    turn signals must be red or amber.
- id: 180
  category: vehicle_information
  question: 'According to Minnesota law, if a vehicle is equipped with airbags, it
    is illegal to:'
  choices:
    A: Drive without a passenger in the front seat
    B: Install a steering wheel cover
    C: Remove or disable the airbag system
    D: Drive with the airbag light on
  answer: C
  explanation: It is illegal in Minnesota to intentionally disable or remove an airbag
    that was installed as original equipment in a vehicle.
- id: 181
  category: vehicle_information
  question: In Minnesota, which vehicles are required to be equipped with fenders
    or other wheel guards (mud flaps) to prevent spray or splash to the rear?
  choices:
    A: Only motorcycles
    B: Only passenger cars
    C: Trucks, tractors, and trailers
    D: All vehicles, including bicycles
  answer: C
  explanation: Minnesota law requires trucks, truck-tractors, and trailers to have
    fenders or other devices (mud flaps) to prevent the wheels from throwing water,
    dirt, or other materials onto the windshields of following vehicles.
- id: 182
  category: vehicle_information
  question: Which of the following equipment is prohibited for use on a private passenger
    vehicle in Minnesota?
  choices:
    A: Fog lights
    B: Red lights visible from the front
    C: Electronic stability control
    D: Adjustable side mirrors
  answer: B
  explanation: Except for authorized emergency vehicles, no vehicle in Minnesota may
    be equipped with a lamp that displays a red light toward the front.
- id: 183
  category: vehicle_information
  question: In Minnesota, what is the requirement for the visibility of your vehicle's
    license plates?
  choices:
    A: Only the rear plate must be visible
    B: Plates must be kept clean and free from grease, dust, or other blurring material
    C: Plates may be covered with a tinted plastic cover as long as they are readable
    D: Plates only need to be visible during daylight hours
  answer: B
  explanation: Minnesota law requires that license plates be kept clean and legible
    at all times. It is illegal to cover them with any material, including clear or
    tinted plastic covers, that obstructs their visibility.
- id: 184
  category: vehicle_information
  question: Which of the following is true regarding license plate requirements for
    passenger vehicles registered in Minnesota?
  choices:
    A: Only a rear plate is required
    B: Only a front plate is required
    C: Both front and rear plates must be displayed
    D: Plates are only required on the rear if the vehicle is over 10 years old
  answer: C
  explanation: 'Minnesota law requires most vehicles, including standard passenger
    cars, to display two license plates: one on the front and one on the rear.'
- id: 185
  category: vehicle_information
  question: According to Minnesota law, where are you permitted to place stickers
    on your windshield?
  choices:
    A: Anywhere, as long as they are smaller than 3 inches
    B: Only in the lower corners of the windshield
    C: Only behind the rearview mirror
    D: Stickers are never allowed on the windshield
  answer: B
  explanation: Minnesota law prohibits objects or stickers on the windshield that
    obstruct the driver's view, except for state-required labels or stickers placed
    in the lower corners.
- id: 186
  category: vehicle_information
  question: In Minnesota, a vehicle's foot brake must be able to stop the car on dry
    pavement within how many feet when traveling at 20 mph?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: C
  explanation: The Minnesota Driver's Manual states that the foot brake must be capable
    of stopping a vehicle traveling 20 mph within 40 feet.
- id: 187
  category: vehicle_information
  question: 'Minnesota law requires all motor vehicles to be equipped with mufflers
    to prevent:'
  choices:
    A: Engine overheating
    B: Excessive carbon dioxide emissions
    C: Loud or explosive noise and excessive smoke
    D: Fuel evaporation
  answer: C
  explanation: Mufflers are required on all motor vehicles in Minnesota to prevent
    loud or explosive noise and to prevent excessive smoke or carbon monoxide from
    entering the vehicle.
- id: 188
  category: vehicle_information
  question: In Minnesota, if your vehicle's turn signals are not working, you must
    use hand signals. Which hand signal indicates a right turn?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: B
  explanation: To signal a right turn using hand signals in Minnesota, the driver
    extends the left arm out the window and points it upward.
- id: 189
  category: vehicle_information
  question: 'Minnesota law requires that your vehicle be equipped with a defroster
    to keep the windshield clear of:'
  choices:
    A: Rain and sleet
    B: Dirt and debris
    C: Steam, frost, and ice
    D: Bugs and insects
  answer: C
  explanation: All motor vehicles in Minnesota must be equipped with a defroster in
    good working order to keep the windshield free of steam, frost, and ice.
- id: 190
  category: vehicle_information
  question: 'According to the Minnesota Driver''s Manual, dirty headlights can reduce
    light output by as much as:'
  choices:
    A: 25%
    B: 50%
    C: 75%
    D: 90%
  answer: C
  explanation: The manual notes that dirty headlights can reduce light output by up
    to 75%, significantly decreasing visibility during night driving.
- id: 191
  category: vehicle_information
  question: 'In Minnesota, passenger vehicles must be equipped with fenders or other
    devices to prevent:'
  choices:
    A: Aerodynamic drag
    B: Water, dirt, or other material from being thrown into the air
    C: Side-impact collisions
    D: Unauthorized towing
  answer: B
  explanation: Minnesota law requires vehicles to have fenders or similar devices
    (like mud flaps) to prevent the wheels from throwing water, dirt, or other materials
    onto other vehicles or pedestrians.
- id: 192
  category: signs_and_signals
  question: In Minnesota, a 'Slow Moving Vehicle' emblem must be displayed on all
    vehicles that travel at speeds of ____ or less.
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: D
  explanation: According to the Minnesota Drivers Manual, the slow-moving vehicle
    emblem (an orange-red triangle) must be displayed on all vehicles that travel
    at speeds of 30 mph or less, such as farm implements or horse-drawn vehicles.
- id: 193
  category: signs_and_signals
  question: The 'No Passing Zone' sign in Minnesota is unique because of its shape
    and placement. What is its description?
  choices:
    A: A rectangular sign on the right side of the road
    B: A pennant-shaped sign on the left side of the road
    C: A diamond-shaped sign on the right side of the road
    D: A circular sign on the left side of the road
  answer: B
  explanation: In Minnesota, the 'No Passing Zone' sign is pennant-shaped and is placed
    on the left side of the road to face the driver, marking the beginning of a no-passing
    zone.
- id: 194
  category: signs_and_signals
  question: When you encounter a flashing yellow arrow at a Minnesota intersection,
    what does it indicate?
  choices:
    A: You have the right of way to turn left
    B: You must stop and wait for a green arrow
    C: You may turn left after yielding to oncoming traffic and pedestrians
    D: The intersection is malfunctioning; treat it as a four-way stop
  answer: C
  explanation: A flashing yellow arrow means you can turn in the direction of the
    arrow after yielding to oncoming traffic and pedestrians. Oncoming traffic has
    a green light.
- id: 195
  category: signs_and_signals
  question: In Minnesota, when a school bus is preparing to stop to load or unload
    children, it will activate its flashing yellow lights. What should you do?
  choices:
    A: Speed up to pass the bus before the red lights come on
    B: Stop immediately, even if the lights are only yellow
    C: Prepare to stop and reduce your speed
    D: Honk your horn to warn the bus driver you are passing
  answer: C
  explanation: Flashing yellow lights on a school bus indicate that the bus is preparing
    to stop. Drivers should reduce speed and prepare to stop when the lights turn
    red and the stop arm is extended.
- id: 196
  category: signs_and_signals
  question: What does a solid white line between lanes of traffic moving in the same
    direction indicate in Minnesota?
  choices:
    A: Lane changes are prohibited
    B: Lane changes are discouraged
    C: You are in a one-way street
    D: The lane is for emergency vehicles only
  answer: B
  explanation: In Minnesota, a solid white line indicates that lane changes are discouraged
    in areas where this type of marking is present, though not strictly illegal unless
    other signs prohibit it.
- id: 197
  category: signs_and_signals
  question: If your vehicle's turn signals are not working, what is the correct hand
    signal for a right turn in Minnesota?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at the elbow.
- id: 198
  category: signs_and_signals
  question: What does a 'Crossbuck' sign at a railroad crossing signify in Minnesota?
  choices:
    A: It is a stop sign; you must always stop
    B: It is the same as a yield sign; you must yield to any approaching trains
    C: It indicates the number of tracks at the crossing
    D: It means the crossing is no longer in use
  answer: B
  explanation: A crossbuck sign is treated as a yield sign. Drivers must yield to
    any approaching trains and are not required to stop unless a train is present
    or other signals indicate a stop.
- id: 199
  category: signs_and_signals
  question: In Minnesota, what does a white diamond symbol painted on the pavement
    indicate?
  choices:
    A: A pedestrian crossing ahead
    B: A railroad crossing ahead
    C: The lane is reserved for specific vehicles (HOV, bus, or bicycle)
    D: A high-accident area
  answer: C
  explanation: The diamond symbol indicates a restricted lane, such as High Occupancy
    Vehicle (HOV) lanes, bus lanes, or bicycle lanes.
- id: 200
  category: signs_and_signals
  question: When entering a multi-lane roundabout in Minnesota, which of the following
    is a correct rule regarding signals and yielding?
  choices:
    A: Yield to traffic already in the roundabout and signal your intent to exit
    B: Traffic in the roundabout must yield to those entering
    C: You do not need to signal when exiting a roundabout
    D: Always enter the roundabout in the left lane regardless of your exit
  answer: A
  explanation: Drivers entering a roundabout must yield to traffic already inside.
    Minnesota law also requires drivers to use their right turn signal when exiting
    a roundabout to inform other drivers of their intent.
- id: 201
  category: signs_and_signals
  question: In Minnesota, when are you allowed to turn right on a red light?
  choices:
    A: Never, you must wait for a green light
    B: Only if there is a sign specifically allowing it
    C: After coming to a complete stop and yielding to traffic and pedestrians, unless
      a 'No Turn on Red' sign is posted
    D: Only between the hours of 9:00 PM and 6:00 AM
  answer: C
  explanation: Minnesota law allows drivers to turn right on a red light after making
    a complete stop and yielding to all other traffic and pedestrians, provided no
    sign prohibits the turn.
- id: 202
  category: signs_and_signals
  question: 'A steady yellow light at an intersection in Minnesota means:'
  choices:
    A: Speed up to clear the intersection before it turns red
    B: The signal is about to turn red; you should stop if it is safe to do so
    C: You have the right of way to complete your turn
    D: Stop immediately, even if you are in the middle of the intersection
  answer: B
  explanation: A steady yellow light means the signal is changing from green to red.
    You should stop if you can do so safely. If you are already in the intersection,
    you should continue through it.
- id: 203
  category: signs_and_signals
  question: Which sign shape is exclusively used for 'Yield' signs in Minnesota?
  choices:
    A: Diamond
    B: Octagon
    C: Equilateral triangle with the point down
    D: Pentagon
  answer: C
  explanation: The yield sign is a downward-pointing equilateral triangle, usually
    red and white.
- id: 204
  category: signs_and_signals
  question: In Minnesota, what color are signs used to provide information about construction
    and maintenance zones?
  choices:
    A: Yellow
    B: Orange
    C: Green
    D: Blue
  answer: B
  explanation: Orange is the standard color for construction and maintenance signs
    in Minnesota to alert drivers to workers and equipment ahead.
- id: 205
  category: signs_and_signals
  question: What do double solid yellow lines in the center of a Minnesota roadway
    indicate?
  choices:
    A: Passing is allowed from either direction
    B: Passing is allowed only in the direction of travel
    C: Passing is prohibited in both directions
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines mean that passing is prohibited for vehicles
    traveling in either direction.
- id: 206
  category: signs_and_signals
  question: What does a flashing yellow light at an intersection mean in Minnesota?
  choices:
    A: Stop and wait for the light to turn green.
    B: The same as a stop sign.
    C: Proceed with caution, yielding to pedestrians and vehicles already in the intersection.
    D: Speed up to clear the intersection before it turns red.
  answer: C
  explanation: A flashing yellow light warns drivers to proceed with caution. You
    do not need to stop, but you must yield to vehicles and pedestrians already in
    the intersection.
- id: 207
  category: signs_and_signals
  question: What is the meaning of a flashing yellow arrow signal in Minnesota?
  choices:
    A: You have the right-of-way to turn.
    B: You must stop and wait for a green arrow.
    C: Turns are allowed, but you must first yield to oncoming traffic and pedestrians.
    D: The signal is about to turn red.
  answer: C
  explanation: A flashing yellow arrow means you may turn in the direction of the
    arrow after yielding to oncoming traffic and pedestrians.
- id: 208
  category: signs_and_signals
  question: When you see a 'Zipper Merge' sign in Minnesota, how should you behave
    as you approach the lane closure?
  choices:
    A: Merge into the through lane as early as possible.
    B: Stay in your current lane until the point of merge, then take turns with other
      drivers.
    C: Stop and wait for someone to wave you in.
    D: Speed up to get ahead of the line before the lane ends.
  answer: B
  explanation: MnDOT encourages the 'Zipper Merge' during congestion, where drivers
    use both lanes until the merge point and then take turns, which reduces backups.
- id: 209
  category: signs_and_signals
  question: In Minnesota, what does a steady red arrow signal mean?
  choices:
    A: You may turn after coming to a complete stop.
    B: You must stop and remain stopped until the signal changes to a green arrow
      or green light.
    C: You may turn if no traffic is coming from the opposite direction.
    D: The arrow is only a warning for pedestrians.
  answer: B
  explanation: A steady red arrow means you must stop and cannot make the turn until
    the signal turns green.
- id: 210
  category: signs_and_signals
  question: What color are Minnesota signs that provide information about public recreation
    and cultural interest sites?
  choices:
    A: Blue
    B: Green
    C: Brown
    D: Yellow
  answer: C
  explanation: Brown signs are used to point out historic sites, parks, and other
    points of cultural or recreational interest.
- id: 211
  category: signs_and_signals
  question: 'A center lane between lanes of traffic moving in opposite directions
    that is marked by solid and dashed yellow lines is reserved for:'
  choices:
    A: Passing slower vehicles.
    B: Emergency vehicles only.
    C: Left turns only.
    D: U-turns only.
  answer: C
  explanation: This is a center turn lane, used exclusively for vehicles making left
    turns from either direction.
- id: 212
  category: signs_and_signals
  question: What is the shape of a standard 'Yield' sign in Minnesota?
  choices:
    A: Diamond
    B: Pentagon
    C: Downward-pointing triangle
    D: Circle
  answer: C
  explanation: A yield sign is an equilateral triangle with the point facing downward.
- id: 213
  category: signs_and_signals
  question: When approaching a school bus with its red lights flashing and stop arm
    extended, Minnesota law requires you to stop at least ____ feet from the bus.
  choices:
    A: 10 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: B
  explanation: Minnesota law requires drivers to stop at least 20 feet away from a
    school bus when it is displaying flashing red lights and an extended stop arm.
- id: 214
  category: signs_and_signals
  question: What color are 'Service Signs' in Minnesota that direct you to gas, food,
    and lodging?
  choices:
    A: Green
    B: Blue
    C: Brown
    D: White
  answer: B
  explanation: Blue signs are used to provide information about motorist services
    like gas, food, lodging, and hospitals.
- id: 215
  category: signs_and_signals
  question: 'A ''Bypass Lane'' on a Minnesota highway allows you to:'
  choices:
    A: Pass a vehicle on the left at high speeds.
    B: Go around a vehicle that is waiting to make a left turn.
    C: Exit the highway without slowing down.
    D: Drive on the shoulder during rush hour.
  answer: B
  explanation: In Minnesota, some two-lane highways have bypass lanes on the right
    to allow through-traffic to go around vehicles waiting to turn left.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 216
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 217
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 218
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 219
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 220
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 221
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 222
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 223
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 224
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 225
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 226
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 227
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 228
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 229
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 230
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
