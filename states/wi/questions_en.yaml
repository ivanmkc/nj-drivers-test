metadata:
  source: //wisconsindot.gov/Documents/dmv/shared/bds126-motorists-handbook.pdf:2025
    Wisconsin Motorists Handbook (wisconsindot.gov)
  total_questions: 193
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
  - vehicle_operation
questions:
- id: 1
  category: driver_responsibility
  question: 'According to the Wisconsin Motorists'' Handbook, driving is considered:'
  choices:
    A: A constitutional right
    B: A privilege and a very important responsibility
    C: A requirement for all citizens over 18
    D: An optional hobby
  answer: B
  explanation: The handbook states, "It's also crucial to remember that driving is
    a privilege and a very important responsibility."
- id: 2
  category: safe_driving_rules
  question: Which of the following is listed in the handbook as a safe behavior to
    help take control of your drive?
  choices:
    A: Driving slightly above the speed limit to keep up with traffic
    B: Sharing the road with pedestrians and bicyclists
    C: Relying solely on your passengers to watch for motorcycles
    D: Multitasking while operating the vehicle
  answer: B
  explanation: The handbook lists "Share the road with pedestrians and bicyclists"
    as one of the safe behaviors to develop behind the wheel.
- id: 3
  category: driver_responsibility
  question: Which organization is specifically mentioned as being responsible for
    educating the public about rules of the road and enforcing Wisconsin traffic laws?
  choices:
    A: Wisconsin Department of Motor Vehicles (DMV)
    B: Wisconsin State Patrol
    C: National Highway Traffic Safety Administration
    D: Wisconsin Department of Transportation
  answer: B
  explanation: The manual states, "Wisconsin State Patrol educates the public about
    rules of the road and enforces Wisconsin traffic laws."
- id: 4
  category: license_system
  question: What is the primary role of the DMV as described in the introductory section
    of the handbook?
  choices:
    A: To enforce Wisconsin traffic laws on the highway
    B: To engineer Wisconsin's roads through a Safe System approach
    C: To ensure drivers are trained and qualified to operate a vehicle
    D: To operate the National Human Trafficking Hotline
  answer: C
  explanation: The text notes that "DMV ensures drivers are trained and qualified
    to operate a vehicle, including through helpful resources like this Motorists'
    Handbook."
- id: 5
  category: defensive_driving
  question: What is the goal of Wisconsin's Safe System approach to highway safety?
  choices:
    A: To ensure all drivers pass the knowledge test on their first try
    B: To design and operate the transportation system so driver mistakes do not become
      deadly
    C: To eliminate all traffic stops by the Wisconsin State Patrol
    D: To replace all traditional intersections with roundabouts
  answer: B
  explanation: The manual explains that the Safe System approach "aims to design and
    operate Wisconsin's transportation system so driver mistakes do not become deadly."
- id: 6
  category: driver_testing
  question: Where can you find the Online Class D Driver License Practice Test?
  choices:
    A: KnowToDrive.com/Wisconsin
    B: wisconsindmv.gov
    C: love146.org/online-safety
    D: tatnonprofit.org/youth
  answer: B
  explanation: The handbook states that the Online Class D Driver License Practice
    Test "can be found on our DMV website wisconsindmv.gov."
- id: 7
  category: driver_responsibility
  question: In how many counties in Wisconsin have cases of human trafficking been
    reported?
  choices:
    A: 10 counties
    B: 25 counties
    C: 50 counties
    D: All 72 counties
  answer: D
  explanation: The human trafficking section explicitly states, "Cases of human trafficking
    have been reported in all 72 counties in Wisconsin."
- id: 8
  category: driver_responsibility
  question: According to the human trafficking information in the handbook, anyone
    under what age who exchanges sex acts for money or other things of value is considered
    a victim?
  choices:
    A: Under age 16
    B: Under age 18
    C: Under age 21
    D: Under age 25
  answer: B
  explanation: The text states, "Anyone under age 18 that exchanges sex acts for money
    or other things of value is considered a victim of human trafficking."
- id: 9
  category: driver_responsibility
  question: What word can you text to BeFree (233733) to contact the National Human
    Trafficking Hotline?
  choices:
    A: SAFE
    B: HELP
    C: STOP
    D: ALERT
  answer: B
  explanation: The manual provides the contact information for the National Human
    Trafficking Hotline as "1-888-3737-888 or text HELP to BeFree (233733)."
- id: 10
  category: driver_responsibility
  question: How do human traffickers often meet their victims according to the handbook?
  choices:
    A: Through driver's education courses
    B: At DMV service centers
    C: Online while pretending to be someone else
    D: Through the Driver Education Grant Program
  answer: C
  explanation: The "Stay safe" section warns that "Traffickers often meet their victims
    online while they are pretending to be someone else."
- id: 11
  category: driver_testing
  question: According to Section 1 of the handbook's Table of Contents, which of the
    following is a requirement for the driving test?
  choices:
    A: A medical physical exam
    B: A Highway Signs Test
    C: An emissions test
    D: A background check
  answer: B
  explanation: Section 1 (Driving Test Requirements) lists Vision Screening, Highway
    Signs Test, Knowledge Test, and Skills Test.
- id: 12
  category: license_system
  question: Based on the Progression of Licenses outlined in Section 2, which license
    comes immediately after an Instruction Permit?
  choices:
    A: Occupational License
    B: Regular Driver License
    C: Probationary License
    D: Commercial Driver License
  answer: C
  explanation: Section 2 (Progression of Licenses) lists the order as Sponsorship,
    Instruction Permit, Probationary License, then Regular Driver License.
- id: 13
  category: safe_driving_rules
  question: Which of the following topics is classified under "Dangerous Driving Behaviors"
    in Section 9 of the handbook?
  choices:
    A: Backing up
    B: Drowsy Driving
    C: Farm Safety
    D: Winter Driving
  answer: B
  explanation: Section 9 (Dangerous Driving Behaviors) includes Alcohol, Drugs and
    Driving; Distracted Driving; and Drowsy Driving.
- id: 14
  category: sharing_the_road
  question: Section 10 of the handbook covers "Sharing the Road." Which of the following
    is a topic included in this section?
  choices:
    A: No-Zones
    B: Metered Ramps
    C: Diverging Diamond Interchanges
    D: Roundabouts
  answer: A
  explanation: Section 10 (Sharing the Road) lists Pedestrians, Emergency Vehicles,
    School Buses, Motorcycles, Bicycles, and No-Zones.
- id: 15
  category: penalties_and_points
  question: According to Section 11 of the Table of Contents, what system does Wisconsin
    use to track your driving privilege?
  choices:
    A: The Demerit System
    B: The Point System
    C: The Strike System
    D: The Citation System
  answer: B
  explanation: Section 11 (Your Driving Privilege) lists the "Point System" as its
    first topic.
- id: 16
  category: driver_testing
  question: What is the minimum visual acuity required in at least one eye to pass
    the vision screening for a regular car license?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the manual, Wisconsin requires regular car applicants
    to have a visual acuity of at least 20/40 in one eye (corrected or uncorrected).
- id: 17
  category: driver_testing
  question: What is the required field of vision from the center of each eye to pass
    the vision screening?
  choices:
    A: 50 degrees
    B: 70 degrees
    C: 90 degrees
    D: 120 degrees
  answer: B
  explanation: The manual states that applicants must have a 70-degree field of vision
    from the center of each eye.
- id: 18
  category: driver_testing
  question: How many questions must you answer correctly to pass the Highway Signs
    Test?
  choices:
    A: 10 out of 15
    B: 12 out of 15
    C: 15 out of 20
    D: 40 out of 50
  answer: B
  explanation: There are 15 questions on the Highway Signs Test, and you need to answer
    12 questions (80%) correctly to pass.
- id: 19
  category: driver_testing
  question: What is the fee for taking the knowledge test in person at a DMV customer
    service center?
  choices:
    A: $10
    B: $15
    C: $25
    D: It is free
  answer: D
  explanation: The manual states that tests in a DMV customer service center are free.
- id: 20
  category: driver_testing
  question: If an applicant is between ages 15 and 17, how much does it cost to take
    the knowledge test online?
  choices:
    A: It is free
    B: $10
    C: $15
    D: $20
  answer: B
  explanation: Applicants between ages 15 and 17 may take the knowledge test online
    for a fee of $10.
- id: 21
  category: driver_testing
  question: Which of the following is NOT listed as a vehicle part the DMV examiner
    will check before your skills test?
  choices:
    A: Horn
    B: Engine oil level
    C: License plates
    D: Mirrors
  answer: B
  explanation: Before the test, the examiner checks the horn, lights/signals, license
    plates, doors, mirrors, and more. Engine oil level is not listed.
- id: 22
  category: license_system
  question: How many documents proving you live in Wisconsin must you bring when applying
    for a license?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: To apply for a license, you must bring two documents that prove you
    live in Wisconsin, such as a utility bill or financial statement.
- id: 23
  category: driver_responsibility
  question: What does it mean when an adult signs as a sponsor for a driver under
    age 18?
  choices:
    A: They must ride in the vehicle at all times.
    B: They pay for the driver's education course.
    C: They accept legal and financial liability for incidents caused by the minor.
    D: They guarantee the minor will pass the skills test.
  answer: C
  explanation: The sponsor accepts liability, meaning they are legally and financially
    responsible for incidents caused by the minor driving.
- id: 24
  category: license_system
  question: Under which condition must a minor file proof of insurance instead of
    having a sponsor?
  choices:
    A: They are 16 years old and live with their parents.
    B: They are married and their spouse is under 18 years of age.
    C: They have completed 50 hours of supervised driving.
    D: They are taking the knowledge test online.
  answer: B
  explanation: You must file proof of insurance instead of having a sponsor if you
    are married and your spouse is under 18 years of age, among other specific criteria.
- id: 25
  category: license_system
  question: How old must you be to apply for an instruction permit if you are enrolled
    in a driver education program?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: B
  explanation: If under 18, you must be at least 15 years old and enrolled in a driver
    education program to apply for an instruction permit.
- id: 26
  category: safe_driving_rules
  question: If you hold an instruction permit and are driving during hours of darkness,
    who must accompany you in the passenger seat?
  choices:
    A: Any licensed driver over 18
    B: A sibling who is at least 16 years old
    C: A qualified instructor or a licensed person 25 years of age with at least two
      years of licensed driving experience
    D: Any person with a valid probationary license
  answer: C
  explanation: If operating a vehicle during hours of darkness, you must be accompanied
    by a qualified instructor or a licensed person 25 years of age with at least two
    years of licensed driving experience occupying the seat beside you.
- id: 27
  category: safe_driving_rules
  question: The person accompanying an instruction permit holder in the passenger
    seat must have at least how many years of licensed driving experience?
  choices:
    A: One year
    B: Two years
    C: Three years
    D: Five years
  answer: B
  explanation: The class D instruction permit holder must drive with someone else
    in the car who has at least two years of licensed driving experience.
- id: 28
  category: license_system
  question: How long must a driver under 18 hold their instruction permit before they
    can get a probationary license?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: If under 18 years old, you need to have your instruction permit for
    at least six months and turn 16 years old to get a probationary license.
- id: 29
  category: driver_testing
  question: How many total hours of supervised driving practice must a minor complete
    before getting a probationary license?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: With a valid instruction permit, you must practice driving for at least
    40 hours during daylight and 10 hours during darkness, totaling 50 hours.
- id: 30
  category: safe_driving_rules
  question: While driving with a probationary license, when are you allowed to use
    a phone?
  choices:
    A: When stopped at a red light
    B: Only to report an emergency
    C: When using a hands-free device
    D: You are never allowed to use a phone under any circumstances
  answer: B
  explanation: 'The manual states for probationary licenses: "Remember that phones
    are not allowed while driving unless you need to report an emergency."'
- id: 31
  category: license_system
  question: How long are the Graduated Driver License (GDL) passenger and hour restrictions
    required for drivers under 18?
  choices:
    A: For the first 6 months
    B: For the first 9 months
    C: For the first 12 months
    D: Until the driver turns 21
  answer: B
  explanation: According to the manual, GDL restrictions are required for the first
    nine months, unless you turn 18 years old before then.
- id: 32
  category: license_system
  question: Under a Graduated Driver License (GDL), where are you allowed to drive
    alone between midnight and 5 a.m.?
  choices:
    A: Anywhere within your home city limits
    B: Only between home, school, and/or work
    C: Only to medical emergencies
    D: You are never allowed to drive alone during these hours
  answer: B
  explanation: The manual states that from 12 p.m. (midnight) to 5 a.m., you can drive
    alone only IF driving between home, school and/or work.
- id: 33
  category: penalties_and_points
  question: What will cause your Graduated Driver License (GDL) restrictions to be
    extended for six months?
  choices:
    A: Receiving a parking ticket
    B: Being convicted of a moving traffic violation
    C: Failing to renew your license 90 days early
    D: Driving with an immediate family member
  answer: B
  explanation: The graduated driver license restrictions will be extended six months
    if you are convicted of a moving traffic violation, violate any restrictions,
    or your license is suspended/revoked.
- id: 34
  category: license_system
  question: How often does a regular Wisconsin driver's license need to be renewed?
  choices:
    A: Every 4 years
    B: Every 5 years
    C: Every 8 years
    D: Every 10 years
  answer: C
  explanation: The manual states that renewing your driver's license needs to be done
    every eight years.
- id: 35
  category: license_system
  question: If you move to Wisconsin with a regular driver's license from another
    state, within how many days should you apply for a Wisconsin license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: For a regular out of state driver license, you should apply for a Wisconsin
    driver license within 60 days after moving.
- id: 36
  category: license_system
  question: How is a REAL ID-compliant driver's license marked in Wisconsin?
  choices:
    A: With a gold circle
    B: With a star
    C: With a bald eagle
    D: With a barcode on the front
  answer: B
  explanation: The manual notes that the Wisconsin DMV issues REAL-ID that meets Homeland
    Security requirements, which is marked with a star.
- id: 37
  category: safe_driving_rules
  question: If two drivers arrive at a four-way stop at the exact same time, who has
    the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver going straight
    D: The driver turning right
  answer: B
  explanation: According to the right-of-way rules, if one or more driver arrives
    to the stop at the same time, the driver on the right goes first.
- id: 38
  category: sharing_the_road
  question: When encountering a pedestrian using a guide dog or carrying a white cane,
    what must you do?
  choices:
    A: Honk your horn to let them know you are there
    B: Stop at least ten feet away until they are off the roadway
    C: Yield only if they are in a marked crosswalk
    D: Drive around them slowly
  answer: B
  explanation: You must yield right-of-way to pedestrians using a guide dog or carrying
    a white cane by stopping at least ten feet away until the person is off the roadway.
- id: 39
  category: safe_driving_rules
  question: What rule should you use to determine a safe following distance under
    normal driving conditions?
  choices:
    A: The Two Second Rule
    B: The Three Second Rule
    C: The Four Second Following Distance Rule
    D: The One Car Length Rule
  answer: C
  explanation: The manual instructs drivers to drive at a speed where they can always
    safely stop by using the “Four Second Following Distance Rule.”
- id: 40
  category: safe_driving_rules
  question: What is the normal speed limit in a school zone when children are present
    in Wisconsin?
  choices:
    A: 15 miles per hour
    B: 20 miles per hour
    C: 25 miles per hour
    D: 35 miles per hour
  answer: A
  explanation: The manual specifies that the normal speed limit in a school zone when
    children are present is 15 miles per hour.
- id: 41
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in residential areas?
  choices:
    A: 15 miles per hour
    B: 25 miles per hour
    C: 30 miles per hour
    D: 35 miles per hour
  answer: B
  explanation: Unless otherwise posted, the speed limit in residential areas is 25
    miles per hour.
- id: 42
  category: defensive_driving
  question: When merging onto a high-speed roadway from an acceleration lane, what
    is your responsibility?
  choices:
    A: Stop at the end of the ramp and wait for a gap
    B: Force other drivers to change their speed so you can enter
    C: Find a safe gap in traffic to legally merge
    D: Drive on the shoulder until a gap opens up
  answer: C
  explanation: In the acceleration lane, you speed up as you merge. The manual states
    it is your responsibility to find a safe gap in traffic to legally merge.
- id: 43
  category: defensive_driving
  question: To maintain better control of your vehicle, how far ahead should you be
    able to see?
  choices:
    A: 3 to 5 seconds ahead
    B: 5 to 10 seconds ahead
    C: 10 to 15 seconds ahead
    D: 20 to 30 seconds ahead
  answer: C
  explanation: To have better control of your vehicle, the driver needs to be able
    to see 10 to 15 seconds ahead of their vehicle.
- id: 44
  category: safe_driving_rules
  question: What is the recommended searching pattern before going through an intersection?
  choices:
    A: Look right, then left
    B: Look straight ahead only
    C: Look left, right, and left again
    D: Look at your rearview mirror, then left
  answer: C
  explanation: The manual advises to be alert by searching left, right and left again
    before going through the intersection even if you have the right-of-way.
- id: 45
  category: safe_driving_rules
  question: Who must you yield the right-of-way to at an uncontrolled T-intersection?
  choices:
    A: The vehicle on the terminating street
    B: Cross traffic
    C: The vehicle turning left
    D: The vehicle that honks first
  answer: B
  explanation: According to the right-of-way rules in the manual, you should yield
    right-of-way to cross traffic in an uncontrolled T-intersection.
- id: 46
  category: safe_driving_rules
  question: What does it mean to 'coast' while driving, which the manual advises against?
  choices:
    A: Driving without using the accelerator
    B: Putting your car in the neutral position
    C: Driving with the parking brake partially engaged
    D: Turning off the engine while moving
  answer: B
  explanation: The manual states, 'Do not coast while driving, this means putting
    your car in the neutral position. Stay in "gear" so that you can have full control
    over your vehicle.'
- id: 47
  category: defensive_driving
  question: How often should you check your rearview mirror to see if someone is following
    you too closely?
  choices:
    A: Every 3 to 5 seconds
    B: Every 6 to 8 seconds
    C: Every 10 to 12 seconds
    D: Every 15 to 20 seconds
  answer: B
  explanation: The manual advises, 'Check your rearview mirror every 6 to 8 seconds
    to see if someone is following too closely (tailgating).'
- id: 48
  category: safe_driving_rules
  question: What should you do if another driver is tailgating you?
  choices:
    A: Tap your brakes quickly to warn them
    B: Speed up to increase the distance between your vehicles
    C: Slowly reduce your speed to encourage them to drive around you
    D: Change lanes immediately without signaling
  answer: C
  explanation: The manual states, 'If someone is tailgating you, slowly reduce your
    speed. This should encourage them to drive around you.'
- id: 49
  category: safe_driving_rules
  question: Why is it important to keep your steering wheel straight while waiting
    to make a left turn?
  choices:
    A: It prevents your power steering fluid from overheating
    B: It helps you accelerate faster when the path is clear
    C: It keeps you from being pushed into oncoming traffic if someone hits you from
      behind
    D: It signals to other drivers that you are yielding the right-of-way
  answer: C
  explanation: The manual explains, 'If you turn your wheel to the left and someone
    hits you from behind, you will be pushed into oncoming traffic. It is important
    to keep your steering wheel, vehicle wheels and vehicle straight.'
- id: 50
  category: safe_driving_rules
  question: Under what condition are you permitted to make a U-turn on a rural two-lane
    highway?
  choices:
    A: Only when there is a designated U-turn lane
    B: If it is done safely and you do not interfere with traffic
    C: Only during daylight hours
    D: U-turns are never permitted on rural two-lane highways
  answer: B
  explanation: The manual states, 'You can make a U-turn in any rural two-lane highway
    if it is done safely and you do not interfere with traffic.'
- id: 51
  category: safe_driving_rules
  question: When turning right off a four-lane roadway, which lane must you turn from?
  choices:
    A: The lane nearest the center line
    B: Any lane as long as you signal
    C: The lane nearest the right curb or edge of the roadway
    D: The lane with the least amount of traffic
  answer: C
  explanation: The manual specifies, 'To turn right off a four-lane roadway, you must
    turn from the lane nearest the right curb or edge of the roadway.'
- id: 52
  category: vehicle_operation
  question: What is the first step when performing a Y-Turn?
  choices:
    A: Signal left and check your blind spot
    B: Look behind you over your right shoulder and reverse
    C: Signal right, check for traffic, pull as far right as possible, and stop
    D: Pull forward and proceed in your lane of traffic
  answer: C
  explanation: 'The first step of a Y-Turn is: ''1. Signal right. Check for traffic
    to the right and in your mirrors. Pull as far right as possible. Stop.'''
- id: 53
  category: sharing_the_road
  question: When is it permissible to use a paved shoulder to pass another vehicle?
  choices:
    A: When the vehicle ahead is traveling below the speed limit
    B: Only if the vehicle ahead is stopped or making a left turn
    C: When you are driving on a multi-lane highway
    D: It is never permissible to pass on a paved shoulder
  answer: B
  explanation: The manual states, 'You can use a paved shoulder to go around someone
    only if they are stopped or making a left turn.'
- id: 54
  category: defensive_driving
  question: How do you know it is safe to return to the driving lane after passing
    another vehicle?
  choices:
    A: When you are one car length ahead of the passed vehicle
    B: When you see both headlights of the vehicle you just passed in your rearview
      mirror
    C: When the driver of the passed vehicle flashes their high beams
    D: Three seconds after you have moved past the vehicle
  answer: B
  explanation: The manual states, 'Once you see both headlights of the vehicle you
    just passed in your rearview mirror it is safe to return to the driving lane.'
- id: 55
  category: vehicle_operation
  question: What is the maximum speed you should travel when backing up?
  choices:
    A: 10 miles per hour
    B: 5 miles per hour
    C: No faster than a slow walk
    D: The posted speed limit of the road
  answer: C
  explanation: The manual advises, 'When backing up is necessary move slowly. Back
    up no faster than a slow walk.'
- id: 56
  category: safe_driving_rules
  question: What should you do if you miss your exit on a road?
  choices:
    A: Stop immediately and back up on the shoulder
    B: Make a U-turn at the next available median crossover
    C: Put your vehicle in reverse and back up in the far-right lane
    D: Go on to the next exit and re-enter the road to get back to the exit you missed
  answer: D
  explanation: The manual explicitly states, 'If you miss your exit or turn on a road,
    do not back up. Go on to the next exit and re-enter the road to get back to the
    exit you missed.'
- id: 57
  category: safe_driving_rules
  question: Where is parking strictly prohibited according to the provided manual
    text?
  choices:
    A: On any rural two-lane highway
    B: Where there are yellow markings on the curb or in front of fire hydrants
    C: On the far-right side of the road
    D: In residential areas with narrow streets
  answer: B
  explanation: The manual states, 'Parking is not allowed where there are yellow markings
    on the curb or areas in front of fire hydrants.'
- id: 58
  category: safe_driving_rules
  question: Are you allowed to exceed the speed limit when passing another vehicle?
  choices:
    A: Yes, but only by 5 mph
    B: Yes, if you are passing a large truck or bus
    C: No, you cannot go over the speed limit to pass another vehicle
    D: Yes, but only on a multi-lane highway
  answer: C
  explanation: The manual clearly states, 'You cannot go over the speed limit to pass
    another vehicle on the road.'
- id: 59
  category: safe_driving_rules
  question: Which way should you turn your steering wheel when parking uphill with
    a curb?
  choices:
    A: All the way to the right
    B: All the way to the left
    C: Keep the wheels straight
    D: Slightly to the right
  answer: B
  explanation: According to the manual, if you are parked uphill with a curb, you
    will turn your wheels all the way to the left before you put your car in park.
- id: 60
  category: safe_driving_rules
  question: When parking your vehicle downhill, in which direction should you turn
    your wheels?
  choices:
    A: All the way to the right
    B: All the way to the left
    C: Keep them straight
    D: Towards the center of the road
  answer: A
  explanation: The manual states that if you are parked downhill, you will move your
    wheels all the way to the right.
- id: 61
  category: safe_driving_rules
  question: When looking for a space to parallel park, how much longer than your vehicle
    should the space be?
  choices:
    A: 1-2 feet
    B: 3-6 feet
    C: 6-8 feet
    D: 8-10 feet
  answer: B
  explanation: The manual advises to find a parking space that is about 3-6 feet longer
    than your vehicle when preparing to parallel park.
- id: 62
  category: safe_driving_rules
  question: After successfully parallel parking, approximately how far should your
    vehicle be from the curb?
  choices:
    A: About 6 inches
    B: About a foot
    C: About 2 feet
    D: About 3 feet
  answer: B
  explanation: Once you straighten your wheels after parallel parking, you should
    be about a foot away from the curb and at least 2 feet away from the vehicles
    in front of and behind you.
- id: 63
  category: safe_driving_rules
  question: You must use your low beam headlights when you cannot see a vehicle or
    person from what distance?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: You must use your low beams/headlights when you cannot see a vehicle
    or person that is 500 feet (about one block) away.
- id: 64
  category: safe_driving_rules
  question: During what time period are you legally required to use your low beam
    headlights?
  choices:
    A: From sunset to sunrise
    B: A half hour past sunset to a half hour before sunrise
    C: An hour past sunset to an hour before sunrise
    D: Only when it is completely dark
  answer: B
  explanation: The manual states you must use your low beams/headlights when it is
    a half hour past sunset to a half hour before sunrise.
- id: 65
  category: defensive_driving
  question: What should you do if an oncoming driver forgets to turn off their high
    beams?
  choices:
    A: Flash your high beams rapidly
    B: Look toward the left side of the road
    C: Look toward the right side of the road
    D: Turn on your hazard lights
  answer: C
  explanation: If someone is driving toward you and forgets to turn off their brights,
    you should look toward the right side of the road.
- id: 66
  category: safe_driving_rules
  question: If you are turning at an intersection, when should you start signaling?
  choices:
    A: About three seconds (about 100 feet) before the turn
    B: About five seconds (about 200 feet) before the turn
    C: Right as you enter the intersection
    D: Only after you have stopped at the intersection
  answer: A
  explanation: If you are turning at an intersection, you should start signaling about
    three seconds (about 100 feet) before the turn.
- id: 67
  category: vehicle_information
  question: What is the correct hand signal to indicate a right turn?
  choices:
    A: Point your hand out the driver side window, straight
    B: Bend your elbow and point your hand up
    C: Point your hand to the ground
    D: Wave your hand in a circular motion
  answer: B
  explanation: If you would like to turn right using a hand signal, bend your elbow
    and point your hand up.
- id: 68
  category: signs_and_signals
  question: What color and shape are most warning signs?
  choices:
    A: Red and white octagons
    B: White and black rectangles
    C: Yellow with black lettering or symbols, mostly diamond shaped
    D: Green with white lettering, mostly square
  answer: C
  explanation: Warning signs are yellow with black lettering or symbols. Most are
    diamond shaped.
- id: 69
  category: signs_and_signals
  question: A triangle-shaped sign with reflective orange markings indicates a slow-moving
    vehicle. What is the maximum speed this vehicle is likely traveling?
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: A Slow Moving Vehicle sign is a triangle shaped sign with reflective
    orange markings. This vehicle could travel at 25 mph or less.
- id: 70
  category: signs_and_signals
  question: What does a No Passing Zone sign look like?
  choices:
    A: A yellow pennant with black lettering
    B: A red octagon with white lettering
    C: A downward pointing red and white triangle
    D: A white rectangle with black lettering
  answer: A
  explanation: A No Passing Zone sign is a yellow pennant with black lettering. You
    are not allowed to pass any vehicle in the no passing zone.
- id: 71
  category: signs_and_signals
  question: If a police officer or school crossing guard gives you directions that
    differ from a traffic light or sign, what should you do?
  choices:
    A: Follow the traffic light or sign
    B: Follow the directions of the police officer or crossing guard
    C: Stop and wait for the light to turn green
    D: Honk your horn to alert them of the sign
  answer: B
  explanation: You must follow the directions of police, school crossing guards and
    other workers even if they are different from the traffic light or sign on the
    road.
- id: 72
  category: defensive_driving
  question: When is it appropriate to push hard on your vehicle's horn?
  choices:
    A: To say hello to a friend
    B: To signal a driver who is driving too slowly
    C: To warn someone if you are going to hit them or they are going to hit you
    D: To let pedestrians know you are approaching a crosswalk
  answer: C
  explanation: You can push hard on your horn to warn someone if you are going to
    hit them or they are going to hit you.
- id: 73
  category: vehicle_information
  question: When should you use your vehicle's parking lights?
  choices:
    A: Whenever you are driving in heavy fog
    B: Only when you are parked and idling
    C: When driving between sunset and sunrise
    D: When parallel parking on a busy street
  answer: B
  explanation: According to the manual, parking lights should only be used when you
    are parked and idling.
- id: 74
  category: penalties_and_points
  question: What happens to traffic fines in construction work areas?
  choices:
    A: They are reduced by half
    B: They remain the same
    C: They double
    D: They triple
  answer: C
  explanation: Traffic fines double in construction work areas as a penalty to encourage
    drivers to slow down and protect workers.
- id: 75
  category: safe_driving_rules
  question: When are you allowed to use your cellphone in a construction zone?
  choices:
    A: When using a hands-free device
    B: Only if you are reporting an emergency
    C: When traffic is completely stopped
    D: You are never allowed to use a cellphone
  answer: B
  explanation: According to the manual, you can only use your cellphone in a construction
    zone if you are reporting an emergency.
- id: 76
  category: signs_and_signals
  question: What color are destination signs that show directions to parks, historical
    areas, or museums?
  choices:
    A: Blue
    B: Orange
    C: Brown
    D: Yellow
  answer: C
  explanation: Brown destination signs show information about fun or beautiful places,
    such as parks, historical areas, or museums.
- id: 77
  category: signs_and_signals
  question: What is a primary purpose of mile marker signs on the highway?
  choices:
    A: To show the current speed limit
    B: To indicate upcoming rest stops
    C: To improve emergency response times to highway incidents
    D: To warn drivers of upcoming construction zones
  answer: C
  explanation: Mile markers help you locate where you are on the road, which improves
    emergency response times to highway incidents.
- id: 78
  category: signs_and_signals
  question: Which type of route sign looks like a shield with red on top and blue
    on the bottom?
  choices:
    A: County Road
    B: U.S. Route
    C: State Road
    D: Interstate Highway
  answer: D
  explanation: An Interstate Highway sign looks like a shield with red on top and
    blue on the bottom, and it has white lettering.
- id: 79
  category: safe_driving_rules
  question: What should you NOT do while crossing railroad tracks?
  choices:
    A: Look both ways
    B: Shift gears
    C: Keep a safe distance
    D: Yield to trains
  answer: B
  explanation: The manual explicitly states that you should not shift gears while
    crossing the railroad tracks.
- id: 80
  category: signs_and_signals
  question: What does an "Exempt" sign at a railroad crossing mean?
  choices:
    A: The tracks are no longer in use
    B: Certain vehicles are not required to stop before crossing
    C: The crossing has no flashing lights
    D: Trains must stop for vehicles
  answer: B
  explanation: An "Exempt" sign means certain vehicles are not required to stop before
    crossing the railroad tracks.
- id: 81
  category: defensive_driving
  question: If your vehicle gets stuck on the railroad tracks, how can you find a
    phone number to report the unsafe condition?
  choices:
    A: Look for a blue sign with white lettering at the crossing
    B: Look for a yellow warning sign
    C: Check the back of the crossbuck sign
    D: Call 911 only
  answer: A
  explanation: A blue sign with white lettering is located at every highway-railroad
    crossing. It shows a phone number to report unsafe conditions or emergencies.
- id: 82
  category: safe_driving_rules
  question: How should you proceed if a traffic light loses power or is not working
    right?
  choices:
    A: Yield to the vehicle on your right
    B: Proceed as if the signal were a yield sign
    C: Proceed as if the signal were a stop sign
    D: Wait for a police officer to arrive
  answer: C
  explanation: If a traffic light loses power or is not working right, you must proceed
    as if the signal were a stop sign.
- id: 83
  category: safe_driving_rules
  question: Under what condition may you turn left on a steady red light?
  choices:
    A: You may never turn left on a red light
    B: If you are turning from a one-way street onto another one-way street
    C: If there is no oncoming traffic
    D: If you are turning from a two-way street onto a one-way street
  answer: B
  explanation: You may turn left on red if you are turning from a one-way street on
    to a one-way street, provided you stop first and yield to traffic.
- id: 84
  category: safe_driving_rules
  question: What should you do if you are already in the intersection when the steady
    yellow light comes on?
  choices:
    A: Stop immediately in the intersection
    B: Back up out of the intersection
    C: Continue through the intersection
    D: Pull over to the side
  answer: C
  explanation: If you are in the intersection when the yellow light comes on, do not
    stop. You can continue through the intersection.
- id: 85
  category: signs_and_signals
  question: What does a flashing yellow traffic light mean?
  choices:
    A: Come to a full stop and wait for a green light
    B: The light is about to change to red
    C: Slow down, check for cross traffic and proceed with caution
    D: Yield to oncoming traffic and turn left
  answer: C
  explanation: A flashing yellow light means you should slow down, check for cross
    traffic, and proceed with caution.
- id: 86
  category: safe_driving_rules
  question: When turning left on a steady green light, what must you do?
  choices:
    A: Proceed immediately because you have the right-of-way
    B: Yield to oncoming traffic
    C: Wait for a green arrow
    D: Stop and wait for the light to turn yellow
  answer: B
  explanation: If you are turning left, a steady green light means you may turn, but
    only when it is safe to do so. Oncoming traffic has the right-of-way.
- id: 87
  category: signs_and_signals
  question: What does a steady green light mean when you are turning left at an intersection?
  choices:
    A: You have the right-of-way over oncoming traffic.
    B: You may turn, but only when it is safe to do so, yielding to oncoming traffic.
    C: You must wait for a green arrow before turning.
    D: You can turn without yielding to pedestrians.
  answer: B
  explanation: According to the manual, if you are turning left, a steady green light
    means you may turn, but only when it is safe to do so. Oncoming traffic has the
    right-of-way.
- id: 88
  category: safe_driving_rules
  question: When are you permitted to cross a solid white line that separates lanes
    of traffic going in the same direction?
  choices:
    A: Whenever you need to pass a slower vehicle.
    B: Only when there is a hazard or you are turning within the next block.
    C: When you are driving in a school zone.
    D: You are never allowed to cross a solid white line.
  answer: B
  explanation: The manual states that a solid white line between lanes means you cannot
    cross. You can only cross if there is a hazard or you are turning within the next
    block.
- id: 89
  category: safe_driving_rules
  question: Two solid yellow lines mean that no lane of travel can pass. What is an
    exception to this rule?
  choices:
    A: Passing a vehicle going less than half the speed limit, unless it is farm equipment.
    B: Passing a school bus with its flashing yellow lights on.
    C: Passing a farm tractor going less than half the speed limit.
    D: Passing when you are late for an emergency.
  answer: A
  explanation: An exception to the two solid yellow lines rule is that you can pass
    a vehicle going less than half the speed limit if it is safe, except if it is
    farm equipment.
- id: 90
  category: safe_driving_rules
  question: Where should your vehicle be positioned when stopping at a crosswalk?
  choices:
    A: Your front wheels should be on the solid white line.
    B: Your front wheels should stop just before the solid white line.
    C: You should stop halfway through the crosswalk.
    D: You should stop at least 10 feet before the crosswalk.
  answer: B
  explanation: The manual states that your front wheels should stop just before the
    solid white line, and you should not stop on the crosswalk.
- id: 91
  category: safe_driving_rules
  question: What is the shared center lane used for?
  choices:
    A: Passing slow-moving vehicles.
    B: Parking during emergencies.
    C: Vehicles turning left or making a U-turn.
    D: Exclusive use by buses and bicycles.
  answer: C
  explanation: The shared center lane is only for vehicles turning left or making
    a U-turn. Vehicles can use this lane going in either direction.
- id: 92
  category: signs_and_signals
  question: What does a yellow 'X' signal above a reversible lane indicate?
  choices:
    A: The lane is open for travel.
    B: The lane is closed to all traffic.
    C: The lane is only for left turns.
    D: The lane is changing, and you should move to a lane with a green arrow.
  answer: D
  explanation: A yellow 'X' in a reversible lane means the lane is changing, and you
    must move to a Green 'arrow' lane.
- id: 93
  category: safe_driving_rules
  question: When are you legally allowed to travel in a reserved lane (such as a bus
    or bike lane) if you are not operating that type of vehicle?
  choices:
    A: When traffic in the general-purpose lanes is heavily congested.
    B: If you need to turn across the reserved lane in the next half of a block.
    C: When driving between the hours of 6 a.m. and 9 a.m.
    D: You are never allowed to travel in a reserved lane under any circumstances.
  answer: B
  explanation: It is illegal to travel in a reserved lane unless operating that type
    of vehicle, but you can travel in this lane if you need to turn across the reserved
    lane in the next half of a block.
- id: 94
  category: safe_driving_rules
  question: Which type of vehicle is NOT allowed to drive in a flex lane?
  choices:
    A: Passenger cars.
    B: Motorcycles.
    C: Large trucks.
    D: Carpool vehicles.
  answer: C
  explanation: The manual explicitly states that 'No large trucks can drive in the
    flex lane.'
- id: 95
  category: safe_driving_rules
  question: In which direction does traffic move in a roundabout?
  choices:
    A: Clockwise.
    B: Counterclockwise.
    C: In a figure-eight pattern.
    D: Straight through without turning.
  answer: B
  explanation: According to the manual, roundabouts are a safer and more efficient
    traffic flow option where traffic moves counterclockwise.
- id: 96
  category: sharing_the_road
  question: When approaching a roundabout, which of the following must you yield to?
  choices:
    A: Traffic approaching from your right.
    B: Traffic on your left that is already in the roundabout.
    C: Vehicles attempting to enter the roundabout from the opposite side.
    D: Only emergency vehicles.
  answer: B
  explanation: As you reach the roundabout, you must yield to pedestrians, bicycles,
    semitrucks, and traffic on your left that is already in the roundabout.
- id: 97
  category: safe_driving_rules
  question: What should you do if an emergency vehicle with its sirens on enters the
    roundabout while you are already driving inside it?
  choices:
    A: Stop immediately inside the roundabout to let them pass.
    B: Speed up and exit the roundabout as quickly as possible.
    C: Safely exit at the next right, then pull over.
    D: Pull over to the left side of the center island.
  answer: C
  explanation: If you are already in the roundabout when an emergency vehicle enters,
    you should safely exit at the next right, then pull over. You must avoid stopping
    in the roundabout.
- id: 98
  category: safe_driving_rules
  question: Why must you pull completely up to the white stop line at a metered freeway
    entrance ramp?
  choices:
    A: To allow vehicles behind you to pass.
    B: So your tires will trigger the sensors in the pavement.
    C: To get a better view of the freeway traffic.
    D: To avoid getting a ticket for blocking the crosswalk.
  answer: B
  explanation: At a metered ramp, you should pull completely up to the white stop
    line so your tires will trigger the sensors in the pavement.
- id: 99
  category: signs_and_signals
  question: What does a steady green arrow indicate?
  choices:
    A: You can turn in the direction of the arrow, and there should be no oncoming
      or crossing traffic.
    B: You may turn, but you must yield to oncoming traffic first.
    C: The lane is changing, and you must merge into the next lane.
    D: You can only go straight through the intersection.
  answer: A
  explanation: A steady green arrow means you can turn in the direction of the arrow.
    There should be no oncoming or crossing traffic while the arrow is green.
- id: 100
  category: signs_and_signals
  question: What does a road marking with both a dashed and a solid yellow line mean?
  choices:
    A: Passing is permitted for traffic on both sides of the road.
    B: Passing is prohibited for traffic on both sides of the road.
    C: You may pass if you are on the dashed side of the line, but not if you are
      on the solid side.
    D: You may pass if you are on the solid side of the line, but not if you are on
      the dashed side.
  answer: C
  explanation: Dashed and solid yellow lines mean you may pass if you are on the dashed
    side of the line. If you are on the solid side of the line, you may not pass.
- id: 101
  category: sharing_the_road
  question: If you are legally turning across a reserved lane and there is a bicyclist
    in the lane, what should you do?
  choices:
    A: Speed up to pass the bicyclist before making your turn.
    B: Honk your horn to warn the bicyclist to move out of the way.
    C: Move behind the bicyclist and make your turn once it is safe to do so.
    D: Stop in the general-purpose lane and wait for the bicyclist to turn first.
  answer: C
  explanation: The manual states that if there is a bicyclist in the reserved lane,
    you should move behind them and make your turn once it is safe to do so.
- id: 102
  category: safe_driving_rules
  question: What should you do when approaching a metered freeway entrance ramp with
    a red signal?
  choices:
    A: Stop 10 feet behind the white line.
    B: Pull completely up to the white stop line.
    C: Proceed without stopping if the freeway is clear.
    D: Wait for the vehicle in the adjacent lane to go first.
  answer: B
  explanation: The manual states that you should pull completely up to the white stop
    line so your tires will trigger the sensors in the pavement.
- id: 103
  category: driver_responsibility
  question: If you are pulled over by law enforcement during a traffic stop, where
    should you place your hands?
  choices:
    A: In your lap.
    B: Out the window.
    C: On the top of the steering wheel in plain sight.
    D: In your pockets or inside your jacket.
  answer: C
  explanation: If stopped by law enforcement, you should put your hands on the top
    of the steering wheel in plain sight and not make any sudden movements.
- id: 104
  category: defensive_driving
  question: During what time of day are deer most active?
  choices:
    A: From sunrise to noon.
    B: During the hottest part of the afternoon.
    C: From sunset to sunrise.
    D: Only during heavy rain or fog.
  answer: C
  explanation: According to the manual, deer are the most active in the sunset to
    sunrise hours.
- id: 105
  category: driver_responsibility
  question: If you hit a deer with your vehicle, what are the rules regarding keeping
    the animal?
  choices:
    A: It is illegal for anyone to keep the deer.
    B: Only law enforcement or animal control can take the deer.
    C: You can keep it, or the next motorist can keep it if you do not want it.
    D: You must leave it on the side of the road.
  answer: C
  explanation: 'The manual states: ''If you hit a deer, you can keep it. If you do
    not want it, the next motorist can keep it.'' You must also call the police so
    they can issue a tag.'
- id: 106
  category: sharing_the_road
  question: What is required of vehicles driving in a funeral procession line?
  choices:
    A: They must have their hazard lights flashing at all times.
    B: They must have their headlights on.
    C: They must honk their horns when passing through intersections.
    D: They must drive at least 15 mph below the posted speed limit.
  answer: B
  explanation: The manual specifies that vehicles in a funeral procession line must
    have their headlights on, and other drivers must not cut into or interfere with
    the line.
- id: 107
  category: safe_driving_rules
  question: Which part of the roadway is likely to freeze before the rest of the road
    in severe weather?
  choices:
    A: Intersections.
    B: Bridges and overpasses.
    C: Tunnels.
    D: Gravel shoulders.
  answer: B
  explanation: It is important to remember that in severe weather, bridges and overpasses
    freeze before the rest of the roadway.
- id: 108
  category: defensive_driving
  question: What should you do if your vehicle begins hydroplaning?
  choices:
    A: Slam on the brakes immediately.
    B: Turn the steering wheel sharply to the right.
    C: Ease your foot off the gas pedal and keep the wheel straight.
    D: Accelerate to push through the standing water.
  answer: C
  explanation: If you find yourself sliding or hydroplaning, you should ease your
    foot off the gas pedal, keep the wheel straight, and not try to stop or turn until
    your tires grip the road again.
- id: 109
  category: defensive_driving
  question: How should you steer if your vehicle begins to skid and you lose control?
  choices:
    A: Turn the wheel in the opposite direction of the skid.
    B: Turn the wheel in the direction you want the vehicle to go.
    C: Keep the steering wheel perfectly straight.
    D: Rapidly turn the wheel back and forth.
  answer: B
  explanation: When skidding, you should stay off the brake, turn the wheel in the
    direction you want the vehicle to go, and turn it back the other way as soon as
    the car begins to straighten.
- id: 110
  category: sharing_the_road
  question: When driving in winter weather, how much room should you give snowplows
    when their lights are flashing?
  choices:
    A: At least 50 feet.
    B: At least 100 feet.
    C: At least 200 feet.
    D: At least 500 feet.
  answer: C
  explanation: The manual advises to give snowplows at least 200 feet of room when
    their lights are flashing red, amber or green.
- id: 111
  category: sharing_the_road
  question: Why should you avoid honking your horn when encountering livestock on
    or along the highway?
  choices:
    A: It is illegal to use your horn in rural areas.
    B: It might scare the animal.
    C: It will cause the farmer to stop the equipment completely.
    D: It violates local noise ordinances.
  answer: B
  explanation: When encountering livestock, you should yield the right-of-way and
    not honk your horn because this might scare the animal.
- id: 112
  category: defensive_driving
  question: How can you warn vehicles behind you if you see a vehicle stopped on the
    side of the road?
  choices:
    A: Turn on your high beams.
    B: Honk your horn twice.
    C: Tap your brake pedal three or four times.
    D: Swerve slightly into the next lane.
  answer: C
  explanation: If you see a vehicle on the side of the road, warn other vehicles behind
    you by tapping your brake pedal three or four times.
- id: 113
  category: vehicle_information
  question: What is the proper way to use an Anti-Lock Braking System (ABS) in an
    emergency?
  choices:
    A: Gently pump the brakes until you stop.
    B: Apply firm, continuous pressure to the brake pedal.
    C: Tap the brakes repeatedly to avoid locking the wheels.
    D: Press the brake pedal lightly and steer sharply.
  answer: B
  explanation: The proper way to use ABS in an emergency is to apply firm, continuous
    pressure to the brake pedal until the vehicle has stopped or the danger has passed.
- id: 114
  category: driver_responsibility
  question: You must report a crash to the police if there is property damage of at
    least what amount?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: You need to report a crash to police if there is property damage of
    $1,000 or more.
- id: 115
  category: driver_responsibility
  question: 'You are required to report a crash to the police if it causes government
    property damage (such as signs or guard rails) of at least:'
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: A crash must be reported to the police if there is government property
    damage of $200 or more.
- id: 116
  category: safe_driving_rules
  question: What vehicle feature should you NOT use when driving on slippery winter
    roads?
  choices:
    A: Headlights
    B: Windshield wipers
    C: Defroster
    D: Cruise control
  answer: D
  explanation: 'The winter driving tips in the manual explicitly state: ''Do not use
    cruise control on slippery roads.'''
- id: 117
  category: defensive_driving
  question: If you experience a tire blowout while driving, what should you do first?
  choices:
    A: Slam on the brakes immediately
    B: Switch the car to neutral
    C: Hold the steering wheel to keep your vehicle going straight
    D: Pump the brake pedal several times
  answer: C
  explanation: If you have a tire blowout, you should hold the steering wheel to keep
    your vehicle going straight, lift your foot off the gas pedal, and slow down little
    by little.
- id: 118
  category: defensive_driving
  question: What is the proper response if your gas pedal sticks while driving?
  choices:
    A: Keep your eyes on the road and switch the car to neutral
    B: Turn off the engine immediately while still in traffic
    C: Pull the parking brake as hard as you can
    D: Pump the gas pedal repeatedly until it un-sticks
  answer: A
  explanation: If your gas pedal sticks, keep your eyes on the road, switch the car
    to neutral, pull off to the side of the road when safe, and then turn off the
    engine.
- id: 119
  category: alcohol_drugs_health
  question: What is the legal alcohol concentration allowed for drivers under the
    age of 21?
  choices:
    A: 0.08%
    B: 0.04%
    C: 0.02%
    D: 0.00%
  answer: D
  explanation: The legal alcohol concentration allowed for drivers under the age of
    21 is 0.00%. This means that you cannot have any alcohol in your system while
    driving a vehicle.
- id: 120
  category: penalties_and_points
  question: Under the Implied Consent Law, what happens if you refuse to take a prohibited
    alcohol concentration (PAC) test?
  choices:
    A: You will be given a warning and allowed to drive home
    B: You will lose your driving privileges for at least one year
    C: You will receive 6 demerit points on your license
    D: You will be required to take a written driving test
  answer: B
  explanation: If you refuse a PAC test, the officer must arrest you for violation
    of the Implied Consent Law, and you will lose your driving privileges for at least
    one year.
- id: 121
  category: safe_driving_rules
  question: When are instruction permit and probationary license holders allowed to
    use a cell phone while driving?
  choices:
    A: When using a hands-free device
    B: Only to report an emergency
    C: When stopped at a red light
    D: When reading GPS directions
  answer: B
  explanation: Instruction permit and probationary license holders can only use a
    cell phone to report an emergency.
- id: 122
  category: sharing_the_road
  question: What must you do if you approach a police car stopped on the side of the
    road with its lights and sirens on?
  choices:
    A: Stop immediately in your lane and wait for them to leave
    B: Honk your horn to let them know you are passing
    C: Move over into the lane not nearest the stopped vehicle or slow down
    D: Speed up to get past the scene quickly
  answer: C
  explanation: If you see a police car is stopped on the side of the road with their
    lights and sirens on, move over or slow down, it's the law. If approaching an
    emergency vehicle with its lights flashing, make sure to move into the lane not
    nearest the stopped vehicle.
- id: 123
  category: sharing_the_road
  question: When a school bus is stopped with its red lights flashing, how far away
    must you stop?
  choices:
    A: At least 10 feet
    B: At least 15 feet
    C: At least 20 feet
    D: At least 50 feet
  answer: C
  explanation: When a school bus is stopped with its red lights flashing you need
    to stop at least 20 feet from it.
- id: 124
  category: sharing_the_road
  question: Under what condition are you NOT required to stop for a school bus with
    flashing red lights?
  choices:
    A: When you are traveling in the same direction as the bus on a multi-lane road
    B: When you are on a divided highway and on the opposite side of the barrier from
      the bus
    C: When you are running late for an emergency
    D: When there are no children visible outside the bus
  answer: B
  explanation: If you are on a divided highway/roadway and not on the side of the
    school bus, you do not need to stop. A divided highway has a barrier between lanes
    going opposite directions.
- id: 125
  category: sharing_the_road
  question: How much room must you give a bicyclist when passing them?
  choices:
    A: At least one foot
    B: At least two feet
    C: At least three feet
    D: At least five feet
  answer: C
  explanation: Give bicyclists at least three feet of room when you pass.
- id: 126
  category: sharing_the_road
  question: What is a "No-Zone" when sharing the road with large trucks?
  choices:
    A: A designated lane where trucks are not allowed to drive
    B: An area about 200 feet behind and 20 feet in front of large trucks where they
      cannot see you
    C: A zone near schools where commercial vehicles must reduce speed
    D: The area on a divided highway where passing is prohibited
  answer: B
  explanation: No-Zones are where large vehicles cannot see you. This area is about
    200 feet behind and 20 feet in front of large trucks.
- id: 127
  category: penalties_and_points
  question: How many demerit points within a 12-month period will cause your driving
    privilege to be suspended or revoked?
  choices:
    A: 6 or more points
    B: 8 or more points
    C: 10 or more points
    D: 12 or more points
  answer: D
  explanation: You will not be able to drive if you get 12 or more demerit points
    within any 12-month period. Your driving privilege will be suspended or revoked.
- id: 128
  category: penalties_and_points
  question: If you hold a probationary license, what happens to your demerit points
    upon your second traffic conviction?
  choices:
    A: Your points are reduced by half
    B: Your points are doubled
    C: Your points are erased if you take a safety class
    D: Your points remain the same but your fines are doubled
  answer: B
  explanation: If you hold a probationary license, ID card or no type of license,
    you will have your points doubled. These points are doubled on the second conviction
    and any thereafter.
- id: 129
  category: penalties_and_points
  question: A habitual traffic offender is someone who is convicted of four or more
    major traffic violations or 12 or more minor violations within what time frame?
  choices:
    A: One year
    B: Three years
    C: Five years
    D: Ten years
  answer: C
  explanation: A habitual offender is someone who is convicted of four or more major
    traffic violations or 12 or more minor violations within five years.
- id: 130
  category: license_system
  question: An occupational license allows you to drive up to how many hours per week
    for work, school, and household maintenance?
  choices:
    A: 20 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: D
  explanation: An occupational license allows you to drive up to 12 hours a day and
    up to 60 hours a week to and from work, school, and places that you need to visit
    to maintain your household.
- id: 131
  category: safe_driving_rules
  question: According to Wisconsin law, who is required to wear a seat belt in a vehicle?
  choices:
    A: Only the driver and front-seat passengers
    B: Only passengers under the age of 18
    C: The driver and all passengers at any age
    D: Only passengers in vehicles without airbags
  answer: C
  explanation: Wisconsin law requires that you and your passengers wear seat belts
    (safety belts) at any age.
- id: 132
  category: vehicle_information
  question: If your vehicle is equipped with air bags, do you still need to wear your
    seat belt?
  choices:
    A: No, air bags replace the need for seat belts.
    B: Yes, you still need to wear your seat belt even if your vehicle has air bags.
    C: Only if you are driving on the highway.
    D: Only passengers in the back seat need to wear them.
  answer: B
  explanation: The manual states, "You still need to wear your seat belt even if your
    vehicle has air bags." Seat belts help keep you in position to control the vehicle
    and avoid injury.
- id: 133
  category: safe_driving_rules
  question: How should the lap belt of your seat belt be positioned?
  choices:
    A: Loosely across your thighs
    B: Snugly across your stomach
    C: Snugly across your hip bones just under your stomach
    D: High up on your waist
  answer: C
  explanation: The lap belt should fit snugly across your hip bones just under your
    stomach.
- id: 134
  category: safe_driving_rules
  question: What is the proper way to wear a shoulder belt?
  choices:
    A: Tucked under your arm for comfort
    B: Across your chest with enough room to put your fist between the belt and your
      chest
    C: Loosely hanging over your shoulder
    D: Behind your back if it rubs against your neck
  answer: B
  explanation: The shoulder belt should be worn across your chest. Adjust your belt
    so that you can put your fist between the belt and your chest. Never put the shoulder
    belt under your arm.
- id: 135
  category: safe_driving_rules
  question: Generally, at what age can a child transition out of a child safety seat
    and into a booster seat?
  choices:
    A: Age two
    B: Age four
    C: Age six
    D: Age eight
  answer: B
  explanation: Generally, children must be in a child safety seat until they reach
    age four and in a booster seat until age eight.
- id: 136
  category: safe_driving_rules
  question: Generally, children must remain in a booster seat until they reach what
    age?
  choices:
    A: Age four
    B: Age six
    C: Age eight
    D: Age ten
  answer: C
  explanation: Generally, children must be in a child safety seat until they reach
    age four and in a booster seat until age eight.
- id: 137
  category: driver_responsibility
  question: What type of car insurance is required to drive in Wisconsin?
  choices:
    A: Comprehensive insurance
    B: Collision insurance
    C: Valid liability car insurance
    D: Uninsured motorist coverage only
  answer: C
  explanation: You must have valid liability car insurance to drive in Wisconsin and
    present proof of it if a police officer requests it.
- id: 138
  category: driver_responsibility
  question: If you are driving someone else's car, whose responsibility is it to make
    sure the vehicle has insurance?
  choices:
    A: The vehicle owner's responsibility
    B: Your responsibility as the driver
    C: The insurance company's responsibility
    D: The DMV's responsibility
  answer: B
  explanation: If you are driving someone else’s car, it is your job to make sure
    it has insurance.
- id: 139
  category: license_system
  question: If you choose to report an invisible disability to the DMV, who will have
    access to this disclosure?
  choices:
    A: Only your insurance company
    B: The general public
    C: Law enforcement officers and WisDOT employees
    D: Only medical professionals
  answer: C
  explanation: The disclosure that you make will be available to law enforcement officers
    and employees of the Wisconsin Department of Transportation (WisDOT).
- id: 140
  category: license_system
  question: What are the minimum age and citizenship requirements to start the petition
    process for a free ID card for voting in Wisconsin?
  choices:
    A: 16 years of age and a U.S. citizen
    B: 17 years of age and a U.S. citizen
    C: 18 years of age and a U.S. citizen
    D: 18 years of age and a permanent resident
  answer: B
  explanation: You must be at least 17 years of age and a U.S. citizen to start the
    petition process for a free ID for voting.
- id: 141
  category: driver_responsibility
  question: If you are 18 years old or older and register to be an organ and tissue
    donor, who can override your decision?
  choices:
    A: Your parents
    B: Your spouse
    C: Your doctor
    D: No one can override your decision
  answer: D
  explanation: If you are 18 years old or older, your decision to be an organ and
    tissue donor may not be overridden by your family or any other person.
- id: 142
  category: vehicle_information
  question: How does low air pressure in your tires affect your vehicle?
  choices:
    A: It increases fuel mileage.
    B: It decreases fuel mileage.
    C: It improves braking distance.
    D: It prevents wear and tear on the engine.
  answer: B
  explanation: Low air pressure in tires decreases fuel mileage.
- id: 143
  category: defensive_driving
  question: Which driving habit helps save fuel and your brakes?
  choices:
    A: Stop-and-go driving in heavy traffic
    B: Slowing down little by little
    C: Braking abruptly at intersections
    D: Driving with low tire pressure
  answer: B
  explanation: When you slow down little by little this helps save fuel and your brakes.
- id: 144
  category: license_system
  question: What is the purpose of the Driver Education Grant Program?
  choices:
    A: To pay for college tuition for safe drivers
    B: To provide free vehicles to low-income families
    C: To pay for classroom and/or behind-the-wheel driver training for income-eligible
      teens
    D: To reimburse drivers for auto insurance premiums
  answer: C
  explanation: The Driver Education Grant Program enables teens who are income eligible
    to have their classroom and/or behind-the-wheel driver training paid for by the
    state.
- id: 145
  category: alcohol_drugs_health
  question: What should you do if you have a health problem that could affect your
    driving?
  choices:
    A: Stop driving entirely without notifying anyone.
    B: Report the health condition to the DMV.
    C: Only tell your insurance company.
    D: Wait until your license expires to mention it.
  answer: B
  explanation: Many health problems can affect your driving. You should report health
    conditions that could affect your driving to the DMV.
- id: 146
  category: safe_driving_rules
  question: What is the maximum speed limit in outlying parts of cities and villages
    with no posted speed limit?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: According to the practice quiz in the manual, the maximum speed limit
    in outlying parts of cities and villages with no posted speed limit is 35 mph.
- id: 147
  category: driver_responsibility
  question: If you are involved in a serious motor vehicle crash, which of the following
    is a required action?
  choices:
    A: Leave the scene immediately
    B: Wait for the other driver to call for help
    C: Determine if anyone is injured
    D: Move the vehicles before checking on passengers
  answer: C
  explanation: The manual states that if you are involved in a serious motor vehicle
    crash, you must stop, determine if anyone is injured, and call 911.
- id: 148
  category: driver_responsibility
  question: What number should you call if you are involved in a serious motor vehicle
    crash?
  choices:
    A: '311'
    B: '411'
    C: '511'
    D: '911'
  answer: D
  explanation: If you are involved in a serious motor vehicle crash, the manual instructs
    you to stop, check for injuries, and call 911.
- id: 149
  category: safe_driving_rules
  question: When turning left at an intersection, who must you yield to?
  choices:
    A: Passing cars only
    B: Oncoming cars moving straight ahead or turning right
    C: Vehicles turning left from the opposite direction
    D: No one in particular
  answer: B
  explanation: Drivers turning left must yield to oncoming cars moving straight ahead
    or turning right.
- id: 150
  category: safe_driving_rules
  question: What type of headlights should you use when driving in fog?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: When driving in fog, heavy rain, or snow, you should use your low beams.
- id: 151
  category: safe_driving_rules
  question: If you are driving in heavy rain or snow, which lights are appropriate
    to use?
  choices:
    A: Low beams
    B: High beams
    C: Driving lights only
    D: Interior dome lights
  answer: A
  explanation: You should use low beams when driving in fog, heavy rain, or snow.
- id: 152
  category: signs_and_signals
  question: How should you react as you approach an intersection with a flashing yellow
    light?
  choices:
    A: Wait for a green light
    B: Stop completely before crossing through
    C: Speed up to clear the intersection quickly
    D: Slow down and proceed with caution
  answer: D
  explanation: As you approach an intersection with a flashing yellow light, you must
    slow down and proceed with caution.
- id: 153
  category: signs_and_signals
  question: What does a single dashed yellow line separating traffic indicate?
  choices:
    A: The lanes are going in the same direction
    B: You may not pass under any circumstances
    C: You may pass if safe to do so and lanes go in opposite directions
    D: You must stop before crossing the line
  answer: C
  explanation: A single dashed yellow line means the lanes are going in opposite directions
    and you may pass if it is safe to do so.
- id: 154
  category: signs_and_signals
  question: What color line separates traffic moving in opposite directions?
  choices:
    A: White
    B: Yellow
    C: Red
    D: Blue
  answer: B
  explanation: A single dashed yellow line separates traffic where the lanes are going
    in opposite directions.
- id: 155
  category: safe_driving_rules
  question: What is the proper procedure for merging onto an interstate highway?
  choices:
    A: Always stop before entering the highway
    B: Select a safe gap and merge into the lane of traffic
    C: Merge over two lanes at once and speed up
    D: Force your way into traffic so other drivers yield
  answer: B
  explanation: When merging onto an interstate highway, you should select a safe gap
    and merge into the lane of traffic.
- id: 156
  category: safe_driving_rules
  question: Under what conditions is it acceptable to drive faster than the posted
    speed limit?
  choices:
    A: If you do not see any other traffic in your lane
    B: As long as there are safe conditions to do so
    C: When passing another vehicle
    D: Never
  answer: D
  explanation: According to the manual's practice quiz, it is never OK to drive faster
    than the posted speed limit.
- id: 157
  category: defensive_driving
  question: How far down the road should you look ahead when driving?
  choices:
    A: 1 to 2 blocks
    B: 200 to 250 yards
    C: 10 to 15 seconds
    D: 5 to 8 seconds
  answer: C
  explanation: When driving, you should look 10 to 15 seconds down the road.
- id: 158
  category: sharing_the_road
  question: If you want to pass a bicycle but an oncoming vehicle is approaching,
    what should you do?
  choices:
    A: Speed up to pass the bicycle before the car approaches
    B: Honk at the bicycle to move off the road
    C: Slow down and let the car pass, then pass the bicycle
    D: Pull over to the side of the road and stop completely
  answer: C
  explanation: If you are wanting to pass a bicycle and there is an oncoming vehicle,
    you should slow down and let the car pass, then pass the bicycle.
- id: 159
  category: safe_driving_rules
  question: What is a recommended safety practice when driving at night?
  choices:
    A: Always use your high beams
    B: Look directly at the headlights of oncoming vehicles
    C: Drive closer to the vehicle ahead to see their taillights
    D: Increase your following distance
  answer: D
  explanation: When driving at night, you should increase your following distance.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
