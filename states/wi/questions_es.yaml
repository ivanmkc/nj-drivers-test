questions:
- id: 1
  category: driver_responsibility
  question: 'Según el Manual del Automovilista de Wisconsin, conducir se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio y una responsabilidad muy importante
    C: Un requisito para todos los ciudadanos mayores de 18 años
    D: Un pasatiempo opcional
  answer: B
  explanation: 'El manual establece: "También es crucial recordar que conducir es
    un privilegio y una responsabilidad muy importante".'
- id: 2
  category: safe_driving_rules
  question: ¿Cuál de los siguientes se enumera en el manual como un comportamiento
    seguro para ayudar a tomar el control de su conducción?
  choices:
    A: Conducir ligeramente por encima del límite de velocidad para mantener el ritmo
      del tráfico
    B: Compartir la vía con peatones y ciclistas
    C: Depender únicamente de sus pasajeros para estar atento a las motocicletas
    D: Realizar múltiples tareas mientras opera el vehículo
  answer: B
  explanation: El manual enumera "Compartir la vía con peatones y ciclistas" como
    uno de los comportamientos seguros a desarrollar al volante.
- id: 3
  category: driver_responsibility
  question: ¿Qué organización se menciona específicamente como responsable de educar
    al público sobre las reglas de tránsito y hacer cumplir las leyes de tránsito
    de Wisconsin?
  choices:
    A: Departamento de Vehículos Motorizados de Wisconsin (DMV)
    B: Patrulla Estatal de Wisconsin
    C: Administración Nacional de Seguridad del Tráfico en las Carreteras (NHTSA)
    D: Departamento de Transporte de Wisconsin
  answer: B
  explanation: 'El manual establece: "La Patrulla Estatal de Wisconsin educa al público
    sobre las reglas de tránsito y hace cumplir las leyes de tránsito de Wisconsin".'
- id: 4
  category: license_system
  question: ¿Cuál es la función principal del DMV según se describe en la sección
    introductoria del manual?
  choices:
    A: Hacer cumplir las leyes de tránsito de Wisconsin en las carreteras
    B: Diseñar las carreteras de Wisconsin a través de un enfoque de Sistema Seguro
    C: Garantizar que los conductores estén capacitados y calificados para operar
      un vehículo
    D: Operar la Línea Directa Nacional contra la Trata de Personas
  answer: C
  explanation: El texto señala que "el DMV garantiza que los conductores estén capacitados
    y calificados para operar un vehículo, incluso a través de recursos útiles como
    este Manual del Automovilista".
- id: 5
  category: defensive_driving
  question: ¿Cuál es el objetivo del enfoque de Sistema Seguro de Wisconsin para la
    seguridad en las carreteras?
  choices:
    A: Garantizar que todos los conductores aprueben el examen de conocimientos en
      su primer intento
    B: Diseñar y operar el sistema de transporte para que los errores de los conductores
      no se vuelvan mortales
    C: Eliminar todas las paradas de tráfico por parte de la Patrulla Estatal de Wisconsin
    D: Reemplazar todas las intersecciones tradicionales con rotondas
  answer: B
  explanation: El manual explica que el enfoque de Sistema Seguro "tiene como objetivo
    diseñar y operar el sistema de transporte de Wisconsin para que los errores de
    los conductores no se vuelvan mortales".
- id: 6
  category: driver_testing
  question: ¿Dónde puede encontrar el Examen de Práctica en Línea para la Licencia
    de Conducir Clase D?
  choices:
    A: KnowToDrive.com/Wisconsin
    B: wisconsindmv.gov
    C: love146.org/online-safety
    D: tatnonprofit.org/youth
  answer: B
  explanation: El manual establece que el Examen de Práctica en Línea para la Licencia
    de Conducir Clase D "se puede encontrar en nuestro sitio web del DMV wisconsindmv.gov".
- id: 7
  category: driver_responsibility
  question: ¿En cuántos condados de Wisconsin se han reportado casos de trata de personas?
  choices:
    A: 10 condados
    B: 25 condados
    C: 50 condados
    D: En los 72 condados
  answer: D
  explanation: 'La sección sobre la trata de personas establece explícitamente: "Se
    han reportado casos de trata de personas en los 72 condados de Wisconsin".'
- id: 8
  category: driver_responsibility
  question: Según la información sobre la trata de personas en el manual, ¿cualquier
    persona menor de qué edad que intercambie actos sexuales por dinero u otras cosas
    de valor se considera una víctima?
  choices:
    A: Menor de 16 años
    B: Menor de 18 años
    C: Menor de 21 años
    D: Menor de 25 años
  answer: B
  explanation: 'El texto establece: "Cualquier persona menor de 18 años que intercambie
    actos sexuales por dinero u otras cosas de valor se considera víctima de la trata
    de personas".'
- id: 9
  category: driver_responsibility
  question: ¿Qué palabra puede enviar por mensaje de texto a BeFree (233733) para
    comunicarse con la Línea Directa Nacional contra la Trata de Personas?
  choices:
    A: SAFE
    B: HELP
    C: STOP
    D: ALERT
  answer: B
  explanation: El manual proporciona la información de contacto de la Línea Directa
    Nacional contra la Trata de Personas como "1-888-3737-888 o envíe el texto HELP
    a BeFree (233733)".
- id: 10
  category: driver_responsibility
  question: Según el manual, ¿cómo suelen conocer los traficantes de personas a sus
    víctimas?
  choices:
    A: A través de cursos de educación vial
    B: En los centros de servicio del DMV
    C: En línea mientras fingen ser otra persona
    D: A través del Programa de Subvenciones para la Educación Vial
  answer: C
  explanation: La sección "Manténgase seguro" advierte que "los traficantes a menudo
    conocen a sus víctimas en línea mientras fingen ser otra persona".
- id: 11
  category: driver_testing
  question: Según la Sección 1 del Índice del manual, ¿cuál de los siguientes es un
    requisito para el examen de manejo?
  choices:
    A: Un examen médico físico
    B: Un examen de señales de tránsito
    C: Una prueba de emisiones
    D: Una verificación de antecedentes
  answer: B
  explanation: La Sección 1 (Requisitos del examen de manejo) enumera el examen de
    la vista, el examen de señales de tránsito, el examen de conocimientos y el examen
    de habilidades prácticas.
- id: 12
  category: license_system
  question: Según la Progresión de Licencias descrita en la Sección 2, ¿qué licencia
    viene inmediatamente después de un Permiso de Instrucción?
  choices:
    A: Licencia Ocupacional
    B: Licencia de Conducir Regular
    C: Licencia Probatoria
    D: Licencia de Conducir Comercial (CDL)
  answer: C
  explanation: La Sección 2 (Progresión de Licencias) enumera el orden como Patrocinio,
    Permiso de Instrucción, Licencia Probatoria y luego Licencia de Conducir Regular.
- id: 13
  category: safe_driving_rules
  question: ¿Cuál de los siguientes temas está clasificado bajo "Comportamientos Peligrosos
    al Conducir" en la Sección 9 del manual?
  choices:
    A: Dar marcha atrás
    B: Conducir somnoliento
    C: Seguridad agrícola
    D: Conducir en invierno
  answer: B
  explanation: La Sección 9 (Comportamientos Peligrosos al Conducir) incluye Alcohol,
    Drogas y Conducción; Conducción Distraída; y Conducir Somnoliento.
- id: 14
  category: sharing_the_road
  question: La Sección 10 del manual cubre "Compartir el Camino". ¿Cuál de los siguientes
    es un tema incluido en esta sección?
  choices:
    A: Zonas ciegas (No-Zones)
    B: Rampas con semáforo (Metered Ramps)
    C: Intersecciones de diamante divergente
    D: Rotondas
  answer: A
  explanation: La Sección 10 (Compartir el Camino) enumera Peatones, Vehículos de
    Emergencia, Autobuses Escolares, Motocicletas, Bicicletas y Zonas Ciegas (No-Zones).
- id: 15
  category: penalties_and_points
  question: Según la Sección 11 del Índice, ¿qué sistema utiliza Wisconsin para hacer
    un seguimiento de su privilegio de conducir?
  choices:
    A: El Sistema de Deméritos
    B: El Sistema de Puntos
    C: El Sistema de Faltas (Strikes)
    D: El Sistema de Infracciones
  answer: B
  explanation: La Sección 11 (Su Privilegio de Conducir) enumera el "Sistema de Puntos"
    como su primer tema.
- id: 16
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima requerida en al menos un ojo para aprobar
    el examen de la vista para una licencia de conducir regular?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Según el manual, Wisconsin requiere que los solicitantes de automóviles
    regulares tengan una agudeza visual de al menos 20/40 en un ojo (con o sin corrección).
- id: 17
  category: driver_testing
  question: ¿Cuál es el campo de visión requerido desde el centro de cada ojo para
    aprobar el examen de la vista?
  choices:
    A: 50 grados
    B: 70 grados
    C: 90 grados
    D: 120 grados
  answer: B
  explanation: El manual establece que los solicitantes deben tener un campo de visión
    de 70 grados desde el centro de cada ojo.
- id: 18
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el examen
    de señales de tránsito?
  choices:
    A: 10 de 15
    B: 12 de 15
    C: 15 de 20
    D: 40 de 50
  answer: B
  explanation: Hay 15 preguntas en el examen de señales de tránsito, y necesita responder
    12 preguntas (80%) correctamente para aprobar.
- id: 19
  category: driver_testing
  question: ¿Cuál es la tarifa por tomar el examen de conocimientos en persona en
    un centro de servicio al cliente del DMV?
  choices:
    A: $10
    B: $15
    C: $25
    D: Es gratis
  answer: D
  explanation: El manual establece que los exámenes en un centro de servicio al cliente
    del DMV son gratuitos.
- id: 20
  category: driver_testing
  question: Si un solicitante tiene entre 15 y 17 años, ¿cuánto cuesta tomar el examen
    de conocimientos en línea?
  choices:
    A: Es gratis
    B: $10
    C: $15
    D: $20
  answer: B
  explanation: Los solicitantes de entre 15 y 17 años pueden tomar el examen de conocimientos
    en línea por una tarifa de $10.
- id: 21
  category: driver_testing
  question: ¿Cuál de las siguientes opciones NO aparece como una parte del vehículo
    que el examinador del DMV revisará antes de su examen de manejo (skills test)?
  choices:
    A: Bocina (claxon)
    B: Nivel de aceite del motor
    C: Placas (matrículas)
    D: Espejos
  answer: B
  explanation: Antes del examen, el examinador revisa la bocina, las luces/señales,
    las placas, las puertas, los espejos y más. El nivel de aceite del motor no está
    en la lista.
- id: 22
  category: license_system
  question: ¿Cuántos documentos que comprueben que vive en Wisconsin debe presentar
    al solicitar una licencia?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para solicitar una licencia, debe presentar dos documentos que comprueben
    que vive en Wisconsin, como una factura de servicios públicos o un estado de cuenta
    financiero.
- id: 23
  category: driver_responsibility
  question: ¿Qué significa cuando un adulto firma como patrocinador (sponsor) de un
    conductor menor de 18 años?
  choices:
    A: Debe viajar en el vehículo en todo momento.
    B: Paga el curso de educación vial del conductor.
    C: Acepta la responsabilidad legal y financiera por los incidentes causados por
      el menor.
    D: Garantiza que el menor aprobará el examen de manejo.
  answer: C
  explanation: El patrocinador acepta la responsabilidad, lo que significa que es
    legal y financieramente responsable de los incidentes causados por el menor al
    conducir.
- id: 24
  category: license_system
  question: ¿Bajo qué condición debe un menor presentar un comprobante de seguro en
    lugar de tener un patrocinador?
  choices:
    A: Tiene 16 años y vive con sus padres.
    B: Está casado y su cónyuge es menor de 18 años.
    C: Ha completado 50 horas de práctica de manejo supervisada.
    D: Está tomando el examen de conocimientos en línea.
  answer: B
  explanation: Debe presentar un comprobante de seguro en lugar de tener un patrocinador
    si está casado y su cónyuge es menor de 18 años, entre otros criterios específicos.
- id: 25
  category: license_system
  question: ¿Qué edad debe tener para solicitar un permiso de instrucción si está
    inscrito en un programa de educación vial?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: B
  explanation: Si es menor de 18 años, debe tener al menos 15 años y estar inscrito
    en un programa de educación vial para solicitar un permiso de instrucción.
- id: 26
  category: safe_driving_rules
  question: Si tiene un permiso de instrucción y conduce durante las horas de oscuridad,
    ¿quién debe acompañarlo en el asiento del pasajero?
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Un hermano que tenga al menos 16 años
    C: Un instructor calificado o una persona con licencia de 25 años de edad con
      al menos dos años de experiencia de manejo con licencia
    D: Cualquier persona con una licencia probatoria válida
  answer: C
  explanation: Si opera un vehículo durante las horas de oscuridad, debe estar acompañado
    por un instructor calificado o una persona con licencia de 25 años de edad con
    al menos dos años de experiencia de manejo con licencia ocupando el asiento a
    su lado.
- id: 27
  category: safe_driving_rules
  question: La persona que acompaña a un titular de un permiso de instrucción en el
    asiento del pasajero debe tener al menos ¿cuántos años de experiencia de manejo
    con licencia?
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cinco años
  answer: B
  explanation: El titular del permiso de instrucción clase D debe conducir con otra
    persona en el automóvil que tenga al menos dos años de experiencia de manejo con
    licencia.
- id: 28
  category: license_system
  question: ¿Cuánto tiempo debe tener su permiso de instrucción un conductor menor
    de 18 años antes de poder obtener una licencia probatoria?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Si es menor de 18 años, necesita tener su permiso de instrucción durante
    al menos seis meses y cumplir 16 años para obtener una licencia probatoria.
- id: 29
  category: driver_testing
  question: ¿Cuántas horas totales de práctica de manejo supervisada debe completar
    un menor antes de obtener una licencia probatoria?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Con un permiso de instrucción válido, debe practicar el manejo durante
    al menos 40 horas de día y 10 horas de noche, sumando un total de 50 horas.
- id: 30
  category: safe_driving_rules
  question: Mientras conduce con una licencia probatoria, ¿cuándo se le permite usar
    un teléfono?
  choices:
    A: Cuando está detenido en un semáforo en rojo
    B: Solo para reportar una emergencia
    C: Cuando usa un dispositivo manos libres
    D: Nunca se le permite usar un teléfono bajo ninguna circunstancia
  answer: B
  explanation: 'El manual establece para las licencias probatorias: "Recuerde que
    no se permiten los teléfonos mientras conduce, a menos que necesite reportar una
    emergencia".'
- id: 31
  category: license_system
  question: ¿Por cuánto tiempo se requieren las restricciones de pasajeros y de horario
    de la Licencia de Conducir Graduada (GDL) para los conductores menores de 18 años?
  choices:
    A: Durante los primeros 6 meses
    B: Durante los primeros 9 meses
    C: Durante los primeros 12 meses
    D: Hasta que el conductor cumpla 21 años
  answer: B
  explanation: Según el manual, las restricciones de la GDL se requieren durante los
    primeros nueve meses, a menos que cumpla 18 años antes de ese tiempo.
- id: 32
  category: license_system
  question: Bajo una Licencia de Conducir Graduada (GDL), ¿hacia dónde se le permite
    conducir solo entre la medianoche y las 5 a.m.?
  choices:
    A: A cualquier lugar dentro de los límites de su ciudad de residencia
    B: Solo entre el hogar, la escuela y/o el trabajo
    C: Solo hacia emergencias médicas
    D: Nunca se le permite conducir solo durante estas horas
  answer: B
  explanation: El manual establece que desde las 12 a.m. (medianoche) hasta las 5
    a.m., puede conducir solo ÚNICAMENTE si conduce entre el hogar, la escuela y/o
    el trabajo.
- id: 33
  category: penalties_and_points
  question: ¿Qué causará que las restricciones de su Licencia de Conducir Graduada
    (GDL) se extiendan por seis meses?
  choices:
    A: Recibir una multa de estacionamiento
    B: Ser condenado por una infracción de tránsito en movimiento
    C: No renovar su licencia con 90 días de anticipación
    D: Conducir con un familiar directo
  answer: B
  explanation: Las restricciones de la licencia de conducir graduada se extenderán
    seis meses si es condenado por una infracción de tránsito en movimiento, viola
    alguna restricción o si su licencia es suspendida/revocada.
- id: 34
  category: license_system
  question: ¿Con qué frecuencia se debe renovar una licencia de conducir regular de
    Wisconsin?
  choices:
    A: Cada 4 años
    B: Cada 5 años
    C: Cada 8 años
    D: Cada 10 años
  answer: C
  explanation: El manual establece que la renovación de su licencia de conducir debe
    hacerse cada ocho años.
- id: 35
  category: license_system
  question: Si se muda a Wisconsin con una licencia de conducir regular de otro estado,
    ¿dentro de cuántos días debe solicitar una licencia de Wisconsin?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Para una licencia de conducir regular de otro estado, debe solicitar
    una licencia de conducir de Wisconsin dentro de los 60 días posteriores a su mudanza.
- id: 36
  category: license_system
  question: ¿Cómo se marca una licencia de conducir que cumple con la ley REAL ID
    en Wisconsin?
  choices:
    A: Con un círculo dorado
    B: Con una estrella
    C: Con un águila calva
    D: Con un código de barras en la parte delantera
  answer: B
  explanation: El manual señala que el DMV de Wisconsin emite la REAL ID que cumple
    con los requisitos de Seguridad Nacional (Homeland Security), la cual está marcada
    con una estrella.
- id: 37
  category: safe_driving_rules
  question: Si dos conductores llegan a una intersección de cuatro altos (four-way
    stop) exactamente al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que sigue derecho
    D: El conductor que gira a la derecha
  answer: B
  explanation: Según las reglas de derecho de paso, si uno o más conductores llegan
    a la parada al mismo tiempo, el conductor de la derecha pasa primero.
- id: 38
  category: sharing_the_road
  question: Al encontrarse con un peatón que usa un perro guía o lleva un bastón blanco,
    ¿qué debe hacer?
  choices:
    A: Tocar la bocina para hacerles saber que usted está ahí
    B: Detenerse a por lo menos diez pies de distancia hasta que salgan de la vía
    C: Ceder el paso solo si están en un cruce peatonal marcado
    D: Conducir alrededor de ellos lentamente
  answer: B
  explanation: Debe ceder el derecho de paso a los peatones que usan un perro guía
    o llevan un bastón blanco deteniéndose a por lo menos diez pies de distancia hasta
    que la persona salga de la vía.
- id: 39
  category: safe_driving_rules
  question: ¿Qué regla debe usar para determinar una distancia de seguimiento segura
    bajo condiciones normales de manejo?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de distancia de seguimiento de cuatro segundos
    D: La regla de la longitud de un vehículo
  answer: C
  explanation: El manual indica a los conductores que conduzcan a una velocidad en
    la que siempre puedan detenerse de manera segura utilizando la "Regla de distancia
    de seguimiento de cuatro segundos".
- id: 40
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad normal en una zona escolar cuando hay
    niños presentes en Wisconsin?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 35 millas por hora
  answer: A
  explanation: El manual especifica que el límite de velocidad normal en una zona
    escolar cuando hay niños presentes es de 15 millas por hora.
- id: 41
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    las zonas residenciales?
  choices:
    A: 15 millas por hora
    B: 25 millas por hora
    C: 30 millas por hora
    D: 35 millas por hora
  answer: B
  explanation: A menos que se indique lo contrario, el límite de velocidad en las
    zonas residenciales es de 25 millas por hora.
- id: 42
  category: defensive_driving
  question: Al incorporarse a una carretera de alta velocidad desde un carril de aceleración,
    ¿cuál es su responsabilidad?
  choices:
    A: Detenerse al final de la rampa y esperar un espacio
    B: Obligar a otros conductores a cambiar su velocidad para que usted pueda entrar
    C: Encontrar un espacio seguro en el tráfico para incorporarse legalmente
    D: Conducir por el arcén (hombro) hasta que se abra un espacio
  answer: C
  explanation: En el carril de aceleración, usted aumenta la velocidad al incorporarse.
    El manual establece que es su responsabilidad encontrar un espacio seguro en el
    tráfico para incorporarse legalmente.
- id: 43
  category: defensive_driving
  question: Para mantener un mejor control de su vehículo, ¿qué tan lejos hacia adelante
    debería poder ver?
  choices:
    A: De 3 a 5 segundos hacia adelante
    B: De 5 a 10 segundos hacia adelante
    C: De 10 a 15 segundos hacia adelante
    D: De 20 a 30 segundos hacia adelante
  answer: C
  explanation: Para tener un mejor control de su vehículo, el conductor necesita poder
    ver de 10 a 15 segundos por delante de su vehículo.
- id: 44
  category: safe_driving_rules
  question: ¿Cuál es el patrón de búsqueda recomendado antes de cruzar una intersección?
  choices:
    A: Mirar a la derecha, luego a la izquierda
    B: Mirar solo hacia adelante
    C: Mirar a la izquierda, a la derecha y de nuevo a la izquierda
    D: Mirar por el espejo retrovisor, luego a la izquierda
  answer: C
  explanation: El manual aconseja estar alerta mirando a la izquierda, a la derecha
    y de nuevo a la izquierda antes de cruzar la intersección, incluso si usted tiene
    el derecho de paso.
- id: 45
  category: safe_driving_rules
  question: ¿A quién debe ceder el derecho de paso en una intersección en T no controlada?
  choices:
    A: Al vehículo en la calle que termina
    B: Al tráfico transversal
    C: Al vehículo que gira a la izquierda
    D: Al vehículo que toca la bocina primero
  answer: B
  explanation: Según las reglas de derecho de paso del manual, debe ceder el derecho
    de paso al tráfico transversal en una intersección en T no controlada.
- id: 46
  category: safe_driving_rules
  question: ¿Qué significa deslizarse en 'punto muerto' (coast) al conducir, lo cual
    el manual desaconseja?
  choices:
    A: Conducir sin usar el acelerador
    B: Poner su vehículo en posición neutral
    C: Conducir con el freno de estacionamiento parcialmente puesto
    D: Apagar el motor mientras está en movimiento
  answer: B
  explanation: 'El manual establece: ''No se deslice en punto muerto (coast) mientras
    conduce, esto significa poner su automóvil en posición neutral. Manténgase en
    "marcha" para que pueda tener control total sobre su vehículo''.'
- id: 47
  category: defensive_driving
  question: ¿Con qué frecuencia debe revisar su espejo retrovisor para ver si alguien
    lo sigue demasiado de cerca?
  choices:
    A: Cada 3 a 5 segundos
    B: Cada 6 a 8 segundos
    C: Cada 10 a 12 segundos
    D: Cada 15 a 20 segundos
  answer: B
  explanation: 'El manual aconseja: ''Revise su espejo retrovisor cada 6 a 8 segundos
    para ver si alguien lo sigue demasiado de cerca (tailgating)''.'
- id: 48
  category: safe_driving_rules
  question: ¿Qué debe hacer si otro conductor lo sigue demasiado de cerca (tailgating)?
  choices:
    A: Tocar los frenos rápidamente para advertirle
    B: Acelerar para aumentar la distancia entre sus vehículos
    C: Reducir lentamente su velocidad para animarlo a que lo rebase
    D: Cambiar de carril inmediatamente sin usar las direccionales
  answer: C
  explanation: 'El manual establece: ''Si alguien lo sigue demasiado de cerca, reduzca
    lentamente su velocidad. Esto debería animarlo a que lo rebase''.'
- id: 49
  category: safe_driving_rules
  question: ¿Por qué es importante mantener el volante derecho mientras espera para
    hacer un giro a la izquierda?
  choices:
    A: Evita que el líquido de la dirección asistida se sobrecaliente
    B: Le ayuda a acelerar más rápido cuando el camino está despejado
    C: Evita que sea empujado hacia el tráfico en sentido contrario si alguien lo
      choca por detrás
    D: Indica a otros conductores que usted está cediendo el derecho de paso
  answer: C
  explanation: 'El manual explica: ''Si gira el volante a la izquierda y alguien lo
    choca por detrás, será empujado hacia el tráfico en sentido contrario. Es importante
    mantener el volante, las ruedas y el vehículo derechos''.'
- id: 50
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite hacer un giro en U en una carretera
    rural de dos carriles?
  choices:
    A: Solo cuando hay un carril designado para giros en U
    B: Si se hace de manera segura y no interfiere con el tráfico
    C: Solo durante las horas de luz del día
    D: Los giros en U nunca están permitidos en carreteras rurales de dos carriles
  answer: B
  explanation: 'El manual establece: ''Puede hacer un giro en U en cualquier carretera
    rural de dos carriles si se hace de manera segura y no interfiere con el tráfico''.'
- id: 51
  category: safe_driving_rules
  question: ¿Desde qué carril debe girar al dar vuelta a la derecha para salir de
    una vía de cuatro carriles?
  choices:
    A: El carril más cercano a la línea central
    B: Cualquier carril siempre y cuando use las direccionales
    C: El carril más cercano al borde derecho o acera de la vía
    D: El carril con la menor cantidad de tráfico
  answer: C
  explanation: 'El manual especifica: ''Para girar a la derecha al salir de una vía
    de cuatro carriles, debe girar desde el carril más cercano a la acera derecha
    o al borde de la vía''.'
- id: 52
  category: vehicle_operation
  question: ¿Cuál es el primer paso al realizar una vuelta en Y (Y-Turn)?
  choices:
    A: Poner la direccional izquierda y revisar su punto ciego
    B: Mirar hacia atrás por encima de su hombro derecho y retroceder
    C: Poner la direccional derecha, verificar el tráfico, orillarse lo más a la derecha
      posible y detenerse
    D: Avanzar y continuar en su carril de tráfico
  answer: C
  explanation: 'El primer paso de una vuelta en Y es: ''1. Ponga la direccional derecha.
    Verifique el tráfico a la derecha y en sus espejos. Oríllese lo más a la derecha
    posible. Deténgase''.'
- id: 53
  category: sharing_the_road
  question: ¿Cuándo está permitido usar un acotamiento pavimentado para rebasar a
    otro vehículo?
  choices:
    A: Cuando el vehículo de adelante viaja por debajo del límite de velocidad
    B: Solo si el vehículo de adelante está detenido o dando vuelta a la izquierda
    C: Cuando conduce en una autopista de varios carriles
    D: Nunca está permitido rebasar por un acotamiento pavimentado
  answer: B
  explanation: 'El manual indica: ''Puede usar un acotamiento pavimentado para rebasar
    a alguien solo si está detenido o dando vuelta a la izquierda''.'
- id: 54
  category: defensive_driving
  question: ¿Cómo sabe que es seguro regresar al carril de conducción después de rebasar
    a otro vehículo?
  choices:
    A: Cuando está a la distancia de un automóvil por delante del vehículo rebasado
    B: Cuando ve ambos faros delanteros del vehículo que acaba de rebasar en su espejo
      retrovisor
    C: Cuando el conductor del vehículo rebasado parpadea sus luces altas
    D: Tres segundos después de haber rebasado al vehículo
  answer: B
  explanation: 'El manual indica: ''Una vez que vea ambos faros delanteros del vehículo
    que acaba de rebasar en su espejo retrovisor, es seguro regresar al carril de
    conducción''.'
- id: 55
  category: vehicle_operation
  question: ¿Cuál es la velocidad máxima a la que debe viajar al ir en reversa?
  choices:
    A: 10 millas por hora
    B: 5 millas por hora
    C: No más rápido que una caminata lenta
    D: El límite de velocidad indicado en la vía
  answer: C
  explanation: 'El manual aconseja: ''Cuando sea necesario ir en reversa, muévase
    lentamente. Retroceda a una velocidad no mayor a la de una caminata lenta''.'
- id: 56
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en una vía?
  choices:
    A: Detenerse inmediatamente y retroceder por el acotamiento
    B: Dar vuelta en U en el próximo cruce disponible del camellón
    C: Poner su vehículo en reversa y retroceder en el carril del extremo derecho
    D: Continuar hasta la siguiente salida y volver a entrar a la vía para regresar
      a la salida que se pasó
  answer: D
  explanation: 'El manual establece explícitamente: ''Si se pasa de su salida o vuelta
    en una vía, no retroceda. Continúe hasta la siguiente salida y vuelva a entrar
    a la vía para regresar a la salida que se pasó''.'
- id: 57
  category: safe_driving_rules
  question: ¿Dónde está estrictamente prohibido estacionarse según el texto del manual
    provisto?
  choices:
    A: En cualquier carretera rural de dos carriles
    B: Donde hay marcas amarillas en la acera o frente a los hidrantes de incendios
    C: En el extremo derecho de la vía
    D: En áreas residenciales con calles estrechas
  answer: B
  explanation: 'El manual indica: ''No se permite estacionar donde hay marcas amarillas
    en la acera o en áreas frente a hidrantes de incendios''.'
- id: 58
  category: safe_driving_rules
  question: ¿Se le permite exceder el límite de velocidad al rebasar a otro vehículo?
  choices:
    A: Sí, pero solo por 5 mph
    B: Sí, si está rebasando a un camión grande o autobús
    C: No, no puede superar el límite de velocidad para rebasar a otro vehículo
    D: Sí, pero solo en una autopista de varios carriles
  answer: C
  explanation: 'El manual establece claramente: ''No puede superar el límite de velocidad
    para rebasar a otro vehículo en la vía''.'
- id: 59
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante al estacionarse cuesta arriba con
    acera (bordillo)?
  choices:
    A: Completamente hacia la derecha
    B: Completamente hacia la izquierda
    C: Mantener las ruedas derechas
    D: Ligeramente hacia la derecha
  answer: B
  explanation: Según el manual, si se estaciona cuesta arriba con acera, debe girar
    las ruedas completamente hacia la izquierda antes de poner su auto en la posición
    de estacionamiento (Park).
- id: 60
  category: safe_driving_rules
  question: ¿En qué dirección debe girar las ruedas al estacionar su vehículo cuesta
    abajo?
  choices:
    A: Completamente hacia la derecha
    B: Completamente hacia la izquierda
    C: Mantenerlas derechas
    D: Hacia el centro de la calle
  answer: A
  explanation: El manual indica que si se estaciona cuesta abajo, debe girar las ruedas
    completamente hacia la derecha.
- id: 61
  category: safe_driving_rules
  question: Al buscar un espacio para estacionarse en paralelo, ¿cuánto más largo
    que su vehículo debe ser el espacio?
  choices:
    A: 1-2 pies
    B: 3-6 pies
    C: 6-8 pies
    D: 8-10 pies
  answer: B
  explanation: El manual aconseja buscar un espacio de estacionamiento que sea aproximadamente
    de 3 a 6 pies más largo que su vehículo al prepararse para estacionar en paralelo.
- id: 62
  category: safe_driving_rules
  question: Después de estacionarse en paralelo con éxito, ¿aproximadamente a qué
    distancia debe estar su vehículo del borde de la acera?
  choices:
    A: Aproximadamente 6 pulgadas
    B: Aproximadamente un pie
    C: Aproximadamente 2 pies
    D: Aproximadamente 3 pies
  answer: B
  explanation: Una vez que enderece las ruedas después de estacionarse en paralelo,
    debe estar aproximadamente a un pie del borde de la acera y al menos a 2 pies
    de distancia de los vehículos delante y detrás de usted.
- id: 63
  category: safe_driving_rules
  question: ¿Debe usar las luces bajas de sus faros cuando no pueda ver a un vehículo
    o persona desde qué distancia?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: Debe usar las luces bajas/faros cuando no pueda ver un vehículo o persona
    que esté a 500 pies (aproximadamente una cuadra) de distancia.
- id: 64
  category: safe_driving_rules
  question: ¿Durante qué período de tiempo está legalmente obligado a usar las luces
    bajas de sus faros?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Media hora después del atardecer hasta media hora antes del amanecer
    C: Una hora después del atardecer hasta una hora antes del amanecer
    D: Solo cuando está completamente oscuro
  answer: B
  explanation: El manual indica que debe usar las luces bajas/faros desde media hora
    después del atardecer hasta media hora antes del amanecer.
- id: 65
  category: defensive_driving
  question: ¿Qué debe hacer si un conductor que se aproxima olvida apagar sus luces
    altas?
  choices:
    A: Parpadear sus luces altas rápidamente
    B: Mirar hacia el lado izquierdo de la carretera
    C: Mirar hacia el lado derecho de la carretera
    D: Encender las luces de emergencia (hazard lights)
  answer: C
  explanation: Si alguien conduce hacia usted y olvida apagar sus luces altas, debe
    mirar hacia el lado derecho de la carretera.
- id: 66
  category: safe_driving_rules
  question: Si va a girar en una intersección, ¿cuándo debe comenzar a usar las luces
    direccionales?
  choices:
    A: Aproximadamente tres segundos (unos 100 pies) antes de girar
    B: Aproximadamente cinco segundos (unos 200 pies) antes de girar
    C: Justo al entrar en la intersección
    D: Solo después de haberse detenido en la intersección
  answer: A
  explanation: Si va a girar en una intersección, debe comenzar a usar las luces direccionales
    aproximadamente tres segundos (unos 100 pies) antes de girar.
- id: 67
  category: vehicle_information
  question: ¿Cuál es la señal de mano correcta para indicar un giro a la derecha?
  choices:
    A: Apuntar con la mano por la ventana del lado del conductor, en línea recta
    B: Doblar el codo y apuntar con la mano hacia arriba
    C: Apuntar con la mano hacia el suelo
    D: Mover la mano en un movimiento circular
  answer: B
  explanation: Si desea girar a la derecha usando una señal de mano, doble el codo
    y apunte con la mano hacia arriba.
- id: 68
  category: signs_and_signals
  question: ¿De qué color y forma son la mayoría de las señales de advertencia?
  choices:
    A: Octágonos rojos y blancos
    B: Rectángulos blancos y negros
    C: Amarillas con letras o símbolos negros, en su mayoría en forma de diamante
    D: Verdes con letras blancas, en su mayoría cuadradas
  answer: C
  explanation: Las señales de advertencia son amarillas con letras o símbolos negros.
    La mayoría tienen forma de diamante.
- id: 69
  category: signs_and_signals
  question: Una señal en forma de triángulo con marcas naranjas reflectantes indica
    un vehículo de movimiento lento. ¿Cuál es la velocidad máxima a la que probablemente
    viaja este vehículo?
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: Una señal de Vehículo de Movimiento Lento (Slow Moving Vehicle) es
    una señal en forma de triángulo con marcas naranjas reflectantes. Este vehículo
    podría viajar a 25 mph o menos.
- id: 70
  category: signs_and_signals
  question: ¿Cómo es una señal de Zona de No Adelantar (No Passing Zone)?
  choices:
    A: Un banderín amarillo con letras negras
    B: Un octágono rojo con letras blancas
    C: Un triángulo rojo y blanco apuntando hacia abajo
    D: Un rectángulo blanco con letras negras
  answer: A
  explanation: Una señal de Zona de No Adelantar es un banderín amarillo con letras
    negras. No se le permite adelantar a ningún vehículo en la zona de no adelantar.
- id: 71
  category: signs_and_signals
  question: Si un oficial de policía o un guardia de cruce escolar le da indicaciones
    que difieren de un semáforo o señal de tránsito, ¿qué debe hacer?
  choices:
    A: Seguir el semáforo o la señal de tránsito
    B: Seguir las indicaciones del oficial de policía o del guardia de cruce
    C: Detenerse y esperar a que el semáforo cambie a verde
    D: Tocar la bocina para alertarlos sobre la señal
  answer: B
  explanation: Debe seguir las indicaciones de la policía, los guardias de cruce escolar
    y otros trabajadores, incluso si son diferentes al semáforo o la señal de tránsito
    en la vía.
- id: 72
  category: defensive_driving
  question: ¿Cuándo es apropiado tocar la bocina de su vehículo con fuerza?
  choices:
    A: Para saludar a un amigo
    B: Para avisar a un conductor que va demasiado despacio
    C: Para advertir a alguien si está a punto de chocar con ellos o si ellos van
      a chocar con usted
    D: Para que los peatones sepan que se acerca a un cruce peatonal
  answer: C
  explanation: Puede tocar la bocina con fuerza para advertir a alguien si está a
    punto de chocar con ellos o si ellos van a chocar con usted.
- id: 73
  category: vehicle_information
  question: ¿Cuándo debe usar las luces de estacionamiento de su vehículo?
  choices:
    A: Siempre que conduzca con niebla densa
    B: Solo cuando esté estacionado y con el motor en marcha (ralentí)
    C: Al conducir entre el atardecer y el amanecer
    D: Al estacionarse en paralelo en una calle concurrida
  answer: B
  explanation: Según el manual, las luces de estacionamiento solo deben usarse cuando
    esté estacionado y con el motor en marcha (ralentí).
- id: 74
  category: penalties_and_points
  question: ¿Qué sucede con las multas de tránsito en las zonas de obras de construcción?
  choices:
    A: Se reducen a la mitad
    B: Siguen siendo las mismas
    C: Se duplican
    D: Se triplican
  answer: C
  explanation: Las multas de tránsito se duplican en las zonas de obras de construcción
    como sanción para animar a los conductores a reducir la velocidad y proteger a
    los trabajadores.
- id: 75
  category: safe_driving_rules
  question: ¿Cuándo se le permite usar su teléfono celular en una zona de construcción?
  choices:
    A: Al usar un dispositivo manos libres
    B: Solo si está reportando una emergencia
    C: Cuando el tráfico está completamente detenido
    D: Nunca se le permite usar un teléfono celular
  answer: B
  explanation: Según el manual, solo puede usar su teléfono celular en una zona de
    construcción si está reportando una emergencia.
- id: 76
  category: signs_and_signals
  question: ¿De qué color son las señales de destino que muestran direcciones hacia
    parques, áreas históricas o museos?
  choices:
    A: Azul
    B: Naranja
    C: Marrón
    D: Amarillo
  answer: C
  explanation: Las señales de destino de color marrón muestran información sobre lugares
    recreativos o hermosos, como parques, áreas históricas o museos.
- id: 77
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de los marcadores de millas en la autopista?
  choices:
    A: Mostrar el límite de velocidad actual
    B: Indicar las próximas áreas de descanso
    C: Mejorar los tiempos de respuesta de emergencias en incidentes en la autopista
    D: Advertir a los conductores sobre próximas zonas de construcción
  answer: C
  explanation: Los marcadores de millas le ayudan a ubicar dónde se encuentra en la
    vía, lo que mejora los tiempos de respuesta de emergencias en incidentes en la
    autopista.
- id: 78
  category: signs_and_signals
  question: ¿Qué tipo de señal de ruta parece un escudo con rojo en la parte superior
    y azul en la parte inferior?
  choices:
    A: Carretera del condado
    B: Ruta de EE. UU. (U.S. Route)
    C: Carretera estatal
    D: Autopista interestatal
  answer: D
  explanation: Una señal de autopista interestatal parece un escudo con rojo en la
    parte superior y azul en la parte inferior, y tiene letras blancas.
- id: 79
  category: safe_driving_rules
  question: ¿Qué NO debe hacer mientras cruza las vías del tren?
  choices:
    A: Mirar a ambos lados
    B: Cambiar de marcha
    C: Mantener una distancia segura
    D: Ceder el paso a los trenes
  answer: B
  explanation: El manual indica explícitamente que no debe cambiar de marcha mientras
    cruza las vías del tren.
- id: 80
  category: signs_and_signals
  question: ¿Qué significa un letrero de "Exento" (Exempt) en un cruce de ferrocarril?
  choices:
    A: Las vías ya no están en uso
    B: Ciertos vehículos no están obligados a detenerse antes de cruzar
    C: El cruce no tiene luces intermitentes
    D: Los trenes deben detenerse para dejar pasar a los vehículos
  answer: B
  explanation: Un letrero de "Exento" (Exempt) significa que ciertos vehículos no
    están obligados a detenerse antes de cruzar las vías del tren.
- id: 81
  category: defensive_driving
  question: Si su vehículo se queda atascado en las vías del tren, ¿cómo puede encontrar
    un número de teléfono para reportar la condición insegura?
  choices:
    A: Busque un letrero azul con letras blancas en el cruce
    B: Busque una señal de advertencia amarilla
    C: Revise la parte trasera de la señal en forma de cruz (crossbuck)
    D: Llame solo al 911
  answer: A
  explanation: Un letrero azul con letras blancas se encuentra en cada cruce de carretera
    y ferrocarril. Muestra un número de teléfono para reportar condiciones inseguras
    o emergencias.
- id: 82
  category: safe_driving_rules
  question: ¿Cómo debe proceder si un semáforo se queda sin energía o no funciona
    correctamente?
  choices:
    A: Ceda el paso al vehículo a su derecha
    B: Proceda como si el semáforo fuera una señal de ceda el paso
    C: Proceda como si el semáforo fuera una señal de alto (stop)
    D: Espere a que llegue un oficial de policía
  answer: C
  explanation: Si un semáforo se queda sin energía o no funciona correctamente, debe
    proceder como si el semáforo fuera una señal de alto (stop).
- id: 83
  category: safe_driving_rules
  question: ¿Bajo qué condición puede girar a la izquierda con una luz roja fija?
  choices:
    A: Nunca puede girar a la izquierda con luz roja
    B: Si está girando desde una calle de un solo sentido hacia otra calle de un solo
      sentido
    C: Si no hay tráfico en sentido contrario
    D: Si está girando desde una calle de doble sentido hacia una calle de un solo
      sentido
  answer: B
  explanation: Puede girar a la izquierda con luz roja si está girando desde una calle
    de un solo sentido hacia otra calle de un solo sentido, siempre y cuando se detenga
    primero y ceda el paso al tráfico.
- id: 84
  category: safe_driving_rules
  question: ¿Qué debe hacer si ya está en la intersección cuando se enciende la luz
    amarilla fija?
  choices:
    A: Detenerse inmediatamente en la intersección
    B: Retroceder para salir de la intersección
    C: Continuar cruzando la intersección
    D: Hacerse a un lado
  answer: C
  explanation: Si está en la intersección cuando se enciende la luz amarilla, no se
    detenga. Puede continuar cruzando la intersección.
- id: 85
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla intermitente en un semáforo?
  choices:
    A: Detenerse por completo y esperar la luz verde
    B: La luz está a punto de cambiar a roja
    C: Reducir la velocidad, verificar el tráfico transversal y proceder con precaución
    D: Ceder el paso al tráfico en sentido contrario y girar a la izquierda
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad,
    verificar el tráfico transversal y proceder con precaución.
- id: 86
  category: safe_driving_rules
  question: Al girar a la izquierda con una luz verde fija, ¿qué debe hacer?
  choices:
    A: Proceder inmediatamente porque tiene el derecho de paso
    B: Ceder el paso al tráfico en sentido contrario
    C: Esperar una flecha verde
    D: Detenerse y esperar a que la luz cambie a amarilla
  answer: B
  explanation: Si va a girar a la izquierda, una luz verde fija significa que puede
    girar, pero solo cuando sea seguro hacerlo. El tráfico en sentido contrario tiene
    el derecho de paso.
- id: 87
  category: signs_and_signals
  question: ¿Qué significa una luz verde fija cuando va a girar a la izquierda en
    una intersección?
  choices:
    A: Tiene el derecho de paso sobre el tráfico en sentido contrario.
    B: Puede girar, pero solo cuando sea seguro hacerlo, cediendo el paso al tráfico
      en sentido contrario.
    C: Debe esperar una flecha verde antes de girar.
    D: Puede girar sin ceder el paso a los peatones.
  answer: B
  explanation: Según el manual, si va a girar a la izquierda, una luz verde fija significa
    que puede girar, pero solo cuando sea seguro hacerlo. El tráfico en sentido contrario
    tiene el derecho de paso.
- id: 88
  category: safe_driving_rules
  question: ¿Cuándo se le permite cruzar una línea blanca continua que separa los
    carriles de tráfico que van en la misma dirección?
  choices:
    A: Siempre que necesite rebasar a un vehículo más lento.
    B: Solo cuando hay un peligro o va a girar en la siguiente cuadra.
    C: Cuando conduce en una zona escolar.
    D: Nunca se le permite cruzar una línea blanca continua.
  answer: B
  explanation: El manual indica que una línea blanca continua entre carriles significa
    que no puede cruzar. Solo puede cruzar si hay un peligro o si va a girar en la
    siguiente cuadra.
- id: 89
  category: safe_driving_rules
  question: Dos líneas amarillas continuas significan que ningún carril de circulación
    puede rebasar. ¿Cuál es una excepción a esta regla?
  choices:
    A: Rebasar a un vehículo que va a menos de la mitad del límite de velocidad, a
      menos que sea equipo agrícola.
    B: Rebasar a un autobús escolar con sus luces amarillas intermitentes encendidas.
    C: Rebasar a un tractor agrícola que va a menos de la mitad del límite de velocidad.
    D: Rebasar cuando llega tarde a una emergencia.
  answer: A
  explanation: Una excepción a la regla de las dos líneas amarillas continuas es que
    puede rebasar a un vehículo que va a menos de la mitad del límite de velocidad
    si es seguro hacerlo, excepto si se trata de equipo agrícola.
- id: 90
  category: safe_driving_rules
  question: ¿Dónde debe estar posicionado su vehículo al detenerse en un cruce peatonal?
  choices:
    A: Sus ruedas delanteras deben estar sobre la línea blanca continua.
    B: Sus ruedas delanteras deben detenerse justo antes de la línea blanca continua.
    C: Debe detenerse a la mitad del cruce peatonal.
    D: Debe detenerse al menos a 10 pies antes del cruce peatonal.
  answer: B
  explanation: El manual indica que sus ruedas delanteras deben detenerse justo antes
    de la línea blanca continua, y no debe detenerse sobre el cruce peatonal.
- id: 91
  category: safe_driving_rules
  question: ¿Para qué se utiliza el carril central compartido?
  choices:
    A: Para rebasar vehículos que se mueven lentamente.
    B: Para estacionarse durante emergencias.
    C: Para vehículos que giran a la izquierda o dan vuelta en U.
    D: Para uso exclusivo de autobuses y bicicletas.
  answer: C
  explanation: El carril central compartido es solo para vehículos que giran a la
    izquierda o dan vuelta en U. Los vehículos pueden usar este carril yendo en cualquier
    dirección.
- id: 92
  category: signs_and_signals
  question: ¿Qué indica una señal de 'X' amarilla sobre un carril reversible?
  choices:
    A: El carril está abierto para circular.
    B: El carril está cerrado a todo el tráfico.
    C: El carril es solo para dar vuelta a la izquierda.
    D: El carril está cambiando y debe moverse a un carril con una flecha verde.
  answer: D
  explanation: Una 'X' amarilla en un carril reversible significa que el carril está
    cambiando y debe moverse a un carril con una 'flecha' verde.
- id: 93
  category: safe_driving_rules
  question: ¿Cuándo se le permite legalmente circular por un carril reservado (como
    un carril para autobuses o bicicletas) si no conduce ese tipo de vehículo?
  choices:
    A: Cuando el tráfico en los carriles de uso general está muy congestionado.
    B: Si necesita cruzar el carril reservado para dar vuelta en la siguiente mitad
      de cuadra.
    C: Al conducir entre las 6 a.m. y las 9 a.m.
    D: Nunca se le permite circular por un carril reservado bajo ninguna circunstancia.
  answer: B
  explanation: Es ilegal circular por un carril reservado a menos que conduzca ese
    tipo de vehículo, pero puede circular por este carril si necesita cruzarlo para
    dar vuelta en la siguiente mitad de cuadra.
- id: 94
  category: safe_driving_rules
  question: ¿Qué tipo de vehículo NO tiene permitido circular en un carril flexible
    (flex lane)?
  choices:
    A: Automóviles de pasajeros.
    B: Motocicletas.
    C: Camiones grandes.
    D: Vehículos de uso compartido (carpool).
  answer: C
  explanation: El manual establece explícitamente que 'Ningún camión grande puede
    circular por el carril flexible'.
- id: 95
  category: safe_driving_rules
  question: ¿En qué dirección se mueve el tráfico en una rotonda (glorieta)?
  choices:
    A: En el sentido de las agujas del reloj.
    B: En sentido contrario a las agujas del reloj.
    C: En forma de ocho.
    D: Directo sin girar.
  answer: B
  explanation: Según el manual, las rotondas son una opción de flujo de tráfico más
    segura y eficiente donde el tráfico se mueve en sentido contrario a las agujas
    del reloj.
- id: 96
  category: sharing_the_road
  question: Al acercarse a una rotonda, ¿a cuál de los siguientes debe ceder el paso?
  choices:
    A: Al tráfico que se acerca por su derecha.
    B: Al tráfico a su izquierda que ya está dentro de la rotonda.
    C: A los vehículos que intentan entrar a la rotonda desde el lado opuesto.
    D: Solo a los vehículos de emergencia.
  answer: B
  explanation: Al llegar a la rotonda, debe ceder el paso a peatones, bicicletas,
    semirremolques y al tráfico a su izquierda que ya se encuentra dentro de la rotonda.
- id: 97
  category: safe_driving_rules
  question: ¿Qué debe hacer si un vehículo de emergencia con las sirenas encendidas
    entra a la rotonda mientras usted ya está conduciendo dentro de ella?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda para dejarlo pasar.
    B: Acelerar y salir de la rotonda lo más rápido posible.
    C: Salir de manera segura en la siguiente salida a la derecha y luego hacerse
      a un lado.
    D: Hacerse a un lado hacia el lado izquierdo de la isla central.
  answer: C
  explanation: Si ya está en la rotonda cuando entra un vehículo de emergencia, debe
    salir de manera segura en la siguiente salida a la derecha y luego hacerse a un
    lado. Debe evitar detenerse dentro de la rotonda.
- id: 98
  category: safe_driving_rules
  question: ¿Por qué debe avanzar completamente hasta la línea blanca de alto en una
    rampa de entrada a la autopista con semáforo medidor (metered ramp)?
  choices:
    A: Para permitir que los vehículos detrás de usted pasen.
    B: Para que sus llantas activen los sensores en el pavimento.
    C: Para tener una mejor vista del tráfico de la autopista.
    D: Para evitar recibir una multa por bloquear el cruce peatonal.
  answer: B
  explanation: En una rampa con semáforo medidor, debe avanzar completamente hasta
    la línea blanca de alto para que sus llantas activen los sensores en el pavimento.
- id: 99
  category: signs_and_signals
  question: ¿Qué indica una flecha verde fija?
  choices:
    A: Puede girar en la dirección de la flecha y no debería haber tráfico en sentido
      contrario ni cruzando.
    B: Puede girar, pero primero debe ceder el paso al tráfico en sentido contrario.
    C: El carril está cambiando y debe incorporarse al siguiente carril.
    D: Solo puede seguir derecho a través de la intersección.
  answer: A
  explanation: Una flecha verde fija significa que puede girar en la dirección de
    la flecha. No debería haber tráfico en sentido contrario ni cruzando mientras
    la flecha esté verde.
- id: 100
  category: signs_and_signals
  question: ¿Qué significa una marca en el pavimento con una línea amarilla discontinua
    y una continua?
  choices:
    A: Se permite rebasar al tráfico en ambos lados de la vía.
    B: Se prohíbe rebasar al tráfico en ambos lados de la vía.
    C: Puede rebasar si está del lado de la línea discontinua, pero no si está del
      lado de la línea continua.
    D: Puede rebasar si está del lado de la línea continua, pero no si está del lado
      de la línea discontinua.
  answer: C
  explanation: Las líneas amarillas discontinuas y continuas significan que puede
    rebasar si está del lado de la línea discontinua. Si está del lado de la línea
    continua, no puede rebasar.
- id: 101
  category: sharing_the_road
  question: Si está girando legalmente a través de un carril reservado y hay un ciclista
    en el carril, ¿qué debe hacer?
  choices:
    A: Acelerar para rebasar al ciclista antes de hacer su giro.
    B: Tocar la bocina para advertir al ciclista que se quite del camino.
    C: Colocarse detrás del ciclista y hacer su giro una vez que sea seguro hacerlo.
    D: Detenerse en el carril de uso general y esperar a que el ciclista gire primero.
  answer: C
  explanation: El manual indica que si hay un ciclista en el carril reservado, debe
    colocarse detrás de él y hacer su giro una vez que sea seguro hacerlo.
- id: 102
  category: safe_driving_rules
  question: ¿Qué debe hacer al acercarse a una rampa de entrada a la autopista con
    semáforo dosificador en rojo?
  choices:
    A: Detenerse a 10 pies detrás de la línea blanca.
    B: Avanzar completamente hasta la línea blanca de alto.
    C: Continuar sin detenerse si la autopista está despejada.
    D: Esperar a que el vehículo en el carril adyacente pase primero.
  answer: B
  explanation: El manual indica que debe avanzar completamente hasta la línea blanca
    de alto para que sus llantas activen los sensores en el pavimento.
- id: 103
  category: driver_responsibility
  question: Si es detenido por la policía durante una parada de tráfico, ¿dónde debe
    colocar las manos?
  choices:
    A: En su regazo.
    B: Fuera de la ventana.
    C: En la parte superior del volante a plena vista.
    D: En sus bolsillos o dentro de su chaqueta.
  answer: C
  explanation: Si es detenido por la policía, debe poner las manos en la parte superior
    del volante a plena vista y no hacer ningún movimiento brusco.
- id: 104
  category: defensive_driving
  question: ¿Durante qué momento del día están más activos los venados?
  choices:
    A: Desde el amanecer hasta el mediodía.
    B: Durante la parte más calurosa de la tarde.
    C: Desde el atardecer hasta el amanecer.
    D: Solo durante lluvia intensa o niebla.
  answer: C
  explanation: Según el manual, los venados están más activos en las horas desde el
    atardecer hasta el amanecer.
- id: 105
  category: driver_responsibility
  question: Si atropella a un venado con su vehículo, ¿cuáles son las reglas sobre
    quedarse con el animal?
  choices:
    A: Es ilegal que cualquier persona se quede con el venado.
    B: Solo la policía o el control de animales pueden llevarse al venado.
    C: Usted puede quedárselo, o el siguiente automovilista puede quedárselo si usted
      no lo quiere.
    D: Debe dejarlo a un lado de la carretera.
  answer: C
  explanation: 'El manual indica: ''Si atropella a un venado, puede quedárselo. Si
    no lo quiere, el siguiente automovilista puede quedárselo''. También debe llamar
    a la policía para que puedan emitir una etiqueta (permiso).'
- id: 106
  category: sharing_the_road
  question: ¿Qué se requiere de los vehículos que conducen en una fila de procesión
    fúnebre?
  choices:
    A: Deben tener sus luces intermitentes de emergencia encendidas en todo momento.
    B: Deben tener sus faros delanteros encendidos.
    C: Deben tocar la bocina al pasar por las intersecciones.
    D: Deben conducir al menos 15 mph por debajo del límite de velocidad publicado.
  answer: B
  explanation: El manual especifica que los vehículos en una fila de procesión fúnebre
    deben tener sus faros delanteros encendidos, y los demás conductores no deben
    interrumpir ni interferir con la fila.
- id: 107
  category: safe_driving_rules
  question: ¿Qué parte de la calzada es probable que se congele antes que el resto
    de la carretera en condiciones de clima severo?
  choices:
    A: Las intersecciones.
    B: Los puentes y pasos elevados.
    C: Los túneles.
    D: Los arcenes (hombros) de grava.
  answer: B
  explanation: Es importante recordar que en condiciones de clima severo, los puentes
    y pasos elevados se congelan antes que el resto de la calzada.
- id: 108
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a patinar sobre el agua (hydroplaning)?
  choices:
    A: Frenar bruscamente de inmediato.
    B: Girar el volante bruscamente hacia la derecha.
    C: Quitar suavemente el pie del acelerador y mantener el volante derecho.
    D: Acelerar para atravesar el agua estancada.
  answer: C
  explanation: Si se encuentra resbalando o patinando sobre el agua (hydroplaning),
    debe quitar suavemente el pie del acelerador, mantener el volante derecho y no
    intentar detenerse ni girar hasta que sus llantas vuelvan a agarrarse a la carretera.
- id: 109
  category: defensive_driving
  question: ¿Cómo debe girar el volante si su vehículo comienza a derrapar y pierde
    el control?
  choices:
    A: Girar el volante en la dirección opuesta al derrape.
    B: Girar el volante en la dirección a la que desea que vaya el vehículo.
    C: Mantener el volante perfectamente derecho.
    D: Girar rápidamente el volante de un lado a otro.
  answer: B
  explanation: Al derrapar, no debe pisar el freno, debe girar el volante en la dirección
    a la que desea que vaya el vehículo y girarlo hacia el otro lado tan pronto como
    el automóvil comience a enderezarse.
- id: 110
  category: sharing_the_road
  question: Al conducir en clima invernal, ¿cuánto espacio debe dejar a los quitanieves
    cuando sus luces están parpadeando?
  choices:
    A: Al menos 50 pies.
    B: Al menos 100 pies.
    C: Al menos 200 pies.
    D: Al menos 500 pies.
  answer: C
  explanation: El manual aconseja dejar a los quitanieves al menos 200 pies de espacio
    cuando sus luces parpadean en rojo, ámbar o verde.
- id: 111
  category: sharing_the_road
  question: ¿Por qué debe evitar tocar la bocina al encontrar ganado en la carretera
    o junto a ella?
  choices:
    A: Es ilegal usar la bocina en áreas rurales.
    B: Podría asustar al animal.
    C: Hará que el granjero detenga el equipo por completo.
    D: Viola las ordenanzas locales de ruido.
  answer: B
  explanation: Al encontrar ganado, debe ceder el paso y no tocar la bocina porque
    esto podría asustar al animal.
- id: 112
  category: defensive_driving
  question: ¿Cómo puede advertir a los vehículos detrás de usted si ve un vehículo
    detenido a un lado de la carretera?
  choices:
    A: Encender las luces altas.
    B: Tocar la bocina dos veces.
    C: Pisar ligeramente el pedal del freno tres o cuatro veces.
    D: Desviarse ligeramente hacia el siguiente carril.
  answer: C
  explanation: Si ve un vehículo a un lado de la carretera, advierta a los otros vehículos
    detrás de usted pisando ligeramente el pedal del freno tres o cuatro veces.
- id: 113
  category: vehicle_information
  question: ¿Cuál es la forma correcta de usar el Sistema de Frenos Antibloqueo (ABS)
    en una emergencia?
  choices:
    A: Bombear suavemente los frenos hasta detenerse.
    B: Aplicar presión firme y continua al pedal del freno.
    C: Tocar los frenos repetidamente para evitar que las ruedas se bloqueen.
    D: Presionar el pedal del freno ligeramente y girar bruscamente.
  answer: B
  explanation: La forma correcta de usar el ABS en una emergencia es aplicar presión
    firme y continua al pedal del freno hasta que el vehículo se haya detenido o el
    peligro haya pasado.
- id: 114
  category: driver_responsibility
  question: ¿A partir de qué cantidad en daños a la propiedad debe reportar un choque
    a la policía?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Debe reportar un choque a la policía si hay daños a la propiedad de
    $1,000 o más.
- id: 115
  category: driver_responsibility
  question: 'Se requiere que reporte un choque a la policía si causa daños a la propiedad
    del gobierno (como señales o barandillas) de al menos:'
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: Un choque debe ser reportado a la policía si hay daños a la propiedad
    del gobierno de $200 o más.
- id: 116
  category: safe_driving_rules
  question: ¿Qué función del vehículo NO debe usar al conducir en carreteras resbaladizas
    de invierno?
  choices:
    A: Faros delanteros
    B: Limpiaparabrisas
    C: Desempañador
    D: Control de crucero
  answer: D
  explanation: 'Los consejos de conducción en invierno del manual indican explícitamente:
    ''No use el control de crucero en carreteras resbaladizas''.'
- id: 117
  category: defensive_driving
  question: Si experimenta un reventón de neumático mientras conduce, ¿qué debe hacer
    primero?
  choices:
    A: Frenar bruscamente de inmediato
    B: Cambiar el auto a punto muerto (neutral)
    C: Sostener el volante para mantener su vehículo en línea recta
    D: Bombear el pedal del freno varias veces
  answer: C
  explanation: Si tiene un reventón de neumático, debe sostener el volante para mantener
    su vehículo en línea recta, levantar el pie del acelerador y reducir la velocidad
    poco a poco.
- id: 118
  category: defensive_driving
  question: ¿Cuál es la respuesta correcta si el pedal del acelerador se atasca mientras
    conduce?
  choices:
    A: Mantener los ojos en la carretera y cambiar el auto a punto muerto (neutral)
    B: Apagar el motor inmediatamente mientras aún está en el tráfico
    C: Tirar del freno de estacionamiento lo más fuerte que pueda
    D: Bombear el pedal del acelerador repetidamente hasta que se desatasque
  answer: A
  explanation: Si el pedal del acelerador se atasca, mantenga los ojos en la carretera,
    cambie el auto a punto muerto (neutral), sálgase a un lado de la carretera cuando
    sea seguro y luego apague el motor.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuál es la concentración legal de alcohol permitida para conductores
    menores de 21 años?
  choices:
    A: 0.08%
    B: 0.04%
    C: 0.02%
    D: 0.00%
  answer: D
  explanation: La concentración legal de alcohol permitida para conductores menores
    de 21 años es del 0.00%. Esto significa que no puede tener nada de alcohol en
    su sistema mientras conduce un vehículo.
- id: 120
  category: penalties_and_points
  question: Según la Ley de Consentimiento Implícito, ¿qué sucede si se niega a someterse
    a una prueba de concentración de alcohol prohibida (PAC)?
  choices:
    A: Se le dará una advertencia y se le permitirá conducir a casa
    B: Perderá sus privilegios de conducir por al menos un año
    C: Recibirá 6 puntos de demérito en su licencia
    D: Se le requerirá tomar un examen de manejo escrito
  answer: B
  explanation: Si se niega a una prueba PAC, el oficial debe arrestarlo por violación
    de la Ley de Consentimiento Implícito, y perderá sus privilegios de conducir por
    al menos un año.
- id: 121
  category: safe_driving_rules
  question: ¿Cuándo se les permite a los titulares de un permiso de aprendizaje y
    de una licencia probatoria usar un teléfono celular mientras conducen?
  choices:
    A: Al usar un dispositivo manos libres
    B: Solo para reportar una emergencia
    C: Al estar detenidos en un semáforo en rojo
    D: Al leer las indicaciones del GPS
  answer: B
  explanation: Los titulares de un permiso de aprendizaje y de una licencia probatoria
    solo pueden usar un teléfono celular para reportar una emergencia.
- id: 122
  category: sharing_the_road
  question: ¿Qué debe hacer si se acerca a una patrulla de policía detenida a un lado
    de la carretera con sus luces y sirenas encendidas?
  choices:
    A: Detenerse inmediatamente en su carril y esperar a que se vayan
    B: Tocar la bocina para avisarles que está pasando
    C: Cambiarse al carril que no esté más cerca del vehículo detenido o reducir la
      velocidad
    D: Acelerar para pasar la escena rápidamente
  answer: C
  explanation: Si ve una patrulla de policía detenida a un lado de la carretera con
    sus luces y sirenas encendidas, cámbiese de carril o reduzca la velocidad, es
    la ley. Si se acerca a un vehículo de emergencia con sus luces intermitentes,
    asegúrese de moverse al carril que no esté más cerca del vehículo detenido.
- id: 123
  category: sharing_the_road
  question: Cuando un autobús escolar está detenido con sus luces rojas intermitentes,
    ¿a qué distancia debe detenerse?
  choices:
    A: Al menos a 10 pies
    B: Al menos a 15 pies
    C: Al menos a 20 pies
    D: Al menos a 50 pies
  answer: C
  explanation: Cuando un autobús escolar está detenido con sus luces rojas intermitentes,
    debe detenerse al menos a 20 pies de distancia de él.
- id: 124
  category: sharing_the_road
  question: ¿Bajo qué condición NO está obligado a detenerse ante un autobús escolar
    con luces rojas intermitentes?
  choices:
    A: Cuando viaja en la misma dirección que el autobús en una carretera de varios
      carriles
    B: Cuando se encuentra en una carretera dividida y en el lado opuesto de la barrera
      donde está el autobús
    C: Cuando llega tarde a una emergencia
    D: Cuando no hay niños visibles fuera del autobús
  answer: B
  explanation: Si se encuentra en una carretera/vía dividida y no en el mismo lado
    que el autobús escolar, no necesita detenerse. Una carretera dividida tiene una
    barrera entre los carriles que van en direcciones opuestas.
- id: 125
  category: sharing_the_road
  question: ¿Cuánto espacio debe darle a un ciclista al rebasarlo?
  choices:
    A: Al menos un pie
    B: Al menos dos pies
    C: Al menos tres pies
    D: Al menos cinco pies
  answer: C
  explanation: Dele a los ciclistas al menos tres pies de espacio cuando los rebase.
- id: 126
  category: sharing_the_road
  question: ¿Qué es una "Zona Ciega" (No-Zone) al compartir la carretera con camiones
    grandes?
  choices:
    A: Un carril designado donde no se permite que conduzcan los camiones
    B: Un área de aproximadamente 200 pies detrás y 20 pies delante de los camiones
      grandes donde no pueden verlo
    C: Una zona cerca de las escuelas donde los vehículos comerciales deben reducir
      la velocidad
    D: El área en una carretera dividida donde está prohibido rebasar
  answer: B
  explanation: Las "Zonas Ciegas" (No-Zones) son áreas donde los vehículos grandes
    no pueden verlo. Esta área es de aproximadamente 200 pies detrás y 20 pies delante
    de los camiones grandes.
- id: 127
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito en un período de 12 meses causarán que su
    privilegio de conducir sea suspendido o revocado?
  choices:
    A: 6 o más puntos
    B: 8 o más puntos
    C: 10 o más puntos
    D: 12 o más puntos
  answer: D
  explanation: No podrá conducir si acumula 12 o más puntos de demérito en cualquier
    período de 12 meses. Su privilegio de conducir será suspendido o revocado.
- id: 128
  category: penalties_and_points
  question: Si tiene una licencia probatoria, ¿qué sucede con sus puntos de demérito
    en su segunda condena de tránsito?
  choices:
    A: Sus puntos se reducen a la mitad
    B: Sus puntos se duplican
    C: Sus puntos se borran si toma una clase de seguridad
    D: Sus puntos siguen siendo los mismos pero sus multas se duplican
  answer: B
  explanation: Si tiene una licencia probatoria, una tarjeta de identificación o ningún
    tipo de licencia, sus puntos se duplicarán. Estos puntos se duplican en la segunda
    condena y en cualquier otra posterior.
- id: 129
  category: penalties_and_points
  question: Un infractor de tránsito habitual es alguien que es condenado por cuatro
    o más infracciones de tránsito mayores o 12 o más infracciones menores dentro
    de ¿qué período de tiempo?
  choices:
    A: Un año
    B: Tres años
    C: Cinco años
    D: Diez años
  answer: C
  explanation: Un infractor habitual es alguien que es condenado por cuatro o más
    infracciones de tránsito mayores o 12 o más infracciones menores en un período
    de cinco años.
- id: 130
  category: license_system
  question: Una licencia ocupacional le permite conducir hasta ¿cuántas horas por
    semana para el trabajo, la escuela y el mantenimiento del hogar?
  choices:
    A: 20 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: D
  explanation: Una licencia ocupacional le permite conducir hasta 12 horas al día
    y hasta 60 horas a la semana hacia y desde el trabajo, la escuela y los lugares
    que necesita visitar para el mantenimiento de su hogar.
- id: 131
  category: safe_driving_rules
  question: Según la ley de Wisconsin, ¿quién está obligado a usar el cinturón de
    seguridad en un vehículo?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: El conductor y todos los pasajeros de cualquier edad
    D: Solo los pasajeros en vehículos sin bolsas de aire
  answer: C
  explanation: La ley de Wisconsin exige que usted y sus pasajeros usen cinturones
    de seguridad a cualquier edad.
- id: 132
  category: vehicle_information
  question: Si su vehículo está equipado con bolsas de aire, ¿aún necesita usar el
    cinturón de seguridad?
  choices:
    A: No, las bolsas de aire reemplazan la necesidad de usar cinturones de seguridad.
    B: Sí, aún necesita usar el cinturón de seguridad incluso si su vehículo tiene
      bolsas de aire.
    C: Solo si conduce por la autopista.
    D: Solo los pasajeros del asiento trasero necesitan usarlos.
  answer: B
  explanation: 'El manual indica: "Aún necesita usar el cinturón de seguridad incluso
    si su vehículo tiene bolsas de aire". Los cinturones de seguridad ayudan a mantenerlo
    en posición para controlar el vehículo y evitar lesiones.'
- id: 133
  category: safe_driving_rules
  question: ¿Cómo debe colocarse el cinturón de regazo (la parte inferior del cinturón
    de seguridad)?
  choices:
    A: Holgadamente sobre sus muslos
    B: Ajustado sobre su estómago
    C: Ajustado sobre los huesos de la cadera justo debajo de su estómago
    D: En la parte alta de su cintura
  answer: C
  explanation: El cinturón de regazo debe quedar ajustado sobre los huesos de la cadera
    justo debajo de su estómago.
- id: 134
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de usar el cinturón de hombro?
  choices:
    A: Metido debajo del brazo para mayor comodidad
    B: Cruzando el pecho con suficiente espacio para poner su puño entre el cinturón
      y su pecho
    C: Colgando holgadamente sobre su hombro
    D: Detrás de su espalda si le roza el cuello
  answer: B
  explanation: El cinturón de hombro debe usarse cruzando el pecho. Ajuste su cinturón
    de manera que pueda poner su puño entre el cinturón y su pecho. Nunca pase el
    cinturón de hombro por debajo de su brazo.
- id: 135
  category: safe_driving_rules
  question: Por lo general, ¿a qué edad puede un niño pasar de un asiento de seguridad
    infantil a un asiento elevado (booster seat)?
  choices:
    A: A los dos años
    B: A los cuatro años
    C: A los seis años
    D: A los ocho años
  answer: B
  explanation: Por lo general, los niños deben estar en un asiento de seguridad infantil
    hasta que cumplen cuatro años y en un asiento elevado (booster seat) hasta los
    ocho años.
- id: 136
  category: safe_driving_rules
  question: Por lo general, ¿hasta qué edad deben permanecer los niños en un asiento
    elevado (booster seat)?
  choices:
    A: Cuatro años
    B: Seis años
    C: Ocho años
    D: Diez años
  answer: C
  explanation: Por lo general, los niños deben estar en un asiento de seguridad infantil
    hasta que cumplen cuatro años y en un asiento elevado (booster seat) hasta los
    ocho años.
- id: 137
  category: driver_responsibility
  question: ¿Qué tipo de seguro de automóvil se requiere para conducir en Wisconsin?
  choices:
    A: Seguro a todo riesgo (cobertura amplia)
    B: Seguro de colisión
    C: Seguro de automóvil de responsabilidad civil válido
    D: Solo cobertura de automovilista sin seguro
  answer: C
  explanation: Debe tener un seguro de automóvil de responsabilidad civil válido para
    conducir en Wisconsin y presentar un comprobante del mismo si un oficial de policía
    lo solicita.
- id: 138
  category: driver_responsibility
  question: Si conduce el automóvil de otra persona, ¿de quién es la responsabilidad
    de asegurarse de que el vehículo tenga seguro?
  choices:
    A: Responsabilidad del propietario del vehículo
    B: Su responsabilidad como conductor
    C: Responsabilidad de la compañía de seguros
    D: Responsabilidad del DMV
  answer: B
  explanation: Si conduce el automóvil de otra persona, es su responsabilidad asegurarse
    de que tenga seguro.
- id: 139
  category: license_system
  question: Si decide informar sobre una discapacidad invisible al DMV, ¿quién tendrá
    acceso a esta información?
  choices:
    A: Solo su compañía de seguros
    B: El público en general
    C: Oficiales de la ley y empleados del WisDOT
    D: Solo profesionales médicos
  answer: C
  explanation: La declaración que haga estará disponible para los oficiales de la
    ley y los empleados del Departamento de Transporte de Wisconsin (WisDOT).
- id: 140
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de edad y ciudadanía para iniciar el
    proceso de petición de una tarjeta de identificación gratuita para votar en Wisconsin?
  choices:
    A: 16 años de edad y ciudadano estadounidense
    B: 17 años de edad y ciudadano estadounidense
    C: 18 años de edad y ciudadano estadounidense
    D: 18 años de edad y residente permanente
  answer: B
  explanation: Debe tener al menos 17 años de edad y ser ciudadano estadounidense
    para iniciar el proceso de petición de una identificación gratuita para votar.
- id: 141
  category: driver_responsibility
  question: Si tiene 18 años o más y se registra para ser donante de órganos y tejidos,
    ¿quién puede anular su decisión?
  choices:
    A: Sus padres
    B: Su cónyuge
    C: Su médico
    D: Nadie puede anular su decisión
  answer: D
  explanation: Si tiene 18 años o más, su decisión de ser donante de órganos y tejidos
    no puede ser anulada por su familia ni por ninguna otra persona.
- id: 142
  category: vehicle_information
  question: ¿Cómo afecta a su vehículo la baja presión de aire en las llantas?
  choices:
    A: Aumenta el rendimiento del combustible.
    B: Disminuye el rendimiento del combustible.
    C: Mejora la distancia de frenado.
    D: Evita el desgaste del motor.
  answer: B
  explanation: La baja presión de aire en las llantas disminuye el rendimiento del
    combustible.
- id: 143
  category: defensive_driving
  question: ¿Qué hábito de manejo ayuda a ahorrar combustible y proteger sus frenos?
  choices:
    A: Manejar parando y arrancando en tráfico pesado
    B: Reducir la velocidad poco a poco
    C: Frenar bruscamente en las intersecciones
    D: Manejar con baja presión en las llantas
  answer: B
  explanation: Cuando reduce la velocidad poco a poco, esto ayuda a ahorrar combustible
    y proteger sus frenos.
- id: 144
  category: license_system
  question: ¿Cuál es el propósito del Programa de Subvenciones para la Educación Vial
    (Driver Education Grant Program)?
  choices:
    A: Pagar la matrícula universitaria de los conductores seguros
    B: Proporcionar vehículos gratuitos a familias de bajos ingresos
    C: Pagar la capacitación vial en el aula y/o detrás del volante para adolescentes
      que cumplen con los requisitos de ingresos
    D: Reembolsar a los conductores las primas de seguros de automóviles
  answer: C
  explanation: El Programa de Subvenciones para la Educación Vial permite que el estado
    pague la capacitación vial en el aula y/o detrás del volante de los adolescentes
    que cumplen con los requisitos de ingresos.
- id: 145
  category: alcohol_drugs_health
  question: ¿Qué debe hacer si tiene un problema de salud que podría afectar su capacidad
    para manejar?
  choices:
    A: Dejar de manejar por completo sin notificar a nadie.
    B: Reportar la condición de salud al DMV.
    C: Informar solo a su compañía de seguros.
    D: Esperar hasta que su licencia expire para mencionarlo.
  answer: B
  explanation: Muchos problemas de salud pueden afectar su capacidad para manejar.
    Debe reportar al DMV las condiciones de salud que podrían afectar su manejo.
- id: 146
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en las zonas periféricas de ciudades
    y pueblos donde no hay un límite de velocidad publicado?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Según la prueba de práctica del manual, el límite de velocidad máximo
    en las zonas periféricas de ciudades y pueblos sin un límite de velocidad publicado
    es de 35 mph.
- id: 147
  category: driver_responsibility
  question: Si se ve involucrado en un choque automovilístico grave, ¿cuál de las
    siguientes es una acción obligatoria?
  choices:
    A: Abandonar la escena inmediatamente
    B: Esperar a que el otro conductor pida ayuda
    C: Determinar si alguien está herido
    D: Mover los vehículos antes de revisar a los pasajeros
  answer: C
  explanation: El manual establece que si se ve involucrado en un choque automovilístico
    grave, debe detenerse, determinar si alguien está herido y llamar al 911.
- id: 148
  category: driver_responsibility
  question: ¿A qué número debe llamar si se ve involucrado en un choque automovilístico
    grave?
  choices:
    A: '311'
    B: '411'
    C: '511'
    D: '911'
  answer: D
  explanation: Si se ve involucrado en un choque automovilístico grave, el manual
    le indica que debe detenerse, verificar si hay heridos y llamar al 911.
- id: 149
  category: safe_driving_rules
  question: Al dar vuelta a la izquierda en una intersección, ¿a quién debe ceder
    el paso?
  choices:
    A: Solo a los vehículos que rebasan
    B: A los vehículos que se aproximan en sentido contrario y van en línea recta
      o dan vuelta a la derecha
    C: A los vehículos que dan vuelta a la izquierda desde la dirección opuesta
    D: A nadie en particular
  answer: B
  explanation: Los conductores que dan vuelta a la izquierda deben ceder el paso a
    los vehículos que se aproximan en sentido contrario y van en línea recta o dan
    vuelta a la derecha.
- id: 150
  category: safe_driving_rules
  question: ¿Qué tipo de luces delanteras debe usar al manejar en la niebla?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo las luces de estacionamiento
    D: Luces de emergencia
  answer: B
  explanation: Al manejar en la niebla, lluvia fuerte o nieve, debe usar las luces
    bajas.
- id: 151
  category: safe_driving_rules
  question: Si conduce bajo lluvia intensa o nieve, ¿qué luces es apropiado usar?
  choices:
    A: Luces bajas
    B: Luces altas
    C: Solo luces de conducción
    D: Luces interiores del techo
  answer: A
  explanation: Debe usar las luces bajas al conducir con niebla, lluvia intensa o
    nieve.
- id: 152
  category: signs_and_signals
  question: ¿Cómo debe reaccionar al acercarse a una intersección con una luz amarilla
    intermitente?
  choices:
    A: Esperar a que la luz cambie a verde
    B: Detenerse por completo antes de cruzar
    C: Acelerar para despejar la intersección rápidamente
    D: Reducir la velocidad y continuar con precaución
  answer: D
  explanation: Al acercarse a una intersección con una luz amarilla intermitente,
    debe reducir la velocidad y continuar con precaución.
- id: 153
  category: signs_and_signals
  question: ¿Qué indica una sola línea amarilla discontinua que separa el tráfico?
  choices:
    A: Los carriles van en la misma dirección
    B: No puede rebasar bajo ninguna circunstancia
    C: Puede rebasar si es seguro hacerlo y los carriles van en direcciones opuestas
    D: Debe detenerse antes de cruzar la línea
  answer: C
  explanation: Una sola línea amarilla discontinua significa que los carriles van
    en direcciones opuestas y puede rebasar si es seguro hacerlo.
- id: 154
  category: signs_and_signals
  question: ¿Qué color de línea separa el tráfico que se mueve en direcciones opuestas?
  choices:
    A: Blanco
    B: Amarillo
    C: Rojo
    D: Azul
  answer: B
  explanation: Una sola línea amarilla discontinua separa el tráfico donde los carriles
    van en direcciones opuestas.
- id: 155
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado para incorporarse a una autopista interestatal?
  choices:
    A: Detenerse siempre antes de entrar a la autopista
    B: Seleccionar un espacio seguro e incorporarse al carril de tráfico
    C: Incorporarse cruzando dos carriles a la vez y acelerar
    D: Forzar su entrada al tráfico para que otros conductores le cedan el paso
  answer: B
  explanation: Al incorporarse a una autopista interestatal, debe seleccionar un espacio
    seguro e incorporarse al carril de tráfico.
- id: 156
  category: safe_driving_rules
  question: ¿Bajo qué condiciones es aceptable conducir más rápido que el límite de
    velocidad publicado?
  choices:
    A: Si no ve ningún otro vehículo en su carril
    B: Siempre que haya condiciones seguras para hacerlo
    C: Al rebasar a otro vehículo
    D: Nunca
  answer: D
  explanation: Según la prueba de práctica del manual, nunca está permitido conducir
    más rápido que el límite de velocidad publicado.
- id: 157
  category: defensive_driving
  question: ¿A qué distancia hacia adelante debe mirar en la carretera al conducir?
  choices:
    A: De 1 a 2 cuadras
    B: De 200 a 250 yardas
    C: De 10 a 15 segundos
    D: De 5 a 8 segundos
  answer: C
  explanation: Al conducir, debe mirar hacia adelante en la carretera a una distancia
    de 10 a 15 segundos.
- id: 158
  category: sharing_the_road
  question: Si desea rebasar a una bicicleta pero se acerca un vehículo en sentido
    contrario, ¿qué debe hacer?
  choices:
    A: Acelerar para rebasar a la bicicleta antes de que se acerque el automóvil
    B: Tocar la bocina a la bicicleta para que se salga de la carretera
    C: Reducir la velocidad y dejar que pase el automóvil, luego rebasar a la bicicleta
    D: Hacerse a un lado de la carretera y detenerse por completo
  answer: C
  explanation: Si desea rebasar a una bicicleta y hay un vehículo en sentido contrario,
    debe reducir la velocidad y dejar que pase el automóvil, luego rebasar a la bicicleta.
- id: 159
  category: safe_driving_rules
  question: ¿Cuál es una práctica de seguridad recomendada al conducir de noche?
  choices:
    A: Usar siempre las luces altas
    B: Mirar directamente a los faros de los vehículos que vienen en sentido contrario
    C: Conducir más cerca del vehículo de adelante para ver sus luces traseras
    D: Aumentar su distancia de seguimiento
  answer: D
  explanation: Al conducir de noche, debe aumentar su distancia de seguimiento.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y continuar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) octagonal roja significa que debe detenerse
    por completo en la línea de alto, el cruce peatonal o antes de ingresar a la intersección.
    Verifique si hay tráfico y peatones antes de continuar.
  id: 160
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 161
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de DIRECCIÓN PROHIBIDA (DO NOT ENTER) significa
    que no debe entrar en la carretera o rampa donde está colocada esta señal. Por
    lo general, se ve en las rampas de salida de las autopistas o en calles de un
    solo sentido donde entrar lo pondría en la trayectoria del tráfico en sentido
    contrario.
  id: 162
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Dar una vuelta en U
    B: Continuar conduciendo con cuidado
    C: 'Detenerse y retroceder o dar la vuelta: va en sentido contrario'
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que viaja en contra del tráfico en una carretera de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 163
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de autopista a la izquierda
  answer: B
  explanation: 'Una señal en blanco y negro de UN SOLO SENTIDO (ONE WAY) con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 164
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Vueltas en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de vuelta en U tachada
    significa que las vueltas en U están prohibidas en este lugar.
  id: 165
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Dar una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 166
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite dar vuelta en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite adelantar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 167
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No adelante a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO ADELANTAR
    (NO PASSING ZONE) significa que no se le permite adelantar a otros vehículos en
    esta área. Marca el comienzo de una zona donde se prohíbe adelantar.
  id: 168
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye a hacer esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar solo a la derecha
    C: Mantenerse a la derecha de un separador o una obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 169
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 170
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la calle en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la calle en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 171
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminar cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte sobre un cruce de peatones más adelante. Esté preparado para detenerse
    ante los peatones que cruzan la calle.
  id: 172
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de color amarillo verdoso fluorescente en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 173
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no adelantar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 174
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 175
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La calle termina más adelante
    B: Se requiere girar a la derecha
    C: Una curva hacia la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    sobre una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    a la curva.
  id: 176
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar solo a la derecha
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Necesita reducir su velocidad de manera más
    significativa antes de este giro.
  id: 177
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    se curve primero hacia un lado y luego hacia el otro.
  id: 178
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a las condiciones cambiantes
    de la carretera.
  id: 179
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 180
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: Fin de carril
    D: Fin de autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción en el ancho de la vía y ajuste su posición
    en el carril.
  id: 181
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: Fin de la carretera
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en sentido
    contrario. Manténgase a la derecha.
  id: 182
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Termina la autopista dividida y se reanuda el tráfico de doble sentido
    C: Área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida termina. El tráfico en
    sentido contrario ya no estará separado por una mediana. Prepárese para el tráfico
    de doble sentido.
  id: 183
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Desvío de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de sentido único o de una autopista dividida
    y se encontrará con vehículos que viajan en dirección opuesta.
  id: 184
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera helada
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 185
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 186
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (Stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Prepárese para detenerse
    si la luz está roja o amarilla. Esta señal a menudo se coloca donde el semáforo
    puede no ser visible desde la distancia.
  id: 187
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (Yield)
    B: Un semáforo
    C: Una señal de alto (Stop) donde debe detenerse
    D: Un reductor de velocidad (badén)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (Stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 188
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce o una intersección de 4 vías más
    adelante. Esté atento al tráfico que ingresa desde las carreteras laterales.
  id: 189
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la autopista desde la carretera lateral.
  id: 190
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se unen
    B: Un carril termina
    C: Se añade un carril nuevo — no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin necesidad de incorporarse. El tráfico que entra por la rampa
    tiene su propio carril nuevo.
  id: 191
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Parar o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 192
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: A cualquier persona por menos de 15 minutos
    B: Solo a personas de la tercera edad
    C: Solo a vehículos que muestren un cartel o placa de discapacidad válido
    D: A cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de una silla de ruedas indica estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de matrícula de estacionamiento para discapacitados válido pueden
    estacionar en estos espacios. Las infracciones conllevan multas severas.
  id: 193
