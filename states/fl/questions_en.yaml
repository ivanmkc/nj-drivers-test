metadata:
  source: 2025 Florida Driver's Handbook (flhsmv.gov)
  total_questions: 361
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: penalties_and_points
  question: What is the maximum penalty for using a false name or concealing a material
    fact in an application for a Florida driver license or ID card?
  choices:
    A: 1 year in prison and a $1,000 fine
    B: Up to five years in prison, a $5,000 fine, and suspension of driving privilege
      for at least one year
    C: 60 days in jail and a $500 fine
    D: Permanent revocation of driving privileges and a $10,000 fine
  answer: B
  explanation: According to the manual, using fraud in an application for a driver
    license or ID card can result in up to five years in prison, a $5,000 fine, and
    suspension of any existing driving privilege for at least one year.
- id: 2
  category: penalties_and_points
  question: What is the penalty for permitting or authorizing an unlicensed person
    to drive a motor vehicle?
  choices:
    A: A 30-day jail sentence and a $200 fine
    B: A 60-day jail sentence and a $500 fine
    C: A 90-day jail sentence and a $1,000 fine
    D: A 1-year jail sentence and a $5,000 fine
  answer: B
  explanation: The manual states that it is illegal to permit or authorize an unlicensed
    person to drive a motor vehicle, and doing so can result in a 60-day jail sentence
    and a $500 fine.
- id: 3
  category: penalties_and_points
  question: If you permit an unlicensed person to drive your vehicle and they are
    involved in a crash resulting in bodily injury or death, what may happen to your
    driving privileges?
  choices:
    A: Your license may be suspended for one year.
    B: Your vehicle will be permanently confiscated.
    C: You will face a mandatory 5-year prison sentence.
    D: You must retake the driving skills test.
  answer: A
  explanation: If the vehicle is involved in a crash resulting in bodily injury or
    death, the person who permitted the unlicensed person to drive may have their
    license suspended for one year.
- id: 4
  category: license_system
  question: According to Florida's Public Records Law, which of the following pieces
    of information collected during the licensing process is exempt from public disclosure
    but may be given to law enforcement agencies?
  choices:
    A: Social security number
    B: Medical information
    C: Driver license number
    D: Emergency contact information
  answer: C
  explanation: The manual specifies that personal information, including name, address,
    and driver license number, is exempt from public disclosure but may be given to
    law enforcement agencies.
- id: 5
  category: license_system
  question: How can drivers under 18 years of age prevent a truancy-related driver
    license suspension?
  choices:
    A: By paying a $100 fine
    B: By submitting proof of an Individual Education Plan (IEP)
    C: By completing a defensive driving course
    D: By obtaining a hardship license
  answer: B
  explanation: Under HB 0001, drivers under 18 can submit proof of their Individual
    Education Plan (IEP) as an alternative to traditional school attendance to prevent
    a truancy-related driver license suspension.
- id: 6
  category: safe_driving_rules
  question: The expanded Move Over Law (HB 425) requires drivers to move over for
    which of the following?
  choices:
    A: Any vehicle parked in a residential driveway
    B: A disabled motor vehicle that is stopped and displaying warning lights or hazard
      lights
    C: A moving delivery truck
    D: A school bus with its stop sign retracted
  answer: B
  explanation: HB 425 expands the Move Over Law to include moving over for a disabled
    motor vehicle that is stopped and displaying warning lights or hazard lights.
- id: 7
  category: penalties_and_points
  question: What is the fine for the registered owner of a motor vehicle found violating
    a school zone speed limit enforced by a camera-equipped radar detection device?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: B
  explanation: According to HB 657, the registered owner of a motor vehicle found
    in violation of school zone speed limits enforced by camera-equipped radar is
    subject to a $100 fine.
- id: 8
  category: penalties_and_points
  question: What is the civil penalty for passing a school bus while it displays a
    stop signal, as captured by an infraction detection system?
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: B
  explanation: SB 766 states that the registered owner of a motor vehicle found in
    violation is subject to a civil penalty of $200 for passing a school bus while
    it displays a stop signal.
- id: 9
  category: signs_and_signals
  question: School buses equipped with infraction detection systems to capture drivers
    illegally passing them will display which of the following phrases?
  choices:
    A: SPEED CHECKED BY RADAR
    B: CAMERA ENFORCED
    C: YIELD TO BUS
    D: DO NOT TAILGATE
  answer: B
  explanation: Buses equipped with the infraction detection system will have the words
    'CAMERA ENFORCED' along with a graphic symbol of a camera and warnings about flashing
    red lights.
- id: 10
  category: license_system
  question: 'Under HB 1087, an obligor may avoid suspension of their driver license
    by entering a payment agreement with a deferred start date if they are participating
    in good faith in:'
  choices:
    A: Job training
    B: A substance abuse program
    C: Traffic school
    D: Community service
  answer: A
  explanation: HB 1087 expands the reasons an obligor may enter into a payment agreement
    with a deferred start date to avoid license suspension to include when the obligor
    is participating in good faith in job training.
- id: 11
  category: license_system
  question: Beginning October 1, 2023, what must a person under 18 years of age possess
    to legally operate a golf cart on public roads or streets?
  choices:
    A: A valid school ID card
    B: A valid learner's driver license or valid driver license
    C: A bicycle safety certificate
    D: Written parental consent
  answer: B
  explanation: HB 949 requires that a person operating a golf cart on public roads
    who is under 18 years of age must possess a valid learner's driver license or
    valid driver license.
- id: 12
  category: penalties_and_points
  question: 'Knowingly and willfully transporting an individual into Florida who has
    entered the United States unlawfully and has not been inspected by the Federal
    Government is classified as a:'
  choices:
    A: First-degree misdemeanor
    B: Second-degree misdemeanor
    C: Third-degree felony
    D: Civil traffic infraction
  answer: C
  explanation: SB 1718 amends the human smuggling crime to provide that a person commits
    a third-degree felony when they knowingly and willfully transport such an individual
    into the state.
- id: 13
  category: penalties_and_points
  question: 'The offense of human smuggling into Florida is enhanced to a second-degree
    felony if the person transports:'
  choices:
    A: A minor into the state
    B: More than two adults in a single vehicle
    C: Someone across county lines
    D: Someone during nighttime hours
  answer: A
  explanation: SB 1718 enhances the offense to a second-degree felony if a person
    transports a minor into the state in violation of this section.
- id: 14
  category: driver_responsibility
  question: 'According to the handbook''s disclaimer, the Official Florida Driver
    License Handbook is:'
  choices:
    A: A legally binding document intended for use in court
    B: Not a legal authority and not intended for use in court
    C: Updated daily to reflect all legislative changes
    D: A complete and unabridged copy of Florida traffic laws
  answer: B
  explanation: 'The disclaimer explicitly states: ''The handbook is not a legal authority
    and is not intended for use in court.'''
- id: 15
  category: license_system
  question: According to the Florida driver's manual, which of the following is considered
    an 'Optional Designation' on a driver license or ID card?
  choices:
    A: Career Offender
    B: Selective Service
    C: Veteran Designation
    D: Sexual Predator
  answer: C
  explanation: The manual lists 'Florida Organ & Tissue Donor' and 'Veteran Designation'
    under Optional Designations, whereas Career Offenders and Selective Service are
    listed under Required Designations.
- id: 16
  category: license_system
  question: Which of the following is listed as a 'Required Designation' for a Florida
    ID or driver license?
  choices:
    A: Voluntary Contributions
    B: Selective Service
    C: Veteran Designation
    D: Florida Organ & Tissue Donor
  answer: B
  explanation: According to the manual, Selective Service, Career Offenders, and Sexual
    Offenders & Sexual Predators are classified as Required Designations.
- id: 17
  category: driver_testing
  question: In the context of Florida driving courses, what does the acronym 'BDI'
    stand for?
  choices:
    A: Basic Driver Improvement
    B: Beginner Driver Instruction
    C: Basic Driving Information
    D: Behind-the-wheel Driver Inspection
  answer: A
  explanation: The manual lists the 'Basic Driver Improvement (BDI) Course' under
    the Driving Schools & Test Providers section.
- id: 18
  category: driver_testing
  question: What type of driving course is designated by the acronym 'ADI'?
  choices:
    A: Automatic Driver Instruction
    B: Advanced Driver Improvement
    C: Additional Driving Information
    D: Approved Driver Inspection
  answer: B
  explanation: The manual includes a specific section for 'Advanced Driver Improvement
    (ADI) Courses'.
- id: 19
  category: driver_responsibility
  question: Which two laws are specifically listed under Florida's Insurance Laws
    in the driver's manual?
  choices:
    A: The Collision Law and the Liability Law
    B: The No-Fault Law and the Financial Responsibility Law
    C: The Move Over Law and the Speeding Law
    D: The Comprehensive Law and the Uninsured Motorist Law
  answer: B
  explanation: The manual categorizes the 'No-Fault Law' and 'Financial Responsibility
    Law' directly under the Insurance Laws section.
- id: 20
  category: driver_responsibility
  question: According to the manual, what specific type of restriction is placed on
    minor drivers?
  choices:
    A: Passenger limits only
    B: Driving Curfews
    C: Daylight driving only
    D: Highway driving bans
  answer: B
  explanation: The manual explicitly lists 'Restrictions for Minors (Driving Curfews)'
    under the Your Driving Privilege chapter.
- id: 21
  category: penalties_and_points
  question: Which of the following is a way a person can lose their privilege to drive
    in Florida?
  choices:
    A: Suspensions
    B: Revocations
    C: Cancellations
    D: All of the above
  answer: D
  explanation: The manual lists Suspensions, Revocations, and Cancellations as the
    three sub-categories under 'Losing the Privilege to Drive.'
- id: 22
  category: vehicle_information
  question: When referring to vehicle equipment standards, what does 'ADAS' stand
    for?
  choices:
    A: Automatic Driving and Steering
    B: Advanced Driver Assistance Systems
    C: Anti-lock Driver Alert System
    D: Automated Distance and Speed
  answer: B
  explanation: The manual includes a section on 'Advanced Driver Assistance Systems
    (ADAS)' under Equipment Standards.
- id: 23
  category: alcohol_drugs_health
  question: What does the acronym 'DUI' stand for in the Florida driver's manual?
  choices:
    A: Driving Under Intoxication
    B: Driving Under the Influence
    C: Driving Using Intoxicants
    D: Driver Under Investigation
  answer: B
  explanation: The manual refers to 'Driving Under the Influence (DUI)' in its sections
    on driving violations and licensed programs.
- id: 24
  category: license_system
  question: The Florida driver's manual contains specific ID card requirement sections
    for which of the following groups?
  choices:
    A: College students and out-of-state residents
    B: Homeless Persons and Persons at or Below Poverty Level
    C: Government employees and military personnel
    D: Emancipated minors and foster children
  answer: B
  explanation: The manual lists 'ID Cards for Homeless Persons' and 'ID Cards for
    Persons at or Below Poverty Level' under the ID Card Requirements section.
- id: 25
  category: license_system
  question: Under the License Renewal section, the manual contains specific information
    for older drivers starting at what age?
  choices:
    A: 65 Years Old and Older
    B: 70 Years Old and Older
    C: 75 Years Old and Older
    D: 80 Years Old and Older
  answer: D
  explanation: The manual includes a specific section titled 'Drivers 80 Years Old
    and Older' under License Renewal.
- id: 26
  category: safe_driving_rules
  question: Which of the following laws is specifically listed in the Driving Safety
    chapter of the manual?
  choices:
    A: The Keep Right Law
    B: The Move Over Law
    C: The Hands-Free Law
    D: The Headlight Law
  answer: B
  explanation: 'The ''Move Over Law'' is explicitly listed as a section under Chapter
    7: Driving Safety.'
- id: 27
  category: signs_and_signals
  question: Which of the following is categorized as a 'Specialized Sign and Signal'
    in the Florida driver's manual?
  choices:
    A: Stop Signs
    B: Yield Signs
    C: Drawbridge Signs & Signals
    D: Interstate Routing Signs
  answer: C
  explanation: The manual lists Drawbridge Signs & Signals, along with Construction,
    Pedestrian, Railroad, and School Zone signs, under 'Specialized Signs and Signals.'
- id: 28
  category: defensive_driving
  question: According to the Handling Emergencies chapter, which of the following
    is a listed first aid procedure?
  choices:
    A: CPR
    B: Treating for Shock
    C: Applying a tourniquet
    D: Splinting broken bones
  answer: B
  explanation: '''Treat For Shock'' is specifically listed under the First Aid section
    of Chapter 9: Handling Emergencies.'
- id: 29
  category: sharing_the_road
  question: Which of the following vehicle types has a specific section dedicated
    to it in the 'Sharing the Road' chapter?
  choices:
    A: Motorcycles
    B: Mopeds
    C: Golf Carts
    D: ATVs
  answer: C
  explanation: The 'Sharing the Road' chapter explicitly lists sections for Bicyclists,
    Commercial Motor Vehicles, Emergency Vehicles, Funeral Processions, Golf Carts,
    and Low-Speed Vehicles.
- id: 30
  category: license_system
  question: What are the driving hour restrictions for a driver with a Learner's License
    during their first three months of driving?
  choices:
    A: They may drive from 6 am to 11 pm.
    B: They may only drive during daylight hours.
    C: They may drive from 5 am to 1 am.
    D: They may drive at any time if accompanied by a licensed driver.
  answer: B
  explanation: According to the manual, a driver with a Learner's License must only
    drive during daylight hours during the first three months.
- id: 31
  category: license_system
  question: How many hours of driving experience must a Learner's License holder complete
    before getting a driver license?
  choices:
    A: 30 hours, including 5 hours at night
    B: 40 hours, including 10 hours at night
    C: 50 hours, including 10 hours at night
    D: 60 hours, including 15 hours at night
  answer: C
  explanation: The manual states that a Learner's License holder must have at least
    50 hours of driving experience prior to getting a driver license, and 10 hours
    should be at night.
- id: 32
  category: license_system
  question: What are the driving hour restrictions for a 16-year-old with a driver
    license who is driving unaccompanied and not traveling to or from work?
  choices:
    A: 5 am to 1 am
    B: 6 am to 11 pm
    C: Daylight hours only
    D: 6 am to 10 pm
  answer: B
  explanation: A 16-year-old with a driver license may drive from 6 am to 11 pm unless
    driving to or from work OR accompanied by a licensed driver who is 21+.
- id: 33
  category: license_system
  question: Between what hours may a 17-year-old with a driver license drive unaccompanied,
    assuming they are not driving to or from work?
  choices:
    A: 6 am to 11 pm
    B: 5 am to 1 am
    C: 6 am to midnight
    D: Daylight hours only
  answer: B
  explanation: A 17-year-old with a driver license may drive from 5 am to 1 am unless
    driving to or from work OR accompanied by a licensed driver who is 21+.
- id: 34
  category: penalties_and_points
  question: What penalty applies to drivers under the age of 18 who accumulate six
    or more points within a 12-month period?
  choices:
    A: Their license is revoked for 6 months.
    B: They must retake the driving skills test.
    C: They are automatically restricted to driving for 'Business Purposes ONLY' for
      one year.
    D: They must pay a $500 fine and attend traffic school.
  answer: C
  explanation: Drivers under the age of 18 who accumulate six or more points within
    a 12-month period are automatically restricted to driving for 'Business Purposes
    ONLY' for one year.
- id: 35
  category: driver_responsibility
  question: Which of the following documents must you always carry with you in the
    vehicle when driving?
  choices:
    A: Driver license, proof of vehicle registration, and insurance
    B: Driver license, birth certificate, and social security card
    C: Proof of insurance, vehicle title, and driver license
    D: Vehicle registration, passport, and driver license
  answer: A
  explanation: You must always carry your driver license with you when driving, and
    always have proof of vehicle registration and insurance with you in the vehicle
    you are driving.
- id: 36
  category: license_system
  question: If a non-resident accepts employment in Florida, how many days do they
    have to obtain a Florida driver license?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: A non-resident who accepts employment or engages in a trade, profession
    or occupation in this state must get a Florida driver license within 30 days in
    order to operate a motor vehicle.
- id: 37
  category: license_system
  question: Which of the following individuals is NOT exempt from obtaining a Florida
    driver license?
  choices:
    A: A non-resident attending college in Florida.
    B: A member of the Armed Forces stationed in Florida.
    C: A non-resident who enrolls their child in a Florida public school.
    D: A US government employee driving a non-commercial US government vehicle on
      official business.
  answer: C
  explanation: A non-resident who enrolls their child in a Florida public school must
    get a Florida driver license within 30 days. College students, Armed Forces members,
    and US government employees on official business are exempt.
- id: 38
  category: driver_testing
  question: If you hold a valid driver license from Germany, which Florida driver
    license exam is waived (reciprocated)?
  choices:
    A: Both the Knowledge and Driving Skills exams
    B: Only the Driving Skills exam
    C: Only the Knowledge exam
    D: The Vision exam
  answer: B
  explanation: The manual specifies that for individuals with a valid driver license
    from Germany, only the driving skills test is reciprocated (waived).
- id: 39
  category: driver_testing
  question: Which exam is still required for all applicants, even if their Knowledge
    and Driving Skill exams are waived due to reciprocity?
  choices:
    A: Hearing exam
    B: Written knowledge exam
    C: Vision exam
    D: Road signs exam
  answer: C
  explanation: 'Under the Reciprocity section, the manual notes: ''Note: A vision
    exam is still required.'''
- id: 40
  category: vehicle_information
  question: 'A Class E driver license allows you to operate non-commercial vehicles
    with a Gross Vehicle Weight Rating (GVWR) of less than:'
  choices:
    A: 10,001 pounds
    B: 16,001 pounds
    C: 26,001 pounds
    D: 32,001 pounds
  answer: C
  explanation: Class E allows drivers to operate non-commercial vehicles with a Gross
    Vehicle Weight Rating (GVWR) less than 26,001 pounds.
- id: 41
  category: vehicle_information
  question: 'To operate a two or three-wheel motorcycle, you must have a motorcycle
    endorsement or a ''Motorcycle Only'' license if the engine size is more than:'
  choices:
    A: 30 cc
    B: 50 cc
    C: 100 cc
    D: 150 cc
  answer: B
  explanation: To operate any two or three wheel motorcycle, whose engine size is
    more than 50 cc, you are required to have a motorcycle endorsement on your driver
    license or hold a 'Motorcycle Only' license.
- id: 42
  category: vehicle_information
  question: You must have a Commercial Driver's License (CDL) to operate a vehicle
    designed to transport how many passengers (including the driver)?
  choices:
    A: 10 or more
    B: 12 or more
    C: 15 or more
    D: 16 or more
  answer: D
  explanation: You must have a Commercial Driver's License (CDL) Class A, B, or C
    to operate a vehicle designed to transport 16 or more passengers (including the
    driver).
- id: 43
  category: license_system
  question: When applying for a Florida driver license or ID card, how many documents
    must you present to show your Florida residential address?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: All applicants for a Florida driver license or ID card must present
    two documents that show your Florida residential address.
- id: 44
  category: license_system
  question: If your name has changed since your primary identification was issued,
    what must you present when applying for a Florida driver license?
  choices:
    A: A notarized letter explaining the name change
    B: A photocopy of your new social security card
    C: A name change document such as a marriage certificate or court order
    D: Two additional proofs of residential address
  answer: C
  explanation: If your name has changed since the primary identification was issued,
    you will need to present a name change document such as a marriage certificate,
    divorce decree or court order.
- id: 45
  category: license_system
  question: What is the minimum age requirement to obtain a Class E Learner's License
    in Florida?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: According to the manual, an applicant must be at least 15 years old
    to obtain a Class E Learner's License.
- id: 46
  category: license_system
  question: If you are under 18, how many hours of driving experience must a parent
    or guardian certify you have completed before getting a driver license?
  choices:
    A: 30 hours, of which 5 were at night
    B: 40 hours, of which 10 were at night
    C: 50 hours, of which 10 were at night
    D: 60 hours, of which 15 were at night
  answer: C
  explanation: A parent, legal guardian, or responsible adult 21 years old or older
    must certify that the driver has had at least 50 hours of driving experience,
    of which 10 hours were at night.
- id: 47
  category: license_system
  question: How long must a driver under the age of 18 hold a learner's license before
    applying for a Class E Driver License?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months or until their 18th birthday
    D: 18 months
  answer: C
  explanation: If under age 18, you must hold a learner's license for 12 months or
    until the 18th birthday, whichever comes first.
- id: 48
  category: license_system
  question: Which of the following is an acceptable original or certified document
    to prove your Social Security Number?
  choices:
    A: A utility bill
    B: A W-2 form
    C: A Florida voter registration card
    D: A school transcript
  answer: B
  explanation: Acceptable documents for proving a Social Security Number include a
    Social Security card, W-2 form, paycheck containing the complete SSN, 1099 form,
    or Military ID.
- id: 49
  category: license_system
  question: Which of the following documents is NOT accepted as Primary Identification
    for a US Citizen?
  choices:
    A: Valid US passport
    B: Certificate of Naturalization
    C: Hospital birth certificate
    D: Consular Report of Birth Abroad
  answer: C
  explanation: The manual explicitly states that "Hospital birth certificates will
    not be accepted" as primary identification for US Citizens.
- id: 50
  category: license_system
  question: Immigrants, Canadian citizens, and other non-immigrants applying for a
    Florida driver license may be issued a temporary driving permit without a photo
    for how many days?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: Immigrants, Canadian citizens, and other non-immigrants applying for
    a Florida driver license may be issued a 60-day temporary driving permit without
    a photo.
- id: 51
  category: license_system
  question: What does TLSAE stand for in the context of Florida driver license requirements?
  choices:
    A: Traffic Law and Substance Abuse Education
    B: Teen Learner and Safe Automobile Education
    C: Traffic Licensing and Safety Awareness Exam
    D: Transportation Law and Safety Administration Evaluation
  answer: A
  explanation: TLSAE stands for Traffic Law and Substance Abuse Education Course,
    which is required for a Learner's or Driver License.
- id: 52
  category: license_system
  question: Who is exempt from the TLSAE requirement when applying for a learner's
    or driver license?
  choices:
    A: Applicants over the age of 21
    B: Applicants who successfully pass a driver's education course at a certified
      DELAP school
    C: Applicants who hold a valid out-of-state ID card
    D: Applicants who have a college degree
  answer: B
  explanation: Applicants who successfully pass a driver's education course at a certified
    DELAP school are exempt from the TLSAE requirement.
- id: 53
  category: license_system
  question: If you are under 18, what is the rule regarding moving traffic violations
    during the 12 months you hold a learner's license?
  choices:
    A: You may have up to three moving violations.
    B: You must have NO moving traffic violation convictions, but may have ONE if
      adjudication is withheld.
    C: You can have two moving violations as long as no accidents occurred.
    D: Moving violations do not affect your ability to get a driver license.
  answer: B
  explanation: If under age 18, you must have NO moving traffic violation convictions
    for 12 months from the learner's license date of issue. You may have ONE moving
    traffic violation if adjudication is withheld.
- id: 54
  category: driver_responsibility
  question: If you are under age 18 and not married, who must sign your license application?
  choices:
    A: A high school principal
    B: A driving instructor
    C: A parent or legal guardian
    D: A sibling over the age of 18
  answer: C
  explanation: If you are under age 18 and are not married, a parent or legal guardian
    must sign your license application in front of the driver license agent or a notary
    public.
- id: 55
  category: license_system
  question: What must you provide for proof of residential address if you are living
    with another person?
  choices:
    A: Only a letter from that person
    B: Two documents in your name and a notarized affidavit
    C: Two documents and a letter from the person you are living with
    D: One document in the other person's name
  answer: C
  explanation: Individuals living with another person must present two documents and
    a letter from that person to prove their residential address.
- id: 56
  category: license_system
  question: If you recently changed your name, what must you do before applying for
    a driver license or ID card?
  choices:
    A: Update your records with the Social Security Administration first
    B: Bring a handwritten note explaining the name change
    C: Apply for a temporary 60-day permit
    D: Take the Class E Knowledge exam again
  answer: A
  explanation: 'The manual states: "If you recently changed your name, you must update
    your records with the Social Security Administration first."'
- id: 57
  category: license_system
  question: If you have never been issued a Social Security number and are a US citizen,
    which of the following can be used as Secondary Identification?
  choices:
    A: A hospital birth certificate
    B: A library card
    C: A marriage certificate
    D: A utility bill
  answer: C
  explanation: A marriage certificate is listed as one of the acceptable secondary
    documents for individuals who have never been issued a Social Security number.
- id: 58
  category: license_system
  question: Who must sign the driver license application for an unmarried minor under
    the age of 18?
  choices:
    A: A driver education instructor
    B: A parent or legal guardian
    C: A notary public only
    D: The minor themselves
  answer: B
  explanation: If you are under age 18 and are not married, a parent or legal guardian
    must sign your license application in front of the driver license agent or a notary
    public.
- id: 59
  category: driver_responsibility
  question: How can a parent or guardian withdraw their consent and cancel a minor's
    driver license?
  choices:
    A: By calling the local police department
    B: By confiscating the physical license from the minor
    C: By writing a letter to FLHSMV or using MyDMVPortal
    D: By waiting until the minor turns 18
  answer: C
  explanation: To cancel the license, the signer must write a letter to FLHSMV requesting
    to withdraw their consent... The signer may also go to MyDMVPortal.flhsmv.gov
    to cancel the license.
- id: 60
  category: alcohol_drugs_health
  question: What optional designation can a diabetic person who uses insulin request
    to have indicated on their driver license?
  choices:
    A: Medical Alert Bracelet
    B: Insulin Dependent
    C: Diabetic Driver
    D: Code 3 Restriction
  answer: B
  explanation: If you are diabetic and use insulin, you may request that 'Insulin
    Dependent' is indicated on your driver license.
- id: 61
  category: penalties_and_points
  question: What is a possible consequence of failing to comply with a restriction
    code on your driver license?
  choices:
    A: You will be required to retake the driving test
    B: You could receive a citation and have your license suspended
    C: Your vehicle will be impounded for 30 days
    D: You will receive a warning letter from the DMV
  answer: B
  explanation: If you have a restriction on your license and do not comply with the
    requirements, you could receive a citation and have your license suspended.
- id: 62
  category: license_system
  question: What does Restriction Code G indicate on a Florida driver license?
  choices:
    A: Corrective Lenses
    B: Business Purposes Only
    C: Daylight Driving Only
    D: Employment Purposes Only
  answer: C
  explanation: Restriction Code G stands for 'Daylight Driving Only. (Dawn to dusk)'.
- id: 63
  category: license_system
  question: What is the minimum age to obtain a standard Florida ID card, assuming
    no disabled parking permit is being applied for?
  choices:
    A: 5 years of age
    B: 12 years of age
    C: 15 years of age
    D: 16 years of age
  answer: A
  explanation: To obtain an ID card, you must be 5 years of age or older (unless applying
    for a disabled parking permit, which has no age restriction).
- id: 64
  category: license_system
  question: How long is a Florida ID card valid for a person who is 10 years old?
  choices:
    A: 2 years
    B: 4 years
    C: 6 years
    D: 8 years
  answer: B
  explanation: ID cards issued to persons 5-14 years of age will be valid for four
    years; all others will be valid for eight years.
- id: 65
  category: license_system
  question: Can a person hold both a Florida driver license and a Florida ID card
    at the same time?
  choices:
    A: Yes, if they pay a dual-issue fee
    B: Yes, but only if they are over 18
    C: No, they must surrender their driver license to get an ID card
    D: No, unless they have a disabled parking permit
  answer: C
  explanation: Persons holding a driver license who wish to obtain a Florida ID card
    must surrender their driver license. You are prohibited from holding both a driver
    license and an ID card at the same time.
- id: 66
  category: license_system
  question: How can a homeless person obtain a Florida ID card at no cost?
  choices:
    A: By providing a letter from a local homeless shelter verifying their status
    B: By showing a food stamp EBT card
    C: By swearing an oath in front of a notary public
    D: By applying online through MyDMVPortal
  answer: A
  explanation: If you are homeless, you can get an ID card at no cost. You must provide
    a current letter from a local homeless shelter verifying that you are homeless.
- id: 67
  category: license_system
  question: Who is required by state law to comply with Federal Selective Service
    System requirements when applying for a driver license or ID card?
  choices:
    A: All US citizens over the age of 18
    B: Any male US citizen or immigrant who is at least 18 but less than 26 years
      old
    C: Any person applying for a commercial driver's license
    D: Any male who is 16 years old applying for a learner's license
  answer: B
  explanation: State law requires any male who is a US citizen or immigrant, who is
    at least 18 years old but less than 26 years old, to comply with Federal Selective
    Service System requirements.
- id: 68
  category: driver_responsibility
  question: How long do sexual predators and offenders have to report in person to
    a driver license service center after a change in name or address?
  choices:
    A: 24 hours
    B: 48 hours
    C: 2 working days
    D: 30 calendar days
  answer: B
  explanation: Sexual predators and offenders must report in person to a driver license
    service center... within 48 hours after any change in name or address.
- id: 69
  category: driver_responsibility
  question: According to the manual, how many lives could you save by registering
    as an organ and tissue donor?
  choices:
    A: Up to 4 lives
    B: Up to 6 lives
    C: Up to 8 lives
    D: Up to 10 lives
  answer: C
  explanation: By registering as a donor, you could save up to eight lives.
- id: 70
  category: license_system
  question: What document must an honorably discharged US veteran provide to get the
    'Veteran' designation on their license?
  choices:
    A: A military ID card
    B: A letter from a VA hospital
    C: A copy of their DD214 or other approved discharge document
    D: A state-issued birth certificate
  answer: C
  explanation: The veteran will need to provide a copy of their DD214 or other approved
    discharge document at the time of issuance to have the 'Veteran' designation placed
    on their license.
- id: 71
  category: driver_responsibility
  question: How many days do you have to obtain a new driver license after changing
    your mailing or residential address?
  choices:
    A: 10 calendar days
    B: 15 calendar days
    C: 30 calendar days
    D: 60 calendar days
  answer: C
  explanation: You must obtain a new driver license within 30 calendar days of any
    change to your mailing or residential address.
- id: 72
  category: license_system
  question: Which of the following documents is acceptable to change your name on
    your driver license?
  choices:
    A: A notarized letter from a parent
    B: A utility bill in your new name
    C: An original or certified government issued marriage certificate
    D: A new Social Security card
  answer: C
  explanation: To change your name, you will need to present an original or certified
    government issued marriage certificate, divorce decree, or court order as a name
    change document.
- id: 73
  category: license_system
  question: What must Canadian Citizens do before applying for a name change on their
    Florida driver license or ID card?
  choices:
    A: Change their name on their Canadian passport
    B: Surrender their Canadian passport to the DMV
    C: Apply for a United States passport
    D: Change their name on their USCIS documents
  answer: A
  explanation: According to the manual, Canadian Citizens must change their name on
    their Canadian passport before applying for a name change on their driver license
    or ID card.
- id: 74
  category: license_system
  question: Under what condition is the replacement fee waived for a stolen Florida
    driver license?
  choices:
    A: If you apply for a replacement online within 24 hours
    B: If you provide a copy of the police report in person and make no changes to
      the card
    C: If you have maintained a clean driving record for the past three years
    D: If you are a student under the age of 18
  answer: B
  explanation: If the card was stolen and you provide a copy of the police report
    (in person), the replacement fee is waived as long as you are not making any changes
    to the card.
- id: 75
  category: license_system
  question: How long are Class E driver licenses generally valid for in Florida?
  choices:
    A: 4 to 6 years
    B: 5 to 10 years
    C: 6 to 8 years
    D: 8 to 10 years
  answer: C
  explanation: The manual states that Class E driver licenses are valid for six to
    eight years.
- id: 76
  category: license_system
  question: Which of the following is a reason your Florida driver license may NOT
    be renewed?
  choices:
    A: You have an unpaid parking ticket from another state
    B: You did not answer a summons which involved a traffic violation
    C: You are over the age of 80
    D: You lost your previous driver license
  answer: B
  explanation: Your license may not be renewed if you did not answer a summons which
    involved a traffic violation, among other reasons such as suspension or lack of
    documentation.
- id: 77
  category: license_system
  question: 'You are NOT eligible to renew your driver license online if:'
  choices:
    A: You are a US citizen
    B: Your previous renewal was done in person at a field office
    C: Your previous renewal was by phone, mail, or online
    D: You are over the age of 65
  answer: C
  explanation: You are not eligible for online renewal if your previous renewal was
    by phone, mail, or online.
- id: 78
  category: driver_testing
  question: What is required for all drivers who are 80 years of age or older when
    renewing their driver license?
  choices:
    A: They must pass a driving skills test
    B: They must pass a vision exam
    C: They must pass a written knowledge exam
    D: They must complete a Basic Driver Improvement course
  answer: B
  explanation: All drivers who are 80 years of age or older and who are renewing their
    driver license are required to pass a vision exam.
- id: 79
  category: license_system
  question: What is the fee for an initial Class E Florida driver license?
  choices:
    A: $25
    B: $48
    C: $60
    D: $75
  answer: B
  explanation: The initial license fee for a first Florida license is $48.
- id: 80
  category: penalties_and_points
  question: What is the delinquent fee for a driver license renewal application received
    after the expiration date?
  choices:
    A: $10
    B: $15
    C: $25
    D: $48
  answer: B
  explanation: Application for renewal received after the license expiration date
    (midnight of your birthday) requires a $15 late fee.
- id: 81
  category: penalties_and_points
  question: What is the administrative fee to reinstate a driver license after an
    alcohol and drug-related offense?
  choices:
    A: $45
    B: $75
    C: $130
    D: $180
  answer: C
  explanation: The reinstatement administrative fee for alcohol & drug-related offenses
    is $130.
- id: 82
  category: penalties_and_points
  question: What is the insurance reinstatement fee for a first suspension due to
    failure to maintain PIP insurance?
  choices:
    A: $15
    B: $45
    C: $150
    D: $250
  answer: C
  explanation: The fee for failure to maintain PIP insurance for a 1st suspension
    is $150.
- id: 83
  category: driver_testing
  question: How much does a written re-test (Class E Knowledge Exam) cost in Florida?
  choices:
    A: $7
    B: $10
    C: $15
    D: $20
  answer: B
  explanation: The fee for written re-tests (Class E Knowledge Exam) is $10.
- id: 84
  category: license_system
  question: Who is exempt from paying certain driver license fees, such as initial
    and renewal fees?
  choices:
    A: All drivers over the age of 80
    B: Any veteran honorably discharged with a 100% service-connected disability
    C: Active duty law enforcement officers
    D: Any driver who has not received a traffic citation in 10 years
  answer: B
  explanation: Any veteran honorably discharged from the Armed Forces who has been
    determined by the Veterans Administration to have a 100% service-connected disability
    is exempt from paying certain driver license fees.
- id: 85
  category: driver_testing
  question: If you have never held a driver license in any jurisdiction, what must
    you complete before applying for a Florida driver license?
  choices:
    A: A Basic Driver Improvement (BDI) course
    B: A Traffic Law Substance Abuse Education (TLSAE) course
    C: An advanced defensive driving course
    D: A 50-hour supervised driving log
  answer: B
  explanation: If you have never held a driver license in any state, country, or jurisdiction,
    you must complete a TLSAE course before applying for a driver license in the state
    of Florida.
- id: 86
  category: alcohol_drugs_health
  question: If you are under 21 and receive a notice of suspension for driving with
    a Blood Alcohol Level (BAL) of .02 to .05, what must you do to reinstate your
    driver license on a hardship basis?
  choices:
    A: Pay a $500 fine and serve 10 days in jail
    B: Complete a Traffic Law Substance Abuse Education (TLSAE) course
    C: Retake the driving skills test
    D: Wait until you turn 21 years old
  answer: B
  explanation: If you are under 21 years old and receive a notice of suspension for
    driving with a BAL of .02 to .05, you must complete a TLSAE course in order to
    reinstate your driver license on a hardship basis.
- id: 87
  category: driver_responsibility
  question: Under which of the following circumstances are you required to complete
    a Basic Driver Improvement (BDI) course?
  choices:
    A: You had one crash resulting in $200 of property damage.
    B: You were at fault in a crash and someone was transported to the hospital.
    C: You received a parking ticket in a school zone.
    D: Your vehicle broke down on the highway.
  answer: B
  explanation: According to the manual, you must complete a basic driver improvement
    course if you were a driver in a crash, found at fault, and someone was transported
    to the hospital.
- id: 88
  category: penalties_and_points
  question: How many times in a lifetime can a person elect to attend a Basic Driver
    Improvement course to avoid points on their driving record?
  choices:
    A: '3'
    B: '5'
    C: '8'
    D: Unlimited
  answer: B
  explanation: The manual states that a person may make no more than five elections
    in a lifetime to attend a basic driver improvement course to withhold points.
- id: 89
  category: penalties_and_points
  question: 'You may NOT elect to attend a Basic Driver Improvement course for a non-criminal
    moving violation if you were charged with exceeding the speed limit by more than:'
  choices:
    A: 10 MPH
    B: 15 MPH
    C: 20 MPH
    D: 30 MPH
  answer: D
  explanation: The manual specifies that you may not elect to attend a basic driver
    improvement course if you were charged with exceeding the speed limit by more
    than 30 MPH.
- id: 90
  category: penalties_and_points
  question: Which course must you complete to reinstate your driving privileges if
    your Florida driver license was suspended for points or as a habitual traffic
    offender (non-DUI)?
  choices:
    A: Basic Driver Improvement (BDI) Course
    B: Advanced Driver Improvement (ADI) Course
    C: Traffic Law and Substance Abuse Education (TLSAE)
    D: Licensed DUI Program
  answer: B
  explanation: If your Florida driver license was suspended for points, as a habitual
    traffic offender (non-DUI), or by court order, you must complete an advanced driver
    improvement course.
- id: 91
  category: driver_testing
  question: What is the minimum acceptable field of vision for an applicant or licensed
    driver in Florida?
  choices:
    A: 100 degrees
    B: 110 degrees
    C: 130 degrees
    D: 150 degrees
  answer: C
  explanation: The manual states that the minimum acceptable field of vision for an
    applicant or licensed driver is 130 degrees.
- id: 92
  category: driver_testing
  question: Which of the following statements is true regarding vision screening and
    corrective lenses in Florida?
  choices:
    A: The use of telescopic lenses to meet visual standards is recognized.
    B: The use of telescopic lenses to meet visual standards is not recognized.
    C: You must have 20/20 vision in both eyes to drive.
    D: Contact lenses are not permitted during the vision test.
  answer: B
  explanation: 'The manual explicitly notes: ''The use of telescopic lenses to meet
    visual standards is not recognized in Florida.'''
- id: 93
  category: driver_testing
  question: How many questions are on the Class E Knowledge Exam?
  choices:
    A: '30'
    B: '40'
    C: '50'
    D: '60'
  answer: C
  explanation: The Class E Knowledge Exam consists of 50 multiple-choice questions
    about Florida traffic laws, safe driving practices, and identifying traffic controls.
- id: 94
  category: driver_testing
  question: Which of the following vehicle defects will cause the examiner to refuse
    to give you a driving skills test?
  choices:
    A: The vehicle has an automatic transmission.
    B: The vehicle does not have windshield wipers on the driver's side.
    C: The vehicle has tinted windows.
    D: The vehicle is more than 10 years old.
  answer: B
  explanation: The driving skills test will not be given if the examiner finds there
    are no windshield wipers on the driver's side.
- id: 95
  category: safe_driving_rules
  question: 'During the backing up maneuver on the driving skills test, you must back
    up a distance of 50 feet at a slow speed while:'
  choices:
    A: Looking exclusively at the rear-view camera monitor.
    B: Using only your side mirrors.
    C: Looking to the rear without using the rear-view mirror or camera monitor.
    D: Keeping one hand on the emergency brake.
  answer: C
  explanation: For the backing up maneuver, you must back up 50 feet at a slow speed
    while looking to the rear, and you must not use the rear-view mirror or rear-view
    camera monitor.
- id: 96
  category: safe_driving_rules
  question: On the driving skills test, what is the minimum following distance you
    must maintain behind other cars?
  choices:
    A: One to two seconds
    B: Two to three seconds
    C: Three to four seconds
    D: Five to six seconds
  answer: C
  explanation: During the driving exam, you must keep a minimum following distance
    of three to four seconds to follow at a safe distance.
- id: 97
  category: safe_driving_rules
  question: 'When performing the signal and turn maneuver on the driving exam, you
    must signal your turn for the last:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: The manual requires that you get into the proper lane and signal your
    turn for the last 100 feet.
- id: 98
  category: penalties_and_points
  question: If you elect to attend a Basic Driver Improvement course for a traffic
    citation, you must inform the Clerk of Court and pay an election fee within how
    many days of receiving the citation?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Within 30 days from the date you received the traffic citation and
    prior to attending class, you must inform the Clerk of Court and pay an election
    fee.
- id: 99
  category: driver_testing
  question: Who is eligible to take the Class E Knowledge Exam online through an approved
    third-party provider?
  choices:
    A: Students under 18 years old
    B: Anyone applying for a commercial driver license
    C: Drivers over the age of 65
    D: All applicants regardless of age
  answer: A
  explanation: The manual states that students under 18 may take the knowledge exam
    online through approved third-party providers.
- id: 100
  category: driver_testing
  question: If an applicant is blind in one eye or has 20/200 vision or worse in one
    eye, what must the vision in the other eye be to pass the screening?
  choices:
    A: 20/20 or better
    B: 20/30 or better
    C: 20/40 or better
    D: 20/50 or better
  answer: C
  explanation: If one eye is blind or 20/200 or worse, the other eye must be 20/40
    or better with or without corrective lenses.
- id: 101
  category: driver_testing
  question: Who is permitted to ride in the vehicle with you during the driving skills
    exam?
  choices:
    A: A licensed parent or guardian
    B: A driver education instructor
    C: No other passengers, unless a language interpreter is necessary
    D: Up to one family member
  answer: C
  explanation: The manual specifies that no other passengers are permitted during
    the exam unless a language interpreter is necessary.
- id: 102
  category: safe_driving_rules
  question: When preparing to make a turn, for what distance must you signal before
    turning?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: According to the driving skills test guidelines, you must get into
    the proper lane and signal your turn for the last 100 feet.
- id: 103
  category: driver_testing
  question: During the driving skills test, what size space will you be required to
    turn your car around in for the three-point turn?
  choices:
    A: 10–20 foot space
    B: 20–40 foot space
    C: 40–60 foot space
    D: 50–70 foot space
  answer: B
  explanation: The manual states that for a Three Point Turn, you must turn the car
    around in a 20–40 foot space.
- id: 104
  category: vehicle_information
  question: What are the minimum insurance coverage requirements for motor vehicles
    operating on Florida roadways?
  choices:
    A: $5,000 PIP and $10,000 PDL
    B: $10,000 PIP and $10,000 PDL
    C: $15,000 PIP and $15,000 PDL
    D: $20,000 PIP and $20,000 PDL
  answer: B
  explanation: Every owner or person in charge of operating a motor vehicle on Florida
    roadways must have a minimum of $10,000 in Personal Injury Protection (PIP) AND
    a minimum of $10,000 in Property Damage Liability (PDL) coverage.
- id: 105
  category: vehicle_information
  question: You must comply with Florida's insurance laws if you own a motor vehicle
    that has been in the state for how many days during the last 365 days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: You must comply with the insurance laws if you own a motor vehicle
    that has been in the state for 90 days (consecutive or non-consecutive) during
    the last 365 days.
- id: 106
  category: driver_responsibility
  question: What must you do before canceling your Florida motor vehicle insurance
    to prevent the suspension of your driver's license?
  choices:
    A: Notify your local police department.
    B: Turn in your vehicle license plate to a driver license service center.
    C: Pay a $150 cancellation fee.
    D: Obtain a temporary driving permit.
  answer: B
  explanation: The manual requires you to turn in your plate to any driver license
    service center before canceling your insurance to prevent the suspension of your
    license and to avoid reinstatement fees.
- id: 107
  category: penalties_and_points
  question: What is the penalty for showing a law enforcement officer a falsified
    insurance card or one you know has been canceled?
  choices:
    A: A warning and a $50 fine
    B: A first-degree misdemeanor
    C: A second-degree misdemeanor
    D: A third-degree felony
  answer: C
  explanation: If you show a law enforcement officer an insurance card when you know
    the insurance has been canceled—or if you falsify the card—you may be arrested
    and charged with a second-degree misdemeanor.
- id: 108
  category: alcohol_drugs_health
  question: If you are convicted of a DUI in Florida, how long must you maintain the
    higher required insurance coverage limits?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 10 years
  answer: B
  explanation: Florida law requires you to have higher coverage limits (such as $100,000
    BIL for one person) when convicted of a DUI, and this higher coverage must be
    in effect for three years after your DUI conviction.
- id: 109
  category: license_system
  question: What are the driving curfew restrictions for a minor holding a learner's
    license during their first 3 months?
  choices:
    A: They may drive until 10 pm.
    B: They may only drive during daylight hours.
    C: They may drive until midnight.
    D: They may drive at any time if accompanied by someone 18 or older.
  answer: B
  explanation: Minors holding a learner’s license must be accompanied by a licensed
    driver age 21 or older, and must only drive during daylight hours for the first
    3 months.
- id: 110
  category: license_system
  question: Between what hours is a 16-year-old licensed driver prohibited from driving,
    unless driving to/from work or accompanied by a licensed driver age 21 or older?
  choices:
    A: 10 pm and 5 am
    B: 11 pm and 6 am
    C: 12 am and 6 am
    D: 1 am and 5 am
  answer: B
  explanation: A 16-year-old licensed driver may not drive between 11 pm and 6 am
    unless driving to or from work or accompanied by a licensed driver age 21 or older.
- id: 111
  category: license_system
  question: What is the driving curfew for a 17-year-old licensed driver who is not
    driving to work and is unaccompanied?
  choices:
    A: 10 pm to 6 am
    B: 11 pm to 6 am
    C: Midnight to 5 am
    D: 1 am to 5 am
  answer: D
  explanation: A 17-year-old licensed driver may not drive between 1 am and 5 am,
    unless driving to or from work or accompanied by a licensed driver age 21 or older.
- id: 112
  category: penalties_and_points
  question: What is the penalty for illegally using a disabled parking permit that
    does not belong to you?
  choices:
    A: A $100 fine and 1 point on your license
    B: A second-degree misdemeanor punishable by a $500 fine or up to 6 months in
      jail
    C: A first-degree misdemeanor punishable by a $1,000 fine
    D: Immediate revocation of your driver's license for 1 year
  answer: B
  explanation: Anyone who obtains or uses a permit that does not belong to them can
    be charged with a second degree misdemeanor, punishable by a $500 fine or up to
    6 months in jail, and the vehicle can be towed.
- id: 113
  category: driver_testing
  question: During the driving skills test, what is considered proper posture?
  choices:
    A: Resting your left elbow in the window while steering with your right hand.
    B: Keeping both hands on the steering wheel and not resting your elbow in the
      window.
    C: Leaning back comfortably with one hand at the 12 o'clock position.
    D: Keeping your hands at the 10 and 2 positions while resting your elbow on the
      center console.
  answer: B
  explanation: 'The manual instructs drivers to use proper posture: ''Keep both hands
    on the steering wheel and do not rest your elbow in the window.'''
- id: 114
  category: penalties_and_points
  question: If your driver's license is suspended for failing to maintain proper insurance,
    can you obtain a temporary license to drive to work?
  choices:
    A: Yes, but only if you pay a $150 fee.
    B: Yes, you can get a hardship license for work purposes only.
    C: No, you will not be able to get a temporary license for any reason.
    D: No, unless you get a signed waiver from your employer.
  answer: C
  explanation: 'The manual explicitly states: ''If your driver license or license
    plate is suspended for not having insurance, you won’t be able to get a temporary
    license for any reason, not even to go to work.'''
- id: 115
  category: safe_driving_rules
  question: According to the driving skills test guidelines, which lane should you
    generally drive in unless you are on a one-way street?
  choices:
    A: The left lane
    B: The center lane
    C: The right lane
    D: The lane with the least traffic
  answer: C
  explanation: Under 'Stay in Proper Lane', the manual states to 'Drive in the right
    lane except on a one-way street.'
- id: 116
  category: driver_responsibility
  question: Which of the following actions is a violation of the Driver License Law
    that can result in jail time or a fine?
  choices:
    A: Allowing an unlicensed person to use your car.
    B: Forgetting your driver's license at home while driving.
    C: Driving a rental car out of state.
    D: Parking in a metered space without paying.
  answer: A
  explanation: Under 'Violations of the Driver License Law', offenses that can put
    you in jail or require a fine include 'Allowing an unlicensed person to use your
    car, or renting a motor vehicle to someone without a license.'
- id: 117
  category: alcohol_drugs_health
  question: Under Florida's Implied Consent Law, what happens if you refuse to take
    a breath, blood, or urine test for the first time?
  choices:
    A: Your license will automatically be suspended for one year.
    B: You will be fined $500.
    C: Your license will be suspended for 18 months.
    D: You will be required to attend a 12-hour DUI school.
  answer: A
  explanation: The manual states that if you refuse to take the tests when asked,
    your license will automatically be suspended for one year.
- id: 118
  category: penalties_and_points
  question: What is the penalty for a second refusal to submit to a breath, blood,
    or urine test?
  choices:
    A: A 6-month license suspension
    B: An 18-month license suspension and a first degree misdemeanor
    C: A $1,000 fine and 50 hours of community service
    D: Permanent revocation of your driver license
  answer: B
  explanation: According to the manual, a second refusal will result in an 18 month
    suspension and a first degree misdemeanor.
- id: 119
  category: alcohol_drugs_health
  question: In DUI cases involving death or serious injury, which of the following
    is true regarding blood tests?
  choices:
    A: You are only required to take a blood test if you consent.
    B: You will be required to take a blood test with or without your consent.
    C: Blood can only be drawn if you are conscious.
    D: A blood test is optional if you pass a breath test.
  answer: B
  explanation: The manual states that in DUI cases involving death or serious injury,
    you will be required to take a blood test with or without your consent, and blood
    may be drawn even if you are unconscious.
- id: 120
  category: alcohol_drugs_health
  question: Under the Zero Tolerance law, what happens if a driver under 21 years
    of age is stopped and has a breath or blood alcohol level (BAL) of .02 or higher?
  choices:
    A: Their driving privilege will be suspended for six months.
    B: They will be fined $500.
    C: They must install an ignition interlock device for one year.
    D: Their license will be permanently revoked.
  answer: A
  explanation: The manual specifies that any driver under 21 years of age who is stopped
    by law enforcement and has a BAL of .02 or higher will automatically have their
    driving privilege suspended for six months.
- id: 121
  category: penalties_and_points
  question: What is the penalty for throwing more than 15 pounds of litter onto a
    roadway in Florida?
  choices:
    A: A $100 fine
    B: A $500 fine and 2 points on your driving record
    C: A first-degree misdemeanor, up to a $1,000 fine, and 3 points on your driving
      record
    D: A second-degree misdemeanor and a 6-month license suspension
  answer: C
  explanation: If you throw more than 15 pounds of litter, you can be charged with
    a first-degree misdemeanor, fined up to $1,000, and receive 3 points on your driving
    record.
- id: 122
  category: penalties_and_points
  question: How many points will you receive on your driver license for passing a
    stopped school bus?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: The penalties for passing a stopped school bus include four points
    on your driver license.
- id: 123
  category: penalties_and_points
  question: If passing a stopped school bus results in the serious injury or death
    of another person, what is the minimum license suspension period?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: If passing results in serious injury or death, penalties include suspension
    of license for a minimum of one year.
- id: 124
  category: safe_driving_rules
  question: According to Florida law, what are the safety restraint requirements for
    children ages 4 and 5?
  choices:
    A: They must be in a rear-facing safety seat.
    B: They must be in either a safety seat or a booster seat.
    C: They are only required to wear a standard lap belt.
    D: They are exempt from safety restraint laws if riding in the back seat.
  answer: B
  explanation: Florida law requires that children ages 4 and 5 must be in either a
    safety seat or a booster seat.
- id: 125
  category: driver_responsibility
  question: Who will be charged with a seat belt violation if a 16-year-old passenger
    is not properly restrained in a vehicle?
  choices:
    A: The 16-year-old passenger
    B: The driver of the vehicle
    C: The parents of the passenger
    D: Both the driver and the passenger
  answer: B
  explanation: Drivers will be charged with a safety belt/child restraint violation
    if any passenger under 18 is not properly restrained.
- id: 126
  category: safe_driving_rules
  question: Which of the following is exempt from Florida's safety belt requirements?
  choices:
    A: A passenger in the front seat of a passenger car
    B: An employee of a newspaper home delivery service while delivering newspapers
    C: A 10-year-old child riding in the back seat
    D: A driver with a learner's permit
  answer: B
  explanation: Florida law exempts an employee of a newspaper home delivery service
    while delivering newspapers from safety belt requirements.
- id: 127
  category: safe_driving_rules
  question: What is the maximum speed limit allowed on any roadway in Florida?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: B
  explanation: The manual states that in Florida, the speed limit will never be higher
    than 70 mph.
- id: 128
  category: penalties_and_points
  question: What is the minimum license revocation period for a first DUI conviction?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: For a first DUI conviction, the penalty includes a license revocation
    for a minimum of 180 days.
- id: 129
  category: penalties_and_points
  question: What can happen to your vehicle if it is used to transport, sell, or distribute
    drugs?
  choices:
    A: It must be repainted.
    B: It may be seized and forfeited to the arresting agency as contraband.
    C: It will be impounded for exactly 30 days.
    D: It must be equipped with an ignition interlock device.
  answer: B
  explanation: If drugs are in your vehicle because you are using your car to transport,
    sell, or distribute drugs, your car may be seized and forfeited to the arresting
    agency as contraband.
- id: 130
  category: safe_driving_rules
  question: Which of the following actions is considered illegal road damage in Florida?
  choices:
    A: Driving a vehicle weighing more than 10,000 pounds
    B: Driving on the rim of a flat tire
    C: Driving with snow chains during a storm
    D: Parking a heavy truck on a residential street
  answer: B
  explanation: The manual states that it is against the law to damage the roads by
    driving on the rim of a flat tire or by any other means.
- id: 131
  category: penalties_and_points
  question: What is the fine for a first offense of exceeding the speed limit by more
    than 50 MPH?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: The fine for exceeding the speed limit by more than 50 MPH is $1,000
    for the first offense and $2,500 for the second.
- id: 132
  category: penalties_and_points
  question: What happens to speeding fines when the infraction occurs within a school
    zone or construction zone?
  choices:
    A: They are waived if you take a driving course.
    B: They are reduced by half.
    C: They are doubled.
    D: They are tripled.
  answer: C
  explanation: Fines are doubled when speeding infractions occur within a school zone
    or construction zone, with possible civil penalties up to $1,000.
- id: 133
  category: driver_responsibility
  question: Under what condition are you required by law to attend a Traffic Collision
    Avoidance Course?
  choices:
    A: If you are found at fault in a crash where anyone was injured and transported
      to a medical treatment facility.
    B: If you receive a parking ticket in a school zone.
    C: If you are involved in any crash, regardless of who is at fault.
    D: If you are caught speeding 10 mph over the limit.
  answer: A
  explanation: You are required by law to attend a Traffic Collision Avoidance Course
    if you are found at fault in a crash where anyone was injured and transported
    to a medical treatment facility, or if it is your second collision in a two-year
    period.
- id: 134
  category: penalties_and_points
  question: If you are convicted of your third traffic offense that caused a crash
    within 36 months, which of the following must you complete?
  choices:
    A: A 30-day jail sentence
    B: 4 hours of behind-the-wheel training
    C: Surrendering your vehicle to the state
    D: Paying a mandatory $5,000 fine
  answer: B
  explanation: Under the Three Crashes in Three Years Law, you must complete a 12-hour
    ADI course, receive 4 hours of behind-the-wheel training from a licensed commercial
    driving school, and pass an extended driving test.
- id: 135
  category: penalties_and_points
  question: What is the penalty if you accumulate 18 points on your driving record
    within an 18-month period?
  choices:
    A: A 30-day suspension
    B: A 3-month suspension
    C: A 6-month suspension
    D: A 1-year suspension
  answer: B
  explanation: Accumulating 18 points within an 18-month period results in a 3-month
    suspension of your driving privileges.
- id: 136
  category: penalties_and_points
  question: How many points are added to your driving record for passing a stopped
    school bus (not resulting in serious injury or death)?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: According to the Common Violations and Associated Point Value table,
    passing a stopped school bus results in 4 points.
- id: 137
  category: penalties_and_points
  question: How many points are assessed if texting while driving results in a crash?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points added to the primary offense
    D: 9 points added to the primary offense
  answer: C
  explanation: If texting resulted in a crash, +6 points are added to the primary
    offense.
- id: 138
  category: penalties_and_points
  question: Which of the following violations will result in your license being SUSPENDED
    rather than revoked?
  choices:
    A: Failing to pay child support
    B: A felony for drug possession
    C: Racing on the highway
    D: Three cases of reckless driving within one year
  answer: A
  explanation: Failing to pay child support is listed under reasons your license will
    be suspended. Drug possession, racing, and three cases of reckless driving are
    reasons for revocation.
- id: 139
  category: license_system
  question: Under what circumstance can your driver's license be CANCELED?
  choices:
    A: You fail to pay a traffic fine.
    B: You give false information or identification.
    C: You are convicted of racing on the highway.
    D: You fail to stop for a school bus.
  answer: B
  explanation: Your license can be canceled (void and terminated) if you give false
    information or identification, if it was issued in error, or if you fail to complete
    a required school.
- id: 140
  category: penalties_and_points
  question: If you refuse to submit to a breath test and wish to appeal your administrative
    suspension, within how many days of your arrest must you apply for a hearing?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: If you refuse to submit to a breath, urine, or blood test and wish
    to appeal this suspension, you must apply for a formal or informal review hearing
    within 10 days of your date of arrest.
- id: 141
  category: safe_driving_rules
  question: What vehicle adjustment is recommended for older drivers who have difficulty
    turning their head to check blind spots?
  choices:
    A: Getting a steering knob
    B: Installing a larger side mirror
    C: Using an assistive device for the seatbelt
    D: Removing the rearview mirror
  answer: B
  explanation: The manual suggests that if you have difficulty turning your head to
    check blind spots, you should consider getting a larger side mirror.
- id: 142
  category: defensive_driving
  question: Which of the following is considered a risky driving time that older drivers
    are advised to avoid?
  choices:
    A: Mid-day traffic
    B: Driving on local residential streets
    C: Dusk, dawn, and nighttime
    D: Clear, sunny weather
  answer: C
  explanation: Older drivers are advised to avoid risky driving times, which include
    dusk, dawn, and nighttime, as well as bad weather, rush-hour traffic, and fast-paced
    highways.
- id: 143
  category: safe_driving_rules
  question: What are the three main categories of driver distraction?
  choices:
    A: Visual, Manual, and Cognitive
    B: Visual, Auditory, and Physical
    C: Mental, Physical, and Emotional
    D: Cognitive, Auditory, and Manual
  answer: A
  explanation: According to the manual, the three main categories of driver distraction
    are Visual (taking your eyes off the road), Manual (taking your hands off the
    steering wheel), and Cognitive (thinking about anything other than driving).
- id: 144
  category: safe_driving_rules
  question: Why is texting considered one of the most dangerous distracted driving
    behaviors?
  choices:
    A: It requires the driver to look down for at least 5 seconds.
    B: It involves visual, manual, and cognitive distractions simultaneously.
    C: It causes the driver to take both hands off the steering wheel.
    D: It is the only distraction that is illegal in Florida.
  answer: B
  explanation: The manual states that texting involves all three categories of distractions
    (visual, manual, and cognitive), making it one of the most dangerous of distracted
    driving behaviors.
- id: 145
  category: safe_driving_rules
  question: In Florida, it is illegal to operate a motor vehicle while using a wireless
    communications device in a handheld manner in which of the following areas?
  choices:
    A: Residential neighborhoods
    B: Interstate highways
    C: Designated school crossings, school zones, or work zones
    D: Any road with a speed limit under 30 mph
  answer: C
  explanation: Florida law prohibits a person from operating a motor vehicle while
    using a wireless communications device in a handheld manner in a designated school
    crossing, school zone, or work zone.
- id: 146
  category: alcohol_drugs_health
  question: What is the first thing affected after a person consumes an alcoholic
    beverage?
  choices:
    A: Reaction time
    B: Vision
    C: Judgment
    D: Balance
  answer: C
  explanation: The manual explicitly states that a person's judgment is the first
    thing affected after drinking an alcoholic beverage.
- id: 147
  category: penalties_and_points
  question: How long must a DUI (Driving Under the Influence) conviction remain on
    your driving record in Florida?
  choices:
    A: 10 years
    B: 25 years
    C: 50 years
    D: 75 years
  answer: D
  explanation: Because drinking alcohol and driving is so dangerous, the penalties
    are very tough. A DUI conviction must remain on your driving record for 75 years.
- id: 148
  category: defensive_driving
  question: To avoid drowsy driving on long trips, how often should you take a break?
  choices:
    A: Every 50 miles or 1 hour
    B: Every 100 miles or 2 hours
    C: Every 200 miles or 4 hours
    D: Only when you start to feel your eyes closing
  answer: B
  explanation: To avoid driving drowsy on long trips, the manual recommends taking
    a break every 100 miles or 2 hours.
- id: 149
  category: alcohol_drugs_health
  question: What is a likely consequence of mixing alcohol with allergy or cold medications?
  choices:
    A: The medication will cancel out the effects of the alcohol.
    B: It often multiplies the effects of the alcohol and drugs.
    C: It will only affect your vision, but not your judgment.
    D: The alcohol will prevent the medication from working.
  answer: B
  explanation: Alcohol and drugs should not be consumed at the same time. Mixing alcohol
    and drugs often multiplies the effects of the alcohol and drugs.
- id: 150
  category: defensive_driving
  question: If another driver is threatening you or intentionally driving dangerously
    around you, what should you do?
  choices:
    A: Make eye contact to show you are not intimidated.
    B: Speed up to stay ahead of them.
    C: Remain calm, put distance between you, and call *FHP or 911 if you need help.
    D: Flash your headlights and honk your horn to warn them.
  answer: C
  explanation: If another driver is threatening you, remain calm and try to put as
    much distance between you and them as possible. Slow down and let them pass. Do
    not make eye contact or obscene gestures. If you need help, call *FHP (*347) or
    911.
- id: 151
  category: vehicle_information
  question: If you are a non-resident who accepts employment or enrolls children in
    a Florida public school, how many days do you have to obtain a Florida registration
    certificate and license plate?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: Non-residents who accept employment or enroll children in a Florida
    public school must obtain the registration certificate and license plate within
    10 days after beginning employment or enrollment.
- id: 152
  category: vehicle_information
  question: Which of the following vehicles requires a Vehicle Identification Number
    (VIN) verification before it can be titled and registered in Florida?
  choices:
    A: A brand new vehicle purchased out-of-state
    B: A used vehicle previously titled or registered in another state
    C: A new mobile home
    D: A trailer with a weight of less than 2,000 pounds
  answer: B
  explanation: The VIN on any vehicle previously titled or registered in another state
    must be verified. VIN verification is not required on new vehicles, new/used mobile
    homes, or trailers with a weight of less than 2,000 pounds.
- id: 153
  category: vehicle_information
  question: For most privately owned vehicles, when does the vehicle registration
    expire?
  choices:
    A: On December 31st of each year
    B: At midnight on the birthday of the first owner listed on the registration
    C: Exactly one year from the date of purchase
    D: On June 30th of each year
  answer: B
  explanation: Registrations expire at midnight on the birthday of the first owner
    listed on the registration form, with exceptions for certain vehicles like mobile
    homes or company vehicles.
- id: 154
  category: vehicle_information
  question: How early can you renew your vehicle registration before its expiration
    date?
  choices:
    A: Up to 30 days prior
    B: Up to 60 days prior
    C: Up to 90 days prior
    D: Up to 120 days prior
  answer: C
  explanation: According to the manual, registrations may be renewed up to 90 days
    prior to the expiration date.
- id: 155
  category: driver_responsibility
  question: What is the purpose of the Florida Safe Mobility for Life program?
  choices:
    A: To provide free vehicle registration for low-income families.
    B: To improve the safety, access, and mobility needs of Florida’s aging road users.
    C: To train new teenage drivers on highway safety.
    D: To offer discounted auto insurance for drivers with clean records.
  answer: B
  explanation: The Florida Safe Mobility for Life program provides information and
    resources to raise awareness and to improve the safety, access, and mobility needs
    of Florida’s aging road users.
- id: 156
  category: alcohol_drugs_health
  question: How can illegal drugs and controlled substances, such as marijuana, affect
    a person's driving abilities?
  choices:
    A: They improve reaction time in emergency situations.
    B: They sharpen vision during nighttime driving.
    C: They can give a false sense of alertness and self-confidence or make a person
      drowsy.
    D: They only affect a driver if consumed with alcohol.
  answer: C
  explanation: Illegal drugs and controlled substances, such as marijuana, affect
    a person's reflexes, judgment, and alertness. They can give a person a false sense
    of alertness and self-confidence or make a person drowsy and unable to react.
- id: 157
  category: vehicle_information
  question: While most vehicle registrations expire on the owner's birthday, when
    do registrations for mobile homes and semi-trucks expire?
  choices:
    A: June 30
    B: September 30
    C: December 31
    D: March 31
  answer: C
  explanation: Registrations expire on the birthday of the first owner, except for
    mobile homes and semi-trucks/semi-trailers, which renew yearly by December 31.
- id: 158
  category: vehicle_information
  question: When do standard vehicle registrations typically expire in Florida?
  choices:
    A: At midnight on the birthday of the first owner listed on the registration
    B: On December 31st of each year
    C: On June 30th of each year
    D: Exactly one year from the date of purchase
  answer: A
  explanation: According to the manual, registrations expire at midnight on the birthday
    of the first owner listed on the registration form, with a few exceptions.
- id: 159
  category: vehicle_information
  question: What is the yearly registration renewal deadline for mobile homes and
    semi-trucks/semi-trailers?
  choices:
    A: June 30
    B: December 31
    C: The first owner's birthday
    D: January 1
  answer: B
  explanation: The manual states that mobile homes and semi-trucks/semi-trailers renew
    yearly by December 31.
- id: 160
  category: vehicle_information
  question: According to Florida equipment standards, how far ahead must low beam
    headlights show objects?
  choices:
    A: 150 feet
    B: 300 feet
    C: 450 feet
    D: 1,000 feet
  answer: A
  explanation: Low beam headlights must show objects 150 feet ahead and be visible
    from 1,000 feet.
- id: 161
  category: vehicle_information
  question: From what distance must your vehicle's brake lights be visible in the
    daytime?
  choices:
    A: 150 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: A vehicle must have two red brake lights that are visible from 300
    feet in the daytime.
- id: 162
  category: vehicle_information
  question: 'Your vehicle''s horn must be loud enough to be heard from a distance
    of:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: The equipment standards require a horn that can be heard from a distance
    of 200 feet.
- id: 163
  category: vehicle_information
  question: What is the minimum required tire tread depth for vehicles?
  choices:
    A: 1/16 of an inch
    B: 2/32 of an inch
    C: 3/32 of an inch
    D: 4/32 of an inch
  answer: C
  explanation: Tires should have a minimum tread of at least 3/32 of an inch or greater,
    and no worn spots showing the ply.
- id: 164
  category: vehicle_information
  question: Which of the following lighting equipment is NOT permitted on a standard
    civilian vehicle?
  choices:
    A: Amber directional signals
    B: White license plate lights
    C: Red lights visible from the front
    D: Two red taillights
  answer: C
  explanation: Red lights visible from the front or blue lights are not permitted,
    as they are for emergency/law enforcement vehicles only.
- id: 165
  category: safe_driving_rules
  question: Which of the following is strictly prohibited for a driver to wear while
    operating a vehicle?
  choices:
    A: Sunglasses
    B: A hat with a wide brim
    C: Headsets or headphones
    D: Prescription eyeglasses
  answer: C
  explanation: The manual lists 'Headsets/headphones worn by driver while operating
    a vehicle' under Equipment NOT Permitted.
- id: 166
  category: safe_driving_rules
  question: Which statement is true regarding the use of air bags in a vehicle?
  choices:
    A: They are a replacement for wearing a safety belt.
    B: They are designed to work with safety belts, not replace them.
    C: They eliminate the need for collision warning systems.
    D: They only deploy when conventional brakes fail.
  answer: B
  explanation: Air bags are designed to work with safety belts to protect occupants
    during a collision and are NOT a replacement for wearing a safety belt.
- id: 167
  category: vehicle_information
  question: What is the primary difference between Collision Warning Systems and Collision
    Intervention Systems?
  choices:
    A: Warning systems take action to avoid a crash, while intervention systems only
      alert the driver.
    B: Warning systems only alert the driver, while intervention systems take action
      to avoid a crash.
    C: Warning systems use cameras, while intervention systems use radar.
    D: Warning systems only work in reverse, while intervention systems work moving
      forward.
  answer: B
  explanation: Collision Warning Systems only provide warnings to drivers and do NOT
    take action to avoid a crash, whereas Collision Intervention Systems are designed
    to take action to avoid a crash.
- id: 168
  category: defensive_driving
  question: How should a driver use an Anti-lock Brake System (ABS) in an emergency
    situation?
  choices:
    A: Pump the brakes rapidly to avoid skidding.
    B: Press down hard on the brake pedal, hold it, and steer out of danger.
    C: Remove steady pressure from the brake pedal to engage the system.
    D: Lightly tap the brakes while turning the steering wheel sharply.
  answer: B
  explanation: Drivers with ABS need to press down hard on the brake pedal, hold it,
    and steer out of danger. Pumping the brakes will disengage the ABS.
- id: 169
  category: defensive_driving
  question: If your vehicle has conventional brakes (no ABS) and you lose traction
    in an emergency, what must you do to stop?
  choices:
    A: Press and hold the brake pedal firmly to the floor.
    B: Pump the brakes.
    C: Apply the parking brake immediately.
    D: Shift the vehicle into neutral and coast to a stop.
  answer: B
  explanation: Drivers with conventional brakes must pump the brakes in order to stop
    in an emergency situation where traction is lost and the vehicle slides.
- id: 170
  category: vehicle_information
  question: 'Bumper height limitations for automobiles and pickup trucks in Florida
    are governed by the vehicle''s:'
  choices:
    A: Modified or altered weight
    B: Gross vehicle weight rating (GVWR)
    C: Net shipping weight
    D: Passenger capacity
  answer: C
  explanation: Height limitations are governed by the net shipping weight of the vehicle,
    not the modified or altered weight.
- id: 171
  category: vehicle_information
  question: What is a potential consequence of tampering with your vehicle's emissions
    control devices?
  choices:
    A: Higher gas mileage
    B: Increased vehicle efficiency
    C: Lower air pollution
    D: Lower gas mileage and increased air pollution
  answer: D
  explanation: Tampering with pollution control devices can cause damage to your vehicle,
    increased air pollution, lower gas mileage, and less vehicle efficiency.
- id: 172
  category: vehicle_information
  question: Your vehicle must have at least one rear-view mirror that provides a view
    of the highway at least how far to the rear?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: C
  explanation: The equipment standards require at least one rear-view mirror with
    a view 200 feet to the rear.
- id: 173
  category: vehicle_information
  question: 'When towing another vehicle or trailer, the drawbar or towing connection
    must generally not be longer than:'
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: The drawbar/towing connection must not be more than 15 feet long unless
    you are towing poles, pipes, machinery, or other objects that cannot be easily
    taken apart.
- id: 174
  category: safe_driving_rules
  question: On a passenger vehicle, a load may not extend beyond the fenders on the
    left side or more than how many inches beyond the fenders on the right side?
  choices:
    A: 4 inches
    B: 6 inches
    C: 8 inches
    D: 12 inches
  answer: B
  explanation: Passenger vehicles must not be driven on any highway with a load extending
    beyond the fenders on the left side of the vehicle or extending more than 6 inches
    beyond the line of the fenders on the right side.
- id: 175
  category: safe_driving_rules
  question: 'During the day, if a load extends more than four feet beyond the rear
    of a vehicle, it must be marked with:'
  choices:
    A: Red flags at least 18 inches square
    B: White flags at least 12 inches square
    C: Two red lamps
    D: One amber strobe-type lamp
  answer: A
  explanation: During the day, red flags at least 18 inches square must mark the extremities
    of a load that extends beyond the sides of a vehicle and more than four feet beyond
    its rear.
- id: 176
  category: signs_and_signals
  question: What does a double solid white line on the roadway indicate?
  choices:
    A: You may cross to change lanes when safe.
    B: Crossing the line or changing lanes is not allowed.
    C: It separates lanes of traffic moving in opposite directions.
    D: You may cross only to pass a bicyclist.
  answer: B
  explanation: Double solid white lines separate lanes of traffic moving in the same
    direction, and crossing a double solid line or changing lanes is not allowed.
- id: 177
  category: signs_and_signals
  question: If you are driving on a road with double yellow lines where the line on
    your side is broken and the line on the left is solid, what are you permitted
    to do?
  choices:
    A: You may not pass under any circumstances.
    B: You may pass when it is safe to do so.
    C: You are in a reversible lane.
    D: You must turn left at the next intersection.
  answer: B
  explanation: When double yellow lines are broken on the right ('your side' of the
    line) and solid on the left, passing is permitted in this lane when safe to do
    so.
- id: 178
  category: sharing_the_road
  question: When are motorized vehicles allowed to drive in exclusive bike lanes?
  choices:
    A: When passing a slower vehicle.
    B: During rush hour traffic.
    C: They are never allowed to drive in bike lanes, but may cross them when turning.
    D: When the lane is marked with 'sharrows'.
  answer: C
  explanation: Motorized vehicles are not allowed to drive in bike lanes; they may
    cross over them when turning at intersections, but only when no bicyclists are
    present in the bike lane.
- id: 179
  category: signs_and_signals
  question: What type of information is indicated by a fluorescent yellow-green traffic
    sign?
  choices:
    A: Construction and maintenance warning
    B: Guide or directional information
    C: High emphasis warning of school, pedestrian, and bicycling activity
    D: Areas of public recreation and cultural significance
  answer: C
  explanation: Fluorescent Yellow Green signs provide a high emphasis warning of school,
    pedestrian, and bicycling activity.
- id: 180
  category: signs_and_signals
  question: Which color is used for traffic signs that direct you to areas of public
    recreation, cultural, and historical significance?
  choices:
    A: Blue
    B: Green
    C: Orange
    D: Brown
  answer: D
  explanation: Brown signs indicate areas of public recreation, cultural, and historical
    significance.
- id: 181
  category: signs_and_signals
  question: On green guide signs in Florida, what do even-numbered routes indicate?
  choices:
    A: North-South routes
    B: East-West routes
    C: Scenic routes
    D: Toll roads
  answer: B
  explanation: On green guide signs, East-West routes have even numbers and North-South
    routes have odd numbers.
- id: 182
  category: vehicle_information
  question: What brake requirement applies to a trailer or semitrailer weighing more
    than 3,000 pounds?
  choices:
    A: It does not require its own brakes.
    B: It must have brakes that can be operated by the driver in the towing vehicle.
    C: It only requires an emergency parking brake.
    D: It must have hydraulic brakes independent of the towing vehicle.
  answer: B
  explanation: A trailer or semitrailer weighing more than 3,000 pounds must have
    brakes that can be operated by the driver in the towing vehicle, designed to automatically
    stop the trailer if it breaks away.
- id: 183
  category: safe_driving_rules
  question: What must you use when hauling loads like dirt, sand, or gravel that could
    fall or blow onto the roadway?
  choices:
    A: Lock chains
    B: A white flag at least 12 inches square
    C: A close-fitting cover
    D: An amber strobe-type lamp
  answer: C
  explanation: You must use a close-fitting cover when hauling loads which could fall
    or blow onto the roadway (e.g., dirt, sand, gravel).
- id: 184
  category: signs_and_signals
  question: On a two-way roadway with a center lane marked for left turns, what is
    true about the center lane?
  choices:
    A: It can be used for passing slower vehicles.
    B: Drivers from either direction may use it for left turns.
    C: It is a reversible lane for rush-hour traffic.
    D: Only vehicles traveling North or East may use it.
  answer: B
  explanation: On a two-way roadway with a center lane, drivers from either direction
    may use the center lane for left turns; you must not use it for passing.
- id: 185
  category: signs_and_signals
  question: What does a yellow painted curb typically indicate?
  choices:
    A: A loading zone for commercial vehicles.
    B: A no parking zone near fire hydrants or intersections.
    C: A designated parking area for disabled drivers.
    D: A shared-use lane for bicycles.
  answer: B
  explanation: Curbs are often marked yellow to indicate no parking zones near fire
    hydrants or intersections.
- id: 186
  category: signs_and_signals
  question: What does a single solid yellow line along the side of the road mark?
  choices:
    A: The right edge of the roadway.
    B: A no-passing zone on a two-way street.
    C: The left edge of the roadway on divided highways and one-way streets.
    D: A bicycle lane.
  answer: C
  explanation: A single solid yellow line marks the left edge of the roadway on divided
    highways and one-way streets.
- id: 187
  category: signs_and_signals
  question: How are East-West routes numbered on Green Guide Signs in Florida?
  choices:
    A: With odd numbers
    B: With even numbers
    C: With letters
    D: With Roman numerals
  answer: B
  explanation: According to the manual, East-West routes have even numbers and North-South
    have odd numbers.
- id: 188
  category: signs_and_signals
  question: What type of information do brown and white signs provide to drivers?
  choices:
    A: Directions to services like gas and food
    B: Warnings about upcoming hazards
    C: Directions to scenic areas, parks, and historical sites
    D: Maximum safe speeds for exit ramps
  answer: C
  explanation: Brown and White Signs direct you to scenic areas, parks, and areas
    of cultural/historical significance.
- id: 189
  category: safe_driving_rules
  question: If two vehicles arrive at an All Way Stop at approximately the same time,
    who has the right-of-way?
  choices:
    A: The driver on the left must yield to the driver on the right.
    B: The driver on the right must yield to the driver on the left.
    C: The driver going straight must yield to the turning driver.
    D: The first driver to honk their horn has the right-of-way.
  answer: A
  explanation: At an All Way Stop, if vehicles arrive at approximately the same time,
    each driver must yield to the driver on their right.
- id: 190
  category: penalties_and_points
  question: In which of the following areas are speeding fines doubled?
  choices:
    A: Residential neighborhoods
    B: Active school and work zones
    C: Interstate highways
    D: Scenic routes
  answer: B
  explanation: The 'Speeding Fines Doubled' sign is posted in active school and work
    zones, and fines will be doubled if you are cited for speeding in these areas.
- id: 191
  category: sharing_the_road
  question: What must you do when entering a right turn lane if you encounter bicyclists
    traveling straight?
  choices:
    A: Honk to warn them to move out of the way.
    B: Speed up to pass them before turning.
    C: Yield to the bicyclists.
    D: Force them into the right turn lane with you.
  answer: C
  explanation: When entering a right turn lane, you may encounter bicyclists traveling
    straight; you must yield to the bicyclists.
- id: 192
  category: safe_driving_rules
  question: What is the rule for slower traffic regarding the left lane?
  choices:
    A: Slower traffic must stay in the left lane at all times.
    B: Slower traffic must move out of the left lane when being overtaken by a faster
      vehicle.
    C: Slower traffic can use the left lane if traveling at least 10 mph under the
      speed limit.
    D: Slower traffic is only allowed in the left lane during rush hour.
  answer: B
  explanation: Slower traffic must stay in the right lane unless passing and must
    move out of the left lane when being overtaken by a faster vehicle.
- id: 193
  category: signs_and_signals
  question: What is the normal shape and color of a warning sign?
  choices:
    A: Red and octagonal
    B: White and rectangular
    C: Yellow and diamond-shaped
    D: Green and square
  answer: C
  explanation: Warning signs are normally yellow and diamond-shaped. They alert drivers
    to conditions ahead and what to look out for.
- id: 194
  category: signs_and_signals
  question: What does the 'Divided Highway Ends' sign indicate?
  choices:
    A: The highway will merge into a single lane.
    B: The divided highway ends 350 to 500 feet ahead and you will be on a two-way
      roadway.
    C: You must exit the highway immediately.
    D: The speed limit will increase in 500 feet.
  answer: B
  explanation: The Divided Highway Ends sign indicates the divided highway ends 350
    to 500 feet ahead, and you will then be on a roadway with two-way traffic.
- id: 195
  category: vehicle_information
  question: What action should you be ready to take when you see a Hill/Downgrade
    warning sign?
  choices:
    A: Shift to a higher gear to increase speed.
    B: Shift to a lower gear to control speed.
    C: Turn off your engine to save fuel.
    D: Apply the parking brake immediately.
  answer: B
  explanation: The Hill/Downgrade sign means the road goes downhill ahead. You should
    slow down and be ready to shift to a lower gear to control speed.
- id: 196
  category: safe_driving_rules
  question: How should you treat an intersection if the traffic signal is out of order
    and no law enforcement is present?
  choices:
    A: Treat it as a yield sign.
    B: Proceed through without stopping if the road is clear.
    C: Treat the light/intersection as a four-way stop sign.
    D: Only stop if you are turning left.
  answer: C
  explanation: If a traffic signal is out of order and law enforcement is not present,
    treat the light/intersection as a four-way stop sign.
- id: 197
  category: safe_driving_rules
  question: Under what condition are you permitted to make a left turn on a red light?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from a one-way street onto a one-way street that has traffic moving
      to the left.
    C: When there is no oncoming traffic on a two-way street.
    D: Left turns on a red light are never permitted.
  answer: B
  explanation: After stopping at a red light, you may turn left from a one-way street
    onto a one-way street that has traffic moving to the left.
- id: 198
  category: defensive_driving
  question: What should you do when approaching an intersection and the traffic light
    turns yellow?
  choices:
    A: Speed up to clear the intersection quickly.
    B: Stop if you can safely do so.
    C: Honk your horn to warn crossing traffic.
    D: Swerve into the adjacent lane to avoid stopping.
  answer: B
  explanation: A yellow light is a warning that the light is changing to red. You
    should stop if you can safely do so, as it is extremely dangerous to be in an
    intersection when the light turns red.
- id: 199
  category: defensive_driving
  question: What precautions should you take when you see a 'Slippery Surface' sign
    in wet weather?
  choices:
    A: Speed up to maintain traction.
    B: Brake quickly if you need to stop.
    C: Drive slowly, don't speed up or brake quickly, and make turns at slow speeds.
    D: Shift into neutral while driving over the slippery surface.
  answer: C
  explanation: When encountering a Slippery Surface sign in wet weather, you should
    drive slowly, avoid speeding up or braking quickly, and make turns at slow speeds.
- id: 200
  category: signs_and_signals
  question: What is the purpose of a Center Turn Lane?
  choices:
    A: It is a passing lane for faster vehicles.
    B: It is shared, allowing left turns in both directions of travel.
    C: It is reserved exclusively for emergency vehicles.
    D: It is a dedicated lane for U-turns only.
  answer: B
  explanation: The Center Turn Lane is a shared lane that allows left turns in both
    directions of travel.
- id: 201
  category: safe_driving_rules
  question: What does the 'No Parking on Pavement' sign require you to do if you must
    stop?
  choices:
    A: Stop in the center lane with your hazard lights on.
    B: Park on the pavement only if you have a disabled permit.
    C: Always park off the pavement of the roadway.
    D: Stop on the pavement for no more than 5 minutes.
  answer: C
  explanation: The 'No Parking on Pavement' sign means that if you stop, you must
    always park off the pavement of the roadway.
- id: 202
  category: signs_and_signals
  question: How should you treat a flashing red traffic light at an intersection?
  choices:
    A: Yield to oncoming traffic without stopping.
    B: Treat it like a stop sign; stop and proceed when safe.
    C: Slow down and proceed with caution.
    D: Stop and wait for the light to turn green.
  answer: B
  explanation: A flashing red light is used at dangerous intersections. The manual
    states you must treat it like a stop sign; stop and proceed when safe.
- id: 203
  category: signs_and_signals
  question: What does a red X lane signal indicate?
  choices:
    A: The lane is reserved for emergency vehicles only.
    B: You must slow down and proceed with caution in this lane.
    C: The lane signal is about to turn yellow.
    D: You must never drive in a lane under a red X.
  answer: D
  explanation: 'Lane signals show which lanes are opened or closed. The manual explicitly
    states: "Red X. Never drive in a lane under the red X."'
- id: 204
  category: signs_and_signals
  question: What is the purpose of ramp signals?
  choices:
    A: To warn drivers of an upcoming toll booth.
    B: To control the rate of vehicles entering an expressway.
    C: To indicate that a drawbridge is in operation.
    D: To warn drivers of construction zones ahead.
  answer: B
  explanation: Ramp signals control the rate of vehicles entering an expressway and
    alternate between red and green.
- id: 205
  category: signs_and_signals
  question: In a construction zone, what do the downward sloping stripes on barricades
    and panel devices indicate?
  choices:
    A: The direction traffic must travel.
    B: The presence of a flagger ahead.
    C: That the lane is closed ahead.
    D: The location of a pedestrian crosswalk.
  answer: A
  explanation: Channeling devices alert drivers of unusual conditions. The manual
    notes that stripes on barricades and panel devices slope downward in the direction
    traffic must travel.
- id: 206
  category: signs_and_signals
  question: What should you do if you see a flashing yellow signal at a drawbridge?
  choices:
    A: Come to a complete stop at the marked stop line.
    B: Speed up to cross the bridge before it opens.
    C: Slow down and prepare to stop because the drawbridge is in operation.
    D: Proceed at your normal speed as the bridge is closed to marine traffic.
  answer: C
  explanation: When the yellow light is flashing at a drawbridge, it means the drawbridge
    is in operation. You must slow down and prepare to stop.
- id: 207
  category: sharing_the_road
  question: What should you do if you are already in the crosswalk when the DON'T
    WALK or raised hand signal begins flashing?
  choices:
    A: Stop and wait in the middle of the crosswalk.
    B: Quickly finish crossing the street.
    C: Turn around and return to the sidewalk you started from.
    D: Wait for the countdown signal to reach zero before moving.
  answer: B
  explanation: The manual states that if you are already in the crosswalk when the
    DON'T WALK or raised hand signal begins flashing, you should quickly finish crossing
    the street.
- id: 208
  category: signs_and_signals
  question: When approaching a Pedestrian Hybrid Beacon, what does a red flashing
    light indicate?
  choices:
    A: Stop and wait for the light to turn green.
    B: Proceed with caution; if no pedestrian is present and the intersection is clear,
      go.
    C: Slow down because a pedestrian has activated the push button.
    D: Stop for pedestrians in the crosswalk and remain stopped until the light turns
      off.
  answer: B
  explanation: At a Pedestrian Hybrid Beacon, if there is a red flashing light, you
    should proceed with caution. If no pedestrian is present and the intersection
    is clear, you may go.
- id: 209
  category: safe_driving_rules
  question: When stopping at a highway-railroad crossing, what is the minimum distance
    you must keep between your vehicle and the railroad tracks?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: B
  explanation: When approaching a highway-railroad crossing, you must slow down and
    be ready to stop. Do not stop on the railroad tracks or within 15 feet of the
    crossing.
- id: 210
  category: signs_and_signals
  question: What do the white roadway markings in the shape of connecting X's at a
    railroad crossing indicate?
  choices:
    A: A pedestrian crosswalk ahead.
    B: The dynamic envelope, which is a danger zone where road users should not stop.
    C: The location where you must stop if a train is approaching.
    D: A zone where passing is permitted.
  answer: B
  explanation: The Dynamic Envelope consists of white roadway markings in the shape
    of connecting X's used to visually highlight the danger zone where road users
    should not stop.
- id: 211
  category: sharing_the_road
  question: Why should you be especially prepared to stop when following buses or
    trucks near a railroad crossing?
  choices:
    A: They are required to stop at railroad crossings even when gates are up and
      lights are not flashing.
    B: They take longer to cross the tracks due to their size.
    C: They are not allowed to cross railroad tracks and must turn around.
    D: They must wait for a human flagger to guide them across.
  answer: A
  explanation: You should be prepared to stop especially when following buses or trucks
    because many are required to stop at railroad crossings even when gates are up
    and lights are not flashing.
- id: 212
  category: signs_and_signals
  question: What does a flashing yellow arrow mean at an intersection?
  choices:
    A: The light is about to turn red; stop immediately.
    B: Turns are allowed in the direction of the arrow, but you must yield to oncoming
      traffic and pedestrians.
    C: You have the right-of-way to turn; oncoming traffic has a red light.
    D: You may not turn in the direction of the arrow until the light turns green.
  answer: B
  explanation: A flashing yellow arrow means turns are allowed in the direction of
    the arrow, but oncoming traffic has a green light, so you must yield to oncoming
    traffic and pedestrians.
- id: 213
  category: signs_and_signals
  question: What is the purpose of the "School Bus Stop Ahead" sign?
  choices:
    A: To mark the end of a reduced speed school zone.
    B: To indicate that you must stop immediately for a school bus.
    C: To alert motorists of an upcoming school bus stop that may be unexpected or
      obscured.
    D: To warn drivers that children are currently crossing the road.
  answer: C
  explanation: The School Bus Stop Ahead sign is used to alert motorists of an upcoming
    school bus stop that may be unexpected or obscured by roadway geometry, such as
    a curve or hill.
- id: 214
  category: defensive_driving
  question: How should you approach an intersection with a solid green light?
  choices:
    A: Accelerate to clear the intersection quickly.
    B: Approach at a speed that will allow you to slow down if the light changes.
    C: Stop before entering the intersection to check for cross traffic.
    D: Maintain your speed, as you have the absolute right-of-way.
  answer: B
  explanation: When approaching a green light, you should go only if the intersection
    is clear, and approach at a speed that will allow you to slow down if the light
    changes.
- id: 215
  category: safe_driving_rules
  question: What is the rule regarding driving around or under a lowered railroad
    crossing gate?
  choices:
    A: It is permitted if you can clearly see that no train is approaching.
    B: It is permitted only for motorcycles and bicycles.
    C: It is against the law to drive around or under a crossing gate that is down
      or being opened/closed.
    D: It is allowed if the warning lights have stopped flashing.
  answer: C
  explanation: 'The manual explicitly states: "It''s against the law to drive around
    or under a crossing gate—either down or while being opened or closed."'
- id: 216
  category: vehicle_information
  question: If your vehicle's rear window is treated with a material that makes it
    non-transparent, what is legally required?
  choices:
    A: A backup camera with a 180-degree view.
    B: Side mirrors on both sides allowing a rearview of at least 200 feet.
    C: A warning beep that sounds when the vehicle is in reverse.
    D: A special permit from the Department of Highway Safety.
  answer: B
  explanation: According to the manual, if the rear window is covered by or treated
    with any material that makes it non-transparent, the vehicle must be equipped
    with side mirrors on both sides that allow the driver a rearview of at least 200
    feet.
- id: 217
  category: safe_driving_rules
  question: What is the recommended physical posture for a driver when backing up?
  choices:
    A: Keep both hands on the steering wheel and look at the backup camera.
    B: Place your left arm on the window sill and look in the side mirror.
    C: Place your right arm on the back of the passenger seat and turn around to look
      through the rear window.
    D: Lean forward and look exclusively through the rearview mirror.
  answer: C
  explanation: The manual instructs drivers to place their right arm on the back of
    the passenger seat and turn around so that they can look directly through the
    rear window when backing up.
- id: 218
  category: defensive_driving
  question: How does doubling your driving speed affect your braking distance and
    impact?
  choices:
    A: They are 2 times greater.
    B: They are 3 times greater.
    C: They are 4 times greater.
    D: They are 8 times greater.
  answer: C
  explanation: The manual states that doubling the speed means the braking distance
    and impact are 4 times greater.
- id: 219
  category: defensive_driving
  question: Which three components make up a vehicle's total stopping distance?
  choices:
    A: Visual distance, mechanical distance, and braking distance.
    B: Perception distance, reaction distance, and braking distance.
    C: Observation distance, reaction distance, and stopping distance.
    D: Blind spot distance, following distance, and braking distance.
  answer: B
  explanation: Total stopping distance is defined as the total minimum distance your
    vehicle will travel, which includes perception distance, reaction distance, and
    braking distance.
- id: 220
  category: safe_driving_rules
  question: What is the minimum recommended following distance during favorable weather
    and traffic conditions?
  choices:
    A: Two seconds.
    B: Three seconds.
    C: Four seconds.
    D: Six seconds.
  answer: C
  explanation: The manual advises to keep a minimum following distance of four seconds
    during favorable weather and traffic conditions.
- id: 221
  category: sharing_the_road
  question: What is the minimum legal following distance when driving behind a fire
    truck responding to an emergency?
  choices:
    A: 100 feet.
    B: 200 feet.
    C: 300 feet.
    D: 500 feet.
  answer: D
  explanation: It is against the law to follow a fire truck responding to an emergency
    closer than 500 feet.
- id: 222
  category: sharing_the_road
  question: Outside of cities or towns, what is the minimum following distance for
    a truck following another truck?
  choices:
    A: 100 feet.
    B: 200 feet.
    C: 300 feet.
    D: 500 feet.
  answer: C
  explanation: A truck or any vehicle towing another vehicle must not follow within
    300 feet of another truck or another vehicle in tow, except when passing or within
    cities or towns.
- id: 223
  category: safe_driving_rules
  question: What should you do if you and another vehicle arrive at an intersection
    at approximately the same time?
  choices:
    A: The larger vehicle has the right-of-way.
    B: The vehicle on the left must yield to the vehicle on the right.
    C: The vehicle on the right must yield to the vehicle on the left.
    D: The vehicle traveling faster has the right-of-way.
  answer: B
  explanation: If vehicles arrive at approximately the same time, each driver must
    yield to the drivers on their right.
- id: 224
  category: safe_driving_rules
  question: When entering an open intersection, in which of the following situations
    must you yield the right-of-way?
  choices:
    A: When you are traveling straight and another vehicle is turning right.
    B: When you enter a paved road from an unpaved road.
    C: When you enter an unpaved road from a paved road.
    D: When you are the first vehicle to arrive at the intersection.
  answer: B
  explanation: At an open intersection, you must yield the right-of-way if you enter
    a paved road from an unpaved road.
- id: 225
  category: safe_driving_rules
  question: In which direction does traffic flow in a roundabout?
  choices:
    A: Clockwise.
    B: Counter-clockwise.
    C: Both directions depending on the lane.
    D: Straight through the center.
  answer: B
  explanation: Roundabouts travel in a one-way, counter-clockwise direction.
- id: 226
  category: safe_driving_rules
  question: Which lane should you use if you want to make a U-turn in a multi-lane
    roundabout?
  choices:
    A: The right lane.
    B: The left lane.
    C: The center lane.
    D: The shoulder.
  answer: B
  explanation: In a multi-lane roundabout, to go straight or left, and to make a U-turn,
    you must use the left lane.
- id: 227
  category: defensive_driving
  question: What is the best way to check your blind spots before changing lanes?
  choices:
    A: Look exclusively in your rearview mirror.
    B: Check your side mirrors for at least three seconds.
    C: Turn your head to make sure the areas are clear.
    D: Rely on your vehicle's backup camera.
  answer: C
  explanation: Before you move to change lanes, pass, or make certain turns, you must
    turn your head to make sure your blind spots are clear.
- id: 228
  category: defensive_driving
  question: What should you do if another vehicle is following you too closely?
  choices:
    A: Speed up to increase the distance.
    B: Tap your brakes repeatedly to warn the driver.
    C: Slow down and keep to the right.
    D: Move to the left lane and maintain your speed.
  answer: C
  explanation: The manual states that if your vehicle is being followed too closely,
    you should slow down and keep to the right.
- id: 229
  category: defensive_driving
  question: If you triple your driving speed, how much greater will your braking distance
    and impact be?
  choices:
    A: 3 times greater.
    B: 6 times greater.
    C: 9 times greater.
    D: 12 times greater.
  answer: C
  explanation: Tripling the speed means the braking distance and impact are 9 times
    greater.
- id: 230
  category: safe_driving_rules
  question: At a two-way stop, who has the right-of-way when one vehicle is turning
    and another is going straight?
  choices:
    A: The turning vehicle must yield to the vehicle going straight.
    B: The vehicle going straight must yield to the turning vehicle.
    C: The vehicle that arrives second has the right-of-way.
    D: The vehicle on the left always has the right-of-way.
  answer: A
  explanation: At a two-way stop, the turning vehicle yields to the vehicle going
    straight.
- id: 231
  category: vehicle_information
  question: Which of the following vehicles are NOT allowed on limited-access highways?
  choices:
    A: Motor scooters with 150 cubic centimeter displacement or less
    B: Motorcycles with 250 cubic centimeter displacement
    C: Passenger vans
    D: Tow trucks
  answer: A
  explanation: Pedestrians, hitchhikers, bicycles, animal-drawn vehicles, and motor-driven
    cycles/motor scooters (with 150 cubic centimeter displacement or less) are not
    allowed on limited-access highways.
- id: 232
  category: safe_driving_rules
  question: What should you do if you reach the end of the acceleration lane when
    entering a limited access highway?
  choices:
    A: Stop immediately and wait for a gap in traffic
    B: Adjust your speed to safely merge into traffic
    C: Force your way into the right lane
    D: Back up and try entering the ramp again
  answer: B
  explanation: You should adjust your speed to safely merge into traffic when you
    reach the end of the acceleration lane. Do not stop unless traffic is too heavy
    and there is no space.
- id: 233
  category: defensive_driving
  question: What type of collision is considered the greatest danger on limited access
    highways?
  choices:
    A: Head-on collisions
    B: Rear-end collisions
    C: Side-swipe collisions
    D: Rollover crashes
  answer: B
  explanation: 'The manual states: ''Don’t follow too closely. Rear-end collisions
    are the greatest danger on limited access highways.'''
- id: 234
  category: sharing_the_road
  question: Under the Move Over Law, what must you do on a two-lane roadway when approaching
    a stationary emergency vehicle with flashing lights?
  choices:
    A: Vacate the lane closest to the vehicle
    B: Stop your vehicle completely until the emergency is resolved
    C: Slow down to 20 MPH below the posted speed limit
    D: Maintain your speed but honk your horn to alert the workers
  answer: C
  explanation: On a two-lane roadway, the Move Over Law requires you to slow down
    to 20 MPH below the posted speed limit.
- id: 235
  category: sharing_the_road
  question: If the posted speed limit is 20 MPH or less, how fast must you travel
    when passing a stationary utility vehicle with warning lights on a two-lane road?
  choices:
    A: 15 MPH
    B: 10 MPH
    C: 5 MPH
    D: You must stop completely
  answer: C
  explanation: On a two-lane roadway, if the speed limit is 20 MPH or less, you must
    travel at 5 MPH to comply with the Move Over Law.
- id: 236
  category: safe_driving_rules
  question: When parallel parking next to a curb, how close must your right-hand wheels
    be to the curb?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: B
  explanation: You must park parallel to the curb in the direction of traffic, with
    right-hand wheels parallel to and within 12 inches of the curb or side of roadway.
- id: 237
  category: safe_driving_rules
  question: Which way should you turn your steering wheel when parking uphill with
    a curb?
  choices:
    A: Turn wheels to the right
    B: Turn wheels to the curb
    C: Turn wheels away from the curb
    D: Keep wheels perfectly straight
  answer: C
  explanation: When parking uphill with a curb, you must turn your wheels away from
    the curb.
- id: 238
  category: safe_driving_rules
  question: It is against the law to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: It is against the law to park within 15 feet of a fire hydrant.
- id: 239
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to return to the right side
    of the road?
  choices:
    A: As soon as your front bumper clears the other vehicle
    B: When you can see the tires of the passed vehicle in your rear-view mirror
    C: After you have traveled 100 feet past the vehicle
    D: When the other driver flashes their headlights
  answer: B
  explanation: Do not return to the right side of the road until you can see the tires
    of the vehicle you passed in your rear-view mirror.
- id: 240
  category: safe_driving_rules
  question: You must return to the right side of the road before coming within how
    many feet of any approaching vehicle when passing?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: You must return to the right side of the road before coming within
    200 feet of any approaching vehicle.
- id: 241
  category: safe_driving_rules
  question: You must NOT pass on hills or curves where you cannot see at least how
    far ahead?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You must not pass on hills or curves where you can’t see at least 500
    feet ahead.
- id: 242
  category: sharing_the_road
  question: What does Florida law require you to do if you are driving in the left
    lane and are being overtaken from behind by a faster vehicle?
  choices:
    A: Increase your speed to match the overtaking vehicle
    B: Move out of the left lane
    C: Tap your brakes to warn the driver
    D: Turn on your hazard lights
  answer: B
  explanation: Florida Law states that a driver must move out of the left lane when
    being overtaken from behind by another vehicle traveling at a faster speed.
- id: 243
  category: safe_driving_rules
  question: Under what condition is passing on the right legally permitted?
  choices:
    A: When the vehicle ahead is driving too slowly in the right lane
    B: When you are driving on a single-lane road with a wide shoulder
    C: When the vehicle you are passing is making a left turn
    D: Passing on the right is never legal
  answer: C
  explanation: Passing on the right is only legal when there are two or more traffic
    lanes moving in the same direction or the vehicle you are passing is making a
    left turn.
- id: 244
  category: safe_driving_rules
  question: What is the standard speed limit in a municipal, business, or residential
    area in Florida?
  choices:
    A: 20 MPH
    B: 30 MPH
    C: 45 MPH
    D: 55 MPH
  answer: B
  explanation: According to the Florida Standard Speed Limits, the maximum speed in
    a municipal, business, or residential area is 30 MPH unless otherwise posted.
- id: 245
  category: defensive_driving
  question: What happens to the force of impact when you double the speed of a car?
  choices:
    A: It doubles.
    B: It triples.
    C: It increases four times.
    D: It increases nine times.
  answer: C
  explanation: The manual states that when you double the speed of a car, you increase
    its force of impact four times.
- id: 246
  category: safe_driving_rules
  question: What is the minimum speed limit on a highway where the posted speed limit
    is 70 MPH?
  choices:
    A: 40 MPH
    B: 45 MPH
    C: 50 MPH
    D: 55 MPH
  answer: C
  explanation: On highways, when the posted speed limit is 70 MPH, the minimum speed
    limit is 50 MPH.
- id: 247
  category: safe_driving_rules
  question: What is the center lane of a three-lane or five-lane highway used for?
  choices:
    A: Passing slower vehicles
    B: High Occupancy Vehicles (HOV)
    C: Emergency vehicles only
    D: Turning left only
  answer: D
  explanation: The center lane of a three-lane or five-lane highway is used only for
    turning left.
- id: 248
  category: signs_and_signals
  question: What does it mean if you see red reflectors facing you on the lane lines?
  choices:
    A: You are approaching a toll booth.
    B: You are on the wrong side of the road.
    C: The lane is closed for construction.
    D: You are approaching a stop line.
  answer: B
  explanation: If you see red reflectors facing you on the lane lines, you are on
    the wrong side of the road and could have a head-on collision.
- id: 249
  category: safe_driving_rules
  question: How far in advance must you give a turn signal before making a turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 150 feet
    D: At least 200 feet
  answer: B
  explanation: You must give a turn signal at least 100 feet BEFORE making your turn.
- id: 250
  category: safe_driving_rules
  question: Which of the following is true regarding the proper lane to finish a turn?
  choices:
    A: A left turn must always be completed in the leftmost lane.
    B: A right turn may be completed in any lawfully available lane.
    C: A right turn must be finished in the right lane of the roadway entered.
    D: You may use your directional signals to tell drivers behind you that they can
      pass.
  answer: C
  explanation: You must finish your turn in the proper lane. Turn right into the right
    lane of the roadway entered. A left turn may be completed in any lane lawfully
    available.
- id: 251
  category: safe_driving_rules
  question: When is it appropriate to use a three-point turn?
  choices:
    A: On a curve or hill where visibility is low.
    B: Only if the road is too narrow for a U-turn and you cannot go around the block.
    C: On a highway to quickly reverse direction.
    D: Whenever there is a sign that prohibits U-turns.
  answer: B
  explanation: Use a three-point turn only if the road is too narrow for a U-turn
    and you can’t go around the block. You must never make a three-point turn on a
    curve, a hill, the highway, or where U-turns are prohibited.
- id: 252
  category: defensive_driving
  question: What should you do if a collision with an animal is inevitable?
  choices:
    A: Swerve into oncoming traffic to avoid it.
    B: Swerve off the roadway into the shoulder.
    C: Do not swerve; keep your vehicle under control and on the roadway.
    D: Lock your brakes immediately to stop as fast as possible.
  answer: C
  explanation: If collision is inevitable, do not swerve to avoid the animal. Keep
    your vehicle under control and on the roadway, as swerving can result in a more
    serious crash.
- id: 253
  category: safe_driving_rules
  question: What lights should you use when driving in low visibility conditions such
    as fog or heavy rain?
  choices:
    A: Parking lights
    B: High beam headlights
    C: Low beam headlights
    D: Hazard lights
  answer: C
  explanation: Drive with lights on low beam. High beams will reflect off the fog
    and impair visibility even more. Parking lights are not a substitute.
- id: 254
  category: safe_driving_rules
  question: What must you do when you turn on your windshield wipers in the rain?
  choices:
    A: Turn on your hazard lights.
    B: Turn on your headlights.
    C: Increase your speed to clear the water from the tread.
    D: Shift into a lower gear.
  answer: B
  explanation: 'The manual states: ''When you turn on your windshield wipers, turn
    on your headlights.'''
- id: 255
  category: vehicle_information
  question: What should you do if your brakes become wet after driving in heavy rain
    and do not hold well?
  choices:
    A: Pump the brakes rapidly and forcefully.
    B: Pull over and wait for them to air dry.
    C: Slow down and gently push on the brake pedal until they work again.
    D: Drive at a higher speed to generate heat in the brake pads.
  answer: C
  explanation: If brakes become wet, they may pull to one side or not hold at all.
    If this happens, slow down and gently push on the brake pedal until your brakes
    are working again.
- id: 256
  category: safe_driving_rules
  question: Up to what distance can high beam headlights reveal objects?
  choices:
    A: 250 feet
    B: 300 feet
    C: 450 feet
    D: 500 feet
  answer: C
  explanation: High beam headlights can reveal objects up to a distance of at least
    450 feet and are most effective for speeds faster than 25 MPH.
- id: 257
  category: sharing_the_road
  question: Which vehicles are permitted to use High Occupancy Vehicle (HOV) lanes?
  choices:
    A: Any vehicle traveling over the speed limit.
    B: Vehicles with two or more occupants or registered hybrid/low emission vehicles.
    C: Commercial trucks and buses only.
    D: Vehicles preparing to make a left turn.
  answer: B
  explanation: Some highways reserve the left lane for vehicles with two or more occupants
    or hybrid/low emission vehicles (LEV).
- id: 258
  category: safe_driving_rules
  question: What should you do if you come to a flooded roadway?
  choices:
    A: Drive through slowly to avoid splashing.
    B: Turn around and find another route.
    C: Shift to a lower gear and proceed with caution.
    D: Wait for a larger vehicle to cross first and follow its path.
  answer: B
  explanation: If you come to a flooded roadway, turn around and find another route.
    Do not attempt to drive through the water, as your vehicle could become submerged
    or swept away.
- id: 259
  category: safe_driving_rules
  question: Under Florida law, you must not use high beam headlights within what distance
    of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: Florida law says you must not use high beam headlights within 500 feet
    of an oncoming vehicle; use low beam headlights.
- id: 260
  category: safe_driving_rules
  question: 'When driving behind another vehicle at night, you must switch to low
    beam headlights if you are within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: Florida law requires that you not use high beam headlights within 300
    feet of the vehicle ahead of you; use low beam headlights.
- id: 261
  category: safe_driving_rules
  question: Which of the following is true regarding the use of parking lights in
    Florida?
  choices:
    A: You may drive using only parking lights at dawn or dusk.
    B: You must turn them on when parking on a roadway outside of cities at night.
    C: They should be used instead of low beams in heavy fog.
    D: You must use them when approaching an oncoming vehicle.
  answer: B
  explanation: Florida law states you must turn on your parking lights at night when
    parking on a roadway or shoulder outside of cities and towns, and you must not
    drive using only parking lights in place of headlights.
- id: 262
  category: defensive_driving
  question: According to the manual, where do crashes happen more than any other place?
  choices:
    A: Highways
    B: Parking lots
    C: Intersections
    D: School zones
  answer: C
  explanation: You must use extra caution when approaching an intersection, because
    crashes happen at intersections more than any other place.
- id: 263
  category: defensive_driving
  question: If a crash is unavoidable, which of the following is the best defensive
    driving choice?
  choices:
    A: Swerve into oncoming traffic rather than off the road.
    B: Hit a solid object like a tree rather than a soft object.
    C: Hit a vehicle moving in the same direction rather than hitting a vehicle head-on.
    D: Skid off the road rather than driving off the road.
  answer: C
  explanation: If a crash is unavoidable, hitting a vehicle moving in the same direction
    as you is better than hitting a vehicle head-on.
- id: 264
  category: driver_responsibility
  question: What should you do if you are pulled over by law enforcement at night?
  choices:
    A: Turn off your headlights immediately.
    B: Turn on your interior lights to assist with visibility.
    C: Step out of the vehicle to greet the officer.
    D: Reach into your glove box for your registration before the officer approaches.
  answer: B
  explanation: During a traffic stop at night, you should turn on your interior lights
    to assist with visibility.
- id: 265
  category: penalties_and_points
  question: What does your signature on a traffic ticket signify?
  choices:
    A: An admission of guilt.
    B: A waiver of your right to a court hearing.
    C: Acceptance of the ticket, but not an admission of guilt.
    D: An agreement to pay the fine within 10 days.
  answer: C
  explanation: Your acceptance and signature on a traffic ticket is not an admission
    of guilt. However, the refusal to sign a traffic ticket may result in your arrest.
- id: 266
  category: driver_responsibility
  question: If you have a weapon in your vehicle during a traffic stop, when should
    you let the officer know?
  choices:
    A: Only if the officer asks to search the vehicle.
    B: Upon first contact with the officer.
    C: After handing over your driver's license and registration.
    D: You are not required to disclose this information.
  answer: B
  explanation: When the officer approaches the vehicle, remember to let the officer
    know if you have a weapon in the vehicle upon first contact.
- id: 267
  category: driver_responsibility
  question: What must you do if you are in a minor crash and your vehicle is blocking
    the flow of traffic?
  choices:
    A: Leave the vehicle exactly where it is until police arrive.
    B: Move it or have it moved.
    C: Wait for a tow truck before attempting to move it.
    D: Stand in the roadway to direct traffic around it.
  answer: B
  explanation: If the crash is minor and your vehicle is blocking the flow of traffic,
    you must move it or have it moved.
- id: 268
  category: driver_responsibility
  question: If a crash results in vehicle damage but does not require a law enforcement
    report, how long do you have to make a written report to FLHSMV?
  choices:
    A: 24 hours
    B: 3 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: If the crash results in vehicle or property damage and does not require
    a law enforcement report, you must make a written report of the crash to FLHSMV
    within 10 days.
- id: 269
  category: driver_responsibility
  question: If you crash into an unattended vehicle and cannot locate the owner, what
    must you do?
  choices:
    A: Wait by the vehicle until the owner returns.
    B: Leave a note with your name, contact info, and license plate number.
    C: Call your insurance company and leave the scene.
    D: Report it to the DMV within 30 days.
  answer: B
  explanation: If you can't locate the property owner, you must leave a note including
    your name, contact information, and license plate (registration) number.
- id: 270
  category: penalties_and_points
  question: What is the penalty for leaving the scene of a crash that results in death?
  choices:
    A: 1st degree felony and a minimum 4-year prison term.
    B: 2nd degree felony and a minimum 2-year prison term.
    C: 3rd degree felony and a 1-year license suspension.
    D: 1st degree misdemeanor and a $5,000 fine.
  answer: A
  explanation: If you leave the scene and it results in death, it is a 1st degree
    felony with a minimum 4-year prison term.
- id: 271
  category: penalties_and_points
  question: 'Leaving the scene of a crash resulting in injury, serious bodily injury,
    or death will result in losing your driver license for a minimum of:'
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: 5 years
  answer: C
  explanation: Leaving the scene of a crash resulting in injury, serious bodily injury,
    or death all include losing your driver license for 3 years minimum.
- id: 272
  category: safe_driving_rules
  question: How should you treat an injured person for shock after a crash?
  choices:
    A: Give them plenty of water to drink.
    B: Have them sit upright and keep them cool.
    C: Have them lie flat, elevate their legs, and cover them with blankets.
    D: Move them immediately to the side of the road.
  answer: C
  explanation: To treat for shock, have the person lie flat and elevate their legs,
    cover them with blankets to hold body heat, keep them calm, and do not give them
    anything to drink.
- id: 273
  category: defensive_driving
  question: What is the recommended minimum following distance to avoid rear-end collisions
    under normal conditions?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: To avoid striking the vehicle in front of you, keep at least four seconds
    following distance and increase it during unfavorable weather or heavy traffic.
- id: 274
  category: safe_driving_rules
  question: If your vehicle breaks down, how far in each direction should it be visible
    when parked?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: If possible, park where the disabled vehicle can be seen for 200 feet
    in each direction.
- id: 275
  category: vehicle_information
  question: How should you stop in an emergency situation if your vehicle is equipped
    with anti-lock brakes (ABS)?
  choices:
    A: Pump the brakes rapidly.
    B: Press down hard on the brake pedal, hold it, and steer out of danger.
    C: Lightly tap the brakes while steering.
    D: Apply the parking brake immediately.
  answer: B
  explanation: Drivers with anti-lock brakes (ABS) must press down hard on the brake
    pedal, hold it, and steer out of danger. If the driver pumps the brakes, the ABS
    will disengage.
- id: 276
  category: defensive_driving
  question: What should you NEVER do if you are trying to extinguish a vehicle fire?
  choices:
    A: Call 911 for assistance.
    B: Use a portable fire extinguisher.
    C: Apply water to a gasoline or diesel fire.
    D: Exit the vehicle immediately.
  answer: C
  explanation: Attempt to extinguish the fire only if you have a portable extinguisher
    and the fire is small. NEVER apply water to a gasoline or diesel fire.
- id: 277
  category: defensive_driving
  question: What is the first step you should take if your gas pedal becomes jammed?
  choices:
    A: Shut off the engine immediately.
    B: Slam on the brakes.
    C: Shift into park.
    D: Take your foot off the gas pedal.
  answer: D
  explanation: If your gas pedal jams, the first step is to take your foot off the
    gas pedal, followed by pressing the clutch or shifting into neutral.
- id: 278
  category: safe_driving_rules
  question: How should you treat an intersection where the traffic signals are inactive
    due to a power outage?
  choices:
    A: Treat it as a yield sign.
    B: Treat it as a four-way stop.
    C: Proceed without stopping if you are on the main road.
    D: Wait for law enforcement to arrive before crossing.
  answer: B
  explanation: In circumstances where the power is out and traffic signals are not
    active, treat intersections as a four-way stop.
- id: 279
  category: defensive_driving
  question: What should you do if your vehicle begins to skid or hydroplane?
  choices:
    A: Slam on the brakes immediately.
    B: Turn the front tires in the opposite direction of the skid.
    C: Take your foot off the gas pedal and steer in the direction of the skid.
    D: Accelerate to regain traction.
  answer: C
  explanation: If you skid or hydroplane, take your foot off the gas pedal, do not
    use your brakes if possible, and turn the vehicle's front tires in the direction
    you want to go (steer in the direction of the skid).
- id: 280
  category: defensive_driving
  question: If your vehicle stalls on railroad tracks and a train is approaching,
    in which direction should you run?
  choices:
    A: In the same direction the train is traveling.
    B: In a 45-degree angle away from the tracks, toward the train.
    C: In a 45-degree angle away from the tracks, away from the train.
    D: Perpendicular to the tracks.
  answer: B
  explanation: If a train is coming, run in a 45-degree angle away from the tracks,
    but in a direction toward the train; you will be less likely to be hit by your
    vehicle or debris from the collision.
- id: 281
  category: defensive_driving
  question: Approximately how long will a vehicle float on the surface if it crashes
    into a body of water?
  choices:
    A: 10 to 20 seconds
    B: 30 to 60 seconds
    C: 2 to 3 minutes
    D: 5 minutes
  answer: B
  explanation: If you crash into a pond, river, or other body of water, your vehicle
    will only float on the surface for 30–60 seconds. You must get out immediately.
- id: 282
  category: defensive_driving
  question: What is the proper response to a tire blowout?
  choices:
    A: Brake hard and steer to the shoulder.
    B: Take your foot off the gas, concentrate on steering, and brake softly when
      under control.
    C: Accelerate slightly to maintain momentum.
    D: Pump the brakes rapidly.
  answer: B
  explanation: During a tire blowout, take your foot off the gas, do not use the brakes,
    concentrate on steering, slow down gradually, and brake softly when the car is
    under control.
- id: 283
  category: vehicle_information
  question: How can you dry wet brakes?
  choices:
    A: Drive at a high speed to air-dry them.
    B: Shift into neutral and coast.
    C: Drive slowly in low gear and apply the brakes.
    D: Pump the brakes rapidly while stopped.
  answer: C
  explanation: You can dry wet brakes by driving slowly in low gear and applying the
    brakes.
- id: 284
  category: sharing_the_road
  question: What is the minimum amount of clearance Florida law requires motorists
    to give bicyclists when driving next to or passing them?
  choices:
    A: Two feet
    B: Three feet
    C: Four feet
    D: Five feet
  answer: B
  explanation: Florida law requires that you give bicyclists a minimum of three feet
    of clearance and use caution/slow speed when driving next to or passing them.
- id: 285
  category: sharing_the_road
  question: When you must cross into a bike lane to make a turn, what is the proper
    procedure?
  choices:
    A: Speed up to pass the bicyclist before turning.
    B: Honk your horn to warn the bicyclist to yield.
    C: Yield to any bicyclist and make your turn behind the bicyclist.
    D: Make your turn in front of the bicyclist.
  answer: C
  explanation: When you must cross into a bike lane to make a turn, yield to any bicyclist
    and make your turn behind the bicyclist.
- id: 286
  category: sharing_the_road
  question: Under what condition may a bicyclist use the full lane of travel?
  choices:
    A: Only when traveling at the exact speed limit.
    B: When the lane is too narrow for both a car and bicycle to share safely.
    C: Only on limited access highways.
    D: Whenever they prefer not to use the bike lane.
  answer: B
  explanation: A bicyclist may use the full lane even while traveling below the speed
    of traffic if the lane is too narrow for both a car and bicycle to share.
- id: 287
  category: sharing_the_road
  question: Between sunset and sunrise, what lighting is required on the rear of a
    bicycle?
  choices:
    A: A red reflector and a red light visible from 600 feet
    B: A white light visible from 500 feet
    C: A red light visible from 300 feet
    D: Flashing hazard lights
  answer: A
  explanation: The manual states that between sunset and sunrise, bicyclists must
    have a red reflector and a red light visible from 600 feet on the rear of their
    bicycle.
- id: 288
  category: safe_driving_rules
  question: What is the rule regarding wearing headphones while bicycling on the roadway?
  choices:
    A: They are permitted if the volume is kept low
    B: They are permitted only when riding on sidewalks
    C: Bicyclists must not wear headphones or earbuds in both ears
    D: Bicyclists may wear them if they are over 18 years of age
  answer: C
  explanation: According to the manual, bicyclists must not wear headphones/earbuds
    in both ears while bicycling on the roadway.
- id: 289
  category: sharing_the_road
  question: Why should you avoid passing a commercial motor vehicle (CMV) on a downgrade?
  choices:
    A: The CMV's brakes are more likely to fail on a downgrade
    B: The CMV's weight and momentum will cause it to increase speed
    C: The CMV driver cannot see you in their mirrors on a downgrade
    D: It is illegal to pass any vehicle on a downgrade
  answer: B
  explanation: The manual advises to avoid passing a CMV on a downgrade because its
    weight and momentum will cause it to increase speed.
- id: 290
  category: sharing_the_road
  question: 'When a commercial motor vehicle (CMV) is preparing to make a right turn,
    you should:'
  choices:
    A: Pass the CMV on the right side quickly
    B: Honk your horn to let the driver know you are there
    C: Not drive between the CMV and the curb
    D: Move into the left lane to pass them immediately
  answer: C
  explanation: CMVs often need to swing wide to the left in order to make a right
    turn. The manual warns not to drive between the CMV and the curb because they
    will not be able to see you.
- id: 291
  category: safe_driving_rules
  question: What must you do when an emergency vehicle using sirens or flashing lights
    approaches?
  choices:
    A: Slow down to 10 MPH and turn on your hazard lights
    B: Pull over to the closest edge of the roadway immediately and stop
    C: Stop exactly where you are in your current lane
    D: Speed up to clear the road ahead of the emergency vehicle
  answer: B
  explanation: Motorists must yield the right-of-way to emergency vehicles using sirens
    or flashing lights by pulling over to the closest edge of the roadway immediately
    and stopping until the vehicle has passed.
- id: 292
  category: sharing_the_road
  question: How do vehicles in a funeral procession signal to other drivers not to
    drive between them?
  choices:
    A: By honking their horns continuously
    B: By driving with their headlights on or using flashing hazard lights
    C: By placing a black flag on their vehicle's antenna
    D: By driving at exactly 15 MPH
  answer: B
  explanation: All vehicles in a funeral procession should have their headlights on
    or may use flashing hazard lights as a signal to others not to drive between the
    procession.
- id: 293
  category: license_system
  question: What is required for a person who is 18 years old or older to drive a
    golf cart on a public road?
  choices:
    A: A valid driver license only
    B: A commercial driver license
    C: A valid form of government-issued photographic identification
    D: A special golf cart permit
  answer: C
  explanation: The manual states that drivers 18 years old or older must possess a
    valid form of government-issued photographic identification to drive a golf cart
    on a public road.
- id: 294
  category: safe_driving_rules
  question: Under what conditions may a golf cart cross a state road?
  choices:
    A: If the speed limit is 55 MPH or less
    B: At any intersection regardless of traffic control devices
    C: Only if the golf cart has a top speed of 25 MPH
    D: If the posted speed limit is 45 MPH or less and at an intersection with a traffic
      control device
  answer: D
  explanation: You may cross state roads in a golf cart if the posted speed limit
    is 45 MPH or less and only at an intersection with a traffic control device.
- id: 295
  category: vehicle_information
  question: On what types of streets are low-speed vehicles (LSVs) allowed to operate?
  choices:
    A: Streets with a posted speed limit of 35 MPH or less
    B: Streets with a posted speed limit of 45 MPH or less
    C: Any street except interstate highways
    D: Only on private roads and golf courses
  answer: A
  explanation: Low-speed vehicles (LSVs) must only be operated on streets with a posted
    speed limit of 35 MPH or less.
- id: 296
  category: sharing_the_road
  question: Why should you not follow too closely behind a motorcycle?
  choices:
    A: Motorcycles frequently stall in heavy traffic
    B: They have the ability to stop more quickly than other vehicles
    C: The exhaust fumes can impair your visibility
    D: Motorcycles are required to drive below the speed limit
  answer: B
  explanation: The manual advises not to follow too closely behind a motorcycle because
    they have the ability to stop more quickly than other vehicles.
- id: 297
  category: defensive_driving
  question: How might a motorcyclist slow down without activating their brake light?
  choices:
    A: By applying the front brake only
    B: By dragging their feet on the ground
    C: By down-shifting or rolling off the throttle
    D: By turning off the engine
  answer: C
  explanation: Motorcyclists often slow down by down-shifting or rolling off the throttle,
    which does not activate the brake light.
- id: 298
  category: sharing_the_road
  question: When riding a bicycle on a sidewalk or crosswalk, what must the bicyclist
    do before passing a pedestrian?
  choices:
    A: Dismount and walk the bicycle past the pedestrian
    B: Give an audible signal before passing
    C: Flash their front white light
    D: Pass on the right side only
  answer: B
  explanation: Whether riding on a sidewalk or crosswalk, bicyclists must yield right-of-way
    to pedestrians and must give an audible signal before passing.
- id: 299
  category: safe_driving_rules
  question: What should you avoid doing when following a commercial motor vehicle
    (CMV) at night?
  choices:
    A: Driving in the right lane
    B: Using your high beam headlights
    C: Blinking your headlights to signal a pass
    D: Maintaining a four-second following distance
  answer: B
  explanation: You should not use high beam headlights when following a CMV at night
    because the bright lights will blind the driver when they reflect off the CMV’s
    large side mirrors.
- id: 300
  category: sharing_the_road
  question: What is the rule for motorists regarding sharing a lane with a motorcycle?
  choices:
    A: You may share the lane if the motorcycle is riding on the far right
    B: You may share the lane if you are driving a compact car
    C: You must not attempt to share a lane with a motorcycle
    D: You can share the lane during heavy traffic congestion
  answer: C
  explanation: Motorists must not attempt to share a lane with a motorcycle. The motorcyclist
    is entitled to the entire lane.
- id: 301
  category: safe_driving_rules
  question: What is required when a bicyclist is transporting a child who is under
    age four or weighs 40 pounds or less?
  choices:
    A: The child must ride on the handlebars
    B: The bicyclist must use a backpack/sling, child seat, or trailer designed to
      carry children
    C: The child must be able to reach the pedals
    D: The child must ride on a separate bicycle
  answer: B
  explanation: If transporting a child under age four or who weighs 40 pounds or less,
    bicyclists must use a backpack/sling, child seat, or trailer designed to carry
    children.
- id: 302
  category: license_system
  question: What is the minimum age required to operate a motorcycle or moped on a
    public road in Florida?
  choices:
    A: 15 years old
    B: 16 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: According to the manual, you must be 16 years of age or older to operate
    a motorcycle or moped on a public road.
- id: 303
  category: license_system
  question: What type of license is required to operate a moped?
  choices:
    A: A Motorcycle Only license
    B: A Class E driver license with a motorcycle endorsement
    C: A Class E driver license
    D: A Commercial Driver License
  answer: C
  explanation: Operators of mopeds must have a Class E driver license. A motorcycle
    endorsement is not required.
- id: 304
  category: safe_driving_rules
  question: Under what conditions is a motorcycle operator exempt from wearing a helmet?
  choices:
    A: If they are 18 or older and have a valid motorcycle endorsement
    B: If they are 21 or older AND carry a medical insurance policy providing at least
      $10,000 in medical benefits for injuries
    C: If they are driving under 30 MPH in a residential area
    D: If they carry Personal Injury Protection (PIP) insurance
  answer: B
  explanation: Operators of motorcycles must wear a helmet unless they are 21 or older
    AND carry a medical insurance policy providing for at least $10,000 in medical
    benefits for injuries.
- id: 305
  category: sharing_the_road
  question: What must you do if you approach a vehicle from the rear that is stopped
    at a crosswalk?
  choices:
    A: Honk your horn to alert the driver to move
    B: Pass the vehicle on the left if the lane is clear
    C: Assume a pedestrian may be crossing and do not overtake or pass the stopped
      vehicle
    D: Pass the vehicle slowly on the right side
  answer: C
  explanation: You may not overtake or pass a vehicle that's stopped at a crosswalk.
    A driver approaching from the rear must assume a pedestrian may be crossing, even
    when none can be seen.
- id: 306
  category: safe_driving_rules
  question: If a sidewalk is not available, where should a pedestrian walk on a roadway?
  choices:
    A: On the right shoulder, moving with traffic
    B: On the left shoulder, facing traffic
    C: In the center of the lane
    D: On either shoulder, as long as they wear reflective clothing
  answer: B
  explanation: When walking on a roadway without a sidewalk, pedestrians must always
    walk on the shoulder on the left side, facing traffic.
- id: 307
  category: sharing_the_road
  question: When must a driver yield the right-of-way to a public transit bus?
  choices:
    A: Whenever the bus is traveling in the opposite direction
    B: When the bus is traveling in the same direction, has signaled, and is reentering
      the traffic flow from a specifically designated pullout bay
    C: Only when the bus is displaying a flashing red stop signal
    D: Whenever the bus is stopped at a red light
  answer: B
  explanation: All drivers shall yield the right-of-way to public transit buses traveling
    in the same direction that have signaled and are reentering the traffic flow from
    a specifically designated pullout bay.
- id: 308
  category: safe_driving_rules
  question: When are you NOT required to stop for a school bus that is picking up
    or dropping off children?
  choices:
    A: When you are moving in the opposite direction on a highway divided by a raised
      barrier or unpaved median at least five feet wide
    B: When you are moving in the opposite direction on a highway divided by painted
      lines
    C: When you are moving in the same direction as the bus on a multi-lane highway
    D: When you are driving on a two-way street and the bus is on the other side
  answer: A
  explanation: If the highway is divided by a raised barrier or an unpaved median
    at least five feet wide, you do not have to stop if you are moving in the opposite
    direction of the bus.
- id: 309
  category: sharing_the_road
  question: Does a painted line or pavement marking on a highway count as a barrier
    that exempts drivers in the opposite direction from stopping for a school bus?
  choices:
    A: Yes, if the painted line is solid yellow
    B: Yes, if it is a double solid white line
    C: No, painted lines or pavement markings are not considered barriers
    D: Yes, as long as the road has at least four lanes
  answer: C
  explanation: Painted lines or pavement markings are not considered barriers. Drivers
    in the opposite direction must stop unless there is a raised barrier or unpaved
    median at least five feet wide.
- id: 310
  category: vehicle_information
  question: Farm vehicles designed for operation at speeds less than 25 MPH must display
    a slow-moving vehicle sign on the rear when using which of the following?
  choices:
    A: Limited access highways and interstates
    B: Public highways (not limited access/interstates)
    C: Bicycle paths and foot paths
    D: Private roads only
  answer: B
  explanation: Farm vehicles designed for operation at speeds less than 25 MPH must
    display this sign on the rear when using public highways (not limited access/interstates).
- id: 311
  category: sharing_the_road
  question: What must a driver do when approaching a visually impaired pedestrian
    carrying a white cane with a red tip?
  choices:
    A: Honk the horn to warn the pedestrian
    B: Slow down and pass carefully on the left
    C: Come to a complete stop, yield the right-of-way, and use extra caution
    D: Proceed at the normal speed limit if the pedestrian is not in a crosswalk
  answer: C
  explanation: Drivers must come to a complete stop, yield the right-of-way, and use
    extra caution when approaching a visually impaired pedestrian who is carrying
    a white cane with a red tip.
- id: 312
  category: vehicle_information
  question: Which type of insurance are operators of motorcycles and mopeds NOT required
    to carry in Florida?
  choices:
    A: Property Damage Liability
    B: Personal Injury Protection (PIP) insurance
    C: Bodily Injury Liability
    D: Collision insurance
  answer: B
  explanation: Operators of motorcycles and mopeds do not have to carry Personal Injury
    Protection (PIP) insurance.
- id: 313
  category: safe_driving_rules
  question: When children or school crossing guards are present in a crosswalk, where
    must a driver stop?
  choices:
    A: Inside the crosswalk
    B: At the stop line and not in the crosswalk
    C: At least 20 feet before the intersection
    D: Only if the crossing guard holds up a red stop sign
  answer: B
  explanation: When children or school crossing guards are present in a crosswalk,
    you must yield and stop at the stop line and not in the crosswalk.
- id: 314
  category: sharing_the_road
  question: What must you do when entering or leaving an alley, driveway, or private
    road?
  choices:
    A: Sound your horn and proceed without stopping
    B: Stop for pedestrians on the sidewalk
    C: Yield only to vehicles on the main road
    D: Flash your headlights to warn pedestrians
  answer: B
  explanation: When entering or leaving an alley, driveway, or private road, you must
    stop for pedestrians on the sidewalk.
- id: 315
  category: license_system
  question: If you are under 18, what is required before you can be issued a Motorcycle
    Only license?
  choices:
    A: You must hold a learner's license for 6 months with no moving violation convictions
    B: You must hold a learner's license for 12 months with no moving violation convictions
    C: You must have a parent riding with you at all times
    D: You must complete 50 hours of supervised driving
  answer: B
  explanation: If under 18, you must hold a learner’s license for 12 months with no
    moving violation convictions prior to the issuance of a Motorcycle Only license.
- id: 316
  category: safe_driving_rules
  question: What is the farthest away you can park from a curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: According to Florida parking rules, when you park parallel to a curb,
    your wheels must be no more than 12 inches away from the curb.
- id: 317
  category: safe_driving_rules
  question: Which way should you turn your wheels if parking downhill?
  choices:
    A: Toward the curb or edge of the road
    B: Away from the curb
    C: Straight ahead
    D: Slightly to the left
  answer: A
  explanation: When parking downhill, you must turn your wheels toward the curb or
    edge of the road so the vehicle will roll off the road if the brakes fail.
- id: 318
  category: sharing_the_road
  question: What is the minimum distance a motorist must give when traveling next
    to a cyclist?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: Florida law requires motorists to give a minimum of 3 feet of clearance
    when driving alongside or passing a bicyclist.
- id: 319
  category: sharing_the_road
  question: When a school bus is stopped to unload children on a highway divided with
    a raised barrier, are vehicles traveling in the opposite direction required to
    stop?
  choices:
    A: Yes, all traffic must stop for a school bus.
    B: Yes, unless they are in the far right lane.
    C: No, vehicles traveling in the opposite direction are not required to stop.
    D: No, but they must slow down to 15 mph.
  answer: C
  explanation: If the highway is divided by a raised barrier or an unpaved median
    at least 5 feet wide, vehicles traveling in the opposite direction of the school
    bus do not have to stop.
- id: 320
  category: sharing_the_road
  question: What is a 'No Zone'?
  choices:
    A: An area where parking is strictly prohibited.
    B: A zone where passing is illegal.
    C: The large blind spots around commercial vehicles and trucks.
    D: A school zone during active hours.
  answer: C
  explanation: A 'No Zone' refers to the large blind spots in the front, rear, and
    sides of a commercial vehicle or truck where the driver cannot see other vehicles.
- id: 321
  category: safe_driving_rules
  question: At night, within how many feet of approaching a vehicle from the rear
    must you dim your high beam headlights?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: You must dim your high beam headlights to low beams when you are within
    300 feet of a vehicle you are approaching from the rear.
- id: 322
  category: safe_driving_rules
  question: When driving in the rain, fog or smoke in the daytime, what lights should
    you use?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights
    D: Hazard lights
  answer: B
  explanation: You must use your low beam headlights when driving in rain, fog, or
    smoke during the daytime to increase visibility without causing glare.
- id: 323
  category: alcohol_drugs_health
  question: What are the penalties for refusing to take a blood test, a urine test,
    or a breath test when suspected of driving under the influence?
  choices:
    A: A warning for the first offense
    B: Automatic suspension of your driver license for one year
    C: A $500 fine and mandatory community service
    D: Immediate vehicle impoundment for 30 days
  answer: B
  explanation: Under Florida's Implied Consent law, refusing to take a breath, urine,
    or blood test when suspected of DUI will result in an automatic one-year suspension
    of your driver license.
- id: 324
  category: license_system
  question: If you have a learner's license, how many hours of driving experience
    are required to earn the Class E driver license?
  choices:
    A: 30 hours (5 at night)
    B: 40 hours (10 at night)
    C: 50 hours (10 at night)
    D: 60 hours (15 at night)
  answer: C
  explanation: A driver with a learner's license must complete 50 hours of driving
    experience, of which 10 hours must be at night, to earn a Class E driver license.
- id: 325
  category: license_system
  question: What education course are you required to take if you are applying for
    a learner's license (or have never held a driver license)?
  choices:
    A: Basic Driver Improvement Course
    B: Traffic Law and Substance Abuse Education (TLSAE)
    C: Advanced Defensive Driving Course
    D: Florida Highway Safety Course
  answer: B
  explanation: You must complete the Traffic Law and Substance Abuse Education (TLSAE)
    course before applying for a learner's license or if you have never held a driver
    license.
- id: 326
  category: license_system
  question: Which of the following services can be completed online at MyDMVPortal.flhsmv.gov?
  choices:
    A: Taking the physical driving skills exam
    B: Renewing or replacing your driver license
    C: Appealing a traffic ticket in court
    D: Inspecting your vehicle's emissions
  answer: B
  explanation: According to the Florida Department of Highway Safety and Motor Vehicles,
    you can renew or replace your driver license or identification card online at
    MyDMVPortal.flhsmv.gov.
- id: 327
  category: vehicle_information
  question: What mobile app allows customers to securely renew a registration on an
    eligible vehicle or vessel and receive proof of transaction?
  choices:
    A: FLHSMV Drive
    B: MyFlorida
    C: Florida DMV Mobile
    D: SunPass App
  answer: B
  explanation: The FLHSMV MyFlorida mobile app allows customers to securely renew
    a registration on an eligible vehicle or vessel and receive proof of transaction
    to use until the registration arrives in the mail.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 328
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 329
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 330
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 331
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 332
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 333
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 334
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 335
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 336
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 337
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 338
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 339
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 340
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 341
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
