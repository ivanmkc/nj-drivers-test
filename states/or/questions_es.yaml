questions:
- id: 1
  category: license_system
  question: A partir de mayo de 2025, ¿qué tipo de identificación se requiere para
    que las personas de 18 años o más aborden un vuelo comercial en los EE. UU.?
  choices:
    A: Una licencia de conducir estándar de Oregon
    B: Una forma de identificación aceptada a nivel federal
    C: Un permiso de instrucción estándar de Oregon
    D: Un certificado de nacimiento
  answer: B
  explanation: El manual establece que a partir de mayo de 2025, si tiene 18 años
    o más, necesita una forma de identificación aceptada a nivel federal para abordar
    un vuelo comercial en los EE. UU.
- id: 2
  category: license_system
  question: ¿Cuál de las siguientes NO es una forma de identificación aceptable para
    abordar un vuelo comercial en los EE. UU. a partir de mayo de 2025?
  choices:
    A: Pasaporte de los EE. UU.
    B: Licencia de conducir estándar de Oregon que no sea REAL ID
    C: Identificación militar de los EE. UU.
    D: Tarjeta de residente permanente
  answer: B
  explanation: Según el manual, una licencia de conducir, permiso de instrucción o
    tarjeta de identificación estándar de Oregon que no sea REAL ID ya no se aceptará
    para volar a partir de mayo de 2025.
- id: 3
  category: driver_responsibility
  question: ¿Puede citarse el Manual del Conductor de Oregon como precedente legal
    en un tribunal de justicia?
  choices:
    A: Sí, porque contiene el lenguaje exacto de los Estatutos Revisados de Oregon.
    B: Sí, pero solo en un tribunal de tránsito.
    C: No, no es una fuente de derecho y no debe utilizarse como precedente legal.
    D: No, a menos que una ordenanza del gobierno local lo apruebe.
  answer: C
  explanation: 'El manual establece explícitamente: ''Este manual no es una fuente
    de derecho y no debe utilizarse ni citarse como precedente legal en un tribunal
    de justicia u otro procedimiento administrativo o legal''.'
- id: 4
  category: safe_driving_rules
  question: Según el manual, ¿quién podría tener ordenanzas adicionales que no están
    cubiertas en el Manual del Conductor de Oregon?
  choices:
    A: Los gobiernos locales
    B: El gobierno federal
    C: Los estados vecinos
    D: Los propietarios de bienes privados
  answer: A
  explanation: El manual señala que 'Los gobiernos locales pueden tener ordenanzas
    adicionales no cubiertas en este manual'.
- id: 5
  category: driver_responsibility
  question: ¿Por qué se considera que los conductores nuevos corren mucho más riesgo
    en la carretera?
  choices:
    A: Porque conducen vehículos más antiguos
    B: Por su falta de experiencia al volante
    C: Porque no se les exige realizar un examen de la vista
    D: Porque conducen frecuentemente de noche
  answer: B
  explanation: 'El manual establece: ''Los conductores nuevos corren mucho más riesgo
    debido a su falta de experiencia al volante''.'
- id: 6
  category: safe_driving_rules
  question: Si está aprendiendo a conducir, ¿cuál es una de las mejores maneras de
    mejorar su seguridad?
  choices:
    A: Conducir solo durante las horas de luz diurna
    B: Comprar un vehículo nuevo
    C: Recibir instrucción útil y mucha práctica
    D: Leer el manual mientras conduce
  answer: C
  explanation: Según el manual, 'Si está aprendiendo a conducir, una de las mejores
    maneras de mejorar su seguridad es recibir instrucción útil y mucha práctica'.
- id: 7
  category: driver_responsibility
  question: 'El Manual del Conductor de Oregon enfatiza que conducir es:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio
    C: Un requisito para el empleo
    D: Un mandato federal
  answer: B
  explanation: 'El manual establece: ''Es importante recordar que conducir es un privilegio,
    y todos desempeñamos un papel para garantizar que todos se mantengan seguros en
    nuestras carreteras''.'
- id: 8
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes comportamientos se menciona explícitamente en
    el manual como algo que pone a todos en riesgo?
  choices:
    A: Conducir bajo los efectos después de consumir cannabis
    B: Escuchar la radio
    C: Conducir un vehículo de transmisión manual
    D: Compartir el viaje con amigos
  answer: A
  explanation: El manual advierte que 'Conducir bajo los efectos (después de beber
    alcohol, consumir cannabis o cualquier otra sustancia que altere su mente)...
    pone a todos en riesgo'.
- id: 9
  category: license_system
  question: ¿El Manual del Conductor de Oregon aborda los requisitos para obtener
    qué tipo de privilegio de conducir?
  choices:
    A: Comercial Clase A
    B: Comercial Clase B
    C: Clase C no comercial
    D: Endoso de motocicleta
  answer: C
  explanation: 'El manual establece: ''Este manual solo aborda los requisitos para
    obtener un privilegio de conducir Clase C no comercial''.'
- id: 10
  category: driver_testing
  question: Al solicitar un privilegio de conducir original, ¿qué tres cosas evaluará
    el DMV?
  choices:
    A: Audición, conocimientos de manejo y mantenimiento del vehículo
    B: Visión, conocimientos de manejo y habilidades de manejo
    C: Reflejos, visión y estacionamiento en paralelo
    D: Visión, historial médico y habilidades de manejo
  answer: B
  explanation: 'El manual establece: ''Para un privilegio de conducir original, el
    DMV evaluará su visión, conocimientos de manejo y habilidades de manejo''.'
- id: 11
  category: driver_testing
  question: Cada vez que tome un examen en el DMV, debe presentar prueba de identidad,
    fecha de nacimiento, ¿y qué más?
  choices:
    A: Dirección de residencia actual
    B: Prueba de seguro del vehículo
    C: Tarjeta de Seguro Social
    D: Certificado de notas de la escuela secundaria
  answer: A
  explanation: 'El manual requiere que: ''Cada vez que tome un examen, primero debe
    pagar la tarifa del examen y presentar prueba de identidad, fecha de nacimiento
    y dirección de residencia actual''.'
- id: 12
  category: driver_testing
  question: ¿Cómo debe pagar la tarifa de su examen del DMV?
  choices:
    A: Combinada con la tarifa de registro de su vehículo
    B: Separada de cualquier otra tarifa
    C: Solo con tarjeta de crédito
    D: Después de aprobar el examen
  answer: B
  explanation: 'El manual establece explícitamente: ''Debe pagar la tarifa de su examen
    separada de cualquier otra tarifa''.'
- id: 13
  category: driver_testing
  question: ¿Cuál es la tarifa por tomar el examen de la vista en el DMV de Oregon?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: No hay tarifa
  answer: D
  explanation: Según el manual, 'No hay tarifa por tomar el examen de la vista'.
- id: 14
  category: driver_testing
  question: ¿Qué sucede si toma el examen de la vista del DMV usando anteojos o lentes
    de contacto?
  choices:
    A: Se le pedirá que se los quite y vuelva a tomar el examen.
    B: Su privilegio de conducir indicará que se requieren lentes correctivos.
    C: Debe pagar una tarifa adicional por una licencia restringida.
    D: Reprobará automáticamente el examen de la vista.
  answer: B
  explanation: 'El manual establece: ''Si toma el examen usando anteojos o lentes
    de contacto, su privilegio de conducir indicará que se requieren lentes correctivos''.'
- id: 15
  category: driver_testing
  question: ¿Cuál es el siguiente paso si no aprueba el examen de la vista del DMV?
  choices:
    A: Debe esperar 30 días para volver a tomar el examen.
    B: Perderá permanentemente sus privilegios de conducir.
    C: El DMV le dará un formulario para que lo lleve a un especialista de la vista
      con licencia.
    D: Debe tomar un examen de habilidades de manejo especializado.
  answer: C
  explanation: 'El manual explica: ''Si no aprueba el examen de la vista, el DMV le
    dará un formulario para que lo lleve a un especialista de la vista con licencia''.'
- id: 16
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el Examen
    de Conocimientos de Clase C?
  choices:
    A: '25'
    B: '28'
    C: '30'
    D: '35'
  answer: B
  explanation: El Examen de Conocimientos de Clase C tiene 35 preguntas de opción
    múltiple, y debe responder 28 preguntas correctamente para obtener una calificación
    aprobatoria.
- id: 17
  category: penalties_and_points
  question: ¿Cuál es la sanción si se determina que está haciendo trampa en su examen
    de conocimientos en una oficina del DMV?
  choices:
    A: Reprobará y no podrá volver a tomar el examen por 30 días.
    B: Reprobará y no podrá volver a tomar el examen por 90 días.
    C: Debe pagar una multa y volver a tomar el examen de inmediato.
    D: Su permiso será revocado permanentemente.
  answer: B
  explanation: El manual establece que si se determina que está haciendo trampa, reprobará
    su examen y no se le permitirá volver a tomarlo por 90 días.
- id: 18
  category: driver_testing
  question: ¿Cuál de los siguientes dispositivos está permitido al tomar el examen
    de conocimientos en línea?
  choices:
    A: Un teléfono móvil
    B: Una tableta
    C: Una computadora de escritorio con cámara web
    D: Un dispositivo con pantalla táctil
  answer: C
  explanation: Para tomar el examen de conocimientos en línea, debe usar una computadora
    de escritorio o portátil con teclado, mouse y cámara web. No puede usar un dispositivo
    con pantalla táctil como teléfonos móviles o tabletas.
- id: 19
  category: driver_testing
  question: Si es menor de 18 años y toma el examen de conocimientos en línea, ¿cuáles
    son los requisitos para su supervisor (Proctor)?
  choices:
    A: Debe ser mayor de 18 años y puede supervisar un número ilimitado de exámenes.
    B: Debe ser mayor de 21 años y solo puede supervisar dos exámenes en un período
      de 24 horas.
    C: Debe ser un instructor de manejo con licencia.
    D: Debe ser un padre o tutor legal.
  answer: B
  explanation: Si es menor de 18 años, un supervisor (Proctor) mayor de 21 años debe
    supervisar el examen en línea, y un supervisor solo puede supervisar dos exámenes
    en un período de 24 horas.
- id: 20
  category: driver_testing
  question: ¿Cuál es el número máximo de veces que puede intentar el examen de conocimientos
    en línea antes de que se le exija tomarlo en una oficina del DMV?
  choices:
    A: Dos veces
    B: Tres veces
    C: Cuatro veces
    D: Cinco veces
  answer: C
  explanation: Puede tomar el examen en línea un total de cuatro veces. Después de
    cuatro intentos, debe tomar el examen en una oficina del DMV.
- id: 21
  category: driver_testing
  question: 'El DMV puede eximirle de la prueba de manejo si presenta prueba de que
    completó un curso de educación vial aprobado por el ODOT dentro de los últimos:'
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Cinco años
  answer: C
  explanation: El DMV puede eximirle de la prueba de manejo si recibe prueba de que
    completó un curso de educación vial aprobado por el ODOT dentro de los últimos
    dos años.
- id: 22
  category: driver_testing
  question: ¿Quién tiene permitido estar en el vehículo con usted durante una prueba
    de manejo?
  choices:
    A: Solo usted y el examinador
    B: Usted, el examinador y un traductor
    C: Usted, el examinador y un familiar
    D: Usted, el examinador y un conductor con licencia mayor de 21 años
  answer: A
  explanation: Solo usted y el examinador tienen permitido estar en el vehículo durante
    una prueba de manejo. No se permiten traductores, familiares, amigos ni mascotas.
- id: 23
  category: driver_testing
  question: Si no aprueba la prueba de manejo, ¿cuánto tiempo debe esperar antes de
    volver a tomarla?
  choices:
    A: Hasta más tarde el mismo día
    B: Hasta el siguiente día hábil
    C: Durante una semana completa
    D: Durante 30 días
  answer: B
  explanation: Si no aprueba la prueba de manejo, debe esperar hasta el siguiente
    día hábil antes de volver a tomarla.
- id: 24
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para el vehículo que utilice en
    su prueba de manejo?
  choices:
    A: Debe tener una cámara de reversa.
    B: La puerta del pasajero debe abrir y cerrar con una manija desde adentro y desde
      afuera.
    C: Debe tener menos de 10 años de antigüedad.
    D: Debe tener transmisión automática.
  answer: B
  explanation: El equipo del vehículo que debe estar en buen estado de funcionamiento
    para la prueba incluye una puerta del pasajero que abra y cierre con una manija
    desde adentro y desde afuera.
- id: 25
  category: license_system
  question: Si es menor de 18 años y solicita una licencia de conducir, ¿cuánto tiempo
    debe haber tenido un permiso antes de tomar la prueba de manejo?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 9 meses
    D: Al menos 1 año
  answer: B
  explanation: Debe haber tenido un permiso durante al menos 6 meses si es menor de
    18 años y solicita una licencia de conducir.
- id: 26
  category: signs_and_signals
  question: ¿Cuándo debe obedecer las señales, semáforos y marcas viales oficiales?
  choices:
    A: En todo momento, sin excepciones.
    B: Solo durante las horas de luz del día.
    C: A menos que vea a un oficial de policía o trabajador vial redirigiendo el tráfico.
    D: A menos que conduzca un vehículo de emergencia.
  answer: C
  explanation: Debe obedecer todas las señales, semáforos y marcas viales oficiales
    a menos que vea a un oficial de policía o trabajador vial redirigiendo el tráfico.
- id: 27
  category: signs_and_signals
  question: ¿De qué color son las señales de tráfico que prohíben ciertas acciones
    o movimientos?
  choices:
    A: Amarillo
    B: Naranja
    C: Rojo
    D: Blanco
  answer: C
  explanation: Las señales de tráfico que prohíben ciertas acciones o movimientos
    son de color rojo y aumentan la seguridad al controlar el flujo del tráfico a
    través de las intersecciones.
- id: 28
  category: signs_and_signals
  question: ¿Qué indica una señal de 'Giro a la derecha permitido sin detenerse' (Right
    Turn Permitted Without Stopping) cuando se coloca debajo de una señal de alto
    (Stop)?
  choices:
    A: Todo el tráfico puede continuar sin detenerse.
    B: El tráfico que gira a la derecha puede hacerlo sin detenerse, pero el resto
      del tráfico debe detenerse y ceder el paso.
    C: El tráfico que gira a la derecha debe detenerse, pero el tráfico que gira a
      la izquierda puede continuar.
    D: Solo puede girar a la derecha si el semáforo está en verde.
  answer: B
  explanation: Esta señal puede aparecer debajo de una señal de alto. El tráfico que
    gira a la derecha puede hacerlo sin detenerse. El resto del tráfico debe detenerse
    y ceder el derecho de paso.
- id: 29
  category: signs_and_signals
  question: ¿Qué indica una señal de Vehículo de Alta Ocupación (HOV, por sus siglas
    en inglés)?
  choices:
    A: El carril está reservado para camiones comerciales grandes.
    B: El carril está reservado para vehículos que transportan al menos dos o más
      personas.
    C: El carril está cerrado por construcción.
    D: El carril es solo para rebasar.
  answer: B
  explanation: Los carriles para Vehículos de Alta Ocupación (HOV) están reservados
    para vehículos que transportan al menos dos o más personas, como se indica en
    la señal.
- id: 30
  category: signs_and_signals
  question: ¿Qué indica un diamante blanco pintado en un carril de tráfico?
  choices:
    A: El carril es un carril designado para rebasar.
    B: El carril está reservado para vehículos que transportan al menos dos o más
      personas.
    C: El carril termina y los vehículos deben incorporarse.
    D: El carril es solo para vehículos de emergencia.
  answer: B
  explanation: Un diamante blanco pintado en un carril indica un carril para Vehículos
    de Alta Ocupación (HOV), el cual está reservado para vehículos que transportan
    al menos dos o más personas.
- id: 31
  category: signs_and_signals
  question: ¿De qué color son las señales de advertencia que le alertan sobre posibles
    peligros conocidos o cambios en las condiciones de la carretera?
  choices:
    A: Rojo
    B: Verde
    C: Amarillo
    D: Azul
  answer: C
  explanation: Las señales de advertencia son amarillas y le alertan sobre posibles
    peligros conocidos o un cambio en las condiciones de la carretera más adelante.
- id: 32
  category: signs_and_signals
  question: ¿Qué le indica a un conductor una señal de "Carril adicional" (Add Lane)?
  choices:
    A: Dos carreteras se unen y no es necesario incorporarse cediendo el paso.
    B: El carril indicado termina pronto y debe incorporarse.
    C: El tráfico se está incorporando desde el lado mostrado.
    D: Se está agregando un carril central de rebase a la carretera.
  answer: A
  explanation: Una señal de "Carril adicional" (Add Lane) indica que dos carreteras
    se unen y no es necesario incorporarse cediendo el paso.
- id: 33
  category: safe_driving_rules
  question: ¿Qué acción debe tomar al conducir a través de un Corredor de Seguridad
    (Safety Corridor) designado?
  choices:
    A: Reducir su velocidad a 15 mph.
    B: Encender sus luces por seguridad.
    C: Moverse al carril izquierdo.
    D: Tocar la bocina antes de entrar.
  answer: B
  explanation: Los corredores de seguridad son tramos designados de la carretera con
    más colisiones fatales y con lesiones graves. El manual indica a los conductores
    que enciendan sus luces por seguridad.
- id: 34
  category: signs_and_signals
  question: ¿Qué tipo de información proporcionan las señales de tráfico marrones?
  choices:
    A: Servicios para automovilistas, como gasolina y alojamiento.
    B: Información de salidas y direcciones a ciudades.
    C: Lugares históricos, culturales y recreativos.
    D: Advertencias sobre próximos peligros en la carretera.
  answer: C
  explanation: Las señales históricas, culturales y recreativas son marrones y señalan
    lugares históricos y culturales, áreas panorámicas, áreas de picnic y parques.
- id: 35
  category: signs_and_signals
  question: ¿Cómo debe proceder si se acerca a una intersección donde el semáforo
    está apagado debido a un corte de energía?
  choices:
    A: Avanzar por la intersección sin detenerse si la vía está despejada.
    B: Ceder el paso al tráfico a su derecha y avanzar.
    C: Detenerse como si hubiera señales de alto (stop) en todas las direcciones.
    D: Esperar a que llegue un oficial de policía antes de cruzar.
  answer: C
  explanation: Si un semáforo está apagado, como durante un corte de energía, debe
    detenerse como si hubiera señales de alto (stop) en todas las direcciones.
- id: 36
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite hacer un giro a la izquierda con un
    semáforo en rojo fijo?
  choices:
    A: Al girar desde una calle de doble sentido hacia otra calle de doble sentido.
    B: Al entrar a una calle de un solo sentido en la dirección de la calle de un
      solo sentido.
    C: Los giros a la izquierda con un semáforo en rojo fijo nunca están permitidos.
    D: Cuando hay un carril central designado para girar.
  answer: B
  explanation: Se le permite girar a la izquierda en rojo después de detenerse por
    completo al entrar a una calle de un solo sentido en la dirección de la calle
    de un solo sentido.
- id: 37
  category: signs_and_signals
  question: ¿Qué significa un semáforo con una flecha amarilla intermitente?
  choices:
    A: Usted tiene el derecho de paso para hacer el giro indicado.
    B: Debe detenerse y esperar una flecha verde.
    C: Puede hacer el movimiento indicado, pero primero debe ceder el paso a los peatones
      y al tráfico en sentido contrario.
    D: El semáforo está fuera de servicio y debe tratarlo como una parada de cuatro
      vías (four-way stop).
  answer: C
  explanation: Una flecha amarilla intermitente significa que puede hacer el movimiento
    indicado por la flecha, pero primero debe ceder el paso a los peatones y al tráfico
    en sentido contrario.
- id: 38
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones se le permite conducir por el lado
    izquierdo de la carretera?
  choices:
    A: Al acercarse a una curva ciega.
    B: Al conducir a la izquierda del centro para rebasar una obstrucción.
    C: Al prepararse para hacer un giro a la derecha.
    D: Al conducir en una zona residencial.
  answer: B
  explanation: Debe conducir por el lado derecho de la carretera excepto en situaciones
    específicas, como al conducir a la izquierda del centro para rebasar una obstrucción.
- id: 39
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de entrar o cruzar una carretera desde un callejón,
    entrada de vehículos (driveway) o estacionamiento que no esté controlado por señales
    o semáforos?
  choices:
    A: Detenerse y ceder el paso a los vehículos y peatones que se aproximan.
    B: Reducir la velocidad a 15 mph e incorporarse al tráfico.
    C: Tocar la bocina para advertir al tráfico en sentido contrario.
    D: Ceder el paso solo a los vehículos que se aproximan por la derecha.
  answer: A
  explanation: Debe detenerse antes de entrar o cruzar una carretera desde un callejón,
    entrada de vehículos o estacionamiento no controlado por señales o semáforos,
    y ceder el paso a los vehículos y peatones que se aproximan.
- id: 40
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad legal al conducir en callejones o áreas
    residenciales estrechas, a menos que se indique lo contrario?
  choices:
    A: 10 millas por hora (mph)
    B: 15 millas por hora (mph)
    C: 20 millas por hora (mph)
    D: 25 millas por hora (mph)
  answer: B
  explanation: El límite de velocidad está establecido por ley en 15 millas por hora
    al conducir en callejones y áreas residenciales estrechas.
- id: 41
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en parques públicos y zonas residenciales?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 30 millas por hora
  answer: C
  explanation: El límite de velocidad es de 25 millas por hora en zonas residenciales,
    parques públicos y en las costas del océano.
- id: 42
  category: signs_and_signals
  question: ¿Qué tipo de señal es azul y le informa sobre servicios o instalaciones
    a lo largo de la carretera, como gasolina, comida o un hospital?
  choices:
    A: Señales de ruta
    B: Señales de guía
    C: Señales de advertencia
    D: Señales de servicios para automovilistas
  answer: D
  explanation: Las señales de servicios para automovilistas son señales azules que
    le informan sobre servicios o instalaciones a lo largo de la carretera, incluyendo
    gasolina, comida, alojamiento y hospitales.
- id: 43
  category: safe_driving_rules
  question: ¿Cómo debe posicionar su vehículo al conducir en una carretera sin línea
    central donde el tráfico se mueve en direcciones opuestas?
  choices:
    A: Conducir completamente en el centro de la carretera hasta que se acerque otro
      vehículo.
    B: Ceder al menos la mitad de la carretera al tráfico en sentido contrario.
    C: Conducir en el extremo izquierdo de la carretera.
    D: Hacerse a un lado y detenerse cada vez que se acerque un vehículo.
  answer: B
  explanation: Cuando una carretera no tiene línea central y el tráfico se mueve en
    direcciones opuestas, los conductores deben ceder al menos la mitad de la carretera
    al tráfico en sentido contrario.
- id: 44
  category: signs_and_signals
  question: ¿Cuál es la respuesta adecuada ante un semáforo con luz amarilla intermitente?
  choices:
    A: Detenerse por completo antes de continuar.
    B: Acelerar para despejar la intersección rápidamente.
    C: Reducir la velocidad y continuar con precaución.
    D: Tratar la intersección como una parada de cuatro vías (four-way stop).
  answer: C
  explanation: Una luz amarilla intermitente significa reducir la velocidad y continuar
    con precaución.
- id: 45
  category: safe_driving_rules
  question: ¿En cuál de las siguientes áreas el límite de velocidad es de 20 millas
    por hora a menos que se indique lo contrario?
  choices:
    A: Parques públicos
    B: Cualquier zona comercial
    C: Costas del océano
    D: Todas las calles y carreteras que no cumplan con ninguna otra definición
  answer: B
  explanation: El manual establece que el límite de velocidad es de 20 millas por
    hora en cualquier zona comercial y dentro de una zona escolar.
- id: 46
  category: signs_and_signals
  question: ¿Cuál es la principal diferencia entre una señal de velocidad recomendada
    variable y una señal de límite de velocidad variable?
  choices:
    A: Las señales recomendadas son blancas y negras, mientras que las señales de
      límite son amarillas.
    B: Las señales recomendadas sugieren una velocidad basada en las condiciones,
      mientras que las señales de límite cambian el límite de velocidad obligatorio
      según las condiciones.
    C: Las señales recomendadas solo se aplican de noche, mientras que las señales
      de límite se aplican de día.
    D: Las señales recomendadas se hacen cumplir como cualquier otra señal de límite
      de velocidad, mientras que las señales de límite solo se hacen cumplir a través
      de la ley de la regla básica.
  answer: B
  explanation: Las señales de velocidad recomendada variable son amarillas y sugieren
    una velocidad basada en las condiciones de manejo. Las señales de límite de velocidad
    variable son blancas y negras y realmente cambian el límite de velocidad según
    las condiciones de manejo, el cual la policía hace cumplir como cualquier otra
    señal de límite de velocidad.
- id: 47
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la Ley
    de la Regla Básica (Basic Rule Law) de Oregon?
  choices:
    A: Le permite conducir por encima del límite de velocidad si el clima está despejado
      y el tráfico es ligero.
    B: Solo se aplica en autopistas interestatales y en zonas comerciales.
    C: Establece que debe conducir a una velocidad que sea razonable y prudente para
      las condiciones existentes.
    D: Requiere que conduzca al límite de velocidad indicado independientemente del
      clima o la visibilidad.
  answer: C
  explanation: La regla básica establece que debe conducir a una velocidad que sea
    razonable y prudente para las condiciones existentes. Se aplica en todas las carreteras
    en todo momento y no le permite conducir por encima del límite de velocidad.
- id: 48
  category: sharing_the_road
  question: Si conduce más lento que la velocidad normal del tráfico y se acumula
    congestión detrás de usted, ¿qué debe hacer?
  choices:
    A: Acelerar para igualar el flujo del tráfico, incluso si excede el límite indicado.
    B: Moverse al carril izquierdo para permitir que los vehículos pasen por la derecha.
    C: Salir de la carretera en la primera área segura y dejar pasar al tráfico detrás
      de usted.
    D: Encender las luces de emergencia y continuar conduciendo en su carril actual.
  answer: C
  explanation: 'El manual establece: "Esté atento a la congestión detrás de usted
    si conduce más lento que la velocidad designada. Salga de la carretera en la primera
    área segura y deje pasar al tráfico detrás de usted".'
- id: 49
  category: defensive_driving
  question: Según los datos del manual sobre la velocidad del vehículo y las muertes
    de peatones, ¿qué riesgo de muerte tiene un peatón atropellado por un vehículo
    que viaja a 42 mph?
  choices:
    A: 10% de riesgo de muerte
    B: 25% de riesgo de muerte
    C: 50% de riesgo de muerte
    D: 90% de riesgo de muerte
  answer: C
  explanation: La tabla del manual muestra que un peatón atropellado por un vehículo
    que viaja a 42 mph tiene un 50% de riesgo de muerte.
- id: 50
  category: signs_and_signals
  question: ¿Qué indica una doble línea amarilla continua?
  choices:
    A: Se permite rebasar en ambas direcciones del tráfico.
    B: No se permite rebasar, pero puede girar a la izquierda cruzando las líneas
      para entrar o salir de una vía.
    C: Se está acercando a una calle de un solo sentido.
    D: Puede usar el carril central para rebasar a vehículos que se mueven lentamente.
  answer: B
  explanation: Una doble línea amarilla continua indica que no se permite rebasar
    en ninguna de las dos direcciones del tráfico. Sin embargo, puede girar a la izquierda
    para entrar o salir de una vía cruzando las dobles líneas amarillas continuas
    después de esperar a que el tráfico en sentido contrario se despeje.
- id: 51
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla para usar un carril especial de giro
    a la izquierda de doble sentido?
  choices:
    A: Puede usar el carril para rebasar al tráfico que se mueve lentamente.
    B: Debe circular por el carril durante al menos 200 pies antes de girar.
    C: Es ilegal circular por un carril de giro a la izquierda de doble sentido, así
      que ingrese al carril justo antes de querer hacer el giro.
    D: Puede estacionarse en este carril si su vehículo está averiado.
  answer: C
  explanation: 'El manual establece: "Es ilegal circular por un carril de giro a la
    izquierda de doble sentido, así que ingrese al carril justo antes de querer hacer
    el giro".'
- id: 52
  category: signs_and_signals
  question: ¿Cuál es la regla con respecto a una mediana pintada con líneas amarillas
    continuas dobles en ambos lados?
  choices:
    A: Puede usarla como carril de giro.
    B: Puede hacer un giro a la izquierda cruzándola después de esperar a que el tráfico
      en sentido contrario se despeje.
    C: Se le permite circular por la mediana si los carriles principales están congestionados.
    D: Es ilegal girar cruzando una mediana pintada bajo cualquier circunstancia.
  answer: B
  explanation: Una mediana pintada con líneas amarillas continuas dobles marca el
    área entre dos direcciones de circulación. Puede hacer un giro a la izquierda
    cruzando una mediana pintada después de esperar a que el tráfico en sentido contrario
    se despeje, pero no puede usarla como carril de giro ni circular por ella.
- id: 53
  category: signs_and_signals
  question: ¿Qué indica una línea blanca continua ancha y cuál es la regla para cruzarla?
  choices:
    A: Separa el tráfico que se mueve en direcciones opuestas; cruzarla está estrictamente
      prohibido.
    B: Marca un cruce peatonal; solo se permite cruzar cuando está despejado.
    C: Se usa para dirigir el tráfico hacia carriles específicos; se permite cruzarla,
      pero no se recomienda.
    D: Indica un carril exclusivo para transporte público; cruzarla es ilegal.
  answer: C
  explanation: Una línea blanca continua ancha se usa para dirigir el tráfico hacia
    carriles específicos (como carriles de giro) y separar carriles para bicicletas.
    Se permite cruzar una línea blanca continua ancha, pero no se recomienda.
- id: 54
  category: signs_and_signals
  question: Cuando se usa una línea blanca punteada antes de una rampa de salida o
    intersección, ¿qué le informa al conductor?
  choices:
    A: El carril por el que circula no continuará en la misma ruta.
    B: Se está acercando a una zona escolar.
    C: Está prohibido rebasar durante la próxima milla.
    D: Debe detenerse por completo.
  answer: A
  explanation: Cuando se usa antes de una rampa de salida o intersección, una línea
    blanca punteada le informa que el carril por el que circula no continuará en la
    misma ruta, como un carril exclusivo para girar a la derecha o un carril de solo
    salida.
- id: 55
  category: signs_and_signals
  question: ¿Cómo se marca una línea de ceder el paso en el pavimento?
  choices:
    A: Una línea blanca continua que cruza el carril.
    B: Una fila de triángulos en su carril, apuntando hacia su vehículo.
    C: Galones (cheurones) blancos pintados en el centro del carril.
    D: Una línea blanca ancha con el símbolo de una bicicleta.
  answer: B
  explanation: Una línea de ceder el paso se define como una fila de triángulos en
    su carril, apuntando hacia su vehículo para indicar el punto en el que se le exige
    ceder el paso.
- id: 56
  category: signs_and_signals
  question: ¿Qué indican las líneas rojas rayadas en la carretera?
  choices:
    A: Un carril exclusivo para vehículos de emergencia.
    B: Un área donde está estrictamente prohibido rebasar.
    C: Un carril exclusivo para transporte público al que los automóviles nunca pueden
      ingresar.
    D: Áreas donde puede ingresar a un carril exclusivo para transporte público (Transit
      Only) para girar, estacionarse o entrar a una entrada de vehículos.
  answer: D
  explanation: Las líneas rojas rayadas muestran dónde puede ingresar al carril exclusivo
    para transporte público (Transit Only) para girar, estacionarse o entrar a una
    entrada de vehículos.
- id: 57
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento segura recomendada para velocidades
    superiores a 30 mph?
  choices:
    A: 1 a 2 segundos
    B: 2 a 3 segundos
    C: 3 segundos exactamente
    D: 4 segundos o más
  answer: D
  explanation: 'El manual establece: "Para velocidades superiores a 30 mph, una distancia
    de seguimiento segura debe ser de 4 segundos o más para permitirle tiempo para
    tomar una decisión y actuar".'
- id: 58
  category: penalties_and_points
  question: ¿Cómo define el manual del conductor de Oregon las carreras ilegales en
    una carretera?
  choices:
    A: Conducir a más de 15 mph por encima del límite de velocidad publicado.
    B: Cualquier competencia de aceleración o velocidad, o el establecimiento de un
      récord de velocidad.
    C: Rebasar a más de tres vehículos en una sola maniobra.
    D: Conducir más rápido que la velocidad normal del tráfico en el carril izquierdo.
  answer: B
  explanation: 'El manual establece: "Es ilegal hacer carreras en cualquier carretera.
    Una carrera puede ser cualquier competencia de aceleración o velocidad, o el establecimiento
    de un récord de velocidad".'
- id: 59
  category: safe_driving_rules
  question: ¿Qué se define como una distancia de seguimiento segura en condiciones
    normales para velocidades de 30 mph o menos?
  choices:
    A: 1-2 segundos
    B: 2-4 segundos
    C: 4-6 segundos
    D: 5-7 segundos
  answer: B
  explanation: Según el manual, una distancia de seguimiento segura se define como
    2-4 segundos.
- id: 60
  category: safe_driving_rules
  question: Si viaja a una velocidad superior a 30 mph, ¿cuál debería ser su distancia
    de seguimiento?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos o más
    D: 1 segundo por cada 10 mph
  answer: C
  explanation: Para velocidades superiores a 30 mph, una distancia de seguimiento
    segura debe ser de 4 segundos o más para permitirle tiempo para tomar una decisión
    y actuar.
- id: 61
  category: defensive_driving
  question: Al detenerse detrás de otro vehículo, ¿cuánto espacio debe dejar?
  choices:
    A: Suficiente para ver dónde las llantas traseras del vehículo de adelante tocan
      el camino
    B: Al menos la longitud de un automóvil completo
    C: Suficiente para ver la placa del vehículo
    D: Tres pies de distancia
  answer: A
  explanation: Al detenerse detrás de otro vehículo, asegúrese de poder ver dónde
    las llantas traseras del vehículo de adelante tocan el camino.
- id: 62
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo detrás de usted lo sigue demasiado de cerca
    y no puede cambiarse al carril derecho?
  choices:
    A: Frenar bruscamente para disuadirlo de seguirlo de cerca
    B: Reducir lentamente su velocidad
    C: Acelerar para aumentar la distancia
    D: Encender las luces intermitentes de emergencia
  answer: B
  explanation: Si un vehículo detrás de usted lo sigue demasiado de cerca y no puede
    cambiarse de carril, reduzca lentamente su velocidad. Esto puede animar al vehículo
    a rebasarlo o a dejar de seguirlo tan de cerca. Nunca frene bruscamente.
- id: 63
  category: vehicle_information
  question: ¿Cuál es la técnica adecuada para dar marcha atrás a un vehículo?
  choices:
    A: Depender completamente de sus espejos retrovisor y laterales
    B: Girar su cuerpo y cabeza hacia la derecha y mirar a través de la ventana trasera
    C: Tocar la bocina tres veces antes de retroceder
    D: Abrir su puerta y mirar hacia atrás mientras retrocede
  answer: B
  explanation: Los espejos no le dan una vista completa. Para ver lo máximo posible,
    gire su cuerpo y cabeza hacia la derecha y mire a través de la ventana trasera.
- id: 64
  category: safe_driving_rules
  question: 'A 60 mph, la distancia recorrida desde el punto en que reconoce un peligro
    hasta donde su vehículo se detiene por completo es:'
  choices:
    A: Aproximadamente 50 pies
    B: Menor que la longitud de una cancha de baloncesto
    C: Mayor que la longitud de un campo de fútbol americano
    D: Exactamente 100 pies
  answer: C
  explanation: Detenerse toma más tiempo del que cree. A 60 mph, la distancia recorrida
    desde el punto en que reconoce un peligro más adelante y aplica los frenos, hasta
    donde su vehículo se detiene por completo es mayor que la longitud de un campo
    de fútbol americano.
- id: 65
  category: safe_driving_rules
  question: Al acercarse a una curva, ¿cuándo debe reducir la velocidad?
  choices:
    A: Antes de entrar a la curva
    B: Mientras está en el medio de la curva
    C: Justo al salir de la curva
    D: Debe mantener su velocidad durante toda la curva
  answer: A
  explanation: El manual indica que debe reducir la velocidad antes de entrar a una
    curva, y luego aumentar su velocidad gradualmente al salir de ella.
- id: 66
  category: defensive_driving
  question: ¿Qué debe hacer para revisar su punto ciego antes de cambiar de carril?
  choices:
    A: Revisar su espejo retrovisor
    B: Revisar sus espejos laterales
    C: Mirar por encima de su hombro en la dirección en la que se va a mover
    D: Encender su luz direccional
  answer: C
  explanation: Antes de cambiar de carril, debe mirar por encima de su hombro izquierdo
    si se mueve a la izquierda, o mirar por encima de su hombro derecho si se mueve
    a la derecha para poder ver si hay algún vehículo en su punto ciego.
- id: 67
  category: safe_driving_rules
  question: Al rebasar a otro vehículo en una carretera de dos carriles, ¿cuándo es
    seguro regresar a su carril?
  choices:
    A: Tan pronto como su parachoques delantero esté por delante del otro vehículo
    B: Cuando pueda ver el vehículo que rebasó en su espejo retrovisor
    C: Después de haber recorrido 100 pies más allá del vehículo
    D: Cuando el otro conductor parpadee sus luces delanteras
  answer: B
  explanation: Cuando pueda ver el vehículo que rebasó en su espejo retrovisor, ponga
    su direccional y regrese a su carril.
- id: 68
  category: safe_driving_rules
  question: 'Al rebasar a otro vehículo, se le permite exceder el límite de velocidad:'
  choices:
    A: Por hasta 5 mph
    B: Por hasta 10 mph si rebasa a un camión
    C: Solo en una carretera de dos carriles
    D: En ningún momento; es contra la ley exceder los límites de velocidad
  answer: D
  explanation: No exceda el límite de velocidad al rebasar; es contra la ley exceder
    los límites de velocidad en cualquier momento.
- id: 69
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es ilegal cruzar la línea central
    para rebasar?
  choices:
    A: Cuando el vehículo de adelante está detenido en un cruce peatonal para permitir
      que un peatón cruce
    B: Cuando está en una calle de un solo sentido con múltiples carriles
    C: Cuando el vehículo de adelante está girando a la derecha
    D: Cuando conduce en una zona residencial con líneas amarillas discontinuas
  answer: A
  explanation: No debe cruzar la línea central para rebasar cuando el vehículo de
    adelante está detenido en un cruce peatonal para permitir que un peatón cruce.
- id: 70
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite rebasar a un vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante conduce demasiado lento en el carril izquierdo
      de una carretera de dos carriles
    B: Cuando el vehículo que está rebasando va a girar a la izquierda y hay suficiente
      espacio pavimentado a la derecha
    C: Conduciendo por el arcén (hombro) no pavimentado de la carretera
    D: Usando un carril designado para bicicletas
  answer: B
  explanation: Puede rebasar por la derecha si el vehículo que está rebasando está
    girando o ha puesto la direccional para girar a la izquierda, siempre que haya
    suficiente espacio a la derecha sin salir de la parte pavimentada de la carretera
    ni conducir por un carril para bicicletas.
- id: 71
  category: sharing_the_road
  question: Si otro conductor comienza a rebasarlo, ¿cómo debería ayudarlo?
  choices:
    A: Acelerar para que pueda incorporarse detrás de usted
    B: Parpadear las luces delanteras para hacerle saber que es seguro
    C: Usar señales con las manos para indicarle que avance
    D: Mantenerse a la derecha y ajustar su velocidad para permitirle regresar al
      carril
  answer: D
  explanation: Cuando otro conductor comience a rebasar, manténgase a la derecha.
    Puede ayudar al otro conductor a rebasarlo de manera segura verificando el tráfico
    en sentido contrario y ajustando su velocidad para permitir que el vehículo regrese
    al carril derecho lo antes posible.
- id: 72
  category: safe_driving_rules
  question: ¿Qué dice la ley sobre el uso de las manos o las luces para indicar a
    otros conductores cuándo es seguro rebasarlo?
  choices:
    A: Se recomienda por la noche
    B: Es obligatorio al conducir un camión grande
    C: La ley prohíbe parpadear cualquiera de sus señales a los conductores para hacerles
      saber cuándo rebasar
    D: Solo está permitido en carreteras rurales de dos carriles
  answer: C
  explanation: No use sus manos ni luces para indicar a otros conductores cuándo rebasar.
    La ley prohíbe parpadear cualquiera de sus señales a los conductores para hacerles
    saber cuándo rebasar.
- id: 73
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones debería aumentar su distancia de
    seguimiento?
  choices:
    A: Al conducir en carreteras secas y bien pavimentadas
    B: Al seguir a un conductor que no puede verlo, como un camión grande
    C: Cuando conduce un vehículo más pequeño y liviano
    D: Cuando se prepara para dar una vuelta a la derecha
  answer: B
  explanation: Debe aumentar su distancia de seguimiento al seguir a conductores que
    no pueden verlo. Es posible que los conductores de vehículos grandes no puedan
    verlo cuando usted está directamente detrás de ellos.
- id: 74
  category: safe_driving_rules
  question: 'Si conduce en una autopista a una velocidad inferior al flujo normal
    del tráfico, debe:'
  choices:
    A: Conducir en el carril izquierdo.
    B: Conducir en el carril derecho.
    C: Encender las luces de emergencia.
    D: Conducir por el acotamiento (arcén).
  answer: B
  explanation: Según la sección de Conducción en Autopistas del manual, 'Si conduce
    a una velocidad inferior al flujo del tráfico, debe usar el carril derecho'.
- id: 75
  category: defensive_driving
  question: ¿Cómo debe alertar a los conductores detrás de usted si nota que el tráfico
    se ralentiza más adelante en la autopista?
  choices:
    A: Encender las luces de emergencia.
    B: Usar señales de mano y brazo.
    C: Tocar ligeramente el pedal del freno varias veces.
    D: Tocar la bocina repetidamente.
  answer: C
  explanation: 'El manual aconseja: ''Si nota que el tráfico se ralentiza más adelante,
    toque ligeramente el pedal del freno varias veces para alertar a los conductores
    detrás de usted''.'
- id: 76
  category: signs_and_signals
  question: ¿Qué debe hacer si se acerca a un semáforo de rampa de entrada a la autopista
    que está apagado y no está en uso?
  choices:
    A: Tratarlo como una parada de cuatro vías (four-way stop).
    B: Detenerse y esperar a que la luz cambie a verde.
    C: Ceder el paso al vehículo en el carril contiguo.
    D: No detenerse y continuar hacia la autopista.
  answer: D
  explanation: 'El manual establece con respecto a los semáforos de rampa: ''Los semáforos
    de rampa aparecerán apagados cuando no estén en uso. No se detenga en un semáforo
    de rampa apagado''.'
- id: 77
  category: safe_driving_rules
  question: Al salir de una autopista, ¿cuándo debe comenzar a reducir la velocidad
    a la velocidad recomendada indicada?
  choices:
    A: Mientras todavía está en el carril derecho de la autopista.
    B: Una vez que esté en la rampa de salida.
    C: Al menos 500 pies antes de la salida.
    D: Solo cuando vea la señal de alto al final de la rampa.
  answer: B
  explanation: 'El manual indica: ''Mantenga su velocidad hasta que esté fuera de
    la autopista. Una vez en la rampa de salida, comience a reducir la velocidad a
    la velocidad recomendada indicada''.'
- id: 78
  category: safe_driving_rules
  question: Si tiene problemas con su vehículo en una autopista y se mueve al acotamiento,
    ¿cuál es el lugar más seguro para quedarse?
  choices:
    A: Caminar por la autopista para buscar ayuda.
    B: Pararse directamente detrás de su vehículo para advertir a otros.
    C: Dentro o cerca de su vehículo en el lado alejado del tráfico.
    D: En el carril de tráfico más cercano para hacer señas a un auto que pase.
  answer: C
  explanation: 'El manual establece: ''Si es posible, es mejor quedarse dentro o cerca
    de su vehículo en el lado alejado del tráfico. Caminar por una autopista es peligroso''.'
- id: 79
  category: sharing_the_road
  question: ¿Qué debe hacer si está remolcando un tráiler y el tráfico se está acumulando
    detrás de usted?
  choices:
    A: Acelerar para igualar el flujo del tráfico.
    B: Salirse en el primer desvío seguro para dejar pasar el tráfico.
    C: Encender las luces de emergencia y continuar a su velocidad actual.
    D: Hacer señas a los vehículos detrás de usted para que rebasen por la derecha.
  answer: B
  explanation: 'El manual establece: ''Si el tráfico se está acumulando detrás de
    usted, sálgase en el primer desvío seguro para dejar pasar el tráfico''.'
- id: 80
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por una tercera infracción de remolcar más
    de un vehículo o tráiler detrás de un vehículo de pasajeros?
  choices:
    A: Una multa de hasta $1,000.
    B: Una multa de hasta $2,000.
    C: Una multa de hasta $2,500 y seis meses de cárcel.
    D: Suspensión de la licencia por un año.
  answer: C
  explanation: El manual enumera las multas por infracciones de remolque. Para una
    tercera infracción, la sanción es 'Hasta $2,500 y seis meses de cárcel'.
- id: 81
  category: safe_driving_rules
  question: Si su vehículo está en movimiento en el tráfico, ¿cuál es la distancia
    mínima a la que debe usar la luz direccional antes de dar una vuelta o cambiar
    de carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: 'El manual indica: ''Si su vehículo está en movimiento en el tráfico,
    use la luz direccional al menos 100 pies antes de dar la vuelta o cambiar de carril''.'
- id: 82
  category: safe_driving_rules
  question: ¿Bajo qué condiciones se le permite usar señales de mano y brazo?
  choices:
    A: Solo de noche cuando la visibilidad es mala.
    B: En cualquier momento que conduzca un vehículo ancho o largo.
    C: A la luz del día cuando pueda ver claramente a personas y vehículos a una distancia
      de 1,000 pies.
    D: Solo cuando las luces direccionales de su vehículo estén descompuestas.
  answer: C
  explanation: 'El manual indica: ''Solo use señales de mano y brazo a la luz del
    día y cuando pueda ver claramente a personas y vehículos a una distancia de 1,000
    pies''.'
- id: 83
  category: sharing_the_road
  question: Al prepararse para dar una vuelta, ¿cuál es la regla con respecto a los
    carriles para bicicletas?
  choices:
    A: Debe ingresar al carril para bicicletas 100 pies antes de dar la vuelta.
    B: Puede cruzar un carril para bicicletas al dar la vuelta, pero no debe ingresar
      a él para prepararse para dar la vuelta.
    C: Nunca se le permite cruzar un carril para bicicletas.
    D: Debe tocar la bocina para despejar el carril para bicicletas antes de ingresar
      a él.
  answer: B
  explanation: 'El manual indica explícitamente: ''Puede cruzar un carril para bicicletas
    al dar la vuelta, pero no ingrese a un carril para bicicletas para prepararse
    para dar una vuelta''.'
- id: 84
  category: defensive_driving
  question: ¿Qué debe hacer si está en una intersección y se da cuenta de que está
    en el carril equivocado para dar la vuelta?
  choices:
    A: Cambiar de carril rápidamente antes de que el semáforo cambie a verde.
    B: Detenerse y esperar a que el tráfico se despeje para poder cambiar de carril.
    C: Ir a la siguiente intersección para dar la vuelta.
    D: Dar la vuelta de todos modos pero usar las luces intermitentes de emergencia.
  answer: C
  explanation: 'El manual aconseja: ''Si está en una intersección y en el carril equivocado
    para dar la vuelta, vaya a la siguiente intersección. Es más seguro dar la vuelta
    a la manzana que arriesgarse a una colisión debido a un cambio de carril o dirección
    de último minuto''.'
- id: 85
  category: safe_driving_rules
  question: Al dar una vuelta a la izquierda desde una calle de doble sentido hacia
    otra calle de doble sentido, ¿dónde debe posicionar su vehículo justo antes de
    dar la vuelta?
  choices:
    A: En el carril más cercano al borde derecho de la acera.
    B: En el carril justo a la derecha de la línea central.
    C: En el centro de la intersección.
    D: En el carril para bicicletas.
  answer: B
  explanation: 'El manual indica: ''Vueltas a la izquierda: En una calle de doble
    sentido, acérquese a la vuelta con su vehículo en el carril justo a la derecha
    de la línea central''.'
- id: 86
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es ilegal dar una vuelta a la izquierda
    con el semáforo en rojo?
  choices:
    A: Al dar la vuelta desde una calle de un solo sentido hacia una calle de un solo
      sentido.
    B: Al dar la vuelta desde una calle de doble sentido hacia una calle de un solo
      sentido.
    C: Al dar la vuelta desde una calle de un solo sentido hacia una calle de doble
      sentido.
    D: Al dar la vuelta desde un carril doble para dar la vuelta a la izquierda hacia
      una calle de un solo sentido.
  answer: C
  explanation: 'El manual indica con respecto a una ''Vuelta a la izquierda: De calle
    de un solo sentido a calle de doble sentido'' que ''No puede hacer esta vuelta
    con el semáforo en rojo''. También señala que es ilegal ejecutar una vuelta a
    la izquierda hacia una calle de doble sentido con el semáforo en rojo.'
- id: 87
  category: defensive_driving
  question: Si accidentalmente comienza a ingresar a una autopista en sentido contrario,
    ¿qué es lo primero que debe hacer?
  choices:
    A: Acelerar para salir de la rampa rápidamente.
    B: Hacerse a un lado de la rampa inmediatamente y detenerse.
    C: Poner su vehículo en reversa y retroceder hacia la calle transversal.
    D: Tocar la bocina para advertir al tráfico que se aproxima mientras da la vuelta.
  answer: B
  explanation: 'El manual indica: ''Si comienza a ingresar a una autopista en sentido
    contrario, un letrero de NO ENTRAR (DO NOT ENTER) o SENTIDO CONTRARIO (WRONG WAY)
    le advertirá de su error. Hágase a un lado de la rampa inmediatamente y deténgase''.'
- id: 88
  category: safe_driving_rules
  question: ¿Dónde están prohibidas las vueltas en U dentro de los límites de la ciudad?
  choices:
    A: En cualquier lugar donde su vehículo no pueda ser visto por el tráfico de ambas
      direcciones a menos de 500 pies
    B: En cualquier lugar donde su vehículo no pueda ser visto por el tráfico de ambas
      direcciones a menos de 1,000 pies
    C: En cualquier lugar donde su vehículo no pueda ser visto por el tráfico de ambas
      direcciones a menos de 250 pies
    D: En cualquier lugar donde su vehículo no pueda ser visto por el tráfico de ambas
      direcciones a menos de 750 pies
  answer: A
  explanation: Según el manual, las vueltas en U están prohibidas en cualquier lugar
    dentro de los límites de la ciudad donde su vehículo no pueda ser visto por el
    tráfico que se aproxima de ambas direcciones a menos de 500 pies.
- id: 89
  category: safe_driving_rules
  question: ¿Cuál es el requisito de visibilidad para dar una vuelta en U fuera de
    los límites de la ciudad?
  choices:
    A: Su vehículo debe ser visto por el tráfico de ambas direcciones a menos de 500
      pies
    B: Su vehículo debe ser visto por el tráfico de ambas direcciones a menos de 1,000
      pies
    C: Su vehículo debe ser visto por el tráfico de ambas direcciones a menos de 1,500
      pies
    D: Su vehículo debe ser visto por el tráfico de ambas direcciones a menos de 2,000
      pies
  answer: B
  explanation: El manual indica que las vueltas en U están prohibidas en cualquier
    lugar fuera de los límites de la ciudad donde su vehículo no pueda ser visto por
    el tráfico que se aproxima de ambas direcciones a menos de 1,000 pies.
- id: 90
  category: safe_driving_rules
  question: En una intersección sin señales ni semáforos, ¿a qué vehículo debe cederle
    el derecho de paso?
  choices:
    A: A cualquier vehículo que se aproxime por su izquierda
    B: A cualquier vehículo en la intersección o que se aproxime por su derecha
    C: Al vehículo que viaje a la mayor velocidad
    D: A cualquier vehículo que intente dar una vuelta a la izquierda
  answer: B
  explanation: Al acercarse a una intersección sin señales ni semáforos, debe ceder
    el derecho de paso a cualquier vehículo que esté en la intersección o que se aproxime
    por su derecha.
- id: 91
  category: safe_driving_rules
  question: Si conduce por una calle que termina en una intersección en 'T' sin señales
    ni semáforos, ¿qué debe hacer?
  choices:
    A: Ceder el paso a los conductores de la vía principal
    B: Tomar el derecho de paso ya que va a girar
    C: Detenerse y esperar la luz verde
    D: Tocar la bocina para advertir al tráfico transversal antes de avanzar
  answer: A
  explanation: Si usted es el conductor en una calle que termina en una intersección
    en 'T' sin señales ni semáforos, debe ceder el paso a los conductores de la vía
    principal.
- id: 92
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca un vehículo de emergencia mientras conduce
    dentro de una rotonda?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda para dejarlos pasar
    B: Avanzar y salir de la rotonda, y luego hacerse a un lado en el arcén derecho
    C: Hacerse a un lado hacia la isla central de la rotonda
    D: Acelerar y salir lo más rápido posible sin usar las luces direccionales
  answer: B
  explanation: Nunca se detenga mientras esté dentro de la rotonda. En su lugar, avance
    y salga de la rotonda. Una vez que salga, hágase a un lado en el arcén derecho
    y permita que pasen los vehículos de emergencia.
- id: 93
  category: safe_driving_rules
  question: 'Al conducir en una rotonda de varios carriles, es ilegal:'
  choices:
    A: Usar la luz direccional derecha al salir
    B: Mantener su posición en el carril
    C: Rebasar o conducir al lado de un camión
    D: Ceder el paso al tráfico dentro de la rotonda antes de entrar
  answer: C
  explanation: No intente adelantar ni rebasar a ningún vehículo, especialmente a
    camiones grandes y remolques dentro de la rotonda. Es ilegal rebasar o conducir
    al lado de un camión dentro de la rotonda.
- id: 94
  category: sharing_the_road
  question: Al girar en una intersección que tiene semáforo, ¿a qué distancia debe
    estar un peatón antes de que usted comience a girar?
  choices:
    A: Más allá del carril hacia el que va a girar, más el siguiente carril
    B: A seis pies o más del carril hacia el que va a girar
    C: A diez pies o más de su vehículo
    D: Completamente en la acera
  answer: B
  explanation: Si va a girar en una intersección que tiene semáforo, antes de comenzar
    a girar, el peatón debe estar a seis pies o más del carril hacia el que usted
    va a girar.
- id: 95
  category: sharing_the_road
  question: Al girar en una intersección que NO tiene semáforo, ¿cuándo es seguro
    girar con respecto a los peatones?
  choices:
    A: Cuando el peatón está a seis pies de su carril
    B: Cuando el peatón ha pasado el carril hacia el que va a girar, más el siguiente
      carril
    C: Tan pronto como el peatón baja de la acera
    D: Cuando el peatón llega a la isla central
  answer: B
  explanation: Si va a girar en una intersección que no tiene semáforo, antes de comenzar
    a girar, el peatón debe haber pasado el carril hacia el que usted va a girar,
    más el siguiente carril.
- id: 96
  category: sharing_the_road
  question: ¿Cuál es el ancho mínimo de un cruce peatonal no marcado?
  choices:
    A: Cuatro pies
    B: Seis pies
    C: Ocho pies
    D: Diez pies
  answer: B
  explanation: Un cruce peatonal no marcado tiene al menos seis pies de ancho y existe
    incluso si no hay acera o arcén.
- id: 97
  category: sharing_the_road
  question: 'Si un peatón ciego que lleva un bastón blanco está cruzando la calle,
    usted debe:'
  choices:
    A: Tocar la bocina para hacerle saber que usted está ahí
    B: Ceder el paso hasta que esté a seis pies más allá de su carril
    C: Permanecer detenido hasta que la persona haya cruzado toda la calle
    D: Conducir lentamente alrededor de él si hay espacio
  answer: C
  explanation: Debe ceder el derecho de paso a un peatón ciego que lleve un bastón
    blanco o use un perro guía. Permanezca detenido hasta que la persona haya cruzado
    toda la calle, incluso si usted tiene luz verde.
- id: 98
  category: safe_driving_rules
  question: En una intersección de cuatro vías con señales de alto (stop), si dos
    conductores se detienen al mismo tiempo y tienen dudas sobre quién va primero,
    ¿quién debe ceder el paso?
  choices:
    A: El conductor de la derecha cede el paso al conductor de la izquierda
    B: El conductor que gira a la derecha cede el paso al conductor que gira a la
      izquierda
    C: El conductor de la izquierda cede el paso al conductor de la derecha
    D: El vehículo más grande tiene el derecho de paso
  answer: C
  explanation: En las intersecciones con señales de alto en las cuatro direcciones,
    es de cortesía común permitir que el conductor que se detiene primero pase primero.
    En caso de duda, ceda el paso al conductor que está a su derecha.
- id: 99
  category: sharing_the_road
  question: ¿Por qué es ilegal rebasar a un vehículo detenido en un cruce peatonal?
  choices:
    A: El vehículo detenido podría retroceder repentinamente
    B: El conductor puede estar esperando a que un peatón cruce la calle
    C: Podría bloquear a un vehículo de emergencia
    D: Es probable que el vehículo detenido esté averiado
  answer: B
  explanation: No rebase a un vehículo detenido en un cruce peatonal, es ilegal. El
    conductor puede estar esperando a que un peatón cruce la calle.
- id: 100
  category: sharing_the_road
  question: ¿Cómo debe interactuar con una persona que anda en bicicleta dentro de
    una rotonda?
  choices:
    A: Rebasarla rápidamente por la izquierda
    B: Tocar la bocina para advertirle que la va a rebasar
    C: No rebasar a una persona que anda en bicicleta dentro de la rotonda
    D: Obligarla a usar la acera
  answer: C
  explanation: Permita que las personas que andan en bicicleta y se han incorporado
    al tráfico usen todo el carril de circulación. No rebase a una persona que anda
    en bicicleta dentro de la rotonda.
- id: 101
  category: safe_driving_rules
  question: ¿Cuál es la regla general para girar de una calle a otra?
  choices:
    A: Girar desde el carril central hacia el carril del extremo derecho.
    B: Girar desde el carril más cercano en la dirección en la que viaja hacia el
      carril más cercano en la dirección a la que desea ir.
    C: Abrirse mucho al girar para asegurarse de no tocar el bordillo.
    D: Girar siempre hacia el carril más a la izquierda, independientemente de su
      posición inicial.
  answer: B
  explanation: La regla general para girar es hacerlo desde el carril más cercano
    en la dirección en la que viaja hacia el carril más cercano en la dirección a
    la que desea ir. Evite abrirse mucho o cambiar de carril mientras gira.
- id: 102
  category: sharing_the_road
  question: ¿Está obligado a detenerse ante un peatón en un cruce peatonal si este
    se encuentra al otro lado de una isla de seguridad?
  choices:
    A: Sí, siempre debe detenerse ante cualquier peatón en un cruce peatonal.
    B: Sí, a menos que tenga luz verde.
    C: No, no está obligado a detenerse si se encuentran al otro lado de una isla
      de seguridad.
    D: No, a menos que lleven un bastón blanco.
  answer: C
  explanation: 'El manual indica: ''No está obligado a detenerse si el peatón está
    en un cruce peatonal al otro lado de una isla de seguridad''.'
- id: 103
  category: sharing_the_road
  question: ¿Qué debe hacer si una persona que usa un bastón blanco o un perro guía
    está cruzando la calle con el semáforo en verde?
  choices:
    A: Tocar la bocina para alertarles de la luz verde.
    B: Avanzar con cuidado alrededor de ellos.
    C: Permanecer detenido hasta que la persona haya cruzado toda la calle.
    D: Ceder el paso solo si están en un cruce peatonal marcado.
  answer: C
  explanation: El manual indica que debe permanecer detenido hasta que la persona
    haya cruzado toda la calle, incluso si usted tiene luz verde.
- id: 104
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad reducido en una zona escolar designada?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Una zona de velocidad escolar es un área donde se aplica una velocidad
    reducida de 20 mph y está definida por señales de velocidad escolar.
- id: 105
  category: signs_and_signals
  question: Si una señal de límite de velocidad escolar especifica 'Horario escolar'
    (School Hours), ¿durante qué horas se aplica el límite de velocidad reducido en
    un día de clases?
  choices:
    A: De 7 a.m. a 4 p.m.
    B: De 8 a.m. a 5 p.m.
    C: De 7 a.m. a 5 p.m.
    D: De 8 a.m. a 4 p.m.
  answer: C
  explanation: La señal de límite de velocidad en horario escolar se aplica entre
    las 7 a.m. y las 5 p.m. en los días en que hay clases.
- id: 106
  category: safe_driving_rules
  question: Según el manual, ¿cuál de las siguientes situaciones significa que 'hay
    niños presentes' en una zona de velocidad escolar?
  choices:
    A: Hay niños jugando en un patio escolar cercado cercano.
    B: Hay niños esperando en un cruce peatonal.
    C: Hay un autobús escolar estacionado en el estacionamiento de la escuela.
    D: Es entre las 8 a.m. y las 3 p.m. en un día de semana.
  answer: B
  explanation: El manual define 'hay niños presentes' como niños esperando en un cruce
    peatonal, ocupando o caminando dentro de un cruce peatonal, o cuando un miembro
    de la patrulla de tráfico está presente para ayudar a los niños en un cruce peatonal.
- id: 107
  category: sharing_the_road
  question: ¿Cuándo se le permite conducir a través de un carril para bicicletas?
  choices:
    A: Al prepararse para girar.
    B: Al rebasar a un vehículo más lento por la derecha.
    C: Al girar o al entrar o salir de un callejón, entrada de vehículos o camino
      privado.
    D: Nunca se le permite cruzar un carril para bicicletas.
  answer: C
  explanation: Puede cruzar un carril para bicicletas al girar o al entrar o salir
    de un callejón, entrada de vehículos o camino privado, pero no puede ingresar
    ni circular por un carril para bicicletas para prepararse para un giro.
- id: 108
  category: sharing_the_road
  question: ¿Qué se requiere al rebasar a una persona en bicicleta que viaja en su
    carril a velocidades superiores a 35 mph?
  choices:
    A: Debe tocar la bocina antes de rebasar.
    B: Solo puede rebasar si deja suficiente distancia para evitar el contacto en
      caso de que la persona se caiga.
    C: Debe cambiar de carril por completo para rebasar a la bicicleta.
    D: No se le permite rebasar bicicletas a velocidades superiores a 35 mph.
  answer: B
  explanation: A velocidades superiores a 35 mph, solo puede rebasar a una persona
    en bicicleta que viaja en su carril si deja suficiente distancia para evitar el
    contacto con el ciclista en caso de que se caiga.
- id: 109
  category: signs_and_signals
  question: ¿Qué debe hacer cuando se detiene en un semáforo en rojo que tiene una
    caja para bicicletas (bike box) pintada de verde en su carril?
  choices:
    A: Detenerse dentro de la caja para bicicletas para evitar que las bicicletas
      se crucen frente a usted.
    B: Detenerse detrás de la caja para bicicletas.
    C: Girar a la derecha en rojo después de ceder el paso a las bicicletas.
    D: Avanzar hasta la mitad de la caja para bicicletas para activar el sensor del
      semáforo.
  answer: B
  explanation: Como conductor, debe detenerse ante un semáforo detrás de la caja para
    bicicletas. No se detenga dentro de la caja. Además, no se permiten giros a la
    derecha en estas intersecciones cuando el semáforo está en rojo.
- id: 110
  category: signs_and_signals
  question: ¿Qué indica una marca de carril compartido o 'sharrow' pintada en la calle?
  choices:
    A: El carril es solo para bicicletas.
    B: El carril es compartido y puede haber personas en bicicleta en la vía.
    C: Las bicicletas deben ceder el paso a los vehículos de motor en este carril.
    D: El carril se termina y las bicicletas deben incorporarse a la derecha.
  answer: B
  explanation: Un 'sharrow' (marca de carril compartido) indica que el carril es compartido
    y que puede haber personas en bicicleta en la vía. Se indica mediante dos galones
    (chevrons) sobre el símbolo de una bicicleta.
- id: 111
  category: defensive_driving
  question: ¿Por qué debe tener especial cuidado antes de girar delante de una motocicleta
    que se aproxima con su luz direccional encendida?
  choices:
    A: Las motocicletas siempre tienen el derecho de paso en las intersecciones.
    B: Las luces direccionales de algunas motocicletas no se apagan automáticamente
      y es posible que el conductor haya olvidado apagarlas.
    C: Las motocicletas giran más rápido que otros vehículos.
    D: Las luces direccionales de las motocicletas a menudo están conectadas al revés.
  answer: B
  explanation: Las luces direccionales no se apagan automáticamente en algunas motocicletas
    y el conductor puede olvidar apagarlas. Debe asegurarse de que el conductor realmente
    esté disminuyendo la velocidad para girar antes de realizar su maniobra.
- id: 112
  category: sharing_the_road
  question: ¿Es legal compartir el carril con una persona que conduce una motocicleta
    o un ciclomotor?
  choices:
    A: Sí, si el carril es lo suficientemente ancho para ambos vehículos.
    B: Sí, pero solo cuando el tráfico está detenido o se mueve muy lentamente.
    C: No, es ilegal compartir el carril con una motocicleta o un ciclomotor.
    D: No, a menos que el conductor de la motocicleta indique que es seguro hacerlo.
  answer: C
  explanation: 'El manual establece explícitamente: ''Es ilegal compartir el carril
    con una persona que conduce una motocicleta o un ciclomotor. Al rebasar, debe
    dejarles un carril completo''.'
- id: 113
  category: vehicle_information
  question: En comparación con los vehículos más pequeños que viajan a la misma velocidad,
    ¿cuánta distancia necesitan generalmente los vehículos grandes para detenerse?
  choices:
    A: Aproximadamente la misma distancia
    B: Aproximadamente el doble de distancia
    C: Aproximadamente el triple de distancia
    D: Aproximadamente cuatro veces la distancia
  answer: C
  explanation: Los vehículos grandes necesitan aproximadamente el triple de distancia
    para detenerse que los vehículos más pequeños que viajan a la misma velocidad.
- id: 114
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego lateral de un
    vehículo grande?
  choices:
    A: Está a menos de 50 pies del parachoques trasero.
    B: No puede ver al conductor en el espejo lateral del vehículo grande.
    C: El vehículo grande viaja a más de 55 mph.
    D: Puede ver la luz direccional del vehículo grande parpadeando.
  answer: B
  explanation: Los vehículos grandes tienen puntos ciegos más grandes en ambos lados.
    Si no puede ver al conductor en el espejo lateral del vehículo grande, el conductor
    no puede verlo a usted.
- id: 115
  category: safe_driving_rules
  question: Al rebasar a un vehículo grande, ¿cuándo es seguro regresar al carril
    delante de este?
  choices:
    A: Tan pronto como su parachoques trasero pase la parte delantera del vehículo
      grande.
    B: Cuando pueda ver toda la parte delantera del vehículo grande en su espejo retrovisor.
    C: Cuando el conductor del vehículo grande parpadee sus faros delanteros.
    D: Después de haber mantenido su velocidad de rebase durante al menos 10 segundos.
  answer: B
  explanation: Al rebasar a un vehículo grande, debe ver toda la parte delantera del
    vehículo en su espejo retrovisor antes de incorporarse delante de él.
- id: 116
  category: defensive_driving
  question: ¿Qué debe hacer si ve un vehículo piloto en el tráfico que se aproxima?
  choices:
    A: Salirse completamente de la carretera y detenerse.
    B: Parpadear sus faros delanteros para saludar al conductor.
    C: Reducir su velocidad y posicionar su vehículo lo más a la derecha posible dentro
      de su carril.
    D: Moverse al carril central de giro para darles más espacio.
  answer: C
  explanation: Si ve un vehículo piloto en el tráfico que se aproxima, reduzca su
    velocidad y posicione su vehículo lo más a la derecha posible, manteniéndose en
    su carril.
- id: 117
  category: safe_driving_rules
  question: ¿Cuándo debe detenerse ante un autobús escolar con luces rojas intermitentes
    si se encuentra en una carretera dividida separada por una franja central sin
    pavimentar?
  choices:
    A: Siempre debe detenerse, independientemente del lado de la carretera en el que
      se encuentre.
    B: Debe detenerse solo si se encuentra en el mismo lado de la carretera que el
      autobús.
    C: Debe detenerse solo si hay niños cruzando la mediana.
    D: No tiene que detenerse en una carretera dividida.
  answer: B
  explanation: Si se encuentra en una carretera dividida con dos vías separadas por
    una franja central sin pavimentar o una barrera, debe detenerse solo si se encuentra
    en el mismo lado de la carretera que el autobús.
- id: 118
  category: sharing_the_road
  question: Si se encuentra en una carretera dividida con una franja central pintada
    y un autobús escolar está detenido con luces rojas intermitentes, ¿quién debe
    detenerse?
  choices:
    A: Solo el tráfico en el mismo lado que el autobús
    B: Todos los carriles de tráfico
    C: Solo el tráfico detrás del autobús
    D: Ningún vehículo necesita detenerse
  answer: B
  explanation: Una franja central pintada o un carril de giro no crea dos vías separadas.
    En este caso, todos los carriles de tráfico deben detenerse ante un autobús escolar
    con luces rojas intermitentes.
- id: 119
  category: sharing_the_road
  question: ¿Cuándo debe ceder el paso a un autobús de transporte público que se está
    reincorporando a un carril de tráfico?
  choices:
    A: Siempre que el autobús tenga encendidas las luces de emergencia
    B: Cuando el conductor indique su intención de reincorporarse y un letrero eléctrico
      de 'ceda el paso' (yield) parpadee en la parte trasera
    C: Solo si conduce por debajo del límite de velocidad
    D: Nunca está obligado a ceder el paso a los autobuses de transporte público
  answer: B
  explanation: Los vehículos que se aproximan por detrás deben ceder el paso cuando
    el conductor de un autobús indica su intención de reincorporarse a un carril de
    tráfico y hay un letrero eléctrico que parpadea 'ceda el paso' (yield) en la parte
    trasera del autobús.
- id: 120
  category: signs_and_signals
  question: ¿Cómo es el emblema de vehículo de movimiento lento?
  choices:
    A: Un triángulo amarillo con un borde negro
    B: Un borde rojo reflectante con un centro naranja fluorescente
    C: Un cuadrado blanco con un círculo rojo en el medio
    D: Un diamante verde fluorescente con un borde negro
  answer: B
  explanation: El emblema de vehículo de movimiento lento contiene un borde rojo reflectante
    y un centro naranja fluorescente.
- id: 121
  category: vehicle_information
  question: ¿Qué distancia debe sobresalir una carga por la parte trasera de un vehículo
    para que se exija mostrar una bandera roja de al menos 12 pulgadas cuadradas en
    su extremo?
  choices:
    A: 2 pies o más
    B: 3 pies o más
    C: 4 pies o más
    D: 5 pies o más
  answer: C
  explanation: Se debe mostrar una bandera roja, de al menos 12 pulgadas cuadradas,
    en el extremo de cualquier carga que sobresalga 4 pies o más por la parte trasera
    del vehículo.
- id: 122
  category: vehicle_information
  question: ¿Cuánto puede sobresalir una carga más allá de los lados de los guardabarros
    derechos en un vehículo de pasajeros?
  choices:
    A: No puede sobresalir de los guardabarros en absoluto
    B: Hasta 6 pulgadas
    C: Hasta 12 pulgadas
    D: Hasta 2 pies
  answer: B
  explanation: Las cargas no pueden sobresalir más de 6 pulgadas más allá de los lados
    de los guardabarros derechos en los vehículos de pasajeros.
- id: 123
  category: sharing_the_road
  question: Si usted no es miembro de un cortejo fúnebre, ¿cuál es la regla sobre
    conducir entre los vehículos del cortejo?
  choices:
    A: Puede unirse al cortejo si enciende las luces de emergencia
    B: Puede conducir entre los vehículos solo para hacer un giro a la derecha
    C: Es ilegal unirse o conducir entre los vehículos del cortejo
    D: Puede rebasar al cortejo si toca la bocina
  answer: C
  explanation: Si usted no es miembro del cortejo fúnebre, es ilegal que se una o
    conduzca entre los vehículos del cortejo.
- id: 124
  category: safe_driving_rules
  question: Si se acerca a un vehículo motorizado detenido con luces intermitentes
    en una carretera de varios carriles y no cambia de carril, ¿cuánto debe reducir
    la velocidad?
  choices:
    A: Al menos 5 mph por debajo del límite de velocidad publicado
    B: Al menos 10 mph por debajo del límite de velocidad publicado
    C: A exactamente 20 mph
    D: A exactamente 15 mph
  answer: A
  explanation: Si no cambia de carril al acercarse a un vehículo detenido con luces
    intermitentes, debe reducir la velocidad a al menos 5 millas por hora por debajo
    del límite de velocidad publicado.
- id: 125
  category: safe_driving_rules
  question: Después de que un vehículo de emergencia con sus luces o sirena encendidas
    lo haya rebasado, ¿cuál es la distancia mínima a la que debe mantenerse detrás
    de él?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Después de que pase el vehículo de emergencia, debe mantenerse al menos
    a 500 pies detrás del vehículo.
- id: 126
  category: safe_driving_rules
  question: Cuando sea detenido por un vehículo de la policía, ¿dónde debe evitar
    detenerse?
  choices:
    A: En el lado derecho de la carretera
    B: En una intersección o en la mediana central de una autopista
    C: En un espacio de estacionamiento designado
    D: En un arcén de grava
  answer: B
  explanation: Cuando sea detenido por la policía, conduzca lo más cerca que pueda
    de manera segura hacia el lado derecho de la carretera. No se detenga en una intersección
    ni se estacione en la mediana central de una autopista.
- id: 127
  category: penalties_and_points
  question: ¿Qué sucede con las multas de tránsito en todas las zonas de trabajo?
  choices:
    A: Se reducen a la mitad
    B: Siguen siendo las mismas que en las carreteras normales
    C: Se duplican
    D: Se triplican
  answer: C
  explanation: Las multas de tránsito se duplican en todas las zonas de trabajo.
- id: 128
  category: safe_driving_rules
  question: ¿Cuándo se aplican los límites de velocidad temporales publicados en una
    zona de trabajo?
  choices:
    A: Solo cuando los trabajadores son visibles
    B: Solo durante las horas de luz del día
    C: En todo momento, incluso si los trabajadores no son visibles
    D: Solo cuando hay maquinaria pesada operando
  answer: C
  explanation: La velocidad temporal publicada en una zona de trabajo se aplica en
    todo momento, incluso si los trabajadores no son visibles.
- id: 129
  category: safe_driving_rules
  question: Cuando se le requiera detenerse en un cruce de ferrocarril sin línea de
    parada, ¿a qué distancia del riel más cercano debe detenerse?
  choices:
    A: Al menos a 5 pies
    B: Al menos a 10 pies
    C: Al menos a 15 pies
    D: Al menos a 25 pies
  answer: C
  explanation: Cuando se le requiera detenerse, hágalo en la línea de parada. Si no
    hay línea de parada, deténgase al menos a 15 pies del riel más cercano.
- id: 130
  category: defensive_driving
  question: Si su vehículo se queda atascado en las vías del tren y se acerca un tren,
    ¿en qué dirección debe moverse después de salir del vehículo?
  choices:
    A: Paralelo a las vías en la misma dirección en la que se mueve el tren
    B: En un ángulo de 45 grados con respecto a las vías en dirección al tren
    C: Directamente lejos de las vías en un ángulo de 90 grados
    D: En un ángulo de 45 grados con respecto a las vías alejándose del tren
  answer: B
  explanation: Si se acerca un tren, muévase en un ángulo de 45 grados con respecto
    a las vías en dirección al tren para no ser golpeado por los escombros.
- id: 131
  category: safe_driving_rules
  question: Si la policía lo detiene y está oscuro afuera, ¿qué debe hacer antes de
    que el oficial se acerque?
  choices:
    A: Apagar todas sus luces
    B: Encender las luces altas
    C: Encender la luz interior del vehículo
    D: Salir del vehículo con una linterna
  answer: C
  explanation: Si está oscuro, encienda la luz interior del vehículo después de detenerse
    y antes de que el oficial se acerque.
- id: 132
  category: sharing_the_road
  question: ¿Qué debe hacer si está comenzando a cruzar una intersección y ve una
    ambulancia acercándose por detrás con la sirena encendida?
  choices:
    A: Detenerse inmediatamente en la intersección
    B: Cruzar la intersección, hacerse a la derecha y detenerse
    C: Hacerse a la derecha dentro de la intersección y detenerse
    D: Acelerar para despejar la intersección y seguir conduciendo
  answer: B
  explanation: No debe detenerse en una intersección por un vehículo de emergencia.
    Debe cruzar la intersección, hacerse a la derecha y detenerse.
- id: 133
  category: safe_driving_rules
  question: ¿Qué debe hacer si su vehículo se queda atascado en las vías del tren
    y se acerca un tren?
  choices:
    A: Correr alejándose directamente de las vías en la misma dirección en la que
      se mueve el tren.
    B: Moverse en un ángulo de 45 grados alejándose de las vías en dirección al tren.
    C: Quedarse en el vehículo y llamar al 911 inmediatamente.
    D: Pararse junto al vehículo y agitar los brazos para alertar al tren.
  answer: B
  explanation: Si se acerca un tren, muévase en un ángulo de 45 grados alejándose
    de las vías en dirección al tren para no ser golpeado por los escombros.
- id: 134
  category: sharing_the_road
  question: 'Cuando un tranvía o tren ligero se detiene para recoger o dejar pasajeros,
    usted debe:'
  choices:
    A: Tocar la bocina y rebasar por la derecha.
    B: Rebasar con cuidado a una velocidad de 10 mph o menos.
    C: Quedarse detrás hasta que vuelva a moverse o las personas estén a salvo.
    D: Cambiar de carril y acelerar para rebasar rápidamente.
  answer: C
  explanation: Si un tranvía o tren se detiene para recoger o dejar personas, quédese
    detrás hasta que vuelva a moverse o las personas estén a salvo.
- id: 135
  category: sharing_the_road
  question: ¿Es seguro girar frente a un tranvía que viaja en su misma dirección desde
    un carril adyacente?
  choices:
    A: Sí, si el tranvía está detenido.
    B: Sí, si usa su luz direccional.
    C: No, nunca gire frente a un tranvía desde un carril adyacente.
    D: No, a menos que conduzca un vehículo comercial.
  answer: C
  explanation: Nunca gire frente a un tranvía o tren que viaja en su misma dirección
    desde un carril adyacente, incluso si el tranvía o tren está detenido.
- id: 136
  category: safe_driving_rules
  question: Al estacionarse en paralelo, ¿qué tan cerca debe estar su vehículo del
    borde de la acera?
  choices:
    A: A no más de 6 pulgadas
    B: A no más de 12 pulgadas
    C: A no más de 18 pulgadas
    D: A no más de 24 pulgadas
  answer: B
  explanation: Estaciónese en paralelo y a no más de 12 pulgadas del borde de la acera.
- id: 137
  category: safe_driving_rules
  question: ¿Cómo debe girar las ruedas al estacionarse cuesta abajo junto a una acera?
  choices:
    A: Hacia el carril de circulación
    B: Recto hacia adelante
    C: Hacia la acera
    D: Hacia el borde de la carretera
  answer: C
  explanation: Al estacionarse cuesta abajo junto a una acera, gire las ruedas hacia
    la acera para evitar que su vehículo ruede cuesta abajo.
- id: 138
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por estacionarse en un espacio de estacionamiento
    para personas discapacitadas sin un permiso válido?
  choices:
    A: $50
    B: $100
    C: $165
    D: $250
  answer: C
  explanation: Las multas comienzan en $165 y pueden llegar hasta $1,000 si usted
    no es titular de un permiso de estacionamiento para personas discapacitadas.
- id: 139
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios no puede detener ni estacionar
    su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: A
  explanation: No puede detener ni estacionar su vehículo a menos de 10 pies de un
    hidrante de incendios.
- id: 140
  category: safe_driving_rules
  question: ¿A cuántos pies de un cruce peatonal marcado o no marcado en una intersección
    es ilegal estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: C
  explanation: No puede detener ni estacionar su vehículo a menos de 20 pies de un
    cruce peatonal marcado o no marcado en una intersección.
- id: 141
  category: safe_driving_rules
  question: 'No debe estacionarse a menos de 50 pies de un semáforo o señal de tránsito
    si:'
  choices:
    A: Se encuentra en una carretera de varios carriles.
    B: Su vehículo oculta la señal o el semáforo de la vista.
    C: El límite de velocidad es superior a 35 mph.
    D: Se estacionará por más de 2 horas.
  answer: B
  explanation: No puede detenerse ni estacionar su vehículo a menos de 50 pies de
    un semáforo o señal de tránsito si su vehículo oculta la señal o el semáforo de
    la vista.
- id: 142
  category: defensive_driving
  question: Si debe estacionarse en el arcén (hombro) de una carretera debido a una
    emergencia y su vehículo no puede verse desde 200 pies de distancia, ¿qué debe
    hacer?
  choices:
    A: Encender las luces altas.
    B: Advertir al tráfico que se aproxima con banderas, bengalas o señales colocadas
      a por lo menos 200 pies de distancia.
    C: Pararse en la calzada y agitar los brazos.
    D: Dejar el vehículo encendido con las puertas abiertas.
  answer: B
  explanation: Si su vehículo no puede verse desde 200 pies en cada dirección, debe
    advertir al tráfico que se aproxima. Esto se puede hacer con banderas, bengalas,
    señales o abanderados colocados a por lo menos 200 pies de su vehículo en cada
    dirección.
- id: 143
  category: safe_driving_rules
  question: 'Si debe dejar su vehículo desatendido durante una parada de emergencia,
    usted debe:'
  choices:
    A: Dejar el motor encendido para mantener la batería cargada.
    B: Dejar las llaves en el contacto para el conductor de la grúa.
    C: Apagar el motor, retirar la llave, poner los frenos y encender las luces de
      emergencia.
    D: Apagar las luces de emergencia para ahorrar batería.
  answer: C
  explanation: Si debe dejar su vehículo desatendido, apague el motor, retire la llave,
    ponga los frenos y encienda las luces de emergencia.
- id: 144
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una regla para usar correctamente el cinturón
    de seguridad en Oregon?
  choices:
    A: Puede pasar la correa del hombro por debajo del brazo si le resulta incómoda.
    B: Puede colocar la correa del hombro detrás de su espalda.
    C: Debe dejar un poco de holgura en la parte del regazo para mayor comodidad.
    D: Nunca pase la correa del hombro por debajo del brazo ni detrás de su espalda.
  answer: D
  explanation: No deje holgura en la parte del regazo ni en la del hombro del cinturón.
    Nunca pase la correa del hombro por debajo del brazo ni detrás de su espalda.
- id: 145
  category: safe_driving_rules
  question: Al salir de una posición de estacionamiento o parada, ¿cuál es la forma
    más segura de reincorporarse al tráfico?
  choices:
    A: Revisar sus espejos y salir rápidamente.
    B: Revisar sus puntos ciegos y espejos, y ceder el paso a todo el demás tráfico.
    C: Poner la luz direccional e incorporarse al tráfico, ya que los demás conductores
      deben cederle el paso.
    D: Tocar la bocina antes de salir.
  answer: B
  explanation: Al salir de una posición de estacionamiento o parada, revise sus puntos
    ciegos y espejos, y ceda el paso a todo el demás tráfico.
- id: 146
  category: signs_and_signals
  question: ¿Cuál es el propósito de la señal del Sistema de Notificación de Emergencias
    (ENS, por sus siglas en inglés) en un cruce de ferrocarril?
  choices:
    A: Advertir a los conductores de un tren que se aproxima.
    B: Notificar a las compañías ferroviarias de una obstrucción en las vías para
      que puedan alertar a los trenes que se aproximan.
    C: Indicar el límite de velocidad para los trenes que cruzan la calle.
    D: Proporcionar instrucciones sobre cómo cruzar las vías de manera segura.
  answer: B
  explanation: Busque una señal del Sistema de Notificación de Emergencias (ENS) ubicada
    en un poste en el cruce cerca de las vías para notificar a las compañías ferroviarias
    de la obstrucción en las vías y que puedan alertar a los trenes que se aproximan.
- id: 147
  category: safe_driving_rules
  question: ¿Hasta qué edad deben viajar los bebés en un asiento de seguridad para
    niños orientado hacia atrás?
  choices:
    A: 1 año de edad
    B: 2 años de edad
    C: 3 años de edad
    D: 4 años de edad
  answer: B
  explanation: Según el manual, los bebés deben viajar orientados hacia atrás hasta
    que cumplan los dos años de edad.
- id: 148
  category: safe_driving_rules
  question: ¿Cuándo ya no es obligatorio que un niño pasajero esté sujeto en un asiento
    de seguridad para niños aprobado?
  choices:
    A: Cuando tienen 6 años de edad o miden 4 pies de altura
    B: Cuando tienen 8 años de edad o miden al menos 4 pies y 9 pulgadas de altura
    C: Cuando alcanzan las 60 libras de peso
    D: Cuando cumplen 10 años de edad
  answer: B
  explanation: Los niños pasajeros deben estar sujetos en asientos de seguridad para
    niños aprobados hasta que tengan 8 años de edad o midan al menos 4 pies y 9 pulgadas
    de altura, y el cinturón para adultos les ajuste correctamente.
- id: 149
  category: defensive_driving
  question: ¿Cuál de las siguientes afirmaciones es cierta con respecto a sus opciones
    para evitar un choque?
  choices:
    A: Por lo general, puede detener el vehículo más rápido de lo que puede girarlo.
    B: En la mayoría de los casos, puede girar el vehículo más rápido de lo que puede
      detenerlo.
    C: Acelerar nunca es una opción segura para evitar un choque.
    D: Siempre debe frenar bruscamente de inmediato.
  answer: B
  explanation: El manual indica que, en la mayoría de los casos, puede girar el vehículo
    más rápido de lo que puede detenerlo, lo que hace que girar rápidamente sea una
    forma viable de evitar un choque.
- id: 150
  category: defensive_driving
  question: ¿Cuál es la forma correcta de regresar de manera segura a la carretera
    si su vehículo se sale del pavimento?
  choices:
    A: Frenar bruscamente y girar el volante bruscamente hacia la izquierda.
    B: Entrar en pánico y desviarse inmediatamente de regreso al pavimento.
    C: Disminuir la velocidad y girar las ruedas delanteras lo suficiente para regresar
      a la carretera.
    D: Acelerar para recuperar la tracción antes de girar de regreso a la carretera.
  answer: C
  explanation: Si se sale de la carretera, no debe entrar en pánico ni frenar bruscamente.
    Disminuya la velocidad, sujete el volante con firmeza y gire las ruedas delanteras
    lo suficiente para regresar a la carretera sin girar bruscamente.
- id: 151
  category: defensive_driving
  question: Si un vehículo que se aproxima se desvía hacia su carril, ¿por qué NUNCA
    debe invadir el carril contrario para evitarlo?
  choices:
    A: Es ilegal cruzar la línea central bajo cualquier circunstancia.
    B: El conductor que se aproxima podría girar bruscamente de vuelta a ese carril.
    C: Su vehículo perderá tracción en el lado opuesto de la carretera.
    D: No podrá usar su bocina o luces de manera efectiva.
  answer: B
  explanation: El manual advierte que nunca se debe invadir el carril contrario porque
    el conductor que se aproxima podría girar bruscamente de vuelta a ese carril,
    arriesgándose a una colisión frontal.
- id: 152
  category: sharing_the_road
  question: ¿Qué significa si una persona que monta a caballo levanta la mano a medida
    que usted se acerca?
  choices:
    A: Le están haciendo señas para que los rebase rápidamente.
    B: Están saludando para reconocer su presencia.
    C: El animal está asustado y usted debe detener su vehículo.
    D: Debe tocar la bocina para advertir al animal.
  answer: C
  explanation: Una mano levantada de una persona que monta a caballo o guía a un animal
    significa que el animal está asustado, y usted debe detener su vehículo a menos
    que detenerse cause una colisión.
- id: 153
  category: safe_driving_rules
  question: Además del tiempo entre el atardecer y el amanecer, ¿cuándo más debe encender
    sus faros?
  choices:
    A: Siempre que conduzca por una autopista.
    B: Cuando las condiciones dificulten ver a personas o vehículos a 1,000 pies de
      distancia.
    C: Solo cuando esté usando los limpiaparabrisas.
    D: Cuando la visibilidad se reduzca a 500 pies o menos.
  answer: B
  explanation: Los faros deben encenderse desde el atardecer hasta el amanecer, y
    en cualquier momento en que las condiciones dificulten ver a personas o vehículos
    a 1,000 pies de distancia.
- id: 154
  category: safe_driving_rules
  question: ¿A qué distancia debe bajar las luces altas de sus faros cuando sigue
    a otro vehículo?
  choices:
    A: 200 pies
    B: 300 pies
    C: 350 pies
    D: 500 pies
  answer: C
  explanation: Debe bajar las luces cuando siga a otro vehículo a menos de 350 pies
    para evitar cegar al otro conductor a través de su espejo retrovisor.
- id: 155
  category: defensive_driving
  question: ¿Cómo puede evitar ser cegado por el resplandor de los faros de los vehículos
    que se aproximan por la noche?
  choices:
    A: Mirar directamente a los faros del vehículo que se aproxima.
    B: Mirar un poco a la derecha de las luces que se aproximan y observar el borde
      de la carretera o la línea de niebla.
    C: Encender sus luces altas para contrarrestar el resplandor.
    D: Cerrar un ojo hasta que pase el vehículo.
  answer: B
  explanation: Para ser menos cegado por el resplandor de los faros por la noche,
    debe mirar un poco a la derecha de las luces que se aproximan y observar el borde
    de la carretera o la línea de niebla.
- id: 156
  category: safe_driving_rules
  question: ¿Qué luces debe usar al conducir con niebla, polvo o humo?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia
  answer: B
  explanation: Si conduce con niebla, polvo, humo o en cualquier área de baja visibilidad,
    use las luces bajas porque la luz de las luces altas se reflejará y causará resplandor.
- id: 157
  category: safe_driving_rules
  question: ¿Qué función del vehículo NO debe usar al conducir en condiciones húmedas
    o sobre nieve y hielo?
  choices:
    A: Limpiaparabrisas
    B: Luces bajas
    C: Desempañador
    D: Control de crucero
  answer: D
  explanation: 'El manual establece explícitamente: "No use el control de crucero
    en condiciones húmedas" y repite esta advertencia para conducir en nieve y hielo.'
- id: 158
  category: vehicle_information
  question: ¿Qué debe hacer si sus frenos se mojan después de conducir a través del
    agua?
  choices:
    A: Pisar los frenos bruscamente y de forma repetida para secarlos.
    B: Aplicar los frenos suavemente mientras conduce despacio hasta que comiencen
      a responder.
    C: Cambiar a neutral y avanzar por inercia hasta que los frenos se sequen.
    D: Detener el vehículo inmediatamente y esperar a que los frenos se sequen naturalmente.
  answer: B
  explanation: Si conduce a través del agua y los frenos se mojan, debe aplicar los
    frenos suavemente mientras conduce despacio hasta que comiencen a responder.
- id: 159
  category: defensive_driving
  question: ¿Cuándo es probable que una carretera cubierta de nieve o hielo esté más
    resbaladiza?
  choices:
    A: Cuando la temperatura está muy por debajo del punto de congelación.
    B: Cuando la temperatura está cerca del punto de congelación.
    C: Durante las primeras horas de la mañana antes del amanecer.
    D: Cuando el sol brilla directamente sobre el hielo.
  answer: B
  explanation: El manual aconseja a los conductores tener en cuenta que es probable
    que la carretera esté más resbaladiza cuando la temperatura está cerca del punto
    de congelación en lugar de por debajo del punto de congelación.
- id: 160
  category: defensive_driving
  question: ¿Cuál es la acción de dirección correcta que debe tomar si su vehículo
    comienza a derrapar?
  choices:
    A: Mantener el volante perfectamente recto.
    B: Girar el volante en la dirección opuesta al derrape.
    C: Girar el volante en la dirección hacia la que desea que vaya el vehículo.
    D: Girar el volante bruscamente a la izquierda y a la derecha para recuperar la
      tracción.
  answer: C
  explanation: Si su vehículo comienza a derrapar, no debe pisar los frenos y debe
    girar el volante en la dirección hacia la que desea que vaya el vehículo.
- id: 161
  category: vehicle_information
  question: ¿Durante qué meses se permiten generalmente las llantas con clavos en
    Oregon?
  choices:
    A: Del 1 de octubre al 30 de abril
    B: Del 1 de noviembre al 31 de marzo
    C: Del 1 de diciembre al 28 de febrero
    D: Se permiten durante todo el año.
  answer: B
  explanation: Las llantas con clavos generalmente solo se permiten del 1 de noviembre
    al 31 de marzo en Oregon.
- id: 162
  category: safe_driving_rules
  question: ¿Cuál es la regla sobre el uso de teléfonos celulares para conductores
    menores de 18 años en Oregon?
  choices:
    A: Pueden usar un accesorio de manos libres.
    B: Solo pueden enviar mensajes de texto mientras están detenidos en un semáforo
      en rojo.
    C: Es ilegal usar un teléfono celular u otro dispositivo electrónico móvil mientras
      se conduce un vehículo.
    D: Pueden usar un teléfono celular solo para navegación GPS.
  answer: C
  explanation: El manual establece que es ilegal que los conductores menores de 18
    años usen un teléfono celular u otro dispositivo electrónico móvil mientras conducen
    un vehículo.
- id: 163
  category: safe_driving_rules
  question: 'Los conductores de 18 años o más que deseen usar un teléfono celular
    mientras conducen deben:'
  choices:
    A: Mantener el teléfono en su regazo.
    B: Usar un accesorio de manos libres que requiera solo el uso mínimo de un dedo.
    C: Usar el teléfono solo mientras conducen a menos de 30 mph.
    D: Detenerse en el acotamiento para contestar cualquier llamada.
  answer: B
  explanation: Los conductores de 18 años o más deben usar un accesorio de manos libres
    para usar un teléfono celular, y este debe requerir solo el uso mínimo de un dedo
    para activar o desactivar el dispositivo.
- id: 164
  category: penalties_and_points
  question: ¿Es ilegal reproducir una radio o sistema de sonido a un volumen tan alto
    que pueda escucharse a qué distancia de su vehículo?
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 200 pies
  answer: B
  explanation: Es ilegal reproducir una radio u otro sistema de sonido a un volumen
    tan alto que pueda escucharse a 50 pies de su vehículo, ya que es importante poder
    escuchar bocinas y sirenas.
- id: 165
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra con un conductor agresivo que muestra
    "furia al volante" (road rage)?
  choices:
    A: Acelerar para alejarse de él.
    B: Tocar la bocina para advertir a otros conductores.
    C: Apartarse del camino y no desafiarlo.
    D: Intentar conducir más rápido que él hacia un lugar seguro.
  answer: C
  explanation: Si ve a un conductor agresivo, apártese de su camino. No lo desafíe
    yendo más rápido ni intentando ganarle en la conducción.
- id: 166
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones se recomienda para ayudarle a mantenerse
    despierto mientras conduce?
  choices:
    A: Esforzarse por llegar a su destino lo más rápido posible.
    B: Beber agua para prevenir la deshidratación.
    C: Subir el volumen de la radio al nivel máximo.
    D: Mantener la vista fija hacia adelante.
  answer: B
  explanation: Para ayudar a mantenerse despierto, el manual recomienda beber agua,
    ya que la deshidratación puede causar fatiga.
- id: 167
  category: alcohol_drugs_health
  question: 'Según la ley de Oregon, se presume que usted está incapacitado para conducir
    y puede ser arrestado por conducir bajo la influencia de intoxicantes (DUII) si
    su concentración de alcohol en la sangre (BAC) es igual o superior a:'
  choices:
    A: 0.04%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Si su concentración de alcohol en la sangre (BAC) es de 0.08% o más,
    la ley de Oregon presume que usted está incapacitado para conducir.
- id: 168
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de Consentimiento Implícito (Implied Consent) de
    Oregon?
  choices:
    A: Usted da su consentimiento para que registren su vehículo si lo detienen.
    B: Usted acepta someterse a una prueba de aliento, sangre u orina cuando se lo
      pida un oficial de policía.
    C: Usted se declara culpable automáticamente si es arrestado por DUII.
    D: Usted da su consentimiento para pagar todas las multas asociadas con las infracciones
      de tránsito.
  answer: B
  explanation: La ley de Consentimiento Implícito de Oregon significa que, al conducir
    un vehículo motorizado, usted ha aceptado someterse a una prueba de aliento, sangre
    u orina cuando se lo solicite un oficial de policía.
- id: 169
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años, no pasará una prueba de alcohol en la sangre
    si su concentración de alcohol en la sangre (BAC) es de:'
  choices:
    A: 0.02% o más
    B: 0.05% o más
    C: 0.08% o más
    D: Cualquier cantidad
  answer: D
  explanation: Si es menor de 21 años, no pasará la prueba si tiene cualquier cantidad
    de concentración de alcohol en la sangre debido a la ley de tolerancia cero de
    Oregon.
- id: 170
  category: alcohol_drugs_health
  question: Según la ley de Envases Abiertos (Open Container) de Oregon, ¿dónde deben
    guardarse las botellas o envases abiertos de alcohol en el vehículo?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: En el maletero (cajuela)
    D: En el piso del asiento trasero
  answer: C
  explanation: La ley de Envases Abiertos de Oregon establece que cualquier botella
    o envase abierto debe estar en el maletero (cajuela).
- id: 171
  category: safe_driving_rules
  question: ¿La ley de Oregón prohíbe a cualquier persona menor de qué edad viajar
    en el capó, el guardabarros o en la caja de una camioneta?
  choices:
    A: 16 años de edad
    B: 18 años de edad
    C: 21 años de edad
    D: No hay límite de edad; es ilegal para todos.
  answer: B
  explanation: La ley de Oregón prohíbe a cualquier persona menor de 18 años viajar
    en el capó, el guardabarros, el estribo u otra parte externa de un vehículo, incluida
    la caja de una camioneta.
- id: 172
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si experimenta un reventón de llanta
    mientras conduce?
  choices:
    A: Frenar bruscamente de inmediato.
    B: Sujetar el volante con firmeza.
    C: Cambiar a punto muerto (neutral).
    D: Encender las luces de emergencia.
  answer: B
  explanation: Si tiene un reventón, el manual indica que primero debe sujetar el
    volante con firmeza, luego reducir la velocidad gradualmente y salirse de la carretera.
- id: 173
  category: defensive_driving
  question: Si sus frenos dejan de funcionar mientras conduce, ¿cuál de las siguientes
    acciones debe tomar?
  choices:
    A: Cambiar a una marcha más alta.
    B: Apagar el motor de inmediato.
    C: Bombear los frenos para acumular presión.
    D: Tirar del freno de mano lo más rápido posible.
  answer: C
  explanation: Si sus frenos fallan, debe bombear los frenos. Esto puede acumular
    suficiente presión para que vuelvan a funcionar.
- id: 174
  category: defensive_driving
  question: ¿Qué debe hacer si el acelerador de su vehículo se atasca?
  choices:
    A: Cambiar el vehículo a punto muerto (neutral) usando la palma abierta.
    B: Apagar el motor de inmediato.
    C: Bombear el pedal del acelerador rápidamente.
    D: Cambiar a marcha atrás (reversa).
  answer: A
  explanation: Si su acelerador se atasca, debe buscar una ruta de escape y cambiar
    el vehículo a punto muerto (neutral) usando la palma abierta para evitar cambiar
    a otra marcha.
- id: 175
  category: vehicle_information
  question: ¿Cuál de las siguientes es una técnica recomendada para mejorar el rendimiento
    de la gasolina y ahorrar combustible?
  choices:
    A: Hacer arranques rápidos y paradas bruscas.
    B: Dejar el motor en ralentí para mantenerlo caliente.
    C: Conducir a una velocidad constante y evitar exceder los límites de velocidad
      indicados.
    D: Hacer múltiples viajes separados para hacer mandados.
  answer: C
  explanation: Para mejorar el rendimiento de la gasolina o ahorrar combustible, el
    manual recomienda conducir a una velocidad constante y evitar exceder los límites
    de velocidad indicados.
- id: 176
  category: safe_driving_rules
  question: ¿Qué debe hacer si recibe un mensaje de texto en su teléfono celular mientras
    conduce?
  choices:
    A: Leer y responder al mensaje rápidamente.
    B: Ignorar el mensaje hasta que se detenga en un área de estacionamiento segura.
    C: Pedirle a un pasajero que se lo lea mientras usted escribe.
    D: Reducir la velocidad y leerlo manteniendo un ojo en la carretera.
  answer: B
  explanation: El manual establece que si recibe un mensaje de texto en su teléfono
    celular mientras conduce, debe ignorar el mensaje hasta que se detenga en un área
    de estacionamiento segura.
- id: 177
  category: license_system
  question: ¿Un privilegio de conducción no comercial Clase C le permite conducir
    un vehículo de no más de cuántas libras?
  choices:
    A: 10,000 libras
    B: 16,000 libras
    C: 26,000 libras
    D: 33,000 libras
  answer: C
  explanation: Un privilegio de conducción no comercial Clase C le permite conducir
    un vehículo de no más de 26,000 libras que esté exento de los requisitos de licencia
    de conducir comercial (CDL) o endoso de motocicleta.
- id: 178
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar un permiso de instrucción
    en Oregón?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: B
  explanation: Para calificar para un privilegio de conducción no comercial Clase
    C, debe tener al menos 15 años de edad para solicitar un permiso de instrucción.
- id: 179
  category: license_system
  question: ¿Cuántas horas de experiencia de conducción supervisada se requieren para
    un solicitante menor de 18 años que NO ha tomado un curso de educación en seguridad
    vial aprobado por el ODOT?
  choices:
    A: 40 horas
    B: 50 horas
    C: 80 horas
    D: 100 horas
  answer: D
  explanation: Los solicitantes menores de 18 años deben tener 100 horas de experiencia
    de conducción supervisada, o 50 horas de experiencia de conducción supervisada
    si han tomado un curso de educación en seguridad vial aprobado por el ODOT.
- id: 180
  category: license_system
  question: 'Para que cuente para su experiencia de conducción requerida, su conductor
    supervisor debe tener al menos 21 años y haber tenido privilegios de conducción
    válidos durante al menos:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Su experiencia de conducción solo cuenta si es supervisada por alguien
    de al menos 21 años de edad que haya tenido privilegios de conducción válidos
    durante al menos 3 años.
- id: 181
  category: license_system
  question: ¿Cuál de las siguientes opciones NO está permitida al tomarse la foto
    para un privilegio de conducir de Oregon?
  choices:
    A: Sonreír
    B: Usar un audífono
    C: Usar lentes
    D: Tener el cabello recogido hacia atrás
  answer: C
  explanation: No se permiten sombreros, lentes, pintura u otras sustancias temporales
    en el rostro, ni lentes de contacto que cambien la apariencia del ojo al tomarse
    la foto.
- id: 182
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para comprobar su identidad
    y fecha de nacimiento?
  choices:
    A: Un certificado de nacimiento emitido por un hospital
    B: Un registro de bautismo
    C: Un pasaporte estadounidense vencido hace 10 años
    D: Un certificado de nacimiento emitido por el gobierno de EE. UU.
  answer: D
  explanation: Las pruebas aceptables incluyen un certificado de nacimiento emitido
    por el gobierno de EE. UU. Los certificados de nacimiento emitidos por hospitales
    y los registros de bautismo no son aceptables, y los pasaportes no pueden tener
    más de 5 años de vencimiento.
- id: 183
  category: license_system
  question: ¿Cuál de las siguientes opciones es una prueba aceptable de su dirección
    de residencia actual?
  choices:
    A: Correo personal de un amigo
    B: Correo reenviado
    C: Una orden de conexión o factura de servicios públicos
    D: Una suscripción a una revista sin su apellido
  answer: C
  explanation: Las pruebas de domicilio comunes incluyen una orden de conexión de
    servicios públicos, una factura, un documento de hipoteca o una declaración de
    impuestos a la propiedad. El correo personal y el correo reenviado no son aceptables.
- id: 184
  category: license_system
  question: ¿Qué prueba se requiere para agregar una designación de "Sordo o con problemas
    de audición" a su licencia o permiso?
  choices:
    A: Una nota médica
    B: Un audiograma de un especialista certificado
    C: Un formulario firmado por un juez
    D: No se requiere ninguna prueba
  answer: D
  explanation: Puede solicitar que el DMV agregue una designación de sordo o con problemas
    de audición en su licencia o permiso. No se requiere ninguna prueba.
- id: 185
  category: vehicle_information
  question: ¿Cuál es la cobertura de seguro mínima requerida por daños a la propiedad
    por choque en Oregon?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: La ley de Oregon requiere un seguro mínimo de $20,000 por choque para
    daños a la propiedad de terceros.
- id: 186
  category: driver_responsibility
  question: Si se ve involucrado en un choque sin heridos, ¿qué debe hacer con su
    vehículo?
  choices:
    A: Dejarlo exactamente donde está hasta que llegue la policía.
    B: Moverlo fuera de los carriles de circulación tan pronto como sea seguro hacerlo.
    C: Conducirlo a casa inmediatamente y llamar a la policía más tarde.
    D: Abandonar el vehículo y caminar hasta el teléfono más cercano.
  answer: B
  explanation: Si no hay heridos y los vehículos se pueden mover de manera segura,
    debe moverlos fuera de los carriles de circulación lo antes posible.
- id: 187
  category: driver_responsibility
  question: 'Debe presentar un informe de choque al DMV dentro de las 72 horas si
    los daños a cualquier vehículo superan los $2,500 y:'
  choices:
    A: El choque ocurrió de noche.
    B: El otro conductor no tiene seguro.
    C: Cualquier vehículo es remolcado del lugar debido a los daños.
    D: El límite de velocidad era superior a 55 mph.
  answer: C
  explanation: Debe presentar un informe de choque dentro de las 72 horas si los daños
    a cualquier vehículo superan los $2,500 y cualquier vehículo es remolcado del
    lugar debido a los daños del choque.
- id: 188
  category: driver_responsibility
  question: ¿Qué debe hacer si choca contra un vehículo desocupado y no puede encontrar
    al propietario?
  choices:
    A: Abandonar el lugar inmediatamente ya que nadie resultó herido.
    B: Esperar junto al vehículo hasta una hora antes de irse.
    C: Dejar una nota con su nombre, dirección y una breve descripción de lo sucedido.
    D: Llamar a una grúa para retirar el vehículo dañado.
  answer: C
  explanation: Si choca contra un vehículo desocupado y no puede encontrar al propietario,
    deje una nota con su nombre y dirección, junto con una breve descripción de lo
    sucedido.
- id: 189
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una razón por la que puede perder sus privilegios
    de conducir en Oregon?
  choices:
    A: No reportar un choque de vehículos.
    B: Recibir una sola multa de estacionamiento.
    C: Conducir un vehículo con más de 20 años de antigüedad.
    D: Olvidar su licencia en casa.
  answer: A
  explanation: Las razones por las que puede perder su privilegio de conducir incluyen
    no reportar un choque de vehículos, conducir sin seguro y conducir bajo la influencia
    de sustancias (DUI).
- id: 190
  category: penalties_and_points
  question: ¿Qué programa está asociado con la pérdida de su privilegio de conducir
    debido a demasiadas condenas de tránsito?
  choices:
    A: Sistema de Rehabilitación de Tránsito
    B: Iniciativa de Conductor Seguro
    C: Programa de Mejora del Conductor
    D: Programa de Reducción de Condenas
  answer: C
  explanation: El manual establece que puede perder su privilegio de conducir por
    demasiadas condenas de tránsito bajo el Programa de Mejora del Conductor (Driver
    Improvement Program).
- id: 191
  category: alcohol_drugs_health
  question: ¿Conducir bajo la influencia de cuál de las siguientes sustancias puede
    resultar en la pérdida de su privilegio de conducir?
  choices:
    A: Solo alcohol
    B: Solo drogas
    C: Solo medicamentos recetados
    D: Alcohol, drogas o inhalantes
  answer: D
  explanation: Puede perder su privilegio de conducir por manejar bajo la influencia
    de alcohol, drogas o inhalantes.
- id: 192
  category: penalties_and_points
  question: 'Puede perder su privilegio de conducir si no cumple con:'
  choices:
    A: Una citación para ser jurado
    B: Multas judiciales
    C: Recordatorios de renovación del registro del vehículo
    D: Reglas de la asociación de vecinos
  answer: B
  explanation: El incumplimiento del pago de multas judiciales figura como una de
    las razones por las que puede perder su privilegio de conducir.
- id: 193
  category: penalties_and_points
  question: Según el manual, ¿conducir sin qué tipo de protección financiera puede
    causar la pérdida de su privilegio de conducir?
  choices:
    A: Cobertura a todo riesgo (comprehensive)
    B: Cobertura contra conductores sin seguro
    C: Seguro (conducir sin seguro)
    D: Asistencia en carretera
  answer: C
  explanation: Conducir sin seguro es una de las razones por las que puede perder
    su privilegio de conducir.
- id: 194
  category: driver_responsibility
  question: Si sospecha que alguien podría ser víctima de trata de personas y ve un
    delito en curso, ¿qué debe hacer primero?
  choices:
    A: Acercarse al traficante para intervenir
    B: Llamar al 911
    C: Seguir al vehículo hasta su destino
    D: Publicarlo en las redes sociales
  answer: B
  explanation: Si sospecha que alguien podría ser víctima de trata de personas y está
    viendo un delito en curso, el manual le indica que llame al 911.
- id: 195
  category: driver_responsibility
  question: 'Al reportar una pista sobre sospechas de trata de personas, debe proporcionar
    ''información procesable'' (actionable information) como:'
  choices:
    A: Su historial de manejo personal
    B: El historial financiero de la víctima
    C: Descripciones de los automóviles, placas y personas involucradas
    D: El número de registro de su vehículo
  answer: C
  explanation: La información procesable incluye horas, fechas, ubicación, descripciones
    de los automóviles o camiones involucrados (marca, modelo, color, placa) y descripciones
    de las personas.
- id: 196
  category: driver_responsibility
  question: ¿Por qué el manual desaconseja acercarse a los presuntos traficantes de
    personas?
  choices:
    A: Es ilegal que los civiles hablen con los traficantes
    B: Es peligroso y podría causar problemas en el enjuiciamiento de los traficantes
    C: Los traficantes generalmente le pedirán dinero
    D: Podría darles indicaciones por accidente
  answer: B
  explanation: Acercarse a los traficantes no solo es peligroso para usted y sus víctimas,
    sino que podría causar problemas en el eventual enjuiciamiento de los traficantes.
- id: 197
  category: driver_responsibility
  question: 'Según el manual, un menor que es vendido para tener relaciones sexuales
    es:'
  choices:
    A: Considerado víctima solo si pide ayuda
    B: No considerado víctima si fue reclutado en línea
    C: Siempre una víctima de trata de personas
    D: Manejado por la oficina local del DMV
  answer: C
  explanation: 'El manual establece explícitamente: ''Un menor que es vendido para
    tener relaciones sexuales es siempre una víctima de trata de personas''.'
- id: 198
  category: alcohol_drugs_health
  question: ¿A qué número debe llamar para reportar a conductores ebrios?
  choices:
    A: 503-945-5000
    B: 503-299-9999
    C: '711'
    D: '911'
  answer: D
  explanation: La sección de Información de Contacto Importante enumera el 911 como
    el número para reportar a conductores ebrios.
- id: 199
  category: safe_driving_rules
  question: Según el manual, ¿dónde puede encontrar información sobre las carreteras
    de Oregon?
  choices:
    A: OregonDMV.com
    B: TripCheck.com
    C: La aplicación TAT
    D: La oficina de Registros Civiles (Vital Records)
  answer: B
  explanation: La sección de Información de Contacto Importante enumera TripCheck.com
    para obtener información sobre las carreteras.
- id: 200
  category: license_system
  question: Si necesita comunicarse con el DMV desde fuera del área de Portland, ¿qué
    número debe usar?
  choices:
    A: 503-299-9999
    B: 503-945-5000
    C: 971-673-1190
    D: 1-888-3737-888
  answer: B
  explanation: El número de contacto del DMV fuera del área de Portland es 503-945-5000.
- id: 201
  category: license_system
  question: ¿Qué servicio está disponible en todo el estado para que las personas
    sordas o con problemas de audición se comuniquen con el DMV?
  choices:
    A: TripCheck.com
    B: Retransmisión Estatal 711 (Statewide Relay 711)
    C: La Línea Directa Nacional contra la Trata de Personas (The National Human Trafficking
      Hotline)
    D: Equipo de No Discriminación del ODOT
  answer: B
  explanation: El manual enumera 'TDD (sordos y con problemas de audición).......................Retransmisión
    Estatal 711 (Statewide Relay 711)' en la información de contacto.
- id: 202
  category: driver_responsibility
  question: ¿Qué aplicación recomienda descargar el manual para conocer los indicadores
    de alerta de la trata de personas?
  choices:
    A: La aplicación TripCheck
    B: La aplicación TAT
    C: La aplicación ODOT
    D: La aplicación DMV Now
  answer: B
  explanation: 'El manual aconseja: ''Para conocer los indicadores de alerta de la
    trata de personas y obtener más información, descargue la aplicación TAT hoy mismo''.'
- id: 203
  category: license_system
  question: Si necesita información sobre un certificado de nacimiento de Oregón,
    ¿con qué oficina debe comunicarse?
  choices:
    A: Programa de Mejora del Conductor (Driver Improvement Program)
    B: Equipo de No Discriminación del ODOT
    C: Registros Civiles (Vital Records)
    D: Programas para Conductores del DMV
  answer: C
  explanation: El manual enumera a Registros Civiles de Oregón (Vital Records—Oregon,
    Información sobre Certificados de Nacimiento) en el 971-673-1190.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal roja octagonal de ALTO (STOP) significa que debe detenerse
    por completo en la línea de alto, en el cruce peatonal o antes de ingresar a la
    intersección. Verifique si hay tráfico y peatones antes de continuar.
  id: 204
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 205
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe ingresar a la carretera o rampa donde está colocada esta señal. Por lo general,
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde ingresar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 206
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: 'Detenerse y retroceder o dar la vuelta: va en sentido contrario'
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que viaja en contra del tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 207
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal blanca y negra de UN SOLO SENTIDO (ONE WAY) con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 208
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en esta ubicación.
  id: 209
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 210
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite dar vuelta en U
    B: No se permite dar vuelta a la izquierda
    C: No se permite dar vuelta a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de vuelta a la
    derecha tachada significa que las vueltas a la derecha están prohibidas en esta
    ubicación.
  id: 211
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde se prohíbe rebasar.
  id: 212
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye hacer esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Solo vuelta a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, camellón u obstrucción.
  id: 213
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 214
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los venados cruzan frecuentemente el camino en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un venado
    advierte que los venados cruzan frecuentemente el camino en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 215
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminar cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que cruzan el camino.
  id: 216
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal verde amarillenta fluorescente en forma de pentágono (5 lados)
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 217
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda (glorieta) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 218
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 219
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Se requiere dar vuelta a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar a
    la curva.
  id: 220
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 221
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la vía advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que el camino se
    curve primero hacia un lado y luego hacia el otro.
  id: 222
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de vía resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté atento a las condiciones cambiantes
    de la vía.
  id: 223
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra vía
    C: El comienzo de una carretera dividida
    D: Una vía que se estrecha a un carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra vía se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 224
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La vía se estrecha más adelante
    C: Fin de carril
    D: Fin de carretera dividida
  answer: B
  explanation: Esta señal de advertencia indica que la vía más adelante se vuelve
    más estrecha. Prepárese para una reducción en el ancho de la vía y ajuste su posición
    en el carril.
  id: 225
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: Fin de la vía
    B: Tráfico de doble sentido
    C: Comienza una carretera dividida
    D: Salida de autopista
  answer: C
  explanation: Esta señal advierte que la vía más adelante se convierte en una carretera
    dividida con una mediana o barrera que separa el tráfico en sentido contrario.
    Manténgase a la derecha.
  id: 226
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: La carretera dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de vía más adelante
  answer: B
  explanation: Esta señal advierte que la carretera dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Prepárese para el
    tráfico de doble sentido.
  id: 227
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Una zona de adelantamiento más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una carretera dividida
    y se encontrará con vehículos que viajan en dirección opuesta.
  id: 228
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la vía advierte esta señal?
  choices:
    A: Condiciones de vía helada
    B: La vía puede estar resbaladiza cuando está mojada
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la vía puede volverse muy resbaladiza durante la lluvia o en condiciones de
    humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 229
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la vía
    B: Una superficie de vía irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de vía
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 230
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepárese?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 231
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 232
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce o una intersección de 4 vías más
    adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 233
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que ingresa por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que ingresa por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 234
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando (fusionando)
    B: Un carril termina
    C: Se agrega un nuevo carril — no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse (fusionarse). El tráfico que ingresa
    desde la rampa tiene su propio carril nuevo.
  id: 235
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Detenerse o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 236
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: A cualquier persona por menos de 15 minutos
    B: Solo a personas de la tercera edad
    C: Solo a vehículos que muestren un cartel o placa de discapacidad válida
    D: A cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de una silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de estacionamiento para discapacitados válidos pueden estacionar
    en estos espacios. Las infracciones conllevan multas severas.
  id: 237
