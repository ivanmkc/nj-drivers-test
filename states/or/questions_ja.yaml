questions:
- id: 1
  category: license_system
  question: 2025年5月以降、18歳以上の人が米国の民間航空機に搭乗するためには、どのような身分証明書が必要ですか？
  choices:
    A: オレゴン州発行の標準的な運転免許証
    B: 連邦政府に承認された形式の身分証明書
    C: オレゴン州発行の標準的な仮免許証
    D: 出生証明書
  answer: B
  explanation: マニュアルには、2025年5月以降、18歳以上の人が米国の民間航空機に搭乗するには、連邦政府に承認された形式の身分証明書が必要であると記載されています。
- id: 2
  category: license_system
  question: 2025年5月以降、米国の民間航空機に搭乗するための身分証明書として認められないものは次のうちどれですか？
  choices:
    A: 米国パスポート
    B: 標準発行の非REAL ID（リアルID）オレゴン州運転免許証
    C: 米国軍の身分証明書
    D: 永住権カード（グリーンカード）
  answer: B
  explanation: マニュアルによると、2025年5月以降、標準発行の非REAL IDオレゴン州運転免許証、仮免許証、または身分証明書は、航空機の搭乗には認められなくなります。
- id: 3
  category: driver_responsibility
  question: オレゴン州運転マニュアルは、法廷で法的先例として引用することができますか？
  choices:
    A: はい。オレゴン州改訂法の正確な文言が含まれているためです。
    B: はい。ただし、交通裁判所に限られます。
    C: いいえ。法律の法源ではないため、法的先例として依存するべきではありません。
    D: いいえ。地方自治体の条例で承認されていない限り引用できません。
  answer: C
  explanation: マニュアルには次のように明記されています。「このマニュアルは法律の法源ではなく、法廷やその他の行政的または法的手続きにおいて、法的先例として依存したり引用したりするべきではありません。」
- id: 4
  category: safe_driving_rules
  question: マニュアルによると、オレゴン州運転マニュアルに記載されていない追加の条例を定めている可能性があるのはどの機関ですか？
  choices:
    A: 地方自治体
    B: 連邦政府
    C: 近隣の州
    D: 私有地の所有者
  answer: A
  explanation: マニュアルには、「地方自治体は、このマニュアルに記載されていない追加の条例を定めている場合があります」と記されています。
- id: 5
  category: driver_responsibility
  question: 新規運転者が道路上でより高い危険にさらされていると考えられるのはなぜですか？
  choices:
    A: 古い車両を運転するため
    B: 運転経験が不足しているため
    C: 視力検査を受ける義務がないため
    D: 頻繁に夜間運転をするため
  answer: B
  explanation: マニュアルには次のように記載されています。「新規運転者は、運転経験が不足しているため、はるかに高い危険にさらされています。」
- id: 6
  category: safe_driving_rules
  question: 運転を学んでいる場合、安全性を向上させるための最良の方法の1つは何ですか？
  choices:
    A: 日中のみ運転する
    B: 新車を購入する
    C: 有益な指導を受け、十分に練習する
    D: 運転中にマニュアルを読む
  answer: C
  explanation: マニュアルによると、「運転を学んでいる場合、安全性を向上させる最良の方法の1つは、有益な指導を受け、十分に練習することです。」
- id: 7
  category: driver_responsibility
  question: オレゴン州運転マニュアルでは、運転とはどのようなものであると強調していますか？
  choices:
    A: 憲法上の権利
    B: 特権
    C: 雇用の要件
    D: 連邦政府の義務
  answer: B
  explanation: マニュアルには次のように記載されています。「運転は特権であることを忘れないことが重要であり、私たちは皆、道路上のすべての人の安全を確保する役割を担っています。」
- id: 8
  category: alcohol_drugs_health
  question: マニュアルにおいて、すべての人を危険にさらす行為として明記されているのは次のうちどれですか？
  choices:
    A: 大麻（大麻草）使用後に、運転能力が低下した状態で運転すること
    B: ラジオを聴くこと
    C: マニュアル車を運転すること
    D: 友人と相乗りすること
  answer: A
  explanation: マニュアルでは、「アルコールを飲んだり、大麻を使用したり、精神状態を変化させるその他の物質を使用した後に、運転能力が低下した状態で運転することは…すべての人を危険にさらします」と警告しています。
- id: 9
  category: license_system
  question: オレゴン州運転マニュアルは、どの種類の運転特権（免許）を取得するための要件について説明していますか？
  choices:
    A: クラスA商用
    B: クラスB商用
    C: クラスC非商用
    D: オートバイの免許追加（二輪免許）
  answer: C
  explanation: マニュアルには次のように記載されています。「このマニュアルは、クラスC非商用運転特権を取得するための要件のみを扱っています。」
- id: 10
  category: driver_testing
  question: 初めて運転特権（免許）を申請する際、DMV（車両管理局）はどの3つの項目をテストしますか？
  choices:
    A: 聴力、運転知識、車両のメンテナンス
    B: 視力、運転知識、運転技能
    C: 反射神経、視力、縦列駐車
    D: 視力、病歴、運転技能
  answer: B
  explanation: マニュアルには次のように記載されています。「初めて運転特権を取得する場合、DMVは視力、運転知識、および運転技能をテストします。」
- id: 11
  category: driver_testing
  question: DMVで試験を受ける際は毎回、身分証明書、生年月日を証明するものに加えて、何を提示しなければなりませんか？
  choices:
    A: 現在の居住地住所
    B: 自動車保険の証明書
    C: ソーシャルセキュリティカード（社会保障番号カード）
    D: 高校の成績証明書
  answer: A
  explanation: マニュアルには、「試験を受ける際は毎回、まず試験手数料を支払い、身分証明書、生年月日、および現在の居住地住所を証明するものを提示しなければならない」と規定されています。
- id: 12
  category: driver_testing
  question: DMVの試験手数料はどのように支払わなければなりませんか？
  choices:
    A: 車両登録料と一緒に支払う
    B: 他の手数料とは別に支払う
    C: クレジットカードでのみ支払う
    D: 試験に合格した後に支払う
  answer: B
  explanation: マニュアルには、「試験手数料は他の手数料とは別に支払わなければならない」と明記されています。
- id: 13
  category: driver_testing
  question: オレゴン州のDMVで視力検査を受けるための手数料はいくらですか？
  choices:
    A: 5.00ドル
    B: 10.00ドル
    C: 15.00ドル
    D: 無料（手数料はかからない）
  answer: D
  explanation: マニュアルによると、「視力検査を受けるための手数料はかかりません」。
- id: 14
  category: driver_testing
  question: メガネやコンタクトレンズを着用してDMVの視力検査を受けた場合、どうなりますか？
  choices:
    A: 外して再検査を受けるよう求められる。
    B: 運転免許に視力矯正レンズが必要であるという条件が記載される。
    C: 制限付き免許のための追加手数料を支払わなければならない。
    D: 自動的に視力検査が不合格になる。
  answer: B
  explanation: マニュアルには、「メガネやコンタクトレンズを着用して検査を受けた場合、運転免許（運転特権）に視力矯正レンズが必要であるという条件が記載されます」と記載されています。
- id: 15
  category: driver_testing
  question: DMVの視力検査に不合格だった場合、次のステップは何ですか？
  choices:
    A: 再検査を受けるために30日間待たなければならない。
    B: 運転の権利を永久に失う。
    C: DMVから用紙を渡されるので、それを認定眼科専門医に持っていく。
    D: 特別な運転技能試験を受けなければならない。
  answer: C
  explanation: マニュアルには、「視力検査に不合格だった場合、DMVから用紙が渡されるので、それを認定眼科専門医に持っていく必要があります」と説明されています。
- id: 16
  category: driver_testing
  question: クラスC学科試験（Knowledge Test）に合格するには、何問正解する必要がありますか？
  choices:
    A: '25'
    B: '28'
    C: '30'
    D: '35'
  answer: B
  explanation: クラスC学科試験は35問の多肢選択式で、合格点を得るには28問正解する必要があります。
- id: 17
  category: penalties_and_points
  question: DMVオフィスでの学科試験中に不正行為（カンニング）をしていると判断された場合、どのような罰則がありますか？
  choices:
    A: 不合格となり、30日間は再試験を受けられない。
    B: 不合格となり、90日間は再試験を受けられない。
    C: 罰金を支払い、直ちに再試験を受けなければならない。
    D: 仮免許が永久に取り消される。
  answer: B
  explanation: マニュアルには、不正行為をしていると判断された場合、試験は不合格となり、90日間は再試験を受けることができないと記載されています。
- id: 18
  category: driver_testing
  question: オンラインで学科試験を受ける際、許可されているデバイスは次のうちどれですか？
  choices:
    A: 携帯電話
    B: タブレット
    C: ウェブカメラ付きのデスクトップパソコン
    D: タッチスクリーンデバイス
  answer: C
  explanation: オンラインで学科試験を受けるには、キーボード、マウス、ウェブカメラを備えたデスクトップまたはノートパソコンを使用する必要があります。携帯電話やタブレットなどのタッチスクリーンデバイスは使用できません。
- id: 19
  category: driver_testing
  question: 18歳未満でオンラインの学科試験を受ける場合、試験監督者（Proctor）の要件は何ですか？
  choices:
    A: 18歳以上であり、無制限に試験を監督できる。
    B: 21歳以上であり、24時間以内に2回の試験のみ監督できる。
    C: 公認の自動車教習所指導員でなければならない。
    D: 親または法定後見人でなければならない。
  answer: B
  explanation: 18歳未満の場合、21歳以上の試験監督者がオンライン試験を監督する必要があり、試験監督者は24時間以内に2回の試験のみ監督することができます。
- id: 20
  category: driver_testing
  question: DMVオフィスでの受験が義務付けられるまでに、オンラインで学科試験に挑戦できる最大回数は何回ですか？
  choices:
    A: 2回
    B: 3回
    C: 4回
    D: 5回
  answer: C
  explanation: オンライン試験は合計4回まで受けることができます。4回試行した後は、DMVオフィスで試験を受けなければなりません。
- id: 21
  category: driver_testing
  question: 過去どのくらいの期間内にODOT（オレゴン州運輸省）認定の運転者教育コースを修了した証明書を提出すれば、DMV（車両管理局）は実技試験を免除する場合がありますか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: C
  explanation: 過去2年以内にODOT認定の運転者教育コースを修了した証明書をDMVが受理した場合、DMVは実技試験を免除することがあります。
- id: 22
  category: driver_testing
  question: 実技試験中、車内に同乗できるのは誰ですか？
  choices:
    A: あなたと試験官のみ
    B: あなた、試験官、および通訳者
    C: あなた、試験官、および家族
    D: あなた、試験官、および21歳以上の免許を持った運転手
  answer: A
  explanation: 実技試験中、車内に同乗できるのはあなたと試験官のみです。通訳者、家族、友人、またはペットの同乗は許可されていません。
- id: 23
  category: driver_testing
  question: 実技試験に不合格となった場合、再試験を受けるまでにどのくらい待たなければなりませんか？
  choices:
    A: 同日の後刻まで
    B: 翌営業日まで
    C: まる1週間
    D: 30日間
  answer: B
  explanation: 実技試験に不合格となった場合、再試験を受けるには翌営業日まで待たなければなりません。
- id: 24
  category: vehicle_information
  question: 実技試験に使用する車両の要件として、次のうち正しいものはどれですか？
  choices:
    A: バックカメラが装備されていること。
    B: 助手席のドアが、内側と外側の両方のハンドルで開閉できること。
    C: 製造から10年未満であること。
    D: オートマチックトランスミッション（AT）車であること。
  answer: B
  explanation: 試験のために正常に機能していなければならない車両装備には、内側と外側の両方のハンドルで開閉できる助手席のドアが含まれます。
- id: 25
  category: license_system
  question: 18歳未満で運転免許証を申請する場合、実技試験を受ける前に仮免許（パーミット）をどのくらいの期間保持していなければなりませんか？
  choices:
    A: 最低3ヶ月
    B: 最低6ヶ月
    C: 最低9ヶ月
    D: 最低1年
  answer: B
  explanation: 18歳未満で運転免許証を申請する場合、仮免許を最低6ヶ月間保持していなければなりません。
- id: 26
  category: signs_and_signals
  question: 公式の標識、信号、および路面標示には、いつ従わなければなりませんか？
  choices:
    A: 例外なく、常に。
    B: 日中のみ。
    C: 警察官や道路作業員が交通整理を行っている場合を除き、常に。
    D: 緊急車両を運転している場合を除き、常に。
  answer: C
  explanation: 警察官や道路作業員が交通整理を行っている場合を除き、すべての公式の標識、信号、および路面標示に従わなければなりません。
- id: 27
  category: signs_and_signals
  question: 特定の行動や進行を禁止する交通標識は何色ですか？
  choices:
    A: 黄色
    B: オレンジ色
    C: 赤色
    D: 白色
  answer: C
  explanation: 特定の行動や進行を禁止する交通標識は赤色であり、交差点での交通の流れを制御することで安全性を高めます。
- id: 28
  category: signs_and_signals
  question: 一時停止標識の下に「Right Turn Permitted Without Stopping（停止せずに右折可）」の標識がある場合、それは何を示していますか？
  choices:
    A: すべての車両は停止せずに進行できる。
    B: 右折する車両は停止せずに右折できるが、他の車両は一時停止して道を譲らなければならない。
    C: 右折する車両は一時停止しなければならないが、左折する車両は進行できる。
    D: 信号が青の場合にのみ右折できる。
  answer: B
  explanation: この標識は一時停止標識の下に設置されることがあります。右折する車両は停止せずに右折できます。他の車両は一時停止し、優先権を譲らなければなりません。
- id: 29
  category: signs_and_signals
  question: 多人数乗車車両（HOV）の標識は何を示していますか？
  choices:
    A: その車線は大型商用トラック専用である。
    B: その車線は2人以上が乗車している車両専用である。
    C: その車線は工事のため閉鎖されている。
    D: その車線は追い越し専用である。
  answer: B
  explanation: 多人数乗車車両（HOV）車線は、標識に記載されている通り、2人以上が乗車している車両専用です。
- id: 30
  category: signs_and_signals
  question: 車線に描かれた白いひし形のマークは何を示していますか？
  choices:
    A: その車線は指定された追い越し車線である。
    B: その車線は2人以上が乗車している車両専用である。
    C: その車線は終了するため、車両は合流しなければならない。
    D: その車線は緊急車両専用である。
  answer: B
  explanation: 車線に描かれた白いひし形のマークは多人数乗車車両（HOV）車線を示しており、2人以上が乗車している車両専用です。
- id: 31
  category: signs_and_signals
  question: 既知の潜在的な危険や道路状況の変化を警告する警戒標識（warning signs）は何色ですか？
  choices:
    A: 赤色
    B: 緑色
    C: 黄色
    D: 青色
  answer: C
  explanation: 警戒標識は黄色で、前方の既知の潜在的な危険や道路状況の変化を警告します。
- id: 32
  category: signs_and_signals
  question: 「車線追加（Add Lane）」の標識は運転手に何を示していますか？
  choices:
    A: 2つの道路が合流しますが、合流（マージ）する必要はありません。
    B: 指定された車線がまもなく終了するため、合流しなければなりません。
    C: 示された側から交通が合流してきます。
    D: 道路の中央に追い越し車線が追加されます。
  answer: A
  explanation: 「車線追加（Add Lane）」の標識は、2つの道路が合流し、合流（マージ）する必要がないことを示しています。
- id: 33
  category: safe_driving_rules
  question: 指定された安全回廊（Safety Corridor）を走行する際、どのような行動をとるべきですか？
  choices:
    A: 速度を15 mphに落とす。
    B: 安全のためにヘッドライトを点灯する。
    C: 左車線に移動する。
    D: 進入する前にクラクションを鳴らす。
  answer: B
  explanation: 安全回廊（Safety Corridor）は、死亡事故や重傷事故が多く発生している高速道路の指定区間です。マニュアルでは、安全のためにヘッドライトを点灯するよう運転手に指示しています。
- id: 34
  category: signs_and_signals
  question: 茶色の交通標識はどのような情報を提供していますか？
  choices:
    A: ガソリンスタンドや宿泊施設などのドライバー向けサービス。
    B: 出口情報や都市への道順。
    C: 歴史的、文化的、およびレクリエーション施設。
    D: 前方の道路の危険に関する警告。
  answer: C
  explanation: 歴史、文化、レクリエーションの標識は茶色で、歴史的・文化的な場所、景勝地、ピクニック場、公園などを示しています。
- id: 35
  category: signs_and_signals
  question: 停電のため信号機が消灯している交差点に近づいた場合、どのように進むべきですか？
  choices:
    A: 安全が確認できれば、止まらずに交差点を通過する。
    B: 右側の交通に道を譲ってから進む。
    C: 全方向に一時停止標識があるかのように一時停止する。
    D: 警察官が到着するのを待ってから横断する。
  answer: C
  explanation: 停電などで信号機が消灯している場合は、全方向に一時停止標識があるかのように一時停止しなければなりません。
- id: 36
  category: safe_driving_rules
  question: 赤の点灯信号で左折が許可されるのはどのような条件のときですか？
  choices:
    A: 対面通行の道路から別の対面通行の道路へ曲がる場合。
    B: 一方通行の道路へ、その進行方向に向かって進入する場合。
    C: 赤の点灯信号での左折は決して許可されない。
    D: 指定された中央右左折車線がある場合。
  answer: B
  explanation: 完全に一時停止した後、一方通行の道路へその進行方向に向かって進入する場合に限り、赤信号での左折が許可されています。
- id: 37
  category: signs_and_signals
  question: 黄色の点滅する矢印の信号機は何を意味していますか？
  choices:
    A: 示された方向へ曲がる優先権がある。
    B: 停止して緑の矢印が出るのを待たなければならない。
    C: 示された方向へ進むことができるが、まず歩行者と対向車に道を譲らなければならない。
    D: 信号機が故障しているため、四方向一時停止（four-way stop）として扱わなければならない。
  answer: C
  explanation: 黄色の点滅する矢印は、矢印が示す方向へ進むことができることを意味しますが、まず歩行者と対向車に道を譲らなければなりません。
- id: 38
  category: safe_driving_rules
  question: 次のうち、道路の左側を走行することが許可されている状況はどれですか？
  choices:
    A: 見通しの悪いカーブに近づいているとき。
    B: 障害物を避けるために中央線の左側を走行するとき。
    C: 右折の準備をしているとき。
    D: 住宅街を走行しているとき。
  answer: B
  explanation: 障害物を避けるために中央線の左側を走行する場合など、特定の状況を除き、道路の右側を走行しなければなりません。
- id: 39
  category: safe_driving_rules
  question: 標識や信号機のない路地、私道、または駐車場から道路に進入または横断する前に、何をしなければなりませんか？
  choices:
    A: 一時停止し、接近してくる車両や歩行者に道を譲る。
    B: 15 mphに減速して交通に合流する。
    C: 対向車に警告するためにクラクションを鳴らす。
    D: 右側から接近してくる車両にのみ道を譲る。
  answer: A
  explanation: 標識や信号機のない路地、私道、または駐車場から道路に進入または横断する前には一時停止し、接近してくる車両や歩行者に道を譲らなければなりません。
- id: 40
  category: safe_driving_rules
  question: 標識で別途指定されていない限り、路地や狭い住宅街を走行する際の法定速度はいくらですか？
  choices:
    A: 10 mph (時速10マイル)
    B: 15 mph (時速15マイル)
    C: 20 mph (時速20マイル)
    D: 25 mph (時速25マイル)
  answer: B
  explanation: 路地や狭い住宅街を走行する際の制限速度は、法律で15 mph（時速15マイル）に定められています。
- id: 41
  category: safe_driving_rules
  question: 別の標識がない限り、公園および住宅街における最高速度制限はどれくらいですか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速30マイル
  answer: C
  explanation: 住宅街、公園、および海岸での制限速度は時速25マイルです。
- id: 42
  category: signs_and_signals
  question: 青色で、ガソリンスタンド、飲食店、病院など、高速道路沿いのサービスや施設について知らせる標識はどのタイプですか？
  choices:
    A: 路線標識 (Route signs)
    B: 案内標識 (Guide signs)
    C: 警戒標識 (Warning signs)
    D: 運転者向けサービス標識 (Motorist Service signs)
  answer: D
  explanation: 運転者向けサービス標識（Motorist Service signs）は青色の標識で、ガソリンスタンド、飲食店、宿泊施設、病院など、高速道路沿いのサービスや施設について知らせるものです。
- id: 43
  category: safe_driving_rules
  question: センターラインがなく、対面通行となっている道路を運転する場合、車両をどの位置に保つべきですか？
  choices:
    A: 別の車両が近づいてくるまで、道路の完全に中央を走行する。
    B: 対向車に道路の少なくとも半分を譲る。
    C: 道路の最も左側を走行する。
    D: 車両が近づいてくるたびに路肩に寄せて停止する。
  answer: B
  explanation: センターラインがなく対面通行の道路では、運転者は対向車に道路の少なくとも半分を譲らなければなりません。
- id: 44
  category: signs_and_signals
  question: 黄色の点滅信号に対する正しい対応は何ですか？
  choices:
    A: 完全に停止してから進む。
    B: 速度を上げて交差点を素早く通過する。
    C: 減速し、注意して進む。
    D: 交差点を四方向一時停止（フォーウェイ・ストップ）として扱う。
  answer: C
  explanation: 黄色の点滅信号は、減速して注意しながら進むことを意味します。
- id: 45
  category: safe_driving_rules
  question: 別の標識がない限り、制限速度が時速20マイルとなるのは次のどのエリアですか？
  choices:
    A: 公園
    B: すべてのビジネス街（商業地域）
    C: 海岸
    D: 他のどの定義にも当てはまらないすべての道路および高速道路
  answer: B
  explanation: マニュアルには、すべてのビジネス街（商業地域）およびスクールゾーン（学校速度制限区域）内の制限速度は時速20マイルであると記載されています。
- id: 46
  category: signs_and_signals
  question: 可変推奨速度標識（Variable Advisory Speed sign）と可変制限速度標識（Variable Speed Limit sign）の主な違いは何ですか？
  choices:
    A: 推奨速度標識は白黒で、制限速度標識は黄色である。
    B: 推奨速度標識は状況に応じた速度を推奨するものであり、制限速度標識は状況に応じて法的な制限速度を変更するものである。
    C: 推奨速度標識は夜間のみ適用され、制限速度標識は日中適用される。
    D: 推奨速度標識は他の制限速度標識と同様に取り締まりの対象となるが、制限速度標識は基本ルール法（basic rule law）を通じてのみ取り締まられる。
  answer: B
  explanation: 可変推奨速度標識は黄色で、運転状況に応じた速度を推奨します。可変制限速度標識は白黒で、運転状況に応じて実際の制限速度を変更するものであり、警察は他の制限速度標識と同様にこれを取り締まります。
- id: 47
  category: safe_driving_rules
  question: オレゴン州の基本ルール法（Basic Rule Law）に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 天候が良く交通量が少ない場合は、制限速度を超えて運転することが許可される。
    B: 州間高速道路およびビジネス街（商業地域）にのみ適用される。
    C: 現在の状況に対して合理的かつ慎重な速度で運転しなければならないと定めている。
    D: 天候や視界に関係なく、標識に示された制限速度で運転することを義務付けている。
  answer: C
  explanation: 基本ルールでは、現在の状況に対して合理的かつ慎重な速度で運転しなければならないと定められています。これは常にすべての道路に適用され、制限速度を超えて運転することは許可されていません。
- id: 48
  category: sharing_the_road
  question: 通常の交通の流れよりも遅い速度で運転しており、後方に渋滞が発生した場合、どうしなければなりませんか？
  choices:
    A: 制限速度を超える場合でも、交通の流れに合わせて速度を上げる。
    B: 左車線に移動し、他の車両が右側から追い越せるようにする。
    C: 最初の安全な場所で道路脇に寄り、後続の車を先に行かせる。
    D: ハザードランプを点灯させ、現在の車線を走り続ける。
  answer: C
  explanation: マニュアルには次のように記載されています。「指定された速度よりも遅く運転する場合は、後方の渋滞に注意してください。最初の安全な場所で道路脇に寄り、後続の車を先に行かせてください。」
- id: 49
  category: defensive_driving
  question: 車両の速度と歩行者の死亡率に関するマニュアルのデータによると、時速42マイルで走行する車両にはねられた歩行者の死亡リスクはどれくらいですか？
  choices:
    A: 死亡リスク10%
    B: 死亡リスク25%
    C: 死亡リスク50%
    D: 死亡リスク90%
  answer: C
  explanation: マニュアルのグラフによると、時速42マイルで走行する車両にはねられた歩行者の死亡リスクは50%です。
- id: 50
  category: signs_and_signals
  question: 2本の実線の黄色い線（ダブルソリッドイエローライン）は何を示していますか？
  choices:
    A: 両方向の交通において追い越しが許可されている。
    B: 追い越しは禁止されているが、道路への出入り等のために線を越えて左折することはできる。
    C: 一方通行の道路に近づいている。
    D: 中央車線を使用して低速車両を追い越すことができる。
  answer: B
  explanation: 2本の実線の黄色い線は、両方向の交通において追い越しが禁止されていることを示しています。ただし、対向車が通り過ぎるのを待った後であれば、道路へ出入りするために2本の実線の黄色い線を越えて左折することは許可されています。
- id: 51
  category: safe_driving_rules
  question: 双方向の左折専用車線（two-way special left turn lane）を使用する際のルールは、次のうちどれですか？
  choices:
    A: この車線を使用して、低速で走行している車両を追い越すことができる。
    B: 左折する前に、この車線を少なくとも200フィート走行しなければならない。
    C: 双方向の左折専用車線を走行し続けることは違法であるため、左折する直前にこの車線に入る。
    D: 車両が故障した場合、この車線に駐車することができる。
  answer: C
  explanation: マニュアルには次のように記載されています。「双方向の左折専用車線を走行し続けることは違法であるため、左折する直前にこの車線に入ってください。」
- id: 52
  category: signs_and_signals
  question: 両側に二重の黄色い実線がペイントされた中央分離帯に関するルールは何ですか？
  choices:
    A: 左折車線として使用することができる。
    B: 対向車が通り過ぎるのを待った後、そこを横切って左折することができる。
    C: 本線が渋滞している場合、中央分離帯を走行することが許可されている。
    D: いかなる状況でも、ペイントされた中央分離帯を横切って曲がることは違法である。
  answer: B
  explanation: 二重の黄色い実線がペイントされた中央分離帯は、2つの進行方向の間のエリアを示します。対向車が通り過ぎるのを待った後、ペイントされた中央分離帯を横切って左折することはできますが、左折車線として使用したり、その中を走行したりすることはできません。
- id: 53
  category: signs_and_signals
  question: 幅の広い白色の実線は何を示していますか？また、それを越える際のルールは何ですか？
  choices:
    A: 反対方向に進む交通を分離しており、越えることは厳しく禁止されている。
    B: 横断歩道を示しており、安全な場合のみ越えることが許可されている。
    C: 特定の車線に交通を誘導するために使用されており、越えることは許可されているが推奨されない。
    D: 公共交通機関専用車線を示しており、越えることは違法である。
  answer: C
  explanation: 幅の広い白色の実線は、特定の車線（右左折車線など）に交通を誘導したり、自転車専用レーンを分離したりするために使用されます。幅の広い白色の実線を越えることは許可されていますが、推奨されません。
- id: 54
  category: signs_and_signals
  question: 出口ランプや交差点の手前で点線の白線が使用されている場合、それは運転手に何を知らせていますか？
  choices:
    A: 現在走行している車線が、同じルート上で続かないこと。
    B: スクールゾーンに近づいていること。
    C: 次の1マイルは追い越しが禁止されていること。
    D: 完全に停止しなければならないこと。
  answer: A
  explanation: 出口ランプや交差点の手前で使用される点線の白線は、右折専用車線や出口専用車線など、現在走行している車線が同じルート上で続かないことを知らせています。
- id: 55
  category: signs_and_signals
  question: 譲れ（イールド）ラインは路面にどのように標示されていますか？
  choices:
    A: 車線を横切る白色の実線。
    B: 車線内に描かれた、自車の方を向いている三角形の列。
    C: 車線の中央にペイントされた白色の山形（シェブロン）マーク。
    D: 自転車のシンボルが描かれた幅の広い白線。
  answer: B
  explanation: 譲れ（イールド）ラインは、道を譲る必要がある位置を示すために、車線内に自車の方を向いて描かれた三角形の列として定義されています。
- id: 56
  category: signs_and_signals
  question: 道路上の赤の縞模様の線は何を示していますか？
  choices:
    A: 緊急車両専用の車線。
    B: 追い越しが厳しく禁止されているエリア。
    C: 一般車両が絶対に進入してはならない公共交通機関専用車線。
    D: 右左折、駐車、または私道に入るために公共交通機関専用車線（Transit Only lane）に進入してもよいエリア。
  answer: D
  explanation: 赤の縞模様の線は、右左折、駐車、または私道に入るために公共交通機関専用車線（Transit Only lane）に進入してもよい場所を示しています。
- id: 57
  category: defensive_driving
  question: 時速30マイル（30 mph）を超える速度で走行する場合、推奨される安全な車間距離はどれくらいですか？
  choices:
    A: 1〜2秒
    B: 2〜3秒
    C: ちょうど3秒
    D: 4秒以上
  answer: D
  explanation: マニュアルには次のように記載されています。「時速30マイルを超える速度の場合、判断を下して行動を起こすための時間を確保するため、安全な車間距離は4秒以上とする必要があります。」
- id: 58
  category: penalties_and_points
  question: オレゴン州の運転マニュアルでは、道路上での違法なレースをどのように定義していますか？
  choices:
    A: 標識の制限速度を時速15マイル以上超えて運転すること。
    B: 加速や速度の競争、または速度記録の作成。
    C: 1回の操作で3台以上の車両を追い越すこと。
    D: 左側車線で通常の交通の流れよりも速く運転すること。
  answer: B
  explanation: マニュアルには次のように記載されています。「いかなる道路でもレースを行うことは違法です。レースとは、加速や速度の競争、または速度記録の作成を指します。」
- id: 59
  category: safe_driving_rules
  question: 通常の状況下で、時速30マイル（30 mph）以下の速度での安全な車間距離はどのように定義されていますか？
  choices:
    A: 1〜2秒
    B: 2〜4秒
    C: 4〜6秒
    D: 5〜7秒
  answer: B
  explanation: マニュアルによると、安全な車間距離は2〜4秒と定義されています。
- id: 60
  category: safe_driving_rules
  question: 時速30マイル（30 mph）を超える速度で走行している場合、車間距離はどれくらいにするべきですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒以上
    D: 時速10マイルごとに1秒
  answer: C
  explanation: 時速30マイルを超える速度の場合、判断を下して行動を起こすための時間を確保するため、安全な車間距離は4秒以上とする必要があります。
- id: 61
  category: defensive_driving
  question: 他の車両の後ろに停車する場合、どのくらいの車間距離を空けるべきですか？
  choices:
    A: 前の車の後輪が道路に接しているのが見えるくらいの距離
    B: 少なくとも車1台分の長さ
    C: 前の車のナンバープレートが見えるくらいの距離
    D: 3フィートの距離
  answer: A
  explanation: 他の車両の後ろに停車する際は、前の車の後輪が道路に接している部分が見えるようにしてください。
- id: 62
  category: defensive_driving
  question: 後続車が車間距離を詰めすぎていて、右車線に進路を譲ることができない場合、どうするべきですか？
  choices:
    A: 急ブレーキをかけて、車間距離の詰めすぎをやめさせる
    B: ゆっくりと速度を落とす
    C: 速度を上げて車間距離を広げる
    D: ハザードランプを点滅させる
  answer: B
  explanation: 後続車が車間距離を詰めすぎていて進路を譲れない場合は、ゆっくりと速度を落としてください。これにより、後続車が追い越しやすくなるか、車間距離を詰めるのをやめる可能性があります。絶対に急ブレーキをかけてはいけません。
- id: 63
  category: vehicle_information
  question: 車を後退（バック）させる際の正しい方法はどれですか？
  choices:
    A: ルームミラーとサイドミラーのみに頼る
    B: 体と頭を右に回し、リアウィンドウ（後部窓）から外を見る
    C: 後退する前にクラクションを3回鳴らす
    D: ドアを開けて後ろを見ながら後退する
  answer: B
  explanation: ミラーだけでは全体を見渡すことはできません。できるだけ広い視界を確保するために、体と頭を右に回し、リアウィンドウから外を見てください。
- id: 64
  category: safe_driving_rules
  question: 時速60マイルで走行中、危険を認識してから車が完全に停止するまでに進む距離は次のうちどれですか？
  choices:
    A: 約50フィート
    B: バスケットボールのコートの長さより短い
    C: アメリカンフットボールのフィールドの長さより長い
    D: ちょうど100フィート
  answer: C
  explanation: 車が停止するまでには、思っている以上に時間がかかります。時速60マイルの場合、前方の危険を認識してブレーキをかけ、車が完全に停止するまでに進む距離は、アメリカンフットボールのフィールドの長さよりも長くなります。
- id: 65
  category: safe_driving_rules
  question: カーブに近づいた際、いつ減速するべきですか？
  choices:
    A: カーブに入る前
    B: カーブの途中
    C: カーブを抜ける直前
    D: カーブ全体を通して速度を維持するべきである
  answer: A
  explanation: マニュアルには、カーブに入る前に減速し、カーブを抜ける際に徐々に速度を上げるように記載されています。
- id: 66
  category: defensive_driving
  question: 車線変更をする前に、死角を確認するために何をしなければなりませんか？
  choices:
    A: ルームミラーを確認する
    B: サイドミラーを確認する
    C: 移動する方向の肩越しに目視する
    D: 方向指示器（ウィンカー）を出す
  answer: C
  explanation: 車線変更をする前には、死角に車両がいないか確認するため、左に移動する場合は左肩越しに、右に移動する場合は右肩越しに目視しなければなりません。
- id: 67
  category: safe_driving_rules
  question: 2車線道路で他の車両を追い越す際、元の車線に戻るのが安全なのはいつですか？
  choices:
    A: 自分の車のフロントバンパーが相手の車より前に出た直後
    B: 追い越した車がルームミラーに映って見えるようになった時
    C: その車を通り過ぎてから100フィート進んだ後
    D: 相手のドライバーがヘッドライトをパッシングした時
  answer: B
  explanation: 追い越した車がルームミラーに映って見えるようになったら、合図を出して元の車線に戻ります。
- id: 68
  category: safe_driving_rules
  question: 他の車両を追い越す際、制限速度を超えることが許されるのは次の場合です：
  choices:
    A: 時速5マイルまで
    B: トラックを追い越す場合は時速10マイルまで
    C: 片側1車線の幹線道路でのみ
    D: いかなる場合も許されない。制限速度を超えることは法律違反である
  answer: D
  explanation: 追い越し時に制限速度を超えてはいけません。いかなる場合でも制限速度を超えることは法律違反です。
- id: 69
  category: safe_driving_rules
  question: 次の状況のうち、追い越しのためにセンターラインを越えることが違法となるのはどれですか？
  choices:
    A: 前方の車両が歩行者を横断させるために横断歩道で停止している時
    B: 複数車線のある一方通行の道路を走行している時
    C: 前方の車両が右折しようとしている時
    D: 黄色の破線がある住宅街を走行している時
  answer: A
  explanation: 前方の車両が歩行者を横断させるために横断歩道で停止している時は、追い越しのためにセンターラインを越えてはいけません。
- id: 70
  category: safe_driving_rules
  question: どのような条件の下で、車両の右側からの追い越しが許可されますか？
  choices:
    A: 2車線道路の左車線を前方の車両が遅すぎる速度で走行している時
    B: 追い越そうとしている車両が左折しようとしており、右側に十分な舗装されたスペースがある時
    C: 道路の未舗装の路肩に乗り入れて追い越す場合
    D: 指定された自転車専用レーンを使用する場合
  answer: B
  explanation: 追い越そうとする車両が左折中であるか左折の合図を出しており、かつ道路の舗装部分から外れたり自転車専用レーンを走行したりすることなく、右側に十分なスペースがある場合は、右側から追い越すことができます。
- id: 71
  category: sharing_the_road
  question: 他の運転手があなたを追い越し始めた場合、どのように協力すべきですか？
  choices:
    A: 相手があなたの後ろに入れるようにスピードを上げる
    B: ヘッドライトを点滅させて安全であることを知らせる
    C: 手信号を使って前に進むよう合図する
    D: 右側に寄り、相手が車線に戻れるように速度を調整する
  answer: D
  explanation: 他の運転手が追い越しを始めたら、右側に寄ってください。対向車を確認し、相手の車両ができるだけ早く右車線に戻れるように速度を調整することで、他の運転手が安全に追い越せるよう協力することができます。
- id: 72
  category: safe_driving_rules
  question: 追い越しが安全であることを他の運転手に知らせるために、手やライトを使って合図することについて、法律ではどのように定められていますか？
  choices:
    A: 夜間に推奨されている
    B: 大型トラックを運転している場合は義務付けられている
    C: 法律では、追い越しのタイミングを知らせるために運転手に対して何らかの合図を点滅させることを禁止している
    D: 郊外の2車線道路でのみ許可されている
  answer: C
  explanation: 追い越しのタイミングを他の運転手に知らせるために、手やライトを使用しないでください。法律では、追い越しのタイミングを知らせるために運転手に対して何らかの合図を点滅させることを禁止しています。
- id: 73
  category: defensive_driving
  question: 車間距離を広げるべき状況は、次のうちどれですか？
  choices:
    A: 乾燥してよく舗装された道路を運転しているとき
    B: 大型トラックなど、あなたの車が見えない運転手の後ろを走行しているとき
    C: 小型で軽量な車両を運転しているとき
    D: 右折の準備をしているとき
  answer: B
  explanation: あなたの車が見えない運転手の後ろを走行する場合は、車間距離を広げる必要があります。大型車の運転手は、あなたが真後ろにいるとあなたの車が見えない場合があります。
- id: 74
  category: safe_driving_rules
  question: 高速道路を通常の交通の流れより遅い速度で運転している場合、次のようにしなければなりません：
  choices:
    A: 左車線を走行する。
    B: 右車線を走行する。
    C: ハザードランプを点灯させる。
    D: 路肩を走行する。
  answer: B
  explanation: マニュアルの高速道路の運転（Freeway Driving）のセクションによると、「交通の流れより遅い速度で運転する場合は、右車線を使用しなければならない」とされています。
- id: 75
  category: defensive_driving
  question: 高速道路で前方の渋滞（交通の減速）を発見した場合、後続車の運転手にどのように警告すべきですか？
  choices:
    A: ハザードランプを点灯させる。
    B: 手と腕による合図（手信号）を使用する。
    C: ブレーキペダルを数回軽く踏む。
    D: クラクションを繰り返し鳴らす。
  answer: C
  explanation: マニュアルでは、「前方の交通が減速しているのを発見した場合は、ブレーキペダルを数回軽く踏んで後続車の運転手に警告してください」とアドバイスしています。
- id: 76
  category: signs_and_signals
  question: 消灯しており使用されていない高速道路の入口ランプメーター（合流信号）に近づいた場合、どうすべきですか？
  choices:
    A: 4方向一時停止（フォーウェイ・ストップ）として扱う。
    B: 停止して信号が青になるのを待つ。
    C: 隣の車線の車両に道を譲る。
    D: 停止せずに高速道路へ進む。
  answer: D
  explanation: マニュアルにはランプメーターについて次のように記載されています。「ランプメーターは使用されていないときは消灯しています。消灯しているランプメーターでは停止しないでください。」
- id: 77
  category: safe_driving_rules
  question: 高速道路を降りる際、掲示されている推奨速度まで減速し始めるのはいつですか？
  choices:
    A: まだ高速道路の右車線にいる間。
    B: 出口ランプ（降り口の車線）に入ってから。
    C: 出口の少なくとも500フィート手前。
    D: ランプの終端にある一時停止標識が見えたときのみ。
  answer: B
  explanation: マニュアルでは次のように指示しています。「高速道路を降りるまでは速度を維持してください。出口ランプに入ったら、掲示されている推奨速度まで減速し始めてください。」
- id: 78
  category: safe_driving_rules
  question: 高速道路で車のトラブルに見舞われ、路肩に移動した場合、最も安全に待機できる場所はどこですか？
  choices:
    A: 助けを求めて高速道路沿いを歩く。
    B: 他の車に警告するために、自分の車の真後ろに立つ。
    C: 車内、または車の近くの交通から離れた側。
    D: 通り過ぎる車を呼び止めるために、最も近い走行車線に出る。
  answer: C
  explanation: マニュアルには次のように記載されています。「可能であれば、車内または車の近くの交通から離れた側に留まるのが良いでしょう。高速道路沿いを歩くのは危険です。」
- id: 79
  category: sharing_the_road
  question: トレーラーを牽引しており、後ろに渋滞ができている場合、どうしなければなりませんか？
  choices:
    A: 交通の流れに合わせてスピードを上げる。
    B: 最初の安全な待避所（ターンアウト）に入り、後続車を先に行かせる。
    C: ハザードランプを点灯させ、現在の速度で進み続ける。
    D: 後続車に右側から追い越すよう手を振って合図する。
  answer: B
  explanation: マニュアルには次のように記載されています。「後ろに渋滞ができている場合は、最初の安全な待避所（ターンアウト）に入り、後続車を先に行かせてください。」
- id: 80
  category: penalties_and_points
  question: 乗用車の後ろに複数の車両またはトレーラーを牽引したことによる3回目の違反に対する最大罰則は何ですか？
  choices:
    A: 最大1,000ドルの罰金。
    B: 最大2,000ドルの罰金。
    C: 最大2,500ドルの罰金および6ヶ月の禁錮刑。
    D: 1年間の免許停止。
  answer: C
  explanation: マニュアルには牽引違反に対する罰金が記載されています。3回目の違反の場合、罰則は「最大2,500ドルの罰金および6ヶ月の禁錮刑」です。
- id: 81
  category: safe_driving_rules
  question: 走行中の場合、右左折または車線変更をする前に、最低でもどのくらいの距離から方向指示器（ウィンカー）を出さなければなりませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: マニュアルには次のように記載されています。「走行中の場合、右左折または車線変更の少なくとも100フィート手前から方向指示器を使用してください。」
- id: 82
  category: safe_driving_rules
  question: 手や腕による合図（手信号）の使用が許可されるのはどのような条件のときですか？
  choices:
    A: 視界が悪い夜間のみ。
    B: 幅の広い車両や長い車両を運転している時はいつでも。
    C: 日中で、1,000フィート離れた場所からでも人や車両をはっきりと確認できる時。
    D: 車両の方向指示器が故障している時のみ。
  answer: C
  explanation: マニュアルには次のように記載されています。「手や腕による合図は、日中で、1,000フィート離れた場所からでも人や車両をはっきりと確認できる場合にのみ使用してください。」
- id: 83
  category: sharing_the_road
  question: 右左折の準備をする際、自転車専用レーンに関するルールはどれですか？
  choices:
    A: 右左折する100フィート手前で自転車専用レーンに入らなければならない。
    B: 自転車専用レーンを横切って右左折することはできるが、右左折の準備のためにレーン内に入ってはならない。
    C: 自転車専用レーンを横切ることはいかなる場合も許可されない。
    D: 自転車専用レーンに入る前に、クラクションを鳴らしてレーンを空けさせなければならない。
  answer: B
  explanation: マニュアルには明確に次のように記載されています。「自転車専用レーンを横切って右左折することはできますが、右左折の準備のために自転車専用レーンに入ってはなりません。」
- id: 84
  category: defensive_driving
  question: 交差点で、自分が右左折するための間違った車線にいることに気づいた場合、どうするべきですか？
  choices:
    A: 信号が青になる前に素早く車線を変更する。
    B: 停止し、車線変更ができるように交通が途切れるのを待つ。
    C: 次の交差点まで進んでから右左折する。
    D: ハザードランプを点灯させて、そのまま右左折する。
  answer: C
  explanation: マニュアルでは次のようにアドバイスしています。「交差点で右左折するための間違った車線にいる場合は、次の交差点まで進んでください。直前での車線変更や方向転換による衝突の危険を冒すよりも、ブロックを迂回する方が安全です。」
- id: 85
  category: safe_driving_rules
  question: 対面通行（双方向）の道路から別の対面通行の道路へ左折する場合、左折の直前に車両をどの位置につけるべきですか？
  choices:
    A: 右側の縁石に最も近い車線。
    B: センターラインのすぐ右側の車線。
    C: 交差点の中央。
    D: 自転車専用レーン。
  answer: B
  explanation: マニュアルには次のように記載されています。「左折：対面通行の道路では、センターラインのすぐ右側の車線に車両を寄せて左折に近づいてください。」
- id: 86
  category: safe_driving_rules
  question: 赤信号での左折が違法となるのは、次のうちどの状況ですか？
  choices:
    A: 一方通行の道路から一方通行の道路への左折。
    B: 対面通行の道路から一方通行の道路への左折。
    C: 一方通行の道路から対面通行の道路への左折。
    D: 2車線の左折専用レーンから一方通行の道路への左折。
  answer: C
  explanation: マニュアルの「左折：一方通行の道路から対面通行の道路へ」の項目には、「赤信号でこの左折を行うことはできません」と記載されています。また、赤信号で対面通行の道路へ左折することは違法であるとも記されています。
- id: 87
  category: defensive_driving
  question: 誤って高速道路（フリーウェイ）に逆走して進入し始めてしまった場合、最初に何をすべきですか？
  choices:
    A: 加速して素早くランプ（進入路）から抜け出す。
    B: 直ちにランプの脇に車を寄せて停止する。
    C: ギアをリバースに入れ、交差する道路まで後退する。
    D: クラクションを鳴らして対向車に警告しながらUターンする。
  answer: B
  explanation: マニュアルには次のように記載されています。「誤って高速道路に逆走して進入し始めた場合、『進入禁止（DO NOT ENTER）』または『逆走（WRONG
    WAY）』の標識が間違いを警告します。直ちにランプの脇に車を寄せて停止してください。」
- id: 88
  category: safe_driving_rules
  question: 市の境界内（市街地）において、Uターンが禁止されているのはどのような場所ですか？
  choices:
    A: 500フィート以内のいずれの方向からの交通からも自車が見えない場所
    B: 1,000フィート以内のいずれの方向からの交通からも自車が見えない場所
    C: 250フィート以内のいずれの方向からの交通からも自車が見えない場所
    D: 750フィート以内のいずれの方向からの交通からも自車が見えない場所
  answer: A
  explanation: マニュアルによると、市の境界内（市街地）では、500フィート以内のいずれの方向から来る交通からも自車が見えない場所でのUターンは禁止されています。
- id: 89
  category: safe_driving_rules
  question: 市の境界外（郊外）でUターンを行うための視界の要件は何ですか？
  choices:
    A: 500フィート以内のいずれの方向からの交通からも自車が見えなければならない
    B: 1,000フィート以内のいずれの方向からの交通からも自車が見えなければならない
    C: 1,500フィート以内のいずれの方向からの交通からも自車が見えなければならない
    D: 2,000フィート以内のいずれの方向からの交通からも自車が見えなければならない
  answer: B
  explanation: マニュアルには、市の境界外（郊外）では、1,000フィート以内のいずれの方向から来る交通からも自車が見えない場所でのUターンは禁止されていると記載されています。
- id: 90
  category: safe_driving_rules
  question: 標識や信号のない交差点では、どの車両に優先権を譲らなければなりませんか？
  choices:
    A: 左側から接近してくるすべての車両
    B: 交差点内にいる車両、または右側から接近してくるすべての車両
    C: 最も速い速度で走行している車両
    D: 左折しようとしているすべての車両
  answer: B
  explanation: 標識や信号のない交差点に近づく際は、交差点内にいる車両、または右側から接近してくるすべての車両に優先権を譲らなければなりません。
- id: 91
  category: safe_driving_rules
  question: 標識や信号のない「T字路」の突き当たりを運転している場合、どうしなければなりませんか？
  choices:
    A: 交差する道路（直進道路）を走る車に道を譲る
    B: 曲がるため、優先権を得る
    C: 停止して青信号を待つ
    D: 進む前にクラクションを鳴らして交差する交通に警告する
  answer: A
  explanation: 標識や信号のない「T字路」の突き当たりを運転している場合、交差する道路（直進道路）を走る車に道を譲らなければなりません。
- id: 92
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）内を走行中に緊急車両が接近してきた場合、どうすべきですか？
  choices:
    A: ラウンドアバウト内で直ちに停止し、緊急車両を通過させる
    B: ラウンドアバウトを通り抜けてから右側の路肩に車を寄せる
    C: ラウンドアバウトの中央島に車を寄せる
    D: 合図を出さずにスピードを上げ、できるだけ早く退出する
  answer: B
  explanation: ラウンドアバウト内では絶対に停止しないでください。代わりに、ラウンドアバウトを通り抜けて退出してください。退出した後、右側の路肩に車を寄せて緊急車両を通過させます。
- id: 93
  category: safe_driving_rules
  question: 複数車線のあるラウンドアバウトを走行する際、以下のどの行為が違法となりますか？
  choices:
    A: 退出する際に右折の合図を出す
    B: 車線内の位置を維持する
    C: トラックを追い越す、またはトラックの横を並走する
    D: 進入する前にラウンドアバウト内の交通に道を譲る
  answer: C
  explanation: ラウンドアバウト内では、いかなる車両（特に大型トラックやトレーラー）も追い越そうとしないでください。ラウンドアバウト内でトラックを追い越したり、横を並走したりすることは違法です。
- id: 94
  category: sharing_the_road
  question: 信号機のある交差点で曲がる際、曲がり始める前に歩行者とどのくらい距離が離れていなければなりませんか？
  choices:
    A: 曲がろうとする車線と、その隣の車線を通り過ぎるまで
    B: 曲がろうとする車線から6フィート（約1.8メートル）以上
    C: 自分の車から10フィート（約3メートル）以上
    D: 完全に歩道に上がるまで
  answer: B
  explanation: 信号機のある交差点で曲がる場合、曲がり始める前に、歩行者が曲がろうとする車線から6フィート（約1.8メートル）以上離れていなければなりません。
- id: 95
  category: sharing_the_road
  question: 信号機のない交差点で曲がる際、歩行者に関して安全に曲がれるのはいつですか？
  choices:
    A: 歩行者が自分の車線から6フィート離れたとき
    B: 歩行者が曲がろうとする車線と、その隣の車線を通り過ぎたとき
    C: 歩行者が縁石から降りた直後
    D: 歩行者が中央島に到達したとき
  answer: B
  explanation: 信号機のない交差点で曲がる場合、曲がり始める前に、歩行者が曲がろうとする車線と、その隣の車線を通り過ぎていなければなりません。
- id: 96
  category: sharing_the_road
  question: 標示のない横断歩道の最小幅はどれくらいですか？
  choices:
    A: 4フィート
    B: 6フィート
    C: 8フィート
    D: 10フィート
  answer: B
  explanation: 標示のない横断歩道は少なくとも幅6フィート（約1.8メートル）あり、歩道や路肩がなくても存在します。
- id: 97
  category: sharing_the_road
  question: 白杖を持った視覚障害のある歩行者が道路を横断している場合、どうしなければなりませんか？
  choices:
    A: クラクションを鳴らして自分の存在を知らせる
    B: 自分の車線を6フィート通り過ぎるまで道を譲る
    C: その人が道路を完全に渡りきるまで停止したままでいる
    D: スペースがあればゆっくりと避けて運転する
  answer: C
  explanation: 白杖を持っていたり盲導犬を連れていたりする視覚障害のある歩行者には、優先権を譲らなければなりません。たとえ青信号であっても、その人が道路を完全に渡りきるまで停止したままでいてください。
- id: 98
  category: safe_driving_rules
  question: 4方向一時停止の交差点で、2人の運転手が同時に停止し、どちらが先に進むべきか迷った場合、どちらが道を譲るべきですか？
  choices:
    A: 右側の運転手が左側の運転手に道を譲る
    B: 右折する運転手が左折する運転手に道を譲る
    C: 左側の運転手が右側の運転手に道を譲る
    D: より大きな車両に優先権がある
  answer: C
  explanation: 4方向すべてに一時停止標識がある交差点では、先に停止した運転手を先に進ませるのが一般的なマナーです。迷った場合は、右側の運転手に道を譲ってください。
- id: 99
  category: sharing_the_road
  question: 横断歩道で停止している車両を追い越すことが法律違反である理由はなぜですか？
  choices:
    A: 停止している車両が突然バックするかもしれないため
    B: 運転手が歩行者の横断を待っている可能性があるため
    C: 緊急車両の進行を妨げる可能性があるため
    D: 停止している車両は故障している可能性が高いため
  answer: B
  explanation: 横断歩道で停止している車両を追い越してはいけません。これは法律違反です。その運転手は歩行者が道路を横断するのを待っている可能性があります。
- id: 100
  category: sharing_the_road
  question: ラウンドアバウト内で自転車に乗っている人に対して、どのように対応すべきですか？
  choices:
    A: 左側から素早く追い越す
    B: 追い越すことを警告するためにクラクションを鳴らす
    C: ラウンドアバウト内では自転車に乗っている人を追い越さない
    D: 歩道を使うように促す
  answer: C
  explanation: 交通に合流した自転車に乗っている人には、車線全体を使用させてください。ラウンドアバウト内では自転車に乗っている人を追い越してはいけません。
- id: 101
  category: safe_driving_rules
  question: ある道路から別の道路へ曲がる際の一般的なルールは何ですか？
  choices:
    A: 中央車線から一番右の車線へ曲がる
    B: 進行方向の最も近い車線から、曲がりたい方向の最も近い車線へ曲がる
    C: 縁石にぶつからないように大回りして曲がる
    D: 開始位置に関係なく、常に一番左の車線に曲がる
  answer: B
  explanation: 曲がる際の一般的なルールは、進行方向の最も近い車線から、曲がりたい方向の最も近い車線へ曲がることです。曲がる際の大回りや車線変更は避けてください。
- id: 102
  category: sharing_the_road
  question: 歩行者が安全地帯の反対側の横断歩道にいる場合、その歩行者のために一時停止する必要がありますか？
  choices:
    A: はい、横断歩道にいるすべての歩行者のために常に一時停止しなければなりません
    B: はい、青信号でない限り一時停止しなければなりません
    C: いいえ、歩行者が安全地帯の反対側にいる場合は一時停止する必要はありません
    D: いいえ、歩行者が白杖を持っていない限り一時停止する必要はありません
  answer: C
  explanation: マニュアルには「歩行者が安全地帯の反対側の横断歩道にいる場合、一時停止する必要はありません」と記載されています。
- id: 103
  category: sharing_the_road
  question: 白杖を使用している人や盲導犬を連れている人が青信号で道路を横断している場合、どうしなければなりませんか？
  choices:
    A: クラクションを鳴らして青信号であることを知らせる。
    B: その人の周りを注意深く進む。
    C: その人が道路を完全に渡りきるまで停止したままでいる。
    D: 標示のある横断歩道にいる場合のみ道を譲る。
  answer: C
  explanation: マニュアルには、たとえ青信号であっても、その人が道路を完全に渡りきるまで停止したままでいなければならないと記載されています。
- id: 104
  category: safe_driving_rules
  question: 指定されたスクールゾーン（学校の速度制限区域）での減速された制限速度は何mphですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: スクールゾーンとは、20 mphの減速された制限速度が適用される区域であり、学校の速度制限標識によって定義されています。
- id: 105
  category: signs_and_signals
  question: 学校の速度制限標識に「School Hours（登校時間帯）」と指定されている場合、学校がある日の何時から何時まで減速された制限速度が適用されますか？
  choices:
    A: 午前7時から午後4時
    B: 午前8時から午後5時
    C: 午前7時から午後5時
    D: 午前8時から午後4時
  answer: C
  explanation: 「School Hours（登校時間帯）」の速度制限標識は、学校がある日の午前7時から午後5時までの間に適用されます。
- id: 106
  category: safe_driving_rules
  question: マニュアルによると、スクールゾーンにおいて「子供がいる（children are present）」とは次のどの状況を意味しますか？
  choices:
    A: 子供たちが近くのフェンスで囲まれた校庭で遊んでいる。
    B: 子供たちが横断歩道で待っている。
    C: スクールバスが学校の駐車場に停まっている。
    D: 平日の午前8時から午後3時の間である。
  answer: B
  explanation: マニュアルでは、「子供がいる」状態を、子供たちが横断歩道で待っている、横断歩道内にいる、または横断歩道を歩いている場合、あるいは交通パトロール隊員が横断歩道で子供たちを補助するためにいる場合と定義しています。
- id: 107
  category: sharing_the_road
  question: 自転車専用レーンを横切って運転することが許可されるのはいつですか？
  choices:
    A: 曲がる準備をする時。
    B: 右側の遅い車両を追い越す時。
    C: 曲がる時、または路地、私道、専用道路に出入りする時。
    D: 自転車専用レーンを横切ることは決して許可されない。
  answer: C
  explanation: 曲がる時、または路地、私道、専用道路に出入りする時に自転車専用レーンを横切ることはできますが、曲がる準備のために自転車専用レーンに入ったり走行したりすることはできません。
- id: 108
  category: sharing_the_road
  question: 35 mphを超える速度で、自分の車線を走行している自転車に乗っている人を追い越す場合、何が求められますか？
  choices:
    A: 追い越す前にクラクションを鳴らさなければならない。
    B: その人が転倒した場合でも接触を防ぐのに十分な距離を空ける場合にのみ追い越すことができる。
    C: 自転車を追い越すには完全に車線を変更しなければならない。
    D: 35 mphを超える速度で自転車を追い越すことは許可されていない。
  answer: B
  explanation: 35 mphを超える速度では、自転車に乗っている人が転倒した場合でも接触を防ぐのに十分な距離を空ける場合にのみ、自分の車線を走行している自転車を追い越すことができます。
- id: 109
  category: signs_and_signals
  question: 自分の車線に緑色に塗られたバイクボックス（自転車用停止ボックス）があり、赤信号で停止する場合、どうしなければなりませんか？
  choices:
    A: 自転車が前に割り込むのを防ぐため、バイクボックスの中に停止する。
    B: バイクボックスの手前（後ろ）で停止する。
    C: 自転車に道を譲った後、赤信号で右折する。
    D: 信号機のセンサーを作動させるため、バイクボックスに半分入る。
  answer: B
  explanation: 運転者は、信号待ちの際、バイクボックスの手前（後ろ）で停止しなければなりません。ボックス内に停止してはいけません。さらに、これらの交差点では赤信号時の右折は許可されていません。
- id: 110
  category: signs_and_signals
  question: 道路にペイントされた「シャロウ（sharrow）」は何を示していますか？
  choices:
    A: その車線は自転車専用である。
    B: その車線は共有されており、自転車に乗っている人が道路にいる可能性がある。
    C: この車線では、自転車は自動車に道を譲らなければならない。
    D: 車線が終了するため、自転車は右に合流しなければならない。
  answer: B
  explanation: シャロウは、その車線が共有されており、自転車に乗っている人が道路にいる可能性があることを示しています。自転車のシンボルの上に2つの山形マーク（シェブロン）があることで示されます。
- id: 111
  category: defensive_driving
  question: 方向指示器（ウィンカー）を出して向かってくる対向オートバイの前で曲がる前に、特に注意しなければならないのはなぜですか？
  choices:
    A: オートバイは交差点で常に優先権を持っているため。
    B: 一部のオートバイの方向指示器は自動的に解除されないため、ライダーが消し忘れている可能性があるため。
    C: オートバイは他の車両よりも速く曲がるため。
    D: オートバイの方向指示器は配線が逆になっていることが多いため。
  answer: B
  explanation: 一部のオートバイでは方向指示器が自動的に解除されないため、ライダーが消し忘れることがあります。行動を起こす前に、ライダーが実際に曲がるために減速していることを確認する必要があります。
- id: 112
  category: sharing_the_road
  question: オートバイや原動機付自転車（モペッド）に乗っている人と車線を共有することは合法ですか？
  choices:
    A: はい。車線が両方の車両にとって十分な広さがある場合は合法です。
    B: はい。ただし、交通が停止しているか、非常にゆっくり動いている場合のみです。
    C: いいえ。オートバイや原動機付自転車と車線を共有することは法律違反です。
    D: いいえ。オートバイのライダーが安全であると合図しない限り違法です。
  answer: C
  explanation: マニュアルには明確に次のように記載されています。「オートバイや原動機付自転車に乗っている人と車線を共有することは法律違反です。追い越す際は、彼らに1車線分を完全に空けなければなりません。」
- id: 113
  category: vehicle_information
  question: 同じ速度で走行している小型車両と比較して、大型車両が停止するのに通常どれくらいの距離が必要ですか？
  choices:
    A: ほぼ同じ距離
    B: 約2倍の距離
    C: 約3倍の距離
    D: 約4倍の距離
  answer: C
  explanation: 大型車両は、同じ速度で走行している小型車両に比べて、停止するのに約3倍の距離を必要とします。
- id: 114
  category: sharing_the_road
  question: 自分が大型車両の側面の死角（ブラインドスポット）を走行しているかどうかは、どのようにして分かりますか？
  choices:
    A: 後部バンパーから50フィート以内にいる。
    B: 大型車両のサイドミラーに運転手が映っていない。
    C: 大型車両が時速55マイル以上で走行している。
    D: 大型車両の方向指示器が点滅しているのが見える。
  answer: B
  explanation: 大型車両の両側面には大きな死角があります。大型車両のサイドミラーに運転手が映っていない場合、運転手からもあなたの車は見えていません。
- id: 115
  category: safe_driving_rules
  question: 大型車両を追い越す際、その前の車線に戻るのが安全なのはいつですか？
  choices:
    A: 自分の車の後部バンパーが大型車両の前に出た直後。
    B: ルームミラーに大型車両の前面全体が見えたとき。
    C: 大型車両の運転手がヘッドライトをパッシングしたとき。
    D: 追い越し速度を少なくとも10秒間維持した後。
  answer: B
  explanation: 大型車両を追い越す際は、その前に戻る前に、ルームミラーで大型車両の前面全体が見えるか確認する必要があります。
- id: 116
  category: defensive_driving
  question: 対向車線に先導車（パイロット車両）が見えた場合、どうするべきですか？
  choices:
    A: 道路から完全に外れて停止する。
    B: ヘッドライトをパッシングして運転手に合図を送る。
    C: 速度を落とし、車線内の可能な限り右側に車を寄せる。
    D: 中央の右左折車線に移動して、余分なスペースを空ける。
  answer: C
  explanation: 対向車線に先導車が見えた場合は、速度を落とし、車線内に留まりながら可能な限り右側に車を寄せてください。
- id: 117
  category: safe_driving_rules
  question: 舗装されていない中央分離帯で区切られた分割道路（ディバイデッド・ハイウェイ）を走行している場合、赤いライトを点滅させているスクールバスに対していつ停止しなければなりませんか？
  choices:
    A: 道路のどちら側を走行しているかに関係なく、常に停止しなければならない。
    B: バスと同じ側の道路を走行している場合のみ停止しなければならない。
    C: 子供たちが中央分離帯を横断している場合のみ停止しなければならない。
    D: 分割道路では停止する必要はない。
  answer: B
  explanation: 舗装されていない中央分離帯や防護柵で2つの道路に区切られた分割道路を走行している場合、バスと同じ側の道路を走行している場合のみ停止しなければなりません。
- id: 118
  category: sharing_the_road
  question: ペイントされた中央分離帯がある分割道路で、スクールバスが赤いライトを点滅させて停止している場合、誰が停止しなければなりませんか？
  choices:
    A: バスと同じ側の交通のみ
    B: すべての車線の交通
    C: バスの後ろの交通のみ
    D: どの交通も停止する必要はない
  answer: B
  explanation: ペイントされた中央分離帯や右左折車線は、2つの独立した道路を形成するものではありません。この場合、赤いライトを点滅させているスクールバスに対して、すべての車線の交通が停止しなければなりません。
- id: 119
  category: sharing_the_road
  question: 車線に戻ろうとしている公共路線バスに対して、いつ道を譲らなければなりませんか？
  choices:
    A: バスがハザードランプを点灯しているときはいつでも
    B: 運転手が車線に戻る合図を出し、バスの後部で電光の「YIELD（譲れ）」標識が点滅しているとき
    C: 制限速度未満で走行している場合のみ
    D: 公共路線バスに道を譲る義務は一切ない
  answer: B
  explanation: バスの運転手が車線に戻る合図を出し、バスの後部で「YIELD（譲れ）」の電光標識が点滅している場合、後方から接近する車両は道を譲らなければなりません。
- id: 120
  category: signs_and_signals
  question: 低速車両のエンブレム（標識）はどのような見た目ですか？
  choices:
    A: 黒い縁取りのある黄色の三角形
    B: 反射する赤い縁取りと、蛍光オレンジ色の中心部
    C: 中央に赤い円がある白い正方形
    D: 黒い縁取りのある蛍光緑色のひし形
  answer: B
  explanation: 低速車両のエンブレムは、反射する赤い縁取りと蛍光オレンジ色の中心部で構成されています。
- id: 121
  category: vehicle_information
  question: 車両の後部からどれくらいはみ出す積載物の先端には、少なくとも12インチ四方の赤い旗を表示しなければなりませんか？
  choices:
    A: 2フィート以上
    B: 3フィート以上
    C: 4フィート以上
    D: 5フィート以上
  answer: C
  explanation: 車両の後部から4フィート以上はみ出す積載物の先端には、少なくとも12インチ四方の赤い旗を表示しなければなりません。
- id: 122
  category: vehicle_information
  question: 乗用車の右フェンダーの側面から、積載物はどれくらいはみ出してもよいですか？
  choices:
    A: フェンダーからはみ出してはならない
    B: 最大6インチまで
    C: 最大12インチまで
    D: 最大2フィートまで
  answer: B
  explanation: 乗用車の場合、積載物は右フェンダーの側面から6インチを超えてはみ出してはなりません。
- id: 123
  category: sharing_the_road
  question: 葬列の参加者ではない場合、葬列の車両の間を走行することに関する規則は何ですか？
  choices:
    A: ハザードランプを点灯させれば葬列に加わることができる
    B: 右折する場合にのみ車両の間を走行できる
    C: 葬列に加わったり、車両の間を走行したりすることは法律違反である
    D: クラクションを鳴らせば葬列を追い越すことができる
  answer: C
  explanation: 葬列の参加者ではない場合、葬列に加わったり、車両の間を走行したりすることは法律で禁じられています。
- id: 124
  category: safe_driving_rules
  question: 複数車線の道路でライトを点滅させて停車している自動車に近づいた際、車線変更をしない場合、どのくらい減速しなければなりませんか？
  choices:
    A: 制限速度より少なくとも5 mph（マイル毎時）遅い速度まで
    B: 制限速度より少なくとも10 mph遅い速度まで
    C: ちょうど20 mphまで
    D: ちょうど15 mphまで
  answer: A
  explanation: ライトを点滅させて停車している車両に近づく際に車線変更をしない場合は、制限速度より少なくとも5 mph（マイル毎時）遅い速度まで減速しなければなりません。
- id: 125
  category: safe_driving_rules
  question: ライトやサイレンを作動させた緊急車両が通り過ぎた後、その車両から最低どれくらいの車間距離を保たなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: 緊急車両が通り過ぎた後は、その車両から少なくとも500フィート後方を維持しなければなりません。
- id: 126
  category: safe_driving_rules
  question: 警察車両に停止を求められた際、どこに停止するのを避けるべきですか？
  choices:
    A: 道路の右側
    B: 交差点内、または幹線道路の中央分離帯
    C: 指定された駐車スペース
    D: 砂利の路肩
  answer: B
  explanation: 警察に停止を求められた場合は、安全な範囲でできるだけ道路の右側に寄せて運転してください。交差点内で停止したり、幹線道路の中央分離帯に入ったりしてはいけません。
- id: 127
  category: penalties_and_points
  question: すべての工事区間において、交通違反の罰金はどうなりますか？
  choices:
    A: 半額に減額される
    B: 通常の道路と同じまま
    C: 2倍になる
    D: 3倍になる
  answer: C
  explanation: すべての工事区間において、交通違反の罰金は2倍になります。
- id: 128
  category: safe_driving_rules
  question: 工事区間に掲示されている一時的な制限速度は、いつ適用されますか？
  choices:
    A: 作業員が見える場合のみ
    B: 日中のみ
    C: 作業員が見えなくても、常に
    D: 重機が稼働している場合のみ
  answer: C
  explanation: 工事区間に掲示されている一時的な制限速度は、作業員が見えなくても常に適用されます。
- id: 129
  category: safe_driving_rules
  question: 停止線がない踏切で停止する必要がある場合、最も近い線路からどれくらい離れた場所で停止しなければなりませんか？
  choices:
    A: 少なくとも5フィート
    B: 少なくとも10フィート
    C: 少なくとも15フィート
    D: 少なくとも25フィート
  answer: C
  explanation: 停止する必要がある場合は、停止線で停止してください。停止線がない場合は、最も近い線路から少なくとも15フィート離れた場所で停止してください。
- id: 130
  category: defensive_driving
  question: 車両が踏切内で立ち往生し、列車が近づいてきた場合、車から降りた後はどの方向に逃げるべきですか？
  choices:
    A: 線路と平行に、列車の進行方向と同じ方向
    B: 線路から45度の角度で、列車が来る方向
    C: 線路から90度の角度で、まっすぐ離れる方向
    D: 線路から45度の角度で、列車から遠ざかる方向
  answer: B
  explanation: 列車が近づいてきた場合は、衝突による破片に当たらないように、線路から45度の角度で列車が来る方向に向かって逃げてください。
- id: 131
  category: safe_driving_rules
  question: 警察に車を止められ、外が暗い場合、警察官が近づいてくる前に何をすべきですか？
  choices:
    A: すべてのライトを消す
    B: ハイビームを点灯する
    C: 車内のルームランプ（室内灯）を点灯する
    D: 懐中電灯を持って車から降りる
  answer: C
  explanation: 暗い場合は、車を停止させた後、警察官が近づいてくる前に車内のルームランプ（室内灯）を点灯させてください。
- id: 132
  category: sharing_the_road
  question: 交差点を通過し始めたときに、サイレンを鳴らした救急車が後方から近づいてくるのが見えた場合、どうすればよいですか？
  choices:
    A: 交差点内で直ちに停止する
    B: 交差点を通り抜け、右側に寄せて停止する
    C: 交差点内で右側に寄せて停止する
    D: スピードを上げて交差点を抜け、そのまま走り続ける
  answer: B
  explanation: 緊急車両のために交差点内で停止してはいけません。交差点を通り抜けてから右側に寄せて停止する必要があります。
- id: 133
  category: safe_driving_rules
  question: 車が踏切内で立ち往生し、列車が近づいてきた場合、どうすればよいですか？
  choices:
    A: 列車が進行しているのと同じ方向に、線路からまっすぐ離れて逃げる。
    B: 列車の進行方向に向かって、線路から45度の角度で逃げる。
    C: 車内にとどまり、すぐに911に電話する。
    D: 車の横に立ち、腕を振って列車に知らせる。
  answer: B
  explanation: 列車が近づいてきた場合は、飛び散る破片に当たらないように、列車の進行方向に向かって線路から45度の角度で逃げてください。
- id: 134
  category: sharing_the_road
  question: 路面電車やライトレール（LRT）が乗客の乗降のために停止している場合、どうすべきですか？
  choices:
    A: クラクションを鳴らして右側を追い越す。
    B: 時速10マイル以下の速度で注意深く追い越す。
    C: 電車が再び動き出すか、人々が安全に離れるまで後方で待機する。
    D: 車線変更をして加速し、素早く追い越す。
  answer: C
  explanation: 路面電車や列車が乗客の乗降のために停止している場合は、電車が再び動き出すか、人々が安全に離れるまで後方で待機してください。
- id: 135
  category: sharing_the_road
  question: 隣の車線から、自分と同じ方向に進んでいる路面電車の前を横切って曲がることは安全ですか？
  choices:
    A: はい、路面電車が停止している場合。
    B: はい、方向指示器（ウィンカー）を使用する場合。
    C: いいえ、隣の車線から路面電車の前を横切って曲がっては絶対にいけません。
    D: いいえ、商用車を運転している場合を除きます。
  answer: C
  explanation: たとえ路面電車や列車が停止していても、隣の車線から自分と同じ方向に進んでいる路面電車や列車の前を横切って曲がっては絶対にいけません。
- id: 136
  category: safe_driving_rules
  question: 縦列駐車をする際、車を縁石からどのくらい近づけなければなりませんか？
  choices:
    A: 6インチ以内
    B: 12インチ以内
    C: 18インチ以内
    D: 24インチ以内
  answer: B
  explanation: 縁石と平行に、12インチ以内に駐車してください。
- id: 137
  category: safe_driving_rules
  question: 下り坂で縁石に沿って駐車する場合、タイヤ（前輪）をどちらに向けるべきですか？
  choices:
    A: 走行車線側
    B: まっすぐ前
    C: 縁石側
    D: 道路の端側
  answer: C
  explanation: 下り坂で縁石に沿って駐車する場合は、車が坂を下って転がるのを防ぐため、タイヤを縁石側に向けてください。
- id: 138
  category: penalties_and_points
  question: 有効な許可証なしに障害者用駐車スペースに駐車した場合の最低罰金額はいくらですか？
  choices:
    A: 50ドル
    B: 100ドル
    C: 165ドル
    D: 250ドル
  answer: C
  explanation: 障害者用駐車許可証を所持していない場合、罰金は165ドルから始まり、最大1,000ドルに達します。
- id: 139
  category: safe_driving_rules
  question: 消火栓から何フィート以内は、車を停止または駐車してはいけませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: A
  explanation: 消火栓から10フィート以内は、車を停止または駐車することはできません。
- id: 140
  category: safe_driving_rules
  question: 交差点にある標示のある横断歩道、または標示のない横断歩道から何フィート以内に駐車することは違法ですか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: C
  explanation: 交差点にある標示のある横断歩道、または標示のない横断歩道から20フィート以内は、車を停止または駐車することはできません。
- id: 141
  category: safe_driving_rules
  question: 交通信号や標識から50フィート以内に駐車してはならないのは、次の場合です：
  choices:
    A: 複数車線の幹線道路（ハイウェイ）にいる場合。
    B: 自分の車が信号や標識を隠して見えなくしてしまう場合。
    C: 制限速度が35 mphを超えている場合。
    D: 2時間以上駐車する場合。
  answer: B
  explanation: 自分の車が信号や標識を隠して見えなくしてしまう場合、交通信号や標識から50フィート以内に車を停車または駐車することはできません。
- id: 142
  category: defensive_driving
  question: 緊急事態のために幹線道路（ハイウェイ）の路肩に駐車しなければならず、200フィート離れた場所から自分の車が見えない場合、どうしなければなりませんか？
  choices:
    A: ハイビームのヘッドライトを点灯する。
    B: 少なくとも200フィート離れた場所に旗、発炎筒、または標識を設置して、接近する車に警告する。
    C: 車道に立って腕を振る。
    D: ドアを開けたままエンジンをかけた状態にしておく。
  answer: B
  explanation: 自分の車が前後200フィートの距離から見えない場合は、接近する車に警告する必要があります。これは、車の前後それぞれ少なくとも200フィート離れた場所に旗、発炎筒、標識、信号、または交通誘導員を配置することで行うことができます。
- id: 143
  category: safe_driving_rules
  question: 緊急停車中に車から離れなければならない場合、次のようにすべきです：
  choices:
    A: バッテリーを充電しておくためにエンジンをかけたままにする。
    B: レッカー車の運転手のためにキーをイグニッションに挿したままにする。
    C: エンジンを切り、キーを抜き、ブレーキをかけ、ハザードランプを点灯させる。
    D: バッテリーを節約するためにハザードランプを消す。
  answer: C
  explanation: 車から離れなければならない場合は、エンジンを切り、キーを抜き、ブレーキをかけ、ハザードランプを点灯させてください。
- id: 144
  category: driver_responsibility
  question: オレゴン州でシートベルトを正しく着用するためのルールは、次のうちどれですか？
  choices:
    A: 不快な場合は、ショルダーストラップを脇の下に通してもよい。
    B: ショルダーストラップを背中の後ろに回してもよい。
    C: 快適にするため、ラップ（腰）部分に少しゆとりを持たせるべきである。
    D: ショルダーストラップを脇の下に通したり、背中の後ろに回したりしてはならない。
  answer: D
  explanation: ベルトのラップ（腰）部分やショルダー部分にゆとりを持たせないでください。ショルダーストラップを脇の下に通したり、背中の後ろに回したりしてはなりません。
- id: 145
  category: safe_driving_rules
  question: 駐車または停車した状態から発進して交通の流れに再び合流する際、最も安全な方法はどれですか？
  choices:
    A: ミラーを確認し、素早く発進する。
    B: 死角とミラーを確認し、他のすべての車両に道を譲る。
    C: 他の運転手が道を譲らなければならないため、合図を出して交通の流れに入る。
    D: 発進する前にクラクションを鳴らす。
  answer: B
  explanation: 駐車または停車した状態から発進する際は、死角とミラーを確認し、他のすべての車両に道を譲ってください。
- id: 146
  category: signs_and_signals
  question: 踏切にある緊急通知システム（ENS）の標識の目的は何ですか？
  choices:
    A: 運転手に列車の接近を警告するため。
    B: 線路上の障害物を鉄道会社に通知し、接近する列車に警告できるようにするため。
    C: 道路を横断する列車の制限速度を示すため。
    D: 線路を安全に横断する方法の指示を提供するため。
  answer: B
  explanation: 線路上の障害物を鉄道会社に通知し、接近する列車に警告できるようにするため、線路近くの踏切の支柱にある緊急通知システム（ENS）の標識を探してください。
- id: 147
  category: safe_driving_rules
  question: 乳児は何歳まで後ろ向きのチャイルドシートに乗せなければなりませんか？
  choices:
    A: 1歳
    B: 2歳
    C: 3歳
    D: 4歳
  answer: B
  explanation: マニュアルによると、乳児は2歳になるまで後ろ向きのチャイルドシートに乗せなければなりません。
- id: 148
  category: safe_driving_rules
  question: 子供の乗客が、承認されたチャイルドシートで拘束される必要がなくなるのはいつですか？
  choices:
    A: 6歳、または身長が4フィートに達したとき
    B: 8歳、または身長が少なくとも4フィート9インチに達したとき
    C: 体重が60ポンドに達したとき
    D: 10歳になったとき
  answer: B
  explanation: 子供の乗客は、8歳になるか、身長が少なくとも4フィート9インチに達し、大人用のシートベルトが正しくフィットするようになるまで、承認されたチャイルドシートで拘束されなければなりません。
- id: 149
  category: defensive_driving
  question: 衝突を避けるための選択肢について、正しいものは次のうちどれですか？
  choices:
    A: 通常、車を曲げるよりも早く車を停止させることができる。
    B: ほとんどの場合、車を停止させるよりも早く車を曲げることができる。
    C: 衝突を避けるためにスピードを上げることは、決して安全な選択肢ではない。
    D: 常に直ちに急ブレーキをかけるべきである。
  answer: B
  explanation: マニュアルには、ほとんどの場合、車を停止させるよりも早く車を曲げることができると記載されており、素早く曲がることが衝突を避けるための有効な方法となります。
- id: 150
  category: defensive_driving
  question: 車が舗装路から外れてしまった場合、安全に道路に戻るための適切な方法は何ですか？
  choices:
    A: 急ブレーキをかけ、ハンドルを左に急に切る。
    B: パニックになり、すぐに舗装路に急ハンドルを切って戻る。
    C: 減速し、道路に戻るのに十分なだけ前輪を曲げる。
    D: 道路にハンドルを切って戻る前に、トラクションを取り戻すために加速する。
  answer: C
  explanation: 道路から外れてしまった場合は、パニックになったり急ブレーキをかけたりしてはいけません。減速し、ハンドルをしっかりと握り、急に曲がるのではなく、道路に戻るのに十分なだけ前輪を曲げてください。
- id: 151
  category: defensive_driving
  question: 対向車があなたの車線にはみ出してきた場合、それを避けるために対向車線に入っては「絶対に」いけないのはなぜですか？
  choices:
    A: いかなる状況でもセンターラインを越えることは違法だから。
    B: 対向車の運転手が急に元の車線（対向車線）に戻ってくるかもしれないから。
    C: 道路の反対側では車のトラクション（駆動力）が失われるから。
    D: クラクションやライトを効果的に使えなくなるから。
  answer: B
  explanation: マニュアルでは、対向車の運転手が急に元の車線に戻ってきて正面衝突する危険があるため、対向車線には絶対に入らないよう警告しています。
- id: 152
  category: sharing_the_road
  question: あなたが近づいたときに、馬に乗っている人が手を挙げた場合、それは何を意味していますか？
  choices:
    A: 早く追い越すように合図している。
    B: あなたの存在に気づいて手を振っている。
    C: 動物が怯えているため、あなたは車を停止させなければならない。
    D: 動物に警告するためにクラクションを鳴らすべきである。
  answer: C
  explanation: 馬に乗っている人や動物を連れている人が手を挙げるのは、動物が怯えていることを意味しており、停止することで衝突を引き起こす場合を除き、車を停止させなければなりません。
- id: 153
  category: safe_driving_rules
  question: 日没から日の出までの時間に加えて、どのような時にヘッドライトを点灯しなければなりませんか？
  choices:
    A: 高速道路を運転している時はいつでも。
    B: 状況により、1,000フィート先の歩行者や車両が見えにくい時。
    C: ワイパーを使用している時のみ。
    D: 視界が500フィート以下に低下した時。
  answer: B
  explanation: ヘッドライトは、日没から日の出までの間、および状況により1,000フィート先の歩行者や車両が見えにくい場合には常に点灯しなければなりません。
- id: 154
  category: safe_driving_rules
  question: 他の車両の後ろを走行する際、どのくらいの距離でハイビームを減光（ロービームに）しなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 350フィート
    D: 500フィート
  answer: C
  explanation: ルームミラー越しに前の運転手の目を眩ませないようにするため、他の車両の350フィート後方を走行する際は、ライトを減光（ロービームに）しなければなりません。
- id: 155
  category: defensive_driving
  question: 夜間、対向車のヘッドライトの眩しさで目が眩むのを防ぐにはどうすればよいですか？
  choices:
    A: 対向車のヘッドライトを直接見る。
    B: 対向車のライトの少し右側を見て、道路の端やフォグライン（車道外側線）を見る。
    C: 眩しさに対抗するためにハイビームを点灯する。
    D: 車が通り過ぎるまで片目を閉じる。
  answer: B
  explanation: 夜間にヘッドライトの眩しさで目が眩むのを軽減するには、対向車のライトの少し右側を見て、道路の端やフォグライン（車道外側線）を見るようにします。
- id: 156
  category: safe_driving_rules
  question: 霧、土埃、または煙の中を運転する際は、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: パーキングライトのみ
    D: ハザードランプのみ
  answer: B
  explanation: 霧、土埃、煙、または視界の悪い場所を運転する場合は、ハイビームの光が反射して眩しさを引き起こすため、ロービームのヘッドライトを使用してください。
- id: 157
  category: safe_driving_rules
  question: 濡れた路面や雪、氷の上を運転する際、使用しては「いけない」車の機能は何ですか？
  choices:
    A: ワイパー
    B: ロービーム
    C: デフロスター
    D: クルーズコントロール
  answer: D
  explanation: マニュアルには「濡れた路面ではクルーズコントロールを使用しないでください」と明記されており、雪や氷の中での運転についてもこの警告が繰り返されています。
- id: 158
  category: vehicle_information
  question: 水溜まりを走行した後にブレーキが濡れてしまった場合、どうすればよいですか？
  choices:
    A: ブレーキを乾かすために、何度も急ブレーキをかける。
    B: ブレーキが効き始めるまで、ゆっくり走行しながら軽くブレーキをかける。
    C: ニュートラルに入れ、ブレーキが乾くまで惰性で走行する。
    D: すぐに車を停止させ、ブレーキが自然に乾くのを待つ。
  answer: B
  explanation: 水溜まりを走行してブレーキが濡れた場合は、ブレーキが効き始めるまで、ゆっくり走行しながら軽くブレーキをかける必要があります。
- id: 159
  category: defensive_driving
  question: 雪や氷に覆われた道路が最も滑りやすくなるのはいつですか？
  choices:
    A: 気温が氷点下よりずっと低い時。
    B: 気温が氷点（0度）付近の時。
    C: 日の出前の早朝の時間帯。
    D: 太陽が氷に直接当たっている時。
  answer: B
  explanation: マニュアルでは、気温が氷点下よりずっと低い時よりも、氷点（0度）付近の時の方が道路が最も滑りやすくなることに注意するよう運転手にアドバイスしています。
- id: 160
  category: defensive_driving
  question: 車がスリップ（スキッド）し始めた場合、正しいハンドルの操作はどれですか？
  choices:
    A: ハンドルを完全にまっすぐに保つ。
    B: スリップしている方向とは逆の方向にハンドルを切る。
    C: 車を進めたい方向にハンドルを切る。
    D: トラクションを取り戻すために、ハンドルを左右に急に切る。
  answer: C
  explanation: 車がスリップし始めたら、ブレーキから足を離し、車を進めたい方向にハンドルを切る必要があります。
- id: 161
  category: vehicle_information
  question: オレゴン州において、スパイクタイヤの使用が一般的に許可されているのは何月から何月までですか？
  choices:
    A: 10月1日から4月30日まで
    B: 11月1日から3月31日まで
    C: 12月1日から2月28日まで
    D: 一年中許可されている。
  answer: B
  explanation: オレゴン州では、スパイクタイヤの使用は一般的に11月1日から3月31日までの間のみ許可されています。
- id: 162
  category: safe_driving_rules
  question: オレゴン州において、18歳未満の運転者の携帯電話使用に関する規則はどれですか？
  choices:
    A: ハンズフリーのアクセサリーを使用してもよい。
    B: 赤信号で停車している間に限り、テキストメッセージを送信できる。
    C: 車両の運転中に携帯電話やその他のモバイル電子機器を使用することは違法である。
    D: GPSナビゲーションの目的に限り、携帯電話を使用してもよい。
  answer: C
  explanation: マニュアルには、18歳未満の運転者が車両の運転中に携帯電話やその他のモバイル電子機器を使用することは違法であると記載されています。
- id: 163
  category: safe_driving_rules
  question: 運転中に携帯電話を使用したい18歳以上の運転者は、以下のどれを行わなければなりませんか？
  choices:
    A: 携帯電話を膝の上に置く。
    B: 指を最小限に使うだけで済むハンズフリーのアクセサリーを使用する。
    C: 時速30マイル（約48km/h）未満で運転している間に限り、携帯電話を使用する。
    D: 電話に出るために路肩に車を寄せる。
  answer: B
  explanation: 18歳以上の運転者が携帯電話を使用する場合はハンズフリーのアクセサリーを使用しなければならず、機器の起動や停止には指を最小限に使うだけで済むものでなければなりません。
- id: 164
  category: penalties_and_points
  question: 車両からどれくらい離れた距離で聞こえるほど、ラジオや音響システムを大音量で鳴らすことは違法ですか？
  choices:
    A: 25フィート（約7.6メートル）
    B: 50フィート（約15メートル）
    C: 100フィート（約30メートル）
    D: 200フィート（約60メートル）
  answer: B
  explanation: クラクションやサイレンの音を聞き取ることが重要であるため、車両から50フィート離れた場所で聞こえるほどラジオやその他の音響システムを大音量で鳴らすことは違法です。
- id: 165
  category: defensive_driving
  question: 「ロードレイジ（あおり運転などの攻撃的な運転）」をしている攻撃的な運転者に遭遇した場合、どうすべきですか？
  choices:
    A: スピードを上げて逃げる。
    B: クラクションを鳴らして他の運転者に警告する。
    C: 道を譲り、相手を刺激しないようにする。
    D: 相手より速く運転して安全な場所に向かう。
  answer: C
  explanation: 攻撃的な運転者を見かけたら、道を譲ってください。スピードを上げたり、相手より速く走ろうとしたりして、相手を刺激してはいけません。
- id: 166
  category: safe_driving_rules
  question: 運転中の眠気を防ぐために推奨されているのは、次のうちどれですか？
  choices:
    A: できるだけ早く目的地まで無理して運転を続ける。
    B: 脱水症状を防ぐために水を飲む。
    C: ラジオの音量を最大にする。
    D: 視線をまっすぐ前に固定する。
  answer: B
  explanation: 眠気を防ぐため、マニュアルでは水を飲むことを推奨しています。脱水症状は疲労の原因となるためです。
- id: 167
  category: alcohol_drugs_health
  question: オレゴン州法において、血中アルコール濃度（BAC）がどれ以上の場合、運転能力が低下しているとみなされ、飲酒・薬物影響下運転（DUII）で逮捕される可能性がありますか？
  choices:
    A: 0.04%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: 血中アルコール濃度が0.08%以上の場合、オレゴン州法では運転能力が低下しているとみなされます。
- id: 168
  category: alcohol_drugs_health
  question: オレゴン州の「黙示の同意（Implied Consent）法」とは何を意味しますか？
  choices:
    A: 車を止められた場合、車両の捜索に同意する。
    B: 警察官に求められた場合、呼気、血液、または尿の検査を受けることに同意する。
    C: DUIIで逮捕された場合、自動的に有罪を認める。
    D: 交通違反切符に関連するすべての罰金を支払うことに同意する。
  answer: B
  explanation: オレゴン州の黙示の同意法は、自動車を運転することにより、警察官から求められた際に呼気、血液、または尿の検査を受けることに同意したとみなされることを意味します。
- id: 169
  category: alcohol_drugs_health
  question: 21歳未満の場合、血中アルコール濃度がどれくらいであれば血中アルコール検査に不合格となりますか？
  choices:
    A: 0.02%以上
    B: 0.05%以上
    C: 0.08%以上
    D: 検出された場合（いかなる量でも）
  answer: D
  explanation: オレゴン州のゼロ・トレランス（絶対不容認）法により、21歳未満の場合は、いかなる量でも血中アルコール濃度が検出されれば検査に不合格となります。
- id: 170
  category: alcohol_drugs_health
  question: オレゴン州の「開栓済み容器（Open Container）法」によると、開栓されたアルコールの瓶や容器は車内のどこに保管すべきですか？
  choices:
    A: グローブボックスの中
    B: 運転席の下
    C: トランクの中
    D: 後部座席の足元
  answer: C
  explanation: オレゴン州の開栓済み容器法では、開栓された瓶や容器はトランクに入れなければならないと定められています。
- id: 171
  category: safe_driving_rules
  question: オレゴン州法では、何歳未満の人が車のボンネット、フェンダー、またはピックアップトラックの荷台に乗ることを禁止していますか？
  choices:
    A: 16歳
    B: 18歳
    C: 21歳
    D: 年齢制限はない（すべての人が違法である）
  answer: B
  explanation: オレゴン州法では、18歳未満の人が車のボンネット、フェンダー、ランニングボード、またはピックアップトラックの荷台を含む車両の外部に乗ることを禁止しています。
- id: 172
  category: defensive_driving
  question: 運転中にタイヤがパンク（バースト）した場合、最初にすべきことは何ですか？
  choices:
    A: すぐに急ブレーキをかける。
    B: ハンドルをしっかりと握る。
    C: ニュートラルにシフトチェンジする。
    D: ハザードランプを点灯させる。
  answer: B
  explanation: タイヤがパンクした場合、マニュアルでは、まずハンドルをしっかりと握り、その後徐々に減速して道路脇に車を停めるよう指示しています。
- id: 173
  category: defensive_driving
  question: 運転中にブレーキが効かなくなった場合、次のうちどのアクションを取るべきですか？
  choices:
    A: より高いギアにシフトチェンジする。
    B: すぐにエンジンを切る。
    C: ブレーキペダルを何度も踏み込んで（ポンピングブレーキ）、圧力を高める。
    D: できるだけ早くパーキングブレーキを引く。
  answer: C
  explanation: ブレーキが効かなくなった場合は、ブレーキペダルを何度も踏み込んで（ポンピングブレーキ）ください。これにより十分な圧力がかかり、再びブレーキが効くようになる可能性があります。
- id: 174
  category: defensive_driving
  question: 車のアクセルペダルが戻らなくなった（引っかかった）場合、どうすればよいですか？
  choices:
    A: 開いた手のひらを使って、ギアをニュートラルに入れる。
    B: すぐにエンジンを切る。
    C: アクセルペダルを素早く何度も踏み込む。
    D: リバース（後退）にシフトチェンジする。
  answer: A
  explanation: アクセルが戻らなくなった場合は、退避経路を探し、誤って他のギアに入れないように、開いた手のひらを使ってギアをニュートラルに入れてください。
- id: 175
  category: vehicle_information
  question: 燃費を向上させ、燃料を節約するために推奨されるテクニックは次のうちどれですか？
  choices:
    A: 急発進や急ブレーキを行う。
    B: エンジンを温かく保つためにアイドリングする。
    C: 一定の速度で運転し、標識の制限速度を超えないようにする。
    D: 用事のために何度も別々に車を出す。
  answer: C
  explanation: 燃費を向上させたり燃料を節約したりするために、マニュアルでは一定の速度で運転し、標識の制限速度を超えないようにすることを推奨しています。
- id: 176
  category: safe_driving_rules
  question: 運転中に携帯電話にテキストメッセージを受信した場合、どうすればよいですか？
  choices:
    A: すばやくメッセージを読んで返信する。
    B: 安全な駐車場に車を停めるまでメッセージを無視する。
    C: 自分が入力している間、同乗者にメッセージを読んでもらう。
    D: 減速し、道路から目を離さずにメッセージを読む。
  answer: B
  explanation: マニュアルには、運転中に携帯電話にテキストメッセージを受信した場合、安全な駐車場に車を停めるまでメッセージを無視すべきであると記載されています。
- id: 177
  category: license_system
  question: クラスCの非商用運転免許（Class C non-commercial driving privilege）では、重量が何ポンド以下の車両を運転できますか？
  choices:
    A: 10,000ポンド
    B: 16,000ポンド
    C: 26,000ポンド
    D: 33,000ポンド
  answer: C
  explanation: クラスCの非商用運転免許では、商用運転免許（CDL）やオートバイの免許区分（endorsement）の要件が免除されている、重量26,000ポンド以下の車両を運転することができます。
- id: 178
  category: license_system
  question: オレゴン州で仮免許（instruction permit）を申請するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: B
  explanation: クラスCの非商用運転免許の資格を得るには、仮免許を申請する時点で15歳以上である必要があります。
- id: 179
  category: license_system
  question: オレゴン州運輸省（ODOT）が承認した交通安全教育コースを受講していない18歳未満の申請者には、何時間の監督付き運転経験が必要ですか？
  choices:
    A: 40時間
    B: 50時間
    C: 80時間
    D: 100時間
  answer: D
  explanation: 18歳未満の申請者は、100時間の監督付き運転経験が必要です。ただし、ODOTが承認した交通安全教育コースを受講した場合は、50時間の監督付き運転経験で済みます。
- id: 180
  category: license_system
  question: 必要な運転経験としてカウントされるためには、監督するドライバーが21歳以上であり、かつ有効な運転免許を少なくとも何年間保持している必要がありますか？
  choices:
    A: 1年間
    B: 2年間
    C: 3年間
    D: 5年間
  answer: C
  explanation: 運転経験がカウントされるのは、21歳以上で、有効な運転免許を少なくとも3年間保持している人が監督した場合のみです。
- id: 181
  category: license_system
  question: オレゴン州の運転免許証（driving privilege）用の写真を撮影する際、許可されていないものは次のうちどれですか？
  choices:
    A: 笑顔
    B: 補聴器の着用
    C: 眼鏡の着用
    D: 髪を後ろで束ねること
  answer: C
  explanation: 写真撮影の際、帽子、眼鏡、顔のペイントやその他の一時的な物質、または目の外観を変えるコンタクトレンズの着用は許可されていません。
- id: 182
  category: license_system
  question: 身元および生年月日を証明する有効な書類は、次のうちどれですか？
  choices:
    A: 病院発行の出生証明書
    B: 洗礼記録
    C: 10年前に失効した米国パスポート
    D: 米国政府発行の出生証明書
  answer: D
  explanation: 有効な証明書類には、米国政府発行の出生証明書が含まれます。病院発行の出生証明書や洗礼記録は認められず、パスポートは失効から5年以上経過しているものは使用できません。
- id: 183
  category: license_system
  question: 現在の居住地住所の有効な証明となるものは、次のうちどれですか？
  choices:
    A: 友人からの個人的な郵便物
    B: 転送された郵便物
    C: 公共料金の接続申込書または請求書
    D: 姓が記載されていない雑誌の定期購読物
  answer: C
  explanation: 一般的な住所証明には、公共料金の接続申込書、請求書、住宅ローン書類、または固定資産税の明細書が含まれます。個人的な郵便物や転送された郵便物は認められません。
- id: 184
  category: license_system
  question: 運転免許証または許可証に「聴覚障害または難聴（Deaf or hard of hearing）」の指定を追加するには、どのような証明が必要ですか？
  choices:
    A: 医師の診断書
    B: 認定専門医によるオージオグラム（聴力図）
    C: 裁判官が署名した用紙
    D: 証明は不要
  answer: D
  explanation: DMVに対し、運転免許証または許可証に聴覚障害または難聴の指定を追加するようリクエストすることができます。証明は必要ありません。
- id: 185
  category: vehicle_information
  question: オレゴン州において、1回の衝突事故につき義務付けられている対物賠償責任保険の最低補償額はいくらですか？
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: オレゴン州法では、他人の財産に対する損害について、1回の衝突事故につき最低$20,000の保険に加入することが義務付けられています。
- id: 186
  category: driver_responsibility
  question: 負傷者のいない衝突事故に巻き込まれた場合、自分の車両をどうするべきですか？
  choices:
    A: 警察が到着するまで、そのままの場所に置いておく。
    B: 安全が確認でき次第、速やかに走行車線から移動させる。
    C: すぐに自宅まで運転し、後で警察に電話する。
    D: 車両を放置し、最寄りの電話まで歩く。
  answer: B
  explanation: 負傷者がおらず、車両を安全に移動できる場合は、できるだけ早く走行車線から車両を移動させなければなりません。
- id: 187
  category: driver_responsibility
  question: いずれかの車両の損害額が$2,500を超え、かつ次の条件に当てはまる場合、72時間以内にDMVに衝突事故報告書を提出しなければなりません：
  choices:
    A: 衝突事故が夜間に発生した。
    B: 相手の運転手が保険に加入していない。
    C: 損傷により、いずれかの車両が現場からレッカー移動された。
    D: 制限速度が55 mphを超えていた。
  answer: C
  explanation: いずれかの車両の損害額が$2,500を超え、かつ衝突による損傷のため現場からいずれかの車両がレッカー移動された場合、72時間以内に衝突事故報告書を提出しなければなりません。
- id: 188
  category: driver_responsibility
  question: 無人の車両に衝突し、所有者が見つからない場合、どうしなければなりませんか？
  choices:
    A: 誰も怪我をしていないので、すぐに現場を離れる。
    B: 現場を離れる前に、最長1時間車両のそばで待機する。
    C: 自分の名前、住所、および事故の簡単な説明を記したメモを残す。
    D: レッカー車を呼び、損傷した車両を撤去する。
  answer: C
  explanation: 無人の車両に衝突し、所有者が見つからない場合は、自分の名前と住所、および事故の簡単な説明を記したメモを残してください。
- id: 189
  category: penalties_and_points
  question: オレゴン州で運転免許（driving privileges）を失う理由となるのは、次のうちどれですか？
  choices:
    A: 車両の衝突事故の報告を怠ること。
    B: 1回の駐車違反切符を切られること。
    C: 20年以上前の車両を運転すること。
    D: 免許証を家に忘れること。
  answer: A
  explanation: 運転免許を失う理由には、車両の衝突事故の報告を怠ること、無保険での運転、および飲酒・薬物影響下での運転（DUI）が含まれます。
- id: 190
  category: penalties_and_points
  question: 交通違反の有罪判決が多すぎることにより運転免許を失うことに関連するプログラムは何ですか？
  choices:
    A: 交通更生システム (Traffic Rehabilitation System)
    B: 安全運転イニシアチブ (Safe Driver Initiative)
    C: 運転者改善プログラム (Driver Improvement Program)
    D: 有罪判決軽減プログラム (Conviction Reduction Program)
  answer: C
  explanation: マニュアルには、運転者改善プログラム（Driver Improvement Program）に基づき、交通違反の有罪判決が多すぎる場合は運転免許を失う可能性があると記載されています。
- id: 191
  category: alcohol_drugs_health
  question: 次のうち、影響下で運転すると運転免許を失う可能性があるものはどれですか？
  choices:
    A: アルコールのみ
    B: 薬物のみ
    C: 処方薬のみ
    D: アルコール、薬物、または吸入剤
  answer: D
  explanation: アルコール、薬物、または吸入剤の影響下で運転した場合、運転免許を失う可能性があります。
- id: 192
  category: penalties_and_points
  question: 次のどれに従わなかった場合、運転免許を失う可能性がありますか？
  choices:
    A: 陪審員の召喚状
    B: 裁判所の罰金
    C: 車両登録更新の通知
    D: 町内会の規則
  answer: B
  explanation: 裁判所の罰金に従わないことは、運転免許を失う理由の一つとして挙げられています。
- id: 193
  category: penalties_and_points
  question: マニュアルによると、どのような経済的保護を持たずに運転すると、運転免許を失う原因になりますか？
  choices:
    A: 車両保険（総合補償）
    B: 無保険車傷害保険
    C: 自動車保険（無保険運転）
    D: ロードサービス
  answer: C
  explanation: 無保険での運転は、運転免許を失う理由の一つです。
- id: 194
  category: driver_responsibility
  question: 誰かが人身売買の被害者であると疑い、犯罪が進行中であるのを目撃した場合、まず何をすべきですか？
  choices:
    A: 介入するために密売人に近づく
    B: 911に電話する
    C: 目的地まで車両を追跡する
    D: ソーシャルメディアに投稿する
  answer: B
  explanation: 誰かが人身売買の被害者であると疑い、犯罪が進行中であるのを目撃した場合、マニュアルでは911に電話するよう指示しています。
- id: 195
  category: driver_responsibility
  question: 人身売買の疑いについて通報する際、次のような「実行可能な情報（actionable information）」を提供する必要があります：
  choices:
    A: あなた個人の運転記録
    B: 被害者の財務履歴
    C: 関与している車、ナンバープレート、および人物の特徴
    D: あなたの車両の登録番号
  answer: C
  explanation: 実行可能な情報には、時間、日付、場所、関与している車やトラックの特徴（メーカー、車種、色、ナンバープレート）、および人物の特徴が含まれます。
- id: 196
  category: driver_responsibility
  question: マニュアルが人身売買の疑いがある者に近づかないよう警告しているのはなぜですか？
  choices:
    A: 一般市民が密売人と話すことは違法だから
    B: 危険であり、密売人の起訴において問題を引き起こす可能性があるから
    C: 密売人は通常、お金を要求してくるから
    D: 誤って道案内をしてしまうかもしれないから
  answer: B
  explanation: 密売人に近づくことは、あなたや被害者にとって危険であるだけでなく、最終的な密売人の起訴において問題を引き起こす可能性があります。
- id: 197
  category: driver_responsibility
  question: マニュアルによると、性的搾取のために売買される未成年者は：
  choices:
    A: 助けを求めた場合にのみ被害者とみなされる
    B: オンラインで勧誘された場合は被害者とみなされない
    C: 常に人身売買の被害者である
    D: 地元のDMV（車両管理局）オフィスによって処理される
  answer: C
  explanation: マニュアルには「性的搾取のために売買される未成年者は、常に人身売買の被害者である」と明記されています。
- id: 198
  category: alcohol_drugs_health
  question: 飲酒運転を通報するには、何番に電話すべきですか？
  choices:
    A: 503-945-5000
    B: 503-299-9999
    C: '711'
    D: '911'
  answer: D
  explanation: 「重要な連絡先情報」のセクションには、飲酒運転の通報先として911が記載されています。
- id: 199
  category: safe_driving_rules
  question: マニュアルによると、オレゴン州の道路情報はどこで確認できますか？
  choices:
    A: OregonDMV.com
    B: TripCheck.com
    C: TATアプリ
    D: 人口動態記録局 (Vital Records office)
  answer: B
  explanation: 「重要な連絡先情報」のセクションには、道路情報としてTripCheck.comが記載されています。
- id: 200
  category: license_system
  question: ポートランド地域外からDMV（車両管理局）に連絡する必要がある場合、どの番号を使用すべきですか？
  choices:
    A: 503-299-9999
    B: 503-945-5000
    C: 971-673-1190
    D: 1-888-3737-888
  answer: B
  explanation: ポートランド地域外からのDMVの連絡先番号は503-945-5000です。
- id: 201
  category: license_system
  question: 聴覚障害のある方がDMV（車両管理局）に連絡するために、州全域で利用できるサービスは何ですか？
  choices:
    A: TripCheck.com
    B: Statewide Relay 711（州全域リレーサービス）
    C: 全米人身売買ホットライン (The National Human Trafficking Hotline)
    D: ODOT（オレゴン州運輸省）非差別チーム
  answer: B
  explanation: マニュアルの連絡先情報には、「TDD（聴覚障害者向け）.......................Statewide Relay 711」と記載されています。
- id: 202
  category: driver_responsibility
  question: 人身売買の危険信号（レッドフラッグ）に関する情報を得るために、マニュアルがダウンロードを推奨しているアプリは何ですか？
  choices:
    A: TripCheckアプリ
    B: TATアプリ
    C: ODOTアプリ
    D: DMV Nowアプリ
  answer: B
  explanation: マニュアルには、「人身売買の危険信号（レッドフラッグ）および詳細情報については、今すぐTATアプリをダウンロードしてください」と記載されています。
- id: 203
  category: license_system
  question: オレゴン州の出生証明書に関する情報が必要な場合、どの窓口に連絡するべきですか？
  choices:
    A: 運転改善プログラム (Driver Improvement Program)
    B: ODOT非差別チーム
    C: 人口動態記録局 (Vital Records)
    D: DMV運転プログラム
  answer: C
  explanation: マニュアルには、人口動態記録局—オレゴン州（出生証明書情報）の連絡先として971-673-1190が記載されています。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に進入する前に完全に停止しなければならないことを意味します。進行する前に、他の車両や歩行者がいないか確認してください。
  id: 204
- image: yield.png
  category: signs_and_signals
  question: この標識は運転者に何を求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通に合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（ゆずれ）」の標識は、減速し、他の車両や歩行者に優先権（通行権）を譲らなければならないことを意味します。他の人や車が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 205
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」の標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路など、進入すると対向車と衝突する危険がある場所に設置されています。
  id: 206
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見た場合、どうするべきですか？
  choices:
    A: Uターンする
    B: 注意しながら運転を続ける
    C: 停止して後退するか、方向転換する（逆走しているため）
    D: 加速してそのエリアから素早く抜け出す
  answer: C
  explanation: 赤と白の「WRONG WAY（逆走）」の標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に方向転換するか後退してください。
  id: 207
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方向（左方向）にのみ流れる
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」の標識は、この道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 208
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 他の車両の追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、この場所でのUターンが禁止されていることを意味します。
  id: 209
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行動は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、この交差点での左折が許可されていないことを意味します。
  id: 210
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印が斜線で消されている白い規制標識は、この場所での右折が禁止されていることを意味します。
  id: 211
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道路幅減少
    B: この区間では他の車両を追い越してはいけない
    C: この先、対面通行
    D: 右側通行
  answer: B
  explanation: 白黒のペナント型（三角旗型）の「NO PASSING ZONE（追い越し禁止区間）」標識は、このエリアで他の車両を追い越すことが禁止されていることを意味します。これは追い越し禁止区間の始まりを示しています。
  id: 212
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転手に何を指示していますか？
  choices:
    A: 右へ合流
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線減少
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 213
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色から判断して、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事用標識
  answer: C
  explanation: 黒字で書かれた白い長方形の標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 214
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先、動物園またはアニマルパーク
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟エリア
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。減速し、特に明け方と夕暮れ時は動物に注意してください。
  id: 215
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、スクールゾーン
    B: この先、横断歩道
    C: 近くにハイキングコースがある
    D: この先、バス停
  answer: B
  explanation: 歩行者の図が描かれた黄色いひし形の標識は、この先に横断歩道があることを警告しています。道路を横断する歩行者のために停止する準備をしてください。
  id: 216
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは学校横断歩道
    D: 病院ゾーン
  answer: C
  explanation: 五角形の蛍光黄緑色の標識は、スクールゾーンまたは学校横断歩道を示しています。減速し、子供に注意してください。
  id: 217
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い丸い標識は何を警告していますか？
  choices:
    A: この先、ラウンドアバウト（環状交差点）
    B: 病院ゾーン
    C: この先、踏切
    D: 追い越し禁止区間
  answer: C
  explanation: 黒いXと2つのRが描かれた黄色い丸い標識は、この先に踏切があることを示す事前警告標識です。減速し、列車が来ないか見て、音を聞いて確認してください。
  id: 218
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 学校横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型の踏切標識（クロスバック）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は、停止しなければなりません。
  id: 219
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先、行き止まり
    B: 右折必須
    C: この先、右カーブ
    D: この先、迂回路
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先にカーブがあることを警告しています。カーブに入る前に減速してください。
  id: 220
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブ標識とどう違いますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: より大幅な減速を必要とする急な曲がり角を警告している
    C: 右折専用を意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブ標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角を示しています。この曲がり角の手前では、より大幅に減速する必要があります。
  id: 221
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道路
    B: 前方に単一のカーブ
    C: 反対方向に向かう2つの連続するカーブ
    D: 前方にラウンドアバウト（環状交差点）
  answer: C
  explanation: リバースカーブ（S字カーブ）標識は、前方に反対方向に向かう2つのカーブがあることを警告しています。減速し、道路が最初に一方へ、次に他方へ曲がることに備えてください。
  id: 222
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 単一の急カーブ
    B: 滑りやすい路面
    C: 前方に連続するカーブや曲がり角
    D: 前方に坂道
  answer: C
  explanation: つづら折り（連続カーブ）標識は、前方に連続するカーブや曲がり角があることを警告しています。減速し、変化する道路状況に注意してください。
  id: 223
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう指示していますか？
  choices:
    A: 車線の減少
    B: 別の道路からの合流車両
    C: 中央分離帯のある幹線道路の始まり
    D: 1車線に狭まる道路
  answer: B
  explanation: 黄色いひし形の合流標識は、別の道路からの車両があなたの車線に合流してくることを警告しています。速度と位置を調整する準備をしてください。
  id: 224
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 前方に橋
    B: 前方の道路幅減少
    C: 車線の終了
    D: 中央分離帯のある幹線道路の終了
  answer: B
  explanation: この警戒標識は、前方の道路が狭くなることを示しています。道路幅の減少に備え、車線内の位置を調整してください。
  id: 225
- image: divided_highway.png
  category: signs_and_signals
  question: この標識は前方に何があることを示していますか？
  choices:
    A: 道路の行き止まり
    B: 対面通行
    C: 中央分離帯のある幹線道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、前方の道路が中央分離帯や防護柵で対向車線と区切られた幹線道路になることを警告しています。右側を通行してください。
  id: 226
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある幹線道路の始まり
    B: 中央分離帯のある幹線道路が終わり、対面通行に戻る
    C: 前方に合流エリア
    D: 前方で道路工事
  answer: B
  explanation: この標識は、中央分離帯のある幹線道路が終了することを警告しています。対向車線との間の中央分離帯がなくなります。対面通行に備えてください。
  id: 227
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある幹線道路の始まり
    B: 前方に追い越し可能区間
    C: 前方は対面通行 — 車両が双方向に通行する
    D: 前方で車線のシフト（移動）
  answer: C
  explanation: この標識は、前方が対面通行であることを警告しています。一方通行の道路や中央分離帯のある幹線道路を離れ、反対方向に進む車両とすれ違うことになります。
  id: 228
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 凍結した道路状況
    B: 濡れると滑りやすくなる道路
    C: 前方に曲がりくねった道路
    D: 凹凸のある路面
  answer: B
  explanation: 「濡れると滑りやすい（スリップ注意）」の標識は、雨天時や路面が濡れている状態では非常に滑りやすくなることを警告しています。減速し、急ブレーキや急ハンドルを避けてください。
  id: 229
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 道路の段差
    B: 凹凸のある路面
    C: 前方に急な坂道や勾配
    D: 道路工事
  answer: C
  explanation: この標識は、前方に急な坂道や勾配があることを警告しています。特にトラックを運転している場合や牽引している場合は、速度を調整し、低速ギアにシフトダウンする必要があるかもしれません。
  id: 230
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は、何に備えるよう警告していますか？
  choices:
    A: 前方に一時停止標識がある
    B: 前方に信号機がある
    C: 学校の横断歩道がある
    D: 警察の検問所がある
  answer: B
  explanation: この標識は、前方に信号機があることを警告しています。信号が赤または黄色の場合は停止する準備をしてください。この標識は、遠くから信号機が見えにくい場所によく設置されます。
  id: 231
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識は、前方に何があることを示していますか？
  choices:
    A: 「ゆずりあい（Yield）」の標識
    B: 信号機
    C: 必ず停止しなければならない一時停止標識
    D: スピードハンプ（減速帯）
  answer: C
  explanation: この標識は、前方に一時停止標識があることを警告しています。減速を始め、一時停止標識で完全に停止する準備をしてください。
  id: 232
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 前方に踏切がある
    B: 前方に十字路または交差点がある
    C: 前方に病院がある
    D: 横断歩道がある
  answer: B
  explanation: この標識は、前方に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 233
- image: side_road.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 前方に丁字路（T字路）がある
    B: 右側から合流する脇道がある
    C: 道路にカーブがある
    D: 行き止まりである
  answer: B
  explanation: この標識は、右側から合流する脇道があることを警告しています。脇道から幹線道路に進入してくる車両に注意してください。
  id: 234
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流している
    B: 車線が減少している
    C: 新しい車線が追加されている（合流の必要なし）
    D: 右折が必須である
  answer: C
  explanation: 車線追加の標識は、合流を必要とせずに新しい車線が幹線道路に加わることを意味します。ランプ（進入路）から進入する車両には、専用の新しい車線があります。
  id: 235
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 常時停車すること
    B: このエリアに駐車すること
    C: 停車またはアイドリングすること
    D: 荷物の積み下ろしをすること
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」の標識は、このエリアに車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは許可されています。
  id: 236
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識があるスペースには、誰が駐車できますか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用プラカードまたはナンバープレートを掲示している車両のみ
    D: 障害のある同乗者がいるすべての運転手
  answer: C
  explanation: 車椅子のマークが描かれた青い標識は、障害者専用の駐車スペースであることを示しています。有効な障害者用駐車プラカードまたはナンバープレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 237
