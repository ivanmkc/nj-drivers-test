metadata:
  source: 2025 Maine Driver's Manual
  total_questions: 246
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Maine, what is the minimum age to apply for a learner's permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: B
  explanation: According to the Maine Driver's Manual, an individual must be at least
    15 years of age to apply for a learner's permit.
- id: 2
  category: license_system
  question: For a person under the age of 21, how long must they hold a learner's
    permit before they are eligible to take a driving test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Maine law requires permit holders under the age of 21 to hold their
    permit for at least six months before they can take the road test.
- id: 3
  category: license_system
  question: Under Maine's GDL laws, how many hours of driving practice must a permit
    holder under 21 complete before taking the road test?
  choices:
    A: 40 hours, including 5 at night
    B: 50 hours, including 10 at night
    C: 70 hours, including 10 at night
    D: 100 hours, including 20 at night
  answer: C
  explanation: Maine requires 70 hours of practice driving, and at least 10 of those
    hours must be at night.
- id: 4
  category: license_system
  question: How long do the restrictions on an intermediate license last for a Maine
    driver who is under 21 years of age?
  choices:
    A: 180 days
    B: 270 days
    C: 1 year
    D: Until they turn 18
  answer: B
  explanation: In Maine, the intermediate license restrictions (such as passenger
    and night driving limits) remain in effect for 270 days.
- id: 5
  category: license_system
  question: A Maine driver with an intermediate license is prohibited from operating
    a motor vehicle between which hours?
  choices:
    A: 10:00 PM and 4:00 AM
    B: 11:00 PM and 5:00 AM
    C: 12:00 AM (Midnight) and 5:00 AM
    D: 1:00 AM and 6:00 AM
  answer: C
  explanation: Intermediate license holders in Maine are restricted from driving between
    the hours of 12 a.m. and 5 a.m.
- id: 6
  category: license_system
  question: In Maine, who is allowed to sit in the front seat to supervise a learner's
    permit holder?
  choices:
    A: Any licensed driver over 18 years old
    B: A licensed driver at least 20 years old who has held a valid license for at
      least 2 years
    C: A parent or legal guardian only
    D: Any licensed driver who is at least 21 years old
  answer: B
  explanation: The person accompanying a permit holder must be at least 20 years of
    age, have held a valid license for at least two years, and be occupying the seat
    beside the driver.
- id: 7
  category: license_system
  question: If you move to Maine and hold a valid out-of-state driver's license, how
    many days do you have to obtain a Maine driver's license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New Maine residents must obtain a Maine driver's license within 30
    days of establishing residency.
- id: 8
  category: license_system
  question: What is the minimum visual acuity required to obtain a Maine driver's
    license without restrictions?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Maine requires a minimum visual acuity of 20/40 in the better eye to
    qualify for an unrestricted license.
- id: 9
  category: license_system
  question: Under Maine's point system, how many demerit points within a 12-month
    period will result in a license suspension?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: If a driver accumulates 12 or more demerit points within a 12-month
    period, their license will be suspended.
- id: 10
  category: license_system
  question: How long do demerit points remain on a driver's record in Maine for the
    purpose of suspension calculations?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: In Maine, demerit points are counted toward suspension if they were
    earned within the previous 12 months.
- id: 11
  category: license_system
  question: What is the minimum amount of liability insurance coverage required in
    Maine for injury or death of one person?
  choices:
    A: $25,000
    B: $50,000
    C: $100,000
    D: $20,000
  answer: B
  explanation: Maine law requires minimum liability insurance of $50,000 for injury
    or death of one person.
- id: 12
  category: license_system
  question: For a driver under the age of 21, what is the legal Blood Alcohol Content
    (BAC) limit in Maine?
  choices:
    A: 0.00% (Zero Tolerance)
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Maine has a zero-tolerance law for drivers under 21; it is illegal
    for them to operate a vehicle with any measurable amount of alcohol in their system.
- id: 13
  category: license_system
  question: Which of the following is a restriction for a driver with a Maine intermediate
    license?
  choices:
    A: They cannot drive on the Maine Turnpike
    B: They cannot carry any passengers other than immediate family members
    C: They must always drive with a licensed adult over 21
    D: They cannot drive faster than 45 mph
  answer: B
  explanation: Intermediate license holders are restricted from carrying passengers
    other than immediate family members unless accompanied by a licensed driver who
    meets the supervision requirements.
- id: 14
  category: license_system
  question: In Maine, how many days do you have to notify the Bureau of Motor Vehicles
    (BMV) of a change in name or address?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Maine law requires you to notify the BMV within 30 days of a change
    in your name or permanent address.
- id: 15
  category: license_system
  question: What is the standard duration of a Maine driver's license for an individual
    under the age of 65?
  choices:
    A: 4 years
    B: 5 years
    C: 6 years
    D: 8 years
  answer: C
  explanation: In Maine, a standard driver's license is typically issued for a period
    of 6 years for drivers under age 65.
- id: 16
  category: license_system
  question: In Maine, if you fail your driving road test, how many days must you wait
    before you are eligible to take the test again?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 45 days
  answer: D
  explanation: According to the Maine Driver's Manual, if an applicant fails the road
    test, they must wait at least 45 days before they can be re-examined.
- id: 17
  category: license_system
  question: For a person 21 years of age or older, the first Maine driver's license
    issued is considered 'provisional' for what period of time?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: In Maine, if you are 21 years of age or older, your first license is
    provisional for a period of one year. For those under 21, it is two years.
- id: 18
  category: license_system
  question: Under Maine law, a person is classified as a 'Habitual Offender' if they
    accumulate how many major motor vehicle convictions within a three-year period?
  choices:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
  answer: B
  explanation: Maine's Habitual Offender law applies to persons who have been convicted
    of three or more major motor vehicle offenses (such as OUI or driving while suspended)
    within a three-year period.
- id: 19
  category: license_system
  question: A standard Maine Class C driver's license allows you to operate a single
    vehicle with a Gross Vehicle Weight Rating (GVWR) of up to how many pounds?
  choices:
    A: 10,000 lbs
    B: 16,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: A Class C license is the standard operator's license in Maine and covers
    any single vehicle with a GVWR of less than 26,001 pounds.
- id: 20
  category: license_system
  question: If a Maine driver is arrested for OUI and refuses to submit to a chemical
    test, their license will be immediately suspended for at least how many days for
    a first refusal?
  choices:
    A: 90 days
    B: 150 days
    C: 275 days
    D: 1 year
  answer: C
  explanation: Under Maine's Implied Consent law, a first refusal to submit to a chemical
    test results in an administrative license suspension of 275 days.
- id: 21
  category: license_system
  question: What is the standard fee to reinstate a Maine driver's license following
    a suspension for an OUI offense?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: B
  explanation: Maine law requires a $50 reinstatement fee for most suspensions, including
    OUI, though other fees like a $50 fee for failing to pay child support or a $50
    fee for general suspensions also apply.
- id: 22
  category: license_system
  question: In Maine, motor vehicles must be inspected for safety at an official inspection
    station how often?
  choices:
    A: Every 6 months
    B: Once a year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: Maine law requires that all motor vehicles registered in the state
    undergo a safety inspection once a year.
- id: 23
  category: license_system
  question: In Maine, a Certificate of Title is required for all motor vehicles except
    those that are older than what model year?
  choices:
    A: '1985'
    B: '1990'
    C: '1995'
    D: '2000'
  answer: C
  explanation: Maine does not require titles for vehicles that are model year 1994
    or older. Vehicles 1995 and newer must have a title.
- id: 24
  category: license_system
  question: Under the Maine demerit point system, how many points are assessed for
    a conviction of operating a motor vehicle 15 to 29 miles per hour over the speed
    limit?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Speeding 15-29 mph over the limit in Maine results in 6 demerit points
    being added to the driver's record.
- id: 25
  category: license_system
  question: To obtain a Maine REAL ID-compliant license, how many documents proving
    Maine residency must an applicant provide?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have a birth certificate
  answer: B
  explanation: To meet REAL ID requirements in Maine, applicants must provide two
    separate documents that establish Maine residency.
- id: 26
  category: license_system
  question: To have the 'Veteran' designation added to a Maine driver's license, what
    document must the applicant typically provide to the BMV?
  choices:
    A: A military ID card
    B: A letter from the VA
    C: A DD Form 214 (Discharge Papers)
    D: A valid US Passport
  answer: C
  explanation: Maine drivers who are honorably discharged veterans can have 'Veteran'
    printed on their license by providing their DD Form 214 or an equivalent discharge
    document.
- id: 27
  category: license_system
  question: In Maine, a person who has a medical condition that causes 'blackouts'
    or 'loss of consciousness' must be seizure-free for how long before they can be
    licensed?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: B
  explanation: Maine's medical rules generally require a person with a history of
    seizures or loss of consciousness to be free of such episodes for 6 months before
    being eligible for a license.
- id: 28
  category: license_system
  question: A Maine motorcycle learner's permit is valid for what length of time?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: D
  explanation: A Maine motorcycle learner's permit is valid for two years from the
    date of issuance.
- id: 29
  category: license_system
  question: 'For a first OUI offense in Maine (over age 21), the administrative license
    suspension period by the BMV is typically:'
  choices:
    A: 30 days
    B: 90 days
    C: 150 days
    D: 275 days
  answer: C
  explanation: For a first OUI offense where the driver is 21 or older and did not
    refuse the test, the BMV imposes a 150-day administrative suspension.
- id: 30
  category: license_system
  question: What is the minimum age to apply for a Class A or Class B Commercial Driver's
    License (CDL) in Maine for intrastate (within Maine only) operation?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: In Maine, you must be at least 18 years old to apply for a CDL for
    intrastate operation, but you must be 21 to operate a commercial vehicle across
    state lines (interstate).
- id: 31
  category: driver_testing
  question: To pass the Maine written knowledge test, what is the minimum number of
    questions you must answer correctly out of 30?
  choices:
    A: '15'
    B: '20'
    C: '24'
    D: '28'
  answer: C
  explanation: According to the Maine Motorist Handbook, the knowledge test consists
    of 30 questions and you must answer at least 24 questions correctly to pass (80%).
- id: 32
  category: driver_testing
  question: 'In Maine, you must file an official accident report with the BMV if the
    property damage to any one person appears to be at least:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $2,500
  answer: B
  explanation: Maine law requires that any accident resulting in bodily injury, death,
    or property damage of $1,000 or more must be reported to the Secretary of State.
- id: 33
  category: driver_testing
  question: If a Maine driver is convicted of passing a stopped school bus with its
    red lights flashing for the first time, what is the mandatory license suspension
    period?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Under Maine law, a first offense for illegally passing a stopped school
    bus with red lights flashing results in a mandatory 30-day license suspension
    and a minimum fine of $250.
- id: 34
  category: driver_testing
  question: Maine's 'Move Over' law requires drivers to slow down or change lanes
    when approaching which of the following stationary vehicles with activated lights?
  choices:
    A: Only police and fire vehicles
    B: Only ambulances and rescue vehicles
    C: Emergency, towing, and utility service vehicles
    D: Only snowplows
  answer: C
  explanation: Maine law requires drivers to move over or slow down for all stationary
    emergency vehicles, including police, fire, medical, towing, and utility service
    vehicles.
- id: 35
  category: driver_testing
  question: What is the minimum fine for a first offense of using a handheld electronic
    device while driving in Maine?
  choices:
    A: $25
    B: $50
    C: $150
    D: $500
  answer: B
  explanation: Maine law prohibits the use of handheld electronic devices while operating
    a motor vehicle. The fine for a first offense is not less than $50.
- id: 36
  category: driver_testing
  question: How often must a motor vehicle registered in Maine undergo a safety inspection?
  choices:
    A: Every 6 months
    B: Once a year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: All motor vehicles registered in Maine must be inspected once a year
    to ensure they meet safety standards.
- id: 37
  category: driver_testing
  question: In Maine, you must dim your high beam headlights when you are within how
    many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Maine law requires drivers to dim high beams when within 500 feet of
    an oncoming vehicle and within 300 feet of a vehicle they are following.
- id: 38
  category: driver_testing
  question: Under Maine law, it is illegal to park within how many feet of a fire
    hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Maine law prohibits parking within 10 feet of a fire hydrant.
- id: 39
  category: driver_testing
  question: What is the minimum legal tire tread depth for a passenger vehicle in
    Maine?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Maine law requires that tires have a tread depth of at least 2/32 of
    an inch to be considered safe and legal.
- id: 40
  category: driver_testing
  question: When parallel parking on a public road in Maine, your wheels must be within
    how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: The Maine Motorist Handbook states that when you park on a public road,
    you must park parallel to and within 12 inches of the curb.
- id: 41
  category: driver_testing
  question: In Maine, you must use your turn signal at least how many feet before
    making a turn or changing lanes?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Maine law requires drivers to signal their intent to turn or change
    lanes at least 100 feet before the maneuver.
- id: 42
  category: driver_testing
  question: What happens to the fine for speeding in a designated Maine work zone
    when workers are present?
  choices:
    A: It is increased by $50
    B: It is doubled
    C: It is tripled
    D: It remains the same as a standard ticket
  answer: B
  explanation: In Maine, fines for speeding in a designated work zone are doubled
    to protect road workers and drivers.
- id: 43
  category: driver_testing
  question: Maine law requires drivers to turn on their headlights in which of the
    following weather conditions?
  choices:
    A: Only when it is snowing
    B: Only when it is foggy
    C: Whenever windshield wipers are in constant use
    D: Only during a thunderstorm
  answer: C
  explanation: Maine law requires that headlights be turned on whenever windshield
    wipers are in constant use due to rain, mist, or snow.
- id: 44
  category: driver_testing
  question: During the Maine road test, which of the following actions will result
    in an automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: An accident or near-accident requiring the examiner to intervene
    C: Adjusting the seat before starting the engine
    D: Driving slightly below the speed limit
  answer: B
  explanation: During the road test, any action that results in an accident, or a
    near-accident where the examiner must take control of the vehicle, is an automatic
    failure.
- id: 45
  category: driver_testing
  question: If a driver fails the vision screening at a Maine BMV office, what is
    the required procedure?
  choices:
    A: They must wait one year to retake it
    B: They are permanently disqualified from driving
    C: They must have a vision form completed by an eye doctor
    D: They can skip the vision test if they have a clean record
  answer: C
  explanation: If an applicant fails the vision screening, they must have a vision
    form completed by an eye care professional to determine if they can safely drive
    with or without restrictions.
- id: 46
  category: driver_testing
  question: In Maine, what is the maximum speed limit in a school zone when children
    are present or when yellow lights are flashing?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: According to the Maine Motorist Handbook, the speed limit in a school
    zone is 15 mph when children are present or when lights are flashing.
- id: 47
  category: driver_testing
  question: Under Maine law, when must you turn on your headlights in relation to
    sunset and sunrise?
  choices:
    A: From sunset to sunrise
    B: One hour after sunset to one hour before sunrise
    C: One-half hour after sunset to one-half hour before sunrise
    D: Only when it is dark enough that you cannot see 200 feet ahead
  answer: C
  explanation: Maine law requires headlights to be turned on from one-half hour after
    sunset to one-half hour before sunrise.
- id: 48
  category: driver_testing
  question: What is the recommended following distance behind the vehicle in front
    of you under normal driving conditions in Maine?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: One car length for every 10 mph
  answer: B
  explanation: The Maine Motorist Handbook recommends a following distance of at least
    3 seconds to allow enough time to react to hazards.
- id: 49
  category: driver_testing
  question: How many feet must you park away from a fire hydrant in the state of Maine?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: In Maine, it is illegal to park within 10 feet of a fire hydrant.
- id: 50
  category: driver_testing
  question: Between which dates are studded snow tires permitted for use on Maine
    roads?
  choices:
    A: November 1st to April 1st
    B: October 1st to May 1st
    C: December 1st to March 15th
    D: October 15th to April 15th
  answer: B
  explanation: In Maine, studded tires are permitted from October 1st through May
    1st.
- id: 51
  category: driver_testing
  question: 'When an emergency vehicle with sirens and flashing lights is approaching
    from either direction, Maine law requires you to:'
  choices:
    A: Slow down and stay in your lane
    B: Speed up to get out of the way
    C: Pull to the right as far as possible and stop
    D: Stop exactly where you are
  answer: C
  explanation: Maine law requires drivers to pull to the right and stop for emergency
    vehicles using sirens or lights.
- id: 52
  category: driver_testing
  question: What is the minimum amount of property damage liability insurance required
    by Maine law?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Maine law requires a minimum of $25,000 in coverage for property damage
    liability.
- id: 53
  category: driver_testing
  question: 'In Maine, you must report a traffic accident to the police if the damage
    to property appears to be:'
  choices:
    A: $500 or more
    B: $1,000 or more
    C: $2,000 or more
    D: $5,000 or more
  answer: B
  explanation: Maine law requires accidents to be reported to the police if there
    is an injury, death, or property damage of $1,000 or more.
- id: 54
  category: driver_responsibility
  question: Maine law requires motor vehicle liability insurance to cover at least
    how much for the injury or death of more than one person in a single accident?
  choices:
    A: $50,000
    B: $75,000
    C: $100,000
    D: $150,000
  answer: C
  explanation: Maine's minimum liability insurance requirements are often referred
    to as 50/100/25, where $100,000 is the minimum for the injury or death of more
    than one person.
- id: 55
  category: driver_responsibility
  question: 'In addition to liability coverage, Maine law requires motor vehicle insurance
    policies to include a minimum medical payments coverage of:'
  choices:
    A: $1,000
    B: $2,000
    C: $5,000
    D: $10,000
  answer: B
  explanation: Maine law (Title 24-A §2902-D) requires a minimum of $2,000 in medical
    payments coverage for the protection of the insured and passengers.
- id: 56
  category: driver_responsibility
  question: If you establish residency in Maine, how many days do you have to register
    your motor vehicle with the Maine Bureau of Motor Vehicles?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents must register their vehicles in Maine within 30 days
    of establishing residency.
- id: 57
  category: driver_responsibility
  question: How often are motor vehicles registered in Maine required to pass an official
    safety inspection?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: In Maine, most motor vehicles must be inspected annually at an official
    inspection station to ensure they meet safety standards.
- id: 58
  category: driver_responsibility
  question: If a Maine driver is involved in an accident and cannot provide proof
    of financial responsibility (insurance), what action will the Secretary of State
    take?
  choices:
    A: Issue a warning
    B: Suspend the driver's license and registration
    C: Impose a mandatory 10-day jail sentence
    D: Require the driver to retake the written exam
  answer: B
  explanation: Failure to provide proof of insurance when involved in an accident
    or when requested by law enforcement results in the suspension of both the driver's
    license and the vehicle's registration.
- id: 59
  category: driver_responsibility
  question: Under Maine law, what is the maximum fine for a first-time conviction
    of littering from a motor vehicle?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Littering is illegal in Maine, and a first-time conviction can result
    in a fine of up to $500.
- id: 60
  category: driver_responsibility
  question: Maine's 'Open Container' law prohibits the possession of an open alcoholic
    beverage container in which part of the vehicle?
  choices:
    A: The trunk only
    B: The glove compartment only
    C: The passenger area of a motor vehicle on a public way
    D: Anywhere inside the vehicle, including the trunk
  answer: C
  explanation: Maine law prohibits the possession of an open container of alcohol
    in the passenger area of a motor vehicle while on a public way. This includes
    the driver and all passengers.
- id: 61
  category: driver_responsibility
  question: 'If a reportable accident in Maine is NOT investigated by a police officer,
    the driver must file a written report with the Secretary of State within:'
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 7 days
  answer: B
  explanation: If an accident meeting the reporting threshold is not investigated
    by a police officer, the driver is required to file a report with the Secretary
    of State within 48 hours.
- id: 62
  category: driver_responsibility
  question: When is a Maine driver required to show evidence of insurance?
  choices:
    A: Only when involved in an accident
    B: Only when registering a vehicle
    C: When registering a vehicle, during inspection, and when requested by a law
      enforcement officer
    D: Only when renewing a driver's license
  answer: C
  explanation: Proof of insurance is required in Maine during vehicle registration,
    at the time of the annual safety inspection, and whenever a police officer requests
    it.
- id: 63
  category: driver_responsibility
  question: In Maine, what is the fee to reinstate a driver's license that was suspended
    specifically for an OUI (Operating Under the Influence) offense?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: D
  explanation: While the standard reinstatement fee is $50, Maine law sets the reinstatement
    fee for alcohol or drug-related suspensions (OUI) at $200.
- id: 64
  category: driver_responsibility
  question: 'According to Maine vehicle inspection standards, a tire is considered
    unsafe and will fail inspection if the tread depth is less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Maine safety inspection rules require tires to have at least 2/32 of
    an inch of tread depth.
- id: 65
  category: driver_responsibility
  question: In Maine, what is the minimum light transmittance allowed for window tinting
    on the side windows to the left and right of the driver?
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: Maine law requires that window tinting on the front side windows allow
    at least 35% of light to pass through.
- id: 66
  category: driver_responsibility
  question: In Maine, a written report must be filed with the Secretary of State if
    an accident results in property damage estimated at or above what amount?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: According to the Maine Driver's Manual, any accident involving an injury,
    death, or property damage of $1,000 or more must be reported to the Secretary
    of State.
- id: 67
  category: driver_responsibility
  question: In Maine, what is the minimum liability insurance requirement for the
    injury or death of more than one person in a single accident?
  choices:
    A: $50,000
    B: $100,000
    C: $150,000
    D: $200,000
  answer: B
  explanation: Maine requires a minimum of $100,000 for the injury or death of more
    than one person in any one accident (part of the 50/100/25 requirement).
- id: 68
  category: driver_responsibility
  question: If a Maine driver is convicted of operating a motor vehicle without insurance,
    what is the minimum fine for a first offense?
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: B
  explanation: Failure to produce evidence of insurance in Maine can result in a fine
    between $100 and $500 and the suspension of the driver's license and registration.
- id: 69
  category: driver_responsibility
  question: If you are involved in an accident in Maine and do not have the required
    liability insurance, what must you do to avoid license suspension?
  choices:
    A: Pay a $500 fine immediately
    B: File a 'SR-22' certificate and post a cash deposit or bond for the damages
    C: Perform 100 hours of community service
    D: There is no way to avoid suspension if you are uninsured
  answer: B
  explanation: Under Maine's Financial Responsibility Law, if you are uninsured during
    an accident, you must provide proof of future financial responsibility (SR-22)
    and satisfy the damage requirements via a bond or deposit.
- id: 70
  category: driver_responsibility
  question: To whom do Maine residents typically pay the annual vehicle excise tax
    before they can register their vehicle?
  choices:
    A: The Maine State Police
    B: The Secretary of State
    C: The local municipal or town office
    D: The Internal Revenue Service
  answer: C
  explanation: Maine residents must pay an excise tax to their town or city of residence
    before the vehicle can be registered with the Bureau of Motor Vehicles.
- id: 71
  category: driver_responsibility
  question: If a Maine driver chooses a 'Combined Single Limit' (CSL) insurance policy
    instead of split limits, what is the minimum required amount?
  choices:
    A: $100,000
    B: $125,000
    C: $150,000
    D: $200,000
  answer: B
  explanation: Maine law allows for a Combined Single Limit policy of at least $125,000
    as an alternative to the 50/100/25 split limits.
- id: 72
  category: driver_responsibility
  question: In Maine, the driver is legally responsible for ensuring all passengers
    under what age are properly secured in a seat belt or child safety seat?
  choices:
    A: Under 12
    B: Under 16
    C: Under 18
    D: Under 21
  answer: C
  explanation: In Maine, the driver is responsible for any passenger under 18 years
    of age. Passengers 18 and older are responsible for themselves.
- id: 73
  category: driver_responsibility
  question: If you develop a medical condition that may affect your ability to drive
    safely, how many days do you have to notify the Maine Bureau of Motor Vehicles?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Maine law requires drivers to notify the BMV within 30 days if they
    develop a physical or mental condition that could impair their ability to operate
    a motor vehicle safely.
- id: 74
  category: driver_responsibility
  question: In Maine, during which time period is it legal to use studded snow tires
    on a motor vehicle?
  choices:
    A: November 1st to April 1st
    B: October 1st to May 1st
    C: December 1st to March 1st
    D: October 15th to April 15th
  answer: B
  explanation: Maine law permits the use of studded tires from October 1st through
    May 1st of each year.
- id: 75
  category: safe_driving_rules
  question: Under Maine law, how many feet must you park away from a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Maine law prohibits parking within 10 feet of a fire hydrant.
- id: 76
  category: safe_driving_rules
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended, Maine law requires drivers to stop at least how many feet away?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: In Maine, you must stop at least 30 feet from a school bus that is
    receiving or discharging passengers with its red lights flashing.
- id: 77
  category: safe_driving_rules
  question: What is the default speed limit in a Maine business or residential district
    unless otherwise posted?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: Unless otherwise posted, the statutory speed limit in business and
    residential districts in Maine is 25 mph.
- id: 78
  category: safe_driving_rules
  question: Maine's 'Move Over' law requires drivers to do what when approaching a
    stationary authorized emergency vehicle with its lights flashing on a multi-lane
    highway?
  choices:
    A: Stop immediately in the travel lane
    B: Maintain speed but honk to alert the emergency workers
    C: Move to a non-adjacent lane if safe to do so, or slow down to a reasonable
      speed
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Maine's Move Over law requires drivers to move into a lane that is
    not adjacent to the emergency vehicle if possible; if not, they must slow down
    to a safe and reasonable speed.
- id: 79
  category: safe_driving_rules
  question: In Maine, you are prohibited from parking within how many feet of a crosswalk
    at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Maine law states that you may not park within 15 feet of a crosswalk
    at an intersection.
- id: 80
  category: safe_driving_rules
  question: When operating windshield wipers in Maine due to rain, snow, or fog, what
    else must you do by law?
  choices:
    A: Turn on your hazard lights
    B: Turn on your interior dome light
    C: Turn on your headlights
    D: Drive at least 15 mph below the speed limit
  answer: C
  explanation: Maine law requires that headlights be turned on when windshield wipers
    are in constant use due to weather conditions.
- id: 81
  category: safe_driving_rules
  question: What is the penalty for a first-time speeding violation in a designated
    Maine work zone?
  choices:
    A: A warning only
    B: A fixed $500 fine
    C: The fine is doubled
    D: Immediate license revocation
  answer: C
  explanation: In Maine, fines for speeding in a work zone are doubled when workers
    are present.
- id: 82
  category: safe_driving_rules
  question: The Maine Motorist Handbook recommends using which 'rule' to maintain
    a safe following distance behind the vehicle in front of you?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The three-second rule
    D: The five-second rule
  answer: C
  explanation: Maine's driver manual recommends a minimum following distance of three
    seconds under normal driving conditions.
- id: 83
  category: safe_driving_rules
  question: In Maine, you may not park within how many feet of the entrance to a fire
    station driveway?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: C
  explanation: Maine law prohibits parking within 20 feet of the driveway entrance
    to any fire station.
- id: 84
  category: safe_driving_rules
  question: How many feet must you park away from a stop sign, yield sign, or traffic
    control signal in Maine?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Maine law prohibits parking within 30 feet of any flashing beacon,
    stop sign, yield sign, or traffic control signal.
- id: 85
  category: safe_driving_rules
  question: What is the maximum speed limit on rural highways in Maine unless otherwise
    posted?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: In Maine, the statutory speed limit for all other highways (rural roads
    not otherwise posted) is 45 mph.
- id: 86
  category: safe_driving_rules
  question: When planning to turn, Maine law requires you to signal your intent at
    least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: In Maine, you must signal at least 100 feet before you make a turn
    to provide adequate warning to other drivers.
- id: 87
  category: safe_driving_rules
  question: In Maine, you may not pull to the left side of the road to pass another
    vehicle when you are within how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Maine law prohibits passing on the left when you are within 100 feet
    of an intersection or a railroad crossing.
- id: 88
  category: safe_driving_rules
  question: When passing a bicycle in Maine, what is the minimum amount of distance
    you must leave between your vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Maine law requires motorists to leave at least 3 feet of clearance
    when passing a bicyclist.
- id: 89
  category: safe_driving_rules
  question: According to the Maine Motorist Handbook, at what speed can hydroplaning
    (tires losing contact with the road on water) begin?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Maine Motorist Handbook states that hydroplaning can begin at speeds
    as low as 35 mph in heavy rain.
- id: 90
  category: safe_driving_rules
  question: When entering a roundabout in Maine, who has the right-of-way?
  choices:
    A: The vehicle entering the roundabout
    B: The vehicle already in the roundabout
    C: The vehicle traveling at the highest speed
    D: The vehicle entering from the right
  answer: B
  explanation: In Maine roundabouts, entering traffic must yield the right-of-way
    to vehicles already circulating within the intersection.
- id: 91
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, how far ahead
    should you scan the road while driving in Maine?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: Only as far as your headlights reach
  answer: B
  explanation: Maine's driving manual recommends looking 10 to 15 seconds ahead. This
    allows you to see hazards early and adjust your speed or position safely.
- id: 92
  category: defensive_driving
  question: Under Maine law, when must you dim your high beam headlights when approaching
    an oncoming vehicle?
  choices:
    A: Within 200 feet
    B: Within 300 feet
    C: Within 500 feet
    D: Within 1,000 feet
  answer: C
  explanation: Maine law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet to prevent blinding the other driver.
- id: 93
  category: defensive_driving
  question: When following another vehicle at night in Maine, at what distance must
    you dim your high beam headlights?
  choices:
    A: Within 100 feet
    B: Within 300 feet
    C: Within 500 feet
    D: Within 600 feet
  answer: B
  explanation: Maine law requires you to switch to low beams when following another
    vehicle within 300 feet so your lights do not reflect in their rearview mirror.
- id: 94
  category: defensive_driving
  question: 'Maine law requires you to turn on your headlights whenever you are using
    your windshield wipers due to rain, snow, or sleet. This is known as:'
  choices:
    A: The Visibility Rule
    B: The Wipers-On, Lights-On Law
    C: The Adverse Weather Mandate
    D: The Safety Lighting Act
  answer: B
  explanation: According to Maine Title 29-A §2091, headlights must be illuminated
    when windshield wipers are in use due to atmospheric conditions like rain, snow,
    or mist.
- id: 95
  category: defensive_driving
  question: In Maine, what is the legal requirement regarding snow and ice on your
    vehicle before driving?
  choices:
    A: You only need to clear the driver's side of the windshield
    B: You must clear only the front and rear windows
    C: You must clear all windows and any snow or ice that might pose a danger to
      others
    D: There is no specific law as long as you can see the road
  answer: C
  explanation: Maine law (Title 29-A §2396) prohibits operating a vehicle with any
    amount of snow or ice that could fall off and endanger other motorists or pedestrians.
    All windows must also be clear for visibility.
- id: 96
  category: defensive_driving
  question: If a large animal, such as a moose or deer, runs in front of your vehicle
    on a Maine road, what is the safest defensive driving action?
  choices:
    A: Swerve sharply into the opposite lane to avoid it
    B: Brake firmly, stay in your lane, and do not swerve
    C: Speed up to pass the animal before it hits you
    D: Flash your high beams and honk continuously
  answer: B
  explanation: The Maine Driver's Manual advises that if a collision with an animal
    is inevitable, you should brake and stay in your lane. Swerving can lead to a
    more serious head-on collision or a rollover.
- id: 97
  category: defensive_driving
  question: When driving in heavy fog in Maine, which lights should you use?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the fog and
    create glare, making it harder for you to see.
- id: 98
  category: defensive_driving
  question: When the roads are slippery due to rain or snow in Maine, how should you
    adjust your following distance?
  choices:
    A: Keep it the same as in dry weather
    B: Decrease it to stay closer to the tracks of the car ahead
    C: Increase it to at least double the normal following distance
    D: Always maintain exactly 100 feet
  answer: C
  explanation: In adverse conditions, you should increase your following distance
    (often to 6 seconds or more) to account for increased braking distances on slippery
    surfaces.
- id: 99
  category: defensive_driving
  question: When approaching a sharp curve on a Maine rural road, when should you
    reduce your speed?
  choices:
    A: As you are halfway through the curve
    B: Before you enter the curve
    C: Only if you feel the tires sliding
    D: Immediately after exiting the curve
  answer: B
  explanation: Defensive driving requires slowing down before you enter a curve. Braking
    while in the curve can cause the vehicle to skid.
- id: 100
  category: defensive_driving
  question: Unless otherwise posted, what is the 'prima facie' speed limit in Maine
    for open country or rural roads?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: In Maine, the default speed limit for roads outside of business or
    residential districts is 45 mph unless otherwise posted.
- id: 101
  category: defensive_driving
  question: Total stopping distance is the sum of reaction distance and braking distance.
    At 50 mph, approximately how many feet will a vehicle travel before coming to
    a complete stop on dry pavement?
  choices:
    A: 50 feet
    B: 100 feet
    C: 188 to 200 feet
    D: 400 feet
  answer: C
  explanation: According to the Maine Driver's Manual, at 50 mph, the total stopping
    distance is approximately 188 to 200 feet, including reaction time and braking.
- id: 102
  category: defensive_driving
  question: In Maine, at what speed can hydroplaning (where tires lose contact with
    the road and ride on a thin film of water) begin?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Exactly 45 mph
    D: Only when using cruise control
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 50 mph.
- id: 103
  category: defensive_driving
  question: In Maine, when following another vehicle at night, you must switch to
    low beam headlights when you are within how many feet of that vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Maine law requires you to dim your high beams when following another
    vehicle within 300 feet.
- id: 104
  category: defensive_driving
  question: When driving in heavy fog, rain, or snow in Maine, which headlight setting
    should you use for the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights are required during the day
  answer: B
  explanation: Low beams should be used in fog, rain, or snow. High beams reflect
    off the moisture in the air, causing glare and making it harder to see.
- id: 105
  category: defensive_driving
  question: Maine is known for large wildlife. If a moose or deer suddenly jumps in
    front of your vehicle, what is the recommended defensive action?
  choices:
    A: Swerve sharply into the opposite lane
    B: Speed up to minimize the impact time
    C: Brake firmly and stay in your lane
    D: Close your eyes and let go of the steering wheel
  answer: C
  explanation: The safest reaction is to brake firmly and stay in your lane. Swerving
    can lead to a more serious head-on collision or a rollover.
- id: 106
  category: defensive_driving
  question: Under Maine law, what must a driver do regarding snow and ice on their
    vehicle before driving?
  choices:
    A: Only clear the driver's side of the windshield
    B: Clear only the windows; snow on the roof is fine
    C: Clear all snow and ice that might pose a danger to others or obstruct vision
    D: Nothing, as the wind will blow it off naturally
  answer: C
  explanation: Maine law (Title 29-A § 2396) requires drivers to ensure their vehicle
    is not a hazard. Driving with snow or ice that could fly off and strike another
    vehicle or obstruct your own view is illegal.
- id: 107
  category: defensive_driving
  question: When changing lanes in Maine, why is it important to check your 'blind
    spot' by looking over your shoulder?
  choices:
    A: To check for pedestrians on the sidewalk
    B: Because mirrors do not show vehicles in certain areas near the rear corners
      of your car
    C: To ensure your turn signal is working
    D: It is a legal requirement only for commercial drivers
  answer: B
  explanation: Mirrors have limits. Checking over your shoulder is the only way to
    ensure a vehicle isn't hiding in your blind spot before you move.
- id: 108
  category: alcohol_drugs_health
  question: In Maine, for a driver 21 years of age or older, what is the specific
    Blood Alcohol Content (BAC) level at or above which it is illegal to operate a
    motor vehicle?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In Maine, it is illegal for any person 21 years of age or older to
    operate a motor vehicle with a BAC of 0.08% or higher.
- id: 109
  category: alcohol_drugs_health
  question: What is the minimum court-ordered fine for a first-offense OUI (Operating
    Under the Influence) conviction in Maine?
  choices:
    A: $250
    B: $400
    C: $500
    D: $1,000
  answer: C
  explanation: A first-offense OUI conviction in Maine carries a minimum court-ordered
    fine of $500.
- id: 110
  category: alcohol_drugs_health
  question: Under Maine law, an OUI offense is considered 'aggravated' and carries
    a mandatory minimum of 48 hours in jail if the driver's BAC is at or above what
    level?
  choices:
    A: 0.08%
    B: 0.12%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: In Maine, a BAC of 0.15% or higher is an aggravating factor that results
    in a mandatory minimum of 48 hours in jail for a first offense.
- id: 111
  category: alcohol_drugs_health
  question: What does Maine's 'Implied Consent' law mean for every driver in the state?
  choices:
    A: You agree to have your vehicle searched at any time.
    B: You consent to a chemical test of your breath, blood, or urine if suspected
      of OUI.
    C: You agree to carry a minimum of $100,000 in property damage insurance.
    D: You consent to being recorded by traffic cameras at all intersections.
  answer: B
  explanation: Implied Consent means that by operating a vehicle in Maine, you have
    automatically consented to a chemical test of your breath, blood, or urine if
    a law enforcement officer has probable cause to believe you are impaired.
- id: 112
  category: alcohol_drugs_health
  question: Before a Maine driver's license can be reinstated following an OUI suspension,
    the individual must complete which program?
  choices:
    A: The Maine Driver Improvement Course
    B: The Driver Education and Evaluation Program (DEEP)
    C: The High-Risk Driver Seminar
    D: The Maine Safety Awareness Clinic
  answer: B
  explanation: Maine law requires all individuals suspended for OUI to complete the
    Driver Education and Evaluation Program (DEEP) before their license can be reinstated.
- id: 113
  category: alcohol_drugs_health
  question: How does Maine law treat driving under the influence of marijuana compared
    to alcohol?
  choices:
    A: Marijuana is legal, so it is not considered an OUI offense.
    B: It is only an offense if the driver is under 21.
    C: It is treated the same as alcohol impairment and is subject to OUI laws.
    D: It is considered a secondary offense and only carries a small fine.
  answer: C
  explanation: Operating a motor vehicle while impaired by any drug, including marijuana
    (recreational or medical), is treated the same as alcohol impairment under Maine's
    OUI laws.
- id: 114
  category: alcohol_drugs_health
  question: If a Maine driver is convicted of a second OUI offense within a 10-year
    period, what is the mandatory license suspension period?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: A second OUI conviction within a 10-year period in Maine results in
    a mandatory 3-year license suspension.
- id: 115
  category: alcohol_drugs_health
  question: In Maine, an OUI is automatically classified as 'aggravated' if the driver
    has a passenger in the vehicle who is under what age?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 12 years old
  answer: C
  explanation: Operating under the influence with a passenger under 21 years of age
    is an aggravating factor in Maine, leading to stiffer mandatory penalties.
- id: 116
  category: alcohol_drugs_health
  question: Can a Maine driver be charged with OUI if they are driving under the influence
    of a legally prescribed medication?
  choices:
    A: No, as long as they have a valid prescription.
    B: No, OUI only applies to illegal drugs and alcohol.
    C: Yes, if the medication impairs their ability to operate the vehicle safely.
    D: Yes, but only if they also have alcohol in their system.
  answer: C
  explanation: In Maine, you can be charged with OUI if any substance—legal, illegal,
    or prescribed—impairs your physical or mental faculties.
- id: 117
  category: alcohol_drugs_health
  question: When alcohol is consumed, which of the following is typically affected
    first?
  choices:
    A: Physical coordination
    B: Vision and hearing
    C: Judgment and self-control
    D: Reaction time
  answer: C
  explanation: Judgment and self-control are the first faculties to be impaired by
    alcohol, often before a driver realizes they are becoming intoxicated.
- id: 118
  category: alcohol_drugs_health
  question: What is the legal BAC limit for a person operating a commercial motor
    vehicle in Maine?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: In Maine, the legal BAC limit for commercial drivers (CDL holders)
    operating a commercial vehicle is 0.04%.
- id: 119
  category: alcohol_drugs_health
  question: If a Maine driver refuses to submit to a chemical test for a second time
    within a 10-year period, how long will their license be suspended?
  choices:
    A: 1 year
    B: 18 months
    C: 2 years
    D: 3 years
  answer: B
  explanation: A second refusal to submit to a chemical test within 10 years results
    in an 18-month license suspension in Maine.
- id: 120
  category: alcohol_drugs_health
  question: 'In Maine, an OUI offense that results in the death of another person
    is classified as a:'
  choices:
    A: Class D misdemeanor
    B: Class C felony
    C: Class B crime
    D: Class E misdemeanor
  answer: C
  explanation: An OUI resulting in death is a Class B crime in Maine, which can carry
    a prison term of up to 10 years and a fine of up to $20,000.
- id: 121
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in relation to driving in Maine?
  choices:
    A: The effect of alcohol wearing off over time.
    B: The combined effect of alcohol and other drugs being greater than the sum of
      their parts.
    C: The speed at which the liver processes alcohol.
    D: The psychological effect of peer pressure on drinking.
  answer: B
  explanation: The synergistic effect occurs when alcohol and other drugs (even over-the-counter
    ones) are taken together, causing much greater impairment than either substance
    would alone.
- id: 122
  category: alcohol_drugs_health
  question: Under Maine law, if a driver is convicted of a first-offense OUI with
    a BAC of 0.15% or more, what is the mandatory minimum jail sentence?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: One week
  answer: B
  explanation: Maine law mandates a minimum of 48 hours in jail for a first OUI conviction
    if there are aggravating factors, such as a BAC of 0.15% or more.
- id: 123
  category: alcohol_drugs_health
  question: If a Maine driver is convicted of OUI while carrying a passenger under
    21 years of age, what additional penalty is imposed by the court?
  choices:
    A: A mandatory 30-day jail sentence
    B: An additional 275-day suspension of their driver's license
    C: A permanent revocation of driving privileges
    D: A mandatory $2,000 fine
  answer: B
  explanation: In Maine, if you are convicted of OUI and had a passenger under 21
    in the vehicle, the court will suspend your license for an additional 275 days
    beyond the standard suspension.
- id: 124
  category: alcohol_drugs_health
  question: Regarding marijuana use and driving in Maine, which of the following is
    true?
  choices:
    A: It is legal to drive under the influence of marijuana because it is legal for
      recreational use.
    B: OUI laws apply to marijuana and other drugs just as they do to alcohol.
    C: A driver can only be charged with OUI if they are also using alcohol.
    D: Marijuana does not impair driving ability according to Maine law.
  answer: B
  explanation: In Maine, Operating Under the Influence (OUI) applies to any intoxicant,
    including marijuana, prescription drugs, and over-the-counter medications, regardless
    of their legal status.
- id: 125
  category: alcohol_drugs_health
  question: For a first-time OUI conviction in Maine (driver age 21+), what is the
    standard court-ordered license suspension period?
  choices:
    A: 30 days
    B: 90 days
    C: 150 days
    D: One year
  answer: C
  explanation: A first-offense OUI conviction for a driver 21 or older in Maine typically
    results in a court-ordered license suspension of 150 days.
- id: 126
  category: alcohol_drugs_health
  question: 'Under Maine''s Implied Consent law, by operating a motor vehicle, you
    have automatically given consent to:'
  choices:
    A: A search of your vehicle's trunk
    B: A chemical test of your breath, blood, or urine
    C: A search of your home
    D: Allowing a police officer to drive your car
  answer: B
  explanation: Implied Consent means that by holding a Maine driver's license or operating
    a vehicle in Maine, you agree to submit to chemical testing if a law enforcement
    officer has probable cause to believe you are impaired.
- id: 127
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with other drugs, such as cold medicines
    or prescriptions, while driving?
  choices:
    A: The effects of the alcohol are canceled out.
    B: There is no change in impairment.
    C: It can multiply the effects of the alcohol and increase impairment.
    D: It makes the driver more alert.
  answer: C
  explanation: Combining alcohol with other drugs can create a synergistic effect,
    meaning the combined impairment is much greater than the effect of either substance
    alone.
- id: 128
  category: alcohol_drugs_health
  question: Which of the following is the only way to 'sober up' or lower your BAC
    before driving?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time for your body to process the alcohol
  answer: D
  explanation: Time is the only factor that will reduce a person's BAC. Coffee, showers,
    and exercise do not speed up the elimination of alcohol from the bloodstream.
- id: 129
  category: alcohol_drugs_health
  question: If a Maine driver under age 21 is found to have any 'measurable amount'
    of alcohol in their system, what is the mandatory administrative license suspension
    period for a first offense?
  choices:
    A: 90 days
    B: 180 days
    C: One year
    D: Two years
  answer: C
  explanation: Maine has a zero-tolerance policy for drivers under 21. Any measurable
    amount of alcohol will result in a one-year administrative license suspension.
- id: 130
  category: alcohol_drugs_health
  question: If you are taking prescription medication and are unsure if it will affect
    your driving, what should you do?
  choices:
    A: Drive only on familiar roads
    B: Ask your doctor or pharmacist about the side effects
    C: Drink coffee to stay awake while driving
    D: Wait 30 minutes after taking the pill before driving
  answer: B
  explanation: It is the driver's responsibility to know how medications affect them.
    You should always consult a medical professional or read the warning labels before
    operating a vehicle.
- id: 131
  category: alcohol_drugs_health
  question: If a Maine law enforcement officer asks you to take a blood, breath, or
    urine test and you refuse, what can happen in court?
  choices:
    A: The refusal cannot be mentioned in court.
    B: The refusal can be used as evidence against you in a trial.
    C: The court will automatically dismiss the OUI charge.
    D: You will only be fined $50.
  answer: B
  explanation: Under Maine law, if you refuse a chemical test, that refusal is admissible
    as evidence in court and will likely result in a longer administrative license
    suspension than if you had failed the test.
- id: 132
  category: penalties_and_points
  question: In Maine, how many demerit points are assigned to your driving record
    for speeding 15 to 29 miles per hour over the posted speed limit?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: According to the Maine Bureau of Motor Vehicles (BMV), speeding 15-29
    mph over the limit results in 6 demerit points being added to your license.
- id: 133
  category: penalties_and_points
  question: If a Maine driver is convicted of a first-offense OUI (Operating Under
    the Influence) while being 21 years of age or older, for how long will their license
    be suspended?
  choices:
    A: 30 days
    B: 90 days
    C: 150 days
    D: 1 year
  answer: C
  explanation: A first-offense OUI conviction for a driver 21 or older in Maine results
    in a court-ordered license suspension of 150 days.
- id: 134
  category: penalties_and_points
  question: In Maine, how many demerit points are assessed for 'Following too Closely'
    (tailgating)?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: The Maine BMV assigns 4 demerit points to a driver's record for the
    violation of following too closely.
- id: 135
  category: penalties_and_points
  question: How many demerit points are added to a Maine driving record for failing
    to stop for a school bus with its red lights flashing?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: Automatic revocation
  answer: C
  explanation: Failure to stop for a school bus is a serious violation in Maine and
    carries a penalty of 6 demerit points.
- id: 136
  category: penalties_and_points
  question: In Maine, how many demerit points can be removed from a driver's record
    for successfully completing an approved driver improvement course?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Drivers in Maine may earn a 3-point reduction on their driving record
    by completing a state-approved driver improvement course, though this can only
    be done once every 12 months.
- id: 137
  category: penalties_and_points
  question: What is the minimum fine in Maine for a first-offense violation of failing
    to stop for a school bus with its red lights flashing?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Maine law mandates a minimum fine of $250 for the first offense of
    passing a stopped school bus with its red lights flashing.
- id: 138
  category: penalties_and_points
  question: If a driver on a Maine provisional license is convicted of a moving violation
    for the first time, how long will their license be suspended?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: For a person holding a provisional license, the first conviction for
    a moving violation results in a 30-day license suspension.
- id: 139
  category: penalties_and_points
  question: How many demerit points are assigned for 'Failure to Yield to an Emergency
    Vehicle' in Maine?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failure to yield to an emergency vehicle is a 6-point violation in
    the state of Maine.
- id: 140
  category: penalties_and_points
  question: In Maine, what is the fine for a first-offense seat belt violation for
    an adult driver?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: The fine for a first-time seat belt violation in Maine is $50.
- id: 141
  category: penalties_and_points
  question: How many demerit points are assessed for 'Illegal Passing' in Maine?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: The Maine BMV assigns 4 demerit points for illegal passing violations.
- id: 142
  category: penalties_and_points
  question: In Maine, if you are convicted of speeding 30 miles per hour or more over
    the limit, it is considered a criminal offense. What is the typical administrative
    license suspension for this violation?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Speeding 30 mph or more over the limit in Maine is a Class E crime
    and usually carries a 30-day license suspension.
- id: 143
  category: penalties_and_points
  question: How many demerit points are assigned for 'Operating a Motor Vehicle without
    a License' (if the license is expired or the driver is not licensed)?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: A
  explanation: Operating a motor vehicle without a license results in 2 demerit points
    on a Maine driving record.
- id: 144
  category: penalties_and_points
  question: A Maine driver who receives a total of 6 demerit points within a 12-month
    period will receive which of the following?
  choices:
    A: A mandatory license suspension
    B: A warning letter from the Secretary of State
    C: A requirement to retake the road test
    D: A $500 fine
  answer: B
  explanation: In Maine, when a driver accumulates 6 demerit points within a 12-month
    period, the BMV sends a warning letter to the driver.
- id: 145
  category: penalties_and_points
  question: In Maine, what is the administrative license suspension period for a first-offense
    OUI (Operating Under the Influence) conviction?
  choices:
    A: 30 days
    B: 90 days
    C: 150 days
    D: 1 year
  answer: C
  explanation: For a first-offense OUI in Maine, the administrative license suspension
    period is 150 days.
- id: 146
  category: penalties_and_points
  question: Under Maine's point system, how many points are assessed for 'Failure
    to yield to an emergency vehicle'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failure to yield to an emergency vehicle is a serious violation in
    Maine and carries 6 demerit points.
- id: 147
  category: penalties_and_points
  question: What is the minimum fine for a first-time conviction of violating Maine's
    hands-free driving law (texting or using a handheld device while driving)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: The minimum fine for a first offense of Maine's distracted driving/hands-free
    law is $250.
- id: 148
  category: penalties_and_points
  question: In Maine, how many demerit points are assessed for 'Failure to stop for
    a Red Light'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Failure to stop for a red light or a stop sign results in 4 demerit
    points on a Maine driving record.
- id: 149
  category: penalties_and_points
  question: For a first-time OUI offense in Maine, if the driver had a passenger under
    21 years of age in the vehicle, an additional suspension period of how many days
    is added?
  choices:
    A: 90 days
    B: 180 days
    C: 275 days
    D: 365 days
  answer: C
  explanation: Maine law imposes an additional 275-day suspension if a person is convicted
    of OUI while carrying a passenger under the age of 21.
- id: 150
  category: penalties_and_points
  question: What is the mandatory minimum jail time for a first-offense OUI in Maine
    if the driver's BAC was 0.15% or higher?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 1 week
  answer: B
  explanation: In Maine, a first-offense OUI carries a mandatory minimum of 48 hours
    in jail if the BAC is 0.15% or more, or if the driver was speeding 30+ mph over
    the limit or eluding an officer.
- id: 151
  category: penalties_and_points
  question: In Maine, how many demerit points are assessed for 'Operating a motor
    vehicle with an expired license' (less than 90 days expired)?
  choices:
    A: 0 points
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Operating with an expired license (up to 90 days) results in 2 demerit
    points in Maine.
- id: 152
  category: penalties_and_points
  question: In Maine, a driver's license will be suspended for 15 days if they are
    convicted of how many speeding violations within a 12-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: According to Maine BMV rules, three speeding convictions within a 12-month
    period will result in a 15-day license suspension.
- id: 153
  category: sharing_the_road
  question: When a school bus is stopped on a public way in Maine with its red lights
    flashing and stop arm extended, how far away must you stop your vehicle?
  choices:
    A: At least 10 feet
    B: At least 20 feet
    C: At least 30 feet
    D: At least 50 feet
  answer: C
  explanation: In Maine, you must stop at least 30 feet from a school bus that is
    stopped with its red lights flashing and stop arm extended, whether you are approaching
    from the front or the rear.
- id: 154
  category: sharing_the_road
  question: What is the minimum fine for a first-time violation of Maine's 'Move Over'
    law?
  choices:
    A: Wait for a warning
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: In Maine, the minimum fine for a first-time violation of the 'Move
    Over' law is $250.
- id: 155
  category: sharing_the_road
  question: Under Maine law, which of the following motorcycle operators are REQUIRED
    to wear a protective helmet?
  choices:
    A: Only those under 18 years of age
    B: Only those operating with a learner's permit
    C: Operators in their first year of licensure, those under 18, and permit holders
    D: All motorcycle operators regardless of age or experience
  answer: C
  explanation: Maine law requires helmets for motorcycle operators and passengers
    under 18, anyone operating on a learner's permit, and anyone within one year of
    completing their motorcycle road test.
- id: 156
  category: sharing_the_road
  question: 'When a pedestrian is crossing a street guided by a service animal or
    carrying a white cane (with or without a red tip), Maine law requires you to:'
  choices:
    A: Honk your horn to let them know you are there
    B: Yield the right-of-way and stop your vehicle
    C: Drive around them slowly
    D: Only stop if there is a marked crosswalk
  answer: B
  explanation: Maine law states that drivers must yield the right-of-way and come
    to a complete stop for any blind or visually impaired pedestrian guided by a service
    animal or carrying a white cane.
- id: 157
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' Where are these zones located?
  choices:
    A: Only directly behind the truck
    B: Only on the left side of the truck
    C: Directly in front, directly behind, and on both sides of the truck
    D: Only in the driver's mirrors
  answer: C
  explanation: No-Zones are the large blind spots around a truck where the driver
    cannot see you. These are located in the front, rear, and on both sides of the
    vehicle.
- id: 158
  category: sharing_the_road
  question: In Maine, is 'lane splitting' (a motorcycle driving between two lanes
    of stopped or moving traffic) legal?
  choices:
    A: Yes, if the traffic is moving slower than 10 mph
    B: Yes, it is encouraged to reduce congestion
    C: No, it is illegal in Maine
    D: Only for emergency responders
  answer: C
  explanation: Lane splitting is illegal in Maine. Motorcycles are entitled to the
    full use of a lane, and they must follow the same rules of the road as other vehicles
    regarding lane usage.
- id: 159
  category: sharing_the_road
  question: 'When following a large truck at night, you should always:'
  choices:
    A: Keep your high beams on so the truck driver can see you
    B: Dim your headlights to avoid blinding the truck driver via their large side
      mirrors
    C: Follow as closely as possible to stay in their wind draft
    D: Flash your lights repeatedly before passing
  answer: B
  explanation: Large side mirrors on trucks can reflect bright light into the driver's
    eyes. You should dim your headlights when following any vehicle, especially large
    trucks.
- id: 160
  category: sharing_the_road
  question: 'In Maine, a slow-moving vehicle emblem (an orange triangle with a red
    border) is required on vehicles designed to travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The slow-moving vehicle emblem is required on all vehicles designed
    to travel at speeds of 25 mph or less, such as farm machinery or construction
    equipment.
- id: 161
  category: sharing_the_road
  question: 'If you are driving on a Maine road with a physical median or barrier
    separating traffic, and a school bus is stopped with red lights flashing on the
    OPPOSITE side of the barrier, you must:'
  choices:
    A: Stop at least 30 feet away
    B: Stop and wait for the driver to signal you
    C: Slow down to 15 mph
    D: Proceed with caution; you are not required to stop
  answer: D
  explanation: In Maine, if you are on a divided highway where the roadways are separated
    by a physical barrier (like a median), you do not need to stop for a school bus
    on the other side of the barrier.
- id: 162
  category: sharing_the_road
  question: 'When a bicyclist is making a left turn at an intersection in Maine, they
    are permitted to:'
  choices:
    A: Only turn from the sidewalk
    B: Use the left-turn lane just like a motor vehicle
    C: Only cross as a pedestrian in the crosswalk
    D: Turn from the far right shoulder only
  answer: B
  explanation: Bicyclists have the same rights and responsibilities as motorists.
    They are permitted to move into the left-turn lane to execute a turn.
- id: 163
  category: sharing_the_road
  question: Under Maine law, what is the minimum distance a motorist must maintain
    when passing a bicyclist or pedestrian?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Maine law (Title 29-A, §2060) requires motorists to leave at least
    3 feet of distance when passing a bicyclist or a pedestrian.
- id: 164
  category: sharing_the_road
  question: In Maine, how many feet must you remain behind a fire truck or other fire
    apparatus that is responding to an alarm?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Maine law (Title 29-A, §2054) prohibits following within 500 feet of
    any fire apparatus responding to an alarm.
- id: 165
  category: sharing_the_road
  question: When approaching a pedestrian carrying a white cane or using a guide dog
    in Maine, what action must a driver take?
  choices:
    A: Honk to let them know you are there
    B: Slow down and proceed with caution
    C: Come to a full stop
    D: Maintain speed but stay in the far lane
  answer: C
  explanation: Maine law requires drivers to come to a full stop when a pedestrian
    with a white cane or guide dog is crossing or attempting to cross the road.
- id: 166
  category: sharing_the_road
  question: When following a motorcycle in Maine, what is the recommended following
    distance under ideal conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 10 seconds
  answer: C
  explanation: The Maine Driver's Manual recommends a following distance of at least
    4 seconds when behind a motorcycle to allow for their ability to stop quickly
    and handle road hazards.
- id: 167
  category: sharing_the_road
  question: If you are driving on a road with a median strip or physical barrier,
    do you have to stop for a school bus on the opposite side of the barrier?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, you do not need to stop if there is a physical barrier
    C: Yes, but only if the bus driver signals you
    D: No, but you must slow down to 15 mph
  answer: B
  explanation: In Maine, drivers traveling in the opposite direction on a divided
    highway with a physical median or barrier are not required to stop for a school
    bus.
- id: 168
  category: sharing_the_road
  question: 'When passing a horse-drawn vehicle or a person riding a horse in Maine,
    you should:'
  choices:
    A: Honk your horn to warn the rider
    B: Rev your engine to pass quickly
    C: Slow down and avoid making loud noises
    D: Turn on your high beams
  answer: C
  explanation: Maine law requires drivers to exercise reasonable care, slow down,
    and avoid any actions that might frighten the animal, such as honking or revving
    the engine.
- id: 169
  category: sharing_the_road
  question: What is the 'No-Zone' in relation to large trucks and buses?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the front, back, and sides of the vehicle
    C: The speed-restricted zone for commercial vehicles
    D: The weight limit for bridges
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck or bus
    where the driver cannot see other vehicles. If you cannot see the truck driver's
    face in their side mirror, they cannot see you.
- id: 170
  category: sharing_the_road
  question: 'In Maine, if there are no sidewalks, pedestrians are legally required
    to walk:'
  choices:
    A: On the right side, with the flow of traffic
    B: On the left side, facing oncoming traffic
    C: In the center of the road
    D: On whichever side has more shade
  answer: B
  explanation: Maine law requires pedestrians to walk on the left side of the road
    facing traffic when sidewalks are not available, so they can see approaching vehicles.
- id: 171
  category: sharing_the_road
  question: When a bicyclist is operating on a Maine roadway at night, they are required
    to have a front light visible from at least how many feet?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Maine law (Title 29-A, §2063) requires bicycles to be equipped with
    a front light visible from a distance of at least 500 feet when used at night.
- id: 172
  category: sharing_the_road
  question: Large trucks often need to do what when making a right turn at an intersection?
  choices:
    A: Speed up to clear the intersection
    B: Swing wide to the left before turning right
    C: Turn from the left-most lane
    D: Stop and wait for all traffic to clear
  answer: B
  explanation: Because of their length, large trucks must often swing wide to the
    left to complete a right turn without the rear wheels hitting the curb.
- id: 173
  category: sharing_the_road
  question: In Maine, how many demerit points are assessed for the offense of failing
    to yield to an emergency vehicle?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Under Maine's point system, failing to yield to an emergency vehicle
    is a serious violation worth 6 demerit points.
- id: 174
  category: sharing_the_road
  question: 'A slow-moving vehicle emblem is a triangular orange sign that must be
    displayed on the rear of vehicles traveling at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The slow-moving vehicle emblem (orange triangle with a red border)
    is required on vehicles designed to travel at speeds of 25 mph or less.
- id: 175
  category: vehicle_information
  question: In Maine, how often must a motor vehicle undergo a safety inspection at
    an official inspection station?
  choices:
    A: Every six months
    B: Once every year
    C: Every two years
    D: Only when the vehicle is sold
  answer: B
  explanation: According to Maine law, motor vehicles must be inspected once a year
    to ensure they meet safety and emissions standards.
- id: 176
  category: vehicle_information
  question: According to the Maine Driver's Manual, what is the minimum legal tread
    depth for tires?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Maine law requires that tires have at least 2/32 of an inch of tread
    depth, measured in two major adjacent tread grooves.
- id: 177
  category: vehicle_information
  question: Maine law requires that a vehicle's foot brake must be capable of stopping
    the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: The Maine motor vehicle inspection standards require the service brake
    (foot brake) to be able to stop the vehicle within 30 feet at a speed of 20 mph.
- id: 178
  category: vehicle_information
  question: Under Maine law, what is the minimum percentage of light transmission
    required for window tinting on the front side windows?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: Maine law specifies that window tinting on the front side windows (to
    the left and right of the driver) must allow at least 35% of light to pass through.
- id: 179
  category: vehicle_information
  question: 'Maine law requires that the rear registration plate must be illuminated
    so that it is visible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The rear license plate must be illuminated by a white light so that
    the characters are clearly visible from a distance of at least 50 feet.
- id: 180
  category: vehicle_information
  question: 'Every motor vehicle in Maine must be equipped with a mirror that allows
    the driver to see the highway to the rear for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Maine law requires at least one rearview mirror that provides a clear
    view of the highway to the rear for at least 200 feet.
- id: 181
  category: vehicle_information
  question: 'A motor vehicle''s horn in Maine must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Maine safety standards require a horn that can be heard from a distance
    of no less than 200 feet.
- id: 182
  category: vehicle_information
  question: Which of the following is illegal regarding a vehicle's exhaust system
    in Maine?
  choices:
    A: Using a standard muffler
    B: Having an exhaust pipe that extends to the rear bumper
    C: Equipping the exhaust with a 'bypass' or 'cutout' device
    D: Using a stainless steel exhaust tip
  answer: C
  explanation: Maine law prohibits the use of a muffler cutout, bypass, or similar
    device that prevents the muffler from operating to reduce noise.
- id: 183
  category: vehicle_information
  question: 'In Maine, children must be secured in a federally approved child restraint
    system until they are at least:'
  choices:
    A: 40 pounds
    B: 6 years old
    C: 8 years old or 80 pounds and 57 inches tall
    D: 12 years old
  answer: C
  explanation: Maine law requires children to be in a child restraint system until
    they weigh 80 pounds, are 8 years old, or are 57 inches tall.
- id: 184
  category: vehicle_information
  question: 'A vehicle''s turn signals must be visible to other drivers from a distance
    of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Under Maine inspection standards, turn signals must be visible from
    a distance of at least 100 feet in normal sunlight.
- id: 185
  category: vehicle_information
  question: In Maine, the center of a vehicle's headlights must be mounted at a height
    of no more than how many inches from the ground?
  choices:
    A: 36 inches
    B: 48 inches
    C: 54 inches
    D: 60 inches
  answer: C
  explanation: Maine law specifies that headlights must be mounted between 22 and
    54 inches from the ground, measured to the center of the lens.
- id: 186
  category: vehicle_information
  question: Besides nighttime and wiper use, Maine law requires headlights to be turned
    on when you cannot see at least how many feet ahead?
  choices:
    A: 500 feet
    B: 800 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Maine driving rules require headlights to be used whenever you cannot
    see 1,000 feet ahead due to fog, rain, snow, or other conditions.
- id: 187
  category: vehicle_information
  question: 'In Maine, you must switch your high beams to low beams when following
    another vehicle within a distance of:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: None; high beams are always allowed when following
  answer: A
  explanation: According to the Maine Driver's Manual, you must switch to low beams
    when you are following another vehicle within 100 feet.
- id: 188
  category: vehicle_information
  question: According to Maine law, during which period is it prohibited to operate
    a vehicle equipped with tires having metal studs?
  choices:
    A: Between May 1st and October 1st
    B: Between April 1st and November 1st
    C: Between June 1st and September 1st
    D: Between March 1st and December 1st
  answer: A
  explanation: Maine law (Title 29-A, §1919) prohibits the use of studded tires between
    May 1st and October 1st.
- id: 189
  category: vehicle_information
  question: 'In Maine, your vehicle''s high beam headlights must be capable of revealing
    persons and vehicles at a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 350 feet
    D: 500 feet
  answer: C
  explanation: Maine vehicle equipment laws require high beams to be powerful enough
    to reveal objects at least 350 feet ahead.
- id: 190
  category: signs_and_signals
  question: When you encounter a flashing red traffic light in Maine, how should you
    proceed?
  choices:
    A: Slow down and proceed with caution without stopping.
    B: Stop only if there is cross traffic.
    C: Treat it like a stop sign; come to a complete stop and yield the right-of-way.
    D: Stop and wait for the light to turn green.
  answer: C
  explanation: A flashing red light means the same as a stop sign. You must come to
    a complete stop, yield to cross traffic or pedestrians, and proceed when it is
    safe.
- id: 191
  category: signs_and_signals
  question: In Maine, what does a pennant-shaped yellow sign located on the left side
    of the road indicate?
  choices:
    A: School Zone
    B: Yield Ahead
    C: No Passing Zone
    D: Railroad Crossing
  answer: C
  explanation: A pennant-shaped sign is used specifically to mark the beginning of
    a 'No Passing Zone.' It is placed on the left side of the road so it is visible
    to drivers attempting to pass.
- id: 192
  category: signs_and_signals
  question: If you are using hand signals because your turn signals are not working,
    which signal indicates a right turn?
  choices:
    A: Left arm extended straight out the window.
    B: Left arm extended upward at a 90-degree angle.
    C: Left arm extended downward at a 90-degree angle.
    D: Right arm extended straight out the window.
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at a 90-degree angle.
- id: 193
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the roadway mean?
  choices:
    A: Passing is allowed from either side.
    B: Passing is allowed only on the right.
    C: Passing is prohibited in both directions.
    D: The road is a one-way street.
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    vehicles traveling in either direction.
- id: 194
  category: signs_and_signals
  question: A diamond-shaped sign with a yellow background is what type of sign?
  choices:
    A: Regulatory sign
    B: Guide sign
    C: Warning sign
    D: Service sign
  answer: C
  explanation: Diamond-shaped yellow signs are warning signs that alert drivers to
    potential hazards or changes in road conditions ahead.
- id: 195
  category: signs_and_signals
  question: What is the meaning of a solid white line painted on the right edge of
    the highway?
  choices:
    A: It marks the edge of the travel lane (fog line).
    B: It indicates a lane where passing is allowed.
    C: It marks the center of a two-way road.
    D: It indicates a pedestrian crosswalk.
  answer: A
  explanation: A solid white line on the right side of the road is called a fog line
    or edge line. it helps drivers stay in their lane during poor visibility.
- id: 196
  category: signs_and_signals
  question: In Maine, are you allowed to turn right on a red light?
  choices:
    A: No, you must wait for a green light.
    B: Yes, but only if there is no cross traffic.
    C: Yes, after coming to a complete stop and yielding to traffic and pedestrians,
      unless a sign prohibits it.
    D: Yes, but only between the hours of 9 PM and 6 AM.
  answer: C
  explanation: Maine law allows a right turn on red after a complete stop and yielding
    to others, provided there is no sign specifically stating 'No Turn on Red'.
- id: 197
  category: signs_and_signals
  question: What does a steady yellow traffic light mean?
  choices:
    A: Speed up to clear the intersection before it turns red.
    B: The light is about to turn red; you should stop if it is safe to do so.
    C: Stop immediately, even if you are in the middle of the intersection.
    D: The light is about to turn green.
  answer: B
  explanation: A steady yellow light indicates the signal is changing to red. Drivers
    should stop if they can do so safely; otherwise, they should clear the intersection
    cautiously.
- id: 198
  category: signs_and_signals
  question: Which hand signal is correct for slowing down or stopping?
  choices:
    A: Left arm out and pointed toward the ground with palm open.
    B: Left arm out and pointed toward the sky.
    C: Left arm straight out.
    D: Right arm waving in a circular motion.
  answer: A
  explanation: To signal that you are slowing down or stopping, extend your left arm
    out the window and point it downward with your palm facing the rear.
- id: 199
  category: signs_and_signals
  question: What color are signs used to provide information about state parks and
    recreational areas in Maine?
  choices:
    A: Blue
    B: Green
    C: Brown
    D: Orange
  answer: C
  explanation: In Maine and across the US, brown signs are used to provide guidance
    to public recreation areas and scenic points of interest.
- id: 200
  category: signs_and_signals
  question: When a traffic signal shows a steady red light and a steady green arrow,
    what are you permitted to do?
  choices:
    A: Stop and wait for the red light to turn green before moving.
    B: Proceed with caution in the direction of the arrow, yielding to pedestrians.
    C: Proceed in any direction as long as it is safe.
    D: The light is broken; treat it as a four-way stop.
  answer: B
  explanation: A green arrow means you have a 'protected' turn. You may proceed in
    the direction of the arrow even if the main signal is red, but you must still
    yield to pedestrians in the crosswalk.
- id: 201
  category: signs_and_signals
  question: According to the Maine Driver's Manual, what is the correct hand signal
    to indicate that you are slowing down or stopping?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward
    C: Left arm extended downward, with palm facing the rear
    D: Right arm extended out the passenger window
  answer: C
  explanation: In Maine, the hand signal for slowing or stopping is the left arm extended
    downward with the palm facing toward the rear.
- id: 202
  category: signs_and_signals
  question: What does a flashing red traffic light mean in the state of Maine?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to turn solid red
    C: Stop, and yield the right-of-way as you would at a stop sign
    D: The traffic signal is broken; ignore it
  answer: C
  explanation: A flashing red light in Maine has the same meaning as a stop sign.
    You must come to a complete stop and yield to cross traffic before proceeding.
- id: 203
  category: signs_and_signals
  question: 'A pennant-shaped sign (an isosceles triangle pointing right) found on
    the left side of the road indicates:'
  choices:
    A: A school zone
    B: A no-passing zone
    C: A yield requirement
    D: A railroad crossing
  answer: B
  explanation: A pennant-shaped sign is placed on the left side of the highway to
    mark the beginning of a no-passing zone.
- id: 204
  category: signs_and_signals
  question: What is the correct hand signal for a right turn in Maine?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm waved in a circular motion
  answer: B
  explanation: To signal a right turn using hand signals in Maine, you should extend
    your left arm out the window and bend it upward at the elbow.
- id: 205
  category: signs_and_signals
  question: 'A five-sided (pentagon) sign indicates that you are entering a:'
  choices:
    A: Construction zone
    B: Hospital zone
    C: School zone or school crossing
    D: Public park
  answer: C
  explanation: A pentagon-shaped sign is used exclusively to warn drivers of a school
    zone or a school crossing ahead.
- id: 206
  category: signs_and_signals
  question: In Maine, what does a steady yellow X signal above a travel lane mean?
  choices:
    A: The lane is for emergency vehicles only
    B: You should prepare to vacate the lane because the signal is about to change
      to a red X
    C: The lane is open to all traffic
    D: You must speed up to clear the lane
  answer: B
  explanation: A steady yellow X over a lane indicates that the lane control signal
    is about to change to a red X, and you should safely move out of that lane.
- id: 207
  category: signs_and_signals
  question: What does a round yellow sign with a black 'X' and the letters 'RR' indicate?
  choices:
    A: A rural road intersection
    B: A rest area ahead
    C: A railroad crossing advance warning
    D: A rough road surface
  answer: C
  explanation: The round yellow sign with a black 'X' and 'RR' is a railroad crossing
    advance warning sign, telling you to look, listen, and slow down.
- id: 208
  category: signs_and_signals
  question: 'When you see a ''Slow Moving Vehicle'' emblem (a reflective orange triangle
    with a red border) on the rear of a vehicle, it means the vehicle is traveling
    at:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The slow-moving vehicle emblem is required on vehicles designed to
    travel at speeds of 25 mph or less, such as farm machinery or horse-drawn carriages.
- id: 209
  category: signs_and_signals
  question: 'In Maine, unless a sign prohibits it, you may turn right on a red light
    after:'
  choices:
    A: Slowing down to 5 mph
    B: Coming to a complete stop and yielding to pedestrians and cross traffic
    C: Waiting for at least 5 seconds
    D: Honking your horn to alert others
  answer: B
  explanation: Maine law allows a right turn on red after a complete stop, provided
    there is no sign prohibiting it and the way is clear of pedestrians and other
    traffic.
- id: 210
  category: signs_and_signals
  question: 'Diamond-shaped signs with orange backgrounds are used to alert drivers
    to:'
  choices:
    A: Service facilities like gas and food
    B: Recreational areas
    C: Construction and maintenance work zones
    D: State borders
  answer: C
  explanation: Orange diamond-shaped signs are used specifically for construction,
    maintenance, or other temporary traffic control zones.
- id: 211
  category: signs_and_signals
  question: 'When approaching an intersection with a flashing yellow light, Maine
    law requires you to:'
  choices:
    A: Stop completely before proceeding
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: Yield to all traffic, even if they have a red light
  answer: C
  explanation: A flashing yellow light means you should slow down and be extra alert
    as you proceed through the intersection.
- id: 212
  category: signs_and_signals
  question: 'A sign featuring a red circle with a white horizontal bar across the
    middle means:'
  choices:
    A: No Left Turn
    B: Do Not Enter
    C: Yield Right of Way
    D: One Way Street
  answer: B
  explanation: The 'Do Not Enter' sign is a square with a red circle and a white horizontal
    stripe, indicating you cannot enter the road from that direction.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 213
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 214
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 215
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 216
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 217
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 218
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 219
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 220
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 221
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 222
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 223
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 224
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 225
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 226
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 227
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 228
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 229
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 230
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 231
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 232
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 233
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 234
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 235
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 236
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 237
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 238
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 239
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
