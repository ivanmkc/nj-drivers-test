metadata:
  source: 2025 Massachusetts Driver's Manual
  total_questions: 240
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Massachusetts, what is the minimum age a person must reach before they
    are eligible to apply for a learner's permit?
  choices:
    A: 15 years old
    B: 15 and a half years old
    C: 16 years old
    D: 16 and a half years old
  answer: C
  explanation: According to the Massachusetts RMV, an individual must be at least
    16 years old to apply for a Class D learner's permit.
- id: 2
  category: license_system
  question: Under the Massachusetts Junior Operator License (JOL) law, for how long
    is a new driver restricted from carrying passengers under the age of 18 (who are
    not immediate family)?
  choices:
    A: The first 3 months
    B: The first 6 months
    C: The first year
    D: Until they turn 18
  answer: B
  explanation: The JOL passenger restriction prevents a junior operator from carrying
    passengers under 18 (except immediate family) for the first 6 months of holding
    the license, unless accompanied by a licensed driver at least 21 years old with
    one year of experience.
- id: 3
  category: license_system
  question: What are the restricted driving hours for a Junior Operator in Massachusetts?
  choices:
    A: 11:00 PM to 4:00 AM
    B: 12:00 AM to 6:00 AM
    C: 12:30 AM to 5:00 AM
    D: 1:00 AM to 5:00 AM
  answer: C
  explanation: A Junior Operator may not operate a motor vehicle between 12:30 AM
    and 5:00 AM unless accompanied by a parent or legal guardian.
- id: 4
  category: license_system
  question: If a Junior Operator is convicted of speeding for the first time, what
    is the mandatory license suspension period in Massachusetts?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: For a first speeding offense, a Junior Operator faces a 90-day license
    suspension, a $500 reinstatement fee, and must complete a SCARR (State Courts
    Against Road Rage) course and Attitudinal Retraining.
- id: 5
  category: license_system
  question: A learner's permit holder in Massachusetts must be accompanied by a licensed
    driver who is at least ____ years old and has at least ____ year(s) of driving
    experience.
  choices:
    A: 18; 1
    B: 21; 1
    C: 21; 2
    D: 25; 5
  answer: B
  explanation: The supervising driver for a permit holder must be at least 21 years
    old, have at least one year of driving experience, and be seated in the passenger
    seat next to the driver.
- id: 6
  category: license_system
  question: In Massachusetts, if you change your name or address, you must notify
    the RMV within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Massachusetts law requires you to notify the RMV of any change of address
    or name within 30 days of the change.
- id: 7
  category: license_system
  question: What is the Blood Alcohol Content (BAC) limit for a driver under the age
    of 21 in Massachusetts?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Massachusetts has a 'Zero Tolerance' policy for drivers under 21; a
    BAC of 0.02% or higher will result in administrative penalties and license suspension.
- id: 8
  category: license_system
  question: What is the penalty for a first-offense conviction of drag racing for
    a Junior Operator?
  choices:
    A: 90-day suspension
    B: 180-day suspension
    C: 1-year suspension
    D: 3-year suspension
  answer: C
  explanation: A first-offense drag racing conviction for a Junior Operator results
    in a 1-year license suspension and a $500 reinstatement fee.
- id: 9
  category: license_system
  question: To obtain a Junior Operator License, an applicant must complete how many
    hours of supervised driving with a parent or guardian (in addition to professional
    lessons)?
  choices:
    A: 20 hours
    B: 30 hours
    C: 40 hours
    D: 50 hours
  answer: C
  explanation: Applicants for a JOL must complete 40 hours of supervised driving documented
    by a parent or guardian (30 hours if the applicant completes a driver skills development
    program).
- id: 10
  category: license_system
  question: Under Massachusetts law, which of the following is true regarding mobile
    electronic device use for drivers under 18?
  choices:
    A: They may use hands-free devices only.
    B: They may use devices only for GPS navigation.
    C: They are strictly prohibited from using any mobile electronic device, even
      in hands-free mode.
    D: They may use devices only when stopped at a red light.
  answer: C
  explanation: Operators under 18 are prohibited from using any mobile electronic
    device while driving, including hands-free technology, except in the case of an
    emergency.
- id: 11
  category: license_system
  question: What is the license suspension period for a first-time violation of the
    mobile electronic device law for a Junior Operator?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: A first offense for using a mobile electronic device while driving
    as a Junior Operator results in a 60-day suspension, a $100 fine, and a required
    attitudinal retraining course.
- id: 12
  category: license_system
  question: In Massachusetts, a Class D license allows you to operate which of the
    following?
  choices:
    A: Any vehicle over 26,001 lbs
    B: Passenger vehicles, vans, and small trucks
    C: Motorcycles only
    D: Commercial buses
  answer: B
  explanation: A Class D license is the standard passenger vehicle license used for
    cars, SUVs, and small trucks.
- id: 13
  category: license_system
  question: If a Junior Operator violates the passenger restriction for the first
    time, how long will their license be suspended?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: A first violation of the JOL passenger restriction results in a 60-day
    license suspension.
- id: 14
  category: license_system
  question: Which of the following is NOT a requirement to apply for a REAL ID in
    Massachusetts?
  choices:
    A: Social Security Number
    B: Proof of Massachusetts residency
    C: Proof of lawful presence in the U.S.
    D: Proof of a clean driving record for 5 years
  answer: D
  explanation: To get a REAL ID, you need proof of SSN, residency, and lawful presence.
    A clean driving record is not a requirement for the ID itself, though it affects
    insurance and licensing status.
- id: 15
  category: license_system
  question: How many years is a standard Massachusetts driver's license valid for
    before it expires?
  choices:
    A: 2 years
    B: 4 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: A standard Massachusetts driver's license is typically valid for five
    years and expires on your birthday.
- id: 16
  category: license_system
  question: For a Massachusetts road test, if the vehicle does not have a foot brake
    for the examiner, what must it have to be acceptable?
  choices:
    A: A dashboard-mounted electronic parking brake
    B: A parking brake located in a center console accessible to the examiner
    C: Dual steering wheels
    D: A manual transmission
  answer: B
  explanation: According to the RMV, the road test vehicle must have a parking brake
    that the examiner can reach in case of an emergency, typically located between
    the front seats.
- id: 17
  category: license_system
  question: A parent or guardian must attend a two-hour professional driver education
    course as part of the Junior Operator License (JOL) requirements. How long is
    this parent class certification valid for?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: The Massachusetts RMV states that a parent's participation in the driver
    education module is valid for five years and can be used for other children in
    the family during that period.
- id: 18
  category: license_system
  question: The Massachusetts learner's permit exam consists of 25 questions. What
    is the minimum number of correct answers required to pass?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '22'
  answer: B
  explanation: To pass the Class D or Class M learner's permit exam, you must answer
    at least 18 out of 25 questions correctly within the 20-minute time limit.
- id: 19
  category: license_system
  question: In Massachusetts, a driver is designated as a 'Habitual Traffic Offender'
    if they accumulate a total of how many major moving violations within a five-year
    period?
  choices:
    A: '2'
    B: '3'
    C: '5'
    D: '10'
  answer: B
  explanation: A Habitual Traffic Offender is someone who has a total of 3 major moving
    violations or any combination of 12 major and minor violations within a five-year
    period.
- id: 20
  category: license_system
  question: What is the license reinstatement fee for a Junior Operator whose license
    was suspended for a first-offense speeding conviction?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: While the suspension for a first-offense speeding conviction for a
    JOL holder is 90 days, the reinstatement fee is a mandatory $500.
- id: 21
  category: license_system
  question: To meet the vision requirements for a Class D license in Massachusetts,
    an applicant must have at least ______ visual acuity in their better eye (with
    or without corrective lenses).
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Massachusetts requires at least 20/40 visual acuity in the better eye
    and at least 120 degrees of combined horizontal peripheral vision.
- id: 22
  category: license_system
  question: If you fail the Massachusetts road test, how long must you wait before
    you are eligible to take the test again?
  choices:
    A: 24 hours
    B: 7 days
    C: 2 weeks
    D: 30 days
  answer: C
  explanation: According to the RMV Driver's Manual, if you fail the road test, you
    must wait at least two weeks before taking another one.
- id: 23
  category: license_system
  question: In Massachusetts, under the Safe Driver Insurance Plan (SDIP), how many
    points are assigned to your driving record for a 'minor traffic violation'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Under the SDIP, a minor traffic violation (such as speeding) adds 2
    points to your driving record.
- id: 24
  category: license_system
  question: Under the Massachusetts 'Motor Voter' law, at what age can an individual
    first pre-register to vote at the RMV?
  choices:
    A: '14'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: Massachusetts law allows residents to pre-register to vote starting
    at age 16, and this can be done during the learner's permit application process.
- id: 25
  category: license_system
  question: In Massachusetts, at what age can a resident first elect to have the 'Organ
    Donor' designation placed on their learner's permit or ID card?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: C
  explanation: Residents can sign up for the organ donor registry starting at age
    16 when they apply for their learner's permit.
- id: 26
  category: license_system
  question: To be eligible for a Junior Operator License, an applicant must maintain
    a clean driving record for how many consecutive months immediately preceding the
    road test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A JOL applicant must have a clean driving record for the six consecutive
    months immediately preceding the date of the road test.
- id: 27
  category: license_system
  question: If you move to Massachusetts and have a valid out-of-state driver's license
    that has been expired for more than ______, you must take the learner's permit
    exam and a road test.
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: If an out-of-state license has been expired for more than one year,
    the RMV requires the applicant to pass both the written and road tests.
- id: 28
  category: license_system
  question: To have the 'Veteran' indicator added to a Massachusetts license, which
    document must the applicant provide to the RMV?
  choices:
    A: A military ID card
    B: A letter from the VA
    C: A DD-214 form showing honorable discharge
    D: A birth certificate
  answer: C
  explanation: To obtain the Veteran's indicator, you must provide a DD-214 that indicates
    Honorable Discharge from active duty.
- id: 29
  category: license_system
  question: Which of the following is a restriction for a Junior Operator License
    (JOL) holder regarding the type of vehicle they may operate?
  choices:
    A: They cannot drive a vehicle with a manual transmission
    B: They cannot drive a vehicle with more than 4 cylinders
    C: They cannot drive any vehicle that requires a Commercial Driver's License (CDL)
    D: They cannot drive a vehicle with a gross weight over 6,000 lbs
  answer: C
  explanation: A Junior Operator is prohibited from operating any vehicle that requires
    a CDL, including those carrying hazardous materials.
- id: 30
  category: driver_testing
  question: In Massachusetts, if you accumulate three surchargeable events within
    a two-year period, what is the mandatory requirement to avoid license suspension?
  choices:
    A: Pay a $500 fine
    B: Complete a Driver Retraining Course within 90 days
    C: Retake the written learner's permit exam
    D: Install an Ignition Interlock Device
  answer: B
  explanation: Drivers who accumulate three surchargeable events (moving violations
    or at-fault accidents) within a two-year period must complete a Registrar-approved
    Driver Retraining Course within 90 days or their license will be suspended.
- id: 31
  category: driver_testing
  question: What is the license suspension period for a Massachusetts driver who accumulates
    seven surchargeable events within a three-year period?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: Under Massachusetts law, accumulating seven surchargeable events within
    a three-year period results in an automatic 60-day license suspension.
- id: 32
  category: driver_testing
  question: Under the Massachusetts Implied Consent Law, if a driver age 21 or older
    refuses a chemical test for BAC, what is the automatic license suspension period
    for a first offense?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: For drivers age 21 or older with no prior OUI offenses, refusing a
    chemical breath or blood test results in an automatic 180-day license suspension.
- id: 33
  category: driver_testing
  question: How often must a vehicle registered in Massachusetts undergo a safety
    and emissions inspection?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: Massachusetts law requires all motor vehicles to pass a combined safety
    and emissions inspection every year.
- id: 34
  category: driver_testing
  question: In Massachusetts, when are you required to turn on your headlights in
    relation to weather conditions?
  choices:
    A: Only when visibility is less than 100 feet
    B: Only during snowstorms
    C: Whenever you use your windshield wipers
    D: Only after sunset
  answer: C
  explanation: Massachusetts law requires drivers to turn on headlights and taillights
    whenever windshield wipers are in use due to precipitation (rain, snow, etc.).
- id: 35
  category: driver_testing
  question: What is the fine for a first-time violation of the Massachusetts 'Move
    Over Law' regarding emergency vehicles?
  choices:
    A: Up to $50
    B: Up to $100
    C: Up to $250
    D: Up to $500
  answer: B
  explanation: A violation of the Move Over Law, which requires drivers to change
    lanes or slow down for emergency vehicles with flashing lights, is punishable
    by a fine of up to $100.
- id: 36
  category: driver_testing
  question: What is the time limit provided to complete the 25-question Massachusetts
    learner's permit exam?
  choices:
    A: 15 minutes
    B: 20 minutes
    C: 30 minutes
    D: No time limit
  answer: B
  explanation: The RMV provides applicants with 20 minutes to complete the automated
    learner's permit knowledge exam.
- id: 37
  category: driver_testing
  question: What is the maximum fine for a first-offense conviction of Operating Under
    the Influence (OUI) in Massachusetts?
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: A first-offense OUI conviction in Massachusetts carries a fine ranging
    from $500 to $5,000, in addition to potential prison time and license suspension.
- id: 38
  category: driver_testing
  question: Under the Massachusetts 'Seven-Day Transfer Law,' how many days do you
    have to transfer a registration from an old vehicle to a newly acquired vehicle?
  choices:
    A: 3 days
    B: 7 days
    C: 10 days
    D: 14 days
  answer: B
  explanation: The Seven-Day Transfer Law allows a person to transfer a registration
    from one vehicle to a newly acquired vehicle for up to seven days, provided certain
    conditions (like selling the old vehicle) are met.
- id: 39
  category: driver_testing
  question: To pass the Massachusetts vision screening, what is the minimum required
    combined horizontal peripheral field of vision?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 140 degrees
  answer: C
  explanation: The RMV requires a combined horizontal peripheral field of vision of
    at least 120 degrees to qualify for a driver's license.
- id: 40
  category: driver_testing
  question: To avoid being charged a road test fee, how much notice must you give
    the RMV to cancel or reschedule a road test appointment?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 1 week
  answer: C
  explanation: The RMV requires at least 72 hours (3 days) notice to cancel or reschedule
    a road test; otherwise, the applicant will be charged the road test fee.
- id: 41
  category: driver_testing
  question: If a Massachusetts licensed driver is convicted of a traffic violation
    in another state, how does it affect their Massachusetts driving record?
  choices:
    A: It is not recorded in Massachusetts
    B: It is recorded but carries no points
    C: It is treated as if it occurred in Massachusetts
    D: It only affects the driver if they are a Junior Operator
  answer: C
  explanation: The RMV records out-of-state convictions and treats them as if they
    occurred in Massachusetts for the purpose of surchargeable events and license
    suspensions.
- id: 42
  category: driver_testing
  question: What is the minimum amount of Compulsory Bodily Injury to Others insurance
    coverage required for a vehicle registered in Massachusetts?
  choices:
    A: $10,000 per person / $20,000 per accident
    B: $20,000 per person / $40,000 per accident
    C: $25,000 per person / $50,000 per accident
    D: $50,000 per person / $100,000 per accident
  answer: B
  explanation: Massachusetts law requires a minimum of $20,000 per person and $40,000
    per accident for Compulsory Bodily Injury to Others (Part 1 of the policy).
- id: 43
  category: driver_testing
  question: To pass the Massachusetts vision screening, what is the minimum visual
    acuity required in at least one eye (with or without corrective lenses)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the Massachusetts Driver's Manual, an applicant must have
    at least 20/40 distant visual acuity in at least one eye, with or without corrective
    lenses, to meet the standard vision requirements.
- id: 44
  category: driver_testing
  question: During a Massachusetts road test, which of the following is a requirement
    for your sponsor?
  choices:
    A: They must be at least 18 years old
    B: They must have their physical driver's license in their possession
    C: They must sit in the back seat of the vehicle
    D: They must have at least 5 years of driving experience
  answer: B
  explanation: The sponsor for a Massachusetts road test must be at least 21 years
    old, have at least one year of driving experience, and must have their physical
    driver's license in their possession to present to the examiner.
- id: 45
  category: driver_testing
  question: What is the maximum number of road tests a Massachusetts applicant can
    take within a 12-month period?
  choices:
    A: '3'
    B: '4'
    C: '6'
    D: Unlimited
  answer: C
  explanation: Massachusetts law limits applicants to no more than six road tests
    in any 12-month period.
- id: 46
  category: driver_testing
  question: During the Massachusetts road test, you will be required to demonstrate
    your ability to back up your vehicle in a straight line for approximately how
    many feet?
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The Massachusetts road test includes a maneuver where the applicant
    must back the vehicle in a straight line for about 50 feet.
- id: 47
  category: driver_testing
  question: During the road test, the examiner will ask you to demonstrate hand signals.
    What is the correct hand signal for 'Slow down or stop'?
  choices:
    A: Arm extended straight out the window
    B: Arm extended upward at a 90-degree angle
    C: Arm extended downward at a 90-degree angle
    D: Arm waving in a circular motion
  answer: C
  explanation: In Massachusetts, the hand signal for slowing down or stopping is the
    arm extended downward out the window at a 90-degree angle.
- id: 48
  category: driver_testing
  question: If a Massachusetts permit applicant is not eligible for a Social Security
    Number (SSN), what must they provide to the RMV?
  choices:
    A: A written affidavit from a parent
    B: A birth certificate from their home country only
    C: A denial letter from the Social Security Administration
    D: Nothing; the SSN is optional
  answer: C
  explanation: Applicants who do not have an SSN must provide a denial letter from
    the Social Security Administration (issued within the last 60 days) along with
    proof of lawful presence and residency.
- id: 49
  category: driver_testing
  question: Which of the following actions during a Massachusetts road test will result
    in an automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: Mounting or driving over a curb or sidewalk
    C: Adjusting your mirrors before starting
    D: Taking more than 3 minutes to parallel park
  answer: B
  explanation: Mounting or driving over a curb or sidewalk, causing a collision, or
    committing any 'dangerous action' are grounds for immediate failure on the MA
    road test.
- id: 50
  category: driver_testing
  question: To pass the Massachusetts vision test, you must be able to distinguish
    between which colors used in traffic signals?
  choices:
    A: Red, Green, and Blue
    B: Red, Yellow, and White
    C: Red, Green, and Amber
    D: Red, Green, and Yellow
  answer: C
  explanation: The Massachusetts Driver's Manual specifically states that applicants
    must be able to distinguish the colors red, green, and amber.
- id: 51
  category: driver_testing
  question: When bringing a vehicle for a Massachusetts road test, the vehicle must
    have a valid inspection sticker. What is the penalty if the vehicle fails to meet
    this requirement?
  choices:
    A: The examiner will give you 30 minutes to find another car
    B: The test will be rejected and you must pay another test fee
    C: The examiner will conduct the test but note it on your license
    D: You will be issued a citation but the test will proceed
  answer: B
  explanation: If the vehicle does not have a valid inspection sticker, the road test
    will be cancelled, and the applicant will be required to pay the road test fee
    again when rescheduling.
- id: 52
  category: driver_testing
  question: During the parallel parking portion of the Massachusetts road test, your
    vehicle must be parked within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: In Massachusetts, the standard for parallel parking is that the vehicle
    must be parked within 12 inches of the curb.
- id: 53
  category: driver_responsibility
  question: In Massachusetts, you must file a Motor Vehicle Crash Operator Report
    if the damage to any one vehicle or other property is in excess of how much?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: According to the Massachusetts Driver's Manual, a crash report must
    be filed with the Registrar, the local police, and the insurance company if the
    damage to any one vehicle or property exceeds $1,000.
- id: 54
  category: driver_responsibility
  question: Under Massachusetts law, what is the minimum amount of compulsory Bodily
    Injury Liability insurance required for one person in one accident?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: B
  explanation: Massachusetts requires a minimum of $20,000 per person for Bodily Injury
    to Others (Part 1 of the compulsory insurance policy).
- id: 55
  category: driver_responsibility
  question: When you purchase a vehicle from a dealer or private party, how many days
    do you have to get the vehicle inspected at a licensed Massachusetts inspection
    station?
  choices:
    A: 3 days
    B: 7 days
    C: 10 days
    D: 14 days
  answer: B
  explanation: Every vehicle registered in Massachusetts must pass a safety and emissions
    inspection within seven days of registration.
- id: 56
  category: driver_responsibility
  question: If you are 21 years of age or older and are convicted of a first-offense
    Operating Under the Influence (OUI), how long will your driver's license be suspended?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: D
  explanation: For a first-offense OUI conviction in Massachusetts for a driver 21
    or older, the license suspension period is one year.
- id: 57
  category: driver_responsibility
  question: In Massachusetts, what is the maximum fine for a first-offense conviction
    of having an open container of alcohol in the passenger area of a motor vehicle?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: The fine for an open container violation in Massachusetts ranges from
    $100 to $500.
- id: 58
  category: driver_responsibility
  question: If a driver over the age of 21 refuses a chemical test (breathalyzer)
    and has no prior OUI offenses, how long will their license be suspended automatically?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 3 years
  answer: B
  explanation: Under the Implied Consent Law, a driver 21 or older with no prior OUI
    offenses who refuses a chemical test faces an automatic 180-day license suspension.
- id: 59
  category: driver_responsibility
  question: How many surchargeable events within a two-year period will result in
    a driver being required to complete a Driver Retraining Course?
  choices:
    A: 2 events
    B: 3 events
    C: 5 events
    D: 7 events
  answer: B
  explanation: If you accumulate three surchargeable events (moving violations or
    at-fault accidents) within a two-year period, you must complete a Driver Retraining
    Course or face license suspension.
- id: 60
  category: driver_responsibility
  question: In Massachusetts, how many surchargeable events within a three-year period
    will result in an automatic 60-day license suspension?
  choices:
    A: 3 events
    B: 5 events
    C: 7 events
    D: 10 events
  answer: C
  explanation: The RMV will suspend your license for 60 days if you accumulate seven
    surchargeable events within a three-year period.
- id: 61
  category: driver_responsibility
  question: Under the Massachusetts Safe Driver Insurance Plan (SDIP), how many surcharge
    points are assigned for a major traffic law violation (such as OUI)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: A major traffic law violation results in 5 surcharge points being added
    to a driver's record.
- id: 62
  category: driver_responsibility
  question: If your vehicle fails a Massachusetts emissions test, how many days do
    you have to get the problem fixed and have the vehicle re-inspected?
  choices:
    A: 20 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: If a vehicle fails the emissions test, the owner has 60 days to have
    the vehicle repaired and pass a re-test.
- id: 63
  category: driver_responsibility
  question: In Massachusetts, within how many days must a Motor Vehicle Crash Operator
    Report be submitted to the RMV after an accident?
  choices:
    A: 2 days
    B: 5 days
    C: 7 days
    D: 10 days
  answer: B
  explanation: You must file a crash report within five days of the accident if it
    meets the reporting criteria (injury, death, or $1,000+ property damage).
- id: 64
  category: driver_responsibility
  question: What is the minimum compulsory Personal Injury Protection (PIP) coverage
    required for a Massachusetts auto insurance policy?
  choices:
    A: $2,000
    B: $5,000
    C: $8,000
    D: $10,000
  answer: C
  explanation: Personal Injury Protection (PIP) is a compulsory part of Massachusetts
    auto insurance, and the minimum required coverage is $8,000.
- id: 65
  category: driver_responsibility
  question: 'Under the ''Seven-Day Transfer Law,'' you may drive a newly acquired
    vehicle with your old plates for up to seven days if you have lost possession
    of your previous vehicle and the new vehicle is:'
  choices:
    A: The same make and model as the old one
    B: Of the same registration type (e.g., passenger vehicle)
    C: Insured by a different company
    D: Purchased from a family member only
  answer: B
  explanation: The 7-day transfer law allows you to transfer a registration from one
    vehicle to another of the same registration type, provided you have disposed of
    the first vehicle.
- id: 66
  category: driver_responsibility
  question: In Massachusetts, how many surcharge points are assigned to your driving
    record for a minor at-fault accident (damage between $1,000 and $5,000)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Under the SDIP system, a minor at-fault accident (more than $1,000
    but less than $5,000 in damage) results in 3 surcharge points.
- id: 67
  category: driver_responsibility
  question: In Massachusetts, if you are involved in a crash where someone is injured
    or there is damage to property exceeding $1,000, you must file a Motor Vehicle
    Crash Operator Report within how many days?
  choices:
    A: 2 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: According to the Massachusetts RMV, a crash report must be filed within
    5 days if any person is killed, injured, or if there is damage in excess of $1,000
    to any one vehicle or other property.
- id: 68
  category: driver_responsibility
  question: What is the minimum amount of 'Damage to Someone Else's Property' insurance
    coverage required by law in Massachusetts?
  choices:
    A: $1,000
    B: $5,000
    C: $10,000
    D: $20,000
  answer: B
  explanation: Massachusetts law requires a minimum of $5,000 in coverage for damage
    to someone else's property (Part 4 of the standard policy).
- id: 69
  category: driver_responsibility
  question: When you purchase a vehicle and register it in Massachusetts, within how
    many days must you have the vehicle undergo a state safety and emissions inspection?
  choices:
    A: 3 days
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: All vehicles registered in Massachusetts must pass a safety and emissions
    inspection within 7 days of registration.
- id: 70
  category: driver_responsibility
  question: What is the fine for a driver or passenger (age 16 or older) who is not
    wearing a seat belt in Massachusetts?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: In Massachusetts, the fine for violating the seat belt law is $25 per
    person.
- id: 71
  category: driver_responsibility
  question: If you are convicted of failing to 'Move Over' for an emergency vehicle
    with flashing lights in Massachusetts, what is the fine for a first offense?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: The Massachusetts Move Over Law requires drivers to slow down and,
    if safe, move to a non-adjacent lane for emergency vehicles. A violation carries
    a fine of up to $100.
- id: 72
  category: driver_responsibility
  question: What is the mandatory fine for a first offense of failing to stop for
    a school bus with its red lights flashing and stop arm extended in Massachusetts?
  choices:
    A: $100
    B: $200
    C: $250
    D: $500
  answer: C
  explanation: In Massachusetts, the fine for a first offense of illegally passing
    a school bus is $250.
- id: 73
  category: driver_responsibility
  question: In Massachusetts, what is the penalty for abandoning a motor vehicle on
    a public or private way without permission?
  choices:
    A: A $50 fine only
    B: A fine of $250–$500 and license suspension for up to 2 years
    C: Mandatory 30 days in jail
    D: There is no penalty if the vehicle is older than 10 years
  answer: B
  explanation: Abandoning a vehicle in Massachusetts can result in a fine of $250
    to $500 and a license suspension of up to two years.
- id: 74
  category: driver_responsibility
  question: What is the minimum fine for a first offense of parking in a space designated
    for persons with disabilities without a valid placard or plate in Massachusetts?
  choices:
    A: $50
    B: $100
    C: $300
    D: $500
  answer: C
  explanation: The fine for a first offense of unauthorized parking in a handicap-accessible
    space in Massachusetts is $300.
- id: 75
  category: driver_responsibility
  question: What is the minimum fine for littering from a motor vehicle in Massachusetts?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: Under Massachusetts law, littering from a motor vehicle is illegal
    and carries a minimum fine of $100.
- id: 76
  category: driver_responsibility
  question: If you sell your car and buy a new one, how many days do you have to transfer
    your registration to the new vehicle, provided you meet specific criteria (such
    as being at least 18 and the vehicle types being the same)?
  choices:
    A: 3 days
    B: 7 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: Massachusetts allows a 7-day grace period to transfer a registration
    from a sold or traded-in vehicle to a newly acquired vehicle.
- id: 77
  category: safe_driving_rules
  question: In Massachusetts, what is the speed limit in a 'thickly settled' or business
    district unless otherwise posted?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: According to the Massachusetts Driver's Manual, the speed limit in
    a thickly settled or business district is 30 mph unless signs state otherwise.
- id: 78
  category: safe_driving_rules
  question: When driving on a highway in Massachusetts, how many feet before an exit
    or turn must you signal your intention to move?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: In Massachusetts, you must signal at least 500 feet before a turn or
    exit on a highway, and 100 feet on other roads.
- id: 79
  category: safe_driving_rules
  question: Under Massachusetts law, you must turn on your headlights and taillights
    whenever you use your windshield wipers. In what other specific condition must
    they be on?
  choices:
    A: Only when it is snowing
    B: From one-half hour after sunset until one-half hour before sunrise
    C: Only when driving on unlit rural roads
    D: From sunset until sunrise exactly
  answer: B
  explanation: Massachusetts law requires headlights and taillights to be on from
    one-half hour after sunset until one-half hour before sunrise, and whenever visibility
    is reduced or wipers are in use.
- id: 80
  category: safe_driving_rules
  question: In Massachusetts, what is the minimum distance you must park away from
    a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: State law prohibits parking within 10 feet of a fire hydrant.
- id: 81
  category: safe_driving_rules
  question: When entering a rotary in Massachusetts, who has the right-of-way?
  choices:
    A: Traffic entering the rotary
    B: Traffic already in the rotary
    C: The vehicle approaching from the right
    D: The vehicle traveling at the highest speed
  answer: B
  explanation: In Massachusetts, traffic already in the rotary has the right-of-way
    over vehicles entering the rotary.
- id: 82
  category: safe_driving_rules
  question: The Massachusetts 'Move Over Law' requires drivers to do what when approaching
    a stationary emergency or maintenance vehicle with flashing lights?
  choices:
    A: Stop immediately in the travel lane
    B: Maintain speed but honk to warn the workers
    C: Move to a non-adjacent lane if safe, or slow down to a reasonable speed
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: The Move Over Law requires drivers to move over one lane if possible,
    or slow down to a safe speed for emergency, maintenance, or recovery vehicles
    with flashing lights.
- id: 83
  category: safe_driving_rules
  question: If you are driving on a road with a physical barrier or median dividing
    the highway, are you required to stop for a school bus with red lights flashing
    on the opposite side?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, you do not need to stop if there is a physical barrier or median
    C: Yes, but only if the bus driver signals you to stop
    D: No, but you must slow down to 10 mph
  answer: B
  explanation: In Massachusetts, you do not have to stop for a school bus with flashing
    red lights if it is on the other side of a divided highway with a physical barrier
    or median.
- id: 84
  category: safe_driving_rules
  question: When parking your vehicle on a downhill grade with a curb, in which direction
    should you turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: A
  explanation: When parking downhill with a curb, you should turn your wheels toward
    the curb so the car will roll into the curb if the brakes fail.
- id: 85
  category: safe_driving_rules
  question: What is the standard speed limit in a school zone in Massachusetts?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The speed limit in a school zone is 20 mph throughout the Commonwealth
    of Massachusetts.
- id: 86
  category: safe_driving_rules
  question: In Massachusetts, if you are convicted of speeding in a designated work
    zone, what happens to the fine?
  choices:
    A: The fine is waived for first-time offenders
    B: The fine is doubled
    C: The fine is tripled
    D: The fine is increased by a flat $500
  answer: B
  explanation: Under Massachusetts law, speeding fines are doubled in active work
    zones.
- id: 87
  category: safe_driving_rules
  question: When using high-beam headlights at night, you must switch to low-beams
    when an oncoming vehicle is within how many feet?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: You must lower your high beams when an oncoming vehicle is within 500
    feet, and when following a vehicle within 200 feet.
- id: 88
  category: safe_driving_rules
  question: In Massachusetts, you are allowed to pass a vehicle on the right only
    in which of the following circumstances?
  choices:
    A: When the vehicle ahead is turning left
    B: To get around a slow driver on a one-lane road
    C: When you are in a hurry and the left lane is blocked
    D: Passing on the right is never allowed
  answer: A
  explanation: Passing on the right is permitted in Massachusetts only on one-way
    streets or when the vehicle being overtaken is making a left turn.
- id: 89
  category: safe_driving_rules
  question: In Massachusetts, what is the minimum fine for a speeding violation?
  choices:
    A: $50
    B: $75
    C: $105
    D: $150
  answer: C
  explanation: In Massachusetts, the minimum fine for speeding is $105. This covers
    the first 10 mph over the speed limit (plus a $5 surcharge for the Head Injury
    Treatment Services Trust Fund and a $50 surcharge for the General Fund).
- id: 90
  category: safe_driving_rules
  question: In Massachusetts, it is illegal to park within how many feet of a fire
    hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Massachusetts law prohibits parking within 10 feet of a fire hydrant.
- id: 91
  category: safe_driving_rules
  question: Massachusetts law requires you to turn on your headlights in which of
    the following situations?
  choices:
    A: Whenever you use your windshield wipers
    B: Only between sunset and sunrise
    C: Only when visibility is less than 100 feet
    D: Only on highways
  answer: A
  explanation: Massachusetts law requires drivers to use headlights and taillights
    whenever windshield wipers are in use. They must also be used from one-half hour
    after sunset to one-half hour before sunrise.
- id: 92
  category: safe_driving_rules
  question: 'In Massachusetts, you must file a Motor Vehicle Crash Operator Report
    if you are involved in an accident that results in death, personal injury, or
    property damage exceeding:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: A crash report must be filed with the RMV within five days if any person
    is killed or injured, or if there is damage in excess of $1,000 to any one vehicle
    or other property.
- id: 93
  category: safe_driving_rules
  question: When driving at night, you must dim your high beam headlights when you
    are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: In Massachusetts, you must lower your high beams to low beams when
    you are within 500 feet of an oncoming vehicle.
- id: 94
  category: safe_driving_rules
  question: When parking on a public way in Massachusetts, your vehicle must be no
    more than how many inches from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: Massachusetts law requires that a parked vehicle be no more than 12
    inches from the curb.
- id: 95
  category: safe_driving_rules
  question: In Massachusetts, you are prohibited from parking within how many feet
    of an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Massachusetts law prohibits parking within 20 feet of an intersection.
- id: 96
  category: defensive_driving
  question: In Massachusetts, at what speed can hydroplaning (where your tires lose
    contact with the road on a film of water) begin?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: At any speed over 20 mph
    D: Only when braking at 50 mph
  answer: A
  explanation: According to the Massachusetts Driver's Manual, hydroplaning can begin
    at speeds as low as 35 mph. In a heavy rain, your tires can lose all contact with
    the road at 50 mph.
- id: 97
  category: defensive_driving
  question: When following another vehicle at night in Massachusetts, you must switch
    to low beam headlights when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: You must dim your high beams when following another vehicle within
    200 feet so that you do not cause glare in their rearview mirror.
- id: 98
  category: defensive_driving
  question: The Massachusetts Driver's Manual recommends which rule for maintaining
    a safe following distance under normal conditions?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The three-second rule
    D: The five-second rule
  answer: C
  explanation: The RMV recommends a minimum three-second following distance behind
    the vehicle in front of you under normal weather and traffic conditions.
- id: 99
  category: defensive_driving
  question: To scan the road effectively for hazards, the Massachusetts Driver's Manual
    suggests looking how far ahead?
  choices:
    A: 5 seconds ahead
    B: 10 to 15 seconds ahead
    C: 20 to 30 seconds ahead
    D: Only at the car directly in front of you
  answer: B
  explanation: Defensive driving requires looking 10 to 15 seconds ahead of your vehicle
    to identify potential hazards before you reach them.
- id: 100
  category: defensive_driving
  question: In Massachusetts, if you are driving on a highway, you must signal your
    intention to turn or change lanes at least ____ before doing so.
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: On a highway, you must signal at least 500 feet before a turn or lane
    change. In city or residential streets, the requirement is 100 feet.
- id: 101
  category: defensive_driving
  question: If your vehicle begins to skid on a slippery road in Massachusetts, what
    is the correct defensive driving technique to regain control?
  choices:
    A: Brake hard and turn away from the skid
    B: Turn the steering wheel in the direction that the rear of the car is sliding
    C: Shift into neutral and close your eyes
    D: Accelerate quickly to pull out of the skid
  answer: B
  explanation: To recover from a skid, you should take your foot off the gas and steer
    in the direction the rear of the vehicle is sliding.
- id: 102
  category: defensive_driving
  question: What does the Massachusetts 'Fundamental Speed Law' state?
  choices:
    A: You must always drive at the posted speed limit
    B: You must never drive faster than is reasonable and proper for current conditions
    C: You must drive at least 40 mph on all state highways
    D: Speed limits do not apply during emergency situations
  answer: B
  explanation: The Fundamental Speed Law requires you to adjust your speed based on
    traffic, road conditions, weather, and visibility, even if it means driving below
    the posted limit.
- id: 103
  category: defensive_driving
  question: When driving in heavy fog in Massachusetts, which headlight setting should
    you use?
  choices:
    A: High beams to see further ahead
    B: Low beams to reduce glare
    C: Parking lights only
    D: No lights, as they reflect off the fog
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the water droplets
    in the fog, causing glare and making it harder to see.
- id: 104
  category: defensive_driving
  question: 'In Massachusetts, your vehicle''s headlights must be turned on from:'
  choices:
    A: Sunset to sunrise
    B: One hour after sunset to one hour before sunrise
    C: One-half hour after sunset to one-half hour before sunrise
    D: 8:00 PM to 6:00 AM
  answer: C
  explanation: Massachusetts law requires headlights to be on from one-half hour after
    sunset until one-half hour before sunrise.
- id: 105
  category: defensive_driving
  question: According to the Massachusetts Driver's Manual, when are you required
    to turn on your headlights?
  choices:
    A: Only from sunset to sunrise
    B: From one-half hour after sunset until one-half hour before sunrise
    C: Only when visibility is less than 100 feet
    D: From one hour after sunset until one hour before sunrise
  answer: B
  explanation: In Massachusetts, you must turn on your headlights from one-half hour
    after sunset until one-half hour before sunrise, and whenever you use your windshield
    wipers.
- id: 106
  category: defensive_driving
  question: 'To maintain a safe following distance under normal driving conditions
    in Massachusetts, you should use the:'
  choices:
    A: One-second rule
    B: Two-second rule
    C: Three-second rule
    D: Five-second rule
  answer: C
  explanation: The Massachusetts Driver's Manual recommends the 'three-second rule'
    as a minimum following distance under normal conditions to allow enough time to
    react to hazards.
- id: 107
  category: defensive_driving
  question: 'In Massachusetts, you must dim your high beam headlights when following
    another vehicle from behind within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: You must switch to low beams when following another vehicle within
    200 feet so that your lights do not reflect into the other driver's rearview mirror.
- id: 108
  category: defensive_driving
  question: To be a defensive driver in Massachusetts, how far ahead should you scan
    the road for potential hazards?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: At least one mile
  answer: B
  explanation: The RMV manual suggests scanning the road 10 to 15 seconds ahead of
    your vehicle to anticipate problems before they occur.
- id: 109
  category: defensive_driving
  question: 'In Massachusetts, failing to clear snow or ice from your vehicle before
    driving can result in a fine for:'
  choices:
    A: Improper equipment
    B: Unsecured load or negligent operation
    C: Obstructing traffic
    D: There is no specific fine for snow on a vehicle
  answer: B
  explanation: Driving with snow or ice on your vehicle is dangerous. You can be cited
    for an unsecured load or negligent operation if the snow/ice falls off and causes
    a hazard or blocks your vision.
- id: 110
  category: defensive_driving
  question: When passing a bicycle in Massachusetts, what is the minimum distance
    you must maintain between your vehicle and the cyclist?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: As of 2023, Massachusetts law requires drivers to maintain at least
    4 feet of distance when passing 'vulnerable users,' including bicyclists.
- id: 111
  category: defensive_driving
  question: In Massachusetts, if you are caught driving 15 mph over the speed limit
    in a 65 mph zone, what is the total fine for a first offense?
  choices:
    A: $105
    B: $150
    C: $155
    D: $200
  answer: C
  explanation: The minimum speeding fine is $105. For every mph over the first 10
    mph, you are charged an extra $10. (15 mph over = $105 + 5 * $10 = $155).
- id: 112
  category: defensive_driving
  question: 'In Massachusetts, you must stop for a school bus with flashing red lights
    and an extended stop arm unless:'
  choices:
    A: You are on the opposite side of a divided highway with a physical barrier
    B: You are in a hurry and no children are visible
    C: The bus is stopped at a railroad crossing
    D: You are driving a commercial vehicle
  answer: A
  explanation: You must stop for a school bus on any undivided road. You only do not
    have to stop if you are traveling on the opposite side of a divided highway separated
    by a physical barrier like a median.
- id: 113
  category: defensive_driving
  question: What is the rule regarding funeral processions in Massachusetts?
  choices:
    A: They have no special right-of-way
    B: You may cut through the procession if there is a gap
    C: Processions have the right-of-way through intersections regardless of traffic
      signals
    D: You must pull over to the right and stop until the entire procession passes
  answer: C
  explanation: In Massachusetts, vehicles in a funeral procession have the right-of-way
    through intersections. Other drivers must not drive between or interfere with
    the vehicles in the procession.
- id: 114
  category: defensive_driving
  question: In Massachusetts, it is illegal to follow closer than ____ feet behind
    an emergency vehicle responding to an alarm.
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: According to Massachusetts General Law, you may not follow closer than
    300 feet behind an emergency vehicle that has its flashing lights or sirens on.
- id: 115
  category: alcohol_drugs_health
  question: What does the Massachusetts 'Implied Consent Law' mean for drivers?
  choices:
    A: You agree to have your vehicle searched at any time.
    B: By driving, you agree to take a breathalyzer or blood test if requested by
      police.
    C: You agree to carry minimum liability insurance.
    D: You agree to allow passengers to consume alcohol in your vehicle.
  answer: B
  explanation: The Implied Consent Law means that by operating a motor vehicle in
    Massachusetts, you have consented to a chemical test (breath or blood) to determine
    your BAC if suspected of OUI.
- id: 116
  category: alcohol_drugs_health
  question: In Massachusetts, at what OUI offense number is a driver required to have
    an Ignition Interlock Device (IID) installed in their vehicle?
  choices:
    A: First offense
    B: Second and subsequent offenses
    C: Third offense only
    D: Only if the BAC was above 0.20%
  answer: B
  explanation: Under Melanie's Law, any driver with two or more OUI convictions who
    is eligible for a hardship license or license reinstatement must have an Ignition
    Interlock Device installed.
- id: 117
  category: alcohol_drugs_health
  question: What is the maximum fine for a person convicted of buying alcohol for
    a minor in Massachusetts?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Buying alcohol for a person under 21 is a criminal offense in Massachusetts,
    punishable by a fine of up to $2,000 and/or up to one year in jail.
- id: 118
  category: alcohol_drugs_health
  question: When alcohol is combined with other drugs, such as antidepressants or
    cold medicine, what is the likely effect on driving ability?
  choices:
    A: The effects of the drugs are canceled out.
    B: The effects of the alcohol are reduced.
    C: The effects are multiplied (synergistic effect).
    D: There is no change in driving ability.
  answer: C
  explanation: Combining alcohol with other drugs can cause a synergistic effect,
    where the impact on the central nervous system is much greater than the sum of
    the individual effects.
- id: 119
  category: alcohol_drugs_health
  question: Which of the following is the only way to lower your Blood Alcohol Content
    (BAC) before driving?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Waiting for time to pass
  answer: D
  explanation: Only time can lower BAC. The body processes alcohol at a steady rate
    (roughly one drink per hour), and stimulants like coffee do not speed up this
    process.
- id: 120
  category: alcohol_drugs_health
  question: Which statement is true regarding marijuana use and driving in Massachusetts?
  choices:
    A: It is legal to drive while high if you have a medical marijuana card.
    B: It is illegal to operate a motor vehicle while under the influence of marijuana.
    C: Marijuana does not affect reaction time or coordination.
    D: Drivers can smoke marijuana while driving as long as they are over 21.
  answer: B
  explanation: In Massachusetts, it is illegal to operate a motor vehicle while impaired
    by marijuana, regardless of whether it was used for medicinal or recreational
    purposes.
- id: 121
  category: alcohol_drugs_health
  question: If you have a medical condition that may affect your ability to drive
    safely, what is your responsibility in Massachusetts?
  choices:
    A: You do not need to do anything unless you get into an accident.
    B: You must report the condition to the RMV Medical Affairs Branch.
    C: You only need to tell your insurance company.
    D: You must stop driving immediately and surrender your license permanently.
  answer: B
  explanation: Drivers are legally required to report any physical or mental condition
    that may impair their ability to drive to the RMV Medical Affairs Branch.
- id: 122
  category: alcohol_drugs_health
  question: What is the penalty for a person under age 21 convicted of transporting
    alcohol in a vehicle (without a parent present)?
  choices:
    A: A $50 fine only
    B: License suspension for 90 days to one year
    C: Mandatory 30 days in jail
    D: There is no penalty if the container is sealed
  answer: B
  explanation: A person under 21 who transports alcohol (unless accompanied by a parent/guardian)
    faces a license suspension of 90 days to one year.
- id: 123
  category: alcohol_drugs_health
  question: Which of the following factors affects a person's Blood Alcohol Content
    (BAC)?
  choices:
    A: Body weight
    B: Amount of food eaten before drinking
    C: The length of time spent drinking
    D: All of the above
  answer: D
  explanation: BAC is determined by body weight, the amount of alcohol consumed, the
    amount of food in the stomach, and the time elapsed since drinking began.
- id: 124
  category: alcohol_drugs_health
  question: Under the Massachusetts 'Implied Consent' law, by driving on a public
    way, you have agreed to which of the following?
  choices:
    A: Allow a search of your vehicle at any time
    B: Submit to a breathalyzer or blood test if requested by police
    C: Carry at least $50,000 in property damage insurance
    D: Always yield to pedestrians regardless of the light
  answer: B
  explanation: The Implied Consent law means that when you drive in Massachusetts,
    you agree to take a breathalyzer or blood test if a police officer suspects you
    are driving under the influence.
- id: 125
  category: alcohol_drugs_health
  question: Regarding marijuana use, which of the following is true for drivers in
    Massachusetts?
  choices:
    A: It is legal to smoke marijuana while driving as long as you are not impaired
    B: Marijuana must be kept in a sealed container or in a locked glove box/trunk
    C: Open containers of marijuana are allowed in the back seat
    D: Drivers are exempt from OUI laws if they have a medical marijuana card
  answer: B
  explanation: Like alcohol, marijuana must be stored in a sealed container or kept
    in a locked glove compartment or trunk. It is illegal to drive under the influence
    of marijuana.
- id: 126
  category: alcohol_drugs_health
  question: Under 'Melanie's Law,' a driver with two or more OUI convictions is required
    to have what device installed in their vehicle?
  choices:
    A: A GPS tracking device
    B: An Ignition Interlock Device (IID)
    C: An automatic speed governor
    D: A dash camera
  answer: B
  explanation: Melanie's Law requires any driver with two or more OUI convictions
    to install an Ignition Interlock Device (IID) in their vehicle to prevent it from
    starting if alcohol is detected.
- id: 127
  category: alcohol_drugs_health
  question: 'In Massachusetts, if you are under 21 and are convicted of buying or
    attempting to buy alcohol, your license will be suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: Even if you are not driving, a conviction for buying or attempting
    to buy alcohol while under 21 results in a 180-day license suspension.
- id: 128
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in the context of driving safety?
  choices:
    A: The effect of mixing two different types of gasoline
    B: The increased impairment caused by mixing alcohol and drugs together
    C: The benefit of drinking coffee after consuming alcohol
    D: The reaction time improvement from energy drinks
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs are combined,
    creating a much higher level of impairment than either substance would cause alone.
- id: 129
  category: alcohol_drugs_health
  question: If you are taking prescription medication, who is responsible for ensuring
    you are safe to drive?
  choices:
    A: The pharmacist who filled the prescription
    B: The doctor who wrote the prescription
    C: The police officer who stops you
    D: You, the driver
  answer: D
  explanation: It is the driver's responsibility to know the side effects of any medication
    they are taking and to ensure they are fit to operate a vehicle safely.
- id: 130
  category: alcohol_drugs_health
  question: Under Massachusetts law, which of the following can be used as evidence
    of OUI impairment besides a breathalyzer?
  choices:
    A: Field sobriety tests and officer observations
    B: The driver's age and gender
    C: The type of vehicle being driven
    D: The time of day the stop occurred
  answer: A
  explanation: Police officers use field sobriety tests (like walking in a straight
    line) and observations of behavior (slurred speech, smell of alcohol) as evidence
    of impairment.
- id: 131
  category: alcohol_drugs_health
  question: Which of the following factors affects how your body processes alcohol
    and your resulting BAC?
  choices:
    A: Your body weight
    B: The amount of food in your stomach
    C: How quickly you consumed the alcohol
    D: All of the above
  answer: D
  explanation: BAC is influenced by body weight, the amount of food eaten, the speed
    of consumption, and the number of drinks consumed.
- id: 132
  category: alcohol_drugs_health
  question: What is the only way to reduce your Blood Alcohol Content (BAC) and 'sober
    up'?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Allowing time for your body to process the alcohol
    D: Exercising vigorously
  answer: C
  explanation: Only time can reduce BAC. Coffee, cold showers, and exercise do not
    speed up the process of the liver metabolizing alcohol.
- id: 133
  category: penalties_and_points
  question: In Massachusetts, what is the minimum fine for speeding, including the
    $50 surcharge for the Head Injury Treatment Services Trust Fund?
  choices:
    A: $50
    B: $75
    C: $105
    D: $150
  answer: C
  explanation: According to the Massachusetts Driver's Manual, the lowest penalty
    for driving above the speed limit is a $105 fine. This includes a $50 surcharge
    for the Head Injury Treatment Services Trust Fund.
- id: 134
  category: penalties_and_points
  question: If you are convicted of speeding 16 mph over the speed limit in Massachusetts,
    what is the total fine you will be required to pay?
  choices:
    A: $105
    B: $165
    C: $160
    D: $210
  answer: B
  explanation: 'The fine is $105 for the first 10 mph over the limit, plus $10 for
    each additional mph. For 16 mph over: $105 + (6 mph x $10) = $165.'
- id: 135
  category: penalties_and_points
  question: Under the Massachusetts Hands-Free Law, what is the fine for a first offense
    for a driver age 18 or older?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: For drivers 18 and older, the first offense for using a non-hands-free
    mobile electronic device is a $100 fine.
- id: 136
  category: penalties_and_points
  question: What is the standard license reinstatement fee for most general (non-OUI/non-JOL)
    suspensions in Massachusetts?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: While fees vary for specific serious offenses, the standard reinstatement
    fee for many general license suspensions in Massachusetts is $100.
- id: 137
  category: penalties_and_points
  question: In Massachusetts, how many points are added to your driving record for
    a major traffic violation, such as Operating Under the Influence (OUI)?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 7 points
  answer: C
  explanation: Major traffic violations, including OUI and leaving the scene of an
    accident, result in 5 points being added to your driving record.
- id: 138
  category: penalties_and_points
  question: If you are convicted of driving 75 mph in a 55 mph zone in Massachusetts,
    what is the total fine (including the $5 public safety surcharge)?
  choices:
    A: $105
    B: $155
    C: $205
    D: $255
  answer: C
  explanation: The minimum fine for speeding is $105 (for 1-10 mph over). For every
    mph over the first 10, you are charged an additional $10. Driving 20 mph over
    results in $105 + (10 x $10) = $205.
- id: 139
  category: penalties_and_points
  question: If a Junior Operator (JOL) is convicted of a second speeding offense,
    how long will their license be suspended?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: Indefinitely
  answer: C
  explanation: While a first speeding offense for a JOL results in a 90-day suspension,
    a second or subsequent offense results in a one-year license suspension.
- id: 140
  category: penalties_and_points
  question: How many SDIP points are assigned for an 'at-fault' accident where the
    insurance company pays more than $2,000 for property damage?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: A major at-fault accident (claim over $2,000) results in 4 SDIP points.
    A minor at-fault accident (claim between $1,000 and $2,000) results in 3 points.
- id: 141
  category: penalties_and_points
  question: A Junior Operator (JOL) who violates the nighttime driving restriction
    for the first time will have their license suspended for how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: A first-offense violation of the JOL nighttime restriction (12:30 a.m.
    to 5:00 a.m.) results in a 60-day license suspension.
- id: 142
  category: penalties_and_points
  question: Under Melanie's Law, if you are convicted of a second or subsequent OUI
    offense, you must have what device installed in your vehicle to get your license
    back?
  choices:
    A: A GPS tracker
    B: An Ignition Interlock Device (IID)
    C: An electronic speed governor
    D: A dash camera
  answer: B
  explanation: Melanie's Law requires any driver with two or more OUI convictions
    to have an Ignition Interlock Device (IID) installed in their vehicle as a condition
    of license reinstatement.
- id: 143
  category: penalties_and_points
  question: 'If you accumulate seven surchargeable events on your Massachusetts driving
    record within a three-year period, your license will be automatically suspended
    for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: The RMV will automatically suspend your license for 60 days if you
    accumulate seven surchargeable events (moving violations or at-fault accidents)
    within a three-year period.
- id: 144
  category: sharing_the_road
  question: According to the Massachusetts 'Vulnerable Road Users' law, what is the
    minimum safe distance a motorist must maintain when passing a bicycle or pedestrian?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: As of 2023, Massachusetts law requires motorists to maintain a 'safe
    passing distance' of at least 4 feet when passing vulnerable road users, including
    cyclists and pedestrians.
- id: 145
  category: sharing_the_road
  question: 'When approaching a stationary emergency vehicle with flashing lights
    on a highway with at least two lanes in your direction, the Massachusetts ''Move
    Over Law'' requires you to:'
  choices:
    A: Maintain speed but move to the left lane
    B: Stop completely until signaled to pass
    C: Reduce speed and, if safe to do so, leave the lane adjacent to the emergency
      vehicle
    D: Increase speed to pass the vehicle as quickly as possible
  answer: C
  explanation: The Massachusetts Move Over Law requires drivers to slow down and,
    if safe and possible, move to a lane that is not adjacent to the stationary emergency
    or maintenance vehicle.
- id: 146
  category: sharing_the_road
  question: In Massachusetts, you must stop for a pedestrian in a crosswalk if they
    are within how many feet of the lane you are traveling in?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Massachusetts law requires motorists to yield to a pedestrian in a
    crosswalk if the pedestrian is on the half of the way upon which the vehicle is
    traveling or within 10 feet of that half of the way.
- id: 147
  category: sharing_the_road
  question: When following a large truck, how can you ensure you are not in the driver's
    'No-Zone' (blind spot)?
  choices:
    A: If you can see the truck's side mirrors, the driver can see you
    B: If you are at least 10 feet behind the truck
    C: If you flash your high beams
    D: If you stay in the lane to the far right of the truck
  answer: A
  explanation: 'A general rule for sharing the road with trucks is: ''If you can''t
    see the driver''s face in their side-view mirror, they can''t see you.'' These
    areas are known as No-Zones.'
- id: 148
  category: sharing_the_road
  question: In Massachusetts, what is the maximum fine for 'dooring'—opening a vehicle
    door into the path of a cyclist or other traffic?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Under MGL c.90 §14, opening a door into the path of a cyclist or other
    traffic (dooring) is a civil violation punishable by a fine of up to $100.
- id: 149
  category: sharing_the_road
  question: When a school bus is stopped on the opposite side of a divided highway
    with a physical barrier (like a median), do you need to stop?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, you do not need to stop if there is a physical barrier
    C: Yes, but only if the bus driver signals you to stop
    D: No, but you must slow down to 5 mph
  answer: B
  explanation: In Massachusetts, you are not required to stop for a school bus with
    flashing red lights if it is on the opposite side of a divided highway that is
    separated by a physical barrier or median.
- id: 150
  category: sharing_the_road
  question: 'If you see a pedestrian using a white cane or a guide dog at an intersection,
    you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Slow down and proceed with caution
    C: Come to a complete stop and remain stopped until the pedestrian has safely
      crossed
    D: Drive around them if there is enough room
  answer: C
  explanation: Massachusetts law requires drivers to come to a complete stop for a
    blind pedestrian using a guide dog or carrying a white cane (with or without a
    red tip) and remain stopped until they have crossed the entire way.
- id: 151
  category: sharing_the_road
  question: In Massachusetts, how many feet must you stay behind a fire apparatus
    or other emergency vehicle that is responding to an alarm?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: According to Massachusetts law, it is illegal to follow within 300
    feet of a fire apparatus or other emergency vehicle responding to an alarm.
- id: 152
  category: sharing_the_road
  question: When can a bicyclist legally ride on a sidewalk in Massachusetts?
  choices:
    A: Anywhere, at any time
    B: Only if they are under the age of 12
    C: Everywhere except in business districts where prohibited by local ordinance
    D: Never; bicycles are strictly prohibited on sidewalks
  answer: C
  explanation: Massachusetts law allows bicycles to be ridden on sidewalks outside
    of business districts, unless local ordinances specifically prohibit it. Cyclists
    must yield to pedestrians on sidewalks.
- id: 153
  category: sharing_the_road
  question: 'A ''Slow Moving Vehicle'' emblem (an orange triangle with a red border)
    must be displayed on the rear of vehicles designed to travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The Slow Moving Vehicle emblem is required on the rear of all vehicles
    designed to travel at speeds of 25 mph or less, such as farm machinery or horse-drawn
    carriages.
- id: 154
  category: sharing_the_road
  question: In Massachusetts, when are bicyclists required to use a white headlamp
    and a red rear light or reflector?
  choices:
    A: Only when riding on highways
    B: Only during rain or fog
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: At all times while riding
  answer: C
  explanation: Massachusetts law requires bicyclists to use a white light on the front
    and a red light or reflector on the rear when riding from a half-hour after sunset
    to a half-hour before sunrise.
- id: 155
  category: sharing_the_road
  question: 'If you are driving and encounter a horse-drawn vehicle or a person riding
    a horse, you should:'
  choices:
    A: Honk to warn them you are passing
    B: Speed up to pass them quickly
    C: Slow down and stop if the horse appears frightened
    D: Flash your high beams to increase visibility
  answer: C
  explanation: Under Massachusetts law, drivers must exercise caution when approaching
    horses. You must slow down and, if the horse appears frightened or the rider signals,
    you must stop your vehicle until the horse passes.
- id: 156
  category: sharing_the_road
  question: Which of the following is true about bicyclists' right to use the road
    in Massachusetts?
  choices:
    A: They must always ride on the shoulder
    B: They may ride two abreast but must not impede the flow of traffic
    C: They are required to use a bike lane if one is available
    D: They must ride against the flow of traffic for better visibility
  answer: B
  explanation: In Massachusetts, bicyclists have the right to ride two abreast (side-by-side)
    as long as they do not impede the normal and reasonable movement of traffic.
- id: 157
  category: sharing_the_road
  question: Under the Massachusetts 'Move Over Law,' what must a driver do when approaching
    a stationary emergency vehicle with flashing lights on a highway with at least
    three lanes?
  choices:
    A: Stop completely until signaled to proceed
    B: Maintain speed but honk to alert the emergency workers
    C: Move to a non-adjacent lane if safe to do so, or reduce speed
    D: Speed up to pass the area as quickly as possible
  answer: C
  explanation: The Massachusetts Move Over Law (MGL c.89 § 7C) requires drivers to
    move to a lane that is not next to the emergency vehicle if it is safe to do so.
    If changing lanes is not possible, the driver must reduce speed to a reasonable
    and proper rate.
- id: 158
  category: sharing_the_road
  question: 'In Massachusetts, it is illegal to cut off a bicyclist by turning right
    immediately after passing them. This is commonly known as a:'
  choices:
    A: Right hook
    B: Blind side
    C: T-bone
    D: Dooring
  answer: A
  explanation: A 'right hook' occurs when a motorist passes a cyclist and then immediately
    turns right into the cyclist's path. Massachusetts law specifically prohibits
    this maneuver to protect vulnerable road users.
- id: 159
  category: sharing_the_road
  question: When is a motorist NOT required to stop for a school bus with flashing
    red lights in Massachusetts?
  choices:
    A: When the bus is on the opposite side of a divided highway with a median or
      barrier
    B: When the driver is in a hurry and no children are visible
    C: When the bus is stopped in a school parking lot
    D: A motorist must always stop for a school bus with flashing red lights regardless
      of the road type
  answer: A
  explanation: According to the Massachusetts Driver's Manual, you do not need to
    stop for a school bus with flashing red lights if it is on the other side of a
    divided highway separated by a physical barrier or median strip.
- id: 160
  category: sharing_the_road
  question: In Massachusetts, what is the minimum distance you must maintain when
    following an emergency vehicle responding to an alarm?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Massachusetts law (MGL c.89 § 7A) prohibits drivers from following
    within 300 feet of an emergency vehicle (fire apparatus, police, ambulance) that
    is responding to an alarm.
- id: 161
  category: sharing_the_road
  question: When riding a bicycle at night in Massachusetts, the bicycle must be equipped
    with a front light visible from at least ____ feet and a rear red light or reflector
    visible from at least ____ feet.
  choices:
    A: 100; 200
    B: 500; 600
    C: 200; 300
    D: 1,000; 1,000
  answer: B
  explanation: Massachusetts law (MGL c.85 § 11B) requires that for night riding,
    a bicycle must have a white front light visible from 500 feet and a red rear light
    or reflector visible from 600 feet.
- id: 162
  category: sharing_the_road
  question: What must a driver do when approaching a pedestrian with a white cane
    or a guide dog in Massachusetts?
  choices:
    A: Honk to let them know you are there
    B: Slow down and proceed with caution if they are not in the road
    C: Come to a complete stop
    D: Only stop if the pedestrian is in a marked crosswalk
  answer: C
  explanation: Massachusetts law (MGL c.90 § 14A) requires motorists to come to a
    complete stop when approaching a pedestrian who is crossing or attempting to cross
    a way and is guided by a service animal or using a white cane.
- id: 163
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may often:'
  choices:
    A: Stay entirely in the right lane
    B: Swing wide into the left lane to complete the turn
    C: Stop and wait for all traffic to clear before turning
    D: Turn from the left lane only
  answer: B
  explanation: Because of their length, large trucks must often swing wide to the
    left to clear the curb when making a right turn. Motorists should never try to
    squeeze between a turning truck and the curb.
- id: 164
  category: sharing_the_road
  question: 'In Massachusetts, bicyclists are generally allowed to ride on sidewalks
    EXCEPT:'
  choices:
    A: In residential areas
    B: Within a business district where prohibited by local ordinance
    C: After sunset
    D: If they are over the age of 16
  answer: B
  explanation: Under MGL c.85 § 11B, bicyclists may ride on sidewalks outside of business
    districts unless local laws prohibit it. They must always yield to pedestrians
    on sidewalks.
- id: 165
  category: sharing_the_road
  question: When an emergency vehicle with sirens and flashing lights is approaching
    from behind, what is the correct procedure in Massachusetts?
  choices:
    A: Stop immediately in your lane
    B: Speed up to get out of the way
    C: Pull to the right as far as possible and stop
    D: Pull to the left median and stop
  answer: C
  explanation: Massachusetts law requires drivers to pull to the right-hand curb or
    edge of the road, clear of any intersection, and stop until the emergency vehicle
    has passed.
- id: 166
  category: sharing_the_road
  question: According to Massachusetts law, which hand signal is acceptable for a
    bicyclist intending to turn right?
  choices:
    A: Left arm extended upward
    B: Right arm extended horizontally
    C: Either A or B
    D: Left arm extended downward
  answer: C
  explanation: Massachusetts law (MGL c.85 § 11B) allows bicyclists to signal a right
    turn by either extending the left arm upward or by extending the right arm horizontally.
- id: 167
  category: vehicle_information
  question: Under Massachusetts law, when must you turn on your headlights in relation
    to windshield wiper use?
  choices:
    A: Only during heavy downpours
    B: Only if it is also dark outside
    C: Whenever you use your windshield wipers
    D: Only on highways
  answer: C
  explanation: Massachusetts law requires you to turn on your headlights and taillights
    whenever you use your windshield wipers, even in daylight.
- id: 168
  category: vehicle_information
  question: What is the minimum legal tread depth for tires in Massachusetts?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/16 of an inch
  answer: B
  explanation: Tires must have at least 2/32 inches of tread depth in the proper grooves
    and no fabric or cord showing to pass the state safety inspection.
- id: 169
  category: vehicle_information
  question: In Massachusetts, what is the maximum legal tint percentage for side and
    rear windows (aftermarket tint)?
  choices:
    A: 25% light transmission
    B: 30% light transmission
    C: 35% light transmission
    D: 50% light transmission
  answer: C
  explanation: Massachusetts law prohibits aftermarket window tinting that reduces
    total light transmission to less than 35%.
- id: 170
  category: vehicle_information
  question: If you purchase a vehicle in a private sale, within how many days of registration
    must you have it inspected?
  choices:
    A: 3 days
    B: 7 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: In Massachusetts, you must have your vehicle inspected within seven
    days of registering it.
- id: 171
  category: vehicle_information
  question: What does a 'Red R' sticker on a Massachusetts vehicle inspection report
    signify?
  choices:
    A: The vehicle failed the emissions test only
    B: The vehicle failed the safety inspection and is unsafe to drive
    C: The vehicle is registered as a classic car
    D: The vehicle passed but needs minor repairs
  answer: B
  explanation: A 'Red R' sticker indicates a safety failure. The vehicle is considered
    unsafe and should not be driven until the safety defects are repaired.
- id: 172
  category: vehicle_information
  question: 'In Massachusetts, your vehicle''s horn must be loud enough to be heard
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Massachusetts safety standards require a horn that can be heard from
    a distance of 200 feet.
- id: 173
  category: vehicle_information
  question: 'Your vehicle''s rear license plate must be illuminated by a white light
    so that it is visible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 60 feet
    D: 100 feet
  answer: C
  explanation: Massachusetts law requires the rear registration plate to be illuminated
    by a white light so that the characters are visible from a distance of 60 feet.
- id: 174
  category: vehicle_information
  question: When must you use your headlights in Massachusetts, regardless of weather
    conditions?
  choices:
    A: From sunset to sunrise
    B: From 1/2 hour after sunset to 1/2 hour before sunrise
    C: From 1 hour after sunset to 1 hour before sunrise
    D: Only when visibility is less than 100 feet
  answer: B
  explanation: Massachusetts law requires headlights to be on from one-half hour after
    sunset until one-half hour before sunrise.
- id: 175
  category: vehicle_information
  question: In Massachusetts, how many brake lights are required to be functional
    on the rear of a vehicle manufactured after 1967?
  choices:
    A: At least one
    B: At least two
    C: At least three
    D: None, as long as hand signals are used
  answer: B
  explanation: Vehicles manufactured after 1967 must have at least two functional
    red brake lights at the rear of the vehicle.
- id: 176
  category: vehicle_information
  question: If your vehicle fails a safety inspection, you will receive a 'Red R'
    sticker. If it fails for emissions only, what color sticker will you receive?
  choices:
    A: A 'Black R' sticker
    B: A 'Yellow R' sticker
    C: A 'Green R' sticker
    D: No sticker at all
  answer: A
  explanation: A 'Black R' sticker is issued if a vehicle fails the emissions test
    but passes the safety inspection.
- id: 177
  category: vehicle_information
  question: In Massachusetts, what is the maximum legal level of window tinting allowed
    on the side windows to the left and right of the driver?
  choices:
    A: 25% light transmission
    B: 35% light transmission
    C: 50% light transmission
    D: No tint is allowed at all
  answer: B
  explanation: Massachusetts law (540 CMR 4.04) states that after-market window tinting
    must allow at least 35% of light to pass through the glass.
- id: 178
  category: vehicle_information
  question: In Massachusetts, you must switch from high beams to low beams when following
    another vehicle from behind within how many feet?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: You must lower your high beams when following another vehicle within
    200 feet so you do not blind the driver ahead through their mirrors.
- id: 179
  category: vehicle_information
  question: To pass the Massachusetts safety inspection, your foot brake must be able
    to stop the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 15 feet
    B: 30 feet
    C: 50 feet
    D: 80 feet
  answer: B
  explanation: The Massachusetts RMV Driver's Manual states that your foot brake must
    be able to stop your vehicle within 30 feet when you are going 20 mph.
- id: 180
  category: vehicle_information
  question: Which vehicles are generally exempt from the emissions portion of the
    Massachusetts vehicle inspection?
  choices:
    A: Vehicles less than 2 years old
    B: Vehicles more than 15 years old
    C: All diesel vehicles regardless of age
    D: Vehicles driven less than 5,000 miles per year
  answer: B
  explanation: In Massachusetts, most vehicles 15 years old or older are exempt from
    emissions testing but must still pass the annual safety inspection.
- id: 181
  category: vehicle_information
  question: According to Massachusetts equipment regulations, a motor vehicle's horn
    must be audible from a distance of at least how many feet?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Massachusetts law requires every motor vehicle to be equipped with
    a horn in good working order, capable of emitting sound audible under normal conditions
    from a distance of not less than 200 feet.
- id: 182
  category: vehicle_information
  question: What is the Massachusetts requirement for rear-view mirrors on a passenger
    vehicle?
  choices:
    A: Only a driver-side mirror is required
    B: Only an interior center mirror is required
    C: At least one mirror providing a clear view of the highway to the rear is required
    D: Three mirrors (left, right, and center) are mandatory for all vehicles
  answer: C
  explanation: Massachusetts law requires at least one mirror that allows the driver
    to see the highway to the rear. If the rear window is obstructed, side mirrors
    are required.
- id: 183
  category: vehicle_information
  question: Which of the following exhaust system modifications is illegal in Massachusetts?
  choices:
    A: Replacing a muffler with a standard OEM part
    B: Using a muffler cutout or bypass
    C: Installing a chrome exhaust tip
    D: Replacing a catalytic converter with a state-approved version
  answer: B
  explanation: Massachusetts law prohibits the use of a muffler cutout, bypass, or
    similar device that prevents the muffler from operating effectively or increases
    noise levels.
- id: 184
  category: vehicle_information
  question: After registering a vehicle in Massachusetts, how many days do you have
    to get the vehicle inspected?
  choices:
    A: 3 days
    B: 7 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: When you register a vehicle in Massachusetts, you have exactly 7 days
    from the date of registration to get a state inspection.
- id: 185
  category: vehicle_information
  question: Where must the Massachusetts inspection sticker be placed on a vehicle
    with a standard windshield?
  choices:
    A: The upper left corner of the windshield
    B: The lower left corner of the windshield
    C: The lower right corner of the windshield
    D: The upper right corner of the windshield
  answer: C
  explanation: In Massachusetts, the inspection sticker must be placed in the lower
    right-hand corner of the windshield (passenger side).
- id: 186
  category: signs_and_signals
  question: In Massachusetts, what does a flashing red traffic light signify?
  choices:
    A: Slow down and proceed with caution
    B: The same as a stop sign
    C: Yield to oncoming traffic only
    D: The signal is broken; treat it as a four-way stop
  answer: B
  explanation: According to the Massachusetts Driver's Manual, a flashing red light
    means the same as a stop sign. You must come to a complete stop, obey the right-of-way
    laws, and proceed when it is safe.
- id: 187
  category: signs_and_signals
  question: When a traffic signal shows a steady yellow light, what is the correct
    action for a driver in Massachusetts?
  choices:
    A: Speed up to clear the intersection before the red light
    B: Stop immediately, even if you are in the middle of the intersection
    C: Stop if it is safe to do so, as the light is about to turn red
    D: Continue through the intersection at your current speed regardless of location
  answer: C
  explanation: A steady yellow light indicates the signal is changing to red. Massachusetts
    law requires drivers to stop if it is safe to do so. If you are already in the
    intersection, you should continue through cautiously.
- id: 188
  category: signs_and_signals
  question: What is the proper hand signal to indicate a right turn in Massachusetts?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals in Massachusetts, the driver
    should extend their left arm out the window and bend it upward at the elbow.
- id: 189
  category: signs_and_signals
  question: In Massachusetts, what does a steady red arrow signal mean?
  choices:
    A: You may turn in the direction of the arrow after stopping
    B: You must stop and cannot turn in the direction of the arrow
    C: Yield to pedestrians, then turn in the direction of the arrow
    D: The arrow is only a suggestion for lane placement
  answer: B
  explanation: A steady red arrow means you cannot make the movement indicated by
    the arrow. You must stop and remain stopped until a green light or green arrow
    appears.
- id: 190
  category: signs_and_signals
  question: What does a pennant-shaped yellow sign on the left side of the road indicate?
  choices:
    A: School Zone ahead
    B: Yield right-of-way
    C: No Passing Zone
    D: Railroad Crossing
  answer: C
  explanation: A yellow pennant-shaped sign is placed on the left side of the road
    to mark the beginning of a 'No Passing Zone'.
- id: 191
  category: signs_and_signals
  question: What do double solid white lines painted on the pavement indicate in Massachusetts?
  choices:
    A: Crossing the lines is permitted to pass other vehicles
    B: Crossing the lines is prohibited
    C: The road is a one-way street
    D: You are approaching a high-occupancy vehicle (HOV) lane only
  answer: B
  explanation: Double solid white lines separate lanes of traffic going in the same
    direction, and crossing them is prohibited.
- id: 192
  category: signs_and_signals
  question: In Massachusetts, what is the maximum fine for failing to yield to a pedestrian
    in a crosswalk?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Under Massachusetts General Laws, the fine for failing to yield the
    right-of-way to a pedestrian in a crosswalk is $200.
- id: 193
  category: signs_and_signals
  question: What does a pentagon-shaped sign indicate?
  choices:
    A: A construction zone
    B: A school zone or school crossing
    C: A hospital nearby
    D: A pedestrian crossing in a business district
  answer: B
  explanation: A five-sided (pentagon) sign indicates a school zone or a school crossing.
    Drivers must slow down and watch for children.
- id: 194
  category: signs_and_signals
  question: 'A flashing yellow signal at an intersection means:'
  choices:
    A: Stop and wait for the light to turn green
    B: The same as a yield sign
    C: Proceed with caution
    D: Pedestrians have the right of way in all directions
  answer: C
  explanation: A flashing yellow light is a warning to proceed with caution. You do
    not need to stop, but you must be alert and slow down.
- id: 195
  category: signs_and_signals
  question: In Massachusetts, when are you allowed to turn right on a red light?
  choices:
    A: Never; red always means stop and stay
    B: Only if there is a green arrow
    C: After coming to a complete stop and yielding to pedestrians and other traffic,
      unless a 'No Turn on Red' sign is posted
    D: Only between the hours of 10:00 PM and 6:00 AM
  answer: C
  explanation: Massachusetts law allows a right turn on red after a complete stop
    and yielding to traffic/pedestrians, provided there is no sign prohibiting the
    turn.
- id: 196
  category: signs_and_signals
  question: What does a diamond-shaped orange sign signify?
  choices:
    A: Regulatory information
    B: Construction or maintenance warning
    C: State park or recreation area
    D: Directional guidance to a highway
  answer: B
  explanation: Orange diamond-shaped signs are used to warn drivers of construction,
    maintenance, or utility operations on or near the road.
- id: 197
  category: signs_and_signals
  question: What is the proper hand signal for slowing down or stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward with palm facing backward
    D: Right arm extended downward
  answer: C
  explanation: To signal that you are slowing down or stopping, extend your left arm
    downward with your palm facing the drivers behind you.
- id: 198
  category: signs_and_signals
  question: What do broken white lines on a multi-lane highway indicate?
  choices:
    A: Traffic is moving in opposite directions
    B: Traffic is moving in the same direction and lane changes are permitted
    C: The edge of the roadway
    D: A restricted lane for buses only
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    You may cross these lines to change lanes when it is safe to do so.
- id: 199
  category: signs_and_signals
  question: In Massachusetts, what is the correct procedure for turning right at a
    red light?
  choices:
    A: You may never turn right on a red light.
    B: You may turn right after slowing down, provided there is no 'No Turn on Red'
      sign.
    C: You must come to a complete stop, yield to pedestrians and other traffic, and
      may then turn if there is no sign prohibiting it.
    D: You may turn right only if there is a green arrow accompanying the red light.
  answer: C
  explanation: According to the Massachusetts Driver's Manual, you can make a right
    turn on red after coming to a complete stop and yielding to pedestrians and other
    vehicles, unless a sign is posted prohibiting the turn.
- id: 200
  category: signs_and_signals
  question: Under Massachusetts law, when is a left turn on a red light permitted?
  choices:
    A: Never.
    B: Only when turning from a one-way street onto another one-way street.
    C: Only when turning from a two-way street onto a one-way street.
    D: At any intersection where there is no 'No Turn on Red' sign.
  answer: B
  explanation: In Massachusetts, you may turn left on red only when turning from a
    one-way street onto another one-way street, after coming to a complete stop and
    yielding to traffic and pedestrians.
- id: 201
  category: signs_and_signals
  question: Which hand signal is the correct way to indicate a right turn?
  choices:
    A: Left arm extended straight out the window.
    B: Left arm extended out and bent upward at the elbow.
    C: Left arm extended out and bent downward at the elbow.
    D: Right arm extended straight out the window.
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at the elbow.
- id: 202
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the road signify in
    Massachusetts?
  choices:
    A: Passing is allowed from either side.
    B: Passing is allowed only on the right.
    C: Passing is prohibited in both directions.
    D: The road is one-way only.
  answer: C
  explanation: Double solid yellow lines mean that passing is prohibited for traffic
    in both directions.
- id: 203
  category: signs_and_signals
  question: 'In Massachusetts, a white diamond symbol painted on the pavement indicates:'
  choices:
    A: A pedestrian crossing ahead.
    B: A high-occupancy vehicle (HOV) lane or restricted lane.
    C: A railroad crossing ahead.
    D: A school zone.
  answer: B
  explanation: The diamond symbol on the pavement marks restricted lanes, such as
    HOV lanes for buses and carpools, or bicycle lanes.
- id: 204
  category: signs_and_signals
  question: What shape is a standard 'No Passing Zone' sign in Massachusetts?
  choices:
    A: Diamond
    B: Rectangle
    C: Pennant
    D: Circle
  answer: C
  explanation: A 'No Passing Zone' sign is pennant-shaped (an isosceles triangle pointing
    right) and is placed on the left side of the road at the beginning of the zone.
- id: 205
  category: signs_and_signals
  question: A pentagon-shaped (five-sided) sign indicates which of the following?
  choices:
    A: A construction zone.
    B: A school zone or school crossing.
    C: A hospital zone.
    D: A public park.
  answer: B
  explanation: A five-sided pentagon sign is used exclusively to warn drivers that
    they are entering a school zone or approaching a school crossing.
- id: 206
  category: signs_and_signals
  question: If you are approaching an intersection with a steady red light and a steady
    green arrow pointing left, what are you allowed to do?
  choices:
    A: You must stop and wait for the circular green light.
    B: You may turn left, as the green arrow provides a 'protected' turn.
    C: You may turn left only after coming to a complete stop.
    D: You may go straight or turn left.
  answer: B
  explanation: A green arrow means you have a 'protected' turn in the direction of
    the arrow. You may proceed in that direction, but you must still yield to pedestrians
    or vehicles already in the intersection.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 207
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 208
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 209
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 210
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 211
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 212
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 213
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 214
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 215
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 216
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 217
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 218
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 219
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 220
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 221
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 222
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 223
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 224
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 225
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 226
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 227
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 228
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 229
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 230
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 231
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 232
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
