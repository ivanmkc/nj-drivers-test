metadata:
  source: 2025 Alaska Driver's Manual
  total_questions: 246
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What is the minimum age to apply for an Instruction Permit in the state
    of Alaska?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: A
  explanation: In Alaska, an individual may apply for an Instruction Permit at the
    age of 14.
- id: 2
  category: license_system
  question: While driving with an Instruction Permit in Alaska, the supervising driver
    must be at least 21 years of age and have how much driving experience?
  choices:
    A: At least 6 months
    B: At least 1 year
    C: At least 2 years
    D: At least 5 years
  answer: B
  explanation: The person accompanying a permit holder must be at least 21 years old
    and have at least one year of licensed driving experience for the type of vehicle
    being driven.
- id: 3
  category: license_system
  question: An Alaska Instruction Permit is generally valid for what length of time?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: Until the applicant turns 18
  answer: B
  explanation: An Alaska Instruction Permit is valid for two years from the date of
    issue.
- id: 4
  category: license_system
  question: Under Alaska's Graduated Driver License (GDL) law, for how long must a
    teen hold an Instruction Permit before they can apply for a Provisional License?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 1 year
  answer: B
  explanation: A person under 18 must have held an Instruction Permit for at least
    six months before applying for a Provisional License.
- id: 5
  category: license_system
  question: What are the nighttime driving restrictions for an Alaska Provisional
    License holder?
  choices:
    A: No driving between 10:00 PM and 4:00 AM
    B: No driving between 11:00 PM and 5:00 AM
    C: No driving between 12:00 AM and 6:00 AM
    D: No driving between 1:00 AM and 5:00 AM
  answer: D
  explanation: A Provisional License holder in Alaska may not drive between 1:00 AM
    and 5:00 AM unless they are accompanied by a parent/guardian or driving for employment.
- id: 6
  category: license_system
  question: During the first six months of holding an Alaska Provisional License,
    who is allowed to be a passenger in the vehicle?
  choices:
    A: Any number of friends under age 21
    B: Only family members and one friend
    C: Only passengers 21 years of age or older, or siblings
    D: Only passengers over 18 years of age
  answer: C
  explanation: For the first six months, a provisional licensee may not carry passengers
    under 21, except for siblings, unless accompanied by a parent, legal guardian,
    or person at least 21 years old.
- id: 7
  category: license_system
  question: If you change your name or address in Alaska, you must notify the DMV
    within how many days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Alaska law requires you to notify the DMV of a name or address change
    within 30 days.
- id: 8
  category: license_system
  question: In Alaska, your driver's license will be suspended if you accumulate how
    many points within a 12-month period?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: The DMV will suspend your license if you accumulate 12 points in 12
    months or 18 points in 24 months.
- id: 9
  category: license_system
  question: How many points can be deducted from your Alaska driving record by completing
    an approved defensive driving course?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: Completion of an approved defensive driving course can result in a
    2-point reduction on your driving record, but this can only be used once every
    12 months.
- id: 10
  category: license_system
  question: What is the minimum amount of liability insurance coverage required in
    Alaska for property damage in a single accident?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Alaska law requires minimum liability insurance of $50,000 for bodily
    injury/death of one person, $100,000 for bodily injury/death of two or more, and
    $25,000 for property damage.
- id: 11
  category: license_system
  question: A standard Alaska driver's license is typically valid for how many years
    before it expires?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: Most Alaska driver's licenses are issued for a period of eight years
    and expire on the person's birthday.
- id: 12
  category: license_system
  question: In Alaska, if you are involved in a collision resulting in more than $501
    of property damage, you must file a report with the DMV within how many days?
  choices:
    A: 2 days
    B: 5 days
    C: 10 days
    D: 15 days
  answer: D
  explanation: You must file a Certificate of Insurance (Form 12-209) with the DMV
    within 15 days of an accident involving injury, death, or property damage exceeding
    $501.
- id: 13
  category: license_system
  question: 'To pass the vision screening for an Alaska driver''s license, your vision
    must be at least:'
  choices:
    A: 20/20 in both eyes
    B: 20/40 in at least one eye
    C: 20/50 in both eyes
    D: 20/70 in at least one eye
  answer: B
  explanation: Applicants must have at least 20/40 vision in at least one eye to pass
    the Alaska DMV vision screening without restrictions.
- id: 14
  category: license_system
  question: Which of the following is a requirement to obtain a motorcycle permit
    in Alaska?
  choices:
    A: Must be at least 14 years old
    B: Must have a parent's signature if under 18
    C: Must pass a written knowledge test
    D: All of the above
  answer: D
  explanation: To get a motorcycle permit (M1, M2, or M3), you must be at least 14,
    have parental consent if under 18, and pass the specific motorcycle knowledge
    test.
- id: 15
  category: license_system
  question: To obtain a REAL ID-compliant license in Alaska, how many documents proving
    Alaska residency must you provide?
  choices:
    A: One document
    B: Two documents
    C: Three documents
    D: Four documents
  answer: B
  explanation: According to the Alaska DMV, applicants for a REAL ID must provide
    two documents proving their physical Alaska residency, such as utility bills or
    rental agreements.
- id: 16
  category: license_system
  question: If you are moving to Alaska from another state and have a valid out-of-state
    driver's license, you must obtain an Alaska license within how many days of becoming
    a resident?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Alaska law requires new residents to transfer their out-of-state driver's
    license to an Alaska license within 90 days of establishing residency.
- id: 17
  category: license_system
  question: 'A person with a standard Class D license in Alaska is authorized to drive
    a vehicle with a Gross Vehicle Weight Rating (GVWR) of less than:'
  choices:
    A: 10,001 lbs
    B: 15,001 lbs
    C: 26,001 lbs
    D: 32,001 lbs
  answer: C
  explanation: An Alaska Class D license is for non-commercial vehicles with a GVWR
    of less than 26,001 lbs, provided they are not designed to transport more than
    15 passengers or hazardous materials.
- id: 18
  category: license_system
  question: 'In Alaska, if a parent or guardian who signed a minor''s application
    for a license decides they no longer want to be responsible for the minor''s driving,
    they can:'
  choices:
    A: Only wait until the minor turns 18
    B: Request in writing that the license be cancelled
    C: Verbally tell a police officer to take the license
    D: Nothing; the signature is permanent until the license expires
  answer: B
  explanation: Under Alaska Statute 28.15.071, the person who signed the minor's application
    may file a written request to the DMV to cancel the license, which relieves them
    of future liability.
- id: 19
  category: license_system
  question: What is the minimum age to apply for a Commercial Driver License (CDL)
    for intrastate (within Alaska only) commerce?
  choices:
    A: 16 years old
    B: 18 years old
    C: 19 years old
    D: 21 years old
  answer: C
  explanation: In Alaska, you must be at least 19 years old to obtain a CDL for intrastate
    commerce. You must be 21 for interstate commerce.
- id: 20
  category: license_system
  question: For an Alaska driver under age 18, if they are convicted of a first-time
    'minor consuming alcohol' offense, for how long will their driving privilege be
    revoked?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Alaska Statute 28.15.183 mandates a 90-day revocation of driving privileges
    for a first-time conviction of a minor consuming or possessing alcohol.
- id: 21
  category: license_system
  question: How many points are assessed against your Alaska driving record for 'Speeding
    in a school zone or playground crosswalk'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Alaska's point system assigns 6 points for speeding in a school zone
    or playground crosswalk, which is higher than standard speeding violations.
- id: 22
  category: license_system
  question: If your Alaska driver's license is suspended due to the point system,
    what is the standard reinstatement fee you must pay after the suspension period
    ends?
  choices:
    A: No fee
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: The Alaska DMV requires a $100 reinstatement fee for licenses suspended
    due to the accumulation of points.
- id: 23
  category: license_system
  question: 'Active duty military personnel who have an Alaska driver''s license that
    expires while they are serving outside the state:'
  choices:
    A: Must renew it online immediately
    B: Must return to Alaska to renew it
    C: The license remains valid until 90 days after discharge or return to Alaska
    D: The license is permanently cancelled after 1 year of expiration
  answer: C
  explanation: Alaska law provides that licenses for active duty military members
    remain valid while they are out of state and for 90 days after their discharge
    or return to the state.
- id: 24
  category: license_system
  question: In Alaska, how many points are deducted from your driving record for every
    12 consecutive months of violation-free driving?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: All points are removed
  answer: B
  explanation: The Alaska DMV deducts 2 points from a driver's record for every 12-month
    period they drive without receiving any new traffic convictions.
- id: 25
  category: license_system
  question: To obtain a school bus endorsement (S) in Alaska, an applicant must be
    at least what age?
  choices:
    A: 18 years old
    B: 19 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: Alaska requires school bus drivers to be at least 21 years of age to
    qualify for the school bus endorsement.
- id: 26
  category: license_system
  question: 'If you are under 21 and are convicted of a second ''minor consuming alcohol''
    offense, your Alaska license will be revoked for:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Under Alaska Statute 28.15.183, a second conviction for a minor consuming
    alcohol results in a 1-year revocation of driving privileges.
- id: 27
  category: license_system
  question: To renew an Alaska driver's license online, the applicant must be within
    which age range?
  choices:
    A: 16 to 65
    B: 21 to 70
    C: 22 to 68
    D: 18 to 80
  answer: C
  explanation: Alaska DMV regulations state that online renewals are only available
    to drivers between the ages of 22 and 68.
- id: 28
  category: license_system
  question: In Alaska, what is the minimum age to apply for a state-issued identification
    card?
  choices:
    A: No minimum age
    B: 14 years old
    C: 16 years old
    D: 18 years old
  answer: A
  explanation: There is no minimum age requirement to obtain an Alaska State Identification
    card, though a parent or guardian must sign for a minor.
- id: 29
  category: license_system
  question: If an Alaska driver's license is revoked for a DUI, what must the driver
    provide to the DMV to reinstate their license?
  choices:
    A: A letter of apology
    B: Proof of financial responsibility (SR-22 insurance)
    C: A new birth certificate
    D: Proof of 100 hours of community service
  answer: B
  explanation: Drivers reinstating a license after a DUI revocation in Alaska must
    provide proof of SR-22 insurance (financial responsibility) for a specified period,
    usually 3 to 5 years.
- id: 30
  category: driver_testing
  question: To pass the Alaska written knowledge test, what is the minimum passing
    score required?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: The Alaska DMV knowledge test consists of 20 questions, and applicants
    must answer at least 16 correctly (80%) to pass.
- id: 31
  category: driver_testing
  question: When taking the Alaska road test, which of the following must be provided
    for the vehicle being used?
  choices:
    A: Proof of a recent oil change
    B: A notarized letter from the vehicle manufacturer
    C: Current registration and proof of insurance
    D: A full tank of premium gasoline
  answer: C
  explanation: For the road test, the applicant must provide a vehicle that is properly
    registered and insured, and it must pass a basic equipment safety check.
- id: 32
  category: driver_testing
  question: Under Alaska's 'Implied Consent' law, by driving a motor vehicle, you
    have agreed to what?
  choices:
    A: Always carry a passenger
    B: A chemical test of your breath or blood for alcohol or drugs
    C: Allow any police officer to search your home
    D: Pay a mandatory annual driving tax
  answer: B
  explanation: Alaska's Implied Consent law means that by operating a vehicle, you
    consent to a chemical test of your breath, blood, or urine if lawfully arrested
    for driving under the influence.
- id: 33
  category: driver_testing
  question: In Alaska, it is illegal to park a vehicle within how many feet of a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: According to Alaska driving regulations, you may not park within 15
    feet of a fire hydrant.
- id: 34
  category: driver_testing
  question: 'Alaska law requires headlights to be turned on when visibility is reduced
    to less than:'
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: B
  explanation: Headlights must be used in Alaska whenever visibility is less than
    1,000 feet due to weather or lighting conditions.
- id: 35
  category: driver_testing
  question: For drivers living south of 60 degrees North Latitude (e.g., Juneau, Anchorage),
    between which dates are studded tires generally permitted?
  choices:
    A: October 1 to April 1
    B: September 15 to May 1
    C: September 15 to April 15
    D: November 1 to March 31
  answer: C
  explanation: In Alaska, south of 60 degrees North Latitude, studded tires are legal
    from September 15 through April 15. North of 60 degrees, they are legal until
    May 1.
- id: 36
  category: driver_testing
  question: What is the correct hand signal to indicate that you are slowing down
    or stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, the driver
    should extend their left arm out the window and point it downward.
- id: 37
  category: driver_testing
  question: In Alaska, what is the penalty for speeding in a designated highway work
    zone or traffic safety corridor?
  choices:
    A: A flat $500 fine
    B: Double the normal fine
    C: Triple the normal fine
    D: Automatic 30-day license suspension
  answer: B
  explanation: Alaska law mandates that fines for traffic violations are doubled when
    committed in a designated highway work zone or a traffic safety corridor.
- id: 38
  category: driver_testing
  question: The Alaska Driver Manual recommends a following distance of at least how
    many seconds behind the vehicle in front of you under ideal conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: While many states use a 2 or 3-second rule, the Alaska Driver Manual
    recommends a 4-second following distance to allow for better reaction time, especially
    given potential road hazards.
- id: 39
  category: driver_testing
  question: What is the mandatory minimum jail sentence for a first-time DUI conviction
    in the state of Alaska?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 10 days
  answer: C
  explanation: In Alaska, a first-time DUI conviction carries a mandatory minimum
    sentence of 72 consecutive hours in jail.
- id: 40
  category: driver_testing
  question: 'When approaching a stationary emergency vehicle with its lights flashing
    on a multi-lane highway, Alaska''s ''Move Over'' law requires you to:'
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk your horn
    C: Vacate the lane closest to the emergency vehicle if safe to do so
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: Alaska's Move Over law requires drivers to shift to a non-adjacent
    lane or slow down significantly if changing lanes is unsafe when passing emergency
    vehicles on the side of the road.
- id: 41
  category: driver_testing
  question: When entering a roundabout in Alaska, who has the right-of-way?
  choices:
    A: Traffic entering the roundabout
    B: Traffic already in the roundabout
    C: The vehicle traveling at the highest speed
    D: The vehicle entering from the right
  answer: B
  explanation: Drivers entering a roundabout must yield the right-of-way to traffic
    already circulating within the intersection.
- id: 42
  category: driver_testing
  question: 'In Alaska, you must dim your high-beam headlights when following another
    vehicle within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Alaska law requires drivers to dim high beams when approaching an oncoming
    vehicle within 500 feet or when following another vehicle within 300 feet.
- id: 43
  category: driver_testing
  question: In Alaska, what is the default speed limit in a business district unless
    otherwise posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: According to the Alaska Driver Manual, the speed limit in a business
    district is 20 mph unless signs indicate otherwise.
- id: 44
  category: driver_testing
  question: When parking your vehicle near a fire hydrant in Alaska, what is the minimum
    required distance you must maintain?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Alaska law prohibits parking within 15 feet of a fire hydrant.
- id: 45
  category: driver_testing
  question: In Alaska, you must signal your intention to turn at least how many feet
    before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: The Alaska Driver Manual states that you must give a continuous turn
    signal for at least 100 feet before turning.
- id: 46
  category: driver_testing
  question: Under Alaska law, when are you required to have your headlights turned
    on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From a half hour after sunset to a half hour before sunrise
    D: Only when visibility is less than 1,000 feet
  answer: C
  explanation: Alaska law requires headlights to be on from a half hour after sunset
    to a half hour before sunrise, or any time visibility is less than 1,000 feet.
- id: 47
  category: driver_testing
  question: In Alaska, what is the minimum required liability insurance coverage for
    the death or injury of two or more people in any one accident?
  choices:
    A: $25,000
    B: $50,000
    C: $100,000
    D: $150,000
  answer: C
  explanation: Alaska's mandatory insurance law requires '50/100/25' coverage, meaning
    $100,000 for the death or injury of two or more people in one accident.
- id: 48
  category: driver_testing
  question: According to the Alaska point system, how many points are assessed for
    a conviction of 'Reckless Driving'?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 10 points
  answer: D
  explanation: Reckless driving is a major violation in Alaska and results in 10 points
    being added to your driving record.
- id: 49
  category: driver_testing
  question: In Alaska, you may not park your vehicle within how many feet of a stop
    sign, flashing beacon, or yield sign?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Alaska law prohibits parking within 30 feet of any flashing beacon,
    stop sign, or yield sign located at the side of a roadway.
- id: 50
  category: driver_testing
  question: For drivers age 21 or older in Alaska, it is illegal to drive with a Blood
    Alcohol Concentration (BAC) of ____ or higher.
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In Alaska, the legal limit for BAC for drivers 21 and older is 0.08%.
- id: 51
  category: driver_testing
  question: 'When driving on a roadway in Alaska with a speed limit of 45 mph or greater,
    you must dim your high beams when following another vehicle within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: The Alaska Driver Manual states you must dim your headlights when following
    another vehicle within 500 feet.
- id: 52
  category: driver_testing
  question: In areas of Alaska south of 60 degrees North latitude (such as Anchorage
    and Juneau), between which dates are studded tires generally permitted?
  choices:
    A: October 1 to April 15
    B: September 15 to May 1
    C: September 1 to May 15
    D: November 1 to April 1
  answer: B
  explanation: In Alaska, south of 60 degrees North latitude, studded tires are permitted
    from September 15 through May 1.
- id: 53
  category: driver_testing
  question: 'Under Alaska''s ''Implied Consent'' law, if you refuse to take a chemical
    test to determine your BAC, your driver''s license will be:'
  choices:
    A: Suspended for 30 days
    B: Revoked
    C: Marked with a warning
    D: Unchanged unless you are convicted of a DUI
  answer: B
  explanation: By driving in Alaska, you have given consent to a chemical test. Refusal
    results in the immediate seizure and revocation of your driver's license.
- id: 54
  category: driver_testing
  question: 'In Alaska, a child who is under 4 years of age and weighs less than 40
    pounds must be:'
  choices:
    A: In a booster seat
    B: In a federally approved child safety seat
    C: In the front seat with a seatbelt
    D: In the lap of an adult
  answer: B
  explanation: Alaska law requires children under 4 years old who weigh less than
    40 pounds to be properly secured in a child safety seat.
- id: 55
  category: driver_testing
  question: 'When parking on a hill in Alaska with a curb, if you are headed uphill,
    you should turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the right
  answer: B
  explanation: When parking uphill against a curb, turn your wheels away from the
    curb so that if the vehicle rolls, the back of the front tire will hit the curb
    and stop the car.
- id: 56
  category: driver_responsibility
  question: 'If you are caught driving in Alaska without the required liability insurance
    for the first time, your driving privileges will be suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: Under the Mandatory Insurance Act, a first-time offense for driving
    without insurance results in a 90-day driver's license suspension.
- id: 57
  category: driver_responsibility
  question: 'In Alaska, you must immediately notify the local police department or
    Alaska State Troopers of an accident if it involves injury, death, or total property
    damage of at least:'
  choices:
    A: $200
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: Alaska law requires immediate notification to law enforcement for any
    accident involving injury, death, or property damage totaling $500 or more.
- id: 58
  category: driver_responsibility
  question: When selling a vehicle in Alaska, the seller must notify the DMV of the
    transfer of ownership within how many days?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: The seller is required to submit a Notice of Vehicle Transfer to the
    DMV within 10 days of the sale to protect themselves from liability.
- id: 59
  category: driver_responsibility
  question: Under Alaska's 'Implied Consent' law, what is the penalty for a first-time
    refusal to submit to a chemical test of your breath?
  choices:
    A: A $100 fine only
    B: A 30-day license suspension
    C: The same penalties as a DUI conviction, including license revocation
    D: There is no penalty if you are not actually drunk
  answer: C
  explanation: Refusal to submit to a chemical test is a class A misdemeanor in Alaska
    and carries the same mandatory minimum penalties as a DUI conviction.
- id: 60
  category: driver_responsibility
  question: In Alaska, traffic fines are doubled when a violation occurs in which
    of the following areas?
  choices:
    A: School zones and Traffic Safety Corridors
    B: Residential neighborhoods
    C: Parking lots
    D: Gravel roads
  answer: A
  explanation: Fines for moving violations are doubled in designated Highway Safety
    Corridors and active school zones in Alaska.
- id: 61
  category: driver_responsibility
  question: If you are convicted of speeding 15 mph or more over the limit in Alaska,
    how many points will be added to your driving record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Speeding 15 mph or more over the limit results in 6 points. Speeding
    10-14 mph over results in 4 points, and 1-9 mph over results in 2 points.
- id: 62
  category: driver_responsibility
  question: In Alaska, if you are convicted of a DUI, you will be required to use
    an Ignition Interlock Device (IID) for at least how long after your license is
    reinstated?
  choices:
    A: 6 months
    B: The entire duration of your probation
    C: 1 year
    D: 3 months
  answer: B
  explanation: Alaska law requires the installation of an IID for the entire period
    of probation following a DUI conviction.
- id: 63
  category: driver_responsibility
  question: If your Alaska driver's license is revoked for a DUI, you must provide
    proof of financial responsibility (SR-22 insurance) for how many years?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 10 years
  answer: B
  explanation: Following a license revocation for a DUI or similar offense, Alaska
    requires the driver to maintain SR-22 insurance for 3 years.
- id: 64
  category: driver_responsibility
  question: When moving to Alaska, you must register your vehicle within how many
    days of becoming employed or establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: A
  explanation: New residents must register their vehicles in Alaska within 10 days
    of entering the state or becoming employed.
- id: 65
  category: driver_responsibility
  question: How many points are added to your Alaska driving record for failing to
    stop for a school bus that has its red lights flashing and stop arm extended?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Illegally passing a stopped school bus with red lights flashing is
    a serious violation in Alaska and carries a 6-point penalty.
- id: 66
  category: driver_responsibility
  question: In Alaska, a driver's license is considered 'at risk' of suspension when
    a driver accumulates how many points within a 24-month period?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 18 points
  answer: D
  explanation: The DMV will suspend your license if you accumulate 12 points in 12
    months or 18 points in 24 months.
- id: 67
  category: driver_responsibility
  question: In Alaska, how many points are assessed against your driving record for
    a conviction of 'Reckless Driving'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Reckless driving is a major violation in Alaska and results in 6 points
    being added to the driver's record.
- id: 68
  category: driver_responsibility
  question: At what point level will the Alaska DMV send you an official warning letter
    regarding your driving record?
  choices:
    A: When you accumulate 6 points in 12 months
    B: When you accumulate 3 points in 6 months
    C: When you accumulate 12 points in 24 months
    D: After your first speeding ticket
  answer: A
  explanation: The Alaska DMV sends a warning letter to drivers who accumulate 6 points
    in a 12-month period or 9 points in a 24-month period.
- id: 69
  category: driver_responsibility
  question: In Alaska, if you are caught driving a motor vehicle without the required
    liability insurance, what is the penalty for a first offense?
  choices:
    A: A $50 fine only
    B: A mandatory 90-day driver's license suspension
    C: Impoundment of the vehicle for one year
    D: Permanent revocation of the driver's license
  answer: B
  explanation: Driving without the mandatory liability insurance in Alaska results
    in a mandatory 90-day suspension of your driver's license for a first offense.
- id: 70
  category: driver_responsibility
  question: How often must vehicle registration be renewed for most standard passenger
    vehicles in Alaska?
  choices:
    A: Every year
    B: Every two years
    C: Every five years
    D: Only when the vehicle changes ownership
  answer: B
  explanation: Alaska vehicle registrations are generally biennial, meaning they must
    be renewed every two years.
- id: 71
  category: driver_responsibility
  question: When purchasing a vehicle in Alaska, the buyer must apply for a new title
    and registration within how many days of the purchase?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The buyer of a vehicle must apply for a transfer of title and registration
    within 30 days of the date of sale.
- id: 72
  category: driver_responsibility
  question: In Alaska, how many points are added to your record for speeding 15 miles
    per hour or more over the posted limit?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Speeding 15 mph or more over the limit results in 6 points on an Alaska
    driving record. (3-9 mph over is 2 points; 10-14 mph over is 4 points).
- id: 73
  category: driver_responsibility
  question: If your license is revoked for a DUI in Alaska, what must you provide
    to the DMV to have your driving privileges reinstated?
  choices:
    A: Proof of completion of an alcohol education program (ADERE)
    B: A letter of recommendation from a judge
    C: Proof of a new vehicle purchase
    D: A passing score on the commercial driver test
  answer: A
  explanation: To reinstate a license after a DUI, you must complete an Alcohol and
    Drug Education Rehabilitation Information (ADERE) program, pay reinstatement fees,
    and provide proof of financial responsibility (SR-22).
- id: 74
  category: driver_responsibility
  question: 'In Alaska, a driver who is required to file an SR-22 (Proof of Financial
    Responsibility) must generally maintain it for a period of:'
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: 10 years
  answer: C
  explanation: An SR-22 is typically required to be kept on file with the DMV for
    three years following a conviction that triggers the requirement.
- id: 75
  category: driver_responsibility
  question: In Alaska, which vehicles are eligible for 'Permanent Registration,' meaning
    the registration does not expire as long as the owner stays the same?
  choices:
    A: Vehicles that are 8 years old or older
    B: Only electric vehicles
    C: Any vehicle owned by a person over age 65
    D: Vehicles used only for farming
  answer: A
  explanation: In Alaska, owners of vehicles that are 8 years old or older may elect
    to have a permanent registration that does not require biennial renewal.
- id: 76
  category: driver_responsibility
  question: If you are involved in an accident in Alaska and do not have the required
    insurance, your license will be suspended for how long?
  choices:
    A: 30 days
    B: 6 months
    C: Up to 3 years
    D: Until you pay a $1,000 fine
  answer: C
  explanation: If you are in an accident and uninsured, your license can be suspended
    for up to three years or until you provide proof of financial responsibility and
    meet other requirements.
- id: 77
  category: driver_responsibility
  question: Where are there specific areas in Alaska where motor vehicle insurance
    is NOT mandatory?
  choices:
    A: In the city of Anchorage
    B: In areas where vehicle registration is not required
    C: On all private property throughout the state
    D: Insurance is mandatory everywhere in Alaska without exception
  answer: B
  explanation: In Alaska, mandatory insurance is required in areas where registration
    is required. In remote areas where registration is not required, insurance is
    also not legally mandated.
- id: 78
  category: safe_driving_rules
  question: What is the minimum distance you must park from a stop sign, flashing
    beacon, or yield sign in Alaska?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Alaska regulations state you may not park within 30 feet of any flashing
    beacon, stop sign, or yield sign located at the side of a roadway.
- id: 79
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in an alley in Alaska?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The default speed limit for any alley in Alaska is 15 mph unless signs
    indicate otherwise.
- id: 80
  category: safe_driving_rules
  question: Under Alaska law, when is it legal to pass another vehicle on the right?
  choices:
    A: When the vehicle ahead is making or about to make a left turn and there is
      a paved shoulder
    B: Whenever you are in a hurry and the left lane is blocked
    C: Only on gravel roads with multiple lanes
    D: It is never legal to pass on the right in Alaska
  answer: A
  explanation: In Alaska, you may pass on the right only when the vehicle overtaken
    is making or about to make a left turn, or upon a street or highway with unobstructed
    pavement not occupied by parked vehicles and of sufficient width for two or more
    lines of moving vehicles in each direction.
- id: 81
  category: safe_driving_rules
  question: 'In Alaska, you do NOT have to stop for a school bus with its red lights
    flashing and stop arm extended if:'
  choices:
    A: You are traveling in the opposite direction on a highway with two or more lanes
    B: You are traveling in the opposite direction on a divided highway with a physical
      barrier or median
    C: The bus is stopped in a school zone
    D: You are traveling at least 10 mph below the speed limit
  answer: B
  explanation: Drivers traveling in the opposite direction on a divided highway with
    a physical barrier (like a median or ditch) are not required to stop for a school
    bus in Alaska.
- id: 82
  category: safe_driving_rules
  question: How many feet must you park away from a crosswalk at an intersection in
    Alaska?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: C
  explanation: Alaska law prohibits parking within 20 feet of a crosswalk at an intersection.
- id: 83
  category: safe_driving_rules
  question: When using hand signals to indicate a turn, which position represents
    a right turn in Alaska?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: B
  explanation: The standard hand signal for a right turn is the left arm and hand
    extended upward.
- id: 84
  category: safe_driving_rules
  question: At an uncontrolled T-intersection in Alaska, who has the right-of-way?
  choices:
    A: The driver on the terminating road
    B: The driver on the through road
    C: The driver who arrives first
    D: The driver on the left
  answer: B
  explanation: At a T-intersection where there are no traffic control devices, the
    driver on the terminating road must yield the right-of-way to vehicles on the
    through road.
- id: 85
  category: safe_driving_rules
  question: In Alaska, you may not park within how many feet of a fire station entrance
    on the same side of the street?
  choices:
    A: 15 feet
    B: 20 feet
    C: 50 feet
    D: 75 feet
  answer: B
  explanation: Alaska law prohibits parking within 20 feet of the driveway entrance
    to any fire station.
- id: 86
  category: safe_driving_rules
  question: 'In Alaska, U-turns are prohibited on a curve or hill where the vehicle
    cannot be seen by other drivers approaching from either direction within:'
  choices:
    A: 500 feet
    B: 750 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: According to the Alaska Driver Manual, you may not make a U-turn on
    a curve or near the crest of a hill where your vehicle cannot be seen by other
    drivers within 1,000 feet.
- id: 87
  category: safe_driving_rules
  question: Under Alaska's 'Move Over Law,' what must you do when approaching an emergency
    vehicle with flashing lights stopped on the side of a multi-lane highway?
  choices:
    A: Stop completely until signaled to pass
    B: Maintain speed but honk your horn
    C: Move to the left lane if safe to do so, or slow down significantly
    D: Speed up to pass the area quickly
  answer: C
  explanation: Alaska law requires drivers to vacate the lane closest to a stationary
    emergency vehicle or slow down to a speed that is reasonable and prudent if changing
    lanes is unsafe.
- id: 88
  category: safe_driving_rules
  question: In Alaska, if you are driving a slow-moving vehicle on a two-lane highway
    and a line of traffic forms behind you, you must pull over when there are how
    many vehicles behind you?
  choices:
    A: 3 or more
    B: 5 or more
    C: 7 or more
    D: 10 or more
  answer: B
  explanation: Alaska Statute 28.35.140 requires slow-moving vehicles to pull off
    the roadway at the first safe opportunity if 5 or more vehicles are formed in
    a line behind them.
- id: 89
  category: safe_driving_rules
  question: What is the unposted speed limit in an Alaska residential area?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: The default speed limit for residential areas in Alaska is 25 mph unless
    otherwise posted.
- id: 90
  category: safe_driving_rules
  question: When parking near a stop sign, flashing beacon, or traffic control signal
    in Alaska, you must be at least how many feet away?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Alaska law prohibits parking within 30 feet of any flashing beacon,
    stop sign, or traffic control signal located at the side of a roadway.
- id: 91
  category: safe_driving_rules
  question: 'In Alaska, you must turn on your headlights if visibility is reduced
    to less than:'
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: B
  explanation: Headlights must be used in Alaska when there is not enough light to
    see clearly at a distance of 1,000 feet.
- id: 92
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane road in Alaska, you must return
    to your lane before coming within how many feet of an oncoming vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: You must complete a pass and return to your lane before coming within
    200 feet of any vehicle approaching from the opposite direction.
- id: 93
  category: safe_driving_rules
  question: 'When entering a roundabout (traffic circle) in Alaska, you must yield
    the right-of-way to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one, you have the right of way
    D: Only emergency vehicles
  answer: B
  explanation: Drivers entering a roundabout must yield to the traffic already circulating
    within the circle.
- id: 94
  category: safe_driving_rules
  question: 'When driving in heavy fog or snow in Alaska, you should use:'
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Emergency flashers
  answer: B
  explanation: Low beams should be used in fog or snow because high beams reflect
    off the moisture/ice crystals, causing glare and reducing visibility.
- id: 95
  category: defensive_driving
  question: According to the Alaska Driver's Manual, what is the recommended following
    distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: The Alaska Driver's Manual recommends a four-second following distance
    to allow enough time to react to hazards or sudden stops.
- id: 96
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, how far ahead
    should you scan the road while driving in Alaska?
  choices:
    A: 5 to 8 seconds
    B: 12 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: Drivers should scan the road 12 to 15 seconds ahead to identify potential
    hazards early and plan their responses.
- id: 97
  category: defensive_driving
  question: In Alaska, if you are driving on a highway and five or more vehicles are
    trailing behind you because of your slow speed, what are you required to do?
  choices:
    A: Speed up to the posted limit immediately
    B: Turn on your hazard lights and continue
    C: Pull over at the first safe turnout to let them pass
    D: Maintain your speed and stay in the center of the lane
  answer: C
  explanation: Alaska law requires slow-moving vehicles to pull off the roadway at
    the first safe turnout if five or more vehicles are formed in a line behind them.
- id: 98
  category: defensive_driving
  question: When driving at night in Alaska, you must dim your high-beam headlights
    when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Alaska law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet to avoid blinding the other driver.
- id: 99
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet Alaska roadway, what is
    the best defensive driving action to take?
  choices:
    A: Brake hard to regain traction
    B: Turn the steering wheel sharply to the right
    C: Ease your foot off the gas pedal and keep the steering wheel straight
    D: Shift the car into neutral and pump the brakes
  answer: C
  explanation: If hydroplaning, you should take your foot off the gas and steer straight.
    Do not brake or turn suddenly, as this can cause a skid.
- id: 100
  category: defensive_driving
  question: When driving in heavy fog in Alaska, which lights should you use to maintain
    the best visibility?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Hazard flashers
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the fog and
    create glare, making it harder to see.
- id: 101
  category: defensive_driving
  question: If you encounter a moose on or near an Alaska roadway, what is the safest
    defensive driving practice?
  choices:
    A: Honk your horn continuously to scare it away
    B: Speed up to pass it before it moves into your lane
    C: Slow down, stay alert, and be prepared to stop
    D: Flash your high beams to blind the animal so it freezes
  answer: C
  explanation: Moose are unpredictable. If you see one, slow down and be prepared
    to stop, as they may suddenly bolt into the road.
- id: 102
  category: defensive_driving
  question: What is the correct way to use Anti-lock Braking Systems (ABS) during
    an emergency stop on a slippery Alaska road?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Lightly tap the brakes until you stop
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. The system will automatically
    'pump' the brakes for you to prevent lock-up.
- id: 103
  category: defensive_driving
  question: If your rear wheels start to skid on an icy Alaska road, which way should
    you turn your steering wheel?
  choices:
    A: In the opposite direction of the skid
    B: In the direction the rear of the vehicle is skidding
    C: Keep it perfectly straight until the car stops
    D: Turn sharply toward the shoulder of the road
  answer: B
  explanation: To recover from a skid, steer in the direction the rear of the vehicle
    is sliding. This helps realign the front wheels with the back wheels.
- id: 104
  category: defensive_driving
  question: When driving in winter conditions in Alaska, why is it dangerous to use
    cruise control?
  choices:
    A: It uses more fuel in cold weather
    B: It can cause the wheels to spin and lose traction on slippery surfaces
    C: It disables the vehicle's heater
    D: It is illegal to use cruise control in Alaska during winter months
  answer: B
  explanation: Cruise control can be dangerous on icy or wet roads because it may
    attempt to maintain speed by spinning the wheels, leading to a loss of control.
- id: 105
  category: defensive_driving
  question: When driving a vehicle equipped with Anti-lock Braking System (ABS) on
    icy Alaska roads, how should you apply the brakes in an emergency?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure and do not let up
    C: Lightly tap the brakes to avoid locking
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. The system will automatically
    pump the brakes for you to prevent locking. Pumping them manually overrides the
    system.
- id: 106
  category: defensive_driving
  question: In Alaska, what is the legal classification for a driver caught 'texting
    while driving' (reading or typing a text-based communication)?
  choices:
    A: A minor traffic infraction
    B: A Class A Misdemeanor
    C: A non-moving violation
    D: A felony in all instances
  answer: B
  explanation: Under Alaska Statute 28.35.161, driving while a screen device is in
    operation (texting) is a Class A misdemeanor, which is a serious criminal offense.
- id: 107
  category: defensive_driving
  question: 'Regarding seatbelt laws, Alaska is a ''Primary Enforcement'' state. This
    means:'
  choices:
    A: You can only be cited for a seatbelt violation if you are stopped for another
      reason
    B: A police officer can stop and cite you solely for not wearing a seatbelt
    C: Seatbelts are only required for passengers under 18
    D: Seatbelts are only required on highways, not city streets
  answer: B
  explanation: Alaska is a primary enforcement state, meaning law enforcement can
    pull you over and issue a ticket specifically for a seatbelt violation even if
    no other laws were broken.
- id: 108
  category: defensive_driving
  question: 'When an emergency vehicle with sirens and flashing lights approaches
    you from behind in Alaska, you must:'
  choices:
    A: Stop exactly where you are
    B: Speed up to get out of the way
    C: Pull to the right edge of the roadway and stop
    D: Move into the left lane to let them pass on the right
  answer: C
  explanation: Alaska law requires drivers to yield the right-of-way to emergency
    vehicles by pulling as close as possible to the right-hand edge or curb of the
    roadway and stopping until the vehicle has passed.
- id: 109
  category: defensive_driving
  question: Which of the following is a common location where 'black ice' is likely
    to form first on Alaska roads?
  choices:
    A: In the middle of intersections
    B: On bridges and overpasses
    C: On steep uphill grades
    D: In gravel turnouts
  answer: B
  explanation: Bridges and overpasses freeze sooner than regular roads because cold
    air circulates both above and below the road surface, making them prime spots
    for black ice.
- id: 110
  category: alcohol_drugs_health
  question: 'In Alaska, a driver 21 years of age or older is considered to be driving
    under the influence if their Blood Alcohol Concentration (BAC) is at or above:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Under Alaska Statute 28.35.030, a person is guilty of DUI if they operate
    a motor vehicle with a BAC of 0.08% or greater.
- id: 111
  category: alcohol_drugs_health
  question: For a first DUI conviction in Alaska, what is the minimum fine that must
    be paid?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Alaska law mandates a minimum fine of $1,500 for a first-offense DUI
    conviction.
- id: 112
  category: alcohol_drugs_health
  question: 'In Alaska, if you are operating a commercial motor vehicle, you are considered
    legally intoxicated if your BAC is:'
  choices:
    A: 0.01% or higher
    B: 0.04% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: B
  explanation: For commercial drivers in Alaska, the legal BAC limit is lower than
    for standard drivers, set at 0.04%.
- id: 113
  category: alcohol_drugs_health
  question: Following a DUI conviction in Alaska, the court will require the installation
    of an Ignition Interlock Device (IID) for at least how long for a first offense?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: The duration of the probation period
  answer: B
  explanation: Alaska law requires that first-time DUI offenders use an Ignition Interlock
    Device for a minimum of 6 months after their driving privileges are restored.
- id: 114
  category: alcohol_drugs_health
  question: According to Alaska's 'Open Container' law, where is it legal to keep
    an unsealed container of alcohol in a vehicle?
  choices:
    A: In the glove compartment
    B: In the center console
    C: In the trunk or behind the last upright seat in a vehicle without a trunk
    D: Under the driver's seat
  answer: C
  explanation: Alaska Statute 28.35.029 prohibits open containers of alcohol in the
    passenger compartment. They must be kept in the trunk or an area not normally
    occupied by the driver or passengers.
- id: 115
  category: alcohol_drugs_health
  question: In Alaska, can you be convicted of a DUI if you are driving under the
    influence of a legally prescribed medication?
  choices:
    A: No, as long as you have a valid prescription
    B: No, DUI only applies to alcohol and illegal drugs
    C: Yes, if the medication impairs your ability to drive safely
    D: Yes, but only if you also have alcohol in your system
  answer: C
  explanation: Alaska's DUI laws apply to any controlled substance or inhalant that
    impairs your ability to drive, regardless of whether it was legally prescribed.
- id: 116
  category: alcohol_drugs_health
  question: 'If you are convicted of a second DUI within 15 years in Alaska, your
    driver''s license will be revoked for at least:'
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: A second DUI conviction within 15 years in Alaska results in a mandatory
    minimum license revocation period of 1 year.
- id: 117
  category: alcohol_drugs_health
  question: 'In Alaska, refusing to submit to a chemical test of your breath when
    requested by a law enforcement officer is:'
  choices:
    A: Not a crime, but results in a fine
    B: A separate criminal offense with penalties equal to or greater than a DUI
    C: Only a violation if you are later found guilty of DUI
    D: Allowed if you have not spoken to an attorney
  answer: B
  explanation: Refusal to submit to a chemical test (Breath Test Refusal) is a class
    A misdemeanor in Alaska and carries the same mandatory minimum penalties as a
    DUI conviction.
- id: 118
  category: alcohol_drugs_health
  question: Which of the following is true regarding marijuana use and driving in
    Alaska?
  choices:
    A: It is legal to drive after using marijuana because it is legal for recreational
      use
    B: You can only be charged with DUI if you are smoking while driving
    C: Driving under the influence of marijuana is a crime, just like driving under
      the influence of alcohol
    D: Marijuana does not affect driving ability like alcohol does
  answer: C
  explanation: Despite the legalization of recreational marijuana in Alaska, driving
    while impaired by marijuana remains a criminal DUI offense.
- id: 119
  category: alcohol_drugs_health
  question: 'If you have a medical condition that may affect your ability to safely
    operate a motor vehicle, you must:'
  choices:
    A: Only inform your insurance company
    B: Report the condition to the Alaska DMV
    C: Stop driving immediately and surrender your license permanently
    D: Only drive during daylight hours
  answer: B
  explanation: Drivers in Alaska are required to notify the DMV of any physical or
    mental condition that may impair their ability to drive safely.
- id: 120
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in the context of driving safety?
  choices:
    A: The effect of mixing different types of alcohol
    B: The combined effect of alcohol and drugs, which is greater than the sum of
      their individual effects
    C: The recovery time needed after drinking
    D: The speed at which the liver processes alcohol
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs (even over-the-counter
    ones) are taken together, significantly increasing impairment beyond what either
    would cause alone.
- id: 121
  category: alcohol_drugs_health
  question: 'In Alaska, if you are involved in a fatal accident and are suspected
    of DUI, you may be required to provide:'
  choices:
    A: A written statement only
    B: A blood sample for testing
    C: A copy of your birth certificate
    D: A character witness
  answer: B
  explanation: Under Alaska law, if a person is involved in an accident resulting
    in death or serious physical injury, a blood test may be administered to determine
    alcohol or drug content.
- id: 122
  category: alcohol_drugs_health
  question: What is the only way to effectively reduce your Blood Alcohol Concentration
    (BAC) before driving?
  choices:
    A: Drinking strong black coffee
    B: Taking a cold shower
    C: Giving your body time to process the alcohol
    D: Eating a heavy meal
  answer: C
  explanation: Time is the only factor that will lower BAC. Coffee, showers, and food
    do not speed up the liver's metabolism of alcohol.
- id: 123
  category: alcohol_drugs_health
  question: If you refuse to submit to a chemical test of your breath after being
    arrested for DUI in Alaska, your license will be revoked for at least how many
    days for a first offense?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Refusal to submit to a chemical test in Alaska results in a mandatory
    license revocation of at least 90 days for the first offense, which is the same
    administrative penalty as a DUI conviction.
- id: 124
  category: alcohol_drugs_health
  question: Alaska's 'Open Container' law prohibits the possession of an open bottle
    or receptacle containing an alcoholic beverage in which part of the vehicle?
  choices:
    A: The trunk only
    B: The passenger compartment of the vehicle
    C: The glove box only
    D: Behind the last upright seat of a vehicle without a trunk
  answer: B
  explanation: Alaska law prohibits carrying an open container of alcohol in the passenger
    compartment of a motor vehicle. It must be kept in the trunk or, if the vehicle
    has no trunk, behind the last upright seat.
- id: 125
  category: alcohol_drugs_health
  question: In Alaska, a DUI conviction remains on your driving record for how long?
  choices:
    A: 5 years
    B: 10 years
    C: 15 years
    D: Permanently
  answer: D
  explanation: In Alaska, a DUI conviction is a permanent part of your driving record
    and cannot be removed.
- id: 126
  category: alcohol_drugs_health
  question: 'A third DUI conviction within a 10-year period in Alaska is classified
    as a:'
  choices:
    A: Class A Misdemeanor
    B: Class B Misdemeanor
    C: Class C Felony
    D: Infraction
  answer: C
  explanation: Under Alaska law, a third DUI conviction within 10 years is a Class
    C Felony, which carries significantly harsher penalties, including a minimum of
    120 days in jail.
- id: 127
  category: alcohol_drugs_health
  question: Under Alaska's Zero Tolerance law, a driver under 21 who is found to have
    any measurable amount of alcohol in their system will have their license revoked
    for how many days for a first offense?
  choices:
    A: 10 days
    B: 30 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: For a first offense under the Zero Tolerance law (under 21 with a BAC
    of 0.01% or higher), the Alaska DMV will revoke the driver's license for 30 days.
- id: 128
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and it impairs your driving ability,
    can you be arrested for DUI in Alaska?
  choices:
    A: No, if the drug was legally prescribed to you
    B: No, unless you also consumed alcohol
    C: Yes, if the drug impairs your physical or mental abilities
    D: Yes, but only if you exceeded the prescribed dosage
  answer: C
  explanation: In Alaska, you can be arrested for DUI if you are impaired by any controlled
    substance, including legally prescribed medications.
- id: 129
  category: alcohol_drugs_health
  question: In Alaska, if you have a medical condition that causes seizures, you must
    generally be seizure-free for how long before you can legally drive?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 2 years
  answer: C
  explanation: While the DMV reviews medical conditions on a case-by-case basis, the
    standard requirement in Alaska is typically being seizure-free for 6 months, supported
    by a physician's report.
- id: 130
  category: alcohol_drugs_health
  question: If you are involved in a DUI incident in Alaska and a person under the
    age of 16 was a passenger in your vehicle, what is the legal consequence?
  choices:
    A: There is no additional penalty
    B: It is considered an aggravating factor that increases mandatory minimum sentencing
    C: Your license is revoked for life immediately
    D: You are only charged with a seatbelt violation
  answer: B
  explanation: Having a passenger under the age of 16 during a DUI is an aggravating
    factor in Alaska that can lead to increased jail time and higher fines, and may
    lead to additional charges like Endangering the Welfare of a Child.
- id: 131
  category: penalties_and_points
  question: Under Alaska law, what is the point value for a conviction of 'Reckless
    Driving'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Reckless driving is considered a major violation in Alaska and carries
    a penalty of 6 points on the driver's record.
- id: 132
  category: penalties_and_points
  question: What is the minimum fine for a first-time DUI conviction in Alaska (excluding
    court costs and other fees)?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: In Alaska, the minimum fine for a first-offense DUI is $1,500.
- id: 133
  category: penalties_and_points
  question: How many points are assessed for 'Illegal Overtaking of a Stopped School
    Bus' in Alaska?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Passing a stopped school bus with its red lights flashing is a serious
    violation in Alaska and results in 6 points.
- id: 134
  category: penalties_and_points
  question: How often can an Alaska driver complete an approved defensive driving
    course to reduce points on their driving record?
  choices:
    A: Once every 6 months
    B: Once every 12 months
    C: Once every 24 months
    D: Once every 5 years
  answer: B
  explanation: Alaska allows a 2-point reduction for completing a defensive driving
    course, but this credit can only be applied once every 12 months.
- id: 135
  category: penalties_and_points
  question: In Alaska, how many points are added to your record for 'Following too
    closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Following too closely is a 2-point violation according to the Alaska
    DMV point schedule.
- id: 136
  category: penalties_and_points
  question: After a DUI conviction in Alaska, for how long must a driver typically
    maintain SR-22 (proof of financial responsibility) insurance?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: Drivers convicted of DUI or other major offenses in Alaska are generally
    required to maintain SR-22 insurance for 3 years.
- id: 137
  category: penalties_and_points
  question: Which of the following violations results in the highest number of points
    (6 points) in Alaska?
  choices:
    A: Careless driving
    B: Failure to stop for a peace officer
    C: Speeding 15 mph over the limit
    D: Failure to yield
  answer: B
  explanation: Failure to stop for a peace officer is a major violation carrying 6
    points. Careless driving is 2 points, and speeding 15 mph over is 4 points.
- id: 138
  category: penalties_and_points
  question: In Alaska, how many points are assessed for a 'Careless Driving' conviction?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 0 points (fine only)
  answer: A
  explanation: Careless driving is a 2-point violation in Alaska, whereas Reckless
    driving is a 6-point violation.
- id: 139
  category: penalties_and_points
  question: In Alaska, a first-time DUI offender is required to have an Ignition Interlock
    Device (IID) installed for what period of time after their license is reinstated?
  choices:
    A: 3 months
    B: 6 months
    C: The duration of their probation
    D: At least 6 months, but often for the duration of the license revocation period
  answer: D
  explanation: Alaska requires the installation of an Ignition Interlock Device for
    all DUI convictions. For a first offense, it is typically required for the duration
    of the revocation period (minimum 90 days) plus any additional time ordered by
    the court.
- id: 140
  category: penalties_and_points
  question: In Alaska, how many points are assessed against your driving record for
    exceeding the speed limit by 15 mph or more?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: B
  explanation: According to the Alaska DMV point system, speeding 15 mph or more over
    the limit results in 4 points being added to your driving record.
- id: 141
  category: penalties_and_points
  question: Under Alaska law, what is the mandatory minimum jail time for a first-time
    DUI conviction?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 10 days
  answer: C
  explanation: A first-time DUI conviction in Alaska carries a mandatory minimum sentence
    of 72 consecutive hours in jail.
- id: 142
  category: penalties_and_points
  question: If you are convicted of failing to stop for a school bus that is loading
    or unloading passengers in Alaska, how many points are assessed?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Passing a stopped school bus with its red lights flashing is a serious
    safety violation in Alaska and carries a penalty of 6 points.
- id: 143
  category: penalties_and_points
  explanation: In Alaska, following another vehicle too closely (tailgating) results
    in 2 points being added to your driving record.
  question: How many points are assessed for 'Following too closely' in the state
    of Alaska?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
- id: 144
  category: penalties_and_points
  question: If an Alaska driver is convicted of driving while their license is suspended
    or revoked, how many points are added to their record?
  choices:
    A: 2 points
    B: 6 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: Driving while a license is suspended or revoked is a major violation
    and results in 10 points being assessed.
- id: 145
  category: penalties_and_points
  question: In Alaska, for a first DUI conviction, for how long must an Ignition Interlock
    Device (IID) be installed in the offender's vehicle?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: B
  explanation: For a first DUI conviction in Alaska, the driver is typically required
    to use an Ignition Interlock Device for a period of 6 months after their license
    is reinstated.
- id: 146
  category: penalties_and_points
  question: What is the point value for failing to yield the right-of-way to a pedestrian
    in Alaska?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Failure to yield to a pedestrian or another vehicle is a 4-point violation
    in the state of Alaska.
- id: 147
  category: penalties_and_points
  question: In Alaska, what is the fine for a driver who fails to wear a safety belt?
  choices:
    A: $15
    B: $50
    C: $100
    D: $250
  answer: A
  explanation: Per Alaska Statute 28.05.095, the fine for a seat belt violation is
    $15.
- id: 148
  category: penalties_and_points
  question: 'If you are convicted of a DUI in Alaska, you will be required to maintain
    proof of financial responsibility (SR-22 insurance) for at least:'
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: Following a DUI conviction or license revocation for refusal, Alaska
    requires the driver to maintain SR-22 insurance for 3 years for the first offense.
- id: 149
  category: sharing_the_road
  question: Under Alaska's 'Move Over' law, what must you do when approaching a stationary
    emergency vehicle with flashing lights on a highway with two or more lanes moving
    in the same direction?
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk your horn
    C: Move to the left lane if safe to do so, or slow down significantly
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: Alaska Statute 28.35.185 requires drivers to vacate the lane closest
    to a stationary emergency vehicle or slow down to a speed that is safe and reasonable
    for the weather and road conditions.
- id: 150
  category: sharing_the_road
  question: When following an emergency vehicle responding to an alarm in Alaska,
    what is the minimum legal following distance?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Per Alaska Statute 28.35.180, it is illegal to follow an emergency
    vehicle (like a fire truck or ambulance) closer than 500 feet when it is responding
    to an emergency.
- id: 151
  category: sharing_the_road
  question: You are driving on a highway with a physical median or barrier. A school
    bus is stopped on the opposite side of the median with red lights flashing. What
    does Alaska law require you to do?
  choices:
    A: Stop and wait for the lights to stop flashing
    B: Slow down to 15 mph and proceed with caution
    C: You are not required to stop
    D: Stop only if there are children crossing the median
  answer: C
  explanation: In Alaska, drivers traveling in the opposite direction on a highway
    divided by a median or physical barrier are not required to stop for a school
    bus.
- id: 152
  category: sharing_the_road
  question: In Alaska, is 'lane splitting' (a motorcycle driving between rows of stopped
    or moving vehicles in the same lane) legal?
  choices:
    A: Yes, but only in heavy traffic
    B: Yes, if the speed is under 15 mph
    C: No, it is illegal
    D: Yes, it is encouraged to reduce congestion
  answer: C
  explanation: According to the Alaska Driver's Manual and traffic regulations (13
    AAC 02.427), motorcycles are entitled to the full use of a lane, and lane splitting
    is prohibited.
- id: 153
  category: sharing_the_road
  question: When a pedestrian is using a white cane or a guide dog at an intersection
    in Alaska, what must a driver do?
  choices:
    A: Honk to let them know you are there
    B: Proceed if the pedestrian is not directly in your path
    C: Come to a complete stop and take precautions to avoid injury
    D: Slow down and yell instructions to the pedestrian
  answer: C
  explanation: Alaska law (13 AAC 02.175) requires drivers to take necessary precautions
    and come to a complete stop if necessary to avoid injuring a blind pedestrian
    using a cane or guide dog.
- id: 154
  category: sharing_the_road
  question: According to Alaska law, a bicycle operated at night must be equipped
    with a front headlight visible from at least how many feet?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Alaska Administrative Code (13 AAC 04.320) requires bicycles used at
    night to have a lamp on the front emitting a white light visible from a distance
    of at least 500 feet.
- id: 155
  category: sharing_the_road
  question: When sharing the road with large trucks, what is the 'No-Zone'?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the truck where your vehicle disappears from the driver's
      view
    C: The speed-restricted zone for commercial vehicles
    D: The area reserved for truck weigh stations
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots behind, in front, and
    on both sides of a truck where the truck driver cannot see other vehicles.
- id: 156
  category: sharing_the_road
  question: In Alaska, if you are turning right and a bicyclist is in the bike lane
    or on the shoulder to your right, who has the right of way?
  choices:
    A: The motor vehicle, because it is larger
    B: The bicyclist
    C: Whoever reaches the intersection first
    D: The motor vehicle, because bicycles must always yield to cars
  answer: B
  explanation: Bicyclists have the same rights and responsibilities as motorists.
    You must yield to a bicyclist when turning across their path.
- id: 157
  category: sharing_the_road
  question: What is the minimum age for a passenger on a motorcycle in Alaska, provided
    the motorcycle is equipped with a designated passenger seat and footrests?
  choices:
    A: There is no state-mandated minimum age
    B: 5 years old
    C: 8 years old
    D: 12 years old
  answer: A
  explanation: Alaska law does not specify a minimum age for motorcycle passengers,
    but the motorcycle must be equipped with a permanent seat and footrests for the
    passenger.
- id: 158
  category: sharing_the_road
  question: 'When a large truck is turning right onto a narrow street, it will often:'
  choices:
    A: Stay as close to the right curb as possible
    B: Swing wide to the left before turning
    C: Speed up to complete the turn quickly
    D: Turn from the left-most lane
  answer: B
  explanation: Large trucks have a wide turning radius and often need to swing wide
    to the left to clear the curb when making a right turn.
- id: 159
  category: sharing_the_road
  question: In Alaska, is it legal for a person to stand in the roadway for the purpose
    of soliciting a ride (hitchhiking)?
  choices:
    A: Yes, anywhere in the state
    B: Yes, but only on highways with a shoulder
    C: No, it is prohibited by state law
    D: Yes, but only during daylight hours
  answer: C
  explanation: Under 13 AAC 02.175, no person may stand in a roadway for the purpose
    of soliciting a ride, though they may stand on the shoulder or sidewalk.
- id: 160
  category: sharing_the_road
  question: 'When following a motorcycle in Alaska, you should maintain a following
    distance of at least:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 10 seconds
  answer: C
  explanation: The Alaska Driver's Manual recommends a following distance of at least
    four seconds when following a motorcycle to allow for sudden maneuvers or stops.
- id: 161
  category: sharing_the_road
  question: If you are involved in a crash with a commercial vehicle (truck), what
    additional information should you try to obtain besides the driver's license?
  choices:
    A: The truck's fuel mileage
    B: The name of the trucking company and the USDOT number
    C: The weight of the cargo
    D: The driver's logbook for the last 30 days
  answer: B
  explanation: When involved in an accident with a commercial vehicle, it is important
    to identify the carrier (company) and the USDOT identification number displayed
    on the vehicle.
- id: 162
  category: sharing_the_road
  question: 'In Alaska, you must not follow a fire apparatus (fire truck) traveling
    in response to a fire alarm closer than:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Under Alaska Administrative Code (13 AAC 02.517), it is illegal to
    follow a fire vehicle responding to an alarm closer than 500 feet or to drive
    into or park within the block where the fire vehicle has stopped.
- id: 163
  category: sharing_the_road
  question: What is the recommended following distance when driving behind a motorcycle
    in Alaska to ensure safety?
  choices:
    A: 2 seconds
    B: 4 seconds
    C: 1 car length
    D: 50 feet
  answer: B
  explanation: The Alaska Driver Manual recommends a following distance of at least
    4 seconds when behind a motorcycle because they can stop much quicker than other
    vehicles and are more easily affected by road conditions.
- id: 164
  category: sharing_the_road
  question: 'Under Alaska law, if you see a pedestrian using a white cane or a guide
    dog, you must:'
  choices:
    A: Honk to let them know you are there.
    B: Slow down and be prepared to stop to give them the right-of-way.
    C: Drive around them quickly.
    D: Yield only if they are in a marked crosswalk.
  answer: B
  explanation: Alaska law requires drivers to yield the right-of-way to any totally
    or partially blind pedestrian carrying a white cane or using a guide dog, regardless
    of whether they are in a crosswalk.
- id: 165
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the driver may need to:'
  choices:
    A: Stay entirely in the right lane.
    B: Swing wide to the left to complete the turn.
    C: Speed up to clear the intersection quickly.
    D: Turn from the left lane only.
  answer: B
  explanation: Large trucks have a wide turning radius. To clear the curb, they often
    must swing wide to the left before turning right. Drivers should never try to
    squeeze between the truck and the curb.
- id: 166
  category: sharing_the_road
  question: In Alaska, what does a flashing yellow light on a school bus indicate?
  choices:
    A: The bus is about to stop and children are getting off.
    B: The bus is broken down.
    C: The bus is preparing to stop to load or unload children.
    D: The bus is speeding.
  answer: C
  explanation: Flashing yellow lights on a school bus mean the bus is preparing to
    stop. Drivers should slow down and prepare to stop their vehicles.
- id: 167
  category: sharing_the_road
  question: According to the Alaska Driver Manual, when passing a bicyclist, you should
    allow at least how much space between your vehicle and the bicycle?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 6 feet
  answer: C
  explanation: The Alaska Driver Manual states that motorists should give bicyclists
    plenty of room and suggests a minimum of 3 feet of clearance when passing.
- id: 168
  category: sharing_the_road
  question: 'If you are driving and a vehicle in front of you has stopped at a crosswalk
    to let a pedestrian cross, you should:'
  choices:
    A: Pass the stopped vehicle on the left.
    B: Pass the stopped vehicle on the right.
    C: Not pass the stopped vehicle.
    D: Honk to tell the pedestrian to hurry.
  answer: C
  explanation: Alaska law prohibits passing a vehicle that has stopped at a crosswalk
    to permit a pedestrian to cross, as the passing driver may not be able to see
    the pedestrian.
- id: 169
  category: sharing_the_road
  question: 'Bicyclists in Alaska are required by law to:'
  choices:
    A: Ride against the flow of traffic.
    B: Ride only on sidewalks.
    C: Obey the same traffic laws as motor vehicle drivers.
    D: Never use hand signals.
  answer: C
  explanation: In Alaska, bicyclists have the same rights and responsibilities as
    motorists. They must obey all traffic signals, signs, and pavement markings.
- id: 170
  category: vehicle_information
  question: In Alaska, for residents living North of 60 degrees North Latitude, between
    which dates are studded tires legally allowed?
  choices:
    A: October 1 through April 15
    B: September 15 through May 1
    C: November 1 through March 31
    D: September 1 through May 15
  answer: B
  explanation: According to Alaska law, for areas North of 60 degrees North Latitude
    (which includes Fairbanks and Anchorage), studded tires are permitted from September
    15 through May 1.
- id: 171
  category: vehicle_information
  question: According to Alaska's vehicle equipment laws, what is the maximum allowable
    tinting for the front side windows (driver and front passenger)?
  choices:
    A: Must allow at least 40% light transmittance
    B: Must allow at least 50% light transmittance
    C: Must allow at least 70% light transmittance
    D: No tinting is allowed on side windows
  answer: C
  explanation: In Alaska, the front side windows must have a light transmittance of
    at least 70%.
- id: 172
  category: vehicle_information
  question: In Alaska, what is the maximum allowable tinting for the rear side windows
    and the rear window?
  choices:
    A: Must allow at least 20% light transmittance
    B: Must allow at least 30% light transmittance
    C: Must allow at least 40% light transmittance
    D: Must allow at least 70% light transmittance
  answer: C
  explanation: Alaska law requires that the rear side windows and the rear window
    allow at least 40% light transmittance.
- id: 173
  category: vehicle_information
  question: 'Every motor vehicle in Alaska must be equipped with a horn that can be
    heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Alaska vehicle equipment standards require a horn audible under normal
    conditions from a distance of not less than 200 feet.
- id: 174
  category: vehicle_information
  question: In Alaska, a load extending more than how many feet beyond the rear of
    the vehicle must be marked with a red flag during the day?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: Whenever a load extends 4 feet or more beyond the rear of the bed or
    body of a vehicle, a red flag (at least 12 inches square) must be displayed at
    the extreme rear of the load.
- id: 175
  category: vehicle_information
  question: 'Alaska law requires your vehicle''s license plate to be illuminated so
    that it is clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The rear registration plate must be illuminated by a white light so
    that it is visible from a distance of 50 feet to the rear.
- id: 176
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle in
    Alaska?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe in Alaska if the tread depth is less than
    2/32 of an inch.
- id: 177
  category: vehicle_information
  question: In Alaska, every motor vehicle must have at least how many mirrors so
    located as to reflect to the driver a view of the highway for a distance of at
    least 200 feet to the rear?
  choices:
    A: One mirror
    B: Two mirrors
    C: Three mirrors
    D: Four mirrors
  answer: B
  explanation: 'Alaska law requires at least two mirrors: one on the left side and
    one either in the center or on the right side.'
- id: 178
  category: vehicle_information
  question: Under Alaska law, which of the following is true regarding vehicle mufflers?
  choices:
    A: Mufflers may be modified to increase engine noise
    B: Muffler cut-outs or bypasses are permitted on rural highways
    C: A vehicle must have a muffler in good working order to prevent excessive noise
    D: Mufflers are only required for vehicles manufactured after 2010
  answer: C
  explanation: Alaska law requires every motor vehicle to have a muffler in good working
    order and in constant operation to prevent excessive or unusual noise. Cut-outs
    or bypasses are prohibited.
- id: 179
  category: vehicle_information
  question: 'In Alaska, a ''Slow Moving Vehicle'' emblem must be displayed on the
    rear of any vehicle that travels at a speed of less than:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: The slow-moving vehicle emblem (a reflective orange triangle) is required
    for vehicles designed for operation at speeds of 25 mph or less.
- id: 180
  category: vehicle_information
  question: Alaska law requires that all motor vehicles (except motorcycles) be equipped
    with how many separate means of applying brakes?
  choices:
    A: One
    B: Two
    C: Three
    D: None, as long as the primary system works
  answer: B
  explanation: Every motor vehicle must have two separate means of applying brakes
    (the service/foot brake and the parking/emergency brake), each of which must be
    effective to stop the vehicle.
- id: 181
  category: vehicle_information
  question: In Alaska, for residents living south of 60 degrees North latitude (such
    as Juneau or Ketchikan), studded tires are only legal during which time frame?
  choices:
    A: September 15 through May 1
    B: October 1 through April 15
    C: September 15 through April 15
    D: November 1 through March 31
  answer: C
  explanation: According to Alaska Administrative Code and the Driver Manual, studded
    tires are legal from September 15 through April 15 for areas south of 60 degrees
    North latitude.
- id: 182
  category: vehicle_information
  question: According to Alaska law, what is the minimum light transmittance allowed
    for aftermarket tinting on the front side windows?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 20%
  answer: C
  explanation: Alaska law (13 AAC 04.223) specifies that the windows to the immediate
    right and left of the driver must allow at least 70% of light to pass through.
- id: 183
  category: vehicle_information
  question: In Alaska, aftermarket tinting on the rear side windows and the rear window
    of a passenger vehicle must allow at least what percentage of light to pass through?
  choices:
    A: 40%
    B: 30%
    C: 20%
    D: 15%
  answer: A
  explanation: For passenger vehicles in Alaska, the rear side windows and the back
    window must have a light transmittance of at least 40%.
- id: 184
  category: vehicle_information
  question: In Alaska, your vehicle's service brakes must be capable of stopping the
    vehicle within how many feet when traveling at 20 mph on a dry, level surface?
  choices:
    A: 15 feet
    B: 25 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Alaska safety standards require that the foot brake (service brake)
    must be able to stop a passenger vehicle traveling at 20 mph within 25 feet.
- id: 185
  category: vehicle_information
  question: 'In Alaska, the tail lights on your vehicle must be red in color and visible
    from a distance of:'
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: B
  explanation: Alaska equipment regulations require tail lights to be visible from
    a distance of 1,000 feet to the rear.
- id: 186
  category: vehicle_information
  question: 'When a vehicle is equipped with a ''white light'' to illuminate the rear
    registration plate, the plate must be legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Alaska law requires the rear license plate to be illuminated so that
    it is clearly legible from a distance of 50 feet to the rear.
- id: 187
  category: vehicle_information
  question: 'In Alaska, turn signal lights must be visible in normal sunlight from
    a distance of not less than:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Turn signals on a standard passenger vehicle in Alaska must be visible
    from at least 100 feet away in normal sunlight.
- id: 188
  category: vehicle_information
  question: Which of the following is true regarding 'Headlight Use' zones on certain
    Alaska highways?
  choices:
    A: Headlights are only required if it is raining.
    B: Headlights must be turned on even in broad daylight.
    C: Only parking lights are required during the day.
    D: High beams must be used at all times.
  answer: B
  explanation: Alaska has designated 'Headlight Use' zones on many highways where
    drivers are legally required to have their headlights turned on at all times,
    including during daylight hours, to increase visibility.
- id: 189
  category: signs_and_signals
  question: In Alaska, what is the maximum speed limit when driving in an alley?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: According to the Alaska Driver Manual, the speed limit in an alley
    is 15 mph unless otherwise posted.
- id: 190
  category: signs_and_signals
  question: 'When driving in a residential district in Alaska where no speed limit
    is posted, you must not exceed:'
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: In Alaska, the default speed limit for residential districts is 25
    mph.
- id: 191
  category: signs_and_signals
  question: In Alaska, what is the speed limit in a school zone when yellow lights
    are flashing or children are present?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 10 mph
  answer: B
  explanation: The speed limit in a designated school zone in Alaska is 20 mph when
    lights are flashing or children are present.
- id: 192
  category: signs_and_signals
  question: If you are using hand signals, how do you signal a right turn in Alaska?
  choices:
    A: Extend your left arm straight out the window.
    B: Extend your left arm out and point it upward.
    C: Extend your left arm out and point it downward.
    D: Extend your right arm straight out the window.
  answer: B
  explanation: To signal a right turn using hand signals, you should extend your left
    arm out the window and bend it upward at the elbow.
- id: 193
  category: signs_and_signals
  question: What does a flashing red traffic light mean in Alaska?
  choices:
    A: Slow down and proceed with caution.
    B: The light is about to turn green.
    C: Stop completely and proceed only when it is safe to do so.
    D: Yield to all traffic, but do not stop unless necessary.
  answer: C
  explanation: 'A flashing red light has the same meaning as a stop sign: you must
    come to a complete stop and proceed when safe.'
- id: 194
  category: signs_and_signals
  question: 'A pennant-shaped sign (an isosceles triangle pointing right) found on
    the left side of the road indicates:'
  choices:
    A: A school zone ahead.
    B: A yield sign ahead.
    C: A no passing zone.
    D: A one-way street.
  answer: C
  explanation: A pennant-shaped sign is placed on the left side of the road to mark
    the beginning of a no passing zone.
- id: 195
  category: signs_and_signals
  question: What is the meaning of a flashing yellow traffic signal?
  choices:
    A: Stop and wait for the light to turn green.
    B: Speed up to clear the intersection.
    C: Proceed with caution.
    D: Treat it like a four-way stop.
  answer: C
  explanation: A flashing yellow light means you should slow down and proceed through
    the intersection with caution.
- id: 196
  category: signs_and_signals
  question: 'When you see a solid yellow line next to a broken yellow line on the
    pavement, and the solid line is on your side, you should:'
  choices:
    A: Pass only if the road is clear.
    B: Not pass other vehicles.
    C: Pass only during daylight hours.
    D: Expect a stop sign ahead.
  answer: B
  explanation: A solid yellow line on your side of the center line means that passing
    is prohibited for traffic in your direction.
- id: 197
  category: signs_and_signals
  question: 'In Alaska, a hand signal where the arm is extended out and downward indicates
    that the driver is:'
  choices:
    A: Turning left.
    B: Turning right.
    C: Slowing or stopping.
    D: Changing lanes.
  answer: C
  explanation: Extending the left arm downward indicates the driver's intention to
    slow down or stop.
- id: 198
  category: signs_and_signals
  question: What color are construction and maintenance signs in Alaska?
  choices:
    A: Yellow
    B: Orange
    C: Green
    D: Red
  answer: B
  explanation: Construction, maintenance, or emergency operations signs are diamond-shaped
    or rectangular and orange in color.
- id: 199
  category: signs_and_signals
  question: 'A steady yellow traffic light means:'
  choices:
    A: The light is about to turn green.
    B: You should speed up to beat the red light.
    C: The light is about to turn red; you should stop if it is safe to do so.
    D: Pedestrians have the right of way.
  answer: C
  explanation: A steady yellow light warns that the signal is changing to red. You
    should stop if you can do so safely; otherwise, proceed with caution.
- id: 200
  category: signs_and_signals
  question: What do broken white lines on the pavement indicate?
  choices:
    A: Traffic is moving in opposite directions.
    B: Traffic is moving in the same direction, and lane changes are permitted.
    C: The edge of the roadway.
    D: A pedestrian crosswalk.
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction;
    crossing the line to change lanes is permitted when safe.
- id: 201
  category: signs_and_signals
  question: What does a round yellow sign with a black 'X' and the letters 'RR' indicate?
  choices:
    A: A road crossing ahead.
    B: A railroad crossing ahead.
    C: No passing zone.
    D: A rest area ahead.
  answer: B
  explanation: A round yellow sign with a black 'X' and 'RR' is a circular advance
    warning sign for a railroad crossing.
- id: 202
  category: signs_and_signals
  question: In Alaska, what is the correct hand signal to indicate a right turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward out the window
    C: Left arm extended downward out the window
    D: Right arm extended straight out the window
  answer: B
  explanation: According to the Alaska Driver Manual, a right turn is signaled by
    extending the left arm out the window and pointing it upward.
- id: 203
  category: signs_and_signals
  question: What is the meaning of a pennant-shaped sign located on the left side
    of the road?
  choices:
    A: School Zone ahead
    B: No Passing Zone
    C: Yield to oncoming traffic
    D: Railroad crossing ahead
  answer: B
  explanation: A pennant-shaped sign (an isosceles triangle pointing right) is placed
    on the left side of the road to mark the beginning of a No Passing Zone.
- id: 204
  category: signs_and_signals
  question: In Alaska, what do double solid yellow lines in the center of the road
    signify?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is prohibited in both directions
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    vehicles traveling in either direction.
- id: 205
  category: signs_and_signals
  question: 'When you see a flashing yellow traffic signal at an intersection, you
    should:'
  choices:
    A: Stop and wait for a green light
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: Treat it like a four-way stop
  answer: C
  explanation: A flashing yellow light is a warning to slow down and be especially
    alert as you proceed through the intersection.
- id: 206
  category: signs_and_signals
  question: What does a solid white line painted on the right edge of the highway
    signify?
  choices:
    A: A lane for emergency vehicles only
    B: The edge of the roadway (fog line)
    C: A pedestrian walking path
    D: A zone where passing is allowed
  answer: B
  explanation: Solid white lines along the side of the road mark the edge of the pavement,
    often called fog lines, and help drivers stay on the road at night or in bad weather.
- id: 207
  category: signs_and_signals
  question: 'A five-sided (pentagon) sign indicates that you are entering a:'
  choices:
    A: Construction zone
    B: Hospital zone
    C: School zone or school crossing
    D: Public park area
  answer: C
  explanation: The five-sided pentagon shape is reserved exclusively for school zones
    and school crossings.
- id: 208
  category: signs_and_signals
  question: In Alaska, what is the hand signal for 'Slow or Stop'?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended downward
  answer: C
  explanation: To signal that you are slowing down or stopping, extend your left arm
    out the window and point it downward toward the ground.
- id: 209
  category: signs_and_signals
  question: What does a diamond-shaped orange sign represent in Alaska?
  choices:
    A: General warning of road hazards
    B: Construction or maintenance warning
    C: Regulatory speed limit
    D: Service station ahead
  answer: B
  explanation: Orange is the standard color for construction and maintenance signs.
    The diamond shape indicates a warning of specific conditions in the work zone.
- id: 210
  category: signs_and_signals
  question: 'If you are at an intersection with a steady yellow light, you should:'
  choices:
    A: Stop if you can do so safely before entering the intersection
    B: Accelerate to beat the red light
    C: Stop immediately, even if you are in the middle of the intersection
    D: Honk to warn other drivers you are passing through
  answer: A
  explanation: A steady yellow light means the signal is about to turn red. You should
    stop if it is safe to do so; if you are already in the intersection, continue
    through cautiously.
- id: 211
  category: signs_and_signals
  question: 'Broken white lines on a multi-lane roadway indicate:'
  choices:
    A: Traffic is moving in opposite directions
    B: Traffic is moving in the same direction and lane changes are permitted
    C: The edge of the roadway
    D: A dedicated bicycle lane
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    Drivers may cross these lines to change lanes when it is safe.
- id: 212
  category: signs_and_signals
  question: What does a red 'X' signal over a traffic lane mean?
  choices:
    A: The lane is for emergency vehicles only
    B: You must exit the lane as soon as possible
    C: You are not allowed to drive in that lane
    D: The lane is for carpools only
  answer: C
  explanation: A steady red 'X' over a lane means the lane is closed to traffic in
    your direction and you must not drive in it.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 213
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 214
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 215
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 216
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 217
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 218
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 219
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 220
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 221
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 222
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 223
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 224
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 225
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 226
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 227
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 228
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 229
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 230
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 231
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 232
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 233
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 234
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 235
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 236
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 237
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 238
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 239
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
