questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un Permiso de Instrucción en el
    estado de Alaska?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 15 años y medio de edad
    D: 16 años de edad
  answer: A
  explanation: En Alaska, una persona puede solicitar un Permiso de Instrucción a
    los 14 años de edad.
- id: 2
  category: license_system
  question: Mientras conduce con un Permiso de Instrucción en Alaska, el conductor
    supervisor debe tener al menos 21 años de edad y ¿cuánta experiencia de conducción?
  choices:
    A: Al menos 6 meses
    B: Al menos 1 año
    C: Al menos 2 años
    D: Al menos 5 años
  answer: B
  explanation: La persona que acompaña al titular del permiso debe tener al menos
    21 años y contar con al menos un año de experiencia de conducción con licencia
    para el tipo de vehículo que se conduce.
- id: 3
  category: license_system
  question: ¿Por cuánto tiempo es válido generalmente un Permiso de Instrucción de
    Alaska?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: Hasta que el solicitante cumpla 18 años
  answer: B
  explanation: Un Permiso de Instrucción de Alaska es válido por dos años a partir
    de la fecha de emisión.
- id: 4
  category: license_system
  question: Bajo la ley de Licencia de Conducir Graduada (GDL) de Alaska, ¿durante
    cuánto tiempo debe un adolescente tener un Permiso de Instrucción antes de poder
    solicitar una Licencia Provisional?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 1 año
  answer: B
  explanation: Una persona menor de 18 años debe haber tenido un Permiso de Instrucción
    durante al menos seis meses antes de solicitar una Licencia Provisional.
- id: 5
  category: license_system
  question: ¿Cuáles son las restricciones de conducción nocturna para el titular de
    una Licencia Provisional de Alaska?
  choices:
    A: No conducir entre las 10:00 PM y las 4:00 AM
    B: No conducir entre las 11:00 PM y las 5:00 AM
    C: No conducir entre las 12:00 AM y las 6:00 AM
    D: No conducir entre la 1:00 AM y las 5:00 AM
  answer: D
  explanation: El titular de una Licencia Provisional en Alaska no puede conducir
    entre la 1:00 AM y las 5:00 AM, a menos que esté acompañado por un padre/tutor
    o que conduzca por motivos de empleo.
- id: 6
  category: license_system
  question: Durante los primeros seis meses de tener una Licencia Provisional de Alaska,
    ¿quién tiene permitido ser pasajero en el vehículo?
  choices:
    A: Cualquier número de amigos menores de 21 años
    B: Solo miembros de la familia y un amigo
    C: Solo pasajeros de 21 años de edad o mayores, o hermanos
    D: Solo pasajeros mayores de 18 años de edad
  answer: C
  explanation: Durante los primeros seis meses, el titular de una licencia provisional
    no puede llevar pasajeros menores de 21 años, excepto hermanos, a menos que esté
    acompañado por un padre, tutor legal o una persona de al menos 21 años.
- id: 7
  category: license_system
  question: Si cambia su nombre o dirección en Alaska, ¿dentro de cuántos días debe
    notificar al DMV?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Alaska exige que notifique al DMV sobre un cambio de nombre
    o dirección en un plazo de 30 días.
- id: 8
  category: license_system
  question: En Alaska, su licencia de conducir será suspendida si acumula ¿cuántos
    puntos en un período de 12 meses?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: El DMV suspenderá su licencia si acumula 12 puntos en 12 meses o 18
    puntos en 24 meses.
- id: 9
  category: license_system
  question: ¿Cuántos puntos se pueden deducir de su historial de conducción de Alaska
    al completar un curso aprobado de conducción defensiva?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: B
  explanation: Completar un curso aprobado de conducción defensiva puede resultar
    en una reducción de 2 puntos en su historial de conducción, pero esto solo se
    puede usar una vez cada 12 meses.
- id: 10
  category: license_system
  question: Bajo la ley de 'Tolerancia Cero' de Alaska, ¿cuál es el límite legal de
    concentración de alcohol en sangre (BAC) para un conductor menor de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.08%
  answer: A
  explanation: Alaska tiene una ley de Tolerancia Cero, lo que significa que es ilegal
    que cualquier persona menor de 21 años opere un vehículo con cualquier cantidad
    medible de alcohol (0.00%).
- id: 11
  category: license_system
  question: ¿Cuál es el monto mínimo de cobertura de seguro de responsabilidad civil
    requerido en Alaska por daños a la propiedad en un solo accidente?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Alaska exige un seguro de responsabilidad civil mínimo de
    $50,000 por lesiones corporales o muerte de una persona, $100,000 por lesiones
    corporales o muerte de dos o más personas, y $25,000 por daños a la propiedad.
- id: 12
  category: license_system
  question: ¿Por cuántos años suele ser válida una licencia de conducir estándar de
    Alaska antes de que venza?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: La mayoría de las licencias de conducir de Alaska se emiten por un
    período de ocho años y vencen el día del cumpleaños del titular.
- id: 13
  category: license_system
  question: En Alaska, si usted está involucrado en una colisión que resulte en más
    de $501 en daños a la propiedad, ¿dentro de cuántos días debe presentar un informe
    ante el DMV?
  choices:
    A: 2 días
    B: 5 días
    C: 10 días
    D: 15 días
  answer: D
  explanation: Debe presentar un Certificado de Seguro (Formulario 12-209) ante el
    DMV dentro de los 15 días posteriores a un accidente que involucre lesiones, muerte
    o daños a la propiedad que superen los $501.
- id: 14
  category: license_system
  question: 'Para aprobar el examen de la vista para una licencia de conducir de Alaska,
    su visión debe ser de al menos:'
  choices:
    A: 20/20 en ambos ojos
    B: 20/40 en al menos un ojo
    C: 20/50 en ambos ojos
    D: 20/70 en al menos un ojo
  answer: B
  explanation: Los solicitantes deben tener al menos una visión de 20/40 en al menos
    un ojo para aprobar el examen de la vista del DMV de Alaska sin restricciones.
- id: 15
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para obtener un permiso de motocicleta
    en Alaska?
  choices:
    A: Tener al menos 14 años de edad
    B: Contar con la firma de un padre o tutor si es menor de 18 años
    C: Aprobar un examen de conocimientos escrito
    D: Todas las anteriores
  answer: D
  explanation: Para obtener un permiso de motocicleta (M1, M2 o M3), debe tener al
    menos 14 años, contar con el consentimiento de los padres si es menor de 18 años
    y aprobar el examen de conocimientos específico para motocicletas.
- id: 16
  category: license_system
  question: Para obtener una licencia compatible con REAL ID en Alaska, ¿cuántos documentos
    que demuestren la residencia en Alaska debe proporcionar?
  choices:
    A: Un documento
    B: Dos documentos
    C: Tres documentos
    D: Four documentos
  answer: B
  explanation: Según el DMV de Alaska, los solicitantes de una REAL ID deben proporcionar
    dos documentos que demuestren su residencia física en Alaska, como facturas de
    servicios públicos o contratos de alquiler.
- id: 17
  category: license_system
  question: Si se muda a Alaska desde otro estado y tiene una licencia de conducir
    válida de fuera del estado, ¿dentro de cuántos días después de convertirse en
    residente debe obtener una licencia de Alaska?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: La ley de Alaska exige que los nuevos residentes transfieran su licencia
    de conducir de otro estado a una licencia de Alaska dentro de los 90 días posteriores
    al establecimiento de la residencia.
- id: 18
  category: license_system
  question: 'Una persona con una licencia estándar Clase D en Alaska está autorizada
    para conducir un vehículo con una Clasificación de Peso Bruto Vehicular (GVWR)
    de menos de:'
  choices:
    A: 10,001 lbs
    B: 15,001 lbs
    C: 26,001 lbs
    D: 32,001 lbs
  answer: C
  explanation: Una licencia Clase D de Alaska es para vehículos no comerciales con
    un GVWR (Clasificación de Peso Bruto Vehicular) de menos de 26,001 lbs, siempre
    que no estén diseñados para transportar a más de 15 pasajeros o materiales peligrosos.
- id: 19
  category: license_system
  question: 'En Alaska, si un padre o tutor que firmó la solicitud de licencia de
    un menor decide que ya no quiere ser responsable de la conducción del menor, puede:'
  choices:
    A: Solo esperar hasta que el menor cumpla 18 años
    B: Solicitar por escrito que se cancele la licencia
    C: Decirle verbalmente a un oficial de policía que retire la licencia
    D: Nada; la firma es permanente hasta que la licencia venza
  answer: B
  explanation: Según el Estatuto de Alaska 28.15.071, la persona que firmó la solicitud
    del menor puede presentar una solicitud por escrito al DMV para cancelar la licencia,
    lo que la libera de responsabilidad futura.
- id: 20
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia de Conducir Comercial
    (CDL) para el comercio intraestatal (solo dentro de Alaska)?
  choices:
    A: 16 años
    B: 18 años
    C: 19 años
    D: 21 años
  answer: C
  explanation: En Alaska, debe tener al menos 19 años para obtener una CDL para el
    comercio intraestatal. Debe tener al menos 21 años para el comercio interestatal.
- id: 21
  category: license_system
  question: Para un conductor de Alaska menor de 18 años, si es condenado por una
    primera infracción de 'menor consumiendo alcohol', ¿por cuánto tiempo se le revocará
    su privilegio de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: El Estatuto de Alaska 28.15.183 exige una revocación de 90 días de
    los privilegios de conducir por una primera condena de un menor consumiendo o
    poseyendo alcohol.
- id: 22
  category: license_system
  question: ¿Cuántos puntos se asignan a su historial de manejo de Alaska por 'Exceso
    de velocidad en una zona escolar o cruce peatonal de un parque infantil'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: El sistema de puntos de Alaska asigna 6 puntos por exceso de velocidad
    en una zona escolar o cruce peatonal de un parque infantil, lo cual es superior
    a las infracciones de velocidad estándar.
- id: 23
  category: license_system
  question: Si su licencia de conducir de Alaska es suspendida debido al sistema de
    puntos, ¿cuál es la tarifa estándar de restablecimiento que debe pagar después
    de que termine el período de suspensión?
  choices:
    A: Sin cargo
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: El DMV de Alaska requiere una tarifa de restablecimiento de $100 para
    las licencias suspendidas debido a la acumulación de puntos.
- id: 24
  category: license_system
  question: 'El personal militar en servicio activo que tenga una licencia de conducir
    de Alaska que expire mientras presta servicio fuera del estado:'
  choices:
    A: Debe renovarla en línea inmediatamente
    B: Debe regresar a Alaska para renovarla
    C: La licencia sigue siendo válida hasta 90 días después de su baja o regreso
      a Alaska
    D: La licencia se cancela permanentemente después de 1 año de vencimiento
  answer: C
  explanation: La ley de Alaska establece que las licencias de los miembros militares
    en servicio activo permanecen válidas mientras están fuera del estado y durante
    los 90 días posteriores a su baja o regreso al estado.
- id: 25
  category: license_system
  question: En Alaska, ¿cuántos puntos se deducen de su historial de manejo por cada
    12 meses consecutivos de conducción sin infracciones?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: Se eliminan todos los puntos
  answer: B
  explanation: El DMV de Alaska deduce 2 puntos del historial de un conductor por
    cada período de 12 meses que conduzca sin recibir ninguna nueva condena de tráfico.
- id: 26
  category: license_system
  question: Para obtener un endoso de autobús escolar (S) en Alaska, ¿qué edad mínima
    debe tener el solicitante?
  choices:
    A: 18 años
    B: 19 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: Alaska requiere que los conductores de autobuses escolares tengan al
    menos 21 años de edad para calificar para el endoso de autobús escolar.
- id: 27
  category: license_system
  question: 'Si es menor de 21 años y es condenado por una segunda infracción de ''menor
    consumiendo alcohol'', su licencia de Alaska será revocada por:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Según el Estatuto de Alaska 28.15.183, una segunda condena por un menor
    consumiendo alcohol resulta en una revocación de 1 año de los privilegios de conducir.
- id: 28
  category: license_system
  question: Para renovar una licencia de conducir de Alaska en línea, ¿en qué rango
    de edad debe estar el solicitante?
  choices:
    A: 16 a 65
    B: 21 a 70
    C: 22 a 68
    D: 18 a 80
  answer: C
  explanation: Las regulaciones del DMV de Alaska establecen que las renovaciones
    en línea solo están disponibles para conductores de entre 22 y 68 años.
- id: 29
  category: license_system
  question: En Alaska, ¿cuál es la edad mínima para solicitar una tarjeta de identificación
    emitida por el estado?
  choices:
    A: Sin edad mínima
    B: 14 años
    C: 16 años
    D: 18 años
  answer: A
  explanation: No existe un requisito de edad mínima para obtener una tarjeta de identificación
    del estado de Alaska, aunque un padre o tutor debe firmar por un menor.
- id: 30
  category: license_system
  question: Si se revoca una licencia de conducir de Alaska por un DUI (conducir bajo
    la influencia), ¿qué debe proporcionar el conductor al DMV para restablecer su
    licencia?
  choices:
    A: Una carta de disculpa
    B: Prueba de responsabilidad financiera (seguro SR-22)
    C: Un nuevo certificado de nacimiento
    D: Prueba de 100 horas de servicio comunitario
  answer: B
  explanation: Los conductores que restablecen una licencia después de una revocación
    por DUI en Alaska deben proporcionar una prueba de seguro SR-22 (responsabilidad
    financiera) por un período específico, generalmente de 3 a 5 años.
- id: 31
  category: driver_testing
  question: ¿Cuál es el puntaje mínimo requerido para aprobar el examen escrito de
    conocimientos de Alaska?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: El examen de conocimientos del DMV de Alaska consta de 20 preguntas,
    y los solicitantes deben responder al menos 16 correctamente (80%) para aprobar.
- id: 32
  category: driver_testing
  question: Al realizar el examen de manejo en carretera de Alaska, ¿cuál de los siguientes
    requisitos debe cumplirse para el vehículo utilizado?
  choices:
    A: Comprobante de un cambio de aceite reciente
    B: Una carta ante notario del fabricante del vehículo
    C: Registro vigente y comprobante de seguro
    D: Un tanque lleno de gasolina premium
  answer: C
  explanation: Para el examen de manejo, el solicitante debe proporcionar un vehículo
    que esté debidamente registrado y asegurado, y este debe pasar una inspección
    básica de seguridad del equipo.
- id: 33
  category: driver_testing
  question: Bajo la ley de 'Consentimiento Implícito' (Implied Consent) de Alaska,
    al conducir un vehículo motorizado, ¿qué ha aceptado usted?
  choices:
    A: Llevar siempre a un pasajero
    B: Una prueba química de su aliento o sangre para detectar alcohol o drogas
    C: Permitir que cualquier oficial de policía registre su casa
    D: Pagar un impuesto de conducción anual obligatorio
  answer: B
  explanation: La ley de Consentimiento Implícito de Alaska significa que, al operar
    un vehículo, usted acepta someterse a una prueba química de su aliento, sangre
    u orina si es arrestado legalmente por conducir bajo la influencia (DUI).
- id: 34
  category: driver_testing
  question: Cuando un autobús escolar se detiene en una carretera de dos carriles
    con sus luces rojas intermitentes y el brazo de parada extendido, ¿quién debe
    detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que viene de frente al autobús
    C: El tráfico en ambas direcciones
    D: Nadie, si hay al menos dos carriles
  answer: C
  explanation: En una carretera de dos carriles en Alaska, el tráfico en ambas direcciones
    debe detenerse ante un autobús escolar con luces rojas intermitentes y un brazo
    de parada extendido.
- id: 35
  category: driver_testing
  question: En Alaska, ¿es ilegal estacionar un vehículo a menos de cuántos pies de
    un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: De acuerdo con las regulaciones de conducción de Alaska, no se puede
    estacionar a menos de 15 pies de un hidrante de incendios.
- id: 36
  category: driver_testing
  question: 'La ley de Alaska exige que se enciendan las luces delanteras cuando la
    visibilidad se reduce a menos de:'
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: Las luces delanteras deben usarse en Alaska siempre que la visibilidad
    sea inferior a 1,000 pies debido a las condiciones climáticas o de iluminación.
- id: 37
  category: driver_testing
  question: Para los conductores que viven al sur de los 60 grados de latitud norte
    (por ejemplo, Juneau, Anchorage), ¿entre qué fechas se permiten generalmente los
    neumáticos con clavos?
  choices:
    A: Del 1 de octubre al 1 de abril
    B: Del 15 de septiembre al 1 de mayo
    C: Del 15 de septiembre al 15 de abril
    D: Del 1 de noviembre al 31 de marzo
  answer: C
  explanation: En Alaska, al sur de los 60 grados de latitud norte, los neumáticos
    con clavos son legales desde el 15 de septiembre hasta el 15 de abril. Al norte
    de los 60 grados, son legales hasta el 1 de mayo.
- id: 38
  category: driver_testing
  question: ¿Cuál es la señal manual correcta para indicar que está disminuyendo la
    velocidad o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido hacia afuera
  answer: C
  explanation: Para señalar una parada o una disminución de la velocidad mediante
    señales manuales, el conductor debe extender el brazo izquierdo por la ventana
    y apuntar hacia abajo.
- id: 39
  category: driver_testing
  question: En Alaska, ¿cuál es la sanción por exceso de velocidad en una zona de
    obras viales designada o en un corredor de seguridad vial?
  choices:
    A: Una multa fija de $500
    B: El doble de la multa normal
    C: El triple de la multa normal
    D: Suspensión automática de la licencia por 30 días
  answer: B
  explanation: La ley de Alaska exige que las multas por infracciones de tráfico se
    dupliquen cuando se cometen en una zona de obras viales designada o en un corredor
    de seguridad vial.
- id: 40
  category: driver_testing
  question: ¿El Manual del Conductor de Alaska recomienda una distancia de seguimiento
    de al menos cuántos segundos detrás del vehículo que va delante de usted en condiciones
    ideales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: Aunque muchos estados utilizan la regla de los 2 o 3 segundos, el Manual
    del Conductor de Alaska recomienda una distancia de seguimiento de 4 segundos
    para permitir un mejor tiempo de reacción, especialmente ante posibles peligros
    en la carretera.
- id: 41
  category: driver_testing
  question: ¿Cuál es la sentencia mínima obligatoria de cárcel por una primera condena
    por DUI en el estado de Alaska?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 10 días
  answer: C
  explanation: En Alaska, una primera condena por DUI (conducir bajo la influencia)
    conlleva una sentencia mínima obligatoria de 72 horas consecutivas de cárcel.
- id: 42
  category: driver_testing
  question: 'Al acercarse a un vehículo de emergencia estacionado con sus luces intermitentes
    encendidas en una autopista de varios carriles, la ley de ''Moverse a un lado''
    (Move Over) de Alaska le exige:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero tocar la bocina
    C: Desocupar el carril más cercano al vehículo de emergencia si es seguro hacerlo
    D: Acelerar para rebasar el vehículo rápidamente
  answer: C
  explanation: La ley Move Over de Alaska exige que los conductores se cambien a un
    carril no adyacente o reduzcan la velocidad significativamente si cambiar de carril
    no es seguro al pasar vehículos de emergencia al costado de la carretera.
- id: 43
  category: driver_testing
  question: Al entrar en una glorieta (rotonda) en Alaska, ¿quién tiene el derecho
    de paso?
  choices:
    A: El tráfico que entra a la glorieta
    B: El tráfico que ya está en la glorieta
    C: El vehículo que viaja a la velocidad más alta
    D: El vehículo que entra por la derecha
  answer: B
  explanation: Los conductores que entran en una glorieta deben ceder el derecho de
    paso al tráfico que ya circula dentro de la intersección.
- id: 44
  category: driver_testing
  question: 'En Alaska, debe bajar las luces altas de sus faros cuando siga a otro
    vehículo a una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Alaska exige que los conductores bajen las luces altas al
    acercarse a un vehículo en sentido contrario a menos de 500 pies o cuando sigan
    a otro vehículo a menos de 300 pies.
- id: 45
  category: driver_testing
  question: En Alaska, ¿cuál es el límite de velocidad predeterminado en un distrito
    comercial a menos que se indique lo contrario?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Según el Manual del Conductor de Alaska, el límite de velocidad en
    un distrito comercial es de 20 mph, a menos que las señales indiquen lo contrario.
- id: 46
  category: driver_testing
  question: Al estacionar su vehículo cerca de un hidrante de incendios en Alaska,
    ¿cuál es la distancia mínima requerida que debe mantener?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Alaska prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 47
  category: driver_testing
  question: En Alaska, ¿con cuántos pies de antelación, como mínimo, debe señalizar
    su intención de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: El Manual del Conductor de Alaska establece que debe dar una señal
    de giro continua durante al menos 100 pies antes de girar.
- id: 48
  category: driver_testing
  question: Según la ley de Alaska, ¿cuándo es obligatorio tener los faros encendidos?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde una hora después del atardecer hasta una hora antes del amanecer
    C: Desde media hora después del atardecer hasta media hora antes del amanecer
    D: Solo cuando la visibilidad es inferior a 1,000 pies
  answer: C
  explanation: La ley de Alaska exige que los faros estén encendidos desde media hora
    después del atardecer hasta media hora antes del amanecer, o en cualquier momento
    en que la visibilidad sea inferior a 1,000 pies.
- id: 49
  category: driver_testing
  question: En Alaska, ¿cuál es la cobertura mínima requerida de seguro de responsabilidad
    civil por la muerte o lesiones de dos o más personas en un solo accidente?
  choices:
    A: $25,000
    B: $50,000
    C: $100,000
    D: $150,000
  answer: C
  explanation: La ley de seguro obligatorio de Alaska exige una cobertura de '50/100/25',
    lo que significa $100,000 por la muerte o lesiones de dos o más personas en un
    accidente.
- id: 50
  category: driver_testing
  question: Según el sistema de puntos de Alaska, ¿cuántos puntos se asignan por una
    condena de 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 10 puntos
  answer: D
  explanation: La conducción temeraria (Reckless Driving) es una infracción grave
    en Alaska y resulta en la adición de 10 puntos a su historial de conducción.
- id: 51
  category: driver_testing
  question: ¿A cuántos pies de una señal de alto (stop), una baliza intermitente o
    una señal de ceda el paso (yield) está prohibido estacionar su vehículo en Alaska?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: La ley de Alaska prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de ceda el paso ubicada al costado
    de una carretera.
- id: 52
  category: driver_testing
  question: Para los conductores de 21 años o más en Alaska, es ilegal conducir con
    una concentración de alcohol en sangre (BAC) de ____ o superior.
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En Alaska, el límite legal de BAC para conductores de 21 años o más
    es de 0.08%.
- id: 53
  category: driver_testing
  question: 'Al conducir en una carretera en Alaska con un límite de velocidad de
    45 mph o superior, debe atenuar sus luces altas cuando siga a otro vehículo a
    una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Manual del Conductor de Alaska establece que debe atenuar sus faros
    cuando siga a otro vehículo a menos de 500 pies.
- id: 54
  category: driver_testing
  question: En las áreas de Alaska al sur de los 60 grados de latitud norte (como
    Anchorage y Juneau), ¿entre qué fechas se permiten generalmente los neumáticos
    con clavos?
  choices:
    A: Del 1 de octubre al 15 de abril
    B: Del 15 de septiembre al 1 de mayo
    C: Del 1 de septiembre al 15 de mayo
    D: Del 1 de noviembre al 1 de abril
  answer: B
  explanation: En Alaska, al sur de los 60 grados de latitud norte, se permiten neumáticos
    con clavos desde el 15 de septiembre hasta el 1 de mayo.
- id: 55
  category: driver_testing
  question: 'Bajo la ley de ''Consentimiento Implícito'' (Implied Consent) de Alaska,
    si se niega a realizar una prueba química para determinar su BAC, su licencia
    de conducir será:'
  choices:
    A: Suspendida por 30 días
    B: Revocada
    C: Marcada con una advertencia
    D: Sin cambios a menos que sea condenado por un DUI
  answer: B
  explanation: Al conducir en Alaska, usted ha dado su consentimiento para una prueba
    química. La negativa resulta en la incautación inmediata y la revocación de su
    licencia de conducir.
- id: 56
  category: driver_testing
  question: 'En Alaska, un niño menor de 4 años que pese menos de 40 libras debe estar:'
  choices:
    A: En un asiento elevador (booster seat)
    B: En un asiento de seguridad para niños aprobado por el gobierno federal
    C: En el asiento delantero con cinturón de seguridad
    D: En el regazo de un adulto
  answer: B
  explanation: La ley de Alaska exige que los niños menores de 4 años que pesen menos
    de 40 libras estén debidamente asegurados en un asiento de seguridad para niños.
- id: 57
  category: driver_testing
  question: 'Al estacionar en una colina con bordillo (curb) en Alaska, si se dirige
    cuesta arriba, debe girar sus ruedas delanteras:'
  choices:
    A: Hacia el bordillo
    B: Hacia afuera del bordillo
    C: Paralelas al bordillo
    D: Hacia la derecha
  answer: B
  explanation: Al estacionar cuesta arriba contra un bordillo, gire las ruedas hacia
    afuera del bordillo para que, si el vehículo rueda, la parte trasera de la llanta
    delantera golpee el bordillo y detenga el automóvil.
- id: 58
  category: driver_responsibility
  question: 'Si lo sorprenden conduciendo en Alaska sin el seguro de responsabilidad
    civil requerido por primera vez, sus privilegios de conducir serán suspendidos
    por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Según la Ley de Seguro Obligatorio, una primera infracción por conducir
    sin seguro resulta en una suspensión de la licencia de conducir de 90 días.
- id: 59
  category: driver_responsibility
  question: 'En Alaska, debe notificar de inmediato al departamento de policía local
    o a los Alaska State Troopers sobre un accidente si este involucra lesiones, muerte
    o daños a la propiedad por un total de al menos:'
  choices:
    A: $200
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: La ley de Alaska exige la notificación inmediata a las autoridades
    policiales de cualquier accidente que involucre lesiones, muerte o daños a la
    propiedad por un total de $500 o más.
- id: 60
  category: driver_responsibility
  question: Al vender un vehículo en Alaska, ¿dentro de cuántos días debe el vendedor
    notificar al DMV sobre la transferencia de propiedad?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: El vendedor está obligado a presentar un Aviso de Transferencia de
    Vehículo al DMV dentro de los 10 días posteriores a la venta para protegerse de
    cualquier responsabilidad.
- id: 61
  category: driver_responsibility
  question: Según la ley de "Consentimiento Implícito" de Alaska, ¿cuál es la sanción
    por negarse por primera vez a someterse a una prueba química de aliento?
  choices:
    A: Solo una multa de $100
    B: Una suspensión de la licencia por 30 días
    C: Las mismas sanciones que una condena por DUI, incluida la revocación de la
      licencia
    D: No hay sanción si no está realmente ebrio
  answer: C
  explanation: Negarse a someterse a una prueba química es un delito menor de clase
    A en Alaska y conlleva las mismas sanciones mínimas obligatorias que una condena
    por DUI.
- id: 62
  category: driver_responsibility
  question: En Alaska, las multas de tráfico se duplican cuando ocurre una infracción
    en ¿cuál de las siguientes áreas?
  choices:
    A: Zonas escolares y corredores de seguridad vial (Traffic Safety Corridors)
    B: Vecindarios residenciales
    C: Estacionamientos
    D: Caminos de grava
  answer: A
  explanation: Las multas por infracciones de movimiento se duplican en los corredores
    de seguridad vial designados y en las zonas escolares activas en Alaska.
- id: 63
  category: driver_responsibility
  question: Si se le condena por exceso de velocidad de 15 mph o más sobre el límite
    en Alaska, ¿cuántos puntos se añadirán a su historial de conducción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Conducir a 15 mph o más sobre el límite resulta en 6 puntos. Conducir
    a 10-14 mph sobre el límite resulta en 4 puntos, y de 1-9 mph sobre el límite
    resulta en 2 puntos.
- id: 64
  category: driver_responsibility
  question: En Alaska, si es condenado por un DUI, se le requerirá usar un dispositivo
    de bloqueo de encendido (IID) durante al menos ¿cuánto tiempo después de que se
    restablezca su licencia?
  choices:
    A: 6 meses
    B: Toda la duración de su libertad condicional
    C: 1 año
    D: 3 meses
  answer: B
  explanation: La ley de Alaska exige la instalación de un dispositivo de bloqueo
    de encendido (IID) durante todo el período de libertad condicional tras una condena
    por DUI.
- id: 65
  category: driver_responsibility
  question: Si su licencia de conducir de Alaska es revocada por un DUI, ¿por cuántos
    años debe presentar una prueba de responsabilidad financiera (seguro SR-22)?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: Tras la revocación de la licencia por un DUI u ofensa similar, Alaska
    exige que el conductor mantenga el seguro SR-22 durante 3 años.
- id: 66
  category: driver_responsibility
  question: Al mudarse a Alaska, ¿dentro de cuántos días después de conseguir empleo
    o establecer su residencia debe registrar su vehículo?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: A
  explanation: Los nuevos residentes deben registrar sus vehículos en Alaska dentro
    de los 10 días posteriores a su entrada al estado o al obtener empleo.
- id: 67
  category: driver_responsibility
  question: ¿Cuántos puntos se añaden a su historial de conducción de Alaska por no
    detenerse ante un autobús escolar que tiene sus luces rojas parpadeando y el brazo
    de parada extendido?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Rebasar ilegalmente a un autobús escolar detenido con las luces rojas
    parpadeando es una infracción grave en Alaska y conlleva una penalización de 6
    puntos.
- id: 68
  category: driver_responsibility
  question: En Alaska, ¿cuándo se considera que una licencia de conducir está "en
    riesgo" de suspensión por acumulación de puntos en un período de 24 meses?
  choices:
    A: 6 puntos
    B: 9 puntos
    C: 12 puntos
    D: 18 puntos
  answer: D
  explanation: El DMV suspenderá su licencia si acumula 12 puntos en 12 meses o 18
    puntos en 24 meses.
- id: 69
  category: driver_responsibility
  question: En Alaska, ¿cuántos puntos se asignan a su historial de conducción por
    una condena de "Conducción Temeraria" (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: La conducción temeraria es una infracción mayor en Alaska y resulta
    en la adición de 6 puntos al historial del conductor.
- id: 70
  category: driver_responsibility
  question: ¿A qué nivel de puntos le enviará el DMV de Alaska una carta de advertencia
    oficial sobre su historial de conducción?
  choices:
    A: Cuando acumula 6 puntos en 12 meses
    B: Cuando acumula 3 puntos en 6 meses
    C: Cuando acumula 12 puntos en 24 meses
    D: Después de su primera multa por exceso de velocidad
  answer: A
  explanation: El DMV de Alaska envía una carta de advertencia a los conductores que
    acumulan 6 puntos en un período de 12 meses o 9 puntos en un período de 24 meses.
- id: 71
  category: driver_responsibility
  question: ¿En Alaska, si lo sorprenden conduciendo un vehículo motorizado sin el
    seguro de responsabilidad civil requerido, cuál es la sanción por una primera
    infracción?
  choices:
    A: Una multa de $50 solamente
    B: Una suspensión obligatoria de la licencia de conducir por 90 días
    C: Incautación del vehículo por un año
    D: Revocación permanente de la licencia de conducir
  answer: B
  explanation: Conducir sin el seguro de responsabilidad civil obligatorio en Alaska
    resulta en una suspensión obligatoria de 90 días de su licencia de conducir por
    una primera infracción.
- id: 72
  category: driver_responsibility
  question: ¿Con qué frecuencia se debe renovar el registro del vehículo para la mayoría
    de los vehículos de pasajeros estándar en Alaska?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada cinco años
    D: Solo cuando el vehículo cambia de propietario
  answer: B
  explanation: Los registros de vehículos en Alaska son generalmente bienales, lo
    que significa que deben renovarse cada dos años.
- id: 73
  category: driver_responsibility
  question: Al comprar un vehículo en Alaska, ¿dentro de cuántos días después de la
    compra debe el comprador solicitar un nuevo título y registro?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: El comprador de un vehículo debe solicitar la transferencia del título
    y el registro dentro de los 30 días posteriores a la fecha de venta.
- id: 74
  category: driver_responsibility
  question: En Alaska, ¿cuántos puntos se añaden a su historial por exceder el límite
    de velocidad señalizado por 15 millas por hora o más?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Exceder el límite de velocidad por 15 mph o más resulta en 6 puntos
    en el historial de conducción de Alaska. (De 3 a 9 mph por encima son 2 puntos;
    de 10 a 14 mph por encima son 4 puntos).
- id: 75
  category: driver_responsibility
  question: Si su licencia es revocada por un DUI en Alaska, ¿qué debe proporcionar
    al DMV para que se le restituyan sus privilegios de conducir?
  choices:
    A: Prueba de finalización de un programa de educación sobre el alcohol (ADERE)
    B: Una carta de recomendación de un juez
    C: Prueba de la compra de un vehículo nuevo
    D: Una calificación aprobatoria en el examen de conductor comercial
  answer: A
  explanation: Para restituir una licencia después de un DUI, debe completar un programa
    de Información de Rehabilitación y Educación sobre Alcohol y Drogas (ADERE), pagar
    las tarifas de restitución y proporcionar una prueba de responsabilidad financiera
    (SR-22).
- id: 76
  category: driver_responsibility
  question: 'En Alaska, un conductor que está obligado a presentar un SR-22 (Prueba
    de Responsabilidad Financiera) generalmente debe mantenerlo por un período de:'
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 10 años
  answer: C
  explanation: Normalmente se requiere que un SR-22 se mantenga en los archivos del
    DMV durante tres años después de una condena que active el requisito.
- id: 77
  category: driver_responsibility
  question: En Alaska, ¿qué vehículos son elegibles para el 'Registro Permanente',
    lo que significa que el registro no vence mientras el propietario sea el mismo?
  choices:
    A: Vehículos que tienen 8 años de antigüedad o más
    B: Solo vehículos eléctricos
    C: Cualquier vehículo propiedad de una persona mayor de 65 años
    D: Vehículos utilizados únicamente para la agricultura
  answer: A
  explanation: En Alaska, los propietarios de vehículos que tienen 8 años de antigüedad
    o más pueden optar por tener un registro permanente que no requiere renovación
    bienal.
- id: 78
  category: driver_responsibility
  question: Si usted se ve involucrado en un accidente en Alaska y no tiene el seguro
    requerido, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 30 días
    B: 6 meses
    C: Hasta 3 años
    D: Hasta que pague una multa de $1,000
  answer: C
  explanation: Si usted está en un accidente y no tiene seguro, su licencia puede
    ser suspendida por hasta tres años o hasta que proporcione una prueba de responsabilidad
    financiera y cumpla con otros requisitos.
- id: 79
  category: driver_responsibility
  question: ¿Existen áreas específicas en Alaska donde el seguro de vehículos motorizados
    NO es obligatorio?
  choices:
    A: En la ciudad de Anchorage
    B: En áreas donde no se requiere el registro del vehículo
    C: En todas las propiedades privadas en todo el estado
    D: El seguro es obligatorio en todo Alaska sin excepción
  answer: B
  explanation: En Alaska, se requiere el seguro obligatorio en las áreas donde se
    requiere el registro. En áreas remotas donde no se requiere el registro, el seguro
    tampoco es obligatorio por ley.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima a la que debe estacionarse de una señal de
    alto, una baliza intermitente o una señal de ceda el paso en Alaska?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Las regulaciones de Alaska establecen que no se puede estacionar a
    menos de 30 pies de cualquier baliza intermitente, señal de alto o señal de ceda
    el paso ubicada al costado de una carretera.
- id: 81
  category: safe_driving_rules
  question: ¿A menos que se indique lo contrario, cuál es el límite de velocidad en
    un callejón en Alaska?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad predeterminado para cualquier callejón en Alaska
    es de 15 mph, a menos que las señales indiquen lo contrario.
- id: 82
  category: safe_driving_rules
  question: Según la ley de Alaska, ¿cuándo es legal rebasar a otro vehículo por la
    derecha?
  choices:
    A: Cuando el vehículo de adelante está girando o está a punto de girar a la izquierda
      y hay un acotamiento pavimentado
    B: Siempre que tenga prisa y el carril izquierdo esté bloqueado
    C: Solo en carreteras de grava con múltiples carriles
    D: Nunca es legal rebasar por la derecha en Alaska
  answer: A
  explanation: En Alaska, puede rebasar por la derecha solo cuando el vehículo alcanzado
    está girando o está a punto de girar a la izquierda, o en una calle o carretera
    con pavimento sin obstrucciones no ocupado por vehículos estacionados y con ancho
    suficiente para dos o más líneas de vehículos en movimiento en cada dirección.
- id: 83
  category: safe_driving_rules
  question: 'En Alaska, usted NO tiene que detenerse ante un autobús escolar con sus
    luces rojas intermitentes y el brazo de parada extendido si:'
  choices:
    A: Viaja en la dirección opuesta en una carretera de dos o más carriles
    B: Viaja en la dirección opuesta en una carretera dividida con una barrera física
      o mediana
    C: El autobús está detenido en una zona escolar
    D: Viaja al menos 10 mph por debajo del límite de velocidad
  answer: B
  explanation: Los conductores que viajan en la dirección opuesta en una carretera
    dividida con una barrera física (como una mediana o zanja) no están obligados
    a detenerse ante un autobús escolar en Alaska.
- id: 84
  category: safe_driving_rules
  question: ¿A cuántos pies de distancia debe estacionarse de un paso de peatones
    en una intersección en Alaska?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: C
  explanation: La ley de Alaska prohíbe estacionarse a menos de 20 pies de un paso
    de peatones en una intersección.
- id: 85
  category: safe_driving_rules
  question: ¿Qué sucede con las multas de tráfico en las zonas de obras viales designadas
    de Alaska cuando hay trabajadores presentes?
  choices:
    A: Se triplican
    B: Se duplican
    C: Se mantienen igual pero se añaden 2 puntos
    '0': Se reducen si conducía de forma segura
  answer: B
  explanation: En Alaska, las multas por infracciones de tráfico cometidas en zonas
    de obras viales designadas o corredores de seguridad vial se duplican.
- id: 86
  category: safe_driving_rules
  question: Al usar señales manuales para indicar un giro, ¿qué posición representa
    un giro a la derecha en Alaska?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido hacia afuera
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    y la mano extendidos hacia arriba.
- id: 87
  category: safe_driving_rules
  question: En una intersección en T no controlada en Alaska, ¿quién tiene el derecho
    de paso?
  choices:
    A: El conductor en la calle que termina
    B: El conductor en la calle continua
    C: El conductor que llega primero
    D: El conductor a la izquierda
  answer: B
  explanation: En una intersección en T donde no hay dispositivos de control de tráfico,
    el conductor en la calle que termina debe ceder el derecho de paso a los vehículos
    en la calle continua.
- id: 88
  category: safe_driving_rules
  question: En Alaska, ¿a cuántos pies de la entrada de una estación de bomberos no
    se puede estacionar en el mismo lado de la calle?
  choices:
    A: 15 pies
    B: 20 pies
    C: 50 pies
    D: 75 pies
  answer: B
  explanation: La ley de Alaska prohíbe estacionarse a menos de 20 pies de la entrada
    del camino de acceso a cualquier estación de bomberos.
- id: 89
  category: safe_driving_rules
  question: 'En Alaska, las vueltas en U están prohibidas en una curva o colina donde
    el vehículo no pueda ser visto por otros conductores que se aproximen desde cualquier
    dirección dentro de:'
  choices:
    A: 500 pies
    B: 750 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Según el Manual del Conductor de Alaska, no puede realizar una vuelta
    en U en una curva o cerca de la cima de una colina donde su vehículo no pueda
    ser visto por otros conductores dentro de los 1,000 pies.
- id: 90
  category: safe_driving_rules
  question: Bajo la 'Ley de Hacerse a un Lado' (Move Over Law) de Alaska, ¿qué debe
    hacer al acercarse a un vehículo de emergencia con luces intermitentes detenido
    a un lado de una carretera de varios carriles?
  choices:
    A: Detenerse por completo hasta que se le indique pasar
    B: Mantener la velocidad pero tocar la bocina
    C: Moverse al carril izquierdo si es seguro hacerlo, o reducir la velocidad significativamente
    D: Aumentar la velocidad para pasar el área rápidamente
  answer: C
  explanation: La ley de Alaska exige que los conductores desocupen el carril más
    cercano a un vehículo de emergencia estacionado o reduzcan la velocidad a una
    que sea razonable y prudente si cambiar de carril no es seguro.
- id: 91
  category: safe_driving_rules
  question: En Alaska, si conduce un vehículo de movimiento lento en una carretera
    de dos carriles y se forma una fila de tráfico detrás de usted, ¿debe hacerse
    a un lado cuando haya cuántos vehículos detrás de usted?
  choices:
    A: 3 o más
    B: 5 o más
    C: 7 o más
    D: 10 o más
  answer: B
  explanation: El Estatuto de Alaska 28.35.140 exige que los vehículos de movimiento
    lento se retiren de la calzada en la primera oportunidad segura si se forma una
    fila de 5 o más vehículos detrás de ellos.
- id: 92
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad no señalizado en una zona residencial
    de Alaska?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: El límite de velocidad predeterminado para las zonas residenciales
    en Alaska es de 25 mph, a menos que se indique lo contrario.
- id: 93
  category: safe_driving_rules
  question: Al estacionar cerca de una señal de alto (stop), una baliza intermitente
    o una señal de control de tráfico en Alaska, ¿a cuántos pies de distancia debe
    estar como mínimo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Alaska prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico ubicada al costado
    de una calzada.
- id: 94
  category: safe_driving_rules
  question: 'En Alaska, debe encender las luces delanteras si la visibilidad se reduce
    a menos de:'
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: Las luces delanteras deben usarse en Alaska cuando no hay suficiente
    luz para ver con claridad a una distancia de 1,000 pies.
- id: 95
  category: safe_driving_rules
  question: Al rebasar a otro vehículo en una carretera de dos carriles en Alaska,
    ¿debe regresar a su carril antes de estar a cuántos pies de un vehículo que viene
    en sentido contrario?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Debe completar el rebase y regresar a su carril antes de estar a menos
    de 200 pies de cualquier vehículo que se aproxime en dirección opuesta.
- id: 96
  category: safe_driving_rules
  question: 'Al entrar en una rotonda (glorieta) en Alaska, debe ceder el derecho
    de paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en el círculo
    C: Nadie, usted tiene el derecho de paso
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el paso al tráfico
    que ya está circulando dentro del círculo.
- id: 97
  category: safe_driving_rules
  question: 'Al conducir con niebla o nieve intensa en Alaska, debe usar:'
  choices:
    A: Luces delanteras de carretera (altas)
    B: Luces delanteras de cruce (bajas)
    C: Solo las luces de estacionamiento
    D: Luces de emergencia intermitentes
  answer: B
  explanation: Se deben usar las luces bajas en condiciones de niebla o nieve porque
    las luces altas se reflejan en la humedad o los cristales de hielo, lo que provoca
    deslumbramiento y reduce la visibilidad.
- id: 98
  category: defensive_driving
  question: Según el Manual del Conductor de Alaska, ¿cuál es la distancia de seguimiento
    recomendada detrás del vehículo que va delante de usted en condiciones ideales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: El Manual del Conductor de Alaska recomienda una distancia de seguimiento
    de cuatro segundos para permitir suficiente tiempo para reaccionar ante peligros
    o paradas repentinas.
- id: 99
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente,
    ¿con cuánta anticipación debe observar la carretera mientras conduce en Alaska?
  choices:
    A: 5 a 8 segundos
    B: 12 a 15 segundos
    C: 20 a 25 segundos
    D: 30 a 40 segundos
  answer: B
  explanation: Los conductores deben observar la carretera con una anticipación de
    12 a 15 segundos para identificar posibles peligros a tiempo y planificar sus
    respuestas.
- id: 100
  category: defensive_driving
  question: En Alaska, si conduce por una carretera y cinco o más vehículos le siguen
    por detrás debido a su baja velocidad, ¿qué está obligado a hacer?
  choices:
    A: Aumentar la velocidad al límite indicado inmediatamente
    B: Encender las luces de emergencia y continuar
    C: Hacerse a un lado en el primer apartadero (turnout) seguro para dejarlos pasar
    D: Mantener su velocidad y permanecer en el centro del carril
  answer: C
  explanation: La ley de Alaska exige que los vehículos de movimiento lento se retiren
    de la calzada en el primer apartadero seguro si se forma una fila de cinco o más
    vehículos detrás de ellos.
- id: 101
  category: defensive_driving
  question: ¿A cuántos pies de un vehículo que viene en sentido contrario debe atenuar
    las luces altas cuando conduce de noche en Alaska?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Alaska exige que los conductores atenúen sus luces altas
    cuando un vehículo que viene en sentido contrario se encuentra a menos de 500
    pies para evitar cegar al otro conductor.
- id: 102
  category: defensive_driving
  question: Si su vehículo comienza a hidroplanear en una carretera mojada de Alaska,
    ¿cuál es la mejor acción de conducción defensiva que debe tomar?
  choices:
    A: Frenar bruscamente para recuperar la tracción
    B: Girar el volante bruscamente hacia la derecha
    C: Levantar suavemente el pie del acelerador y mantener el volante recto
    D: Poner el auto en punto muerto (neutral) y bombear los frenos
  answer: C
  explanation: Si ocurre un hidroplaneo, debe quitar el pie del acelerador y dirigir
    el volante en línea recta. No frene ni gire repentinamente, ya que esto puede
    causar un derrape.
- id: 103
  category: defensive_driving
  question: Al conducir con niebla densa en Alaska, ¿qué luces debe usar para mantener
    la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo las luces de estacionamiento
    D: Luces intermitentes de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en la niebla. Las luces altas se reflejan
    en la niebla y crean un resplandor que dificulta la visión.
- id: 104
  category: defensive_driving
  question: Si encuentra un alce en o cerca de una carretera de Alaska, ¿cuál es la
    práctica de conducción defensiva más segura?
  choices:
    A: Tocar la bocina continuamente para ahuyentarlo
    B: Acelerar para pasarlo antes de que se mueva a su carril
    C: Reducir la velocidad, mantenerse alerta y estar preparado para detenerse
    D: Usar las luces altas para cegar al animal y que se quede quieto
  answer: C
  explanation: Los alces son impredecibles. Si ve uno, reduzca la velocidad y prepárese
    para detenerse, ya que pueden lanzarse repentinamente a la carretera.
- id: 105
  category: defensive_driving
  question: ¿Cuál es la forma correcta de usar los Sistemas de Frenos Antibloqueo
    (ABS) durante una parada de emergencia en una carretera resbaladiza de Alaska?
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante al pedal del freno
    C: Presionar ligeramente los frenos hasta detenerse
    D: Poner el auto en punto muerto y usar el freno de emergencia
  answer: B
  explanation: Con el sistema ABS, debe aplicar una presión firme y constante. El
    sistema 'bombeará' automáticamente los frenos por usted para evitar que se bloqueen.
- id: 106
  category: defensive_driving
  question: Si sus ruedas traseras comienzan a derrapar en una carretera helada de
    Alaska, ¿hacia qué lado debe girar el volante?
  choices:
    A: En la dirección opuesta al derrape
    B: En la dirección en la que derrapa la parte trasera del vehículo
    C: Mantenerlo perfectamente recto hasta que el auto se detenga
    D: Girar bruscamente hacia el arcén de la carretera
  answer: B
  explanation: Para recuperarse de un derrape, gire el volante en la dirección en
    la que se desliza la parte trasera del vehículo. Esto ayuda a realinear las ruedas
    delanteras con las traseras.
- id: 107
  category: defensive_driving
  question: Al conducir en condiciones invernales en Alaska, ¿por qué es peligroso
    usar el control de crucero (cruise control)?
  choices:
    A: Consume más combustible en climas fríos
    B: Puede hacer que las ruedas giren sin control y pierdan tracción en superficies
      resbaladizas
    C: Desactiva la calefacción del vehículo
    D: Es ilegal usar el control de crucero en Alaska durante los meses de invierno
  answer: B
  explanation: El control de crucero puede ser peligroso en carreteras heladas o mojadas
    porque puede intentar mantener la velocidad haciendo que las ruedas patinen, lo
    que provoca una pérdida de control.
- id: 108
  category: defensive_driving
  question: Al conducir un vehículo equipado con el Sistema de Frenos Antibloqueo
    (ABS) en carreteras heladas de Alaska, ¿cómo debe aplicar los frenos en una emergencia?
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante sin soltar el pedal
    C: Presionar ligeramente los frenos para evitar el bloqueo
    D: Poner el auto en punto muerto y usar el freno de emergencia
  answer: B
  explanation: Con el ABS, debe aplicar una presión firme y constante. El sistema
    bombeará automáticamente los frenos por usted para evitar el bloqueo. Bombearlos
    manualmente anula el sistema.
- id: 109
  category: defensive_driving
  question: En Alaska, ¿cuál es la clasificación legal para un conductor sorprendido
    'enviando mensajes de texto mientras conduce' (leyendo o escribiendo una comunicación
    basada en texto)?
  choices:
    A: Una infracción de tráfico menor
    B: Un delito menor de Clase A (Class A Misdemeanor)
    C: Una violación que no es de movimiento
    D: Un delito grave (felony) en todos los casos
  answer: B
  explanation: Según el Estatuto de Alaska 28.35.161, conducir mientras un dispositivo
    con pantalla está en funcionamiento (enviar mensajes de texto) es un delito menor
    de Clase A, lo cual es una ofensa criminal seria.
- id: 110
  category: defensive_driving
  question: 'Con respecto a las leyes de cinturones de seguridad, Alaska es un estado
    de ''Aplicación primaria'' (Primary Enforcement). Esto significa que:'
  choices:
    A: Solo puede ser multado por una violación del cinturón de seguridad si lo detienen
      por otro motivo
    B: Un oficial de policía puede detenerlo y multarlo únicamente por no usar el
      cinturón de seguridad
    C: Los cinturones de seguridad solo son obligatorios para pasajeros menores de
      18 años
    D: Los cinturones de seguridad solo son obligatorios en autopistas, no en calles
      de la ciudad
  answer: B
  explanation: Alaska es un estado de aplicación primaria, lo que significa que las
    autoridades pueden detenerlo y emitir una multa específicamente por una violación
    del cinturón de seguridad, incluso si no se ha infringido ninguna otra ley.
- id: 111
  category: defensive_driving
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    le acerque por detrás en Alaska, usted debe:'
  choices:
    A: Detenerse exactamente donde está
    B: Acelerar para apartarse del camino
    C: Orillarse al borde derecho de la calzada y detenerse
    D: Moverse al carril izquierdo para dejar que pasen por la derecha
  answer: C
  explanation: La ley de Alaska exige que los conductores cedan el paso a los vehículos
    de emergencia acercándose lo más posible al borde derecho o a la acera de la calzada
    y deteniéndose hasta que el vehículo haya pasado.
- id: 112
  category: defensive_driving
  question: ¿Cuál de los siguientes es un lugar común donde es probable que se forme
    primero el "hielo negro" (black ice) en las carreteras de Alaska?
  choices:
    A: En medio de las intersecciones
    B: En puentes y pasos elevados
    C: En pendientes ascendentes pronunciadas
    D: En apartaderos de grava
  answer: B
  explanation: Los puentes y pasos elevados se congelan antes que las carreteras normales
    porque el aire frío circula tanto por encima como por debajo de la superficie
    de la carretera, lo que los convierte en lugares propicios para el hielo negro.
- id: 113
  category: alcohol_drugs_health
  question: 'En Alaska, se considera que un conductor de 21 años o más está conduciendo
    bajo la influencia (DUI) si su concentración de alcohol en sangre (BAC) es igual
    o superior a:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Según el Estatuto de Alaska 28.35.030, una persona es culpable de DUI
    si opera un vehículo motorizado con un BAC de 0.08% o superior.
- id: 114
  category: alcohol_drugs_health
  question: Para una primera condena por DUI en Alaska, ¿cuál es la multa mínima que
    se debe pagar?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: La ley de Alaska exige una multa mínima de $1,500 por una primera condena
    por DUI.
- id: 115
  category: alcohol_drugs_health
  question: 'En Alaska, si está operando un vehículo motorizado comercial, se considera
    legalmente intoxicado si su BAC es de:'
  choices:
    A: 0.01% o superior
    B: 0.04% o superior
    C: 0.08% o superior
    D: 0.10% o superior
  answer: B
  explanation: Para los conductores comerciales en Alaska, el límite legal de BAC
    es más bajo que para los conductores estándar, establecido en 0.04%.
- id: 116
  category: alcohol_drugs_health
  question: Tras una condena por DUI en Alaska, ¿por cuánto tiempo mínimo exigirá
    el tribunal la instalación de un dispositivo de bloqueo de encendido (IID) para
    una primera infracción?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: La duración del periodo de libertad condicional
  answer: B
  explanation: La ley de Alaska exige que los infractores de DUI por primera vez utilicen
    un dispositivo de bloqueo de encendido durante un mínimo de 6 meses después de
    que se restablezcan sus privilegios de conducción.
- id: 117
  category: alcohol_drugs_health
  question: Según la ley de "recipiente abierto" (Open Container) de Alaska, ¿dónde
    es legal llevar un recipiente de alcohol abierto en un vehículo?
  choices:
    A: En la guantera
    B: En la consola central
    C: En el maletero o detrás del último asiento vertical en un vehículo sin maletero
    D: Debajo del asiento del conductor
  answer: C
  explanation: El Estatuto de Alaska 28.35.029 prohíbe los recipientes abiertos de
    alcohol en el compartimento de pasajeros. Deben mantenerse en el maletero o en
    un área que no esté ocupada normalmente por el conductor o los pasajeros.
- id: 118
  category: alcohol_drugs_health
  question: En Alaska, ¿puede ser condenado por un DUI si conduce bajo la influencia
    de un medicamento recetado legalmente?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, el DUI solo se aplica al alcohol y a las drogas ilegales
    C: Sí, si el medicamento afecta su capacidad para conducir de forma segura
    D: Sí, pero solo si también tiene alcohol en su sistema
  answer: C
  explanation: Las leyes de DUI de Alaska se aplican a cualquier sustancia controlada
    o inhalante que afecte su capacidad para conducir, independientemente de si fue
    recetada legalmente.
- id: 119
  category: alcohol_drugs_health
  question: 'Si es condenado por un segundo DUI en un plazo de 15 años en Alaska,
    su licencia de conducir será revocada por al menos:'
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Una segunda condena por DUI dentro de un periodo de 15 años en Alaska
    resulta en un periodo mínimo obligatorio de revocación de la licencia de 1 año.
- id: 120
  category: alcohol_drugs_health
  question: 'En Alaska, negarse a someterse a una prueba química de aliento cuando
    lo solicita un oficial de la ley es:'
  choices:
    A: No es un delito, pero conlleva una multa
    B: Un delito penal independiente con sanciones iguales o superiores a un DUI
    C: Solo una infracción si más tarde se le declara culpable de DUI
    D: Permitido si no ha hablado con un abogado
  answer: B
  explanation: La negativa a someterse a una prueba química (Breath Test Refusal)
    es un delito menor de clase A en Alaska y conlleva las mismas sanciones mínimas
    obligatorias que una condena por DUI.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al consumo
    de marihuana y la conducción en Alaska?
  choices:
    A: Es legal conducir después de consumir marihuana porque es legal para uso recreativo
    B: Solo se le puede acusar de conducir bajo los efectos del alcohol o drogas (DUI)
      si está fumando mientras conduce
    C: Conducir bajo la influencia de la marihuana es un delito, al igual que conducir
      bajo la influencia del alcohol
    D: La marihuana no afecta la capacidad de conducción como lo hace el alcohol
  answer: C
  explanation: A pesar de la legalización de la marihuana recreativa en Alaska, conducir
    bajo los efectos de la marihuana sigue siendo un delito penal de DUI.
- id: 122
  category: alcohol_drugs_health
  question: 'Si tiene una condición médica que pueda afectar su capacidad para operar
    un vehículo motorizado de manera segura, usted debe:'
  choices:
    A: Informar únicamente a su compañía de seguros
    B: Informar de la condición al DMV de Alaska
    C: Dejar de conducir inmediatamente y entregar su licencia de forma permanente
    D: Conducir únicamente durante las horas del día
  answer: B
  explanation: Los conductores en Alaska están obligados a notificar al DMV sobre
    cualquier condición física o mental que pueda afectar su capacidad para conducir
    de manera segura.
- id: 123
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' en el contexto de la seguridad al conducir?
  choices:
    A: El efecto de mezclar diferentes tipos de alcohol
    B: El efecto combinado del alcohol y las drogas, que es mayor que la suma de sus
      efectos individuales
    C: El tiempo de recuperación necesario después de beber
    D: La velocidad a la que el hígado procesa el alcohol
  answer: B
  explanation: El efecto sinérgico ocurre cuando se consumen alcohol y drogas (incluso
    las de venta libre) juntos, lo que aumenta significativamente el deterioro más
    allá de lo que cualquiera de los dos causaría por sí solo.
- id: 124
  category: alcohol_drugs_health
  question: 'En Alaska, si usted está involucrado en un accidente fatal y se sospecha
    que conduce bajo los efectos del alcohol o drogas (DUI), se le puede requerir
    que proporcione:'
  choices:
    A: Solo una declaración por escrito
    B: Una muestra de sangre para análisis
    C: Una copia de su certificado de nacimiento
    D: Un testigo de buena conducta
  answer: B
  explanation: Según la ley de Alaska, si una persona se ve involucrada en un accidente
    que resulta en muerte o lesiones físicas graves, se puede administrar un análisis
    de sangre para determinar el contenido de alcohol o drogas.
- id: 125
  category: alcohol_drugs_health
  question: ¿Cuál es la única manera de reducir eficazmente su concentración de alcohol
    en sangre (BAC) antes de conducir?
  choices:
    A: Beber café negro cargado
    B: Tomar una ducha fría
    C: Darle tiempo a su cuerpo para procesar el alcohol
    D: Comer una comida pesada
  answer: C
  explanation: El tiempo es el único factor que reducirá el BAC. El café, las duchas
    y la comida no aceleran el metabolismo del alcohol en el hígado.
- id: 126
  category: alcohol_drugs_health
  question: Si se niega a someterse a una prueba química de aliento después de ser
    arrestado por conducir bajo los efectos del alcohol o drogas (DUI) en Alaska,
    ¿por cuántos días como mínimo se le revocará la licencia por una primera infracción?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: La negativa a someterse a una prueba química en Alaska resulta en una
    revocación obligatoria de la licencia de al menos 90 días por la primera infracción,
    que es la misma sanción administrativa que una condena por DUI.
- id: 127
  category: alcohol_drugs_health
  question: La ley de 'Contenedor Abierto' (Open Container) de Alaska prohíbe la posesión
    de una botella o receptáculo abierto que contenga una bebida alcohólica en ¿qué
    parte del vehículo?
  choices:
    A: Solo en el maletero
    B: En el compartimento de pasajeros del vehículo
    C: Solo en la guantera
    D: Detrás del último asiento vertical de un vehículo que no tenga maletero
  answer: B
  explanation: La ley de Alaska prohíbe llevar un contenedor abierto de alcohol en
    el compartimento de pasajeros de un vehículo motorizado. Debe guardarse en el
    maletero o, si el vehículo no tiene maletero, detrás del último asiento vertical.
- id: 128
  category: alcohol_drugs_health
  question: En Alaska, ¿cuánto tiempo permanece una condena por conducir bajo los
    efectos del alcohol o drogas (DUI) en su historial de manejo?
  choices:
    A: 5 años
    B: 10 años
    C: 15 años
    D: Permanentemente
  answer: D
  explanation: En Alaska, una condena por DUI forma parte permanente de su historial
    de manejo y no puede ser eliminada.
- id: 129
  category: alcohol_drugs_health
  question: 'Una tercera condena por conducir bajo los efectos del alcohol o drogas
    (DUI) dentro de un período de 10 años en Alaska se clasifica como:'
  choices:
    A: Delito menor de clase A
    B: Delito menor de clase B
    C: Felonía de clase C
    D: Infracción
  answer: C
  explanation: Según la ley de Alaska, una tercera condena por DUI en un plazo de
    10 años es una felonía de clase C, que conlleva penas significativamente más severas,
    incluyendo un mínimo de 120 días de cárcel.
- id: 130
  category: alcohol_drugs_health
  question: Bajo la ley de Tolerancia Cero (Zero Tolerance) de Alaska, a un conductor
    menor de 21 años al que se le encuentre cualquier cantidad medible de alcohol
    en su sistema se le revocará la licencia por ¿cuántos días por una primera infracción?
  choices:
    A: 10 días
    B: 30 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Para una primera infracción bajo la ley de Tolerancia Cero (menores
    de 21 años con un BAC de 0.01% o superior), el DMV de Alaska revocará la licencia
    del conductor por 30 días.
- id: 131
  category: alcohol_drugs_health
  question: ¿Si usted está tomando un medicamento recetado y este afecta su capacidad
    para conducir, puede ser arrestado por DUI en Alaska?
  choices:
    A: No, si el medicamento le fue recetado legalmente
    B: No, a menos que también haya consumido alcohol
    C: Sí, si el medicamento afecta sus capacidades físicas o mentales
    D: Sí, pero solo si excedió la dosis recetada
  answer: C
  explanation: En Alaska, usted puede ser arrestado por DUI (conducir bajo la influencia)
    si sus facultades están disminuidas por cualquier sustancia controlada, incluyendo
    los medicamentos recetados legalmente.
- id: 132
  category: alcohol_drugs_health
  question: En Alaska, si tiene una condición médica que le provoca convulsiones,
    ¿cuánto tiempo debe pasar generalmente sin tener convulsiones antes de poder conducir
    legalmente?
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: 2 años
  answer: C
  explanation: Aunque el DMV revisa las condiciones médicas caso por caso, el requisito
    estándar en Alaska es típicamente haber estado sin convulsiones durante 6 meses,
    respaldado por un informe médico.
- id: 133
  category: alcohol_drugs_health
  question: Si usted se ve involucrado en un incidente de DUI en Alaska y un pasajero
    menor de 16 años estaba en su vehículo, ¿cuál es la consecuencia legal?
  choices:
    A: No hay ninguna sanción adicional
    B: Se considera un factor agravante que aumenta la sentencia mínima obligatoria
    C: Su licencia es revocada de por vida inmediatamente
    D: Solo se le acusa de una infracción por el uso del cinturón de seguridad
  answer: B
  explanation: Tener un pasajero menor de 16 años durante un DUI es un factor agravante
    en Alaska que puede resultar en un mayor tiempo de cárcel y multas más altas,
    y puede dar lugar a cargos adicionales como Poner en Peligro el Bienestar de un
    Menor.
- id: 134
  category: penalties_and_points
  question: Según la ley de Alaska, ¿cuál es el valor en puntos por una condena de
    'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción mayor en Alaska
    y conlleva una sanción de 6 puntos en el historial del conductor.
- id: 135
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una primera condena de DUI en Alaska (excluyendo
    costas judiciales y otros cargos)?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: En Alaska, la multa mínima por una primera infracción de DUI es de
    $1,500.
- id: 136
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'Rebasar ilegalmente un autobús escolar
    detenido' en Alaska?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Rebasar un autobús escolar detenido con sus luces rojas intermitentes
    es una infracción grave en Alaska y resulta en 6 puntos.
- id: 137
  category: penalties_and_points
  question: ¿Con qué frecuencia puede un conductor de Alaska completar un curso de
    conducción defensiva aprobado para reducir puntos en su historial de conducción?
  choices:
    A: Una vez cada 6 meses
    B: Una vez cada 12 meses
    C: Una vez cada 24 meses
    D: Una vez cada 5 años
  answer: B
  explanation: Alaska permite una reducción de 2 puntos por completar un curso de
    conducción defensiva, pero este crédito solo puede aplicarse una vez cada 12 meses.
- id: 138
  category: penalties_and_points
  question: En Alaska, ¿cuántos puntos se añaden a su historial por 'Seguir demasiado
    de cerca' (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
  explanation: Seguir demasiado de cerca es una infracción de 2 puntos según el programa
    de puntos del DMV de Alaska.
- id: 139
  category: penalties_and_points
  question: Después de una condena por DUI en Alaska, ¿por cuánto tiempo debe un conductor
    mantener generalmente el seguro SR-22 (prueba de responsabilidad financiera)?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: Los conductores condenados por DUI u otras infracciones mayores en
    Alaska generalmente deben mantener el seguro SR-22 durante 3 años.
- id: 140
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resulta en el mayor número de puntos
    (6 puntos) en Alaska?
  choices:
    A: Conducción descuidada (Careless driving)
    B: No detenerse ante un oficial de la paz
    C: Exceso de velocidad de 15 mph sobre el límite
    D: No ceder el paso
  answer: B
  explanation: No detenerse ante un oficial de la paz es una infracción mayor que
    conlleva 6 puntos. La conducción descuidada conlleva 2 puntos y el exceso de velocidad
    de 15 mph sobre el límite conlleva 4 puntos.
- id: 141
  category: penalties_and_points
  question: ¿En Alaska, cuántos puntos se asignan por una condena de 'Conducción descuidada'
    (Careless Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 0 puntos (solo multa)
  answer: A
  explanation: La conducción descuidada (Careless driving) es una infracción de 2
    puntos en Alaska, mientras que la conducción temeraria (Reckless driving) es una
    infracción de 6 puntos.
- id: 142
  category: penalties_and_points
  question: ¿En Alaska, por cuánto tiempo se requiere que un infractor de DUI por
    primera vez tenga instalado un Dispositivo de Bloqueo de Encendido (IID) después
    de que se restablezca su licencia?
  choices:
    A: 3 meses
    B: 6 meses
    C: La duración de su libertad condicional
    D: Al menos 6 meses, pero a menudo por la duración del período de revocación de
      la licencia
  answer: D
  explanation: Alaska requiere la instalación de un Dispositivo de Bloqueo de Encendido
    (IID) para todas las condenas por DUI. Para una primera infracción, generalmente
    se requiere por la duración del período de revocación (mínimo 90 días) más cualquier
    tiempo adicional ordenado por el tribunal.
- id: 143
  category: penalties_and_points
  question: ¿En Alaska, cuántos puntos se asignan a su historial de conducción por
    exceder el límite de velocidad por 15 mph o más?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: B
  explanation: De acuerdo con el sistema de puntos del DMV de Alaska, exceder el límite
    de velocidad por 15 mph o más resulta en la adición de 4 puntos a su historial
    de conducción.
- id: 144
  category: penalties_and_points
  question: Según la ley de Alaska, ¿cuál es el tiempo mínimo obligatorio de cárcel
    por una primera condena por DUI?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 10 días
  answer: C
  explanation: Una primera condena por DUI en Alaska conlleva una sentencia mínima
    obligatoria de 72 horas consecutivas de cárcel.
- id: 145
  category: penalties_and_points
  question: Si se le condena por no detenerse ante un autobús escolar que está cargando
    o descargando pasajeros en Alaska, ¿cuántos puntos se asignan?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: Rebasar un autobús escolar detenido con sus luces rojas intermitentes
    es una infracción de seguridad grave en Alaska y conlleva una penalización de
    6 puntos.
- id: 146
  category: penalties_and_points
  explanation: En Alaska, seguir a otro vehículo demasiado de cerca (tailgating) resulta
    en la adición de 2 puntos a su historial de conducción.
  question: ¿Cuántos puntos se asignan por 'Seguir demasiado de cerca' (Following
    too closely) en el estado de Alaska?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
- id: 147
  category: penalties_and_points
  question: Si un conductor de Alaska es condenado por conducir mientras su licencia
    está suspendida o revocada, ¿cuántos puntos se añaden a su historial?
  choices:
    A: 2 puntos
    B: 6 puntos
    C: 10 puntos
    D: 12 puntos
  answer: C
  explanation: Conducir mientras la licencia está suspendida o revocada es una infracción
    mayor y resulta en la asignación de 10 puntos.
- id: 148
  category: penalties_and_points
  question: ¿En Alaska, por cuánto tiempo debe instalarse un Dispositivo de Bloqueo
    de Encendido (IID) en el vehículo del infractor por una primera condena por DUI?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: B
  explanation: Para una primera condena por DUI en Alaska, generalmente se requiere
    que el conductor use un Dispositivo de Bloqueo de Encendido (IID) por un período
    de 6 meses después de que se restablezca su licencia.
- id: 149
  category: penalties_and_points
  question: ¿Cuál es el valor en puntos por no ceder el paso a un peatón en Alaska?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: No ceder el paso a un peatón o a otro vehículo es una infracción de
    4 puntos en el estado de Alaska.
- id: 150
  category: penalties_and_points
  question: ¿En Alaska, cuál es la multa para un conductor que no usa el cinturón
    de seguridad?
  choices:
    A: $15
    B: $50
    C: $100
    D: $250
  answer: A
  explanation: Según el Estatuto de Alaska 28.05.095, la multa por una infracción
    del cinturón de seguridad es de $15.
- id: 151
  category: penalties_and_points
  question: 'Si es condenado por un DUI (conducir bajo la influencia) en Alaska, se
    le requerirá mantener una prueba de responsabilidad financiera (seguro SR-22)
    por al menos:'
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: Tras una condena por DUI o la revocación de la licencia por negarse
    a una prueba, Alaska exige que el conductor mantenga el seguro SR-22 durante 3
    años por la primera infracción.
- id: 152
  category: sharing_the_road
  question: Según la ley de "Hacerse a un lado" (Move Over law) de Alaska, ¿qué debe
    hacer al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una autopista con dos o más carriles que circulan en la misma dirección?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero tocar la bocina
    C: Cambiarse al carril izquierdo si es seguro hacerlo, o reducir la velocidad
      significativamente
    D: Acelerar para rebasar el vehículo rápidamente
  answer: C
  explanation: El Estatuto de Alaska 28.35.185 exige que los conductores dejen libre
    el carril más cercano a un vehículo de emergencia estacionado o reduzcan la velocidad
    a una que sea segura y razonable para las condiciones climáticas y de la carretera.
- id: 153
  category: sharing_the_road
  question: Al seguir a un vehículo de emergencia que responde a una alarma en Alaska,
    ¿cuál es la distancia mínima legal de seguimiento?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Según el Estatuto de Alaska 28.35.180, es ilegal seguir a un vehículo
    de emergencia (como un camión de bomberos o una ambulancia) a menos de 500 pies
    cuando este responde a una emergencia.
- id: 154
  category: sharing_the_road
  question: Usted conduce por una autopista con una mediana física o barrera. Un autobús
    escolar está detenido en el lado opuesto de la mediana con las luces rojas intermitentes.
    ¿Qué le exige la ley de Alaska?
  choices:
    A: Detenerse y esperar a que las luces dejen de parpadear
    B: Reducir la velocidad a 15 mph y proceder con precaución
    C: No está obligado a detenerse
    D: Detenerse solo si hay niños cruzando la mediana
  answer: C
  explanation: En Alaska, los conductores que viajan en la dirección opuesta en una
    autopista dividida por una mediana o barrera física no están obligados a detenerse
    ante un autobús escolar.
- id: 155
  category: sharing_the_road
  question: En Alaska, ¿es legal la "división de carril" (lane splitting), es decir,
    una motocicleta que circula entre filas de vehículos detenidos o en movimiento
    en el mismo carril?
  choices:
    A: Sí, pero solo en tráfico pesado
    B: Sí, si la velocidad es inferior a 15 mph
    C: No, es ilegal
    D: Sí, se recomienda para reducir la congestión
  answer: C
  explanation: Según el Manual del Conductor de Alaska y las regulaciones de tráfico
    (13 AAC 02.427), las motocicletas tienen derecho al uso total de un carril, y
    la división de carril está prohibida.
- id: 156
  category: sharing_the_road
  question: Cuando un peatón utiliza un bastón blanco o un perro guía en una intersección
    en Alaska, ¿qué debe hacer un conductor?
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Continuar si el peatón no está directamente en su camino
    C: Detenerse por completo y tomar precauciones para evitar lesiones
    D: Reducir la velocidad y gritar instrucciones al peatón
  answer: C
  explanation: La ley de Alaska (13 AAC 02.175) exige que los conductores tomen las
    precauciones necesarias y se detengan por completo si es necesario para evitar
    lesionar a un peatón ciego que use un bastón o un perro guía.
- id: 157
  category: sharing_the_road
  question: Según la ley de Alaska, una bicicleta operada de noche debe estar equipada
    con un faro delantero visible desde al menos ¿cuántos pies?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Código Administrativo de Alaska (13 AAC 04.320) exige que las bicicletas
    utilizadas de noche tengan una lámpara en la parte delantera que emita una luz
    blanca visible desde una distancia de al menos 500 pies.
- id: 158
  category: sharing_the_road
  question: Al compartir la carretera con camiones grandes, ¿qué es la "Zona No" (No-Zone)?
  choices:
    A: El área donde los camiones no tienen permitido circular
    B: Los puntos ciegos alrededor del camión donde su vehículo desaparece de la vista
      del conductor
    C: La zona de velocidad restringida para vehículos comerciales
    D: El área reservada para las estaciones de pesaje de camiones
  answer: B
  explanation: La "Zona No" (No-Zone) se refiere a los grandes puntos ciegos detrás,
    delante y a ambos lados de un camión donde el conductor del camión no puede ver
    a otros vehículos.
- id: 159
  category: sharing_the_road
  question: En Alaska, si usted está girando a la derecha y un ciclista está en el
    carril para bicicletas o en el arcén a su derecha, ¿quién tiene el derecho de
    paso?
  choices:
    A: El vehículo motorizado, porque es más grande
    B: El ciclista
    C: Quien llegue primero a la intersección
    D: El vehículo motorizado, porque las bicicletas siempre deben ceder el paso a
      los autos
  answer: B
  explanation: Los ciclistas tienen los mismos derechos y responsabilidades que los
    automovilistas. Usted debe ceder el paso a un ciclista al girar cruzando su trayectoria.
- id: 160
  category: sharing_the_road
  question: ¿Cuál es la edad mínima para un pasajero en una motocicleta en Alaska,
    siempre que la motocicleta esté equipada con un asiento para pasajeros designado
    y reposapiés?
  choices:
    A: No hay una edad mínima establecida por el estado
    B: 5 años
    C: 8 años
    D: 12 años
  answer: A
  explanation: La ley de Alaska no especifica una edad mínima para los pasajeros de
    motocicletas, pero la motocicleta debe estar equipada con un asiento permanente
    y reposapiés para el pasajero.
- id: 161
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle estrecha, a menudo:'
  choices:
    A: Se mantendrá lo más cerca posible del bordillo derecho
    B: Se abrirá hacia la izquierda antes de girar
    C: Acelerará para completar el giro rápidamente
    D: Girará desde el carril situado más a la izquierda
  answer: B
  explanation: Los camiones grandes tienen un radio de giro amplio y, a menudo, necesitan
    abrirse hacia la izquierda para no chocar con el bordillo al realizar un giro
    a la derecha.
- id: 162
  category: sharing_the_road
  question: En Alaska, ¿es legal que una persona permanezca en la calzada con el fin
    de solicitar transporte (hacer autostop)?
  choices:
    A: Sí, en cualquier lugar del estado
    B: Sí, pero solo en autopistas con arcén (hombro)
    C: No, está prohibido por la ley estatal
    D: Sí, pero solo durante las horas del día
  answer: C
  explanation: Según la norma 13 AAC 02.175, ninguna persona puede permanecer en la
    calzada con el fin de solicitar transporte, aunque sí pueden estar en el arcén
    o en la acera.
- id: 163
  category: sharing_the_road
  question: 'Al seguir a una motocicleta en Alaska, debe mantener una distancia de
    seguimiento de al menos:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 4 segundos
    D: 10 segundos
  answer: C
  explanation: El Manual del Conductor de Alaska recomienda una distancia de seguimiento
    de al menos cuatro segundos al seguir a una motocicleta para permitir maniobras
    o paradas repentinas.
- id: 164
  category: sharing_the_road
  question: Si se ve involucrado en un choque con un vehículo comercial (camión),
    ¿qué información adicional debería intentar obtener además de la licencia de conducir?
  choices:
    A: El consumo de combustible del camión
    B: El nombre de la empresa de transporte y el número USDOT
    C: El peso de la carga
    D: El libro de registro del conductor de los últimos 30 días
  answer: B
  explanation: Cuando se está involucrado en un accidente con un vehículo comercial,
    es importante identificar al transportista (empresa) y el número de identificación
    USDOT que se muestra en el vehículo.
- id: 165
  category: sharing_the_road
  question: 'En Alaska, no debe seguir a un equipo de bomberos (camión de bomberos)
    que responda a una alarma de incendio a una distancia menor de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Según el Código Administrativo de Alaska (13 AAC 02.517), es ilegal
    seguir a un vehículo de bomberos que responda a una alarma a menos de 500 pies
    o conducir o estacionar dentro de la cuadra donde el vehículo de bomberos se ha
    detenido.
- id: 166
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir detrás de
    una motocicleta en Alaska para garantizar la seguridad?
  choices:
    A: 2 segundos
    B: 4 segundos
    C: El largo de 1 vehículo
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de Alaska recomienda una distancia de seguimiento
    de al menos 4 segundos al estar detrás de una motocicleta porque estas pueden
    detenerse mucho más rápido que otros vehículos y se ven afectadas más fácilmente
    por las condiciones de la carretera.
- id: 167
  category: sharing_the_road
  question: 'Según la ley de Alaska, si ve a un peatón que usa un bastón blanco o
    un perro guía, usted debe:'
  choices:
    A: Tocar la bocina para avisarles que usted está allí.
    B: Reducir la velocidad y estar preparado para detenerse para cederles el paso.
    C: Rodearlos rápidamente.
    D: Ceder el paso solo si están en un paso de peatones marcado.
  answer: B
  explanation: La ley de Alaska exige que los conductores cedan el paso a cualquier
    peatón total o parcialmente ciego que lleve un bastón blanco o use un perro guía,
    independientemente de si se encuentra en un paso de peatones.
- id: 168
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el conductor puede necesitar:'
  choices:
    A: Permanecer completamente en el carril derecho.
    B: Abrirse hacia la izquierda para completar el giro.
    C: Acelerar para despejar la intersección rápidamente.
    D: Girar solo desde el carril izquierdo.
  answer: B
  explanation: Los camiones grandes tienen un radio de giro amplio. Para no chocar
    con el bordillo, a menudo deben abrirse hacia la izquierda antes de girar a la
    derecha. Los conductores nunca deben intentar meterse entre el camión y el bordillo.
- id: 169
  category: sharing_the_road
  question: En Alaska, ¿qué indica una luz amarilla intermitente en un autobús escolar?
  choices:
    A: El autobús está a punto de detenerse y los niños están bajando.
    B: El autobús está averiado.
    C: El autobús se está preparando para detenerse para subir o bajar niños.
    D: El autobús va a exceso de velocidad.
  answer: C
  explanation: Las luces amarillas intermitentes en un autobús escolar significan
    que el autobús se está preparando para detenerse. Los conductores deben reducir
    la velocidad y prepararse para detener sus vehículos.
- id: 170
  category: sharing_the_road
  question: Según el Manual del Conductor de Alaska, al adelantar a un ciclista, ¿cuánto
    espacio debe dejar como mínimo entre su vehículo y la bicicleta?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 6 pies
  answer: C
  explanation: El Manual del Conductor de Alaska establece que los automovilistas
    deben dar a los ciclistas suficiente espacio y sugiere un mínimo de 3 pies de
    separación al adelantarlos.
- id: 171
  category: sharing_the_road
  question: 'Si está conduciendo y un vehículo delante de usted se ha detenido en
    un cruce de peatones para dejar pasar a un peatón, usted debe:'
  choices:
    A: Rebasar al vehículo detenido por la izquierda.
    B: Rebasar al vehículo detenido por la derecha.
    C: No rebasar al vehículo detenido.
    D: Tocar la bocina para decirle al peatón que se dé prisa.
  answer: C
  explanation: La ley de Alaska prohíbe rebasar a un vehículo que se ha detenido en
    un cruce de peatones para permitir que un peatón cruce, ya que el conductor que
    intenta rebasar podría no ver al peatón.
- id: 172
  category: sharing_the_road
  question: 'Por ley, los ciclistas en Alaska deben:'
  choices:
    A: Circular en sentido contrario al flujo del tráfico.
    B: Circular únicamente por las aceras.
    C: Obedecer las mismas leyes de tránsito que los conductores de vehículos motorizados.
    D: Nunca usar señales manuales.
  answer: C
  explanation: En Alaska, los ciclistas tienen los mismos derechos y responsabilidades
    que los automovilistas. Deben obedecer todas las señales de tráfico, letreros
    y marcas en el pavimento.
- id: 173
  category: vehicle_information
  question: En Alaska, para los residentes que viven al norte de los 60 grados de
    latitud norte, ¿entre qué fechas se permiten legalmente los neumáticos con clavos
    (studded tires)?
  choices:
    A: Del 1 de octubre al 15 de abril
    B: Del 15 de septiembre al 1 de mayo
    C: Del 1 de noviembre al 31 de marzo
    D: Del 1 de septiembre al 15 de mayo
  answer: B
  explanation: Según la ley de Alaska, para las áreas al norte de los 60 grados de
    latitud norte (que incluye Fairbanks y Anchorage), los neumáticos con clavos están
    permitidos desde el 15 de septiembre hasta el 1 de mayo.
- id: 174
  category: vehicle_information
  question: Según las leyes de equipamiento de vehículos de Alaska, ¿cuál es el polarizado
    máximo permitido para las ventanas laterales delanteras (conductor y pasajero
    delantero)?
  choices:
    A: Debe permitir al menos un 40% de transmisión de luz
    B: Debe permitir al menos un 50% de transmisión de luz
    C: Debe permitir al menos un 70% de transmisión de luz
    D: No se permite polarizado en las ventanas laterales
  answer: C
  explanation: En Alaska, las ventanas laterales delanteras deben tener una transmisión
    de luz de al menos el 70%.
- id: 175
  category: vehicle_information
  question: En Alaska, ¿cuál es el polarizado máximo permitido para las ventanas laterales
    traseras y la ventana trasera?
  choices:
    A: Debe permitir al menos un 20% de transmisión de luz
    B: Debe permitir al menos un 30% de transmisión de luz
    C: Debe permitir al menos un 40% de transmisión de luz
    D: Debe permitir al menos un 70% de transmisión de luz
  answer: C
  explanation: La ley de Alaska exige que las ventanas laterales traseras y la ventana
    trasera permitan al menos un 40% de transmisión de luz.
- id: 176
  category: vehicle_information
  question: 'Todo vehículo motorizado en Alaska debe estar equipado con una bocina
    que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los estándares de equipamiento de vehículos de Alaska requieren una
    bocina audible en condiciones normales desde una distancia no menor a 200 pies.
- id: 177
  category: vehicle_information
  question: En Alaska, ¿una carga que se extienda más de cuántos pies más allá de
    la parte trasera del vehículo debe marcarse con una bandera roja durante el día?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: Siempre que una carga se extienda 4 pies o más más allá de la parte
    trasera de la plataforma o carrocería de un vehículo, se debe colocar una bandera
    roja (de al menos 12 pulgadas cuadradas) en el extremo posterior de la carga.
- id: 178
  category: vehicle_information
  question: 'La ley de Alaska exige que la placa de matrícula de su vehículo esté
    iluminada para que sea claramente legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La placa de registro trasera debe estar iluminada por una luz blanca
    para que sea visible desde una distancia de 50 pies hacia atrás.
- id: 179
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para un vehículo de pasajeros en Alaska?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros en Alaska si la profundidad
    de la banda de rodadura es inferior a 2/32 de pulgada.
- id: 180
  category: vehicle_information
  question: En Alaska, ¿cuántos espejos debe tener como mínimo cada vehículo motorizado,
    ubicados de tal manera que reflejen al conductor una vista de la carretera a una
    distancia de al menos 200 pies hacia atrás?
  choices:
    A: Un espejo
    B: Dos espejos
    C: Tres espejos
    D: Cuatro espejos
  answer: B
  explanation: 'La ley de Alaska exige al menos dos espejos: uno en el lado izquierdo
    y otro en el centro o en el lado derecho.'
- id: 181
  category: vehicle_information
  question: ¿Según la ley de Alaska, cuál de las siguientes afirmaciones es verdadera
    con respecto a los silenciadores de los vehículos?
  choices:
    A: Los silenciadores pueden modificarse para aumentar el ruido del motor
    B: Los escapes libres (cut-outs) o derivaciones están permitidos en carreteras
      rurales
    C: Un vehículo debe tener un silenciador en buen estado de funcionamiento para
      evitar el ruido excesivo
    D: Los silenciadores solo son obligatorios para los vehículos fabricados después
      de 2010
  answer: C
  explanation: La ley de Alaska exige que todo vehículo de motor tenga un silenciador
    en buen estado de funcionamiento y en operación constante para evitar ruidos excesivos
    o inusuales. Los escapes libres o derivaciones están prohibidos.
- id: 182
  category: vehicle_information
  question: 'En Alaska, se debe exhibir un emblema de ''Vehículo de Movimiento Lento''
    en la parte trasera de cualquier vehículo que viaje a una velocidad inferior a:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: El emblema de vehículo de movimiento lento (un triángulo naranja reflectante)
    es obligatorio para los vehículos diseñados para operar a velocidades de 25 mph
    o menos.
- id: 183
  category: vehicle_information
  question: ¿Cuántos medios independientes para aplicar los frenos exige la ley de
    Alaska que tengan todos los vehículos de motor (excepto las motocicletas)?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, siempre que el sistema principal funcione
  answer: B
  explanation: Cada vehículo de motor debe tener dos medios independientes para aplicar
    los frenos (el freno de servicio/pedal y el freno de estacionamiento/emergencia),
    cada uno de los cuales debe ser eficaz para detener el vehículo.
- id: 184
  category: vehicle_information
  question: En Alaska, para los residentes que viven al sur de los 60 grados de latitud
    norte (como Juneau o Ketchikan), ¿en qué período de tiempo son legales los neumáticos
    con clavos (studded tires)?
  choices:
    A: Del 15 de septiembre al 1 de mayo
    B: Del 1 de octubre al 15 de abril
    C: Del 15 de septiembre al 15 de abril
    D: Del 1 de noviembre al 31 de marzo
  answer: C
  explanation: De acuerdo con el Código Administrativo de Alaska y el Manual del Conductor,
    los neumáticos con clavos son legales desde el 15 de septiembre hasta el 15 de
    abril para las áreas al sur de los 60 grados de latitud norte.
- id: 185
  category: vehicle_information
  question: Según la ley de Alaska, ¿cuál es la transmisión de luz mínima permitida
    para el polarizado (tintado) no original en las ventanillas laterales delanteras?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 20%
  answer: C
  explanation: La ley de Alaska (13 AAC 04.223) especifica que las ventanillas situadas
    a la derecha e izquierda inmediata del conductor deben permitir el paso de al
    menos el 70% de la luz.
- id: 186
  category: vehicle_information
  question: En Alaska, el polarizado (tintado) no original en las ventanillas laterales
    traseras y la ventanilla trasera de un vehículo de pasajeros debe permitir el
    paso de al menos qué porcentaje de luz?
  choices:
    A: 40%
    B: 30%
    C: 20%
    D: 15%
  answer: A
  explanation: Para los vehículos de pasajeros en Alaska, las ventanillas laterales
    traseras y la ventanilla trasera (medallón) deben tener una transmisión de luz
    de al menos el 40%.
- id: 187
  category: vehicle_information
  question: En Alaska, los frenos de servicio de su vehículo deben ser capaces de
    detener el vehículo en cuántos pies cuando viaja a 20 mph en una superficie seca
    y nivelada?
  choices:
    A: 15 pies
    B: 25 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: Las normas de seguridad de Alaska exigen que el freno de pedal (freno
    de servicio) debe ser capaz de detener un vehículo de pasajeros que viaja a 20
    mph en una distancia de 25 pies.
- id: 188
  category: vehicle_information
  question: 'En Alaska, las luces traseras de su vehículo deben ser de color rojo
    y visibles desde una distancia de:'
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: Las regulaciones de equipamiento de Alaska exigen que las luces traseras
    sean visibles desde una distancia de 1,000 pies hacia atrás.
- id: 189
  category: vehicle_information
  question: 'Cuando un vehículo está equipado con una ''luz blanca'' para iluminar
    la placa de matrícula trasera, la placa debe ser legible desde una distancia de
    al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Alaska exige que la placa de matrícula trasera esté iluminada
    de modo que sea claramente legible desde una distancia de 50 pies hacia atrás.
- id: 190
  category: vehicle_information
  question: 'En Alaska, las luces de giro (direccionales) deben ser visibles bajo
    la luz solar normal desde una distancia no menor a:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las señales de giro en un vehículo de pasajeros estándar en Alaska
    deben ser visibles desde al menos 100 pies de distancia bajo la luz solar normal.
- id: 191
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las zonas
    de "Uso de Faros" (Headlight Use) en ciertas autopistas de Alaska?
  choices:
    A: Solo se requieren faros si está lloviendo.
    B: Los faros deben encenderse incluso a plena luz del día.
    C: Solo se requieren luces de estacionamiento durante el día.
    D: Las luces altas deben usarse en todo momento.
  answer: B
  explanation: Alaska ha designado zonas de "Uso de Faros" (Headlight Use) en muchas
    autopistas donde los conductores están legalmente obligados a tener sus faros
    encendidos en todo momento, incluso durante las horas del día, para aumentar la
    visibilidad.
- id: 192
  category: signs_and_signals
  question: En Alaska, ¿cuál es el límite de velocidad máximo al conducir en un callejón?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Según el Manual del Conductor de Alaska, el límite de velocidad en
    un callejón es de 15 mph, a menos que se indique lo contrario.
- id: 193
  category: signs_and_signals
  question: 'Al conducir en un distrito residencial en Alaska donde no hay un límite
    de velocidad señalizado, no debe exceder los:'
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: En Alaska, el límite de velocidad predeterminado para los distritos
    residenciales es de 25 mph.
- id: 194
  category: signs_and_signals
  question: En Alaska, ¿cuál es el límite de velocidad en una zona escolar cuando
    las luces amarillas están parpadeando o hay niños presentes?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 10 mph
  answer: B
  explanation: El límite de velocidad en una zona escolar designada en Alaska es de
    20 mph cuando las luces están parpadeando o hay niños presentes.
- id: 195
  category: signs_and_signals
  question: Si está utilizando señales manuales, ¿cómo indica un giro a la derecha
    en Alaska?
  choices:
    A: Extienda su brazo izquierdo recto hacia afuera de la ventana.
    B: Extienda su brazo izquierdo hacia afuera y apunte hacia arriba.
    C: Extienda su brazo izquierdo hacia afuera y apunte hacia abajo.
    D: Extienda su brazo derecho recto hacia afuera de la ventana.
  answer: B
  explanation: Para indicar un giro a la derecha mediante señales manuales, debe extender
    el brazo izquierdo por la ventana y doblarlo hacia arriba a la altura del codo.
- id: 196
  category: signs_and_signals
  question: ¿Qué significa un semáforo en rojo intermitente en Alaska?
  choices:
    A: Reduzca la velocidad y proceda con precaución.
    B: La luz está a punto de cambiar a verde.
    C: Deténgase por completo y proceda solo cuando sea seguro hacerlo.
    D: Ceda el paso a todo el tráfico, pero no se detenga a menos que sea necesario.
  answer: C
  explanation: 'Una luz roja intermitente tiene el mismo significado que una señal
    de alto: debe detenerse por completo y avanzar cuando sea seguro.'
- id: 197
  category: signs_and_signals
  question: 'Una señal en forma de banderín (un triángulo isósceles que apunta a la
    derecha) que se encuentra en el lado izquierdo de la carretera indica:'
  choices:
    A: Una zona escolar más adelante.
    B: Una señal de ceda el paso más adelante.
    C: Una zona de no rebasar.
    D: Una calle de un solo sentido.
  answer: C
  explanation: Se coloca una señal en forma de banderín en el lado izquierdo de la
    carretera para marcar el inicio de una zona de no rebasar.
- id: 198
  category: signs_and_signals
  question: ¿Cuál es el significado de un semáforo en amarillo intermitente?
  choices:
    A: Deténgase y espere a que la luz cambie a verde.
    B: Aumente la velocidad para despejar la intersección.
    C: Proceda con precaución.
    D: Trátelo como una parada de cuatro vías.
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y cruzar la intersección con precaución.
- id: 199
  category: signs_and_signals
  question: 'Cuando vea una línea amarilla continua junto a una línea amarilla discontinua
    en el pavimento, y la línea continua esté de su lado, usted debe:'
  choices:
    A: Rebasar solo si el camino está despejado.
    B: No rebasar a otros vehículos.
    C: Rebasar solo durante las horas del día.
    D: Esperar una señal de alto más adelante.
  answer: B
  explanation: Una línea amarilla continua en su lado de la línea central significa
    que está prohibido rebasar para el tráfico en su dirección.
- id: 200
  category: signs_and_signals
  question: 'En Alaska, una señal manual donde el brazo se extiende hacia afuera y
    hacia abajo indica que el conductor está:'
  choices:
    A: Girando a la izquierda.
    B: Girando a la derecha.
    C: Reduciendo la velocidad o deteniéndose.
    D: Cambiando de carril.
  answer: C
  explanation: Extender el brazo izquierdo hacia abajo indica la intención del conductor
    de reducir la velocidad o detenerse.
- id: 201
  category: signs_and_signals
  question: ¿De qué color son las señales de construcción y mantenimiento en Alaska?
  choices:
    A: Amarillo
    B: Naranja
    C: Verde
    D: Rojo
  answer: B
  explanation: Las señales de construcción, mantenimiento u operaciones de emergencia
    tienen forma de diamante o rectangulares y son de color naranja.
- id: 202
  category: signs_and_signals
  question: 'Una luz amarilla continua del semáforo significa:'
  choices:
    A: La luz está a punto de cambiar a verde.
    B: Debe acelerar para ganarle a la luz roja.
    C: La luz está a punto de cambiar a roja; debe detenerse si es seguro hacerlo.
    D: Los peatones tienen el derecho de paso.
  answer: C
  explanation: Una luz amarilla continua advierte que la señal está cambiando a rojo.
    Debe detenerse si puede hacerlo de manera segura; de lo contrario, proceda con
    precaución.
- id: 203
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas en el pavimento?
  choices:
    A: El tráfico se mueve en direcciones opuestas.
    B: El tráfico se mueve en la misma dirección y se permite el cambio de carril.
    C: El borde de la calzada.
    D: Un cruce peatonal.
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección; se permite cruzar la línea para cambiar de carril
    cuando sea seguro.
- id: 204
  category: signs_and_signals
  question: ¿Qué indica una señal circular amarilla con una 'X' negra y las letras
    'RR'?
  choices:
    A: Un cruce de caminos más adelante.
    B: Un cruce de ferrocarril más adelante.
    C: Zona de no rebasar.
    D: Una zona de descanso más adelante.
  answer: B
  explanation: Una señal circular amarilla con una 'X' negra y 'RR' es una señal de
    advertencia anticipada circular para un cruce de ferrocarril.
- id: 205
  category: signs_and_signals
  question: En Alaska, ¿cuál es la señal manual correcta para indicar un giro a la
    derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba hacia afuera de la ventana
    C: Brazo izquierdo extendido hacia abajo hacia afuera de la ventana
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: Según el Manual del Conductor de Alaska, un giro a la derecha se señala
    extendiendo el brazo izquierdo por la ventana y apuntando hacia arriba.
- id: 206
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de banderín ubicada en el
    lado izquierdo de la carretera?
  choices:
    A: Zona escolar más adelante
    B: Zona de no rebasar (No Passing Zone)
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Cruce de ferrocarril más adelante
  answer: B
  explanation: Una señal en forma de banderín (un triángulo isósceles que apunta a
    la derecha) se coloca en el lado izquierdo de la carretera para marcar el inicio
    de una zona de no rebasar (No Passing Zone).
- id: 207
  category: signs_and_signals
  question: En Alaska, ¿qué significan las líneas amarillas sólidas dobles en el centro
    de la carretera?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Está prohibido rebasar en ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas sólidas dobles indican que no se permite rebasar
    a los vehículos que viajan en cualquier dirección.
- id: 208
  category: signs_and_signals
  question: 'Cuando vea una señal de tráfico amarilla intermitente en una intersección,
    debe:'
  choices:
    A: Detenerse y esperar la luz verde
    B: Acelerar para despejar la intersección rápidamente
    C: Reducir la velocidad y proceder con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente es una advertencia para reducir la velocidad
    y estar especialmente alerta mientras avanza por la intersección.
- id: 209
  category: signs_and_signals
  question: ¿Qué significa una línea blanca sólida pintada en el borde derecho de
    la carretera?
  choices:
    A: Un carril solo para vehículos de emergencia
    B: El borde de la calzada (línea de niebla o 'fog line')
    C: Un sendero para peatones
    D: Una zona donde se permite rebasar
  answer: B
  explanation: Las líneas blancas sólidas a lo largo del costado de la carretera marcan
    el borde del pavimento, a menudo llamadas líneas de niebla (fog lines), y ayudan
    a los conductores a mantenerse en la carretera por la noche o con mal tiempo.
- id: 210
  category: signs_and_signals
  question: 'Una señal de cinco lados (pentágono) indica que está entrando en:'
  choices:
    A: Una zona de construcción
    B: Una zona de hospital
    C: Una zona escolar o cruce escolar
    D: Un área de parque público
  answer: C
  explanation: La forma de pentágono de cinco lados está reservada exclusivamente
    para zonas escolares y cruces escolares.
- id: 211
  category: signs_and_signals
  question: En Alaska, ¿cuál es la señal manual para "Reducir la velocidad o Detenerse"?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido hacia abajo
  answer: C
  explanation: Para indicar que está reduciendo la velocidad o deteniéndose, extienda
    el brazo izquierdo por la ventana y apunte hacia abajo, hacia el suelo.
- id: 212
  category: signs_and_signals
  question: ¿Qué representa una señal naranja en forma de diamante en Alaska?
  choices:
    A: Advertencia general de peligros en la carretera
    B: Advertencia de construcción o mantenimiento
    C: Límite de velocidad reglamentario
    D: Estación de servicio más adelante
  answer: B
  explanation: El naranja es el color estándar para las señales de construcción y
    mantenimiento. La forma de diamante indica una advertencia de condiciones específicas
    en la zona de trabajo.
- id: 213
  category: signs_and_signals
  question: 'Si se encuentra en una intersección con una luz amarilla fija, debe:'
  choices:
    A: Detenerse si puede hacerlo de manera segura antes de entrar en la intersección
    B: Acelerar para ganarle a la luz roja
    C: Detenerse inmediatamente, incluso si está en medio de la intersección
    D: Tocar la bocina para advertir a otros conductores que está pasando
  answer: A
  explanation: Una luz amarilla fija significa que la señal está a punto de cambiar
    a rojo. Debe detenerse si es seguro hacerlo; si ya se encuentra en la intersección,
    continúe con precaución.
- id: 214
  category: signs_and_signals
  question: 'Las líneas blancas discontinuas en una calzada de varios carriles indican:'
  choices:
    A: El tráfico se mueve en direcciones opuestas
    B: El tráfico se mueve en la misma dirección y se permiten los cambios de carril
    C: El borde de la calzada
    D: Un carril exclusivo para bicicletas
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Los conductores pueden cruzar estas líneas para
    cambiar de carril cuando sea seguro.
- id: 215
  category: signs_and_signals
  question: ¿Qué significa una señal de "X" roja sobre un carril de tráfico?
  choices:
    A: El carril es solo para vehículos de emergencia
    B: Debe salir del carril lo antes posible
    C: No se le permite conducir en ese carril
    D: El carril es solo para viajes compartidos (carpools)
  answer: C
  explanation: Una "X" roja fija sobre un carril significa que el carril está cerrado
    al tráfico en su dirección y no debe conducir por él.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 216
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 217
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 218
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: 'Detenerse y retroceder o dar la vuelta: va en sentido contrario'
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 219
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    apunta la flecha.'
  id: 220
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 221
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 222
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 223
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín de color blanco y negro que dice 'NO
    PASSING ZONE' significa que no se le permite rebasar a otros vehículos en esta
    área. Marca el inicio de una zona de no rebasar.
  id: 224
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de 'KEEP RIGHT' (Manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 225
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 226
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 227
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la carretera.
  id: 228
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 229
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 230
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 231
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de rombo?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de rombo con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 232
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Es necesario reducir la velocidad de manera
    más significativa antes de este giro.
  id: 233
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino gire primero
    en un sentido y luego en el otro.
  id: 234
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 235
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de rombo advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 236
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 237
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 238
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 239
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de sentido único o de una autopista dividida y se
    encuentre con vehículos que circulan en sentido contrario.
  id: 240
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 241
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 242
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 243
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 244
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las carreteras
    laterales.
  id: 245
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la autopista desde la carretera lateral.
  id: 246
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando (fusionando)
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir la incorporación de vehículos. El tráfico que entra
    desde la rampa tiene su propio carril nuevo.
  id: 247
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse brevemente o dejar el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 248
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que muestren un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    vigente pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 249
