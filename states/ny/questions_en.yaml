metadata:
  source: 2025 New York Driver's Manual (dmv.ny.gov)
  total_questions: 407
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: According to the New York State Donate Life Registry, how many lives can
    just one person who donates their organs save?
  choices:
    A: Up to 4 lives
    B: Up to 6 lives
    C: Up to 8 lives
    D: Up to 10 lives
  answer: C
  explanation: The manual states that just one person who donates their organs can
    save up to eight lives.
- id: 2
  category: license_system
  question: If you hold a valid driver license from another state, what is the minimum
    age required to drive legally in New York State?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '17'
  answer: C
  explanation: According to the manual, even if you are licensed somewhere else, people
    under age 16 cannot drive in New York State.
- id: 3
  category: license_system
  question: How many days do you have to get a New York driver license after becoming
    a permanent resident?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Drivers who have moved to New York must turn in their out-of-state
    driver license and get a New York license within 30 days of becoming a permanent
    resident.
- id: 4
  category: penalties_and_points
  question: What is a possible consequence of altering or forging a driver license?
  choices:
    A: A warning letter from the DMV
    B: Mandatory community service
    C: Suspension or revocation of the license and criminal prosecution
    D: A required defensive driving course
  answer: C
  explanation: It is a crime to alter or forge any motor vehicle document, which may
    cause suspension or revocation of the driver license and criminal prosecution
    resulting in a fine or imprisonment.
- id: 5
  category: license_system
  question: You must have a Commercial Driver License (CDL) if you drive a vehicle
    that is made or used to carry how many persons in addition to the driver?
  choices:
    A: 8 or more
    B: 10 or more
    C: 12 or more
    D: 15 or more
  answer: D
  explanation: A CDL is required if you drive any vehicle that is made or used to
    carry 15 or more persons, in addition to the driver.
- id: 6
  category: license_system
  question: What is the minimum age to obtain a Class D Operator license without a
    driver education Certificate of Completion?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: The minimum age for a Class D Operator license is 18, or age 17 with
    a driver education Certificate of Completion.
- id: 7
  category: license_system
  question: Which classes of mopeds are you allowed to operate with a standard Class
    D Operator license?
  choices:
    A: Class A only
    B: Class B and C mopeds
    C: Class A and B mopeds
    D: No mopeds are allowed without a motorcycle license
  answer: B
  explanation: The manual states that you can operate Class B and C mopeds with a
    Class D driver license.
- id: 8
  category: license_system
  question: What is the minimum age to obtain a Class DJ (Junior Operator) license?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: The minimum age to obtain a Junior Operator, Class DJ license is 16.
- id: 9
  category: license_system
  question: Which class of license is required to transport passengers for hire in
    a vehicle designed to carry 14 or fewer passengers, such as a taxi or livery?
  choices:
    A: Class C
    B: Class D
    C: Class E
    D: Class M
  answer: C
  explanation: A Taxi/Livery, Class E license allows you to transport passengers for
    hire in a vehicle designed or used to carry 14 or fewer passengers.
- id: 10
  category: license_system
  question: An Enhanced Driver License can be used instead of a passport for which
    type of travel?
  choices:
    A: International air travel to Europe
    B: Land and sea border crossings to and from Canada, Mexico, Bermuda and the Caribbean
    C: Any international travel worldwide
    D: Travel to South America by cruise ship
  answer: B
  explanation: An Enhanced Driver License can be used for land and sea border crossings
    to and from the U.S., Canada, Mexico, Bermuda and the Caribbean instead of a passport.
- id: 11
  category: license_system
  question: 'A Commercial Driver License (CDL) is required to drive a single vehicle
    with a manufacturer''s gross vehicle weight rating (GVWR) of more than:'
  choices:
    A: 10,000 pounds
    B: 15,000 pounds
    C: 20,000 pounds
    D: 26,000 pounds
  answer: D
  explanation: You must have a CDL if you drive any vehicle that has a manufacturer's
    gross vehicle weight rating (GVWR) of more than 26,000 pounds.
- id: 12
  category: license_system
  question: Which of the following statements is true regarding holding multiple driver
    licenses?
  choices:
    A: You may hold a New York license and an out-of-state license simultaneously.
    B: It is illegal in most cases to hold a New York driver license and a driver
      license from another state at the same time.
    C: You are required to hold a license for every state you frequently drive in.
    D: You may hold up to two commercial driver licenses (CDL) legally.
  answer: B
  explanation: In most cases, it is illegal to hold a New York driver license and
    a driver license from another state at the same time. It is also a violation of
    Federal and state law to hold more than one CDL.
- id: 13
  category: license_system
  question: 'A Class DJ (Junior Operator) license allows you to drive a vehicle with
    a gross vehicle weight rating (GVWR) of no more than:'
  choices:
    A: 5,000 pounds
    B: 10,000 pounds
    C: 15,000 pounds
    D: 26,000 pounds
  answer: B
  explanation: A Junior Operator, Class DJ license allows you to drive a vehicle with
    a GVWR of 10,000 pounds or less.
- id: 14
  category: license_system
  question: 'You must have a Commercial Driver License (CDL) if you drive a vehicle
    that:'
  choices:
    A: Carries any amount of commercial goods
    B: Is used for farming purposes only
    C: Carries hazardous materials required by federal law to contain a placard
    D: Tows a trailer weighing 2,000 pounds
  answer: C
  explanation: The manual specifies that you must have a CDL if you drive any vehicle
    that carries hazardous materials required by federal law to contain a placard.
- id: 15
  category: license_system
  question: If you have a motorcycle license and another type of driver license, how
    will they be displayed?
  choices:
    A: On two separate documents
    B: Both classes will be listed on one document
    C: You must choose only one to be active
    D: The motorcycle license replaces the other license
  answer: B
  explanation: According to the manual, if you have a motorcycle license and another
    type of driver license, both classes will be listed on one document (e.g., 'Class
    DM').
- id: 16
  category: license_system
  question: According to the REAL ID Act, what must every air traveler flying within
    the United States present to get through security at U.S. airports?
  choices:
    A: A valid U.S. passport only
    B: A REAL ID, an Enhanced Driver License, or another acceptable form of federal
      identification
    C: A standard state-issued driver license and a birth certificate
    D: A Social Security card and a utility bill
  answer: B
  explanation: Every air traveler flying within the United States must present a REAL
    ID, an Enhanced Driver License, or bring another acceptable form of identification
    determined by the federal government.
- id: 17
  category: license_system
  question: The Personal Use Vehicle 'R' endorsement is required for operating recreational
    or rental vehicles used to transport personal household goods if the vehicle exceeds
    what specifications?
  choices:
    A: 10,000 pounds GVWR and/or 20 feet in length
    B: 18,000 pounds GVWR and/or 30 feet in length
    C: 26,000 pounds GVWR and/or 40 feet in length
    D: 32,000 pounds GVWR and/or 50 feet in length
  answer: C
  explanation: The 'R' endorsement is required for operation of recreational and/or
    rental vehicles used to transport personal household goods when the vehicle is
    over 26,000 pounds GVWR and/or forty (40) feet in length.
- id: 18
  category: driver_testing
  question: Which of the following is true regarding the testing requirements to obtain
    an 'R' endorsement?
  choices:
    A: You must pass both a written test and a road test.
    B: You must pass a written test, but no road test is required.
    C: No written test is required, but you must pass a road test.
    D: Neither a written test nor a road test is required.
  answer: C
  explanation: To get an 'R' endorsement, you must pass a road test in the size and
    type of vehicle you will drive. The manual explicitly states, 'No written test
    is required.'
- id: 19
  category: driver_testing
  question: Who must accompany you for your 'R' endorsement road test?
  choices:
    A: A licensed driving instructor.
    B: Any licensed driver over the age of 18.
    C: A driver who is at least 21 years old with a license valid for the vehicle
      you will drive during the test.
    D: A DMV official who holds a Commercial Driver License.
  answer: C
  explanation: For the road test, a driver who is at least 21 years old, with a license
    valid for the vehicle you will drive during the test, must accompany you.
- id: 20
  category: license_system
  question: For how long will your first New York driver license be issued?
  choices:
    A: Exactly 10 years
    B: A period not to exceed 5 years, on your month and day of birth
    C: A period not to exceed 8 years, on your month and day of birth
    D: Until you turn 21 years old
  answer: B
  explanation: Your first New York driver license will be issued for a period not
    to exceed 5 years, on your month and day of birth.
- id: 21
  category: license_system
  question: When applying for your first license, you must present documents that
    prove your name. How many points must these proofs total?
  choices:
    A: Four points or more
    B: Six points or more
    C: Eight points or more
    D: Ten points or more
  answer: B
  explanation: Documents that prove your name are assigned a point value. You must
    present proofs that total six points or more.
- id: 22
  category: license_system
  question: When submitting documents to prove your name for a driver license application,
    what is a specific requirement for at least one of the proofs?
  choices:
    A: It must contain your photograph.
    B: It must be issued by the federal government.
    C: It must have your signature.
    D: It must show your current residential address.
  answer: C
  explanation: The manual states that when presenting proofs of your name that total
    six points or more, 'At least one of the proofs must have your signature.'
- id: 23
  category: license_system
  question: Which of the following documents has a value of 6 points when proving
    your name for a New York driver license?
  choices:
    A: A valid U.S. Passport
    B: A U.S. Social Security Card
    C: A New York Photo Driver License or Non-Driver ID Card
    D: A U.S. Military Photo Identification Card
  answer: C
  explanation: A New York Photo Driver License/Permit/Non-Driver ID Card (current
    or not expired for more than 2 years) has a value of 6 points.
- id: 24
  category: license_system
  question: How many points is a valid U.S. Passport worth when proving your identity
    for a New York driver license?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: According to the list of acceptable documents, a valid U.S. Passport
    or Passport Card has a value of 4 points.
- id: 25
  category: license_system
  question: If your proof of identity documents are not in English, what must you
    provide?
  choices:
    A: A certified English translation
    B: A notarized letter from a U.S. citizen
    C: An international driving permit
    D: A verbal translation at the DMV office
  answer: A
  explanation: The manual states that all proofs must be in English or accompanied
    by a certified English translation.
- id: 26
  category: license_system
  question: Which of the following is an acceptable document to prove your date of
    birth?
  choices:
    A: A U.S. High School Photo ID with Report Card
    B: A U.S. Utility Bill
    C: A U.S. Military Photo Identification Card
    D: A U.S. Major Credit Card
  answer: C
  explanation: Under the 'Proof of Age' section, a U.S. Military Photo Identification
    Card is listed as an acceptable document to prove your date of birth.
- id: 27
  category: driver_testing
  question: To pass the vision test for a New York driver license, what visual acuity
    must you have in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: To pass the vision test, you must have 20/40 vision in at least one
    eye with or without corrective lenses.
- id: 28
  category: driver_testing
  question: In addition to passing a vision and knowledge test, what must most drivers
    complete before taking a road test for their first license?
  choices:
    A: A 10-hour defensive driving course
    B: An approved 5-hour Pre-Licensing Course
    C: A 15-hour behind-the-wheel training program
    D: A certified first aid and CPR class
  answer: B
  explanation: The manual states that most drivers must also complete an approved
    5-hour Pre-Licensing Course and pass a road test when applying for their first
    license.
- id: 29
  category: driver_testing
  question: What is the minimum vision requirement to pass the vision test for a New
    York driver's license?
  choices:
    A: 20/20 vision in both eyes
    B: 20/30 vision in at least one eye
    C: 20/40 vision in at least one eye
    D: 20/50 vision in both eyes
  answer: C
  explanation: According to the manual, to pass the vision test, you must have 20/40
    vision in at least one eye with or without corrective lenses.
- id: 30
  category: driver_testing
  question: To pass the written test for a Class D license, how many questions must
    you answer correctly overall?
  choices:
    A: At least 10 out of 20
    B: At least 14 out of 20
    C: At least 16 out of 20
    D: All 20 questions
  answer: B
  explanation: The manual states that to pass the written test, you must correctly
    answer at least 14 of the 20 questions asked.
- id: 31
  category: driver_testing
  question: How many road sign questions must you answer correctly to pass the written
    knowledge test?
  choices:
    A: One out of four
    B: Two out of four
    C: Three out of four
    D: Four out of four
  answer: B
  explanation: The manual specifies that you must correctly answer two of the four
    questions about road signs to pass the written test.
- id: 32
  category: driver_testing
  question: What is the minimum age required for a student to take the written test
    through the DMV Online Knowledge Test Application (OKTA) program at a participating
    high school?
  choices:
    A: 15 years old
    B: 15 years and 6 months old
    C: 15 years and 11 months old
    D: 16 years old
  answer: C
  explanation: Before applying for a learner permit, students who are at least age
    15 and 11 months can take the written test through the OKTA program.
- id: 33
  category: license_system
  question: When practicing driving with a learner permit, what are the requirements
    for your supervising driver?
  choices:
    A: Must be at least 18 and have any valid license
    B: Must be at least 21, have a valid license for the vehicle type, and sit in
      the front seat
    C: Must be a licensed driving instructor
    D: Must be at least 25 and sit in the back seat
  answer: B
  explanation: When you practice, you must be supervised by a licensed driver who
    is at least 21 years old, has a license valid for the type of vehicle you are
    driving, and is seated in the front seat with you.
- id: 34
  category: license_system
  question: If you have a Junior Permit and are driving in New York City (5 Boroughs)
    between 5 AM and 9 PM, what special equipment must the vehicle have?
  choices:
    A: A backup camera
    B: A student driver sign
    C: Dual controls (dual brakes)
    D: Extra side mirrors
  answer: C
  explanation: Under the regional restrictions for a Junior Permit in New York City
    between 5 AM and 9 PM, the vehicle must have dual controls (dual brakes).
- id: 35
  category: license_system
  question: Under a Junior Permit in Upstate New York (All Other Counties), who must
    supervise you if you drive between 9 PM and 5 AM?
  choices:
    A: Any licensed driver over 18
    B: Any licensed driver over 21
    C: You must NOT drive during these hours
    D: Your parent, guardian, person 'in loco parentis,' driver education teacher,
      or driving school instructor
  answer: D
  explanation: In Upstate counties between 9 PM and 5 AM, a Junior Permit holder must
    drive only under the immediate supervision of a parent, guardian, person 'in loco
    parentis,' driver education teacher, or driving school instructor.
- id: 36
  category: safe_driving_rules
  question: According to the general rules for all drivers with learner permits, where
    are you strictly prohibited from driving?
  choices:
    A: On any street within a park in New York City
    B: On any interstate highway
    C: In school zones during school hours
    D: On roads with a speed limit over 40 mph
  answer: A
  explanation: If you hold a learner permit, you cannot drive on any street within
    a park in New York City or any bridge or tunnel under the jurisdiction of the
    Triborough Bridge and Tunnel Authority.
- id: 37
  category: safe_driving_rules
  question: Which of the following parkways in Westchester County are you NOT allowed
    to drive on with a learner permit?
  choices:
    A: Northern State Parkway
    B: Taconic State Parkway
    C: Garden State Parkway
    D: Palisades Interstate Parkway
  answer: B
  explanation: Learner permit holders cannot drive on the Cross County, Hutchinson
    River, Saw Mill River, or Taconic State parkways in Westchester County.
- id: 38
  category: license_system
  question: If you hold a Junior Learner Permit, what is the rule regarding passengers
    under the age of 21?
  choices:
    A: You cannot have any passengers under 21
    B: You can have up to three passengers under 21
    C: You cannot drive with more than one passenger under 21 unless they are immediate
      family or your supervisor is a parent/guardian/instructor
    D: You can have as many passengers under 21 as there are seat belts
  answer: C
  explanation: You cannot drive with more than one passenger under the age of 21 unless
    they are members of your immediate family or if your supervising driver is your
    parent, guardian, person 'in loco parentis,' driver education teacher or driving
    school instructor.
- id: 39
  category: license_system
  question: If you hold a junior permit, who is the only passenger allowed to sit
    in the front seat with you?
  choices:
    A: Your supervising driver
    B: A sibling under 18
    C: Any passenger over 21
    D: No one is allowed in the front seat
  answer: A
  explanation: 'The manual explicitly states: ''If you hold a junior permit, the only
    passenger allowed in the front seat is your supervising driver.'''
- id: 40
  category: driver_testing
  question: Before taking your road test, how many total hours of supervised driving
    practice is it important that you have completed?
  choices:
    A: At least 20 hours
    B: At least 30 hours
    C: At least 40 hours
    D: At least 50 hours
  answer: D
  explanation: Before you take the test, it is important that you have had at least
    50 hours of practice.
- id: 41
  category: driver_testing
  question: Out of the total recommended hours of supervised driving practice before
    a road test, how many hours must be completed after sunset?
  choices:
    A: At least 5 hours
    B: At least 10 hours
    C: At least 15 hours
    D: At least 20 hours
  answer: C
  explanation: The manual states it is important to have at least 50 hours of practice,
    with at least 15 hours after sunset.
- id: 42
  category: driver_testing
  question: What must you complete before you can make a road test appointment?
  choices:
    A: An advanced defensive driving course
    B: An approved safe driver course (Pre-Licensing course or driver education)
    C: A highway driving certification
    D: A vision re-test
  answer: B
  explanation: Before you can make a road test appointment, you must first complete
    an approved safe driver course, which is fulfilled by a high school/college driver
    education course or a Pre-Licensing course.
- id: 43
  category: license_system
  question: If you have a Junior Permit and are driving in Long Island (Nassau & Suffolk)
    between 9 PM and 5 AM, what are the restrictions?
  choices:
    A: You must be supervised by a parent or guardian
    B: You must NOT drive
    C: You must be supervised by any licensed driver over 21
    D: You can drive alone if going to work
  answer: B
  explanation: According to the Regional Restrictions for a Junior Permit chart, in
    Long Island (Nassau & Suffolk) between 9 PM and 5 AM, 'You must NOT drive.'
- id: 44
  category: license_system
  question: How long is the Pre-Licensing Course completion certificate valid for?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: According to the manual, when you complete the safe driving course,
    you will receive a certificate that is valid for one year.
- id: 45
  category: driver_testing
  question: Does the DMV-certified Point & Insurance Reduction Program (Defensive
    Driving Course) meet the Safe Driving course requirement for scheduling a road
    test?
  choices:
    A: Yes, if completed online.
    B: Yes, for drivers over 18.
    C: No, it does not meet the requirement.
    D: Yes, if completed within the last 6 months.
  answer: C
  explanation: 'The manual explicitly states: ''The DMV-certified Point & Insurance
    Reduction Program (a.k.a. Accident Prevention Course or Defensive Driving Course)
    does NOT meet the Safe Driving course requirement.'''
- id: 46
  category: license_system
  question: At what age are you eligible to change a junior driver license to a senior
    driver license if you have completed a state-approved driver education course?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: B
  explanation: If you are 17, you are eligible for a senior driver license (Class
    D or M) if you have a junior driver license and have completed a state-approved
    high school or college driver education course.
- id: 47
  category: driver_testing
  question: How long must a junior driver hold their permit in valid status before
    they are allowed to take the road test?
  choices:
    A: A minimum of 3 months
    B: A minimum of 6 months
    C: A minimum of 9 months
    D: A minimum of 12 months
  answer: B
  explanation: 'For Junior Drivers with Permits, the manual states: ''Your permit
    must be held, in valid status for a minimum of six months in order to take the
    road test.'''
- id: 48
  category: driver_testing
  question: How many hours of supervised practice driving must a parent or guardian
    certify that a junior driver has completed prior to the road test?
  choices:
    A: 30 hours, including 10 hours after sunset
    B: 40 hours, including 10 hours after sunset
    C: 50 hours, including 15 hours after sunset
    D: 60 hours, including 15 hours after sunset
  answer: C
  explanation: The Certification of Supervised Driving (MV-262) requires a parent
    or guardian to certify that the driver completed at least 50 hours of practice
    driving, including at least 15 hours after sunset.
- id: 49
  category: driver_testing
  question: What is a requirement for the supervising driver who accompanies you to
    the road test site?
  choices:
    A: They must be at least 18 years old.
    B: They must be at least 21 years old and hold a valid license for the vehicle.
    C: They must be a certified driving instructor.
    D: They must be a parent or legal guardian.
  answer: B
  explanation: If you drive to the road test site, you must bring a supervising driver
    who is at least 21 and holds a license valid for the vehicle you will drive during
    the road test.
- id: 50
  category: driver_testing
  question: What must motorcycle applicants bring to their road test to transport
    the license examiner?
  choices:
    A: A motorcycle with a sidecar
    B: A second motorcycle for the examiner
    C: A car or truck and a licensed driver
    D: A certified motorcycle instructor
  answer: C
  explanation: Motorcycle applicants must bring a car or truck and a licensed driver
    to transport the license examiner during the test.
- id: 51
  category: penalties_and_points
  question: How many points can be reduced from your driving record if you complete
    the Point and Insurance Reduction Program (PIRP)?
  choices:
    A: Up to 2 points
    B: Up to 3 points
    C: Up to 4 points
    D: Up to 5 points
  answer: C
  explanation: If you are eligible for point reduction, as many as four (4) points
    can be reduced from your driving record by completing the PIRP course.
- id: 52
  category: penalties_and_points
  question: How often can you complete the Point and Insurance Reduction Program (PIRP)
    for the purpose of point reduction?
  choices:
    A: Every 12 months
    B: Every 18 months
    C: Every 2 years
    D: Every 3 years
  answer: B
  explanation: You can complete the Point and Insurance Reduction Program course every
    18 months for the purpose of point reduction.
- id: 53
  category: license_system
  question: When driving with a Junior License, how many passengers under the age
    of 21 are allowed in the vehicle if they are NOT members of your immediate family?
  choices:
    A: None
    B: No more than one
    C: No more than two
    D: No more than three
  answer: B
  explanation: Under Junior Operator Restrictions, you cannot drive with more than
    one passenger under the age of 21 unless they are members of your immediate family.
- id: 54
  category: license_system
  question: According to the regional restrictions for a Junior License, when are
    you allowed to drive in New York City (the 5 Boroughs)?
  choices:
    A: Between 5 AM and 9 PM only
    B: Only when accompanied by a parent or guardian
    C: Only when driving to or from school
    D: You must NOT drive at any time
  answer: D
  explanation: The regional restrictions chart for a Junior License clearly states
    that in New York City (5 Boroughs), 'You must NOT drive' between 5AM - 9PM and
    'You must NOT drive' between 9PM - 5AM.
- id: 55
  category: license_system
  question: If you hold a Junior License and drive in Upstate counties between 5 AM
    and 9 PM, what are the restrictions on driving alone?
  choices:
    A: You may drive without being accompanied.
    B: You must be accompanied by a licensed parent or guardian.
    C: You may only drive alone to employment or school.
    D: You must not drive.
  answer: A
  explanation: According to the regional restrictions chart, in Upstate (All Other
    Counties) between 5AM - 9PM, 'You may drive without being accompanied.'
- id: 56
  category: license_system
  question: What specific proof of employment must a Junior License holder carry to
    drive to work in Nassau or Suffolk counties?
  choices:
    A: A recent pay stub
    B: A Certificate of Employment (MV-58A)
    C: A letter from their employer
    D: A copy of their work schedule
  answer: B
  explanation: If you hold a Junior License and drive in the counties of Nassau or
    Suffolk, your employer can complete a Certificate of Employment (MV-58A) to serve
    as correct proof of employment.
- id: 57
  category: vehicle_information
  question: What is a specific requirement for the passenger side seat belt in the
    vehicle used for a road test?
  choices:
    A: It must be a five-point harness.
    B: It must be available and clean for use by the examiner.
    C: It must be inspected by a mechanic prior to the test.
    D: It must be disabled if the examiner prefers.
  answer: B
  explanation: 'The manual states that the vehicle must be in good working order,
    and specifically notes: ''The passenger side seat belt must be available and clean
    for use by the examiner.'''
- id: 58
  category: license_system
  question: What passenger restriction applies to a learner permit or junior license
    for a motorcycle or moped (Class M or MJ)?
  choices:
    A: You may carry one passenger if they are wearing a helmet.
    B: You may carry immediate family members only.
    C: You cannot carry any passenger except your supervising driver.
    D: You may carry any passenger over the age of 21.
  answer: C
  explanation: 'The manual states: ''Your learner permit or junior license (Class
    M or MJ) does not allow you to carry any passenger except your supervising driver.'''
- id: 59
  category: license_system
  question: Who is permitted to ride as a passenger when you are operating a motorcycle
    or moped with a Class M or MJ learner permit?
  choices:
    A: Any family member
    B: Only your supervising driver
    C: Anyone over the age of 18
    D: No passengers are allowed under any circumstances
  answer: B
  explanation: According to the manual, a learner permit or junior license (Class
    M or MJ) does not allow you to carry any passenger except your supervising driver.
- id: 60
  category: license_system
  question: How close must a supervising driver remain when you are operating a motorcycle
    or moped with a learner permit?
  choices:
    A: Within 100 feet
    B: Within one-quarter mile
    C: Within one-half mile
    D: Within one mile
  answer: B
  explanation: The manual states that your supervising driver must exercise general
    supervision and control by remaining within one-quarter mile.
- id: 61
  category: driver_responsibility
  question: How many days do you have to notify the DMV if you change your residential
    address?
  choices:
    A: 5 days
    B: 10 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: If you change your address, you must notify the DMV within 10 days
    by mail, on a Change-of-Address Form, or online.
- id: 62
  category: license_system
  question: How early can you renew your driver license before its printed expiration
    date?
  choices:
    A: Up to 30 days
    B: Up to 45 days
    C: Up to 6 months
    D: Up to one year
  answer: D
  explanation: The manual states that you can renew your license up to one year before
    its printed expiration date.
- id: 63
  category: license_system
  question: When applying for a REAL ID at the DMV, how many proofs of New York State
    residence must you provide?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: To get a REAL ID, you MUST bring to the office two proofs of New York
    State residence such as a utility bill or mortgage statement.
- id: 64
  category: driver_responsibility
  question: If you are renewing your driver license by mail or online, you must prove
    you have passed an eye test within what time frame?
  choices:
    A: The past 30 days
    B: The past 60 days
    C: The past six months
    D: The past two years
  answer: C
  explanation: If you renew by mail or through the DMV website, you must prove you
    have passed an eye test within the past six months (or within one year as determined
    by a licensed health care professional).
- id: 65
  category: license_system
  question: How long is your driver license automatically extended after being discharged
    from active military service?
  choices:
    A: 30 days
    B: 60 days
    C: Six months
    D: One year
  answer: C
  explanation: If you enter military service, your license can be automatically extended
    throughout your active service and for six months after discharge.
- id: 66
  category: license_system
  question: After establishing residency in New York State, how long do you have to
    apply for a New York driver license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: To remain legally licensed, you must apply for a New York driver license
    within 30 days after you establish you are a New York State resident.
- id: 67
  category: license_system
  question: If you are 15 years old and hold a valid out-of-state driver license,
    what are the rules for driving in New York State?
  choices:
    A: You may drive only if accompanied by a parent.
    B: You may drive during daylight hours only.
    C: You cannot drive in New York State under any circumstances.
    D: You may drive if you obtain a New York junior permit.
  answer: C
  explanation: 'The manual explicitly states: "If you are less than 16 years of age,
    you cannot drive in New York State even if you have an out-of-state license."'
- id: 68
  category: penalties_and_points
  question: What does it mean if your driver license is "revoked"?
  choices:
    A: It is taken away for a temporary period and automatically returned.
    B: It is cancelled and you must re-apply to the DMV once the period is over.
    C: You must pay a fine but can continue driving.
    D: You are restricted to driving only to and from work.
  answer: B
  explanation: '"Revocation" means your license (or privilege to drive) is cancelled.
    To get a new license, you must re-apply to the Department of Motor Vehicles (DMV)
    once the revocation period is over.'
- id: 69
  category: penalties_and_points
  question: How long will a junior permit or license be suspended if the driver is
    convicted of a serious traffic violation worth three or more points?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: Your permit, license or privileges will be suspended for 60 days if
    you are convicted of a serious traffic violation (three points or more) or two
    other violations.
- id: 70
  category: penalties_and_points
  question: What is the penalty for a driver with a junior permit who is convicted
    of a texting or cell phone violation?
  choices:
    A: A 30-day suspension
    B: A 60-day suspension
    C: A 120-day suspension
    D: A permanent revocation
  answer: C
  explanation: Your junior permit, license or privileges will be suspended for 120
    days when you are convicted of a texting or cell phone violation.
- id: 71
  category: driver_testing
  question: What is the minimum amount of time you must hold a junior permit before
    you can schedule a road test?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: C
  explanation: A junior permit must be held for a minimum of six months, excluding
    any time the permit is suspended or revoked, before a road test can be scheduled.
- id: 72
  category: penalties_and_points
  question: How long is the probation period for a newly licensed driver who is 18
    or older when they pass their road test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: If you are 18 or older when you pass your road test for a driver license,
    or obtain a license following revocation, you will be on probation for six months.
- id: 73
  category: penalties_and_points
  question: Which of the following convictions will result in a 60-day suspension
    for a newly licensed driver during their six-month probation period?
  choices:
    A: A single parking ticket
    B: Speeding
    C: Failing to notify the DMV of an address change
    D: Driving with an expired inspection sticker
  answer: B
  explanation: If you are convicted of DWAI (alcohol), speeding, reckless driving,
    following too closely, participating in a speed contest, or any two traffic violations
    while on probation, your license will be suspended for 60 days.
- id: 74
  category: penalties_and_points
  question: If you are convicted of a texting or cell phone violation while on a probationary
    license, how long will your license be suspended?
  choices:
    A: 60 days
    B: 90 days
    C: 120 days
    D: 6 months
  answer: C
  explanation: According to the manual, if you are convicted of a texting or cell
    phone violation, your probationary license will be suspended for 120 days.
- id: 75
  category: penalties_and_points
  question: What is a possible consequence if you receive a traffic ticket and do
    not respond to it?
  choices:
    A: Your vehicle will be immediately impounded.
    B: You could be found guilty by default conviction and your license suspended
      indefinitely.
    C: You will automatically receive 3 points on your driving record.
    D: You will be required to take a mandatory defensive driving course.
  answer: B
  explanation: The manual states that if you do not respond that you have received
    the ticket, you could be found guilty by default conviction and your driver license
    will be suspended indefinitely.
- id: 76
  category: penalties_and_points
  question: From which of the following areas outside of New York State will moving
    traffic convictions be added to your New York State 'violation point' driving
    record?
  choices:
    A: New Jersey and Pennsylvania
    B: Ontario and Quebec
    C: California and Florida
    D: All Canadian provinces
  answer: B
  explanation: The New York State DMV does not record convictions of moving traffic
    violations in other jurisdictions, except traffic offenses committed in the provinces
    of Ontario and Quebec in Canada.
- id: 77
  category: alcohol_drugs_health
  question: 'If you are over 21 years old and are convicted of an alcohol- or drug-related
    driving violation in another state, your New York driver license will be revoked
    for at least:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: If you are over 21 years old and are convicted of an alcohol- or drug-related
    driving violation (e.g., DUI) in another state, your New York driver license will
    be revoked for at least 90 days.
- id: 78
  category: alcohol_drugs_health
  question: What is the penalty if a driver under 21 years old is convicted of an
    alcohol or drug-related violation that occurred out of state?
  choices:
    A: A 90-day suspension
    B: A 6-month revocation
    C: Revocation for at least one year
    D: A warning and a $500 fine
  answer: C
  explanation: If you are under 21 years old and convicted of any alcohol or drug-related
    violation that occurred out of state, your New York driver license will be revoked
    for at least one year.
- id: 79
  category: alcohol_drugs_health
  question: What is the minimum revocation period for Aggravated driving while intoxicated
    (Agg-DWI) with a .18 blood alcohol content?
  choices:
    A: 90 days
    B: Six months
    C: One year
    D: 18 months
  answer: C
  explanation: Aggravated driving while intoxicated (Agg-DWI), with .18 of one percent
    blood alcohol content (.18 BAC) carries a minimum one-year revocation.
- id: 80
  category: alcohol_drugs_health
  question: 'A conviction for Driving while ability impaired by alcohol (DWAI) will
    result in a:'
  choices:
    A: 90-day suspension
    B: Six-month revocation
    C: One-year revocation
    D: 120-day suspension
  answer: A
  explanation: The manual lists the penalty for Driving while ability impaired by
    alcohol (DWAI) as a 90-day suspension.
- id: 81
  category: alcohol_drugs_health
  question: 'If a driver over age 21 refuses to take a chemical test for the first
    time, their license will be revoked for a minimum of:'
  choices:
    A: 90 days
    B: Six months
    C: One year
    D: 18 months
  answer: C
  explanation: A chemical test refusal for drivers over age 21 results in a minimum
    one-year revocation.
- id: 82
  category: alcohol_drugs_health
  question: Under the state's 'Zero Tolerance Law,' what happens if a driver under
    age 21 is found to have a BAC from .02 to .07?
  choices:
    A: Their license is suspended for 90 days.
    B: Their license is suspended for six months.
    C: Their license is revoked for one year.
    D: They receive 3 points on their license.
  answer: B
  explanation: Under the state's 'Zero Tolerance Law,' a driver under age 21 will
    have their license suspended for six months if found to have a BAC from .02 to
    .07.
- id: 83
  category: penalties_and_points
  question: Your driver license will be revoked for at least six months if you are
    found guilty of how many speeding and/or misdemeanor traffic violations within
    18 months?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: Your driver license will be revoked for at least six months if you
    are found guilty of three speeding and/or misdemeanor traffic violations within
    18 months.
- id: 84
  category: penalties_and_points
  question: What is the penalty for operating an uninsured vehicle or allowing another
    person to operate your uninsured vehicle?
  choices:
    A: A 90-day suspension
    B: A six-month suspension
    C: Revocation for at least one year
    D: An indefinite suspension until insurance is purchased
  answer: C
  explanation: Your driver license will be revoked for at least one year if you operate
    or allow another person to operate your uninsured vehicle.
- id: 85
  category: penalties_and_points
  question: Which of the following will result in an indefinite suspension of your
    driver license?
  choices:
    A: Failing to pay child support
    B: Getting two speeding tickets in a year
    C: Refusing a chemical test
    D: Passing a stopped school bus once
  answer: A
  explanation: Your driver license will be suspended indefinitely if you fail to file
    an accident report, fail to pay child support, fail to pay taxes, or fail to fulfill
    a court judgment.
- id: 86
  category: penalties_and_points
  question: According to the DMV point system, how many points will you receive for
    speeding 21 to 30 MPH over the posted limit?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: The point system table indicates that speeding 21 to 30 MPH over the
    posted limit results in 6 points.
- id: 87
  category: penalties_and_points
  question: How many points are added to your driving record for the use of a mobile
    telephone or portable electronic device while operating a motor vehicle?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: According to the point system table, the use of a mobile telephone
    or portable electronic device while operating a motor vehicle results in 5 points.
- id: 88
  category: penalties_and_points
  question: When are point values charged against your driving record?
  choices:
    A: On the date you are convicted
    B: On the date you commit the violation
    C: On the date you pay the ticket
    D: On the date the DMV processes the citation
  answer: B
  explanation: According to the manual, the point values charged against your record
    are from the date you commit the violation, not the date you are convicted.
- id: 89
  category: penalties_and_points
  question: How many points accumulated within an 18-month period will result in a
    notification that your driver license will be suspended?
  choices:
    A: 6 or more points
    B: 8 or more points
    C: 11 or more points
    D: 15 or more points
  answer: C
  explanation: The manual states that if you get 11 or more points within 18 months,
    you will be notified by mail that your driver license will be suspended.
- id: 90
  category: defensive_driving
  question: What is a benefit of taking a DMV-approved 'Motor Vehicle Accident Prevention
    Course'?
  choices:
    A: It prevents a mandatory license suspension.
    B: It acts as a credit against future points.
    C: It reduces your Driver Responsibility Assessment fee.
    D: It can reduce your point total by up to four points.
  answer: D
  explanation: You can reduce your point total by up to four points and save up to
    10 percent on your auto liability and collision insurance premiums by taking a
    DMV-approved course.
- id: 91
  category: driver_responsibility
  question: If you are involved in a traffic crash in which another person is killed,
    what action can the DMV take even if you were not charged with a violation?
  choices:
    A: Your license can be suspended or revoked after a DMV hearing.
    B: You will automatically be charged with vehicular manslaughter.
    C: You will be required to pay a $750 civil penalty.
    D: Your vehicle will be seized and forfeited immediately.
  answer: A
  explanation: If you are involved in a traffic crash in which another person is killed,
    your license can be suspended or revoked after a DMV hearing even if you were
    not charged with a violation.
- id: 92
  category: penalties_and_points
  question: What is the non-refundable suspension termination fee in most cases if
    your driver license has been suspended for an exact period, like 30 or 90 days?
  choices:
    A: 25 dollars
    B: 50 dollars
    C: 100 dollars
    D: 125 dollars
  answer: B
  explanation: In most cases, if your driver license has been suspended for an exact
    period, your license will not be returned until you pay a non-refundable $50 suspension
    termination fee.
- id: 93
  category: sharing_the_road
  question: Under the 2019 law regarding stop-arm cameras on school buses, what is
    the penalty for a first violation of passing a stopped school bus with flashing
    red lights?
  choices:
    A: 100 dollars
    B: 150 dollars
    C: 250 dollars
    D: 300 dollars
  answer: C
  explanation: The manual states that a first violation for passing a school bus caught
    on a stop-arm camera results in a penalty of $250.
- id: 94
  category: alcohol_drugs_health
  question: What is the civil penalty for a chemical test refusal while driving a
    standard (non-commercial) motor vehicle?
  choices:
    A: 250 dollars
    B: 500 dollars
    C: 550 dollars
    D: 750 dollars
  answer: B
  explanation: The civil penalty for a chemical test refusal is $500 ($550 if while
    driving a commercial motor vehicle).
- id: 95
  category: alcohol_drugs_health
  question: If you are convicted of Driving While Intoxicated (DWI), how much is the
    Driver Responsibility Assessment you must pay each year for three years?
  choices:
    A: 100 dollars
    B: 150 dollars
    C: 250 dollars
    D: 500 dollars
  answer: C
  explanation: If you are convicted of DWI, you will be required to pay a driver responsibility
    assessment of $250 each year for the next three years.
- id: 96
  category: penalties_and_points
  question: If you receive six points on your driving record in an 18-month period,
    you must pay a Driver Responsibility Assessment of $100 each year for three years.
    How much must you pay for each additional point received during that period?
  choices:
    A: 10 dollars per point every year for three years
    B: 25 dollars per point every year for three years
    C: 50 dollars per point every year for three years
    D: 100 dollars per point every year for three years
  answer: B
  explanation: For each additional point you receive during that period, you will
    be required to pay another $25 per point every year for three years.
- id: 97
  category: penalties_and_points
  question: Which of the following is a potential consequence of driving while your
    license is suspended or revoked?
  choices:
    A: A mandatory fine of $50 to $100
    B: Mandatory community service for 100 hours
    C: Mandatory fines from $200 to $5,000 and possible vehicle seizure
    D: A permanent ban from obtaining a driver license in any state
  answer: C
  explanation: It is a criminal offense to drive while your license is suspended or
    revoked, and there are mandatory fines from $200 to $5,000. The vehicle being
    driven could also be seized and forfeited.
- id: 98
  category: vehicle_information
  question: What is the primary purpose of a title certificate?
  choices:
    A: It allows a vehicle to be driven on public roads.
    B: It proves who owns the vehicle.
    C: It proves the vehicle has passed safety inspection.
    D: It serves as proof of auto liability insurance.
  answer: B
  explanation: A registration allows a vehicle to be driven on public roads and highways.
    A title certificate proves who owns the vehicle.
- id: 99
  category: vehicle_information
  question: What is the minimum age required to register a vehicle in New York State?
  choices:
    A: '15'
    B: '16'
    C: '18'
    D: There is no age requirement to register a vehicle.
  answer: B
  explanation: 'The manual states: ''You must be at least 16 to register a vehicle.
    You can title a vehicle at any age.'''
- id: 100
  category: vehicle_information
  question: How many days does a new resident of New York State have to get a New
    York vehicle registration after establishing residence?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: A new resident of the state must get a New York registration within
    30 days of establishing residence.
- id: 101
  category: vehicle_information
  question: If you purchase a vehicle from someone other than a New York State registered
    dealership, how many days do you have to get the vehicle inspected after registering
    it?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: If you purchased the vehicle from someone other than a New York State
    registered dealership, you will receive a 10-day inspection extension sticker...
    You must then have the vehicle inspected within 10 days from the date of registration.
- id: 102
  category: vehicle_information
  question: Under what condition will a motor vehicle office refuse to accept a title
    certificate?
  choices:
    A: If the vehicle is more than 10 years old
    B: If the title certificate is folded or creased
    C: If information on the title is adjusted, erased, or canceled
    D: If the vehicle was previously registered in another state
  answer: C
  explanation: A motor vehicle office will not accept a title certificate if the correct
    odometer or damage disclosure statement is not completed, or if information on
    the title is adjusted, erased or canceled.
- id: 103
  category: vehicle_information
  question: What will happen if information on a title certificate, such as a name
    or signature, is adjusted, erased, or canceled?
  choices:
    A: The DMV will charge an additional processing fee.
    B: The DMV will not accept the title certificate.
    C: The buyer must pay sales tax based on fair market value.
    D: The title will automatically be marked as 'Rebuilt Salvage.'
  answer: B
  explanation: According to the manual, a motor vehicle office will not accept a title
    certificate if information on the title is adjusted, erased, or canceled, which
    includes any name or signature.
- id: 104
  category: vehicle_information
  question: If you purchase a vehicle that is eight model years old or newer, what
    statements must be completed on the Certificate of Title?
  choices:
    A: Only the odometer statement.
    B: Only the damage disclosure statement.
    C: Both the odometer and the damage disclosure statements.
    D: Neither statement is required for vehicles under ten years old.
  answer: C
  explanation: The manual states that for a vehicle eight model years old or newer,
    the DMV will not register or title it unless the seller has completed, and the
    buyer has signed, both the odometer and the damage disclosure statements.
- id: 105
  category: vehicle_information
  question: What must the DMV do before a vehicle described as 'Rebuilt Salvage' can
    be registered or titled?
  choices:
    A: Examine the vehicle for stolen parts.
    B: Perform a strict emissions test.
    C: Verify the vehicle's fair market value.
    D: Issue a new vehicle identification number (VIN).
  answer: A
  explanation: 'The manual explicitly states: ''The DMV must examine every vehicle
    described as "Rebuilt Salvage", OR SIMILAR WORDS, for stolen parts before the
    vehicle can be registered or titled.'''
- id: 106
  category: vehicle_information
  question: When purchasing a vehicle from a private seller, what happens if the seller
    does not complete their side of the Statement of Transaction form for a vehicle
    sold below fair market value?
  choices:
    A: The registration application will be permanently denied.
    B: You will be charged sales tax based on the current fair market value of the
      vehicle.
    C: You will be exempt from paying sales tax.
    D: The seller will be fined by the DMV.
  answer: B
  explanation: If the form is not completed by the seller for a vehicle sold below
    fair market value, the manual notes that you will be charged sales tax based on
    the current fair market value of the vehicle.
- id: 107
  category: vehicle_information
  question: 'When presenting an insurance identification card to register your vehicle,
    the information on the card must exactly match the:'
  choices:
    A: Name and Vehicle Identification Number (VIN) on the registration application.
    B: Name and address on your driver license.
    C: Odometer reading on the Certificate of Title.
    D: Purchase price on the Statement of Transaction.
  answer: A
  explanation: The manual specifies that the name(s) and vehicle identification number
    (VIN) on the insurance identification cards must exactly match the information
    on the registration application.
- id: 108
  category: vehicle_information
  question: 'For most vehicles with a maximum gross weight of not more than 18,000
    pounds, registration fees are based on the vehicle''s:'
  choices:
    A: Age.
    B: Purchase price.
    C: Weight.
    D: Horsepower.
  answer: C
  explanation: Registrations for most vehicles with a maximum gross weight of not
    more than 18,000 pounds are valid for two years, and fees are based on vehicle
    weight.
- id: 109
  category: vehicle_information
  question: Under what condition can you receive a refund for your registration fees
    if you have already used the vehicle plates or registration sticker for one day?
  choices:
    A: If you return them within 30 days.
    B: If you sell the vehicle to a family member.
    C: If you transfer the registration to a motorcycle.
    D: By law, registration fees cannot be refunded if the plates or sticker are used
      even for one day.
  answer: D
  explanation: 'The manual states: ''By law, registration fees cannot be refunded
    if you use the vehicle plates or registration sticker on your vehicle even for
    one day.'''
- id: 110
  category: driver_responsibility
  question: What should you do before you trade in or sell your old vehicle to prevent
    being charged with parking tickets that are not yours?
  choices:
    A: Scratch out the VIN on the dashboard.
    B: Remove the vehicle plates and the windshield registration sticker.
    C: Leave the plates on but remove the registration sticker.
    D: Report the vehicle as stolen to the DMV.
  answer: B
  explanation: Before trading in or selling your old vehicle, you must make sure to
    remove the vehicle plates and the windshield registration sticker to prevent being
    charged with parking tickets that are not yours.
- id: 111
  category: driver_responsibility
  question: Which of the following is a reason you might NOT receive a registration
    renewal reminder in the mail?
  choices:
    A: You have not answered three or more parking tickets.
    B: Your vehicle is more than ten model years old.
    C: You recently renewed your driver license.
    D: You purchased your vehicle from a private seller instead of a dealer.
  answer: A
  explanation: The manual lists several reasons you will not receive a renewal reminder,
    including if you changed your address without notifying the DMV, if your registration
    is suspended or revoked, or if you did not answer three or more parking tickets.
- id: 112
  category: vehicle_information
  question: What happens if your vehicle registration expiration date falls on a weekend
    or legal state holiday?
  choices:
    A: You are given a 30-day grace period to renew.
    B: The registration expires immediately on the Friday before.
    C: The registration is automatically extended to midnight of the next business
      day.
    D: You must pay a late fee when renewing on the next business day.
  answer: C
  explanation: If the expiration date falls on a weekend or legal state holiday, your
    registration is automatically extended to midnight of the next business day.
- id: 113
  category: vehicle_information
  question: If a second party (someone who is not the registrant) brings a registration
    application into a DMV office, what identification must they provide?
  choices:
    A: Only the original identification of the registrant.
    B: Only their own original identification.
    C: Their own original identification and either the original or a photocopy of
      the registrant's identification.
    D: A notarized letter from the registrant and the vehicle's title.
  answer: C
  explanation: An application brought in by a second party must be accompanied by
    the original New York license/permit/non-driver ID for the second party and either
    the original or a photocopy for the registrant.
- id: 114
  category: driver_responsibility
  question: When is your vehicle required to be covered by liability insurance?
  choices:
    A: Only when it is being driven on public roads.
    B: Only during the first year of registration.
    C: As long as it is registered, even if you do not drive it.
    D: Only if the vehicle is less than ten model years old.
  answer: C
  explanation: 'The manual states: ''Your vehicle must be covered by liability insurance
    as long as it is registered, even if you do not drive it.'''
- id: 115
  category: vehicle_information
  question: What is the minimum required liability insurance coverage against property
    damage for a single incident in New York State?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: The minimum liability coverage required includes $10,000 against property
    damage.
- id: 116
  category: penalties_and_points
  question: What is the penalty if your vehicle is not insured for 90 days and you
    have not turned in your vehicle plates?
  choices:
    A: Your vehicle will be repossessed by the DMV.
    B: Your driver license will be suspended.
    C: You will be required to take a defensive driving course.
    D: Your vehicle will be permanently branded as 'Rebuilt Salvage.'
  answer: B
  explanation: According to the manual, if your vehicle is not insured for 90 days,
    unless you have turned in your vehicle plates, your driver license will also be
    suspended.
- id: 117
  category: vehicle_information
  question: How do the rules for turning in vehicle plates differ for motorcycles
    when insurance is discontinued or expires?
  choices:
    A: Motorcycle plates must be turned in within 24 hours of insurance expiration.
    B: You are not required to turn in the vehicle plate when motorcycle insurance
      is discontinued or expires.
    C: Motorcycle plates must be mailed directly to the DMV Call Center.
    D: You must turn in the plate only if the motorcycle is sold to a private party.
  answer: B
  explanation: The manual specifies that while motorcycles must be insured, you are
    not required to turn in the vehicle plate when your motorcycle insurance is discontinued
    or expires.
- id: 118
  category: penalties_and_points
  question: What is the penalty if you are convicted of driving an uninsured vehicle
    in New York State?
  choices:
    A: A fine of up to $1,000
    B: Your license or privilege to drive will be revoked for at least one year
    C: Your vehicle will be impounded for 30 days
    D: Your license will be suspended for 90 days
  answer: B
  explanation: According to the manual, if you are convicted of driving an uninsured
    vehicle, your license or privilege to drive in New York State will be revoked
    for at least one year.
- id: 119
  category: vehicle_information
  question: If you purchase a vehicle from someone who is not a New York State dealer,
    how long do you have to get the vehicle inspected?
  choices:
    A: Within 5 days after you register it
    B: Within 10 days after you register it
    C: Within 20 days after you register it
    D: Within 30 days after you register it
  answer: B
  explanation: The manual states that if you purchase a vehicle from someone who is
    not a NYS dealer, you must have the vehicle inspected within 10 days after you
    register it.
- id: 120
  category: vehicle_information
  question: To qualify for a waiver if your vehicle fails a first high enhanced or
    OBD II emissions inspection, how much must the attempted repairs cost?
  choices:
    A: At least $250
    B: At least $300
    C: At least $450
    D: At least $500
  answer: C
  explanation: The manual specifies that to qualify for a waiver, an attempt must
    be made to repair the malfunction and the cost for repairs must be at least $450.
- id: 121
  category: vehicle_information
  question: Which of the following gasoline-powered vehicles is exempt from the exhaust
    emissions inspection and only subject to a safety inspection?
  choices:
    A: A vehicle that is 10 model years old
    B: A vehicle that is 26 or more model years old
    C: A vehicle with a gross weight over 8,500 pounds
    D: A vehicle purchased from an out-of-state dealer
  answer: B
  explanation: Exceptions to the exhaust emissions inspection include gasoline-powered
    vehicles that are 26 or more model years old, less than two model years old, or
    registered as historic.
- id: 122
  category: driver_responsibility
  question: What is the time and mileage limit for the DMV to receive a complaint
    against an auto repair shop?
  choices:
    A: Within 30 days or 1,000 miles of the vehicle repairs
    B: Within 60 days or 2,000 miles of the vehicle repairs
    C: Within 90 days or 3,000 miles of the vehicle repairs
    D: Within 120 days or 4,000 miles of the vehicle repairs
  answer: C
  explanation: By regulation, the DMV can receive a repair shop complaint only within
    90 days or 3,000 miles (4,828 km) of the vehicle repairs, whichever comes first.
- id: 123
  category: signs_and_signals
  question: What do regulation signs normally look like?
  choices:
    A: Yellow and diamond-shaped with black letters
    B: Green with white letters and symbols
    C: White rectangles with black letters or symbols
    D: Blue with white letters or symbols
  answer: C
  explanation: The manual states that regulation signs normally are white rectangles
    with black letters or symbols, though some are different shapes or use red letters.
- id: 124
  category: signs_and_signals
  question: What is the normal shape and color of a warning sign?
  choices:
    A: White and rectangular
    B: Yellow and diamond-shaped
    C: Orange and circular
    D: Red and octagonal
  answer: B
  explanation: Warning signs normally are yellow and diamond-shaped, with black letters
    or symbols.
- id: 125
  category: signs_and_signals
  question: Which type of sign shows the location of services like rest areas, gas
    stations, or medical facilities?
  choices:
    A: Destination signs
    B: Warning signs
    C: Route signs
    D: Service signs
  answer: D
  explanation: Service signs are blue with white letters or symbols and show the location
    of services like rest areas, gas stations, camping or medical facilities.
- id: 126
  category: signs_and_signals
  question: When approaching a stop sign where there is no stop line or crosswalk,
    where must you come to a full stop?
  choices:
    A: At least 10 feet before the intersection
    B: Before you enter the intersection, at the point nearest the intersection that
      gives you a view of traffic
    C: Directly next to the stop sign
    D: After slowly rolling into the intersection to check for traffic
  answer: B
  explanation: If there is no stop line or crosswalk, you must stop before you enter
    the intersection, at the point nearest the intersection that gives you a view
    of traffic on the intersecting roadway.
- id: 127
  category: signs_and_signals
  question: What color are work area signs?
  choices:
    A: Orange with black letters or symbols
    B: Yellow with black letters or symbols
    C: Red with white letters or symbols
    D: Green with white letters or symbols
  answer: A
  explanation: Work area signs are orange, with black letters or symbols, indicating
    that people are at work on or near the roadway.
- id: 128
  category: safe_driving_rules
  question: What must you do if you approach an intersection where the traffic lights
    are out of service?
  choices:
    A: Proceed through the intersection without stopping if the way is clear
    B: Yield to vehicles on your right and proceed with caution
    C: Come to a stop as you would for a stop sign
    D: Wait for a police officer to arrive before proceeding
  answer: C
  explanation: State law requires that if the traffic lights or controls are out of
    service or do not operate correctly when you approach an intersection, you must
    come to a stop as you would for a stop sign.
- id: 129
  category: safe_driving_rules
  question: Under what condition are you permitted to make a left turn at a steady
    red light?
  choices:
    A: When turning from a two-way road onto a one-way road
    B: When turning from a one-way road into another one-way road after coming to
      a full stop and yielding
    C: When turning onto a multi-lane highway with a median
    D: You are never permitted to make a left turn on a red light in New York State
  answer: B
  explanation: You can make a left turn at a steady red light when you turn from a
    one-way road into another one-way road after you come to a full stop and yield
    the right-of-way.
- id: 130
  category: safe_driving_rules
  question: What is the rule for turning on a red light in New York City?
  choices:
    A: You may turn right on red after coming to a full stop
    B: You may turn on red only between the hours of 10 PM and 6 AM
    C: You are not allowed to turn on a red light unless a sign that permits it is
      posted
    D: You may turn left on red from a one-way street to another one-way street
  answer: C
  explanation: 'The manual explicitly states: ''You are not allowed to turn on a red
    light in New York City unless a sign that permits it is posted.'''
- id: 131
  category: vehicle_information
  question: If a person moves to New York State, how long is their previous out-of-state
    vehicle inspection certificate valid?
  choices:
    A: For 30 days after registering the vehicle in New York
    B: Until it expires or one year from the date it was issued, whichever occurs
      first
    C: It is not valid; the vehicle must be inspected immediately
    D: For 6 months from the date they establish residency
  answer: B
  explanation: If a person moves to NYS, an inspection certificate that was issued
    before is valid until it expires or one year from the date it was issued, whichever
    occurs first.
- id: 132
  category: vehicle_information
  question: What are you required to do with your vehicle plate if your motorcycle
    insurance is discontinued or expires?
  choices:
    A: Turn it in to the DMV immediately
    B: Mail it to your insurance company
    C: You are not required to turn in the vehicle plate
    D: Destroy the plate and request a new one when re-insured
  answer: C
  explanation: 'The manual states: ''Motorcycles must be insured, but you are not
    required to turn in the vehicle plate when your motorcycle insurance is discontinued
    or expires.'''
- id: 133
  category: signs_and_signals
  question: What does a flashing red traffic light mean?
  choices:
    A: The traffic signal is broken; proceed with caution.
    B: Stop, yield the right-of-way, and go when it is safe.
    C: Slow down and prepare to stop.
    D: Yield to all traffic on your right.
  answer: B
  explanation: 'A flashing red light means the same as a STOP sign: Stop, yield the
    right-of-way, and go when it is safe.'
- id: 134
  category: signs_and_signals
  question: What does a flashing yellow 'X' light above a highway lane indicate?
  choices:
    A: Do not drive in this lane.
    B: Move from this lane immediately.
    C: This lane can only be used for a left turn.
    D: The lane is reserved for high-occupancy vehicles.
  answer: C
  explanation: A flashing yellow 'X' above the pavement indicates that this lane can
    only be used for a left turn.
- id: 135
  category: signs_and_signals
  question: What does it indicate if a solid edge line angles toward the center of
    the road?
  choices:
    A: The road is narrower ahead.
    B: You are approaching a toll booth.
    C: The speed limit is decreasing.
    D: You must merge into the left lane.
  answer: A
  explanation: An edge line that angles towards the center of the road shows that
    the road is narrower ahead.
- id: 136
  category: signs_and_signals
  question: What is the difference between white and yellow lane lines?
  choices:
    A: White lines separate traffic moving in opposite directions; yellow lines separate
      lanes moving in the same direction.
    B: White lines separate lanes of traffic moving in the same direction; yellow
      lines separate traffic moving in opposite directions.
    C: White lines indicate parking zones; yellow lines indicate no-parking zones.
    D: White lines are used on highways; yellow lines are used on city streets.
  answer: B
  explanation: Lines that separate lanes of traffic that move in the same direction
    are white. Lines that separate traffic that moves in opposite directions are yellow.
- id: 137
  category: safe_driving_rules
  question: If you are driving on a road with a solid yellow line next to a broken
    yellow line, and you are on the side with the solid line, what are you permitted
    to do?
  choices:
    A: You may pass other vehicles if the road ahead is clear.
    B: You cannot pass other vehicles or go across the line except to make a left
      turn into a driveway.
    C: You may cross the line to pass slow-moving farm equipment only.
    D: You are never allowed to cross the solid line for any reason.
  answer: B
  explanation: 'Solid line with broken line: If you are on the side with the solid
    line, you cannot pass other vehicles or go across the line except to make a left
    turn into a driveway.'
- id: 138
  category: safe_driving_rules
  question: When are you allowed to cross double solid lines on the roadway?
  choices:
    A: When passing a vehicle traveling below the speed limit.
    B: When you need to turn left to enter or leave the highway, such as to a driveway.
    C: When the vehicle ahead of you is stopped for a pedestrian.
    D: You may never cross double solid lines under any circumstances.
  answer: B
  explanation: 'Double solid lines: You cannot pass or change lanes. You cannot go
    across the lines except to turn left to enter or leave the highway (e.g. to or
    from a driveway or to do a U-turn).'
- id: 139
  category: signs_and_signals
  question: What does a diamond symbol painted on the roadway indicate?
  choices:
    A: A pedestrian crosswalk is ahead.
    B: The lane is reserved for buses, HOVs, bicycles, or other special vehicles.
    C: The lane ends ahead and you must merge.
    D: You are approaching a railroad crossing.
  answer: B
  explanation: The diamond symbol indicates the lane is reserved for buses, HOV (High-Occupancy
    Vehicles) like car-pools and van-pools, bicycles or other special vehicles.
- id: 140
  category: safe_driving_rules
  question: If a traffic officer signals you to drive through a red light, what must
    you do?
  choices:
    A: Stop and wait for the light to turn green.
    B: Obey the officer and drive through the red light.
    C: Honk your horn to warn other drivers before proceeding.
    D: Pull over to the side of the road until the light changes.
  answer: B
  explanation: Directions given by traffic officers take precedence over signs, signals
    or pavement markings. If an officer signals you to drive through a red light or
    stop sign, you must do it.
- id: 141
  category: safe_driving_rules
  question: If you and an approaching driver from the opposite direction reach an
    intersection at the same time, and you want to turn left while they are going
    straight, who has the right-of-way?
  choices:
    A: You have the right-of-way because you are turning.
    B: The driver going straight has the right-of-way.
    C: Whoever enters the intersection first has the right-of-way.
    D: The driver on the right has the right-of-way.
  answer: B
  explanation: If drivers approaching from opposite directions reach an intersection
    at about the same time, a driver that turns left must yield to traffic that moves
    straight or turns right.
- id: 142
  category: defensive_driving
  question: While waiting in an intersection to make a left turn, how should you position
    your vehicle's wheels?
  choices:
    A: Keep your wheels turned to the left to prepare for the turn.
    B: Keep your wheels turned to the right to avoid blocking traffic.
    C: Keep your wheels straight to prevent being pushed into oncoming traffic if
      hit from behind.
    D: It does not matter how your wheels are positioned.
  answer: C
  explanation: When you enter the intersection, keep to the right of the center line.
    Keep your wheels straight to prevent being pushed into oncoming traffic if your
    vehicle is hit from behind.
- id: 143
  category: safe_driving_rules
  question: At an intersection not controlled by signs or signals, if two drivers
    arrive at right angles at the same time, who must yield?
  choices:
    A: The driver on the right must yield to the driver on the left.
    B: The driver on the left must yield to the driver on the right.
    C: The driver going faster has the right-of-way.
    D: The driver on the wider road has the right-of-way.
  answer: B
  explanation: At intersections not controlled by signs or signals, or where two or
    more drivers stop at STOP signs at the same time and they are at right angles,
    the driver on the left must yield the right-of-way to the driver on the right.
- id: 144
  category: signs_and_signals
  question: What does a single solid line separating lanes of traffic indicate?
  choices:
    A: You cannot pass or change lanes under any circumstances.
    B: You can pass or change lanes freely as long as you signal.
    C: You can pass or change lanes, but only when obstructions or traffic conditions
      make it necessary.
    D: The lane is reserved for emergency vehicles only.
  answer: C
  explanation: 'One solid line: You can pass other vehicles or change lanes, but you
    can only do so when obstructions in the road or traffic conditions make it necessary.'
- id: 145
  category: safe_driving_rules
  question: If two drivers arrive at an intersection with no signs or signals at the
    same time at right angles, who must yield the right-of-way?
  choices:
    A: The driver on the right must yield to the driver on the left.
    B: The driver on the left must yield to the driver on the right.
    C: The driver going faster has the right-of-way.
    D: The driver turning left has the right-of-way.
  answer: B
  explanation: At intersections not controlled by signs or signals, or where two or
    more drivers stop at STOP signs at the same time and they are at right angles,
    the driver on the left must yield the right-of-way to the driver on the right.
- id: 146
  category: safe_driving_rules
  question: What must you do when entering a street from a private driveway or parking
    lot?
  choices:
    A: Sound your horn and proceed into traffic.
    B: Yield only to vehicles approaching from your left.
    C: Stop and yield the right-of-way to traffic on the roadway and to pedestrians.
    D: Merge into traffic without stopping if you are turning right.
  answer: C
  explanation: A vehicle that enters a roadway from a driveway, private road or another
    place that is not a roadway, must stop and yield the right-of-way to traffic on
    the roadway and to pedestrians.
- id: 147
  category: defensive_driving
  question: What should you do if you want to cross an intersection but traffic is
    backed up on the other side?
  choices:
    A: Enter the intersection and wait for traffic to clear.
    B: Wait until traffic ahead clears so you do not block the intersection.
    C: Proceed slowly and force your way into the traffic line.
    D: Turn right instead of going straight.
  answer: B
  explanation: You cannot enter an intersection if traffic is backed up on the other
    side and you cannot get completely through the intersection. Wait until traffic
    ahead clears, so you do not block the intersection.
- id: 148
  category: safe_driving_rules
  question: Are you required to pull over for an emergency vehicle approaching you
    in the opposite lane of a two-way roadway?
  choices:
    A: Yes, you must pull over and stop.
    B: No, only if it is traveling in your lane.
    C: No, but you must slow down.
    D: Yes, but only if there is no physical divider.
  answer: A
  explanation: You must pull over and stop for an emergency vehicle even if it is
    headed toward you in the opposite lane of a two-way roadway.
- id: 149
  category: defensive_driving
  question: What must you do if you hear an emergency siren close by but do not know
    exactly where the emergency vehicle is?
  choices:
    A: Stop immediately in your current lane.
    B: Speed up until you see the vehicle.
    C: Safely pull over to the right-side edge of the road and stop until you are
      sure it is not headed toward you.
    D: Continue driving at the speed limit while checking your mirrors.
  answer: C
  explanation: If you hear a siren or air-horn close by but do not know exactly where
    the emergency vehicle is, you must safely pull over to the right-side edge of
    the road and stop until you are sure it is not headed toward you.
- id: 150
  category: safe_driving_rules
  question: Under the Move Over Law, what must a driver do when approaching a stopped
    emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Stop immediately next to the emergency vehicle.
    B: Maintain speed but move to the right shoulder.
    C: Reduce speed and move from the lane adjacent to the emergency vehicle, if safe
      to do so.
    D: Sound the horn to warn the emergency workers.
  answer: C
  explanation: Drivers must reduce speed on all roads when encountering such vehicles,
    but on parkways, interstates and other controlled access roads with multiple lanes,
    drivers are further required to move from the lane adjacent to the emergency or
    hazard vehicle unless traffic or other hazards prevent doing so safely.
- id: 151
  category: signs_and_signals
  question: What does a flashing green light on a personal vehicle indicate?
  choices:
    A: A volunteer fire fighter responding to an alarm.
    B: A volunteer ambulance or rescue squad member.
    C: A snow plow or tow truck.
    D: A rural mail delivery vehicle.
  answer: B
  explanation: Personal vehicles driven by volunteer fire fighters responding to alarms
    are allowed to display blue lights and those driven by volunteer ambulance or
    rescue squad members can display green lights.
- id: 152
  category: sharing_the_road
  question: Are you legally required to yield the right-of-way to a personal vehicle
    displaying a flashing blue light?
  choices:
    A: Yes, they are considered authorized emergency vehicles.
    B: Yes, but only if they also sound a siren.
    C: No, but you should yield as a courtesy if you can safely do so.
    D: No, you should maintain your speed and right-of-way at all times.
  answer: C
  explanation: The vehicles that display blue, green or amber lights are not authorized
    emergency vehicles. Their drivers must obey all traffic laws. While you are not
    required to yield the right-of-way, you should yield as a courtesy if you can
    safely do so.
- id: 153
  category: safe_driving_rules
  question: How far ahead of a turn or lane change does the law require you to signal?
  choices:
    A: At least 50 feet (15 m)
    B: At least 100 feet (30 m)
    C: At least 200 feet (60 m)
    D: At least 300 feet (90 m)
  answer: B
  explanation: The law requires you to signal a turn or lane change with your turn
    lights or hand signals at least 100 feet (30 m) ahead.
- id: 154
  category: defensive_driving
  question: Why should you keep your wheels straight while waiting in an intersection
    to make a turn?
  choices:
    A: It prevents your power steering fluid from overheating.
    B: It helps you accelerate faster when the light turns green.
    C: If you are hit from behind, your vehicle could be pushed into the oncoming
      lane of traffic.
    D: It makes it easier for pedestrians to see your vehicle.
  answer: C
  explanation: Keep your wheels straight until you actually begin to make your turn.
    If your wheels are turned, and you are hit from behind, your vehicle could be
    pushed into the oncoming lane of traffic.
- id: 155
  category: vehicle_information
  question: When making a turn, what should you remember about the path of your rear
    wheels?
  choices:
    A: They will travel outside the path of the front wheels.
    B: They will travel inside the path of the front wheels.
    C: They will follow the exact same path as the front wheels.
    D: They will skid if you do not brake during the turn.
  answer: B
  explanation: Remember that your rear wheels will travel inside the path of the front
    wheels, nearer to the curb (right turn) or to traffic headed toward you (left
    turn).
- id: 156
  category: sharing_the_road
  question: What is a common cause of crashes involving motorcycles and other vehicles?
  choices:
    A: The motorcycle is driving too slowly.
    B: The driver of the other vehicle fails to see the motorcycle.
    C: The motorcycle's headlights are too bright.
    D: The motorcycle fails to signal before turning.
  answer: B
  explanation: Most crashes that involve motorcycles and other vehicles are caused
    because the driver of the other vehicle has failed to see the motorcycle.
- id: 157
  category: safe_driving_rules
  question: When making a left turn from a two-way road into another two-way road,
    how should you approach the turn?
  choices:
    A: From the far right lane of the roadway.
    B: From the left half of the roadway.
    C: From the right half of the roadway closest to the center.
    D: By swinging wide to the right before turning left.
  answer: C
  explanation: When making a left turn from a two-way road into a two-way road, approach
    the turn from the right half of the roadway closest to the center.
- id: 158
  category: safe_driving_rules
  question: From which lane are you permitted to make a U-turn?
  choices:
    A: The right shoulder.
    B: The far right lane.
    C: The left portion of the lane nearest to the centerline.
    D: Any lane as long as there is no oncoming traffic.
  answer: C
  explanation: You can make a U-turn only from the left portion of the lane nearest
    to the centerline of the roadway, never from the right lane.
- id: 159
  category: penalties_and_points
  question: What is the penalty for violating the Move Over Law?
  choices:
    A: It is punishable as a moving violation.
    B: It results in an automatic license suspension.
    C: It is considered a felony offense.
    D: It carries no penalty but a written warning.
  answer: A
  explanation: Violations of this law [the Move Over Law] are punishable as a moving
    violation.
- id: 160
  category: safe_driving_rules
  question: According to New York State law, in which of the following locations is
    it strictly prohibited to make a U-turn?
  choices:
    A: On a narrow, two-way street
    B: In a school zone
    C: At an intersection with a green left-arrow signal
    D: In a residential driveway
  answer: B
  explanation: The manual states that it is prohibited for a vehicle to make a U-turn
    in a school zone, as well as on limited access expressways and in business districts
    of New York City.
- id: 161
  category: safe_driving_rules
  question: How far away must other drivers be able to see your vehicle for you to
    legally make a U-turn near a hill or curve?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: You cannot make a U-turn near the top of a hill, a curve, or any other
    location where other drivers cannot see your vehicle from 500 feet (150 m) away
    in either direction.
- id: 162
  category: safe_driving_rules
  question: What is the first step you must take when making a three-point turn?
  choices:
    A: Signal left and steer across the road
    B: Turn your steering wheel as far to the right as possible
    C: Signal with your right turn signal, then pull over to the right and stop
    D: Check your interior rear-view mirror and back up
  answer: C
  explanation: To make a three-point turn, step 1 is to signal with your right turn
    signal, then pull over to the right and stop.
- id: 163
  category: sharing_the_road
  question: When passing a motorcycle, what must you do to ensure safety?
  choices:
    A: Share the lane if the lane is wide enough
    B: Give the motorcycle the same full-lane width as other vehicles
    C: Pass on the right side only
    D: Sound your horn before moving into their lane space
  answer: B
  explanation: When you pass a motorcycle, remember to give the motorcycle the same
    full-lane width as other vehicles are allowed. Never move into the same lane space
    as a motorcycle.
- id: 164
  category: safe_driving_rules
  question: How far in advance must you use your turn signal or hand signal to indicate
    your intention to change lanes?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: The law requires you to use turn signal lamps or hand and arm signals
    to indicate your intention to change lanes at least 100 feet (30 m) before you
    make a lane change.
- id: 165
  category: safe_driving_rules
  question: You are prohibited from passing a vehicle on the left if you are within
    how many feet of a railroad crossing on a two-way roadway?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: You cannot pass a vehicle on the left if you are within 100 feet (30
    m) of a railroad crossing on a two-way roadway.
- id: 166
  category: safe_driving_rules
  question: When passing a vehicle on the left, you must be able to safely return
    to the right lane before any oncoming vehicle comes within what distance?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: You cannot pass a vehicle on the left if you cannot safely return to
    the right lane before any oncoming vehicle comes within 200 feet (60 m) of you.
- id: 167
  category: defensive_driving
  question: Why should you quickly look over your shoulder before changing lanes to
    pass?
  choices:
    A: To check for emergency vehicles in the distance
    B: Because it is illegal to use your mirrors while passing
    C: To ensure you do not exceed the speed limit
    D: Because correctly adjusted mirrors still leave blind spots
  answer: D
  explanation: Never depend on your mirrors when you prepare to change lanes. Even
    correctly adjusted mirrors will leave 'blind spots' behind both sides of your
    vehicle.
- id: 168
  category: safe_driving_rules
  question: After passing a vehicle on the left, how do you know it is safe to return
    to the right lane?
  choices:
    A: As soon as your rear bumper clears the other vehicle's front bumper
    B: When you can see the front bumper of the passed vehicle in your interior rear-view
      mirror
    C: Immediately after you activate your right turn signal
    D: When you are 100 feet ahead of the passed vehicle
  answer: B
  explanation: Before you return to the right lane, signal and look at your interior
    rear-view mirror and make sure you can see the front bumper of the vehicle you
    passed.
- id: 169
  category: safe_driving_rules
  question: Under which of the following conditions are you permitted to pass another
    vehicle on the right?
  choices:
    A: When the vehicle ahead is traveling below the speed limit
    B: When you are on a narrow, one-lane dirt road
    C: When a vehicle ahead makes a left turn
    D: By driving onto the unpaved shoulder of the road
  answer: C
  explanation: You can pass a vehicle on the right only in specific conditions, such
    as when a vehicle ahead makes a left turn, provided you can pass safely without
    driving on or across the shoulder.
- id: 170
  category: defensive_driving
  question: What should you do if another vehicle passes you on the left?
  choices:
    A: Increase your speed to prevent them from passing
    B: Move onto the right shoulder of the road
    C: Decrease your speed slightly and stay centered in your lane
    D: Flash your headlights to warn oncoming traffic
  answer: C
  explanation: If another vehicle passes you on the left, decrease your speed slightly
    and stay centered in your lane.
- id: 171
  category: sharing_the_road
  question: How far away must you stop from a school bus that is flashing its red
    lights?
  choices:
    A: At least 10 feet
    B: At least 15 feet
    C: At least 20 feet
    D: At least 50 feet
  answer: C
  explanation: When a stopped school bus flashes its red light(s), traffic that approaches
    from either direction must stop before it reaches the bus. You should stop at
    least 20 feet (6 m) away from the bus.
- id: 172
  category: safe_driving_rules
  question: If you are driving on a divided highway and a school bus on the opposite
    side of the highway stops with its red lights flashing, what must you do?
  choices:
    A: Proceed with caution since the highway is divided
    B: Stop, as the law applies on all roadways in New York State
    C: Slow down to 15 mph and pass carefully
    D: Stop only if children are actively crossing your side of the highway
  answer: B
  explanation: This law applies on all roadways in New York State. You must stop for
    a school bus even if it is on the opposite side of a divided highway.
- id: 173
  category: penalties_and_points
  question: What is the penalty for being convicted of passing a stopped school bus
    three times within three years?
  choices:
    A: A maximum fine of $250
    B: A mandatory defensive driving course
    C: Your driver license will be revoked for a minimum of six months
    D: Your vehicle will be impounded for 30 days
  answer: C
  explanation: If you are convicted of three of these violations in three years, your
    driver license will be revoked for a minimum of six months.
- id: 174
  category: sharing_the_road
  question: What do flashing yellow warning lights on a school bus indicate?
  choices:
    A: The bus is broken down and needs assistance
    B: The bus is preparing to stop to load or discharge passengers
    C: You are required to stop immediately
    D: The bus is accelerating to merge into traffic
  answer: B
  explanation: Before a school bus stops to load or discharge passengers, the driver
    will usually flash yellow warning lights. When you see them, decrease speed and
    be prepared to stop.
- id: 175
  category: penalties_and_points
  question: What is the minimum fine for a first violation of passing a stopped school
    bus?
  choices:
    A: $100
    B: $150
    C: $250
    D: $500
  answer: C
  explanation: According to the manual, the fine when you pass a stopped school bus
    ranges from a minimum of $250 for a first violation to a maximum of $1,000 for
    three violations in three years.
- id: 176
  category: penalties_and_points
  question: Under the stop-arm camera law, what is the penalty for a third violation
    of passing a stopped school bus within 18 months?
  choices:
    A: $250
    B: $275
    C: $300
    D: $500
  answer: C
  explanation: The manual specifies that a third violation (or more) within 18 months
    caught by a stop-arm camera carries a penalty of $300.
- id: 177
  category: safe_driving_rules
  question: When you have finished parallel parking, how close must your wheels be
    to the curb?
  choices:
    A: No more than one foot (30 cm)
    B: No more than eighteen inches
    C: No more than two feet
    D: No more than six inches
  answer: A
  explanation: 'The manual states: "In your final parking position, your wheels must
    be no more than one foot (30 cm) from the curb."'
- id: 178
  category: safe_driving_rules
  question: Where should you look when backing up your vehicle during a parallel parking
    maneuver?
  choices:
    A: Only in your side mirrors
    B: Through the rear window
    C: Only in your interior rear-view mirror
    D: At your backup camera screen exclusively
  answer: B
  explanation: The manual instructs drivers to "Look through the rear window, not
    the mirrors, when you back up" during parallel parking.
- id: 179
  category: safe_driving_rules
  question: Which way should you turn your steering wheel when parking on a hill?
  choices:
    A: Away from the curb
    B: Toward the curb or side of the road
    C: Straight ahead
    D: Parallel to the center line
  answer: B
  explanation: When parking on a hill, the manual states to "Turn the wheels toward
    the curb or side of the road, so they will keep your vehicle from heading into
    traffic."
- id: 180
  category: signs_and_signals
  question: What does a NO PARKING sign indicate?
  choices:
    A: You cannot stop for any reason.
    B: You may only stop to obey a traffic signal.
    C: You can make a temporary stop to load or discharge merchandise or passengers.
    D: You can park if you remain in the driver's seat.
  answer: C
  explanation: According to the manual, "A NO PARKING sign means you can make a temporary
    stop to load or discharge merchandise or passengers."
- id: 181
  category: signs_and_signals
  question: What are you permitted to do at a NO STANDING sign?
  choices:
    A: Temporarily stop to load or discharge passengers without exiting the vehicle.
    B: Stop to load or unload merchandise.
    C: Park for less than 5 minutes.
    D: Leave the vehicle running while you run an errand.
  answer: A
  explanation: 'The manual states: "A NO STANDING sign means you can only make a temporary
    stop to load or discharge passengers. The driver cannot exit the vehicle."'
- id: 182
  category: safe_driving_rules
  question: How far must you stay from a fire hydrant when parking, stopping, or standing,
    unless a licensed driver remains in the vehicle?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: You cannot park, stop or stand within 15 feet (5 m) of a fire hydrant,
    unless a licensed driver remains in the vehicle to move it in an emergency.
- id: 183
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when parking or standing
    near a crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Parking or standing is not allowed within 20 feet (6 m) of a crosswalk
    at an intersection.
- id: 184
  category: safe_driving_rules
  question: You are not allowed to park or stand within what distance of a STOP sign,
    YIELD sign, or traffic light?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: The manual states that parking or standing is not allowed within 30
    feet (10 m) of a traffic light, STOP sign or YIELD sign.
- id: 185
  category: safe_driving_rules
  question: What is the minimum distance you must park away from a railroad crossing?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: D
  explanation: According to the manual, "You cannot park your vehicle within 50 feet
    (15 m) of a railroad crossing."
- id: 186
  category: driver_responsibility
  question: When are you legally allowed to park in a space reserved for persons with
    disabilities?
  choices:
    A: Anytime, as long as you have a disabled parking permit in the vehicle.
    B: Only if you have a permit or plates AND the person who received them is in
      the vehicle.
    C: If you are running a quick errand for a disabled family member.
    D: If all other regular parking spaces are currently occupied.
  answer: B
  explanation: You can park in reserved spaces only if you have a permit or vehicle
    plates for persons with disabilities and only when the person who received the
    permit or vehicle plates is in the vehicle.
- id: 187
  category: safe_driving_rules
  question: Why must you avoid parking in the spaces with diagonal stripes next to
    reserved disabled parking areas?
  choices:
    A: They are reserved exclusively for emergency vehicles.
    B: They are loading zones for delivery trucks.
    C: They provide necessary access for wheelchairs and vehicles with special equipment.
    D: They are designated for shopping cart storage.
  answer: C
  explanation: 'The manual warns: "Do not park in the spaces with diagonal stripes
    next to reserved parking areas. These spaces are needed to give access to those
    with wheelchairs and vehicles with special equipment."'
- id: 188
  category: penalties_and_points
  question: What is one of the penalties for making a false statement on an application
    for disabled vehicle plates?
  choices:
    A: A mandatory license revocation
    B: A warning letter from the DMV
    C: A mandatory defensive driving course
    D: A 30-day vehicle impoundment
  answer: A
  explanation: It is a misdemeanor to make a false statement on an application for
    vehicle plates, and you would be subject to a mandatory license revocation and
    could face a fine, incarceration, or both.
- id: 189
  category: penalties_and_points
  question: What is the mandatory surcharge added to penalties for shopping center
    parking violations?
  choices:
    A: $15
    B: $20
    C: $30
    D: $50
  answer: C
  explanation: According to the manual, a mandatory surcharge of $30 will be added
    to each penalty for a shopping center parking violation.
- id: 190
  category: defensive_driving
  question: What is the recommended seating position and hand placement while driving?
  choices:
    A: Slouching with one hand on the bottom of the wheel.
    B: Sitting in a comfortable but vertical position with both hands on the steering
      wheel.
    C: Leaning back with one hand on the wheel and one on the window.
    D: Sitting as close to the steering wheel as possible with hands at the top.
  answer: B
  explanation: You should sit in a comfortable but vertical position and keep both
    hands on the steering wheel. Slouching or using only one hand makes it dangerous
    to control your vehicle.
- id: 191
  category: defensive_driving
  question: When approaching an intersection where another driver has a STOP or YIELD
    sign, what should you assume?
  choices:
    A: The other driver will always stop or yield.
    B: The other driver will wave you through the intersection.
    C: It is better to assume the other driver will not stop.
    D: The other driver has the right-of-way.
  answer: C
  explanation: The manual advises to anticipate errors by other drivers and states,
    'It is better to assume the other driver will not stop' even if they approach
    a STOP or YIELD sign.
- id: 192
  category: driver_responsibility
  question: Which of the following is considered a dangerous driving distraction according
    to the manual?
  choices:
    A: Checking your mirrors every few seconds.
    B: Scanning the road ahead.
    C: Engaging in stressful or emotional conversations with passengers.
    D: Keeping both hands on the steering wheel.
  answer: C
  explanation: The manual lists avoiding arguments and stressful or emotional conversations
    with passengers as a necessary step to prevent distracted driving.
- id: 193
  category: safe_driving_rules
  question: What is the primary difference between aggressive driving and road rage?
  choices:
    A: Aggressive driving involves breaking a criminal law, while road rage involves
      breaking a traffic safety law.
    B: Aggressive driving generally involves the violation of a traffic safety law,
      while road rage involves the breaking of a criminal law.
    C: Aggressive driving only happens on highways, while road rage happens on city
      streets.
    D: There is no difference; the terms mean the exact same thing.
  answer: B
  explanation: According to the manual, aggressive driving generally involves the
    violation of a traffic safety law, while road rage involves the breaking of a
    criminal law.
- id: 194
  category: defensive_driving
  question: If an aggressive driver confronts you on the road, what is the best course
    of action?
  choices:
    A: Make eye contact to show you are not intimidated.
    B: Challenge them by increasing your speed.
    C: Do not make eye contact and try to move away safely.
    D: Return their gestures and shouts to defend yourself.
  answer: C
  explanation: When an aggressive driver confronts you, you should not make eye contact,
    remain calm, and try to move away safely.
- id: 195
  category: defensive_driving
  question: What should you do if an aggressive driver is following you?
  choices:
    A: Stop your vehicle and get out to confront them.
    B: Drive to the nearest police station.
    C: Pull over to the shoulder and wait for them to pass.
    D: Drive to your home and lock the doors.
  answer: B
  explanation: 'If an aggressive driver is following you, the manual explicitly states:
    ''do not stop or get out of your vehicle. Drive to the nearest police station.'''
- id: 196
  category: defensive_driving
  question: How should a defensive driver view the right-of-way?
  choices:
    A: As a complete right that should never be yielded.
    B: As a rule that only applies to pedestrians.
    C: As something to be prepared to yield to other highway users to avoid a crash.
    D: As a guarantee that other drivers will stop for you.
  answer: C
  explanation: If you have the right-of-way, do not think of it as a complete right.
    Be prepared to yield the right-of-way to other highway users to avoid a crash.
- id: 197
  category: safe_driving_rules
  question: If no speed limit is posted on a highway in New York, what is the maximum
    speed you may legally drive?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: You must obey the speed limit. If no limit is posted, drive no more
    than 55 mph (88 km/h).
- id: 198
  category: safe_driving_rules
  question: Unless another limit is posted, what is the default speed limit in New
    York City?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: The manual notes that some cities have unposted speed limits less than
    55 mph, stating specifically that the speed limit is 25 mph in New York City unless
    another limit is posted.
- id: 199
  category: penalties_and_points
  question: Can you receive a speeding ticket if you are driving below the posted
    speed limit?
  choices:
    A: No, as long as you are below the posted limit, you cannot be ticketed.
    B: Yes, if your speed is 'not reasonable' for hazardous weather or road conditions.
    C: Yes, but only if you are driving in a school zone.
    D: No, police only issue tickets for exceeding the posted limit.
  answer: B
  explanation: Even if you drive below the limit on a hazardous highway, a police
    officer could ticket you for a speed 'not reasonable' for the conditions.
- id: 200
  category: safe_driving_rules
  question: Why do some highways have minimum speed limits?
  choices:
    A: To increase the amount of toll revenue collected.
    B: To keep a smooth traffic flow and prevent dangerous conditions caused by slow
      drivers.
    C: To encourage drivers to use local roads instead.
    D: To ensure drivers reach their destinations faster.
  answer: B
  explanation: To keep a smooth traffic flow, some highways have minimum speed limits.
    Driving slower than the minimum can interfere with traffic flow and create a dangerous
    condition.
- id: 201
  category: defensive_driving
  question: According to the manual, what proportion of crashes involve rear-end collisions,
    normally because a person is following too closely?
  choices:
    A: 1 of every 10 crashes
    B: 2 of every 10 crashes
    C: 4 of every 10 crashes
    D: 6 of every 10 crashes
  answer: C
  explanation: Four of every 10 crashes involve rear-end collisions, normally because
    a person is following too closely (tailgating).
- id: 202
  category: penalties_and_points
  question: Which of the following can be a penalty for behaviors associated with
    road rage?
  choices:
    A: Fines, imprisonment, and court-ordered probation.
    B: A mandatory upgrade to a commercial driver license.
    C: A requirement to retake the written permit test only.
    D: A warning letter with no further legal action.
  answer: A
  explanation: Endangering, threatening or assaulting another person is illegal. These
    behaviors can result in severe penalties that include fines, imprisonment, court-ordered
    probation, and license revocation or suspension.
- id: 203
  category: safe_driving_rules
  question: What is the maximum restricted speed for vehicles within a roundabout?
  choices:
    A: 15 mph
    B: 20 mph
    C: 30 mph
    D: 45 mph
  answer: C
  explanation: Roundabouts are designed so that the speed of all vehicles is restricted
    to 30 mph (50 km/h) or less within the roundabout.
- id: 204
  category: sharing_the_road
  question: How should a driver interact with a bicyclist riding in a roundabout?
  choices:
    A: Honk to warn them to move over
    B: Pass them quickly on the left
    C: Do not pass the bicycle in the roundabout
    D: Force them to use the pedestrian crosswalk
  answer: C
  explanation: 'Bicyclists are permitted to ride within the roundabout in the lane
    just as other vehicles do. The manual states: ''Please do not pass a bicycle in
    the roundabout.'''
- id: 205
  category: safe_driving_rules
  question: What signal should you use when approaching your exit in a roundabout?
  choices:
    A: Left turn signal
    B: Right turn signal
    C: Hazard lights
    D: No signal is required
  answer: B
  explanation: As you approach your exit in a roundabout, you must turn on your right
    turn signal.
- id: 206
  category: sharing_the_road
  question: Which of the following is a rule for pedestrians navigating a roundabout?
  choices:
    A: Cross directly to the central island
    B: Walk in the circular roadway
    C: Cross only at designated crosswalks
    D: Yield the right-of-way to vehicles
  answer: C
  explanation: Pedestrians should cross only at the designated crosswalks and never
    cross to the central island. They also have the right-of-way over vehicles.
- id: 207
  category: alcohol_drugs_health
  question: Which of the following is a symptom of drowsy driving?
  choices:
    A: Hyper-focusing on the road ahead
    B: Remembering the last few miles in vivid detail
    C: Drifting between lanes or hitting rumble strips
    D: Reacting to hazards faster than usual
  answer: C
  explanation: Symptoms of fatigue include drifting between lanes, tailgating, missing
    traffic signs, or drifting off the road and hitting rumble strips.
- id: 208
  category: alcohol_drugs_health
  question: To prevent drowsy driving on long trips, how often should you schedule
    regular stops?
  choices:
    A: Every 50 miles or one hour
    B: Every 100 miles or two hours
    C: Every 200 miles or four hours
    D: Only when you need to refuel
  answer: B
  explanation: Before embarking on a trip, you should schedule regular stops for every
    100 miles or two hours to prevent fatigue.
- id: 209
  category: alcohol_drugs_health
  question: If you suspect you are drowsy while driving, how long should you nap after
    pulling off into a safe area?
  choices:
    A: 5 to 10 minutes
    B: 15 to 45 minutes
    C: 1 to 2 hours
    D: At least 4 hours
  answer: B
  explanation: If you are drowsy, you should pull off into a safe area away from traffic
    and take a brief nap of 15 to 45 minutes.
- id: 210
  category: alcohol_drugs_health
  question: Approximately how long does it take for caffeine to enter the bloodstream
    and promote short-term alertness?
  choices:
    A: 5 minutes
    B: 15 minutes
    C: 30 minutes
    D: 60 minutes
  answer: C
  explanation: It takes about 30 minutes for caffeine to enter the bloodstream to
    promote short-term alertness.
- id: 211
  category: penalties_and_points
  question: What is the penalty for a first offense of speaking into a hand-held mobile
    telephone while driving in New York State?
  choices:
    A: A fine up to $100 and 2 license points
    B: A fine up to $200 and 5 license points
    C: A fine up to $250 and 3 license points
    D: A fine up to $450 and license suspension
  answer: B
  explanation: For a first offense of using a hand-held mobile telephone while driving,
    you could be required to pay a fine up to $200 and receive five license points.
- id: 212
  category: penalties_and_points
  question: What is the maximum fine for a third or subsequent offense of texting
    while driving committed within 18 months?
  choices:
    A: $200
    B: $250
    C: $450
    D: $500
  answer: C
  explanation: A third or subsequent offense of texting while driving (all committed
    within 18 months) carries a fine of up to $450.
- id: 213
  category: penalties_and_points
  question: What happens to a driver with a probationary or junior license who is
    convicted of texting while driving for the first time?
  choices:
    A: They receive a warning letter
    B: They receive a 60-day suspension
    C: They receive a 120-day suspension
    D: Their license is revoked for one year
  answer: C
  explanation: Drivers with probationary and junior licenses who use a hand-held phone
    or text while driving will receive a 120-day suspension for a first conviction.
- id: 214
  category: vehicle_information
  question: How often must a vehicle be inspected to be legally operated or parked
    on public highways in New York?
  choices:
    A: At least once every 6 months
    B: At least once a year
    C: At least once every two years
    D: Only when the vehicle is sold
  answer: B
  explanation: No person shall operate or park a vehicle on public highways unless
    it has been inspected at least once a year.
- id: 215
  category: vehicle_information
  question: What should you do if your brakes pull to one side because they are wet?
  choices:
    A: Pump the brakes rapidly for one minute
    B: Dry them by riding the pedal lightly
    C: Shift into a lower gear and avoid braking
    D: Pull over and wait for them to air dry
  answer: B
  explanation: Brakes that pull to one side may be wet. If wet, you can dry them by
    riding the pedal lightly.
- id: 216
  category: vehicle_information
  question: What is the minimum legal tire tread depth required by law?
  choices:
    A: 1/32nds of an inch
    B: 2/32nds of an inch
    C: 3/32nds of an inch
    D: 4/32nds of an inch
  answer: B
  explanation: The law requires that your tires have at least 2/32nds of an inch (.16
    cm) of tread.
- id: 217
  category: vehicle_information
  question: When checking your tire tread depth with a penny, what indicates that
    your tires are too worn and need replacement?
  choices:
    A: You can see all of Abraham Lincoln's head
    B: Lincoln's head is completely hidden
    C: You can only see Lincoln's hair
    D: The penny falls out of the groove
  answer: A
  explanation: Place Lincoln’s head first into the deepest looking groove. If you
    can see all of his head, your tires are too worn and you should not drive on them.
- id: 218
  category: vehicle_information
  question: How can you check if your tire tread depth is too worn using a penny?
  choices:
    A: If you can see all of Abraham Lincoln's head when placed head first into the
      deepest groove
    B: If Lincoln's head is completely covered by the tire tread
    C: If the penny falls over when placed in the groove
    D: If the penny sits flush with the outer tire wall
  answer: A
  explanation: According to the manual, if you place Lincoln's head first into the
    deepest looking groove and can see all of his head, your tires are too worn and
    should not be driven on.
- id: 219
  category: safe_driving_rules
  question: When is it appropriate to use your vehicle's horn?
  choices:
    A: To express anger at other drivers or pedestrians
    B: To warn other drivers or pedestrians of possible problems
    C: To greet friends walking on the sidewalk
    D: To encourage the driver in front of you to drive faster
  answer: B
  explanation: The manual states the horn is important safety equipment that could
    become your only means of warning other drivers or pedestrians of possible problems,
    and it should not be used to express anger.
- id: 220
  category: alcohol_drugs_health
  question: In New York State, approximately what percentage of all motor vehicle
    fatalities involve impaired driving?
  choices:
    A: 10 percent
    B: 25 percent
    C: More than 40 percent
    D: 60 percent
  answer: C
  explanation: The manual states that in New York State, more than 40 percent of all
    motor vehicle fatalities involve impaired driving.
- id: 221
  category: alcohol_drugs_health
  question: Why are driver license revocation penalties more severe for young drivers
    who drive under the influence?
  choices:
    A: They generally drive faster than older drivers
    B: They make up 7 percent of impaired drivers in fatal crashes despite being only
      4 percent of the driving population
    C: They are more likely to drive without insurance
    D: They consume more alcohol on average than older drivers
  answer: B
  explanation: Drivers under age 21 are approximately 4 percent of the driving population,
    but 7 percent of the impaired drivers involved in fatal crashes. This is one reason
    revocation penalties are more severe for young drivers.
- id: 222
  category: alcohol_drugs_health
  question: How does alcohol affect your vision at night?
  choices:
    A: It improves your ability to see in the dark
    B: It reduces your ability to recover from the glare of headlights
    C: It makes headlights appear dimmer
    D: It increases your peripheral vision
  answer: B
  explanation: The manual notes that alcohol reduces your ability to recover from
    the glare of headlights, making it especially dangerous to drink and drive after
    dark.
- id: 223
  category: alcohol_drugs_health
  question: When do the effects of alcohol consumption on your driving abilities begin?
  choices:
    A: Only after your BAC reaches .08 percent
    B: When you start to feel intoxicated
    C: With the first drink
    D: After you have consumed three drinks in one hour
  answer: C
  explanation: The manual states that the effects of alcohol consumption can begin
    long before you become intoxicated or even legally impaired and begin with the
    first drink.
- id: 224
  category: alcohol_drugs_health
  question: What Blood Alcohol Content (BAC) level is considered legal evidence of
    intoxication in New York State?
  choices:
    A: .02 percent or higher
    B: .05 percent or higher
    C: .08 percent or higher
    D: .18 percent or higher
  answer: C
  explanation: A BAC of .08 percent or higher is evidence of intoxication. A BAC of
    more than .05 percent is evidence of impairment, and .18 percent or more is aggravated
    DWI.
- id: 225
  category: alcohol_drugs_health
  question: A Blood Alcohol Content (BAC) of more than .05 percent is legal evidence
    of what offense?
  choices:
    A: Aggravated driving while intoxicated
    B: Driving while ability impaired
    C: Driving while intoxicated
    D: Chemical test refusal
  answer: B
  explanation: According to the manual, a BAC of more than .05 percent is legal evidence
    that you are impaired.
- id: 226
  category: penalties_and_points
  question: Can you be convicted of an alcohol or drug-related driving offense without
    a chemical test?
  choices:
    A: No, a chemical test is always required by law to prove impairment
    B: Yes, but only if you confess to the offense in writing
    C: Yes, the testimony of a police officer about your driving and behavior can
      provide enough evidence
    D: No, unless there is video evidence of you consuming alcohol
  answer: C
  explanation: The manual states that the testimony of a police officer about the
    way you drive, your appearance, and behavior can provide enough evidence to convict
    you, even without a chemical test.
- id: 227
  category: alcohol_drugs_health
  question: Which of the following factors does NOT determine your Blood Alcohol Content
    (BAC)?
  choices:
    A: How much alcohol you drink
    B: Your body weight
    C: How much time passes between drinks
    D: The type of alcoholic beverage you drink
  answer: D
  explanation: Your BAC depends on how much you drink, time between drinks, and your
    weight. It does not depend on the type of beverage you drink, how fit you are,
    or how you can 'hold your liquor.'
- id: 228
  category: alcohol_drugs_health
  question: Which of the following drinks contains the most alcohol?
  choices:
    A: 1 1/2 ounces of 80-proof liquor
    B: 5 ounces of wine (12% alcohol)
    C: 12 ounces of beer (5% alcohol)
    D: They all contain about the same amount of alcohol
  answer: D
  explanation: The manual states that 1-1/2 ounces of liquor, 5 ounces of wine, 12
    ounces of beer, and 12 ounces of wine cooler contain about the same amount of
    alcohol. None is 'safer to drink' than the others.
- id: 229
  category: alcohol_drugs_health
  question: What is the only effective method to reduce your Blood Alcohol Content
    (BAC)?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Not drinking over a period of time
    D: Vigorous exercise
  answer: C
  explanation: The manual explicitly states that the only method to effectively reduce
    your BAC is not to drink over a period of time. Coffee, exercise, and cold showers
    cannot reduce your BAC.
- id: 230
  category: license_system
  question: What does New York's 'Implied Consent' law mean?
  choices:
    A: You consent to a vehicle search if pulled over by law enforcement
    B: You consent to take a chemical test for BAC when you drive in the state
    C: You consent to pay all traffic fines immediately upon receiving a ticket
    D: You consent to have your license suspended if you get a speeding ticket
  answer: B
  explanation: Under New York's 'Implied Consent' law, when you drive a car in the
    state you are considered to have given your consent to take a chemical test to
    measure your BAC.
- id: 231
  category: penalties_and_points
  question: What happens to your driver license if you are found guilty of an alcohol
    or drug-related violation?
  choices:
    A: You receive a warning for the first offense
    B: You must retake the driving test within 30 days
    C: The court must revoke or suspend your license when you are sentenced
    D: Your license is restricted to daytime driving only
  answer: C
  explanation: If you are found guilty of any alcohol or drug-related violation, the
    court must revoke or suspend your driver license when you are sentenced.
- id: 232
  category: alcohol_drugs_health
  question: On average, how long does it take the body of a 150-pound male to remove
    the alcohol from one standard drink?
  choices:
    A: 30 minutes
    B: Approximately one hour
    C: Two hours
    D: Four hours
  answer: B
  explanation: For a 150-pound male, each standard drink increases his BAC by about
    .02 percent. On average, it takes the body approximately one hour to remove that
    much alcohol.
- id: 233
  category: alcohol_drugs_health
  question: Under New York's "Implied Consent" law, what do you consent to by driving
    a car in the state?
  choices:
    A: Allowing police to search your vehicle without a warrant
    B: Taking a chemical test to measure your Blood Alcohol Content (BAC)
    C: Paying all traffic tickets within 30 days
    D: Having your vehicle impounded if you are arrested
  answer: B
  explanation: Under New York's "Implied Consent" law, when you drive a car in the
    state, you are considered to have given your consent to take a chemical test to
    measure your BAC.
- id: 234
  category: penalties_and_points
  question: What happens to your driver license if you refuse to take a chemical test
    after being arrested for an alcohol or drug-related violation?
  choices:
    A: It is suspended when you are arraigned in court.
    B: It is permanently revoked immediately.
    C: You receive a warning but keep your license until trial.
    D: It is restricted to driving to and from work only.
  answer: A
  explanation: If you refuse to take the test after being arrested, your driver license
    will be suspended when you are arraigned in court on the alcohol or other drug-related
    charge.
- id: 235
  category: penalties_and_points
  question: The DMV will permanently deny any application for license reinstatement
    if a driver has how many alcohol or drug-related driving convictions in their
    lifetime?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: C
  explanation: The DMV will permanently deny reinstatement if the applicant has four
    alcohol or drug-related driving convictions or incidents in their lifetime.
- id: 236
  category: penalties_and_points
  question: Which of the following is considered a "serious driving offense" under
    New York's repeat offender regulations?
  choices:
    A: Accumulating 10 points for driving violations within a 10-year period
    B: A fatal crash
    C: A parking ticket in a school zone
    D: Failing to yield the right-of-way at a stop sign
  answer: B
  explanation: A serious driving offense includes a fatal crash, a driving-related
    penal law conviction, an accumulation of 20 or more points within 25 years, or
    two 5+ point convictions within 25 years.
- id: 237
  category: alcohol_drugs_health
  question: Under New York's "zero tolerance" law, it is a violation for a person
    under 21 to drive with a measurable BAC in what range?
  choices:
    A: .01 to .05
    B: .02 to .07
    C: .05 to .08
    D: .08 and higher
  answer: B
  explanation: Under the state's "zero tolerance" law, it is a violation for a person
    under 21 to drive with any BAC that can be measured (.02 to .07).
- id: 238
  category: penalties_and_points
  question: What is the penalty for a first Zero Tolerance violation for a driver
    under age 21?
  choices:
    A: A 30-day license suspension and a $50 fine
    B: A 6-month license suspension, a $100 termination fee, and a $125 civil penalty
    C: A 1-year license revocation and a $500 fine
    D: Mandatory imprisonment for 5 days
  answer: B
  explanation: After a finding of a first Zero Tolerance violation, the driver license
    will be suspended for six months, and the driver must pay a $100 suspension termination
    fee and a $125 civil penalty.
- id: 239
  category: penalties_and_points
  question: What is the maximum fine for a first conviction of possessing an open
    container of an alcoholic beverage in a motor vehicle on a public highway?
  choices:
    A: $50
    B: $100
    C: $150
    D: $250
  answer: C
  explanation: The penalty for a first conviction of the Open Container Law is a fine
    up to $150, a mandatory surcharge, a crime victim assistance fee, and possible
    imprisonment of 15 days.
- id: 240
  category: safe_driving_rules
  question: Who is exempt from the Open Container Law regarding alcoholic beverages?
  choices:
    A: Drivers of commercial trucks
    B: Passengers in vehicles like stretch limousines that display a valid commerce
      certificate
    C: Passengers in the backseat of any standard passenger vehicle
    D: Drivers who are over the age of 25
  answer: B
  explanation: The Open Container law exempts passengers in vehicles like stretch
    limousines and other vehicles that display a commerce certificate or permit issued
    by the U.S. or NYS Department of Transportation.
- id: 241
  category: penalties_and_points
  question: What is the consequence of using a driver license to illegally purchase
    beverages that contain alcohol?
  choices:
    A: A fine of $500
    B: Suspension of your driver license or privilege to apply for a license
    C: Mandatory community service
    D: Permanent revocation of your driver license
  answer: B
  explanation: State law requires the suspension of your driver license or privilege
    to apply for a license if you use it as proof of age to illegally purchase beverages
    that contain alcohol.
- id: 242
  category: alcohol_drugs_health
  question: 'Aggravated Driving While Intoxicated (AGG-DWI) applies to drivers with
    a Blood Alcohol Content (BAC) of at least:'
  choices:
    A: '0.05'
    B: '0.08'
    C: '0.15'
    D: '0.18'
  answer: D
  explanation: Aggravated Driving While Intoxicated (AGG-DWI) applies to a Blood Alcohol
    Content (BAC) of 0.18 and higher.
- id: 243
  category: penalties_and_points
  question: What is the maximum jail sentence for a first offense of Driving While
    Intoxicated (DWI)?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: For a 1st Offense of Driving While Intoxicated (DWI), the maximum jail
    sentence is up to 1 year.
- id: 244
  category: penalties_and_points
  question: If a driver is approved for license reinstatement after a 5-year denial
    period due to repeated alcohol-related convictions, how long must they use an
    interlock device?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: D
  explanation: The regulations require an interlock device on the vehicle driven by
    the applicant for five years from the date of issuance of the licensing document.
- id: 245
  category: alcohol_drugs_health
  question: 'Under the Open Container Law, it is a traffic infraction for a driver
    or passenger in a motor vehicle on a public highway to:'
  choices:
    A: Transport unopened marijuana/cannabis in the trunk
    B: Consume marijuana/cannabis
    C: Possess prescription medication in its original bottle
    D: Drink a non-alcoholic beverage
  answer: B
  explanation: It is a traffic infraction for a driver or passenger in a motor vehicle
    on a public highway, street or road to consume marijuana/cannabis.
- id: 246
  category: penalties_and_points
  question: What is the required license action for a first offense of Driving While
    Ability Impaired (DWAI)?
  choices:
    A: 30-day suspension
    B: 90-day suspension
    C: 6-month revocation
    D: 1-year revocation
  answer: B
  explanation: According to the manual, a 1st Offense for DWAI (Traffic Infraction)
    requires a 90-day suspension.
- id: 247
  category: penalties_and_points
  question: What is the maximum jail sentence for a second DWAI offense within 5 years?
  choices:
    A: Up to 15 days
    B: Up to 30 days
    C: Up to 90 days
    D: Up to 180 days
  answer: B
  explanation: The manual states that a 2nd Offense DWAI within 5 years carries a
    jail sentence of up to 30 days.
- id: 248
  category: alcohol_drugs_health
  question: Under Leandra's Law, committing an alcohol-related offense with a child
    in the vehicle is a class E felony if the child is under what age?
  choices:
    A: 12 years old
    B: 14 years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: Leandra's Law states that drivers who commit alcohol-related offenses
    with a child under 16 years old in the vehicle may be charged with a class E felony.
- id: 249
  category: penalties_and_points
  question: How long must a driver typically maintain an ignition interlock device
    on their vehicle after a DWI conviction?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 12 months
    D: At least 24 months
  answer: C
  explanation: Courts must order persons convicted of DWI or aggravated DWI to install
    and maintain an ignition interlock on any vehicle they own or operate for at least
    12 months.
- id: 250
  category: license_system
  question: 'A conditional driver license will be revoked if the motorist is convicted
    of any traffic offense EXCEPT:'
  choices:
    A: Speeding
    B: Failure to yield
    C: Parking, stopping, or standing
    D: Running a red light
  answer: C
  explanation: The manual notes that a conditional driver license will be revoked
    if the motorist does not comply with court terms or for a conviction for any traffic
    offense except parking, stopping or standing.
- id: 251
  category: penalties_and_points
  question: If you are arrested for driving while impaired or intoxicated and your
    license is already suspended or revoked, what is the maximum mandatory fine you
    face?
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: If impaired or intoxicated when you are arrested while driving with
    a suspended or revoked license, the maximum mandatory fine is $5,000 and the vehicle
    can be seized.
- id: 252
  category: penalties_and_points
  question: What is the maximum jail term you can face if you kill or cause injury
    to another person because of an alcohol or drug-related violation?
  choices:
    A: 10 years
    B: 15 years
    C: 20 years
    D: 25 years
  answer: D
  explanation: Killing or causing injury due to an alcohol or other drug-related violation
    can result in convictions that carry a maximum jail term of 25 years.
- id: 253
  category: safe_driving_rules
  question: 'When crossing railroad tracks, you should always:'
  choices:
    A: Shift gears while crossing the tracks
    B: Stay in your lane and in the same gear
    C: Speed up to cross as quickly as possible
    D: Stop on the tracks to check for trains
  answer: B
  explanation: 'The manual explicitly states: "When crossing tracks, always stay in
    your lane and in the same gear."'
- id: 254
  category: signs_and_signals
  question: When approaching an active grade crossing with flashing red lights and
    lowered gates, when is it legal to proceed?
  choices:
    A: As soon as the train has passed, even if the gates are down
    B: When the gates are completely raised and the lights are off
    C: When the gates start to rise and you can see clearly
    D: If you are driving a small vehicle that can fit under the gate
  answer: B
  explanation: When approaching marked, or active, grade crossings, do not proceed
    until the gates are completely raised and the lights are off.
- id: 255
  category: safe_driving_rules
  question: If flashing red lights, lowered crossing gates, or a bell indicate an
    approaching train, you must stop at least how far from the tracks?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 25 feet
  answer: C
  explanation: Flashing red lights, lowered crossing gates and/or a bell at a railroad
    crossing indicate that you must stop at least 15 feet (5 m) from the tracks.
- id: 256
  category: signs_and_signals
  question: What does a yellow sign with black letters "RR" and an "X" symbol mean?
  choices:
    A: You must come to a complete stop immediately
    B: There is a railroad crossing ahead
    C: The railroad crossing is closed
    D: You are approaching a crossbuck sign
  answer: B
  explanation: A yellow sign with black letters "RR" and an "X" symbol is a Railroad
    Crossing Warning Sign, meaning there is a railroad crossing ahead and you should
    use caution and be prepared to stop.
- id: 257
  category: signs_and_signals
  question: What shape is a crossbuck sign at a railroad crossing?
  choices:
    A: A circle
    B: A diamond
    C: An "X"
    D: An octagon
  answer: C
  explanation: A crossbuck sign is described in the manual as a sign shaped like an
    "X" with "RAILROAD CROSSING" printed on it.
- id: 258
  category: defensive_driving
  question: 'When judging the distance and speed of an approaching train, you should
    remember that:'
  choices:
    A: Trains are usually moving slower than they appear
    B: Trains are closer and faster-moving than you think
    C: Trains can stop quickly if they see a vehicle on the tracks
    D: Trains will always sound a horn before you can see them
  answer: B
  explanation: The manual advises drivers to "Remember that the train you see is closer
    and faster-moving than you think, and be aware that trains cannot stop quickly."
- id: 259
  category: alcohol_drugs_health
  question: Which of the following is a recommended strategy to avoid driving while
    impaired?
  choices:
    A: Drink a lot of coffee before driving
    B: Alternate between drinks with alcohol and drinks without alcohol
    C: Drive only on local roads instead of highways
    D: Keep the windows down to stay alert
  answer: B
  explanation: To avoid trouble, the manual recommends to "Drink slowly. Alternate
    between drinks with alcohol and drinks without any alcohol."
- id: 260
  category: safe_driving_rules
  question: Under what circumstances should you attempt to cross railroad tracks?
  choices:
    A: Only when you are certain your entire vehicle will clear all of the tracks
    B: Whenever the vehicle ahead of you begins to cross
    C: If the train is more than 100 feet away
    D: If the crossing does not have flashing lights
  answer: A
  explanation: 'The manual warns: "Do not under any circumstances, attempt to cross
    any railroad tracks unless you are certain your entire vehicle will clear all
    of the tracks."'
- id: 261
  category: defensive_driving
  question: What is the first thing you should do if your vehicle stalls on railroad
    tracks?
  choices:
    A: Try to restart the engine immediately
    B: Get everyone out of the car and get away from the tracks
    C: Stay in the vehicle and call 911
    D: Push the vehicle off the tracks
  answer: B
  explanation: If you stall on the tracks for any reason, the manual states you must
    GET OUT (including everyone in the car) and get away from the tracks, even if
    you do not see a train.
- id: 262
  category: defensive_driving
  question: If your vehicle stalls on railroad tracks and a train is approaching,
    in which direction should you run?
  choices:
    A: Down the track in the same direction the train is moving
    B: Directly away from the tracks at a 90-degree angle
    C: Toward the train but away from the tracks at a 45-degree angle
    D: Parallel to the tracks in the opposite direction of the train
  answer: C
  explanation: If a train is approaching, run toward the train but away from the tracks
    at a 45-degree angle. Running in the same direction as the train can cause you
    to be hit with debris when the train hits your vehicle.
- id: 263
  category: sharing_the_road
  question: Which of the following vehicles is required to stop at all railroad crossings?
  choices:
    A: Passenger cars with children
    B: Motorcycles
    C: School buses with or without passengers
    D: Delivery trucks
  answer: C
  explanation: School buses with or without passengers, other buses with passengers
    on board, and vehicles with explosives or flammable cargo must stop at all railroad
    crossings.
- id: 264
  category: safe_driving_rules
  question: What should you do if you enter an expressway going in a different direction
    than you intended?
  choices:
    A: Carefully back up on the entrance ramp
    B: Cross the median when there is a break in traffic
    C: Pull over to the shoulder and make a U-turn
    D: Stay on the expressway until the next exit
  answer: D
  explanation: If you enter an expressway going a different direction than you intended,
    or at the wrong exit, stay on the expressway until the next exit. It is dangerous
    to back up on an entrance ramp or cross a median.
- id: 265
  category: safe_driving_rules
  question: If an expressway entrance lane is too short to allow acceleration to expressway
    speed, what is the safest method to enter?
  choices:
    A: Force your way into the right lane
    B: Stop and wait for a large space in traffic, then accelerate quickly
    C: Drive on the shoulder until you reach expressway speed
    D: Honk your horn so other drivers yield to you
  answer: B
  explanation: If the entrance lane is too short to allow acceleration to expressway
    speed, the safest method to enter is to stop and wait for a large space in traffic,
    then enter the expressway and accelerate quickly.
- id: 266
  category: safe_driving_rules
  question: How far in advance must you signal your exit before reaching the expressway
    exit ramp?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: Make sure to signal your exit at least 100 feet (30 m) before you reach
    the exit ramp.
- id: 267
  category: defensive_driving
  question: What does 'driving within the range' of your headlights mean?
  choices:
    A: Driving at a speed that allows you to stop safely within the distance your
      headlights cover
    B: Keeping your headlights aimed at the road surface
    C: Using high beams whenever you are driving over 40 mph
    D: Staying within 350 feet of the vehicle ahead of you
  answer: A
  explanation: Your headlights cover about 350 feet ahead. It is important that you
    drive at a speed that allows you to stop safely within that distance. This is
    called 'driving within the range' of your headlights.
- id: 268
  category: safe_driving_rules
  question: By law, during what times must you use your headlights?
  choices:
    A: From sunset to sunrise
    B: From one-half hour after the sun sets to one-half hour before the sun rises
    C: Only when there are no streetlights
    D: From one hour after sunset to one hour before sunrise
  answer: B
  explanation: The law requires you to use your headlights from one-half hour after
    the sun sets to one-half hour before the sun rises, when visibility is less than
    1,000 feet, and when you use your windshield wipers.
- id: 269
  category: safe_driving_rules
  question: You must dim your headlights to low beam when you are within what distance
    of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: Your headlights must be on low beam when you are within 500 feet (150
    m) of an oncoming vehicle.
- id: 270
  category: defensive_driving
  question: What should you do to help avoid the glare of an approaching vehicle's
    high beams?
  choices:
    A: Flash your high beams continuously
    B: Close one eye until the vehicle passes
    C: Move your eyes to the right and use the road edge as a guide
    D: Turn on your interior roof light
  answer: C
  explanation: To help avoid the glare of approaching high beams, move your eyes to
    the right. Use the road edge as a guide until the approaching vehicle passes by.
- id: 271
  category: vehicle_information
  question: What is 'hydroplaning'?
  choices:
    A: When your vehicle's brakes freeze in wet weather
    B: When your tires begin to ride on the water that is on top of the road pavement
    C: When fog mixes with rain to create zero visibility
    D: When your windshield wipers cannot keep up with heavy rain
  answer: B
  explanation: In heavy rain, your tires can begin to ride on the water that is on
    top of the road pavement. This is called 'hydroplaning' and can cause complete
    loss of traction and control of steering.
- id: 272
  category: safe_driving_rules
  question: Which headlights should you use for better visibility during rain, fog,
    or snow?
  choices:
    A: High beams
    B: Low beams
    C: Daytime running lights
    D: Parking lights
  answer: B
  explanation: Headlights on high beams reflect rain, fog and snow as it falls, making
    it harder to see. For better visibility during these weather conditions, keep
    your headlights on low beam.
- id: 273
  category: safe_driving_rules
  question: 'New York State law requires you to turn on your headlights when weather
    conditions require the use of:'
  choices:
    A: Windshield wipers
    B: The defroster
    C: Fog lights
    D: Hazard lights
  answer: A
  explanation: New York State law requires you to turn on your headlights when the
    weather conditions require the use of windshield wipers to clear rain, snow, sleet
    or fog.
- id: 274
  category: vehicle_information
  question: When preparing your vehicle for winter driving, what tire combination
    should you never use?
  choices:
    A: Snow tires and all-season tires
    B: Radial and non-radial tires
    C: Studded and non-studded tires
    D: Wide and narrow tires
  answer: B
  explanation: Before winter weather arrives, make sure your vehicle is in good condition.
    Never combine radial and non-radial tires on the vehicle.
- id: 275
  category: vehicle_information
  question: When are tires with metal studs legally permitted to be used in New York
    State?
  choices:
    A: November 1 through April 1
    B: October 16 through April 30
    C: September 1 through May 31
    D: They are illegal year-round
  answer: B
  explanation: According to the manual, tires with metal studs can be used in New
    York State only from October 16 through April 30.
- id: 276
  category: vehicle_information
  question: Which of the following is a rule regarding tire usage on your vehicle?
  choices:
    A: You should combine radial and non-radial tires for better winter traction.
    B: Never combine radial and non-radial tires on the same vehicle.
    C: Snow tires should only be placed on the front wheels.
    D: Metal studs must be used on all tires during winter.
  answer: B
  explanation: 'The manual explicitly states: "Never combine radial and non-radial
    tires on the same vehicle."'
- id: 277
  category: defensive_driving
  question: What should you do if your vehicle's rear wheels start to skid to the
    left?
  choices:
    A: Steer to the right.
    B: Steer to the left.
    C: Keep the steering wheel perfectly straight.
    D: Brake hard immediately.
  answer: B
  explanation: To recover from a rear-wheel skid, you should turn the steering wheel
    in the direction the vehicle is trying to go. If your rear wheels slide left,
    steer left.
- id: 278
  category: defensive_driving
  question: What is the first step you should take if your front wheels begin to skid?
  choices:
    A: Turn the steering wheel sharply in the direction of the skid.
    B: Pump the brakes rapidly.
    C: Take your foot off the gas and shift to neutral.
    D: Accelerate to regain traction.
  answer: C
  explanation: If your front wheels skid, the manual advises to take your foot off
    the gas and shift to neutral or push in the clutch, but do not try to immediately
    steer.
- id: 279
  category: safe_driving_rules
  question: Which areas of the road are likely to freeze first when sleet or freezing
    rain begins to fall?
  choices:
    A: Intersections and crosswalks
    B: Tunnels and underpasses
    C: Bridges, ramps, and overpasses
    D: Heavily traveled multi-lane highways
  answer: C
  explanation: When sleet, freezing rain, or snow begins to fall, remember that bridges,
    ramps, and overpasses will freeze first.
- id: 280
  category: defensive_driving
  question: During which time of day is deer activity the highest, increasing the
    risk of collisions?
  choices:
    A: Midday and early afternoon
    B: Late at night
    C: Dawn and dusk
    D: Rush hour traffic in the morning only
  answer: C
  explanation: Daily deer activity is highest at dawn and dusk, which often is the
    highest time of travel for motor-vehicle commuters.
- id: 281
  category: defensive_driving
  question: What should you do if you experience a tire blowout while driving?
  choices:
    A: Brake hard and steer sharply off the road.
    B: Hold the steering wheel tightly and slowly take your foot off the gas pedal.
    C: Accelerate slightly to maintain control of the vehicle.
    D: Pump the brakes rapidly until the vehicle stops.
  answer: B
  explanation: If a tire blows out, hold the steering wheel tightly and slowly take
    your foot off the gas pedal. Do not brake until your vehicle is controlled.
- id: 282
  category: defensive_driving
  question: If your vehicle suddenly will not respond when you steer, why should you
    initially keep your foot off the brake pedal?
  choices:
    A: Because braking will cause the engine to stall.
    B: Because a sudden change in speed could send the vehicle out of control.
    C: Because the brakes are connected to the steering column.
    D: Because you need to accelerate to regain steering fluid pressure.
  answer: B
  explanation: During steering failure, the balance of the vehicle will allow it to
    continue going straight, but a sudden change in speed (such as braking) could
    send it out of control.
- id: 283
  category: defensive_driving
  question: Why should you NOT turn off the ignition if your gas pedal becomes stuck?
  choices:
    A: It will cause the engine to catch fire.
    B: You could lose steering control or lock your steering wheel.
    C: The brakes will immediately lock up.
    D: The vehicle will accelerate faster.
  answer: B
  explanation: If your gas pedal is stuck, do not turn off the ignition as you could
    lose your steering control or lock your steering wheel.
- id: 284
  category: defensive_driving
  question: What is the correct action to take if your wheels accidentally move off
    the pavement?
  choices:
    A: Swerve sharply back onto the pavement immediately.
    B: Accelerate to get the wheels back on the road.
    C: Ease your foot off the gas pedal and brake gently.
    D: Brake hard and stop completely on the shoulder.
  answer: C
  explanation: If your wheels move off the pavement, do not suddenly steer or swerve
    back onto the pavement. Ease your foot off the gas pedal and brake gently.
- id: 285
  category: defensive_driving
  question: If a vehicle is approaching you head-on in your lane, what should you
    do?
  choices:
    A: Swerve into the left lane to avoid them.
    B: Decrease speed, pull over to the right, and sound your horn.
    C: Stop immediately in your lane and flash your headlights.
    D: Accelerate and steer to the left.
  answer: B
  explanation: For a vehicle approaching head-on in your lane, decrease speed, pull
    over to the right and sound your horn to warn the other driver. Do not turn into
    the left lane.
- id: 286
  category: defensive_driving
  question: If your vehicle goes into the water, why should you escape through a window
    rather than opening a door?
  choices:
    A: The door handle will be locked by the water pressure.
    B: Opening a door would cause water to rush in and the car could turn over.
    C: The window provides a larger escape route.
    D: Opening the door will cause the airbags to deploy.
  answer: B
  explanation: When escaping a vehicle in water, release your seat belt and escape
    through a window. An open door would cause water to rush in and the car could
    turn over on top of you.
- id: 287
  category: defensive_driving
  question: What should you do if you see smoke coming from under the hood of your
    vehicle?
  choices:
    A: Open the hood immediately to locate the source of the fire.
    B: Drive quickly to the nearest fire station.
    C: Pull off the road, turn off the ignition, get away from the car, and call the
      fire department.
    D: Use water from your windshield washer reservoir to extinguish the flames.
  answer: C
  explanation: If you see smoke come from under the hood, pull off the road and park
    your vehicle. Turn off the ignition. Get away from the car and call the fire department.
    It is dangerous to try to fight the fire yourself.
- id: 288
  category: vehicle_information
  question: How should you brake to recover from a rear-wheel skid if your vehicle
    is equipped with anti-lock brakes (ABS)?
  choices:
    A: Pump the brake pedal rapidly.
    B: Keep your foot with even pressure on the brake pedal.
    C: Brake hard and release repeatedly.
    D: Do not touch the brake pedal at all.
  answer: B
  explanation: If your vehicle has anti-lock brakes (ABS), keep your foot with even
    pressure on the brake pedal during a skid. Pumping the pedal is only for vehicles
    without ABS.
- id: 289
  category: safe_driving_rules
  question: What should you do before backing into or out of a driveway when children
    are near?
  choices:
    A: Rely solely on your rearview mirrors.
    B: Honk your horn three times before moving.
    C: Get out of the vehicle and check behind it.
    D: Accelerate quickly to minimize time in the driveway.
  answer: C
  explanation: The manual states that before you back into a driveway, or out of it,
    you should get out of the vehicle and check behind your vehicle, and not rely
    only on mirrors when children are near.
- id: 290
  category: sharing_the_road
  question: If there is no sidewalk available, how should pedestrians walk along the
    road?
  choices:
    A: On the side of the road facing traffic.
    B: On the side of the road moving in the same direction as traffic.
    C: In the center of the lane.
    D: On the right shoulder, regardless of traffic direction.
  answer: A
  explanation: According to the manual, pedestrians are supposed to walk on the side
    of the road and face the traffic in the lane nearest them.
- id: 291
  category: sharing_the_road
  question: When must you yield the right-of-way to a blind pedestrian crossing with
    a guide dog or white cane?
  choices:
    A: Only when they are in a marked crosswalk.
    B: Only when the traffic signal is in their favor.
    C: Always, even if traffic signals are not in their favor.
    D: Only during daylight hours.
  answer: C
  explanation: A special right-of-way law requires drivers to always give blind pedestrians
    the right-of-way when they are crossing with a guide dog or white/metal cane,
    even if traffic signals are not in their favor.
- id: 292
  category: sharing_the_road
  question: According to the law, where are pedestrians permitted to stand to hitchhike?
  choices:
    A: On the shoulder of an expressway.
    B: In the center median of a divided highway.
    C: In the road, as long as they wear reflective clothing.
    D: Pedestrians are never allowed to stand in the road to hitchhike.
  answer: D
  explanation: The law requires pedestrians to never stand in the road to hitchhike
    or conduct business with motorists.
- id: 293
  category: defensive_driving
  question: In New York City, more than 35% of pedestrian injury crashes occur during
    which driver maneuver?
  choices:
    A: Parallel parking.
    B: Making a left turn.
    C: Making a right turn.
    D: Backing out of a driveway.
  answer: B
  explanation: The manual notes that left turns can be a very dangerous maneuver,
    pointing out that > 35% of NYC pedestrian injury crashes occur when a driver is
    attempting to make a left turn.
- id: 294
  category: safe_driving_rules
  question: What should you do if you approach a vehicle that is stopped at a crosswalk?
  choices:
    A: Pass the vehicle slowly on the left.
    B: Honk your horn to alert the driver to move.
    C: Never pass the vehicle, as there may be pedestrians crossing.
    D: Pass the vehicle on the right if there is enough room.
  answer: C
  explanation: 'The manual explicitly states: ''Never pass vehicles stopped at a crosswalk.
    There may be people crossing where you can’t see.'''
- id: 295
  category: vehicle_information
  question: How can a vehicle's A-pillars affect your driving?
  choices:
    A: They improve your peripheral vision.
    B: They can create blind spots that interfere with seeing clearly.
    C: They help reduce the glare from oncoming headlights.
    D: They automatically adjust your mirrors for better visibility.
  answer: B
  explanation: Drivers must be aware of their vehicle's A-pillars (vertical supports
    around the glass) because they may interfere with seeing clearly and can create
    blind spots.
- id: 296
  category: sharing_the_road
  question: In which direction are bicyclists required to travel on the road?
  choices:
    A: Facing oncoming traffic.
    B: In the same direction as motor vehicles.
    C: In whichever direction has the least traffic.
    D: On the left side of the road at all times.
  answer: B
  explanation: The manual states that bicyclists have the right to share the road
    and travel in the same direction as motor vehicles.
- id: 297
  category: sharing_the_road
  question: Why should you reduce your speed when passing a bicyclist?
  choices:
    A: To avoid splashing water on them.
    B: Because bicyclists are required to stop when being passed.
    C: Air pressure from a vehicle passing quickly can send the bicyclist off balance.
    D: To allow the bicyclist to grab onto your vehicle for a tow.
  answer: C
  explanation: Drivers should give bicyclists room and reduce speed as they pass because
    air pressure from a vehicle that passes quickly can send them off balance.
- id: 298
  category: sharing_the_road
  question: What is the maximum number of bicyclists that may travel side-by-side
    in a single lane?
  choices:
    A: One.
    B: Two.
    C: Three.
    D: Four.
  answer: B
  explanation: Bicyclists must never travel with more than two side-by-side in a single
    lane.
- id: 299
  category: safe_driving_rules
  question: According to New York law, which age group of bicyclists and their passengers
    are required to wear an approved helmet?
  choices:
    A: Ages 1 to 13.
    B: Ages 5 to 16.
    C: Ages 10 to 18.
    D: All ages are required by state law.
  answer: A
  explanation: The manual states that bicyclists and their passengers ages 1 - 13
    must wear an approved helmet.
- id: 300
  category: safe_driving_rules
  question: Under what condition may a bicyclist carry an infant under one year old
    as a passenger?
  choices:
    A: If the infant is in an attached bicycle safety seat.
    B: If the infant is wearing an approved helmet.
    C: If the bicyclist is riding in a designated bicycle lane.
    D: Under no condition; it is against the law.
  answer: D
  explanation: The manual explicitly states that a bicyclist must never carry an infant
    under a year old as a passenger, as it is against the law.
- id: 301
  category: driver_responsibility
  question: If a bicycle crash causes death or serious injury, within how many days
    must it be reported to the DMV?
  choices:
    A: 3 days.
    B: 5 days.
    C: 10 days.
    D: 30 days.
  answer: C
  explanation: Any bicycle crash that causes death or serious injury must be reported
    to the DMV within 10 days of the incident.
- id: 302
  category: vehicle_information
  question: A bicycle driven on public highways must be equipped with a horn or bell
    that can be heard from at least how far away?
  choices:
    A: 50 feet.
    B: 100 feet.
    C: 200 feet.
    D: 500 feet.
  answer: B
  explanation: A bicycle driven on public highways must have adequate brakes and a
    horn or bell that can be heard at least 100 feet (30 m) away.
- id: 303
  category: vehicle_information
  question: What lighting equipment is required for a bicycle used at night?
  choices:
    A: A headlight visible from 100 feet ahead and a red taillight visible from 100
      feet behind.
    B: A headlight visible from 300 feet ahead and a red taillight visible from 500
      feet behind.
    C: A headlight visible from 500 feet ahead and a red taillight visible from 300
      feet behind.
    D: Only spoke-mounted reflectors are required at night.
  answer: C
  explanation: A bicycle used at night must have a headlight visible from at least
    500 feet ahead and a red taillight visible from at least 300 feet behind.
- id: 304
  category: sharing_the_road
  question: What should a driver do before making a right turn on red to avoid hitting
    a bicyclist?
  choices:
    A: Honk the horn to warn bicyclists before turning.
    B: Stop completely and look left-right-left and behind.
    C: Roll through the intersection slowly while looking right.
    D: Yield only to pedestrians in the crosswalk.
  answer: B
  explanation: 'The manual states: ''Stop completely and look left-right-left and
    behind before turning right on red'' to avoid hitting a bicyclist approaching
    from the right rear.'
- id: 305
  category: signs_and_signals
  question: What is the purpose of a 'Bike Box' on the roadway?
  choices:
    A: It is a designated parking area for bicycles.
    B: It is a marked area at an intersection ahead of where traffic stops to provide
      extra space for bicyclists.
    C: It is a storage container for shared city bicycles.
    D: It is a lane exclusively for motorized scooters.
  answer: B
  explanation: The manual defines a Bike Box as 'a marked area at an intersection,
    ahead of where traffic is required to stop. This area provides extra space for
    bicyclists.'
- id: 306
  category: signs_and_signals
  question: What is the purpose of green painted bike lanes?
  choices:
    A: To indicate areas where bicycles are prohibited.
    B: To increase visibility to cyclists in some high traffic areas.
    C: To show where pedestrians have the right-of-way over bicycles.
    D: To mark temporary detour routes for bicyclists.
  answer: B
  explanation: The manual states that 'Green painted bike lanes are used to increase
    visibility to cyclists in some high traffic areas.'
- id: 307
  category: sharing_the_road
  question: Which of the following statements about motorcycles sharing a lane is
    true?
  choices:
    A: A motorcycle can share a lane with a passenger car.
    B: Two motorcyclists are allowed to ride side-by-side in a single lane.
    C: Motorcyclists must ride in a single file line at all times.
    D: A motorcycle is not allowed to use the full width of a traffic lane.
  answer: B
  explanation: 'The manual states: ''In addition to using the full lane, two motorcyclists
    are allowed to ride side-by-side in a single lane, but a motorcyclist cannot pass
    or share a lane with another motor vehicle that is not a motorcycle.'''
- id: 308
  category: defensive_driving
  question: How does the smaller size of a motorcycle affect a driver's perception
    of it?
  choices:
    A: It makes the motorcycle appear to be moving slower than it actually is.
    B: It makes it difficult to judge how far away they are or how fast they are going.
    C: It makes the motorcycle's headlights appear brighter.
    D: It makes it easier to determine the motorcycle's exact lane position.
  answer: B
  explanation: According to the manual, 'A motorcycle’s smaller size makes it seem
    much farther away, and makes it difficult to judge how far away they are or how
    fast they are going.'
- id: 309
  category: vehicle_information
  question: Why might a motorcycle's turn signal be flashing even if the rider has
    no intention of turning?
  choices:
    A: Motorcycle turn signals are designed to flash continuously for safety.
    B: The directional signal on most motorcycles does not turn off automatically
      after a turn.
    C: The rider is indicating that they are slowing down.
    D: The motorcycle is experiencing an electrical malfunction.
  answer: B
  explanation: The manual explains that 'on most motorcycles, the directional signal
    does not turn off automatically after a turn, so their turn signal may be on inadvertently
    when the motorcyclist has no intention of turning.'
- id: 310
  category: sharing_the_road
  question: 'According to the National Highway Traffic Safety Administration, a significant
    percentage of fatal motorcycle crashes involve:'
  choices:
    A: A motorcycle rear-ending a stopped truck.
    B: Another vehicle turning left while the motorcycle is going straight or passing.
    C: A motorcycle losing control on loose gravel.
    D: Another vehicle turning right on red without stopping.
  answer: B
  explanation: The manual notes that in 2015, 41 percent of fatal motorcycle crashes
    in the US occurred with 'the other vehicle turning left while the motorcycles
    were going straight, passing, or overtaking other vehicles.'
- id: 311
  category: vehicle_information
  question: Why are motorcycle brake lights often less obvious to other motorists
    compared to car brake lights?
  choices:
    A: They flash rapidly instead of staying solid.
    B: They are mounted lower than eye level and lack a Center High Mount Stop Light.
    C: They are usually painted over to match the motorcycle's color.
    D: They only illuminate when the front brake is applied.
  answer: B
  explanation: The manual states that most cars have a 'Center High Mount Stop Light'
    at eye level, while 'Most motorcycle brake lights are mounted lower than eye level,
    which makes them less obvious to many motorists.'
- id: 312
  category: defensive_driving
  question: Why might a motorcyclist quickly change speed or lane position?
  choices:
    A: To avoid loose gravel, debris, or seams in the pavement.
    B: To communicate with other motorcyclists.
    C: To warm up their tires.
    D: To intentionally block faster-moving traffic.
  answer: A
  explanation: The manual warns that a motorcyclist 'may quickly change speed or lane
    position to avoid loose gravel, debris, seams or grooves in the pavement, sewer
    or access covers or small animals.'
- id: 313
  category: sharing_the_road
  question: What rights and responsibilities do people on bicycles have on the road?
  choices:
    A: They have the right-of-way at all times regardless of traffic signals.
    B: They have the same rights and responsibilities as people driving motor vehicles.
    C: They must always yield to motor vehicles.
    D: They are only allowed to ride on sidewalks and designated trails.
  answer: B
  explanation: 'The manual explicitly states: ''People on bicycles have the same rights
    and responsibilities as people behind the wheel of a motor vehicle.'''
- id: 314
  category: signs_and_signals
  question: What is a 2-way cycle track?
  choices:
    A: A dirt path exclusively for off-road bicycles.
    B: A shared lane where bicycles and cars travel in opposite directions.
    C: A marked bicycle lane that allows travel in both directions.
    D: A highway lane designated for motorcycles and bicycles only.
  answer: C
  explanation: The manual defines a 2-way cycle track as 'a marked bicycle lane that
    allows travel in both directions, similar to a sidewalk for pedestrians.'
- id: 315
  category: driver_responsibility
  question: How should a motor vehicle driver react when sharing the road with in-line
    skaters, skateboarders, and non-motorized scooters?
  choices:
    A: Sound the horn continuously until they move off the road.
    B: Exercise due care by being aware, alert, and driving defensively.
    C: Pass them as closely as possible to encourage them to use the sidewalk.
    D: Assume they will always yield the right-of-way to motor vehicles.
  answer: B
  explanation: The manual states that as a driver, you are responsible to 'exercise
    due care by being aware, alert, and driving defensively' around in-line skaters,
    skateboarders, and non-motorized scooters.
- id: 316
  category: safe_driving_rules
  question: What precaution should you take before getting out of a parked vehicle
    on the side of a road?
  choices:
    A: Turn on your hazard lights for at least one minute.
    B: Honk your horn to alert approaching traffic.
    C: Look for oncoming bicyclists to avoid opening your door into their path.
    D: Open the door quickly to minimize the time it is in the roadway.
  answer: C
  explanation: The manual advises drivers to 'Look before getting out of your parked
    vehicle; avoid opening your door into the path of an oncoming bicyclist.'
- id: 317
  category: vehicle_information
  question: What is a true statement regarding motorcycle headlights during the day?
  choices:
    A: They must be illuminated when driving, but they may not stand out due to other
      vehicles' daytime running lights.
    B: They are legally required to be turned off during daylight hours to save battery.
    C: They are equipped with special flashing bulbs to distinguish them from cars.
    D: They are only required to be used during inclement weather.
  answer: A
  explanation: 'The manual states: ''Headlights and taillights on motorcycles must
    be illuminated when driving. But, with so many vehicles equipped with daytime
    running lights... motorcycle headlights don’t stand out.'''
- id: 318
  category: sharing_the_road
  question: What might a motorcyclist do when approaching a railroad crossing?
  choices:
    A: Speed up to cross the tracks quickly
    B: Decrease speed and rise off the seat
    C: Swerve sharply into the oncoming lane
    D: Stop completely and walk the motorcycle across
  answer: B
  explanation: According to the manual, when approaching a railroad crossing, a motorcyclist
    may decrease speed and rise off the seat to cushion the rough crossing and change
    direction to go across the tracks at a right angle.
- id: 319
  category: sharing_the_road
  question: Why might a motorcyclist move to the center of the lane on a steel deck
    bridge?
  choices:
    A: To block faster moving traffic
    B: To adjust for an uneven surface
    C: To prepare for a U-turn
    D: To avoid the glare of oncoming headlights
  answer: B
  explanation: The manual states that on steel deck bridges, a motorcyclist may move
    to the center of the lane to adjust for the surface that is not even.
- id: 320
  category: sharing_the_road
  question: Where are Class B and C mopeds permitted to be driven on the road?
  choices:
    A: In any traffic lane
    B: Only on the shoulder of expressways
    C: Only in the right lane of traffic, as far to the right as possible
    D: In the left lane when traveling above 20 mph
  answer: C
  explanation: Class B and C mopeds can be driven only in the right lane of traffic,
    as far to the right as possible, or on the shoulder.
- id: 321
  category: safe_driving_rules
  question: Are mopeds allowed to be driven on expressways?
  choices:
    A: Yes, but only in the right lane
    B: Yes, if they are Class A mopeds
    C: No, unless posted signs permit it
    D: No, under any circumstances
  answer: C
  explanation: Mopeds are not permitted on expressways or other controlled access
    highways unless posted signs permit it.
- id: 322
  category: sharing_the_road
  question: In fatal crashes involving cars and big trucks, who usually contributes
    to the cause of the crash?
  choices:
    A: The truck driver
    B: The car driver
    C: Pedestrians
    D: Highway maintenance workers
  answer: B
  explanation: In more than 60 percent of all fatal crashes that involve cars and
    big trucks, the car driver, not the truck driver, contributes to the cause of
    the traffic crash.
- id: 323
  category: vehicle_information
  question: How large can the blind spot be in front of a tractor with a long hood?
  choices:
    A: 5 feet
    B: 10 feet
    C: 20 feet
    D: 50 feet
  answer: C
  explanation: Tractors with long hoods can have a blind spot of 20 feet in front
    of the vehicle, which drivers should avoid.
- id: 324
  category: vehicle_information
  question: Why do tractor-trailers take much longer to stop than smaller vehicles?
  choices:
    A: They have smaller brake pads
    B: Brake delay caused by air brakes
    C: Their tires have less traction
    D: The drivers have slower reaction times
  answer: B
  explanation: For tractor trailers, the difference in stopping distance comes from
    brake delay. Air brakes transmit brake power from the tractor to the trailer and
    this can add many feet to the distance it takes to stop.
- id: 325
  category: sharing_the_road
  question: What maneuver do large trucks often make before executing a wide right
    turn?
  choices:
    A: They move to the left
    B: They speed up significantly
    C: They drive onto the right shoulder
    D: They turn on their hazard lights
  answer: A
  explanation: Because trucks make wide right turns, they move to the left before
    they turn right. Drivers should pay close attention to their turn signals.
- id: 326
  category: defensive_driving
  question: Why should you not underestimate the speed of an approaching tractor-trailer?
  choices:
    A: They are legally allowed to exceed the speed limit
    B: Their larger size makes them appear to move slower than they really are
    C: They always accelerate when approaching cars
    D: Their headlights distort your depth perception
  answer: B
  explanation: Do not underestimate the size and speed of an approaching tractor-trailer.
    Its larger size will often make it appear to move at a slower speed than it really
    is.
- id: 327
  category: defensive_driving
  question: Why should you leave extra space when stopped behind a truck or bus on
    a hill?
  choices:
    A: The exhaust fumes are toxic at close range
    B: The vehicle could move backward slightly when it starts
    C: The driver needs room to open the rear doors
    D: To allow pedestrians to cross between the vehicles
  answer: B
  explanation: Always leave space when you stop in back of a truck or bus at a traffic
    light or stop sign, especially when you face up a hill. The truck or bus could
    move backward slightly when it starts.
- id: 328
  category: signs_and_signals
  question: What does the "slow-moving vehicle" symbol look like?
  choices:
    A: A yellow diamond
    B: A reflective orange triangle
    C: A red octagon
    D: A white rectangle with black lettering
  answer: B
  explanation: The "slow-moving vehicle" symbol is a reflective orange triangle that
    must be displayed on the back of vehicles drawn by animals, most farm vehicles,
    and construction equipment.
- id: 329
  category: safe_driving_rules
  question: How must all-terrain vehicles (ATVs) and snowmobiles cross state highways?
  choices:
    A: Without stopping if the speed limit is under 45 mph
    B: At a 45-degree angle to minimize time on the road
    C: By coming to a stop, yielding, and crossing at a 90-degree angle
    D: Only at designated traffic lights
  answer: C
  explanation: Before ATVs and snowmobiles cross highways, they must come to a stop
    and yield to traffic. They must go across at a 90-degree angle to the road surface.
- id: 330
  category: sharing_the_road
  question: Where are horse riders required to ride on the road?
  choices:
    A: In the center of the lane
    B: Single file near the right curb or road edge
    C: Two abreast on the left shoulder
    D: On the sidewalk only
  answer: B
  explanation: Horse riders are subject to the rules of the road and must ride single
    file near the right curb or road edge or on a right shoulder, lane or path that
    can be used.
- id: 331
  category: vehicle_information
  question: What is the top speed range for a Class A limited use motorcycle (moped)?
  choices:
    A: 20 mph or less
    B: 21 to 30 mph
    C: 31 to 40 mph
    D: 41 to 50 mph
  answer: C
  explanation: According to the Guide to Limited Use Motorcycle (Moped) Operation
    chart, the top speed range for a Class A moped is 31 to 40 mph.
- id: 332
  category: defensive_driving
  question: What should you do if a large truck is blocking the road to back into
    a loading area?
  choices:
    A: Honk your horn to alert the driver
    B: Quickly pass close behind the truck
    C: Wait patiently until the backup maneuver is completed
    D: Drive on the sidewalk to bypass the truck
  answer: C
  explanation: Never pass close behind a large vehicle that is backing up. It is far
    better to wait patiently until the large vehicle has completed its backup maneuver
    than to try to pass and risk entering a blind spot.
- id: 333
  category: sharing_the_road
  question: What is illegal to do when you approach or pass a horse being ridden or
    walked along a road?
  choices:
    A: Pass the horse at a slow speed
    B: Sound your horn
    C: Leave a wide distance between your vehicle and the horse
    D: Yield the right-of-way
  answer: B
  explanation: The manual states that it is illegal to sound your horn when you approach
    or pass a horse.
- id: 334
  category: driver_responsibility
  question: What type of violation is it to leave the scene of a traffic crash that
    involves a fatality or personal injury?
  choices:
    A: A minor traffic infraction
    B: A civil penalty
    C: A moving violation
    D: A criminal violation
  answer: D
  explanation: It is a criminal violation to leave the scene of an incident that involves
    a fatality or personal injury.
- id: 335
  category: driver_responsibility
  question: If you damage a parked vehicle or injure a domestic animal in a crash,
    what must you do?
  choices:
    A: Leave a note on the windshield and drive away
    B: Try to find the owner or notify the police
    C: Wait 15 minutes and leave if no one shows up
    D: Report it to the DMV within 30 days
  answer: B
  explanation: If a parked vehicle or property different from a vehicle is damaged
    or if a domestic animal is injured, you must try to find the owner or notify the
    police.
- id: 336
  category: safe_driving_rules
  question: Under what circumstances should you move an injured person at a crash
    scene?
  choices:
    A: Only if they ask you to help them stand up
    B: Only if it becomes necessary because of fire or another life-threatening danger
    C: Whenever they are blocking the flow of traffic
    D: Immediately upon arriving at the scene to make them comfortable
  answer: B
  explanation: Do not move an injured person unless it becomes necessary because of
    fire or another life threatening danger.
- id: 337
  category: safe_driving_rules
  question: If you must move an injured person away from a life-threatening danger,
    how should you pull them?
  choices:
    A: By their arms
    B: By their legs
    C: Head first
    D: Sideways
  answer: C
  explanation: Hold clothing with your hands and pull the victim head first away from
    the danger while keeping the back and neck as straight as possible.
- id: 338
  category: safe_driving_rules
  question: What should you do if wires are touching a vehicle at a crash scene?
  choices:
    A: Use a wooden stick to move the wires off the vehicle
    B: Open the doors to help the occupants escape quickly
    C: Warn the occupants to remain inside until help arrives
    D: Pull the wires away with heavy-duty gloves
  answer: C
  explanation: If there are wires down, do not go near them. If wires touch the vehicle
    or lay near it, warn the occupants to remain inside until help arrives.
- id: 339
  category: driver_responsibility
  question: You must report a traffic crash to the DMV if it involves a fatality,
    personal injury, or property damage to any one person of at least what amount?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: You must also report any traffic incident or crash that involves $1,000
    or more in damage to the property of any one person.
- id: 340
  category: driver_responsibility
  question: How many days do you have to file a crash report (MV-104) with the DMV
    after a reportable accident?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: You must file a report with DMV within 10 days of the event.
- id: 341
  category: penalties_and_points
  question: What is a possible penalty for failing to report an accident to the DMV?
  choices:
    A: A warning letter
    B: Mandatory driver retraining
    C: Suspension or revocation of your driver license and/or registrations
    D: A permanent mark on your credit report
  answer: C
  explanation: The failure to report an accident is a criminal offense (misdemeanor)
    and can mean the suspension or revocation of your driver license and/or registrations
    and those of the vehicle owner.
- id: 342
  category: driver_responsibility
  question: If the driver is injured and unable to complete the required DMV crash
    report, who may do so?
  choices:
    A: Only a police officer
    B: Only the driver's insurance agent
    C: A passenger or the vehicle owner
    D: The driver's doctor
  answer: C
  explanation: If the driver is injured and unable to complete the report, a passenger
    or the vehicle owner may do so.
- id: 343
  category: driver_testing
  question: Which of the following Advanced Driver Assistance Systems (ADAS) features
    are you NOT allowed to use during your driving test?
  choices:
    A: Back-up warning
    B: Blind spot monitor
    C: Automatic parallel parking
    D: Forward collision warning
  answer: C
  explanation: When taking your driving test, you will not be allowed to use certain
    safety features, such as parking assist (automatic parallel parking) and cruise
    control.
- id: 344
  category: vehicle_information
  question: In which of the following conditions might your vehicle's safety features
    (ADAS) fail to work properly?
  choices:
    A: On straight, flat roads
    B: During clear, sunny weather
    C: In rain, snow, ice, or fog
    D: When driving under the speed limit
  answer: C
  explanation: Be aware that safety features may not work properly in certain conditions
    such as rain, snow, ice, fog, hills, and curves.
- id: 345
  category: driver_testing
  question: According to the manual, which of the following vehicle technologies is
    permitted to be active during a driving test?
  choices:
    A: Adaptive cruise control
    B: Automatic parallel parking
    C: Rear cross-traffic alert
    D: Self-driving autopilot
  answer: C
  explanation: Rear cross-traffic alert is listed under the warning systems permitted
    for testing. Adaptive cruise control and automatic parallel parking are not permitted.
- id: 346
  category: safe_driving_rules
  question: What is the driver's responsibility when operating a vehicle equipped
    with Advanced Driver Assistance Systems (ADAS)?
  choices:
    A: To rely entirely on the safety features to avoid crashes
    B: To remain engaged and always focused on the driving task
    C: To disable all safety features before driving
    D: To let the vehicle steer itself on highways
  answer: B
  explanation: Safety features are meant to assist you in the driving task, they are
    not there to drive the vehicle. You must remain engaged and always focused on
    the driving task.
