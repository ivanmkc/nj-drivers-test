- id: 363
  category: safe_driving_rules
  question: ¿Qué sistema de medidas utilizan las leyes y regulaciones del estado de
    Nueva York?
  choices:
    A: Solo medidas métricas
    B: Tanto medidas métricas como de EE. UU.
    C: Solo medidas de EE. UU.
    D: Solo medidas imperiales
  answer: C
  explanation: El manual establece explícitamente que las leyes y regulaciones del
    estado de Nueva York utilizan únicamente medidas de EE. UU.
- id: 364
  category: safe_driving_rules
  question: ¿Por qué se proporcionan equivalentes métricos aproximados en el manual
    del conductor de Nueva York?
  choices:
    A: Solo para fines informativos
    B: Porque son legalmente vinculantes
    C: Para reemplazar las medidas de EE. UU.
    D: Para uso en multas de tránsito
  answer: A
  explanation: El manual señala que los equivalentes métricos aproximados a las medidas
    de EE. UU. se proporcionan solo para fines informativos.
- id: 365
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es cierta con respecto a la información
    proporcionada en el manual del conductor?
  choices:
    A: Cubre todas las leyes y situaciones de tránsito posibles.
    B: Su propósito es proporcionar información básica y no puede cubrir todas las
      situaciones.
    C: Nunca está sujeto a cambios después de su publicación.
    D: Es un documento legal completo y exhaustivo.
  answer: B
  explanation: El manual establece que su propósito es proporcionar información básica
    y que no puede cubrir todas las leyes o situaciones de tránsito.
- id: 366
  category: driver_responsibility
  question: Si tiene una pregunta sobre una situación que no está cubierta en el manual,
