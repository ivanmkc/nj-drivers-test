questions:
- id: 1
  category: driver_responsibility
  question: Según el Registro Done Vida del Estado de Nueva York (New York State Donate
    Life Registry), ¿cuántas vidas puede salvar una sola persona que dona sus órganos?
  choices:
    A: Hasta 4 vidas
    B: Hasta 6 vidas
    C: Hasta 8 vidas
    D: Hasta 10 vidas
  answer: C
  explanation: El manual indica que una sola persona que dona sus órganos puede salvar
    hasta ocho vidas.
- id: 2
  category: license_system
  question: Si usted tiene una licencia de conducir válida de otro estado, ¿cuál es
    la edad mínima requerida para conducir legalmente en el estado de Nueva York?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '17'
  answer: C
  explanation: Según el manual, incluso si tiene licencia de otro lugar, las personas
    menores de 16 años no pueden conducir en el estado de Nueva York.
- id: 3
  category: license_system
  question: ¿Cuántos días tiene para obtener una licencia de conducir de Nueva York
    después de convertirse en residente permanente?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los conductores que se han mudado a Nueva York deben entregar su licencia
    de conducir de fuera del estado y obtener una licencia de Nueva York dentro de
    los 30 días posteriores a convertirse en residentes permanentes.
- id: 4
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de alterar o falsificar una licencia
    de conducir?
  choices:
    A: Una carta de advertencia del DMV
    B: Servicio comunitario obligatorio
    C: Suspensión o revocación de la licencia y proceso penal
    D: Un curso obligatorio de manejo defensivo
  answer: C
  explanation: Es un delito alterar o falsificar cualquier documento de un vehículo
    motorizado, lo cual puede causar la suspensión o revocación de la licencia de
    conducir y un proceso penal que resulte en una multa o encarcelamiento.
- id: 5
  category: license_system
  question: Usted debe tener una Licencia de Conducir Comercial (CDL) si conduce un
    vehículo fabricado o utilizado para transportar ¿a cuántas personas además del
    conductor?
  choices:
    A: 8 o más
    B: 10 o más
    C: 12 o más
    D: 15 o más
  answer: D
  explanation: Se requiere una CDL si conduce cualquier vehículo fabricado o utilizado
    para transportar a 15 personas o más, además del conductor.
- id: 6
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia de Operador Clase D
    sin un Certificado de Finalización de educación vial?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: La edad mínima para una licencia de Operador Clase D es de 18 años,
    o 17 años con un Certificado de Finalización de educación vial.
- id: 7
  category: license_system
  question: ¿Qué clases de ciclomotores (mopeds) se le permite operar con una licencia
    estándar de Operador Clase D?
  choices:
    A: Solo Clase A
    B: Ciclomotores Clase B y C
    C: Ciclomotores Clase A y B
    D: No se permiten ciclomotores sin una licencia de motocicleta
  answer: B
  explanation: El manual indica que usted puede operar ciclomotores Clase B y C con
    una licencia de conducir Clase D.
- id: 8
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia Clase DJ (Operador Junior)?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: La edad mínima para obtener una licencia de Operador Junior, Clase
    DJ es de 16 años.
- id: 9
  category: license_system
  question: ¿Qué clase de licencia se requiere para transportar pasajeros por contrato
    en un vehículo diseñado para llevar 14 pasajeros o menos, como un taxi o vehículo
    de alquiler (livery)?
  choices:
    A: Clase C
    B: Clase D
    C: Clase E
    D: Clase M
  answer: C
  explanation: Una licencia de Taxi/Vehículo de alquiler, Clase E le permite transportar
    pasajeros por contrato en un vehículo diseñado o utilizado para llevar 14 pasajeros
    o menos.
- id: 10
  category: license_system
  question: ¿Para qué tipo de viaje se puede usar una Licencia de Conducir Mejorada
    (Enhanced Driver License) en lugar de un pasaporte?
  choices:
    A: Viajes aéreos internacionales a Europa
    B: Cruces fronterizos terrestres y marítimos hacia y desde Canadá, México, las
      Bermudas y el Caribe
    C: Cualquier viaje internacional en todo el mundo
    D: Viajes a Sudamérica en crucero
  answer: B
  explanation: Una Licencia de Conducir Mejorada se puede usar para cruces fronterizos
    terrestres y marítimos hacia y desde los EE. UU., Canadá, México, las Bermudas
    y el Caribe en lugar de un pasaporte.
- id: 11
  category: license_system
  question: 'Se requiere una Licencia de Conducir Comercial (CDL) para conducir un
    solo vehículo con una clasificación de peso bruto del vehículo (GVWR) del fabricante
    de más de:'
  choices:
    A: 10,000 libras
    B: 15,000 libras
    C: 20,000 libras
    D: 26,000 libras
  answer: D
  explanation: Debe tener una CDL si conduce cualquier vehículo que tenga una clasificación
    de peso bruto del vehículo (GVWR) del fabricante de más de 26,000 libras.
- id: 12
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a tener
    múltiples licencias de conducir?
  choices:
    A: Puede tener una licencia de Nueva York y una licencia de otro estado simultáneamente.
    B: En la mayoría de los casos, es ilegal tener una licencia de conducir de Nueva
      York y una licencia de conducir de otro estado al mismo tiempo.
    C: Se requiere que tenga una licencia para cada estado en el que conduce con frecuencia.
    D: Puede tener legalmente hasta dos licencias de conducir comerciales (CDL).
  answer: B
  explanation: En la mayoría de los casos, es ilegal tener una licencia de conducir
    de Nueva York y una licencia de conducir de otro estado al mismo tiempo. También
    es una violación de la ley federal y estatal tener más de una CDL.
- id: 13
  category: license_system
  question: 'Una licencia Clase DJ (Operador Junior) le permite conducir un vehículo
    con una clasificación de peso bruto del vehículo (GVWR) de no más de:'
  choices:
    A: 5,000 libras
    B: 10,000 libras
    C: 15,000 libras
    D: 26,000 libras
  answer: B
  explanation: Una licencia de Operador Junior, Clase DJ, le permite conducir un vehículo
    con un GVWR de 10,000 libras o menos.
- id: 14
  category: license_system
  question: 'Debe tener una Licencia de Conducir Comercial (CDL) si conduce un vehículo
    que:'
  choices:
    A: Transporta cualquier cantidad de bienes comerciales
    B: Se utiliza únicamente para fines agrícolas
    C: Transporta materiales peligrosos que, por ley federal, requieren llevar un
      cartel (placard)
    D: Remolca un tráiler que pesa 2,000 libras
  answer: C
  explanation: El manual especifica que debe tener una CDL si conduce cualquier vehículo
    que transporte materiales peligrosos que, por ley federal, requieran llevar un
    cartel (placard).
- id: 15
  category: license_system
  question: Si tiene una licencia de motocicleta y otro tipo de licencia de conducir,
    ¿cómo se mostrarán?
  choices:
    A: En dos documentos separados
    B: Ambas clases aparecerán en un solo documento
    C: Debe elegir solo una para que esté activa
    D: La licencia de motocicleta reemplaza a la otra licencia
  answer: B
  explanation: Según el manual, si tiene una licencia de motocicleta y otro tipo de
    licencia de conducir, ambas clases aparecerán en un solo documento (por ejemplo,
    'Clase DM').
- id: 16
  category: license_system
  question: Según la Ley REAL ID, ¿qué debe presentar todo pasajero aéreo que vuele
    dentro de los Estados Unidos para pasar por seguridad en los aeropuertos de EE.
    UU.?
  choices:
    A: Solo un pasaporte estadounidense válido
    B: Una REAL ID, una Licencia de Conducir Mejorada (Enhanced Driver License) u
      otra forma aceptable de identificación federal
    C: Una licencia de conducir estándar emitida por el estado y un certificado de
      nacimiento
    D: Una tarjeta de Seguro Social y una factura de servicios públicos
  answer: B
  explanation: Todo pasajero aéreo que vuele dentro de los Estados Unidos debe presentar
    una REAL ID, una Licencia de Conducir Mejorada, o llevar otra forma aceptable
    de identificación determinada por el gobierno federal.
- id: 17
  category: license_system
  question: El endoso 'R' para Vehículos de Uso Personal es necesario para operar
    vehículos recreativos o de alquiler utilizados para transportar bienes domésticos
    personales si el vehículo excede ¿qué especificaciones?
  choices:
    A: 10,000 libras de GVWR y/o 20 pies de largo
    B: 18,000 libras de GVWR y/o 30 pies de largo
    C: 26,000 libras de GVWR y/o 40 pies de largo
    D: 32,000 libras de GVWR y/o 50 pies de largo
  answer: C
  explanation: El endoso 'R' es necesario para la operación de vehículos recreativos
    y/o de alquiler utilizados para transportar bienes domésticos personales cuando
    el vehículo supera las 26,000 libras de GVWR y/o los cuarenta (40) pies de largo.
- id: 18
  category: driver_testing
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los requisitos
    de examen para obtener un endoso 'R'?
  choices:
    A: Debe aprobar tanto un examen escrito como un examen práctico de manejo.
    B: Debe aprobar un examen escrito, pero no se requiere un examen práctico de manejo.
    C: No se requiere un examen escrito, pero debe aprobar un examen práctico de manejo.
    D: No se requiere ni un examen escrito ni un examen práctico de manejo.
  answer: C
  explanation: 'Para obtener un endoso ''R'', debe aprobar un examen práctico de manejo
    en el tamaño y tipo de vehículo que conducirá. El manual establece explícitamente:
    ''No se requiere examen escrito''.'
- id: 19
  category: driver_testing
  question: ¿Quién debe acompañarlo para su examen práctico de manejo del endoso 'R'?
  choices:
    A: Un instructor de manejo con licencia.
    B: Cualquier conductor con licencia mayor de 18 años.
    C: Un conductor que tenga al menos 21 años con una licencia válida para el vehículo
      que conducirá durante el examen.
    D: Un funcionario del DMV que posea una Licencia de Conducir Comercial.
  answer: C
  explanation: Para el examen práctico de manejo, debe acompañarlo un conductor que
    tenga al menos 21 años, con una licencia válida para el vehículo que conducirá
    durante el examen.
- id: 20
  category: license_system
  question: ¿Por cuánto tiempo se emitirá su primera licencia de conducir de Nueva
    York?
  choices:
    A: Exactamente 10 años
    B: Un período que no exceda los 5 años, en su mes y día de nacimiento
    C: Un período que no exceda los 8 años, en su mes y día de nacimiento
    D: Hasta que cumpla 21 años
  answer: B
  explanation: Su primera licencia de conducir de Nueva York se emitirá por un período
    que no excederá los 5 años, en su mes y día de nacimiento.
- id: 21
  category: license_system
  question: Al solicitar su primera licencia, debe presentar documentos que prueben
    su nombre. ¿Cuántos puntos deben sumar estas pruebas en total?
  choices:
    A: Cuatro puntos o más
    B: Seis puntos o más
    C: Ocho puntos o más
    D: Diez puntos o más
  answer: B
  explanation: A los documentos que prueban su nombre se les asigna un valor en puntos.
    Debe presentar pruebas que sumen seis puntos o más en total.
- id: 22
  category: license_system
  question: Al presentar documentos para probar su nombre para una solicitud de licencia
    de conducir, ¿cuál es un requisito específico para al menos una de las pruebas?
  choices:
    A: Debe contener su fotografía.
    B: Debe ser emitida por el gobierno federal.
    C: Debe tener su firma.
    D: Debe mostrar su dirección residencial actual.
  answer: C
  explanation: El manual establece que al presentar pruebas de su nombre que sumen
    seis puntos o más, 'Al menos una de las pruebas debe tener su firma'.
- id: 23
  category: license_system
  question: ¿Cuál de los siguientes documentos tiene un valor de 6 puntos al probar
    su nombre para una licencia de conducir de Nueva York?
  choices:
    A: Un pasaporte válido de EE. UU.
    B: Una tarjeta de Seguro Social de EE. UU.
    C: Una licencia de conducir con foto o tarjeta de identificación de no conductor
      de Nueva York
    D: Una tarjeta de identificación militar con foto de EE. UU.
  answer: C
  explanation: Una licencia de conducir con foto/permiso/tarjeta de identificación
    de no conductor de Nueva York (vigente o no vencida por más de 2 años) tiene un
    valor de 6 puntos.
- id: 24
  category: license_system
  question: ¿Cuántos puntos vale un pasaporte válido de EE. UU. al probar su identidad
    para una licencia de conducir de Nueva York?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Según la lista de documentos aceptables, un pasaporte o tarjeta de
    pasaporte válido de EE. UU. tiene un valor de 4 puntos.
- id: 25
  category: license_system
  question: Si sus documentos de prueba de identidad no están en inglés, ¿qué debe
    proporcionar?
  choices:
    A: Una traducción certificada al inglés
    B: Una carta notariada de un ciudadano estadounidense
    C: Un permiso internacional de conducir
    D: Una traducción verbal en la oficina del DMV
  answer: A
  explanation: El manual establece que todas las pruebas deben estar en inglés o acompañadas
    de una traducción certificada al inglés.
- id: 26
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para probar su fecha
    de nacimiento?
  choices:
    A: Una identificación con foto de escuela secundaria de EE. UU. con boleta de
      calificaciones
    B: Una factura de servicios públicos de EE. UU.
    C: Una tarjeta de identificación militar con foto de EE. UU.
    D: Una tarjeta de crédito principal de EE. UU.
  answer: C
  explanation: Bajo la sección 'Prueba de edad', una tarjeta de identificación militar
    con foto de EE. UU. figura como un documento aceptable para probar su fecha de
    nacimiento.
- id: 27
  category: driver_testing
  question: Para aprobar el examen de la vista para una licencia de conducir de Nueva
    York, ¿qué agudeza visual debe tener en al menos un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Para aprobar el examen de la vista, debe tener una visión de 20/40
    en al menos un ojo, con o sin lentes correctivos.
- id: 28
  category: driver_testing
  question: Además de aprobar un examen de la vista y de conocimientos, ¿qué deben
    completar la mayoría de los conductores antes de tomar un examen práctico de manejo
    para su primera licencia?
  choices:
    A: Un curso de manejo defensivo de 10 horas
    B: Un curso de pre-licencia aprobado de 5 horas
    C: Un programa de capacitación práctica al volante de 15 horas
    D: Una clase certificada de primeros auxilios y RCP
  answer: B
  explanation: El manual establece que la mayoría de los conductores también deben
    completar un curso de pre-licencia aprobado de 5 horas y aprobar un examen práctico
    de manejo al solicitar su primera licencia.
- id: 29
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    para una licencia de conducir de Nueva York?
  choices:
    A: Visión de 20/20 en ambos ojos
    B: Visión de 20/30 en al menos un ojo
    C: Visión de 20/40 en al menos un ojo
    D: Visión de 20/50 en ambos ojos
  answer: C
  explanation: Según el manual, para aprobar el examen de la vista, debe tener una
    visión de 20/40 en al menos un ojo, con o sin lentes correctivos.
- id: 30
  category: driver_testing
  question: Para aprobar el examen escrito para una licencia Clase D, ¿cuántas preguntas
    debe responder correctamente en total?
  choices:
    A: Al menos 10 de 20
    B: Al menos 14 de 20
    C: Al menos 16 de 20
    D: Las 20 preguntas
  answer: B
  explanation: El manual establece que para aprobar el examen escrito, debe responder
    correctamente al menos 14 de las 20 preguntas formuladas.
- id: 31
  category: driver_testing
  question: ¿Cuántas preguntas sobre señales de tránsito debe responder correctamente
    para aprobar el examen de conocimientos escrito?
  choices:
    A: Una de cuatro
    B: Dos de cuatro
    C: Tres de cuatro
    D: Cuatro de cuatro
  answer: B
  explanation: El manual especifica que debe responder correctamente dos de las cuatro
    preguntas sobre señales de tránsito para aprobar el examen escrito.
- id: 32
  category: driver_testing
  question: ¿Cuál es la edad mínima requerida para que un estudiante tome el examen
    escrito a través del programa de Aplicación de Examen de Conocimientos en Línea
    del DMV (OKTA, por sus siglas en inglés) en una escuela secundaria participante?
  choices:
    A: 15 años
    B: 15 años y 6 meses
    C: 15 años y 11 meses
    D: 16 años
  answer: C
  explanation: Antes de solicitar un permiso de aprendizaje, los estudiantes que tienen
    al menos 15 años y 11 meses de edad pueden tomar el examen escrito a través del
    programa OKTA.
- id: 33
  category: license_system
  question: Al practicar la conducción con un permiso de aprendizaje, ¿cuáles son
    los requisitos para su conductor supervisor?
  choices:
    A: Debe tener al menos 18 años y cualquier licencia válida
    B: Debe tener al menos 21 años, una licencia válida para el tipo de vehículo y
      sentarse en el asiento delantero
    C: Debe ser un instructor de manejo con licencia
    D: Debe tener al menos 25 años y sentarse en el asiento trasero
  answer: B
  explanation: Cuando practique, debe ser supervisado por un conductor con licencia
    que tenga al menos 21 años, que tenga una licencia válida para el tipo de vehículo
    que usted conduce y que esté sentado en el asiento delantero con usted.
- id: 34
  category: license_system
  question: Si tiene un Permiso Junior (Junior Permit) y conduce en la ciudad de Nueva
    York (los 5 distritos) entre las 5 a.m. y las 9 p.m., ¿qué equipo especial debe
    tener el vehículo?
  choices:
    A: Una cámara de reversa
    B: Un letrero de estudiante de manejo
    C: Controles duales (frenos duales)
    D: Espejos laterales adicionales
  answer: C
  explanation: Bajo las restricciones regionales para un Permiso Junior en la ciudad
    de Nueva York entre las 5 a.m. y las 9 p.m., el vehículo debe tener controles
    duales (frenos duales).
- id: 35
  category: license_system
  question: Con un Permiso Junior en el norte del estado de Nueva York (Upstate New
    York - todos los demás condados), ¿quién debe supervisarlo si conduce entre las
    9 p.m. y las 5 a.m.?
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Cualquier conductor con licencia mayor de 21 años
    C: NO debe conducir durante estas horas
    D: Su padre, tutor, persona 'in loco parentis', profesor de educación vial o instructor
      de la escuela de manejo
  answer: D
  explanation: En los condados del norte del estado, entre las 9 p.m. y las 5 a.m.,
    el titular de un Permiso Junior solo debe conducir bajo la supervisión inmediata
    de un padre, tutor, persona 'in loco parentis', profesor de educación vial o instructor
    de la escuela de manejo.
- id: 36
  category: safe_driving_rules
  question: Según las reglas generales para todos los conductores con permisos de
    aprendizaje, ¿dónde está estrictamente prohibido conducir?
  choices:
    A: En cualquier calle dentro de un parque en la ciudad de Nueva York
    B: En cualquier autopista interestatal
    C: En zonas escolares durante el horario escolar
    D: En carreteras con un límite de velocidad superior a 40 mph
  answer: A
  explanation: Si tiene un permiso de aprendizaje, no puede conducir en ninguna calle
    dentro de un parque en la ciudad de Nueva York ni en ningún puente o túnel bajo
    la jurisdicción de la Autoridad de Puentes y Túneles de Triborough (Triborough
    Bridge and Tunnel Authority).
- id: 37
  category: safe_driving_rules
  question: ¿En cuál de las siguientes avenidas (parkways) del condado de Westchester
    NO se le permite conducir con un permiso de aprendizaje?
  choices:
    A: Northern State Parkway
    B: Taconic State Parkway
    C: Garden State Parkway
    D: Palisades Interstate Parkway
  answer: B
  explanation: Los titulares de un permiso de aprendizaje no pueden conducir en las
    avenidas (parkways) Cross County, Hutchinson River, Saw Mill River o Taconic State
    en el condado de Westchester.
- id: 38
  category: license_system
  question: Si tiene un Permiso de Aprendizaje Junior (Junior Learner Permit), ¿cuál
    es la regla con respecto a los pasajeros menores de 21 años?
  choices:
    A: No puede llevar ningún pasajero menor de 21 años
    B: Puede llevar hasta tres pasajeros menores de 21 años
    C: No puede conducir con más de un pasajero menor de 21 años a menos que sean
      familiares inmediatos o su supervisor sea un padre/tutor/instructor
    D: Puede llevar tantos pasajeros menores de 21 años como cinturones de seguridad
      haya
  answer: C
  explanation: No puede conducir con más de un pasajero menor de 21 años a menos que
    sean miembros de su familia inmediata o si su conductor supervisor es su padre,
    tutor, persona 'in loco parentis', profesor de educación vial o instructor de
    la escuela de manejo.
- id: 39
  category: license_system
  question: Si tiene un permiso junior, ¿quién es el único pasajero al que se le permite
    sentarse en el asiento delantero con usted?
  choices:
    A: Su conductor supervisor
    B: Un hermano menor de 18 años
    C: Cualquier pasajero mayor de 21 años
    D: No se permite a nadie en el asiento delantero
  answer: A
  explanation: 'El manual establece explícitamente: ''Si tiene un permiso junior,
    el único pasajero permitido en el asiento delantero es su conductor supervisor''.'
- id: 40
  category: driver_testing
  question: Antes de tomar su examen práctico de manejo, ¿cuántas horas en total de
    práctica de manejo supervisada es importante que haya completado?
  choices:
    A: Al menos 20 horas
    B: Al menos 30 horas
    C: Al menos 40 horas
    D: Al menos 50 horas
  answer: D
  explanation: Antes de tomar el examen, es importante que haya tenido al menos 50
    horas de práctica.
- id: 41
  category: driver_testing
  question: Out of the total recommended hours of supervised driving practice before
    a road test, how many hours must be completed after sunset?
  choices:
    A: At least 5 hours
    B: At least 10 hours
    C: At least 15 hours
    D: At least 20 hours
  answer: C
  explanation: The manual states it is important to have at least 50 hours of practice,
    with at least 15 hours after sunset.
- id: 42
  category: driver_testing
  question: What must you complete before you can make a road test appointment?
  choices:
    A: An advanced defensive driving course
    B: An approved safe driver course (Pre-Licensing course or driver education)
    C: A highway driving certification
    D: A vision re-test
  answer: B
  explanation: Before you can make a road test appointment, you must first complete
    an approved safe driver course, which is fulfilled by a high school/college driver
    education course or a Pre-Licensing course.
- id: 43
  category: license_system
  question: If you have a Junior Permit and are driving in Long Island (Nassau & Suffolk)
    between 9 PM and 5 AM, what are the restrictions?
  choices:
    A: You must be supervised by a parent or guardian
    B: You must NOT drive
    C: You must be supervised by any licensed driver over 21
    D: You can drive alone if going to work
  answer: B
  explanation: According to the Regional Restrictions for a Junior Permit chart, in
    Long Island (Nassau & Suffolk) between 9 PM and 5 AM, 'You must NOT drive.'
- id: 44
  category: license_system
  question: How long is the Pre-Licensing Course completion certificate valid for?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: According to the manual, when you complete the safe driving course,
    you will receive a certificate that is valid for one year.
- id: 45
  category: driver_testing
  question: Does the DMV-certified Point & Insurance Reduction Program (Defensive
    Driving Course) meet the Safe Driving course requirement for scheduling a road
    test?
  choices:
    A: Yes, if completed online.
    B: Yes, for drivers over 18.
    C: No, it does not meet the requirement.
    D: Yes, if completed within the last 6 months.
  answer: C
  explanation: 'The manual explicitly states: ''The DMV-certified Point & Insurance
    Reduction Program (a.k.a. Accident Prevention Course or Defensive Driving Course)
    does NOT meet the Safe Driving course requirement.'''
- id: 46
  category: license_system
  question: At what age are you eligible to change a junior driver license to a senior
    driver license if you have completed a state-approved driver education course?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: B
  explanation: If you are 17, you are eligible for a senior driver license (Class
    D or M) if you have a junior driver license and have completed a state-approved
    high school or college driver education course.
- id: 47
  category: driver_testing
  question: How long must a junior driver hold their permit in valid status before
    they are allowed to take the road test?
  choices:
    A: A minimum of 3 months
    B: A minimum of 6 months
    C: A minimum of 9 months
    D: A minimum of 12 months
  answer: B
  explanation: 'For Junior Drivers with Permits, the manual states: ''Your permit
    must be held, in valid status for a minimum of six months in order to take the
    road test.'''
- id: 48
  category: driver_testing
  question: How many hours of supervised practice driving must a parent or guardian
    certify that a junior driver has completed prior to the road test?
  choices:
    A: 30 hours, including 10 hours after sunset
    B: 40 hours, including 10 hours after sunset
    C: 50 hours, including 15 hours after sunset
    D: 60 hours, including 15 hours after sunset
  answer: C
  explanation: The Certification of Supervised Driving (MV-262) requires a parent
    or guardian to certify that the driver completed at least 50 hours of practice
    driving, including at least 15 hours after sunset.
- id: 49
  category: driver_testing
  question: What is a requirement for the supervising driver who accompanies you to
    the road test site?
  choices:
    A: They must be at least 18 years old.
    B: They must be at least 21 years old and hold a valid license for the vehicle.
    C: They must be a certified driving instructor.
    D: They must be a parent or legal guardian.
  answer: B
  explanation: If you drive to the road test site, you must bring a supervising driver
    who is at least 21 and holds a license valid for the vehicle you will drive during
    the road test.
- id: 50
  category: driver_testing
  question: What must motorcycle applicants bring to their road test to transport
    the license examiner?
  choices:
    A: A motorcycle with a sidecar
    B: A second motorcycle for the examiner
    C: A car or truck and a licensed driver
    D: A certified motorcycle instructor
  answer: C
  explanation: Motorcycle applicants must bring a car or truck and a licensed driver
    to transport the license examiner during the test.
- id: 51
  category: penalties_and_points
  question: How many points can be reduced from your driving record if you complete
    the Point and Insurance Reduction Program (PIRP)?
  choices:
    A: Up to 2 points
    B: Up to 3 points
    C: Up to 4 points
    D: Up to 5 points
  answer: C
  explanation: If you are eligible for point reduction, as many as four (4) points
    can be reduced from your driving record by completing the PIRP course.
- id: 52
  category: penalties_and_points
  question: How often can you complete the Point and Insurance Reduction Program (PIRP)
    for the purpose of point reduction?
  choices:
    A: Every 12 months
    B: Every 18 months
    C: Every 2 years
    D: Every 3 years
  answer: B
  explanation: You can complete the Point and Insurance Reduction Program course every
    18 months for the purpose of point reduction.
- id: 53
  category: license_system
  question: When driving with a Junior License, how many passengers under the age
    of 21 are allowed in the vehicle if they are NOT members of your immediate family?
  choices:
    A: None
    B: No more than one
    C: No more than two
    D: No more than three
  answer: B
  explanation: Under Junior Operator Restrictions, you cannot drive with more than
    one passenger under the age of 21 unless they are members of your immediate family.
- id: 54
  category: license_system
  question: According to the regional restrictions for a Junior License, when are
    you allowed to drive in New York City (the 5 Boroughs)?
  choices:
    A: Between 5 AM and 9 PM only
    B: Only when accompanied by a parent or guardian
    C: Only when driving to or from school
    D: You must NOT drive at any time
  answer: D
  explanation: The regional restrictions chart for a Junior License clearly states
    that in New York City (5 Boroughs), 'You must NOT drive' between 5AM - 9PM and
    'You must NOT drive' between 9PM - 5AM.
- id: 55
  category: license_system
  question: If you hold a Junior License and drive in Upstate counties between 5 AM
    and 9 PM, what are the restrictions on driving alone?
  choices:
    A: You may drive without being accompanied.
    B: You must be accompanied by a licensed parent or guardian.
    C: You may only drive alone to employment or school.
    D: You must not drive.
  answer: A
  explanation: According to the regional restrictions chart, in Upstate (All Other
    Counties) between 5AM - 9PM, 'You may drive without being accompanied.'
- id: 56
  category: license_system
  question: What specific proof of employment must a Junior License holder carry to
    drive to work in Nassau or Suffolk counties?
  choices:
    A: A recent pay stub
    B: A Certificate of Employment (MV-58A)
    C: A letter from their employer
    D: A copy of their work schedule
  answer: B
  explanation: If you hold a Junior License and drive in the counties of Nassau or
    Suffolk, your employer can complete a Certificate of Employment (MV-58A) to serve
    as correct proof of employment.
- id: 57
  category: vehicle_information
  question: What is a specific requirement for the passenger side seat belt in the
    vehicle used for a road test?
  choices:
    A: It must be a five-point harness.
    B: It must be available and clean for use by the examiner.
    C: It must be inspected by a mechanic prior to the test.
    D: It must be disabled if the examiner prefers.
  answer: B
  explanation: 'The manual states that the vehicle must be in good working order,
    and specifically notes: ''The passenger side seat belt must be available and clean
    for use by the examiner.'''
- id: 58
  category: license_system
  question: What passenger restriction applies to a learner permit or junior license
    for a motorcycle or moped (Class M or MJ)?
  choices:
    A: You may carry one passenger if they are wearing a helmet.
    B: You may carry immediate family members only.
    C: You cannot carry any passenger except your supervising driver.
    D: You may carry any passenger over the age of 21.
  answer: C
  explanation: 'The manual states: ''Your learner permit or junior license (Class
    M or MJ) does not allow you to carry any passenger except your supervising driver.'''
- id: 59
  category: license_system
  question: Who is permitted to ride as a passenger when you are operating a motorcycle
    or moped with a Class M or MJ learner permit?
  choices:
    A: Any family member
    B: Only your supervising driver
    C: Anyone over the age of 18
    D: No passengers are allowed under any circumstances
  answer: B
  explanation: According to the manual, a learner permit or junior license (Class
    M or MJ) does not allow you to carry any passenger except your supervising driver.
- id: 60
  category: license_system
  question: How close must a supervising driver remain when you are operating a motorcycle
    or moped with a learner permit?
  choices:
    A: Within 100 feet
    B: Within one-quarter mile
    C: Within one-half mile
    D: Within one mile
  answer: B
  explanation: The manual states that your supervising driver must exercise general
    supervision and control by remaining within one-quarter mile.
- id: 61
  category: driver_responsibility
  question: ¿Cuántos días tiene para notificar al DMV si cambia su dirección residencial?
  choices:
    A: 5 días
    B: 10 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Si cambia de dirección, debe notificar al DMV dentro de 10 días por
    correo, en un Formulario de Cambio de Dirección o en línea.
- id: 62
  category: license_system
  question: ¿Con cuánta anticipación puede renovar su licencia de conducir antes de
    su fecha de vencimiento impresa?
  choices:
    A: Hasta 30 días
    B: Hasta 45 días
    C: Hasta 6 meses
    D: Hasta un año
  answer: D
  explanation: El manual indica que puede renovar su licencia hasta un año antes de
    su fecha de vencimiento impresa.
- id: 63
  category: license_system
  question: Al solicitar una REAL ID en el DMV, ¿cuántas pruebas de residencia del
    estado de Nueva York debe proporcionar?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para obtener una REAL ID, DEBE llevar a la oficina dos pruebas de residencia
    del estado de Nueva York, como una factura de servicios públicos o un estado de
    cuenta hipotecario.
- id: 64
  category: driver_responsibility
  question: Si renueva su licencia de conducir por correo o en línea, ¿dentro de qué
    plazo debe demostrar que ha aprobado un examen de la vista?
  choices:
    A: Los últimos 30 días
    B: Los últimos 60 días
    C: Los últimos seis meses
    D: Los últimos dos años
  answer: C
  explanation: Si renueva por correo o a través del sitio web del DMV, debe demostrar
    que ha aprobado un examen de la vista en los últimos seis meses (o dentro de un
    año, según lo determine un profesional de la salud con licencia).
- id: 65
  category: license_system
  question: ¿Por cuánto tiempo se extiende automáticamente su licencia de conducir
    después de ser dado de baja del servicio militar activo?
  choices:
    A: 30 días
    B: 60 días
    C: Seis meses
    D: Un año
  answer: C
  explanation: Si ingresa al servicio militar, su licencia puede extenderse automáticamente
    durante todo su servicio activo y por seis meses después de ser dado de baja.
- id: 66
  category: license_system
  question: Después de establecer su residencia en el estado de Nueva York, ¿cuánto
    tiempo tiene para solicitar una licencia de conducir de Nueva York?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Para mantener una licencia legal, debe solicitar una licencia de conducir
    de Nueva York dentro de los 30 días posteriores a establecer que es residente
    del estado de Nueva York.
- id: 67
  category: license_system
  question: Si tiene 15 años y posee una licencia de conducir válida de otro estado,
    ¿cuáles son las reglas para conducir en el estado de Nueva York?
  choices:
    A: Puede conducir solo si está acompañado por un padre.
    B: Puede conducir solo durante las horas de luz del día.
    C: No puede conducir en el estado de Nueva York bajo ninguna circunstancia.
    D: Puede conducir si obtiene un permiso de conductor menor (junior permit) de
      Nueva York.
  answer: C
  explanation: 'El manual establece explícitamente: "Si tiene menos de 16 años de
    edad, no puede conducir en el estado de Nueva York, incluso si tiene una licencia
    de otro estado".'
- id: 68
  category: penalties_and_points
  question: ¿Qué significa si su licencia de conducir es "revocada"?
  choices:
    A: Se le retira por un período temporal y se le devuelve automáticamente.
    B: Es cancelada y debe volver a solicitarla al DMV una vez que termine el período.
    C: Debe pagar una multa pero puede seguir conduciendo.
    D: Está restringido a conducir solo hacia y desde el trabajo.
  answer: B
  explanation: '"Revocación" significa que su licencia (o privilegio para conducir)
    es cancelada. Para obtener una nueva licencia, debe volver a solicitarla al Departamento
    de Vehículos Motorizados (DMV) una vez que termine el período de revocación.'
- id: 69
  category: penalties_and_points
  question: ¿Por cuánto tiempo se suspenderá un permiso o licencia de conductor menor
    (junior) si el conductor es condenado por una infracción de tránsito grave que
    valga tres o más puntos?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Su permiso, licencia o privilegios serán suspendidos por 60 días si
    es condenado por una infracción de tránsito grave (tres puntos o más) o por otras
    dos infracciones.
- id: 70
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor con un permiso de conductor menor
    (junior permit) que es condenado por una infracción por enviar mensajes de texto
    o usar el teléfono celular?
  choices:
    A: Una suspensión de 30 días
    B: Una suspensión de 60 días
    C: Una suspensión de 120 días
    D: Una revocación permanente
  answer: C
  explanation: Su permiso de conductor menor (junior permit), licencia o privilegios
    serán suspendidos por 120 días cuando sea condenado por una infracción por enviar
    mensajes de texto o usar el teléfono celular.
- id: 71
  category: driver_testing
  question: What is the minimum amount of time you must hold a junior permit before
    you can schedule a road test?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: C
  explanation: A junior permit must be held for a minimum of six months, excluding
    any time the permit is suspended or revoked, before a road test can be scheduled.
- id: 72
  category: penalties_and_points
  question: How long is the probation period for a newly licensed driver who is 18
    or older when they pass their road test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: If you are 18 or older when you pass your road test for a driver license,
    or obtain a license following revocation, you will be on probation for six months.
- id: 73
  category: penalties_and_points
  question: Which of the following convictions will result in a 60-day suspension
    for a newly licensed driver during their six-month probation period?
  choices:
    A: A single parking ticket
    B: Speeding
    C: Failing to notify the DMV of an address change
    D: Driving with an expired inspection sticker
  answer: B
  explanation: If you are convicted of DWAI (alcohol), speeding, reckless driving,
    following too closely, participating in a speed contest, or any two traffic violations
    while on probation, your license will be suspended for 60 days.
- id: 74
  category: penalties_and_points
  question: If you are convicted of a texting or cell phone violation while on a probationary
    license, how long will your license be suspended?
  choices:
    A: 60 days
    B: 90 days
    C: 120 days
    D: 6 months
  answer: C
  explanation: According to the manual, if you are convicted of a texting or cell
    phone violation, your probationary license will be suspended for 120 days.
- id: 75
  category: penalties_and_points
  question: What is a possible consequence if you receive a traffic ticket and do
    not respond to it?
  choices:
    A: Your vehicle will be immediately impounded.
    B: You could be found guilty by default conviction and your license suspended
      indefinitely.
    C: You will automatically receive 3 points on your driving record.
    D: You will be required to take a mandatory defensive driving course.
  answer: B
  explanation: The manual states that if you do not respond that you have received
    the ticket, you could be found guilty by default conviction and your driver license
    will be suspended indefinitely.
- id: 76
  category: penalties_and_points
  question: From which of the following areas outside of New York State will moving
    traffic convictions be added to your New York State 'violation point' driving
    record?
  choices:
    A: New Jersey and Pennsylvania
    B: Ontario and Quebec
    C: California and Florida
    D: All Canadian provinces
  answer: B
  explanation: The New York State DMV does not record convictions of moving traffic
    violations in other jurisdictions, except traffic offenses committed in the provinces
    of Ontario and Quebec in Canada.
- id: 77
  category: alcohol_drugs_health
  question: 'If you are over 21 years old and are convicted of an alcohol- or drug-related
    driving violation in another state, your New York driver license will be revoked
    for at least:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: If you are over 21 years old and are convicted of an alcohol- or drug-related
    driving violation (e.g., DUI) in another state, your New York driver license will
    be revoked for at least 90 days.
- id: 78
  category: alcohol_drugs_health
  question: What is the penalty if a driver under 21 years old is convicted of an
    alcohol or drug-related violation that occurred out of state?
  choices:
    A: A 90-day suspension
    B: A 6-month revocation
    C: Revocation for at least one year
    D: A warning and a $500 fine
  answer: C
  explanation: If you are under 21 years old and convicted of any alcohol or drug-related
    violation that occurred out of state, your New York driver license will be revoked
    for at least one year.
- id: 79
  category: alcohol_drugs_health
  question: What is the minimum revocation period for Aggravated driving while intoxicated
    (Agg-DWI) with a .18 blood alcohol content?
  choices:
    A: 90 days
    B: Six months
    C: One year
    D: 18 months
  answer: C
  explanation: Aggravated driving while intoxicated (Agg-DWI), with .18 of one percent
    blood alcohol content (.18 BAC) carries a minimum one-year revocation.
- id: 80
  category: alcohol_drugs_health
  question: 'A conviction for Driving while ability impaired by alcohol (DWAI) will
    result in a:'
  choices:
    A: 90-day suspension
    B: Six-month revocation
    C: One-year revocation
    D: 120-day suspension
  answer: A
  explanation: The manual lists the penalty for Driving while ability impaired by
    alcohol (DWAI) as a 90-day suspension.
- id: 81
  category: alcohol_drugs_health
  question: 'If a driver over age 21 refuses to take a chemical test for the first
    time, their license will be revoked for a minimum of:'
  choices:
    A: 90 days
    B: Six months
    C: One year
    D: 18 months
  answer: C
  explanation: A chemical test refusal for drivers over age 21 results in a minimum
    one-year revocation.
- id: 82
  category: alcohol_drugs_health
  question: Under the state's 'Zero Tolerance Law,' what happens if a driver under
    age 21 is found to have a BAC from .02 to .07?
  choices:
    A: Their license is suspended for 90 days.
    B: Their license is suspended for six months.
    C: Their license is revoked for one year.
    D: They receive 3 points on their license.
  answer: B
  explanation: Under the state's 'Zero Tolerance Law,' a driver under age 21 will
    have their license suspended for six months if found to have a BAC from .02 to
    .07.
- id: 83
  category: penalties_and_points
  question: Your driver license will be revoked for at least six months if you are
    found guilty of how many speeding and/or misdemeanor traffic violations within
    18 months?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: Your driver license will be revoked for at least six months if you
    are found guilty of three speeding and/or misdemeanor traffic violations within
    18 months.
- id: 84
  category: penalties_and_points
  question: What is the penalty for operating an uninsured vehicle or allowing another
    person to operate your uninsured vehicle?
  choices:
    A: A 90-day suspension
    B: A six-month suspension
    C: Revocation for at least one year
    D: An indefinite suspension until insurance is purchased
  answer: C
  explanation: Your driver license will be revoked for at least one year if you operate
    or allow another person to operate your uninsured vehicle.
- id: 85
  category: penalties_and_points
  question: Which of the following will result in an indefinite suspension of your
    driver license?
  choices:
    A: Failing to pay child support
    B: Getting two speeding tickets in a year
    C: Refusing a chemical test
    D: Passing a stopped school bus once
  answer: A
  explanation: Your driver license will be suspended indefinitely if you fail to file
    an accident report, fail to pay child support, fail to pay taxes, or fail to fulfill
    a court judgment.
- id: 86
  category: penalties_and_points
  question: According to the DMV point system, how many points will you receive for
    speeding 21 to 30 MPH over the posted limit?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: The point system table indicates that speeding 21 to 30 MPH over the
    posted limit results in 6 points.
- id: 87
  category: penalties_and_points
  question: How many points are added to your driving record for the use of a mobile
    telephone or portable electronic device while operating a motor vehicle?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: According to the point system table, the use of a mobile telephone
    or portable electronic device while operating a motor vehicle results in 5 points.
- id: 88
  category: penalties_and_points
  question: When are point values charged against your driving record?
  choices:
    A: On the date you are convicted
    B: On the date you commit the violation
    C: On the date you pay the ticket
    D: On the date the DMV processes the citation
  answer: B
  explanation: According to the manual, the point values charged against your record
    are from the date you commit the violation, not the date you are convicted.
- id: 89
  category: penalties_and_points
  question: How many points accumulated within an 18-month period will result in a
    notification that your driver license will be suspended?
  choices:
    A: 6 or more points
    B: 8 or more points
    C: 11 or more points
    D: 15 or more points
  answer: C
  explanation: The manual states that if you get 11 or more points within 18 months,
    you will be notified by mail that your driver license will be suspended.
- id: 90
  category: defensive_driving
  question: What is a benefit of taking a DMV-approved 'Motor Vehicle Accident Prevention
    Course'?
  choices:
    A: It prevents a mandatory license suspension.
    B: It acts as a credit against future points.
    C: It reduces your Driver Responsibility Assessment fee.
    D: It can reduce your point total by up to four points.
  answer: D
  explanation: You can reduce your point total by up to four points and save up to
    10 percent on your auto liability and collision insurance premiums by taking a
    DMV-approved course.
- id: 91
  category: driver_responsibility
  question: Si usted está involucrado en un accidente de tránsito en el que muere
    otra persona, ¿qué medida puede tomar el DMV incluso si no fue acusado de una
    infracción?
  choices:
    A: Su licencia puede ser suspendida o revocada después de una audiencia del DMV.
    B: Será acusado automáticamente de homicidio vehicular.
    C: Se le exigirá pagar una multa civil de $750.
    D: Su vehículo será incautado y confiscado inmediatamente.
  answer: A
  explanation: Si usted está involucrado en un accidente de tránsito en el que muere
    otra persona, su licencia puede ser suspendida o revocada después de una audiencia
    del DMV, incluso si no fue acusado de una infracción.
- id: 92
  category: penalties_and_points
  question: ¿Cuál es la tarifa no reembolsable por terminación de suspensión en la
    mayoría de los casos si su licencia de conducir ha sido suspendida por un período
    exacto, como 30 o 90 días?
  choices:
    A: 25 dólares
    B: 50 dólares
    C: 100 dólares
    D: 125 dólares
  answer: B
  explanation: En la mayoría de los casos, si su licencia de conducir ha sido suspendida
    por un período exacto, no se le devolverá la licencia hasta que pague una tarifa
    no reembolsable de $50 por terminación de suspensión.
- id: 93
  category: sharing_the_road
  question: Según la ley de 2019 sobre cámaras en los brazos de pare de los autobuses
    escolares, ¿cuál es la sanción por una primera infracción de rebasar a un autobús
    escolar detenido con luces rojas intermitentes?
  choices:
    A: 100 dólares
    B: 150 dólares
    C: 250 dólares
    D: 300 dólares
  answer: C
  explanation: El manual establece que una primera infracción por rebasar a un autobús
    escolar captada por una cámara en el brazo de pare resulta en una multa de $250.
- id: 94
  category: alcohol_drugs_health
  question: ¿Cuál es la multa civil por negarse a una prueba química mientras conduce
    un vehículo motorizado estándar (no comercial)?
  choices:
    A: 250 dólares
    B: 500 dólares
    C: 550 dólares
    D: 750 dólares
  answer: B
  explanation: La multa civil por negarse a una prueba química es de $500 ($550 si
    es mientras conduce un vehículo motorizado comercial).
- id: 95
  category: alcohol_drugs_health
  question: Si es condenado por Conducir en Estado de Ebriedad (DWI, por sus siglas
    en inglés), ¿de cuánto es la Evaluación de Responsabilidad del Conductor que debe
    pagar cada año durante tres años?
  choices:
    A: 100 dólares
    B: 150 dólares
    C: 250 dólares
    D: 500 dólares
  answer: C
  explanation: Si es condenado por DWI, se le exigirá pagar una evaluación de responsabilidad
    del conductor de $250 cada año durante los próximos tres años.
- id: 96
  category: penalties_and_points
  question: Si recibe seis puntos en su historial de manejo en un período de 18 meses,
    debe pagar una Evaluación de Responsabilidad del Conductor de $100 cada año durante
    tres años. ¿Cuánto debe pagar por cada punto adicional recibido durante ese período?
  choices:
    A: 10 dólares por punto cada año durante tres años
    B: 25 dólares por punto cada año durante tres años
    C: 50 dólares por punto cada año durante tres años
    D: 100 dólares por punto cada año durante tres años
  answer: B
  explanation: Por cada punto adicional que reciba durante ese período, se le exigirá
    pagar otros $25 por punto cada año durante tres años.
- id: 97
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una posible consecuencia de conducir mientras
    su licencia está suspendida o revocada?
  choices:
    A: Una multa obligatoria de $50 a $100
    B: Servicio comunitario obligatorio de 100 horas
    C: Multas obligatorias de $200 a $5,000 y posible incautación del vehículo
    D: Una prohibición permanente para obtener una licencia de conducir en cualquier
      estado
  answer: C
  explanation: Es un delito penal conducir mientras su licencia está suspendida o
    revocada, y existen multas obligatorias de $200 a $5,000. El vehículo que se conduce
    también podría ser incautado y confiscado.
- id: 98
  category: vehicle_information
  question: ¿Cuál es el propósito principal de un certificado de título?
  choices:
    A: Permite que un vehículo sea conducido en vías públicas.
    B: Demuestra quién es el propietario del vehículo.
    C: Demuestra que el vehículo ha pasado la inspección de seguridad.
    D: Sirve como comprobante de seguro de responsabilidad civil para automóviles.
  answer: B
  explanation: Un registro permite que un vehículo sea conducido en vías y carreteras
    públicas. Un certificado de título demuestra quién es el propietario del vehículo.
- id: 99
  category: vehicle_information
  question: ¿Cuál es la edad mínima requerida para registrar un vehículo en el estado
    de Nueva York?
  choices:
    A: '15'
    B: '16'
    C: '18'
    D: No hay requisito de edad para registrar un vehículo.
  answer: B
  explanation: 'El manual establece: ''Debe tener al menos 16 años para registrar
    un vehículo. Puede obtener el título de un vehículo a cualquier edad''.'
- id: 100
  category: vehicle_information
  question: ¿Cuántos días tiene un nuevo residente del estado de Nueva York para obtener
    un registro de vehículo de Nueva York después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Un nuevo residente del estado debe obtener un registro de Nueva York
    dentro de los 30 días posteriores a establecer su residencia.
- id: 101
  category: vehicle_information
  question: Si compra un vehículo a alguien que no sea un concesionario registrado
    del estado de Nueva York, ¿cuántos días tiene para que inspeccionen el vehículo
    después de registrarlo?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Si compró el vehículo a alguien que no sea un concesionario registrado
    del estado de Nueva York, recibirá una etiqueta de extensión de inspección de
    10 días... Luego debe hacer que inspeccionen el vehículo dentro de los 10 días
    a partir de la fecha de registro.
- id: 102
  category: vehicle_information
  question: ¿Bajo qué condición se negará una oficina de vehículos motorizados a aceptar
    un certificado de título?
  choices:
    A: Si el vehículo tiene más de 10 años
    B: Si el certificado de título está doblado o arrugado
    C: Si la información en el título está alterada, borrada o cancelada
    D: Si el vehículo fue registrado previamente en otro estado
  answer: C
  explanation: Una oficina de vehículos motorizados no aceptará un certificado de
    título si no se completa la declaración correcta del odómetro o de divulgación
    de daños, o si la información en el título está alterada, borrada o cancelada.
- id: 103
  category: vehicle_information
  question: ¿Qué sucederá si la información en un certificado de título, como un nombre
    o firma, está alterada, borrada o cancelada?
  choices:
    A: El DMV cobrará una tarifa de procesamiento adicional.
    B: El DMV no aceptará el certificado de título.
    C: El comprador debe pagar el impuesto sobre las ventas basado en el valor justo
      de mercado.
    D: El título se marcará automáticamente como 'Reconstruido como salvamento' (Rebuilt
      Salvage).
  answer: B
  explanation: Según el manual, una oficina de vehículos motorizados no aceptará un
    certificado de título si la información en el título está alterada, borrada o
    cancelada, lo cual incluye cualquier nombre o firma.
- id: 104
  category: vehicle_information
  question: Si compra un vehículo que tiene ocho años de modelo o es más nuevo, ¿qué
    declaraciones deben completarse en el Certificado de Título?
  choices:
    A: Solo la declaración del odómetro.
    B: Solo la declaración de divulgación de daños.
    C: Tanto la declaración del odómetro como la de divulgación de daños.
    D: Ninguna declaración es requerida para vehículos de menos de diez años.
  answer: C
  explanation: El manual establece que para un vehículo de ocho años de modelo o más
    nuevo, el DMV no lo registrará ni emitirá un título a menos que el vendedor haya
    completado, y el comprador haya firmado, tanto la declaración del odómetro como
    la de divulgación de daños.
- id: 105
  category: vehicle_information
  question: ¿Qué debe hacer el DMV antes de que un vehículo descrito como 'Reconstruido
    como salvamento' (Rebuilt Salvage) pueda ser registrado o titulado?
  choices:
    A: Examinar el vehículo en busca de piezas robadas.
    B: Realizar una prueba estricta de emisiones.
    C: Verificar el valor justo de mercado del vehículo.
    D: Emitir un nuevo número de identificación del vehículo (VIN).
  answer: A
  explanation: 'El manual establece explícitamente: ''El DMV debe examinar cada vehículo
    descrito como "Reconstruido como salvamento" (Rebuilt Salvage), O PALABRAS SIMILARES,
    en busca de piezas robadas antes de que el vehículo pueda ser registrado o titulado''.'
- id: 106
  category: vehicle_information
  question: Al comprar un vehículo a un vendedor privado, ¿qué sucede si el vendedor
    no completa su parte del formulario de Declaración de Transacción para un vehículo
    vendido por debajo del valor justo de mercado?
  choices:
    A: La solicitud de registro será denegada permanentemente.
    B: Se le cobrará el impuesto sobre las ventas basado en el valor justo de mercado
      actual del vehículo.
    C: Estará exento de pagar el impuesto sobre las ventas.
    D: El vendedor será multado por el DMV.
  answer: B
  explanation: Si el vendedor no completa el formulario para un vehículo vendido por
    debajo del valor justo de mercado, el manual señala que se le cobrará el impuesto
    sobre las ventas basado en el valor justo de mercado actual del vehículo.
- id: 107
  category: vehicle_information
  question: 'Al presentar una tarjeta de identificación de seguro para registrar su
    vehículo, la información en la tarjeta debe coincidir exactamente con:'
  choices:
    A: El nombre y el Número de Identificación del Vehículo (VIN) en la solicitud
      de registro.
    B: El nombre y la dirección en su licencia de conducir.
    C: La lectura del odómetro en el Certificado de Título.
    D: El precio de compra en la Declaración de Transacción.
  answer: A
  explanation: El manual especifica que el nombre (o nombres) y el número de identificación
    del vehículo (VIN) en las tarjetas de identificación de seguro deben coincidir
    exactamente con la información en la solicitud de registro.
- id: 108
  category: vehicle_information
  question: 'Para la mayoría de los vehículos con un peso bruto máximo de no más de
    18,000 libras, las tarifas de registro se basan en:'
  choices:
    A: La edad del vehículo.
    B: El precio de compra.
    C: El peso del vehículo.
    D: Los caballos de fuerza.
  answer: C
  explanation: Los registros para la mayoría de los vehículos con un peso bruto máximo
    de no más de 18,000 libras son válidos por dos años, y las tarifas se basan en
    el peso del vehículo.
- id: 109
  category: vehicle_information
  question: ¿Bajo qué condición puede recibir un reembolso por sus tarifas de registro
    si ya ha usado las placas del vehículo o la etiqueta de registro por un día?
  choices:
    A: Si las devuelve dentro de 30 días.
    B: Si vende el vehículo a un familiar.
    C: Si transfiere el registro a una motocicleta.
    D: Por ley, las tarifas de registro no pueden ser reembolsadas si las placas o
      la etiqueta se usan aunque sea por un día.
  answer: D
  explanation: 'El manual establece: ''Por ley, las tarifas de registro no pueden
    ser reembolsadas si usa las placas del vehículo o la etiqueta de registro en su
    vehículo aunque sea por un día''.'
- id: 110
  category: driver_responsibility
  question: ¿Qué debe hacer antes de entregar como parte de pago o vender su vehículo
    viejo para evitar que le cobren multas de estacionamiento que no son suyas?
  choices:
    A: Tachar el VIN en el tablero.
    B: Retirar las placas del vehículo y la etiqueta de registro del parabrisas.
    C: Dejar las placas puestas pero retirar la etiqueta de registro.
    D: Reportar el vehículo como robado al DMV.
  answer: B
  explanation: Antes de entregar como parte de pago o vender su vehículo viejo, debe
    asegurarse de retirar las placas del vehículo y la etiqueta de registro del parabrisas
    para evitar que le cobren multas de estacionamiento que no son suyas.
- id: 111
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una razón por la que podría NO recibir un recordatorio
    de renovación de registro por correo?
  choices:
    A: No ha respondido a tres o más multas de estacionamiento.
    B: Su vehículo tiene más de diez años de modelo.
    C: Recientemente renovó su licencia de conducir.
    D: Compró su vehículo a un vendedor privado en lugar de a un concesionario.
  answer: A
  explanation: El manual enumera varias razones por las que no recibirá un recordatorio
    de renovación, incluyendo si cambió su dirección sin notificar al DMV, si su registro
    está suspendido o revocado, o si no respondió a tres o más multas de estacionamiento.
- id: 112
  category: vehicle_information
  question: ¿Qué sucede si la fecha de vencimiento del registro de su vehículo cae
    en un fin de semana o en un feriado legal del estado?
  choices:
    A: Se le otorga un período de gracia de 30 días para renovar.
    B: El registro vence inmediatamente el viernes anterior.
    C: El registro se extiende automáticamente hasta la medianoche del siguiente día
      hábil.
    D: Debe pagar un cargo por pago atrasado al renovar el siguiente día hábil.
  answer: C
  explanation: Si la fecha de vencimiento cae en un fin de semana o en un feriado
    legal del estado, su registro se extiende automáticamente hasta la medianoche
    del siguiente día hábil.
- id: 113
  category: vehicle_information
  question: Si una segunda persona (alguien que no es el titular del registro) lleva
    una solicitud de registro a una oficina del DMV, ¿qué identificación debe proporcionar?
  choices:
    A: Solo la identificación original del titular del registro.
    B: Solo su propia identificación original.
    C: Su propia identificación original y ya sea la original o una fotocopia de la
      identificación del titular del registro.
    D: Una carta notariada del titular del registro y el título del vehículo.
  answer: C
  explanation: Una solicitud presentada por una segunda persona debe ir acompañada
    de la licencia/permiso/identificación de no conductor original de Nueva York de
    la segunda persona y ya sea la original o una fotocopia de la del titular del
    registro.
- id: 114
  category: driver_responsibility
  question: ¿Cuándo se requiere que su vehículo esté cubierto por un seguro de responsabilidad
    civil?
  choices:
    A: Solo cuando se conduce en vías públicas.
    B: Solo durante el primer año de registro.
    C: Mientras esté registrado, incluso si no lo conduce.
    D: Solo si el vehículo tiene menos de diez años de modelo.
  answer: C
  explanation: 'El manual establece: ''Su vehículo debe estar cubierto por un seguro
    de responsabilidad civil mientras esté registrado, incluso si no lo conduce''.'
- id: 115
  category: vehicle_information
  question: ¿Cuál es la cobertura mínima requerida de seguro de responsabilidad civil
    contra daños a la propiedad para un solo incidente en el estado de Nueva York?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: La cobertura mínima de responsabilidad civil requerida incluye $10,000
    contra daños a la propiedad.
- id: 116
  category: penalties_and_points
  question: ¿Cuál es la sanción si su vehículo no está asegurado durante 90 días y
    no ha entregado las placas del vehículo?
  choices:
    A: Su vehículo será embargado por el DMV.
    B: Su licencia de conducir será suspendida.
    C: Se le exigirá que tome un curso de manejo defensivo.
    D: Su vehículo será marcado permanentemente como 'Reconstruido de Salvamento'
      (Rebuilt Salvage).
  answer: B
  explanation: Según el manual, si su vehículo no está asegurado durante 90 días,
    a menos que haya entregado las placas de su vehículo, su licencia de conducir
    también será suspendida.
- id: 117
  category: vehicle_information
  question: ¿En qué se diferencian las reglas para entregar las placas de los vehículos
    en el caso de las motocicletas cuando el seguro se cancela o vence?
  choices:
    A: Las placas de motocicleta deben entregarse dentro de las 24 horas posteriores
      al vencimiento del seguro.
    B: No está obligado a entregar la placa del vehículo cuando el seguro de la motocicleta
      se cancela o vence.
    C: Las placas de motocicleta deben enviarse por correo directamente al Centro
      de Llamadas del DMV.
    D: Debe entregar la placa solo si la motocicleta se vende a un particular.
  answer: B
  explanation: El manual especifica que, aunque las motocicletas deben estar aseguradas,
    no está obligado a entregar la placa del vehículo cuando el seguro de su motocicleta
    se cancela o vence.
- id: 118
  category: penalties_and_points
  question: ¿Cuál es la sanción si es condenado por conducir un vehículo sin seguro
    en el estado de Nueva York?
  choices:
    A: Una multa de hasta $1,000
    B: Su licencia o privilegio de conducir será revocado por al menos un año
    C: Su vehículo será incautado por 30 días
    D: Su licencia será suspendida por 90 días
  answer: B
  explanation: Según el manual, si es condenado por conducir un vehículo sin seguro,
    su licencia o privilegio para conducir en el estado de Nueva York será revocado
    por al menos un año.
- id: 119
  category: vehicle_information
  question: Si compra un vehículo a alguien que no es un concesionario del estado
    de Nueva York, ¿cuánto tiempo tiene para que inspeccionen el vehículo?
  choices:
    A: Dentro de los 5 días posteriores a su registro
    B: Dentro de los 10 días posteriores a su registro
    C: Dentro de los 20 días posteriores a su registro
    D: Dentro de los 30 días posteriores a su registro
  answer: B
  explanation: El manual establece que si compra un vehículo a alguien que no es un
    concesionario del estado de Nueva York (NYS), debe hacer inspeccionar el vehículo
    dentro de los 10 días posteriores a su registro.
- id: 120
  category: vehicle_information
  question: Para calificar para una exención si su vehículo no pasa una primera inspección
    de emisiones mejorada o OBD II, ¿cuánto deben costar los intentos de reparación?
  choices:
    A: Al menos $250
    B: Al menos $300
    C: Al menos $450
    D: Al menos $500
  answer: C
  explanation: El manual especifica que para calificar para una exención, se debe
    hacer un intento de reparar la falla y el costo de las reparaciones debe ser de
    al menos $450.
- id: 121
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos a gasolina está exento de la inspección
    de emisiones de escape y solo está sujeto a una inspección de seguridad?
  choices:
    A: Un vehículo que tiene 10 años de modelo
    B: Un vehículo que tiene 26 o más años de modelo
    C: Un vehículo con un peso bruto superior a 8,500 libras
    D: Un vehículo comprado a un concesionario fuera del estado
  answer: B
  explanation: Las excepciones a la inspección de emisiones de escape incluyen vehículos
    a gasolina que tienen 26 o más años de modelo, menos de dos años de modelo o que
    están registrados como históricos.
- id: 122
  category: driver_responsibility
  question: ¿Cuál es el límite de tiempo y millaje para que el DMV reciba una queja
    contra un taller de reparación de automóviles?
  choices:
    A: Dentro de los 30 días o 1,000 millas de las reparaciones del vehículo
    B: Dentro de los 60 días o 2,000 millas de las reparaciones del vehículo
    C: Dentro de los 90 días o 3,000 millas de las reparaciones del vehículo
    D: Dentro de los 120 días o 4,000 millas de las reparaciones del vehículo
  answer: C
  explanation: Por reglamento, el DMV puede recibir una queja sobre un taller de reparación
    solo dentro de los 90 días o 3,000 millas (4,828 km) de las reparaciones del vehículo,
    lo que ocurra primero.
- id: 123
  category: signs_and_signals
  question: ¿Qué aspecto tienen normalmente las señales reglamentarias?
  choices:
    A: Amarillas y en forma de diamante con letras negras
    B: Verdes con letras y símbolos blancos
    C: Rectángulos blancos con letras o símbolos negros
    D: Azules con letras o símbolos blancos
  answer: C
  explanation: El manual indica que las señales reglamentarias normalmente son rectángulos
    blancos con letras o símbolos negros, aunque algunas tienen formas diferentes
    o usan letras rojas.
- id: 124
  category: signs_and_signals
  question: ¿Cuál es la forma y el color normal de una señal de advertencia?
  choices:
    A: Blanca y rectangular
    B: Amarilla y en forma de diamante
    C: Naranja y circular
    D: Roja y octagonal
  answer: B
  explanation: Las señales de advertencia normalmente son amarillas y en forma de
    diamante, con letras o símbolos negros.
- id: 125
  category: signs_and_signals
  question: ¿Qué tipo de señal muestra la ubicación de servicios como áreas de descanso,
    gasolineras o instalaciones médicas?
  choices:
    A: Señales de destino
    B: Señales de advertencia
    C: Señales de ruta
    D: Señales de servicio
  answer: D
  explanation: Las señales de servicio son azules con letras o símbolos blancos y
    muestran la ubicación de servicios como áreas de descanso, gasolineras, zonas
    de acampar o instalaciones médicas.
- id: 126
  category: signs_and_signals
  question: Al acercarse a una señal de alto (STOP) donde no hay línea de alto ni
    cruce peatonal, ¿dónde debe detenerse por completo?
  choices:
    A: Al menos 10 pies antes de la intersección
    B: Antes de entrar a la intersección, en el punto más cercano a la intersección
      que le permita ver el tráfico
    C: Directamente junto a la señal de alto
    D: Después de avanzar lentamente hacia la intersección para verificar el tráfico
  answer: B
  explanation: Si no hay línea de alto ni cruce peatonal, debe detenerse antes de
    entrar a la intersección, en el punto más cercano a la intersección que le permita
    ver el tráfico en la vía que cruza.
- id: 127
  category: signs_and_signals
  question: ¿De qué color son las señales de zona de trabajo?
  choices:
    A: Naranjas con letras o símbolos negros
    B: Amarillas con letras o símbolos negros
    C: Rojas con letras o símbolos blancos
    D: Verdes con letras o símbolos blancos
  answer: A
  explanation: Las señales de zona de trabajo son naranjas, con letras o símbolos
    negros, e indican que hay personas trabajando en la vía o cerca de ella.
- id: 128
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca a una intersección donde los semáforos están
    fuera de servicio?
  choices:
    A: Avanzar por la intersección sin detenerse si la vía está despejada
    B: Ceder el paso a los vehículos a su derecha y avanzar con precaución
    C: Detenerse como lo haría ante una señal de alto
    D: Esperar a que llegue un oficial de policía antes de avanzar
  answer: C
  explanation: La ley estatal exige que si los semáforos o controles están fuera de
    servicio o no funcionan correctamente cuando se acerca a una intersección, debe
    detenerse como lo haría ante una señal de alto.
- id: 129
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite hacer un giro a la izquierda con una
    luz roja fija?
  choices:
    A: Al girar desde una vía de doble sentido hacia una vía de un solo sentido
    B: Al girar desde una vía de un solo sentido hacia otra vía de un solo sentido
      después de detenerse por completo y ceder el paso
    C: Al girar hacia una autopista de varios carriles con un separador central
    D: Nunca se le permite hacer un giro a la izquierda con luz roja en el estado
      de Nueva York
  answer: B
  explanation: Puede hacer un giro a la izquierda con una luz roja fija cuando gira
    desde una vía de un solo sentido hacia otra vía de un solo sentido después de
    detenerse por completo y ceder el derecho de paso.
- id: 130
  category: safe_driving_rules
  question: ¿Cuál es la regla para girar con luz roja en la ciudad de Nueva York?
  choices:
    A: Puede girar a la derecha con luz roja después de detenerse por completo
    B: Puede girar con luz roja solo entre las 10 PM y las 6 AM
    C: No se le permite girar con luz roja a menos que haya una señal publicada que
      lo permita
    D: Puede girar a la izquierda con luz roja desde una calle de un solo sentido
      hacia otra calle de un solo sentido
  answer: C
  explanation: 'El manual establece explícitamente: ''No se le permite girar con luz
    roja en la ciudad de Nueva York a menos que haya una señal publicada que lo permita''.'
- id: 131
  category: vehicle_information
  question: Si una persona se muda al estado de Nueva York, ¿por cuánto tiempo es
    válido su certificado de inspección de vehículo anterior de otro estado?
  choices:
    A: Por 30 días después de registrar el vehículo en Nueva York
    B: Hasta que expire o un año desde la fecha en que fue emitido, lo que ocurra
      primero
    C: No es válido; el vehículo debe ser inspeccionado inmediatamente
    D: Por 6 meses desde la fecha en que establecen residencia
  answer: B
  explanation: Si una persona se muda al estado de Nueva York (NYS), un certificado
    de inspección emitido anteriormente es válido hasta que expire o un año desde
    la fecha en que fue emitido, lo que ocurra primero.
- id: 132
  category: vehicle_information
  question: ¿Qué debe hacer con la placa de su vehículo si el seguro de su motocicleta
    es cancelado o expira?
  choices:
    A: Entregarla al DMV inmediatamente
    B: Enviarla por correo a su compañía de seguros
    C: No está obligado a entregar la placa del vehículo
    D: Destruir la placa y solicitar una nueva cuando vuelva a estar asegurado
  answer: C
  explanation: 'El manual establece: ''Las motocicletas deben estar aseguradas, pero
    no está obligado a entregar la placa del vehículo cuando el seguro de su motocicleta
    es cancelado o expira''.'
- id: 133
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en un semáforo?
  choices:
    A: El semáforo está descompuesto; proceda con precaución.
    B: Deténgase, ceda el derecho de paso y avance cuando sea seguro.
    C: Reduzca la velocidad y prepárese para detenerse.
    D: Ceda el paso a todo el tráfico a su derecha.
  answer: B
  explanation: 'Una luz roja intermitente significa lo mismo que una señal de PARE
    (STOP): Deténgase, ceda el derecho de paso y avance cuando sea seguro.'
- id: 134
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla intermitente en forma de 'X' sobre un carril
    de la carretera?
  choices:
    A: No conduzca en este carril.
    B: Salga de este carril inmediatamente.
    C: Este carril solo puede usarse para dar vuelta a la izquierda.
    D: El carril está reservado para vehículos de alta ocupación.
  answer: C
  explanation: Una 'X' amarilla intermitente sobre el pavimento indica que este carril
    solo puede usarse para dar vuelta a la izquierda.
- id: 135
  category: signs_and_signals
  question: ¿Qué indica si una línea de borde continua se inclina hacia el centro
    de la carretera?
  choices:
    A: La carretera se estrecha más adelante.
    B: Se está acercando a una cabina de peaje.
    C: El límite de velocidad está disminuyendo.
    D: Debe incorporarse al carril izquierdo.
  answer: A
  explanation: Una línea de borde que se inclina hacia el centro de la carretera indica
    que la carretera se estrecha más adelante.
- id: 136
  category: signs_and_signals
  question: ¿Cuál es la diferencia entre las líneas de carril blancas y amarillas?
  choices:
    A: Las líneas blancas separan el tráfico que se mueve en direcciones opuestas;
      las líneas amarillas separan los carriles que se mueven en la misma dirección.
    B: Las líneas blancas separan los carriles de tráfico que se mueven en la misma
      dirección; las líneas amarillas separan el tráfico que se mueve en direcciones
      opuestas.
    C: Las líneas blancas indican zonas de estacionamiento; las líneas amarillas indican
      zonas donde no se puede estacionar.
    D: Las líneas blancas se usan en autopistas; las líneas amarillas se usan en calles
      de la ciudad.
  answer: B
  explanation: Las líneas que separan los carriles de tráfico que se mueven en la
    misma dirección son blancas. Las líneas que separan el tráfico que se mueve en
    direcciones opuestas son amarillas.
- id: 137
  category: safe_driving_rules
  question: Si conduce por una carretera con una línea amarilla continua junto a una
    línea amarilla discontinua, y usted está en el lado de la línea continua, ¿qué
    se le permite hacer?
  choices:
    A: Puede rebasar a otros vehículos si la carretera por delante está despejada.
    B: No puede rebasar a otros vehículos ni cruzar la línea, excepto para dar vuelta
      a la izquierda hacia una entrada de vehículos.
    C: Puede cruzar la línea solo para rebasar equipo agrícola que se mueve lentamente.
    D: Nunca se le permite cruzar la línea continua por ningún motivo.
  answer: B
  explanation: 'Línea continua con línea discontinua: Si usted está en el lado con
    la línea continua, no puede rebasar a otros vehículos ni cruzar la línea, excepto
    para dar vuelta a la izquierda hacia una entrada de vehículos.'
- id: 138
  category: safe_driving_rules
  question: ¿Cuándo se le permite cruzar líneas continuas dobles en la carretera?
  choices:
    A: Al rebasar a un vehículo que viaja por debajo del límite de velocidad.
    B: Cuando necesite dar vuelta a la izquierda para entrar o salir de la carretera,
      como hacia una entrada de vehículos.
    C: Cuando el vehículo delante de usted está detenido por un peatón.
    D: Nunca puede cruzar líneas continuas dobles bajo ninguna circunstancia.
  answer: B
  explanation: 'Líneas continuas dobles: No puede rebasar ni cambiar de carril. No
    puede cruzar las líneas excepto para dar vuelta a la izquierda para entrar o salir
    de la carretera (por ejemplo, hacia o desde una entrada de vehículos o para hacer
    un giro en U).'
- id: 139
  category: signs_and_signals
  question: ¿Qué indica un símbolo de diamante pintado en la carretera?
  choices:
    A: Hay un cruce peatonal más adelante.
    B: El carril está reservado para autobuses, vehículos de alta ocupación (HOV),
      bicicletas u otros vehículos especiales.
    C: El carril termina más adelante y debe incorporarse.
    D: Se está acercando a un cruce de ferrocarril.
  answer: B
  explanation: El símbolo de diamante indica que el carril está reservado para autobuses,
    vehículos de alta ocupación (HOV, por sus siglas en inglés) como viajes compartidos
    en auto o camioneta, bicicletas u otros vehículos especiales.
- id: 140
  category: safe_driving_rules
  question: Si un oficial de tránsito le hace señas para que pase un semáforo en rojo,
    ¿qué debe hacer?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Obedecer al oficial y pasar el semáforo en rojo.
    C: Tocar la bocina para advertir a otros conductores antes de avanzar.
    D: Hacerse a un lado de la carretera hasta que la luz cambie.
  answer: B
  explanation: Las instrucciones dadas por los oficiales de tránsito tienen prioridad
    sobre las señales, semáforos o marcas en el pavimento. Si un oficial le hace señas
    para que pase un semáforo en rojo o una señal de pare, debe hacerlo.
- id: 141
  category: safe_driving_rules
  question: Si usted y un conductor que se aproxima en dirección opuesta llegan a
    una intersección al mismo tiempo, y usted quiere girar a la izquierda mientras
    que el otro conductor va en línea recta, ¿quién tiene el derecho de paso?
  choices:
    A: Usted tiene el derecho de paso porque va a girar.
    B: El conductor que va en línea recta tiene el derecho de paso.
    C: Quien entre primero a la intersección tiene el derecho de paso.
    D: El conductor de la derecha tiene el derecho de paso.
  answer: B
  explanation: Si los conductores que se aproximan en direcciones opuestas llegan
    a una intersección casi al mismo tiempo, el conductor que gira a la izquierda
    debe ceder el paso al tráfico que va en línea recta o gira a la derecha.
- id: 142
  category: defensive_driving
  question: Mientras espera en una intersección para girar a la izquierda, ¿cómo debe
    posicionar las ruedas de su vehículo?
  choices:
    A: Mantener las ruedas giradas hacia la izquierda para prepararse para el giro.
    B: Mantener las ruedas giradas hacia la derecha para evitar bloquear el tráfico.
    C: Mantener las ruedas rectas para evitar ser empujado hacia el tráfico en sentido
      contrario si lo chocan por detrás.
    D: No importa cómo estén posicionadas las ruedas.
  answer: C
  explanation: Al entrar a la intersección, manténgase a la derecha de la línea central.
    Mantenga las ruedas rectas para evitar ser empujado hacia el tráfico en sentido
    contrario si su vehículo es chocado por detrás.
- id: 143
  category: safe_driving_rules
  question: En una intersección no controlada por señales o semáforos, si dos conductores
    llegan en ángulo recto al mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    B: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    C: El conductor que va más rápido tiene el derecho de paso.
    D: El conductor en la vía más ancha tiene el derecho de paso.
  answer: B
  explanation: En intersecciones no controladas por señales o semáforos, o donde dos
    o más conductores se detienen en señales de ALTO (STOP) al mismo tiempo y están
    en ángulo recto, el conductor de la izquierda debe ceder el derecho de paso al
    conductor de la derecha.
- id: 144
  category: signs_and_signals
  question: ¿Qué indica una sola línea continua que separa los carriles de tráfico?
  choices:
    A: No puede rebasar ni cambiar de carril bajo ninguna circunstancia.
    B: Puede rebasar o cambiar de carril libremente siempre y cuando use las direccionales.
    C: Puede rebasar o cambiar de carril, pero solo cuando las obstrucciones o las
      condiciones del tráfico lo hagan necesario.
    D: El carril está reservado solo para vehículos de emergencia.
  answer: C
  explanation: 'Una línea continua: Puede rebasar a otros vehículos o cambiar de carril,
    pero solo puede hacerlo cuando las obstrucciones en la vía o las condiciones del
    tráfico lo hagan necesario.'
- id: 145
  category: safe_driving_rules
  question: Si dos conductores llegan a una intersección sin señales ni semáforos
    al mismo tiempo en ángulo recto, ¿quién debe ceder el derecho de paso?
  choices:
    A: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    B: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    C: El conductor que va más rápido tiene el derecho de paso.
    D: El conductor que gira a la izquierda tiene el derecho de paso.
  answer: B
  explanation: En intersecciones no controladas por señales o semáforos, o donde dos
    o más conductores se detienen en señales de ALTO (STOP) al mismo tiempo y están
    en ángulo recto, el conductor de la izquierda debe ceder el derecho de paso al
    conductor de la derecha.
- id: 146
  category: safe_driving_rules
  question: ¿Qué debe hacer al entrar a una calle desde un camino de entrada privado
    o un estacionamiento?
  choices:
    A: Tocar la bocina y avanzar hacia el tráfico.
    B: Ceder el paso solo a los vehículos que se aproximan por su izquierda.
    C: Detenerse y ceder el derecho de paso al tráfico en la vía y a los peatones.
    D: Incorporarse al tráfico sin detenerse si va a girar a la derecha.
  answer: C
  explanation: Un vehículo que entra a una vía desde un camino de entrada, camino
    privado u otro lugar que no sea una vía pública, debe detenerse y ceder el derecho
    de paso al tráfico en la vía y a los peatones.
- id: 147
  category: defensive_driving
  question: ¿Qué debe hacer si desea cruzar una intersección pero hay tráfico atascado
    del otro lado?
  choices:
    A: Entrar a la intersección y esperar a que el tráfico se despeje.
    B: Esperar hasta que el tráfico de adelante se despeje para no bloquear la intersección.
    C: Avanzar lentamente y abrirse paso a la fuerza en la fila de tráfico.
    D: Girar a la derecha en lugar de seguir en línea recta.
  answer: B
  explanation: No puede entrar a una intersección si el tráfico está atascado del
    otro lado y no puede atravesar la intersección por completo. Espere hasta que
    el tráfico de adelante se despeje, para no bloquear la intersección.
- id: 148
  category: safe_driving_rules
  question: ¿Está obligado a hacerse a un lado para dejar pasar a un vehículo de emergencia
    que se aproxima en el carril opuesto de una vía de doble sentido?
  choices:
    A: Sí, debe hacerse a un lado y detenerse.
    B: No, solo si viaja en su carril.
    C: No, pero debe reducir la velocidad.
    D: Sí, pero solo si no hay un separador físico.
  answer: A
  explanation: Debe hacerse a un lado y detenerse ante un vehículo de emergencia,
    incluso si se dirige hacia usted en el carril opuesto de una vía de doble sentido.
- id: 149
  category: defensive_driving
  question: ¿Qué debe hacer si escucha una sirena de emergencia cerca pero no sabe
    exactamente dónde está el vehículo de emergencia?
  choices:
    A: Detenerse inmediatamente en su carril actual.
    B: Acelerar hasta que vea el vehículo.
    C: Hacerse a un lado de manera segura hacia el borde derecho de la vía y detenerse
      hasta estar seguro de que no se dirige hacia usted.
    D: Continuar conduciendo al límite de velocidad mientras revisa sus espejos.
  answer: C
  explanation: Si escucha una sirena o bocina de aire cerca pero no sabe exactamente
    dónde está el vehículo de emergencia, debe hacerse a un lado de manera segura
    hacia el borde derecho de la vía y detenerse hasta estar seguro de que no se dirige
    hacia usted.
- id: 150
  category: safe_driving_rules
  question: Según la Ley de Hacerse a un Lado (Move Over Law), ¿qué debe hacer un
    conductor al acercarse a un vehículo de emergencia detenido con luces intermitentes
    en una autopista de varios carriles?
  choices:
    A: Detenerse inmediatamente junto al vehículo de emergencia.
    B: Mantener la velocidad pero moverse al acotamiento derecho.
    C: Reducir la velocidad y apartarse del carril adyacente al vehículo de emergencia,
      si es seguro hacerlo.
    D: Tocar la bocina para advertir a los trabajadores de emergencia.
  answer: C
  explanation: Los conductores deben reducir la velocidad en todas las vías al encontrarse
    con dichos vehículos, pero en avenidas (parkways), autopistas interestatales y
    otras vías de acceso controlado con múltiples carriles, se exige además que los
    conductores se aparten del carril adyacente al vehículo de emergencia o de peligro,
    a menos que el tráfico u otros peligros impidan hacerlo de manera segura.
- id: 151
  category: signs_and_signals
  question: ¿Qué indica una luz verde intermitente en un vehículo personal?
  choices:
    A: Un bombero voluntario respondiendo a una alarma.
    B: Un miembro voluntario de una ambulancia o escuadrón de rescate.
    C: Un quitanieves o una grúa.
    D: Un vehículo de entrega de correo rural.
  answer: B
  explanation: A los vehículos personales conducidos por bomberos voluntarios que
    responden a alarmas se les permite mostrar luces azules, y aquellos conducidos
    por miembros voluntarios de ambulancias o escuadrones de rescate pueden mostrar
    luces verdes.
- id: 152
  category: sharing_the_road
  question: ¿Está legalmente obligado a ceder el derecho de paso a un vehículo personal
    que muestra una luz azul intermitente?
  choices:
    A: Sí, se consideran vehículos de emergencia autorizados.
    B: Sí, pero solo si también hacen sonar una sirena.
    C: No, pero debe ceder el paso como cortesía si puede hacerlo de manera segura.
    D: No, debe mantener su velocidad y derecho de paso en todo momento.
  answer: C
  explanation: Los vehículos que muestran luces azules, verdes o ámbar no son vehículos
    de emergencia autorizados. Sus conductores deben obedecer todas las leyes de tránsito.
    Aunque no está obligado a ceder el derecho de paso, debe cederlo como cortesía
    si puede hacerlo de manera segura.
- id: 153
  category: safe_driving_rules
  question: ¿A qué distancia antes de dar la vuelta o cambiar de carril exige la ley
    que usted ponga la señal?
  choices:
    A: Al menos a 50 pies (15 m)
    B: Al menos a 100 pies (30 m)
    C: Al menos a 200 pies (60 m)
    D: Al menos a 300 pies (90 m)
  answer: B
  explanation: La ley exige que usted señale un giro o cambio de carril con las luces
    direccionales o señales manuales con al menos 100 pies (30 m) de anticipación.
- id: 154
  category: defensive_driving
  question: ¿Por qué debe mantener las ruedas derechas mientras espera en una intersección
    para dar la vuelta?
  choices:
    A: Evita que el líquido de la dirección asistida se sobrecaliente.
    B: Le ayuda a acelerar más rápido cuando el semáforo cambia a verde.
    C: Si lo chocan por detrás, su vehículo podría ser empujado hacia el carril de
      tráfico en sentido contrario.
    D: Hace que sea más fácil para los peatones ver su vehículo.
  answer: C
  explanation: Mantenga las ruedas derechas hasta que realmente comience a dar la
    vuelta. Si sus ruedas están giradas y lo chocan por detrás, su vehículo podría
    ser empujado hacia el carril de tráfico en sentido contrario.
- id: 155
  category: vehicle_information
  question: Al dar la vuelta, ¿qué debe recordar sobre la trayectoria de sus ruedas
    traseras?
  choices:
    A: Se desplazarán por fuera de la trayectoria de las ruedas delanteras.
    B: Se desplazarán por dentro de la trayectoria de las ruedas delanteras.
    C: Seguirán exactamente la misma trayectoria que las ruedas delanteras.
    D: Patinarán si no frena durante la vuelta.
  answer: B
  explanation: Recuerde que sus ruedas traseras se desplazarán por dentro de la trayectoria
    de las ruedas delanteras, más cerca del borde de la acera (vuelta a la derecha)
    o del tráfico que se dirige hacia usted (vuelta a la izquierda).
- id: 156
  category: sharing_the_road
  question: ¿Cuál es una causa común de choques que involucran motocicletas y otros
    vehículos?
  choices:
    A: La motocicleta conduce demasiado despacio.
    B: El conductor del otro vehículo no logra ver a la motocicleta.
    C: Los faros de la motocicleta son demasiado brillantes.
    D: La motocicleta no pone la señal antes de dar la vuelta.
  answer: B
  explanation: La mayoría de los choques que involucran motocicletas y otros vehículos
    son causados porque el conductor del otro vehículo no ha logrado ver a la motocicleta.
- id: 157
  category: safe_driving_rules
  question: Al dar una vuelta a la izquierda desde una calle de doble sentido hacia
    otra calle de doble sentido, ¿cómo debe aproximarse a la vuelta?
  choices:
    A: Desde el carril del extremo derecho de la calzada.
    B: Desde la mitad izquierda de la calzada.
    C: Desde la mitad derecha de la calzada más cercana al centro.
    D: Abriéndose mucho hacia la derecha antes de dar la vuelta a la izquierda.
  answer: C
  explanation: Al dar una vuelta a la izquierda desde una calle de doble sentido hacia
    una calle de doble sentido, aproxímese a la vuelta desde la mitad derecha de la
    calzada más cercana al centro.
- id: 158
  category: safe_driving_rules
  question: ¿Desde qué carril se le permite hacer una vuelta en U?
  choices:
    A: El acotamiento derecho.
    B: El carril del extremo derecho.
    C: La parte izquierda del carril más cercano a la línea central.
    D: Cualquier carril siempre y cuando no haya tráfico en sentido contrario.
  answer: C
  explanation: Solo puede hacer una vuelta en U desde la parte izquierda del carril
    más cercano a la línea central de la calzada, nunca desde el carril derecho.
- id: 159
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar la Ley de Hacerse a un Lado (Move Over
    Law)?
  choices:
    A: Es sancionable como una infracción de tránsito en movimiento.
    B: Resulta en una suspensión automática de la licencia.
    C: Se considera un delito grave.
    D: No conlleva ninguna sanción, solo una advertencia por escrito.
  answer: A
  explanation: Las violaciones de esta ley [la Ley de Hacerse a un Lado o Move Over
    Law] son sancionables como una infracción de tránsito en movimiento.
- id: 160
  category: safe_driving_rules
  question: Según la ley del estado de Nueva York, ¿en cuál de los siguientes lugares
    está estrictamente prohibido hacer una vuelta en U?
  choices:
    A: En una calle estrecha de doble sentido
    B: En una zona escolar
    C: En una intersección con una señal de flecha verde hacia la izquierda
    D: En una entrada de vehículos residencial
  answer: B
  explanation: El manual establece que está prohibido que un vehículo haga una vuelta
    en U en una zona escolar, así como en autopistas de acceso limitado y en distritos
    comerciales de la ciudad de Nueva York.
- id: 161
  category: safe_driving_rules
  question: ¿A qué distancia deben poder ver su vehículo otros conductores para que
    usted pueda hacer legalmente una vuelta en U cerca de una colina o curva?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: No puede hacer una vuelta en U cerca de la cima de una colina, una
    curva o cualquier otro lugar donde otros conductores no puedan ver su vehículo
    desde 500 pies (150 m) de distancia en cualquier dirección.
- id: 162
  category: safe_driving_rules
  question: ¿Cuál es el primer paso que debe tomar al hacer un giro de tres puntos?
  choices:
    A: Poner la direccional izquierda y girar a través de la carretera
    B: Girar el volante lo más a la derecha posible
    C: Poner la direccional derecha, luego orillarse a la derecha y detenerse
    D: Revisar su espejo retrovisor interior y retroceder
  answer: C
  explanation: Para hacer un giro de tres puntos, el paso 1 es poner la direccional
    derecha, luego orillarse a la derecha y detenerse.
- id: 163
  category: sharing_the_road
  question: Al rebasar a una motocicleta, ¿qué debe hacer para garantizar la seguridad?
  choices:
    A: Compartir el carril si es lo suficientemente ancho
    B: Darle a la motocicleta el mismo ancho de carril completo que a otros vehículos
    C: Rebasar solo por el lado derecho
    D: Tocar la bocina antes de moverse al espacio de su carril
  answer: B
  explanation: Cuando rebase a una motocicleta, recuerde darle el mismo ancho de carril
    completo que se permite a otros vehículos. Nunca se mueva al mismo espacio de
    carril que una motocicleta.
- id: 164
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe usar su luz direccional o señal manual para
    indicar su intención de cambiar de carril?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: La ley exige que use las luces direccionales o señales de mano y brazo
    para indicar su intención de cambiar de carril al menos 100 pies (30 m) antes
    de realizar el cambio.
- id: 165
  category: safe_driving_rules
  question: Se le prohíbe rebasar a un vehículo por la izquierda si se encuentra a
    cuántos pies de un cruce de ferrocarril en una vía de doble sentido?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: No puede rebasar a un vehículo por la izquierda si se encuentra a menos
    de 100 pies (30 m) de un cruce de ferrocarril en una vía de doble sentido.
- id: 166
  category: safe_driving_rules
  question: Al rebasar a un vehículo por la izquierda, ¿debe poder regresar de manera
    segura al carril derecho antes de que cualquier vehículo que se acerque en sentido
    contrario esté a qué distancia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: No puede rebasar a un vehículo por la izquierda si no puede regresar
    de manera segura al carril derecho antes de que cualquier vehículo que se acerque
    en sentido contrario esté a menos de 200 pies (60 m) de usted.
- id: 167
  category: defensive_driving
  question: ¿Por qué debe mirar rápidamente por encima de su hombro antes de cambiar
    de carril para rebasar?
  choices:
    A: Para revisar si hay vehículos de emergencia a lo lejos
    B: Porque es ilegal usar los espejos al rebasar
    C: Para asegurarse de no exceder el límite de velocidad
    D: Porque incluso los espejos ajustados correctamente dejan puntos ciegos
  answer: D
  explanation: Nunca dependa solo de sus espejos cuando se prepare para cambiar de
    carril. Incluso los espejos ajustados correctamente dejarán 'puntos ciegos' detrás
    de ambos lados de su vehículo.
- id: 168
  category: safe_driving_rules
  question: Después de rebasar a un vehículo por la izquierda, ¿cómo sabe que es seguro
    regresar al carril derecho?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del otro
      vehículo
    B: Cuando pueda ver el parachoques delantero del vehículo rebasado en su espejo
      retrovisor interior
    C: Inmediatamente después de activar su direccional derecha
    D: Cuando esté 100 pies por delante del vehículo rebasado
  answer: B
  explanation: Antes de regresar al carril derecho, ponga la direccional, mire su
    espejo retrovisor interior y asegúrese de poder ver el parachoques delantero del
    vehículo que rebasó.
- id: 169
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones se le permite rebasar a otro
    vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante viaja por debajo del límite de velocidad
    B: Cuando se encuentra en un camino de tierra estrecho de un solo carril
    C: Cuando un vehículo de adelante hace un giro a la izquierda
    D: Conduciendo por el acotamiento no pavimentado de la carretera
  answer: C
  explanation: Puede rebasar a un vehículo por la derecha solo en condiciones específicas,
    como cuando un vehículo de adelante hace un giro a la izquierda, siempre que pueda
    rebasar de manera segura sin conducir sobre o a través del acotamiento.
- id: 170
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo rebasa por la izquierda?
  choices:
    A: Aumentar su velocidad para evitar que lo rebasen
    B: Moverse hacia el acotamiento derecho de la carretera
    C: Disminuir ligeramente su velocidad y mantenerse centrado en su carril
    D: Parpadear las luces delanteras para advertir al tráfico en sentido contrario
  answer: C
  explanation: Si otro vehículo lo rebasa por la izquierda, disminuya ligeramente
    su velocidad y manténgase centrado en su carril.
- id: 171
  category: sharing_the_road
  question: ¿A qué distancia debe detenerse de un autobús escolar que tiene sus luces
    rojas intermitentes encendidas?
  choices:
    A: Al menos 10 pies
    B: Al menos 15 pies
    C: Al menos 20 pies
    D: Al menos 50 pies
  answer: C
  explanation: Cuando un autobús escolar detenido enciende sus luces rojas intermitentes,
    el tráfico que se aproxima desde cualquier dirección debe detenerse antes de llegar
    al autobús. Debe detenerse a una distancia de al menos 20 pies (6 m) del autobús.
- id: 172
  category: safe_driving_rules
  question: Si conduce por una carretera dividida y un autobús escolar en el lado
    opuesto de la carretera se detiene con sus luces rojas intermitentes encendidas,
    ¿qué debe hacer?
  choices:
    A: Continuar con precaución ya que la carretera está dividida
    B: Detenerse, ya que la ley se aplica en todas las vías del estado de Nueva York
    C: Reducir la velocidad a 15 mph y rebasar con cuidado
    D: Detenerse solo si hay niños cruzando activamente por su lado de la carretera
  answer: B
  explanation: Esta ley se aplica en todas las vías del estado de Nueva York. Debe
    detenerse ante un autobús escolar incluso si se encuentra en el lado opuesto de
    una carretera dividida.
- id: 173
  category: penalties_and_points
  question: ¿Cuál es la sanción por ser condenado por rebasar a un autobús escolar
    detenido tres veces en un período de tres años?
  choices:
    A: Una multa máxima de $250
    B: Un curso obligatorio de manejo defensivo
    C: Su licencia de conducir será revocada por un mínimo de seis meses
    D: Su vehículo será confiscado por 30 días
  answer: C
  explanation: Si es condenado por tres de estas infracciones en tres años, su licencia
    de conducir será revocada por un mínimo de seis meses.
- id: 174
  category: sharing_the_road
  question: ¿Qué indican las luces amarillas intermitentes de advertencia en un autobús
    escolar?
  choices:
    A: El autobús está averiado y necesita asistencia
    B: El autobús se está preparando para detenerse a subir o bajar pasajeros
    C: Se le exige que se detenga inmediatamente
    D: El autobús está acelerando para incorporarse al tráfico
  answer: B
  explanation: Antes de que un autobús escolar se detenga para subir o bajar pasajeros,
    el conductor generalmente encenderá las luces amarillas intermitentes de advertencia.
    Cuando las vea, reduzca la velocidad y prepárese para detenerse.
- id: 175
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una primera infracción de rebasar a un autobús
    escolar detenido?
  choices:
    A: $100
    B: $150
    C: $250
    D: $500
  answer: C
  explanation: Según el manual, la multa por rebasar a un autobús escolar detenido
    varía desde un mínimo de $250 por una primera infracción hasta un máximo de $1,000
    por tres infracciones en tres años.
- id: 176
  category: penalties_and_points
  question: Según la ley de cámaras en el brazo de parada (stop-arm camera), ¿cuál
    es la sanción por una tercera infracción de rebasar a un autobús escolar detenido
    en un período de 18 meses?
  choices:
    A: $250
    B: $275
    C: $300
    D: $500
  answer: C
  explanation: El manual especifica que una tercera infracción (o más) en un período
    de 18 meses captada por una cámara en el brazo de parada conlleva una sanción
    de $300.
- id: 177
  category: safe_driving_rules
  question: Cuando haya terminado de estacionarse en paralelo, ¿qué tan cerca deben
    estar sus ruedas del borde de la acera (bordillo)?
  choices:
    A: A no más de un pie (30 cm)
    B: A no más de dieciocho pulgadas
    C: A no más de dos pies
    D: A no más de seis pulgadas
  answer: A
  explanation: 'El manual establece: "En su posición final de estacionamiento, sus
    ruedas no deben estar a más de un pie (30 cm) del borde de la acera".'
- id: 178
  category: safe_driving_rules
  question: ¿Hacia dónde debe mirar al retroceder su vehículo durante una maniobra
    de estacionamiento en paralelo?
  choices:
    A: Solo por los espejos laterales
    B: A través de la ventana trasera
    C: Solo por el espejo retrovisor interior
    D: Exclusivamente a la pantalla de su cámara de reversa
  answer: B
  explanation: 'El manual indica a los conductores: "Mire a través de la ventana trasera,
    no por los espejos, cuando retroceda" durante el estacionamiento en paralelo.'
- id: 179
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante al estacionarse en una colina?
  choices:
    A: Lejos del borde de la acera
    B: Hacia el borde de la acera o el lado de la carretera
    C: Recto hacia adelante
    D: Paralelo a la línea central
  answer: B
  explanation: 'Al estacionarse en una colina, el manual indica: "Gire las ruedas
    hacia el borde de la acera o el lado de la carretera, para evitar que su vehículo
    se dirija hacia el tráfico".'
- id: 180
  category: signs_and_signals
  question: ¿Qué indica una señal de NO ESTACIONAR (NO PARKING)?
  choices:
    A: No puede detenerse por ningún motivo.
    B: Solo puede detenerse para obedecer una señal de tráfico.
    C: Puede hacer una parada temporal para cargar o descargar mercancía o pasajeros.
    D: Puede estacionarse si permanece en el asiento del conductor.
  answer: C
  explanation: Según el manual, "Una señal de NO ESTACIONAR (NO PARKING) significa
    que puede hacer una parada temporal para cargar o descargar mercancía o pasajeros".
- id: 181
  category: signs_and_signals
  question: ¿Qué se le permite hacer en una señal de PROHIBIDO DETENERSE (NO STANDING)?
  choices:
    A: Detenerse temporalmente para subir o bajar pasajeros sin salir del vehículo.
    B: Detenerse para cargar o descargar mercancía.
    C: Estacionarse por menos de 5 minutos.
    D: Dejar el vehículo encendido mientras hace un mandado.
  answer: A
  explanation: 'El manual indica: "Una señal de PROHIBIDO DETENERSE (NO STANDING)
    significa que solo puede hacer una parada temporal para subir o bajar pasajeros.
    El conductor no puede salir del vehículo".'
- id: 182
  category: safe_driving_rules
  question: ¿A qué distancia debe mantenerse de una boca de incendios (hidrante) al
    estacionarse o detenerse, a menos que un conductor con licencia permanezca en
    el vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: No puede estacionarse ni detenerse a menos de 15 pies (5 m) de una
    boca de incendios, a menos que un conductor con licencia permanezca en el vehículo
    para moverlo en caso de emergencia.
- id: 183
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al estacionarse o detenerse
    cerca de un cruce peatonal en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: No está permitido estacionarse ni detenerse a menos de 20 pies (6 m)
    de un cruce peatonal en una intersección.
- id: 184
  category: safe_driving_rules
  question: ¿A qué distancia de una señal de PARE (STOP), señal de CEDA EL PASO (YIELD)
    o semáforo no se le permite estacionarse o detenerse?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El manual indica que no está permitido estacionarse ni detenerse a
    menos de 30 pies (10 m) de un semáforo, señal de PARE (STOP) o señal de CEDA EL
    PASO (YIELD).
- id: 185
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima a la que debe estacionarse de un cruce de
    ferrocarril?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: D
  explanation: Según el manual, "No puede estacionar su vehículo a menos de 50 pies
    (15 m) de un cruce de ferrocarril".
- id: 186
  category: driver_responsibility
  question: ¿Cuándo se le permite legalmente estacionarse en un espacio reservado
    para personas con discapacidades?
  choices:
    A: En cualquier momento, siempre y cuando tenga un permiso de estacionamiento
      para discapacitados en el vehículo.
    B: Solo si tiene un permiso o placas Y la persona que los recibió se encuentra
      en el vehículo.
    C: Si está haciendo un mandado rápido para un familiar discapacitado.
    D: Si todos los demás espacios de estacionamiento regulares están ocupados actualmente.
  answer: B
  explanation: Puede estacionarse en espacios reservados solo si tiene un permiso
    o placas de vehículo para personas con discapacidades y solo cuando la persona
    que recibió el permiso o las placas se encuentra en el vehículo.
- id: 187
  category: safe_driving_rules
  question: ¿Por qué debe evitar estacionarse en los espacios con franjas diagonales
    junto a las áreas de estacionamiento reservadas para discapacitados?
  choices:
    A: Están reservados exclusivamente para vehículos de emergencia.
    B: Son zonas de carga para camiones de reparto.
    C: Proporcionan el acceso necesario para sillas de ruedas y vehículos con equipo
      especial.
    D: Están designados para guardar carritos de compras.
  answer: C
  explanation: 'El manual advierte: "No se estacione en los espacios con franjas diagonales
    junto a las áreas de estacionamiento reservadas. Estos espacios son necesarios
    para dar acceso a personas con sillas de ruedas y vehículos con equipo especial".'
- id: 188
  category: penalties_and_points
  question: ¿Cuál es una de las sanciones por hacer una declaración falsa en una solicitud
    de placas de vehículo para discapacitados?
  choices:
    A: Una revocación obligatoria de la licencia.
    B: Una carta de advertencia del DMV.
    C: Un curso obligatorio de manejo defensivo.
    D: La incautación del vehículo por 30 días.
  answer: A
  explanation: Es un delito menor hacer una declaración falsa en una solicitud de
    placas de vehículo, y estaría sujeto a una revocación obligatoria de la licencia
    y podría enfrentar una multa, encarcelamiento o ambos.
- id: 189
  category: penalties_and_points
  question: ¿Cuál es el recargo obligatorio que se agrega a las multas por infracciones
    de estacionamiento en centros comerciales?
  choices:
    A: $15
    B: $20
    C: $30
    D: $50
  answer: C
  explanation: Según el manual, se agregará un recargo obligatorio de $30 a cada multa
    por una infracción de estacionamiento en un centro comercial.
- id: 190
  category: defensive_driving
  question: ¿Cuál es la posición recomendada para sentarse y la colocación de las
    manos al conducir?
  choices:
    A: Encorvado con una mano en la parte inferior del volante.
    B: Sentado en una posición cómoda pero vertical con ambas manos en el volante.
    C: Inclinado hacia atrás con una mano en el volante y la otra en la ventana.
    D: Sentado lo más cerca posible del volante con las manos en la parte superior.
  answer: B
  explanation: Debe sentarse en una posición cómoda pero vertical y mantener ambas
    manos en el volante. Encorvarse o usar solo una mano hace que sea peligroso controlar
    su vehículo.
- id: 191
  category: defensive_driving
  question: Al acercarse a una intersección donde otro conductor tiene una señal de
    PARE (STOP) o CEDA EL PASO (YIELD), ¿qué debe asumir?
  choices:
    A: El otro conductor siempre se detendrá o cederá el paso.
    B: El otro conductor le hará una señal con la mano para que pase por la intersección.
    C: Es mejor asumir que el otro conductor no se detendrá.
    D: El otro conductor tiene el derecho de paso.
  answer: C
  explanation: 'El manual aconseja anticipar los errores de otros conductores y establece:
    ''Es mejor asumir que el otro conductor no se detendrá'', incluso si se acercan
    a una señal de PARE o CEDA EL PASO.'
- id: 192
  category: driver_responsibility
  question: Según el manual, ¿cuál de las siguientes opciones se considera una distracción
    peligrosa al conducir?
  choices:
    A: Revisar los espejos cada pocos segundos.
    B: Observar el camino por delante.
    C: Participar en conversaciones estresantes o emocionales con los pasajeros.
    D: Mantener ambas manos en el volante.
  answer: C
  explanation: El manual enumera evitar discusiones y conversaciones estresantes o
    emocionales con los pasajeros como un paso necesario para prevenir la conducción
    distraída.
- id: 193
  category: safe_driving_rules
  question: ¿Cuál es la principal diferencia entre la conducción agresiva y la furia
    al volante (road rage)?
  choices:
    A: La conducción agresiva implica infringir una ley penal, mientras que la furia
      al volante implica infringir una ley de seguridad vial.
    B: La conducción agresiva generalmente implica la violación de una ley de seguridad
      vial, mientras que la furia al volante implica infringir una ley penal.
    C: La conducción agresiva solo ocurre en autopistas, mientras que la furia al
      volante ocurre en las calles de la ciudad.
    D: No hay diferencia; los términos significan exactamente lo mismo.
  answer: B
  explanation: Según el manual, la conducción agresiva generalmente implica la violación
    de una ley de seguridad vial, mientras que la furia al volante implica infringir
    una ley penal.
- id: 194
  category: defensive_driving
  question: Si un conductor agresivo lo confronta en la carretera, ¿cuál es la mejor
    manera de actuar?
  choices:
    A: Hacer contacto visual para demostrar que no está intimidado.
    B: Desafiarlo aumentando su velocidad.
    C: No hacer contacto visual y tratar de alejarse de manera segura.
    D: Devolver sus gestos y gritos para defenderse.
  answer: C
  explanation: Cuando un conductor agresivo lo confronta, no debe hacer contacto visual,
    debe mantener la calma y tratar de alejarse de manera segura.
- id: 195
  category: defensive_driving
  question: ¿Qué debe hacer si un conductor agresivo lo está siguiendo?
  choices:
    A: Detener su vehículo y bajarse para confrontarlo.
    B: Conducir hasta la estación de policía más cercana.
    C: Detenerse en el arcén y esperar a que pase.
    D: Conducir hasta su casa y poner los seguros a las puertas.
  answer: B
  explanation: 'Si un conductor agresivo lo sigue, el manual establece explícitamente:
    ''no se detenga ni se baje de su vehículo. Conduzca hasta la estación de policía
    más cercana''.'
- id: 196
  category: defensive_driving
  question: ¿Cómo debe considerar el derecho de paso un conductor defensivo?
  choices:
    A: Como un derecho absoluto que nunca debe cederse.
    B: Como una regla que solo se aplica a los peatones.
    C: Como algo que debe estar preparado para ceder a otros usuarios de la vía para
      evitar un choque.
    D: Como una garantía de que otros conductores se detendrán por usted.
  answer: C
  explanation: Si usted tiene el derecho de paso, no lo considere como un derecho
    absoluto. Esté preparado para ceder el derecho de paso a otros usuarios de la
    vía para evitar un choque.
- id: 197
  category: safe_driving_rules
  question: Si no hay un límite de velocidad publicado en una autopista de Nueva York,
    ¿cuál es la velocidad máxima a la que puede conducir legalmente?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: Debe obedecer el límite de velocidad. Si no hay un límite publicado,
    no conduzca a más de 55 mph (88 km/h).
- id: 198
  category: safe_driving_rules
  question: A menos que se publique otro límite, ¿cuál es el límite de velocidad predeterminado
    en la ciudad de Nueva York?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: El manual señala que algunas ciudades tienen límites de velocidad no
    publicados inferiores a 55 mph, estableciendo específicamente que el límite de
    velocidad es de 25 mph en la ciudad de Nueva York a menos que se publique otro
    límite.
- id: 199
  category: penalties_and_points
  question: ¿Puede recibir una multa por exceso de velocidad si conduce por debajo
    del límite de velocidad publicado?
  choices:
    A: No, siempre y cuando esté por debajo del límite publicado, no puede ser multado.
    B: Sí, si su velocidad 'no es razonable' para las condiciones peligrosas del clima
      o de la carretera.
    C: Sí, pero solo si conduce en una zona escolar.
    D: No, la policía solo emite multas por exceder el límite publicado.
  answer: B
  explanation: Incluso si conduce por debajo del límite en una carretera peligrosa,
    un oficial de policía podría multarlo por una velocidad 'no razonable' para las
    condiciones.
- id: 200
  category: safe_driving_rules
  question: ¿Por qué algunas autopistas tienen límites de velocidad mínimos?
  choices:
    A: Para aumentar la cantidad de ingresos recaudados por peajes.
    B: Para mantener un flujo de tráfico fluido y prevenir condiciones peligrosas
      causadas por conductores lentos.
    C: Para animar a los conductores a usar carreteras locales en su lugar.
    D: Para asegurar que los conductores lleguen a sus destinos más rápido.
  answer: B
  explanation: Para mantener un flujo de tráfico fluido, algunas autopistas tienen
    límites de velocidad mínimos. Conducir más lento que el mínimo puede interferir
    con el flujo del tráfico y crear una condición peligrosa.
- id: 201
  category: defensive_driving
  question: Según el manual, ¿qué proporción de los choques involucran colisiones
    por alcance, normalmente porque una persona sigue a otro vehículo demasiado de
    cerca?
  choices:
    A: 1 de cada 10 choques
    B: 2 de cada 10 choques
    C: 4 de cada 10 choques
    D: 6 de cada 10 choques
  answer: C
  explanation: Cuatro de cada 10 choques involucran colisiones por alcance, normalmente
    porque una persona sigue a otro vehículo demasiado de cerca (tailgating).
- id: 202
  category: penalties_and_points
  question: ¿Cuál de las siguientes puede ser una sanción por comportamientos asociados
    con la agresividad al volante (road rage)?
  choices:
    A: Multas, encarcelamiento y libertad condicional ordenada por el tribunal.
    B: Una actualización obligatoria a una licencia de conducir comercial.
    C: El requisito de volver a tomar únicamente el examen escrito del permiso.
    D: Una carta de advertencia sin ninguna otra acción legal.
  answer: A
  explanation: Poner en peligro, amenazar o agredir a otra persona es ilegal. Estos
    comportamientos pueden resultar en sanciones severas que incluyen multas, encarcelamiento,
    libertad condicional ordenada por el tribunal y la revocación o suspensión de
    la licencia.
- id: 203
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima restringida para los vehículos dentro de
    una rotonda?
  choices:
    A: 15 mph
    B: 20 mph
    C: 30 mph
    D: 45 mph
  answer: C
  explanation: Las rotondas están diseñadas para que la velocidad de todos los vehículos
    esté restringida a 30 mph (50 km/h) o menos dentro de la rotonda.
- id: 204
  category: sharing_the_road
  question: ¿Cómo debe interactuar un conductor con un ciclista que circula en una
    rotonda?
  choices:
    A: Tocar la bocina para advertirle que se haga a un lado
    B: Rebasarlo rápidamente por la izquierda
    C: No rebasar a la bicicleta en la rotonda
    D: Obligarlo a usar el cruce peatonal
  answer: C
  explanation: 'A los ciclistas se les permite circular dentro de la rotonda en el
    carril al igual que a los demás vehículos. El manual establece: ''Por favor, no
    rebase a una bicicleta en la rotonda''.'
- id: 205
  category: safe_driving_rules
  question: ¿Qué señal debe usar al acercarse a su salida en una rotonda?
  choices:
    A: Señal de giro a la izquierda
    B: Señal de giro a la derecha
    C: Luces intermitentes de peligro (luces de emergencia)
    D: No se requiere ninguna señal
  answer: B
  explanation: A medida que se acerca a su salida en una rotonda, debe encender su
    señal de giro a la derecha.
- id: 206
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una regla para los peatones que transitan por
    una rotonda?
  choices:
    A: Cruzar directamente hacia la isla central
    B: Caminar por la calzada circular
    C: Cruzar únicamente en los cruces peatonales designados
    D: Ceder el derecho de paso a los vehículos
  answer: C
  explanation: Los peatones deben cruzar únicamente en los cruces peatonales designados
    y nunca cruzar hacia la isla central. También tienen el derecho de paso sobre
    los vehículos.
- id: 207
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de conducir somnoliento?
  choices:
    A: Hiperconcentración en el camino por delante
    B: Recordar las últimas millas con detalles vívidos
    C: Desviarse entre carriles o golpear las bandas sonoras (rumble strips)
    D: Reaccionar a los peligros más rápido de lo habitual
  answer: C
  explanation: Los síntomas de fatiga incluyen desviarse entre carriles, seguir a
    otro vehículo demasiado de cerca (tailgating), no ver las señales de tránsito
    o salirse del camino y golpear las bandas sonoras (rumble strips).
- id: 208
  category: alcohol_drugs_health
  question: Para evitar conducir somnoliento en viajes largos, ¿con qué frecuencia
    debe programar paradas regulares?
  choices:
    A: Cada 50 millas o una hora
    B: Cada 100 millas o dos horas
    C: Cada 200 millas o cuatro horas
    D: Solo cuando necesite cargar combustible
  answer: B
  explanation: Antes de emprender un viaje, debe programar paradas regulares cada
    100 millas o dos horas para prevenir la fatiga.
- id: 209
  category: alcohol_drugs_health
  question: Si sospecha que está somnoliento mientras conduce, ¿cuánto tiempo debe
    dormir una siesta después de detenerse en un área segura?
  choices:
    A: De 5 a 10 minutos
    B: De 15 a 45 minutos
    C: De 1 a 2 horas
    D: Al menos 4 horas
  answer: B
  explanation: Si está somnoliento, debe detenerse en un área segura lejos del tráfico
    y tomar una breve siesta de 15 a 45 minutos.
- id: 210
  category: alcohol_drugs_health
  question: ¿Aproximadamente cuánto tiempo tarda la cafeína en ingresar al torrente
    sanguíneo y promover el estado de alerta a corto plazo?
  choices:
    A: 5 minutos
    B: 15 minutos
    C: 30 minutos
    D: 60 minutos
  answer: C
  explanation: La cafeína tarda unos 30 minutos en ingresar al torrente sanguíneo
    para promover el estado de alerta a corto plazo.
- id: 211
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de hablar por un teléfono
    móvil de mano mientras se conduce en el estado de Nueva York?
  choices:
    A: Una multa de hasta $100 y 2 puntos en la licencia
    B: Una multa de hasta $200 y 5 puntos en la licencia
    C: Una multa de hasta $250 y 3 puntos en la licencia
    D: Una multa de hasta $450 y la suspensión de la licencia
  answer: B
  explanation: Por una primera infracción de usar un teléfono móvil de mano mientras
    conduce, se le podría exigir pagar una multa de hasta $200 y recibir cinco puntos
    en la licencia.
- id: 212
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una tercera infracción o posterior de enviar
    mensajes de texto mientras se conduce cometida en un plazo de 18 meses?
  choices:
    A: $200
    B: $250
    C: $450
    D: $500
  answer: C
  explanation: Una tercera infracción o posterior de enviar mensajes de texto mientras
    se conduce (todas cometidas en un plazo de 18 meses) conlleva una multa de hasta
    $450.
- id: 213
  category: penalties_and_points
  question: ¿Qué le sucede a un conductor con una licencia de prueba (probationary)
    o de menor (junior) que es condenado por enviar mensajes de texto mientras conduce
    por primera vez?
  choices:
    A: Recibe una carta de advertencia
    B: Recibe una suspensión de 60 días
    C: Recibe una suspensión de 120 días
    D: Su licencia es revocada por un año
  answer: C
  explanation: Los conductores con licencias de prueba y de menor que usen un teléfono
    de mano o envíen mensajes de texto mientras conducen recibirán una suspensión
    de 120 días por una primera condena.
- id: 214
  category: vehicle_information
  question: ¿Con qué frecuencia debe ser inspeccionado un vehículo para ser operado
    o estacionado legalmente en las vías públicas de Nueva York?
  choices:
    A: Al menos una vez cada 6 meses
    B: Al menos una vez al año
    C: Al menos una vez cada dos años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Ninguna persona operará o estacionará un vehículo en las vías públicas
    a menos que haya sido inspeccionado al menos una vez al año.
- id: 215
  category: vehicle_information
  question: ¿Qué debe hacer si sus frenos tiran hacia un lado porque están mojados?
  choices:
    A: Bombear los frenos rápidamente durante un minuto
    B: Secarlos pisando ligeramente el pedal
    C: Cambiar a una marcha más baja y evitar frenar
    D: Hacerse a un lado y esperar a que se sequen al aire
  answer: B
  explanation: Los frenos que tiran hacia un lado pueden estar mojados. Si están mojados,
    puede secarlos pisando ligeramente el pedal.
- id: 216
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    requerida por la ley?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: La ley exige que sus neumáticos tengan al menos 2/32 de pulgada (0.16
    cm) de banda de rodadura.
- id: 217
  category: vehicle_information
  question: Al revisar la profundidad de la banda de rodadura de sus neumáticos con
    un centavo (penny), ¿qué indica que sus neumáticos están demasiado gastados y
    necesitan ser reemplazados?
  choices:
    A: Puede ver toda la cabeza de Abraham Lincoln
    B: La cabeza de Lincoln está completamente oculta
    C: Solo puede ver el cabello de Lincoln
    D: El centavo se cae de la ranura
  answer: A
  explanation: Inserte el centavo con la cabeza de Lincoln hacia abajo en la ranura
    que parezca más profunda. Si puede ver toda su cabeza, sus neumáticos están demasiado
    gastados y no debe conducir con ellos.
- id: 218
  category: vehicle_information
  question: ¿Cómo puede comprobar si la profundidad de la banda de rodadura de su
    neumático está demasiado gastada usando un centavo (penny)?
  choices:
    A: Si puede ver toda la cabeza de Abraham Lincoln cuando se inserta de cabeza
      en la ranura más profunda
    B: Si la cabeza de Lincoln está completamente cubierta por la banda de rodadura
      del neumático
    C: Si el centavo se cae cuando se coloca en la ranura
    D: Si el centavo queda al ras con la pared exterior del neumático
  answer: A
  explanation: Según el manual, si inserta el centavo con la cabeza de Lincoln hacia
    abajo en la ranura que parezca más profunda y puede ver toda su cabeza, sus neumáticos
    están demasiado gastados y no debe conducir con ellos.
- id: 219
  category: safe_driving_rules
  question: ¿Cuándo es apropiado usar la bocina (claxon) de su vehículo?
  choices:
    A: Para expresar enojo hacia otros conductores o peatones
    B: Para advertir a otros conductores o peatones de posibles problemas
    C: Para saludar a amigos que caminan por la acera
    D: Para animar al conductor de enfrente a conducir más rápido
  answer: B
  explanation: El manual establece que la bocina es un equipo de seguridad importante
    que podría convertirse en su único medio para advertir a otros conductores o peatones
    de posibles problemas, y no debe usarse para expresar enojo.
- id: 220
  category: alcohol_drugs_health
  question: En el estado de Nueva York, ¿aproximadamente qué porcentaje de todas las
    muertes por accidentes de tránsito involucran conducir bajo los efectos del alcohol
    o drogas (impaired driving)?
  choices:
    A: 10 por ciento
    B: 25 por ciento
    C: Más del 40 por ciento
    D: 60 por ciento
  answer: C
  explanation: El manual establece que en el estado de Nueva York, más del 40 por
    ciento de todas las muertes por accidentes de tránsito involucran conducir bajo
    los efectos del alcohol o drogas.
- id: 221
  category: alcohol_drugs_health
  question: ¿Por qué las sanciones de revocación de la licencia de conducir son más
    severas para los conductores jóvenes que conducen bajo la influencia del alcohol
    o drogas?
  choices:
    A: Generalmente conducen más rápido que los conductores mayores
    B: Representan el 7 por ciento de los conductores afectados en accidentes fatales
      a pesar de ser solo el 4 por ciento de la población de conductores
    C: Tienen más probabilidades de conducir sin seguro
    D: Consumen más alcohol en promedio que los conductores mayores
  answer: B
  explanation: Los conductores menores de 21 años representan aproximadamente el 4
    por ciento de la población de conductores, pero el 7 por ciento de los conductores
    afectados involucrados en accidentes fatales. Esta es una de las razones por las
    que las sanciones de revocación son más severas para los conductores jóvenes.
- id: 222
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol su visión por la noche?
  choices:
    A: Mejora su capacidad para ver en la oscuridad
    B: Reduce su capacidad para recuperarse del resplandor de los faros
    C: Hace que los faros parezcan más tenues
    D: Aumenta su visión periférica
  answer: B
  explanation: El manual señala que el alcohol reduce su capacidad para recuperarse
    del resplandor de los faros, lo que hace que sea especialmente peligroso beber
    y conducir después del anochecer.
- id: 223
  category: alcohol_drugs_health
  question: ¿Cuándo comienzan los efectos del consumo de alcohol en sus habilidades
    de conducción?
  choices:
    A: Solo después de que su nivel de BAC alcance el .08 por ciento
    B: Cuando comienza a sentirse intoxicado
    C: Con la primera bebida
    D: Después de haber consumido tres bebidas en una hora
  answer: C
  explanation: El manual establece que los efectos del consumo de alcohol pueden comenzar
    mucho antes de que se intoxique o incluso de que esté legalmente afectado, y comienzan
    con la primera bebida.
- id: 224
  category: alcohol_drugs_health
  question: ¿Qué nivel de Concentración de Alcohol en la Sangre (BAC) se considera
    evidencia legal de intoxicación en el estado de Nueva York?
  choices:
    A: .02 por ciento o más
    B: .05 por ciento o más
    C: .08 por ciento o más
    D: .18 por ciento o más
  answer: C
  explanation: Un BAC de .08 por ciento o más es evidencia de intoxicación. Un BAC
    de más de .05 por ciento es evidencia de capacidad afectada, y .18 por ciento
    o más es conducir en estado de ebriedad agravado (Aggravated DWI).
- id: 225
  category: alcohol_drugs_health
  question: Un nivel de Concentración de Alcohol en la Sangre (BAC) de más de .05
    por ciento es evidencia legal de qué delito?
  choices:
    A: Conducir en estado de ebriedad agravado (Aggravated DWI)
    B: Conducir con la capacidad afectada (DWAI)
    C: Conducir en estado de ebriedad (DWI)
    D: Negarse a someterse a una prueba química
  answer: B
  explanation: Según el manual, un BAC de más de .05 por ciento es evidencia legal
    de que su capacidad para conducir está afectada.
- id: 226
  category: penalties_and_points
  question: ¿Puede ser condenado por un delito de conducción relacionado con el alcohol
    o las drogas sin una prueba química?
  choices:
    A: No, la ley siempre exige una prueba química para demostrar que la capacidad
      está afectada
    B: Sí, pero solo si confiesa el delito por escrito
    C: Sí, el testimonio de un oficial de policía sobre su forma de conducir y su
      comportamiento puede proporcionar suficiente evidencia
    D: No, a menos que haya evidencia en video de usted consumiendo alcohol
  answer: C
  explanation: El manual establece que el testimonio de un oficial de policía sobre
    su forma de conducir, su apariencia y su comportamiento puede proporcionar suficiente
    evidencia para condenarlo, incluso sin una prueba química.
- id: 227
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes factores NO determina su nivel de Concentración
    de Alcohol en la Sangre (BAC)?
  choices:
    A: Cuánto alcohol bebe
    B: Su peso corporal
    C: Cuánto tiempo pasa entre bebidas
    D: El tipo de bebida alcohólica que bebe
  answer: D
  explanation: Su BAC depende de cuánto bebe, el tiempo entre bebidas y su peso. No
    depende del tipo de bebida que consuma, de su estado físico ni de su 'aguante'
    para el alcohol.
- id: 228
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes bebidas contiene más alcohol?
  choices:
    A: 1 1/2 onzas de licor de 80 grados (80-proof)
    B: 5 onzas de vino (12% de alcohol)
    C: 12 onzas de cerveza (5% de alcohol)
    D: Todas contienen aproximadamente la misma cantidad de alcohol
  answer: D
  explanation: El manual establece que 1 1/2 onzas de licor, 5 onzas de vino, 12 onzas
    de cerveza y 12 onzas de bebida refrescante a base de vino (wine cooler) contienen
    aproximadamente la misma cantidad de alcohol. Ninguna es 'más segura de beber'
    que las demás.
- id: 229
  category: alcohol_drugs_health
  question: ¿Cuál es el único método efectivo para reducir su nivel de Concentración
    de Alcohol en la Sangre (BAC)?
  choices:
    A: Beber café negro
    B: Tomar una ducha fría
    C: No beber durante un período de tiempo
    D: Hacer ejercicio vigoroso
  answer: C
  explanation: El manual establece explícitamente que el único método para reducir
    efectivamente su BAC es no beber durante un período de tiempo. El café, el ejercicio
    y las duchas frías no pueden reducir su BAC.
- id: 230
  category: license_system
  question: ¿Qué significa la ley de 'Consentimiento Implícito' (Implied Consent)
    de Nueva York?
  choices:
    A: Usted da su consentimiento para que registren su vehículo si es detenido por
      la policía
    B: Usted da su consentimiento para someterse a una prueba química de BAC cuando
      conduce en el estado
    C: Usted da su consentimiento para pagar todas las multas de tránsito inmediatamente
      al recibir una infracción
    D: Usted da su consentimiento para que le suspendan la licencia si recibe una
      multa por exceso de velocidad
  answer: B
  explanation: Según la ley de 'Consentimiento Implícito' de Nueva York, cuando usted
    conduce un automóvil en el estado, se considera que ha dado su consentimiento
    para someterse a una prueba química para medir su BAC.
- id: 231
  category: penalties_and_points
  question: ¿Qué le sucede a su licencia de conducir si es declarado culpable de una
    infracción relacionada con el alcohol o las drogas?
  choices:
    A: Recibe una advertencia por la primera infracción.
    B: Debe volver a tomar el examen de manejo dentro de 30 días.
    C: El tribunal debe revocar o suspender su licencia cuando sea sentenciado.
    D: Su licencia se restringe solo a conducir de día.
  answer: C
  explanation: Si es declarado culpable de cualquier infracción relacionada con el
    alcohol o las drogas, el tribunal debe revocar o suspender su licencia de conducir
    cuando sea sentenciado.
- id: 232
  category: alcohol_drugs_health
  question: En promedio, ¿cuánto tiempo le toma al cuerpo de un hombre de 150 libras
    eliminar el alcohol de una bebida estándar?
  choices:
    A: 30 minutos
    B: Aproximadamente una hora
    C: Dos horas
    D: Cuatro horas
  answer: B
  explanation: Para un hombre de 150 libras, cada bebida estándar aumenta su concentración
    de alcohol en la sangre (BAC) en aproximadamente un 0.02 por ciento. En promedio,
    al cuerpo le toma aproximadamente una hora eliminar esa cantidad de alcohol.
- id: 233
  category: alcohol_drugs_health
  question: Según la ley de "Consentimiento Implícito" de Nueva York, ¿a qué da su
    consentimiento al conducir un automóvil en el estado?
  choices:
    A: A permitir que la policía registre su vehículo sin una orden judicial.
    B: A someterse a una prueba química para medir su concentración de alcohol en
      la sangre (BAC).
    C: A pagar todas las multas de tránsito dentro de 30 días.
    D: A que su vehículo sea confiscado si es arrestado.
  answer: B
  explanation: Según la ley de "Consentimiento Implícito" de Nueva York, cuando conduce
    un automóvil en el estado, se considera que ha dado su consentimiento para someterse
    a una prueba química para medir su BAC.
- id: 234
  category: penalties_and_points
  question: ¿Qué le sucede a su licencia de conducir si se niega a someterse a una
    prueba química después de ser arrestado por una infracción relacionada con el
    alcohol o las drogas?
  choices:
    A: Se suspende cuando es procesado en el tribunal.
    B: Se revoca permanentemente de inmediato.
    C: Recibe una advertencia pero conserva su licencia hasta el juicio.
    D: Se restringe únicamente a conducir de ida y vuelta al trabajo.
  answer: A
  explanation: Si se niega a someterse a la prueba después de ser arrestado, su licencia
    de conducir será suspendida cuando sea procesado en el tribunal por el cargo relacionado
    con el alcohol u otras drogas.
- id: 235
  category: penalties_and_points
  question: ¿Con cuántas condenas por conducir bajo los efectos del alcohol o las
    drogas en su vida el DMV denegará permanentemente a un conductor cualquier solicitud
    de restablecimiento de licencia?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: C
  explanation: El DMV denegará permanentemente el restablecimiento si el solicitante
    tiene cuatro condenas o incidentes de manejo relacionados con el alcohol o las
    drogas en su vida.
- id: 236
  category: penalties_and_points
  question: ¿Cuál de las siguientes se considera una "infracción de manejo grave"
    según las regulaciones para infractores reincidentes de Nueva York?
  choices:
    A: Acumular 10 puntos por infracciones de manejo en un período de 10 años.
    B: Un choque fatal.
    C: Una multa de estacionamiento en una zona escolar.
    D: No ceder el paso en una señal de alto.
  answer: B
  explanation: Una infracción de manejo grave incluye un choque fatal, una condena
    de ley penal relacionada con el manejo, una acumulación de 20 o más puntos en
    25 años, o dos condenas de 5 o más puntos en 25 años.
- id: 237
  category: alcohol_drugs_health
  question: Según la ley de "tolerancia cero" de Nueva York, es una infracción que
    una persona menor de 21 años conduzca con un BAC medible ¿en qué rango?
  choices:
    A: De 0.01 a 0.05
    B: De 0.02 a 0.07
    C: De 0.05 a 0.08
    D: 0.08 y superior
  answer: B
  explanation: Según la ley de "tolerancia cero" del estado, es una infracción que
    una persona menor de 21 años conduzca con cualquier BAC que pueda medirse (de
    0.02 a 0.07).
- id: 238
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de Tolerancia Cero para
    un conductor menor de 21 años?
  choices:
    A: Una suspensión de la licencia por 30 días y una multa de $50.
    B: Una suspensión de la licencia por 6 meses, una tarifa de terminación de $100
      y una sanción civil de $125.
    C: Una revocación de la licencia por 1 año y una multa de $500.
    D: Encarcelamiento obligatorio por 5 días.
  answer: B
  explanation: Después de un fallo por una primera infracción de Tolerancia Cero,
    la licencia de conducir será suspendida por seis meses, y el conductor debe pagar
    una tarifa de terminación de suspensión de $100 y una sanción civil de $125.
- id: 239
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera condena por poseer un recipiente
    abierto de una bebida alcohólica en un vehículo motorizado en una vía pública?
  choices:
    A: $50
    B: $100
    C: $150
    D: $250
  answer: C
  explanation: La sanción por una primera condena de la Ley de Recipiente Abierto
    es una multa de hasta $150, un recargo obligatorio, una tarifa de asistencia a
    víctimas de delitos y un posible encarcelamiento de 15 días.
- id: 240
  category: safe_driving_rules
  question: ¿Quién está exento de la Ley de Recipiente Abierto con respecto a las
    bebidas alcohólicas?
  choices:
    A: Los conductores de camiones comerciales.
    B: Los pasajeros en vehículos como limusinas alargadas que muestren un certificado
      de comercio válido.
    C: Los pasajeros en el asiento trasero de cualquier vehículo de pasajeros estándar.
    D: Los conductores mayores de 25 años.
  answer: B
  explanation: La ley de Recipiente Abierto exime a los pasajeros en vehículos como
    limusinas alargadas y otros vehículos que muestren un certificado o permiso de
    comercio emitido por el Departamento de Transporte de los EE. UU. o del estado
    de Nueva York (NYS).
- id: 241
  category: penalties_and_points
  question: ¿Cuál es la consecuencia de usar una licencia de conducir para comprar
    ilegalmente bebidas que contienen alcohol?
  choices:
    A: Una multa de $500
    B: Suspensión de su licencia de conducir o del privilegio de solicitar una licencia
    C: Servicio comunitario obligatorio
    D: Revocación permanente de su licencia de conducir
  answer: B
  explanation: La ley estatal exige la suspensión de su licencia de conducir o del
    privilegio de solicitar una licencia si la usa como prueba de edad para comprar
    ilegalmente bebidas que contienen alcohol.
- id: 242
  category: alcohol_drugs_health
  question: 'Conducir en Estado de Ebriedad Agravado (AGG-DWI) se aplica a los conductores
    con una Concentración de Alcohol en la Sangre (BAC) de al menos:'
  choices:
    A: '0.05'
    B: '0.08'
    C: '0.15'
    D: '0.18'
  answer: D
  explanation: Conducir en Estado de Ebriedad Agravado (AGG-DWI) se aplica a una Concentración
    de Alcohol en la Sangre (BAC) de 0.18 o más.
- id: 243
  category: penalties_and_points
  question: ¿Cuál es la pena máxima de cárcel por una primera infracción de Conducir
    en Estado de Ebriedad (DWI)?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Para una primera infracción de Conducir en Estado de Ebriedad (DWI),
    la pena máxima de cárcel es de hasta 1 año.
- id: 244
  category: penalties_and_points
  question: Si a un conductor se le aprueba el restablecimiento de la licencia después
    de un período de denegación de 5 años debido a condenas repetidas relacionadas
    con el alcohol, ¿por cuánto tiempo debe usar un dispositivo de bloqueo de encendido
    (interlock)?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: D
  explanation: Las regulaciones exigen un dispositivo de bloqueo de encendido en el
    vehículo conducido por el solicitante durante cinco años a partir de la fecha
    de emisión del documento de la licencia.
- id: 245
  category: alcohol_drugs_health
  question: 'Según la Ley de Envases Abiertos (Open Container Law), es una infracción
    de tránsito que un conductor o pasajero en un vehículo motorizado en una vía pública:'
  choices:
    A: Transporte marihuana/cannabis sin abrir en el maletero
    B: Consuma marihuana/cannabis
    C: Posea medicamentos recetados en su frasco original
    D: Beba una bebida no alcohólica
  answer: B
  explanation: Es una infracción de tránsito que un conductor o pasajero en un vehículo
    motorizado en una carretera, calle o vía pública consuma marihuana/cannabis.
- id: 246
  category: penalties_and_points
  question: ¿Cuál es la acción requerida sobre la licencia por una primera infracción
    de Conducir con Habilidades Afectadas (DWAI)?
  choices:
    A: Suspensión de 30 días
    B: Suspensión de 90 días
    C: Revocación de 6 meses
    D: Revocación de 1 año
  answer: B
  explanation: Según el manual, una primera infracción por DWAI (Infracción de Tránsito)
    requiere una suspensión de 90 días.
- id: 247
  category: penalties_and_points
  question: ¿Cuál es la pena máxima de cárcel por una segunda infracción de DWAI dentro
    de un período de 5 años?
  choices:
    A: Hasta 15 días
    B: Hasta 30 días
    C: Hasta 90 días
    D: Hasta 180 días
  answer: B
  explanation: El manual establece que una segunda infracción de DWAI dentro de un
    período de 5 años conlleva una pena de cárcel de hasta 30 días.
- id: 248
  category: alcohol_drugs_health
  question: Según la Ley de Leandra (Leandra's Law), cometer un delito relacionado
    con el alcohol con un niño en el vehículo es un delito grave de clase E si el
    niño es menor de ¿qué edad?
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: La Ley de Leandra establece que los conductores que cometen delitos
    relacionados con el alcohol con un niño menor de 16 años en el vehículo pueden
    ser acusados de un delito grave de clase E.
- id: 249
  category: penalties_and_points
  question: ¿Por cuánto tiempo debe un conductor, por lo general, mantener un dispositivo
    de bloqueo de encendido en su vehículo después de una condena por DWI?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 12 meses
    D: Al menos 24 meses
  answer: C
  explanation: Los tribunales deben ordenar a las personas condenadas por DWI o DWI
    agravado que instalen y mantengan un dispositivo de bloqueo de encendido en cualquier
    vehículo que posean o conduzcan durante al menos 12 meses.
- id: 250
  category: license_system
  question: 'Una licencia de conducir condicional será revocada si el conductor es
    condenado por cualquier infracción de tránsito, EXCEPTO:'
  choices:
    A: Exceso de velocidad
    B: No ceder el paso
    C: Estacionar, detenerse o pararse
    D: Pasarse un semáforo en rojo
  answer: C
  explanation: El manual señala que una licencia de conducir condicional será revocada
    si el conductor no cumple con los términos del tribunal o por una condena por
    cualquier infracción de tránsito, excepto estacionar, detenerse o pararse.
- id: 251
  category: penalties_and_points
  question: Si lo arrestan por conducir bajo los efectos del alcohol o las drogas
    (impaired or intoxicated) y su licencia ya está suspendida o revocada, ¿cuál es
    la multa obligatoria máxima que enfrenta?
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: Si está bajo los efectos del alcohol o las drogas al ser arrestado
    mientras conduce con una licencia suspendida o revocada, la multa obligatoria
    máxima es de $5,000 y el vehículo puede ser confiscado.
- id: 252
  category: penalties_and_points
  question: ¿Cuál es la pena máxima de cárcel que puede enfrentar si mata o causa
    lesiones a otra persona debido a una infracción relacionada con el alcohol o las
    drogas?
  choices:
    A: 10 años
    B: 15 años
    C: 20 años
    D: 25 años
  answer: D
  explanation: Matar o causar lesiones debido a una infracción relacionada con el
    alcohol u otras drogas puede resultar en condenas que conllevan una pena máxima
    de cárcel de 25 años.
- id: 253
  category: safe_driving_rules
  question: 'Al cruzar las vías del tren, usted siempre debe:'
  choices:
    A: Cambiar de marcha mientras cruza las vías
    B: Mantenerse en su carril y en la misma marcha
    C: Acelerar para cruzar lo más rápido posible
    D: Detenerse en las vías para comprobar si vienen trenes
  answer: B
  explanation: 'El manual indica explícitamente: "Al cruzar las vías, manténgase siempre
    en su carril y en la misma marcha".'
- id: 254
  category: signs_and_signals
  question: Al acercarse a un cruce a nivel activo con luces rojas intermitentes y
    barreras bajadas, ¿cuándo es legal avanzar?
  choices:
    A: Tan pronto como el tren haya pasado, incluso si las barreras están bajadas
    B: Cuando las barreras estén completamente levantadas y las luces apagadas
    C: Cuando las barreras comiencen a levantarse y pueda ver claramente
    D: Si conduce un vehículo pequeño que cabe debajo de la barrera
  answer: B
  explanation: Al acercarse a cruces a nivel marcados o activos, no avance hasta que
    las barreras estén completamente levantadas y las luces estén apagadas.
- id: 255
  category: safe_driving_rules
  question: Si luces rojas intermitentes, barreras de cruce bajadas o una campana
    indican que se acerca un tren, ¿a qué distancia mínima de las vías debe detenerse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 25 pies
  answer: C
  explanation: Las luces rojas intermitentes, las barreras de cruce bajadas y/o una
    campana en un cruce de ferrocarril indican que debe detenerse al menos a 15 pies
    (5 m) de las vías.
- id: 256
  category: signs_and_signals
  question: ¿Qué significa una señal amarilla con letras negras "RR" y un símbolo
    de "X"?
  choices:
    A: Debe detenerse por completo inmediatamente
    B: Hay un cruce de ferrocarril más adelante
    C: El cruce de ferrocarril está cerrado
    D: Se está acercando a una señal de cruz de San Andrés (crossbuck)
  answer: B
  explanation: Una señal amarilla con letras negras "RR" y un símbolo de "X" es una
    señal de advertencia de cruce de ferrocarril, lo que significa que hay un cruce
    de ferrocarril más adelante y debe tener precaución y estar preparado para detenerse.
- id: 257
  category: signs_and_signals
  question: ¿Qué forma tiene una señal de cruz de San Andrés (crossbuck) en un cruce
    de ferrocarril?
  choices:
    A: Un círculo
    B: Un diamante (rombo)
    C: Una "X"
    D: Un octágono
  answer: C
  explanation: Una señal de cruz de San Andrés (crossbuck) se describe en el manual
    como una señal en forma de "X" con las palabras "RAILROAD CROSSING" (Cruce de
    ferrocarril) impresas en ella.
- id: 258
  category: defensive_driving
  question: 'Al calcular la distancia y la velocidad de un tren que se acerca, debe
    recordar que:'
  choices:
    A: Los trenes generalmente se mueven más lento de lo que parece
    B: Los trenes están más cerca y se mueven más rápido de lo que usted cree
    C: Los trenes pueden detenerse rápidamente si ven un vehículo en las vías
    D: Los trenes siempre tocarán la bocina antes de que pueda verlos
  answer: B
  explanation: 'El manual aconseja a los conductores: "Recuerde que el tren que ve
    está más cerca y se mueve más rápido de lo que cree, y tenga en cuenta que los
    trenes no pueden detenerse rápidamente".'
- id: 259
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es una estrategia recomendada para evitar conducir
    bajo los efectos del alcohol o las drogas?
  choices:
    A: Beber mucho café antes de conducir
    B: Alternar entre bebidas con alcohol y bebidas sin alcohol
    C: Conducir solo por carreteras locales en lugar de autopistas
    D: Mantener las ventanas bajadas para mantenerse alerta
  answer: B
  explanation: 'Para evitar problemas, el manual recomienda: "Beba lentamente. Alterne
    entre bebidas con alcohol y bebidas sin alcohol".'
- id: 260
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias debe intentar cruzar las vías del tren?
  choices:
    A: Solo cuando esté seguro de que todo su vehículo pasará completamente todas
      las vías
    B: Siempre que el vehículo que va delante de usted comience a cruzar
    C: Si el tren está a más de 100 pies de distancia
    D: Si el cruce no tiene luces intermitentes
  answer: A
  explanation: 'El manual advierte: "Bajo ninguna circunstancia intente cruzar las
    vías del tren a menos que esté seguro de que todo su vehículo pasará completamente
    todas las vías".'
- id: 261
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si el motor de su vehículo se apaga
    en las vías del tren?
  choices:
    A: Intentar encender el motor inmediatamente
    B: Sacar a todos del vehículo y alejarse de las vías
    C: Quedarse en el vehículo y llamar al 911
    D: Empujar el vehículo fuera de las vías
  answer: B
  explanation: Si su vehículo se apaga en las vías por cualquier motivo, el manual
    indica que debe SALIR (incluyendo a todos en el vehículo) y alejarse de las vías,
    incluso si no ve venir un tren.
- id: 262
  category: defensive_driving
  question: Si su vehículo se apaga en las vías del tren y se acerca un tren, ¿en
    qué dirección debe correr?
  choices:
    A: Por la vía en la misma dirección en la que se mueve el tren
    B: Directamente lejos de las vías en un ángulo de 90 grados
    C: Hacia el tren, pero alejándose de las vías en un ángulo de 45 grados
    D: Paralelo a las vías en la dirección opuesta al tren
  answer: C
  explanation: Si se acerca un tren, corra hacia el tren, pero alejándose de las vías
    en un ángulo de 45 grados. Correr en la misma dirección que el tren puede hacer
    que sea golpeado por los escombros cuando el tren impacte su vehículo.
- id: 263
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado a detenerse en todos los
    cruces de ferrocarril?
  choices:
    A: Automóviles de pasajeros con niños
    B: Motocicletas
    C: Autobuses escolares con o sin pasajeros
    D: Camiones de reparto
  answer: C
  explanation: Los autobuses escolares con o sin pasajeros, otros autobuses con pasajeros
    a bordo y los vehículos con explosivos o carga inflamable deben detenerse en todos
    los cruces de ferrocarril.
- id: 264
  category: safe_driving_rules
  question: ¿Qué debe hacer si ingresa a una autopista en una dirección diferente
    a la que pretendía?
  choices:
    A: Retroceder con cuidado en la rampa de entrada
    B: Cruzar la mediana cuando haya un espacio en el tráfico
    C: Detenerse en el arcén (hombro) y hacer un giro en U
    D: Mantenerse en la autopista hasta la siguiente salida
  answer: D
  explanation: Si ingresa a una autopista en una dirección diferente a la que pretendía,
    o en la salida equivocada, manténgase en la autopista hasta la siguiente salida.
    Es peligroso retroceder en una rampa de entrada o cruzar una mediana.
- id: 265
  category: safe_driving_rules
  question: Si un carril de entrada a la autopista es demasiado corto para permitir
    la aceleración a la velocidad de la autopista, ¿cuál es el método más seguro para
    ingresar?
  choices:
    A: Forzar su paso hacia el carril derecho
    B: Detenerse y esperar un espacio grande en el tráfico, luego acelerar rápidamente
    C: Conducir por el arcén (hombro) hasta alcanzar la velocidad de la autopista
    D: Tocar la bocina para que otros conductores le cedan el paso
  answer: B
  explanation: Si el carril de entrada es demasiado corto para permitir la aceleración
    a la velocidad de la autopista, el método más seguro para ingresar es detenerse
    y esperar un espacio grande en el tráfico, luego ingresar a la autopista y acelerar
    rápidamente.
- id: 266
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar su salida antes de llegar a la
    rampa de salida de la autopista?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: Asegúrese de señalizar su salida al menos 100 pies (30 m) antes de
    llegar a la rampa de salida.
- id: 267
  category: defensive_driving
  question: ¿Qué significa 'conducir dentro del alcance' de sus faros?
  choices:
    A: Conducir a una velocidad que le permita detenerse de manera segura dentro de
      la distancia que cubren sus faros
    B: Mantener sus faros apuntando a la superficie de la carretera
    C: Usar luces altas siempre que conduzca a más de 40 mph
    D: Mantenerse a menos de 350 pies del vehículo que va delante de usted
  answer: A
  explanation: Sus faros cubren aproximadamente 350 pies hacia adelante. Es importante
    que conduzca a una velocidad que le permita detenerse de manera segura dentro
    de esa distancia. A esto se le llama 'conducir dentro del alcance' de sus faros.
- id: 268
  category: safe_driving_rules
  question: Por ley, ¿durante qué horarios debe usar sus faros?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde media hora después del atardecer hasta media hora antes del amanecer
    C: Solo cuando no hay luces en la calle
    D: Desde una hora después del atardecer hasta una hora antes del amanecer
  answer: B
  explanation: La ley requiere que use sus faros desde media hora después del atardecer
    hasta media hora antes del amanecer, cuando la visibilidad sea menor a 1,000 pies
    y cuando use sus limpiaparabrisas.
- id: 269
  category: safe_driving_rules
  question: ¿A qué distancia de un vehículo que se aproxima en sentido contrario debe
    bajar sus faros a luces bajas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Sus faros deben estar en luces bajas cuando se encuentre a menos de
    500 pies (150 m) de un vehículo que se aproxima en sentido contrario.
- id: 270
  category: defensive_driving
  question: ¿Qué debe hacer para ayudar a evitar el resplandor de las luces altas
    de un vehículo que se aproxima?
  choices:
    A: Parpadear sus luces altas continuamente
    B: Cerrar un ojo hasta que pase el vehículo
    C: Mover los ojos hacia la derecha y usar el borde de la carretera como guía
    D: Encender la luz interior del techo
  answer: C
  explanation: Para ayudar a evitar el resplandor de las luces altas que se aproximan,
    mueva los ojos hacia la derecha. Use el borde de la carretera como guía hasta
    que el vehículo que se aproxima pase.
- id: 271
  category: vehicle_information
  question: ¿Qué es el "hidroplaneo" (hydroplaning)?
  choices:
    A: Cuando los frenos de su vehículo se congelan en clima húmedo
    B: Cuando sus llantas comienzan a deslizarse sobre el agua que está en la superficie
      del pavimento de la carretera
    C: Cuando la niebla se mezcla con la lluvia creando una visibilidad nula
    D: Cuando sus limpiaparabrisas no pueden seguir el ritmo de la lluvia intensa
  answer: B
  explanation: En caso de lluvia intensa, sus llantas pueden comenzar a deslizarse
    sobre el agua que está en la superficie del pavimento de la carretera. A esto
    se le llama "hidroplaneo" (hydroplaning) y puede causar la pérdida total de tracción
    y del control de la dirección.
- id: 272
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar para tener mejor visibilidad durante la
    lluvia, niebla o nieve?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Luces de circulación diurna
    D: Luces de estacionamiento
  answer: B
  explanation: Las luces altas reflejan la lluvia, la niebla y la nieve al caer, lo
    que dificulta la visión. Para una mejor visibilidad durante estas condiciones
    climáticas, mantenga sus luces delanteras en luces bajas.
- id: 273
  category: safe_driving_rules
  question: 'La ley del estado de Nueva York requiere que encienda sus luces delanteras
    cuando las condiciones climáticas requieran el uso de:'
  choices:
    A: Limpiaparabrisas
    B: El desempañador
    C: Luces antiniebla
    D: Luces de emergencia
  answer: A
  explanation: La ley del estado de Nueva York requiere que encienda sus luces delanteras
    cuando las condiciones climáticas requieran el uso de limpiaparabrisas para despejar
    la lluvia, nieve, aguanieve o niebla.
- id: 274
  category: vehicle_information
  question: Al preparar su vehículo para conducir en invierno, ¿qué combinación de
    llantas nunca debe usar?
  choices:
    A: Llantas de nieve y llantas para todas las estaciones
    B: Llantas radiales y no radiales
    C: Llantas con clavos y sin clavos
    D: Llantas anchas y estrechas
  answer: B
  explanation: Antes de que llegue el clima invernal, asegúrese de que su vehículo
    esté en buenas condiciones. Nunca combine llantas radiales y no radiales en el
    vehículo.
- id: 275
  category: vehicle_information
  question: ¿Cuándo está legalmente permitido el uso de llantas con clavos de metal
    en el estado de Nueva York?
  choices:
    A: Del 1 de noviembre al 1 de abril
    B: Del 16 de octubre al 30 de abril
    C: Del 1 de septiembre al 31 de mayo
    D: Son ilegales durante todo el año
  answer: B
  explanation: Según el manual, las llantas con clavos de metal solo se pueden usar
    en el estado de Nueva York del 16 de octubre al 30 de abril.
- id: 276
  category: vehicle_information
  question: ¿Cuál de las siguientes es una regla sobre el uso de llantas en su vehículo?
  choices:
    A: Debe combinar llantas radiales y no radiales para una mejor tracción en invierno.
    B: Nunca combine llantas radiales y no radiales en el mismo vehículo.
    C: Las llantas de nieve solo deben colocarse en las ruedas delanteras.
    D: Se deben usar clavos de metal en todas las llantas durante el invierno.
  answer: B
  explanation: 'El manual establece explícitamente: "Nunca combine llantas radiales
    y no radiales en el mismo vehículo".'
- id: 277
  category: defensive_driving
  question: ¿Qué debe hacer si las ruedas traseras de su vehículo comienzan a patinar
    hacia la izquierda?
  choices:
    A: Girar el volante hacia la derecha.
    B: Girar el volante hacia la izquierda.
    C: Mantener el volante perfectamente derecho.
    D: Frenar bruscamente de inmediato.
  answer: B
  explanation: Para recuperarse de un patinazo de las ruedas traseras, debe girar
    el volante en la dirección hacia la que el vehículo intenta ir. Si sus ruedas
    traseras se deslizan hacia la izquierda, gire hacia la izquierda.
- id: 278
  category: defensive_driving
  question: ¿Cuál es el primer paso que debe tomar si sus ruedas delanteras comienzan
    a patinar?
  choices:
    A: Girar el volante bruscamente en la dirección del patinazo.
    B: Bombear los frenos rápidamente.
    C: Quitar el pie del acelerador y cambiar a neutral.
    D: Acelerar para recuperar la tracción.
  answer: C
  explanation: Si sus ruedas delanteras patinan, el manual aconseja quitar el pie
    del acelerador y cambiar a neutral o pisar el embrague, pero no intente girar
    el volante de inmediato.
- id: 279
  category: safe_driving_rules
  question: ¿Qué áreas de la carretera tienen más probabilidades de congelarse primero
    cuando comienza a caer aguanieve o lluvia helada?
  choices:
    A: Intersecciones y cruces peatonales
    B: Túneles y pasos subterráneos
    C: Puentes, rampas y pasos elevados
    D: Autopistas de varios carriles muy transitadas
  answer: C
  explanation: Cuando comienza a caer aguanieve, lluvia helada o nieve, recuerde que
    los puentes, las rampas y los pasos elevados se congelarán primero.
- id: 280
  category: defensive_driving
  question: ¿Durante qué momento del día es mayor la actividad de los ciervos, lo
    que aumenta el riesgo de colisiones?
  choices:
    A: Al mediodía y a primera hora de la tarde
    B: A altas horas de la noche
    C: Al amanecer y al anochecer
    D: Solo durante el tráfico de la hora pico de la mañana
  answer: C
  explanation: La actividad diaria de los ciervos es mayor al amanecer y al anochecer,
    que a menudo es el momento de mayor tránsito para los conductores de vehículos
    motorizados.
- id: 281
  category: defensive_driving
  question: ¿Qué debe hacer si se le revienta un neumático mientras conduce?
  choices:
    A: Frenar bruscamente y girar bruscamente para salir de la carretera.
    B: Sujetar el volante con firmeza y quitar lentamente el pie del acelerador.
    C: Acelerar ligeramente para mantener el control del vehículo.
    D: Bombear los frenos rápidamente hasta que el vehículo se detenga.
  answer: B
  explanation: Si se revienta un neumático, sujete el volante con firmeza y quite
    lentamente el pie del acelerador. No frene hasta que tenga el control de su vehículo.
- id: 282
  category: defensive_driving
  question: Si su vehículo de repente no responde al girar el volante, ¿por qué debe
    mantener inicialmente el pie fuera del pedal del freno?
  choices:
    A: Porque frenar hará que el motor se apague.
    B: Porque un cambio repentino de velocidad podría hacer que el vehículo se descontrole.
    C: Porque los frenos están conectados a la columna de dirección.
    D: Porque necesita acelerar para recuperar la presión del líquido de dirección.
  answer: B
  explanation: Durante una falla en la dirección, el equilibrio del vehículo le permitirá
    seguir en línea recta, pero un cambio repentino de velocidad (como frenar) podría
    hacer que se descontrole.
- id: 283
  category: defensive_driving
  question: ¿Por qué NO debe apagar el motor (la ignición) si el pedal del acelerador
    se atasca?
  choices:
    A: Hará que el motor se incendie.
    B: Podría perder el control de la dirección o bloquear el volante.
    C: Los frenos se bloquearán inmediatamente.
    D: El vehículo acelerará más rápido.
  answer: B
  explanation: Si el pedal del acelerador se atasca, no apague el motor, ya que podría
    perder el control de la dirección o bloquear el volante.
- id: 284
  category: defensive_driving
  question: ¿Cuál es la acción correcta a tomar si sus ruedas se salen accidentalmente
    del pavimento?
  choices:
    A: Girar bruscamente para volver al pavimento de inmediato.
    B: Acelerar para que las ruedas vuelvan a la carretera.
    C: Quitar suavemente el pie del acelerador y frenar con suavidad.
    D: Frenar bruscamente y detenerse por completo en el arcén (hombro).
  answer: C
  explanation: Si sus ruedas se salen del pavimento, no gire ni dé un volantazo repentino
    para volver al pavimento. Quite suavemente el pie del acelerador y frene con suavidad.
- id: 285
  category: defensive_driving
  question: Si un vehículo se aproxima de frente hacia usted en su carril, ¿qué debe
    hacer?
  choices:
    A: Girar hacia el carril izquierdo para evitarlo.
    B: Disminuir la velocidad, hacerse a un lado hacia la derecha y tocar la bocina.
    C: Detenerse inmediatamente en su carril y parpadear las luces delanteras.
    D: Acelerar y girar a la izquierda.
  answer: B
  explanation: Si un vehículo se aproxima de frente en su carril, disminuya la velocidad,
    hágase a un lado hacia la derecha y toque la bocina para advertir al otro conductor.
    No gire hacia el carril izquierdo.
- id: 286
  category: defensive_driving
  question: Si su vehículo cae al agua, ¿por qué debe escapar por una ventana en lugar
    de abrir una puerta?
  choices:
    A: La manija de la puerta estará bloqueada por la presión del agua.
    B: Abrir una puerta haría que el agua entrara de golpe y el automóvil podría volcarse.
    C: La ventana proporciona una ruta de escape más grande.
    D: Abrir la puerta hará que se desplieguen las bolsas de aire.
  answer: B
  explanation: Al escapar de un vehículo en el agua, suéltese el cinturón de seguridad
    y escape por una ventana. Una puerta abierta haría que el agua entrara de golpe
    y el automóvil podría volcarse sobre usted.
- id: 287
  category: defensive_driving
  question: ¿Qué debe hacer si ve humo saliendo de debajo del capó de su vehículo?
  choices:
    A: Abrir el capó inmediatamente para localizar la fuente del incendio.
    B: Conducir rápidamente a la estación de bomberos más cercana.
    C: Salir de la carretera, apagar el motor, alejarse del automóvil y llamar al
      departamento de bomberos.
    D: Usar agua del depósito del limpiaparabrisas para extinguir las llamas.
  answer: C
  explanation: Si ve que sale humo de debajo del capó, salga de la carretera y estacione
    su vehículo. Apague el motor. Aléjese del automóvil y llame al departamento de
    bomberos. Es peligroso intentar combatir el incendio usted mismo.
- id: 288
  category: vehicle_information
  question: ¿Cómo debe frenar para recuperarse de un derrape de las ruedas traseras
    si su vehículo está equipado con frenos antibloqueo (ABS)?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Mantener el pie con presión uniforme sobre el pedal del freno.
    C: Frenar bruscamente y soltar repetidamente.
    D: No tocar el pedal del freno en absoluto.
  answer: B
  explanation: Si su vehículo tiene frenos antibloqueo (ABS), mantenga el pie con
    presión uniforme sobre el pedal del freno durante un derrape. Bombear el pedal
    es solo para vehículos sin ABS.
- id: 289
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de entrar o salir en reversa de un camino de entrada
    (driveway) cuando hay niños cerca?
  choices:
    A: Confiar únicamente en sus espejos retrovisores.
    B: Tocar la bocina tres veces antes de moverse.
    C: Bajarse del vehículo y revisar detrás de él.
    D: Acelerar rápidamente para minimizar el tiempo en el camino de entrada.
  answer: C
  explanation: El manual indica que antes de entrar o salir en reversa de un camino
    de entrada, debe bajarse del vehículo y revisar detrás del mismo, y no confiar
    solo en los espejos cuando hay niños cerca.
- id: 290
  category: sharing_the_road
  question: Si no hay acera disponible, ¿cómo deben caminar los peatones por la carretera?
  choices:
    A: En el lado de la carretera de frente al tráfico.
    B: En el lado de la carretera moviéndose en la misma dirección que el tráfico.
    C: En el centro del carril.
    D: En el arcén (hombro) derecho, independientemente de la dirección del tráfico.
  answer: A
  explanation: Según el manual, los peatones deben caminar por el lado de la carretera
    y de frente al tráfico en el carril más cercano a ellos.
- id: 291
  category: sharing_the_road
  question: ¿Cuándo debe ceder el derecho de paso a un peatón ciego que cruza con
    un perro guía o un bastón blanco?
  choices:
    A: Solo cuando están en un cruce peatonal marcado.
    B: Solo cuando el semáforo está a su favor.
    C: Siempre, incluso si los semáforos no están a su favor.
    D: Solo durante las horas de luz del día.
  answer: C
  explanation: Una ley especial de derecho de paso exige que los conductores siempre
    cedan el derecho de paso a los peatones ciegos cuando cruzan con un perro guía
    o un bastón blanco/metálico, incluso si los semáforos no están a su favor.
- id: 292
  category: sharing_the_road
  question: Según la ley, ¿dónde se les permite a los peatones pararse para hacer
    autostop (pedir aventón)?
  choices:
    A: En el arcén (hombro) de una autopista.
    B: En la mediana central de una carretera dividida.
    C: En la carretera, siempre y cuando usen ropa reflectante.
    D: A los peatones nunca se les permite pararse en la carretera para hacer autostop.
  answer: D
  explanation: La ley exige que los peatones nunca se paren en la carretera para hacer
    autostop o realizar negocios con los automovilistas.
- id: 293
  category: defensive_driving
  question: En la ciudad de Nueva York, más del 35% de los choques con lesiones a
    peatones ocurren durante ¿qué maniobra del conductor?
  choices:
    A: Estacionamiento en paralelo.
    B: Al hacer un giro a la izquierda.
    C: Al hacer un giro a la derecha.
    D: Al salir en reversa de un camino de entrada.
  answer: B
  explanation: El manual señala que los giros a la izquierda pueden ser una maniobra
    muy peligrosa, destacando que más del 35% de los choques con lesiones a peatones
    en la ciudad de Nueva York ocurren cuando un conductor intenta hacer un giro a
    la izquierda.
- id: 294
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca a un vehículo que está detenido en un cruce
    peatonal?
  choices:
    A: Rebasar al vehículo lentamente por la izquierda.
    B: Tocar la bocina para alertar al conductor que se mueva.
    C: Nunca rebasar al vehículo, ya que puede haber peatones cruzando.
    D: Rebasar al vehículo por la derecha si hay suficiente espacio.
  answer: C
  explanation: 'El manual establece explícitamente: ''Nunca rebase a los vehículos
    detenidos en un cruce peatonal. Puede haber personas cruzando donde usted no puede
    ver''.'
- id: 295
  category: vehicle_information
  question: ¿Cómo pueden afectar su conducción los pilares A de un vehículo?
  choices:
    A: Mejoran su visión periférica.
    B: Pueden crear puntos ciegos que interfieren con la visión clara.
    C: Ayudan a reducir el resplandor de los faros que se aproximan.
    D: Ajustan automáticamente sus espejos para una mejor visibilidad.
  answer: B
  explanation: Los conductores deben ser conscientes de los pilares A de su vehículo
    (soportes verticales alrededor del parabrisas) porque pueden interferir con la
    visión clara y pueden crear puntos ciegos.
- id: 296
  category: sharing_the_road
  question: ¿En qué dirección deben viajar los ciclistas en la carretera?
  choices:
    A: De frente al tráfico que se aproxima.
    B: En la misma dirección que los vehículos motorizados.
    C: En la dirección que tenga menos tráfico.
    D: En el lado izquierdo de la carretera en todo momento.
  answer: B
  explanation: El manual establece que los ciclistas tienen derecho a compartir la
    carretera y viajar en la misma dirección que los vehículos motorizados.
- id: 297
  category: sharing_the_road
  question: ¿Por qué debe reducir su velocidad al rebasar a un ciclista?
  choices:
    A: Para evitar salpicarles agua.
    B: Porque los ciclistas deben detenerse al ser rebasados.
    C: La presión del aire de un vehículo que pasa rápidamente puede desequilibrar
      al ciclista.
    D: Para permitir que el ciclista se agarre a su vehículo para ser remolcado.
  answer: C
  explanation: Los conductores deben dar espacio a los ciclistas y reducir la velocidad
    al rebasarlos porque la presión del aire de un vehículo que pasa rápidamente puede
    desequilibrarlos.
- id: 298
  category: sharing_the_road
  question: ¿Cuál es el número máximo de ciclistas que pueden viajar uno al lado del
    otro en un solo carril?
  choices:
    A: Uno.
    B: Dos.
    C: Tres.
    D: Cuatro.
  answer: B
  explanation: Los ciclistas nunca deben viajar con más de dos personas una al lado
    de la otra en un solo carril.
- id: 299
  category: safe_driving_rules
  question: Según la ley de Nueva York, ¿qué grupo de edad de ciclistas y sus pasajeros
    están obligados a usar un casco aprobado?
  choices:
    A: De 1 a 13 años.
    B: De 5 a 16 años.
    C: De 10 a 18 años.
    D: Todas las edades están obligadas por la ley estatal.
  answer: A
  explanation: El manual establece que los ciclistas y sus pasajeros de 1 a 13 años
    deben usar un casco aprobado.
- id: 300
  category: safe_driving_rules
  question: ¿Bajo qué condición puede un ciclista llevar a un bebé menor de un año
    como pasajero?
  choices:
    A: Si el bebé está en un asiento de seguridad para bicicletas acoplado.
    B: Si el bebé lleva puesto un casco aprobado.
    C: Si el ciclista viaja en un carril designado para bicicletas.
    D: Bajo ninguna condición; va en contra de la ley.
  answer: D
  explanation: El manual establece explícitamente que un ciclista nunca debe llevar
    a un bebé menor de un año como pasajero, ya que va en contra de la ley.
- id: 301
  category: driver_responsibility
  question: Si un accidente de bicicleta causa la muerte o lesiones graves, ¿dentro
    de cuántos días debe reportarse al DMV?
  choices:
    A: 3 días.
    B: 5 días.
    C: 10 días.
    D: 30 días.
  answer: C
  explanation: Cualquier accidente de bicicleta que cause la muerte o lesiones graves
    debe reportarse al DMV dentro de los 10 días posteriores al incidente.
- id: 302
  category: vehicle_information
  question: Una bicicleta que se conduce en vías públicas debe estar equipada con
    una bocina o timbre que se pueda escuchar desde al menos ¿qué distancia?
  choices:
    A: 50 pies.
    B: 100 pies.
    C: 200 pies.
    D: 500 pies.
  answer: B
  explanation: Una bicicleta que se conduce en vías públicas debe tener frenos adecuados
    y una bocina o timbre que se pueda escuchar a una distancia de al menos 100 pies
    (30 m).
- id: 303
  category: vehicle_information
  question: ¿Qué equipo de iluminación se requiere para una bicicleta que se usa de
    noche?
  choices:
    A: Un faro delantero visible desde 100 pies hacia adelante y una luz trasera roja
      visible desde 100 pies hacia atrás.
    B: Un faro delantero visible desde 300 pies hacia adelante y una luz trasera roja
      visible desde 500 pies hacia atrás.
    C: Un faro delantero visible desde 500 pies hacia adelante y una luz trasera roja
      visible desde 300 pies hacia atrás.
    D: Solo se requieren reflectores montados en los radios de las ruedas durante
      la noche.
  answer: C
  explanation: Una bicicleta que se usa de noche debe tener un faro delantero visible
    desde al menos 500 pies hacia adelante y una luz trasera roja visible desde al
    menos 300 pies hacia atrás.
- id: 304
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor antes de girar a la derecha con el semáforo
    en rojo para evitar golpear a un ciclista?
  choices:
    A: Tocar la bocina para advertir a los ciclistas antes de girar.
    B: Detenerse por completo y mirar de izquierda a derecha, a la izquierda nuevamente
      y hacia atrás.
    C: Avanzar lentamente por la intersección mientras mira a la derecha.
    D: Ceder el paso solo a los peatones en el cruce peatonal.
  answer: B
  explanation: 'El manual indica: ''Deténgase por completo y mire de izquierda a derecha,
    a la izquierda nuevamente y hacia atrás antes de girar a la derecha en rojo''
    para evitar golpear a un ciclista que se acerque por la parte trasera derecha.'
- id: 305
  category: signs_and_signals
  question: ¿Cuál es el propósito de una 'Caja para bicicletas' (Bike Box) en la calzada?
  choices:
    A: Es un área de estacionamiento designada para bicicletas.
    B: Es un área marcada en una intersección, delante de donde se detiene el tráfico,
      para proporcionar espacio adicional a los ciclistas.
    C: Es un contenedor de almacenamiento para bicicletas compartidas de la ciudad.
    D: Es un carril exclusivo para scooters motorizados.
  answer: B
  explanation: El manual define una Caja para bicicletas (Bike Box) como 'un área
    marcada en una intersección, delante de donde se requiere que el tráfico se detenga.
    Esta área proporciona espacio adicional para los ciclistas'.
- id: 306
  category: signs_and_signals
  question: ¿Cuál es el propósito de los carriles para bicicletas pintados de verde?
  choices:
    A: Para indicar áreas donde las bicicletas están prohibidas.
    B: Para aumentar la visibilidad de los ciclistas en algunas áreas de alto tráfico.
    C: Para mostrar dónde los peatones tienen el derecho de paso sobre las bicicletas.
    D: Para marcar rutas de desvío temporales para ciclistas.
  answer: B
  explanation: El manual indica que 'los carriles para bicicletas pintados de verde
    se utilizan para aumentar la visibilidad de los ciclistas en algunas áreas de
    alto tráfico'.
- id: 307
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones sobre las motocicletas que comparten
    un carril es verdadera?
  choices:
    A: Una motocicleta puede compartir un carril con un automóvil de pasajeros.
    B: Se permite que dos motociclistas viajen uno al lado del otro en un solo carril.
    C: Los motociclistas deben viajar en fila india en todo momento.
    D: A una motocicleta no se le permite usar todo el ancho de un carril de tráfico.
  answer: B
  explanation: 'El manual indica: ''Además de usar el carril completo, se permite
    que dos motociclistas viajen uno al lado del otro en un solo carril, pero un motociclista
    no puede rebasar ni compartir un carril con otro vehículo de motor que no sea
    una motocicleta''.'
- id: 308
  category: defensive_driving
  question: ¿Cómo afecta el tamaño más pequeño de una motocicleta la percepción que
    tiene un conductor sobre ella?
  choices:
    A: Hace que la motocicleta parezca moverse más lento de lo que realmente va.
    B: Hace que sea difícil juzgar a qué distancia están o qué tan rápido van.
    C: Hace que los faros de la motocicleta parezcan más brillantes.
    D: Hace que sea más fácil determinar la posición exacta de la motocicleta en el
      carril.
  answer: B
  explanation: Según el manual, 'el tamaño más pequeño de una motocicleta hace que
    parezca estar mucho más lejos, y hace que sea difícil juzgar a qué distancia están
    o qué tan rápido van'.
- id: 309
  category: vehicle_information
  question: ¿Por qué podría estar parpadeando la señal de giro de una motocicleta
    incluso si el conductor no tiene intención de girar?
  choices:
    A: Las señales de giro de las motocicletas están diseñadas para parpadear continuamente
      por seguridad.
    B: La señal direccional en la mayoría de las motocicletas no se apaga automáticamente
      después de un giro.
    C: El conductor está indicando que está reduciendo la velocidad.
    D: La motocicleta está experimentando una falla eléctrica.
  answer: B
  explanation: El manual explica que 'en la mayoría de las motocicletas, la señal
    direccional no se apaga automáticamente después de un giro, por lo que su señal
    de giro puede estar encendida inadvertidamente cuando el motociclista no tiene
    intención de girar'.
- id: 310
  category: sharing_the_road
  question: 'Según la Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA), un porcentaje significativo de accidentes fatales de motocicleta involucran:'
  choices:
    A: Una motocicleta chocando por detrás a un camión detenido.
    B: Otro vehículo girando a la izquierda mientras la motocicleta va en línea recta
      o rebasando.
    C: Una motocicleta perdiendo el control en grava suelta.
    D: Otro vehículo girando a la derecha en rojo sin detenerse.
  answer: B
  explanation: El manual señala que en 2015, el 41 por ciento de los accidentes fatales
    de motocicleta en los EE. UU. ocurrieron con 'el otro vehículo girando a la izquierda
    mientras las motocicletas iban en línea recta, rebasando o adelantando a otros
    vehículos'.
- id: 311
  category: vehicle_information
  question: Why are motorcycle brake lights often less obvious to other motorists
    compared to car brake lights?
  choices:
    A: They flash rapidly instead of staying solid.
    B: They are mounted lower than eye level and lack a Center High Mount Stop Light.
    C: They are usually painted over to match the motorcycle's color.
    D: They only illuminate when the front brake is applied.
  answer: B
  explanation: The manual states that most cars have a 'Center High Mount Stop Light'
    at eye level, while 'Most motorcycle brake lights are mounted lower than eye level,
    which makes them less obvious to many motorists.'
- id: 312
  category: defensive_driving
  question: Why might a motorcyclist quickly change speed or lane position?
  choices:
    A: To avoid loose gravel, debris, or seams in the pavement.
    B: To communicate with other motorcyclists.
    C: To warm up their tires.
    D: To intentionally block faster-moving traffic.
  answer: A
  explanation: The manual warns that a motorcyclist 'may quickly change speed or lane
    position to avoid loose gravel, debris, seams or grooves in the pavement, sewer
    or access covers or small animals.'
- id: 313
  category: sharing_the_road
  question: What rights and responsibilities do people on bicycles have on the road?
  choices:
    A: They have the right-of-way at all times regardless of traffic signals.
    B: They have the same rights and responsibilities as people driving motor vehicles.
    C: They must always yield to motor vehicles.
    D: They are only allowed to ride on sidewalks and designated trails.
  answer: B
  explanation: 'The manual explicitly states: ''People on bicycles have the same rights
    and responsibilities as people behind the wheel of a motor vehicle.'''
- id: 314
  category: signs_and_signals
  question: What is a 2-way cycle track?
  choices:
    A: A dirt path exclusively for off-road bicycles.
    B: A shared lane where bicycles and cars travel in opposite directions.
    C: A marked bicycle lane that allows travel in both directions.
    D: A highway lane designated for motorcycles and bicycles only.
  answer: C
  explanation: The manual defines a 2-way cycle track as 'a marked bicycle lane that
    allows travel in both directions, similar to a sidewalk for pedestrians.'
- id: 315
  category: driver_responsibility
  question: How should a motor vehicle driver react when sharing the road with in-line
    skaters, skateboarders, and non-motorized scooters?
  choices:
    A: Sound the horn continuously until they move off the road.
    B: Exercise due care by being aware, alert, and driving defensively.
    C: Pass them as closely as possible to encourage them to use the sidewalk.
    D: Assume they will always yield the right-of-way to motor vehicles.
  answer: B
  explanation: The manual states that as a driver, you are responsible to 'exercise
    due care by being aware, alert, and driving defensively' around in-line skaters,
    skateboarders, and non-motorized scooters.
- id: 316
  category: safe_driving_rules
  question: What precaution should you take before getting out of a parked vehicle
    on the side of a road?
  choices:
    A: Turn on your hazard lights for at least one minute.
    B: Honk your horn to alert approaching traffic.
    C: Look for oncoming bicyclists to avoid opening your door into their path.
    D: Open the door quickly to minimize the time it is in the roadway.
  answer: C
  explanation: The manual advises drivers to 'Look before getting out of your parked
    vehicle; avoid opening your door into the path of an oncoming bicyclist.'
- id: 317
  category: vehicle_information
  question: What is a true statement regarding motorcycle headlights during the day?
  choices:
    A: They must be illuminated when driving, but they may not stand out due to other
      vehicles' daytime running lights.
    B: They are legally required to be turned off during daylight hours to save battery.
    C: They are equipped with special flashing bulbs to distinguish them from cars.
    D: They are only required to be used during inclement weather.
  answer: A
  explanation: 'The manual states: ''Headlights and taillights on motorcycles must
    be illuminated when driving. But, with so many vehicles equipped with daytime
    running lights... motorcycle headlights don’t stand out.'''
- id: 318
  category: sharing_the_road
  question: What might a motorcyclist do when approaching a railroad crossing?
  choices:
    A: Speed up to cross the tracks quickly
    B: Decrease speed and rise off the seat
    C: Swerve sharply into the oncoming lane
    D: Stop completely and walk the motorcycle across
  answer: B
  explanation: According to the manual, when approaching a railroad crossing, a motorcyclist
    may decrease speed and rise off the seat to cushion the rough crossing and change
    direction to go across the tracks at a right angle.
- id: 319
  category: sharing_the_road
  question: Why might a motorcyclist move to the center of the lane on a steel deck
    bridge?
  choices:
    A: To block faster moving traffic
    B: To adjust for an uneven surface
    C: To prepare for a U-turn
    D: To avoid the glare of oncoming headlights
  answer: B
  explanation: The manual states that on steel deck bridges, a motorcyclist may move
    to the center of the lane to adjust for the surface that is not even.
- id: 320
  category: sharing_the_road
  question: Where are Class B and C mopeds permitted to be driven on the road?
  choices:
    A: In any traffic lane
    B: Only on the shoulder of expressways
    C: Only in the right lane of traffic, as far to the right as possible
    D: In the left lane when traveling above 20 mph
  answer: C
  explanation: Class B and C mopeds can be driven only in the right lane of traffic,
    as far to the right as possible, or on the shoulder.
- id: 321
  category: safe_driving_rules
  question: ¿Se permite conducir ciclomotores en las autopistas?
  choices:
    A: Sí, pero solo en el carril derecho
    B: Sí, si son ciclomotores de Clase A
    C: No, a menos que las señales publicadas lo permitan
    D: No, bajo ninguna circunstancia
  answer: C
  explanation: Los ciclomotores no están permitidos en las autopistas u otras carreteras
    de acceso controlado a menos que las señales publicadas lo permitan.
- id: 322
  category: sharing_the_road
  question: En los accidentes fatales que involucran automóviles y camiones grandes,
    ¿quién suele contribuir a la causa del accidente?
  choices:
    A: El conductor del camión
    B: El conductor del automóvil
    C: Los peatones
    D: Los trabajadores de mantenimiento de carreteras
  answer: B
  explanation: En más del 60 por ciento de todos los accidentes fatales que involucran
    automóviles y camiones grandes, el conductor del automóvil, y no el conductor
    del camión, contribuye a la causa del accidente de tránsito.
- id: 323
  category: vehicle_information
  question: ¿Qué tan grande puede ser el punto ciego frente a un tractocamión con
    un capó largo?
  choices:
    A: 5 pies
    B: 10 pies
    C: 20 pies
    D: 50 pies
  answer: C
  explanation: Los tractocamiones con capós largos pueden tener un punto ciego de
    20 pies frente al vehículo, el cual los conductores deben evitar.
- id: 324
  category: vehicle_information
  question: ¿Por qué los camiones con remolque tardan mucho más en detenerse que los
    vehículos más pequeños?
  choices:
    A: Tienen pastillas de freno más pequeñas
    B: Retraso en el frenado causado por los frenos de aire
    C: Sus llantas tienen menos tracción
    D: Los conductores tienen tiempos de reacción más lentos
  answer: B
  explanation: Para los camiones con remolque, la diferencia en la distancia de frenado
    proviene del retraso del freno. Los frenos de aire transmiten la potencia de frenado
    del tractocamión al remolque y esto puede agregar muchos pies a la distancia que
    se necesita para detenerse.
- id: 325
  category: sharing_the_road
  question: ¿Qué maniobra suelen hacer los camiones grandes antes de ejecutar un giro
    amplio a la derecha?
  choices:
    A: Se mueven hacia la izquierda
    B: Aceleran significativamente
    C: Conducen sobre el arcén derecho
    D: Encienden sus luces de emergencia
  answer: A
  explanation: Debido a que los camiones hacen giros amplios a la derecha, se mueven
    hacia la izquierda antes de girar a la derecha. Los conductores deben prestar
    mucha atención a sus luces direccionales.
- id: 326
  category: defensive_driving
  question: ¿Por qué no debe subestimar la velocidad de un camión con remolque que
    se aproxima?
  choices:
    A: Se les permite legalmente exceder el límite de velocidad
    B: Su gran tamaño hace que parezca que se mueven más lento de lo que realmente
      van
    C: Siempre aceleran cuando se acercan a los automóviles
    D: Sus faros distorsionan su percepción de profundidad
  answer: B
  explanation: No subestime el tamaño y la velocidad de un camión con remolque que
    se aproxima. Su gran tamaño a menudo hará que parezca que se mueve a una velocidad
    más lenta de lo que realmente va.
- id: 327
  category: defensive_driving
  question: ¿Por qué debe dejar espacio adicional al detenerse detrás de un camión
    o autobús en una colina?
  choices:
    A: Los gases de escape son tóxicos a corta distancia
    B: El vehículo podría retroceder un poco al arrancar
    C: El conductor necesita espacio para abrir las puertas traseras
    D: Para permitir que los peatones crucen entre los vehículos
  answer: B
  explanation: Siempre deje espacio cuando se detenga detrás de un camión o autobús
    en un semáforo o señal de alto, especialmente cuando esté cuesta arriba. El camión
    o autobús podría retroceder un poco al arrancar.
- id: 328
  category: signs_and_signals
  question: ¿Cómo es el símbolo de "vehículo de movimiento lento"?
  choices:
    A: Un diamante amarillo
    B: Un triángulo naranja reflectante
    C: Un octágono rojo
    D: Un rectángulo blanco con letras negras
  answer: B
  explanation: El símbolo de "vehículo de movimiento lento" es un triángulo naranja
    reflectante que debe mostrarse en la parte trasera de los vehículos tirados por
    animales, la mayoría de los vehículos agrícolas y los equipos de construcción.
- id: 329
  category: safe_driving_rules
  question: ¿Cómo deben cruzar las carreteras estatales los vehículos todo terreno
    (ATV) y las motos de nieve?
  choices:
    A: Sin detenerse si el límite de velocidad es inferior a 45 mph
    B: En un ángulo de 45 grados para minimizar el tiempo en la carretera
    C: Deteniéndose, cediendo el paso y cruzando en un ángulo de 90 grados
    D: Solo en los semáforos designados
  answer: C
  explanation: Antes de que los vehículos todo terreno (ATV) y las motos de nieve
    crucen las carreteras, deben detenerse y ceder el paso al tráfico. Deben cruzar
    en un ángulo de 90 grados con respecto a la superficie de la carretera.
- id: 330
  category: sharing_the_road
  question: ¿Por dónde deben circular los jinetes a caballo en la carretera?
  choices:
    A: En el centro del carril
    B: En fila india cerca del bordillo derecho o del borde de la carretera
    C: De dos en dos en el arcén izquierdo
    D: Solo en la acera
  answer: B
  explanation: Los jinetes a caballo están sujetos a las reglas de tránsito y deben
    circular en fila india cerca del bordillo derecho o del borde de la carretera,
    o en un arcén, carril o camino derecho que se pueda utilizar.
- id: 331
  category: vehicle_information
  question: ¿Cuál es el rango de velocidad máxima para una motocicleta de uso limitado
    (ciclomotor) de Clase A?
  choices:
    A: 20 mph o menos
    B: 21 a 30 mph
    C: 31 a 40 mph
    D: 41 a 50 mph
  answer: C
  explanation: Según la tabla de la Guía de Operación de Motocicletas de Uso Limitado
    (Ciclomotores), el rango de velocidad máxima para un ciclomotor de Clase A es
    de 31 a 40 mph.
- id: 332
  category: defensive_driving
  question: ¿Qué debe hacer si un camión grande está bloqueando la calle para retroceder
    hacia un área de carga?
  choices:
    A: Tocar la bocina para alertar al conductor
    B: Pasar rápidamente muy cerca por detrás del camión
    C: Esperar pacientemente hasta que se complete la maniobra de retroceso
    D: Conducir por la acera para esquivar el camión
  answer: C
  explanation: Nunca pase muy cerca por detrás de un vehículo grande que está retrocediendo.
    Es mucho mejor esperar pacientemente hasta que el vehículo grande haya completado
    su maniobra de retroceso que intentar pasar y arriesgarse a entrar en un punto
    ciego.
- id: 333
  category: sharing_the_road
  question: ¿Qué es ilegal hacer cuando se acerca o pasa a un caballo que está siendo
    montado o camina por una calle?
  choices:
    A: Pasar al caballo a baja velocidad
    B: Tocar la bocina
    C: Dejar una gran distancia entre su vehículo y el caballo
    D: Ceder el derecho de paso
  answer: B
  explanation: El manual establece que es ilegal tocar la bocina cuando se acerca
    o pasa a un caballo.
- id: 334
  category: driver_responsibility
  question: ¿Qué tipo de infracción es abandonar la escena de un accidente de tránsito
    que involucra una fatalidad o lesiones personales?
  choices:
    A: Una infracción de tránsito menor
    B: Una sanción civil
    C: Una infracción en movimiento
    D: Un delito penal
  answer: D
  explanation: Es un delito penal abandonar la escena de un incidente que involucra
    una fatalidad o lesiones personales.
- id: 335
  category: driver_responsibility
  question: Si daña un vehículo estacionado o lesiona a un animal doméstico en un
    accidente, ¿qué debe hacer?
  choices:
    A: Dejar una nota en el parabrisas y alejarse
    B: Intentar encontrar al dueño o notificar a la policía
    C: Esperar 15 minutos y marcharse si no aparece nadie
    D: Reportarlo al DMV dentro de 30 días
  answer: B
  explanation: Si un vehículo estacionado o una propiedad distinta a un vehículo resulta
    dañada, o si un animal doméstico resulta lesionado, debe intentar encontrar al
    dueño o notificar a la policía.
- id: 336
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias debe mover a una persona lesionada en la escena
    de un accidente?
  choices:
    A: Solo si le piden ayuda para ponerse de pie
    B: Solo si se vuelve necesario debido a un incendio u otro peligro que amenace
      la vida
    C: Siempre que estén bloqueando el flujo del tráfico
    D: Inmediatamente al llegar a la escena para ponerlos cómodos
  answer: B
  explanation: No mueva a una persona lesionada a menos que se vuelva necesario debido
    a un incendio u otro peligro que amenace la vida.
- id: 337
  category: safe_driving_rules
  question: Si debe alejar a una persona lesionada de un peligro que amenaza su vida,
    ¿cómo debe jalarla?
  choices:
    A: Por los brazos
    B: Por las piernas
    C: Con la cabeza por delante
    D: De lado
  answer: C
  explanation: Sostenga la ropa con las manos y jale a la víctima con la cabeza por
    delante para alejarla del peligro, manteniendo la espalda y el cuello lo más rectos
    posible.
- id: 338
  category: safe_driving_rules
  question: ¿Qué debe hacer si hay cables tocando un vehículo en la escena de un accidente?
  choices:
    A: Usar un palo de madera para quitar los cables del vehículo
    B: Abrir las puertas para ayudar a los ocupantes a escapar rápidamente
    C: Advertir a los ocupantes que permanezcan adentro hasta que llegue ayuda
    D: Apartar los cables con guantes de trabajo pesado
  answer: C
  explanation: Si hay cables caídos, no se acerque a ellos. Si los cables tocan el
    vehículo o están cerca de él, advierta a los ocupantes que permanezcan adentro
    hasta que llegue ayuda.
- id: 339
  category: driver_responsibility
  question: Debe reportar un accidente de tránsito al DMV si involucra una fatalidad,
    lesiones personales o daños a la propiedad de cualquier persona por al menos ¿qué
    cantidad?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: También debe reportar cualquier incidente o accidente de tránsito que
    involucre $1,000 o más en daños a la propiedad de cualquier persona.
- id: 340
  category: driver_responsibility
  question: ¿Cuántos días tiene para presentar un reporte de accidente (MV-104) al
    DMV después de un accidente que deba ser reportado?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Debe presentar un reporte al DMV dentro de los 10 días posteriores
    al evento.
- id: 341
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por no reportar un accidente al DMV?
  choices:
    A: Una carta de advertencia
    B: Reentrenamiento obligatorio para conductores
    C: Suspensión o revocación de su licencia de conducir y/o registros
    D: Una marca permanente en su informe de crédito
  answer: C
  explanation: No reportar un accidente es un delito penal (delito menor) y puede
    significar la suspensión o revocación de su licencia de conducir y/o registros
    y los del propietario del vehículo.
- id: 342
  category: driver_responsibility
  question: Si el conductor está lesionado y no puede completar el informe de accidente
    requerido por el DMV, ¿quién puede hacerlo?
  choices:
    A: Solo un oficial de policía
    B: Solo el agente de seguros del conductor
    C: Un pasajero o el propietario del vehículo
    D: El médico del conductor
  answer: C
  explanation: Si el conductor está lesionado y no puede completar el informe, un
    pasajero o el propietario del vehículo puede hacerlo.
- id: 343
  category: driver_testing
  question: ¿Cuál de las siguientes funciones de los Sistemas Avanzados de Asistencia
    al Conductor (ADAS) NO se le permite usar durante su examen de manejo?
  choices:
    A: Advertencia de marcha atrás
    B: Monitor de punto ciego
    C: Estacionamiento paralelo automático
    D: Advertencia de colisión frontal
  answer: C
  explanation: Al tomar su examen de manejo, no se le permitirá usar ciertas funciones
    de seguridad, como la asistencia de estacionamiento (estacionamiento paralelo
    automático) y el control de crucero.
- id: 344
  category: vehicle_information
  question: ¿En cuál de las siguientes condiciones podrían no funcionar correctamente
    las funciones de seguridad de su vehículo (ADAS)?
  choices:
    A: En carreteras rectas y planas
    B: Durante clima despejado y soleado
    C: Con lluvia, nieve, hielo o niebla
    D: Al conducir por debajo del límite de velocidad
  answer: C
  explanation: Tenga en cuenta que las funciones de seguridad pueden no funcionar
    correctamente en ciertas condiciones como lluvia, nieve, hielo, niebla, colinas
    y curvas.
- id: 345
  category: driver_testing
  question: Según el manual, ¿cuál de las siguientes tecnologías del vehículo está
    permitido mantener activa durante un examen de manejo?
  choices:
    A: Control de crucero adaptativo
    B: Estacionamiento paralelo automático
    C: Alerta de tráfico cruzado trasero
    D: Piloto automático de conducción autónoma
  answer: C
  explanation: La alerta de tráfico cruzado trasero está incluida en los sistemas
    de advertencia permitidos para el examen. El control de crucero adaptativo y el
    estacionamiento paralelo automático no están permitidos.
- id: 346
  category: safe_driving_rules
  question: ¿Cuál es la responsabilidad del conductor al operar un vehículo equipado
    con Sistemas Avanzados de Asistencia al Conductor (ADAS)?
  choices:
    A: Depender completamente de las funciones de seguridad para evitar choques
    B: Mantenerse involucrado y siempre concentrado en la tarea de conducir
    C: Desactivar todas las funciones de seguridad antes de conducir
    D: Dejar que el vehículo se conduzca solo en las autopistas
  answer: B
  explanation: Las funciones de seguridad están diseñadas para ayudarle en la tarea
    de conducir, no están ahí para conducir el vehículo. Debe mantenerse involucrado
    y siempre concentrado en la tarea de conducir.
- id: 347
