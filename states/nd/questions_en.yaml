metadata:
  source: 2025 North Dakota Driver's Manual
  total_questions: 245
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In North Dakota, what is the minimum age an individual must reach to be
    eligible for an Instruction Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: A
  explanation: According to the North Dakota Driver's Manual, an individual must be
    at least 14 years of age to apply for an Instruction Permit.
- id: 2
  category: license_system
  question: If you are under the age of 16, how long must you hold a North Dakota
    Instruction Permit before you can apply for a restricted operator's license?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 18 months
  answer: C
  explanation: North Dakota law requires drivers under the age of 16 to hold an Instruction
    Permit for a minimum of 12 months before applying for a restricted license.
- id: 3
  category: license_system
  question: Drivers under the age of 16 with a North Dakota restricted license are
    prohibited from driving during which hours?
  choices:
    A: 11:00 PM to 6:00 AM
    B: Between sunset or 9:00 PM (whichever is later) and 5:00 AM
    C: 10:00 PM to 5:00 AM
    D: Midnight to 5:00 AM
  answer: B
  explanation: North Dakota GDL laws state that restricted license holders under 16
    may not drive between the later of sunset or 9:00 PM and 5:00 AM, with certain
    exceptions for work or school.
- id: 4
  category: license_system
  question: How many hours of supervised driving must a North Dakota permit holder
    under age 16 complete before taking the road test?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: Drivers under 16 must complete 50 hours of supervised driving in various
    conditions to qualify for their road test.
- id: 5
  category: license_system
  question: In North Dakota, your driving privileges will be suspended if you accumulate
    how many points on your driving record?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: The North Dakota point system triggers a license suspension once a
    driver reaches 12 points.
- id: 6
  category: license_system
  question: Within how many days must you notify the North Dakota DOT of a change
    of address or name?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: North Dakota law requires drivers to notify the Director of the Department
    of Transportation within 10 days of any change to their name or address.
- id: 7
  category: license_system
  question: What is the Blood Alcohol Concentration (BAC) limit for a driver under
    the age of 21 in North Dakota?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: North Dakota has a 'Zero Tolerance' policy for minors; a BAC of 0.02%
    or higher for a driver under 21 is considered a legal violation.
- id: 8
  category: license_system
  question: A North Dakota Instruction Permit holder who is 16 or 17 years old must
    hold the permit for how long before taking a road test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: While those under 16 must hold the permit for 12 months, those aged
    16 or 17 must hold it for at least 6 months.
- id: 9
  category: license_system
  question: Which of the following is a requirement for a North Dakota resident to
    obtain a 'Real ID' compliant license?
  choices:
    A: Proof of Social Security number, identity, and two proofs of North Dakota residency
    B: A written note from an employer
    C: A valid passport only
    D: Proof of 100 hours of driving experience
  answer: A
  explanation: To obtain a Real ID in ND, you must provide specific documentation
    including proof of identity, Social Security number, and two documents proving
    ND residential address.
- id: 10
  category: license_system
  question: Under North Dakota law, what is the passenger restriction for a restricted
    license holder under the age of 16?
  choices:
    A: No passengers are allowed at any time
    B: Only family members are allowed
    C: No more than one passenger who is not a family member
    D: No more than three passengers regardless of relation
  answer: C
  explanation: North Dakota GDL rules state that a restricted license holder under
    16 may not carry more than one passenger who is not a member of their immediate
    family.
- id: 11
  category: license_system
  question: In North Dakota, if you are convicted of driving without liability insurance,
    how many points are assigned to your driving record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Driving without liability insurance in North Dakota results in 6 points
    being added to the driver's record.
- id: 12
  category: license_system
  question: What is the minimum vision requirement to obtain a North Dakota driver's
    license without restrictions?
  choices:
    A: 20/20 in both eyes
    B: 20/40 in at least one eye
    C: 20/60 in both eyes
    D: 20/50 in at least one eye
  answer: B
  explanation: The North Dakota vision standard for an unrestricted license is at
    least 20/40 visual acuity in at least one eye.
- id: 13
  category: license_system
  question: 'If a parent or legal guardian signs the application for a minor''s permit
    or license in North Dakota, they may later:'
  choices:
    A: Only cancel it if the minor is convicted of a crime
    B: Request the license be cancelled at any time before the minor turns 18
    C: Not cancel the license once it is issued
    D: Only cancel it if the minor fails a grade in school
  answer: B
  explanation: The person who signs the application for a minor under 18 can submit
    a written request to the DOT to have the minor's permit or license cancelled.
- id: 14
  category: license_system
  question: How many points are assessed for failing to yield to an authorized emergency
    vehicle displaying flashing lights in North Dakota?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: D
  explanation: Failing to yield to an emergency vehicle is a serious offense in North
    Dakota and carries a penalty of 8 points.
- id: 15
  category: license_system
  question: 'A North Dakota Class D license allows you to operate a single vehicle
    with a Gross Vehicle Weight Rating (GVWR) of up to:'
  choices:
    A: 10,000 lbs
    B: 16,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: A standard Class D license in North Dakota allows the operation of
    single vehicles with a GVWR of 26,000 lbs or less.
- id: 16
  category: license_system
  question: In North Dakota, how many points can be removed from your driving record
    by completing an approved defensive driving course?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: According to the North Dakota Driver's Manual, completing an approved
    defensive driving course can reduce your point total by 3 points once every 12
    months.
- id: 17
  category: license_system
  question: A new resident to North Dakota must register their vehicle within how
    many days of establishing residency?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: New residents are required to register their vehicles and obtain North
    Dakota license plates within 90 days of establishing residency.
- id: 18
  category: license_system
  question: For drivers between the ages of 21 and 64, a North Dakota operator's license
    is typically valid for how many years?
  choices:
    A: 4 years
    B: 5 years
    C: 6 years
    D: 8 years
  answer: C
  explanation: In North Dakota, a standard operator's license for individuals aged
    21 through 64 is valid for 6 years.
- id: 19
  category: license_system
  question: In North Dakota, what is the reinstatement fee for a driver's license
    suspended for reasons other than alcohol or drug use?
  choices:
    A: 25 dollars
    B: 50 dollars
    C: 75 dollars
    D: 100 dollars
  answer: B
  explanation: The reinstatement fee for a non-alcohol related suspension in North
    Dakota is $50. Alcohol-related suspensions carry a $100 fee.
- id: 20
  category: license_system
  question: Under North Dakota's Implied Consent Law, what is the penalty for a first-time
    refusal to submit to a chemical test for alcohol concentration?
  choices:
    A: A 90-day license suspension
    B: A 180-day license suspension
    C: A 1-year license revocation
    D: A 2-year license revocation
  answer: C
  explanation: Under the Implied Consent Law, if you refuse a chemical test, your
    license will be revoked for at least one year for a first offense.
- id: 21
  category: license_system
  question: What are the minimum liability insurance requirements for property damage
    in North Dakota?
  choices:
    A: 10,000 dollars
    B: 20,000 dollars
    C: 25,000 dollars
    D: 50,000 dollars
  answer: C
  explanation: North Dakota law requires a minimum of $25,000 for property damage
    liability insurance (part of the 25/50/25 requirement).
- id: 22
  category: license_system
  question: How many points are assessed on a North Dakota driving record for a conviction
    of 'Exhibition Driving'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Exhibition driving in North Dakota results in 3 points being added
    to the driver's record.
- id: 23
  category: license_system
  question: In North Dakota, how many points are assessed for a 'Careless Driving'
    conviction?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: A conviction for careless driving in North Dakota results in 6 points
    being added to your driving record.
- id: 24
  category: license_system
  question: What is the minimum age to obtain a non-driver photo identification card
    in North Dakota?
  choices:
    A: There is no minimum age
    B: 12 years old
    C: 14 years old
    D: 16 years old
  answer: A
  explanation: North Dakota does not have a minimum age requirement for a non-driver
    photo identification card.
- id: 25
  category: license_system
  question: If you do not have any traffic violations, how many points are removed
    from your North Dakota driving record for every three-month period of violation-free
    driving?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: All points are removed after 6 months
  answer: A
  explanation: North Dakota law states that 1 point is removed from a driver's record
    for every three-month period in which no points are recorded.
- id: 26
  category: license_system
  question: In North Dakota, how many points are assessed for 'Leaving the Scene of
    an Accident' involving property damage?
  choices:
    A: 3 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Leaving the scene of an accident involving property damage results
    in 6 points being added to your North Dakota driving record.
- id: 27
  category: license_system
  question: At what time of day does a North Dakota driver's license expire on the
    expiration date?
  choices:
    A: Noon
    B: 5:00 PM
    C: 9:00 PM
    D: Midnight
  answer: D
  explanation: A North Dakota driver's license expires at midnight on the expiration
    date, which is typically the driver's birthday.
- id: 28
  category: license_system
  question: What is the fee for a duplicate North Dakota driver's license if yours
    is lost or stolen?
  choices:
    A: 5 dollars
    B: 8 dollars
    C: 15 dollars
    D: 20 dollars
  answer: B
  explanation: The fee for a duplicate driver's license in North Dakota is $8.
- id: 29
  category: license_system
  question: To obtain a North Dakota Class M (Motorcycle) learner's permit, an applicant
    must be at least what age?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: A
  explanation: In North Dakota, an individual must be at least 14 years old to apply
    for a motorcycle learner's permit.
- id: 30
  category: driver_testing
  question: In North Dakota, what is the maximum speed limit on rural unpaved (gravel)
    roads unless otherwise posted?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: According to the North Dakota Driver's Manual, the speed limit on rural
    unpaved roads is 55 mph unless otherwise posted.
- id: 31
  category: driver_testing
  question: When preparing to turn, North Dakota law requires you to signal your intent
    at least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: North Dakota law requires drivers to use a turn signal for at least
    100 feet before making a turn or changing lanes.
- id: 32
  category: driver_testing
  question: In North Dakota, it is illegal to park your vehicle within how many feet
    of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: North Dakota law prohibits parking within 10 feet of a fire hydrant.
- id: 33
  category: driver_testing
  question: When parking near an intersection, you must not park within how many feet
    of a crosswalk?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Under North Dakota law, you are prohibited from parking within 20 feet
    of a crosswalk at an intersection.
- id: 34
  category: driver_testing
  question: What is the standard fine for a driver convicted of a texting while driving
    violation in North Dakota?
  choices:
    A: $20
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: In North Dakota, the fine for texting while driving is $100 for all
    drivers.
- id: 35
  category: driver_testing
  question: How many points are assessed against your North Dakota driving record
    for failing to stop at a stop sign?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: According to the North Dakota point system, failing to stop at a stop
    sign results in 2 points being added to your driving record.
- id: 36
  category: driver_testing
  question: When driving at night in North Dakota, you must dim your high beam headlights
    when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: North Dakota law requires you to dim your high beams when you are within
    500 feet of an oncoming vehicle.
- id: 37
  category: driver_testing
  question: In North Dakota, children must be properly secured in a child restraint
    system (car seat or booster) until they reach what age, unless they are 4'9" or
    taller?
  choices:
    A: 5 years old
    B: 6 years old
    C: 7 years old
    D: 8 years old
  answer: D
  explanation: North Dakota law requires children under 8 years of age to be in an
    approved child restraint system, unless the child is at least 4 feet 9 inches
    tall.
- id: 38
  category: driver_testing
  question: You may not pass another vehicle on the left when you are within how many
    feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: North Dakota law prohibits passing on the left side of the road when
    approaching within 100 feet of an intersection or railroad crossing.
- id: 39
  category: driver_testing
  question: 'For a first DUI offense in North Dakota with a BAC between 0.08% and
    0.17%, the mandatory minimum fine is:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: B
  explanation: For a first DUI conviction with a BAC of 0.08% to 0.17%, North Dakota
    law mandates a minimum fine of $250, a 91-day license suspension, and an addiction
    evaluation.
- id: 40
  category: driver_testing
  question: Unless otherwise posted, what is the speed limit in a North Dakota school
    zone when children are present?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The North Dakota Driver's Manual states the speed limit in school zones
    is 20 mph unless otherwise posted.
- id: 41
  category: driver_testing
  question: When taking the North Dakota road test, who is responsible for providing
    the vehicle used for the test?
  choices:
    A: The DOT examiner
    B: The local police department
    C: The applicant
    D: The driving school only
  answer: C
  explanation: Applicants for a North Dakota driver's license must provide their own
    vehicle for the road test, and it must be in safe operating condition.
- id: 42
  category: driver_testing
  question: 'In North Dakota, you must immediately report a crash to law enforcement
    if it results in injury, death, or property damage of at least:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $4,000
  answer: D
  explanation: North Dakota law (NDCC 39-08-09) requires immediate notice to law enforcement
    if a crash results in injury, death, or total property damage of $4,000 or more.
- id: 43
  category: driver_testing
  question: If you are caught speeding 21 to 25 mph over the limit on a highway in
    North Dakota, how many points will be added to your record?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Under the North Dakota point system, speeding 21-25 mph over the limit
    results in 3 points.
- id: 44
  category: driver_testing
  question: According to the North Dakota Driver's Manual, at what speed can hydroplaning
    (tires losing contact with the road on water) begin?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The manual states that hydroplaning can begin at speeds as low as 35
    mph, and in a severe rainstorm, tires can lose all contact with the road at 55
    mph.
- id: 45
  category: driver_testing
  question: What is the speed limit on North Dakota rural Interstate highways for
    passenger vehicles?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: The maximum speed limit on rural Interstate highways in North Dakota
    is 75 mph for passenger vehicles.
- id: 46
  category: driver_testing
  question: How many points are assessed against your North Dakota driving record
    for passing a school bus that has its red lights flashing?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Passing a school bus while its red lights are flashing is a serious
    offense in North Dakota and results in 6 points being added to your driving record.
- id: 47
  category: driver_testing
  question: In North Dakota, you are prohibited from parking within how many feet
    of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: North Dakota law prohibits parking a vehicle within 10 feet of a fire
    hydrant.
- id: 48
  category: driver_testing
  question: 'In North Dakota, you must dim your headlights to low beams when following
    another vehicle within a distance of:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: When following another vehicle, you must dim your headlights to low
    beams when you are within 300 feet of the vehicle ahead.
- id: 49
  category: driver_testing
  question: Before making a turn in North Dakota, you must signal your intention continuously
    for at least how many feet?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: North Dakota law requires drivers to signal at least 100 feet before
    turning or changing lanes.
- id: 50
  category: driver_testing
  question: In North Dakota, what is the minimum fee for speeding in a highway construction
    zone when workers are present?
  choices:
    A: No minimum, standard fines apply
    B: $40
    C: $80
    D: $100
  answer: D
  explanation: According to North Dakota Century Code, the minimum fine for speeding
    in a construction zone when workers are present is $100.
- id: 51
  category: driver_testing
  question: Which of the following violations results in 24 points and immediate license
    revocation in North Dakota?
  choices:
    A: DUI (First offense)
    B: Fleeing or attempting to elude a peace officer
    C: Driving under suspension
    D: Leaving the scene of an accident involving property damage
  answer: B
  explanation: Fleeing or attempting to elude a peace officer is a major violation
    in North Dakota that carries a 24-point penalty, leading to immediate revocation.
- id: 52
  category: driver_testing
  question: 'To maintain a safe following distance behind the vehicle in front of
    you, the North Dakota Driver''s Manual recommends using the:'
  choices:
    A: One-car-length rule
    B: Two-second rule
    C: Three-second rule
    D: Four-second rule
  answer: C
  explanation: North Dakota recommends a following distance of at least three seconds
    under ideal driving conditions.
- id: 53
  category: driver_responsibility
  question: When you purchase a vehicle in North Dakota, you must apply for a new
    title in your name within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Under North Dakota law, a vehicle title must be transferred to the
    new owner within 30 days of the date of purchase to avoid late fees and ensure
    proper registration.
- id: 54
  category: driver_responsibility
  question: If you are required to file an SR-22 (Proof of Financial Responsibility)
    due to a conviction for driving without insurance in North Dakota, how long must
    you typically maintain it?
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: 5 years
  answer: B
  explanation: In North Dakota, if your license is suspended for a lack of liability
    insurance, you are generally required to file and maintain an SR-22 for a period
    of one year.
- id: 55
  category: driver_responsibility
  question: Under North Dakota law, what is the mandatory fine for littering on a
    public highway from a motor vehicle?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: North Dakota Century Code 39-10-59 states that a person who violates
    the littering laws from a vehicle is guilty of an infraction and must be assessed
    a fine of $100.
- id: 56
  category: driver_responsibility
  question: North Dakota's 'Open Container' law prohibits the possession of an open
    alcoholic beverage container in which part of the vehicle?
  choices:
    A: Only the driver's seat
    B: The trunk only
    C: The passenger area
    D: Behind the rear seat of a hatchback
  answer: C
  explanation: North Dakota law prohibits any person from having an open container
    of an alcoholic beverage in the passenger area of a motor vehicle while on a public
    highway.
- id: 57
  category: driver_responsibility
  question: How does North Dakota determine the month in which your vehicle registration
    must be renewed?
  choices:
    A: The month the vehicle was purchased
    B: The owner's birth month
    C: A staggered system based on the first letter of the owner's last name
    D: All registrations expire in December
  answer: C
  explanation: North Dakota uses a staggered registration system where the renewal
    month is determined by the first letter of the owner's last name or the first
    letter of a company's name.
- id: 58
  category: driver_responsibility
  question: North Dakota is a 'No-Fault' insurance state. This means your insurance
    policy must include which of the following coverages?
  choices:
    A: Comprehensive coverage
    B: Personal Injury Protection (PIP)
    C: Gap insurance
    D: Towing and labor coverage
  answer: B
  explanation: As a no-fault state, North Dakota requires Personal Injury Protection
    (PIP) coverage, which pays for medical expenses and lost wages for the insured
    regardless of who was at fault in the accident.
- id: 59
  category: driver_responsibility
  question: Unless specifically exempted, how many license plates are required to
    be displayed on a motor vehicle registered in North Dakota?
  choices:
    A: One plate, displayed on the rear
    B: One plate, displayed on the front
    C: Two plates, one on the front and one on the rear
    D: Two plates, both on the rear
  answer: C
  explanation: 'North Dakota law requires most motor vehicles to display two license
    plates: one on the front and one on the rear of the vehicle.'
- id: 60
  category: driver_responsibility
  question: 'If you collide with an unattended vehicle in North Dakota and cannot
    find the owner, you must:'
  choices:
    A: Wait at the scene for at least two hours
    B: Leave a written notice in a conspicuous place on the vehicle
    C: Drive away if the damage is less than $1,000
    D: Report it only if someone was watching
  answer: B
  explanation: If you hit an unattended vehicle, you must stop and either locate the
    owner or leave a written notice providing your name, address, and the registration
    number of your vehicle.
- id: 61
  category: driver_responsibility
  question: Under the North Dakota Financial Responsibility Law, if you are in an
    accident and do not have insurance, what may you be required to do to avoid license
    suspension?
  choices:
    A: Pay a $50 fine
    B: Perform 40 hours of community service
    C: Deposit a security (cash or bond) to cover potential damages
    D: Retake the written driving test
  answer: C
  explanation: If an uninsured driver is involved in an accident, the Financial Responsibility
    Law may require them to deposit security in an amount determined by the DOT to
    satisfy any judgment for damages resulting from the accident.
- id: 62
  category: driver_responsibility
  question: What is the point penalty in North Dakota for fleeing or attempting to
    elude a peace officer in a motor vehicle?
  choices:
    A: 12 points
    B: 15 points
    C: 20 points
    D: 24 points
  answer: D
  explanation: Fleeing or attempting to elude a peace officer is a major violation
    in North Dakota and results in 24 points, which triggers an immediate license
    revocation.
- id: 63
  category: driver_responsibility
  question: 'In North Dakota, you must immediately report a motor vehicle accident
    to the appropriate law enforcement agency if the total property damage to any
    one person''s property appears to exceed:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $4,000
  answer: D
  explanation: According to North Dakota law, accidents involving death, personal
    injury, or property damage of $4,000 or more must be reported immediately to the
    police, county sheriff, or state highway patrol.
- id: 64
  category: driver_responsibility
  question: What are the minimum liability insurance requirements for bodily injury
    or death of one person in a single accident in North Dakota?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: North Dakota law requires a minimum of $25,000 for bodily injury or
    death of one person in any one accident.
- id: 65
  category: driver_responsibility
  question: 'North Dakota is a ''no-fault'' insurance state. This means that in the
    event of an accident:'
  choices:
    A: No one is ever held responsible for damages.
    B: Your own insurance company pays for your medical expenses regardless of who
      caused the accident.
    C: The state pays for all damages from a dedicated fund.
    D: Drivers are not required to carry liability insurance.
  answer: B
  explanation: North Dakota's no-fault system requires Personal Injury Protection
    (PIP) coverage, which pays for your own medical expenses and certain other costs
    regardless of who was at fault.
- id: 66
  category: driver_responsibility
  question: When an accident occurs and a police report is not filed, how many days
    do you have to file a written report with the North Dakota Department of Transportation
    if the damage exceeds $4,000?
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: If a law enforcement officer does not investigate the accident, the
    driver must file a report with the DOT within 10 days if there is injury, death,
    or damage exceeding $4,000.
- id: 67
  category: driver_responsibility
  question: In North Dakota, what happens to the license plates when you sell your
    vehicle to another individual?
  choices:
    A: They must remain on the vehicle for the new owner.
    B: They should be removed and kept by the seller.
    C: They must be destroyed immediately.
    D: They must be turned in to the local police department.
  answer: B
  explanation: In North Dakota, license plates are the property of the owner, not
    the vehicle. When you sell a vehicle, you should remove the plates.
- id: 68
  category: driver_responsibility
  question: Under North Dakota law, which of the following is true regarding the 'Open
    Container' law?
  choices:
    A: It only applies to the driver.
    B: It is legal if the container is in the glove box.
    C: It is illegal for any person in a vehicle on a public highway to possess an
      open alcoholic beverage container.
    D: It only applies to drivers under the age of 21.
  answer: C
  explanation: North Dakota law prohibits any person (driver or passenger) from having
    an open container of an alcoholic beverage in the passenger compartment of a motor
    vehicle on a public highway.
- id: 69
  category: driver_responsibility
  question: What is the standard fine for littering on a highway or public property
    in North Dakota?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: According to North Dakota Century Code, the fine for littering on a
    highway is $100.
- id: 70
  category: driver_responsibility
  question: 'In North Dakota, if you are involved in an accident with an unattended
    vehicle, you must:'
  choices:
    A: Wait for the owner to return, regardless of how long it takes.
    B: Leave the scene if the damage is less than $1,000.
    C: Leave a notice in a conspicuous place on the vehicle and notify the police.
    D: Only notify the police if the owner cannot be found within 48 hours.
  answer: C
  explanation: If you hit an unattended vehicle, you must notify the owner or leave
    a written notice with your name, address, and an explanation, then notify the
    police.
- id: 71
  category: driver_responsibility
  question: Which of the following is a requirement for the North Dakota 'Move Over'
    law when approaching a stationary emergency vehicle with flashing lights?
  choices:
    A: You must stop completely before passing.
    B: You must move to a lane not adjacent to the vehicle if possible, or slow down
      significantly.
    C: You must speed up to clear the area quickly.
    D: The law only applies to ambulances, not tow trucks.
  answer: B
  explanation: North Dakota's 'Move Over' law requires drivers to move to a lane not
    adjacent to the emergency vehicle (including tow trucks and maintenance vehicles)
    or slow down to a safe speed if a lane change is not possible.
- id: 72
  category: safe_driving_rules
  question: How many feet must you park away from a fire hydrant in North Dakota?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: A
  explanation: North Dakota law prohibits parking within 10 feet of a fire hydrant.
- id: 73
  category: safe_driving_rules
  question: 'When approaching an oncoming vehicle at night, North Dakota law requires
    you to dim your high beams within:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: You must dim your headlights to low beams when an oncoming vehicle
    is within 500 feet.
- id: 74
  category: safe_driving_rules
  question: When a school bus is stopped with red lights flashing and the stop arm
    extended on a highway with a physical median or barrier, do vehicles traveling
    in the opposite direction need to stop?
  choices:
    A: Yes, they must always stop.
    B: No, they are not required to stop.
    C: Yes, but only if there are more than two lanes.
    D: No, but they must slow down to 15 mph.
  answer: B
  explanation: In North Dakota, the driver of a vehicle on a highway with separate
    roadways (divided by a physical barrier or median) does not need to stop when
    meeting or passing a school bus that is on a different roadway.
- id: 75
  category: safe_driving_rules
  question: When entering a roundabout in North Dakota, who has the right-of-way?
  choices:
    A: The vehicle entering the roundabout.
    B: The vehicle on the right.
    C: The vehicle already in the circle.
    D: The vehicle traveling at the highest speed.
  answer: C
  explanation: In a roundabout, drivers must yield the right-of-way to traffic already
    circulating within the circle.
- id: 76
  category: safe_driving_rules
  question: According to the North Dakota Driver's Manual, at what speed can hydroplaning
    begin in heavy rain?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Hydroplaning (where tires lose contact with the road and ride on a
    film of water) can begin at speeds as low as 35 mph.
- id: 77
  category: safe_driving_rules
  question: 'On a multi-lane highway, North Dakota''s ''Move Over'' law requires drivers
    approaching a stationary emergency vehicle with flashing lights to:'
  choices:
    A: Stop completely before passing.
    B: Move to a lane that is not adjacent to the emergency vehicle, if safe to do
      so.
    C: Maintain speed but honk to alert the emergency workers.
    D: Speed up to clear the area quickly.
  answer: B
  explanation: North Dakota law requires drivers to move into a lane not adjacent
    to the stationary emergency vehicle if the highway has at least two lanes in the
    same direction and it is safe to do so.
- id: 78
  category: safe_driving_rules
  question: 'In North Dakota, U-turns are prohibited on a curve or near the crest
    of a hill if the vehicle cannot be seen by other drivers within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: U-turns are illegal in North Dakota on any curve or hill where the
    vehicle cannot be seen by the driver of any other vehicle approaching from either
    direction within 500 feet.
- id: 79
  category: safe_driving_rules
  question: When parking your vehicle near a fire hydrant in North Dakota, what is
    the minimum distance you must maintain?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: North Dakota law prohibits parking a vehicle within 10 feet of a fire
    hydrant.
- id: 80
  category: safe_driving_rules
  question: When approaching a school bus from either direction that has its red lights
    flashing and stop arm extended, how far away must you stop your vehicle?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: C
  explanation: In North Dakota, drivers must stop at least 20 feet from a school bus
    displaying flashing red lights or an extended stop arm.
- id: 81
  category: safe_driving_rules
  question: What is the minimum distance you must park your vehicle from a stop sign,
    yield sign, or traffic control signal?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: North Dakota law states you cannot park within 15 feet of a stop sign,
    yield sign, or traffic control signal.
- id: 82
  category: safe_driving_rules
  question: At an uncontrolled intersection where two vehicles arrive at the same
    time, which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver on the more heavily traveled road
    D: The driver traveling at the higher speed
  answer: B
  explanation: At uncontrolled intersections in North Dakota, the driver of the vehicle
    on the left must yield the right-of-way to the vehicle on the right.
- id: 83
  category: safe_driving_rules
  question: When entering a roundabout in North Dakota, whom must you yield to?
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; you have the right-of-way
    D: Only pedestrians, not other vehicles
  answer: B
  explanation: Drivers entering a roundabout must yield the right-of-way to traffic
    already circulating within the roundabout.
- id: 84
  category: safe_driving_rules
  question: When parking your vehicle headed uphill on a two-way street with a curb,
    how should you turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    so that if the vehicle rolls, it will hit the curb and stop.
- id: 85
  category: safe_driving_rules
  question: 'According to North Dakota''s ''Move Over'' law, if you are on a multi-lane
    highway and approach a stationary emergency vehicle with flashing lights, you
    must:'
  choices:
    A: Stop immediately in your lane
    B: Speed up to pass quickly
    C: Move to a lane that is not adjacent to the emergency vehicle if safe to do
      so
    D: Maintain your speed and lane
  answer: C
  explanation: The 'Move Over' law requires drivers to move to a lane not adjacent
    to the stationary emergency vehicle on multi-lane highways, or slow down significantly
    if changing lanes is unsafe.
- id: 86
  category: defensive_driving
  question: According to the North Dakota Driver's Manual, what is the recommended
    following distance behind the vehicle in front of you under normal driving conditions?
  choices:
    A: One car length for every 10 mph
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: C
  explanation: North Dakota recommends using the 'three-second rule' to maintain a
    safe following distance under normal weather and road conditions.
- id: 87
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, North Dakota
    law and safety guidelines suggest scanning the road how far ahead?
  choices:
    A: 5 to 8 seconds
    B: 10 to 12 seconds
    C: 20 to 25 seconds
    D: 30 seconds
  answer: B
  explanation: The North Dakota Driver's Manual states that drivers should look about
    10 to 12 seconds ahead of their vehicle to identify potential hazards early.
- id: 88
  category: defensive_driving
  question: At what speed can hydroplaning begin to occur on wet North Dakota roads,
    causing tires to lose contact with the pavement?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Exactly 45 mph
    D: Only during heavy thunderstorms
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 55 mph.
- id: 89
  category: defensive_driving
  question: In North Dakota, how many points are assessed against your driving record
    for the offense of 'Following too closely'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: According to the North Dakota point system, 'Following too closely'
    results in 2 points being added to the driver's record.
- id: 90
  category: defensive_driving
  question: If you are driving in North Dakota and experience a tire blowout, what
    is the correct defensive driving response?
  choices:
    A: Brake hard immediately to stop the vehicle
    B: Shift into neutral and turn off the engine
    C: Hold the steering wheel tightly and keep the vehicle going straight
    D: Quickly steer toward the shoulder while braking
  answer: C
  explanation: If a tire blows out, you should hold the steering wheel tightly, keep
    the vehicle straight, and gradually slow down by taking your foot off the gas
    pedal.
- id: 91
  category: defensive_driving
  question: 'In North Dakota, you are required to have your headlights turned on when
    visibility is less than:'
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: B
  explanation: North Dakota law requires headlights to be on from sunset to sunrise,
    and at any other time when visibility is less than 1,000 feet.
- id: 92
  category: defensive_driving
  question: When driving in heavy fog in North Dakota, which lights should you use
    to maintain the best visibility?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard flashers
  answer: B
  explanation: Low beams should be used in fog because the light from high beams reflects
    off the water droplets, actually decreasing visibility.
- id: 93
  category: defensive_driving
  question: How many points are assessed for 'Failure to dim headlights' when meeting
    or following another vehicle in North Dakota?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: No points, just a fine
  answer: A
  explanation: Failure to dim headlights in North Dakota carries a penalty of 1 point
    on the driver's license record.
- id: 94
  category: defensive_driving
  question: 'In North Dakota, if your vehicle is equipped with Anti-lock Braking System
    (ABS) and you need to stop quickly in an emergency, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, continuous pressure to the brake pedal
    C: Lightly tap the brakes to avoid locking
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. Do not pump the brakes,
    as this will deactivate the ABS system's effectiveness.
- id: 95
  category: defensive_driving
  question: 'According to the North Dakota Driver''s Manual, when you are being passed
    by another vehicle, you should:'
  choices:
    A: Speed up to prevent them from merging too close
    B: Move to the left side of your lane
    C: Stay in your lane and keep a steady speed
    D: Turn on your high beams to help them see
  answer: C
  explanation: When being passed, you should maintain a steady speed and keep to the
    right to allow the other driver to pass safely.
- id: 96
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, North Dakota
    drivers should look ahead at least how many seconds?
  choices:
    A: 3 to 5 seconds
    B: 5 to 8 seconds
    C: 10 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Scanning the road 10 to 15 seconds ahead allows you to see hazards
    early and adjust your speed or position safely.
- id: 97
  category: defensive_driving
  question: 'In North Dakota, headlights must be used from sunset to sunrise and whenever
    visibility is less than:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 1,000 feet
    D: 2,000 feet
  answer: C
  explanation: North Dakota law requires headlights to be on during the period from
    sunset to sunrise and at any other time when visibility is less than 1,000 feet.
- id: 98
  category: defensive_driving
  question: At what speed can hydroplaning begin in heavy rain as tires lose contact
    with the road surface?
  choices:
    A: 25 mph
    B: 35 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph in heavy rain, and
    at 55 mph, tires may lose all contact with the road.
- id: 99
  category: defensive_driving
  question: If you are stranded in a blizzard in North Dakota, the manual recommends
    you only run your engine for about how many minutes each hour for heat?
  choices:
    A: 5 minutes
    B: 10 minutes
    C: 20 minutes
    D: 30 minutes
  answer: B
  explanation: To conserve fuel and prevent carbon monoxide poisoning while stranded
    in snow, run the engine for only about 10 minutes every hour.
- id: 100
  category: defensive_driving
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended on a two-lane road, North Dakota drivers must stop at least how many
    feet from the bus?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: C
  explanation: North Dakota law requires drivers to stop at least 20 feet from a school
    bus that has its red lights flashing and stop arm extended.
- id: 101
  category: defensive_driving
  question: When parking your vehicle uphill next to a curb in North Dakota, which
    way should you turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    so that if the vehicle rolls, the back of the front tire will hit the curb and
    stop.
- id: 102
  category: defensive_driving
  question: Large commercial trucks have 'No-Zones.' Where are these zones located?
  choices:
    A: Only directly behind the truck
    B: Only on the left side of the truck
    C: Directly in front, behind, and on either side of the truck
    D: Only in the front of the truck
  answer: C
  explanation: The 'No-Zone' refers to the large blind spots around a truck where
    the driver cannot see other vehicles; these are located in front, behind, and
    on both sides.
- id: 103
  category: defensive_driving
  question: 'When driving on snow or ice in North Dakota, your following distance
    should be increased to at least:'
  choices:
    A: 3 seconds
    B: 4 seconds
    C: 6 to 8 seconds
    D: 15 seconds
  answer: C
  explanation: Because stopping distances are significantly increased on slippery
    surfaces, the North Dakota manual suggests increasing following distance to 6-8
    seconds or more.
- id: 104
  category: alcohol_drugs_health
  question: 'In North Dakota, an adult driver (21 or older) is considered to be driving
    under the influence if their Blood Alcohol Concentration (BAC) is at or above:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: For drivers age 21 and older in North Dakota, the legal limit for Blood
    Alcohol Concentration (BAC) is 0.08%.
- id: 105
  category: alcohol_drugs_health
  question: 'Under North Dakota law, a ''high-level'' or ''aggravated'' DUI is defined
    as operating a motor vehicle with a BAC of at least:'
  choices:
    A: 0.12%
    B: 0.15%
    C: 0.16%
    D: 0.20%
  answer: C
  explanation: North Dakota law imposes harsher penalties for an 'aggravated' DUI,
    which is defined as having a BAC of 0.16% or higher.
- id: 106
  category: alcohol_drugs_health
  question: In North Dakota, what is the penalty for a first DUI offense if the driver's
    BAC is between 0.08% and 0.15%?
  choices:
    A: A 30-day license suspension and a $100 fine
    B: A 91-day license suspension and a $500 fine
    C: A 180-day license suspension and a $750 fine
    D: A 1-year license suspension and mandatory jail time
  answer: B
  explanation: For a first DUI offense with a BAC between 0.08% and 0.15%, North Dakota
    law mandates a $500 fine and a 91-day license suspension.
- id: 107
  category: alcohol_drugs_health
  question: If a North Dakota driver is convicted of a first-offense DUI with a BAC
    of 0.16% or greater, what is the mandatory minimum jail sentence?
  choices:
    A: No mandatory jail time
    B: 2 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: A first DUI offense with a BAC of 0.16% or higher (aggravated) carries
    a mandatory minimum of 2 days in jail and a $750 fine.
- id: 108
  category: alcohol_drugs_health
  question: 'North Dakota''s ''Actual Physical Control'' law means you can be arrested
    for DUI even if:'
  choices:
    A: You are sleeping in the vehicle with the keys in your possession
    B: You are standing next to the vehicle
    C: You are the passenger in the vehicle
    D: You have not consumed any alcohol
  answer: A
  explanation: In North Dakota, you can be charged with being in 'actual physical
    control' of a vehicle while under the influence, even if the vehicle is not in
    motion, if you have the ability to operate it (e.g., sitting in the driver's seat
    with the keys).
- id: 109
  category: alcohol_drugs_health
  question: What is the maximum BAC limit for a person operating a commercial motor
    vehicle in North Dakota?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Commercial driver's license (CDL) holders are subject to a stricter
    BAC limit of 0.04% while operating a commercial vehicle.
- id: 110
  category: alcohol_drugs_health
  question: 'Under North Dakota''s ''Open Container'' law, it is illegal to possess
    an open bottle or receptacle containing alcoholic beverages in:'
  choices:
    A: The trunk only
    B: The glove compartment only
    C: The passenger area of any motor vehicle on a public highway
    D: The bed of a pickup truck only
  answer: C
  explanation: North Dakota law prohibits any person from having an open container
    of an alcoholic beverage in the passenger area of a motor vehicle while on a public
    highway or in an area used by the public.
- id: 111
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and it impairs your driving, can
    you be charged with a DUI in North Dakota?
  choices:
    A: No, as long as you have a valid prescription
    B: No, DUI laws only apply to alcohol and illegal drugs
    C: Yes, it is illegal to drive under the influence of any drug that renders you
      incapable of safe driving
    D: Only if you also consumed alcohol
  answer: C
  explanation: North Dakota law states it is illegal to drive under the influence
    of any drug, including prescription or over-the-counter medications, if they impair
    your ability to drive safely.
- id: 112
  category: alcohol_drugs_health
  question: In North Dakota, what is the mandatory license suspension period for a
    second DUI offense within a seven-year period (with a BAC below 0.16%)?
  choices:
    A: 180 days
    B: 365 days
    C: 2 years
    D: 5 years
  answer: B
  explanation: A second DUI conviction within seven years results in a 365-day (one
    year) license suspension if the BAC was below 0.16%.
- id: 113
  category: alcohol_drugs_health
  question: When consuming alcohol, which of the following is typically the first
    ability to be impaired?
  choices:
    A: Vision
    B: Muscle coordination
    C: Judgment
    D: Hearing
  answer: C
  explanation: Judgment is the first function affected by alcohol. Drivers may take
    risks they otherwise wouldn't and may not realize they are becoming impaired.
- id: 114
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in the context of driving safety?
  choices:
    A: The effect of alcohol wearing off over time
    B: The combined effect of alcohol and another drug being greater than the sum
      of their individual effects
    C: The body's ability to process one drink per hour
    D: The improved vision caused by low doses of stimulants
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs (legal or illegal)
    are mixed, causing a much more severe level of impairment than either substance
    would cause alone.
- id: 115
  category: alcohol_drugs_health
  question: 'In North Dakota, if you are under 21 and convicted of ''Minor in Possession''
    or ''Minor in Consumption'' of alcohol, your driver''s license will be:'
  choices:
    A: Suspended for 30 days for a first offense
    B: Suspended for 180 days for a first offense
    C: Revoked until you turn 21
    D: Not affected unless you were driving
  answer: B
  explanation: North Dakota has strict laws for minors; a first offense of Minor in
    Possession/Consumption results in a 180-day license suspension, even if the minor
    was not operating a vehicle.
- id: 116
  category: alcohol_drugs_health
  question: 'Every person convicted of a DUI in North Dakota is required by law to
    undergo:'
  choices:
    A: A new road test
    B: An addiction evaluation
    C: A high school equivalency exam
    D: A vision screening every month for a year
  answer: B
  explanation: North Dakota law requires all DUI offenders to undergo an addiction
    evaluation by a licensed facility to determine the extent of their alcohol or
    drug use.
- id: 117
  category: alcohol_drugs_health
  question: How does alcohol affect a driver's peripheral vision?
  choices:
    A: It improves it by making the driver more alert
    B: It has no effect on peripheral vision
    C: It narrows the field of vision, leading to 'tunnel vision'
    D: It makes peripheral objects appear closer than they are
  answer: C
  explanation: Alcohol consumption narrows a driver's side (peripheral) vision, which
    is often referred to as 'tunnel vision,' making it harder to see hazards from
    the sides.
- id: 118
  category: alcohol_drugs_health
  question: If you have a medical condition such as epilepsy that causes a loss of
    consciousness, North Dakota law requires you to be seizure-free for how long before
    you can legally drive?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 1 year
  answer: C
  explanation: In North Dakota, individuals with conditions causing loss of consciousness
    (like epilepsy) must generally be seizure-free for 6 months and provide a medical
    evaluation to be eligible for a license.
- id: 119
  category: alcohol_drugs_health
  question: In North Dakota, what is the length of license suspension for a first-time
    DUI offense with a Blood Alcohol Concentration (BAC) between 0.08% and 0.17%?
  choices:
    A: 30 days
    B: 60 days
    C: 91 days
    D: 180 days
  answer: C
  explanation: For a first DUI offense in North Dakota with a BAC between 0.08% and
    0.17%, the driver's license is suspended for 91 days.
- id: 120
  category: alcohol_drugs_health
  question: Under North Dakota law, a driver is considered to be 'Aggravated DUI'
    if their Blood Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: 0.10%
    B: 0.15%
    C: 0.16%
    D: 0.20%
  answer: C
  explanation: North Dakota defines an 'Aggravated DUI' as operating a vehicle with
    a BAC of 0.16% or greater, which carries harsher penalties than a standard DUI.
- id: 121
  category: alcohol_drugs_health
  question: If a North Dakota driver is convicted of a second DUI offense within a
    7-year period and their BAC was below 0.18%, how long will their license be suspended?
  choices:
    A: 180 days
    B: 365 days
    C: 2 years
    D: 3 years
  answer: B
  explanation: A second DUI offense within 7 years results in a 365-day suspension
    if the BAC was below 0.18%.
- id: 122
  category: alcohol_drugs_health
  question: In North Dakota, what is the minimum fine for a first-offense DUI with
    a BAC of 0.16% or greater?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: For a first offense with a BAC of 0.16% or higher (Aggravated DUI),
    North Dakota law mandates a minimum fine of $750.
- id: 123
  category: alcohol_drugs_health
  question: According to the North Dakota Driver's Manual, what is the first thing
    affected after drinking alcohol?
  choices:
    A: Vision
    B: Coordination
    C: Judgment
    D: Reaction time
  answer: C
  explanation: Alcohol affects a person's judgment and reasoning abilities first,
    which are critical for safe driving.
- id: 124
  category: alcohol_drugs_health
  question: In North Dakota, anyone convicted of a DUI is required to undergo which
    of the following before their license can be reinstated?
  choices:
    A: A new road test
    B: An addiction evaluation
    C: A high school diploma check
    D: A physical fitness test
  answer: B
  explanation: North Dakota law requires all individuals convicted of a DUI to complete
    an addiction evaluation by a licensed facility.
- id: 125
  category: alcohol_drugs_health
  question: Under North Dakota law, a driver can be charged with a DUI for being under
    the influence of which of the following?
  choices:
    A: Alcohol only
    B: Illegal drugs only
    C: Prescription drugs only
    D: Alcohol, illegal drugs, or prescription/over-the-counter drugs
  answer: D
  explanation: A DUI charge can result from being under the influence of alcohol,
    any controlled substance, or any other drug (including prescription or OTC) that
    renders the person incapable of safely driving.
- id: 126
  category: alcohol_drugs_health
  question: In North Dakota, if you are involved in a DUI while a child under the
    age of ____ is in the vehicle, the offense is elevated to a Class A Misdemeanor.
  choices:
    A: '12'
    B: '14'
    C: '16'
    D: '18'
  answer: C
  explanation: North Dakota law increases the severity of a DUI to a Class A Misdemeanor
    if there is a passenger under the age of 16 in the vehicle at the time of the
    offense.
- id: 127
  category: alcohol_drugs_health
  question: What happens if a North Dakota driver is convicted of a DUI and is already
    participating in the 24/7 Sobriety Program?
  choices:
    A: They are exempt from further fines.
    B: They may face immediate incarceration for a program violation.
    C: Their license is automatically returned.
    D: They no longer need an addiction evaluation.
  answer: B
  explanation: The 24/7 Sobriety Program is a condition of bond or sentence; violations
    (like a new DUI or failing a test) typically result in immediate jail time.
- id: 128
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and a doctor has not warned you
    about driving, what should you do?
  choices:
    A: Assume it is safe to drive.
    B: Drive only during daylight hours.
    C: Check the label for warnings or ask a pharmacist before driving.
    D: Drink coffee to counteract any potential drowsiness.
  answer: C
  explanation: It is the driver's responsibility to know the effects of any medication
    they take. Always check labels or consult a professional about side effects like
    drowsiness or blurred vision.
- id: 129
  category: alcohol_drugs_health
  question: In North Dakota, how long is the license revocation for a second refusal
    to submit to a chemical test within a 7-year period?
  choices:
    A: 180 days
    B: 1 year
    C: 2 years
    D: 3 years
  answer: D
  explanation: Under North Dakota's Implied Consent law, a second refusal to submit
    to a chemical test within 7 years results in a 3-year license revocation.
- id: 130
  category: penalties_and_points
  question: For every period of ____ months during which a North Dakota driver is
    not assigned any points, their point total is reduced by one point.
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: A
  explanation: North Dakota law allows for a one-point reduction for every three-month
    period of violation-free driving.
- id: 131
  category: penalties_and_points
  question: In North Dakota, a conviction for 'Reckless Driving' results in how many
    points on your driving record?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Reckless driving is a major violation in North Dakota and results in
    8 points being assessed against the driver's license.
- id: 132
  category: penalties_and_points
  question: What is the point penalty for 'Exhibition Driving' in North Dakota?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 6 points
  answer: C
  explanation: Exhibition driving, which includes unnecessary engine noise or tire
    squealing, results in 3 points on a North Dakota driving record.
- id: 133
  category: penalties_and_points
  question: What is the standard fine for an adult driver (18+) failing to wear a
    seat belt in North Dakota?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: In North Dakota, the fine for a seat belt violation for individuals
    18 years of age or older is $20.
- id: 134
  category: penalties_and_points
  question: If you are involved in an accident resulting in property damage and fail
    to stop, how many points are assessed in North Dakota?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: B
  explanation: Failing to stop at the scene of an accident involving property damage
    results in 6 points on your North Dakota driving record.
- id: 135
  category: penalties_and_points
  question: In North Dakota, a conviction for fleeing or attempting to elude a peace
    officer results in which of the following?
  choices:
    A: 6 points
    B: 12 points
    C: 24 points and license revocation
    D: A $50 fine only
  answer: C
  explanation: Fleeing or attempting to elude a peace officer is a severe violation
    that carries 24 points, which leads to immediate license revocation.
- id: 136
  category: penalties_and_points
  question: How often can a North Dakota driver complete an approved defensive driving
    course to reduce points on their record?
  choices:
    A: Once every 6 months
    B: Once every 12 months
    C: Once every 2 years
    D: Once every 5 years
  answer: B
  explanation: A driver can attend a defensive driving course for a 3-point reduction
    only once every 12 months.
- id: 137
  category: penalties_and_points
  question: When a North Dakota driver's record reaches 12 points, the license is
    suspended. For the first 12 points, how long is the suspension period for each
    point over 11?
  choices:
    A: 1 day
    B: 7 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: In North Dakota, when a license is suspended for points, the duration
    is 7 days for every point over 11 (for the first suspension).
- id: 138
  category: penalties_and_points
  question: How many points are assessed for 'Following Too Closely' in North Dakota?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Following too closely (tailgating) results in 2 points being added
    to the driver's record in North Dakota.
- id: 139
  category: penalties_and_points
  question: In North Dakota, how many points are assessed on your driving record for
    speeding 21 to 25 mph over the posted speed limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: According to the North Dakota point system, speeding 21-25 mph over
    the limit results in 3 points being added to your driving record.
- id: 140
  category: penalties_and_points
  question: What is the point penalty for failing to stop for a school bus that is
    displaying flashing red lights or a stop arm in North Dakota?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Passing a school bus while its red lights are flashing or the stop
    arm is extended is a serious violation in North Dakota and carries a 6-point penalty.
- id: 141
  category: penalties_and_points
  question: Under North Dakota law, what is the standard fine for a first-time violation
    of the ban on texting while driving for an adult driver?
  choices:
    A: $20
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: The fine for texting while driving in North Dakota is $100 for all
    drivers.
- id: 142
  category: penalties_and_points
  question: For every period of _____ months during which a driver commits no traffic
    violations, one point will be removed from their North Dakota driving record.
  choices:
    A: '3'
    B: '6'
    C: '12'
    D: '24'
  answer: A
  explanation: North Dakota reduces a driver's point total by one point for every
    three-month period in which no points are recorded against the license.
- id: 143
  category: penalties_and_points
  question: How many points are assessed for engaging in a speed contest (drag racing)
    on a North Dakota highway?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: Engaging in a speed contest or drag racing on public roads in North
    Dakota results in 10 points being added to the driver's record.
- id: 144
  category: penalties_and_points
  question: In North Dakota, leaving the scene of an accident involving only property
    damage results in how many points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Leaving the scene of an accident involving property damage is a 6-point
    violation in North Dakota.
- id: 145
  category: penalties_and_points
  question: In North Dakota, failing to yield the right-of-way at an intersection
    results in how many points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: A
  explanation: Failure to yield the right-of-way at an intersection (except when involving
    an emergency vehicle) results in 2 points in North Dakota.
- id: 146
  category: penalties_and_points
  question: How many points are assessed for a conviction of driving while your license
    is under suspension or revocation in North Dakota?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: B
  explanation: Driving while a license is suspended or revoked results in 4 points
    being added to the driver's record in North Dakota.
- id: 147
  category: sharing_the_road
  question: In North Dakota, when a school bus is stopped on a two-lane highway with
    its red lights flashing and stop arm extended, which vehicles must stop?
  choices:
    A: Only vehicles following the bus
    B: Only vehicles approaching from the front
    C: Vehicles in both directions
    D: No vehicles need to stop if the speed limit is over 40 mph
  answer: C
  explanation: According to the North Dakota Driver's Manual, on a two-lane highway,
    all traffic in both directions must stop for a school bus with flashing red lights
    and an extended stop arm.
- id: 148
  category: sharing_the_road
  question: Under North Dakota's 'Move Over' law, what must a driver do when approaching
    a stationary emergency vehicle displaying flashing lights on a multi-lane highway?
  choices:
    A: Maintain speed and stay in the current lane
    B: Move to a lane that is not adjacent to the emergency vehicle, if safe to do
      so
    C: Stop immediately in the middle of the highway
    D: Speed up to pass the vehicle as quickly as possible
  answer: B
  explanation: North Dakota law requires drivers to move to a lane not adjacent to
    the stationary emergency vehicle or slow down significantly if changing lanes
    is unsafe.
- id: 149
  category: sharing_the_road
  question: What is the minimum distance a driver must maintain when following a fire
    apparatus (fire truck) responding to an alarm in North Dakota?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: ND Century Code 39-10-57 states that it is illegal to follow any fire
    apparatus traveling in response to a fire alarm closer than 500 feet.
- id: 150
  category: sharing_the_road
  question: In North Dakota, who is legally required to wear a helmet while operating
    or riding on a motorcycle?
  choices:
    A: All riders regardless of age
    B: Only the operator, not the passenger
    C: Only individuals under the age of 18
    D: Only individuals with less than 2 years of experience
  answer: C
  explanation: North Dakota law requires all motorcycle operators and passengers under
    the age of 18 to wear a helmet that complies with DOT standards.
- id: 151
  category: sharing_the_road
  question: 'When passing a bicycle in North Dakota, the driver of a motor vehicle
    must leave:'
  choices:
    A: At least 1 foot of space
    B: A safe distance
    C: Exactly 5 feet of space
    D: No specific distance is required
  answer: B
  explanation: ND Century Code 39-10-11.1 requires the operator of a motor vehicle
    overtaking a bicycle to leave a 'safe distance' between the motor vehicle and
    the bicycle.
- id: 152
  category: sharing_the_road
  question: On a highway with a physical median or barrier, when do you NOT have to
    stop for a school bus with flashing red lights?
  choices:
    A: When you are behind the bus
    B: When you are traveling in the opposite direction of the bus
    C: You must always stop regardless of the median
    D: Only if the bus driver waves you through
  answer: B
  explanation: In North Dakota, if a highway is divided by a physical barrier or median,
    traffic traveling in the opposite direction of a school bus is not required to
    stop.
- id: 153
  category: sharing_the_road
  question: What should you do if you see a pedestrian with a white cane or a guide
    dog at an intersection?
  choices:
    A: Honk your horn to let them know you are there
    B: Slow down and proceed with caution
    C: Come to a complete stop and yield the right-of-way
    D: Drive around them if there is enough room
  answer: C
  explanation: Drivers must come to a complete stop and yield the right-of-way to
    any blind pedestrian carrying a white cane or using a guide dog.
- id: 154
  category: sharing_the_road
  question: 'In North Dakota, motorcycles are entitled to:'
  choices:
    A: The left half of a lane only
    B: The right half of a lane only
    C: A full lane width
    D: Share a lane with a passenger car
  answer: C
  explanation: Motorcycles are entitled to the full use of a lane, and it is illegal
    for a motor vehicle to drive in a manner that deprives a motorcycle of the full
    use of a lane.
- id: 155
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may need to:'
  choices:
    A: Stay entirely in the right lane
    B: Swing wide to the left to complete the turn
    C: Stop and back up to make the turn
    D: Turn from the left lane only
  answer: B
  explanation: Large trucks often need to swing wide to the left to clear the curb
    when making a right turn. Drivers should avoid 'squeezing' between the truck and
    the curb.
- id: 156
  category: sharing_the_road
  question: 'Under North Dakota law, a bicyclist riding on a roadway has:'
  choices:
    A: No legal rights to the road
    B: The same rights and responsibilities as a motor vehicle driver
    C: The right-of-way over all motor vehicles at all times
    D: The requirement to ride only on the sidewalk
  answer: B
  explanation: Bicyclists in North Dakota have the same rights and are subject to
    the same duties as drivers of motor vehicles.
- id: 157
  category: sharing_the_road
  question: When following a motorcycle, you should allow for ________ following distance
    than you would for a passenger car.
  choices:
    A: Less
    B: The same
    C: More
    D: Exactly 10 feet
  answer: C
  explanation: Because motorcycles can stop more quickly and are more easily affected
    by road conditions, you should allow more following distance (at least 3-4 seconds)
    when behind them.
- id: 158
  category: sharing_the_road
  question: 'When an emergency vehicle with sirens and flashing lights approaches
    from behind, you must:'
  choices:
    A: Stop immediately in your lane
    B: Pull to the right edge of the road and stop
    C: Speed up to get out of the way
    D: Pull to the left edge of the road and stop
  answer: B
  explanation: North Dakota law requires drivers to yield the right-of-way by pulling
    to the right-hand edge or curb of the road, clear of intersections, and stopping
    until the emergency vehicle has passed.
- id: 159
  category: sharing_the_road
  question: 'The ''No-Zone'' refers to:'
  choices:
    A: Areas where parking is prohibited
    B: The blind spots around large trucks and buses
    C: School zones during summer break
    D: The area directly in front of a police station
  answer: B
  explanation: The 'No-Zone' represents the large blind spots around the front, back,
    and sides of trucks and buses where the driver cannot see other vehicles.
- id: 160
  category: sharing_the_road
  question: 'In North Dakota, a bicyclist may signal a right turn by:'
  choices:
    A: Extending the left arm upward
    B: Extending the right arm horizontally
    C: Either A or B
    D: Bicyclists are not required to signal turns
  answer: C
  explanation: North Dakota law allows bicyclists to signal a right turn by either
    extending the left arm upward or extending the right arm horizontally to the right.
- id: 161
  category: sharing_the_road
  question: Under North Dakota law, when is a driver NOT required to stop for a school
    bus with red lights flashing and the stop arm extended?
  choices:
    A: When the bus is on the opposite side of a divided highway separated by a median
      or barrier
    B: When the driver is in a hurry and no children are crossing
    C: When the bus is stopped in a school zone
    D: When the road has at least three lanes of travel
  answer: A
  explanation: Drivers traveling in the opposite direction on a divided highway separated
    by a physical barrier or median are not required to stop for a school bus, though
    they should still proceed with caution.
- id: 162
  category: sharing_the_road
  question: In North Dakota, what is the penalty for the first offense of 'Overtaking
    or Passing a School Bus' when the red lights are flashing?
  choices:
    A: A $50 fine and 2 points
    B: A $100 fine and 6 points
    C: A $20 fine and 1 point
    D: A $500 fine and 12 points
  answer: B
  explanation: Passing a school bus with red lights flashing is a serious violation
    in North Dakota, resulting in a minimum $100 fine and the assessment of 6 points
    on the driver's record.
- id: 163
  category: sharing_the_road
  question: When approaching a stationary emergency vehicle with its flashing lights
    activated on a multi-lane highway in North Dakota, what must you do?
  choices:
    A: Maintain speed but honk your horn
    B: Stop immediately in your lane
    C: Move to a lane that is not adjacent to the vehicle, if safe to do so
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: North Dakota's 'Move Over Law' requires drivers to move into a lane
    not adjacent to the emergency vehicle if possible. If changing lanes is unsafe,
    the driver must reduce speed and proceed with caution.
- id: 164
  category: sharing_the_road
  question: According to the North Dakota Driver's Manual, how much following distance
    should you maintain behind a motorcycle?
  choices:
    A: At least one car length
    B: At least two seconds
    C: At least three to four seconds
    D: Exactly 50 feet
  answer: C
  explanation: Because motorcycles can stop more quickly than cars and are more susceptible
    to road hazards, North Dakota recommends a following distance of at least three
    to four seconds.
- id: 165
  category: sharing_the_road
  question: 'In North Dakota, vehicles traveling in a funeral procession have the
    right-of-way at intersections EXCEPT:'
  choices:
    A: When an emergency vehicle with sirens is approaching
    B: During rush hour
    C: When the light is red
    D: When there are more than 10 cars
  answer: A
  explanation: ND Century Code 39-10-72 states that funeral processions have the right-of-way,
    but they must still yield to authorized emergency vehicles using proper signals.
- id: 166
  category: sharing_the_road
  question: In North Dakota, what does a 'slow-moving vehicle' emblem look like?
  choices:
    A: A blue circle
    B: A square green sign
    C: A triangular orange-red sign
    D: A rectangular white sign
  answer: C
  explanation: Slow-moving vehicles, such as farm machinery or road construction equipment
    designed to travel at 25 mph or less, must display a triangular fluorescent orange-red
    emblem with a reflective border.
- id: 167
  category: sharing_the_road
  question: 'Under North Dakota law, bicyclists on the roadway:'
  choices:
    A: Must always ride on the sidewalk
    B: Have the same rights and responsibilities as motor vehicle drivers
    C: Must ride against the flow of traffic
    D: Are not allowed on any road with a speed limit over 25 mph
  answer: B
  explanation: In North Dakota, bicycles are considered vehicles when operated on
    a roadway and riders have all the rights and duties applicable to the driver of
    any other vehicle.
- id: 168
  category: sharing_the_road
  question: What are the 'No-Zones' around large trucks and buses?
  choices:
    A: Areas where parking is prohibited
    B: Blind spots where the truck driver cannot see you
    C: Speed-restricted zones for trucks
    D: Loading zones at warehouses
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around the front, back,
    and sides of trucks and buses where the driver's visibility is limited or non-existent.
- id: 169
  category: sharing_the_road
  question: 'When a pedestrian is crossing the street guided by a dog or carrying
    a white cane (with or without a red tip), North Dakota drivers must:'
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Only stop if there is a marked crosswalk
    D: Drive around them slowly
  answer: B
  explanation: North Dakota law requires drivers to yield the right-of-way to any
    totally or partially blind pedestrian carrying a cane or using a guide dog.
- id: 170
  category: sharing_the_road
  question: In North Dakota, if you are passing a bicycle, you should leave at least
    how much space between your vehicle and the bicycle?
  choices:
    A: 1 foot
    B: A safe distance
    C: Exactly 10 feet
    D: No specific distance is required
  answer: B
  explanation: North Dakota law requires drivers to pass a bicycle at a 'safe distance'
    and not interfere with the safe operation of the overtaken bicycle.
- id: 171
  category: sharing_the_road
  question: When a school bus is preparing to stop and activates its amber (yellow)
    flashing lights, what should a North Dakota driver do?
  choices:
    A: Speed up to pass before the red lights come on
    B: Stop immediately
    C: Prepare to stop as the bus is about to activate red lights
    D: Ignore them, as they are only a warning for the bus driver
  answer: C
  explanation: Amber flashing lights are a pre-warning that the bus is preparing to
    stop to load or unload children. Drivers should slow down and be prepared to stop
    when the red lights activate.
- id: 172
  category: sharing_the_road
  question: 'In North Dakota, you must yield the right-of-way to any vehicle that
    is part of a highway maintenance crew displaying:'
  choices:
    A: A green flag
    B: Flashing amber, white, or green lights
    C: A red spotlight
    D: A 'Slow' sign
  answer: B
  explanation: North Dakota maintenance and construction vehicles often use amber,
    white, and sometimes green flashing lights. Drivers must yield and use extra caution
    when approaching these vehicles.
- id: 173
  category: vehicle_information
  question: According to North Dakota law, when must a vehicle's headlights be turned
    on?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: Only when it is raining or snowing
    C: From sunset to sunrise and whenever visibility is less than 1,000 feet
    D: Only when driving on rural highways
  answer: C
  explanation: North Dakota Century Code 39-21-01 requires headlights to be on from
    sunset to sunrise, and at any other time when visibility is not sufficient to
    see persons or vehicles at a distance of 1,000 feet.
- id: 174
  category: vehicle_information
  question: What is the minimum legal tread depth for tires on a passenger vehicle
    in North Dakota?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: North Dakota Century Code 39-21-40 states that a tire is considered
    unsafe if it has a tread depth of less than 2/32 of an inch.
- id: 175
  category: vehicle_information
  question: 'In North Dakota, every motor vehicle must be equipped with a horn that
    can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: North Dakota law requires a horn in good working order capable of emitting
    sound audible under normal conditions from a distance of not less than 200 feet.
- id: 176
  category: vehicle_information
  question: 'Under North Dakota law, a vehicle''s rearview mirror must allow the driver
    to see the highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: Every motor vehicle must be equipped with a mirror so located as to
    reflect to the driver a view of the highway for a distance of at least 200 feet
    to the rear.
- id: 177
  category: vehicle_information
  question: In North Dakota, what is the maximum allowable light transmittance for
    window tinting on the front side windows of a passenger car?
  choices:
    A: No less than 35% light transmittance
    B: No less than 50% light transmittance
    C: No less than 70% light transmittance
    D: Window tinting is completely prohibited on front side windows
  answer: C
  explanation: North Dakota law requires that front side windows (to the left and
    right of the driver) must allow at least 70% of light to pass through.
- id: 178
  category: vehicle_information
  question: During which period are studded snow tires permitted for use on North
    Dakota highways?
  choices:
    A: November 1 to March 31
    B: October 1 to May 1
    C: October 15 to April 15
    D: September 15 to May 15
  answer: C
  explanation: In North Dakota, it is lawful to use tires with metal studs between
    October 15 and April 15 of the following year.
- id: 179
  category: vehicle_information
  question: In North Dakota, your vehicle's service brakes must be able to stop the
    vehicle within how many feet when traveling at 20 mph on a dry, level surface?
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 50 feet
  answer: B
  explanation: North Dakota Century Code 39-21-32 requires that passenger vehicles
    be equipped with brakes capable of stopping the vehicle within 25 feet from a
    speed of 20 mph.
- id: 180
  category: vehicle_information
  question: 'Every motor vehicle in North Dakota must have a tail lamp that emits
    a red light plainly visible from a distance of:'
  choices:
    A: 500 feet to the rear
    B: 1,000 feet to the rear
    C: 1,500 feet to the rear
    D: 2,000 feet to the rear
  answer: B
  explanation: North Dakota law requires tail lamps to be visible from a distance
    of 1,000 feet to the rear.
- id: 181
  category: vehicle_information
  question: 'In North Dakota, the rear registration plate must be illuminated so that
    it is clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: North Dakota Century Code 39-21-04 requires a white light to illuminate
    the rear registration plate, making it legible from a distance of 50 feet.
- id: 182
  category: vehicle_information
  question: Which of the following is true regarding muffler requirements in North
    Dakota?
  choices:
    A: Mufflers are optional on vehicles older than 25 years
    B: Muffler cutouts or bypasses are permitted if used only on rural roads
    C: Every motor vehicle must have a muffler in good working order to prevent excessive
      noise
    D: Mufflers must be replaced every 5 years by law
  answer: C
  explanation: North Dakota law requires every motor vehicle to be equipped with a
    muffler in good working order and in constant operation to prevent excessive or
    unusual noise. Cutouts or bypasses are prohibited.
- id: 183
  category: vehicle_information
  question: Under North Dakota law, what is the maximum legal bumper height for a
    passenger car?
  choices:
    A: 18 inches
    B: 20 inches
    C: 22 inches
    D: 24 inches
  answer: B
  explanation: According to North Dakota Century Code 39-21-45.1, the maximum bumper
    height for a passenger car is 20 inches.
- id: 184
  category: vehicle_information
  question: 'In North Dakota, a ''Slow Moving Vehicle'' emblem must be displayed on
    the rear of any vehicle that normally travels at speeds less than:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The triangular slow-moving vehicle emblem is required on vehicles designed
    for operation at speeds of 25 mph or less.
- id: 185
  category: vehicle_information
  question: If your vehicle's turn signals are not working, you must use hand signals.
    What is the correct hand signal for a right turn in North Dakota?
  choices:
    A: Arm extended straight out the window
    B: Arm extended upward
    C: Arm extended downward
    D: Hand waved in a circular motion
  answer: B
  explanation: For a right turn, the hand and arm should be extended upward. Straight
    out is for a left turn, and downward is for stop or decrease in speed.
- id: 186
  category: vehicle_information
  question: In North Dakota, headlights must be used from sunset to sunrise and at
    any other time when you cannot see clearly for at least how many feet?
  choices:
    A: 500 feet
    B: 750 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: According to the North Dakota Driver's Manual, headlights must be turned
    on from sunset to sunrise and whenever visibility is reduced to 1,000 feet or
    less.
- id: 187
  category: vehicle_information
  question: Under North Dakota law, aftermarket window tinting on the front side windows
    must allow at least what percentage of light to pass through?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: North Dakota law specifies that for front side windows, the light transmittance
    must be at least 35% for aftermarket tinting.
- id: 188
  category: vehicle_information
  question: Every motor vehicle in North Dakota must be equipped with a mirror that
    allows the driver to see the highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: North Dakota equipment regulations require a rearview mirror that provides
    a view of the highway for a distance of at least 200 feet to the rear.
- id: 189
  category: vehicle_information
  question: 'In North Dakota, a vehicle''s horn must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: State law requires every motor vehicle to be equipped with a horn in
    good working order capable of emitting sound audible from a distance of not less
    than 200 feet.
- id: 190
  category: vehicle_information
  question: In North Dakota, during which time period is it legal to operate a vehicle
    with studded snow tires?
  choices:
    A: November 1 to April 1
    B: October 15 to April 15
    C: October 1 to May 1
    D: November 15 to March 15
  answer: B
  explanation: North Dakota law permits the use of studded tires only from October
    15 through April 15.
- id: 191
  category: vehicle_information
  question: 'Turn signal lights in North Dakota must be visible in normal sunlight
    from a distance of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: State regulations require that turn signals be visible from a distance
    of not less than 100 feet in normal sunlight.
- id: 192
  category: vehicle_information
  question: 'According to North Dakota law, tinting on a windshield is only permitted:'
  choices:
    A: If it covers the entire windshield at 70% light
    B: On the top 5 inches or down to the AS-1 line
    C: If the driver has a doctor's note for any window
    D: On the bottom 3 inches of the windshield
  answer: B
  explanation: North Dakota law restricts windshield tinting to the top 5 inches of
    the windshield or the AS-1 line, whichever is lower.
- id: 193
  category: vehicle_information
  question: 'In North Dakota, brake lights (stop lamps) must be visible from the rear
    for a distance of at least:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: A
  explanation: Brake lights must be visible from a distance of at least 100 feet to
    the rear in normal sunlight.
- id: 194
  category: signs_and_signals
  question: In North Dakota, what is the speed limit in a business or residential
    district unless otherwise posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: According to the North Dakota Driver's Manual, the speed limit in any
    business or residential district is 25 mph unless otherwise posted.
- id: 195
  category: signs_and_signals
  question: When approaching a flashing yellow arrow signal in North Dakota, what
    must a driver do?
  choices:
    A: Stop and wait for a green arrow.
    B: Turns are allowed after yielding to oncoming traffic and pedestrians.
    C: The turn is protected; oncoming traffic has a red light.
    D: Speed up to complete the turn before the light changes.
  answer: B
  explanation: A flashing yellow arrow means left turns are allowed, but you must
    first yield to oncoming traffic and pedestrians.
- id: 196
  category: signs_and_signals
  question: In North Dakota, what does a steady yellow traffic light indicate?
  choices:
    A: You must stop immediately, even if in the intersection.
    B: The signal is changing to red; clear the intersection or stop if you can do
      so safely.
    C: Speed up to clear the intersection before the red light.
    D: Pedestrians have the right of way to enter the crosswalk.
  answer: B
  explanation: A steady yellow light means the signal is changing to red. Drivers
    should stop if it is safe to do so; otherwise, they should clear the intersection.
- id: 197
  category: signs_and_signals
  question: What does a solid yellow line on your side of the center dash line indicate
    in North Dakota?
  choices:
    A: You may pass if it is safe to do so.
    B: You are in a high-speed zone.
    C: Passing is prohibited from your lane.
    D: The road ahead is under construction.
  answer: C
  explanation: A solid yellow line on your side of the center line means that passing
    is prohibited for vehicles in your lane.
- id: 198
  category: signs_and_signals
  question: When approaching a railroad crossing in North Dakota, you must stop your
    vehicle within how many feet from the nearest rail?
  choices:
    A: Between 5 and 25 feet
    B: Between 10 and 30 feet
    C: Between 15 and 50 feet
    D: Between 20 and 100 feet
  answer: C
  explanation: North Dakota law requires drivers to stop between 15 and 50 feet from
    the nearest rail at a railroad crossing when signals indicate a train is coming.
- id: 199
  category: signs_and_signals
  question: What is the meaning of a pentagon-shaped (five-sided) sign in North Dakota?
  choices:
    A: Yield right-of-way
    B: School zone or school crossing
    C: Railroad crossing ahead
    D: No passing zone
  answer: B
  explanation: A five-sided (pentagon) sign indicates a school zone or a school crossing.
- id: 200
  category: signs_and_signals
  question: 'In North Dakota, a ''Shared Turn Lane'' (center lane with solid and dashed
    yellow lines) is used for:'
  choices:
    A: Passing slow-moving vehicles.
    B: Making left turns only.
    C: Making right turns only.
    D: Emergency parking only.
  answer: B
  explanation: Shared turn lanes are reserved for making left turns by vehicles traveling
    in either direction and should not be used for passing.
- id: 201
  category: signs_and_signals
  question: When entering a roundabout in North Dakota, which of the following is
    true regarding signaling?
  choices:
    A: You must signal left to enter.
    B: You do not need to signal at all.
    C: You must signal right immediately before exiting the roundabout.
    D: You must use your hazard lights while inside the circle.
  answer: C
  explanation: In North Dakota, drivers are instructed to use their right turn signal
    after passing the exit before the one they want, to indicate they are exiting
    the roundabout.
- id: 202
  category: signs_and_signals
  question: What does a pennant-shaped sign placed on the left side of the road indicate
    in North Dakota?
  choices:
    A: School Zone
    B: No Passing Zone
    C: Yield
    D: Stop Ahead
  answer: B
  explanation: A pennant-shaped sign is placed on the left side of the road to mark
    the beginning of a No Passing Zone.
- id: 203
  category: signs_and_signals
  question: In North Dakota, what color are the lights used on snow removal equipment
    to warn other drivers?
  choices:
    A: Flashing Blue and White
    B: Flashing Red and Yellow
    C: Flashing Amber (Yellow)
    D: Steady Green
  answer: C
  explanation: North Dakota snow removal equipment uses flashing amber (yellow) lights
    to alert motorists of their presence.
- id: 204
  category: signs_and_signals
  question: When you see a steady yellow 'X' signal above a travel lane, what does
    it indicate?
  choices:
    A: The lane is open for travel
    B: You must move out of this lane as soon as safe
    C: The lane is reserved for emergency vehicles
    D: The lane is for left turns only
  answer: B
  explanation: A steady yellow 'X' over a lane means the signal is about to change
    to a red 'X', and you should prepare to vacate the lane safely.
- id: 205
  category: signs_and_signals
  question: According to North Dakota law, when are you allowed to turn right on a
    red light?
  choices:
    A: Never
    B: Only if there is a 'Right Turn on Red' sign
    C: After coming to a complete stop and yielding to traffic and pedestrians, unless
      a sign prohibits it
    D: Only during daylight hours
  answer: C
  explanation: In North Dakota, you may turn right on a red light after stopping and
    yielding, provided there is no sign prohibiting the turn.
- id: 206
  category: signs_and_signals
  question: 'A sign with five sides (a pentagon) indicates that you are entering a:'
  choices:
    A: Hospital zone
    B: Construction zone
    C: School zone or school crossing
    D: Public park
  answer: C
  explanation: A five-sided pentagon-shaped sign is used exclusively to warn drivers
    of school zones or school crossings.
- id: 207
  category: signs_and_signals
  question: In North Dakota, what does a solid white line painted on the pavement
    between lanes of traffic mean?
  choices:
    A: You may change lanes freely
    B: You should stay in your lane; lane changes are discouraged
    C: The road is one-way only
    D: You must come to a complete stop
  answer: B
  explanation: A solid white line indicates that lane changes are discouraged due
    to potential hazards, though not strictly prohibited like a double solid line.
- id: 208
  category: signs_and_signals
  question: When using hand signals, how do you signal a right turn in North Dakota?
  choices:
    A: Extend left arm straight out
    B: Extend left arm upward
    C: Extend left arm downward
    D: Extend right arm straight out
  answer: B
  explanation: To signal a right turn using hand signals, the left arm should be extended
    upward at a 90-degree angle.
- id: 209
  category: signs_and_signals
  question: What is the correct procedure when approaching a roundabout in North Dakota?
  choices:
    A: Yield to traffic already in the circle
    B: Traffic in the circle must yield to you
    C: Always stop before entering the circle
    D: Speed up to merge with traffic
  answer: A
  explanation: When approaching a roundabout, you must yield the right-of-way to traffic
    already circulating within the roundabout.
- id: 210
  category: signs_and_signals
  question: In North Dakota, what does a diamond-shaped orange sign indicate?
  choices:
    A: Regulatory information
    B: Service or guidance
    C: Construction or maintenance warning
    D: Recreational area
  answer: C
  explanation: Orange diamond-shaped signs are used specifically for construction
    and maintenance work zone warnings.
- id: 211
  category: signs_and_signals
  question: Under North Dakota law, what must you do when approaching a funeral procession?
  choices:
    A: Honk to show respect
    B: Yield the right-of-way to all vehicles in the procession
    C: Pass the procession on the right
    D: Only yield if the lead vehicle has a siren
  answer: B
  explanation: North Dakota law (NDCC 39-10-72) requires drivers to yield the right-of-way
    to a funeral procession that is accompanied by a lead vehicle displaying flashing
    lights.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 212
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 213
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 214
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 215
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 216
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 217
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 218
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 219
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 220
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 221
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 222
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 223
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 224
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 225
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 226
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 227
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 228
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 229
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 230
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 231
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 232
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 233
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 234
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 235
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 236
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 237
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 238
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
