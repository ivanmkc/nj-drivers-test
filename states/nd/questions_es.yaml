questions:
- id: 1
  category: license_system
  question: ¿En Dakota del Norte, cuál es la edad mínima que debe alcanzar una persona
    para ser elegible para un Permiso de Instrucción?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: A
  explanation: De acuerdo con el Manual del Conductor de Dakota del Norte, una persona
    debe tener al menos 14 años de edad para solicitar un Permiso de Instrucción.
- id: 2
  category: license_system
  question: Si es menor de 16 años, ¿cuánto tiempo debe tener un Permiso de Instrucción
    de Dakota del Norte antes de poder solicitar una licencia de operador restringida?
  choices:
    A: 6 meses
    B: 9 meses
    C: 12 meses
    D: 18 meses
  answer: C
  explanation: La ley de Dakota del Norte exige que los conductores menores de 16
    años mantengan un Permiso de Instrucción durante un mínimo de 12 meses antes de
    solicitar una licencia restringida.
- id: 3
  category: license_system
  question: ¿A los conductores menores de 16 años con una licencia restringida de
    Dakota del Norte se les prohíbe conducir durante qué horario?
  choices:
    A: De 11:00 PM a 6:00 AM
    B: Entre la puesta del sol o las 9:00 PM (lo que ocurra más tarde) y las 5:00
      AM
    C: De 10:00 PM a 5:00 AM
    D: De medianoche a 5:00 AM
  answer: B
  explanation: Las leyes de Licencia de Conducir Graduada (GDL) de Dakota del Norte
    establecen que los titulares de licencias restringidas menores de 16 años no pueden
    conducir entre lo que ocurra más tarde, la puesta del sol o las 9:00 PM, y las
    5:00 AM, con ciertas excepciones por trabajo o escuela.
- id: 4
  category: license_system
  question: ¿Cuántas horas de conducción supervisada debe completar un titular de
    permiso de Dakota del Norte menor de 16 años antes de realizar el examen de conducir?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Los conductores menores de 16 años deben completar 50 horas de conducción
    supervisada en diversas condiciones para calificar para su examen de conducir.
- id: 5
  category: license_system
  question: En Dakota del Norte, ¿sus privilegios de conducción serán suspendidos
    si acumula cuántos puntos en su historial de conducción?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: El sistema de puntos de Dakota del Norte activa una suspensión de la
    licencia una vez que el conductor alcanza los 12 puntos.
- id: 6
  category: license_system
  question: ¿Dentro de cuántos días debe notificar al DOT de Dakota del Norte sobre
    un cambio de dirección o nombre?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: La ley de Dakota del Norte exige que los conductores notifiquen al
    Director del Departamento de Transporte dentro de los 10 días posteriores a cualquier
    cambio en su nombre o dirección.
- id: 7
  category: license_system
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) para un
    conductor menor de 21 años en Dakota del Norte?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Dakota del Norte tiene una política de 'Tolerancia Cero' para menores;
    un BAC de 0.02% o superior para un conductor menor de 21 años se considera una
    infracción legal.
- id: 8
  category: license_system
  question: ¿Un titular de un Permiso de Instrucción de Dakota del Norte que tiene
    16 o 17 años debe mantener el permiso durante cuánto tiempo antes de realizar
    un examen de conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Mientras que los menores de 16 años deben mantener el permiso durante
    12 meses, aquellos de 16 o 17 años deben mantenerlo durante al menos 6 meses.
- id: 9
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un residente de Dakota
    del Norte obtenga una licencia que cumpla con 'Real ID'?
  choices:
    A: Prueba de número de Seguro Social, identidad y dos pruebas de residencia en
      Dakota del Norte
    B: Una nota por escrito de un empleador
    C: Únicamente un pasaporte válido
    D: Prueba de 100 horas de experiencia de conducción
  answer: A
  explanation: Para obtener una Real ID en ND, debe proporcionar documentación específica
    que incluya prueba de identidad, número de Seguro Social y dos documentos que
    demuestren la dirección residencial en ND.
- id: 10
  category: license_system
  question: Según la ley de Dakota del Norte, ¿cuál es la restricción de pasajeros
    para un titular de licencia restringida menor de 16 años?
  choices:
    A: No se permiten pasajeros en ningún momento
    B: Solo se permiten miembros de la familia
    C: No más de un pasajero que no sea miembro de la familia
    D: No más de tres pasajeros independientemente del parentesco
  answer: C
  explanation: Las reglas de GDL de Dakota del Norte establecen que un titular de
    licencia restringida menor de 16 años no puede llevar a más de un pasajero que
    no sea miembro de su familia inmediata.
- id: 11
  category: license_system
  question: En Dakota del Norte, si se le condena por conducir sin seguro de responsabilidad
    civil, ¿cuántos puntos se asignan a su historial de conducción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Conducir sin seguro de responsabilidad civil en Dakota del Norte resulta
    en la adición de 6 puntos al historial del conductor.
- id: 12
  category: license_system
  question: ¿Cuál es el requisito mínimo de visión para obtener una licencia de conducir
    de Dakota del Norte sin restricciones?
  choices:
    A: 20/20 en ambos ojos
    B: 20/40 en al menos un ojo
    C: 20/60 en ambos ojos
    D: 20/50 en al menos un ojo
  answer: B
  explanation: El estándar de visión de Dakota del Norte para una licencia sin restricciones
    es una agudeza visual de al menos 20/40 en al menos un ojo.
- id: 13
  category: license_system
  question: 'Si un padre o tutor legal firma la solicitud para el permiso o licencia
    de un menor en Dakota del Norte, posteriormente podrá:'
  choices:
    A: Solo cancelarla si el menor es condenado por un delito
    B: Solicitar que la licencia sea cancelada en cualquier momento antes de que el
      menor cumpla 18 años
    C: No cancelar la licencia una vez que ha sido emitida
    D: Solo cancelarla si el menor reprueba un grado en la escuela
  answer: B
  explanation: La persona que firma la solicitud para un menor de 18 años puede presentar
    una solicitud por escrito al DOT para que se cancele el permiso o la licencia
    del menor.
- id: 14
  category: license_system
  question: ¿Cuántos puntos se evalúan por no ceder el paso a un vehículo de emergencia
    autorizado que muestra luces intermitentes en Dakota del Norte?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: No ceder el paso a un vehículo de emergencia es una infracción grave
    en Dakota del Norte y conlleva una penalización de 8 puntos.
- id: 15
  category: license_system
  question: 'Una licencia Clase D de Dakota del Norte le permite operar un solo vehículo
    con una Clasificación de Peso Bruto del Vehículo (GVWR) de hasta:'
  choices:
    A: 10,000 lbs
    B: 16,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: Una licencia Clase D estándar en Dakota del Norte permite la operación
    de vehículos individuales con un GVWR de 26,000 libras o menos.
- id: 16
  category: license_system
  question: En Dakota del Norte, ¿cuántos puntos se pueden eliminar de su historial
    de conducción al completar un curso aprobado de conducción defensiva?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: Según el Manual del Conductor de Dakota del Norte, completar un curso
    aprobado de conducción defensiva puede reducir su total de puntos en 3 puntos
    una vez cada 12 meses.
- id: 17
  category: license_system
  question: Un nuevo residente de Dakota del Norte debe registrar su vehículo dentro
    de ¿cuántos días después de establecer su residencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Los nuevos residentes deben registrar sus vehículos y obtener placas
    de Dakota del Norte dentro de los 90 días posteriores al establecimiento de su
    residencia.
- id: 18
  category: license_system
  question: Para los conductores de entre 21 y 64 años, ¿por cuántos años es válida
    normalmente una licencia de operador de Dakota del Norte?
  choices:
    A: 4 años
    B: 5 años
    C: 6 años
    D: 8 años
  answer: C
  explanation: En Dakota del Norte, una licencia de operador estándar para personas
    de 21 a 64 años es válida por 6 años.
- id: 19
  category: license_system
  question: En Dakota del Norte, ¿cuál es la tarifa de restablecimiento de una licencia
    de conducir suspendida por motivos ajenos al consumo de alcohol o drogas?
  choices:
    A: 25 dólares
    B: 50 dólares
    C: 75 dólares
    D: 100 dólares
  answer: B
  explanation: La tarifa de restablecimiento para una suspensión no relacionada con
    el alcohol en Dakota del Norte es de $50. Las suspensiones relacionadas con el
    alcohol conllevan una tarifa de $100.
- id: 20
  category: license_system
  question: Bajo la Ley de Consentimiento Implícito de Dakota del Norte, ¿cuál es
    la sanción por negarse por primera vez a someterse a una prueba química de concentración
    de alcohol?
  choices:
    A: Una suspensión de la licencia por 90 días
    B: Una suspensión de la licencia por 180 días
    C: Una revocación de la licencia por 1 año
    D: Una revocación de la licencia por 2 años
  answer: C
  explanation: Bajo la Ley de Consentimiento Implícito, si usted se niega a una prueba
    química, su licencia será revocada por al menos un año por una primera infracción.
- id: 21
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    por daños a la propiedad en Dakota del Norte?
  choices:
    A: 10,000 dólares
    B: 20,000 dólares
    C: 25,000 dólares
    D: 50,000 dólares
  answer: C
  explanation: La ley de Dakota del Norte exige un mínimo de $25,000 para el seguro
    de responsabilidad civil por daños a la propiedad (parte del requisito 25/50/25).
- id: 22
  category: license_system
  question: ¿Cuántos puntos se asignan al historial de conducción de Dakota del Norte
    por una condena de 'conducción de exhibición' (Exhibition Driving)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: La conducción de exhibición en Dakota del Norte resulta en la adición
    de 3 puntos al historial del conductor.
- id: 23
  category: license_system
  question: En Dakota del Norte, ¿cuántos puntos se asignan por una condena de 'conducción
    descuidada' (Careless Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Una condena por conducción descuidada en Dakota del Norte resulta en
    la adición de 6 puntos a su historial de conducción.
- id: 24
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una tarjeta de identificación con
    fotografía para no conductores en Dakota del Norte?
  choices:
    A: No hay una edad mínima
    B: 12 años
    C: 14 años
    D: 16 años
  answer: A
  explanation: Dakota del Norte no tiene un requisito de edad mínima para una tarjeta
    de identificación con fotografía para no conductores.
- id: 25
  category: license_system
  question: Si no tiene infracciones de tránsito, ¿cuántos puntos se eliminan de su
    historial de conducción de Dakota del Norte por cada período de tres meses de
    conducción sin infracciones?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: Todos los puntos se eliminan después de 6 meses
  answer: A
  explanation: La ley de Dakota del Norte establece que se elimina 1 punto del historial
    de un conductor por cada período de tres meses en el que no se registren puntos.
- id: 26
  category: license_system
  question: En Dakota del Norte, ¿cuántos puntos se asignan por 'abandonar la escena
    de un accidente' (Leaving the Scene of an Accident) que involucre daños a la propiedad?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Abandonar la escena de un accidente que involucre daños a la propiedad
    resulta en la adición de 6 puntos a su historial de conducción de Dakota del Norte.
- id: 27
  category: license_system
  question: ¿A qué hora del día vence una licencia de conducir de Dakota del Norte
    en la fecha de vencimiento?
  choices:
    A: Mediodía
    B: 5:00 PM
    C: 9:00 PM
    D: Medianoche
  answer: D
  explanation: Una licencia de conducir de Dakota del Norte vence a la medianoche
    de la fecha de vencimiento, que suele ser el cumpleaños del conductor.
- id: 28
  category: license_system
  question: ¿Cuál es el costo de un duplicado de la licencia de conducir de Dakota
    del Norte si la suya se pierde o es robada?
  choices:
    A: 5 dólares
    B: 8 dólares
    C: 15 dólares
    D: 20 dólares
  answer: B
  explanation: El costo de un duplicado de la licencia de conducir en Dakota del Norte
    es de $8.
- id: 29
  category: license_system
  question: Para obtener un permiso de aprendizaje de Clase M (motocicleta) en Dakota
    del Norte, ¿qué edad mínima debe tener el solicitante?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: A
  explanation: En Dakota del Norte, una persona debe tener al menos 14 años para solicitar
    un permiso de aprendizaje de motocicleta.
- id: 30
  category: driver_testing
  question: En Dakota del Norte, ¿cuál es el límite de velocidad máximo en carreteras
    rurales no pavimentadas (grava) a menos que se indique lo contrario?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: Según el Manual del Conductor de Dakota del Norte, el límite de velocidad
    en carreteras rurales no pavimentadas es de 55 mph a menos que se indique lo contrario.
- id: 31
  category: driver_testing
  question: Al prepararse para girar, la ley de Dakota del Norte exige que señalice
    su intención al menos ¿cuántos pies antes del giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Dakota del Norte exige que los conductores utilicen la señal
    de giro durante al menos 100 pies antes de realizar un giro o cambiar de carril.
- id: 32
  category: driver_testing
  question: En Dakota del Norte, ¿es ilegal estacionar su vehículo a menos de cuántos
    pies de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Dakota del Norte prohíbe estacionar a menos de 10 pies de
    un hidrante de incendios.
- id: 33
  category: driver_testing
  question: Al estacionar cerca de una intersección, ¿no debe estacionar a menos de
    cuántos pies de un paso de peatones?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Según la ley de Dakota del Norte, se prohíbe estacionar a menos de
    20 pies de un paso de peatones en una intersección.
- id: 34
  category: driver_testing
  question: ¿Cuál es la multa estándar para un conductor condenado por una infracción
    de enviar mensajes de texto mientras conduce en Dakota del Norte?
  choices:
    A: $20
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: En Dakota del Norte, la multa por enviar mensajes de texto mientras
    se conduce es de $100 para todos los conductores.
- id: 35
  category: driver_testing
  question: ¿Cuántos puntos se asignan a su historial de conducción de Dakota del
    Norte por no detenerse ante una señal de alto (pare)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: De acuerdo con el sistema de puntos de Dakota del Norte, no detenerse
    ante una señal de alto resulta en la adición de 2 puntos a su historial de conducción.
- id: 36
  category: driver_testing
  question: Al conducir de noche en Dakota del Norte, ¿debe bajar las luces altas
    cuando se encuentre a menos de cuántos pies de un vehículo que viene en sentido
    contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Dakota del Norte exige que baje las luces altas cuando se
    encuentre a menos de 500 pies de un vehículo que viene en sentido contrario.
- id: 37
  category: driver_testing
  question: En Dakota del Norte, los niños deben estar debidamente asegurados en un
    sistema de retención infantil (asiento de seguridad o elevador) hasta que alcancen
    ¿qué edad?, a menos que midan 4'9" o más?
  choices:
    A: 5 años de edad
    B: 6 años de edad
    C: 7 años de edad
    D: 8 años de edad
  answer: D
  explanation: La ley de Dakota del Norte exige que los niños menores de 8 años de
    edad utilicen un sistema de retención infantil aprobado, a menos que el niño mida
    al menos 4 pies y 9 pulgadas de altura.
- id: 38
  category: driver_testing
  question: ¿No puede adelantar a otro vehículo por la izquierda cuando se encuentre
    a menos de cuántos pies de una intersección o un cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley de Dakota del Norte prohíbe adelantar por el lado izquierdo
    de la carretera cuando se aproxima a menos de 100 pies de una intersección o un
    cruce de ferrocarril.
- id: 39
  category: driver_testing
  question: 'Para una primera infracción de DUI en Dakota del Norte con un BAC entre
    0.08% y 0.17%, la multa mínima obligatoria es:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: B
  explanation: Para una primera condena por DUI con un BAC de 0.08% a 0.17%, la ley
    de Dakota del Norte exige una multa mínima de $250, una suspensión de la licencia
    por 91 días y una evaluación de adicciones.
- id: 40
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    una zona escolar de Dakota del Norte cuando hay niños presentes?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El Manual del Conductor de Dakota del Norte establece que el límite
    de velocidad en las zonas escolares es de 20 mph, a menos que se indique lo contrario.
- id: 41
  category: driver_testing
  question: ¿Al realizar el examen de conducción de Dakota del Norte, quién es responsable
    de proporcionar el vehículo utilizado para la prueba?
  choices:
    A: El examinador del DOT
    B: El departamento de policía local
    C: El solicitante
    D: Solo la escuela de manejo
  answer: C
  explanation: Los solicitantes de una licencia de conducir de Dakota del Norte deben
    proporcionar su propio vehículo para el examen de conducción, y este debe estar
    en condiciones seguras de funcionamiento.
- id: 42
  category: driver_testing
  question: 'En Dakota del Norte, debe informar inmediatamente un choque a las autoridades
    si este resulta en lesiones, muerte o daños a la propiedad de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $4,000
  answer: D
  explanation: La ley de Dakota del Norte (NDCC 39-08-09) requiere la notificación
    inmediata a las autoridades si un choque resulta en lesiones, muerte o daños totales
    a la propiedad de $4,000 o más.
- id: 43
  category: driver_testing
  question: Si lo sorprenden conduciendo a exceso de velocidad entre 21 y 25 mph sobre
    el límite en una carretera en Dakota del Norte, ¿cuántos puntos se sumarán a su
    registro?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: Bajo el sistema de puntos de Dakota del Norte, exceder el límite de
    velocidad por 21-25 mph resulta en 3 puntos.
- id: 44
  category: driver_testing
  question: Según el Manual del Conductor de Dakota del Norte, ¿a qué velocidad puede
    comenzar el hidroplaneo (los neumáticos pierden contacto con la carretera sobre
    el agua)?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El manual establece que el hidroplaneo puede comenzar a velocidades
    tan bajas como 35 mph, y en una tormenta de lluvia severa, los neumáticos pueden
    perder todo contacto con la carretera a 55 mph.
- id: 45
  category: driver_testing
  question: ¿Cuál es el límite de velocidad en las autopistas interestatales rurales
    de Dakota del Norte para vehículos de pasajeros?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: El límite de velocidad máximo en las autopistas interestatales rurales
    en Dakota del Norte es de 75 mph para vehículos de pasajeros.
- id: 46
  category: driver_testing
  question: ¿Cuántos puntos se asignan contra su registro de conducir de Dakota del
    Norte por rebasar a un autobús escolar que tiene sus luces rojas intermitentes?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Rebasar a un autobús escolar mientras sus luces rojas están parpadeando
    es una infracción grave en Dakota del Norte y resulta en la adición de 6 puntos
    a su registro de conducir.
- id: 47
  category: driver_testing
  question: En Dakota del Norte, ¿está prohibido estacionarse a menos de cuántos pies
    de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Dakota del Norte prohíbe estacionar un vehículo a menos de
    10 pies de un hidrante de incendios.
- id: 48
  category: driver_testing
  question: 'En Dakota del Norte, debe cambiar sus faros a luces bajas cuando sigue
    a otro vehículo a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Al seguir a otro vehículo, debe cambiar sus faros a luces bajas cuando
    se encuentre a menos de 300 pies del vehículo de adelante.
- id: 49
  category: driver_testing
  question: Antes de realizar un giro en Dakota del Norte, ¿debe indicar su intención
    continuamente durante al menos cuántos pies?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Dakota del Norte exige que los conductores hagan la señal
    al menos 100 pies antes de girar o cambiar de carril.
- id: 50
  category: driver_testing
  question: En Dakota del Norte, ¿cuál es la multa mínima por exceso de velocidad
    en una zona de construcción de carreteras cuando hay trabajadores presentes?
  choices:
    A: No hay mínimo, se aplican multas estándar
    B: $40
    C: $80
    D: $100
  answer: D
  explanation: Según el Código del Siglo de Dakota del Norte, la multa mínima por
    exceso de velocidad en una zona de construcción cuando hay trabajadores presentes
    es de $100.
- id: 51
  category: driver_testing
  question: ¿Cuál de las siguientes infracciones resulta en 24 puntos y la revocación
    inmediata de la licencia en Dakota del Norte?
  choices:
    A: DUI (Primer delito)
    B: Huir o intentar eludir a un oficial de la paz
    C: Conducir bajo suspensión
    D: Abandonar la escena de un accidente que involucre daños a la propiedad
  answer: B
  explanation: Huir o intentar eludir a un oficial de la paz es una infracción grave
    en Dakota del Norte que conlleva una penalización de 24 puntos, lo que conduce
    a la revocación inmediata.
- id: 52
  category: driver_testing
  question: 'Para mantener una distancia de seguimiento segura detrás del vehículo
    que está delante de usted, el Manual del Conductor de Dakota del Norte recomienda
    utilizar la:'
  choices:
    A: Regla de la longitud de un vehículo
    B: Regla de los dos segundos
    C: Regla de los tres segundos
    D: Regla de los cuatro segundos
  answer: C
  explanation: Dakota del Norte recomienda una distancia de seguimiento de al menos
    tres segundos bajo condiciones de conducción ideales.
- id: 53
  category: driver_responsibility
  question: Cuando compra un vehículo en Dakota del Norte, ¿dentro de cuántos días
    debe solicitar un nuevo título a su nombre?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: Según la ley de Dakota del Norte, el título de un vehículo debe transferirse
    al nuevo propietario dentro de los 30 días posteriores a la fecha de compra para
    evitar cargos por pagos atrasados y garantizar el registro adecuado.
- id: 54
  category: driver_responsibility
  question: Si se le requiere presentar un SR-22 (Prueba de Responsabilidad Financiera)
    debido a una condena por conducir sin seguro en Dakota del Norte, ¿por cuánto
    tiempo debe mantenerlo típicamente?
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 5 años
  answer: B
  explanation: En Dakota del Norte, si su licencia es suspendida por falta de seguro
    de responsabilidad civil, generalmente se le requiere presentar y mantener un
    SR-22 por un período de un año.
- id: 55
  category: driver_responsibility
  question: Según la ley de Dakota del Norte, ¿cuál es la multa obligatoria por tirar
    basura en una carretera pública desde un vehículo motorizado?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: El Código del Siglo de Dakota del Norte 39-10-59 establece que una
    persona que viole las leyes sobre tirar basura desde un vehículo es culpable de
    una infracción y debe ser sancionada con una multa de $100.
- id: 56
  category: driver_responsibility
  question: La ley de "Contenedor Abierto" (Open Container) de Dakota del Norte prohíbe
    la posesión de un contenedor de bebida alcohólica abierto en ¿qué parte del vehículo?
  choices:
    A: Solo el asiento del conductor
    B: Solo el maletero
    C: El área de pasajeros
    D: Detrás del asiento trasero de un hatchback
  answer: C
  explanation: La ley de Dakota del Norte prohíbe que cualquier persona tenga un contenedor
    abierto de una bebida alcohólica en el área de pasajeros de un vehículo motorizado
    mientras se encuentre en una carretera pública.
- id: 57
  category: driver_responsibility
  question: ¿Cómo determina Dakota del Norte el mes en el que se debe renovar el registro
    de su vehículo?
  choices:
    A: El mes en que se compró el vehículo
    B: El mes de nacimiento del propietario
    C: Un sistema escalonado basado en la primera letra del apellido del propietario
    D: Todos los registros vencen en diciembre
  answer: C
  explanation: Dakota del Norte utiliza un sistema de registro escalonado donde el
    mes de renovación se determina por la primera letra del apellido del propietario
    o la primera letra del nombre de una empresa.
- id: 58
  category: driver_responsibility
  question: Dakota del Norte es un estado de seguro "Sin Culpa" (No-Fault). Esto significa
    que su póliza de seguro debe incluir ¿cuál de las siguientes coberturas?
  choices:
    A: Cobertura contra todo riesgo (Comprehensive)
    B: Protección contra Lesiones Personales (PIP)
    C: Seguro de brecha (Gap insurance)
    D: Cobertura de remolque y mano de obra
  answer: B
  explanation: Como estado sin culpa, Dakota del Norte requiere la cobertura de Protección
    contra Lesiones Personales (PIP), que paga los gastos médicos y la pérdida de
    salarios del asegurado, independientemente de quién haya tenido la culpa en el
    accidente.
- id: 59
  category: driver_responsibility
  question: A menos que esté específicamente exento, ¿cuántas placas de matrícula
    se deben exhibir en un vehículo motorizado registrado en Dakota del Norte?
  choices:
    A: Una placa, exhibida en la parte trasera
    B: Una placa, exhibida en la parte delantera
    C: Dos placas, una en la parte delantera y otra en la trasera
    D: Dos placas, ambas en la parte trasera
  answer: C
  explanation: 'La ley de Dakota del Norte exige que la mayoría de los vehículos motorizados
    exhiban dos placas de matrícula: una en la parte delantera y otra en la parte
    trasera del vehículo.'
- id: 60
  category: driver_responsibility
  question: 'Si choca con un vehículo desatendido en Dakota del Norte y no puede encontrar
    al propietario, usted debe:'
  choices:
    A: Esperar en la escena durante al menos dos horas
    B: Dejar una notificación por escrito en un lugar visible del vehículo
    C: Irse si el daño es inferior a $1,000
    D: Informarlo solo si alguien estaba mirando
  answer: B
  explanation: Si golpea un vehículo desatendido, debe detenerse y localizar al propietario
    o dejar una notificación por escrito que incluya su nombre, dirección y el número
    de registro de su vehículo.
- id: 61
  category: driver_responsibility
  question: Bajo la Ley de Responsabilidad Financiera de Dakota del Norte, si usted
    se ve involucrado en un accidente y no tiene seguro, ¿qué se le podría exigir
    que haga para evitar la suspensión de su licencia?
  choices:
    A: Pagar una multa de $50
    B: Realizar 40 horas de servicio comunitario
    C: Depositar una garantía (efectivo o fianza) para cubrir posibles daños
    D: Volver a tomar el examen de conducir escrito
  answer: C
  explanation: Si un conductor sin seguro se ve involucrado en un accidente, la Ley
    de Responsabilidad Financiera puede exigirle que deposite una garantía por el
    monto determinado por el DOT para satisfacer cualquier sentencia por daños resultantes
    del accidente.
- id: 62
  category: driver_responsibility
  question: ¿Cuál es la penalización de puntos en Dakota del Norte por huir o intentar
    eludir a un oficial de la paz en un vehículo motorizado?
  choices:
    A: 12 puntos
    B: 15 puntos
    C: 20 puntos
    D: 24 puntos
  answer: D
  explanation: Huir o intentar eludir a un oficial de la paz es una infracción grave
    en Dakota del Norte y resulta en 24 puntos, lo que provoca la revocación inmediata
    de la licencia.
- id: 63
  category: driver_responsibility
  question: 'En Dakota del Norte, debe informar de inmediato un accidente de vehículo
    motorizado a la agencia de cumplimiento de la ley correspondiente si el daño total
    a la propiedad de cualquier persona parece exceder los:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $4,000
  answer: D
  explanation: De acuerdo con la ley de Dakota del Norte, los accidentes que involucren
    muerte, lesiones personales o daños a la propiedad de $4,000 o más deben informarse
    de inmediato a la policía, al alguacil del condado o a la patrulla de caminos
    estatal.
- id: 64
  category: driver_responsibility
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    por lesiones corporales o muerte de una persona en un solo accidente en Dakota
    del Norte?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Dakota del Norte exige un mínimo de $25,000 por lesiones
    corporales o muerte de una persona en cualquier accidente.
- id: 65
  category: driver_responsibility
  question: 'Dakota del Norte es un estado de seguro ''sin culpa'' (no-fault). Esto
    significa que en caso de un accidente:'
  choices:
    A: Nadie es nunca considerado responsable de los daños.
    B: Su propia compañía de seguros paga sus gastos médicos independientemente de
      quién haya causado el accidente.
    C: El estado paga todos los daños de un fondo dedicado.
    D: Los conductores no están obligados a tener seguro de responsabilidad civil.
  answer: B
  explanation: El sistema sin culpa de Dakota del Norte requiere cobertura de Protección
    contra Lesiones Personales (PIP), que paga sus propios gastos médicos y ciertos
    otros costos independientemente de quién haya tenido la culpa.
- id: 66
  category: driver_responsibility
  question: Cuando ocurre un accidente y no se presenta un informe policial, ¿cuántos
    días tiene para presentar un informe por escrito al Departamento de Transporte
    de Dakota del Norte si los daños exceden los $4,000?
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Si un oficial de la ley no investiga el accidente, el conductor debe
    presentar un informe al DOT dentro de los 10 días si hay lesiones, muerte o daños
    que excedan los $4,000.
- id: 67
  category: driver_responsibility
  question: En Dakota del Norte, ¿qué sucede con las placas de matrícula cuando vende
    su vehículo a otra persona?
  choices:
    A: Deben permanecer en el vehículo para el nuevo propietario.
    B: Deben ser retiradas y conservadas por el vendedor.
    C: Deben ser destruidas inmediatamente.
    D: Deben ser entregadas al departamento de policía local.
  answer: B
  explanation: En Dakota del Norte, las placas de matrícula son propiedad del dueño,
    no del vehículo. Cuando vende un vehículo, debe retirar las placas.
- id: 68
  category: driver_responsibility
  question: Según la ley de Dakota del Norte, ¿cuál de las siguientes afirmaciones
    es verdadera con respecto a la ley de 'Contenedor Abierto' (Open Container)?
  choices:
    A: Solo se aplica al conductor.
    B: Es legal si el contenedor está en la guantera.
    C: Es ilegal que cualquier persona en un vehículo en una vía pública posea un
      contenedor de bebida alcohólica abierto.
    D: Solo se aplica a conductores menores de 21 años.
  answer: C
  explanation: La ley de Dakota del Norte prohíbe que cualquier persona (conductor
    o pasajero) tenga un contenedor abierto de una bebida alcohólica en el compartimiento
    de pasajeros de un vehículo motorizado en una vía pública.
- id: 69
  category: driver_responsibility
  question: ¿Cuál es la multa estándar por tirar basura en una carretera o propiedad
    pública en Dakota del Norte?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: De acuerdo con el Código del Siglo de Dakota del Norte, la multa por
    tirar basura en una carretera es de $100.
- id: 70
  category: driver_responsibility
  question: 'En Dakota del Norte, si se ve involucrado en un accidente con un vehículo
    desatendido, usted debe:'
  choices:
    A: Esperar a que regrese el dueño, sin importar cuánto tiempo tome.
    B: Abandonar la escena si el daño es menor a $1,000.
    C: Dejar un aviso en un lugar visible en el vehículo y notificar a la policía.
    D: Solo notificar a la policía si no se puede encontrar al dueño dentro de las
      48 horas.
  answer: C
  explanation: Si choca contra un vehículo desatendido, debe notificar al propietario
    o dejar un aviso por escrito con su nombre, dirección y una explicación, y luego
    notificar a la policía.
- id: 71
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un requisito de la ley "Move Over" (Hacerse
    a un lado) de Dakota del Norte al acercarse a un vehículo de emergencia estacionado
    con luces intermitentes?
  choices:
    A: Debe detenerse por completo antes de pasar.
    B: Debe cambiarse a un carril que no sea adyacente al vehículo si es posible,
      o reducir la velocidad significativamente.
    C: Debe acelerar para despejar el área rápidamente.
    D: La ley solo se aplica a las ambulancias, no a las grúas.
  answer: B
  explanation: La ley "Move Over" de Dakota del Norte exige que los conductores se
    muevan a un carril que no sea adyacente al vehículo de emergencia (incluyendo
    grúas y vehículos de mantenimiento) o que reduzcan la velocidad a una velocidad
    segura si no es posible cambiar de carril.
- id: 72
  category: safe_driving_rules
  question: ¿A cuántos pies de distancia debe estacionarse de un hidrante de incendios
    en Dakota del Norte?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: A
  explanation: La ley de Dakota del Norte prohíbe estacionarse a menos de 10 pies
    de un hidrante de incendios.
- id: 73
  category: safe_driving_rules
  question: 'Al acercarse a un vehículo que viene en sentido contrario por la noche,
    la ley de Dakota del Norte exige que baje sus luces altas (dim high beams) a una
    distancia de:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Debe cambiar sus faros a luces bajas cuando un vehículo que viene en
    sentido contrario se encuentre a menos de 500 pies.
- id: 74
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene con las luces rojas intermitentes
    y el brazo de parada extendido en una carretera con una mediana física o barrera,
    ¿deben detenerse los vehículos que viajan en la dirección opuesta?
  choices:
    A: Sí, siempre deben detenerse.
    B: No, no es obligatorio que se detengan.
    C: Sí, pero solo si hay más de dos carriles.
    D: No, pero deben reducir la velocidad a 15 mph.
  answer: B
  explanation: En Dakota del Norte, el conductor de un vehículo en una carretera con
    calzadas separadas (divididas por una barrera física o mediana) no necesita detenerse
    al encontrarse o pasar a un autobús escolar que se encuentra en una calzada diferente.
- id: 75
  category: safe_driving_rules
  question: Al entrar en una rotonda en Dakota del Norte, ¿quién tiene el derecho
    de paso?
  choices:
    A: El vehículo que entra en la rotonda.
    B: El vehículo a la derecha.
    C: El vehículo que ya está en el círculo.
    D: El vehículo que viaja a la velocidad más alta.
  answer: C
  explanation: En una rotonda, los conductores deben ceder el derecho de paso al tráfico
    que ya está circulando dentro del círculo.
- id: 76
  category: safe_driving_rules
  question: Según el Manual del Conductor de Dakota del Norte, ¿a qué velocidad puede
    comenzar el hidroplaneo (hydroplaning) bajo una lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El hidroplaneo (donde los neumáticos pierden contacto con la carretera
    y se deslizan sobre una capa de agua) puede comenzar a velocidades tan bajas como
    35 mph.
- id: 77
  category: safe_driving_rules
  question: 'En una carretera de varios carriles, la ley "Move Over" de Dakota del
    Norte exige que los conductores que se acerquen a un vehículo de emergencia estacionado
    con luces intermitentes:'
  choices:
    A: Se detengan por completo antes de pasar.
    B: Se muevan a un carril que no sea adyacente al vehículo de emergencia, si es
      seguro hacerlo.
    C: Mantengan la velocidad pero toquen la bocina para alertar a los trabajadores
      de emergencia.
    D: Aceleren para despejar el área rápidamente.
  answer: B
  explanation: La ley de Dakota del Norte exige que los conductores se muevan a un
    carril que no sea adyacente al vehículo de emergencia estacionado si la carretera
    tiene al menos dos carriles en la misma dirección y es seguro hacerlo.
- id: 78
  category: safe_driving_rules
  question: 'En Dakota del Norte, las vueltas en U están prohibidas en una curva o
    cerca de la cima de una colina si el vehículo no puede ser visto por otros conductores
    a una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las vueltas en U son ilegales en Dakota del Norte en cualquier curva
    o colina donde el vehículo no pueda ser visto por el conductor de cualquier otro
    vehículo que se acerque desde cualquier dirección dentro de los 500 pies.
- id: 79
  category: safe_driving_rules
  question: Al estacionar su vehículo cerca de un hidrante de incendios en Dakota
    del Norte, ¿cuál es la distancia mínima que debe mantener?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Dakota del Norte prohíbe estacionar un vehículo a menos de
    10 pies de un hidrante de incendios.
- id: 80
  category: safe_driving_rules
  question: Al acercarse a un autobús escolar desde cualquier dirección que tenga
    sus luces rojas intermitentes y el brazo de parada extendido, ¿a qué distancia
    debe detener su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: C
  explanation: En Dakota del Norte, los conductores deben detenerse al menos a 20
    pies de un autobús escolar que muestre luces rojas intermitentes o un brazo de
    parada extendido.
- id: 81
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima a la que debe estacionar su vehículo de una
    señal de alto (stop), una señal de ceda el paso (yield) o un semáforo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: La ley de Dakota del Norte establece que no se puede estacionar a menos
    de 15 pies de una señal de alto, una señal de ceda el paso o un semáforo.
- id: 82
  category: safe_driving_rules
  question: En una intersección no controlada donde dos vehículos llegan al mismo
    tiempo, ¿qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor en la carretera más transitada
    D: El conductor que viaja a mayor velocidad
  answer: B
  explanation: En las intersecciones no controladas en Dakota del Norte, el conductor
    del vehículo de la izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 83
  category: safe_driving_rules
  question: Al entrar en una rotonda en Dakota del Norte, ¿a quién debe cederle el
    paso?
  choices:
    A: Al tráfico que entra por la derecha
    B: Al tráfico que ya está en el círculo
    C: A nadie; usted tiene el derecho de paso
    D: Solo a los peatones, no a otros vehículos
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el derecho de
    paso al tráfico que ya está circulando dentro de la rotonda.
- id: 84
  category: safe_driving_rules
  question: Al estacionar su vehículo cuesta arriba en una calle de doble sentido
    con bordillo (curb), ¿hacia dónde debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: En dirección opuesta al bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba con un bordillo, gire las ruedas en dirección
    opuesta al bordillo para que, si el vehículo rueda, golpee el bordillo y se detenga.
- id: 85
  category: safe_driving_rules
  question: 'De acuerdo con la ley de "Hacerse a un lado" (Move Over) de Dakota del
    Norte, si se encuentra en una carretera de varios carriles y se aproxima a un
    vehículo de emergencia estacionado con luces intermitentes, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Aumentar la velocidad para pasar rápidamente
    C: Cambiarse a un carril que no sea adyacente al vehículo de emergencia si es
      seguro hacerlo
    D: Mantener su velocidad y carril
  answer: C
  explanation: La ley "Move Over" exige que los conductores se muevan a un carril
    que no sea adyacente al vehículo de emergencia estacionado en carreteras de varios
    carriles, o que reduzcan la velocidad significativamente si cambiar de carril
    no es seguro.
- id: 86
  category: safe_driving_rules
  question: 'En Dakota del Norte, puede rebasar a un vehículo por la derecha solo
    si:'
  choices:
    A: El vehículo de adelante está girando o está a punto de girar a la izquierda
      y hay un carril despejado
    B: Tiene prisa y el carril izquierdo está bloqueado
    '0': El vehículo de adelante conduce por debajo del límite de velocidad
    D: Se encuentra en una carretera de dos carriles y dos sentidos con un arcén de
      grava
  answer: A
  explanation: Rebasar por la derecha está permitido en Dakota del Norte cuando el
    vehículo que se adelanta está girando o está a punto de girar a la izquierda y
    hay un ancho suficiente de pavimento sin obstrucciones.
- id: 87
  category: defensive_driving
  question: Según el Manual del Conductor de Dakota del Norte, ¿cuál es la distancia
    de seguimiento recomendada detrás del vehículo que va delante de usted en condiciones
    normales de conducción?
  choices:
    A: El largo de un vehículo por cada 10 mph
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: C
  explanation: Dakota del Norte recomienda utilizar la "regla de los tres segundos"
    para mantener una distancia de seguimiento segura en condiciones normales de clima
    y carretera.
- id: 88
  category: defensive_driving
  question: 'Para evitar frenazos de último momento o la necesidad de girar repentinamente,
    las leyes y pautas de seguridad de Dakota del Norte sugieren observar el camino
    hacia adelante a qué distancia:'
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 12 segundos
    C: De 20 a 25 segundos
    D: 30 segundos
  answer: B
  explanation: El Manual del Conductor de Dakota del Norte establece que los conductores
    deben mirar unos 10 a 12 segundos por delante de su vehículo para identificar
    posibles peligros con anticipación.
- id: 89
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a producirse el hidroplaneo (hydroplaning)
    en las carreteras mojadas de Dakota del Norte, haciendo que los neumáticos pierdan
    contacto con el pavimento?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: Exactamente a 45 mph
    D: Solo durante tormentas eléctricas intensas
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 90
  category: defensive_driving
  question: En Dakota del Norte, ¿cuántos puntos se evalúan en su historial de conducción
    por la infracción de "Seguir demasiado de cerca"?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: De acuerdo con el sistema de puntos de Dakota del Norte, "Seguir demasiado
    de cerca" resulta en la adición de 2 puntos al historial del conductor.
- id: 91
  category: defensive_driving
  question: Si está conduciendo en North Dakota y experimenta un reventón de neumático,
    ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Frenar bruscamente de inmediato para detener el vehículo
    B: Poner el vehículo en punto muerto (neutral) y apagar el motor
    C: Sujetar el volante con firmeza y mantener el vehículo en línea recta
    D: Girar rápidamente hacia el arcén mientras frena
  answer: C
  explanation: Si un neumático revienta, debe sujetar el volante con firmeza, mantener
    el vehículo recto y reducir la velocidad gradualmente levantando el pie del acelerador.
- id: 92
  category: defensive_driving
  question: 'En North Dakota, se requiere que tenga los faros delanteros encendidos
    cuando la visibilidad es menor a:'
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: La ley de North Dakota exige que los faros delanteros estén encendidos
    desde el atardecer hasta el amanecer, y en cualquier otro momento en que la visibilidad
    sea inferior a 1,000 pies.
- id: 93
  category: defensive_driving
  question: Al conducir con niebla densa en North Dakota, ¿qué luces debe usar para
    mantener la mejor visibilidad?
  choices:
    A: Luces altas (faros de largo alcance)
    B: Luces bajas (faros de corto alcance)
    C: Solo las luces de estacionamiento
    D: Luces de emergencia (intermitentes)
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque la luz de las luces
    altas se refleja en las gotas de agua, lo que en realidad disminuye la visibilidad.
- id: 94
  category: defensive_driving
  question: ¿Cuántos puntos se asignan por 'No atenuar los faros delanteros' al encontrarse
    con otro vehículo o seguirlo en North Dakota?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: Ningún punto, solo una multa
  answer: A
  explanation: No atenuar los faros delanteros (cambiar de luces altas a bajas) en
    North Dakota conlleva una penalización de 1 punto en el registro de la licencia
    de conducir.
- id: 95
  category: defensive_driving
  question: 'En North Dakota, si su vehículo está equipado con un Sistema de Frenos
    Antibloqueo (ABS) y necesita detenerse rápidamente en una emergencia, usted debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y continua al pedal del freno
    C: Presionar ligeramente los frenos para evitar que se bloqueen
    D: Poner el vehículo en punto muerto y usar el freno de emergencia
  answer: B
  explanation: Con el sistema ABS, debe aplicar una presión firme y constante. No
    bombee los frenos, ya que esto desactivará la eficacia del sistema ABS.
- id: 96
  category: defensive_driving
  question: 'Según el Manual del Conductor de North Dakota, cuando otro vehículo lo
    está rebasando, usted debe:'
  choices:
    A: Acelerar para evitar que se incorporen demasiado cerca
    B: Moverse hacia el lado izquierdo de su carril
    C: Permanecer en su carril y mantener una velocidad constante
    D: Encender las luces altas para ayudarles a ver
  answer: C
  explanation: Cuando lo estén rebasando, debe mantener una velocidad constante y
    permanecer a la derecha para permitir que el otro conductor pase de manera segura.
- id: 97
  category: defensive_driving
  question: Para evitar el frenado de último minuto o la necesidad de girar repentinamente,
    los conductores de North Dakota deben mirar hacia adelante al menos ¿cuántos segundos?
  choices:
    A: De 3 a 5 segundos
    B: De 5 a 8 segundos
    C: De 10 a 15 segundos
    D: De 20 a 30 segundos
  answer: C
  explanation: Explorar la carretera de 10 a 15 segundos por delante le permite ver
    los peligros a tiempo y ajustar su velocidad o posición de manera segura.
- id: 98
  category: defensive_driving
  question: 'En North Dakota, los faros delanteros deben usarse desde el atardecer
    hasta el amanecer y siempre que la visibilidad sea menor a:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 1,000 pies
    D: 2,000 pies
  answer: C
  explanation: La ley de North Dakota exige que los faros delanteros estén encendidos
    durante el período comprendido entre el atardecer y el amanecer, y en cualquier
    otro momento en que la visibilidad sea inferior a 1,000 pies.
- id: 99
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning) en condiciones
    de lluvia intensa a medida que los neumáticos pierden contacto con la superficie
    de la carretera?
  choices:
    A: 25 mph
    B: 35 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph en
    lluvia intensa, y a 55 mph, los neumáticos pueden perder todo contacto con la
    carretera.
- id: 100
  category: defensive_driving
  question: Si queda atrapado en una tormenta de nieve en North Dakota, el manual
    recomienda que solo encienda el motor durante aproximadamente ¿cuántos minutos
    cada hora para obtener calefacción?
  choices:
    A: 5 minutos
    B: 10 minutos
    C: 20 minutos
    D: 30 minutos
  answer: B
  explanation: Para ahorrar combustible y prevenir el envenenamiento por monóxido
    de carbono mientras está atrapado en la nieve, encienda el motor solo unos 10
    minutos cada hora.
- id: 101
  category: defensive_driving
  question: ¿A cuántos pies de distancia, como mínimo, deben detenerse los conductores
    de Dakota del Norte de un autobús escolar que tiene las luces rojas intermitentes
    y el brazo de parada extendido en una carretera de dos carriles?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: C
  explanation: La ley de Dakota del Norte exige que los conductores se detengan al
    menos a 20 pies de un autobús escolar que tenga las luces rojas intermitentes
    y el brazo de parada extendido.
- id: 102
  category: defensive_driving
  question: Al estacionar su vehículo cuesta arriba junto a un bordillo (curb) en
    Dakota del Norte, ¿hacia qué lado debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba con un bordillo, gire las ruedas en dirección
    contraria al bordillo para que, si el vehículo rueda, la parte trasera de la llanta
    delantera golpee el bordillo y se detenga.
- id: 103
  category: defensive_driving
  question: Los camiones comerciales grandes tienen 'Zonas Prohibidas' (No-Zones).
    ¿Dónde se encuentran estas zonas?
  choices:
    A: Solo directamente detrás del camión
    B: Solo en el lado izquierdo del camión
    C: Directamente delante, detrás y a ambos lados del camión
    D: Solo en la parte delantera del camión
  answer: C
  explanation: La 'Zona Prohibida' (No-Zone) se refiere a los grandes puntos ciegos
    alrededor de un camión donde el conductor no puede ver a otros vehículos; estos
    se encuentran delante, detrás y a ambos lados.
- id: 104
  category: defensive_driving
  question: 'Al conducir sobre nieve o hielo en Dakota del Norte, la distancia de
    seguimiento debe aumentarse a por lo menos:'
  choices:
    A: 3 segundos
    B: 4 segundos
    C: De 6 a 8 segundos
    D: 15 segundos
  answer: C
  explanation: Debido a que las distancias de frenado aumentan significativamente
    en superficies resbaladizas, el manual de Dakota del Norte sugiere aumentar la
    distancia de seguimiento a 6-8 segundos o más.
- id: 105
  category: alcohol_drugs_health
  question: 'En Dakota del Norte, se considera que un conductor adulto (de 21 años
    o más) conduce bajo los efectos del alcohol si su concentración de alcohol en
    sangre (BAC) es igual o superior a:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Para los conductores de 21 años o más en Dakota del Norte, el límite
    legal de concentración de alcohol en sangre (BAC) es de 0.08%.
- id: 106
  category: alcohol_drugs_health
  question: 'Según la ley de Dakota del Norte, un DUI de ''alto nivel'' o ''agravado''
    se define como la operación de un vehículo motorizado con un BAC de al menos:'
  choices:
    A: 0.12%
    B: 0.15%
    C: 0.16%
    D: 0.20%
  answer: C
  explanation: La ley de Dakota del Norte impone sanciones más severas por un DUI
    'agravado', que se define como tener un BAC de 0.16% o superior.
- id: 107
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción en Dakota del Norte por una primera infracción de
    DUI si el BAC del conductor está entre 0.08% y 0.15%?
  choices:
    A: Una suspensión de la licencia por 30 días y una multa de $100
    B: Una suspensión de la licencia por 91 días y una multa de $500
    C: Una suspensión de la licencia por 180 días y una multa de $750
    D: Una suspensión de la licencia por 1 año y tiempo de cárcel obligatorio
  answer: B
  explanation: Para una primera infracción de DUI con un BAC entre 0.08% y 0.15%,
    la ley de Dakota del Norte exige una multa de $500 y una suspensión de la licencia
    por 91 días.
- id: 108
  category: alcohol_drugs_health
  question: Si un conductor de Dakota del Norte es condenado por una primera infracción
    de DUI con un BAC de 0.16% o superior, ¿cuál es la sentencia mínima obligatoria
    de cárcel?
  choices:
    A: Sin tiempo de cárcel obligatorio
    B: 2 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: Una primera infracción de DUI con un BAC de 0.16% o superior (agravado)
    conlleva un mínimo obligatorio de 2 días de cárcel y una multa de $750.
- id: 109
  category: alcohol_drugs_health
  question: 'La ley de ''Control Físico Real'' (Actual Physical Control) de Dakota
    del Norte significa que usted puede ser arrestado por DUI incluso si:'
  choices:
    A: Está durmiendo en el vehículo con las llaves en su poder
    B: Está de pie junto al vehículo
    C: Es el pasajero del vehículo
    D: No ha consumido nada de alcohol
  answer: A
  explanation: En Dakota del Norte, se le puede acusar de tener el 'control físico
    real' de un vehículo bajo los efectos del alcohol, incluso si el vehículo no está
    en movimiento, si tiene la capacidad de operarlo (por ejemplo, estar sentado en
    el asiento del conductor con las llaves).
- id: 110
  category: alcohol_drugs_health
  question: ¿Cuál es el límite máximo de BAC para una persona que opera un vehículo
    motorizado comercial en Dakota del Norte?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Los titulares de licencias de conducir comerciales (CDL) están sujetos
    a un límite de BAC más estricto de 0.04% mientras operan un vehículo comercial.
- id: 111
  category: alcohol_drugs_health
  question: 'Según la ley de "Envase Abierto" (Open Container) de Dakota del Norte,
    es ilegal poseer una botella o receptáculo abierto que contenga bebidas alcohólicas
    en:'
  choices:
    A: Solo en el maletero
    B: Solo en la guantera
    C: El área de pasajeros de cualquier vehículo motorizado en una vía pública
    D: Solo en la caja de una camioneta pickup
  answer: C
  explanation: La ley de Dakota del Norte prohíbe que cualquier persona tenga un envase
    abierto de una bebida alcohólica en el área de pasajeros de un vehículo motorizado
    mientras se encuentre en una vía pública o en un área utilizada por el público.
- id: 112
  category: alcohol_drugs_health
  question: ¿Si está tomando un medicamento recetado y este afecta su capacidad de
    conducir, puede ser acusado de DUI en Dakota del Norte?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, las leyes de DUI solo se aplican al alcohol y a las drogas ilegales
    C: Sí, es ilegal conducir bajo la influencia de cualquier droga que lo incapacite
      para conducir de manera segura
    D: Solo si también consumió alcohol
  answer: C
  explanation: La ley de Dakota del Norte establece que es ilegal conducir bajo la
    influencia de cualquier droga, incluidos los medicamentos recetados o de venta
    libre, si estos afectan su capacidad para conducir de manera segura.
- id: 113
  category: alcohol_drugs_health
  question: En Dakota del Norte, ¿cuál es el periodo de suspensión obligatoria de
    la licencia por una segunda infracción de DUI en un periodo de siete años (con
    un BAC inferior al 0.16%)?
  choices:
    A: 180 días
    B: 365 días
    C: 2 años
    D: 5 años
  answer: B
  explanation: Una segunda condena por DUI en un plazo de siete años da lugar a una
    suspensión de la licencia de 365 días (un año) si el BAC era inferior al 0.16%.
- id: 114
  category: alcohol_drugs_health
  question: Al consumir alcohol, ¿cuál de las siguientes capacidades suele ser la
    primera en verse afectada?
  choices:
    A: La visión
    B: La coordinación muscular
    C: El juicio
    D: La audición
  answer: C
  explanation: El juicio es la primera función que se ve afectada por el alcohol.
    Los conductores pueden correr riesgos que de otro modo no correrían y es posible
    que no se den cuenta de que sus capacidades están disminuyendo.
- id: 115
  category: alcohol_drugs_health
  question: ¿Qué es el "efecto sinérgico" (synergistic effect) en el contexto de la
    seguridad al conducir?
  choices:
    A: El efecto del alcohol que desaparece con el tiempo
    B: El efecto combinado del alcohol y otra droga que es mayor que la suma de sus
      efectos individuales
    C: La capacidad del cuerpo para procesar una bebida por hora
    D: La mejora de la visión causada por dosis bajas de estimulantes
  answer: B
  explanation: El efecto sinérgico ocurre cuando se mezclan el alcohol y las drogas
    (legales o ilegales), lo que provoca un nivel de deterioro mucho más grave que
    el que causaría cualquiera de las sustancias por sí sola.
- id: 116
  category: alcohol_drugs_health
  question: 'En Dakota del Norte, si usted es menor de 21 años y es condenado por
    "Menor en posesión" (Minor in Possession) o "Menor en consumo" (Minor in Consumption)
    de alcohol, su licencia de conducir será:'
  choices:
    A: Suspendida por 30 días por una primera infracción
    B: Suspendida por 180 días por una primera infracción
    C: Revocada hasta que cumpla 21 años
    D: No se verá afectada a menos que estuviera conduciendo
  answer: B
  explanation: Dakota del Norte tiene leyes estrictas para los menores; una primera
    infracción de Menor en Posesión/Consumo resulta en una suspensión de la licencia
    de 180 días, incluso si el menor no estaba operando un vehículo.
- id: 117
  category: alcohol_drugs_health
  question: 'Toda persona condenada por un DUI en Dakota del Norte está obligada por
    ley a someterse a:'
  choices:
    A: Un nuevo examen de conducir
    B: Una evaluación de adicciones
    C: Un examen de equivalencia de escuela secundaria
    D: Un examen de la vista cada mes durante un año
  answer: B
  explanation: La ley de Dakota del Norte exige que todos los infractores de DUI se
    sometan a una evaluación de adicciones en un centro autorizado para determinar
    el alcance de su consumo de alcohol o drogas.
- id: 118
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol la visión periférica de un conductor?
  choices:
    A: La mejora al hacer que el conductor esté más alerta
    B: No tiene ningún efecto sobre la visión periférica
    C: Estrecha el campo de visión, lo que provoca una "visión de túnel" (tunnel vision)
    D: Hace que los objetos periféricos parezcan más cercanos de lo que están
  answer: C
  explanation: El consumo de alcohol estrecha la visión lateral (periférica) del conductor,
    lo que a menudo se denomina "visión de túnel", lo que dificulta ver los peligros
    que provienen de los lados.
- id: 119
  category: alcohol_drugs_health
  question: Si tiene una afección médica como la epilepsia que provoca la pérdida
    del conocimiento, la ley de Dakota del Norte exige que esté libre de convulsiones
    ¿durante cuánto tiempo antes de poder conducir legalmente?
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: C
  explanation: En Dakota del Norte, las personas con afecciones que causan pérdida
    del conocimiento (como la epilepsia) generalmente deben estar libres de convulsiones
    durante 6 meses y presentar una evaluación médica para ser elegibles para una
    licencia.
- id: 120
  category: alcohol_drugs_health
  question: En Dakota del Norte, ¿cuál es la duración de la suspensión de la licencia
    por una primera infracción de DUI con una concentración de alcohol en sangre (BAC)
    entre 0.08% y 0.17%?
  choices:
    A: 30 días
    B: 60 días
    C: 91 días
    D: 180 días
  answer: C
  explanation: Para una primera infracción de DUI en Dakota del Norte con un BAC entre
    0.08% y 0.17%, la licencia de conducir se suspende por 91 días.
- id: 121
  category: alcohol_drugs_health
  question: Según la ley de Dakota del Norte, se considera que un conductor comete
    un 'DUI agravado' si su concentración de alcohol en sangre (BAC) es igual o superior
    a ¿qué nivel?
  choices:
    A: 0.10%
    B: 0.15%
    C: 0.16%
    D: 0.20%
  answer: C
  explanation: Dakota del Norte define un 'DUI agravado' como la operación de un vehículo
    con un BAC de 0.16% o superior, lo cual conlleva sanciones más severas que un
    DUI estándar.
- id: 122
  category: alcohol_drugs_health
  question: Si un conductor de Dakota del Norte es condenado por una segunda infracción
    de DUI en un periodo de 7 años y su BAC era inferior al 0.18%, ¿por cuánto tiempo
    se suspenderá su licencia?
  choices:
    A: 180 días
    B: 365 días
    C: 2 años
    D: 3 años
  answer: B
  explanation: Una segunda infracción de DUI en un plazo de 7 años resulta en una
    suspensión de 365 días si el BAC era inferior al 0.18%.
- id: 123
  category: alcohol_drugs_health
  question: En Dakota del Norte, ¿cuál es la multa mínima por una primera infracción
    de DUI con un BAC de 0.16% o superior?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: Para una primera infracción con un BAC de 0.16% o superior (DUI agravado),
    la ley de Dakota del Norte exige una multa mínima de $750.
- id: 124
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de Dakota del Norte, ¿qué es lo primero
    que se ve afectado después de beber alcohol?
  choices:
    A: La visión
    B: La coordinación
    C: El juicio
    D: El tiempo de reacción
  answer: C
  explanation: El alcohol afecta primero el juicio y las capacidades de razonamiento
    de una persona, los cuales son fundamentales para una conducción segura.
- id: 125
  category: alcohol_drugs_health
  question: En Dakota del Norte, ¿cuál de los siguientes requisitos debe cumplir cualquier
    persona condenada por un DUI antes de que se pueda restablecer su licencia?
  choices:
    A: Un nuevo examen de conducir
    B: Una evaluación de adicciones
    C: Una verificación del diploma de escuela secundaria
    D: Una prueba de aptitud física
  answer: B
  explanation: La ley de Dakota del Norte exige que todas las personas condenadas
    por un DUI completen una evaluación de adicciones en un centro autorizado.
- id: 126
  category: alcohol_drugs_health
  question: Según la ley de Dakota del Norte, un conductor puede ser acusado de DUI
    por estar bajo la influencia de ¿cuál de los siguientes?
  choices:
    A: Solo alcohol
    B: Solo drogas ilegales
    C: Solo medicamentos recetados
    D: Alcohol, drogas ilegales o medicamentos recetados o de venta libre
  answer: D
  explanation: Un cargo de DUI puede resultar de estar bajo la influencia del alcohol,
    cualquier sustancia controlada o cualquier otra droga (incluyendo medicamentos
    recetados o de venta libre) que incapacite a la persona para conducir de manera
    segura.
- id: 127
  category: alcohol_drugs_health
  question: En Dakota del Norte, si usted está involucrado en un DUI mientras un niño
    menor de ____ años está en el vehículo, la infracción se eleva a un delito menor
    de Clase A.
  choices:
    A: '12'
    B: '14'
    C: '16'
    D: '18'
  answer: C
  explanation: La ley de Dakota del Norte aumenta la gravedad de un DUI a un delito
    menor de Clase A si hay un pasajero menor de 16 años en el vehículo al momento
    de la infracción.
- id: 128
  category: alcohol_drugs_health
  question: ¿Qué sucede si un conductor de Dakota del Norte es condenado por un DUI
    y ya está participando en el Programa de Sobriedad 24/7?
  choices:
    A: Queda exento de multas adicionales.
    B: Puede enfrentar el encarcelamiento inmediato por una violación del programa.
    C: Su licencia se devuelve automáticamente.
    D: Ya no necesita una evaluación de adicciones.
  answer: B
  explanation: El Programa de Sobriedad 24/7 es una condición de la fianza o la sentencia;
    las violaciones (como un nuevo DUI o fallar una prueba) generalmente resultan
    en tiempo de cárcel inmediato.
- id: 129
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado y un médico no le ha advertido
    sobre la conducción, ¿qué debe hacer?
  choices:
    A: Asumir que es seguro conducir.
    B: Conducir solo durante las horas del día.
    C: Revisar la etiqueta para ver las advertencias o preguntar a un farmacéutico
      antes de conducir.
    D: Beber café para contrarrestar cualquier posible somnolencia.
  answer: C
  explanation: Es responsabilidad del conductor conocer los efectos de cualquier medicamento
    que tome. Siempre revise las etiquetas o consulte a un profesional sobre los efectos
    secundarios como la somnolencia o la visión borrosa.
- id: 130
  category: alcohol_drugs_health
  question: En Dakota del Norte, ¿cuánto tiempo dura la revocación de la licencia
    por una segunda negativa a someterse a una prueba química en un periodo de 7 años?
  choices:
    A: 180 días
    B: 1 año
    C: 2 años
    D: 3 años
  answer: D
  explanation: Bajo la ley de Consentimiento Implícito de Dakota del Norte, una segunda
    negativa a someterse a una prueba química en un plazo de 7 años resulta en una
    revocación de la licencia por 3 años.
- id: 131
  category: penalties_and_points
  question: Por cada período de ____ meses durante el cual a un conductor de Dakota
    del Norte no se le asignen puntos, su total de puntos se reduce en un punto.
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: A
  explanation: La ley de Dakota del Norte permite una reducción de un punto por cada
    período de tres meses de conducción sin infracciones.
- id: 132
  category: penalties_and_points
  question: En Dakota del Norte, ¿una condena por 'Conducción Temeraria' (Reckless
    Driving) resulta en cuántos puntos en su historial de conducción?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: La conducción temeraria es una infracción grave en Dakota del Norte
    y resulta en la asignación de 8 puntos contra la licencia del conductor.
- id: 133
  category: penalties_and_points
  question: ¿Cuál es la penalización de puntos por 'Conducción de Exhibición' (Exhibition
    Driving) en Dakota del Norte?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 6 puntos
  answer: C
  explanation: La conducción de exhibición, que incluye ruido innecesario del motor
    o chirrido de neumáticos, resulta en 3 puntos en el historial de conducción de
    Dakota del Norte.
- id: 134
  category: penalties_and_points
  question: ¿Cuál es la multa estándar para un conductor adulto (mayor de 18 años)
    que no usa el cinturón de seguridad en Dakota del Norte?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: En Dakota del Norte, la multa por una infracción del cinturón de seguridad
    para personas de 18 años o más es de $20.
- id: 135
  category: penalties_and_points
  question: Si usted está involucrado en un accidente que resulta en daños a la propiedad
    y no se detiene, ¿cuántos puntos se asignan en Dakota del Norte?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 9 puntos
    D: 12 puntos
  answer: B
  explanation: No detenerse en la escena de un accidente que involucre daños a la
    propiedad resulta en 6 puntos en su historial de conducción de Dakota del Norte.
- id: 136
  category: penalties_and_points
  question: En Dakota del Norte, ¿una condena por huir o intentar eludir a un oficial
    de la paz resulta en cuál de los siguientes?
  choices:
    A: 6 puntos
    B: 12 puntos
    C: 24 puntos y revocación de la licencia
    D: Solo una multa de $50
  answer: C
  explanation: Huir o intentar eludir a un oficial de la paz es una infracción grave
    que conlleva 24 puntos, lo que conduce a la revocación inmediata de la licencia.
- id: 137
  category: penalties_and_points
  question: ¿Con qué frecuencia puede un conductor de Dakota del Norte completar un
    curso aprobado de conducción defensiva para reducir los puntos en su historial?
  choices:
    A: Una vez cada 6 meses
    B: Una vez cada 12 meses
    C: Una vez cada 2 años
    D: Una vez cada 5 años
  answer: B
  explanation: Un conductor puede asistir a un curso de conducción defensiva para
    una reducción de 3 puntos solo una vez cada 12 meses.
- id: 138
  category: penalties_and_points
  question: Cuando el historial de un conductor de Dakota del Norte alcanza los 12
    puntos, la licencia se suspende. Para los primeros 12 puntos, ¿cuánto dura el
    período de suspensión por cada punto por encima de 11?
  choices:
    A: 1 día
    B: 7 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: En Dakota del Norte, cuando se suspende una licencia por puntos, la
    duración es de 7 días por cada punto por encima de 11 (para la primera suspensión).
- id: 139
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'Seguir Demasiado Cerca' (Following Too
    Closely) en Dakota del Norte?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Seguir demasiado cerca (tailgating) resulta en la adición de 2 puntos
    al historial del conductor en Dakota del Norte.
- id: 140
  category: penalties_and_points
  question: En Dakota del Norte, ¿cuántos puntos se asignan en su historial de conducción
    por exceder el límite de velocidad indicado de 21 a 25 mph?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: De acuerdo con el sistema de puntos de Dakota del Norte, exceder el
    límite de velocidad de 21 a 25 mph resulta en la adición de 3 puntos a su historial
    de conducción.
- id: 141
  category: penalties_and_points
  question: ¿Cuál es la penalización de puntos por no detenerse ante un autobús escolar
    que muestra luces rojas intermitentes o un brazo de parada en Dakota del Norte?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Rebasar un autobús escolar mientras sus luces rojas parpadean o el
    brazo de parada está extendido es una infracción grave en Dakota del Norte y conlleva
    una penalización de 6 puntos.
- id: 142
  category: penalties_and_points
  question: Según la ley de Dakota del Norte, ¿cuál es la multa estándar para un conductor
    adulto por una primera infracción de la prohibición de enviar mensajes de texto
    mientras conduce?
  choices:
    A: $20
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: La multa por enviar mensajes de texto mientras se conduce en Dakota
    del Norte es de $100 para todos los conductores.
- id: 143
  category: penalties_and_points
  question: Por cada período de _____ meses durante los cuales un conductor no cometa
    infracciones de tránsito, se eliminará un punto de su historial de conducción
    de Dakota del Norte.
  choices:
    A: '3'
    B: '6'
    C: '12'
    D: '24'
  answer: A
  explanation: Dakota del Norte reduce el total de puntos de un conductor en un punto
    por cada período de tres meses en el que no se registren puntos contra la licencia.
- id: 144
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por participar en una competencia de velocidad
    (drag racing) en una carretera de Dakota del Norte?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: C
  explanation: Participar en una competencia de velocidad o carreras clandestinas
    (drag racing) en vías públicas en Dakota del Norte resulta en la adición de 10
    puntos al historial del conductor.
- id: 145
  category: penalties_and_points
  question: En Dakota del Norte, ¿cuántos puntos resultan de abandonar la escena de
    un accidente que involucra solo daños a la propiedad?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Abandonar la escena de un accidente que involucra daños a la propiedad
    es una infracción de 6 puntos en Dakota del Norte.
- id: 146
  category: penalties_and_points
  question: En Dakota del Norte, ¿cuántos puntos resultan de no ceder el paso en una
    intersección?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: A
  explanation: No ceder el paso en una intersección (excepto cuando se trata de un
    vehículo de emergencia) resulta en 2 puntos en Dakota del Norte.
- id: 147
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una condena por conducir mientras su licencia
    está bajo suspensión o revocación en Dakota del Norte?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: B
  explanation: Conducir mientras una licencia está suspendida o revocada resulta en
    la adición de 4 puntos al historial del conductor en Dakota del Norte.
- id: 148
  category: sharing_the_road
  question: En Dakota del Norte, cuando un autobús escolar se detiene en una carretera
    de dos carriles con sus luces rojas intermitentes y el brazo de parada extendido,
    ¿qué vehículos deben detenerse?
  choices:
    A: Solo los vehículos que siguen al autobús
    B: Solo los vehículos que se aproximan por delante
    C: Los vehículos en ambas direcciones
    D: Ningún vehículo necesita detenerse si el límite de velocidad es superior a
      40 mph
  answer: C
  explanation: Según el Manual del Conductor de Dakota del Norte, en una carretera
    de dos carriles, todo el tráfico en ambas direcciones debe detenerse ante un autobús
    escolar con luces rojas intermitentes y un brazo de parada extendido.
- id: 149
  category: sharing_the_road
  question: Según la ley de 'Hacerse a un lado' (Move Over) de Dakota del Norte, ¿qué
    debe hacer un conductor al acercarse a un vehículo de emergencia estacionado que
    muestra luces intermitentes en una carretera de varios carriles?
  choices:
    A: Mantener la velocidad y permanecer en el carril actual
    B: Moverse a un carril que no sea adyacente al vehículo de emergencia, si es seguro
      hacerlo
    C: Detenerse inmediatamente en medio de la carretera
    D: Acelerar para rebasar el vehículo lo más rápido posible
  answer: B
  explanation: La ley de Dakota del Norte exige que los conductores se muevan a un
    carril que no sea adyacente al vehículo de emergencia estacionado o que reduzcan
    la velocidad significativamente si cambiar de carril no es seguro.
- id: 150
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que un conductor debe mantener al seguir
    a un camión de bomberos que responde a una alarma en Dakota del Norte?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Código del Siglo de Dakota del Norte (ND Century Code) 39-10-57
    establece que es ilegal seguir a cualquier equipo de bomberos que viaje en respuesta
    a una alarma de incendio a una distancia menor de 500 pies.
- id: 151
  category: sharing_the_road
  question: ¿En Dakota del Norte, quién está legalmente obligado a usar casco mientras
    opera o viaja en una motocicleta?
  choices:
    A: Todos los conductores independientemente de su edad
    B: Solo el operador, no el pasajero
    C: Solo las personas menores de 18 años
    D: Solo las personas con menos de 2 años de experiencia
  answer: C
  explanation: La ley de Dakota del Norte exige que todos los operadores y pasajeros
    de motocicletas menores de 18 años usen un casco que cumpla con los estándares
    del DOT.
- id: 152
  category: sharing_the_road
  question: 'Al rebasar una bicicleta en Dakota del Norte, el conductor de un vehículo
    motorizado debe dejar:'
  choices:
    A: Al menos 1 pie de espacio
    B: Una distancia segura
    C: Exactamente 5 pies de espacio
    D: No se requiere una distancia específica
  answer: B
  explanation: El Código del Siglo de ND 39-10-11.1 exige que el operador de un vehículo
    motorizado que adelante a una bicicleta deje una "distancia segura" entre el vehículo
    motorizado y la bicicleta.
- id: 153
  category: sharing_the_road
  question: En una carretera con una mediana física o barrera, ¿cuándo NO es necesario
    detenerse ante un autobús escolar con luces rojas intermitentes?
  choices:
    A: Cuando usted está detrás del autobús
    B: Cuando viaja en la dirección opuesta al autobús
    C: Siempre debe detenerse independientemente de la mediana
    D: Solo si el conductor del autobús le indica que pase
  answer: B
  explanation: En Dakota del Norte, si una carretera está dividida por una barrera
    física o mediana, el tráfico que viaja en la dirección opuesta a un autobús escolar
    no está obligado a detenerse.
- id: 154
  category: sharing_the_road
  question: ¿Qué debe hacer si ve a un peatón con un bastón blanco o un perro guía
    en una intersección?
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo y ceder el derecho de paso
    D: Rodearlos si hay suficiente espacio
  answer: C
  explanation: Los conductores deben detenerse por completo y ceder el derecho de
    paso a cualquier peatón ciego que lleve un bastón blanco o utilice un perro guía.
- id: 155
  category: sharing_the_road
  question: 'En Dakota del Norte, las motocicletas tienen derecho a:'
  choices:
    A: Solo la mitad izquierda de un carril
    B: Solo la mitad derecha de un carril
    C: El ancho total de un carril
    D: Compartir un carril con un automóvil de pasajeros
  answer: C
  explanation: Las motocicletas tienen derecho al uso total de un carril, y es ilegal
    que un vehículo motorizado conduzca de una manera que prive a una motocicleta
    del uso total de un carril.
- id: 156
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, es posible que el camión necesite:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Abrirse hacia la izquierda para completar el giro
    C: Detenerse y retroceder para hacer el giro
    D: Girar solo desde el carril izquierdo
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para no tocar el bordillo al realizar un giro a la derecha. Los conductores deben
    evitar "apretarse" entre el camión y el bordillo.
- id: 157
  category: sharing_the_road
  question: 'Según la ley de Dakota del Norte, un ciclista que circula por una calzada
    tiene:'
  choices:
    A: Ningún derecho legal en la carretera
    B: Los mismos derechos y responsabilidades que el conductor de un vehículo motorizado
    C: El derecho de paso sobre todos los vehículos motorizados en todo momento
    D: El requisito de circular únicamente por la acera
  answer: B
  explanation: Los ciclistas en Dakota del Norte tienen los mismos derechos y están
    sujetos a los mismos deberes que los conductores de vehículos motorizados.
- id: 158
  category: sharing_the_road
  question: Al seguir a una motocicleta, debe dejar ________ distancia de seguimiento
    que la que dejaría para un automóvil de pasajeros.
  choices:
    A: Menos
    B: La misma
    C: Más
    D: Exactamente 10 pies
  answer: C
  explanation: Debido a que las motocicletas pueden detenerse más rápidamente y se
    ven más afectadas por las condiciones de la carretera, debe dejar más distancia
    de seguimiento (al menos 3 a 4 segundos) cuando esté detrás de ellas.
- id: 159
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Dirigirse al borde derecho de la carretera y detenerse
    C: Acelerar para quitarse del camino
    D: Dirigirse al borde izquierdo de la carretera y detenerse
  answer: B
  explanation: La ley de Dakota del Norte exige que los conductores cedan el derecho
    de paso dirigiéndose al borde o bordillo derecho de la carretera, despejando las
    intersecciones, y deteniéndose hasta que el vehículo de emergencia haya pasado.
- id: 160
  category: sharing_the_road
  question: 'La "Zona Prohibida" (No-Zone) se refiere a:'
  choices:
    A: Áreas donde el estacionamiento está prohibido
    B: Los puntos ciegos alrededor de camiones grandes y autobuses
    C: Zonas escolares durante las vacaciones de verano
    D: El área directamente frente a una estación de policía
  answer: B
  explanation: La "Zona Prohibida" (No-Zone) representa los grandes puntos ciegos
    alrededor de la parte delantera, trasera y laterales de los camiones y autobuses
    donde el conductor no puede ver a otros vehículos.
- id: 161
  category: sharing_the_road
  question: 'En Dakota del Norte, un ciclista puede indicar un giro a la derecha:'
  choices:
    A: Extendiendo el brazo izquierdo hacia arriba
    B: Extendiendo el brazo derecho horizontalmente
    C: Ya sea la A o la B
    D: Los ciclistas no están obligados a señalar los giros
  answer: C
  explanation: La ley de Dakota del Norte permite a los ciclistas señalar un giro
    a la derecha extendiendo el brazo izquierdo hacia arriba o extendiendo el brazo
    derecho horizontalmente hacia la derecha.
- id: 162
  category: sharing_the_road
  question: ¿Bajo la ley de Dakota del Norte, cuándo NO es obligatorio que un conductor
    se detenga ante un autobús escolar con las luces rojas intermitentes y el brazo
    de parada extendido?
  choices:
    A: Cuando el autobús está en el lado opuesto de una carretera dividida por un
      camellón (mediana) o barrera
    B: Cuando el conductor tiene prisa y no hay niños cruzando
    C: Cuando el autobús está detenido en una zona escolar
    D: Cuando la carretera tiene al menos tres carriles de circulación
  answer: A
  explanation: Los conductores que viajan en la dirección opuesta en una carretera
    dividida por una barrera física o camellón no están obligados a detenerse ante
    un autobús escolar, aunque deben proceder con precaución.
- id: 163
  category: sharing_the_road
  question: En Dakota del Norte, ¿cuál es la sanción por la primera infracción de
    'Rebasar o Adelantar a un Autobús Escolar' cuando las luces rojas están parpadeando?
  choices:
    A: Una multa de $50 y 2 puntos
    B: Una multa de $100 y 6 puntos
    C: Una multa de $20 y 1 punto
    D: Una multa de $500 y 12 puntos
  answer: B
  explanation: Rebasar un autobús escolar con las luces rojas intermitentes es una
    infracción grave en Dakota del Norte, lo que resulta en una multa mínima de $100
    y la asignación de 6 puntos en el historial del conductor.
- id: 164
  category: sharing_the_road
  question: Al acercarse a un vehículo de emergencia estacionario con sus luces intermitentes
    activadas en una carretera de carriles múltiples en Dakota del Norte, ¿qué debe
    hacer?
  choices:
    A: Mantener la velocidad pero tocar la bocina
    B: Detenerse inmediatamente en su carril
    C: Cambiarse a un carril que no sea adyacente al vehículo, si es seguro hacerlo
    D: Aumentar la velocidad para pasar el vehículo rápidamente
  answer: C
  explanation: La 'Ley de Moverse a un Lado' (Move Over Law) de Dakota del Norte exige
    que los conductores se muevan a un carril que no sea adyacente al vehículo de
    emergencia si es posible. Si cambiar de carril no es seguro, el conductor debe
    reducir la velocidad y proceder con precaución.
- id: 165
  category: sharing_the_road
  question: Según el Manual del Conductor de Dakota del Norte, ¿cuánta distancia de
    seguimiento debe mantener detrás de una motocicleta?
  choices:
    A: Al menos la longitud de un automóvil
    B: Al menos dos segundos
    C: Al menos de tres a cuatro segundos
    D: Exactamente 50 pies
  answer: C
  explanation: Debido a que las motocicletas pueden detenerse más rápido que los automóviles
    y son más susceptibles a los peligros de la carretera, Dakota del Norte recomienda
    una distancia de seguimiento de al menos tres a cuatro segundos.
- id: 166
  category: sharing_the_road
  question: 'En Dakota del Norte, los vehículos que viajan en un cortejo fúnebre tienen
    el derecho de paso en las intersecciones EXCEPTO:'
  choices:
    A: Cuando se acerca un vehículo de emergencia con sirenas
    B: Durante las horas pico
    C: Cuando el semáforo está en rojo
    D: Cuando hay más de 10 automóviles
  answer: A
  explanation: El Código del Siglo de Dakota del Norte 39-10-72 establece que los
    cortejos fúnebres tienen el derecho de paso, pero aun así deben cederlo a los
    vehículos de emergencia autorizados que utilicen las señales adecuadas.
- id: 167
  category: sharing_the_road
  question: En Dakota del Norte, ¿cómo es el emblema de 'vehículo de movimiento lento'?
  choices:
    A: Un círculo azul
    B: Una señal cuadrada verde
    C: Una señal triangular de color naranja rojizo
    D: Una señal rectangular blanca
  answer: C
  explanation: Los vehículos de movimiento lento, como la maquinaria agrícola o el
    equipo de construcción de carreteras diseñado para viajar a 25 mph o menos, deben
    exhibir un emblema triangular de color naranja rojizo fluorescente con un borde
    reflectante.
- id: 168
  category: sharing_the_road
  question: 'Bajo la ley de Dakota del Norte, los ciclistas en la vía pública:'
  choices:
    A: Deben circular siempre por la acera
    B: Tienen los mismos derechos y responsabilidades que los conductores de vehículos
      motorizados
    C: Deben circular en sentido contrario al flujo del tráfico
    D: No se les permite circular en ninguna carretera con un límite de velocidad
      superior a 25 mph
  answer: B
  explanation: En Dakota del Norte, las bicicletas se consideran vehículos cuando
    se operan en una vía pública y los ciclistas tienen todos los derechos y deberes
    aplicables al conductor de cualquier otro vehículo.
- id: 169
  category: sharing_the_road
  question: ¿Qué son las 'Zonas Prohibidas' (No-Zones) alrededor de camiones grandes
    y autobuses?
  choices:
    A: Áreas donde está prohibido estacionar
    B: Puntos ciegos donde el conductor del camión no puede verlo
    C: Zonas de velocidad restringida para camiones
    D: Zonas de carga en almacenes
  answer: B
  explanation: La 'Zona Prohibida' se refiere a los grandes puntos ciegos alrededor
    de la parte delantera, trasera y laterales de los camiones y autobuses donde la
    visibilidad del conductor es limitada o inexistente.
- id: 170
  category: sharing_the_road
  question: 'Cuando un peatón cruza la calle guiado por un perro o lleva un bastón
    blanco (con o sin punta roja), los conductores de Dakota del Norte deben:'
  choices:
    A: Tocar la bocina para avisarles que usted está allí
    B: Ceder el derecho de paso y tomar precauciones para evitar lesiones
    C: Solo detenerse si hay un paso de peatones marcado
    D: Conducir alrededor de ellos lentamente
  answer: B
  explanation: La ley de Dakota del Norte exige que los conductores cedan el derecho
    de paso a cualquier peatón total o parcialmente ciego que lleve un bastón o utilice
    un perro guía.
- id: 171
  category: sharing_the_road
  question: En Dakota del Norte, si está rebasando una bicicleta, ¿cuánto espacio
    debe dejar como mínimo entre su vehículo y la bicicleta?
  choices:
    A: 1 pie
    B: Una distancia segura
    C: Exactamente 10 pies
    D: No se requiere una distancia específica
  answer: B
  explanation: La ley de Dakota del Norte exige que los conductores rebasen una bicicleta
    a una "distancia segura" y no interfieran con la operación segura de la bicicleta
    que se está adelantando.
- id: 172
  category: sharing_the_road
  question: Cuando un autobús escolar se prepara para detenerse y activa sus luces
    intermitentes ámbar (amarillas), ¿qué debe hacer un conductor de Dakota del Norte?
  choices:
    A: Acelerar para pasar antes de que se enciendan las luces rojas
    B: Detenerse inmediatamente
    C: Prepararse para detenerse, ya que el autobús está a punto de activar las luces
      rojas
    D: Ignorarlas, ya que son solo una advertencia para el conductor del autobús
  answer: C
  explanation: Las luces intermitentes ámbar son una advertencia previa de que el
    autobús se está preparando para detenerse para subir o bajar niños. Los conductores
    deben reducir la velocidad y estar preparados para detenerse cuando se activen
    las luces rojas.
- id: 173
  category: sharing_the_road
  question: 'En Dakota del Norte, debe ceder el derecho de paso a cualquier vehículo
    que forme parte de una cuadrilla de mantenimiento de carreteras que muestre:'
  choices:
    A: Una bandera verde
    B: Luces intermitentes ámbar, blancas o verdes
    C: Un reflector rojo
    D: Una señal de "Lento" (Slow)
  answer: B
  explanation: Los vehículos de mantenimiento y construcción de Dakota del Norte suelen
    utilizar luces intermitentes ámbar, blancas y, a veces, verdes. Los conductores
    deben ceder el paso y tener precaución adicional al acercarse a estos vehículos.
- id: 174
  category: vehicle_information
  question: Según la ley de Dakota del Norte, ¿cuándo deben encenderse las luces delanteras
    de un vehículo?
  choices:
    A: Desde una hora después del atardecer hasta una hora antes del amanecer
    B: Solo cuando esté lloviendo o nevando
    C: Desde el atardecer hasta el amanecer y siempre que la visibilidad sea inferior
      a 1,000 pies
    D: Solo cuando se conduce por carreteras rurales
  answer: C
  explanation: El Código del Siglo de Dakota del Norte 39-21-01 exige que las luces
    delanteras estén encendidas desde el atardecer hasta el amanecer, y en cualquier
    otro momento en que la visibilidad no sea suficiente para ver personas o vehículos
    a una distancia de 1,000 pies.
- id: 175
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    de un vehículo de pasajeros en Dakota del Norte?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: El Código del Siglo de Dakota del Norte 39-21-40 establece que un neumático
    se considera inseguro si tiene una profundidad de banda de rodadura inferior a
    2/32 de pulgada.
- id: 176
  category: vehicle_information
  question: 'En Dakota del Norte, todo vehículo motorizado debe estar equipado con
    una bocina que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Dakota del Norte exige una bocina en buen estado de funcionamiento
    capaz de emitir un sonido audible en condiciones normales desde una distancia
    no menor a 200 pies.
- id: 177
  category: vehicle_information
  question: 'Según la ley de Dakota del Norte, el espejo retrovisor de un vehículo
    debe permitir al conductor ver la carretera por una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: Todo vehículo motorizado debe estar equipado con un espejo ubicado
    de tal manera que refleje al conductor una vista de la carretera por una distancia
    de al menos 200 pies hacia atrás.
- id: 178
  category: vehicle_information
  question: En Dakota del Norte, ¿cuál es la transmitancia de luz mínima permitida
    para el polarizado de las ventanas laterales delanteras de un automóvil de pasajeros?
  choices:
    A: No menos del 35% de transmitancia de luz
    B: No menos del 50% de transmitancia de luz
    C: No menos del 70% de transmitancia de luz
    D: El polarizado de las ventanas está completamente prohibido en las ventanas
      laterales delanteras
  answer: C
  explanation: La ley de Dakota del Norte exige que las ventanas laterales delanteras
    (a la izquierda y derecha del conductor) deben permitir el paso de al menos el
    70% de la luz.
- id: 179
  category: vehicle_information
  question: ¿Durante qué período se permite el uso de neumáticos para nieve con clavos
    en las carreteras de Dakota del Norte?
  choices:
    A: Del 1 de noviembre al 31 de marzo
    B: Del 1 de octubre al 1 de mayo
    C: Del 15 de octubre al 15 de abril
    D: Del 15 de septiembre al 15 de mayo
  answer: C
  explanation: En Dakota del Norte, es legal utilizar neumáticos con clavos metálicos
    entre el 15 de octubre y el 15 de abril del año siguiente.
- id: 180
  category: vehicle_information
  question: En Dakota del Norte, los frenos de servicio de su vehículo deben poder
    detener el vehículo en cuántos pies cuando viaja a 20 mph en una superficie seca
    y nivelada?
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 50 pies
  answer: B
  explanation: El Código del Siglo de Dakota del Norte 39-21-32 exige que los vehículos
    de pasajeros estén equipados con frenos capaces de detener el vehículo en un tramo
    de 25 pies desde una velocidad de 20 mph.
- id: 181
  category: vehicle_information
  question: 'Todo vehículo motorizado en Dakota del Norte debe tener una luz trasera
    que emita una luz roja claramente visible desde una distancia de:'
  choices:
    A: 500 pies hacia atrás
    B: 1,000 pies hacia atrás
    C: 1,500 pies hacia atrás
    D: 2,000 pies hacia atrás
  answer: B
  explanation: La ley de Dakota del Norte exige que las luces traseras sean visibles
    desde una distancia de 1,000 pies hacia atrás.
- id: 182
  category: vehicle_information
  question: 'En Dakota del Norte, la placa de matrícula trasera debe estar iluminada
    de modo que sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El Código del Siglo de Dakota del Norte 39-21-04 exige una luz blanca
    para iluminar la placa de matrícula trasera, haciéndola legible desde una distancia
    de 50 pies.
- id: 183
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los requisitos
    del silenciador en Dakota del Norte?
  choices:
    A: Los silenciadores son opcionales en vehículos de más de 25 años
    B: Los recortes o derivaciones del silenciador están permitidos si se usan solo
      en caminos rurales
    C: Todo vehículo motorizado debe tener un silenciador en buen estado de funcionamiento
      para evitar el ruido excesivo
    D: Los silenciadores deben reemplazarse cada 5 años por ley
  answer: C
  explanation: La ley de Dakota del Norte exige que todo vehículo motorizado esté
    equipado con un silenciador en buen estado de funcionamiento y en operación constante
    para evitar ruidos excesivos o inusuales. Los recortes o derivaciones están prohibidos.
- id: 184
  category: vehicle_information
  question: Según la ley de Dakota del Norte, ¿cuál es la altura máxima legal del
    parachoques para un automóvil de pasajeros?
  choices:
    A: 18 pulgadas
    B: 20 pulgadas
    C: 22 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Según el Código del Siglo de Dakota del Norte 39-21-45.1, la altura
    máxima del parachoques para un automóvil de pasajeros es de 20 pulgadas.
- id: 185
  category: vehicle_information
  question: 'En Dakota del Norte, se debe exhibir un emblema de "Vehículo de movimiento
    lento" en la parte trasera de cualquier vehículo que normalmente viaje a velocidades
    inferiores a:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El emblema triangular de vehículo de movimiento lento es obligatorio
    en los vehículos diseñados para operar a velocidades de 25 mph o menos.
- id: 186
  category: vehicle_information
  question: Si las señales de giro de su vehículo no funcionan, debe usar señales
    manuales. ¿Cuál es la señal manual correcta para un giro a la derecha en Dakota
    del Norte?
  choices:
    A: Brazo extendido directamente hacia afuera de la ventana
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo
    D: Mano agitada en movimiento circular
  answer: B
  explanation: Para un giro a la derecha, la mano y el brazo deben extenderse hacia
    arriba. El brazo extendido directamente hacia afuera es para un giro a la izquierda,
    y hacia abajo es para detenerse o disminuir la velocidad.
- id: 187
  category: vehicle_information
  question: En Dakota del Norte, los faros delanteros deben usarse desde el atardecer
    hasta el amanecer y en cualquier otro momento en que no se pueda ver claramente
    durante al menos ¿cuántos pies?
  choices:
    A: 500 pies
    B: 750 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Según el Manual del Conductor de Dakota del Norte, los faros deben
    encenderse desde el atardecer hasta el amanecer y siempre que la visibilidad se
    reduzca a 1,000 pies o menos.
- id: 188
  category: vehicle_information
  question: Según la ley de Dakota del Norte, el polarizado de ventanas no original
    (aftermarket) en las ventanas laterales delanteras debe permitir que pase al menos
    ¿qué porcentaje de luz?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: La ley de Dakota del Norte especifica que para las ventanas laterales
    delanteras, la transmitancia de luz debe ser de al menos el 35% para el polarizado
    no original.
- id: 189
  category: vehicle_information
  question: Todo vehículo motorizado en Dakota del Norte debe estar equipado con un
    espejo que permita al conductor ver la carretera durante al menos ¿cuántos pies
    hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las regulaciones de equipamiento de Dakota del Norte exigen un espejo
    retrovisor que proporcione una vista de la carretera a una distancia de al menos
    200 pies hacia atrás.
- id: 190
  category: vehicle_information
  question: 'En Dakota del Norte, la bocina de un vehículo debe ser audible en condiciones
    normales desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley estatal exige que todo vehículo motorizado esté equipado con
    una bocina en buen estado de funcionamiento capaz de emitir un sonido audible
    desde una distancia no menor a 200 pies.
- id: 191
  category: vehicle_information
  question: En Dakota del Norte, ¿durante qué período es legal operar un vehículo
    con neumáticos para nieve con clavos?
  choices:
    A: Del 1 de noviembre al 1 de abril
    B: Del 15 de octubre al 15 de abril
    C: Del 1 de octubre al 1 de mayo
    D: Del 15 de noviembre al 15 de marzo
  answer: B
  explanation: La ley de Dakota del Norte permite el uso de neumáticos con clavos
    únicamente desde el 15 de octubre hasta el 15 de abril.
- id: 192
  category: vehicle_information
  question: 'En Dakota del Norte, las luces direccionales deben ser visibles bajo
    la luz solar normal desde una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Las regulaciones estatales exigen que las señales de giro sean visibles
    desde una distancia no menor a 100 pies bajo la luz solar normal.
- id: 193
  category: vehicle_information
  question: 'Según la ley de Dakota del Norte, el polarizado (tintado) en un parabrisas
    solo está permitido:'
  choices:
    A: Si cubre todo el parabrisas con un 70% de luz
    B: En las 5 pulgadas superiores o hasta la línea AS-1
    C: Si el conductor tiene una nota médica para cualquier ventana
    D: En las 3 pulgadas inferiores del parabrisas
  answer: B
  explanation: La ley de Dakota del Norte restringe el polarizado del parabrisas a
    las 5 pulgadas superiores del mismo o a la línea AS-1, lo que sea más bajo.
- id: 194
  category: vehicle_information
  question: 'En Dakota del Norte, las luces de freno deben ser visibles desde la parte
    trasera a una distancia de al menos:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: A
  explanation: Las luces de freno deben ser visibles desde una distancia de al menos
    100 pies hacia atrás bajo la luz solar normal.
- id: 195
  category: signs_and_signals
  question: ¿Cuál es el límite de velocidad en un distrito comercial o residencial
    en Dakota del Norte, a menos que se indique lo contrario?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: De acuerdo con el Manual del Conductor de Dakota del Norte, el límite
    de velocidad en cualquier distrito comercial o residencial es de 25 mph, a menos
    que se indique lo contrario.
- id: 196
  category: signs_and_signals
  question: Al acercarse a una señal de flecha amarilla intermitente en Dakota del
    Norte, ¿qué debe hacer un conductor?
  choices:
    A: Detenerse y esperar a una flecha verde.
    B: Se permiten los giros después de ceder el paso al tráfico que viene en sentido
      contrario y a los peatones.
    C: El giro está protegido; el tráfico que viene en sentido contrario tiene luz
      roja.
    D: Acelerar para completar el giro antes de que cambie la luz.
  answer: B
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero primero debe ceder el paso al tráfico que viene en sentido
    contrario y a los peatones.
- id: 197
  category: signs_and_signals
  question: En Dakota del Norte, ¿qué indica una luz de semáforo amarilla fija?
  choices:
    A: Debe detenerse inmediatamente, incluso si está en la intersección.
    B: La señal está cambiando a rojo; despeje la intersección o deténgase si puede
      hacerlo de manera segura.
    C: Acelere para despejar la intersección antes de la luz roja.
    D: Los peatones tienen el derecho de paso para entrar en el cruce peatonal.
  answer: B
  explanation: Una luz amarilla fija significa que la señal está cambiando a rojo.
    Los conductores deben detenerse si es seguro hacerlo; de lo contrario, deben despejar
    la intersección.
- id: 198
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla continua en su lado de la línea central
    discontinua en Dakota del Norte?
  choices:
    A: Puede adelantar si es seguro hacerlo.
    B: Se encuentra en una zona de alta velocidad.
    C: Está prohibido adelantar desde su carril.
    D: La carretera más adelante está en construcción.
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central significa
    que está prohibido adelantar para los vehículos en su carril.
- id: 199
  category: signs_and_signals
  question: Al acercarse a un cruce de ferrocarril en Dakota del Norte, ¿a cuántos
    pies del riel más cercano debe detener su vehículo?
  choices:
    A: Entre 5 y 25 pies
    B: Entre 10 y 30 pies
    C: Entre 15 y 50 pies
    D: Entre 20 y 100 pies
  answer: C
  explanation: La ley de Dakota del Norte exige que los conductores se detengan entre
    15 y 50 pies del riel más cercano en un cruce de ferrocarril cuando las señales
    indiquen que se aproxima un tren.
- id: 200
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de pentágono (cinco lados)
    en Dakota del Norte?
  choices:
    A: Ceder el derecho de paso
    B: Zona escolar o cruce escolar
    C: Cruce de ferrocarril más adelante
    D: Zona de no adelantar
  answer: B
  explanation: Una señal de cinco lados (pentágono) indica una zona escolar o un cruce
    escolar.
- id: 201
  category: signs_and_signals
  question: 'En Dakota del Norte, un ''carril de giro compartido'' (carril central
    con líneas amarillas continuas y discontinuas) se utiliza para:'
  choices:
    A: Rebasar vehículos que circulan despacio.
    B: Hacer giros a la izquierda únicamente.
    C: Hacer giros a la derecha únicamente.
    D: Estacionamiento de emergencia únicamente.
  answer: B
  explanation: Los carriles de giro compartido están reservados para que los vehículos
    que viajan en cualquier dirección realicen giros a la izquierda y no deben usarse
    para rebasar.
- id: 202
  category: signs_and_signals
  question: Al entrar en una rotonda en Dakota del Norte, ¿cuál de las siguientes
    afirmaciones es verdadera con respecto a la señalización?
  choices:
    A: Debe señalizar a la izquierda para entrar.
    B: No es necesario señalizar en absoluto.
    C: Debe señalizar a la derecha inmediatamente antes de salir de la rotonda.
    D: Debe usar las luces de emergencia mientras esté dentro del círculo.
  answer: C
  explanation: En Dakota del Norte, se instruye a los conductores a usar la señal
    de giro a la derecha después de pasar la salida anterior a la que desean tomar,
    para indicar que están saliendo de la rotonda.
- id: 203
  category: signs_and_signals
  question: ¿Qué indica una señal en forma de banderín colocada en el lado izquierdo
    de la carretera en Dakota del Norte?
  choices:
    A: Zona escolar
    B: Zona de no rebasar (No Passing Zone)
    C: Ceda el paso (Yield)
    D: Pare adelante (Stop Ahead)
  answer: B
  explanation: Una señal en forma de banderín se coloca en el lado izquierdo de la
    carretera para marcar el inicio de una zona de no rebasar.
- id: 204
  category: signs_and_signals
  question: En Dakota del Norte, ¿de qué color son las luces que se utilizan en los
    equipos de remoción de nieve para advertir a otros conductores?
  choices:
    A: Azules y blancas intermitentes
    B: Rojas y amarillas intermitentes
    C: Ámbar (amarillas) intermitentes
    D: Verde fija
  answer: C
  explanation: El equipo de remoción de nieve de Dakota del Norte utiliza luces ámbar
    (amarillas) intermitentes para alertar a los automovilistas de su presencia.
- id: 205
  category: signs_and_signals
  question: Cuando ve una señal de 'X' amarilla fija sobre un carril de circulación,
    ¿qué indica?
  choices:
    A: El carril está abierto para circular
    B: Debe salir de este carril tan pronto como sea seguro
    C: El carril está reservado para vehículos de emergencia
    D: El carril es solo para giros a la izquierda
  answer: B
  explanation: Una 'X' amarilla fija sobre un carril significa que la señal está a
    punto de cambiar a una 'X' roja, y debe prepararse para desocupar el carril de
    manera segura.
- id: 206
  category: signs_and_signals
  question: Según la ley de Dakota del Norte, ¿cuándo se le permite girar a la derecha
    con un semáforo en rojo?
  choices:
    A: Nunca
    B: Solo si hay una señal de 'Giro a la derecha en rojo'
    C: Después de detenerse por completo y ceder el paso al tráfico y a los peatones,
      a menos que una señal lo prohíba
    D: Solo durante las horas del día
  answer: C
  explanation: En Dakota del Norte, puede girar a la derecha con un semáforo en rojo
    después de detenerse y ceder el paso, siempre que no haya una señal que prohíba
    el giro.
- id: 207
  category: signs_and_signals
  question: 'Una señal con cinco lados (un pentágono) indica que está entrando en
    una:'
  choices:
    A: Zona de hospital
    B: Zona de construcción
    C: Zona escolar o cruce escolar
    D: Parque público
  answer: C
  explanation: Una señal de cinco lados en forma de pentágono se utiliza exclusivamente
    para advertir a los conductores sobre zonas escolares o cruces escolares.
- id: 208
  category: signs_and_signals
  question: En Dakota del Norte, ¿qué significa una línea blanca continua pintada
    en el pavimento entre los carriles de tráfico?
  choices:
    A: Puede cambiar de carril libremente
    B: Debe permanecer en su carril; se desaconseja el cambio de carril
    C: La carretera es de un solo sentido
    D: Debe detenerse por completo
  answer: B
  explanation: Una línea blanca continua indica que se desaconseja el cambio de carril
    debido a posibles peligros, aunque no está estrictamente prohibido como una línea
    continua doble.
- id: 209
  category: signs_and_signals
  question: Al usar señales manuales, ¿cómo se indica un giro a la derecha en Dakota
    del Norte?
  choices:
    A: Extender el brazo izquierdo recto hacia afuera
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo izquierdo hacia abajo
    D: Extender el brazo derecho recto hacia afuera
  answer: B
  explanation: Para indicar un giro a la derecha mediante señales manuales, el brazo
    izquierdo debe extenderse hacia arriba en un ángulo de 90 grados.
- id: 210
  category: signs_and_signals
  question: ¿Cuál es el procedimiento correcto al acercarse a una rotonda en Dakota
    del Norte?
  choices:
    A: Ceder el paso al tráfico que ya está en el círculo
    B: El tráfico en el círculo debe cederle el paso a usted
    C: Detenerse siempre antes de entrar al círculo
    D: Acelerar para incorporarse al tráfico
  answer: A
  explanation: Al acercarse a una rotonda, debe ceder el derecho de paso al tráfico
    que ya está circulando dentro de la rotonda.
- id: 211
  category: signs_and_signals
  question: ¿En Dakota del Norte, qué indica una señal naranja en forma de diamante?
  choices:
    A: Información reglamentaria
    B: Servicio o guía
    C: Advertencia de construcción o mantenimiento
    D: Área recreativa
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para advertencias de zonas de trabajo de construcción y mantenimiento.
- id: 212
  category: signs_and_signals
  question: Según la ley de Dakota del Norte, ¿qué debe hacer al acercarse a un cortejo
    fúnebre?
  choices:
    A: Tocar la bocina para mostrar respeto
    B: Ceder el paso a todos los vehículos del cortejo
    C: Rebasar el cortejo por la derecha
    D: Ceder el paso solo si el vehículo guía tiene una sirena
  answer: B
  explanation: La ley de Dakota del Norte (NDCC 39-10-72) exige que los conductores
    cedan el paso a un cortejo fúnebre que vaya acompañado de un vehículo guía que
    muestre luces intermitentes.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Hacer un alto total
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 213
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Hacer un alto total
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen con seguridad.
  id: 214
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entrar en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar le pondría en el camino del tráfico en sentido contrario.
  id: 215
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Dar una vuelta en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 216
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 217
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Vueltas en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de vuelta en U tachada
    significa que las vueltas en U están prohibidas en este lugar.
  id: 218
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 219
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permiten vueltas en U
    B: No se permiten giros a la izquierda
    C: No se permiten giros a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 220
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín de color blanco y negro que dice "NO
    PASSING ZONE" significa que no se le permite rebasar a otros vehículos en esta
    área. Marca el inicio de una zona de no rebasar.
  id: 221
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "KEEP RIGHT" (Manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 222
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 223
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los venados cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un venado
    advierte que estos animales cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 224
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 225
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 226
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras "R" es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 227
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 228
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 229
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa giro a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 230
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero en un sentido y luego en el otro.
  id: 231
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 232
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 233
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción en el ancho de la vía y ajuste su posición
    en el carril.
  id: 234
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 235
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico en ambos
    sentidos.
  id: 236
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 237
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 238
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 239
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 240
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 241
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 242
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 243
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 244
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse o dejar el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 245
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de estacionamiento para personas con discapacidad vigente pueden
    estacionarse en estos espacios. Las infracciones conllevan multas elevadas.
  id: 246
