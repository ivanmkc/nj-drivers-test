metadata:
  source: 2025 Illinois Driver's Manual
  total_questions: 269
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Illinois, how long must a driver under age 18 hold an instruction permit
    before they can apply for a driver's license?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: C
  explanation: According to the Illinois Graduated Driver Licensing (GDL) program,
    permit holders under age 18 must hold their instruction permit for a minimum of
    nine months before obtaining a license.
- id: 2
  category: license_system
  question: To obtain an Illinois driver's license, a permit holder under age 18 must
    complete how many hours of behind-the-wheel practice?
  choices:
    A: 30 hours total, including 5 hours at night
    B: 40 hours total, including 10 hours at night
    C: 50 hours total, including 10 hours at night
    D: 60 hours total, including 15 hours at night
  answer: C
  explanation: Illinois law requires 50 hours of practice driving, which must include
    10 hours of night driving, supervised by an adult age 21 or older.
- id: 3
  category: license_system
  question: Under the Illinois GDL program, what are the nighttime driving restrictions
    for drivers aged 16 and 17 on Friday and Saturday nights?
  choices:
    A: 9 p.m. to 6 a.m.
    B: 10 p.m. to 6 a.m.
    C: 11 p.m. to 6 a.m.
    D: Midnight to 5 a.m.
  answer: C
  explanation: For drivers aged 16-17, nighttime driving restrictions are 10 p.m.–6
    a.m. Sunday-Thursday and 11 p.m.–6 a.m. Friday-Saturday.
- id: 4
  category: license_system
  question: During the first 12 months of licensing, or until the driver turns 18,
    how many passengers under age 20 is a driver limited to (excluding family)?
  choices:
    A: One
    B: Two
    C: Three
    D: No limit, as long as they wear seatbelts
  answer: A
  explanation: For the first 12 months of licensing or until the driver turns 18,
    the number of passengers is limited to one person under age 20, unless the passenger(s)
    is a sibling, stepsibling, child, or stepchild of the driver.
- id: 5
  category: license_system
  question: If you change your name or address in Illinois, you must notify the Secretary
    of State's office of an address change within how many days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: Illinois law requires you to notify the Secretary of State of an address
    change within 10 days. Name changes must be reported within 30 days.
- id: 6
  category: license_system
  question: In Illinois, at what age can a person first join the First Person Consent
    Organ/Tissue Donor Registry?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: Illinois residents age 16 and older may join the First Person Consent
    Organ/Tissue Donor Registry when they apply for their driver's license or ID card.
- id: 7
  category: license_system
  question: A person under age 19 is prohibited from using a cell phone while driving
    in Illinois except in which situation?
  choices:
    A: When using a hands-free device
    B: When stopped at a red light
    C: To contact a law enforcement agency or emergency services
    D: When driving on a rural highway
  answer: C
  explanation: Illinois law prohibits the use of all cell phones (handheld or hands-free)
    for drivers under age 19, except in the case of an emergency to contact law enforcement
    or emergency services.
- id: 8
  category: license_system
  question: What is the minimum age to apply for an Illinois instruction permit?
  choices:
    A: '14'
    B: '15'
    C: 15 and 6 months
    D: '16'
  answer: B
  explanation: The minimum age to obtain an instruction permit in Illinois is 15,
    provided the applicant is enrolled in or has completed an approved driver education
    course.
- id: 9
  category: license_system
  question: How long is an Illinois instruction permit valid?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: Until the driver turns 21
  answer: B
  explanation: An Illinois instruction permit is valid for two years and must be held
    for at least nine months before a license can be issued to someone under 18.
- id: 10
  category: license_system
  question: New residents moving to Illinois who hold a valid out-of-state driver's
    license must apply for an Illinois license within how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: New residents must apply for an Illinois driver's license within 90
    days of establishing residency in the state.
- id: 11
  category: license_system
  question: What is the minimum amount of property damage liability insurance required
    for a motor vehicle in Illinois?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: Illinois law requires minimum liability insurance of $25,000 for injury/death
    of one person, $50,000 for injury/death of more than one person, and $20,000 for
    damage to property.
- id: 12
  category: license_system
  question: 'Under Illinois'' Zero Tolerance law, a driver under age 21 will have
    their driving privileges suspended if they are caught with a BAC of:'
  choices:
    A: 0.01% or higher
    B: 0.02% or higher
    C: 0.05% or higher
    D: More than 0.00%
  answer: D
  explanation: Illinois has a Zero Tolerance law for drivers under 21, meaning any
    trace of alcohol (a BAC of more than 0.00) will result in a suspension of driving
    privileges.
- id: 13
  category: license_system
  question: An Illinois driver's license for an individual aged 21 to 80 is typically
    valid for how many years?
  choices:
    A: 2 years
    B: 4 years
    C: 5 years
    D: 8 years
  answer: B
  explanation: For most drivers between the ages of 21 and 80, an Illinois driver's
    license is valid for four years and expires on the driver's birthday.
- id: 14
  category: license_system
  question: Which of the following documents is NOT acceptable as proof of residency
    for a standard Illinois driver's license?
  choices:
    A: A utility bill issued within 90 days
    B: A bank statement issued within 90 days
    C: A handwritten letter from a friend
    D: A certified school transcript
  answer: C
  explanation: Proof of residency must be official documentation such as utility bills,
    bank statements, or school transcripts. Handwritten personal letters are not accepted
    by the Secretary of State.
- id: 15
  category: license_system
  question: A new resident to Illinois must register their vehicle in the state within
    how many days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: While a new resident has 90 days to obtain an Illinois driver's license,
    they must register their vehicle and obtain Illinois license plates within 30
    days.
- id: 16
  category: license_system
  question: Under the Illinois Cooperative Driver Testing Program, high school students
    may be exempt from the Secretary of State road test if they earn what grade in
    both the classroom and behind-the-wheel portions of driver education?
  choices:
    A: A
    B: A or B
    C: C or higher
    D: Pass/Fail only
  answer: B
  explanation: High school students who earn an A or B in both the classroom and behind-the-wheel
    portions of an accredited driver education course may be exempt from the road
    test at the time of licensing.
- id: 17
  category: license_system
  question: In Illinois, how often must a driver between the ages of 81 and 86 renew
    their driver's license?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 4 years
    D: Every 8 years
  answer: B
  explanation: Drivers aged 81 through 86 must renew their Illinois driver's license
    every two years. Drivers 87 and older must renew annually.
- id: 18
  category: license_system
  question: An Illinois driver under age 21 will have their license suspended if they
    are convicted of how many moving violations within any 24-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: A
  explanation: Under the Illinois GDL program, drivers under age 21 who are convicted
    of two or more moving violations within a 24-month period will have their driving
    privileges suspended.
- id: 19
  category: license_system
  question: What is the minimum visual acuity required in at least one eye, with or
    without corrective lenses, to obtain an Illinois driver's license without restricted
    daytime driving?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Illinois requires a minimum visual acuity of 20/40 in at least one
    eye. Applicants with 20/41 to 20/70 acuity are limited to daylight driving only.
- id: 20
  category: license_system
  question: 'A standard Illinois Class D driver''s license allows you to operate a
    vehicle with a Gross Vehicle Weight Rating (GVWR) of:'
  choices:
    A: 8,000 lbs. or less
    B: 16,000 lbs. or less
    C: 26,000 lbs. or less
    D: Any weight as long as it is not a semi-truck
  answer: B
  explanation: In Illinois, a Class D license is for any motor vehicle with a GVWR
    of 16,000 lbs. or less, except those requiring a Class A, B, or C license or an
    L or M motorcycle classification.
- id: 21
  category: license_system
  question: If an Illinois driver is under age 18 and wants to apply for a license,
    they must have their application signed by a parent or legal guardian. Who has
    the right to withdraw this consent at any time until the driver turns 18?
  choices:
    A: Only the Secretary of State
    B: Only a judge
    C: The parent or legal guardian who signed the application
    D: Any adult family member
  answer: C
  explanation: The parent or legal guardian who signed the application for a minor's
    license may withdraw consent at any time by visiting a Driver Services facility,
    which will result in the cancellation of the minor's license.
- id: 22
  category: license_system
  question: In Illinois, what is the minimum peripheral (side) vision requirement
    to hold a driver's license without additional restrictions?
  choices:
    A: 90 degrees
    B: 110 degrees
    C: 140 degrees
    D: 180 degrees
  answer: C
  explanation: Illinois requires a total peripheral vision of at least 140 degrees
    (the sum of both eyes) or 70 degrees left and 70 degrees right from the center
    for an unrestricted license.
- id: 23
  category: license_system
  question: Which Illinois license classification is required specifically for operating
    a motorcycle with an engine displacement of more than 150cc?
  choices:
    A: Class L
    B: Class M
    C: Class C
    D: Class D with a motorcycle endorsement
  answer: B
  explanation: In Illinois, Class L is for motor-driven cycles with less than 150cc
    displacement. Class M is required for any motorcycle with an engine displacement
    of 150cc or more.
- id: 24
  category: license_system
  question: 'According to Illinois law, male applicants between the ages of 18 and
    25 who apply for a driver''s license or ID card are:'
  choices:
    A: Required to pay an extra 'service fee'
    B: Automatically registered with the Selective Service System
    C: Exempt from the written exam
    D: Required to provide proof of military enlistment
  answer: B
  explanation: Illinois law requires the Secretary of State to provide the Selective
    Service System with the necessary information to register male applicants between
    18 and 25 who apply for a license or ID.
- id: 25
  category: license_system
  question: A Temporary Visitor Driver's License (TVDL) issued in Illinois is valid
    for how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 4 years
  answer: C
  explanation: An Illinois TVDL is valid for three years or for the period of time
    the individual is authorized to stay in the U.S., whichever ends first.
- id: 26
  category: license_system
  question: If you are under age 18 and applying for an Illinois instruction permit,
    you must be enrolled in a driver education course. What is the other educational
    requirement?
  choices:
    A: You must have a 3.0 GPA
    B: You must be enrolled in high school or have a high school diploma/GED
    C: You must have completed at least 10 hours of community service
    D: There are no other educational requirements
  answer: B
  explanation: Illinois law requires that a minor must be enrolled in school and not
    be a chronic truant, or have a high school diploma or GED, to receive a driver's
    license.
- id: 27
  category: license_system
  question: In Illinois, if you lose your driver's license, you must visit a Driver
    Services facility and pay a fee to obtain a duplicate. What is the standard fee
    for a duplicate license for a driver age 21 or older?
  choices:
    A: $5
    B: $10
    C: $20
    D: $30
  answer: A
  explanation: 'The fee for a duplicate driver''s license in Illinois for most drivers
    is $5. (Note: Fees are subject to change, but $5 is the long-standing standard
    for duplicates in the IL Rules of the Road).'
- id: 28
  category: license_system
  question: When taking the Illinois road test, which of the following is the applicant
    responsible for providing?
  choices:
    A: A vehicle that is properly licensed and safe for operation
    B: A certified driving instructor to sit in the back seat
    C: A dash-cam recording of the test
    D: A printed map of the test route
  answer: A
  explanation: The applicant is responsible for providing a vehicle that is properly
    licensed, insured, and in safe working condition for the road test. The examiner
    will perform a safety check before the test begins.
- id: 29
  category: license_system
  question: If you have a medical condition that may cause a loss of consciousness
    (such as epilepsy or diabetes), you must provide a medical report to the Secretary
    of State. How long do you have to notify the Secretary of State after being diagnosed
    with such a condition?
  choices:
    A: 5 days
    B: 10 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: Illinois law requires drivers to notify the Secretary of State within
    10 days of becoming aware of any medical condition that may cause a loss of consciousness.
- id: 30
  category: license_system
  question: In Illinois, how many attempts at each section of the driver's exam (vision,
    written, and road) are permitted within one year from the date the application
    fee is paid?
  choices:
    A: One
    B: Two
    C: Three
    D: Unlimited
  answer: C
  explanation: Applicants are allowed three attempts to pass each section of the driver's
    exam within one year of the date the application fee was paid.
- id: 31
  category: driver_testing
  question: To meet the peripheral vision requirements for an Illinois driver's license,
    an applicant must have at least what total field of vision?
  choices:
    A: 100 degrees
    B: 120 degrees
    C: 140 degrees
    D: 180 degrees
  answer: C
  explanation: Illinois requires a total peripheral vision of at least 140 degrees
    to qualify for a license without restrictions.
- id: 32
  category: driver_testing
  question: During the Illinois road test, which of the following actions will result
    in an automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: Driving over a curb
    C: Adjusting mirrors while stopped
    D: Driving 2 mph under the speed limit
  answer: B
  explanation: In Illinois, any dangerous action or violation of law, such as driving
    over a curb or causing an accident, results in an automatic failure of the road
    test.
- id: 33
  category: driver_testing
  question: When practicing with an instruction permit in Illinois, the supervising
    driver must meet which of the following requirements?
  choices:
    A: Be at least 18 years old and have a valid license
    B: Be at least 21 years old, have a valid license for the type of vehicle being
      driven, and have at least one year of driving experience
    C: Be a parent or legal guardian regardless of age
    D: Be at least 25 years old and have no traffic violations on their record
  answer: B
  explanation: Illinois law requires the supervising driver to be at least 21 years
    old, hold a valid license for the specific vehicle class, and have at least one
    year of driving experience.
- id: 34
  category: driver_testing
  question: If an Illinois driver develops a medical condition that may affect their
    ability to drive safely, they must notify the Secretary of State's office within
    how many days?
  choices:
    A: 5 days
    B: 10 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: Illinois law requires drivers to notify the Secretary of State in writing
    within 10 days of becoming aware of any medical condition that may cause a loss
    of consciousness or otherwise affect safe driving.
- id: 35
  category: driver_testing
  question: In Illinois, drivers who are age 87 and older must renew their driver's
    license how often?
  choices:
    A: Every 4 years
    B: Every 2 years
    C: Every year
    D: Every 6 months
  answer: C
  explanation: While younger drivers renew every 4 years, Illinois requires drivers
    aged 87 and older to renew their licenses annually.
- id: 36
  category: driver_testing
  question: An applicant for an Illinois driver's license is allowed how many attempts
    to pass the written, vision, and driving tests within one year of the application
    fee payment?
  choices:
    A: Two
    B: Three
    C: Four
    D: Unlimited
  answer: B
  explanation: The Illinois Secretary of State allows applicants three attempts to
    pass each of the required tests within one year of paying the application fee.
- id: 37
  category: driver_testing
  question: What is the penalty for an Illinois driver convicted of providing false
    information on a driver's license application?
  choices:
    A: A $50 fine
    B: A 3-month suspension
    C: A minimum 12-month suspension or revocation
    D: A mandatory 24-hour jail stay
  answer: C
  explanation: Fraudulent applications or providing false information to the Secretary
    of State results in a minimum 12-month suspension or revocation of driving privileges.
- id: 38
  category: driver_testing
  question: Which of the following must be presented to the examiner before taking
    the Illinois road test?
  choices:
    A: A vehicle with a valid registration and proof of insurance
    B: A vehicle with a manual transmission
    C: A letter of recommendation from a driving instructor
    D: A certified copy of the vehicle's title
  answer: A
  explanation: For the road test, the applicant must provide a vehicle that is properly
    licensed, in safe operating condition, and has valid proof of insurance.
- id: 39
  category: driver_testing
  question: What is the standard fee for a basic Illinois Class D driver's license
    for an applicant aged 21 to 68?
  choices:
    A: $10
    B: $20
    C: $30
    D: $50
  answer: C
  explanation: The standard fee for an Illinois driver's license for individuals in
    the 21-68 age bracket is $30.
- id: 40
  category: driver_testing
  question: In Illinois, a Class L license is required for which type of vehicle?
  choices:
    A: Any motorcycle over 150cc
    B: A motor-driven cycle with less than 150cc displacement
    C: A commercial truck over 26,000 lbs
    D: An electric bicycle only
  answer: B
  explanation: In Illinois, a Class L license is for motor-driven cycles (mopeds and
    scooters) with less than 150cc displacement, while Class M is for motorcycles
    150cc and over.
- id: 41
  category: driver_testing
  question: If an Illinois driver has vision in only one eye, what is the minimum
    peripheral vision requirement for that eye to pass the vision screening?
  choices:
    A: 70 degrees
    B: 105 degrees
    C: 140 degrees
    D: 160 degrees
  answer: B
  explanation: Applicants with monocular vision (vision in only one eye) must have
    at least 105 degrees peripheral vision to qualify for an Illinois license.
- id: 42
  category: driver_testing
  question: During the Illinois road test, the applicant will be required to perform
    which of the following maneuvers?
  choices:
    A: A high-speed merge onto an interstate
    B: Backing the vehicle in a straight line for approximately 50 feet
    C: A 360-degree turn in a residential intersection
    D: Driving in reverse for one full block
  answer: B
  explanation: The Illinois road test includes a requirement to back the vehicle in
    a straight line for a distance of approximately 50 feet smoothly and safely.
- id: 43
  category: driver_testing
  question: Under the 'Motor Voter' law in Illinois, when can an individual register
    to vote at a Driver Services facility?
  choices:
    A: Only during presidential election years
    B: Only if they are over age 21
    C: When applying for or renewing a driver's license or ID card
    D: Only if they have a clean driving record
  answer: C
  explanation: Illinois allows eligible citizens to register to vote or update their
    registration at the same time they apply for or renew their driver's license or
    ID card.
- id: 44
  category: driver_testing
  question: An Illinois driver under age 21 who has their license suspended for two
    moving violations may be eligible for a 'Probationary License' to attend school
    or work. What is a requirement for this?
  choices:
    A: They must be at least 18 years old
    B: They must complete a 4-hour Driver Remedial Education Course
    C: They must pay a $500 fine
    D: They must have a parent ride with them at all times
  answer: B
  explanation: Drivers under 21 who face a suspension for two moving violations within
    24 months may be eligible for a probationary license if they complete a required
    remedial education course.
- id: 45
  category: driver_testing
  question: 'To qualify for an Illinois driver''s license without peripheral vision
    restrictions, a driver must have a combined peripheral vision of at least:'
  choices:
    A: 100 degrees
    B: 120 degrees
    C: 140 degrees
    D: 170 degrees
  answer: C
  explanation: According to the Illinois Rules of the Road, a driver must have at
    least 140 degrees peripheral vision (total of both eyes) to be eligible for a
    license without restrictions.
- id: 46
  category: driver_testing
  question: 'If an applicant is caught cheating on the Illinois written driver''s
    exam, they will be prohibited from retaking the test for at least:'
  choices:
    A: 7 days
    B: 30 days
    C: 90 days
    D: One year
  answer: B
  explanation: If an applicant is found cheating or using unauthorized assistance
    during an exam, they will fail and are prohibited from retaking the exam for 30
    days.
- id: 47
  category: driver_testing
  question: 'During the Illinois road test, the applicant must demonstrate the ability
    to back the vehicle in a straight line for a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The Illinois road test requires applicants to back the vehicle in a
    straight line for approximately 50 feet, showing control and looking over the
    shoulder.
- id: 48
  category: driver_testing
  question: 'An Illinois Class L license is required for any motor-driven cycle with
    a displacement of:'
  choices:
    A: Less than 50cc
    B: Less than 150cc
    C: 150cc or more
    D: Exactly 250cc
  answer: B
  explanation: In Illinois, a Class L license is for motor-driven cycles with less
    than 150cc displacement. A Class M license is required for motorcycles 150cc or
    greater.
- id: 49
  category: driver_testing
  question: If you have a medical condition that may cause a loss of consciousness,
    Illinois law requires you to notify the Secretary of State within how many days
    of becoming aware of the condition?
  choices:
    A: 5 days
    B: 10 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: Drivers must notify the Secretary of State within 10 days of becoming
    aware of any medical condition that may cause a loss of consciousness or ability
    to safely operate a vehicle.
- id: 50
  category: driver_testing
  question: Which of the following is an automatic failure on the Illinois road test?
  choices:
    A: Failing to use a turn signal once
    B: Adjusting the mirrors before starting
    C: A violation of any traffic law
    D: Driving 2 mph under the speed limit
  answer: C
  explanation: Committing a traffic violation or performing a dangerous action during
    the road test results in an immediate automatic failure.
- id: 51
  category: driver_testing
  question: 'In Illinois, male applicants between the ages of 18 and 25 are:'
  choices:
    A: Required to provide proof of military service
    B: Automatically registered with the Selective Service System when applying for
      a license
    C: Exempt from the written exam
    D: Required to pay a higher application fee
  answer: B
  explanation: Illinois law requires that male applicants ages 18-25 be registered
    with the Selective Service System upon applying for a driver's license or ID card.
- id: 52
  category: driver_testing
  question: Although 16 and 17-year-olds can join the Illinois Organ/Tissue Donor
    Registry, who has the final say regarding donation if the individual passes away
    before age 18?
  choices:
    A: The Secretary of State
    B: The attending physician
    C: The individual's school
    D: The individual's parents or legal guardians
  answer: D
  explanation: While 16- and 17-year-olds can join the registry, their parents or
    legal guardians have the legal right to overturn the decision until the individual
    turns 18.
- id: 53
  category: driver_testing
  question: 'When taking the road test in Illinois, the vehicle provided by the applicant
    must have:'
  choices:
    A: A manual transmission
    B: Dual brakes for the examiner
    C: A front and rear license plate (if required by the state of registration)
    D: Leather seating
  answer: C
  explanation: The vehicle used for the road test must be properly licensed, including
    displaying both front and rear license plates if the state of registration requires
    them (as Illinois does).
- id: 54
  category: driver_testing
  question: What is the fee for a duplicate Illinois driver's license if the original
    is lost or stolen?
  choices:
    A: $5
    B: $15
    C: $25
    D: $30
  answer: A
  explanation: The fee to obtain a duplicate driver's license in Illinois is $5.
- id: 55
  category: driver_testing
  question: Which of the following maneuvers is specifically required during the Illinois
    road test to demonstrate vehicle control?
  choices:
    A: Parallel parking between two cars
    B: A three-point turn
    C: Uphill or downhill parking
    D: High-speed merging onto a highway
  answer: C
  explanation: The Illinois road test includes a requirement to demonstrate proper
    parking on a hill (uphill or downhill) including the correct turn of the wheels.
- id: 56
  category: driver_responsibility
  question: 'In Illinois, if you are involved in a traffic crash that results in damage
    to the property of any one person in excess of $1,500, you must file a motorist
    report if:'
  choices:
    A: The police do not file a report
    B: The other driver is at fault
    C: You are over the age of 21
    D: The damage is to a government vehicle only
  answer: A
  explanation: According to the Illinois Rules of the Road, if a crash results in
    bodily injury, death, or property damage of more than $1,500 ($500 if any vehicle
    is uninsured), a report must be filed with the IDOT if a police officer does not
    file one.
- id: 57
  category: driver_responsibility
  question: If you are required to file an Illinois Motorist Report following an accident,
    how many days do you have to submit it to the Illinois Department of Transportation?
  choices:
    A: 3 days
    B: 10 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: Illinois law requires that a crash report be forwarded to the Illinois
    Department of Transportation no later than 10 days after the accident occurs.
- id: 58
  category: driver_responsibility
  question: What is the minimum amount of liability insurance required in Illinois
    for the injury or death of one person in a crash?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Illinois law requires minimum liability insurance of $25,000 for the
    injury or death of one person in a crash.
- id: 59
  category: driver_responsibility
  question: In Illinois, what is the minimum fine for a first conviction of driving
    without the required mandatory liability insurance?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Operating a motor vehicle in Illinois without the required insurance
    carries a minimum fine of $500.
- id: 60
  category: driver_responsibility
  question: When you sell a vehicle in Illinois, what must you do with the license
    plates?
  choices:
    A: Leave them on the vehicle for the new owner
    B: Remove them and keep them or transfer them to another vehicle
    C: Destroy them immediately
    D: Give them to the local police department
  answer: B
  explanation: In Illinois, license plates remain with the owner, not the vehicle.
    When you sell a car, you must remove the plates.
- id: 61
  category: driver_responsibility
  question: 'If you hit a parked vehicle in Illinois and cannot find the owner, you
    must leave a note and:'
  choices:
    A: Wait for 2 hours for the owner to return
    B: Notify the police or the Secretary of State
    C: Take a photo and post it on social media
    D: Only leave a note; no further action is required
  answer: B
  explanation: Illinois law requires you to leave a note with your name, address,
    and license plate number, and you must also notify the police.
- id: 62
  category: driver_responsibility
  question: 'Under the Illinois Safety Responsibility Law, if you are at fault in
    an accident and do not have insurance, your driver''s license may be suspended
    until:'
  choices:
    A: You pay a $100 fine
    B: You complete a remedial driving course
    C: You post security (money) to cover the damages or reach a settlement
    D: One year has passed
  answer: C
  explanation: The Safety Responsibility Law requires uninsured drivers at fault in
    an accident to post security to cover damages or their license and registration
    will be suspended.
- id: 63
  category: driver_responsibility
  question: Which of the following is a valid way to prove you have insurance during
    a traffic stop in Illinois?
  choices:
    A: A verbal statement to the officer
    B: An electronic image of the insurance card on a smartphone
    C: A signed letter from your neighbor
    D: A copy of your vehicle's title
  answer: B
  explanation: Illinois allows drivers to provide proof of insurance in paper or electronic
    format, such as on a mobile device.
- id: 64
  category: driver_responsibility
  question: 'A person convicted of leaving the scene of a crash involving personal
    injury or death in Illinois faces:'
  choices:
    A: A $50 fine only
    B: Mandatory revocation of their driver's license
    C: A warning on their driving record
    D: No penalty if they report it the next day
  answer: B
  explanation: Leaving the scene of an accident involving injury or death is a serious
    offense in Illinois that results in the mandatory revocation of the driver's license.
- id: 65
  category: driver_responsibility
  question: In Illinois, how many license plates are most passenger vehicles required
    to display?
  choices:
    A: One on the rear only
    B: One on the front only
    C: Two, one on the front and one on the rear
    D: None, as long as the registration is in the glovebox
  answer: C
  explanation: 'Most vehicles in Illinois are required to display two license plates:
    one on the front and one on the rear.'
- id: 66
  category: driver_responsibility
  question: What is the penalty in Illinois for providing false insurance information
    to a police officer?
  choices:
    A: A verbal warning
    B: A $25 administrative fee
    C: It is a Class A misdemeanor and may lead to a fine and jail time
    D: There is no penalty if you obtain insurance within 24 hours
  answer: C
  explanation: Providing false insurance information is a Class A misdemeanor in Illinois,
    which can result in fines and up to one year in jail.
- id: 67
  category: driver_responsibility
  question: In Illinois, where should the registration expiration sticker be placed
    on the license plate?
  choices:
    A: In the upper left corner
    B: In the upper right corner
    C: In the bottom right corner
    D: In the center of the plate
  answer: C
  explanation: The Illinois Secretary of State requires the registration renewal sticker
    to be placed in the bottom right corner of the rear license plate.
- id: 68
  category: driver_responsibility
  question: 'If an Illinois driver is convicted of a second or subsequent offense
    of driving without insurance, they face a registration suspension and a fine of:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: A second or subsequent conviction for driving without insurance in
    Illinois carries a minimum fine of $1,000.
- id: 69
  category: driver_responsibility
  question: 'In Illinois, ''Uninsured Motorist'' coverage is:'
  choices:
    A: Optional for all drivers
    B: Mandatory and must be included in your liability policy
    C: Only required for drivers under age 21
    D: Illegal in the state of Illinois
  answer: B
  explanation: Illinois law requires that every motor vehicle liability policy include
    uninsured motorist coverage at the minimum legal limits.
- id: 70
  category: driver_responsibility
  question: In Illinois, if you are involved in a crash that causes personal injury
    or death, you must report it to the Illinois Department of Transportation if the
    police do not file a report. What is the property damage threshold that also requires
    a report to be filed?
  choices:
    A: More than $500
    B: More than $1,000
    C: More than $1,500 (if all drivers are insured)
    D: More than $2,500
  answer: C
  explanation: In Illinois, a crash report must be filed if the crash involves bodily
    injury, death, or property damage of more than $1,500. If any driver is uninsured,
    the property damage threshold is $500.
- id: 71
  category: driver_responsibility
  question: What are the minimum liability insurance requirements for bodily injury
    or death in Illinois?
  choices:
    A: $15,000/$30,000
    B: $20,000/$40,000
    C: $25,000/$50,000
    D: $50,000/$100,000
  answer: C
  explanation: Illinois law requires minimum liability coverage of $25,000 for injury
    or death of one person and $50,000 for injury or death of more than one person
    in a crash.
- id: 72
  category: driver_responsibility
  question: If an Illinois driver is convicted of operating a motor vehicle without
    a valid insurance policy, what is the minimum fine?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Driving without insurance in Illinois carries a minimum fine of $500
    for a first or second conviction.
- id: 73
  category: driver_responsibility
  question: How long does an Illinois driver have to file a crash report (SR-1) with
    the Illinois Department of Transportation if the crash meets reporting requirements?
  choices:
    A: No later than 24 hours after the crash
    B: No later than 3 days after the crash
    C: No later than 10 days after the crash
    D: No later than 30 days after the crash
  answer: C
  explanation: If a crash meets the reporting criteria and a police officer does not
    file a report, the driver must file a report with IDOT no later than 10 days after
    the crash.
- id: 74
  category: driver_responsibility
  question: Under the Illinois Safety Responsibility Law, what happens if an uninsured
    driver is at fault in a crash and cannot pay for the damages?
  choices:
    A: They are required to perform community service
    B: Their driving privileges and registration are suspended
    C: They must pay a $100 administrative fee only
    D: Nothing, as long as they promise to pay later
  answer: B
  explanation: The Safety Responsibility Law requires the Secretary of State to suspend
    the driving privileges and registration of an uninsured person who is at fault
    in a crash and fails to pay for the damages.
- id: 75
  category: driver_responsibility
  question: In Illinois, where should your vehicle's certificate of title be kept?
  choices:
    A: In the glove compartment
    B: Taped to the inside of the windshield
    C: In a safe place, but NOT in the vehicle
    D: With the driver at all times
  answer: C
  explanation: A vehicle's title should be kept in a safe place, such as a safe deposit
    box, and should never be kept in the vehicle itself to prevent theft issues.
- id: 76
  category: driver_responsibility
  question: What is the penalty for an Illinois driver's second or subsequent conviction
    for driving without insurance?
  choices:
    A: A $1,000 fine and a 4-month suspension of vehicle registration
    B: A $200 fine and a warning
    C: A 1-year jail sentence
    D: Permanent revocation of the driver's license
  answer: A
  explanation: For a second or subsequent conviction of driving without insurance,
    the driver faces a $1,000 fine and a 4-month suspension of their vehicle registration.
- id: 77
  category: driver_responsibility
  question: Illinois law requires most passenger vehicles to display how many license
    plates?
  choices:
    A: One plate, displayed on the rear
    B: One plate, displayed on the front
    C: Two plates, one on the front and one on the rear
    D: Two plates, both on the rear
  answer: C
  explanation: 'Most vehicles in Illinois, including passenger cars and trucks, are
    required to display two license plates: one on the front and one on the rear.'
- id: 78
  category: driver_responsibility
  question: If you are convicted of illegally using a person with disabilities parking
    placard or license plate that does not belong to you, what is the minimum fine
    in Illinois?
  choices:
    A: $100
    B: $250
    C: $600
    D: $1,000
  answer: C
  explanation: The minimum fine for the illegal use of a disability placard or plate
    is $600, and the offender's driver's license will be suspended for six months.
- id: 79
  category: driver_responsibility
  question: What is an SR-22 certificate in Illinois?
  choices:
    A: A certificate of high school graduation
    B: A proof of future financial responsibility required for high-risk drivers
    C: A permit to drive a commercial vehicle
    D: A medical clearance form for elderly drivers
  answer: B
  explanation: An SR-22 is a certificate of financial responsibility that proves a
    driver has the required liability insurance. It is often required for drivers
    seeking to reinstate their license after certain suspensions or revocations.
- id: 80
  category: driver_responsibility
  question: In Illinois, how long must a driver maintain an SR-22 certificate on file
    with the Secretary of State if it is required?
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: 5 years
  answer: C
  explanation: In Illinois, drivers required to file an SR-22 must generally maintain
    it for 3 years.
- id: 81
  category: driver_responsibility
  question: Which of the following is true regarding Illinois emissions testing?
  choices:
    A: All vehicles in Illinois must be tested every year
    B: Only vehicles in certain counties (like Cook and DuPage) are required to undergo
      testing
    C: Testing is only required for vehicles older than 25 years
    D: Emissions testing was abolished in Illinois in 2020
  answer: B
  explanation: Emissions testing is required for most vehicles in Cook, DuPage, Lake,
    and parts of Kane, Kendall, McHenry, Will, Madison, Monroe, and St. Clair counties.
- id: 82
  category: driver_responsibility
  question: If you are involved in a crash with a parked vehicle in Illinois, what
    must you do if you cannot find the owner?
  choices:
    A: Drive away if there is no visible damage
    B: Wait for 10 minutes and then leave
    C: Leave a note with your name, address, and license plate number and notify the
      police
    D: Call a tow truck to move the other vehicle
  answer: C
  explanation: If you hit a parked vehicle, you must stop and try to find the owner.
    If you cannot, you must leave a written notice in a conspicuous place and notify
    the police.
- id: 83
  category: driver_responsibility
  question: What is the penalty for an Illinois driver who is convicted of leaving
    the scene of a crash involving personal injury or death?
  choices:
    A: A $50 fine
    B: A 3-month suspension of driving privileges
    C: Revocation of driving privileges and potential felony charges
    D: A mandatory 10 hours of traffic school
  answer: C
  explanation: Leaving the scene of a crash involving injury or death is a serious
    offense in Illinois, resulting in the revocation of driving privileges and potential
    criminal prosecution as a felony.
- id: 84
  category: driver_responsibility
  question: In Illinois, can proof of insurance be displayed on a mobile electronic
    device during a traffic stop?
  choices:
    A: No, only a paper card is acceptable
    B: Yes, electronic proof of insurance is legally acceptable
    C: Only if the officer is over the age of 40
    D: Only if the driver is also carrying a paper backup
  answer: B
  explanation: Illinois law allows drivers to provide proof of insurance in either
    a paper or electronic format, such as on a smartphone.
- id: 85
  category: safe_driving_rules
  question: In Illinois, what is the maximum speed limit on rural interstate highways
    unless otherwise posted?
  choices:
    A: 60 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: According to the Illinois Rules of the Road, the maximum speed limit
    on rural interstate highways is 70 mph.
- id: 86
  category: safe_driving_rules
  question: When passing another vehicle in Illinois, you must return to your lane
    before coming within how many feet of an oncoming vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Illinois law requires that you finish a pass and return to your lane
    before you get within 200 feet of any vehicle coming from the opposite direction.
- id: 87
  category: safe_driving_rules
  question: In a business or residential area in Illinois, you must give a continuous
    turn signal for at least how many feet before turning?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: In business or residential areas, a turn signal must be given at least
    100 feet before turning. In other areas (rural), the signal must be given at least
    200 feet before turning.
- id: 88
  category: safe_driving_rules
  question: Under Illinois law, what is the maximum speed limit in an urban alley?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The statutory speed limit for an alley in an urban area in Illinois
    is 15 mph.
- id: 89
  category: safe_driving_rules
  question: When approaching a school zone on school days when children are present,
    what is the speed limit between 7 a.m. and 4 p.m.?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: In Illinois, the speed limit in school zones is 20 mph on school days
    when children are present and signs are posted.
- id: 90
  category: safe_driving_rules
  question: In Illinois, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: Illinois law prohibits parking within 15 feet of a fire hydrant.
- id: 91
  category: safe_driving_rules
  question: When a school bus is traveling on a four-lane highway with at least two
    lanes in each direction, which traffic must stop when the bus has its stop signal
    arm extended and red lights flashing?
  choices:
    A: Traffic in all four lanes must stop
    B: Only traffic moving in the opposite direction of the bus must stop
    C: Only traffic moving in the same direction as the bus must stop
    D: No traffic is required to stop if there is a median
  answer: C
  explanation: On a four-lane highway with at least two lanes of traffic in each direction,
    only traffic moving in the same direction as the school bus is required to stop
    in Illinois.
- id: 92
  category: safe_driving_rules
  question: What is the minimum fine for a first offense of speeding in a construction
    or maintenance zone when workers are present in Illinois?
  choices:
    A: '100'
    B: '250'
    C: '375'
    D: '500'
  answer: B
  explanation: In Illinois, the minimum fine for the first offense of speeding in
    a construction zone is $250.
- id: 93
  category: safe_driving_rules
  question: According to Illinois law, when must you use your headlights?
  choices:
    A: Only from sunset to sunrise
    B: Only when it is raining or snowing
    C: From sunset to sunrise, and whenever windshield wipers are necessary
    D: Only when visibility is less than 1,000 feet
  answer: C
  explanation: Illinois law requires headlights to be on from sunset to sunrise, and
    at any other time when weather conditions require the use of windshield wipers.
- id: 94
  category: safe_driving_rules
  question: 'When approaching a stationary emergency vehicle with its lights flashing
    (Scott''s Law), Illinois drivers must:'
  choices:
    A: Maintain speed and stay in the current lane
    B: Speed up to pass the vehicle quickly
    C: Yield the right-of-way by changing lanes if safe, or reducing speed
    D: Stop completely on the highway
  answer: C
  explanation: Scott's Law (the Move Over Law) requires drivers to change lanes if
    safe to do so or reduce speed and proceed with caution when approaching any stationary
    vehicle with flashing lights.
- id: 95
  category: safe_driving_rules
  question: 'You are allowed to turn left on a red light in Illinois only when:'
  choices:
    A: Turning from a two-way street onto a one-way street
    B: Turning from a one-way street onto another one-way street
    C: There is no oncoming traffic
    D: It is after midnight
  answer: B
  explanation: In Illinois, a left turn on red is only permitted when turning from
    a one-way street onto another one-way street after coming to a complete stop and
    yielding to traffic and pedestrians.
- id: 96
  category: safe_driving_rules
  question: When stopping at a railroad crossing in Illinois, a driver must stop within
    how many feet of the nearest rail?
  choices:
    A: Between 5 and 25 feet
    B: Between 10 and 30 feet
    C: Between 15 and 50 feet
    D: Exactly 20 feet
  answer: C
  explanation: Illinois law requires vehicles to stop between 15 and 50 feet from
    the nearest rail at a railroad crossing when a signal is flashing or a train is
    approaching.
- id: 97
  category: safe_driving_rules
  question: In Illinois, it is illegal to pass another vehicle within how many feet
    of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Passing is prohibited within 100 feet of an intersection or a railroad
    crossing in Illinois.
- id: 98
  category: safe_driving_rules
  question: When parallel parking on a level street in Illinois, your wheels must
    be within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: When parallel parking, the vehicle must be parked with the right-hand
    wheels parallel to and within 12 inches of the curb.
- id: 99
  category: safe_driving_rules
  question: Under Illinois' 'Scott's Law' (Move Over Law), what must a driver do when
    approaching any stationary vehicle with flashing lights?
  choices:
    A: Stop immediately in the lane of traffic
    B: Maintain speed but honk the horn
    C: Change lanes if safe to do so, or reduce speed and proceed with caution
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: Scott's Law requires drivers to change lanes if safe to do so, or if
    a lane change is not possible, reduce speed and proceed with caution when approaching
    any stationary vehicle with flashing lights.
- id: 100
  category: safe_driving_rules
  question: In Illinois, when is a driver permitted to turn left on a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: At any intersection after coming to a complete stop
    D: Only between the hours of midnight and 6 a.m.
  answer: B
  explanation: In Illinois, a left turn on a red light is only permitted after a complete
    stop when turning from a one-way street onto another one-way street where traffic
    moves to the left.
- id: 101
  category: safe_driving_rules
  question: When driving at night in Illinois, you must dim your high beam headlights
    when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Illinois law requires drivers to dim high beams at least 500 feet before
    meeting an oncoming vehicle.
- id: 102
  category: safe_driving_rules
  question: When passing a bicyclist in Illinois, a motorist must allow at least how
    much space between the vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Illinois law requires motorists to leave at least 3 feet of space when
    passing a bicyclist.
- id: 103
  category: safe_driving_rules
  question: When approaching a funeral procession in Illinois, what is the correct
    procedure for other motorists?
  choices:
    A: Motorists should join the procession to get through traffic faster
    B: Motorists must yield the right of way to all vehicles in the procession
    C: Motorists should honk to let the procession know they are passing
    D: Motorists only yield if the procession has a police escort
  answer: B
  explanation: In Illinois, motorists must yield the right of way to all vehicles
    in a funeral procession. Procession vehicles have the right of way at intersections
    when their headlights are on.
- id: 104
  category: defensive_driving
  question: According to the Illinois Rules of the Road, what is the recommended following
    distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: B
  explanation: Illinois law and the official driver's manual recommend a minimum following
    distance of three seconds to allow enough time to react to situations in front
    of you.
- id: 105
  category: defensive_driving
  question: In Illinois, when are you required to turn on your headlights when using
    your windshield wipers?
  choices:
    A: Only during heavy downpours
    B: Only if it is after sunset
    C: At all times when wipers are in use due to weather conditions
    D: Only on highways and interstates
  answer: C
  explanation: Illinois law requires headlights to be on when atmospheric conditions
    require the use of windshield wipers.
- id: 106
  category: defensive_driving
  question: In Illinois, you must dim your high-beam headlights when following another
    vehicle within how many feet?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: When following another vehicle, Illinois law requires you to dim your
    high beams when you are within 300 feet of the vehicle ahead.
- id: 107
  category: defensive_driving
  question: To maintain proper situational awareness, the Illinois Secretary of State
    recommends scanning the road ahead at least how far?
  choices:
    A: 5 to 10 seconds
    B: 12 to 15 seconds
    C: 20 to 30 seconds
    D: One full minute
  answer: B
  explanation: The Illinois Rules of the Road manual suggests scanning 12 to 15 seconds
    ahead to identify potential hazards early.
- id: 108
  category: defensive_driving
  question: At what speed can hydroplaning begin to occur on Illinois roads during
    heavy rain?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph, where tires may
    lose contact with the road surface and ride on top of the water.
- id: 109
  category: defensive_driving
  question: When driving in heavy fog in Illinois, which headlight setting should
    you use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights, use hazard flashers
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    fog and actually decrease visibility.
- id: 110
  category: defensive_driving
  question: Under Illinois 'Scott's Law' (Move Over Law), what is the minimum fine
    for a first offense of failing to yield to an emergency vehicle with lights flashing?
  choices:
    A: A warning only
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: As of recent updates to Scott's Law in Illinois, the minimum fine for
    a first violation is $250.
- id: 111
  category: defensive_driving
  question: Outside of business or residential districts, trucks or vehicles pulling
    trailers must maintain a following distance of at least how many feet behind another
    similar vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Illinois law requires trucks and vehicles pulling trailers to stay
    at least 300 feet behind other trucks or trailers when driving outside business
    or residential areas.
- id: 112
  category: defensive_driving
  question: When driving in Illinois winter conditions, why are bridges and overpasses
    particularly dangerous?
  choices:
    A: They are narrower than other roads
    B: They remain wet longer than other roads
    C: They may remain icy after the rest of the roadway is clear and dry
    D: They have a lower speed limit in winter
  answer: C
  explanation: Bridges and overpasses can remain icy because they lack the ground
    insulation that keeps other road surfaces warmer, causing them to freeze first
    and stay frozen longer.
- id: 113
  category: defensive_driving
  question: In Illinois, between what times must your vehicle's headlights be illuminated?
  choices:
    A: From 6:00 PM to 6:00 AM
    B: From one hour after sunset to one hour before sunrise
    C: From sunset to sunrise
    D: Only when it is dark enough that you cannot see 1,000 feet
  answer: C
  explanation: Illinois law requires headlights to be on from sunset to sunrise, as
    well as during periods of poor visibility.
- id: 114
  category: defensive_driving
  question: If your vehicle begins to skid on a slippery Illinois road, what is the
    correct defensive driving response?
  choices:
    A: Brake hard and turn away from the skid
    B: Ease off the gas and steer in the direction of the skid
    C: Accelerate slightly to regain traction
    D: Shift into neutral and pump the brakes
  answer: B
  explanation: The Illinois driver's manual instructs drivers to ease off the gas
    or brake and steer into the direction of the skid until control is regained.
- id: 115
  category: defensive_driving
  question: If you are being tailgated by an aggressive driver in Illinois, what is
    the safest course of action?
  choices:
    A: Tap your brakes repeatedly to warn them
    B: Speed up to increase the gap
    C: Slow down and move to the right to allow them to pass
    D: Stop your vehicle in the lane to confront them
  answer: C
  explanation: Defensive driving involves de-escalating; slowing down and moving to
    the right allows the aggressive driver to pass safely.
- id: 116
  category: defensive_driving
  question: 'When an emergency vehicle using audible and visual signals approaches
    your vehicle from behind in Illinois, you should:'
  choices:
    A: Stop immediately in your lane
    B: Pull over to the right-hand edge of the highway and stop
    C: Speed up to get out of the way
    D: Move to the left-hand shoulder and stop
  answer: B
  explanation: Illinois law requires drivers to pull over to the right-hand edge of
    the road and stop until the emergency vehicle has passed.
- id: 117
  category: defensive_driving
  question: 'When approaching a vehicle from the rear at night, Illinois law requires
    you to dim your high beams when you are within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Drivers must dim their high beam headlights when they are within 300
    feet of the vehicle they are following.
- id: 118
  category: defensive_driving
  question: At what speed can hydroplaning begin to occur in Illinois weather conditions,
    causing tires to lose contact with the road?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: At speeds exceeding 65 mph
    D: Only during freezing rain
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    tires can lose all contact with the road at 55 mph.
- id: 119
  category: defensive_driving
  question: To maintain proper defensive scanning, the Illinois Secretary of State
    recommends looking how far ahead?
  choices:
    A: 5 seconds
    B: 12 seconds
    C: 20 seconds
    D: 30 seconds
  answer: B
  explanation: Drivers should scan the road at least 12 seconds ahead of their vehicle
    to anticipate potential hazards.
- id: 120
  category: defensive_driving
  question: If your vehicle begins to skid on a slippery Illinois road, which way
    should you steer to regain control?
  choices:
    A: In the opposite direction of the skid
    B: Straight ahead and brake hard
    C: In the direction of the skid
    D: Toward the shoulder of the road
  answer: C
  explanation: To correct a skid, you should steer into the direction of the skid
    and avoid hard braking.
- id: 121
  category: defensive_driving
  question: When approaching a railroad crossing in Illinois with a signal flashing,
    you must stop your vehicle within what distance from the nearest rail?
  choices:
    A: Between 5 and 25 feet
    B: Between 10 and 30 feet
    C: Between 15 and 50 feet
    D: Exactly 20 feet
  answer: C
  explanation: Illinois law requires drivers to stop between 15 and 50 feet from the
    nearest rail when signals are flashing or a train is approaching.
- id: 122
  category: defensive_driving
  question: In Illinois, when passing a bicyclist, what is the minimum lateral distance
    a motorist must maintain between the vehicle and the bicycle?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: Illinois law requires motorists to leave at least 3 feet of space when
    passing a bicyclist.
- id: 123
  category: defensive_driving
  question: If an oncoming vehicle fails to dim its high beam headlights, where should
    an Illinois driver look to avoid being temporarily blinded?
  choices:
    A: At the center line of the road
    B: Toward the right edge of the pavement
    C: Directly at the oncoming headlights
    D: At the rearview mirror
  answer: B
  explanation: To avoid glare from oncoming high beams, look toward the right edge
    of your lane or the white line on the edge of the pavement.
- id: 124
  category: defensive_driving
  question: When entering a curve on a rural Illinois road, when should you adjust
    your speed?
  choices:
    A: Before entering the curve
    B: In the middle of the curve
    C: As you exit the curve
    D: Only if you feel the tires sliding
  answer: A
  explanation: Defensive driving requires slowing down before entering a curve to
    maintain traction and control.
- id: 125
  category: alcohol_drugs_health
  question: In Illinois, a driver is legally considered to be under the influence
    (DUI) if their Blood Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In Illinois, it is illegal to drive with a BAC of 0.08% or higher.
    However, a driver can still be convicted of DUI with a BAC between 0.05% and 0.08%
    if additional evidence shows they were impaired.
- id: 126
  category: alcohol_drugs_health
  question: 'Under the Illinois Statutory Summary Suspension law, if you are a first-time
    offender and fail a chemical test (BAC of 0.08% or more), your driving privileges
    will be suspended for:'
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A first-time offender who fails a chemical test faces a mandatory 6-month
    statutory summary suspension of their driving privileges.
- id: 127
  category: alcohol_drugs_health
  question: 'In Illinois, if a first-time offender refuses to submit to chemical testing
    (breath, blood, or urine) after being arrested for DUI, their license will be
    suspended for:'
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: Under the Implied Consent law, refusing to submit to chemical testing
    results in a longer suspension than failing the test. For a first offense, the
    suspension is 12 months.
- id: 128
  category: alcohol_drugs_health
  question: 'If you are convicted of DUI in Illinois for the first time, your driving
    privileges will be revoked for a minimum of:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: A first DUI conviction results in a minimum 1-year revocation of driving
    privileges (2 years if the driver is under age 21).
- id: 129
  category: alcohol_drugs_health
  question: In Illinois, what is the legal limit for THC (cannabis) in a driver's
    blood for non-medical users?
  choices:
    A: 2 nanograms per milliliter
    B: 5 nanograms per milliliter
    C: 10 nanograms per milliliter
    D: Any detectable amount
  answer: B
  explanation: Illinois law sets a limit of 5 nanograms or more of THC per milliliter
    of whole blood, or 10 nanograms or more per milliliter of other bodily substance,
    for a driver to be considered under the influence of cannabis.
- id: 130
  category: alcohol_drugs_health
  question: If an Illinois driver is convicted of DUI while transporting a child under
    age 16, they face which of the following additional penalties?
  choices:
    A: Mandatory community service and a minimum fine of $1,000
    B: Immediate permanent loss of license
    C: A mandatory 30-day jail sentence
    D: No additional penalty beyond the standard DUI
  answer: A
  explanation: DUI with a passenger under age 16 is an aggravating factor in Illinois,
    carrying a mandatory minimum fine of $1,000 and 25 days of community service in
    a program benefiting children.
- id: 131
  category: alcohol_drugs_health
  question: What is a Monitoring Device Driving Permit (MDDP) in the state of Illinois?
  choices:
    A: A permit that allows a driver to use a cell phone for GPS only
    B: A permit for first-time DUI offenders to drive vehicles equipped with a Breath
      Alcohol Ignition Interlock Device (BAIID)
    C: A permit for student drivers to practice at night
    D: A permit for commercial drivers to track their hours
  answer: B
  explanation: A first-time DUI offender who is issued a Statutory Summary Suspension
    may apply for an MDDP, which allows them to drive as long as the vehicle is equipped
    with a BAIID.
- id: 132
  category: alcohol_drugs_health
  question: In Illinois, 'Illegal Transportation of Alcoholic Beverages' (Open Container)
    for a driver results in a license suspension for the second offense within what
    timeframe?
  choices:
    A: 6 months
    B: 12 months
    C: 24 months
    D: Any two convictions in a lifetime
  answer: B
  explanation: A second conviction for illegal transportation of alcohol within 12
    months will result in a suspension of driving privileges for the driver.
- id: 133
  category: alcohol_drugs_health
  question: Under Illinois law, which of the following is considered 'Aggravated DUI'?
  choices:
    A: DUI committed while driving a school bus with children on board
    B: DUI resulting in great bodily harm or permanent disfigurement
    C: DUI committed without a valid driver's license or permit
    D: All of the above
  answer: D
  explanation: Aggravated DUI is a felony in Illinois and includes DUI while driving
    a school bus, DUI causing serious injury or death, and DUI while unlicensed or
    uninsured.
- id: 134
  category: alcohol_drugs_health
  question: What is the maximum fine for a first-time DUI conviction in Illinois (excluding
    additional fees and assessments)?
  choices:
    A: Up to $500
    B: Up to $1,000
    C: Up to $2,500
    D: Up to $5,000
  answer: C
  explanation: A first DUI conviction is a Class A misdemeanor in Illinois, which
    carries a maximum fine of $2,500.
- id: 135
  category: alcohol_drugs_health
  question: In Illinois, it is illegal for a person to drive if they have used which
    of the following substances?
  choices:
    A: Illegal narcotics
    B: Prescription medications that impair driving
    C: Over-the-counter medications that cause drowsiness
    D: All of the above
  answer: D
  explanation: Illinois DUI laws apply to any substance that renders a person incapable
    of driving safely, including illegal drugs, prescription medications, and over-the-counter
    drugs.
- id: 136
  category: alcohol_drugs_health
  question: 'Regarding the transportation of medical cannabis in Illinois, the cannabis
    must be stored in a container that is:'
  choices:
    A: Kept in the glove compartment
    B: Odor-proof and child-resistant
    C: Placed in the front passenger seat for visibility
    D: Stored in the trunk only
  answer: B
  explanation: Illinois law requires medical cannabis to be transported in a sealed,
    odor-proof, child-resistant container. It is illegal to use cannabis in a motor
    vehicle.
- id: 137
  category: alcohol_drugs_health
  question: 'If you are involved in a personal injury or fatal crash in Illinois and
    a police officer has probable cause to believe you were impaired, you must:'
  choices:
    A: Submit to chemical testing or face license suspension
    B: Only submit to testing if you are formally arrested
    C: Only submit to testing if the other driver requests it
    D: Wait 24 hours before testing
  answer: A
  explanation: Illinois law requires drivers involved in personal injury or fatal
    crashes to submit to chemical testing if there is probable cause of impairment.
    Refusal results in a minimum 1-year suspension.
- id: 138
  category: alcohol_drugs_health
  question: Under the Illinois 'Implied Consent' law, by driving on Illinois roadways,
    you automatically consent to which of the following?
  choices:
    A: A search of your vehicle for alcohol at any time
    B: Chemical testing (breath, blood, or urine) to determine alcohol or drug content
    C: A mandatory 24-hour jail stay if pulled over for speeding
    D: The installation of an ignition interlock device in your vehicle
  answer: B
  explanation: Illinois' Implied Consent law means that by driving on Illinois roadways,
    you automatically consent to submit to certain tests (breath, blood, or urine)
    following an arrest for DUI.
- id: 139
  category: alcohol_drugs_health
  question: If an Illinois driver is convicted of a first DUI offense, their driving
    privileges will be revoked for a minimum of how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: A first DUI conviction in Illinois results in a minimum 1-year revocation
    of driving privileges (2 years if the driver is under age 21).
- id: 140
  category: alcohol_drugs_health
  question: What is the penalty for a first offense of refusing to submit to chemical
    testing (breath, blood, or urine) in Illinois?
  choices:
    A: 6-month suspension of driving privileges
    B: 12-month suspension of driving privileges
    C: Automatic 48 hours in jail
    D: Permanent loss of driver's license
  answer: B
  explanation: Under the Statutory Summary Suspension law, a first offense for refusing
    to submit to chemical testing results in a 12-month suspension.
- id: 141
  category: alcohol_drugs_health
  question: In Illinois, if a driver's chemical test indicates a BAC of 0.08% or more
    on a first offense, their driving privileges will be suspended for how long?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A first offense for failing a chemical test (BAC of 0.08% or more)
    results in a mandatory 6-month statutory summary suspension.
- id: 142
  category: alcohol_drugs_health
  question: Which of the following is true regarding the 'Illegal Transportation of
    Alcoholic Beverages' in Illinois?
  choices:
    A: Alcohol may be transported in the passenger area if the seal is broken but
      the cap is on
    B: Alcohol must be in its original container with the seal unbroken
    C: Passengers in a standard passenger car may drink alcohol as long as the driver
      is sober
    D: Open containers are allowed in the glove compartment as long as it is locked
  answer: B
  explanation: In Illinois, it is illegal to transport, carry, possess, or have any
    alcoholic beverage within the passenger area of any motor vehicle except in the
    original container and with the seal unbroken.
- id: 143
  category: alcohol_drugs_health
  question: A first-time DUI offender in Illinois may be eligible for a Monitoring
    Device Driving Permit (MDDP). What does this permit require?
  choices:
    A: The driver may only drive during daylight hours
    B: The driver must be accompanied by a licensed adult over 21
    C: The driver must have a Breath Alcohol Ignition Interlock Device (BAIID) installed
      in their vehicle
    D: The driver may only drive to and from work or school
  answer: C
  explanation: A first-time DUI offender may be eligible for an MDDP, which allows
    them to drive anywhere at any time as long as they have a BAIID installed in their
    vehicle.
- id: 144
  category: alcohol_drugs_health
  question: In Illinois, a driver is considered under the influence of cannabis if
    they have a THC concentration of at least how many nanograms per milliliter of
    whole blood?
  choices:
    A: 2 nanograms
    B: 5 nanograms
    C: 10 nanograms
    D: 15 nanograms
  answer: B
  explanation: Illinois law defines cannabis impairment for driving as having 5 nanograms
    or more of THC per milliliter of whole blood (or 10 nanograms or more in other
    bodily substances).
- id: 145
  category: alcohol_drugs_health
  question: What is the minimum license revocation period for an Illinois driver under
    age 21 convicted of their first DUI?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: Until they turn 21
  answer: B
  explanation: While the revocation for a driver 21 or older is 1 year for a first
    offense, it is a minimum of 2 years for a driver under age 21.
- id: 146
  category: alcohol_drugs_health
  question: In Illinois, an 'Aggravated DUI' charge can be issued if the driver is
    involved in which of the following?
  choices:
    A: A DUI resulting in personal injury or death
    B: A DUI while driving a school bus with children on board
    C: A third or subsequent DUI conviction
    D: All of the above
  answer: D
  explanation: Aggravated DUI is a more serious (felony) charge in Illinois that applies
    to third or subsequent DUIs, DUIs resulting in injury/death, DUIs while driving
    a school bus, or DUIs without a valid license/insurance.
- id: 147
  category: alcohol_drugs_health
  question: After a DUI conviction in Illinois, what type of high-risk auto insurance
    must a driver carry for three years?
  choices:
    A: Comprehensive and Collision
    B: SR-22 insurance
    C: Uninsured Motorist Coverage only
    D: Medical Payments Coverage
  answer: B
  explanation: Drivers convicted of DUI in Illinois are required to file proof of
    financial responsibility, typically through SR-22 insurance, for three years.
- id: 148
  category: alcohol_drugs_health
  question: If you are under age 21 and caught purchasing or possessing alcohol in
    Illinois, what happens to your driving privileges?
  choices:
    A: Nothing, as long as you weren't driving
    B: Your license will be suspended for 6 months for a first offense
    C: Your license will be revoked for 1 year
    D: Your license will be suspended for 3 months
  answer: B
  explanation: In Illinois, if you are under 21 and convicted of purchasing, possessing,
    or consuming alcohol, your driving privileges will be suspended for 6 months for
    a first offense.
- id: 149
  category: alcohol_drugs_health
  question: If an Illinois driver is involved in a personal injury or fatal crash
    and is found to have any trace of a controlled substance in their system, what
    is the consequence?
  choices:
    A: They will be charged with a Class A misdemeanor
    B: They may be charged with Aggravated DUI
    C: They will only be charged if they were at fault for the crash
    D: They will receive a warning if it is their first offense
  answer: B
  explanation: In Illinois, driving with any trace of a controlled substance or cannabis
    (above legal limits) in the system while involved in a crash resulting in injury
    or death can lead to an Aggravated DUI charge.
- id: 150
  category: alcohol_drugs_health
  question: In Illinois, how long will a second refusal to submit to chemical testing
    result in a license suspension if it occurs within 5 years of a previous suspension?
  choices:
    A: 12 months
    B: 24 months
    C: 36 months
    D: 60 months
  answer: C
  explanation: A second or subsequent refusal to submit to chemical testing within
    a 5-year period results in a 3-year (36-month) statutory summary suspension in
    Illinois.
- id: 151
  category: penalties_and_points
  question: In Illinois, what is the minimum length of time your driver's license
    will be revoked for a first conviction of Driving Under the Influence (DUI)?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: A first DUI conviction in Illinois results in a minimum one-year revocation
    of driving privileges.
- id: 152
  category: penalties_and_points
  question: Under Illinois' Statutory Summary Suspension law, how long will your license
    be suspended if you refuse to submit to chemical testing (breath, blood, or urine)
    for the first time?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: If an Illinois driver refuses chemical testing for the first time,
    their license is automatically suspended for 12 months.
- id: 153
  category: penalties_and_points
  question: If an Illinois driver is a first-time offender and fails a chemical test
    (showing a BAC of .08% or more), how long will their driving privileges be suspended?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A first-time DUI offender who fails a chemical test faces a 6-month
    statutory summary suspension.
- id: 154
  category: penalties_and_points
  question: What is the minimum fine for a first violation of 'Scott's Law' (the Move
    Over Law) in Illinois?
  choices:
    A: '100'
    B: '250'
    C: '500'
    D: 1,000
  answer: B
  explanation: A first violation of Scott's Law, which requires drivers to slow down
    and move over for emergency vehicles, carries a minimum fine of $250.
- id: 155
  category: penalties_and_points
  question: 'In Illinois, a first conviction for illegally passing a stopped school
    bus with its red lights flashing and stop arm extended results in a license suspension
    of:'
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: A first conviction for passing a stopped school bus results in a mandatory
    3-month driver's license suspension and a $150 fine.
- id: 156
  category: penalties_and_points
  question: 'In Illinois, speeding 26 mph or more but less than 35 mph over the limit
    is considered:'
  choices:
    A: A petty offense
    B: A Class C misdemeanor
    C: A Class B misdemeanor
    D: A Class A misdemeanor
  answer: C
  explanation: Speeding 26-34 mph over the limit in Illinois is a Class B misdemeanor.
- id: 157
  category: penalties_and_points
  question: 'An Illinois driver convicted of a third or subsequent offense of driving
    without valid insurance faces a mandatory fine of:'
  choices:
    A: '250'
    B: '500'
    C: 1,000
    D: 2,500
  answer: C
  explanation: A third or subsequent conviction for driving without insurance in Illinois
    results in a $1,000 fine and a 4-month license suspension.
- id: 158
  category: penalties_and_points
  question: For drivers age 21 and over, how many moving violation convictions within
    a 12-month period will result in a license suspension?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: Drivers age 21 and over will have their license suspended if they are
    convicted of three or more moving violations within any 12-month period.
- id: 159
  category: penalties_and_points
  question: 'In Illinois, fleeing or attempting to elude a police officer is a:'
  choices:
    A: Petty offense
    B: Class C misdemeanor
    C: Class B misdemeanor
    D: Class A misdemeanor
  answer: D
  explanation: Fleeing or attempting to elude a police officer is a Class A misdemeanor,
    which can carry a fine of up to $2,500 and up to one year in jail.
- id: 160
  category: penalties_and_points
  question: 'In Illinois, it is illegal to possess or use a radar jamming device.
    A first conviction for this offense is a:'
  choices:
    A: Petty offense with a $50 fine
    B: Class C misdemeanor
    C: Class A misdemeanor
    D: Class 4 felony
  answer: A
  explanation: Possession or use of a radar jamming device is a petty offense in Illinois,
    punishable by a fine for the first offense.
- id: 161
  category: penalties_and_points
  question: 'If you are convicted of using a fraudulent driver''s license or ID card
    in Illinois, the Secretary of State may suspend or revoke your driving privileges
    for at least:'
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: Using a fake ID or a fraudulent driver's license can result in a minimum
    12-month suspension or revocation of driving privileges.
- id: 162
  category: penalties_and_points
  question: 'In Illinois, littering from a motor vehicle is illegal. A conviction
    for littering is a Class B misdemeanor and can result in a fine of up to:'
  choices:
    A: '500'
    B: 1,000
    C: 1,500
    D: 2,500
  answer: C
  explanation: Littering is a Class B misdemeanor in Illinois, punishable by a fine
    of up to $1,500.
- id: 163
  category: penalties_and_points
  question: In Illinois, if a driver is arrested for DUI and refuses to submit to
    chemical testing, their driving privileges will be suspended for how long for
    a first offense?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: Under the Illinois Statutory Summary Suspension law, a first-time refusal
    to submit to chemical testing results in a 12-month suspension of driving privileges.
- id: 164
  category: penalties_and_points
  question: If an Illinois driver is arrested for DUI and chemical testing reveals
    a BAC of .08 or more, their license will be suspended for how long for a first
    offense?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A first offense for failing chemical testing (BAC of .08 or more) results
    in a mandatory 6-month Statutory Summary Suspension in Illinois.
- id: 165
  category: penalties_and_points
  question: 'In Illinois, driving 35 mph or more over the posted speed limit is classified
    as:'
  choices:
    A: A Class C misdemeanor
    B: A Class B misdemeanor
    C: A Class A misdemeanor
    D: A Class 4 felony
  answer: C
  explanation: Aggravated speeding in Illinois of 35 mph or more over the limit is
    a Class A misdemeanor.
- id: 166
  category: penalties_and_points
  question: 'For an Illinois driver under age 21, a first conviction for the illegal
    transportation of alcohol (open container) results in:'
  choices:
    A: A $100 fine only
    B: A 3-month license suspension
    C: A 6-month license suspension
    D: A 12-month license suspension
  answer: D
  explanation: Illinois law mandates a 12-month license suspension for any driver
    under age 21 convicted of illegal transportation of alcohol (first offense).
- id: 167
  category: penalties_and_points
  question: What is the minimum fine for operating a motor vehicle in Illinois without
    the required mandatory liability insurance (first offense)?
  choices:
    A: '100'
    B: '250'
    C: '500'
    D: 1,000
  answer: C
  explanation: Operating a vehicle without insurance in Illinois carries a minimum
    fine of $500 for a first offense.
- id: 168
  category: penalties_and_points
  question: In Illinois, a first-time DUI offender may be eligible for a Monitoring
    Device Driving Permit (MDDP), which requires the installation of a BAIID. What
    does BAIID stand for?
  choices:
    A: Breath Alcohol Internal Ignition Device
    B: Breath Alcohol Ignition Interlock Device
    C: Biological Alcohol Interlock Indicator Device
    D: Breathalyzer Automated Ignition Interlock Device
  answer: B
  explanation: BAIID stands for Breath Alcohol Ignition Interlock Device. It is required
    for first-time DUI offenders who wish to drive during their Statutory Summary
    Suspension.
- id: 169
  category: penalties_and_points
  question: In Illinois, leaving the scene of an accident involving personal injury
    or death results in the mandatory ________ of your driver's license.
  choices:
    A: Suspension
    B: Revocation
    C: Cancellation
    D: Restriction
  answer: B
  explanation: Leaving the scene of an accident involving personal injury or death
    is a serious offense in Illinois that results in the permanent revocation of driving
    privileges.
- id: 170
  category: penalties_and_points
  question: 'If an Illinois driver is convicted of providing false information to
    the Secretary of State on a license application, their driving privileges will
    be suspended for at least:'
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: Providing false information or using a fraudulent ID to obtain a license
    in Illinois results in a mandatory 12-month suspension.
- id: 171
  category: penalties_and_points
  question: Under Scott's Law in Illinois, if a driver's failure to yield to an emergency
    vehicle results in the injury of another person, their license may be suspended
    for how long?
  choices:
    A: 90 days to 1 year
    B: 6 months to 2 years
    C: 1 year to 3 years
    D: 2 years to 5 years
  answer: B
  explanation: If a Scott's Law violation results in injury to another person, the
    driver faces a mandatory license suspension of 6 months to 2 years.
- id: 172
  category: penalties_and_points
  question: For drivers aged 21 and over in Illinois, driving privileges will be suspended
    if they are convicted of how many moving violations within a 12-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: Drivers aged 21 and over will have their license suspended if they
    receive three moving violation convictions within any 12-month period.
- id: 173
  category: sharing_the_road
  question: Scott's Law (Illinois' Move Over Law) requires drivers to change lanes
    or slow down when approaching which stationary vehicles?
  choices:
    A: Only police and fire department vehicles
    B: Only ambulances and tow trucks
    C: Any vehicle with flashing hazard lights or authorized emergency lights
    D: Only highway maintenance vehicles
  answer: C
  explanation: Scott's Law applies to any stationary vehicle with flashing hazard
    lights or authorized emergency lights, including commercial trucks, passenger
    cars, and emergency responders.
- id: 174
  category: sharing_the_road
  question: What is the maximum speed limit in an Illinois school zone on school days
    when children are present and signs are posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: In Illinois, the speed limit in a school zone is 20 mph on school days
    between 7 a.m. and 4 p.m. when children are present.
- id: 175
  category: sharing_the_road
  question: If a driver is convicted of violating Scott's Law (Move Over Law) for
    the first time, what is the minimum mandatory fine?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: A first violation of Scott's Law in Illinois carries a mandatory minimum
    fine of $250. If property damage or injury occurs, penalties increase significantly.
- id: 176
  category: sharing_the_road
  question: In Illinois, when a funeral procession is using hazard lights and following
    an escort vehicle with flashing lights, who has the right-of-way at intersections?
  choices:
    A: The first vehicle in the procession only
    B: The entire procession has the right-of-way regardless of traffic signals
    C: Other motorists have the right-of-way
    D: Only the police escort vehicle
  answer: B
  explanation: In Illinois, funeral processions have the right-of-way at intersections.
    Motorists should yield to the entire procession and not drive between vehicles
    in the procession.
- id: 177
  category: sharing_the_road
  question: When following a motorcycle, what is the recommended following distance
    to allow the motorcyclist enough time to maneuver in an emergency?
  choices:
    A: 1-2 seconds
    B: 3-4 seconds
    C: 5-6 seconds
    D: 10 seconds
  answer: B
  explanation: The Illinois Rules of the Road recommends a 3-4 second following distance
    when behind a motorcycle to provide more time to react to hazards that might affect
    the cyclist.
- id: 178
  category: sharing_the_road
  question: Under Illinois law, a driver must come to a complete stop for a pedestrian
    in which of the following scenarios?
  choices:
    A: Only if they are in a marked crosswalk
    B: Only if they are in an unmarked crosswalk at an intersection
    C: In any crosswalk (marked or unmarked) when the pedestrian is on the driver's
      side of the road
    D: Only if the pedestrian is using a white cane
  answer: C
  explanation: Illinois law requires drivers to stop and yield the right-of-way to
    a pedestrian in a crosswalk, whether marked or unmarked, when the pedestrian is
    upon the half of the roadway upon which the vehicle is traveling.
- id: 179
  category: sharing_the_road
  question: 'If you are convicted of passing a stopped school bus in Illinois, your
    driver''s license will be suspended for a minimum of:'
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: A first conviction for passing a stopped school bus in Illinois results
    in a mandatory 3-month driver's license suspension.
- id: 180
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may:'
  choices:
    A: Stay entirely in the right lane throughout the turn
    B: Need to swing wide into the left lane to complete the turn
    C: Stop and wait for all traffic behind it to clear
    D: Turn from the left lane only
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn.
    Motorists should avoid 'squeezing' between the truck and the curb.
- id: 181
  category: sharing_the_road
  question: In Illinois, it is illegal to 'lane split.' This refers to which of the
    following actions?
  choices:
    A: Driving in two lanes at once
    B: A motorcycle driving between two rows of slow or stopped vehicles in the same
      lane
    C: Passing a car on the right on a two-lane road
    D: Changing lanes without using a turn signal
  answer: B
  explanation: Lane splitting—where a motorcycle drives between lanes of traffic—is
    illegal in Illinois. Motorcycles are entitled to the full width of a lane.
- id: 182
  category: sharing_the_road
  question: 'When approaching a stationary emergency vehicle with its lights flashing,
    if you cannot safely change lanes, you must:'
  choices:
    A: Maintain your speed and stay in your lane
    B: Stop immediately in the roadway
    C: Slow down and proceed with caution
    D: Honk your horn to warn the emergency responders
  answer: C
  explanation: Under Scott's Law, if a lane change is not possible or safe, the driver
    must reduce speed and proceed with due caution while passing the stationary emergency
    vehicle.
- id: 183
  category: sharing_the_road
  question: 'A driver approaching a blind pedestrian carrying a white cane or accompanied
    by a guide dog must:'
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and stop if necessary to allow them to cross
    C: Drive around them quickly to clear the intersection
    D: Only stop if there is a 'Pedestrian Crossing' sign
  answer: B
  explanation: Illinois law states that the driver of a vehicle shall yield the right-of-way
    to any blind or visually impaired pedestrian carrying a white cane or accompanied
    by a guide dog.
- id: 184
  category: sharing_the_road
  question: 'When a motorist is turning right and a bicyclist is approaching from
    the right rear, the motorist should:'
  choices:
    A: Speed up to turn before the bicyclist arrives
    B: Honk to warn the bicyclist to stop
    C: Wait for the bicyclist to pass before making the turn
    D: Turn anyway, as the bicyclist must yield to cars
  answer: C
  explanation: Motorists must yield to bicyclists just as they would to other vehicles.
    When turning right, check for cyclists and wait for them to pass to avoid a 'right
    hook' collision.
- id: 185
  category: sharing_the_road
  question: In Illinois, what is the mandatory minimum fine for a first conviction
    of failing to stop for a school bus that has its stop arm extended and red lights
    flashing?
  choices:
    A: $100
    B: $150
    C: $250
    D: $500
  answer: B
  explanation: According to the Illinois Rules of the Road, a first conviction for
    passing a stopped school bus with its red lights flashing and stop arm extended
    results in a minimum $150 fine and a three-month driver's license suspension.
- id: 186
  category: sharing_the_road
  question: Under Illinois law (Scott's Law), what must a driver do when approaching
    any vehicle with flashing hazard or emergency lights stopped on the side of the
    road?
  choices:
    A: Maintain speed but honk to alert the vehicle
    B: Stop completely until the emergency vehicle moves
    C: Change lanes if safe to do so or reduce speed and proceed with caution
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Scott's Law (the Move Over Law) requires Illinois drivers to change
    lanes if safe to do so, or if a lane change is not possible, reduce speed and
    proceed with caution when approaching any stationary vehicle with flashing lights.
- id: 187
  category: sharing_the_road
  question: In Illinois, what does the 'Dutch Reach' refer to when exiting a parked
    vehicle?
  choices:
    A: Checking the rearview mirror twice
    B: Using the hand furthest from the door to open it, forcing the driver to look
      for cyclists
    C: Turning off the engine before checking for traffic
    D: Opening the door only halfway to signal intent
  answer: B
  explanation: The Illinois Rules of the Road encourages the 'Dutch Reach'—using the
    hand furthest from the door to open it—which naturally turns the driver's body
    to look for approaching cyclists and vehicles.
- id: 188
  category: sharing_the_road
  question: 'In Illinois, when a pedestrian is using a white cane or a guide dog,
    a driver must:'
  choices:
    A: Honk to let them know you are there
    B: Slow down and proceed with caution
    C: Come to a complete stop and yield the right-of-way
    D: Only stop if the pedestrian is in a marked crosswalk
  answer: C
  explanation: Illinois law requires drivers to come to a complete stop and yield
    the right-of-way to any pedestrian who is blind or visually impaired and using
    a white cane or guide dog, regardless of where they are crossing.
- id: 189
  category: sharing_the_road
  question: What is the penalty for a second conviction of passing a stopped school
    bus in Illinois within a five-year period?
  choices:
    A: $250 fine and 6-month suspension
    B: $500 fine and 1-year suspension
    C: $1,000 fine and permanent revocation
    D: $750 fine and 2-year suspension
  answer: B
  explanation: A second conviction for passing a stopped school bus in Illinois within
    five years results in a mandatory $500 fine and a one-year suspension of driving
    privileges.
- id: 190
  category: sharing_the_road
  question: When following a motorcycle in Illinois, what is the recommended following
    distance to allow for sudden stops or changes in road conditions?
  choices:
    A: 1-2 seconds
    B: 3-4 seconds
    C: 5-6 seconds
    D: 10 seconds
  answer: B
  explanation: The Illinois Secretary of State recommends a following distance of
    at least 3 to 4 seconds when behind a motorcycle to provide enough time to react
    to hazards that might affect the motorcyclist more than a car.
- id: 191
  category: sharing_the_road
  question: In Illinois, is 'lane splitting' (motorcycles driving between two lanes
    of slow-moving or stopped traffic) legal?
  choices:
    A: Yes, it is legal at all times
    B: Yes, but only if traffic is moving slower than 20 mph
    C: No, it is illegal in Illinois
    D: Yes, but only on designated expressways
  answer: C
  explanation: Lane splitting is illegal in Illinois. Motorcycles are entitled to
    the full use of a traffic lane, and no motor vehicle shall be driven in such a
    manner as to deprive any motorcycle of the full use of a lane.
- id: 192
  category: sharing_the_road
  question: Large trucks have 'No-Zones' where the driver cannot see other vehicles.
    Where is the largest and most dangerous No-Zone on a commercial truck?
  choices:
    A: Directly behind the truck
    B: The front of the truck
    C: The left side of the truck
    D: The right side of the truck
  answer: D
  explanation: While trucks have blind spots on all sides, the right side is the largest
    and most dangerous No-Zone because trucks must often make wide right turns.
- id: 193
  category: sharing_the_road
  question: 'In Illinois, if you are involved in a crash with a pedestrian or a person
    riding a bicycle, you must:'
  choices:
    A: Only stop if the person is visibly injured
    B: Stop immediately at the scene and provide assistance
    C: Drive to the nearest police station without stopping
    D: Leave a note if the person is unconscious
  answer: B
  explanation: Illinois law requires any driver involved in a crash to stop immediately
    at the scene, provide assistance to any injured persons, and exchange information.
- id: 194
  category: vehicle_information
  question: According to Illinois law, when must a vehicle's headlights be illuminated?
  choices:
    A: Only between sunset and sunrise
    B: Only when visibility is less than 1,000 feet
    C: From sunset to sunrise and when windshield wipers are in use
    D: Only when driving on rural highways
  answer: C
  explanation: Illinois law requires headlights to be on from sunset to sunrise, and
    at any other time when windshield wipers are in use due to rain, snow, fog, or
    other atmospheric conditions.
- id: 195
  category: vehicle_information
  question: What is the minimum required tread depth for tires on a passenger vehicle
    in Illinois?
  choices:
    A: 1/32 of an inch
    B: 2/32 (1/16) of an inch
    C: 4/32 (1/8) of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Illinois law requires that tires have a minimum tread depth of 2/32
    of an inch (1/16 inch) and must be free of bulges or fabric exposure.
- id: 196
  category: vehicle_information
  question: 'Under Illinois law, every motor vehicle must be equipped with a horn
    that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Illinois requires all motor vehicles to have a horn that can be heard
    for at least 200 feet.
- id: 197
  category: vehicle_information
  question: Which of the following is TRUE regarding window tinting for passenger
    cars in Illinois?
  choices:
    A: Tinting is allowed on the entire front windshield if it is light
    B: No tinting is allowed on any window of the vehicle
    C: Non-reflective tint is allowed on the top 6 inches of the front windshield
    D: Illinois does not regulate window tinting
  answer: C
  explanation: In Illinois, non-reflective tint is allowed on the upper 6 inches of
    the front windshield. Specific percentages apply to side and rear windows, but
    the windshield is strictly limited.
- id: 198
  category: vehicle_information
  question: In Illinois, if a load extends how many feet or more beyond the rear of
    the vehicle, a red flag or red light must be attached to the end of the load?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: If a load extends 4 feet or more past the rear of the vehicle, a red
    flag (day) or red light (night) must be displayed at the extreme rear of the load.
- id: 199
  category: vehicle_information
  question: Which of the following equipment is prohibited on a non-emergency vehicle
    in Illinois?
  choices:
    A: A backup camera
    B: A blue light or flashing red light visible from the front
    C: A GPS unit mounted on the dashboard
    D: A trailer hitch
  answer: B
  explanation: Illinois law prohibits the use of red or blue flashing lights on the
    front of non-emergency vehicles, as these are reserved for police and emergency
    responders.
- id: 200
  category: vehicle_information
  question: In Illinois, a vehicle's foot brake must be able to stop the vehicle within
    how many feet when traveling at 20 mph?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 40 feet
  answer: B
  explanation: Illinois equipment standards require that the foot brake must be able
    to stop a vehicle traveling 20 mph within 25 feet.
- id: 201
  category: vehicle_information
  question: What is the maximum legal height for a front bumper on a passenger car
    in Illinois?
  choices:
    A: 18 inches
    B: 22 inches
    C: 28 inches
    D: 30 inches
  answer: B
  explanation: In Illinois, the maximum bumper height for a passenger car is 22 inches
    from the ground to the bottom of the bumper.
- id: 202
  category: vehicle_information
  question: Which of the following is a requirement for the exhaust system in Illinois?
  choices:
    A: It must produce a 'rumble' sound to alert pedestrians
    B: It must be equipped with a muffler in good working order to prevent excessive
      noise
    C: Muffler cutouts or bypasses are allowed on rural roads
    D: Exhaust pipes must point upward
  answer: B
  explanation: Illinois law requires all vehicles to have a muffler in constant operation
    to prevent excessive noise and smoke. Muffler cutouts and bypasses are illegal.
- id: 203
  category: vehicle_information
  question: 'In Illinois, a slow-moving vehicle emblem (an orange triangle) must be
    displayed on the rear of any vehicle designed to travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The slow-moving vehicle emblem is required for vehicles designed to
    operate at speeds of 25 mph or less, such as farm tractors or construction equipment.
- id: 204
  category: vehicle_information
  question: Illinois law requires that a rearview mirror must provide a view of the
    highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Every motor vehicle in Illinois must have a mirror that allows the
    driver to see at least 200 feet to the rear.
- id: 205
  category: vehicle_information
  question: In which of the following Illinois areas is vehicle emissions testing
    typically required?
  choices:
    A: Only in the city of Springfield
    B: In all 102 Illinois counties
    C: Specific areas including the Chicago and East St. Louis metropolitan areas
    D: Only for vehicles older than 25 years
  answer: C
  explanation: Vehicle emissions testing in Illinois is required for most vehicles
    registered in the Chicago and East St. Louis metropolitan areas (specifically
    parts of Cook, DuPage, Lake, Kane, Kendall, McHenry, Will, Madison, and St. Clair
    counties).
- id: 206
  category: vehicle_information
  question: When using high-beam headlights in Illinois, you must dim them at least
    how many feet before meeting an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Illinois law requires drivers to dim high-beam headlights at least
    500 feet before meeting an oncoming vehicle.
- id: 207
  category: vehicle_information
  question: 'In Illinois, tires are considered unsafe if the tread depth is less than:'
  choices:
    A: 1/16 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/8 of an inch
  answer: B
  explanation: Illinois law states that tires must have at least 2/32 of an inch of
    tread depth to be considered safe and legal for operation.
- id: 208
  category: vehicle_information
  question: 'In Illinois, the registration plate at the rear of a vehicle must be
    illuminated by a white light so it is visible from at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 150 feet
  answer: B
  explanation: Illinois law requires a white light to illuminate the rear registration
    plate so it is clearly legible from a distance of 50 feet.
- id: 209
  category: vehicle_information
  question: Under Illinois law, what is the maximum allowable percentage of tinting
    on front side windows (unless a medical exception applies)?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: Front side window tinting is completely prohibited
  answer: B
  explanation: In Illinois, the general rule for window tinting is that front side
    windows must allow more than 35% of light to pass through (35% VLT).
- id: 210
  category: vehicle_information
  question: Which of the following is true regarding the use of a television or video
    monitor in an Illinois vehicle?
  choices:
    A: They are allowed anywhere in the vehicle as long as the driver is over 21
    B: They are prohibited if they are located where the driver can see them while
      the vehicle is in motion
    C: They are allowed only if the audio is muted
    D: They are only allowed in the front seat for GPS purposes
  answer: B
  explanation: Illinois law prohibits the operation of a video monitor or television
    in a location where it is visible to the driver while the vehicle is in motion,
    with exceptions for navigation and vehicle information systems.
- id: 211
  category: vehicle_information
  question: 'In Illinois, turn signals must be visible from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Illinois law requires that electric turn signals be visible from a
    distance of not less than 300 feet in normal sunlight.
- id: 212
  category: vehicle_information
  question: Which of the following equipment is NOT required on all passenger vehicles
    in Illinois?
  choices:
    A: Windshield wipers
    B: Muffler
    C: Backup camera
    D: Parking brake
  answer: C
  explanation: While many newer vehicles have backup cameras, they are not a state-mandated
    equipment requirement for all vehicles under the Illinois vehicle code, unlike
    wipers, mufflers, and brakes.
- id: 213
  category: vehicle_information
  question: In Illinois, vehicles that are four years old or older must undergo emissions
    testing every two years if they are registered in which of the following areas?
  choices:
    A: Only the City of Chicago
    B: All counties in Illinois
    C: Specific counties in the Chicago and Metro-East (St. Louis) areas
    D: Only vehicles used for commercial purposes
  answer: C
  explanation: Emissions testing is required for most vehicles in the Chicago metropolitan
    area and the Metro-East area of Illinois every two years once the vehicle is four
    years old.
- id: 214
  category: vehicle_information
  question: 'In Illinois, a ''Slow Moving Vehicle'' emblem must be displayed on the
    rear of any vehicle that travels at a speed of less than:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Illinois law requires a Slow Moving Vehicle emblem (an orange fluorescent
    triangle with a red reflective border) on vehicles designed to travel at speeds
    of 25 mph or less.
- id: 215
  category: signs_and_signals
  question: 'In Illinois, a pennant-shaped sign placed on the left side of a two-lane
    road indicates:'
  choices:
    A: A school zone is ahead
    B: The beginning of a no-passing zone
    C: A sharp curve to the left
    D: A construction zone
  answer: B
  explanation: In Illinois, a yellow pennant-shaped sign is used specifically to mark
    the beginning of a no-passing zone and is located on the left side of the road.
- id: 216
  category: signs_and_signals
  question: When approaching a traffic signal in Illinois that is showing a steady
    yellow light, what should you do?
  choices:
    A: Speed up to clear the intersection before it turns red
    B: Stop immediately, even if you are in the middle of the intersection
    C: Prepare to stop, as the light is about to turn red
    D: Honk your horn and proceed with caution
  answer: C
  explanation: A steady yellow light means the signal is changing from green to red.
    Illinois law requires drivers to prepare to stop if it is safe to do so.
- id: 217
  category: signs_and_signals
  question: In Illinois, what does a flashing red traffic light signify?
  choices:
    A: The signal is broken; proceed with extreme caution
    B: Yield to all traffic, but do not come to a complete stop
    C: Stop, yield the right-of-way to traffic and pedestrians, then proceed when
      safe
    D: Wait for the light to turn green before moving
  answer: C
  explanation: According to the Illinois Rules of the Road, a flashing red light must
    be treated the same as a stop sign.
- id: 218
  category: signs_and_signals
  question: If your vehicle's turn signals are not working, how should you signal
    a right turn using hand signals in Illinois?
  choices:
    A: Extend your left arm straight out the window
    B: Extend your left arm out and bend it upward at the elbow
    C: Extend your left arm out and bend it downward at the elbow
    D: Extend your right arm straight out the passenger window
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out and bent upward at a 90-degree angle.
- id: 219
  category: signs_and_signals
  question: Under Illinois law, when is it legal to turn left on a red light?
  choices:
    A: Never; left turns on red are strictly prohibited
    B: Only when turning from a one-way street onto another one-way street
    C: Anytime there is no oncoming traffic
    D: Only between the hours of 10:00 PM and 6:00 AM
  answer: B
  explanation: In Illinois, a left turn on red is permitted only when turning from
    a one-way street onto another one-way street after coming to a complete stop and
    yielding to traffic and pedestrians.
- id: 220
  category: signs_and_signals
  question: What is the meaning of a solid yellow line on your side of the center
    dash line in Illinois?
  choices:
    A: You are in a high-speed zone
    B: You may pass with caution
    C: You are not allowed to pass
    D: You must turn right at the next intersection
  answer: C
  explanation: A solid yellow line on your side of the center line indicates a no-passing
    zone in Illinois.
- id: 221
  category: signs_and_signals
  question: 'In Illinois, a pentagon-shaped sign (five-sided) specifically warns you
    of:'
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A yield requirement
  answer: C
  explanation: A pentagon-shaped sign is used exclusively for school zones and school
    crossings in Illinois.
- id: 222
  category: signs_and_signals
  question: What does a flashing yellow arrow mean at an Illinois intersection?
  choices:
    A: You have the right-of-way to turn
    B: You may turn in the direction of the arrow after yielding to oncoming traffic
      and pedestrians
    C: The turn is prohibited; wait for a green arrow
    D: The intersection is closed for construction
  answer: B
  explanation: A flashing yellow arrow means you may turn left (or in the direction
    of the arrow) but you must first yield to all oncoming traffic and pedestrians.
- id: 223
  category: signs_and_signals
  question: What color are regulatory signs in Illinois, such as 'Speed Limit' or
    'No U-Turn'?
  choices:
    A: Yellow with black lettering
    B: White with black or red lettering
    C: Orange with black lettering
    D: Green with white lettering
  answer: B
  explanation: Regulatory signs in Illinois are typically rectangular and white with
    black or red lettering/symbols.
- id: 224
  category: signs_and_signals
  question: In Illinois, what do broken white lines on the pavement indicate?
  choices:
    A: They separate lanes of traffic moving in opposite directions
    B: They indicate the edge of the roadway
    C: They separate lanes of traffic moving in the same direction
    D: They indicate a pedestrian crosswalk
  answer: C
  explanation: Broken white lines separate lanes of traffic moving in the same direction
    where lane changing is permitted.
- id: 225
  category: signs_and_signals
  question: 'When you see an orange diamond-shaped sign in Illinois, you should:'
  choices:
    A: Look for a hospital nearby
    B: Prepare for a school crossing
    C: Watch for construction or maintenance workers and equipment
    D: Stop and wait for a flagger
  answer: C
  explanation: Orange is the standard color for highway construction and maintenance
    signs in Illinois.
- id: 226
  category: signs_and_signals
  question: In Illinois, what does a round yellow sign with a black 'X' and the letters
    'RR' mean?
  choices:
    A: A rest area is ahead
    B: A railroad crossing is ahead
    C: The road is ending in a 'dead end'
    D: A rural route begins
  answer: B
  explanation: A round yellow warning sign with a black 'X' and 'RR' is the advance
    warning sign for a railroad crossing.
- id: 227
  category: signs_and_signals
  question: What does a red-and-white 'Yield' sign mean in Illinois?
  choices:
    A: Stop and wait for all traffic to pass before moving
    B: Slow down and be prepared to stop; let traffic or pedestrians with the right-of-way
      pass first
    C: You have the right-of-way over all other vehicles
    D: Speed up to merge into traffic quickly
  answer: B
  explanation: A yield sign means you must slow down and give the right-of-way to
    any vehicle or pedestrian in or approaching the intersection.
- id: 228
  category: signs_and_signals
  question: 'In Illinois, when approaching a traffic signal with a flashing red light,
    you must:'
  choices:
    A: Slow down and proceed with caution
    B: Stop only if other traffic is present
    C: Stop completely, yield the right-of-way, and proceed when it is safe
    D: Wait for the light to turn green
  answer: C
  explanation: 'A flashing red light in Illinois carries the same requirements as
    a stop sign: a complete stop is required before proceeding when safe.'
- id: 229
  category: signs_and_signals
  question: When a traffic signal shows a steady yellow light, what does it mean for
    an Illinois driver?
  choices:
    A: Speed up to clear the intersection
    B: The signal is changing to red and you should prepare to stop if it is safe
      to do so
    C: You have the right-of-way to turn left
    D: Stop immediately, even if you are in the middle of the intersection
  answer: B
  explanation: A steady yellow light indicates the signal is about to turn red. Drivers
    should stop if they can do so safely; otherwise, they should cautiously clear
    the intersection.
- id: 230
  category: signs_and_signals
  question: What does a flashing yellow traffic signal at an intersection mean in
    Illinois?
  choices:
    A: Stop and wait for a green light
    B: The same as a stop sign
    C: Proceed with caution
    D: Pedestrians have the right-of-way only
  answer: C
  explanation: A flashing yellow light means you should proceed with caution and be
    alert for potential hazards.
- id: 231
  category: signs_and_signals
  question: What do broken white lines on an Illinois roadway indicate?
  choices:
    A: Traffic is moving in opposite directions
    B: A no-passing zone
    C: Traffic is moving in the same direction and lane changes are permitted
    D: The edge of the roadway
  answer: C
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    Crossing them is allowed when changing lanes is safe.
- id: 232
  category: signs_and_signals
  question: If an Illinois driver uses hand signals, which signal indicates a right
    turn?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: B
  explanation: The standard hand signal for a right turn is the left arm and hand
    extended upward.
- id: 233
