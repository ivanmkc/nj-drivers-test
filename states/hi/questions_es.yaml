questions:
- id: 1
  category: license_system
  question: ¿En Hawái, cuál es la edad mínima que debe alcanzar una persona para solicitar
    un Permiso de Instrucción?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 14 años y medio
  answer: B
  explanation: De acuerdo con el Programa de Licencias Graduadas (GDL) de Hawái, el
    solicitante debe tener al menos 15 años y medio de edad para obtener un permiso
    de instrucción.
- id: 2
  category: license_system
  question: ¿Cuánto tiempo debe un menor de edad tener un Permiso de Instrucción de
    Hawái antes de ser elegible para solicitar una Licencia Provisional?
  choices:
    A: 90 días
    B: 120 días
    C: 180 días
    D: Un año
  answer: C
  explanation: La ley de Hawái exige que los titulares de permisos menores de 18 años
    mantengan su permiso de instrucción durante un mínimo de 180 días antes de realizar
    el examen de conducir para obtener una licencia provisional.
- id: 3
  category: license_system
  question: Mientras se conduce con un Permiso de Instrucción de Hawái, ¿cuántos años
    debe tener como mínimo el conductor supervisor?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: B
  explanation: La persona que ocupe el asiento al lado del titular del permiso debe
    tener al menos 21 años de edad y contar con licencia para operar ese tipo de vehículo.
- id: 4
  category: license_system
  question: Bajo la ley de Licencias Graduadas (GDL) de Hawái, ¿entre qué horas tiene
    generalmente restringido conducir el titular de una Licencia Provisional?
  choices:
    A: 10:00 PM y 4:00 AM
    B: 11:00 PM y 5:00 AM
    C: Medianoche y 6:00 AM
    D: 9:00 PM y 6:00 AM
  answer: B
  explanation: Los titulares de licencias provisionales no pueden conducir entre las
    11:00 PM y las 5:00 AM, a menos que estén acompañados por un padre o tutor, o
    por motivos específicos de trabajo o escuela con la documentación correspondiente.
- id: 5
  category: license_system
  question: ¿Cuántos pasajeros menores de 18 años que no sean miembros del hogar puede
    transportar el titular de una Licencia Provisional de Hawái?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: La licencia provisional restringe al conductor a llevar solo a un pasajero
    menor de 18 años que no sea miembro del hogar, a menos que esté acompañado por
    un padre o tutor.
- id: 6
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia de conducir de Hawái
    completa y sin restricciones?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: Un conductor puede obtener una licencia completa a los 17 años, siempre
    que haya tenido una licencia provisional durante al menos seis meses y no haya
    tenido infracciones o condenas pendientes.
- id: 7
  category: license_system
  question: Si cambia su dirección en Hawái, ¿dentro de cuántos días debe notificar
    por escrito al centro de licencias de conducir?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley estatal de Hawái exige que todos los conductores con licencia
    notifiquen al examinador de conductores cualquier cambio de residencia o nombre
    dentro de un plazo de 30 días.
- id: 8
  category: license_system
  question: Para un conductor de entre 25 y 71 años, ¿por cuántos años es válida normalmente
    una licencia de conducir de Hawái?
  choices:
    A: 2 años
    B: 4 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: En Hawái, a los conductores de entre 25 y 71 años se les emiten licencias
    que vencen ocho años después de la fecha de emisión.
- id: 9
  category: license_system
  question: Si el titular de una licencia provisional en Hawái es condenado por una
    infracción de tránsito (moving violation) por primera vez, ¿por cuánto tiempo
    se suspenderá la licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: C
  explanation: Bajo las leyes de Licencias Graduadas (GDL) de Hawái, una primera condena
    por una infracción de tránsito resulta en una suspensión de 90 días de la licencia
    provisional.
- id: 10
  category: license_system
  question: 'Para cumplir con los requisitos de ''Presencia Legal'' de Hawái para
    una licencia Real ID, el solicitante debe presentar prueba de:'
  choices:
    A: Registro de votante
    B: Una cuenta bancaria válida en Hawái
    C: Ciudadanía de los EE. UU. o autorización legal para estar en los EE. UU.
    D: Empleo en el estado de Hawái
  answer: C
  explanation: Presencia Legal significa que una persona es ciudadana de los EE. UU.
    o está legalmente autorizada para estar en los Estados Unidos; esto es obligatorio
    para obtener una licencia de conducir de Hawái.
- id: 11
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Instrucción de Hawái a partir
    de la fecha de emisión?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que el solicitante cumpla 18 años
  answer: B
  explanation: Un Permiso de Instrucción de Hawái es válido por un año y puede renovarse
    por otro año si no ha expirado por más de 90 días.
- id: 12
  category: license_system
  question: ¿Cuál de los siguientes NO es un requisito para pasar de una Licencia
    Provisional a una Licencia Completa en Hawái?
  choices:
    A: Debe tener al menos 17 años de edad
    B: Debe haber tenido la licencia provisional durante al menos 6 meses
    C: No debe tener infracciones o condenas pendientes
    D: Debe volver a tomar el examen escrito de conocimientos
  answer: D
  explanation: No es necesario volver a tomar el examen escrito de conocimientos para
    convertir una licencia provisional en una licencia completa, siempre que cumpla
    con los requisitos de edad y de historial limpio.
- id: 13
  category: license_system
  question: En Hawái, si es menor de 18 años y solicita un permiso, ¿quién debe firmar
    su solicitud?
  choices:
    A: Solo el solicitante
    B: Ambos padres (si viven y tienen la custodia)
    C: Cualquier adulto mayor de 21 años
    D: Un director de escuela
  answer: B
  explanation: La ley de Hawái exige que ambos padres firmen la solicitud de un menor,
    a menos que uno de los padres tenga la custodia exclusiva o haya fallecido.
- id: 14
  category: license_system
  question: ¿Cuál es el límite máximo de concentración de alcohol en sangre (BAC)
    para un conductor menor de 21 años en Hawái?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: Hawái tiene una ley de "Tolerancia Cero" para menores, que establece
    el límite de BAC en 0.02% para conductores menores de 21 años.
- id: 15
  category: license_system
  question: Al solicitar una licencia de conducir de Hawái, ¿cuántos documentos se
    requieren para demostrar la residencia en Hawái?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene pasaporte
  answer: B
  explanation: Para cumplir con los requisitos federales de Real ID, Hawái requiere
    dos documentos por separado para demostrar la residencia física en el estado.
- id: 16
  category: license_system
  question: Para cumplir con los requisitos mínimos de visión para una licencia de
    conducir de Hawái, ¿qué agudeza visual debe tener un solicitante en al menos un
    ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: En Hawái, los solicitantes deben tener una agudeza visual lejana de
    al menos 20/40 en al menos un ojo, con o sin lentes correctivos.
- id: 17
  category: license_system
  question: ¿Cuántos meses antes de que expire su licencia de conducir de Hawái se
    le permite renovarla?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Hawái permite a los conductores renovar sus licencias hasta
    seis meses antes de la fecha de vencimiento.
- id: 18
  category: license_system
  question: 'Bajo la ley de Licencia de Conducir Graduada (GDL) de Hawái, el titular
    de una Licencia Provisional puede conducir entre las 11:00 p.m. y las 5:00 a.m.
    solo si está acompañado por un padre o tutor, O si posee:'
  choices:
    A: Una declaración firmada de un empleador o funcionario escolar para actividades
      relacionadas con el trabajo o la escuela
    B: Una carta notariada de un amigo mayor de 21 años
    C: Una tarjeta de identificación de estudiante válida
    D: No hay excepciones a la restricción de conducción nocturna
  answer: A
  explanation: Los titulares de licencias provisionales pueden conducir durante las
    horas restringidas para actividades laborales o autorizadas por la escuela si
    llevan una declaración firmada del empleador o del funcionario escolar.
- id: 19
  category: license_system
  question: 'Una licencia de conducir estándar de Hawái para operar vehículos de pasajeros
    (menos de 18,000 libras de GVWR) se clasifica como una:'
  choices:
    A: Licencia Clase 1
    B: Licencia Clase 2
    C: Licencia Clase 3
    D: Licencia Clase 4
  answer: C
  explanation: En Hawái, una licencia Clase 3 es la categoría estándar requerida para
    operar la mayoría de los vehículos de pasajeros y camiones que pesan menos de
    18,000 libras (GVWR).
- id: 20
  category: license_system
  question: Si se muda a Hawái y posee una licencia de conducir válida de otro estado,
    por lo general debe solicitar una licencia de Hawái dentro de ¿cuántos días después
    de establecer la residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes en Hawái deben transferir su licencia de conducir
    de otro estado a una licencia de Hawái dentro de los 30 días posteriores al establecimiento
    de la residencia.
- id: 21
  category: license_system
  question: Al realizar el examen práctico de conducir en Hawái, ¿cuál de los siguientes
    documentos debe presentarse para el vehículo que se utilizará?
  choices:
    A: Solo el título del vehículo
    B: Un registro válido y un certificado de inspección de seguridad vigente
    C: El manual del propietario
    D: Una carta de permiso del concesionario
  answer: B
  explanation: El vehículo utilizado para el examen de conducir debe tener un registro
    de vehículo motorizado válido y un certificado y calcomanía de inspección de seguridad
    de Hawái vigentes.
- id: 22
  category: license_system
  question: 'Si un conductor de Hawái es condenado por conducir sin una póliza de
    seguro de vehículo motorizado válida por primera vez, su licencia puede ser suspendida
    por:'
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Según la ley de Hawái, una primera condena por conducir sin seguro
    resulta en una suspensión de la licencia por 3 meses (o hasta que se proporcione
    una prueba de seguro).
- id: 23
  category: license_system
  question: 'En Hawái, si cambia legalmente su nombre por matrimonio o por orden judicial,
    debe notificar a la oficina de licencias de conducir y solicitar un duplicado
    de la licencia en un plazo de:'
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: Los conductores deben notificar a la agencia de licencias sobre un
    cambio de nombre legal y obtener una licencia corregida en un plazo de 30 días.
- id: 24
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un permiso de instrucción de Clase
    2 (Motocicleta) en Hawái?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 18 años
  answer: B
  explanation: La edad mínima para solicitar un permiso de instrucción de motocicleta
    (Clase 2) en Hawái es de 15 años y medio, la misma que para un permiso de Clase
    3.
- id: 25
  category: license_system
  question: 'Si pierde o le roban su licencia de conducir de Hawái, debe inmediatamente:'
  choices:
    A: Esperar hasta que expire para obtener una nueva
    B: Solicitar un duplicado de la licencia en un centro de licencias de conducir
    C: Continuar conduciendo siempre que tenga una foto de la misma
    D: Llamar a la policía para que le emitan un permiso temporal
  answer: B
  explanation: Si una licencia se pierde o es robada, el conductor debe solicitar
    un duplicado en un centro de licencias y pagar la tarifa requerida para seguir
    estando legalmente autorizado para conducir.
- id: 26
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que el titular de un permiso
    de instrucción de Hawái opere una motocicleta (Clase 2) por la noche?
  choices:
    A: Debe tener un supervisor en una segunda motocicleta
    B: Debe usar equipo reflectante
    C: Se le prohíbe operar una motocicleta por la noche
    D: Debe tener al menos 10 horas de práctica nocturna
  answer: C
  explanation: Los titulares de permisos de motocicleta de Hawái tienen restringido
    el transporte de pasajeros y la operación de una motocicleta durante las horas
    nocturnas.
- id: 27
  category: license_system
  question: 'En Hawái, la licencia de conducir para personas de 72 años o más es válida
    por un período de:'
  choices:
    A: 1 año
    B: 2 años
    C: 4 años
    D: 8 años
  answer: B
  explanation: Si bien las licencias para adultos más jóvenes son válidas por 8 años,
    Hawái requiere que los conductores de 72 años o más renueven sus licencias cada
    2 años.
- id: 28
  category: license_system
  question: 'Para solicitar una Licencia de Conducir Comercial (CDL) en Hawái para
    operar un vehículo en el comercio intraestatal, el solicitante debe tener al menos:'
  choices:
    A: 18 años
    B: 19 años
    C: 21 años
    D: 25 años
  answer: A
  explanation: La edad mínima para una CDL para operación intraestatal (solo dentro
    de Hawái) es de 18 años, aunque se requieren 21 años para el comercio interestatal
    o materiales peligrosos.
- id: 29
  category: license_system
  question: ¿Cuál de las siguientes NO es una razón válida para que el DMV de Hawái
    se niegue a emitir o renovar una licencia de conducir?
  choices:
    A: No pagar multas de tráfico pendientes
    B: No proporcionar un número de Seguro Social
    C: No tener un diploma de escuela secundaria
    D: No aprobar el examen de la vista requerido
  answer: C
  explanation: Un diploma de escuela secundaria no es un requisito para obtener una
    licencia de conducir en Hawái, mientras que la visión, la verificación del SSN
    y la liquidación de multas de tráfico sí son obligatorios.
- id: 30
  category: driver_testing
  question: Al llegar para su examen de conducir en Hawái, ¿cuál de los siguientes
    documentos DEBE estar vigente y presente en el vehículo?
  choices:
    A: El título del vehículo y la factura de venta
    B: El registro del vehículo y la tarjeta de seguro de vehículo motorizado de Hawái
    C: La calcomanía original de fábrica de la ventana del vehículo
    D: Una carta notariada del propietario del vehículo
  answer: B
  explanation: De acuerdo con el Manual del Conductor de Hawái, debe presentar un
    registro válido y una tarjeta de seguro de vehículo motorizado de Hawái válida
    para el vehículo que se utilizará en el examen de conducir.
- id: 31
  category: driver_testing
  question: ¿Además del registro y el seguro, qué otro certificado debe estar vigente
    y visible en el vehículo durante una prueba de manejo en Hawái?
  choices:
    A: Certificado de emisiones
    B: Certificado de impuesto sobre el peso
    C: Certificado de inspección de seguridad
    D: Permiso de estacionamiento del condado
  answer: C
  explanation: La ley de Hawái exige que todos los vehículos tengan un certificado
    de inspección de seguridad (calcomanía) vigente y visible en el parachoques trasero
    o en el chasis para que su operación y la realización de pruebas de manejo sean
    legales.
- id: 32
  category: driver_testing
  question: Según la ley de Hawái, ¿cuál es la cobertura mínima de seguro de responsabilidad
    civil requerida por lesiones corporales a una persona en un solo accidente?
  choices:
    A: $10,000
    B: $20,000
    C: $40,000
    D: $50,000
  answer: B
  explanation: Los Estatutos Revisados de Hawái §431:10C-301 requieren un mínimo de
    $20,000 por persona por responsabilidad de lesiones corporales.
- id: 33
  category: driver_testing
  question: Para la mayoría de los vehículos de pasajeros en Hawái, ¿con qué frecuencia
    se debe realizar una inspección de seguridad?
  choices:
    A: Cada 6 meses
    B: Cada 12 meses
    C: Cada 24 meses
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: En Hawái, la mayoría de los vehículos deben someterse a una inspección
    de seguridad cada 12 meses (anualmente).
- id: 34
  category: driver_testing
  question: Bajo la ley de 'Consentimiento Implícito' (Implied Consent) de Hawái,
    ¿qué sucede si usted se niega a realizarse una prueba química de alcohol o drogas
    cuando lo solicita un oficial?
  choices:
    A: Su licencia será revocada por al menos un año
    B: Se le multará con $50 y será puesto en libertad
    C: Solo recibirá una advertencia por la primera negativa
    D: Su vehículo será confiscado permanentemente
  answer: A
  explanation: La ley de Consentimiento Implícito de Hawái (HRS §291E-15) establece
    que al conducir por las carreteras de Hawái, usted acepta someterse a pruebas.
    La negativa resulta en una revocación obligatoria de la licencia, generalmente
    por un año en la primera infracción.
- id: 35
  category: driver_testing
  question: La 'Ley de Moverse a un Lado' (Move Over Law) de Hawái exige que los conductores
    hagan ¿qué al acercarse a un vehículo de emergencia estacionario con luces intermitentes?
  choices:
    A: Detenerse por completo en medio del carril
    B: Acelerar para rebasar el vehículo rápidamente
    C: Reducir la velocidad y, si es seguro, desocupar el carril contiguo al vehículo
      de emergencia
    D: Encender las luces de emergencia y mantener la velocidad actual
  answer: C
  explanation: La ley HRS §291C-27 exige que los conductores reduzcan la velocidad
    a un ritmo razonable y se muevan a un carril adyacente si es seguro hacerlo al
    acercarse a vehículos de emergencia.
- id: 36
  category: driver_testing
  question: De acuerdo con la ley actualizada de seguridad de niños pasajeros de Hawái,
    ¿los niños menores de qué edad deben estar debidamente sujetos en un asiento de
    seguridad orientado hacia atrás?
  choices:
    A: Menores de 1 año
    B: Menores de 2 años
    C: Menores de 4 años
    D: Menores de 5 años
  answer: B
  explanation: A partir de 2022, la ley de Hawái (HRS §291-11.5) exige que los niños
    menores de dos años estén debidamente sujetos en un sistema de retención infantil
    orientado hacia atrás.
- id: 37
  category: driver_testing
  question: En Hawái, ¿quién está obligado a usar el cinturón de seguridad mientras
    el vehículo está en movimiento?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: El conductor y todos los pasajeros, tanto en el asiento delantero como en el
      trasero
    D: Solo el conductor
  answer: C
  explanation: La ley de Hawái (HRS §291-11.6) exige que el conductor y todos los
    pasajeros de los asientos delanteros y traseros estén sujetos por un conjunto
    de cinturón de seguridad.
- id: 38
  category: driver_testing
  question: 'El uso de un dispositivo electrónico móvil mientras se conduce en Hawái
    (a menos que se utilice tecnología de manos libres) es:'
  choices:
    A: Legal si se encuentra en un semáforo en rojo
    B: Ilegal y está sujeto a una multa
    C: Legal para enviar mensajes de texto pero no para llamar
    D: Solo es ilegal para conductores menores de 18 años
  answer: B
  explanation: Los Estatutos Revisados de Hawái §291C-137 prohíben el uso de dispositivos
    electrónicos móviles mientras se opera un vehículo, incluso cuando se está detenido
    en un semáforo en rojo o en una señal de alto.
- id: 39
  category: driver_testing
  question: 'En Hawái, cuando un autobús escolar se detiene con sus luces de señal
    rojas intermitentes, los conductores deben:'
  choices:
    A: Detenerse desde cualquier dirección, a menos que sea en una carretera dividida
    B: Solo detenerse si están detrás del autobús
    C: Reducir la velocidad a 10 mph y pasar con cuidado
    D: Detenerse solo si hay niños cruzando en ese momento
  answer: A
  explanation: Según la ley HRS §291C-95, los conductores que viajan en ambas direcciones
    deben detenerse ante un autobús escolar con luces rojas intermitentes, excepto
    cuando viajan en una carretera dividida en la dirección opuesta.
- id: 40
  category: driver_testing
  question: ¿Cuál es la definición de 'Exceso de velocidad excesivo' (Excessive Speeding)
    en Hawái, la cual conlleva sanciones más severas que una multa por exceso de velocidad
    estándar?
  choices:
    A: 5 mph sobre el límite
    B: 15 mph sobre el límite
    C: 30 mph o más sobre el límite de velocidad, o más de 80 mph independientemente
      del límite
    D: Cualquier velocidad superior a 55 mph
  answer: C
  explanation: La ley HRS §291C-105 define el exceso de velocidad excesivo como conducir
    a 30 mph o más sobre el límite de velocidad o superar las 80 mph.
- id: 41
  category: driver_testing
  question: ¿Cuándo puede girar legalmente a la derecha con semáforo en rojo en Hawái?
  choices:
    A: Nunca
    B: Solo si no hay una señal de "No Turn on Red" (No girar en rojo) y se ha detenido
      por completo y cedido el paso al tráfico y a los peatones
    C: Solo durante las horas del día
    D: En cualquier momento sin detenerse siempre que no vengan autos
  answer: B
  explanation: En Hawái, se permite girar a la derecha en rojo después de detenerse
    por completo y ceder el paso al tráfico y a los peatones, siempre que ninguna
    señal prohíba el giro.
- id: 42
  category: driver_testing
  question: 'En Hawái, el registro del vehículo debe renovarse:'
  choices:
    A: Cada dos años
    B: Cada cinco años
    C: Anualmente (cada año)
    D: Solo cuando el título cambia de dueño
  answer: C
  explanation: Los registros de vehículos en el estado de Hawái deben renovarse cada
    año.
- id: 43
  category: driver_testing
  question: Durante el examen de conducir en Hawái, ¿cuál de las siguientes es causa
    de reprobación inmediata?
  choices:
    A: No usar la señal de giro una vez
    B: Ajustar los espejos antes de arrancar
    C: Una acción que requiera que el examinador intervenga para evitar un accidente
    D: Conducir exactamente al límite de velocidad
  answer: C
  explanation: Según el Manual del Conductor de Hawái, cualquier acción peligrosa
    o incidente que requiera que el examinador tome el control del vehículo o intervenga
    para evitar una colisión resulta en una reprobación inmediata.
- id: 44
  category: driver_testing
  question: Al presentarse para el examen de conducir en Hawái, ¿qué documento debe
    presentarse para el vehículo además de una tarjeta de seguro de vehículo motorizado
    válida?
  choices:
    A: El título original del vehículo
    B: Un certificado de inspección vigente y un certificado de registro vigente
    C: Una carta notariada del propietario del vehículo
    D: La factura de venta del vehículo
  answer: B
  explanation: Para realizar el examen de conducir en Hawái, el vehículo debe tener
    un certificado de inspección de seguridad vigente (calcomanía y papel) y un certificado
    de registro de vehículo motorizado vigente.
- id: 45
  category: driver_testing
  question: En Hawái, ¿se considera que un conductor está conduciendo bajo la influencia
    (DUI) si su concentración de alcohol en sangre (BAC) es igual o superior a qué
    nivel?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Según los Estatutos Revisados de Hawái §291E-61, es ilegal que una
    persona de 21 años o más opere un vehículo con un BAC de 0.08% o superior.
- id: 46
  category: driver_testing
  question: La ley "Move Over" (Hacerse a un lado) de Hawái exige que los conductores
    reduzcan la velocidad y, si es seguro, se muevan a un carril no adyacente al acercarse
    a ¿cuál de los siguientes detenidos en una autopista?
  choices:
    A: Solo patrullas de policía con luces intermitentes
    B: Solo ambulancias y camiones de bomberos
    C: Cualquier vehículo de emergencia con luces intermitentes, incluidos camiones
      de remolque y vehículos de auxilio vial
    D: Cualquier vehículo con sus luces de emergencia encendidas
  answer: C
  explanation: Los Estatutos Revisados de Hawái §291C-27 exigen que los conductores
    dejen libre el carril más cercano a los vehículos de emergencia estacionados,
    incluidos los de policía, bomberos, primeros auxilios y camiones de remolque,
    o que reduzcan la velocidad a una velocidad segura si no es posible cambiarse
    de carril.
- id: 47
  category: driver_testing
  question: Bajo la ley actualizada de Hawái sobre el sistema de retención de niños
    pasajeros, ¿los niños menores de qué edad deben usar un asiento de seguridad para
    niños o un asiento elevado (booster seat)?
  choices:
    A: 5 años
    B: 7 años
    C: 10 años
    D: 12 años
  answer: C
  explanation: A partir de 2022, la ley de Hawái exige que los niños menores de 10
    años estén debidamente sujetos en un sistema de retención para niños pasajeros
    o en un asiento elevado (booster seat).
- id: 48
  category: driver_testing
  question: En Hawái, ¿cuál es la multa estándar por una primera infracción de la
    ley que prohíbe el uso de un dispositivo electrónico móvil mientras se conduce?
  choices:
    A: $50
    B: $150
    C: $250
    D: $500
  answer: C
  explanation: Según los Estatutos Revisados de Hawái §291C-137, la multa por usar
    un dispositivo electrónico móvil de mano mientras se conduce es de $250, la cual
    aumenta a $300 si la infracción ocurre en una zona escolar o área de construcción.
- id: 49
  category: driver_testing
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil por daños
    a la propiedad requerido para un vehículo motorizado en el estado de Hawái?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $25,000
  answer: B
  explanation: Hawái es un estado de seguro sin culpa (no-fault). Los requisitos mínimos
    de responsabilidad incluyen $20,000 por persona por lesiones corporales, $40,000
    por accidente por lesiones corporales y $10,000 por daños a la propiedad.
- id: 50
  category: driver_testing
  question: Cuando tiene la intención de girar, la ley de Hawái exige que haga la
    señal de forma continua durante al menos ¿cuántos pies antes de llegar al giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Según el Manual del Conductor de Hawái, debe dar una señal continua
    durante al menos 100 pies antes de girar o cambiar de carril.
- id: 51
  category: driver_testing
  question: 'Para mantener una distancia de seguimiento segura en Hawái bajo condiciones
    normales de conducción, debe utilizar la:'
  choices:
    A: Regla de la longitud de un vehículo
    B: Regla de los dos segundos
    C: Regla de los cinco segundos
    D: Regla de los diez pies
  answer: B
  explanation: El Manual del Conductor de Hawái recomienda la "regla de los dos segundos"
    para mantener una distancia de seguimiento segura detrás del vehículo que va delante
    de usted.
- id: 52
  category: driver_testing
  question: 'La ley de "Consentimiento Implícito" (Implied Consent) de Hawái significa
    que, al conducir por las carreteras de Hawái, usted ha dado su consentimiento
    para:'
  choices:
    A: Un registro de su vehículo en cualquier momento
    B: Una prueba química de su aliento, sangre u orina para detectar alcohol o drogas
    C: El embargo de su vehículo por cualquier multa de tráfico
    D: Una revisión de sus registros telefónicos por parte de la policía
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito de Hawái, se considera que
    cualquier persona que opera un vehículo ha dado su consentimiento para una prueba
    de aliento, sangre u orina para determinar el contenido de alcohol o drogas si
    es arrestada por conducir bajo la influencia (DUI).
- id: 53
  category: driver_testing
  question: 'En Hawái, cuando un peatón se encuentra en un paso de peatones en su
    mitad de la calzada, usted debe:'
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Tocar la bocina para advertir al peatón
    C: Detenerse y permanecer detenido hasta que el peatón haya pasado su carril
    D: Detenerse solo si hay un guardia de cruce presente
  answer: C
  explanation: La ley de Hawái exige que los conductores se detengan y permanezcan
    detenidos ante los peatones en un paso de peatones cuando el peatón se encuentre
    en la mitad de la calzada por la que circula el vehículo o se aproxime tanto que
    esté en peligro.
- id: 54
  category: driver_testing
  question: 'Por una primera condena por DUI en Hawái, la licencia de conducir de
    un adulto suele ser revocada por un período de:'
  choices:
    A: 30 días
    B: 90 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Para una primera infracción de DUI en Hawái, la revocación administrativa
    de la licencia de conducir es generalmente por un período de un año.
- id: 55
  category: driver_testing
  question: 'Cuando un autobús escolar se detiene en una carretera de doble sentido
    con sus luces rojas intermitentes y el brazo de parada extendido, los conductores
    que viajan en la dirección opuesta deben:'
  choices:
    A: Continuar al límite de velocidad
    B: Reducir la velocidad a 10 mph
    C: Detenerse hasta que las luces rojas dejen de parpadear y el brazo de parada
      se haya retraído
    D: Detenerse solo si hay niños cruzando en ese momento
  answer: C
  explanation: En Hawái, los conductores que viajan en ambas direcciones en una carretera
    de doble sentido deben detenerse ante un autobús escolar con luces rojas intermitentes.
    No es necesario detenerse si se encuentra en el lado opuesto de una carretera
    dividida.
- id: 56
  category: driver_testing
  question: 'En Hawái, puede girar a la derecha con luz roja después de una parada
    completa A MENOS QUE:'
  choices:
    A: Sea entre las 11:00 PM y las 5:00 AM
    B: Haya una señal que prohíba el "Giro a la derecha en rojo" (Right Turn on Red)
    C: Se encuentre en un distrito residencial
    D: Tenga un pasajero menor de 18 años en el automóvil
  answer: B
  explanation: La ley de Hawái permite girar a la derecha en rojo después de hacer
    una parada completa y ceder el paso al tráfico y a los peatones, siempre que no
    haya una señal que prohíba el giro.
- id: 57
  category: driver_testing
  question: En Hawái, ¿es ilegal estacionar un vehículo a menos de cuántos pies de
    un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: De acuerdo con las leyes de tránsito de Hawái, está prohibido estacionar
    a menos de 10 pies de un hidrante de incendios.
- id: 58
  category: driver_testing
  question: 'Al conducir de noche en Hawái, debe atenuar las luces altas cuando un
    vehículo que se aproxima esté a menos de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Manual del Conductor de Hawái establece que debe atenuar las luces
    altas cuando un vehículo que se aproxima esté a menos de 500 pies para evitar
    cegar al otro conductor.
- id: 59
  category: driver_responsibility
  question: 'Según la ley de Hawái, debe notificar inmediatamente a la policía si
    se ve involucrado en un accidente que resulte en daños a la propiedad de cualquier
    persona por un monto superior a:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $3,000
  answer: D
  explanation: Los Estatutos Revisados de Hawái exigen que los conductores informen
    los accidentes a la policía si hay lesiones, muertes o daños a la propiedad que
    superen los $3,000.
- id: 60
  category: driver_responsibility
  question: 'Para una primera condena por conducir sin un seguro de vehículo motorizado
    válido en Hawái, la multa mínima es generalmente de:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Una primera infracción por conducir sin seguro en Hawái conlleva una
    multa mínima de $500, aunque el tribunal puede otorgar servicio comunitario en
    lugar de la multa en algunos casos.
- id: 61
  category: driver_responsibility
  question: Hawái es un estado de seguro "sin culpa" (no-fault). ¿Qué paga principalmente
    la cobertura de "Protección contra Lesiones Personales" (PIP)?
  choices:
    A: Daños al vehículo del otro conductor
    B: Robo de su vehículo
    C: Gastos médicos y de hospital para usted y sus pasajeros, independientemente
      de quién tenga la culpa
    D: Honorarios legales si es demandado por una infracción de tráfico
  answer: C
  explanation: En el sistema sin culpa de Hawái, la cobertura PIP paga los gastos
    médicos y de rehabilitación del conductor y los pasajeros hasta el límite de la
    póliza, independientemente de quién haya causado el accidente.
- id: 62
  category: driver_responsibility
  question: ¿Dónde debe guardarse la tarjeta de identificación del seguro del vehículo
    motorizado mientras se opera un vehículo en Hawái?
  choices:
    A: En la residencia del conductor
    B: En la billetera o bolso del conductor en todo momento
    C: En el vehículo en todo momento
    D: En la oficina del agente de seguros
  answer: C
  explanation: La ley de Hawái exige que se mantenga una tarjeta de identificación
    de seguro de vehículo motorizado válida en el vehículo en todo momento mientras
    este se encuentre en operación.
- id: 63
  category: driver_responsibility
  question: 'Para renovar el registro de su vehículo en Hawái, debe proporcionar prueba
    de un(a) válido(a):'
  choices:
    A: Registro de votante
    B: Certificado de inspección de seguridad
    C: Empleo en Hawái
    D: Factura de venta notariada
  answer: B
  explanation: Un certificado de inspección de seguridad vigente es un requisito previo
    para renovar el registro de un vehículo en el estado de Hawái.
- id: 64
  category: driver_responsibility
  question: Si trae un vehículo a Hawái desde fuera del estado, ¿dentro de cuántos
    días de su llegada debe registrarlo?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes o propietarios que traigan vehículos a Hawái
    deben registrar el vehículo dentro de los 30 días posteriores a su llegada al
    estado.
- id: 65
  category: driver_responsibility
  question: Cuando se vende un vehículo en Hawái, ¿dentro de cuántos días debe registrarse
    la transferencia de propiedad en la oficina de vehículos motorizados del condado?
  choices:
    A: 5 días
    B: 10 días
    C: 20 días
    D: 30 días
  answer: B
  explanation: El transferente (vendedor) debe notificar al condado dentro de 10 días,
    y el adquiriente (comprador) debe completar la transferencia dentro de 10 días
    para evitar cargos por mora.
- id: 66
  category: driver_responsibility
  question: 'En Hawái, el monto mínimo requerido de cobertura de Protección contra
    Lesiones Personales (PIP) es:'
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $50,000
  answer: B
  explanation: La ley de Hawái exige un mínimo de $10,000 en beneficios de Protección
    contra Lesiones Personales (PIP) por persona.
- id: 67
  category: driver_responsibility
  question: 'Si es condenado por una segunda infracción por conducir sin seguro dentro
    de un período de cinco años en Hawái, la multa aumenta a al menos:'
  choices:
    A: $750
    B: $1,000
    C: $1,500
    D: $3,000
  answer: C
  explanation: Para una segunda o subsiguiente infracción de seguro dentro de cinco
    años, la multa en Hawái aumenta a un mínimo de $1,500.
- id: 68
  category: driver_responsibility
  question: 'Si choca contra un vehículo desatendido y no puede encontrar al propietario,
    la ley de Hawái le exige:'
  choices:
    A: Esperar al menos 4 horas a que regrese el propietario
    B: Dejar una nota con su nombre, dirección e información del vehículo en un lugar
      visible
    C: Irse si el daño parece ser inferior a $500
    D: Solo reportarlo si el otro vehículo es un auto de lujo
  answer: B
  explanation: Si no se puede localizar al propietario de un vehículo o propiedad
    desatendida, debe dejar un aviso por escrito proporcionando su información de
    contacto y las circunstancias del accidente.
- id: 69
  category: driver_responsibility
  question: En Hawái, ¿qué documento sirve como prueba principal de propiedad legal
    de un vehículo?
  choices:
    A: El Certificado de Registro
    B: El comprobante de inspección de seguridad
    C: El Certificado de Título
    D: La tarjeta de identificación del seguro
  answer: C
  explanation: El Certificado de Título (a menudo llamado "pink slip" o "blue slip"
    dependiendo del condado) es el documento legal que acredita la propiedad del vehículo.
- id: 70
  category: driver_responsibility
  question: 'Bajo la ley de seguros "sin culpa" (No-Fault) de Hawái, los beneficios
    de Protección contra Lesiones Personales (PIP) se utilizan principalmente para
    pagar:'
  choices:
    A: Daños a su propio vehículo independientemente de quién tenga la culpa
    B: Daños al vehículo del otro conductor
    C: Gastos médicos y de rehabilitación para usted y sus pasajeros
    D: Costos de recuperación de un vehículo robado
  answer: C
  explanation: Hawái es un estado sin culpa, lo que significa que su propio seguro
    (PIP) paga sus gastos médicos y los de sus pasajeros hasta el límite de la póliza,
    independientemente de quién haya causado el accidente.
- id: 71
  category: driver_responsibility
  question: ¿Con qué frecuencia deben someterse a una inspección de seguridad (Inspección
    Periódica de Vehículos de Motor o PMVI) la mayoría de los vehículos de pasajeros
    en Hawái?
  choices:
    A: Cada 6 meses
    B: Cada 12 meses
    C: Cada 24 meses
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: La mayoría de los vehículos de pasajeros en Hawái deben aprobar una
    inspección de seguridad cada 12 meses para mantener su registro legal.
- id: 72
  category: driver_responsibility
  question: En Hawái, un conductor puede ser acusado de "Exceso de Velocidad Excesivo"
    (Excessive Speeding) si es sorprendido conduciendo a qué velocidad?
  choices:
    A: 15 mph por encima del límite
    B: 20 mph por encima del límite
    C: 30 mph por encima del límite o a más de 80 mph
    D: Cualquier velocidad superior a 65 mph
  answer: C
  explanation: El exceso de velocidad excesivo en Hawái se define como viajar a 30
    mph o más por encima del límite de velocidad O superar las 80 mph, independientemente
    del límite de velocidad señalizado.
- id: 73
  category: driver_responsibility
  question: ¿Dónde debe colocarse la calcomanía de inspección de seguridad de Hawái
    (PMVI) en un vehículo de pasajeros?
  choices:
    A: En el parabrisas delantero, esquina inferior izquierda
    B: En el parabrisas delantero, detrás del espejo retrovisor
    C: En el parachoques trasero o en un soporte en el lado derecho de la parte trasera
      del vehículo
    D: En el marco de la puerta del lado del conductor
  answer: C
  explanation: La ley de Hawái exige que la calcomanía de inspección de seguridad
    se fije en el lado derecho del parachoques trasero o en un soporte especial fijado
    en el lado derecho de la parte trasera del vehículo.
- id: 74
  category: driver_responsibility
  question: Según la Ley de Contenedores Abiertos (Open Container Law) de Hawái, ¿en
    qué parte del vehículo es ilegal poseer un contenedor de alcohol abierto?
  choices:
    A: Solo en el asiento del conductor
    B: Solo en el asiento del pasajero delantero
    C: En el área de pasajeros, incluyendo la guantera
    D: En el maletero o detrás del último asiento vertical de un vehículo sin maletero
  answer: C
  explanation: Es ilegal poseer un contenedor de alcohol abierto en el área de pasajeros
    de cualquier vehículo de motor en una vía pública. Esto incluye la guantera o
    cualquier área accesible para el conductor o los pasajeros.
- id: 75
  category: driver_responsibility
  question: Para una primera infracción de DUI en Hawái, ¿cuál es el período estándar
    de revocación de la licencia para un conductor adulto?
  choices:
    A: 30 días
    B: 90 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Para una primera condena por DUI en Hawái, el período administrativo
    de revocación de la licencia suele ser de un año.
- id: 76
  category: driver_responsibility
  question: En Hawái, ¿cuál es la multa máxima por una primera infracción de arrojar
    basura (littering) desde un vehículo de motor?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Arrojar basura desde un vehículo es una infracción en Hawái que puede
    conllevar una multa de hasta $500 por la primera infracción.
- id: 77
  category: driver_responsibility
  question: 'Si usted se ve involucrado en un accidente en Hawái, la ley le exige
    proporcionar su nombre, dirección y número de registro del vehículo a:'
  choices:
    A: Solo a la policía
    B: Al otro conductor o persona afectada
    C: Solo a su compañía de seguros
    D: Solo a un testigo
  answer: B
  explanation: La ley de Hawái exige que los conductores involucrados en un accidente
    se detengan e intercambien información (nombre, dirección y registro) con la otra
    parte involucrada.
- id: 78
  category: driver_responsibility
  question: En Hawái, ¿cuál es el límite de concentración de alcohol en sangre (BAC)
    para un conductor que opera un Vehículo de Motor Comercial (CMV)?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Mientras que el límite para los conductores estándar es de 0.08%, el
    límite legal de BAC para los conductores comerciales en Hawái es de 0.04%.
- id: 79
  category: safe_driving_rules
  question: En Hawái, ¿con cuántos pies de antelación debe señalizar su intención
    de girar antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Según el Manual del Conductor de Hawái y el HRS §291C-84, la señal
    de intención de girar a la derecha o a la izquierda, cuando sea necesaria, debe
    darse continuamente durante no menos de los últimos 100 pies recorridos por el
    vehículo antes de girar.
- id: 80
  category: safe_driving_rules
  question: Según la ley de Hawái, ¿cuál es la distancia mínima a la que debe estacionar
    su vehículo de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: Los Estatutos Revisados de Hawái §291C-111 prohíben estacionar un vehículo
    a menos de 10 pies de un hidrante de incendios.
- id: 81
  category: safe_driving_rules
  question: Al estacionar cerca de una intersección en Hawái, ¿a cuántos pies de distancia
    como mínimo debe estar de una señal de alto, una baliza intermitente o una señal
    de ceda el paso?
  choices:
    A: 10 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Según HRS §291C-111, es ilegal estacionar a menos de 30 pies al aproximarse
    a cualquier baliza intermitente, señal de alto o señal de control de tráfico ubicada
    al costado de una calzada.
- id: 82
  category: safe_driving_rules
  question: En Hawái, las multas por exceso de velocidad generalmente se duplican
    cuando la infracción ocurre en ¿cuál de las siguientes áreas?
  choices:
    A: Zonas residenciales
    B: Distritos comerciales
    C: Zonas escolares o zonas de construcción (obras)
    D: Calles de un solo sentido
  answer: C
  explanation: Bajo la ley de Hawái, las multas por exceso de velocidad se duplican
    por infracciones que ocurren en zonas escolares designadas y zonas de obras en
    autopistas cuando hay trabajadores presentes o señales colocadas.
- id: 83
  category: safe_driving_rules
  question: Según la ley de Hawái, las vueltas en U están específicamente prohibidas
    en ¿cuál de los siguientes lugares?
  choices:
    A: En cualquier autopista con más de dos carriles
    B: En un distrito comercial, excepto en las intersecciones donde esté permitido
    C: En cualquier calle residencial
    D: A menos de 100 pies de una entrada para autos (driveway)
  answer: B
  explanation: HRS §291C-82 establece que ningún vehículo podrá girar para proceder
    en la dirección opuesta en un distrito comercial, excepto en las intersecciones
    y según lo dispuesto por la ley.
- id: 84
  category: safe_driving_rules
  question: ¿Qué regla recomienda el Manual del Conductor de Hawái para mantener una
    distancia de seguimiento segura detrás del vehículo que está delante de usted?
  choices:
    A: La regla de la longitud de un automóvil
    B: La regla de los dos segundos
    C: La regla de los cinco segundos
    D: La regla de los diez pies
  answer: B
  explanation: El Manual del Conductor de Hawái recomienda la 'regla de los dos segundos'
    como distancia mínima de seguimiento en condiciones ideales, aunque esta debe
    aumentarse en caso de mal tiempo o a velocidades más altas.
- id: 85
  category: safe_driving_rules
  question: Según la ley actualizada de seguridad de niños pasajeros de Hawái, ¿los
    niños menores de qué edad deben estar asegurados en un asiento de seguridad para
    niños o en un asiento elevado (booster seat) a menos que midan más de 4 pies y
    9 pulgadas de estatura?
  choices:
    A: 5 años
    B: 7 años
    C: 8 años
    D: 10 años
  answer: D
  explanation: La ley de Hawái (Acta 122, vigente desde 2022) exige que los niños
    menores de 10 años estén debidamente sujetos en un sistema de retención para niños
    pasajeros o en un asiento elevado, a menos que hayan alcanzado una estatura de
    4'9".
- id: 86
  category: safe_driving_rules
  question: 'Al entrar en una glorieta (roundabout) en Hawái, debe ceder el paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en el círculo y se aproxima por su izquierda
    C: A nadie; el tráfico en el círculo debe cederle el paso a usted
    D: Solo a los peatones, no a otros vehículos
  answer: B
  explanation: En una glorieta, los conductores deben ceder el paso al tráfico que
    ya está circulando en ella, el cual se aproximará por la izquierda.
- id: 87
  category: safe_driving_rules
  question: 'En Hawái, dar una vuelta a la derecha con luz roja es:'
  choices:
    A: Siempre ilegal
    B: Legal solo si hay una flecha verde
    C: Permitido después de hacer un alto total, cediendo el paso a peatones y al
      tráfico, a menos que una señal lo prohíba
    D: Permitido sin detenerse si no viene tráfico
  answer: C
  explanation: La ley de Hawái permite a los conductores dar vuelta a la derecha en
    rojo después de detenerse por completo y ceder el paso a peatones y otros vehículos,
    siempre que no haya una señal que prohíba el giro.
- id: 88
  category: safe_driving_rules
  question: Según la ley de Hawái, ¿dónde están generalmente prohibidas las vueltas
    en U incluso si no hay una señal presente?
  choices:
    A: En un distrito residencial
    B: En un distrito comercial
    C: En una calle de un solo sentido
    D: Cerca de un parque
  answer: B
  explanation: Los Estatutos Revisados de Hawái (HRS 291C-82) establecen que ningún
    vehículo podrá girar para proceder en la dirección opuesta en cualquier distrito
    comercial, excepto en una intersección o en una carretera dividida donde se proporcione
    una apertura.
- id: 89
  category: safe_driving_rules
  question: 'La ley de peatones de Hawái exige que los conductores se detengan ante
    un peatón en un cruce de peatones cuando el peatón está:'
  choices:
    A: Esperando en la acera
    B: A menos de cinco pies del vehículo
    C: En la mitad de la calzada por la que circula el vehículo
    D: Vistiendo ropa brillante
  answer: C
  explanation: La ley de Hawái (HRS 291C-72) exige que los conductores se detengan
    ante un peatón cuando este se encuentre en la mitad de la calzada por la que circula
    el vehículo, o cuando el peatón se aproxime tanto desde la mitad opuesta de la
    calzada que esté en peligro.
- id: 90
  category: safe_driving_rules
  question: 'La ''Ley de Moverse a un Lado'' (Move Over Law) de Hawái exige que los
    conductores dejen libre el carril más cercano a los vehículos de emergencia estacionados.
    Si no es seguro moverse de carril, el conductor debe:'
  choices:
    A: Mantener la velocidad pero tocar la bocina
    B: Reducir la velocidad a una velocidad razonable que sea segura dadas las circunstancias
    C: Detenerse por completo en el carril actual
    D: Acelerar para rebasar el vehículo rápidamente
  answer: B
  explanation: Si un conductor no puede moverse de manera segura a un carril adyacente
    al aproximarse a un vehículo de emergencia estacionado con luces intermitentes,
    debe reducir la velocidad a una velocidad que sea segura y prudente.
- id: 91
  category: safe_driving_rules
  question: ¿Bajo qué condición es legal adelantar a otro vehículo por la derecha
    en Hawái?
  choices:
    A: Cuando el vehículo que se está adelantando está girando a la izquierda
    B: Cuando tiene prisa y el carril izquierdo va lento
    C: En una carretera de dos carriles y doble sentido con un arcén pavimentado
    D: Nunca es legal adelantar por la derecha
  answer: A
  explanation: Se permite adelantar por la derecha en Hawái cuando el vehículo adelantado
    está girando o está a punto de girar a la izquierda, o en una calle con pavimento
    sin obstrucciones de ancho suficiente para dos o más líneas de vehículos en movimiento
    en cada dirección.
- id: 92
  category: safe_driving_rules
  question: 'Al seguir a otro vehículo en buenas condiciones, el Manual del Conductor
    de Hawái recomienda mantener una distancia de seguimiento de al menos:'
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cinco segundos
  answer: C
  explanation: El Manual del Conductor de Hawái recomienda la 'regla de los tres segundos'
    para mantener una distancia de seguimiento segura detrás del vehículo que tiene
    delante.
- id: 93
  category: safe_driving_rules
  question: 'Al estacionar un vehículo cuesta abajo en una calle de doble sentido
    con bordillo (acera), debe girar las ruedas delanteras:'
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: Hacia la izquierda
  answer: A
  explanation: Al estacionar cuesta abajo con bordillo, debe girar las ruedas hacia
    el bordillo para que, si el vehículo rueda, lo haga hacia el bordillo y se detenga.
- id: 94
  category: safe_driving_rules
  question: 'En Hawái, el uso de un dispositivo electrónico móvil mientras se conduce
    (incluyendo enviar mensajes de texto o hablar sin un sistema de manos libres)
    está:'
  choices:
    A: Permitido para conductores mayores de 21 años
    B: Prohibido para todos los conductores
    C: Permitido solo en semáforos en rojo
    D: Prohibido solo para titulares de licencias provisionales
  answer: B
  explanation: La ley de Hawái prohíbe a todos los conductores el uso de un dispositivo
    electrónico móvil mientras operan un vehículo motorizado, a menos que utilicen
    un sistema de manos libres (aunque a los conductores menores de 18 años se les
    prohíbe incluso el uso de manos libres).
- id: 95
  category: safe_driving_rules
  question: Hawái es un estado de seguro 'sin culpa' (no-fault). ¿Cuál es el monto
    mínimo de seguro de responsabilidad civil requerido por lesiones corporales para
    una persona?
  choices:
    A: $10,000
    B: $20,000
    C: $40,000
    D: $50,000
  answer: B
  explanation: La ley de Hawái exige un mínimo de $20,000 por persona para el seguro
    de responsabilidad civil por lesiones corporales.
- id: 96
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección no controlada
    (sin señales ni semáforos) desde calles diferentes, ¿qué conductor tiene el derecho
    de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor en la carretera más grande
    D: El conductor que viaja más rápido
  answer: B
  explanation: Según la ley de Hawái, cuando dos vehículos entran en una intersección
    desde diferentes carreteras aproximadamente al mismo tiempo, el conductor del
    vehículo de la izquierda deberá ceder el derecho de paso al vehículo de la derecha.
- id: 97
  category: defensive_driving
  question: Según el Manual del Conductor de Hawái, ¿cuál es la distancia de seguimiento
    recomendada detrás del vehículo que tiene delante en condiciones normales de conducción?
  choices:
    A: La longitud de un automóvil por cada 10 mph
    B: Al menos dos segundos
    C: Al menos tres segundos
    D: Al menos cinco segundos
  answer: C
  explanation: El Manual del Conductor de Hawái recomienda utilizar la 'regla de los
    tres segundos' para mantener una distancia de seguimiento segura en condiciones
    normales de clima y tráfico.
- id: 98
  category: defensive_driving
  question: Al seguir a otro vehículo por la noche en Hawái, ¿a cuántos pies del vehículo
    de adelante debe bajar las luces altas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Según las regulaciones estatales de Hawái, debe cambiar a luces bajas
    cuando siga a otro vehículo a menos de 200 pies para que sus luces no se reflejen
    en el espejo retrovisor del otro conductor.
- id: 99
  category: defensive_driving
  question: Bajo la 'Ley de Moverse a un Lado' (Move Over Law) de Hawái, ¿qué debe
    hacer un conductor al acercarse a un vehículo de emergencia estacionado con luces
    intermitentes a un lado de una carretera?
  choices:
    A: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    B: Detenerse inmediatamente en el carril de circulación
    C: Reducir la velocidad y, si es seguro, desocupar el carril más cercano al vehículo
      de emergencia
    D: Aumentar la velocidad para pasar el área lo más rápido posible
  answer: C
  explanation: La Ley de Moverse a un Lado de Hawái (HRS §291C-27) exige que los conductores
    reduzcan la velocidad a una velocidad razonable y se muevan a un carril adyacente
    si es seguro hacerlo al pasar vehículos de emergencia.
- id: 100
  category: defensive_driving
  question: Para evitar el hidroplaneo (hydroplaning) en las carreteras mojadas de
    Hawái durante un fuerte aguacero tropical, ¿cuál es la mejor técnica de conducción
    defensiva?
  choices:
    A: Aplicar los frenos con firmeza y frecuencia
    B: Reducir la velocidad y mantener los neumáticos inflados correctamente
    C: Aumentar la velocidad para cortar el agua
    D: Girar el volante bruscamente de un lado a otro
  answer: B
  explanation: El hidroplaneo puede ocurrir a velocidades tan bajas como 35 mph. Reducir
    la velocidad y asegurarse de que los neumáticos tengan una buena banda de rodadura
    y la presión adecuada son las mejores formas de prevenirlo.
- id: 101
  category: defensive_driving
  question: ¿Hacia qué lado debe girar el volante si su vehículo comienza a derrapar
    en una superficie resbaladiza en Hawái?
  choices:
    A: En la dirección opuesta al derrape
    B: En la dirección en la que derrapa la parte trasera del vehículo
    C: Mantener el volante perfectamente recto y frenar a fondo
    D: Hacia el arcén de la carretera, independientemente de la dirección del derrape
  answer: B
  explanation: Para recuperar el control durante un derrape, debe quitar el pie del
    acelerador y girar el volante en la dirección en la que se desliza la parte trasera
    del vehículo.
- id: 102
  category: defensive_driving
  question: La ley de Hawái exige encender los faros siempre que no pueda ver con
    claridad a una distancia de al menos ¿cuántos pies por delante?
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Según la ley estatal de Hawái, los faros deben usarse desde 30 minutos
    después de la puesta del sol hasta 30 minutos antes de la salida del sol, o siempre
    que la visibilidad sea inferior a 500 pies.
- id: 103
  category: defensive_driving
  question: Al explorar la carretera en busca de posibles peligros, ¿qué tan lejos
    sugiere mirar el Manual del Conductor de Hawái?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 12 segundos
    C: De 20 a 30 segundos
    D: Solo al vehículo que está directamente delante de usted
  answer: B
  explanation: La conducción defensiva en Hawái implica observar de 10 a 12 segundos
    hacia adelante para identificar los peligros con anticipación y tener tiempo de
    reaccionar.
- id: 104
  category: defensive_driving
  question: Bajo la ley de 'Detenerse por los peatones' de Hawái, ¿cuándo debe un
    conductor detenerse ante un peatón en un paso de peatones?
  choices:
    A: Solo si el peatón está en el carril del conductor
    B: Solo si hay una señal de pare o luz roja
    C: Cuando el peatón se encuentra en la mitad de la calzada por la que circula
      el vehículo o se aproxima de cerca
    D: Solo si el peatón saluda al conductor con la mano
  answer: C
  explanation: El estatuto HRS §291C-72 exige que los conductores se detengan ante
    los peatones cuando estos se encuentren en la mitad de la carretera del conductor
    o a menos de un carril de distancia de dicha mitad.
- id: 105
  category: defensive_driving
  question: Si conduce con niebla densa en la H-3 u otras autopistas de Hawái, ¿qué
    luces debe utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces intermitentes de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en condiciones de niebla. Las luces altas
    se reflejan en la humedad del aire, creando un resplandor que dificulta la visión.
- id: 106
  category: defensive_driving
  question: En Hawái, ¿qué es lo primero que debe hacer si el pedal del acelerador
    se atasca mientras conduce?
  choices:
    A: Apagar el motor inmediatamente
    B: Cambiar a neutral (punto muerto) y aplicar los frenos
    C: Tirar del freno de emergencia con la mayor fuerza posible
    D: Abrir la puerta y saltar del vehículo
  answer: B
  explanation: Si el acelerador se atasca, debe cambiar a neutral, aplicar los frenos
    para reducir la velocidad y dirigirse de manera segura fuera de la carretera antes
    de apagar el motor.
- id: 107
  category: defensive_driving
  question: Al entrar en un túnel en Hawái, como los túneles Pali o Likelike, ¿qué
    acción se recomienda por seguridad?
  choices:
    A: Acelerar para pasar más rápido
    B: Encender los faros
    C: Encender la luz interior del techo
    D: Tocar la bocina para alertar a los demás
  answer: B
  explanation: Los conductores deben encender sus faros antes de entrar en los túneles
    para aumentar su propia visibilidad y la de los demás conductores.
- id: 108
  category: defensive_driving
  question: 'En Hawái, si se ve involucrado en una colisión donde el daño total a
    la propiedad es de $3,000 o más, usted debe:'
  choices:
    A: Esperar 48 horas antes de informarlo
    B: Presentar un informe por escrito al Jefe de Policía
    C: Informarlo solo si alguien resulta herido
    D: Intercambiar información e irse sin llamar a la policía
  answer: B
  explanation: La ley de Hawái exige que los accidentes que involucren lesiones, muerte
    o daños a la propiedad de $3,000 o más se informen a la policía de inmediato.
- id: 109
  category: defensive_driving
  question: ¿Cuál es la regla de conducción defensiva sobre el 'punto ciego' al prepararse
    para cambiar de carril en Hawái?
  choices:
    A: Confiar plenamente en los espejos laterales
    B: Girar la cabeza y mirar sobre el hombro en la dirección a la que planea moverse
    C: Tocar la bocina y esperar a que los demás se muevan
    D: Acelerar para que nadie pueda estar en su punto ciego
  answer: B
  explanation: Los espejos no lo muestran todo. Debe realizar una comprobación sobre
    el hombro para asegurarse de que su punto ciego esté despejado antes de cambiar
    de carril.
- id: 110
  category: defensive_driving
  question: Al conducir en una autopista de varios carriles en Hawái, si un vehículo
    lo sigue muy de cerca (tailgating), ¿cuál es la acción defensiva más segura?
  choices:
    A: Frenar repentinamente para asustar al conductor de atrás
    B: Reducir la velocidad y animar al conductor de atrás a que lo adelante
    C: Acelerar para mantener una distancia
    D: Encender las luces de emergencia y permanecer en su carril
  answer: B
  explanation: Si alguien lo sigue muy de cerca, debe evitar movimientos bruscos.
    Reduzca la velocidad gradualmente o muévase al carril derecho para permitir que
    el otro conductor lo adelante de forma segura.
- id: 111
  category: defensive_driving
  question: ¿En Hawái, con cuánta antelación debe observar la carretera para identificar
    posibles peligros a tiempo?
  choices:
    A: 5 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: Hasta donde alcancen sus faros delanteros
  answer: B
  explanation: La conducción defensiva en Hawái requiere mirar de 10 a 15 segundos
    por delante de su vehículo para tener tiempo suficiente de reaccionar ante los
    cambios en las condiciones del tráfico.
- id: 112
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (pérdida de contacto de
    los neumáticos con la carretera debido al agua) en las carreteras mojadas de Hawái?
  choices:
    A: Desde tan solo 35 mph
    B: Solo por encima de 60 mph
    C: Exactamente a 50 mph
    D: Solo durante tormentas eléctricas intensas
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una tormenta de lluvia intensa, los neumáticos pueden perder todo contacto
    con la carretera a 55 mph.
- id: 113
  category: defensive_driving
  question: 'Al conducir bajo lluvia intensa o niebla en Hawái, debe encender los
    faros delanteros siempre que la visibilidad se reduzca a menos de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Hawái exige el uso de faros delanteros cuando la visibilidad
    es inferior a 500 pies debido a la lluvia, la niebla u otras condiciones atmosféricas.
- id: 114
  category: defensive_driving
  question: 'En Hawái, el ''Exceso de Velocidad Excesivo'' (Excessive Speeding) es
    un delito menor leve que se define como conducir a más de:'
  choices:
    A: 10 mph sobre el límite
    B: 20 mph sobre el límite
    C: 30 mph sobre el límite u 80 mph independientemente del límite
    D: 15 mph sobre el límite en una zona escolar
  answer: C
  explanation: Según la sección HRS §291C-105, el exceso de velocidad excesivo en
    Hawái se define como conducir a 30 mph o más sobre el límite de velocidad o superar
    las 80 mph, independientemente del límite establecido.
- id: 115
  category: defensive_driving
  question: Al rebasar a un ciclista en Hawái, ¿cuál es la distancia mínima que un
    automovilista debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La ley de 'Rebase Seguro' (Safe Passing) de Hawái (HRS §291C-94) exige
    que los automovilistas mantengan una distancia mínima de 3 pies al rebasar a un
    ciclista.
- id: 116
  category: defensive_driving
  question: 'Para una primera condena por DUI (conducir bajo la influencia) en Hawái,
    la Oficina Administrativa de Revocación de Licencias de Conducir (ADLRO) generalmente
    revocará la licencia de conducir por:'
  choices:
    A: 30 días
    B: 90 días
    C: 1 año
    D: 5 años
  answer: C
  explanation: Para una primera infracción de DUI en Hawái, el período estándar de
    revocación administrativa de la licencia es de 1 año.
- id: 117
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera mojada de Hawái, ¿qué
    es lo primero que debe hacer?
  choices:
    A: Frenar bruscamente
    B: Girar el volante bruscamente en la dirección opuesta al derrape
    C: Levantar el pie del acelerador y girar el volante en la dirección a la que
      desea que vaya la parte delantera del vehículo
    D: Poner el vehículo en punto muerto (neutral) y apagar el motor
  answer: C
  explanation: Para recuperarse de un derrape, debe dejar de acelerar gradualmente
    y girar el volante en la dirección a la que desea que vaya el automóvil. Evite
    frenar bruscamente, ya que esto puede bloquear las ruedas y empeorar el derrape.
- id: 118
  category: alcohol_drugs_health
  question: Si se niega a realizar una prueba química de alcohol o drogas cuando lo
    solicite un oficial de policía en Hawái, sus privilegios de conducir serán revocados
    por un período de ________ por una primera negativa.
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Según la ley de Hawái, negarse a someterse a una prueba química resulta
    en una revocación administrativa de su licencia de conducir por un año en caso
    de ser la primera vez que se niega.
- id: 119
  category: alcohol_drugs_health
  question: 'En Hawái, un conductor se clasifica como ''Conductor Altamente Intoxicado''
    si su concentración de alcohol en sangre (BAC) es igual o superior a:'
  choices:
    A: 0.10%
    B: 0.12%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: La ley de Hawái define a un 'Conductor Altamente Intoxicado' como alguien
    con un BAC de 0.15% o superior, lo que conlleva sanciones agravadas.
- id: 120
  category: alcohol_drugs_health
  question: ¿Qué prohíbe la ley de 'Contenedor Abierto' (Open Container) de Hawái?
  choices:
    A: Poseer un contenedor de bebida alcohólica abierto en el área de pasajeros de
      un vehículo motorizado
    B: Llevar un paquete de seis cervezas sin abrir en el asiento delantero
    C: Tener un recipiente de agua abierto en el vehículo
    D: Transportar una botella de vino abierta en el maletero del coche
  answer: A
  explanation: Es ilegal poseer un contenedor de bebida alcohólica abierto en el área
    de pasajeros de un vehículo motorizado mientras se encuentra en una vía pública.
    El maletero generalmente está excluido.
- id: 121
  category: alcohol_drugs_health
  question: 'En Hawái, si se le revoca la licencia por un DUI (conducir bajo los efectos
    del alcohol o drogas), es posible que se le exija instalar un Dispositivo de Bloqueo
    de Encendido (IID) que:'
  choices:
    A: Rastrea la velocidad de su vehículo a través de GPS
    B: Evita que el vehículo arranque si detecta alcohol en su aliento
    C: Llama automáticamente a la policía si excede el límite de velocidad
    D: Graba video del conductor en todo momento
  answer: B
  explanation: Un Dispositivo de Bloqueo de Encendido (IID) es un alcoholímetro para
    el vehículo de una persona que evita que el motor arranque si el conductor tiene
    alcohol en su aliento.
- id: 122
  category: alcohol_drugs_health
  question: ¿Cuál es la pena máxima de cárcel por una primera condena por DUI en Hawái
    (sin factores agravantes)?
  choices:
    A: 24 horas
    B: 5 días
    C: 30 días
    D: 6 meses
  answer: B
  explanation: Una primera infracción por DUI en Hawái puede resultar en una pena
    de cárcel de hasta 5 días, aunque el servicio comunitario o las multas también
    son sanciones comunes.
- id: 123
  category: alcohol_drugs_health
  question: 'Si se le condena por conducir mientras su licencia está revocada por
    un DUI en Hawái, las sanciones incluyen:'
  choices:
    A: Una multa obligatoria de $100
    B: Una pena obligatoria de prisión de no menos de 3 días
    C: Una simple advertencia por la primera infracción
    D: Solo una extensión de 10 días de la revocación
  answer: B
  explanation: Conducir mientras la licencia está suspendida o revocada por DUI es
    una infracción grave en Hawái, que conlleva una sentencia mínima obligatoria de
    cárcel de 3 días.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es lo primero que se ve afectado por el consumo
    de alcohol?
  choices:
    A: La coordinación muscular
    B: La visión
    C: El juicio y el autocontrol
    D: La audición
  answer: C
  explanation: El alcohol afecta el juicio y el autocontrol mucho antes de afectar
    la coordinación física o la visión.
- id: 125
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su concentración de alcohol
    en sangre (BAC) después de beber?
  choices:
    A: Beber café negro cargado
    B: Tomar una ducha fría
    C: Hacer ejercicio o correr
    D: Dejar que pase el tiempo
  answer: D
  explanation: El tiempo es el único factor que reducirá el BAC. El cuerpo metaboliza
    el alcohol a un ritmo constante que no puede acelerarse con café, duchas o ejercicio.
- id: 126
  category: alcohol_drugs_health
  question: Con respecto a los medicamentos recetados y la conducción en Hawái, ¿qué
    afirmación es verdadera?
  choices:
    A: Es legal conducir siempre que el medicamento haya sido recetado por un médico
    B: Se le puede acusar de DUI si un medicamento recetado afecta su capacidad para
      conducir de manera segura
    C: Los medicamentos recetados nunca afectan la capacidad de conducción
    D: Solo los narcóticos ilegales pueden dar lugar a un cargo por DUI
  answer: B
  explanation: En Hawái, un cargo por DUI puede ser el resultado de la alteración
    causada por cualquier droga, incluidos los medicamentos recetados legales y los
    medicamentos de venta libre.
- id: 127
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de mezclar alcohol con otras drogas (efecto sinérgico)?
  choices:
    A: Los efectos de la droga son anulados por el alcohol
    B: Los efectos del alcohol son anulados por la droga
    C: El efecto combinado es mucho mayor que la suma de los efectos individuales
    D: No hay cambios en el nivel de alteración
  answer: C
  explanation: Combinar alcohol con otras drogas puede multiplicar los efectos de
    ambos, lo que provoca una alteración grave incluso con pequeñas cantidades de
    cada uno.
- id: 128
  category: alcohol_drugs_health
  question: 'En Hawái, si tiene una condición médica que pueda afectar su capacidad
    para conducir de manera segura, usted debe:'
  choices:
    A: Entregar su licencia de inmediato
    B: Informar la condición a la clínica de licencias de conducir y es posible que
      se le solicite un informe médico
    C: Conducir solo durante las horas del día
    D: Mantener la condición en secreto para evitar perder su licencia
  answer: B
  explanation: Los conductores están obligados a revelar las condiciones médicas que
    podrían afectar la conducción. La autoridad de licencias puede requerir un informe
    de un examinador médico para determinar si el conductor es apto para operar un
    vehículo.
- id: 129
  category: alcohol_drugs_health
  question: Una persona es considerada un 'infractor habitual de OUI (operar bajo
    la influencia)' en Hawái si es condenada por un DUI por ________ vez dentro de
    un período de 10 años.
  choices:
    A: Segunda
    B: Tercera
    C: Cuarta
    D: Quinta
  answer: B
  explanation: Según la ley de Hawái, una persona que es condenada por tres o más
    infracciones de OUI dentro de un período de 10 años se considera un infractor
    habitual, lo cual es un delito grave de Clase C.
- id: 130
  category: alcohol_drugs_health
  question: Si un conductor en Hawái se niega a realizarse una prueba química de alcohol
    o drogas cuando lo solicita un oficial, ¿cuál es el período de revocación obligatoria
    de la licencia por una primera infracción?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 90 días
  answer: B
  explanation: Según la ley de Hawái, la primera negativa a someterse a una prueba
    de aliento, sangre u orina resulta en una revocación administrativa obligatoria
    de la licencia por 1 año.
- id: 131
  category: alcohol_drugs_health
  question: ¿Qué prohíbe la ley de 'Envase Abierto' de Hawái con respecto a la posesión
    de un envase de bebida alcohólica abierto en qué parte del vehículo mientras se
    encuentra en una vía pública?
  choices:
    A: Solo en el área del asiento del conductor
    B: Solo en el asiento del pasajero delantero
    C: En cualquier lugar del área de pasajeros, incluida la guantera
    D: Solo en el maletero
  answer: C
  explanation: La ley HRS §291-3.1 prohíbe mantener un envase abierto de alcohol en
    el área de pasajeros de cualquier vehículo motorizado en cualquier vía pública.
    Esto incluye guanteras sin llave o cualquier área al alcance del conductor o los
    pasajeros.
- id: 132
  category: alcohol_drugs_health
  question: 'Por una primera condena por DUI en Hawái, se le puede ordenar a un conductor
    que pague una multa que oscila entre:'
  choices:
    A: $50 a $100
    B: $150 a $500
    C: $250 a $1,000
    D: $1,000 a $5,000
  answer: C
  explanation: Un infractor de DUI por primera vez en Hawái se enfrenta a una multa
    de no menos de $250 y no más de $1,000, además de otros cargos y sanciones.
- id: 133
  category: alcohol_drugs_health
  question: ¿Puede un conductor en Hawái ser condenado por DUI si está bajo la influencia
    de medicamentos recetados legalmente?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, solo las drogas ilegales cuentan para un DUI
    C: Sí, si el medicamento afecta su capacidad para conducir de manera segura
    D: Sí, pero solo si el medicamento es un narcótico
  answer: C
  explanation: La ley HRS §291E-61 se aplica a cualquier sustancia que afecte la capacidad
    de una persona para operar un vehículo de manera segura, incluidos los medicamentos
    recetados y los medicamentos de venta libre.
- id: 134
  category: alcohol_drugs_health
  question: ¿Cuántas horas como mínimo debe completar un infractor de DUI por primera
    vez en Hawái en un programa de rehabilitación por abuso de sustancias?
  choices:
    A: 8 horas
    B: 14 horas
    C: 24 horas
    D: 40 horas
  answer: B
  explanation: La ley de Hawái exige que los infractores de DUI por primera vez asistan
    a un programa de rehabilitación de alcohol y drogas de un mínimo de 14 horas.
- id: 135
  category: alcohol_drugs_health
  question: ¿Qué dispositivo se le exige a menudo instalar a un conductor de Hawái
    en su vehículo para recuperar los privilegios de conducir después de una revocación
    por DUI?
  choices:
    A: Un regulador de velocidad
    B: Un dispositivo de interbloqueo de encendido (IID)
    C: Una cámara de tablero
    D: Un sistema de frenado de emergencia automático
  answer: B
  explanation: Hawái exige el uso de un dispositivo de interbloqueo de encendido (IID)
    para los conductores cuyas licencias han sido revocadas por DUI, lo que les permite
    conducir durante el período de revocación si el dispositivo está instalado.
- id: 136
  category: alcohol_drugs_health
  question: 'En Hawái, si es condenado por DUI mientras un pasajero menor de 15 años
    está en el vehículo, se enfrenta a:'
  choices:
    A: Ninguna sanción adicional
    B: Una multa adicional obligatoria de $500 y 48 horas de cárcel
    C: Una suspensión obligatoria de la licencia por 5 años
    D: El requisito de volver a tomar el examen de conducir
  answer: B
  explanation: Según la ley de Hawái, si una persona comete un DUI con un pasajero
    menor de 15 años, está sujeta a una multa obligatoria adicional de $500 y a 48
    horas obligatorias de prisión.
- id: 137
  category: alcohol_drugs_health
  question: 'Bajo la ley de ''Tolerancia Cero'' de Hawái, a un conductor menor de
    21 años se le puede suspender la licencia si su concentración de alcohol en sangre
    (BAC) es igual o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: La ley de Tolerancia Cero de Hawái (HRS §291E-64) establece que es
    ilegal que cualquier persona menor de 21 años conduzca con un BAC de 0.02% o superior.
- id: 138
  category: alcohol_drugs_health
  question: ¿Qué agencia de Hawái es responsable de la revocación administrativa de
    la licencia de conducir tras un arresto por DUI?
  choices:
    A: El Departamento de Transporte (DOT)
    B: La Oficina Administrativa de Revocación de Licencias de Conducir (ADLRO)
    C: El Departamento de Policía de Honolulu
    D: El Poder Judicial de Hawái
  answer: B
  explanation: La ADLRO es la agencia específica en Hawái que maneja el proceso administrativo
    de revocación de licencias por delitos de conducción relacionados con el alcohol
    o las drogas, independientemente de los procedimientos judiciales penales.
- id: 139
  category: alcohol_drugs_health
  question: ¿Cómo afecta típicamente el alcohol a la visión de un conductor?
  choices:
    A: Mejora la visión nocturna
    B: Agudiza la visión periférica
    C: Reduce la capacidad de juzgar la distancia y causa visión doble
    D: No tiene ningún efecto sobre la visión
  answer: C
  explanation: El alcohol ralentiza los músculos oculares, lo que dificulta el enfoque,
    reduce la visión periférica y afecta la capacidad de juzgar las distancias con
    precisión.
- id: 140
  category: alcohol_drugs_health
  question: 'En Hawái, si usted está involucrado en un accidente fatal y un oficial
    de policía tiene causa probable para creer que estaba conduciendo bajo la influencia:'
  choices:
    A: Puede elegir hacerse la prueba al día siguiente
    B: Puede rechazar la prueba sin ninguna sanción
    C: El oficial puede exigir una prueba de sangre obligatoria
    D: Solo tiene que hacerse una prueba de aliento
  answer: C
  explanation: En casos que involucren colisiones que resulten en lesiones o muerte,
    la ley de Hawái permite la realización de pruebas obligatorias si existe una causa
    probable para creer que el conductor estaba bajo la influencia.
- id: 141
  category: alcohol_drugs_health
  question: 'Si se siente fatigado o con sueño mientras conduce por una autopista
    de Hawái, la acción más segura es:'
  choices:
    A: Subir el volumen de la radio y abrir las ventanas
    B: Beber una bebida energética con mucha cafeína y continuar
    C: Detenerse en un área de descanso segura o estacionamiento y tomar una siesta
    D: Conducir más rápido para llegar antes a su destino
  answer: C
  explanation: La fatiga afecta el tiempo de reacción y el juicio de manera similar
    al alcohol. El único remedio seguro para la fatiga es dormir; las soluciones temporales
    como la cafeína o la música alta no eliminan el riesgo de quedarse dormido al
    volante.
- id: 142
  category: penalties_and_points
  question: ¿Bajo la ley de Consentimiento Implícito de Hawái, cuál es la sanción
    por negarse por primera vez a someterse a una prueba de aliento, sangre u orina
    para detectar sustancias intoxicantes?
  choices:
    A: Una suspensión de la licencia por 3 meses
    B: Una suspensión de la licencia por 6 meses
    C: Una revocación de la licencia por 1 año
    D: Una revocación de la licencia por 2 años
  answer: C
  explanation: En Hawái, si usted se niega a una prueba química bajo la ley de Consentimiento
    Implícito, su licencia de conducir será revocada por un período de un año por
    una primera infracción.
- id: 143
  category: penalties_and_points
  question: Según la Ley de Seguridad de los Niños Pasajeros actualizada de Hawái,
    ¿hasta qué edad deben permanecer los niños en un asiento de seguridad para niños
    orientado hacia atrás?
  choices:
    A: 1 año de edad
    B: 2 años de edad
    C: 4 años de edad
    D: 5 años de edad
  answer: B
  explanation: A partir de 2022, la ley de Hawái exige que los niños utilicen un asiento
    de seguridad orientado hacia atrás hasta que tengan al menos dos años de edad.
- id: 144
  category: penalties_and_points
  question: En Hawái, se considera que un conductor está 'Operando Habitualmente un
    Vehículo Bajo la Influencia' si tiene ¿cuántas condenas previas por DUI en los
    últimos 10 años?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cinco
  answer: C
  explanation: Según la ley de Hawái, una persona es un infractor habitual si es condenada
    por un DUI (conducir bajo la influencia) y tiene tres o más condenas previas por
    delitos de conducción relacionados con sustancias intoxicantes en un período de
    10 años.
- id: 145
  category: penalties_and_points
  question: 'Si un conductor en Hawái se ve involucrado en un accidente que resulta
    en daños a la propiedad, debe informar el accidente a la policía de inmediato
    si los daños a la propiedad de cualquier persona exceden los:'
  choices:
    A: $500
    B: $1,000
    C: $3,000
    D: $5,000
  answer: C
  explanation: Los Estatutos Revisados de Hawái exigen que los conductores informen
    un accidente a la estación de policía más cercana si este involucra lesiones,
    muerte o daños a la propiedad estimados en $3,000 o más.
- id: 146
  category: penalties_and_points
  question: En Hawái, ¿cuál es la multa máxima por una primera condena por no detenerse
    ante un autobús escolar que tiene sus luces rojas intermitentes y el brazo de
    parada extendido?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Los conductores en Hawái que no se detengan ante un autobús escolar
    que esté subiendo o bajando estudiantes enfrentan una multa de hasta $500 por
    una primera infracción.
- id: 147
  category: penalties_and_points
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    conductores comerciales (titulares de CDL) en Hawái?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: En consonancia con las regulaciones federales, Hawái establece el límite
    legal de BAC para los operadores de vehículos comerciales en 0.04%.
- id: 148
  category: penalties_and_points
  question: La 'Ley de Moverse a un Lado' (Move Over Law) de Hawái exige que los conductores
    reduzcan la velocidad y, si es seguro, dejen libre el carril más cercano a los
    vehículos de emergencia estacionados. ¿Esta ley también se aplica a cuál de los
    siguientes?
  choices:
    A: Grúas y vehículos del Departamento de Transporte de Hawái (HDOT)
    B: Solo patrullas de policía y camiones de bomberos
    C: Cualquier vehículo con las luces de emergencia encendidas
    D: Solo autobuses escolares
  answer: A
  explanation: La Ley de Moverse a un Lado de Hawái (HRS 291C-27) incluye a la policía,
    bomberos, ambulancias, grúas y vehículos de patrulla de servicio en autopistas
    del HDOT con luces intermitentes.
- id: 149
  category: penalties_and_points
  question: 'En Hawái, es ilegal poseer un recipiente abierto de alcohol en el área
    de pasajeros de un vehículo motorizado. Esta ley se aplica a:'
  choices:
    A: Solo el conductor
    B: El conductor y todos los pasajeros
    C: Solo pasajeros menores de 21 años
    D: Solo el conductor si el vehículo está en movimiento
  answer: B
  explanation: La ley de Hawái prohíbe tanto al conductor como a cualquier pasajero
    poseer un recipiente abierto de alcohol mientras se encuentren en un vehículo
    motorizado en una vía pública.
- id: 150
  category: penalties_and_points
  question: Una persona condenada por 'Carreras en Autopistas' en Hawái puede enfrentar
    ¿cuál de las siguientes sanciones por una primera infracción?
  choices:
    A: Una multa de hasta $500 y hasta 6 meses de cárcel
    B: Revocación permanente obligatoria de la licencia
    C: Solo una multa de $50
    D: Sin tiempo de cárcel, solo un requisito de servicio comunitario
  answer: A
  explanation: Las carreras en autopistas son un delito menor leve (petty misdemeanor)
    en Hawái, punible con una multa de hasta $500 y/o encarcelamiento por hasta seis
    meses.
- id: 151
  category: penalties_and_points
  question: ¿Cuál es la edad mínima para que un operador de motocicleta o motoneta
    pueda conducir sin casco en Hawái?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: El uso del casco es obligatorio para todas las edades
  answer: B
  explanation: En Hawái, la ley exige que los operadores y pasajeros de motocicletas
    y motonetas menores de 18 años usen casco.
- id: 152
  category: penalties_and_points
  question: En Hawái, el "Exceso de velocidad excesivo" (Excessive Speeding) se define
    como conducir a qué velocidad en relación con el límite señalizado?
  choices:
    A: 15 mph o más sobre el límite
    B: 20 mph o más sobre el límite
    C: 25 mph o más sobre el límite
    D: 30 mph o más sobre el límite
  answer: D
  explanation: Los Estatutos Revisados de Hawái (HRS 291C-105) definen el exceso de
    velocidad excesivo como conducir a 30 mph o más sobre el límite de velocidad,
    o conducir a más de 80 mph independientemente del límite.
- id: 153
  category: penalties_and_points
  question: 'De acuerdo con la ley actualizada de Hawái sobre el sistema de retención
    de niños pasajeros (Ley 122), los niños de entre 4 y 9 años deben estar asegurados
    en un asiento elevado (booster seat) a menos que midan al menos:'
  choices:
    A: 4 pies 5 pulgadas
    B: 4 pies 7 pulgadas
    C: 4 pies 9 pulgadas
    D: 5 pies 0 pulgadas
  answer: C
  explanation: La ley de Hawái exige que los niños de 4 a 9 años utilicen un asiento
    elevado o un asiento de seguridad para niños, a menos que midan al menos 4 pies
    9 pulgadas de altura.
- id: 154
  category: penalties_and_points
  question: En Hawái, si usted se ve involucrado en un accidente que solo resulta
    en daños a la propiedad, y el daño parece ser superior a ________, debe informar
    el accidente a la policía de inmediato.
  choices:
    A: $500
    B: $1,000
    C: $3,000
    D: $5,000
  answer: C
  explanation: La ley de Hawái exige que los conductores informen a la policía sobre
    cualquier accidente que involucre lesiones, muerte o daños a la propiedad estimados
    en $3,000 o más.
- id: 155
  category: penalties_and_points
  question: 'En Hawái, tirar basura desde un vehículo motorizado es una infracción
    que puede conllevar una multa de hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Tirar basura desde un vehículo en Hawái es ilegal y puede resultar
    en una multa de hasta $500.
- id: 156
  category: penalties_and_points
  question: 'Si es condenado por "Carreras en carreteras" (Racing on Highways) en
    Hawái, un conductor se enfrenta a una suspensión obligatoria de la licencia de
    al menos:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Las carreras en las carreteras son una infracción grave en Hawái. Una
    condena resulta en la revocación obligatoria de la licencia por un año.
- id: 157
  category: penalties_and_points
  question: 'En Hawái, si no cede el paso a un peatón en un cruce peatonal, la multa
    por una primera infracción es de entre:'
  choices:
    A: $50 y $100
    B: $150 y $500
    C: $500 y $1,000
    D: $1,000 y $2,000
  answer: B
  explanation: La ley de Hawái (HRS 291C-72) exige una multa de $150 a $500 para los
    conductores que no cedan el paso a los peatones en un cruce peatonal.
- id: 158
  category: sharing_the_road
  question: 'Según los Estatutos Revisados de Hawái §291C-72, cuando un peatón se
    encuentra en un cruce peatonal en la mitad de la calzada por la que circula un
    vehículo, el conductor debe:'
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Tocar la bocina para advertir al peatón
    C: Detenerse y ceder el paso
    D: Solo detenerse si el peatón usa un bastón blanco
  answer: C
  explanation: La ley de Hawái exige que los conductores se detengan ante los peatones
    que se encuentren en la mitad del cruce peatonal del conductor o que se aproximen
    tanto desde la mitad opuesta como para estar en peligro.
- id: 159
  category: sharing_the_road
  question: 'En Hawái, si se aproxima a un vehículo de emergencia estacionado con
    luces intermitentes en una carretera con al menos dos carriles en su dirección,
    usted debe:'
  choices:
    A: Mantener la velocidad pero cambiarse al carril izquierdo
    B: Detenerse inmediatamente en su carril
    C: Cambiarse a un carril no adyacente o reducir la velocidad a una velocidad razonable
      si cambiar de carril no es seguro
    D: Aumentar la velocidad para rebasar el vehículo rápidamente
  answer: C
  explanation: La ley de "Moverse a un lado" (Move Over) de Hawái (HRS §291C-27) exige
    que los conductores dejen libre el carril contiguo a un vehículo de emergencia
    estacionado o reduzcan la velocidad si no es posible cambiar de carril.
- id: 160
  category: sharing_the_road
  question: 'Cuando un autobús escolar se detiene en una carretera dividida con una
    barrera de mediana de concreto, los conductores que viajan en la dirección opuesta:'
  choices:
    A: Deben detenerse hasta que el autobús se mueva
    B: Deben detenerse solo si las luces rojas parpadean
    C: No están obligados a detenerse
    D: Deben reducir la velocidad a 10 mph
  answer: C
  explanation: En Hawái, si una carretera está dividida por una barrera física o mediana,
    el tráfico que viaja en la dirección opuesta a un autobús escolar detenido no
    está obligado a detenerse.
- id: 161
  category: sharing_the_road
  question: ¿Según la ley de Hawái, quién está obligado a usar un casco de seguridad
    al operar o viajar como pasajero en una motocicleta?
  choices:
    A: Todos los conductores independientemente de la edad
    B: Solo el operador
    C: Personas menores de 18 años
    D: Solo personas con un permiso de aprendizaje
  answer: C
  explanation: La ley de Hawái exige que los operadores y pasajeros de motocicletas
    y motonetas (motor scooters) menores de 18 años usen un casco de seguridad asegurado
    con una correa en la barbilla.
- id: 162
  category: sharing_the_road
  question: Con respecto a los ciclomotores (mopeds) en Hawái, ¿cuál de las siguientes
    afirmaciones es verdadera?
  choices:
    A: Los ciclomotores pueden llevar a un pasajero
    B: Los ciclomotores pueden conducirse por las aceras
    C: Es ilegal llevar a un pasajero en un ciclomotor
    D: Los ciclomotores no requieren licencia de conducir
  answer: C
  explanation: Según la ley de Hawái (HRS §291C-195), ninguna persona debe conducir
    un ciclomotor con un pasajero, y ninguna persona debe viajar como pasajero en
    un ciclomotor.
- id: 163
  category: sharing_the_road
  question: En Hawái, ¿en cuál de las siguientes áreas es ilegal andar en bicicleta
    por una acera?
  choices:
    A: Vecindarios residenciales
    B: Un distrito comercial
    C: Cerca de una escuela
    D: Cerca de un parque público
  answer: B
  explanation: La ley de Hawái prohíbe andar en bicicleta por las aceras dentro de
    un distrito comercial, como el centro de Honolulu o Waikiki.
- id: 164
  category: sharing_the_road
  question: 'Al seguir a un camión grande, si no puede ver los espejos laterales del
    conductor del camión, usted se encuentra:'
  choices:
    A: En la 'Zona No' (punto ciego) del camión
    B: En una posición de seguimiento segura
    C: Obligado a encender sus luces altas
    D: En la 'Zona Despejada' del camión
  answer: A
  explanation: Si no puede ver los espejos del conductor del camión, el conductor
    no puede verlo a usted, lo que significa que se encuentra en uno de los puntos
    ciegos o 'No-Zones' del camión.
- id: 165
  category: sharing_the_road
  question: En Hawái, ¿cuál es la distancia mínima que debe mantener al seguir a un
    aparato de bomberos (camión de bomberos) que viaja en respuesta a una alarma de
    incendio?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La sección HRS §291C-121 prohíbe seguir a un aparato de bomberos a
    una distancia menor de 500 pies cuando este responde a una alarma.
- id: 166
  category: sharing_the_road
  question: 'Cuando vea a un peatón que lleva un bastón blanco o usa un perro guía
    en una intersección, usted debe:'
  choices:
    A: Tocar la bocina para avisarle que está allí
    B: Detenerse y tomar precauciones para evitar lesiones al peatón
    C: Conducir alrededor de ellos si hay espacio
    D: Esperar a que le hagan una señal para pasar
  answer: B
  explanation: La ley de Hawái (HRS §291C-76) exige que los conductores tomen las
    precauciones necesarias y se detengan para evitar lesiones a los peatones ciegos
    o con visión parcial que utilicen un bastón o un perro guía.
- id: 167
  category: sharing_the_road
  question: 'Bajo la ley de ''Filtrado de Carriles'' (Lane Filtering) de Hawái, las
    motocicletas de dos ruedas pueden rebasar a otros vehículos que estén detenidos
    en la misma dirección si:'
  choices:
    A: La motocicleta circula por el arcén (hombro)
    B: El límite de velocidad es de 45 mph o más y la carretera tiene al menos dos
      carriles
    C: La motocicleta circula entre carriles de tráfico en movimiento
    D: La motocicleta circula únicamente en una calle de sentido único
  answer: B
  explanation: Hawái permite el 'filtrado de carriles' (no la división de carriles
    o lane splitting) para motocicletas de dos ruedas en carreteras con al menos dos
    carriles en la misma dirección y un límite de velocidad de 45 mph o más, siempre
    que los otros vehículos estén detenidos.
- id: 168
  category: sharing_the_road
  question: 'Un ciclista en Hawái que señaliza un giro a la derecha puede hacerlo
    extendiendo su brazo izquierdo hacia arriba O:'
  choices:
    A: Extendiendo su brazo derecho horizontalmente
    B: Apuntando hacia el suelo con el brazo izquierdo
    C: Agitando ambos brazos
    D: Haciendo destellos con su faro delantero
  answer: A
  explanation: La ley de Hawái permite a los ciclistas señalizar un giro a la derecha
    extendiendo la mano y el brazo izquierdos hacia arriba o extendiendo la mano y
    el brazo derechos horizontalmente.
- id: 169
  category: sharing_the_road
  question: 'En Hawái, es ilegal que una persona permanezca en la calzada con el propósito
    de:'
  choices:
    A: Esperar un autobús en una parada señalizada
    B: Solicitar transporte (pedir aventón o hitchhiking)
    C: Cruzar en un paso de peatones
    D: Ayudar a un vehículo averiado
  answer: B
  explanation: La sección HRS §291C-77 establece que ninguna persona debe permanecer
    en una calzada con el propósito de solicitar transporte (pedir aventón) al ocupante
    de cualquier vehículo.
- id: 170
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle estrecha, el conductor
    puede necesitar:'
  choices:
    A: Mantenerse cerca del bordillo derecho
    B: Abrirse ampliamente hacia la izquierda antes de girar
    C: Aumentar la velocidad para despejar la intersección
    D: Girar desde el carril situado más a la izquierda
  answer: B
  explanation: Los camiones grandes tienen un radio de giro amplio y a menudo necesitan
    abrirse hacia la izquierda para no golpear el bordillo al realizar un giro a la
    derecha.
- id: 171
  category: sharing_the_road
  question: En Hawái, ¿cuál es la distancia lateral mínima que un automovilista debe
    mantener al adelantar o rebasar una bicicleta que circula en la misma dirección?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Hawái (Ley 171) exige que los automovilistas dejen una distancia
    de seguridad no inferior a tres pies al adelantar o rebasar una bicicleta.
- id: 172
  category: sharing_the_road
  question: En Hawái, ¿cuál es el requisito legal para llevar pasajeros en un ciclomotor
    (moped)?
  choices:
    A: Se permiten pasajeros si son mayores de 12 años
    B: Se permiten pasajeros si el ciclomotor tiene un asiento para dos
    C: Ninguna persona debe conducir un ciclomotor transportando a otra persona
    D: Se permiten pasajeros solo en zonas residenciales
  answer: C
  explanation: Según los Estatutos Revisados de Hawái §291C-195, ninguna persona debe
    conducir un ciclomotor transportando a otra persona. Los ciclomotores son estrictamente
    para un solo conductor.
- id: 173
  category: sharing_the_road
  question: 'Cuando un peatón cruza la calle guiado por un perro o lleva un bastón
    blanco (o un bastón blanco con punta roja), la ley de Hawái le exige:'
  choices:
    A: Tocar la bocina para avisarles que usted está allí
    B: Tomar precauciones y detenerse para evitar lesiones al peatón
    C: Esperar a que le hagan una señal para pasar
    D: Rodearlos si hay espacio
  answer: B
  explanation: Los conductores deben tomar todas las precauciones necesarias para
    evitar lesiones a peatones ciegos o con visión parcial. Debe detenerse y permanecer
    detenido hasta que el peatón haya cruzado con seguridad.
- id: 174
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la operación
    de bicicletas en las aceras de Hawái?
  choices:
    A: Se permiten bicicletas en todas las aceras en todo momento
    B: Se prohíben las bicicletas en las aceras de los distritos comerciales
    C: Las bicicletas siempre deben circular por la acera, nunca por la carretera
    D: Solo se permiten bicicletas eléctricas en las aceras
  answer: B
  explanation: Según HRS §291C-148, ninguna persona debe circular en bicicleta por
    una acera en un distrito comercial. En otras áreas, los ciclistas en las aceras
    deben ceder el paso a los peatones.
- id: 175
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Aumentar la velocidad para mantenerse delante de él
    C: Hacerse a un lado hacia el borde derecho de la carretera y detenerse
    D: Hacerse a un lado hacia el borde izquierdo de la carretera y detenerse
  answer: C
  explanation: La ley de Hawái exige que los conductores cedan el paso dirigiéndose
    al borde o bordillo derecho de la carretera, fuera de cualquier intersección,
    y deteniéndose hasta que el vehículo de emergencia haya pasado.
- id: 176
  category: sharing_the_road
  question: En Hawái, ¿los operadores de motocicletas menores de qué edad están obligados
    por ley a usar un casco de seguridad?
  choices:
    A: Menores de 16 años
    B: Menores de 18 años
    C: Menores de 21 años
    D: Todas las edades deben usar casco
  answer: B
  explanation: La ley de Hawái exige que los operadores y pasajeros de motocicletas
    y motonetas menores de 18 años usen un casco de seguridad asegurado con una correa
    en la barbilla.
- id: 177
  category: sharing_the_road
  question: 'Al seguir a un aparato de bomberos (camión de bomberos) que responde
    a una alarma, la ley de Hawái prohíbe seguirlo a una distancia menor de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Según HRS §291C-128, es ilegal seguir a cualquier aparato de bomberos
    que viaje en respuesta a una alarma de incendio a menos de 500 pies.
- id: 178
  category: sharing_the_road
  question: 'Si conduce por una carretera con una mediana o divisor físico, y un autobús
    escolar está detenido en el lado opuesto del divisor con las luces rojas intermitentes,
    usted:'
  choices:
    A: Debe detenerse hasta que el autobús se mueva
    B: Debe reducir la velocidad a 10 mph
    C: Puede continuar sin detenerse
    D: Debe detenerse solo si hay niños presentes
  answer: C
  explanation: En una carretera dividida (donde las calzadas están separadas por una
    barrera física o mediana), los conductores que viajan en la dirección opuesta
    a un autobús escolar no están obligados a detenerse.
- id: 179
  category: sharing_the_road
  question: 'Al girar a la derecha cruzando un carril para bicicletas en Hawái, usted
    debe:'
  choices:
    A: Girar rápidamente para adelantarse a cualquier ciclista
    B: Verificar si hay ciclistas, señalizar y ceder el paso a cualquier ciclista
      en el carril antes de girar
    C: Detenerse siempre en el carril de bicicletas antes de girar
    D: Tocar la bocina para advertir a los ciclistas que se detengan
  answer: B
  explanation: Los conductores deben ceder el paso a cualquier ciclista en un carril
    para bicicletas antes de realizar un giro. Debe revisar sus puntos ciegos y espejos
    para asegurarse de que no se aproximen ciclistas por detrás.
- id: 180
  category: vehicle_information
  question: En el estado de Hawái, ¿con qué frecuencia deben someterse la mayoría
    de los vehículos a una inspección de seguridad?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Según la ley de Hawái, la mayoría de los vehículos deben pasar una
    inspección de seguridad anual para garantizar que cumplen con los estándares de
    equipamiento del estado.
- id: 181
  category: vehicle_information
  question: ¿Según la ley de Hawái, cuál es el porcentaje mínimo de Transmisión de
    Luz Visible (VLT) requerido para el polarizado de las ventanas laterales y traseras
    de un sedán de pasajeros?
  choices:
    A: 20%
    B: 25%
    C: 35%
    D: 50%
  answer: C
  explanation: Los Estatutos Revisados de Hawái especifican que el polarizado de las
    ventanas en los automóviles de pasajeros debe permitir el paso de al menos el
    35% de la luz (con un margen de tolerancia de más o menos el 6%).
- id: 182
  category: vehicle_information
  question: ¿Cuándo es obligatorio encender los faros delanteros en Hawái?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
    B: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la
      salida del sol
    C: Solo cuando está lloviendo
    D: Solo cuando se conduce en autopistas sin iluminación
  answer: B
  explanation: El Manual del Conductor de Hawái establece que los faros delanteros
    deben encenderse desde 30 minutos después de la puesta del sol hasta 30 minutos
    antes de la salida del sol, o siempre que la visibilidad sea deficiente.
- id: 183
  category: vehicle_information
  question: En Hawái, ¿cuál es la profundidad mínima legal de la banda de rodadura
    de los neumáticos para un vehículo de pasajeros?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Para aprobar una inspección de seguridad en Hawái, los neumáticos deben
    tener una profundidad mínima de la banda de rodadura de al menos 2/32 de pulgada.
- id: 184
  category: vehicle_information
  question: Hawái es un estado de seguro "sin culpa" (no-fault). ¿Qué significa esto
    principalmente para los conductores?
  choices:
    A: Los conductores nunca son responsables de los accidentes
    B: Su propia compañía de seguros paga sus gastos médicos independientemente de
      quién haya causado el accidente
    C: No es necesario tener seguro si tiene un historial limpio
    D: El estado paga todos los daños del vehículo en un accidente
  answer: B
  explanation: La ley de seguro sin culpa de Hawái requiere la cobertura de Protección
    contra Lesiones Personales (PIP), que paga los gastos médicos del conductor y
    los pasajeros hasta un límite determinado, independientemente de quién tuvo la
    culpa.
- id: 185
  category: vehicle_information
  question: En Hawái, ¿hasta qué edad o estatura debe un niño estar asegurado en un
    asiento elevado (booster seat)?
  choices:
    A: 8 años de edad o 4 pies 5 pulgadas
    B: 10 años de edad o 4 pies 9 pulgadas
    C: 12 años de edad o 5 pies de altura
    D: 7 años de edad o 4 pies de altura
  answer: B
  explanation: La ley de Hawái exige que los niños entre las edades de 4 y 10 años
    utilicen un asiento elevado a menos que midan más de 4 pies 9 pulgadas de estatura.
- id: 186
  category: vehicle_information
  question: 'Si el espejo retrovisor de su vehículo está obstruido por una carga o
    por el diseño del vehículo, la ley de Hawái le exige tener:'
  choices:
    A: Solo una cámara de reversa
    B: Un pasajero que lo guíe
    C: Espejos laterales tanto en el lado izquierdo como en el derecho
    D: Un espejo interior de gran angular
  answer: C
  explanation: Si la visión desde el espejo retrovisor interior está obstruida, la
    ley de Hawái exige que el vehículo esté equipado con espejos laterales tanto en
    el lado izquierdo como en el derecho.
- id: 187
  category: vehicle_information
  question: 'En Hawái, todo vehículo de motor debe estar equipado con una bocina que
    pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Las leyes de equipamiento de vehículos de Hawái exigen una bocina capaz
    de emitir un sonido audible en condiciones normales desde una distancia no menor
    a 200 pies.
- id: 188
  category: vehicle_information
  question: 'La ley de Hawái exige que el freno de estacionamiento de un vehículo
    debe ser capaz de retener el vehículo:'
  choices:
    A: Solo en superficies planas
    B: En cualquier pendiente (colina) en la que se opere
    C: Solo cuando el motor está en marcha
    D: Solo si el vehículo tiene una marcha puesta
  answer: B
  explanation: El sistema de freno de estacionamiento debe ser adecuado para retener
    el vehículo en cualquier pendiente en la que se opere, bajo todas las condiciones
    de carga, en una superficie libre de nieve, hielo o material suelto.
- id: 189
  category: vehicle_information
  question: ¿Dónde está obligado un conductor de Hawái a guardar el Certificado de
    Registro vigente del vehículo?
  choices:
    A: En la casa del conductor
    B: En el vehículo
    C: En la oficina del DMV del condado
    D: En la billetera del conductor en todo momento
  answer: B
  explanation: La ley de Hawái exige que el certificado de registro vigente del vehículo
    se mantenga en el vehículo y se presente ante la solicitud de un oficial de la
    ley.
- id: 190
  category: vehicle_information
  question: La ley de seguro obligatorio de vehículos de motor de Hawái exige un mínimo
    de ¿cuánta cobertura por lesiones corporales para una persona en un accidente?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: La ley de Hawái exige un mínimo de $20,000 por persona para la cobertura
    de responsabilidad por lesiones corporales.
- id: 191
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    de un vehículo de pasajeros en Hawái para aprobar una inspección de seguridad?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Para aprobar la inspección de seguridad de Hawái, los neumáticos deben
    tener una profundidad mínima de la banda de rodadura de 2/32 de pulgada.
- id: 192
  category: vehicle_information
  question: ¿Dónde debe guardarse el certificado de registro del vehículo motorizado
    en Hawái?
  choices:
    A: En la residencia del propietario
    B: En la guantera del vehículo o en algún otro lugar dentro del vehículo
    C: Sujeto a la placa de matrícula trasera
    D: En la billetera del conductor en todo momento
  answer: B
  explanation: La ley de Hawái exige que el certificado de registro se mantenga en
    el vehículo para el cual está registrado.
- id: 193
  category: vehicle_information
  question: 'La ley de Hawái exige que todo vehículo motorizado esté equipado con
    un freno de estacionamiento que sea capaz de detener el vehículo:'
  choices:
    A: Solo en una superficie nivelada
    B: Solo en una pendiente del 10%
    C: En cualquier pendiente en la que se opere
    D: Solo cuando el vehículo está en la marcha de estacionamiento ('Park')
  answer: C
  explanation: El freno de estacionamiento debe ser adecuado para sujetar el vehículo
    en cualquier pendiente en la que se opere, independientemente de la carga.
- id: 194
  category: vehicle_information
  question: 'Al seguir a otro vehículo por la noche en Hawái, debe cambiar a luces
    bajas cuando se encuentre a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Hawái exige que los conductores atenúen sus luces altas al
    seguir a otro vehículo a una distancia de 300 pies o menos.
- id: 195
  category: vehicle_information
  question: 'Hawái es un estado de seguro ''sin culpa'' (no-fault). En este contexto,
    ''sin culpa'' se refiere principalmente a que:'
  choices:
    A: Nunca se culpa a nadie por un accidente
    B: Su propia compañía de seguros paga sus gastos médicos independientemente de
      quién causó el accidente
    C: Los conductores no necesitan tener un seguro de responsabilidad civil
    D: La policía no emite multas en el lugar de un accidente
  answer: B
  explanation: La ley sin culpa de Hawái significa que su cobertura de Protección
    contra Lesiones Personales (PIP) paga sus propios gastos médicos hasta un cierto
    límite, independientemente de quién haya tenido la culpa.
- id: 196
  category: vehicle_information
  question: Según la ley de Hawái, ¿es ilegal operar un vehículo con un silenciador
    que haya sido modificado con cuál de los siguientes?
  choices:
    A: Una punta de cromo
    B: Un recorte (cutout), derivación (bypass) o dispositivo similar
    C: Un protector térmico
    D: Nuevos soportes de montaje
  answer: B
  explanation: La ley de Hawái prohíbe el uso de silenciadores equipados con recortes,
    derivaciones o dispositivos similares que aumenten los niveles de ruido.
- id: 197
  category: vehicle_information
  question: 'Todo vehículo motorizado en Hawái debe estar equipado con al menos un
    espejo ubicado para reflejar al conductor una vista de la carretera por una distancia
    de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: La ley de Hawái exige que los espejos proporcionen una vista de la
    carretera de al menos 200 pies hacia la parte trasera del vehículo.
- id: 198
  category: vehicle_information
  question: 'En Hawái, la bocina de un vehículo motorizado debe ser audible en condiciones
    normales desde una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Los Estatutos Revisados de Hawái exigen que la bocina sea audible desde
    una distancia no menor a 200 pies.
- id: 199
  category: signs_and_signals
  question: En Hawái, cuando un semáforo muestra una luz roja intermitente, ¿qué debe
    hacer el conductor?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo y proceder solo cuando sea seguro hacerlo
    C: Detenerse y esperar a que la luz cambie a verde
    D: Ceder el paso al tráfico que viene en sentido contrario pero no detenerse
  answer: B
  explanation: Según el Manual del Conductor de Hawái, una señal roja intermitente
    significa lo mismo que una señal de alto. Debe detenerse por completo y avanzar
    solo cuando sea seguro.
- id: 200
  category: signs_and_signals
  question: ¿Qué señal manual es la forma correcta de indicar un giro a la derecha
    en Hawái?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba en un ángulo de 90 grados
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: Para señalar un giro a la derecha mediante señales manuales, el conductor
    debe extender el brazo izquierdo por la ventana y doblarlo hacia arriba a la altura
    del codo.
- id: 201
  category: signs_and_signals
  question: Según la ley de Hawái (HRS 291C-33), ¿qué tiene prohibido hacer un peatón
    cuando se muestra un temporizador de "Cuenta regresiva" (Countdown) en un cruce
    peatonal?
  choices:
    A: Terminar de cruzar si ya se encuentra en la calle
    B: Comenzar a cruzar la calzada
    C: Caminar más rápido para ganarle al temporizador
    D: Esperar en la acera para el siguiente ciclo
  answer: B
  explanation: La ley estatal de Hawái prohíbe a los peatones comenzar a cruzar la
    calzada una vez que el temporizador de cuenta regresiva o la señal de "No caminar"
    (Don't Walk) ha comenzado.
- id: 202
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla continua junto a una línea amarilla discontinua
    en una carretera de Hawái?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se prohíbe rebasar desde cualquier lado
    C: Se permite rebasar solo desde el lado que tiene la línea discontinua
    D: Se permite rebasar solo desde el lado que tiene la línea continua
  answer: C
  explanation: Una línea amarilla discontinua junto a una línea amarilla continua
    significa que rebasar está permitido solo para el tráfico que circula del lado
    de la línea discontinua.
- id: 203
  category: signs_and_signals
  question: 'En Hawái, un símbolo de diamante blanco pintado en el pavimento indica:'
  choices:
    A: Un cruce de peatones más adelante
    B: Un carril para vehículos de alta ocupación (HOV) o carril restringido
    C: Un cruce de ferrocarril más adelante
    D: El carril es solo para vehículos de emergencia
  answer: B
  explanation: El símbolo de diamante se utiliza en Hawái para marcar los carriles
    reservados para vehículos de alta ocupación (HOV), como autobuses y vehículos
    compartidos (carpools).
- id: 204
  category: signs_and_signals
  question: 'Cuando vea una señal de tráfico amarilla intermitente en Hawái, usted
    debe:'
  choices:
    A: Detenerse y esperar a que cambie a verde
    B: Acelerar para despejar la intersección
    C: Reducir la velocidad y proceder con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y estar extra alerta mientras avanza a través de la intersección.
- id: 205
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de "Banderín" (triángulo
    isósceles que apunta a la derecha) que se encuentra en las carreteras de Hawái?
  choices:
    A: Ceder el paso
    B: Zona de no rebasar (No Passing Zone)
    C: Zona escolar
    D: Cruce de ferrocarril
  answer: B
  explanation: Una señal en forma de banderín se coloca en el lado izquierdo de la
    carretera para indicar el inicio de una "Zona de no rebasar" (No Passing Zone).
- id: 206
  category: signs_and_signals
  question: 'En Hawái, puede girar a la izquierda con luz roja ÚNICAMENTE cuando gira
    desde:'
  choices:
    A: Una calle de doble sentido hacia una calle de un solo sentido
    B: Una calle de un solo sentido hacia otra calle de un solo sentido
    C: Una calle de un solo sentido hacia una calle de doble sentido
    D: Cualquier calle, siempre que no haya tráfico
  answer: B
  explanation: La ley de Hawái permite girar a la izquierda en rojo solo cuando se
    gira desde una calle de un solo sentido hacia otra calle de un solo sentido, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 207
  category: signs_and_signals
  question: ¿Qué significa una doble línea blanca continua en una autopista de Hawái?
  choices:
    A: Puede cruzarla para cambiar de carril si es seguro
    B: Separa el tráfico que se mueve en direcciones opuestas
    C: Se prohíbe el cambio de carril
    D: Marca el borde de la calzada
  answer: C
  explanation: Las líneas blancas continuas dobles se utilizan para separar carriles
    de tráfico que se mueven en la misma dirección donde está prohibido cambiar de
    carril.
- id: 208
  category: signs_and_signals
  question: 'Una señal en forma de pentágono (cinco lados) en una carretera de Hawái
    indica:'
  choices:
    A: Una señal de alto (pare)
    B: Una señal de ceda el paso
    C: Una zona escolar o cruce escolar
    D: Un límite de condado
  answer: C
  explanation: La forma de pentágono de cinco lados se reserva exclusivamente para
    zonas escolares y cruces escolares.
- id: 209
  category: signs_and_signals
  question: 'Cuando una señal de tráfico cambia de verde a amarillo en Hawái, significa:'
  choices:
    A: Debe detenerse inmediatamente, incluso si está en la intersección
    B: La señal está a punto de cambiar a rojo; despeje la intersección si ya se encuentra
      en ella
    C: Acelere para ganarle a la luz roja
    D: Tiene el derecho de paso para continuar durante 5 segundos más
  answer: B
  explanation: Una luz amarilla advierte que la señal roja está a punto de aparecer.
    Si ya está en la intersección, debe continuar con seguridad. Si no ha entrado,
    debe detenerse si es seguro hacerlo.
- id: 210
  category: signs_and_signals
  question: En Hawái, ¿qué indica una señal amarilla "Circular" con una "X" negra
    y las letras "RR"?
  choices:
    A: Una curva cerrada más adelante
    B: Una intersección de autopistas
    C: Un cruce de ferrocarril más adelante
    D: Una calzada restringida
  answer: C
  explanation: La señal amarilla redonda con una "X" negra y "RR" es una señal de
    advertencia de que se está acercando a un cruce de ferrocarril.
- id: 211
  category: signs_and_signals
  question: ¿Cuál es el propósito de los "Sharrows" (un símbolo de bicicleta con dos
    galones) pintados en las carreteras de Hawái?
  choices:
    A: Indican un carril reservado exclusivamente para bicicletas
    B: Indican un carril compartido tanto por automovilistas como por ciclistas
    C: Marcan dónde los ciclistas deben detenerse ante el tráfico
    D: Indican una zona exclusiva para peatones
  answer: B
  explanation: Los Sharrows, o marcas de carril compartido, se utilizan en Hawái para
    indicar que los automovilistas y los ciclistas deben compartir el carril de circulación.
- id: 212
  category: signs_and_signals
  question: En Hawái, ¿qué debe hacer en un semáforo en rojo si tiene la intención
    de girar a la derecha y no hay ninguna señal que lo prohíba?
  choices:
    A: Reducir la velocidad y girar sin detenerse
    B: Esperar a que el semáforo cambie a verde
    C: Detenerse por completo, ceder el paso a todo el tráfico y a los peatones, y
      luego girar
    D: Girar solo si no hay otros autos a menos de 100 pies
  answer: C
  explanation: En Hawái, puede girar a la derecha en rojo después de detenerse por
    completo y ceder el paso a los peatones y otros vehículos, a menos que una señal
    prohíba específicamente el giro.
- id: 213
  category: signs_and_signals
  question: ¿Qué señal manual se utiliza para indicar que un conductor se está deteniendo
    o reduciendo la velocidad?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho saludando por la ventana
  answer: C
  explanation: Para señalar que se detiene o reduce la velocidad, el conductor extiende
    el brazo izquierdo por la ventana y lo apunta hacia abajo con la palma hacia atrás.
- id: 214
  category: signs_and_signals
  question: En Hawái, si las luces direccionales de su vehículo no funcionan, ¿cómo
    debe señalar un giro a la izquierda mediante una señal manual?
  choices:
    A: Extienda el brazo izquierdo recto hacia afuera de la ventana
    B: Extienda el brazo izquierdo hacia arriba
    C: Extienda el brazo izquierdo hacia abajo
    D: Mueva la mano en movimiento circular
  answer: A
  explanation: Según el Manual del Conductor de Hawái, un giro a la izquierda se señala
    extendiendo el brazo izquierdo horizontalmente hacia afuera de la ventana.
- id: 215
  category: signs_and_signals
  question: Para señalar un giro a la derecha mediante señales manuales en Hawái,
    ¿cuál es la posición correcta del brazo?
  choices:
    A: Brazo izquierdo recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho recto hacia afuera
  answer: B
  explanation: El Manual del Conductor de Hawái establece que un giro a la derecha
    se señala extendiendo el brazo izquierdo hacia arriba en un ángulo de 90 grados.
- id: 216
  category: signs_and_signals
  question: Al usar señales manuales en Hawái, ¿cómo indica que se está deteniendo
    o reduciendo la velocidad repentinamente?
  choices:
    A: Extienda el brazo izquierdo hacia arriba
    B: Extienda el brazo izquierdo recto hacia afuera
    C: Extienda el brazo izquierdo hacia abajo, con la palma hacia atrás
    D: Extienda el brazo derecho hacia abajo
  answer: C
  explanation: Para señalar una parada o disminución de la velocidad, el Manual del
    Conductor de Hawái requiere extender el brazo izquierdo hacia abajo con la palma
    hacia atrás.
- id: 217
  category: signs_and_signals
  question: En Hawái, ¿qué significa una luz de semáforo roja intermitente?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo y avanzar solo cuando sea seguro hacerlo
    C: La luz está a punto de cambiar a verde
    D: Ceder el paso a todo el tráfico, pero no detenerse
  answer: B
  explanation: 'Una luz roja intermitente en Hawái tiene el mismo significado que
    una señal de alto: debe detenerse por completo y avanzar solo cuando sea seguro.'
- id: 218
  category: signs_and_signals
  question: Según la ley de Hawái, ¿qué debe hacer un conductor al acercarse a una
    señal de tráfico amarilla intermitente?
  choices:
    A: Detenerse y esperar la luz verde
    B: Acelerar para despejar la intersección
    C: Avanzar con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una señal amarilla intermitente en Hawái advierte a los conductores
    que reduzcan la velocidad y pasen por la intersección con precaución.
- id: 219
  category: signs_and_signals
  question: En las autopistas de Hawái, ¿qué indica un símbolo de diamante blanco
    pintado en el pavimento?
  choices:
    A: El carril está reservado para vehículos de alta ocupación (HOV)
    B: El carril es solo para vehículos de emergencia
    C: Hay un cruce de peatones más adelante
    D: El carril terminará pronto
  answer: A
  explanation: El símbolo del diamante indica un carril preferencial, utilizado más
    comúnmente en Hawái para carriles HOV (vehículos de alta ocupación/viaje compartido).
- id: 220
  category: signs_and_signals
  question: ¿Qué significa en Hawái una línea blanca continua pintada entre carriles
    de tráfico que se mueven en la misma dirección?
  choices:
    A: Se le anima a cambiar de carril
    B: Debe permanecer en su carril; se desaconseja el cambio de carril
    C: El carril es solo para bicicletas
    D: El tráfico se mueve en direcciones opuestas
  answer: B
  explanation: En Hawái, las líneas blancas continuas se utilizan para separar carriles
    de tráfico que se mueven en la misma dirección donde se desaconseja el cambio
    de carril por razones de seguridad.
- id: 221
  category: signs_and_signals
  question: En Hawái, ¿qué significan las líneas amarillas continuas dobles en el
    centro de la carretera?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Está prohibido rebasar en ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas continuas dobles indican que no se permite rebasar
    al tráfico que circula en ninguna de las dos direcciones.
- id: 222
  category: signs_and_signals
  question: 'En algunas calles de Honolulu, una señal de "X roja fija" sobre un carril
    significa:'
  choices:
    A: El carril está a punto de cambiar de dirección
    B: No debe conducir por este carril
    C: El carril es solo para giros a la izquierda
    D: Puede utilizar el carril con precaución
  answer: B
  explanation: En los sistemas de carriles reversibles (como los que se encuentran
    en Kapiolani Blvd), una X roja fija significa que el carril está cerrado al tráfico
    que viaja en su dirección.
- id: 223
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal naranja en forma de triángulo en
    la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo es un vehículo de movimiento lento (que viaja a 25 mph o menos)
    C: El vehículo es una carga de gran tamaño
    D: El vehículo es un conductor principiante
  answer: B
  explanation: El triángulo reflectante naranja es el símbolo universal para un vehículo
    de movimiento lento, que se define como un vehículo que viaja a velocidades de
    25 mph o menos.
- id: 224
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas en una carretera de Hawái?
  choices:
    A: El tráfico se mueve en direcciones opuestas
    B: El borde de la calzada
    C: El tráfico se mueve en la misma dirección y se permiten los cambios de carril
    D: Una zona donde está prohibido rebasar
  answer: C
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección donde se permite cruzar la línea para cambiar
    de carril.
- id: 225
  category: signs_and_signals
  question: 'En Hawái, una señal en forma de pentágono (cinco lados) indica:'
  choices:
    A: Una señal de alto (STOP)
    B: Una señal de ceda el paso (YIELD)
    C: Una zona escolar o cruce escolar
    D: Un cruce de ferrocarril
  answer: C
  explanation: Una señal de cinco lados es exclusiva para zonas escolares y cruces
    escolares en Hawái y en todo EE. UU.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 226
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar pasar a otros de forma segura.
  id: 227
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta carretera
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 228
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Dar una vuelta en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de forma
    segura.
  id: 229
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 230
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Vueltas en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de vuelta en U tachada
    significa que las vueltas en U están prohibidas en este lugar.
  id: 231
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 232
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite la vuelta en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 233
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de "ZONA DE NO REBASAR"
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 234
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "MANTÉNGASE A LA DERECHA" (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 235
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 236
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 237
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de caminata cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la carretera.
  id: 238
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 239
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 240
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 241
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de rombo?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de rombo con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 242
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más brusco que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 243
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera curve primero
    en un sentido y luego en el otro.
  id: 244
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 245
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de rombo advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 246
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 247
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 248
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 249
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 250
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 251
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 252
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 253
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 254
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las carreteras
    laterales.
  id: 255
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la autopista desde la carretera lateral.
  id: 256
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 257
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) en rojo y blanco significa
    que no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 258
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que muestren un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 259
