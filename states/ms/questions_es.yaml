questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un permiso de aprendizaje en Mississippi?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 15 años y medio
  answer: B
  explanation: En Mississippi, una persona debe tener al menos 15 años para solicitar
    un permiso de aprendizaje.
- id: 2
  category: license_system
  question: Bajo la Ley de Licencia de Conducir Graduada (GDL) de Mississippi, ¿cuánto
    tiempo debe un adolescente tener un permiso de aprendizaje antes de ser elegible
    para una licencia intermedia?
  choices:
    A: 6 meses
    B: 9 meses
    C: 12 meses
    D: 2 años
  answer: C
  explanation: La ley de Mississippi exige que los titulares de permisos mantengan
    su permiso de aprendizaje durante al menos 12 meses antes de solicitar una licencia
    intermedia.
- id: 3
  category: license_system
  question: ¿Cuáles son las restricciones de conducción nocturna para el titular de
    una licencia intermedia de Mississippi de domingo a jueves?
  choices:
    A: No conducir entre las 9:00 PM y las 6:00 AM
    B: No conducir entre las 10:00 PM y las 6:00 AM
    C: No conducir entre las 11:00 PM y las 5:00 AM
    D: No conducir entre la medianoche y las 6:00 AM
  answer: B
  explanation: Los titulares de licencias intermedias en Mississippi no pueden conducir
    entre las 10:00 PM y las 6:00 AM de domingo a jueves.
- id: 4
  category: license_system
  question: Para obtener una licencia de conducir de Mississippi, un solicitante menor
    de 18 años debe proporcionar ¿qué documento escolar específico?
  choices:
    A: Una boleta de calificaciones reciente con un promedio de C
    B: Una tarjeta de identificación de estudiante válida
    C: Un formulario de Certificación de Asistencia Escolar firmado por funcionarios
      escolares
    D: Una carta de recomendación de un maestro
  answer: C
  explanation: Los solicitantes menores de 18 años deben presentar un formulario de
    Certificación de Asistencia Escolar (con no más de 30 días de antigüedad, o 60
    días durante el verano) al Departamento de Seguridad Pública (DPS).
- id: 5
  category: license_system
  question: Un nuevo residente de Mississippi que posee una licencia de conducir válida
    de otro estado debe obtener una licencia de Mississippi dentro de ¿cuántos días
    después de establecer su residencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 10 días
  answer: B
  explanation: De acuerdo con la ley de Mississippi, los nuevos residentes tienen
    60 días para obtener una licencia de conducir de Mississippi después de mudarse
    al estado.
- id: 6
  category: license_system
  question: ¿Cuál es la agudeza visual mínima requerida para aprobar el examen de
    la vista para una licencia de conducir de Mississippi sin restricciones?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Mississippi requiere una agudeza visual mínima de 20/40 en cada ojo
    o en ambos ojos a la vez para aprobar el examen de la vista sin restricciones.
- id: 7
  category: license_system
  question: En Mississippi, una licencia de conducir estándar Clase R puede emitirse
    por ¿cuál de los siguientes periodos?
  choices:
    A: 2 años o 5 años
    B: 4 años u 8 años
    C: 1 año o 3 años
    D: 5 años o 10 años
  answer: B
  explanation: Los residentes de Mississippi tienen la opción de renovar o adquirir
    una licencia de conducir por un periodo de 4 años u 8 años.
- id: 8
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    para un vehículo motorizado en Mississippi?
  choices:
    A: $10,000/$20,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$50,000
    D: $15,000/$30,000/$15,000
  answer: B
  explanation: Los límites obligatorios del seguro de responsabilidad civil de Mississippi
    son $25,000 por lesiones corporales por persona, $50,000 por lesiones corporales
    por accidente y $25,000 por daños a la propiedad.
- id: 9
  category: license_system
  question: 'Si cambia su dirección dentro de Mississippi, la ley le exige notificar
    al Departamento de Seguridad Pública (DPS) dentro de:'
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Mississippi exige que los conductores notifiquen al DPS sobre
    un cambio de dirección dentro de los 30 días posteriores a la mudanza.
- id: 10
  category: license_system
  question: Mientras conduce con un permiso de aprendizaje en Mississippi, ¿quién
    debe estar sentado en el asiento delantero junto al conductor?
  choices:
    A: Cualquier conductor con licencia
    B: Un conductor con licencia que tenga al menos 18 años
    C: Un conductor con licencia que tenga al menos 21 años
    D: Solo un padre o tutor legal
  answer: C
  explanation: El titular de un permiso debe estar acompañado por un conductor con
    licencia que tenga al menos 21 años de edad y esté sentado en el asiento al lado
    del conductor.
- id: 11
  category: license_system
  question: ¿A qué edad es elegible un conductor de Mississippi para una licencia
    'Regular' Clase R que ya no tiene restricciones de GDL (Licencia de Conducir Graduada)?
  choices:
    A: 16 años
    B: 16 años y medio
    C: 17 años
    D: 18 años
  answer: C
  explanation: Las restricciones de GDL (como los límites de conducción nocturna)
    se aplican a la licencia intermedia. A los 17 años, un conductor es elegible para
    una licencia regular sin esas restricciones de tiempo específicas de GDL.
- id: 12
  category: license_system
  question: Si la licencia de conducir de Mississippi ha estado vencida por más de
    ______, el solicitante debe volver a tomar los exámenes escrito y de conducción.
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Si una licencia ha estado vencida por más de un año, el solicitante
    es tratado como un conductor nuevo y debe volver a tomar los exámenes requeridos.
- id: 13
  category: license_system
  question: ¿Cuál es la multa por una condena de primera ofensa por conducir sin el
    seguro de responsabilidad civil mínimo requerido en Mississippi?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: La multa por una condena de primera ofensa por no mantener el seguro
    de responsabilidad civil en Mississippi es de $500, junto con una suspensión de
    la licencia.
- id: 14
  category: license_system
  question: ¿Cuál de los siguientes NO es un requisito para obtener una licencia de
    conducir de Mississippi por primera vez?
  choices:
    A: Prueba del número de Seguro Social (SSN)
    B: Dos pruebas de residencia en Mississippi
    C: Certificado de nacimiento certificado
    D: Prueba de propiedad del vehículo (Título)
  answer: D
  explanation: Aunque se necesita prueba de identidad, residencia y número de Seguro
    Social (SSN), no es necesario ser dueño de un vehículo (ni mostrar un título de
    propiedad) para obtener una licencia de conducir.
- id: 15
  category: license_system
  question: En Mississippi, ¿cuál es la edad mínima para solicitar una licencia de
    conducir por 'Dificultad Extrema' (Hardship) debido a una necesidad extrema?
  choices:
    A: 13 años
    B: 14 años
    C: 15 años
    D: 15 años y medio
  answer: B
  explanation: Según el Código de MS § 63-1-9, se puede emitir una licencia por dificultad
    extrema a una persona que tenga al menos 14 años de edad si puede justificar una
    necesidad extrema para conducir.
- id: 16
  category: license_system
  question: 'Según la ley de Mississippi, cualquier solicitante masculino entre las
    edades de 18 y 26 años que solicite una licencia de conducir:'
  choices:
    A: Debe proporcionar prueba de empleo
    B: Es registrado automáticamente en el Servicio Selectivo
    C: Debe pagar una tarifa adicional de 'conductor joven'
    D: Está exento del examen escrito de conocimientos
  answer: B
  explanation: La ley de Mississippi exige que cualquier hombre de entre 18 y 26 años
    que solicite una licencia o identificación sea registrado en el Sistema de Servicio
    Selectivo (Selective Service System) en cumplimiento con la ley federal.
- id: 17
  category: license_system
  question: ¿Para cuál de los siguientes se requiere específicamente una licencia
    de conducir Clase D de Mississippi?
  choices:
    A: Operar una motocicleta
    B: Operar un vehículo de más de 26,000 libras de GVWR
    C: Operar un vehículo con fines comerciales que no requiera una CDL (ej. entrega
      o taxi)
    D: Operar un tractor agrícola en vías públicas
  answer: C
  explanation: Se requiere una licencia Clase D para los conductores de vehículos
    comerciales que no son lo suficientemente pesados como para requerir una Licencia
    de Conducir Comercial (CDL) Clase A, B o C, como camiones de entrega pequeños
    o taxis.
- id: 18
  category: license_system
  question: 'Si un padre o tutor que firmó la solicitud para la licencia de conducir
    de un menor en Mississippi decide que ya no quiere ser responsable de la conducción
    del menor, puede:'
  choices:
    A: Solo cancelar la licencia si el menor recibe una multa
    B: Solicitar por escrito que se cancele la licencia
    C: Esperar hasta que la licencia venza para rechazar la renovación
    D: Nada; la firma es vinculante hasta que el menor cumpla 18 años
  answer: B
  explanation: En Mississippi, la persona que firmó la solicitud de la licencia de
    un menor puede presentar una solicitud por escrito para que se cancele la licencia,
    lo que la libera de cualquier responsabilidad futura.
- id: 19
  category: license_system
  question: En Mississippi, si un estudiante menor de 18 años abandona la escuela
    y no se inscribe en un programa de GED, ¿qué sucede con sus privilegios de conducir?
  choices:
    A: Nada, siempre y cuando tenga un trabajo
    B: Su licencia se suspende hasta que cumpla 18 años o regrese a la escuela
    C: Se le restringe a conducir solo durante las horas del día
    D: Debe pagar una multa de $500 para conservar su licencia
  answer: B
  explanation: La ley de Mississippi exige que los estudiantes menores de 18 años
    estén inscritos en la escuela o en un programa de GED; si abandonan los estudios,
    la escuela notifica al DPS y la licencia se suspende.
- id: 20
  category: license_system
  question: ¿Cuál es la tarifa estándar de restablecimiento para una licencia de conducir
    de Mississippi que fue suspendida por razones distintas a un DUI o un delito relacionado
    con drogas?
  choices:
    A: $25
    B: $50
    C: $100
    D: $175
  answer: C
  explanation: La tarifa estándar de restablecimiento para una licencia suspendida
    en Mississippi es de $100, aunque los restablecimientos relacionados con DUI (conducir
    bajo la influencia) conllevan tarifas más altas.
- id: 21
  category: license_system
  question: Si su licencia de conducir de Mississippi se pierde o se destruye, debe
    solicitar un duplicado. ¿Cuál de las siguientes afirmaciones es verdadera con
    respecto a este proceso?
  choices:
    A: Debe volver a tomar el examen escrito
    B: Debe volver a tomar el examen de conducción
    C: Debe presentar un comprobante de identificación y pagar una tarifa
    D: Solo puede solicitar un duplicado una vez cada 5 años
  answer: C
  explanation: Para obtener un duplicado de la licencia en Mississippi, debe visitar
    una oficina del Departamento de Seguridad Pública (DPS), presentar documentos
    de identificación y pagar la tarifa de duplicado requerida.
- id: 22
  category: license_system
  question: Una licencia de Mississippi compatible con 'REAL ID' se distingue por
    ¿qué símbolo en la esquina superior derecha?
  choices:
    A: Un ancla azul
    B: Una estrella dorada
    C: Una 'X' roja
    D: El sello del estado
  answer: B
  explanation: Las licencias de Mississippi compatibles con REAL ID presentan una
    estrella dorada en la esquina superior derecha, lo que indica que la licencia
    cumple con los estándares de seguridad federales para abordar aeronaves.
- id: 23
  category: license_system
  question: Al solicitar una licencia de conducir original de Mississippi, ¿qué documento
    se requiere para verificar su Número de Seguro Social (SSN)?
  choices:
    A: Una nota escrita a mano de uno de los padres
    B: Una tarjeta de Seguro Social original o un formulario W-2
    C: Una tarjeta de identificación escolar
    D: An acta de nacimiento
  answer: B
  explanation: Mississippi requiere una prueba del Número de Seguro Social, que puede
    verificarse mediante una tarjeta de Seguro Social original, un formulario W-2
    o un formulario 1099.
- id: 24
  category: license_system
  question: 'Para obtener un endoso de Clase M (Motocicleta) en Mississippi, el solicitante
    debe:'
  choices:
    A: Tener al menos 21 años de edad
    B: Poseer una licencia Clase R válida y aprobar un examen de conocimientos y habilidades
      para motocicletas
    C: Solo pagar una tarifa adicional de $20
    D: Presentar un comprobante de propiedad de una motocicleta
  answer: B
  explanation: Un endoso de Clase M requiere aprobar un examen escrito específico
    para motocicletas y una prueba de habilidades (carretera), además de poseer una
    licencia estándar.
- id: 25
  category: license_system
  question: 'Al realizar el examen de habilidades de conducción en Mississippi, el
    vehículo utilizado para la prueba debe:'
  choices:
    A: Ser proporcionado por el Departamento de Seguridad Pública
    B: Ser un vehículo de modelo reciente (menos de 5 años de antigüedad)
    C: Tener una placa de matrícula válida y comprobante de seguro
    D: Tener frenos duales para el examinador
  answer: C
  explanation: Los solicitantes deben proporcionar su propio vehículo para el examen
    de carretera, y este debe estar debidamente registrado con una placa válida y
    contar con un seguro de responsabilidad civil vigente.
- id: 26
  category: license_system
  question: ¿Con cuánta anticipación puede un conductor de Mississippi renovar su
    licencia de conducir antes de la fecha de vencimiento?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Mississippi permite a los conductores renovar su licencia hasta 6 meses
    (180 días) antes de la fecha de vencimiento.
- id: 27
  category: license_system
  question: 'Bajo la Ley de Consentimiento Implícito (Implied Consent Law) de Mississippi,
    si se niega a someterse a una prueba química de aliento por primera vez, su licencia
    será suspendida por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: De acuerdo con el Código de MS § 63-11-5, la primera negativa a realizar
    una prueba de aliento resulta en una suspensión inmediata de la licencia por 90
    días.
- id: 28
  category: license_system
  question: 'La ley de ''Registro de Votantes'' (Motor Voter) de Mississippi le permite
    registrarse para votar cuando solicita o renueva su licencia de conducir, siempre
    que tenga al menos:'
  choices:
    A: 16 años de edad
    B: 17 años de edad (si cumplirá 18 para la próxima elección)
    C: 18 años de edad
    D: 21 años de edad
  answer: C
  explanation: Bajo la Ley Nacional de Registro de Votantes, los residentes de Mississippi
    pueden registrarse para votar en el DPS si tienen 18 años de edad o más.
- id: 29
  category: license_system
  question: Si desea ser donante de órganos, puede indicarlo en su licencia de conducir
    de Mississippi. ¿A qué edad esta designación se vuelve legalmente vinculante sin
    el consentimiento de los padres?
  choices:
    A: 15 años de edad
    B: 16 años de edad
    C: 18 años de edad
    D: 21 años de edad
  answer: C
  explanation: Aunque los menores pueden tener la designación de donante de órganos
    en su licencia, esta se convierte en un documento legalmente vinculante bajo la
    Ley Uniforme de Donaciones Anatómicas una vez que la persona cumple 18 años.
- id: 30
  category: driver_testing
  question: En Mississippi, ¿cuál es el límite legal de concentración de alcohol en
    sangre (BAC) para un conductor menor de 21 años?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: Mississippi tiene una política de 'Tolerancia Cero' para menores; el
    límite legal de BAC para conductores menores de 21 años es de 0.02%.
- id: 31
  category: driver_testing
  question: ¿Al prepararse para dar una vuelta en Mississippi, debe señalizar su intención
    continuamente durante al menos cuántos pies antes de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Mississippi exige que los conductores señalicen un giro continuamente
    durante al menos 100 pies antes de realizar la vuelta.
- id: 32
  category: driver_testing
  question: En Mississippi, ¿es ilegal estacionar su vehículo a menos de cuántos pies
    de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Mississippi prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 33
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    para vehículos de pasajeros en las autopistas interestatales de Mississippi?
  choices:
    A: 60 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: El límite de velocidad máximo en las autopistas interestatales de Mississippi
    es de 70 mph, a menos que se indique lo contrario.
- id: 34
  category: driver_testing
  question: Si se ve involucrado en un accidente en Mississippi que resulte en lesiones,
    muerte o daños a la propiedad que superen los ______, debe presentar un informe
    por escrito (SR-1) ante el Departamento de Seguridad Pública.
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: B
  explanation: La ley de Mississippi exige que se presente un informe SR-1 si un accidente
    resulta en daños totales a la propiedad de una persona que superen los $500 o
    cualquier lesión corporal o muerte.
- id: 35
  category: driver_testing
  question: 'Para mantener una distancia de seguimiento segura en condiciones normales,
    el Manual del Conductor de Mississippi sugiere seguir al vehículo de adelante
    por al menos:'
  choices:
    A: El largo de un vehículo por cada 10 mph de velocidad
    B: El largo de dos vehículos por cada 10 mph de velocidad
    C: 50 pies independientemente de la velocidad
    D: El largo de un vehículo por cada 20 mph de velocidad
  answer: A
  explanation: El Manual del Conductor de Mississippi recomienda una distancia de
    seguimiento de al menos el largo de un vehículo por cada 10 millas por hora de
    velocidad.
- id: 36
  category: driver_testing
  question: 'En Mississippi, la ley le exige encender los faros delanteros cuando
    la visibilidad es inferior a:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Mississippi exige que los faros estén encendidos desde el
    atardecer hasta el amanecer y siempre que la visibilidad sea inferior a 500 pies
    debido al clima u otras condiciones.
- id: 37
  category: driver_testing
  question: Cuando un autobús escolar se detiene en una carretera de cuatro carriles
    dividida por una franja central (mediana), ¿qué tráfico está obligado a detenerse?
  choices:
    A: El tráfico en todos los carriles debe detenerse
    B: Solo el tráfico que sigue al autobús debe detenerse
    C: Solo el tráfico en los carriles en sentido contrario debe detenerse
    D: No se requiere que el tráfico se detenga si hay una franja central
  answer: B
  explanation: En una carretera dividida por una franja central, solo el tráfico que
    sigue al autobús escolar está obligado a detenerse. El tráfico en los carriles
    en sentido contrario (separados por la mediana) puede continuar con precaución.
- id: 38
  category: driver_testing
  question: ¿Cuál es el rango de la multa por una condena de primera ofensa por tirar
    basura en las carreteras de Mississippi?
  choices:
    A: $10 a $50
    B: $50 a $250
    C: $100 a $500
    D: $500 a $1,000
  answer: B
  explanation: Según la ley de Mississippi, una persona declarada culpable de tirar
    basura puede ser multada con no menos de $50 ni más de $250.
- id: 39
  category: driver_testing
  question: ¿A cuántos pies de un vehículo que viene en sentido contrario debe bajar
    las luces altas de sus faros?
  choices:
    A: 250 pies
    B: 350 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Mississippi exige que los conductores bajen las luces altas
    cuando un vehículo que viene en sentido contrario se encuentra a menos de 500
    pies.
- id: 40
  category: driver_testing
  question: Al estacionar un vehículo cuesta abajo en una calle de doble sentido con
    acera (bordillo), ¿cómo deben colocarse las ruedas delanteras?
  choices:
    A: Giradas hacia la acera
    B: Giradas en dirección contraria a la acera
    C: Paralelas a la acera
    D: No importa, siempre que el freno de mano esté puesto
  answer: A
  explanation: Al estacionar cuesta abajo con acera, debe girar las ruedas hacia la
    acera para que el vehículo ruede hacia ella si fallan los frenos.
- id: 41
  category: driver_testing
  question: La "Ley de Moverse a un Lado" (Move Over Law) de Mississippi exige que
    los conductores se muevan al carril no adyacente o reduzcan la velocidad al acercarse
    a ¿cuál de los siguientes en el acotamiento?
  choices:
    A: Solo patrullas de policía
    B: Solo camiones de bomberos y ambulancias
    C: Cualquier vehículo autorizado con luces intermitentes (emergencia, servicios
      públicos o de recuperación)
    D: Solo vehículos de entrega de correo
  answer: C
  explanation: La Ley de Moverse a un Lado de Mississippi se aplica a todos los vehículos
    de emergencia autorizados, incluidos los de policía, bomberos, ambulancias, vehículos
    de servicios públicos y vehículos de recuperación (grúas) que utilicen luces intermitentes.
- id: 42
  category: driver_testing
  question: 'Una condena por primera ofensa de DUI (conducir bajo los efectos del
    alcohol o drogas) en Mississippi puede resultar en una sentencia de cárcel de
    hasta:'
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 1 semana
  answer: B
  explanation: Por una primera ofensa de DUI en Mississippi, una persona puede ser
    encarcelada en la cárcel del condado por hasta 48 horas.
- id: 43
  category: driver_testing
  question: En Mississippi, ¿cuál es el límite de velocidad máximo para automóviles
    y camiones en las autopistas interestatales, a menos que se indique lo contrario?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: B
  explanation: Según el Manual del Conductor de Mississippi, el límite de velocidad
    máximo para automóviles y camiones en las autopistas interestatales es de 70 mph,
    a menos que se indique lo contrario.
- id: 44
  category: driver_testing
  question: Según la ley de Mississippi, ¿con cuánta anticipación debe señalizar su
    intención de girar?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: La ley de Mississippi exige que los conductores activen una señal de
    giro continua durante al menos 100 pies antes de realizar un giro.
- id: 45
  category: driver_testing
  question: 'En Mississippi, debe presentar un informe de accidente ante el Departamento
    de Seguridad Pública si los daños a la propiedad de cualquier persona superan
    los:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: La ley de Mississippi exige que se presente un informe de accidente
    si hay lesiones, muerte o daños a la propiedad que superen los $500.
- id: 46
  category: driver_testing
  question: 'Al conducir en Mississippi, debe usar sus faros delanteros desde el atardecer
    hasta el amanecer y siempre que la visibilidad sea inferior a:'
  choices:
    A: 300 pies
    B: 400 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Mississippi exige que los faros delanteros estén encendidos
    entre el atardecer y el amanecer, o cuando la visibilidad se reduzca a menos de
    500 pies.
- id: 47
  category: driver_testing
  question: En Mississippi, se le prohíbe rebasar a otro vehículo cuando se encuentre
    a menos de ¿cuántos pies de una intersección o cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Según el Manual del Conductor de Mississippi, no debe rebasar a otro
    vehículo a menos de 100 pies de una intersección, cruce de ferrocarril, puente,
    viaducto o túnel.
- id: 48
  category: driver_testing
  question: 'Al encontrarse con un vehículo que viene en dirección opuesta por la
    noche en Mississippi, debe atenuar sus luces altas cuando el vehículo esté a menos
    de:'
  choices:
    A: 250 pies
    B: 350 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Mississippi exige que los conductores atenúen sus luces altas
    cuando un vehículo que viene en dirección opuesta se encuentre a menos de 500
    pies.
- id: 49
  category: driver_testing
  question: En Mississippi, ¿cuándo NO es obligatorio detenerse ante un autobús escolar
    con luces rojas intermitentes y un brazo de parada extendido?
  choices:
    A: Cuando el autobús está en una carretera de dos carriles
    B: Cuando viaja en la dirección opuesta en una carretera dividida por una mediana
      o barrera
    C: Cuando viaja en la dirección opuesta en una carretera de cuatro carriles sin
      mediana
    D: Siempre debe detenerse ante un autobús escolar independientemente del tipo
      de carretera
  answer: B
  explanation: En Mississippi, no tiene que detenerse ante un autobús escolar si se
    encuentra en una carretera dividida con una franja mediana o una barrera física
    y viaja en la dirección opuesta al autobús.
- id: 50
  category: driver_testing
  question: Según la ley de Mississippi, ¿cuál es el límite de velocidad máximo para
    un autobús escolar mientras transporta niños en una carretera federal (US) o estatal?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: La ley de Mississippi establece el límite de velocidad máximo para
    los autobuses escolares en 45 mph en carreteras, a menos que circulen por una
    interestatal, donde el límite es de 50 mph.
- id: 51
  category: driver_testing
  question: En Mississippi, si es condenado por una primera ofensa de DUI (conducir
    bajo la influencia), ¿qué programa se le requerirá asistir y completar?
  choices:
    A: Programa de Educación sobre Seguridad con el Alcohol de Mississippi (MASEP)
    B: Manejo Defensivo del Consejo Nacional de Seguridad
    C: Escuela de Mejoramiento para Conductores de Mississippi
    D: Solo el Panel de Impacto en las Víctimas de MADD
  answer: A
  explanation: Una condena por primera ofensa de DUI en Mississippi requiere completar
    el Programa de Educación sobre Seguridad con el Alcohol de Mississippi (MASEP).
- id: 52
  category: driver_testing
  question: Al estacionarse en paralelo en Mississippi, ¿a cuántas pulgadas del bordillo
    (curb) deben estar sus ruedas derechas?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: El Manual del Conductor de Mississippi establece que al estacionarse
    en paralelo, sus ruedas deben estar a menos de 12 pulgadas del bordillo.
- id: 53
  category: driver_responsibility
  question: Si un oficial de la ley no investiga su accidente, ¿cuántos días tiene
    para presentar un informe por escrito (SR-1) ante el Departamento de Seguridad
    Pública de Mississippi?
  choices:
    A: 3 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: La ley de Mississippi exige que los conductores presenten un informe
    por escrito de un accidente que califique dentro de los 10 días si un oficial
    de la ley no presentó un informe.
- id: 54
  category: driver_responsibility
  question: Cuando un nuevo residente se muda a Mississippi, ¿dentro de cuántos días
    debe obtener una placa de matrícula (registro) de Mississippi para su vehículo?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes deben registrar sus vehículos y obtener las placas
    de matrícula de Mississippi dentro de los 30 días posteriores al establecimiento
    de la residencia.
- id: 55
  category: driver_responsibility
  question: 'Bajo la Ley de Consentimiento Implícito de Mississippi, al operar un
    vehículo motorizado en las carreteras públicas, usted ha dado su consentimiento
    para:'
  choices:
    A: Un registro del maletero de su vehículo
    B: Una prueba química de su aliento, sangre u orina para determinar la intoxicación
    C: Una revisión de sus registros telefónicos personales
    D: Una renovación obligatoria de la licencia por 12 meses
  answer: B
  explanation: La Ley de Consentimiento Implícito significa que al conducir por las
    carreteras de Mississippi, usted acepta someterse a pruebas químicas si un oficial
    de la ley tiene motivos razonables para creer que está conduciendo bajo la influencia.
- id: 56
  category: driver_responsibility
  question: 'La ley de Mississippi exige que los niños estén asegurados en un dispositivo
    de sujeción para niños (asiento de seguridad) si tienen:'
  choices:
    A: Menos de 2 años de edad
    B: Menos de 4 años de edad
    C: Menos de 6 años de edad
    D: Menos de 8 años de edad
  answer: B
  explanation: La ley de Mississippi exige que toda persona que transporte a un niño
    menor de 4 años proporcione protección al niño mediante el uso adecuado de un
    dispositivo de sujeción para niños.
- id: 57
  category: driver_responsibility
  question: 'En Mississippi, los niños de entre 4 y 7 años que midan menos de 4 pies
    y 9 pulgadas de alto y pesen menos de 65 libras deben usar:'
  choices:
    A: Un cinturón de seguridad estándar para adultos
    B: Un sistema de asiento elevador (booster seat) con posicionamiento de cinturón
    C: Solo el asiento del pasajero delantero
    D: Ninguna sujeción si están en el asiento trasero
  answer: B
  explanation: La ley de Mississippi exige que los niños de 4 a 7 años usen un asiento
    elevador (booster seat) si cumplen con los criterios de altura y peso (menos de
    4'9" y menos de 65 libras).
- id: 58
  category: driver_responsibility
  question: 'Si es condenado por un DUI que causó la muerte o lesiones graves a otra
    persona en Mississippi, el cargo es ''DUI Agravado'' y conlleva una sentencia
    de prisión de:'
  choices:
    A: 1 a 5 años
    B: 2 a 25 años
    C: 10 a 50 años
    D: Cadena perpetua
  answer: B
  explanation: El DUI agravado en Mississippi es un delito grave castigado con 2 a
    25 años en la penitenciaría estatal por cada muerte o lesión causada.
- id: 59
  category: driver_responsibility
  question: 'Si choca contra un vehículo estacionado y no puede encontrar al propietario,
    la ley de Mississippi le exige:'
  choices:
    A: Esperar en la escena durante al menos 2 horas
    B: Irse si no hay daños visibles
    C: Dejar un aviso por escrito con su nombre, dirección y una explicación en un
      lugar visible
    D: Informarlo solo si el daño parece ser superior a $1,000
  answer: C
  explanation: La ley de Mississippi exige que los conductores que choquen contra
    un vehículo desatendido localicen al propietario o dejen una nota con su información
    de contacto y notifiquen a la policía.
- id: 60
  category: driver_responsibility
  question: 'Si su licencia de conducir de Mississippi es suspendida por una violación
    de la Ley de Responsabilidad de Seguridad (falta de seguro), generalmente debe
    presentar una prueba de responsabilidad financiera (SR-22) durante:'
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 5 años
  answer: C
  explanation: Cuando se requiere una prueba de responsabilidad financiera para restablecer
    una licencia en Mississippi, generalmente debe mantenerse durante un período de
    3 años.
- id: 61
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la ley
    de cinturones de seguridad de Mississippi para vehículos de pasajeros?
  choices:
    A: Solo el conductor debe usar cinturón de seguridad
    B: Solo los pasajeros del asiento delantero deben usar cinturones de seguridad
    C: Solo los pasajeros menores de 18 años deben usar cinturones de seguridad
    D: El conductor y cada pasajero en el vehículo deben usar un cinturón de seguridad
  answer: D
  explanation: A partir de 2017, la ley de Mississippi exige que todos los ocupantes
    de un vehículo de pasajeros usen el cinturón de seguridad, independientemente
    de dónde estén sentados.
- id: 62
  category: driver_responsibility
  question: Si usted se ve involucrado en un accidente en Mississippi y se dicta una
    sentencia en su contra que no paga, ¿qué medida tomará el Departamento de Seguridad
    Pública?
  choices:
    A: Aumentar las tarifas de registro de su vehículo
    B: Suspender su licencia de conducir hasta que se cumpla con la sentencia
    C: Confiscar su vehículo inmediatamente
    D: Requerir que repita el examen de conducir cada mes
  answer: B
  explanation: Según la Ley de Responsabilidad de Seguridad (Safety Responsibility
    Act), si no cumple con una sentencia resultante de un accidente automovilístico
    dentro de los 60 días, su licencia será suspendida.
- id: 63
  category: driver_responsibility
  question: Si se ve involucrado en un accidente en Mississippi que requiere un informe
    por escrito, ¿cuántos días tiene para presentar el formulario SR-1 ante el Departamento
    de Seguridad Pública?
  choices:
    A: 2 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: La ley de Mississippi exige que los conductores presenten un informe
    de accidente (SR-1) dentro de los 10 días si el accidente cumple con los criterios
    de informe por lesiones, muerte o daños a la propiedad.
- id: 64
  category: driver_responsibility
  question: 'En Mississippi, si tiene 21 años de edad o más y se niega a someterse
    a una prueba química de aliento cuando lo solicita un oficial, sus privilegios
    de conducir serán suspendidos inmediatamente por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito (Implied Consent), la primera
    negativa a someterse a una prueba química resulta en una suspensión inmediata
    de 90 días de los privilegios de conducir.
- id: 65
  category: driver_responsibility
  question: Mississippi tiene una ley de 'Tolerancia Cero' para conductores menores
    de 21 años. ¿A qué nivel de Contenido de Alcohol en Sangre (BAC) se considera
    que un menor está conduciendo bajo la influencia?
  choices:
    A: 0.01% o más
    B: 0.02% o más
    C: 0.05% o más
    D: 0.08% o más
  answer: B
  explanation: Para los conductores menores de 21 años, la ley de Mississippi establece
    el límite legal de BAC en 0.02%.
- id: 66
  category: driver_responsibility
  question: 'Para los conductores de 21 años de edad o más, es ilegal operar un vehículo
    motorizado en Mississippi con un Contenido de Alcohol en Sangre (BAC) de:'
  choices:
    A: 0.02% o más
    B: 0.04% o más
    C: 0.08% o más
    D: 0.10% o más
  answer: C
  explanation: En Mississippi, el límite legal de BAC para conductores adultos (21
    años o más) es de 0.08%.
- id: 67
  category: driver_responsibility
  question: ¿Cuál es el Contenido de Alcohol en Sangre (BAC) máximo legal para una
    persona que opera un vehículo motorizado comercial en Mississippi?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Los conductores comerciales en Mississippi están sujetos a un estándar
    más estricto y se considera que conducen bajo la influencia (DUI) si su BAC es
    de 0.04% o más.
- id: 68
  category: driver_responsibility
  question: De acuerdo con la ley 'Move Over' de Mississippi, ¿qué debe hacer al acercarse
    a un vehículo de emergencia estacionado con sus luces intermitentes encendidas
    en una carretera con al menos cuatro carriles?
  choices:
    A: Detenerse por completo hasta que el vehículo se mueva
    B: Mantener la velocidad pero moverse al carril derecho
    C: Moverse al carril que no esté adyacente al vehículo de emergencia, si es seguro
      hacerlo
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley de Mississippi exige que los conductores se muevan al carril
    que no esté adyacente al vehículo de emergencia o que reduzcan la velocidad significativamente
    si cambiar de carril no es seguro.
- id: 69
  category: driver_responsibility
  question: 'En Mississippi, una persona condenada por arrojar basura en las carreteras
    estatales puede ser multada con una cantidad entre:'
  choices:
    A: $10 y $50
    B: $50 y $250
    C: $250 y $500
    D: $500 y $1,000
  answer: B
  explanation: La ley de Mississippi impone una multa de no menos de $50 y no más
    de $250 por arrojar basura en las carreteras públicas.
- id: 70
  category: driver_responsibility
  question: Según la ley de Mississippi, ¿quién es responsable de asegurar que todos
    los pasajeros menores de 15 años estén debidamente sujetos por un cinturón de
    seguridad o un asiento de seguridad para niños?
  choices:
    A: El pasajero mismo
    B: El padre del pasajero, incluso si no está en el auto
    C: El conductor del vehículo
    D: Nadie, es una elección personal
  answer: C
  explanation: El conductor es legalmente responsable de asegurar que todos los niños
    menores de 15 años estén debidamente abrochados, independientemente de dónde estén
    sentados en el vehículo.
- id: 71
  category: driver_responsibility
  question: La ley de Mississippi exige que el polarizado de las ventanas de un vehículo
    permita el paso de al menos ¿qué porcentaje de luz?
  choices:
    A: 20%
    B: 28%
    C: 35%
    D: 50%
  answer: B
  explanation: La ley de Mississippi (Código de MS 63-7-59) exige que el polarizado
    de las ventanas laterales y traseras debe tener una transmitancia de luz del 28%
    o más.
- id: 72
  category: driver_responsibility
  question: En Mississippi, su licencia de conducir puede ser suspendida por ¿cuál
    de los siguientes motivos no relacionados con la conducción?
  choices:
    A: Falta de pago de la manutención infantil
    B: No graduarse de la escuela secundaria
    C: No votar en una elección general
    D: No mantener una tarjeta de biblioteca
  answer: A
  explanation: La ley de Mississippi permite la suspensión de una licencia de conducir
    por el incumplimiento del pago de la manutención infantil ordenada por un tribunal.
- id: 73
  category: driver_responsibility
  question: ¿Cuál es la multa mínima por una primera condena por estacionarse ilegalmente
    en un espacio designado para personas con discapacidades en Mississippi?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: En Mississippi, la multa mínima por estacionarse ilegalmente en un
    espacio accesible para personas con discapacidad es de $200.
- id: 74
  category: driver_responsibility
  question: 'Si su licencia es suspendida por un DUI (conducir bajo la influencia)
    o por una violación de la Ley de Responsabilidad Financiera, es posible que se
    le exija mantener un certificado de seguro SR-22 por un período de:'
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: Mississippi generalmente requiere que los conductores mantengan un
    SR-22 (prueba de responsabilidad financiera) durante 3 años después de una suspensión
    por DUI o falta de seguro.
- id: 75
  category: safe_driving_rules
  question: Cuando tenga la intención de girar, la ley de Mississippi le exige señalizar
    continuamente durante al menos ¿cuántos pies antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Mississippi exige que los conductores señalicen su intención
    de girar durante al menos 100 pies antes de realizar el giro.
- id: 76
  category: safe_driving_rules
  question: La ley de Mississippi prohíbe rebasar a otro vehículo cuando se encuentre
    a menos de ¿cuántos pies de cualquier puente, viaducto o túnel?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: No se puede rebasar a otro vehículo cuando se aproxime a menos de 100
    pies de cualquier puente, viaducto o túnel donde la vista esté obstruida.
- id: 77
  category: safe_driving_rules
  question: 'El Manual del Conductor de Mississippi recomienda seguir al vehículo
    que va delante de usted a una distancia de al menos:'
  choices:
    A: La longitud de un vehículo por cada 10 mph de velocidad
    B: La longitud de dos vehículos por cada 10 mph de velocidad
    C: Exactamente 50 pies independientemente de la velocidad
    D: La longitud de un vehículo por cada 20 mph de velocidad
  answer: A
  explanation: El Manual del Conductor de Mississippi sugiere una distancia de seguimiento
    segura de la longitud de un vehículo por cada 10 millas por hora (mph) de velocidad.
- id: 78
  category: safe_driving_rules
  question: Al encontrarse con un autobús escolar con luces rojas intermitentes en
    una carretera dividida con una franja central (mediana), ¿qué debe hacer un conductor
    que viaja en la dirección opuesta?
  choices:
    A: Detenerse hasta que las luces dejen de parpadear
    B: Reducir la velocidad a 15 mph y proceder con precaución
    C: No está obligado a detenerse
    D: Detenerse solo si hay niños cruzando la franja central
  answer: C
  explanation: En Mississippi, si viaja por una carretera dividida con una franja
    central o una barrera, no está obligado a detenerse ante un autobús escolar que
    viaja en la dirección opuesta.
- id: 79
  category: safe_driving_rules
  question: Al seguir a otro vehículo por la noche en Mississippi, debe atenuar sus
    luces altas cuando se encuentre a menos de ¿cuántos pies del vehículo que va delante?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: C
  explanation: La ley de Mississippi exige que los conductores atenúen sus luces altas
    cuando sigan a otro vehículo a una distancia de 500 pies o menos.
- id: 80
  category: safe_driving_rules
  question: En una parada de cuatro vías en Mississippi, si dos vehículos llegan a
    la intersección al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que está girando a la derecha
    D: El conductor en la carretera más transitada
  answer: B
  explanation: Según las reglas de derecho de paso de Mississippi, si dos vehículos
    llegan a una intersección al mismo tiempo, el conductor de la izquierda debe ceder
    el paso al conductor de la derecha.
- id: 81
  category: safe_driving_rules
  question: 'Bajo la Ley de Tolerancia Cero de Mississippi, se considera que una persona
    menor de 21 años está conduciendo bajo la influencia si su concentración de alcohol
    en sangre (BAC) es igual o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: La Ley de Tolerancia Cero de Mississippi establece el límite legal
    de BAC para conductores menores de 21 años en 0.02%.
- id: 82
  category: safe_driving_rules
  question: ¿En Mississippi, a qué velocidad puede comenzar el hidroplaneo (los neumáticos
    pierden contacto con la carretera debido al agua)?
  choices:
    A: 25 mph
    B: 35 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: El Manual del Conductor de Mississippi establece que el hidroplaneo
    puede comenzar a velocidades tan bajas como 35 mph bajo lluvia intensa.
- id: 83
  category: safe_driving_rules
  question: Según el Manual del Conductor de Mississippi, ¿cuál es la distancia de
    seguimiento recomendada detrás del vehículo que va delante de usted?
  choices:
    A: La longitud de un vehículo por cada 10 millas por hora de velocidad
    B: La longitud de dos vehículos independientemente de la velocidad
    C: 50 pies en todo momento
    D: La longitud de un vehículo por cada 20 millas por hora de velocidad
  answer: A
  explanation: El manual de Mississippi sugiere una distancia de seguimiento de la
    longitud de un vehículo por cada 10 millas por hora de velocidad para permitir
    un frenado seguro.
- id: 84
  category: safe_driving_rules
  question: ¿En Mississippi, cuándo es legal rebasar a un autobús escolar que está
    detenido en una carretera dividida con una mediana o barrera entre las calzadas?
  choices:
    A: Nunca, siempre debe detenerse
    B: Solo si el conductor del autobús le indica que pase
    C: Solo si viaja en la dirección opuesta al autobús
    D: Solo si viaja en la misma dirección que el autobús
  answer: C
  explanation: En una carretera dividida con una franja mediana o barrera física,
    no es necesario detenerse ante un autobús escolar si viaja en la dirección opuesta.
- id: 85
  category: safe_driving_rules
  question: ¿En Mississippi, a cuántos pies de una señal de alto no debe estacionar
    su vehículo?
  choices:
    A: 10 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Mississippi prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico ubicada al costado
    de una carretera.
- id: 86
  category: safe_driving_rules
  question: Cuando dos vehículos entran en una intersección desde diferentes carreteras
    aproximadamente al mismo tiempo, ¿qué conductor tiene el derecho de paso en Mississippi?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a una velocidad mayor
    D: El conductor del vehículo más grande
  answer: B
  explanation: Cuando dos vehículos llegan a una intersección al mismo tiempo, el
    conductor del vehículo de la izquierda debe ceder el derecho de paso al vehículo
    de la derecha.
- id: 87
  category: safe_driving_rules
  question: Al girar a la derecha desde una calle de un solo sentido hacia otra calle
    de un solo sentido, ¿desde qué carril debe girar?
  choices:
    A: El carril central
    B: El carril más cercano a la acera izquierda
    C: El carril más cercano a la acera derecha
    D: Cualquier carril disponible
  answer: C
  explanation: Para realizar un giro a la derecha, debe moverse al carril más cercano
    a la acera derecha y completar el giro en el carril derecho de la nueva calle.
- id: 88
  category: defensive_driving
  question: ¿En Mississippi, a qué velocidad puede comenzar el hidroplaneo, haciendo
    que sus neumáticos pierdan contacto con la superficie de la carretera durante
    una lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    Bajo una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 89
  category: defensive_driving
  question: 'La ley de Mississippi exige que los automovilistas enciendan sus faros
    delanteros siempre que utilicen:'
  choices:
    A: Control de crucero
    B: Limpiaparabrisas
    C: Luces de emergencia
    D: Aire acondicionado
  answer: B
  explanation: Según la ley de Mississippi (Código MS § 63-7-11), los faros delanteros
    deben encenderse siempre que se utilicen los limpiaparabrisas debido a precipitaciones
    o condiciones atmosféricas desfavorables.
- id: 90
  category: defensive_driving
  question: 'Para evitar frenazos de último momento o la necesidad de girar repentinamente,
    los conductores de Mississippi deben mirar hacia adelante al menos:'
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 15 segundos
    C: De 20 a 25 segundos
    D: De 30 a 40 segundos
  answer: B
  explanation: La conducción defensiva en Mississippi implica escanear la carretera
    de 10 a 15 segundos por delante para identificar posibles peligros a tiempo.
- id: 91
  category: defensive_driving
  question: Al conducir con niebla densa en Mississippi, ¿qué luces debe utilizar
    para garantizar la máxima visibilidad y seguridad?
  choices:
    A: Luces altas (luces de carretera)
    B: Luces bajas (luces de cruce)
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia
  answer: B
  explanation: Se deben utilizar las luces bajas en condiciones de niebla. Las luces
    altas se reflejan en la humedad de la niebla, lo que provoca deslumbramiento y
    dificulta la visión.
- id: 92
  category: defensive_driving
  question: 'La ley ''Move Over'' (hacerse a un lado) de Mississippi exige que los
    conductores que se aproximen a un vehículo de emergencia detenido con luces intermitentes
    deban:'
  choices:
    A: Detenerse por completo hasta que se les indique que pueden pasar
    B: Mantener la velocidad pero tocar la bocina
    C: Cambiarse al carril más alejado del vehículo de emergencia si es seguro hacerlo
    D: Aumentar la velocidad para despejar el área rápidamente
  answer: C
  explanation: La ley 'Move Over' exige que los conductores dejen libre el carril
    más cercano a los vehículos de emergencia detenidos o que reduzcan la velocidad
    si no es seguro cambiar de carril.
- id: 93
  category: defensive_driving
  question: ¿Cuál es la sanción en Mississippi por exceso de velocidad en una zona
    de obras viales cuando hay trabajadores presentes?
  choices:
    A: Solo una advertencia verbal
    B: Las multas se duplican
    C: Suspensión obligatoria de la licencia por 30 días
    D: Las multas se triplican
  answer: B
  explanation: La ley de Mississippi establece que las multas por infracciones de
    exceso de velocidad se duplican cuando se cometen en una zona de obras designada
    donde hay trabajadores presentes.
- id: 94
  category: defensive_driving
  question: Al acercarse a un cruce de ferrocarril en Mississippi con las barreras
    bajadas o luces intermitentes, ¿a cuántos pies del riel más cercano debe detener
    su vehículo?
  choices:
    A: Entre 5 y 25 pies
    B: Entre 10 y 30 pies
    C: Entre 15 y 50 pies
    D: Exactamente 20 pies
  answer: C
  explanation: La ley de Mississippi exige que los conductores se detengan a una distancia
    de entre 15 y 50 pies del riel más cercano en un cruce de ferrocarril cuando las
    señales indican que se aproxima un tren.
- id: 95
  category: defensive_driving
  question: 'Al rebasar a otro vehículo en una carretera de dos carriles en Mississippi,
    no debe regresar a su carril hasta que:'
  choices:
    A: Esté a la distancia de un vehículo por delante
    B: Pueda ver toda la parte delantera del vehículo rebasado en su espejo retrovisor
    C: Haya señalizado durante al menos 5 segundos
    D: El otro conductor parpadee sus luces delanteras
  answer: B
  explanation: Por seguridad, solo debe regresar al carril derecho una vez que pueda
    ver los faros delanteros o toda la parte frontal del vehículo que acaba de rebasar
    en su espejo retrovisor.
- id: 96
  category: defensive_driving
  question: Al seguir a otro vehículo por la noche en Mississippi, ¿a qué distancia
    debe atenuar sus luces altas (cambiar a luces bajas)?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: Ninguna; se permiten luces altas al seguir a otro vehículo
  answer: B
  explanation: Según la ley de Mississippi, debe atenuar sus luces altas cuando siga
    a otro vehículo a una distancia de 250 pies para evitar reflejar el resplandor
    en el espejo retrovisor del otro conductor.
- id: 97
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (cuando los neumáticos
    pierden contacto con la carretera y se deslizan sobre una fina capa de agua) en
    condiciones de lluvia en Mississippi?
  choices:
    A: A partir de las 35 mph
    B: Solo por encima de las 55 mph
    C: Solo por encima de las 70 mph
    D: Exactamente a las 45 mph
  answer: A
  explanation: El Manual del Conductor de Mississippi establece que el hidroplaneo
    puede comenzar a velocidades tan bajas como 35 mph, y a 55 mph, los neumáticos
    pueden perder todo contacto con la carretera.
- id: 98
  category: defensive_driving
  question: Para ser un conductor defensivo en Mississippi, ¿con cuánta antelación
    debe observar el camino para identificar posibles peligros?
  choices:
    A: 5 segundos hacia adelante
    B: De 10 a 15 segundos hacia adelante
    C: 30 segundos hacia adelante
    D: Solo el vehículo que tiene inmediatamente delante
  answer: B
  explanation: La conducción defensiva implica explorar la carretera de 10 a 15 segundos
    hacia adelante para identificar y reaccionar ante posibles peligros antes de que
    se vuelvan peligrosos.
- id: 99
  category: defensive_driving
  question: Al conducir con niebla densa en Mississippi, ¿qué juego de luces debe
    utilizar?
  choices:
    A: Luces altas
    B: Solo luces de estacionamiento
    C: Luces bajas
    D: Solo luces de emergencia
  answer: C
  explanation: Se deben utilizar las luces bajas en la niebla. Las luces altas se
    reflejan en la niebla y crean un resplandor que dificulta la visión.
- id: 100
  category: defensive_driving
  question: 'Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS)
    y necesita detenerse rápidamente en una carretera resbaladiza de Mississippi,
    debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante al pedal del freno
    C: Presionar los frenos ligeramente
    D: Cambiar a punto muerto (neutral) y usar el freno de emergencia
  answer: B
  explanation: Con el sistema ABS, debe aplicar una presión firme y constante. Bombear
    los frenos es para vehículos más antiguos sin ABS; hacerlo con ABS anula el propósito
    del sistema.
- id: 101
  category: defensive_driving
  question: ¿A cuántos pies de distancia, como mínimo, debe detenerse al acercarse
    a un autobús escolar que se ha detenido para subir o bajar niños en una carretera
    de dos carriles en Mississippi?
  choices:
    A: 5 pies
    B: 10 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: La ley de Mississippi exige que los conductores se detengan al menos
    a 10 pies de distancia de un autobús escolar cuando este esté subiendo o bajando
    pasajeros.
- id: 102
  category: defensive_driving
  question: Al estacionar un vehículo cuesta arriba en una calle de doble sentido
    con acera (bordillo) en Mississippi, ¿hacia dónde debe girar las ruedas?
  choices:
    A: Hacia la derecha (hacia la acera)
    B: Hacia la izquierda (lejos de la acera)
    C: Mantenerlas rectas
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba con acera, gire las ruedas hacia la izquierda
    para que, si el vehículo rueda, la parte trasera de la llanta delantera golpee
    la acera y detenga el automóvil.
- id: 103
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de "Consentimiento Implícito" (Implied Consent)
    de Mississippi para los automovilistas?
  choices:
    A: Usted consiente el registro de su vehículo en cualquier momento.
    B: Usted acepta someterse a una prueba química de alcohol o drogas si lo solicita
      un oficial.
    C: Usted acepta portar al menos $25,000 en seguro de responsabilidad civil.
    D: Usted acepta que se le revoque la licencia si se ve involucrado en cualquier
      accidente.
  answer: B
  explanation: La ley de Consentimiento Implícito significa que, al operar un vehículo
    motorizado en las vías públicas de Mississippi, usted ha dado su consentimiento
    para una prueba química (aliento, sangre u orina) para determinar la intoxicación.
- id: 104
  category: alcohol_drugs_health
  question: 'Si un conductor de Mississippi se niega a someterse a una prueba química
    de aliento a petición de un oficial de la ley, su licencia será confiscada de
    inmediato y suspendida por un período de:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito, si se niega a la prueba, el
    oficial confiscará su licencia y sus privilegios de conducción serán suspendidos
    por 90 días por una primera infracción.
- id: 105
  category: alcohol_drugs_health
  question: ¿Qué programa obligatorio debe completar una persona condenada por un
    primer DUI en Mississippi para recuperar sus privilegios de conducción?
  choices:
    A: El Curso de Mejoramiento para Conductores de Mississippi
    B: El Programa de Educación sobre Seguridad con el Alcohol de Mississippi (MASEP)
    C: El Curso de Conducción Defensiva del Consejo Nacional de Seguridad
    D: Un programa de 40 horas de servicio comunitario
  answer: B
  explanation: La ley de Mississippi exige que los infractores de DUI por primera
    vez completen el Programa de Educación sobre Seguridad con el Alcohol de Mississippi
    (MASEP).
- id: 106
  category: alcohol_drugs_health
  question: 'En Mississippi, una segunda condena por DUI dentro de un período de cinco
    años resultará en una suspensión de la licencia de:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Una segunda condena por DUI dentro de cinco años resulta en una suspensión
    obligatoria de la licencia por un año y un mínimo de cinco días en la cárcel.
- id: 107
  category: alcohol_drugs_health
  question: 'Una tercera condena por DUI dentro de un período de cinco años en Mississippi
    se clasifica como:'
  choices:
    A: Delito menor de Clase C
    B: Delito menor de Clase A
    C: Delito grave (Felony)
    D: Infracción administrativa
  answer: C
  explanation: En Mississippi, una tercera condena por DUI dentro de cinco años es
    un delito grave (felony), castigado con 1 a 5 años en la penitenciaría estatal.
- id: 108
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados y necesita conducir, ¿cuál es la
    mejor forma de actuar?
  choices:
    A: Conducir solo si se siente bien.
    B: Revisar la etiqueta para ver las advertencias o preguntar a su médico sobre
      los efectos secundarios.
    C: Beber café para contrarrestar cualquier somnolencia.
    D: Conducir más lento que el límite de velocidad establecido.
  answer: B
  explanation: Muchos medicamentos recetados y de venta libre pueden afectar la conducción.
    Usted es legalmente responsable de su conducción incluso si el medicamento es
    recetado por un médico.
- id: 109
  category: alcohol_drugs_health
  question: ¿Cuál es la primera capacidad física o mental que se ve afectada por el
    consumo de alcohol?
  choices:
    A: La visión
    B: La coordinación muscular
    C: El juicio
    D: La audición
  answer: C
  explanation: El alcohol afecta primero el juicio y el autocontrol, lo que puede
    llevar a un conductor a correr riesgos que normalmente no tomaría.
- id: 110
  category: alcohol_drugs_health
  question: 'Combinar alcohol con otras drogas (como medicamentos para el resfriado
    o marihuana) generalmente resulta en:'
  choices:
    A: Que los efectos de cada uno se cancelen entre sí.
    B: Ningún cambio en la capacidad del conductor.
    C: Un efecto sinérgico, haciendo que el deterioro sea mucho peor que con cualquiera
      de ellos por separado.
    D: Un aumento de la alerta.
  answer: C
  explanation: Mezclar alcohol y drogas puede multiplicar los efectos de ambos, aumentando
    significativamente el deterioro y el riesgo de un choque.
- id: 111
  category: alcohol_drugs_health
  question: ¿En Mississippi, cuál es el límite de concentración de alcohol en la sangre
    (BAC) para un conductor que opera un vehículo motorizado comercial?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Según la ley de Mississippi y las regulaciones federales, el límite
    de BAC para los conductores comerciales (titulares de CDL) es del 0.04%.
- id: 112
  category: alcohol_drugs_health
  question: Si un conductor es condenado por un DUI que causó la muerte o lesiones
    graves a otra persona en Mississippi, podría enfrentar hasta ____ años de prisión.
  choices:
    A: 5 años
    B: 10 años
    C: 25 años
    D: 50 años
  answer: C
  explanation: El DUI agravado, que implica causar la muerte o lesiones graves mientras
    se conduce bajo la influencia, es un delito grave (felony) castigado con hasta
    25 años de prisión.
- id: 113
  category: alcohol_drugs_health
  question: Para evitar una suspensión total de la licencia de 90 días después de
    una primera ofensa de DUI, ¿qué dispositivo puede optar por instalar un conductor
    de Mississippi en su vehículo?
  choices:
    A: Un rastreador GPS
    B: Un dispositivo de interbloqueo de encendido (Ignition Interlock Device)
    C: Un regulador de velocidad
    D: Una cámara de tablero
  answer: B
  explanation: La ley de Mississippi permite que los infractores de DUI por primera
    vez conduzcan durante su período de suspensión si instalan un dispositivo de interbloqueo
    de encendido y obtienen una licencia restringida por interbloqueo.
- id: 114
  category: alcohol_drugs_health
  question: 'Si tiene una condición médica que pueda afectar su capacidad para conducir
    de manera segura, como la epilepsia, la ley de Mississippi le exige:'
  choices:
    A: Conducir solo durante las horas del día.
    B: Informar la condición al Departamento de Seguridad Pública (DPS) al solicitar
      una licencia.
    C: Mantener una nota del médico en la guantera en todo momento.
    D: Conducir solo con un adulto con licencia mayor de 21 años.
  answer: B
  explanation: Los solicitantes deben revelar condiciones físicas o mentales que podrían
    interferir con la conducción segura. El DPS puede requerir una evaluación médica
    para determinar si se puede emitir una licencia.
- id: 115
  category: alcohol_drugs_health
  question: Para una condena por DUI por primera vez en Mississippi, ¿cuál es el rango
    de la multa impuesta (excluyendo los costos judiciales)?
  choices:
    A: Sin multa, solo servicio comunitario
    B: $100 a $500
    C: $250 a $1,000
    D: $1,000 a $5,000
  answer: C
  explanation: Una condena por DUI por primera vez en Mississippi conlleva una multa
    que oscila entre $250 y $1,000.
- id: 116
  category: alcohol_drugs_health
  question: En Mississippi, ¿qué es 'MASEP'?
  choices:
    A: Un programa de seguro obligatorio para conductores de alto riesgo.
    B: El Programa de Educación sobre Seguridad con el Alcohol de Mississippi (MASEP),
      requerido para infractores de DUI por primera vez.
    C: Un examen médico requerido para conductores de edad avanzada.
    D: El sistema automatizado de control de velocidad del estado.
  answer: B
  explanation: MASEP es el Programa de Educación sobre Seguridad con el Alcohol de
    Mississippi. Generalmente se requiere completar este programa para que las personas
    condenadas por un DUI por primera vez recuperen sus privilegios de conducir.
- id: 117
  category: alcohol_drugs_health
  question: Bajo la ley de Tolerancia Cero (Zero Tolerance), ¿cuál es el período de
    suspensión de la licencia por una condena de primera ofensa para un conductor
    menor de 21 años?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Un DUI de Tolerancia Cero por primera vez para un conductor menor de
    21 años resulta en una suspensión de 90 días de los privilegios de conducir.
- id: 118
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado y este afecta su capacidad para
    conducir, ¿puede ser acusado de un DUI en Mississippi?
  choices:
    A: No, siempre que el medicamento haya sido recetado legalmente.
    B: No, las leyes de DUI solo se aplican a drogas ilegales y alcohol.
    C: Sí, si el medicamento lo incapacita para conducir de manera segura.
    D: Solo si también tiene alcohol en su sistema.
  answer: C
  explanation: La ley de Mississippi prohíbe conducir bajo la influencia de cualquier
    sustancia, legal o ilegal, que afecte su capacidad para operar un vehículo de
    manera segura.
- id: 119
  category: alcohol_drugs_health
  question: En Mississippi, se puede requerir un dispositivo de interbloqueo de encendido
    (IID) para que un conductor obtenga una licencia restringida después de un DUI.
    ¿Qué hace este dispositivo?
  choices:
    A: Rastrea la velocidad del vehículo a través de GPS.
    B: Evita que el vehículo arranque si detecta alcohol en el aliento del conductor.
    C: Llama automáticamente al 911 si ocurre un accidente.
    D: Limita la operación del vehículo solo a las horas del día.
  answer: B
  explanation: Un dispositivo de interbloqueo de encendido (IID) requiere que el conductor
    proporcione una muestra de aliento; si se detecta alcohol, el vehículo no arrancará.
- id: 120
  category: alcohol_drugs_health
  question: 'En Mississippi, un DUI que resulta en la muerte o lesiones graves de
    otra persona se clasifica como:'
  choices:
    A: Un delito menor (misdemeanor)
    B: DUI agravado (un delito grave o felony)
    C: Conducción negligente
    D: Una violación civil
  answer: B
  explanation: El DUI agravado es un delito grave (felony) en Mississippi y se aplica
    cuando una persona que conduce bajo la influencia causa la muerte o lesiones graves
    a otra persona.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única manera de reducir eficazmente su nivel
    de alcohol en sangre (BAC) y "recuperar la sobriedad" antes de conducir?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio o correr
    D: Permitir que pase el tiempo para que su cuerpo procese el alcohol
  answer: D
  explanation: El tiempo es el único factor que reducirá el nivel de alcohol en sangre
    (BAC). El café, las duchas y el ejercicio no aceleran el metabolismo del alcohol
    en el hígado.
- id: 122
  category: alcohol_drugs_health
  question: ¿Cuál es la sentencia mínima de cárcel por una segunda condena por conducir
    bajo los efectos del alcohol o drogas (DUI) dentro de un período de cinco años
    en Mississippi?
  choices:
    A: 24 horas
    B: 48 horas
    C: 5 días
    D: 30 días
  answer: C
  explanation: Una segunda condena por DUI dentro de los cinco años en Mississippi
    conlleva una sentencia mínima obligatoria de cárcel de 5 días (y hasta un año).
- id: 123
  category: alcohol_drugs_health
  question: 'Si tiene una afección médica como epilepsia o diabetes que pueda afectar
    su conducción, usted debe:'
  choices:
    A: Nunca conducir bajo ninguna circunstancia.
    B: Solo conducir con un pasajero que sea enfermero/a con licencia.
    C: Informar sobre la afección al Departamento de Seguridad Pública al solicitar
      una licencia.
    D: Solo conducir en calles residenciales.
  answer: C
  explanation: Los solicitantes deben informar sobre las afecciones físicas o mentales
    que podrían afectar su capacidad para conducir de manera segura. El Departamento
    de Seguridad Pública (DPS) puede requerir una declaración médica de un médico.
- id: 124
  category: alcohol_drugs_health
  question: Según la Ley de Consentimiento Implícito de Mississippi, ¿cuál de las
    siguientes pruebas puede solicitar un oficial de la ley para determinar el estado
    de embriaguez o incapacidad?
  choices:
    A: Solo prueba de aliento
    B: Solo prueba de sangre
    C: Solo prueba de orina
    D: Pruebas de aliento, sangre u orina
  answer: D
  explanation: La Ley de Consentimiento Implícito cubre las pruebas químicas del aliento,
    la sangre o la orina del conductor para determinar la presencia de alcohol u otras
    sustancias embriagantes.
- id: 125
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una condena de primera infracción por no
    detenerse ante un autobús escolar que está subiendo o bajando niños en Mississippi?
  choices:
    A: $100
    B: $250
    C: $350
    D: $500
  answer: C
  explanation: En Mississippi, la multa por una condena de primera infracción por
    rebasar ilegalmente a un autobús escolar detenido oscila entre $350 y $750.
- id: 126
  category: penalties_and_points
  question: En Mississippi, ¿cuál es la sanción civil (multa) para un conductor sorprendido
    usando un dispositivo móvil de mano para escribir, enviar o leer un mensaje de
    texto mientras opera un vehículo motorizado?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: La ley de Mississippi prohíbe enviar mensajes de texto mientras se
    conduce, y la sanción civil por una violación de esta ley es de $100.
- id: 127
  category: penalties_and_points
  question: Para una condena de primera infracción por DUI en Mississippi, ¿cuál es
    el tiempo máximo que un conductor puede ser sentenciado a la cárcel?
  choices:
    A: 24 horas
    B: 48 horas
    C: 7 días
    D: 30 días
  answer: B
  explanation: Una condena de primera infracción por DUI en Mississippi puede resultar
    en una sentencia de cárcel de hasta 48 horas, aunque un juez puede permitir que
    el conductor asista a un panel de impacto de víctimas en su lugar.
- id: 128
  category: penalties_and_points
  question: Mississippi no utiliza un sistema de puntos. En su lugar, el Comisionado
    de Seguridad Pública está autorizado a suspender una licencia si el conductor
    es un "infractor habitual". ¿Cómo se define esto típicamente?
  choices:
    A: 2 condenas por cualquier infracción en un plazo de 12 meses
    B: 3 o más condenas por infracciones de tránsito en movimiento en un plazo de
      12 meses
    C: 5 condenas por cualquier infracción en un plazo de 24 meses
    D: Cualquier multa por exceso de velocidad de más de 20 mph
  answer: B
  explanation: Aunque Mississippi no utiliza puntos, el Departamento de Seguridad
    Pública (DPS) puede suspender la licencia de un "infractor frecuente" que tenga
    3 o más condenas por infracciones de tránsito en movimiento en un período de 12
    meses.
- id: 129
  category: penalties_and_points
  question: 'Según la ley de Tolerancia Cero para conductores menores de 21 años,
    una condena de primera infracción por DUI resulta en una suspensión de la licencia
    de:'
  choices:
    A: 30 días
    B: 90 días
    C: 120 días
    D: 1 año
  answer: C
  explanation: Para los conductores menores de 21 años condenados por una primera
    infracción de DUI (Tolerancia Cero), el período de suspensión de la licencia es
    de 120 días.
- id: 130
  category: penalties_and_points
  question: En Mississippi, toda persona que transporte a un niño menor de ____ años
    es responsable de proporcionar protección al niño en un dispositivo de sujeción
    para niños pasajeros.
  choices:
    A: '2'
    B: '4'
    C: '6'
    D: '8'
  answer: B
  explanation: La ley de Mississippi exige que los niños menores de 4 años estén protegidos
    por un dispositivo de sujeción para niños pasajeros.
- id: 131
  category: penalties_and_points
  question: ¿Para recuperar los privilegios de conducir después de una suspensión
    por una primera infracción de DUI en Mississippi, cuánto tiempo se le puede exigir
    a un conductor que instale un dispositivo de interbloqueo de encendido?
  choices:
    A: 30 días
    B: 90 días
    C: 120 días
    D: 180 días
  answer: C
  explanation: Según la ley de interbloqueo de Mississippi, un infractor de DUI por
    primera vez puede estar obligado a tener un dispositivo de interbloqueo de encendido
    durante 120 días para mantener privilegios de conducción restringidos.
- id: 132
  category: penalties_and_points
  question: ¿Cuál es la tarifa específica de restablecimiento requerida para recuperar
    su licencia de conducir de Mississippi después de haber sido suspendida por una
    infracción de DUI?
  choices:
    A: $50
    B: $100
    C: $175
    D: $500
  answer: C
  explanation: La ley de Mississippi exige una tarifa de restablecimiento de $175
    para las licencias suspendidas debido a condenas por DUI o violaciones de la Ley
    de Consentimiento Implícito (Implied Consent).
- id: 133
  category: penalties_and_points
  question: 'Bajo la ley ''Move Over'' (Hacerse a un lado) de Mississippi, no ceder
    el paso a un vehículo de emergencia con luces intermitentes puede resultar en
    una multa de hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: No hacerse a un lado o no reducir la velocidad ante vehículos de emergencia
    en Mississippi puede resultar en una multa de hasta $250.
- id: 134
  category: penalties_and_points
  question: Si un conductor de Mississippi es detenido por sospecha de DUI y se niega
    a someterse a una prueba química de aliento, ¿cuál es la sanción inmediata bajo
    la Ley de Consentimiento Implícito (Implied Consent Law) por una primera infracción?
  choices:
    A: Una multa de $1,000
    B: Incautación de la licencia de conducir y una suspensión de 90 días
    C: 48 horas obligatorias en la cárcel
    D: Revocación permanente de la licencia de conducir
  answer: B
  explanation: Bajo la Ley de Consentimiento Implícito de Mississippi, la negativa
    a realizar una prueba química resulta en que el oficial retire su licencia y una
    suspensión de 90 días por una primera infracción.
- id: 135
  category: penalties_and_points
  question: Si un conductor de Mississippi es condenado por un segundo DUI dentro
    de un período de cinco años, ¿cuál es el período mínimo de suspensión de la licencia?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Una segunda condena por DUI dentro de los cinco años en Mississippi
    resulta en una suspensión de la licencia de un año.
- id: 136
  category: penalties_and_points
  question: Según la ley de Mississippi, ¿qué sucede con la licencia de un conductor
    si es condenado por un tercer DUI dentro de los cinco años?
  choices:
    A: Se suspende por 1 año
    B: Se suspende por 2 años
    C: Se revoca por la duración de la sentencia por delito grave (felony)
    D: Se suspende por 90 días
  answer: C
  explanation: Una tercera condena por DUI dentro de los cinco años es un delito grave
    (felony) en Mississippi, y la licencia se revoca por la duración de la sentencia.
- id: 137
  category: penalties_and_points
  question: ¿Cuál es la multa por no usar el cinturón de seguridad en Mississippi
    para un conductor o un pasajero del asiento delantero?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: La multa por una infracción del cinturón de seguridad en Mississippi
    es de $25.
- id: 138
  category: penalties_and_points
  question: 'En Mississippi, si se le condena por exceso de velocidad en una zona
    de obras viales cuando hay trabajadores presentes, la multa se:'
  choices:
    A: Incrementa en $100
    B: Duplica
    C: Triplica
    D: Reduce si asiste a una escuela de tráfico
  answer: B
  explanation: La ley de Mississippi exige que las multas por exceso de velocidad
    se dupliquen en las zonas de obras cuando hay trabajadores presentes.
- id: 139
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en la revocación obligatoria
    de una licencia de conducir de Mississippi?
  choices:
    A: Una sola multa por exceso de velocidad
    B: No pagar una multa de estacionamiento
    C: Cualquier delito grave (felony) en cuya comisión se utilice un vehículo motorizado
    D: Conducir con una placa (tag) vencida
  answer: C
  explanation: La ley de Mississippi exige la revocación de la licencia por varias
    infracciones graves, incluyendo cualquier delito grave cometido utilizando un
    vehículo motorizado.
- id: 140
  category: penalties_and_points
  question: En Mississippi, ¿cuál es la sanción por una condena por primera infracción
    por no asegurar a un niño menor de 4 años en un dispositivo de sujeción para niños?
  choices:
    A: Multa de $25
    B: Multa de $100
    C: 2 puntos en el historial de conducción
    D: 24 horas obligatorias de cárcel
  answer: A
  explanation: Una violación de la Ley de Sujeción de Niños Pasajeros de Mississippi
    es un delito menor punible con una multa de $25.
- id: 141
  category: penalties_and_points
  question: 'Si un conductor de Mississippi es condenado por ''DUI Agravado'' (DUI
    que causa lesiones o muerte), la infracción se clasifica como un:'
  choices:
    A: Infracción civil
    B: Delito menor
    C: Delito grave (Felony)
    D: Violación administrativa
  answer: C
  explanation: El DUI agravado, que implica causar lesiones o la muerte mientras se
    opera un vehículo bajo la influencia, es un delito grave (felony) en Mississippi.
- id: 142
  category: sharing_the_road
  question: En Mississippi, cuando un autobús escolar se detiene en una carretera
    de dos carriles con sus luces rojas intermitentes y el brazo de parada extendido,
    ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima por delante
    C: El tráfico de ambas direcciones
    D: Nadie, si hay al menos dos carriles
  answer: C
  explanation: De acuerdo con el Código de Mississippi § 63-3-615, en cualquier carretera
    de dos carriles, todo el tráfico de ambas direcciones debe detenerse ante un autobús
    escolar con las luces rojas activadas y el brazo de parada extendido.
- id: 143
  category: sharing_the_road
  question: Según la ley de Mississippi, ¿cuándo NO se requiere que un conductor se
    detenga ante un autobús escolar con sus luces rojas intermitentes?
  choices:
    A: Cuando el autobús está en el lado opuesto de una carretera dividida con una
      mediana física o barrera
    B: Cuando el autobús está detenido en un carril de giro
    C: Cuando hay cuatro o más carriles de tráfico
    D: Cuando el conductor viaja al límite de velocidad
  answer: A
  explanation: Los conductores que viajan en la dirección opuesta en una carretera
    dividida con una franja mediana o una barrera física no están obligados a detenerse
    ante un autobús escolar.
- id: 144
  category: sharing_the_road
  question: Al rebasar una bicicleta que viaja en la misma dirección en Mississippi,
    ¿cuál es la distancia mínima de seguridad que debe mantener un automovilista?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: El Código de Mississippi § 63-3-1309 exige que los automovilistas dejen
    una distancia de seguridad no inferior a tres (3) pies al adelantar o rebasar
    una bicicleta.
- id: 145
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen 'Zonas Prohibidas' (No-Zones).
    ¿Qué son estas?
  choices:
    A: Áreas donde los camiones no tienen permitido conducir
    B: Puntos ciegos donde el conductor del camión no puede ver otros vehículos
    C: Carriles especiales reservados para carga pesada
    D: El área directamente dentro del remolque del camión
  answer: B
  explanation: Las 'No-Zones' son grandes puntos ciegos alrededor de la parte delantera,
    trasera y los lados de un camión donde la visibilidad del conductor es limitada
    o inexistente.
- id: 146
  category: sharing_the_road
  question: 'En Mississippi, si ve a un peatón que usa un bastón blanco o un perro
    guía, usted debe:'
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Ceder el derecho de paso y tomar precauciones para evitar lesiones
    C: Conducir alrededor de ellos siempre que no los golpee
    D: Esperar a que le indiquen con la mano que puede pasar
  answer: B
  explanation: La ley de Mississippi otorga protección especial a los peatones ciegos.
    Los conductores deben detenerse por completo si es necesario y ceder el derecho
    de paso a cualquier persona que use un bastón blanco o un perro guía.
- id: 147
  category: sharing_the_road
  question: ¿Por qué al seguir a una motocicleta debe dejar una distancia de seguimiento
    mayor que la que dejaría para un automóvil?
  choices:
    A: Las motocicletas son más pesadas y tardan más en detenerse
    B: Los motociclistas suelen usar señales manuales que son difíciles de ver
    C: Las motocicletas pueden detenerse mucho más rápido que otros vehículos
    D: Es más probable que las motocicletas se apaguen en las intersecciones
  answer: C
  explanation: Las motocicletas son ligeras y tienen sistemas de frenado de alto rendimiento,
    lo que les permite detenerse en distancias más cortas que los automóviles. Seguir
    demasiado de cerca aumenta el riesgo de una colisión por alcance.
- id: 148
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión puede:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Abrirse hacia el carril izquierdo para completar el giro
    C: Girar únicamente desde el carril izquierdo
    D: Detenerse y esperar a que el tráfico despeje ambos carriles
  answer: B
  explanation: Debido a su longitud, los camiones grandes a menudo necesitan abrirse
    hacia la izquierda para no chocar con el bordillo al hacer un giro a la derecha.
    Los conductores nunca deben intentar meterse entre un camión que gira y el bordillo.
- id: 149
  category: sharing_the_road
  question: 'Según la ley de Mississippi, los ciclistas tienen los mismos derechos
    y responsabilidades que:'
  choices:
    A: Los peatones
    B: Los conductores de vehículos motorizados
    C: Los usuarios de patinetas
    D: Los vehículos de emergencia
  answer: B
  explanation: Los ciclistas son considerados legalmente como vehículos cuando están
    en la calzada y deben obedecer todas las leyes, señales y señales de tráfico al
    igual que los conductores de vehículos motorizados.
- id: 150
  category: sharing_the_road
  question: 'En Mississippi, es ilegal seguir a cualquier camión de bomberos o equipo
    que viaje en respuesta a una alarma de incendio a una distancia menor de:'
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Código de Mississippi § 63-3-621 prohíbe seguir a un equipo de bomberos
    a menos de 500 pies o conducir/estacionar dentro de la cuadra donde el equipo
    de bomberos se ha detenido.
- id: 151
  category: sharing_the_road
  question: ¿Cuando un peatón se encuentra en un cruce de peatones no marcado en una
    intersección, quién tiene el derecho de paso?
  choices:
    A: El automovilista, porque el cruce no está pintado
    B: El peatón
    C: Quien llegue primero a la intersección
    D: El automovilista, si viaja al límite de velocidad
  answer: B
  explanation: Los conductores deben ceder el paso a los peatones que cruzan la calle
    dentro de cualquier cruce de peatones marcado o no marcado en una intersección.
- id: 152
  category: sharing_the_road
  question: ¿Cuál es la ley de Mississippi con respecto a los cascos de motocicleta?
  choices:
    A: Solo los conductores menores de 21 años deben usar casco
    B: Los cascos son opcionales si el conductor tiene seguro
    C: Todos los operadores y pasajeros deben usar un casco aprobado
    D: Los cascos solo son obligatorios en las autopistas interestatales
  answer: C
  explanation: La ley de Mississippi exige que todas las personas que operen o viajen
    en una motocicleta o motoneta usen un casco de seguridad que esté bien sujeto
    y cumpla con los estándares aprobados.
- id: 153
  category: sharing_the_road
  question: El emblema de 'Vehículo de movimiento lento' es una señal triangular de
    color naranja fluorescente. ¿A qué velocidad suelen mostrar esta señal los vehículos?
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de Vehículo de Movimiento Lento (SMV) es obligatorio en
    los vehículos diseñados para viajar a velocidades de 25 mph o menos, como tractores
    agrícolas y equipos de construcción.
- id: 154
  category: sharing_the_road
  question: 'Si conduce detrás de un camión grande y no puede ver los espejos laterales
    del camión, usted está:'
  choices:
    A: En una buena posición para rebasar
    B: Siguiendo demasiado de cerca (en la 'Zona No' trasera)
    C: A una distancia de seguimiento segura
    D: En la 'zona segura' del camión
  answer: B
  explanation: 'Una regla general para seguir a camiones grandes es: ''Si no puede
    ver la cara del conductor en su espejo lateral, él no puede verlo a usted''. Usted
    se encuentra en su punto ciego trasero.'
- id: 155
  category: sharing_the_road
  question: Bajo la Ley de Nathan en Mississippi, ¿cuál es la multa mínima por una
    primera infracción de rebasar ilegalmente un autobús escolar detenido?
  choices:
    A: $100
    B: $250
    C: $350
    D: $1,000
  answer: C
  explanation: La Ley de Nathan aumentó las sanciones por rebasar un autobús escolar
    detenido. Una primera infracción conlleva una multa de entre $350 y $750 y posible
    tiempo en la cárcel.
- id: 156
  category: sharing_the_road
  question: En una carretera de Mississippi con cuatro o más carriles y una mediana
    o barrera física, ¿cuál es la regla para los conductores que viajan en la dirección
    opuesta a un autobús escolar detenido?
  choices:
    A: Deben detenerse y esperar a que el autobús se mueva
    B: No están obligados a detenerse, pero deben proceder con precaución
    C: Deben detenerse solo si el conductor del autobús les hace una señal
    D: Deben reducir la velocidad a 10 mph
  answer: B
  explanation: En Mississippi, si una carretera está dividida por una mediana o barrera,
    el tráfico que viaja en la dirección opuesta a un autobús escolar detenido no
    está obligado a detenerse, aunque debe permanecer alerta.
- id: 157
  category: sharing_the_road
  question: Bajo la Ley de Seguridad para Bicicletas John Paul Frerer en Mississippi,
    ¿cuántos pies de distancia segura deben dejar los automovilistas como mínimo al
    rebasar una bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Mississippi (la Ley de Seguridad para Bicicletas John Paul
    Frerer) exige que los automovilistas dejen al menos tres pies de espacio libre
    al rebasar a un ciclista.
- id: 158
  category: sharing_the_road
  question: Al acercarse a un vehículo de emergencia estacionado con sus luces intermitentes
    encendidas en una carretera de varios carriles en Mississippi, ¿qué le exige hacer
    la ley de 'Moverse al carril de al lado' (Move Over)?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Acelerar para rebasar el vehículo rápidamente
    C: Cambiarse a un carril que no sea adyacente al vehículo de emergencia, si es
      seguro hacerlo
    D: Mantener su velocidad y permanecer en su carril actual
  answer: C
  explanation: La ley Move Over de Mississippi exige que los conductores se muevan
    a un carril que no sea adyacente al vehículo de emergencia estacionado si es seguro
    hacerlo. Si no es seguro, el conductor debe reducir la velocidad.
- id: 159
  category: sharing_the_road
  question: En Mississippi, ¿quién está obligado por ley a usar un casco de seguridad
    al viajar en motocicleta?
  choices:
    A: Solo el operador
    B: Solo los pasajeros menores de 21 años
    C: Tanto el operador como cualquier pasajero
    D: Solo aquellos que viajan en autopistas
  answer: C
  explanation: La ley de Mississippi exige que cada persona que opere o viaje en una
    motocicleta use un casco de seguridad que cumpla con los estándares de seguridad
    aprobados.
- id: 160
  category: sharing_the_road
  question: Al compartir la carretera con camiones comerciales grandes, ¿dónde se
    encuentra la 'Zona No' (punto ciego) más grande?
  choices:
    A: Directamente frente al camión
    B: Directamente detrás del camión
    C: En el lado izquierdo del camión
    D: En el lado derecho del camión
  answer: B
  explanation: Aunque los camiones tienen puntos ciegos en todos los lados, el área
    directamente detrás del camión es una 'Zona No' significativa donde el conductor
    del camión no puede ver su vehículo en absoluto.
- id: 161
  category: sharing_the_road
  question: 'Según la ley de Mississippi, una bicicleta que se utilice de noche debe
    estar equipada con una lámpara delantera que emita una luz blanca visible desde
    al menos:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Para circular de noche, la ley de Mississippi exige que una bicicleta
    tenga una lámpara delantera visible desde 500 pies y un reflector o lámpara roja
    en la parte trasera visible desde 600 pies.
- id: 162
  category: sharing_the_road
  question: 'En Mississippi, es ilegal seguir a un vehículo de emergencia, como un
    camión de bomberos que responde a una alarma, a una distancia menor de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Mississippi prohíbe a los conductores seguir a un camión
    de bomberos u otro vehículo de emergencia que responda a una alarma a una distancia
    menor de 500 pies.
- id: 163
  category: sharing_the_road
  question: 'Al rebasar a un camión grande en la carretera, no debe volver al carril
    delante del camión hasta que pueda ver:'
  choices:
    A: La cara del conductor del camión
    B: La luz de giro del camión
    C: Toda la parte delantera del camión en su espejo retrovisor
    D: El techo del camión
  answer: C
  explanation: Para asegurarse de haber dejado suficiente espacio y no 'cortar el
    paso' a un camión, espere hasta que pueda ver toda la parte delantera del camión
    en su espejo retrovisor interior antes de volver a su carril.
- id: 164
  category: sharing_the_road
  question: Según la ley de Mississippi, ¿cuál de las siguientes afirmaciones es verdadera
    con respecto a las motocicletas y los carriles de tránsito?
  choices:
    A: Las motocicletas deben permanecer en el acotamiento
    B: Las motocicletas tienen derecho al ancho total de un carril
    C: Dos motocicletas nunca pueden circular una al lado de la otra en un carril
    D: Las motocicletas siempre deben circular por el borde derecho del carril
  answer: B
  explanation: Las motocicletas tienen derecho al ancho total de un carril de tránsito.
    Los automovilistas nunca deben intentar compartir un carril con una motocicleta.
- id: 165
  category: sharing_the_road
  question: 'Si no hay aceras disponibles, la ley de Mississippi exige que los peatones
    caminen:'
  choices:
    A: En el lado derecho de la carretera con el tráfico
    B: En el lado izquierdo de la carretera de frente al tráfico
    C: En el centro de la carretera
    D: En el acotamiento en cualquier dirección
  answer: B
  explanation: Cuando no se proporcionan aceras, los peatones deben caminar por el
    lado izquierdo de la carretera o por su acotamiento, de frente al tráfico que
    se aproxima en dirección opuesta.
- id: 166
  category: sharing_the_road
  question: En Mississippi, la maquinaria agrícola y otros vehículos de movimiento
    lento que viajan a 25 mph o menos deben mostrar ¿qué símbolo en la parte trasera?
  choices:
    A: Una luz amarilla intermitente
    B: Un emblema triangular naranja de 'Vehículo de Movimiento Lento'
    C: Una bandera roja cuadrada
    D: Un símbolo de 'X' blanca
  answer: B
  explanation: Los vehículos de movimiento lento, como los tractores agrícolas, deben
    mostrar un emblema triangular naranja de 'Vehículo de Movimiento Lento' (SMV)
    en la parte trasera cuando circulan por vías públicas.
- id: 167
  category: vehicle_information
  question: Según la ley de Mississippi, ¿cuál es el tinte máximo permitido para las
    ventanas laterales y traseras de un vehículo?
  choices:
    A: 20% de transmisión de luz
    B: 28% de transmisión de luz
    C: 32% de transmisión de luz
    D: 35% de transmisión de luz
  answer: B
  explanation: La ley de Mississippi exige que el tinte de las ventanas permita el
    paso de al menos el 28% de la luz. Los vehículos con tinte instalado posteriormente
    también deben mostrar una etiqueta de cumplimiento en el parabrisas.
- id: 168
  category: vehicle_information
  question: 'La ley de Mississippi exige que todo vehículo de motor tenga una lámpara
    trasera que emita una luz roja visible desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley estatal exige que las luces traseras sean visibles desde una
    distancia de 500 pies hacia atrás.
- id: 169
  category: vehicle_information
  question: 'La luz blanca que ilumina la placa trasera de un vehículo en Mississippi
    debe hacer que la placa sea legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: Las regulaciones de equipamiento de Mississippi establecen que la placa
    trasera debe estar iluminada de modo que sea claramente legible desde una distancia
    de 50 pies.
- id: 170
  category: vehicle_information
  question: Según la ley de Mississippi, el freno de pie de su vehículo debe poder
    detener el automóvil en cuántos pies cuando viaja a 30 millas por hora?
  choices:
    A: 20 pies
    B: 30 pies
    C: 45 pies
    D: 50 pies
  answer: B
  explanation: Las normas de seguridad de Mississippi exigen que el freno de servicio
    (freno de pie) sea capaz de detener el vehículo en un tramo de 30 pies a una velocidad
    de 30 mph.
- id: 171
  category: vehicle_information
  question: 'Todo vehículo de motor operado en las autopistas de Mississippi debe
    estar equipado con una bocina que sea audible en condiciones normales desde una
    distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Mississippi requiere una bocina que pueda escucharse desde
    una distancia no menor a 200 pies.
- id: 172
  category: vehicle_information
  question: 'La ley de Mississippi requiere que todo vehículo de motor esté equipado
    con un espejo ubicado de tal manera que refleje al conductor una vista de la carretera
    por una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: Los vehículos deben tener un espejo retrovisor que proporcione una
    vista de la carretera de al menos 200 pies detrás del vehículo.
- id: 173
  category: vehicle_information
  question: ¿Si una carga se extiende más de cuántos pies más allá de la parte trasera
    de la carrocería de un vehículo en Mississippi, se debe colocar una bandera roja
    (día) o una luz roja (noche)?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: Cualquier carga que se extienda más de 4 pies más allá de la parte
    trasera del vehículo debe estar marcada con una bandera roja durante el día y
    una luz roja por la noche.
- id: 174
  category: vehicle_information
  question: 'En Mississippi, un neumático se considera inseguro si la profundidad
    de la banda de rodadura es menor a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/16 de pulgada
  answer: B
  explanation: Los neumáticos se consideran legalmente inseguros en Mississippi si
    la banda de rodadura está desgastada a menos de 2/32 de pulgada.
- id: 175
  category: vehicle_information
  question: 'Las señales de giro en un vehículo en Mississippi deben ser visibles
    desde una distancia no menor a:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley de Mississippi requiere que las señales de giro sean visibles
    tanto hacia adelante como hacia atrás desde una distancia de al menos 100 pies.
- id: 176
  category: vehicle_information
  question: 'En Mississippi, se debe mostrar un emblema de "Vehículo de Movimiento
    Lento" (Slow Moving Vehicle) en la parte trasera de cualquier vehículo que esté
    diseñado para operar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: Los vehículos diseñados para viajar a 25 mph o menos deben mostrar
    un emblema triangular de vehículo de movimiento lento.
- id: 177
  category: vehicle_information
  question: 'La ley de Mississippi requiere que encienda sus faros delanteros cuando
    la visibilidad se reduce a:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Los faros delanteros deben encenderse en Mississippi siempre que la
    visibilidad sea inferior a 500 pies debido al clima, el humo o la oscuridad.
- id: 178
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los requisitos
    del silenciador (muffler) en Mississippi?
  choices:
    A: Los silenciadores son opcionales en los vehículos agrícolas
    B: Los recortes o derivaciones del silenciador están estrictamente prohibidos
    C: Se permiten silenciadores ruidosos durante las horas del día
    D: Solo los vehículos fabricados después de 2010 requieren silenciadores
  answer: B
  explanation: La ley de Mississippi requiere que cada vehículo de motor tenga un
    silenciador en buen estado de funcionamiento para evitar el ruido excesivo, y
    prohíbe específicamente el uso de recortes o derivaciones del silenciador.
- id: 179
  category: vehicle_information
  question: ¿Cuál es el ancho legal máximo para cualquier vehículo (excluyendo espejos
    y dispositivos de seguridad) en las autopistas de Mississippi?
  choices:
    A: 8 pies
    B: 8 pies, 6 pulgadas
    C: 9 pies
    D: 10 pies
  answer: B
  explanation: El ancho legal máximo para un vehículo en las carreteras de Mississippi
    es de 8 pies y 6 pulgadas (102 pulgadas).
- id: 180
  category: vehicle_information
  question: 'Según el Manual del Conductor de Mississippi, los faros delanteros de
    su vehículo deben encenderse en cualquier momento en que no pueda ver claramente
    a una distancia de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Mississippi requiere que los faros delanteros estén encendidos
    desde el atardecer hasta el amanecer y siempre que la visibilidad sea inferior
    a 500 pies debido al clima u otras condiciones.
- id: 181
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para un vehículo de pasajeros en Mississippi?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros e ilegales en Mississippi si
    están desgastados hasta un punto en el que queda menos de 2/32 de pulgada de banda
    de rodadura.
- id: 182
  category: vehicle_information
  question: 'La ley de Mississippi exige que su vehículo tenga un espejo retrovisor
    que le permita ver la carretera hacia atrás a una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El espejo retrovisor debe estar ajustado de modo que el conductor pueda
    ver al menos 200 pies hacia la parte trasera del vehículo.
- id: 183
  category: vehicle_information
  question: 'En Mississippi, todo vehículo de motor debe tener al menos una luz trasera
    que emita una luz roja claramente visible desde una distancia de:'
  choices:
    A: 250 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Las luces traseras de los vehículos en Mississippi deben ser visibles
    desde una distancia de 500 pies hacia atrás.
- id: 184
  category: vehicle_information
  question: Al conducir con niebla densa en Mississippi, ¿qué ajuste de luces debe
    utilizar para obtener la mejor visibilidad?
  choices:
    A: Luces altas (High-beam)
    B: Luces bajas (Low-beam)
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia
  answer: B
  explanation: En condiciones de niebla, se deben utilizar las luces bajas. Las luces
    altas se reflejan en la niebla y, de hecho, disminuyen la visibilidad.
- id: 185
  category: vehicle_information
  question: 'La ley de Mississippi exige que la placa de matrícula trasera esté iluminada
    por una luz blanca para que sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El Código de Mississippi exige una luz blanca para iluminar la placa
    de registro trasera, haciéndola visible desde una distancia de 50 pies hacia atrás.
- id: 186
  category: signs_and_signals
  question: En Mississippi, ¿qué indica una señal de tráfico amarilla intermitente?
  choices:
    A: Detenerse por completo antes de continuar
    B: Acelerar para despejar la intersección
    C: Disminuir la velocidad y tener precaución
    D: La señal está averiada; trátela como una parada de cuatro vías
  answer: C
  explanation: Según el Manual del Conductor de Mississippi, una luz amarilla intermitente
    significa que debe disminuir la velocidad y tener precaución antes de entrar en
    la intersección.
- id: 187
  category: signs_and_signals
  question: ¿Cuál es la forma específica de una señal de 'Zona de No Rebasar' (No
    Passing Zone) en Mississippi?
  choices:
    A: Diamante
    B: Banderín
    C: Rectángulo
    D: Pentágono
  answer: B
  explanation: Una señal de 'Zona de No Rebasar' tiene forma de banderín y se coloca
    en el lado izquierdo de la carretera para marcar el comienzo de una zona donde
    está prohibido rebasar.
- id: 188
  category: signs_and_signals
  question: Cuando un conductor en Mississippi extiende su brazo izquierdo horizontalmente
    por la ventana, ¿qué indica esta señal manual?
  choices:
    A: Giro a la derecha
    B: Giro a la izquierda
    C: Detenerse o disminuir la velocidad
    D: Giro en U
  answer: B
  explanation: La señal manual estándar para un giro a la izquierda es el brazo izquierdo
    extendido horizontalmente por la ventana.
- id: 189
  category: signs_and_signals
  question: En Mississippi, ¿qué indican las líneas blancas sólidas dobles pintadas
    en el pavimento?
  choices:
    A: Se permite rebasar con precaución
    B: Puede cruzar las líneas para entrar en una entrada privada
    C: Está prohibido cruzar las líneas para cambiar de carril
    D: La carretera es solo para vehículos de emergencia
  answer: C
  explanation: Las líneas blancas sólidas dobles indican que los cambios de carril
    están prohibidos. Debe permanecer dentro de su carril.
- id: 190
  category: signs_and_signals
  question: ¿Qué significa en Mississippi una señal amarilla de forma redonda con
    una 'X' negra y las letras 'RR'?
  choices:
    A: Reparación de carretera adelante
    B: Área de descanso restringida
    C: Advertencia anticipada de cruce de ferrocarril
    D: Carretera irregular adelante
  answer: C
  explanation: Una señal amarilla redonda con una 'X' negra y 'RR' es la señal de
    advertencia anticipada para un cruce de ferrocarril.
- id: 191
  category: signs_and_signals
  question: 'Si se aproxima a una intersección con una luz roja intermitente en Mississippi,
    usted debe:'
  choices:
    A: Reducir la velocidad y ceder el paso a todo el tráfico
    B: Detenerse por completo y avanzar solo cuando sea seguro
    C: Tratarla como una luz amarilla y avanzar con precaución
    D: Detenerse solo si hay tráfico transversal
  answer: B
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto (STOP). Debe detenerse por completo y avanzar solo cuando el camino esté
    despejado.
- id: 192
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de pentágono en una carretera
    de Mississippi?
  choices:
    A: Ceder el paso
    B: Zona de no rebasar
    C: Zona escolar o cruce escolar
    D: Hospital adelante
  answer: C
  explanation: Una señal de cinco lados (pentágono) indica una zona escolar o un cruce
    escolar.
- id: 193
  category: signs_and_signals
  question: En Mississippi, ¿qué significa una línea amarilla continua en su lado
    de una línea central amarilla discontinua?
  choices:
    A: Puede rebasar si no viene tráfico
    B: Está prohibido rebasar en su lado
    C: Está en una zona de un solo sentido
    D: Debe acelerar para rebasar rápidamente
  answer: B
  explanation: Una línea amarilla continua en su lado de la línea central significa
    que está prohibido rebasar para el tráfico en su carril.
- id: 194
  category: signs_and_signals
  question: 'Para señalizar un giro a la derecha usando señales manuales en Mississippi,
    un conductor debe:'
  choices:
    A: Extender el brazo izquierdo horizontalmente
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo izquierdo hacia abajo
    D: Extender el brazo derecho horizontalmente
  answer: B
  explanation: La señal manual para un giro a la derecha es el brazo izquierdo doblado
    hacia arriba a la altura del codo.
- id: 195
  category: signs_and_signals
  question: ¿De qué color son las señales de guía de Mississippi que proporcionan
    información sobre servicios como gasolina, comida y alojamiento?
  choices:
    A: Verde
    B: Azul
    C: Marrón
    D: Naranja
  answer: B
  explanation: Las señales azules se utilizan para proporcionar información sobre
    servicios para automovilistas, como comida, gasolina y alojamiento.
- id: 196
  category: signs_and_signals
  question: En Mississippi, ¿qué indica una flecha amarilla fija que apunta hacia
    la izquierda?
  choices:
    A: Usted tiene el derecho de paso para girar a la izquierda
    B: El período de giro protegido está terminando
    C: Debe detenerse y esperar una luz verde
    D: Los giros a la izquierda están prohibidos en esta intersección
  answer: B
  explanation: Una flecha amarilla fija significa que el tiempo de giro 'protegido'
    está terminando. Debe prepararse para detenerse o completar su giro si ya se encuentra
    en la intersección.
- id: 197
  category: signs_and_signals
  question: ¿Cuál de estas marcas en el pavimento separa el tráfico que se mueve en
    la misma dirección en Mississippi?
  choices:
    A: Líneas amarillas discontinuas
    B: Líneas amarillas continuas
    C: Líneas blancas discontinuas
    D: Líneas amarillas continuas dobles
  answer: C
  explanation: Las líneas blancas discontinuas se utilizan para separar carriles de
    tráfico que se mueven en la misma dirección donde se permite el cambio de carril.
- id: 198
  category: signs_and_signals
  question: ¿Qué significa una señal naranja en forma de diamante en Mississippi?
  choices:
    A: Advertencia general de peligros
    B: Advertencia de construcción o mantenimiento
    C: Información direccional
    D: Límite de velocidad reglamentario
  answer: B
  explanation: Las señales naranjas se utilizan específicamente para zonas de trabajo
    de construcción y mantenimiento para alertar a los conductores sobre condiciones
    inusuales o potencialmente peligrosas.
- id: 199
  category: signs_and_signals
  question: 'En Mississippi, una señal triangular roja y blanca que apunta hacia abajo
    significa:'
  choices:
    A: Pare
    B: Ceda el paso
    C: No entrar
    D: Una vía
  answer: B
  explanation: El triángulo que apunta hacia abajo es la forma estándar para una señal
    de Ceda el paso (Yield), que requiere que los conductores reduzcan la velocidad
    y den el derecho de paso a otro tráfico.
- id: 200
  category: signs_and_signals
  question: 'Cuando vea una señal de ''Cruz de San Andrés'' (Crossbuck) en un cruce
    de ferrocarril en Mississippi, debe tratarse igual que una:'
  choices:
    A: Señal de límite de velocidad
    B: Señal de ceda el paso
    C: Señal de alto
    D: Señal de no rebasar
  answer: B
  explanation: Una señal de cruz de San Andrés de ferrocarril es una señal reglamentaria
    que debe tratarse como una señal de ceda el paso; debe ceder el paso a los trenes
    que se aproximan.
- id: 201
  category: signs_and_signals
  question: ¿Cuál es la señal manual adecuada para indicar un giro a la izquierda
    en Mississippi?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo
    D: Brazo agitándose en movimiento circular
  answer: A
  explanation: Según el Manual del Conductor de Mississippi, la señal manual para
    un giro a la izquierda es el brazo izquierdo extendido horizontalmente hacia afuera
    de la ventana.
- id: 202
  category: signs_and_signals
  question: Al usar señales manuales en Mississippi, ¿cómo indica que está disminuyendo
    la velocidad o deteniéndose?
  choices:
    A: Brazo extendido recto hacia afuera
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo con la palma hacia atrás
    D: Brazo agitándose hacia el suelo
  answer: C
  explanation: El Manual del Conductor de Mississippi establece que para señalar una
    parada o disminución de velocidad, el brazo debe extenderse hacia abajo con la
    palma hacia atrás.
- id: 203
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico amarilla intermitente según la ley
    de Mississippi?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Acelerar para despejar la intersección
    C: Ceder el paso a todo el tráfico y detenerse si es necesario
    D: Disminuir la velocidad y proceder con precaución a través de la intersección
  answer: D
  explanation: En Mississippi, una luz amarilla intermitente es una advertencia para
    reducir la velocidad y estar especialmente alerta al avanzar por la intersección.
- id: 204
  category: signs_and_signals
  question: 'Una señal en forma de banderín (triángulo isósceles que apunta a la derecha)
    situada en el lado izquierdo de una carretera de Mississippi indica:'
  choices:
    A: Una zona escolar
    B: Una zona de no rebasar
    C: Un cruce de ferrocarril
    D: Un requisito de ceder el paso
  answer: B
  explanation: En Mississippi y en todo EE. UU., una señal en forma de banderín colocada
    en el lado izquierdo de la carretera marca el inicio de una zona de no rebasar
    (no pasar).
- id: 205
  category: signs_and_signals
  question: ¿Cuál es el significado de un semáforo en rojo intermitente en Mississippi?
  choices:
    A: La señal está averiada; proceda con precaución
    B: Detenerse por completo y proceder solo cuando sea seguro hacerlo
    C: Ceder el paso al tráfico que viene en sentido contrario pero no detenerse
    D: Detenerse y esperar a que la luz cambie a verde
  answer: B
  explanation: 'Una luz roja intermitente en Mississippi tiene el mismo significado
    que una señal de alto: debe detenerse por completo y proceder solo cuando el camino
    esté despejado.'
- id: 206
  category: signs_and_signals
  question: 'Cuando vea una señal de ''Ceda el paso'' (Yield) en Mississippi, debe:'
  choices:
    A: Detenerse por completo siempre
    B: Reducir la velocidad y detenerse si es necesario para dejar pasar a cualquier
      vehículo o peatón
    C: Acelerar para incorporarse al tráfico
    D: Ignorarla si no hay otros autos presentes
  answer: B
  explanation: Una señal de ceda el paso significa que debe reducir la velocidad y
    otorgar el derecho de paso al tráfico en la intersección o en la carretera de
    conexión, deteniéndose si la situación lo requiere.
- id: 207
  category: signs_and_signals
  question: ¿Qué representa una línea blanca continua pintada a través de un carril
    en una intersección en Mississippi?
  choices:
    A: Un cruce peatonal solo para peatones
    B: Una línea de parada, que indica dónde detenerse ante una señal o semáforo
    C: Un límite de estacionamiento
    D: Un divisor de carril para el tráfico que gira
  answer: B
  explanation: Una línea blanca continua a través de un carril es una línea de parada.
    Los conductores deben detenerse detrás de esta línea en las señales de alto o
    semáforos.
- id: 208
  category: signs_and_signals
  question: Según la ley de Mississippi, ¿cuándo se permite girar a la derecha con
    luz roja?
  choices:
    A: Nunca
    B: Solo si hay una flecha verde
    C: Después de detenerse por completo y ceder el paso al tráfico y a los peatones,
      a menos que una señal lo prohíba
    D: Solo entre las 9:00 PM y las 6:00 AM
  answer: C
  explanation: La ley de Mississippi permite girar a la derecha en rojo después de
    una parada completa, siempre que el camino esté despejado y no haya una señal
    que diga 'No Turn on Red' (No girar en rojo).
- id: 209
  category: signs_and_signals
  question: 'Una señal de cinco lados (pentágono) en Mississippi indica que se está
    aproximando a:'
  choices:
    A: Un hospital
    B: Un límite de condado
    C: Una zona escolar o cruce escolar
    D: Un parque público
  answer: C
  explanation: La señal en forma de pentágono se utiliza exclusivamente para advertir
    a los conductores sobre zonas escolares o cruces escolares.
- id: 210
  category: signs_and_signals
  question: ¿Cuál es el propósito de una línea blanca continua pintada en el borde
    derecho de la carretera en Mississippi?
  choices:
    A: Indicar que se permite rebasar por el acotamiento
    B: Marcar el borde del carril de circulación (línea de niebla)
    C: Mostrar por dónde deben circular las bicicletas
    D: Indicar un carril para viajes compartidos
  answer: B
  explanation: La línea blanca continua en el lado derecho de la carretera es la 'línea
    de niebla' (fog line) o línea de borde, que ayuda a los conductores a ver el límite
    de la carretera, especialmente de noche o con mal tiempo.
- id: 211
  category: signs_and_signals
  question: 'En Mississippi, una luz de semáforo amarilla fija significa:'
  choices:
    A: La luz está a punto de cambiar a verde
    B: Debe acelerar para ganarle a la luz roja
    C: La luz está a punto de cambiar a roja; despeje la intersección o deténgase
      si puede hacerlo de manera segura
    D: Deténgase inmediatamente, incluso si está en medio de la intersección
  answer: C
  explanation: Una luz amarilla fija es una advertencia de que la señal está cambiando
    a rojo. Los conductores deben despejar la intersección o detenerse si aún no han
    entrado en ella y pueden hacerlo de forma segura.
- id: 212
  category: signs_and_signals
  question: ¿De qué forma y color son la mayoría de las señales de advertencia en
    Mississippi?
  choices:
    A: Redondas y blancas
    B: En forma de diamante y amarillas
    C: Rectangulares y azules
    D: Octogonales y rojas
  answer: B
  explanation: Las señales de advertencia, que alertan a los conductores sobre peligros
    o cambios en las condiciones de la carretera, suelen tener forma de diamante con
    símbolos o letras negras sobre un fondo amarillo.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Haga una parada completa
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octogonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 213
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Hacer una parada completa
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 214
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 215
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 216
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección hacia
    la que apunta la flecha.'
  id: 217
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 218
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 219
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite adelantar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 220
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín de color blanco y negro que dice NO
    PASSING ZONE (Zona de no rebasar) significa que no se le permite rebasar a otros
    vehículos en esta área. Marca el inicio de una zona de no rebasar.
  id: 221
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de KEEP RIGHT (Manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 222
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 223
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 224
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de caminata cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 225
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 226
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras 'R' es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 227
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) se coloca en los cruces de ferrocarril.
    Significa que debe ceder el paso a los trenes. Si se acerca un tren, debe detenerse.
  id: 228
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 229
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa giro a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 230
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero en un sentido y luego en el otro.
  id: 231
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros adelante
    D: Una colina adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 232
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 233
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente adelante
    B: La carretera se estrecha adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción en el ancho de la vía y ajuste su posición
    en el carril.
  id: 234
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 235
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación adelante
    D: Construcción de carretera adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 236
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento adelante
    C: 'Tráfico de doble sentido adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 237
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 238
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 239
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) adelante
    B: Un semáforo adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 240
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 241
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 242
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 243
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 244
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 245
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 246
