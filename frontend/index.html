<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Driver's Test Practice</title>
    <meta
      name="description"
      content="Free offline practice tests for your state driver's license knowledge exam. Every question is grounded in the official driver manual for all 50 US states, in English and Spanish."
    />
    <link rel="canonical" href="https://ivanmkc.github.io/nj-drivers-test/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Driver's Test Prep — Real Manuals" />
    <meta
      property="og:description"
      content="Practice for your driver's permit with questions grounded in the real DMV manual. 50 states, offline, free."

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Driver's Test" />
    <meta name="theme-color" content="#1a56db" />
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        var d = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111827');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground min-h-dvh font-sans antialiased">
