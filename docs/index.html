<!DOCTYPE html>
<html lang="en" class="dark:bg-gray-900">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<title>Driver's Test Practice</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwindcss.config={darkMode:'class'}</script>
<style>
  .screen { display: none; }
  .screen.active { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.8s linear infinite; }
  .choice-btn.correct { border-color: #16a34a !important; background: #dcfce7 !important; }
  .choice-btn.correct .letter { background: #16a34a !important; color: white !important; }
  .choice-btn.wrong { border-color: #dc2626 !important; background: #fee2e2 !important; }
  .choice-btn.wrong .letter { background: #dc2626 !important; color: white !important; }
  .choice-btn.disabled { cursor: default !important; opacity: 0.7; }
  .choice-btn.disabled.correct, .choice-btn.disabled.wrong { opacity: 1; }
  .explanation.visible { display: block !important; }
  .next-btn.visible { display: block !important; }
</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-dvh font-sans antialiased">
<div class="max-w-lg mx-auto px-4 py-4 pb-safe">

  <!-- Loading -->
  <div id="loading-screen" class="screen active">
    <div class="text-center pt-[30vh] text-gray-400 text-lg">
      <div class="inline-block w-8 h-8 border-[3px] border-gray-200 border-t-blue-600 rounded-full spinner mb-4"></div>
      <div>Loading questions...</div>
    </div>
  </div>

  <!-- State Picker -->
  <div id="state-screen" class="screen">
    <div class="flex justify-end gap-1 mb-3" id="lang-bar-state"></div>
    <div class="text-center pt-4">
      <h1 class="text-2xl font-bold text-blue-600 mb-1" data-i18n="appTitle"></h1>
      <p class="text-gray-500 text-sm mb-4" data-i18n="selectStateDesc"></p>
    </div>
    <div class="relative mb-4">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" id="state-search" placeholder="Search states..." oninput="filterStates()"
        class="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl text-base bg-white text-gray-900 outline-none focus:border-blue-500 transition-colors">
    </div>
    <div id="state-list-container"></div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen" class="screen">
    <div class="flex justify-end gap-1 mb-3" id="lang-bar"></div>
    <div class="text-center pt-[4vh]">
      <h1 class="text-2xl font-bold text-blue-600 mb-2" id="home-title"></h1>
      <p class="text-gray-500 text-sm mb-1 leading-relaxed" id="home-subtitle"></p>
      <p class="text-gray-400 text-xs mb-5" id="home-passing"></p>
    </div>

    <div class="hidden bg-white rounded-xl p-4 mb-5 border border-gray-200" id="past-stats-banner">
      <div class="flex justify-between items-center">
        <div class="flex gap-4">
          <div class="text-center"><div class="text-xl font-bold" id="banner-quizzes">0</div><div class="text-[11px] text-gray-500 uppercase tracking-wide" data-i18n="quizzes"></div></div>
          <div class="text-center"><div class="text-xl font-bold" id="banner-avg">0%</div><div class="text-[11px] text-gray-500 uppercase tracking-wide" data-i18n="avgScore"></div></div>
          <div class="text-center"><div class="text-xl font-bold" id="banner-streak">0</div><div class="text-[11px] text-gray-500 uppercase tracking-wide" data-i18n="passStreak"></div></div>
        </div>
        <a class="text-blue-600 text-sm font-semibold cursor-pointer whitespace-nowrap" onclick="showStats()" data-i18n="viewStats"></a>
      </div>
    </div>

    <div class="flex gap-2 mb-4">
      <button class="mode-btn flex-1 py-3 px-2 border-2 border-gray-200 bg-white rounded-xl text-sm font-semibold cursor-pointer text-center active" id="mode-random" onclick="setMode('random')">
        <span class="text-xl block mb-1">&#127922;</span> <span data-i18n="modeRandom"></span>
        <span class="text-[11px] font-normal text-gray-500 block" data-i18n="modeRandomDesc"></span>
      </button>
      <button class="mode-btn flex-1 py-3 px-2 border-2 border-gray-200 bg-white rounded-xl text-sm font-semibold cursor-pointer text-center" id="mode-weak" onclick="setMode('weak')">
        <span class="text-xl block mb-1">&#127919;</span> <span data-i18n="modeWeak"></span> <span class="hidden bg-red-600 text-white text-[11px] px-1.5 rounded-full ml-1 font-bold" id="weak-count"></span>
        <span class="text-[11px] font-normal text-gray-500 block" data-i18n="modeWeakDesc"></span>
      </button>
    </div>

    <p class="font-semibold mb-2 text-sm" data-i18n="numQuestions"></p>
    <div class="flex gap-2 justify-center mb-5 flex-wrap" id="count-selector"></div>
    <button class="w-full py-4 bg-blue-600 text-white rounded-xl text-lg font-semibold cursor-pointer hover:bg-blue-700 active:opacity-80 transition-colors disabled:opacity-50 disabled:cursor-default" id="start-btn" onclick="startQuiz()" data-i18n="startQuiz"></button>
    <button class="w-full py-2.5 mt-1.5 text-gray-500 text-sm font-medium bg-transparent border-none cursor-pointer" onclick="goStatePicker()" data-i18n="changeState"></button>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="screen">
    <div class="h-1.5 bg-gray-200 rounded-full mb-4 overflow-hidden"><div class="h-full bg-blue-600 rounded-full transition-all duration-300" id="progress"></div></div>
    <div class="flex justify-between items-center mb-3 text-sm text-gray-500">
      <span id="q-counter"></span>
      <span class="font-semibold"><span class="text-green-600" id="score-correct">0</span> / <span class="text-red-600" id="score-wrong">0</span></span>
    </div>
    <div>
      <span class="inline-block bg-blue-50 text-blue-600 px-2.5 py-1 rounded-full text-xs font-semibold mb-3 uppercase tracking-wider" id="q-category"></span>
      <span class="hidden bg-red-50 text-red-600 px-2.5 py-1 rounded-full text-xs font-semibold ml-1.5" id="q-miss-badge"></span>
    </div>
    <div class="text-lg font-semibold leading-relaxed mb-5" id="q-text"></div>
    <div id="q-image-wrap" style="display:none" class="text-center my-3">
      <img id="q-image" class="max-w-full max-h-60 rounded-lg border border-gray-200 inline-block" alt="Road sign">
    </div>
    <div class="flex flex-col gap-2.5 mb-4" id="choices"></div>
    <div class="hidden bg-blue-50 border-l-4 border-blue-600 px-4 py-3 rounded-r-xl text-sm leading-relaxed mb-4 explanation" id="explanation"></div>
    <button class="hidden w-full py-4 bg-blue-600 text-white rounded-xl text-[17px] font-semibold cursor-pointer hover:bg-blue-700 active:opacity-80 transition-colors next-btn" id="next-btn" onclick="nextQuestion()"></button>
  </div>

  <!-- Results Screen -->
  <div id="results-screen" class="screen text-center pt-[6vh]">
    <div class="w-40 h-40 rounded-full flex flex-col items-center justify-center mx-auto mb-6 border-[6px]" id="results-circle">
      <div class="text-[42px] font-bold" id="results-pct"></div>
      <div class="text-sm font-semibold uppercase" id="results-label"></div>
    </div>
    <div class="text-xl font-bold mb-2" id="result-msg"></div>
    <div class="text-gray-500 text-sm mb-6 leading-relaxed" id="result-detail"></div>
    <button class="w-full py-4 bg-blue-600 text-white rounded-xl text-lg font-semibold cursor-pointer hover:bg-blue-700 active:opacity-80 transition-colors" onclick="goHome()" data-i18n="newQuiz"></button>
    <button class="w-full py-4 mt-2.5 bg-white text-blue-600 border-2 border-blue-600 rounded-xl text-lg font-semibold cursor-pointer hover:bg-blue-50 transition-colors" onclick="showStats()" data-i18n="viewStats"></button>
    <div class="text-left mt-6">
      <h3 class="text-lg font-semibold mb-3" id="review-title"></h3>
      <div id="review-list"></div>
    </div>
  </div>

  <!-- Stats Screen -->
  <div id="stats-screen" class="screen pt-4">
    <button class="inline-flex items-center gap-1.5 text-blue-600 text-sm font-semibold cursor-pointer mb-5 bg-transparent border-none" onclick="goHome()"><span>&larr;</span> <span data-i18n="back"></span></button>
    <div class="text-xl font-bold mb-5" data-i18n="yourProgress"></div>
    <div class="grid grid-cols-3 gap-2.5 mb-6">
      <div class="bg-white rounded-xl py-4 px-3 text-center border border-gray-200"><div class="text-2xl font-bold text-blue-600" id="s-total">0</div><div class="text-[11px] text-gray-500 uppercase tracking-wide mt-1" data-i18n="quizzes"></div></div>
      <div class="bg-white rounded-xl py-4 px-3 text-center border border-gray-200"><div class="text-2xl font-bold text-green-600" id="s-avg">0%</div><div class="text-[11px] text-gray-500 uppercase tracking-wide mt-1" data-i18n="avgScore"></div></div>
      <div class="bg-white rounded-xl py-4 px-3 text-center border border-gray-200"><div class="text-2xl font-bold" id="s-seen">0</div><div class="text-[11px] text-gray-500 uppercase tracking-wide mt-1" data-i18n="qsSeen"></div></div>
    </div>
    <div class="grid grid-cols-2 gap-2.5 mb-6">
      <div class="bg-white rounded-xl py-4 px-3 text-center border border-gray-200"><div class="text-2xl font-bold text-green-600" id="s-streak">0</div><div class="text-[11px] text-gray-500 uppercase tracking-wide mt-1" data-i18n="passStreak"></div></div>
      <div class="bg-white rounded-xl py-4 px-3 text-center border border-gray-200"><div class="text-2xl font-bold" id="s-best">0%</div><div class="text-[11px] text-gray-500 uppercase tracking-wide mt-1" data-i18n="bestScore"></div></div>
    </div>
    <div class="bg-white rounded-xl p-4 mb-6 border border-gray-200">
      <h4 class="text-sm font-semibold mb-3" data-i18n="scoreHistory"></h4>
      <canvas id="chart" height="180" class="w-full" style="height:180px"></canvas>
      <div class="h-28 flex items-center justify-center text-gray-400 text-sm text-center" id="chart-empty"></div>
    </div>
    <div class="mb-6" id="cat-bars-section">
      <h4 class="text-sm font-semibold mb-3" data-i18n="accuracyByCategory"></h4>
      <div id="cat-bars"></div>
    </div>
    <div class="mb-6" id="weak-section">
      <h4 class="text-sm font-semibold mb-3" data-i18n="mostMissed"></h4>
      <div id="weak-list"></div>
    </div>
    <div class="border-t border-gray-200 pt-5 mt-2">
      <button class="w-full py-3 bg-white text-red-600 border-2 border-red-100 rounded-xl text-sm font-semibold cursor-pointer hover:bg-red-50 active:bg-red-100 transition-colors" onclick="clearData()" data-i18n="resetAll"></button>
    </div>
  </div>

</div>

<script>
let BUNDLE = null, STATES_DATA = {}, STATES_CONFIG = {};
let I18N = {}, currentLang = localStorage.getItem('quiz_lang') || 'en';
const LANG_LABELS = { en: 'EN', ja: '\u65E5\u672C\u8A9E', es: 'ES' };

async function loadI18n() { I18N = await (await fetch('i18n.json')).json(); }

function t(key, vars) {
  let s = (I18N[currentLang]?.[key]) || (I18N['en']?.[key]) || key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.documentElement.lang = currentLang;
}

function buildLangBar(containerId, availableLangs) {
  const allLangs = Object.keys(I18N);
  const available = new Set(availableLangs || allLangs);
  document.getElementById(containerId).innerHTML = allLangs.map(lang => {
    const disabled = !available.has(lang);
    const active = lang === currentLang && !disabled;
    return `<button class="px-3 py-1.5 border-[1.5px] rounded-full text-xs font-semibold cursor-pointer transition-colors
      ${active ? 'border-blue-500 bg-blue-50 text-blue-600' : 'border-gray-200 bg-white text-gray-500'}
      ${disabled ? 'opacity-30 !cursor-not-allowed' : ''}"
      ${disabled ? 'disabled' : `onclick="switchLang('${lang}')"`}>${LANG_LABELS[lang] || lang.toUpperCase()}</button>`;
  }).join('');
}

function switchLang(lang) {
  if (!I18N[lang]) return;
  currentLang = lang; localStorage.setItem('quiz_lang', lang); applyI18n();
  const active = document.querySelector('.screen.active');
  if (active?.id === 'state-screen') { renderStatePicker(); buildLangBar('lang-bar-state'); }
  else if (active?.id === 'start-screen') renderHome();
}

let allStates = [], currentState = null;
function storeKey() { return `quiz_${currentState.code}`; }
function loadStore() { try { const r = localStorage.getItem(storeKey()); if (r) return JSON.parse(r); } catch(e) {} return { history: [], questions: {} }; }
function saveStore(s) { localStorage.setItem(storeKey(), JSON.stringify(s)); }

let questions = [], currentIdx = 0, correctCount = 0, wrongCount = 0, answered = false;
let selectedCount = 50, quizMode = 'random', sessionResults = [];

function getStateQuestions(stateCode, lang) {
  const key = `${stateCode}_${lang}`;
  if (STATES_DATA[key]) return STATES_DATA[key];
  const sd = BUNDLE.states.find(s => s.code === stateCode);
  if (!sd) return null;
  const qs = sd.languages[lang] || sd.languages['en'];
  if (!qs) return null;
  STATES_DATA[key] = { questions: qs, by_id: Object.fromEntries(qs.map(q => [q.id, q])) };
  return STATES_DATA[key];
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadI18n();
  BUNDLE = await (await fetch('questions_bundle.json')).json();
  allStates = BUNDLE.states.map(s => ({
    code: s.code, name: s.name, agency: s.agency,
    passing_score_pct: s.passing_score_pct, test_question_count: s.test_question_count,
    languages: Object.keys(s.languages),
    total_questions: (s.languages.en || []).length,
    has_questions: (s.languages.en || []).length > 0,
  }));
  showScreen('state-screen');
  const saved = localStorage.getItem('quiz_state');
  if (saved) { const s = allStates.find(s => s.code === saved && s.has_questions); if (s) { currentState = s; goHome(); applyI18n(); return; } }
  applyI18n(); buildLangBar('lang-bar-state'); renderStatePicker();
});

const COUNTRIES = {
  'us': { name: 'United States', flag: '\u{1F1FA}\u{1F1F8}' },
  'ca': { name: 'Canada', flag: '\u{1F1E8}\u{1F1E6}' },
  'au': { name: 'Australia', flag: '\u{1F1E6}\u{1F1FA}' },
  'uk': { name: 'United Kingdom', flag: '\u{1F1EC}\u{1F1E7}' },
  'nz': { name: 'New Zealand', flag: '\u{1F1F3}\u{1F1FF}' },
  'ie': { name: 'Ireland', flag: '\u{1F1EE}\u{1F1EA}' },
  'sg': { name: 'Singapore', flag: '\u{1F1F8}\u{1F1EC}' },
};

function getCountry(code) {
  if (code.startsWith('ca-')) return 'ca';
  if (code.startsWith('au-')) return 'au';
  if (['uk','nz','ie','sg'].includes(code)) return code;
  return 'us';
}

function renderStatePicker(filter) {
  buildLangBar('lang-bar-state');
  const container = document.getElementById('state-list-container');
  const query = (filter || '').toLowerCase().trim();
  const groups = {};
  for (const s of allStates) {
    const country = getCountry(s.code);
    if (!groups[country]) groups[country] = [];
    if (query && !s.name.toLowerCase().includes(query) && !s.code.includes(query)) continue;
    groups[country].push(s);
  }
  const order = ['us', ...Object.keys(groups).filter(c => c !== 'us').sort()];
  let html = '', total = 0;
  for (const country of order) {
    const states = groups[country];
    if (!states?.length) continue;
    total += states.length;
    const info = COUNTRIES[country] || { name: country.toUpperCase(), flag: '' };
    html += `<div class="mb-5">
      <div class="flex items-center gap-2 text-xs font-bold text-gray-500 uppercase tracking-wider px-1 pb-2 border-b border-gray-200 mb-2">
        <span class="text-lg">${info.flag}</span> ${info.name} <span class="font-normal">(${states.length})</span>
      </div>
      <div class="flex flex-col gap-2">`;
    html += states.map(s => {
      const hasQ = s.has_questions;
      return `<div class="flex justify-between items-center p-4 bg-white border-2 ${hasQ ? 'border-gray-200 cursor-pointer hover:border-blue-300 active:scale-[0.98]' : 'border-gray-100 opacity-50 cursor-default'} rounded-xl transition-all" onclick="${hasQ ? `selectState('${s.code}')` : ''}">
        <div>
          <div class="text-base font-semibold">${s.name}</div>
          <div class="text-xs text-gray-500 mt-0.5">${s.agency} &middot; ${t('passingScore', {pass_pct: s.passing_score_pct, pass_count: Math.ceil(s.test_question_count * s.passing_score_pct / 100), test_count: s.test_question_count})}</div>
        </div>
        <div class="text-right">
          ${hasQ ? `<div class="text-xs text-blue-600 font-semibold">${t('questionsAvailable', {count: s.total_questions})}</div>` : `<span class="text-[11px] text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">${t('comingSoon')}</span>`}
        </div>
      </div>`;
    }).join('');
    html += `</div></div>`;
  }
  if (!total) html = `<div class="text-gray-400 text-sm py-10 text-center">No states found matching "${esc(query)}"</div>`;
  container.innerHTML = html;
}

function filterStates() { renderStatePicker(document.getElementById('state-search').value); }
function selectState(code) { currentState = allStates.find(s => s.code === code); localStorage.setItem('quiz_state', code); goHome(); }
function goStatePicker() { showScreen('state-screen'); applyI18n(); const sb = document.getElementById('state-search'); if (sb) sb.value = ''; buildLangBar('lang-bar-state'); renderStatePicker(); }

function renderHome() {
  const s = currentState;
  document.getElementById('home-title').textContent = t('title', { state: s.code.toUpperCase(), state_name: s.name, agency: s.agency, pass_pct: s.passing_score_pct });
  document.getElementById('home-subtitle').textContent = t('subtitle', { state: s.code.toUpperCase(), state_name: s.name, agency: s.agency });
  document.getElementById('home-passing').textContent = t('passingScore', { pass_pct: s.passing_score_pct, pass_count: Math.ceil(s.test_question_count * s.passing_score_pct / 100), test_count: s.test_question_count });
  const total = s.total_questions, counts = [10, 25, 50, 100].filter(n => n <= total);
  if (!counts.includes(total)) counts.push(total);
  const sel = document.getElementById('count-selector');
  sel.innerHTML = counts.map(n => {
    const label = n === total ? 'All' : n;
    const active = n === Math.min(50, total);
    return `<button class="count-btn px-5 py-2.5 border-2 border-blue-600 rounded-xl text-base font-semibold cursor-pointer transition-colors ${active ? 'bg-blue-600 text-white' : 'bg-white text-blue-600 hover:bg-blue-50'}" data-count="${n}">${label}</button>`;
  }).join('');
  selectedCount = Math.min(50, total);
  sel.querySelectorAll('.count-btn').forEach(btn => btn.addEventListener('click', () => {
    sel.querySelectorAll('.count-btn').forEach(b => { b.classList.remove('bg-blue-600','text-white'); b.classList.add('bg-white','text-blue-600'); });
    btn.classList.remove('bg-white','text-blue-600'); btn.classList.add('bg-blue-600','text-white');
    selectedCount = parseInt(btn.dataset.count);
  }));
  const avail = s.languages.length > 0 ? s.languages : Object.keys(I18N);
  if (!avail.includes(currentLang)) { currentLang = 'en'; localStorage.setItem('quiz_lang', 'en'); }
  buildLangBar('lang-bar', avail); applyI18n(); updateStartScreen();
}

function goHome() { showScreen('start-screen'); setMode('random'); renderHome(); window.scrollTo({ top: 0 }); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function getWeakQuestionIds(store) {
  const weak = [];
  for (const [id, data] of Object.entries(store.questions)) if (data.wrong > 0 && data.seen >= 1) weak.push({ id: parseInt(id), missRate: data.wrong / data.seen, wrong: data.wrong, seen: data.seen });
  weak.sort((a, b) => b.missRate - a.missRate || b.wrong - a.wrong);
  return weak;
}

function updateStartScreen() {
  const store = loadStore(), h = store.history, banner = document.getElementById('past-stats-banner');
  if (!h.length) { banner.classList.add('hidden'); document.getElementById('weak-count').classList.add('hidden'); return; }
  banner.classList.remove('hidden');
  document.getElementById('banner-quizzes').textContent = h.length;
  document.getElementById('banner-avg').textContent = Math.round(h.reduce((s, r) => s + r.pct, 0) / h.length) + '%';
  let streak = 0; for (let i = h.length - 1; i >= 0; i--) { if (h[i].pct >= currentState.passing_score_pct) streak++; else break; }
  document.getElementById('banner-streak').textContent = streak;
  const weakIds = getWeakQuestionIds(store), wc = document.getElementById('weak-count');
  if (weakIds.length > 0) { wc.classList.remove('hidden'); wc.classList.add('inline-block'); wc.textContent = weakIds.length; } else wc.classList.add('hidden');
}

function setMode(mode) {
  quizMode = mode;
  ['mode-random','mode-weak'].forEach(id => {
    const el = document.getElementById(id), active = id === `mode-${mode}`;
    el.classList.toggle('border-blue-500', active); el.classList.toggle('bg-blue-50', active); el.classList.toggle('text-blue-600', active);
    el.classList.toggle('border-gray-200', !active); el.classList.toggle('bg-white', !active);
  });
  const store = loadStore(), weakIds = getWeakQuestionIds(store), btn = document.getElementById('start-btn');
  if (mode === 'weak' && !weakIds.length) { btn.disabled = true; btn.textContent = t('noWeakSpots'); }
  else { btn.disabled = false; btn.textContent = t('startQuiz'); }
}

function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

function startQuiz() {
  if (quizMode === 'weak') { startWeakQuiz(); return; }
  const data = getStateQuestions(currentState.code, currentLang); if (!data) return;
  questions = shuffleArray([...data.questions]).slice(0, Math.min(selectedCount, data.questions.length));
  beginQuiz();
}

function startWeakQuiz() {
  const store = loadStore(), weakIds = getWeakQuestionIds(store); if (!weakIds.length) return;
  const data = getStateQuestions(currentState.code, currentLang); if (!data) return;
  const count = Math.min(selectedCount, weakIds.length), idSet = new Set(weakIds.slice(0, count).map(w => w.id));
  questions = shuffleArray(data.questions.filter(q => idSet.has(q.id))).slice(0, count);
  beginQuiz();
}

function beginQuiz() { currentIdx = 0; correctCount = 0; wrongCount = 0; sessionResults = []; showScreen('quiz-screen'); showQuestion(); }

function showQuestion() {
  answered = false; const q = questions[currentIdx];
  document.getElementById('progress').style.width = `${(currentIdx / questions.length) * 100}%`;
  document.getElementById('q-counter').textContent = `${currentIdx + 1} / ${questions.length}`;
  document.getElementById('score-correct').textContent = correctCount;
  document.getElementById('score-wrong').textContent = wrongCount;
  document.getElementById('q-category').textContent = q.category.replace(/_/g, ' ');
  document.getElementById('q-text').textContent = q.question;
  const imgWrap = document.getElementById('q-image-wrap'), imgEl = document.getElementById('q-image');
  if (q.image) { imgEl.src = `signs/${q.image}`; imgWrap.style.display = 'block'; } else { imgWrap.style.display = 'none'; imgEl.src = ''; }
  document.getElementById('explanation').classList.remove('visible');
  document.getElementById('next-btn').classList.remove('visible');
  const store = loadStore(), qData = store.questions[q.id], missBadge = document.getElementById('q-miss-badge');
  if (qData?.wrong > 0) { missBadge.textContent = `${t('missed')} ${Math.round((qData.wrong / qData.seen) * 100)}%`; missBadge.style.display = 'inline-block'; } else missBadge.style.display = 'none';
  const choicesDiv = document.getElementById('choices'); choicesDiv.innerHTML = '';
  ['A','B','C','D'].forEach(letter => {
    if (!q.choices[letter]) return;
    const btn = document.createElement('button');
    btn.className = 'choice-btn flex items-start gap-3 p-3.5 bg-white border-2 border-gray-200 rounded-xl text-base leading-relaxed cursor-pointer text-left w-full text-gray-900 hover:border-blue-300 active:scale-[0.98] transition-all';
    btn.innerHTML = `<span class="letter shrink-0 w-7 h-7 flex items-center justify-center bg-gray-100 rounded-full font-bold text-sm text-gray-500">${letter}</span><span>${q.choices[letter]}</span>`;
    btn.addEventListener('click', () => selectAnswer(letter, btn));
    choicesDiv.appendChild(btn);
  });
}

function selectAnswer(letter, btn) {
  if (answered) return; answered = true;
  const q = questions[currentIdx], correct = q.answer, isCorrect = letter === correct;
  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b => b.classList.add('disabled'));
  if (isCorrect) { btn.classList.add('correct'); correctCount++; }
  else { btn.classList.add('wrong'); wrongCount++; const ci = ['A','B','C','D'].indexOf(correct); if (ci >= 0 && allBtns[ci]) allBtns[ci].classList.add('correct'); }
  const store = loadStore();
  if (!store.questions[q.id]) store.questions[q.id] = { seen: 0, wrong: 0, category: q.category };
  store.questions[q.id].seen++; if (!isCorrect) store.questions[q.id].wrong++; saveStore(store);
  sessionResults.push({ id: q.id, question: q.question, yourAnswer: letter, yourAnswerText: q.choices[letter], correctAnswer: correct, correctAnswerText: q.choices[correct], correct: isCorrect, explanation: q.explanation });
  document.getElementById('explanation').textContent = q.explanation;
  document.getElementById('explanation').classList.add('visible');
  document.getElementById('score-correct').textContent = correctCount;
  document.getElementById('score-wrong').textContent = wrongCount;
  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = currentIdx < questions.length - 1 ? t('next') : t('seeResults');
  nextBtn.classList.add('visible');
}

function nextQuestion() { currentIdx++; if (currentIdx >= questions.length) { showResults(); return; } showQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function showResults() {
  const pct = Math.round((correctCount / questions.length) * 100), pass = pct >= currentState.passing_score_pct;
  const store = loadStore(); store.history.push({ date: new Date().toISOString(), correct: correctCount, total: questions.length, pct, mode: quizMode }); saveStore(store);
  showScreen('results-screen');
  const circle = document.getElementById('results-circle');
  circle.className = `w-40 h-40 rounded-full flex flex-col items-center justify-center mx-auto mb-6 border-[6px] ${pass ? 'border-green-500 text-green-600' : 'border-red-500 text-red-600'}`;
  document.getElementById('results-pct').textContent = `${pct}%`;
  document.getElementById('results-label').textContent = pass ? t('pass') : t('fail');
  document.getElementById('result-msg').textContent = pass ? t('congratulations') : t('keepPracticing');
  document.getElementById('result-detail').textContent = t('resultDetail', { correct: correctCount, total: questions.length, pass_pct: currentState.passing_score_pct, agency: currentState.agency });
  const wrongResults = sessionResults.filter(r => !r.correct);
  const reviewTitle = document.getElementById('review-title'), reviewList = document.getElementById('review-list');
  if (wrongResults.length > 0) {
    reviewTitle.textContent = t('reviewMissed', { count: wrongResults.length });
    reviewList.innerHTML = wrongResults.map(r => `<div class="bg-white rounded-xl p-3.5 mb-2.5 border-l-4 border-red-500"><div class="font-semibold text-sm mb-1.5">${esc(r.question)}</div><div class="text-xs text-gray-500">${t('yourAnswer')}: <strong class="text-gray-900">${r.yourAnswer}: ${esc(r.yourAnswerText)}</strong></div><div class="text-xs text-gray-500">${t('correct')}: <strong class="text-gray-900">${r.correctAnswer}: ${esc(r.correctAnswerText)}</strong></div><div class="text-xs text-gray-500 mt-1.5 italic">${esc(r.explanation)}</div></div>`).join('');
  } else { reviewTitle.textContent = t('perfectScore'); reviewList.innerHTML = `<p class="text-gray-500">${t('perfectMsg')}</p>`; }
  applyI18n(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function showStats() {
  const store = loadStore(), h = store.history;
  showScreen('stats-screen'); applyI18n();
  document.getElementById('s-total').textContent = h.length;
  document.getElementById('s-avg').textContent = (h.length ? Math.round(h.reduce((s, r) => s + r.pct, 0) / h.length) : 0) + '%';
  document.getElementById('s-seen').textContent = Object.keys(store.questions).length;
  document.getElementById('s-best').textContent = (h.length ? Math.max(...h.map(r => r.pct)) : 0) + '%';
  let streak = 0; for (let i = h.length - 1; i >= 0; i--) { if (h[i].pct >= currentState.passing_score_pct) streak++; else break; }
  document.getElementById('s-streak').textContent = streak;
  const canvas = document.getElementById('chart'), emptyMsg = document.getElementById('chart-empty');
  if (h.length < 2) { canvas.style.display = 'none'; emptyMsg.style.display = 'flex'; emptyMsg.textContent = h.length === 0 ? t('chartEmpty') : t('chartOneMore'); }
  else { canvas.style.display = 'block'; emptyMsg.style.display = 'none'; drawChart(canvas, h); }
  const catStats = {};
  for (const [id, data] of Object.entries(store.questions)) { const cat = data.category || 'unknown'; if (!catStats[cat]) catStats[cat] = { seen: 0, correct: 0 }; catStats[cat].seen += data.seen; catStats[cat].correct += data.seen - data.wrong; }
  const catBars = document.getElementById('cat-bars');
  const sortedCats = Object.entries(catStats).sort((a, b) => (a[1].correct / a[1].seen) - (b[1].correct / b[1].seen));
  if (!sortedCats.length) document.getElementById('cat-bars-section').style.display = 'none';
  else {
    document.getElementById('cat-bars-section').style.display = 'block';
    catBars.innerHTML = sortedCats.map(([cat, data]) => {
      const pct = Math.round((data.correct / data.seen) * 100);
      const color = pct >= 80 ? '#16a34a' : pct >= 60 ? '#ea580c' : '#dc2626';
      return `<div class="flex items-center gap-2.5 mb-2 text-xs"><span class="w-28 shrink-0 capitalize truncate">${cat.replace(/_/g, ' ')}</span><div class="flex-1 h-2.5 bg-gray-200 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:${color}"></div></div><span class="w-9 text-right font-semibold" style="color:${color}">${pct}%</span></div>`;
    }).join('');
  }
  const weakIds = getWeakQuestionIds(store), weakSection = document.getElementById('weak-section'), weakList = document.getElementById('weak-list');
  if (!weakIds.length) weakSection.style.display = 'none';
  else {
    weakSection.style.display = 'block';
    weakList.innerHTML = weakIds.slice(0, 15).map(w => {
      const qData = store.questions[w.id];
      return `<div class="bg-white rounded-xl py-3 px-3.5 mb-2 border border-gray-200 border-l-4 border-l-orange-500"><div class="text-sm font-semibold mb-1">Q${w.id}</div><div class="text-xs text-gray-500">${t('missed')} <span class="text-red-600 font-semibold">${w.wrong}/${w.seen} (${Math.round(w.missRate * 100)}%)</span> &middot; ${(qData.category || '').replace(/_/g, ' ')}</div></div>`;
    }).join('');
  }
  window.scrollTo({ top: 0 });
}

function drawChart(canvas, history) {
  const dpr = window.devicePixelRatio || 1, rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = 180 * dpr; canvas.style.height = '180px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  const W = rect.width, H = 180, pad = { top: 20, right: 16, bottom: 30, left: 36 };
  const plotW = W - pad.left - pad.right, plotH = H - pad.top - pad.bottom;
  const data = history.slice(-20), n = data.length, passPct = currentState.passing_score_pct;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1; ctx.fillStyle = '#9ca3af'; ctx.font = '11px system-ui'; ctx.textAlign = 'right';
  for (let pct of [0, 25, 50, 75, 100]) { const y = pad.top + plotH - (pct / 100) * plotH; ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke(); ctx.fillText(pct + '%', pad.left - 6, y + 4); }
  const passY = pad.top + plotH - (passPct / 100) * plotH;
  ctx.strokeStyle = '#16a34a40'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(pad.left, passY); ctx.lineTo(W - pad.right, passY); ctx.stroke(); ctx.setLineDash([]);
  const points = data.map((d, i) => ({ x: pad.left + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW), y: pad.top + plotH - (d.pct / 100) * plotH, pct: d.pct }));
  ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
  points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)); ctx.stroke();
  ctx.beginPath(); points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.lineTo(points[points.length - 1].x, pad.top + plotH); ctx.lineTo(points[0].x, pad.top + plotH); ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
  grad.addColorStop(0, 'rgba(37, 99, 235, 0.2)'); grad.addColorStop(1, 'rgba(37, 99, 235, 0.02)');
  ctx.fillStyle = grad; ctx.fill();
  points.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fillStyle = p.pct >= passPct ? '#16a34a' : '#dc2626'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); });
  ctx.fillStyle = '#9ca3af'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
  const startNum = history.length - data.length + 1, step = n <= 10 ? 1 : 2;
  points.forEach((p, i) => { if (i % step === 0 || i === n - 1) ctx.fillText('#' + (startNum + i), p.x, H - pad.bottom + 16); });
}

function clearData() { if (confirm(t('resetConfirm', { state_name: currentState.name }))) { localStorage.removeItem(storeKey()); goHome(); } }
</script>
