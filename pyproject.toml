[tool.ruff]
target-version = "py310"
line-length = 99
exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # handled by ruff format; string literals are intentionally left long

[tool.pyright]
typeCheckingMode = "basic"
include = ["tools/", "web/"]
extraPaths = ["tools"]
pythonVersion = "3.10"
