- id: 45
  category: safe_driving_rules
  question: 右側からの追い越しが許可されるのはどのような場合ですか？
  choices:
    A: 決して許可されない
    B: 同じ進行方向に複数の車線がある道路、または前方の車が左折しようとしており、右側に十分なスペースがある場合のみ
    C: 高速道路ではいつでも許可される
    D: 路肩でのみ許可される
  answer: B
  explanation: 右側からの追い越しは、同じ進行方向に複数の車線がある道路、または前方の車が左折しようとしており、右側に十分なスペースがある場合のみ許可されます。右側の路肩を使って追い越しをしてはいけません。
- id: 46
  category: safe_driving_rules
  question: 2本の実線の中央線（センターライン）は何を意味しますか？
  choices:
    A: 注意すれば追い越し可能
    B: どちらの側からでも追い越し可能
    C: どちらの方向からも追い越し禁止
    D: トラックのみ追い越し可能
  answer: C
  explanation: 両方の中央線が実線の場合、追い越しは禁止されています。
- id: 47
  category: safe_driving_rules
  question: 多方向一時停止（マルチウェイ・ストップ）の交差点で、2台の車が同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の運転手
    B: 右側の運転手
    C: 直進する運転手
    D: 右折する運転手
  answer: B
  explanation: 多方向一時停止の交差点で同時に到着した場合、運転手は右側の車に道を譲らなければなりません。
- id: 48
  category: safe_driving_rules
  question: 停電により信号機が作動していない場合、どのように対処すべきですか？
  choices:
    A: 譲れ（Yield）の標識として扱う
    B: 注意信号として扱う
    C: 4方向一時停止（4-way stop）として扱う
    D: 青信号であるかのように扱う
  answer: C
  explanation: 停電により信号機が点灯していない場合、4方向一時停止（4-way stop）の信号として扱われます。(N.J.S.A. 39:4-81)
- id: 49
  category: safe_driving_rules
  question: ニュージャージー州では、赤信号での右折は合法ですか？
  choices:
    A: いいえ、決して合法ではありません
    B: はい、「赤信号右折禁止（No Turn on Red）」の標識がない限り、完全に一時停止し、交通状況を確認した後であれば合法です
    C: はい、道が空いていれば一時停止せずに右折できます
    D: 高速道路でのみ合法です
  answer: B
  explanation: ニュージャージー州の法律では、「赤信号右折禁止（No Turn on Red）」の標識がない限り、完全に一時停止し、交通状況を確認した後の赤信号での右折が認められています。(N.J.S.A.
    39:4-115)
- id: 50
  category: safe_driving_rules
  question: 赤いランプを点滅させているスクールバスに近づいた場合、運転手は何をしなければなりませんか？
  choices:
    A: 25 mphに減速し、注意して進む
    B: 少なくとも25フィート離れた場所で停止する
    C: 少なくとも15フィート離れた場所で停止する
