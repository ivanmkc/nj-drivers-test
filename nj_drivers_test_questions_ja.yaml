  answer: B
  explanation: 州法により、運転手は赤いランプを点滅させているスクールバスから少なくとも25フィート離れた場所で停止することが義務付けられています。(N.J.S.A.
    39:4-128.1)
- id: 51
  category: safe_driving_rules
  question: スクールバスが学校の真ん前に停車している場合、運転者は時速何マイル以下で追い越すことができますか？
