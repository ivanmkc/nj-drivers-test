    C: 15 mph
    D: 25 mph
  answer: B
  explanation: スクールバスが学校の真ん前に停車している場合、運転者はいずれの方向からも10 mph以下の速度で追い越すことができます。
- id: 52
  category: safe_driving_rules
  question: 警報機が作動している場合、運転者は線路からどのくらい離れた位置で停止しなければなりませんか？
  choices:
