- id: 65
  category: safe_driving_rules
  question: 横断歩道にいる歩行者のために停止しなかった場合の罰則は何ですか？
  choices:
    A: 最高$200の罰金および2点の違反点数
    B: 最高$500の罰金、最長25日の拘留、社会奉仕活動、最長6ヶ月の免許停止、および2点の違反点数
    C: $100の罰金のみ
    D: 警告のみ
  answer: B
  explanation: 停止しなかった場合、最高$500の罰金、最長25日の拘留、社会奉仕活動、最長6ヶ月の免許停止、および2点の違反点数が科せられます。(N.J.S.A.
    39:4-36)
- id: 66
