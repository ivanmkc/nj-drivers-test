  answer: B
  explanation: 対向車が通り過ぎるまで道路の右側を見ます。接近してくる運転者に対して絶対にハイビームを点滅させてはいけません。
- id: 173
  category: defensive_driving
  question: 接近するハイビームの眩しさから視力が回復するのにどれくらいの時間がかかりますか：
