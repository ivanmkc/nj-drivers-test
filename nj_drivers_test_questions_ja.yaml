  explanation: 加速車線を出る際は交通の流れに合わせて加速し、すでに高速道路を走行している車両に道を譲り、安全が確認できたら右側車線に進入します。
- id: 184
  category: driver_responsibility
  question: 横滑り（スリップ）している際、従来型（非ABS）ブレーキの正しい操作方法は何ですか？
  choices:
    A: ブレーキを強く踏み込む
    B: ブレーキを離し、車両を制御できるようになるまで少し弱めの力で踏み直す
    C: ブレーキを素早くポンピングする
    D: パーキングブレーキを使用する
  answer: B
  explanation: ブレーキがロックした場合はペダルを離し、少し弱めの力で踏み直します。車両を制御できるようになるまで、さらに弱い力でこれを繰り返します。
- id: 185
