  explanation: 接近するハイビームのヘッドライトの眩しさから視力が回復するのに、3〜5秒かかることがあります。
- id: 174
  category: penalties_and_points
  question: 飲酒運転(DUI)または呼気検査の拒否に対する追加徴収金（サーチャージ）はいくらですか：
  choices:
