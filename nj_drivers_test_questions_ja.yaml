- id: 62
  category: safe_driving_rules
  question: ムーブ・オーバー法（車線変更義務法）では何が義務付けられていますか？
  choices:
    A: すべての車両に対して車線を変更すること
    B: 停車中の緊急車両、レッカー車、または故障車から離れた車線に変更するか、車線変更が不可能な場合は減速すること
    C: 常に右側の車線に移動すること
    D: 合流してくる交通に道を譲ること
  answer: B
  explanation: ムーブ・オーバー法では、運転者は停車中の緊急車両から離れた車線に変更するか、車線変更が不可能な場合は減速することが義務付けられています。罰金：$100〜$500。(N.J.S.A.
    39:4-92.2)
- id: 63
