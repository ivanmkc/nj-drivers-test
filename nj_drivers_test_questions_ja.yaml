  explanation: 車両が前進している間にバックアップライト（後退灯）を点灯させることはニュージャージー州法違反です。(N.J.S.A. 39:3-52)
- id: 194
  category: safe_driving_rules
  question: ニキル法（Nikhil's Law）の安全誓約では、運転者に何を誓約することを求めていますか？
  choices:
    A: 絶対にスピード違反をしないこと
    B: 一時停止標識で完全に停止すること、常に注意を払うこと、ハンズフリー電話を使用すること、事前に計画を立てること
    C: 常にシートベルトを着用すること
    D: 絶対に飲酒運転をしないこと
  answer: B
  explanation: ニキル法の誓約には、「完全に停止する（Stop Completely）」、「常に注意を払う（Stay Alert）」、「安全に通話する（ハンズフリー）（Talk
    Safe）」、「事前に計画を立てる（Plan Ahead）」が含まれます。
- id: 195
