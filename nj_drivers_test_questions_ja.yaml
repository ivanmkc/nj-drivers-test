    D: $1,000
  answer: B
  explanation: 免許停止中の運転の初犯：$500の罰金および最大6ヶ月の追加の免許停止。
- id: 123
  category: penalties_and_points
  question: 警察の報告書が作成されない場合、事故報告書は何日以内にMVCに提出しなければなりませんか？
  choices:
    A: 5日
    B: 10日
    C: 15日
    D: 30日
  answer: B
  explanation: 警察の報告書が作成されない場合、10日以内に書面による報告書をMVCに提出しなければなりません。
- id: 124
  category: penalties_and_points
  question: 損害がいくらを超えた場合、事故を警察に報告しなければなりませんか？
  choices:
    A: $200
    B: $500
    C: 人身傷害がある場合は金額に関わらず
    D: BとCの両方
  answer: D
  explanation: ニュージャージー州法では、負傷、死亡、または$500を超える車両・器物破損を伴う事故が発生した場合、運転者は警察に報告することが義務付けられています。
- id: 125
  category: penalties_and_points
  question: 州外での違反によりニュージャージー州の運転記録に加算される点数は何点ですか？
  choices:
    A: 1点
    B: 2点
    C: ニュージャージー州での同等の違反と同じ点数
    D: なし
  answer: B
  explanation: 他州で犯した交通違反については、運転記録に2点が加算されます。
- id: 126
  category: sharing_the_road
  question: 安全追い越し法（Safe Passing Law）では、単一車線の道路で自転車を追い越す際、運転者は少なくともどのくらいの間隔を空けることが義務付けられていますか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 6フィート
  answer: C
  explanation: 単一車線の道路では、運転者は交通弱者を追い越す際に少なくとも4フィートの安全地帯を確保しなければなりません。（N.J.S.A. 39:4-92.4）
- id: 127
  category: sharing_the_road
  question: 4フィートの追い越し間隔を確保できない場合、運転者はどうしなければなりませんか？
  choices:
    A: クラクションを鳴らして素早く追い越す
    B: 時速25マイルまで減速し、安全に追い越せるようになるまで停止する準備をする
    C: 自転車が移動するまで完全に停止する
    D: 路肩を走行する
  answer: B
  explanation: 4フィートの間隔を確保できない場合、運転者は時速25マイルまで減速し、安全に追い越せるようになるまで停止する準備をしなければなりません。
- id: 128
  category: sharing_the_road
  question: 交通の流れに復帰する際、常に優先権を譲らなければならない対象はどの車両ですか？
  choices:
    A: パトカーのみ
    B: バスと郵便車両
    C: タクシーとライドシェア車両
    D: トラックのみ
  answer: B
  explanation: 運転者は、バスや郵便車両が交通の流れに復帰する際、それらの車両に道を譲らなければなりません。
- id: 129
  category: sharing_the_road
  question: オートバイ事故の最も一般的な原因は何ですか？
  choices:
    A: オートバイ運転者のスピードの出しすぎ
    B: 劣悪な道路状況
    C: 自動車の運転者が交通の中でオートバイを発見・認識できないこと
    D: 機械的故障
  answer: C
  explanation: 自動車の運転者が交通の中でオートバイを発見・認識できないことが、オートバイ事故の最も一般的な原因です。
- id: 130
  category: sharing_the_road
  question: 悪天候時、トラックが停止するまでにどれくらい余分に時間がかかることがありますか？
  choices:
    A: 10%長くかかる
    B: 25%長くかかる
    C: 50%長くかかる
    D: 75%長くかかる
  answer: B
  explanation: 悪天候時、トラック、トラクタートレーラー、またはバスは、停止するまでに最大25%長く時間がかかることがあります。
- id: 131
  category: sharing_the_road
  question: 大型トラックの後方にあるノーゾーン（死角）はどのくらいの距離ですか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: C
  explanation: トラックの後方にあるノーゾーン（死角）は、最大200フィートまで及ぶことがあります。
- id: 132
  category: sharing_the_road
  question: 白または金属製の杖を使用している人に近づいた際、運転手が停止しなければならない理由は次のうちどれですか？
  choices:
    A: マナーだから
    B: その人は視覚障害があり、法律で義務付けられているから
    C: その人は高齢者だから
    D: 推奨されているが、義務ではないから
  answer: B
  explanation: 法律により、すべての運転手は、白または金属製の杖を使用している、あるいは盲導犬を連れている視覚障害者のために停止することが義務付けられています。(N.J.S.A.
    39:4-37.1)
- id: 133
  category: sharing_the_road
  question: 車両の速度が何mphから何mphに上がると、歩行者の死亡率は5%から85%に跳ね上がりますか？
  choices:
    A: 15 mphから35 mph
    B: 20 mphから40 mph
    C: 25 mphから45 mph
    D: 30 mphから50 mph
  answer: B
  explanation: 車両と歩行者の衝突事故における死亡率は、20 mphでは5%ですが、40 mphになると85%に跳ね上がります。
- id: 134
  category: sharing_the_road
  question: 多車線道路の横断歩道で停止する場合、横断歩道の約どのくらい手前で停止すべきですか？
  choices:
    A: 10フィート
    B: 20フィート
    C: 30フィート
    D: 50フィート
  answer: C
  explanation: 第2車線を走る運転手の視界を遮らないようにするため、多車線道路の横断歩道では約30フィート手前で停止してください。
- id: 135
  category: sharing_the_road
  question: 乗馬している人に近づく際、運転手は速度をどのくらいまで落とさなければなりませんか？
  choices:
    A: 10 mph以下
    B: 15 mph以下
    C: 25 mph以下
    D: 35 mph以下
  answer: C
  explanation: 乗馬している人や馬車に近づいたり追い越したりする際、運転手は速度を25 mph以下に落とさなければなりません。(N.J.S.A. 39:4-72)
- id: 136
  category: sharing_the_road
  question: 55 mphで走行している貨物列車が停止するまでに、どのくらいの距離がかかることがありますか？
  choices:
    A: 500フィート
    B: 半マイル
    C: 1マイル以上
    D: 2マイル
  answer: C
  explanation: 55 mphで走行している貨物列車は、停止するまでに1マイル以上の距離がかかることがあります。
- id: 137
  category: sharing_the_road
  question: 踏切からどのくらいの距離以内では、他の車両を追い越してはいけませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: B
  explanation: 踏切から100フィート以内では、他の車両を追い越してはいけません。
- id: 138
  category: sharing_the_road
  question: ニュージャージー州法において、自転車、スケートボード、インラインスケートの利用者はどのような扱いになりますか？
  choices:
    A: 道路上での権利が制限されている
    B: 自動車と同じ権利と責任を持つ
    C: 常に自動車に道を譲らなければならない
    D: 自転車専用レーンのみを使用できる
  answer: B
  explanation: ニュージャージー州法の下では、自転車、スケートボード、インラインスケートの利用者は、自動車と同じ権利と責任を持っています。
- id: 139
  category: sharing_the_road
  question: モペッド（原動機付自転車）の制限速度は次のうちどれですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: モペッドの運転手は25 mphを超えて運転してはいけません。
- id: 140
  category: sharing_the_road
  question: アンマークド・クロスウォーク（標示のない横断歩道）とは何ですか？
  choices:
    A: ペイントが色あせた横断歩道
    B: ペイントされた線で標示されていなくても、すべての交差点に存在する横断歩道
    C: 交通規則を無視して横断するエリア
    D: 私有地にある横断歩道
  answer: B
  explanation: 標示がなくても、すべての交差点には横断歩道が存在します。これはアンマークド・クロスウォーク（標示のない横断歩道）として知られています。
- id: 141
  category: vehicle_information
  question: 自動車損害賠償責任保険は：
  choices:
    A: ニュージャージー州では任意である
    B: ニュージャージー州では義務である
    C: 新車にのみ義務付けられている
    D: 商用車にのみ義務付けられている
  answer: B
  explanation: ニュージャージー州では、自動車損害賠償責任保険への加入が義務付けられています。登録されたすべての車両は保険に加入していなければなりません。（N.J.S.A.
    39:6B-1）
- id: 142
  category: vehicle_information
  question: ニュージャージー州に転入後、どのくらいの期間内に車両の権利証（タイトル）の取得と登録を行わなければなりませんか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 1年
  answer: B
  explanation: 運転者がニュージャージー州に転入した場合、60日以内、または他州での登録がそれより早く切れる場合はその期限までに、車両の権利証（タイトル）の取得と登録を行わなければなりません。
- id: 143
  category: vehicle_information
  question: 乗用車（製造年から5年以上経過している場合）は、どのくらいの頻度で州の車検に合格しなければなりませんか？
  choices:
    A: 毎年
    B: 2年ごと
    C: 3年ごと
    D: 5年ごと
  answer: B
  explanation: 製造年から5年以上経過している乗用車は、2年ごとに州の車検に合格しなければなりません。
- id: 144
  category: vehicle_information
  question: 製造年から5年未満の新しい乗用車には、いつ有効期限が切れるディーラーステッカーが交付されますか？
  choices:
    A: 登録から1年後
    B: 登録から2年後
    C: 初回登録から5年後
    D: 登録から3年後
  answer: C
  explanation: 製造年から5年未満の新しい乗用車には、初回登録から5年後に有効期限が切れるステッカーが交付されます。
- id: 145
  category: vehicle_information
  question: ニュージャージー州に転入して車両を登録した後、どのくらいの期間内に車検を受けなければなりませんか（製造年から5年以上経過している場合）？
  choices:
    A: 7日
    B: 14日
    C: 30日
    D: 60日
  answer: B
  explanation: 製造年から5年以上経過している車両は、ニュージャージー州で登録した後、14日以内に車検を受けなければなりません。
- id: 146
  category: vehicle_information
  question: ナンバープレートは夜間に50フィート離れた場所から見える必要があります。どのくらいの高さに取り付けなければなりませんか？
  choices:
    A: 地上から6インチ以上36インチ未満
    B: 地上から12インチ以上48インチ未満
    C: 地上から18インチ以上60インチ未満
    D: 任意の高さ
  answer: B
  explanation: ナンバープレートは、地上から12インチ以上48インチ未満の高さに取り付けなければなりません。（N.J.S.A. 39:3-33）
- id: 147
  category: vehicle_information
  question: 運転者が自動車保険を解約した場合、ナンバープレートはどうしなければなりませんか？
  choices:
    A: 次の車のために保管する
    B: MVC（自動車委員会）に返却する
    C: 破棄する
    D: 何もしない
  answer: B
  explanation: 運転者が自動車保険を解約した場合、ナンバープレートはMVC（自動車委員会）に返却しなければなりません。
- id: 148
  category: vehicle_information
  question: 文字を隠すようなナンバープレートカバーを使用した場合の罰金はいくらですか？
  choices:
    A: 最大50ドル
    B: 最大100ドル
    C: 最大200ドル
    D: 最大500ドル
  answer: B
  explanation: 文字を隠したり見えなくしたりするナンバープレートカバーやホルダーの使用は違反であり、最大100ドルの罰金が科せられます。
- id: 149
  category: signs_and_signals
  question: 黄色の信号機は何を意味しますか？
  choices:
    A: 通過するためにスピードを上げる
    B: 安全に停止するには近すぎる場合を除き、交差点に入る前に停止する
    C: 注意して進む
    D: 対向車に道を譲る
  answer: B
  explanation: 青信号の後に黄色の信号が点灯した場合、運転者は安全に停止するには近すぎる場合を除き、交差点に入る前に停止しなければなりません。
- id: 150
  category: signs_and_signals
  question: 赤の点滅信号は何を意味しますか？
  choices:
    A: 道を譲ってから進む
    B: 停止し、安全を確認してから進む
    C: 減速する
    D: 緊急車両が接近している
  answer: B
  explanation: 赤の点滅信号では、完全に停止し、安全を確認してから進む必要があります。
- id: 151
  category: signs_and_signals
  question: 「長時間点灯している青信号（stale green light）」とはどういう意味ですか？
  choices:
    A: 故障している信号機
    B: しばらく青のままで、まもなく変わる可能性のある信号
    C: 青の矢印信号
    D: 夜間の青信号
  answer: B
  explanation: 「長時間点灯している青信号（stale green light）」とは、しばらくの間青色になっている信号のことです。黄色、そして赤色に変わることに備えてください。
- id: 152
  category: signs_and_signals
  question: 破線の中央線が意味するものは次のうちどれですか？
  choices:
    A: 追い越し禁止
    B: 破線がある側では追い越しが許可されている
    C: 道路が工事中である
    D: 一方通行
  answer: B
  explanation: 片側が破線の中央線：破線がある側でのみ追い越しが許可されています。
- id: 153
  category: signs_and_signals
  question: 警戒標識（warning sign）は何色ですか？
  choices:
    A: 赤色
    B: 緑色
    C: 黄色（ひし形）
    D: 青色
  answer: C
  explanation: 警戒標識は黄色でひし形をしています。
- id: 154
  category: signs_and_signals
  question: 規制標識（一時停止や制限速度など）は何色ですか？
  choices:
    A: 黄色
    B: 白地に黒文字（または一時停止/ゆずり合いの場合は赤色）
    C: 緑色
    D: 青色
  answer: B
  explanation: 規制標識は通常、白地に黒文字です。一時停止標識（Stop sign）は赤色です。ゆずり合い標識（Yield sign）は赤と白です。
- id: 155
  category: signs_and_signals
  question: 一時停止標識（Stop sign）はどのような形をしていますか？
  choices:
    A: 円形
    B: 正方形
    C: ひし形
    D: 八角形
  answer: D
  explanation: 一時停止標識は八角形であり、この形をした唯一の標識です。
- id: 156
  category: signs_and_signals
  question: ゆずり合い標識（Yield sign）はどのような形をしていますか？
  choices:
    A: 八角形
    B: 逆三角形
    C: ひし形
    D: 長方形
  answer: B
  explanation: ゆずり合い標識は逆三角形（逆さまの三角形）をしています。
- id: 157
  category: signs_and_signals
  question: 高速道路にある案内/情報標識は何色ですか？
  choices:
    A: 黄色
    B: 白色
    C: 緑色
    D: オレンジ色
  answer: C
  explanation: 緑色の標識は、高速道路にある案内/情報標識で、方向や距離を示しています。
- id: 158
  category: signs_and_signals
  question: 工事区間の標識は何色ですか？
  choices:
    A: 黄色
    B: 赤色
    C: オレンジ色
    D: 緑色
  answer: C
  explanation: 工事区間の警戒標識はオレンジ色です。
- id: 159
  category: signs_and_signals
  question: 交差点で道路を横切るように引かれた1本の実線の白線が意味するものは次のうちどれですか？
  choices:
    A: 合流する
    B: 信号機や標識に従い、線の手前で停止する
    C: 加速する
    D: この先工事区間
  answer: B
  explanation: 交差点で道路を横切るように引かれた1本の実線の白線（停止線）は、運転者が信号機や標識に従ってその線の手前で停止しなければならないことを意味します。
- id: 160
  category: signs_and_signals
  question: 青色の高速道路標識は何を示していますか？
  choices:
    A: 警告
    B: 規制
    C: サービス（ガソリンスタンド、食事、病院）
    D: 工事
  answer: C
  explanation: 青色の標識は、ガソリンスタンド、食事、病院など、高速道路の近くで利用できるサービスを示しています。
- id: 161
  category: safe_driving_rules
  question: 走行中の車両からのポイ捨ては、以下の結果を招く可能性があります：
  choices:
    A: 警告
    B: 最大1,000ドルの罰金および免許取り消しの可能性
    C: 50ドルの罰金
    D: 社会奉仕活動のみ
  answer: B
  explanation: 危険物を投げ捨てた場合、最大1,000ドルの罰金が科せられます。走行中の車両から投げ捨てた場合、運転者は免許を失う可能性があります。(N.J.S.A.
    39:4-63)
- id: 162
  category: driver_responsibility
  question: 一酸化炭素（CO）とは何ですか？
  choices:
    A: 排気ガスから出る目に見えるガス
    B: 車両の排気ガスに含まれる無臭・無色のガス
    C: エンジンの無害な副産物
    D: 腐った卵のような臭いのするガス
  answer: B
  explanation: 一酸化炭素は、車両の排気ガスに含まれる無臭・無色のガスであり、命に関わる危険性があります。
- id: 163
  category: defensive_driving
  question: 衝突が避けられない場合、衝突する対象として選ぶべきなのは：
  choices:
    A: 正面から向かってくるもの
    B: 向かってくるものより動いていないもの、硬いものより衝撃を吸収してくれる（変形する）もの
    C: 最も大きな物体
    D: 何にもぶつからないこと（常に道路外に急ハンドルを切る）
  answer: B
  explanation: 正面から向かってくるものよりも、同じ方向に動いているもの、次に動いていないものを選びます。硬い物体よりも、衝撃を吸収してくれる物体（茂みなど）を選んでください。
- id: 164
  category: safe_driving_rules
  question: 標識のないトラフィックサークル（円形交差点）では、誰に優先権がありますか？
  choices:
    A: サークルに進入する車両
    B: 右側から接近する車両
    C: すでにサークル内にいる車両
    D: 最も大きな車両
  answer: B
  explanation: 信号や標識のない交差点やサークルの基本ルール：左側の車両は、右側から接近する車両に道を譲らなければなりません。
- id: 165
  category: safe_driving_rules
  question: 高速道路で降りる出口を通り過ぎてしまった場合、どうするべきですか？
  choices:
    A: 出口のランプ（傾斜路）をバックする
    B: 高速道路上で停止してバックする
    C: 次の出口まで進む
    D: Uターンする
  answer: C
  explanation: 出口を通り過ぎてしまった場合は、次の出口まで進んでください。出口のランプや高速道路上で絶対にバックしてはいけません。
- id: 166
  category: penalties_and_points
  question: ニュージャージー州で合法的にアルコールを購入または消費できる最低年齢は何歳ですか？
  choices:
    A: 18歳
    B: 19歳
    C: 20歳
    D: 21歳
  answer: D
  explanation: ニュージャージー州では、アルコールの購入、所持、または消費は21歳以上でなければなりません。
- id: 167
  category: alcohol_drugs_health
  question: クレシュ、クバート、ボリス法（Kulesh's, Kuberts' and Bolis' Law）により、運転中の違法な携帯電話の使用は以下に該当すると定められています：
  choices:
    A: 軽微な交通違反
    B: 車両による殺人および自動車による暴行の法律に基づく無謀行為
    C: 軽犯罪
    D: 駐車違反
  answer: B
  explanation: この法律は、運転中の違法な携帯電話の使用を、車両による殺人および自動車による暴行の法律に基づく無謀行為として定めています。
- id: 168
  category: sharing_the_road
  question: トラックに関する「ノーゾーン（no-zone）」とは何を意味しますか？
  choices:
    A: トラック付近の駐車禁止区域
    B: トラックの運転手から他の車両が見えない死角
    C: 速度制限区域
    D: 高速道路の追い越し禁止区域
  answer: B
  explanation: ノーゾーンとは、トラックの周囲にある、トラックの運転手から他の車両が見えない死角のことです。
- id: 169
  category: sharing_the_road
  question: 安全追い越し法（Safe Passing Law）に違反し、人身傷害を引き起こした場合の罰金はいくらですか？
  choices:
    A: 100ドル
    B: 250ドル
    C: 500ドルの罰金および自動車違反点数2点
    D: 1,000ドル
  answer: C
  explanation: 人身傷害が生じた場合：500ドルの罰金および2点。負傷者がない場合：100ドルの罰金および点数なし。(N.J.S.A. 39:4-92.4)
- id: 170
  category: defensive_driving
  question: ABS（アンチロック・ブレーキ・システム）について、運転者はどのように対処すべきですか？
  choices:
