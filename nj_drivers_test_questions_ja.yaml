    39:3-74)
- id: 68
  category: safe_driving_rules
  question: 安全地帯（セーフティアイランド）のある対面通行の幹線道路で、反対車線にスクールバスがいる場合、運転者はどうしなければなりませんか？
  choices:
    A: 完全に停止する
    B: 時速10マイルに減速する
    C: 制限速度で走り続ける
    D: 時速25マイルに減速する
  answer: B
  explanation: 対面通行の幹線道路を走行中、安全地帯（セーフティアイランド）や盛り上がった中央分離帯の反対側にスクールバスがいる場合、運転者は時速10マイルに減速しなければなりません。
- id: 69
  category: safe_driving_rules
  question: 交差点に近づく際、運転者はどこで停止しなければなりませんか？
  choices:
    A: 最も近い横断歩道から10フィート以内
    B: 最も近い横断歩道または停止線から5フィート以内
    C: 交差点から少なくとも15フィート手前
    D: 停止線、または交差点の25フィート手前
  answer: B
  explanation: 運転者は、最も近い横断歩道または停止線から5フィート以内で車両を完全に停止させなければなりません。
- id: 70
  category: defensive_driving
  question: 「3秒プラスのルール」とは何ですか？
  choices:
    A: 車線変更をする前に3秒先を見る
    B: 信号が青に変わってから3秒待って進む
    C: 前方の車両との間に少なくとも3秒の車間距離を保つ
    D: 曲がる3秒前に合図を出す
  answer: C
  explanation: 前方の固定された目標物を選びます。前の車がその目標物を通過してから、自分の車が同じ目標物を通過するまでに少なくとも3秒かかれば、急停止のための十分な距離が確保されています。
- id: 71
  category: defensive_driving
  question: 悪天候の場合、3秒間の車間距離ルールはどのくらいに増やすべきですか？
  choices:
    A: 3秒
    B: 4秒以上
    C: 2秒
    D: ちょうど6秒
  answer: B
  explanation: 悪天候の間は、車間距離の時間を4秒以上に増やす必要があります。
- id: 72
  category: defensive_driving
  question: 車間距離の経験則（目安）は次のうちどれですか？
  choices:
    A: 時速10マイル(10 mph)につき車2台分
    B: 時速10マイル(10 mph)につき車1台分（約20フィート）
    C: 時速20マイル(20 mph)につき車1台分
    D: すべての速度において車3台分
  answer: B
  explanation: 最もよく使われる経験則は、時速10マイル(10 mph)ごとに車1台分（約20フィート）の車間距離を保つことです。
- id: 73
  category: defensive_driving
  question: 通常の昼間の条件下で、時速60マイル(60 mph)での総停止距離はどれくらいですか？
  choices:
    A: 247フィート
    B: 302フィート
    C: 343フィート
    D: 409フィート
  answer: C
  explanation: 時速60マイル(60 mph)の場合：空走距離（66フィート）＋ 制動距離（277フィート）＝ 総停止距離343フィートとなります。
- id: 74
  category: defensive_driving
  question: 車両は時速60マイル(60 mph)で走行しているとき、1秒間に何フィート進みますか？
  choices:
    A: 44フィート
    B: 66フィート
    C: 88フィート
    D: 110フィート
  answer: C
  explanation: 車両は時速60マイル(60 mph)で走行しているとき、1秒間に88フィート進みます。
- id: 75
  category: defensive_driving
  question: ハイドロプレーニング現象はどの速度から発生する可能性がありますか？
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: 濡れた路面では、時速約35マイル(35 mph)からタイヤがハイドロプレーニング現象を起こす原因となります。時速55マイル(55 mph)を超えると、タイヤが完全に路面から浮き上がる可能性があります。
- id: 76
  category: defensive_driving
  question: スキッド（横滑り）が発生した場合、運転手はどうするべきですか？
  choices:
    A: ブレーキを急激に踏み込む
    B: スキッドしている方向とは逆の方向にハンドルを切る
    C: ハンドルを切りすぎないように注意しながら、車両の後部がスキッドしている方向にハンドルを切る
    D: 加速する
  answer: C
  explanation: スピンを避けるため、運転手はハンドルを切りすぎないように注意しながら、車両の後部がスキッドしている方向にハンドルを切る必要があります。進みたい方向を見てください。
- id: 77
  category: defensive_driving
  question: ハイウェイ・ヒプノシス（高速道路催眠現象）の原因は何ですか？
  choices:
    A: スピードの出しすぎ
    B: 長時間の運転中に、一つのものを数秒以上見つめ続けること
    C: 窓を閉め切って運転すること
    D: 大音量の音楽
  answer: B
  explanation: ハイウェイ・ヒプノシスは、一つのものを数秒以上見つめないようにすることで防ぐことができます。2時間ごとに休憩を取ってください。
- id: 78
  category: defensive_driving
  question: マギーズ法（Maggie's Law）とは何ですか？
  choices:
    A: 携帯電話に関する運転法
    B: 疲労状態での運転を、車両による殺人罪の規定において無謀運転とみなす法律
    C: シートベルト着用法
    D: 制限速度に関する法律
  answer: B
  explanation: マギーズ法は、睡眠不足により運転能力が低下していることを知りながら運転することを違法とし、疲労状態での運転を車両による殺人罪の規定において無謀運転と定めています。(N.J.S.A.
    2C:11-5)
- id: 79
  category: defensive_driving
  question: 車両の車輪が路肩にそれてしまった場合、運転手はどうするべきですか？
  choices:
    A: すぐに舗装路に戻るようにハンドルを切る
    B: 路肩にとどまり、アクセルを緩めて時速25マイル(25 mph)以下に減速してから、ハンドルを4分の1回転させて道路に戻る
    C: ブレーキを急激に踏み込む
    D: 加速して道路に戻る
  answer: B
  explanation: 路肩にとどまり、アクセルを緩めます。時速25マイル(25 mph)以下に減速した後、ハンドルを車道に向かって4分の1回転させます。
- id: 80
  category: defensive_driving
