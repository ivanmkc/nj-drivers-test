    C: 罰金100ドルのみ
    D: 成人と同じ罰則
  answer: B
  explanation: BAC 0.01%〜0.08%の未成年の初犯：30〜90日間の免許停止、15〜30日間の社会奉仕活動、およびIDRC/アルコール教育プログラムへの参加。
- id: 201
  category: safe_driving_rules
  question: 次の場合には常に合図（ウィンカー）を出してください：
  choices:
    A: 車線を変更するとき。
    B: 駐車スペースに入るとき、または出るとき。
    C: 駐車場や路地から車道に出るとき。
    D: 上記すべて。
  answer: D
  explanation: 左右に移動する際は、常に方向指示器（ウィンカー）を使用する必要があります。路肩の駐車スペースから車道に出るとき、新しい車線に移動するとき、または他の車両を追い越すときには、合図を出さなければなりません。
