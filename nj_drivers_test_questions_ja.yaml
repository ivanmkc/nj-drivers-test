    B: 一定の圧力をかける。ABSブレーキをポンピングしたり、ハンドルを急に切ったりしてはいけない
    C: 雨天時のみ使用する
    D: 軽く叩くように踏む
  answer: B
  explanation: ABS搭載車では、ブレーキペダルに一定の圧力をかけ続けてください。ブレーキをかける際に、ABSブレーキをポンピングしたり、ハンドルを激しく切ったりしてはいけません。
- id: 171
  category: driver_responsibility
  question: チャイルドシート安全法に違反した場合の罰金は次のうちどれですか：
  choices:
    A: 25ドル以上50ドル以下
    B: 50ドル以上75ドル以下、および手数料と裁判費用
    C: 100ドル以上200ドル以下
    D: 500ドル
  answer: B
  explanation: チャイルドシート安全法に違反した場合、50ドル以上75ドル以下の罰金、および手数料と裁判費用が科せられます。
- id: 172
