metadata:
  source: 2025年 ニュージャージー州運転者マニュアル (www.njmvc.gov)
  source_original: 2025 New Jersey Driver Manual (www.njmvc.gov)
  total_questions: 298
  passing_score: 80%（実際のMVC試験では50問中40問正解）
  language: ja
  categories:
  - license_system
  - driver_testing
  - driver_responsibility
  - safe_driving_rules
  - defensive_driving
  - alcohol_drugs_health
  - penalties_and_points
  - sharing_the_road
  - vehicle_information
  - signs_and_signals
questions:
- id: 1
  category: license_system
  question: ニュージャージー州の運転者が自動車を運転する際、携帯しなければならないものは何ですか？
  choices:
    A: 有効な運転免許証のみ
    B: 有効な運転免許証、有効な保険証、および車両登録証
    C: 有効な運転免許証と車両登録証のみ
    D: 有効な運転免許証と住所証明書
  answer: B
  explanation: 運転者は、有効な運転免許証（または仮免許証）、有効な保険証、および車両登録証を携帯しなければなりません。(N.J.S.A. 39:3-29)
- id: 2
  category: license_system
  question: 運転者が住所変更をした場合、いつまでにMVCに報告しなければなりませんか？
  choices:
    A: 30日以内
    B: 2週間以内
    C: 1週間以内
    D: 60日以内
  answer: C
  explanation: 住所を変更した運転者は、引っ越し後1週間以内にMVCに報告しなければなりません。(N.J.S.A. 39:3-36)
- id: 3
  category: license_system
  question: 運転者が法的な氏名変更をした場合、いつまでにMVCに報告しなければなりませんか？
  choices:
    A: 1週間以内
    B: 2週間以内
    C: 30日以内
    D: 60日以内
  answer: B
  explanation: 法的に氏名を変更した運転者は、2週間以内にMVCに報告しなければなりません。(N.J.S.A. 39:3-9a)
- id: 4
  category: license_system
  question: 有効な他州の免許証を持つ運転者がニュージャージー州に引っ越した場合、いつまでにニュージャージー州の免許証を申請しなければなりませんか？
  choices:
    A: 30日以内
    B: 90日以内
    C: 60日以内、または現在の免許証の有効期限が切れる前のいずれか早い方
    D: 1年以内
  answer: C
  explanation: 他州の運転者は、60日以内、または現在の免許証の有効期限が切れる前のいずれか早い方までに申請しなければなりません。CDL（商用運転免許）保持者は30日以内です。(N.J.S.A.
    39:3-17.1)
- id: 5
  category: license_system
  question: ニュージャージー州の運転免許証の有効期間はどのくらいですか？
  choices:
    A: 2年
    B: 4年
    C: 5年
    D: 6年
  answer: B
  explanation: ニュージャージー州の運転免許証の有効期間は4年です。
- id: 6
  category: license_system
  question: ニュージャージー州で特別仮免許 (Special Learner Permit) を取得できる最低年齢は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 17歳
    D: 18歳
  answer: B
  explanation: 特別仮免許は、GDL（段階的運転免許）オプションAに基づき、16歳で取得できます。
- id: 7
  category: license_system
  question: GDLプログラムにおいて、路上試験の前に必要な運転練習時間は何時間ですか？
  choices:
    A: 25時間（うち夜間5時間を含む）
    B: 30時間（うち夜間10時間を含む）
    C: 50時間（うち夜間10時間を含む）
    D: 40時間（うち夜間15時間を含む）
  answer: C
  explanation: GDL仮免許保持者は、夜間の10時間を含む最低50時間の運転練習を完了しなければなりません。
- id: 8
  category: license_system
  question: 21歳未満のGDL仮免許および初心者免許 (Probationary license) 保持者の運転時間制限はどうなっていますか？
  choices:
    A: 午後10時から午前6時までは運転禁止
    B: 午後11時1分から午前5時までは運転禁止
    C: 午前0時から午前5時までは運転禁止
    D: 午後9時から午前6時までは運転禁止
  answer: B
  explanation: 21歳未満のGDL仮免許および初心者免許保持者は、午後11時1分から午前5時までの間は運転できません。
- id: 9
  category: license_system
  question: 21歳未満のGDL運転者に対する携帯電話に関する規定は何ですか？
  choices:
    A: ハンズフリー機器のみ使用可能
    B: 手持ち式、ハンズフリー式を問わず、携帯電話やその他の電子機器の使用は一切禁止
    C: 緊急時のみ携帯電話の使用が可能
    D: 赤信号の時のみテキスト送信が可能
  answer: B
  explanation: GDL保持者は、運転中に手持ち式またはハンズフリー式の携帯電話、およびその他の電子機器を使用することはできません。
- id: 10
  category: license_system
  question: GDLデカールはいくつ、どこに表示しなければなりませんか？
  choices:
    A: 後部のナンバープレートに1枚
    B: 車両の両側面に1枚ずつ、計2枚
    C: 前部のナンバープレートの左上と後部のナンバープレートの左上に1枚ずつ、計2枚
    D: 後部の窓に2枚
  answer: C
  explanation: 視認できる赤い反射デカールを2枚表示しなければなりません。1枚は前部ナンバープレートの左上隅に、もう1枚は後部ナンバープレートの左上隅に貼付します。
- id: 11
  category: license_system
  question: GDL（段階的運転免許）仮免許所持者を同乗者として監督するための最低年齢は何歳ですか？
  choices:
    A: 有効なニュージャージー州の運転免許証を持つ18歳
    B: 有効なニュージャージー州の運転免許証を持ち、最低3年の運転経験がある21歳
    C: 有効なニュージャージー州の運転免許証を持つ25歳
    D: ニュージャージー州の運転免許証を持つすべての運転手
  answer: B
  explanation: 監督する運転手は21歳以上であり、有効なニュージャージー州の運転免許証を所持し、最低3年間の運転経験がある必要があります。
- id: 12
  category: license_system
  question: 基本免許（basic license）を取得するまでの、試用免許（probationary license）の期間はどのくらいですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 18ヶ月
  answer: B
  explanation: 試用免許の所持者は、基本免許を取得する前に、監督者なしでの運転を少なくとも1年間練習する必要があります。
- id: 13
  category: license_system
  question: ニュージャージー州の運転免許証を取得するには、何ポイントの身分証明（ID verification）が必要ですか？
  choices:
    A: 4ポイント
    B: 5ポイント
    C: 6ポイント
    D: 8ポイント
  answer: C
  explanation: すべての申請者は、6ポイント分の身分証明を提出する必要があります。
- id: 14
  category: license_system
  question: 他国の有効な運転免許証を持つ運転手は、ニュージャージー州で最長どのくらいの期間運転できますか？
  choices:
    A: 30日
    B: 60日
    C: 6ヶ月
    D: 1年
  answer: D
  explanation: 他国の有効な運転免許証を持つ運転手は、その免許証で最長1年間運転することができます。（N.J.A.C. 13:21-8.2(f)）
- id: 15
  category: license_system
  question: 運転免許証を改ざんしたり、改ざんされた免許証を提示した場合の罰則は何ですか？
  choices:
    A: 警告
    B: 100ドルの罰金
    C: 運転特権の喪失、最高1,000ドルの罰金、および/または禁錮刑
    D: 社会奉仕活動のみ
  answer: C
  explanation: 運転免許証を改ざんしたり、改ざんされたものを提示したりすると、運転特権の喪失、最高1,000ドルの罰金、および/または禁錮刑が科される可能性があります。
- id: 16
  category: license_system
  question: GDLオプションC（成人向けルート）の場合、最低年齢と監督下での練習期間はどのくらいですか？
  choices:
    A: 18歳、6ヶ月の監督下での運転
    B: 21歳、3ヶ月の監督下での運転
    C: 21歳、6ヶ月の監督下での運転
    D: 25歳、1ヶ月の監督下での運転
  answer: B
  explanation: GDLオプションCでは、最低年齢が21歳であり、少なくとも3ヶ月間の監督下での運転練習が必要です。
- id: 17
  category: driver_testing
  question: ニュージャージー州MVC（自動車委員会）の学科試験に合格するには、どのくらいのスコアが必要ですか？
  choices:
    A: 70%（50問中35問正解）
    B: 75%（50問中37問正解）
    C: 80%（50問中40問正解）
    D: 90%（50問中45問正解）
  answer: C
  explanation: 80パーセント、つまり50問中40問に正解する必要があります。
- id: 18
  category: driver_testing
  question: 基本免許の申請者に必要な最低視力の要件は何ですか？
  choices:
    A: 視力20/20
    B: 視力20/40
    C: 矯正レンズの有無にかかわらず視力20/50
    D: 視力20/70
  answer: C
  explanation: 基本免許の申請者は、矯正レンズの有無にかかわらず20/50の視力が必要です。
- id: 19
  category: driver_testing
  question: CDL（商用運転免許）の申請者に必要な最低視力の要件は何ですか？
  choices:
    A: 両眼で視力20/50
    B: 矯正レンズの有無にかかわらず両眼で視力20/40
    C: 両眼で視力20/20
    D: 片眼で視力20/30
  answer: B
  explanation: CDLの申請者は、矯正レンズの有無にかかわらず両眼で20/40の視力があり、さらに赤、緑、黄色の光を識別できる能力が必要です。
- id: 20
  category: driver_testing
  question: ニュージャージー州MVCの学科試験は何問ありますか？
  choices:
    A: 25問
    B: 40問
    C: 50問と臓器提供に関するアンケート1問
    D: 100問
  answer: C
  explanation: 学科試験は50問の質問と、臓器提供に関するアンケート1問で構成されています。
- id: 21
  category: driver_responsibility
  question: ニュージャージー州のシートベルト法では、18歳未満の同乗者のシートベルト着用について誰が責任を負いますか？
  choices:
    A: 同乗者自身
    B: 運転手
    C: 親（車内にいなくても）
    D: 誰も負わない（未成年者の着用は任意）
  answer: B
  explanation: 運転手は、18歳未満のすべての同乗者のシートベルト着用に対して責任を負います。
- id: 22
  category: driver_responsibility
  question: シートベルトを着用することで、運転手が衝突事故で生存する確率は何パーセント向上しますか？
  choices:
    A: 30パーセント
    B: 45パーセント
    C: 60パーセント
    D: 80パーセント
  answer: C
  explanation: シートベルトは、運転手が衝突事故で生存する確率を60パーセント向上させることができます。
- id: 23
  category: driver_responsibility
  question: 何歳未満の子供は後部座席に乗らなければなりませんか？
  choices:
    A: 5歳
    B: 6歳
    C: 8歳
    D: 10歳
  answer: C
  explanation: 8歳未満のすべての子供は後部座席に座らなければなりません。
- id: 24
  category: driver_responsibility
  question: 2歳未満、または体重30ポンド未満の子供は、何に乗らなければなりませんか？
  choices:
    A: 前向きのチャイルドシート
    B: ブースターシート
    C: 5点式ハーネス付きの後ろ向きチャイルドシート（幼児用拘束装置）
    D: 通常のシートベルト
  answer: C
  explanation: 2歳未満および体重30ポンド未満の子供は、連邦政府に承認された5点式ハーネス付きの後ろ向きチャイルドシート（幼児用拘束装置）に乗らなければなりません。
- id: 25
  category: driver_responsibility
  question: ハンドル（ステアリングホイール）の正しい手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置
    C: 8時と4時の位置
    D: 片手で12時の位置
  answer: B
  explanation: 運転手は、親指をハンドルの表面に沿わせながら、9時と3時の位置でハンドルを握る必要があります。
- id: 26
  category: driver_responsibility
  question: 時速20マイル（20 mph）で走行している場合、運転手はどのくらいの距離以内で停止できなければなりませんか？
  choices:
    A: 15フィート
    B: 25フィート
    C: 35フィート
    D: 50フィート
  answer: B
  explanation: 運転手は、時速20マイル（20 mph）のとき、25フィート以内で停止できなければなりません。
- id: 27
  category: driver_responsibility
  question: 曲がる前に、どのくらい手前から方向指示器（ウィンカー）を作動させなければなりませんか？
  choices:
    A: 50フィート
    B: 75フィート
    C: 100フィート
    D: 200フィート
  answer: C
  explanation: 運転手は、曲がる少なくとも100フィート手前で方向指示器を出さなければなりません。（N.J.S.A. 39:4-126）
- id: 28
  category: driver_responsibility
  question: 右折の正しい手信号（ハンドシグナル）はどれですか？
  choices:
    A: 手と腕をまっすぐ横に伸ばす
    B: 手と腕を上に向ける
    C: 手と腕を下に向ける
    D: 手を振る動作
  answer: B
  explanation: 右折：手と腕を上に向ける。左折：手と腕をまっすぐ横に伸ばす。停止：手と腕を下に向ける。
- id: 29
  category: driver_responsibility
  question: 縁石のある上り坂の通りに駐車する場合、車輪はどちらの方向に向けなければなりませんか？
  choices:
    A: 縁石の方向
    B: 縁石から離れる方向
    C: まっすぐ前
    D: どちらでもよい
  answer: B
  explanation: 上り坂に駐車する場合、車輪は縁石から離れる方向に向けなければなりません。
- id: 30
  category: driver_responsibility
  question: 縁石のある下り坂の通りに駐車する場合、車輪はどちらの方向に向けなければなりませんか？
  choices:
    A: 縁石の方向
    B: 縁石から離れる方向
    C: まっすぐ前
    D: どちらでもよい
  answer: A
  explanation: 下り坂に駐車する場合、車輪は縁石の方向に向けなければなりません。
- id: 31
  category: driver_responsibility
  question: 縦列駐車をする際、車のタイヤから縁石までの最大距離はどれくらいですか？
  choices:
    A: 12インチ
    B: 6インチ
    C: 18インチ
    D: 3インチ
  answer: B
  explanation: 縦列駐車をする際、車のタイヤは縁石から6インチ以内でなければなりません。
- id: 32
  category: driver_responsibility
  question: ニュージャージー州法により、車のアイドリングは何分までに制限されていますか？
  choices:
    A: 1分
    B: 3分
    C: 5分
    D: 10分
  answer: B
  explanation: ニュージャージー州法では、すべての運転手に対し、車のアイドリングを3分以下に制限することが義務付けられています。(N.J.A.C. 7:27-15.8)
- id: 33
  category: driver_responsibility
  question: 運転前に車から雪や氷を取り除かなかった場合の罰金はいくらですか？
  choices:
    A: $10から$25
    B: $25から$75
    C: $100から$500
    D: $500から$1,000
  answer: B
  explanation: 雪や氷が落下したかどうかにかかわらず、$25から$75の罰金が科せられます。落下した雪や氷が怪我や器物損壊を引き起こした場合、最大$1,500の罰金が科せられることがあります。
- id: 34
  category: driver_responsibility
  question: ダッシュボードやフロントガラスに衝突した際の衝撃が、3階建ての建物から落下した時と同じになるのはどの速度ですか？
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: 30 mphでダッシュボードやフロントガラスに衝突することは、3階建ての建物の屋上から落下することと同じ衝撃です。
- id: 35
  category: driver_responsibility
  question: エアバッグは最大でどのくらいの速度で膨らみますか？
  choices:
    A: 50 mph
    B: 100 mph
    C: 150 mph
    D: 200 mph
  answer: D
  explanation: エアバッグは最大200 mphの速度で膨らみます。
- id: 36
  category: driver_responsibility
  question: 運転手はハンドルから最低どれくらいの距離を空けて座るべきですか？
  choices:
    A: 6インチ
    B: ハンドルの中心から胸骨の中心まで10インチ
    C: 12インチ
    D: 18インチ
  answer: B
  explanation: 運転手は、ハンドルの中心と胸骨の中心との間に少なくとも10インチの距離を保つ必要があります。
- id: 37
  category: driver_responsibility
  question: 後退（バック）する際、車はどのくらいの速度で走行するべきですか？
  choices:
    A: 5〜10 mph
    B: 歩行速度（2〜4 mph）
    C: 10〜15 mph
    D: 20 mph未満
  answer: B
  explanation: 車はゆっくりと後退させる必要があります。通常は歩行速度（2〜4 mph）です。
- id: 38
  category: driver_responsibility
  question: 路上試験では、運転手はどれくらいの距離を後退（バック）できなければなりませんか？
  choices:
    A: 50フィート
    B: 75フィート
    C: 100フィート
    D: 200フィート
  answer: C
  explanation: 路上試験では、運転手は車を直線で約100フィート後退させるよう求められます。
- id: 39
  category: driver_responsibility
  question: 安全なタイヤの最小溝深さはどれくらいですか？
  choices:
    A: 1/8インチ
    B: 1/16インチ
    C: 1/4インチ
    D: 1/32インチ
  answer: B
  explanation: 溝の深さが1/16インチ（ペニー硬貨の縁くらい）未満のタイヤで車を運転してはいけません。
- id: 40
  category: driver_responsibility
  question: 通常の状況下で、クラクションは少なくともどれくらいの距離まで聞こえる必要がありますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 通常の状況下では、クラクションは少なくとも200フィート先まで聞こえる必要があります。(N.J.S.A. 39:3-69)
- id: 41
  category: safe_driving_rules
  question: スクールゾーン、商業地域、または住宅街での制限速度はどれくらいですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: スクールゾーン、商業地域、または住宅街では25 mphです。
- id: 42
  category: safe_driving_rules
