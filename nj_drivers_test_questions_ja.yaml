    39:4-127.1)
- id: 53
  category: safe_driving_rules
  question: 運転者は緊急車両からどのくらい後方を維持しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: 運転者は、サイレンや赤色灯を使用している緊急車両から少なくとも300フィート後方を維持する必要があります。(N.J.S.A. 39:4-92)
- id: 54
  category: safe_driving_rules
  question: ヘッドライトはいつ使用しなければなりませんか？
  choices:
    A: 日没後のみ
