  question: 主要な幹線道路（ハイウェイ）を運転するときは：
  choices:
    A: 常に警戒を怠らない。
    B: 視線を動かし続ける。
    C: 道路上の危険に反応できるように準備しておく。
    D: 上記すべて。
  answer: D
  explanation: ハイウェイでは常に警戒を怠らず、予期せぬ危険に反応できるように準備しておくことが重要です。「ハイウェイ・ヒプノシス（高速道路催眠現象）」を防ぐため、一つのものを数秒以上見つめ続けることは避けてください。
- id: 203
  category: sharing_the_road
  question: 上り坂を運転中、後方から大型トラックに近づいています。次のことを知っておく必要があります：
  choices:
    A: トラックは制限速度より遅い速度で走行している可能性がある。
    B: トラックを安全に追い越すことができない可能性がある。
    C: トラックを合法的に追い越すことができない可能性がある。
    D: 上記すべて。
  answer: D
  explanation: 運転者は、大型車両が特に上り坂を走行する際、制限速度より遅い速度で走行することが多いことを認識し、後方から大型車両に近づく際は注意を払う必要があります。視界が限られている坂道で他の車両を追い越すことは違法です。
- id: 204
  category: defensive_driving
  question: 周囲の他の運転手が怒って行動したり反応したりしているのを見た場合：
  choices:
    A: 目を合わせない。
    B: 手のジェスチャーで反応しない。
    C: その状況から距離を置く。
    D: これらすべて。
  answer: D
  explanation: 他の運転手が怒って行動している場合、その状況から物理的および精神的に距離を置く行動をとるべきです。目を合わせたり、相手を挑発するような体の動きやジェスチャーをしたりすることは避けてください。速度を落とす、車線を変更するなど、危険から身を守るために安全にできることは何でも行ってください。
- id: 205
  category: safe_driving_rules
  question: 白杖を持っていたり、盲導犬を連れて歩いている人は、次の可能性が高いです：
  choices:
    A: 耳が不自由な人。
    B: 交通調査に関わっている人。
    C: 目が不自由な人。
    D: 上記のどれでもない。
  answer: C
  explanation: 歩行者が白杖を使用している、または盲導犬を連れている目の不自由な人である場合、運転者は常にその歩行者に通行権（優先権）を譲らなければなりません。
- id: 206
  category: safe_driving_rules
  question: フリーウェイで、曲がる場所や出口を通り過ぎてしまったことに気づきました。あなたはどうするべきですか：
  choices:
    A: 走行車線から素早く曲がる。
    B: 停止して後退（バック）する。
    C: 安全に方向転換できる次の曲がり角、出口、またはその他の場所に到達するまで運転を続ける。
    D: 曲がれるように、他の運転手に停止するよう合図を送る。
  answer: C
  explanation: 曲がる場所や出口を通り過ぎてしまった場合は、後退（バック）せず、安全に方向転換できる次の曲がり角や出口まで進んでください。路肩やフリーウェイで後退することは違法です。
- id: 207
  category: safe_driving_rules
  question: 曲がるときや車線を変更するときは、次のようにしなければなりません：
  choices:
    A: 目に見える交通がない場合でも、常に自分の意図を合図する。
    B: 目に見える交通がある場合のみ合図する。
    C: 夜間運転時のみ合図する。
    D: 夜間の交通量が多い場合のみ合図する。
  answer: A
  explanation: 車線を変更するとき、曲がるとき、または縁石から発進するときは、常に自分の意図を合図してください。怠慢になり、この法律に従わないという悪い習慣を身につけないようにしてください。
- id: 208
  category: alcohol_drugs_health
  question: アルコールと一緒に薬物を摂取することは：
  choices:
    A: 衝突事故を起こすリスクを高める。
    B: アルコールを単独で摂取するよりも危険ではない。
    C: 運転能力に対するアルコールの影響を軽減する。
    D: 一般的な運転能力には影響しない。
  answer: A
  explanation: 薬物（違法薬物、処方薬、市販薬を含む）は脳の機能に影響を与え、安全に運転する能力を低下させる可能性があります。アルコールと他の薬物を組み合わせると、衝突事故のリスクが高まります。
- id: 209
  category: signs_and_signals
  question: 濡れた路面を運転する際、覚えておくべき重要なことは：
  choices:
    A: 雨が降り始めた直後は、路面が特に滑りやすくなること。
    B: 濡れた道路はハイドロプレーニング現象を引き起こす可能性があること。
    C: 停止する際には、通常より多くの車間距離を取ること。
    D: 上記すべて。
  answer: D
  explanation: 濡れた路面は、特に雨が降った直後は危険なほど滑りやすくなることがあります。濡れた道路を運転しているとき、あなたの車は油、泥、水の薄い層の上を走行しています。滑りやすい路面でタイヤがトラクション（グリップ力）を失うリスクを減らすため、大雨、水たまり、または道路にシャーベット状の雪がある場合は速度を落としてください。
- id: 210
  category: signs_and_signals
  question: 右を指す曲がった矢印が描かれたひし形の黄色い標識は、次のことを示しています：
  choices:
    A: 一方通行の道路。
    B: 右折禁止。
    C: 出口。
    D: この先、道路に急な右カーブあり。
  answer: D
  explanation: 曲がった矢印が描かれたひし形の黄色い警告標識は、この先に急なカーブがあることを運転手に警告するものです。
- id: 211
  category: safe_driving_rules
  question: 交差点での青信号は、次のことを意味します：
  choices:
    A: 減速して停止する準備をしなければならない。
    B: 進む前に一旦停止し、対向車を確認しなければならない。
    C: 前方の道路が安全であれば、交差点を通過してもよい。
    D: 右折してはならない。
  answer: C
  explanation: 青信号は、前方の道路が安全であれば交差点を通過してもよいことを意味します。また、標識で禁止されていない限り、青信号で右折または左折することもできます。曲がる際は、交差点内の他の車両や歩行者に道を譲らなければなりません。
- id: 212
  category: vehicle_information
  question: シートベルトは次のように調整する必要があります：
  choices:
    A: 緩くする。
    B: 骨盤と下腹部にぴったりと合うように締める。
    C: 座席の下に隠す。
    D: シートベルトのブザーや警告灯が作動しないようにする。
  answer: B
  explanation: ラップベルト（腰ベルト）は、骨盤と下腹部にぴったりと合うように締める必要があります。ショルダーベルト（肩ベルト）は、ベルトと胸の間に拳が入る程度の余裕を持たせ、快適にフィットするようにします。
- id: 213
  category: safe_driving_rules
  question: 夜間に道路沿いに停車する場合：
  choices:
    A: すべてのライトを消す。
    B: パーキングライトのみを使用する。
    C: ヘッドライトのみを使用する。
    D: ハザードランプ（非常点滅表示灯）を点灯させ、ロービームを点灯したままにする。
  answer: D
  explanation: 夜間に道路沿いに停車する場合は、ハザードランプ（非常点滅表示灯）を点灯させ、ロービームのヘッドライトを点灯したままにしてください。他の道路利用者があなたの車両をはっきりと視認できるようにしてください。
- id: 214
  category: safe_driving_rules
  question: 対面通行の2車線道路では、次の条件を満たさない限り、安全に追い越しをすることはできません：
  choices:
    A: 前方の道路をはっきりと見ることができる。
    B: 対向車とすれ違う前に自分の車線に戻ることができる。
    C: 自分の車両が追い越しに必要な速度を出すことができる。
    D: 上記のすべて。
  answer: D
  explanation: 対面通行の2車線道路を走行中、前方の道路がはっきりと見え、対向車とすれ違う前に自分の車線に戻ることができ、かつ自分の車両が追い越しに必要な速度を出せる場合でなければ、安全に追い越しをすることはできません。違法であったり、安全が確保できない場所では追い越しをしないでください。
- id: 215
  category: signs_and_signals
  question: 道路上の2本の実線の黄色い線は、次のことを意味します：
  choices:
    A: 両方向の運転手に対して追い越しが許可されている。
    B: 追い越しは禁止されている。
    C: 丘の頂上にいる場合は追い越しが許可されている。
    D: 日中のみ追い越しが許可されている。
  answer: B
  explanation: 黄色い線は、線の反対側の交通が反対方向に進んでいることを示しています。どちらの方向からであっても、2本の実線の黄色い線を越えて追い越しをしてはいけません。
- id: 216
  category: safe_driving_rules
  question: 運転手が他の車両の右側から合法的に追い越しできるのは次の場合です：
  choices:
    A: その車両が左折待ちをしており、利用可能な追い越し車線がある場合。
    B: 舗装路から外れて走行することになってもよい。
    C: 狭い橋の上。
    D: いつでも。
  answer: A
  explanation: 利用可能な追い越し車線がある場合、左折中または左折待ちをしている車両や自転車の右側から追い越すことができます。また、同じ方向に進む2車線以上の多車線道路を走行している場合も、右側からの追い越しは合法です。他の車両を追い越すために、舗装路や道路の主要な走行部分から外れて走行しては絶対にいけません。
- id: 217
  category: sharing_the_road
  question: スクールゾーンで交通誘導員（クロッシングガード）が交通整理をしている場合、あなたは次のようにしなければなりません：
  choices:
    A: 交通誘導員の指示に従う。
    B: 交通誘導員の指示に関わらず、周囲の車の動きを真似る。
    C: その誘導員は交通整理をする権限がないとみなす。
    D: 子供がいない場合に適用されるルールに従う。
  answer: A
  explanation: 標識、交通誘導員、または警察官から指示された場合は、減速して注意を払う準備をしてください。スクールゾーンでは常に細心の注意を払って運転してください。
- id: 218
  category: safe_driving_rules
  question: 曲がる、車線変更する、または縁石から発進する前に合図（ウィンカー）を出すことは：
  choices:
    A: 他の車両がいる場合のみ必要である。
    B: 良い運転習慣であり、法律で義務付けられている。
    C: 操作中のみ必要であり、その前には必要ない。
    D: ゆっくりと操作を行う場合は必要ない。
  answer: B
  explanation: 車線変更や右左折をする際は、十分に前から合図を出してください。法律では、車両を左右に動かす少なくとも100フィート手前から合図を出すことが義務付けられています。縁石から発進する前には、通過する運転手に自分の意図を知らせるために必ず合図を出してください。
- id: 219
  category: signs_and_signals
  question: 点滅するライトをつけた緊急車両があなたの運転している地域を走行している場合、次のようにすべきです：
  choices:
    A: 緊急車両を避けるために加速する。
    B: すぐに車両を停止させ、緊急車両の通過を妨げる。
    C: 緊急車両が進路を確保できるよう、あらゆる努力をする。
    D: 緊急車両があなたを追い越しても安全な時に合図を送る。
  answer: C
  explanation: 点滅するライトをつけた緊急車両があなたの運転している地域を走行している場合、緊急車両が進路を確保できるよう、あらゆる努力をしなければなりません。安全であれば、車両を道路の端に寄せて、緊急車両のための進路を開けてください。
- id: 220
  category: safe_driving_rules
  question: 高速道路を降りたいのに出口を通り過ぎてしまった場合、次のようにすべきです：
  choices:
    A: 次の出口まで進む。
    B: 中央分離帯を通ってUターンする。
    C: 路肩に寄せて、出口まで車をバックさせる。
    D: 警察官を呼び止め、出口まで誘導してもらう。
  answer: A
  explanation: 出口を通り過ぎてしまった場合は、次の出口を利用してください。高速道路上で停止したりバックしたり、最後の瞬間に無理やり複数の車線をまたいで出口に向かったり、中央分離帯を越えてUターンしたりしないでください。これらの操作はすべて違法であり、非常に危険です。
- id: 221
  category: safe_driving_rules
  question: 次の記述のうち、正しいものはどれですか？
  choices:
    A: 追い越しのために車線変更をする少なくとも100フィート手前で合図を出し、対向車がいないことを確認する。
    B: 左側から追い越す際は、ミラーを使い、左肩越しに振り返って死角を確認する。
    C: 追い越しをする際は、追い越した車の両方のヘッドライトがルームミラーに映るまで待ってから、元の車線に戻る。
    D: 上記のすべて。
  answer: D
  explanation: 追い越しをする際は、車線変更の少なくとも100フィート手前で常に合図を出さなければなりません。常にミラーで後方を確認し、肩越しに振り返って死角を確認してください。追い越した車の両方のヘッドライトがルームミラーに映るまで待ってから、元の車線に戻ってください。
- id: 222
  category: safe_driving_rules
  question: 4方向一時停止（フォーウェイ・ストップ）の交差点では：
  choices:
    A: 最初に到着した運転手に優先権がある。
    B: 最後に到着した運転手に優先権がある。
    C: 1人の運転手は止まらずに運転を続けるべきである。
    D: 1人の運転手が他の運転手に先に行くよう手で合図するべきである。
  answer: A
  explanation: 4方向一時停止の交差点では、4方向すべての交通が一時停止しなければなりません。最初に交差点に到達した車両が先に進むべきです。2台の車両が同時に交差点に到達した場合は、左側の運転手が右側の運転手に道を譲ります。
- id: 223
  category: safe_driving_rules
  question: 公道上の車内でアルコール飲料を飲んでもよいのは次の場合です：
  choices:
    A: 運転していない場合。
    B: 後部座席に乗っている場合。
    C: ピックアップトラックの荷台に乗っている場合。
    D: いかなる状況でも許可されない。
  answer: D
  explanation: 公道や歩道でアルコール飲料を消費または所持することは法律違反です。さらに、公道において、運転手や同乗者が通常乗車する自動車内のスペースに、開封済みのアルコール飲料の容器を保管することも禁止されています。
- id: 224
  category: safe_driving_rules
  question: 青信号で右折する場合、次のことをしなければなりません：
  choices:
    A: 通常の走行速度を維持する。
    B: 停止して近くにパトカーがいないか確認する。
    C: 歩行者に道を譲る。
    D: 通常の走行速度を上げる。
  answer: C
  explanation: 標識で禁止されていない限り、点滅していない青信号で右折または左折することができます。曲がる際は、交差点内の他の車両や歩行者に道を譲らなければなりません。
- id: 225
  category: vehicle_information
  question: ハイドロプレーニング現象は通常、何によって引き起こされますか？
  choices:
    A: 過度な停止。
    B: 急ブレーキ。
    C: 急ハンドル。
    D: 速度の出しすぎ。
  answer: D
  explanation: 速度を上げると、タイヤが路面の水を排除する効果が低下します。スピードを出しすぎると、タイヤのグリップ力が完全に失われ、車両が水膜の上を滑る状態になることがあります。これは「ハイドロプレーニング現象」と呼ばれます。
- id: 226
  category: signs_and_signals
  question: 交通標識と路面標示は：
  choices:
    A: 常に従わなければならない。
    B: 単なる提案である。
    C: 他の交通がある場合にのみ従わなければならない。
    D: 警察官がいる場合にのみ従わなければならない。
  answer: A
  explanation: 交通の流れは、路面標示、交通島、信号機、および標識によって制御されています。これらの設備は、運転手に道路状況を知らせ、安全に目的地へ導くのに役立ちます。交通標識、信号機、および路面標示には常に従わなければなりません。
- id: 227
  category: signs_and_signals
  question: クロスバック標識（X字型の標識）が示しているのは：
  choices:
    A: 踏切。
    B: スクールゾーン。
    C: 追い越し禁止区域。
    D: 病院。
  answer: A
  explanation: クロスバック標識は、踏切で列車に道を譲るよう運転手に指示するものです。運転手は列車より先に通り抜けようとしてはいけません。
- id: 228
  category: defensive_driving
  question: 滑りやすい道路を運転する際は、次のことを行うべきです：
  choices:
    A: 別のルートを使用する。
    B: 乾いた道路と同じように運転する。
    C: 車間距離を広げる。
    D: 橋や交差点を渡るのを避ける。
  answer: C
  explanation: 滑りやすい道路では、車間距離を広げるべきです。通常の状況よりも車両を停止させるのに時間がかかる場合があります。
- id: 229
  category: safe_driving_rules
  question: 信号機のない場所で運転手が曲がろうとしており、歩行者が横断している場合、誰が道を譲らなければなりませんか？
  choices:
    A: 最後に動き始めた方
    B: 運転手
    C: 遅い方
    D: 歩行者
  answer: B
  explanation: 横断歩道の有無にかかわらず、信号機のない交差点を歩行者が横断している場合、運転手は歩行者に道を譲らなければなりません。
- id: 230
  category: alcohol_drugs_health
  question: どのような種類の薬が運転能力に影響を与える可能性がありますか？
  choices:
    A: アレルギー薬
    B: マリファナ
    C: 風邪薬
    D: これらの選択肢すべて
  answer: D
  explanation: 多くの種類の薬が運転能力を低下させる可能性があります。これには、違法薬物だけでなく、合法的な処方薬や市販薬も含まれます。いかなる薬物であっても、その影響下で運転することは犯罪となる可能性があります。
- id: 231
  category: vehicle_information
  question: 死角とは、道路上の次のようなエリアのことです：
  choices:
    A: 頭を動かさないと見えないエリア。
    B: 車の真後ろのエリア。
    C: ルームミラーで見えるエリア。
    D: サイドミラーで見えるエリア。
  answer: A
  explanation: 死角とは、運転手が頭を動かさないと見えないエリアのことです。車の側面や後方に存在することがあります。
- id: 232
  category: safe_driving_rules
  question: 他の車で塞がれている交差点に差し掛かりました。あなたはどうするべきですか：
  choices:
    A: 前方の車が動くまでゆっくり進む。
    B: 前の車にできるだけ近づく。
    C: 通り抜けられるようになるまで交差点に入らない。
    D: クラクションを鳴らして車を前に進ませる。
  answer: C
  explanation: 交差点の向こう側が渋滞しており、交差点を完全に通り抜けられない場合は、交差点に進入してはいけません。交差点を塞がないように、前方の交通が解消されるまで待ってください。
- id: 233
  category: signs_and_signals
  question: 信号機のマークが描かれた黄色のひし形の標識は、次のことを示しています：
  choices:
    A: 現在の速度で進み続ける。
    B: 前方で停止しなければならない。
    C: スピード違反は許可されていない。
    D: 前方に信号機がある。
  answer: D
  explanation: 信号機のマークが描かれた黄色の警戒標識は、前方に信号機があることを運転手に警告するものです。停止する準備をしてください。
- id: 234
  category: defensive_driving
  question: 視界が悪くなったときの最初の対応として、どうするべきですか：
  choices:
    A: ヘッドライトを点灯する。
    B: 速度を落とす。
    C: ワイパーを作動させる。
    D: 道路の端の標示をガイドとして探す。
  answer: B
  explanation: 視界の低下や危険な道路状況に対する最初の対応は、速度を落とすことです。
- id: 235
  category: safe_driving_rules
  question: 車線を横切るように引かれた2本の実線の白線は、横断歩道の境界を示しています。運転手として、次のことを知っておくべきです：
  choices:
    A: 横断歩道では、自動車が歩行者よりも優先権を持つ。
    B: 歩行者が横断歩道にいるときは、歩行者に優先権を譲らなければならない。
    C: 横断歩道では誰も優先権を持たない。
    D: 歩行者はすべての交通の邪魔にならないようにする責任がある。
  answer: B
  explanation: 横断歩道の線は、歩行者が安全に道路を横断できる場所を示しています。横断歩道は、水平線、垂直線、またはその両方の組み合わせで標示されることがあります。横断歩道内にいる歩行者のためには、必ず停止しなければなりません。
- id: 236
  category: safe_driving_rules
  question: 次の場合、他の運転手に道を譲らなければなりません：
  choices:
    A: 車庫や路地から道路に出るとき。
    B: 相手が左側の道路におり、標識のない交差点に同時に到達したとき。
    C: 自分の信号が緑の矢印のとき。
    D: 上記のすべて。
  answer: A
  explanation: 路地、私道、または車庫から道路に出る際は、他の運転手に道を譲らなければなりません。また、交差する歩道にいる歩行者にも道を譲る必要があります。
- id: 237
  category: safe_driving_rules
  question: 次の場合、緊急車両に道を譲らなければなりません：
  choices:
    A: いかなる状況でも譲る必要はない。
    B: 赤や青の点滅灯が見えたとき、またはサイレンが聞こえたとき。
    C: 他の車が道を譲ったときのみ。
    D: 上記のどれでもない。
  answer: B
  explanation: サイレンを鳴らしている、または点滅灯を使用しているすべての緊急車両に対して、優先権を譲らなければなりません。
- id: 238
  category: safe_driving_rules
  question: 私道や専用道路から公道に出る運転手は：
  choices:
    A: 優先権を持っている。
    B: すでに公道を走っている運転手に道を譲るべきである。
    C: 無理やり交通に割り込んでもよい。
    D: 他の運転手が車線を変更してスペースを空けてくれると想定してよい。
  answer: B
  explanation: 私道や専用道路から公道に出る場合は、すでに公道を走っている運転手に道を譲るべきです。安全に合流できる状態になってから交通に合流してください。
- id: 239
  category: safe_driving_rules
  question: 左折する際、次のどの信号機であれば優先権がありますか？
  choices:
    A: 点灯している緑の信号
    B: 点滅している黄色の信号
    C: 左を指している緑の矢印信号
    D: 点滅している赤の信号
  answer: C
  explanation: 点灯している緑の矢印は、矢印が指している方向に交差点を通過してよいことを意味します。対向車は、曲がる車のために停止することが義務付けられています。
- id: 240
  category: safe_driving_rules
  question: 車が停止するまでに必要な距離を決定する要因ではないものはどれですか？
  choices:
    A: ハンドル操作の能力
    B: 制動距離
    C: 空走距離
    D: 認知時間
  answer: A
  explanation: 車が停止するまでに必要な距離（停止距離）は、認知時間、空走距離、および制動距離によって決まります。これは速度や道路状況によって変化します。
- id: 241
  category: safe_driving_rules
  question: 速度制限標識（推奨速度標識）は：
  choices:
    A: 雨、雪、または凍結した状況では無視してもよい。
    B: 三角形である。
    C: 青地に黒文字である。
    D: カーブや曲がり角での推奨速度を示している。
  answer: D
  explanation: カーブや曲がり角の警戒標識には、ドライバーに対してカーブや曲がり角での推奨走行速度を示す推奨速度標識が取り付けられていることがよくあります。天候が良い場合はより高い速度で運転しても安全だと感じるかもしれませんが、雨、雪、または凍結した状況では決してそうするべきではありません。
- id: 242
  category: safe_driving_rules
  question: 交通を横切るために必要なスペースは、以下によって異なります：
  choices:
    A: 道路状況、天候状況、および対向車。
    B: 一時停止標識の有無。
    C: 方向指示器（ウィンカー）の使用。
    D: 後続車。
  answer: A
  explanation: 交通を横切るために必要なスペースは、道路状況、天候状況、および対向車によって異なります。
- id: 243
  category: safe_driving_rules
  question: 追い越しをしてはいけません：
  choices:
    A: 坂道やカーブで。
    B: スクールバスのライトが点滅しているとき。
    C: 交差点に近づいているとき。
    D: 上記のすべて。
  answer: D
  explanation: 追い越し車線に対向車がいる場合、カーブや坂道で視界が遮られている場合、交差点、踏切や橋の手前またはその上、その他いかなる追い越し禁止区域でも、決して追い越しをしてはいけません。中央分離帯または共有の中央右左折車線がある多車線道路の反対側にいる場合を除き、赤いライトを点滅させて停車しているスクールバスを追い越してはいけません。
- id: 244
  category: safe_driving_rules
  question: 工事区間で交通誘導員が交通整理をしている場合、あなたは次のようにしなければなりません：
  choices:
    A: 交通誘導員の指示に従う。
    B: 交通誘導員の指示に関わらず、周囲の車と同じ行動をとる。
    C: 交通誘導員は交通整理をする権限がないとみなす。
    D: その場所が工事中でない場合に適用される法律に従う。
  answer: A
  explanation: 標識、交通誘導員、または警察官から指示された場合は、速度を落とし、注意を払う準備をしてください。これに従わないことは違法であり、工事区間で働く人々にとって危険です。
- id: 245
  category: sharing_the_road
  question: 緊急車両が近づいてくるのを見たり聞いたりした場合、次のようにするべきです：
  choices:
    A: すぐに停止し、車両を通過させる。
    B: 安全な範囲で道路の右端にできるだけ寄って停止する。
    C: ゆっくりと進み、車両を通過させる。
    D: 道路の右側に寄りながら、ゆっくりと進み続ける。
  answer: B
  explanation: 2車線道路または中央分離帯のない幹線道路を運転している場合、ライトやサイレンを使用している緊急車両には、それがどの方向から近づいてきているかに関わらず、道を譲らなければなりません。直ちに道路の右端にできるだけ寄って停止し、交差点内では停止しないように注意してください。
- id: 246
  category: safe_driving_rules
  question: 交差点に近づいており、信号は青です。歩行者が赤信号を無視して横断しています。あなたは次のようにするべきです：
  choices:
    A: クラクションを鳴らす。
    B: 速度を上げて歩行者の前を通り過ぎる。
    C: 停止して歩行者を安全に横断させる。
    D: 歩行者に近づいて驚かせ、赤信号で横断することを思いとどまらせる。
  answer: C
  explanation: 青信号のときでも、交差点内に取り残されている可能性のある歩行者や車には道を譲ってください。いかなる状況でも歩行者の周囲では注意してください。
- id: 247
  category: safe_driving_rules
  question: 高速道路（フリーウェイ）に合流するには：
  choices:
    A: 方向指示器を出し、本線の車に道を譲り、本線の車と同じ速度で合流する。
    B: 方向指示器を出して高速道路に合流する。高速道路の車が道を譲らなければならない。
    C: 交通状況を確認できるようにゆっくり運転する。
    D: 常にまず完全に停止する。
  answer: A
  explanation: 交通に合流する際は、方向指示器を出し、本線の車と同じ速度で合流するべきです。道路に進入する際は、常に他の車に道を譲ってください。
- id: 248
  category: defensive_driving
  question: 夜間の運転でより一層の注意が必要な理由は以下の通りです：
  choices:
    A: 夜間は車の流れが速くなるため。
    B: 夜間は交通量が多くなるため。
    C: 夜間はドライバーの視界が悪くなるため。
    D: 夜間は事故がより頻繁に発生するため。
  answer: C
  explanation: 暗いため、ドライバーは日中ほど夜間はよく見えません。日没の30分後から日の出の30分前まで、または人や車両が500フィート先から見えない場合はいつでも、ドライバーはヘッドライトを使用しなければなりません。
- id: 249
  category: penalties_and_points
  question: 段階的運転免許（GDL）に課せられた制限に従わない場合：
  choices:
    A: 大した問題ではない。
    B: 運転免許の減点（ポイント加算）のみとなる。
    C: 悪影響は生じない。
    D: 罰金および免許停止になる可能性がある。
  answer: D
  explanation: 段階的運転免許（GDL）を持つ初心運転者は、厳格な運転制限に従わなければなりません。これらの制限に従わない場合、100ドルの罰金およびGDLの停止処分を受ける可能性があります。
- id: 250
  category: safe_driving_rules
  question: 2台の車両が異なる道路から同時に交差点に進入した場合、どちらの車両が優先権を譲らなければなりませんか？
  choices:
    A: どちらか一方
    B: 左側の車両
    C: 右側の車両
    D: どちらでもない
  answer: B
  explanation: 標識や信号で制御されている交差点、および制御されていない交差点において、2台の車両が同時に交差点に到着した場合、左側のドライバーは右側のドライバーに優先権を譲らなければなりません。
- id: 251
  category: safe_driving_rules
  question: 交通信号機には、特定の車線からの右左折を制御するために矢印が表示されることがあります。青（緑）の矢印は：
  choices:
    A: 一方通行の道路でのみ使用されます。
    B: 円形の青信号と同じ意味ですが、車両は矢印が示す方向に曲がらなければなりません。
    C: 進行してもよいという意味ですが、青の矢印が円形の青信号と一緒に点灯している場合のみです。
    D: 空港への道を示しています。
  answer: B
  explanation: 青（緑）の矢印は円形の青信号と同じ意味ですが、指定された車線の車両は矢印が示す方向に曲がらなければなりません。
- id: 252
  category: safe_driving_rules
  question: 反対方向に進む車線は、____の線で区切られています。
  choices:
    A: 白
    B: 赤
    C: 黒
    D: 黄
  answer: D
  explanation: 黄色の線は、反対方向に進む車線を区切るために使用されます。
- id: 253
  category: defensive_driving
  question: ハイドロプレーニング現象のリスクをどのように下げることができますか？
  choices:
    A: 道路が濡れているときはスピードを出さない。
    B: 適切な空気圧のタイヤを使用する。
    C: 溝がすり減ったタイヤを交換する。
    D: 上記のすべて。
  answer: D
  explanation: ハイドロプレーニング現象は、タイヤと道路の間の薄い水膜の上を車両が滑るように進むときに発生します。空気圧が低いタイヤや溝がすり減ったタイヤは、ハイドロプレーニング現象のリスクを高める可能性があります。また、スピードの出しすぎもリスクを高めます。
- id: 254
  category: signs_and_signals
  question: 夜間、ヘッドライトの眩しさ（グレア）の影響を軽減するためには、どこを見るべきですか？
  choices:
    A: まっすぐ前。
    B: 肩越し。
    C: 道路の中央。
    D: 道路の右端。
  answer: D
  explanation: 対向車の運転手がヘッドライトを下向き（ロービーム）にしない場合は、前方の道路の右側に視線を保ちます。対向車のヘッドライトを直接見ないでください。眩しさにより数秒間視界が奪われる可能性があります。
- id: 255
  category: safe_driving_rules
  question: 交差点で次を見た場合、停止しなければなりません：
  choices:
    A: 赤の点滅信号。
    B: 黄色の点灯信号。
    C: 黄色の矢印信号。
    D: 黄色の点滅信号。
  answer: A
  explanation: 赤の点滅信号は一時停止の標識と同じ意味を持ちます。赤の点滅信号がある交差点では、完全に停止し、左右を確認し、交差点の安全が確認できた後にのみ進行しなければなりません。
- id: 256
  category: alcohol_drugs_health
  question: アルコールが反射神経や判断力に与える影響は：
  choices:
    A: ワインの代わりにビールを飲んだ場合の方が影響は少ない。
    B: ビールの代わりにワインを飲んだ場合の方が影響は少ない。
    C: ハードシードルやカクテルを飲んだ場合が最も影響が大きい。
    D: 血中アルコール濃度(BAC)に依存する。
  answer: D
  explanation: どのような種類のアルコールを摂取しても、反射神経や判断力に悪影響を及ぼす可能性があります。どの種類のアルコールを飲んだかは問題ではなく、どれだけのアルコールが血中に入ったかのみが重要です。
- id: 257
  category: vehicle_information
  question: ニュージャージー州で車両を登録するには、____歳以上でなければなりません。
  choices:
    A: '17'
    B: '25'
    C: '18'
    D: '21'
  answer: A
  explanation: ニュージャージー州で自動車を登録するには、17歳以上でなければなりません。身分証明書と車両の所有権の証明が必要です。
- id: 258
  category: vehicle_information
  question: 運転中にタイヤがパンク（バースト）しました。あなたはどうするべきですか？
  choices:
    A: 急ブレーキをかける。
    B: ハンドルをしっかりと握り、減速して停止する。
    C: そのまま普通に運転を続ける。
    D: ハザードランプを点灯させ、運転を続ける。
  answer: B
  explanation: タイヤがパンク（バースト）した場合は、すぐにブレーキをかけないでください。ハンドルをしっかりと握り、車線を維持するように操作します。アクセルから足を離し、ブレーキを踏まずに徐々に速度を落とします。非常に遅い速度になったら、軽くブレーキをかけ、道路脇の安全な場所に車を停めます。
- id: 259
  category: defensive_driving
  question: 次の場合、車間距離を広げてください：
  choices:
    A: 視界を遮る大型車の後ろを運転しているとき。
    B: 高速道路を降りるとき。
    C: オートバイの後ろを走っているとき。
    D: 上記のすべて。
  answer: D
  explanation: 視界を遮る大型車の後ろにいるとき、悪天候や渋滞の中を運転しているとき、高速道路を降りるとき、オートバイや自転車の後ろにいるとき、または後続車に煽られている（車間距離を詰められている）ときは、車間距離を広げるべきです。
- id: 260
  category: safe_driving_rules
  question: 運転手の左腕と手が下に向かって伸ばされています。この手信号は、運転手が何をしようとしていることを意味しますか？
  choices:
    A: 左折する。
    B: 右折する。
    C: 停止する。
    D: 発進する。
  answer: C
  explanation: 運転手の左腕と手が下に向かって伸ばされている場合、停止する意図があることを示しています。この手信号を使っている運転手の後ろを走っている場合は、それに応じて運転を調整してください。
- id: 261
  category: signs_and_signals
  question: 1本の破線の白線または黄線を越えてはいけないのは次の場合です：
  choices:
    A: そうすることで交通の妨げになる場合。
    B: 私道へ左折して入る場合。
    C: 前の車が故障している場合。
    D: 一方通行の道路で右側から追い越しをする場合。
  answer: A
  explanation: 安全に、かつ交通の妨げになることなく行える限り、追い越しや車線変更のために1本の破線を越えることができます。
- id: 262
  category: safe_driving_rules
  question: 自分の体調が原因で危険な運転をしないようにするためには、次のようにするべきです：
  choices:
    A: 健康を維持し、定期的に健康診断を受ける。
    B: 薬が運転能力に与える影響を知っておく。
    C: 自分の身体的な限界の範囲内で運転する。
    D: 上記のすべて。
  answer: D
  explanation: 体調は安全に運転する能力に重要な影響を与えます。運転者は自分の身体的な限界を認識し、安全である場合にのみ運転するべきです。
- id: 263
  category: signs_and_signals
  question: オレンジ色の標識は次のうちどれですか：
  choices:
    A: 作業区間の標識。
    B: 規制標識。
    C: スクールゾーンの標識。
    D: 案内標識。
  answer: A
  explanation: 道路の作業区間は、道路沿いで行われている作業の種類に応じて設けられます。作業エリアの標識は通常、ひし形でオレンジ色をしており、黒い文字や記号が描かれています。これは、道路上またはその近くで人が作業していることを警告する役割を果たします。
- id: 264
  category: vehicle_information
  question: 車に乗る際、小さな子供は：
  choices:
    A: 力のある大人が抱っこしていれば安全である。
    B: 車の後部座席の床に立っていれば安全である。
    C: 体が小さいため、事故に遭っても怪我をしない。
    D: 車内で立ったまま乗車させてはならない。
  answer: D
  explanation: 通常のシートベルトを着用するには小さすぎる子供のために、専用のチャイルドシートがあります。事故や急ブレーキの際に、どんなサイズの子供であっても安全に抱きかかえていられるほど力のある人はいません。子供が座席に適切に固定されていない状態で、絶対に車に乗せてはいけません。
- id: 265
  category: vehicle_information
  question: 自分の車と周囲との間にスペースクッション（安全な車間距離）を確保することが重要なのは、次の理由からです：
  choices:
    A: 他の車からの気を散らす要因を防ぐため。
    B: 予期せぬ状況に反応するための時間を与えてくれるため。
    C: 交通の流れを安全なペースに保つため。
    D: 他の運転手の注意を喚起するため。
  answer: B
  explanation: 他の運転手のミスに反応するための十分な時間を確実に確保する唯一の方法は、自分の車と周囲の車との間に十分なスペースを空けることです。
- id: 266
  category: safe_driving_rules
  question: 道路の端に車を寄せて緊急車両を通過させなければならないのは次の場合です：
  choices:
    A: 自分の進行方向に関係なく。
    B: 緊急車両が自分の後ろを走っている場合のみ。
    C: 緊急車両が対向車線から近づいてくる場合のみ。
    D: 上記のどれでもない。
  answer: A
  explanation: ライトを点滅させている緊急車両に対しては、それが後ろから近づいてくるか対向車線から近づいてくるかに関係なく、道路の右端に車を寄せて停止しなければなりません。
- id: 267
  category: alcohol_drugs_health
  question: 一酸化炭素中毒を防ぐために、運転者は次のようにするべきです：
  choices:
    A: 排気システムを定期的に点検し、漏れがないことを確認する。
    B: 車が密閉されたガレージにあるときはエンジンを切っておく。
    C: 他の車のすぐ後ろを走るときは通気口を閉める。
    D: 上記のすべて。
  answer: D
  explanation: 一酸化炭素のガスは無臭であり、致命的です。一酸化炭素中毒の症状には、突然の疲労感、あくび、めまい、吐き気などがあります。唯一の治療法は、新鮮な空気を十分に供給することです。
- id: 268
  category: safe_driving_rules
  question: 運転手の左腕と手が上に向かって伸ばされています。この手信号（ハンドシグナル）は、運転手が次のようにする予定であることを意味します：
  choices:
    A: 左折する。
    B: 右折する。
    C: 停止する。
    D: 直進する。
  answer: B
  explanation: 運転手の左腕と手が上に向かって伸ばされている場合、右折する意図があることを示しています。この手信号を使っている運転手の後ろを走る場合は、それに応じて自分の運転を調整してください。
- id: 269
  category: safe_driving_rules
  question: 車線変更をする際、してはいけないことは次のうちどれですか：
  choices:
    A: サイドミラーとバックミラーを確認する。
    B: 方向指示器（ウィンカー）を出して自分の意図を知らせる。
    C: 自分と同じ車線に移動してくる可能性のある他の運転手を確認する。
    D: 携帯電話を使って警察に連絡し、前方の道路が空いているか確認する。
  answer: D
  explanation: 車線変更をする前に、サイドミラーとバックミラーで後方から近づいてくる車がないか確認してください。方向指示器（ウィンカー）を使って、車線変更をする予定であることを他の運転手に知らせます。また、同じ車線に移動してくる可能性のある他の運転手も確認してください。
- id: 270
  category: sharing_the_road
  question: 低速走行車（スロー・ムービング・ビークル）の標識は次のうちどれですか：
  choices:
    A: 長方形の赤い標識。
    B: 円形の緑の標識。
    C: ひし形の黄色い標識。
    D: 三角形のオレンジ色の標識。
  answer: D
  explanation: 低速走行車のシンボルは、反射材を使用したオレンジ色の三角形です。この標識を使用している車両は、25 mph以下の速度で走行していると予想してください。
- id: 271
  category: vehicle_information
  question: ハイビームを使用している車両が向かってくる場合、道路の____を見るべきです。
  choices:
    A: どちらかの端
    B: 中央
    C: 右側
    D: 左側
  answer: C
  explanation: 対向車がハイビームを使用しており、ロービームに切り替えない場合は、道路の右側に視線を向けるべきです。これにより、対向車のヘッドライトで目が眩むのを防ぎ、車両が通り過ぎるまで進路を維持するのに十分な視界を確保することができます。
- id: 272
  category: safe_driving_rules
  question: 高速道路の出口ランプの正しい使用方法は次のうちどれですか。
  choices:
    A: 出口ランプに入る前に減速する。
    B: 出口ランプに入ってから減速する。
    C: 出口ランプに入ったら速度を一定に保つ。
    D: 出口ランプで遅い車を追い越す。
  answer: B
  explanation: 高速道路の出口ランプを使用する際は、出口ランプに入るまで減速しないでください。
- id: 273
  category: vehicle_information
  question: 車両の雪や氷は、どこから取り除くべきですか。
  choices:
    A: 車両の窓。
    B: 車両のボンネット。
    C: 車両の屋根。
    D: 上記すべて。
  answer: D
  explanation: 州法により、運転者は運転前に車両からすべての雪と氷を取り除くことが義務付けられています。この法律に従わない運転者には罰金が科される場合があります。
- id: 274
  category: safe_driving_rules
  question: 黄色信号の交差点を注意して進み続けてもよいのは、次の場合です。
  choices:
    A: 緊急車両が自分の車線を横切っている場合。
    B: 歩行者が横断している場合。
    C: 右折している場合。
    D: 信号が黄色に変わったとき、すでに交差点内にいる場合。
  answer: D
  explanation: すでに交差点内にいるときに黄色の点灯信号が現れた場合は、注意して交差点を通り抜けるべきです。
- id: 275
  category: safe_driving_rules
  question: 交差点に近づいているとき、信号機が緑から黄色の点灯に変わりました。あなたはどうするべきですか。
  choices:
    A: 警戒標識と同じとみなし、交差点を進み続ける。
    B: 直ちに停止する。
    C: 安全に停止するには近すぎる場合を除き、交差点に入る前に停止する。
    D: 赤信号になる前に交差点を通り抜けるために加速する。
  answer: C
  explanation: 黄色の点灯信号がある交差点に近づくときは、安全であれば交差点に入る前に減速して停止してください。安全に停止できない場合は、注意して交差点を通り抜けてください。
- id: 276
  category: signs_and_signals
  question: 黄色の実線を越えてもよいのは次の場合です。
  choices:
    A: 同じ方向に進む車を追い越すため。
    B: 日中のみ。
    C: いつでも。
    D: 曲がるとき。
  answer: D
  explanation: 原則として、破線の車線は越えることができますが、実線は越えることができません。黄色の実線は、運転者が曲がる（右左折する）場合にのみ越えることができます。
- id: 277
  category: defensive_driving
  question: 雨天時に運転する場合、次を行わなければなりません。
  choices:
    A: ロービーム（すれ違い用前照灯）を使用する。
    B: ハイビーム（走行用前照灯）を使用する。
    C: パーキングランプ（車幅灯）を使用する。
    D: ライトを使用しない。
  answer: A
  explanation: 雨天時には、ロービームのヘッドライトを使用するべきです。
- id: 278
  category: vehicle_information
  question: 走行中の自動車内でシートベルトの着用が義務付けられているのは誰ですか。
  choices:
    A: 運転手のみ
    B: 大人の同乗者のみ
    C: 子供の同乗者のみ
    D: 自動車のすべての乗員
  answer: D
  explanation: 州法により、乗用車の運転手およびすべての同乗者はシートベルトを着用しなければなりません。運転手、助手席の同乗者、または18歳未満の子供がシートベルトを着用しないことは、第一級違反（プライマリー・オフェンス）となります。運転手は18歳未満のすべての同乗者に対して責任を負います。第二級違反（セカンダリー・オフェンス）の法律により、別の理由で車両が停止させられた場合、シートベルトを着用していない18歳以上の後部座席の乗員全員に召喚状が発行される可能性があります。
- id: 279
  category: alcohol_drugs_health
  question: 後続車が渋滞するほど遅い速度で運転している場合、次のようにするべきです。
  choices:
    A: 速度を落とす。
    B: 道路の右側に車を寄せて、後続車に道を譲る。
    C: 他の車に自分の車を追い越させない。
    D: ハザードランプを使用する。
  answer: B
  explanation: 車の流れよりも遅く運転することは危険を伴う場合があります。片側1車線の対面通行道路で、後続車が渋滞するほど遅く運転している場合は、道路脇に車を寄せて他の車両に道を譲ることが義務付けられています。状況により必要な場合にのみ、制限速度を大幅に下回る速度で運転してください。
- id: 280
  category: alcohol_drugs_health
  question: 排気システムの漏れは、次を引き起こす可能性があります。
  choices:
    A: 過剰なオイル消費を引き起こす。
    B: 通常よりも早く車両のチューンアップ（整備）が必要になる。
    C: 運転中に眠気を引き起こす。
    D: 田舎道で草火事を起こす。
  answer: C
  explanation: 排気システムは、有毒ガスを排出し、騒音を減らし、稼働中のエンジンから出る高温のガスを冷却する役割を果たします。漏れのある排気システムからの排気ガスは、ごく短時間で死に至る原因となることがあります。また、運転中に眠気を引き起こす可能性もあります。
- id: 281
  category: safe_driving_rules
  question: 悪天候下において、トラクター・トレーラー（大型トラック）が停止するまでに必要な距離は、理想的な運転条件の場合と比べて最大____パーセント長くなる可能性があります。
  choices:
    A: '10'
    B: '25'
    C: '40'
    D: '55'
  answer: B
  explanation: トラクター・トレーラーの近くを運転する際は、その大きさが運転にどのような影響を与えるかを認識してください。悪天候下では、大型車両が完全に停止するまでに必要な距離は、理想的な条件下で運転されている場合と比べて最大25パーセント長くなる可能性があります。
- id: 282
  category: safe_driving_rules
  question: 大型トラックの近くを運転する際、他のドライバーや道路利用者は次のことを考慮しなければなりません：
  choices:
    A: 大型車両は停止距離が長くなること。
    B: 大型車両は停止距離が短くなること。
    C: 大型車両は騒音が小さくなること。
    D: 大型車両は速度が速くなること。
  answer: A
  explanation: 大型トラックの近くを運転する際、他のドライバーや道路利用者は、大型車両の停止距離が長くなることを考慮しなければなりません。小型車両のドライバーは、大型車両のドライバーから見える位置に留まり、かつ大型車両によって交通の視界が遮られない位置を維持する必要があります。
- id: 283
  category: safe_driving_rules
  question: 車両の停止距離が依存しないものは次のうちどれですか：
  choices:
    A: あなた自身の反応時間。
    B: 時間帯。
    C: 車両のブレーキの状態。
    D: 車両のタイヤの状態と種類。
  answer: B
  explanation: 車両が停止するのに必要な距離は、ドライバーの反応時間、天候や視界の状況、車両の重量、車両のブレーキの状態、車両のタイヤの状態と種類、路面状況、および速度に依存します。
- id: 284
  category: sharing_the_road
  question: 交通法規に従わない自転車の運転手は：
  choices:
    A: 自転車は交通法規に従う必要がないため、正しい。
    B: 交通違反切符を切られる可能性がある。
    C: 常に警察から警告を受ける。
    D: 自転車を押収される。
  answer: B
  explanation: すべての自転車の運転手は、自動車のドライバーと同じ権利、義務、および責任を持っています。交通法規に従わない自動車のドライバーや自転車の運転手は、交通違反切符を切られる可能性があります。
- id: 285
  category: safe_driving_rules
  question: 反対方向に進む車線を分ける路面標示は何色ですか？
  choices:
    A: 黄色
    B: 白色
    C: 黄色と白色
    D: 黄色、白色、黒色
  answer: A
  explanation: 黄色の線は、反対方向に進む車線を分けるために道路の中央で使用されます。
- id: 286
  category: signs_and_signals
  question: 下向きの三角形の標識は：
  choices:
    A: スクールゾーンを示している。
    B: ドライバーに道を譲る（ゆずれ）よう指示している。
    C: 工事区間を示している。
    D: 踏切を示している。
  answer: B
  explanation: 下向きの三角形の標識は、通常、ドライバーが道を譲る（ゆずれ）べきであることを示しています。道路に他の車両や歩行者がおらず、安全であることが確認できたら、ドライバーは進むことができます。
- id: 287
  category: vehicle_information
  question: 死角にいる車両との衝突を避けるために、あなたは次のことを行うべきです：
  choices:
    A: 車線変更をする前に、素早く首を回して死角に何もないか確認する。
    B: 数分おきにバックミラーを調整する。
    C: 曲がる直前や車線変更の直前にクラクションを鳴らす。
    D: 上記のどれでもない。
  answer: A
  explanation: 曲がったり車線変更をしたりする前に、移動する方向に首を回して肩越しにちらっと確認し、死角に何もないか確認してください。決してミラーだけに頼ってはいけません。
- id: 288
  category: safe_driving_rules
  question: 信号機や遮断機のない踏切を渡る車列に並んでいる場合：
  choices:
    A: あなたに優先権があるため、列車を確認する必要はない。
    B: 踏切を渡っている間、遅い車を追い越してもよい。
    C: 途中で止まることなく、車両が線路を完全に渡り切るためのスペースがあることを確認する必要がある。
    D: 上記のすべて。
  answer: C
  explanation: 踏切で他の車両に続いている場合、線路に進入する前に、完全に渡り切るための十分なスペースがあることを確認してください。踏切に近づく際や渡る際には、決して他の車両を追い越そうとしてはいけません。いかなる踏切を渡る前にも、必ず列車が来ていないか確認してください。
- id: 289
  category: signs_and_signals
  question: 赤い八角形の標識を見た場合、あなたは次のことをしなければなりません：
  choices:
    A: 完全に停止し、歩行者や交差する交通を確認する。
    B: 完全に停止することなく減速する。
    C: 完全に停止し、青信号を待つ。
    D: 減速し、交通を確認する。
  answer: A
  explanation: 八角形の標識はすべて「止まれ（一時停止）」の標識です。一時停止標識のある交差点では、完全に停止し、交差点内の歩行者や交差する交通を確認しなければなりません。交差点が安全になるのを待ってから進んでください。
- id: 290
  category: safe_driving_rules
  question: 複数車線の一方通行の道路や幹線道路から左折する場合、どこから曲がり始めるべきですか：
  choices:
    A: 交差点の中央。
    B: 右車線。
    C: 左車線。
    D: どの車線からでもよい。
  answer: C
  explanation: 複数車線の道路や幹線道路から左折する場合は、左車線から曲がり始めてください。
- id: 291
  category: safe_driving_rules
  question: 道路工事区域（ワークゾーン）について：
  choices:
    A: 移動している場合と、固定されている場合があります。
    B: 白黒の標識で示されます。
    C: ドライバーが減速したり、特別な注意を払う必要はありません。
    D: 上記すべて。
  answer: A
  explanation: 道路工事区域は固定されていることが多いですが、白線引き、草刈り、除雪などを行う移動車両の形で存在することもあります。道路工事区域は、黒い文字や記号が描かれたオレンジ色の標識で示されます。道路工事区域に近づくときや通過するときは、減速して特別な注意を払ってください。
- id: 292
  category: safe_driving_rules
  question: 点滅する黄色の矢印を表示している信号機に近づいた場合、ドライバーは：
  choices:
    A: 矢印の方向の車線に合流する必要があります。
    B: 完全に停止する必要があります。
    C: 対向車や歩行者に道を譲った後、左折することができます。
    D: 優先権があり、対向車が自分のために停止することを期待できます。
  answer: C
  explanation: 点滅する黄色の矢印は、矢印の方向への左折が許可されていることを示します。ただし、対向車線の信号は青であるため、対向車や歩行者に道を譲らなければなりません。
- id: 293
  category: safe_driving_rules
  question: 信号や標識のない交差点（無信号交差点）に2台の車両が同時に到達した場合：
  choices:
    A: 最も大きい車両に優先権があります。
    B: 左側の車に優先権があります。
    C: 左側の車は右側の車に道を譲らなければなりません。
    D: 右側の車は左側の車に道を譲らなければなりません。
  answer: C
  explanation: 信号や標識のない交差点に2台の車両が同時に到達した場合、左側のドライバーは右側のドライバーに道を譲らなければなりません。その後、左側のドライバーは安全が確認できたら進むことができます。
- id: 294
  category: signs_and_signals
  question: 案内標識（ガイドサイン）は、ドライバーに方向や距離の情報を提供する____の標識です。
  choices:
    A: 黄色
    B: 赤色
    C: 緑色
    D: 白色
  answer: C
  explanation: 案内標識（目的地標識とも呼ばれます）は緑色の背景で、特定の目的地までの方向や距離の情報を提供します。不慣れな場所を運転する際に役立つ情報源となります。
- id: 295
  category: safe_driving_rules
  question: 追い越しのために、中央の黄色い二重実線を越えることは合法ですか？
  choices:
    A: はい。
    B: いいえ。
    C: 対向車がいない場合のみ合法です。
    D: 前方の車両が制限速度未満で走行している場合のみ合法です。
  answer: B
  explanation: 対面通行の道路の中央にある黄色い二重実線は、道路から曲がって出る場合を除き、どちらの車線からも線を越えてはならないことを意味します。私道や商業施設の入り口に出入りするために曲がる場合は、黄色い二重線を越えることができます。黄色い実線を越えての追い越しは禁止されています。
- id: 296
  category: safe_driving_rules
  question: 運転中、以下の状況で車両を停止させる必要があります：
  choices:
    A: 一時停止標識のある交差点。
    B: 赤信号がある場所。
    C: 交通警察官に停止を命じられたとき。
    D: 上記すべて。
  answer: D
  explanation: ドライバーが停止を義務付けられる状況には、一時停止標識のある交差点に近づいたとき、赤信号が点滅または点灯している交差点に近づいたとき、または交通警察官から車両の停止を命じられたときが含まれます。
- id: 297
  category: penalties_and_points
  question: 次の場合、MVC（自動車委員会）は開始前に路上試験を中止することがあります：
  choices:
    A: 安全でない試験車両を持ち込んだ場合。
    B: 車両のセンターコンソールやその他の装備が、試験官のブレーキペダルへのアクセスを妨げている場合。
    C: 車両にシートベルトがない場合。
    D: 上記すべて。
  answer: D
  explanation: 試験官が試験車両を安全でない、または不適切であると判断した場合、開始前に路上試験が拒否されることがあります。シートベルトがない場合や、試験官がフットブレーキまたはパーキングブレーキにアクセスできない場合、その車両は安全ではないと見なされることがあります。
- id: 298
  category: defensive_driving
  question: 後続車が攻撃的な運転（あおり運転）をしている場合、どうするべきですか？
  choices:
    A: 攻撃的なドライバーの進路から外れるようにする。
    B: 追い越していくドライバーをじっと見つめる。
    C: 追い越されそうになったらスピードを上げる。
    D: 追い越し車線を塞ぐ。
  answer: A
  explanation: 攻撃的なドライバーに遭遇した場合は、できる限りその進路から外れるように努めるべきです。敵意を持ったドライバーと目を合わせることは避けてください。スピードを上げて敵意を持ったドライバーに対抗しようとすると、相手をさらに怒らせ、危険性を高めるだけになる可能性があります。
