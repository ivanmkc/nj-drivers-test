  answer: C
  explanation: 一時停止標識から50フィート以内での駐車は禁止されています。(N.J.S.A. 39:4-138)
- id: 58
  category: safe_driving_rules
  question: 踏切からどのくらいの距離以内での駐車が禁止されていますか？
  choices:
    A: 25フィート
