    cada punto adicional.
- id: 115
  category: penalties_and_points
  question: ¿Cuántos puntos se imponen por conducción descuidada?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: A
  explanation: 'Conducción descuidada: 2 puntos. (N.J.S.A. 39:4-97)'
- id: 116
  category: penalties_and_points
  question: ¿Cuántos puntos se imponen por participar en carreras en una carretera?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: 'Carreras en la carretera: 5 puntos. (N.J.S.A. 39:4-52)'
- id: 117
  category: penalties_and_points
  question: Un infractor habitual es un conductor cuya licencia ha sido suspendida
