- id: 139
  category: sharing_the_road
  question: 'El límite de velocidad para ciclomotores (mopeds) es:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: Los conductores de ciclomotores (mopeds) no pueden exceder las 25 mph.
- id: 140
  category: sharing_the_road
  question: ¿Qué es un cruce de peatones no marcado?
  choices:
    A: Un cruce de peatones con pintura descolorida
    B: Un cruce de peatones en cada intersección, incluso si no está marcado con líneas
      pintadas
    C: Un área donde se cruza imprudentemente (jaywalking)
    D: Un cruce de peatones en propiedad privada
  answer: B
  explanation: Hay un cruce de peatones en cada intersección, incluso si no está marcado.
    Esto se conoce como un cruce de peatones no marcado.
- id: 141
  category: vehicle_information
  question: 'El seguro de responsabilidad civil para vehículos de motor es:'
  choices:
    A: Opcional en Nueva Jersey
    B: Obligatorio en Nueva Jersey
    C: Solo requerido para vehículos nuevos
    D: Solo requerido para vehículos comerciales
  answer: B
  explanation: El seguro de responsabilidad civil para vehículos de motor es obligatorio
    en Nueva Jersey. Todo vehículo registrado debe tenerlo. (N.J.S.A. 39:6B-1)
- id: 142
  category: vehicle_information
  question: ¿Cuánto tiempo después de mudarse a Nueva Jersey (NJ) debe un vehículo
    ser titulado y registrado?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Si un conductor se muda a Nueva Jersey (NJ), el vehículo debe ser titulado
    y registrado dentro de 60 días, o antes si el registro de otro estado vence primero.
- id: 143
  category: vehicle_information
  question: ¿Con qué frecuencia deben pasar la inspección estatal los vehículos de
    pasajeros (de 5 o más años de antigüedad del modelo)?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada tres años
    D: Cada cinco años
  answer: B
  explanation: Los vehículos de pasajeros con más de cinco años de antigüedad del
    modelo deben pasar las inspecciones estatales cada dos años.
- id: 144
  category: vehicle_information
  question: 'Los vehículos de pasajeros nuevos con menos de cinco años de antigüedad
    del modelo reciben una calcomanía del concesionario que vence:'
  choices:
    A: Un año después del registro
    B: Dos años después del registro
    C: Cinco años después del registro inicial
    D: Tres años después del registro
  answer: C
  explanation: Los vehículos de pasajeros nuevos con menos de cinco años de antigüedad
    del modelo reciben una calcomanía que vence cinco años después del registro inicial.
- id: 145
  category: vehicle_information
  question: ¿Qué tan pronto debe ser inspeccionado un vehículo después de registrarlo
    al mudarse a Nueva Jersey (NJ) (si tiene 5 o más años de antigüedad del modelo)?
  choices:
    A: 7 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Un vehículo de cinco años de antigüedad del modelo o más debe ser inspeccionado
    dentro de los 14 días posteriores a su registro en Nueva Jersey (NJ).
- id: 146
  category: vehicle_information
  question: Las placas de matrícula deben ser visibles desde 50 pies de noche. ¿A
    qué altura deben estar montadas?
  choices:
    A: Al menos 6 pulgadas pero menos de 36 pulgadas
    B: Al menos 12 pulgadas pero menos de 48 pulgadas sobre el suelo
    C: Al menos 18 pulgadas pero menos de 60 pulgadas
    D: A cualquier altura
  answer: B
  explanation: Las placas deben estar al menos a 12 pulgadas pero a menos de 48 pulgadas
    sobre el suelo. (N.J.S.A. 39:3-33)
- id: 147
  category: vehicle_information
  question: Si un conductor cancela el seguro del vehículo, ¿qué debe hacer con las
    placas?
  choices:
    A: Guardarlas para el próximo vehículo
    B: Devolverlas a la Comisión de Vehículos Motorizados (MVC)
    C: Destruirlas
    D: Nada
  answer: B
  explanation: Si un conductor cancela el seguro del vehículo, las placas deben ser
    devueltas a la Comisión de Vehículos Motorizados (MVC).
- id: 148
  category: vehicle_information
  question: ¿Cuál es la multa por usar cubiertas de placas que oscurecen las letras?
  choices:
    A: Hasta $50
    B: Hasta $100
    C: Hasta $200
    D: Hasta $500
  answer: B
  explanation: Usar cubiertas o marcos de placas que oscurezcan u oculten las letras
    es una infracción con una multa de hasta $100.
- id: 149
  category: signs_and_signals
  question: ¿Qué significa un semáforo en amarillo?
  choices:
    A: Acelerar para pasar
    B: Detenerse antes de entrar a la intersección a menos que esté demasiado cerca
      para detenerse de manera segura
    C: Avanzar con precaución
    D: Ceder el paso al tráfico en sentido contrario
  answer: B
  explanation: Cuando una luz amarilla sigue a una verde, el conductor debe detenerse
    antes de entrar a la intersección a menos que esté demasiado cerca para detenerse
    de manera segura.
- id: 150
  category: signs_and_signals
  question: 'Una luz roja intermitente significa:'
  choices:
    A: Ceder el paso y avanzar
    B: Detenerse, luego avanzar cuando sea seguro
    C: Reducir la velocidad
    D: Vehículos de emergencia acercándose
  answer: B
  explanation: Una luz roja intermitente requiere detenerse por completo antes de
    avanzar cuando sea seguro.
- id: 151
  category: signs_and_signals
  question: ¿Qué significa una 'luz verde prolongada' (stale green light)?
  choices:
    A: Un semáforo descompuesto
    B: Una luz que ha estado en verde por algún tiempo y puede cambiar pronto
    C: Una flecha verde
    D: Una luz verde en la noche
  answer: B
  explanation: Una luz verde prolongada (stale green light) es aquella que ha estado
    en verde por algún tiempo. Esté preparado para que cambie a amarillo y luego a
    rojo.
- id: 152
  category: signs_and_signals
  question: 'Una línea central discontinua significa:'
  choices:
    A: Prohibido rebasar
    B: Se permite rebasar en el lado con la línea discontinua
    C: La carretera está en construcción
    D: Tráfico en un solo sentido
  answer: B
  explanation: 'Una línea central discontinua: Se permite rebasar solo en el lado
    con la línea discontinua.'
- id: 153
  category: signs_and_signals
  question: ¿De qué color es una señal de advertencia?
  choices:
    A: Rojo
    B: Verde
    C: Amarillo (en forma de diamante)
    D: Azul
  answer: C
  explanation: Las señales de advertencia son amarillas y tienen forma de diamante.
- id: 154
  category: signs_and_signals
  question: ¿De qué color es una señal reglamentaria (como la de alto o límite de
    velocidad)?
  choices:
    A: Amarillo
    B: Blanco con letras negras (o rojo para alto/ceder el paso)
    C: Verde
    D: Azul
  answer: B
  explanation: Las señales reglamentarias suelen ser blancas con letras negras. Las
    señales de alto (stop) son rojas. Las señales de ceder el paso (yield) son rojas
    y blancas.
- id: 155
  category: signs_and_signals
  question: ¿Qué forma tiene una señal de alto (stop)?
  choices:
    A: Círculo
    B: Cuadrado
    C: Diamante
    D: Octágono (8 lados)
  answer: D
  explanation: Una señal de alto es un octágono (de 8 lados) y es la única señal con
    esta forma.
- id: 156
  category: signs_and_signals
  question: ¿Qué forma tiene una señal de ceder el paso (yield)?
  choices:
    A: Octágono
    B: Triángulo invertido
    C: Diamante
    D: Rectángulo
  answer: B
  explanation: Una señal de ceder el paso es un triángulo invertido (boca abajo).
- id: 157
  category: signs_and_signals
  question: ¿De qué color son las señales de guía/información en las autopistas?
  choices:
    A: Amarillo
    B: Blanco
    C: Verde
    D: Naranja
  answer: C
  explanation: Las señales verdes son señales de guía/información que se encuentran
    en las autopistas y muestran direcciones y distancias.
- id: 158
  category: signs_and_signals
  question: ¿De qué color son las señales de zona de construcción?
  choices:
    A: Amarillo
    B: Rojo
    C: Naranja
    D: Verde
  answer: C
  explanation: Las señales de advertencia de zona de construcción son naranjas.
- id: 159
  category: signs_and_signals
  question: 'Una sola línea blanca continua que cruza la calle en una intersección
    significa:'
  choices:
    A: Incorporarse
    B: Detenerse detrás de la línea por un semáforo o señal de tráfico
    C: Acelerar
    D: Zona de construcción más adelante
  answer: B
  explanation: Una sola línea blanca continua que cruza una calle en una intersección
    significa que un conductor debe detenerse detrás de la línea por un semáforo o
    señal de tráfico.
- id: 160
  category: signs_and_signals
  question: ¿Qué indican las señales azules en la autopista?
  choices:
    A: Advertencias
    B: Reglamentaciones
    C: Servicios (gasolina, comida, hospital)
    D: Construcción
  answer: C
  explanation: Las señales azules indican los servicios disponibles cerca de la autopista,
    como gasolineras, comida y hospitales.
- id: 161
  category: safe_driving_rules
  question: 'Tirar basura desde un vehículo en movimiento puede resultar en:'
  choices:
    A: Una advertencia
    B: Multas de hasta $1,000 y posible pérdida de la licencia
    C: Una multa de $50
    D: Solo servicio comunitario
  answer: B
  explanation: Multas de hasta $1,000 por arrojar objetos peligrosos. Si se arrojan
    desde un vehículo en movimiento, el conductor puede perder su licencia. (N.J.S.A.
    39:4-63)
- id: 162
  category: driver_responsibility
  question: ¿Qué es el monóxido de carbono (CO)?
  choices:
    A: Un gas visible del escape
    B: Un gas inodoro e incoloro presente en el escape de los vehículos
    C: Un subproducto inofensivo de los motores
    D: Un gas que huele a huevos podridos
  answer: B
  explanation: El monóxido de carbono es un gas inodoro e incoloro presente en el
    escape de un vehículo que puede ser fatal.
- id: 163
  category: defensive_driving
  question: 'En un choque, usted debe elegir golpear:'
  choices:
    A: Algo que viene de frente
    B: Algo que no se mueve en lugar de algo que viene hacia usted; algo que ceda
      en lugar de algo duro
    C: El objeto más grande disponible
    D: Nada; siempre desvíese fuera de la carretera
  answer: B
  explanation: Elija algo que se mueva en la misma dirección, luego algo que no se
    mueva, en lugar de algo que venga de frente. Elija objetos que cedan (arbustos)
    en lugar de objetos duros.
- id: 164
  category: safe_driving_rules
  question: En una rotonda (círculo de tráfico) sin señales, ¿quién tiene el derecho
    de paso?
  choices:
    A: El vehículo que entra a la rotonda
    B: El vehículo que se aproxima por la derecha
    C: El vehículo que ya está en la rotonda
    D: El vehículo más grande
  answer: B
  explanation: 'La regla básica para intersecciones/rotondas no controladas: el vehículo
    de la izquierda cede el paso al vehículo que se aproxima por la derecha.'
- id: 165
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en una autopista?
  choices:
    A: Retroceder en la rampa de salida
    B: Detenerse y retroceder en la autopista
    C: Ir a la siguiente salida
    D: Hacer un giro en U
  answer: C
  explanation: Si un conductor se pasa de una salida, debe ir a la siguiente salida.
    Nunca retroceda en una rampa de salida o en la autopista.
- id: 166
  category: penalties_and_points
  question: ¿Cuál es la edad mínima para comprar o consumir alcohol legalmente en
    Nueva Jersey?
  choices:
    A: '18'
    B: '19'
    C: '20'
    D: '21'
  answer: D
  explanation: En NJ, una persona debe tener 21 años o más para comprar, poseer o
    consumir alcohol.
- id: 167
  category: alcohol_drugs_health
  question: 'La Ley de Kulesh, Kuberts y Bolis establece que el uso ilegal del teléfono
    celular mientras se conduce constituye:'
  choices:
    A: Una infracción de tráfico menor
    B: Imprudencia temeraria bajo los estatutos de homicidio vehicular y agresión
      con un automóvil
    C: Un delito menor
    D: Una infracción de estacionamiento
  answer: B
  explanation: Esta ley establece el uso ilegal del teléfono celular mientras se conduce
    como imprudencia temeraria bajo los estatutos de homicidio vehicular y agresión
    con un automóvil.
- id: 168
  category: sharing_the_road
  question: ¿Qué significa 'no-zone' (zona ciega) con respecto a los camiones?
  choices:
    A: Zonas de no estacionar cerca de los camiones
    B: Puntos ciegos donde el conductor del camión no puede ver a otros vehículos
    C: Zonas de velocidad restringida
    D: Zonas de no rebasar en las autopistas
  answer: B
  explanation: Las 'no-zones' son puntos ciegos alrededor de los camiones donde el
    conductor del camión no puede ver a otros vehículos.
- id: 169
  category: sharing_the_road
  question: 'La multa por violar la Ley de Paso Seguro (Safe Passing Law) y causar
    lesiones corporales es de:'
  choices:
    A: $100
    B: $250
    C: $500 y 2 puntos de penalización en el historial de manejo
    D: $1,000
  answer: C
  explanation: 'Si resultan lesiones corporales: multa de $500 y 2 puntos. Si no hay
    lesiones: multa de $100 y ningún punto. (N.J.S.A. 39:4-92.4)'
- id: 170
  category: defensive_driving
  question: ¿Qué debe hacer un conductor con respecto a un sistema de frenos ABS?
  choices:
    A: Bombear los frenos en una emergencia
    B: Aplicar presión constante; nunca bombear los frenos ABS ni dar tirones al volante
    C: Usarlos solo en la lluvia
    D: Tocarlos ligeramente
  answer: B
  explanation: Con el sistema ABS, aplique presión constante al pedal del freno. Nunca
    bombee los frenos ABS ni dé tirones violentos al volante al frenar.
- id: 171
  category: driver_responsibility
  question: 'La multa por no cumplir con la ley de seguridad de pasajeros infantiles
    es:'
  choices:
    A: No menos de $25 ni más de $50
    B: No menos de $50 ni más de $75, más cargos y costos judiciales
    C: No menos de $100 ni más de $200
    D: $500
  answer: B
  explanation: El incumplimiento de la ley de seguridad de pasajeros infantiles conlleva
    una multa de no menos de $50 ni más de $75, más cargos y costos judiciales.
- id: 172
  category: safe_driving_rules
  question: 'Cuando un vehículo que se aproxima usa las luces altas, el conductor
    debe:'
  choices:
    A: Encenderle las luces altas en respuesta
    B: Mirar hacia el lado derecho de la carretera hasta que el vehículo pase
    C: Cerrar un ojo
    D: Acelerar para pasar rápidamente
  answer: B
  explanation: Mirar hacia el lado derecho de la carretera hasta que el vehículo pase.
    Nunca encienda las luces altas a un conductor que se aproxima.
- id: 173
  category: defensive_driving
  question: ¿Cuánto tiempo toma recuperarse del resplandor de las luces altas de un
    vehículo que se aproxima?
  choices:
    A: 1 a 2 segundos
    B: 3 a 5 segundos
    C: 7 a 10 segundos
    D: 15 segundos
  answer: B
  explanation: Puede tomar de tres a cinco segundos recuperarse del resplandor de
    los faros de luces altas que se aproximan.
- id: 174
  category: penalties_and_points
  question: ¿Cuál es el recargo por conducir bajo la influencia (DUI) o negarse a
    realizar una prueba de alcoholemia?
  choices:
    A: $500 por año durante 3 años
    B: $750 por año durante 3 años
    C: $1,000 por año durante 3 años
    D: $1,500 por año durante 5 años
  answer: C
  explanation: El recargo por la infracción de DUI o negativa es de $1,000 por año
    durante tres años.
- id: 175
  category: penalties_and_points
  question: 'Un dispositivo de bloqueo de encendido evita que un vehículo arranque
    si la concentración de alcohol en la sangre (BAC) del conductor excede:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: Un dispositivo de bloqueo de encendido evita que el vehículo arranque
    si el BAC del conductor excede el 0.05%.
- id: 176
  category: safe_driving_rules
  question: 'Un conductor de autobús escolar puede usar un teléfono celular solo cuando:'
  choices:
    A: Usa manos libres en cualquier momento
    B: En una emergencia o cuando el autobús está estacionado de manera segura fuera
      de la carretera
    C: Cuando no hay estudiantes en el autobús
    D: Nunca
  answer: B
  explanation: Un conductor de autobús escolar no puede usar un teléfono celular excepto
    en una emergencia o cuando el autobús está estacionado en un área segura fuera
    de la carretera. (N.J.S.A. 39:3B-25)
- id: 177
  category: sharing_the_road
  question: ¿Qué sanción enfrentan los peatones menores de 17 años por violar las
    leyes peatonales?
  choices:
    A: Multa de $10
    B: Multa de $22
    C: Multa de $54
    D: Solo una advertencia
  answer: B
  explanation: Los peatones menores de 17 años que violan las leyes peatonales enfrentan
    una multa de $22. Los adultos enfrentan una multa de $54.
- id: 178
  category: driver_responsibility
  question: 'La multa por la infracción de dejar el motor en marcha (idling) varía
    de:'
  choices:
    A: $50 a $250
    B: $100 a $500
    C: $250 a $1,000
    D: $500 a $2,000
  answer: C
  explanation: Los propietarios de vehículos y propiedades enfrentan multas de $250
    a $1,000 por cada infracción de dejar el motor en marcha. (N.J.S.A. 39:3-70.2)
- id: 179
  category: penalties_and_points
  question: 'Llevar envases de bebidas alcohólicas abiertos o sin sellar en un vehículo
    resulta en una multa de:'
  choices:
    A: $100 por la primera infracción
    B: $200 por la primera infracción
    C: $300 por la primera infracción
    D: $500 por la primera infracción
  answer: B
  explanation: $200 por una primera infracción y $250 o 10 días de servicio comunitario
    por infracciones posteriores. (N.J.S.A. 39:4-51a)
- id: 180
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia de ciclomotor (moped)?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '17'
  answer: B
  explanation: La edad mínima para obtener una licencia de ciclomotor (moped) es de
    15 años.
- id: 181
  category: defensive_driving
  question: 'En pavimento mojado a 30 mph, la distancia mínima segura de seguimiento
    es:'
  choices:
    A: 3 largos de automóvil
    B: 4 largos de automóvil
    C: 6 largos de automóvil
    D: 9 largos de automóvil
  answer: C
  explanation: En pavimento mojado a 30 mph, la distancia mínima segura de seguimiento
    es de 6 largos de automóvil.
- id: 182
  category: defensive_driving
  question: 'En hielo a 20 mph, la distancia mínima segura de seguimiento es:'
  choices:
    A: 4 largos de automóvil
    B: 6 largos de automóvil
    C: 10 largos de automóvil
    D: 12 largos de automóvil
  answer: D
  explanation: En hielo a 20 mph, la distancia mínima segura de seguimiento es de
    12 largos de automóvil.
- id: 183
  category: safe_driving_rules
  question: 'Al ingresar a una autopista desde un carril de aceleración, un conductor
    debe:'
  choices:
    A: Detenerse y esperar un espacio
    B: Acelerar para igualar el flujo del tráfico, ceder el paso al tráfico e ingresar
      al carril derecho
    C: Ingresar a cualquier velocidad
    D: Ingresar al carril izquierdo para incorporarse más rápido
  answer: B
  explanation: Acelere hasta alcanzar el flujo del tráfico al salir del carril de
    aceleración, ceda el paso al tráfico que ya está en la autopista e ingrese al
    carril derecho cuando sea seguro.
- id: 184
  category: driver_responsibility
  question: ¿Cuál es la técnica de frenado correcta con frenos convencionales (sin
    ABS) al patinar?
  choices:
    A: Pisar el freno con fuerza
    B: Soltar y volver a aplicar con menos presión hasta que el vehículo esté bajo
      control
    C: Bombear el freno rápidamente
    D: Usar el freno de estacionamiento
  answer: B
  explanation: Si los frenos se bloquean, suelte el pedal y vuelva a aplicarlo con
    un poco menos de presión. Repita con menos presión hasta que el vehículo esté
    bajo control.
- id: 185
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por conducir bajo la influencia (DUI) por una tercera
    infracción que ocurre dentro de los 10 años posteriores a la segunda (para infracciones
    a partir del 12/1/19)?
  choices:
    A: Suspensión de la licencia por 2 años
    B: Suspensión de la licencia por 5 años
    C: Suspensión de la licencia por 8 años
    D: Revocación permanente de la licencia
  answer: C
  explanation: 'Tercera infracción de DUI a partir del 12/1/19: suspensión de la licencia
    por 8 años, multa de $1,000, recargo de $1,500 por año durante 3 años.'
- id: 186
  category: safe_driving_rules
  question: ¿Qué son los Corredores Seguros (Safe Corridors) en Nueva Jersey?
  choices:
    A: Autopistas con límites de velocidad reducidos
    B: Autopistas donde las multas se duplican según las estadísticas de altas tasas
      de accidentes
    C: Áreas de zonas escolares
    D: Zonas de construcción
  answer: B
  explanation: Los Corredores Seguros duplican las multas en varias autopistas estatales.
    Se designan en función de tasas de accidentes un 50% superiores a la tasa estatal
    y más de 1,000 accidentes en 3 años.
- id: 187
  category: penalties_and_points
  question: ¿Cuántos puntos se imponen por no ceder el paso a un peatón en un cruce
    peatonal?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: 'No ceder el paso a un peatón en un cruce peatonal: 2 puntos. (N.J.S.A.
    39:4-35)'
- id: 188
  category: penalties_and_points
  question: ¿Cuántos puntos se imponen por un giro en U incorrecto?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: 'Giro en U incorrecto: 3 puntos. (N.J.S.A. 39:4-125)'
- id: 189
  category: penalties_and_points
  question: ¿Cuántos puntos se imponen por no pasar por la derecha de un vehículo
    que avanza en dirección opuesta?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: 'No pasar por la derecha de un vehículo que avanza en dirección opuesta:
    5 puntos. (N.J.S.A. 39:4-84)'
- id: 190
  category: safe_driving_rules
  question: ¿Cómo debe un conductor acercarse a una curva?
  choices:
    A: Mantener la velocidad a través de la curva
    B: Reducir la velocidad antes de entrar a la curva y evitar desviarse hacia otro
      carril
    C: Acelerar a través de la curva
    D: Frenar bruscamente durante la curva
  answer: B
  explanation: Reduzca la velocidad antes de entrar a una curva y evite desviarse
    hacia otro carril.
- id: 191
  category: sharing_the_road
  question: 'Cuando un jinete a caballo hace una señal levantando la mano, el conductor
    debe:'
  choices:
    A: Reducir la velocidad a 25 mph y rebasar
    B: Detenerse y permanecer inmóvil hasta que el caballo pase
    C: Tocar la bocina para advertir al caballo
    D: Cambiar de carril y rebasar
  answer: B
  explanation: Ante la señal de un jinete a caballo, el conductor debe detenerse y
    permanecer inmóvil hasta que el caballo pase. (N.J.S.A. 39:4-72)
- id: 192
  category: defensive_driving
  question: 'La mayoría de los incendios de automóviles son causados por:'
  choices:
    A: Sobrecalentamiento del motor
    B: Fugas de combustible
    C: Cortocircuitos en el sistema eléctrico
    D: Fumar cigarrillos
  answer: C
  explanation: La mayoría de los incendios de automóviles son causados por cortocircuitos
    en el sistema eléctrico.
- id: 193
  category: driver_responsibility
  question: ¿Qué tipo de luces prohíbe la ley de NJ que estén encendidas mientras
    un vehículo avanza hacia adelante?
  choices:
    A: Luces antiniebla
    B: Luces de estacionamiento
    C: Luces de marcha atrás
    D: Luces del tablero
  answer: C
  explanation: Es contra la ley de NJ tener las luces de marcha atrás encendidas mientras
    un vehículo avanza hacia adelante. (N.J.S.A. 39:3-52)
- id: 194
  category: safe_driving_rules
  question: 'El Compromiso de Seguridad de la Ley de Nikhil (Nikhil''s Law) requiere
    que los conductores se comprometan a:'
  choices:
    A: Nunca exceder el límite de velocidad
    B: Detenerse por completo en las señales de alto, mantenerse alerta, usar teléfonos
      manos libres, planificar con anticipación
    C: Siempre usar el cinturón de seguridad
    D: Nunca beber y conducir
  answer: B
  explanation: 'El compromiso de la Ley de Nikhil incluye: Detenerse por completo,
    Mantenerse alerta, Hablar de forma segura (manos libres) y Planificar con anticipación.'
- id: 195
  category: vehicle_information
  question: ¿Cuál es la tarifa anual de registro de motocicletas en NJ?
  choices:
    A: $24
    B: $35
    C: $50
    D: $65
  answer: D
  explanation: La tarifa anual de registro de motocicletas en NJ es de $65.
- id: 196
  category: penalties_and_points
  question: ¿Cuántos puntos se imponen por rebasar incorrectamente a un camión de
    postres helados (helados)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: 'Rebasar incorrectamente a un camión de postres helados: 4 puntos.
    (N.J.S.A. 39:4-128.4)'
- id: 197
  category: penalties_and_points
  question: 'Un conductor que acumule 12-14 puntos o más recibirá:'
  choices:
    A: Una carta de advertencia
    B: Un Aviso de Suspensión Programada
    C: Una suspensión automática
    D: Una comparecencia obligatoria ante el tribunal
  answer: B
  explanation: Los conductores que acumulan 12-14 puntos o más en un período de 24
    meses reciben un Aviso de Suspensión Programada.
- id: 198
  category: safe_driving_rules
  question: 'La fecha límite para registrarse para votar antes de una elección es:'
  choices:
    A: 7 días
    B: 14 días
    C: 21 días
    D: 30 días
  answer: C
  explanation: La fecha límite para registrarse para votar es 21 días antes de una
    elección.
- id: 199
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir mientras se está suspendido por un delito
    relacionado con conducir bajo la influencia (DUI)?
  choices:
    A: Multa de $200
    B: Multa de $500, suspensión adicional de 1 a 2 años, posible encarcelamiento
      de 10 a 90 días
    C: Multa de $100 y suspensión de 30 días
    D: Solo una advertencia
  answer: B
  explanation: 'Conducir mientras se está suspendido por DUI/negarse a la prueba:
    multa de $500, suspensión adicional de 1 a 2 años y posible encarcelamiento de
    10 a 90 días.'
- id: 200
  category: alcohol_drugs_health
  question: 'Un conductor menor de edad (menor de 21 años) con una concentración de
    alcohol en la sangre (BAC) de 0.01% o más se enfrenta a:'
  choices:
    A: Una advertencia
    B: Suspensión de la licencia de 30 a 90 días, 15 a 30 días de servicio comunitario
      y participación en el IDRC
    C: Solo una multa de $100
    D: Las mismas sanciones que los adultos
  answer: B
  explanation: 'Primera infracción de un menor de edad con BAC de 0.01% a 0.08%: suspensión
    de 30 a 90 días, 15 a 30 días de servicio comunitario y participación en el IDRC/programa
    de educación sobre el alcohol.'
- id: 201
  category: safe_driving_rules
  question: 'Siempre use las luces direccionales cuando:'
  choices:
    A: Cambie de carril.
    B: Entre o salga de un espacio de estacionamiento.
    C: Se incorpore al tráfico desde un área de estacionamiento o callejón.
    D: Todas las anteriores.
  answer: D
  explanation: Sus luces direccionales siempre deben usarse cuando realice cualquier
    movimiento hacia la izquierda o la derecha. Debe usar su direccional al incorporarse
    al tráfico desde un espacio de estacionamiento junto a la acera, al cambiar a
    un nuevo carril o al rebasar a otro vehículo.
- id: 202
  category: safe_driving_rules
  question: 'Al conducir en carreteras principales:'
  choices:
    A: Manténgase alerta.
    B: Mantenga sus ojos en movimiento.
    C: Esté preparado para reaccionar ante los peligros de la carretera.
    D: Todas las anteriores.
  answer: D
  explanation: Es importante mantenerse alerta en las carreteras y estar preparado
    para reaccionar ante peligros inesperados. Para evitar la "hipnosis de carretera",
    debe evitar mirar fijamente a una sola cosa por más de unos pocos segundos.
- id: 203
  category: sharing_the_road
  question: 'Usted conduce cuesta arriba y se acerca a un camión pesado por detrás.
    Debe saber que:'
  choices:
    A: El camión puede estar viajando a una velocidad menor que el límite de velocidad
      publicado.
    B: Es posible que no pueda rebasar al camión de manera segura.
    C: Es posible que no pueda rebasar al camión legalmente.
    D: Todas las anteriores.
  answer: D
  explanation: Los conductores deben ser conscientes de que los vehículos grandes
    a menudo viajan a una velocidad menor que el límite de velocidad publicado, especialmente
    al conducir en una pendiente, y deben tener precaución al acercarse a un vehículo
    grande por detrás. Cuando se está en una colina con visibilidad limitada, es ilegal
    rebasar a otro vehículo.
- id: 204
  category: defensive_driving
  question: 'Cuando vea a otros conductores a su alrededor actuando o reaccionando
    con enojo:'
  choices:
    A: No haga contacto visual.
    B: No reaccione con gestos de las manos.
    C: Distánciese de la situación.
    D: Todas las anteriores.
  answer: D
  explanation: Cuando otros conductores se comportan con enojo, debe tomar medidas
    para distanciarse física y mentalmente de la situación. Evite hacer contacto visual
    con ellos, o hacer movimientos corporales o gestos que puedan provocarlos. Reduzca
    la velocidad, hágase a un lado o haga lo que pueda de manera segura para ponerse
    fuera de peligro.
- id: 205
  category: safe_driving_rules
  question: 'Una persona que camina con un bastón blanco o un perro guía probablemente
    sea:'
  choices:
    A: Una persona sorda.
    B: Una persona involucrada en un estudio de tráfico.
    C: Una persona ciega.
    D: Ninguna de las anteriores.
  answer: C
  explanation: Los conductores siempre deben ceder el derecho de paso a un peatón
    cuando el peatón es una persona ciega que usa un bastón blanco o un perro guía.
- id: 206
  category: safe_driving_rules
  question: 'En una autopista, se da cuenta de que se pasó su vuelta o salida. Usted
    debe:'
  choices:
    A: Dar la vuelta rápidamente desde su carril de circulación.
    B: Detenerse y retroceder.
    C: Continuar conduciendo hasta llegar a la siguiente vuelta, salida u otro lugar
      donde pueda dar la vuelta de manera segura.
    D: Hacer señales a otros conductores para que se detengan y usted pueda dar la
      vuelta.
  answer: C
  explanation: Si se pasa su vuelta o salida, no retroceda; continúe hasta la siguiente
    vuelta o salida donde pueda dar la vuelta de manera segura. Es ilegal retroceder
    en el acotamiento (arcén) o en una autopista.
- id: 207
  category: safe_driving_rules
  question: 'Al dar la vuelta o cambiar de carril, usted debe:'
  choices:
    A: Siempre indicar sus intenciones con las direccionales, incluso cuando no haya
      tráfico visible.
    B: Usar las direccionales solo si hay tráfico visible.
    C: Usar las direccionales solo al conducir de noche.
    D: Usar las direccionales solo al conducir con tráfico pesado de noche.
  answer: A
  explanation: Siempre indique sus intenciones con las direccionales al cambiar de
    carril, dar la vuelta o alejarse de una acera. No se permita volverse perezoso
    y formar el mal hábito de no seguir esta ley.
- id: 208
  category: alcohol_drugs_health
  question: 'Tomar drogas junto con alcohol:'
  choices:
    A: Aumenta el riesgo de causar un choque.
    B: No es más peligroso que consumir alcohol por sí solo.
    C: Disminuye el efecto del alcohol en su capacidad para conducir.
    D: No tiene ningún efecto en su capacidad general para conducir.
  answer: A
  explanation: Las drogas (incluyendo medicamentos ilegales, recetados y de venta
    libre) pueden afectar su función cerebral y deteriorar su capacidad para conducir
    de manera segura. Combinar alcohol con otras drogas aumentará el riesgo de un
    choque.
- id: 209
  category: signs_and_signals
  question: 'Al conducir sobre pavimento mojado, es importante recordar:'
  choices:
    A: Que el pavimento es especialmente resbaladizo justo después de que empieza
      a llover.
    B: Que las carreteras mojadas pueden causar hidroplaneo.
    C: Dejarse espacio adicional al detenerse.
    D: Todas las anteriores.
  answer: D
  explanation: Las superficies de las carreteras mojadas pueden ser peligrosamente
    resbaladizas, especialmente inmediatamente después de una lluvia. Cuando conduce
    en carreteras mojadas, su vehículo viaja sobre una fina capa de aceite, suciedad
    y agua. Reduzca la velocidad cuando haya lluvia intensa, agua estancada o aguanieve
    en la carretera para reducir el riesgo de que sus ruedas pierdan tracción en la
    superficie resbaladiza.
- id: 210
  category: signs_and_signals
  question: 'Una señal amarilla en forma de diamante con una flecha curva apuntando
    hacia la derecha indica:'
  choices:
    A: Carretera de un solo sentido.
    B: Prohibido dar vuelta a la derecha.
    C: Salida.
    D: Curva cerrada a la derecha más adelante en la carretera.
  answer: D
  explanation: Las señales de advertencia amarillas en forma de diamante con flechas
    curvas advierten a los conductores de próximas curvas cerradas en la carretera.
- id: 211
  category: safe_driving_rules
  question: 'Una luz verde fija en una intersección significa que usted:'
  choices:
    A: Debe reducir la velocidad y prepararse para detenerse.
    B: Debe detenerse y verificar si viene tráfico antes de continuar.
    C: Puede cruzar la intersección si la vía está despejada.
    D: No puede girar a la derecha.
  answer: C
  explanation: Una luz verde fija significa que puede cruzar la intersección si la
    vía está despejada. También puede girar a la derecha o a la izquierda con una
    luz verde fija, a menos que una señal prohíba el giro. Al girar, debe ceder el
    paso a otros vehículos y peatones dentro de la intersección.
- id: 212
  category: vehicle_information
  question: 'El cinturón de seguridad debe ajustarse de manera que:'
  choices:
    A: Quede suelto.
    B: Quede abrochado ajustadamente sobre los huesos de la cadera y la parte inferior
      del abdomen.
    C: Quede oculto debajo del asiento.
    D: Evite que la alarma o la luz del cinturón de seguridad se activen.
  answer: B
  explanation: Los cinturones de regazo deben quedar ajustados sobre los huesos de
    la cadera y la parte inferior del abdomen. Los cinturones de hombro deben quedar
    cómodos de manera que pueda insertar su puño entre el cinturón y su pecho.
- id: 213
  category: safe_driving_rules
  question: 'Si se detiene al costado de la carretera de noche:'
  choices:
    A: Apague todas sus luces.
    B: Use solo sus luces de estacionamiento.
    C: Use solo sus faros delanteros.
    D: Encienda sus luces intermitentes de emergencia y deje encendidas las luces
      bajas.
  answer: D
  explanation: Si se detiene al costado de la carretera de noche, encienda sus luces
    intermitentes de emergencia y deje encendidos los faros de luz baja. Asegúrese
    de que los demás usuarios de la vía puedan ver claramente su vehículo.
- id: 214
  category: safe_driving_rules
  question: 'No puede rebasar de manera segura en una calle de doble sentido y dos
    carriles a menos que:'
  choices:
    A: Pueda ver claramente la carretera más adelante.
    B: Pueda regresar a su carril antes de encontrarse con el tráfico en sentido contrario.
    C: Su vehículo sea capaz de alcanzar la velocidad necesaria para rebasar.
    D: Todas las anteriores.
  answer: D
  explanation: No puede rebasar de manera segura al conducir en una calle de doble
    sentido y dos carriles a menos que pueda ver claramente la carretera más adelante,
    pueda regresar a su carril antes de encontrarse con el tráfico en sentido contrario
    y su vehículo sea capaz de alcanzar la velocidad necesaria para rebasar. No rebase
    donde sea ilegal e inseguro hacerlo.
- id: 215
  category: signs_and_signals
  question: 'Dos líneas amarillas continuas en el pavimento significan:'
  choices:
    A: Se permite rebasar a los conductores de ambas direcciones.
    B: No se permite rebasar.
    C: Se permite rebasar si se encuentra en la cima de una colina.
    D: Se permite rebasar solo durante el día.
  answer: B
  explanation: Las líneas amarillas le indican que el tráfico al otro lado de las
    líneas se mueve en dirección opuesta. Nunca debe cruzar dos líneas amarillas continuas
    para rebasar desde ninguna dirección.
- id: 216
  category: safe_driving_rules
  question: 'Un conductor puede rebasar legalmente por el lado derecho de otro vehículo:'
  choices:
    A: Si el vehículo está esperando para girar a la izquierda y hay un carril de
      rebase disponible.
    B: Incluso si eso significa conducir fuera del pavimento.
    C: En un puente estrecho.
    D: En cualquier momento.
  answer: A
  explanation: Si hay un carril de rebase disponible, puede rebasar por la derecha
    a un vehículo o bicicleta que esté girando a la izquierda o esperando para girar
    a la izquierda. También es legal rebasar por la derecha al conducir en una carretera
    de varios carriles con dos o más carriles que viajan en la misma dirección. Nunca
    debe conducir fuera del pavimento o de la parte principal transitada de la vía
    para rebasar a otro vehículo.
- id: 217
  category: sharing_the_road
  question: 'Si un guardia de cruce escolar está dirigiendo el tráfico en una zona
    escolar, usted debe:'
  choices:
    A: Seguir las instrucciones dadas por el guardia de cruce.
    B: Copiar lo que hace el tráfico circundante, a pesar de las instrucciones del
      guardia de cruce.
    C: Asumir que el guardia no debería estar dirigiendo el tráfico.
    D: Seguir las reglas que estarían vigentes si no hubiera niños presentes.
  answer: A
  explanation: Esté preparado para reducir su velocidad y tener precaución cuando
    se lo indique una señal, un guardia de cruce o un oficial de policía. Siempre
    conduzca con extrema precaución en una zona escolar.
- id: 218
  category: safe_driving_rules
  question: 'Señalizar sus intenciones antes de girar, cambiar de carril o alejarse
    de un borde de la acera:'
  choices:
    A: Es necesario solo si hay otro tráfico presente.
    B: Es un buen hábito de manejo y es requerido por la ley.
    C: Es necesario solo durante la maniobra, no antes.
    D: No es necesario si la maniobra se realiza lentamente.
  answer: B
  explanation: Al cambiar de carril o girar, señalice sus intenciones con mucha anticipación.
    La ley requiere que ponga la luz direccional durante al menos 100 pies antes de
    mover su vehículo a la derecha o a la izquierda. Antes de alejarse de un borde
    de la acera, siempre señalice para informar a los conductores que pasan sobre
    sus intenciones.
- id: 219
  category: signs_and_signals
  question: 'Si un vehículo de emergencia con luces intermitentes viaja en el área
    donde usted conduce, usted debe:'
  choices:
    A: Acelerar para evitar al vehículo de emergencia.
    B: Detener su vehículo inmediatamente y evitar que pasen.
    C: Hacer todo lo posible para darle al vehículo de emergencia un camino despejado
      para transitar.
    D: Hacerle señales al vehículo de emergencia cuando sea seguro que lo rebasen.
  answer: C
  explanation: Si un vehículo de emergencia con luces intermitentes viaja en el área
    donde usted conduce, debe hacer todo lo posible para darle un camino despejado
    para transitar. Si es seguro hacerlo, hágase a un lado de la carretera para darle
    al vehículo de emergencia una vía libre.
- id: 220
  category: safe_driving_rules
  question: 'Si desea salir de la autopista pero se ha pasado su salida, usted debe:'
  choices:
    A: Ir a la siguiente salida.
    B: Hacer un giro en U a través de la mediana.
    C: Detenerse en el acotamiento y retroceder su auto hasta la salida.
    D: Hacerle señas a un oficial de policía para que lo escolte de regreso a su salida.
  answer: A
  explanation: Si se pasa su salida, debe tomar la siguiente salida. No se detenga
    ni retroceda en la autopista, no se desvíe bruscamente cruzando varios carriles
    para intentar tomar la salida en el último segundo, ni cruce la mediana para dar
    la vuelta. Todas estas maniobras son ilegales y extremadamente peligrosas.
- id: 221
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Ponga la luz direccional al menos 100 pies antes de cambiar de carril para
      rebasar y asegúrese de que no haya tráfico en sentido contrario.
    B: Use sus espejos y mire por encima de su hombro izquierdo para revisar su punto
      ciego al rebasar por la izquierda.
    C: Al rebasar, espere hasta que pueda ver ambos faros del vehículo rebasado en
      su espejo retrovisor antes de regresar a su carril original.
    D: Todas las anteriores.
  answer: D
  explanation: Al rebasar, siempre debe poner la luz direccional con al menos 100
    pies de anticipación a su cambio de carril. Siempre revise detrás de usted en
    sus espejos y mire por encima de su hombro para revisar su punto ciego. Espere
    hasta que pueda ver ambos faros del vehículo rebasado en su espejo retrovisor
    antes de regresar a su carril original.
- id: 222
  category: safe_driving_rules
  question: 'En una intersección de cuatro vías con señales de alto (four-way stop):'
  choices:
    A: El conductor que llega primero tiene el derecho de paso.
    B: El conductor que llega último tiene el derecho de paso.
    C: Un conductor debe continuar conduciendo sin detenerse.
    D: Un conductor debe hacer señas a los demás conductores para que avancen.
  answer: A
  explanation: En las intersecciones de cuatro vías con señales de alto, el tráfico
    de las cuatro direcciones debe detenerse. El primer vehículo en llegar a la intersección
    debe avanzar primero. Si dos vehículos llegan a la intersección al mismo tiempo,
    el conductor de la izquierda cede el paso al conductor de la derecha.
- id: 223
  category: safe_driving_rules
  question: 'Puede beber bebidas alcohólicas en un vehículo en una vía pública:'
  choices:
    A: Siempre y cuando no esté conduciendo.
    B: Si viaja en el asiento trasero.
    C: Si viaja en la parte trasera de una camioneta (pick-up).
    D: Bajo ninguna circunstancia.
  answer: D
  explanation: Es contra la ley consumir o poseer cualquier bebida alcohólica mientras
    se encuentra en una vía pública o acera. Además, está prohibido guardar un envase
    de bebida alcohólica abierto en un área de un vehículo motorizado normalmente
    ocupada por el conductor o los pasajeros en cualquier vía pública.
- id: 224
  category: safe_driving_rules
  question: 'Al hacer un giro a la derecha con luz verde, usted debe:'
  choices:
    A: Mantener su velocidad normal de conducción.
    B: Detenerse y buscar patrullas de policía cercanas.
    C: Ceder el paso a los peatones.
    D: Aumentar su velocidad normal de conducción.
  answer: C
  explanation: A menos que una señal indique lo contrario, puede girar a la derecha
    o a la izquierda con una luz verde fija. Al girar, debe ceder el paso a otros
    vehículos y peatones dentro de la intersección.
- id: 225
  category: vehicle_information
  question: 'El hidroplaneo (hydroplaning) generalmente es causado por:'
  choices:
    A: Paradas excesivas.
    B: Paradas repentinas.
    C: Giros repentinos.
    D: Velocidad excesiva.
  answer: D
  explanation: Sus llantas se vuelven menos efectivas para despejar el agua de la
    carretera a medida que aumenta su velocidad. Si conduce demasiado rápido, pueden
    perder su agarre por completo, dejando que el vehículo se deslice sobre una capa
    de agua. Esto se conoce como "hidroplaneo".
- id: 226
  category: signs_and_signals
  question: 'Las señales de tránsito y las marcas en el pavimento:'
  choices:
    A: Deben ser obedecidas siempre.
    B: Son solo sugerencias.
    C: Deben seguirse solo cuando hay otro tráfico.
    D: Deben seguirse solo cuando hay un oficial de policía presente.
  answer: A
  explanation: El flujo del tráfico es controlado por marcas en el pavimento, isletas
    de tráfico, semáforos y señales. Estos dispositivos informan a los conductores
    sobre las condiciones en la vía y ayudan a guiarlos de manera segura a sus destinos.
    Siempre debe obedecer las señales de tránsito, los semáforos y las marcas en el
    pavimento.
- id: 227
  category: signs_and_signals
  question: 'Las señales en forma de cruz (crossbuck) indican:'
  choices:
    A: Cruces de ferrocarril.
    B: Zonas escolares.
    C: Zonas de no rebasar.
    D: Hospitales.
  answer: A
  explanation: Las señales en forma de cruz (crossbuck) indican a los conductores
    que deben ceder el paso a los trenes en un cruce de ferrocarril. Los conductores
    no deben intentar ganarle el paso a un tren.
- id: 228
  category: defensive_driving
  question: 'Al conducir en carreteras resbaladizas, usted debe:'
  choices:
    A: Usar rutas alternativas.
    B: Conducir como lo haría en carreteras secas.
    C: Aumentar su distancia de seguimiento.
    D: Evitar cruzar puentes o intersecciones.
  answer: C
  explanation: En carreteras resbaladizas, debe aumentar su distancia de seguimiento.
    Puede tomar más tiempo detener su vehículo de lo que tomaría en condiciones normales.
- id: 229
  category: safe_driving_rules
  question: ¿Quién debe ceder el paso cuando un conductor está girando y un peatón
    está cruzando sin un semáforo?
  choices:
    A: Quien haya empezado a moverse al último
    B: El conductor
    C: Quien sea más lento
    D: El peatón
  answer: B
  explanation: Los conductores deben ceder el paso a los peatones cuando cruzan en
    cualquier intersección sin semáforo, haya o no un cruce peatonal.
- id: 230
  category: alcohol_drugs_health
  question: ¿Qué tipos de medicamentos o drogas pueden afectar su capacidad para conducir?
  choices:
    A: Medicamentos para las alergias
    B: Marihuana
    C: Remedios para el resfriado
    D: Todas estas opciones
  answer: D
  explanation: Muchos tipos de drogas y medicamentos pueden afectar su capacidad para
    conducir. Esto incluye drogas ilegales y medicamentos legales recetados o de venta
    libre. Puede ser un delito penal conducir bajo los efectos de cualquier droga
    o medicamento.
- id: 231
  category: vehicle_information
  question: 'Su punto ciego es el área de la carretera:'
  choices:
    A: Que no puede ver sin mover la cabeza.
    B: Directamente detrás de su vehículo.
    C: Que ve en su espejo retrovisor.
    D: Que ve en su espejo lateral.
  answer: A
  explanation: Los puntos ciegos son áreas que un conductor no puede ver sin mover
    la cabeza. Pueden estar ubicados a los lados y detrás de un vehículo.
- id: 232
  category: safe_driving_rules
  question: 'Llega a una intersección que está bloqueada por otro tráfico. Usted debe:'
  choices:
    A: Avanzar lentamente hasta que el tráfico de adelante se mueva.
    B: Acercarse lo más posible al auto que está frente a usted.
    C: Mantenerse fuera de la intersección hasta que pueda cruzarla por completo.
    D: Tocar la bocina para hacer que los autos avancen.
  answer: C
  explanation: No puede ingresar a una intersección si el tráfico está congestionado
    en el otro lado y no puede cruzarla por completo. Espere hasta que el tráfico
    de adelante se despeje para no bloquear la intersección.
- id: 233
  category: signs_and_signals
  question: 'Una señal amarilla en forma de diamante que muestra el símbolo de un
    semáforo indica:'
  choices:
    A: Que continúe a su velocidad actual.
    B: Que debe detenerse más adelante.
    C: Que no se permite el exceso de velocidad.
    D: Que hay un semáforo más adelante.
  answer: D
  explanation: Una señal de advertencia amarilla con el símbolo de un semáforo alerta
    a los conductores de que hay un semáforo más adelante. Esté preparado para detenerse.
- id: 234
  category: defensive_driving
  question: 'Su primera respuesta ante la visibilidad reducida debe ser:'
  choices:
    A: Encender sus faros.
    B: Reducir su velocidad.
    C: Encender sus limpiaparabrisas.
    D: Buscar las marcas del borde de la carretera para guiarse.
  answer: B
  explanation: Reducir su velocidad debe ser su primera respuesta ante la disminución
    de la visibilidad y las condiciones peligrosas de la carretera.
- id: 235
  category: safe_driving_rules
  question: 'Dos líneas blancas continuas pintadas a través de un carril de tráfico
    muestran los límites de un cruce peatonal. Como conductor, usted debe saber que:'
  choices:
    A: Los vehículos de motor tienen el derecho de paso sobre los peatones en los
      cruces peatonales.
    B: Cuando los peatones están en los cruces peatonales, se les debe ceder el derecho
      de paso.
    C: Nadie tiene el derecho de paso en un cruce peatonal.
    D: Los peatones son responsables de mantenerse fuera del camino de todo el tráfico.
  answer: B
  explanation: Las líneas de cruce peatonal muestran a los peatones por dónde cruzar
    de manera segura una carretera o calle. Los cruces peatonales pueden estar marcados
    por líneas horizontales, líneas verticales o una combinación de ambas. Siempre
    debe detenerse ante los peatones que se encuentran en un cruce peatonal.
- id: 236
  category: safe_driving_rules
  question: 'Usted debe ceder el paso a otros conductores:'
  choices:
    A: Al ingresar a una calle desde un garaje o callejón.
    B: Cuando están en una calle a su izquierda y han llegado a una intersección sin
      señalizar al mismo tiempo.
    C: Cuando su semáforo es una flecha verde.
    D: Todas las anteriores.
  answer: A
  explanation: Debe ceder el paso a otros conductores al ingresar a una calle desde
    un callejón, entrada de vehículos o garaje. También debe ceder el paso a los peatones
    que se encuentren en una acera que se cruza.
- id: 237
  category: safe_driving_rules
  question: 'Usted debe ceder el paso a los vehículos de emergencia:'
  choices:
    A: Bajo ninguna circunstancia.
    B: Cuando vea una luz roja o azul intermitente o escuche una sirena.
    C: Solo cuando otros vehículos cedan el paso.
    D: Ninguna de las anteriores.
  answer: B
  explanation: Debe ceder el derecho de paso a cualquier vehículo de emergencia que
    esté usando su sirena o luces intermitentes.
- id: 238
  category: safe_driving_rules
  question: 'Un conductor que ingresa al tráfico público desde una entrada de vehículos
    o un camino privado:'
  choices:
    A: Tiene el derecho de paso.
    B: Debe ceder el paso a los conductores que ya están en la vía pública.
    C: Puede forzar su entrada al tráfico.
    D: Puede asumir que otros conductores cambiarán de carril para hacerle espacio.
  answer: B
  explanation: Si ingresa al tráfico desde una entrada de vehículos o un camino privado,
    debe ceder el paso a los conductores que ya están en la vía pública. Incorpórese
    de manera segura al tráfico cuando pueda hacerlo.
- id: 239
  category: safe_driving_rules
  question: ¿En cuál de los siguientes semáforos tiene usted el derecho de paso al
    girar a la izquierda?
  choices:
    A: Una luz verde fija
    B: Una luz amarilla intermitente
    C: Una flecha verde apuntando a la izquierda
    D: Una luz roja intermitente
  answer: C
  explanation: Una flecha verde fija significa que puede cruzar la intersección en
    la dirección que apunta la flecha. El tráfico en sentido contrario está obligado
    a detenerse ante el tráfico que gira.
- id: 240
  category: safe_driving_rules
  question: ¿Cuál no es un factor para determinar la distancia que se necesita para
    detener su vehículo?
  choices:
    A: La capacidad de dirección
    B: La distancia de frenado
    C: La distancia de reacción
    D: El tiempo de percepción
  answer: A
  explanation: La distancia requerida para detener su vehículo depende del tiempo
    de percepción, la distancia de reacción y la distancia de frenado. Esto cambia
    con la velocidad y las condiciones de la carretera.
- id: 241
  category: safe_driving_rules
  question: 'Una señal de restricción de velocidad:'
  choices:
    A: Puede ser ignorada en condiciones de lluvia, nieve o hielo.
    B: Tiene forma triangular.
    C: Es azul con letras negras.
    D: Muestra una velocidad recomendada para una curva o giro.
  answer: D
  explanation: Las señales de advertencia de curvas y giros a menudo tienen señales
    de velocidad recomendada adjuntas que muestran una velocidad de conducción recomendada
    para los conductores en las curvas y giros. Aunque un conductor pueda sentirse
    cómodo conduciendo a una velocidad mayor con buen clima, nunca debe hacerlo bajo
    condiciones de lluvia, nieve o hielo.
- id: 242
  category: safe_driving_rules
  question: 'La cantidad de espacio que necesita para cruzar el tráfico depende de:'
  choices:
    A: Las condiciones del camino, las condiciones del clima y el tráfico en sentido
      contrario.
    B: La presencia de una señal de alto (stop).
    C: El uso de sus luces direccionales.
    D: Los vehículos detrás de usted.
  answer: A
  explanation: La cantidad de espacio que necesita para cruzar el tráfico depende
    de las condiciones del camino, las condiciones del clima y el tráfico en sentido
    contrario.
- id: 243
  category: safe_driving_rules
  question: 'No rebase:'
  choices:
    A: En una colina o curva.
    B: Cuando las luces de un autobús escolar estén parpadeando.
    C: Al acercarse a una intersección.
    D: Todas las anteriores.
  answer: D
  explanation: Nunca debe rebasar si hay un vehículo en sentido contrario en el carril
    de rebase, si su vista está bloqueada por una curva o colina, en una intersección,
    antes o en un cruce de ferrocarril o puente, o en cualquier otra zona de no rebasar.
    A menos que se encuentre en el lado opuesto de una carretera de varios carriles
    con un camellón (mediana) o un carril central compartido para girar, no puede
    rebasar a un autobús escolar detenido que tenga sus luces rojas intermitentes
    activadas.
- id: 244
  category: safe_driving_rules
  question: 'Si un abanderado está dirigiendo el tráfico en una zona de construcción,
    usted debe:'
  choices:
    A: Seguir las instrucciones dadas por el abanderado.
    B: Copiar lo que hace el tráfico a su alrededor, a pesar de las instrucciones
      del abanderado.
    C: Asumir que se supone que el abanderado no debe dirigir el tráfico.
    D: Seguir las leyes que estarían vigentes si el área no estuviera en construcción.
  answer: A
  explanation: Esté preparado para reducir su velocidad y tener precaución cuando
    se lo indique una señal, un abanderado o un oficial de policía. No hacerlo es
    ilegal y peligroso para quienes trabajan en las zonas de construcción.
- id: 245
  category: sharing_the_road
  question: 'Cuando vea o escuche acercarse a un vehículo de emergencia, usted debe:'
  choices:
    A: Detenerse inmediatamente y dejar pasar al vehículo.
    B: Conducir lo más a la derecha posible del camino de manera segura y detenerse.
    C: Avanzar lentamente y permitir que el vehículo pase.
    D: Seguir moviéndose lentamente, manteniéndose en el lado derecho del camino.
  answer: B
  explanation: Al conducir en una vía de dos carriles o en una carretera sin división,
    debe ceder el paso a un vehículo de emergencia que use sus luces y/o sirena, independientemente
    de la dirección desde la que se acerque. Conduzca inmediatamente lo más cerca
    posible del lado derecho del camino y deténgase, teniendo cuidado de no detenerse
    dentro de una intersección.
- id: 246
  category: safe_driving_rules
  question: 'Usted se acerca a una intersección y tiene luz verde. Hay peatones cruzando
    con luz roja. Usted debe:'
  choices:
    A: Tocar la bocina (claxon).
    B: Acelerar y pasar por delante de los peatones.
    C: Detenerse para dejar que los peatones crucen de manera segura.
    D: Conducir cerca de los peatones y asustarlos para que lo piensen dos veces antes
      de cruzar con luz roja.
  answer: C
  explanation: Ceda el paso a los peatones y vehículos que puedan quedar atrapados
    en una intersección cuando usted tenga luz verde. Tenga cuidado con los peatones
    en cualquier circunstancia.
- id: 247
  category: safe_driving_rules
  question: 'Para entrar a una autopista:'
  choices:
    A: Poner la luz direccional, ceder el paso al tráfico existente y entrar a la
      misma velocidad a la que se mueve el tráfico.
    B: Poner la luz direccional y entrar a la autopista. El tráfico de la autopista
      debe ceder el paso.
    C: Conducir lentamente para poder revisar el tráfico.
    D: Siempre detenerse por completo primero.
  answer: A
  explanation: Al incorporarse al tráfico, debe poner la luz direccional y entrar
    a la misma velocidad a la que se mueve el tráfico. Siempre ceda el paso a otros
    vehículos al entrar a una vía.
- id: 248
  category: defensive_driving
  question: 'Conducir de noche requiere mayor precaución porque:'
  choices:
    A: El tráfico se mueve más rápido de noche.
    B: Hay un mayor volumen de tráfico de noche.
    C: Los conductores no pueden ver tan bien de noche.
    D: Los accidentes ocurren con mayor frecuencia de noche.
  answer: C
  explanation: Debido a la oscuridad, los conductores no pueden ver tan bien de noche
    como de día. Desde media hora después del atardecer hasta media hora antes del
    amanecer, o en cualquier otro momento en que las personas o los vehículos no sean
    visibles a 500 pies de distancia, los conductores deben usar sus faros delanteros.
- id: 249
  category: penalties_and_points
  question: 'No cumplir con las restricciones impuestas en una Licencia de Conducir
    Graduada (GDL):'
  choices:
    A: No es gran cosa.
    B: Solo resultará en puntos en contra de la licencia de conducir.
    C: No resultará en consecuencias negativas.
    D: Puede resultar en una multa y la suspensión de la licencia.
  answer: D
  explanation: Un conductor primerizo con una Licencia de Conducir Graduada (GDL)
    debe cumplir con estrictas restricciones de conducción. No seguir estas restricciones
    puede resultar en una multa de $100 y la suspensión de la GDL.
- id: 250
  category: safe_driving_rules
  question: Cuando dos vehículos entran a una intersección desde diferentes carreteras
    al mismo tiempo, ¿qué vehículo debe ceder el derecho de paso?
  choices:
    A: Cualquiera de los dos
    B: El vehículo de la izquierda
    C: El vehículo de la derecha
    D: Ninguno
  answer: B
  explanation: En las intersecciones controladas por señales o semáforos y en las
    intersecciones no controladas, el conductor de la izquierda debe ceder el derecho
    de paso al conductor de la derecha cuando dos vehículos llegan a la intersección
    al mismo tiempo.
- id: 251
  category: safe_driving_rules
  question: 'Los semáforos a veces muestran flechas para controlar los giros desde
    carriles específicos. Una flecha verde:'
  choices:
    A: Se usa solo en calles de un solo sentido.
    B: Tiene el mismo significado que una luz verde circular, pero el tráfico debe
      girar en la dirección indicada por la flecha.
    C: Significa que puede avanzar, pero solo si la flecha verde está acompañada por
      una luz verde circular.
    D: Señala el camino hacia un aeropuerto.
  answer: B
  explanation: Una flecha verde tiene el mismo significado que un semáforo verde circular,
    pero el tráfico en el carril indicado debe girar en la dirección que muestra la
    flecha.
- id: 252
  category: safe_driving_rules
  question: Los carriles de tráfico que se mueven en direcciones opuestas están divididos
    por líneas ____.
  choices:
    A: Blancas
    B: Rojas
    C: Negras
    D: Amarillas
  answer: D
  explanation: Las líneas amarillas se usan para dividir el tráfico que se mueve en
    direcciones opuestas.
- id: 253
  category: defensive_driving
  question: ¿Cómo puede reducir el riesgo de hidroplaneo?
  choices:
    A: No conduciendo a exceso de velocidad cuando las carreteras están mojadas.
    B: Usando llantas con la presión de aire adecuada.
    C: Reemplazando las llantas con la banda de rodadura desgastada.
    D: Todas las anteriores.
  answer: D
  explanation: El hidroplaneo ocurre cuando un vehículo se desliza sobre una fina
    capa de agua entre sus llantas y la carretera. Las llantas con baja presión de
    aire o con la banda de rodadura desgastada pueden aumentar el riesgo de hidroplaneo.
    Conducir a exceso de velocidad también aumenta el riesgo.
- id: 254
  category: signs_and_signals
  question: 'Para reducir los efectos del resplandor de los faros por la noche, usted
    debe mirar:'
  choices:
    A: Directamente hacia adelante.
    B: Por encima de su hombro.
    C: Al centro de la carretera.
    D: Al borde derecho de la carretera.
  answer: D
  explanation: Si los conductores que se acercan no bajan las luces de sus faros,
    mantenga la vista en el lado derecho de la carretera más adelante. No mire directamente
    a los faros que se acercan porque el resplandor puede cegarlo por varios segundos.
- id: 255
  category: safe_driving_rules
  question: 'Debe detenerse en una intersección cuando vea una:'
  choices:
    A: Luz roja intermitente.
    B: Luz amarilla fija.
    C: Flecha amarilla.
    D: Luz amarilla intermitente.
  answer: A
  explanation: Un semáforo con luz roja intermitente tiene el mismo significado que
    una señal de alto (STOP). En una intersección con una luz roja intermitente, debe
    detenerse por completo, mirar en ambas direcciones y avanzar solo después de que
    la intersección esté despejada.
- id: 256
  category: alcohol_drugs_health
  question: 'El efecto que tiene el alcohol en sus reflejos y juicio:'
  choices:
    A: Es menos pronunciado cuando se consume cerveza en lugar de vino.
    B: Es menos pronunciado cuando se consume vino en lugar de cerveza.
    C: Es más pronunciado cuando se consumen sidras fuertes y bebidas mixtas.
    D: Depende de la cantidad de alcohol en su torrente sanguíneo.
  answer: D
  explanation: Consumir cualquier tipo de alcohol puede tener efectos negativos en
    sus reflejos y juicio. No importa qué tipo de alcohol se consuma, solo la cantidad
    de alcohol que ha ingresado al torrente sanguíneo de la persona.
- id: 257
  category: vehicle_information
  question: Para registrar un vehículo en Nueva Jersey, debe tener ____ años de edad
    o más.
  choices:
    A: '17'
    B: '25'
    C: '18'
    D: '21'
  answer: A
  explanation: Para registrar un vehículo motorizado en Nueva Jersey, debe tener al
    menos 17 años de edad. Debe tener prueba de identidad y prueba de propiedad del
    vehículo.
- id: 258
  category: vehicle_information
  question: 'Se le revienta una llanta mientras conduce. Usted debe:'
  choices:
    A: Frenar bruscamente.
    B: Sujetar el volante con firmeza y disminuir la velocidad hasta detenerse.
    C: Seguir conduciendo normalmente.
    D: Encender las luces intermitentes de emergencia y seguir conduciendo.
  answer: B
  explanation: Si experimenta el reventón de una llanta, no aplique los frenos de
    inmediato. Sujete el volante con firmeza y maniobre para mantenerse en su carril
    de tráfico. Reduzca su velocidad gradualmente soltando el acelerador y sin pisar
    los frenos. Una vez que se mueva muy lentamente, aplique los frenos suavemente
    y sálgase de la carretera hacia un área segura.
- id: 259
  category: defensive_driving
  question: 'Aumente su distancia de seguimiento cuando:'
  choices:
    A: Conduzca detrás de un vehículo grande que bloquee su visión.
    B: Salga de una autopista.
    C: Siga a una motocicleta.
    D: Todas las anteriores.
  answer: D
  explanation: Debe aumentar su distancia de seguimiento cuando esté detrás de un
    vehículo grande que bloquee su visión, cuando conduzca con mal tiempo o tráfico
    pesado, cuando salga de una autopista, cuando esté detrás de una motocicleta o
    bicicleta, y si alguien lo sigue demasiado cerca (tailgating).
- id: 260
  category: safe_driving_rules
  question: 'El brazo y la mano izquierda del conductor están extendidos hacia abajo.
    Esta señal manual significa que el conductor planea:'
  choices:
    A: Girar a la izquierda.
    B: Girar a la derecha.
    C: Detenerse.
    D: Arrancar.
  answer: C
  explanation: Si el brazo y la mano izquierda de un conductor están extendidos hacia
    abajo, están indicando que tienen la intención de detenerse. Ajuste su conducción
    en consecuencia si sigue a un conductor que está usando esta señal manual.
- id: 261
  category: signs_and_signals
  question: 'No debe cruzar una sola línea discontinua blanca o amarilla:'
  choices:
    A: Cuando al hacerlo interfiera con el tráfico.
    B: Al girar a la izquierda para entrar a un camino de entrada.
    C: Cuando el vehículo delante de usted está averiado.
    D: Al rebasar por la derecha en una calle de un solo sentido.
  answer: A
  explanation: Puede cruzar una sola línea discontinua para rebasar o cambiar de carril
    siempre y cuando pueda hacerlo de manera segura y sin interferir con el tráfico.
- id: 262
  category: safe_driving_rules
  question: 'Para asegurarse de que su condición física no le haga conducir de manera
    insegura, usted debe:'
  choices:
    A: Mantenerse en buena forma física y hacerse exámenes físicos regulares.
    B: Conocer el efecto de cualquier medicamento en su capacidad para conducir.
    C: Conducir dentro de sus limitaciones físicas.
    D: Todas las anteriores.
  answer: D
  explanation: Su condición física tiene una gran influencia en su capacidad para
    conducir de manera segura. Los conductores deben ser conscientes de sus limitaciones
    físicas y solo conducir si es seguro hacerlo.
- id: 263
  category: signs_and_signals
  question: 'Las señales de color naranja son:'
  choices:
    A: Señales de zonas de trabajo.
    B: Señales reglamentarias.
    C: Señales de zonas escolares.
    D: Señales de guía.
  answer: A
  explanation: Las zonas de trabajo en las carreteras se establecen de acuerdo con
    el tipo de trabajo que se realiza en la vía. Las señales en las áreas de trabajo
    suelen tener forma de diamante, ser de color naranja, tener letras o símbolos
    negros y sirven como advertencia de que hay personas trabajando en la carretera
    o cerca de ella.
- id: 264
  category: vehicle_information
  question: 'Al viajar en un vehículo, los niños pequeños:'
  choices:
    A: Pueden ser sostenidos de manera segura por un adulto fuerte.
    B: Estarán seguros si están de pie en el piso de la parte trasera del vehículo.
    C: No resultarán heridos en un accidente porque son pequeños.
    D: Nunca se les debe permitir viajar de pie en el vehículo.
  answer: D
  explanation: Existen asientos infantiles especiales para los niños que son demasiado
    pequeños para usar cinturones de seguridad normales. Ninguna persona es lo suficientemente
    fuerte como para sostener de manera segura a un niño de cualquier tamaño durante
    un accidente o una parada repentina. Nunca permita que un niño viaje en un vehículo
    a menos que esté correctamente abrochado en un asiento.
- id: 265
  category: vehicle_information
  question: 'Dejar un espacio de seguridad (colchón de espacio) entre su vehículo
    y su entorno es importante porque:'
  choices:
    A: Evita distracciones de otros vehículos.
    B: Le da tiempo para reaccionar ante situaciones inesperadas.
    C: Mantiene el flujo del tráfico a un ritmo seguro.
    D: Mantiene alerta a otros conductores.
  answer: B
  explanation: La única manera de estar seguro de que tendrá suficiente tiempo para
    reaccionar ante los errores cometidos por otros conductores es dejar suficiente
    espacio entre usted y los vehículos a su alrededor.
- id: 266
  category: safe_driving_rules
  question: 'Debe hacerse a un lado en el borde de la carretera y permitir que pase
    un vehículo de emergencia:'
  choices:
    A: Sin importar su dirección.
    B: Solo si lo está siguiendo.
    C: Solo si se acerca a usted desde la dirección opuesta.
    D: Ninguna de las anteriores.
  answer: A
  explanation: Debe hacerse a un lado en el borde derecho de la carretera y detenerse
    ante un vehículo de emergencia con luces intermitentes, independientemente de
    si se acerca por detrás o desde la dirección opuesta.
- id: 267
  category: alcohol_drugs_health
  question: 'Para evitar la intoxicación por monóxido de carbono, los conductores
    deben:'
  choices:
    A: Revisar su sistema de escape regularmente para asegurarse de que no tenga fugas.
    B: Mantener el motor apagado cuando el automóvil esté en un garaje cerrado.
    C: Cerrar las rejillas de ventilación cuando sigan de cerca a otro automóvil.
    D: Todas las anteriores.
  answer: D
  explanation: Los gases de monóxido de carbono son inodoros y mortales. Los síntomas
    de la intoxicación por monóxido de carbono son cansancio repentino, bostezos,
    mareos y náuseas. La única cura es un suministro adecuado de aire fresco.
- id: 268
  category: safe_driving_rules
  question: 'El brazo y la mano izquierda del conductor están extendidos hacia arriba.
    Esta señal manual significa que el conductor planea:'
  choices:
    A: Girar a la izquierda.
    B: Girar a la derecha.
    C: Detenerse.
    D: Seguir derecho.
  answer: B
  explanation: Si el brazo y la mano izquierda de un conductor están extendidos hacia
    arriba, está indicando que tiene la intención de girar a la derecha. Ajuste su
    conducción en consecuencia si sigue a un conductor que está usando esta señal
    manual.
- id: 269
  category: safe_driving_rules
  question: 'Al cambiar de carril, usted no debe:'
  choices:
    A: Revisar sus espejos laterales y retrovisor.
    B: Poner la luz direccional para señalar sus intenciones.
    C: Verificar si hay otros conductores que puedan estar moviéndose al mismo carril
      que usted.
    D: Usar su teléfono celular para contactar a la policía y determinar si el camino
      por delante está despejado.
  answer: D
  explanation: Antes de cambiar de carril, revise sus espejos laterales y retrovisor
    para ver si hay tráfico acercándose por detrás. Use su luz direccional para que
    otros conductores sepan que planea cambiar de carril. Verifique si hay otros conductores
    que también puedan estar moviéndose al mismo carril.
- id: 270
  category: sharing_the_road
  question: 'Un emblema de vehículo de movimiento lento es:'
  choices:
    A: Un letrero rojo rectangular.
    B: Un letrero verde circular.
    C: Un letrero amarillo en forma de diamante.
    D: Un letrero naranja triangular.
  answer: D
  explanation: El símbolo de vehículo de movimiento lento es un triángulo naranja
    reflectante. Espere que los vehículos que usan este emblema conduzcan a velocidades
    de 25 mph o menos.
- id: 271
  category: vehicle_information
  question: Si un vehículo que usa luces altas se acerca hacia usted, debe mirar hacia
    ____ de la carretera.
  choices:
    A: Cualquier lado
    B: El centro
    C: El lado derecho
    D: El lado izquierdo
  answer: C
  explanation: Si un vehículo que se aproxima usa sus luces altas y no las baja, debe
    mirar hacia el lado derecho de la carretera. Esto evitará que los faros del otro
    vehículo lo cieguen y le permitirá ver lo suficientemente bien como para mantener
    su rumbo hasta que el vehículo pase.
- id: 272
  category: safe_driving_rules
  question: 'La forma correcta de usar una rampa de salida de la autopista es:'
  choices:
    A: Reducir la velocidad antes de entrar a la rampa de salida.
    B: Reducir la velocidad una vez que ingrese a la rampa de salida.
    C: Mantener su velocidad constante una vez en la rampa de salida.
    D: Rebasar al tráfico más lento en la rampa de salida.
  answer: B
  explanation: Al usar una rampa de salida de la autopista, no reduzca la velocidad
    hasta que haya ingresado a la rampa de salida.
- id: 273
  category: vehicle_information
  question: 'La nieve y el hielo en un vehículo deben retirarse de:'
  choices:
    A: Las ventanas del vehículo.
    B: El capó del vehículo.
    C: El techo del vehículo.
    D: Todas las anteriores.
  answer: D
  explanation: La ley estatal exige que los automovilistas retiren toda la nieve y
    el hielo de su vehículo antes de conducirlo. Se pueden aplicar multas a los conductores
    que no cumplan con esta ley.
- id: 274
  category: safe_driving_rules
  question: 'Puede continuar con cuidado a través de una intersección con luz amarilla
    si:'
  choices:
    A: Hay un vehículo de emergencia cruzando su carril.
    B: Hay peatones cruzando.
    C: Va a girar a la derecha.
    D: Ya se encuentra dentro de la intersección cuando la luz cambia a amarillo.
  answer: D
  explanation: Si aparece una luz amarilla fija cuando ya se encuentra dentro de una
    intersección, debe continuar a través de la intersección con cuidado.
- id: 275
  category: safe_driving_rules
  question: 'Se está acercando a una intersección cuando el semáforo cambia de verde
    a amarillo fijo. Usted debe:'
  choices:
    A: Considerarlo igual que una señal de precaución y continuar a través de la intersección.
    B: Detenerse inmediatamente.
    C: Detenerse antes de entrar a la intersección, a menos que esté demasiado cerca
      para detenerse de manera segura.
    D: Acelerar para pasar la intersección antes de que aparezca la luz roja.
  answer: C
  explanation: Al acercarse a una intersección con un semáforo en amarillo fijo, reduzca
    la velocidad hasta detenerse antes de entrar a la intersección, si es seguro hacerlo.
    Si no puede detenerse de manera segura, conduzca con cuidado a través de la intersección.
- id: 276
  category: signs_and_signals
  question: 'Puede cruzar líneas amarillas continuas:'
  choices:
    A: Para rebasar al tráfico que se mueve en la misma dirección.
    B: Solo durante las horas del día.
    C: En cualquier momento.
    D: Al hacer giros.
  answer: D
  explanation: Como regla general, las líneas de tráfico discontinuas se pueden cruzar,
    pero las líneas continuas no. Las líneas amarillas continuas solo se pueden cruzar
    cuando el conductor está haciendo un giro.
- id: 277
  category: defensive_driving
  question: 'Al conducir bajo la lluvia, usted debe:'
  choices:
    A: Usar las luces bajas.
    B: Usar las luces altas.
    C: Usar las luces de estacionamiento.
    D: No usar luces.
  answer: A
  explanation: En condiciones de lluvia, debe usar las luces bajas.
- id: 278
  category: vehicle_information
  question: ¿Quién está obligado a usar el cinturón de seguridad en un vehículo motorizado
    en movimiento?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros adultos
    C: Solo los pasajeros niños
    D: Todos los ocupantes del vehículo motorizado
  answer: D
  explanation: Según la ley estatal, el conductor y todos los pasajeros de un vehículo
    de pasajeros deben usar el cinturón de seguridad. El hecho de que un conductor,
    un pasajero del asiento delantero o un niño menor de 18 años no use el cinturón
    de seguridad es una infracción primaria. El conductor es responsable de todos
    los pasajeros menores de 18 años. Según una ley secundaria, todos los ocupantes
    del asiento trasero de 18 años o más que no lleven abrochado el cinturón pueden
    recibir una citación si el vehículo ha sido detenido por un motivo diferente.
- id: 279
  category: alcohol_drugs_health
  question: 'Si conduce tan despacio que el tráfico se está acumulando detrás de usted,
    debe:'
  choices:
    A: Reducir su velocidad.
    B: Salirse al lado derecho de la carretera y dejar pasar el tráfico.
    C: No dejar que los otros autos rebasen a su vehículo.
    D: Usar sus luces intermitentes de emergencia (cuatro vías).
  answer: B
  explanation: Conducir más despacio que el flujo del tráfico puede ser peligroso.
    Si se encuentra en una carretera de dos carriles y doble sentido y conduce tan
    despacio que el tráfico se acumula detrás de usted, está obligado a salirse de
    la carretera y dejar pasar a los demás vehículos. Solo conduzca significativamente
    por debajo del límite de velocidad cuando las condiciones lo requieran.
- id: 280
  category: alcohol_drugs_health
  question: 'Una fuga en el sistema de escape puede:'
  choices:
    A: Causar un uso excesivo de aceite.
    B: Requerir que su vehículo tenga una afinación antes de lo normal.
    C: Causarle somnolencia mientras conduce.
    D: Provocar incendios de pasto en caminos rurales.
  answer: C
  explanation: El sistema de escape ayuda a eliminar los gases tóxicos, reducir el
    ruido y enfriar los gases calientes que provienen de un motor en marcha. Los gases
    de un sistema de escape con fugas pueden causar la muerte en muy poco tiempo.
    También pueden causarle somnolencia mientras conduce.
- id: 281
  category: safe_driving_rules
  question: Un camión con remolque podría tardar hasta un ____ por ciento más en detenerse
    en malas condiciones climáticas que en condiciones ideales de manejo.
  choices:
    A: '10'
    B: '25'
    C: '40'
    D: '55'
  answer: B
  explanation: Al conducir cerca de un camión con remolque, tenga en cuenta cómo su
    tamaño afectará la forma en que se conduce. En malas condiciones climáticas, el
    vehículo más grande puede tardar hasta un 25 por ciento más en detenerse por completo
    de lo que tardaría si se condujera en condiciones ideales.
- id: 282
  category: safe_driving_rules
  question: 'Al conducir cerca de camiones pesados, los demás conductores y usuarios
    de la vía deben tener en cuenta:'
  choices:
    A: La mayor distancia de frenado que requieren los vehículos grandes.
    B: La menor distancia de frenado que requieren los vehículos grandes.
    C: El menor ruido de los vehículos más grandes.
    D: La mayor velocidad de los vehículos más grandes.
  answer: A
  explanation: Al conducir cerca de camiones pesados, los demás conductores y usuarios
    de la vía deben tener en cuenta la mayor distancia de frenado que requieren los
    vehículos grandes. Los conductores de vehículos más pequeños deben permanecer
    en lugares donde puedan ser vistos por el conductor del vehículo grande y donde
    su vista del tráfico no esté bloqueada por el vehículo.
- id: 283
  category: safe_driving_rules
  question: 'Las distancias de frenado de un vehículo nunca dependen de:'
  choices:
    A: Su propio tiempo de reacción.
    B: La hora del día.
    C: El estado de los frenos de su vehículo.
    D: El estado y tipo de las llantas de su vehículo.
  answer: B
  explanation: La distancia que necesita un vehículo para detenerse depende del tiempo
    de reacción del conductor, las condiciones del clima y de visibilidad, el peso
    del vehículo, el estado de los frenos del vehículo, el estado y tipo de las llantas
    del vehículo, las condiciones de la carretera y la velocidad.
- id: 284
  category: sharing_the_road
  question: 'Un ciclista que no obedece las leyes de tránsito:'
  choices:
    A: Tiene la razón porque los ciclistas no tienen que obedecer las leyes de tránsito.
    B: Puede recibir una multa.
    C: Siempre recibirá una advertencia de las autoridades.
    D: Se le confiscará su bicicleta.
  answer: B
  explanation: Todos los ciclistas tienen los mismos derechos, deberes y responsabilidades
    que los conductores de vehículos motorizados. Los automovilistas y ciclistas que
    no obedecen las leyes de tránsito pueden recibir una multa.
- id: 285
  category: safe_driving_rules
  question: ¿De qué color son las marcas en el pavimento que separan los carriles
    de tráfico que se mueven en direcciones opuestas?
  choices:
    A: Amarillo
    B: Blanco
    C: Amarillo y blanco
    D: Amarillo, blanco y negro
  answer: A
  explanation: Las líneas amarillas se utilizan en el centro de la carretera para
    separar los carriles de tráfico que se mueven en direcciones opuestas.
- id: 286
  category: signs_and_signals
  question: 'Las señales triangulares que apuntan hacia abajo:'
  choices:
    A: Indican zonas escolares.
    B: Indican a los conductores que deben ceder el paso.
    C: Indican zonas de construcción.
    D: Indican cruces de ferrocarril.
  answer: B
  explanation: Las señales triangulares que apuntan hacia abajo generalmente indican
    que los conductores deben ceder el paso. Una vez que la vía esté libre de tráfico
    o peatones y sea seguro hacerlo, los conductores pueden avanzar.
- id: 287
  category: vehicle_information
  question: 'Para evitar choques con vehículos en sus puntos ciegos, usted debe:'
  choices:
    A: Girar rápidamente la cabeza para ver si su punto ciego está despejado antes
      de cambiar de carril.
    B: Ajustar sus espejos retrovisores cada pocos minutos.
    C: Tocar la bocina justo antes de girar o cambiar de carril.
    D: Ninguna de las anteriores.
  answer: A
  explanation: Antes de girar o cambiar de carril, gire la cabeza y mire por encima
    del hombro en la dirección de su movimiento para ver si su punto ciego está despejado.
    Nunca confíe únicamente en sus espejos.
- id: 288
  category: safe_driving_rules
  question: 'Cuando se encuentra en una fila de tráfico que está cruzando una vía
    de ferrocarril que no tiene señales ni barreras:'
  choices:
    A: Usted tiene el derecho de paso y no necesita verificar si vienen trenes.
    B: Puede rebasar a los conductores más lentos mientras cruza la vía.
    C: Debe asegurarse de que haya espacio para que su vehículo cruce completamente
      las vías sin detenerse.
    D: Todas las anteriores.
  answer: C
  explanation: Si sigue a otro vehículo en un cruce de ferrocarril, verifique que
    tenga suficiente espacio para cruzar completamente antes de avanzar sobre las
    vías. Nunca debe intentar rebasar a otro vehículo al acercarse o cruzar un cruce
    de ferrocarril. Siempre verifique si vienen trenes antes de cruzar cualquier vía
    de ferrocarril.
- id: 289
  category: signs_and_signals
  question: 'Cuando vea una señal roja octagonal (de ocho lados), usted debe:'
  choices:
    A: Detenerse por completo y verificar si hay peatones y tráfico transversal.
    B: Reducir la velocidad sin detenerse por completo.
    C: Detenerse por completo y esperar la luz verde.
    D: Reducir la velocidad y verificar el tráfico.
  answer: A
  explanation: Cualquier señal de ocho lados (octagonal) es una señal de alto (STOP).
    En una intersección con una señal de alto, debe detenerse por completo y verificar
    si hay peatones y tráfico transversal en la intersección. Espere a que la intersección
    se despeje antes de avanzar.
- id: 290
  category: safe_driving_rules
  question: 'Para girar a la izquierda desde calles y carreteras de un solo sentido
    y de múltiples carriles, debe comenzar desde:'
  choices:
    A: El medio de la intersección.
    B: El carril derecho.
    C: El carril izquierdo.
    D: Cualquier carril.
  answer: C
  explanation: Para girar a la izquierda desde calles y carreteras de múltiples carriles,
    comience desde el carril izquierdo.
- id: 291
  category: safe_driving_rules
  question: 'Una zona de obras:'
  choices:
    A: Puede estar en movimiento o ser estacionaria.
    B: Está marcada con señales blancas y negras.
    C: No requiere que el conductor reduzca la velocidad y preste más atención.
    D: Todas las anteriores.
  answer: A
  explanation: Las zonas de obras suelen ser estacionarias, pero también pueden presentarse
    en forma de vehículos en movimiento pintando líneas, cortando el césped o quitando
    nieve. Las zonas de obras están marcadas con señales naranjas con letras o símbolos
    negros. Reduzca la velocidad y preste más atención al acercarse o conducir a través
    de una zona de obras.
- id: 292
  category: safe_driving_rules
  question: 'Al acercarse a un semáforo que muestra una flecha amarilla intermitente,
    los conductores:'
  choices:
    A: Deben incorporarse a un carril en la dirección de la flecha.
    B: Deben detenerse por completo.
    C: Pueden girar a la izquierda después de ceder el paso al tráfico en sentido
      contrario y a los peatones.
    D: Tienen el derecho de paso y pueden esperar que el tráfico en sentido contrario
      se detenga por ellos.
  answer: C
  explanation: Una flecha amarilla intermitente indica que se permiten los giros a
    la izquierda en la dirección de la flecha. Sin embargo, el tráfico en sentido
    contrario tiene luz verde y usted debe ceder el paso al tráfico en sentido contrario
    y a los peatones.
- id: 293
  category: safe_driving_rules
  question: 'Si dos vehículos llegan a una intersección no controlada al mismo tiempo:'
  choices:
    A: El vehículo más grande tiene el derecho de paso.
    B: El vehículo de la izquierda tiene el derecho de paso.
    C: El vehículo de la izquierda debe ceder el paso al vehículo de la derecha.
    D: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda.
  answer: C
  explanation: Si dos vehículos llegan al mismo tiempo a una intersección no controlada,
    el conductor de la izquierda debe ceder el paso al conductor de la derecha. El
    conductor de la izquierda puede entonces avanzar cuando sea seguro hacerlo.
- id: 294
  category: signs_and_signals
  question: Las señales de guía son señales ____ que proporcionan información de dirección
    y millaje a los conductores.
  choices:
    A: Amarillas
    B: Rojas
    C: Verdes
    D: Blancas
  answer: C
  explanation: Las señales de guía, a veces conocidas como señales de destino, tienen
    un fondo verde y proporcionan información de dirección y millaje hacia destinos
    específicos. Pueden ser un recurso útil al conducir en lugares desconocidos.
- id: 295
  category: safe_driving_rules
  question: ¿Es legal cruzar una línea central amarilla doble y continua para rebasar?
  choices:
    A: Sí.
    B: No.
    C: Si no hay tráfico en sentido contrario.
    D: Si el vehículo delante de usted conduce por debajo del límite de velocidad.
  answer: B
  explanation: Dos líneas amarillas continuas en el centro de una vía de doble sentido
    significan que ningún carril de tráfico puede cruzar las líneas, a menos que estén
    saliendo de la vía. Un conductor puede cruzar líneas amarillas dobles al entrar
    o salir de un camino de entrada o la entrada a un negocio. No se permite rebasar
    sobre una línea amarilla continua.
- id: 296
  category: safe_driving_rules
  question: 'Mientras conduce, se le requiere detener su vehículo:'
  choices:
    A: En una intersección con una señal de alto (STOP).
    B: Donde hay un semáforo en rojo.
    C: Cuando un oficial de tránsito le ordene detenerse.
    D: Todas las anteriores.
  answer: D
  explanation: Las situaciones en las que los conductores deben detenerse incluyen
    acercarse a intersecciones con señales de alto (STOP), acercarse a intersecciones
    donde una luz roja está parpadeando o iluminada, o en cualquier momento en que
    un oficial de tránsito ordene que su vehículo se detenga.
- id: 297
  category: penalties_and_points
  question: 'La Comisión de Vehículos Motorizados (MVC) puede cancelar su examen práctico
    de manejo antes de que comience si:'
  choices:
    A: Trajo un vehículo de prueba inseguro.
    B: Una consola central u otro equipo en su vehículo obstruye el acceso al pedal
      del freno.
    C: A su vehículo le faltan los cinturones de seguridad.
    D: Todas las anteriores.
  answer: D
  explanation: Un examen práctico de manejo puede ser denegado antes de que comience
    si el examinador considera que su vehículo de prueba es inseguro o inadecuado.
    El vehículo puede considerarse inseguro si le faltan los cinturones de seguridad
    y si el examinador no puede acceder al freno de pie o al freno de estacionamiento.
- id: 298
  category: defensive_driving
  question: 'Si alguien conduce de manera agresiva detrás de usted, usted debe:'
  choices:
    A: Intentar apartarse del camino del conductor agresivo.
    B: Mirar fijamente al conductor mientras lo rebasa.
    C: Acelerar mientras lo rebasa.
    D: Bloquear el carril de rebase.
  answer: A
  explanation: Si se encuentra con un conductor agresivo, debe hacer todo lo posible
    para apartarse de su camino. Debe evitar hacer contacto visual con un conductor
    hostil. Desafiar a un conductor hostil acelerando solo puede enojarlo más, aumentando
    así el peligro.
