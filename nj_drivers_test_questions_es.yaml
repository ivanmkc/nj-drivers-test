- id: 114
  category: penalties_and_points
  question: ¿Con cuántos puntos acumulados se enfrenta un conductor a un recargo?
  choices:
    A: 4 o más
    B: 6 o más
    C: 8 o más
    D: 12 o más
  answer: B
  explanation: Los conductores que acumulan seis o más puntos en un período de tres
