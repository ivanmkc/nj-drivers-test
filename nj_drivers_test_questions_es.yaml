- id: 111
  category: penalties_and_points
  question: ¿Cuántos puntos se imponen por rebasar indebidamente a un autobús escolar?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: 'Rebasar indebidamente a un autobús escolar: 5 puntos. (N.J.S.A. 39:4-128.1)'
- id: 112
  category: penalties_and_points
  question: ¿Cuántos puntos se imponen por abandonar el lugar de un choque con lesiones
