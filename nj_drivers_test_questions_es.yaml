  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: A un conductor que complete un Programa de Mejoramiento del Conductor
    se le eliminarán tres puntos.
- id: 121
  category: penalties_and_points
  question: ¿Con qué frecuencia puede la MVC reconocer un curso de manejo defensivo
