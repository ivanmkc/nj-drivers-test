- id: 107
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por exceso de velocidad de 15 a 29 mph por
    encima del límite?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: 'Exceder la velocidad máxima de 15 a 29 mph por encima del límite:
    4 puntos.'
- id: 108
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por exceso de velocidad de 30 mph o más por
