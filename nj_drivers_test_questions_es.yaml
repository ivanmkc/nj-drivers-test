  answer: D
  explanation: 'Conducción temeraria: 5 puntos. (N.J.S.A. 39:4-96)'
- id: 110
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por seguir muy de cerca a otro vehículo (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
