  choices:
    A: 500 pies
    B: Media milla
    C: Una milla o más
    D: Dos millas
  answer: C
  explanation: Un tren de carga que viaja a 55 mph puede tardar una milla o más en
    detenerse.
- id: 137
  category: sharing_the_road
  question: ¿A qué distancia de un cruce de ferrocarril no debe rebasar a otros vehículos?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: No rebase a otros vehículos a menos de 100 pies de un cruce de ferrocarril.
- id: 138
