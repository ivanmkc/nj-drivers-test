  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Se debe enviar un informe por escrito a la MVC dentro de 10 días si
    no se presenta un informe policial.
- id: 124
  category: penalties_and_points
  question: 'Los accidentes deben ser reportados a la policía cuando los daños exceden:'
