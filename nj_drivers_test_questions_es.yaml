  choices:
    A: 2 puntos
    B: 4 puntos
    C: 5 puntos
    D: 8 puntos
  answer: D
  explanation: 'Abandonar el lugar de un choque con lesiones personales: 8 puntos.
    Sin lesiones: 2 puntos. (N.J.S.A. 39:4-129)'
- id: 113
  category: penalties_and_points
  question: ¿Cuántos puntos se restan cada año que un conductor pasa sin cometer una
    infracción?
  choices:
    A: 1 punto
    B: 2 puntos
    C: Hasta 3 puntos
