    segura.
- id: 128
  category: sharing_the_road
  question: ¿A qué vehículos se les debe ceder siempre el derecho de paso cuando se
    reincorporan al flujo del tráfico?
  choices:
    A: Solo a las patrullas de policía
    B: Autobuses y vehículos postales
    C: Taxis y vehículos de viaje compartido
    D: Solo a los camiones
  answer: B
  explanation: Los conductores deben ceder el paso a los autobuses y vehículos postales
    cuando se reincorporan al flujo del tráfico.
- id: 129
  category: sharing_the_road
  question: ¿Cuál es la causa más común de accidentes de motocicleta?
  choices:
    A: Exceso de velocidad por parte de los motociclistas
    B: Malas condiciones de la carretera
    C: La falla de un conductor de automóvil en detectar y reconocer motocicletas
      en el tráfico
    D: Falla mecánica
  answer: C
  explanation: La falla de un conductor de automóvil en detectar y reconocer motocicletas
    en el tráfico es la causa más común de accidentes de motocicleta.
- id: 130
  category: sharing_the_road
  question: En condiciones de mal tiempo, ¿cuánto tiempo más pueden tardar los camiones
