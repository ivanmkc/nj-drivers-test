  choices:
    A: 1 punto
    B: 2 puntos
    C: Lo mismo que el equivalente de la infracción en NJ
    D: Ninguno
  answer: B
  explanation: Se agregarán dos puntos al historial de manejo por infracciones de
    tránsito cometidas en otros estados.
- id: 126
  category: sharing_the_road
  question: ¿Cuánto espacio mínimo exige la Ley de Paso Seguro (Safe Passing Law)
