    carril?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: En una carretera de un solo carril, los conductores deben dejar al
    menos una zona de seguridad de 4 pies al rebasar a usuarios vulnerables de la
    vía. (N.J.S.A. 39:4-92.4)
- id: 127
  category: sharing_the_road
  question: Si no es posible dejar 4 pies de espacio al rebasar, ¿qué debe hacer un
    conductor?
  choices:
    A: Tocar la bocina y rebasar rápidamente
    B: Reducir la velocidad a 25 mph y estar preparado para detenerse hasta que sea
      seguro rebasar
    C: Detenerse por completo hasta que el ciclista se mueva
    D: Conducir por el arcén (hombro)
  answer: B
  explanation: Si no es posible dejar 4 pies, los conductores deben reducir la velocidad
