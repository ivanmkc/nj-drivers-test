  explanation: 'Chocar y darse a la fuga con lesiones corporales: multa de $2,500
    a $5,000, hasta 180 días de cárcel y pérdida de la licencia por 1 año para la
    primera infracción. Infracción posterior: pérdida permanente de la licencia.'
- id: 119
  category: penalties_and_points
  question: ¿Cuántos puntos se eliminan al completar un Curso de Manejo Defensivo?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Se eliminarán dos puntos de los puntos acumulados al completar un curso
    de manejo defensivo. (N.J.S.A. 39:5-30.9)
- id: 120
  category: penalties_and_points
  question: ¿Cuántos puntos se eliminan al completar el Programa de Mejoramiento del
