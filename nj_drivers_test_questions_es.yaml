  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: C
  explanation: La zona prohibida trasera (punto ciego) detrás de un camión puede extenderse
    hasta 200 pies.
- id: 132
  category: sharing_the_road
  question: 'Un conductor debe detenerse al acercarse a una persona que usa un bastón
