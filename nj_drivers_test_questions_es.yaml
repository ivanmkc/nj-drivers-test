metadata:
  source: Manual del Conductor de Nueva Jersey 2025 (www.njmvc.gov)
  source_original: 2025 New Jersey Driver Manual (www.njmvc.gov)
  total_questions: 298
  passing_score: 80% (40 de 50 en el examen real del MVC)
  language: es
  categories:
  - license_system
  - driver_testing
  - driver_responsibility
  - safe_driving_rules
  - defensive_driving
  - alcohol_drugs_health
  - penalties_and_points
  - sharing_the_road
  - vehicle_information
  - signs_and_signals
questions:
- id: 1
  category: license_system
  question: ¿Qué debe llevar consigo un conductor de Nueva Jersey mientras opera un
    vehículo motorizado?
  choices:
    A: Solo una licencia de conducir válida
    B: Una licencia de conducir válida, seguro válido y tarjetas de registro del vehículo
    C: Solo una licencia de conducir válida y el registro del vehículo
    D: Una licencia de conducir válida y comprobante de domicilio
  answer: B
  explanation: Un conductor debe llevar una licencia de conducir válida (o permiso),
    seguro válido y las tarjetas de registro del vehículo. (N.J.S.A. 39:3-29)
- id: 2
  category: license_system
  question: ¿En cuánto tiempo debe un conductor reportar un cambio de domicilio a
    la MVC?
  choices:
    A: Dentro de 30 días
    B: Dentro de dos semanas
    C: Dentro de una semana
    D: Dentro de 60 días
  answer: C
  explanation: Un conductor que cambia de domicilio debe reportar el cambio a la MVC
    dentro de una semana después de mudarse. (N.J.S.A. 39:3-36)
- id: 3
  category: license_system
  question: ¿En cuánto tiempo debe un conductor reportar un cambio legal de nombre
    a la MVC?
  choices:
    A: Dentro de una semana
    B: Dentro de dos semanas
    C: Dentro de 30 días
    D: Dentro de 60 días
  answer: B
  explanation: Un conductor que cambia legalmente su nombre debe reportar el cambio
    a la MVC dentro de dos semanas. (N.J.S.A. 39:3-9a)
- id: 4
  category: license_system
  question: 'Un conductor con una licencia válida de otro estado que se muda a NJ
    debe solicitar una licencia de NJ dentro de:'
  choices:
    A: 30 días
    B: 90 días
    C: 60 días o antes de que expire la licencia actual, lo que ocurra primero
    D: Un año
  answer: C
  explanation: Los conductores de otros estados deben presentar su solicitud dentro
    de 60 días o antes de que expire su licencia actual, lo que ocurra primero. Los
    titulares de una licencia de conducir comercial (CDL) tienen 30 días. (N.J.S.A.
    39:3-17.1)
- id: 5
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir de Nueva Jersey?
  choices:
    A: Dos años
    B: Cuatro años
    C: Cinco años
    D: Seis años
  answer: B
  explanation: Las licencias de conducir de NJ son válidas por cuatro años.
- id: 6
  category: license_system
  question: ¿Cuál es la edad mínima para obtener un Permiso Especial de Aprendiz (Special
    Learner Permit) en Nueva Jersey?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: Se puede obtener un Permiso Especial de Aprendiz a los 16 años bajo
    la Opción A del programa de Licencia Graduada (GDL).
- id: 7
  category: license_system
  question: Bajo el programa GDL, ¿cuántas horas de práctica de manejo se requieren
    antes de un examen práctico (road test)?
  choices:
    A: 25 horas, incluyendo 5 de noche
    B: 30 horas, incluyendo 10 de noche
    C: 50 horas, incluyendo 10 durante la oscuridad
    D: 40 horas, incluyendo 15 de noche
  answer: C
  explanation: Los titulares de un permiso GDL deben completar un mínimo de 50 horas
    de práctica de manejo, incluyendo 10 horas durante la oscuridad.
- id: 8
  category: license_system
  question: ¿Cuáles son las restricciones de horario de manejo para los titulares
    de un permiso GDL y una licencia probatoria (probationary license) menores de
    21 años?
  choices:
    A: No manejar entre las 10:00 pm y las 6:00 am
    B: No manejar entre las 11:01 pm y las 5:00 am
    C: No manejar entre la medianoche y las 5:00 am
    D: No manejar entre las 9:00 pm y las 6:00 am
  answer: B
  explanation: Los titulares de un permiso GDL y una licencia probatoria menores de
    21 años no pueden manejar entre las 11:01 pm y las 5:00 am.
- id: 9
  category: license_system
  question: ¿Qué se requiere de los conductores del programa GDL menores de 21 años
    con respecto a los teléfonos celulares?
  choices:
    A: Solo pueden usar dispositivos de manos libres
    B: No pueden usar teléfonos celulares de mano ni de manos libres, ni ningún otro
      dispositivo electrónico
    C: Pueden usar teléfonos celulares solo para emergencias
    D: Solo pueden enviar mensajes de texto en los semáforos en rojo
  answer: B
  explanation: Los titulares de GDL no pueden usar teléfonos celulares de mano ni
    de manos libres, ni ningún otro dispositivo electrónico mientras conducen.
- id: 10
  category: license_system
  question: ¿Cuántas calcomanías (decals) del programa GDL se deben mostrar y dónde?
  choices:
    A: Una calcomanía en la placa de matrícula trasera
    B: Dos calcomanías, una a cada lado del vehículo
    C: Dos calcomanías, una en la parte superior izquierda de la placa delantera y
      otra en la parte superior izquierda de la placa trasera
    D: Dos calcomanías en la ventana trasera
  answer: C
  explanation: 'Se deben mostrar dos calcomanías reflectantes rojas visibles: una
    en la esquina superior izquierda de la placa delantera y otra en la esquina superior
    izquierda de la placa trasera.'
- id: 11
  category: license_system
  question: ¿Cuál es la edad mínima para supervisar a un titular de un permiso GDL
    como pasajero?
  choices:
    A: 18 años con una licencia válida de NJ
    B: 21 años con una licencia válida de NJ y un mínimo de 3 años de experiencia
      de manejo
    C: 25 años con una licencia válida de NJ
    D: Cualquier conductor con licencia de NJ
  answer: B
  explanation: El conductor supervisor debe tener al menos 21 años, poseer una licencia
    válida de NJ y tener un mínimo de tres años de experiencia de manejo.
- id: 12
  category: license_system
  question: ¿Cuánto dura el período de la licencia probatoria antes de poder obtener
    una licencia básica?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 18 meses
  answer: B
  explanation: Los titulares de una licencia probatoria deben practicar la conducción
    sin supervisión durante al menos un año antes de obtener una licencia básica.
- id: 13
  category: license_system
  question: ¿Cuántos puntos de verificación de identidad se requieren para una licencia
    de conducir de Nueva Jersey?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Todos los solicitantes deben proporcionar 6 puntos de verificación
    de identidad.
- id: 14
  category: license_system
  question: 'Un conductor con una licencia válida de otro país puede conducir en NJ
    por un máximo de:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Un conductor con una licencia válida de otro país puede conducir con
    esa licencia por un máximo de un año. (N.J.A.C. 13:21-8.2(f))
- id: 15
  category: license_system
  question: ¿Cuál es la sanción por alterar una licencia de conducir o presentar una
    licencia alterada?
  choices:
    A: Una advertencia
    B: Una multa de $100
    C: Pérdida del privilegio de conducir, multa de hasta $1,000 y/o encarcelamiento
    D: Solo servicio comunitario
  answer: C
  explanation: Alterar una licencia de conducir o presentar una alterada puede resultar
    en la pérdida del privilegio de conducir, una multa de hasta $1,000 y/o encarcelamiento.
- id: 16
  category: license_system
  question: Para la Opción C del GDL (Ruta para adultos), ¿cuál es la edad mínima
    y el período de práctica supervisada?
  choices:
    A: 18 años, 6 meses de conducción supervisada
    B: 21 años, 3 meses de conducción supervisada
    C: 21 años, 6 meses de conducción supervisada
    D: 25 años, 1 mes de conducción supervisada
  answer: B
  explanation: La Opción C del GDL requiere una edad mínima de 21 años y al menos
    3 meses de práctica de conducción supervisada.
- id: 17
  category: driver_testing
  question: ¿Qué puntaje se necesita para aprobar el examen de conocimientos de la
    MVC de NJ?
  choices:
    A: 70% (35 de 50)
    B: 75% (37 de 50)
    C: 80% (40 de 50)
    D: 90% (45 de 50)
  answer: C
  explanation: El 80 por ciento, o 40 de las 50 preguntas, deben responderse correctamente.
- id: 18
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para un solicitante de licencia
    básica?
  choices:
    A: Visión 20/20
    B: Visión 20/40
    C: Visión 20/50 con o sin lentes correctivos
    D: Visión 20/70
  answer: C
  explanation: Los solicitantes de licencia básica necesitan una visión de 20/50 con
    o sin lentes correctivos.
- id: 19
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para un solicitante de CDL?
  choices:
    A: 20/50 en ambos ojos
    B: 20/40 en ambos ojos con o sin lentes correctivos
    C: 20/20 en ambos ojos
    D: 20/30 en un ojo
  answer: B
  explanation: Los solicitantes de CDL necesitan una visión de 20/40 con o sin lentes
    correctivos en ambos ojos, además de la capacidad de distinguir las luces rojas,
    verdes y ámbar.
- id: 20
  category: driver_testing
  question: ¿Cuántas preguntas hay en el examen de conocimientos de la MVC de NJ?
  choices:
    A: '25'
    B: '40'
    C: 50 más una pregunta de encuesta sobre la donación de órganos
    D: '100'
  answer: C
  explanation: El examen de conocimientos consta de 50 preguntas más una pregunta
    de encuesta sobre la donación de órganos.
- id: 21
  category: driver_responsibility
  question: Según la ley de cinturones de seguridad de Nueva Jersey (NJ), ¿quién es
    responsable de que los pasajeros menores de 18 años usen el cinturón de seguridad?
  choices:
    A: Los propios pasajeros
    B: El conductor
    C: El padre o la madre, incluso si no está en el vehículo
    D: Nadie; es opcional para los menores
  answer: B
  explanation: El conductor es responsable de que todos los pasajeros menores de 18
    años usen el cinturón de seguridad.
- id: 22
  category: driver_responsibility
  question: ¿En qué porcentaje mejoran los cinturones de seguridad las posibilidades
    de que un conductor sobreviva a un choque?
  choices:
    A: 30 por ciento
    B: 45 por ciento
    C: 60 por ciento
    D: 80 por ciento
  answer: C
  explanation: Los cinturones de seguridad pueden mejorar las posibilidades de que
    un conductor sobreviva a un choque en un 60 por ciento.
- id: 23
  category: driver_responsibility
  question: ¿Los niños menores de qué edad deben viajar en el asiento trasero?
  choices:
    A: '5'
    B: '6'
    C: '8'
    D: '10'
  answer: C
  explanation: Todos los niños menores de 8 años deben ir sentados en un asiento trasero.
- id: 24
  category: driver_responsibility
  question: 'Los niños menores de 2 años o que pesen menos de 30 libras deben viajar
    en:'
  choices:
    A: Un asiento de seguridad orientado hacia adelante
    B: Un asiento elevado (booster seat)
    C: Un sistema de retención infantil orientado hacia atrás con un arnés de cinco
      puntos
    D: Un cinturón de seguridad normal
  answer: C
  explanation: Los niños menores de 2 años y aquellos que pesen menos de 30 libras
    deben viajar en un sistema de retención infantil orientado hacia atrás, aprobado
    a nivel federal, con un arnés de cinco puntos.
- id: 25
  category: driver_responsibility
  question: ¿Cuál es la posición correcta de las manos en el volante?
  choices:
    A: A las 10 y a las 2 en punto
    B: A las 9 y a las 3 en punto
    C: A las 8 y a las 4 en punto
    D: A las 12 en punto con una mano
  answer: B
  explanation: Un conductor debe agarrar el volante en las posiciones de las 9 y las
    3 en punto, manteniendo los pulgares a lo largo de la cara del volante.
- id: 26
  category: driver_responsibility
  question: ¿En qué distancia debería poder detenerse un conductor a 20 mph?
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 50 pies
  answer: B
  explanation: Un conductor debería poder detenerse en una distancia de 25 pies a
    20 mph.
- id: 27
  category: driver_responsibility
  question: ¿Con cuánta anticipación se debe activar la luz direccional antes de hacer
    un giro?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: Un conductor debe encender la luz direccional al menos 100 pies antes
    de girar. (N.J.S.A. 39:4-126)
- id: 28
  category: driver_responsibility
  question: ¿Cuál es la señal manual correcta para girar a la derecha?
  choices:
    A: Mano y brazo extendidos hacia afuera
    B: Mano y brazo hacia arriba
    C: Mano y brazo hacia abajo
    D: Movimiento de saludo
  answer: B
  explanation: 'Giro a la derecha: mano y brazo hacia arriba. Giro a la izquierda:
    mano y brazo extendidos hacia afuera. Detenerse: mano y brazo hacia abajo.'
- id: 29
  category: driver_responsibility
  question: Al estacionar cuesta arriba en una calle con acera, ¿hacia dónde deben
    girarse las ruedas?
  choices:
    A: Hacia la acera
    B: Lejos de la acera
    C: Recto hacia adelante
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba, las ruedas deben girarse lejos de la acera.
- id: 30
  category: driver_responsibility
  question: Al estacionar cuesta abajo en una calle con acera, ¿hacia dónde deben
    girarse las ruedas?
  choices:
    A: Hacia la acera
    B: Lejos de la acera
    C: Recto hacia adelante
    D: No importa
  answer: A
  explanation: Al estacionar cuesta abajo, las ruedas deben girarse hacia la acera.
- id: 31
  category: driver_responsibility
  question: ¿Cuál es la distancia máxima permitida entre los neumáticos del vehículo
    y el bordillo (acera) al estacionar en paralelo?
  choices:
    A: 12 pulgadas
    B: 6 pulgadas
    C: 18 pulgadas
    D: 3 pulgadas
  answer: B
  explanation: Los neumáticos de un vehículo no deben estar a más de seis pulgadas
    del bordillo (acera) al estacionar en paralelo.
- id: 32
  category: driver_responsibility
  question: 'La ley de Nueva Jersey limita el tiempo de ralentí (motor en marcha sin
    movimiento) del vehículo a:'
  choices:
    A: 1 minuto
    B: 3 minutos
    C: 5 minutos
    D: 10 minutos
  answer: B
  explanation: La ley de Nueva Jersey exige a todos los conductores restringir el
    tiempo de ralentí del vehículo a tres minutos o menos. (N.J.A.C. 7:27-15.8)
- id: 33
  category: driver_responsibility
  question: ¿Cuál es la multa por no quitar la nieve o el hielo de un vehículo antes
    de conducir?
  choices:
    A: $10 a $25
    B: $25 a $75
    C: $100 a $500
    D: $500 a $1,000
  answer: B
  explanation: Se aplican multas de $25 a $75 independientemente de si la nieve o
    el hielo se desprenden. Si la nieve o el hielo desprendidos causan lesiones o
    daños a la propiedad, se pueden imponer multas de hasta $1,500.
- id: 34
  category: driver_responsibility
  question: ¿A qué velocidad golpear el tablero o el parabrisas se compara con caer
    desde un edificio de tres pisos?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: Golpear el tablero o el parabrisas a 30 mph es como caer desde lo alto
    de un edificio de tres pisos.
- id: 35
  category: driver_responsibility
  question: 'Las bolsas de aire (airbags) se inflan a velocidades de hasta:'
  choices:
    A: 50 mph
    B: 100 mph
    C: 150 mph
    D: 200 mph
  answer: D
  explanation: Las bolsas de aire se inflan a velocidades de hasta 200 mph.
- id: 36
  category: driver_responsibility
  question: ¿A qué distancia mínima debe sentarse un conductor del volante?
  choices:
    A: 6 pulgadas
    B: 10 pulgadas desde el centro del volante hasta el centro del esternón
    C: 12 pulgadas
    D: 18 pulgadas
  answer: B
  explanation: Las personas deben mantener al menos 10 pulgadas de distancia entre
    el centro del volante y el centro del esternón.
- id: 37
  category: driver_responsibility
  question: ¿A qué velocidad debe ir un vehículo al conducir en reversa (marcha atrás)?
  choices:
    A: 5 a 10 mph
    B: Velocidad de paso de peatón (2 a 4 mph)
    C: 10 a 15 mph
    D: Menos de 20 mph
  answer: B
  explanation: Un vehículo debe conducirse lentamente en reversa, por lo general a
    la velocidad de paso de un peatón (2 a 4 mph).
- id: 38
  category: driver_responsibility
  question: ¿Qué distancia debe poder conducir en reversa un automovilista durante
    el examen práctico de manejo?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: Se le pedirá al automovilista que retroceda el vehículo unos 100 pies
    en línea recta durante el examen práctico de manejo.
- id: 39
  category: driver_responsibility
  question: 'La profundidad mínima de la banda de rodadura para que los neumáticos
    sean seguros es:'
  choices:
    A: 1/8 de pulgada
    B: 1/16 de pulgada
    C: 1/4 de pulgada
    D: 1/32 de pulgada
  answer: B
  explanation: Un vehículo no debe conducirse con neumáticos que tengan menos de 1/16
    de pulgada de banda de rodadura (aproximadamente el borde de un centavo).
- id: 40
  category: driver_responsibility
  question: 'En condiciones normales, la bocina (claxon) debe poder escucharse a una
    distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: En condiciones normales, la bocina debe poder escucharse a una distancia
    de al menos 200 pies. (N.J.S.A. 39:3-69)
- id: 41
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en zonas escolares, comerciales o residenciales?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: 25 mph en zonas escolares, comerciales o residenciales.
- id: 42
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en distritos comerciales y residenciales
    suburbanos?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: C
  explanation: 35 mph en distritos comerciales y residenciales suburbanos.
- id: 43
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en caminos rurales sin señalización?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: C
  explanation: 50 mph en caminos rurales sin señalización.
- id: 44
  category: safe_driving_rules
  question: ¿Qué sucede con las multas por exceder el límite de 65 mph por 10 mph
    o más?
  choices:
    A: Se triplican
    B: Se duplican
    C: Se agregan $100 adicionales
    D: Nada en especial
  answer: B
  explanation: Los conductores pagan multas dobles por exceder el límite de 65 mph
    por 10 mph o más. (N.J.S.A. 39:4-98.6)
- id: 45
  category: safe_driving_rules
  question: ¿Cuándo está permitido rebasar por la derecha?
  choices:
    A: Nunca
    B: Solo en carreteras con más de un carril en la misma dirección, o cuando un
      vehículo adelante está girando a la izquierda y hay espacio
    C: En cualquier momento en una autopista
    D: Solo en el arcén (hombro)
  answer: B
  explanation: Rebasar por la derecha está permitido solo en carreteras con más de
    un carril en la misma dirección, o cuando el vehículo de adelante está girando
    a la izquierda y hay espacio. Nunca rebase por el arcén (hombro) derecho.
- id: 46
  category: safe_driving_rules
  question: ¿Qué significa una línea central doble y continua?
  choices:
    A: Se permite rebasar con precaución
    B: Se permite rebasar por ambos lados
    C: No se permite rebasar en ninguna dirección
    D: Solo los camiones pueden rebasar
  answer: C
  explanation: 'Ambas líneas centrales son continuas: No se permite rebasar.'
- id: 47
  category: safe_driving_rules
  question: En una intersección de alto múltiple (multi-way stop), ¿quién tiene el
    derecho de paso cuando dos conductores llegan al mismo tiempo?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que va derecho
    D: El conductor que gira a la derecha
  answer: B
  explanation: En una intersección de alto múltiple, un conductor debe ceder el paso
    al conductor de la derecha si ambos llegan al mismo tiempo.
- id: 48
  category: safe_driving_rules
  question: 'Cuando un semáforo no funciona debido a un corte de energía, debe tratarse
    como:'
  choices:
    A: Una señal de ceda el paso (yield)
    B: Una señal de precaución
    C: Una parada de 4 vías (4-way stop)
    D: Si la luz estuviera verde
  answer: C
  explanation: Cuando un semáforo no está iluminado debido a un corte de energía,
    se respeta como una señal de parada de 4 vías. (N.J.S.A. 39:4-81)
- id: 49
  category: safe_driving_rules
  question: ¿Es legal girar a la derecha con luz roja en Nueva Jersey?
  choices:
    A: No, nunca
    B: Sí, después de hacer una parada completa y verificar el tráfico, a menos que
      haya un letrero de "No Turn on Red" (No girar en rojo)
    C: Sí, sin detenerse si la vía está despejada
    D: Solo en autopistas
  answer: B
  explanation: La ley de NJ autoriza girar a la derecha con luz roja después de hacer
    una parada completa y verificar el tráfico, a menos que haya un letrero de "No
    Turn on Red" (No girar en rojo). (N.J.S.A. 39:4-115)
- id: 50
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor al acercarse a un autobús escolar con luces
    rojas intermitentes?
  choices:
    A: Reducir la velocidad a 25 mph y avanzar con precaución
    B: Detenerse al menos a 25 pies de distancia
    C: Detenerse al menos a 15 pies de distancia
    D: Reducir la velocidad a 10 mph y avanzar
  answer: B
  explanation: La ley estatal requiere que un conductor se detenga al menos a 25 pies
    de distancia de un autobús escolar con luces rojas intermitentes. (N.J.S.A. 39:4-128.1)
- id: 51
  category: safe_driving_rules
  question: 'Cuando un autobús escolar se detiene directamente frente a una escuela,
    un conductor puede rebasarlo a no más de:'
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 25 mph
  answer: B
  explanation: Si un autobús escolar se ha detenido directamente frente a una escuela,
    un conductor puede rebasarlo desde cualquier dirección a una velocidad de no más
    de 10 mph.
- id: 52
  category: safe_driving_rules
  question: ¿A qué distancia debe detenerse un conductor de las vías del tren cuando
    las señales de advertencia están activas?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: B
  explanation: Un conductor debe detenerse a por lo menos 15 pies de un cruce de ferrocarril
    cuando hay luces rojas intermitentes, campanas sonando o barreras bajando o bajadas.
    (N.J.S.A. 39:4-127.1)
- id: 53
  category: safe_driving_rules
  question: ¿A qué distancia detrás de un vehículo de emergencia debe mantenerse un
    conductor?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Un conductor debe mantenerse a por lo menos 300 pies detrás de un vehículo
    de emergencia que tenga sus señales encendidas. (N.J.S.A. 39:4-92)
- id: 54
  category: safe_driving_rules
  question: ¿Cuándo se deben usar los faros delanteros?
  choices:
    A: Solo después del atardecer
    B: Entre media hora después del atardecer y media hora antes del amanecer, cuando
      la visibilidad es de 500 pies o menos, o cuando se usan los limpiaparabrisas
    C: Solo cuando está completamente oscuro
    D: Solo en la lluvia
  answer: B
  explanation: Los faros delanteros deben usarse entre media hora después del atardecer
    y media hora antes del amanecer, cuando la visibilidad es de 500 pies o menos,
    y cuando se usan los limpiaparabrisas. (N.J.S.A. 39:3-46)
- id: 55
  category: safe_driving_rules
  question: ¿A qué distancia de una boca de incendios (hidrante) está prohibido estacionar?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 25 pies
  answer: B
  explanation: Está prohibido estacionar a menos de 10 pies de una boca de incendios
    (hidrante). (N.J.S.A. 39:4-138)
- id: 56
  category: safe_driving_rules
  question: ¿A qué distancia de un cruce peatonal en una intersección está prohibido
    estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: C
  explanation: Está prohibido estacionar a menos de 25 pies de un cruce peatonal en
    una intersección. (N.J.S.A. 39:4-138)
- id: 57
  category: safe_driving_rules
  question: ¿A qué distancia de una señal de alto (stop) está prohibido estacionar?
  choices:
    A: 25 pies
    B: 35 pies
    C: 50 pies
    D: 75 pies
  answer: C
  explanation: Está prohibido estacionar a menos de 50 pies de una señal de alto (stop).
    (N.J.S.A. 39:4-138)
- id: 58
  category: safe_driving_rules
  question: ¿A qué distancia de un cruce de ferrocarril está prohibido estacionar?
  choices:
    A: 25 pies
    B: 35 pies
    C: 50 pies
    D: 75 pies
  answer: C
  explanation: Está prohibido estacionar a menos de 50 pies de un cruce de ferrocarril.
    (N.J.S.A. 39:4-138)
- id: 59
  category: safe_driving_rules
  question: ¿A qué distancia de la entrada de una estación de bomberos está prohibido
    estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: C
  explanation: Está prohibido estacionar a menos de 20 pies de la entrada de cualquier
    estación de bomberos, y a menos de 75 pies en la calle opuesta a la entrada de
    una estación de bomberos.
- id: 60
  category: safe_driving_rules
  question: ¿A más de cuántas pulgadas del borde de la acera (bordillo) es ilegal
    estacionar un vehículo?
  choices:
    A: 3 pulgadas
    B: 6 pulgadas
    C: 12 pulgadas
    D: 18 pulgadas
  answer: B
  explanation: Es ilegal que un vehículo esté estacionado a más de seis pulgadas del
    borde de la acera (bordillo). (N.J.S.A. 39:4-135)
- id: 61
  category: safe_driving_rules
  question: ¿Cuál es la multa por la primera infracción de usar un teléfono celular
    de mano mientras se conduce?
  choices:
    A: $100-$200
    B: $200-$400
    C: $400-$600
    D: $600-$800
  answer: B
  explanation: 'La multa por la primera infracción es de $200-$400. Segunda infracción:
    $400-$600. Tercera infracción: $600-$800. (N.J.S.A. 39:4-97.3)'
- id: 62
  category: safe_driving_rules
  question: ¿Qué exige la ley de "Hacerse a un lado" (Move Over law)?
  choices:
    A: Hacerse a un lado para todos los vehículos
    B: Cambiar de carril para alejarse de vehículos de emergencia estacionados, grúas
      o vehículos averiados, o reducir la velocidad si es imposible cambiar de carril
    C: Moverse al carril derecho en todo momento
    D: Ceder el paso al tráfico que se incorpora
  answer: B
  explanation: 'La ley de "Hacerse a un lado" exige a los conductores cambiar de carril
    para alejarse de los vehículos de emergencia estacionados, o reducir la velocidad
    si es imposible cambiar de carril. Multa: $100-$500. (N.J.S.A. 39:4-92.2)'
- id: 63
  category: safe_driving_rules
  question: ¿A qué distancia de un vehículo del departamento de bomberos en servicio
    debe evitar estacionarse?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Un conductor nunca debe estacionarse a menos de 200 pies de un vehículo
    del departamento de bomberos en servicio.
- id: 64
  category: safe_driving_rules
  question: 'Al acercarse a un camión de postres helados (helados) con luces rojas
    intermitentes, un conductor debe:'
  choices:
    A: Reducir la velocidad a 25 mph
    B: Detenerse y luego pasar a no más de 15 mph
    C: Detenerse y luego pasar a no más de 10 mph
    D: Solo ceder el paso a los peatones
  answer: B
  explanation: Un conductor debe detenerse, ceder el paso a las personas que cruzan,
    estar atento a los niños y pasar a no más de 15 mph. (N.J.S.A. 39:4-128.4)
- id: 65
  category: safe_driving_rules
  question: ¿Cuál es la sanción por no detenerse ante un peatón en un cruce peatonal?
  choices:
    A: Multa de hasta $200 y 2 puntos
    B: Multa de hasta $500, hasta 25 días de cárcel, servicio comunitario, suspensión
      de la licencia por hasta 6 meses y 2 puntos
    C: Multa de $100 solamente
    D: Solo una advertencia
  answer: B
  explanation: No detenerse conlleva una multa de hasta $500, hasta 25 días de cárcel,
    servicio comunitario, suspensión de la licencia por hasta 6 meses y 2 puntos.
    (N.J.S.A. 39:4-36)
- id: 66
  category: safe_driving_rules
  question: 'Conducir por propiedad privada para evitar una señal de tráfico o un
    semáforo es:'
  choices:
    A: Legal si se hace de manera segura
    B: Una infracción de vehículos motorizados
    C: Solo ilegal en áreas residenciales
    D: Permitido en emergencias
  answer: B
  explanation: Conducir por propiedad privada para evitar una señal de tráfico o un
    semáforo es una infracción de vehículos motorizados. (N.J.S.A. 39:4-66.2)
- id: 67
  category: safe_driving_rules
  question: ¿En qué ventanas del vehículo prohíbe la ley de NJ agregar polarizado
    (tinting)?
  choices:
    A: Solo en la ventana trasera
    B: En todas las ventanas
    C: En el parabrisas y las ventanas laterales delanteras
    D: Solo en la ventana del lado del conductor
  answer: C
  explanation: La ley de NJ prohíbe agregar polarizado en el parabrisas y las ventanas
    laterales delanteras. (N.J.S.A. 39:3-74)
- id: 68
  category: safe_driving_rules
  question: 'Cuando un autobús escolar está en el otro lado de una carretera dividida
    con una isla de seguridad, un conductor debe:'
  choices:
    A: Detenerse por completo
    B: Reducir la velocidad a 10 mph
    C: Continuar al límite de velocidad
    D: Reducir la velocidad a 25 mph
  answer: B
  explanation: Al transitar por una carretera dividida, un conductor debe reducir
    la velocidad a 10 mph si se encuentra en el otro lado de una isla de seguridad
    o un separador central elevado.
- id: 69
  category: safe_driving_rules
  question: ¿A qué distancia debe detenerse un conductor al acercarse a una intersección?
  choices:
    A: A menos de 10 pies del cruce peatonal más cercano
    B: A menos de 5 pies del cruce peatonal o línea de alto más cercana
    C: Al menos a 15 pies de la intersección
    D: En la línea de alto o 25 pies antes de la intersección
  answer: B
  explanation: Un conductor debe detener el vehículo por completo a menos de cinco
    pies del cruce peatonal o línea de alto más cercana.
- id: 70
  category: defensive_driving
  question: ¿Qué es la regla de los tres segundos o más (three-second-plus rule)?
  choices:
    A: Mirar tres segundos hacia adelante antes de cambiar de carril
    B: Esperar tres segundos después de que un semáforo cambie a verde antes de avanzar
    C: Mantener al menos tres segundos de distancia de seguimiento detrás del vehículo
      de adelante
    D: Poner la luz direccional tres segundos antes de girar
  answer: C
  explanation: Elija un objeto fijo más adelante. Si pasan al menos tres segundos
    antes de que su vehículo pase el mismo objeto después del vehículo de enfrente,
    tiene suficiente distancia para una parada repentina.
- id: 71
  category: defensive_driving
  question: 'En condiciones de mal tiempo, la regla de los tres segundos de distancia
    de seguimiento debe aumentarse a:'
  choices:
    A: Tres segundos
    B: Cuatro o más segundos
    C: Dos segundos
    D: Seis segundos exactamente
  answer: B
  explanation: Durante el mal tiempo, el intervalo de tiempo debe aumentarse a cuatro
    o más segundos.
- id: 72
  category: defensive_driving
  question: 'La regla general para la distancia de seguimiento es:'
  choices:
    A: La longitud de dos automóviles por cada 10 mph
    B: La longitud de un automóvil (aproximadamente 20 pies) por cada 10 mph de velocidad
    C: La longitud de un automóvil por cada 20 mph
    D: La longitud de tres automóviles a todas las velocidades
  answer: B
  explanation: La regla general que se usa con más frecuencia es mantener la distancia
    de la longitud de un automóvil (aproximadamente 20 pies) por cada 10 millas por
    hora de velocidad.
- id: 73
  category: defensive_driving
  question: ¿Cuál es la distancia total de frenado a 60 mph en condiciones normales
    de día?
  choices:
    A: 247 pies
    B: 302 pies
    C: 343 pies
    D: 409 pies
  answer: C
  explanation: 'A 60 mph: distancia de reacción (66 pies) + distancia de frenado (277
    pies) = 343 pies de distancia total de frenado.'
- id: 74
  category: defensive_driving
  question: ¿Cuántos pies por segundo recorre un vehículo a 60 mph?
  choices:
    A: 44 pies
    B: 66 pies
    C: 88 pies
    D: 110 pies
  answer: C
  explanation: Un vehículo recorre 88 pies por segundo a 60 mph.
- id: 75
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Las superficies mojadas de la carretera pueden hacer que las llantas
    hidroplaneen a partir de aproximadamente 35 mph. Después de las 55 mph, las llantas
    pueden perder totalmente el contacto con la superficie de la carretera.
- id: 76
  category: defensive_driving
  question: 'Al patinar (derrapar), un conductor debe:'
  choices:
    A: Pisar los frenos bruscamente
    B: Girar el volante en dirección opuesta al patinazo
    C: Girar en la dirección en la que patina la parte trasera del vehículo, sin girar
      demasiado el volante
    D: Acelerar
  answer: C
  explanation: Para evitar un trompo, el conductor debe girar en la dirección en la
    que patina la parte trasera del vehículo, sin girar demasiado el volante. Mire
    en la dirección a la que desea ir.
- id: 77
  category: defensive_driving
  question: ¿Qué causa la hipnosis de carretera?
  choices:
    A: Conducir demasiado rápido
    B: Mirar fijamente una sola cosa durante más de unos pocos segundos en viajes
      largos
    C: Conducir con las ventanas cerradas
    D: La música alta
  answer: B
  explanation: La hipnosis de carretera se puede evitar no mirando fijamente una sola
    cosa durante más de unos pocos segundos. Descanse cada dos horas.
- id: 78
  category: defensive_driving
  question: ¿Qué es la Ley de Maggie (Maggie's Law)?
  choices:
    A: Una ley sobre teléfonos celulares
    B: Una ley que tipifica conducir fatigado como imprudencia bajo el estatuto de
      homicidio vehicular
    C: Una ley sobre el cinturón de seguridad
    D: Una ley de límite de velocidad
  answer: B
  explanation: La Ley de Maggie hace ilegal conducir a sabiendas mientras se está
    afectado por la falta de sueño y establece que conducir fatigado es una imprudencia
    bajo el estatuto de homicidio vehicular. (N.J.S.A. 2C:11-5)
- id: 79
  category: defensive_driving
  question: Si las ruedas de un vehículo se desvían hacia el arcén (hombro de la carretera),
    ¿qué debe hacer el conductor?
  choices:
    A: Volver al pavimento inmediatamente
    B: Mantenerse en el arcén, soltar el acelerador, reducir la velocidad a 25 mph
      o menos, y luego girar el volante un cuarto de vuelta hacia la carretera
    C: Pisar los frenos bruscamente
    D: Acelerar para volver a la carretera
  answer: B
  explanation: Manténgase en el arcén y suelte el acelerador. Después de reducir la
    velocidad a 25 mph o menos, gire el volante un cuarto de vuelta hacia la carretera.
- id: 80
  category: defensive_driving
  question: 'En condiciones de niebla, los faros deben estar en:'
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Apagados
  answer: B
  explanation: En caso de niebla, los faros deben mantenerse en luces bajas y las
    luces antiniebla deben encenderse si el vehículo cuenta con ellas.
- id: 81
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento recomendada en carreteras cubiertas
    de nieve?
  choices:
    A: Tres segundos
    B: Cuatro segundos
    C: Seis segundos o más
    D: Ocho segundos
  answer: C
  explanation: Una buena regla en carreteras cubiertas de nieve es mantener una distancia
    de seguimiento de seis segundos o más.
- id: 82
  category: defensive_driving
  question: 'Si el pedal del acelerador se atasca, el conductor debe:'
  choices:
    A: Apagar el motor inmediatamente
    B: Bombear el pedal del acelerador
    C: Mantener los ojos en la carretera, cambiar rápidamente a neutral, conducir
      hacia un lugar seguro y apagar el motor
    D: Poner el freno de mano
  answer: C
  explanation: Si el pedal del acelerador se atasca, mantenga los ojos en la carretera,
    cambie rápidamente a neutral, conduzca hacia un área segura fuera de la vía, apague
    el motor y pida ayuda.
- id: 83
  category: defensive_driving
  question: 'Cuando un vehículo se apaga en las vías del tren, el conductor debe:'
  choices:
    A: Intentar encender el motor nuevamente
    B: Esperar ayuda dentro del vehículo
    C: Salir y alejarse rápidamente, corriendo en un ángulo de 45 grados en dirección
      al tren
    D: Empujar el vehículo fuera de las vías
  answer: C
  explanation: Salga y aléjese rápidamente. Si se acerca un tren, corra en un ángulo
    de 45 grados alejándose de las vías, pero en dirección al tren para evitar los
    escombros que salgan volando.
- id: 84
  category: defensive_driving
  question: ¿Cuál es la fórmula estándar para la prevención de choques?
  choices:
    A: Detenerse, mirar, escuchar
    B: Estar alerta, estar preparado, actuar a tiempo
    C: Reducir la velocidad, hacerse a un lado, mantenerse alerta
    D: Escanear, identificar, predecir
  answer: B
  explanation: 'La fórmula para la prevención de choques es: Estar alerta (nunca piense
    que los demás no cometerán errores), Estar preparado (aprender qué hacer), Actuar
    a tiempo (no entrar en pánico).'
- id: 85
  category: defensive_driving
  question: ¿Cuánto tiempo puede flotar un vehículo con las ventanas y puertas cerradas
    después de caer al agua?
  choices:
    A: De 30 segundos a 1 minuto
    B: De 1 a 3 minutos
    C: De 3 a 10 minutos
    D: De 15 a 20 minutos
  answer: C
  explanation: Un vehículo con las ventanas y puertas cerradas flotará durante unos
    tres a diez minutos.
- id: 86
  category: defensive_driving
  question: 'Si los frenos fallan, el conductor primero debe:'
  choices:
    A: Apagar el motor
    B: Cambiar a una marcha más baja y bombear el pedal del freno rápida y fuertemente
    C: Conducir hacia una zanja
    D: Abrir la puerta y saltar
  answer: B
  explanation: Cambie a una marcha más baja y bombee el pedal del freno rápida y fuertemente.
    Si eso no funciona, use el freno de mano mientras sostiene el botón de liberación
    del freno.
- id: 87
  category: defensive_driving
  question: 'Durante un reventón de llanta, el conductor debe:'
  choices:
    A: Frenar bruscamente
    B: Sostener el volante con firmeza, mantener el vehículo derecho, quitar el pie
      del acelerador y dejar que el vehículo se detenga de forma segura
    C: Acelerar para mantener el control
    D: Girar el volante bruscamente
  answer: B
  explanation: Sostenga el volante con firmeza, mantenga el vehículo derecho, quite
    el pie del acelerador pero no frene. Deje que el vehículo se detenga por sí solo
    y hágase a un lado en un área segura.
- id: 88
  category: defensive_driving
  question: 'Las multas en zonas de construcción/trabajo son:'
  choices:
    A: Iguales que en zonas normales
    B: Duplicadas
    C: Triplicadas
    D: Incrementadas en $100
  answer: B
  explanation: Las multas de tránsito se duplican por infracciones de vehículos motorizados
    cometidas en zonas de construcción de carreteras. (N.J.S.A. 39:4-203.5)
- id: 89
  category: defensive_driving
  question: 'Al detenerse de noche a 60 mph usando luces bajas, la distancia total
    de parada es de aproximadamente:'
  choices:
    A: 302 pies
    B: 343 pies
    C: 409 pies
    D: 530 pies
  answer: C
  explanation: 'A 60 mph de noche (tiempo de reacción de 1.5 segundos): distancia
    de reacción de 132 pies + distancia de frenado de 277 pies = 409 pies.'
- id: 90
  category: defensive_driving
  question: ¿Qué tan lejos debe mirar un conductor mientras conduce en una ciudad
    a 25 mph?
  choices:
    A: Aproximadamente media cuadra
    B: Aproximadamente una cuadra adelante (12 segundos)
    C: Al menos un cuarto de milla
    D: Solo al vehículo de adelante
  answer: B
  explanation: Un conductor debe mirar al menos 12 segundos hacia adelante. Al conducir
    a 25 mph en una ciudad, esto significa aproximadamente una cuadra adelante.
- id: 91
  category: defensive_driving
  question: 'Cuándo se pueden usar neumáticos para nieve con clavos en Nueva Jersey:'
  choices:
    A: Del 1 de octubre al 31 de marzo
    B: Del 15 de noviembre al 1 de abril
    C: Del 1 de diciembre al 15 de marzo
    D: Todo el año
  answer: B
  explanation: En Nueva Jersey, los conductores pueden usar neumáticos para nieve
    con clavos entre el 15 de noviembre y el 1 de abril.
- id: 92
  category: defensive_driving
  question: ¿A qué distancia hacia atrás se debe colocar un dispositivo de advertencia
    durante una parada de emergencia en la carretera?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies (unos 120 pasos)
    D: 500 pies
  answer: C
  explanation: Coloque un dispositivo de advertencia al menos a 300 pies hacia atrás
    (unos 120 pasos).
- id: 93
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en la sangre (BAC)
    para conductores de 21 años o más en Nueva Jersey?
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.10%
    D: 0.04%
  answer: B
  explanation: En Nueva Jersey, es ilegal conducir con un BAC de 0.08% o más. (N.J.S.A.
    39:4-50)
- id: 94
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en la sangre (BAC)
    para conductores menores de 21 años?
  choices:
    A: 0.00%
    B: 0.01%
    C: 0.02%
    D: 0.05%
  answer: B
  explanation: Para las personas menores de 21 años, es ilegal conducir con un BAC
    de 0.01% o más. (N.J.S.A. 39:4-50.14)
- id: 95
  category: alcohol_drugs_health
  question: ¿Qué es lo único que puede hacer que una persona recupere la sobriedad?
  choices:
    A: El café
    B: Una ducha fría
    C: El aire fresco
    D: El tiempo
  answer: D
  explanation: Lo único que puede hacer que una persona recupere la sobriedad es el
    tiempo. El cuerpo elimina el alcohol lentamente.
- id: 96
  category: alcohol_drugs_health
  question: '¿Cuánto alcohol hay en cada una de estas bebidas: 12 oz de cerveza, 5
    oz de vino, 1.5 oz de licor de 86 grados (86-proof)?'
  choices:
    A: Cantidades diferentes en cada una
    B: 'Casi lo mismo: aproximadamente 1/2 onza de alcohol'
    C: La cerveza tiene más
    D: El vino tiene menos
  answer: B
  explanation: Cada bebida contiene aproximadamente 1/2 onza de alcohol. No se trata
    de qué bebe, sino de cuántas bebidas consume.
- id: 97
  category: alcohol_drugs_health
  question: 'Con un BAC ligeramente superior al 0.05%, el riesgo de causar un accidente:'
  choices:
    A: Se mantiene igual
    B: Se duplica
    C: Se triplica
    D: Se cuadruplica
  answer: B
  explanation: Con un BAC ligeramente superior al 0.05%, el riesgo se duplica. Al
    0.10% es 6 veces mayor. Al 0.15% es 25 veces mayor.
- id: 98
  category: alcohol_drugs_health
  question: ¿Qué es la ley de consentimiento implícito de Nueva Jersey?
  choices:
    A: Consentimiento para registrar el vehículo
    B: Al usar las carreteras de NJ, los conductores aceptan someterse a una prueba
      de alcoholemia tras ser arrestados por conducir bajo los efectos del alcohol
      o drogas (DUI)
    C: Consentimiento para una prueba de sobriedad en el lugar
    D: Consentimiento para una extracción de sangre en cualquier momento
  answer: B
  explanation: La ley de consentimiento implícito de NJ significa que los conductores
    han aceptado someterse a una prueba de alcoholemia administrada por las autoridades
    tras un arresto por DUI. (N.J.S.A. 39:4-50.4a)
- id: 99
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por negarse a realizar una prueba de alcoholemia en
    Nueva Jersey?
  choices:
    A: Una advertencia
    B: Pérdida de los privilegios de conducir, recargo de $1,000 al año durante 3
      años y un dispositivo de bloqueo de encendido (ignition interlock)
    C: Una multa de $100
    D: Suspensión de 30 días solamente
  answer: B
  explanation: Negarse resulta en la pérdida de los privilegios de conducir, un recargo
    por infracción de $1,000 al año durante tres años y la instalación de un dispositivo
    de bloqueo de encendido.
- id: 100
  category: alcohol_drugs_health
  question: Después del alcohol, ¿cuál es la droga que se encuentra con mayor frecuencia
    en los conductores involucrados en accidentes?
  choices:
    A: Cocaína
    B: Analgésicos recetados
    C: Marihuana
    D: Metanfetamina
  answer: C
  explanation: Después del alcohol, la marihuana es la droga que se encuentra con
    mayor frecuencia en los conductores involucrados en accidentes.
- id: 101
  category: alcohol_drugs_health
  question: 'Cuatro factores que determinan la concentración de alcohol en la sangre
    (BAC) son:'
  choices:
    A: Tipo de alcohol, género, hora del día, estado de ánimo
    B: Cantidad de alcohol consumida, peso corporal, qué tan rápido se consumen las
      bebidas, comida ingerida
    C: Tipo de alcohol, estatura, nivel de ejercicio, sueño
    D: Género, medicamentos, temperatura, altitud
  answer: B
  explanation: 'La concentración de alcohol en la sangre (BAC) se determina por: la
    cantidad consumida, el peso corporal, qué tan rápido se consumen las bebidas y
    la comida ingerida.'
- id: 102
  category: alcohol_drugs_health
  question: ¿Qué porcentaje de alcohol se elimina a través del aliento, la orina y
    el sudor?
  choices:
    A: 5%
    B: 10%
    C: 20%
    D: 50%
  answer: B
  explanation: El 90% del alcohol es oxidado por el hígado. El otro 10% se elimina
    a través del aliento, la orina y el sudor.
- id: 103
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de manejar bajo la influencia
    (DUI) con un BAC de 0.08% a menos de 0.10%?
  choices:
    A: $100-$200
    B: $250-$400
    C: $500-$1,000
    D: $1,000-$2,000
  answer: B
  explanation: 'Primera infracción de DUI con un BAC de 0.08% a <0.10%: multa de $250
    a $400, más varios recargos y tarifas.'
- id: 104
  category: penalties_and_points
  question: ¿Cuál es el recargo anual por una condena por manejar bajo la influencia
    (DUI)?
  choices:
    A: $250 por año durante 2 años
    B: $500 por año durante 3 años
    C: $1,000 por año durante 3 años
    D: $1,500 por año durante 5 años
  answer: C
  explanation: Recargo anual de $1,000 durante tres años para la primera y segunda
    infracción de DUI. (N.J.S.A. 17:29A-35)
- id: 105
  category: penalties_and_points
  question: ¿Cuál es la sanción por manejar sin seguro (primera infracción)?
  choices:
    A: Multa de $100
    B: Multa de $300 a $1,000, suspensión de la licencia por 1 año, servicio comunitario
    C: Solo advertencia
    D: Multa de $50 y 2 puntos
  answer: B
  explanation: 'Primera infracción: multa de $300 a $1,000, suspensión de la licencia
    por 1 año, recargo de $250 por año durante 3 años y servicio comunitario.'
- id: 106
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por exceso de velocidad de 1 a 14 mph por encima
    del límite?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: 'Exceder la velocidad máxima de 1 a 14 mph por encima del límite: 2
