  choices:
    A: Dos veces en dos años
    B: Tres veces en tres años
    C: Cuatro veces en cinco años
    D: Cinco veces en diez años
  answer: B
  explanation: Un infractor habitual es un conductor cuya licencia de conducir ha
    sido suspendida tres veces en tres años.
- id: 118
  category: penalties_and_points
  question: ¿Cuál es la sanción por chocar y darse a la fuga con lesiones corporales
