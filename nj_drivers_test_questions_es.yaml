  choices:
    A: Es una cortesía
    B: La persona tiene discapacidad visual y la ley lo exige
    C: La persona es de la tercera edad
    D: Se recomienda pero no es obligatorio
  answer: B
  explanation: La ley exige que todos los conductores se detengan ante personas ciegas
    que usen un bastón blanco o metálico, o que estén acompañadas por un perro guía.
    (N.J.S.A. 39:4-37.1)
- id: 133
  category: sharing_the_road
  question: ¿De qué velocidad a qué velocidad debe pasar un vehículo para que la tasa
