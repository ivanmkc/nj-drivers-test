  choices:
    A: 10 por ciento más
    B: 25 por ciento más
    C: 50 por ciento más
    D: 75 por ciento más
  answer: B
  explanation: Durante el mal tiempo, un camión, un camión con remolque o un autobús
    puede tardar hasta un 25 por ciento más en detenerse.
- id: 131
  category: sharing_the_road
  question: ¿A qué distancia se extiende la zona prohibida trasera (punto ciego o
