- id: 93
  category: driver_responsibility
  question: 引っ越し後、DDSで住所変更の手続きを行うには何日以内の猶予がありますか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: C
  explanation: マニュアルには次のように記載されています。「転居した場合は、60日以内にDDSカスタマーサービスセンターを訪れ、郵送先住所および/または居住地住所を更新しなければなりません...」
- id: 94
  category: driver_responsibility
  question: 引っ越し時にDDSで直接住所を更新することが重要なのはなぜですか？
  choices:
    A: 米国郵便公社（USPS）は、DDSからの郵便物を新住所へ転送しないため。
    B: 更新しないと、免許が即座に失効するため。
