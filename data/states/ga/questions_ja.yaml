- id: 97
  category: license_system
  question: 7年間の運転記録証明書（MVR）の費用はいくらですか？
  choices:
    A: $6.00
    B: $8.00
    C: $10.00
    D: $12.00
  answer: B
  explanation: マニュアルにはMVRの手数料が次のように規定されています。「3年間の記録は6.00ドル、7年間の記録は8.00ドルです。無期限（ライフタイム）の記録は8.00ドルです。」
- id: 98
  category: license_system
  question: 運転記録証明書（MVR）をオンラインで取得する場合と対面で取得する場合に関して、正しいものはどれですか？
  choices:
    A: オンラインのMVRは認証済みで、対面のMVRは非認証である。
    B: オンラインのMVRは非認証で、対面のMVRは認証済みである。
    C: オンラインと対面、どちらのMVRも認証済みである。
    D: オンラインと対面、どちらのMVRも非認証である。
  answer: B
  explanation: マニュアルには、「運転記録証明書（MVR）の非認証コピーはDDSオンラインサービスを使用してダウンロードできます」が、「認証コピーは...任意のDDSカスタマーサービスセンターで対面で購入できます」と記載されています。
- id: 99
  category: license_system
  question: 他人の運転記録証明書（MVR）を対面で取得するには何が必要ですか？
  choices:
    A: 免許保持者による口頭での同意
    B: 記録の受け取りを許可する旨を記載した、免許保持者によるMVR請求フォーム（DDS-18）
    C: 免許保持者の出生証明書の原本
    D: 裁判官が署名した裁判所命令
  answer: B
  explanation: 自分以外の記録を取得する場合、「記録の受け取りを許可された人物を指名した、免許保持者によるMVR請求フォーム（DDS-18）の記入」が必要です。
- id: 100
  category: license_system
  question: 紛失した免許証を再発行する際、第1リスト（出生証明書や米国パスポートなど）の書類を1つも持っていない場合、第2リスト（社会保障カードや有権者登録証など）から何通の書類を提出する必要がありますか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: マニュアルでは、免許証の再発行時の本人確認書類として、第1リスト（出生証明書、パスポートなど）から1通、または第2リスト（社会保障カード、有権者登録証など）から2通の書類が必要であると規定されています。
- id: 101
  category: license_system
  question: 郵送で運転記録証明書（MVR）を請求する際、支払方法として認められているのは次のうちどれですか？
  choices:
    A: 現金
    B: クレジットカード
    C: 郵便為替（マネーオーダー）
    D: 暗号資産
  answer: C
  explanation: 郵送で運転記録証明書（MVR）を請求する場合、運転者サービス局（DDS）宛ての郵便為替（マネーオーダー）、銀行小切手、または個人小切手を同封する必要があります。
- id: 102
  category: license_system
  question: 免許証または身分証明書（IDカード）の手続きの際、運転者サービス局（DDS）はどのグループに対して、米国選抜徴兵対象者登録制度（U.S. Selective
    Service System）への登録有無を確認することが義務付けられていますか？
  choices:
    A: 16歳以上のすべての申請者
    B: 18歳の男性
    C: 18歳の女性
    D: 21歳のすべての申請者
  answer: B
  explanation: DDSは、18歳の男性に対して米国選抜徴兵対象者登録制度に登録しているかどうかを確認し、その回答を報告することが義務付けられています。
- id: 103
  category: license_system
  question: 運転免許証を取得する際、ジョージア州の失明教育・検査・治療プログラム（Blindness Education, Screening, and
    Treatment Program）に対して、いくらの任意寄付を行う機会がありますか？
  choices:
    A: $1
    B: $2
    C: $5
    D: $10
  answer: A
  explanation: 運転免許証、許可証、または身分証明書（ID）を取得する際、ジョージア州の失明教育・検査・治療プログラムに対して1ドルの任意寄付を行う機会があります。
- id: 104
  category: driver_responsibility
  question: 患者の死亡を宣告した医師と臓器提供に関して、ジョージア州法は何と定めていますか？
  choices:
    A: その医師が臓器摘出を行わなければならない。
    B: その医師は、提供された臓器の摘出や移植に参加することを禁止されている。
    C: その医師は、ドナーの家族に費用を通知しなければならない。
    D: その医師が、誰が提供臓器を受け取るかを決定する。
  answer: B
  explanation: ジョージア州法では、患者の死亡を宣告した医師が、その患者から提供された臓器や組織の摘出または移植に参加することを禁止しています。
- id: 105
  category: driver_responsibility
  question: 臓器、組織、または眼球の提供に関連する費用について、ドナーの家族の負担額はいくらですか？
  choices:
    A: 一律500ドル
    B: 外科的摘出にかかる費用
    C: ドナーの家族に費用負担はない
    D: 臓器移植が成功した場合のみ家族が支払う
  answer: C
  explanation: 臓器、組織、または眼球の提供に関連するいかなる費用も、ドナーの家族に請求されることはありません。
- id: 106
  category: driver_responsibility
  question: 臓器提供の受取人を選定する際、使用されない要素は次のうちどれですか？
  choices:
    A: 必要性の緊急度
    B: 血液型の適合性
    C: 人種または信条
    D: 体の大きさと組織型
  answer: C
  explanation: 受取人は、性別、人種、信条に関係なく、必要性の緊急度、血液型の適合性、体の大きさ、および組織型によって選定されます。
- id: 107
  category: license_system
  question: ジョージア州学生金融局（GSFA）への任意寄付は、どのような人々の子供たちの高等教育への財政支援に役立てられますか？
  choices:
    A: すべてのジョージア州居住者
    B: 高校の卒業生総代
    C: 公務中に恒久的な障害を負った、または殉職した法執行官や緊急対応要員
    D: 医学の学位取得を目指す学生
  answer: C
  explanation: GSFAへの寄付は、公務中に恒久的な障害を負った、または殉職した法執行官、消防士、救急救命士などの子供たちの高等教育費用の財政支援に役立てられます。
- id: 108
  category: safe_driving_rules
  question: 交差点で警察官が交通整理をしており、信号が赤であるにもかかわらず進むよう指示された場合、どうすべきですか？
  choices:
    A: 信号が青に変わるまで待ってから進む。
    B: 警察官の指示に従って進む。
    C: 停車して、警察官にバッジ番号を尋ねる。
    D: 引き返して別のルートを探す。
  answer: B
  explanation: 最も基本的な交通法規の一つとして、たとえ交通制御装置（信号など）の指示と異なっていても、警察官や消防士による交通指示に従うことが義務付けられています。
- id: 109
  category: safe_driving_rules
  question: 工事や特別行事のために閉鎖されている道路を走行することが許可されるのは、どのような場合ですか？
  choices:
    A: 仕事に遅れそうなとき。
    B: 作業員が一人も見当たらないとき。
    C: 四輪駆動車を運転しているとき。
    D: いかなる場合も許可されない。
  answer: D
  explanation: 最も基本的な3つの交通法規の一つとして、工事、特別行事、またはその他の公的な理由で閉鎖されている道路を走行することは決して認められません。
- id: 110
  category: safe_driving_rules
  question: ジョージア州法における優先権（Right-of-way）に関する重要な原則は次のうちどれですか？
  choices:
    A: 優先権は奪い取るものであり、譲るものではない。
    B: 優先権は譲るものであり、奪い取るものではない。
    C: 最も大きな車両が常に優先権を持つ。
    D: 優先権のルールは自動車にのみ適用され、自転車には適用されない。
  answer: B
  explanation: 車両の運転者（自転車利用者を含む）および歩行者は、常に優先権に関するルールを理解し、優先権とは「譲るもの」であって「奪い取るもの」ではないことを忘れてはなりません。
- id: 111
  category: defensive_driving
  question: 法的な優先権があるにもかかわらず、他のドライバーがそれに気づかず譲ってくれない場合、どうすべきですか？
  choices:
    A: 速度を維持し、相手を強制的に停止させる。
    B: クラクションを鳴らし、減速せずに進む。
    C: 衝突を防ぐために優先権を譲る。
    D: 相手を避けるために対向車線にはみ出す。
  answer: C
  explanation: 道路交通法を守らない相手に対して、法的な優先権を持っている場合があります。そのような場合でも、衝突を防ぐために優先権を譲るべきです。
- id: 112
  category: safe_driving_rules
  question: 交差点の一時停止標識にいて、交差する側の交通には一時停止標識がない場合、いつ進むことができますか？
  choices:
    A: 完全に停止した直後。
    B: 停止した後、交差点内または交差点のすぐ近くにいる車両や歩行者に優先権を譲った後。
    C: 後ろの車両がクラクションを鳴らしたらすぐに。
    D: 交通状況に関わらず、正確に3秒間待った後。
  answer: B
  explanation: 自分側に一時停止標識があり、他の交通にはない場合、停止した上で、交差点内にいる、あるいは危険が生じるほど交差点に近い他の車両や歩行者に優先権を譲った後にのみ進むことができます。
- id: 113
  category: safe_driving_rules
  question: 一時停止標識、譲れ（Yield）の標識、または交通信号のない交差点で、2台の車両が同時に到着した場合、どうしなければなりませんか？
  choices:
    A: 左側のドライバーは右側のドライバーに譲らなければならない。
    B: 右側のドライバーは左側のドライバーに譲らなければならない。
    C: より速く走行している車両に優先権がある。
    D: 両方の車両が停止し、3台目の車両が到着するのを待たなければならない。
  answer: A
  explanation: 一時停止標識、譲れの標識、その他の交通信号がない交差点に2台の車両が同時に到着した場合、左側の車両の運転者は右側の車両の運転者に優先権を譲らなければなりません。
- id: 114
  category: sharing_the_road
  question: すべてのドライバーに対して一時停止標識がある4方向交差点（オールウェイ・ストップ）では、すべてのドライバーは誰に対して優先権を譲らなければなりませんか？
  choices:
    A: 交差点にいる最も大きな車両。
    B: 左折する車両。
    C: 歩行者。
    D: 最後に到着した車両。
  answer: C
  explanation: すべてのドライバーに一時停止標識がある4方向交差点では、すべてのドライバーは歩行者に優先権を譲らなければなりません。
- id: 115
  category: safe_driving_rules
  question: 標識や信号のない交差点に、あなたともう一台の車両が全く同時に到着した場合、どうすべきですか？
  choices:
    A: 右側の車両は左側の車両に譲らなければならない。
    B: 左側の車両は右側の車両の運転者に譲らなければならない。
    C: 直進する車両に優先権がある。
    D: 最も速い車両に優先権がある。
  answer: B
  explanation: マニュアルによると、一時停止標識や信号のない交差点に2台の車両が同時に到着した場合、左側の車両の運転者は右側の車両の運転者に優先権を譲らなければなりません。
- id: 116
  category: defensive_driving
  question: 他の道路からの交通が、走行中の車線に合流してくる場合、推奨される行動は何ですか？
  choices:
    A: 合流してくる交通を素早く追い越すために加速する。
    B: 相手が入れるように車両を完全に停止させる。
    C: 可能であれば、合流してくる交通から離れるように安全に車線変更する。
    D: 譲るように警告するためにクラクションを鳴らす。
  answer: C
  explanation: マニュアルでは、他の道路からの交通が走行中の道路に合流してくる場合、可能であれば合流車両から離れるように安全に車線変更すべきであるとアドバイスしています。
- id: 117
  category: safe_driving_rules
  question: 赤色灯を点滅させサイレンを鳴らした緊急車両が接近してきたとき、どのように対応すべきですか？
  choices:
    A: 加速して緊急車両の前を走り続ける。
    B: 左車線に移動して減速する。
    C: 現在の車線ですぐに停止する。
    D: 路肩または道路の右端にできるだけ寄って停止する。
  answer: D
  explanation: 緊急車両が緊急灯とサイレンを使用している場合は、路肩に移動するか、できるだけ右側に寄って停止し、安全に道を譲らなければなりません。
- id: 118
  category: signs_and_signals
  question: 赤信号で右折する場合、進む前に何をしなければなりませんか？
  choices:
    A: 時速5マイルまで減速し、安全であれば進む。
    B: 完全に停止し、すべての交通と歩行者に優先権を譲る。
    C: クラクションを鳴らし、停止せずに進む。
    D: 信号が青になるまで待つ。
  answer: B
  explanation: 標識で禁止されていない限り、完全に停止し、すべての交通と歩行者に優先権を譲り、安全であることを確認した後にのみ、赤信号での右折が可能です。
- id: 119
  category: safe_driving_rules
  question: 赤信号で左折することが合法となるのはどのような条件ですか？
  choices:
    A: 対面通行の道路から一方通行の道路へ曲がる場合。
    B: 一方通行の道路の左車線から、左方向に進む一方通行の道路へ曲がる場合。
    C: 一方通行の道路から対面通行の道路へ曲がる場合。
    D: 赤信号での左折が合法になることは決してない。
  answer: B
  explanation: 一方通行の道路の左車線から、交通が運転者の左方向に流れている一方通行の道路へ左折する場合、完全に停止して優先権を譲った後であれば、赤信号での左折が認められます。
- id: 120
  category: sharing_the_road
  question: 赤色灯を点滅させ、一時停止の標識（ストップアーム）を出しているスクールバスに対して、停止する必要がないのはどのような時ですか？
  choices:
    A: 2車線の道路を走行しているとき。
    B: 中央分離帯で仕切られたハイウェイの反対側を走行しているとき。
    C: 指定されたスクールゾーン内にいるとき。
    D: バスと同じ方向に走行しているとき。
  answer: B
  explanation: 中央分離帯で仕切られたハイウェイでは、停車中のスクールバスと反対側を走行している車両は停止する必要はありません。
- id: 121
  category: safe_driving_rules
  question: 片側一車線の道路で追い越しを行う際、対向車が自車から何フィート以内に近づく前に右側車線に戻らなければなりませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: C
  explanation: 対向車が自車から200フィート以内に近づく前に、自車を完全に右側車線に戻すための十分な時間とスペースを確保しなければなりません。
- id: 122
  category: safe_driving_rules
  question: 片側一車線の道路において、追い越しが禁止されているのは次のうちどの状況ですか？
  choices:
    A: 踏切や橋から100フィート以内。
    B: 前方の車両が制限速度以下で走行しているとき。
    C: 黄色の破線がある直線道路。
    D: 交差点から500フィート以内にいるとき。
  answer: A
  explanation: 踏切、橋、高架橋、またはトンネルから100フィート以内の片側一車線の道路では、追い越しが禁止されています。
- id: 123
  category: safe_driving_rules
  question: 他の車両を右側から追い越すことが許されるのはどのような場合ですか？
  choices:
    A: 前方の車両が低速で走行しているとき。
    B: 前方の車両が左折中、または左折しようとしており、十分な路面の幅があるとき。
    C: 道路の未舗装の路肩を走行することによって。
    D: スクールゾーン内にいるとき。
  answer: B
  explanation: 左折中または左折しようとしている車両の右側に、自車と左折車両の両方が通行できる十分な路面の幅がある場合は、右側から追い越すことができます。
- id: 124
  category: safe_driving_rules
  question: ジョージア州の「ムーブ・オーバー法（Move Over Law）」に基づき、路肩に停車している緊急車両に接近する際、安全に隣の車線に移動できない場合はどうしなければなりませんか？
  choices:
    A: 速度を維持し、クラクションを鳴らす。
    B: 車線内で直ちに停止する。
    C: 制限速度以下に減速し、停止できる態勢をとる。
    D: 車両を素早く追い越すために加速する。
  answer: C
  explanation: 「ムーブ・オーバー法」は、安全に可能な場合、運転者が隣の車線に移動することを義務付けています。移動できない場合は、制限速度以下に減速し、停止できる態勢をとらなければなりません。
- id: 125
  category: penalties_and_points
  question: 「ムーブ・オーバー法」の初犯に対する最大罰金額はいくらですか？
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: 「ムーブ・オーバー法」違反は、初犯の場合、500ドル以下の罰金が科せられる可能性があります。
- id: 126
  category: defensive_driving
  question: 他のドライバーが自車を追い越そうとしているとき、礼儀正しいとされる行為は何ですか？
  choices:
    A: 追い越しを防ぐために加速する。
    B: 進路を妨害するために左側に移動する。
    C: 相手が追い越しやすくなるよう、わずかに減速する。
    D: 相手に向かってハイビームを点滅させる。
  answer: C
  explanation: 後方のドライバーが自車を追い越そうとしているときは、わずかに減速して相手が追い越しやすくするのが礼儀正しい行為とされています。
- id: 127
  category: safe_driving_rules
  question: 路地や私道から幹線道路に入る前に、何をしなければなりませんか？
  choices:
    A: 左から接近する車両にのみ優先権を譲る。
    B: 一時停止し、すでに道路や歩道を通行しているすべての歩行者や車両に優先権を譲る。
    C: クラクションを鳴らし、停止せずに進む。
    D: 交通の流れに合流するために素早く加速する。
  answer: B
  explanation: 路地、私道、または私有地から幹線道路に入ったり横断したりしようとする場合は、一時停止し、すでにその道路や歩道を通行している他のすべての歩行者や車両に優先権を譲らなければなりません。
- id: 128
  category: signs_and_signals
  question: 交差点で信号が青であっても、交差点内の交通がまだクリアになっていない場合、どうすべきですか？
  choices:
    A: 優先権を主張するために交差点内に進入する。
    B: 交差点がクリアになるまでクラクションを鳴らし続ける。
    C: 交差点内の交通がなくなるまで待ってから進入する。
    D: 直進せずに右折する。
  answer: C
  explanation: 信号機のある交差点では、交差点内や接近中の交通がなくなるまで待ってから進入してください。青信号だからといって、それだけの理由で進んではいけません。
- id: 129
  category: penalties_and_points
  question: 自転車の追い越しに関する規則に違反した場合の罰則は何ですか？
  choices:
    A: 初犯の場合は警告
    B: 250.00ドル以下の罰金が科せられる軽罪
    C: 500.00ドル以下の罰金が科せられる重罪
    D: 6ヶ月間の免許停止
  answer: B
  explanation: マニュアルによると、自転車の追い越しに関する規則違反は、250.00ドル以下の罰金が科せられる軽罪となります。
- id: 130
  category: sharing_the_road
  question: 自転車を追い越す際に、隣接していない車線に移動できない場合はどうしなければなりませんか？
  choices:
    A: クラクションを鳴らし、現在の速度を維持する
    B: 制限速度より少なくとも時速10マイル低い速度、または時速25マイル（いずれか速い方）まで減速し、少なくとも3フィートの間隔を空ける
    C: 停車し、自転車が路肩に寄るのを待つ
    D: できるだけ早く自転車を追い越すために加速する
  answer: B
  explanation: 車線変更が不可能または安全でない場合は、掲示された制限速度より少なくとも時速10マイル低い速度、または時速25マイルのいずれか速い方まで減速し、自車と自転車の間に少なくとも3フィートの間隔を空けて進まなければなりません。
- id: 131
  category: safe_driving_rules
  question: 後方のドライバーがあなたの車両を追い越そうとしているとき、以下のうち違法となる行為はどれですか？
  choices:
    A: 速度をわずかに落とす
    B: 現在の車線位置を維持する
    C: 完全に追い越される前に速度を上げる
    D: バックミラーを確認する
  answer: C
  explanation: マニュアルには、追い越し車両に完全に追い越される前に速度を上げることは違法であると記載されています。
- id: 132
  category: sharing_the_road
  question: オートバイを追い越す際、ドライバーは以下を行わなければなりません：
  choices:
    A: スペースを節約するためにオートバイと同じ車線を共有する
    B: 隣接する車線で追い越す
    C: 同じ車線で追い越す前に、オートバイに警告するためにクラクションを鳴らす
    D: 道路の右側の路肩で追い越す
  answer: B
  explanation: オートバイの運転者は、法的に1車線の全幅を占有します。オートバイを追い越す際、ドライバーは隣接する車線で追い越さなければならず、同じ車線を占有することは許可されていません。
- id: 133
  category: safe_driving_rules
  question: 後方のドライバーに対し、好意や「追い越し許可」の合図として方向指示器を点滅させることは合法ですか？
  choices:
    A: はい、礼儀正しい運転とみなされます
    B: はい、ただし多車線の高速道路に限ります
    C: いいえ、法律違反です
    D: いいえ、雨や霧の場合を除きます
  answer: C
  explanation: マニュアルの「違法な合図」の項目には、後方の他のドライバーに対して好意や「追い越し許可」の合図として方向指示器を点滅させることは法律違反であると明記されています。
- id: 134
  category: vehicle_information
  question: 左折の準備をする際、車輪はどのようにしておくべきですか？
  choices:
    A: わずかに左に向けておく
    B: わずかに右に向けておく
    C: 右左折を開始するまで真っ直ぐにしておく
    D: 縁石の方に向けておく
  answer: C
  explanation: 左折する際、マニュアルでは右左折を開始するまで車輪を真っ直ぐにしておくよう指示されています。
- id: 135
  category: safe_driving_rules
  question: 左折のために交差点に入った後は、以下のことができません：
  choices:
    A: 交差点内で車線を変更する
    B: 信号が黄色になった場合に右左折を完了する
    C: 対向車に道を譲る
    D: 中央線に最も近い車線に曲がる
  answer: A
  explanation: マニュアルには、左折のために交差点に入った後は、交差点内で車線を変更することはできないと記載されています。
- id: 136
  category: safe_driving_rules
  question: 高速道路で車両が故障した場合、道路外に駐車するようあらゆる現実的な努力を払い、各方向に何フィート先から車両がはっきりと見えるようにしなければなりませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: C
  explanation: 車両が故障した場合は、通行の妨げにならないよう道路外に駐車し、各方向に200フィートの視界を確保して車両がはっきりと見えるようにする必要があります。
- id: 137
  category: safe_driving_rules
  question: 次の条件のうち、いかなる時も停車、停車維持、または駐車が許可されるのはどれですか？
  choices:
    A: 横断歩道の上
    B: 交差点内
    C: 橋や高架道路の上
    D: 上記のいずれでもない
  answer: D
  explanation: 横断歩道の上、交差点内、または橋や高架道路の上での停車、停車維持、または駐車はいかなる時も許可されていません。
- id: 138
  category: safe_driving_rules
  question: 消火栓から何フィート以内であれば、乗客の乗り降りのために一時的に停車することが許可されますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: B
  explanation: 消火栓から15フィート以内での停車、停車維持、または駐車は、乗客の乗り降りのための一時的な停車のみ許可されています。
- id: 139
  category: vehicle_information
  question: 縦列駐車をしようとする際、隣の車とほぼ並んで停車するとき、その車との距離（ドアからドアまで）はどのくらい離すべきですか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 4フィート
  answer: B
  explanation: 縦列駐車をしようとする際は、駐車スペースの前の車とほぼ並んだ位置で、その車から約2フィート（ドアからドアまで）離れて停車する必要があります。
- id: 140
  category: safe_driving_rules
  question: 「スローポーク法（Slow Poke Law）」によると、追い越し車線（一番左側の車線）を走行しているドライバーは、より速い車が接近してきたときに何をしなければなりませんか？
  choices:
    A: 制限速度で走行している場合は、その速度を維持する
    B: 右側に寄って、より速い車を先行させる
    C: 接近してくる車両の速度に合わせて加速する
    D: ハザードランプを点灯させる
  answer: B
  explanation: 「スローポーク法」は、走行速度に関わらず、低速のドライバーは追い越し車線から出て右側に寄り、より速い車が通行できるようにすることを義務付けています。
- id: 141
  category: safe_driving_rules
  question: 追い越し車線から移動することを義務付ける「スロー・ポーク法（Slow Poke Law）」の例外に当たるのは、次のうちどれですか？
  choices:
    A: 掲示されている制限速度ちょうどで運転しているとき
    B: ラジオを聴いているとき
    C: 出口から出るため、または左折するために追い越し車線を走行する必要があるとき
    D: 商用車を運転しているとき
  answer: C
  explanation: 「スロー・ポーク法（低速走行車両規制法）」の例外の一つは、出口から出るため、または左折するために追い越し車線を走行する必要がある場合です。
- id: 142
  category: sharing_the_road
  question: 横断歩道で歩行者が道路を横断するために車両が停止している場合、後方から接近する他の車両の運転者はどうしなければなりませんか？
  choices:
    A: 歩行者に警告するために警笛を鳴らして進む
    B: 停止している車両を右側から追い越す
    C: 停止している車両を追い抜きまたは追い越してはならない
    D: 停止している車両を左側から追い越す
  answer: C
  explanation: 横断歩道で歩行者が道路を横断するために車両が停止しているときはいつでも、後方から接近する他の車両の運転者は、その停止車両を追い抜きまたは追い越してはなりません。
- id: 143
  category: safe_driving_rules
  question: カーブや丘の頂上付近でUターンをしてはいけないのは、どのような場合ですか？
  choices:
    A: いずれの方向から接近する他の運転者からも自分の車が見えない場合
    B: 商用車を運転している場合
    C: 制限速度が時速45マイルを超えている場合
    D: 道路の右側に実線の白線がある場合
  answer: A
  explanation: マニュアルには、「いずれの方向から接近する他の運転者からも自分の車が見えない場合は、カーブや丘の頂上付近でUターンをしてはならない」と記載されています。
- id: 144
  category: penalties_and_points
  question: ジョージア州のスーパー・スピーダー法（Super Speeder law）に基づき、2車線道路で時速75マイル以上で走行した場合に課される州の罰金はいくらですか？
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: ジョージア州内の2車線道路で時速75マイル以上、またはあらゆる道路で時速85マイル以上のスピード違反で有罪判決を受けた運転者には、$200の州罰金が課されます。
- id: 145
  category: safe_driving_rules
  question: 別段の標識がない限り、ジョージア州の未舗装の郡道における最高速度制限は何マイルですか？
  choices:
    A: 時速30マイル
    B: 時速35マイル
    C: 時速45マイル
    D: 時速55マイル
  answer: B
  explanation: 別段の標識がない限り、未舗装の郡道における最高走行速度は時速35マイルです。
- id: 146
  category: safe_driving_rules
  question: ジョージア州の地方部の州間高速道路（rural interstate）における一般的な最高速度制限は何マイルですか？
  choices:
    A: 時速55マイル
    B: 時速65マイル
    C: 時速70マイル
    D: 時速75マイル
  answer: C
  explanation: 別段の標識がない限り、地方部の州間高速道路における最高走行速度は時速70マイルです。
- id: 147
  category: penalties_and_points
  question: 追い越し車線を低速で走行し、通常の交通の流れを妨げた場合の罰則として考えられるものはどれですか？
  choices:
    A: 最大$500の罰金と運転記録への2ポイントの加点
    B: 最大$1000の罰金および/または運転記録への3ポイントの加点
    C: 6ヶ月間の免許停止
    D: 義務的な安全運転講習の受講
  answer: B
  explanation: 追い越し車線で低速走行し交通を妨げた場合の罰則には、最大$1000の罰金および/または運転記録への3ポイントの加点が含まれます。
- id: 148
  category: safe_driving_rules
  question: 踏切で停止する必要がある場合、最も近いレールから最低何フィート離れて停止しなければなりませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 25フィート
    D: 50フィート
  answer: B
  explanation: 踏切で停止が必要な場合は、常に最も近いレールから50フィート以内、かつ15フィート以上の距離で停止しなければなりません。
- id: 149
  category: defensive_driving
  question: 踏切内で車両が動かなくなった（エンストした）場合、まず最初にすべきことは何ですか？
  choices:
    A: すぐにエンジンを再始動しようとする
    B: ギアをニュートラルに入れ、車を線路の外へ押す
    C: すぐに車から降りて離れる
    D: 車内からレッカー車を呼ぶ
  answer: C
  explanation: 線路上で車両が動かなくなった場合は、すぐに車から降りて離れ、緊急通知システム（ENS）の看板を確認して助けを呼ぶ必要があります。
- id: 150
  category: vehicle_information
  question: 標準的な乗用車を後退させる際、周囲を確認するための適切な技術は何ですか？
  choices:
    A: バックミラー（ルームミラー）のみを頼りにする
    B: 首を回して右肩越しに後ろを見る
    C: 左肩越しに見て、サイドミラーを使用する
    D: クラクションを鳴らして素早く後退する
  answer: B
  explanation: 後退する前には、首を回して右肩越しに後ろを見る必要があります。ミラーだけに頼ってはいけません。
- id: 151
  category: signs_and_signals
  question: 高速道路の工事区域（ワークゾーン）の警戒標識には何色が使用されていますか？
  choices:
    A: 黄色の背景に黒の文字
    B: オレンジ色の背景に黒の文字または記号
    C: 白色の背景に黒の文字
    D: 赤色の背景に白の文字
  answer: B
  explanation: 工事区域の警戒標識は、オレンジ色の背景に黒の文字または記号が描かれています。
- id: 152
  category: penalties_and_points
  question: 高速道路の工事区域において、規制速度制限に従わなかった場合の最大罰金額はいくらですか？
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: 工事区域内の規制速度制限に従わなかった運転者は、100ドル以上2,000ドル以下の罰金、または最大12ヶ月の禁錮、あるいはその両方が科せられる可能性があります。
- id: 153
  category: signs_and_signals
  question: 高速道路の工事区域において、交通誘導員（フラッガー）はどのような権限を持っていますか？
  choices:
    A: 安全な速度についての提案を行うことしかできない
    B: 規制標識と同じ権限を持っている
    C: 一時停止の仮設標識よりも権限が低い
    D: 建設作業員に交通状況を知らせるためにのみ配置されている
  answer: B
  explanation: 工事区域において、交通誘導員は規制標識と同じ権限を持っており、運転者はその交通規制の指示に従わなければなりません。
- id: 154
  category: sharing_the_road
  question: 琥珀色（黄色）の点滅灯または回転灯を装備した車両がある工事区域に近づく際、どのようにすべきですか？
  choices:
    A: 速度を維持し、クラクションを鳴らす
    B: 優先権を譲り、速度を落とす
    C: 車両を素早く追い越すために加速する
    D: ライトが消えるまで完全に停止する
  answer: B
  explanation: 琥珀色の点滅灯または回転灯を装備した作業車両や重機に対しては、優先権を譲り、接近する際に速度を落とさなければなりません。
- id: 155
  category: vehicle_information
  question: 縦列駐車を行う際、どの時点でハンドルを素早くまっすぐに戻し、斜め後ろへの後退を続けるべきですか？
  choices:
    A: 自分のフロントバンパーが前の車を完全に通り過ぎたとき
    B: 自分のフロントドアが前の車のリアバンパーを通過したとき
    C: 後退を開始する前
    D: 後ろの車に接触したとき
  answer: B
  explanation: 駐車しようとするスペースの前に停車している車両のリアバンパーを、自分の車のフロントドアが通過した時点で、素早くハンドルをまっすぐに戻し、スペースに向かって斜め後ろへの後退を続けます。
- id: 156
  category: penalties_and_points
  question: 運転者が「スーパー・スピーダー（Super Speeder）」の州手数料を期限内に支払わなかった場合、どうなりますか？
  choices:
    A: 車両が押収される
    B: 免許証に3ポイントが加算される
    C: 免許が停止され、50ドルの再交付手数料が追加される
    D: 運転免許試験の再受験が求められる
  answer: C
  explanation: 州の手数料を期限内に支払わなかった場合、免許停止処分となり、さらに50ドルの免許再交付手数料が科せられます。
- id: 157
  category: safe_driving_rules
  question: 全米の高速道路工事区域における死亡事故の大部分を占めているのは誰ですか？
  choices:
    A: GDOT（州運輸局）の作業員
    B: 一般のドライバーや同乗者
    C: 交通誘導員（フラッガー）
    D: 公共事業の作業員
  answer: B
  explanation: 全米の工事区域における死亡者の82%は一般市民であり、GDOTの作業員よりもドライバーの方が死亡や負傷の危険性が高いのが現状です。
- id: 158
  category: sharing_the_road
  question: 同じ方向に進む車線が2つ以上ある道路で、低速車両が右側車線から離れてもよいのはどのような時ですか？
  choices:
    A: 追い越しをする時、または左折をする時
    B: 運転者が道路をよりよく見渡したい時
    C: 最低速度制限ちょうどで走行している時
    D: 低速車両は決して右側車線から離れてはならない
  answer: A
  explanation: 同じ方向に進む車線が2つ以上ある場合、低速車両は追い越しや左折をする場合を除き、右側車線を使用しなければなりません。
- id: 159
  category: safe_driving_rules
  question: ほとんどの工事区域における交通違反の罰金について、正しいものはどれですか？
  choices:
    A: 半分に減額される
    B: 増額される
    C: 通常の道路と同じである
    D: 初犯の場合は免除される
  answer: B
  explanation: マニュアルの工事区域での運転に関するアドバイスによると、ほとんどの工事区域では罰金が増額されるため、速度制限の標識に注意する必要があります。
- id: 160
  category: safe_driving_rules
  question: アクセス制限道路（高速道路など）において、厳格に禁止されている操作はどれですか？
  choices:
    A: 緊急停止のために路肩を使用すること
    B: 後退（バック）すること
    C: 掲示された速度制限で走行すること
    D: 他の車両を追い越すこと
  answer: B
  explanation: マニュアルには、アクセス制限道路での後退（バック）は禁止されていると明記されています。
- id: 161
  category: safe_driving_rules
  question: 自動車で坂を下る際、運転者がしてはいけないことは何ですか？
  choices:
    A: ブレーキを軽くかける。
    B: ギアやトランスミッションをニュートラルにして惰性走行（コースティング）する。
    C: 両手でハンドルを握り続ける。
    D: 低いギアにシフトダウンする。
  answer: B
  explanation: 惰性走行に関する法律では、自動車の運転者は坂を下る際、車両のギアやトランスミッションをニュートラルにして走行してはならないと定められています。
- id: 162
  category: alcohol_drugs_health
  question: 21歳未満の人は、血中アルコール濃度（BAC）が何gm以上の場合に「酒気帯び運転（Under the Influence of Alcohol）」とみなされますか？
  choices:
    A: 0.02 gm
    B: 0.04 gm
    C: 0.06 gm
    D: 0.08 gm
  answer: A
  explanation: 21歳未満の人は、血液中のアルコール重量が0.02 gm以上である場合、紛れもなく「酒気帯び運転」とみなされます。
- id: 163
  category: alcohol_drugs_health
  question: 合法的に処方された薬の影響で運転能力が低下している場合、運転者は酒気帯び・薬物影響下運転（DUI）で起訴される可能性がありますか？
  choices:
    A: いいえ。その薬は医師によって合法的に処方されたものだからです。
    B: はい。処方箋があることは、その薬が安全な運転能力を損なわせている場合の弁護理由にはなりません。
    C: いいえ。薬がアルコールと一緒に摂取されていない限り、起訴されません。
    D: はい。ただし、運転者が21歳未満の場合に限ります。
  answer: B
  explanation: マニュアルには、特定の薬の処方箋を持っていることは、その薬が自動車を安全に操作する能力を損なわせている場合、弁護理由にはならないと記されています。
- id: 164
  category: driver_responsibility
  question: 他人を困らせたり、嫌がらせをしたり、威嚇したりする意図を持って自動車を運転することは、何と定義されますか？
  choices:
    A: 無謀運転（Reckless driving）
    B: あおり運転（Aggressive driving）
    C: 防衛運転（Defensive driving）
    D: 高速道路催眠現象（Highway hypnosis）
  answer: B
  explanation: 他人を困らせる、嫌がらせをする、つきまとう、威嚇する、負傷させる、または妨害する意図を持って自動車を運転した場合、あおり運転（Aggressive
    driving）の罪を犯したことになります。
- id: 165
  category: vehicle_information
  question: ジョージア州のハイウェイで許可されているトレーラーの最大幅はどれくらいですか？
  choices:
    A: 7フィート6インチ
    B: 8フィート0インチ
    C: 8フィート6インチ
    D: 9フィート0インチ
  answer: C
  explanation: マニュアルには、幅が8フィート6インチを超えるトレーラーはジョージア州のハイウェイでの走行が許可されていないと記されています。
- id: 166
  category: safe_driving_rules
  question: 自動車の運転中にヘッドホンやヘッドセットを装着することは合法ですか？
  choices:
    A: はい。GPSの音声案内を聞いている場合は合法です。
    B: はい。ただし、片耳のみに装着する場合に限ります。
    C: いいえ。運転者の聴力を損なうような装置を装着することは違法です。
    D: いいえ。田舎のハイウェイを走行している場合を除き、違法です。
  answer: C
  explanation: ヘッドホン、ヘッドセット、または運転者の聴力を損なう可能性のあるその他の装置を装着して自動車を運転することは違法です。
- id: 167
  category: sharing_the_road
  question: 駐車中の車両の、走行中の交通に面した側のドアを開けることが合法となるのはいつですか？
  choices:
    A: 住宅街に駐車している時のみ。
    B: 安全であり、自転車利用者を含む他の交通の妨げにならない場合に限ります。
    C: 車両から素早く降りる必要がある時はいつでも。
    D: いかなる状況においても合法ではありません。
  answer: B
  explanation: 交通が動いている側の車両のドアを開けることは、安全であり、かつ自転車利用者を含む他の交通の動きを妨げることなく行える場合を除き、禁止されています。
- id: 168
  category: safe_driving_rules
  question: ジョージア州の法律によると、いつヘッドライトを使用しなければなりませんか？
  choices:
    A: 日没の1時間後から日の出の1時間前まで。
    B: 日没の30分後から日の出の30分前まで、または雨が降っている時。
    C: 照明のない田舎道を走行している時のみ。
    D: 毎日午後8時から午前6時まで。
  answer: B
  explanation: 日没の30分後から日の出の30分前までの間、雨が降っている時、または視界が制限されている時は、ヘッドライトを使用しなければなりません。
- id: 169
  category: safe_driving_rules
  question: 前方の車両に追従する場合、何フィート以内に近づいたらヘッドライトをロービームにしなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 他の車両の直後（200フィート以内）を走行する場合は、ヘッドライトを減光（ロービームに）しなければなりません。
- id: 170
  category: defensive_driving
  question: 夜間の運転中に視界が大幅に低下した場合、走行車線を維持するためのガイドとして何を使用すべきですか？
  choices:
    A: 前方車両のテールランプ。
    B: 対向車のヘッドライト。
    C: 道路の外側線（エッジライン）または中央線。
    D: 路肩にある反射標識。
  answer: C
  explanation: 視界が大幅に低下した場合は、走行車線を維持するためのガイドとして道路の外側線（エッジライン）を使用してください。外側線がない場合は、中央線をガイドにして走行してください。
- id: 171
  category: safe_driving_rules
  question: 乗用車の同乗者のうち、座席の位置に関わらず法律でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 18歳未満のすべての同乗者。
    B: 12歳未満の同乗者のみ。
    C: 運転者と助手席の同乗者のみ。
    D: 65歳以上のすべての同乗者。
  answer: A
  explanation: 18歳未満であれば、乗用車のすべての同乗者は座席の位置に関わらずシートベルトを着用しなければなりません。
- id: 172
  category: penalties_and_points
  question: 5年以内にドラッグレース（公道での競走）または無謀なスタント運転で初めて有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 6ヶ月間の運転免許停止。
    B: 12ヶ月間の運転免許停止。
    C: 3年間の運転免許停止。
    D: 運転免許の永久取り消し。
  answer: B
  explanation: 5年以内にドラッグレースまたは無謀なスタント運転で初めて有罪判決を受けた場合の罰則には、12ヶ月間の免許停止が含まれます。
- id: 173
  category: safe_driving_rules
  question: 街路や高速道路を移動中のハウス・トレーラーに同乗者が乗ることは合法ですか？
  choices:
    A: はい、トレーラーにシートベルトが装備されている場合。
    B: はい、ただし同乗者が18歳以上の場合のみ。
    C: いいえ、車両に牽引されているトレーラーが移動中に乗ることは許可されていません。
    D: いいえ、車両が時速25マイル未満で走行している場合を除きます。
  answer: C
  explanation: ハウス・トレーラーやその他の車両に牽引されるトレーラーに乗ることは、負傷や死亡の可能性が高いため、街路や高速道路を移動中は許可されていません。
- id: 174
  category: safe_driving_rules
  question: ジョージア州法によると、乗用車のどの同乗者がシートベルトを着用しなければなりませんか？
  choices:
    A: 車両の運転者のみ
    B: 助手席の各同乗者および18歳未満のすべての同乗者
    C: 18歳未満の同乗者のみ
    D: 年齢や座席位置に関わらずすべての同乗者
  answer: B
  explanation: ジョージア州法では、助手席の各同乗者はシートベルトで固定される必要があり、また18歳未満であれば乗用車のすべての同乗者がシートベルトを着用しなければならないと定められています。
- id: 175
  category: penalties_and_points
  question: ジョージア州に「プライマリー（一次的）」シートベルト法があるとはどういう意味ですか？
  choices:
    A: シートベルト違反は、州内で最も一般的な交通違反である。
    B: 警察官は、他の違反を確認しなくても、シートベルト違反だけで車両を停止させ、違反切符を切ることができる。
    C: 車両の主運転者のみがシートベルト違反で切符を切られる可能性がある。
    D: シートベルト違反は、あらゆる交通違反の中で最も高い違反点数が科される。
  answer: B
  explanation: ジョージア州には「プライマリー」シートベルト法があり、これは警察官が他の違反を確認しなくても、シートベルト違反者に対して車両を停止させ、違反切符を切ることができることを意味します。
- id: 176
  category: safe_driving_rules
  question: ジョージア州法の下で、子供が適切なチャイルドシート（幼児用補助乗車装置）で適切に固定されなければならないのは、何歳未満の場合ですか？
  choices:
    A: 6歳
    B: 8歳
    C: 10歳
    D: 12歳
  answer: B
  explanation: 8歳未満の子供を輸送するすべての運転者は（タクシーや公共交通機関を除く）、適切なチャイルドシートで子供を適切に固定しなければなりません。
- id: 177
  category: sharing_the_road
  question: 火災報知に応じて走行中の消防車を追従する場合、どのくらいの距離を保たなければなりませんか？
  choices:
    A: 少なくとも100フィート
    B: 少なくとも200フィート
    C: 少なくとも300フィート
    D: 少なくとも500フィート
  answer: B
  explanation: いかなる車両の運転者も、火災報知に応じて走行中の消防車を200フィート以内の距離で追従してはなりません。
- id: 178
  category: safe_driving_rules
  question: 火災報知に応じて停車している消防車から、どのくらいの距離以内に車両を駐車することは違法ですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: 運転者は、火災報知に応じて停車している消防車から500フィート以内に車両を駐車してはなりません。
- id: 179
  category: penalties_and_points
  question: ジョージア州のポイ捨て防止法（Litter Control Law）に基づくポイ捨ての有罪判決に対する最大罰金と禁錮刑はいくらですか？
  choices:
    A: 500ドルの罰金と6ヶ月の禁錮刑
    B: 1000ドルの罰金と12ヶ月の禁錮刑
    C: 250ドルの罰金で禁錮刑なし
    D: 2000ドルの罰金と24ヶ月の禁錮刑
  answer: B
  explanation: ポイ捨て防止法の下で有罪判決を受けた者には、最大1000ドルの罰金と12ヶ月の禁錮刑が科される場合があります。
- id: 180
  category: safe_driving_rules
  question: ハンズフリー・ジョージア法（HB 673）の下で、運転中に法的に許可されているのは次のうちどれですか？
  choices:
    A: 肩で電話を支えること
    B: テキストメッセージを読むために電話を手に持つこと
    C: ヘッドフォンまたは固定されたデバイスを使用して電話を使用すること
    D: 電話が固定されている場合に動画を配信すること
  answer: C
  explanation: ハンズフリー法では、電話の使用はヘッドフォン、ワイヤレスデバイス、電話ホルダー、または固定されたデバイスを使用する場合にのみ許可されています。電話を手に持つこと、テキストを読むこと、動画を配信することは禁止されています。
- id: 181
  category: penalties_and_points
  question: ジョージア州ハンズフリー法（Hands Free Georgia Law）に基づく最初の違反（有罪判決）に対する罰則は何ですか？
  choices:
    A: 1ポイントの加算と50.00ドル以下の罰金
    B: 2ポイントの加算と100.00ドル以下の罰金
    C: 3ポイントの加算と150.00ドル以下の罰金
    D: 免許停止と50.00ドルの罰金
  answer: A
  explanation: ジョージア州ハンズフリー法に基づく最初の違反に対する罰則は、1ポイントの加算と50.00ドル以下の罰金です。
- id: 182
  category: sharing_the_road
  question: 点滅灯を点灯させて作業中の清掃車両に接近する際、車線変更が不可能な場合、速度をどの程度落とさなければなりませんか？
  choices:
    A: 正確に時速15マイルまで
    B: 標識の制限速度より少なくとも時速10マイル遅い速度、または時速25マイルのいずれか速い方まで
    C: 標識の制限速度より時速20マイル遅い速度まで
    D: 作業員が移動するまで完全に停止しなければならない
  answer: B
  explanation: 車線変更が不可能な場合は、標識の制限速度より少なくとも時速10マイル遅い速度、または時速25マイルのいずれか速い方まで減速し、停止できる態勢を整えなければなりません。
- id: 183
  category: penalties_and_points
  question: 郵便配達員や清掃作業員の追い越しに関する法律に違反した場合の最大罰金はいくらですか？
  choices:
    A: $50.00
    B: $100.00
    C: $250.00
    D: $500.00
  answer: C
  explanation: 郵便配達員や清掃作業員の追い越しに関する法規違反は、250.00ドル以下の罰金に処されます。
- id: 184
  category: license_system
  question: ジョージア州の段階的運転免許プログラムにおける「TADRA」は何の略ですか？
  choices:
    A: Teen and Adult Driving Rules Act（ティーンおよび成人の運転規則法）
    B: Teenage and Driver Responsibility Act（ティーンエイジャーおよびドライバー責任法）
    C: Traffic and Driving Regulations Act（交通および運転規制法）
    D: Teen Automotive Driving Requirements Act（ティーン自動車運転要件法）
  answer: B
  explanation: 1997年に制定されたティーンエイジャーおよびドライバー責任法（TADRA）は、ジョージア州の15歳から18歳の青少年を対象とした段階的運転免許プログラムを確立しました。
- id: 185
  category: license_system
  question: 18歳未満の申請者が免許を申請する場合、責任ある成人の立ち会いが必要です。この責任ある成人の最低年齢要件は何歳ですか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 法的保護者であれば最低年齢の制限はない
  answer: A
  explanation: 責任ある成人とは、18歳以上で、申請内容を証明する能力があり、申請者について個人的な知識を持っている人物と定義されています。
- id: 186
  category: license_system
  question: 18歳未満の申請者が運転免許の在学要件を満たすために提示できる書類は、次のうちどれですか？
  choices:
    A: クラスメートからの署名入り手紙
    B: 在学証明書（DS-1）
    C: 中学校の成績表
    D: 図書カード
  answer: B
  explanation: 18歳未満が免許や許可証を取得するには特定の書類を提示する必要があり、その一つが在学証明書（DS-1）です。
- id: 187
  category: defensive_driving
  question: ジョージア州の運転マニュアルによると、衝突のリスクを高める一般的な運転中の注意散漫（ディストラクション）と見なされるのは次のうちどれですか？
  choices:
    A: 頻繁にミラーを確認すること
    B: 方向指示器を使用すること
    C: 同乗者やペットの存在
    D: ハンドルを両手で保持すること
  answer: C
  explanation: マニュアルでは、一般的な注意散漫として携帯電話での通話、メール送信、食事などを挙げており、「同乗者やペットの存在も衝突のリスクを高める可能性がある」と付け加えています。
- id: 188
  category: license_system
  question: クラスC練習許可証（CP）で運転する場合、少なくとも何歳以上の人が同乗しなければなりませんか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 免許を持っている親または保護者であれば年齢は問わない
  answer: B
  explanation: クラスC車両を運転する免許を持ち、運転席の隣に座る21歳以上の人が同乗している場合に限り、クラスC車両を運転することができます。
- id: 189
  category: driver_testing
  question: クラスC練習許可証の試験手数料に関する規定はどうなっていますか？
  choices:
    A: 10.00ドルの手数料は、不合格の場合に全額返金される。
    B: 15.00ドルの手数料は、合格した後に支払う。
    C: 10.00ドルの手数料は試験前に支払う必要があり、不合格の場合でも返金されない。
    D: 最初の試験については手数料はかからない。
  answer: C
  explanation: マニュアルには、試験手数料は10.00ドルで、試験前に支払う必要があると記載されています。試験のいずれかの部分で不合格となった場合、返金は行われません。
- id: 190
  category: license_system
  question: クラスD制限付き免許（Provisional License）の保持者が運転を禁止されている時間帯はいつですか？
  choices:
    A: 午後10時00分から午前6時00分まで
    B: 午後11時00分から午前5時00分まで
    C: 午前0時00分から午前5時00分まで
    D: 午前1時00分から午前6時00分まで
  answer: C
  explanation: クラスD免許保持者は、例外なく午前0時00分から午前5時00分の間は運転することができません。
- id: 191
  category: license_system
  question: クラスD暫定免許（Class D Provisional License）を取得するには、ティーンエイジャーは累計で少なくとも何時間の運転経験を完了する必要がありますか？
  choices:
    A: 夜間2時間を含む20時間
    B: 夜間5時間を含む30時間
    C: 少なくとも6時間の夜間走行を含む40時間
    D: 少なくとも10時間の夜間走行を含む50時間
  answer: C
  explanation: 少なくとも6時間の夜間走行を含む、累計40時間以上の運転経験を完了している必要があります。
- id: 192
  category: driver_responsibility
  question: 親または法定後見人が未成年の学習許可証（instructional permit）または運転免許証の取り消しを希望する場合、いくらの手数料を支払う必要がありますか？
  choices:
    A: 5.00ドル
    B: 10.00ドル
    C: 15.00ドル
    D: 20.00ドル
  answer: B
  explanation: 未成年の学習許可証または運転免許証の取り消しを申請する人は、返金不可の手数料10.00ドルを支払う必要があります。
- id: 193
  category: penalties_and_points
  question: 21歳未満の人が、当て逃げ・ひき逃げ（hit and run）または無謀運転（reckless driving）で初めて有罪判決を受けた場合、免許停止期間はどのくらいになりますか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 12ヶ月
    D: 24ヶ月
  answer: B
  explanation: リストされた違反（当て逃げ・ひき逃げ、無謀運転を含む）で有罪判決を受けた21歳未満の人の学習許可証または運転免許証は、初回の有罪判決で6ヶ月間停止されます。
- id: 194
  category: penalties_and_points
  question: 21歳未満の運転者が免許停止処分を受けるのは、次のうちどの違反ですか？
  choices:
    A: 制限速度を時速10マイル超える速度超過
    B: スクールゾーンでの不適切な駐車
    C: 制限速度を時速24マイル以上超える速度超過
    D: 方向指示器の使用義務違反
  answer: C
  explanation: 21歳未満の運転者は、4点以上の違反点数が科される違反を犯した場合に免許停止となります。これには、制限速度を時速24マイル以上超える速度超過が含まれます。
- id: 195
  category: penalties_and_points
  question: 18歳未満の運転者が、12ヶ月間に何点以上の違反点数を累積すると免許停止になりますか？
  choices:
    A: 2点以上
    B: 4点以上
    C: 6点以上
    D: 8点以上
  answer: B
  explanation: マニュアルによると、18歳未満の間に12ヶ月間で4点以上の違反点数を累積すると、免許停止処分が行われます。
- id: 196
  category: license_system
  question: クラスD暫定免許を取得する際、ADAPは何の略ですか？
  choices:
    A: Adolescent Driving and Parking（思春期の運転と駐車）
    B: Advanced Driver Assessment Protocol（高度運転者評価プロトコル）
    C: Alcohol and Drug Awareness Program（アルコール・薬物意識プログラム）
    D: Adult Driver Approval Process（成人運転者承認プロセス）
  answer: C
  explanation: クラスD暫定免許を取得するには、アルコール・薬物意識プログラム（ADAP）の修了証明書を提示する必要があります。
- id: 197
  category: license_system
  question: ジョージア州でクラスM二輪車運転免許（Class M Motorcycle Operator's License）を取得するには、何歳である必要がありますか？
  choices:
    A: 15歳
    B: 16歳
    C: 17歳
    D: 18歳
  answer: C
  explanation: マニュアルには「クラスM二輪車運転免許を取得するには17歳である必要があります」と記載されています。
- id: 198
  category: penalties_and_points
  question: 初めてのDUI（酒気帯び・酒酔い運転）による免許停止で、黙示的同意テスト（implied consent testing）を拒否した場合、免許はどのくらいの期間停止されますか？
  choices:
    A: 最低6ヶ月
    B: 最低12ヶ月
    C: 最低18ヶ月
    D: 最低24ヶ月
  answer: B
  explanation: マニュアルによると、初回のDUIによる免許停止において、血中アルコール濃度（BAC）が0.08以上であった場合、または黙示的同意テストを拒否した場合、免許は最低12ヶ月間停止されます。
- id: 199
  category: penalties_and_points
  question: 2回目のDUIによる免許停止期間中、運転者がイグニッション・インターロック許可証（エンジン始動制限装置装着許可証）の申請資格を得るのはいつですか？
  choices:
    A: 停止後すぐ
    B: 30日後
    C: 120日後
    D: 6ヶ月後
  answer: C
  explanation: マニュアルには、2回目のDUIによる免許停止の場合、免許は最低18ヶ月間停止されますが、120日経過後にイグニッション・インターロック許可証の申請資格が得られると記載されています。
- id: 200
  category: signs_and_signals
  question: 八角形の標識に近づいたとき、どうしなければなりませんか？
  choices:
    A: 停止せずに対向車に道を譲る
    B: 標示された停止線で完全に停止する
    C: 時速15マイルまで減速する
    D: 踏切に備える
  answer: B
  explanation: 八角形の標識は常に「停止」を意味します。この標識に来たら、標示された停止線で完全に停止しなければなりません。
- id: 201
  category: signs_and_signals
  question: 円形の道路標識は何を示していますか？
  choices:
    A: この先に学校区域がある
    B: 踏切に近づいている
    C: 進路を譲らなければならない
    D: 追い越し禁止区間が始まる
  answer: B
  explanation: 円形の標識は、踏切に近づいていることを意味します。速度を落とし、見て、聞いて、停止する準備をするよう警告しています。
- id: 202
  category: safe_driving_rules
  question: 踏切で他の車両を追い越す際のルールは何ですか？
  choices:
    A: 線路に車両がいなければ追い越しは許可される
    B: 商用車のみ追い越しが許可される
    C: すべての踏切において追い越しは禁止されている
    D: 時速20マイル以下で走行している場合は追い越しが許可される
  answer: C
  explanation: マニュアルには「すべての踏切において追い越しは禁止されている」と明記されています。
- id: 203
  category: signs_and_signals
  question: 五角形の標識は、何に近づいていることを示していますか？
  choices:
    A: 学校区域および/または通学路
    B: 中央分離帯のあるハイウェイ
    C: 病院区域
    D: 急な坂道
  answer: A
  explanation: 五角形の標識は、学校区域および/または通学路に近づいていることを意味します。
- id: 204
  category: signs_and_signals
  question: 五角形の標識は通常、学校の敷地や通学路のどのくらい手前に設置されますか？
  choices:
    A: 50〜100フィート
    B: 150〜700フィート
    C: 500〜1000フィート
    D: 正確に1マイル
  answer: B
  explanation: 五角形の標識が使用される場合、学校の敷地または通学路の150フィート以上700フィート以内の手前に設置されます。
- id: 205
  category: signs_and_signals
  question: 規制標識にある、左上から右下への赤い斜線が入った赤い円は何を意味しますか？
  choices:
    A: 注意して進め
    B: 円の中に描かれた行為は禁止されている
    C: 前方に危険がある
    D: 直ちに停止しなければならない
  answer: B
  explanation: 左上から右下への赤い斜線が入った赤い円は「禁止」を意味することを覚えておいてください。円の中の絵は、何が禁止されているかを示しています。
- id: 206
  category: safe_driving_rules
  question: 進行方向に2つ以上の走行車線がある場合、低速の車両はどうすべきですか？
  choices:
    A: 左側（内側）の車線を走行する
    B: 中央車線のみを走行する
    C: 右側（外側）の車線を走行する
    D: 路肩を走行する
  answer: C
  explanation: マニュアルには、進行方向に2つ以上の走行車線がある場合、低速の車両は右側（外側）の車線を走行すべきであると記載されています。
- id: 207
  category: defensive_driving
  question: マニュアルによると、雨天時に路面が最も危険になるのはいつですか？
  choices:
    A: 雨が降り始めてからの30分間
    B: 雨が降り始めてから2時間後
    C: 雨が止んだ直後
    D: 雷を伴う雨のとき
  answer: A
  explanation: 滑りやすい道路の警告標識には次のように記されています。「濡れているとき、路面は滑りやすくなります。雨の降り始めの30分間が最も危険であることを忘れないでください。」
- id: 208
  category: vehicle_information
  question: 前方に急な坂道があることを示す警告標識を見たとき、どうすべきですか？
  choices:
    A: 速度を維持するために加速する
    B: 燃料を節約するためにニュートラルに入れる
    C: 速度を制御しブレーキを保護するために、低いギアにシフトする準備をする
    D: 直ちに非常ブレーキをかける
  answer: C
  explanation: 前方に急な坂道がある場合、マニュアルでは「速度を落とし、速度の制御とブレーキの損傷を防ぐために、低いギアにシフトする準備をすること」を推奨しています。
- id: 209
  category: signs_and_signals
  question: 「追い越し禁止区域（No Passing Zone）」の標識は、通常ハイウェイのどこに設置されていますか？
  choices:
    A: ハイウェイの右側
    B: ハイウェイの左側
    C: 中央車線の真上に吊り下げられている
    D: 路面にのみ描かれている
  answer: B
  explanation: マニュアルには、追い越し禁止区域の標識は「ハイウェイの左側にあり、追い越し禁止区域の始まりを示している」と記載されています。
- id: 210
  category: safe_driving_rules
  question: 路肩が軟弱（Soft Shoulder）であることを示す警告標識がある場合、路肩を走行するのが適切なのはどのようなときですか？
  choices:
    A: 低速車両を追い越す必要があるとき
    B: 右折したいとき
    C: 緊急時のみ
    D: 本線が混雑しているときはいつでも
  answer: C
  explanation: 路肩軟弱の警告標識は次のように示しています。「路肩が軟弱です。緊急時のみ路肩を走行してください。」
- id: 211
  category: sharing_the_road
  question: ジョージア州の法律では、公道の標識や交通信号に従う義務があるのは誰ですか？
  choices:
    A: 自動車の運転者のみ
    B: 自転車利用者を含むすべての運転者
    C: 商用車の運転者のみ
    D: 勤務中または非番の緊急作業員を除く全員
  answer: B
  explanation: ジョージア州の法律では、警察官や緊急作業員による指示がある場合を除き、自転車利用者を含むすべての運転者が公道の標識や交通信号に従うことを義務付けています。
- id: 212
  category: penalties_and_points
  question: 初めてのDUI（飲酒・薬物影響下運転）による免許停止において、血中アルコール濃度（BAC）が0.02以上0.08未満であった場合、最低の免許停止期間はどれくらいですか（過去に有罪判決がない場合）？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 12ヶ月
    D: 18ヶ月
  answer: B
  explanation: 血中アルコール濃度（BAC）が0.02以上0.08未満であった場合、過去に有罪判決がなければ、免許は最低6ヶ月間停止されます。
- id: 213
  category: vehicle_information
  question: ジョージア州の法律では、低速車両（slow-moving vehicle）はどのように定義されていますか？
  choices:
    A: 時速35マイル未満で走行する車両
    B: 時速25マイル未満で走行する車両
    C: 時速40マイル未満で走行する車両
    D: 時速15マイル未満で走行する車両
  answer: B
  explanation: 低速車両とは、時速25マイル未満で走行するすべての車両と定義されています。これらの車両は、法律により低速車両マーク（エンブレム）を表示することが義務付けられています。
- id: 214
  category: signs_and_signals
  question: ジョージア州のハイウェイにおいて、マイルポスト・マーカー（距離標）の数字がゼロから始まるのはどこですか？
  choices:
    A: ルートが始まる北または東の境界線
    B: 州の中心部
    C: ルートが始まる南または西の境界線
    D: 各郡の境界線の始まり
  answer: C
  explanation: マイルポスト・マーカーは、道路沿いに1マイルごとに設置されています。ゼロ地点は常に、そのルートが始まる南または西の境界線から始まります。
- id: 215
  category: signs_and_signals
  question: 建設および保守作業の警告標識は何色ですか？
  choices:
    A: 黄地に黒のマーク
    B: 赤地に白のマーク
    C: オレンジ地に黒のマーク
    D: 青地に白のマーク
  answer: C
  explanation: 建設および保守プロジェクトの警告標識は、前方の危険を知らせるために使用されます。これらの標識はオレンジ地に黒のマークで示されます。
- id: 216
  category: signs_and_signals
  question: ガソリンスタンド、食事、宿泊施設などのサービス施設を案内する標識には何色が使われていますか？
  choices:
    A: 緑と白
    B: 青と白
    C: 茶色と白
    D: 黒と白
  answer: B
  explanation: ジョージア州のハイウェイを走行中、青と白の標識がサービス施設への案内を表示します。
- id: 217
  category: safe_driving_rules
  question: I-85エクスプレス・レーンを無料で利用できるのは、次のうちどの車両ですか？
  choices:
    A: 1人乗りのすべての車両
    B: オートバイ
    C: 大型商用トラック
    D: ナンバープレートに関わらずすべての電気自動車
  answer: B
  explanation: I-85エクスプレス・レーンでは、登録済みの公共交通機関、3人以上の相乗り車両（カープール）、オートバイ、緊急車両、および適切なAFVナンバープレートを付けた代替燃料車（AFV）が無料で利用できます。
- id: 218
  category: signs_and_signals
  question: 交通信号が全く機能していない交差点に近づいた場合、どうしなければなりませんか？
  choices:
    A: 右側の車両に道を譲って進む
    B: すべての方向に一時停止標識があるものとして交差点を扱う
    C: 道が空いていれば停止せずに交差点を通過する
    D: 警察官が到着するまで待ってから横断する
  answer: B
  explanation: 交差点で交通信号が全く機能していない場合、すべての運転者はその交差点を、全方向に一時停止標識があるものとして扱わなければなりません。
- id: 219
  category: signs_and_signals
  question: 黄色の矢印の点滅信号は何を示していますか？
  choices:
    A: 左折する前に完全に停止しなければならない
    B: 対向車や歩行者に道を譲った後、左折することができる
    C: 信号が故障しているため、4方向一時停止として扱う必要がある
    D: 左折の優先権があり、対向車は停止しなければならない
  answer: B
  explanation: 黄色の矢印の点滅は、対向車や歩行者に道を譲った後に左折できることを意味します（対向車側はまだ青信号です）。
- id: 220
  category: signs_and_signals
  question: 歩行者ハイブリッド・ビーコン（PHB）が赤色の交互点滅を表示しているとき、運転者はどうしなければなりませんか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止し、歩行者が横断歩道を渡り終えたら進む
    C: 停止し、信号が青になるまで待つ
    D: 歩行者に道を譲るが、停止する必要はない
  answer: B
  explanation: PHBでの赤色の交互点滅は、運転者に完全停止を義務付けています。歩行者が横断歩道を渡り終えたら、進むことができます。
- id: 221
  category: signs_and_signals
  question: 停止線がある交差点で、運転者はどこで完全に停止しなければなりませんか？
  choices:
    A: 実際の停止標識または交通信号機の場所。
    B: 横断歩道を通過した直後。
    C: 停止線を越える前の、停止線の位置。
    D: 交差する交通が最もよく見える場所ならどこでも。
  answer: C
  explanation: 停止線がある場合、運転者は実際の停止標識や信号機の場所ではなく、停止線の手前で完全に停止しなければなりません。
- id: 222
  category: signs_and_signals
  question: 踏切において追い越しを禁止するために使用される路面標示は何ですか？
  choices:
    A: 道路の右端にある実線の白線。
    B: 道路の中央にある破線の黄線。
    C: センターラインの右側に配置された黄線。
    D: 二重の破線の白線。
  answer: C
  explanation: 踏切では、追い越しを防止するために、常にセンターラインの右側に黄線が配置されます。
- id: 223
  category: signs_and_signals
  question: 赤色の点滅信号に対して、運転者はどのように対応すべきですか？
  choices:
    A: 徐行して注意深く進む。
    B: 完全に停止し、一時停止標識（STOPサイン）と同様に扱う。
    C: 停止して信号が青に変わるのを待つ。
    D: 右側の交通に道を譲り、停止せずに進む。
  answer: B
  explanation: 赤色の点滅信号は、完全に停止しなければならないことを意味します（一時停止標識と同じ扱いです）。歩行者や他の車両に優先権を譲った後、注意して進んでください。
- id: 224
  category: signs_and_signals
  question: 2車線道路にある1本の実線の黄線は何を示していますか？
  choices:
    A: 追い越しが禁止されている区間。
    B: 道が空いていれば追い越しが許可される区間。
    C: 左折専用に指定された車線。
    D: 車道の右端。
  answer: A
  explanation: 2車線道路にある1本の実線の黄線は、追い越しが禁止されている区間であることを示します。
- id: 225
  category: sharing_the_road
  question: 歩行者が道路を横断中に歩行者用信号が点滅し始めた場合、どうすべきですか？
  choices:
    A: 引き返して元の歩道に戻る。
    B: 横断歩道の真ん中で止まって待つ。
    C: できるだけ速く走って反対側へ渡る。
    D: そのまま道路を渡りきる。
  answer: D
  explanation: 歩行者用信号の点滅は、新たに歩道から離れてはいけないことを意味しますが、すでに横断を始めている場合は、そのまま渡りきってください。
- id: 226
  category: signs_and_signals
  question: 2車線道路の破線の黄線は何を示していますか？
  choices:
    A: 両方向とも追い越し禁止。
    B: どちらの方向からも安全に追い越しができる。
    C: この先で道幅が狭くなる。
    D: 踏切に近づいている。
  answer: B
  explanation: 破線の黄線は、車線が2つだけで、どちらの方向からも安全に追い越しができる場合に使用されます。
- id: 227
  category: signs_and_signals
  question: 路面にある二重の実線の白線は何を示していますか？
  choices:
    A: 車線変更禁止。
    B: 隣の車線への移動が許可されている。
    C: 停止の準備をしなければならない。
    D: 自転車専用の車線。
  answer: A
  explanation: 二重の白線が実線である場合、車線変更は禁止されています。
- id: 228
  category: signs_and_signals
  question: 道路の左側にある黄色のエッジライン（路側線）の目的は何ですか？
  choices:
    A: 歩行者用横断歩道を示すため。
    B: 自転車レーンをマークするため。
    C: 幅の狭い中央分離帯や盛り上がった中央分離帯を警告するため。
    D: 優先車線（HOVレーン）を指定するため。
  answer: C
  explanation: 道路の左側に黄色のエッジラインが使用されることがあり、これは幅の狭い中央分離帯や盛り上がった中央分離帯があることを警告するものです。
- id: 229
  category: safe_driving_rules
  question: 反対方向に進む車線を含めて4車線以上ある道路を走行中、2本の実線の黄色いセンターラインを越えてもよいのはどのような時ですか？
  choices:
    A: 低速車両を追い越すとき。
    B: 路地、私道、またはドライブウェイに左折して入るとき。
    C: 渋滞中に車線変更をするとき。
    D: 2本の実線の黄線を越えることは決して許されない。
  answer: B
  explanation: これらの線は、路地、私道、ドライブウェイ、または別の道路へ左折して出入りする場合にのみ越えることができます。
- id: 230
  category: signs_and_signals
  question: 道路上に斜めの黄線で描かれたゼブラゾーン（導流帯）に遭遇したとき、どうすべきですか？
  choices:
    A: 低速車両を追い越すために標示の上を走行する。
    B: 標示エリア内に車両を駐車する。
    C: 常にこれらの標示の右側を通行する。
    D: そのエリアを利用してUターンをする。
  answer: C
  explanation: これらの標示は、道幅が狭くなっていることや、路上に障害物があることを示しています。常にこれらの標示の右側を通行してください。
- id: 231
  category: safe_driving_rules
  question: 中央左折車線（センター・レフトターン・レーン）を左折する前に走行できる最大距離はどのくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: 左折する地点から300フィート以内の距離でこの車線に入ることができます。
- id: 232
  category: sharing_the_road
  question: 自動車の運転者が自転車専用レーンを横切って走行することが許可されるのはどのような場合ですか？
  choices:
    A: 遅い車両を追い越すとき。
    B: 道路の脇に車両を駐車するとき。
    C: 右左折のために横切る場合のみ。
    D: 通常の車線が混雑しているとき。
  answer: C
  explanation: 自動車の運転者は、右左折のために横切る場合を除き、自転車専用レーンを走行または駐車することは禁止されています。
- id: 233
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）に入る際、優先権を持つのは誰ですか？
  choices:
    A: ラウンドアバウトに入ろうとしている車両。
    B: すでにラウンドアバウト内を走行している車両。
    C: 交差点に接近している最も大きな車両。
    D: 右側から進入する車両。
  answer: B
  explanation: ラウンドアバウトに入る際も、優先権に関する交通法規が適用されます。すでにラウンドアバウト内を走行している他の車両に道を譲らなければなりません。
- id: 234
  category: safe_driving_rules
  question: ラウンドアバウト内では、交通はどの方向に循環しますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 8の字型
    D: 運転者が選択した方向
  answer: B
  explanation: ラウンドアバウト内の交通は常に反時計回りに循環します。
- id: 235
  category: defensive_driving
  question: 複数車線のラウンドアバウトを走行する際に守るべき重要なルールは何ですか？
  choices:
    A: 出口を出るために素早く車線変更する。
    B: 常に左車線から進入する。
    C: ラウンドアバウト内では車線変更をしない。
    D: 他の車両を進入させるためにラウンドアバウト内で停止する。
  answer: C
  explanation: 複数車線のラウンドアバウトを走行する際は、目的の道路に到達するまで車線を維持して回り続ける必要があります。ラウンドアバウト内では車線変更をしないでください。
- id: 236
  category: sharing_the_road
  question: 経験豊富なサイクリストは、どのようにラウンドアバウトを走行すべきですか？
  choices:
    A: できるだけ縁石に沿って走る。
    B: 車両に追い越されないよう、車線の中央を走る。
    C: 常に自転車から降りて歩く。
    D: 交通の流れと逆方向に走る。
  answer: B
  explanation: 経験豊富なサイクリストは、自動車の運転者と同様にラウンドアバウトを走行することができます。縁石に沿って走るのではなく、車両に追い越されないように車線の中央を走行してください。
- id: 237
  category: vehicle_information
  question: 車両の推奨タイヤ空気圧（psi）はどこで確認できますか？
  choices:
    A: ステアリングホイール（ハンドル）上。
    B: 車両のドアジャム（ドアの開口部付近）。
    C: 車両のナンバープレート上。
    D: エンジンブロック上。
  answer: B
  explanation: 車両に乗り込む前に、ドアジャムに記載されている推奨psiを確認してタイヤの空気圧をチェックしてください。
- id: 238
  category: vehicle_information
  question: ペニーテストでタイヤの溝をチェックする際、安全な溝の深さで走行していることを示すのはどれですか？
  choices:
    A: エイブラハム・リンカーンの頭全体が見える。
    B: エイブラハム・リンカーンの頭の一部が溝に隠れている。
    C: ペニーが溝から落ちる。
    D: 溝が1/32インチ未満である。
  answer: B
  explanation: リンカーンの頭の一部が溝に隠れていれば、法的かつ安全な溝の深さで走行していることになります。
- id: 239
  category: safe_driving_rules
  question: 路上に駐車している場合、どのように安全に車両に近づき、乗り込むべきですか？
  choices:
    A: 交通に背を向けて車道側から乗り込む。
    B: 対向車の方を向いて車両に近づき、可能であれば歩道側から乗り込む。
    C: 確認せずに運転席のドアまで素早く走る。
    D: 助手席の窓から乗り込む。
  answer: B
  explanation: 路上に駐車している場合は、車両の歩道側から乗り込んでください。鍵を準備し、対向車の方を向いて車両に近づきます。
- id: 240
  category: driver_responsibility
  question: 車両のイグニッションを入れる直前に何をすべきですか？
  choices:
    A: ラジオをつける。
    B: シートベルトを締め、同乗者も同様に締めているか確認する。
    C: タイヤの空気圧をチェックする。
    D: すべての窓を下ろす。
  answer: B
  explanation: イグニッションを入れる前に、シートベルトを締め、同乗者も同様に締めていることを確認してください。
- id: 241
  category: safe_driving_rules
  question: 路上に停車している車両に近づく際、どのように歩いて向かうべきですか？
  choices:
    A: 交通の流れに背を向けて
    B: 交通の流れに向き合って
    C: 助手席側からのみ
    D: 車両の後方から
  answer: B
  explanation: マニュアルによると、路上に停車している車両に乗り込む際は、鍵を準備し、交通の流れに向き合う形で車両に近づく必要があります。
- id: 242
  category: safe_driving_rules
  question: 一般的なルールとして、エアバッグに関する特定の指示がない車両において、ハンドル（ステアリングホイール）の推奨される手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 8時と4時の位置
    C: 9時と3時の位置
    D: 12時と6時の位置
  answer: C
  explanation: 一般的なルールとして、ハンドルを握る際は、左手を9時の位置に、右手を3時の位置に置きます。
- id: 243
  category: defensive_driving
  question: 濃霧の中を運転する際、どのライトを使用すべきですか？
  choices:
    A: ハイビーム（上向きライト）
    B: 駐車灯
    C: ハザードランプ
    D: ロービーム（下向きライト）
  answer: D
  explanation: 濃霧の中ではヘッドライトをロービームにする必要があります。ハイビーム（明るい光）は反射して眩しくなり、かえって視界が悪くなるためです。
- id: 244
  category: defensive_driving
  question: 標準的な乗用車において、部分的なハイドロプレーニング現象は何マイル（mph）から発生し始める可能性がありますか？
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: 標準的な乗用車では、時速35マイル（35 mph）という低速から部分的なハイドロプレーニング現象が始まることがあります。
- id: 245
  category: defensive_driving
  question: 車両がハイドロプレーニング現象を起こし始めた場合、適切な対処法は何ですか？
  choices:
    A: すぐにブレーキを強く踏む
    B: 路肩に向かって急ハンドルを切る
    C: アクセルから足を離し、自然に減速させる
    D: 水たまりを突き抜けるために加速する
  answer: C
  explanation: ハイドロプレーニング現象が発生した場合は、アクセルから足を離し、車を減速させる必要があります。
- id: 246
  category: defensive_driving
  question: 車両がスリップ（横滑り）し始めた場合、ハンドルをどのように操作すべきですか？
  choices:
    A: スリップしている方向とは逆に切る
    B: スリップしている方向に切る
    C: 完全に真っ直ぐに保持する
    D: 素早く前後に動かす
  answer: B
  explanation: スリップし始めたら、ハンドルをスリップしている方向（後輪が流れている方向）に切り始める必要があります。
- id: 247
  category: safe_driving_rules
  question: 雨が降り始めてからの最初の30分間が、運転において最も危険とされるのはなぜですか？
  choices:
    A: 視界が即座にゼロになるため
    B: ハイドロプレーニング現象は最初の30分間にしか発生しないため
    C: 水が路面上のオイルや化学物質と混ざり、非常に滑りやすくなるため
    D: 降り始めはブレーキが故障しやすいため
  answer: C
  explanation: 雨の降り始めの30分間が最も危険なのは、水が路面のオイルやその他の化学物質と混ざり合い、道路が極めて滑りやすくなるためです。
- id: 248
  category: defensive_driving
  question: カーブを走行中に速度が速すぎると気づいた場合、どうすべきですか？
  choices:
    A: 素早く減速するためにブレーキを強く踏む
    B: アクセルから足を離し、慎重にブレーキをかける
    C: ギアをニュートラルに入れ、惰性でカーブを通り抜ける
    D: トラクションを高めるために少し加速する
  answer: B
  explanation: カーブで速度が出すぎている場合、スリップの原因となるため、ブレーキを強く踏んではいけません。代わりに、アクセルから足を離し、慎重にブレーキをかけながらハンドル操作を続けてください。
- id: 249
  category: defensive_driving
  question: 車両が予期せず車道を外れてしまった場合、すぐに舗装路に戻ろうとするのを避けるべきなのはなぜですか？
  choices:
    A: タイヤを損傷するため
    B: 過剰な修正や急ハンドルによって、制御不能になったり、スリップや横転を招いたりする恐れがあるため
    C: レッカー車の助けを待たなければならないため
    D: 一旦停止せずに車道に戻ることは違法であるため
  answer: B
  explanation: すぐに舗装路に戻ろうとしてはいけません。過剰な修正や「急ハンドル」は、スリップや横転を引き起こし、車両の制御を失う原因となります。
- id: 250
  category: safe_driving_rules
  question: 冬の天候下で初めて車道に出る際、安全が確認できる場合に路面状況をテストするにはどうすればよいですか？
  choices:
    A: 急加速してタイヤのグリップを確認する
    B: 急ブレーキをかけて滑るかどうかを確認する
    C: ブレーキを軽く試し、わずかにハンドルを動かして調整してみる
    D: 車線をまたいでジグザグに走行する
  answer: C
  explanation: 冬の天候で初めて車道に入るときは、ブレーキを軽く試したり、わずかなハンドル操作に対する車両の反応を確認したりして、路面の「感触」を掴むようにしてください。
- id: 251
  category: alcohol_drugs_health
  question: 一酸化炭素中毒の症状として正しいものは次のうちどれですか？
  choices:
    A: 突然の倦怠感、あくび、めまい、および吐き気
    B: 多動性および心拍数の増加
    C: 視界のぼやけおよび耳鳴り
    D: 極度の空腹感および喉の渇き
  answer: A
  explanation: 一酸化炭素中毒の症状には、突然の倦怠感、あくび、めまい、吐き気などがあります。
- id: 252
  category: driver_responsibility
  question: 一酸化炭素中毒を防ぐために、絶対にやってはいけないことは何ですか？
  choices:
    A: 窓を開けて運転すること
    B: ガレージ内で車のエンジンをかけたままにすること
    C: 高速道路を走行中にヒーターを使用すること
    D: エンジンを切った状態で、開放されたドライブウェイに車を停めること
  answer: B
  explanation: 一酸化炭素中毒を避けるための簡単な予防策として、ガレージ内で車のエンジンをかけたままにしてはいけません。
- id: 253
  category: defensive_driving
  question: 走行中に突然タイヤがパンク（バースト）した場合、推奨される最初のステップは何ですか？
  choices:
    A: ブレーキを強く踏んで即座に停止する
    B: ハンドルをしっかりと握り、アクセルから足を離す
    C: 素早く路肩にハンドルを切る
    D: 前進する勢いを維持するために加速する
  answer: B
  explanation: 突然タイヤがパンクした場合は、ハンドルをしっかりと握り、アクセルから足を離して、車両が転がって停止するようにします。
- id: 254
  category: signs_and_signals
  question: ダイバージング・ダイヤモンド・インターチェンジ（DDI）は、どのように交通の流れを改善しますか？
  choices:
    A: すべての車両に対し、フリーウェイに入る前に4差路の交差点で停止することを義務付ける
    B: 交通の流れを道路の反対側にシフトさせることで、停止することなくオンランプ（入り口車線）へ左折できるようにする
    C: 大きな円形のラウンドアバウトを使用して、交通を絶えず動かし続ける
    D: フリーウェイへのアクセスを商用車のみに制限する
  answer: B
  explanation: ダイバージング・ダイヤモンド・インターチェンジ（DDI）は、交通の流れを一時的に道路の反対側にシフトさせることで、車両が停止することなく左折してフリーウェイのオンランプに入れるように設計されています。
- id: 255
  category: safe_driving_rules
  question: 標準的な乗用車のタイヤが、ハイドロプレーニング現象によって路面との接地を完全に失う可能性がある速度はどれくらいですか？
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: 標準的な乗用車では、35 mphから部分的なハイドロプレーニングが始まることがありますが、55 mphではタイヤが路面との接地を完全に失う可能性があります。
- id: 256
  category: vehicle_information
  question: 車両の走行中にイグニッションを「ロック（LOCK）」位置にすると、どのような危険な状況が発生しますか？
  choices:
    A: ブレーキが即座にロックされ、車が停止する。
    B: 車両のステアリング（ハンドル）操作ができなくなる。
    C: エンジンが急加速する。
    D: ハザードランプが自動的に点滅する。
  answer: B
  explanation: マニュアルによると、車両の走行中にイグニッションをロック位置にすると、車両のステアリング操作能力が無効になり、運転者はハンドル操作ができなくなります。
- id: 257
  category: safe_driving_rules
  question: 前方の車両との間に十分な車間距離を保っているかどうかを判断するには、どうすればよいですか？
  choices:
    A: 前方の車両との間に、正確に車2台分の距離を空ける。
    B: 停止状態から加速する前に3秒間待つ。
    C: 前方の車が目印を通過した後、「1001（ワン・サウザンド・ワン）、1002（ワン・サウザンド・ツー）」と数える。
    D: 前方の車両の後輪が路面に接しているのが見えることを確認する。
  answer: C
  explanation: マニュアルでは、前方の車が特定の目印を通過するのを確認し、「1001、1002」と数えることを推奨しています。数え終わる前に同じ地点を通過した場合は、車間距離が近すぎます。
- id: 258
  category: defensive_driving
  question: 次の条件のうち、車間距離をさらに長くすべきなのはどれですか？
  choices:
    A: 悪天候のとき。
    B: 交通量が多いとき。
    C: 夜間のとき。
    D: 上記のすべて。
  answer: D
  explanation: マニュアルには、悪天候時、工事中、交通量が多いとき、そして常に夜間は、前方車両との距離をさらに大きく取るべきであると記載されています。
- id: 259
  category: safe_driving_rules
  question: マニュアルに記載されている、実際の停止距離を決定する要因に含まれないものは次のうちどれですか？
  choices:
    A: 風向と風速。
    B: 舗装の種類と状態。
    C: 時刻（時間帯）。
    D: 運転者の精神的および肉体的な反応。
  answer: C
  explanation: マニュアルでは、精神的・肉体的反応、舗装の種類・状態、タイヤ、シャシー設計、ブレーキ、風向・風速が停止距離に影響を与える要因として挙げられています。時刻は含まれていません。
- id: 260
  category: safe_driving_rules
  question: 加速車線から高速道路に入る際、どちらに優先権がありますか？
  choices:
    A: 高速道路に入ろうとしている車両。
    B: すでに高速道路を走行している車両。
    C: より速い速度で走行している方の車両。
    D: 右端の車線を走行している車両は、合流してくる車両に譲らなければならない。
  answer: B
  explanation: マニュアルには、「高速道路上の車両に優先権がありますが、礼儀正しい運転者は高速道路の交通の流れに合流させてくれるでしょう」と記載されています。
- id: 261
  category: signs_and_signals
  question: アクセス制限のある高速道路における「ゴア（gore）」とは何ですか？
  choices:
    A: 緊急時のための指定休憩所。
    B: 2つの車線が合流するエリアで、通常は実線の白線で形成されている。
    C: 高乗車人数車（HOV）用の料金所車線。
    D: 反対方向に進む交通を分ける中央分離帯。
  answer: B
  explanation: マニュアルでは、ゴア（導流帯）を「2つの車線の合流エリア... 通常は三角形に似ており、既存の走行車線と合流車線の間の実線の白線によって形成される」と定義しています。
- id: 262
  category: signs_and_signals
  question: 高乗車人数車（HOV）車線は、路面上にどのように表示されていますか？
  choices:
    A: 両側に実線の黄線。
    B: 自転車のシンボルマーク。
    C: 菱形（ダイヤモンド）のシンボル。
    D: 大きな白い「X」。
  answer: C
  explanation: マニュアルによると、HOV車線は菱形のシンボルでマークされており、制限時間が掲示されています。
- id: 263
  category: penalties_and_points
  question: ジョージア州において、HOV車線の制限違反の初回違反に対する罰則は何ですか？
  choices:
    A: 最大75ドルの罰金。
    B: 最大100ドルの罰金。
    C: 最大150ドルの罰金と運転記録への1ポイントの加点。
    D: 30日間の免許停止。
  answer: A
  explanation: HOV車線の制限違反に対する罰則は、初回違反の場合、最大75ドルの罰金です。
- id: 264
  category: safe_driving_rules
  question: 高乗車人数有料（HOT）車線を無料で利用できるのはどの車両ですか？
  choices:
    A: 乗員がちょうど2名のすべての車両。
    B: 登録済みの公共交通機関、3人以上の相乗り車両、オートバイ、緊急車両、および代替燃料車。
    C: 商業用トラクター・トレーラー。
    D: オフピーク時間帯に走行するすべての車両。
  answer: B
  explanation: HOT車線では、登録済みの公共交通機関、3人以上の相乗り車両、オートバイ、緊急車両、および代替燃料車は無料で車線を利用できます。
- id: 265
  category: safe_driving_rules
  question: 高速道路で他の車両を追い越す際、右側の車線に戻っても安全なのはいつですか？
  choices:
    A: 自分のフロントバンパーが相手の車両を追い越した直後。
    B: 追い越したばかりの車がバックミラー（ルームミラー）にはっきりと見えたとき。
    C: 相手のドライバーがヘッドライトを点滅させたとき。
    D: 左側車線を少なくとも1マイル走行した後。
  answer: B
  explanation: マニュアルでは、「追い越したばかりの車がバックミラーにはっきりと見えるようになるまで、右側の車線に戻ってはいけません」とアドバイスしています。
- id: 266
  category: safe_driving_rules
  question: 高速道路で後退（バック）して走行することが許されるのは、どのような状況ですか？
  choices:
    A: 出口を通り過ぎてしまい、後方に交通がない場合。
    B: 窓から物を落とした場合。
    C: ひどい渋滞中に、手前の出口に向かう場合。
    D: 高速道路での後退走行はいかなる状況下でも禁止されている。
  answer: D
  explanation: マニュアルには、「後退してはいけません。高速道路での後退走行はいかなる状況下でも禁止されています」と明記されています。
- id: 267
  category: safe_driving_rules
  question: 高速道路の路肩への停車が許可される「有効な緊急事態」とみなされるのは、次のうちどれですか？
  choices:
    A: 運転者の交代。
    B: 長旅の途中で足を伸ばして休憩すること。
    C: 車両の後部から物を取り出すこと。
    D: 上記のいずれでもない。
  answer: D
  explanation: マニュアルには、路肩への停車は緊急時のみ許可されると記されており、「運転者の交代、ストレッチ、または車両の後部から物を取り出すことは緊急事態とはみなされません」と明記されています。
- id: 268
  category: safe_driving_rules
  question: 高速道路の出口に向かう準備として走行車線内で減速する場合、何をすべきですか？
  choices:
    A: 他のドライバーに警告するためにクラクションを鳴らす。
    B: ブレーキランプまたは方向指示器（ウィンカー）のいずれかを使用して、後続のドライバーに速度の変化を知らせる。
    C: ハザードランプを点灯させる。
    D: ギアをニュートラルに入れる。
  answer: B
  explanation: マニュアルには、「出口に向かう準備として走行車線内で減速する場合、ドライバーはブレーキランプまたは方向指示器のいずれかを使用して、後続のドライバーに速度の変化を知らせる必要があります」と記されています。
- id: 269
  category: sharing_the_road
  question: トラクター・トレーラー（連結車）の死角を走行するのが特に危険なのはなぜですか？
  choices:
    A: 乗用車よりもはるかに速いスピードで走行するため。
    B: その大きさゆえに視界が限られているため。
    C: 高速道路の路肩に頻繁に停車するため。
    D: 右側の車線を走行することが許可されていないため。
  answer: B
  explanation: マニュアルでは死角に入らないよう警告しており、特に大型車両については次のように述べています。「18輪車としても知られるトラクター・トレーラーは、その大きさゆえに視界が限られています。」
- id: 270
  category: driver_responsibility
  question: 一酸化炭素中毒の被害者に遭遇した場合、まず最初にすべきことは何ですか？
  choices:
    A: 飲み物として水を与える。
    B: 被害者を新鮮な空気のある場所に移動させる。
    C: 顔に泥や土を塗る。
    D: 溝に水がないか確認する。
  answer: B
  explanation: マニュアルでは、「一酸化炭素中毒の被害者を新鮮な空気のある場所に移動させ、救急医療サービスに連絡し、必要であれば人工呼吸を行うこと...」と指示されています。
- id: 271
  category: safe_driving_rules
  question: マニュアルによると、高速道路の路肩に停車する理由として認められるのは次のうちどれですか？
  choices:
    A: 運転手の交代
    B: 車両の後部から荷物を取り出す
    C: 足を伸ばして休憩する
    D: 車両の故障または真の緊急事態が発生した場合
  answer: D
  explanation: マニュアルには、路肩への停車は非常に危険であり、緊急時のみ許可されると記載されています。運転手の交代、ストレッチ、荷物の取り出しは緊急事態とはみなされません。
- id: 272
  category: safe_driving_rules
  question: 高速道路で緊急停車が必要になった場合、トラブルが発生していることを示すために何をすべきですか？
  choices:
    A: 助けを求めて高速道路沿いを歩く
    B: ボンネットを上げ、ハザードランプを点灯させる
    C: 車線内に立ち、腕を振る
    D: 助けが来るまでクラクションを鳴らし続ける
  answer: B
  explanation: 高速道路で停車が必要な場合は、ボンネットを上げ、ハザードランプを点灯させてトラブルを知らせる必要があります。マニュアルでは、助けを求めて高速道路沿いを歩かないよう明示的に警告しています。
- id: 273
  category: defensive_driving
  question: 「ハイウェイ・ヒプノーシス（高速道路催眠現象）」とは何ですか？
  choices:
    A: 高速道路での単調な運転によって引き起こされる、眠気や無意識の状態
    B: 興奮剤の影響下で運転することを指す法律用語
    C: 道路の中央線に集中するために使用されるテクニック
    D: 点滅する左折信号を凝視する行為
  answer: A
  explanation: 高速道路の運転手は、単調さ、風の音、路面のタイヤ音、エンジンの一定のうなり音によって引き起こされる眠気や無意識の状態である「ハイウェイ・ヒプノーシス」に陥りやすくなります。
- id: 274
  category: defensive_driving
  question: 長距離ドライブで覚醒状態を保ち、ハイウェイ・ヒプノーシスを避けるためには、どうすればよいですか？
  choices:
    A: 道路の中央線を凝視する
    B: 眠気を防ぐために興奮剤を服用する
    C: 道路のあちこちに絶えず目を動かす
    D: 直前の車両だけに集中する
  answer: C
  explanation: 長距離ドライブでは、注意力を維持するために「目を動かす」ことが良い方法です。道路のあちこちに絶えず目を動かし、近くや遠く、左右のさまざまな対象物に焦点を合わせるようにしてください。
- id: 275
  category: defensive_driving
  question: 防衛運転手として、運転中は常に「回避ルート」を考えておく必要があります。これはどういう意味ですか？
  choices:
    A: 高速道路から出るための最短ルートを計画すること
    B: 他の車両が自分の車線に進入してきた場合に備え、安全に回避できる場所を探しておくこと
    C: 目的地までの最速ルートを見つけること
    D: 最寄りの休憩所の場所を把握しておくこと
  answer: B
  explanation: 回避ルートを考えるとは、対向車が自分の車線側に越えてきた場合にどう対処するかを判断するために、路肩や周辺エリアを注意深く見ておくことを意味します。
- id: 276
  category: vehicle_information
  question: 走行中にアクセルが戻らなくなった（固まった）場合、どうすべきですか？
  choices:
    A: すぐにパーキング（P）に入れる
    B: イグニッションを切り、ハンドルをロックする
    C: ニュートラル（N）に入れ、ハンドル操作に集中する
    D: アクセルペダルを繰り返し踏み込む
  answer: C
  explanation: アクセルが戻らなくなった場合は、足でペダルを叩き、ニュートラルに入れ、ハンドル操作に集中し、ブレーキを使用し、イグニッションを切ります（ただし、ハンドルをロックさせないように注意してください）。
- id: 277
  category: vehicle_information
  question: ブレーキが故障した場合の推奨される行動は次のうちどれですか？
  choices:
    A: 高いギアにシフトチェンジする
    B: 低いギアにシフトダウンし、パーキングブレーキを使用する
    C: イグニッションを切ってハンドルをロックする
    D: 交通の流れから抜けるために加速する
  answer: B
  explanation: ブレーキが故障した場合、マニュアルでは低いギアへのシフトダウン、パーキングブレーキの使用、タイヤを縁石にこすりつけること、そして安全に停止できる場所を探すことを推奨しています。
- id: 278
  category: vehicle_information
  question: 深い水たまりを走行した後、濡れたブレーキを乾かすにはどうすればよいですか？
  choices:
    A: 自然乾燥させるために高速で走行する
    B: ニュートラルに入れて惰性で走る
    C: 低いギアでゆっくり走行しながら、軽くブレーキをかける
    D: 加速しながらブレーキを素早く何度も踏む
  answer: C
  explanation: 濡れたブレーキは、低いギアでゆっくり走行しながら軽くブレーキをかけることで乾かすことができます。
- id: 279
  category: vehicle_information
  question: アトランタ都市圏の13郡において、毎年の排ガス検査義務が免除される車両はどれですか？
  choices:
    A: すべての小型トラック
    B: 製造から10年経過した車両
    C: 最新の3モデルイヤー（製造から3年以内の車両）
    D: 年間の走行距離が10,000マイル未満の車両
  answer: C
  explanation: 製造から25年未満のガソリン車および小型トラックは検査に合格する必要がありますが、最新の3モデルイヤーについてはこの義務が免除されます。
- id: 280
  category: vehicle_information
  question: マニュアルによると、車両を10秒間アイドリングさせることは：
  choices:
    A: エンジンを再始動するよりも多くの燃料を消費する
    B: バッテリーをフル充電する
    C: 走行する場合と比較してエンジンの摩耗を抑える
    D: ブレーキ故障の原因となる
  answer: A
  explanation: 車両を10秒間アイドリングさせると、エンジンを再始動するよりも多くの燃料を消費します。アイドリングを最小限に抑えることで、燃料消費、エンジンの摩耗、および大気汚染を減らすことができます。
- id: 281
  category: sharing_the_road
  question: ジョージア州の法律では、横断歩道内を横断中の歩行者に対し、運転者はいつ停止し、停止し続けなければなりませんか？
  choices:
    A: 歩行者が車両の直前にいるときのみ
    B: 歩行者が車両の走行している側の車道半分にいるとき、またはその車線から1車線以内に近づいているとき
    C: 横断歩道に白線が引かれている場合のみ
    D: 信号が赤のときのみ
  answer: B
  explanation: 歩行者が車両の走行している側の車道半分にいるとき、またはその半分から1車線以内に近づいているときは、運転者は停止し、停止し続けなければなりません。
- id: 282
  category: sharing_the_road
  question: 歩行者の優先権に関する法律において、「車道の半分（half of the roadway）」とは何を意味しますか？
  choices:
    A: 道路の正確な中心線
    B: 歩道に最も近い車線
    C: 一方向の通行を担うすべての車線
    D: 対向車線を分ける中央分離帯
  answer: C
  explanation: 「車道の半分」とは、一方向の通行を担うすべての車線を意味します。
- id: 283
  category: sharing_the_road
  question: 横断歩道に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 横断歩道は、白線で標示されている場合にのみ存在する
    B: 横断歩道は、白線で標示されていない場合でも、交差点の4つの角すべてに存在する
    C: 歩行者は、ブロックの中間にある横断歩道においてのみ優先権を持つ
    D: 信号が青であれば、運転者は横断歩道を塞いでもよい
  answer: B
  explanation: 横断歩道は、白線で標示されていない場合でも、交差点の4つの角すべてに存在します。横断歩道とは、歩道が通りを横切って延びる、歩行者の通行のための路面部分のことです。
- id: 284
  category: sharing_the_road
  question: 通りを横断している視覚障害のある歩行者に近づく際、いつ優先権を譲らなければなりませんか？
  choices:
    A: 標示された横断歩道内にいるときのみ
    B: 白い杖を持っているか、盲導犬に誘導されている場合は常に
    C: 信号が赤のときのみ
    D: 日中の時間帯のみ
  answer: B
  explanation: 盲導犬を使用している、または白い杖を使用している歩行者には、常に優先権を譲らなければなりません。
- id: 285
  category: safe_driving_rules
  question: 赤信号で右折待ちをする際、車両はどこで停止すべきですか？
  choices:
    A: 交通状況をよく確認するために、横断歩道の真ん中
    B: 歩行者が安全に横断できるように、横断歩道の手前
    C: 横断歩道を越えた場所
    D: 交差点内
  answer: B
  explanation: 赤信号で右折する前に、運転者は横断歩道の手前で完全に停止しなければなりません。横断歩道を塞ぐことは歩行者を危険にさらすため、避ける必要があります。
- id: 286
  category: safe_driving_rules
  question: 赤信号で右折する前に、運転者は何をしなければなりませんか？
  choices:
    A: 停止せずに減速し、他の車両に道を譲る
    B: 横断歩道の手前で完全に停止する
    C: 曲がる前に歩行者に警告するためにクラクションを鳴らす
    D: 横断歩道に歩行者が見える場合にのみ停止する
  answer: B
  explanation: マニュアルによると、赤信号で右折する前に、運転者は横断歩道の手前で完全に停止しなければなりません。
- id: 287
  category: sharing_the_road
  question: 複数車線の道路で横断歩道の手前に停止する場合、車両をどのくらい手前で停止させるべきですか？
  choices:
    A: 横断歩道の線にぴったり合わせて
    B: 横断歩道の少なくとも5フィート手前
    C: 横断歩道の少なくとも10フィート手前
    D: 横断歩道の少なくとも20フィート手前
  answer: C
  explanation: マニュアルには、複数車線の道路で横断歩道の手前に停止する場合、隣の車線の運転者が歩行者を確認できるように、横断歩道の少なくとも10フィート手前で停止すべきであると記載されています。
- id: 288
  category: safe_driving_rules
  question: マニュアルによると、時速40マイル（40 mph）で走行中の自動車にはねられた場合の歩行者の死亡リスクはどのくらいですか？
  choices:
    A: 20%
    B: 50%
    C: 少なくとも80%
    D: 100%
  answer: C
  explanation: マニュアルには、時速40マイルで走行中の自動車に歩行者がはねられた場合、その歩行者の死亡リスクは少なくとも80%であると記されています。
- id: 289
  category: sharing_the_road
  question: ジョージア州において、自転車利用者が走行することを法的に認められていない道路は次のうちどれですか？
  choices:
    A: 複数車線の市街地の通り
    B: 田舎の2車線ハイウェイ
    C: 州間高速道路（インターステート）およびアクセス制限のある高速道路
    D: 指定の自転車レーンがない道路
  answer: C
  explanation: 自転車利用者は、州間高速道路および州間高速道路に類する高速道路（アクセス制限のある高速道路）を除き、ジョージア州のすべての道路を使用することが法的に認められています。
- id: 290
  category: sharing_the_road
  question: 自動車の運転者が自転車を追い越す際に空けなければならない、法的に定められた最小の間隔はどれくらいですか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 5フィート
    D: 6フィート
  answer: B
  explanation: マニュアルでは、自動車の運転者が自転車を追い越す際の法的な最小間隔は3フィートであると規定されています。
- id: 291
  category: penalties_and_points
  question: 自転車の追い越しおよび接近に関する法規に違反した場合の罰則は何ですか？
  choices:
    A: 初回違反に対する警告
    B: 重罪の判決および免許停止
    C: 最大250.00ドルの罰金が科せられる軽罪
    D: 500.00ドルの罰金および免許の減点3点
  answer: C
  explanation: 自転車への接近および追い越しに関する規則の違反は、最大250.00ドルの罰金が科せられる軽罪となります。
- id: 292
  category: sharing_the_road
  question: 自転車を追い越すために安全に車線変更ができない場合、速度をどのように調整しなければなりませんか？
  choices:
    A: 時速15マイルまで減速する
    B: 掲示された制限速度より少なくとも時速10マイル遅い速度、または時速25マイルのいずれか速い方まで減速する
    C: 掲示された制限速度より時速5マイル遅い速度まで減速する
    D: 自転車が移動するまで完全に停止する
  answer: B
  explanation: 車線変更が不可能、禁止、または安全でない場合は、掲示された制限速度より少なくとも時速10マイル遅い速度、または時速25マイルのいずれか速い方まで減速しなければなりません。
- id: 293
  category: safe_driving_rules
  question: 運転者が自転車専用レーンを走行したり、そこに駐車したりすることが許可されるのはどのような時ですか？
  choices:
    A: 右側から低速車両を追い越すとき
    B: 自転車がいないとき
    C: 交差点で右折するとき
    D: 運転者が自転車レーンを走行したり駐車したりすることは決して許可されない
  answer: D
  explanation: マニュアルには「運転者は自転車レーンを走行したり駐車したりしてはならない」と明記されています。自転車レーンは自転車専用です。
- id: 294
  category: defensive_driving
  question: オートバイの小さな外形は、他の運転者からの見え方にどのような影響を与えますか？
  choices:
    A: 実際よりも近く、速く走っているように見える
    B: 実際よりも遠くにあり、遅く走っているように見える
    C: 死角で見えやすくなる
    D: オートバイの速度や距離の認識には影響しない
  answer: B
  explanation: マニュアルによると、オートバイは外形が小さいため、実際よりも遠くにあり、遅く走っているように見えることがあります。
- id: 295
  category: sharing_the_road
  question: オートバイとの車線共有に関して、正しいものはどれですか？
  choices:
    A: オートバイが右端を走行している場合は、車線を共有してもよい
    B: コンパクトカーを運転している場合は、車線を共有してもよい
    C: オートバイには車線の全幅を使用する権利があり、車線を共有してはならない
    D: オートバイを追い越すときのみ、車線を共有できる
  answer: C
  explanation: オートバイは車線内を操縦するために車線の全幅を使用することが認められており、マニュアルには「車線を共有してはならない」と明記されています。
- id: 296
  category: defensive_driving
  question: 自動車とオートバイの衝突事故が最も発生しやすい場所はどこですか？
  choices:
    A: 州間高速道路上
    B: 交差点
    C: 駐車場
    D: 郊外の2車線道路
  answer: B
  explanation: マニュアルには、自動車とオートバイの衝突事故が最も発生しやすい場所は交差点であると記載されています。これは通常、自動車の運転者がオートバイに気づかないことが原因です。
- id: 297
  category: defensive_driving
  question: オートバイの方向指示器が点滅していても、実際に曲がるのを確認してから進むべきなのはなぜですか？
  choices:
    A: オートバイの方向指示器は暗すぎてはっきりと見えないことが多いため
    B: 方向指示器が自動で消えない場合があり、ライダーが消し忘れている可能性があるため
    C: オートバイのライダーは停止を示すために方向指示器を頻繁に使用するため
    D: 車両の方向指示器が点滅している間に進行することは違法であるため
  answer: B
  explanation: マニュアルは、オートバイの方向指示器が自動で消えないことがあり、ライダーが消し忘れることがあるため、点滅しているだけで判断しないよう運転者に警告しています。
- id: 298
  category: safe_driving_rules
  question: オートバイの後方を走行する際の推奨される車間距離はどれくらいですか？
  choices:
    A: 1〜2秒
    B: 2〜3秒
    C: 3〜4秒
    D: 5〜6秒
  answer: C
  explanation: オートバイの後方を走行する際は、ライダーが緊急時に操縦や停止を行うための十分な時間を確保できるよう、3〜4秒という長めの車間距離をとる必要があります。
- id: 299
  category: vehicle_information
  question: 乾燥した路面状況において、オートバイの停止能力は自動車と比較してどうですか？
  choices:
    A: 自動車はオートバイよりもはるかに素早く停止できる
    B: オートバイは自動車よりも素早く停止できる
    C: どちらの車両も全く同じ停止距離を必要とする
    D: オートバイは乾燥した路面では安全に停止できない
  answer: B
  explanation: マニュアルには、乾燥した路面状況では、オートバイは自動車よりも素早く停止できると記載されています。
- id: 300
  category: safe_driving_rules
  question: 歩道を横切って私道や路地から出る際、運転者は何をしなければなりませんか？
  choices:
    A: クラクションを鳴らし、停止せずに進む
    B: 減速し、他の自動車に対してのみ譲る
    C: 歩道の手前で停止し、歩行者が安全に通過した後にのみ進む
    D: 歩行者がすでに車両の直前にいる場合にのみ停止する
  answer: C
  explanation: 私道、路地、または駐車場に出入りする際は、歩道の手前で停止し、歩行者が安全に通過した後にのみ進まなければなりません。
- id: 301
  category: sharing_the_road
  question: スクールバスが乗客の乗り降りをさせている際、いつ停止する必要がありますか？
  choices:
    A: 道路の種類に関わらず、常に停止しなければならない。
    B: バスと同じ方向に走行している場合のみ停止しなければならない。
    C: ほとんどの場合で停止が必要だが、中央分離帯で仕切られた高速道路（ハイウェイ）の反対側を走行している場合を除く。
    D: 指定されたスクールゾーンを走行している時のみ停止しなければならない。
  answer: C
  explanation: ほとんどの場合、すべての運転者は点滅灯をつけた停車中のスクールバスに対して停止しなければなりません。例外は、中央分離帯で道路が仕切られているハイウェイで、その場合はバスと同じ方向に走行している車両のみが停止する必要があります。
- id: 302
  category: penalties_and_points
  question: ジョージア州で停車中のスクールバスを不法に追い越した場合の罰則は何ですか？
  choices:
    A: 最大500ドルの罰金
    B: 運転記録に最大6ポイントの加点
    C: 即時の車両押収
    D: 初回違反に対する警告
  answer: B
  explanation: ジョージア州における停車中のスクールバス追い越しに対する罰金と罰則には、強制的な出廷、運転記録への最大6ポイントの加点、および最大1,000ドルの罰金が含まれます。
- id: 303
  category: penalties_and_points
  question: 21歳未満の運転者が停車中のスクールバスを不法に追い越して違反が確定した場合、どのような罰則がありますか？
  choices:
    A: 免許停止
    B: 運転免許試験の強制再受験
    C: 運転記録に10ポイントの加点
    D: 社会奉仕活動のみ
  answer: A
  explanation: ジョージア州の罰金および罰則規定によると、21歳未満で停車中のスクールバスを不法に追い越して違反が確定した場合、免許停止処分となります。
- id: 304
  category: sharing_the_road
  question: 時速55マイルで走行中の荷物を満載したトラクター・トレーラーは、乗用車と比較してどのくらいの停止距離が必要ですか？
  choices:
    A: 乗用車と同じ距離
    B: 乗用車の2倍の距離
    C: 乗用車の3倍の距離
    D: 乗用車の4倍の距離
  answer: C
  explanation: 時速55マイルで走行中の荷物を満載したトラクター・トレーラーが停止するには、乗用車の3倍の距離が必要です。
- id: 305
  category: sharing_the_road
  question: 商用車と道路を共有する際、「ノー・ゾーン (No-Zone)」という用語は何を指しますか？
  choices:
    A: 駐車が禁止されている指定区域
    B: 制限速度が厳格に適用されるスクールゾーン
    C: トラックやバスの周囲にある危険なエリアや死角
    D: 商用車専用の車線
  answer: C
  explanation: 「ノー・ゾーン (No-Zone)」は、トラックやバスの周囲にある、事故が発生しやすい危険なエリアを指します。これには、自分の車が相手の運転者の視界から消えてしまう実際の死角が含まれます。
- id: 306
  category: safe_driving_rules
  question: トラックの運転席側のノー・ゾーンを走行しているかどうかは、どうすれば分かりますか？
  choices:
    A: 制限速度ちょうどで走行している。
    B: 相手のサイドミラーに運転者の顔が見えない。
    C: トラックの後方で車3台分以上の距離を空けている。
    D: 自分のバックミラーにトラックの前面全体が見える。
  answer: B
  explanation: トラックやバスの両側には大きなノー・ゾーンがあります。サイドミラーに運転者の顔が見えない場合、運転者からもあなたの姿は見えていません。
- id: 307
  category: sharing_the_road
  question: トラックやバスの右側のノー・ゾーンが特に危険なのはなぜですか？
  choices:
    A: トラックは右側の方が加速が速いため。
    B: トラックやバスの運転者は右折時に大きく膨らんで曲がる必要があるため。
    C: 右側のミラーは通常小さいため。
    D: 商用車は左車線を走行することが禁止されているため。
  answer: B
  explanation: 右側のノー・ゾーンが特に危険なのは、トラックやバスの運転者が右折する際に大きく膨らんで曲がる必要があるためです。
- id: 308
  category: defensive_driving
  question: フロント・ノー・ゾーンを避けるために、トラックやバスの前に割り込む前に何をすべきですか？
  choices:
    A: トラックよりも少なくとも時速10マイル速く走行していることを確認する。
    B: 自分のサイドミラーにトラックのヘッドライトが見えることを確認する。
    C: 自分のバックミラーにトラックやバスの前面全体が見えることを確認する。
    D: 合流する前にクラクションを鳴らして運転者に知らせる。
  answer: C
  explanation: フロント・ノー・ゾーンを避けるために、車線変更や合流をする前に、自分のバックミラーにトラックやバスの前面全体が映っていることを確認してください。
- id: 309
  category: safe_driving_rules
  question: ジョージア州のTACTプロジェクトによると、商用車の直前に無理に割り込むのを避けるために推奨される車間距離はどれくらいですか？
  choices:
    A: 時速10マイルごとに車1台分の長さ
    B: 速度に関わらず車2台分の長さ
    C: 3秒間の車間距離
    D: 常に50フィート
  answer: A
  explanation: ジョージア州のTACTプロジェクトでは、商用車の前に安全に割り込むために、時速10マイルごとに車1台分の車間距離を空けることを推奨しています。
- id: 310
  category: safe_driving_rules
  question: マニュアルによると、すべての死亡事故のうち、スピードが要因となっているのはおよそどのくらいの割合ですか？
  choices:
    A: 4分の1
    B: 3分の1
    C: 2分の1
    D: 3分の2
  answer: B
  explanation: マニュアルには、すべての死亡事故の約3分の1においてスピードが要因となっていると記載されています。
- id: 311
  category: license_system
  question: 申請時に必要な情報や正確な情報を提供しなかった場合、どのような免許の取り下げが行われますか？
  choices:
    A: 停止 (Suspension)
    B: 失効 (Revocation)
    C: 取り消し (Cancellation)
    D: 資格剥奪 (Disqualification)
  answer: C
  explanation: 運転者サービス局（DDS）は、申請時に必要な情報や正確な情報が提供されなかった場合、免許を取り消す（Cancellation）権限を持っています。
- id: 312
  category: license_system
  question: 運転免許が失効（Revocation）された場合、失効期間終了後に運転資格を回復するにはどうすればよいですか？
  choices:
    A: 新しい免許を申請する。
    B: 罰金を支払い、古い免許を返却してもらう。
    C: 免許が自動的に復帰するのを待つ。
    D: DDSに控訴状を送る。
  answer: A
  explanation: 免許が失効（Revocation）された場合、すべての運転資格が終了します。失効期間の終了後、居住者は新しい免許を申請することができます。
- id: 313
  category: license_system
  question: 商用運転免許（CDL）の資格が剥奪（Disqualified）された場合、非商用車の運転資格はどうなりますか？
  choices:
    A: 同じ期間、自動的に停止される。
    B: 永久に失効する。
    C: CDLの資格剥奪自体によって停止または失効することはない。
    D: 日中の運転のみに制限される。
  answer: C
  explanation: 商用運転資格の剥奪は、それ自体では、免許保持者の非商用自動車を運転する資格の停止または失効をもたらすものではありません。
- id: 314
  category: license_system
  question: ジョージア州において、特定の重大な違反で有罪判決を受けた場合の商用運転資格に対する最大罰則は何ですか？
  choices:
    A: 10年間の停止
    B: 商用運転資格の終身剥奪
    C: 最大10,000ドルの罰金
    D: 5年間の資格剥奪
  answer: B
  explanation: ジョージア州では、特定の違反で有罪判決を受けた場合、商用運転資格を終身（LIFE）失う可能性があります。
- id: 315
  category: sharing_the_road
  question: 点滅灯をつけたスクールバスのために停車した場合、法的に運転の再開が許可されるのはいつですか？
  choices:
    A: バスのドアが閉まったらすぐに。
    B: バスの運転手が手招きしたとき。
    C: 60秒が経過した後。
    D: バスが動き出すか、警告信号を消し、かつすべての乗客が道路からいなくなったとき。
  answer: D
  explanation: スクールバスのために停車した後、バスが動き出すか、警告信号を解除し、かつ乗降中のすべての乗客が道路からいなくなるまで、停車し続けなければなりません。
- id: 316
  category: penalties_and_points
  question: ジョージア州において、有罪判決に基づかない状況で運転資格の停止を招くものは次のうちどれですか？
  choices:
    A: 養育費の未払い
    B: 無謀運転
    C: 当て逃げ
    D: 無保険運転
  answer: A
  explanation: マニュアルによると、当局は養育費の未払いを含む、有罪判決に基づかない状況において運転資格を停止します。無謀運転、当て逃げ、無保険運転は、有罪判決に基づく停止です。
- id: 317
  category: alcohol_drugs_health
  question: ジョージア州の黙示の同意法（Implied Consent law）に基づき、州が実施する化学検査を拒否した場合の最低停止期間はどれくらいですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: B
  explanation: ジョージア州法では、州が実施する化学検査を受けることが義務付けられています。この検査を拒否した場合、ジョージア州の運転免許または運転資格は最低1年間停止されます。
- id: 318
  category: alcohol_drugs_health
  question: アルコールまたは薬物に関する規定の州化学検査を受けた後、追加の検査を受けることは許可されていますか？
  choices:
    A: いいえ、法律で追加の検査は認められていません。
    B: はい、ただし裁判官の命令がある場合に限ります。
    C: はい、自己負担で、自分が選んだ資格のある担当者から受けることができます。
    D: はい、追加検査の費用は州が負担します。
  answer: C
  explanation: マニュアルには次のように記載されています。「規定の州検査を最初に受けた後、自己負担で、自分が選んだ資格のある担当者による血液、呼気、尿、またはその他の体内物質の追加の化学検査を受ける権利があります。」
- id: 319
  category: penalties_and_points
  question: ジョージア州の運転免許は、24ヶ月以内に何ポイント累積すると停止されますか？
  choices:
    A: 10ポイント以上
    B: 12ポイント以上
    C: 15ポイント以上
    D: 21ポイント以上
  answer: C
  explanation: ジョージア州の免許は、24ヶ月以内に15ポイント以上累積した人に対して停止されます。
- id: 320
  category: penalties_and_points
  question: ジョージア州の免許保持者は、5年ごとに一度、運転記録から最大何ポイントの削減を申請できますか？
  choices:
    A: 最大3ポイント
    B: 最大5ポイント
    C: 最大7ポイント
    D: 最大10ポイント
  answer: C
  explanation: ジョージア州の免許保持者は、認定された6時間の運転改善コースを修了することで、5年ごとに一度、ジョージア州の運転免許に科されたポイントを最大7ポイント削減するようDDSに申請することができます。
- id: 321
  category: penalties_and_points
  question: 被告人が交通違反で出廷する前に、認定された6時間の安全運転講習（ディフェンシブ・ドライビング・コース）を修了した場合、裁判所は5年に1度、どのような特典を提供しなければなりませんか？
  choices:
    A: 罰金の50%減額、および違反点数の加算なし。
    B: 罰金の20%減額、および違反点数の加算なし。
    C: 召喚状（違反切符）の完全な却下。
    D: 罰金の20%減額。ただし、違反点数は加算される。
  answer: B
  explanation: 修了証の原本を裁判所に提示した場合、裁判所は科せられた罰金を20パーセント減額し、運転者に対して違反点数を加算してはならないとされています。この申し立ては5年に1度認められます。
- id: 322
  category: driver_responsibility
  question: ジョージア州の安全責任法（Safety Responsibility Law）の主な目的は何ですか？
  choices:
    A: すべての運転者に安全運転講習の受講を義務付けること。
    B: 無責任な運転者を高速道路から排除し、保険加入済みの運転者を無保険の運転者から保護すること。
    C: すべての車両が年次の安全検査に合格するようにすること。
    D: すべての車両でチャイルドシートの使用を義務付けること。
  answer: B
  explanation: マニュアルには、「この法律の目的は、ジョージア州の高速道路から無責任な運転者を排除し、保険加入済みの運転者を無保険の運転者から保護することである」と記載されています。
- id: 323
  category: penalties_and_points
  question: 運転者が特定の重大な違反について、どのくらいの期間内に3回の有罪判決を受けた場合、常習違反者（Habitual Violator）と宣告され、免許が取り消されますか？
  choices:
    A: 2年間
    B: 3年間
    C: 5年間
    D: 10年間
  answer: C
  explanation: 5年以内に、特定の違反（DUI、当て逃げ、公道レースなど）の組み合わせで3回の有罪判決を受けた場合、常習違反者（Habitual Violator）と宣告され、運転免許が取り消されます。
- id: 324
  category: penalties_and_points
  question: ジョージア州運転者サービス局（DDS）は、ジョージア州居住者による州外での交通違反の有罪判決をどのように扱いますか？
  choices:
    A: DUI（飲酒・薬物影響下運転）に関わるものでない限り、無視される。
    B: 運転記録に記載され、ジョージア州内で発生したものとして扱われる。
    C: 警告書が送られるが、違反点数は加算されない。
    D: 運転者が商用運転免許（CDL）を保持している場合にのみ記録される。
  answer: B
  explanation: 他州の免許当局または裁判所からジョージア州DDSに報告された有罪判決は、ジョージア州の免許保持者の運転記録に記載されます。当局は、そのような有罪判決を本州で発生したものとして扱います。
- id: 325
  category: license_system
  question: 次のうち、ジョージア州の運転免許が義務的に取り消される原因となるのはどれですか？
  choices:
    A: 通知を受けた後、運転技能または知識の再試験を受けることを拒否した場合。
    B: 制限速度を15マイル超えるスピード違反の切符を1回切られた場合。
    C: 30日以内に駐車違反の罰金を支払わなかった場合。
    D: 運転記録に3点の違反点数が累積した場合。
  answer: A
  explanation: ジョージア州では、再試験を要求する妥当な根拠があるという通知を受けた後、運転技能または交通ルールの知識の再試験を受けることを拒否した場合、運転免許が取り消されます。
- id: 326
  category: penalties_and_points
  question: 21歳未満の者の場合、免許停止の適用において「不争の答弁（nolo contendere）」はどのように扱われますか？
  choices:
    A: 無視される。
    B: 通常の半分の違反点数が加算される。
    C: 有罪判決とみなされる。
    D: 運転者に路上試験の再受験を義務付ける。
  answer: C
  explanation: マニュアルによると、21歳未満の者に適用される免許停止に関しては、不争の答弁（nolo contendere）は有罪判決とみなされます。
- id: 327
  category: driver_responsibility
  question: 安全責任法（Safety Responsibility Law）に基づき、衝突事故による損害賠償請求がなされた場合、免許停止を避けるにはどうすればよいですか？
  choices:
    A: 30日間、請求を無視する。
    B: 保険会社に、事故当時に賠償責任保険に加入していたことを示すSR-21フォームを提出してもらう。
    C: 車両のナンバープレートを返納する。
    D: スーパー・スピーダー（Super Speeder）料金を支払う。
  answer: B
  explanation: 安全責任法に基づく免許停止を避けるためには、事故当時に賠償責任保険でカバーされていた場合、保険会社からDDSにSR-21フォームを提出してもらうことができます。
- id: 328
  category: penalties_and_points
  question: 法律により、当局が以下のどの違反の有罪判決に対して運転免許を停止することが義務付けられていますか？
  choices:
    A: 無保険運転
    B: 制限速度を10マイル超えるスピード違反
    C: 不適切な駐車
    D: 方向指示器の使用義務違反
  answer: A
  explanation: マニュアルには、有罪判決を受けた場合に法律で免許停止が義務付けられている違反の一つとして「無保険運転」が挙げられています。
- id: 329
  category: penalties_and_points
  question: 常習違反者（Habitual Violator）と宣告された場合、いつから保護観察付き免許（Probationary License）の申請資格が得られる可能性がありますか？
  choices:
    A: 申請後すぐに
    B: 免許取り消し期間を6ヶ月務めた後
    C: 免許取り消し期間を2年間務めた後
    D: 免許取り消し期間を5年間務めた後
  answer: C
  explanation: マニュアルによると、常習違反者と宣告された場合、免許取り消し期間を2年間務めた後に、保護観察付き免許（Probationary License）の申請資格が得られる可能性があります。
- id: 330
  category: license_system
  question: 免許停止期間中に限定運転許可証（limited driving permit）を取得するための費用はいくらですか？
  choices:
    A: $20
    B: $32
    C: $50
    D: $75
  answer: B
  explanation: マニュアルには、特定の状況において、免許停止期間中に32ドルの費用で限定運転許可証を取得できる場合があると記載されています。
- id: 331
  category: penalties_and_points
  question: 限定運転免許証（Limited driving permit）は、商用車の運転に有効ですか？
  choices:
    A: はい、ただし雇用目的の場合に限ります
    B: はい、判決を下した裁判所の裁判官によって承認された場合に限ります
    C: いいえ、商用車の運転には決して有効ではありません
    D: いいえ、非危険物を輸送している場合を除きます
  answer: C
  explanation: マニュアルには、「限定運転免許証は商用車の運転には有効ではない」と明記されています。
- id: 332
  category: penalties_and_points
  question: 限定運転免許証の条件や制限に違反して有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 免許が30日間停止される
    B: 32ドルの追加手数料を支払わなければならない
    C: 元の免許停止期間がさらに6ヶ月間延長される
    D: 運転資格の永久剥奪を受ける
  answer: C
  explanation: マニュアルによると、許可条件違反で有罪判決を受けた場合、限定免許は取り消され、元の運転免許停止期間がさらに6ヶ月間延長されます。
- id: 333
  category: penalties_and_points
  question: 次の状況のうち、限定運転免許証を利用できないのはどれですか？
  choices:
    A: 初めてのDUI（薬物以外による飲酒運転）
    B: 養育費の支払い怠慢
    C: 5年以内で2回目のDUI有罪判決
    D: 累積15ポイントによる初めての免許停止
  answer: B
  explanation: マニュアルによると、「養育費の支払い怠慢」などの理由による有罪判決の場合、限定運転免許証は発行されません。
- id: 334
  category: penalties_and_points
  question: 重大な交通違反で初めて有罪判決を受けた場合、商用車の運転資格（CDL）はどのくらいの期間停止されますか？
  choices:
    A: 60日間
    B: 120日間
    C: 6ヶ月間
    D: 1年間
  answer: D
  explanation: マニュアルには、重大な交通違反で有罪判決を受けた者の商用車運転資格は、1年間停止（欠格）されると記載されています。
- id: 335
  category: alcohol_drugs_health
  question: 商用車（CMV）の運転において、血中アルコール濃度（BAC）がどのレベル以上になると重大な交通違反とみなされますか？
  choices:
    A: .02 gm.
    B: .04 gm.
    C: .06 gm.
    D: .08 gm.
  answer: B
  explanation: マニュアルでは、「BACが.04 gm.以上の状態で商用車（CMV）を運転すること」を重大な交通違反として挙げています。
- id: 336
  category: penalties_and_points
  question: 危険物標識（プラカード）を掲示した商用車（CMV）の運転中に重大な交通違反で有罪判決を受けた場合、初犯の欠格期間はどのくらいですか？
  choices:
    A: 少なくとも1年間
    B: 少なくとも2年間
    C: 少なくとも3年間
    D: 永久
  answer: C
  explanation: 危険物標識を掲示した商用車（CMV）の運転中に重大な交通違反で有罪判決を受けた場合、初犯で少なくとも3年間、商用車の運転資格が停止されます。
- id: 337
  category: penalties_and_points
  question: 別個の事案による2回目の重大な交通違反の有罪判決に対する罰則は何ですか？
  choices:
    A: 商用車運転資格の3年間の停止
    B: 商用車運転資格の5年間の停止
    C: 商用車運転資格の10年間の停止
    D: 商用車運転資格の永久剥奪
  answer: D
  explanation: マニュアルには、「これらの重大な交通違反のいずれかで、別個の事案から2回目の有罪判決を受けた場合、商用車運転資格は永久に剥奪される」と記載されています。
- id: 338
  category: safe_driving_rules
  question: 次のスピード違反のうち、「深刻な交通違反（serious traffic violation）」と定義されているのはどれですか？
  choices:
    A: 制限速度を時速5マイル以上超えるスピード違反
    B: 制限速度を時速10マイル以上超えるスピード違反
    C: 制限速度を時速15マイル以上超えるスピード違反
    D: 制限速度を時速20マイル以上超えるスピード違反
  answer: C
  explanation: マニュアルでは、「制限速度を時速15マイル以上超えるスピード違反」を深刻な交通違反と定義しています。
- id: 339
  category: alcohol_drugs_health
  question: 商用車（CMV）を使用した規制薬物の製造、流通、または密売に関わる重罪で有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 1年間の資格停止
    B: 3年間の資格停止
    C: 5年間の資格停止
    D: 永久剥奪
  answer: D
  explanation: 商用車（CMV）を使用した規制薬物やマリファナの製造、配布、密売、または所持に関わる重罪の判決は、商用車運転資格の永久剥奪につながります。
- id: 340
  category: penalties_and_points
  question: 運行停止命令（out-of-service order）違反の初犯に対する欠格期間はどのくらいですか？
  choices:
    A: 30日から60日
    B: 60日から120日
    C: 180日以上1年以内
    D: 2年以上5年以内
  answer: C
  explanation: 運行停止命令に違反した場合、初犯では180日以上1年以内の期間、運転資格が停止されます。
- id: 341
  category: license_system
  question: 限定運転免許証（limited driving permit）が交付されている場合、運転が認められる理由として正しいものはどれですか？
  choices:
    A: レクリエーション公園に行くため
    B: 在籍している大学の授業に出席するため
    C: 友人や親戚を訪問するため
    D: 一般的な家事の用事を済ませるため
  answer: B
  explanation: 限定運転免許証では、雇用や医療目的のほか、「学生として在籍している大学や学校の授業に出席すること」など、特定の不可欠な活動のための運転が許可されます。
- id: 342
  category: penalties_and_points
  question: 商用自動車（CMV）の運転中に初めて踏切通過違反を犯した場合、資格停止期間はどのくらいですか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 1年間
  answer: B
  explanation: マニュアルによると、商用自動車（CMV）の運転中に踏切通過違反で有罪判決を受けた場合、初犯の資格停止期間は60日間となります。
- id: 343
  category: driver_responsibility
  question: 事故後、どのような状況において直ちに最寄りの警察機関に通報しなければなりませんか？
  choices:
    A: 死亡者が出た場合、または複数の車両が関与している場合のみ。
    B: 負傷者や死亡者が出た場合、または物損額が500.00ドルを超える場合。
    C: 物損額が1,000.00ドルを超える場合。
    D: 事故が州間高速道路上で発生した場合のみ。
  answer: B
  explanation: マニュアルには、負傷者や死亡者が出た場合、または物損額が500.00ドルを超える場合は、直ちに最寄りの警察機関に通報しなければならないと記載されています。
- id: 344
  category: driver_responsibility
  question: 無人の車両に衝突し損傷を与えた場合、何が必要ですか？
  choices:
    A: 所有者が戻るまで車両のそばで待つ。
    B: 目に見える損傷がない場合は、直ちに現場を離れる。
    C: 所有者を探し出すか、所有者が見つけられるような目立つ場所に自分の情報を残す。
    D: レッカー車を呼び、その無人車両を道路から撤去する。
  answer: C
  explanation: 無人の車両に損傷を与えた場合は、所有者を探し出すか、自分の氏名、住所、および運転していた車両の所有者の氏名を、目立つ場所に残さなければなりません。
- id: 345
  category: safe_driving_rules
  question: 事故に遭った際、接近してくる運転者にどのように警告すべきですか？
  choices:
    A: 道路の真ん中に立ち、腕を振る。
    B: ハザードランプを点灯させ、利用可能な場合は反射板（三角表示板）を使用する。
    C: 対向車に対して継続的にハイビームを点滅させる。
    D: 救急サービスが到着するまで継続的にクラクションを鳴らす。
  answer: B
  explanation: 安全を脅かすことなく接近する運転者に警告するために、可能であればハザードランプを点灯させ、利用可能な場合は反射板（三角表示板）を使用する必要があります。
- id: 346
  category: driver_responsibility
  question: 事故現場で負傷者を救護する際、負傷者を動かしたり持ち上げたりすべきなのはどのような時ですか？
  choices:
    A: 損傷した車両から救出するために、直ちに行う。
    B: どうしても必要な場合に限る。
    C: 負傷者が背中や首の痛みを訴えた時はいつでも行う。
    D: 負傷者から動かしてほしいと明確に頼まれた場合のみ。
  answer: B
  explanation: 不慣れな取り扱いは、さらなる深刻な負傷を招く恐れがあります。マニュアルでは、どうしても必要な場合を除き、負傷者を動かしたり持ち上げたりしないようアドバイスしています。
- id: 347
  category: driver_responsibility
  question: 事故の負傷者のひどい出血を止めるには、どのように試みるべきですか？
  choices:
    A: 傷口より上の位置で止血帯をきつく締める。
    B: 負傷者の足を高くし、飲み水を与える。
    C: できるだけ清潔な厚手の布パッドを当て、手で圧迫する。
    D: ボトル入りの水で傷口を徹底的に洗う。
  answer: C
  explanation: マニュアルでは、ひどい出血を止めるには、できるだけ清潔な厚手の布パッドを当て、手で圧迫するように指示しています。
- id: 348
  category: driver_responsibility
  question: ジョージア州の「善きサマリア人の法（Good Samaritan Law）」はどのような保護を提供しますか？
  choices:
    A: すべての運転者に救急箱の車載を義務付ける。
    B: 応急処置を行ったことによって生じた民事上の損害賠償責任を免除する。
    C: 運転者は負傷者を最寄りの病院まで搬送しなければならないと規定する。
    D: 事故現場で救護を行った者に対して金銭的な補償を提供する。
  answer: B
  explanation: ジョージア州には善きサマリア人の法があり、応急処置を行う際に行われた作為または不作為の結果として生じる民事上の損害賠償について、いかなる人にも責任を問わないとしています。
- id: 349
  category: safe_driving_rules
  question: 多車線道路において、事故後に車両を路上から移動させる義務があるのはどのような場合ですか？
  choices:
    A: 明らかな重大な負傷や死亡がなく、車両が通常通り安全に走行できる場合。
    B: 警察が到着し、現場の写真を撮り終えた後のみ。
    C: 物損額が500ドル未満と推定される場合はいつでも。
    D: レッカー車が到着するまで車両を移動させてはならない。
  answer: A
  explanation: 明らかな重大な負傷や死亡がなく、車両が通常通り正常に走行できる場合は、車両を安全な場所に移動させることが運転者の義務です。
- id: 350
  category: driver_responsibility
  question: 高速道路での軽微な事故の後、車両を安全な場所に移動させた場合、あなたはどうなりますか？
  choices:
    A: 自動的にその事故の過失があるとみなされる。
    B: 警察への書面による報告書を提出する権利を失う。
    C: 停車および情報提供の義務を怠ったとして告発される可能性がある。
    D: 単に車両を移動させたという理由だけで過失があるとみなされることはない。
  answer: D
  explanation: 車両を移動させる措置をとった運転者は、単に車両を移動させたという理由だけで過失があるとみなされることはなく、また書面による報告書を提出する能力に影響することもありません。
- id: 351
  category: defensive_driving
  question: シカが車の前を横切った場合、どうすべきですか？
  choices:
    A: シカが進行方向を変える前に、加速して素早く通り過ぎる。
    B: 減速する。シカは通常群れで移動するため、別のシカが続いている可能性がある。
    C: 動物との衝突を避けるため、対向車線に急ハンドルを切る。
    D: シカが周囲をよりよく見通せるように、ヘッドライトを消す。
  answer: B
  explanation: シカが車の前を横切ったときは、常に減速してください。シカは通常群れで移動するため、すぐ後ろに別のシカが続いている可能性が高いです。
- id: 352
  category: defensive_driving
  question: 夜間に路肩でシカを見つけた場合、ヘッドライトに関してどのような行動をとるべきですか？
  choices:
    A: シカをよりはっきりと見るために、ハイビームに切り替える。
    B: シカの横を通り過ぎるまで、ヘッドライトを完全に消す。
    C: ヘッドライトを点滅させ、シカの目をくらませないようにロービームに切り替える。
    D: ハイビームのままにし、クラクションを鳴らし続ける。
  answer: C
  explanation: 夜間に道路上や路肩でシカを見つけた場合、運転者は直ちに減速し、ヘッドライトを点滅させ、シカの目をくらませないようにロービーム（すれ違い用前照灯）に切り替える必要があります。
- id: 353
  category: defensive_driving
  question: 道路上のシカを避けるために、決して急ハンドルを切ってはいけないのはなぜですか？
  choices:
    A: ジョージア州の田舎道で急ハンドルを切ることは違法だから。
    B: 他の車両に衝突したり、道路から逸脱したりして、より大きな被害をもたらす可能性があるから。
    C: シカは本能的に、急ハンドルを切る車両に惹きつけられるから。
    D: 急ハンドルを切ると、自動的に車両のエアバッグが作動するから。
  answer: B
  explanation: シカを避けるために急ハンドルを切ってはいけません。この行動により、他の車両に衝突したり、道路から逸脱したりして、より大きな被害や重大な負傷を招く恐れがあります。
- id: 354
  category: defensive_driving
  question: 繁殖期のピークにより、シカが最も活発になるのは何月ですか？
  choices:
    A: 1月、2月、3月
    B: 4月、5月、6月
    C: 7月、8月、9月
    D: 10月、11月、12月
  answer: D
  explanation: シカは繁殖期のピークである10月、11月、12月の秋の時期に最も活発になります。
- id: 355
  category: defensive_driving
  question: 通常、シカが路肩で見かけられるのは一日のうちのどの時間帯ですか？
  choices:
    A: 日中のみ。
    B: 早朝と夕方遅く。
    C: 午前0時から午前3時の間のみ。
    D: 午後のラッシュアワーの時間帯のみ。
  answer: B
  explanation: シカは通常、早朝や夕方遅くの時間帯に路肩で見かけられます。
- id: 356
  category: driver_responsibility
  question: 衝突事故の後、相手の運転者と交換することが義務付けられている情報は次のうちどれですか？
  choices:
    A: 氏名、住所、ナンバープレート番号、および運転免許証番号。
    B: 氏名、電話番号、保険の補償限度額、および車両識別番号 (VIN)。
    C: 住所、社会保障番号、およびナンバープレート番号。
    D: 運転免許証番号、生年月日、および車両のメーカーとモデル。
  answer: A
  explanation: 衝突事故に巻き込まれた場合、自分の氏名、住所、ナンバープレート番号、および運転免許証番号を他の当事者に提示し、相手からも同様の情報を得る必要があります。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 減速して注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通状況と歩行者を確認してください。
  id: 357
- image: yield.png
  category: signs_and_signals
  question: この標識に従って、あなたは何をする必要がありますか？
  choices:
    A: 完全に停止する
    B: 加速して交通流に合流する
    C: 減速し、他の車両や歩行者に優先権（右側通行権）を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、減速して他の車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 358
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路に進入してはならない
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路で見られ、進入すると対向車の進路に入ることになります。
  id: 359
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけた場合、どうすべきですか？
  choices:
    A: Uターンをする
    B: 注意して運転を続ける
    C: 停止して後退するか向きを変える — あなたは逆走しています
    D: 加速して速やかにそのエリアから離れる
  answer: C
  explanation: 赤と白の「WRONG WAY（逆走）」標識は、一方通行の道路や高速道路のランプを交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
  id: 360
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 一方通行（左方向）
    C: 中央分離帯の左側を通行すること
    D: 左側に高速道路の出口あり
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、その道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 361
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所での転回（Uターン）が禁止されていることを意味します。
  id: 362
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 363
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 転回（Uターン）禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、その場所での右折が禁止されていることを意味します。
  id: 364
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道幅が狭くなる
    B: この区間内での追い越し禁止
    C: この先、対面通行
    D: 右側通行
  answer: B
  explanation: 「NO PASSING ZONE（追い越し禁止区間）」と書かれた白黒のペナント型（三角形）の標識は、そのエリアで他の車両を追い越すことが禁止されていることを意味します。これは追い越し禁止区間の始まりを示します。
  id: 365
- image: keep_right.png
  category: signs_and_signals
  question: この標識はドライバーに何を指示していますか？
  choices:
    A: 右側に合流すること
    B: 右折専用
    C: 分離帯や障害物の右側を通行すること
    D: この先、右車線終了
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 366
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。速度制限標識は、理想的な条件下におけるそのエリアの法定最高速度を示します。
  id: 367
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園またはサファリパークあり
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟区域
    D: 近くに野生動物保護区あり
  answer: B
  explanation: 鹿のシルエットが描かれた黄色のひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 368
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、スクールゾーン
    B: この先、歩行者横断あり
    C: 近くにハイキングコースあり
    D: この先、バス停あり
  answer: B
  explanation: 歩行者の姿が描かれた黄色のひし形の標識は、この先に歩行者横断歩道があることを警告しています。道路を横断する歩行者のために停止できるよう準備してください。
  id: 369
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 370
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い円形の標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウト（環状交差点）がある
    B: 病院地帯
    C: この先に踏切がある
    D: 追い越し禁止区間
  answer: C
  explanation: 黒い「X」と2つの「R」が描かれた黄色い円形の標識は、この先に踏切があることを知らせる事前警告標識です。速度を落とし、列車の音や姿を確認してください。
  id: 371
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスカット標識（踏切標識）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 372
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先で行き止まり
    B: 右折必須
    C: この先に右カーブがある
    D: この先に回り道がある
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 373
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: 大幅な減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度の急な矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 374
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に1つのカーブがある
    C: 反対方向への2つの連続するカーブ
    D: この先にラウンドアバウトがある
  answer: C
  explanation: 背向（はいこう）カーブの標識は、この先に反対方向への2つのカーブがあることを警告しています。速度を落とし、道路が一方に曲がった後、すぐにもう一方へ曲がることに備えてください。
  id: 375
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブや曲がり角がある
    D: この先に坂道がある
  answer: C
  explanation: 「屈曲あり（ワインディングロード）」の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、道路状況の変化に注意してください。
  id: 376
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの交通の合流
    C: 分離高速道路の始まり
    D: 道路が1車線に狭まること
  answer: B
  explanation: 黄色いひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  id: 377
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に橋がある
    B: この先で道幅が狭くなる
    C: 車線の終了
    D: 分離高速道路の終了
  answer: B
  explanation: この警告標識は、この先の道幅が狭くなることを示しています。道幅が狭くなることに備え、車線内の位置を調整してください。
  id: 378
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 分離高速道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって対向車線と分離された高速道路（ディバイデッド・ハイウェイ）になることを警告しています。右側を通行してください。
  id: 379
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 分離高速道路の始まり
    B: 分離高速道路が終了し、対面通行が再開される
    C: この先に合流地点がある
    D: この先に道路工事がある
  answer: B
  explanation: この標識は、分離高速道路が終了することを警告しています。対向車線が中央分離帯で区切られなくなります。対面通行に備えてください。
  id: 380
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 分離高速道路の起点
    B: この先に追い越し区間あり
    C: この先対面通行 — 車両が両方向に通行します
    D: この先に車線変更あり
  answer: C
  explanation: この標識はこの先が対面通行であることを警告しています。一方通行の道路や分離高速道路から出て、反対方向から来る車両と遭遇する可能性があります。
  id: 381
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状態を警告していますか？
  choices:
    A: 路面の凍結
    B: 濡れると滑りやすい路面
    C: この先に曲がりくねった道あり
    D: 路面の凹凸
  answer: B
  explanation: 「スリップ注意（濡れると滑りやすい）」の標識は、雨や濡れた状態で路面が非常に滑りやすくなる可能性があることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 382
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 路面の隆起
    B: 路面の凹凸
    C: この先に急な坂道または勾配あり
    D: 道路工事
  answer: C
  explanation: この標識はこの先に急な坂道や勾配があることを警告しています。特にトラックや牽引中の場合は、速度を調整し、低いギアにシフトする必要があるかもしれません。
  id: 383
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先に一時停止の標識あり
    B: この先に信号機あり
    C: 通学路の横断歩道
    D: 検問所
  answer: B
  explanation: この標識はこの先に信号機があることを警告しています。赤信号や黄信号の場合に停止できるよう準備してください。この標識は、遠くから信号機が見えにくい場所に設置されることが多いです。
  id: 384
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 「譲れ」の標識
    B: 信号機
    C: 一時停止が必要な「止まれ」の標識
    D: スピードバンプ（減速帯）
  answer: C
  explanation: この標識はこの先に一時停止の標識があることを警告しています。減速を開始し、一時停止の標識で完全に停止できるよう準備してください。
  id: 385
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に踏切あり
    B: この先に十字路または交差点あり
    C: この先に病院あり
    D: 歩行者用横断歩道
  answer: B
  explanation: この標識はこの先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 386
- image: side_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に丁字路あり
    B: 右側から合流する脇道あり
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は右側から脇道が合流していることを警告しています。脇道から幹線道路に進入してくる車両に注意してください。
  id: 387
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線合流
    B: 車線減少
    C: 新しい車線が追加される — 合流の必要なし
    D: 右折必須
  answer: C
  explanation: 「付加車線」の標識は、合流を必要とせずに新しい車線が道路に加わることを意味します。ランプ（接続路）から進入する車両には、専用の新しい車線が用意されています。
  id: 388
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時の停車も禁止
    B: この区域での駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止」標識は、この区域に車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは許可される場合があります。
  id: 389
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転手
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースを示しています。有効な障害者用駐車許可証またはライセンスプレート（ナンバープレート）を掲示している車両のみが、これらのスペースに駐車できます。違反には高額の罰金が科せられます。
  id: 390
