    D: 車両登録が自動的にキャンセルされるため。
  answer: A
  explanation: マニュアルには、「DDSからの郵便物は、米国郵便公社（USPS）によって新住所へ転送されることはありません」と記されています。
- id: 95
  category: license_system
  question: 結婚やその他の法的措置により氏名を変更した場合、正しい氏名が記載された新しい免許証を何日以内に取得しなければなりませんか？
  choices:
    A: 15日
    B: 30日
    C: 60日
    D: 120日
  answer: C
  explanation: マニュアルによると、「結婚やその他の法的措置により氏名を変更した場合は、60日以内に正しい氏名が記載された新しい免許証を取得しなければなりません」とされています。
- id: 96
  category: license_system
  question: 現在の免許有効期間内に初めて氏名変更による免許証の再発行を行う場合、費用はいくらかかりますか？
  choices:
    A: $5.00
    B: $10.00
