  choices:
    A: DS-318フォーム
    B: 死亡証明書とDD-214フォーム
    C: 公認の車両運転記録（Motor Vehicle Report）
    D: 他州の有効な運転免許証
  answer: B
  explanation: 未婚の生存配偶者の場合、資格証明書を取得するために、死亡証明書とDD-214フォームを州退役軍人サービス局（State Department
    of Veterans Service）に提出する必要があります。
- id: 71
  category: license_system
  question: 18歳未満のドライバーが、他州の有効な免許証をジョージア州のものに切り替える前に満たすべき追加要件は何ですか？
  choices:
    A: 外国パスポートの返納
    B: 学校への在籍証明、運転者教育、およびADAP（アルコール・薬物意識向上プログラム）の受講
    C: 以前の学校からの推薦状
    D: 警察官の署名がある50時間の運転記録ログ
  answer: B
  explanation: 18歳未満の場合、他州の免許証を移管する前に、学校への在籍、運転者教育、ADAPなど、ジョージア州のすべての要件を満たす必要があります。
- id: 72
  category: driver_testing
  question: 路上実技試験（Road Skills Test）はどのように受けることができますか？
  choices:
    A: 火曜日に直接会場に行く
    B: 予約制のみ
    C: 紙の申請書を郵送する
    D: 通常の営業時間内であればいつでも可能
  answer: B
  explanation: 路上実技試験は、リソースを最大限に活用し、顧客に効率的にサービスを提供するために、予約制のみで実施されています。
- id: 73
  category: vehicle_information
  question: 路上試験において、先進運転支援システム（ADAS）を搭載した車両を使用することは許可されていますか？
  choices:
    A: いいえ、これらの車両の使用は厳格に禁止されています。
    B: はい。ただし、そのような技術を使用せずに車両を操作する能力を証明しなければなりません。
    C: はい。また、その技術に完全に従事することが推奨されます。
    D: 商用免許の試験を受ける場合のみ許可されます。
  answer: B
  explanation: 受験者は先進運転支援技術を搭載した車両で実技試験を受けることができます。ただし、受験者はそのような技術に頼らずに車両を操作する能力を示さなければなりません。
- id: 74
  category: safe_driving_rules
  question: 路上試験の縦列駐車において、車を縁石にどのくらい近づける必要がありますか？
  choices:
    A: 12インチ（約30cm）以内
    B: 18インチ（約45cm）以内
    C: 24インチ（約60cm）以内
    D: 縁石に接触させる
  answer: B
  explanation: 2つのポールの間に駐車し、車が縁石から18インチ（約45cm）以内になるようにしなければなりません。
- id: 75
  category: safe_driving_rules
  question: 路上試験で直線後退（バック）を行う際、出すべき最高速度はどれくらいですか？
  choices:
    A: 時速5マイル
    B: 時速10マイル
    C: 時速15マイル
    D: 時速20マイル
  answer: B
  explanation: 約50フィート（約15メートル）の距離を、低速（時速10マイル以下）で後退させる必要があります。
- id: 76
  category: driver_testing
  question: バーチャル路上試験（Virtual Road Test）中、試験車両に同乗者として乗らなければならないのは誰ですか？
  choices:
    A: DDSの試験官
    B: 18歳以上の有効な免許を持つドライバー
    C: 有効な運転免許証を持つ、親、保護者、または21歳以上の責任ある成人
    D: バーチャル試験中は同乗者は認められない
  answer: C
  explanation: バーチャル路上試験では、親、保護者、または21歳以上の責任ある成人が同乗者として車両に乗る必要があります。その同乗者は有効な運転免許証を所持していなければなりません。
- id: 77
  category: driver_testing
  question: クラスCまたはDの路上試験に合格するために必要な最低スコアは何点ですか？
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: B
  explanation: クラスC/Dの路上試験に合格するには、最低75%のスコアを獲得する必要があります。
- id: 78
  category: driver_testing
  question: クラスCまたはDの知識試験または路上試験のいずれかの部分に2回目に不合格となった場合、再受験までどのくらいの期間待つ必要がありますか？
  choices:
    A: 翌日まで
    B: 3日間
    C: 7日間
    D: 14日間
  answer: C
  explanation: 2回目以降の不合格の場合、不合格となった部分を再受験するまでに7日間待機する必要があります。
- id: 79
  category: driver_testing
  question: どのような天候条件下では、モーターサイクル（クラスM）の路上試験は実施されませんか？
  choices:
    A: 曇りのとき
    B: 気温が50度（華氏）を下回るとき
    C: 雨が降っているとき、または路面が濡れているとき
    D: 風速が時速10マイルを超えるとき
  answer: C
  explanation: 雨天時や路面が濡れている場合など、運転者や試験官にとって安全でない天候条件では、モーターサイクルの路上試験は実施できません。
- id: 80
  category: license_system
  question: クラスEまたはFの非商用免許を取得するために必要な運転試験は何ですか？
  choices:
    A: 商用車による従来の路上試験
    B: バーチャル路上試験のみ
    C: クローズドコースでの実技試験
    D: クラスEおよびF非商用免許に運転試験はありません
  answer: D
  explanation: クラスEおよびF非商用免許には運転実技試験はありません。ただし、申請書を提出し、車両を操作する能力を証明し、知識試験（学科試験）に合格する必要があります。
- id: 81
  category: driver_testing
  question: レンタカーで路上試験を受ける場合、次の条件のうちどれを満たす必要がありますか？
  choices:
    A: レンタカー契約書に運転者として記載されていること。
    B: レンタカーがマニュアル車であること。
    C: 車両を少なくとも7日間レンタルすること。
    D: レンタカーにディーラーの仮ナンバーが付いていること。
  answer: A
  explanation: レンタカーを使用するには、レンタカー契約書のコピーを提出し、契約書に運転者として記載されており、その車両の有効な保険証明を提示する必要があります。
- id: 82
  category: safe_driving_rules
  question: 路上試験中、どのように正しい姿勢を保つべきですか？
  choices:
    A: リラックスするために窓に肘を置く。
    B: 両手をハンドルに置いておく。
    C: 片手をハンドルに、もう片方をシフトレバーに置く。
    D: 背もたれに寄りかかり、試験官と会話をする。
  answer: B
  explanation: 正しい姿勢を保つとは、両手をハンドルに置いておくことを意味します。窓に肘を置いたり、試験官と会話を続けようとしたりしないでください。
- id: 83
  category: driver_testing
  question: マニュアルによると、DDSカスタマーサービスセンターを直接訪問するのに最適な時間はいつですか？
  choices:
    A: 火曜日の午前中
    B: 月曜日の午後
    C: 週の中盤の日中
    D: 金曜日の閉店直前
  answer: C
  explanation: 火曜日は常に最も混雑する日であり、直接訪問するのに最適な時間は週の中盤の日中であることを覚えておいてください。
- id: 84
  category: license_system
  question: ボランティア消防士の場合、クラスEまたはFの非商用免許の費用はいくらですか？
