- id: 85
  category: driver_testing
  question: クラスCまたはDの知識試験に初めて不合格になった場合、いつ再受験できますか？
  choices:
    A: すぐに
    B: 翌日
    C: 3日後
    D: 7日後
  answer: B
  explanation: 1回目の不合格の場合：不合格となった科目を再受験するには、翌日まで待つ必要があります。
- id: 86
  category: license_system
  question: 次のグループのうち、ジョージア州の運転免許証を郵送で更新できるのはどれですか？
  choices:
    A: 現在ジョージア州に居住しているすべての人
    B: ジョージア州外の学校に通うフルタイムの学生
    C: 免許の有効期限が切れて3年経つ運転者
    D: 法的な氏名を変更する必要がある顧客
  answer: B
  explanation: マニュアルによると、郵送による更新は、ジョージア州外の学校に通うフルタイムの学生、その配偶者、および同居する扶養家族が利用できます。
- id: 87
  category: license_system
  question: 運転免許証の有効期限が少なくとも何年以上切れている場合、郵送で更新することはできませんか？
  choices:
    A: 1年
    B: 2年
    C: 3年
    D: 5年
  answer: B
  explanation: マニュアルには、有効期限が2年以上切れている運転免許証は郵送で更新できないと記載されています。
- id: 88
  category: license_system
  question: 運転免許証を郵送で更新することを選択した顧客に対する制限事項は何ですか？
  choices:
    A: リアルID（Real ID）を受け取ることができない。
    B: 標準の更新料の2倍を支払わなければならない。
    C: 4年間有効な免許証しか受け取れない。
    D: ジョージア州に戻った際に筆記試験を受けなければならない。
  answer: A
  explanation: マニュアルには、「この方法で免許を更新することを選択した顧客は、RealDL/IDを受け取ることはできません」と明記されています。
- id: 89
  category: license_system
  question: 更新手続き中に、現在の運転免許証番号が社会保障番号（SSN）と同一である場合、どうなりますか？
  choices:
    A: 新しい社会保障番号を申請しなければならない。
    B: ランダムに生成された書類番号が書類に割り当てられる。
    C: 同じ番号を保持することが求められる。
    D: 免許が一時的に停止される。
  answer: B
  explanation: 社会保障番号を書類番号として免許証を発行することはできません。もし同一である場合は、発行または更新の手続き中に、ランダムに生成された書類番号が割り当てられます。
- id: 90
  category: driver_responsibility
  question: DDSを通じて有権者登録を行うことを選択し、30日以内に有権者登録証が届かない場合、どこに連絡すべきですか？
  choices:
    A: 運転者サービス局（DDS）
    B: ジョージア州パトロール隊
    C: 居住する郡の有権者登録事務所
    D: 連邦選挙委員会
  answer: C
  explanation: マニュアルでは次のようにアドバイスしています。「30日以内に有権者登録証が届かない場合は、居住する郡の有権者登録事務所に連絡して、申請状況を確認してください。」
- id: 91
  category: license_system
  question: 紛失または盗難にあった運転免許証を、オンラインまたはDDSカスタマーサービスセンターで再発行する際の手数料はいくらですか？
  choices:
    A: $5.00
    B: $10.00
