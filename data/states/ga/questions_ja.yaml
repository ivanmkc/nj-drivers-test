  choices:
    A: DS-318フォーム
    B: 死亡証明書とDD-214
    C: 公認の運転経歴証明書（Motor Vehicle Report）
    D: 有効な他州の運転免許証
  answer: B
  explanation: 未婚の生存配偶者の場合、資格証明書を取得するために、死亡証明書とDD-214を州退役軍人サービス局（State Department
    of Veterans Service）に提出する必要があります。
- id: 71
  category: license_system
  question: 18歳未満のドライバーが、他州の有効な免許証をジョージア州のものに切り替える（移管する）前に満たすべき追加要件は何ですか？
  choices:
    A: 外国パスポートの返納
    B: 学校への在籍証明、運転者教育、およびADAP
    C: 以前の学校からの推薦状
    D: 警察官の署名がある50時間の走行記録
  answer: B
  explanation: 18歳未満の場合、他州の免許証を切り替える前に、学校への在籍証明、運転者教育、ADAP（アルコール・ドラッグ意識プログラム）を含むジョージア州のすべての要件を満たす必要があります。
- id: 72
  category: driver_testing
  question: 実地試験（Road Skills Test）はどのように受けることができますか？
  choices:
    A: 火曜日に直接会場に行く
    B: 予約制のみ
    C: 申請書を郵送する
    D: 通常の営業時間内であればいつでも
  answer: B
  explanation: 実地試験は、リソースを最大限に活用し、顧客に効率的に対応するため、予約制のみで実施されています。
- id: 73
  category: vehicle_information
  question: 実地試験において、先進運転支援システム（ADAS）を搭載した車両を使用することは許可されていますか？
  choices:
    A: いいえ、これらの車両の使用は厳格に禁止されています。
    B: はい。ただし、そのような技術を使用せずに車両を操作する能力を証明しなければなりません。
    C: はい。また、その技術に完全に従うことが推奨されます。
    D: 商用免許の試験を受ける場合のみ許可されます。
  answer: B
  explanation: 受験者は先進運転支援技術を搭載した車両で実地試験を受けることができます。ただし、申請者はそのような技術を使用せずに車両を操作する能力を証明する必要があります。
- id: 74
  category: safe_driving_rules
  question: 実地試験の縦列駐車において、車両を縁石からどのくらいの距離以内に近づける必要がありますか？
  choices:
    A: 12インチ以内
    B: 18インチ以内
    C: 24インチ以内
    D: 縁石に接触させる
  answer: B
  explanation: 2つの標識の中間に、車両が縁石から18インチ（約45cm）以内になるように駐車しなければなりません。
- id: 75
  category: safe_driving_rules
  question: 実地試験の直線後退（バック）において、出すべき最大速度はどれくらいですか？
  choices:
    A: 時速5マイル
    B: 時速10マイル
    C: 時速15マイル
    D: 時速20マイル
  answer: B
  explanation: 約50フィートの距離を、低速（時速10マイル以下）で後退させる必要があります。
- id: 76
  category: driver_testing
  question: バーチャル実地試験（Virtual Road Test）中、試験車両に同乗者として乗らなければならないのは誰ですか？
  choices:
    A: DDSの試験官
    B: 18歳以上の有効な免許を持つドライバー
    C: 有効な運転免許証を所持する、親、保護者、または21歳以上の責任ある成人
    D: バーチャル試験中は同乗者は認められない
  answer: C
  explanation: バーチャル実地試験では、有効な運転免許証を所持する親、保護者、または21歳以上の責任ある成人が試験車両に同乗しなければなりません。
- id: 77
  category: driver_testing
  question: クラスCまたはDの実地試験に合格するために必要な最低スコアは何点ですか？
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: B
  explanation: クラスC/Dの実地試験に合格するには、最低75%のスコアを獲得する必要があります。
- id: 78
  category: driver_testing
  question: クラスCまたはDの知識試験（学科）または実地試験のいずれかのパートで2回目の不合格となった場合、再受験までどのくらいの期間待つ必要がありますか？
  choices:
    A: 翌日まで
    B: 3日間
    C: 7日間
    D: 14日間
  answer: C
  explanation: 2回目以降の不合格の場合、不合格となったパートを再受験するまでに7日間待つ必要があります。
- id: 79
  category: driver_testing
  question: どのような天候条件下では、モーターサイクル（クラスM）の実地試験は実施されませんか？
  choices:
    A: 曇りのとき
    B: 気温が華氏50度を下回るとき
    C: 雨が降っているとき、または路面が濡れているとき
    D: 風速が時速10マイルを超えるとき
  answer: C
  explanation: 雨天時や路面が濡れている場合など、運転者や試験官にとって安全でないと判断される天候条件下では、モーターサイクルの実地試験は実施できません。
- id: 80
  category: license_system
  question: 非商用クラスEまたはFの免許を取得するために必要な運転試験は何ですか？
  choices:
    A: 商用車による従来の実地試験
    B: バーチャル実地試験のみ
    C: クローズドコースでの技能試験
    D: 非商用クラスEおよびFには運転試験はありません
  answer: D
  explanation: 非商用クラスEおよびFには運転試験はありません。ただし、申請書を提出し、車両を操作する能力を証明し、知識試験（学科）に合格する必要があります。
- id: 81
  category: driver_testing
  question: レンタカーで路上試験を受けることを選択した場合、次のどの条件を満たす必要がありますか？
  choices:
    A: レンタカー契約書に運転者として名前が記載されている必要があります。
    B: レンタカーはマニュアル車（MT車）である必要があります。
    C: 少なくとも7日間車両をレンタルする必要があります。
    D: レンタカーにはディーラーの一時的なタグが付いている必要があります。
  answer: A
  explanation: レンタカーを使用するには、レンタカー契約書のコピーを提出し、契約書に運転者として記載されており、かつその車両の有効な保険証明を提示する必要があります。
- id: 82
  category: safe_driving_rules
  question: 路上試験中、どのように正しい姿勢を保つべきですか？
  choices:
    A: リラックスするために、窓に肘を置く。
    B: 両手をハンドルに置いておく。
    C: 片手をハンドルに、もう片方の手をシフトレバーに置く。
    D: 背もたれに寄りかかり、試験官と会話をする。
  answer: B
  explanation: 「正しい姿勢を保つ」とは、両手をハンドル（ステアリングホイール）に置いておくことを意味します。窓に肘を置いたり、試験官と会話を続けようとしたりしないでください。
- id: 83
  category: driver_testing
  question: マニュアルによると、DDSカスタマーサービスセンターを直接訪問するのに最適な時期はいつですか？
  choices:
    A: 火曜日の午前中
    B: 月曜日の午後
    C: 週の中頃の日中
    D: 金曜日の閉店直前
  answer: C
  explanation: 火曜日は常に最も混雑する日であり、直接訪問するのに最適な時間は週の中頃の日中であることを覚えておいてください。
- id: 84
  category: license_system
  question: ボランティア消防士の場合、クラスEまたはFの非商用免許の費用はいくらですか？
  choices:
    A: $10
    B: $25
    C: $50
    D: 無料
  answer: D
  explanation: クラスEおよびFの免許は、ボランティア消防士に対して無料で提供されます。
- id: 85
  category: driver_testing
  question: クラスCまたはDの知識試験（学科試験）に初めて不合格になった場合、いつ再受験できますか？
  choices:
    A: 直ちに
    B: 翌日
    C: 3日後
    D: 7日後
  answer: B
  explanation: 1回目の不合格の場合：不合格となった科目を再受験するには、翌日まで待つ必要があります。
- id: 86
  category: license_system
  question: ジョージア州の運転免許証を郵送で更新できるのは、次のどのグループですか？
  choices:
    A: 現在ジョージア州内に居住しているすべての人
    B: ジョージア州外の学校に通うフルタイムの学生
    C: 免許の有効期限が切れてから3年が経過している運転者
    D: 法的氏名の変更が必要な顧客
  answer: B
  explanation: マニュアルによると、郵送による更新は、ジョージア州外の学校に通うフルタイムの学生、その配偶者、および同居する扶養家族が利用できます。
- id: 87
  category: license_system
  question: 運転免許証の有効期限が切れてから少なくとも何年以上経過すると、郵送での更新ができなくなりますか？
  choices:
    A: 1年
    B: 2年
    C: 3年
    D: 5年
  answer: B
  explanation: マニュアルには、有効期限が2年以上切れている運転免許証は郵送で更新できないと記載されています。
- id: 88
  category: license_system
  question: 運転免許証を郵送で更新することを選択した顧客に対する制限は何ですか？
  choices:
    A: リアルID（Real ID）を受け取ることができない。
    B: 標準の更新料の2倍を支払わなければならない。
    C: 4年間有効の免許証しか受け取ることができない。
    D: ジョージア州に戻った際に筆記試験を受けなければならない。
  answer: A
  explanation: マニュアルには、「この方法で免許を更新することを選択した顧客は、RealDL/IDを受け取ることはできません」と明記されています。
- id: 89
  category: license_system
  question: 更新手続き中に、現在の運転免許証番号が社会保障番号（SSN）と同一である場合、どうなりますか？
  choices:
    A: 新しい社会保障番号を申請しなければならない。
    B: ランダムに生成された書類番号が書類に割り当てられる。
    C: 同じ番号を保持することが義務付けられる。
    D: 免許が一時的に停止される。
  answer: B
  explanation: 社会保障番号を書類番号として免許証を発行することはできません。もし同一である場合は、発行または更新の手続き中にランダムに生成された書類番号が割り当てられます。
- id: 90
  category: driver_responsibility
  question: DDSを通じて有権者登録を行う際、30日以内に有権者登録証が届かない場合はどこに連絡すべきですか？
  choices:
    A: 運転者サービス局（DDS）
    B: ジョージア州パトロール隊
    C: 郡の有権者登録事務所
    D: 連邦選挙委員会
  answer: C
  explanation: マニュアルでは次のようにアドバイスしています。「30日以内に有権者登録証が届かない場合は、お住まいの郡の有権者登録事務所に連絡して、申請状況を確認してください。」
- id: 91
  category: license_system
  question: 紛失または盗難に遭った運転免許証を、オンラインまたはDDSカスタマーサービスセンターで再発行する際の費用はいくらですか？
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: B
  explanation: マニュアルによると、オンラインおよびDDSカスタマーサービスセンターでの運転免許証の再発行手数料は10.00ドルです。
- id: 92
  category: license_system
  question: 盗難を理由に再発行する際、運転免許証番号の変更を希望する場合に必要な書類は何ですか？
  choices:
    A: 認証済みの出生証明書
    B: 免許証が盗まれたことを示す警察の被害届（ポリスレポート）
    C: 自動車保険会社からの書面
    D: 認証済みの運転記録の写し
  answer: B
  explanation: ジョージア州の運転免許証を再発行する際に番号を変更するには、免許証が盗まれたことを示す警察の被害届を提示する必要があります（免許証番号と社会保障番号が同一である場合を除きます）。
- id: 93
  category: driver_responsibility
  question: 引っ越し後、DDSで住所変更の手続きを行うまでに何日間の猶予がありますか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: C
  explanation: マニュアルには、「引っ越しをした場合は、60日以内にDDSカスタマーサービスセンターを訪れ、郵送先住所および/または居住地住所を更新しなければならない」と記載されています。
- id: 94
  category: driver_responsibility
  question: 引っ越しの際、DDSに直接住所変更を届け出ることが重要なのはなぜですか？
  choices:
    A: 米国郵便公社（USPS）は、DDSからの郵便物を新しい住所に転送しないため。
    B: 届け出をしないと、直ちに免許が取り消されるため。
    C: 更新されるまで、毎日罰金が科せられるため。
    D: 車両登録が自動的にキャンセルされるため。
  answer: A
  explanation: マニュアルには、「DDSからの郵便物は、米国郵便公社によって新しい住所へ転送されることはありません」と記されています。
- id: 95
  category: license_system
  question: 結婚やその他の法的措置により氏名を変更した場合、正しい氏名が記載された新しい免許証を何日以内に取得しなければなりませんか？
  choices:
    A: 15日
    B: 30日
    C: 60日
    D: 120日
  answer: C
  explanation: マニュアルによると、「結婚やその他の法的措置により氏名を変更した場合は、60日以内に正しい氏名が記載された新しい免許証を取得しなければならない」とされています。
- id: 96
  category: license_system
  question: 現在の免許有効期間内に初めて氏名変更による再発行を行う場合、その費用はいくらですか？
  choices:
    A: $5.00
    B: $10.00
    C: $20.00
    D: 無料
  answer: D
  explanation: マニュアルには、氏名変更の場合、「現在の有効期間内に一度だけ、その期間中有効な無料の再発行免許証が交付される」と記載されています。
- id: 97
  category: license_system
  question: 7年間の運転記録証明書（MVR）の費用はいくらですか？
  choices:
    A: $6.00
    B: $8.00
    C: $10.00
    D: $12.00
  answer: B
  explanation: マニュアルではMVRの手数料を次のように規定しています。「3年間の記録は6.00ドル、7年間の記録は8.00ドル、無期限（ライフタイム）の記録は8.00ドルです」。
- id: 98
  category: license_system
  question: 運転記録証明書（MVR）をオンラインで取得する場合と対面で取得する場合に関して、正しいものはどれですか？
  choices:
    A: オンラインのMVRは認証済みであり、対面のMVRは未認証である。
    B: オンラインのMVRは未認証であり、対面のMVRは認証済みである。
    C: オンラインと対面のどちらのMVRも認証済みである。
    D: オンラインと対面のどちらのMVRも未認証である。
  answer: B
  explanation: マニュアルには、「運転記録証明書（MVR）の未認証のコピーはDDSオンラインサービスを使用してダウンロードできる」一方で、「認証済みのコピーは、任意のDDSカスタマーサービスセンターで対面で購入できる」と記載されています。
- id: 99
  category: license_system
  question: 他人の運転記録証明書（MVR）を対面で取得するために必要なものは何ですか？
  choices:
    A: 免許保持者からの口頭での合意
    B: 免許保持者があなたに受け取りを許可した、記入済みのMVR請求フォーム（DDS-18）
    C: 免許保持者の出生証明書の原本
    D: 裁判官が署名した裁判所命令
  answer: B
  explanation: 自分以外の記録を取得する場合は、「記録を受け取る権限を与えられた人物を指名した、免許保持者によるMVR請求フォーム（DDS-18）の記入」が必要です。
- id: 100
  category: license_system
  question: 紛失した免許証を再発行する際、主要リストの書類（出生証明書や米国パスポートなど）を1つも持っていない場合、補助リスト（社会保障カードや有権者登録カードなど）から何通の書類を提出する必要がありますか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: マニュアルでは、免許証の再発行時に受け入れ可能な本人確認書類として、第1リスト（出生証明書、パスポートなど）から1通、または第2リスト（社会保障カード、有権者登録カードなど）から2通が必要であると定めています。
- id: 101
  category: license_system
  question: 郵送でMVR（運転記録証明書）を請求する際、受け入れ可能な支払方法は次のうちどれですか？
  choices:
    A: 現金
    B: クレジットカード
    C: 郵便為替（Money order）
    D: 暗号資産
  answer: C
  explanation: 郵送でMVRを請求する場合、運転者サービス局（DDS）宛ての郵便為替（Money order）、銀行振出小切手（Cashier's check）、または個人小切手（Personal
    check）を同封する必要があります。
- id: 102
  category: license_system
  question: 免許証または身分証明書の発行手続きの際、運転者サービス局（DDS）はどのグループに対して、米国選抜徴兵対象者登録制度（Selective Service
    System）への登録有無を確認することが義務付けられていますか？
  choices:
    A: 16歳以上のすべての申請者
    B: 18歳の男性
    C: 18歳の女性
    D: 21歳のすべての申請者
  answer: B
  explanation: DDSは、18歳の男性に対して米国選抜徴兵対象者登録制度に登録しているかどうかを尋ね、その回答を報告することが義務付けられています。
- id: 103
  category: license_system
  question: 運転免許証を取得する際、ジョージア州の「失明予防教育・検査・治療プログラム（Blindness Education, Screening,
    and Treatment Program）」に対して、いくらの任意寄付を行う機会がありますか？
  choices:
    A: $1
    B: $2
    C: $5
    D: $10
  answer: A
  explanation: 運転免許証、許可証、または身分証明書を取得する際、ジョージア州の失明予防教育・検査・治療プログラムに対して1ドルの任意寄付を行う機会があります。
- id: 104
  category: driver_responsibility
  question: 患者の死亡を宣告した医師と臓器提供に関して、ジョージア州法は何と定めていますか？
  choices:
    A: その医師が臓器の摘出を行わなければならない。
    B: その医師は、提供された臓器の摘出や移植に参加することを禁止されている。
    C: その医師は、ドナーの家族に費用を通知しなければならない。
    D: その医師が、誰が提供臓器を受け取るかを決定する。
  answer: B
  explanation: ジョージア州法では、患者の死亡を宣告した医師が、その患者から提供された臓器や組織の摘出または移植に参加することを禁止しています。
- id: 105
  category: driver_responsibility
  question: 臓器、組織、または眼球の提供に関連する費用について、ドナーの家族の負担額はいくらですか？
  choices:
    A: 一律500ドル
    B: 外科的摘出に要する費用
    C: ドナーの家族に費用負担はない
    D: 臓器移植が成功した場合のみ家族が支払う
  answer: C
  explanation: 臓器、組織、または眼球の提供に関連するいかなる費用も、ドナーの家族に請求されることはありません。
- id: 106
  category: driver_responsibility
  question: 臓器提供の受取人を選定する際、使用されない要素は次のうちどれですか？
  choices:
    A: 必要性の緊急度
    B: 血液型の適合性
    C: 人種または信条
    D: 体の大きさと組織型
  answer: C
  explanation: 受取人は、性別、人種、信条に関係なく、必要性の緊急度、血液型の適合性、体の大きさ、および組織型によって選定されます。
- id: 107
  category: license_system
  question: ジョージア州学生金融局（GSFA）への任意寄付は、どのような人々の子供たちの高等教育への財政支援に役立てられますか？
  choices:
    A: すべてのジョージア州居住者
    B: 高校の卒業生総代
    C: 公務中に恒久的な障害を負った、または殉職した法執行官や緊急対応要員
    D: 医学の学位取得を目指す学生
  answer: C
  explanation: GSFAへの寄付は、公務中に恒久的な障害を負った、または殉職した法執行官、消防士、救急救命士などの子供たちの高等教育費用の財政支援に役立てられます。
- id: 108
  category: safe_driving_rules
  question: 交差点で警察官が交通整理をしており、信号が赤であるにもかかわらず進むよう指示された場合、どうすべきですか？
  choices:
    A: 信号が青に変わるまで待ってから進む。
    B: 警察官の指示に従って進む。
    C: 停車し、警察官にバッジ番号を尋ねる。
    D: 引き返して別のルートを探す。
  answer: B
  explanation: 最も基本的な交通法規の一つとして、信号機などの交通制御装置の指示に反する場合であっても、警察官や消防士による交通指示に従うことが義務付けられています。
- id: 109
  category: safe_driving_rules
  question: 工事や特別イベントのために閉鎖されている道路を走行することが許可されるのは、どのような状況ですか？
  choices:
    A: 仕事に遅れそうなとき。
    B: 工事作業員が見当たらないとき。
    C: 四輪駆動車を運転しているとき。
    D: いかなる場合も許可されない。
  answer: D
  explanation: 最も基本的な3つの交通法規の一つとして、工事、特別イベント、またはその他の公的な理由で閉鎖されている道路を走行してはならないと定められています。
- id: 110
  category: safe_driving_rules
  question: ジョージア州法における優先権（Right-of-way）に関する重要な原則は次のうちどれですか？
  choices:
    A: 優先権は取るものであり、譲るものではない。
    B: 優先権は譲るものであり、取るものではない。
    C: 最も大きな車両が常に優先権を持つ。
    D: 優先権のルールは自動車にのみ適用され、自転車には適用されない。
  answer: B
  explanation: 車両の運転者（自転車利用者を含む）および歩行者は、常に優先権に関するルールを理解しておく必要があり、優先権は「取るもの」ではなく「譲るもの」であることを忘れてはなりません。
- id: 111
  category: defensive_driving
  question: あなたに法的な優先権（right-of-way）があるにもかかわらず、他のドライバーがそれに気づかず、道を譲らない場合はどうすべきですか？
  choices:
    A: 速度を維持し、相手を強制的に停止させる。
    B: クラクションを鳴らし、減速せずに進む。
    C: 衝突を防ぐために、優先権を譲る。
    D: 相手を避けるために、対向車線に急ハンドルを切る。
  answer: C
  explanation: 道路交通法を守っていない相手に対して、自分に法的な優先権がある場合があります。そのような場合でも、衝突を防ぐために優先権を譲るべきです。
- id: 112
  category: safe_driving_rules
  question: 交差点の一時停止標識（stop sign）で停止しており、交差する側の交通に一時停止標識がない場合、いつ進むことができますか？
  choices:
    A: 完全に停止した直後。
    B: 停止した後、交差点内または交差点付近にいる車両や歩行者に優先権を譲った後。
    C: 後ろの車がクラクションを鳴らしたらすぐに。
    D: 交通状況に関わらず、正確に3秒間待った後。
  answer: B
  explanation: 自分側に一時停止標識があり、他の交通にはない場合、停止した上で、交差点内にいる、あるいは危険が生じるほど交差点に近い他の車両や歩行者に優先権を譲った後にのみ進むことができます。
- id: 113
  category: safe_driving_rules
  question: 一時停止標識、譲れ（yield）の標識、または信号機のない交差点で、2台の車両が同時に到着した場合、どうしなければなりませんか？
  choices:
    A: 左側のドライバーは、右側のドライバーに道を譲らなければならない。
    B: 右側のドライバーは、左側のドライバーに道を譲らなければならない。
    C: より速く走行している車両に優先権がある。
    D: 両方の車両が停止し、3台目の車両が到着するのを待たなければならない。
  answer: A
  explanation: 一時停止標識、譲れの標識、その他の信号機がない交差点に2台の車両が同時に到着した場合、左側の車両の運転者は右側の車両の運転者に道を譲らなければなりません。
- id: 114
  category: sharing_the_road
  question: 全ての方向に一時停止標識がある4差路の交差点（four-way stop）において、全てのドライバーは誰に対して道を譲らなければなりませんか？
  choices:
    A: 交差点にいる最も大きな車両。
    B: 左折する車両。
    C: 歩行者。
    D: 最後に到着した車両。
  answer: C
  explanation: 全ての方向に一時停止標識がある4差路の交差点では、全てのドライバーは歩行者に道を譲らなければなりません。
- id: 115
  category: safe_driving_rules
  question: 一時停止標識や信号のない交差点に、あなたと別の車両が全く同時に到着した場合、どうすべきですか？
  choices:
    A: 右側の車両は、左側の車両に道を譲らなければならない。
    B: 左側の車両は、右側の車両の運転者に道を譲らなければならない。
    C: 直進する車両に優先権がある。
    D: 最も速い車両に優先権がある。
  answer: B
  explanation: マニュアルによると、一時停止標識や信号のない交差点に2台の車両が同時に到着した場合、左側の車両の運転者は右側の車両の運転者に道を譲らなければなりません。
- id: 116
  category: defensive_driving
  question: 他の道路からの交通が、あなたが走行している車線に合流してくる場合、推奨される行動は何ですか？
  choices:
    A: 合流してくる車を素早く追い越すために加速する。
    B: 相手を入れさせるために、車両を完全に停止させる。
    C: 可能であれば、合流してくる交通から離れるように安全に車線変更する。
    D: 譲るように警告するためにクラクションを鳴らす。
  answer: C
  explanation: マニュアルでは、他の道路からの交通が走行中の道路に合流してくる場合、可能であれば合流車両から離れるように安全に車線変更することを推奨しています。
- id: 117
  category: safe_driving_rules
  question: 赤色灯を点滅させサイレンを鳴らした緊急車両が接近してきた場合、どのように対応すべきですか？
  choices:
    A: 加速して緊急車両の前を走り続ける。
    B: 左車線に移動して減速する。
    C: 現在の車線ですぐに停止する。
    D: 路肩または道路の右端にできるだけ寄って停止する。
  answer: D
  explanation: 緊急車両が緊急灯とサイレンを使用している場合は、路肩に移動するか、できるだけ右側に寄って停止し、安全に道を空ける必要があります。
- id: 118
  category: signs_and_signals
  question: 赤信号で右折する場合、進む前に何をしなければなりませんか？
  choices:
    A: 時速5マイル（5 mph）まで減速し、安全であれば進む。
    B: 完全に停止し、全ての交通と歩行者に道を譲る。
    C: クラクションを鳴らし、停止せずに進む。
    D: 信号が青になるまで待つ。
  answer: B
  explanation: 標識で禁止されていない限り、赤信号での右折は、完全に停止し、全ての交通と歩行者に道を譲り、安全であることを確認した後にのみ行うことができます。
- id: 119
  category: safe_driving_rules
  question: 赤信号で左折することが合法となるのは、どのような条件の場合ですか？
  choices:
    A: 対面通行の道路から一方通行の道路へ曲がる場合。
    B: 一方通行の道路の左車線から、左方向に進む一方通行の道路へ曲がる場合。
    C: 一方通行の道路から対面通行の道路へ曲がる場合。
    D: 赤信号で左折することが合法になることはない。
  answer: B
  explanation: 一方通行の道路の左車線から、交通が運転者の左方向に流れている一方通行の道路へ左折する場合、完全に停止して道を譲った後であれば、赤信号での左折が認められます。
- id: 120
  category: sharing_the_road
  question: 赤色灯を点滅させ、一時停止の標識（stop sign）を出しているスクールバスに対して、停止する必要がないのはどのような時ですか？
  choices:
    A: 2車線の道路を走行している時。
    B: 中央分離帯（median）で仕切られたハイウェイの反対側を走行している時。
    C: 指定されたスクールゾーン内にいる時。
    D: バスと同じ方向に走行している時。
  answer: B
  explanation: 中央分離帯で仕切られたハイウェイでは、停車中のスクールバスの反対側を走行している車両は停止する必要はありません。
- id: 121
  category: safe_driving_rules
  question: 2車線道路で追い越しを行う際、対向車が自車から何フィート以内に近づく前に右側車線に戻らなければなりませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: C
  explanation: 対向車が自車から200フィート以内に近づく前に、車両を完全に右側車線に戻すための十分な時間とスペースを確保しなければなりません。
- id: 122
  category: safe_driving_rules
  question: 2車線道路での追い越しが禁止されているのは、次のうちどの状況ですか？
  choices:
    A: 踏切や橋から100フィート以内。
    B: 前方の車両が制限速度以下で走行しているとき。
    C: 黄色の破線がある直線道路。
    D: 交差点から500フィート以内にいるとき。
  answer: A
  explanation: 踏切、橋、高架橋、またはトンネルから100フィート以内の2車線道路では、追い越しが禁止されています。
- id: 123
  category: safe_driving_rules
  question: 他の車両を右側から追い越すことが許されるのはどのような時ですか？
  choices:
    A: 前方の車両が非常に低速で走行しているとき。
    B: 前方の車両が左折中、または左折しようとしており、十分な路面の幅があるとき。
    C: 道路の未舗装の路肩を走行することによって。
    D: スクールゾーン内にいるとき。
  answer: B
  explanation: 左折中または左折しようとしている車両の右側に、自車と左折車両の両方が通れる十分な路面の幅がある場合は、右側から追い越すことができます。
- id: 124
  category: safe_driving_rules
  question: ジョージア州の「ムーブ・オーバー法（Move Over Law）」に基づき、路肩に停車している緊急車両に接近する際、安全に隣の車線に移動できない場合はどうしなければなりませんか？
  choices:
    A: 速度を維持し、クラクションを鳴らす。
    B: 車線内で直ちに停止する。
    C: 制限速度以下に減速し、停止できる態勢をとる。
    D: 加速して素早く車両を追い越す。
  answer: C
  explanation: 「ムーブ・オーバー法」は、安全に可能な場合は隣の車線に移動することを運転者に義務付けています。移動できない場合は、制限速度以下に減速し、停止できる態勢をとらなければなりません。
- id: 125
  category: penalties_and_points
  question: 「ムーブ・オーバー法」の初犯に対する最大罰金額はいくらですか？
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: 「ムーブ・オーバー法」違反は、初犯の場合、500ドル以下の罰金が科せられる可能性があります。
- id: 126
  category: defensive_driving
  question: 他のドライバーが自分の車を追い越そうとしているとき、礼儀正しい行動とされるのはどれですか？
  choices:
    A: 追い越しを阻止するために加速する。
    B: 進路を塞ぐために左に移動する。
    C: 相手が追い越しやすくなるよう、わずかに減速する。
    D: 相手にハイビームを点滅させる。
  answer: C
  explanation: 後方のドライバーが自車を追い越そうとしているときは、相手が追い越しやすくなるようにわずかに減速するのがマナーとされています。
- id: 127
  category: safe_driving_rules
  question: 路地や私道から幹線道路に入る前に、何をしなければなりませんか？
  choices:
    A: 左から接近してくる車両にのみ譲る。
    B: 停止し、すでに道路や歩道にいるすべての歩行者および車両に優先権を譲る。
    C: クラクションを鳴らし、停止せずに進む。
    D: 素早く加速して交通流に合流する。
  answer: B
  explanation: 路地、私道、または私有地から幹線道路に入ったり横断したりしようとする場合は、停止し、すでにその道路や歩道を走行している他のすべての歩行者および車両に優先権を譲らなければなりません。
- id: 128
  category: signs_and_signals
  question: 交差点で青信号ですが、交差点内の混雑がまだ解消されていない場合、どうすべきですか？
  choices:
    A: 優先権を主張するために交差点内に進入する。
    B: 交差点が空くまでクラクションを鳴らし続ける。
    C: 交差点内の混雑が解消されるまで待ってから進入する。
    D: 直進せずに右折する。
  answer: C
  explanation: 信号機のある交差点では、交差点内の車両や接近してくる車両がいなくなるまで待ってから進入してください。単に「青信号だから」という理由だけで進んではいけません。
- id: 129
  category: penalties_and_points
  question: 自転車の追い越しに関する規則に違反した場合の罰則は何ですか？
  choices:
    A: 初犯は警告
    B: 250ドル以下の罰金が科せられる軽罪
    C: 500ドル以下の罰金が科せられる重罪
    D: 6ヶ月間の免許停止
  answer: B
  explanation: マニュアルによると、自転車の追い越しに関する規則違反は、250ドル以下の罰金が科せられる軽罪となります。
- id: 130
  category: sharing_the_road
  question: 自転車を追い越す際、隣接しない車線に移動できない場合はどうしなければなりませんか？
  choices:
    A: クラクションを鳴らし、現在の速度を維持する
    B: 制限速度より少なくとも時速10マイル低い速度、または時速25マイル（いずれか速い方）まで減速し、少なくとも3フィートの間隔を空ける
    C: 停止して、自転車が路肩に寄るのを待つ
    D: 加速して、できるだけ早く自転車を追い越す
  answer: B
  explanation: 車線変更が不可能または安全でない場合は、掲示されている制限速度より少なくとも時速10マイル低い速度、または時速25マイルのいずれか速い方まで減速し、自車と自転車の間に少なくとも3フィートの間隔を空けて進まなければなりません。
- id: 131
  category: safe_driving_rules
  question: 後方のドライバーがあなたの車両を追い越そうとしているとき、以下のうち違法となる行為はどれですか？
  choices:
    A: 速度をわずかに落とす
    B: 現在の車線位置を維持する
    C: 追い越しが完全に完了する前に速度を上げる
    D: バックミラーを確認する
  answer: C
  explanation: マニュアルには、追い越し車両に完全に追い越される前に速度を上げることは違法であると記載されています。
- id: 132
  category: sharing_the_road
  question: オートバイを追い越す際、ドライバーがしなければならないことは何ですか？
  choices:
    A: スペースを節約するために、オートバイと同じ車線を共有する
    B: 隣接する車線で追い越す
    C: 同じ車線内で追い越す前に、警告のためにクラクションを鳴らす
    D: 道路の右側の路肩を通って追い越す
  answer: B
  explanation: オートバイの運転者は、法的に1車線の全幅を占有する権利があります。オートバイを追い越す際、ドライバーは隣接する車線で追い越さなければならず、同じ車線を占有することは許可されていません。
- id: 133
  category: safe_driving_rules
  question: 後方のドライバーに対し、好意や「追い越してよい」という合図として方向指示器を点滅させることは合法ですか？
  choices:
    A: はい、礼儀正しい運転とみなされます
    B: はい、ただし複数車線の高速道路に限ります
    C: いいえ、法律違反です
    D: いいえ、雨や霧の場合を除きます
  answer: C
  explanation: マニュアルの「違法な合図」の項目には、後方の他のドライバーに対して好意や「追い越してよい」という合図として方向指示器を点滅させることは法律違反であると明記されています。
- id: 134
  category: vehicle_information
  question: 左折の準備をする際、車輪（タイヤ）はどのようにしておくべきですか？
  choices:
    A: わずかに左に向けておく
    B: わずかに右に向けておく
    C: 実際に曲がり始めるまで真っ直ぐにしておく
    D: 縁石の方に向けておく
  answer: C
  explanation: 左折する際、マニュアルでは実際に曲がり始めるまで車輪を真っ直ぐに保つよう指示しています。
- id: 135
  category: safe_driving_rules
  question: 左折のために交差点内に入った後は、以下のうち何をしてはいけませんか？
  choices:
    A: 交差点内で車線を変更すること
    B: 信号が黄色に変わった場合に左折を完了させること
    C: 対向車に道を譲ること
    D: センターラインに最も近い車線に曲がること
  answer: A
  explanation: マニュアルには、左折のために交差点に入った後は、交差点内で車線を変更することはできないと記載されています。
- id: 136
  category: safe_driving_rules
  question: 車両が幹線道路上で故障した場合、道路外に駐車するよう可能な限りの努力をし、前後それぞれの方向に何フィート先から車両がはっきりと見えるようにしなければなりませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: C
  explanation: 車両が故障した場合は、通行の妨げにならないよう道路外に駐車し、前後それぞれの方向から200フィート先まで視界が遮られないようにしなければなりません。
- id: 137
  category: safe_driving_rules
  question: 次の条件のうち、停車、一時停止、または駐車が「常に」許可されているのはどれですか？
  choices:
    A: 横断歩道の上
    B: 交差点内
    C: 橋や高架橋の上
    D: 上記のいずれでもない
  answer: D
  explanation: 横断歩道の上、交差点内、または橋や高架橋の上での停車、一時停止、または駐車はいかなる時も許可されていません。
- id: 138
  category: safe_driving_rules
  question: 消火栓から何フィート以内の場所で、乗客の乗り降りのために一時的に停車することが許可されていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: B
  explanation: 消火栓から15フィート以内の場所では、乗客の乗り降りのためのごく短時間の停車のみが許可されています。
- id: 139
  category: vehicle_information
  question: 縦列駐車をしようとする際、横の車とほぼ並んで停車するとき、その車との間隔（ドアからドアまで）はどのくらい空けるべきですか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 4フィート
  answer: B
  explanation: 縦列駐車を試みる際は、駐車スペースの前にある車の横に、その車から約2フィートの間隔（ドアからドアまで）を空けて並んで停車します。
- id: 140
  category: safe_driving_rules
  question: 「スローポーク法（Slow Poke Law）」によると、追い越し車線（一番左側の車線）を走行しているドライバーは、より速い車が後方から接近してきた場合、どうしなければなりませんか？
  choices:
    A: 制限速度で走っているなら、その速度を維持する
    B: 右側に寄って、より速い車を先行させる
    C: 接近してくる車両の速度に合わせて加速する
    D: ハザードランプを点灯させる
  answer: B
  explanation: 「スローポーク法」は、走行速度に関わらず、低速のドライバーは追い越し車線から出て右側に寄り、より速い交通が進行できるようにすることを義務付けています。
- id: 141
  category: safe_driving_rules
  question: 追い越し車線から移動することを義務付ける「スローポーク法（Slow Poke Law）」の例外に該当するのは、次のうちどれですか？
  choices:
    A: 掲示されている制限速度ちょうどで走行しているとき
    B: ラジオを聴いているとき
    C: 出口から出るため、または左折するために追い越し車線を走行する必要があるとき
    D: 商用車を運転しているとき
  answer: C
  explanation: 「スローポーク法（Slow Poke Law）」の例外の一つは、出口から出るため、または左折するために追い越し車線を走行しなければならない場合です。
- id: 142
  category: sharing_the_road
  question: 横断歩道で歩行者が道路を横断するために車両が停止している場合、後方から接近する他の車両の運転者はどうしなければなりませんか？
  choices:
    A: 歩行者に警告するためにクラクションを鳴らして進む
    B: 停止している車両を右側から追い越す
    C: 停止している車両を追い抜き、または追い越してはならない
    D: 停止している車両を左側から追い越す
  answer: C
  explanation: 横断歩道で歩行者が道路を横断するために車両が停止しているときは、後方から接近する他の車両の運転者は、その停止している車両を追い抜き、または追い越してはなりません。
- id: 143
  category: safe_driving_rules
  question: カーブや坂の頂上付近でUターンをしてはいけないのは、どのような場合ですか？
  choices:
    A: どちらの方向から接近してくる他の運転者からも自分の車が見えない場合
    B: 商用車を運転している場合
    C: 制限速度が時速45マイルを超えている場合
    D: 道路の右側に実線の白線がある場合
  answer: A
  explanation: マニュアルには、「どちらの方向から接近してくる他の運転者からも自分の車が見えない場合は、カーブや坂の頂上付近でUターンをしてはならない」と記載されています。
- id: 144
  category: penalties_and_points
  question: ジョージア州のスーパー・スピーダー法（Super Speeder law）に基づき、2車線道路を時速75マイル以上で走行して有罪となった場合に課される州の手数料はいくらですか？
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: ジョージア州では、2車線道路で時速75マイル以上、またはあらゆる道路で時速85マイル以上の速度違反で有罪となった運転者には、200ドルの州の手数料が課されます。
- id: 145
  category: safe_driving_rules
  question: 標識による指定がない場合、ジョージア州の未舗装の郡道における最高速度制限は時速何マイルですか？
  choices:
    A: 時速30マイル
    B: 時速35マイル
    C: 時速45マイル
    D: 時速55マイル
  answer: B
  explanation: 標識による別段の指定がない限り、未舗装の郡道における最高走行速度は時速35マイルです。
- id: 146
  category: safe_driving_rules
  question: ジョージア州の地方部にある州間高速道路（インターステート）の一般的な最高速度制限は時速何マイルですか？
  choices:
    A: 時速55マイル
    B: 時速65マイル
    C: 時速70マイル
    D: 時速75マイル
  answer: C
  explanation: 標識による別段の指定がない限り、地方部の州間高速道路における最高走行速度は時速70マイルです。
- id: 147
  category: penalties_and_points
  question: 追い越し車線を低速で走行し、交通の正常な流れを妨げた場合の罰則として考えられるものはどれですか？
  choices:
    A: 最大500ドルの罰金と運転記録への2点の加点
    B: 最大1000ドルの罰金および/または運転記録への3点の加点
    C: 6ヶ月間の免許停止
    D: 義務的な安全運転講習の受講
  answer: B
  explanation: 追い越し車線を低速で走行して交通を妨げた場合の罰則には、最大1000ドルの罰金および/または運転記録への3点の加点が含まれます。
- id: 148
  category: safe_driving_rules
  question: 踏切で停止する必要がある場合、最も近いレールから最低何フィート離れて停止しなければなりませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 25フィート
    D: 50フィート
  answer: B
  explanation: 踏切で停止が必要な場合は、最も近いレールから15フィート以上50フィート以内の場所で停止しなければなりません。
- id: 149
  category: defensive_driving
  question: 踏切内で車両が動かなくなった（エンストした）場合、まず最初にすべきことは何ですか？
  choices:
    A: すぐにエンジンを再始動しようとする
    B: ギアをニュートラルに入れ、車を線路の外へ押す
    C: すぐに車から降りて、線路から離れる
    D: 車内からレッカー車に電話する
  answer: C
  explanation: 線路上で車両が動かなくなった場合は、すぐに車から降りて離れ、緊急通知システム（ENS）の標識を見つけて助けを呼んでください。
- id: 150
  category: vehicle_information
  question: 標準的な乗用車を後退（バック）させる際、周囲を確認するための適切な技術は何ですか？
  choices:
    A: バックミラーだけに頼る
    B: 頭を回して右肩越しに後ろを見る
    C: 左肩越しに後ろを見ながら、サイドミラーを使用する
    D: クラクションを鳴らして素早く後退する
  answer: B
  explanation: 後退する前には、頭を回して右肩越しに後ろを確認する必要があります。ミラーだけに頼ってはいけません。
- id: 151
  category: signs_and_signals
  question: 高速道路の工事区間（ワークゾーン）の警戒標識には何色が使用されますか？
  choices:
    A: 黄色の背景に黒の文字
    B: オレンジ色の背景に黒の文字または記号
    C: 白色の背景に黒の文字
    D: 赤色の背景に白の文字
  answer: B
  explanation: 工事区間の警戒標識は、オレンジ色の背景に黒色の文字または記号が使用されています。
- id: 152
  category: penalties_and_points
  question: 高速道路の工事区間において、規制速度制限に従わなかった場合の最大罰金額はいくらですか？
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: 工事区間内の規制速度制限に従わなかった運転者は、100ドル以上2,000ドル以下の罰金、または最大12か月の禁錮、あるいはその両方を科される可能性があります。
- id: 153
  category: signs_and_signals
  question: 高速道路の工事区間において、交通誘導員（フラッガー）はどのような権限を持っていますか？
  choices:
    A: 安全な速度についての提案のみを行うことができる
    B: 規制標識と同じ権限を持っている
    C: 一時停止の仮設標識よりも権限が低い
    D: 建設作業員に交通状況を知らせるためだけに配置されている
  answer: B
  explanation: 工事区間において、交通誘導員は規制標識と同じ権限を持っており、運転者はその交通規制の指示に従わなければなりません。
- id: 154
  category: sharing_the_road
  question: 琥珀色（アンバー）の点滅灯または回転灯を装備した車両がある工事区間に近づく際、どのようにすべきですか？
  choices:
    A: 速度を維持し、クラクションを鳴らす
    B: 進路を譲り（優先権を与え）、速度を落とす
    C: 車両を素早く追い越すために加速する
    D: ライトが消えるまで完全に停止する
  answer: B
  explanation: 琥珀色の点滅灯または回転灯を装備した作業車両や重機に対しては、進路を譲り、接近する際に速度を落とさなければなりません。
- id: 155
  category: vehicle_information
  question: 縦列駐車をする際、どの時点で素早くハンドルを戻して（タイヤを真っ直ぐにして）斜め後退を続けるべきですか？
  choices:
    A: 自分のフロントバンパーが前方の車を完全に通り過ぎたとき
    B: 自分のフロントドアが前方の車のリアバンパーを通過したとき
    C: 後退を開始する前
    D: 後方の車に接触したとき
  answer: B
  explanation: 駐車しようとするスペースの前方に停まっている車両のリアバンパーを、自分の車のフロントドアが通過した時点で、素早くハンドルを戻してタイヤを真っ直ぐにし、そのまま斜め後退を続けます。
- id: 156
  category: penalties_and_points
  question: 「スーパースピーダー（Super Speeder）」の州手数料を期限内に支払わなかった場合、どうなりますか？
  choices:
    A: 車両が押収される
    B: 免許に3ポイント加算される
    C: 免許停止処分となり、50ドルの再交付手数料が加算される
    D: 運転免許試験の再受験が求められる
  answer: C
  explanation: 州の手数料を期限内に支払わなかった場合、免許停止処分となり、さらに50ドルの再交付手数料が加算されます。
- id: 157
  category: safe_driving_rules
  question: 全米の高速道路工事区間における死亡事故の大部分を占めているのは誰ですか？
  choices:
    A: GDOT（州運輸局）の作業員
    B: 一般市民（ドライバーや同乗者）
    C: 交通誘導員
    D: 公共事業の作業員
  answer: B
  explanation: 全米の工事区間における死亡者の82%を一般市民が占めており、作業員よりも一般のドライバーが死亡または負傷する可能性の方が高くなっています。
- id: 158
  category: sharing_the_road
  question: 同じ方向に進む車線が2つ以上ある道路で、低速車両が右側車線から離れてもよいのはどのような時ですか？
  choices:
    A: 追い越しをする際や左折をする場合
    B: 運転者が道路をよりよく見渡したい場合
    C: 最低速度制限ちょうどで走行している場合
    D: 低速車両は決して右側車線を離れてはならない
  answer: A
  explanation: 同じ方向に進む車線が2つ以上ある場合、追い越しをする際や左折をする場合を除き、低速車両は右側車線を使用しなければなりません。
- id: 159
  category: safe_driving_rules
  question: ほとんどの工事区間における交通違反の罰金について、正しいものはどれですか？
  choices:
    A: 半分に減額される
    B: 増額される
    C: 通常の道路と同じである
    D: 初犯の場合は免除される
  answer: B
  explanation: マニュアルの工事区間での運転に関するヒントによると、ほとんどの工事区間では罰金が増額されるため、速度制限の標識に注意する必要があります。
- id: 160
  category: safe_driving_rules
  question: 進入制限道路（高速道路など）において、厳格に禁止されている操作はどれですか？
  choices:
    A: 緊急停止のために路肩を使用すること
    B: 後退（バック）すること
    C: 掲示された速度制限で走行すること
    D: 他の車両を追い越すこと
  answer: B
  explanation: マニュアルには、進入制限道路での後退（バック）は禁止されていると明記されています。
- id: 161
  category: safe_driving_rules
  question: 自動車で坂を下る際、運転者がしてはいけないことは何ですか？
  choices:
    A: ブレーキを軽くかける。
    B: ギアやトランスミッションをニュートラルにして惰性走行する。
    C: 両手をハンドルに添える。
    D: 低いギアにシフトダウンする。
  answer: B
  explanation: 惰性走行に関する法律では、自動車の運転者が坂を下る際、車両のギアやトランスミッションをニュートラルにして惰性走行してはならないと定められています。
- id: 162
  category: alcohol_drugs_health
  question: 21歳未満の人が「アルコールの影響下にある」とみなされるのは、血中アルコール濃度（BAC）が何gm以上の場合ですか？
  choices:
    A: 0.02 gm
    B: 0.04 gm
    C: 0.06 gm
    D: 0.08 gm
  answer: A
  explanation: 21歳未満の人は、血中に0.02 gm以上のアルコールが含まれている場合、決定的に「アルコールの影響下にある」とみなされます。
- id: 163
  category: alcohol_drugs_health
  question: 合法的に処方された薬によって運転能力に支障が出ている場合、運転者は影響下での運転（DUI）で起訴される可能性がありますか？
  choices:
    A: いいえ、医師によって合法的に処方された薬であるため。
    B: はい、処方箋があっても、安全に運転する能力を損なう薬であれば弁護の理由にはなりません。
    C: いいえ、アルコールと一緒に服用していない限り。
    D: はい、ただし運転者が21歳未満の場合に限ります。
  answer: B
  explanation: マニュアルには、特定の薬の処方箋を持っていることは、その薬が自動車を安全に操作する能力を損なう場合、弁護の理由にはならないと記されています。
- id: 164
  category: driver_responsibility
  question: 他人を困らせたり、嫌がらせをしたり、威嚇したりする意図を持って自動車を運転することは、何と定義されますか？
  choices:
    A: 無謀運転 (Reckless driving)
    B: 攻撃的運転 (Aggressive driving)
    C: 防衛運転 (Defensive driving)
    D: 高速道路催眠現象 (Highway hypnosis)
  answer: B
  explanation: 他人を困らせる、嫌がらせをする、つきまとう、威嚇する、負傷させる、または妨害する意図を持って自動車を運転した場合、攻撃的運転（Aggressive
    driving）の罪を犯したことになります。
- id: 165
  category: vehicle_information
  question: ジョージア州の高速道路で許可されているトレーラーの最大幅はどれくらいですか？
  choices:
    A: 7フィート6インチ
    B: 8フィート0インチ
    C: 8フィート6インチ
    D: 9フィート0インチ
  answer: C
  explanation: マニュアルには、8フィート6インチを超える幅のトレーラーはジョージア州の高速道路での走行が許可されていないと記されています。
- id: 166
  category: safe_driving_rules
  question: 自動車の運転中にヘッドフォンやヘッドセットを着用することは合法ですか？
  choices:
    A: はい、GPSの音声案内を聞いている場合は可能です。
    B: はい、ただし片耳だけに限ります。
    C: いいえ、運転者の聴力を損なうような装置を着用することは違法です。
    D: いいえ、田舎の高速道路を走っている場合を除きます。
  answer: C
  explanation: 運転者の聴力を損なうようなヘッドフォン、ヘッドセット、またはその他の装置を着用して自動車を運転することは違法です。
- id: 167
  category: sharing_the_road
  question: 駐車中の車両の、走行中の交通に面した側のドアを開けることが合法なのはいつですか？
  choices:
    A: 住宅街に駐車している時のみ。
    B: 安全であり、自転車利用者を含む他の交通の妨げにならない時のみ。
    C: 車両から素早く降りる必要がある時はいつでも。
    D: いかなる状況においても合法ではありません。
  answer: B
  explanation: 走行中の交通に面した側のドアを開けることは、安全であり、かつ自転車利用者を含む他の交通の動きを妨げることなく行える場合を除き、禁止されています。
- id: 168
  category: safe_driving_rules
  question: ジョージア州の法律によると、いつヘッドライトを使用しなければなりませんか？
  choices:
    A: 日没の1時間後から日の出の1時間前まで。
    B: 日没の30分後から日の出の30分前まで、または雨が降っている時。
    C: 照明のない田舎道を運転している時のみ。
    D: 毎日午後8時から午前6時まで。
  answer: B
  explanation: 日没の30分後から日の出の30分前までの間、雨が降っている時、または視界が制限されている時は、ヘッドライトを使用しなければなりません。
- id: 169
  category: safe_driving_rules
  question: 他の車両の後ろを走行している際、どのくらいの距離以内に入ったらヘッドライトを減光（ロービームに）しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 他の車両のすぐ後ろ（200フィート以内）を走行しているときは、ヘッドライトを減光（ロービームに）する必要があります。
- id: 170
  category: defensive_driving
  question: 夜間の運転中に視界が大幅に低下した場合、走行車線を維持するためのガイドとして何を使用すべきですか？
  choices:
    A: 前方の車両のテールランプ。
    B: 対向車のヘッドライト。
    C: 道路の側線または中央線。
    D: 路肩にある反射標識。
  answer: C
  explanation: 視界が大幅に低下した場合は、走行車線を維持するためのガイドとして側線を使用してください。側線がない場合は、中央線をガイドとして使用してください。
- id: 171
  category: safe_driving_rules
  question: 乗用車の同乗者のうち、座っている場所に関係なく、法律でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 18歳未満のすべての同乗者。
    B: 12歳未満の同乗者のみ。
    C: 運転手と前部座席の同乗者のみ。
    D: 65歳以上のすべての同乗者。
  answer: A
  explanation: 乗用車のすべての同乗者は、18歳未満であれば座席の位置に関わらずシートベルトを着用しなければなりません。
- id: 172
  category: penalties_and_points
  question: 5年以内にドラッグレース（Drag Racing）または無謀なスタント運転（Reckless Stunt Driving）で初めて有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 6ヶ月間の運転免許停止。
    B: 12ヶ月間の運転免許停止。
    C: 3年間の運転免許停止。
    D: 運転免許の永久取り消し。
  answer: B
  explanation: ドラッグレースまたは無謀なスタント運転による5年以内での最初の有罪判決の罰則には、12ヶ月間の免許停止が含まれます。
- id: 173
  category: safe_driving_rules
  question: 道路や高速道路を移動中のハウストレーラーに同乗者が乗ることは合法ですか？
  choices:
    A: はい、トレーラーにシートベルトが装備されていれば可能です。
    B: はい、ただし同乗者が18歳以上の場合に限ります。
    C: いいえ、移動中の車両牽引式トレーラーに乗ることは許可されていません。
    D: いいえ、車両が時速25マイル以下で走行している場合を除きます。
  answer: C
  explanation: ハウストレーラーやその他の車両牽引式トレーラーに乗ることは、負傷や死亡の危険性が高いため、道路や高速道路を移動中は禁止されています。
- id: 174
  category: safe_driving_rules
  question: ジョージア州法によると、乗用車の同乗者のうち、シートベルトを着用しなければならないのは誰ですか？
  choices:
    A: 車両の運転手のみ
    B: 前部座席の各同乗者、および18歳未満のすべての同乗者
    C: 18歳未満の乗客のみ
    D: 年齢や座席位置に関わらず、すべての同乗者
  answer: B
  explanation: ジョージア州法では、前部座席のすべての同乗者はシートベルトで固定される必要があり、また18歳未満のすべての同乗者は座席位置に関わらずシートベルトを着用しなければならないと定められています。
- id: 175
  category: penalties_and_points
  question: ジョージア州に「プライマリー（primary）」シートベルト法があるとはどういう意味ですか？
  choices:
    A: シートベルト違反は、州内で最も一般的な交通違反であるという意味。
    B: 警察官は、他の違反を確認しなくても、シートベルト違反だけで車両を停止させ、違反切符を発行できるという意味。
    C: 車両の主たる運転手（プライマリー・ドライバー）のみがシートベルト違反で切符を切られるという意味。
    D: シートベルト違反は、あらゆる交通違反の中で最も高い違反点数が科されるという意味。
  answer: B
  explanation: ジョージア州には「プライマリー」シートベルト法があり、これは警察官が他の違反を目撃していなくても、シートベルト違反のみを理由に停車させ、摘発できることを意味します。
- id: 176
  category: safe_driving_rules
  question: ジョージア州法の下で、子供が適切なチャイルドシート（child passenger restraining system）で適切に固定されていなければならないのは、何歳未満の場合ですか？
  choices:
    A: 6歳未満
    B: 8歳未満
    C: 10歳未満
    D: 12歳未満
  answer: B
  explanation: 8歳未満の子供を輸送するすべての運転手は（タクシーや公共交通機関を除く）、その子供を適切なチャイルドシートで適切に固定しなければなりません。
- id: 177
  category: sharing_the_road
  question: 火災報知に応答して走行中の消防車を追走する場合、どのくらいの距離を保たなければなりませんか？
  choices:
    A: 少なくとも100フィート
    B: 少なくとも200フィート
    C: 少なくとも300フィート
    D: 少なくとも500フィート
  answer: B
  explanation: いかなる車両の運転手も、火災報知に応答して走行中の消防車を200フィート以内の距離で追走してはなりません。
- id: 178
  category: safe_driving_rules
  question: 火災報知に応答して停車している消防車から、どのくらいの距離以内に車両を駐車することは違法ですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: 運転手は、火災報知に応答して停車している消防車から500フィート以内に車両を駐車してはなりません。
- id: 179
  category: penalties_and_points
  question: ジョージア州のポイ捨て防止法（Litter Control Law）に基づくポイ捨ての有罪判決に対する最大罰金と禁錮刑はいくらですか？
  choices:
    A: 500ドルの罰金と6ヶ月の禁錮刑
    B: 1,000ドルの罰金と12ヶ月の禁錮刑
    C: 250ドルの罰金、禁錮刑なし
    D: 2,000ドルの罰金と24ヶ月の禁錮刑
  answer: B
  explanation: ポイ捨て防止法に基づき有罪判決を受けた者には、最大1,000ドルの罰金と12ヶ月の禁錮刑が科される可能性があります。
- id: 180
  category: safe_driving_rules
  question: ジョージア州ハンズフリー法（HB 673）の下で、運転中に合法的に許可されているのは次のうちどれですか？
  choices:
    A: 肩で電話を支えて通話すること
    B: テキストメッセージを読むために電話を手に持つこと
    C: ヘッドフォンまたは固定されたデバイスを使用して電話を使用すること
    D: 電話が固定されていれば、動画を配信すること
  answer: C
  explanation: ハンズフリー法では、電話の使用はヘッドフォン、ワイヤレスデバイス、電話ホルダー、または固定されたデバイスを使用する場合のみに限定されています。電話を手に持つこと、テキストを読むこと、動画を配信することは禁止されています。
- id: 181
  category: penalties_and_points
  question: ジョージア州ハンズフリー法（Hands Free Georgia Law）に基づく最初の有罪判決に対する罰則は何ですか？
  choices:
    A: 1点（減点）および50ドル以下の罰金
    B: 2点（減点）および100ドル以下の罰金
    C: 3点（減点）および150ドル以下の罰金
    D: 免許停止および50ドルの罰金
  answer: A
  explanation: ジョージア州ハンズフリー法に基づく最初の有罪判決に対する罰則は、1点の減点と50ドル以下の罰金です。
- id: 182
  category: sharing_the_road
  question: 点滅灯を点灯させて作業中の清掃作業車に接近する際、車線変更が不可能な場合、どの程度速度を落とさなければなりませんか？
  choices:
    A: 正確に時速15マイル（15 mph）まで
    B: 規定の制限速度より少なくとも時速10マイル（10 mph）低い速度、または時速25マイル（25 mph）のいずれか高い方まで
    C: 規定の制限速度より時速20マイル（20 mph）低い速度まで
    D: 作業員が移動するまで完全に停止しなければならない
  answer: B
  explanation: 車線変更が不可能な場合は、規定の制限速度より少なくとも時速10マイル低い速度、または時速25マイルのいずれか高い方まで減速し、停止できる準備をしておく必要があります。
- id: 183
  category: penalties_and_points
  question: 郵便配達員や清掃作業員の追い越しに関する法規に違反した場合の最大罰金額はいくらですか？
  choices:
    A: $50.00
    B: $100.00
    C: $250.00
    D: $500.00
  answer: C
  explanation: 郵便配達員や清掃作業員の追い越しに関する法規の違反は、250ドル以下の罰金に処されます。
- id: 184
  category: license_system
  question: ジョージア州の段階的運転免許プログラムにおいて、TADRAは何の略ですか？
  choices:
    A: Teen and Adult Driving Rules Act（10代および成人の運転規則法）
    B: Teenage and Driver Responsibility Act（10代およびドライバーの責任法）
    C: Traffic and Driving Regulations Act（交通および運転規制法）
    D: Teen Automotive Driving Requirements Act（10代の自動車運転要件法）
  answer: B
  explanation: 1997年に制定された「10代およびドライバーの責任法（TADRA）」は、ジョージア州の15歳から18歳の青少年を対象とした段階的運転免許プログラムを確立しました。
- id: 185
  category: license_system
  question: 18歳未満の申請者が免許を申請する場合、責任ある成人が同席する必要があります。この成人の最低年齢要件は何歳ですか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 法的保護者であれば最低年齢の制限はない
  answer: A
  explanation: 責任ある成人とは、18歳以上で、申請内容を証明する能力があり、申請者について個人的な知識を持っている人と定義されています。
- id: 186
  category: license_system
  question: 18歳未満の申請者が運転免許の在学要件を満たすために提出できる書類はどれですか？
  choices:
    A: クラスメートからの署名入りの手紙
    B: 在学証明書（DS-1）
    C: 中学校の通知表
    D: 図書カード
  answer: B
  explanation: 18歳未満の人が免許や許可証を取得するには特定の書類を提示する必要があり、その一つが在学証明書（DS-1）です。
- id: 187
  category: defensive_driving
  question: ジョージア州の運転マニュアルによると、衝突のリスクを高める一般的な運転中の注意散漫（ディストラクション）と見なされるのは次のうちどれですか？
  choices:
    A: 頻繁にミラーを確認すること
    B: 方向指示器（ウィンカー）を使用すること
    C: 同乗者やペットの存在
    D: ハンドルを両手で保持すること
  answer: C
  explanation: マニュアルでは、一般的な注意散漫として携帯電話での通話、メール送信、食事などを挙げており、「同乗者やペットの存在も衝突のリスクを高める可能性がある」と付け加えています。
- id: 188
  category: license_system
  question: クラスC仮免許（CP）で運転する場合、少なくとも何歳以上の人が同乗しなければなりませんか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 免許を持っている親または保護者であれば年齢は問わない
  answer: B
  explanation: クラスC車両の運転免許を所持し、運転席の隣に座る21歳以上の人が同乗している場合に限り、クラスC車両を運転することができます。
- id: 189
  category: driver_testing
  question: クラスC仮免許の試験手数料に関する規定はどうなっていますか？
  choices:
    A: 10ドルの手数料は、不合格の場合に全額返金される。
    B: 15ドルの手数料は、合格した後に支払う。
    C: 10ドルの手数料は試験前に支払う必要があり、不合格の場合でも返金されない。
    D: 最初の試験については手数料はかからない。
  answer: C
  explanation: マニュアルには、試験手数料は10ドルで、試験前に支払う必要があると記載されています。試験のいずれかの部分で不合格となった場合、返金は行われません。
- id: 190
  category: license_system
  question: クラスD暫定免許の保持者が運転を禁止されている時間帯はいつですか？
  choices:
    A: 午後10時から午前6時まで
    B: 午後11時から午前5時まで
    C: 午前0時から午前5時まで
    D: 午前1時から午前6時まで
  answer: C
  explanation: クラスD免許の保持者は、例外なく午前0時から午前5時の間は運転することができません。
- id: 191
  category: license_system
  question: クラスD仮免許（Class D Provisional License）を取得するには、ティーンエイジャーは累計で少なくとも合計何時間の運転経験を積む必要がありますか？
  choices:
    A: 夜間2時間を含む20時間
    B: 夜間5時間を含む30時間
    C: 夜間少なくとも6時間を含む40時間
    D: 夜間少なくとも10時間を含む50時間
  answer: C
  explanation: 夜間少なくとも6時間を含む、累計で少なくとも40時間の運転経験を完了している必要があります。
- id: 192
  category: driver_responsibility
  question: 親または法的保護者が未成年の学習許可証（Instructional Permit）または運転免許証の取り消しを希望する場合、いくらの手数料を支払う必要がありますか？
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: B
  explanation: 未成年の学習許可証または運転免許証の取り消しを申請する人は、10ドルの返金不可の手数料を支払う必要があります。
- id: 193
  category: penalties_and_points
  question: 21歳未満の人が、当て逃げ（Hit and Run）または無謀運転（Reckless Driving）で初めて有罪判決を受けた場合、免許停止期間はどのくらいになりますか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 12ヶ月
    D: 24ヶ月
  answer: B
  explanation: リストされた違反（当て逃げや無謀運転を含む）で有罪判決を受けた21歳未満の人の学習許可証または運転免許証は、初回の場合6ヶ月間停止されます。
- id: 194
  category: penalties_and_points
  question: 21歳未満の運転者において、以下のどの違反が免許停止につながりますか？
  choices:
    A: 制限速度を10マイル超える速度超過
    B: スクールゾーンでの不適切な駐車
    C: 制限速度を24マイル以上超える速度超過
    D: 方向指示器の使用義務違反
  answer: C
  explanation: 21歳未満の運転者は、4点以上の点数が加算される違反を犯すと免許停止になります。これには制限速度を24マイル以上超える速度超過が含まれます。
- id: 195
  category: penalties_and_points
  question: 18歳未満の運転者が、12ヶ月間に何点以上の点数を累積すると免許停止になりますか？
  choices:
    A: 2点以上
    B: 4点以上
    C: 6点以上
    D: 8点以上
  answer: B
  explanation: マニュアルによると、18歳未満の間に12ヶ月間で4点以上の点数を累積した場合、免許停止となります。
- id: 196
  category: license_system
  question: クラスD仮免許を取得する際、ADAPは何の略称ですか？
  choices:
    A: Adolescent Driving and Parking（青少年運転・駐車）
    B: Advanced Driver Assessment Protocol（高度運転者評価プロトコル）
    C: Alcohol and Drug Awareness Program（アルコール・薬物意識向上プログラム）
    D: Adult Driver Approval Process（成人運転者承認プロセス）
  answer: C
  explanation: クラスD仮免許を取得するには、アルコール・薬物意識向上プログラム（ADAP）の修了証明書を提示する必要があります。
- id: 197
  category: license_system
  question: ジョージア州でクラスM二輪車運転免許（Class M Motorcycle Operator's License）を取得するには、何歳である必要がありますか？
  choices:
    A: 15歳
    B: 16歳
    C: 17歳
    D: 18歳
  answer: C
  explanation: マニュアルには「クラスM二輪車運転免許を取得するには17歳である必要があります」と記載されています。
- id: 198
  category: penalties_and_points
  question: 初めてのDUI（飲酒・薬物影響下での運転）による免許停止で、黙示的同意に基づく検査（Implied Consent Testing）を拒否した場合、免許はどのくらいの期間停止されますか？
  choices:
    A: 最低6ヶ月間
    B: 最低12ヶ月間
    C: 最低18ヶ月間
    D: 最低24ヶ月間
  answer: B
  explanation: マニュアルによると、初回のDUIによる免許停止において、血中アルコール濃度（BAC）が.08以上であった場合、または黙示的同意に基づく検査を拒否した場合、免許は最低12ヶ月間停止されます。
- id: 199
  category: penalties_and_points
  question: 2回目のDUIによる免許停止期間中、運転者がイグニッション・インターロック（点火阻止装置）許可証の申請資格を得られるのはいつですか？
  choices:
    A: 停止後すぐ
    B: 30日後
    C: 120日後
    D: 6ヶ月後
  answer: C
  explanation: マニュアルによると、2回目のDUIによる免許停止の場合、免許は最低18ヶ月間停止されますが、120日後にイグニッション・インターロック許可証の申請資格が得られます。
- id: 200
  category: signs_and_signals
  question: 八角形の標識に近づいたとき、何をしなければなりませんか？
  choices:
    A: 停止せずに対向車に道を譲る
    B: 標示された停止線で完全に停止する
    C: 時速15マイルまで減速する
    D: 踏切に備える
  answer: B
  explanation: 八角形の標識は常に「停止（STOP）」を意味します。その標識に来たら、標示された停止線で完全に停止しなければなりません。
- id: 201
  category: signs_and_signals
  question: 丸い道路標識は何を示していますか？
  choices:
    A: 学校区域が前方にある
    B: 鉄道踏切に近づいている
    C: 優先権を譲らなければならない
    D: 追い越し禁止区間が始まる
  answer: B
  explanation: 丸い標識は、鉄道踏切に近づいていることを意味します。速度を落とし、見て、聞いて、停止する準備をするよう警告しています。
- id: 202
  category: safe_driving_rules
  question: 鉄道踏切での他車の追い越しに関する規則は何ですか？
  choices:
    A: 線路に車両がいなければ追い越し可能
    B: 商用車のみ追い越しが許可される
    C: すべての鉄道踏切で追い越しは禁止されている
    D: 時速20マイル（20 mph）以下で走行している場合は追い越し可能
  answer: C
  explanation: マニュアルには「すべての鉄道踏切において追い越しは禁止されている」と明記されています。
- id: 203
  category: signs_and_signals
  question: 五角形の標識は、何に近づいていることを示していますか？
  choices:
    A: 学校区域および／または通学路
    B: 中央分離帯のある幹線道路
    C: 病院区域
    D: 急な坂道
  answer: A
  explanation: 五角形の標識は、学校区域および／または通学路に近づいていることを意味します。
- id: 204
  category: signs_and_signals
  question: 五角形の標識は通常、学校の敷地や通学路の手前どのくらいの距離に設置されますか？
  choices:
    A: 50〜100フィート
    B: 150〜700フィート
    C: 500〜1000フィート
    D: 正確に1マイル
  answer: B
  explanation: 五角形の標識が使用される場合、学校の敷地または通学路の手前150フィート以上700フィート以内の場所に設置されます。
- id: 205
  category: signs_and_signals
  question: 規制標識にある、左上から右下への赤い斜線が入った赤い円は何を意味しますか？
  choices:
    A: 注意して進め
    B: 円の中に描かれた行為は禁止されている
    C: 前方に危険がある
    D: 直ちに停止しなければならない
  answer: B
  explanation: 左上から右下への赤い斜線が入った赤い円は「禁止」を意味することを覚えておいてください。円の中の絵は、何が禁止されているかを示しています。
- id: 206
  category: safe_driving_rules
  question: 進行方向に2つ以上の走行車線がある場合、低速の車両はどうすべきですか？
  choices:
    A: 左側（内側）の車線を走行する
    B: 中央車線のみを走行する
    C: 右側（外側）の車線を走行する
    D: 路肩を走行する
  answer: C
  explanation: マニュアルには、進行方向に2つ以上の走行車線がある場合、低速の車両は右側（外側）の車線を走行すべきであると記載されています。
- id: 207
  category: defensive_driving
  question: マニュアルによると、降雨時に路面が最も危険になるのはいつですか？
  choices:
    A: 雨が降り始めてからの最初の30分間
    B: 雨が2時間降り続いた後
    C: 雨が止んだ直後
    D: 雷を伴う雨のとき
  answer: A
  explanation: 滑りやすい路面の警告標識には次のように記されています。「濡れているとき、路面は滑りやすくなります。雨の降り始めの30分間が最も危険であることを忘れないでください。」
- id: 208
  category: vehicle_information
  question: 前方に急な坂道があることを示す警告標識を見たとき、どうすべきですか？
  choices:
    A: 速度を維持するために加速する
    B: 燃料を節約するためにニュートラルに入れる
    C: 速度を制御しブレーキを保護するために、低いギアにシフトする準備をする
    D: 直ちに非常ブレーキをかける
  answer: C
  explanation: 前方に急な坂道がある場合、マニュアルでは「速度を落とし、速度を制御してブレーキの損傷を防ぐために、低いギアにシフトする準備をすること」とアドバイスしています。
- id: 209
  category: signs_and_signals
  question: 「追い越し禁止区間（No Passing Zone）」の標識は、通常ハイウェイのどこに設置されていますか？
  choices:
    A: ハイウェイの右側
    B: ハイウェイの左側
    C: 中央車線の真上に吊り下げられている
    D: 路面にのみ描かれている
  answer: B
  explanation: マニュアルには、追い越し禁止区間の標識は「ハイウェイの左側にあり、追い越し禁止区間の始まりを示す」と記載されています。
- id: 210
  category: safe_driving_rules
  question: ソフトショルダー（路肩軟弱）を示す警告標識がある場合、路肩を走行してもよいのはどのようなときですか？
  choices:
    A: 低速車両を追い越す必要があるとき
    B: 右折したいとき
    C: 緊急時のみ
    D: 本線が混雑しているときはいつでも
  answer: C
  explanation: ソフトショルダーの警告標識は次のように示しています。「路肩が軟弱です。路肩の走行は緊急時のみにしてください。」
- id: 211
  category: sharing_the_road
  question: ジョージア州の法律の下で、公道の標識や交通信号に従う義務があるのは誰ですか？
  choices:
    A: 自動車の運転者のみ
    B: 自転車利用者を含むすべての運転者
    C: 商用車の運転者のみ
    D: 勤務中または非番の緊急作業員を除く全員
  answer: B
  explanation: ジョージア州の法律では、警察官や緊急作業員による指示がある場合を除き、自転車利用者を含むすべての運転者が公道の標識や交通信号に従うことが義務付けられています。
- id: 212
  category: penalties_and_points
  question: 初めてのDUI（酒気帯び・酒酔い運転）による免許停止において、血中アルコール濃度（BAC）が0.02以上0.08未満であった場合、最低の免許停止期間はどれくらいですか（過去に有罪判決がない場合）？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 12ヶ月
    D: 18ヶ月
  answer: B
  explanation: 血中アルコール濃度（BAC）が0.02以上0.08未満であった場合、過去に有罪判決がなければ、免許は最低6ヶ月間停止されます。
- id: 213
  category: vehicle_information
  question: ジョージア州の法律では、低速車両（slow-moving vehicle）はどのように定義されていますか？
  choices:
    A: 時速35マイル未満で走行する車両
    B: 時速25マイル未満で走行する車両
    C: 時速40マイル未満で走行する車両
    D: 時速15マイル未満で走行する車両
  answer: B
  explanation: 低速車両は、時速25マイル未満で走行する車両と定義されています。これらの車両は、法律により低速車両マーク（エンブレム）を表示することが義務付けられています。
- id: 214
  category: signs_and_signals
  question: ジョージア州のハイウェイにおいて、マイルポスト（距離標）の番号がゼロから始まるのはどこですか？
  choices:
    A: ルートが始まる北側または東側の境界
    B: 州の中心部
    C: ルートが始まる南側または西側の境界
    D: 各郡の境界線の開始地点
  answer: C
  explanation: マイルポストは路肩に1マイルごとに設置されています。ゼロ地点は常に、そのルートが始まる南側または西側の境界から始まります。
- id: 215
  category: signs_and_signals
  question: 建設および保守作業の警告標識は何色ですか？
  choices:
    A: 黄地に黒の記号
    B: 赤地に白の記号
    C: オレンジ地に黒の記号
    D: 青地に白の記号
  answer: C
  explanation: 建設や保守プロジェクトの警告標識は、前方の危険を知らせるために使用されます。これらの標識はオレンジ地に黒の記号で表示されます。
- id: 216
  category: signs_and_signals
  question: ガソリンスタンド、飲食店、宿泊施設などのサービス施設を案内する標識には何色が使用されていますか？
  choices:
    A: 緑と白
    B: 青と白
    C: 茶と白
    D: 黒と白
  answer: B
  explanation: ジョージア州のハイウェイを走行中、青と白の標識がサービス施設への案内を提供します。
- id: 217
  category: safe_driving_rules
  question: 次の車両のうち、I-85エクスプレス・レーンを無料で利用できるのはどれですか？
  choices:
    A: 1人乗りのすべての車両
    B: オートバイ
    C: 大型商用トラック
    D: ナンバープレートの種類に関わらずすべての電気自動車
  answer: B
  explanation: I-85エクスプレス・レーンでは、登録済みの公共交通機関、3人以上の相乗り車両（カープール）、オートバイ、緊急車両、および適切なAFVナンバープレートを付けた代替燃料車（AFV）が無料で通行できます。
- id: 218
  category: signs_and_signals
  question: 交通信号が全く機能していない交差点に近づいた場合、どうしなければなりませんか？
  choices:
    A: 右側の車両に道を譲ってから進む
    B: 全方向に対して一時停止標識があるものとして交差点を扱う
    C: 安全が確認できれば停止せずに交差点を通過する
    D: 通過する前に警察官が到着するのを待つ
  answer: B
  explanation: 交差点で交通信号が全く機能していない場合、すべての運転者はその交差点を全方向に一時停止標識があるものとして扱わなければなりません。
- id: 219
  category: signs_and_signals
  question: 黄色の矢印の点滅信号は何を示していますか？
  choices:
    A: 左折する前に完全に停止しなければならない
    B: 対向車や歩行者に道を譲った後、左折することができる
    C: 信号機が故障しているため、4方向一時停止として扱う必要がある
    D: 左折の優先権があり、対向車は停止しなければならない
  answer: B
  explanation: 黄色の矢印の点滅は、対向車や歩行者に道を譲った後に左折できることを意味します（対向車側はまだ青信号です）。
- id: 220
  category: signs_and_signals
  question: 歩行者横断用ビーコン（PHB）が赤色の交互点滅を表示しているとき、運転者はどうしなければなりませんか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止し、歩行者が横断歩道を渡り終えたら進む
    C: 停止し、信号が青に変わるまで待つ
    D: 歩行者に道を譲るが、停止する必要はない
  answer: B
  explanation: 歩行者横断用ビーコン（PHB）の赤色の交互点滅は、運転者に完全停止（STOP）を求めます。歩行者が横断歩道を渡り終えたら、進むことができます。
- id: 221
  category: signs_and_signals
  question: 停止線がある交差点で、運転者はどこで完全に停止しなければなりませんか？
  choices:
    A: 実際の停止標識や信号機の場所。
    B: 横断歩道を少し過ぎた場所。
    C: 停止線を越える前の、停止線の位置。
    D: 交差する交通が最もよく見える場所。
  answer: C
  explanation: 停止線がある場合、運転者は実際の停止標識や信号機の場所ではなく、停止線の手前で完全に停止しなければなりません。
- id: 222
  category: signs_and_signals
  question: 踏切で追い越しを禁止するために使用される路面標示は何ですか？
  choices:
    A: 道路の右端にある実線の白線。
    B: 道路の中央にある破線の黄線。
    C: センターラインの右側に配置された黄線。
    D: 二重の破線の白線。
  answer: C
  explanation: 踏切では、追い越しを防止するために、常にセンターラインの右側に黄線が配置されます。
- id: 223
  category: signs_and_signals
  question: 赤色の点滅信号に対して、運転者はどのように対応すべきですか？
  choices:
    A: 徐行し、注意して進む。
    B: 完全に停止し、一時停止標識と同様に扱う。
    C: 停止し、信号が青に変わるのを待つ。
    D: 右側の交通に道を譲り、停止せずに進む。
  answer: B
  explanation: 赤色の点滅信号は、完全に停止しなければならないことを意味します（一時停止標識と同様に扱います）。歩行者や他の車両に道を譲った後、注意して進んでください。
- id: 224
  category: signs_and_signals
  question: 2車線の道路にある1本の実線の黄線は何を示していますか？
  choices:
    A: 追い越し禁止区間。
    B: 安全が確認できれば追い越し可能な区間。
    C: 左折専用車線。
    D: 車道の右端。
  answer: A
  explanation: 2車線の道路にある1本の実線の黄線は、追い越しが禁止されている区間であることを示しています。
- id: 225
  category: sharing_the_road
  question: 歩行者が道路を横断中に歩行者用信号が点滅し始めた場合、どうすべきですか？
  choices:
    A: 引き返して元の歩道に戻る。
    B: 横断歩道の真ん中で止まって待つ。
    C: 反対側までできるだけ速く走る。
    D: そのまま通りを渡りきる。
  answer: D
  explanation: 歩行者用信号の点滅は、歩道から離れてはいけないことを意味しますが、すでに横断を始めている場合は、そのまま通りを渡りきってください。
- id: 226
  category: signs_and_signals
  question: 2車線の道路にある破線の黄線は何を示していますか？
  choices:
    A: 両方向とも追い越し禁止。
    B: どちらの方向からも安全に追い越しができる。
    C: この先で道幅が狭くなる。
    D: 踏切に近づいている。
  answer: B
  explanation: 破線の黄線は、車線が2つだけで、どちらの方向からも安全に追い越しができる場合に使用されます。
- id: 227
  category: signs_and_signals
  question: 路面にある2本の実線の白線は何を示していますか？
  choices:
    A: 車線変更禁止。
    B: 隣の車線への移動が許可されている。
    C: 停止の準備をしなければならない。
    D: 自転車専用車線。
  answer: A
  explanation: 2本の白線が実線である場合、車線変更は禁止されています。
- id: 228
  category: signs_and_signals
  question: 車道の左側にある黄色のエッジライン（路側線）の目的は何ですか？
  choices:
    A: 歩行者用横断歩道を示すため。
    B: 自転車レーンをマークするため。
    C: 幅の狭い中央分離帯や盛り上がった中央分離帯を警告するため。
    D: 高乗車効率車両（HOV）車線を指定するため。
  answer: C
  explanation: 左側の黄色いエッジラインは、幅の狭い中央分離帯や盛り上がった中央分離帯があることを警告するために使用されることがあります。
- id: 229
  category: safe_driving_rules
  question: 反対方向に進む車線が4車線以上ある道路を走行中、2本の実線の黄色いセンターラインを越えてもよいのはどのような時ですか？
  choices:
    A: 低速車両を追い越す時。
    B: 路地、私道、またはドライブウェイに左折して入る時。
    C: 交通渋滞の中で車線変更をする時。
    D: 2本の実線の黄線を越えることは決して許されない。
  answer: B
  explanation: これらの線は、路地、私道、ドライブウェイ、または別の通りへ左折して出入りする場合にのみ越えることができます。
- id: 230
  category: signs_and_signals
  question: 道路上に斜めの黄線で描かれたゼブラゾーン（導流帯）に遭遇したとき、どうすべきですか？
  choices:
    A: 低速車両を追い越すためにその標示の上を走行する。
    B: その標示エリア内に車両を駐車する。
    C: 常にこれらの標示の右側を通行する。
    D: そのエリアを利用してUターンをする。
  answer: C
  explanation: これらの標示は、道幅が狭くなっていることや、路上に障害物があることを示しています。常にこれらの標示の右側を通行してください。
- id: 231
  category: safe_driving_rules
  question: 中央左折車線に入ってから左折するまでに走行できる最大距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: 左折する地点から300フィート以内の場所でこの車線に入ることができます。
- id: 232
  category: sharing_the_road
  question: 自動車の運転者が自転車専用レーンを横切って走行することが許可されるのはどのような時ですか？
  choices:
    A: 低速車両を追い越すとき。
    B: 道路脇に車両を駐車するとき。
    C: 曲がるためにそこを横切るときのみ。
    D: 通常の車線が混雑しているとき。
  answer: C
  explanation: 自動車の運転者は、曲がるために横切る場合を除き、自転車専用レーンを走行したり、そこに駐車したりすることは禁止されています。
- id: 233
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）に入るとき、誰に優先権がありますか？
  choices:
    A: ラウンドアバウトに入ろうとしている車両。
    B: すでにラウンドアバウト内を走行している車両。
    C: 交差点に接近している最も大きな車両。
    D: 右側から進入してくる車両。
  answer: B
  explanation: ラウンドアバウトに入る際も、優先権に関する交通法規が適用されます。すでにラウンドアバウト内にいる他の交通に道を譲らなければなりません。
- id: 234
  category: safe_driving_rules
  question: ラウンドアバウト内では、交通はどの方向に循環しますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 8の字型
    D: 運転者が選択した方向
  answer: B
  explanation: ラウンドアバウト内の交通は常に反時計回りに循環します。
- id: 235
  category: defensive_driving
  question: 複数車線のラウンドアバウトを走行する際に守るべき重要なルールは何ですか？
  choices:
    A: 出口を出るために素早く車線変更する。
    B: 常に左側の車線から進入する。
    C: ラウンドアバウト内では車線変更をしない。
    D: 他の車両を進入させるためにラウンドアバウト内で停止する。
  answer: C
  explanation: 複数車線のラウンドアバウトを走行する際は、曲がりたい道路に到達するまでラウンドアバウト内を回り続ける必要があります。ラウンドアバウト内では車線変更をしないでください。
- id: 236
  category: sharing_the_road
  question: 熟練した自転車利用者は、どのようにラウンドアバウトを走行すべきですか？
  choices:
    A: できるだけ縁石に近づいて走る。
    B: 車両に追い越されないよう、車線の中央を走る。
    C: 常に自転車から降りて歩く。
    D: 交通の流れと逆方向に走る。
  answer: B
  explanation: 熟練した自転車利用者は、自動車の運転者と同じようにラウンドアバウトを走行することができます。縁石に沿って走るのではなく、車両に追い越されないよう車線の中央を走行してください。
- id: 237
  category: vehicle_information
  question: 車両の推奨タイヤ空気圧（psi）はどこで確認できますか？
  choices:
    A: ハンドル（ステアリングホイール）の上。
    B: 車両のドアジャム（ドアの開口部付近）。
    C: 車両のナンバープレートの上。
    D: エンジンブロックの上。
  answer: B
  explanation: 車に乗る前に、車両のドアジャムに記載されている推奨psi（空気圧）を使用してタイヤの空気圧を確認してください。
- id: 238
  category: vehicle_information
  question: ペニーテストでタイヤの溝を確認する際、安全な溝の深さがあることを示すのはどのような状態ですか？
  choices:
    A: エイブラハム・リンカーンの頭全体が見える。
    B: エイブラハム・リンカーンの頭の一部が溝で隠れている。
    C: ペニーが溝から落ちる。
    D: 溝が1/32インチ未満である。
  answer: B
  explanation: リンカーンの頭の一部が溝で隠れていれば、法的かつ安全な溝の深さで走行していることになります。
- id: 239
  category: safe_driving_rules
  question: 路上に駐車している場合、どのように安全に車両に近づき、乗り込むべきですか？
  choices:
    A: 交通に背を向けて、車道側から乗り込む。
    B: 対向車の方を向いて車両に近づき、可能であれば歩道側から乗り込む。
    C: 周りを見ずに、運転席のドアまで素早く走る。
    D: 助手席の窓から乗り込む。
  answer: B
  explanation: 路上に駐車している場合は、車両の歩道側から乗り込んでください。鍵を準備し、対向車の方を向いて車両に近づきます。
- id: 240
  category: driver_responsibility
  question: 車のイグニッションを入れる（エンジンをかける）直前に何をすべきですか？
  choices:
    A: ラジオをつける。
    B: シートベルトを締め、同乗者も同様に締めているか確認する。
    C: タイヤの空気圧を確認する。
    D: すべての窓を下げる。
  answer: B
  explanation: エンジンをかける前に、シートベルトを締め、同乗者も同様に締めていることを確認してください。
- id: 241
  category: safe_driving_rules
  question: 路上に駐車している車両に近づく際、どのように歩いて向かうべきですか？
  choices:
    A: 交通の流れに背を向けて
    B: 交通の流れに向き合って
    C: 助手席側からのみ
    D: 車両の後方から
  answer: B
  explanation: マニュアルによると、路上に駐車された車両に乗り込む際は、鍵を準備し、交通の流れに向き合う形で車両に近づくべきであるとされています。
- id: 242
  category: safe_driving_rules
  question: 一般的なルールとして、エアバッグに関する特定の指示がない車両において、ハンドルの推奨される手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 8時と4時の位置
    C: 9時と3時の位置
    D: 12時と6時の位置
  answer: C
  explanation: 一般的なルールとして、ハンドルを握る際は、左手を9時の位置に、右手を3時の位置に置きます。
- id: 243
  category: defensive_driving
  question: 濃霧の中を運転する際、どのライトを使用すべきですか？
  choices:
    A: ハイビーム（走行用前照灯）
    B: 駐車灯
    C: ハザードランプ
    D: ロービーム（すれ違い用前照灯）
  answer: D
  explanation: 濃霧の中では、明るい光が眩しさを生み出し、かえって視界を悪くするため、ヘッドライトをロービームにする必要があります。
- id: 244
  category: defensive_driving
  question: 標準的な乗用車において、部分的なハイドロプレーニング現象は何マイル（mph）から始まる可能性がありますか？
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: 標準的な乗用車では、時速35マイル（35 mph）という低速でも部分的なハイドロプレーニング現象が始まることがあります。
- id: 245
  category: defensive_driving
  question: 車両がハイドロプレーニング現象を起こし始めた場合、適切な対処法は何ですか？
  choices:
    A: すぐにブレーキを強く踏む
    B: 路肩に向かって急ハンドルを切る
    C: アクセルから足を離し、車を減速させる
    D: 溜まった水を突き抜けるために加速する
  answer: C
  explanation: ハイドロプレーニング現象が発生した場合は、アクセルから足を離し、自然に車を減速させる必要があります。
- id: 246
  category: defensive_driving
  question: 車両がスリップ（横滑り）し始めた場合、ハンドルをどのように操作すべきですか？
  choices:
    A: スリップしている方向とは逆に切る
    B: スリップしている方向に切る
    C: 完全に真っ直ぐに保持する
    D: 素早く前後に動かす
  answer: B
  explanation: スリップし始めたら、ハンドルをスリップしている方向（後輪が流れている方向）に切り始める必要があります。
- id: 247
  category: safe_driving_rules
  question: 雨が降り始めてからの最初の30分間が、運転において最も危険とされるのはなぜですか？
  choices:
    A: 視界が即座にゼロになるため
    B: ハイドロプレーニング現象は最初の30分間にしか発生しないため
    C: 水が路面上のオイルや化学物質と混ざり、非常に滑りやすくなるため
    D: 降り始めはブレーキが故障しやすいため
  answer: C
  explanation: 雨の降り始めの30分間が最も危険なのは、水が路面のオイルやその他の化学物質と混ざり、路面が極めて滑りやすくなるためです。
- id: 248
  category: defensive_driving
  question: カーブを走行中に速度が出すぎていることに気づいた場合、どうすべきですか？
  choices:
    A: 素早く減速するためにブレーキを強く踏む
    B: アクセルから足を離し、慎重にブレーキをかける
    C: ニュートラルに入れて、惰性でカーブを通り抜ける
    D: トラクションを高めるために少し加速する
  answer: B
  explanation: カーブで速度が出すぎている場合、スリップの原因となるため、ブレーキを強く踏んではいけません。代わりに、アクセルから足を離し、慎重にブレーキをかけながらハンドル操作を続けてください。
- id: 249
  category: defensive_driving
  question: 車両が予期せず路道から外れてしまった場合、すぐに舗装路に戻ろうとするのを避けるべきなのはなぜですか？
  choices:
    A: タイヤを傷めるため
    B: 過剰な修正や急ハンドルによって、制御不能になったり、スリップや横転を招いたりする可能性があるため
    C: レッカー車の助けを待たなければならないため
    D: 一時停止せずに路道に再進入することは違法であるため
  answer: B
  explanation: すぐに舗装路に戻ろうとしてはいけません。過剰な修正や「急ハンドル」は、スリップや横転を引き起こし、車両の制御を失う原因となります。
- id: 250
  category: safe_driving_rules
  question: 冬の天候下で初めて道路に入った際、安全が確認できる場合、どのように路面状況を確認すべきですか？
  choices:
    A: タイヤのグリップを確認するために急加速する
    B: 滑るかどうかを確認するために、急ブレーキをかける
    C: ブレーキを軽く試し、わずかなハンドル操作を行って反応を見る
    D: 車線をまたいでジグザグ走行をする
  answer: C
  explanation: 冬の天候で道路に入った直後は、ブレーキを軽く試したり、わずかなハンドル操作に対する車両の反応を確認したりすることで、路面の「感触」を掴むようにしてください。
- id: 251
  category: alcohol_drugs_health
  question: 一酸化炭素中毒の症状は次のうちどれですか？
  choices:
    A: 急な疲労感、あくび、めまい、吐き気
    B: 多動性および心拍数の増加
    C: 視界のかすみと耳鳴り
    D: 極度の空腹感と喉の渇き
  answer: A
  explanation: 一酸化炭素中毒の症状には、急な疲労感、あくび、めまい、吐き気があります。
- id: 252
  category: driver_responsibility
  question: 一酸化炭素中毒を防ぐために、絶対にやってはいけないことは何ですか？
  choices:
    A: 窓を開けて運転する
    B: ガレージ内でエンジンのをかけたままにする
    C: 高速道路を走行中にヒーターを使用する
    D: エンジンを切った状態で、開放されたドライブウェイに車を停める
  answer: B
  explanation: 一酸化炭素を避けるための簡単な予防策として、ガレージ内でエンジンのをかけたままにしないことが挙げられます。
- id: 253
  category: defensive_driving
  question: 走行中に突然タイヤがパンク（バースト）した場合、推奨される最初のステップは何ですか？
  choices:
    A: ブレーキを強く踏んで即座に停止する
    B: ハンドルをしっかりと握り、アクセルから足を離す
    C: 素早く路肩にハンドルを切る
    D: 前進する勢いを維持するために加速する
  answer: B
  explanation: 突然タイヤがパンクした場合は、ハンドルをしっかりと握り、アクセルから足を離して、車両が自然に転がって停止するようにします。
- id: 254
  category: signs_and_signals
  question: ダイバージング・ダイヤモンド・インターチェンジ（DDI）は、どのように交通の流れを改善しますか？
  choices:
    A: 高速道路に入る前に、すべての車両に4方向交差点での一時停止を義務付ける
    B: 交通の流れを一時的に道路の反対側に切り替えることで、停止することなくオンランプ（高速道路への進入路）へ左折できるようにする
    C: 大きな円形交差点（ラウンドアバウト）を使用して、交通を絶えず動かし続ける
    D: 高速道路へのアクセスを商用車のみに制限する
  answer: B
  explanation: ダイバージング・ダイヤモンド・インターチェンジ（DDI）は、交通の流れを一時的に道路の反対側に切り替えることで、車両が停止することなく左折して高速道路のオンランプに進入できるように設計されています。
- id: 255
  category: safe_driving_rules
  question: 標準的な乗用車がハイドロプレーニング現象を起こした際、タイヤが路面との接触を完全に失う可能性がある速度はどれくらいですか？
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: 標準的な乗用車では、35 mphから部分的なハイドロプレーニングが始まることがありますが、55 mphではタイヤが路面との接触を完全に失う可能性があります。
- id: 256
  category: vehicle_information
  question: 走行中に車両のイグニッション（点火スイッチ）を「ロック」位置にすると、どのような危険な状況が発生する可能性がありますか？
  choices:
    A: ブレーキが即座にロックされ、車が停止する
    B: 車両のステアリング（ハンドル）操作ができなくなる
    C: エンジンが急加速する
    D: ハザードランプが自動的に点滅する
  answer: B
  explanation: マニュアルによると、走行中に車両のイグニッションをロック位置にすると、車両のステアリング操作が無効になり、運転者はハンドル操作ができなくなります。
- id: 257
  category: safe_driving_rules
  question: 前方の車両との間に十分な車間距離を保っているかどうかを判断するには、どうすればよいですか？
  choices:
    A: 前方車両との間に、正確に車2台分の距離を保つ
    B: 停止状態から加速する前に3秒待つ
    C: 前方の車が目印を通過した後、「1001（せんいち）、1002（せんに）」と数える
    D: 前方車両の後輪が路面に接しているのが見えることを確認する
  answer: C
  explanation: マニュアルでは、前方の車が特定の目印を通過するのを確認し、「1001、1002」と数えることを推奨しています。数え終わる前に自分が同じ地点を通過した場合は、車間距離が近すぎます。
- id: 258
  category: defensive_driving
  question: 次の条件のうち、車間距離をさらに広げるべきなのはどれですか？
  choices:
    A: 悪天候時
    B: 渋滞時
    C: 夜間
    D: 上記のすべて
  answer: D
  explanation: マニュアルには、悪天候時、道路工事中、渋滞時、そして夜間は常に、前方車両との距離を通常よりもさらに広げるべきであると記載されています。
- id: 259
  category: safe_driving_rules
  question: 実際の停止距離を決定する要因として、マニュアルに記載されて「いない」ものは次のうちどれですか？
  choices:
    A: 風向および風速
    B: 舗装の種類および状態
    C: 時間帯
    D: 運転者の精神的および肉体的な反応
  answer: C
  explanation: マニュアルには、精神的・肉体的な反応、路面の種類や状態、タイヤ、シャシー設計、ブレーキ、風向・風速が停止距離に影響を与える要因として挙げられています。時間帯は記載されていません。
- id: 260
  category: safe_driving_rules
  question: 加速車線から高速道路に進入する場合、どちらに優先権がありますか？
  choices:
    A: 高速道路に進入しようとしている車両
    B: すでに高速道路を走行している車両
    C: より速い速度で走行している方の車両
    D: 一番右側の車線を走行している車両は、進入車両に譲らなければならない
  answer: B
  explanation: マニュアルには、「高速道路を走行中の車両に優先権がありますが、礼儀正しい運転者は高速道路の交通の流れに合流させてくれるでしょう」と記載されています。
- id: 261
  category: signs_and_signals
  question: アクセス制限道路（高速道路など）における「ゴア（Gore）」とは何ですか？
  choices:
    A: 緊急時用の指定休憩エリア。
    B: 2つの車線が合流する地点にある、通常は実線の白線で囲まれた区域。
    C: 高乗車人数車線（HOV）用の料金所車線。
    D: 反対方向に進む交通を分ける中央分離帯。
  answer: B
  explanation: マニュアルでは、ゴアを「2つの車線の合流地点にある区域...通常は三角形に似た形で、既存の走行車線と合流車線の間の実線の白線によって形成される」と定義しています。
- id: 262
  category: signs_and_signals
  question: 高乗車人数車線（HOV車線）は、路面にどのように表示されていますか？
  choices:
    A: 両側に黄色の実線。
    B: ペイントされた自転車のシンボル。
    C: ひし形のシンボル（ダイヤモンド・マーク）。
    D: 大きな白い「X」印。
  answer: C
  explanation: マニュアルによると、HOV車線にはひし形のシンボルが表示されており、制限時間が掲示されています。
- id: 263
  category: penalties_and_points
  question: ジョージア州において、HOV車線の利用制限違反の初犯に対する罰則は何ですか？
  choices:
    A: 最大75ドルの罰金。
    B: 最大100ドルの罰金。
    C: 最大150ドルの罰金と運転記録への1ポイントの加算。
    D: 30日間の免許停止。
  answer: A
  explanation: HOV車線の利用制限違反に対する罰則は、初犯の場合、最大75ドルの罰金です。
- id: 264
  category: safe_driving_rules
  question: 高乗車人数有料車線（HOT車線）を無料で利用できるのはどの車両ですか？
  choices:
    A: 乗員がちょうど2名のすべての車両。
    B: 登録済みの公共交通機関、3人以上の相乗り車両、オートバイ、緊急車両、および代替燃料車（AFV）。
    C: 商用の大型トレーラー。
    D: オフピーク時間帯に走行するすべての車両。
  answer: B
  explanation: HOT車線では、登録済みの公共交通機関、3人以上の相乗り車両、オートバイ、緊急車両、および代替燃料車が無料で車線を利用することを許可されています。
- id: 265
  category: safe_driving_rules
  question: 高速道路で他の車両を追い越す際、右側の車線に戻っても安全なタイミングはいつですか？
  choices:
    A: 自分のフロントバンパーが相手の車両を追い越した直後。
    B: 追い越したばかりの車がバックミラーにはっきりと見えるようになったとき。
    C: 相手のドライバーがヘッドライトを点滅させたとき。
    D: 左車線を少なくとも1マイル走行した後。
  answer: B
  explanation: マニュアルでは、「追い越したばかりの車がバックミラーにはっきりと見えるようになるまで、右側の車線に戻ってはいけません」とアドバイスしています。
- id: 266
  category: safe_driving_rules
  question: 高速道路で後退（バック）運転が許可されるのはどのような状況ですか？
  choices:
    A: 出口を通り過ぎてしまい、後方に交通がない場合。
    B: 窓から物を落としてしまった場合。
    C: ひどい渋滞中に、手前の出口に戻るため。
    D: 高速道路での後退運転はいかなる状況下でも禁止されています。
  answer: D
  explanation: マニュアルには明確に、「逆走（バック）しないでください。高速道路での後退運転はいかなる状況下でも禁止されています」と記載されています。
- id: 267
  category: safe_driving_rules
  question: 高速道路の路肩に停車することが許可される「正当な緊急事態」とみなされるのは、次のうちどれですか？
  choices:
    A: 運転手を交代する場合。
    B: 長旅の途中で足を伸ばしてストレッチをする場合。
    C: 車両の後部から荷物を取り出す場合。
    D: 上記のいずれでもない。
  answer: D
  explanation: マニュアルでは、路肩への停車は緊急時のみ許可されると述べており、「運転手の交代、ストレッチ、または車両の後ろから荷物を取り出すことは緊急事態とはみなされません」と明記されています。
- id: 268
  category: safe_driving_rules
  question: 高速道路の出口に向かう準備として走行車線内で減速する場合、何をすべきですか？
  choices:
    A: 他のドライバーに警告するためにクラクションを鳴らす。
    B: ブレーキランプまたは方向指示器（ウィンカー）を使用して、後続車に速度の変化を知らせる。
    C: ハザードランプを点灯させる。
    D: ギアをニュートラルに入れる。
  answer: B
  explanation: マニュアルには、「出口に向かう準備として走行車線内で減速する場合、ドライバーはブレーキランプまたは方向指示器を使用して、後続のドライバーに速度の変化を知らせる必要があります」と記載されています。
- id: 269
  category: sharing_the_road
  question: 大型トレーラー（トラクター・トレーラー）の死角を走行するのが特に危険なのはなぜですか？
  choices:
    A: 乗用車よりもはるかに速いスピードで走行するため。
    B: その大きさゆえに視認性が限られているため。
    C: 高速道路の路肩に頻繁に停車するため。
    D: 右側の車線を走行することが許可されていないため。
  answer: B
  explanation: マニュアルでは死角に入らないよう警告しており、特に大型車両について次のように述べています。「18輪車としても知られるトラクター・トレーラーの組み合わせは、その大きさのために視認性が限られています」。
- id: 270
  category: driver_responsibility
  question: 一酸化炭素中毒の被害者に遭遇した場合、まず最初にすべきことは何ですか？
  choices:
    A: 飲み水を与える。
    B: 被害者を新鮮な空気のある場所に移動させる。
    C: 顔に泥や土を塗る。
    D: 側溝に水がないか確認する。
  answer: B
  explanation: マニュアルでは、「一酸化炭素中毒の被害者を新鮮な空気のある場所に移動させ、救急医療サービスに連絡し、必要であれば人工呼吸を行ってください...」と指示しています。
- id: 271
  category: safe_driving_rules
  question: マニュアルによると、高速道路の路肩に停車することが認められる理由として、適切なものは次のうちどれですか？
  choices:
    A: 運転手の交代
    B: 車両の後部から荷物を取り出すため
    C: 足を伸ばして休憩するため
    D: 車両の故障または真の緊急事態が発生した場合
  answer: D
  explanation: マニュアルでは、路肩への停車は非常に危険であり、緊急時のみ許可されると規定されています。運転手の交代、ストレッチ、荷物の取り出しなどは緊急事態とはみなされません。
- id: 272
  category: safe_driving_rules
  question: 高速道路で緊急停車が必要になった場合、トラブルが発生していることを知らせるために何をすべきですか？
  choices:
    A: 助けを求めて高速道路沿いを歩く
    B: ボンネットを上げ、非常点滅表示灯（ハザードランプ）を点灯させる
    C: 車線内に立ち、腕を振る
    D: 助けが来るまで継続的にクラクションを鳴らす
  answer: B
  explanation: 高速道路で停車する必要がある場合は、ボンネットを上げ、ハザードランプを点灯させてトラブルを知らせる必要があります。マニュアルでは、助けを求めて高速道路沿いを歩かないよう明示的に警告しています。
- id: 273
  category: defensive_driving
  question: 「高速道路催眠現象（ハイウェイ・ヒプノーシス）」とは何ですか？
  choices:
    A: 高速道路での単調な運転によって引き起こされる、眠気や意識が低下した状態
    B: 刺激薬の影響下で運転することを指す法律用語
    C: 道路の中央線に集中するために使用されるテクニック
    D: 点滅する左折信号を凝視する行為
  answer: A
  explanation: 高速道路の運転手は、単調な景色、風の音、路面を走るタイヤの音、エンジンの一定したうなり音などによって引き起こされる、眠気や意識低下の状態である「高速道路催眠現象（ハイウェイ・ヒプノーシス）」に陥ることがあります。
- id: 274
  category: defensive_driving
  question: 長距離ドライブで注意力を維持し、高速道路催眠現象を避けるためには、どうすればよいですか？
  choices:
    A: 道路の中央線を凝視する
    B: 眠気を覚ますために刺激薬を服用する
    C: 道路のあちこちに絶えず視線を動かし続ける
    D: 直前の車両だけに集中する
  answer: C
  explanation: 長距離ドライブでは、注意力を維持するために「目を動かす」ことが良い方法です。道路のあちこちに視線を動かし続け、遠くや近く、左右にある様々な物体に焦点を合わせるようにしてください。
- id: 275
  category: defensive_driving
  question: 防衛運転（ディフェンシブ・ドライビング）の際、運転中は常に「回避ルート（エスケープ・ルート）」を考えておく必要があります。これはどういう意味ですか？
  choices:
    A: 高速道路から出るための最短の方法を計画すること
    B: 他の車両が自分の車線に進入してきた場合に備え、安全に回避できる場所を探しておくこと
    C: 目的地までの最短ルートを見つけること
    D: 最寄りの休憩所の場所を把握しておくこと
  answer: B
  explanation: 回避ルートを考えるとは、対向車が自分の車線側に越境してきた場合にどう対処するかを判断するために、路肩や周辺エリアを注意深く見ておくことを意味します。
- id: 276
  category: vehicle_information
  question: 走行中にアクセルペダルが戻らなくなった（固着した）場合、どうすればよいですか？
  choices:
    A: すぐにパーキング（P）に入れる
    B: イグニッションを切り、ステアリングホイールをロックする
    C: ギアをニュートラル（N）に入れ、ステアリング操作に集中する
    D: アクセルペダルを繰り返し踏み込む
  answer: C
  explanation: アクセルが固着した場合は、足でペダルを叩いてみるか、ギアをニュートラルに入れ、ステアリング操作に集中し、ブレーキを使用し、イグニッションを切ります（ただし、ハンドルがロックされない位置まで）。
- id: 277
  category: vehicle_information
  question: ブレーキが故障した場合、推奨される行動は次のうちどれですか？
  choices:
    A: 高いギアにシフトアップする
    B: 低いギアにシフトダウンし、パーキングブレーキを使用する
    C: イグニッションを切り、ステアリングホイールをロックする
    D: 交通の流れから抜けるために加速する
  answer: B
  explanation: ブレーキが故障した場合、マニュアルでは、低いギアへのシフトダウン、パーキングブレーキの使用、タイヤを縁石にこすりつけること、そして安全に減速して停止できる場所を探すことを推奨しています。
- id: 278
  category: vehicle_information
  question: 深い水たまりを走行した後、濡れたブレーキを乾かすにはどうすればよいですか？
  choices:
    A: 高速で走行して風で乾かす
    B: ニュートラルに入れて惰性で走る
    C: 低いギアでゆっくり走行しながら、軽くブレーキをかける
    D: 加速しながらブレーキを素早く繰り返し踏む
  answer: C
  explanation: 濡れたブレーキは、低いギアでゆっくり走行しながら軽くブレーキをかけることで乾かすことができます。
- id: 279
  category: vehicle_information
  question: アトランタ周辺の13郡の都市圏において、毎年の排ガス検査義務が免除される車両はどれですか？
  choices:
    A: すべての小型トラック
    B: 製造から10年経過した車両
    C: 直近の3つのモデルイヤー（年式）の車両
    D: 年間の走行距離が10,000マイル未満の車両
  answer: C
  explanation: 製造から25年未満のガソリン車および小型トラックは検査に合格する必要がありますが、直近の3つのモデルイヤー（年式）の車両はこの義務から免除されます。
- id: 280
  category: vehicle_information
  question: マニュアルによると、車両を10秒間アイドリングさせるとどうなりますか？
  choices:
    A: エンジンを再始動するよりも多くの燃料を消費する
    B: バッテリーが完全に充電される
    C: 走行する場合と比較してエンジンの摩耗が減少する
    D: ブレーキが故障する原因となる
  answer: A
  explanation: 車両を10秒間アイドリングさせると、エンジンを再始動するよりも多くの燃料を消費します。アイドリングを最小限に抑えることで、燃料消費、エンジンの摩耗、および大気汚染を減らすことができます。
- id: 281
  category: sharing_the_road
  question: ジョージア州の法律では、横断歩道内を横断している歩行者に対し、運転者はいつ停止し、停止し続けなければなりませんか？
  choices:
    A: 歩行者が車両の直前にいるときのみ
    B: 歩行者が車両の走行している側の車線にいるとき、またはその車線から1車線以内に近づいているとき
    C: 横断歩道に白線が引かれている場合のみ
    D: 信号が赤のときのみ
  answer: B
  explanation: 歩行者が車両の走行している側の車線にいるとき、またはその車線から1車線以内に近づいているときは、運転者は停止し、停止し続けなければなりません。
- id: 282
  category: sharing_the_road
  question: 歩行者の優先権に関する法律において、「道路の半分（half of the roadway）」とは何を意味しますか？
  choices:
    A: 通りの正確な中心線
    B: 歩道に最も近い車線
    C: 一方向の通行を担うすべての車線
    D: 対向車線を分ける中央分離帯
  answer: C
  explanation: 「道路の半分」とは、一方向の通行を担うすべての車線を意味します。
- id: 283
  category: sharing_the_road
  question: 横断歩道に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 横断歩道は、白線で示されている場合にのみ存在する
    B: 横断歩道は、白線で示されていなくても、交差点の4つの角すべてに存在する
    C: 歩行者は、ブロックの中間にある横断歩道でのみ優先権を持つ
    D: 信号が青であれば、運転者は横断歩道を塞いでもよい
  answer: B
  explanation: 横断歩道は、白線で示されていなくても、交差点の4つの角すべてに存在します。横断歩道とは、歩道が通りを横切って延びる部分の路面を指します。
- id: 284
  category: sharing_the_road
  question: 通りを横断している視覚障害のある歩行者に近づく際、いつ優先権を譲らなければなりませんか？
  choices:
    A: 標識のある横断歩道にいる場合のみ
    B: 白い杖を持っているか、盲導犬を連れている場合は常に
    C: 信号が赤の場合のみ
    D: 日中の時間帯のみ
  answer: B
  explanation: 盲導犬を使用している、または白い杖を持っている歩行者には、常に優先権を譲らなければなりません。
- id: 285
  category: safe_driving_rules
  question: 赤信号で右折待ちをする際、車両をどこで停止させるべきですか？
  choices:
    A: 交通状況をよく確認するために、横断歩道の真ん中
    B: 歩行者が安全に横断できるように、横断歩道の手前
    C: 横断歩道を越えた位置
    D: 交差点内
  answer: B
  explanation: 赤信号で右折する前に、運転者は横断歩道の手前で完全に停止しなければなりません。横断歩道を塞ぐことは歩行者を危険にさらすため、避ける必要があります。
- id: 286
  category: safe_driving_rules
  question: 赤信号で右折する前に、運転者は何をしなければなりませんか？
  choices:
    A: 停止せずに減速し、他の車両に道を譲る
    B: 横断歩道の手前で完全に停止する
    C: 曲がる前に歩行者に警告するためにクラクションを鳴らす
    D: 横断歩道に歩行者が見える場合のみ停止する
  answer: B
  explanation: マニュアルによると、赤信号で右折する前に、運転者は横断歩道の手前で完全に停止しなければなりません。
- id: 287
  category: sharing_the_road
  question: 多車線道路の横断歩道で停止する場合、車両をどのくらい手前で停止させるべきですか？
  choices:
    A: 横断歩道の線の上ちょうど
    B: 横断歩道の少なくとも5フィート手前
    C: 横断歩道の少なくとも10フィート手前
    D: 横断歩道の少なくとも20フィート手前
  answer: C
  explanation: マニュアルには、多車線道路の横断歩道で停止する場合、隣の車線の運転者が歩行者を確認できるように、横断歩道の少なくとも10フィート手前で停止すべきであると記載されています。
- id: 288
  category: safe_driving_rules
  question: マニュアルによると、時速40マイル（40 mph）で走行中の自動車にはねられた場合の歩行者の死亡リスクはどのくらいですか？
  choices:
    A: 20%
    B: 50%
    C: 少なくとも80%
    D: 100%
  answer: C
  explanation: マニュアルには、歩行者が時速40マイルで走行中の自動車にはねられた場合、歩行者の死亡リスクは少なくとも80%になると記されています。
- id: 289
  category: sharing_the_road
  question: ジョージア州において、自転車の走行が法的に認められていない道路は次のうちどれですか？
  choices:
    A: 多車線の市街地道路
    B: 田舎の2車線ハイウェイ
    C: 州間高速道路（インターステート）およびアクセス制限のある高速道路
    D: 指定の自転車レーンがない道路
  answer: C
  explanation: 自転車利用者は、州間高速道路（インターステート）およびそれに類する高速道路（アクセス制限のある高速道路）を除き、ジョージア州のすべての道路を走行する法的権利があります。
- id: 290
  category: sharing_the_road
  question: 自動車が自転車を追い越す際に確保しなければならない、法的に定められた最小の間隔はどのくらいですか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 5フィート
    D: 6フィート
  answer: B
  explanation: マニュアルでは、自動車が自転車を追い越す際に確保すべき法的な最小間隔は3フィートと規定されています。
- id: 291
  category: penalties_and_points
  question: 自転車利用者の接近および追い越しに関する法に違反した場合の罰則は何ですか？
  choices:
    A: 初犯の場合は警告
    B: 重罪（felony）の判決および免許停止
    C: 最大250.00ドルの罰金が科せられる軽罪（misdemeanor）
    D: 500.00ドルの罰金および免許の点数3点
  answer: C
  explanation: 自転車の接近および追い越しに関する規則の違反は、最大250.00ドルの罰金が科せられる軽罪（misdemeanor）となります。
- id: 292
  category: sharing_the_road
  question: 自転車利用者を追い越すために安全に車線変更ができない場合、速度をどのように調整しなければなりませんか？
  choices:
    A: 正確に時速15マイルまで減速する
    B: 掲示された制限速度より少なくとも時速10マイル低い速度、または時速25マイルのいずれか高い方まで減速する
    C: 掲示された制限速度より時速5マイル低い速度まで減速する
    D: 自転車利用者が移動するまで完全に停止する
  answer: B
  explanation: 車線変更が不可能、禁止、または安全でない場合は、掲示された制限速度より少なくとも時速10マイル低い速度、または時速25マイルのいずれか高い方の速度まで減速しなければなりません。
- id: 293
  category: safe_driving_rules
  question: 運転者が専用の自転車レーンを走行したり、そこに駐車したりすることが許可されるのはいつですか？
  choices:
    A: 右側から低速車両を追い越すとき
    B: 自転車利用者が周りにいないとき
    C: 交差点で右折するとき
    D: 運転者が自転車レーンを走行したり駐車したりすることは決して許可されない
  answer: D
  explanation: マニュアルには「運転者は自転車レーンを走行したり、そこに駐車したりしてはならない」と明記されています。自転車レーンは自転車の利用専用です。
- id: 294
  category: defensive_driving
  question: オートバイのシルエットが小さいことは、他の運転者からの見え方にどのような影響を与えますか？
  choices:
    A: 実際よりも近くに、また速く走っているように見える
    B: 実際よりも遠くに、また遅く走っているように見える
    C: 死角にいても見えやすくなる
    D: オートバイの速度や距離の認識には影響を与えない
  answer: B
  explanation: マニュアルによると、オートバイはシルエットが小さいため、実際よりも遠くにいたり、遅い速度で走行しているように見えたりすることがあります。
- id: 295
  category: sharing_the_road
  question: オートバイとの車線共有について、正しいものはどれですか？
  choices:
    A: オートバイが車線の右端を走行している場合は、車線を共有してもよい
    B: コンパクトカーを運転している場合は、車線を共有してもよい
    C: オートバイには車線の全幅を使用する権利があり、車線を共有してはならない
    D: オートバイを追い越すときに限り、車線を共有できる
  answer: C
  explanation: オートバイには操縦のために車線の全幅を使用することが認められており、マニュアルには「車線を共有してはならない」と明記されています。
- id: 296
  category: defensive_driving
  question: 自動車とオートバイの衝突事故が最も発生しやすい場所はどこですか？
  choices:
    A: 州間高速道路上
    B: 交差点
    C: 駐車場内
    D: 田舎の2車線道路
  answer: B
  explanation: マニュアルでは、通常、自動車の運転者がオートバイに気づかないことが原因で、交差点が自動車とオートバイの衝突事故が最も発生しやすい場所であると述べています。
- id: 297
  category: defensive_driving
  question: オートバイの方向指示器が点滅していても、実際に曲がるのを確認してから進むべきなのはなぜですか？
  choices:
    A: オートバイの方向指示器は暗すぎてはっきりと見えないことが多いため
    B: オートバイの指示器は自動キャンセル機能がない場合があり、ライダーが消し忘れている可能性があるため
    C: オートバイのライダーは、停止することを示すために頻繁に方向指示器を使用するため
    D: 車両の方向指示器が点滅している間に進行することは違法であるため
  answer: B
  explanation: オートバイの方向指示器には自動キャンセル機能（オートキャンセル）が備わっていない場合があり、ライダーが消し忘れることがあるため、点滅しているだけで判断しないようマニュアルは警告しています。
- id: 298
  category: safe_driving_rules
  question: オートバイの後方を走行する際、推奨される車間距離はどれくらいですか？
  choices:
    A: 1〜2秒
    B: 2〜3秒
    C: 3〜4秒
    D: 5〜6秒
  answer: C
  explanation: オートバイの後方を走行する際は、ライダーが緊急時に操縦や停止を行うための十分な時間を確保できるよう、より長い車間距離（3〜4秒）を空ける必要があります。
- id: 299
  category: vehicle_information
  question: 乾燥した路面状況において、オートバイの制動能力は自動車と比較してどうですか？
  choices:
    A: 自動車の方がオートバイよりもはるかに素早く停止できる
    B: オートバイの方が自動車よりも素早く停止できる
    C: どちらの車両も全く同じ停止距離を必要とする
    D: オートバイは乾燥した路面状況では安全に停止できない
  answer: B
  explanation: マニュアルには、乾燥した路面状況では、オートバイは自動車よりも素早く停止できると記載されています。
- id: 300
  category: safe_driving_rules
  question: 歩道を横切って私道や路地から出る際、運転者は何をしなければなりませんか？
  choices:
    A: クラクションを鳴らし、停止せずに進む
    B: 減速し、他の自動車に対してのみ譲る
    C: 歩道の手前で停止し、歩行者が安全に通過した後にのみ進む
    D: 歩行者がすでに車両の直前にいる場合にのみ停止する
  answer: C
  explanation: 私道、路地、または駐車場から出入りする際は、歩道の手前で停止し、歩行者が安全に通過した後にのみ進まなければなりません。
- id: 301
  category: sharing_the_road
  question: 乗客の乗降のために停車しているスクールバスに対して、いつ停車する必要がありますか？
  choices:
    A: 道路の種類に関わらず、常に停車する必要がある。
    B: バスと同じ方向に進んでいる場合のみ停車する必要がある。
    C: ほとんどの場合。ただし、中央分離帯で仕切られた高速道路の反対車線を走行している場合を除く。
    D: 指定されたスクールゾーンを走行している時のみ停車する必要がある。
  answer: C
  explanation: ほとんどの場合、すべての運転者は点滅灯をつけた停車中のスクールバスに対して停車しなければなりません。例外は、中央分離帯で道路が仕切られている場合で、この場合はバスと同じ方向に進んでいる車両のみが停車する必要があります。
- id: 302
  category: penalties_and_points
  question: ジョージア州において、停車中のスクールバスを不法に追い越した場合の罰則は何ですか？
  choices:
    A: 最大500ドルの罰金
    B: 運転記録に最大6点の加点
    C: 即時の車両押収
    D: 初回違反に対する警告
  answer: B
  explanation: 停車中のスクールバスの追い越しに対するジョージア州の罰金と罰則には、強制的な出廷、運転記録への最大6点の加点、および最大1,000ドルの罰金が含まれます。
- id: 303
  category: penalties_and_points
  question: 21歳未満の運転者が停車中のスクールバスを不法に追い越して違反が確定した場合、どのような罰則がありますか？
  choices:
    A: 免許停止
    B: 運転免許試験の強制再受験
    C: 運転記録に10点の加点
    D: 社会奉仕活動のみ
  answer: A
  explanation: ジョージア州の罰金と罰則の規定によると、21歳未満で停車中のスクールバスを不法に追い越して違反が確定した場合、免許停止処分となります。
- id: 304
  category: sharing_the_road
  question: 時速55マイルで走行している荷物を満載したトラクター・トレーラーは、乗用車と比較してどのくらいの停止距離が必要ですか？
  choices:
    A: 同じ距離
    B: 2倍の距離
    C: 3倍の距離
    D: 4倍の距離
  answer: C
  explanation: 時速55マイルで走行している荷物を満載したトラクター・トレーラーが停止するには、乗用車が必要とする距離の3倍の距離が必要です。
- id: 305
  category: sharing_the_road
  question: 商用車と道路を共有する際、「ノー・ゾーン (No-Zone)」という用語は何を指しますか？
  choices:
    A: 駐車が禁止されている指定区域
    B: 制限速度が厳格に適用されるスクールゾーン
    C: トラックやバスの周囲にある危険なエリアや死角
    D: 商用車専用の車線
  answer: C
  explanation: 「ノー・ゾーン (No-Zone)」は、トラックやバスの周囲にある、事故が発生しやすい危険なエリアを表します。これには、運転者の視界から自車が消えてしまう実際の死角も含まれます。
- id: 306
  category: safe_driving_rules
  question: トラック運転手のサイド・ノー・ゾーンを走行しているかどうかを、どのように判断できますか？
  choices:
    A: 制限速度ちょうどで走行している。
    B: 相手のサイドミラーに運転手の顔が見えない。
    C: トラックの後ろを車3台分以上の車間距離を空けて走行している。
    D: 自分のバックミラーにトラックの前面全体が見える。
  answer: B
  explanation: トラックやバスの両側には大きなノー・ゾーンがあります。サイドミラーに運転手の顔が見えない場合、運転手からもあなたの姿は見えていません。
- id: 307
  category: sharing_the_road
  question: トラックやバスの右側のノー・ゾーンが特に危険なのはなぜですか？
  choices:
    A: トラックは右側の方が加速が速いため。
    B: トラックやバスの運転手は、大きく膨らんで右折（ワイド・ライト・ターン）する必要があるため。
    C: 右側のミラーは通常小さいため。
    D: 商用車は左車線を走行することが許可されていないため。
  answer: B
  explanation: 右側のノー・ゾーンが特に危険なのは、トラックやバスの運転手が大きく膨らんで右折する必要があるためです。
- id: 308
  category: defensive_driving
  question: フロント・ノー・ゾーンを避けるために、トラックやバスの前に合流する前に何をすべきですか？
  choices:
    A: トラックよりも少なくとも時速10マイル速く走行していることを確認する。
    B: 自分のサイドミラーにトラックのヘッドライトが見えることを確認する。
    C: 自分のバックミラーにトラックやバスの前面全体が見えることを確認する。
    D: 合流する前にクラクションを鳴らして運転手に知らせる。
  answer: C
  explanation: フロント・ノー・ゾーンを避けるために、車線変更や合流をする前に、自分のバックミラーにそのトラックやバスの前面全体が映っていることを確認してください。
- id: 309
  category: safe_driving_rules
  question: ジョージア州のTACTプロジェクトによると、商用車の直前に無理に割り込むのを避けるために推奨される車間距離はどれくらいですか？
  choices:
    A: 時速10マイルごとに車1台分の距離
    B: 速度に関わらず車2台分の距離
    C: 3秒間の車間距離
    D: 常に50フィート
  answer: A
  explanation: ジョージア州のTACTプロジェクトでは、商用車の前に安全に合流し、無理な割り込みを避けるために、時速10マイルごとに車1台分の車間距離を空けることを推奨しています。
- id: 310
  category: safe_driving_rules
  question: マニュアルによると、速度はすべての死亡事故のほぼどの程度の割合で要因となっていますか？
  choices:
    A: 4分の1
    B: 3分の1
    C: 2分の1
    D: 3分の2
  answer: B
  explanation: マニュアルには、速度はすべての死亡事故のほぼ3分の1において要因となっていると記載されています。
- id: 311
  category: license_system
  question: 申請時に必要な情報や正確な情報を提供しなかった場合、どのような免許の取り下げが行われますか？
  choices:
    A: 停止 (Suspension)
    B: 取り消し (Revocation)
    C: 無効化 (Cancellation)
    D: 資格剥奪 (Disqualification)
  answer: C
  explanation: 運転者サービス局（DDS）は、申請時に必要な情報や正確な情報が提供されなかった場合、免許を無効化（Cancel）する権限を持っています。
- id: 312
  category: license_system
  question: 運転免許が取り消された（Revocation）場合、取り消し期間終了後に運転資格を再取得するには何をしなければなりませんか？
  choices:
    A: 新規免許を申請する。
    B: 罰金を支払い、古い免許を返却してもらう。
    C: 免許が自動的に復帰するのを待つ。
    D: DDSに控訴状を送る。
  answer: A
  explanation: 免許が取り消された場合、すべての運転資格は終了します。取り消し期間の終了後、居住者は新規免許を申請することができます。
- id: 313
  category: license_system
  question: 商用運転免許（CDL）の資格が剥奪（Disqualification）された場合、非商用（一般）の運転資格はどうなりますか？
  choices:
    A: 同じ期間、自動的に停止される。
    B: 永久に取り消される。
    C: CDLの資格剥奪自体によって停止または取り消されることはない。
    D: 日中の運転のみに制限される。
  answer: C
  explanation: 商用運転資格の剥奪（Disqualification）は、それ自体では、免許保持者の非商用（一般）自動車を運転する資格の停止や取り消しをもたらすものではありません。
- id: 314
  category: license_system
  question: ジョージア州において、特定の重大な違反で有罪判決を受けた場合の商用運転資格に対する最大罰則は何ですか？
  choices:
    A: 10年間の停止
    B: 商用運転資格の終身剥奪
    C: 最大10,000ドルの罰金
    D: 5年間の資格剥奪
  answer: B
  explanation: ジョージア州では、特定の違反で有罪判決を受けた場合、商用運転資格を終身（LIFE）失う可能性があります。
- id: 315
  category: sharing_the_road
  question: 点滅灯をつけたスクールバスのために停車した場合、法的に運転の再開が許可されるのはいつですか？
  choices:
    A: バスのドアが閉まったらすぐ。
    B: バスの運転手が手招きしたら。
    C: 60秒が経過した後。
    D: バスが動き出すか、警告信号を解除し、かつすべての乗降客が道路から離れたとき。
  answer: D
  explanation: スクールバスのために停車した後は、バスが走行を再開するか、警告信号を解除し、かつすべての乗降客が道路から離れるまで、停車し続けなければなりません。
- id: 316
  category: penalties_and_points
  question: ジョージア州において、有罪判決を伴わない状況で運転資格の停止につながるものは次のうちどれですか？
  choices:
    A: 養育費の未払い
    B: 無謀運転
    C: 当て逃げ
    D: 無保険運転
  answer: A
  explanation: マニュアルによると、当局は養育費の未払いを含む、有罪判決を伴わない状況においても運転資格を停止します。無謀運転、当て逃げ、無保険運転は、有罪判決に基づく停止事項です。
- id: 317
  category: alcohol_drugs_health
  question: ジョージア州の黙示の同意法（Implied Consent law）に基づき、州が実施する化学検査を拒否した場合の最低停止期間はどれくらいですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: B
  explanation: ジョージア州法では、州が実施する化学検査を受けることが義務付けられています。この検査を拒否した場合、ジョージア州の運転免許または運転資格は最低1年間停止されます。
- id: 318
  category: alcohol_drugs_health
  question: 州が規定するアルコールまたは薬物の化学検査を受けた後、追加の検査を受けることは許可されていますか？
  choices:
    A: いいえ、法律で追加の検査は認められていません。
    B: はい、ただし裁判官の命令がある場合に限ります。
    C: はい、自己負担で、自分が選んだ資格を持つ専門家から受けることができます。
    D: はい、州が追加検査の費用を負担します。
  answer: C
  explanation: マニュアルには次のように記載されています。「州が規定する検査を最初に受けた後、自己負担で、自分が選んだ資格を持つ専門家による血液、呼気、尿、またはその他の体内物質の追加の化学検査を受ける権利があります。」
- id: 319
  category: penalties_and_points
  question: ジョージア州の運転免許は、24ヶ月以内に何点以上の点数が累積されると停止されますか？
  choices:
    A: 10点以上
    B: 12点以上
    C: 15点以上
    D: 21点以上
  answer: C
  explanation: ジョージア州の免許は、24ヶ月以内に15点以上の点数を累積したすべての人の資格を停止します。
- id: 320
  category: penalties_and_points
  question: ジョージア州の免許保持者は、5年に1回、運転記録から最大何点の減免を申請することができますか？
  choices:
    A: 最大3点
    B: 最大5点
    C: 最大7点
    D: 最大10点
  answer: C
  explanation: ジョージア州の免許保持者は、認定された6時間の運転改善コースを修了することで、5年に1回、ジョージア州の運転免許に科された点数を最大7点まで減らすようDDSに申請することができます。
- id: 321
  category: penalties_and_points
  question: 交通違反で出廷する前に、被告が認定された6時間の安全運転講習（defensive driving course）を修了した場合、5年に1度、裁判所が提供しなければならない特典は何ですか？
  choices:
    A: 罰金50%減額、および点数加算なし。
    B: 罰金20%減額、および点数加算なし。
    C: 召喚状の完全な却下。
    D: 罰金20%減額、ただし点数は加算される。
  answer: B
  explanation: 修了証の原本を裁判所に提出すると、裁判所は科せられた罰金を20%減額し、運転者への点数加算は行われません。この申し立ては5年に1度認められます。
- id: 322
  category: driver_responsibility
  question: ジョージア州の安全責任法（Safety Responsibility Law）の主な目的は何ですか？
  choices:
    A: すべての運転者に安全運転講習の受講を義務付けること。
    B: 無責任な運転者を高速道路から排除し、保険加入済みの運転者を無保険の運転者から保護すること。
    C: すべての車両が年次の安全検査に合格するようにすること。
    D: すべての車両にチャイルドシートの使用を義務付けること。
  answer: B
  explanation: マニュアルには次のように記載されています。「この法律の目的は、ジョージア州の高速道路から無責任な運転者を排除し、保険加入済みの運転者を無保険の運転者から保護することです。」
- id: 323
  category: penalties_and_points
  question: 運転者が特定の重大な違反で、一定期間内に3回目の有罪判決を受けた場合、常習違反者（Habitual Violator）と宣言され、免許が取り消されます。その期間はどれくらいですか？
  choices:
    A: 2年
    B: 3年
    C: 5年
    D: 10年
  answer: C
  explanation: 5年以内に特定の違反（DUI、ひき逃げ、公道レースなど）の組み合わせで3回目の有罪判決を受けた場合、常習違反者（Habitual Violator）と宣言され、運転免許が取り消されます。
- id: 324
  category: penalties_and_points
  question: ジョージア州運転者サービス局（DDS）は、ジョージア州居住者による州外での交通違反の有罪判決をどのように扱いますか？
  choices:
    A: DUI（飲酒・薬物影響下運転）に関わるものでない限り無視される。
    B: 運転記録に記載され、ジョージア州内で発生したものとして扱われる。
    C: 警告書が送られるが、点数は加算されない。
    D: 運転者が商用運転免許（CDL）を保持している場合にのみ記録される。
  answer: B
  explanation: 他の州の免許当局または裁判所からジョージア州DDSに報告された有罪判決は、ジョージア州の免許保持者の運転記録に記載されます。当局は、そのような有罪判決を本州で発生したものとして扱います。
- id: 325
  category: license_system
  question: 次のうち、ジョージア州の運転免許が義務的に取り消される原因となるのはどれですか？
  choices:
    A: 通知を受けた後、運転技能または知識の再試験を受けることを拒否した場合。
    B: 制限速度を15マイル超えるスピード違反のチケットを1回受け取った場合。
    C: 30日以内に駐車違反の罰金を支払わなかった場合。
    D: 運転記録に3ポイント累積した場合。
  answer: A
  explanation: ジョージア州では、正当な理由に基づき運転技能または交通ルールの知識の再試験を求める通知を受けた後、その受検を拒否した場合、運転免許が取り消されます。
- id: 326
  category: penalties_and_points
  question: 21歳未満の者の場合、免許停止処分を課す目的において、不争の答弁（nolo contendere）はどのように扱われますか？
  choices:
    A: 無視される。
    B: 通常の半分の点数が加算される。
    C: 有罪判決とみなされる。
    D: 運転者に路上試験の再受験を義務付ける。
  answer: C
  explanation: マニュアルによると、21歳未満の者に適用される免許停止処分を課す目的において、不争の答弁（nolo contendere）は有罪判決とみなされます。
- id: 327
  category: driver_responsibility
  question: 安全責任法（Safety Responsibility Law）に基づき、衝突事故による損害賠償請求がなされた場合、どのようにして免許停止を回避できますか？
  choices:
    A: 30日間、請求を無視する。
    B: 事故当時に賠償責任保険に加入していたことを示すSR-21フォームを、保険会社からDDSに提出してもらう。
    C: 車両のナンバープレートを返納する。
    D: スーパー・スピーダー（Super Speeder）料金を支払う。
  answer: B
  explanation: 安全責任法に基づく免許停止を回避するには、事故当時に賠償責任保険でカバーされていた場合、保険会社からDDSにSR-21フォームを提出してもらう必要があります。
- id: 328
  category: penalties_and_points
  question: 法律により、当局が以下のどの違反の有罪判決に対して運転免許を停止することが義務付けられていますか？
  choices:
    A: 無保険での運転
    B: 制限速度を10マイル超えるスピード違反
    C: 不適切な駐車
    D: 方向指示器（ウィンカー）の使用不履行
  answer: A
  explanation: マニュアルには、有罪判決を受けた場合に法律で免許停止が義務付けられている違反の一つとして「無保険での運転」が挙げられています。
- id: 329
  category: penalties_and_points
  question: 常習違反者（Habitual Violator）と宣言された場合、いつ保護観察付き免許（Probationary License）を申請できる資格が得られる可能性がありますか？
  choices:
    A: 申請後すぐに
    B: 免許取り消し期間を6ヶ月務めた後
    C: 免許取り消し期間を2年務めた後
    D: 免許取り消し期間を5年務めた後
  answer: C
  explanation: マニュアルによると、常習違反者と宣言された場合、免許取り消し期間を2年務めた後に保護観察付き免許（Probationary License）の資格が得られる可能性があります。
- id: 330
  category: license_system
  question: 免許停止期間中に限定運転許可証（limited driving permit）を取得するための費用はいくらですか？
  choices:
    A: $20
    B: $32
    C: $50
    D: $75
  answer: B
  explanation: マニュアルには、特定の状況において、免許停止期間中に32ドルの費用で限定運転許可証を取得できる場合があると記載されています。
- id: 331
  category: penalties_and_points
  question: 限定運転免許証（Limited driving permits）は、商用車の運転に有効ですか？
  choices:
    A: はい、ただし雇用目的のみ有効です
    B: はい、判決を下した裁判所の裁判官によって承認された場合は有効です
    C: いいえ、商用車の運転には決して有効ではありません
    D: いいえ、有害物質を輸送していない限り有効ではありません
  answer: C
  explanation: マニュアルには、「限定運転免許証は商用車の運転には有効ではありません」と明記されています。
- id: 332
  category: penalties_and_points
  question: 限定運転免許証の条件や制限のいずれかに違反して有罪判決を受けた場合、どのような罰則がありますか？
  choices:
    A: 免許が30日間停止されます
    B: 32ドルの追加料金を支払わなければなりません
    C: 元々の免許停止期間がさらに6ヶ月延長されます
    D: 運転資格の永久剥奪を受けます
  answer: C
  explanation: マニュアルによると、許可条件違反で有罪判決を受けると、許可が取り消され、元々の運転資格停止期間がさらに6ヶ月延長されます。
- id: 333
  category: penalties_and_points
  question: 次の状況のうち、限定運転免許証を利用できないのはどれですか？
  choices:
    A: 初めてのDUI（薬物以外）
    B: 養育費の未払い
    C: 5年以内で2回目のDUI有罪判決
    D: 15ポイント累積による最初の免許停止
  answer: B
  explanation: マニュアルによると、「養育費の未払い」などの理由による免許停止の場合、限定運転免許証は発行されません。
- id: 334
  category: penalties_and_points
  question: 重大な交通違反で初めて有罪判決を受けた場合、商用車の運転資格はどのくらいの期間剥奪されますか？
  choices:
    A: 60日間
    B: 120日間
    C: 6ヶ月間
    D: 1年間
  answer: D
  explanation: マニュアルには、重大な交通違反で有罪判決を受けた者の商用車運転資格は、1年間剥奪されると記載されています。
- id: 335
  category: alcohol_drugs_health
  question: 商用自動車（CMV）の運転において、血中アルコール濃度（BAC）がどのレベル以上になると重大な交通違反とみなされますか？
  choices:
    A: .02 gm.
    B: .04 gm.
    C: .06 gm.
    D: .08 gm.
  answer: B
  explanation: マニュアルでは、「BACが.04 gm.以上でのCMVの運転」を重大な交通違反として挙げています。
- id: 336
  category: penalties_and_points
  question: 有害物質の標識（プラカード）を掲示したCMVを運転中に重大な交通違反で有罪判決を受けた場合、初犯の失格期間はどのくらいですか？
  choices:
    A: 少なくとも1年間
    B: 少なくとも2年間
    C: 少なくとも3年間
    D: 永久
  answer: C
  explanation: 有害物質の標識を掲示したCMVを運転中に重大な交通違反で有罪判決を受けた場合、初犯で少なくとも3年間、CMVの運転資格が剥奪されます。
- id: 337
  category: penalties_and_points
  question: 別の事案による2回目の重大な交通違反の有罪判決に対する罰則は何ですか？
  choices:
    A: 商用車運転資格の3年間の剥奪
    B: 商用車運転資格の5年間の剥奪
    C: 商用車運転資格の10年間の剥奪
    D: 商用車運転資格の永久剥奪
  answer: D
  explanation: マニュアルには、「これらの重大な交通違反のいずれかについて、別の事案から2回目の有罪判決を受けた場合、商用車運転資格は永久に剥奪される」と記載されています。
- id: 338
  category: safe_driving_rules
  question: 次のスピード違反のうち、「深刻な交通違反（serious traffic violation）」と定義されているのはどれですか？
  choices:
    A: 制限速度を時速5マイル以上超過する走行
    B: 制限速度を時速10マイル以上超過する走行
    C: 制限速度を時速15マイル以上超過する走行
    D: 制限速度を時速20マイル以上超過する走行
  answer: C
  explanation: マニュアルでは、「制限速度を時速15マイル以上超過する走行」を深刻な交通違反と定義しています。
- id: 339
  category: alcohol_drugs_health
  question: 商用自動車（CMV）を使用して規制薬物の製造または密売に関与した重罪（felony）の判決を受けた場合の罰則は何ですか？
  choices:
    A: 1年間の失格
    B: 3年間の失格
    C: 5年間の失格
    D: 永久失格
  answer: D
  explanation: CMVを使用して規制薬物やマリファナの製造、流通、密売、または所持に関与した重罪の判決を受けた場合、商用車運転資格は永久に剥奪されます。
- id: 340
  category: penalties_and_points
  question: 運行停止命令（out-of-service order）違反の初犯に対する失格期間はどのくらいですか？
  choices:
    A: 30日から60日
    B: 60日から120日
    C: 180日以上1年以内
    D: 2年以上5年以内
  answer: C
  explanation: 運行停止命令に違反した場合、初犯では180日以上1年以内の失格となります。
- id: 341
  category: license_system
  question: 限定運転免許（limited driving permit）が交付されている場合、運転が許可される正当な理由は次のうちどれですか？
  choices:
    A: レクリエーション公園に行くため
    B: 在籍している大学の授業に出席するため
    C: 友人や親戚を訪問するため
    D: 一般的な家事の用事を済ませるため
  answer: B
  explanation: 限定運転免許（limited driving permit）では、就労や医療目的のほか、「学生として在籍している大学や学校の授業に出席すること」など、特定の不可欠な活動のための運転が許可されています。
- id: 342
  category: penalties_and_points
  question: 商用車（CMV）の運転中に初めて踏切通過違反を犯した場合、欠格期間（免許停止期間）はどれくらいですか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 1年間
  answer: B
  explanation: マニュアルによると、商用車（CMV）の運転中に踏切通過違反で有罪判決を受けた場合、初犯の欠格期間は60日間となります。
- id: 343
  category: driver_responsibility
  question: 事故の後、どのような状況下で直ちに最寄りの法執行機関に通知しなければなりませんか？
  choices:
    A: 死亡者が出た場合、または複数の車両が関与している場合のみ
    B: 負傷者や死亡者が出た場合、または物的損害が500ドルを超える場合
    C: 物的損害が1,000ドルを超える場合
    D: 事故が州間高速道路で発生した場合のみ
  answer: B
  explanation: マニュアルには、負傷者や死亡者が出た場合、または物的損害が500ドルを超える場合は、直ちに最寄りの法執行機関に通知しなければならないと記されています。
- id: 344
  category: driver_responsibility
  question: 無人の車両に衝突して損傷を与えた場合、何が求められますか？
  choices:
    A: 所有者が戻るまで車両のそばで待つ
    B: 目に見える損傷がない場合は、直ちに現場を離れる
    C: 所有者を探し出すか、所有者が見つけやすい目立つ場所に自分の情報を残す
    D: レッカー車を呼び、無人の車両を道路から移動させる
  answer: C
  explanation: 無人の車両に損傷を与えた場合は、所有者を探し出すか、自分の氏名、住所、および運転していた車両の所有者の氏名を、目立つ場所に残さなければなりません。
- id: 345
  category: safe_driving_rules
  question: 事故に遭った際、接近してくるドライバーにどのように警告すべきですか？
  choices:
    A: 道路の真ん中に立ち、腕を振る
    B: ハザードランプを点灯させ、利用可能な場合は反射板（三角表示板）を使用する
    C: 対向車に対してハイビームを連続的に点滅させる
    D: 救急サービスが到着するまでクラクションを鳴らし続ける
  answer: B
  explanation: 安全を脅かすことなく接近中のドライバーに警告するために、可能であればハザードランプを点灯させ、利用可能な場合は反射板（三角表示板）を使用する必要があります。
- id: 346
  category: driver_responsibility
  question: 事故現場で負傷者を救護する際、負傷者を動かしたり持ち上げたりすべきなのはどのような時ですか？
  choices:
    A: 損傷した車両から救出するために、直ちに行う
    B: どうしても必要な場合に限る
    C: 負傷者が背中や首の痛みを訴えた時はいつでも行う
    D: 負傷者が動かしてほしいとはっきりと頼んだ場合のみ行う
  answer: B
  explanation: 不慣れな取り扱いは、さらなる重大な負傷を招く恐れがあります。マニュアルでは、どうしても必要な場合を除き、負傷者を動かしたり持ち上げたりしないよう助言しています。
- id: 347
  category: driver_responsibility
  question: 事故の負傷者のひどい出血を止めるには、どのようにすべきですか？
  choices:
    A: 傷口より上の位置に止血帯をきつく締める
    B: 負傷者の足を高くし、飲み水を与える
    C: できるだけ清潔で厚手の布を当て、手で圧迫する
    D: ボトル入りの水で傷口を徹底的に洗う
  answer: C
  explanation: マニュアルでは、ひどい出血を止めるには、できるだけ清潔で厚手の布を当て、手で圧迫するように指示しています。
- id: 348
  category: driver_responsibility
  question: ジョージア州の「善きサマリア人の法（Good Samaritan Law）」はどのような保護を提供しますか？
  choices:
    A: すべてのドライバーに救急箱の車載を義務付ける
    B: 応急処置を行ったことによって生じた民事上の損害賠償責任を免除する
    C: 負傷者を最寄りの病院まで搬送することをドライバーに義務付ける
    D: 事故現場で救護活動を行った者に金銭的な報酬を提供する
  answer: B
  explanation: ジョージア州には「善きサマリア人の法」があり、応急処置を行う際の手行為または不作為から生じる民事上の損害賠償について、その責任を問わないとしています。
- id: 349
  category: safe_driving_rules
  question: 多車線の幹線道路で事故を起こした後、車両を車道から移動させる義務があるのはどのような場合ですか？
  choices:
    A: 明らかな重傷者や死亡者がおらず、車両を通常通り安全に運転できる場合
    B: 警察が到着し、現場の写真を撮り終えた後のみ
    C: 物的損害の見積額が500ドル未満の場合
    D: レッカー車が到着するまで、車両を移動させてはならない
  answer: A
  explanation: 明らかな重傷者や死亡者がいない場合、車両を通常通り安全に運転できるのであれば、車両を安全な場所に移動させるのがドライバーの義務です。
- id: 350
  category: driver_responsibility
  question: 高速道路での軽微な事故の後、車両を安全な場所に移動させた場合、あなたは：
  choices:
    A: 自動的にその事故の過失があると見なされる
    B: 警察に書面で報告書を提出する権利を失う
    C: 停車および情報提供の義務を怠ったとして告発される可能性がある
    D: 単に車両を移動させたという理由だけで過失があると見なされることはない
  answer: D
  explanation: 車両を移動させる措置をとったドライバーは、単に車両を移動させたという理由だけで過失があると見なされることはありません。また、それによって書面による報告書を提出する能力が影響を受けることもありません。
- id: 351
  category: defensive_driving
  question: 車の前をシカが横切った場合、どのように対処すべきですか？
  choices:
    A: シカが進行方向を変える前に素早く通り過ぎるため、加速する。
    B: シカは通常群れで移動しており、別の個体が後に続いている可能性があるため、減速する。
    C: 動物との衝突を避けるため、対向車線にハンドルを切る。
    D: シカが周囲をよりよく見通せるように、ヘッドライトを消灯する。
  answer: B
  explanation: 目の前をシカが横切った場合は、常に減速してください。シカは通常群れで移動するため、すぐ後ろに別のシカが続いている可能性が高いです。
- id: 352
  category: defensive_driving
  question: 夜間に路肩でシカを見つけた場合、ヘッドライトについてどのような行動をとるべきですか？
  choices:
    A: シカをよりはっきりと見るために、ハイビームに切り替える。
    B: シカの横を通り過ぎるまで、ヘッドライトを完全に消灯する。
    C: シカの目をくらませないよう、ヘッドライトを点滅させてからロービームに切り替える。
    D: ヘッドライトをハイビームのままにし、継続的にクラクションを鳴らす。
  answer: C
  explanation: 夜間に道路上や路肩でシカを見つけた場合、運転者は直ちに減速し、シカの目をくらませないようにヘッドライトを点滅させてからロービームに切り替える必要があります。
- id: 353
  category: defensive_driving
  question: 道路上のシカを避けるために、決して急ハンドルを切ってはいけないのはなぜですか？
  choices:
    A: ジョージア州の田舎道で急ハンドルを切ることは違法であるため。
    B: 他の車両に衝突したり、道路から逸脱したりして、より大きな被害をもたらす可能性があるため。
    C: シカは本能的に急ハンドルを切る車両に引き寄せられるため。
    D: 急ハンドルを切ると、車両のエアバッグが自動的に作動するため。
  answer: B
  explanation: シカを避けるために急ハンドルを切ってはいけません。この行動により、他の車両に衝突したり、路外に逸脱したりして、より大きな損害や重大な負傷を引き起こす可能性があります。
- id: 354
  category: defensive_driving
  question: 繁殖期のピークにあたり、シカが最も活発になるのは何月ですか？
  choices:
    A: 1月、2月、3月
    B: 4月、5月、6月
    C: 7月、8月、9月
    D: 10月、11月、12月
  answer: D
  explanation: シカは繁殖期のピークである秋の10月、11月、12月に最も活発になります。
- id: 355
  category: defensive_driving
  question: シカが路肩でよく見かけられるのは、一日のうちのどの時間帯ですか？
  choices:
    A: 日中の時間帯のみ。
    B: 早朝の時間帯と夕方から夜間にかけて。
    C: 午前0時から午前3時の間のみ。
    D: 午後のラッシュアワーの時間帯のみ。
  answer: B
  explanation: シカは通常、早朝の時間帯や夕方から夜間にかけて路肩で見かけられます。
- id: 356
  category: driver_responsibility
  question: 衝突事故の後、相手のドライバーと交換することが義務付けられている情報は次のうちどれですか？
  choices:
    A: 氏名、住所、ナンバープレート番号、および運転免許証番号。
    B: 氏名、電話番号、保険の補償限度額、および車両識別番号（VIN）。
    C: 住所、社会保障番号、およびナンバープレート番号。
    D: 運転免許証番号、生年月日、および車両のメーカーとモデル。
  answer: A
  explanation: 衝突事故に巻き込まれた場合、他の当事者全員に自分の氏名、住所、ナンバープレート番号、運転免許証番号を提示し、相手からも同様の情報を取得しなければなりません。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行して注意深く進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤色の八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通状況と歩行者を確認してください。
  id: 357
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何を求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通の流れに合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、減速して他の車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 358
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路に進入してはならない
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」標識は、この標識が設置されている道路やランプに進入してはいけないことを意味します。通常、高速道路の出口ランプや一方通行の道路で見られ、進入すると対向車の進路に入ることになります。
  id: 359
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意して運転を続ける
    C: 停止してバックするか、向きを変える。あなたは逆走しています。
    D: 加速してそのエリアを素早く離れる
  answer: C
  explanation: 赤と白の「WRONG WAY（逆走）」標識は、一方通行の道路や高速道路のランプを逆走していることを意味します。直ちに停止し、安全に向きを変えるかバックしてください。
  id: 360
- image: one_way_left.png
  category: signs_and_signals
  id: 361
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 一方通行（左方向）
    C: 中央分離帯の左側を通行すること
    D: 左側に高速道路の出口あり
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、その道路の交通が矢印の指す一方向のみに進むことを示しています。
- image: no_u_turn.png
  category: signs_and_signals
  id: 362
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所での転回（Uターン）が禁止されていることを意味します。
- image: no_left_turn.png
  category: signs_and_signals
  id: 363
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
- image: no_right_turn.png
  category: signs_and_signals
  id: 364
  question: この標識はどういう意味ですか？
  choices:
    A: 転回禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、その場所での右折が禁止されていることを意味します。
- image: no_passing.png
  category: signs_and_signals
  id: 365
  question: この標識は何を示していますか？
  choices:
    A: この先、道幅が狭くなる
    B: この区間内での追い越し禁止
    C: この先、対面通行
    D: 右側通行
  answer: B
  explanation: 「NO PASSING ZONE（追い越し禁止区間）」と書かれた白黒のペナント型（三角形）の標識は、そのエリアで他車を追い越すことが禁止されていることを意味します。これは追い越し禁止区間の始まりを示します。
- image: keep_right.png
  category: signs_and_signals
  id: 366
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右側に合流すること
    B: 右折専用
    C: 分離帯や障害物の右側を通行すること
    D: この先、右車線減少
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
- image: speed_limit_25.png
  category: signs_and_signals
  id: 367
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。速度制限標識は、理想的な条件下においてそのエリアで法的に許容される最高速度を示します。
- image: deer_crossing.png
  category: signs_and_signals
  id: 368
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園またはサファリパークあり
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟区域
    D: 近くに野生動物保護区あり
  answer: B
  explanation: 鹿のシルエットが描かれた黄色のひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
- image: pedestrian_crossing.png
  category: signs_and_signals
  id: 369
  question: この標識は何を警告していますか？
  choices:
    A: この先、スクールゾーン
    B: この先、歩行者横断あり
    C: 近くにハイキングコースあり
    D: この先、バス停あり
  answer: B
  explanation: 歩行者の姿が描かれた黄色のひし形の標識は、この先に歩行者横断場所があることを警告しています。道路を横断する歩行者のために停止できるよう準備しておいてください。
- image: school_zone.png
  category: signs_and_signals
  id: 370
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院周辺
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い円形の標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウト（環状交差点）がある
    B: 病院区域である
    C: この先に踏切がある
    D: 追い越し禁止区間である
  answer: C
  explanation: 黒いXと2つのRが描かれた黄色い円形の標識は、この先に踏切があることを知らせる事前警告標識です。速度を落とし、列車の音や姿を確認してください。
  id: 371
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスカット（踏切標識）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 372
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先で行き止まり
    B: 右折必須
    C: この先に右カーブがある
    D: この先に迂回路がある
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 373
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角であることを示している
    B: 大幅な減速が必要な急カーブであることを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 374
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に単一のカーブがある
    C: 反対方向への2つの連続するカーブがある
    D: この先にラウンドアバウトがある
  answer: C
  explanation: 反対方向への連続カーブ（背向カーブ）の標識は、この先に反対方向へ曲がる2つのカーブがあることを警告しています。速度を落とし、道がまず一方に曲がり、次に反対側に曲がることに備えてください。
  id: 375
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 単一の急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブまたは曲がり角がある
    D: この先に坂道がある
  answer: C
  explanation: 「曲がりくねった道」の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 376
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の終了
    B: 他の道路からの交通の合流
    C: 中央分離帯のある道路の開始
    D: 道幅が1車線に減少すること
  answer: B
  explanation: 黄色いひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  id: 377
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に橋がある
    B: この先で道幅が狭くなる
    C: 車線終了
    D: 中央分離帯の終了
  answer: B
  explanation: この警告標識は、この先の道幅が狭くなることを示しています。道幅が狭くなることに備え、走行位置を調整してください。
  id: 378
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路の開始
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって反対車線と仕切られた「中央分離帯のある道路（Divided Highway）」になることを警告しています。右側を通行してください。
  id: 379
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある道路の開始
    B: 中央分離帯が終了し、対面通行に戻る
    C: この先に合流地点がある
    D: この先で道路工事中
  answer: B
  explanation: この標識は、中央分離帯のある道路が終了することを警告しています。反対車線の交通が中央分離帯で仕切られなくなります。対面通行に備えてください。
  id: 380
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 分離ハイウェイの始まり
    B: この先に追い越し車線あり
    C: この先、対面通行 — 車両が両方向に通行します
    D: この先に車線変更あり
  answer: C
  explanation: この標識はこの先が対面通行であることを警告しています。一方通行の道路や分離ハイウェイが終わり、反対方向から来る車両に遭遇する可能性があります。
  id: 381
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状態を警告していますか？
  choices:
    A: 路面の凍結
    B: 濡れている時に滑りやすくなる路面
    C: この先に曲がりくねった道あり
    D: 路面の凹凸
  answer: B
  explanation: 「スリップ注意（濡れている時に滑りやすい）」の標識は、雨などで路面が濡れている時に非常に滑りやすくなることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 382
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 路面の隆起
    B: 路面の凹凸
    C: この先に急な下り坂または勾配あり
    D: 道路工事
  answer: C
  explanation: この標識はこの先に急な下り坂や勾配があることを警告しています。特にトラックや牽引中の場合は、速度を調整し、低いギアにシフトダウンする必要があるかもしれません。
  id: 383
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先に一時停止標識あり
    B: この先に信号機あり
    C: 通学路の横断歩道
    D: 検問所
  answer: B
  explanation: この標識はこの先に信号機があることを警告しています。赤信号や黄信号の場合に停止できるよう準備してください。この標識は、遠くから信号機が見えにくい場所に設置されることが多いです。
  id: 384
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 譲れ（Yield）の標識
    B: 信号機
    C: 一時停止しなければならない一時停止標識
    D: スピードバンプ（段差）
  answer: C
  explanation: この標識はこの先に一時停止標識があることを警告しています。速度を落とし始め、一時停止標識の場所で完全に停止できるよう準備してください。
  id: 385
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に踏切あり
    B: この先に十字路または交差点あり
    C: この先に病院あり
    D: 歩行者用横断歩道
  answer: B
  explanation: この標識はこの先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 386
- image: side_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先にT字路あり
    B: 右側から合流する脇道あり
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は右側から脇道が合流していることを警告しています。脇道からハイウェイに進入してくる車両に注意してください。
  id: 387
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流している
    B: 車線が減少している
    C: 新しい車線が追加される — 合流の必要なし
    D: 右折必須
  answer: C
  explanation: 「付加車線」の標識は、合流を必要とせずに新しい車線がハイウェイに加わることを意味します。ランプ（接続路）から進入する車両には、専用の新しい車線が用意されています。
  id: 388
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時の停車も禁止
    B: この区域での駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」標識は、この区域に車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは許可される場合があります。
  id: 389
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースを示しています。有効な障害者用駐車許可証またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 390
