- id: 92
  category: license_system
  question: 盗難を理由に再発行するカードの運転免許証番号を変更したい場合、どのような書類が必要ですか？
  choices:
    A: 出生証明書の認証謄本
    B: 免許証が盗まれたことを示す警察の報告書（ポリスレポート）
