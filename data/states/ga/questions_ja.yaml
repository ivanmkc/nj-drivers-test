questions:
- id: 1
  category: safe_driving_rules
  question: 後方に緊急車両のライトが見えた場合、直ちに何をすべきですか？
  choices:
    A: 道路の真ん中で停止する。
    B: 方向指示器（ウィンカー）を出し、安全が確認でき次第、道路脇に寄せるか停車する。
    C: 明るい場所を探すために加速する。
    D: 車から降りて警察官を待つ。
  answer: B
  explanation: マニュアルによると、後方に緊急車両のライトが見えた場合は、方向指示器を出し、安全が確認でき次第、速やかに道路脇に寄せるか停車する必要があります。
- id: 2
  category: safe_driving_rules
  question: 夜間に警察に停車を命じられた場合、視認性を高めるために何をすべきですか？
  choices:
    A: ヘッドライトを消す。
    B: ハザードランプを点灯させ、クラクションを鳴らす。
    C: 車内灯（ルームライト）を点灯させる。
    D: 窓から懐中電灯を照らす。
  answer: C
  explanation: マニュアルによると、夜間に停車を命じられた場合は、視認性を高めるために車内灯（ルームライト）を点灯させる必要があります。
- id: 3
  category: safe_driving_rules
  question: 交通取り締まりで停車している間、手はどこに置いておくべきですか？
  choices:
    A: ポケットの中。
    B: グローブボックスに手を伸ばす。
    C: 頭の後ろ。
    D: ハンドル（ステアリングホイール）の上、または警察官から見える場所。
  answer: D
  explanation: マニュアルでは、警察官が容易に確認できるよう、ハンドルに手を置くか、見える場所に置いておくよう指示されています。
- id: 4
  category: driver_responsibility
  question: 交通取り締まりの際、車内に武器がある場合はいつ警察官に伝えるべきですか？
  choices:
    A: 警察官と最初に接触した時。
    B: 警察官が車内の捜索を求めた時のみ。
    C: 免許証と登録証を渡した後。
    D: 警察官に伝える必要はない。
  answer: A
  explanation: マニュアルには、警察官が車両に近づいてきた際、最初に接触した時点で車内に武器があることを伝えるべきであると記載されています。
- id: 5
  category: driver_responsibility
  question: 交通取り締まりの際、運転免許証や車両書類が手の届かない場所にある場合はどうすべきですか？
  choices:
    A: 警察官が近づく前に、素早くそれらを取り出す。
    B: 警察官に場所を伝え、警察官の了解を得てから取り出す。
    C: 車から降りて、トランクから取り出す。
    D: 手の届かない場所にあるため、提示を拒否する。
  answer: B
  explanation: 書類が手の届かない場所にある場合、マニュアルでは、警察官にその場所を伝え、警察官の了解を得てから取り出すよう助言しています。
- id: 6
  category: penalties_and_points
  question: 交通違反切符への署名は何を意味しますか？
  choices:
    A: 罪を認めること。
    B: 法廷審問を受ける権利の放棄。
    C: 罪を認めること（有罪の認否）ではない。
    D: 即座に罰金を支払うことへの同意。
  answer: C
  explanation: マニュアルには、「交通違反切符の受け取りおよび署名は、罪を認めること（有罪の認否）ではありません」と明記されています。
- id: 7
  category: penalties_and_points
  question: 交通違反切符への署名を拒否した場合、どうなる可能性がありますか？
  choices:
    A: 切符は無効になる。
    B: 代わりに警告が与えられる。
    C: 免許が即座に停止される。
    D: 逮捕される可能性がある。
  answer: D
  explanation: マニュアルによると、交通違反切符への署名を拒否すると、逮捕される可能性があります。
- id: 8
  category: driver_responsibility
  question: 警察官の交通違反切符を発行するという決定に同意できない場合、適切な行動は何ですか？
  choices:
    A: 警察官と議論して接触時間を長引かせる。
    B: 切符への署名を拒否する。
    C: 確立された法的手段を通じて、裁判でその決定を争う。
    D: その場から車で立ち去る。
  answer: C
  explanation: マニュアルでは、警察官の決定に同意できない場合は議論をせず、確立された法的手段を通じて裁判でその決定を争うよう助言しています。
- id: 9
  category: driver_responsibility
  question: 交通取り締まり中に警察官が不適切な行動をとったと感じた場合、どうすべきですか？
  choices:
    A: 路上で警察官と議論する。
    B: 停車後できるだけ早く、上司（スーパーバイザー）と話すことを要求する。
    C: 運転免許証の提示を拒否する。
    D: 車から降りて警察官に詰め寄る。
  answer: B
  explanation: 警察官が不適切な行動をとったと思われる場合、マニュアルには上司（スーパーバイザー）と話すことを要求できるとされており、これは停車後できるだけ早く行うのが最善です。
- id: 10
  category: license_system
  question: 居住者になってから、ジョージア州の運転免許証または許可証を取得するまでに何日間の猶予がありますか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: B
  explanation: ジョージア州の法律では、自動車を運転しようとする者は、居住者になってから30日以内にジョージア州の運転免許証または許可証を取得することが義務付けられています。
- id: 11
  category: license_system
  question: ジョージア州法に基づき、運転免許証を取得する目的において、以下のうちどのような場合に「居住者」とみなされますか？
  choices:
    A: 2週間の休暇で州を訪れている。
    B: 州間高速道路を通って州内を走行している。
    C: ジョージア州内で雇用を受け入れる、または何らかの商売や職業に従事する。
    D: 週末にホテルを予約する。
  answer: C
  explanation: ジョージア州内で雇用を受け入れる、または何らかの商売や職業に従事する場合、マニュアルに記載されている他の基準とともに、ジョージア州居住者とみなされます。
- id: 12
  category: license_system
  question: ジョージア州に少なくとも何日間滞在した人は、ジョージア州の運転免許証を取得しなければならない居住者とみなされますか？
  choices:
    A: 15日
    B: 30日
    C: 45日
    D: 60日
  answer: B
  explanation: ジョージア州法（O.C.G.A. §40-5-1）に基づき、州内に30日以上滞在した人はジョージア州居住者とみなされます。
- id: 13
  category: license_system
  question: DDSオンラインサービスを通じてインターネットで更新される対象の免許の種類には、どのような特典が適用される場合がありますか？
  choices:
    A: 5ドルの割引。
    B: 10ドルの割引。
    C: 無料の視力検査。
    D: すべての更新料の免除。
  answer: A
  explanation: マニュアルには、インターネットで更新される対象の免許の種類に対して、5ドルの割引が適用される場合があると記載されています。
- id: 14
  category: safe_driving_rules
  question: 警察官に車を止められた際、車両のエンジンとオーディオ機器についてどのようにすべきですか？
  choices:
    A: エンジンをかけたままにし、オーディオの音量を上げる。
    B: エンジンとすべてのオーディオ機器を切る。
    C: エンジンは切るがオーディオはかけたままにする。
    D: エンジンはかけたままにするがオーディオは切る。
  answer: B
  explanation: 交通取り締まりの際、マニュアルでは運転手に対し、エンジンとすべてのオーディオ機器を切るよう指示しています。
- id: 15
  category: driver_responsibility
  question: あなたを止めた警察官が制服を着用していない場合、通常その警察官は何をしますか？
  choices:
    A: すぐに車から降りるよう求める。
    B: 警察の身分証明書を提示する。
    C: 免許証を求めずに警告を出す。
    D: 警察署までついてくるよう求める。
  answer: B
  explanation: マニュアルには、制服を着用していない警察官が停車を命じる際、通常は警察の身分証明書を提示すると記載されています。
- id: 16
  category: license_system
  question: ジョージア州法に基づき、ジョージア州居住者とみなされるためには、何日間州内に滞在している必要がありますか？
  choices:
    A: 15日以上
    B: 30日以上
    C: 60日以上
    D: 90日以上
  answer: B
  explanation: マニュアルには、ジョージア州法（O.C.G.A. §40-5-1）に基づき、州内に30日以上滞在した人はジョージア州居住者とみなされると記載されています。
- id: 17
  category: license_system
  question: 米軍の現役兵士が外国で軍によって発行された有効な免許証を所持している場合、米国に帰国してからどのくらいの期間、その免許証が認められますか？
  choices:
    A: 30日以内
    B: 45日以内
    C: 60日以内
    D: 90日以内
  answer: B
  explanation: この免許証は、米国に帰国した日から45日を超えない期間に限り認められます。
- id: 18
  category: license_system
  question: 季節労働の農場作業員が他州の有効な免許証を所持しており、かつ暦年でジョージア州内での労働が何日未満であれば、ジョージア州の運転免許証の取得が免除されますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 120日
  answer: C
  explanation: マニュアルでは、他州で発行された有効な運転免許証を所持し、かつ任意の暦年において州内での労働が90日未満である季節労働の農場作業員を免除対象としています。
- id: 19
  category: driver_testing
  question: 16歳または17歳でクラスD免許またはクラスM学習許可証（Instructional Permit）を取得するには、申請者は何時間の監督下での運転練習の証明を提出する必要がありますか？
  choices:
    A: 夜間6時間を含む30時間
    B: 夜間6時間を含む40時間
    C: 夜間10時間を含む40時間
    D: 夜間10時間を含む50時間
  answer: B
  explanation: 申請者は、DDSが承認した運転教育プログラムの修了証明に加え、少なくとも40時間の監督下での運転練習（そのうち6時間は夜間）を行った証拠を提出する必要があります。
- id: 20
  category: license_system
  question: ジョージア州の免許を申請する際、米国市民は外国で発行された身分証明書や免許証を保持し続けることが許可されますか？
  choices:
    A: はい、追加料金を支払えば可能です。
    B: はい、免許証が英語に翻訳されていれば可能です。
    C: いいえ、米国市民はそれらを保持することは許可されません。
    D: いいえ、二重国籍でない限り許可されません。
  answer: C
  explanation: マニュアルには、「米国市民は、外国で発行されたいかなる免許証、許可証、または身分証明書も保持し続けることは許可されません」と明記されています。
- id: 21
  category: driver_testing
  question: ジョージア州で非商用免許を取得するために必要な最低限の視力はどれくらいですか？
  choices:
    A: 両眼で20/40
    B: 片眼で20/50
    C: 片眼で20/60
    D: 両眼で20/70
  answer: C
  explanation: 非商用免許に必要な最低限の視力は、矯正レンズの使用の有無にかかわらず、片眼で20/60です。
- id: 22
  category: driver_testing
  question: 20/60の視力要件に加えて、非商用免許を取得するために必要な最低限の水平視野はどれくらいですか？
  choices:
    A: 100度
    B: 120度
    C: 140度
    D: 160度
  answer: C
  explanation: 運転者は、最低限の視力要件を満たすために、少なくとも140度の水平視野を有している必要があります。
- id: 23
  category: driver_testing
  question: 64歳以上の顧客は、どのくらいの頻度で視力検査に合格する必要がありますか？
  choices:
    A: 2年ごと
    B: 4年ごと
    C: 5年ごと
    D: 8年ごと
  answer: D
  explanation: マニュアルによると、64歳以上の顧客は8年ごとに視力検査に合格する必要があります。
- id: 24
  category: license_system
  question: ジョージア州におけるクラスD免許の目的は何ですか？
  choices:
    A: 18歳以上の運転者向けの非商用免許である。
    B: 16歳および17歳の運転者に発行される暫定免許である。
    C: 二輪車運転者専用の免許である。
    D: 商用車の練習許可証である。
  answer: B
  explanation: マニュアルでは、クラスD免許を16歳および17歳の運転者に発行される暫定免許と定義しています。
- id: 25
  category: license_system
  question: ステアリングホイール（ハンドル）を装備した三輪のオートサイクルは、クラスM二輪免許が必要ですか？
  choices:
    A: はい、すべての三輪車両にはクラスM免許が必要です。
    B: はい、運転者が21歳以上でない限り必要です。
    C: いいえ、クラスM二輪免許は必要ありません。
    D: いいえ、ただしクラスE商用免許が必要です。
  answer: C
  explanation: 2017年の下院法案136号（House Bill 136）に基づき、三輪のオートサイクルにはクラスM二輪免許は必要ありません。
- id: 26
  category: license_system
  question: 商用自動車を運転するものの、商用免許の要件を免除されている運転者向けの非商用免許はどのクラスですか？
  choices:
    A: クラスAおよびB
    B: クラスCおよびD
    C: クラスEおよびF
    D: クラスCPおよびMP
  answer: C
  explanation: クラスEおよびFは、商用自動車を運転し、かつ商用免許の要件を免除されている運転者向けの非商用免許です（ボランティア消防士は無料で取得できます）。
- id: 27
  category: license_system
  question: DDSカスタマーサービスセンターで受け付けられていない支払い方法は次のうちどれですか？
  choices:
    A: 現金
    B: VisaおよびMastercard
    C: モバイル決済
    D: 個人小切手
  answer: D
  explanation: マニュアルには「小切手、郵便為替、または銀行小切手（cashier checks）は受け付けていません」と記載されています。
- id: 28
  category: license_system
  question: 免許証、許可証、および身分証明書の保持者は、発行期間ごとに何回まで無料で氏名または住所の変更ができますか？
  choices:
    A: なし、すべての変更に手数料がかかる。
    B: 1回のみ無料。
    C: 2回まで無料。
    D: 回数制限なく無料。
  answer: B
  explanation: 免許証、許可証、および身分証明書の保持者は、発行期間ごとに1回、無料で氏名または住所の変更を行うことができます。
- id: 29
  category: driver_testing
  question: 運転試験を受ける際に免許の取得を希望する者は、認定運転試験官、または以下の誰に同伴される必要がありますか？
  choices:
    A: 18歳以上の有効な免許を持つ運転者。
    B: 有効な運転免許証を所持する21歳以上の責任ある成人（Responsible Adult）。
    C: 親または法的保護者のみ。
    D: 少なくとも5年間免許を保持している運転者。
  answer: B
  explanation: この人物は、有効な運転免許証を所持する21歳以上の責任ある成人、または認定運転試験官、もしくは当局の代理人が同伴しなければなりません。
- id: 30
  category: driver_responsibility
  question: 18歳未満の申請者は、どのプログラムの修了証明書を提示する必要がありますか？
  choices:
    A: 高度安全運転講習 (ADDC)
    B: アルコール・薬物意識プログラム (ADAP)
    C: 高速道路安全規制プログラム (HSRP)
    D: 自動車運転プログラム (MVOP)
  answer: B
  explanation: 18歳未満の申請者は、アルコール・薬物意識プログラム（ADAP）の修了証明書を提示する必要があります。
- id: 31
  category: license_system
  question: 運転免許証、許可証、または身分証明書（IDカード）の再発行（有効期限から150日以上前の場合）の標準的な費用はいくらですか？
  choices:
    A: $5.00
    B: $10.00
    C: $20.00
    D: $32.00
  answer: A
  explanation: 再発行される運転免許証、許可証、または身分証明書は、元の書類の複製であり、1回につき5.00ドルの費用で提供されます。
- id: 32
  category: license_system
  question: 元の有効期限から150日以内に運転免許証の再発行を申請した場合、どうなりますか？
  choices:
    A: 5.00ドルの再発行手数料を支払い、元の有効期限を維持する。
    B: 全額の費用を支払い、新しい期間のために免許証を更新しなければならない。
    C: 免許証を返納し、仮許可証を申請しなければならない。
    D: 再発行を受けるために、視力検査と実技試験を受けなければならない。
  answer: B
  explanation: マニュアルによると、元の有効期限から150日以内に再発行を申請する場合、免許証/許可証/IDは全額の費用で新しい期間のために更新されなければなりません。
- id: 33
  category: license_system
  question: DDS免許制限コードによると、制限コード「B」は何を示していますか？
  choices:
    A: マニュアル車（MT車）の商用車（CMV）の運転不可
    B: 矯正レンズ（眼鏡・コンタクトレンズ等）が必要
    C: 日中の時間帯のみ運転可能
    D: オートマチック車（AT車）限定
  answer: B
  explanation: DDS免許制限コード表では、「B」は「矯正レンズが必要（corrective lenses required）」と記載されています。
- id: 34
  category: driver_testing
  question: 2年以上失効している運転免許証を更新するには何が必要ですか？
  choices:
    A: 視力検査と32ドルの手数料のみ
    B: 視力検査、実技試験、および道路標識と交通規則に関する学科試験
    C: 安全運転講習の受講と視力検査
    D: 実技試験と居住証明のみ
  answer: B
