metadata:
  source: 2025 Georgia Driver's Manual
  total_questions: 246
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Georgia, what is the minimum age to apply for a Class CP Instructional
    Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 15 and a half years old
  answer: B
  explanation: According to the Georgia Department of Driver Services (DDS), an individual
    must be at least 15 years of age to apply for a Class CP Instructional Permit.
- id: 2
  category: license_system
  question: Under Joshua's Law, to obtain a Class D Provisional License at age 16,
    a teen must complete an approved driver education course and how many hours of
    supervised driving?
  choices:
    A: 20 hours, including 5 at night
    B: 30 hours, including 10 at night
    C: 40 hours, including 6 at night
    D: 50 hours, including 15 at night
  answer: C
  explanation: Joshua's Law requires 16-year-olds to complete an approved driver education
    course plus 40 hours of supervised driving, at least 6 of which must be at night.
- id: 3
  category: license_system
  question: 'A holder of a Georgia Class D Provisional License is not permitted to
    drive between the hours of:'
  choices:
    A: 10:00 PM and 5:00 AM
    B: 11:00 PM and 6:00 AM
    C: 12:00 Midnight and 5:00 AM
    D: 1:00 AM and 5:00 AM
  answer: C
  explanation: Georgia law restricts Class D license holders from driving on public
    roads, streets, or highways between the hours of 12:00 Midnight and 5:00 AM.
- id: 4
  category: license_system
  question: During the first six months of holding a Class D license, who is allowed
    to ride as a passenger in the vehicle?
  choices:
    A: Only one friend under age 21
    B: Only immediate family members
    C: No passengers are allowed
    D: Anyone, as long as a parent is present
  answer: B
  explanation: During the first six months following issuance of a Class D license,
    only immediate family members may ride in the vehicle.
- id: 5
  category: license_system
  question: During the second six-month period after receiving a Class D license,
    how many passengers under the age of 21 who are NOT members of the driver's immediate
    family may ride in the vehicle?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: During the second six-month period, only one passenger under 21 years
    of age who is not a member of the driver's immediate family may ride in the vehicle.
- id: 6
  category: license_system
  question: In Georgia, a driver under age 21 will have their license suspended for
    a single conviction of which of the following offenses?
  choices:
    A: Driving 15 mph over the speed limit
    B: Failure to signal a turn
    C: Hit and run or leaving the scene of an accident
    D: Expired registration
  answer: C
  explanation: For drivers under 21, a conviction for hit and run, racing, reckless
    driving, or any offense for which 4 or more points are assessed results in automatic
    license suspension.
- id: 7
  category: license_system
  question: What is the Blood Alcohol Concentration (BAC) limit for drivers under
    the age of 21 in Georgia?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Georgia has a 'Zero Tolerance' policy for underage drinking and driving;
    a BAC of 0.02% or higher for a driver under 21 is considered a DUI.
- id: 8
  category: license_system
  question: 'According to the Georgia ''Super Speeder'' law, an additional $200 state
    fee is added to any local speeding fine if the driver is convicted of speeding
    at:'
  choices:
    A: 75 mph or more on any two-lane road
    B: 80 mph or more on any road
    C: 10 mph over the posted limit
    D: 90 mph or more on an interstate
  answer: A
  explanation: The Super Speeder law applies to drivers convicted of speeding at 75
    mph or more on any two-lane road, or 85 mph or more on any road or highway in
    Georgia.
- id: 9
  category: license_system
  question: How many points must a driver (age 21 or older) accumulate within a 24-month
    period to receive a license suspension?
  choices:
    A: 10 points
    B: 12 points
    C: 15 points
    D: 18 points
  answer: C
  explanation: The Georgia DDS will suspend the license of any driver who accumulates
    15 or more points within 24 months.
- id: 10
  category: license_system
  question: What is the standard expiration term for a Georgia driver's license for
    residents under age 64?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: Standard Georgia driver's licenses are typically issued for a term
    of 8 years.
- id: 11
  category: license_system
  question: If you move to Georgia from another state, how many days do you have to
    update your driver's license with the DDS?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents must apply for a Georgia driver's license within 30 days
    of becoming a resident.
- id: 12
  category: license_system
  question: Which program is required for all teens under 18 to obtain a driver's
    license in Georgia, focusing on alcohol and drug awareness?
  choices:
    A: D.A.R.E.
    B: ADAP
    C: MADD
    D: GOHS
  answer: B
  explanation: The Alcohol and Drug Awareness Program (ADAP) is a required course
    for teens under 18 to obtain a Georgia driver's license.
- id: 13
  category: license_system
  question: To comply with Georgia's 'Secure ID' requirements, how many documents
    proving residential address must be provided?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have a birth certificate
  answer: B
  explanation: Georgia's Secure ID program requires applicants to provide two documents
    proving their Georgia residential address.
- id: 14
  category: license_system
  question: At what age can a Class D license holder upgrade to a Class C (Under 21)
    license, provided they have had no major traffic convictions in the previous 12
    months?
  choices:
    A: 17 years old
    B: 18 years old
    C: 19 years old
    D: 21 years old
  answer: B
  explanation: A Class D holder may apply for a Class C license upon reaching age
    18, provided they have not been convicted of any major traffic violations during
    the 12 months preceding application.
- id: 15
  category: license_system
  question: If a Georgia driver is convicted of 'Aggressive Driving,' how many points
    are assessed against their driving record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Aggressive Driving is a high-point offense in Georgia, resulting in
    6 points being added to the driver's record.
- id: 16
  category: license_system
  question: If you fail the Georgia knowledge exam on your first attempt, how long
    must you wait before you are eligible to retake the test?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 30 days
  answer: A
  explanation: According to the Georgia Department of Driver Services (DDS), if you
    fail the knowledge exam, you must wait at least one day (24 hours) to retake it.
    Subsequent failures require a longer waiting period of 7 days.
- id: 17
  category: license_system
  question: If you fail the Georgia road skills test on your first attempt, what is
    the mandatory waiting period before the second attempt?
  choices:
    A: 1 day
    B: 3 days
    C: 7 days
    D: 14 days
  answer: A
  explanation: In Georgia, if you fail the road skills test, the first waiting period
    is one day. The second and all subsequent failures require a 7-day waiting period.
- id: 18
  category: license_system
  question: Applicants under age 18 must provide which specific document to prove
    they are currently enrolled in school when applying for a Georgia permit or license?
  choices:
    A: A report card from the previous semester
    B: A signed letter from a teacher
    C: Form DS-1 Certificate of Enrollment
    D: A student ID card
  answer: C
  explanation: Georgia law requires applicants under 18 to present a completed Certificate
    of Enrollment (DS-1) form, signed and notarized by their school, within the last
    30 days.
- id: 19
  category: license_system
  question: How many points are assessed against a Georgia driver's record for the
    offense of 'Unlawful passing of a school bus'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Unlawfully passing a school bus is considered a serious offense in
    Georgia and results in 6 points being added to the driver's record.
- id: 20
  category: license_system
  question: In Georgia, how many points are assessed for a conviction of 'Following
    too closely'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: A conviction for following too closely in Georgia results in 3 points
    being assessed against the driver's license.
- id: 21
  category: license_system
  question: 'Under Georgia law, any male at least 18 years of age but less than 26
    years of age who applies for a driver''s license or permit is:'
  choices:
    A: Required to pay a higher application fee
    B: Automatically registered for the U.S. Selective Service System
    C: Required to take a mandatory military history exam
    D: Exempt from the road skills test
  answer: B
  explanation: Georgia law (O.C.G.A. § 40-5-8) requires that any male applicant between
    18 and 26 be registered for the Selective Service as part of the licensing process.
- id: 22
  category: license_system
  question: If you legally change your name through marriage or court order, you must
    notify the Georgia DDS and obtain a replacement license within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Georgia law requires drivers to update their license with a legal name
    change within 30 days of the change.
- id: 23
  category: license_system
  question: 'To meet the minimum vision requirements for a non-commercial Georgia
    driver''s license, an applicant must have at least:'
  choices:
    A: 20/20 vision in both eyes
    B: 20/40 vision in both eyes
    C: 20/60 vision in at least one eye
    D: 20/100 vision in at least one eye
  answer: C
  explanation: Georgia requires non-commercial drivers to have at least 20/60 vision
    in at least one eye, with or without corrective lenses, and a horizontal field
    of vision of at least 140 degrees.
- id: 24
  category: license_system
  question: In Georgia, can a parent or legal guardian who signed a minor's application
    for a driver's license later withdraw their consent?
  choices:
    A: No, once signed, it is permanent until age 18
    B: Yes, but only if the minor is convicted of a DUI
    C: Yes, by submitting a formal request to the DDS to cancel the minor's license
    D: No, only a judge can cancel a minor's license
  answer: C
  explanation: The person who signed the application for a minor's license or permit
    can request to withdraw their consent at any time until the minor reaches age
    18, which results in the cancellation of the license.
- id: 25
  category: license_system
  question: What is the minimum age to apply for a Class A or B Commercial Driver's
    License (CDL) in Georgia for the purpose of interstate commerce?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: While Georgia allows 18-year-olds to obtain a CDL for intrastate (within
    Georgia) driving, federal law and Georgia regulations require a driver to be at
    least 21 to drive a commercial vehicle across state lines (interstate).
- id: 26
  category: license_system
  question: How many points are assessed for a conviction of speeding between 15 mph
    and 18 mph over the posted speed limit in Georgia?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Georgia's point system assesses 2 points for speeding 15-18 mph over
    the limit. (19-23 mph is 3 points; 24-33 mph is 4 points; 34+ mph is 6 points).
- id: 27
  category: license_system
  question: What is the standard in-person reinstatement fee for a first suspension
    of a Georgia driver's license due to the accumulation of points?
  choices:
    A: $50
    B: $100
    C: $210
    D: $500
  answer: C
  explanation: For a first suspension due to points accumulation, the reinstatement
    fee is $210 if paid in person, or $200 if paid by mail.
- id: 28
  category: license_system
  question: In Georgia, how many points are assessed for 'Improper passing on a hill
    or a curve'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Improper passing on a hill or curve is a 4-point offense in the state
    of Georgia.
- id: 29
  category: license_system
  question: Georgia drivers who are age 64 or older are required to do which of the
    following at every license renewal?
  choices:
    A: Retake the road skills test
    B: Pass a vision screening
    C: Provide a doctor's note regarding heart health
    D: Renew their license every 2 years
  answer: B
  explanation: Georgia law requires drivers age 64 and older to pass a vision screening
    at each renewal period, regardless of whether they renew in person or via other
    methods.
- id: 30
  category: license_system
  question: A Georgia 'Limited Term' driver's license is typically issued to which
    group of people?
  choices:
    A: Drivers with a history of multiple accidents
    B: Non-citizens who have been granted temporary legal presence in the U.S.
    C: Drivers who only need a license for seasonal work
    D: Minors who are on academic probation
  answer: B
  explanation: A Limited Term license is issued to non-citizens who have valid documentary
    evidence of lawful presence in the United States for a specific period.
- id: 31
  category: driver_testing
  question: To pass the vision exam for a Georgia driver's license, an applicant must
    have at least what visual acuity in at least one eye, with or without corrective
    lenses?
  choices:
    A: 20/20
    B: 20/40
    C: 20/60
    D: 20/100
  answer: B
  explanation: According to the Georgia Department of Driver Services (DDS), an applicant
    must have at least 20/40 vision in at least one eye and a horizontal field of
    vision of at least 140 degrees to pass the vision test.
- id: 32
  category: driver_testing
  question: In Georgia, what are the minimum required liability insurance limits for
    bodily injury per person and per accident?
  choices:
    A: $15,000 / $30,000
    B: $20,000 / $40,000
    C: $25,000 / $50,000
    D: $50,000 / $100,000
  answer: C
  explanation: Georgia law requires minimum liability insurance of $25,000 for bodily
    injury of one person, $50,000 for bodily injury to multiple people in one accident,
    and $25,000 for property damage.
- id: 33
  category: driver_testing
  question: Under the 'Hands-Free Georgia Act,' what is the fine for a first conviction
    of holding or supporting a wireless telecommunications device while driving?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: B
  explanation: A first conviction for violating the Hands-Free Georgia Act results
    in a $50 fine and 1 point on the driving record.
- id: 34
  category: driver_testing
  question: How many points are assessed against a Georgia driver's license for a
    conviction of speeding 19 mph to 23 mph over the posted speed limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: In Georgia, speeding 15-18 mph over the limit is 2 points, 19-23 mph
    is 3 points, 24-33 mph is 4 points, and 34 mph or more is 6 points.
- id: 35
  category: driver_testing
  question: Georgia's 'Move Over' Law requires drivers to move over to the next lane
    if safely possible when approaching stationary emergency vehicles. If moving over
    is unsafe, what must the driver do?
  choices:
    A: Maintain speed but honk to warn the emergency workers
    B: Stop completely in the travel lane
    C: Slow down to a speed that is reasonable and less than the posted speed limit
    D: Speed up to pass the scene as quickly as possible
  answer: C
  explanation: If a driver cannot move over safely on a multi-lane highway, they must
    slow down below the posted speed limit and be prepared to stop.
- id: 36
  category: driver_testing
  question: 'Under Georgia''s Implied Consent law, if you refuse to submit to chemical
    testing of your blood, breath, or urine for the purpose of determining if you
    are under the influence, your license will be suspended for a minimum of:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: Refusal to submit to state-administered chemical tests in Georgia results
    in a 1-year license suspension for each refusal under the Implied Consent law.
- id: 37
  category: driver_testing
  question: New residents moving to Georgia must register their vehicles and obtain
    a Georgia license plate within how many days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Georgia law requires new residents to register their vehicles and obtain
    a Georgia tag/decal within 30 days of moving to the state.
- id: 38
  category: driver_testing
  question: Unless otherwise posted, what is the maximum speed limit on an unpaved
    county road in Georgia?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: C
  explanation: In Georgia, the maximum speed limit on unpaved county roads is 35 mph
    unless a different speed limit is posted.
- id: 39
  category: driver_testing
  question: In Georgia, it is illegal to park a vehicle within how many feet of a
    fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: B
  explanation: Georgia law prohibits parking within 15 feet of a fire hydrant.
- id: 40
  category: driver_testing
  question: According to Georgia law, children under what age must be properly restrained
    in a child passenger restraining system (car seat or booster seat)?
  choices:
    A: Under 6 years of age
    B: Under 8 years of age
    C: Under 10 years of age
    D: Under 12 years of age
  answer: B
  explanation: Georgia law requires children under 8 years of age to be in an approved
    child restraint system appropriate for their height and weight.
- id: 41
  category: driver_testing
  question: 'A conviction for littering in Georgia can result in a fine of up to:'
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $5,000
  answer: C
  explanation: Littering is a crime in Georgia. Convictions can result in fines up
    to $1,000 and being ordered to clean up litter in a designated area.
- id: 42
  category: driver_testing
  question: 'In Georgia, if you are convicted of speeding in a highway work zone,
    the fine will be:'
  choices:
    A: A flat fee of $500
    B: Between $100 and $2,000
    C: Waived for first-time offenders
    D: Exactly double the normal speeding fine
  answer: B
  explanation: Speeding in a work zone in Georgia carries a fine of not less than
    $100 nor more than $2,000, and may also include imprisonment for up to 12 months.
- id: 43
  category: driver_testing
  question: 'When taking the Georgia road skills test, the applicant must provide
    a vehicle that:'
  choices:
    A: Is less than 10 years old
    B: Is equipped with a dual-braking system
    C: Has a valid registration and proof of insurance
    D: Is a manual transmission vehicle
  answer: C
  explanation: For the road test, the applicant must provide a vehicle that is safe,
    properly registered, and has valid proof of insurance.
- id: 44
  category: driver_testing
  question: For a first DUI conviction in Georgia, what is the minimum number of hours
    of community service required for a driver age 21 or older whose BAC was .08 or
    higher?
  choices:
    A: 20 hours
    B: 40 hours
    C: 60 hours
    D: 100 hours
  answer: B
  explanation: A first DUI conviction in Georgia for an adult with a BAC of .08 or
    higher requires a minimum of 40 hours of community service.
- id: 45
  category: driver_testing
  question: 'The Georgia Knowledge Exam consists of two sections: Road Rules and Road
    Signs. How many questions are in each section, and what is the minimum passing
    score for each?'
  choices:
    A: 10 questions; must answer 8 correctly
    B: 20 questions; must answer 15 correctly
    C: 25 questions; must answer 20 correctly
    D: 50 questions; must answer 40 correctly
  answer: B
  explanation: The Georgia Knowledge Exam has two sections with 20 questions each.
    You must answer at least 15 questions correctly in each section to pass.
- id: 46
  category: driver_testing
  question: Under the 'Hands-Free Georgia Act,' what is the fine and point assessment
    for a third conviction within a 24-month period?
  choices:
    A: $100 and 2 points
    B: $150 and 3 points
    C: $250 and 4 points
    D: $500 and 5 points
  answer: B
  explanation: A third or subsequent conviction of the Hands-Free Georgia Act within
    24 months results in a $150 fine and 3 points on the driving record.
- id: 47
  category: driver_testing
  question: 'According to Georgia''s ''Slow Poke'' Law, a driver in the left-most
    lane on a multi-lane highway must move to the right if:'
  choices:
    A: They are driving at the exact posted speed limit
    B: They are being overtaken from the rear by a faster vehicle
    C: It is after sunset
    D: They are driving a commercial vehicle
  answer: B
  explanation: Georgia law (O.C.G.A. 40-6-184) requires drivers to move out of the
    left-most lane to allow faster traffic to pass, even if the driver in the left
    lane is traveling at the speed limit.
- id: 48
  category: driver_testing
  question: What are the minimum liability insurance requirements for a passenger
    vehicle registered in Georgia?
  choices:
    A: $15,000/$30,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$50,000
    D: $100,000/$300,000/$50,000
  answer: B
  explanation: Georgia law requires minimum liability insurance of $25,000 for bodily
    injury per person, $50,000 for bodily injury per accident, and $25,000 for property
    damage.
- id: 49
  category: driver_testing
  question: When a school bus is stopped on a highway with two or more lanes in each
    direction and a grass median or physical barrier, which vehicles are required
    to stop?
  choices:
    A: All vehicles in both directions
    B: Only vehicles following the bus
    C: Only vehicles traveling in the opposite direction
    D: No vehicles are required to stop
  answer: B
  explanation: In Georgia, if there is a physical barrier or grass median separating
    the directions of traffic, only traffic following the bus must stop. If there
    is no such barrier (even on a multi-lane road), all traffic must stop.
- id: 50
  category: driver_testing
  question: 'During the Georgia Road Skills Test, the ''Backing'' component requires
    the applicant to back the vehicle for a distance of approximately:'
  choices:
    A: 20 feet
    B: 30 feet
    C: 50 feet
    D: 100 feet
  answer: C
  explanation: The Georgia Road Skills Test requires the applicant to back the vehicle
    smoothly for about 50 feet at a slow speed while looking over their shoulder.
- id: 51
  category: driver_responsibility
  question: 'In Georgia, you must immediately report a traffic accident to the local
    police, county sheriff, or State Patrol if the accident results in injury, death,
    or property damage exceeding:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: According to the Georgia Driver's Manual, any accident resulting in
    injury, death, or property damage of $500 or more must be reported immediately
    to law enforcement.
- id: 52
  category: driver_responsibility
  question: How many days does a new Georgia resident have to register their vehicle
    and obtain a Georgia license plate?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents must register their vehicles and obtain a Georgia license
    plate within 30 days of establishing residency.
- id: 53
  category: driver_responsibility
  question: 'If a Georgia driver is convicted of operating a motor vehicle without
    valid insurance, their driver''s license will be suspended for a period of:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: A first conviction for driving without insurance in Georgia results
    in a 60-day suspension of the driver's license.
- id: 54
  category: driver_responsibility
  question: To reinstate a Georgia driver's license suspended for a first-offense
    insurance violation, the driver must pay a reinstatement fee of how much (if paid
    in person)?
  choices:
    A: $100
    B: $210
    C: $310
    D: $500
  answer: B
  explanation: For a first-offense insurance suspension, the reinstatement fee is
    $210 if paid in person (or $200 if paid by mail).
- id: 55
  category: driver_responsibility
  question: Georgia's 'Move Over Law' requires drivers to move over one lane, if safe
    to do so, when approaching which of the following stationary vehicles with flashing
    lights?
  choices:
    A: Only police and fire vehicles
    B: Only ambulances and HERO units
    C: Emergency vehicles, towing vehicles, and highway maintenance vehicles
    D: Only school buses
  answer: C
  explanation: The Move Over Law applies to all stationary emergency vehicles, towing
    vehicles, and highway maintenance vehicles displaying flashing yellow, amber,
    white, red, or blue lights.
- id: 56
  category: driver_responsibility
  question: 'If you change your address within the state of Georgia, you must notify
    the Department of Driver Services (DDS) within:'
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: Georgia law requires that you notify the DDS of any address change
    within 60 days of the move.
- id: 57
  category: driver_responsibility
  question: 'In Georgia, the Title Ad Valorem Tax (TAVT) is a:'
  choices:
    A: Tax paid every year on the vehicle owner's birthday
    B: One-time fee paid when the vehicle is titled in the owner's name
    C: Monthly fee for commercial vehicles only
    D: Tax only applied to vehicles older than 25 years
  answer: B
  explanation: The TAVT is a one-time tax replaced the annual sales tax and annual
    ad valorem tax for most vehicles titled in Georgia after March 1, 2013.
- id: 58
  category: driver_responsibility
  question: 'If a Georgia driver is convicted of littering, they may face a fine of
    up to:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: B
  explanation: Littering is a crime in Georgia. Conviction can result in a fine of
    up to $1,000 and/or 12 months in jail.
- id: 59
  category: driver_responsibility
  question: In Georgia, if you are involved in an accident, you are required by law
    to provide your name, address, and what other information to the other parties
    involved?
  choices:
    A: Social Security Number
    B: Vehicle registration number
    C: Your employer's contact information
    D: A copy of your birth certificate
  answer: B
  explanation: Drivers involved in an accident must provide their name, address, and
    the registration number of the vehicle they are driving.
- id: 60
  category: driver_responsibility
  question: Georgia law requires every person under what age to be properly restrained
    in a child passenger restraining system while riding in a passenger vehicle?
  choices:
    A: 6 years of age
    B: 8 years of age
    C: 10 years of age
    D: 12 years of age
  answer: B
  explanation: Georgia law requires all children under 8 years of age to be properly
    secured in an approved car seat or booster seat while riding in a passenger vehicle.
- id: 61
  category: driver_responsibility
  question: 'If you are convicted of a third ''Hands-Free Georgia Act'' violation
    within 24 months, the fine increases to:'
  choices:
    A: $100
    B: $150
    C: $200
    D: $500
  answer: B
  explanation: A third or subsequent conviction for a hands-free violation within
    24 months results in a $150 fine and 3 points on the driving record.
- id: 62
  category: driver_responsibility
  question: According to Georgia law, you must immediately notify the nearest law
    enforcement agency of an accident if the property damage exceeds what amount?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: Drivers in Georgia are required to report any accident involving injury,
    death, or property damage of $500 or more to the police, sheriff, or Georgia State
    Patrol.
- id: 63
  category: driver_responsibility
  question: 'Georgia''s ''Move-Over'' Law requires drivers to move over one lane,
    if safe to do so, for stopped emergency vehicles. If moving over is not possible,
    the driver must:'
  choices:
    A: Stop completely until signaled to pass
    B: Maintain speed but honk the horn
    C: Slow down to a speed that is reasonable and less than the posted speed limit
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: If a driver cannot move over safely, they must slow down to a speed
    that is reasonable and less than the posted speed limit and be prepared to stop.
- id: 64
  category: driver_responsibility
  question: In Georgia, what is the 'TAVT' that must be paid when a vehicle is titled
    in the state?
  choices:
    A: Total Annual Vehicle Tax
    B: Title Ad Valorem Tax
    C: Traffic Accident Victim Trust
    D: Transportation Authority Value Tax
  answer: B
  explanation: The Title Ad Valorem Tax (TAVT) is a one-time tax paid at the time
    of titling a vehicle in Georgia, replacing the old annual 'birthday tax' and sales
    tax.
- id: 65
  category: driver_responsibility
  question: If you change your address within Georgia, you must notify the Department
    of Revenue (for vehicle registration purposes) within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: Georgia law requires vehicle owners to notify the County Tag Office
    of an address change within 30 days.
- id: 66
  category: driver_responsibility
  question: For a first DUI conviction in Georgia for a driver age 21 or older with
    a BAC of 0.08 or higher, what is the mandatory minimum period of imprisonment?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: B
  explanation: Georgia law mandates a minimum of 24 hours in jail for a first DUI
    conviction if the driver's BAC was 0.08 or higher.
- id: 67
  category: driver_responsibility
  question: Under Georgia's Open Container Law, what is the maximum fine for a person
    convicted of possessing an open container of an alcoholic beverage while operating
    a vehicle?
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: A person convicted of violating Georgia's Open Container Law is subject
    to a fine not to exceed $200.
- id: 68
  category: safe_driving_rules
  question: According to Georgia's 'Move Over' Law, what must a driver do when approaching
    a stationary authorized emergency vehicle with flashing lights on a highway with
    at least two lanes in the same direction?
  choices:
    A: Stop completely until the emergency vehicle leaves
    B: Move over to the next lane if safe to do so, or slow down below the speed limit
      and be prepared to stop
    C: Maintain speed but honk to alert the emergency workers
    D: Only move over if the emergency vehicle is an ambulance
  answer: B
  explanation: Georgia's Move Over Law (OCGA 40-6-16) requires drivers to move over
    one lane if possible. If a lane change is unsafe or impossible, the driver must
    slow down below the posted speed limit and be prepared to stop.
- id: 69
  category: safe_driving_rules
  question: Under Georgia's 'Slow Poke' Law, what is required of a driver in the left-most
    'fast' lane of a multi-lane highway?
  choices:
    A: They must always drive at least 10 mph over the speed limit
    B: They must move to the right if they are being overtaken from the rear by a
      faster vehicle, even if they are traveling at the speed limit
    C: They can stay in the left lane as long as they are going the exact speed limit
    D: They must stay in the left lane to prevent others from speeding
  answer: B
  explanation: Georgia's 'Slow Poke' Law (OCGA 40-6-184) states that on roads with
    two or more lanes in the same direction, a driver in the left lane must move to
    the right if they are being overtaken by a faster vehicle, regardless of the speed
    limit.
- id: 70
  category: safe_driving_rules
  question: When making a turn in Georgia, a driver must give a continuous turn signal
    for at least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Georgia law requires drivers to signal their intention to turn at least
    100 feet before the actual turn.
- id: 71
  category: safe_driving_rules
  question: What are the minimum liability insurance requirements for bodily injury
    or death of two or more people in any one accident in Georgia?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: Georgia's minimum liability insurance requirements are $25,000 for
    bodily injury per person, $50,000 for bodily injury per accident (two or more
    people), and $25,000 for property damage.
- id: 72
  category: safe_driving_rules
  question: In Georgia, what is the maximum fine for a conviction of a traffic violation
    in a highway work zone?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: In Georgia, work zone safety is strictly enforced. Convictions can
    result in fines up to $2,000 and/or imprisonment for up to 12 months.
- id: 73
  category: safe_driving_rules
  question: In Georgia, when is it legal to make a left turn on a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: Anytime there is no oncoming traffic
    D: Only between the hours of midnight and 5:00 AM
  answer: B
  explanation: In Georgia, you may make a left turn on red only if you are turning
    from a one-way street onto another one-way street, after coming to a complete
    stop and yielding to traffic and pedestrians.
- id: 74
  category: safe_driving_rules
  question: The Georgia Driver's Manual recommends maintaining a following distance
    of at least how many seconds behind the vehicle in front of you?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Georgia Department of Driver Services recommends a minimum following
    distance of 3 seconds to allow for safe reaction time.
- id: 75
  category: safe_driving_rules
  question: At what speed can hydroplaning begin to occur on wet Georgia roads, causing
    tires to lose contact with the road surface?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    tires can lose all contact with the road at 55 mph.
- id: 76
  category: safe_driving_rules
  question: In Georgia, you must dim your high-beam headlights when you are within
    how many feet of the vehicle you are following?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Georgia law requires drivers to dim high beams when within 500 feet
    of an approaching vehicle or within 200 feet when following another vehicle.
- id: 77
  category: safe_driving_rules
  question: 'In Georgia, it is illegal to follow a fire apparatus responding to an
    alarm closer than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Georgia law prohibits following a fire truck or other fire apparatus
    responding to an alarm within 500 feet.
- id: 78
  category: safe_driving_rules
  question: When passing a bicycle in Georgia, what is the minimum legal distance
    a motorist must maintain between their vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: One car length
  answer: B
  explanation: Georgia law requires motorists to provide at least 3 feet of space
    when passing a bicyclist.
- id: 79
  category: safe_driving_rules
  question: According to Georgia's 'Slow Poke Law,' what must a driver do in the left-most
    lane of a multi-lane highway?
  choices:
    A: Maintain the exact speed limit
    B: Move to the right if they are being overtaken from the rear by a faster vehicle
    C: Stay in the left lane to prevent others from speeding
    D: Only use the left lane if they are driving at least 10 mph over the limit
  answer: B
  explanation: The 'Slow Poke Law' (O.C.G.A. § 40-6-184) requires drivers in the left
    lane to move to the right if they are being overtaken by a faster vehicle, even
    if the driver in the left lane is traveling at the posted speed limit.
- id: 80
  category: safe_driving_rules
  question: In Georgia, you may not park a vehicle within how many feet of a stop
    sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Georgia law prohibits parking within 30 feet of any flashing signal,
    stop sign, yield sign, or traffic control signal located at the side of a roadway.
- id: 81
  category: safe_driving_rules
  question: 'In Georgia, you must dim your high beam headlights when following another
    vehicle within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Georgia law requires drivers to dim their high beams when following
    another vehicle within 200 feet.
- id: 82
  category: safe_driving_rules
  question: What is the maximum speed limit on a rural interstate highway in Georgia?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: The maximum speed limit on rural interstates in Georgia is 70 mph.
- id: 83
  category: defensive_driving
  question: According to the Georgia Driver's Manual, what is the recommended minimum
    following distance behind the vehicle in front of you under ideal driving conditions?
  choices:
    A: One car length
    B: Two seconds
    C: Four seconds
    D: Five car lengths
  answer: B
  explanation: The Georgia Driver's Manual recommends the 'two-second rule' to maintain
    a safe following distance under ideal conditions. This distance should be increased
    during adverse weather or night driving.
- id: 84
  category: defensive_driving
  question: In Georgia, at what speed can your tires lose all contact with the road
    during heavy rain, a phenomenon known as total hydroplaning?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 70 mph
  answer: C
  explanation: While partial hydroplaning can begin at 35 mph, the Georgia Driver's
    Manual states that at 55 mph, the tires may lose all contact with the road (total
    hydroplaning).
- id: 85
  category: defensive_driving
  question: Under the 'Hands-Free Georgia Act,' which of the following is illegal
    for a driver to do while operating a motor vehicle on a public road?
  choices:
    A: Using a GPS app that is mounted to the dashboard
    B: Physically holding or supporting a wireless device with any part of the body
    C: Using a single-ear Bluetooth earpiece
    D: Using voice-to-text features through a hands-free system
  answer: B
  explanation: The Hands-Free Georgia Act prohibits drivers from physically holding
    or supporting a wireless telecommunications device or stand-alone electronic device
    with any part of their body while driving.
- id: 86
  category: defensive_driving
  question: Georgia's 'Move Over' Law requires drivers to move over one lane, if safe
    to do so, for stationary emergency vehicles. If a driver cannot move over safely,
    what must they do?
  choices:
    A: Stop in the lane of traffic until the emergency vehicle leaves
    B: Maintain speed but move to the far left of their current lane
    C: Reduce speed to a speed that is reasonable and less than the posted limit
    D: Speed up to pass the emergency vehicle as quickly as possible
  answer: C
  explanation: If a driver cannot move over safely for an emergency vehicle with flashing
    lights on the shoulder, they must reduce their speed to a speed that is reasonable
    and less than the posted speed limit and be prepared to stop.
- id: 87
  category: defensive_driving
  question: To practice proper scanning, the Georgia Driver's Manual suggests you
    should look ahead to where your vehicle will be in how many seconds?
  choices:
    A: 2 to 5 seconds
    B: 5 to 10 seconds
    C: 10 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Defensive driving in Georgia involves scanning the road 10 to 15 seconds
    ahead to identify potential hazards early.
- id: 88
  category: defensive_driving
  question: According to Georgia law, headlights must be used during which of the
    following time periods?
  choices:
    A: From 6:00 PM to 6:00 AM
    B: From one hour after sunset to one hour before sunrise
    C: From a half-hour after sunset to a half-hour before sunrise
    D: Only when it is completely dark
  answer: C
  explanation: Georgia law (O.C.G.A. § 40-8-20) requires headlights to be on from
    a half-hour after sunset to a half-hour before sunrise, and at any time it is
    raining or visibility is limited.
- id: 89
  category: defensive_driving
  question: 'If your vehicle begins to skid on a wet or icy road in Georgia, the correct
    defensive driving response is to:'
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Turn the steering wheel in the direction the rear of the vehicle is skidding
    D: Shift the car into neutral and turn off the engine
  answer: C
  explanation: To recover from a skid, you should ease off the gas and turn the steering
    wheel in the direction the rear of the vehicle is skidding.
- id: 90
  category: defensive_driving
  question: When driving in heavy fog in Georgia, which headlight setting should you
    use to maintain the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: In fog, high beams reflect off the water droplets and cause glare.
    Low beams direct light downward and provide better visibility.
- id: 91
  category: defensive_driving
  question: 'In Georgia, you are required by law to have your headlights on when visibility
    is reduced to less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: B
  explanation: Georgia law requires the use of headlights when visibility is limited
    to 500 feet or less due to insufficient light or unfavorable atmospheric conditions.
- id: 92
  category: defensive_driving
  question: If you are convicted of a first offense for violating the Hands-Free Georgia
    Act, how many points will be assessed against your Georgia driver's license?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: A
  explanation: A first conviction for a Hands-Free Georgia Act violation results in
    1 point and a $50 fine. A second conviction is 2 points ($100), and a third is
    3 points ($150).
- id: 93
  category: defensive_driving
  question: When driving on a multi-lane highway in Georgia and approaching a curve,
    what is the safest way to handle your speed?
  choices:
    A: Brake hard while you are in the middle of the curve
    B: Speed up slightly as you enter the curve to maintain momentum
    C: Reduce your speed before you enter the curve
    D: Maintain your highway speed and use the shoulder if necessary
  answer: C
  explanation: The Georgia Driver's Manual advises drivers to reduce speed before
    entering a curve to avoid skidding or losing control.
- id: 94
  category: defensive_driving
  question: In Georgia, what is the 'Move Over' law fine for a first-time offender
    who fails to move over for an emergency vehicle?
  choices:
    A: Up to $100
    B: Up to $250
    C: Up to $500
    D: Exactly $1,000
  answer: C
  explanation: Violating Georgia's Move Over Law can result in a fine of up to $500
    for a first offense.
- id: 95
  category: defensive_driving
  question: 'The Georgia Driver''s Manual warns that ''hydroplaning'' can begin at
    speeds as low as:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Hydroplaning occurs when tires lose contact with the road surface and
    ride on a film of water; this can begin at speeds as low as 35 mph in heavy rain.
- id: 96
  category: defensive_driving
  question: 'To maintain proper awareness while driving, the Georgia Driver''s Manual
    suggests you should scan the road ahead at least:'
  choices:
    A: 5 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: 60 seconds
  answer: B
  explanation: Scanning 10 to 15 seconds ahead allows a driver to anticipate hazards
    and react in time to avoid them.
- id: 97
  category: defensive_driving
  question: Under Georgia's 'Move Over' Law, what must a driver do when approaching
    an authorized emergency vehicle that is stopped on the shoulder with flashing
    lights?
  choices:
    A: Stop immediately in the travel lane
    B: Maintain speed but honk the horn
    C: Move over to the next lane if safe to do so, or slow down below the speed limit
      and be prepared to stop
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: The Move Over Law requires drivers to move over one lane if possible.
    If not safe to move over, the driver must slow down below the posted speed limit
    and be prepared to stop.
- id: 98
  category: defensive_driving
  question: Under the 'Hands-Free Georgia Act,' which of the following is legal for
    a driver over 21?
  choices:
    A: Holding a phone to text while stopped at a red light
    B: Using a GPS app while the phone is mounted to the dashboard
    C: Watching a video on a phone while in heavy traffic
    D: Recording a video while driving
  answer: B
  explanation: Drivers may use GPS or voice-to-text features if the device is mounted
    or used hands-free, but they cannot hold or support the device with any part of
    their body.
- id: 99
  category: defensive_driving
  question: 'Georgia''s ''Slow Poke Law'' (HB 459) requires drivers in the left-most
    lane on multi-lane highways to:'
  choices:
    A: Drive exactly the speed limit at all times
    B: Move to the right if they are being overtaken by a faster vehicle, even if
      they are traveling at the speed limit
    C: Stay in the left lane to prevent others from speeding
    D: Only use the left lane for exits on the left
  answer: B
  explanation: The 'Slow Poke Law' dictates that slower drivers must move out of the
    passing lane (left lane) to allow faster traffic to pass, regardless of the speed
    limit.
- id: 100
  category: defensive_driving
  question: 'When driving in heavy fog in Georgia, you should use:'
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard flashers only
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    moisture in the air, causing glare and making it harder to see.
- id: 101
  category: defensive_driving
  question: 'If your vehicle begins to skid on a slippery Georgia road, you should:'
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Ease your foot off the accelerator and steer in the direction the rear of the
      vehicle is skidding
    D: Shift into neutral and turn off the engine
  answer: C
  explanation: To recover from a skid, take your foot off the gas and turn the steering
    wheel in the direction the back of the car is sliding.
- id: 102
  category: defensive_driving
  question: When driving a vehicle without Anti-lock Brakes (ABS) on a slippery road,
    how should you stop in an emergency?
  choices:
    A: Press the brake pedal as hard as possible and hold it
    B: Pump the brakes gently
    C: Use the emergency parking brake only
    D: Shift to a higher gear
  answer: B
  explanation: For vehicles without ABS, pumping the brakes helps prevent the wheels
    from locking up and maintains steering control.
- id: 103
  category: defensive_driving
  question: 'In Georgia, when approaching a railroad crossing with flashing signal
    lights, you must stop your vehicle within:'
  choices:
    A: 5 to 10 feet from the nearest rail
    B: 15 to 50 feet from the nearest rail
    C: 50 to 100 feet from the nearest rail
    D: Exactly 25 feet from the nearest rail
  answer: B
  explanation: Georgia law requires drivers to stop within 15 to 50 feet of the nearest
    rail at a railroad crossing when signals indicate a train is approaching.
- id: 104
  category: defensive_driving
  question: 'If you are driving on a Georgia highway and a tire blows out, you should:'
  choices:
    A: Apply the brakes quickly and firmly
    B: Grip the steering wheel firmly and take your foot off the accelerator
    C: Immediately pull onto the shoulder at high speed
    D: Turn the steering wheel sharply toward the side of the blowout
  answer: B
  explanation: In a blowout, you should maintain control by gripping the wheel, avoiding
    the brakes until the vehicle has slowed down, and then pulling off the road.
- id: 105
  category: defensive_driving
  question: 'In Georgia, speeding fines in ''Work Zones'' are:'
  choices:
    A: The same as normal speeding fines
    B: Waived if no workers are present
    C: Increased, and may result in a fine of up to $2,000 and mandatory court appearance
    D: Reduced if you have a clean driving record
  answer: C
  explanation: Georgia law imposes heavy penalties for speeding in work zones to protect
    highway workers, including fines up to $2,000 and potential jail time.
- id: 106
  category: alcohol_drugs_health
  question: 'In Georgia, a person 21 years of age or older is considered to be driving
    under the influence (DUI) if their Blood Alcohol Concentration (BAC) is at or
    above:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: According to Georgia law (O.C.G.A. § 40-6-391), it is unlawful for
    any person 21 or older to drive or be in actual physical control of any moving
    vehicle while their alcohol concentration is 0.08 grams or more.
- id: 107
  category: alcohol_drugs_health
  question: Under Georgia's 'Implied Consent' law, what is the penalty for refusing
    to submit to a state-administered chemical test of your blood, breath, or urine?
  choices:
    A: A $500 fine and 2 points on your license
    B: Your driver's license will be suspended for a minimum of one year
    C: A mandatory 48-hour jail sentence
    D: Your vehicle will be impounded for 30 days
  answer: B
  explanation: Georgia's Implied Consent law means that by driving on Georgia roads,
    you agree to chemical testing if suspected of DUI. Refusal results in a minimum
    one-year suspension of your driver's license.
- id: 108
  category: alcohol_drugs_health
  question: In Georgia, what is the maximum fine for a first-offense DUI conviction
    (excluding court costs and surcharges)?
  choices:
    A: Up to $500
    B: Up to $1,000
    C: Up to $2,500
    D: Up to $5,000
  answer: B
  explanation: A first DUI conviction in Georgia carries a fine ranging from $300
    to $1,000, plus applicable court fees and surcharges.
- id: 109
  category: alcohol_drugs_health
  question: A person convicted of DUI while transporting a child under what age will
    also be charged with 'DUI Child Endangerment' in Georgia?
  choices:
    A: Under 12 years of age
    B: Under 14 years of age
    C: Under 16 years of age
    D: Under 18 years of age
  answer: B
  explanation: In Georgia, transporting a child under the age of 14 while driving
    under the influence is a separate offense known as DUI Child Endangerment, which
    carries additional penalties.
- id: 110
  category: alcohol_drugs_health
  question: What is the legal BAC limit for a person operating a Commercial Motor
    Vehicle (CMV) in Georgia?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: For operators of commercial motor vehicles in Georgia, the legal BAC
    limit is stricter at 0.04%.
- id: 111
  category: alcohol_drugs_health
  question: In Georgia, if you are convicted of a second DUI within a 5-year period,
    what is the minimum mandatory jail time?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 10 days
  answer: C
  explanation: A second DUI conviction within five years in Georgia requires a minimum
    of 72 hours in jail, though the total sentence can be up to 12 months.
- id: 112
  category: alcohol_drugs_health
  question: Georgia's 'Open Container Law' prohibits the possession of any open alcoholic
    beverage container in the passenger area of a motor vehicle. What is the maximum
    fine for violating this law?
  choices:
    A: Up to $100
    B: Up to $200
    C: Up to $500
    D: Up to $1,000
  answer: B
  explanation: A violation of Georgia's Open Container Law is punishable by a fine
    not to exceed $200.
- id: 113
  category: alcohol_drugs_health
  question: Which of the following is a requirement for reinstating a Georgia driver's
    license after a DUI suspension?
  choices:
    A: Retaking the driving skills test only
    B: Completion of a DDS-approved DUI Alcohol or Drug Use Risk Reduction Program
    C: Waiting 5 years regardless of the offense
    D: Paying a $1,000 reinstatement fee for a first offense
  answer: B
  explanation: To reinstate a license after a DUI suspension in Georgia, the driver
    must complete a certified Risk Reduction Program (DUI School) and pay the required
    reinstatement fee.
- id: 114
  category: alcohol_drugs_health
  question: 'In Georgia, a driver can be convicted of DUI even if their BAC is less
    than 0.08% if:'
  choices:
    A: They are driving a red car
    B: They are involved in any accident
    C: They are 'less safe' to drive due to the consumption of alcohol
    D: They have a passenger in the vehicle
  answer: C
  explanation: Georgia law allows for a 'DUI Less Safe' conviction if it can be proven
    that the driver's ability to operate the vehicle safely was impaired by alcohol
    or drugs, regardless of the specific BAC level.
- id: 115
  category: alcohol_drugs_health
  question: 'Under Georgia law, a third DUI conviction within a five-year period will
    result in the driver being declared a:'
  choices:
    A: Felony Offender
    B: Habitual Violator
    C: High-Risk Driver
    D: Probationary Driver
  answer: B
  explanation: A person who is convicted of three DUIs within a five-year period in
    Georgia is declared a 'Habitual Violator,' which leads to a five-year license
    revocation.
- id: 116
  category: alcohol_drugs_health
  question: 'If a Georgia driver under age 21 is convicted of DUI with a BAC of 0.08%
    or greater, their license will be suspended for:'
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: For drivers under 21, a BAC of 0.02% to 0.08% results in a 6-month
    suspension, but a BAC of 0.08% or greater results in a 12-month suspension.
- id: 117
  category: alcohol_drugs_health
  question: 'In Georgia, the use of prescription drugs while driving is:'
  choices:
    A: Always legal if you have a valid prescription
    B: Only illegal if the drug is a narcotic
    C: Illegal if the drug renders the driver 'less safe' to drive
    D: Only illegal if mixed with alcohol
  answer: C
  explanation: Having a prescription is not a defense against DUI in Georgia. If a
    prescription or over-the-counter drug impairs your driving ability, you can be
    charged with DUI.
- id: 118
  category: alcohol_drugs_health
  question: Which of the following is true regarding marijuana and driving in Georgia?
  choices:
    A: It is legal to drive if you have a medical marijuana card
    B: It is only illegal if your BAC is also above 0.05%
    C: Georgia has a zero-tolerance policy for any amount of illegal drugs in a driver's
      system
    D: You can only be charged if you are caught smoking while driving
  answer: C
  explanation: Georgia law (O.C.G.A. § 40-6-391) prohibits driving with any amount
    of marijuana or other controlled substances in your blood or urine, regardless
    of whether it was legally prescribed in another state.
- id: 119
  category: alcohol_drugs_health
  question: If you are convicted of a first DUI in Georgia and your BAC was 0.08%
    or higher, what is the mandatory minimum jail time that cannot be stayed or suspended?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: B
  explanation: For a first DUI conviction with a BAC of 0.08% or higher, Georgia law
    requires a minimum of 24 hours in jail.
- id: 120
  category: alcohol_drugs_health
  question: 'In Georgia, if you are convicted of a second DUI within a 5-year period,
    you are required to have an ignition interlock device installed in your vehicle
    for a minimum of:'
  choices:
    A: 6 months
    B: 12 months
    C: 24 months
    D: 5 years
  answer: B
  explanation: For a second DUI conviction within five years, Georgia law requires
    the installation of an ignition interlock device for at least 12 months as part
    of the license reinstatement process.
- id: 121
  category: alcohol_drugs_health
  question: 'In Georgia, a person can be charged with ''DUI Child Endangerment'' if
    they are driving under the influence with a child in the car under the age of:'
  choices:
    A: '12'
    B: '14'
    C: '16'
    D: '18'
  answer: B
  explanation: O.C.G.A. § 40-6-391(l) states that transporting a child under age 14
    while DUI is a separate offense of child endangerment, which also counts as an
    additional DUI for license suspension purposes.
- id: 122
  category: alcohol_drugs_health
  question: A Georgia driver will be declared a 'Habitual Violator' and have their
    license revoked for 5 years if they receive how many DUI convictions within a
    5-year period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: Under Georgia law, three convictions for DUI (or other serious offenses)
    within a five-year period results in Habitual Violator status and a five-year
    license revocation.
- id: 123
  category: alcohol_drugs_health
  question: What is the standard license reinstatement fee for a first DUI conviction
    in Georgia if processed by mail?
  choices:
    A: $100
    B: $150
    C: $210
    D: $500
  answer: C
  explanation: The reinstatement fee for a first DUI suspension in Georgia is $210
    by mail or $200 if handled in person.
- id: 124
  category: alcohol_drugs_health
  question: 'For a second or subsequent DUI conviction in Georgia, the driver must
    complete a clinical evaluation for:'
  choices:
    A: Vision and hearing
    B: Substance abuse
    C: Anger management
    D: Defensive driving
  answer: B
  explanation: Georgia law requires a clinical evaluation for substance abuse (and
    potential treatment) for all second or subsequent DUI offenders before license
    reinstatement.
- id: 125
  category: alcohol_drugs_health
  question: 'If a Georgia driver is convicted of any drug-related offense (possession,
    sale, etc.), even if it did not involve a motor vehicle, their driver''s license
    will be:'
  choices:
    A: Suspended by operation of law
    B: Unchanged, as it wasn't a driving offense
    C: Suspended only if they were under 21
    D: Restricted to daytime driving only
  answer: A
  explanation: In Georgia, a conviction for any controlled substance or marijuana
    offense results in a mandatory driver's license suspension, regardless of whether
    a vehicle was involved.
- id: 126
  category: alcohol_drugs_health
  question: According to Georgia DDS medical requirements, a person with a seizure
    disorder must usually be seizure-free for how long before they can be licensed
    to drive?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Georgia generally requires individuals with a history of seizures to
    be seizure-free for at least 6 months, supported by a doctor's recommendation,
    to maintain driving privileges.
- id: 127
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol and drugs (even over-the-counter
    medications) on driving ability?
  choices:
    A: The effects cancel each other out.
    B: There is no additional effect.
    C: The effect is often multiplied (synergistic effect).
    D: It only matters if the alcohol is over the 0.08% limit.
  answer: C
  explanation: Combining alcohol and drugs can produce a synergistic effect, meaning
    the combined impact on the central nervous system is much greater than the sum
    of the individual effects, severely impairing driving.
- id: 128
  category: penalties_and_points
  question: Under Georgia's 'Hands-Free' law, what is the point penalty for a first
    conviction of operating a motor vehicle while holding or supporting a wireless
    telecommunications device?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 0 points, only a fine
  answer: A
  explanation: A first conviction of the Hands-Free Georgia Act results in 1 point
    on the driving record and a $50 fine.
- id: 129
  category: penalties_and_points
  question: What is the minimum amount of property damage liability insurance required
    by law for a motor vehicle registered in Georgia?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Georgia law requires minimum liability insurance of $25,000 for bodily
    injury per person, $50,000 for bodily injury per accident, and $25,000 for property
    damage.
- id: 130
  category: penalties_and_points
  question: If a driver fails to pay the $200 'Super Speeder' state fee within 120
    days of notice, what is the consequence in Georgia?
  choices:
    A: The fine doubles to $400
    B: A warrant is issued for their arrest
    C: License suspension and an additional $50 reinstatement fee
    D: The vehicle's registration is permanently revoked
  answer: C
  explanation: Failure to pay the Super Speeder fee within 120 days of the notice
    will result in the suspension of the driver's license or driving privileges and
    require a $50 reinstatement fee.
- id: 131
  category: penalties_and_points
  question: In Georgia, a conviction for 'Reckless Driving' results in how many points
    being added to your driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Reckless driving is a serious offense in Georgia and carries a penalty
    of 4 points on the driver's license.
- id: 132
  category: penalties_and_points
  question: What is the maximum fine for a first-time violation of Georgia's 'Move
    Over' law?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Violating Georgia's Move Over Law, which requires drivers to move over
    for emergency vehicles, can result in a fine of up to $500.
- id: 133
  category: penalties_and_points
  question: How many points are assessed for a first conviction of 'Improper usage
    of a child restraint' (e.g., child not in a car seat) in Georgia?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 0 points
  answer: A
  explanation: A first conviction for improper usage of a child restraint results
    in 1 point. A second or subsequent conviction results in 2 points.
- id: 134
  category: penalties_and_points
  question: In Georgia, what is the standard fee to reinstate a driver's license after
    a first suspension for points accumulation if processed in person?
  choices:
    A: $100
    B: $150
    C: $210
    D: $300
  answer: C
  explanation: The reinstatement fee for a first suspension (points or other general
    violations) is $210 when paid in person, or $200 if paid by mail.
- id: 135
  category: penalties_and_points
  question: How many points are assessed for a fourth or subsequent conviction of
    'Improper use of a High Occupancy Vehicle (HOV) lane' in Georgia?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: A
  explanation: While the first three HOV violations do not carry points, a fourth
    or subsequent conviction results in 1 point being added to the driving record.
- id: 136
  category: penalties_and_points
  question: In Georgia, speeding 15 mph to 18 mph over the posted limit will result
    in how many points?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Speeding between 15 and 18 mph over the limit results in 2 points on
    the Georgia driving record.
- id: 137
  category: penalties_and_points
  question: What is the point penalty for a Georgia driver convicted of speeding 34
    mph or more over the posted speed limit?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Speeding 34 mph or more over the posted speed limit is the highest
    point-tier for speeding in Georgia, resulting in 6 points.
- id: 138
  category: penalties_and_points
  question: For a Georgia driver under the age of 18, their license will be suspended
    if they accumulate how many points within a 12-month period?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 15 points
  answer: B
  explanation: The license of any person under 18 years of age will be suspended if
    they accumulate 4 or more points within any 12-month period.
- id: 139
  category: penalties_and_points
  question: In Georgia, how many points are assessed against your driver's license
    for a conviction of speeding 24 miles per hour but less than 34 miles per hour
    over the speed limit?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: According to the Georgia DDS point system, speeding 24-33 mph over
    the limit results in 4 points.
- id: 140
  category: penalties_and_points
  question: Under the Hands-Free Georgia Act, what is the fine for a second conviction
    of using a handheld wireless device while driving within a 24-month period?
  choices:
    A: Up to $50
    B: Up to $100
    C: Up to $150
    D: Up to $200
  answer: B
  explanation: A second conviction within 24 months for violating the Hands-Free Georgia
    Act results in a $100.00 fine and 2 points on the driving record.
- id: 141
  category: penalties_and_points
  question: For a first DUI conviction in Georgia, if the driver's Blood Alcohol Concentration
    (BAC) was .08 or higher, what is the mandatory minimum period of imprisonment?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: B
  explanation: For a first DUI conviction with a BAC of .08 or higher, Georgia law
    requires a mandatory minimum of 24 hours in jail.
- id: 142
  category: penalties_and_points
  question: How many points are assessed against a Georgia driver's record for a first
    conviction of failing to properly restrain a child under age 8 in a passenger
    vehicle?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: A
  explanation: A first conviction for a child restraint violation in Georgia results
    in 1 point. Subsequent convictions result in 2 points.
- id: 143
  category: penalties_and_points
  question: How many points are assessed for a conviction of possessing an open container
    of an alcoholic beverage while driving in Georgia?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Possession of an open container of an alcoholic beverage while driving
    results in 2 points on the Georgia driving record.
- id: 144
  category: penalties_and_points
  question: 'Violating Georgia''s ''Move Over'' Law, which requires drivers to move
    over for stationary emergency vehicles with flashing lights, can result in a fine
    of up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: A violation of Georgia's Move Over Law is a traffic offense punishable
    by a fine of up to $500.
- id: 145
  category: penalties_and_points
  question: To reinstate a Georgia driver's license after a first DUI suspension,
    the driver must pay a reinstatement fee of _______ if paying in person.
  choices:
    A: $100
    B: $150
    C: $200
    D: $210
  answer: C
  explanation: The reinstatement fee for a first DUI suspension in Georgia is $210
    by mail or $200 if handled in person or online.
- id: 146
  category: sharing_the_road
  question: In Georgia, when are you NOT required to stop for a school bus that is
    stopped with its red lights flashing and loading/unloading passengers?
  choices:
    A: When you are traveling in the opposite direction on a two-lane road.
    B: When you are traveling in the opposite direction on a highway with a center
      turn lane.
    C: When you are traveling in the opposite direction on a highway divided by a
      grass or concrete median.
    D: You must always stop for a school bus regardless of the road type.
  answer: C
  explanation: Under Georgia law, drivers traveling in the opposite direction of a
    school bus are only exempt from stopping if the highway is separated by a physical
    barrier or a grass/unpaved median. A center turn lane is not considered a physical
    barrier.
- id: 147
  category: sharing_the_road
  question: 'Georgia''s ''Stop and Stay Stopped'' law for pedestrians requires drivers
    to stop and remain stopped for a pedestrian in a crosswalk when:'
  choices:
    A: The pedestrian is anywhere on the entire roadway.
    B: The pedestrian is within one lane of the half of the roadway on which the vehicle
      is traveling.
    C: The pedestrian has reached the center of the road.
    D: Only if the pedestrian is using a white cane or a guide dog.
  answer: B
  explanation: Georgia law requires drivers to stop and stay stopped for pedestrians
    who are within one lane of the driver's half of the roadway.
- id: 148
  category: sharing_the_road
  question: Which of the following is TRUE regarding motorcycle 'lane splitting' (operating
    between rows of stopped or moving vehicles) in Georgia?
  choices:
    A: It is legal if the motorcycle is traveling under 15 mph.
    B: It is legal only on multi-lane interstate highways.
    C: It is illegal in the state of Georgia.
    D: It is legal only during peak rush hour times.
  answer: C
  explanation: In Georgia, lane splitting is illegal. Motorcyclists are entitled to
    the full use of a lane, and no motor vehicle shall be driven in such a manner
    as to deprive any motorcycle of the full use of a lane.
- id: 149
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' Where are these blind spots located?
  choices:
    A: Directly behind the truck and directly in front of the truck.
    B: Only on the right side of the truck.
    C: Only on the left side of the truck.
    D: In the front, the rear, and on both sides of the truck.
  answer: D
  explanation: The 'No-Zones' are the large blind spots around a truck where the driver
    cannot see other vehicles. These are located in the front, the rear, and on both
    sides (especially the right side).
- id: 150
  category: sharing_the_road
  question: When a school bus is stopped on a road with a center turn lane and no
    physical median, which drivers must stop?
  choices:
    A: Only drivers following the bus.
    B: Only drivers in the center turn lane.
    C: Drivers in all lanes and in both directions.
    D: No one is required to stop if there are more than two lanes.
  answer: C
  explanation: If there is no physical median (like grass or a wall), all traffic
    in both directions must stop for a school bus with its red lights flashing and
    stop arm extended, even if there is a center turn lane.
- id: 151
  category: sharing_the_road
  question: 'Under Georgia law, a person riding a bicycle has all the rights and duties
    of a driver of a vehicle, EXCEPT:'
  choices:
    A: They do not have to obey traffic signals.
    B: They are not required to signal turns.
    C: Provisions which by their nature can have no application (such as seatbelt
      laws).
    D: They can ride on the sidewalk in any city regardless of age.
  answer: C
  explanation: Bicyclists must follow the same rules of the road as motor vehicle
    drivers, except for those rules that physically cannot apply to a bicycle.
- id: 152
  category: sharing_the_road
  question: 'When approaching a person crossing the street with a white cane or a
    guide dog, Georgia law requires you to:'
  choices:
    A: Honk your horn to let them know you are there.
    B: Stop and take all necessary precautions to avoid injury to the pedestrian.
    C: Drive around them slowly if there is room.
    D: Wait for them to wave you through.
  answer: B
  explanation: Georgia law (O.C.G.A. § 40-6-94) states that drivers must take all
    necessary precautions to avoid injury to any blind pedestrian who is carrying
    a white cane or using a guide dog.
- id: 153
  category: sharing_the_road
  question: In Georgia, which of the following is required for all motorcycle operators
    and passengers?
  choices:
    A: They must wear a helmet approved by the Commissioner of Public Safety.
    B: They must wear leather jackets.
    C: They must have a passenger seat to carry a passenger.
    D: Both A and C
  answer: D
  explanation: Georgia law requires all motorcycle riders to wear a helmet and, if
    carrying a passenger, the motorcycle must be equipped with a permanent seat and
    footrests for that passenger.
- id: 154
  category: sharing_the_road
  question: 'When a commercial truck is making a right turn at an intersection, a
    driver should:'
  choices:
    A: Try to squeeze between the truck and the curb.
    B: Pass the truck on the left before it completes the turn.
    C: Stay back and give the truck plenty of room to complete the turn.
    D: Honk to let the truck driver know you are in their blind spot.
  answer: C
  explanation: Trucks often need to swing wide to the left to make a right turn. Drivers
    should never try to cut in between the truck and the curb, as the truck driver
    cannot see you and you may be crushed.
- id: 155
  category: sharing_the_road
  question: In Georgia, what does a 'Slow Moving Vehicle' emblem look like?
  choices:
    A: A blue circle with a white border.
    B: A triangular orange emblem with a red reflective border.
    C: A square yellow sign with black lettering.
    D: A round green sign with a white 'X'.
  answer: B
  explanation: A slow-moving vehicle (traveling at 25 mph or less) must display a
    triangular orange emblem with a red reflective border on the rear of the vehicle.
- id: 156
  category: sharing_the_road
  question: 'If you are following a fire apparatus (fire truck) that is responding
    to a fire alarm, Georgia law prohibits you from following closer than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: According to O.C.G.A. § 40-6-247, it is unlawful to follow any fire
    apparatus responding to an alarm closer than 500 feet or to drive into or park
    within the block where the fire apparatus has stopped in answer to a fire alarm.
- id: 157
  category: sharing_the_road
  question: Regarding lane usage for motorcycles in Georgia, which of the following
    is TRUE?
  choices:
    A: Motorcycles are allowed to 'lane split' between rows of stopped cars
    B: Two motorcycles are permitted to operate side-by-side in a single lane
    C: Motorcycles must always ride on the shoulder of the road
    D: Motorcycles may only use the left half of a travel lane
  answer: B
  explanation: In Georgia, motorcycles are entitled to the full use of a lane, and
    two motorcycles may legally ride side-by-side in a single lane. Lane splitting
    (riding between lanes) is illegal.
- id: 158
  category: sharing_the_road
  question: 'When an emergency vehicle with flashing blue or red lights and a siren
    is approaching from either direction on a two-lane road, a Georgia driver must:'
  choices:
    A: Slow down and keep driving
    B: Pull over to the right edge of the road and stop
    C: Stop exactly where they are in the lane
    D: Turn on hazard lights and increase speed
  answer: B
  explanation: Upon the approach of an emergency vehicle with activated lights and
    sirens, Georgia law requires drivers to yield the right-of-way by pulling as close
    as possible to the right-hand edge or curb and stopping.
- id: 159
  category: sharing_the_road
  question: On a two-lane road without a median, what must a driver do when a school
    bus stops and activates its red flashing lights and 'stop' arm?
  choices:
    A: Only the traffic following the bus must stop
    B: Only the traffic meeting the bus must stop
    C: Traffic in both directions must stop
    D: Drivers may pass at 15 mph if no children are visible
  answer: C
  explanation: On any two-lane road, or any road without a physical median, all traffic
    from both directions must stop for a school bus that is loading or unloading passengers.
- id: 160
  category: sharing_the_road
  question: In Georgia, are bicyclists required to follow the same traffic laws as
    motor vehicle drivers?
  choices:
    A: No, they are considered pedestrians
    B: Yes, bicycles are legally considered vehicles
    C: Only when riding on the sidewalk
    D: Only when riding on highways
  answer: B
  explanation: In Georgia, bicycles are legally considered vehicles. Bicyclists have
    the same rights and responsibilities on the road as drivers of motor vehicles,
    including obeying traffic signals and signs.
- id: 161
  category: sharing_the_road
  question: 'When you see a pedestrian carrying a white cane or using a guide dog
    at an intersection, you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Drive around them if there is room
    C: Stop and stay stopped until the pedestrian has crossed the entire roadway
    D: Wait for them to cross your lane, then proceed
  answer: C
  explanation: Georgia law requires drivers to give the right-of-way to any blind
    pedestrian. You must stop and remain stopped until they have safely crossed the
    entire roadway.
- id: 162
  category: sharing_the_road
  question: Why should you avoid following a large truck too closely?
  choices:
    A: The truck's exhaust will damage your engine
    B: You will be in the truck driver's rear blind spot (No-Zone)
    C: Trucks are required to stop at all railroad crossings
    D: It is illegal to drive behind a truck for more than 5 miles
  answer: B
  explanation: Following a truck too closely puts you in the rear 'No-Zone' where
    the truck driver cannot see you. This also limits your own view of the road ahead.
- id: 163
  category: sharing_the_road
  question: Which of the following is a legal requirement for motorcycle riders in
    Georgia?
  choices:
    A: Helmets are only required for riders under 21
    B: Helmets are optional if the rider has insurance
    C: All riders and passengers must wear a DOT-approved helmet
    D: Helmets are only required on interstate highways
  answer: C
  explanation: Georgia law requires all operators and passengers on a motorcycle to
    wear a protective helmet that complies with DOT standards.
- id: 164
  category: sharing_the_road
  question: What is the rule regarding funeral processions in Georgia?
  choices:
    A: Processions must yield to all other traffic
    B: Processions have the right-of-way at intersections regardless of traffic signals,
      if led by a law enforcement vehicle
    C: Processions are only allowed on Sundays
    D: Individual drivers in a procession must stop at all red lights
  answer: B
  explanation: In Georgia, funeral processions have the right-of-way at intersections.
    Other drivers must yield to the procession and may not drive between vehicles
    in the procession.
- id: 165
  category: sharing_the_road
  question: In Georgia, it is illegal for any person age ____ or older to ride a bicycle
    on a sidewalk unless local ordinances permit it.
  choices:
    A: '10'
    B: '12'
    C: '16'
    D: '18'
  answer: B
  explanation: According to Georgia law, no person age 12 or older shall drive any
    vehicle (including bicycles) upon a sidewalk or sidewalk area, except upon permanent
    or duly authorized temporary driveways.
- id: 166
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the driver may:'
  choices:
    A: Stay strictly in the right lane
    B: Need to swing wide to the left to complete the turn
    C: Turn from the left lane
    D: Stop and wait for all traffic to clear in all directions
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn.
    Drivers should avoid 'squeezing' between the truck and the curb when a truck is
    signaling a right turn.
- id: 167
  category: vehicle_information
  question: According to Georgia law, when are you required to have your headlights
    turned on?
  choices:
    A: Only between the hours of sunset and sunrise
    B: Only when it is raining or foggy
    C: From half an hour after sunset to half an hour before sunrise, and when it
      is raining
    D: Only when visibility is less than 1,000 feet
  answer: C
  explanation: Georgia law (O.C.G.A. § 40-8-20) requires headlights to be on from
    a half hour after sunset to a half hour before sunrise, at any time when it is
    raining, or when visibility is limited.
- id: 168
  category: vehicle_information
  question: What is the maximum legal window tint darkness allowed on the side windows
    of a passenger vehicle in Georgia?
  choices:
    A: No less than 20% light transmission
    B: No less than 32% light transmission
    C: No less than 50% light transmission
    D: Window tinting is illegal on side windows in Georgia
  answer: B
  explanation: Georgia law (O.C.G.A. § 40-8-73.1) prohibits window tint that allows
    less than 32% light transmission (plus or minus 3%) on the side or rear windows.
- id: 169
  category: vehicle_information
  question: 'In Georgia, a tire is considered unsafe if the tread depth is less than:'
  choices:
    A: 1/16 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/8 of an inch
  answer: B
  explanation: Georgia law specifies that tires are unsafe if they have less than
    2/32 of an inch of tread depth.
- id: 170
  category: vehicle_information
  question: 'Every motor vehicle in Georgia must be equipped with a mirror that allows
    the driver to see the highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: Georgia law requires a rearview mirror that provides a view of the
    highway for at least 200 feet to the rear of the vehicle.
- id: 171
  category: vehicle_information
  question: 'A motor vehicle''s horn in Georgia must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: According to Georgia Code § 40-8-70, every motor vehicle must be equipped
    with a horn in good working order capable of emitting sound audible from a distance
    of not less than 200 feet.
- id: 172
  category: vehicle_information
  question: In Georgia, children under what age must be properly restrained in a child
    passenger restraining system appropriate for their height and weight?
  choices:
    A: Under 4 years of age
    B: Under 6 years of age
    C: Under 8 years of age
    D: Under 10 years of age
  answer: C
  explanation: Georgia law requires children under 8 years of age to be properly secured
    in an approved car seat or booster seat while riding in a passenger automobile,
    van, or pickup truck.
- id: 173
  category: vehicle_information
  question: In how many Georgia counties is annual emissions testing required for
    most gasoline-powered passenger vehicles?
  choices:
    A: All 159 counties
    B: The 5 most populated counties
    C: 13 metro Atlanta counties
    D: Only the city of Atlanta
  answer: C
  explanation: 'The Georgia Clean Air Force requires emissions testing in 13 metro
    Atlanta counties: Cherokee, Clayton, Cobb, Coweta, DeKalb, Douglas, Fayette, Forsyth,
    Fulton, Gwinnett, Henry, Paulding, and Rockdale.'
- id: 174
  category: vehicle_information
  question: Georgia law requires that the service brakes on a passenger vehicle be
    able to stop the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 40 feet
  answer: C
  explanation: Under Georgia Code § 40-8-53, the service brakes on a passenger vehicle
    must be able to stop the vehicle within 30 feet when traveling at 20 mph on a
    dry, level pavement.
- id: 175
  category: vehicle_information
  question: In Georgia, which type of vehicle is required to display a 'slow-moving
    vehicle' emblem (a triangular orange sign)?
  choices:
    A: Any vehicle traveling 10 mph below the speed limit
    B: Vehicles designed to travel at speeds of 25 mph or less
    C: Only horse-drawn carriages
    D: Oversized semi-trucks
  answer: B
  explanation: Georgia law requires the slow-moving vehicle emblem on farm machinery
    and other vehicles designed to operate at speeds of 25 mph or less.
- id: 176
  category: vehicle_information
  question: 'Georgia law requires that turn signal lights be visible from a distance
    of not less than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: According to Georgia Code § 40-8-25, turn signals must be visible from
    a distance of 300 feet to both the front and the rear in normal sunlight.
- id: 177
  category: vehicle_information
  question: 'Every motor vehicle in Georgia must have at least one tail lamp that
    emits a red light visible from a distance of:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Georgia law requires tail lamps to be visible from a distance of 500
    feet to the rear.
- id: 178
  category: vehicle_information
  question: Under the Georgia Seat Belt Law, which of the following is true for occupants
    of a passenger vehicle?
  choices:
    A: Only the driver must wear a seat belt
    B: Only passengers under 18 must wear a seat belt
    C: Each occupant in the front seat must be restrained by a seat belt
    D: Seat belts are optional if the vehicle has airbags
  answer: C
  explanation: Georgia's primary seat belt law (O.C.G.A. § 40-8-76.1) requires all
    front seat occupants of passenger vehicles to wear a seat belt.
- id: 179
  category: vehicle_information
  question: In Georgia, it is illegal to modify a vehicle's suspension system so that
    the bumper height is altered by more than how many inches from the manufacturer's
    original design?
  choices:
    A: 1 inch
    B: 2 inches
    C: 4 inches
    D: 6 inches
  answer: B
  explanation: Georgia law (O.C.G.A. § 40-8-6) prohibits altering the suspension or
    chassis of a passenger car so that the bumper height is more than 2 inches above
    or below the factory original.
- id: 180
  category: vehicle_information
  question: According to Georgia law, what is the minimum legal tread depth for tires
    on a passenger vehicle?
  choices:
    A: 1/32 inch
    B: 2/32 (1/16) inch
    C: 4/32 (1/8) inch
    D: 6/32 inch
  answer: B
  explanation: Georgia law requires that tires have at least 2/32 (or 1/16) of an
    inch of tread depth in all major grooves to be considered safe and legal.
- id: 181
  category: vehicle_information
  question: 'In Georgia, you must use your headlights between one-half hour after
    sunset and one-half hour before sunrise, or when visibility is less than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Georgia law (O.C.G.A. § 40-8-20) requires headlights to be on when
    it is raining or when visibility is limited to less than 500 feet.
- id: 182
  category: vehicle_information
  question: Under Georgia law, window tint on the front side windows of a passenger
    car must allow at least what percentage of light transmission?
  choices:
    A: 20%
    B: 25%
    C: 32%
    D: 50%
  answer: C
  explanation: Georgia law (O.C.G.A. § 40-8-73.1) prohibits window tinting that reduces
    light transmission to less than 32%, plus or minus 3%.
- id: 183
  category: vehicle_information
  question: 'Georgia law requires every motor vehicle to have a horn that can be heard
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: A motor vehicle's horn must be in good working order and capable of
    emitting sound audible under normal conditions from a distance of not less than
    200 feet.
- id: 184
  category: vehicle_information
  question: In Georgia, turn signal lights must be visible from a distance of not
    less than how many feet to the front and rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Georgia law requires turn signals to be visible from a distance of
    300 feet in normal sunlight.
- id: 185
  category: vehicle_information
  question: 'A ''Slow Moving Vehicle'' emblem (a triangular orange/red sign) must
    be displayed on the rear of any vehicle designed to travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: In Georgia, vehicles designed to travel at 25 mph or less, such as
    farm machinery or construction equipment, must display the Slow Moving Vehicle
    emblem.
- id: 186
  category: vehicle_information
  question: 'Georgia law requires that the rear license plate must be illuminated
    so that it is legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The license plate light must render the plate clearly legible from
    a distance of 50 feet to the rear.
- id: 187
  category: vehicle_information
  question: Under Georgia law, what is the maximum number of auxiliary driving lamps
    (such as fog lights) that may be mounted on the front of a vehicle?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Georgia law permits no more than two auxiliary driving lamps or two
    fog lamps to be mounted on the front of a vehicle.
- id: 188
  category: vehicle_information
  question: Regarding vehicle exhaust systems, Georgia law specifically prohibits
    which of the following?
  choices:
    A: Dual exhaust pipes
    B: Chrome-plated tailpipes
    C: Muffler cut-outs or bypasses
    D: Exhaust systems that exit to the side
  answer: C
  explanation: Georgia law (O.C.G.A. § 40-8-71) requires every vehicle to have a muffler
    in good working order and prohibits the use of a muffler cut-out, bypass, or similar
    device.
- id: 189
  category: signs_and_signals
  question: In Georgia, what does a flashing yellow arrow at an intersection indicate?
  choices:
    A: Stop and wait for the light to turn green
    B: The left turn is protected and oncoming traffic is stopped
    C: Turns are allowed after yielding to oncoming traffic and pedestrians
    D: The signal is broken and should be treated as a four-way stop
  answer: C
  explanation: According to the Georgia Driver's Manual, a flashing yellow arrow means
    you may turn left after yielding to oncoming traffic and pedestrians. Oncoming
    traffic still has a green light.
- id: 190
  category: signs_and_signals
  question: In Georgia, what do double solid yellow lines in the center of the road
    signify?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on your side
    C: Passing is prohibited from either side
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines indicate that passing is prohibited in both
    directions. You may only cross them when making a turn into or from an alley,
    private road, or driveway.
- id: 191
  category: signs_and_signals
  question: When using hand signals in Georgia, what does it mean when a driver's
    arm is extended straight out the window?
  choices:
    A: The driver is slowing down
    B: The driver is making a right turn
    C: The driver is making a left turn
    D: The driver is stopping
  answer: C
  explanation: The standard hand signal for a left turn is the arm and hand extended
    horizontally out the window.
- id: 192
  category: signs_and_signals
  question: In Georgia, what is the maximum distance a vehicle may travel in a shared
    center turn lane before making a turn?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Georgia law specifies that a shared center turn lane (marked by solid
    and dashed yellow lines) cannot be used for passing or through travel, and a vehicle
    may not travel more than 300 feet in this lane.
- id: 193
  category: signs_and_signals
  question: What does a solid white line painted across a road at an intersection
    represent in Georgia?
  choices:
    A: A crosswalk for pedestrians
    B: A stop line
    C: A yield line
    D: A parking boundary
  answer: B
  explanation: A solid white line across a lane at an intersection is a stop line.
    It indicates the point where a vehicle must stop for a stop sign or red light.
- id: 194
  category: signs_and_signals
  question: In Georgia, what does a 'gore' area refer to on a highway?
  choices:
    A: A high-accident zone
    B: The triangular area between a through lane and an exit or entrance ramp
    C: The shoulder of the road reserved for emergency vehicles
    D: A designated carpool pickup location
  answer: B
  explanation: The 'gore' is the area of convergence or divergence between lanes of
    traffic, typically marked by white lines. In Georgia, it is illegal to drive over
    or park in a gore.
- id: 195
  category: signs_and_signals
  question: What is the meaning of a 'Pedestrian Hybrid Beacon' (HAWK signal) when
    the two top red lights are flashing in an alternating pattern?
  choices:
    A: Drivers must stop and remain stopped until the lights go dark
    B: Drivers must stop and may proceed if the way is clear, similar to a stop sign
    C: Drivers may proceed with caution without stopping
    D: The signal is malfunctioning
  answer: B
  explanation: When the HAWK signal flashes red, drivers must come to a complete stop
    and may proceed only after yielding to pedestrians in the crosswalk.
- id: 196
  category: signs_and_signals
  question: 'In Georgia, a diamond-shaped sign with an orange background is used to
    indicate:'
  choices:
    A: A school zone
    B: A railroad crossing
    C: Construction or maintenance zones
    D: Public recreation areas
  answer: C
  explanation: Orange diamond-shaped signs are used specifically for construction,
    maintenance, or utility operations to warn drivers of workers and equipment ahead.
- id: 197
  category: signs_and_signals
  question: What does a round yellow sign with a black 'X' and the letters 'RR' indicate?
  choices:
    A: A sharp curve ahead
    B: A highway intersection
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: The circular yellow sign is a railroad advance warning sign, alerting
    drivers that they are approaching a railroad crossing.
- id: 198
  category: signs_and_signals
  question: 'In Georgia, when you see a ''Slow Moving Vehicle'' emblem (an orange
    triangle with a red border) on the rear of a vehicle, it means the vehicle travels
    at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The Slow Moving Vehicle emblem is required on vehicles designed to
    travel at speeds of 25 mph or less, such as farm machinery or horse-drawn carriages.
- id: 199
  category: signs_and_signals
  question: What is the purpose of a 'Rectangular Rapid Flashing Beacon' (RRFB) in
    Georgia?
  choices:
    A: To warn of high-speed traffic ahead
    B: To alert drivers to a change in the speed limit
    C: To alert drivers to pedestrians in a crosswalk
    D: To signal an approaching emergency vehicle
  answer: C
  explanation: RRFBs are user-actuated amber LEDs used at unsignalized intersections
    or mid-block crosswalks to increase driver awareness of pedestrians.
- id: 200
  category: signs_and_signals
  question: 'A pentagon-shaped (five-sided) sign indicates that you are near:'
  choices:
    A: A hospital
    B: A county line
    C: A school zone or school crossing
    D: A state park
  answer: C
  explanation: The five-sided pentagon shape is reserved exclusively for school zones
    and school crossings.
- id: 201
  category: signs_and_signals
  question: In Georgia, what does a solid yellow line on your side of a broken yellow
    center line mean?
  choices:
    A: You may pass if the way is clear
    B: You are in a one-way zone
    C: Passing is prohibited for you
    D: You must speed up to clear the lane
  answer: C
  explanation: A solid yellow line on your side of the center line means you are in
    a no-passing zone and cannot legally pass other vehicles.
- id: 202
  category: signs_and_signals
  question: When a driver's left arm is extended out the window and bent downward
    at the elbow, what signal are they giving?
  choices:
    A: Left turn
    B: Right turn
    C: Stop or slow down
    D: U-turn
  answer: C
  explanation: In Georgia, the hand signal for stopping or slowing down is the left
    arm extended downward at the elbow.
- id: 203
  category: signs_and_signals
  question: What is the meaning of a pennant-shaped sign located on the left side
    of the road?
  choices:
    A: School zone ahead
    B: Yield right-of-way
    C: No passing zone
    D: Railroad crossing
  answer: C
  explanation: A pennant-shaped sign is placed on the left side of the road to indicate
    the beginning of a no-passing zone.
- id: 204
  category: signs_and_signals
  question: In Georgia, what color are signs used to provide information about construction
    and maintenance zones?
  choices:
    A: Yellow
    B: Orange
    C: Green
    D: Blue
  answer: B
  explanation: Orange is the standard color for background on signs used in Georgia
    construction and maintenance work zones.
- id: 205
  category: signs_and_signals
  question: Which sign shape is used exclusively for 'Yield' signs in Georgia?
  choices:
    A: Octagon
    B: Diamond
    C: Equilateral triangle pointing down
    D: Pentagon
  answer: C
  explanation: The yield sign is an equilateral triangle with the point at the bottom,
    featuring a red border and white interior.
- id: 206
  category: signs_and_signals
  question: 'A white diamond symbol painted on the pavement of a Georgia highway lane
    indicates:'
  choices:
    A: The lane is for emergency vehicles only
    B: The lane is reserved for High Occupancy Vehicles (HOV)
    C: The lane is ending soon
    D: A railroad crossing is ahead
  answer: B
  explanation: The diamond symbol indicates a lane reserved for specific vehicles,
    most commonly High Occupancy Vehicles (HOV) like buses or carpools.
- id: 207
  category: signs_and_signals
  question: At a Georgia intersection, what does a flashing yellow arrow mean?
  choices:
    A: Stop and wait for a green arrow
    B: The left turn is protected; oncoming traffic is stopped
    C: Turns are allowed after yielding to oncoming traffic and pedestrians
    D: The intersection is closed to all turns
  answer: C
  explanation: A flashing yellow arrow means you may turn in the direction of the
    arrow after yielding to oncoming traffic and pedestrians. Oncoming traffic has
    a green light.
- id: 208
  category: signs_and_signals
  question: What is the shape of a sign that warns of a school zone or school crossing?
  choices:
    A: Diamond
    B: Circle
    C: Pentagon
    D: Rectangle
  answer: C
  explanation: A five-sided sign (pentagon) is used to warn drivers that they are
    approaching a school zone or a school crossing.
- id: 209
  category: signs_and_signals
  question: 'A triangular orange sign with a red reflective border on the rear of
    a vehicle indicates:'
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is a slow-moving vehicle (25 mph or less)
    C: The vehicle is an oversized load
    D: The vehicle is a student driver
  answer: B
  explanation: This emblem is required on the rear of all slow-moving vehicles, such
    as farm machinery or construction equipment, designed to travel at speeds of 25
    mph or less.
- id: 210
  category: signs_and_signals
  question: 'To signal a right turn using hand signals, a Georgia driver should:'
  choices:
    A: Extend the left arm straight out
    B: Extend the left arm upward
    C: Extend the right arm straight out
    D: Extend the left arm downward
  answer: B
  explanation: The proper hand signal for a right turn is the left arm extended upward
    at the elbow.
- id: 211
  category: signs_and_signals
  question: What do broken white lines on the pavement indicate?
  choices:
    A: Traffic is moving in opposite directions; no passing
    B: Traffic is moving in the same direction; passing is permitted
    C: The edge of the roadway
    D: A pedestrian crosswalk
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    You may cross these lines to change lanes when it is safe to do so.
- id: 212
  category: signs_and_signals
  question: 'A red circle with a white horizontal bar in the middle is the sign for:'
  choices:
    A: Yield
    B: No Parking
    C: Do Not Enter
    D: One Way
  answer: C
  explanation: The 'Do Not Enter' sign is a square with a red circle and a white horizontal
    bar, indicating you are not allowed to enter the road from that direction.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 213
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 214
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 215
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 216
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 217
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 218
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 219
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 220
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 221
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 222
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 223
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 224
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 225
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 226
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 227
