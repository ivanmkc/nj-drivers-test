metadata:
  source: 2023-2024 Georgia Driver's Manual (dds.georgia.gov)
  total_questions: 390
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: safe_driving_rules
  question: What should you do immediately when you see emergency lights behind you?
  choices:
    A: Stop in the middle of the road.
    B: Activate your turn signal and pull off or to the side of the roadway as soon
      as it is safe.
    C: Speed up to find a well-lit area.
    D: Exit your vehicle and wait for the officer.
  answer: B
  explanation: The manual states that when you see emergency lights behind you, you
    should activate your turn signal and pull off or to the side of the roadway as
    soon as it is safe to do so.
- id: 2
  category: safe_driving_rules
  question: If you are pulled over by the police at night, what should you do to assist
    with visibility?
  choices:
    A: Turn off your headlights.
    B: Turn on your hazard lights and honk your horn.
    C: Turn on your interior lights.
    D: Shine a flashlight out the window.
  answer: C
  explanation: According to the manual, you should turn on your interior lights if
    you are pulled over at night to assist with visibility.
- id: 3
  category: safe_driving_rules
  question: During a traffic stop, where should you keep your hands?
  choices:
    A: In your pockets.
    B: Reaching for your glove compartment.
    C: Behind your head.
    D: On the steering wheel or in a visible location.
  answer: D
  explanation: The manual instructs drivers to keep their hands on the steering wheel
    or in a visible location so they are easily observable by the officer.
- id: 4
  category: driver_responsibility
  question: If you have a weapon in the vehicle during a traffic stop, when should
    you let the officer know?
  choices:
    A: Upon first contact with the officer.
    B: Only if the officer asks to search the vehicle.
    C: After handing over your license and registration.
    D: You are not required to tell the officer.
  answer: A
  explanation: The manual states that when the officer approaches the vehicle, you
    should let the officer know if you have a weapon in the vehicle upon first contact.
- id: 5
  category: driver_responsibility
  question: What should you do if your driver's license and vehicle documents are
    out of your reach during a traffic stop?
  choices:
    A: Quickly reach for them before the officer approaches.
    B: Tell the officer where they are and wait for their acknowledgement before reaching
      to retrieve them.
    C: Step out of the vehicle to get them from the trunk.
    D: Refuse to provide them since they are out of reach.
  answer: B
  explanation: If the documents are out of your reach, the manual advises to tell
    the officer where they are and wait for the officer's acknowledgement before reaching
    to retrieve the documents.
- id: 6
  category: penalties_and_points
  question: What does your signature on a traffic ticket indicate?
  choices:
    A: An admission of guilt.
    B: A waiver of your right to a court hearing.
    C: It is not an admission of guilt.
    D: An agreement to pay the fine immediately.
  answer: C
  explanation: The manual explicitly states, 'Your acceptance and signature on a traffic
    ticket is not an admission of guilt.'
- id: 7
  category: penalties_and_points
  question: What may happen if you refuse to sign a traffic ticket?
  choices:
    A: The ticket will be dismissed.
    B: You will be given a warning instead.
    C: Your license will be immediately suspended.
    D: It may result in your arrest.
  answer: D
  explanation: According to the manual, the refusal to sign a traffic ticket may result
    in your arrest.
- id: 8
  category: driver_responsibility
  question: If you disagree with the officer's decision to issue a traffic ticket,
    what is the proper course of action?
  choices:
    A: Argue with the officer to prolong the contact.
    B: Refuse to sign the ticket.
    C: Seek to contest the decision in court through established legal channels.
    D: Drive away from the scene.
  answer: C
  explanation: The manual advises that if you disagree with the officer's decision,
    you should not argue, but rather seek to contest the decision in court through
    established legal channels.
- id: 9
  category: driver_responsibility
  question: If you believe an officer acted inappropriately during a traffic stop,
    what should you do?
  choices:
    A: Argue with the officer on the side of the road.
    B: Request to speak to a supervisor as soon as possible after the stop.
    C: Refuse to provide your driver's license.
    D: Exit your vehicle to confront the officer.
  answer: B
  explanation: If you believe the officer acted inappropriately, the manual states
    you may request to speak to a supervisor, and this is best done as soon as possible
    after the stop.
- id: 10
  category: license_system
  question: How many days do you have to obtain a Georgia driver's license or permit
    after becoming a resident?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Georgia law requires that any person wanting to operate a motor vehicle
    obtain a Georgia driver's license or permit within 30 days of becoming a resident.
- id: 11
  category: license_system
  question: According to Georgia law, which of the following makes a person a resident
    for the purpose of obtaining a driver's license?
  choices:
    A: Visiting the state for a 2-week vacation.
    B: Driving through the state on an interstate highway.
    C: Accepting employment or engaging in any trade or occupation in Georgia.
    D: Renting a hotel room for a weekend.
  answer: C
  explanation: A person is considered a Georgia resident if they accept employment
    or engage in any trade or occupation in Georgia, among other criteria listed in
    the manual.
- id: 12
  category: license_system
  question: Any person that has been in the state of Georgia for at least how many
    days is considered a resident who must obtain a Georgia driver's license?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: According to Georgia law (O.C.G.A. §40-5-1), any person that has been
    in the state for 30 days or more is considered a Georgia resident.
- id: 13
  category: license_system
  question: What benefit may apply for eligible license types that are renewed on
    the internet via DDS Online Services?
  choices:
    A: A $5.00 discount.
    B: A $10.00 discount.
    C: A free vision test.
    D: A waiver of all renewal fees.
  answer: A
  explanation: The manual states that a $5.00 discount may apply for eligible license
    types that are renewed on the internet.
- id: 14
  category: safe_driving_rules
  question: When pulled over by law enforcement, what should you do regarding your
    vehicle's engine and audio devices?
  choices:
    A: Leave the engine running and turn up the audio.
    B: Turn off the engine and any audio devices.
    C: Turn off the engine but leave the audio playing.
    D: Leave the engine running but turn off the audio.
  answer: B
  explanation: During a traffic stop, the manual instructs drivers to turn off the
    engine and any audio devices.
- id: 15
  category: driver_responsibility
  question: If a police officer who pulls you over is not in uniform, what will they
    typically do?
  choices:
    A: Ask you to step out of the car immediately.
    B: Show their law enforcement credentials.
    C: Issue a warning without asking for your license.
    D: Ask you to follow them to the police station.
  answer: B
  explanation: The manual states that when conducting the stop, the officer will typically
    show their law enforcement credentials if they are not in uniform.
- id: 16
  category: license_system
  question: According to Georgia law, how many days must a person be in the state
    to be considered a Georgia resident?
  choices:
    A: 15 days or more
    B: 30 days or more
    C: 60 days or more
    D: 90 days or more
  answer: B
  explanation: The manual states that any person that has been in the state for 30
    days or more is considered a Georgia resident according to Georgia law (O.C.G.A.
    §40-5-1).
- id: 17
  category: license_system
  question: If an active duty member of the US armed forces has a valid license issued
    in a foreign country by the armed forces, how long is it accepted upon their return
    to the United States?
  choices:
    A: Not more than 30 days
    B: Not more than 45 days
    C: Not more than 60 days
    D: Not more than 90 days
  answer: B
  explanation: This license will only be accepted for a period of not more than 45
    days from the date of his or her return to the United States.
- id: 18
  category: license_system
  question: A migrant farm worker is exempt from obtaining a Georgia driver's license
    if they possess a valid out-of-state license and work in Georgia for less than
    how many days in a calendar year?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The manual exempts any migrant farm worker who works in this state
    less than 90 days in any calendar year and who possesses a valid driver's license
    issued by another state.
- id: 19
  category: driver_testing
  question: To obtain a Class D license or Class M Instructional Permit at age 16
    or 17, an applicant must provide evidence of how many hours of supervised driving?
  choices:
    A: 30 hours, including 6 at night
    B: 40 hours, including 6 at night
    C: 40 hours, including 10 at night
    D: 50 hours, including 10 at night
  answer: B
  explanation: Applicants must provide proof of completion of a DDS approved driver
    education program plus evidence of at least forty (40) hours of supervised driving,
    six of which must be at night.
- id: 20
  category: license_system
  question: When applying for a Georgia license, are U.S. citizens allowed to retain
    identification cards or licenses issued to them by foreign countries?
  choices:
    A: Yes, if they pay an additional fee.
    B: Yes, if the license is translated into English.
    C: No, U.S. citizens will not be allowed to retain them.
    D: No, unless they hold dual citizenship.
  answer: C
  explanation: 'The manual explicitly states: ''U.S. citizens will not be allowed
    to retain any licenses, permits, or identification cards issued to them by foreign
    countries.'''
- id: 21
  category: driver_testing
  question: What is the minimum acceptable vision required for a non-commercial license
    in Georgia?
  choices:
    A: 20/40 in both eyes
    B: 20/50 in one eye
    C: 20/60 in one eye
    D: 20/70 in both eyes
  answer: C
  explanation: The minimum acceptable vision for a non-commercial license is 20/60
    in one eye, with or without corrective lenses.
- id: 22
  category: driver_testing
  question: In addition to the 20/60 vision requirement, what is the minimum horizontal
    field of vision required to obtain a non-commercial license?
  choices:
    A: 100 degrees
    B: 120 degrees
    C: 140 degrees
    D: 160 degrees
  answer: C
  explanation: Drivers must have a horizontal field of vision of at least 140 degrees
    to meet the minimum vision requirements.
- id: 23
  category: driver_testing
  question: How often must customers age 64 and over successfully complete a vision
    screening?
  choices:
    A: Every 2 years
    B: Every 4 years
    C: Every 5 years
    D: Every 8 years
  answer: D
  explanation: According to the manual, customers age 64 and over must successfully
    complete a vision screening every eight years.
- id: 24
  category: license_system
  question: What is the purpose of a Class D license in Georgia?
  choices:
    A: It is a non-commercial license for drivers age 18 and older.
    B: It is a provisional license issued to drivers ages 16 and 17.
    C: It is a license strictly for motorcycle operators.
    D: It is an instructional permit for commercial vehicles.
  answer: B
  explanation: The manual defines a Class D license as a provisional license issued
    to drivers ages 16 and 17.
- id: 25
  category: license_system
  question: Do three-wheel autocycles equipped with a steering wheel require a Class
    M Motorcycle Operator's License?
  choices:
    A: Yes, all three-wheel vehicles require a Class M license.
    B: Yes, unless the driver is over the age of 21.
    C: No, they do not require a Class M Motorcycle Operator's License.
    D: No, but they require a Class E commercial license.
  answer: C
  explanation: Pursuant to House Bill 136 (2017), three-wheel autocycles will not
    require a Class M Motorcycle Operator's License.
- id: 26
  category: license_system
  question: Which classes of licenses are non-commercial licenses for drivers who
    operate commercial motor vehicles but are exempt from commercial licensing requirements?
  choices:
    A: Class A and B
    B: Class C and D
    C: Class E and F
    D: Class CP and MP
  answer: C
  explanation: Class E and F are non-commercial licenses for drivers who operate commercial
    motor vehicles and who are exempt from commercial licensing requirements (and
    are free for volunteer firefighters).
- id: 27
  category: license_system
  question: Which of the following forms of payment is NOT accepted at DDS Customer
    Service Centers?
  choices:
    A: Cash
    B: Visa and Mastercard
    C: Mobile pay options
    D: Personal checks
  answer: D
  explanation: 'The manual states: ''We do not accept checks, money orders, or cashier
    checks.'''
- id: 28
  category: license_system
  question: How many free name or address changes are license, permit, and ID card
    holders allowed per issuance term?
  choices:
    A: None, all changes require a fee.
    B: One free change.
    C: Two free changes.
    D: Unlimited free changes.
  answer: B
  explanation: License, permit and ID card holders are allowed one free name or address
    change per issuance term.
- id: 29
  category: driver_testing
  question: 'A person seeking to obtain a driver''s license while taking the driving
    examination must be accompanied by a certified driver examiner or:'
  choices:
    A: Any licensed driver over the age of 18.
    B: A Responsible Adult with a valid driver's license who is at least 21 years
      of age.
    C: A parent or legal guardian only.
    D: A driver who has held a license for at least 5 years.
  answer: B
  explanation: This person must be accompanied by a Responsible Adult with a valid
    driver's license and be at least 21 years of age or a certified driver examiner
    or agent of the department.
- id: 30
  category: driver_responsibility
  question: Applicants under 18 years of age must present proof of completion of which
    program?
  choices:
    A: Advanced Defensive Driving Course (ADDC)
    B: Alcohol and Drug Awareness Program (ADAP)
    C: Highway Safety and Regulations Program (HSRP)
    D: Motor Vehicle Operation Program (MVOP)
  answer: B
  explanation: Applicants under 18 years of age must present proof of completion of
    the Alcohol and Drug Awareness Program (ADAP).
- id: 31
  category: license_system
  question: What is the standard cost of a replacement duplicate driver's license,
    permit, or ID card (if not requested within 150 days of expiration)?
  choices:
    A: $5.00
    B: $10.00
    C: $20.00
    D: $32.00
  answer: A
  explanation: A replacement driver's license, permit, or ID card is a duplicate of
    the replaced document and may be provided at a cost of $5.00 per occurrence.
- id: 32
  category: license_system
  question: What happens if you request a replacement driver's license within 150
    days of its original expiration date?
  choices:
    A: You pay a $5.00 replacement fee and keep the original expiration date.
    B: You must renew the license for a new term at full cost.
    C: You must surrender your license and apply for a provisional permit.
    D: You must take a vision and driving test to receive the replacement.
  answer: B
  explanation: The manual states that if a replacement is requested within 150 days
    of the original expiration date, the license/permit/ID must be renewed for a new
    term at full cost.
- id: 33
  category: license_system
  question: According to the DDS License Restriction Codes, what does restriction
    code 'B' indicate?
  choices:
    A: No manual transmission equipped CMV
    B: Corrective lenses required
    C: Daylight hours only
    D: Automatic transmission required
  answer: B
  explanation: The DDS License Restriction Codes chart lists 'B' as 'corrective lenses
    required'.
- id: 34
  category: driver_testing
  question: What is required to renew a driver's license that has been expired for
    more than two years?
  choices:
    A: Only a vision test and a $32 fee
    B: A vision test, a driving test, and a knowledge exam on road signs and rules
    C: A defensive driving course and a vision test
    D: Only a driving test and proof of residency
  answer: B
  explanation: To renew a driver's license that has been expired more than two years,
    you must pass a vision test, a driving test, and an exam to test your knowledge
    of road signs and road rules.
- id: 35
  category: driver_responsibility
  question: When operating a motor vehicle in Georgia, what must you do if stopped
    by a law enforcement officer?
  choices:
    A: Display your driver's license or permit upon their request.
    B: Hand over your vehicle registration and insurance only.
    C: Provide a verbal statement of your driver's license number.
    D: Show your Real ID documentation.
  answer: A
  explanation: If stopped while driving, you must display your driver's license/permit
    to any law enforcement officer upon his or her request.
- id: 36
  category: license_system
  question: How many documents showing Georgia residence are required to be issued
    a Real ID, and how old can they be?
  choices:
    A: One document dated within the last 30 days
    B: Two documents dated within the last six months
    C: Three documents dated within the last year
    D: Two documents dated within the last 12 months
  answer: B
  explanation: Real ID documentation requirements include two documents showing Georgia
    residence (e.g., utility bill, phone bill) that must be dated within the last
    six (6) months.
- id: 37
  category: license_system
  question: What is the minimum age to apply for a Class C Instructional Permit (CP)
    in Georgia?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: B
  explanation: Upon reaching age 15, or anytime thereafter, you may apply for a Class
    C Instructional Permit (CP).
- id: 38
  category: driver_testing
  question: What is the fee for the knowledge exam when applying for a Class C Instructional
    Permit (CP)?
  choices:
    A: $5.00
    B: $10.00
    C: $20.00
    D: $32.00
  answer: B
  explanation: The test fee is $10.00 and must be paid prior to testing. If any part
    of the test is failed, no refund will be issued.
- id: 39
  category: safe_driving_rules
  question: Under what conditions may a person with a Class C Instructional Permit
    (CP) operate a Class C vehicle?
  choices:
    A: When accompanied by any licensed driver over the age of 18.
    B: When accompanied by a licensed Class C driver who is at least 21 years old
      and occupying the seat beside the driver.
    C: When driving alone during daylight hours only.
    D: When accompanied by a parent or guardian in the back seat.
  answer: B
  explanation: You may operate any Class C vehicle when accompanied by a person at
    least 21 years of age who is licensed to drive a Class C vehicle, fit and capable,
    and occupying a seat beside the driver.
- id: 40
  category: license_system
  question: How long is a Class C Instructional Permit (CP) valid?
  choices:
    A: Up to 1 year
    B: Up to 2 years
    C: Up to 3 years
    D: Up to 5 years
  answer: B
  explanation: Class C Instructional Permits (CP) are valid for up to 2 years.
- id: 41
  category: license_system
  question: If an applicant for a Class C Instructional Permit is under age 18, who
    has the authority to revoke the permit until they reach age 18?
  choices:
    A: The high school principal
    B: The individual who signed the application (parent, legal guardian, or responsible
      adult)
    C: Any law enforcement officer
    D: A certified driving instructor
  answer: B
  explanation: The individual who signs your application may, for any reason, revoke
    your permit until you reach the age of 18.
- id: 42
  category: license_system
  question: According to the fee chart, what is the cost for an 8-year Class C Driver's
    License?
  choices:
    A: $10
    B: $20
    C: $25
    D: $32
  answer: D
  explanation: The fee chart lists an 8-year Driver's License (Class A, B, C, E, F,
    and M) at a cost of $32.
- id: 43
  category: license_system
  question: What documentation is required for a gender update on a Georgia driver's
    license or ID?
  choices:
    A: A new birth certificate and a passport
    B: A court order or physician's letter certifying the gender change
    C: A marriage certificate or divorce decree
    D: Two documents showing Georgia residence
  answer: B
  explanation: A gender update requires applicants to submit a court order or physician's
    letter certifying gender change.
- id: 44
  category: license_system
  question: By what date will you need a Real ID compliant card to fly within the
    U.S. or enter federal buildings?
  choices:
    A: May 7, 2025
    B: June 1, 2024
    C: January 1, 2026
    D: December 31, 2025
  answer: A
  explanation: Beginning May 7, 2025, you will need a Real ID compliant card (with
    a star in the right corner) to fly within the U.S. or enter federal buildings
    or any nuclear power plant.
- id: 45
  category: safe_driving_rules
  question: Who must accompany a driver operating a vehicle with a Class C Instructional
    Permit?
  choices:
    A: Any licensed driver 18 years of age or older
    B: A certified driving instructor
    C: A licensed Class C driver at least 21 years of age seated beside the driver
    D: A parent or legal guardian only
  answer: C
  explanation: A Class C vehicle may be driven with a permit when accompanied by a
    person at least 21 years of age who is licensed to drive a Class C vehicle, is
    fit and capable, and is occupying a seat beside the driver.
- id: 46
  category: driver_responsibility
  question: Who has the authority to revoke a minor's Class D license until they reach
    the age of 18?
  choices:
    A: The high school principal
    B: The parent, legal guardian, or responsible adult who signed the application
    C: A certified driving instructor
    D: The local police department
  answer: B
  explanation: The individual (parent, legal guardian, or responsible adult) who signs
    your application may, for any reason, revoke your license until you reach the
    age of 18.
- id: 47
  category: driver_testing
  question: To obtain a Class D license, how many hours of supervised driving experience
    must be completed?
  choices:
    A: 30 hours total, including 5 hours at night
    B: 40 hours total, including 6 hours at night
    C: 50 hours total, including 10 hours at night
    D: 60 hours total, including 6 hours at night
  answer: B
  explanation: You must have completed a cumulative total of at least 40 hours of
    other driving experience, including at least 6 hours at night.
- id: 48
  category: safe_driving_rules
  question: What are the restricted driving hours for a Class D Provisional License
    holder?
  choices:
    A: Between 10:00 p.m. and 6:00 a.m.
    B: Between 11:00 p.m. and 5:00 a.m.
    C: Between 12:00 a.m. and 5:00 a.m.
    D: Between 1:00 a.m. and 6:00 a.m.
  answer: C
  explanation: A Class D license holder may not drive between the hours of 12:00 a.m.
    and 5:00 a.m. with NO EXCEPTIONS.
- id: 49
  category: safe_driving_rules
  question: During the first six months of holding a Class D Provisional License,
    who is allowed to ride in the vehicle as a passenger?
  choices:
    A: Only immediate family members
    B: Up to one passenger under 21 who is not family
    C: Up to three passengers under 21
    D: Anyone, as long as an adult is present
  answer: A
  explanation: During the first six months following issuance, only immediate family
    members may ride in the vehicle.
- id: 50
  category: safe_driving_rules
  question: During the second six months of holding a Class D license, what is the
    passenger restriction?
  choices:
    A: No passengers are allowed
    B: Only immediate family members may ride
    C: Only one passenger under 21 years of age who is not immediate family may ride
    D: Up to three passengers under 21 years of age who are not immediate family may
      ride
  answer: C
  explanation: During the second six months following issuance, only one passenger
    under 21 years of age who is not a member of the driver's immediate family may
    ride in the vehicle.
- id: 51
  category: alcohol_drugs_health
  question: What program must be completed to obtain a Class D license at age 16 or
    17?
  choices:
    A: The Advanced Defensive Driving Course (ADDC)
    B: The Alcohol and Drug Awareness Program (ADAP)
    C: The Georgia Teen Driver Safety Program (GTDSP)
    D: The Motor Vehicle Safety Program (MVSP)
  answer: B
  explanation: To obtain a Class D license at the age of 16 or 17 you must complete
    both a driver education course approved by DDS and the Alcohol and Drug Awareness
    Program (ADAP).
- id: 52
  category: license_system
  question: At what age can a Class D license holder apply to exchange their license
    for a full Class C license?
  choices:
    A: '17'
    B: '18'
    C: '19'
    D: '21'
  answer: B
  explanation: A Class D license holder may apply for a Class C license upon reaching
    the age of 18.
- id: 53
  category: license_system
  question: How much does an 8-year Class C driver's license cost when exchanging
    a Class D license?
  choices:
    A: It is free
    B: $20
    C: $32
    D: $40
  answer: C
  explanation: The applicant will be issued a Class C license at the cost of $32 for
    an 8 year license.
- id: 54
  category: license_system
  question: What is the cost of a voter registration ID card in Georgia if the individual
    swears under oath it is needed to vote?
  choices:
    A: $5.00
    B: $10.00
    C: $32.00
    D: No cost
  answer: D
  explanation: A voter registration ID is also available at no cost for any individual
    who swears under oath that the ID is needed in order to vote in an election in
    Georgia.
- id: 55
  category: license_system
  question: How long is a special ID card for persons with temporary disabilities
    valid?
  choices:
    A: 6 months
    B: 1 year
    C: 4 years
    D: 8 years
  answer: A
  explanation: A card for persons with temporary disabilities is also available for
    a term of six (6) months at a cost of $5.00.
- id: 56
  category: driver_testing
  question: If you are 18 or older and applying for a Class C driver's license for
    the first time, what must you sign an affidavit affirming?
  choices:
    A: You have completed 30 hours of classroom instruction
    B: You have completed 40 hours of supervised road driving which includes 6 hours
      of night driving
    C: You have held an instructional permit for one year
    D: You own a registered vehicle in the state of Georgia
  answer: B
  explanation: If you are at least 18... applying for a Class C Driver's License...
    You must also sign an affidavit affirming that you have completed 40 hours of
    supervised road driving which includes 6 hours of night driving.
- id: 57
  category: license_system
  question: Under what condition is a 17-year-old exempt from holding their learner's
    permit for one year and one day?
  choices:
    A: With proof they maintain a 4.0 GPA in high school
    B: With proof they are enlisted in the military
    C: If they pass an advanced defensive driving road test
    D: If their parents sign a special waiver
  answer: B
  explanation: A 17-year-old will be exempt from holding their learners permit for
    one year and one day with proof that they are enlisted in the military.
- id: 58
  category: license_system
  question: How many days do new Georgia residents have to apply for a Georgia driver's
    license or permit?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to the manual, you must apply for a Georgia driver's license
    or permit within 30 days of becoming a Georgia resident if you wish to drive upon
    the highways of the state.
- id: 59
  category: license_system
  question: What document must a veteran present to obtain a free Veteran's License
    if they do not have their original DD214?
  choices:
    A: A DS-318 form from the National Guard
    B: A certified Motor Vehicle Report
    C: A Certificate of Eligibility (DS-516) from the State Department of Veterans
      Service
    D: A valid out-of-state driver's license
  answer: C
  explanation: The manual states that if veterans do not have a DD214, they must obtain
    a Certificate of Eligibility (DS-516) from the State Department of Veterans Service.
- id: 60
  category: license_system
  question: Who is eligible to receive a Georgia Honorary License with no fee?
  choices:
    A: Any active duty military member stationed in Georgia
    B: The spouse of a disabled, honorably separated veteran who does not have a driver's
      license
    C: Any veteran who received a dishonorable discharge
    D: A member of the active reserves who has not had active duty
  answer: B
  explanation: An Honorary License is available to the spouse of a disabled, honorably
    separated veteran who does not have a driver's license, or the unmarried surviving
    spouse of a deceased honorably separated veteran.
- id: 61
  category: license_system
  question: What form must be presented to the DDS upon every renewal of a National
    Guard license?
  choices:
    A: Form DS-516
    B: A certified Motor Vehicle Report
    C: Form DS-318
    D: Form DD214
  answer: C
  explanation: The manual specifies that the form DS-318 must be presented to the
    DDS upon every renewal of a National Guard license.
- id: 62
  category: license_system
  question: If an applicant aged 18 or older is transferring a valid out-of-state
    license to Georgia but cannot surrender the physical license, what must they present?
  choices:
    A: A certified Motor Vehicle Report/Driving History from the state of issuance,
      dated within 30 days
    B: A birth certificate dated within 60 days
    C: A letter of explanation signed by a notary
    D: A passport and a utility bill
  answer: A
  explanation: If you are unable to surrender a valid driver's license, you must present
    a certified Motor Vehicle Report/Driving History from the state of issuance, dated
    within 30 days, showing your status as valid.
- id: 63
  category: license_system
  question: When transferring a license from another state to Georgia, how many documents
    must be provided to prove Georgia residency?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: To transfer a license from another state, the manual requires you to
    provide two documents to prove Georgia residency.
- id: 64
  category: license_system
  question: How can you identify the official state of Georgia DDS website to avoid
    fake DMV websites?
  choices:
    A: It will end in .com
    B: It will end in .org
    C: It will end in .gov
    D: It will end in .net
  answer: C
  explanation: The manual warns about fake sites ending in .com or .org and notes
    that the official state of Georgia websites will have .gov, such as www.dds.georgia.gov.
- id: 65
  category: driver_testing
  question: What is the latest time a customer can begin taking the written knowledge
    exam at a DDS Customer Service Center?
  choices:
    A: Up until the exact closing time
    B: At least 15 minutes prior to closing
    C: At least 30 minutes prior to closing
    D: At least 1 hour prior to closing
  answer: C
  explanation: To ensure adequate time, customers must begin taking the written test
    at least 30 minutes prior to closing.
- id: 66
  category: driver_testing
  question: In what language is the Road Signs test conducted?
  choices:
    A: English and Spanish
    B: English only
    C: Any language requested in advance
    D: English and French
  answer: B
  explanation: The manual states that road signs and the actual driving test are conducted
    in English only.
- id: 67
  category: driver_testing
  question: What is the consequence if a customer violates testing rules, such as
    using a cell phone during the knowledge exam?
  choices:
    A: They receive a verbal warning
    B: They must pay an additional testing fee
    C: The exam session will be counted as a failure
    D: They are banned from driving for one year
  answer: C
  explanation: Any violation of the rules (like using a cell phone) is considered
    misconduct, and if misconduct occurs, the exam session will be counted as a failure.
- id: 68
  category: driver_testing
  question: How many questions must you answer correctly to pass the Road Signs test?
  choices:
    A: 10 out of 20
    B: 12 out of 20
    C: 15 out of 20
    D: 20 out of 20
  answer: C
  explanation: During the Road Signs test, you must correctly answer 15 out of 20
    questions to pass.
- id: 69
  category: driver_testing
  question: Which of the following items is permitted in the testing area during a
    knowledge exam?
  choices:
    A: Cell phones
    B: Pens and pencils
    C: Text messaging devices
    D: None of the above
  answer: D
  explanation: The manual states you may not bring pens, pencils, paper, cell phones,
    text messaging devices, or other wireless devices into the testing area.
- id: 70
  category: license_system
  question: What must an unmarried surviving spouse of a deceased honorably separated
    veteran submit to obtain a Certificate of Eligibility for an Honorary License?
  choices:
    A: A DS-318 form
    B: The death certificate along with the DD-214
    C: A certified Motor Vehicle Report
    D: A valid out-of-state driver's license
  answer: B
  explanation: For the unmarried surviving spouse, the death certificate along with
    the DD-214 must be submitted to the State Department of Veterans Service to obtain
    a Certificate of Eligibility.
- id: 71
  category: license_system
  question: What additional requirements must an under-18 driver meet before transferring
    a valid out-of-state license to Georgia?
  choices:
    A: Surrender of a foreign passport
    B: School registration, driver education, and ADAP
    C: A letter of recommendation from their previous school
    D: A 50-hour driving log signed by a police officer
  answer: B
  explanation: All Georgia requirements including school registration, driver education
    and ADAP are required before the out of state license can be transferred for someone
    under age 18.
- id: 72
  category: driver_testing
  question: How can you take the Road Skills Test?
  choices:
    A: By walking in on Tuesdays
    B: By appointment only
    C: By mailing a paper application
    D: Anytime during normal business hours
  answer: B
  explanation: The Road Skills Test is administered by appointment only to maximize
    resources and serve customers more efficiently.
- id: 73
  category: vehicle_information
  question: Are you allowed to use a vehicle equipped with advanced driver assistance
    systems for your road test?
  choices:
    A: No, these vehicles are strictly prohibited.
    B: Yes, but you must demonstrate the ability to operate the vehicle without such
      technology.
    C: Yes, and you are encouraged to rely entirely on the technology.
    D: Only if taking the test for a commercial license.
  answer: B
  explanation: Drivers may perform the skills test in vehicles equipped with advanced
    driver assistance technology. However, the applicant must demonstrate their ability
    to operate the vehicle without such technology.
- id: 74
  category: safe_driving_rules
  question: During the parallel parking portion of the road test, how close must your
    car be to the curb?
  choices:
    A: Not more than 12 inches
    B: Not more than 18 inches
    C: Not more than 24 inches
    D: Touching the curb
  answer: B
  explanation: You must park midway between two standards so that your car is not
    more than 18 inches from the curb.
- id: 75
  category: safe_driving_rules
  question: What is the maximum speed you should use when performing the straight
    line backing maneuver on the road test?
  choices:
    A: 5 miles per hour
    B: 10 miles per hour
    C: 15 miles per hour
    D: 20 miles per hour
  answer: B
  explanation: You must back your car for a distance of approximately 50 feet at a
    slow rate of speed (not more than 10 miles per hour).
- id: 76
  category: driver_testing
  question: Who must serve as a passenger in the testing vehicle during a Virtual
    Road Test?
  choices:
    A: A DDS Examiner
    B: Any licensed driver over 18
    C: A parent, guardian, or responsible adult 21 years of age or older with a valid
      driver's license
    D: No passenger is allowed during a virtual test
  answer: C
  explanation: During a Virtual Road Test, a parent, guardian, or other responsible
    adults 21 years of age or older must serve as a passenger in the testing vehicle.
    They must have a valid driver's license.
- id: 77
  category: driver_testing
  question: What is the minimum score required to pass the Class C or D road test?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: B
  explanation: You must achieve a minimum score of 75% to pass the Class C/D road
    test.
- id: 78
  category: driver_testing
  question: If you fail any part of the Class C or D knowledge or road test for the
    second time, how long must you wait before retaking it?
  choices:
    A: Until the next day
    B: 3 days
    C: 7 days
    D: 14 days
  answer: C
  explanation: For a 2nd or subsequent failure, you must wait 7 days before retaking
    the portion you have failed.
- id: 79
  category: driver_testing
  question: Under what weather conditions will a motorcycle (Class M) road test NOT
    be conducted?
  choices:
    A: When it is cloudy
    B: When the temperature is below 50 degrees
    C: When it is raining or the pavement is damp
    D: When the wind speed exceeds 10 mph
  answer: C
  explanation: Motorcycle road tests cannot be conducted when the weather conditions
    make it unsafe for the driver or examiner, including when it is raining or when
    the pavement is damp.
- id: 80
  category: license_system
  question: What driving test is required to obtain a Class E or F Non-Commercial
    license?
  choices:
    A: A traditional road test in a commercial vehicle
    B: A virtual road test only
    C: A closed-course skills test
    D: There is no driving test for Classes E & F Non-Commercial
  answer: D
  explanation: There is no driving test for Classes E & F Non-Commercial; however,
    you must present an application, establish your ability to operate the vehicles,
    and pass a knowledge test.
- id: 81
  category: driver_testing
  question: If you choose to take your road test in a rental vehicle, which of the
    following conditions must be met?
  choices:
    A: You must be listed as a driver on the rental contract.
    B: The rental vehicle must be a manual transmission.
    C: You must rent the vehicle for at least 7 days.
    D: The rental vehicle must have a temporary dealership tag.
  answer: A
  explanation: To use a rental vehicle, you must provide a copy of the rental contract,
    be listed as a driver on the rental contract, and provide proof of valid insurance
    for the vehicle.
- id: 82
  category: safe_driving_rules
  question: During the road test, how should you maintain good posture?
  choices:
    A: Rest your elbow on the window to stay relaxed.
    B: Keep both hands on the steering wheel.
    C: Keep one hand on the wheel and one on the gear shift.
    D: Lean back and converse with the examiner.
  answer: B
  explanation: Maintaining Good Posture means keeping both hands on the steering wheel.
    Do not rest your elbow on the window and do not attempt to carry on a conversation
    with the examiner.
- id: 83
  category: driver_testing
  question: According to the manual, when is the best time to visit a DDS Customer
    Service Center in person?
  choices:
    A: Tuesday morning
    B: Monday afternoon
    C: The middle of the week during the middle of the day
    D: Friday right before closing
  answer: C
  explanation: Please remember that Tuesday is always the busiest day and the best
    time to visit in person is the middle of the week during the middle of the day.
- id: 84
  category: license_system
  question: How much does a Class E or F Non-Commercial license cost for volunteer
    firefighters?
  choices:
    A: $10
    B: $25
    C: $50
    D: There is no charge
  answer: D
  explanation: Class E & F licenses are available to volunteer firefighters at no
    charge.
- id: 85
  category: driver_testing
  question: If you fail the Class C or D knowledge test for the first time, when can
    you retake it?
  choices:
    A: Immediately
    B: The next day
    C: After 3 days
    D: After 7 days
  answer: B
  explanation: 'If it is your 1st Failure: You must wait until the next day before
    retaking the portion you have failed.'
- id: 86
  category: license_system
  question: Which of the following groups is eligible to renew their Georgia driver's
    license by mail?
  choices:
    A: Anyone currently living in the state of Georgia
    B: Full-time students attending school outside Georgia
    C: Drivers whose license has been expired for 3 years
    D: Customers who need to change their legal name
  answer: B
  explanation: According to the manual, renewal by mail is available to full-time
    students attending school outside Georgia, their spouse, and any dependents living
    with them.
- id: 87
  category: license_system
  question: A driver's license cannot be renewed by mail if it has been expired for
    at least how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: The manual states that a driver's license that has been expired for
    two (2) or more years cannot be renewed by mail.
- id: 88
  category: license_system
  question: What is a restriction for customers who choose to renew their driver's
    license by mail?
  choices:
    A: They will not receive a Real ID.
    B: They must pay double the standard renewal fee.
    C: They will only receive a 4-year license.
    D: They must take a written test upon returning to Georgia.
  answer: A
  explanation: The manual explicitly states, "Customers who choose to renew their
    license in this manner will not receive a RealDL/ID."
- id: 89
  category: license_system
  question: What will happen if your current driver's license number is identical
    to your Social Security Number during the renewal process?
  choices:
    A: You must apply for a new Social Security Number.
    B: A randomly generated document number will be assigned to your document.
    C: You will be required to keep the same number.
    D: Your license will be temporarily suspended.
  answer: B
  explanation: No licenses may be issued with a Social Security number as the document
    number. If they are identical, a randomly generated document number will be assigned
    during the issuance/renewal process.
- id: 90
  category: driver_responsibility
  question: If you opt to register to vote through the DDS, who should you contact
    if you do not receive your voter registration card within 30 days?
  choices:
    A: The Department of Driver Services (DDS)
    B: The Georgia State Patrol
    C: Your county voter registration office
    D: The federal election commission
  answer: C
  explanation: 'The manual advises: "If you do not receive your voter registration
    card within 30 days, contact your county voter registration office to determine
    the status of your application."'
- id: 91
  category: license_system
  question: What is the fee to replace a lost or stolen driver's license online or
    at a DDS Customer Service Center?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: B
  explanation: The manual states that the fee online and at a DDS Customer Service
    Center for a replacement driver's license is $10.00.
- id: 92
  category: license_system
  question: What document is required if you want to change the driver's license number
    on your replacement card because it was stolen?
  choices:
    A: A certified birth certificate
    B: A police report indicating the license was stolen
    C: A letter from your auto insurance company
    D: A certified copy of your driving record
  answer: B
  explanation: To change the number on your replacement Georgia driver's license,
    you will be required to present a police report indicating that the license was
    stolen (unless your license number and SSN are the same).
- id: 93
  category: driver_responsibility
  question: How many days do you have to update your address with the DDS after you
    have moved?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: 'The manual states: "If you have moved, you must visit a DDS Customer
    Service Center within 60 days to update your mailing and/or residential address..."'
- id: 94
  category: driver_responsibility
  question: Why is it important to update your address directly with the DDS when
    you move?
  choices:
    A: The U.S. Postal Service will not forward DDS correspondence to new addresses.
    B: Your license will be immediately revoked if you do not.
    C: You will be charged a daily fine until it is updated.
    D: Your vehicle registration will be canceled automatically.
  answer: A
  explanation: 'The manual notes: "DDS correspondence will not be forwarded to new
    addresses by the U.S. Postal Service."'
- id: 95
  category: license_system
  question: If you change your name by marriage or other legal action, within how
    many days must you obtain a new license showing the correct name?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 120 days
  answer: C
  explanation: According to the manual, "If you change your name by marriage or other
    legal action, you must obtain a new license showing the correct name within 60
    days."
- id: 96
  category: license_system
  question: What is the cost of a replacement license for a name change if it is the
    first time during the current license term?
  choices:
    A: $5.00
    B: $10.00
    C: $20.00
    D: It is free
  answer: D
  explanation: 'The manual states: "A free replacement license valid for the current
    term will be issued once in a license term" for a name change.'
- id: 97
  category: license_system
  question: How much does a 7-year Motor Vehicle Report (MVR) cost?
  choices:
    A: $6.00
    B: $8.00
    C: $10.00
    D: $12.00
  answer: B
  explanation: 'The manual specifies the fees for MVRs: "A 3 year report is $6.00;
    a 7 year report is $8.00. A lifetime report is $8.00."'
- id: 98
  category: license_system
  question: Which of the following is true regarding obtaining a Motor Vehicle Report
    (MVR) online versus in person?
  choices:
    A: Online MVRs are certified, while in-person MVRs are non-certified.
    B: Online MVRs are non-certified, while in-person MVRs are certified.
    C: Both online and in-person MVRs are certified.
    D: Both online and in-person MVRs are non-certified.
  answer: B
  explanation: The manual states that a "non-certified copy of your Motor Vehicle
    Report (MVR) can be downloaded by using DDS Online Services" while a "certified
    copy... can be purchased in person at any DDS Customer Service Center."
- id: 99
  category: license_system
  question: What is required to obtain a Motor Vehicle Report (MVR) for another individual
    in person?
  choices:
    A: A verbal agreement from the licensee
    B: A completed Request for MVR form (DDS-18) from the licensee authorizing you
      to receive it
    C: The licensee's original birth certificate
    D: A court order signed by a judge
  answer: B
  explanation: If obtaining a report other than your own, you need "Completion of
    the Request for MVR form (DDS-18) from the licensee naming the person authorized
    to receive the record..."
- id: 100
  category: license_system
  question: If you do not have one document from the primary list (like a Birth Certificate
    or US Passport), how many documents from the secondary list (like a Social Security
    Card or Voter Registration Card) must you provide to replace a lost license?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: The manual lists acceptable proof of identity as ONE document from
    the first list (Birth Certificate, Passport, etc.) or TWO documents from the second
    list (Social Security Card, Voter Registration Card, etc.) when replacing a license.
- id: 101
  category: license_system
  question: Which of the following is an acceptable form of payment when requesting
    an MVR by mail?
  choices:
    A: Cash
    B: Credit card
    C: Money order
    D: Cryptocurrency
  answer: C
  explanation: When requesting an MVR by mail, you must include a money order, cashier's
    check, or personal check made payable to the Department of Driver Services.
- id: 102
  category: license_system
  question: At the time of any license or ID card transaction, the Department of Driver
    Services is required to ask which group if they have registered with the U.S.
    Selective Service System?
  choices:
    A: All applicants age 16 and older
    B: Males age 18
    C: Females age 18
    D: All applicants age 21
  answer: B
  explanation: DDS is required to ask males age 18 whether they have registered with
    the U.S. Selective Service System and to report the responses.
- id: 103
  category: license_system
  question: 'When obtaining your driver''s license, you have the opportunity to make
    a voluntary donation to Georgia''s Blindness Education, Screening, and Treatment
    Program in the amount of:'
  choices:
    A: $1
    B: $2
    C: $5
    D: $10
  answer: A
  explanation: When you obtain your driver's license, permit, or ID, you will have
    the opportunity to make a voluntary donation of $1 to Georgia's Blindness Education,
    Screening, and Treatment Program.
- id: 104
  category: driver_responsibility
  question: What does Georgia law state regarding the physician who declares a patient
    dead and organ donation?
  choices:
    A: The physician must perform the organ removal.
    B: The physician is prohibited from participating in the removal or transplantation
      of the donated organs.
    C: The physician must notify the donor's family of the costs.
    D: The physician decides who receives the donated organs.
  answer: B
  explanation: Georgia law prohibits the physician who declares a patient dead from
    participating in the removal or transplantation of that patient's donated organs
    or tissues.
- id: 105
  category: driver_responsibility
  question: What is the cost to a donor's family for expenses related to organ, tissue,
    or eye donation?
  choices:
    A: A flat fee of $500
    B: The cost of the surgical removal
    C: There is no cost to the donor's family
    D: The family pays only if the organs are successfully transplanted
  answer: C
  explanation: There is no cost to the donor's family for any expenses related to
    organ/tissue/eye donation.
- id: 106
  category: driver_responsibility
  question: Which of the following factors is NOT used to select recipients for organ
    donation?
  choices:
    A: Urgency of need
    B: Compatibility of blood type
    C: Race or creed
    D: Body size and tissue type
  answer: C
  explanation: Recipients are selected by urgency of need, compatibility of blood
    type, body size, and tissue type, regardless of sex, race or creed.
- id: 107
  category: license_system
  question: 'A voluntary contribution to the Georgia Student Finance Authority (GSFA)
    helps provide financial assistance for post-secondary education to the children
    of:'
  choices:
    A: All Georgia residents
    B: High school valedictorians
    C: Law enforcement officers and first responders permanently disabled or killed
      in the line of duty
    D: Students pursuing degrees in medicine
  answer: C
  explanation: The GSFA donation helps provide financial assistance toward the post-secondary
    educational costs of the children of law enforcement officers, firefighters, paramedics,
    etc., who were permanently disabled or killed in the line of duty.
- id: 108
  category: safe_driving_rules
  question: If a law enforcement officer is directing traffic at an intersection and
    tells you to proceed despite a red traffic light, what should you do?
  choices:
    A: Wait for the light to turn green before proceeding.
    B: Obey the officer's directions and proceed.
    C: Stop and ask the officer for their badge number.
    D: Turn around and find another route.
  answer: B
  explanation: One of the most basic traffic laws requires drivers to obey the traffic
    directions of a law enforcement officer or firefighter, even if it goes against
    what the traffic control devices tell you to do.
- id: 109
  category: safe_driving_rules
  question: Under what circumstances are you permitted to drive on a roadway that
    has been closed for construction or a special event?
  choices:
    A: When you are running late for work.
    B: When there are no construction workers visible.
    C: When you drive a four-wheel-drive vehicle.
    D: Never.
  answer: D
  explanation: One of the three most basic traffic laws requires drivers to never
    drive on a roadway that has been closed for construction, for the purpose of a
    special event, or for any other official reason.
- id: 110
  category: safe_driving_rules
  question: Which of the following is a key principle regarding right-of-way under
    Georgia law?
  choices:
    A: Right-of-way is something to be taken, not given.
    B: Right-of-way is something to be given, not taken.
    C: The largest vehicle always has the right-of-way.
    D: Right-of-way rules only apply to motor vehicles, not bicyclists.
  answer: B
  explanation: Vehicle drivers (including bicyclists) and pedestrians should always
    understand the rules related to right-of-way, and remember that right-of-way is
    something to be given, not taken.
- id: 111
  category: defensive_driving
  question: What should you do if you have the legal right-of-way, but another driver
    does not realize it and fails to yield?
  choices:
    A: Maintain your speed and force them to stop.
    B: Sound your horn and proceed without slowing down.
    C: Yield the right-of-way in order to prevent a crash.
    D: Swerve into the oncoming lane to bypass them.
  answer: C
  explanation: There may be instances in which you have the legal right-of-way over
    someone else who is not obeying the rules of the road. In those instances, the
    right-of-way should be yielded in order to prevent a crash.
- id: 112
  category: safe_driving_rules
  question: If you are at a stop sign at an intersection and cross traffic does not
    have a stop sign, when may you proceed?
  choices:
    A: Immediately after coming to a complete stop.
    B: Only after stopping and yielding the right-of-way to any vehicle or pedestrian
      in or close to the intersection.
    C: As soon as the vehicle behind you honks its horn.
    D: After waiting for exactly three seconds, regardless of traffic.
  answer: B
  explanation: If you are faced with a stop sign, but other traffic is not, you may
    proceed only after stopping and yielding the right-of-way to any other vehicle
    or pedestrian either in the intersection, or so close to the intersection as to
    make it dangerous.
- id: 113
  category: safe_driving_rules
  question: At an intersection with no stop signs, yield signs, or traffic signals,
    what must happen if two vehicles arrive at the same time?
  choices:
    A: The driver on the left must yield to the driver on the right.
    B: The driver on the right must yield to the driver on the left.
    C: The vehicle traveling faster has the right-of-way.
    D: Both vehicles must stop and wait for a third vehicle to arrive.
  answer: A
  explanation: At intersections where there are no stop signs, yield signs or other
    traffic signals, if two vehicles come to the intersection at the same time, the
    driver of the vehicle on the left must yield to the driver of the vehicle on the
    right.
- id: 114
  category: sharing_the_road
  question: At a four-way intersection where all drivers are faced with stop signs,
    who must all drivers yield to?
  choices:
    A: The largest vehicle at the intersection.
    B: Vehicles turning left.
    C: Pedestrians.
    D: Vehicles that arrived last.
  answer: C
  explanation: At a four-way intersection where all drivers are faced with stop signs,
    all drivers must yield to pedestrians.
- id: 115
  category: safe_driving_rules
  question: What should you do if you and another vehicle arrive at an intersection
    with no stop signs or signals at the exact same time?
  choices:
    A: The vehicle on the right must yield to the vehicle on the left.
    B: The vehicle on the left must yield to the driver of the vehicle on the right.
    C: The vehicle traveling straight has the right-of-way.
    D: The fastest vehicle has the right-of-way.
  answer: B
  explanation: According to the manual, at intersections with no stop signs or signals,
    if two vehicles arrive at the same time, the driver of the vehicle on the left
    must yield to the driver of the vehicle on the right.
- id: 116
  category: defensive_driving
  question: What is the preferred action if traffic from another roadway is merging
    into the lane you are traveling in?
  choices:
    A: Speed up to pass the merging traffic quickly.
    B: Stop your vehicle completely to let them enter.
    C: Safely change lanes away from the merging traffic if possible.
    D: Honk your horn to warn them to yield.
  answer: C
  explanation: The manual advises that if traffic from another roadway is merging
    into the roadway you are traveling on, you should safely change lanes away from
    the merging traffic if possible.
- id: 117
  category: safe_driving_rules
  question: How should you react when an emergency vehicle with flashing lights and
    sirens approaches?
  choices:
    A: Speed up and stay ahead of the emergency vehicle.
    B: Move to the left lane and slow down.
    C: Stop immediately in your current lane.
    D: Move to the shoulder or as far to the right of the roadway as you can, and
      stop.
  answer: D
  explanation: If emergency vehicles are using their emergency lights and sirens,
    you should safely maneuver your vehicle out of their way by moving to the shoulder
    of the road, or as far to the right as you can, and stop.
- id: 118
  category: signs_and_signals
  question: When making a right turn on a red light, what must you do before proceeding?
  choices:
    A: Slow down to 5 mph and proceed if clear.
    B: Make a complete stop and yield to all traffic and pedestrians.
    C: Honk your horn and proceed without stopping.
    D: Wait for the light to turn green.
  answer: B
  explanation: Unless a sign prohibits it, you may make a right turn on red only after
    making a complete stop, yielding to all traffic and pedestrians, and determining
    it is safe.
- id: 119
  category: safe_driving_rules
  question: Under what condition is it legal to make a left turn on a red light?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from the left lane of a one-way street onto a one-way street moving
      to the left.
    C: When turning from a one-way street onto a two-way street.
    D: It is never legal to make a left turn on a red light.
  answer: B
  explanation: It is permissible to make a left turn on red from the left lane of
    a one-way street onto a one-way street on which the traffic moves toward the driver's
    left, after making a complete stop and yielding.
- id: 120
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus with flashing red lights
    and extended stop signs?
  choices:
    A: When you are traveling on a two-lane road.
    B: When you are traveling on the opposite side of a highway divided by a median.
    C: When you are in a designated school zone.
    D: When you are traveling in the same direction as the bus.
  answer: B
  explanation: On a highway divided by a median, cars traveling on the opposite side
    from the stopped school bus are not required to stop.
- id: 121
  category: safe_driving_rules
  question: When passing on a two-lane road, you must return to the right lane before
    oncoming traffic is within how many feet of your vehicle?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: You must have sufficient time and space to return your vehicle completely
    to the right lane before oncoming traffic is within 200 feet of your vehicle.
- id: 122
  category: safe_driving_rules
  question: In which of the following situations is passing on a two-lane road prohibited?
  choices:
    A: Within 100 feet of a railroad crossing or bridge.
    B: When the vehicle ahead is traveling below the speed limit.
    C: On a straight road with a dashed yellow line.
    D: When you are within 500 feet of an intersection.
  answer: A
  explanation: Passing is prohibited on two-lane roads within 100 feet of a railroad
    crossing, bridge, viaduct, or tunnel.
- id: 123
  category: safe_driving_rules
  question: When is it permissible to pass another vehicle on the right?
  choices:
    A: When the vehicle ahead is driving too slowly.
    B: When the vehicle ahead is making a left turn and there is sufficient pavement
      width.
    C: By driving onto the unpaved shoulder of the road.
    D: When you are in a school zone.
  answer: B
  explanation: You may pass on the right of another vehicle which is making or about
    to make a left turn if there is sufficient pavement width for both your vehicle
    and the vehicle making the left turn.
- id: 124
  category: safe_driving_rules
  question: Under Georgia's 'Move Over' Law, what must you do if you are unable to
    safely move over to the next lane when approaching an emergency vehicle parked
    on the shoulder?
  choices:
    A: Maintain your speed and honk your horn.
    B: Stop immediately in your lane.
    C: Slow down below the speed limit and be prepared to stop.
    D: Accelerate to pass the vehicle quickly.
  answer: C
  explanation: The 'Move Over' Law requires motorists to move over to the next lane
    if safely possible. If unable to move over, then slow down below the speed limit
    and be prepared to stop.
- id: 125
  category: penalties_and_points
  question: What is the maximum fine for a first offense violation of the 'Move Over'
    Law?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Violations of the 'Move Over' Law can result in a fine of no more than
    $500 for the first offense.
- id: 126
  category: defensive_driving
  question: What is considered a courteous action when another driver is overtaking
    and passing your vehicle?
  choices:
    A: Speed up to prevent them from passing.
    B: Move to the left to block their path.
    C: Reduce your speed slightly to make it easier for them.
    D: Flash your high beams at them.
  answer: C
  explanation: When a driver behind you is overtaking your vehicle, it is considered
    courteous to reduce your speed slightly, making it easier for them to pass.
- id: 127
  category: safe_driving_rules
  question: What must you do before entering a highway from an alley or private road?
  choices:
    A: Yield only to vehicles approaching from the left.
    B: Stop and yield the right-of-way to all pedestrians and vehicles already on
      the roadway or sidewalk.
    C: Sound your horn and proceed without stopping.
    D: Accelerate quickly to merge with traffic.
  answer: B
  explanation: If you are about to enter or cross a highway from an alley, private
    road or highway, you must stop and yield the right-of-way to all other pedestrians
    and vehicles already traveling on the roadway or sidewalk.
- id: 128
  category: signs_and_signals
  question: If you have a green light at an intersection, but the intersection is
    not yet clear of traffic, what should you do?
  choices:
    A: Proceed into the intersection to claim your right-of-way.
    B: Honk your horn until the intersection clears.
    C: Wait until the intersection is clear of traffic before entering.
    D: Turn right instead of going straight.
  answer: C
  explanation: At intersections with traffic control lights, wait until the intersection
    is clear of traffic or approaching traffic before entering. Do not proceed 'just
    because' you have the green light.
- id: 129
  category: penalties_and_points
  question: What is the penalty for violating the rules for passing a bicycle?
  choices:
    A: A warning for the first offense
    B: A misdemeanor punishable by a fine up to $250.00
    C: A felony punishable by a fine up to $500.00
    D: An automatic license suspension for 6 months
  answer: B
  explanation: According to the manual, violating the rules for passing a bicycle
    is a misdemeanor punishable by a fine up to $250.00.
- id: 130
  category: sharing_the_road
  question: If you cannot change into a non-adjacent lane when passing a bicycle,
    what must you do?
  choices:
    A: Honk your horn and maintain your current speed
    B: Reduce speed to at least 10 mph less than the speed limit or 25 mph (whichever
      is more) and leave at least three feet
    C: Stop and wait for the bicyclist to pull over to the shoulder
    D: Speed up to pass the bicycle as quickly as possible
  answer: B
  explanation: If a lane change is impossible or unsafe, you must reduce your speed
    to at least 10 mph less than the posted speed limit or 25 mph, whichever is more,
    and proceed with at least three feet between your vehicle and the bicycle.
- id: 131
  category: safe_driving_rules
  question: 'When a driver behind you is overtaking your vehicle, it is unlawful to:'
  choices:
    A: Reduce your speed slightly
    B: Maintain your current lane position
    C: Increase your speed before you have been passed completely
    D: Check your rearview mirrors
  answer: C
  explanation: The manual states that it is unlawful to increase your speed before
    you have been passed completely by the overtaking vehicle.
- id: 132
  category: sharing_the_road
  question: 'When passing a motorcyclist, a driver must:'
  choices:
    A: Share the same lane as the motorcyclist to save space
    B: Pass in an adjacent lane
    C: Honk to warn the motorcyclist before passing in the same lane
    D: Pass on the right shoulder of the road
  answer: B
  explanation: A motorcyclist legally occupies the full width of a single lane. When
    passing a motorcyclist, a driver must pass in an adjacent lane and is not permitted
    to occupy the same lane.
- id: 133
  category: safe_driving_rules
  question: Is it legal to flash your turn signals as a courtesy or 'do pass' signal
    to drivers behind you?
  choices:
    A: Yes, it is considered courteous driving
    B: Yes, but only on multi-lane highways
    C: No, it is against the law
    D: No, unless it is raining or foggy
  answer: C
  explanation: The manual explicitly states under 'Illegal Signals' that it is against
    the law to flash turn signals as a courtesy or 'do pass' signal to other drivers
    in the rear.
- id: 134
  category: vehicle_information
  question: 'When preparing to make a left turn, you should keep your wheels:'
  choices:
    A: Turned slightly to the left
    B: Turned slightly to the right
    C: Straight until you begin making the turn
    D: Turned toward the curb
  answer: C
  explanation: When making a left turn, the manual instructs drivers to keep their
    wheels straight until they begin making the turn.
- id: 135
  category: safe_driving_rules
  question: 'Once you have entered an intersection to make a left turn, you cannot:'
  choices:
    A: Change lanes in the intersection
    B: Complete the turn if the light turns yellow
    C: Yield to oncoming traffic
    D: Turn into the lane closest to the center line
  answer: A
  explanation: The manual states that once you have entered an intersection to make
    a left turn, you cannot change lanes in the intersection.
- id: 136
  category: safe_driving_rules
  question: If your vehicle becomes disabled on a highway, you should make every practical
    effort to park off the highway, leaving a clear view of your vehicle for how many
    feet in each direction?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: If a vehicle is disabled, you should park off the highway, leaving
    free passage and a clear view of your vehicle for 200 feet in each direction.
- id: 137
  category: safe_driving_rules
  question: Under which of the following conditions is stopping, standing, or parking
    permitted at ANY time?
  choices:
    A: On a crosswalk
    B: Within an intersection
    C: On a bridge or overpass
    D: None of the above
  answer: D
  explanation: Stopping, standing, or parking is not permitted at any time on a crosswalk,
    within an intersection, or upon a bridge or overpass.
- id: 138
  category: safe_driving_rules
  question: You are permitted to stop momentarily to pick up or drop off passengers
    within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: Stopping, standing, or parking is permitted only momentarily to pick
    up or drop off passengers within 15 feet of a fire hydrant.
- id: 139
  category: vehicle_information
  question: When attempting to parallel park, how far should you be from the other
    car (door to door) when you stop approximately even with it?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 4 feet
  answer: B
  explanation: When attempting to parallel park, you should stop when you are approximately
    even with the car ahead of the space, approximately 2 feet from the other car
    (door to door).
- id: 140
  category: safe_driving_rules
  question: According to the 'Slow Poke' Law, what must a driver in the passing lane
    (most left-hand lane) do when faster-moving traffic is approaching?
  choices:
    A: Maintain their speed if they are driving the speed limit
    B: Move over to the right to allow faster-moving traffic to proceed
    C: Speed up to match the approaching vehicle's speed
    D: Turn on their hazard lights
  answer: B
  explanation: The 'Slow Poke' Law requires slower drivers to move out of the passing
    lane and over to the right to allow faster-moving traffic to proceed, regardless
    of the speed they are traveling.
- id: 141
  category: safe_driving_rules
  question: Which of the following is an exception to the 'Slow Poke' Law requiring
    you to move out of the passing lane?
  choices:
    A: When you are driving exactly the posted speed limit
    B: When you are listening to the radio
    C: When your vehicle must be driven in the passing lane to exit or turn left
    D: When you are driving a commercial vehicle
  answer: C
  explanation: One of the exceptions to the 'Slow Poke' Law is when your vehicle must
    be driven in the passing lane to exit or turn left.
- id: 142
  category: sharing_the_road
  question: 'Whenever a vehicle is stopped to permit a pedestrian to cross the roadway
    at a marked crosswalk, the driver of any other vehicle approaching from the rear
    shall:'
  choices:
    A: Honk to warn the pedestrian and proceed
    B: Pass the stopped vehicle on the right
    C: Not overtake and pass the stopped vehicle
    D: Pass the stopped vehicle on the left
  answer: C
  explanation: Whenever any vehicle is stopped to permit a pedestrian to cross the
    roadway at a crosswalk, the driver of any other vehicle approaching from the rear
    shall not overtake and pass the stopped vehicle.
- id: 143
  category: safe_driving_rules
  question: 'You should not make a U-turn on a curve or near the top of a hill if:'
  choices:
    A: You cannot be seen by other drivers approaching from either direction
    B: You are driving a commercial vehicle
    C: The speed limit is over 45 mph
    D: There is a solid white line on the right side of the road
  answer: A
  explanation: 'The manual states: ''Do not make a U-turn on a curve or near the top
    of a hill if you cannot be seen by other drivers approaching from either direction.'''
- id: 144
  category: penalties_and_points
  question: Under Georgia's Super Speeder law, what is the state fee assessed for
    driving 75 mph or more on a two-lane road?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Any driver convicted of speeding 75 mph or more on a two-lane road
    or 85 mph or more on any road in Georgia will be assessed a $200 state fee.
- id: 145
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit on an unpaved
    county road in Georgia?
  choices:
    A: 30 miles per hour
    B: 35 miles per hour
    C: 45 miles per hour
    D: 55 miles per hour
  answer: B
  explanation: The maximum traveling speed is 35 miles per hour on an unpaved county
    road unless otherwise posted.
- id: 146
  category: safe_driving_rules
  question: What is the general maximum speed limit on a rural interstate in Georgia?
  choices:
    A: 55 miles per hour
    B: 65 miles per hour
    C: 70 miles per hour
    D: 75 miles per hour
  answer: C
  explanation: The maximum traveling speed is 70 miles per hour on a rural interstate
    unless otherwise posted.
- id: 147
  category: penalties_and_points
  question: What is a potential penalty for impeding the normal flow of traffic by
    driving too slowly in the passing lane?
  choices:
    A: A fine up to $500 and 2 points on the driving record
    B: A fine up to $1000 and/or 3 points on the driving record
    C: License suspension for 6 months
    D: A mandatory defensive driving course
  answer: B
  explanation: Penalties for driving too slowly and impeding traffic in the passing
    lane include a fine up to $1000 and/or 3 points on the driving record.
- id: 148
  category: safe_driving_rules
  question: When required to stop at a railroad crossing, what is the minimum distance
    you must stop from the nearest rail?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: B
  explanation: You must always stop within 50 feet, but not less than 15 feet, from
    the nearest rail of a railroad crossing when required.
- id: 149
  category: defensive_driving
  question: What is the first thing you should do if your vehicle stalls on railroad
    tracks?
  choices:
    A: Try to restart the engine immediately
    B: Put the vehicle in neutral and push it off the tracks
    C: Get out immediately and move away
    D: Call a tow truck from inside the vehicle
  answer: C
  explanation: If your vehicle stalls on the tracks, you should get out immediately,
    move away, locate the Emergency Notification Systems (ENS) sign, and call for
    help.
- id: 150
  category: vehicle_information
  question: What is the proper technique for a driver to check their surroundings
    while backing up a standard passenger vehicle?
  choices:
    A: Rely entirely on the rearview mirror
    B: Turn your head and look over your right shoulder
    C: Look over your left shoulder and use the side mirrors
    D: Honk the horn and back up quickly
  answer: B
  explanation: Before backing, you should turn your head and look over your right
    shoulder; do not depend on your mirrors.
- id: 151
  category: signs_and_signals
  question: What colors are used for warning signs in highway work zones?
  choices:
    A: Yellow background with black letters
    B: Orange background with black letters or symbols
    C: White background with black letters
    D: Red background with white letters
  answer: B
  explanation: Warning signs in work zones have an orange background and black letters
    or symbols.
- id: 152
  category: penalties_and_points
  question: What is the maximum fine for disobeying regulatory speed limits in a highway
    work zone?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Motorists who disobey regulatory speed limits in a work zone may be
    punished by a fine of not less than $100.00 nor more than $2,000.00, or by imprisonment
    for up to 12 months, or both.
- id: 153
  category: signs_and_signals
  question: In a highway work zone, what authority does a flagger have?
  choices:
    A: They can only provide suggestions for safe speeds
    B: They have the same authority as a regulatory sign
    C: They have less authority than a temporary stop sign
    D: They are only there to warn construction workers of traffic
  answer: B
  explanation: In a work zone, a flagger has the same authority as a regulatory sign,
    and drivers must not disobey their traffic control directions.
- id: 154
  category: sharing_the_road
  question: What should you do when approaching a work zone where vehicles have flashing
    or revolving amber lights?
  choices:
    A: Maintain your speed and honk your horn
    B: Yield the right-of-way and reduce your speed
    C: Speed up to pass the vehicles quickly
    D: Stop completely until the lights are turned off
  answer: B
  explanation: You must yield the right-of-way to work vehicles and heavy equipment
    with flashing or revolving amber lights, and reduce your speed as you approach.
- id: 155
  category: vehicle_information
  question: When parallel parking, at what point should you quickly straighten your
    wheels and continue to back diagonally?
  choices:
    A: When your front bumper is completely clear of the car ahead
    B: As your front door passes the back bumper of the car ahead
    C: Before you begin backing up
    D: When you make contact with the car behind you
  answer: B
  explanation: As your front door passes the back bumper of the car ahead of the space
    you wish to use, quickly straighten your wheels and continue to back diagonally
    into the space.
- id: 156
  category: penalties_and_points
  question: What happens if a driver fails to pay the Super Speeder state fee on time?
  choices:
    A: Their vehicle will be impounded
    B: They will receive 3 points on their license
    C: Their license will be suspended and a $50 reinstatement fee will be added
    D: They will be required to retake the driving test
  answer: C
  explanation: Failure to pay the state fee on time will result in a license suspension
    and an additional $50 reinstatement fee.
- id: 157
  category: safe_driving_rules
  question: Who accounts for the majority of fatalities in highway work zones nationwide?
  choices:
    A: GDOT workers
    B: The general public
    C: Flaggers
    D: Utility workers
  answer: B
  explanation: The general public accounts for 82% of work zone fatalities nationwide,
    making motorists more likely to be killed or injured than GDOT workers.
- id: 158
  category: sharing_the_road
  question: On a road with two or more lanes moving in the same direction, when is
    it acceptable for a slower vehicle to leave the right lane?
  choices:
    A: When passing or making a left turn
    B: When the driver wants a better view of the road
    C: When traveling exactly at the minimum speed limit
    D: Slower vehicles must never leave the right lane
  answer: A
  explanation: When there are two or more lanes for traffic moving in the same direction,
    slower vehicles should use the right lane except when passing or making a left
    turn.
- id: 159
  category: safe_driving_rules
  question: What is true about traffic fines in most work zones?
  choices:
    A: They are reduced by half.
    B: They are increased.
    C: They remain the same as on normal roads.
    D: They are waived for first-time offenders.
  answer: B
  explanation: According to the work zone driving tips in the manual, drivers should
    watch for speed limit signs because fines are increased in most work zones.
- id: 160
  category: safe_driving_rules
  question: Which of the following maneuvers is strictly prohibited on controlled-access
    roadways?
  choices:
    A: Using the shoulder for emergency stops
    B: Backing up
    C: Driving at the posted speed limit
    D: Passing other vehicles
  answer: B
  explanation: The manual explicitly states that backing up is prohibited on controlled-access
    roadways.
- id: 161
  category: safe_driving_rules
  question: 'When traveling down a hill in a motor vehicle, a driver must not:'
  choices:
    A: Apply the brakes gently.
    B: Coast with the gears or transmission in neutral.
    C: Keep both hands on the steering wheel.
    D: Downshift to a lower gear.
  answer: B
  explanation: The coasting law states that the driver of any motor vehicle, when
    traveling down a hill, must not coast with the gears or transmission of the vehicle
    in neutral.
- id: 162
  category: alcohol_drugs_health
  question: 'A person under 21 years of age is considered ''Under the Influence of
    Alcohol'' if their blood alcohol concentration is at or above:'
  choices:
    A: 0.02 gm
    B: 0.04 gm
    C: 0.06 gm
    D: 0.08 gm
  answer: A
  explanation: A person under 21 years of age is irrefutably considered 'Under the
    Influence of Alcohol' when 0.02 gm or more by alcohol weight is present in the
    blood.
- id: 163
  category: alcohol_drugs_health
  question: If a driver is impaired by a legally prescribed medication, can they be
    charged with driving under the influence?
  choices:
    A: No, because the medication was legally prescribed by a doctor.
    B: Yes, having a prescription is not a defense if the medication impairs your
      ability to drive safely.
    C: No, unless the medication was mixed with alcohol.
    D: Yes, but only if the driver is under 21 years of age.
  answer: B
  explanation: The manual states that having a prescription for certain medication
    is not a defense if the medication impairs your ability to safely operate a motor
    vehicle.
- id: 164
  category: driver_responsibility
  question: 'Operating a motor vehicle with the intent to annoy, harass, or intimidate
    another person is defined as:'
  choices:
    A: Reckless driving
    B: Aggressive driving
    C: Defensive driving
    D: Highway hypnosis
  answer: B
  explanation: A person commits the offense of aggressive driving when he or she operates
    any motor vehicle with the intent to annoy, harass, molest, intimidate, injure,
    or obstruct another person.
- id: 165
  category: vehicle_information
  question: What is the maximum permitted width for a trailer on Georgia's highways?
  choices:
    A: 7 feet, 6 inches
    B: 8 feet, 0 inches
    C: 8 feet, 6 inches
    D: 9 feet, 0 inches
  answer: C
  explanation: The manual notes that trailers wider than 8 feet, 6 inches are not
    permitted on Georgia's highways.
- id: 166
  category: safe_driving_rules
  question: Is it legal to wear headphones or a headset while driving a motor vehicle?
  choices:
    A: Yes, if listening to GPS directions.
    B: Yes, but only in one ear.
    C: No, it is unlawful to wear any device that impairs the driver's ability to
      hear.
    D: No, unless you are driving on a rural highway.
  answer: C
  explanation: It is unlawful to operate a motor vehicle while wearing a headphone,
    headset, or any other device which would impair the driver's ability to hear.
- id: 167
  category: sharing_the_road
  question: When is it legal to open the door of a parked vehicle on the side facing
    moving traffic?
  choices:
    A: Only when you are parked in a residential area.
    B: Only when it is safe to do so and will not interfere with other traffic, including
      bicyclists.
    C: Whenever you need to exit the vehicle quickly.
    D: It is never legal under any circumstances.
  answer: B
  explanation: Opening the doors of a vehicle on the side on which traffic is moving
    is prohibited unless it is safe to do so and unless it can be done without interfering
    with the movement of other traffic, including bicyclists.
- id: 168
  category: safe_driving_rules
  question: According to Georgia law, when must you use your headlights?
  choices:
    A: Between one hour after sunset and one hour before sunrise.
    B: Between one-half hour after sunset to one-half hour before sunrise, or when
      it is raining.
    C: Only when driving on unlit rural roads.
    D: From 8:00 PM to 6:00 AM daily.
  answer: B
  explanation: You must use your headlights between one-half hour after sunset to
    one-half hour before sunrise; at any time when it is raining; or when visibility
    is limited.
- id: 169
  category: safe_driving_rules
  question: You must dim your headlights when you are following another vehicle within
    what distance?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: You should dim (lower) your headlights when you are following closely
    (within 200 feet) behind another vehicle.
- id: 170
  category: defensive_driving
  question: If your visibility is greatly reduced while driving at night, what should
    you use as a guide to maintain your lane of travel?
  choices:
    A: The taillights of the vehicle ahead of you.
    B: The headlights of oncoming traffic.
    C: The edge line or center line of the road.
    D: The reflective signs on the shoulder.
  answer: C
  explanation: If visibility is greatly reduced, use the edge line as a guide to maintaining
    your lane of travel. If there is no edge line, use the center line to guide yourself.
- id: 171
  category: safe_driving_rules
  question: Which occupants of a passenger vehicle are required by law to utilize
    a seat safety belt regardless of where they are sitting?
  choices:
    A: All occupants under the age of 18.
    B: Only occupants under the age of 12.
    C: Only the driver and front-seat passengers.
    D: All occupants over the age of 65.
  answer: A
  explanation: All occupants of any passenger vehicle must utilize a seat safety belt
    if they are under the age of 18.
- id: 172
  category: penalties_and_points
  question: What is the penalty for a first conviction of Drag Racing or Reckless
    Stunt Driving within a 5-year period?
  choices:
    A: A 6-month suspension of driving privileges.
    B: A 12-month suspension of driving privileges.
    C: A 3-year suspension of driving privileges.
    D: Permanent revocation of the driver's license.
  answer: B
  explanation: The penalty for a 1st Conviction within 5 years for Drag Racing/Reckless
    Stunt Driving includes a 12-month suspension.
- id: 173
  category: safe_driving_rules
  question: Is it legal for passengers to ride in a house trailer while it is being
    moved on a street or highway?
  choices:
    A: Yes, if the trailer is equipped with seat belts.
    B: Yes, but only if the passengers are over 18 years old.
    C: No, riding in a vehicular drawn trailer is not allowed while it is moving.
    D: No, unless the vehicle is traveling under 25 mph.
  answer: C
  explanation: Riding in a house trailer, or any other vehicular drawn trailer, is
    not allowed while it is being moved upon a street or highway due to the high likelihood
    of injury or death.
- id: 174
  category: safe_driving_rules
  question: According to Georgia law, which occupants of a passenger vehicle must
    utilize a seat safety belt?
  choices:
    A: Only the driver of the vehicle
    B: Each occupant in the front seat and all occupants under the age of 18
    C: Only passengers under the age of 18
    D: All occupants regardless of age or seating position
  answer: B
  explanation: Georgia law states that each occupant in the front seat must be secured
    by a seat safety belt, and all occupants of any passenger vehicle must utilize
    a seat safety belt if they are under the age of 18.
- id: 175
  category: penalties_and_points
  question: What does it mean that Georgia has a 'primary' safety belt law?
  choices:
    A: Seat belt violations are the most common traffic offense in the state.
    B: Officers may stop and cite violators for a seat belt offense without observing
      another violation.
    C: Only the primary driver of the vehicle can be ticketed for seat belt violations.
    D: Seat belt violations carry the highest point penalty of any traffic ticket.
  answer: B
  explanation: Georgia has a 'primary' safety belt law, meaning that officers may
    stop and cite violators without observing another violation.
- id: 176
  category: safe_driving_rules
  question: Under Georgia law, a child must be properly restrained in an appropriate
    child passenger restraining system if they are under what age?
  choices:
    A: Six years of age
    B: Eight years of age
    C: Ten years of age
    D: Twelve years of age
  answer: B
  explanation: Every driver transporting a child who is under eight years of age (except
    in a taxicab or public transit vehicle) must properly restrain the child in an
    appropriate child passenger restraining system.
- id: 177
  category: sharing_the_road
  question: How far back must you stay when following a fire fighting apparatus traveling
    in response to a fire alarm?
  choices:
    A: At least 100 feet
    B: At least 200 feet
    C: At least 300 feet
    D: At least 500 feet
  answer: B
  explanation: The driver of any vehicle must not follow any fire fighting apparatus
    traveling in response to a fire alarm closer than 200 feet.
- id: 178
  category: safe_driving_rules
  question: It is illegal to park any vehicle within what distance of a fire apparatus
    stopped in answer to a fire alarm?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: Drivers must not park any vehicle within 500 feet of any fire apparatus
    stopped in answer to a fire alarm.
- id: 179
  category: penalties_and_points
  question: What is the maximum fine and jail term for a littering conviction under
    Georgia's Litter Control Law?
  choices:
    A: A $500 fine and 6 months in jail
    B: A $1000 fine and a 12-month jail term
    C: A $250 fine and no jail time
    D: A $2000 fine and a 24-month jail term
  answer: B
  explanation: Persons convicted under the Litter Control Law may be assessed a fine
    up to $1000 and a 12 month jail term.
- id: 180
  category: safe_driving_rules
  question: Under the Hands Free Georgia Law (HB 673), which of the following is legally
    permitted while driving?
  choices:
    A: Supporting a phone with your shoulder
    B: Holding a phone to read a text message
    C: Using a phone with headphones or a mounted device
    D: Broadcasting a video if the phone is mounted
  answer: C
  explanation: The Hands Free Law mandates that a phone can only be used with headphones,
    a wireless device, phone holder or mounted device. Holding the phone, reading
    texts, or broadcasting video are prohibited.
- id: 181
  category: penalties_and_points
  question: What is the penalty for a first conviction under the Hands Free Georgia
    Law?
  choices:
    A: 1 point and a fine of not more than $50.00
    B: 2 points and a fine of not more than $100.00
    C: 3 points and a fine of not more than $150.00
    D: License suspension and a $50.00 fine
  answer: A
  explanation: The penalty for a 1st conviction under the Hands Free Georgia Law is
    1 point and a fine not more than $50.00.
- id: 182
  category: sharing_the_road
  question: When approaching an active sanitation vehicle displaying flashing lights,
    if a lane change is impossible, how much must you reduce your speed?
  choices:
    A: To exactly 15 miles per hour
    B: To at least 10 mph less than the posted speed limit or 25 mph, whichever is
      more
    C: To 20 mph less than the posted speed limit
    D: You must come to a complete stop until the workers move
  answer: B
  explanation: If a lane change is impossible, you must reduce your speed to at least
    ten miles per hour less than the posted speed limit or 25 miles per hour, whichever
    is more, and be prepared to stop.
- id: 183
  category: penalties_and_points
  question: What is the maximum fine for violating the law regarding passing a postal
    carrier or sanitation worker?
  choices:
    A: $50.00
    B: $100.00
    C: $250.00
    D: $500.00
  answer: C
  explanation: Violation of the code section regarding passing a postal carrier or
    sanitation worker shall be punished by a fine of not more than $250.00.
- id: 184
  category: license_system
  question: What does TADRA stand for in the Georgia graduated driver's licensing
    program?
  choices:
    A: Teen and Adult Driving Rules Act
    B: Teenage and Driver Responsibility Act
    C: Traffic and Driving Regulations Act
    D: Teen Automotive Driving Requirements Act
  answer: B
  explanation: In 1997 The Teenage and Driver Responsibility Act (TADRA) established
    a graduated driver's licensing program for teens ages 15 to 18 in Georgia.
- id: 185
  category: license_system
  question: When an applicant under 18 years of age applies for a license, they must
    have a responsible adult present. What is the minimum age requirement for this
    responsible adult?
  choices:
    A: 18 years of age
    B: 21 years of age
    C: 25 years of age
    D: There is no minimum age if they are a legal guardian
  answer: A
  explanation: A responsible adult is defined as a person who is eighteen (18) years
    of age or older, competent to verify the application, and has personal knowledge
    of the applicant.
- id: 186
  category: license_system
  question: Which of the following documents can an applicant younger than 18 present
    to satisfy the school enrollment requirement for a driver's license?
  choices:
    A: A signed letter from a classmate
    B: A Certificate of School Enrollment (DS-1)
    C: A middle school report card
    D: A library card
  answer: B
  explanation: Anyone younger than 18 years of age must present specific documents
    to obtain a license or permit, one of which is a Certificate of School Enrollment
    (DS-1).
- id: 187
  category: defensive_driving
  question: According to the Georgia driver's manual, which of the following is considered
    a common driving distraction that increases the risk of crashing?
  choices:
    A: Checking your mirrors frequently
    B: Using your turn signals
    C: The presence of passengers and pets
    D: Keeping both hands on the steering wheel
  answer: C
  explanation: The manual notes that common distractions include talking on a cell
    phone, texting, eating, etc., and adds that 'The presence of passengers and pets
    can also increase crash risk.'
- id: 188
  category: license_system
  question: When driving with a Class C Instructional Permit (CP), you must be accompanied
    by a person who is at least how old?
  choices:
    A: 18 years of age
    B: 21 years of age
    C: 25 years of age
    D: Any age, as long as they are a licensed parent or guardian
  answer: B
  explanation: You may operate any Class C vehicle when accompanied by a person at
    least 21 years of age who is licensed to drive a Class C vehicle and is occupying
    a seat beside the driver.
- id: 189
  category: driver_testing
  question: What is the policy regarding the test fee for a Class C Instructional
    Permit?
  choices:
    A: The $10.00 fee is fully refundable if you fail the test.
    B: The $15.00 fee is paid after you pass the test.
    C: The $10.00 fee must be paid prior to testing and is non-refundable if you fail.
    D: There is no fee for the first testing attempt.
  answer: C
  explanation: The manual states that the test fee is $10.00 and must be paid prior
    to testing. If any part of the test is failed, no refund will be issued.
- id: 190
  category: license_system
  question: Between what hours is a Class D Provisional License holder prohibited
    from driving?
  choices:
    A: 10:00 p.m. and 6:00 a.m.
    B: 11:00 p.m. and 5:00 a.m.
    C: 12:00 a.m. and 5:00 a.m.
    D: 1:00 a.m. and 6:00 a.m.
  answer: C
  explanation: A Class D license Holder may not drive between the hours of 12:00 a.m.
    and 5:00 a.m. with NO EXCEPTIONS.
- id: 191
  category: license_system
  question: To obtain a Class D Provisional License, a teen must complete a cumulative
    total of at least how many hours of other driving experience?
  choices:
    A: 20 hours, including 2 hours at night
    B: 30 hours, including 5 hours at night
    C: 40 hours, including at least 6 hours at night
    D: 50 hours, including at least 10 hours at night
  answer: C
  explanation: You must also have completed a cumulative total of at least 40 hours
    of other driving experience including at least 6 hours at night.
- id: 192
  category: driver_responsibility
  question: If a parent or legal guardian wishes to revoke a minor's instructional
    permit or driver's license, what fee must they pay?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: B
  explanation: The person requesting revocation of a minor's instructional permit
    or driver's license must pay a non-refundable fee of $10.00.
- id: 193
  category: penalties_and_points
  question: For a person under 21 years of age, a first conviction for hit and run
    or reckless driving will result in a license suspension for how long?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: B
  explanation: The instructional permit or driver's license of any person under 21
    years of age convicted of any of the listed offenses (including hit and run and
    reckless driving) shall be SUSPENDED for a period of six months for a first conviction.
- id: 194
  category: penalties_and_points
  question: Which of the following offenses will result in a license suspension for
    a driver under 21 years of age?
  choices:
    A: Speeding 10 mph over the speed limit
    B: Improper parking in a school zone
    C: Exceeding the speed limit by 24 miles per hour or more
    D: Failure to use a turn signal
  answer: C
  explanation: A driver under 21 will have their license suspended for any offense
    for which four or more points are assessed, which includes exceeding the speed
    limit by 24 miles per hour or more.
- id: 195
  category: penalties_and_points
  question: A driver under 18 years of age will have their license suspended if they
    accumulate how many points in any 12-month period?
  choices:
    A: 2 or more points
    B: 4 or more points
    C: 6 or more points
    D: 8 or more points
  answer: B
  explanation: The manual states that a suspension will occur for the accumulation
    of four or more points in any 12-month period while under 18 years of age.
- id: 196
  category: license_system
  question: What does ADAP stand for in the context of obtaining a Class D Provisional
    License?
  choices:
    A: Adolescent Driving and Parking
    B: Advanced Driver Assessment Protocol
    C: Alcohol and Drug Awareness Program
    D: Adult Driver Approval Process
  answer: C
  explanation: You must present proof of completion of the Alcohol and Drug Awareness
    Program (ADAP) to obtain a Class D Provisional License.
- id: 197
  category: license_system
  question: How old must you be to obtain a Class M Motorcycle Operator's License
    in Georgia?
  choices:
    A: 15 years of age
    B: 16 years of age
    C: 17 years of age
    D: 18 years of age
  answer: C
  explanation: 'The manual states: ''You must be 17 years of age to obtain a Class
    M Motorcycle Operator''s License.'''
- id: 198
  category: penalties_and_points
  question: If it is your first DUI suspension and you refused implied consent testing,
    how long will your license be suspended?
  choices:
    A: A minimum of 6 months
    B: A minimum of 12 months
    C: A minimum of 18 months
    D: A minimum of 24 months
  answer: B
  explanation: According to the manual, for a first DUI suspension, if your Blood
    Alcohol Concentration was .08 or greater or you refused implied consent testing,
    your license will be suspended for a minimum period of 12 months.
- id: 199
  category: penalties_and_points
  question: During a second DUI suspension, when does a driver become eligible for
    an ignition interlock permit?
  choices:
    A: Immediately upon suspension
    B: After 30 days
    C: After 120 days
    D: After 6 months
  answer: C
  explanation: The manual states that for a second DUI suspension, your license will
    be suspended for a minimum period of 18 months, with ignition interlock permit
    eligibility after 120 days.
- id: 200
  category: signs_and_signals
  question: What must you do when you approach an eight-sided (octagon) sign?
  choices:
    A: Yield to oncoming traffic without stopping
    B: Make a complete stop at a marked stop line
    C: Slow down to 15 mph
    D: Prepare for a railroad crossing
  answer: B
  explanation: An octagon (eight-sided shape) always means stop. When you come to
    it, you must make a complete stop at a marked stop line.
- id: 201
  category: signs_and_signals
  question: What does a round road sign indicate?
  choices:
    A: A school zone is ahead
    B: You are approaching a railroad crossing
    C: You must yield the right-of-way
    D: A no-passing zone begins
  answer: B
  explanation: A round sign means you are approaching a railroad crossing. It alerts
    you to slow down, look, listen and prepare to stop.
- id: 202
  category: safe_driving_rules
  question: What is the rule regarding passing another vehicle at a railroad crossing?
  choices:
    A: Passing is allowed if the tracks are clear
    B: Passing is permitted only for commercial vehicles
    C: Passing is prohibited at all railroad crossings
    D: Passing is allowed if you are traveling under 20 mph
  answer: C
  explanation: 'The manual explicitly states: "Passing is prohibited at all railroad
    crossings."'
- id: 203
  category: signs_and_signals
  question: 'A pentagon-shaped sign indicates that you are approaching:'
  choices:
    A: A school zone and/or school crossing
    B: A divided highway
    C: A hospital zone
    D: A steep hill
  answer: A
  explanation: Pentagon shaped signs mean you are approaching a school zone and/or
    school crossing.
- id: 204
  category: signs_and_signals
  question: How far in advance of a school grounds or school crossing are pentagon-shaped
    signs typically erected?
  choices:
    A: 50 to 100 feet
    B: 150 to 700 feet
    C: 500 to 1000 feet
    D: Exactly 1 mile
  answer: B
  explanation: When used, pentagon shaped signs will be erected not less than 150
    feet nor more than 700 feet in advance of the school grounds or school crossing.
- id: 205
  category: signs_and_signals
  question: What does a red circle with a red slash from upper left to lower right
    mean on a regulatory sign?
  choices:
    A: Proceed with caution
    B: The action pictured within the circle is prohibited
    C: A hazard is ahead
    D: You must stop immediately
  answer: B
  explanation: Remember, a red circle with a red slash from upper left to lower right
    means "No." The picture within the circle shows what is prohibited.
- id: 206
  category: safe_driving_rules
  question: When two or more traveling lanes are available in your direction, what
    should slower traffic do?
  choices:
    A: Travel in the left (inside) lane
    B: Travel in the center lane only
    C: Travel in the right (outside) lane(s)
    D: Drive on the shoulder
  answer: C
  explanation: The manual states that when two or more traveling lanes are available
    in the direction you are traveling, slower traffic should travel in the right
    (outside) lane(s).
- id: 207
  category: defensive_driving
  question: According to the manual, when is a roadway most hazardous during a rainstorm?
  choices:
    A: During the first half-hour of rain
    B: After it has been raining for two hours
    C: Just after the rain stops
    D: When the rain is accompanied by lightning
  answer: A
  explanation: 'The warning sign for a slippery road notes: "Roadway is slippery when
    wet. Remember, the first half-hour of rain is most hazardous."'
- id: 208
  category: vehicle_information
  question: What should you do when you see a warning sign indicating a steep hill
    ahead?
  choices:
    A: Accelerate to maintain your speed
    B: Shift into neutral to save gas
    C: Be ready to shift to a lower gear to control speed and protect brakes
    D: Apply your emergency brake immediately
  answer: C
  explanation: For a steep hill ahead, the manual advises to "Slow down and be ready
    to shift to lower gear to control speed and protect brakes from damage."
- id: 209
  category: signs_and_signals
  question: Where is a "No Passing Zone" sign typically located on the highway?
  choices:
    A: On the right side of the highway
    B: On the left side of the highway
    C: Suspended directly over the center lane
    D: Painted on the roadway surface only
  answer: B
  explanation: The manual states that the No Passing Zone sign "is on the left side
    of the highway and marks the beginning of a no passing zone."
- id: 210
  category: safe_driving_rules
  question: When you see a warning sign indicating a soft shoulder, when is it appropriate
    to drive on the shoulder?
  choices:
    A: When you need to pass a slow-moving vehicle
    B: When you want to make a right turn
    C: Only in emergencies
    D: Whenever the main roadway is congested
  answer: C
  explanation: 'The warning sign for a soft shoulder indicates: "Shoulder of the road
    is soft. Drive on the shoulder only in emergencies."'
- id: 211
  category: sharing_the_road
  question: Under Georgia law, who is required to obey official highway signs and
    traffic control signals?
  choices:
    A: Only drivers of motor vehicles
    B: All drivers, including bicyclists
    C: Only drivers of commercial vehicles
    D: Everyone except emergency workers on or off duty
  answer: B
  explanation: Georgia law requires that all drivers, including bicyclists, obey official
    highway signs and traffic control signals unless otherwise directed by a police
    officer or emergency worker.
- id: 212
  category: penalties_and_points
  question: For a first DUI suspension, if your Blood Alcohol Concentration was .02
    or greater but less than .08, what is the minimum suspension period (assuming
    no previous convictions)?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 18 months
  answer: B
  explanation: If your Blood Alcohol Concentration was .02 or greater, but less than
    .08... your license will be suspended for a minimum period of 6 months, unless
    you have a previous conviction.
- id: 213
  category: vehicle_information
  question: How is a slow-moving vehicle defined by Georgia law?
  choices:
    A: A vehicle moving less than 35 miles per hour.
    B: A vehicle moving less than 25 miles per hour.
    C: A vehicle moving less than 40 miles per hour.
    D: A vehicle moving less than 15 miles per hour.
  answer: B
  explanation: A slow-moving vehicle is defined as any vehicle moving less than 25
    miles per hour. They are required by law to display a slow-moving vehicle emblem.
- id: 214
  category: signs_and_signals
  question: Where do milepost markers begin with the number zero on Georgia highways?
  choices:
    A: At the north or east border where a route begins.
    B: At the center of the state.
    C: At the south or west border where a route begins.
    D: At the beginning of any county line.
  answer: C
  explanation: Milepost markers are placed each mile along the edge of the roadway.
    Zero always starts at the south or west border where a route begins.
- id: 215
  category: signs_and_signals
  question: What colors are construction and maintenance warning signs?
  choices:
    A: Yellow with black markings
    B: Red with white markings
    C: Orange with black markings
    D: Blue with white markings
  answer: C
  explanation: Warning signs for construction and maintenance projects are used to
    alert you to dangers ahead. These signs are orange with black markings.
- id: 216
  category: signs_and_signals
  question: What colors are used for signs that give directions to service facilities
    such as gas, food, and lodging?
  choices:
    A: Green and white
    B: Blue and white
    C: Brown and white
    D: Black and white
  answer: B
  explanation: While traveling along Georgia's highways, blue and white signs will
    give directions to service facilities.
- id: 217
  category: safe_driving_rules
  question: Which of the following vehicles are allowed to use the I-85 Express Lanes
    toll-free?
  choices:
    A: Any vehicle with a single occupant
    B: Motorcycles
    C: Heavy commercial trucks
    D: All electric vehicles regardless of license plate
  answer: B
  explanation: On the I-85 Express Lanes, registered transit, three or more person
    carpools, motorcycles, emergency vehicles, and Alternative Fuel Vehicles (AFV)
    with the proper AFV license plate are allowed to use the lanes toll-free.
- id: 218
  category: signs_and_signals
  question: What must you do if you approach an intersection where the traffic signal
    is not functioning at all?
  choices:
    A: Yield to the vehicle on your right and proceed.
    B: Treat the intersection as if a stop sign is posted for all directions.
    C: Proceed through the intersection without stopping if the way is clear.
    D: Wait for a police officer to arrive before crossing.
  answer: B
  explanation: If a traffic signal is not functioning at all at an intersection, all
    drivers must treat the intersection as if a stop sign is posted for all directions.
- id: 219
  category: signs_and_signals
  question: What does a flashing yellow arrow traffic signal indicate?
  choices:
    A: You must stop completely before turning left.
    B: You may turn left after yielding to oncoming traffic and pedestrians.
    C: The traffic signal is broken and you should treat it as a four-way stop.
    D: You have the right-of-way to turn left and oncoming traffic must stop.
  answer: B
  explanation: A flashing yellow arrow means you may turn left after yielding to oncoming
    traffic and pedestrians (oncoming traffic still has the green light).
- id: 220
  category: signs_and_signals
  question: When a Pedestrian-Hybrid Beacon (PHB) displays alternating flashing red
    signals, what must a driver do?
  choices:
    A: Slow down and proceed with caution.
    B: Come to a full stop and proceed when pedestrians have cleared the crosswalk.
    C: Stop and wait until the signal turns green.
    D: Yield to pedestrians but stopping is not required.
  answer: B
  explanation: Alternating flashing red signals on a PHB require drivers to come to
    a full STOP, and proceed when pedestrians have cleared the crosswalk.
- id: 221
  category: signs_and_signals
  question: Where must a driver come to a complete stop at an intersection with a
    stop line?
  choices:
    A: At the actual stop sign or traffic signal.
    B: Just past the crosswalk.
    C: At the stop line, before crossing it.
    D: Wherever they have the best view of cross traffic.
  answer: C
  explanation: Drivers must come to a complete stop at the stop line, when present,
    not at the actual stop sign or traffic signal.
- id: 222
  category: signs_and_signals
  question: What pavement marking is used at railroad crossings to prevent passing?
  choices:
    A: A solid white line on the right edge of the road.
    B: A broken yellow line in the center of the road.
    C: A yellow line placed on the right side of the center line.
    D: A double broken white line.
  answer: C
  explanation: At railroad crossings, a yellow line is always placed on the right
    side of the center line to prevent passing.
- id: 223
  category: signs_and_signals
  question: How should a driver respond to a red flashing traffic light?
  choices:
    A: Slow down and proceed with caution.
    B: Stop completely and treat it as a stop sign.
    C: Stop and wait for the light to turn green.
    D: Yield to traffic on the right and proceed without stopping.
  answer: B
  explanation: A red flashing light means you must stop completely (treat as you would
    a stop sign). Proceed with caution only after yielding the right-of-way to pedestrians
    and to other vehicles.
- id: 224
  category: signs_and_signals
  question: What does a single, solid yellow line on a two-lane road indicate?
  choices:
    A: A zone where passing is prohibited.
    B: A zone where passing is allowed if the way is clear.
    C: A lane designated for left turns only.
    D: The right edge of the roadway.
  answer: A
  explanation: Single, solid yellow lines on two-lane roads indicate zones where passing
    is prohibited.
- id: 225
  category: sharing_the_road
  question: What should a pedestrian do if the pedestrian signal begins flashing while
    they are already crossing the street?
  choices:
    A: Turn around and return to the starting curb.
    B: Stop in the middle of the crosswalk and wait.
    C: Run as fast as possible to the other side.
    D: Complete walking across the street.
  answer: D
  explanation: A flashing pedestrian signal means do not leave the curb, but complete
    walking across the street if already started.
- id: 226
  category: signs_and_signals
  question: What do broken yellow lines on a two-lane road indicate?
  choices:
    A: Passing is prohibited in both directions.
    B: It is safe to pass in either direction.
    C: The road is narrowing ahead.
    D: You are approaching a railroad crossing.
  answer: B
  explanation: Broken yellow lines are used when there are only two lanes and it is
    safe to pass in either direction.
- id: 227
  category: signs_and_signals
  question: What does a solid double white line on the roadway indicate?
  choices:
    A: Lane changes are prohibited.
    B: Vehicles are allowed to cross over to the adjacent lane.
    C: You must prepare to stop.
    D: The lane is reserved exclusively for bicycles.
  answer: A
  explanation: When the double white lines are solid, lane changes are prohibited.
- id: 228
  category: signs_and_signals
  question: What is the purpose of a yellow edge line on the left side of the roadway?
  choices:
    A: To indicate a pedestrian crosswalk.
    B: To mark a bicycle lane.
    C: To warn of narrow or raised medians.
    D: To designate a high-occupancy vehicle lane.
  answer: C
  explanation: A yellow edge line may be used on the left side to warn of narrow or
    raised medians.
- id: 229
  category: safe_driving_rules
  question: When traveling on a road with four or more lanes moving in opposite directions,
    when may you cross the two solid yellow center lines?
  choices:
    A: To pass a slow-moving vehicle.
    B: To make a left turn into an alley, private road, or driveway.
    C: To change lanes in heavy traffic.
    D: You may never cross two solid yellow lines.
  answer: B
  explanation: You may cross these lines only to make a left turn into or from an
    alley, private road, driveway, or another street.
- id: 230
  category: signs_and_signals
  question: What should you do when you encounter traffic striping created by diagonal
    yellow lines on the street?
  choices:
    A: Drive over the markings to pass slower traffic.
    B: Park your vehicle in the marked area.
    C: Always keep to the right of these markings.
    D: Use the area to make a U-turn.
  answer: C
  explanation: These markings indicate that the road is narrowing or there is an obstruction
    on the roadway. Always keep to the right of these markings.
- id: 231
  category: safe_driving_rules
  question: What is the maximum distance you may travel in a center left turn lane
    before making your turn?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: You may enter this lane no more than 300 feet from the location of
    the left turn.
- id: 232
  category: sharing_the_road
  question: When is a driver of a motor vehicle permitted to drive across a bicycle
    lane?
  choices:
    A: When passing a slower vehicle.
    B: When parking their vehicle on the side of the road.
    C: Only to cross over it to make a turn.
    D: When the regular traffic lane is congested.
  answer: C
  explanation: Drivers of motor vehicles are prohibited from driving or parking in
    the bicycle lane, except to cross over it to make a turn.
- id: 233
  category: safe_driving_rules
  question: When entering a roundabout, who has the right-of-way?
  choices:
    A: The vehicle entering the roundabout.
    B: Traffic that is already in the roundabout.
    C: The largest vehicle approaching the intersection.
    D: Vehicles entering from the right.
  answer: B
  explanation: When entering a roundabout, traffic laws concerning right-of-way still
    apply. You must yield to other traffic that is already in the roundabout.
- id: 234
  category: safe_driving_rules
  question: In which direction does traffic circulate in a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a figure-eight pattern
    D: Whichever direction the driver chooses
  answer: B
  explanation: Traffic in a roundabout always circulates counterclockwise.
- id: 235
  category: defensive_driving
  question: What is an important rule to follow when navigating a multilane roundabout?
  choices:
    A: Change lanes quickly to exit.
    B: Always enter from the left lane.
    C: Do not change lanes in the roundabout.
    D: Stop inside the roundabout to let others enter.
  answer: C
  explanation: When navigating a multilane roundabout, you must continue circling
    through the roundabout until you reach the roadway onto which you want to turn.
    Do not change lanes in the roundabout.
- id: 236
  category: sharing_the_road
  question: How should experienced cyclists navigate a roundabout?
  choices:
    A: Hug the curb as closely as possible.
    B: Ride in the middle of the lane to prevent vehicles from passing.
    C: Always dismount and walk their bicycles.
    D: Ride in the opposite direction of traffic.
  answer: B
  explanation: Experienced cyclists may navigate roundabouts like motorists. Do not
    hug the curb. Ride in the middle of the lane to prevent vehicles from passing
    you.
- id: 237
  category: vehicle_information
  question: Where can you find the recommended tire pressure (psi) for your vehicle?
  choices:
    A: On the steering wheel.
    B: In the door jam of the vehicle.
    C: On the vehicle's license plate.
    D: On the engine block.
  answer: B
  explanation: Prior to entering vehicle check tire pressure using recommended psi
    located in the door jam of the vehicle.
- id: 238
  category: vehicle_information
  question: When using the penny test to check tire tread, what indicates that you
    are driving with a safe amount of tread?
  choices:
    A: Abraham Lincoln's entire head is visible.
    B: Any part of Abraham Lincoln's head is covered by the tread.
    C: The penny falls out of the groove.
    D: The tread is less than 1/32 of an inch.
  answer: B
  explanation: If any part of Lincoln's head is covered by the tread, you're driving
    with the legal and safe amount of tread.
- id: 239
  category: safe_driving_rules
  question: If you are parked on the street, how should you safely approach and enter
    your vehicle?
  choices:
    A: Enter from the street side with your back to traffic.
    B: Approach the vehicle facing traffic and enter from the curb side if possible.
    C: Run quickly to the driver's door without looking.
    D: Enter through the passenger side window.
  answer: B
  explanation: If you are parked on the street, enter from the curb side of the vehicle.
    Have your keys ready, and approach the vehicle facing traffic.
- id: 240
  category: driver_responsibility
  question: What should you do immediately before starting your vehicle's ignition?
  choices:
    A: Turn on the radio.
    B: Fasten your seat belt and make sure passengers do the same.
    C: Check your tire pressure.
    D: Roll down all the windows.
  answer: B
  explanation: Before starting your ignition, fasten your seat belt and make sure
    your passengers do the same.
- id: 241
  category: safe_driving_rules
  question: When approaching a vehicle parked on the street, how should you walk towards
    it?
  choices:
    A: Facing away from traffic
    B: Facing traffic
    C: From the passenger side only
    D: From the rear of the vehicle
  answer: B
  explanation: The manual states that when entering a vehicle parked on the street,
    you should have your keys ready and approach the vehicle facing traffic.
- id: 242
  category: safe_driving_rules
  question: As a general rule, what is the recommended hand position on the steering
    wheel for vehicles without specific air bag instructions?
  choices:
    A: 10 o'clock and 2 o'clock
    B: 8 o'clock and 4 o'clock
    C: 9 o'clock and 3 o'clock
    D: 12 o'clock and 6 o'clock
  answer: C
  explanation: As a general rule, when gripping the steering wheel, place your left
    hand at the 9 o'clock position and your right hand at the 3 o'clock position.
- id: 243
  category: defensive_driving
  question: Which lights should you use when driving in heavy fog?
  choices:
    A: High beam headlights
    B: Parking lights
    C: Hazard lights
    D: Dimmed headlights
  answer: D
  explanation: You should dim your headlights in heavy fog because bright lights produce
    a glare that actually makes it more difficult to see.
- id: 244
  category: defensive_driving
  question: In a standard passenger car, at what speed can partial hydroplaning begin?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: In a standard passenger car, partial hydroplaning can begin at speeds
    as low as 35 mph.
- id: 245
  category: defensive_driving
  question: What is the proper response if your vehicle begins to hydroplane?
  choices:
    A: Slam on the brakes immediately
    B: Steer sharply toward the shoulder
    C: Take your foot off the accelerator and let the car slow down
    D: Accelerate to push through the standing water
  answer: C
  explanation: If hydroplaning occurs, you should take your foot off of the accelerator,
    letting the car slow down.
- id: 246
  category: defensive_driving
  question: What should you do with the steering wheel if your vehicle starts to skid?
  choices:
    A: Turn it in the opposite direction of the skid
    B: Turn it in the direction of the skid
    C: Hold it perfectly straight
    D: Jerk it quickly back and forth
  answer: B
  explanation: If you start to skid, you should begin turning the steering wheel in
    the direction of the skid.
- id: 247
  category: safe_driving_rules
  question: Why is the first half-hour of rainfall considered the most dangerous for
    driving?
  choices:
    A: Visibility is reduced to zero immediately
    B: Hydroplaning only occurs during the first 30 minutes
    C: Water mixes with oil and chemicals on the road, making it extremely slippery
    D: Brakes are more likely to fail when initially wet
  answer: C
  explanation: The first half-hour of rainfall is the most dangerous because roadways
    become extremely slippery when the water mixes with oil and other chemicals on
    the road surfaces.
- id: 248
  category: defensive_driving
  question: If you realize you are traveling too fast while driving through a curve,
    what should you do?
  choices:
    A: Forcefully apply the brakes to slow down quickly
    B: Take your foot off the accelerator and carefully apply the brake
    C: Shift into neutral and coast through the curve
    D: Accelerate slightly to increase traction
  answer: B
  explanation: If you are traveling too fast in a curve, do not forcefully apply brakes
    as this may cause a skid. Instead, take your foot off the accelerator, carefully
    apply the brake, and continue steering.
- id: 249
  category: defensive_driving
  question: If your vehicle unexpectedly leaves the roadway, why should you avoid
    immediately turning back onto the pavement?
  choices:
    A: It will damage your tires
    B: Overcompensating or jerking the wheel can cause you to lose control, skid,
      or flip
    C: You must wait for a tow truck to assist you
    D: It is illegal to re-enter the roadway without stopping first
  answer: B
  explanation: Don't try to turn back onto the pavement immediately. Overcompensating
    or "jerking the wheel" can cause you to lose control of your vehicle by skidding
    or flipping.
- id: 250
  category: safe_driving_rules
  question: When you first enter the roadway during winter weather, how should you
    test the road conditions if it is safe to do so?
  choices:
    A: Accelerate rapidly to check tire grip
    B: Apply sudden, hard braking to see if you slide
    C: Test your brakes gently and make slight steering adjustments
    D: Drive in a zig-zag pattern across the lanes
  answer: C
  explanation: When you first enter the roadway in winter weather, get a "feel" for
    the road by testing your brakes gently and determining how your vehicle responds
    to slight steering adjustments.
- id: 251
  category: alcohol_drugs_health
  question: Which of the following are symptoms of carbon monoxide poisoning?
  choices:
    A: Sudden weariness, yawning, dizziness, and nausea
    B: Hyperactivity and increased heart rate
    C: Blurred vision and ringing in the ears
    D: Extreme hunger and thirst
  answer: A
  explanation: Symptoms of carbon monoxide poisoning are sudden weariness, yawning,
    dizziness, and nausea.
- id: 252
  category: driver_responsibility
  question: 'To prevent carbon monoxide poisoning, you should NEVER:'
  choices:
    A: Drive with your windows rolled down
    B: Leave the car motor running in a garage
    C: Use your heater while driving on the highway
    D: Park your car in an open driveway with the engine off
  answer: B
  explanation: 'Simple precautions to avoid carbon monoxide include: Don''t leave
    the car motor running in a garage.'
- id: 253
  category: defensive_driving
  question: What is the recommended first step if you experience a sudden tire blow-out
    while driving?
  choices:
    A: Slam on the brakes to stop immediately
    B: Grasp the steering wheel firmly and take your foot off the accelerator
    C: Quickly steer onto the shoulder of the road
    D: Accelerate to maintain forward momentum
  answer: B
  explanation: If you experience a sudden tire blow-out, grasp the steering wheel
    firmly and take your foot off the accelerator to allow the vehicle to roll to
    a stop.
- id: 254
  category: signs_and_signals
  question: How does a Diverging Diamond Interchange (DDI) improve traffic flow?
  choices:
    A: It requires all vehicles to stop at a four-way intersection before entering
      the freeway
    B: It shifts traffic flow to the opposite side of the road to allow left turns
      onto an on-ramp without stopping
    C: It uses a large circular roundabout to keep traffic moving continuously
    D: It restricts freeway access to commercial vehicles only
  answer: B
  explanation: A Diverging Diamond Interchange (DDI) shifts traffic flow to the opposite
    side of the road to allow vehicles to enter the freeway by turning left onto an
    on-ramp without stopping.
- id: 255
  category: safe_driving_rules
  question: At what speed might a standard passenger car's tires lose all contact
    with the road during a hydroplaning event?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: In a standard passenger car, partial hydroplaning can begin at 35 mph,
    but at 55 mph, the tires may lose all contact with the road.
- id: 256
  category: vehicle_information
  question: What dangerous situation can occur if a vehicle's ignition is placed in
    the lock position while the vehicle is in motion?
  choices:
    A: The brakes will immediately lock and stop the car.
    B: The steering capability of the vehicle will be disabled.
    C: The engine will rapidly accelerate.
    D: The hazard lights will automatically flash.
  answer: B
  explanation: According to the manual, if a vehicle's ignition is placed in the lock
    position while the vehicle is in motion, the steering capability of the vehicle
    will be disabled, and the driver will be unable to steer.
- id: 257
  category: safe_driving_rules
  question: How can you determine if you are leaving enough distance between your
    vehicle and the vehicle in front of you?
  choices:
    A: Keep exactly two car lengths between you and the vehicle ahead.
    B: Wait three seconds before accelerating from a stop.
    C: Count 'one-thousand-one, one-thousand-two' after the car ahead passes a reference
      point.
    D: Ensure you can see the rear tires of the vehicle ahead touching the road.
  answer: C
  explanation: The manual suggests watching the car ahead pass a reference point and
    counting 'one-thousand-one, one-thousand-two.' If you pass the same spot before
    you finish counting, you are following too closely.
- id: 258
  category: defensive_driving
  question: Under which of the following conditions should you increase your following
    distance?
  choices:
    A: During inclement weather.
    B: During heavy traffic.
    C: At night.
    D: All of the above.
  answer: D
  explanation: The manual states that during inclement weather, during construction,
    during heavy traffic, and always at night, the distance between your vehicle and
    the vehicle in front of you should be even greater.
- id: 259
  category: safe_driving_rules
  question: Which of the following is NOT listed in the manual as a factor that determines
    actual stopping distance?
  choices:
    A: Wind direction and velocity.
    B: The type and condition of the pavement.
    C: The time of day.
    D: The mental and physical reaction of the driver.
  answer: C
  explanation: The manual lists mental/physical reaction, pavement type/condition,
    tires, chassis design, brakes, and wind direction/velocity as factors affecting
    stopping distance. Time of day is not listed.
- id: 260
  category: safe_driving_rules
  question: When entering an expressway from the acceleration lane, who has the right
    of way?
  choices:
    A: The vehicle entering the expressway.
    B: Vehicles already on the expressway.
    C: Whichever vehicle is traveling faster.
    D: The vehicle in the rightmost lane must yield to entering traffic.
  answer: B
  explanation: The manual states, 'Vehicles on the expressway have the right of way,
    but courteous drivers will permit you to move into the expressway traffic.'
- id: 261
  category: signs_and_signals
  question: What is a 'gore' on a controlled access highway?
  choices:
    A: A designated rest area for emergencies.
    B: The area of convergence between two lanes of traffic, usually formed by solid
      white lines.
    C: A toll booth lane for high occupancy vehicles.
    D: The median separating traffic traveling in opposite directions.
  answer: B
  explanation: The manual defines a gore as 'the area of convergence between two lanes
    of traffic... usually similar to a triangle, formed by solid white lines between
    an existing lane of travel and a merging lane of travel.'
- id: 262
  category: signs_and_signals
  question: How are High Occupancy Vehicle (HOV) lanes marked on the roadway?
  choices:
    A: With a solid yellow line on both sides.
    B: With a painted bicycle symbol.
    C: With a diamond symbol.
    D: With a large white 'X'.
  answer: C
  explanation: According to the manual, HOV lanes are marked with a diamond symbol
    and the hours of restriction are posted.
- id: 263
  category: penalties_and_points
  question: What is the penalty for a first offense of violating HOV lane restrictions
    in Georgia?
  choices:
    A: A fine up to $75.
    B: A fine up to $100.
    C: A fine up to $150 and one point on the driving record.
    D: License suspension for 30 days.
  answer: A
  explanation: The penalty for violating HOV lane restrictions is a fine up to $75
    for a first offense.
- id: 264
  category: safe_driving_rules
  question: Which vehicles are allowed to use High Occupancy Toll (HOT) lanes toll-free?
  choices:
    A: Any vehicle with exactly two occupants.
    B: Registered transit, three or more person carpools, motorcycles, emergency vehicles,
      and Alternative Fuel Vehicles.
    C: Commercial tractor-trailers.
    D: Any vehicle traveling during off-peak hours.
  answer: B
  explanation: HOT lanes allow registered transit, three or more person carpool, motorcycles,
    emergency vehicles, and Alternative Fuel Vehicles to use the lanes toll-free.
- id: 265
  category: safe_driving_rules
  question: When passing another vehicle on the expressway, when is it safe to pull
    back into the right-hand lane?
  choices:
    A: As soon as your front bumper clears the other vehicle.
    B: When you can see the car that you just passed clearly in your rear view mirror.
    C: When the other driver flashes their headlights.
    D: After you have traveled in the left lane for at least one mile.
  answer: B
  explanation: The manual advises, 'Don't pull back into the right-hand lane until
    you can see the car that you just passed clearly in your rear view mirror.'
- id: 266
  category: safe_driving_rules
  question: Under what circumstances is it permissible to drive in reverse on an expressway?
  choices:
    A: If you miss your exit and there is no traffic behind you.
    B: If you drop an item out of your window.
    C: During a severe traffic jam to reach an earlier exit.
    D: Driving in reverse on an expressway is prohibited under any circumstances.
  answer: D
  explanation: The manual explicitly states, 'Don't back up. Driving in reverse on
    an expressway is prohibited under any circumstances.'
- id: 267
  category: safe_driving_rules
  question: Which of the following is considered a valid emergency that permits stopping
    on the expressway shoulder?
  choices:
    A: Switching drivers.
    B: Stretching your legs during a long trip.
    C: Retrieving an item from the back of the vehicle.
    D: None of the above.
  answer: D
  explanation: The manual states that stopping on the shoulder is permitted only in
    an emergency, and explicitly notes that 'Switching drivers, stretching, or retrieving
    an item from the back of the vehicle is NOT considered an emergency.'
- id: 268
  category: safe_driving_rules
  question: What should you do if you are slowing down in the traveling lane when
    preparing to exit an expressway?
  choices:
    A: Sound your horn to warn other drivers.
    B: Use either brake lights or a turn signal to indicate a change in speed to the
      drivers behind you.
    C: Turn on your hazard lights.
    D: Shift into neutral.
  answer: B
  explanation: The manual states, 'Drivers should use either brake lights or a turn
    signal to indicate a change in speed to the drivers behind if slowing down in
    the traveling lane when preparing to exit.'
- id: 269
  category: sharing_the_road
  question: Why is it especially dangerous to travel in the blind spot of a tractor-trailer
    combination?
  choices:
    A: They travel at much higher speeds than passenger cars.
    B: They are limited in their visibility because of their size.
    C: They frequently stop on the expressway shoulder.
    D: They are not allowed in the right-hand lane.
  answer: B
  explanation: 'The manual warns to stay out of blind spots, noting this is especially
    true for large vehicles: ''Tractor-trailer combinations, also known as eighteen-wheelers,
    are limited in their visibility because of their size.'''
- id: 270
  category: driver_responsibility
  question: What is the first thing you should do if you encounter a victim of carbon
    monoxide poisoning?
  choices:
    A: Give them water to drink.
    B: Move the victim to fresh air.
    C: Apply mud or dirt to their face.
    D: Check the ditch for water.
  answer: B
  explanation: The manual instructs to 'Move a victim of carbon monoxide poisoning
    to fresh air, contact emergency medical services, and give artificial respiration
    if it is necessary...'
- id: 271
  category: safe_driving_rules
  question: According to the manual, which of the following is considered an acceptable
    reason to stop on the expressway shoulder?
  choices:
    A: Switching drivers
    B: Retrieving an item from the back of the vehicle
    C: Stretching your legs
    D: Experiencing a vehicle breakdown or true emergency
  answer: D
  explanation: The manual states that stopping on the roadway shoulder is highly dangerous
    and permitted only in an emergency. Switching drivers, stretching, or retrieving
    an item is NOT considered an emergency.
- id: 272
  category: safe_driving_rules
  question: If it is necessary to make an emergency stop on the expressway, what should
    you do to indicate difficulty?
  choices:
    A: Walk along the expressway in search of help
    B: Raise the hood and activate your hazard lights
    C: Stand in the lane of traffic and wave your arms
    D: Honk your horn continuously until help arrives
  answer: B
  explanation: If it is necessary to stop on the expressway, you should raise the
    hood and activate your hazard lights to indicate difficulty. The manual explicitly
    warns not to walk along the expressway in search of help.
- id: 273
  category: defensive_driving
  question: What is "highway hypnosis"?
  choices:
    A: A condition of drowsiness or unawareness brought on by monotony on the expressway
    B: A legal term for driving under the influence of stimulant drugs
    C: A technique used to focus on the center line of the roadway
    D: The act of staring at a flashing left turn signal
  answer: A
  explanation: Expressway drivers are subject to "highway hypnosis," a condition of
    drowsiness or unawareness brought on by monotony, the sound of the wind, the tires
    on the pavement, and the steady hum of the engine.
- id: 274
  category: defensive_driving
  question: 'To help keep yourself alert and avoid highway hypnosis on long trips,
    you should:'
  choices:
    A: Stare at the center line on the roadway
    B: Take stimulant drugs to stay awake
    C: Keep shifting your eyes from one area of the roadway to another
    D: Focus only on the vehicle directly in front of you
  answer: C
  explanation: On long trips it is a good idea to "exercise your eyes" to help keep
    you alert. Keep shifting your eyes from one area of the roadway to another and
    focus on various objects, both near and far, left and right.
- id: 275
  category: defensive_driving
  question: As a defensive driver, you should constantly be thinking of an "escape
    route" as you drive. What does this mean?
  choices:
    A: Planning the fastest way to exit the expressway
    B: Looking for a safe area to maneuver if another vehicle crosses into your lane
    C: Finding the quickest route to your destination
    D: Knowing where the nearest rest area is located
  answer: B
  explanation: Thinking of an escape route means looking closely at the shoulder and
    nearby area to determine what you would do if a car approaching from the other
    direction crosses to your side of the road.
- id: 276
  category: vehicle_information
  question: What should you do if your vehicle's accelerator becomes jammed while
    driving?
  choices:
    A: Shift to park immediately
    B: Turn off the ignition and lock the steering wheel
    C: Shift to neutral and concentrate on steering
    D: Pump the gas pedal repeatedly
  answer: C
  explanation: If the accelerator is jammed, you should slap the pedal with your foot,
    shift to neutral, concentrate on steering, use brakes, and turn off the ignition
    (but not to lock).
- id: 277
  category: vehicle_information
  question: Which of the following is a recommended action if your brakes fail?
  choices:
    A: Shift to a higher gear
    B: Shift to a lower gear and use parking brakes
    C: Turn off the ignition to lock the steering wheel
    D: Accelerate to clear traffic
  answer: B
  explanation: If your brakes fail, the manual recommends shifting to a lower gear,
    using parking brakes, rubbing a tire on the curb, and looking for a safe area
    to slow to a stop.
- id: 278
  category: vehicle_information
  question: How should you dry wet brakes after driving through deep water?
  choices:
    A: Drive at a high speed to air dry them
    B: Shift to neutral and coast
    C: Drive slowly in low gear while applying brakes lightly
    D: Pump the brakes rapidly while accelerating
  answer: C
  explanation: You can dry wet brakes by driving slowly in low gear while applying
    the brakes lightly.
- id: 279
  category: vehicle_information
  question: In the thirteen-county metro Atlanta area, which vehicles are exempt from
    the annual emissions inspection requirement?
  choices:
    A: All light-duty trucks
    B: Vehicles that are 10 model years old
    C: The most recent three model years
    D: Vehicles driven less than 10,000 miles a year
  answer: C
  explanation: Gasoline-powered cars and light-duty trucks less than 25 model years
    old must pass an inspection, but the most recent three model years are exempt
    from this requirement.
- id: 280
  category: vehicle_information
  question: 'According to the manual, idling a vehicle for 10 seconds will:'
  choices:
    A: Consume more fuel than restarting the engine
    B: Charge the battery fully
    C: Reduce engine wear compared to driving
    D: Cause the brakes to fail
  answer: A
  explanation: Idling a vehicle for 10 seconds will consume more fuel than restarting
    the engine. Minimizing idling reduces fuel consumption, engine wear, and air pollution.
- id: 281
  category: sharing_the_road
  question: Under Georgia law, when must a driver stop and remain stopped for a pedestrian
    crossing the roadway within a crosswalk?
  choices:
    A: Only when the pedestrian is directly in front of the vehicle
    B: When the pedestrian is on the half of the roadway the vehicle is traveling
      on, or approaching within one lane of it
    C: Only if the crosswalk is marked with painted lines
    D: Only when a traffic signal is red
  answer: B
  explanation: A driver must stop and remain stopped when the pedestrian is upon the
    half of the roadway on which the vehicle is traveling, or approaching and within
    one lane of that half.
- id: 282
  category: sharing_the_road
  question: In the context of pedestrian right-of-way laws, what does "half of the
    roadway" mean?
  choices:
    A: The exact center line of the street
    B: The lane closest to the sidewalk
    C: All traffic lanes carrying traffic in one direction of travel
    D: The median separating opposing traffic
  answer: C
  explanation: '"Half of the roadway" means all traffic lanes carrying traffic in
    one direction of travel.'
- id: 283
  category: sharing_the_road
  question: Which of the following statements about crosswalks is true?
  choices:
    A: Crosswalks only exist if they are marked by painted lines
    B: Crosswalks exist on all four corners of intersections even when not marked
      by painted lines
    C: Pedestrians only have the right of way in mid-block crosswalks
    D: Drivers are allowed to block crosswalks if the traffic light is green
  answer: B
  explanation: Crosswalks exist on all four corners of intersections even when they
    are not marked by painted lines. A crosswalk is the part of the pavement for pedestrian
    traffic where the sidewalk would extend across the street.
- id: 284
  category: sharing_the_road
  question: 'When approaching a blind pedestrian crossing a street, you must give
    them the right of way:'
  choices:
    A: Only if they are in a marked crosswalk
    B: At all times if they are carrying a white cane or being guided by a dog
    C: Only if the traffic signal is red
    D: Only during daylight hours
  answer: B
  explanation: Pedestrians using guide dogs or white walking canes must be given the
    right of way at all times.
- id: 285
  category: safe_driving_rules
  question: When waiting to make a right turn at a red traffic signal, where should
    you stop your vehicle?
  choices:
    A: In the middle of the crosswalk to get a better view of traffic
    B: Before the crosswalk so pedestrians can cross safely
    C: Past the crosswalk
    D: In the intersection
  answer: B
  explanation: Before turning right on red, drivers must come to a full and complete
    stop before the crosswalk and must not block the crosswalk, as this puts pedestrians
    at risk.
- id: 286
  category: safe_driving_rules
  question: What must a driver do before making a right turn at a red traffic signal?
  choices:
    A: Slow down and yield to traffic without stopping
    B: Come to a full and complete stop before the crosswalk
    C: Honk to warn pedestrians before turning
    D: Stop only if pedestrians are visible in the crosswalk
  answer: B
  explanation: According to the manual, before turning right on red, drivers must
    come to a full and complete stop before the crosswalk.
- id: 287
  category: sharing_the_road
  question: When stopping at a crosswalk on a multi-lane road, how far back should
    you stop your vehicle?
  choices:
    A: Exactly on the crosswalk line
    B: At least 5 feet before the crosswalk
    C: At least 10 feet before the crosswalk
    D: At least 20 feet before the crosswalk
  answer: C
  explanation: The manual states that when you stop at a crosswalk on a multi-lane
    road, you should stop at least 10 feet before the crosswalk so a driver in the
    next lane can see the pedestrian.
- id: 288
  category: safe_driving_rules
  question: According to the manual, what is the risk of pedestrian death when struck
    by a motor vehicle traveling at 40 mph?
  choices:
    A: 20%
    B: 50%
    C: At least 80%
    D: 100%
  answer: C
  explanation: The manual notes that when a pedestrian is struck by a motor vehicle
    traveling 40mph, the risk of pedestrian death is at least 80%.
- id: 289
  category: sharing_the_road
  question: On which of the following roads are bicyclists NOT legally entitled to
    ride in Georgia?
  choices:
    A: Multi-lane city streets
    B: Rural two-lane highways
    C: Interstate and limited access highways
    D: Roads without designated bike lanes
  answer: C
  explanation: Bicyclists are legally entitled to use every road in Georgia except
    the interstate and interstate-like highways (limited access highways).
- id: 290
  category: sharing_the_road
  question: What is the minimum legal space a motorist must leave when passing a bicyclist?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 6 feet
  answer: B
  explanation: The manual specifies that the minimum legal space for a motorist to
    pass a bicyclist is 3 feet.
- id: 291
  category: penalties_and_points
  question: What is the penalty for violating the law regarding approaching and passing
    bicycle riders?
  choices:
    A: A warning for the first offense
    B: A felony conviction and license suspension
    C: A misdemeanor punishable by a fine up to $250.00
    D: A fine of $500.00 and 3 points on the license
  answer: C
  explanation: Violation of the rules for approaching and passing bicycles is a misdemeanor
    punishable by a fine up to $250.00.
- id: 292
  category: sharing_the_road
  question: If you cannot safely change lanes to pass a bicyclist, how must you adjust
    your speed?
  choices:
    A: Reduce speed to exactly 15 mph
    B: Reduce speed to at least 10 mph less than the posted limit or 25 mph, whichever
      is more
    C: Reduce speed to 5 mph less than the posted speed limit
    D: Come to a complete stop until the bicyclist moves
  answer: B
  explanation: If a lane change is impossible, prohibited, or unsafe, you must reduce
    your speed to at least ten miles per hour less than the posted speed limit or
    25 miles per hour, whichever is more.
- id: 293
  category: safe_driving_rules
  question: When is a motorist allowed to drive or park in a dedicated bike lane?
  choices:
    A: When passing a slower vehicle on the right
    B: When there are no bicyclists present
    C: When making a right turn at an intersection
    D: Motorists are never allowed to drive or park in a bike lane
  answer: D
  explanation: 'The manual explicitly states: ''Motorists are not to drive or park
    in a bike lane.'' Bike lanes are for the use of bicycles only.'
- id: 294
  category: defensive_driving
  question: How does the small profile of a motorcycle affect how it is perceived
    by other drivers?
  choices:
    A: It makes the motorcycle appear closer and faster than it actually is
    B: It makes the motorcycle appear farther away and traveling slower than it actually
      is
    C: It makes the motorcycle easier to see in blind spots
    D: It has no effect on how the motorcycle's speed and distance are perceived
  answer: B
  explanation: According to the manual, the small profile of the motorcycle may make
    it appear farther away and traveling slower than it actually is.
- id: 295
  category: sharing_the_road
  question: Which of the following is true regarding sharing a lane with a motorcycle?
  choices:
    A: You may share the lane if the motorcycle is riding on the far right side
    B: You may share the lane if you are driving a compact car
    C: Motorcycles are allowed the full width of a lane and you must not share the
      lane with them
    D: You can share the lane only when passing the motorcycle
  answer: C
  explanation: Motorcycles are allowed the full width of a lane in which to maneuver,
    and the manual explicitly states, 'Do not share the lane.'
- id: 296
  category: defensive_driving
  question: Where is the most likely place for a car and motorcycle crash to occur?
  choices:
    A: On interstate highways
    B: At intersections
    C: In parking lots
    D: On rural two-lane roads
  answer: B
  explanation: The manual states that intersections are the most likely places for
    a car/motorcycle crash to occur, usually because the car driver does not see the
    motorcycle.
- id: 297
  category: defensive_driving
  question: Why should you wait to be sure a motorcycle is going to turn before proceeding,
    even if its turn signal is flashing?
  choices:
    A: Motorcycle turn signals are often too dim to see clearly
    B: Motorcycle signals may not be self-canceling and the rider may have forgotten
      to turn them off
    C: Motorcyclists frequently use turn signals to indicate they are stopping
    D: It is illegal to proceed while any vehicle's turn signal is flashing
  answer: B
  explanation: The manual warns drivers not to be fooled by a flashing turn signal
    on a motorcycle because they may not be self-canceling and motorcyclists sometimes
    forget to turn them off.
- id: 298
  category: safe_driving_rules
  question: What is the recommended following distance when driving behind a motorcycle?
  choices:
    A: One to two seconds
    B: Two to three seconds
    C: Three to four seconds
    D: Five to six seconds
  answer: C
  explanation: Drivers should allow more following distance -- three or four seconds
    -- when following a motorcycle so the rider has enough time to maneuver or stop
    in an emergency.
- id: 299
  category: vehicle_information
  question: How does the stopping ability of a motorcycle compare to a car in dry
    conditions?
  choices:
    A: Cars can stop much more quickly than motorcycles
    B: Motorcycles can stop more quickly than cars
    C: Both vehicles require the exact same stopping distance
    D: Motorcycles cannot stop safely in dry conditions
  answer: B
  explanation: The manual states that in dry conditions, motorcycles can stop more
    quickly than cars.
- id: 300
  category: safe_driving_rules
  question: What must a driver do when exiting a driveway or alley across a sidewalk?
  choices:
    A: Honk the horn and proceed without stopping
    B: Slow down and yield only to other motor vehicles
    C: Stop before the sidewalk area and proceed only after pedestrians have safely
      passed
    D: Stop only if a pedestrian is already directly in front of the vehicle
  answer: C
  explanation: When exiting or entering a driveway, alley, or parking garage, drivers
    must stop before the sidewalk area and proceed only after pedestrians have safely
    passed.
- id: 301
  category: sharing_the_road
  question: When are you required to stop for a school bus that is loading or unloading
    passengers?
  choices:
    A: Always, regardless of the type of road.
    B: Only if you are traveling in the same direction as the bus.
    C: In most cases, unless you are on a highway separated in the center by a median
      strip.
    D: Only when you are driving in a designated school zone.
  answer: C
  explanation: In most cases, all drivers must stop for a stopped school bus with
    flashing lights. The exception is when highways are separated in the center by
    median strips, where only vehicles traveling in the same direction must stop.
- id: 302
  category: penalties_and_points
  question: What is a potential penalty for unlawfully passing a stopped school bus
    in Georgia?
  choices:
    A: Up to a $500 fine
    B: Up to 6 points on your driving record
    C: Immediate vehicle impoundment
    D: A warning for the first offense
  answer: B
  explanation: Georgia fines and penalties for passing a stopped school bus include
    a mandatory court appearance, up to 6 points on your driving record, and up to
    a $1000 fine.
- id: 303
  category: penalties_and_points
  question: If a driver under the age of 21 is convicted of unlawfully passing a stopped
    school bus, what is the penalty?
  choices:
    A: License suspension
    B: A mandatory retake of the driving test
    C: 10 points on their driving record
    D: Community service only
  answer: A
  explanation: According to Georgia fines and penalties, a conviction for unlawfully
    passing a stopped school bus under 21 years of age constitutes a license suspension.
- id: 304
  category: sharing_the_road
  question: How much stopping distance does a fully loaded tractor-trailer traveling
    at 55 mph need compared to a passenger car?
  choices:
    A: The same distance
    B: Twice the distance
    C: Three times the distance
    D: Four times the distance
  answer: C
  explanation: A fully loaded tractor-trailer traveling at 55 mph needs 3 times the
    distance a car needs to stop.
- id: 305
  category: sharing_the_road
  question: What does the term 'No-Zone' refer to when sharing the road with commercial
    vehicles?
  choices:
    A: A designated area where parking is prohibited
    B: A school zone where speed limits are strictly enforced
    C: The danger areas and blind spots around trucks and buses
    D: A lane reserved only for commercial vehicles
  answer: C
  explanation: The 'No-Zone' represents the danger areas around trucks and buses where
    crashes are more likely to occur, including actual blind spots where your car
    disappears from the driver's view.
- id: 306
  category: safe_driving_rules
  question: How can you tell if you are driving in a truck driver's side No-Zone?
  choices:
    A: You are driving exactly the speed limit.
    B: You cannot see the driver's face in their side-view mirror.
    C: You are more than three car lengths behind the truck.
    D: You can see the entire front of the truck in your rear-view mirror.
  answer: B
  explanation: Trucks and buses have big No-Zones on both sides. If you cannot see
    the driver's face in the side-view mirror, the driver cannot see you.
- id: 307
  category: sharing_the_road
  question: Why is the right side No-Zone of a truck or bus particularly dangerous?
  choices:
    A: Trucks accelerate faster on the right side.
    B: Truck and bus drivers must make wide right turns.
    C: The right side mirror is usually smaller.
    D: Commercial vehicles are not allowed in the left lane.
  answer: B
  explanation: The right side No-Zone is particularly dangerous because truck and
    bus drivers must make wide right turns.
- id: 308
  category: defensive_driving
  question: To avoid the Front No-Zone, what should you do before merging in front
    of a truck or bus?
  choices:
    A: Ensure you are traveling at least 10 mph faster than the truck.
    B: Ensure you can see the truck's headlights in your side mirror.
    C: Ensure you can see the entire front of the truck or bus in your rear-view mirror.
    D: Honk your horn to alert the driver before merging.
  answer: C
  explanation: To avoid the Front No-Zone, make sure that you can see the entire front
    of the truck or bus in your rear-view mirror before you merge or pull into that
    lane of traffic.
- id: 309
  category: safe_driving_rules
  question: According to the Georgia TACT Project, what is the recommended following
    distance to avoid cutting off commercial motor vehicles?
  choices:
    A: One car length for every 10 miles per hour of speed
    B: Two car lengths regardless of speed
    C: Three seconds of following distance
    D: 50 feet at all times
  answer: A
  explanation: The Georgia TACT Project recommends leaving one car length for every
    10 miles per hour of speed to avoid cutting off commercial motor vehicles safely.
- id: 310
  category: safe_driving_rules
  question: According to the manual, speed is a factor in nearly what proportion of
    all fatal crashes?
  choices:
    A: One-quarter
    B: One-third
    C: One-half
    D: Two-thirds
  answer: B
  explanation: The manual states that speed is a factor in nearly one-third of all
    fatal crashes.
- id: 311
  category: license_system
  question: What type of license withdrawal occurs if an applicant fails to give the
    required or correct information at the time of application?
  choices:
    A: Suspension
    B: Revocation
    C: Cancellation
    D: Disqualification
  answer: C
  explanation: The Department of Driver Services is authorized to cancel a license
    if the applicant fails to give the required or correct information needed at the
    time application is made.
- id: 312
  category: license_system
  question: If your driver's license is revoked, what must you do to regain your driving
    privileges after the revocation period ends?
  choices:
    A: Apply for a new license.
    B: Pay a fine and your old license will be returned.
    C: Wait for the license to be automatically reinstated.
    D: Write a letter of appeal to the DDS.
  answer: A
  explanation: If a license is revoked, all driving privileges are terminated. At
    the end of the revocation period, a resident may apply for a new license.
- id: 313
  category: license_system
  question: What happens to your non-commercial driving privileges if your Commercial
    Driver's License (CDL) is disqualified?
  choices:
    A: They are automatically suspended for the same period.
    B: They are permanently revoked.
    C: They are not suspended or revoked by the CDL disqualification itself.
    D: They are restricted to daylight driving only.
  answer: C
  explanation: A disqualification of commercial driving privileges does not, by itself,
    result in the suspension or revocation of a licensee's privileges to operate a
    NON-commercial motor vehicle.
- id: 314
  category: license_system
  question: In Georgia, what is the maximum possible penalty for commercial driving
    privileges upon conviction of certain severe offenses?
  choices:
    A: A 10-year suspension
    B: A lifetime loss of commercial driving privileges
    C: A maximum fine of $10,000
    D: A 5-year disqualification
  answer: B
  explanation: In Georgia, it is possible to lose commercial driving privileges for
    LIFE upon the conviction of certain offenses.
- id: 315
  category: sharing_the_road
  question: When you are stopped for a school bus with flashing lights, when are you
    legally allowed to resume driving?
  choices:
    A: As soon as the bus doors close.
    B: When the bus driver waves you on.
    C: After 60 seconds have passed.
    D: When the bus moves or deactivates its signals AND all passengers have cleared
      the roadway.
  answer: D
  explanation: After stopping for a school bus, you must remain stopped until the
    bus resumes motion or deactivates its warning signals AND all loading or unloading
    passengers have cleared the roadway.
- id: 316
  category: penalties_and_points
  question: Which of the following is a non-conviction situation that will result
    in the suspension of your driving privileges in Georgia?
  choices:
    A: Non-payment of Child Support
    B: Reckless driving
    C: Hit and run
    D: Driving without insurance
  answer: A
  explanation: According to the manual, the Department will suspend driving privileges
    in non-conviction situations including the non-payment of Child Support. Reckless
    driving, hit and run, and driving without insurance are conviction-based suspensions.
- id: 317
  category: alcohol_drugs_health
  question: Under Georgia's Implied Consent law, what is the minimum suspension period
    if you refuse state-administered chemical testing?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: Georgia law requires you to submit to state-administered chemical tests.
    If you refuse this testing, your Georgia driver's license or privilege to drive
    will be suspended for a minimum period of one year.
- id: 318
  category: alcohol_drugs_health
  question: After submitting to the required state chemical tests for alcohol or drugs,
    are you allowed to have additional tests performed?
  choices:
    A: No, additional tests are not permitted by law.
    B: Yes, but only if ordered by a judge.
    C: Yes, at your own expense and from qualified personnel of your choosing.
    D: Yes, and the state will cover the cost of the additional tests.
  answer: C
  explanation: 'The manual states: "After first submitting to the required state tests,
    you are entitled to additional chemical tests of your blood, breath, urine, or
    other bodily substances at your own expense and from qualified personnel of your
    own choosing."'
- id: 319
  category: penalties_and_points
  question: A Georgia driver's license will be suspended if a person accumulates how
    many points within a 24-month period?
  choices:
    A: 10 or more points
    B: 12 or more points
    C: 15 or more points
    D: 21 or more points
  answer: C
  explanation: Georgia licenses will be suspended for any person who accumulates 15
    or more points within 24 months.
- id: 320
  category: penalties_and_points
  question: How many points can a licensed Georgia resident request to have reduced
    from their driving record once every 5 years?
  choices:
    A: Up to 3 points
    B: Up to 5 points
    C: Up to 7 points
    D: Up to 10 points
  answer: C
  explanation: Licensed Georgia residents may request that DDS reduce the number of
    points assessed against their Georgia driver's license up to 7 points once every
    5 years by completing a certified 6-hour driver improvement course.
- id: 321
  category: penalties_and_points
  question: If a defendant successfully completes a certified 6-hour defensive driving
    course before their court appearance for a moving violation, what benefit must
    the court offer once every five years?
  choices:
    A: A 50% reduction in the fine and no points assessed.
    B: A 20% reduction in the fine and no points assessed.
    C: Complete dismissal of the citation.
    D: A 20% reduction in the fine but points will still be assessed.
  answer: B
  explanation: When the original certificate of completion is presented to the court,
    the court shall reduce the fine assessed by 20 percent and no points shall be
    assessed against the driver. This plea may be accepted once every five years.
- id: 322
  category: driver_responsibility
  question: What is the primary purpose of Georgia's Safety Responsibility Law?
  choices:
    A: To require all drivers to take a defensive driving course.
    B: To remove irresponsible drivers from highways and protect insured motorists
      from uninsured motorists.
    C: To ensure all vehicles pass an annual safety inspection.
    D: To mandate the use of child restraint systems in all vehicles.
  answer: B
  explanation: 'The manual states: "The purpose of this law is to remove irresponsible
    drivers from Georgia highways and to protect insured motorists from uninsured
    motorists."'
- id: 323
  category: penalties_and_points
  question: A driver will be declared a Habitual Violator and have their license revoked
    upon the third conviction of certain major offenses within what time frame?
  choices:
    A: 2 years
    B: 3 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: Your driver's license will be revoked if you are declared a Habitual
    Violator based upon the third conviction of any combination of specific offenses
    (like DUI, hit and run, racing) within 5 years.
- id: 324
  category: penalties_and_points
  question: How does the Georgia Department of Driver Services (DDS) handle out-of-state
    traffic convictions for Georgia residents?
  choices:
    A: They are ignored unless they involve a DUI.
    B: They are placed on the driving record and treated as if they occurred in Georgia.
    C: They result in a warning letter but no points are assessed.
    D: They are only recorded if the driver holds a commercial driver's license.
  answer: B
  explanation: Convictions reported to the Georgia DDS by licensing authorities or
    courts in other states will be placed on the driving record of a Georgia licensee.
    The Department will treat such convictions as if they had occurred in this state.
- id: 325
  category: license_system
  question: Which of the following will result in the mandatory revocation of your
    Georgia driver's license?
  choices:
    A: Refusal to submit to a re-examination of driving skills or knowledge after
      receiving notice.
    B: Receiving a single speeding ticket for 15 mph over the limit.
    C: Failing to pay a parking ticket within 30 days.
    D: Accumulating 3 points on your driving record.
  answer: A
  explanation: Your driver's license will be revoked in Georgia for refusal to submit
    to a re-examination of driving skills or knowledge of driving rules after receiving
    notice giving reasonable grounds for such a request.
- id: 326
  category: penalties_and_points
  question: For persons under age 21, how is a plea of nolo contendere treated for
    the purpose of imposing license suspensions?
  choices:
    A: It is ignored.
    B: It results in half the normal points being assessed.
    C: It is considered a conviction.
    D: It requires the driver to retake the road test.
  answer: C
  explanation: According to the manual, a plea of nolo contendere is considered a
    conviction for purposes of imposing suspensions that apply to persons under age
    21.
- id: 327
  category: driver_responsibility
  question: Under the Safety Responsibility Law, if a claim is filed against you for
    damage resulting from a crash, how can you avoid license suspension?
  choices:
    A: By ignoring the claim for 30 days.
    B: By having your insurance carrier file Form SR-21 showing you had liability
      coverage at the time of the crash.
    C: By surrendering your vehicle's license plate.
    D: By paying a Super Speeder fee.
  answer: B
  explanation: To avoid suspension under the Safety Responsibility Law, you may have
    your insurance carrier file Form SR-21 with the DDS if you were covered by liability
    insurance at the time of the crash.
- id: 328
  category: penalties_and_points
  question: The Department is required by law to suspend the driving privileges of
    an individual for a conviction of which of the following offenses?
  choices:
    A: Driving without insurance
    B: Speeding 10 mph over the limit
    C: Improper parking
    D: Failure to use a turn signal
  answer: A
  explanation: The manual lists "Driving without insurance" as one of the offenses
    for which the Department is required by law to suspend the privileges of an individual
    upon conviction.
- id: 329
  category: penalties_and_points
  question: If you are declared a Habitual Violator, when might you be eligible for
    a Probationary License?
  choices:
    A: Immediately upon request
    B: After serving six months of the revocation period
    C: After serving two years of the revocation period
    D: After serving five years of the revocation period
  answer: C
  explanation: According to the manual, if you are declared a Habitual Violator, you
    may be eligible for a Probationary License after serving two years of the revocation
    period.
- id: 330
  category: license_system
  question: What is the fee to obtain a limited driving permit during a suspension
    period?
  choices:
    A: $20
    B: $32
    C: $50
    D: $75
  answer: B
  explanation: The manual states that in some situations, a limited driving permit
    may be available for a fee of $32 during the suspension period.
- id: 331
  category: penalties_and_points
  question: Are limited driving permits valid for operating a commercial vehicle?
  choices:
    A: Yes, but only for employment purposes
    B: Yes, if approved by a sentencing court judge
    C: No, they are never valid for driving a commercial vehicle
    D: No, unless you are transporting non-hazardous materials
  answer: C
  explanation: The manual explicitly states, "Limited driving permits are not valid
    for driving a commercial vehicle."
- id: 332
  category: penalties_and_points
  question: What is the penalty if you are convicted of violating any of the conditions
    or restrictions of your limited driving permit?
  choices:
    A: Your permit is suspended for 30 days
    B: You must pay an additional $32 fee
    C: Your underlying suspension is extended for an additional 6 months
    D: You receive a lifetime disqualification of driving privileges
  answer: C
  explanation: The manual states that a conviction for violating permit conditions
    will revoke the permit and extend the underlying suspension of your driving privilege
    for an additional 6 months.
- id: 333
  category: penalties_and_points
  question: In which of the following situations is a limited driving permit NOT available?
  choices:
    A: First DUI (non-drugs)
    B: Failure to pay child support
    C: Second DUI conviction in 5 years
    D: First suspension for accumulation of 15 points
  answer: B
  explanation: According to the manual, limited driving permits are not available
    for convictions such as "Failure to pay child support."
- id: 334
  category: penalties_and_points
  question: How long will your commercial driving privileges be disqualified for a
    first conviction of a major traffic violation?
  choices:
    A: 60 days
    B: 120 days
    C: 6 months
    D: One year
  answer: D
  explanation: The manual states that the commercial driving privileges of any person
    convicted of a major traffic violation will be disqualified for one year.
- id: 335
  category: alcohol_drugs_health
  question: Driving a Commercial Motor Vehicle (CMV) is considered a major traffic
    violation if your Blood Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: .02 gm.
    B: .04 gm.
    C: .06 gm.
    D: .08 gm.
  answer: B
  explanation: The manual lists "Driving a CMV if your BAC is .04 gm. or higher" as
    a major traffic violation.
- id: 336
  category: penalties_and_points
  question: If you are convicted of a major traffic violation while operating a CMV
    placarded for hazardous materials, how long is the disqualification for a first
    offense?
  choices:
    A: At least one year
    B: At least two years
    C: At least three years
    D: Lifetime
  answer: C
  explanation: If convicted of a major traffic offense while operating a CMV placarded
    for hazardous materials, you will be disqualified from driving a CMV for at least
    three years for a first offense.
- id: 337
  category: penalties_and_points
  question: What is the penalty for a second conviction from a separate incident of
    any major traffic violation?
  choices:
    A: A 3-year disqualification of commercial driving privileges
    B: A 5-year disqualification of commercial driving privileges
    C: A 10-year disqualification of commercial driving privileges
    D: A lifetime disqualification of commercial driving privileges
  answer: D
  explanation: The manual states, "A second conviction from a separate incident of
    any of these major traffic violations will result in a lifetime disqualification
    of commercial driving privileges."
- id: 338
  category: safe_driving_rules
  question: Which of the following speeding offenses is defined as a "serious traffic
    violation"?
  choices:
    A: Speeding 5 or more miles per hour above the posted speed limit
    B: Speeding 10 or more miles per hour above the posted speed limit
    C: Speeding 15 or more miles per hour above the posted speed limit
    D: Speeding 20 or more miles per hour above the posted speed limit
  answer: C
  explanation: The manual defines "Speeding 15 or more miles per hour above the posted
    speed limit" as a serious traffic violation.
- id: 339
  category: alcohol_drugs_health
  question: What is the penalty for a felony conviction involving the manufacturing
    or trafficking of a controlled substance using a Commercial Motor Vehicle (CMV)?
  choices:
    A: 1-year disqualification
    B: 3-year disqualification
    C: 5-year disqualification
    D: Lifetime disqualification
  answer: D
  explanation: A felony conviction involving the manufacturing, distribution, trafficking
    or possession of a controlled substance or marijuana using a CMV results in a
    lifetime disqualification of commercial driving privileges.
- id: 340
  category: penalties_and_points
  question: What is the disqualification period for a first offense of violating an
    out-of-service order?
  choices:
    A: 30 to 60 days
    B: 60 to 120 days
    C: Not less than 180 days and not more than one year
    D: Not less than 2 years and not more than 5 years
  answer: C
  explanation: Violation of an out-of-service order will result in a disqualification
    of not less than 180 days and not more than one year for a 1st offense.
- id: 341
  category: license_system
  question: Which of the following is an allowable reason to drive if you have been
    issued a limited driving permit?
  choices:
    A: Going to a recreational park
    B: Attending classes at a college where you are enrolled
    C: Visiting friends or extended family
    D: Running general household errands
  answer: B
  explanation: A limited driving permit allows you to "Attend classes at a college
    or school in which you are enrolled as a student," among other specific essential
    tasks like employment and medical care.
- id: 342
  category: penalties_and_points
  question: What is the disqualification period for a first-offense railroad grade
    crossing violation while operating a Commercial Motor Vehicle (CMV)?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: According to the manual, conviction of any railroad grade crossing
    offense while operating a CMV will result in a disqualification of 60 days for
    a 1st offense.
- id: 343
  category: driver_responsibility
  question: Under what circumstances must you immediately notify the nearest law enforcement
    agency after a crash?
  choices:
    A: Only if someone is killed or multiple vehicles are involved.
    B: If anyone is injured or killed, or if property damage exceeds $500.00.
    C: If property damage exceeds $1,000.00.
    D: Only if the crash occurs on an interstate highway.
  answer: B
  explanation: The manual states you must notify the nearest law enforcement agency
    immediately if anyone is injured or killed, or if property damage exceeds $500.00.
- id: 344
  category: driver_responsibility
  question: What is required if you strike and damage an unattended vehicle?
  choices:
    A: Wait by the vehicle until the owner returns.
    B: Leave the scene immediately if there is no visible damage.
    C: Locate the owner or leave your information in a conspicuous place where the
      owner will find it.
    D: Call a tow truck to remove the unattended vehicle from the roadway.
  answer: C
  explanation: If you damage an unattended vehicle, you must either locate the owner
    or leave your name, address, and the name of the owner of the vehicle you were
    driving in a conspicuous place.
- id: 345
  category: safe_driving_rules
  question: How should you warn approaching motorists if you are involved in a crash?
  choices:
    A: Stand in the middle of the road and wave your arms.
    B: Activate your hazard lights and use reflective triangles, when available.
    C: Flash your high beams continuously at oncoming traffic.
    D: Sound your horn continuously until emergency services arrive.
  answer: B
  explanation: To warn approaching motorists without jeopardizing safety, you should
    activate your hazard lights, if possible, and use reflective triangles when available.
- id: 346
  category: driver_responsibility
  question: When aiding the injured at a crash scene, when should you move or lift
    a victim?
  choices:
    A: Immediately, to get them out of the damaged vehicle.
    B: Only when it is absolutely necessary.
    C: Whenever they complain of back or neck pain.
    D: Only if they explicitly ask you to move them.
  answer: B
  explanation: Unskilled handling can cause further and more severe injuries. The
    manual advises not to move or lift the victim unless it is absolutely necessary.
- id: 347
  category: driver_responsibility
  question: How should you attempt to stop serious bleeding of a crash victim?
  choices:
    A: Apply a tourniquet tightly above the wound.
    B: Elevate the victim's legs and offer them drinking water.
    C: Apply thick cloth pads, as clean as possible, with pressure by hand.
    D: Wash the wound thoroughly with bottled water.
  answer: C
  explanation: The manual instructs to stop serious bleeding with thick cloth pads,
    as clean as possible, applied with pressure by hand.
- id: 348
  category: driver_responsibility
  question: What protection does Georgia's Good Samaritan Law provide?
  choices:
    A: It requires all drivers to carry a first aid kit in their vehicle.
    B: It holds any person harmless for civil damages arising from rendering emergency
      care.
    C: It mandates that drivers must transport injured persons to the nearest hospital.
    D: It provides financial compensation to those who help at a crash scene.
  answer: B
  explanation: Georgia has a Good Samaritan Law that holds any person harmless for
    civil damages arising as a result of any act or omission in rendering emergency
    care.
- id: 349
  category: safe_driving_rules
  question: On a multilane highway, when is it your duty to move your vehicle from
    the roadway following a crash?
  choices:
    A: When there is no apparent serious injury or death, and the vehicle can be driven
      normally and safely.
    B: Only after law enforcement has arrived and taken photographs of the scene.
    C: Whenever the property damage is estimated to be less than $500.
    D: You should never move your vehicle until a tow truck arrives.
  answer: A
  explanation: If there is no apparent serious injury or death, it is the duty of
    the drivers to move their vehicles to a safe location if the vehicles are capable
    of being driven normally and successfully.
- id: 350
  category: driver_responsibility
  question: 'If you move your vehicle to a safe location after a minor crash on an
    expressway, you:'
  choices:
    A: Will automatically be considered at fault for the crash.
    B: Lose your right to file a written police report.
    C: Can be accused of failing to stop and provide information.
    D: Will not be considered at fault simply because you moved the vehicle.
  answer: D
  explanation: Drivers who take the step to move their vehicles will not be considered
    at fault simply because they moved the vehicles, nor does it affect their ability
    to file a written report.
- id: 351
  category: defensive_driving
  question: What should you do if a deer crosses the road in front of your car?
  choices:
    A: Speed up to pass the deer quickly before it changes direction.
    B: Slow down, as deer usually travel in groups and another may be following.
    C: Swerve into the oncoming lane to avoid hitting the animal.
    D: Turn off your headlights so the deer can see its surroundings better.
  answer: B
  explanation: Always slow down when a deer crosses the road in front of you. Deer
    usually travel in groups and it is likely that there is another one following
    closely behind.
- id: 352
  category: defensive_driving
  question: If you spot a deer on the roadside at night, what action should you take
    regarding your headlights?
  choices:
    A: Switch to high beams to see the deer more clearly.
    B: Turn off your headlights completely until you pass the deer.
    C: Blink your headlights and switch to low beam so as not to blind the deer.
    D: Keep your headlights on high beam and sound your horn continuously.
  answer: C
  explanation: If a deer is spotted on the road or roadside at night, the driver should
    slow down immediately, blink his/her headlights and switch to low beam so as not
    to blind the deer.
- id: 353
  category: defensive_driving
  question: Why should you never swerve to avoid a deer in the road?
  choices:
    A: Swerving is illegal on rural roads in Georgia.
    B: It may cause you to strike another vehicle or leave the roadway, causing more
      damage.
    C: Deer are naturally attracted to swerving vehicles.
    D: Swerving will automatically deploy your vehicle's airbags.
  answer: B
  explanation: Never swerve to avoid a deer. This action may cause you to strike another
    vehicle or leave the roadway, causing more damage or serious injuries.
- id: 354
  category: defensive_driving
  question: During which months are deer most active due to their peak breeding season?
  choices:
    A: January, February, and March
    B: April, May, and June
    C: July, August, and September
    D: October, November, and December
  answer: D
  explanation: Deer are most active in the fall months of October, November and December
    during the peak breeding season.
- id: 355
  category: defensive_driving
  question: During what times of day are deer usually seen along the roadside?
  choices:
    A: Only during the middle of the day.
    B: Early morning hours and late evening.
    C: Exclusively between midnight and 3:00 AM.
    D: Only during afternoon rush hour traffic.
  answer: B
  explanation: Deer are usually seen along the roadside during the early morning hours
    and late evening.
- id: 356
  category: driver_responsibility
  question: Which of the following pieces of information are you required to exchange
    with the other driver after a crash?
  choices:
    A: Name, address, license plate number, and driver's license number.
    B: Name, phone number, insurance policy limit, and vehicle identification number
      (VIN).
    C: Address, social security number, and license plate number.
    D: Driver's license number, date of birth, and vehicle make and model.
  answer: A
  explanation: If involved in a crash, you must give your name, address, license plate
    number, and driver's license number to anyone else who was involved, and get the
    same from them.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 357
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 358
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 359
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 360
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 361
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 362
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 363
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 364
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 365
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 366
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 367
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 368
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 369
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 370
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 371
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 372
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 373
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 374
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 375
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 376
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 377
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 378
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 379
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 380
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 381
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 382
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 383
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 384
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 385
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 386
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 387
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 388
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 389
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 390
