questions:
- id: 1
  category: safe_driving_rules
  question: ¿Qué debe hacer inmediatamente cuando vea luces de emergencia detrás de
    usted?
  choices:
    A: Detenerse en medio de la carretera.
    B: Activar la luz direccional y orillarse o salir de la calzada tan pronto como
      sea seguro.
    C: Aumentar la velocidad para buscar un área bien iluminada.
    D: Salir de su vehículo y esperar al oficial.
  answer: B
  explanation: El manual establece que cuando vea luces de emergencia detrás de usted,
    debe activar su luz direccional y orillarse o salir de la calzada tan pronto como
    sea seguro hacerlo.
- id: 2
  category: safe_driving_rules
  question: Si la policía lo detiene por la noche, ¿qué debe hacer para ayudar con
    la visibilidad?
  choices:
    A: Apagar los faros delanteros.
    B: Encender las luces de emergencia (intermitentes) y tocar la bocina.
    C: Encender las luces interiores.
    D: Alumbrar con una linterna por la ventana.
  answer: C
  explanation: Según el manual, debe encender las luces interiores si lo detienen
    por la noche para ayudar con la visibilidad.
- id: 3
  category: safe_driving_rules
  question: Durante una parada de tráfico, ¿dónde debe mantener las manos?
  choices:
    A: En sus bolsillos.
    B: Buscando algo en la guantera.
    C: Detrás de su cabeza.
    D: En el volante o en un lugar visible.
  answer: D
  explanation: El manual instruye a los conductores a mantener las manos en el volante
    o en un lugar visible para que el oficial pueda observarlas fácilmente.
- id: 4
  category: driver_responsibility
  question: Si tiene un arma en el vehículo durante una parada de tráfico, ¿cuándo
    debe informárselo al oficial?
  choices:
    A: Al primer contacto con el oficial.
    B: Solo si el oficial pide registrar el vehículo.
    C: Después de entregar su licencia y registro.
    D: No está obligado a decírselo al oficial.
  answer: A
  explanation: El manual establece que cuando el oficial se acerque al vehículo, debe
    informarle si tiene un arma en el vehículo al primer contacto.
- id: 5
  category: driver_responsibility
  question: ¿Qué debe hacer si su licencia de conducir y los documentos del vehículo
    están fuera de su alcance durante una parada de tráfico?
  choices:
    A: Intentar alcanzarlos rápidamente antes de que el oficial se acerque.
    B: Decirle al oficial dónde están y esperar su confirmación antes de intentar
      alcanzarlos para recogerlos.
    C: Salir del vehículo para buscarlos en el maletero.
    D: Negarse a proporcionarlos ya que están fuera de su alcance.
  answer: B
  explanation: Si los documentos están fuera de su alcance, el manual aconseja decirle
    al oficial dónde están y esperar la confirmación del oficial antes de intentar
    alcanzarlos para recoger los documentos.
- id: 6
  category: penalties_and_points
  question: ¿Qué indica su firma en una multa de tráfico?
  choices:
    A: Una admisión de culpabilidad.
    B: Una renuncia a su derecho a una audiencia judicial.
    C: No es una admisión de culpabilidad.
    D: Un acuerdo para pagar la multa de inmediato.
  answer: C
  explanation: 'El manual establece explícitamente: ''Su aceptación y firma en una
    multa de tráfico no es una admisión de culpabilidad''.'
- id: 7
  category: penalties_and_points
  question: ¿Qué puede suceder si se niega a firmar una multa de tráfico?
  choices:
    A: La multa será desestimada.
    B: Se le dará una advertencia en su lugar.
    C: Su licencia será suspendida de inmediato.
    D: Puede resultar en su arresto.
  answer: D
  explanation: Según el manual, la negativa a firmar una multa de tráfico puede resultar
    en su arresto.
- id: 8
  category: driver_responsibility
  question: Si no está de acuerdo con la decisión del oficial de emitir una multa
    de tráfico, ¿cuál es el procedimiento adecuado?
  choices:
    A: Discutir con el oficial para prolongar el contacto.
    B: Negarse a firmar la multa.
    C: Intentar impugnar la decisión en los tribunales a través de los canales legales
      establecidos.
    D: Alejarse de la escena conduciendo.
  answer: C
  explanation: El manual aconseja que si no está de acuerdo con la decisión del oficial,
    no debe discutir, sino intentar impugnar la decisión en los tribunales a través
    de los canales legales establecidos.
- id: 9
  category: driver_responsibility
  question: Si cree que un oficial actuó de manera inapropiada durante una parada
    de tráfico, ¿qué debe hacer?
  choices:
    A: Discutir con el oficial a un lado de la carretera.
    B: Solicitar hablar con un supervisor lo antes posible después de la parada.
    C: Negarse a proporcionar su licencia de conducir.
    D: Salir de su vehículo para confrontar al oficial.
  answer: B
  explanation: Si cree que el oficial actuó de manera inapropiada, el manual establece
    que puede solicitar hablar con un supervisor, y esto se hace mejor lo antes posible
    después de la parada.
- id: 10
  category: license_system
  question: ¿Cuántos días tiene para obtener una licencia de conducir o permiso de
    Georgia después de convertirse en residente?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Georgia exige que cualquier persona que desee operar un vehículo
    motorizado obtenga una licencia de conducir o permiso de Georgia dentro de los
    30 días posteriores a convertirse en residente.
- id: 11
  category: license_system
  question: Según la ley de Georgia, ¿cuál de las siguientes situaciones convierte
    a una persona en residente a efectos de obtener una licencia de conducir?
  choices:
    A: Visitar el estado para unas vacaciones de 2 semanas.
    B: Conducir a través del estado por una carretera interestatal.
    C: Aceptar un empleo o participar en cualquier oficio u ocupación en Georgia.
    D: Alquilar una habitación de hotel por un fin de semana.
  answer: C
  explanation: Una persona se considera residente de Georgia si acepta un empleo o
    participa en cualquier oficio u ocupación en Georgia, entre otros criterios enumerados
    en el manual.
- id: 12
  category: license_system
  question: ¿Cualquier persona que haya estado en el estado de Georgia durante al
    menos cuántos días se considera residente y debe obtener una licencia de conducir
    de Georgia?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: Según la ley de Georgia (O.C.G.A. §40-5-1), cualquier persona que haya
    estado en el estado durante 30 días o más se considera residente de Georgia.
- id: 13
  category: license_system
  question: ¿Qué beneficio puede aplicarse a los tipos de licencia elegibles que se
    renuevan por internet a través de los Servicios en Línea del DDS?
  choices:
    A: Un descuento de $5.00.
    B: Un descuento de $10.00.
    C: Un examen de la vista gratuito.
    D: Una exención de todas las tarifas de renovación.
  answer: A
  explanation: El manual establece que puede aplicarse un descuento de $5.00 para
    los tipos de licencia elegibles que se renueven por internet.
- id: 14
  category: safe_driving_rules
  question: Cuando un agente de la ley le ordene detenerse, ¿qué debe hacer con respecto
    al motor de su vehículo y los dispositivos de audio?
  choices:
    A: Dejar el motor en marcha y subir el volumen del audio.
    B: Apagar el motor y cualquier dispositivo de audio.
    C: Apagar el motor pero dejar el audio encendido.
    D: Dejar el motor en marcha pero apagar el audio.
  answer: B
  explanation: Durante una parada de tráfico, el manual instruye a los conductores
    a apagar el motor y cualquier dispositivo de audio.
- id: 15
  category: driver_responsibility
  question: Si el oficial de policía que le ordena detenerse no está uniformado, ¿qué
    hará normalmente?
  choices:
    A: Pedirle que salga del auto inmediatamente.
    B: Mostrar sus credenciales de oficial de la ley.
    C: Emitir una advertencia sin pedir su licencia.
    D: Pedirle que los siga a la estación de policía.
  answer: B
  explanation: El manual establece que, al realizar la parada, el oficial normalmente
    mostrará sus credenciales de oficial de la ley si no está uniformado.
- id: 16
  category: license_system
  question: Según la ley de Georgia, ¿cuántos días debe estar una persona en el estado
    para ser considerada residente de Georgia?
  choices:
    A: 15 días o más
    B: 30 días o más
    C: 60 días o más
    D: 90 días o más
  answer: B
  explanation: El manual establece que cualquier persona que haya estado en el estado
    durante 30 días o más se considera residente de Georgia según la ley de Georgia
    (O.C.G.A. §40-5-1).
- id: 17
  category: license_system
  question: Si un miembro en servicio activo de las fuerzas armadas de los EE. UU.
    tiene una licencia válida emitida en un país extranjero por las fuerzas armadas,
    ¿por cuánto tiempo se acepta a su regreso a los Estados Unidos?
  choices:
    A: No más de 30 días
    B: No más de 45 días
    C: No más de 60 días
    D: No más de 90 días
  answer: B
  explanation: Esta licencia solo será aceptada por un período no mayor a 45 días
    a partir de la fecha de su regreso a los Estados Unidos.
- id: 18
  category: license_system
  question: Un trabajador agrícola migrante está exento de obtener una licencia de
    conducir de Georgia si posee una licencia válida de otro estado y trabaja en Georgia
    por menos de ¿cuántos días en un año calendario?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El manual exime a cualquier trabajador agrícola migrante que trabaje
    en este estado menos de 90 días en cualquier año calendario y que posea una licencia
    de conducir válida emitida por otro estado.
- id: 19
  category: driver_testing
  question: Para obtener una licencia Clase D o un Permiso de Instrucción Clase M
    a los 16 o 17 años, ¿el solicitante debe presentar evidencia de cuántas horas
    de conducción supervisada?
  choices:
    A: 30 horas, incluyendo 6 de noche
    B: 40 horas, incluyendo 6 de noche
    C: 40 horas, incluyendo 10 de noche
    D: 50 horas, incluyendo 10 de noche
  answer: B
  explanation: Los solicitantes deben presentar prueba de haber completado un programa
    de educación vial aprobado por el DDS, además de evidencia de al menos cuarenta
    (40) horas de conducción supervisada, seis de las cuales deben ser de noche.
- id: 20
  category: license_system
  question: Al solicitar una licencia de Georgia, ¿se les permite a los ciudadanos
    estadounidenses conservar las tarjetas de identificación o licencias que les hayan
    emitido países extranjeros?
  choices:
    A: Sí, si pagan una tarifa adicional.
    B: Sí, si la licencia está traducida al inglés.
    C: No, a los ciudadanos estadounidenses no se les permitirá conservarlas.
    D: No, a menos que tengan doble ciudadanía.
  answer: C
  explanation: 'El manual establece explícitamente: ''A los ciudadanos estadounidenses
    no se les permitirá conservar ninguna licencia, permiso o tarjeta de identificación
    que les haya sido emitida por países extranjeros''.'
- id: 21
  category: driver_testing
  question: ¿Cuál es la visión mínima aceptable requerida para una licencia no comercial
    en Georgia?
  choices:
    A: 20/40 en ambos ojos
    B: 20/50 en un ojo
    C: 20/60 en un ojo
    D: 20/70 en ambos ojos
  answer: C
  explanation: La visión mínima aceptable para una licencia no comercial es 20/60
    en un ojo, con o sin lentes correctivos.
- id: 22
  category: driver_testing
  question: Además del requisito de visión de 20/60, ¿cuál es el campo de visión horizontal
    mínimo requerido para obtener una licencia no comercial?
  choices:
    A: 100 grados
    B: 120 grados
    C: 140 grados
    D: 160 grados
  answer: C
  explanation: Los conductores deben tener un campo de visión horizontal de al menos
    140 grados para cumplir con los requisitos mínimos de visión.
- id: 23
  category: driver_testing
  question: ¿Con qué frecuencia deben los clientes de 64 años o más completar con
    éxito un examen de la vista?
  choices:
    A: Cada 2 años
    B: Cada 4 años
    C: Cada 5 años
    D: Cada 8 años
  answer: D
  explanation: Según el manual, los clientes de 64 años o más deben completar con
    éxito un examen de la vista cada ocho años.
- id: 24
  category: license_system
  question: ¿Cuál es el propósito de una licencia Clase D en Georgia?
  choices:
    A: Es una licencia no comercial para conductores de 18 años o más.
    B: Es una licencia provisional emitida a conductores de 16 y 17 años.
    C: Es una licencia estrictamente para operadores de motocicletas.
    D: Es un permiso de instrucción para vehículos comerciales.
  answer: B
  explanation: El manual define una licencia Clase D como una licencia provisional
    emitida a conductores de 16 y 17 años.
- id: 25
  category: license_system
  question: ¿Requieren los autociclos de tres ruedas equipados con volante una Licencia
    de Operador de Motocicleta Clase M?
  choices:
    A: Sí, todos los vehículos de tres ruedas requieren una licencia Clase M.
    B: Sí, a menos que el conductor sea mayor de 21 años.
    C: No, no requieren una Licencia de Operador de Motocicleta Clase M.
    D: No, pero requieren una licencia comercial Clase E.
  answer: C
  explanation: De conformidad con el Proyecto de Ley de la Cámara de Representantes
    136 (2017), los autociclos de tres ruedas no requerirán una Licencia de Operador
    de Motocicleta Clase M.
- id: 26
  category: license_system
  question: ¿Qué clases de licencias son licencias no comerciales para conductores
    que operan vehículos motorizados comerciales pero están exentos de los requisitos
    de licencia comercial?
  choices:
    A: Clase A y B
    B: Clase C y D
    C: Clase E y F
    D: Clase CP y MP
  answer: C
  explanation: Las clases E y F son licencias no comerciales para conductores que
    operan vehículos motorizados comerciales y que están exentos de los requisitos
    de licencia comercial (y son gratuitas para los bomberos voluntarios).
- id: 27
  category: license_system
  question: ¿Cuál de las siguientes formas de pago NO se acepta en los Centros de
    Servicio al Cliente del DDS?
  choices:
    A: Efectivo
    B: Visa y Mastercard
    C: Opciones de pago móvil
    D: Cheques personales
  answer: D
  explanation: 'El manual establece: ''No aceptamos cheques, giros postales ni cheques
    de caja''.'
- id: 28
  category: license_system
  question: ¿Cuántos cambios gratuitos de nombre o dirección se permiten a los titulares
    de licencias, permisos y tarjetas de identificación por período de emisión?
  choices:
    A: Ninguno, todos los cambios requieren el pago de una tarifa.
    B: Un cambio gratuito.
    C: Dos cambios gratuitos.
    D: Cambios gratuitos ilimitados.
  answer: B
  explanation: Los titulares de licencias, permisos y tarjetas de identificación tienen
    derecho a un cambio gratuito de nombre o dirección por período de emisión.
- id: 29
  category: driver_testing
  question: 'Una persona que busca obtener una licencia de conducir mientras realiza
    el examen de manejo debe estar acompañada por un examinador de conductores certificado
    o:'
  choices:
    A: Cualquier conductor con licencia mayor de 18 años.
    B: Un Adulto Responsable con una licencia de conducir válida que tenga al menos
      21 años de edad.
    C: Únicamente un padre o tutor legal.
    D: Un conductor que haya tenido una licencia durante al menos 5 años.
  answer: B
  explanation: Esta persona debe estar acompañada por un Adulto Responsable con una
    licencia de conducir válida y tener al menos 21 años de edad, o un examinador
    de conductores certificado o agente del departamento.
- id: 30
  category: driver_responsibility
  question: ¿Los solicitantes menores de 18 años deben presentar un comprobante de
    finalización de qué programa?
  choices:
    A: Curso Avanzado de Conducción Defensiva (ADDC)
    B: Programa de Concientización sobre el Alcohol y las Drogas (ADAP)
    C: Programa de Normas y Seguridad en las Carreteras (HSRP)
    D: Programa de Operación de Vehículos Motorizados (MVOP)
  answer: B
  explanation: Los solicitantes menores de 18 años deben presentar un comprobante
    de finalización del Programa de Concientización sobre el Alcohol y las Drogas
    (ADAP).
- id: 31
  category: license_system
  question: ¿Cuál es el costo estándar de un duplicado de la licencia de conducir,
    permiso o tarjeta de identificación (si no se solicita dentro de los 150 días
    previos al vencimiento)?
  choices:
    A: $5.00
    B: $10.00
    C: $20.00
    D: $32.00
  answer: A
  explanation: Un duplicado de la licencia de conducir, permiso o tarjeta de identificación
    es una copia del documento reemplazado y puede obtenerse a un costo de $5.00 por
    cada trámite.
- id: 32
  category: license_system
  question: ¿Qué sucede si solicita un duplicado de la licencia de conducir dentro
    de los 150 días previos a su fecha de vencimiento original?
  choices:
    A: Paga una tarifa de reemplazo de $5.00 y mantiene la fecha de vencimiento original.
    B: Debe renovar la licencia por un nuevo período al costo total.
    C: Debe entregar su licencia y solicitar un permiso provisional.
    D: Debe realizar un examen de la vista y de conducción para recibir el duplicado.
  answer: B
  explanation: El manual establece que si se solicita un reemplazo dentro de los 150
    días previos a la fecha de vencimiento original, la licencia/permiso/identificación
    debe renovarse por un nuevo período al costo total.
- id: 33
  category: license_system
  question: De acuerdo con los Códigos de Restricción de Licencia del DDS, ¿qué indica
    el código de restricción 'B'?
  choices:
    A: No puede operar un CMV equipado con transmisión manual
    B: Se requieren lentes correctores
    C: Solo horas diurnas
    D: Se requiere transmisión automática
  answer: B
  explanation: La tabla de Códigos de Restricción de Licencia del DDS enumera la 'B'
    como 'se requieren lentes correctores'.
- id: 34
  category: driver_testing
  question: ¿Qué se requiere para renovar una licencia de conducir que ha estado vencida
    por más de dos años?
  choices:
    A: Solo un examen de la vista y una tarifa de $32
    B: Un examen de la vista, un examen de conducción y un examen de conocimientos
      sobre señales y normas de tránsito
    C: Un curso de conducción defensiva y un examen de la vista
    D: Solo un examen de conducción y prueba de residencia
  answer: B
  explanation: Para renovar una licencia de conducir que ha estado vencida por más
    de dos años, debe aprobar un examen de la vista, un examen de conducción y un
    examen para evaluar sus conocimientos sobre las señales y normas de tránsito.
- id: 35
  category: driver_responsibility
  question: Al operar un vehículo motorizado en Georgia, ¿qué debe hacer si lo detiene
    un oficial de la ley?
  choices:
    A: Mostrar su licencia de conducir o permiso cuando se lo soliciten.
    B: Entregar únicamente el registro del vehículo y el seguro.
    C: Proporcionar una declaración verbal de su número de licencia de conducir.
    D: Mostrar su documentación de Real ID.
  answer: A
  explanation: Si lo detienen mientras conduce, debe mostrar su licencia de conducir/permiso
    a cualquier oficial de la ley que se lo solicite.
- id: 36
  category: license_system
  question: ¿Cuántos documentos que demuestren la residencia en Georgia se requieren
    para que se le emita una Real ID, y qué antigüedad pueden tener?
  choices:
    A: Un documento con fecha de los últimos 30 días
    B: Dos documentos con fecha de los últimos seis meses
    C: Tres documentos con fecha del último año
    D: Dos documentos con fecha de los últimos 12 meses
  answer: B
  explanation: Los requisitos de documentación para la Real ID incluyen dos documentos
    que demuestren la residencia en Georgia (por ejemplo, factura de servicios públicos,
    factura de teléfono) que deben tener una fecha de los últimos seis (6) meses.
- id: 37
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un Permiso de Instrucción Clase
    C (CP) en Georgia?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: B
  explanation: Al cumplir los 15 años, o en cualquier momento posterior, puede solicitar
    un Permiso de Instrucción Clase C (CP).
- id: 38
  category: driver_testing
  question: ¿Cuál es el costo del examen de conocimientos al solicitar un Permiso
    de Instrucción Clase C (CP)?
  choices:
    A: $5.00
    B: $10.00
    C: $20.00
    D: $32.00
  answer: B
  explanation: La tarifa del examen es de $10.00 y debe pagarse antes de realizar
    la prueba. Si se reprueba cualquier parte del examen, no se emitirá ningún reembolso.
- id: 39
  category: safe_driving_rules
  question: ¿Bajo qué condiciones puede una persona con un Permiso de Instrucción
    Clase C (CP) operar un vehículo Clase C?
  choices:
    A: Cuando esté acompañado por cualquier conductor con licencia mayor de 18 años.
    B: Cuando esté acompañado por un conductor con licencia Clase C que tenga al menos
      21 años y ocupe el asiento al lado del conductor.
    C: Cuando conduzca solo únicamente durante las horas diurnas.
    D: Cuando esté acompañado por un padre o tutor en el asiento trasero.
  answer: B
  explanation: Puede operar cualquier vehículo Clase C cuando esté acompañado por
    una persona de al menos 21 años de edad que tenga licencia para conducir un vehículo
    Clase C, esté en condiciones de hacerlo y ocupe el asiento al lado del conductor.
- id: 40
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Instrucción Clase C (CP)?
  choices:
    A: Hasta 1 año
    B: Hasta 2 años
    C: Hasta 3 años
    D: Hasta 5 años
  answer: B
  explanation: Los Permisos de Instrucción Clase C (CP) son válidos por hasta 2 años.
- id: 41
  category: license_system
  question: ¿Si un solicitante de un Permiso de Instrucción Clase C es menor de 18
    años, quién tiene la autoridad para revocar el permiso hasta que cumpla los 18
    años?
  choices:
    A: El director de la escuela secundaria
    B: La persona que firmó la solicitud (padre, tutor legal o adulto responsable)
    C: Cualquier oficial de la ley
    D: Un instructor de manejo certificado
  answer: B
  explanation: La persona que firma su solicitud puede, por cualquier motivo, revocar
    su permiso hasta que usted cumpla los 18 años.
- id: 42
  category: license_system
  question: Según la tabla de tarifas, ¿cuál es el costo de una licencia de conducir
    Clase C por 8 años?
  choices:
    A: $10
    B: $20
    C: $25
    D: $32
  answer: D
  explanation: La tabla de tarifas indica que una licencia de conducir de 8 años (Clase
    A, B, C, E, F y M) tiene un costo de $32.
- id: 43
  category: license_system
  question: ¿Qué documentación se requiere para actualizar el género en una licencia
    de conducir o identificación de Georgia?
  choices:
    A: Una nueva acta de nacimiento y un pasaporte
    B: Una orden judicial o una carta de un médico que certifique el cambio de género
    C: Un certificado de matrimonio o una sentencia de divorcio
    D: Dos documentos que demuestren la residencia en Georgia
  answer: B
  explanation: Para actualizar el género, los solicitantes deben presentar una orden
    judicial o una carta de un médico que certifique el cambio de género.
- id: 44
  category: license_system
  question: ¿A partir de qué fecha necesitará una tarjeta que cumpla con Real ID para
    volar dentro de los EE. UU. o ingresar a edificios federales?
  choices:
    A: 7 de mayo de 2025
    B: 1 de junio de 2024
    C: 1 de enero de 2026
    D: 31 de diciembre de 2025
  answer: A
  explanation: A partir del 7 de mayo de 2025, necesitará una tarjeta que cumpla con
    Real ID (con una estrella en la esquina derecha) para volar dentro de los EE.
    UU. o ingresar a edificios federales o cualquier planta de energía nuclear.
- id: 45
  category: safe_driving_rules
  question: ¿Quién debe acompañar a un conductor que opera un vehículo con un Permiso
    de Instrucción Clase C?
  choices:
    A: Cualquier conductor con licencia de 18 años o más
    B: Un instructor de manejo certificado
    C: Un conductor con licencia Clase C de al menos 21 años de edad sentado al lado
      del conductor
    D: Solo un padre o tutor legal
  answer: C
  explanation: Un vehículo Clase C puede ser conducido con un permiso cuando se está
    acompañado por una persona de al menos 21 años de edad que tenga licencia para
    conducir un vehículo Clase C, esté apta y sea capaz, y ocupe el asiento al lado
    del conductor.
- id: 46
  category: driver_responsibility
  question: ¿Quién tiene la autoridad para revocar la licencia Clase D de un menor
    hasta que cumpla los 18 años?
  choices:
    A: El director de la escuela secundaria
    B: El padre, tutor legal o adulto responsable que firmó la solicitud
    C: Un instructor de manejo certificado
    D: El departamento de policía local
  answer: B
  explanation: La persona (padre, tutor legal o adulto responsable) que firma su solicitud
    puede, por cualquier motivo, revocar su licencia hasta que usted cumpla los 18
    años.
- id: 47
  category: driver_testing
  question: Para obtener una licencia Clase D, ¿cuántas horas de experiencia de manejo
    supervisado se deben completar?
  choices:
    A: 30 horas en total, incluyendo 5 horas de noche
    B: 40 horas en total, incluyendo 6 horas de noche
    C: 50 horas en total, incluyendo 10 horas de noche
    D: 60 horas en total, incluyendo 6 horas de noche
  answer: B
  explanation: Debe haber completado un total acumulado de al menos 40 horas de otra
    experiencia de manejo, incluyendo al menos 6 horas de noche.
- id: 48
  category: safe_driving_rules
  question: ¿Cuáles son las horas restringidas de manejo para el titular de una Licencia
    Provisional Clase D?
  choices:
    A: Entre las 10:00 p.m. y las 6:00 a.m.
    B: Entre las 11:00 p.m. y las 5:00 a.m.
    C: Entre las 12:00 a.m. y las 5:00 a.m.
    D: Entre las 1:00 a.m. y las 6:00 a.m.
  answer: C
  explanation: El titular de una licencia Clase D no puede conducir entre las 12:00
    a.m. y las 5:00 a.m. SIN EXCEPCIONES.
- id: 49
  category: safe_driving_rules
  question: Durante los primeros seis meses de tener una Licencia Provisional Clase
    D, ¿quién tiene permitido viajar en el vehículo como pasajero?
  choices:
    A: Solo miembros de la familia inmediata
    B: Hasta un pasajero menor de 21 años que no sea de la familia
    C: Hasta tres pasajeros menores de 21 años
    D: Cualquier persona, siempre que un adulto esté presente
  answer: A
  explanation: Durante los primeros seis meses posteriores a la emisión, solo los
    miembros de la familia inmediata pueden viajar en el vehículo.
- id: 50
  category: safe_driving_rules
  question: Durante los segundos seis meses de tener una licencia Clase D, ¿cuál es
    la restricción de pasajeros?
  choices:
    A: No se permiten pasajeros
    B: Solo pueden viajar miembros de la familia inmediata
    C: Solo puede viajar un pasajero menor de 21 años que no sea miembro de la familia
      inmediata
    D: Pueden viajar hasta tres pasajeros menores de 21 años que no sean miembros
      de la familia inmediata
  answer: C
  explanation: Durante los segundos seis meses posteriores a la emisión, solo un pasajero
    menor de 21 años que no sea miembro de la familia inmediata del conductor puede
    viajar en el vehículo.
- id: 51
  category: alcohol_drugs_health
  question: ¿Qué programa se debe completar para obtener una licencia Clase D a los
    16 o 17 años?
  choices:
    A: El Curso Avanzado de Conducción Defensiva (ADDC)
    B: El Programa de Concientización sobre el Alcohol y las Drogas (ADAP)
    C: El Programa de Seguridad para Conductores Adolescentes de Georgia (GTDSP)
    D: El Programa de Seguridad de Vehículos Motorizados (MVSP)
  answer: B
  explanation: Para obtener una licencia Clase D a la edad de 16 o 17 años, debe completar
    tanto un curso de educación vial aprobado por el DDS como el Programa de Concientización
    sobre el Alcohol y las Drogas (ADAP).
- id: 52
  category: license_system
  question: ¿A qué edad puede el titular de una licencia Clase D solicitar el canje
    de su licencia por una licencia Clase C completa?
  choices:
    A: '17'
    B: '18'
    C: '19'
    D: '21'
  answer: B
  explanation: El titular de una licencia Clase D puede solicitar una licencia Clase
    C al cumplir los 18 años.
- id: 53
  category: license_system
  question: ¿Cuánto cuesta una licencia de conducir Clase C de 8 años al canjear una
    licencia Clase D?
  choices:
    A: Es gratuita
    B: $20
    C: $32
    D: $40
  answer: C
  explanation: Al solicitante se le expedirá una licencia Clase C con un costo de
    $32 por una licencia de 8 años.
- id: 54
  category: license_system
  question: ¿Cuál es el costo de una tarjeta de identificación de registro de votante
    en Georgia si la persona jura bajo juramento que la necesita para votar?
  choices:
    A: $5.00
    B: $10.00
    C: $32.00
    D: Sin costo
  answer: D
  explanation: Una identificación de registro de votante también está disponible sin
    costo para cualquier persona que jure bajo juramento que la identificación es
    necesaria para votar en una elección en Georgia.
- id: 55
  category: license_system
  question: ¿Por cuánto tiempo es válida una tarjeta de identificación especial para
    personas con discapacidades temporales?
  choices:
    A: 6 meses
    B: 1 año
    C: 4 años
    D: 8 años
  answer: A
  explanation: También está disponible una tarjeta para personas con discapacidades
    temporales por un período de seis (6) meses a un costo de $5.00.
- id: 56
  category: driver_testing
  question: Si tiene 18 años o más y solicita una licencia de conducir Clase C por
    primera vez, ¿qué debe firmar en una declaración jurada (affidavit)?
  choices:
    A: Que ha completado 30 horas de instrucción en el aula
    B: Que ha completado 40 horas de conducción supervisada en carretera, que incluyen
      6 horas de conducción nocturna
    C: Que ha tenido un permiso de instrucción durante un año
    D: Que es propietario de un vehículo registrado en el estado de Georgia
  answer: B
  explanation: Si tiene al menos 18 años y solicita una licencia de conducir Clase
    C, también debe firmar una declaración jurada afirmando que ha completado 40 horas
    de conducción supervisada en carretera, que incluyen 6 horas de conducción nocturna.
- id: 57
  category: license_system
  question: ¿Bajo qué condición está exento un joven de 17 años de mantener su permiso
    de aprendizaje durante un año y un día?
  choices:
    A: Con prueba de que mantiene un promedio de calificaciones (GPA) de 4.0 en la
      escuela secundaria
    B: Con prueba de que está alistado en las fuerzas armadas
    C: Si aprueba un examen práctico de conducción defensiva avanzada
    D: Si sus padres firman una exención especial
  answer: B
  explanation: Un joven de 17 años estará exento de mantener su permiso de aprendizaje
    durante un año y un día con el comprobante de que está alistado en las fuerzas
    armadas.
- id: 58
  category: license_system
  question: ¿Cuántos días tienen los nuevos residentes de Georgia para solicitar una
    licencia o permiso de conducir de Georgia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según el manual, debe solicitar una licencia o permiso de conducir
    de Georgia dentro de los 30 días posteriores a convertirse en residente de Georgia
    si desea conducir por las autopistas del estado.
- id: 59
  category: license_system
  question: ¿Qué documento debe presentar un veterano para obtener una Licencia de
    Veterano gratuita si no tiene su DD214 original?
  choices:
    A: Un formulario DS-318 de la Guardia Nacional
    B: Un Informe de Vehículos Motorizados certificado
    C: Un Certificado de Elegibilidad (DS-516) del Departamento de Servicios para
      Veteranos del Estado
    D: Una licencia de conducir válida de otro estado
  answer: C
  explanation: El manual establece que si los veteranos no tienen un DD214, deben
    obtener un Certificado de Elegibilidad (DS-516) del Departamento de Servicios
    para Veteranos del Estado.
- id: 60
  category: license_system
  question: ¿Quién es elegible para recibir una Licencia Honoraria de Georgia sin
    costo?
  choices:
    A: Cualquier miembro militar en servicio activo estacionado en Georgia
    B: El cónyuge de un veterano discapacitado, separado honorablemente, que no tiene
      licencia de conducir
    C: Cualquier veterano que haya recibido una baja deshonrosa
    D: Un miembro de las reservas activas que no ha tenido servicio activo
  answer: B
  explanation: Una Licencia Honoraria está disponible para el cónyuge de un veterano
    discapacitado, separado honorablemente, que no tiene licencia de conducir, o para
    el cónyuge sobreviviente no casado de un veterano fallecido separado honorablemente.
- id: 61
  category: license_system
  question: ¿Qué formulario debe presentarse al DDS en cada renovación de una licencia
    de la Guardia Nacional?
  choices:
    A: Formulario DS-516
    B: Un Informe de Vehículo Motorizado (MVR) certificado
    C: Formulario DS-318
    D: Formulario DD214
  answer: C
  explanation: El manual especifica que el formulario DS-318 debe presentarse al DDS
    en cada renovación de una licencia de la Guardia Nacional.
- id: 62
  category: license_system
  question: Si un solicitante de 18 años o más está transfiriendo una licencia válida
    de otro estado a Georgia pero no puede entregar la licencia física, ¿qué debe
    presentar?
  choices:
    A: Un Informe de Vehículo Motorizado (MVR)/Historial de Conducción certificado
      del estado de emisión, con fecha de los últimos 30 días
    B: Un certificado de nacimiento con fecha de los últimos 60 días
    C: Una carta de explicación firmada por un notario
    D: Un pasaporte y una factura de servicios públicos
  answer: A
  explanation: Si no puede entregar una licencia de conducir válida, debe presentar
    un Informe de Vehículo Motorizado (MVR)/Historial de Conducción certificado del
    estado de emisión, con fecha de los últimos 30 días, que demuestre que su estatus
    es válido.
- id: 63
  category: license_system
  question: Al transferir una licencia de otro estado a Georgia, ¿cuántos documentos
    se deben proporcionar para demostrar la residencia en Georgia?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para transferir una licencia de otro estado, el manual requiere que
    proporcione dos documentos para demostrar la residencia en Georgia.
- id: 64
  category: license_system
  question: ¿Cómo puede identificar el sitio web oficial del DDS del estado de Georgia
    para evitar sitios web falsos del DMV?
  choices:
    A: Terminará en .com
    B: Terminará en .org
    C: Terminará en .gov
    D: Terminará en .net
  answer: C
  explanation: El manual advierte sobre sitios falsos que terminan en .com o .org
    y señala que los sitios web oficiales del estado de Georgia tendrán .gov, como
    www.dds.georgia.gov.
- id: 65
  category: driver_testing
  question: ¿Cuál es la hora límite en la que un cliente puede comenzar a realizar
    el examen escrito de conocimientos en un Centro de Servicio al Cliente del DDS?
  choices:
    A: Hasta la hora exacta de cierre
    B: Al menos 15 minutos antes del cierre
    C: Al menos 30 minutos antes del cierre
    D: Al menos 1 hora antes del cierre
  answer: C
  explanation: Para garantizar el tiempo adecuado, los clientes deben comenzar a realizar
    el examen escrito al menos 30 minutos antes del cierre.
- id: 66
  category: driver_testing
  question: ¿En qué idioma se realiza el examen de señales de tránsito (Road Signs)?
  choices:
    A: Inglés y español
    B: Solo inglés
    C: Cualquier idioma solicitado con antelación
    D: Inglés y francés
  answer: B
  explanation: El manual establece que las señales de tránsito y el examen de conducción
    real se realizan únicamente en inglés.
- id: 67
  category: driver_testing
  question: ¿Cuál es la consecuencia si un cliente infringe las reglas del examen,
    como usar un teléfono celular durante el examen de conocimientos?
  choices:
    A: Recibe una advertencia verbal
    B: Debe pagar una tarifa de examen adicional
    C: La sesión del examen se contará como reprobada
    D: Se le prohíbe conducir durante un año
  answer: C
  explanation: Cualquier infracción de las reglas (como usar un teléfono celular)
    se considera mala conducta y, si esta ocurre, la sesión del examen se contará
    como reprobada.
- id: 68
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el examen
    de señales de tránsito (Road Signs)?
  choices:
    A: 10 de 20
    B: 12 de 20
    C: 15 de 20
    D: 20 de 20
  answer: C
  explanation: Durante el examen de señales de tránsito, debe responder correctamente
    15 de 20 preguntas para aprobar.
- id: 69
  category: driver_testing
  question: ¿Cuál de los siguientes artículos está permitido en el área de examen
    durante un examen de conocimientos?
  choices:
    A: Teléfonos celulares
    B: Bolígrafos y lápices
    C: Dispositivos de mensajería de texto
    D: Ninguno de los anteriores
  answer: D
  explanation: El manual establece que no se pueden llevar bolígrafos, lápices, papel,
    teléfonos celulares, dispositivos de mensajería de texto u otros dispositivos
    inalámbricos al área de examen.
- id: 70
  category: license_system
  question: ¿Qué debe presentar el cónyuge sobreviviente no divorciado de un veterano
    fallecido con baja honorable para obtener un Certificado de Elegibilidad para
    una Licencia Honoraria?
  choices:
    A: Un formulario DS-318
    B: El certificado de defunción junto con el DD-214
    C: Un Informe de Vehículo Motorizado (MVR) certificado
    D: Una licencia de conducir válida de otro estado
  answer: B
  explanation: Para el cónyuge sobreviviente no divorciado, se debe presentar el certificado
    de defunción junto con el DD-214 al Departamento de Servicios para Veteranos del
    Estado para obtener un Certificado de Elegibilidad.
- id: 71
  category: license_system
  question: ¿Qué requisitos adicionales debe cumplir un conductor menor de 18 años
    antes de transferir una licencia válida de otro estado a Georgia?
  choices:
    A: Entrega de un pasaporte extranjero
    B: Registro escolar, educación vial y ADAP
    C: Una carta de recomendación de su escuela anterior
    D: Un registro de conducción de 50 horas firmado por un oficial de policía
  answer: B
  explanation: Se requieren todos los requisitos de Georgia, incluyendo el registro
    escolar, la educación vial y el programa ADAP, antes de que se pueda transferir
    la licencia de otro estado para alguien menor de 18 años.
- id: 72
  category: driver_testing
  question: ¿Cómo puede realizar el examen de habilidades de conducción (Road Skills
    Test)?
  choices:
    A: Presentándose sin cita los martes
    B: Solo mediante cita previa
    C: Enviando una solicitud en papel por correo
    D: En cualquier momento durante el horario comercial normal
  answer: B
  explanation: El examen de habilidades de conducción se administra solo mediante
    cita previa para maximizar los recursos y atender a los clientes de manera más
    eficiente.
- id: 73
  category: vehicle_information
  question: ¿Se le permite utilizar un vehículo equipado con sistemas avanzados de
    asistencia al conductor para su examen de conducción?
  choices:
    A: No, estos vehículos están estrictamente prohibidos.
    B: Sí, pero debe demostrar la capacidad de operar el vehículo sin dicha tecnología.
    C: Sí, y se le anima a confiar plenamente en la tecnología.
    D: Solo si realiza el examen para una licencia comercial.
  answer: B
  explanation: Los conductores pueden realizar el examen de habilidades en vehículos
    equipados con tecnología avanzada de asistencia al conductor. Sin embargo, el
    solicitante debe demostrar su capacidad para operar el vehículo sin dicha tecnología.
- id: 74
  category: safe_driving_rules
  question: Durante la parte de estacionamiento en paralelo del examen de conducción,
    ¿qué tan cerca debe estar su automóvil de la acera (curb)?
  choices:
    A: No más de 12 pulgadas
    B: No más de 18 pulgadas
    C: No más de 24 pulgadas
    D: Tocando la acera
  answer: B
  explanation: Debe estacionarse en medio de dos postes de manera que su automóvil
    no esté a más de 18 pulgadas de la acera.
- id: 75
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima que debe utilizar al realizar la maniobra
    de retroceso en línea recta en el examen de conducción?
  choices:
    A: 5 millas por hora
    B: 10 millas por hora
    C: 15 millas por hora
    D: 20 millas por hora
  answer: B
  explanation: Debe retroceder su automóvil por una distancia de aproximadamente 50
    pies a una velocidad lenta (no más de 10 millas por hora).
- id: 76
  category: driver_testing
  question: ¿Quién debe actuar como pasajero en el vehículo de prueba durante un examen
    de conducción virtual (Virtual Road Test)?
  choices:
    A: Un examinador del DDS
    B: Cualquier conductor con licencia mayor de 18 años
    C: Un padre, tutor u otro adulto responsable de 21 años o más con una licencia
      de conducir válida
    D: No se permite ningún pasajero durante un examen virtual
  answer: C
  explanation: Durante un examen de conducción virtual, un padre, tutor u otro adulto
    responsable de 21 años o más debe actuar como pasajero en el vehículo de prueba.
    Deben tener una licencia de conducir válida.
- id: 77
  category: driver_testing
  question: ¿Cuál es la puntuación mínima requerida para aprobar el examen de conducción
    de Clase C o D?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: B
  explanation: Debe alcanzar una puntuación mínima del 75% para aprobar el examen
    de conducción de Clase C/D.
- id: 78
  category: driver_testing
  question: Si reprueba cualquier parte del examen de conocimientos o de conducción
    de Clase C o D por segunda vez, ¿cuánto tiempo debe esperar antes de volver a
    realizarlo?
  choices:
    A: Hasta el día siguiente
    B: 3 días
    C: 7 días
    D: 14 días
  answer: C
  explanation: En caso de una segunda falla o fallas posteriores, debe esperar 7 días
    antes de volver a realizar la parte que reprobó.
- id: 79
  category: driver_testing
  question: ¿Bajo qué condiciones climáticas NO se realizará un examen de conducción
    de motocicleta (Clase M)?
  choices:
    A: Cuando esté nublado
    B: Cuando la temperatura sea inferior a 50 grados
    C: Cuando esté lloviendo o el pavimento esté húmedo
    D: Cuando la velocidad del viento supere las 10 mph
  answer: C
  explanation: Los exámenes de conducción de motocicletas no pueden realizarse cuando
    las condiciones climáticas los hacen inseguros para el conductor o el examinador,
    incluso cuando está lloviendo o cuando el pavimento está húmedo.
- id: 80
  category: license_system
  question: ¿Qué examen de conducción se requiere para obtener una licencia no comercial
    de Clase E o F?
  choices:
    A: Un examen de conducción tradicional en un vehículo comercial
    B: Solo un examen de conducción virtual
    C: Un examen de habilidades en circuito cerrado
    D: No hay examen de conducción para las Clases E y F no comerciales
  answer: D
  explanation: No hay examen de conducción para las Clases E y F no comerciales; sin
    embargo, debe presentar una solicitud, establecer su capacidad para operar los
    vehículos y aprobar un examen de conocimientos.
- id: 81
  category: driver_testing
  question: Si decide realizar su examen de conducción en un vehículo de alquiler,
    ¿cuál de las siguientes condiciones debe cumplirse?
  choices:
    A: Debe figurar como conductor en el contrato de alquiler.
    B: El vehículo de alquiler debe tener transmisión manual.
    C: Debe alquilar el vehículo por al menos 7 días.
    D: El vehículo de alquiler debe tener una placa temporal de concesionario.
  answer: A
  explanation: Para utilizar un vehículo de alquiler, debe presentar una copia del
    contrato de alquiler, figurar como conductor en dicho contrato y presentar un
    comprobante de seguro válido para el vehículo.
- id: 82
  category: safe_driving_rules
  question: Durante el examen de conducción, ¿cómo debe mantener una buena postura?
  choices:
    A: Apoye el codo en la ventana para mantenerse relajado.
    B: Mantenga ambas manos en el volante.
    C: Mantenga una mano en el volante y la otra en la palanca de cambios.
    D: Inclínese hacia atrás y converse con el examinador.
  answer: B
  explanation: Mantener una buena postura significa tener ambas manos en el volante.
    No apoye el codo en la ventana y no intente entablar una conversación con el examinador.
- id: 83
  category: driver_testing
  question: Según el manual, ¿cuál es el mejor momento para visitar un Centro de Servicio
    al Cliente del DDS en persona?
  choices:
    A: El martes por la mañana
    B: El lunes por la tarde
    C: A mitad de semana durante el mediodía
    D: El viernes justo antes del cierre
  answer: C
  explanation: Recuerde que el martes es siempre el día más concurrido y el mejor
    momento para visitarlo en persona es a mitad de semana durante el mediodía.
- id: 84
  category: license_system
  question: ¿Cuánto cuesta una licencia no comercial Clase E o F para bomberos voluntarios?
  choices:
    A: $10
    B: $25
    C: $50
    D: No tiene costo
  answer: D
  explanation: Las licencias Clase E y F están disponibles para los bomberos voluntarios
    sin costo alguno.
- id: 85
  category: driver_testing
  question: Si reprueba el examen de conocimientos de Clase C o D por primera vez,
    ¿cuándo puede volver a realizarlo?
  choices:
    A: Inmediatamente
    B: Al día siguiente
    C: Después de 3 días
    D: Después de 7 días
  answer: B
  explanation: 'Si es su primer reprobado: debe esperar hasta el día siguiente antes
    de volver a realizar la parte que reprobó.'
- id: 86
  category: license_system
  question: ¿Cuál de los siguientes grupos es elegible para renovar su licencia de
    conducir de Georgia por correo?
  choices:
    A: Cualquier persona que viva actualmente en el estado de Georgia
    B: Estudiantes de tiempo completo que asisten a la escuela fuera de Georgia
    C: Conductores cuya licencia ha estado vencida por 3 años
    D: Clientes que necesitan cambiar su nombre legal
  answer: B
  explanation: Según el manual, la renovación por correo está disponible para estudiantes
    de tiempo completo que asisten a la escuela fuera de Georgia, su cónyuge y cualquier
    dependiente que viva con ellos.
- id: 87
  category: license_system
  question: ¿Una licencia de conducir no puede renovarse por correo si ha estado vencida
    por al menos cuántos años?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: B
  explanation: El manual establece que una licencia de conducir que ha estado vencida
    por dos (2) años o más no puede renovarse por correo.
- id: 88
  category: license_system
  question: ¿Cuál es una restricción para los clientes que eligen renovar su licencia
    de conducir por correo?
  choices:
    A: No recibirán una identificación Real ID.
    B: Deben pagar el doble de la tarifa de renovación estándar.
    C: Solo recibirán una licencia de 4 años.
    D: Deben realizar un examen escrito al regresar a Georgia.
  answer: A
  explanation: 'El manual establece explícitamente: "Los clientes que elijan renovar
    su licencia de esta manera no recibirán una RealDL/ID".'
- id: 89
  category: license_system
  question: ¿Qué sucederá si su número de licencia de conducir actual es idéntico
    a su número de Seguro Social durante el proceso de renovación?
  choices:
    A: Debe solicitar un nuevo número de Seguro Social.
    B: Se asignará a su documento un número de documento generado aleatoriamente.
    C: Se le pedirá que mantenga el mismo número.
    D: Su licencia será suspendida temporalmente.
  answer: B
  explanation: No se pueden emitir licencias con un número de Seguro Social como número
    de documento. Si son idénticos, se asignará un número de documento generado aleatoriamente
    durante el proceso de emisión o renovación.
- id: 90
  category: driver_responsibility
  question: Si opta por registrarse para votar a través del DDS, ¿con quién debe comunicarse
    si no recibe su tarjeta de registro de votante en un plazo de 30 días?
  choices:
    A: El Departamento de Servicios al Conductor (DDS)
    B: La Patrulla Estatal de Georgia
    C: La oficina de registro de votantes de su condado
    D: La comisión electoral federal
  answer: C
  explanation: 'El manual aconseja: "Si no recibe su tarjeta de registro de votante
    en un plazo de 30 días, comuníquese con la oficina de registro de votantes de
    su condado para determinar el estado de su solicitud".'
- id: 91
  category: license_system
  question: ¿Cuál es el costo para reemplazar una licencia de conducir perdida o robada
    en línea o en un Centro de Servicio al Cliente del DDS?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: B
  explanation: El manual establece que el costo en línea y en un Centro de Servicio
    al Cliente del DDS para un reemplazo de la licencia de conducir es de $10.00.
- id: 92
  category: license_system
  question: ¿Qué documento se requiere si desea cambiar el número de la licencia de
    conducir en su tarjeta de reemplazo porque fue robada?
  choices:
    A: Un certificado de nacimiento certificado
    B: Un informe policial que indique que la licencia fue robada
    C: Una carta de su compañía de seguros de automóviles
    D: Una copia certificada de su historial de conducción
  answer: B
  explanation: Para cambiar el número en su licencia de conducir de reemplazo de Georgia,
    se le requerirá presentar un informe policial que indique que la licencia fue
    robada (a menos que su número de licencia y su SSN sean el mismo).
- id: 93
  category: driver_responsibility
  question: ¿Cuántos días tiene para actualizar su dirección ante el DDS después de
    haberse mudado?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: 'El manual establece: "Si se ha mudado, debe visitar un Centro de Servicio
    al Cliente del DDS dentro de los 60 días para actualizar su dirección postal y/o
    residencial..."'
- id: 94
  category: driver_responsibility
  question: ¿Por qué es importante actualizar su dirección directamente con el DDS
    cuando se muda?
  choices:
    A: El Servicio Postal de los EE. UU. no reenviará la correspondencia del DDS a
      las nuevas direcciones.
    B: Su licencia será revocada inmediatamente si no lo hace.
    C: Se le cobrará una multa diaria hasta que se actualice.
    D: El registro de su vehículo se cancelará automáticamente.
  answer: A
  explanation: 'El manual señala: "La correspondencia del DDS no será reenviada a
    nuevas direcciones por el Servicio Postal de los EE. UU."'
- id: 95
  category: license_system
  question: Si cambia su nombre por matrimonio u otra acción legal, ¿dentro de cuántos
    días debe obtener una nueva licencia que muestre el nombre correcto?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 120 días
  answer: C
  explanation: Según el manual, "Si cambia su nombre por matrimonio u otra acción
    legal, debe obtener una nueva licencia que muestre el nombre correcto dentro de
    los 60 días".
- id: 96
  category: license_system
  question: ¿Cuál es el costo de una licencia de reemplazo por un cambio de nombre
    si es la primera vez durante el periodo de vigencia de la licencia actual?
  choices:
    A: $5.00
    B: $10.00
    C: $20.00
    D: Es gratuita
  answer: D
  explanation: 'El manual establece: "Se emitirá una licencia de reemplazo gratuita
    válida por el periodo actual una vez en un periodo de vigencia de la licencia"
    por un cambio de nombre.'
- id: 97
  category: license_system
  question: ¿Cuánto cuesta un Informe de Vehículos Motorizados (MVR) de 7 años?
  choices:
    A: $6.00
    B: $8.00
    C: $10.00
    D: $12.00
  answer: B
  explanation: 'El manual especifica las tarifas para los MVR: "Un informe de 3 años
    cuesta $6.00; un informe de 7 años cuesta $8.00. Un informe de por vida cuesta
    $8.00".'
- id: 98
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la obtención
    de un Informe de Vehículos Motorizados (MVR) en línea frente a uno en persona?
  choices:
    A: Los MVR en línea son certificados, mientras que los MVR en persona no son certificados.
    B: Los MVR en línea no son certificados, mientras que los MVR en persona son certificados.
    C: Tanto los MVR en línea como en persona son certificados.
    D: Tanto los MVR en línea como en persona no son certificados.
  answer: B
  explanation: El manual establece que una "copia no certificada de su Informe de
    Vehículos Motorizados (MVR) se puede descargar utilizando los Servicios en Línea
    del DDS", mientras que una "copia certificada... se puede comprar en persona en
    cualquier Centro de Servicio al Cliente del DDS".
- id: 99
  category: license_system
  question: ¿Qué se requiere para obtener en persona un Informe de Vehículos Motorizados
    (MVR) de otra persona?
  choices:
    A: Un acuerdo verbal del titular de la licencia
    B: Un formulario de Solicitud de MVR (DDS-18) completado por el titular de la
      licencia autorizándole a recibirlo
    C: El certificado de nacimiento original del titular de la licencia
    D: Una orden judicial firmada por un juez
  answer: B
  explanation: Si se obtiene un informe que no sea el suyo, necesita la "finalización
    del formulario de Solicitud de MVR (DDS-18) por parte del titular de la licencia
    nombrando a la persona autorizada para recibir el registro..."
- id: 100
  category: license_system
  question: Si no tiene un documento de la lista principal (como un certificado de
    nacimiento o pasaporte de los EE. UU.), ¿cuántos documentos de la lista secundaria
    (como una tarjeta de Seguro Social o una tarjeta de registro de votante) debe
    proporcionar para reemplazar una licencia perdida?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: El manual enumera las pruebas de identidad aceptables como UN documento
    de la primera lista (Certificado de Nacimiento, Pasaporte, etc.) o DOS documentos
    de la segunda lista (Tarjeta de Seguro Social, Tarjeta de Registro de Votante,
    etc.) al reemplazar una licencia.
- id: 101
  category: license_system
  question: ¿Cuál de las siguientes es una forma de pago aceptable al solicitar un
    informe de historial de conducción (MVR) por correo?
  choices:
    A: Efectivo
    B: Tarjeta de crédito
    C: Giro postal (money order)
    D: Criptomoneda
  answer: C
  explanation: Al solicitar un MVR por correo, debe incluir un giro postal (money
    order), un cheque de caja o un cheque personal a nombre del Departamento de Servicios
    al Conductor (Department of Driver Services).
- id: 102
  category: license_system
  question: Al momento de realizar cualquier trámite de licencia o tarjeta de identificación,
    ¿a qué grupo está obligado el Departamento de Servicios al Conductor a preguntar
    si se han registrado en el Sistema de Servicio Selectivo de los EE. UU.?
  choices:
    A: Todos los solicitantes de 16 años o más
    B: Hombres de 18 años
    C: Mujeres de 18 años
    D: Todos los solicitantes de 21 años
  answer: B
  explanation: El DDS está obligado a preguntar a los hombres de 18 años si se han
    registrado en el Sistema de Servicio Selectivo de los EE. UU. y a informar las
    respuestas.
- id: 103
  category: license_system
  question: 'Al obtener su licencia de conducir, tiene la oportunidad de realizar
    una donación voluntaria al Programa de Educación, Detección y Tratamiento de la
    Ceguera de Georgia por un monto de:'
  choices:
    A: $1
    B: $2
    C: $5
    D: $10
  answer: A
  explanation: Cuando obtenga su licencia de conducir, permiso o identificación, tendrá
    la oportunidad de realizar una donación voluntaria de $1 al Programa de Educación,
    Detección y Tratamiento de la Ceguera de Georgia.
- id: 104
  category: driver_responsibility
  question: ¿Qué establece la ley de Georgia con respecto al médico que declara la
    muerte de un paciente y la donación de órganos?
  choices:
    A: El médico debe realizar la extracción de los órganos.
    B: Se prohíbe al médico participar en la extracción o el trasplante de los órganos
      donados.
    C: El médico debe notificar a la familia del donante sobre los costos.
    D: El médico decide quién recibe los órganos donados.
  answer: B
  explanation: La ley de Georgia prohíbe que el médico que declara la muerte de un
    paciente participe en la extracción o el trasplante de los órganos o tejidos donados
    de ese paciente.
- id: 105
  category: driver_responsibility
  question: ¿Cuál es el costo para la familia de un donante por los gastos relacionados
    con la donación de órganos, tejidos u ojos?
  choices:
    A: Una tarifa fija de $500
    B: El costo de la extracción quirúrgica
    C: No hay costo para la familia del donante
    D: La familia paga solo si los órganos se trasplantan con éxito
  answer: C
  explanation: No hay costo para la familia del donante por ningún gasto relacionado
    con la donación de órganos, tejidos u ojos.
- id: 106
  category: driver_responsibility
  question: ¿Cuál de los siguientes factores NO se utiliza para seleccionar a los
    receptores de donación de órganos?
  choices:
    A: Urgencia de la necesidad
    B: Compatibilidad del tipo de sangre
    C: Raza o credo
    D: Tamaño corporal y tipo de tejido
  answer: C
  explanation: Los receptores se seleccionan por la urgencia de la necesidad, la compatibilidad
    del tipo de sangre, el tamaño corporal y el tipo de tejido, independientemente
    del sexo, la raza o el credo.
- id: 107
  category: license_system
  question: 'Una contribución voluntaria a la Autoridad de Finanzas Estudiantiles
    de Georgia (GSFA) ayuda a proporcionar asistencia financiera para la educación
    postsecundaria a los hijos de:'
  choices:
    A: Todos los residentes de Georgia
    B: Los mejores estudiantes de secundaria (valedictorians)
    C: Oficiales de la ley y socorristas permanentemente discapacitados o fallecidos
      en el cumplimiento de su deber
    D: Estudiantes que cursan carreras de medicina
  answer: C
  explanation: La donación a la GSFA ayuda a proporcionar asistencia financiera para
    los costos de educación postsecundaria de los hijos de oficiales de la ley, bomberos,
    paramédicos, etc., que quedaron permanentemente discapacitados o fallecieron en
    el cumplimiento de su deber.
- id: 108
  category: safe_driving_rules
  question: Si un oficial de la ley está dirigiendo el tráfico en una intersección
    y le indica que avance a pesar de que el semáforo está en rojo, ¿qué debe hacer?
  choices:
    A: Espere a que la luz cambie a verde antes de avanzar.
    B: Obedezca las instrucciones del oficial y avance.
    C: Deténgase y pídale al oficial su número de placa.
    D: Dé la vuelta y busque otra ruta.
  answer: B
  explanation: Una de las leyes de tránsito más básicas exige que los conductores
    obedezcan las instrucciones de tránsito de un oficial de la ley o un bombero,
    incluso si van en contra de lo que indican los dispositivos de control de tráfico.
- id: 109
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias se le permite conducir en una carretera que ha
    sido cerrada por construcción o por un evento especial?
  choices:
    A: Cuando llega tarde al trabajo.
    B: Cuando no hay trabajadores de construcción visibles.
    C: Cuando conduce un vehículo de tracción en las cuatro ruedas.
    D: Nunca.
  answer: D
  explanation: Una de las tres leyes de tránsito más básicas exige que los conductores
    nunca conduzcan por una carretera que haya sido cerrada por construcción, para
    un evento especial o por cualquier otro motivo oficial.
- id: 110
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un principio clave con respecto al derecho
    de paso según la ley de Georgia?
  choices:
    A: El derecho de paso es algo que se toma, no que se da.
    B: El derecho de paso es algo que se da, no que se toma.
    C: El vehículo más grande siempre tiene el derecho de paso.
    D: Las reglas de derecho de paso solo se aplican a los vehículos motorizados,
      no a los ciclistas.
  answer: B
  explanation: Los conductores de vehículos (incluidos los ciclistas) y los peatones
    siempre deben comprender las reglas relacionadas con el derecho de paso y recordar
    que el derecho de paso es algo que se da, no que se toma.
- id: 111
  category: defensive_driving
  question: ¿Qué debe hacer si tiene el derecho de paso legal, pero otro conductor
    no se da cuenta y no le cede el paso?
  choices:
    A: Mantener su velocidad y obligarlos a detenerse.
    B: Tocar la bocina y continuar sin reducir la velocidad.
    C: Ceder el derecho de paso para evitar un choque.
    D: Virar bruscamente hacia el carril contrario para esquivarlos.
  answer: C
  explanation: Puede haber casos en los que usted tenga el derecho de paso legal sobre
    alguien que no está respetando las normas de tránsito. En esos casos, se debe
    ceder el derecho de paso para evitar un choque.
- id: 112
  category: safe_driving_rules
  question: Si se encuentra ante una señal de alto en una intersección y el tráfico
    transversal no tiene una señal de alto, ¿cuándo puede avanzar?
  choices:
    A: Inmediatamente después de detenerse por completo.
    B: Solo después de detenerse y ceder el derecho de paso a cualquier vehículo o
      peatón que esté en la intersección o cerca de ella.
    C: Tan pronto como el vehículo detrás de usted toque la bocina.
    D: Después de esperar exactamente tres segundos, independientemente del tráfico.
  answer: B
  explanation: Si usted se enfrenta a una señal de alto, pero el resto del tráfico
    no, puede avanzar solo después de detenerse y ceder el derecho de paso a cualquier
    otro vehículo o peatón que esté en la intersección, o tan cerca de ella que resulte
    peligroso.
- id: 113
  category: safe_driving_rules
  question: En una intersección sin señales de alto, señales de ceda el paso o semáforos,
    ¿qué debe suceder si dos vehículos llegan al mismo tiempo?
  choices:
    A: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    B: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    C: El vehículo que viaja más rápido tiene el derecho de paso.
    D: Ambos vehículos deben detenerse y esperar a que llegue un tercer vehículo.
  answer: A
  explanation: En las intersecciones donde no hay señales de alto, señales de ceda
    el paso u otros semáforos, si dos vehículos llegan a la intersección al mismo
    tiempo, el conductor del vehículo de la izquierda debe ceder el paso al conductor
    del vehículo de la derecha.
- id: 114
  category: sharing_the_road
  question: En una intersección de cuatro vías donde todos los conductores tienen
    señales de alto, ¿a quién deben ceder el paso todos los conductores?
  choices:
    A: Al vehículo más grande en la intersección.
    B: A los vehículos que giran a la izquierda.
    C: A los peatones.
    D: A los vehículos que llegaron al último.
  answer: C
  explanation: En una intersección de cuatro vías donde todos los conductores tienen
    señales de alto, todos los conductores deben ceder el paso a los peatones.
- id: 115
  category: safe_driving_rules
  question: ¿Qué debe hacer si usted y otro vehículo llegan a una intersección sin
    señales de alto ni semáforos exactamente al mismo tiempo?
  choices:
    A: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda.
    B: El vehículo de la izquierda debe ceder el paso al conductor del vehículo de
      la derecha.
    C: El vehículo que circula recto tiene el derecho de paso.
    D: El vehículo más rápido tiene el derecho de paso.
  answer: B
  explanation: Según el manual, en las intersecciones sin señales de alto ni semáforos,
    si dos vehículos llegan al mismo tiempo, el conductor del vehículo de la izquierda
    debe ceder el paso al conductor del vehículo de la derecha.
- id: 116
  category: defensive_driving
  question: ¿Cuál es la acción preferible si el tráfico de otra vía se está incorporando
    al carril por el que usted circula?
  choices:
    A: Acelerar para rebasar rápidamente al tráfico que se incorpora.
    B: Detener su vehículo por completo para dejarlos entrar.
    C: Cambiar de carril de manera segura alejándose del tráfico que se incorpora,
      si es posible.
    D: Tocar la bocina para advertirles que cedan el paso.
  answer: C
  explanation: El manual aconseja que si el tráfico de otra vía se está incorporando
    a la carretera por la que usted circula, debe cambiar de carril de manera segura
    alejándose del tráfico que se incorpora, si es posible.
- id: 117
  category: safe_driving_rules
  question: ¿Cómo debe reaccionar cuando se aproxima un vehículo de emergencia con
    luces intermitentes y sirenas?
  choices:
    A: Acelerar y mantenerse por delante del vehículo de emergencia.
    B: Moverse al carril izquierdo y reducir la velocidad.
    C: Detenerse inmediatamente en su carril actual.
    D: Moverse al acotamiento o lo más a la derecha posible de la calzada y detenerse.
  answer: D
  explanation: Si los vehículos de emergencia utilizan sus luces de emergencia y sirenas,
    usted debe maniobrar su vehículo de manera segura para despejar el camino, moviéndose
    hacia el acotamiento de la carretera, o lo más a la derecha posible, y detenerse.
- id: 118
  category: signs_and_signals
  question: Al realizar un giro a la derecha con luz roja, ¿qué debe hacer antes de
    continuar?
  choices:
    A: Reducir la velocidad a 5 mph y continuar si está despejado.
    B: Hacer una parada completa y ceder el paso a todo el tráfico y a los peatones.
    C: Tocar la bocina y continuar sin detenerse.
    D: Esperar a que la luz cambie a verde.
  answer: B
  explanation: A menos que una señal lo prohíba, puede girar a la derecha en rojo
    solo después de hacer una parada completa, ceder el paso a todo el tráfico y a
    los peatones, y determinar que es seguro.
- id: 119
  category: safe_driving_rules
  question: ¿Bajo qué condición es legal girar a la izquierda con luz roja?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    B: Al girar desde el carril izquierdo de una calle de un solo sentido hacia otra
      calle de un solo sentido con circulación hacia la izquierda.
    C: Al girar desde una calle de un solo sentido hacia una calle de doble sentido.
    D: Nunca es legal girar a la izquierda con luz roja.
  answer: B
  explanation: Se permite girar a la izquierda en rojo desde el carril izquierdo de
    una calle de un solo sentido hacia otra calle de un solo sentido en la que el
    tráfico se mueve hacia la izquierda del conductor, después de hacer una parada
    completa y ceder el paso.
- id: 120
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar con luces
    rojas intermitentes y señales de alto extendidas?
  choices:
    A: Cuando circula por una carretera de dos carriles.
    B: Cuando circula por el lado opuesto de una autopista dividida por una mediana.
    C: Cuando se encuentra en una zona escolar designada.
    D: Cuando circula en la misma dirección que el autobús.
  answer: B
  explanation: En una autopista dividida por una mediana, los automóviles que circulan
    por el lado opuesto al autobús escolar detenido no están obligados a detenerse.
- id: 121
  category: safe_driving_rules
  question: Al rebasar en una carretera de dos carriles, ¿a cuántos pies de distancia
    del tráfico en sentido contrario debe regresar al carril derecho?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Debe tener suficiente tiempo y espacio para regresar su vehículo completamente
    al carril derecho antes de que el tráfico en sentido contrario esté a menos de
    200 pies de su vehículo.
- id: 122
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones está prohibido rebasar en una carretera
    de dos carriles?
  choices:
    A: A menos de 100 pies de un cruce de ferrocarril o puente.
    B: Cuando el vehículo de adelante viaja por debajo del límite de velocidad.
    C: En una carretera recta con una línea amarilla discontinua.
    D: Cuando se encuentra a menos de 500 pies de una intersección.
  answer: A
  explanation: Está prohibido rebasar en carreteras de dos carriles a menos de 100
    pies de un cruce de ferrocarril, puente, viaducto o túnel.
- id: 123
  category: safe_driving_rules
  question: ¿Cuándo es permitido rebasar a otro vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante conduce demasiado lento.
    B: Cuando el vehículo de adelante está girando a la izquierda y hay suficiente
      ancho de pavimento.
    C: Conduciendo por el acotamiento (hombro) no pavimentado de la carretera.
    D: Cuando se encuentra en una zona escolar.
  answer: B
  explanation: Puede rebasar por la derecha a otro vehículo que esté girando o esté
    a punto de girar a la izquierda si hay suficiente ancho de pavimento tanto para
    su vehículo como para el vehículo que gira a la izquierda.
- id: 124
  category: safe_driving_rules
  question: Según la ley 'Move Over' (Hacerse a un lado) de Georgia, ¿qué debe hacer
    si no puede cambiarse de carril de manera segura al acercarse a un vehículo de
    emergencia estacionado en el acotamiento?
  choices:
    A: Mantener su velocidad y tocar la bocina.
    B: Detenerse inmediatamente en su carril.
    C: Reducir la velocidad por debajo del límite de velocidad y estar preparado para
      detenerse.
    D: Acelerar para rebasar el vehículo rápidamente.
  answer: C
  explanation: La ley 'Move Over' exige que los automovilistas se cambien al siguiente
    carril si es posible hacerlo de manera segura. Si no puede cambiarse de carril,
    reduzca la velocidad por debajo del límite de velocidad y esté preparado para
    detenerse.
- id: 125
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera infracción de la ley 'Move Over'?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Las infracciones de la ley 'Move Over' pueden resultar en una multa
    de no más de $500 por la primera ofensa.
- id: 126
  category: defensive_driving
  question: ¿Qué se considera una acción cortés cuando otro conductor está alcanzando
    y rebasando su vehículo?
  choices:
    A: Aumentar la velocidad para evitar que lo rebasen.
    B: Moverse a la izquierda para bloquear su camino.
    C: Reducir su velocidad ligeramente para facilitarle la maniobra.
    D: Encender y apagar las luces altas hacia ellos.
  answer: C
  explanation: Cuando un conductor detrás de usted está rebasando su vehículo, se
    considera cortés reducir ligeramente la velocidad, facilitándole el paso.
- id: 127
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de entrar a una carretera desde un callejón o camino
    privado?
  choices:
    A: Ceder el paso solo a los vehículos que se aproximan por la izquierda.
    B: Detenerse y ceder el derecho de paso a todos los peatones y vehículos que ya
      se encuentren en la calzada o acera.
    C: Tocar la bocina y continuar sin detenerse.
    D: Acelerar rápidamente para incorporarse al tráfico.
  answer: B
  explanation: Si está a punto de entrar o cruzar una carretera desde un callejón,
    camino privado o carretera, debe detenerse y ceder el derecho de paso a todos
    los demás peatones y vehículos que ya circulan por la calzada o la acera.
- id: 128
  category: signs_and_signals
  question: Si tiene luz verde en una intersección, pero la intersección aún no está
    despejada de tráfico, ¿qué debe hacer?
  choices:
    A: Entrar en la intersección para reclamar su derecho de paso.
    B: Tocar la bocina hasta que la intersección se despeje.
    C: Esperar hasta que la intersección esté despejada de tráfico antes de entrar.
    D: Girar a la derecha en lugar de seguir recto.
  answer: C
  explanation: En las intersecciones con semáforos, espere hasta que la intersección
    esté despejada de tráfico o de tráfico que se aproxima antes de entrar. No avance
    'solo porque' tiene la luz verde.
- id: 129
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar las reglas para rebasar una bicicleta?
  choices:
    A: Una advertencia por la primera infracción
    B: Un delito menor punible con una multa de hasta $250.00
    C: Un delito grave punible con una multa de hasta $500.00
    D: Una suspensión automática de la licencia por 6 meses
  answer: B
  explanation: Según el manual, violar las reglas para rebasar una bicicleta es un
    delito menor punible con una multa de hasta $250.00.
- id: 130
  category: sharing_the_road
  question: Si no puede cambiarse a un carril no adyacente al rebasar una bicicleta,
    ¿qué debe hacer?
  choices:
    A: Tocar la bocina y mantener su velocidad actual
    B: Reducir la velocidad a al menos 10 mph menos que el límite de velocidad o a
      25 mph (lo que sea mayor) y dejar al menos tres pies de distancia
    C: Detenerse y esperar a que el ciclista se mueva al acotamiento
    D: Acelerar para rebasar la bicicleta lo más rápido posible
  answer: B
  explanation: Si un cambio de carril es imposible o inseguro, debe reducir su velocidad
    a al menos 10 mph menos que el límite de velocidad establecido o a 25 mph, lo
    que sea mayor, y proceder con al menos tres pies de distancia entre su vehículo
    y la bicicleta.
- id: 131
  category: safe_driving_rules
  question: 'Cuando un conductor detrás de usted está adelantando a su vehículo, es
    ilegal:'
  choices:
    A: Reducir su velocidad ligeramente
    B: Mantener su posición actual en el carril
    C: Aumentar su velocidad antes de que lo hayan adelantado por completo
    D: Revisar sus espejos retrovisores
  answer: C
  explanation: El manual establece que es ilegal aumentar su velocidad antes de que
    el vehículo que lo adelanta lo haya pasado por completo.
- id: 132
  category: sharing_the_road
  question: 'Al adelantar a un motociclista, un conductor debe:'
  choices:
    A: Compartir el mismo carril con el motociclista para ahorrar espacio
    B: Adelantar en un carril adyacente
    C: Tocar la bocina para advertir al motociclista antes de adelantar en el mismo
      carril
    D: Adelantar por el arcén derecho de la carretera
  answer: B
  explanation: Un motociclista ocupa legalmente todo el ancho de un solo carril. Al
    adelantar a un motociclista, un conductor debe hacerlo en un carril adyacente
    y no se le permite ocupar el mismo carril.
- id: 133
  category: safe_driving_rules
  question: ¿Es legal encender las luces direccionales como cortesía o señal de 'puede
    pasar' a los conductores que vienen detrás?
  choices:
    A: Sí, se considera una conducción cortés
    B: Sí, pero solo en autopistas de varios carriles
    C: No, es contra la ley
    D: No, a menos que esté lloviendo o haya niebla
  answer: C
  explanation: El manual establece explícitamente bajo 'Señales Ilegales' que es contra
    la ley encender las luces direccionales como cortesía o señal de 'puede pasar'
    a otros conductores en la parte trasera.
- id: 134
  category: vehicle_information
  question: 'Al prepararse para girar a la izquierda, debe mantener las ruedas:'
  choices:
    A: Giradas ligeramente hacia la izquierda
    B: Giradas ligeramente hacia la derecha
    C: Rectas hasta que comience a realizar el giro
    D: Giradas hacia el bordillo
  answer: C
  explanation: Al realizar un giro a la izquierda, el manual instruye a los conductores
    a mantener las ruedas rectas hasta que comiencen a realizar el giro.
- id: 135
  category: safe_driving_rules
  question: 'Una vez que haya entrado en una intersección para girar a la izquierda,
    no puede:'
  choices:
    A: Cambiar de carril en la intersección
    B: Completar el giro si la luz cambia a amarillo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Girar hacia el carril más cercano a la línea central
  answer: A
  explanation: El manual establece que una vez que haya entrado en una intersección
    para girar a la izquierda, no puede cambiar de carril en la intersección.
- id: 136
  category: safe_driving_rules
  question: Si su vehículo queda averiado en una autopista, debe hacer todo esfuerzo
    práctico para estacionarse fuera de la carretera, dejando una vista despejada
    de su vehículo por ¿cuántos pies en cada dirección?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Si un vehículo queda averiado, debe estacionarse fuera de la autopista,
    dejando paso libre y una vista despejada de su vehículo por 200 pies en cada dirección.
- id: 137
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones se permite detenerse, pararse
    o estacionarse en CUALQUIER momento?
  choices:
    A: En un paso de peatones
    B: Dentro de una intersección
    C: En un puente o paso elevado
    D: Ninguna de las anteriores
  answer: D
  explanation: No se permite detenerse, pararse o estacionarse en ningún momento en
    un paso de peatones, dentro de una intersección o sobre un puente o paso elevado.
- id: 138
  category: safe_driving_rules
  question: Se le permite detenerse momentáneamente para recoger o dejar pasajeros
    a ¿cuántos pies de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: Detenerse, pararse o estacionarse se permite solo momentáneamente para
    recoger o dejar pasajeros a menos de 15 pies de un hidrante de incendios.
- id: 139
  category: vehicle_information
  question: Al intentar estacionarse en paralelo, ¿a qué distancia debe estar del
    otro automóvil (puerta a puerta) cuando se detenga aproximadamente a la par de
    este?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 4 pies
  answer: B
  explanation: Al intentar estacionarse en paralelo, debe detenerse cuando esté aproximadamente
    a la par del automóvil que está delante del espacio, a unos 2 pies del otro automóvil
    (puerta a puerta).
- id: 140
  category: safe_driving_rules
  question: Según la ley 'Slow Poke' (para conductores lentos), ¿qué debe hacer un
    conductor en el carril de adelantamiento (el carril del extremo izquierdo) cuando
    se aproxima tráfico que circula más rápido?
  choices:
    A: Mantener su velocidad si está conduciendo al límite de velocidad
    B: Moverse hacia la derecha para permitir que el tráfico más rápido avance
    C: Aumentar la velocidad para igualar la del vehículo que se aproxima
    D: Encender sus luces de emergencia
  answer: B
  explanation: La ley 'Slow Poke' exige que los conductores más lentos salgan del
    carril de adelantamiento y se muevan hacia la derecha para permitir que el tráfico
    más rápido avance, independientemente de la velocidad a la que circulen.
- id: 141
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción a la Ley "Slow Poke" que le obliga
    a salirse del carril de rebase?
  choices:
    A: Cuando conduce exactamente al límite de velocidad indicado
    B: Cuando está escuchando la radio
    C: Cuando su vehículo debe ser conducido en el carril de rebase para salir o girar
      a la izquierda
    D: Cuando conduce un vehículo comercial
  answer: C
  explanation: Una de las excepciones a la Ley "Slow Poke" es cuando su vehículo debe
    ser conducido en el carril de rebase para salir o girar a la izquierda.
- id: 142
  category: sharing_the_road
  question: 'Siempre que un vehículo se detenga para permitir que un peatón cruce
    la calzada en un paso de peatones marcado, el conductor de cualquier otro vehículo
    que se aproxime por detrás deberá:'
  choices:
    A: Tocar la bocina para advertir al peatón y continuar
    B: Adelantar al vehículo detenido por la derecha
    C: No rebasar ni adelantar al vehículo detenido
    D: Adelantar al vehículo detenido por la izquierda
  answer: C
  explanation: Siempre que un vehículo se detenga para permitir que un peatón cruce
    la calzada en un paso de peatones, el conductor de cualquier otro vehículo que
    se aproxime por detrás no deberá rebasar ni adelantar al vehículo detenido.
- id: 143
  category: safe_driving_rules
  question: 'No debe realizar un giro en U en una curva o cerca de la cima de una
    colina si:'
  choices:
    A: No puede ser visto por otros conductores que se aproximen desde cualquier dirección
    B: Está conduciendo un vehículo comercial
    C: El límite de velocidad es superior a 45 mph
    D: Hay una línea blanca continua en el lado derecho de la carretera
  answer: A
  explanation: 'El manual establece: "No realice un giro en U en una curva o cerca
    de la cima de una colina si no puede ser visto por otros conductores que se aproximen
    desde cualquier dirección".'
- id: 144
  category: penalties_and_points
  question: Bajo la ley "Super Speeder" de Georgia, ¿cuál es el cargo estatal que
    se impone por conducir a 75 mph o más en una carretera de dos carriles?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Cualquier conductor condenado por exceso de velocidad a 75 mph o más
    en una carretera de dos carriles o a 85 mph o más en cualquier carretera en Georgia
    recibirá un cargo estatal de $200.
- id: 145
  category: safe_driving_rules
  question: ¿A menos que se indique lo contrario, cuál es el límite de velocidad máximo
    en una carretera del condado sin pavimentar en Georgia?
  choices:
    A: 30 millas por hora
    B: 35 millas por hora
    C: 45 millas por hora
    D: 55 millas por hora
  answer: B
  explanation: La velocidad máxima de circulación es de 35 millas por hora en una
    carretera del condado sin pavimentar, a menos que se indique lo contrario.
- id: 146
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo general en una autopista interestatal
    rural en Georgia?
  choices:
    A: 55 millas por hora
    B: 65 millas por hora
    C: 70 millas por hora
    D: 75 millas por hora
  answer: C
  explanation: La velocidad máxima de circulación es de 70 millas por hora en una
    autopista interestatal rural, a menos que se indique lo contrario.
- id: 147
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por obstaculizar el flujo normal del tráfico
    al conducir demasiado lento en el carril de rebase?
  choices:
    A: Una multa de hasta $500 y 2 puntos en el historial de conducción
    B: Una multa de hasta $1000 y/o 3 puntos en el historial de conducción
    C: Suspensión de la licencia por 6 meses
    D: Un curso obligatorio de conducción defensiva
  answer: B
  explanation: Las sanciones por conducir demasiado lento y obstaculizar el tráfico
    en el carril de rebase incluyen una multa de hasta $1000 y/o 3 puntos en el historial
    de conducción.
- id: 148
  category: safe_driving_rules
  question: Cuando se le requiera detenerse en un cruce de ferrocarril, ¿cuál es la
    distancia mínima a la que debe detenerse del riel más cercano?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: B
  explanation: Siempre debe detenerse a una distancia de entre 15 y 50 pies del riel
    más cercano de un cruce de ferrocarril cuando sea necesario.
- id: 149
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si su vehículo se apaga en las vías
    del tren?
  choices:
    A: Intentar arrancar el motor inmediatamente
    B: Poner el vehículo en punto muerto (neutral) y empujarlo fuera de las vías
    C: Salir inmediatamente y alejarse
    D: Llamar a una grúa desde el interior del vehículo
  answer: C
  explanation: Si su vehículo se apaga en las vías, debe salir inmediatamente, alejarse,
    localizar la señal de Sistemas de Notificación de Emergencia (ENS) y pedir ayuda.
- id: 150
  category: vehicle_information
  question: ¿Cuál es la técnica adecuada para que un conductor verifique su entorno
    mientras retrocede con un vehículo de pasajeros estándar?
  choices:
    A: Confiar totalmente en el espejo retrovisor
    B: Girar la cabeza y mirar por encima del hombro derecho
    C: Mirar por encima del hombro izquierdo y usar los espejos laterales
    D: Tocar la bocina y retroceder rápidamente
  answer: B
  explanation: Antes de retroceder, debe girar la cabeza y mirar por encima del hombro
    derecho; no dependa de sus espejos.
- id: 151
  category: signs_and_signals
  question: ¿Qué colores se utilizan para las señales de advertencia en las zonas
    de obras viales?
  choices:
    A: Fondo amarillo con letras negras
    B: Fondo naranja con letras o símbolos negros
    C: Fondo blanco con letras negras
    D: Fondo rojo con letras blancas
  answer: B
  explanation: Las señales de advertencia en las zonas de obras tienen un fondo naranja
    y letras o símbolos negros.
- id: 152
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por desobedecer los límites de velocidad reglamentarios
    en una zona de obras viales?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Los automovilistas que desobedezcan los límites de velocidad reglamentarios
    en una zona de obras pueden ser sancionados con una multa de no menos de $100.00
    ni más de $2,000.00, o con prisión de hasta 12 meses, o ambas.
- id: 153
  category: signs_and_signals
  question: En una zona de obras viales, ¿qué autoridad tiene un señalero (flagger)?
  choices:
    A: Solo pueden proporcionar sugerencias sobre velocidades seguras
    B: Tienen la misma autoridad que una señal reglamentaria
    C: Tienen menos autoridad que una señal de alto temporal
    D: Solo están allí para advertir a los trabajadores de la construcción sobre el
      tráfico
  answer: B
  explanation: En una zona de obras, un señalero (flagger) tiene la misma autoridad
    que una señal reglamentaria, y los conductores no deben desobedecer sus instrucciones
    de control de tráfico.
- id: 154
  category: sharing_the_road
  question: ¿Qué debe hacer al acercarse a una zona de obras donde los vehículos tienen
    luces ámbar intermitentes o giratorias?
  choices:
    A: Mantener su velocidad y tocar la bocina
    B: Ceder el paso y reducir su velocidad
    C: Acelerar para rebasar los vehículos rápidamente
    D: Detenerse por completo hasta que las luces se apaguen
  answer: B
  explanation: Debe ceder el paso a los vehículos de trabajo y equipo pesado con luces
    ámbar intermitentes o giratorias, y reducir su velocidad al acercarse.
- id: 155
  category: vehicle_information
  question: Al estacionarse en paralelo, ¿en qué momento debe enderezar rápidamente
    las ruedas y continuar retrocediendo en diagonal?
  choices:
    A: Cuando su parachoques delantero esté completamente libre del automóvil de adelante
    B: Cuando su puerta delantera pase el parachoques trasero del automóvil de adelante
    C: Antes de comenzar a retroceder
    D: Cuando haga contacto con el automóvil de atrás
  answer: B
  explanation: A medida que su puerta delantera pase el parachoques trasero del automóvil
    que está delante del espacio que desea utilizar, enderece rápidamente las ruedas
    y continúe retrocediendo en diagonal hacia el espacio.
- id: 156
  category: penalties_and_points
  question: ¿Qué sucede si un conductor no paga a tiempo la tarifa estatal de Super
    Speeder?
  choices:
    A: Su vehículo será confiscado
    B: Recibirá 3 puntos en su licencia
    C: Su licencia será suspendida y se agregará una tarifa de restablecimiento de
      $50
    D: Se le pedirá que vuelva a tomar el examen de conducir
  answer: C
  explanation: El incumplimiento del pago de la tarifa estatal a tiempo resultará
    en la suspensión de la licencia y una tarifa adicional de restablecimiento de
    $50.
- id: 157
  category: safe_driving_rules
  question: ¿Quiénes representan la mayoría de las muertes en las zonas de obras viales
    en todo el país?
  choices:
    A: Trabajadores del GDOT
    B: El público en general
    C: Señaleros (flaggers)
    D: Trabajadores de servicios públicos
  answer: B
  explanation: El público en general representa el 82% de las muertes en zonas de
    obras en todo el país, lo que hace que los automovilistas tengan más probabilidades
    de morir o resultar heridos que los trabajadores del GDOT.
- id: 158
  category: sharing_the_road
  question: En una carretera con dos o más carriles que se mueven en la misma dirección,
    ¿cuándo es aceptable que un vehículo más lento abandone el carril derecho?
  choices:
    A: Al rebasar o al hacer un giro a la izquierda
    B: Cuando el conductor desea una mejor vista de la carretera
    C: Cuando viaja exactamente al límite de velocidad mínima
    D: Los vehículos más lentos nunca deben abandonar el carril derecho
  answer: A
  explanation: Cuando hay dos o más carriles para el tráfico que se mueve en la misma
    dirección, los vehículos más lentos deben usar el carril derecho, excepto al rebasar
    o al hacer un giro a la izquierda.
- id: 159
  category: safe_driving_rules
  question: ¿Qué es cierto acerca de las multas de tráfico en la mayoría de las zonas
    de obras?
  choices:
    A: Se reducen a la mitad.
    B: Se incrementan.
    C: Siguen siendo las mismas que en las carreteras normales.
    D: Se exoneran para los infractores por primera vez.
  answer: B
  explanation: De acuerdo con los consejos de conducción en zonas de obras del manual,
    los conductores deben estar atentos a las señales de límite de velocidad porque
    las multas aumentan en la mayoría de las zonas de obras.
- id: 160
  category: safe_driving_rules
  question: ¿Cuál de las siguientes maniobras está estrictamente prohibida en las
    carreteras de acceso controlado?
  choices:
    A: Usar el arcén para paradas de emergencia
    B: Retroceder (dar marcha atrás)
    C: Conducir al límite de velocidad indicado
    D: Rebasar a otros vehículos
  answer: B
  explanation: El manual establece explícitamente que retroceder está prohibido en
    las carreteras de acceso controlado.
- id: 161
  category: safe_driving_rules
  question: 'Al bajar una colina en un vehículo motorizado, un conductor no debe:'
  choices:
    A: Aplicar los frenos suavemente.
    B: Bajar por inercia con las marchas o la transmisión en punto muerto (neutral).
    C: Mantener ambas manos en el volante.
    D: Reducir a una marcha más baja.
  answer: B
  explanation: La ley de conducción por inercia establece que el conductor de cualquier
    vehículo motorizado, al bajar una colina, no debe bajar por inercia con las marchas
    o la transmisión del vehículo en punto muerto (neutral).
- id: 162
  category: alcohol_drugs_health
  question: 'Se considera que una persona menor de 21 años está "bajo la influencia
    del alcohol" si su concentración de alcohol en sangre es igual o superior a:'
  choices:
    A: 0.02 gm
    B: 0.04 gm
    C: 0.06 gm
    D: 0.08 gm
  answer: A
  explanation: Se considera de manera irrefutable que una persona menor de 21 años
    está "bajo la influencia del alcohol" cuando hay 0.02 gm o más de peso de alcohol
    presente en la sangre.
- id: 163
  category: alcohol_drugs_health
  question: Si un conductor se ve afectado por un medicamento recetado legalmente,
    ¿puede ser acusado de conducir bajo la influencia (DUI)?
  choices:
    A: No, porque el medicamento fue recetado legalmente por un médico.
    B: Sí, tener una receta no es una defensa si el medicamento afecta su capacidad
      para conducir de manera segura.
    C: No, a menos que el medicamento se haya mezclado con alcohol.
    D: Sí, pero solo si el conductor es menor de 21 años.
  answer: B
  explanation: El manual establece que tener una receta para ciertos medicamentos
    no es una defensa si el medicamento afecta su capacidad para operar un vehículo
    motorizado de manera segura.
- id: 164
  category: driver_responsibility
  question: 'Operar un vehículo motorizado con la intención de molestar, acosar o
    intimidar a otra persona se define como:'
  choices:
    A: Conducción temeraria
    B: Conducción agresiva
    C: Conducción defensiva
    D: Hipnosis de carretera
  answer: B
  explanation: Una persona comete el delito de conducción agresiva cuando opera cualquier
    vehículo motorizado con la intención de molestar, acosar, hostigar, intimidar,
    herir u obstruir a otra persona.
- id: 165
  category: vehicle_information
  question: ¿Cuál es el ancho máximo permitido para un remolque en las autopistas
    de Georgia?
  choices:
    A: 7 pies, 6 pulgadas
    B: 8 pies, 0 pulgadas
    C: 8 pies, 6 pulgadas
    D: 9 pies, 0 pulgadas
  answer: C
  explanation: El manual señala que no se permiten remolques con un ancho superior
    a 8 pies y 6 pulgadas en las autopistas de Georgia.
- id: 166
  category: safe_driving_rules
  question: ¿Es legal usar audífonos o auriculares mientras se conduce un vehículo
    motorizado?
  choices:
    A: Sí, si está escuchando las indicaciones del GPS.
    B: Sí, pero solo en un oído.
    C: No, es ilegal usar cualquier dispositivo que afecte la capacidad del conductor
      para oír.
    D: No, a menos que esté conduciendo en una carretera rural.
  answer: C
  explanation: Es ilegal operar un vehículo motorizado mientras se usan audífonos,
    auriculares o cualquier otro dispositivo que afecte la capacidad del conductor
    para oír.
- id: 167
  category: sharing_the_road
  question: ¿Cuándo es legal abrir la puerta de un vehículo estacionado en el lado
    que da al tráfico en movimiento?
  choices:
    A: Solo cuando está estacionado en una zona residencial.
    B: Solo cuando sea seguro hacerlo y no interfiera con el resto del tráfico, incluidos
      los ciclistas.
    C: Siempre que necesite salir del vehículo rápidamente.
    D: No es legal bajo ninguna circunstancia.
  answer: B
  explanation: Está prohibido abrir las puertas de un vehículo en el lado por el que
    circula el tráfico, a menos que sea seguro hacerlo y que pueda hacerse sin interferir
    con el movimiento de otros vehículos, incluidos los ciclistas.
- id: 168
  category: safe_driving_rules
  question: Según la ley de Georgia, ¿cuándo debe usar sus luces delanteras (faros)?
  choices:
    A: Entre una hora después de la puesta del sol y una hora antes del amanecer.
    B: Entre media hora después de la puesta del sol y media hora antes del amanecer,
      o cuando esté lloviendo.
    C: Solo cuando se conduce por carreteras rurales sin iluminación.
    D: De 8:00 PM a 6:00 AM todos los días.
  answer: B
  explanation: Debe usar sus luces delanteras entre media hora después de la puesta
    del sol y media hora antes del amanecer; en cualquier momento en que esté lloviendo;
    o cuando la visibilidad sea limitada.
- id: 169
  category: safe_driving_rules
  question: ¿A qué distancia debe bajar la intensidad de sus luces delanteras cuando
    sigue a otro vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Debe bajar la intensidad de sus luces delanteras cuando sigue de cerca
    (a menos de 200 pies) a otro vehículo.
- id: 170
  category: defensive_driving
  question: Si su visibilidad se reduce considerablemente al conducir de noche, ¿qué
    debe usar como guía para mantenerse en su carril?
  choices:
    A: Las luces traseras del vehículo que va delante de usted.
    B: Las luces delanteras del tráfico que viene en sentido contrario.
    C: La línea de borde o la línea central de la carretera.
    D: Las señales reflectantes en el arcén (hombro).
  answer: C
  explanation: Si la visibilidad se reduce considerablemente, use la línea de borde
    como guía para mantenerse en su carril. Si no hay línea de borde, use la línea
    central para guiarse.
- id: 171
  category: safe_driving_rules
  question: ¿Qué ocupantes de un vehículo de pasajeros están obligados por ley a utilizar
    el cinturón de seguridad, independientemente de dónde estén sentados?
  choices:
    A: Todos los ocupantes menores de 18 años.
    B: Solo los ocupantes menores de 12 años.
    C: Solo el conductor y los pasajeros del asiento delantero.
    D: Todos los ocupantes mayores de 65 años.
  answer: A
  explanation: Todos los ocupantes de cualquier vehículo de pasajeros deben utilizar
    el cinturón de seguridad si son menores de 18 años.
- id: 172
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera condena por carreras de velocidad
    (Drag Racing) o conducción acrobática temeraria (Reckless Stunt Driving) en un
    periodo de 5 años?
  choices:
    A: Una suspensión de 6 meses de los privilegios de conducir.
    B: Una suspensión de 12 meses de los privilegios de conducir.
    C: Una suspensión de 3 años de los privilegios de conducir.
    D: Revocación permanente de la licencia de conducir.
  answer: B
  explanation: La sanción por una primera condena dentro de un periodo de 5 años por
    carreras de velocidad o conducción acrobática temeraria incluye una suspensión
    de 12 meses.
- id: 173
  category: safe_driving_rules
  question: ¿Es legal que los pasajeros viajen en una casa remolque (house trailer)
    mientras se desplaza por una calle o autopista?
  choices:
    A: Sí, si el remolque está equipado con cinturones de seguridad.
    B: Sí, pero solo si los pasajeros son mayores de 18 años.
    C: No, no se permite viajar en un remolque arrastrado por un vehículo mientras
      está en movimiento.
    D: No, a menos que el vehículo viaje a menos de 25 mph.
  answer: C
  explanation: No se permite viajar en una casa remolque, ni en ningún otro remolque
    arrastrado por un vehículo, mientras se desplaza por una calle o autopista debido
    a la alta probabilidad de lesiones o muerte.
- id: 174
  category: safe_driving_rules
  question: Según la ley de Georgia, ¿qué ocupantes de un vehículo de pasajeros deben
    utilizar el cinturón de seguridad?
  choices:
    A: Solo el conductor del vehículo
    B: Cada ocupante en el asiento delantero y todos los ocupantes menores de 18 años
    C: Solo los pasajeros menores de 18 años
    D: Todos los ocupantes, independientemente de su edad o posición en el asiento
  answer: B
  explanation: La ley de Georgia establece que cada ocupante en el asiento delantero
    debe estar asegurado por un cinturón de seguridad, y todos los ocupantes de cualquier
    vehículo de pasajeros deben utilizar el cinturón de seguridad si son menores de
    18 años.
- id: 175
  category: penalties_and_points
  question: ¿Qué significa que Georgia tenga una ley de cinturón de seguridad "primaria"
    (primary)?
  choices:
    A: Las infracciones por el uso del cinturón de seguridad son la falta de tráfico
      más común en el estado.
    B: Los oficiales pueden detener y citar a los infractores por una falta de cinturón
      de seguridad sin observar otra infracción.
    C: Solo el conductor principal del vehículo puede ser multado por infracciones
      del cinturón de seguridad.
    D: Las infracciones del cinturón de seguridad conllevan la penalización de puntos
      más alta de cualquier multa de tráfico.
  answer: B
  explanation: Georgia tiene una ley de cinturón de seguridad "primaria", lo que significa
    que los oficiales pueden detener y citar a los infractores sin observar otra infracción.
- id: 176
  category: safe_driving_rules
  question: Según la ley de Georgia, ¿un niño debe estar debidamente sujeto en un
    sistema de retención infantil apropiado si es menor de qué edad?
  choices:
    A: Seis años de edad
    B: Ocho años de edad
    C: Diez años de edad
    D: Doce años de edad
  answer: B
  explanation: Todo conductor que transporte a un niño menor de ocho años (excepto
    en un taxi o vehículo de transporte público) debe sujetar adecuadamente al niño
    en un sistema de retención infantil apropiado.
- id: 177
  category: sharing_the_road
  question: ¿A qué distancia debe mantenerse cuando sigue a un equipo de extinción
    de incendios que se desplaza en respuesta a una alarma de incendio?
  choices:
    A: Al menos 100 pies
    B: Al menos 200 pies
    C: Al menos 300 pies
    D: Al menos 500 pies
  answer: B
  explanation: El conductor de cualquier vehículo no debe seguir a ningún equipo de
    extinción de incendios que se desplace en respuesta a una alarma de incendio a
    menos de 200 pies.
- id: 178
  category: safe_driving_rules
  question: ¿Es ilegal estacionar cualquier vehículo a qué distancia de un equipo
    de bomberos detenido en respuesta a una alarma de incendio?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: Los conductores no deben estacionar ningún vehículo a menos de 500
    pies de cualquier equipo de bomberos detenido en respuesta a una alarma de incendio.
- id: 179
  category: penalties_and_points
  question: ¿Cuál es la multa máxima y el periodo de cárcel por una condena por arrojar
    basura bajo la Ley de Control de Basura de Georgia?
  choices:
    A: Una multa de $500 y 6 meses de cárcel
    B: Una multa de $1000 y un periodo de cárcel de 12 meses
    C: Una multa de $250 y sin tiempo de cárcel
    D: Una multa de $2000 y un periodo de cárcel de 24 meses
  answer: B
  explanation: Las personas condenadas bajo la Ley de Control de Basura pueden recibir
    una multa de hasta $1000 y un periodo de cárcel de 12 meses.
- id: 180
  category: safe_driving_rules
  question: Bajo la Ley de Manos Libres de Georgia (HB 673), ¿cuál de las siguientes
    acciones está legalmente permitida mientras se conduce?
  choices:
    A: Sostener un teléfono con el hombro
    B: Sostener un teléfono para leer un mensaje de texto
    C: Usar un teléfono con auriculares o un dispositivo montado
    D: Transmitir un video si el teléfono está montado
  answer: C
  explanation: La Ley de Manos Libres (Hands Free Law) exige que el teléfono solo
    se pueda usar con auriculares, un dispositivo inalámbrico, un soporte para teléfono
    o un dispositivo montado. Está prohibido sostener el teléfono, leer textos o transmitir
    videos.
- id: 181
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera condena bajo la Ley de Manos Libres
    de Georgia (Hands Free Georgia Law)?
  choices:
    A: 1 punto y una multa de no más de $50.00
    B: 2 puntos y una multa de no más de $100.00
    C: 3 puntos y una multa de no más de $150.00
    D: Suspensión de la licencia y una multa de $50.00
  answer: A
  explanation: La sanción por una primera condena bajo la Ley de Manos Libres de Georgia
    es 1 punto y una multa de no más de $50.00.
- id: 182
  category: sharing_the_road
  question: Al acercarse a un vehículo de saneamiento activo que muestra luces intermitentes,
    si es imposible cambiar de carril, ¿cuánto debe reducir su velocidad?
  choices:
    A: A exactamente 15 millas por hora
    B: A al menos 10 mph menos que el límite de velocidad establecido o a 25 mph,
      lo que sea mayor
    C: A 20 mph menos que el límite de velocidad establecido
    D: Debe detenerse por completo hasta que los trabajadores se muevan
  answer: B
  explanation: Si un cambio de carril es imposible, debe reducir su velocidad a al
    menos diez millas por hora menos que el límite de velocidad establecido o a 25
    millas por hora, lo que sea mayor, y estar preparado para detenerse.
- id: 183
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por violar la ley con respecto a rebasar a un
    cartero o a un trabajador de saneamiento?
  choices:
    A: $50.00
    B: $100.00
    C: $250.00
    D: $500.00
  answer: C
  explanation: La violación de la sección del código con respecto a rebasar a un cartero
    o trabajador de saneamiento será castigada con una multa de no más de $250.00.
- id: 184
  category: license_system
  question: ¿Qué significa TADRA en el programa de licencia de conducir graduada de
    Georgia?
  choices:
    A: Teen and Adult Driving Rules Act (Ley de Reglas de Conducción para Adolescentes
      y Adultos)
    B: Teenage and Driver Responsibility Act (Ley de Responsabilidad de los Adolescentes
      y Conductores)
    C: Traffic and Driving Regulations Act (Ley de Regulaciones de Tráfico y Conducción)
    D: Teen Automotive Driving Requirements Act (Ley de Requisitos de Conducción Automotriz
      para Adolescentes)
  answer: B
  explanation: En 1997, la Ley de Responsabilidad de los Adolescentes y Conductores
    (TADRA) estableció un programa de licencia de conducir graduada para adolescentes
    de 15 a 18 años en Georgia.
- id: 185
  category: license_system
  question: Cuando un solicitante menor de 18 años solicita una licencia, debe estar
    presente un adulto responsable. ¿Cuál es el requisito de edad mínima para este
    adulto responsable?
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: No hay edad mínima si es un tutor legal
  answer: A
  explanation: Un adulto responsable se define como una persona de dieciocho (18)
    años de edad o más, competente para verificar la solicitud y que tenga conocimiento
    personal del solicitante.
- id: 186
  category: license_system
  question: ¿Cuál de los siguientes documentos puede presentar un solicitante menor
    de 18 años para cumplir con el requisito de inscripción escolar para una licencia
    de conducir?
  choices:
    A: Una carta firmada por un compañero de clase
    B: Un Certificado de Inscripción Escolar (DS-1)
    C: Un boletín de calificaciones de la escuela secundaria
    D: Una tarjeta de biblioteca
  answer: B
  explanation: Cualquier persona menor de 18 años debe presentar documentos específicos
    para obtener una licencia o permiso, uno de los cuales es un Certificado de Inscripción
    Escolar (DS-1).
- id: 187
  category: defensive_driving
  question: Según el manual del conductor de Georgia, ¿cuál de las siguientes se considera
    una distracción común al conducir que aumenta el riesgo de choque?
  choices:
    A: Revisar sus espejos con frecuencia
    B: Usar sus señales de giro
    C: La presencia de pasajeros y mascotas
    D: Mantener ambas manos en el volante
  answer: C
  explanation: El manual señala que las distracciones comunes incluyen hablar por
    teléfono celular, enviar mensajes de texto, comer, etc., y agrega que 'La presencia
    de pasajeros y mascotas también puede aumentar el riesgo de choque'.
- id: 188
  category: license_system
  question: Al conducir con un Permiso de Instrucción Clase C (CP), ¿por una persona
    de al menos qué edad debe estar acompañado?
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: Cualquier edad, siempre que sea un padre o tutor con licencia
  answer: B
  explanation: Puede operar cualquier vehículo Clase C cuando esté acompañado por
    una persona de al menos 21 años de edad que tenga licencia para conducir un vehículo
    Clase C y que ocupe el asiento al lado del conductor.
- id: 189
  category: driver_testing
  question: ¿Cuál es la política con respecto a la tarifa del examen para un Permiso
    de Instrucción Clase C?
  choices:
    A: La tarifa de $10.00 es totalmente reembolsable si reprueba el examen.
    B: La tarifa de $15.00 se paga después de aprobar el examen.
    C: La tarifa de $10.00 debe pagarse antes del examen y no es reembolsable si reprueba.
    D: No hay tarifa para el primer intento del examen.
  answer: C
  explanation: El manual establece que la tarifa del examen es de $10.00 y debe pagarse
    antes de realizarlo. Si se reprueba cualquier parte del examen, no se emitirá
    ningún reembolso.
- id: 190
  category: license_system
  question: ¿Entre qué horas tiene prohibido conducir el titular de una Licencia Provisional
    Clase D?
  choices:
    A: 10:00 p.m. y 6:00 a.m.
    B: 11:00 p.m. y 5:00 a.m.
    C: 12:00 a.m. y 5:00 a.m.
    D: 1:00 a.m. y 6:00 a.m.
  answer: C
  explanation: Un titular de licencia Clase D no puede conducir entre las 12:00 a.m.
    y las 5:00 a.m. SIN EXCEPCIONES.
- id: 191
  category: license_system
  question: ¿Para obtener una Licencia Provisional Clase D, un adolescente debe completar
    un total acumulado de al menos cuántas horas de otra experiencia de conducción?
  choices:
    A: 20 horas, incluyendo 2 horas por la noche
    B: 30 horas, incluyendo 5 horas por la noche
    C: 40 horas, incluyendo al menos 6 horas por la noche
    D: 50 horas, incluyendo al menos 10 horas por la noche
  answer: C
  explanation: También debe haber completado un total acumulado de al menos 40 horas
    de otra experiencia de conducción, incluyendo al menos 6 horas por la noche.
- id: 192
  category: driver_responsibility
  question: Si un padre o tutor legal desea revocar el permiso de instrucción o la
    licencia de conducir de un menor, ¿qué tarifa debe pagar?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: B
  explanation: La persona que solicita la revocación del permiso de instrucción o
    la licencia de conducir de un menor debe pagar una tarifa no reembolsable de $10.00.
- id: 193
  category: penalties_and_points
  question: Para una persona menor de 21 años, ¿por cuánto tiempo se suspenderá la
    licencia tras una primera condena por darse a la fuga (hit and run) o conducción
    temeraria?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: B
  explanation: El permiso de instrucción o la licencia de conducir de cualquier persona
    menor de 21 años condenada por cualquiera de los delitos enumerados (incluyendo
    darse a la fuga y conducción temeraria) será SUSPENDIDA por un período de seis
    meses por una primera condena.
- id: 194
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en la suspensión de la
    licencia para un conductor menor de 21 años?
  choices:
    A: Exceso de velocidad de 10 mph sobre el límite de velocidad
    B: Estacionamiento inadecuado en una zona escolar
    C: Exceder el límite de velocidad por 24 millas por hora o más
    D: No utilizar una señal de giro
  answer: C
  explanation: A un conductor menor de 21 años se le suspenderá la licencia por cualquier
    infracción por la cual se evalúen cuatro o más puntos, lo que incluye exceder
    el límite de velocidad por 24 millas por hora o más.
- id: 195
  category: penalties_and_points
  question: ¿A un conductor menor de 18 años se le suspenderá la licencia si acumula
    cuántos puntos en cualquier período de 12 meses?
  choices:
    A: 2 o más puntos
    B: 4 o más puntos
    C: 6 o más puntos
    D: 8 o más puntos
  answer: B
  explanation: El manual establece que se producirá una suspensión por la acumulación
    de cuatro o más puntos en cualquier período de 12 meses mientras se sea menor
    de 18 años.
- id: 196
  category: license_system
  question: ¿Qué significa ADAP en el contexto de la obtención de una Licencia Provisional
    Clase D?
  choices:
    A: Adolescent Driving and Parking (Conducción y Estacionamiento para Adolescentes)
    B: Advanced Driver Assessment Protocol (Protocolo de Evaluación de Conductor Avanzado)
    C: Alcohol and Drug Awareness Program (Programa de Concientización sobre el Alcohol
      y las Drogas)
    D: Adult Driver Approval Process (Proceso de Aprobación de Conductor Adulto)
  answer: C
  explanation: Debe presentar un comprobante de finalización del Programa de Concientización
    sobre el Alcohol y las Drogas (ADAP) para obtener una Licencia Provisional Clase
    D.
- id: 197
  category: license_system
  question: ¿Qué edad debe tener para obtener una Licencia de Operador de Motocicleta
    Clase M en Georgia?
  choices:
    A: 15 años de edad
    B: 16 años de edad
    C: 17 años de edad
    D: 18 años de edad
  answer: C
  explanation: 'El manual establece: ''Debe tener 17 años de edad para obtener una
    Licencia de Operador de Motocicleta Clase M''.'
- id: 198
  category: penalties_and_points
  question: Si es su primera suspensión por DUI y se negó a la prueba de consentimiento
    implícito, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: Un mínimo de 6 meses
    B: Un mínimo de 12 meses
    C: Un mínimo de 18 meses
    D: Un mínimo de 24 meses
  answer: B
  explanation: Según el manual, para una primera suspensión por DUI, si su concentración
    de alcohol en sangre (BAC) fue de .08 o superior o si se negó a la prueba de consentimiento
    implícito, su licencia será suspendida por un período mínimo de 12 meses.
- id: 199
  category: penalties_and_points
  question: Durante una segunda suspensión por DUI, ¿cuándo es elegible un conductor
    para un permiso de dispositivo de bloqueo de encendido (ignition interlock)?
  choices:
    A: Inmediatamente después de la suspensión
    B: Después de 30 días
    C: Después de 120 días
    D: Después de 6 meses
  answer: C
  explanation: El manual establece que para una segunda suspensión por DUI, su licencia
    será suspendida por un período mínimo de 18 meses, con elegibilidad para el permiso
    de dispositivo de bloqueo de encendido después de 120 días.
- id: 200
  category: signs_and_signals
  question: ¿Qué debe hacer cuando se aproxima a una señal de ocho lados (octágono)?
  choices:
    A: Ceder el paso al tráfico que viene en sentido contrario sin detenerse
    B: Hacer una parada completa en una línea de parada marcada
    C: Reducir la velocidad a 15 mph
    D: Prepararse para un cruce de ferrocarril
  answer: B
  explanation: Un octágono (forma de ocho lados) siempre significa detenerse. Cuando
    llegue a uno, debe hacer una parada completa en una línea de parada marcada.
- id: 201
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico redonda?
  choices:
    A: Hay una zona escolar más adelante
    B: Se está aproximando a un cruce de ferrocarril
    C: Debe ceder el paso
    D: Comienza una zona de no rebasar
  answer: B
  explanation: Una señal redonda significa que se está aproximando a un cruce de ferrocarril.
    Le advierte que debe disminuir la velocidad, mirar, escuchar y prepararse para
    detenerse.
- id: 202
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a rebasar a otro vehículo en un cruce de
    ferrocarril?
  choices:
    A: Se permite rebasar si las vías están despejadas
    B: Se permite rebasar solo a vehículos comerciales
    C: Está prohibido rebasar en todos los cruces de ferrocarril
    D: Se permite rebasar si viaja a menos de 20 mph
  answer: C
  explanation: 'El manual establece explícitamente: "Está prohibido rebasar en todos
    los cruces de ferrocarril".'
- id: 203
  category: signs_and_signals
  question: 'Una señal en forma de pentágono indica que se está aproximando a:'
  choices:
    A: Una zona escolar y/o un cruce escolar
    B: Una carretera dividida
    C: Una zona de hospital
    D: Una colina empinada
  answer: A
  explanation: Las señales en forma de pentágono significan que se está aproximando
    a una zona escolar y/o un cruce escolar.
- id: 204
  category: signs_and_signals
  question: ¿Con qué antelación se instalan normalmente las señales en forma de pentágono
    antes de los terrenos escolares o cruces escolares?
  choices:
    A: De 50 a 100 pies
    B: De 150 a 700 pies
    C: De 500 a 1000 pies
    D: Exactamente 1 milla
  answer: B
  explanation: Cuando se utilizan, las señales en forma de pentágono se instalarán
    a no menos de 150 pies ni a más de 700 pies de antelación a los terrenos escolares
    o al cruce escolar.
- id: 205
  category: signs_and_signals
  question: ¿Qué significa un círculo rojo con una franja roja desde la parte superior
    izquierda a la inferior derecha en una señal reglamentaria?
  choices:
    A: Proceda con precaución
    B: La acción representada dentro del círculo está prohibida
    C: Hay un peligro más adelante
    D: Debe detenerse inmediatamente
  answer: B
  explanation: Recuerde, un círculo rojo con una franja roja desde la parte superior
    izquierda a la inferior derecha significa "No". La imagen dentro del círculo muestra
    lo que está prohibido.
- id: 206
  category: safe_driving_rules
  question: Cuando hay dos o más carriles de circulación disponibles en su dirección,
    ¿qué debe hacer el tráfico más lento?
  choices:
    A: Circular por el carril izquierdo (interior)
    B: Circular únicamente por el carril central
    C: Circular por el carril o carriles de la derecha (exterior)
    D: Conducir por el acotamiento (hombro)
  answer: C
  explanation: El manual establece que cuando hay dos o más carriles de circulación
    disponibles en la dirección en la que viaja, el tráfico más lento debe circular
    por el carril o carriles de la derecha (exterior).
- id: 207
  category: defensive_driving
  question: Según el manual, ¿cuándo es más peligrosa una carretera durante una tormenta
    de lluvia?
  choices:
    A: Durante la primera media hora de lluvia
    B: Después de que ha estado lloviendo durante dos horas
    C: Justo después de que deja de llover
    D: Cuando la lluvia va acompañada de rayos
  answer: A
  explanation: 'La señal de advertencia de carretera resbaladiza indica: "La carretera
    está resbaladiza cuando está mojada. Recuerde, la primera media hora de lluvia
    es la más peligrosa".'
- id: 208
  category: vehicle_information
  question: ¿Qué debe hacer cuando vea una señal de advertencia que indica una colina
    empinada más adelante?
  choices:
    A: Acelerar para mantener su velocidad
    B: Poner el vehículo en punto muerto (neutral) para ahorrar gasolina
    C: Estar preparado para cambiar a una marcha más baja para controlar la velocidad
      y proteger los frenos
    D: Aplicar el freno de emergencia inmediatamente
  answer: C
  explanation: 'Para una colina empinada más adelante, el manual aconseja: "Reduzca
    la velocidad y esté preparado para cambiar a una marcha más baja para controlar
    la velocidad y proteger los frenos de daños".'
- id: 209
  category: signs_and_signals
  question: ¿Dónde se ubica normalmente una señal de "Zona de no rebasar" (No Passing
    Zone) en la carretera?
  choices:
    A: En el lado derecho de la carretera
    B: En el lado izquierdo de la carretera
    C: Suspendida directamente sobre el carril central
    D: Pintada únicamente en la superficie de la calzada
  answer: B
  explanation: El manual establece que la señal de Zona de no rebasar está en el lado
    izquierdo de la carretera y marca el comienzo de una zona de no rebasar.
- id: 210
  category: safe_driving_rules
  question: Cuando vea una señal de advertencia que indica un acotamiento blando (soft
    shoulder), ¿cuándo es apropiado conducir por el acotamiento?
  choices:
    A: Cuando necesite rebasar a un vehículo que circula despacio
    B: Cuando quiera dar una vuelta a la derecha
    C: Solo en emergencias
    D: Siempre que la carretera principal esté congestionada
  answer: C
  explanation: 'La señal de advertencia de acotamiento blando indica: "El acotamiento
    de la carretera es blando. Conduzca por el acotamiento solo en emergencias".'
- id: 211
  category: sharing_the_road
  question: ¿Según la ley de Georgia, quién está obligado a obedecer las señales oficiales
    de las autopistas y las señales de control de tráfico?
  choices:
    A: Solo los conductores de vehículos motorizados
    B: Todos los conductores, incluidos los ciclistas
    C: Solo los conductores de vehículos comerciales
    D: Todos, excepto los trabajadores de emergencia en servicio o fuera de él
  answer: B
  explanation: La ley de Georgia exige que todos los conductores, incluidos los ciclistas,
    obedezcan las señales oficiales de las autopistas y las señales de control de
    tráfico, a menos que un oficial de policía o un trabajador de emergencia indique
    lo contrario.
- id: 212
  category: penalties_and_points
  question: Para una primera suspensión por DUI (conducir bajo la influencia), si
    su concentración de alcohol en sangre (BAC) fue de .02 o superior pero inferior
    a .08, ¿cuál es el período mínimo de suspensión (asumiendo que no hay condenas
    previas)?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 18 meses
  answer: B
  explanation: Si su concentración de alcohol en sangre (BAC) fue de .02 o superior,
    pero inferior a .08... su licencia será suspendida por un período mínimo de 6
    meses, a menos que tenga una condena previa.
- id: 213
  category: vehicle_information
  question: ¿Cómo se define un vehículo de movimiento lento según la ley de Georgia?
  choices:
    A: Un vehículo que se desplaza a menos de 35 millas por hora.
    B: Un vehículo que se desplaza a menos de 25 millas por hora.
    C: Un vehículo que se desplaza a menos de 40 millas por hora.
    D: Un vehículo que se desplaza a menos de 15 millas por hora.
  answer: B
  explanation: Un vehículo de movimiento lento se define como cualquier vehículo que
    se desplaza a menos de 25 millas por hora. La ley les exige exhibir un emblema
    de vehículo de movimiento lento.
- id: 214
  category: signs_and_signals
  question: ¿Dónde comienzan los marcadores de millaje con el número cero en las autopistas
    de Georgia?
  choices:
    A: En la frontera norte o este donde comienza una ruta.
    B: En el centro del estado.
    C: En la frontera sur o oeste donde comienza una ruta.
    D: Al comienzo de cualquier línea del condado.
  answer: C
  explanation: Los marcadores de millaje se colocan cada milla a lo largo del borde
    de la calzada. El cero siempre comienza en la frontera sur o oeste donde se inicia
    una ruta.
- id: 215
  category: signs_and_signals
  question: ¿De qué colores son las señales de advertencia de construcción y mantenimiento?
  choices:
    A: Amarillo con marcas negras
    B: Rojo con marcas blancas
    C: Naranja con marcas negras
    D: Azul con marcas blancas
  answer: C
  explanation: Las señales de advertencia para proyectos de construcción y mantenimiento
    se utilizan para alertarle sobre peligros más adelante. Estas señales son naranjas
    con marcas negras.
- id: 216
  category: signs_and_signals
  question: ¿Qué colores se utilizan para las señales que dan indicaciones hacia instalaciones
    de servicio como gasolina, comida y alojamiento?
  choices:
    A: Verde y blanco
    B: Azul y blanco
    C: Marrón y blanco
    D: Negro y blanco
  answer: B
  explanation: Al viajar por las autopistas de Georgia, las señales azules y blancas
    darán indicaciones hacia las instalaciones de servicio.
- id: 217
  category: safe_driving_rules
  question: ¿A cuáles de los siguientes vehículos se les permite usar los carriles
    expresos de la I-85 sin pagar peaje?
  choices:
    A: Cualquier vehículo con un solo ocupante
    B: Motocicletas
    C: Camiones comerciales pesados
    D: Todos los vehículos eléctricos independientemente de su matrícula
  answer: B
  explanation: En los carriles expresos de la I-85, se permite el uso gratuito de
    los carriles a los vehículos de tránsito registrados, vehículos compartidos (carpools)
    de tres o más personas, motocicletas, vehículos de emergencia y vehículos de combustible
    alternativo (AFV) con la placa de matrícula AFV adecuada.
- id: 218
  category: signs_and_signals
  question: ¿Qué debe hacer si se aproxima a una intersección donde el semáforo no
    funciona en absoluto?
  choices:
    A: Ceder el paso al vehículo a su derecha y continuar.
    B: Tratar la intersección como si hubiera una señal de alto (stop) para todas
      las direcciones.
    C: Pasar por la intersección sin detenerse si el camino está despejado.
    D: Esperar a que llegue un oficial de policía antes de cruzar.
  answer: B
  explanation: Si un semáforo no funciona en absoluto en una intersección, todos los
    conductores deben tratar la intersección como si hubiera una señal de alto (stop)
    para todas las direcciones.
- id: 219
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico con una flecha amarilla intermitente?
  choices:
    A: Debe detenerse por completo antes de girar a la izquierda.
    B: Puede girar a la izquierda después de ceder el paso al tráfico que viene en
      sentido contrario y a los peatones.
    C: El semáforo está averiado y debe tratarlo como una parada de cuatro vías.
    D: Usted tiene el derecho de paso para girar a la izquierda y el tráfico que viene
      en sentido contrario debe detenerse.
  answer: B
  explanation: Una flecha amarilla intermitente significa que puede girar a la izquierda
    después de ceder el paso al tráfico que viene en sentido contrario y a los peatones
    (el tráfico que viene en sentido contrario todavía tiene la luz verde).
- id: 220
  category: signs_and_signals
  question: Cuando una baliza híbrida para peatones (PHB) muestra señales rojas intermitentes
    alternas, ¿qué debe hacer un conductor?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: Detenerse por completo y avanzar cuando los peatones hayan despejado el cruce
      peatonal.
    C: Detenerse y esperar hasta que la señal se ponga en verde.
    D: Ceder el paso a los peatones, pero no es obligatorio detenerse.
  answer: B
  explanation: Las señales rojas intermitentes alternas en una PHB requieren que los
    conductores se DETENGAN por completo y avancen cuando los peatones hayan despejado
    el cruce peatonal.
- id: 221
  category: signs_and_signals
  question: ¿Dónde debe detenerse por completo un conductor en una intersección que
    tiene una línea de parada?
  choices:
    A: En la señal de alto o semáforo real.
    B: Justo después del paso de peatones.
    C: En la línea de parada, antes de cruzarla.
    D: Donde tenga la mejor visibilidad del tráfico transversal.
  answer: C
  explanation: Los conductores deben detenerse por completo en la línea de parada,
    cuando esté presente, no en la señal de alto o semáforo real.
- id: 222
  category: signs_and_signals
  question: ¿Qué marca en el pavimento se utiliza en los cruces de ferrocarril para
    evitar el adelantamiento?
  choices:
    A: Una línea blanca continua en el borde derecho de la carretera.
    B: Una línea amarilla discontinua en el centro de la carretera.
    C: Una línea amarilla situada en el lado derecho de la línea central.
    D: Una línea blanca discontinua doble.
  answer: C
  explanation: En los cruces de ferrocarril, siempre se coloca una línea amarilla
    en el lado derecho de la línea central para evitar el adelantamiento.
- id: 223
  category: signs_and_signals
  question: ¿Cómo debe reaccionar un conductor ante una luz roja intermitente en un
    semáforo?
  choices:
    A: Reducir la velocidad y avanzar con precaución.
    B: Detenerse por completo y tratarla como una señal de alto.
    C: Detenerse y esperar a que la luz cambie a verde.
    D: Ceder el paso al tráfico de la derecha y avanzar sin detenerse.
  answer: B
  explanation: Una luz roja intermitente significa que debe detenerse por completo
    (trátela como lo haría con una señal de alto). Avance con precaución solo después
    de ceder el paso a los peatones y a otros vehículos.
- id: 224
  category: signs_and_signals
  question: ¿Qué indica una sola línea amarilla continua en una carretera de dos carriles?
  choices:
    A: Una zona donde está prohibido adelantar.
    B: Una zona donde se permite adelantar si el camino está despejado.
    C: Un carril designado solo para giros a la izquierda.
    D: El borde derecho de la calzada.
  answer: A
  explanation: Las líneas amarillas continuas simples en carreteras de dos carriles
    indican zonas donde está prohibido adelantar.
- id: 225
  category: sharing_the_road
  question: ¿Qué debe hacer un peatón si la señal peatonal comienza a parpadear mientras
    ya está cruzando la calle?
  choices:
    A: Dar la vuelta y regresar a la acera de inicio.
    B: Detenerse en medio del paso de peatones y esperar.
    C: Correr lo más rápido posible hacia el otro lado.
    D: Terminar de cruzar la calle.
  answer: D
  explanation: Una señal peatonal intermitente significa que no debe bajar de la acera,
    pero debe terminar de cruzar la calle si ya ha comenzado.
- id: 226
  category: signs_and_signals
  question: ¿Qué indican las líneas amarillas discontinuas en una carretera de dos
    carriles?
  choices:
    A: El adelantamiento está prohibido en ambas direcciones.
    B: Es seguro adelantar en cualquier dirección.
    C: La carretera se estrecha más adelante.
    D: Se está aproximando a un cruce de ferrocarril.
  answer: B
  explanation: Las líneas amarillas discontinuas se utilizan cuando solo hay dos carriles
    y es seguro adelantar en cualquier dirección.
- id: 227
  category: signs_and_signals
  question: ¿Qué indica una línea blanca doble continua en la calzada?
  choices:
    A: Los cambios de carril están prohibidos.
    B: Se permite que los vehículos crucen al carril adyacente.
    C: Debe prepararse para detenerse.
    D: El carril está reservado exclusivamente para bicicletas.
  answer: A
  explanation: Cuando las líneas blancas dobles son continuas, los cambios de carril
    están prohibidos.
- id: 228
  category: signs_and_signals
  question: ¿Cuál es el propósito de una línea de borde amarilla en el lado izquierdo
    de la calzada?
  choices:
    A: Indicar un paso de peatones.
    B: Marcar un carril para bicicletas.
    C: Advertir sobre medianas estrechas o elevadas.
    D: Designar un carril para vehículos de alta ocupación (HOV).
  answer: C
  explanation: Se puede utilizar una línea de borde amarilla en el lado izquierdo
    para advertir sobre medianas estrechas o elevadas.
- id: 229
  category: safe_driving_rules
  question: Al viajar por una carretera con cuatro o más carriles que se mueven en
    direcciones opuestas, ¿cuándo puede cruzar las dos líneas amarillas continuas
    centrales?
  choices:
    A: Para adelantar a un vehículo que circula despacio.
    B: Para realizar un giro a la izquierda hacia un callejón, camino privado o entrada
      particular.
    C: Para cambiar de carril en tráfico denso.
    D: Nunca puede cruzar dos líneas amarillas continuas.
  answer: B
  explanation: Puede cruzar estas líneas solo para realizar un giro a la izquierda
    hacia o desde un callejón, camino privado, entrada particular u otra calle.
- id: 230
  category: signs_and_signals
  question: ¿Qué debe hacer cuando encuentre franjas de tráfico creadas por líneas
    amarillas diagonales en la calle?
  choices:
    A: Conducir sobre las marcas para adelantar al tráfico más lento.
    B: Estacionar su vehículo en el área marcada.
    C: Mantenerse siempre a la derecha de estas marcas.
    D: Usar el área para hacer un giro en U.
  answer: C
  explanation: Estas marcas indican que la carretera se está estrechando o que hay
    una obstrucción en la calzada. Manténgase siempre a la derecha de estas marcas.
- id: 231
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima que puede recorrer en un carril central de
    giro a la izquierda antes de realizar su giro?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Puede entrar en este carril a no más de 300 pies de la ubicación del
    giro a la izquierda.
- id: 232
  category: sharing_the_road
  question: ¿Cuándo se le permite al conductor de un vehículo motorizado cruzar un
    carril para bicicletas?
  choices:
    A: Al adelantar a un vehículo más lento.
    B: Al estacionar su vehículo a un lado de la carretera.
    C: Solo para cruzarlo para realizar un giro.
    D: Cuando el carril de tráfico regular está congestionado.
  answer: C
  explanation: Se prohíbe a los conductores de vehículos motorizados circular o estacionarse
    en el carril para bicicletas, excepto para cruzarlo para realizar un giro.
- id: 233
  category: safe_driving_rules
  question: Al entrar en una rotonda, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que entra en la rotonda.
    B: El tráfico que ya se encuentra en la rotonda.
    C: El vehículo más grande que se aproxima a la intersección.
    D: Los vehículos que entran por la derecha.
  answer: B
  explanation: Al entrar en una rotonda, se siguen aplicando las leyes de tráfico
    relativas al derecho de paso. Debe ceder el paso al resto del tráfico que ya se
    encuentre en la rotonda.
- id: 234
  category: safe_driving_rules
  question: ¿En qué dirección circula el tráfico en una rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En un patrón de figura en ocho
    D: En cualquier dirección que el conductor elija
  answer: B
  explanation: El tráfico en una rotonda siempre circula en sentido contrario a las
    agujas del reloj.
- id: 235
  category: defensive_driving
  question: ¿Cuál es una regla importante a seguir al navegar por una rotonda de varios
    carriles?
  choices:
    A: Cambiar de carril rápidamente para salir.
    B: Entrar siempre por el carril izquierdo.
    C: No cambiar de carril dentro de la rotonda.
    D: Detenerse dentro de la rotonda para dejar entrar a otros.
  answer: C
  explanation: Al navegar por una rotonda de varios carriles, debe continuar circulando
    por la rotonda hasta llegar a la calzada hacia la que desea girar. No cambie de
    carril en la rotonda.
- id: 236
  category: sharing_the_road
  question: ¿Cómo deben navegar los ciclistas experimentados por una rotonda?
  choices:
    A: Pegarse al bordillo lo más posible.
    B: Circular por el centro del carril para evitar que los vehículos los adelanten.
    C: Desmontar siempre y caminar con sus bicicletas.
    D: Circular en dirección opuesta al tráfico.
  answer: B
  explanation: Los ciclistas experimentados pueden navegar por las rotondas como los
    automovilistas. No se pegue al bordillo. Circule por el centro del carril para
    evitar que los vehículos lo adelanten.
- id: 237
  category: vehicle_information
  question: ¿Dónde puede encontrar la presión de neumáticos recomendada (psi) para
    su vehículo?
  choices:
    A: En el volante.
    B: En el marco de la puerta del vehículo.
    C: En la placa de matrícula del vehículo.
    D: En el bloque del motor.
  answer: B
  explanation: Antes de entrar al vehículo, compruebe la presión de los neumáticos
    utilizando los psi recomendados que se encuentran en el marco de la puerta del
    vehículo.
- id: 238
  category: vehicle_information
  question: Al usar la prueba de la moneda de un centavo para revisar la banda de
    rodadura de los neumáticos, ¿qué indica que está conduciendo con una cantidad
    segura de banda de rodadura?
  choices:
    A: Toda la cabeza de Abraham Lincoln es visible.
    B: Cualquier parte de la cabeza de Abraham Lincoln está cubierta por la banda
      de rodadura.
    C: La moneda se cae de la ranura.
    D: La banda de rodadura es inferior a 1/32 de pulgada.
  answer: B
  explanation: Si cualquier parte de la cabeza de Lincoln está cubierta por la banda
    de rodadura, está conduciendo con la cantidad legal y segura de banda de rodadura.
- id: 239
  category: safe_driving_rules
  question: Si está estacionado en la calle, ¿cómo debe acercarse y entrar a su vehículo
    de manera segura?
  choices:
    A: Entrar por el lado de la calle de espaldas al tráfico.
    B: Acercarse al vehículo de frente al tráfico y entrar por el lado de la acera
      si es posible.
    C: Correr rápidamente hacia la puerta del conductor sin mirar.
    D: Entrar por la ventana del lado del pasajero.
  answer: B
  explanation: Si está estacionado en la calle, entre por el lado de la acera del
    vehículo. Tenga sus llaves listas y acérquese al vehículo de frente al tráfico.
- id: 240
  category: driver_responsibility
  question: ¿Qué debe hacer inmediatamente antes de encender el motor de su vehículo?
  choices:
    A: Encender el radio.
    B: Abrocharse el cinturón de seguridad y asegurarse de que los pasajeros hagan
      lo mismo.
    C: Comprobar la presión de los neumáticos.
    D: Bajar todas las ventanas.
  answer: B
  explanation: Antes de encender el motor, abróchese el cinturón de seguridad y asegúrese
    de que sus pasajeros hagan lo mismo.
- id: 241
  category: safe_driving_rules
  question: ¿Cómo debe caminar hacia un vehículo estacionado en la calle al acercarse
    a él?
  choices:
    A: De espaldas al tráfico
    B: De frente al tráfico
    C: Solo desde el lado del pasajero
    D: Desde la parte trasera del vehículo
  answer: B
  explanation: El manual establece que al entrar en un vehículo estacionado en la
    calle, debe tener sus llaves listas y acercarse al vehículo de frente al tráfico.
- id: 242
  category: safe_driving_rules
  question: Como regla general, ¿cuál es la posición recomendada de las manos en el
    volante para vehículos sin instrucciones específicas sobre bolsas de aire?
  choices:
    A: A las 10 y a las 2
    B: A las 8 y a las 4
    C: A las 9 y a las 3
    D: A las 12 y a las 6
  answer: C
  explanation: Como regla general, al sujetar el volante, coloque la mano izquierda
    en la posición de las 9 en punto y la mano derecha en la posición de las 3 en
    punto.
- id: 243
  category: defensive_driving
  question: ¿Qué luces debe utilizar al conducir con niebla densa?
  choices:
    A: Luces altas
    B: Luces de estacionamiento
    C: Luces de emergencia
    D: Luces bajas (atenuadas)
  answer: D
  explanation: Debe atenuar sus faros (usar luces bajas) en condiciones de niebla
    densa porque las luces brillantes producen un resplandor que en realidad dificulta
    la visión.
- id: 244
  category: defensive_driving
  question: En un automóvil de pasajeros estándar, ¿a qué velocidad puede comenzar
    el hidroplaneo (hydroplaning) parcial?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: En un automóvil de pasajeros estándar, el hidroplaneo parcial puede
    comenzar a velocidades tan bajas como 35 mph.
- id: 245
  category: defensive_driving
  question: ¿Cuál es la respuesta adecuada si su vehículo comienza a hidroplanear?
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar bruscamente hacia el arcén
    C: Quitar el pie del acelerador y dejar que el coche disminuya la velocidad
    D: Acelerar para atravesar el agua estancada
  answer: C
  explanation: Si ocurre hidroplaneo, debe quitar el pie del acelerador, permitiendo
    que el automóvil disminuya la velocidad.
- id: 246
  category: defensive_driving
  question: ¿Qué debe hacer con el volante si su vehículo comienza a derrapar?
  choices:
    A: Girarlo en la dirección opuesta al derrape
    B: Girarlo en la dirección del derrape
    C: Mantenerlo perfectamente recto
    D: Moverlo rápidamente de un lado a otro
  answer: B
  explanation: Si comienza a derrapar, debe empezar a girar el volante en la dirección
    del derrape.
- id: 247
  category: safe_driving_rules
  question: ¿Por qué se considera que la primera media hora de lluvia es la más peligrosa
    para conducir?
  choices:
    A: La visibilidad se reduce a cero inmediatamente
    B: El hidroplaneo solo ocurre durante los primeros 30 minutos
    C: El agua se mezcla con el aceite y los productos químicos de la carretera, haciéndola
      extremadamente resbaladiza
    D: Es más probable que los frenos fallen cuando se mojan inicialmente
  answer: C
  explanation: La primera media hora de lluvia es la más peligrosa porque las carreteras
    se vuelven extremadamente resbaladizas cuando el agua se mezcla con el aceite
    y otros productos químicos en la superficie de la carretera.
- id: 248
  category: defensive_driving
  question: Si se da cuenta de que viaja demasiado rápido mientras conduce por una
    curva, ¿qué debe hacer?
  choices:
    A: Aplicar los frenos con fuerza para reducir la velocidad rápidamente
    B: Quitar el pie del acelerador y aplicar el freno con cuidado
    C: Poner el vehículo en punto muerto y avanzar por inercia en la curva
    D: Acelerar ligeramente para aumentar la tracción
  answer: B
  explanation: Si viaja demasiado rápido en una curva, no aplique los frenos con fuerza,
    ya que esto puede causar un derrape. En su lugar, quite el pie del acelerador,
    aplique el freno con cuidado y continúe maniobrando el volante.
- id: 249
  category: defensive_driving
  question: Si su vehículo se sale inesperadamente de la calzada, ¿por qué debe evitar
    volver inmediatamente al pavimento?
  choices:
    A: Dañará sus neumáticos
    B: Sobrecompensar o dar un volantazo puede hacer que pierda el control, derrape
      o vuelque
    C: Debe esperar a que una grúa le asista
    D: Es ilegal volver a entrar en la calzada sin detenerse primero
  answer: B
  explanation: No intente volver al pavimento de inmediato. Sobrecompensar o dar un
    "volantazo" puede hacer que pierda el control de su vehículo al derrapar o volcar.
- id: 250
  category: safe_driving_rules
  question: Cuando entra por primera vez en la calzada durante el clima invernal,
    ¿cómo debe probar las condiciones de la carretera si es seguro hacerlo?
  choices:
    A: Acelerar rápidamente para comprobar el agarre de los neumáticos
    B: Frenar de forma repentina y brusca para ver si se desliza
    C: Probar los frenos suavemente y realizar ligeros ajustes en la dirección
    D: Conducir en zigzag a través de los carriles
  answer: C
  explanation: Cuando entre por primera vez en la calzada en clima invernal, "sienta"
    la carretera probando los frenos suavemente y determinando cómo responde su vehículo
    a ligeros ajustes de dirección.
- id: 251
  category: alcohol_drugs_health
  question: ¿Cuáles de los siguientes son síntomas de intoxicación por monóxido de
    carbono?
  choices:
    A: Cansancio repentino, bostezos, mareos y náuseas
    B: Hiperactividad y aumento del ritmo cardíaco
    C: Visión borrosa y zumbido en los oídos
    D: Hambre y sed extremas
  answer: A
  explanation: Los síntomas de la intoxicación por monóxido de carbono son cansancio
    repentino, bostezos, mareos y náuseas.
- id: 252
  category: driver_responsibility
  question: 'Para prevenir la intoxicación por monóxido de carbono, NUNCA debe:'
  choices:
    A: Conducir con las ventanas bajadas
    B: Dejar el motor del automóvil encendido en un garaje
    C: Usar la calefacción mientras conduce por la carretera
    D: Estacionar su automóvil en una entrada abierta con el motor apagado
  answer: B
  explanation: 'Las precauciones sencillas para evitar el monóxido de carbono incluyen:
    No dejar el motor del automóvil encendido en un garaje.'
- id: 253
  category: defensive_driving
  question: ¿Cuál es el primer paso recomendado si experimenta un reventón repentino
    de un neumático mientras conduce?
  choices:
    A: Pisar los frenos a fondo para detenerse inmediatamente
    B: Sujetar el volante con firmeza y retirar el pie del acelerador
    C: Girar rápidamente hacia el acotamiento de la carretera
    D: Acelerar para mantener el impulso hacia adelante
  answer: B
  explanation: Si experimenta un reventón repentino de un neumático, sujete el volante
    con firmeza y retire el pie del acelerador para permitir que el vehículo se detenga
    por sí solo.
- id: 254
  category: signs_and_signals
  question: ¿Cómo mejora el flujo de tráfico un Intercambio de Diamante Divergente
    (DDI)?
  choices:
    A: Requiere que todos los vehículos se detengan en una intersección de cuatro
      vías antes de entrar a la autopista
    B: Desvía el flujo de tráfico al lado opuesto de la carretera para permitir giros
      a la izquierda hacia una rampa de entrada sin detenerse
    C: Utiliza una rotonda circular grande para mantener el tráfico en movimiento
      continuo
    D: Restringe el acceso a la autopista únicamente a vehículos comerciales
  answer: B
  explanation: Un Intercambio de Diamante Divergente (DDI) desvía el flujo de tráfico
    al lado opuesto de la carretera para permitir que los vehículos entren a la autopista
    girando a la izquierda hacia una rampa de entrada sin detenerse.
- id: 255
  category: safe_driving_rules
  question: ¿A qué velocidad podrían los neumáticos de un automóvil de pasajeros estándar
    perder todo contacto con la carretera durante un evento de hidroplaneo (hydroplaning)?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: En un automóvil de pasajeros estándar, el hidroplaneo parcial puede
    comenzar a las 35 mph, pero a las 55 mph, los neumáticos pueden perder todo contacto
    con la carretera.
- id: 256
  category: vehicle_information
  question: ¿Qué situación peligrosa puede ocurrir si el encendido de un vehículo
    se coloca en la posición de bloqueo (lock) mientras el vehículo está en movimiento?
  choices:
    A: Los frenos se bloquearán inmediatamente y detendrán el coche.
    B: La capacidad de dirección del vehículo quedará desactivada.
    C: El motor acelerará rápidamente.
    D: Las luces de emergencia parpadearán automáticamente.
  answer: B
  explanation: Según el manual, si el encendido de un vehículo se coloca en la posición
    de bloqueo mientras el vehículo está en movimiento, la capacidad de dirección
    del vehículo quedará desactivada y el conductor no podrá maniobrar.
- id: 257
  category: safe_driving_rules
  question: ¿Cómo puede determinar si está dejando suficiente distancia entre su vehículo
    y el vehículo que tiene delante?
  choices:
    A: Mantenga exactamente la longitud de dos automóviles entre usted y el vehículo
      de adelante.
    B: Espere tres segundos antes de acelerar desde una parada.
    C: Cuente 'mil uno, mil dos' después de que el automóvil de adelante pase un punto
      de referencia.
    D: Asegúrese de poder ver los neumáticos traseros del vehículo de adelante tocando
      la carretera.
  answer: C
  explanation: El manual sugiere observar cuando el automóvil de adelante pasa por
    un punto de referencia y contar 'mil uno, mil dos'. Si usted pasa por el mismo
    lugar antes de terminar de contar, significa que está siguiendo demasiado de cerca.
- id: 258
  category: defensive_driving
  question: ¿Bajo cuál de las siguientes condiciones debe aumentar su distancia de
    seguimiento?
  choices:
    A: Durante clima inclemente.
    B: Durante tráfico pesado.
    C: De noche.
    D: Todas las anteriores.
  answer: D
  explanation: El manual establece que durante el clima inclemente, durante construcciones,
    durante tráfico pesado y siempre de noche, la distancia entre su vehículo y el
    vehículo de adelante debe ser aún mayor.
- id: 259
  category: safe_driving_rules
  question: ¿Cuál de los siguientes NO figura en el manual como un factor que determina
    la distancia real de frenado?
  choices:
    A: La dirección y velocidad del viento.
    B: El tipo y condición del pavimento.
    C: La hora del día.
    D: La reacción mental y física del conductor.
  answer: C
  explanation: El manual enumera la reacción mental/física, el tipo/condición del
    pavimento, los neumáticos, el diseño del chasis, los frenos y la dirección/velocidad
    del viento como factores que afectan la distancia de frenado. La hora del día
    no figura en la lista.
- id: 260
  category: safe_driving_rules
  question: Al entrar en una autopista desde el carril de aceleración, ¿quién tiene
    el derecho de paso?
  choices:
    A: El vehículo que entra a la autopista.
    B: Los vehículos que ya están en la autopista.
    C: Cualquier vehículo que viaje más rápido.
    D: El vehículo en el carril de más a la derecha debe ceder el paso al tráfico
      que entra.
  answer: B
  explanation: 'El manual establece: ''Los vehículos en la autopista tienen el derecho
    de paso, pero los conductores corteses le permitirán incorporarse al tráfico de
    la autopista''.'
- id: 261
  category: signs_and_signals
  question: ¿Qué es un 'gore' (área de convergencia) en una autopista de acceso controlado?
  choices:
    A: Un área de descanso designada para emergencias.
    B: El área de convergencia entre dos carriles de tráfico, generalmente formada
      por líneas blancas sólidas.
    C: Un carril de cabina de peaje para vehículos de alta ocupación.
    D: La mediana que separa el tráfico que viaja en direcciones opuestas.
  answer: B
  explanation: El manual define un 'gore' como 'el área de convergencia entre dos
    carriles de tráfico... generalmente similar a un triángulo, formada por líneas
    blancas sólidas entre un carril de circulación existente y un carril de incorporación'.
- id: 262
  category: signs_and_signals
  question: ¿Cómo están marcados en la calzada los carriles para Vehículos de Alta
    Ocupación (HOV)?
  choices:
    A: Con una línea amarilla sólida en ambos lados.
    B: Con un símbolo de bicicleta pintado.
    C: Con un símbolo de diamante.
    D: Con una 'X' blanca grande.
  answer: C
  explanation: Según el manual, los carriles HOV están marcados con un símbolo de
    diamante y se publican las horas de restricción.
- id: 263
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de las restricciones del
    carril HOV en Georgia?
  choices:
    A: Una multa de hasta $75.
    B: Una multa de hasta $100.
    C: Una multa de hasta $150 y un punto en el historial de conducción.
    D: Suspensión de la licencia por 30 días.
  answer: A
  explanation: La sanción por violar las restricciones del carril HOV es una multa
    de hasta $75 por una primera infracción.
- id: 264
  category: safe_driving_rules
  question: ¿Qué vehículos tienen permitido usar los carriles de Peaje de Alta Ocupación
    (HOT) sin pagar peaje?
  choices:
    A: Cualquier vehículo con exactamente dos ocupantes.
    B: Transporte público registrado, vehículos compartidos (carpools) de tres o más
      personas, motocicletas, vehículos de emergencia y vehículos de combustible alternativo.
    C: Tractocamiones comerciales.
    D: Cualquier vehículo que viaje durante las horas de menor afluencia.
  answer: B
  explanation: Los carriles HOT permiten que el transporte público registrado, los
    vehículos compartidos de tres o más personas, las motocicletas, los vehículos
    de emergencia y los vehículos de combustible alternativo utilicen los carriles
    sin pagar peaje.
- id: 265
  category: safe_driving_rules
  question: Al rebasar a otro vehículo en la autopista, ¿cuándo es seguro regresar
    al carril derecho?
  choices:
    A: Tan pronto como su parachoques delantero pase al otro vehículo.
    B: Cuando pueda ver claramente el vehículo que acaba de rebasar en su espejo retrovisor.
    C: Cuando el otro conductor le haga señales con las luces delanteras.
    D: Después de haber viajado en el carril izquierdo durante al menos una milla.
  answer: B
  explanation: 'El manual aconseja: ''No regrese al carril derecho hasta que pueda
    ver claramente el automóvil que acaba de rebasar en su espejo retrovisor''.'
- id: 266
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias está permitido conducir en reversa en una autopista?
  choices:
    A: Si se pasa de su salida y no hay tráfico detrás de usted.
    B: Si se le cae un objeto por la ventana.
    C: Durante un embotellamiento severo para llegar a una salida anterior.
    D: Conducir en reversa en una autopista está prohibido bajo cualquier circunstancia.
  answer: D
  explanation: 'El manual establece explícitamente: ''No retroceda. Conducir en reversa
    en una autopista está prohibido bajo cualquier circunstancia''.'
- id: 267
  category: safe_driving_rules
  question: ¿Cuál de las siguientes se considera una emergencia válida que permite
    detenerse en el acotamiento (hombro) de la autopista?
  choices:
    A: Cambiar de conductor.
    B: Estirar las piernas durante un viaje largo.
    C: Recuperar un objeto de la parte trasera del vehículo.
    D: Ninguna de las anteriores.
  answer: D
  explanation: El manual establece que detenerse en el acotamiento se permite solo
    en una emergencia, y señala explícitamente que 'cambiar de conductor, estirarse
    o recuperar un objeto de la parte trasera del vehículo NO se considera una emergencia'.
- id: 268
  category: safe_driving_rules
  question: ¿Qué debe hacer si está reduciendo la velocidad en el carril de circulación
    al prepararse para salir de una autopista?
  choices:
    A: Tocar la bocina para advertir a otros conductores.
    B: Usar las luces de freno o una señal de giro para indicar un cambio de velocidad
      a los conductores que vienen detrás.
    C: Encender las luces de emergencia (intermitentes).
    D: Poner el vehículo en punto muerto (neutral).
  answer: B
  explanation: 'El manual establece: ''Los conductores deben usar las luces de freno
    o una señal de giro para indicar un cambio de velocidad a los conductores de atrás
    si están reduciendo la velocidad en el carril de circulación al prepararse para
    salir''.'
- id: 269
  category: sharing_the_road
  question: ¿Por qué es especialmente peligroso viajar en el punto ciego de una combinación
    de tractocamión y remolque?
  choices:
    A: Viajan a velocidades mucho más altas que los automóviles de pasajeros.
    B: Tienen una visibilidad limitada debido a su tamaño.
    C: Se detienen con frecuencia en el acotamiento de la autopista.
    D: No se les permite circular por el carril derecho.
  answer: B
  explanation: 'El manual advierte que se debe permanecer fuera de los puntos ciegos,
    señalando que esto es especialmente cierto para los vehículos grandes: ''Las combinaciones
    de tractocamión y remolque, también conocidos como camiones de dieciocho ruedas,
    tienen una visibilidad limitada debido a su tamaño''.'
- id: 270
  category: driver_responsibility
  question: ¿Qué es lo primero que debe hacer si encuentra a una víctima de intoxicación
    por monóxido de carbono?
  choices:
    A: Darle agua para beber.
    B: Llevar a la víctima al aire fresco.
    C: Aplicar lodo o tierra en su cara.
    D: Revisar si hay agua en la zanja.
  answer: B
  explanation: 'El manual instruye: ''Lleve a la víctima de intoxicación por monóxido
    de carbono al aire fresco, comuníquese con los servicios médicos de emergencia
    y proporcione respiración artificial si es necesario...'''
- id: 271
  category: safe_driving_rules
  question: Según el manual, ¿cuál de las siguientes se considera una razón aceptable
    para detenerse en el acotamiento (shoulder) de la autopista?
  choices:
    A: Cambiar de conductor
    B: Recuperar un objeto de la parte trasera del vehículo
    C: Estirar las piernas
    D: Experimentar una avería del vehículo o una verdadera emergencia
  answer: D
  explanation: El manual establece que detenerse en el acotamiento de la calzada es
    sumamente peligroso y solo se permite en caso de emergencia. Cambiar de conductor,
    estirarse o recuperar un objeto NO se considera una emergencia.
- id: 272
  category: safe_driving_rules
  question: Si es necesario realizar una parada de emergencia en la autopista, ¿qué
    debe hacer para indicar que tiene problemas?
  choices:
    A: Caminar por la autopista en busca de ayuda
    B: Levantar el capó y activar las luces de emergencia (hazard lights)
    C: Pararse en el carril de tráfico y agitar los brazos
    D: Tocar la bocina continuamente hasta que llegue ayuda
  answer: B
  explanation: Si es necesario detenerse en la autopista, debe levantar el capó y
    activar las luces de emergencia para indicar que tiene problemas. El manual advierte
    explícitamente que no se debe caminar por la autopista en busca de ayuda.
- id: 273
  category: defensive_driving
  question: ¿Qué es la "hipnosis de carretera" (highway hypnosis)?
  choices:
    A: Una condición de somnolencia o falta de conciencia provocada por la monotonía
      en la autopista
    B: Un término legal para conducir bajo la influencia de drogas estimulantes
    C: Una técnica utilizada para concentrarse en la línea central de la calzada
    D: El acto de mirar fijamente una señal de giro a la izquierda intermitente
  answer: A
  explanation: Los conductores de autopistas están sujetos a la "hipnosis de carretera",
    una condición de somnolencia o falta de conciencia provocada por la monotonía,
    el sonido del viento, los neumáticos sobre el pavimento y el zumbido constante
    del motor.
- id: 274
  category: defensive_driving
  question: 'Para ayudar a mantenerse alerta y evitar la hipnosis de carretera en
    viajes largos, usted debe:'
  choices:
    A: Mirar fijamente la línea central de la calzada
    B: Tomar drogas estimulantes para mantenerse despierto
    C: Mover constantemente la vista de una zona de la calzada a otra
    D: Concentrarse únicamente en el vehículo que tiene directamente delante
  answer: C
  explanation: En viajes largos, es una buena idea "ejercitar los ojos" para ayudar
    a mantenerse alerta. Mueva constantemente la vista de una zona de la calzada a
    otra y concéntrese en varios objetos, tanto cercanos como lejanos, a la izquierda
    y a la derecha.
- id: 275
  category: defensive_driving
  question: Como conductor defensivo, debe pensar constantemente en una "ruta de escape"
    mientras conduce. ¿Qué significa esto?
  choices:
    A: Planificar la forma más rápida de salir de la autopista
    B: Buscar un área segura para maniobrar si otro vehículo invade su carril
    C: Encontrar la ruta más rápida hacia su destino
    D: Saber dónde se encuentra el área de descanso más cercana
  answer: B
  explanation: Pensar en una ruta de escape significa observar de cerca el acotamiento
    y el área cercana para determinar qué haría si un automóvil que se aproxima en
    la dirección opuesta cruza hacia su lado de la carretera.
- id: 276
  category: vehicle_information
  question: ¿Qué debe hacer si el acelerador de su vehículo se queda trabado mientras
    conduce?
  choices:
    A: Cambiar a la posición de estacionamiento (P) inmediatamente
    B: Apagar el motor y bloquear el volante
    C: Cambiar a punto muerto (neutral) y concentrarse en la dirección
    D: Bombear el pedal del acelerador repetidamente
  answer: C
  explanation: Si el acelerador se queda trabado, debe golpear el pedal con el pie,
    cambiar a punto muerto (neutral), concentrarse en la dirección, usar los frenos
    y apagar el motor (pero sin bloquear el volante).
- id: 277
  category: vehicle_information
  question: ¿Cuál de las siguientes es una acción recomendada si le fallan los frenos?
  choices:
    A: Cambiar a una marcha más alta
    B: Cambiar a una marcha más baja y usar los frenos de estacionamiento
    C: Apagar el motor para bloquear el volante
    D: Acelerar para despejar el tráfico
  answer: B
  explanation: Si le fallan los frenos, el manual recomienda cambiar a una marcha
    más baja, usar los frenos de estacionamiento, rozar un neumático contra el bordillo
    (curb) y buscar un área segura para frenar hasta detenerse.
- id: 278
  category: vehicle_information
  question: ¿Cómo debe secar los frenos mojados después de conducir por agua profunda?
  choices:
    A: Conducir a alta velocidad para secarlos con el aire
    B: Cambiar a punto muerto (neutral) y avanzar por inercia
    C: Conducir lentamente en una marcha baja mientras aplica los frenos ligeramente
    D: Bombear los frenos rápidamente mientras acelera
  answer: C
  explanation: Puede secar los frenos mojados conduciendo lentamente en una marcha
    baja mientras aplica los frenos ligeramente.
- id: 279
  category: vehicle_information
  question: En el área metropolitana de Atlanta de trece condados, ¿qué vehículos
    están exentos del requisito de inspección anual de emisiones?
  choices:
    A: Todos los camiones ligeros
    B: Vehículos que tienen 10 años de antigüedad
    C: Los tres años de modelo más recientes
    D: Vehículos conducidos menos de 10,000 millas al año
  answer: C
  explanation: Los automóviles de gasolina y los camiones ligeros de menos de 25 años
    de antigüedad deben pasar una inspección, pero los tres años de modelo más recientes
    están exentos de este requisito.
- id: 280
  category: vehicle_information
  question: 'Según el manual, dejar un vehículo en ralentí (idling) durante 10 segundos:'
  choices:
    A: Consumirá más combustible que reiniciar el motor
    B: Cargará la batería por completo
    C: Reducirá el desgaste del motor en comparación con la conducción
    D: Hará que los frenos fallen
  answer: A
  explanation: Dejar un vehículo en ralentí durante 10 segundos consumirá más combustible
    que reiniciar el motor. Minimizar el tiempo en ralentí reduce el consumo de combustible,
    el desgaste del motor y la contaminación del aire.
- id: 281
  category: sharing_the_road
  question: ¿Bajo la ley de Georgia, cuándo debe un conductor detenerse y permanecer
    detenido ante un peatón que cruza la calzada dentro de un paso de peatones?
  choices:
    A: Solo cuando el peatón está directamente frente al vehículo
    B: Cuando el peatón se encuentra en la mitad de la calzada por la que circula
      el vehículo, o se aproxima a menos de un carril de ella
    C: Solo si el paso de peatones está marcado con líneas pintadas
    D: Solo cuando un semáforo está en rojo
  answer: B
  explanation: Un conductor debe detenerse y permanecer detenido cuando el peatón
    se encuentra en la mitad de la calzada por la que circula el vehículo, o se aproxima
    y está a menos de un carril de esa mitad.
- id: 282
  category: sharing_the_road
  question: En el contexto de las leyes de derecho de paso de peatones, ¿qué significa
    "mitad de la calzada"?
  choices:
    A: La línea central exacta de la calle
    B: El carril más cercano a la acera
    C: Todos los carriles de circulación que transportan tráfico en una dirección
      de viaje
    D: La mediana que separa el tráfico opuesto
  answer: C
  explanation: '"Mitad de la calzada" significa todos los carriles de circulación
    que transportan tráfico en una dirección de viaje.'
- id: 283
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones sobre los pasos de peatones es verdadera?
  choices:
    A: Los pasos de peatones solo existen si están marcados con líneas pintadas
    B: Los pasos de peatones existen en las cuatro esquinas de las intersecciones,
      incluso cuando no están marcados con líneas pintadas
    C: Los peatones solo tienen el derecho de paso en los pasos de peatones a mitad
      de cuadra
    D: Los conductores tienen permitido bloquear los pasos de peatones si el semáforo
      está en verde
  answer: B
  explanation: Los pasos de peatones existen en las cuatro esquinas de las intersecciones,
    incluso cuando no están marcados con líneas pintadas. Un paso de peatones es la
    parte del pavimento para el tráfico peatonal donde la acera se extendería a través
    de la calle.
- id: 284
  category: sharing_the_road
  question: 'Al acercarse a un peatón ciego que cruza una calle, debe cederle el derecho
    de paso:'
  choices:
    A: Solo si se encuentra en un paso de peatones marcado
    B: En todo momento si lleva un bastón blanco o es guiado por un perro
    C: Solo si el semáforo está en rojo
    D: Solo durante las horas del día
  answer: B
  explanation: Se debe ceder el derecho de paso en todo momento a los peatones que
    utilicen perros guía o bastones blancos.
- id: 285
  category: safe_driving_rules
  question: Al esperar para realizar un giro a la derecha en un semáforo en rojo,
    ¿dónde debe detener su vehículo?
  choices:
    A: En medio del paso de peatones para tener una mejor vista del tráfico
    B: Antes del paso de peatones para que los peatones puedan cruzar con seguridad
    C: Pasado el paso de peatones
    D: En la intersección
  answer: B
  explanation: Antes de girar a la derecha en rojo, los conductores deben detenerse
    por completo antes del paso de peatones y no deben bloquearlo, ya que esto pone
    en riesgo a los peatones.
- id: 286
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor antes de realizar un giro a la derecha en
    un semáforo en rojo?
  choices:
    A: Reducir la velocidad y ceder el paso al tráfico sin detenerse
    B: Detenerse por completo antes del paso de peatones
    C: Tocar la bocina para advertir a los peatones antes de girar
    D: Detenerse solo si hay peatones visibles en el paso de peatones
  answer: B
  explanation: Según el manual, antes de girar a la derecha en rojo, los conductores
    deben detenerse por completo antes del paso de peatones.
- id: 287
  category: sharing_the_road
  question: Al detenerse en un paso de peatones en una carretera de varios carriles,
    ¿a qué distancia debe detener su vehículo?
  choices:
    A: Exactamente sobre la línea del paso de peatones
    B: Al menos 5 pies antes del paso de peatones
    C: Al menos 10 pies antes del paso de peatones
    D: Al menos 20 pies antes del paso de peatones
  answer: C
  explanation: El manual establece que cuando se detiene en un paso de peatones en
    una carretera de varios carriles, debe detenerse al menos 10 pies antes del paso
    de peatones para que el conductor del carril contiguo pueda ver al peatón.
- id: 288
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el riesgo de muerte de un peatón al ser golpeado
    por un vehículo motorizado que viaja a 40 mph?
  choices:
    A: 20%
    B: 50%
    C: Al menos 80%
    D: 100%
  answer: C
  explanation: El manual señala que cuando un peatón es golpeado por un vehículo motorizado
    que viaja a 40 mph, el riesgo de muerte del peatón es de al menos el 80%.
- id: 289
  category: sharing_the_road
  question: ¿En cuál de las siguientes carreteras NO tienen derecho legal a circular
    los ciclistas en Georgia?
  choices:
    A: Calles de la ciudad de varios carriles
    B: Carreteras rurales de dos carriles
    C: Autopistas interestatales y de acceso limitado
    D: Carreteras sin carriles para bicicletas designados
  answer: C
  explanation: Los ciclistas tienen derecho legal a utilizar todas las carreteras
    de Georgia, excepto las autopistas interestatales y las similares a estas (autopistas
    de acceso limitado).
- id: 290
  category: sharing_the_road
  question: ¿Cuál es el espacio legal mínimo que un automovilista debe dejar al adelantar
    a un ciclista?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 6 pies
  answer: B
  explanation: El manual especifica que el espacio legal mínimo para que un automovilista
    adelante a un ciclista es de 3 pies.
- id: 291
  category: penalties_and_points
  question: ¿Cuál es la sanción por infringir la ley relativa a acercarse y adelantar
    a ciclistas?
  choices:
    A: Una advertencia por la primera infracción
    B: Una condena por delito grave y suspensión de la licencia
    C: Un delito menor (misdemeanor) punible con una multa de hasta $250.00
    D: Una multa de $500.00 y 3 puntos en la licencia
  answer: C
  explanation: La infracción de las normas para acercarse y adelantar bicicletas es
    un delito menor (misdemeanor) punible con una multa de hasta $250.00.
- id: 292
  category: sharing_the_road
  question: Si no puede cambiar de carril de forma segura para adelantar a un ciclista,
    ¿cómo debe ajustar su velocidad?
  choices:
    A: Reducir la velocidad a exactamente 15 mph
    B: Reducir la velocidad a al menos 10 mph menos que el límite señalizado o a 25
      mph, lo que sea mayor
    C: Reducir la velocidad a 5 mph menos que el límite de velocidad señalizado
    D: Detenerse por completo hasta que el ciclista se mueva
  answer: B
  explanation: Si un cambio de carril es imposible, está prohibido o es inseguro,
    debe reducir su velocidad a al menos diez millas por hora menos que el límite
    de velocidad señalizado o a 25 millas por hora, lo que sea mayor.
- id: 293
  category: safe_driving_rules
  question: ¿Cuándo se le permite a un automovilista conducir o estacionar en un carril
    exclusivo para bicicletas?
  choices:
    A: Al adelantar a un vehículo más lento por la derecha
    B: Cuando no hay ciclistas presentes
    C: Al realizar un giro a la derecha en una intersección
    D: A los automovilistas nunca se les permite conducir o estacionar en un carril
      para bicicletas
  answer: D
  explanation: 'El manual establece explícitamente: ''Los automovilistas no deben
    conducir ni estacionar en un carril para bicicletas''. Los carriles para bicicletas
    son para uso exclusivo de bicicletas.'
- id: 294
  category: defensive_driving
  question: ¿Cómo afecta el perfil pequeño de una motocicleta la forma en que es percibida
    por otros conductores?
  choices:
    A: Hace que la motocicleta parezca estar más cerca y viajar más rápido de lo que
      realmente está
    B: Hace que la motocicleta parezca estar más lejos y viajar más lento de lo que
      realmente está
    C: Hace que la motocicleta sea más fácil de ver en los puntos ciegos
    D: No tiene ningún efecto sobre cómo se perciben la velocidad y la distancia de
      la motocicleta
  answer: B
  explanation: Según el manual, el perfil pequeño de la motocicleta puede hacer que
    parezca estar más lejos y viajar más lento de lo que realmente está.
- id: 295
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a compartir
    un carril con una motocicleta?
  choices:
    A: Puede compartir el carril si la motocicleta circula por el extremo derecho
    B: Puede compartir el carril si conduce un automóvil compacto
    C: Las motocicletas tienen derecho al ancho total de un carril y usted no debe
      compartir el carril con ellas
    D: Puede compartir el carril solo al adelantar a la motocicleta
  answer: C
  explanation: 'A las motocicletas se les permite el ancho total de un carril para
    maniobrar, y el manual establece explícitamente: ''No comparta el carril''.'
- id: 296
  category: defensive_driving
  question: ¿Cuál es el lugar más probable donde puede ocurrir un choque entre un
    automóvil y una motocicleta?
  choices:
    A: En autopistas interestatales
    B: En las intersecciones
    C: En los estacionamientos
    D: En carreteras rurales de dos carriles
  answer: B
  explanation: El manual establece que las intersecciones son los lugares más probables
    para que ocurra un choque entre un automóvil y una motocicleta, generalmente porque
    el conductor del automóvil no ve la motocicleta.
- id: 297
  category: defensive_driving
  question: ¿Por qué debería esperar para estar seguro de que una motocicleta va a
    girar antes de avanzar, incluso si su luz de giro está parpadeando?
  choices:
    A: Las luces de giro de las motocicletas suelen ser demasiado tenues para verse
      con claridad
    B: Es posible que las luces de giro de las motocicletas no se apaguen automáticamente
      y el conductor puede haber olvidado apagarlas
    C: Los motociclistas suelen utilizar las luces de giro para indicar que se están
      deteniendo
    D: Es ilegal avanzar mientras la luz de giro de cualquier vehículo esté parpadeando
  answer: B
  explanation: El manual advierte a los conductores que no se dejen engañar por una
    luz de giro parpadeante en una motocicleta porque es posible que no se apaguen
    automáticamente y los motociclistas a veces olvidan apagarlas.
- id: 298
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir detrás de
    una motocicleta?
  choices:
    A: Uno a dos segundos
    B: Dos a tres segundos
    C: De tres a cuatro segundos
    D: Cinco a seis segundos
  answer: C
  explanation: Los conductores deben dejar una mayor distancia de seguimiento (tres
    o cuatro segundos) cuando siguen a una motocicleta para que el conductor tenga
    suficiente tiempo para maniobrar o detenerse en una emergencia.
- id: 299
  category: vehicle_information
  question: ¿Cómo se compara la capacidad de frenado de una motocicleta con la de
    un automóvil en condiciones secas?
  choices:
    A: Los automóviles pueden detenerse mucho más rápido que las motocicletas
    B: Las motocicletas pueden detenerse más rápido que los automóviles
    C: Ambos vehículos requieren exactamente la misma distancia de frenado
    D: Las motocicletas no pueden detenerse de forma segura en condiciones secas
  answer: B
  explanation: El manual establece que, en condiciones secas, las motocicletas pueden
    detenerse más rápido que los automóviles.
- id: 300
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor al salir de una entrada para autos o un callejón
    cruzando una acera?
  choices:
    A: Tocar la bocina y avanzar sin detenerse
    B: Reducir la velocidad y ceder el paso solo a otros vehículos motorizados
    C: Detenerse antes del área de la acera y avanzar solo después de que los peatones
      hayan pasado de manera segura
    D: Detenerse solo si un peatón ya está directamente frente al vehículo
  answer: C
  explanation: Al salir o entrar en una entrada para autos, callejón o garaje de estacionamiento,
    los conductores deben detenerse antes del área de la acera y avanzar solo después
    de que los peatones hayan pasado de manera segura.
- id: 301
  category: sharing_the_road
  question: ¿Cuándo es obligatorio detenerse ante un autobús escolar que está subiendo
    o bajando pasajeros?
  choices:
    A: Siempre, independientemente del tipo de carretera.
    B: Solo si viaja en la misma dirección que el autobús.
    C: En la mayoría de los casos, a menos que se encuentre en una autopista separada
      en el centro por una franja divisoria (mediana).
    D: Solo cuando conduce en una zona escolar designada.
  answer: C
  explanation: En la mayoría de los casos, todos los conductores deben detenerse ante
    un autobús escolar detenido con luces intermitentes. La excepción es cuando las
    autopistas están separadas en el centro por franjas divisorias, donde solo los
    vehículos que viajan en la misma dirección deben detenerse.
- id: 302
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por rebasar ilegalmente un autobús escolar
    detenido en Georgia?
  choices:
    A: Una multa de hasta $500
    B: Hasta 6 puntos en su historial de conducción
    C: Confiscación inmediata del vehículo
    D: Una advertencia por la primera infracción
  answer: B
  explanation: Las multas y sanciones de Georgia por rebasar un autobús escolar detenido
    incluyen una comparecencia obligatoria ante el tribunal, hasta 6 puntos en su
    historial de conducción y una multa de hasta $1000.
- id: 303
  category: penalties_and_points
  question: Si un conductor menor de 21 años es condenado por rebasar ilegalmente
    un autobús escolar detenido, ¿cuál es la sanción?
  choices:
    A: Suspensión de la licencia
    B: Repetición obligatoria del examen de conducir
    C: 10 puntos en su historial de conducción
    D: Solo servicio comunitario
  answer: A
  explanation: De acuerdo con las multas y sanciones de Georgia, una condena por rebasar
    ilegalmente un autobús escolar detenido siendo menor de 21 años constituye la
    suspensión de la licencia.
- id: 304
  category: sharing_the_road
  question: ¿Cuánta distancia de frenado necesita un camión con remolque (tractor-trailer)
    totalmente cargado que viaja a 55 mph en comparación con un automóvil de pasajeros?
  choices:
    A: La misma distancia
    B: El doble de distancia
    C: El triple de distancia
    D: Cuatro veces la distancia
  answer: C
  explanation: Un camión con remolque totalmente cargado que viaja a 55 mph necesita
    el triple de la distancia que necesita un automóvil para detenerse.
- id: 305
  category: sharing_the_road
  question: ¿A qué se refiere el término 'No-Zone' (Zona Prohibida) cuando se comparte
    la carretera con vehículos comerciales?
  choices:
    A: Un área designada donde está prohibido estacionar
    B: Una zona escolar donde los límites de velocidad se aplican estrictamente
    C: Las áreas de peligro y puntos ciegos alrededor de camiones y autobuses
    D: Un carril reservado solo para vehículos comerciales
  answer: C
  explanation: La 'No-Zone' representa las áreas de peligro alrededor de camiones
    y autobuses donde es más probable que ocurran choques, incluyendo los puntos ciegos
    reales donde su automóvil desaparece de la vista del conductor.
- id: 306
  category: safe_driving_rules
  question: ¿Cómo puede saber si está conduciendo en la 'No-Zone' lateral de un conductor
    de camión?
  choices:
    A: Está conduciendo exactamente al límite de velocidad.
    B: No puede ver la cara del conductor en su espejo retrovisor lateral.
    C: Está a más de tres longitudes de automóvil detrás del camión.
    D: Puede ver toda la parte delantera del camión en su espejo retrovisor.
  answer: B
  explanation: Los camiones y autobuses tienen grandes 'No-Zones' en ambos lados.
    Si no puede ver la cara del conductor en el espejo retrovisor lateral, el conductor
    no puede verlo a usted.
- id: 307
  category: sharing_the_road
  question: ¿Por qué es particularmente peligrosa la 'No-Zone' del lado derecho de
    un camión o autobús?
  choices:
    A: Los camiones aceleran más rápido por el lado derecho.
    B: Los conductores de camiones y autobuses deben realizar giros a la derecha amplios.
    C: El espejo del lado derecho suele ser más pequeño.
    D: Los vehículos comerciales no tienen permitido circular por el carril izquierdo.
  answer: B
  explanation: La 'No-Zone' del lado derecho es particularmente peligrosa porque los
    conductores de camiones y autobuses deben realizar giros a la derecha amplios.
- id: 308
  category: defensive_driving
  question: Para evitar la 'No-Zone' delantera, ¿qué debe hacer antes de incorporarse
    delante de un camión o autobús?
  choices:
    A: Asegurarse de viajar al menos 10 mph más rápido que el camión.
    B: Asegurarse de poder ver los faros del camión en su espejo lateral.
    C: Asegurarse de poder ver toda la parte delantera del camión o autobús en su
      espejo retrovisor.
    D: Tocar la bocina para alertar al conductor antes de incorporarse.
  answer: C
  explanation: Para evitar la 'No-Zone' delantera, asegúrese de poder ver toda la
    parte delantera del camión o autobús en su espejo retrovisor antes de incorporarse
    o entrar en ese carril de tráfico.
- id: 309
  category: safe_driving_rules
  question: Según el Proyecto TACT de Georgia, ¿cuál es la distancia de seguimiento
    recomendada para evitar cerrarle el paso a los vehículos motorizados comerciales?
  choices:
    A: La longitud de un automóvil por cada 10 millas por hora de velocidad
    B: La longitud de dos automóviles independientemente de la velocidad
    C: Tres segundos de distancia de seguimiento
    D: 50 pies en todo momento
  answer: A
  explanation: El Proyecto TACT de Georgia recomienda dejar la longitud de un automóvil
    por cada 10 millas por hora de velocidad para evitar cerrarle el paso a los vehículos
    motorizados comerciales de manera segura.
- id: 310
  category: safe_driving_rules
  question: Según el manual, ¿en qué proporción aproximada de todos los choques fatales
    es la velocidad un factor determinante?
  choices:
    A: Un cuarto
    B: Un tercio
    C: La mitad
    D: Dos tercios
  answer: B
  explanation: El manual establece que la velocidad es un factor en casi un tercio
    de todos los choques fatales.
- id: 311
  category: license_system
  question: ¿Qué tipo de retiro de licencia ocurre si un solicitante no proporciona
    la información requerida o correcta al momento de la solicitud?
  choices:
    A: Suspensión
    B: Revocación
    C: Cancelación
    D: Descalificación
  answer: C
  explanation: El Departamento de Servicios al Conductor (DDS) está autorizado a cancelar
    una licencia si el solicitante no proporciona la información requerida o correcta
    necesaria al momento de realizar la solicitud.
- id: 312
  category: license_system
  question: Si su licencia de conducir es revocada, ¿qué debe hacer para recuperar
    sus privilegios de conducción después de que termine el período de revocación?
  choices:
    A: Solicitar una licencia nueva.
    B: Pagar una multa y se le devolverá su licencia anterior.
    C: Esperar a que la licencia se restablezca automáticamente.
    D: Escribir una carta de apelación al DDS.
  answer: A
  explanation: Si se revoca una licencia, se terminan todos los privilegios de conducción.
    Al final del período de revocación, un residente puede solicitar una licencia
    nueva.
- id: 313
  category: license_system
  question: ¿Qué sucede con sus privilegios de conducción no comerciales si su Licencia
    de Conducir Comercial (CDL) es descalificada?
  choices:
    A: Se suspenden automáticamente por el mismo período.
    B: Se revocan permanentemente.
    C: No se suspenden ni se revocan por la descalificación de la CDL en sí misma.
    D: Se restringen únicamente a la conducción diurna.
  answer: C
  explanation: Una descalificación de los privilegios de conducción comercial (CDL)
    no resulta, por sí misma, en la suspensión o revocación de los privilegios del
    titular para operar un vehículo motorizado NO comercial.
- id: 314
  category: license_system
  question: En Georgia, ¿cuál es la pena máxima posible para los privilegios de conducción
    comercial tras la condena por ciertos delitos graves?
  choices:
    A: Una suspensión de 10 años
    B: La pérdida de por vida de los privilegios de conducción comercial
    C: Una multa máxima de $10,000
    D: Una descalificación de 5 años
  answer: B
  explanation: En Georgia, es posible perder los privilegios de conducción comercial
    DE POR VIDA tras la condena por ciertos delitos.
- id: 315
  category: sharing_the_road
  question: Cuando se detiene ante un autobús escolar con luces intermitentes, ¿cuándo
    se le permite legalmente reanudar la marcha?
  choices:
    A: Tan pronto como se cierren las puertas del autobús.
    B: Cuando el conductor del autobús le haga una señal para avanzar.
    C: Después de que hayan pasado 60 segundos.
    D: Cuando el autobús se mueva o desactive sus señales Y todos los pasajeros hayan
      despejado la calzada.
  answer: D
  explanation: Después de detenerse ante un autobús escolar, debe permanecer detenido
    hasta que el autobús reanude el movimiento o desactive sus señales de advertencia
    Y todos los pasajeros que suben o bajan hayan despejado la calzada.
- id: 316
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una situación sin condena que resultará en
    la suspensión de sus privilegios de conducción en Georgia?
  choices:
    A: Falta de pago de la manutención de los hijos (Child Support)
    B: Conducción temeraria
    C: Chocar y huir (Hit and run)
    D: Conducir sin seguro
  answer: A
  explanation: Según el manual, el Departamento suspenderá los privilegios de conducción
    en situaciones sin condena, incluyendo la falta de pago de la manutención de los
    hijos. La conducción temeraria, chocar y huir, y conducir sin seguro son suspensiones
    basadas en condenas.
- id: 317
  category: alcohol_drugs_health
  question: Bajo la ley de Consentimiento Implícito de Georgia, ¿cuál es el período
    mínimo de suspensión si se niega a realizarse las pruebas químicas administradas
    por el estado?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: La ley de Georgia le exige someterse a pruebas químicas administradas
    por el estado. Si se niega a estas pruebas, su licencia de conducir de Georgia
    o su privilegio para conducir serán suspendidos por un período mínimo de un año.
- id: 318
  category: alcohol_drugs_health
  question: Después de someterse a las pruebas químicas estatales requeridas para
    detectar alcohol o drogas, ¿se le permite realizarse pruebas adicionales?
  choices:
    A: No, las pruebas adicionales no están permitidas por la ley.
    B: Sí, pero solo si lo ordena un juez.
    C: Sí, a su propio costo y por parte de personal calificado de su elección.
    D: Sí, y el estado cubrirá el costo de las pruebas adicionales.
  answer: C
  explanation: 'El manual establece: "Después de someterse primero a las pruebas estatales
    requeridas, usted tiene derecho a pruebas químicas adicionales de sangre, aliento,
    orina u otras sustancias corporales a su propio costo y por parte de personal
    calificado de su propia elección".'
- id: 319
  category: penalties_and_points
  question: ¿La licencia de conducir de Georgia será suspendida si una persona acumula
    cuántos puntos en un período de 24 meses?
  choices:
    A: 10 puntos o más
    B: 12 puntos o más
    C: 15 puntos o más
    D: 21 puntos o más
  answer: C
  explanation: Las licencias de Georgia se suspenderán para cualquier persona que
    acumule 15 puntos o más en un plazo de 24 meses.
- id: 320
  category: penalties_and_points
  question: ¿Cuántos puntos puede solicitar un residente con licencia de Georgia que
    se reduzcan de su historial de conducción una vez cada 5 años?
  choices:
    A: Hasta 3 puntos
    B: Hasta 5 puntos
    C: Hasta 7 puntos
    D: Hasta 10 puntos
  answer: C
  explanation: Los residentes con licencia de Georgia pueden solicitar que el DDS
    reduzca la cantidad de puntos asignados contra su licencia de conducir de Georgia
    hasta 7 puntos una vez cada 5 años, completando un curso certificado de mejora
    del conductor de 6 horas.
- id: 321
  category: penalties_and_points
  question: Si un acusado completa con éxito un curso certificado de conducción defensiva
    de 6 horas antes de su comparecencia ante el tribunal por una infracción de tránsito
    (moving violation), ¿qué beneficio debe ofrecer el tribunal una vez cada cinco
    años?
  choices:
    A: Una reducción del 50% en la multa y no se asignan puntos.
    B: Una reducción del 20% en la multa y no se asignan puntos.
    C: Desestimación completa de la citación.
    D: Una reducción del 20% en la multa, pero se seguirán asignando puntos.
  answer: B
  explanation: Cuando se presenta el certificado original de finalización ante el
    tribunal, el tribunal deberá reducir la multa impuesta en un 20 por ciento y no
    se asignarán puntos contra el conductor. Esta declaración puede ser aceptada una
    vez cada cinco años.
- id: 322
  category: driver_responsibility
  question: ¿Cuál es el propósito principal de la Ley de Responsabilidad de Seguridad
    de Georgia?
  choices:
    A: Requerir que todos los conductores tomen un curso de conducción defensiva.
    B: Retirar a los conductores irresponsables de las autopistas y proteger a los
      automovilistas asegurados de los automovilistas no asegurados.
    C: Garantizar que todos los vehículos pasen una inspección de seguridad anual.
    D: Ordenar el uso de sistemas de retención infantil en todos los vehículos.
  answer: B
  explanation: 'El manual establece: "El propósito de esta ley es retirar a los conductores
    irresponsables de las autopistas de Georgia y proteger a los automovilistas asegurados
    de los automovilistas no asegurados".'
- id: 323
  category: penalties_and_points
  question: ¿En qué plazo de tiempo se declarará a un conductor como Infractor Habitual
    (Habitual Violator) y se le revocará la licencia tras la tercera condena por ciertos
    delitos graves?
  choices:
    A: 2 años
    B: 3 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: Su licencia de conducir será revocada si se le declara Infractor Habitual
    basándose en la tercera condena de cualquier combinación de delitos específicos
    (como DUI, chocar y huir, o carreras) en un plazo de 5 años.
- id: 324
  category: penalties_and_points
  question: ¿Cómo maneja el Departamento de Servicios al Conductor de Georgia (DDS)
    las condenas de tráfico fuera del estado para los residentes de Georgia?
  choices:
    A: Se ignoran a menos que involucren un DUI.
    B: Se colocan en el historial de conducción y se tratan como si hubieran ocurrido
      en Georgia.
    C: Resultan en una carta de advertencia pero no se asignan puntos.
    D: Solo se registran si el conductor posee una licencia de conducir comercial.
  answer: B
  explanation: Las condenas reportadas al DDS de Georgia por las autoridades de licencias
    o los tribunales de otros estados se colocarán en el historial de conducción de
    un titular de licencia de Georgia. El Departamento tratará dichas condenas como
    si hubieran ocurrido en este estado.
- id: 325
  category: license_system
  question: ¿Cuál de las siguientes situaciones resultará en la revocación obligatoria
    de su licencia de conducir de Georgia?
  choices:
    A: Negarse a someterse a un reexamen de habilidades o conocimientos de conducción
      después de recibir una notificación.
    B: Recibir una sola multa por exceso de velocidad de 15 mph sobre el límite.
    C: No pagar una multa de estacionamiento en un plazo de 30 días.
    D: Acumular 3 puntos en su historial de conducción.
  answer: A
  explanation: Su licencia de conducir será revocada en Georgia por negarse a someterse
    a un reexamen de las habilidades de conducción o del conocimiento de las reglas
    de tránsito después de recibir una notificación que proporcione motivos razonables
    para tal solicitud.
- id: 326
  category: penalties_and_points
  question: Para las personas menores de 21 años, ¿cómo se trata una declaración de
    nolo contendere a efectos de imponer suspensiones de licencia?
  choices:
    A: Se ignora.
    B: Resulta en la asignación de la mitad de los puntos normales.
    C: Se considera una condena.
    D: Requiere que el conductor vuelva a realizar el examen práctico.
  answer: C
  explanation: Según el manual, una declaración de nolo contendere se considera una
    condena a efectos de imponer las suspensiones que se aplican a las personas menores
    de 21 años.
- id: 327
  category: driver_responsibility
  question: Bajo la Ley de Responsabilidad de Seguridad, si se presenta una reclamación
    en su contra por daños resultantes de un choque, ¿cómo puede evitar la suspensión
    de la licencia?
  choices:
    A: Ignorando la reclamación durante 30 días.
    B: Haciendo que su compañía de seguros presente el Formulario SR-21 que demuestre
      que tenía cobertura de responsabilidad civil en el momento del choque.
    C: Entregando la placa de su vehículo.
    D: Pagando una tarifa de Super Infractor de Velocidad (Super Speeder).
  answer: B
  explanation: Para evitar la suspensión bajo la Ley de Responsabilidad de Seguridad,
    puede hacer que su compañía de seguros presente el Formulario SR-21 ante el DDS
    si estaba cubierto por un seguro de responsabilidad civil en el momento del choque.
- id: 328
  category: penalties_and_points
  question: ¿Por la condena de cuál de los siguientes delitos está obligado el Departamento
    por ley a suspender los privilegios de conducción de un individuo?
  choices:
    A: Conducir sin seguro
    B: Exceso de velocidad de 10 mph sobre el límite
    C: Estacionamiento inadecuado
    D: No usar una señal de giro
  answer: A
  explanation: El manual enumera "Conducir sin seguro" como uno de los delitos por
    los cuales el Departamento está obligado por ley a suspender los privilegios de
    un individuo tras una condena.
- id: 329
  category: penalties_and_points
  question: Si se le declara Infractor Habitual (Habitual Violator), ¿cuándo podría
    ser elegible para una Licencia Probatoria?
  choices:
    A: Inmediatamente a petición del interesado
    B: Después de cumplir seis meses del período de revocación
    C: Después de cumplir dos años del período de revocación
    D: Después de cumplir cinco años del período de revocación
  answer: C
  explanation: Según el manual, si se le declara Infractor Habitual, puede ser elegible
    para una Licencia Probatoria después de cumplir dos años del período de revocación.
- id: 330
  category: license_system
  question: ¿Cuál es la tarifa para obtener un permiso de conducción limitado durante
    un período de suspensión?
  choices:
    A: $20
    B: $32
    C: $50
    D: $75
  answer: B
  explanation: El manual establece que, en algunas situaciones, puede estar disponible
    un permiso de conducción limitado por una tarifa de $32 durante el período de
    suspensión.
- id: 331
  category: penalties_and_points
  question: ¿Son válidos los permisos de conducción limitados para operar un vehículo
    comercial?
  choices:
    A: Sí, pero solo para fines de empleo
    B: Sí, si lo aprueba un juez de un tribunal de sentencia
    C: No, nunca son válidos para conducir un vehículo comercial
    D: No, a menos que esté transportando materiales no peligrosos
  answer: C
  explanation: 'El manual establece explícitamente: "Los permisos de conducción limitados
    no son válidos para conducir un vehículo comercial".'
- id: 332
  category: penalties_and_points
  question: ¿Cuál es la sanción si se le condena por violar cualquiera de las condiciones
    o restricciones de su permiso de conducción limitado?
  choices:
    A: Su permiso se suspende por 30 días
    B: Debe pagar una tarifa adicional de $32
    C: Su suspensión subyacente se extiende por 6 meses adicionales
    D: Recibe una descalificación de por vida de los privilegios de conducir
  answer: C
  explanation: El manual establece que una condena por violar las condiciones del
    permiso revocará el permiso y extenderá la suspensión subyacente de su privilegio
    de conducir por 6 meses adicionales.
- id: 333
  category: penalties_and_points
  question: ¿En cuál de las siguientes situaciones NO está disponible un permiso de
    conducción limitado?
  choices:
    A: Primer DUI (no relacionado con drogas)
    B: Incumplimiento del pago de la manutención infantil
    C: Segunda condena por DUI en 5 años
    D: Primera suspensión por acumulación de 15 puntos
  answer: B
  explanation: Según el manual, los permisos de conducción limitados no están disponibles
    para condenas como el "Incumplimiento del pago de la manutención infantil".
- id: 334
  category: penalties_and_points
  question: ¿Por cuánto tiempo se descalificarán sus privilegios de conducción comercial
    por una primera condena de una infracción de tráfico grave?
  choices:
    A: 60 días
    B: 120 días
    C: 6 meses
    D: Un año
  answer: D
  explanation: El manual establece que los privilegios de conducción comercial de
    cualquier persona condenada por una infracción de tráfico grave serán descalificados
    por un año.
- id: 335
  category: alcohol_drugs_health
  question: Conducir un Vehículo Motorizado Comercial (CMV) se considera una infracción
    de tráfico grave si su concentración de alcohol en sangre (BAC) es igual o superior
    a ¿qué nivel?
  choices:
    A: .02 gm.
    B: .04 gm.
    C: .06 gm.
    D: .08 gm.
  answer: B
  explanation: El manual enumera "Conducir un CMV si su BAC es de .04 gm. o superior"
    como una infracción de tráfico grave.
- id: 336
  category: penalties_and_points
  question: Si se le condena por una infracción de tráfico grave mientras opera un
    CMV con carteles de materiales peligrosos, ¿cuánto tiempo dura la descalificación
    por una primera infracción?
  choices:
    A: Al menos un año
    B: Al menos dos años
    C: Al menos tres años
    D: De por vida
  answer: C
  explanation: Si es condenado por una infracción de tráfico grave mientras opera
    un CMV con carteles de materiales peligrosos, será descalificado para conducir
    un CMV durante al menos tres años por una primera infracción.
- id: 337
  category: penalties_and_points
  question: ¿Cuál es la sanción por una segunda condena de un incidente separado de
    cualquier infracción de tráfico grave?
  choices:
    A: Una descalificación de 3 años de los privilegios de conducción comercial
    B: Una descalificación de 5 años de los privilegios de conducción comercial
    C: Una descalificación de 10 años de los privilegios de conducción comercial
    D: Una descalificación de por vida de los privilegios de conducción comercial
  answer: D
  explanation: 'El manual establece: "Una segunda condena de un incidente separado
    de cualquiera de estas infracciones de tráfico graves resultará en una descalificación
    de por vida de los privilegios de conducción comercial".'
- id: 338
  category: safe_driving_rules
  question: ¿Cuál de las siguientes infracciones por exceso de velocidad se define
    como una "infracción de tráfico seria"?
  choices:
    A: Exceso de velocidad de 5 o más millas por hora por encima del límite de velocidad
      indicado
    B: Exceso de velocidad de 10 o más millas por hora por encima del límite de velocidad
      indicado
    C: Exceso de velocidad de 15 o más millas por hora por encima del límite de velocidad
      indicado
    D: Exceso de velocidad de 20 o más millas por hora por encima del límite de velocidad
      indicado
  answer: C
  explanation: El manual define el "Exceso de velocidad de 15 o más millas por hora
    por encima del límite de velocidad indicado" como una infracción de tráfico seria.
- id: 339
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por una condena por delito grave que involucre la
    fabricación o el tráfico de una sustancia controlada utilizando un Vehículo Motorizado
    Comercial (CMV)?
  choices:
    A: Descalificación de 1 año
    B: Descalificación de 3 años
    C: Descalificación de 5 años
    D: Descalificación de por vida
  answer: D
  explanation: Una condena por delito grave que involucre la fabricación, distribución,
    tráfico o posesión de una sustancia controlada o marihuana utilizando un CMV resulta
    en una descalificación de por vida de los privilegios de conducción comercial.
- id: 340
  category: penalties_and_points
  question: ¿Cuál es el período de descalificación por una primera infracción de violar
    una orden de fuera de servicio?
  choices:
    A: 30 a 60 días
    B: 60 a 120 días
    C: No menos de 180 días y no más de un año
    D: No menos de 2 años y no más de 5 años
  answer: C
  explanation: La violación de una orden de fuera de servicio resultará en una descalificación
    de no menos de 180 días y no más de un año por una primera infracción.
- id: 341
  category: license_system
  question: ¿Cuál de las siguientes es una razón permitida para conducir si se le
    ha emitido un permiso de conducción limitado?
  choices:
    A: Ir a un parque recreativo
    B: Asistir a clases en una universidad donde esté inscrito
    C: Visitar amigos o familiares
    D: Realizar recados generales del hogar
  answer: B
  explanation: Un permiso de conducción limitado le permite "asistir a clases en una
    universidad o escuela en la que esté inscrito como estudiante", entre otras tareas
    esenciales específicas como el empleo y la atención médica.
- id: 342
  category: penalties_and_points
  question: ¿Cuál es el período de descalificación por una primera infracción de cruce
    ferroviario a nivel mientras se opera un Vehículo Motorizado Comercial (CMV)?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Según el manual, la condena por cualquier infracción de cruce ferroviario
    a nivel mientras se opera un CMV resultará en una descalificación de 60 días por
    la primera infracción.
- id: 343
  category: driver_responsibility
  question: ¿Bajo qué circunstancias debe notificar inmediatamente a la agencia de
    aplicación de la ley más cercana después de un choque?
  choices:
    A: Solo si alguien fallece o si hay varios vehículos involucrados.
    B: Si alguien resulta herido o fallece, o si los daños a la propiedad superan
      los $500.00.
    C: Si los daños a la propiedad superan los $1,000.00.
    D: Solo si el choque ocurre en una autopista interestatal.
  answer: B
  explanation: El manual establece que debe notificar a la agencia de aplicación de
    la ley más cercana de inmediato si alguien resulta herido o fallece, o si los
    daños a la propiedad superan los $500.00.
- id: 344
  category: driver_responsibility
  question: ¿Qué se requiere si usted choca y daña un vehículo desatendido?
  choices:
    A: Esperar junto al vehículo hasta que regrese el dueño.
    B: Abandonar la escena de inmediato si no hay daños visibles.
    C: Localizar al propietario o dejar su información en un lugar visible donde el
      propietario pueda encontrarla.
    D: Llamar a una grúa para retirar el vehículo desatendido de la calzada.
  answer: C
  explanation: Si daña un vehículo desatendido, debe localizar al propietario o dejar
    su nombre, dirección y el nombre del propietario del vehículo que usted conducía
    en un lugar visible.
- id: 345
  category: safe_driving_rules
  question: ¿Cómo debe advertir a los automovilistas que se aproximan si usted está
    involucrado en un choque?
  choices:
    A: Pararse en medio de la carretera y agitar los brazos.
    B: Activar las luces de emergencia y usar triángulos reflectantes, cuando estén
      disponibles.
    C: Encender y apagar continuamente las luces altas hacia el tráfico que viene
      de frente.
    D: Tocar la bocina continuamente hasta que lleguen los servicios de emergencia.
  answer: B
  explanation: Para advertir a los automovilistas que se aproximan sin poner en peligro
    la seguridad, debe activar las luces de emergencia, si es posible, y utilizar
    triángulos reflectantes cuando estén disponibles.
- id: 346
  category: driver_responsibility
  question: Al ayudar a los heridos en la escena de un choque, ¿cuándo debe mover
    o levantar a una víctima?
  choices:
    A: Inmediatamente, para sacarlos del vehículo dañado.
    B: Solo cuando sea absolutamente necesario.
    C: Siempre que se quejen de dolor de espalda o cuello.
    D: Solo si le piden explícitamente que los mueva.
  answer: B
  explanation: El manejo por parte de personas no capacitadas puede causar lesiones
    adicionales y más graves. El manual aconseja no mover ni levantar a la víctima
    a menos que sea absolutamente necesario.
- id: 347
  category: driver_responsibility
  question: ¿Cómo debe intentar detener una hemorragia grave de una víctima de un
    choque?
  choices:
    A: Aplicar un torniquete apretado por encima de la herida.
    B: Elevar las piernas de la víctima y ofrecerle agua para beber.
    C: Aplicar almohadillas de tela gruesa, lo más limpias posible, con presión manual.
    D: Lavar bien la herida con agua embotellada.
  answer: C
  explanation: El manual indica que se debe detener una hemorragia grave con almohadillas
    de tela gruesa, lo más limpias posible, aplicadas con presión manual.
- id: 348
  category: driver_responsibility
  question: ¿Qué protección brinda la Ley del Buen Samaritano de Georgia?
  choices:
    A: Exige que todos los conductores lleven un botiquín de primeros auxilios en
      su vehículo.
    B: Exime de responsabilidad por daños civiles a cualquier persona que preste cuidados
      de emergencia.
    C: Ordena que los conductores deben transportar a los heridos al hospital más
      cercano.
    D: Proporciona compensación financiera a quienes ayudan en la escena de un choque.
  answer: B
  explanation: Georgia tiene una Ley del Buen Samaritano que exime de responsabilidad
    por daños civiles a cualquier persona como resultado de cualquier acto u omisión
    al prestar cuidados de emergencia.
- id: 349
  category: safe_driving_rules
  question: En una carretera de varios carriles, ¿cuándo es su deber retirar su vehículo
    de la calzada después de un choque?
  choices:
    A: Cuando no haya lesiones graves o muertes aparentes, y el vehículo pueda conducirse
      de forma normal y segura.
    B: Solo después de que la policía haya llegado y tomado fotografías de la escena.
    C: Siempre que el daño a la propiedad se estime en menos de $500.
    D: Nunca debe mover su vehículo hasta que llegue una grúa.
  answer: A
  explanation: Si no hay lesiones graves o muertes aparentes, es deber de los conductores
    mover sus vehículos a un lugar seguro si los vehículos pueden ser conducidos de
    manera normal y exitosa.
- id: 350
  category: driver_responsibility
  question: 'Si mueve su vehículo a un lugar seguro después de un choque menor en
    una autopista, usted:'
  choices:
    A: Será considerado automáticamente culpable del choque.
    B: Pierde su derecho a presentar un informe policial por escrito.
    C: Puede ser acusado de no detenerse y proporcionar información.
    D: No será considerado culpable simplemente por haber movido el vehículo.
  answer: D
  explanation: Los conductores que tomen la medida de mover sus vehículos no serán
    considerados culpables simplemente por haberlos movido, ni esto afecta su capacidad
    para presentar un informe por escrito.
- id: 351
  category: defensive_driving
  question: ¿Qué debe hacer si un ciervo cruza la carretera delante de su vehículo?
  choices:
    A: Acelerar para pasar al ciervo rápidamente antes de que cambie de dirección.
    B: Reducir la velocidad, ya que los ciervos suelen viajar en grupos y otro podría
      venir detrás.
    C: Virar bruscamente hacia el carril contrario para evitar golpear al animal.
    D: Apagar las luces delanteras para que el ciervo pueda ver mejor su entorno.
  answer: B
  explanation: Siempre reduzca la velocidad cuando un ciervo cruce la carretera delante
    de usted. Los ciervos suelen viajar en grupos y es probable que haya otro siguiéndolo
    de cerca.
- id: 352
  category: defensive_driving
  question: Si ve un ciervo a un lado de la carretera por la noche, ¿qué acción debe
    tomar con respecto a sus luces delanteras?
  choices:
    A: Cambiar a luces altas para ver al ciervo con más claridad.
    B: Apagar las luces delanteras por completo hasta que pase al ciervo.
    C: Parpadear las luces delanteras y cambiar a luces bajas para no cegar al ciervo.
    D: Mantener las luces altas y tocar la bocina continuamente.
  answer: C
  explanation: Si se avista un ciervo en la carretera o a un lado de ella por la noche,
    el conductor debe reducir la velocidad de inmediato, parpadear las luces delanteras
    y cambiar a luces bajas para no cegar al animal.
- id: 353
  category: defensive_driving
  question: ¿Por qué nunca debe virar bruscamente para evitar a un ciervo en la carretera?
  choices:
    A: Virar bruscamente es ilegal en las carreteras rurales de Georgia.
    B: Puede causar que choque con otro vehículo o se salga de la calzada, provocando
      más daños.
    C: Los ciervos se sienten atraídos naturalmente por los vehículos que viran bruscamente.
    D: Virar bruscamente activará automáticamente las bolsas de aire de su vehículo.
  answer: B
  explanation: Nunca vire bruscamente para evitar a un ciervo. Esta acción puede causar
    que choque con otro vehículo o se salga de la calzada, provocando más daños o
    lesiones graves.
- id: 354
  category: defensive_driving
  question: ¿Durante qué meses están más activos los ciervos debido a su temporada
    alta de apareamiento?
  choices:
    A: Enero, febrero y marzo
    B: Abril, mayo y junio
    C: Julio, agosto y septiembre
    D: Octubre, noviembre y diciembre
  answer: D
  explanation: Los ciervos están más activos en los meses de otoño de octubre, noviembre
    y diciembre durante la temporada alta de apareamiento.
- id: 355
  category: defensive_driving
  question: ¿En qué momentos del día se ven habitualmente ciervos a lo largo de la
    carretera?
  choices:
    A: Solo durante la mitad del día.
    B: En las primeras horas de la mañana y al atardecer.
    C: Exclusivamente entre la medianoche y las 3:00 AM.
    D: Solo durante el tráfico de la hora pico de la tarde.
  answer: B
  explanation: Los ciervos se ven habitualmente a lo largo de la carretera durante
    las primeras horas de la mañana y al atardecer.
- id: 356
  category: driver_responsibility
  question: ¿Cuál de la siguiente información está obligado a intercambiar con el
    otro conductor después de un choque?
  choices:
    A: Nombre, dirección, número de placa y número de licencia de conducir.
    B: Nombre, número de teléfono, límite de la póliza de seguro y número de identificación
      del vehículo (VIN).
    C: Dirección, número de seguro social y número de placa.
    D: Número de licencia de conducir, fecha de nacimiento y marca y modelo del vehículo.
  answer: A
  explanation: Si se ve involucrado en un choque, debe dar su nombre, dirección, número
    de placa y número de licencia de conducir a cualquier otra persona involucrada,
    y obtener lo mismo de ellos.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 357
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 358
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 359
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 360
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de sentido único (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 361
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 362
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 363
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 364
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de "ZONA DE NO REBASAR"
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 365
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "MANTÉNGASE A LA DERECHA" (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 366
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 367
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 368
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 369
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 370
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla circular?
  choices:
    A: Una glorieta más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal amarilla circular con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 371
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 372
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 373
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 374
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino gire primero
    en un sentido y luego en el otro.
  id: 375
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 376
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 377
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 378
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 379
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Una zona de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 380
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: Tráfico de doble sentido más adelante — el tráfico circula en ambas direcciones
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que circulan en dirección opuesta.
  id: 381
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 382
- image: hill.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 383
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un puesto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está roja o amarilla. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 384
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 385
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 386
- image: side_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la autopista desde la calle lateral.
  id: 387
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril — no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir que los vehículos se incorporen (merging). El tráfico
    que entra desde la rampa tiene su propio carril nuevo.
  id: 388
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer de pie o al ralentí
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 389
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 390
