metadata:
  source: Manitoba Driver Handbook
  total_questions: 237
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Manitoba, what is the minimum age to apply for a Class 5 Learner's
    license if you are enrolled in a High School Driver Education Course?
  choices:
    A: 15 years
    B: 15.5 years
    C: 16 years
    D: 14.5 years
  answer: B
  explanation: In Manitoba, the minimum age for a Class 5 Learner's license is 16,
    but it is reduced to 15.5 years if the applicant is enrolled in an MPI-approved
    High School Driver Education Course.
- id: 2
  category: license_system
  question: How long must a driver remain in the Learner (L) stage of the Graduated
    Driver Licensing (GDL) program before they are eligible for a road test?
  choices:
    A: 6 months
    B: 12 months
    C: 9 months
    D: 15 months
  answer: C
  explanation: Drivers in Manitoba must hold a Learner's license for a minimum of
    nine months of 'active' driving before they can take the road test to move to
    the Intermediate stage.
- id: 3
  category: license_system
  question: What is the maximum Blood Alcohol Concentration (BAC) allowed for a driver
    in the Learner or Intermediate stage of the GDL program?
  choices:
    A: '0.00'
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: A
  explanation: Manitoba has a zero-tolerance policy for alcohol for all drivers in
    the GDL program; the BAC must be 0.00.
- id: 4
  category: license_system
  question: A supervising driver for a person with a Class 5 Learner's license must
    have held a valid Class 5 Full (F) license for at least how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: The supervising driver must have held a valid Class 5 Full license
    for at least three years and must sit in the front passenger seat.
- id: 5
  category: license_system
  question: In the Intermediate (I) stage of the GDL program, what are the passenger
    restrictions between midnight and 5:00 AM?
  choices:
    A: No passengers allowed
    B: Only one passenger is allowed, unless there is a supervising driver in the
      front seat
    C: Only family members are allowed
    D: Up to three passengers are allowed
  answer: B
  explanation: Between midnight and 5:00 AM, an Intermediate driver is limited to
    one passenger in the front seat, unless accompanied by a supervising driver.
- id: 6
  category: license_system
  question: How long is the mandatory Intermediate (I) stage in Manitoba's GDL program?
  choices:
    A: 9 months
    B: 12 months
    C: 15 months
    D: 24 months
  answer: C
  explanation: The Intermediate stage lasts for a minimum of 15 months. After successfully
    completing this stage, the driver graduates to the Full stage.
- id: 7
  category: license_system
  question: Once you graduate to the Full (F) stage, how long must you maintain a
    0.00 BAC level?
  choices:
    A: For the first 12 months
    B: For the first 24 months
    C: For the first 36 months
    D: Indefinitely
  answer: C
  explanation: In Manitoba, even after reaching the Full stage, drivers must maintain
    a 0.00 BAC for the first 36 months.
- id: 8
  category: license_system
  question: If you fail the Class 5 knowledge test, how long must you wait before
    you can take it again?
  choices:
    A: 24 hours
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: In Manitoba, if you fail a knowledge test or a road test, there is
    a mandatory 7-day waiting period before you can attempt the test again.
- id: 9
  category: license_system
  question: Under the Driver Safety Rating (DSR) system, what is the maximum number
    of points a driver can reach on the merit side of the scale?
  choices:
    A: '+10'
    B: '+15'
    C: '+17'
    D: '+20'
  answer: C
  explanation: The Driver Safety Rating scale in Manitoba ranges from -20 (highest
    risk) to +17 (lowest risk).
- id: 10
  category: license_system
  question: Within how many days must you notify Manitoba Public Insurance (MPI) of
    a change in your name or address?
  choices:
    A: 7 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: Manitoba law requires drivers to notify MPI of any change of name or
    address within 15 days.
- id: 11
  category: license_system
  question: Which of the following is a requirement for a Learner (L) stage driver
    regarding electronic communication devices?
  choices:
    A: They can use hands-free devices only
    B: They can use a cell phone only for GPS
    C: They are strictly prohibited from using any hand-held or hands-free electronic
      devices
    D: They can use cell phones while stopped at a red light
  answer: C
  explanation: Drivers in the Learner and Intermediate stages of the GDL program are
    prohibited from using any cellular phone or other hand-held or hands-free electronic
    devices while driving.
- id: 12
  category: license_system
  question: What is the minimum number of documents required to prove your identity
    and residency when applying for a Manitoba driver's license for the first time?
  choices:
    A: One document
    B: Two documents
    C: Three documents
    D: Four documents
  answer: B
  explanation: You must provide at least two documents that prove your identity, your
    birth date, and that you are a resident of Manitoba.
- id: 13
  category: license_system
  question: If a GDL driver violates any of the conditions of their license, what
    is the potential consequence for a first offence?
  choices:
    A: A warning only
    B: A mandatory $1,000 fine
    C: License suspension and a move down the Driver Safety Rating scale
    D: Immediate permanent revocation of the license
  answer: C
  explanation: Violating GDL conditions can result in a license suspension, fines,
    and a reduction in your Driver Safety Rating (DSR) score.
- id: 14
  category: license_system
  question: In the Learner (L) stage, who is allowed to be in the vehicle besides
    the driver and the supervising driver?
  choices:
    A: Immediate family members only
    B: No other passengers are allowed
    C: Up to two friends
    D: Anyone, as long as there are seatbelts
  answer: B
  explanation: In the Learner stage, the only passenger allowed in the vehicle is
    the supervising driver.
- id: 15
  category: license_system
  question: After moving to Manitoba, how long does a new resident have to exchange
    their out-of-province driver's license for a Manitoba license?
  choices:
    A: 30 days
    B: 60 days
    C: 3 months
    D: 6 months
  answer: C
  explanation: New residents to Manitoba who hold a valid out-of-province driver's
    license may drive for up to three months before they must switch to a Manitoba
    driver's license.
- id: 16
  category: license_system
  question: A person holding a Class 5 driver's license in Manitoba is permitted to
    tow a trailer provided the trailer's weight does not exceed what limit?
  choices:
    A: 2,500 kg
    B: 4,540 kg
    C: 5,000 kg
    D: 7,250 kg
  answer: B
  explanation: A Class 5 license allows the operation of a passenger vehicle and the
    towing of a trailer up to 4,540 kg (10,000 lbs).
- id: 17
  category: license_system
  question: If you fail a Class 5 road test in Manitoba, what is the minimum waiting
    period before you are eligible to take the test again?
  choices:
    A: 7 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: C
  explanation: In Manitoba, if you fail a road test, you must wait a minimum of 14
    days before you are eligible to attempt the test again.
- id: 18
  category: license_system
  question: Under the Driver Safety Rating (DSR) system, how many points will a driver
    move down the scale for each at-fault accident they are involved in?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 10 points
  answer: C
  explanation: Drivers in Manitoba move down the DSR scale by 5 points for every at-fault
    accident they are responsible for.
- id: 19
  category: license_system
  question: Which of the following vehicles can be operated by someone holding a valid
    Class 5 Manitoba driver's license?
  choices:
    A: A motorcycle
    B: A moped
    C: A taxi (while carrying passengers)
    D: An ambulance
  answer: B
  explanation: A Class 5 license allows the holder to operate a moped. Operating a
    motorcycle requires a Class 6, and taxis or ambulances require a Class 4.
- id: 20
  category: license_system
  question: When must a Manitoba driver report a medical condition that may affect
    their ability to drive safely to Manitoba Public Insurance (MPI)?
  choices:
    A: Only when renewing their license
    B: Within 30 days of the diagnosis
    C: Immediately
    D: Only if requested by a doctor
  answer: C
  explanation: Drivers are legally required to immediately report any medical condition
    or physical disability that may affect their ability to drive safely to the Driver
    Fitness department of MPI.
- id: 21
  category: license_system
  question: In Manitoba, if a driver's BAC is between 0.05 and 0.079 (the 'warning'
    range), what is the length of the immediate roadside license suspension for a
    first-time occurrence?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 7 days
  answer: C
  explanation: Under Manitoba's Tiered Administrative License Suspension, a first-time
    occurrence of driving with a BAC between 0.05 and 0.079 results in an immediate
    72-hour driver's license suspension.
- id: 22
  category: license_system
  question: In the Intermediate (I) stage of the GDL program, how many passengers
    are allowed in the front seat of the vehicle?
  choices:
    A: None
    B: Only one
    C: Two, if they are family members
    D: As many as there are seatbelts
  answer: B
  explanation: In the Intermediate stage, the driver is restricted to only one passenger
    in the front seat, regardless of the time of day.
- id: 23
  category: license_system
  question: When appearing for a road test in Manitoba, what document must be presented
    for the vehicle being used?
  choices:
    A: The vehicle's bill of sale
    B: A valid vehicle registration certificate
    C: A mechanic's safety certificate
    D: The vehicle's owner's manual
  answer: B
  explanation: For a road test, the vehicle must be in safe working condition and
    you must provide a valid vehicle registration certificate showing the vehicle
    is properly insured.
- id: 24
  category: license_system
  question: Which license class is required in Manitoba to operate a taxi, ambulance,
    or a bus with a seating capacity of up to 24 passengers?
  choices:
    A: Class 3
    B: Class 4
    C: Class 5
    D: Class 1
  answer: B
  explanation: A Class 4 license is required to operate taxis, ambulances, and small
    buses (up to 24 passengers) in Manitoba.
- id: 25
  category: license_system
  question: Where must the supervising driver be positioned when a Learner (L) stage
    driver is operating a Class 5 vehicle?
  choices:
    A: Anywhere in the vehicle
    B: Directly behind the driver
    C: In the front passenger seat
    D: In the seat closest to the driver
  answer: C
  explanation: The supervising driver for a Learner must occupy the front passenger
    seat and be conscious and capable of taking control of the vehicle if necessary.
- id: 26
  category: license_system
  question: Under the Driver Safety Rating (DSR) system, how many points does a driver
    typically lose for most traffic convictions (e.g., speeding, failing to stop)?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: Most common traffic convictions in Manitoba result in a 2-point drop
    on the Driver Safety Rating (DSR) scale.
- id: 27
  category: license_system
  question: In Manitoba, participation in the Ignition Interlock Program is mandatory
    for which of the following drivers?
  choices:
    A: Any driver in the GDL program
    B: Drivers convicted of an impaired driving offence
    C: Drivers who have reached -10 on the DSR scale
    D: Drivers who fail a road test three times
  answer: B
  explanation: The Ignition Interlock Program is mandatory for drivers convicted of
    certain alcohol-related Criminal Code driving offences or for those who have multiple
    roadside suspensions.
- id: 28
  category: license_system
  question: How often must a Manitoba driver's license be fully renewed (including
    a new photo)?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Every 10 years
  answer: C
  explanation: While payments and information updates happen annually, a Manitoba
    driver's license must be fully renewed with a new photo every five years.
- id: 29
  category: driver_testing
  question: To meet the minimum vision requirements for a Class 5 license in Manitoba,
    what must your visual acuity be in your best eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/60
  answer: C
  explanation: According to Manitoba Public Insurance (MPI) standards, an applicant
    must have a minimum visual acuity of 20/40 in their better eye, with or without
    corrective lenses.
- id: 30
  category: driver_testing
  question: During a Manitoba road test, if your vehicle's brake lights are not working,
    what will happen?
  choices:
    A: The examiner will give you a warning and proceed.
    B: The test will be cancelled and you must rebook.
    C: You will be allowed to use hand signals instead.
    D: You will lose 10 points but continue the test.
  answer: B
  explanation: For a road test in Manitoba, the vehicle must be in safe working condition.
    If equipment like brake lights or signal lights are non-functional, the test is
    cancelled for safety reasons.
- id: 31
  category: driver_testing
  question: What is the maximum discount a driver can receive on their vehicle premium
    at the top of the Driver Safety Rating (DSR) scale (Level 15 or higher)?
  choices:
    A: 25%
    B: 33%
    C: 40%
    D: 50%
  answer: B
  explanation: Drivers at Level 15 or higher on the DSR scale are eligible for the
    maximum discount of 33% on their vehicle insurance premiums.
- id: 32
  category: driver_testing
  question: If you develop a medical condition that may affect your ability to drive
    safely, when must you report it to MPI?
  choices:
    A: At your next license renewal
    B: Within 30 days
    C: Immediately
    D: Only if you are involved in an accident
  answer: C
  explanation: Manitoba law requires drivers to immediately report any medical condition
    or physical disability that may interfere with the safe operation of a motor vehicle.
- id: 33
  category: driver_testing
  question: Manitoba's 'Personal Injury Protection Plan' (PIPP) provides coverage
    for which of the following?
  choices:
    A: Only the driver at fault
    B: Only pedestrians hit by a vehicle
    C: All Manitoba residents injured in a vehicle accident, regardless of fault
    D: Only vehicle damage
  answer: C
  explanation: PIPP is a no-fault insurance system in Manitoba that provides all residents
    with coverage for injury or death resulting from a vehicle accident, regardless
    of who was responsible.
- id: 34
  category: driver_testing
  question: When arriving for a scheduled road test in Manitoba, how early should
    you arrive at the testing center?
  choices:
    A: 5 minutes before
    B: 15 minutes before
    C: 30 minutes before
    D: 1 hour before
  answer: B
  explanation: MPI recommends arriving 15 minutes before your scheduled road test
    appointment to allow time for check-in and document verification.
- id: 35
  category: driver_testing
  question: Under Manitoba's GDL program, what is the restriction regarding drugs
    (such as THC) for drivers in the Learner or Intermediate stage?
  choices:
    A: They must be under the legal limit for impairment.
    B: They must have a zero-presence of drugs in their system.
    C: They can only have drugs if they have a medical prescription.
    D: There are no specific drug restrictions, only alcohol.
  answer: B
  explanation: Manitoba has a zero-tolerance policy for drugs for all GDL drivers.
    There must be zero-presence of any drug in their system while operating a vehicle.
- id: 36
  category: driver_testing
  question: A standard Manitoba Class 5 license allows you to operate a vehicle with
    a maximum seating capacity of how many people (including the driver)?
  choices:
    A: '5'
    B: '10'
    C: '15'
    D: '24'
  answer: B
  explanation: A Class 5 license in Manitoba permits the operation of a passenger
    car or a bus with a seating capacity of not more than 10 people including the
    driver.
- id: 37
  category: driver_testing
  question: What is the minimum amount of Third-Party Liability coverage included
    in Manitoba's Basic Autopac insurance?
  choices:
    A: $100,000
    B: $200,000
    C: $500,000
    D: $1,000,000
  answer: B
  explanation: Basic Autopac in Manitoba includes a minimum of $200,000 in Third-Party
    Liability coverage to protect the driver if they are sued for property damage
    or for injury/death occurring outside of Manitoba.
- id: 38
  category: driver_testing
  question: To pass the vision test for a Class 5 license in Manitoba, your horizontal
    field of vision must be at least how many degrees?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 180 degrees
  answer: C
  explanation: Manitoba requires a continuous horizontal field of vision of at least
    120 degrees to qualify for a Class 5 driver's license.
- id: 39
  category: driver_testing
  question: On the Manitoba Driver Safety Rating (DSR) scale, what is the 'Base' level
    for a new driver or someone with a neutral record?
  choices:
    A: Level -5
    B: Level 0
    C: Level 5
    D: Level 10
  answer: B
  explanation: Level 0 is the 'Base' level on the DSR scale. Drivers move up for years
    of safe driving and down for convictions or at-fault accidents.
- id: 40
  category: driver_testing
  question: In Manitoba, if you refuse to provide a breath or blood sample to a peace
    officer, what is the immediate administrative penalty?
  choices:
    A: A 24-hour suspension
    B: A 7-day suspension
    C: An immediate 3-month (90-day) license suspension
    D: There is no immediate penalty until you go to court
  answer: C
  explanation: Refusing to provide a breath or blood sample in Manitoba results in
    an immediate 90-day Administrative Driver's License Suspension, similar to failing
    a breathalyzer test.
- id: 41
  category: driver_testing
  question: When registering a vehicle in Manitoba that was previously registered
    in another province, what document is generally required to prove the vehicle
    is safe?
  choices:
    A: A Bill of Sale only
    B: A valid Certificate of Inspection (COI)
    C: An out-of-province registration card
    D: A letter from the previous owner
  answer: B
  explanation: Most vehicles being registered in Manitoba from another jurisdiction
    must pass a safety inspection and be issued a valid Manitoba Certificate of Inspection
    (COI).
- id: 42
  category: driver_testing
  question: What is the minimum visual acuity required in your best eye (with or without
    corrective lenses) to qualify for a Class 5 driver's license in Manitoba?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/60
  answer: C
  explanation: In Manitoba, the minimum vision standard for a Class 5 license is a
    visual acuity of at least 20/40 in the better eye.
- id: 43
  category: driver_testing
  question: Which of the following vehicle defects will result in the immediate cancellation
    of a scheduled road test in Manitoba?
  choices:
    A: A small chip in the windshield on the passenger side
    B: A non-functioning horn
    C: Low windshield washer fluid
    D: An empty glove compartment
  answer: B
  explanation: For a road test, the vehicle must be in safe working condition. A non-functioning
    horn is a safety defect that will cause the test to be cancelled.
- id: 44
  category: driver_testing
  question: Under Manitoba's Driver Safety Rating (DSR) system, how many points do
    you move down the scale for most common traffic convictions, such as speeding
    or failing to stop at a red light?
  choices:
    A: 1 point
    B: 2 points
    C: 5 points
    D: 10 points
  answer: B
  explanation: Most traffic convictions result in a 2-point drop on the Driver Safety
    Rating scale in Manitoba.
- id: 45
  category: driver_testing
  question: What is the minimum score required to pass the Manitoba Class 5 knowledge
    test?
  choices:
    A: 70% (21 out of 30)
    B: 75% (23 out of 30)
    C: 80% (24 out of 30)
    D: 90% (27 out of 30)
  answer: C
  explanation: The Manitoba knowledge test consists of 30 questions, and you must
    answer at least 24 correctly (80%) to pass.
- id: 46
  category: driver_testing
  question: In Manitoba, what is the immediate roadside license suspension period
    for a first-time conviction of using a hand-held electronic device while driving?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: Manitoba law mandates an immediate 3-day driver's license suspension
    for a first-time conviction of using a hand-held electronic device while driving.
- id: 47
  category: driver_testing
  question: If you are a new resident to Manitoba and hold a valid out-of-province
    driver's license, you must also provide which of the following to obtain a Manitoba
    license?
  choices:
    A: A letter of recommendation from your previous insurer
    B: Proof of full-time employment in Manitoba
    C: Proof of identity, entitlement to be in Canada, and Manitoba residency
    D: A certified copy of your birth certificate translated into French
  answer: C
  explanation: All applicants must provide documents proving their legal identity,
    their right to be in Canada, and that they are currently residing in Manitoba.
- id: 48
  category: driver_testing
  question: 'A Class 5 license in Manitoba allows you to operate a bus only if it
    is not carrying passengers and has a maximum seating capacity of:'
  choices:
    A: 10 people
    B: 15 people
    C: 24 people
    D: 40 people
  answer: C
  explanation: A Class 5 license holder may operate a bus with a seating capacity
    of not more than 24 passengers (while not carrying passengers).
- id: 49
  category: driver_testing
  question: If your driver's license has been suspended for more than two years, what
    must you do to regain your driving privileges in Manitoba?
  choices:
    A: Simply pay a reinstatement fee
    B: Wait an additional year without driving
    C: Write a letter of appeal to the Driver and Vehicle Licensing office
    D: Re-take the knowledge, vision, and road tests
  answer: D
  explanation: If a license has been suspended or invalid for more than two years,
    the individual must successfully complete the knowledge, vision, and road tests
    again.
- id: 50
  category: driver_testing
  question: In Manitoba, what is the minimum field of vision required to hold a Class
    5 license?
  choices:
    A: 90 degrees
    B: 120 degrees
    C: 150 degrees
    D: 180 degrees
  answer: B
  explanation: Manitoba requires a continuous horizontal field of vision of at least
    120 degrees for a Class 5 license.
- id: 51
  category: driver_testing
  question: Which of the following is an automatic failure during the Manitoba road
    test?
  choices:
    A: Failing to use a turn signal once
    B: Adjusting your mirrors while stopped
    C: Mounting the curb while parking
    D: Driving 5 km/h below the speed limit
  answer: C
  explanation: Striking or mounting a curb is considered a lack of control and results
    in an automatic failure during the road test.
- id: 52
  category: driver_testing
  question: When applying for a Manitoba driver's license, if you cannot provide a
    primary identity document, who can act as a guarantor to verify your identity?
  choices:
    A: Any person over the age of 18
    B: A family member who lives at the same address
    C: An individual from an authorized professional list who has known you for at
      least two years
    D: Your high school driving instructor
  answer: C
  explanation: A guarantor must be a person from an MPI-approved professional list
    (like a doctor or lawyer) who has known the applicant for at least two years.
- id: 53
  category: driver_testing
  question: To operate a vehicle equipped with air brakes in Manitoba, a Class 5 driver
    must have which endorsement on their license?
  choices:
    A: Endorsement A
    B: Endorsement I
    C: Endorsement S
    D: Endorsement X
  answer: A
  explanation: The 'A' endorsement is required for any driver operating a vehicle
    equipped with air brakes.
- id: 54
  category: driver_testing
  question: Under the Driver Safety Rating (DSR) system, how many years of incident-free
    driving are required to move up one level on the scale if you are already in the
    merit (positive) zone?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: For every year of safe driving (no at-fault accidents or convictions),
    a driver moves up one level on the DSR scale.
- id: 55
  category: driver_testing
  question: If you are required to wear corrective lenses for driving, what will be
    placed on your Manitoba driver's license?
  choices:
    A: A red 'X' symbol
    B: The letter 'C' under the 'Restrictions' section
    C: The letter 'W' under the 'Endorsements' section
    D: A 'Vision Required' sticker
  answer: B
  explanation: In Manitoba, the restriction code 'C' on a driver's license indicates
    that the driver is required to wear corrective lenses.
- id: 56
  category: driver_responsibility
  question: 'If you are involved in a motor vehicle accident in Manitoba, you must
    report it to the police immediately if:'
  choices:
    A: The total property damage appears to exceed $1,000
    B: The other driver is polite and cooperative
    C: There is any injury or death
    D: You are more than 10 kilometers from home
  answer: C
  explanation: According to the Manitoba Driver's Handbook, any accident involving
    injury or death must be reported to the police immediately.
- id: 57
  category: driver_responsibility
  question: Under Manitoba's Driver Safety Rating (DSR) system, how many points does
    a driver move up the scale for each year of claim-free driving?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: A
  explanation: For every year a driver does not have any at-fault accidents or traffic
    convictions, they move up one level on the DSR scale.
- id: 58
  category: driver_responsibility
  question: When purchasing a vehicle privately in Manitoba, what document must the
    seller provide to the buyer to allow for the transfer of ownership?
  choices:
    A: A verbal agreement and the keys
    B: The Transfer of Ownership Document (TOD) portion of the vehicle registration
    C: A handwritten note on a napkin
    D: The vehicle's original factory manual
  answer: B
  explanation: The seller must provide the Transfer of Ownership Document (TOD), which
    is the bottom portion of the vehicle registration certificate, properly signed
    and dated.
- id: 59
  category: driver_responsibility
  question: If you move to Manitoba from another province, how long do you have to
    register your vehicle with Manitoba Public Insurance?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: New residents of Manitoba have up to 90 days to register their out-of-province
    vehicle with MPI.
- id: 60
  category: driver_responsibility
  question: What is the 'Warning Range' for Blood Alcohol Concentration (BAC) in Manitoba
    that results in an immediate tiered roadside license suspension for a first-time
    offender?
  choices:
    A: 0.02 to 0.04
    B: 0.05 to 0.079
    C: 0.08 to 0.10
    D: 0.10 to 0.15
  answer: B
  explanation: In Manitoba, a BAC between 0.05 and 0.079 is considered the 'Warning
    Range' and results in an immediate tiered roadside suspension.
- id: 61
  category: driver_responsibility
  question: If you are caught driving while your license is suspended in Manitoba,
    the vehicle you are driving will be impounded for a minimum of how many days?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Driving while suspended or disqualified results in a mandatory 30-day
    vehicle impoundment, regardless of who owns the vehicle.
- id: 62
  category: driver_responsibility
  question: When is a Certificate of Inspection (COI) required for a vehicle in Manitoba?
  choices:
    A: Every year during registration renewal
    B: Only when the vehicle is involved in a major accident
    C: When ownership of a used vehicle is transferred or when it is brought into
      the province
    D: Only if the vehicle is more than 20 years old
  answer: C
  explanation: A valid COI is required to register a vehicle that is newly acquired
    (used) or being registered in Manitoba for the first time from another jurisdiction.
- id: 63
  category: driver_responsibility
  question: 'In Manitoba, if you hit an unattended vehicle and cannot find the owner,
    you must:'
  choices:
    A: Drive away if there is no visible damage
    B: Leave a note with your name, address, and license plate number
    C: Wait for at least 4 hours for the owner to return
    D: Call a tow truck to move the other vehicle
  answer: B
  explanation: If you collide with an unattended vehicle, you must leave a written
    notice with your name, address, and the registration number of your vehicle in
    a conspicuous place on the struck vehicle.
- id: 64
  category: driver_responsibility
  question: If you sell your vehicle and buy a new one, how many days do you have
    to transfer your existing license plates to the new vehicle?
  choices:
    A: 2 days
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: Manitoba law allows a 7-day grace period to transfer plates from a
    sold vehicle to a newly acquired vehicle, provided you carry the transfer documents.
- id: 65
  category: driver_responsibility
  question: Which of the following is NOT covered under Manitoba's Personal Injury
    Protection Plan (PIPP)?
  choices:
    A: Medical expenses resulting from an accident
    B: Income replacement for lost wages
    C: Damage to your vehicle's paint and bodywork
    D: Rehabilitation costs
  answer: C
  explanation: PIPP covers injury-related costs (medical, income, rehab) regardless
    of fault. Vehicle damage is covered under the 'All-perils' section of Autopac,
    not PIPP.
- id: 66
  category: driver_responsibility
  question: 'A driver in the ''Warning Range'' (0.05 to 0.079 BAC) for the first time
    will face an immediate roadside license suspension of:'
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 7 days
  answer: C
  explanation: A first-time 'Warning Range' violation in Manitoba results in an immediate
    72-hour (3-day) administrative license suspension.
- id: 67
  category: driver_responsibility
  question: 'In Manitoba, if you are involved in an accident where the total property
    damage exceeds $2,000 and the police did not attend the scene, you must:'
  choices:
    A: Report the accident to MPI within 24 hours
    B: Report the accident to the police within 24 hours
    C: Only report it if you want to make an insurance claim
    D: Report the accident to the police within 7 days
  answer: B
  explanation: If property damage exceeds $2,000 and police were not at the scene,
    you must report the accident to the police within 24 hours.
- id: 68
  category: driver_responsibility
  question: In Manitoba, under which of the following circumstances MUST a collision
    be reported to the police?
  choices:
    A: Whenever the total property damage exceeds $1,000
    B: Only if a driver does not have a valid license
    C: If the collision involves a fatality, serious injury, or a 'hit and run'
    D: Only if the vehicles are not drivable
  answer: C
  explanation: In Manitoba, you must report a collision to the police if it involves
    a fatality, an injury requiring hospitalization, a 'hit and run', if a driver
    is suspected of being under the influence, or if a vehicle must be towed from
    the scene.
- id: 69
  category: driver_responsibility
  question: When purchasing a used vehicle privately in Manitoba, how long is a Certificate
    of Inspection (COI) valid for registration purposes from the date it was issued?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: A Certificate of Inspection (COI) is valid for one year from the date
    of issue for the purpose of transferring ownership and registering a vehicle in
    Manitoba.
- id: 70
  category: driver_responsibility
  question: If you are involved in a collision that does not require police attendance,
    how soon should you report the claim to Manitoba Public Insurance (MPI)?
  choices:
    A: Immediately or as soon as reasonably possible
    B: Within 30 days
    C: Only when you are ready to repair the vehicle
    D: Within 48 hours only
  answer: A
  explanation: MPI recommends reporting all collision claims as soon as reasonably
    possible to ensure a timely investigation and processing of the claim.
- id: 71
  category: driver_responsibility
  question: When you sell your vehicle in Manitoba, what should you do with the license
    plates?
  choices:
    A: Leave them on the vehicle for the new owner
    B: Return them to the police
    C: Keep them, as they belong to you and not the vehicle
    D: Destroy them immediately
  answer: C
  explanation: In Manitoba, license plates belong to the individual, not the vehicle.
    When you sell a vehicle, you should remove your plates. You can then transfer
    them to another vehicle or return them to an Autopac agent for a refund.
- id: 72
  category: driver_responsibility
  question: What is the standard deductible for most passenger vehicles under Manitoba's
    basic compulsory Autopac coverage?
  choices:
    A: $100
    B: $200
    C: $500
    D: $750
  answer: C
  explanation: The basic compulsory Autopac coverage in Manitoba carries a standard
    deductible of $500 for most passenger vehicles, though drivers can pay for optional
    coverage to lower this amount.
- id: 73
  category: driver_responsibility
  question: Which Manitoba program provides no-fault compensation for injuries resulting
    from an automobile accident, regardless of who was at fault?
  choices:
    A: The Driver Safety Rating (DSR) Program
    B: The Personal Injury Protection Plan (PIPP)
    C: The Manitoba Health Act
    D: The Vehicle Safety Act
  answer: B
  explanation: The Personal Injury Protection Plan (PIPP) is Manitoba's no-fault insurance
    system that provides coverage for medical expenses, rehabilitation, and lost income
    for anyone injured in a vehicle collision.
- id: 74
  category: driver_responsibility
  question: If you are a Manitoba resident and purchase a vehicle from another province,
    what must you do before you can register it in Manitoba?
  choices:
    A: Nothing, out-of-province inspections are always accepted
    B: Pay a $500 out-of-province tax immediately
    C: Obtain a valid Manitoba Certificate of Inspection (COI)
    D: Drive it for 3 months on the old plates
  answer: C
  explanation: Vehicles brought into Manitoba from other jurisdictions must generally
    pass a Manitoba safety inspection and receive a COI before they can be registered,
    with some exceptions for newer vehicles under specific inter-provincial agreements.
- id: 75
  category: driver_responsibility
  question: In Manitoba, what is the penalty for driving a vehicle that is not currently
    registered and insured?
  choices:
    A: A verbal warning for the first offense
    B: A fine and potential vehicle impoundment
    C: A mandatory 1-year jail sentence
    D: There is no penalty if you are driving to an Autopac agent
  answer: B
  explanation: Driving an unregistered or uninsured vehicle in Manitoba is a serious
    offense that results in a significant fine and the vehicle may be impounded.
- id: 76
  category: driver_responsibility
  question: If you collide with an unattended vehicle and cannot find the owner, what
    is your legal responsibility in Manitoba?
  choices:
    A: Wait at the scene for at least 4 hours
    B: Leave a note with your name, address, and license plate number
    C: Drive away if there is no visible damage
    D: Call a tow truck for the other vehicle
  answer: B
  explanation: If you hit an unattended vehicle, you must leave a written notice in
    a conspicuous place on the struck vehicle, providing your name, address, and the
    registration number of your vehicle.
- id: 77
  category: driver_responsibility
  question: What happens to your Driver Safety Rating (DSR) if you are found 50% or
    more at fault for a collision?
  choices:
    A: It stays the same
    B: It drops by 2 levels
    C: It drops by 5 levels
    D: It drops by 10 levels
  answer: C
  explanation: In Manitoba, being found 50% or more at fault for a collision results
    in a 5-level drop on the Driver Safety Rating scale.
- id: 78
  category: driver_responsibility
  question: Which of the following is NOT covered under Manitoba's basic compulsory
    Autopac 'All-Perils' coverage?
  choices:
    A: Vandalism
    B: Theft of the vehicle
    C: Collision damage
    D: Theft of personal items (like a laptop) from inside the vehicle
  answer: D
  explanation: Basic Autopac covers the vehicle itself (collision, upset, and common
    perils like theft/vandalism of the car). It does not cover personal belongings
    left inside the vehicle; those are typically covered by home or tenant insurance.
- id: 79
  category: driver_responsibility
  question: To be eligible for the Manitoba Public Insurance Winter Tire Program (low-interest
    financing), what is a primary requirement?
  choices:
    A: You must have a DSR level of +15
    B: The vehicle must be registered in Manitoba in your name
    C: You must be a student
    D: You must have had at least one accident in the snow
  answer: B
  explanation: To participate in the MPI Winter Tire Program financing, you must be
    an individual (not a corporation) with a vehicle registered in your name in Manitoba
    and be in good standing with MPI.
- id: 80
  category: safe_driving_rules
  question: In Manitoba, what is the default speed limit in an urban area (within
    a city or town) unless otherwise posted?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 30 km/h
  answer: B
  explanation: According to the Manitoba Driver's Handbook, the standard speed limit
    within any city, town, or village is 50 km/h unless signs indicate otherwise.
- id: 81
  category: safe_driving_rules
  question: When parking your vehicle near a fire hydrant in Manitoba, what is the
    minimum distance you must maintain?
  choices:
    A: 1 metre
    B: 2 metres
    C: 3 metres
    D: 5 metres
  answer: C
  explanation: Manitoba law prohibits parking within 3 metres of a fire hydrant.
- id: 82
  category: safe_driving_rules
  question: In Manitoba, when approaching a construction zone where workers are present,
    what happens to the speeding fines?
  choices:
    A: Fines are tripled
    B: Fines are doubled
    C: Fines are increased by $100
    D: Fines remain the same but demerits increase
  answer: B
  explanation: Under the Highway Traffic Act of Manitoba, speeding fines are doubled
    when workers are present in a construction zone.
- id: 83
  category: safe_driving_rules
  question: 'When approaching a stopped emergency vehicle with its lights flashing
    on a highway with a speed limit of 80 km/h or higher, you must slow down to:'
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: C
  explanation: Manitoba's 'Slow Down, Move Over' law requires drivers to slow to 60
    km/h on highways where the limit is 80 km/h or higher when passing emergency vehicles.
- id: 84
  category: safe_driving_rules
  question: In Manitoba, you are prohibited from parking within how many metres of
    a stop sign or traffic control signal?
  choices:
    A: 3 metres
    B: 6 metres
    C: 9 metres
    D: 12 metres
  answer: C
  explanation: The Manitoba Driver's Handbook states you must not park within 9 metres
    of a stop sign or traffic control signal located at the side of a roadway.
- id: 85
  category: safe_driving_rules
  question: When following a school bus that has its red lights flashing and stop
    arm extended, how far back must you stop your vehicle?
  choices:
    A: 3 metres
    B: 5 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: Drivers must stop at least 5 metres from a school bus when its red
    lights are flashing and the stop arm is out, unless on the opposite side of a
    divided highway.
- id: 86
  category: safe_driving_rules
  question: Under what specific condition is a left turn on a red light permitted
    in Manitoba?
  choices:
    A: Never permitted
    B: From a two-way street onto a one-way street
    C: From a one-way street onto another one-way street
    D: Anytime there is no oncoming traffic
  answer: C
  explanation: In Manitoba, you may turn left on a red light only if you are turning
    from a one-way street onto another one-way street, after coming to a complete
    stop and yielding to traffic and pedestrians.
- id: 87
  category: safe_driving_rules
  question: What is the recommended following distance behind another vehicle under
    ideal driving conditions in Manitoba?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 6 seconds
  answer: B
  explanation: Manitoba Public Insurance recommends a minimum following distance of
    at least 2 seconds behind the vehicle in front of you under ideal conditions.
- id: 88
  category: safe_driving_rules
  question: When driving at night, you must dim your high beam headlights when you
    are within how many metres of an oncoming vehicle?
  choices:
    A: 150 metres
    B: 300 metres
    C: 450 metres
    D: 600 metres
  answer: C
  explanation: In Manitoba, you must switch to low beams when an oncoming vehicle
    is within 450 metres.
- id: 89
  category: safe_driving_rules
  question: In Manitoba, a U-turn is prohibited in which of the following locations?
  choices:
    A: On a curve or near the crest of a hill where you cannot be seen for 150 metres
    B: At any intersection with a traffic light
    C: On any street with a speed limit over 50 km/h
    D: Only where a 'No U-Turn' sign is posted
  answer: A
  explanation: U-turns are illegal on curves or hills where there is less than 150
    metres of visibility in either direction.
- id: 90
  category: safe_driving_rules
  question: When two vehicles reach an uncontrolled intersection at approximately
    the same time, who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a higher speed
    D: The vehicle on the larger road
  answer: B
  explanation: At an uncontrolled intersection (no signs or signals), you must yield
    the right-of-way to the vehicle on your right.
- id: 91
  category: safe_driving_rules
  question: What is the default speed limit on a rural highway in Manitoba unless
    otherwise posted?
  choices:
    A: 80 km/h
    B: 90 km/h
    C: 100 km/h
    D: 110 km/h
  answer: B
  explanation: The standard speed limit for rural highways in Manitoba is 90 km/h
    unless signs indicate a different limit.
- id: 92
  category: safe_driving_rules
  question: When parking a vehicle uphill with a curb, how should your front wheels
    be positioned?
  choices:
    A: Parallel to the curb
    B: Turned toward the curb
    C: Turned away from the curb
    D: It does not matter as long as the parking brake is on
  answer: C
  explanation: When parking uphill with a curb, turn the wheels away from the curb
    (to the left) so that if the vehicle rolls, the back of the front tire will hit
    the curb.
- id: 93
  category: safe_driving_rules
  question: In Manitoba, you must not park within how many metres of a driveway entrance
    to a fire station?
  choices:
    A: 3 metres
    B: 6 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: According to the Manitoba Driver's Handbook, you must not park within
    6 metres of the driveway entrance to a fire station.
- id: 94
  category: safe_driving_rules
  question: When passing a cyclist in Manitoba, what is the minimum distance you should
    maintain between your vehicle and the cyclist?
  choices:
    A: 0.5 metres
    B: 1 metre
    C: 2 metres
    D: 3 metres
  answer: B
  explanation: Manitoba's handbook advises leaving at least 1 metre of space between
    your vehicle and a cyclist when passing.
- id: 95
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit in urban areas
    of Manitoba?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: According to the Manitoba Driver's Handbook, the standard speed limit
    in any city, town, or village is 50 km/h unless signs indicate otherwise.
- id: 96
  category: safe_driving_rules
  question: In many Manitoba municipalities, including Winnipeg, what is the speed
    limit in a reduced-speed school zone during restricted hours?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: In Winnipeg and many other Manitoba municipalities, the speed limit
    in reduced-speed school zones is 30 km/h when the zone is active (typically September
    to June, Monday to Friday).
- id: 97
  category: safe_driving_rules
  question: In Manitoba, how far must you park away from a fire hydrant?
  choices:
    A: 1 metre
    B: 3 metres
    C: 5 metres
    D: 9 metres
  answer: B
  explanation: Under Manitoba law, you are prohibited from parking within 3 metres
    of a fire hydrant.
- id: 98
  category: safe_driving_rules
  question: What is the minimum distance you must park away from a stop sign or a
    traffic control signal?
  choices:
    A: 3 metres
    B: 6 metres
    C: 9 metres
    D: 15 metres
  answer: C
  explanation: Drivers in Manitoba must not park within 9 metres of a stop sign or
    any traffic control signal located at the side of the roadway.
- id: 99
  category: safe_driving_rules
  question: What is the penalty for speeding in a designated construction zone when
    workers are present in Manitoba?
  choices:
    A: The fine is the same as a regular speeding ticket.
    B: The fine is doubled.
    C: Your license is suspended immediately for 30 days.
    D: The fine is tripled.
  answer: B
  explanation: In Manitoba, speeding fines are doubled in construction zones when
    workers are present to protect road crews.
- id: 100
  category: safe_driving_rules
  question: When stopping at a railway crossing, what is the minimum distance you
    must stop from the nearest rail?
  choices:
    A: 2 metres
    B: 5 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: When a train is approaching or signals are flashing, you must stop
    at least 5 metres away from the nearest rail but no more than 15 metres away.
- id: 101
  category: safe_driving_rules
  question: 'On a multi-lane highway, the left lane should primarily be used for:'
  choices:
    A: Driving at the exactly posted speed limit.
    B: Passing other vehicles or turning left.
    C: Slow-moving vehicles.
    D: Emergency parking only.
  answer: B
  explanation: The Manitoba Driver's Handbook states that drivers should keep to the
    right and use the left lane for passing or when preparing to make a left turn.
- id: 102
  category: safe_driving_rules
  question: If your vehicle's turn signals are not working, what is the correct hand
    signal for a left turn?
  choices:
    A: Arm out and bent upward.
    B: Arm out and bent downward.
    C: Arm straight out the window.
    D: Waving the arm in a circular motion.
  answer: C
  explanation: To signal a left turn using hand signals, you must extend your left
    arm straight out the window.
- id: 103
  category: safe_driving_rules
  question: At an uncontrolled intersection (one without signs or signals), who has
    the right of way?
  choices:
    A: The vehicle on the left.
    B: The vehicle on the right.
    C: The vehicle traveling at the higher speed.
    D: The vehicle that arrives last.
  answer: B
  explanation: In Manitoba, when two vehicles reach an uncontrolled intersection at
    approximately the same time, the driver on the left must yield to the driver on
    the right.
- id: 104
  category: safe_driving_rules
  question: When following another vehicle at night, you must dim your high beam headlights
    within what distance?
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: Manitoba law requires you to switch to low beams when you are within
    60 metres of the vehicle you are following.
- id: 105
  category: safe_driving_rules
  question: In Manitoba, who is legally responsible for ensuring a passenger under
    the age of 18 is wearing a seatbelt?
  choices:
    A: The passenger themselves.
    B: The driver of the vehicle.
    C: The passenger's parents, even if not in the car.
    D: No one; it is a personal choice.
  answer: B
  explanation: The driver is responsible for ensuring all passengers under the age
    of 18 are properly buckled up. Passengers 18 and older are responsible for themselves.
- id: 106
  category: defensive_driving
  question: When driving in a city or town, how far ahead should you be scanning the
    road to identify potential hazards?
  choices:
    A: 5 seconds
    B: 12 seconds
    C: 20 seconds
    D: 30 seconds
  answer: B
  explanation: Manitoba's defensive driving guidelines suggest scanning 12 seconds
    ahead in urban areas to anticipate traffic changes and hazards.
- id: 107
  category: defensive_driving
  question: In Manitoba, at what distance must you dim your high-beam headlights when
    approaching an oncoming vehicle at night?
  choices:
    A: 150 metres
    B: 300 metres
    C: 450 metres
    D: 600 metres
  answer: C
  explanation: The Manitoba Highway Traffic Act requires drivers to dim their high
    beams at least 450 metres before meeting an oncoming vehicle.
- id: 108
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet road, what is the correct
    defensive driving action to take?
  choices:
    A: Brake hard to regain traction
    B: Turn the steering wheel sharply to the right
    C: Accelerate slightly to push through the water
    D: Ease off the gas pedal and keep the steering wheel straight
  answer: D
  explanation: To recover from hydroplaning, you should take your foot off the accelerator
    and steer straight until the tires regain contact with the road. Do not brake.
- id: 109
  category: defensive_driving
  question: In Manitoba, during which time period is the use of studded tires permitted
    on vehicles?
  choices:
    A: November 1 to March 31
    B: October 1 to April 30
    C: October 15 to April 15
    D: September 1 to May 31
  answer: B
  explanation: Manitoba law allows the use of studded tires from October 1 to April
    30 to assist with winter driving conditions.
- id: 110
  category: defensive_driving
  question: When driving on a highway, how far ahead should you scan the road to maintain
    a safe 'visual lead time'?
  choices:
    A: 12 seconds
    B: 15 seconds
    C: 20 to 25 seconds
    D: 40 seconds
  answer: C
  explanation: On highways, higher speeds require a longer visual lead time of 20
    to 25 seconds to identify and react to distant hazards.
- id: 111
  category: defensive_driving
  question: In Manitoba, if you are caught using a hand-held electronic device while
    driving, how many demerit points will be moved down the Driver Safety Rating (DSR)
    scale?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 10 points
  answer: C
  explanation: A conviction for using a hand-held electronic device (distracted driving)
    in Manitoba results in a 5-level drop on the DSR scale, a fine, and a 3-day license
    suspension for the first offence.
- id: 112
  category: defensive_driving
  question: If you encounter heavy fog while driving, which lights should you use
    to ensure maximum visibility?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Low-beam headlights should be used in fog. High beams reflect off the
    moisture in the fog, creating glare and reducing visibility.
- id: 113
  category: defensive_driving
  question: How should you perform an emergency stop if your vehicle is equipped with
    Anti-lock Braking System (ABS)?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure and do not release
    C: Apply the parking brake slowly
    D: Shift into neutral and brake lightly
  answer: B
  explanation: With ABS, you should apply firm, continuous pressure to the brake pedal.
    The system will automatically 'pump' the brakes to prevent lock-up.
- id: 114
  category: defensive_driving
  question: What is the safest way to check your blind spots before changing lanes?
  choices:
    A: Check your rearview mirror
    B: Check your side-view mirrors
    C: Turn your head to look over your shoulder
    D: Lean forward to change the angle of the mirrors
  answer: C
  explanation: Mirrors do not show everything. A shoulder check is required to see
    vehicles in your blind spots before any lateral move.
- id: 115
  category: defensive_driving
  question: To maintain proper situational awareness in urban areas, how far ahead
    should a driver scan the road?
  choices:
    A: 5 to 8 seconds
    B: 12 seconds
    C: 20 to 25 seconds
    D: 30 seconds
  answer: B
  explanation: MPI recommends scanning 12 seconds ahead in the city, which is about
    one block, to identify potential hazards early.
- id: 116
  category: defensive_driving
  question: What is the recommended method for checking your blind spots before a
    lane change in Manitoba?
  choices:
    A: Glance at the interior rearview mirror only
    B: Check both side mirrors and perform a shoulder check
    C: Rely on your vehicle's blind-spot monitoring system
    D: Lean forward to change the angle of the side mirrors
  answer: B
  explanation: A proper blind spot check in Manitoba involves checking mirrors and
    a quick shoulder check in the direction you intend to move.
- id: 117
  category: defensive_driving
  question: When driving in heavy fog in Manitoba, which lights should you use for
    maximum visibility?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    moisture droplets, creating glare and reducing visibility further.
- id: 118
  category: defensive_driving
  question: If you are involved in a skid on an icy Manitoba road, which way should
    you steer?
  choices:
    A: In the opposite direction of the skid
    B: In the direction you want the front of the vehicle to go
    C: Always to the right toward the ditch
    D: Keep the wheels perfectly straight and brake hard
  answer: B
  explanation: To recover from a skid, you should steer in the direction you want
    the front of the vehicle to go. If the rear is sliding right, steer right.
- id: 119
  category: defensive_driving
  question: Under the Driver Safety Rating (DSR) system, how many demerit points are
    typically applied for a conviction of 'Following too closely'?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Following too closely is a common defensive driving infraction that
    results in 2 demerit points on the Manitoba DSR scale.
- id: 120
  category: defensive_driving
  question: When driving on a rural Manitoba road at dusk, you see a deer near the
    edge of the road. What is the safest defensive action?
  choices:
    A: Speed up to pass it quickly
    B: Honk your horn continuously and maintain speed
    C: Slow down, flash your lights, and prepare to brake
    D: Swerve into the oncoming lane to give it space
  answer: C
  explanation: MPI advises drivers to slow down and be prepared to stop when they
    see wildlife. Swerving is discouraged as it often leads to more serious rollovers
    or head-on collisions.
- id: 121
  category: alcohol_drugs_health
  question: In Manitoba, what is the immediate roadside license suspension period
    for a first-time 'Warn Range' offense (BAC between 0.05 and 0.079)?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 7 days
  answer: C
  explanation: In Manitoba, a driver with a BAC in the 'Warn Range' (0.05 to 0.079)
    faces an immediate 72-hour roadside license suspension for a first offense.
- id: 122
  category: alcohol_drugs_health
  question: If a driver is charged with a Blood Alcohol Concentration (BAC) of 0.08
    or higher, what is the minimum length of the immediate administrative license
    suspension?
  choices:
    A: 24 hours
    B: 7 days
    C: 3 months
    D: 1 year
  answer: C
  explanation: Drivers who register a BAC of 0.08 or higher, or refuse a breath/blood
    demand, receive an immediate three-month administrative license suspension.
- id: 123
  category: alcohol_drugs_health
  question: In Manitoba, what is the mandatory administrative fee (surcharge) that
    must be paid to reinstate a license suspended for alcohol or drug-related offenses?
  choices:
    A: $50
    B: $150
    C: $300
    D: $500
  answer: C
  explanation: Drivers whose licenses are suspended for alcohol or drug-related reasons
    must pay a $300 administrative surcharge to Manitoba Public Insurance.
- id: 124
  category: alcohol_drugs_health
  question: Under Manitoba law, where must cannabis be stored in a vehicle if it is
    not in its original unopened packaging?
  choices:
    A: In the glove compartment
    B: In the center console
    C: In the trunk or a space not accessible to the driver or passengers
    D: On the backseat in a sealed bag
  answer: C
  explanation: Cannabis must be stored in the trunk, an exterior compartment, or another
    space in the vehicle designed for the carriage of goods that is not readily accessible
    to any person in the vehicle.
- id: 125
  category: alcohol_drugs_health
  question: If a driver is convicted of a first-time impaired driving offense under
    the Criminal Code, what is the minimum mandatory period they must use an Ignition
    Interlock device?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: For a first Criminal Code conviction for impaired driving, the offender
    is typically required to participate in the Ignition Interlock Program for a minimum
    of one year.
- id: 126
  category: alcohol_drugs_health
  question: What is the vehicle impoundment period for a driver caught with a BAC
    of 0.08 or higher for a first offense in Manitoba?
  choices:
    A: 24 hours
    B: 3 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: A first-time offense for a BAC of 0.08 or higher (or refusing a test)
    results in a mandatory 3-day vehicle impoundment. Repeat offenses within 10 years
    result in a 30-day impoundment.
- id: 127
  category: alcohol_drugs_health
  question: In Manitoba, who is legally required to report a person to the Registrar
    of Motor Vehicles if they have a medical condition that may make it dangerous
    for them to drive?
  choices:
    A: Only the driver themselves
    B: The driver's employer
    C: Physicians and optometrists
    D: Police officers only
  answer: C
  explanation: Under the Highway Traffic Act, physicians and optometrists are legally
    required to report patients who have a medical condition that may affect their
    ability to safely operate a motor vehicle.
- id: 128
  category: alcohol_drugs_health
  question: What is the consequence for a driver who refuses to provide a breath,
    blood, or oral fluid sample upon a legal demand by a peace officer?
  choices:
    A: A 24-hour suspension and a $100 fine
    B: The same penalties as having a BAC over 0.08
    C: A warning for the first offense
    D: A 48-hour vehicle impoundment only
  answer: B
  explanation: Refusing to provide a sample is a Criminal Code offense and carries
    the same administrative and criminal penalties as driving with a BAC over 0.08.
- id: 129
  category: alcohol_drugs_health
  question: How many levels will a driver move down the Driver Safety Rating (DSR)
    scale for an alcohol or drug-related Criminal Code conviction?
  choices:
    A: 2 levels
    B: 5 levels
    C: 10 levels
    D: 15 levels
  answer: C
  explanation: A conviction for an alcohol or drug-related offense under the Criminal
    Code results in a 10-level drop on the Driver Safety Rating scale.
- id: 130
  category: alcohol_drugs_health
  question: A driver is stopped and a peace officer suspects they are under the influence
    of a drug. What roadside test can the officer legally demand?
  choices:
    A: A lie detector test
    B: An oral fluid (saliva) sample
    C: A mandatory hair follicle test
    D: A roadside vision test
  answer: B
  explanation: Peace officers in Manitoba can demand an oral fluid sample at the roadside
    if they have a reasonable suspicion that a driver has a drug in their body.
- id: 131
  category: alcohol_drugs_health
  question: If a driver receives a tiered administrative license suspension for alcohol
    or drugs, what must they complete before they can regain their driving privileges?
  choices:
    A: A new road test
    B: A 20-hour community service program
    C: An assessment by the Addictions Foundation of Manitoba (AFM)
    D: A written exam on traffic signs
  answer: C
  explanation: Drivers who receive a tiered administrative license suspension are
    required to undergo an assessment by the Addictions Foundation of Manitoba (AFM)
    and may be required to complete a recommended education or treatment program.
- id: 132
  category: alcohol_drugs_health
  question: What is the tiered administrative license suspension period for a third
    'Warn Range' (0.05 to 0.079 BAC) offense within a 10-year period?
  choices:
    A: 72 hours
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: In Manitoba, a third 'Warn Range' offense within 10 years results in
    a 30-day license suspension.
- id: 133
  category: alcohol_drugs_health
  question: Regarding prescription and over-the-counter drugs, what is a driver's
    responsibility in Manitoba?
  choices:
    A: They can drive as long as the drug was prescribed by a doctor
    B: They must check with a doctor or pharmacist about side effects before driving
    C: They are only responsible if the drug is an illegal narcotic
    D: They must wait 24 hours after taking any medication before driving
  answer: B
  explanation: Drivers are responsible for knowing the effects of any medication they
    take. They should read labels and consult medical professionals to ensure the
    drug does not impair their ability to drive.
- id: 134
  category: alcohol_drugs_health
  question: In Manitoba, what is the maximum legal Blood Drug Concentration (BDC)
    for THC (cannabis) to avoid a summary conviction offense?
  choices:
    A: 1 nanogram (ng) per ml of blood
    B: 2 nanograms (ng) per ml of blood
    C: 5 nanograms (ng) per ml of blood
    D: 10 nanograms (ng) per ml of blood
  answer: B
  explanation: Under federal law applicable in Manitoba, having between 2 ng and 5
    ng of THC per ml of blood is a summary conviction offense. Having 5 ng or more
    is a more serious offense.
- id: 135
  category: alcohol_drugs_health
  question: If you are feeling drowsy while driving on a long trip, what is the most
    effective action to take?
  choices:
    A: Turn up the radio volume
    B: Open the window for fresh air
    C: Drink a caffeinated beverage and keep driving
    D: Pull over in a safe area and take a nap
  answer: D
  explanation: Fresh air, loud music, and caffeine are only temporary fixes for fatigue.
    The only safe and effective cure for drowsiness is sleep.
- id: 136
  category: alcohol_drugs_health
  question: If a Manitoba driver is caught in the 'Warn Range' (.05 to .08 BAC) for
    a second time within 10 years, how long is the license suspension?
  choices:
    A: 7 days
    B: 15 days
    C: 30 days
    D: 90 days
  answer: B
  explanation: A second 'Warn Range' offense within a 10-year period in Manitoba results
    in a 15-day immediate roadside license suspension.
- id: 137
  category: alcohol_drugs_health
  question: Under Manitoba law, what is the vehicle impoundment period for a driver's
    first 'Warn Range' (.05 to .08 BAC) violation?
  choices:
    A: No impoundment for the first offense
    B: 24 hours
    C: 3 days
    D: 7 days
  answer: C
  explanation: For a first-time 'Warn Range' violation in Manitoba, the vehicle is
    subject to a mandatory 3-day impoundment.
- id: 138
  category: alcohol_drugs_health
  question: If you are charged with a Criminal Code offense for having a BAC over
    .08, what is the duration of the immediate Administrative License Suspension?
  choices:
    A: 24 hours
    B: 30 days
    C: 3 months
    D: 1 year
  answer: C
  explanation: Drivers recorded with a BAC over .08 or who refuse a breath/blood demand
    receive an immediate 3-month Administrative License Suspension.
- id: 139
  category: alcohol_drugs_health
  question: Who is legally responsible for reporting a medical condition that may
    affect their ability to drive safely to Manitoba Public Insurance?
  choices:
    A: Only the driver's physician
    B: The driver themselves
    C: The driver's employer
    D: Only the driver's immediate family
  answer: B
  explanation: Under the Drivers and Vehicles Act, drivers must report any disease
    or disability that may interfere with the safe operation of a vehicle to MPI.
- id: 140
  category: alcohol_drugs_health
  question: What is the drug-related restriction for all drivers in the Learner and
    Intermediate stages of the GDL program in Manitoba?
  choices:
    A: They may have a small amount of cannabis if it is for medical use
    B: They must have a zero presence of any drug in their system that can be detected
      by an oral fluid screening device
    C: They are only restricted from using illegal drugs
    D: There are no drug restrictions, only alcohol restrictions
  answer: B
  explanation: Manitoba has a zero-tolerance policy for drugs for all GDL drivers;
    they must have zero presence of drugs in their system while driving.
- id: 141
  category: alcohol_drugs_health
  question: In Manitoba, which of the following is a mandatory requirement for drivers
    convicted of a second or subsequent impaired driving offense within 10 years?
  choices:
    A: Permanent license revocation
    B: Participation in the Ignition Interlock Program
    C: A mandatory 5-year jail sentence
    D: Forfeiture of their vehicle to the Crown
  answer: B
  explanation: The Ignition Interlock Program is mandatory for all drivers convicted
    of alcohol-related Criminal Code driving offenses in Manitoba.
- id: 142
  category: alcohol_drugs_health
  question: If a driver fails an oral fluid screening test for drugs for the first
    time, what is the immediate roadside license suspension period?
  choices:
    A: 24 hours
    B: 72 hours
    C: 24 hours and a mandatory road test
    D: 3 months
  answer: B
  explanation: A first-time failure of an oral fluid screening test (indicating drug
    impairment) results in an immediate 72-hour roadside license suspension.
- id: 143
  category: alcohol_drugs_health
  question: What is the standard administrative fee required to reinstate a driver's
    license following an alcohol or drug-related suspension in Manitoba?
  choices:
    A: No fee is required
    B: Exactly $50
    C: Exactly $250
    D: Exactly $600
  answer: B
  explanation: Drivers must pay a $50 license reinstatement fee following any administrative
    suspension in Manitoba.
- id: 144
  category: alcohol_drugs_health
  question: Can a driver be charged with impaired driving if they are under the influence
    of a legal prescription drug?
  choices:
    A: No, as long as they have a valid prescription
    B: No, prescription drugs are not considered intoxicants
    C: Yes, if the drug affects their ability to operate a vehicle safely
    D: Yes, but only if they also have alcohol in their system
  answer: C
  explanation: It is illegal to drive while impaired by any drug, including legal
    prescription or over-the-counter medications that affect your ability to drive.
- id: 145
  category: alcohol_drugs_health
  question: 'In Manitoba, a driver who receives a third ''Warn Range'' (.05 to .08
    BAC) violation within 10 years faces a license suspension of:'
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: A third 'Warn Range' violation within 10 years results in a 30-day
    immediate roadside license suspension.
- id: 146
  category: alcohol_drugs_health
  question: When is a driver required to undergo a mandatory Addictions Assessment
    in Manitoba?
  choices:
    A: After their very first 'Warn Range' violation
    B: If they have two or more tiered roadside suspensions within a 10-year period
    C: Only if they are involved in a fatal accident
    D: Only if they are under the age of 18
  answer: B
  explanation: Drivers who incur two or more tiered roadside suspensions within a
    10-year period must complete a mandatory Addictions Assessment.
- id: 147
  category: alcohol_drugs_health
  question: 'In Manitoba, if a driver is caught with a BAC over .08 and there is a
    passenger under the age of 16 in the vehicle, the vehicle impoundment period is:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: If a driver is charged with a BAC over .08 or refusal while a passenger
    under 16 is present, the vehicle impoundment period is 60 days.
- id: 148
  category: penalties_and_points
  question: Under Manitoba's Driver Safety Rating (DSR) system, how many levels will
    you move down the scale for most traffic convictions?
  choices:
    A: 1 level
    B: 2 levels
    C: 3 levels
    D: 5 levels
  answer: B
  explanation: In Manitoba, most traffic convictions (such as speeding or failing
    to stop at a red light) result in moving down 2 levels on the Driver Safety Rating
    scale.
- id: 149
  category: penalties_and_points
  question: How many levels do you move up the Driver Safety Rating (DSR) scale for
    each year of safe driving (no at-fault accidents or convictions)?
  choices:
    A: 1 level
    B: 2 levels
    C: 3 levels
    D: 5 levels
  answer: A
  explanation: Drivers move up 1 level on the DSR scale for every year they drive
    safely without any at-fault accidents, traffic convictions, or license suspensions.
- id: 150
  category: penalties_and_points
  question: How many demerit points (DSR levels down) are assigned for a conviction
    of using a hand-held electronic communication device while driving in Manitoba?
  choices:
    A: 2 levels
    B: 3 levels
    C: 5 levels
    D: 10 levels
  answer: C
  explanation: Using a hand-held electronic communication device while driving results
    in moving down 5 levels on the Driver Safety Rating scale.
- id: 151
  category: penalties_and_points
  question: If a driver's Blood Alcohol Concentration (BAC) is between 0.05 and 0.079,
    what is the length of the immediate Tiered Administrative License Suspension for
    a first offense?
  choices:
    A: 24 hours
    B: 72 hours
    C: 7 days
    D: 15 days
  answer: B
  explanation: In Manitoba, a first-time Tiered Administrative License Suspension
    (for BAC between 0.05 and 0.079) is 72 hours.
- id: 152
  category: penalties_and_points
  question: Under Manitoba's 'Move Over' law, what is the maximum speed allowed when
    passing a stopped emergency vehicle with its lights flashing on a highway where
    the limit is 80 km/h or higher?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: C
  explanation: When the speed limit is 80 km/h or higher, drivers must slow to 60
    km/h when passing stopped emergency vehicles with flashing lights. If the limit
    is below 80 km/h, they must slow to 40 km/h.
- id: 153
  category: penalties_and_points
  question: If you are convicted of failing to stop for a school bus that has its
    lights flashing and stop arm extended, how many levels will you move down the
    DSR scale?
  choices:
    A: 2 levels
    B: 5 levels
    C: 10 levels
    D: 15 levels
  answer: A
  explanation: Failing to stop for a school bus results in moving down 2 levels on
    the DSR scale, though the fine is significantly higher than standard traffic violations.
- id: 154
  category: penalties_and_points
  question: How many levels down the DSR scale will a driver move for a conviction
    of failing to wear a seatbelt?
  choices:
    A: 1 level
    B: 2 levels
    C: 3 levels
    D: 5 levels
  answer: B
  explanation: A seatbelt conviction in Manitoba results in moving down 2 levels on
    the Driver Safety Rating scale.
- id: 155
  category: penalties_and_points
  question: If a driver refuses to provide a breath or blood sample to a police officer,
    how many levels will they move down the DSR scale?
  choices:
    A: 5 levels
    B: 10 levels
    C: 15 levels
    D: 20 levels
  answer: B
  explanation: Refusing to provide a breath or blood sample is treated as a serious
    offense and results in moving down 10 levels on the DSR scale.
- id: 156
  category: penalties_and_points
  question: What is the immediate Administrative License Suspension period for a driver
    who records a BAC over 0.08 or refuses a breathalyzer test?
  choices:
    A: 24 hours
    B: 7 days
    C: 3 months
    D: 1 year
  answer: C
  explanation: Drivers with a BAC over 0.08 or those who refuse a breathalyzer test
    receive an immediate 3-month (90-day) Administrative License Suspension.
- id: 157
  category: penalties_and_points
  question: In Manitoba, speeding fines are doubled when the offense occurs in which
    of the following areas?
  choices:
    A: School zones
    B: Residential areas
    C: Active construction zones
    D: Hospital zones
  answer: C
  explanation: Fines for speeding are doubled in Manitoba when the driver is caught
    speeding in an active construction zone.
- id: 158
  category: penalties_and_points
  question: Which of the following Criminal Code driving convictions results in moving
    down 10 levels on the DSR scale?
  choices:
    A: Impaired driving
    B: Dangerous operation of a motor vehicle
    C: Failure to stop at the scene of an accident
    D: All of the above
  answer: D
  explanation: All Criminal Code driving convictions, including impaired driving,
    dangerous operation, and hit-and-run, result in moving down 10 levels on the DSR
    scale.
- id: 159
  category: penalties_and_points
  question: If a novice driver (GDL) is caught with any amount of alcohol in their
    system, they receive an immediate 24-hour suspension. How many levels down the
    DSR scale will they move?
  choices:
    A: 2 levels
    B: 5 levels
    C: 10 levels
    D: No levels, just the suspension
  answer: A
  explanation: A 24-hour roadside suspension for violating the zero-alcohol requirement
    for GDL drivers results in moving down 2 levels on the DSR scale.
- id: 160
  category: penalties_and_points
  question: In Manitoba, what is the mandatory roadside license suspension period
    for a first-time distracted driving conviction?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: Drivers caught using a hand-held electronic device while driving in
    Manitoba face an immediate 3-day license suspension for a first offense, which
    increases to 7 days for subsequent offenses.
- id: 161
  category: penalties_and_points
  question: How many demerit levels do you move down the DSR scale for a distracted
    driving conviction in Manitoba?
  choices:
    A: 2 levels
    B: 3 levels
    C: 5 levels
    D: 10 levels
  answer: C
  explanation: A conviction for distracted driving (using a hand-held electronic device)
    results in moving 5 levels down the Driver Safety Rating scale.
- id: 162
  category: penalties_and_points
  question: A driver caught street racing in Manitoba faces an immediate roadside
    license suspension of how many days?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: B
  explanation: Drivers caught street racing face an immediate 7-day roadside license
    suspension and a 30-day vehicle impoundment.
- id: 163
  category: penalties_and_points
  question: What is the administrative license suspension period for a driver who
    provides a breath sample over .08 BAC?
  choices:
    A: 24 hours
    B: 72 hours
    C: 3 months
    D: 1 year
  answer: C
  explanation: In Manitoba, if you blow over .08 or refuse a test, you receive an
    immediate 3-month (90-day) Administrative License Suspension.
- id: 164
  category: penalties_and_points
  question: If a driver is convicted of a Criminal Code driving offense (such as Impaired
    Driving), how many levels do they move down the DSR scale?
  choices:
    A: 5 levels
    B: 10 levels
    C: 15 levels
    D: 20 levels
  answer: B
  explanation: A conviction under the Criminal Code for driving-related offenses results
    in a 10-level drop on the Driver Safety Rating scale.
- id: 165
  category: penalties_and_points
  question: If you are involved in an accident where the total property damage is
    $2,000 or more and you do not report it to the police, what can happen?
  choices:
    A: Nothing, as long as you tell MPI
    B: You may face a fine and license suspension
    C: Your insurance will be free for one year
    D: Only the other driver is responsible for reporting
  answer: B
  explanation: Failing to report a reportable accident (injury, death, or property
    damage over $2,000) to the police is a violation of the Highway Traffic Act and
    can lead to fines and license sanctions.
- id: 166
  category: sharing_the_road
  question: In Manitoba, when approaching a school bus from either direction on a
    non-divided highway with its red lights flashing and stop arm extended, how far
    from the bus must you stop?
  choices:
    A: 2 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: According to the Manitoba Driver's Handbook, you must stop at least
    five meters from the front or rear of a school bus when its red lights are flashing
    and the stop arm is extended, unless on a divided highway.
- id: 167
  category: sharing_the_road
  question: In Manitoba, what is the approximate fine for failing to stop for a school
    bus with its red lights flashing and stop arm extended?
  choices:
    A: $200
    B: $450
    C: $673
    D: $1,200
  answer: C
  explanation: The fine for passing a school bus with its lights flashing in Manitoba
    is significant, currently set at approximately $673 to deter this dangerous behavior.
- id: 168
  category: sharing_the_road
  question: When following a motorcycle, why should you maintain a following distance
    of at least four seconds?
  choices:
    A: Motorcycles stop much faster than cars
    B: Motorcycles are legally required to have more space
    C: To avoid throwing dust in the rider's face
    D: Motorcyclists often use hand signals
  answer: A
  explanation: Because motorcycles are light and have high-performance braking systems,
    they can stop much more quickly than cars. A four-second following distance is
    recommended in Manitoba.
- id: 169
  category: sharing_the_road
  question: You are driving on a multi-lane highway and see an emergency vehicle stopped
    on the right shoulder with its lights flashing. What must you do according to
    Manitoba law?
  choices:
    A: Stop immediately in your lane
    B: Speed up to pass the vehicle quickly
    C: Slow down to the required speed and move into the lane farthest from the vehicle
      if safe to do so
    D: Maintain your speed but honk to alert the emergency workers
  answer: C
  explanation: Manitoba's 'Move Over' law requires drivers to slow down and, if there
    are multiple lanes, move to the lane farthest from the emergency vehicle if it
    is safe to do so.
- id: 170
  category: sharing_the_road
  question: When a school safety patrol or crossing guard holds up a stop sign at
    a crosswalk, what are your legal obligations?
  choices:
    A: Slow down and proceed with caution
    B: Stop and wait until the children have finished crossing, then proceed
    C: Stop and remain stopped until the patrol person has lowered the sign and left
      the roadway
    D: Only stop if there are more than three children crossing
  answer: C
  explanation: You must stop and remain stopped until the school safety patrol or
    crossing guard has lowered their sign and safely exited the roadway.
- id: 171
  category: sharing_the_road
  question: What does a 'D' sign or a flashing amber light on a lead vehicle indicate
    in Manitoba?
  choices:
    A: The vehicle is a mail carrier
    B: The vehicle is escorting an oversized load
    C: The vehicle is a slow-moving farm tractor
    D: The vehicle is a snowplow
  answer: B
  explanation: Pilot vehicles with 'D' signs or flashing amber lights are used to
    warn other motorists that an oversized load is following or ahead.
- id: 172
  category: sharing_the_road
  question: Large trucks have significant blind spots where a car can disappear from
    the driver's view. Where is the largest 'No-Zone' for a semi-truck?
  choices:
    A: Directly in front of the cab
    B: The left side of the cab
    C: Directly behind the trailer
    D: The right side of the trailer
  answer: C
  explanation: While trucks have blind spots on all sides, the area directly behind
    the trailer is a major 'No-Zone' because the truck driver has no rearview mirror
    to see it.
- id: 173
  category: sharing_the_road
  question: In Manitoba, if you see a pedestrian with a white cane, what does this
    indicate?
  choices:
    A: The pedestrian is a senior citizen
    B: The pedestrian is visually impaired
    C: The pedestrian is a surveyor
    D: The pedestrian has the right of way only at night
  answer: B
  explanation: A white cane (often with a red tip) indicates that the pedestrian is
    visually impaired. Drivers must exercise extra caution and yield the right-of-way.
- id: 174
  category: sharing_the_road
  question: When a transit bus in a high-speed area (60 km/h or more) has signaled
    and is attempting to re-enter the traffic flow from a bus bay, what should you
    do?
  choices:
    A: Maintain your speed; the bus must yield to you
    B: Speed up to get past the bus before it pulls out
    C: Yield the right-of-way to the bus
    D: Honk to let the bus driver know you are there
  answer: C
  explanation: In Manitoba, drivers should yield the right-of-way to transit buses
    that are signaling their intention to re-enter the traffic flow from a bus stop
    or bay.
- id: 175
  category: sharing_the_road
  question: Why might a motorcyclist ride in the left portion of their lane (the 'left
    tire track' of a car)?
  choices:
    A: To be more visible to oncoming traffic and vehicles they are following
    B: Because it is a legal requirement for motorcycles
    C: To prepare for a right-hand turn
    D: To avoid wind from the right side
  answer: A
  explanation: Motorcyclists often ride in the left part of the lane to increase their
    visibility to other drivers and to see further down the road.
- id: 176
  category: sharing_the_road
  question: 'When turning right, you should check your blind spot for cyclists because:'
  choices:
    A: Cyclists are required to ride on the sidewalk
    B: Cyclists may be traveling straight through the intersection on your right
    C: Cyclists always have the right of way over turning cars
    D: Cyclists are not allowed to use hand signals
  answer: B
  explanation: Motorists must check their right blind spot before turning right to
    ensure they do not cut off a cyclist who is proceeding straight.
- id: 177
  category: sharing_the_road
  question: If you are following a large truck and cannot see the truck's side mirrors,
    what does this mean?
  choices:
    A: The truck driver can see you through their rear window
    B: You are in the truck driver's blind spot and they cannot see you
    C: You are at a safe following distance
    D: The truck is about to make a wide turn
  answer: B
  explanation: 'A good rule of thumb is: if you cannot see the truck driver''s mirrors,
    the truck driver cannot see you. You are in their ''No-Zone''.'
- id: 178
  category: sharing_the_road
  question: Under Manitoba law, what is the minimum distance a driver must maintain
    when passing a cyclist on a road with a speed limit of 60 km/h or less?
  choices:
    A: 0.5 metres
    B: 1 metre
    C: 1.5 metres
    D: 2 metres
  answer: B
  explanation: Manitoba's Highway Traffic Act requires drivers to maintain a minimum
    distance of 1 metre when passing a cyclist on roads with speed limits of 60 km/h
    or less.
- id: 179
  category: sharing_the_road
  question: When a school bus is stopped on a divided highway with its red lights
    flashing and stop arm extended, which drivers are required to stop?
  choices:
    A: All drivers in both directions
    B: Only drivers following the bus
    C: Only drivers in the lane immediately next to the bus
    D: Only drivers traveling in the same direction as the bus
  answer: D
  explanation: On a divided highway (where there is a physical median separating traffic),
    drivers traveling in the opposite direction of the school bus are not required
    to stop, but should proceed with caution.
- id: 180
  category: sharing_the_road
  question: In Manitoba, if you are passing a cyclist on a highway with a speed limit
    over 60 km/h, what is the minimum passing distance required by law?
  choices:
    A: 1 metre
    B: 1.2 metres
    C: 1.5 metres
    D: 2 metres
  answer: C
  explanation: For highways with speed limits exceeding 60 km/h, Manitoba law requires
    drivers to provide at least 1.5 metres of space when passing a cyclist.
- id: 181
  category: sharing_the_road
  question: 'When an emergency vehicle with its siren and lights on is approaching
    you from behind on a two-way street, you should:'
  choices:
    A: Stop immediately in your current lane
    B: Speed up to get out of the way
    C: Move to the right edge of the road and stop
    D: Move to the left edge of the road and stop
  answer: C
  explanation: When an emergency vehicle approaches, you must move to the right-hand
    curb or edge of the road, clear of any intersection, and stop until the vehicle
    has passed.
- id: 182
  category: sharing_the_road
  question: In the City of Winnipeg and many other Manitoba municipalities, what is
    the standard speed limit in a reduced-speed school zone?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: Most reduced-speed school zones in Manitoba municipalities, including
    Winnipeg, are set to 30 km/h during specified months and times.
- id: 183
  category: sharing_the_road
  question: Which of the following vehicles are required to stop at all railway crossings
    in Manitoba, even if the signals are not flashing?
  choices:
    A: All passenger vehicles
    B: Motorcycles
    C: School buses and vehicles carrying certain dangerous goods
    D: Delivery trucks
  answer: C
  explanation: Under the Highway Traffic Act, school buses and vehicles designed to
    carry flammable or explosive substances must stop at all railway crossings.
- id: 184
  category: sharing_the_road
  question: When following a large truck, why should you maintain a greater following
    distance than you would for a passenger car?
  choices:
    A: Trucks can accelerate faster than cars
    B: To allow the truck driver to see you in their side mirrors
    C: Trucks are required to stop at all intersections
    D: To prevent the truck from rolling backward into you
  answer: B
  explanation: 'Large trucks have significant blind spots (No-Zones). If you follow
    too closely, the driver cannot see you in their mirrors. A good rule is: if you
    can''t see the driver''s face in their side mirror, they can''t see you.'
- id: 185
  category: sharing_the_road
  question: 'In Manitoba, a ''pilot vehicle'' with flashing amber lights and a ''D''
    sign or ''Long Load'' sign indicates:'
  choices:
    A: A snowplow is ahead
    B: An oversized load is being escorted
    C: A funeral procession is in progress
    D: Road construction is starting
  answer: B
  explanation: Pilot vehicles are used to warn other drivers that an oversized or
    extra-long load is on the road, which may require extra space or lane adjustments.
- id: 186
  category: sharing_the_road
  question: 'When a cyclist is using a designated ''Diamond Lane'' in Manitoba, motorists
    should:'
  choices:
    A: Drive in the lane to force the cyclist out
    B: Only enter the lane to make a right turn within the same block
    C: Honk to warn the cyclist to move to the sidewalk
    D: Never enter the lane for any reason
  answer: B
  explanation: Diamond lanes are reserved for specific vehicles (like buses and bikes).
    Motorists may only enter them shortly before making a right turn, usually within
    the same block as the turn.
- id: 187
  category: sharing_the_road
  question: 'When passing a stopped tow truck with its amber lights flashing on a
    road where the speed limit is 60 km/h, you must slow down to:'
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: C
  explanation: Manitoba's Move Over law includes tow trucks and roadside assistance
    vehicles. If the speed limit is below 80 km/h, you must slow to 40 km/h when passing
    them while they are stopped with lights flashing.
- id: 188
  category: sharing_the_road
  question: 'If you see a pedestrian with a white cane at a crosswalk, it indicates
    they are visually impaired. You should:'
  choices:
    A: Honk your horn to let them know you are there
    B: Give them the right-of-way and extra space to cross
    C: Drive around them quickly
    D: Wait for them to look at you before proceeding
  answer: B
  explanation: Drivers must exercise extra caution and yield the right-of-way to pedestrians
    with white canes or guide dogs, as they are visually impaired.
- id: 189
  category: sharing_the_road
  question: 'When a large truck is turning right at an intersection, it may need to:'
  choices:
    A: Turn from the left lane
    B: Swing wide to the left before turning right
    C: Stop and back up to make the turn
    D: Speed up to clear the intersection
  answer: B
  explanation: Large vehicles need more space to turn. They often swing wide to the
    left to clear the curb on a right-hand turn. Never try to squeeze between a turning
    truck and the curb.
- id: 190
  category: sharing_the_road
  question: In Manitoba, who has the right-of-way at an intersection with no traffic
    signs or signals (an uncontrolled intersection)?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling faster
    D: The vehicle on the busier street
  answer: B
  explanation: At an uncontrolled intersection, you must yield the right-of-way to
    any vehicle approaching from your right. However, you must always yield to pedestrians
    already in the intersection.
- id: 191
  category: vehicle_information
  question: In Manitoba, when must your vehicle's headlights be turned on?
  choices:
    A: From sunset to sunrise.
    B: From one hour after sunset to one hour before sunrise.
    C: From half an hour after sunset to half an hour before sunrise.
    D: Only when it is raining or snowing.
  answer: C
  explanation: According to the Manitoba Driver's Handbook, headlights must be used
    from a half hour after sunset to a half hour before sunrise, and at any time when
    visibility is reduced to less than 150 metres.
- id: 192
  category: vehicle_information
  question: 'In Manitoba, you must switch your headlights to low beams when following
    another vehicle within a distance of:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: When following another vehicle, you must dim your high beams within
    60 metres of that vehicle.
- id: 193
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle in
    Manitoba?
  choices:
    A: 1.0 millimetre
    B: 1.6 millimetres
    C: 2.5 millimetres
    D: 3.2 millimetres
  answer: B
  explanation: Under Manitoba's Highway Traffic Act, tires are considered unsafe if
    the tread depth is less than 1.6 millimetres (2/32 of an inch).
- id: 194
  category: vehicle_information
  question: According to Manitoba regulations, what is the maximum level of window
    tint allowed on the front side windows (driver and front passenger)?
  choices:
    A: No tint is allowed at all.
    B: The windows must allow at least 35% light transmission.
    C: The windows must allow at least 50% light transmission.
    D: The windows must allow at least 70% light transmission.
  answer: C
  explanation: Manitoba law requires that front side windows allow at least 50% of
    light to pass through. Tinting that blocks more than 50% of light on these windows
    is illegal.
- id: 195
  category: vehicle_information
  question: 'Every motor vehicle in Manitoba must be equipped with a horn that can
    be heard from a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 200 metres
  answer: B
  explanation: The Manitoba Highway Traffic Act specifies that a vehicle's horn must
    be audible under normal conditions from a distance of no less than 60 metres.
- id: 196
  category: vehicle_information
  question: When towing a trailer in Manitoba that obscures the view of the interior
    rearview mirror, what equipment is required?
  choices:
    A: A wide-angle interior mirror.
    B: A rearview camera system.
    C: Mirrors on both the left and right exterior sides of the vehicle.
    D: A spotter in the passenger seat.
  answer: C
  explanation: If the view to the rear is obstructed by a trailer or load, Manitoba
    law requires the vehicle to be equipped with mirrors on both the left and right
    sides to provide a clear view of the highway to the rear.
- id: 197
  category: vehicle_information
  question: In Manitoba, the rear license plate of a vehicle must be illuminated by
    a light of what color?
  choices:
    A: Red
    B: Yellow
    C: White
    D: Blue
  answer: C
  explanation: The Highway Traffic Act requires the rear license plate to be illuminated
    by a white light so that the plate is clearly legible from a distance of 15 metres.
- id: 198
  category: vehicle_information
  question: Which of the following is true regarding the braking system requirements
    for motor vehicles in Manitoba?
  choices:
    A: Only a foot brake is required.
    B: A vehicle must have two separate means of applying brakes (service brake and
      parking brake).
    C: The parking brake is only required for manual transmissions.
    D: Anti-lock brakes (ABS) are mandatory for all vehicles regardless of age.
  answer: B
  explanation: Manitoba law requires every motor vehicle to have two separate braking
    systems, typically a hydraulic foot brake (service brake) and a mechanical parking
    brake.
- id: 199
  category: vehicle_information
  question: Under Manitoba law, what is the requirement for a vehicle's exhaust system?
  choices:
    A: It must be loud enough to warn pedestrians.
    B: It must be equipped with a muffler in good working order to prevent excessive
      noise.
    C: Exhaust cut-outs or bypasses are permitted for highway driving.
    D: The exhaust pipe must point toward the sidewalk.
  answer: B
  explanation: Vehicles must have a muffler that prevents excessive or unusual noise
    and smoke. Bypasses or cut-outs are illegal in Manitoba.
- id: 200
  category: vehicle_information
  question: In Manitoba, how many headlights are required on the front of a motor
    vehicle (other than a motorcycle)?
  choices:
    A: At least one on the driver's side.
    B: At least two, one on each side.
    C: Four, including fog lights.
    D: Headlights are only required if driving at night.
  answer: B
  explanation: Every motor vehicle other than a motorcycle must be equipped with at
    least two headlights, with one on each side of the front of the vehicle.
- id: 201
  category: vehicle_information
  question: If you are hauling a load that extends more than 1.0 metre beyond the
    rear of your vehicle in Manitoba, what must you do during daylight hours?
  choices:
    A: Keep your hazard lights on.
    B: Attach a red flag (at least 30cm x 30cm) to the end of the load.
    C: Drive only in the right-hand lane.
    D: No special marking is required during the day.
  answer: B
  explanation: When a load extends more than 1.0 metre past the rear of the vehicle,
    a red flag must be attached to the end of the load during the day for safety.
- id: 202
  category: vehicle_information
  question: In Manitoba, what is the minimum visibility distance required for turn
    signal lights?
  choices:
    A: 15 metres
    B: 30 metres
    C: 60 metres
    D: 100 metres
  answer: B
  explanation: Turn signal lights must be visible from a distance of at least 30 metres
    in normal sunlight.
- id: 203
  category: vehicle_information
  question: When a trailer is attached to a vehicle in Manitoba, what safety equipment
    is mandatory in addition to the hitch?
  choices:
    A: A secondary locking pin only.
    B: Safety chains or cables.
    C: A weight-distribution bar.
    D: A 'Wide Load' sign.
  answer: B
  explanation: In addition to the primary coupling (hitch), Manitoba law requires
    trailers to be attached with safety chains or cables capable of holding the trailer
    should the main hitch fail.
- id: 204
  category: vehicle_information
  question: During which period are studded tires legally permitted on vehicles in
    Manitoba?
  choices:
    A: November 1 to March 31
    B: October 1 to April 30
    C: October 15 to April 15
    D: December 1 to March 1
  answer: B
  explanation: In Manitoba, studded tires may only be used between October 1 and April
    30 to prevent unnecessary road wear during warmer months.
- id: 205
  category: vehicle_information
  question: Under Manitoba regulations, what is the minimum amount of light that must
    be able to pass through the tinting on front side windows?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: Tinting is not allowed on front side windows
  answer: B
  explanation: Manitoba's Highway Traffic Act specifies that aftermarket window tint
    on the front side windows (to the left and right of the driver) must allow at
    least 50% of light to pass through.
- id: 206
  category: vehicle_information
  question: If your vehicle's interior rear-view mirror is obstructed by a load or
    a trailer, what equipment is required by Manitoba law?
  choices:
    A: A wide-angle interior mirror
    B: A passenger to look out the back window
    C: Both left and right outside mirrors
    D: Only a left outside mirror
  answer: C
  explanation: If the view to the rear is obstructed, Manitoba law requires the vehicle
    to be equipped with mirrors on both the left and right sides to provide a clear
    view of the highway to the rear.
- id: 207
  category: vehicle_information
  question: Your vehicle's horn must be audible from a distance of at least how many
    metres?
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 200 metres
  answer: B
  explanation: The Manitoba Driver's Handbook states that every motor vehicle must
    be equipped with a horn that can be heard from a distance of at least 60 metres.
- id: 208
  category: vehicle_information
  question: 'The rear license plate on a vehicle in Manitoba must be illuminated so
    that it is clearly visible from a distance of:'
  choices:
    A: 5 metres
    B: 10 metres
    C: 15 metres
    D: 30 metres
  answer: C
  explanation: Manitoba law requires a white light to illuminate the rear license
    plate so that it is legible from a distance of 15 metres.
- id: 209
  category: vehicle_information
  question: Which of the following is true regarding the use of a muffler in Manitoba?
  choices:
    A: Muffler cut-outs or bypasses are permitted for highway driving
    B: A muffler is only required for vehicles manufactured after 2000
    C: Every motor vehicle must have a muffler in good working order to prevent excessive
      noise and smoke
    D: Mufflers are optional if the vehicle passes an emissions test
  answer: C
  explanation: Every motor vehicle must be equipped with a muffler in good working
    order to prevent excessive or unusual noise and annoying smoke. Bypass or cut-out
    devices are prohibited.
- id: 210
  category: vehicle_information
  question: When towing a trailer in Manitoba, what is the requirement for safety
    chains?
  choices:
    A: They are only required for trailers over 2,000 kg
    B: They must be connected but do not need to be crossed
    C: They must be crossed under the tongue of the trailer
    D: They are not required if using a ball hitch
  answer: C
  explanation: Safety chains must be used in addition to the hitch and should be crossed
    under the trailer tongue to prevent the tongue from dropping to the ground if
    the hitch fails.
- id: 211
  category: vehicle_information
  question: A load extending more than how many metres beyond the rear of a vehicle
    must be marked with a red flag (day) or red light (night)?
  choices:
    A: 0.5 metres
    B: 1.0 metre
    C: 1.5 metres
    D: 2.0 metres
  answer: C
  explanation: In Manitoba, if a load extends 1.5 metres or more beyond the rear of
    the vehicle, it must be marked with a red flag during the day and a red light
    or reflector at night.
- id: 212
  category: vehicle_information
  question: According to Manitoba law, what is the maximum width allowed for a standard
    passenger vehicle, including the load?
  choices:
    A: 2.0 metres
    B: 2.6 metres
    C: 3.0 metres
    D: 3.5 metres
  answer: B
  explanation: The maximum width for most vehicles on Manitoba highways is 2.6 metres.
    Anything wider generally requires a special permit.
- id: 213
  category: vehicle_information
  question: Which of the following is a requirement for the windshield of a vehicle
    in Manitoba?
  choices:
    A: It must be made of safety glass
    B: It must be kept clear of frost and moisture
    C: It must not have any cracks that impair the driver's view
    D: All of the above
  answer: D
  explanation: Manitoba regulations require windshields to be safety glass, free of
    obstructions or cracks that impair vision, and equipped with working wipers and
    defrosters to clear moisture/frost.
- id: 214
  category: vehicle_information
  question: 'In Manitoba, clearance lamps (amber at front, red at rear) are required
    on any vehicle that has a total width of more than:'
  choices:
    A: 1.85 metres
    B: 2.05 metres
    C: 2.25 metres
    D: 2.50 metres
  answer: B
  explanation: Vehicles with a width exceeding 2.05 metres must be equipped with clearance
    lamps to indicate the extreme width of the vehicle to other drivers.
- id: 215
  category: signs_and_signals
  question: In Manitoba, what must you do when approaching a flashing red traffic
    light?
  choices:
    A: Slow down and proceed with caution
    B: Stop and wait for the light to turn green
    C: Stop, yield to cross traffic and pedestrians, and proceed when safe
    D: Treat it as a yield sign and slow to 20 km/h
  answer: C
  explanation: 'According to the Manitoba Driver''s Handbook, a flashing red light
    must be treated the same as a stop sign: come to a complete stop, yield to traffic
    and pedestrians, and proceed only when it is safe.'
- id: 216
  category: signs_and_signals
  question: What does a flashing amber (yellow) light at an intersection mean in Manitoba?
  choices:
    A: Stop and wait for the light to change
    B: Speed up to clear the intersection quickly
    C: The light is about to turn red
    D: Reduce speed and proceed with caution
  answer: D
  explanation: A flashing amber light is a warning to reduce speed, be alert, and
    proceed through the intersection with caution.
- id: 217
  category: signs_and_signals
  question: In Manitoba, what does a solid white line painted on the pavement between
    lanes of traffic mean?
  choices:
    A: Lane changing is prohibited
    '0': Lane changing is discouraged
    C: Traffic is moving in opposite directions
    D: You are approaching a school zone
  answer: B
  explanation: In Manitoba, a solid white line between lanes indicates that lane changing
    is discouraged. While not strictly prohibited like a double solid line, it signifies
    that it is safer to stay in your lane.
- id: 218
  category: signs_and_signals
  question: 'A diamond symbol painted on a lane in Manitoba indicates that the lane
    is:'
  choices:
    A: Reserved for specific vehicles like buses, bicycles, or high-occupancy vehicles
    B: A high-speed passing lane
    C: A lane that is ending shortly
    D: Reserved for emergency vehicles only
  answer: A
  explanation: The diamond symbol marks 'Reserved Lanes.' These are restricted for
    use by specific vehicles such as buses, taxis, or bicycles, often during specific
    times of the day as posted on nearby signs.
- id: 219
  category: signs_and_signals
  question: When approaching a railway crossing with a stop sign in Manitoba, you
    must stop your vehicle no closer than how many metres from the nearest rail?
  choices:
    A: 2 metres
    B: 3 metres
    C: 5 metres
    D: 10 metres
  answer: C
  explanation: Manitoba law requires drivers to stop at least 5 metres back from the
    nearest rail at a railway crossing, and no further than 15 metres.
- id: 220
  category: signs_and_signals
  question: Under Manitoba law, when are you permitted to make a left turn on a red
    light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: Anytime there is no oncoming traffic
    D: Only if a green arrow is also illuminated
  answer: B
  explanation: In Manitoba, you may turn left on a red light only if you are turning
    from a one-way street onto another one-way street, after coming to a complete
    stop and yielding to pedestrians and other traffic.
- id: 221
  category: signs_and_signals
  question: What does a vertical white bar signal (transit priority signal) mean in
    Manitoba?
  choices:
    A: All traffic must stop
    B: Only emergency vehicles may proceed
    C: Only transit buses may proceed
    D: Pedestrians have the right of way
  answer: C
  explanation: A vertical white bar on a black background is a transit priority signal.
    It allows transit buses to proceed through the intersection while other traffic
    faces a red light.
- id: 222
  category: signs_and_signals
  question: When you see a 'Yield' sign while entering a flow of traffic, what does
    Manitoba law require you to do?
  choices:
    A: Stop completely before proceeding
    B: Slow down and give the right of way to any traffic in or approaching the intersection
    C: Speed up to merge smoothly with traffic
    D: Maintain your speed as other drivers must let you in
  answer: B
  explanation: A yield sign means you must slow down and, if necessary, stop to give
    the right of way to traffic and pedestrians. You proceed only when it is safe
    to do so without interfering with other traffic.
- id: 223
  category: signs_and_signals
  question: What do broken (dashed) yellow lines on a roadway indicate in Manitoba?
  choices:
    A: You are on a one-way street
    B: Passing is permitted when safe
    C: Passing is strictly prohibited
    D: The lane is for turning only
  answer: B
  explanation: Broken yellow lines separate traffic moving in opposite directions
    and indicate that passing is permitted if the way is clear and it can be done
    safely.
- id: 224
  category: signs_and_signals
  question: According to the Manitoba Highway Traffic Act, where are U-turns prohibited?
  choices:
    A: Only in school zones
    B: At any intersection controlled by a traffic signal
    C: On any gravel road
    D: Only on one-way streets
  answer: B
  explanation: In Manitoba, U-turns are prohibited at any intersection controlled
    by a traffic-control signal (lights) unless a sign specifically permits the turn.
- id: 225
  category: signs_and_signals
  question: What is the correct hand signal to indicate you are stopping or slowing
    down suddenly in Manitoba?
  choices:
    A: Left arm extended straight out
    B: Left arm out and bent upward
    C: Left arm out and bent downward
    D: Waving your hand out the window
  answer: C
  explanation: The hand signal for stopping or slowing down is the left arm extended
    out the window and bent downward at the elbow with the palm facing backward.
- id: 226
  category: signs_and_signals
  question: In Manitoba, when approaching a pedestrian corridor (marked with overhead
    lights and signs), you are prohibited from passing another vehicle within how
    many metres of the corridor?
  choices:
    A: 15 metres
    B: 30 metres
    C: 50 metres
    D: 100 metres
  answer: B
  explanation: In Manitoba, it is illegal to pass a vehicle that is stopped or slowing
    down as it approaches a pedestrian corridor. You must not pass any vehicle within
    30 metres of a pedestrian corridor.
- id: 227
  category: signs_and_signals
  question: What does a solid yellow line on your side of the center line indicate
    in Manitoba?
  choices:
    A: Passing is permitted if it is safe
    B: Passing is prohibited
    C: You are in a one-way zone
    D: You must turn left ahead
  answer: B
