questions:
- id: 1
  category: license_system
  question: Au Manitoba, quel est l'âge minimum pour demander un permis d'apprenti
    conducteur de classe 5 si vous êtes inscrit à un cours d'éducation routière au
    secondaire ?
  choices:
    A: 15 ans
    B: 15,5 ans
    C: 16 ans
    D: 14,5 ans
  answer: B
  explanation: Au Manitoba, l'âge minimum pour un permis d'apprenti conducteur de
    classe 5 est de 16 ans, mais il est réduit à 15,5 ans si le demandeur est inscrit
    à un cours d'éducation routière au secondaire approuvé par la MPI.
- id: 2
  category: license_system
  question: Pendant combien de temps un conducteur doit-il rester à l'étape d'apprentissage
    (L) du programme de licences de conduire par étapes (GDL) avant d'être admissible
    à un examen de conduite ?
  choices:
    A: 6 mois
    B: 12 mois
    C: 9 mois
    D: 15 mois
  answer: C
  explanation: Les conducteurs au Manitoba doivent détenir un permis d'apprenti conducteur
    pendant au moins neuf mois de conduite « active » avant de pouvoir passer l'examen
    de conduite pour passer à l'étape intermédiaire.
- id: 3
  category: license_system
  question: Quel est le taux d'alcoolémie (BAC) maximal autorisé pour un conducteur
    à l'étape d'apprentissage ou intermédiaire du programme GDL ?
  choices:
    A: 0,00
    B: 0,02
    C: 0,05
    D: 0,08
  answer: A
  explanation: Le Manitoba a une politique de tolérance zéro pour l'alcool pour tous
    les conducteurs du programme GDL ; le taux d'alcoolémie (BAC) doit être de 0,00.
- id: 4
  category: license_system
  question: Un conducteur superviseur pour une personne détenant un permis d'apprenti
    conducteur de classe 5 doit avoir détenu un permis valide de classe 5 complet
    (F) pendant au moins combien d'années ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: C
  explanation: Le conducteur superviseur doit avoir détenu un permis valide de classe
    5 complet pendant au moins trois ans et doit être assis sur le siège passager
    avant.
- id: 5
  category: license_system
  question: À l'étape intermédiaire (I) du programme GDL, quelles sont les restrictions
    concernant les passagers entre minuit et 5 h 00 ?
  choices:
    A: Aucun passager autorisé
    B: Un seul passager est autorisé, à moins qu'un conducteur superviseur ne soit
      sur le siège avant
    C: Seuls les membres de la famille sont autorisés
    D: Jusqu'à trois passagers sont autorisés
  answer: B
  explanation: Entre minuit et 5 h 00, un conducteur à l'étape intermédiaire est limité
    à un passager sur le siège avant, à moins d'être accompagné d'un conducteur superviseur.
- id: 6
  category: license_system
  question: Quelle est la durée obligatoire de l'étape intermédiaire (I) dans le programme
    GDL du Manitoba ?
  choices:
    A: 9 mois
    B: 12 mois
    C: 15 mois
    D: 24 mois
  answer: C
  explanation: L'étape intermédiaire dure au minimum 15 mois. Après avoir terminé
    avec succès cette étape, le conducteur passe à l'étape complète.
- id: 7
  category: license_system
  question: Une fois que vous passez à l'étape complète (F), pendant combien de temps
    devez-vous maintenir un taux d'alcoolémie de 0,00 ?
  choices:
    A: Pendant les 12 premiers mois
    B: Pendant les 24 premiers mois
    C: Pendant les 36 premiers mois
    D: Indéfiniment
  answer: C
  explanation: Au Manitoba, même après avoir atteint l'étape complète, les conducteurs
    doivent maintenir un taux d'alcoolémie (BAC) de 0,00 pendant les 36 premiers mois.
- id: 8
  category: license_system
  question: Si vous échouez à l'examen théorique de classe 5, combien de temps devez-vous
    attendre avant de pouvoir le repasser ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Au Manitoba, si vous échouez à un examen théorique ou à un examen de
    conduite, il y a une période d'attente obligatoire de 7 jours avant de pouvoir
    tenter l'examen à nouveau.
- id: 9
  category: license_system
  question: Selon le système de cotes de sécurité des conducteurs (DSR), quel est
    le nombre maximum de points qu'un conducteur peut atteindre du côté des mérites
    de l'échelle ?
  choices:
    A: '+10'
    B: '+15'
    C: '+17'
    D: '+20'
  answer: C
  explanation: L'échelle des cotes de sécurité des conducteurs au Manitoba va de -20
    (risque le plus élevé) à +17 (risque le plus faible).
- id: 10
  category: license_system
  question: Dans un délai de combien de jours devez-vous informer la Société d'assurance
    publique du Manitoba (MPI) d'un changement de nom ou d'adresse ?
  choices:
    A: 7 jours
    B: 15 jours
    C: 30 jours
    D: 60 jours
  answer: B
  explanation: La loi du Manitoba exige que les conducteurs informent la MPI de tout
    changement de nom ou d'adresse dans les 15 jours.
- id: 11
  category: license_system
  question: Laquelle des affirmations suivantes est une exigence pour un conducteur
    en phase d'apprentissage (L) concernant les appareils de communication électronique
    ?
  choices:
    A: Ils peuvent utiliser des appareils mains libres uniquement
    B: Ils peuvent utiliser un téléphone cellulaire uniquement pour le GPS
    C: Il leur est strictement interdit d'utiliser tout appareil électronique portatif
      ou mains libres
    D: Ils peuvent utiliser un téléphone cellulaire lorsqu'ils sont arrêtés à un feu
      rouge
  answer: C
  explanation: Les conducteurs en phase d'apprentissage et intermédiaire du programme
    GDL (système de permis de conduire par étapes) ont l'interdiction d'utiliser tout
    téléphone cellulaire ou autre appareil électronique portatif ou mains libres en
    conduisant.
- id: 12
  category: license_system
  question: Quel est le nombre minimum de documents requis pour prouver votre identité
    et votre résidence lors d'une première demande de permis de conduire du Manitoba
    ?
  choices:
    A: Un document
    B: Deux documents
    C: Trois documents
    D: Quatre documents
  answer: B
  explanation: Vous devez fournir au moins deux documents prouvant votre identité,
    votre date de naissance et le fait que vous résidez au Manitoba.
- id: 13
  category: license_system
  question: Si un conducteur du programme GDL enfreint l'une des conditions de son
    permis, quelle est la conséquence potentielle pour une première infraction ?
  choices:
    A: Un avertissement seulement
    B: Une amende obligatoire de 1 000 $
    C: La suspension du permis et un recul sur l'échelle de la Cote de sécurité de
      l'automobiliste (DSR)
    D: La révocation immédiate et permanente du permis
  answer: C
  explanation: La violation des conditions du GDL peut entraîner une suspension du
    permis, des amendes et une réduction de votre score de Cote de sécurité de l'automobiliste
    (DSR).
- id: 14
  category: license_system
  question: En phase d'apprentissage (L), qui est autorisé à bord du véhicule en plus
    du conducteur et du conducteur superviseur ?
  choices:
    A: Les membres de la famille immédiate seulement
    B: Aucun autre passager n'est autorisé
    C: Jusqu'à deux amis
    D: N'importe qui, tant qu'il y a des ceintures de sécurité
  answer: B
  explanation: En phase d'apprentissage, le seul passager autorisé dans le véhicule
    est le conducteur superviseur.
- id: 15
  category: license_system
  question: Après s'être installé au Manitoba, de combien de temps dispose un nouveau
    résident pour échanger son permis de conduire d'une autre province contre un permis
    du Manitoba ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 3 mois
    D: 6 mois
  answer: C
  explanation: Les nouveaux résidents du Manitoba qui détiennent un permis de conduire
    valide d'une autre province peuvent conduire pendant une période allant jusqu'à
    trois mois avant de devoir obtenir un permis de conduire du Manitoba.
- id: 16
  category: license_system
  question: Une personne titulaire d'un permis de conduire de classe 5 au Manitoba
    est autorisée à remorquer une remorque à condition que le poids de celle-ci ne
    dépasse pas quelle limite ?
  choices:
    A: 2 500 kg
    B: 4 540 kg
    C: 5 000 kg
    D: 7 250 kg
  answer: B
  explanation: Un permis de classe 5 permet de conduire un véhicule de tourisme et
    de remorquer une remorque pesant jusqu'à 4 540 kg (10 000 lb).
- id: 17
  category: license_system
  question: Si vous échouez à un examen de conduite de classe 5 au Manitoba, quel
    est le délai d'attente minimal avant de pouvoir repasser l'examen ?
  choices:
    A: 7 jours
    B: 10 jours
    C: 14 jours
    D: 30 jours
  answer: C
  explanation: Au Manitoba, si vous échouez à un examen de conduite, vous devez attendre
    au moins 14 jours avant de pouvoir vous présenter de nouveau à l'examen.
- id: 18
  category: license_system
  question: Dans le cadre du système de Cote de sécurité de l'automobiliste (DSR),
    de combien de points un conducteur recule-t-il sur l'échelle pour chaque accident
    responsable dans lequel il est impliqué ?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 10 points
  answer: C
  explanation: Au Manitoba, les conducteurs reculent de 5 points sur l'échelle de
    la DSR pour chaque accident dont ils sont responsables.
- id: 19
  category: license_system
  question: Lequel des véhicules suivants peut être conduit par une personne titulaire
    d'un permis de conduire de classe 5 valide au Manitoba ?
  choices:
    A: Une motocyclette
    B: Un cyclomoteur
    C: Un taxi (transportant des passagers)
    D: Une ambulance
  answer: B
  explanation: Un permis de classe 5 permet à son titulaire de conduire un cyclomoteur.
    La conduite d'une motocyclette nécessite un permis de classe 6, et les taxis ou
    les ambulances nécessitent un permis de classe 4.
- id: 20
  category: license_system
  question: Quand un conducteur du Manitoba doit-il signaler à la Société d'assurance
    publique du Manitoba (MPI) un problème de santé susceptible d'affecter sa capacité
    à conduire en toute sécurité ?
  choices:
    A: Seulement lors du renouvellement de son permis
    B: Dans les 30 jours suivant le diagnostic
    C: Immédiatement
    D: Seulement si un médecin le demande
  answer: C
  explanation: Les conducteurs sont légalement tenus de signaler immédiatement tout
    problème de santé ou handicap physique susceptible d'affecter leur capacité à
    conduire en toute sécurité au service de l'aptitude à la conduite de la MPI.
- id: 21
  category: license_system
  question: Au Manitoba, si le taux d'alcoolémie (BAC) d'un conducteur se situe entre
    0,05 et 0,079 (la plage d'« avertissement »), quelle est la durée de la suspension
    immédiate du permis de conduire sur les lieux pour une première infraction ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 72 heures
    D: 7 jours
  answer: C
  explanation: En vertu de la suspension administrative progressive du permis du Manitoba,
    une première occurrence de conduite avec un taux d'alcoolémie (BAC) compris entre
    0,05 et 0,079 entraîne une suspension immédiate du permis de conduire de 72 heures.
- id: 22
  category: license_system
  question: À l'étape intermédiaire (I) du programme de permis de conduire par étapes
    (GDL), combien de passagers sont autorisés sur le siège avant du véhicule ?
  choices:
    A: Aucun
    B: Un seul
    C: Deux, s'ils sont des membres de la famille
    D: Autant qu'il y a de ceintures de sécurité
  answer: B
  explanation: À l'étape intermédiaire, le conducteur est limité à un seul passager
    sur le siège avant, quelle que soit l'heure de la journée.
- id: 23
  category: license_system
  question: Lors d'un examen de conduite au Manitoba, quel document doit être présenté
    pour le véhicule utilisé ?
  choices:
    A: L'acte de vente du véhicule
    B: Un certificat d'immatriculation valide du véhicule
    C: Un certificat de sécurité mécanique
    D: Le manuel du propriétaire du véhicule
  answer: B
  explanation: Pour un examen de conduite, le véhicule doit être en bon état de fonctionnement
    et vous devez fournir un certificat d'immatriculation valide prouvant que le véhicule
    est adéquatement assuré.
- id: 24
  category: license_system
  question: Quelle classe de permis est requise au Manitoba pour conduire un taxi,
    une ambulance ou un autobus ayant une capacité allant jusqu'à 24 passagers ?
  choices:
    A: Classe 3
    B: Classe 4
    C: Classe 5
    D: Classe 1
  answer: B
  explanation: Un permis de classe 4 est requis pour conduire des taxis, des ambulances
    et des petits autobus (jusqu'à 24 passagers) au Manitoba.
- id: 25
  category: license_system
  question: Où doit se placer le conducteur superviseur lorsqu'un conducteur à l'étape
    d'apprentissage (L) conduit un véhicule de classe 5 ?
  choices:
    A: N'importe où dans le véhicule
    B: Directement derrière le conducteur
    C: Sur le siège du passager avant
    D: Sur le siège le plus proche du conducteur
  answer: C
  explanation: Le conducteur superviseur d'un stagiaire doit occuper le siège du passager
    avant, être conscient et capable de prendre le contrôle du véhicule si nécessaire.
- id: 26
  category: license_system
  question: 'Dans le cadre du système de cote de sécurité de l''automobiliste (DSR),
    combien de points un conducteur perd-il généralement pour la plupart des infractions
    routières (ex. : excès de vitesse, omission de s''arrêter) ?'
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: La plupart des infractions routières courantes au Manitoba entraînent
    une baisse de 2 points sur l'échelle de la cote de sécurité de l'automobiliste
    (DSR).
- id: 27
  category: license_system
  question: Au Manitoba, la participation au programme d'antidémarrage avec éthylomètre
    est obligatoire pour quels conducteurs ?
  choices:
    A: Tout conducteur participant au programme GDL
    B: Les conducteurs condamnés pour une infraction de conduite avec facultés affaiblies
    C: Les conducteurs ayant atteint -10 sur l'échelle DSR
    D: Les conducteurs qui échouent à l'examen de conduite trois fois
  answer: B
  explanation: Le programme d'antidémarrage avec éthylomètre est obligatoire pour
    les conducteurs condamnés pour certaines infractions de conduite liées à l'alcool
    en vertu du Code criminel ou pour ceux qui ont plusieurs suspensions sur les lieux.
- id: 28
  category: license_system
  question: À quelle fréquence le permis de conduire du Manitoba doit-il être entièrement
    renouvelé (y compris une nouvelle photo) ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 5 ans
    D: Tous les 10 ans
  answer: C
  explanation: Bien que les paiements et les mises à jour d'informations se fassent
    annuellement, le permis de conduire du Manitoba doit être entièrement renouvelé
    avec une nouvelle photo tous les cinq ans.
- id: 29
  category: driver_testing
  question: Pour satisfaire aux exigences visuelles minimales d'un permis de classe
    5 au Manitoba, quelle doit être votre acuité visuelle pour votre meilleur œil
    ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/60
  answer: C
  explanation: Selon les normes de la Société d'assurance publique du Manitoba (MPI),
    un candidat doit avoir une acuité visuelle minimale de 20/40 dans son meilleur
    œil, avec ou sans lentilles correctrices.
- id: 30
  category: driver_testing
  question: Lors d'un examen de conduite au Manitoba, si les feux de freinage de votre
    véhicule ne fonctionnent pas, que se passera-t-il ?
  choices:
    A: L'examinateur vous donnera un avertissement et continuera.
    B: L'examen sera annulé et vous devrez reprendre rendez-vous.
    C: Vous serez autorisé à utiliser des signaux manuels à la place.
    D: Vous perdrez 10 points mais continuerez l'examen.
  answer: B
  explanation: Pour un examen de conduite au Manitoba, le véhicule doit être en bon
    état de fonctionnement. Si des équipements tels que les feux de freinage ou les
    clignotants ne fonctionnent pas, l'examen est annulé pour des raisons de sécurité.
- id: 31
  category: driver_testing
  question: Quel est le rabais maximal qu'un conducteur peut obtenir sur sa prime
    d'assurance de véhicule au sommet de l'échelle de la Cote de sécurité du conducteur
    (CSC - DSR) (niveau 15 ou plus) ?
  choices:
    A: 25 %
    B: 33 %
    C: 40 %
    D: 50 %
  answer: B
  explanation: Les conducteurs au niveau 15 ou plus de l'échelle de la CSC sont admissibles
    au rabais maximal de 33 % sur leurs primes d'assurance de véhicule.
- id: 32
  category: driver_testing
  question: Si vous développez un problème de santé susceptible d'affecter votre capacité
    à conduire en toute sécurité, quand devez-vous le signaler à la MPI ?
  choices:
    A: Lors de votre prochain renouvellement de permis
    B: Dans les 30 jours
    C: Immédiatement
    D: Uniquement si vous êtes impliqué dans un accident
  answer: C
  explanation: La loi du Manitoba exige que les conducteurs signalent immédiatement
    tout problème de santé ou handicap physique susceptible de nuire à la conduite
    sécuritaire d'un véhicule à moteur.
- id: 33
  category: driver_testing
  question: Que couvre le « Régime de protection contre les préjudices personnels
    » (RPPP - PIPP) du Manitoba ?
  choices:
    A: Uniquement le conducteur responsable
    B: Uniquement les piétons frappés par un véhicule
    C: Tous les résidents du Manitoba blessés dans un accident de la route, peu importe
      la responsabilité
    D: Uniquement les dommages au véhicule
  answer: C
  explanation: Le RPPP est un système d'assurance sans égard à la responsabilité au
    Manitoba qui offre à tous les résidents une couverture en cas de blessure ou de
    décès résultant d'un accident de la route, peu importe qui en est responsable.
- id: 34
  category: driver_testing
  question: Lors d'un rendez-vous pour un examen de conduite pratique au Manitoba,
    combien de temps à l'avance devriez-vous arriver au centre d'examen ?
  choices:
    A: 5 minutes avant
    B: 15 minutes avant
    C: 30 minutes avant
    D: 1 heure avant
  answer: B
  explanation: La MPI recommande d'arriver 15 minutes avant l'heure prévue de votre
    examen de conduite pour permettre l'enregistrement et la vérification des documents.
- id: 35
  category: driver_testing
  question: Dans le cadre du programme de permis de conduire par étapes (GDL) du Manitoba,
    quelle est la restriction concernant les drogues (comme le THC) pour les conducteurs
    aux étapes d'apprentissage ou intermédiaire ?
  choices:
    A: Ils doivent être en dessous de la limite légale de facultés affaiblies.
    B: Ils doivent avoir une présence nulle de drogue dans leur organisme.
    C: Ils ne peuvent consommer des drogues que s'ils ont une prescription médicale.
    D: Il n'y a pas de restrictions spécifiques pour les drogues, seulement pour l'alcool.
  answer: B
  explanation: Le Manitoba applique une politique de tolérance zéro en matière de
    drogues pour tous les conducteurs du programme GDL. Il doit y avoir une présence
    nulle de toute drogue dans leur organisme lors de la conduite d'un véhicule.
- id: 36
  category: driver_testing
  question: Un permis de classe 5 standard du Manitoba vous permet de conduire un
    véhicule ayant une capacité d'accueil maximale de combien de personnes (conducteur
    compris) ?
  choices:
    A: '5'
    B: '10'
    C: '15'
    D: '24'
  answer: B
  explanation: Un permis de classe 5 au Manitoba permet de conduire une voiture de
    tourisme ou un autobus dont la capacité d'accueil ne dépasse pas 10 personnes,
    conducteur compris.
- id: 37
  category: driver_testing
  question: Quel est le montant minimum de la couverture de responsabilité civile
    envers les tiers incluse dans l'assurance de base Autopac du Manitoba ?
  choices:
    A: 100 000 $
    B: 200 000 $
    C: 500 000 $
    D: 1 000 000 $
  answer: B
  explanation: L'assurance de base Autopac au Manitoba comprend un minimum de 200
    000 $ en couverture de responsabilité civile envers les tiers pour protéger le
    conducteur s'il est poursuivi pour des dommages matériels ou pour des blessures/décès
    survenant à l'extérieur du Manitoba.
- id: 38
  category: driver_testing
  question: Pour réussir l'examen de la vue pour un permis de classe 5 au Manitoba,
    votre champ de vision horizontal doit être d'au moins combien de degrés ?
  choices:
    A: 90 degrés
    B: 100 degrés
    C: 120 degrés
    D: 180 degrés
  answer: C
  explanation: Le Manitoba exige un champ de vision horizontal continu d'au moins
    120 degrés pour être admissible à un permis de conduire de classe 5.
- id: 39
  category: driver_testing
  question: Sur l'échelle de la Cote de sécurité du conducteur (CSC - DSR) du Manitoba,
    quel est le niveau de « base » pour un nouveau conducteur ou une personne ayant
    un dossier neutre ?
  choices:
    A: Niveau -5
    B: Niveau 0
    C: Niveau 5
    D: Niveau 10
  answer: B
  explanation: Le niveau 0 est le niveau de « base » sur l'échelle de la CSC. Les
    conducteurs montent dans l'échelle pour chaque année de conduite prudente et descendent
    en cas de condamnations ou d'accidents responsables.
- id: 40
  category: driver_testing
  question: Au Manitoba, si vous refusez de fournir un échantillon d'haleine ou de
    sang à un agent de la paix, quelle est la sanction administrative immédiate ?
  choices:
    A: Une suspension de 24 heures
    B: Une suspension de 7 jours
    C: Une suspension immédiate du permis de 3 mois (90 jours)
    D: Il n'y a pas de sanction immédiate avant de passer devant le tribunal
  answer: C
  explanation: Le refus de fournir un échantillon d'haleine ou de sang au Manitoba
    entraîne une suspension administrative immédiate du permis de conduire de 90 jours,
    ce qui est similaire à l'échec d'un test d'alcoolémie.
- id: 41
  category: driver_testing
  question: Lors de l'immatriculation au Manitoba d'un véhicule précédemment immatriculé
    dans une autre province, quel document est généralement requis pour prouver que
    le véhicule est sécuritaire ?
  choices:
    A: Un acte de vente uniquement
    B: Un certificat d'inspection (COI) valide
    C: Une carte d'immatriculation d'une autre province
    D: Une lettre de l'ancien propriétaire
  answer: B
  explanation: La plupart des véhicules immatriculés au Manitoba provenant d'une autre
    administration doivent réussir une inspection de sécurité et recevoir un certificat
    d'inspection (COI) valide du Manitoba.
- id: 42
  category: driver_testing
  question: Quelle est l'acuité visuelle minimale requise pour votre meilleur œil
    (avec ou sans lentilles correctrices) pour être admissible à un permis de conduire
    de classe 5 au Manitoba ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/60
  answer: C
  explanation: Au Manitoba, la norme de vision minimale pour un permis de classe 5
    est une acuité visuelle d'au moins 20/40 dans le meilleur œil.
- id: 43
  category: driver_testing
  question: Lequel des défauts de véhicule suivants entraînera l'annulation immédiate
    d'un examen pratique prévu au Manitoba ?
  choices:
    A: Un petit éclat dans le pare-brise du côté passager
    B: Un klaxon non fonctionnel
    C: Un bas niveau de liquide lave-glace
    D: Une boîte à gants vide
  answer: B
  explanation: Pour un examen pratique, le véhicule doit être en bon état de fonctionnement
    sécuritaire. Un klaxon qui ne fonctionne pas est un défaut de sécurité qui entraînera
    l'annulation de l'examen.
- id: 44
  category: driver_testing
  question: Selon le système de Cote de sécurité de l'automobiliste (CSA) du Manitoba,
    de combien de points descendez-vous dans l'échelle pour la plupart des infractions
    courantes, comme les excès de vitesse ou le fait de ne pas s'arrêter à un feu
    rouge ?
  choices:
    A: 1 point
    B: 2 points
    C: 5 points
    D: 10 points
  answer: B
  explanation: La plupart des condamnations pour infractions à la circulation entraînent
    une baisse de 2 points sur l'échelle de la Cote de sécurité de l'automobiliste
    au Manitoba.
- id: 45
  category: driver_testing
  question: Quelle est la note minimale requise pour réussir l'examen théorique de
    classe 5 du Manitoba ?
  choices:
    A: 70 % (21 sur 30)
    B: 75 % (23 sur 30)
    C: 80 % (24 sur 30)
    D: 90 % (27 sur 30)
  answer: C
  explanation: L'examen théorique du Manitoba se compose de 30 questions, et vous
    devez répondre correctement à au moins 24 d'entre elles (80 %) pour réussir.
- id: 46
  category: driver_testing
  question: Au Manitoba, quelle est la période de suspension immédiate du permis de
    conduire sur les lieux pour une première infraction liée à l'utilisation d'un
    appareil électronique portatif au volant ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: La loi du Manitoba impose une suspension immédiate du permis de conduire
    de 3 jours pour une première condamnation pour utilisation d'un appareil électronique
    portatif au volant.
- id: 47
  category: driver_testing
  question: Si vous êtes un nouveau résident du Manitoba et que vous détenez un permis
    de conduire valide d'une autre province, que devez-vous également fournir pour
    obtenir un permis du Manitoba ?
  choices:
    A: Une lettre de recommandation de votre assureur précédent
    B: Une preuve d'emploi à temps plein au Manitoba
    C: Une preuve d'identité, du droit de séjour au Canada et de résidence au Manitoba
    D: Une copie certifiée de votre certificat de naissance traduite en français
  answer: C
  explanation: Tous les demandeurs doivent fournir des documents prouvant leur identité
    légale, leur droit de séjour au Canada et le fait qu'ils résident actuellement
    au Manitoba.
- id: 48
  category: driver_testing
  question: 'Un permis de classe 5 au Manitoba vous permet de conduire un autobus
    uniquement s''il ne transporte pas de passagers et s''il a une capacité maximale
    de :'
  choices:
    A: 10 personnes
    B: 15 personnes
    C: 24 personnes
    D: 40 personnes
  answer: C
  explanation: Le titulaire d'un permis de classe 5 peut conduire un autobus ayant
    une capacité d'au plus 24 passagers (à condition de ne pas transporter de passagers).
- id: 49
  category: driver_testing
  question: Si votre permis de conduire a été suspendu pendant plus de deux ans, que
    devez-vous faire pour récupérer vos privilèges de conduite au Manitoba ?
  choices:
    A: Payer simplement des frais de rétablissement
    B: Attendre une année supplémentaire sans conduire
    C: Écrire une lettre d'appel au bureau des permis de conduire et d'immatriculation
      des véhicules
    D: Repasser les examens théorique, de vision et pratique
  answer: D
  explanation: Si un permis a été suspendu ou est invalide depuis plus de deux ans,
    la personne doit réussir à nouveau les examens théorique, de vision et pratique.
- id: 50
  category: driver_testing
  question: Au Manitoba, quel est le champ de vision minimal requis pour détenir un
    permis de classe 5 ?
  choices:
    A: 90 degrés
    B: 120 degrés
    C: 150 degrés
    D: 180 degrés
  answer: B
  explanation: Le Manitoba exige un champ de vision horizontal continu d'au moins
    120 degrés pour un permis de classe 5.
- id: 51
  category: driver_testing
  question: Lequel des éléments suivants constitue un échec automatique lors de l'examen
    de conduite du Manitoba ?
  choices:
    A: Oublier d'utiliser un clignotant une seule fois
    B: Ajuster ses rétroviseurs à l'arrêt
    C: Monter sur le trottoir en se garant
    D: Rouler à 5 km/h en dessous de la limite de vitesse
  answer: C
  explanation: Monter sur un trottoir ou le heurter est considéré comme un manque
    de contrôle et entraîne un échec automatique lors de l'examen de conduite.
- id: 52
  category: driver_testing
  question: Lors d'une demande de permis de conduire du Manitoba, si vous ne pouvez
    pas fournir de document d'identité principal, qui peut agir en tant que répondant
    pour vérifier votre identité ?
  choices:
    A: Toute personne de plus de 18 ans
    B: Un membre de la famille résidant à la même adresse
    C: Une personne figurant sur une liste de professionnels autorisés qui vous connaît
      depuis au moins deux ans
    D: Votre moniteur de conduite de l'école secondaire
  answer: C
  explanation: Un répondant doit être une personne figurant sur une liste de professionnels
    approuvée par la MPI (comme un médecin ou un avocat) qui connaît le demandeur
    depuis au moins deux ans.
- id: 53
  category: driver_testing
  question: Pour conduire un véhicule équipé de freins à air au Manitoba, un conducteur
    de classe 5 doit avoir quelle mention sur son permis ?
  choices:
    A: Mention A
    B: Mention I
    C: Mention S
    D: Mention X
  answer: A
  explanation: La mention « A » est requise pour tout conducteur utilisant un véhicule
    équipé de freins à air.
- id: 54
  category: driver_testing
  question: Selon le système de Cote de sécurité des conducteurs (CSC/DSR), combien
    d'années de conduite sans incident sont nécessaires pour monter d'un niveau sur
    l'échelle si vous êtes déjà dans la zone de mérite (positive) ?
  choices:
    A: 6 mois
    B: 1 an
    C: 2 ans
    D: 3 ans
  answer: B
  explanation: Pour chaque année de conduite prudente (aucun accident responsable
    ni condamnation), un conducteur monte d'un niveau sur l'échelle de la CSC (DSR).
- id: 55
  category: driver_testing
  question: Si vous êtes tenu de porter des lentilles correctrices pour conduire,
    qu'est-ce qui sera inscrit sur votre permis de conduire du Manitoba ?
  choices:
    A: Un symbole « X » rouge
    B: La lettre « C » dans la section « Restrictions »
    C: La lettre « W » dans la section « Mentions »
    D: Un autocollant « Vision requise »
  answer: B
  explanation: Au Manitoba, le code de restriction « C » sur un permis de conduire
    indique que le conducteur est tenu de porter des lentilles correctrices.
- id: 56
  category: driver_responsibility
  question: 'Si vous êtes impliqué dans un accident de la route au Manitoba, vous
    devez le signaler immédiatement à la police si :'
  choices:
    A: Les dommages matériels totaux semblent dépasser 1 000 $
    B: L'autre conducteur est poli et coopératif
    C: Il y a des blessés ou un décès
    D: Vous êtes à plus de 10 kilomètres de chez vous
  answer: C
  explanation: Selon le Guide de l'automobiliste du Manitoba, tout accident impliquant
    des blessures ou un décès doit être signalé immédiatement à la police.
- id: 57
  category: driver_responsibility
  question: Selon le système de Cote de sécurité des conducteurs (CSC/DSR) du Manitoba,
    de combien de points un conducteur monte-t-il sur l'échelle pour chaque année
    de conduite sans sinistre ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: A
  explanation: Pour chaque année où un conducteur n'a pas d'accident responsable ni
    de condamnation pour infraction au code de la route, il monte d'un niveau sur
    l'échelle de la CSC (DSR).
- id: 58
  category: driver_responsibility
  question: Lors de l'achat d'un véhicule à un particulier au Manitoba, quel document
    le vendeur doit-il fournir à l'acheteur pour permettre le transfert de propriété
    ?
  choices:
    A: Un accord verbal et les clés
    B: La partie Document de transfert de propriété (DTP/TOD) de l'immatriculation
      du véhicule
    C: Une note manuscrite sur une serviette en papier
    D: Le manuel d'origine du véhicule
  answer: B
  explanation: Le vendeur doit fournir le document de transfert de propriété (DTP/TOD),
    qui est la partie inférieure du certificat d'immatriculation du véhicule, dûment
    signé et daté.
- id: 59
  category: driver_responsibility
  question: Si vous déménagez au Manitoba en provenance d'une autre province, de combien
    de temps disposez-vous pour immatriculer votre véhicule auprès de la Société d'assurance
    publique du Manitoba (MPI) ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 6 mois
  answer: C
  explanation: Les nouveaux résidents du Manitoba ont jusqu'à 90 jours pour immatriculer
    leur véhicule provenant d'une autre province auprès de la MPI.
- id: 60
  category: driver_responsibility
  question: Quelle est la « fourchette d'avertissement » pour le taux d'alcoolémie
    (BAC) au Manitoba qui entraîne une suspension immédiate et graduelle du permis
    de conduire sur le bord de la route pour un premier contrevenant ?
  choices:
    A: 0,02 à 0,04
    B: 0,05 à 0,079
    C: 0,08 à 0,10
    D: 0,10 à 0,15
  answer: B
  explanation: Au Manitoba, un taux d'alcoolémie (BAC) compris entre 0,05 et 0,079
    est considéré comme la « fourchette d'avertissement » et entraîne une suspension
    immédiate et graduelle sur le bord de la route.
- id: 61
  category: driver_responsibility
  question: Si vous êtes pris à conduire alors que votre permis est suspendu au Manitoba,
    le véhicule que vous conduisez sera mis en fourrière pendant un minimum de combien
    de jours ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: Conduire pendant une suspension ou une interdiction entraîne une mise
    en fourrière obligatoire du véhicule de 30 jours, quel que soit le propriétaire
    du véhicule.
- id: 62
  category: driver_responsibility
  question: Quand un certificat d'inspection (COI) est-il requis pour un véhicule
    au Manitoba ?
  choices:
    A: Chaque année lors du renouvellement de l'immatriculation
    B: Uniquement lorsque le véhicule est impliqué dans un accident majeur
    C: Lors du transfert de propriété d'un véhicule d'occasion ou lorsqu'il est importé
      dans la province
    D: Uniquement si le véhicule a plus de 20 ans
  answer: C
  explanation: Un COI valide est requis pour immatriculer un véhicule nouvellement
    acquis (d'occasion) ou immatriculé au Manitoba pour la première fois en provenance
    d'une autre province ou d'un autre territoire.
- id: 63
  category: driver_responsibility
  question: 'Au Manitoba, si vous heurtez un véhicule sans surveillance et que vous
    ne trouvez pas le propriétaire, vous devez :'
  choices:
    A: Partir s'il n'y a pas de dommages visibles
    B: Laisser une note avec votre nom, votre adresse et votre numéro de plaque d'immatriculation
    C: Attendre au moins 4 heures que le propriétaire revienne
    D: Appeler une dépanneuse pour déplacer l'autre véhicule
  answer: B
  explanation: Si vous entrez en collision avec un véhicule sans surveillance, vous
    devez laisser un avis écrit avec votre nom, votre adresse et le numéro d'immatriculation
    de votre véhicule dans un endroit bien en vue sur le véhicule heurté.
- id: 64
  category: driver_responsibility
  question: Si vous vendez votre véhicule et en achetez un nouveau, de combien de
    jours disposez-vous pour transférer vos plaques d'immatriculation existantes sur
    le nouveau véhicule ?
  choices:
    A: 2 jours
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: La loi du Manitoba accorde un délai de grâce de 7 jours pour transférer
    les plaques d'un véhicule vendu à un véhicule nouvellement acquis, à condition
    que vous ayez sur vous les documents de transfert.
- id: 65
  category: driver_responsibility
  question: Lequel des éléments suivants n'est PAS couvert par le Régime de protection
    contre les préjudices personnels (PIPP) du Manitoba ?
  choices:
    A: Frais médicaux résultant d'un accident
    B: Remplacement du revenu pour perte de salaire
    C: Dommages à la peinture et à la carrosserie de votre véhicule
    D: Frais de réadaptation
  answer: C
  explanation: Le PIPP couvre les coûts liés aux blessures (médicaux, revenus, réadaptation)
    sans égard à la responsabilité. Les dommages au véhicule sont couverts par la
    section « Tous risques » d'Autopac, et non par le PIPP.
- id: 66
  category: driver_responsibility
  question: 'Un conducteur se trouvant dans la « zone d''avertissement » (0,05 à 0,079
    d''alcoolémie [BAC]) pour la première fois fera l''objet d''une suspension immédiate
    du permis de conduire sur la route de :'
  choices:
    A: 24 heures
    B: 48 heures
    C: 72 heures
    D: 7 jours
  answer: C
  explanation: Une première infraction dans la « zone d'avertissement » au Manitoba
    entraîne une suspension administrative immédiate du permis de 72 heures (3 jours).
- id: 67
  category: driver_responsibility
  question: 'Au Manitoba, si vous êtes impliqué dans un accident où les dommages matériels
    totaux dépassent 2 000 $ et que la police ne s''est pas rendue sur les lieux,
    vous devez :'
  choices:
    A: Signaler l'accident à la MPI dans les 24 heures
    B: Signaler l'accident à la police dans les 24 heures
    C: Ne le signaler que si vous souhaitez faire une réclamation d'assurance
    D: Signaler l'accident à la police dans les 7 jours
  answer: B
  explanation: Si les dommages matériels dépassent 2 000 $ et que la police n'était
    pas sur les lieux, vous devez signaler l'accident à la police dans les 24 heures.
- id: 68
  category: driver_responsibility
  question: Au Manitoba, dans laquelle des circonstances suivantes une collision DOIT-elle
    être signalée à la police ?
  choices:
    A: Chaque fois que les dommages matériels totaux dépassent 1 000 $
    B: Uniquement si un conducteur n'a pas de permis valide
    C: Si la collision implique un décès, des blessures graves ou un délit de fuite
    D: Uniquement si les véhicules ne sont pas en état de rouler
  answer: C
  explanation: Au Manitoba, vous devez signaler une collision à la police si elle
    implique un décès, une blessure nécessitant une hospitalisation, un délit de fuite,
    si un conducteur est soupçonné d'être sous l'influence de l'alcool ou de la drogue,
    ou si un véhicule doit être remorqué des lieux.
- id: 69
  category: driver_responsibility
  question: Lors de l'achat d'un véhicule d'occasion auprès d'un particulier au Manitoba,
    pendant combien de temps un certificat d'inspection (COI) est-il valide aux fins
    d'immatriculation à compter de sa date de délivrance ?
  choices:
    A: 30 jours
    B: 6 mois
    C: 1 an
    D: 2 ans
  answer: C
  explanation: Un certificat d'inspection (COI) est valide pendant un an à compter
    de la date de délivrance aux fins de transfert de propriété et d'immatriculation
    d'un véhicule au Manitoba.
- id: 70
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision qui ne nécessite pas l'intervention
    de la police, dans quel délai devez-vous déclarer le sinistre à la Société d'assurance
    publique du Manitoba (MPI) ?
  choices:
    A: Immédiatement ou dès que cela est raisonnablement possible
    B: Dans les 30 jours
    C: Uniquement lorsque vous êtes prêt à réparer le véhicule
    D: Dans les 48 heures seulement
  answer: A
  explanation: La MPI recommande de signaler toutes les demandes d'indemnisation pour
    collision dès que cela est raisonnablement possible afin de garantir une enquête
    et un traitement rapides de la demande.
- id: 71
  category: driver_responsibility
  question: Lorsque vous vendez votre véhicule au Manitoba, que devez-vous faire des
    plaques d'immatriculation ?
  choices:
    A: Les laisser sur le véhicule pour le nouveau propriétaire
    B: Les rendre à la police
    C: Les garder, car elles vous appartiennent et non au véhicule
    D: Les détruire immédiatement
  answer: C
  explanation: Au Manitoba, les plaques d'immatriculation appartiennent à l'individu
    et non au véhicule. Lorsque vous vendez un véhicule, vous devez retirer vos plaques.
    Vous pouvez ensuite les transférer sur un autre véhicule ou les retourner à un
    agent Autopac pour obtenir un remboursement.
- id: 72
  category: driver_responsibility
  question: Quelle est la franchise standard pour la plupart des véhicules de tourisme
    dans le cadre de la couverture obligatoire de base Autopac du Manitoba ?
  choices:
    A: 100 $
    B: 200 $
    C: 500 $
    D: 750 $
  answer: C
  explanation: La couverture obligatoire de base Autopac au Manitoba comporte une
    franchise standard de 500 $ pour la plupart des véhicules de tourisme, bien que
    les conducteurs puissent payer pour une couverture optionnelle afin de réduire
    ce montant.
- id: 73
  category: driver_responsibility
  question: Quel programme du Manitoba prévoit une indemnisation sans égard à la responsabilité
    pour les blessures résultant d'un accident d'automobile, peu importe qui était
    en tort ?
  choices:
    A: Le programme de cote de sécurité de l'automobiliste (DSR)
    B: Le Régime de protection contre les lésions corporelles (PIPP)
    C: La Loi sur la santé du Manitoba
    D: La Loi sur la sécurité des véhicules
  answer: B
  explanation: Le Régime de protection contre les lésions corporelles (PIPP) est le
    système d'assurance sans égard à la responsabilité du Manitoba qui couvre les
    frais médicaux, la réadaptation et la perte de revenus pour toute personne blessée
    dans une collision routière.
- id: 74
  category: driver_responsibility
  question: Si vous résidez au Manitoba et que vous achetez un véhicule dans une autre
    province, que devez-vous faire avant de pouvoir l'immatriculer au Manitoba ?
  choices:
    A: Rien, les inspections hors province sont toujours acceptées
    B: Payer immédiatement une taxe de 500 $ pour véhicule hors province
    C: Obtenir un certificat d'inspection (COI) du Manitoba valide
    D: Le conduire pendant 3 mois avec les anciennes plaques
  answer: C
  explanation: Les véhicules provenant d'autres provinces ou territoires doivent généralement
    passer une inspection de sécurité du Manitoba et recevoir un certificat d'inspection
    (COI) avant de pouvoir être immatriculés, avec certaines exceptions pour les véhicules
    plus récents en vertu d'accords interprovinciaux spécifiques.
- id: 75
  category: driver_responsibility
  question: Au Manitoba, quelle est la sanction pour la conduite d'un véhicule qui
    n'est pas actuellement immatriculé et assuré ?
  choices:
    A: Un avertissement verbal pour la première infraction
    B: Une amende et une mise en fourrière potentielle du véhicule
    C: Une peine de prison obligatoire d'un an
    D: Il n'y a aucune sanction si vous vous rendez chez un agent Autopac
  answer: B
  explanation: Conduire un véhicule non immatriculé ou non assuré au Manitoba est
    une infraction grave qui entraîne une amende importante et le véhicule peut être
    mis en fourrière.
- id: 76
  category: driver_responsibility
  question: Si vous entrez en collision avec un véhicule sans surveillance et que
    vous ne trouvez pas le propriétaire, quelle est votre responsabilité légale au
    Manitoba ?
  choices:
    A: Attendre sur les lieux pendant au moins 4 heures
    B: Laisser une note avec votre nom, votre adresse et votre numéro de plaque d'immatriculation
    C: Partir s'il n'y a pas de dommages visibles
    D: Appeler une dépanneuse pour l'autre véhicule
  answer: B
  explanation: Si vous heurtez un véhicule sans surveillance, vous devez laisser un
    avis écrit dans un endroit bien en vue sur le véhicule heurté, en indiquant votre
    nom, votre adresse et le numéro d'immatriculation de votre véhicule.
- id: 77
  category: driver_responsibility
  question: Qu'arrive-t-il à votre cote de sécurité de l'automobiliste (DSR) si vous
    êtes jugé responsable à 50 % ou plus d'une collision ?
  choices:
    A: Elle reste la même
    B: Elle baisse de 2 niveaux
    C: Elle baisse de 5 niveaux
    D: Elle baisse de 10 niveaux
  answer: C
  explanation: Au Manitoba, le fait d'être reconnu responsable à 50 % ou plus d'une
    collision entraîne une baisse de 5 niveaux sur l'échelle de la cote de sécurité
    de l'automobiliste (DSR).
- id: 78
  category: driver_responsibility
  question: Lequel des éléments suivants n'est PAS couvert par la couverture obligatoire
    de base « Tous risques » d'Autopac au Manitoba ?
  choices:
    A: Le vandalisme
    B: Le vol du véhicule
    C: Les dommages par collision
    D: Le vol d'objets personnels (comme un ordinateur portable) à l'intérieur du
      véhicule
  answer: D
  explanation: La couverture de base Autopac couvre le véhicule lui-même (collision,
    capotage et risques courants comme le vol ou le vandalisme de la voiture). Elle
    ne couvre pas les effets personnels laissés à l'intérieur du véhicule ; ceux-ci
    sont généralement couverts par une assurance habitation ou locataire.
- id: 79
  category: driver_responsibility
  question: Pour être admissible au programme de pneus d'hiver de la Société d'assurance
    publique du Manitoba (financement à faible intérêt), quelle est l'exigence principale
    ?
  choices:
    A: Vous devez avoir un niveau de DSR de +15
    B: Le véhicule doit être immatriculé au Manitoba à votre nom
    C: Vous devez être étudiant
    D: Vous devez avoir eu au moins un accident dans la neige
  answer: B
  explanation: Pour participer au financement du programme de pneus d'hiver de la
    MPI, vous devez être un particulier (et non une entreprise) possédant un véhicule
    immatriculé à votre nom au Manitoba et être en règle avec la MPI.
- id: 80
  category: safe_driving_rules
  question: Au Manitoba, quelle est la limite de vitesse par défaut dans une zone
    urbaine (au sein d'une ville ou d'un village), sauf indication contraire ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 30 km/h
  answer: B
  explanation: Selon le Guide de l'automobiliste du Manitoba, la limite de vitesse
    standard dans toute ville, municipalité ou village est de 50 km/h, à moins que
    des panneaux n'indiquent le contraire.
- id: 81
  category: safe_driving_rules
  question: Lorsque vous stationnez votre véhicule près d'une borne d'incendie au
    Manitoba, quelle est la distance minimale que vous devez respecter ?
  choices:
    A: 1 mètre
    B: 2 mètres
    C: 3 mètres
    D: 5 mètres
  answer: C
  explanation: La loi du Manitoba interdit de stationner à moins de 3 mètres d'une
    borne d'incendie.
- id: 82
  category: safe_driving_rules
  question: Au Manitoba, lorsque vous approchez d'une zone de travaux où des travailleurs
    sont présents, qu'advient-il des amendes pour excès de vitesse ?
  choices:
    A: Les amendes sont triplées
    B: Les amendes sont doublées
    C: Les amendes sont augmentées de 100 $
    D: Les amendes restent les mêmes mais les points d'inaptitude augmentent
  answer: B
  explanation: En vertu du Code de la route du Manitoba, les amendes pour excès de
    vitesse sont doublées lorsque des travailleurs sont présents dans une zone de
    travaux.
- id: 83
  category: safe_driving_rules
  question: 'Lorsque vous approchez d''un véhicule d''urgence arrêté avec ses gyrophares
    allumés sur une route où la limite de vitesse est de 80 km/h ou plus, vous devez
    ralentir à :'
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: C
  explanation: La loi du Manitoba « Ralentissez, tassez-vous » exige que les conducteurs
    ralentissent à 60 km/h sur les routes où la limite est de 80 km/h ou plus lorsqu'ils
    dépassent des véhicules d'urgence.
- id: 84
  category: safe_driving_rules
  question: Au Manitoba, il est interdit de stationner à moins de combien de mètres
    d'un panneau d'arrêt ou d'un signal de contrôle de la circulation ?
  choices:
    A: 3 mètres
    B: 6 mètres
    C: 9 mètres
    D: 12 mètres
  answer: C
  explanation: Le Guide de l'automobiliste du Manitoba stipule que vous ne devez pas
    vous stationner à moins de 9 mètres d'un panneau d'arrêt ou d'un signal de contrôle
    de la circulation situé sur le côté d'une chaussée.
- id: 85
  category: safe_driving_rules
  question: Lorsque vous suivez un autobus scolaire dont les feux rouges clignotent
    et dont le bras d'arrêt est déployé, à quelle distance derrière devez-vous arrêter
    votre véhicule ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Les conducteurs doivent s'arrêter à au moins 5 mètres d'un autobus
    scolaire lorsque ses feux rouges clignotent et que le bras d'arrêt est sorti,
    sauf s'ils se trouvent de l'autre côté d'une route à chaussées séparées.
- id: 86
  category: safe_driving_rules
  question: Sous quelle condition spécifique un virage à gauche au feu rouge est-il
    autorisé au Manitoba ?
  choices:
    A: Jamais autorisé
    B: D'une rue à double sens vers une rue à sens unique
    C: D'une rue à sens unique vers une autre rue à sens unique
    D: Chaque fois qu'il n'y a pas de circulation en sens inverse
  answer: C
  explanation: Au Manitoba, vous pouvez tourner à gauche au feu rouge uniquement si
    vous passez d'une rue à sens unique à une autre rue à sens unique, après avoir
    marqué un arrêt complet et cédé le passage à la circulation et aux piétons.
- id: 87
  category: safe_driving_rules
  question: Quelle est la distance de suivi recommandée derrière un autre véhicule
    dans des conditions de conduite idéales au Manitoba ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 4 secondes
    D: 6 secondes
  answer: B
  explanation: La Société d'assurance publique du Manitoba recommande une distance
    de suivi minimale d'au moins 2 secondes derrière le véhicule qui vous précède
    dans des conditions idéales.
- id: 88
  category: safe_driving_rules
  question: Lorsque vous conduisez la nuit, vous devez passer des feux de route aux
    feux de croisement lorsque vous vous trouvez à moins de combien de mètres d'un
    véhicule venant en sens inverse ?
  choices:
    A: 150 mètres
    B: 300 mètres
    C: 450 mètres
    D: 600 mètres
  answer: C
  explanation: Au Manitoba, vous devez passer aux feux de croisement lorsqu'un véhicule
    venant en sens inverse se trouve à moins de 450 mètres.
- id: 89
  category: safe_driving_rules
  question: Au Manitoba, le demi-tour (virage en U) est interdit dans lequel des endroits
    suivants ?
  choices:
    A: Sur une courbe ou près du sommet d'une colline où vous ne pouvez pas être vu
      à 150 mètres
    B: À toute intersection munie d'un feu de circulation
    C: Sur toute rue dont la limite de vitesse est supérieure à 50 km/h
    D: Uniquement là où un panneau « Demi-tour interdit » est installé
  answer: A
  explanation: Les demi-tours sont illégaux dans les courbes ou sur les collines où
    la visibilité est inférieure à 150 mètres dans l'une ou l'autre direction.
- id: 90
  category: safe_driving_rules
  question: Lorsque deux véhicules atteignent une intersection non contrôlée à peu
    près en même temps, qui a la priorité ?
  choices:
    A: Le véhicule à gauche
    B: Le véhicule à droite
    C: Le véhicule roulant à une vitesse plus élevée
    D: Le véhicule sur la route la plus large
  answer: B
  explanation: À une intersection non contrôlée (sans panneaux ni signaux), vous devez
    céder le passage au véhicule à votre droite.
- id: 91
  category: safe_driving_rules
  question: Quelle est la limite de vitesse par défaut sur une route rurale au Manitoba,
    sauf indication contraire ?
  choices:
    A: 80 km/h
    B: 90 km/h
    C: 100 km/h
    D: 110 km/h
  answer: B
  explanation: La limite de vitesse standard pour les routes rurales au Manitoba est
    de 90 km/h, à moins que des panneaux n'indiquent une limite différente.
- id: 92
  category: safe_driving_rules
  question: Lorsque vous stationnez un véhicule en montée avec une bordure de trottoir,
    comment vos roues avant doivent-elles être positionnées ?
  choices:
    A: Parallèles à la bordure
    B: Tournées vers la bordure
    C: Tournées à l'opposé de la bordure
    D: Cela n'a pas d'importance tant que le frein de stationnement est serré
  answer: C
  explanation: Lors d'un stationnement en montée avec une bordure, tournez les roues
    à l'opposé de la bordure (vers la gauche) de sorte que si le véhicule recule,
    l'arrière du pneu avant vienne s'appuyer contre la bordure.
- id: 93
  category: safe_driving_rules
  question: Au Manitoba, à quelle distance minimale (en mètres) de l'entrée d'une
    caserne de pompiers est-il interdit de se stationner ?
  choices:
    A: 3 mètres
    B: 6 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Selon le Guide de l'automobiliste du Manitoba, vous ne devez pas vous
    stationner à moins de 6 mètres de l'entrée d'une caserne de pompiers.
- id: 94
  category: safe_driving_rules
  question: Lorsque vous dépassez un cycliste au Manitoba, quelle est la distance
    minimale que vous devez maintenir entre votre véhicule et le cycliste ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 2 mètres
    D: 3 mètres
  answer: B
  explanation: Le guide du Manitoba conseille de laisser au moins 1 mètre d'espace
    entre votre véhicule et un cycliste lors d'un dépassement.
- id: 95
  category: safe_driving_rules
  question: Sauf indication contraire, quelle est la limite de vitesse maximale dans
    les zones urbaines du Manitoba ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: Selon le Guide de l'automobiliste du Manitoba, la limite de vitesse
    standard dans toute ville, municipalité ou village est de 50 km/h, sauf indication
    contraire par des panneaux.
- id: 96
  category: safe_driving_rules
  question: Dans de nombreuses municipalités du Manitoba, y compris Winnipeg, quelle
    est la limite de vitesse dans une zone scolaire à vitesse réduite pendant les
    heures de restriction ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: À Winnipeg et dans de nombreuses autres municipalités du Manitoba,
    la limite de vitesse dans les zones scolaires à vitesse réduite est de 30 km/h
    lorsque la zone est active (généralement de septembre à juin, du lundi au vendredi).
- id: 97
  category: safe_driving_rules
  question: Au Manitoba, à quelle distance d'une borne d'incendie devez-vous vous
    stationner ?
  choices:
    A: 1 mètre
    B: 3 mètres
    C: 5 mètres
    D: 9 mètres
  answer: B
  explanation: Selon la loi du Manitoba, il est interdit de se stationner à moins
    de 3 mètres d'une borne d'incendie.
- id: 98
  category: safe_driving_rules
  question: Quelle est la distance minimale à laquelle vous devez vous stationner
    d'un panneau d'arrêt ou d'un signal de contrôle de la circulation ?
  choices:
    A: 3 mètres
    B: 6 mètres
    C: 9 mètres
    D: 15 mètres
  answer: C
  explanation: Au Manitoba, les conducteurs ne doivent pas se stationner à moins de
    9 mètres d'un panneau d'arrêt ou de tout signal de contrôle de la circulation
    situé sur le côté de la chaussée.
- id: 99
  category: safe_driving_rules
  question: Quelle est la sanction pour un excès de vitesse dans une zone de construction
    désignée lorsque des travailleurs sont présents au Manitoba ?
  choices:
    A: L'amende est la même que pour un excès de vitesse ordinaire.
    B: L'amende est doublée.
    C: Votre permis est suspendu immédiatement pour 30 jours.
    D: L'amende est triplée.
  answer: B
  explanation: Au Manitoba, les amendes pour excès de vitesse sont doublées dans les
    zones de construction lorsque des travailleurs sont présents, afin de protéger
    les équipes de voirie.
- id: 100
  category: safe_driving_rules
  question: Lorsque vous vous arrêtez à un passage à niveau, quelle est la distance
    minimale à laquelle vous devez vous arrêter du rail le plus proche ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Lorsqu'un train approche ou que les signaux clignotent, vous devez
    vous arrêter à au moins 5 mètres du rail le plus proche, mais pas à plus de 15
    mètres.
- id: 101
  category: safe_driving_rules
  question: 'Sur une autoroute à plusieurs voies, la voie de gauche doit être principalement
    utilisée pour :'
  choices:
    A: Conduire exactement à la limite de vitesse affichée.
    B: Dépasser d'autres véhicules ou tourner à gauche.
    C: Les véhicules lents.
    D: Le stationnement d'urgence uniquement.
  answer: B
  explanation: Le Guide de l'automobiliste du Manitoba stipule que les conducteurs
    doivent rester à droite et utiliser la voie de gauche pour dépasser ou lorsqu'ils
    se préparent à tourner à gauche.
- id: 102
  category: safe_driving_rules
  question: Si les clignotants de votre véhicule ne fonctionnent pas, quel est le
    signal manuel correct pour un virage à gauche ?
  choices:
    A: Le bras sorti et plié vers le haut.
    B: Le bras sorti et plié vers le bas.
    C: Le bras tendu horizontalement par la fenêtre.
    D: Agiter le bras dans un mouvement circulaire.
  answer: C
  explanation: Pour signaler un virage à gauche à l'aide de signaux manuels, vous
    devez tendre votre bras gauche horizontalement par la fenêtre.
- id: 103
  category: safe_driving_rules
  question: À une intersection non contrôlée (sans panneaux ni feux), qui a la priorité
    ?
  choices:
    A: Le véhicule à gauche.
    B: Le véhicule à droite.
    C: Le véhicule circulant à la vitesse la plus élevée.
    D: Le véhicule qui arrive en dernier.
  answer: B
  explanation: Au Manitoba, lorsque deux véhicules atteignent une intersection non
    contrôlée à peu près en même temps, le conducteur à gauche doit céder le passage
    au conducteur à droite.
- id: 104
  category: safe_driving_rules
  question: Lorsque vous suivez un autre véhicule la nuit, à quelle distance devez-vous
    passer des feux de route aux feux de croisement ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: La loi du Manitoba exige que vous passiez aux feux de croisement lorsque
    vous vous trouvez à moins de 60 mètres du véhicule que vous suivez.
- id: 105
  category: safe_driving_rules
  question: Au Manitoba, qui est légalement responsable de s'assurer qu'un passager
    de moins de 18 ans porte sa ceinture de sécurité ?
  choices:
    A: Le passager lui-même.
    B: Le conducteur du véhicule.
    C: Les parents du passager, même s'ils ne sont pas dans la voiture.
    D: Personne ; c'est un choix personnel.
  answer: B
  explanation: Le conducteur est responsable de s'assurer que tous les passagers de
    moins de 18 ans sont correctement attachés. Les passagers de 18 ans et plus sont
    responsables d'eux-mêmes.
- id: 106
  category: defensive_driving
  question: Lorsque vous conduisez en ville ou dans une agglomération, à quelle distance
    devant vous devez-vous balayer la route du regard pour identifier les dangers
    potentiels ?
  choices:
    A: 5 secondes
    B: 12 secondes
    C: 20 secondes
    D: 30 secondes
  answer: B
  explanation: Les directives de conduite préventive du Manitoba suggèrent de balayer
    du regard 12 secondes à l'avance dans les zones urbaines pour anticiper les changements
    de circulation et les dangers.
- id: 107
  category: defensive_driving
  question: Au Manitoba, à quelle distance devez-vous passer des feux de route aux
    feux de croisement lorsque vous croisez un véhicule venant en sens inverse la
    nuit ?
  choices:
    A: 150 mètres
    B: 300 mètres
    C: 450 mètres
    D: 600 mètres
  answer: C
  explanation: Le Code de la route du Manitoba exige que les conducteurs passent aux
    feux de croisement au moins 450 mètres avant de croiser un véhicule venant en
    sens inverse.
- id: 108
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une route mouillée,
    quelle est la bonne technique de conduite préventive à adopter ?
  choices:
    A: Freiner brusquement pour regagner de la traction
    B: Tourner le volant brusquement vers la droite
    C: Accélérer légèrement pour traverser l'eau
    D: Relâcher la pédale d'accélérateur et maintenir le volant droit
  answer: D
  explanation: Pour se rétablir d'un aquaplanage, vous devez lever le pied de l'accélérateur
    et maintenir la direction droite jusqu'à ce que les pneus reprennent contact avec
    la route. Ne freinez pas.
- id: 109
  category: defensive_driving
  question: Au Manitoba, pendant quelle période l'utilisation de pneus à crampons
    (pneus cloutés) est-elle autorisée sur les véhicules ?
  choices:
    A: Du 1er novembre au 31 mars
    B: Du 1er octobre au 30 avril
    C: Du 15 octobre au 15 avril
    D: Du 1er septembre au 31 mai
  answer: B
  explanation: La loi du Manitoba autorise l'utilisation de pneus à crampons du 1er
    octobre au 30 avril pour aider à la conduite dans les conditions hivernales.
- id: 110
  category: defensive_driving
  question: Lorsque vous conduisez sur une autoroute, à quelle distance devant vous
    devez-vous balayer la route du regard pour maintenir un « temps d'anticipation
    visuelle » sécuritaire ?
  choices:
    A: 12 secondes
    B: 15 secondes
    C: 20 à 25 secondes
    D: 40 secondes
  answer: C
  explanation: Sur les autoroutes, les vitesses plus élevées nécessitent un temps
    d'anticipation visuelle plus long, de 20 à 25 secondes, pour identifier les dangers
    lointains et y réagir.
- id: 111
  category: defensive_driving
  question: Au Manitoba, si vous êtes pris à utiliser un appareil électronique portatif
    en conduisant, de combien de points de démérite descendrez-vous sur l'échelle
    de la Cote de sécurité de l'automobiliste (CSA) ?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 10 points
  answer: C
  explanation: Une condamnation pour utilisation d'un appareil électronique portatif
    (conduite distraite) au Manitoba entraîne une baisse de 5 niveaux sur l'échelle
    de la CSA, une amende et une suspension de permis de 3 jours pour la première
    infraction.
- id: 112
  category: defensive_driving
  question: Si vous rencontrez un brouillard épais en conduisant, quels feux devriez-vous
    utiliser pour assurer une visibilité maximale ?
  choices:
    A: Feux de route
    B: Feux de croisement
    C: Feux de stationnement uniquement
    D: Feux de détresse uniquement
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard. Les
    feux de route se reflètent sur l'humidité du brouillard, créant un éblouissement
    et réduisant la visibilité.
- id: 113
  category: defensive_driving
  question: Comment devriez-vous effectuer un arrêt d'urgence si votre véhicule est
    équipé d'un système de freinage antiblocage (ABS) ?
  choices:
    A: Pomper les freins rapidement
    B: Appliquer une pression ferme et constante sans relâcher
    C: Appliquer le frein de stationnement lentement
    D: Passer au point mort et freiner légèrement
  answer: B
  explanation: Avec l'ABS, vous devez appliquer une pression ferme et continue sur
    la pédale de frein. Le système « pompera » automatiquement les freins pour éviter
    le blocage des roues.
- id: 114
  category: defensive_driving
  question: Quelle est la manière la plus sûre de vérifier vos angles morts avant
    de changer de voie ?
  choices:
    A: Vérifier votre rétroviseur intérieur
    B: Vérifier vos rétroviseurs extérieurs
    C: Tourner la tête pour regarder par-dessus votre épaule
    D: Se pencher vers l'avant pour changer l'angle des rétroviseurs
  answer: C
  explanation: Les rétroviseurs ne montrent pas tout. Une vérification par-dessus
    l'épaule est nécessaire pour voir les véhicules situés dans vos angles morts avant
    tout déplacement latéral.
- id: 115
  category: defensive_driving
  question: Pour maintenir une conscience situationnelle appropriée dans les zones
    urbaines, à quelle distance vers l'avant un conducteur doit-il balayer la route
    du regard ?
  choices:
    A: 5 à 8 secondes
    B: 12 secondes
    C: 20 à 25 secondes
    D: 30 secondes
  answer: B
  explanation: La SAPM (MPI) recommande de balayer du regard 12 secondes à l'avance
    en ville, ce qui correspond environ à un pâté de maisons, pour identifier tôt
    les dangers potentiels.
- id: 116
  category: defensive_driving
  question: Quelle est la méthode recommandée pour vérifier vos angles morts avant
    un changement de voie au Manitoba ?
  choices:
    A: Jeter un coup d'œil au rétroviseur intérieur uniquement
    B: Vérifier les deux rétroviseurs extérieurs et effectuer une vérification par-dessus
      l'épaule
    C: Se fier au système de surveillance des angles morts de votre véhicule
    D: Se pencher vers l'avant pour changer l'angle des rétroviseurs extérieurs
  answer: B
  explanation: Une vérification correcte des angles morts au Manitoba implique de
    vérifier les rétroviseurs et d'effectuer un coup d'œil rapide par-dessus l'épaule
    dans la direction où vous avez l'intention de vous déplacer.
- id: 117
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais au Manitoba, quels feux
    devriez-vous utiliser pour une visibilité maximale ?
  choices:
    A: Feux de route
    B: Feux de croisement
    C: Feux de stationnement uniquement
    D: Feux de détresse
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard car
    les feux de route se reflètent sur les gouttelettes d'humidité, créant un éblouissement
    et réduisant davantage la visibilité.
- id: 118
  category: defensive_driving
  question: Si vous êtes impliqué dans un dérapage sur une route glacée du Manitoba,
    dans quelle direction devez-vous diriger le volant ?
  choices:
    A: Dans la direction opposée au dérapage
    B: Dans la direction où vous voulez que l'avant du véhicule aille
    C: Toujours vers la droite, vers le fossé
    D: Garder les roues parfaitement droites et freiner fort
  answer: B
  explanation: Pour vous rétablir d'un dérapage, vous devez diriger le volant dans
    la direction où vous voulez que l'avant du véhicule aille. Si l'arrière glisse
    vers la droite, tournez vers la droite.
- id: 119
  category: defensive_driving
  question: Selon le système de Cote de sécurité de l'automobiliste (CSA), combien
    de points de démérite sont généralement appliqués pour une condamnation pour «
    Suivre de trop près » ?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Suivre de trop près est une infraction courante de conduite préventive
    qui entraîne une baisse de 2 points sur l'échelle de la CSA du Manitoba.
- id: 120
  category: defensive_driving
  question: Lorsque vous conduisez sur une route rurale du Manitoba au crépuscule,
    vous voyez un cerf près du bord de la route. Quelle est l'action préventive la
    plus sûre ?
  choices:
    A: Accélérer pour passer rapidement
    B: Klaxonner continuellement et maintenir sa vitesse
    C: Ralentir, faire des appels de phares et se préparer à freiner
    D: Faire une embardée dans la voie opposée pour lui donner de l'espace
  answer: C
  explanation: La SAPM (MPI) conseille aux conducteurs de ralentir et d'être prêts
    à s'arrêter lorsqu'ils voient des animaux sauvages. Faire une embardée est déconseillé
    car cela mène souvent à des tonneaux ou à des collisions frontales plus graves.
- id: 121
  category: alcohol_drugs_health
  question: Au Manitoba, quelle est la période de suspension immédiate du permis de
    conduire sur les lieux pour une première infraction dans la « zone d'avertissement
    » (taux d'alcoolémie [BAC] entre 0,05 et 0,079) ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 72 heures
    D: 7 jours
  answer: C
  explanation: Au Manitoba, un conducteur ayant un taux d'alcoolémie (BAC) dans la
    « zone d'avertissement » (0,05 à 0,079) s'expose à une suspension immédiate de
    son permis de conduire de 72 heures sur les lieux pour une première infraction.
- id: 122
  category: alcohol_drugs_health
  question: Si un conducteur est accusé d'avoir un taux d'alcoolémie (BAC) de 0,08
    ou plus, quelle est la durée minimale de la suspension administrative immédiate
    du permis ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 3 mois
    D: 1 an
  answer: C
  explanation: Les conducteurs qui présentent un taux d'alcoolémie (BAC) de 0,08 ou
    plus, ou qui refusent de se soumettre à une demande d'alcootest ou de prélèvement
    sanguin, reçoivent une suspension administrative immédiate de leur permis de trois
    mois.
- id: 123
  category: alcohol_drugs_health
  question: Au Manitoba, quels sont les frais administratifs obligatoires (surtaxe)
    qui doivent être payés pour rétablir un permis suspendu pour des infractions liées
    à l'alcool ou aux drogues ?
  choices:
    A: 50 $
    B: 150 $
    C: 300 $
    D: 500 $
  answer: C
  explanation: Les conducteurs dont le permis est suspendu pour des raisons liées
    à l'alcool ou aux drogues doivent payer une surtaxe administrative de 300 $ à
    la Société d'assurance publique du Manitoba.
- id: 124
  category: alcohol_drugs_health
  question: Selon la loi du Manitoba, où le cannabis doit-il être rangé dans un véhicule
    s'il n'est pas dans son emballage d'origine non ouvert ?
  choices:
    A: Dans la boîte à gants
    B: Dans la console centrale
    C: Dans le coffre ou un espace non accessible au conducteur ou aux passagers
    D: Sur le siège arrière dans un sac scellé
  answer: C
  explanation: Le cannabis doit être rangé dans le coffre, dans un compartiment extérieur
    ou dans un autre espace du véhicule conçu pour le transport de marchandises qui
    n'est pas facilement accessible aux personnes se trouvant dans le véhicule.
- id: 125
  category: alcohol_drugs_health
  question: Si un conducteur est reconnu coupable d'une première infraction de conduite
    avec facultés affaiblies en vertu du Code criminel, quelle est la période minimale
    obligatoire pendant laquelle il doit utiliser un antidémarreur avec éthylomètre
    ?
  choices:
    A: 6 mois
    B: 1 an
    C: 2 ans
    D: 3 ans
  answer: B
  explanation: Pour une première condamnation en vertu du Code criminel pour conduite
    avec facultés affaiblies, le contrevenant est généralement tenu de participer
    au programme d'antidémarreur avec éthylomètre pendant au moins un an.
- id: 126
  category: alcohol_drugs_health
  question: Quelle est la période de mise en fourrière du véhicule pour un conducteur
    pris avec un taux d'alcoolémie (BAC) de 0,08 ou plus pour une première infraction
    au Manitoba ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 30 jours
    D: 60 jours
  answer: B
  explanation: Une première infraction pour un taux d'alcoolémie (BAC) de 0,08 ou
    plus (ou le refus d'un test) entraîne une mise en fourrière obligatoire du véhicule
    de 3 jours. Les récidives dans un délai de 10 ans entraînent une mise en fourrière
    de 30 jours.
- id: 127
  category: alcohol_drugs_health
  question: Au Manitoba, qui est légalement tenu de signaler une personne au registraire
    des véhicules automobiles si elle souffre d'un problème de santé qui pourrait
    rendre sa conduite dangereuse ?
  choices:
    A: Uniquement le conducteur lui-même
    B: L'employeur du conducteur
    C: Les médecins et les optométristes
    D: Les agents de police uniquement
  answer: C
  explanation: En vertu du Code de la route, les médecins et les optométristes sont
    légalement tenus de signaler les patients qui souffrent d'un problème de santé
    susceptible d'affecter leur capacité à conduire un véhicule automobile en toute
    sécurité.
- id: 128
  category: alcohol_drugs_health
  question: Quelle est la conséquence pour un conducteur qui refuse de fournir un
    échantillon d'haleine, de sang ou de fluide oral à la suite d'une demande légale
    d'un agent de la paix ?
  choices:
    A: Une suspension de 24 heures et une amende de 100 $
    B: Les mêmes sanctions que pour un taux d'alcoolémie (BAC) supérieur à 0,08
    C: Un avertissement pour la première infraction
    D: Une mise en fourrière du véhicule de 48 heures uniquement
  answer: B
  explanation: Le refus de fournir un échantillon est une infraction au Code criminel
    et entraîne les mêmes sanctions administratives et pénales que la conduite avec
    un taux d'alcoolémie (BAC) supérieur à 0,08.
- id: 129
  category: alcohol_drugs_health
  question: De combien de niveaux un conducteur descendra-t-il sur l'échelle de la
    cote de sécurité de conduite (DSR) pour une condamnation au Code criminel liée
    à l'alcool ou aux drogues ?
  choices:
    A: 2 niveaux
    B: 5 niveaux
    C: 10 niveaux
    D: 15 niveaux
  answer: C
  explanation: Une condamnation pour une infraction liée à l'alcool ou aux drogues
    en vertu du Code criminel entraîne une baisse de 10 niveaux sur l'échelle de la
    cote de sécurité de conduite (DSR).
- id: 130
  category: alcohol_drugs_health
  question: Un conducteur est arrêté et un agent de la paix soupçonne qu'il est sous
    l'influence d'une drogue. Quel test sur les lieux l'agent peut-il légalement exiger
    ?
  choices:
    A: Un test polygraphique (détecteur de mensonges)
    B: Un échantillon de fluide oral (salive)
    C: Un test obligatoire des follicules pileux
    D: Un test de vision sur les lieux
  answer: B
  explanation: Les agents de la paix au Manitoba peuvent exiger un échantillon de
    fluide oral sur les lieux s'ils ont des motifs raisonnables de soupçonner qu'un
    conducteur a de la drogue dans son organisme.
- id: 131
  category: alcohol_drugs_health
  question: Si un conducteur reçoit une suspension administrative de permis par paliers
    pour alcool ou drogues, que doit-il accomplir avant de pouvoir récupérer ses privilèges
    de conduite ?
  choices:
    A: Un nouvel examen de conduite
    B: Un programme de 20 heures de travaux communautaires
    C: Une évaluation par la Fondation manitobaine de lutte contre les dépendances
      (AFM)
    D: Un examen écrit sur la signalisation routière
  answer: C
  explanation: Les conducteurs qui reçoivent une suspension administrative de permis
    par paliers sont tenus de subir une évaluation par la Fondation manitobaine de
    lutte contre les dépendances (AFM) et peuvent être tenus de suivre un programme
    d'éducation ou de traitement recommandé.
- id: 132
  category: alcohol_drugs_health
  question: Quelle est la durée de la suspension administrative de permis par paliers
    pour une troisième infraction dans la « zone d'avertissement » (taux d'alcoolémie
    de 0,05 à 0,079) sur une période de 10 ans ?
  choices:
    A: 72 heures
    B: 15 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: Au Manitoba, une troisième infraction dans la « zone d'avertissement
    » en 10 ans entraîne une suspension de permis de 30 jours.
- id: 133
  category: alcohol_drugs_health
  question: En ce qui concerne les médicaments sur ordonnance et en vente libre, quelle
    est la responsabilité du conducteur au Manitoba ?
  choices:
    A: Il peut conduire tant que le médicament a été prescrit par un médecin
    B: Il doit vérifier auprès d'un médecin ou d'un pharmacien les effets secondaires
      avant de conduire
    C: Il n'est responsable que si le médicament est un stupéfiant illégal
    D: Il doit attendre 24 heures après avoir pris tout médicament avant de conduire
  answer: B
  explanation: Les conducteurs sont responsables de connaître les effets de tout médicament
    qu'ils prennent. Ils doivent lire les étiquettes et consulter des professionnels
    de la santé pour s'assurer que le médicament n'altère pas leur capacité de conduire.
- id: 134
  category: alcohol_drugs_health
  question: Au Manitoba, quelle est la concentration maximale légale de drogue dans
    le sang (CDS) pour le THC (cannabis) pour éviter une infraction punissable par
    procédure sommaire ?
  choices:
    A: 1 nanogramme (ng) par ml de sang
    B: 2 nanogrammes (ng) par ml de sang
    C: 5 nanogrammes (ng) par ml de sang
    D: 10 nanogrammes (ng) par ml de sang
  answer: B
  explanation: En vertu de la loi fédérale applicable au Manitoba, le fait d'avoir
    entre 2 ng et 5 ng de THC par ml de sang constitue une infraction punissable par
    procédure sommaire. Avoir 5 ng ou plus est une infraction plus grave.
- id: 135
  category: alcohol_drugs_health
  question: Si vous vous sentez somnolent en conduisant lors d'un long voyage, quelle
    est la mesure la plus efficace à prendre ?
  choices:
    A: Augmenter le volume de la radio
    B: Ouvrir la fenêtre pour avoir de l'air frais
    C: Boire une boisson caféinée et continuer à conduire
    D: Se garer dans un endroit sûr et faire une sieste
  answer: D
  explanation: L'air frais, la musique forte et la caféine ne sont que des solutions
    temporaires à la fatigue. Le seul remède sûr et efficace contre la somnolence
    est le sommeil.
- id: 136
  category: alcohol_drugs_health
  question: Si un conducteur du Manitoba est pris dans la « zone d'avertissement »
    (taux d'alcoolémie de 0,05 à 0,08) pour la deuxième fois en 10 ans, quelle est
    la durée de la suspension du permis ?
  choices:
    A: 7 jours
    B: 15 jours
    C: 30 jours
    D: 90 jours
  answer: B
  explanation: Une deuxième infraction dans la « zone d'avertissement » sur une période
    de 10 ans au Manitoba entraîne une suspension immédiate du permis de conduire
    de 15 jours sur le bord de la route.
- id: 137
  category: alcohol_drugs_health
  question: Selon la loi du Manitoba, quelle est la période de mise en fourrière du
    véhicule pour une première infraction dans la « zone d'avertissement » (taux d'alcoolémie
    de 0,05 à 0,08) ?
  choices:
    A: Pas de mise en fourrière pour la première infraction
    B: 24 heures
    C: 3 jours
    D: 7 jours
  answer: C
  explanation: Pour une première infraction dans la « zone d'avertissement » au Manitoba,
    le véhicule fait l'objet d'une mise en fourrière obligatoire de 3 jours.
- id: 138
  category: alcohol_drugs_health
  question: Si vous êtes accusé d'une infraction au Code criminel pour avoir un taux
    d'alcoolémie supérieur à 0,08, quelle est la durée de la suspension administrative
    immédiate du permis ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 3 mois
    D: 1 an
  answer: C
  explanation: Les conducteurs dont le taux d'alcoolémie est supérieur à 0,08 ou qui
    refusent de se soumettre à un alcootest ou à un prélèvement sanguin reçoivent
    une suspension administrative immédiate de permis de 3 mois.
- id: 139
  category: alcohol_drugs_health
  question: Qui est légalement responsable de signaler à la Société d'assurance publique
    du Manitoba un problème de santé susceptible d'affecter sa capacité à conduire
    en toute sécurité ?
  choices:
    A: Uniquement le médecin du conducteur
    B: Le conducteur lui-même
    C: L'employeur du conducteur
    D: Uniquement la famille immédiate du conducteur
  answer: B
  explanation: En vertu de la Loi sur les conducteurs et les véhicules, les conducteurs
    doivent signaler à la SAPM toute maladie ou tout handicap susceptible d'entraver
    la conduite sécuritaire d'un véhicule.
- id: 140
  category: alcohol_drugs_health
  question: Quelle est la restriction liée aux drogues pour tous les conducteurs aux
    étapes d'apprentissage et intermédiaire du programme de permis de conduire par
    étapes (GDL) au Manitoba ?
  choices:
    A: Ils peuvent consommer une petite quantité de cannabis si c'est à des fins médicales
    B: Ils doivent avoir une présence nulle de toute drogue dans leur organisme pouvant
      être détectée par un appareil de dépistage de liquide buccal
    C: Ils ont seulement l'interdiction de consommer des drogues illégales
    D: Il n'y a pas de restrictions sur les drogues, seulement sur l'alcool
  answer: B
  explanation: Le Manitoba applique une politique de tolérance zéro pour les drogues
    pour tous les conducteurs du programme GDL ; ils ne doivent avoir aucune trace
    de drogue dans leur organisme en conduisant.
- id: 141
  category: alcohol_drugs_health
  question: Au Manitoba, laquelle des exigences suivantes est obligatoire pour les
    conducteurs condamnés pour une deuxième infraction ou une infraction subséquente
    de conduite avec facultés affaiblies au cours d'une période de 10 ans ?
  choices:
    A: Révocation permanente du permis
    B: Participation au programme d'antidémarrage avec éthylomètre (Ignition Interlock
      Program)
    C: Une peine de prison obligatoire de 5 ans
    D: Confiscation de leur véhicule au profit de la Couronne
  answer: B
  explanation: Le programme d'antidémarrage avec éthylomètre est obligatoire pour
    tous les conducteurs condamnés pour des infractions de conduite liées à l'alcool
    en vertu du Code criminel au Manitoba.
- id: 142
  category: alcohol_drugs_health
  question: Si un conducteur échoue pour la première fois à un test de dépistage salivaire
    pour les drogues, quelle est la durée de la suspension immédiate du permis de
    conduire sur la route ?
  choices:
    A: 24 heures
    B: 72 heures
    C: 24 heures et un examen de conduite obligatoire
    D: 3 mois
  answer: B
  explanation: Un premier échec à un test de dépistage salivaire (indiquant une facultés
    affaiblies par la drogue) entraîne une suspension immédiate du permis de conduire
    de 72 heures sur la route.
- id: 143
  category: alcohol_drugs_health
  question: Quels sont les frais administratifs standard requis pour rétablir un permis
    de conduire à la suite d'une suspension liée à l'alcool ou aux drogues au Manitoba
    ?
  choices:
    A: Aucun frais n'est requis
    B: Exactement 50 $
    C: Exactement 250 $
    D: Exactement 600 $
  answer: B
  explanation: Les conducteurs doivent payer des frais de rétablissement de permis
    de 50 $ à la suite de toute suspension administrative au Manitoba.
- id: 144
  category: alcohol_drugs_health
  question: Un conducteur peut-il être accusé de conduite avec facultés affaiblies
    s'il est sous l'influence d'un médicament légal sur ordonnance ?
  choices:
    A: Non, tant qu'il possède une ordonnance valide
    B: Non, les médicaments sur ordonnance ne sont pas considérés comme des substances
      intoxicantes
    C: Oui, si le médicament affecte sa capacité à conduire un véhicule en toute sécurité
    D: Oui, mais seulement s'il a également de l'alcool dans son système
  answer: C
  explanation: Il est illégal de conduire avec les facultés affaiblies par toute drogue
    ou médicament, y compris les médicaments légaux sur ordonnance ou en vente libre
    qui affectent votre capacité à conduire.
- id: 145
  category: alcohol_drugs_health
  question: 'Au Manitoba, un conducteur qui reçoit une troisième violation dans la
    « fourchette d''avertissement » (taux d''alcoolémie de 0,05 à 0,08) au cours d''une
    période de 10 ans s''expose à une suspension de permis de :'
  choices:
    A: 15 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Une troisième violation dans la « fourchette d'avertissement » au cours
    d'une période de 10 ans entraîne une suspension immédiate du permis de conduire
    de 30 jours sur la route.
- id: 146
  category: alcohol_drugs_health
  question: Quand un conducteur est-il tenu de subir une évaluation obligatoire des
    dépendances au Manitoba ?
  choices:
    A: Après sa toute première violation dans la « fourchette d'avertissement »
    B: S'il a deux suspensions progressives ou plus sur la route au cours d'une période
      de 10 ans
    C: Seulement s'il est impliqué dans un accident mortel
    D: Seulement s'il a moins de 18 ans
  answer: B
  explanation: Les conducteurs qui font l'objet de deux suspensions progressives ou
    plus sur la route au cours d'une période de 10 ans doivent se soumettre à une
    évaluation obligatoire des dépendances.
- id: 147
  category: alcohol_drugs_health
  question: 'Au Manitoba, si un conducteur est pris avec un taux d''alcoolémie (BAC)
    supérieur à 0,08 et qu''un passager de moins de 16 ans se trouve dans le véhicule,
    la période de mise en fourrière du véhicule est de :'
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 6 mois
  answer: B
  explanation: Si un conducteur est accusé d'avoir un taux d'alcoolémie supérieur
    à 0,08 ou de refus d'obtempérer alors qu'un passager de moins de 16 ans est présent,
    la période de mise en fourrière du véhicule est de 60 jours.
- id: 148
  category: penalties_and_points
  question: Selon le système de Cote de sécurité de l'automobiliste (CSA) du Manitoba,
    de combien de niveaux descendrez-vous sur l'échelle pour la plupart des condamnations
    d'infraction au code de la route ?
  choices:
    A: 1 niveau
    B: 2 niveaux
    C: 3 niveaux
    D: 5 niveaux
  answer: B
  explanation: Au Manitoba, la plupart des condamnations d'infraction au code de la
    route (comme les excès de vitesse ou le fait de ne pas s'arrêter à un feu rouge)
    entraînent une descente de 2 niveaux sur l'échelle de la Cote de sécurité de l'automobiliste
    (DSR).
- id: 149
  category: penalties_and_points
  question: De combien de niveaux montez-vous sur l'échelle de la Cote de sécurité
    de l'automobiliste (CSA) pour chaque année de conduite prudente (aucun accident
    responsable ni condamnation) ?
  choices:
    A: 1 niveau
    B: 2 niveaux
    C: 3 niveaux
    D: 5 niveaux
  answer: A
  explanation: Les conducteurs montent d'un niveau sur l'échelle de la CSA (DSR) pour
    chaque année de conduite prudente, sans accident responsable, condamnation d'infraction
    au code de la route ou suspension de permis.
- id: 150
  category: penalties_and_points
  question: Combien de points de démérite (niveaux de CSA en moins) sont attribués
    pour une condamnation pour utilisation d'un appareil de communication électronique
    portatif au volant au Manitoba ?
  choices:
    A: 2 niveaux
    B: 3 niveaux
    C: 5 niveaux
    D: 10 niveaux
  answer: C
  explanation: L'utilisation d'un appareil de communication électronique portatif
    au volant entraîne une descente de 5 niveaux sur l'échelle de la Cote de sécurité
    de l'automobiliste (DSR).
- id: 151
  category: penalties_and_points
  question: Si le taux d'alcoolémie (BAC) d'un conducteur se situe entre 0,05 et 0,079,
    quelle est la durée de la suspension administrative de permis par paliers immédiate
    pour une première infraction ?
  choices:
    A: 24 heures
    B: 72 heures
    C: 7 jours
    D: 15 jours
  answer: B
  explanation: Au Manitoba, une première suspension administrative de permis par paliers
    (pour un taux d'alcoolémie entre 0,05 et 0,079) est de 72 heures.
- id: 152
  category: penalties_and_points
  question: En vertu de la loi sur le corridor de sécurité (« Move Over ») du Manitoba,
    quelle est la vitesse maximale autorisée lors du dépassement d'un véhicule d'urgence
    arrêté avec ses feux clignotants sur une autoroute où la limite est de 80 km/h
    ou plus ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: C
  explanation: Lorsque la limite de vitesse est de 80 km/h ou plus, les conducteurs
    doivent ralentir à 60 km/h lorsqu'ils dépassent des véhicules d'urgence arrêtés
    avec des feux clignotants. Si la limite est inférieure à 80 km/h, ils doivent
    ralentir à 40 km/h.
- id: 153
  category: penalties_and_points
  question: Si vous êtes reconnu coupable de ne pas vous être arrêté pour un autobus
    scolaire dont les feux clignotent et dont le bras d'arrêt est déployé, de combien
    de niveaux descendrez-vous dans l'échelle de la CSA (DSR) ?
  choices:
    A: 2 niveaux
    B: 5 niveaux
    C: 10 niveaux
    D: 15 niveaux
  answer: A
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire entraîne une descente
    de 2 niveaux dans l'échelle de la Cote de sécurité de l'automobiliste (CSA/DSR),
    bien que l'amende soit nettement plus élevée que pour les infractions routières
    standard.
- id: 154
  category: penalties_and_points
  question: De combien de niveaux un conducteur descendra-t-il dans l'échelle de la
    CSA (DSR) pour une condamnation pour non-port de la ceinture de sécurité ?
  choices:
    A: 1 niveau
    B: 2 niveaux
    C: 3 niveaux
    D: 5 niveaux
  answer: B
  explanation: Une condamnation liée à la ceinture de sécurité au Manitoba entraîne
    une descente de 2 niveaux dans l'échelle de la Cote de sécurité de l'automobiliste
    (CSA/DSR).
- id: 155
  category: penalties_and_points
  question: Si un conducteur refuse de fournir un échantillon d'haleine ou de sang
    à un agent de police, de combien de niveaux descendra-t-il dans l'échelle de la
    CSA (DSR) ?
  choices:
    A: 5 niveaux
    B: 10 niveaux
    C: 15 niveaux
    D: 20 niveaux
  answer: B
  explanation: Le refus de fournir un échantillon d'haleine ou de sang est considéré
    comme une infraction grave et entraîne une descente de 10 niveaux dans l'échelle
    de la CSA (DSR).
- id: 156
  category: penalties_and_points
  question: Quelle est la période de suspension administrative immédiate du permis
    pour un conducteur qui enregistre un taux d'alcoolémie (BAC) supérieur à 0,08
    ou qui refuse un test d'alcootest ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 3 mois
    D: 1 an
  answer: C
  explanation: Les conducteurs ayant un taux d'alcoolémie supérieur à 0,08 ou ceux
    qui refusent un test d'alcootest reçoivent une suspension administrative immédiate
    de permis de 3 mois (90 jours).
- id: 157
  category: penalties_and_points
  question: Au Manitoba, les amendes pour excès de vitesse sont doublées lorsque l'infraction
    se produit dans laquelle des zones suivantes ?
  choices:
    A: Zones scolaires
    B: Zones résidentielles
    C: Zones de travaux actives
    D: Zones hospitalières
  answer: C
  explanation: Les amendes pour excès de vitesse sont doublées au Manitoba lorsque
    le conducteur est pris en flagrant délit d'excès de vitesse dans une zone de travaux
    active.
- id: 158
  category: penalties_and_points
  question: Laquelle des condamnations suivantes pour conduite en vertu du Code criminel
    entraîne une descente de 10 niveaux dans l'échelle de la CSA (DSR) ?
  choices:
    A: Conduite avec facultés affaiblies
    B: Conduite dangereuse d'un véhicule à moteur
    C: Omission de s'arrêter sur les lieux d'un accident (délit de fuite)
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: Toutes les condamnations pour conduite en vertu du Code criminel, y
    compris la conduite avec facultés affaiblies, la conduite dangereuse et le délit
    de fuite, entraînent une descente de 10 niveaux dans l'échelle de la CSA (DSR).
- id: 159
  category: penalties_and_points
  question: Si un conducteur débutant (GDL) est pris avec n'importe quelle quantité
    d'alcool dans le sang, il reçoit une suspension immédiate de 24 heures. De combien
    de niveaux descendra-t-il dans l'échelle de la CSA (DSR) ?
  choices:
    A: 2 niveaux
    B: 5 niveaux
    C: 10 niveaux
    D: Aucun niveau, seulement la suspension
  answer: A
  explanation: Une suspension immédiate de 24 heures pour violation de l'exigence
    de zéro alcool pour les conducteurs débutants (GDL) entraîne une descente de 2
    niveaux dans l'échelle de la CSA (DSR).
- id: 160
  category: penalties_and_points
  question: Au Manitoba, quelle est la période de suspension de permis immédiate au
    bord de la route pour une première condamnation pour conduite distraite ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: Les conducteurs surpris à utiliser un appareil électronique portatif
    en conduisant au Manitoba font face à une suspension immédiate de permis de 3
    jours pour une première infraction, laquelle passe à 7 jours pour les infractions
    subséquentes.
- id: 161
  category: penalties_and_points
  question: De combien de niveaux descendez-vous sur l'échelle de la cote de sécurité
    de l'automobiliste (DSR) pour une condamnation pour conduite distraite au Manitoba
    ?
  choices:
    A: 2 niveaux
    B: 3 niveaux
    C: 5 niveaux
    D: 10 niveaux
  answer: C
  explanation: Une condamnation pour conduite distraite (utilisation d'un appareil
    électronique portatif) entraîne une descente de 5 niveaux sur l'échelle de la
    cote de sécurité de l'automobiliste (DSR).
- id: 162
  category: penalties_and_points
  question: Un conducteur surpris en train de faire une course de rue au Manitoba
    s'expose à une suspension immédiate du permis de conduire sur le bord de la route
    de combien de jours ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: B
  explanation: Les conducteurs surpris en train de faire une course de rue s'exposent
    à une suspension immédiate du permis de conduire de 7 jours sur le bord de la
    route et à une mise en fourrière du véhicule de 30 jours.
- id: 163
  category: penalties_and_points
  question: Quelle est la période de suspension administrative du permis pour un conducteur
    qui fournit un échantillon d'haleine supérieur à 0,08 d'alcoolémie (BAC) ?
  choices:
    A: 24 heures
    B: 72 heures
    C: 3 mois
    D: 1 an
  answer: C
  explanation: Au Manitoba, si vous dépassez 0,08 ou si vous refusez un test, vous
    recevez une suspension administrative immédiate du permis de 3 mois (90 jours).
- id: 164
  category: penalties_and_points
  question: Si un conducteur est reconnu coupable d'une infraction de conduite en
    vertu du Code criminel (comme la conduite avec facultés affaiblies), de combien
    de niveaux descend-il sur l'échelle de la cote de sécurité de l'automobiliste
    (DSR) ?
  choices:
    A: 5 niveaux
    B: 10 niveaux
    C: 15 niveaux
    D: 20 niveaux
  answer: B
  explanation: Une condamnation en vertu du Code criminel pour des infractions liées
    à la conduite entraîne une baisse de 10 niveaux sur l'échelle de la cote de sécurité
    de l'automobiliste (DSR).
- id: 165
  category: penalties_and_points
  question: Si vous êtes impliqué dans un accident où les dommages matériels totaux
    s'élèvent à 2 000 $ ou plus et que vous ne le signalez pas à la police, que peut-il
    se passer ?
  choices:
    A: Rien, tant que vous en informez la MPI
    B: Vous pourriez faire face à une amende et à une suspension de permis
    C: Votre assurance sera gratuite pendant un an
    D: Seul l'autre conducteur est responsable du signalement
  answer: B
  explanation: Le fait de ne pas signaler à la police un accident devant être déclaré
    (blessure, décès ou dommages matériels supérieurs à 2 000 $) constitue une violation
    du Code de la route et peut entraîner des amendes et des sanctions relatives au
    permis.
- id: 166
  category: sharing_the_road
  question: Au Manitoba, lorsque vous approchez d'un autobus scolaire de n'importe
    quelle direction sur une route non divisée avec ses feux rouges clignotants et
    son bras d'arrêt déployé, à quelle distance de l'autobus devez-vous vous arrêter
    ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Selon le Guide de l'automobiliste du Manitoba, vous devez vous arrêter
    à au moins cinq mètres de l'avant ou de l'arrière d'un autobus scolaire lorsque
    ses feux rouges clignotent et que le bras d'arrêt est déployé, sauf sur une route
    divisée.
- id: 167
  category: sharing_the_road
  question: Au Manitoba, quel est le montant approximatif de l'amende pour avoir omis
    de s'arrêter pour un autobus scolaire dont les feux rouges clignotent et le bras
    d'arrêt est déployé ?
  choices:
    A: 200 $
    B: 450 $
    C: 673 $
    D: 1 200 $
  answer: C
  explanation: L'amende pour avoir dépassé un autobus scolaire dont les feux clignotent
    au Manitoba est importante, actuellement fixée à environ 673 $ pour décourager
    ce comportement dangereux.
- id: 168
  category: sharing_the_road
  question: Lorsque vous suivez une motocyclette, pourquoi devriez-vous maintenir
    une distance de suivi d'au moins quatre secondes ?
  choices:
    A: Les motocyclettes s'arrêtent beaucoup plus vite que les voitures
    B: Les motocyclettes sont légalement tenues d'avoir plus d'espace
    C: Pour éviter de projeter de la poussière au visage du conducteur
    D: Les motocyclistes utilisent souvent des signaux manuels
  answer: A
  explanation: Parce que les motocyclettes sont légères et possèdent des systèmes
    de freinage de haute performance, elles peuvent s'arrêter beaucoup plus rapidement
    que les voitures. Une distance de suivi de quatre secondes est recommandée au
    Manitoba.
- id: 169
  category: sharing_the_road
  question: Vous conduisez sur une route à plusieurs voies et voyez un véhicule d'urgence
    arrêté sur l'accotement droit avec ses feux clignotants. Que devez-vous faire
    selon la loi du Manitoba ?
  choices:
    A: S'arrêter immédiatement dans votre voie
    B: Accélérer pour dépasser le véhicule rapidement
    C: Ralentir à la vitesse requise et se déplacer dans la voie la plus éloignée
      du véhicule si cela peut être fait en toute sécurité
    D: Maintenir votre vitesse mais klaxonner pour alerter les secouristes
  answer: C
  explanation: La loi du Manitoba sur l'obligation de céder le passage (Move Over)
    exige que les conducteurs ralentissent et, s'il y a plusieurs voies, se déplacent
    vers la voie la plus éloignée du véhicule d'urgence si cela peut être fait en
    toute sécurité.
- id: 170
  category: sharing_the_road
  question: Lorsqu'un patrouilleur scolaire ou un brigadier brandit un panneau d'arrêt
    à un passage pour piétons, quelles sont vos obligations légales ?
  choices:
    A: Ralentir et avancer avec prudence
    B: S'arrêter et attendre que les enfants aient fini de traverser, puis continuer
    C: S'arrêter et rester à l'arrêt jusqu'à ce que le patrouilleur ait abaissé son
      panneau et ait quitté la chaussée
    D: Ne s'arrêter que s'il y a plus de trois enfants qui traversent
  answer: C
  explanation: Vous devez vous arrêter et rester à l'arrêt jusqu'à ce que le patrouilleur
    scolaire ou le brigadier ait abaissé son panneau et ait quitté la chaussée en
    toute sécurité.
- id: 171
  category: sharing_the_road
  question: Que signifie un panneau « D » ou un feu jaune clignotant sur un véhicule
    d'escorte au Manitoba ?
  choices:
    A: Le véhicule est un transporteur de courrier
    B: Le véhicule escorte un chargement hors normes
    C: Le véhicule est un tracteur agricole à marche lente
    D: Le véhicule est un chasse-neige
  answer: B
  explanation: Les véhicules pilotes munis de panneaux « D » ou de feux jaunes clignotants
    sont utilisés pour avertir les autres automobilistes qu'un chargement hors normes
    suit ou précède.
- id: 172
  category: sharing_the_road
  question: Les gros camions ont des angles morts importants où une voiture peut disparaître
    de la vue du conducteur. Où se trouve la plus grande « zone de danger » (No-Zone)
    pour un semi-remorque ?
  choices:
    A: Directement devant la cabine
    B: Le côté gauche de la cabine
    C: Directement derrière la remorque
    D: Le côté droit de la remorque
  answer: C
  explanation: Bien que les camions aient des angles morts de tous les côtés, la zone
    située directement derrière la remorque est une « zone de danger » majeure car
    le conducteur du camion n'a pas de rétroviseur intérieur pour la voir.
- id: 173
  category: sharing_the_road
  question: Au Manitoba, si vous voyez un piéton avec une canne blanche, qu'est-ce
    que cela indique ?
  choices:
    A: Le piéton est une personne âgée
    B: Le piéton est une personne ayant une déficience visuelle
    C: Le piéton est un arpenteur
    D: Le piéton a la priorité seulement la nuit
  answer: B
  explanation: Une canne blanche (souvent avec une extrémité rouge) indique que le
    piéton a une déficience visuelle. Les conducteurs doivent faire preuve d'une prudence
    accrue et lui céder le passage.
- id: 174
  category: sharing_the_road
  question: Lorsqu'un autobus de transport en commun dans une zone à grande vitesse
    (60 km/h ou plus) a actionné son clignotant et tente de réintégrer la circulation
    à partir d'une baie d'autobus, que devez-vous faire ?
  choices:
    A: Maintenir votre vitesse ; l'autobus doit vous céder le passage
    B: Accélérer pour dépasser l'autobus avant qu'il ne s'engage
    C: Céder le passage à l'autobus
    D: Klaxonner pour signaler votre présence au conducteur de l'autobus
  answer: C
  explanation: Au Manitoba, les conducteurs doivent céder le passage aux autobus de
    transport en commun qui signalent leur intention de réintégrer la circulation
    à partir d'un arrêt ou d'une baie d'autobus.
- id: 175
  category: sharing_the_road
  question: Pourquoi un motocycliste pourrait-il circuler dans la partie gauche de
    sa voie (l'empreinte de la roue gauche d'une voiture) ?
  choices:
    A: Pour être plus visible pour la circulation en sens inverse et les véhicules
      qu'il suit
    B: Parce qu'il s'agit d'une exigence légale pour les motos
    C: Pour se préparer à un virage à droite
    D: Pour éviter le vent venant du côté droit
  answer: A
  explanation: Les motocyclistes circulent souvent dans la partie gauche de la voie
    pour augmenter leur visibilité auprès des autres conducteurs et pour voir plus
    loin sur la route.
- id: 176
  category: sharing_the_road
  question: 'Lorsque vous tournez à droite, vous devez vérifier votre angle mort pour
    les cyclistes parce que :'
  choices:
    A: Les cyclistes sont tenus de circuler sur le trottoir
    B: Les cyclistes peuvent traverser l'intersection tout droit sur votre droite
    C: Les cyclistes ont toujours la priorité sur les voitures qui tournent
    D: Les cyclistes ne sont pas autorisés à utiliser des signaux manuels
  answer: B
  explanation: Les automobilistes doivent vérifier leur angle mort droit avant de
    tourner à droite pour s'assurer de ne pas couper le chemin à un cycliste qui continue
    tout droit.
- id: 177
  category: sharing_the_road
  question: Si vous suivez un gros camion et que vous ne voyez pas ses rétroviseurs
    extérieurs, qu'est-ce que cela signifie ?
  choices:
    A: Le conducteur du camion peut vous voir par sa lunette arrière
    B: Vous êtes dans l'angle mort du conducteur du camion et il ne peut pas vous
      voir
    C: Vous êtes à une distance de sécurité adéquate
    D: Le camion est sur le point d'effectuer un virage large
  answer: B
  explanation: 'Une bonne règle de base est la suivante : si vous ne voyez pas les
    rétroviseurs du conducteur du camion, celui-ci ne peut pas vous voir. Vous vous
    trouvez dans sa « zone de danger ».'
- id: 178
  category: sharing_the_road
  question: Selon la loi du Manitoba, quelle est la distance minimale qu'un conducteur
    doit maintenir lorsqu'il dépasse un cycliste sur une route où la limite de vitesse
    est de 60 km/h ou moins ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: B
  explanation: Le Code de la route du Manitoba exige que les conducteurs maintiennent
    une distance minimale de 1 mètre lorsqu'ils dépassent un cycliste sur les routes
    dont la limite de vitesse est de 60 km/h ou moins.
- id: 179
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire est arrêté sur une route à chaussées séparées
    avec ses feux rouges clignotants et son bras d'arrêt déployé, quels conducteurs
    sont tenus de s'arrêter ?
  choices:
    A: Tous les conducteurs dans les deux sens
    B: Seulement les conducteurs qui suivent l'autobus
    C: Seulement les conducteurs dans la voie immédiatement adjacente à l'autobus
    D: Seulement les conducteurs circulant dans la même direction que l'autobus
  answer: D
  explanation: Sur une route à chaussées séparées (où un terre-plein physique sépare
    la circulation), les conducteurs circulant dans la direction opposée à l'autobus
    scolaire ne sont pas tenus de s'arrêter, mais doivent circuler avec prudence.
- id: 180
  category: sharing_the_road
  question: Au Manitoba, si vous dépassez un cycliste sur une route où la limite de
    vitesse est supérieure à 60 km/h, quelle est la distance de dépassement minimale
    requise par la loi ?
  choices:
    A: 1 mètre
    B: 1,2 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: C
  explanation: Pour les routes dont la limite de vitesse dépasse 60 km/h, la loi du
    Manitoba exige que les conducteurs laissent au moins 1,5 mètre d'espace lorsqu'ils
    dépassent un cycliste.
- id: 181
  category: sharing_the_road
  question: 'Lorsqu''un véhicule d''urgence dont la sirène et les feux sont activés
    s''approche de vous par l''arrière sur une rue à deux sens, vous devez :'
  choices:
    A: S'arrêter immédiatement dans votre voie actuelle
    B: Accélérer pour libérer le passage
    C: Se ranger sur le bord droit de la route et s'arrêter
    D: Se ranger sur le bord gauche de la route et s'arrêter
  answer: C
  explanation: Lorsqu'un véhicule d'urgence s'approche, vous devez vous ranger le
    long de la bordure ou du bord droit de la route, à l'écart de toute intersection,
    et vous arrêter jusqu'à ce que le véhicule soit passé.
- id: 182
  category: sharing_the_road
  question: Dans la ville de Winnipeg et dans de nombreuses autres municipalités du
    Manitoba, quelle est la limite de vitesse standard dans une zone scolaire à vitesse
    réduite ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: La plupart des zones scolaires à vitesse réduite dans les municipalités
    du Manitoba, y compris Winnipeg, sont fixées à 30 km/h pendant les mois et les
    heures spécifiés.
- id: 183
  category: sharing_the_road
  question: Lesquels des véhicules suivants sont tenus de s'arrêter à tous les passages
    à niveau au Manitoba, même si les signaux ne clignotent pas ?
  choices:
    A: Tous les véhicules de tourisme
    B: Les motocyclettes
    C: Les autobus scolaires et les véhicules transportant certaines marchandises
      dangereuses
    D: Les camions de livraison
  answer: C
  explanation: En vertu du Code de la route (Highway Traffic Act), les autobus scolaires
    et les véhicules conçus pour transporter des substances inflammables ou explosives
    doivent s'arrêter à tous les passages à niveau.
- id: 184
  category: sharing_the_road
  question: Lorsque vous suivez un gros camion, pourquoi devriez-vous maintenir une
    distance de sécurité plus grande que pour une voiture de tourisme ?
  choices:
    A: Les camions peuvent accélérer plus vite que les voitures
    B: Pour permettre au conducteur du camion de vous voir dans ses rétroviseurs latéraux
    C: Les camions sont tenus de s'arrêter à toutes les intersections
    D: Pour empêcher le camion de reculer sur vous
  answer: B
  explanation: 'Les gros camions ont des angles morts importants (zones de danger).
    Si vous suivez de trop près, le conducteur ne peut pas vous voir dans ses rétroviseurs.
    Une bonne règle est la suivante : si vous ne voyez pas le visage du conducteur
    dans son rétroviseur latéral, il ne peut pas vous voir.'
- id: 185
  category: sharing_the_road
  question: 'Au Manitoba, un « véhicule d''escorte » (pilot vehicle) muni de feux
    jaunes clignotants et d''un panneau « D » ou « Long Load » indique :'
  choices:
    A: Qu'un chasse-neige se trouve devant
    B: Qu'un chargement surdimensionné est escorté
    C: Qu'un cortège funèbre est en cours
    D: Que des travaux routiers commencent
  answer: B
  explanation: Les véhicules d'escorte sont utilisés pour avertir les autres conducteurs
    qu'un chargement surdimensionné ou extra-long se trouve sur la route, ce qui peut
    nécessiter un espace supplémentaire ou des ajustements de voie.
- id: 186
  category: sharing_the_road
  question: 'Lorsqu''un cycliste utilise une « voie réservée » (Diamond Lane) au Manitoba,
    les automobilistes doivent :'
  choices:
    A: Conduire dans la voie pour forcer le cycliste à en sortir
    B: N'entrer dans la voie que pour effectuer un virage à droite dans le même pâté
      de maisons
    C: Klaxonner pour avertir le cycliste de se déplacer sur le trottoir
    D: Ne jamais entrer dans la voie pour quelque raison que ce soit
  answer: B
  explanation: Les voies réservées (Diamond lanes) sont réservées à des véhicules
    spécifiques (comme les autobus et les vélos). Les automobilistes ne peuvent y
    entrer que peu de temps avant d'effectuer un virage à droite, généralement dans
    le même pâté de maisons que le virage.
- id: 187
  category: sharing_the_road
  question: 'Lorsque vous dépassez une dépanneuse arrêtée dont les feux jaunes clignotent
    sur une route où la limite de vitesse est de 60 km/h, vous devez ralentir à :'
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: C
  explanation: La loi sur le corridor de sécurité (Move Over law) du Manitoba inclut
    les dépanneuses et les véhicules d'assistance routière. Si la limite de vitesse
    est inférieure à 80 km/h, vous devez ralentir à 40 km/h en les dépassant lorsqu'ils
    sont arrêtés avec leurs feux clignotants.
- id: 188
  category: sharing_the_road
  question: 'Si vous voyez un piéton avec une canne blanche à un passage pour piétons,
    cela indique qu''il est malvoyant. Vous devriez :'
  choices:
    A: Klaxonner pour lui faire savoir que vous êtes là
    B: Lui céder le passage et laisser un espace supplémentaire pour traverser
    C: Le contourner rapidement en conduisant
    D: Attendre qu'il vous regarde avant de continuer
  answer: B
  explanation: Les conducteurs doivent faire preuve d'une prudence accrue et céder
    le passage aux piétons munis d'une canne blanche ou d'un chien-guide, car ils
    sont malvoyants.
- id: 189
  category: sharing_the_road
  question: 'Lorsqu''un gros camion tourne à droite à une intersection, il peut avoir
    besoin de :'
  choices:
    A: Tourner depuis la voie de gauche
    B: Faire un large écart vers la gauche avant de tourner à droite
    C: S'arrêter et reculer pour effectuer le virage
    D: Accélérer pour dégager l'intersection
  answer: B
  explanation: Les véhicules de grande taille ont besoin de plus d'espace pour tourner.
    Ils font souvent un large écart vers la gauche pour éviter de heurter la bordure
    lors d'un virage à droite. N'essayez jamais de vous faufiler entre un camion qui
    tourne et la bordure du trottoir.
- id: 190
  category: sharing_the_road
  question: Au Manitoba, qui a la priorité à une intersection sans panneaux de signalisation
    ni feux (une intersection non contrôlée) ?
  choices:
    A: Le véhicule à gauche
    B: Le véhicule à droite
    C: Le véhicule circulant le plus vite
    D: Le véhicule sur la rue la plus passante
  answer: B
  explanation: À une intersection non contrôlée, vous devez céder le passage à tout
    véhicule s'approchant par votre droite. Cependant, vous devez toujours céder le
    passage aux piétons déjà engagés dans l'intersection.
- id: 191
  category: vehicle_information
  question: Au Manitoba, quand les phares de votre véhicule doivent-ils être allumés
    ?
  choices:
    A: Du coucher au lever du soleil.
    B: D'une heure après le coucher du soleil à une heure avant le lever du soleil.
    C: D'une demi-heure après le coucher du soleil à une demi-heure avant le lever
      du soleil.
    D: Uniquement lorsqu'il pleut ou qu'il neige.
  answer: C
  explanation: Selon le Guide de l'automobiliste du Manitoba, les phares doivent être
    utilisés d'une demi-heure après le coucher du soleil à une demi-heure avant le
    lever du soleil, et à tout moment lorsque la visibilité est réduite à moins de
    150 mètres.
- id: 192
  category: vehicle_information
  question: 'Au Manitoba, vous devez passer en feux de croisement lorsque vous suivez
    un autre véhicule à une distance de :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Lorsque vous suivez un autre véhicule, vous devez baisser vos feux
    de route (passer en feux de croisement) à moins de 60 mètres de ce véhicule.
- id: 193
  category: vehicle_information
  question: Quelle est la profondeur minimale légale de la bande de roulement des
    pneus pour un véhicule de tourisme au Manitoba ?
  choices:
    A: 1,0 millimètre
    B: 1,6 millimètre
    C: 2,5 millimètres
    D: 3,2 millimètres
  answer: B
  explanation: En vertu de la Loi sur le code de la route du Manitoba, les pneus sont
    considérés comme dangereux si la profondeur de la bande de roulement est inférieure
    à 1,6 millimètre (2/32 de pouce).
- id: 194
  category: vehicle_information
  question: Selon la réglementation du Manitoba, quel est le niveau maximal de teinte
    autorisé pour les vitres latérales avant (conducteur et passager avant) ?
  choices:
    A: Aucune teinte n'est autorisée.
    B: Les vitres doivent laisser passer au moins 35 % de la lumière.
    C: Les vitres doivent laisser passer au moins 50 % de la lumière.
    D: Les vitres doivent laisser passer au moins 70 % de la lumière.
  answer: C
  explanation: La loi du Manitoba exige que les vitres latérales avant laissent passer
    au moins 50 % de la lumière. Une teinte qui bloque plus de 50 % de la lumière
    sur ces vitres est illégale.
- id: 195
  category: vehicle_information
  question: 'Tout véhicule à moteur au Manitoba doit être équipé d''un klaxon pouvant
    être entendu d''une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 200 mètres
  answer: B
  explanation: La Loi sur le code de la route du Manitoba précise que le klaxon d'un
    véhicule doit être audible dans des conditions normales à une distance d'au moins
    60 mètres.
- id: 196
  category: vehicle_information
  question: Au Manitoba, lorsque vous remorquez une remorque qui bloque la vue du
    rétroviseur intérieur, quel équipement est requis ?
  choices:
    A: Un rétroviseur intérieur grand angle.
    B: Un système de caméra de recul.
    C: Des rétroviseurs extérieurs sur les côtés gauche et droit du véhicule.
    D: Un observateur sur le siège passager.
  answer: C
  explanation: Si la vue vers l'arrière est obstruée par une remorque ou un chargement,
    la loi du Manitoba exige que le véhicule soit équipé de rétroviseurs sur les côtés
    gauche et droit afin d'offrir une vue dégagée de la route vers l'arrière.
- id: 197
  category: vehicle_information
  question: Au Manitoba, la plaque d'immatriculation arrière d'un véhicule doit être
    éclairée par une lumière de quelle couleur ?
  choices:
    A: Rouge
    B: Jaune
    C: Blanche
    D: Bleue
  answer: C
  explanation: La Loi sur le code de la route exige que la plaque d'immatriculation
    arrière soit éclairée par une lumière blanche afin que la plaque soit clairement
    lisible à une distance de 15 mètres.
- id: 198
  category: vehicle_information
  question: Laquelle des affirmations suivantes est vraie concernant les exigences
    relatives au système de freinage des véhicules à moteur au Manitoba ?
  choices:
    A: Seul un frein au pied est requis.
    B: Un véhicule doit avoir deux moyens distincts d'appliquer les freins (frein
      de service et frein de stationnement).
    C: Le frein de stationnement n'est requis que pour les transmissions manuelles.
    D: Les freins antiblocage (ABS) sont obligatoires pour tous les véhicules, quel
      que soit leur âge.
  answer: B
  explanation: La loi du Manitoba exige que chaque véhicule à moteur soit équipé de
    deux systèmes de freinage distincts, généralement un frein au pied hydraulique
    (frein de service) et un frein de stationnement mécanique.
- id: 199
  category: vehicle_information
  question: En vertu de la loi du Manitoba, quelle est l'exigence relative au système
    d'échappement d'un véhicule ?
  choices:
    A: Il doit être assez bruyant pour avertir les piétons.
    B: Il doit être équipé d'un silencieux en bon état de fonctionnement pour éviter
      tout bruit excessif.
    C: Les dispositifs de dérivation ou d'échappement libre sont autorisés pour la
      conduite sur autoroute.
    D: Le tuyau d'échappement doit être dirigé vers le trottoir.
  answer: B
  explanation: Les véhicules doivent être munis d'un silencieux qui empêche tout bruit
    et toute fumée excessifs ou inhabituels. Les dispositifs de dérivation ou d'échappement
    libre sont illégaux au Manitoba.
- id: 200
  category: vehicle_information
  question: Au Manitoba, combien de phares sont requis à l'avant d'un véhicule à moteur
    (autre qu'une motocyclette) ?
  choices:
    A: Au moins un du côté du conducteur.
    B: Au moins deux, un de chaque côté.
    C: Quatre, incluant les phares antibrouillard.
    D: Les phares ne sont requis que pour la conduite de nuit.
  answer: B
  explanation: Tout véhicule à moteur autre qu'une motocyclette doit être équipé d'au
    moins deux phares, un de chaque côté à l'avant du véhicule.
- id: 201
  category: vehicle_information
  question: Si vous transportez une charge qui dépasse de plus de 1,0 mètre l'arrière
    de votre véhicule au Manitoba, que devez-vous faire pendant les heures de clarté
    ?
  choices:
    A: Garder vos feux de détresse allumés.
    B: Fixer un drapeau rouge (d'au moins 30 cm x 30 cm) à l'extrémité de la charge.
    C: Conduire uniquement dans la voie de droite.
    D: Aucun marquage spécial n'est requis pendant la journée.
  answer: B
  explanation: Lorsqu'une charge dépasse de plus de 1,0 mètre l'arrière du véhicule,
    un drapeau rouge doit être fixé à l'extrémité de la charge pendant la journée
    par mesure de sécurité.
- id: 202
  category: vehicle_information
  question: Au Manitoba, quelle est la distance de visibilité minimale requise pour
    les clignotants ?
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 60 mètres
    D: 100 mètres
  answer: B
  explanation: Les clignotants doivent être visibles à une distance d'au moins 30
    mètres sous la lumière normale du soleil.
- id: 203
  category: vehicle_information
  question: Lorsqu'une remorque est attelée à un véhicule au Manitoba, quel équipement
    de sécurité est obligatoire en plus de l'attelage ?
  choices:
    A: Une goupille de verrouillage secondaire uniquement.
    B: Des chaînes ou des câbles de sécurité.
    C: Une barre de répartition de poids.
    D: Un panneau « Wide Load » (charge large).
  answer: B
  explanation: En plus de l'accouplement principal (attelage), la loi du Manitoba
    exige que les remorques soient fixées avec des chaînes ou des câbles de sécurité
    capables de retenir la remorque en cas de défaillance de l'attelage principal.
- id: 204
  category: vehicle_information
  question: Pendant quelle période les pneus à clous sont-ils légalement autorisés
    sur les véhicules au Manitoba ?
  choices:
    A: Du 1er novembre au 31 mars
    B: Du 1er octobre au 30 avril
    C: Du 15 octobre au 15 avril
    D: Du 1er décembre au 1er mars
  answer: B
  explanation: Au Manitoba, les pneus à clous ne peuvent être utilisés qu'entre le
    1er octobre et le 30 avril afin d'éviter l'usure inutile de la route pendant les
    mois les plus chauds.
- id: 205
  category: vehicle_information
  question: Selon les règlements du Manitoba, quelle est la quantité minimale de lumière
    qui doit pouvoir passer à travers la teinte des vitres latérales avant ?
  choices:
    A: 35 %
    B: 50 %
    C: 70 %
    D: La teinte n'est pas autorisée sur les vitres latérales avant
  answer: B
  explanation: Le Code de la route du Manitoba précise que la teinte des vitres latérales
    avant (à gauche et à droite du conducteur) ajoutée après l'achat doit laisser
    passer au moins 50 % de la lumière.
- id: 206
  category: vehicle_information
  question: Si le rétroviseur intérieur de votre véhicule est obstrué par une charge
    ou une remorque, quel équipement est requis par la loi du Manitoba ?
  choices:
    A: Un rétroviseur intérieur grand angle
    B: Un passager pour regarder par la lunette arrière
    C: Des rétroviseurs extérieurs gauche et droit
    D: Uniquement un rétroviseur extérieur gauche
  answer: C
  explanation: Si la vue vers l'arrière est obstruée, la loi du Manitoba exige que
    le véhicule soit équipé de rétroviseurs sur les côtés gauche et droit afin d'offrir
    une vue dégagée de la route vers l'arrière.
- id: 207
  category: vehicle_information
  question: Le klaxon de votre véhicule doit être audible à une distance d'au moins
    combien de mètres ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 200 mètres
  answer: B
  explanation: Le Guide de l'automobiliste du Manitoba stipule que tout véhicule à
    moteur doit être équipé d'un klaxon pouvant être entendu à une distance d'au moins
    60 mètres.
- id: 208
  category: vehicle_information
  question: 'La plaque d''immatriculation arrière d''un véhicule au Manitoba doit
    être éclairée de manière à être clairement visible à une distance de :'
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 30 mètres
  answer: C
  explanation: La loi du Manitoba exige qu'une lumière blanche éclaire la plaque d'immatriculation
    arrière afin qu'elle soit lisible à une distance de 15 mètres.
- id: 209
  category: vehicle_information
  question: Laquelle des affirmations suivantes est vraie concernant l'utilisation
    d'un silencieux au Manitoba ?
  choices:
    A: Les dispositifs de dérivation ou de coupure du silencieux sont autorisés pour
      la conduite sur autoroute
    B: Un silencieux n'est requis que pour les véhicules fabriqués après 2000
    C: Tout véhicule à moteur doit être muni d'un silencieux en bon état de fonctionnement
      pour éviter les bruits et la fumée excessifs
    D: Les silencieux sont facultatifs si le véhicule réussit un test d'émissions
  answer: C
  explanation: Tout véhicule à moteur doit être équipé d'un silencieux en bon état
    de fonctionnement pour éviter les bruits excessifs ou inhabituels et la fumée
    gênante. Les dispositifs de dérivation ou de coupure sont interdits.
- id: 210
  category: vehicle_information
  question: Lors du remorquage d'une remorque au Manitoba, quelle est l'exigence concernant
    les chaînes de sécurité ?
  choices:
    A: Elles ne sont requises que pour les remorques de plus de 2 000 kg
    B: Elles doivent être connectées mais n'ont pas besoin d'être croisées
    C: Elles doivent être croisées sous le timon de la remorque
    D: Elles ne sont pas requises si on utilise un attelage à boule
  answer: C
  explanation: Les chaînes de sécurité doivent être utilisées en plus de l'attelage
    et doivent être croisées sous le timon de la remorque pour empêcher celui-ci de
    tomber au sol en cas de défaillance de l'attelage.
- id: 211
  category: vehicle_information
  question: Un chargement dépassant de plus de combien de mètres l'arrière d'un véhicule
    doit-il être signalé par un drapeau rouge (le jour) ou un feu rouge (la nuit)
    ?
  choices:
    A: 0,5 mètre
    B: 1,0 mètre
    C: 1,5 mètre
    D: 2,0 mètres
  answer: C
  explanation: Au Manitoba, si un chargement dépasse de 1,5 mètre ou plus l'arrière
    du véhicule, il doit être signalé par un drapeau rouge pendant la journée et par
    un feu rouge ou un réflecteur la nuit.
- id: 212
  category: vehicle_information
  question: Selon la loi du Manitoba, quelle est la largeur maximale autorisée pour
    un véhicule de tourisme standard, chargement compris ?
  choices:
    A: 2,0 mètres
    B: 2,6 mètres
    C: 3,0 mètres
    D: 3,5 mètres
  answer: B
  explanation: La largeur maximale pour la plupart des véhicules sur les routes du
    Manitoba est de 2,6 mètres. Tout ce qui est plus large nécessite généralement
    un permis spécial.
- id: 213
  category: vehicle_information
  question: Laquelle des conditions suivantes est requise pour le pare-brise d'un
    véhicule au Manitoba ?
  choices:
    A: Il doit être fait de verre de sécurité
    B: Il doit être exempt de givre et d'humidité
    C: Il ne doit présenter aucune fissure nuisant à la vue du conducteur
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: Les règlements du Manitoba exigent que les pare-brise soient en verre
    de sécurité, exempts d'obstructions ou de fissures qui nuisent à la vision, et
    équipés d'essuie-glaces et de dégivreurs en état de marche pour éliminer l'humidité
    ou le givre.
- id: 214
  category: vehicle_information
  question: 'Au Manitoba, des feux de gabarit (ambre à l''avant, rouge à l''arrière)
    sont requis sur tout véhicule dont la largeur totale est supérieure à :'
  choices:
    A: 1,85 mètre
    B: 2,05 mètres
    C: 2,25 mètres
    D: 2,50 mètres
  answer: B
  explanation: Les véhicules dont la largeur dépasse 2,05 mètres doivent être équipés
    de feux de gabarit pour indiquer la largeur extrême du véhicule aux autres conducteurs.
- id: 215
  category: signs_and_signals
  question: Au Manitoba, que devez-vous faire à l'approche d'un feu de circulation
    rouge clignotant ?
  choices:
    A: Ralentir et avancer avec prudence
    B: S'arrêter et attendre que le feu passe au vert
    C: S'arrêter, céder le passage à la circulation transversale et aux piétons, et
      avancer quand c'est sécuritaire
    D: Le traiter comme un panneau de céder le passage et ralentir à 20 km/h
  answer: C
  explanation: 'Selon le Guide de l''automobiliste du Manitoba, un feu rouge clignotant
    doit être traité de la même manière qu''un panneau d''arrêt : immobilisez complètement
    le véhicule, cédez le passage à la circulation et aux piétons, et ne repartez
    que lorsque c''est sécuritaire.'
- id: 216
  category: signs_and_signals
  question: Que signifie un feu ambre (jaune) clignotant à une intersection au Manitoba
    ?
  choices:
    A: S'arrêter et attendre que le feu change
    B: Accélérer pour dégager l'intersection rapidement
    C: Le feu est sur le point de passer au rouge
    D: Réduire la vitesse et avancer avec prudence
  answer: D
  explanation: Un feu ambre clignotant est un avertissement de réduire la vitesse,
    d'être vigilant et de traverser l'intersection avec prudence.
- id: 217
  category: signs_and_signals
  question: Au Manitoba, que signifie une ligne blanche continue peinte sur la chaussée
    entre les voies de circulation ?
  choices:
    A: Le changement de voie est interdit
    '0': Le changement de voie est déconseillé
    C: La circulation se fait dans des directions opposées
    D: Vous approchez d'une zone scolaire
  answer: B
  explanation: Au Manitoba, une ligne blanche continue entre les voies indique que
    le changement de voie est déconseillé. Bien qu'il ne soit pas strictement interdit
    comme une double ligne continue, cela signifie qu'il est plus sûr de rester dans
    sa voie.
- id: 218
  category: signs_and_signals
  question: 'Un symbole de losange peint sur une voie au Manitoba indique que la voie
    est :'
  choices:
    A: Réservée à des véhicules spécifiques comme les autobus, les vélos ou les véhicules
      multioccupants
    B: Une voie de dépassement à grande vitesse
    C: Une voie qui se termine bientôt
    D: Réservée uniquement aux véhicules d'urgence
  answer: A
  explanation: Le symbole du losange marque les « voies réservées ». Celles-ci sont
    réservées à l'usage de véhicules spécifiques tels que les autobus, les taxis ou
    les vélos, souvent à des heures précises de la journée, comme indiqué sur les
    panneaux à proximité.
- id: 219
  category: signs_and_signals
  question: À l'approche d'un passage à niveau muni d'un panneau d'arrêt au Manitoba,
    à quelle distance minimale du rail le plus proche devez-vous immobiliser votre
    véhicule ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: C
  explanation: La loi du Manitoba exige que les conducteurs s'arrêtent à au moins
    5 mètres du rail le plus proche à un passage à niveau, et à pas plus de 15 mètres.
- id: 220
  category: signs_and_signals
  question: Selon la loi du Manitoba, quand êtes-vous autorisé à effectuer un virage
    à gauche au feu rouge ?
  choices:
    A: Jamais
    B: Uniquement lors d'un virage d'une rue à sens unique vers une autre rue à sens
      unique
    C: Chaque fois qu'il n'y a pas de circulation en sens inverse
    D: Uniquement si une flèche verte est également allumée
  answer: B
  explanation: Au Manitoba, vous ne pouvez tourner à gauche au feu rouge que si vous
    passez d'une rue à sens unique à une autre rue à sens unique, après avoir marqué
    un arrêt complet et cédé le passage aux piétons et aux autres véhicules.
- id: 221
  category: signs_and_signals
  question: Que signifie un signal à barre blanche verticale (signal de priorité au
    transport en commun) au Manitoba ?
  choices:
    A: Tout le trafic doit s'arrêter
    B: Seuls les véhicules d'urgence peuvent circuler
    C: Seuls les autobus de transport en commun peuvent circuler
    D: Les piétons ont la priorité
  answer: C
  explanation: Une barre blanche verticale sur fond noir est un signal de priorité
    au transport en commun. Il permet aux autobus de transport en commun de traverser
    l'intersection alors que les autres véhicules font face à un feu rouge.
- id: 222
  category: signs_and_signals
  question: Lorsque vous voyez un panneau « Cédez le passage » en vous insérant dans
    la circulation, que vous oblige la loi du Manitoba à faire ?
  choices:
    A: S'arrêter complètement avant de continuer
    B: Ralentir et céder le passage à tout véhicule se trouvant dans l'intersection
      ou s'en approchant
    C: Accélérer pour s'insérer de manière fluide dans la circulation
    D: Maintenir votre vitesse car les autres conducteurs doivent vous laisser passer
  answer: B
  explanation: Un panneau de céder le passage signifie que vous devez ralentir et,
    si nécessaire, vous arrêter pour céder le passage aux véhicules et aux piétons.
    Vous ne pouvez continuer que lorsqu'il est sécuritaire de le faire sans gêner
    les autres usagers.
- id: 223
  category: signs_and_signals
  question: Que signifient les lignes jaunes discontinues (pointillées) sur la chaussée
    au Manitoba ?
  choices:
    A: Vous êtes sur une rue à sens unique
    B: Le dépassement est autorisé lorsque c'est sécuritaire
    C: Le dépassement est strictement interdit
    D: La voie est réservée uniquement aux virages
  answer: B
  explanation: Les lignes jaunes discontinues séparent les véhicules circulant dans
    des directions opposées et indiquent que le dépassement est autorisé si la voie
    est libre et que la manœuvre peut être effectuée en toute sécurité.
- id: 224
  category: signs_and_signals
  question: Selon le Code de la route du Manitoba, où les demi-tours sont-ils interdits
    ?
  choices:
    A: Uniquement dans les zones scolaires
    B: À toute intersection contrôlée par des feux de circulation
    C: Sur n'importe quelle route de gravier
    D: Uniquement dans les rues à sens unique
  answer: B
  explanation: Au Manitoba, les demi-tours sont interdits à toute intersection contrôlée
    par un signal de circulation (feux) à moins qu'un panneau ne permette spécifiquement
    le virage.
- id: 225
  category: signs_and_signals
  question: Quel est le signal manuel correct pour indiquer que vous vous arrêtez
    ou que vous ralentissez soudainement au Manitoba ?
  choices:
    A: Bras gauche tendu horizontalement
    B: Bras gauche sorti et plié vers le haut
    C: Bras gauche sorti et plié vers le bas
    D: Agiter la main par la fenêtre
  answer: C
  explanation: Le signal manuel pour s'arrêter ou ralentir consiste à sortir le bras
    gauche par la fenêtre, plié vers le bas au niveau du coude, la paume de la main
    tournée vers l'arrière.
- id: 226
  category: signs_and_signals
  question: Au Manitoba, à l'approche d'un passage pour piétons (indiqué par des feux
    aériens et des panneaux), il est interdit de dépasser un autre véhicule à moins
    de combien de mètres du passage ?
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 50 mètres
    D: 100 mètres
  answer: B
  explanation: Au Manitoba, il est illégal de dépasser un véhicule qui est arrêté
    ou qui ralentit à l'approche d'un passage pour piétons. Vous ne devez dépasser
    aucun véhicule à moins de 30 mètres d'un passage pour piétons.
- id: 227
  category: signs_and_signals
  question: Que signifie une ligne jaune continue de votre côté de la ligne médiane
    au Manitoba ?
  choices:
    A: Le dépassement est autorisé s'il est sécuritaire
    B: Le dépassement est interdit
    C: Vous êtes dans une zone à sens unique
    D: Vous devez tourner à gauche plus loin
  answer: B
  explanation: Une ligne jaune continue de votre côté de la ligne médiane signifie
    que le dépassement est interdit.
- id: 228
  category: signs_and_signals
  question: Lorsque le bras gauche d'un conducteur est sorti par la fenêtre et plié
    vers le haut au niveau du coude, quel signal est donné ?
  choices:
    A: Virage à gauche
    B: Ralentissement ou arrêt
    C: Virage à droite
    D: Danger devant
  answer: C
  explanation: Le signal manuel pour un virage à droite consiste à sortir le bras
    gauche et à le plier vers le haut au niveau du coude.
- id: 229
  category: signs_and_signals
  question: Au Manitoba, que signifie un signal de circulation affichant une barre
    verticale blanche sur fond noir ?
  choices:
    A: Seuls les véhicules d'urgence peuvent circuler
    B: Seuls les autobus de transport en commun peuvent circuler
    C: Tout le trafic doit s'arrêter
    D: Les piétons ont la priorité
  answer: B
  explanation: Une barre verticale blanche sur fond noir est un signal de transport
    en commun, indiquant que seuls les autobus de transport en commun sont autorisés
    à circuler.
- id: 230
  category: signs_and_signals
  question: Quelle est la signification d'un panneau en forme de pentagone (cinq côtés)
    au Manitoba ?
  choices:
    A: Il indique un passage à niveau
    B: Il indique une zone scolaire ou un passage pour écoliers
    C: C'est un panneau de céder le passage
    D: Il indique une zone de travaux
  answer: B
  explanation: Les panneaux en forme de pentagone sont utilisés spécifiquement pour
    avertir les conducteurs de la présence d'une zone scolaire ou d'un passage pour
    écoliers à venir.
- id: 231
  category: signs_and_signals
  question: Lorsque vous approchez d'un corridor pour piétons dont les feux clignotent,
    quelle est la responsabilité du conducteur ?
  choices:
    A: Ralentir à 20 km/h et continuer
    B: S'arrêter et attendre que tous les piétons aient complètement traversé la chaussée
    C: S'arrêter uniquement si le piéton se trouve dans votre voie
    D: Klaxonner pour avertir les piétons de votre présence
  answer: B
  explanation: Au Manitoba, vous devez vous arrêter et rester à l'arrêt à un corridor
    pour piétons jusqu'à ce que les piétons aient complètement dégagé la chaussée.
- id: 232
  category: signs_and_signals
  question: Si vous êtes à une intersection avec un feu rouge et une flèche verte
    pointant vers la gauche, qu'êtes-vous autorisé à faire ?
  choices:
    A: S'arrêter et attendre le feu vert complet
    B: Tourner à gauche ; vous bénéficiez d'un virage protégé
    C: Tourner à gauche seulement après avoir cédé le passage à la circulation venant
      en sens inverse
    D: Continuer tout droit à travers l'intersection
  answer: B
  explanation: Une flèche verte combinée à un feu rouge signifie que vous pouvez avancer
    dans la direction de la flèche (un virage protégé), en cédant le passage aux piétons
    dans le passage pour piétons.
- id: 233
  category: signs_and_signals
  question: Que signifie un marquage en forme de losange sur une voie spécifique de
    la route ?
  choices:
    A: La voie est réservée uniquement aux véhicules d'urgence
    B: La voie est réservée à des véhicules spécifiques comme les autobus ou les vélos
    C: La voie est réservée uniquement au dépassement
    D: La voie est fermée pour cause de travaux
  answer: B
  explanation: Un symbole de losange sur la chaussée indique une voie réservée à certains
    types de véhicules, tels que les autobus, les taxis ou les vélos.
- id: 234
  category: signs_and_signals
  question: Au Manitoba, de quelle couleur sont les panneaux utilisés pour fournir
    des informations sur les travaux de construction ou d'entretien ?
  choices:
    A: Jaune
    B: Vert
    C: Orange
    D: Bleu
  answer: C
  explanation: Les panneaux de couleur orange sont utilisés au Manitoba pour avertir
    les conducteurs des zones de construction ou d'entretien.
- id: 235
  category: signs_and_signals
  question: Que signifie un grand « X » peint sur la chaussée ?
  choices:
    A: Un passage pour piétons à venir
    B: Une zone d'interdiction de stationner
    C: Un passage à niveau à venir
    D: Une intersection où vous ne pouvez pas tourner
  answer: C
  explanation: Un grand « X » peint sur la chaussée est un avertissement indiquant
    que vous approchez d'un passage à niveau.
- id: 236
  category: signs_and_signals
  question: 'Au Manitoba, un feu vert clignotant à une intersection signifie généralement
    :'
  choices:
    A: Vous bénéficiez d'un virage à gauche protégé
    B: Le feu est sur le point de passer au jaune
    C: Il s'agit d'un signal actionné par les piétons ; avancez avec prudence
    D: L'intersection est fermée à la circulation transversale
  answer: C
  explanation: Au Manitoba, un feu vert clignotant indique généralement un signal
    actionné par les piétons. Les conducteurs peuvent avancer mais doivent être prêts
    à ce que le feu change si un piéton appuie sur le bouton.
- id: 237
  category: signs_and_signals
  question: Que signifient les doubles lignes jaunes continues au centre de la route
    ?
  choices:
    A: Le dépassement est autorisé des deux côtés
    B: Le dépassement est interdit dans les deux sens
    C: Le dépassement est autorisé uniquement pendant la journée
    D: Circulation à sens unique seulement
  answer: B
  explanation: Les doubles lignes jaunes continues signifient que le dépassement est
    strictement interdit pour la circulation dans les deux sens.
