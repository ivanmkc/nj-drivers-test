metadata:
  source: 2021 Class C Driver License Manual (dot.state.wy.us)
  total_questions: 281
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: safe_driving_rules
  question: According to the Wyoming driver's manual, safe driving involves obeying
    traffic rules, being courteous, driving defensively, and what else?
  choices:
    A: Driving under the speed limit at all times
    B: Making sure you and your passengers wear a seat belt
    C: Honking your horn at intersections
    D: Never driving at night
  answer: B
  explanation: The manual states that safe driving involves obeying traffic rules
    and regulations, being courteous on the road, driving defensively, and making
    sure that you and your passengers wear a seat belt.
- id: 2
  category: driver_responsibility
  question: Why can the Wyoming driver's manual NOT be used as an actual expression
    of the law?
  choices:
    A: It is updated too frequently.
    B: It does not use the exact language of the Wyoming Motor Vehicle Law.
    C: It is only intended for out-of-state drivers.
    D: It only applies to commercial drivers.
  answer: B
  explanation: According to the manual, the language of the Wyoming Motor Vehicle
    Law is not used in the manual, which therefore cannot be used as an actual expression
    of the law.
- id: 3
  category: driver_testing
  question: Because the driver's manual covers only the basic requirements, what does
    the manual urge people who are just learning to drive to do?
  choices:
    A: Take advantage of local driver education classes
    B: Drive only in empty parking lots
    C: Wait until age 18 to get a license
    D: Read the full Wyoming Motor Vehicle Law
  answer: A
  explanation: The manual urges persons who are just learning to drive to also take
    advantage of local driver education classes because the manual covers only the
    basic requirements.
- id: 4
  category: driver_testing
  question: Based on the manual's table of contents, which of the following is one
    of the required tests to get a license?
  choices:
    A: Hearing test
    B: Reflex test
    C: Vision screening
    D: Psychological evaluation
  answer: C
  explanation: The table of contents lists 'Vision screening', 'Written test', and
    'Skills test' under the Required Tests section.
- id: 5
  category: license_system
  question: According to the table of contents, at what age can a driver obtain full
    driving privileges?
  choices:
    A: '15'
    B: 15 and one half
    C: '16'
    D: 16 and one half
  answer: D
  explanation: The table of contents includes a section for obtaining full driving
    privileges 'At 16 and one half'.
- id: 6
  category: license_system
  question: In addition to age 16 and one half, at what other specific age does the
    manual list a section for obtaining full driving privileges?
  choices:
    A: '17'
    B: '18'
    C: '19'
    D: '21'
  answer: A
  explanation: The table of contents includes a section for obtaining full driving
    privileges 'At age 17'.
- id: 7
  category: license_system
  question: For what specific reason does the manual mention issuing an age-restricted
    license?
  choices:
    A: Academic excellence
    B: Extreme inconvenience
    C: Farm work only
    D: Emancipation
  answer: B
  explanation: The table of contents lists 'For extreme inconvenience' under the Age
    Restricted Licenses section.
- id: 8
  category: alcohol_drugs_health
  question: According to the safety laws and issues section, what is identified as
    the major cause of crashes?
  choices:
    A: Speeding
    B: Distracted driving
    C: Alcohol
    D: Bad weather
  answer: C
  explanation: The table of contents explicitly lists a section titled 'Alcohol the
    major cause of crashes'.
- id: 9
  category: driver_responsibility
  question: Where can the actual statutes relating to driver licensing and motor vehicles
    be found?
  choices:
    A: The Wyoming Driver License Manual
    B: Wyoming Laws and Related Statutes
    C: The Federal Motor Carrier Safety Regulations
    D: The Highway Patrol Handbook
  answer: B
  explanation: The manual states that statutes relating to driver licensing and motor
    vehicles are found in Wyoming Laws and Related Statutes.
- id: 10
  category: penalties_and_points
  question: Which of the following devices is listed in the manual under the section
    regarding losing the privilege to drive?
  choices:
    A: Radar detector
    B: Ignition interlock device
    C: GPS navigation system
    D: Electronic logging device
  answer: B
  explanation: The table of contents lists 'Ignition interlock devices' under the
    section for losing the privilege to drive.
- id: 11
  category: license_system
  question: Which registry is listed as an additional driver/motoring service in the
    Wyoming driver's manual?
  choices:
    A: Wyoming Organ and Tissue Donor Registry
    B: Wyoming Voter Registry
    C: Wyoming Firearms Registry
    D: Wyoming Vehicle Modification Registry
  answer: A
  explanation: The 'Wyoming Organ and Tissue Donor Registry' is listed in the table
    of contents under Additional driver/motoring services.
- id: 12
  category: safe_driving_rules
  question: Which alert system is specifically covered under the additional driver/motoring
    services section?
  choices:
    A: Silver Alert System
    B: AMBER Alert System
    C: Blue Alert System
    D: Weather Alert System
  answer: B
  explanation: The 'Wyoming AMBER Alert System' is listed in the table of contents
    under Additional driver/motoring services.
- id: 13
  category: license_system
  question: Which compact is discussed under the Safety laws/issues section of the
    manual?
  choices:
    A: The Interstate Highway Compact
    B: The Driver License Compact
    C: The Vehicle Registration Compact
    D: The Traffic Violation Compact
  answer: B
  explanation: The 'Driver License Compact' is listed in the table of contents under
    Safety laws/issues.
- id: 14
  category: penalties_and_points
  question: Which form or requirement is associated with license suspensions, cancellations,
    and revocations in the manual?
  choices:
    A: W-2
    B: '1099'
    C: SR-22
    D: I-9
  answer: C
  explanation: The table of contents lists 'SR-22' under the section regarding license
    suspensions, cancellations, and revocations.
- id: 15
  category: license_system
  question: If you have questions about your driver's license, which department should
    you contact according to the manual?
  choices:
    A: Wyoming Highway Patrol
    B: Wyoming Department of Transportation, Driver Services
    C: Wyoming Department of Revenue
    D: Wyoming Secretary of State
  answer: B
  explanation: The manual advises that if you have any questions, you should contact
    Driver Services at the Wyoming Department of Transportation.
- id: 16
  category: license_system
  question: Who is NOT required to obtain a Wyoming driver license to drive legally
    in the state?
  choices:
    A: A part-time student at a Wyoming community college
    B: A member of the Armed Forces stationed in Wyoming who has a valid license from
      their state of residence
    C: A new resident who has lived in Wyoming for two years
    D: Anyone over the age of 21
  answer: B
  explanation: Members of the Armed Forces stationed in Wyoming, and their dependents,
    who have a valid license issued by their state of residence do not need to obtain
    a Wyoming driver license.
- id: 17
  category: license_system
  question: If you are licensed by another Driver License Compact member state and
    move to Wyoming, how long do you have to surrender your out-of-state license?
  choices:
    A: Within 30 days of residency
    B: Within 6 months of residency
    C: Within 1 year of residency
    D: Within 2 years of residency
  answer: C
  explanation: Any person licensed by another state which is a Driver License Compact
    member must surrender their out-of-state license within one year of residency
    in Wyoming.
- id: 18
  category: license_system
  question: Which of the following individuals is eligible to obtain a Wyoming driver
    license?
  choices:
    A: A person who is 15 years old applying for full driving privileges
    B: A person whose driving privileges are suspended in another state
    C: A person who has been judged legally incompetent
    D: A 17-year-old who has passed all required examinations
  answer: D
  explanation: Persons under 16, those with suspended licenses, and those judged legally
    incompetent cannot get a license. An applicant must be at least 17 for full driving
    privileges.
- id: 19
  category: license_system
  question: What is the maximum Gross Vehicle Weight Rating (GVWR) of a single vehicle
    you can operate with a standard non-commercial Class C license?
  choices:
    A: Less than 10,000 pounds
    B: Less than 16,000 pounds
    C: Less than 26,001 pounds
    D: Less than 30,000 pounds
  answer: C
  explanation: The Class C license authorizes operation of a single vehicle or combination
    of vehicles, except motorcycles, with a GVWR less than 26,001 pounds.
- id: 20
  category: license_system
  question: Which license class is issued solely for the operation of motorcycles
    in Wyoming?
  choices:
    A: Class A
    B: Class C
    C: Class M
    D: Class R
  answer: C
  explanation: The class 'M' license is issued solely for the operation of motorcycles.
- id: 21
  category: license_system
  question: What does restriction code 'B' on a Wyoming driver license signify?
  choices:
    A: Automatic transmission required
    B: Corrective lenses required
    C: Daylight driving only
    D: Mechanical aid required
  answer: B
  explanation: According to the restriction codes in the manual, 'B' stands for Corrective
    lenses.
- id: 22
  category: license_system
  question: If a driver has restriction code 'G' on their license, what are they restricted
    to?
  choices:
    A: Driving only vehicles with automatic transmissions
    B: Driving only during daylight hours
    C: Intrastate driving only
    D: Driving without passengers
  answer: B
  explanation: According to the restriction codes, 'G' stands for Daylight driving
    only.
- id: 23
  category: license_system
  question: At what age can an applicant obtain an instruction permit in Wyoming?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '17'
  answer: B
  explanation: An instruction permit may be obtained at 15 years of age.
- id: 24
  category: license_system
  question: What is required for a 16-1/2 year old to obtain full driving privileges
    in Wyoming?
  choices:
    A: They must have held an instruction permit for one year.
    B: They must have completed an approved driver education course and held an intermediate
      license for six months.
    C: They must pass a vision screening and drive only during daylight hours.
    D: They cannot obtain full driving privileges until they turn 18.
  answer: B
  explanation: For full driving privileges, an applicant must be at least 17, or be
    16-1/2 and have completed an approved driver education course and held an intermediate
    license for six months.
- id: 25
  category: license_system
  question: First-time applicants for a driver license must provide acceptable legal
    identification. Which of the following is NOT listed as an acceptable primary
    document?
  choices:
    A: A state-certified birth certificate
    B: A valid U.S. passport
    C: Immigration documents
    D: A high school student ID card
  answer: D
  explanation: First-time applicants must provide a state-certified birth certificate,
    a valid U.S. passport, or immigration documents. A student ID is not listed as
    acceptable legal identification.
- id: 26
  category: driver_responsibility
  question: How many days do you have to notify the department in writing when you
    change your address?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: When licensees change their addresses, they must notify the department
    in writing within 10 days of the change.
- id: 27
  category: license_system
  question: How many acceptable documents must be provided as proof that you are a
    Wyoming resident?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Any two of the listed acceptable documents must be provided as proof
    that you are a Wyoming resident.
- id: 28
  category: license_system
  question: Which of the following is a requirement for the documents used to prove
    Wyoming residency?
  choices:
    A: They must show a P.O. Box address.
    B: They must show a residential address, not a P.O. Box.
    C: They must be notarized by a state official.
    D: They must be issued within the last 30 days.
  answer: B
  explanation: The acceptable documents provided as proof of Wyoming residency must
    show a residential address, not a P.O. Box.
- id: 29
  category: driver_testing
  question: What is the minimum visual acuity required in both eyes to meet Wyoming
    vision standards for operating a motor vehicle?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: A person must have 20/40 acuity with both eyes, either with or without
    glasses, to meet Wyoming vision standards.
- id: 30
  category: driver_testing
  question: In addition to visual acuity, what is the minimum combined horizontal
    field of vision required to pass the vision screening?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 140 degrees
  answer: C
  explanation: A person must have a combined horizontal field vision of at least 120
    degrees to meet Wyoming vision standards for operating a motor vehicle.
- id: 31
  category: driver_testing
  question: If your visual acuity is worse than 20/40 but at least 20/100, what will
    you be required to do?
  choices:
    A: Obtain a restricted license
    B: Take a driving skills test
    C: Drive only during daylight hours
    D: Wear corrective lenses at all times
  answer: B
  explanation: The manual states that if your visual acuity is worse than 20/40 but
    at least 20/100, you will be required to take a driving skills test.
- id: 32
  category: driver_testing
  question: How many times are applicants for a driver's license allowed to take the
    written test in one day?
  choices:
    A: Once
    B: Twice
    C: Three times
    D: Unlimited times
  answer: B
  explanation: Applicants for a driver's license are allowed to take the written test
    twice in one day.
- id: 33
  category: driver_testing
  question: To waive the skills test using a driver education certification card,
    the student must have completed how many hours of instruction?
  choices:
    A: 20 hours of classroom instruction and 4 hours of behind-the-wheel driving
    B: 30 hours of classroom instruction and 6 hours of behind-the-wheel driving
    C: 40 hours of classroom instruction and 10 hours of behind-the-wheel driving
    D: 50 hours of classroom instruction and 10 hours of behind-the-wheel driving
  answer: B
  explanation: The certification card must state that the student has completed 30
    hours of classroom instruction and six hours of behind-the-wheel driving to waive
    the skills test.
- id: 34
  category: license_system
  question: When operating a motor vehicle with an instruction permit, the driver
    must be accompanied by a person who is at least what age?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: When operating a motor vehicle with an instruction permit, the driver
    must be accompanied by a person 18 or older who possesses a valid driver license
    for the type of vehicle being driven.
- id: 35
  category: license_system
  question: If a licensee is under 21 and wants an 'adult'-type license, when can
    they renew their license?
  choices:
    A: Within 120 days preceding expiration
    B: Within 90 days of expiration
    C: Within 60 days of their 21st birthday
    D: Within 30 days of their 21st birthday
  answer: D
  explanation: If a licensee is under 21 and wants an 'adult'-type license, they can
    only renew within 30 days of their 21st birthday.
- id: 36
  category: license_system
  question: At 16 and one-half years of age, an applicant may be issued full driving
    privileges if they have held a current intermediate license for at least how long?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: At 16 and one-half years of age, applicants may be issued full driving
    privileges if they have a current intermediate license that is at least six months
    old.
- id: 37
  category: license_system
  question: To qualify for a restricted license due to extreme inconvenience, an applicant
    aged 14-15 must live at least how many miles from school and/or employment?
  choices:
    A: 2 miles
    B: 5 miles
    C: 10 miles
    D: 15 miles
  answer: B
  explanation: A restricted license may be issued to applicants, 14-15, when an extreme
    inconvenience exists, provided they live five or more miles from school and/or
    employment.
- id: 38
  category: license_system
  question: What are the valid driving hours for a restricted license issued for extreme
    inconvenience?
  choices:
    A: 5 a.m. to 8 p.m.
    B: 6 a.m. to 10 p.m.
    C: 7 a.m. to 7 p.m.
    D: 5 a.m. to 11 p.m.
  answer: A
  explanation: The restricted license for extreme inconvenience is only valid between
    the hours of 5 a.m. and 8 p.m. and within 50 miles of the licensee's residence.
- id: 39
  category: license_system
  question: To obtain an intermediate license at age 16 using an Instruction Permit,
    how many hours of behind-the-wheel driving must be certified by a parent or legal
    guardian?
  choices:
    A: 30 hours, including 6 hours of nighttime driving
    B: 40 hours, including 8 hours of nighttime driving
    C: 50 hours, including 10 hours of nighttime driving
    D: 60 hours, including 15 hours of nighttime driving
  answer: C
  explanation: An applicant must have completed 50 hours of behind-the-wheel driving,
    including 10 hours of nighttime driving, as certified by a parent or legal guardian.
- id: 40
  category: license_system
  question: Holders of an intermediate license may not transport more than how many
    passengers under the age of 18 who are not immediate family members, unless accompanied
    by a licensed driver 18 or older?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Holders of Intermediate licenses may not transport more than one passenger
    under the age of 18 who is not an immediate family member unless also accompanied
    by a licensed driver 18 years of age or older.
- id: 41
  category: license_system
  question: Without an approved exception form, between what hours is an intermediate
    license holder prohibited from driving?
  choices:
    A: 9 p.m. and 5 a.m.
    B: 10 p.m. and 6 a.m.
    C: 11 p.m. and 5 a.m.
    D: Midnight and 6 a.m.
  answer: C
  explanation: Intermediate license holders may not drive between 11 p.m. and 5 a.m.
    unless the holder meets an exception criteria and presents a completed exception
    form.
- id: 42
  category: penalties_and_points
  question: How long will an intermediate license be suspended for any violation of
    its specific provisions?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: An intermediate license will be suspended for 30 days for any violation
    of these provisions.
- id: 43
  category: license_system
  question: What additional fee is imposed on all classes of driver licenses and CDL
    Skills tests in Wyoming?
  choices:
    A: A $2 processing fee
    B: A $5 technology fee
    C: A $10 administrative fee
    D: A $15 record review fee
  answer: B
  explanation: An additional technology fee of $5 will be imposed on all classes of
    driver licenses and CDL Skills tests.
- id: 44
  category: driver_testing
  question: In what language are all written driver's license tests given in Wyoming?
  choices:
    A: English and Spanish
    B: English only, but an interpreter may be used
    C: Any language requested 24 hours in advance
    D: English only, and interpreters are strictly prohibited
  answer: B
  explanation: All tests are given in English only, so if a person cannot speak or
    write the English language, an interpreter may be used.
- id: 45
  category: license_system
  question: When does a Wyoming intermediate driver's license automatically expire?
  choices:
    A: On the holder's 18th birthday
    B: 30 days after the holder's 17th birthday
    C: 6 months after issuance
    D: On the holder's 21st birthday
  answer: B
  explanation: According to the manual, an intermediate license automatically expires
    30 days after the holder's 17th birthday.
- id: 46
  category: driver_responsibility
  question: Which of the following is a required criterion for the Wyoming Division
    of Criminal Investigation (DCI) to activate an Amber Alert?
  choices:
    A: The abducted child must be 17 years of age or younger.
    B: The child must have been missing for at least 24 hours.
    C: The suspect's vehicle license plate must be known.
    D: The child must be 12 years of age or younger.
  answer: A
  explanation: One of the criteria that must be met prior to DCI activating an Amber
    Alert is that the child must be 17 years of age or younger.
- id: 47
  category: safe_driving_rules
  question: Based on Wyoming statistics from 2015-2019, what percentage of traffic
    fatalities involved individuals who were not wearing their seat belts?
  choices:
    A: Exactly 25%
    B: Less than 10%
    C: More than 50%
    D: Nearly 90%
  answer: C
  explanation: The manual states that an average of 100 people died on Wyoming's roads
    each year from 2015-2019, and more than 50% of those fatalities were not wearing
    their seat belts.
- id: 48
  category: license_system
  question: Under what condition can you obtain a copy of another person's driving
    record at a local exam station?
  choices:
    A: If you are their employer
    B: If you present a written release from the person whose record is being released
    C: If you pay double the standard fee
    D: If you are a licensed insurance agent
  answer: B
  explanation: It is possible to obtain another's driver record provided a written
    release is presented to the examiner from the person whose driver record is being
    released.
- id: 49
  category: license_system
  question: The Federal Driver's Privacy Protection Act prohibits WYDOT from providing
    your personal information for which of the following purposes?
  choices:
    A: Law enforcement investigations
    B: Surveys, marketing, and solicitations
    C: Releasing records pertaining to vehicular crashes
    D: Checking driver license or registration status
  answer: B
  explanation: The Federal Driver's Privacy Protection Act prohibits WYDOT from providing
    personal information to individuals and businesses for the purposes of surveys,
    marketing and solicitations.
- id: 50
  category: alcohol_drugs_health
  question: What is required for a minor under 18 years of age to register as an organ
    and tissue donor on their driver's license application?
  choices:
    A: A physician's medical clearance
    B: A parent's or guardian's signature
    C: A minimum of 50 hours of driving experience
    D: A separate application mailed to the Donor Registry
  answer: B
  explanation: A parent's or guardian's signature is required to approve an anatomical
    gift for minors under eighteen (18) years of age.
- id: 51
  category: vehicle_information
  question: To be issued a permanent disabled placard in Wyoming, a person's physical
    impairment must last for a minimum of how long?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: Permanent disabled placards are issued to persons who suffer from physical
    impairments that must last a minimum of 12 months.
- id: 52
  category: vehicle_information
  question: What is the maximum duration for which a temporary disabled placard may
    be issued?
  choices:
    A: Up to 3 months
    B: Up to 6 months
    C: Up to 9 months
    D: Up to 12 months
  answer: B
  explanation: Temporary placards may be issued to persons who suffer an impairment
    for up to 6 months.
- id: 53
  category: vehicle_information
  question: What is the fee for an applicant to obtain a disabled placard in Wyoming?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: There is no cost
  answer: D
  explanation: The manual explicitly states that disabled placards are available at
    no cost to the applicant.
- id: 54
  category: driver_responsibility
  question: If you choose to donate to Wildlife Conservation on your driver's license
    application, what will the funds be used for?
  choices:
    A: Funding state parks and recreation areas
    B: Wildlife conservation efforts related to the transportation system, such as
      wildlife crossings
    C: Paying the salaries of game wardens
    D: Stocking fish in local lakes and rivers
  answer: B
  explanation: Funds in the wildlife conservation account shall only be used to provide
    for wildlife conservation efforts related to the transportation system, including
    signage, wildlife corridors, wildlife crossings and game fences.
- id: 55
  category: alcohol_drugs_health
  question: 'An Administrative Per Se Suspension occurs when you are arrested for
    DWUI and your chemical test shows an alcohol concentration of at least:'
  choices:
    A: 0.02 percent
    B: 0.04 percent
    C: 0.08 percent
    D: 0.15 percent
  answer: C
  explanation: An Administrative Per Se Suspension results when you have been arrested
    for DWUI and the results of your chemical test show an alcohol concentration of
    0.08 percent or greater.
- id: 56
  category: penalties_and_points
  question: What is the length of an Administrative Per Se Suspension for a DWUI arrest?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The length of suspension for an Administrative Per Se Suspension is
    90 days.
- id: 57
  category: penalties_and_points
  question: When does an Administrative Per Se Suspension or disqualification officially
    start?
  choices:
    A: Immediately at the time of the arrest
    B: 10 days after the court conviction
    C: 30 days after the issuance of the temporary driver's license and notice of
      suspension
    D: 60 days after the chemical test results are processed
  answer: C
  explanation: The start of the suspension/disqualification is 30 days after the issuance
    of the temporary driver's license and notice of suspension given by the officer
    at the time of the arrest.
- id: 58
  category: penalties_and_points
  question: 'For a first DWUI offense, you will be required to hold an ignition interlock
    restricted driver license for 6 months if your BAC at the time of arrest was:'
  choices:
    A: 0.08% or greater
    B: 0.10% or greater
    C: 0.15% or greater
    D: 0.20% or greater
  answer: C
  explanation: If your BAC at the time of arrest was .15% or greater, you will be
    required to hold an ignition interlock restricted driver license for a period
    of 6 months before you are eligible for any other type of driver license.
- id: 59
  category: penalties_and_points
  question: What is the length of the driver's license suspension for a second DWUI
    conviction within a 10-year period?
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: Lifetime
  answer: C
  explanation: For a 2nd DWUI offense (within the previous 10 years), the length of
    suspension is one year.
- id: 60
  category: penalties_and_points
  question: If convicted of a fourth or subsequent DWUI that includes alcohol, how
    long are you required to hold an ignition interlock restricted driver license?
  choices:
    A: Two years
    B: Five years
    C: Ten years
    D: For life
  answer: D
  explanation: The manual states that if convicted of a 4th or subsequent DWUI which
    includes alcohol, you will be required to hold an ignition interlock restricted
    driver license for life (though you may petition the court for removal after 5
    years).
- id: 61
  category: alcohol_drugs_health
  question: 'A driver younger than 21 years of age will be suspended for DWUI if they
    are in actual physical control of a vehicle with a blood alcohol concentration
    (BAC) of at least:'
  choices:
    A: 0.02 percent
    B: 0.04 percent
    C: 0.08 percent
    D: 0.15 percent
  answer: A
  explanation: If you are younger than 21 years of age and are in actual physical
    control of a vehicle with an alcohol concentration of 0.02 percent or more, you
    will be suspended for DWUI.
- id: 62
  category: penalties_and_points
  question: What is the length of suspension for a first-offense Youthful Driver DWUI?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: Six months
  answer: C
  explanation: For a Youthful Driver Suspension (under 21), the length of suspension
    for a first offense is 90 days.
- id: 63
  category: safe_driving_rules
  question: Which of the following actions will result in a Reckless Driving Suspension?
  choices:
    A: Driving without liability insurance
    B: Driving a vehicle with willful or wanton disregard for the safety of persons
      or property
    C: Accumulating four moving violations in a 12-month period
    D: Violating the restrictions of an intermediate license
  answer: B
  explanation: A Reckless Driving Suspension results upon receipt of a conviction
    of driving a vehicle with willful or wanton disregard for the safety of persons
    or property.
- id: 64
  category: penalties_and_points
  question: What is the length of suspension for a second reckless driving offense
    within the previous five years?
  choices:
    A: 90 days
    B: Six months
    C: One year
    D: Three years
  answer: B
  explanation: For a second reckless driving offense within the previous five years,
    the length of suspension is six months.
- id: 65
  category: alcohol_drugs_health
  question: What is the penalty for a conviction of intending to furnish an alcoholic
    beverage to a person under 21 while operating or occupying a motor vehicle?
  choices:
    A: A 90-day suspension
    B: A six-month suspension
    C: A one-year suspension
    D: A three-year revocation
  answer: C
  explanation: The Transporting Liquor to a Minor Suspension results in a one-year
    suspension.
- id: 66
  category: penalties_and_points
  question: 'The Non-Resident Violator Compact Suspension occurs when a driver:'
  choices:
    A: Fails to comply with the terms of a traffic citation
    B: Is caught driving without liability insurance in another state
    C: Accumulates too many points on an out-of-state license
    D: Transports liquor across state lines
  answer: A
  explanation: The Non-Resident Violator Compact Suspension results when a court informs
    the department that you have not complied with the terms of a traffic citation.
- id: 67
  category: penalties_and_points
  question: How many moving violations are you allowed within a 12-month period before
    your driving privilege is suspended?
  choices:
    A: Up to two
    B: Up to three
    C: Up to four
    D: Up to five
  answer: B
  explanation: You are allowed up to three moving violations within a 12-month period.
    Upon receipt of conviction for a fourth moving violation, your driving privilege
    will be suspended.
- id: 68
  category: penalties_and_points
  question: 'A Compulsory Insurance Suspension will remain in effect until the driver:'
  choices:
    A: Pays a $5,000 fine
    B: Completes an alcohol/drug evaluation
    C: Files an SR-22 insurance form with the department
    D: Passes a re-examination of driving ability
  answer: C
  explanation: The Compulsory Insurance Suspension lasts until an SR-22 insurance
    form has been filed with the department.
- id: 69
  category: license_system
  question: 'Lending your driver''s license or ID card to someone else to use as their
    identification may result in:'
  choices:
    A: A 30-day suspension
    B: Cancellation of the card and/or a 90-day suspension
    C: A six-month suspension
    D: A lifetime revocation
  answer: B
  explanation: Unlawful Use & False Application actions, such as lending your license
    to someone else, may result in the cancellation of the card, and/or a 90-day suspension.
- id: 70
  category: penalties_and_points
  question: A Child Support Suspension is triggered when a person is in arrears of
    $5,000 or more for how many consecutive days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: A Child Support Suspension results upon notification that you are in
    arrears of $5,000 or more for 90 consecutive days.
- id: 71
  category: license_system
  question: What is the penalty for a first moving violation conviction while holding
    a restricted class RC/RM license?
  choices:
    A: A 30-day suspension
    B: A 60-day suspension
    C: A 90-day suspension
    D: A one-year suspension
  answer: C
  explanation: For a Restricted Class RC/RM License Suspension, a 90-day suspension
    is imposed for a first offense.
- id: 72
  category: license_system
  question: 'Violating the restrictions of an intermediate license will result in
    a suspension of:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: Six months
  answer: A
  explanation: An Intermediate License Suspension is the result of a violation of
    the restrictions for an intermediate license, and a 30-day suspension is imposed
    for this offense.
- id: 73
  category: penalties_and_points
  question: 'If you are under 21 years of age and convicted of driving under suspension,
    revocation, or cancellation, your driving privileges will be suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: Six months
    D: One year
  answer: A
  explanation: Driving under Suspension, Revocation or Cancellation results in a 30-day
    suspension of your driving privileges if you are under 21 years of age.
- id: 74
  category: penalties_and_points
  question: How long is the suspension for violating the restrictions of an intermediate
    license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: A
  explanation: According to the manual, a 30-day suspension is imposed for a violation
    of the restrictions for an intermediate license.
- id: 75
  category: penalties_and_points
  question: If your license is suspended due to an uninsured accident, what is the
    required cash deposit amount per injury to help reinstate your privileges?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: To reinstate after an uninsured accident suspension, one option is
    to post a cash deposit for the total amount of property damage, plus $25,000 per
    injury.
- id: 76
  category: license_system
  question: How many probationary driver's licenses can you be issued in a five-year
    period?
  choices:
    A: One
    B: Two
    C: Three
    D: Unlimited
  answer: A
  explanation: The manual states that you can only be issued one probationary driver’s
    license in a five-year period.
- id: 77
  category: penalties_and_points
  question: What is the license reinstatement fee for a child support suspension?
  choices:
    A: $5
    B: $25
    C: $50
    D: $100
  answer: A
  explanation: Generally, the reinstatement fee for suspensions is $50. However, the
    reinstatement fee for a child support suspension is $5.
- id: 78
  category: penalties_and_points
  question: Which of the following offenses will cause a revocation of your driver
    license?
  choices:
    A: First offense of Reckless Driving
    B: Leaving the Scene of an Injury Accident
    C: Second Driving While Under the Influence (DWUI)
    D: Violating intermediate license restrictions
  answer: B
  explanation: Offenses that will cause a revocation include Leaving the Scene of
    an Injury Accident, Homicide by Vehicle, and third or subsequent DWUI or Reckless
    Driving.
- id: 79
  category: license_system
  question: How long must proof of financial responsibility (an SR-22) be maintained
    from the date it is required?
  choices:
    A: One year
    B: Two years
    C: Three years
    D: Five years
  answer: C
  explanation: Proof of financial responsibility (SR-22) must be maintained for three
    years from the date it is required.
- id: 80
  category: penalties_and_points
  question: When does a suspension or revocation officially start?
  choices:
    A: Immediately upon arrest
    B: 10 days from the date of the offense
    C: 30 days from the date the order is mailed or given to you
    D: 60 days after your court hearing
  answer: C
  explanation: The start of a suspension/revocation is 30 days from the date the order
    is mailed to you by the department or given to you by law enforcement, or at the
    end of any suspensions already on your record.
- id: 81
  category: alcohol_drugs_health
  question: 'A six-month ignition interlock requirement is imposed for a first DWUI
    conviction if the driver''s Blood Alcohol Concentration (BAC) was at least:'
  choices:
    A: .08 percent
    B: .10 percent
    C: .15 percent
    D: .20 percent
  answer: C
  explanation: A six-month ignition interlock requirement applies if convicted of
    a 1st DWUI and the department’s administrative action indicates a BAC of .15 percent
    or greater.
- id: 82
  category: alcohol_drugs_health
  question: If you receive a lifetime ignition interlock requirement for a 4th or
    subsequent DWUI, after how many years can you petition for its removal?
  choices:
    A: 3 years
    B: 5 years
    C: 7 years
    D: 10 years
  answer: B
  explanation: For a lifetime ignition interlock requirement (4th or subsequent DWUI
    when alcohol is involved), you may petition for removal of the requirement five
    years after the conviction date.
- id: 83
  category: safe_driving_rules
  question: How should the lap belt of a safety belt be worn properly?
  choices:
    A: Loosely across the stomach
    B: Snugly across the hip bones
    C: Across the soft part of the abdomen
    D: Tightly across the thighs
  answer: B
  explanation: The lap belt should be drawn snugly across the hip bones. It should
    never be worn across the stomach or soft part of the abdomen.
- id: 84
  category: safe_driving_rules
  question: Under Wyoming law, a child must be properly secured in a child restraint
    system until they reach what age?
  choices:
    A: Their sixth birthday
    B: Their seventh birthday
    C: Their eighth birthday
    D: Their ninth birthday
  answer: D
  explanation: The Wyoming Child Restraint Guide applies to a child who has not reached
    his/her ninth birthday.
- id: 85
  category: safe_driving_rules
  question: When is it permissible to place a child in a vehicle's front seat?
  choices:
    A: When the child prefers the front seat
    B: If the vehicle only has one row of seats
    C: When the child is in a rear-facing infant seat and the airbag is active
    D: If the driver is over 21 years old
  answer: B
  explanation: A child must be secured in a vehicle seat other than the front seat
    except in vehicles with one row of seats, or if all safety belts are in use by
    other child passengers.
- id: 86
  category: penalties_and_points
  question: What is the maximum fine for a first offense of violating the child restraint
    law?
  choices:
    A: $25
    B: $60
    C: $110
    D: $200
  answer: B
  explanation: The penalty for a first offense of the child restraint law is a maximum
    $60 fine, which can be waived by the court upon receipt of proof of acquiring
    an approved restraint.
- id: 87
  category: safe_driving_rules
  question: Which of the following vehicles is exempt from the child restraint law?
  choices:
    A: A rented non-commercial passenger vehicle
    B: A privately owned SUV
    C: A passenger vehicle manufactured before 1967
    D: A leased minivan
  answer: C
  explanation: Exemptions to the child restraint law include vehicles that were not
    equipped with safety belts at the time of manufacture, such as passenger vehicles
    before model year 1967.
- id: 88
  category: alcohol_drugs_health
  question: 'A driver may apply for a 24/7 restricted driver license in lieu of the
    ignition interlock requirement if:'
  choices:
    A: They pay an additional $500 fee
    B: They have received an order from the Court to participate in the 24/7 Sobriety
      Program
    C: They have never had a previous DWUI
    D: They submit a notarized affidavit of sobriety
  answer: B
  explanation: A driver may apply for a 24/7 restricted driver license if they have
    received an order from the Court ordering the driver to participate in the 24/7
    Sobriety Program in lieu of the ignition interlock requirement.
- id: 89
  category: safe_driving_rules
  question: If a vehicle seat has a head rest, what type of booster seat should be
    used and how should the head rest be adjusted?
  choices:
    A: A high back booster; head rest at the top of the child's head.
    B: A low back belt-positioning booster; head rest to the middle of the child's
      head behind the ears.
    C: A high back booster; head rest removed completely.
    D: A low back belt-positioning booster; head rest at the base of the child's neck.
  answer: B
  explanation: 'The manual states: ''If head rest available, use low back belt-positioning
    booster and adjust head rest to middle of child''s head behind the ears.'''
- id: 90
  category: safe_driving_rules
  question: To properly fit a seat belt on a child, how should the lap belt be positioned?
  choices:
    A: High across the stomach
    B: Loosely across the waist
    C: Low across the hip/upper thigh
    D: Diagonally across the chest
  answer: C
  explanation: To fit a seat belt, a child must keep the shoulder belt snugly over
    the chest and the lap belt low across the hip/upper thigh.
- id: 91
  category: safe_driving_rules
  question: Which of the following individuals is NOT required by law to wear a safety
    belt?
  choices:
    A: A delivery driver for a private courier service
    B: A U.S. postal service worker performing duties as a postal carrier
    C: A passenger in the back seat of a modern vehicle
    D: A driver with a suspended license
  answer: B
  explanation: Persons not required to wear a safety belt include anyone who is a
    U.S. postal service worker performing duties as a postal carrier.
- id: 92
  category: license_system
  question: Which of the following states is currently NOT a member of the Driver
    License Compact?
  choices:
    A: Wyoming
    B: Texas
    C: California
    D: Georgia
  answer: D
  explanation: The manual notes that all states except Georgia, Massachusetts, Michigan,
    Tennessee and Wisconsin are currently members of the Driver License Compact.
- id: 93
  category: alcohol_drugs_health
  question: Driving under the influence of alcohol is the major cause of almost what
    proportion of crashes in which someone is killed?
  choices:
    A: One-quarter
    B: One-third
    C: Half
    D: Three-quarters
  answer: C
  explanation: Driving while under the influence of alcohol is the major cause of
    ALMOST HALF of the crashes in which someone is killed.
- id: 94
  category: alcohol_drugs_health
  question: Which of the following is NOT one of the three main factors that influence
    a person's Blood Alcohol Concentration (BAC)?
  choices:
    A: The amount of alcohol consumed
    B: The person's body weight
    C: The type of alcohol consumed (e.g., beer vs. wine)
    D: The period of time over which the alcohol was consumed
  answer: C
  explanation: 'The three factors that influence a person''s BAC are: the amount of
    alcohol consumed, the period of time over which it was consumed, and the person''s
    body weight.'
- id: 95
  category: alcohol_drugs_health
  question: 'According to the manual, 12 ounces of beer contains about the same amount
    of alcohol as:'
  choices:
    A: 1 ounce of wine
    B: 3 to 5 ounces of wine
    C: 8 ounces of wine
    D: 12 ounces of wine
  answer: B
  explanation: 12 ounces of beer, three to five ounces of wine, and one and one-half
    ounces of 86 proof hard liquor each have about one-half ounce of alcohol.
- id: 96
  category: alcohol_drugs_health
  question: How long does it take to totally absorb the alcohol contained in a single
    drink?
  choices:
    A: 10 to 15 minutes
    B: 30 to 40 minutes
    C: 1 hour
    D: 2 hours
  answer: B
  explanation: The effects will increase with the passage of time since it takes 30
    to 40 minutes to totally absorb the alcohol contained in a single drink.
- id: 97
  category: alcohol_drugs_health
  question: What is the ONLY significant factor in reducing BAC levels?
  choices:
    A: Drinking coffee
    B: Eating a heavy meal
    C: Exercising
    D: Time
  answer: D
  explanation: TIME IS THE ONLY SIGNIFICANT FACTOR IN REDUCING BAC LEVELS. Showering,
    drinking coffee, or exercising in an effort to sober up are useless.
- id: 98
  category: alcohol_drugs_health
  question: 'Approximately 90 percent of the alcohol in your body is eliminated by
    the:'
  choices:
    A: Kidneys
    B: Stomach
    C: Liver
    D: Lungs
  answer: C
  explanation: Approximately 90 percent of the alcohol in your body is eliminated
    by the liver at a constant rate of about one drink per hour.
- id: 99
  category: alcohol_drugs_health
  question: If a heavy person and a light person drink the same amount of alcohol,
    how will their BAC levels likely compare?
  choices:
    A: The heavy person will likely have a lower BAC.
    B: The light person will likely have a lower BAC.
    C: Both will have the exact same BAC.
    D: The heavy person's BAC will fluctuate more rapidly.
  answer: A
  explanation: Heavier people have more blood and body fluids which dilute alcohol
    more. Therefore, if a heavy person and a light person drink the same amount, the
    heavy person will likely have a lower BAC.
- id: 100
  category: alcohol_drugs_health
  question: How does alcohol affect an impaired driver's ability to 'IDENTIFY' hazards?
  choices:
    A: It enhances their peripheral vision.
    B: It causes them to fix their vision on a particular object and lose side detection.
    C: It improves their ability to judge distances.
    D: It makes them constantly scan their surroundings.
  answer: B
  explanation: Impaired drivers tend to fix their vision on a particular object and
    not see others. The ability to detect persons and vehicles to the side is almost
    completely lost.
- id: 101
  category: alcohol_drugs_health
  question: Because of a reduced ability to execute decisions, a drinking driver traveling
    at 55 mph will drive an additional how many feet before they can apply the brakes?
  choices:
    A: 10 feet
    B: 20 feet
    C: 32 feet
    D: 55 feet
  answer: C
  explanation: Because of this reduced ability to execute, a drinking driver, traveling
    at 55 mph, will drive an additional 32 feet or more before he can apply the brakes.
- id: 102
  category: alcohol_drugs_health
  question: According to the manual, which mental state combined with alcohol has
    been found to be one of the most dangerous combinations?
  choices:
    A: Elation
    B: Anxiety
    C: Fatigue
    D: Anger
  answer: D
  explanation: In fact, anger and alcohol have been found to be one of the most dangerous
    combinations. Alcohol makes it much more difficult for people to control themselves.
- id: 103
  category: safe_driving_rules
  question: If there is no head rest on the vehicle seat, what type of booster seat
    should be used to provide head protection for a child?
  choices:
    A: A low back belt-positioning booster
    B: A high back belt-positioning booster
    C: A lap-belt only booster
    D: A rear-facing infant seat
  answer: B
  explanation: If no head rest on vehicle seat, use high back belt positioning booster
    to provide head protection.
- id: 104
  category: alcohol_drugs_health
  question: Under Wyoming's Implied Consent law, what are drivers deemed to have given
    their consent to?
  choices:
    A: A search of their vehicle without probable cause.
    B: Chemical tests to determine their Blood Alcohol Concentration (BAC).
    C: A mandatory 90-day license suspension.
    D: Answering all questions from law enforcement without a lawyer.
  answer: B
  explanation: Under the Implied Consent law, drivers are deemed to have given their
    consent to chemical tests to determine their BAC whenever driving on a public
    street or highway.
- id: 105
  category: penalties_and_points
  question: If you submit to a chemical test and your BAC is 0.08 percent or more,
    how long will your driver license and driving privileges be suspended?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: If you submit to the required test or tests and your BAC is 0.08 percent
    or more, your driver license and driving privileges will be suspended for 90 days.
- id: 106
  category: alcohol_drugs_health
  question: Can you be convicted of Driving While Under the Influence (DWUI) with
    a BAC of 0.05 percent?
  choices:
    A: No, the legal limit is strictly 0.08 percent.
    B: Yes, but only if you are under 21 years old.
    C: Yes, with other supporting evidence.
    D: No, unless you refuse a chemical test.
  answer: C
  explanation: While a BAC of 0.08 percent or more may result in a conviction, you
    may also be convicted of DWUI with a BAC of 0.05 percent and other supporting
    evidence.
- id: 107
  category: alcohol_drugs_health
  question: How do diet and 'stay-awake' pills affect a driver?
  choices:
    A: They improve a driver's ability to identify critical objects.
    B: They give a false feeling of alertness and often increase risk-taking.
    C: They permanently cure driver fatigue.
    D: They slow down a driver's reaction time and cause immediate sleepiness.
  answer: B
  explanation: Diet and 'stay-awake' pills give drivers a false feeling of alertness
    and often increase self-confidence, which may lead to excessive risk-taking.
- id: 108
  category: safe_driving_rules
  question: If you are pulled over by law enforcement, which of the following is a
    place you should NOT stop your vehicle?
  choices:
    A: On the right side of the roadway.
    B: In a safe location off the highway.
    C: On a bridge.
    D: In a nearby parking lot.
  answer: C
  explanation: When you see the blue and red overhead lights and/or hear the siren,
    remain calm, slow down, and pull over to the right of the roadway in a safe location.
    Do not stop in the lane of travel, on bridges, or against guardrails.
- id: 109
  category: driver_responsibility
  question: What should you do with your hands when stopped by a police officer?
  choices:
    A: Keep them in your pockets.
    B: Keep them on the steering wheel so the officer can see them.
    C: Reach into the glove compartment to get your registration ready.
    D: Wave them out the window to signal the officer.
  answer: B
  explanation: During a traffic stop, you should keep your hands on the steering wheel
    so the officer can see them.
- id: 110
  category: driver_responsibility
  question: If you have a weapon in your vehicle during a traffic stop, how should
    you inform the police officer?
  choices:
    A: Point to the location of the weapon.
    B: Reach for the weapon to show the officer it is safe.
    C: Inform the officer of the weapon and its location without reaching or pointing.
    D: Wait until the officer searches the vehicle to mention it.
  answer: C
  explanation: Inform the officer of any weapons in your vehicle and their location.
    Do not reach or point to the location.
- id: 111
  category: sharing_the_road
  question: If you approach an emergency vehicle with its lights activated on the
    side of a two-lane road, what does Wyoming law require you to do?
  choices:
    A: Stop immediately and wait for the vehicle to leave.
    B: Reduce your speed by at least 20 mph.
    C: Maintain your speed but honk your horn.
    D: Merge into the lane farthest from the vehicle.
  answer: B
  explanation: If you come across an emergency or maintenance vehicle with its lights
    activated on the side of the road, Wyoming law requires you to reduce your speed
    by at least 20 mph on a two-lane road.
- id: 112
  category: sharing_the_road
  question: What must you do if you are being overtaken by an emergency vehicle with
    its lights activated?
  choices:
    A: Speed up to stay ahead of the emergency vehicle.
    B: Stop in your current lane immediately.
    C: Pull off to the right side of the road and stop until it passes.
    D: Move to the left lane and slow down.
  answer: C
  explanation: If you are being overtaken by an emergency vehicle with its lights
    activated, Wyoming law requires you to pull off to the right side of the road
    and stop until the emergency vehicle has passed.
- id: 113
  category: safe_driving_rules
  question: Unless otherwise posted, what is the legal speed limit in a residential
    area in Wyoming?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: The legal speed limit in residential areas is 30 mph, unless otherwise
    posted.
- id: 114
  category: safe_driving_rules
  question: At what maximum speed should you approach a 'blind' intersection where
    your view is blocked by trees or buildings?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Trees, bushes or buildings at intersections can block the view of vehicles
    coming from the side. Therefore approach a 'blind' intersection at no more than
    15 mph.
- id: 115
  category: defensive_driving
  question: How much should you reduce your speed when driving on a road covered in
    packed snow?
  choices:
    A: By at least 5-10 mph.
    B: By at least half.
    C: Reduce speed to a crawl.
    D: Maintain the posted speed limit.
  answer: B
  explanation: When driving on packed snow, you should reduce your speed by at least
    half.
- id: 116
  category: defensive_driving
  question: Why is it dangerous to drive faster than 55 mph on a dark road?
  choices:
    A: Your tires lose traction at night.
    B: You are 'driving blind' because you cannot stop within the 250 feet illuminated
      by your headlights.
    C: Speed limits are automatically reduced to 45 mph at night.
    D: Oncoming vehicles will be blinded by your headlights.
  answer: B
  explanation: Your lights will only let you see clearly about 250 feet. If you then
    drive faster than 55 mph on a dark road, you are really 'driving blind' because
    you won't be able to stop within the 250 feet ahead of you that is lit well enough
    to see.
- id: 117
  category: sharing_the_road
  question: How should drivers treat bicyclists on a public roadway?
  choices:
    A: As pedestrians who must yield to motor vehicles.
    B: As hazards that should be passed as quickly as possible.
    C: As slow-moving traffic with an equal legal right to be on the roadway.
    D: As vehicles that are only allowed on sidewalks.
  answer: C
  explanation: Bicyclists have as much legal right to be on a public roadway as you.
    All bicycles should be identified as slow-moving traffic and your speed and driving
    should be adjusted to accommodate them.
- id: 118
  category: safe_driving_rules
  question: When is the proper time to adjust your speed for a curve in the road?
  choices:
    A: Before entering the curve.
    B: While at the apex of the curve.
    C: As you are exiting the curve.
    D: Whenever you feel the tires losing their grip.
  answer: A
  explanation: Adjust speed BEFORE entering a curve. Going too fast can break the
    grip that tires have on the road.
- id: 119
  category: defensive_driving
  question: What should you do if heavy rain, snow, or thick fog limits your visibility
    to less than 100 feet ahead?
  choices:
    A: Turn on your high beams and maintain your speed.
    B: Slow down to 20 mph and use your hazard lights.
    C: Pull off the road and wait until it clears.
    D: Follow the taillights of the vehicle in front of you closely.
  answer: C
  explanation: The manual states that when you cannot see more than 100 feet ahead
    due to heavy rain, snowstorm, or thick fog, you cannot drive safely at any speed
    and should pull off the road and wait until it clears.
- id: 120
  category: sharing_the_road
  question: How are bicyclists classified according to right-of-way laws?
  choices:
    A: As pedestrians with special privileges.
    B: As hazards that must always yield to motor vehicles.
    C: As vehicles with the same rights and responsibilities as motor vehicles.
    D: As slow-moving traffic that must remain on the sidewalk.
  answer: C
  explanation: The manual notes that it is important to remember that bicyclists are
    classified as vehicles and are granted the same rights and responsibilities that
    operators of motor vehicles have.
- id: 121
  category: safe_driving_rules
  question: At an intersection with no signs or signals, who must you yield the right
    of way to?
  choices:
    A: Any driver coming from your left.
    B: Any driver coming from your right.
    C: The driver who reaches the intersection last.
    D: The largest vehicle at the intersection.
  answer: B
  explanation: Where no signs or signals are in place, you must watch for any driver
    coming from your right and yield the right of way regardless of who first reaches
    and enters the intersection.
- id: 122
  category: defensive_driving
  question: Where are you most likely to encounter sudden changes in road surface
    conditions, such as black ice?
  choices:
    A: In the center lanes of a multi-lane highway.
    B: At bridge decks, overpasses, and near snow fences.
    C: Only in residential neighborhoods.
    D: On freshly paved asphalt roads.
  answer: B
  explanation: Black ice is invisible and treacherous. The manual warns that sudden
    changes to extremely icy conditions occur often at bridge decks, overpasses, on
    high fills, in deep cuts, and near snow fences.
- id: 123
  category: safe_driving_rules
  question: How can you determine if you are following another vehicle too closely
    in winter conditions?
  choices:
    A: By ensuring you can clearly read their license plate.
    B: By keeping exactly two car lengths behind them.
    C: By counting 'one-thousand-one' to 'one-thousand-four' after the car ahead passes
      a landmark.
    D: By checking if your headlights illuminate their rear bumper.
  answer: C
  explanation: To check your following distance, allow the car ahead to pass a landmark,
    and then count 'one-thousand-one' through 'one-thousand-four.' If your car reaches
    the same landmark before you finish, you are following too closely.
- id: 124
  category: vehicle_information
  question: What is the recommended braking technique if your vehicle has conventional
    (non-ABS) brakes on a slippery road?
  choices:
    A: Jam on the brakes as hard as possible.
    B: Pump the brakes once every second.
    C: Lightly tap the brakes continuously.
    D: Apply steady, hard pressure without releasing.
  answer: B
  explanation: For conventional brakes, locked wheels and skids typically result when
    drivers jam on them. Pumping those brakes once every second is a good rule of
    thumb.
- id: 125
  category: defensive_driving
  question: What should you do if your vehicle begins to skid on a slippery road?
  choices:
    A: Slam on the brakes and steer straight.
    B: Accelerate slightly and turn away from the skid.
    C: Gently turn into the skid and ease your foot off the gas.
    D: Shift into neutral and pump the brakes rapidly.
  answer: C
  explanation: If you begin to skid, the manual advises to gently turn into the skid
    and ease your foot off the gas until you regain control.
- id: 126
  category: penalties_and_points
  question: What happens if you enter a four-way stop intersection while violating
    the speed law?
  choices:
    A: You must yield only to vehicles turning left.
    B: You forfeit any right of way you might have had.
    C: You automatically have the right of way.
    D: You must honk your horn to warn other drivers.
  answer: B
  explanation: The manual states that if you enter an intersection while violating
    the speed law, you forfeit any right of way you might have had.
- id: 127
  category: safe_driving_rules
  question: In which direction does traffic move within a roundabout?
  choices:
    A: Clockwise.
    B: Counterclockwise.
    C: In a figure-eight pattern.
    D: Straight through the center.
  answer: B
  explanation: Traffic in a roundabout moves at slow speeds in a counterclockwise
    direction.
- id: 128
  category: sharing_the_road
  question: What should you do if an emergency vehicle with flashing lights approaches
    while you are driving inside a roundabout?
  choices:
    A: Stop immediately inside the roundabout.
    B: Pull over to the inside island of the roundabout.
    C: Continue to your exit, leave the roundabout, and then pull over to the right.
    D: Speed up to exit the roundabout before the emergency vehicle enters.
  answer: C
  explanation: If you are already in a roundabout when an emergency vehicle approaches,
    continue to your exit, leave the roundabout and then pull over to the right so
    the emergency vehicle can pass.
- id: 129
  category: safe_driving_rules
  question: When approaching a parked emergency vehicle with flashing lights on a
    road with only one lane in each direction, what must you do?
  choices:
    A: Stop and wait for the emergency vehicle to turn off its lights.
    B: Reduce your speed to at least 20 mph below the speed limit.
    C: Maintain your speed but move to the far right edge of the lane.
    D: Honk your horn to alert the emergency workers of your presence.
  answer: B
  explanation: On roads with only one lane in each direction, you must reduce your
    speed to at least 20 mph below the speed limit when approaching a parked emergency
    vehicle.
- id: 130
  category: sharing_the_road
  question: Under which of the following circumstances must a driver yield the right
    of way to a pedestrian?
  choices:
    A: Only when the pedestrian is in a designated school zone.
    B: When a blind pedestrian is carrying a clearly visible white cane or using a
      guide dog.
    C: Only when the pedestrian is crossing at an intersection with a green light.
    D: When the pedestrian is jaywalking outside of a crosswalk.
  answer: B
  explanation: Statutes require a driver to yield to a pedestrian when a blind pedestrian
    is carrying a clearly visible white cane or is accompanied by a guide dog.
- id: 131
  category: driver_responsibility
  question: Approximately how long does it take for a driver to move their foot from
    the accelerator to the brake after deciding to stop?
  choices:
    A: 1/4 second.
    B: 1/2 second.
    C: 3/4 second.
    D: 1 full second.
  answer: C
  explanation: According to the manual's section on braking and stopping, it takes
    about 3/4 second to move your foot from the accelerator to the brake.
- id: 132
  category: defensive_driving
  question: If you lose your bearings while driving in a ground blizzard, what is
    a recommended way to determine your position on the road?
  choices:
    A: Turn on your high beams to see through the blowing snow.
    B: Stop your vehicle immediately and walk outside to check.
    C: Roll down the window and look on the downwind side of the car at the center
      stripe or road edge.
    D: Follow the GPS map on your phone closely.
  answer: C
  explanation: If you lose your bearings in a ground blizzard, the manual advises
    to roll down the window and look on the downwind side of the car to determine
    where you are on the road, by using either the center stripe or the edge of the
    road.
- id: 133
  category: safe_driving_rules
  question: At 55 mph, approximately how long does it take a heavy vehicle with a
    loaded trailer to stop?
  choices:
    A: About 130-140 feet
    B: About 190-200 feet
    C: About 400 feet
    D: About 100 feet
  answer: B
  explanation: According to the manual, a heavy vehicle with a loaded trailer traveling
    at 55 mph will usually take over two-thirds the length of a football field (about
    190-200 feet) to stop.
- id: 134
  category: sharing_the_road
  question: When approaching a stopped school bus with flashing red lights on a divided
    roadway, which vehicles are required to stop?
  choices:
    A: Vehicles traveling in both directions
    B: Only vehicles traveling on the same side of the separation as the bus
    C: Only vehicles traveling in the opposite direction of the bus
    D: No vehicles are required to stop on a divided roadway
  answer: B
  explanation: The manual states that on a divided roadway, only vehicles on the same
    side of the separation as the school bus must stop.
- id: 135
  category: safe_driving_rules
  question: Where is it explicitly stated that you should not change lanes?
  choices:
    A: On a multi-lane highway
    B: Before or while in an intersection
    C: When passing a heavy vehicle
    D: In a business district
  answer: B
  explanation: 'The proper lane changing rules in the manual explicitly state: ''Do
    not change lanes before or while in an intersection.'''
- id: 136
  category: signs_and_signals
  question: At a minimum, how far before an intersection must you signal your intention
    to turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: All drivers must signal at least 100 feet from an intersection. At
    higher speeds, signaling 4 to 5 seconds before turning is better.
- id: 137
  category: signs_and_signals
  question: What is the proper hand and arm signal for a right turn?
  choices:
    A: Left arm extended straight out to the left
    B: Left arm extended down from the elbow
    C: Left arm extended straight up from the elbow
    D: Right arm extended straight out to the right
  answer: C
  explanation: Signals should be given with your left arm. For a right turn, the hand
    and arm are extended straight up from the elbow.
- id: 138
  category: defensive_driving
  question: What is the recommended procedure before you back up your vehicle?
  choices:
    A: Rely solely on your rearview and side mirrors
    B: Honk your horn three times before shifting into reverse
    C: Check behind your vehicle by walking behind it
    D: Accelerate quickly to minimize the time spent backing up
  answer: C
  explanation: The manual advises to 'Check behind your vehicle by walking behind
    it before you back up' and not to depend upon your mirrors.
- id: 139
  category: safe_driving_rules
  question: Under what condition may a driver legally exceed the speed limit by up
    to 10 miles per hour?
  choices:
    A: When driving on an interstate highway
    B: When passing another vehicle that is traveling at less than the legal maximum
      speed
    C: When passing a heavy commercial truck
    D: When driving downhill in a mountainous area
  answer: B
  explanation: A driver may exceed the speed limit by up to 10 miles an hour while
    passing another vehicle that is traveling at less than the legal maximum speed.
- id: 140
  category: safe_driving_rules
  question: When is it permissible to pass another vehicle on the right?
  choices:
    A: When the vehicle ahead is driving below the speed limit on a two-lane road
    B: When you must drive off the paved portion of the roadway to do so
    C: When the vehicle you are overtaking is making a left turn
    D: When you are in a school zone
  answer: C
  explanation: You may pass on the right when the vehicle you are overtaking is making
    a left turn, provided you do not leave the pavement to do so.
- id: 141
  category: sharing_the_road
  question: How much separation space should you maintain between your vehicle and
    a bicyclist when passing them?
  choices:
    A: At least 1 foot
    B: At least 2 feet
    C: At least 3 feet
    D: At least 5 feet
  answer: C
  explanation: When passing a bicyclist, the manual states that when space allows,
    you should maintain at least 3 feet of separation between your vehicle and the
    bicyclist.
- id: 142
  category: sharing_the_road
  question: When passing a large truck, when is it safe to pull back into your original
    lane?
  choices:
    A: As soon as you clear the front bumper of the truck
    B: When you can see both headlights and the entire cab of the truck in your rearview
      mirror
    C: After you have maintained your speed for at least 5 seconds
    D: When the truck driver flashes their high beams
  answer: B
  explanation: Because it takes longer to pass a large vehicle, you should be sure
    you can see both headlights and the entire cab of the truck in your rearview mirror
    before pulling back into your lane.
- id: 143
  category: signs_and_signals
  question: Which of the following outweighs traffic lights or signs at an intersection?
  choices:
    A: A flashing yellow light
    B: A pedestrian waiting on the curb
    C: A police officer's directions
    D: A yield sign
  answer: C
  explanation: You must always stop your vehicle when directed to do so by a police
    officer. A police officer’s directions outweigh traffic lights or signs.
- id: 144
  category: sharing_the_road
  question: What is a common, yet dangerous, misconception motorists have about a
    truck driver's field of vision?
  choices:
    A: They have large blind spots directly behind them
    B: They cannot see passenger vehicles driving right next to their doors
    C: Because they sit higher, they can see everything and react sooner without blind
      spots
    D: They cannot see vehicles tailgating them
  answer: C
  explanation: Many motorists falsely believe that because a truck driver sits twice
    as high, he can see further ahead and react sooner, ignoring the fact that heavy
    vehicles have sizeable blind spots (No-Zones).
- id: 145
  category: defensive_driving
  question: Which of the following is a clue that a parked car might pull out in front
    of you?
  choices:
    A: The vehicle's front wheels are turned straight
    B: Exhaust is coming from the tail pipe
    C: The vehicle's headlights are turned off
    D: The vehicle has a sunshade in the windshield
  answer: B
  explanation: When driving past parked cars, watch for clues such as exhaust coming
    from the tail pipe, brake lights on, a turn signal flashing, white back-up lights
    on, or front wheels turning out.
- id: 146
  category: safe_driving_rules
  question: What must you do when entering a street from a driveway, alley, or parking
    lot?
  choices:
    A: Yield only to vehicles approaching from the left
    B: Stop your vehicle before entering the street
    C: Sound your horn and proceed without stopping
    D: Accelerate quickly to merge with traffic
  answer: B
  explanation: You MUST always stop your vehicle when entering a street from a driveway,
    alley, building, or parking lot.
- id: 147
  category: sharing_the_road
  question: What is a 'right-turn squeeze'?
  choices:
    A: When a passenger vehicle tries to pass a truck on the left.
    B: When a passenger vehicle is in the right-side blind spot of a heavy vehicle
      turning right.
    C: When two trucks attempt to turn right at the same time.
    D: When a vehicle parks too close to a crosswalk at an intersection.
  answer: B
  explanation: According to the manual, a 'right-turn squeeze' occurs when the driver
    of a passenger vehicle finds himself in the blind spot located on the right side
    of a heavy vehicle that is in the process of turning right.
- id: 148
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: B
  explanation: The manual states that it is not legal to park within 15 feet of a
    fire hydrant.
- id: 149
  category: safe_driving_rules
  question: Which way should you turn your steering wheel when parking facing uphill
    where there is a curb?
  choices:
    A: Towards the curb
    B: Away from the curb
    C: Straight ahead
    D: Towards the center line
  answer: B
  explanation: If you park facing uphill where there is a curb, you should set the
    parking brake and turn the wheels away from the curb.
- id: 150
  category: defensive_driving
  question: What is the primary purpose of an acceleration lane on an Interstate entrance
    ramp?
  choices:
    A: To allow you to pass slower vehicles before merging.
    B: To provide a safe place to park in an emergency.
    C: To let you match your speed to that of Interstate traffic.
    D: To force Interstate traffic to yield to your entering vehicle.
  answer: C
  explanation: The entrance ramp usually takes you to an acceleration lane. Its purpose
    is to let you match your speed to that of Interstate traffic.
- id: 151
  category: safe_driving_rules
  question: Under normal conditions, what is the minimum space cushion you should
    leave between you and the vehicle ahead on the Interstate?
  choices:
    A: One second
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: B
  explanation: The manual advises to always leave at least a two seconds space cushion
    between you and the vehicle ahead. This should be doubled or tripled when weather
    is bad or pavement is slick.
- id: 152
  category: defensive_driving
  question: What should you do if you miss your exit on the Interstate?
  choices:
    A: Stop and back up carefully on the right shoulder.
    B: Make a U-turn through the median.
    C: Stop in the right lane and wait for a gap in traffic to reverse.
    D: Go on to the next exit.
  answer: D
  explanation: If you miss your exit, go on to the next exit. Backing up on the Interstate
    is dangerous.
- id: 153
  category: safe_driving_rules
  question: When leaving the Interstate, where should you begin to slow down?
  choices:
    A: One mile before the exit while still on the Interstate.
    B: Only after turning into the deceleration lane.
    C: As soon as you see the exit sign.
    D: Right before you merge into the right lane.
  answer: B
  explanation: When leaving the Interstate, you should NEVER slow on the Interstate.
    You should SLOW after turning into the deceleration lane.
- id: 154
  category: defensive_driving
  question: If you have an emergency breakdown on the Interstate at night, what should
    you do to warn other drivers?
  choices:
    A: Stand in the traffic lane and wave your arms.
    B: Turn on your four-way emergency warning lights and use flares or reflectors.
    C: Keep all your lights off to save your vehicle's battery.
    D: Open the doors on the traffic side of your vehicle.
  answer: B
  explanation: In an emergency breakdown, turn on your four-way emergency warning
    lights. At night, use flares or reflectors. Do not open doors on the traffic side.
- id: 155
  category: signs_and_signals
  question: What does it mean when the word 'ONLY' is used on an overhead lane sign
    with an arrow?
  choices:
    A: You may go in the direction of the arrow or proceed straight.
    B: You must go in the direction the arrow points; there is no other option.
    C: Only high-occupancy vehicles can use that lane.
    D: The lane is reserved only for emergency vehicles.
  answer: B
  explanation: Overhead lane signs tell you what direction you must go. When the word
    'ONLY' is used, you must go in the direction the arrow points; there is no other
    option.
- id: 156
  category: safe_driving_rules
  question: On a multilane road with three or more lanes going in one direction, which
    lane usually has the smoothest flow of traffic?
  choices:
    A: The far left lane
    B: The far right lane
    C: The middle lane or lanes
    D: The shoulder lane
  answer: C
  explanation: When there are three or more lanes going in one direction, the middle
    lane or lanes are usually the smoothest.
- id: 157
  category: signs_and_signals
  question: What do solid white lines on the pavement indicate?
  choices:
    A: Traffic is flowing in opposite directions and passing is permitted.
    B: Traffic is flowing in the same direction and passing or lane changing is hazardous.
    C: Traffic is flowing in opposite directions and passing is hazardous.
    D: Traffic is flowing in the same direction and passing is freely permitted.
  answer: B
  explanation: White lines separate traffic going the same direction. Solid white
    lines indicate that passing or lane changing is hazardous.
- id: 158
  category: signs_and_signals
  question: What type of sign is a railroad crossbuck sign considered to be?
  choices:
    A: A stop sign
    B: A warning sign
    C: A yield sign
    D: A regulatory speed sign
  answer: C
  explanation: 'The manual explicitly states: ''Crossbuck signs are yield signs. You
    are legally required to yield the right of way to trains.'''
- id: 159
  category: defensive_driving
  question: According to the manual, what is the most frequent type of crash on the
    Interstate?
  choices:
    A: Head-on collisions
    B: Sideswipes
    C: Rear-end collisions
    D: Rollovers
  answer: C
  explanation: The manual states that rear-end collisions are the most frequent type
    of crashes on the Interstate, emphasizing the need to maintain a proper space
    cushion.
- id: 160
  category: safe_driving_rules
  question: When leaving a parking space, what is the first step you should take?
  choices:
    A: Yield the right of way to oncoming vehicles.
    B: Dart out into traffic quickly to avoid blocking the lane.
    C: Signal before you start to move.
    D: Check to see if anyone is coming, especially bicyclists or motorcyclists.
  answer: D
  explanation: To leave a parking space, the first step listed is to 'CHECK to see
    if anyone is coming. Be especially watchful for bicyclists or motorcyclists'.
- id: 161
  category: signs_and_signals
  question: How can you tell if there is more than one set of tracks at a railroad
    crossing?
  choices:
    A: A sign below the crossbuck indicates the number of tracks.
    B: The crossing gate will be painted yellow.
    C: There will be two stop lines painted on the road.
    D: The flashing red lights will blink twice as fast.
  answer: A
  explanation: According to the manual, when crossing more than one set of tracks,
    there will be a sign below the crossbuck indicating how many there are.
- id: 162
  category: driver_responsibility
  question: Under what circumstances are you legally required to contact the police
    after a traffic crash?
  choices:
    A: Only if someone is killed.
    B: If there is an injury, death, or property damage amounting to $1,000 or more.
    C: Only if the crash involves a commercial vehicle.
    D: If the property damage is $500 or more.
  answer: B
  explanation: You must contact the police if there is an injury, death or property
    damage amounting to $1,000 or more.
- id: 163
  category: driver_responsibility
  question: If you are involved in a crash and someone is injured, when is it acceptable
    to move the injured person?
  choices:
    A: Immediately, to get them to the side of the road.
    B: Only if they ask you to move them.
    C: Only if there is danger of another crash.
    D: You should never move an injured person under any circumstances.
  answer: C
  explanation: 'The manual states: DO NOT MOVE AN INJURED PERSON unless there is danger
    of another crash.'
- id: 164
  category: driver_responsibility
  question: What must you do after leaving your required information on an unattended
    vehicle you have damaged?
  choices:
    A: Wait by the vehicle until the owner returns.
    B: Contact the nearest law enforcement agency.
    C: Call your insurance company and leave the scene.
    D: Take a photograph of the damage and drive away.
  answer: B
  explanation: If you damage an unattended vehicle and leave your information, the
    manual states you must also contact the nearest law enforcement agency.
- id: 165
  category: vehicle_information
  question: Where can you find the recommended tire pressure (psi) for your vehicle?
  choices:
    A: On the sidewall of the tire itself.
    B: In the vehicle owner's manual or the driver's side door jamb.
    C: On the vehicle's rear license plate.
    D: On the steering wheel column.
  answer: B
  explanation: You should check tire pressure using the recommended psi found in the
    vehicle owner's manual or the driver's side door jamb of the vehicle.
- id: 166
  category: vehicle_information
  question: When using the penny test to check tire wear, how do you know if you have
    a safe amount of tread?
  choices:
    A: The entire penny fits inside the groove.
    B: You can see the top of the Lincoln Memorial.
    C: Any part of Lincoln's head is covered by the tread.
    D: Lincoln's head is completely visible above the tread.
  answer: C
  explanation: When placing Lincoln's head into one of the grooves, if any part of
    Lincoln's head is covered by the tread, you're driving with the safe amount of
    tread.
- id: 167
  category: sharing_the_road
  question: What maneuver by drivers causes a large percentage of car-motorcycle crashes?
  choices:
    A: Tailgating a motorcycle too closely.
    B: Turning right on a red light.
    C: Turning left in front of an oncoming motorcyclist.
    D: Passing a motorcycle on the highway.
  answer: C
  explanation: Drivers turning left in front of an oncoming cyclist cause a large
    percentage of car-cycle crashes because they fail to see the cyclist or judge
    their speed.
- id: 168
  category: sharing_the_road
  question: What is the maximum number of motorcycles that may legally be driven abreast
    (side-by-side) in the same lane?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: No more than two motorcycles may be driven abreast in the same lane
    and must be by consent of both motorcycle drivers.
- id: 169
  category: sharing_the_road
  question: If your vehicle is disabled and you must walk on a road with no sidewalks,
    where should you walk?
  choices:
    A: On the right side of the road with the flow of traffic.
    B: In the center of the road where you are most visible.
    C: On the left side of the road facing traffic.
    D: On whichever side has a wider shoulder.
  answer: C
  explanation: If your vehicle is disabled and you must walk where there are no sidewalks,
    walk on the left side of the road facing traffic.
- id: 170
  category: sharing_the_road
  question: What equipment is legally required on a bicycle used after dark?
  choices:
    A: A front light and rear reflectors.
    B: A horn and a rearview mirror.
    C: Turn signals and brake lights.
    D: A reflective safety vest worn by the rider.
  answer: A
  explanation: Any bicycle used after dark must have a front light and rear reflectors.
- id: 171
  category: signs_and_signals
  question: What does the slow-moving vehicle symbol on the back of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle makes frequent stops.
    C: The vehicle cannot travel faster than 25 miles per hour.
    D: The vehicle is an oversized load.
  answer: C
  explanation: When you see the slow-moving vehicle symbol on the back of a vehicle
    ahead, it means the vehicle cannot travel faster than 25 miles per hour.
- id: 172
  category: sharing_the_road
  question: According to statistics, who causes most fatal crashes involving a heavy
    vehicle (truck) and a passenger vehicle?
  choices:
    A: The driver of the heavy vehicle.
    B: The passenger vehicle.
    C: Poor road conditions.
    D: Mechanical failures in the heavy vehicle.
  answer: B
  explanation: National Highway and Traffic Safety Administration statistics indicate
    most fatal crashes involving a heavy vehicle and one or more other vehicles are
    caused by the passenger vehicle.
- id: 173
  category: safe_driving_rules
  question: Under the Move Over Law, what must you do when approaching a stopped emergency
    vehicle with flashing lights on an interstate highway?
  choices:
    A: Stop immediately in your lane until the vehicle leaves.
    B: Merge into the lane farthest from the vehicle or at least one lane apart.
    C: Honk your horn to alert the emergency workers of your presence.
    D: Accelerate to pass the emergency vehicle as quickly as possible.
  answer: B
  explanation: When driving on an interstate highway... the driver shall merge into
    the lane farthest from the vehicle or at least one (1) lane of traffic apart from
    the vehicle except when otherwise directed by a police officer.
- id: 174
  category: safe_driving_rules
  question: How should you react under the Move Over Law when approaching a stopped
    utility vehicle with flashing lights on a two-lane road with a posted speed limit
    of 55 mph?
  choices:
    A: Maintain your speed but move to the right edge of your lane.
    B: Slow down to 20 mph.
    C: Slow down to 35 mph.
    D: Stop and wait for the utility vehicle to turn off its lights.
  answer: C
  explanation: On a two-lane road with a posted speed limit of 45 mph or greater,
    the driver shall slow to a speed that is 20 mph less than the posted speed limit.
    (55 mph - 20 mph = 35 mph).
- id: 175
  category: sharing_the_road
  question: Why should you never move into the same lane alongside a motorcycle?
  choices:
    A: It is illegal and boxes both of you in.
    B: The motorcycle's exhaust can damage your vehicle's paint.
    C: Motorcyclists are required to ride in the center of the lane at all times.
    D: It causes the motorcycle's turn signals to malfunction.
  answer: A
  explanation: Never move into the same lane alongside a motorcycle... It is not only
    illegal, but it boxes both of you in and does not permit you a way out.
- id: 176
  category: safe_driving_rules
  question: When approaching an emergency vehicle on a two-lane road with a posted
    speed limit of 45 mph or greater, what must you do if you cannot change lanes?
  choices:
    A: Stop immediately until the vehicle leaves.
    B: Slow to a speed that is 20 mph less than the posted speed limit.
    C: Maintain your speed but move to the far right edge of the road.
    D: Slow down to 15 mph regardless of the posted speed limit.
  answer: B
  explanation: The manual states that when driving on a two-lane road with a posted
    speed limit of 45 mph or greater, the driver shall slow to a speed that is 20
    mph less than the posted speed limit when approaching an emergency vehicle.
- id: 177
  category: defensive_driving
  question: During which seasons are vehicle-animal collisions most prevalent in Wyoming?
  choices:
    A: Summer and winter
    B: Spring and summer
    C: Fall and spring
    D: Winter and fall
  answer: C
  explanation: While crashes can occur at any time, the manual notes they are most
    prevalent during the fall and spring, while animals are migrating between their
    summer and winter habitats.
- id: 178
  category: defensive_driving
  question: Why should you be careful about flashing your headlights when you see
    an animal on the road ahead?
  choices:
    A: It will cause the animal to charge your vehicle.
    B: It may temporarily blind oncoming drivers.
    C: It may cause the animal to "freeze" on the road directly ahead.
    D: It is illegal to flash your headlights at wildlife.
  answer: C
  explanation: The manual advises to be careful about flashing your headlights because
    one unintended effect may be to "freeze" the deer or other animal on the road
    directly ahead.
- id: 179
  category: safe_driving_rules
  question: What should you do if a collision with an animal seems inevitable?
  choices:
    A: Swerve suddenly to the left.
    B: Swerve suddenly to the right.
    C: Accelerate to minimize the impact time.
    D: Do not swerve suddenly, but brake as quickly as you safely can.
  answer: D
  explanation: If a collision seems inevitable, the manual states you should not swerve
    suddenly to avoid the animal, as your risk of personal injury may be greater.
    Instead, brake as quickly as you safely can while keeping your vehicle under control.
- id: 180
  category: defensive_driving
  question: In the IPDE method of defensive driving, what does a driver do during
    the "Predict" step?
  choices:
    A: Predict the worst that could happen regarding a critical object.
    B: Predict the exact speed of oncoming traffic.
    C: Predict how long it will take to reach their destination.
    D: Predict the weather conditions for the next hour.
  answer: A
  explanation: According to the IPDE method, when defensive drivers identify a critical
    object, they predict what could happen, specifically predicting the worst.
- id: 181
  category: defensive_driving
  question: According to the IPDE method, what should your driving decisions be based
    on?
  choices:
    A: Determining who has the legal right-of-way.
    B: Proving which driver is right or wrong.
    C: What can be done to prevent a crash.
    D: Reaching your destination as quickly as possible.
  answer: C
  explanation: The manual states that decisions are based on what can be done to prevent
    a crash, and not who is right or who is wrong.
- id: 182
  category: safe_driving_rules
  question: How far ahead should a defensive driver scan the road?
  choices:
    A: 2 to 3 seconds
    B: 5 to 8 seconds
    C: 10 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: The manual states that defensive drivers scan at least 10 to 15 seconds
    ahead.
- id: 183
  category: safe_driving_rules
  question: How far in advance should you give hand or electrical signals before turning?
  choices:
    A: At least one to two seconds
    B: At least four to five seconds
    C: At least ten seconds
    D: Only when other vehicles are visible
  answer: B
  explanation: To communicate with other drivers, you should give hand or electrical
    signals at least four to five seconds before turning.
- id: 184
  category: safe_driving_rules
  question: What is the minimum following distance you should maintain when driving
    a standard car under normal conditions?
  choices:
    A: One second
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: B
  explanation: The manual states that if you are driving a car, you should stay at
    least two seconds back from the vehicle ahead.
- id: 185
  category: safe_driving_rules
  question: How much should you increase your following distance when driving a car
    on ice-covered roads?
  choices:
    A: Double it to four seconds
    B: Triple it to six seconds
    C: Quadruple it to eight seconds
    D: Keep it at two seconds but drive slower
  answer: C
  explanation: The manual advises quadrupling the number of seconds when ice covers
    the road, which means an eight-second following distance for cars.
- id: 186
  category: vehicle_information
  question: Under normal conditions, what is the minimum following distance for a
    tractor-trailer driver?
  choices:
    A: Two seconds
    B: Four seconds
    C: Six seconds
    D: Eight seconds
  answer: C
  explanation: The manual states that bus drivers should stay at least four seconds
    back and tractor-trailer drivers at least six seconds back.
- id: 187
  category: defensive_driving
  question: What is a recommended action to take if another driver is tailgating you?
  choices:
    A: Tap your brakes rapidly to scare them.
    B: Increase the following distance between you and the vehicle in front of you.
    C: Speed up to create more space behind you.
    D: Move to the left lane of a multilane highway.
  answer: B
  explanation: If you are being tailgated, you should provide more time and space
    ahead to react to emergencies by increasing the following distance between you
    and the vehicle in front of you.
- id: 188
  category: sharing_the_road
  question: Which of the following is a recommended way to maintain a space cushion
    to the sides of your vehicle?
  choices:
    A: Drive alongside other vehicles on multi-lane streets to match their speed.
    B: Stay in other drivers' blind spots so they don't change lanes.
    C: Avoid driving next to a bicyclist for prolonged periods of time.
    D: Drive as close to parked vehicles as possible to leave room for oncoming traffic.
  answer: C
  explanation: To keep a space cushion to your sides, the manual recommends avoiding
    driving next to a bicyclist for prolonged periods of time.
- id: 189
  category: defensive_driving
  question: What does the defensive driving technique of "separating risks" involve?
  choices:
    A: Taking multiple risks simultaneously to get past them quickly.
    B: Taking risks one at a time by adjusting your speed to handle hazards separately.
    C: Moving entirely off the road when you see multiple hazards.
    D: Honking your horn until all hazards move out of your way.
  answer: B
  explanation: Separating risks means taking risks one at a time whenever possible,
    such as making a decision to speed up or slow down in order to pass hazards (like
    joggers and an oncoming truck) one at a time.
- id: 190
  category: defensive_driving
  question: What should you do to warn other drivers when you see an animal on or
    near the roadway?
  choices:
    A: Flash your high-beam headlights repeatedly.
    B: Turn on your hazard lights and stop in the lane.
    C: Reduce your speed and tap your brakes.
    D: Swerve into the oncoming lane to block traffic.
  answer: C
  explanation: When you see an animal on or near the roadway, the manual instructs
    you to reduce your speed and tap your brakes to warn other drivers, and sound
    your horn.
- id: 191
  category: defensive_driving
  question: What should you do when you cannot separate risks and must deal with two
    or more at the same time?
  choices:
    A: Speed up to pass both risks quickly.
    B: Compromise by giving the most room to the worst danger.
    C: Stop your vehicle immediately in your lane.
    D: Sound your horn and maintain your lane position.
  answer: B
  explanation: When you cannot separate risks and must deal with two or more at the
    same time, compromise by giving the most room to the worst danger.
- id: 192
  category: safe_driving_rules
  question: According to the manual, when must you use your headlights?
  choices:
    A: From one hour after sunset until one hour before sunrise.
    B: Only when driving on rural highways at night.
    C: From one-half hour after sunset until one-half hour before sunrise.
    D: Whenever you are driving faster than 55 mph.
  answer: C
  explanation: Headlights must be used from one-half hour after sunset until one-half
    hour before sunrise and at any other time when visibility is less than 1,000 feet.
- id: 193
  category: safe_driving_rules
  question: When approaching an oncoming vehicle at night, at what distance must you
    dim your headlights?
  choices:
    A: At least 200 feet
    B: At least 300 feet
    C: At least 400 feet
    D: At least 500 feet
  answer: D
  explanation: You should dim your headlights at least 500 feet (about four to five
    seconds) before meeting an oncoming vehicle.
- id: 194
  category: safe_driving_rules
  question: When you are following another vehicle at night, you must dim your lights
    to their lowest beam within what distance from the rear of the vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: If you are within 300 feet from the rear of a vehicle you are approaching,
    dim your lights to their lowest beam.
- id: 195
  category: safe_driving_rules
  question: Which of the following is true regarding the use of parking lights while
    driving?
  choices:
    A: They should be used at dusk before headlights are needed.
    B: They are recommended when driving in heavy fog.
    C: It is not legal to drive with only parking lights when headlights are required.
    D: They should be used when following another vehicle closely at night.
  answer: C
  explanation: Never use parking lights while driving. It is not legal to drive with
    only parking lights when headlights are required.
- id: 196
  category: safe_driving_rules
  question: What type of headlights should you use when driving in fog?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: When driving in fog, you should use low beam headlights.
- id: 197
  category: defensive_driving
  question: Why should you be especially careful during the first half hour after
    rain begins?
  choices:
    A: Hydroplaning is guaranteed to occur at any speed.
    B: Dust and oil mix with the water and make the roadway slippery.
    C: Your windshield wipers will smear the glass more than usual.
    D: Other drivers are more likely to use their high beams.
  answer: B
  explanation: Be careful during the first half hour after the rain begins because
    dust and oil mix with the water and make the roadway slippery.
- id: 198
  category: safe_driving_rules
  question: What is the recommended following distance for cars driving on ice?
  choices:
    A: Two seconds
    B: Four seconds
    C: Six seconds
    D: Eight seconds
  answer: D
  explanation: You should quadruple the distance on ice, which means an eight-second
    following distance for cars.
- id: 199
  category: safe_driving_rules
  question: Which of the following should you NOT do when driving on snow or ice?
  choices:
    A: Use your cruise control.
    B: Equip your car with snow tires or chains.
    C: Watch for ice on bridges and in shady areas.
    D: Slow gradually and smoothly before stopping.
  answer: A
  explanation: 'When driving on snow or ice, the manual explicitly states: DO NOT
    use cruise control.'
- id: 200
  category: safe_driving_rules
  question: If you are stranded in a ditch during a blizzard, what should you do to
    stay safe?
  choices:
    A: Leave your car immediately to find help.
    B: Keep all windows tightly closed to trap heat.
    C: Run the engine continuously to stay warm.
    D: Run the engine and heater sparingly with a window open for ventilation.
  answer: D
  explanation: If stranded in a blizzard, run the engine and heater sparingly, and
    only with a window open for ventilation to avoid carbon monoxide poisoning.
- id: 201
  category: defensive_driving
  question: If a collision is inevitable and you must turn away to avoid hitting a
    vehicle head-on, what is the general rule of thumb?
  choices:
    A: Turn left
    B: Turn right
    C: Lock your brakes
    D: Accelerate as fast as possible
  answer: B
  explanation: If it is not possible to avoid a collision, make sure you do not hit
    the other vehicle head-on. The rule of thumb is to turn right.
- id: 202
  category: vehicle_information
  question: What should you do if your gas pedal sticks while driving?
  choices:
    A: Turn off the ignition immediately before doing anything else.
    B: Shift to neutral or push in the clutch.
    C: Apply the parking brake as hard as you can.
    D: Pump the gas pedal rapidly.
  answer: B
  explanation: If your gas pedal sticks, try to free the pedal with your foot. If
    this does not work, push in the clutch or shift to neutral.
- id: 203
  category: defensive_driving
  question: What is an important rule to remember if your vehicle begins to skid?
  choices:
    A: Slam on the brakes immediately.
    B: Steer sharply in the opposite direction of the skid.
    C: Do not apply the brakes.
    D: Accelerate to regain traction.
  answer: C
  explanation: The main thing to remember in a skid is to keep calm and not overreact.
    You should stop doing whatever started the skid and DO NOT APPLY THE BRAKES!
- id: 204
  category: vehicle_information
  question: How should you brake in an emergency situation if your vehicle is equipped
    with Anti-lock Brakes (ABS)?
  choices:
    A: Pump the brake pedal rapidly.
    B: Press down hard on the brake pedal and hold it.
    C: Lightly tap the brake pedal to avoid a skid.
    D: Apply the parking brake instead of the foot brake.
  answer: B
  explanation: In an emergency situation, ABS pumps the brakes for the driver. All
    drivers need to do is press down hard on the brake pedal, hold it and steer out
    of danger.
- id: 205
  category: vehicle_information
  question: What should you do if you need to brake in an emergency and your vehicle
    is equipped with an ABS braking system?
  choices:
    A: Pump the brakes rapidly to prevent skidding.
    B: Press down hard on the brake pedal, hold it, and steer out of danger.
    C: Remove steady pressure from the brake pedal to engage the system.
    D: Apply the parking brake immediately.
  answer: B
  explanation: For vehicles with ABS, all drivers need to do is press down hard on
    the brake pedal, hold it and steer out of danger. Pumping the brakes will disengage
    or turn off the ABS system.
- id: 206
  category: safe_driving_rules
  question: If your vehicle's brakes fail while driving, which of the following is
    a recommended action?
  choices:
    A: Shift to a higher gear to gain momentum.
    B: Turn the ignition key to the lock position.
    C: Pump the brake pedal rapidly.
    D: Drive the car to the nearest garage for repairs.
  answer: C
  explanation: If your brakes fail, you should pump the brake pedal rapidly, use the
    parking brake, shift to a lower gear, and look for a place to slow and stop off
    the roadway. You should not try to drive the car to a garage.
- id: 207
  category: defensive_driving
  question: What is the correct response if you experience a tire blowout while driving?
  choices:
    A: Hit the brakes hard immediately.
    B: Ease your foot off the gas pedal but do not hit the brakes.
    C: Turn the steering wheel sharply to the right.
    D: Accelerate slightly to maintain control of the vehicle.
  answer: B
  explanation: If you have a tire blowout, you should hold the steering wheel tightly,
    keep the car going straight, and ease your foot off the gas pedal but do not hit
    the brakes until the car is under control.
- id: 208
  category: defensive_driving
  question: If an oncoming vehicle suddenly appears in your lane of travel and there
    is immediate danger of a collision, what should you do?
  choices:
    A: Steer off the road to the left.
    B: Steer off the road to the right.
    C: Stop immediately in your lane.
    D: Speed up to pass the vehicle quickly.
  answer: B
  explanation: If an oncoming or stopped vehicle should suddenly appear in your lane
    of travel and there is immediate danger of a collision, STEER OFF THE ROAD TO
    THE RIGHT.
- id: 209
  category: vehicle_information
  question: Why should you never turn your ignition key to the lock position while
    the vehicle is in motion?
  choices:
    A: It will drain the vehicle's battery.
    B: It will cause the steering to lock and result in loss of control.
    C: It will permanently damage the transmission.
    D: It will engage the anti-lock braking system.
  answer: B
  explanation: Never turn your ignition key to the lock position while the vehicle
    is in motion. That will cause the steering to lock and, quite possibly, loss of
    control of the vehicle.
- id: 210
  category: defensive_driving
  question: If your vehicle runs off the road, what is the proper way to return to
    the pavement?
  choices:
    A: Brake hard and turn the wheel sharply immediately.
    B: Accelerate to get back on the road quickly.
    C: Stay on the shoulder, slow gradually, check traffic, and turn sharply onto
      the pavement.
    D: Turn the steering wheel gradually toward the pavement while maintaining speed.
  answer: C
  explanation: If you run off the road, you should stay on the shoulder, ease off
    the accelerator, brake gently, check traffic, and then turn sharply onto the pavement.
- id: 211
  category: safe_driving_rules
  question: How should you test and dry your brakes after driving through deep water?
  choices:
    A: Brake gently several times until they are dry and work properly.
    B: Drive at a high speed to air-dry the brake pads.
    C: Pump the brakes rapidly for at least two minutes.
    D: Apply the parking brake while accelerating.
  answer: A
  explanation: You should always test your brakes after driving through deep water.
    Brake gently several times until your brakes are dry and work properly.
- id: 212
  category: safe_driving_rules
  question: If your vehicle breaks down on the Interstate, which of the following
    should you NOT do?
  choices:
    A: Turn on your emergency four-way flashers.
    B: Tie a white cloth to an antenna or door handle.
    C: Get out of the side of the vehicle away from traffic.
    D: Walk along the Interstate to find help.
  answer: D
  explanation: If your vehicle breaks down, you should turn on flashers, get out away
    from traffic, tie a white cloth to the antenna, and DO NOT walk for help if you
    are on the Interstate.
- id: 213
  category: alcohol_drugs_health
  question: Which of the following is a sign of carbon monoxide poisoning?
  choices:
    A: Ringing in the ears
    B: Sudden hunger
    C: Rapid heartbeat
    D: Blurred vision
  answer: A
  explanation: Signs of carbon monoxide poisoning are weariness, yawning, dizziness,
    nausea, headache and ringing in the ears.
- id: 214
  category: safe_driving_rules
  question: When is it safe to pass another vehicle at a highway-rail intersection?
  choices:
    A: When there are multiple tracks.
    B: When the crossing gates are fully raised.
    C: When you are driving a smaller passenger vehicle.
    D: It is never safe to pass another vehicle at a highway-rail intersection.
  answer: D
  explanation: 'The manual explicitly states: ''NEVER pass another vehicle at a highway-rail
    intersection.'''
- id: 215
  category: sharing_the_road
  question: Why is it dangerous to cut back in front of a heavy truck after passing
    it at high speed near a construction zone?
  choices:
    A: The truck driver will not be able to see your vehicle's turn signals.
    B: The truck may rear-end your vehicle because it lacks enough braking distance.
    C: The truck will be forced to accelerate to maintain traffic flow.
    D: The construction workers will be distracted by the maneuver.
  answer: B
  explanation: If you cut back in front of a truck so you won't be trapped behind
    it, the truck driver is forced to use emergency braking. If there is not enough
    braking distance, the truck will rear end your vehicle.
- id: 216
  category: sharing_the_road
  question: According to the manual, which of the following groups are considered
    pedestrians?
  choices:
    A: Only people walking or jogging.
    B: Walkers, joggers, skaters, and people using wheelchairs.
    C: Anyone operating a non-motorized bicycle.
    D: Only individuals crossing at marked crosswalks.
  answer: B
  explanation: Pedestrians are people who use and cross public roadways and paths
    by means other than motor vehicles and bicycles. This includes, but is not limited
    to, walkers, joggers, skaters and people using wheelchairs.
- id: 217
  category: defensive_driving
  question: What does the manual suggest may be the safest action if an animal presents
    a hazard on the road?
  choices:
    A: Swerving sharply to avoid the animal at all costs.
    B: Hitting the animal to avoid losing control of the vehicle.
    C: Slamming on the brakes and stopping in the middle of the road.
    D: Honking your horn until the animal moves.
  answer: B
  explanation: Regretfully, the safest thing for you and other drivers that may be
    near you, may be hitting the animal. Concentrate on keeping control of your vehicle
    before, during, and after the collision.
- id: 218
  category: alcohol_drugs_health
  question: How do deep emotions like grief, rage, or terror affect a person's ability
    to drive?
  choices:
    A: They increase a driver's reaction time and alertness.
    B: They help drivers respond to situations in a more reasonable manner.
    C: They overcome a person's power to think clearly and make sound decisions.
    D: They only affect driving if the driver is also fatigued.
  answer: C
  explanation: Deep emotions can overcome a person’s power to think clearly. The ability
    to identify critical objects and make sound decisions is lost.
- id: 219
  category: safe_driving_rules
  question: How should drivers with poor side vision compensate while driving?
  choices:
    A: By relying entirely on their rearview mirrors.
    B: By looking to the sides by moving their head as well as their eyes.
    C: By driving 10 to 15 mph slower than other traffic.
    D: By honking their horn before changing lanes.
  answer: B
  explanation: Drivers with poor side vision must look to the sides by moving their
    head as well as their eyes. They must be especially careful to look back over
    their shoulder when changing lanes.
- id: 220
  category: defensive_driving
  question: If your eyes do not adjust quickly after passing glaring bright lights,
    what is a helpful technique?
  choices:
    A: Looking to the right side of the road, away from the glare.
    B: Staring directly at the oncoming headlights.
    C: Turning on your interior dome light.
    D: Closing one eye until the vehicle passes.
  answer: A
  explanation: Persons whose eyes do not adjust quickly after passing glaring bright
    lights have a very serious problem. Looking to the right side of the road, away
    from the glare, can help.
- id: 221
  category: driver_responsibility
  question: According to the National Highway Traffic Safety Administration, what
    is true about using hands-free cell phones while driving?
  choices:
    A: They are completely safe to use while driving.
    B: They provide little safety benefit over hand-held phones.
    C: They reduce the risk of crashes by 50%.
    D: They are only legal for drivers over the age of 21.
  answer: B
  explanation: Using hands-free cell phones provides little safety benefit over hand-held
    phones, according to the National Highway Traffic Safety Administration, because
    the actual process of conversing is among the greatest driver distractions.
- id: 222
  category: penalties_and_points
  question: What is Wyoming's law regarding text messaging while driving?
  choices:
    A: It is legal as long as you use a hands-free device.
    B: It is legal only when driving under 30 mph.
    C: It prohibits reading or sending a text message while operating a vehicle.
    D: It is allowed only for emancipated minors.
  answer: C
  explanation: Wyoming law prohibits reading or sending a text message from a cell
    phone or other device while operating a vehicle.
- id: 223
  category: safe_driving_rules
  question: If you absolutely must dial a cell phone while driving on a road where
    it is allowed, what is the recommended procedure?
  choices:
    A: Hold the phone near the steering wheel so you can see the road and the keypad
      simultaneously.
    B: Dial a few numbers, look back at the highway and mirrors, and then dial the
      last numbers.
    C: Ask a passenger to hold the steering wheel while you dial.
    D: Pull into the left lane so you have more room to maneuver while dialing.
  answer: B
  explanation: If you must dial while driving on a road on which cell phone calls
    are allowed, dial a few numbers, look back at the highway and in your mirrors
    for any developing safety problems, and then dial the last numbers.
- id: 224
  category: sharing_the_road
  question: How are bicycles legally classified in Wyoming?
  choices:
    A: As pedestrians.
    B: As motorized vehicles.
    C: As vehicles that can be ridden on all public roads.
    D: As recreational equipment restricted to sidewalks.
  answer: C
  explanation: Legally classified as vehicles, bicycles can be ridden on all public
    roads in Wyoming.
- id: 225
  category: defensive_driving
  question: What is a 'blind spot'?
  choices:
    A: An area of the road with no streetlights.
    B: The area near the right and left rear corners of the vehicle which cannot be
      seen through rearview mirrors.
    C: A medical condition that prevents a driver from driving at night.
    D: The space directly in front of a large commercial truck.
  answer: B
  explanation: A blind spot is the area near the right and left rear corners of the
    vehicle which cannot be seen through rearview mirrors. The driver must turn his/her
    head to view these areas.
- id: 226
  category: safe_driving_rules
  question: If there are no crosswalk markings on the street, where is a crosswalk
    considered to be?
  choices:
    A: There is no crosswalk if there are no markings.
    B: Anywhere a pedestrian chooses to cross.
    C: Where imaginary lines would connect the sidewalks on each side of the street
      or highway.
    D: Exactly 10 feet from the intersection.
  answer: C
  explanation: If there are no markings, a crosswalk is considered to be where imaginary
    lines would connect the sidewalks on each side of the street or highway.
- id: 227
  category: license_system
  question: Who qualifies as an 'Emancipated Minor' according to the Wyoming manual?
  choices:
    A: Any person under 18 who has a driver's license.
    B: A person at least 17 years of age who is or was married, in the military, or
      emancipated by the district court.
    C: A person under 16 who drives to and from school.
    D: Any immigrant who is not a citizen of the United States.
  answer: B
  explanation: An emancipated minor is a person at least 17 years of age who is or
    was married, is in the military service of the United States, or who has been
    emancipated by the district court.
- id: 228
  category: safe_driving_rules
  question: What does the term 'hydroplaning' refer to?
  choices:
    A: When a vehicle's brakes fail due to excessive moisture.
    B: When a vehicle's tires ride on a thin film of water instead of the road.
    C: When a driver loses consciousness due to dehydration.
    D: When a vehicle is submerged in a body of water.
  answer: B
  explanation: Hydroplaning is when a vehicle's tires ride on a thin film of water
    instead of the road.
- id: 229
  category: safe_driving_rules
  question: What is the legal rule regarding the 'median' on a highway?
  choices:
    A: It is legal to ride over it only in an emergency.
    B: It is legal to cross it if you miss your exit.
    C: It is not legal to ride over, across or on the median.
    D: It is reserved for authorized emergency vehicles only.
  answer: C
  explanation: A median is a barrier separating two roadways. It is not legal to ride
    over, across or on the median.
- id: 230
  category: vehicle_information
  question: What is the maximum speed a moped is capable of propelling the vehicle
    on a level road surface?
  choices:
    A: 20 miles per hour
    B: 30 miles per hour
    C: 40 miles per hour
    D: 50 miles per hour
  answer: B
  explanation: A moped has a motor capable of propelling the vehicle at a maximum
    speed of no more than 30 miles per hour on a level road surface.
- id: 231
  category: defensive_driving
  question: 'Drivers with poor distance judgment must compensate by:'
  choices:
    A: Allowing more following distance to predict what is happening 10 to 15 seconds
      ahead.
    B: Driving 10 to 15 mph slower than other traffic.
    C: Relying on their passengers to tell them when to pass.
    D: Looking to the right side of the road.
  answer: A
  explanation: Drivers with poor distance judgment must allow more following distance
    to compensate for their inability to accurately predict what’s happening 10 to
    15 seconds ahead of them.
- id: 232
  category: vehicle_information
  question: For the purpose of registration and titling, which of the following is
    included in the definition of a 'motorcycle'?
  choices:
    A: Mopeds
    B: Off-road three-wheel recreational vehicles
    C: Bicycles powered solely by human power
    D: Motorized bicycles and scooters
  answer: D
  explanation: For the purpose of registration and titling, 'motorcycle' includes
    motorized bicycles, scooters and recreational vehicles primarily designed for
    off-road use... but excludes mopeds and off-road three-wheel recreational vehicles.
- id: 233
  category: vehicle_information
  question: Which of the following is true regarding multipurpose vehicles?
  choices:
    A: They may be operated on interstate highways without restriction.
    B: They are not subject to slow-moving vehicle requirements.
    C: They may NOT be operated on interstate highways.
    D: They require a special 'M' endorsement to drive.
  answer: C
  explanation: According to the manual, a multipurpose vehicle must be registered
    and plated for streets and highways, but may NOT be operated on interstate highways
    and is subject to slow-moving vehicle requirements.
- id: 234
  category: sharing_the_road
  question: What is a 'No-Zone'?
  choices:
    A: A designated area where parking is strictly prohibited.
    B: An area on either side or directly behind a heavy vehicle where another vehicle
      is not visible to the driver.
    C: A school zone where the speed limit is strictly enforced.
    D: A construction zone where passing is illegal.
  answer: B
  explanation: The manual defines a No-Zone as an area on either side or directly
    behind a heavy vehicle in which another vehicle is not visible to the driver.
- id: 235
  category: license_system
  question: Under Wyoming law, which of the following automatically qualifies a person
    as a resident?
  choices:
    A: Visiting the state for more than 30 days.
    B: Holding a valid Wyoming resident hunting or fishing license.
    C: Renting a hotel room for a weekend vacation.
    D: Driving through the state on an interstate highway.
  answer: B
  explanation: A person is considered a resident if they hold a valid Wyoming resident
    hunting or fishing license, among other criteria such as being registered to vote
    or remaining in the jurisdiction for 120 days or more.
- id: 236
  category: penalties_and_points
  question: What is the definition of a license suspension?
  choices:
    A: The permanent cancellation of a driver's license.
    B: The termination of a person's privilege to drive.
    C: The temporary removal of a person's privilege to drive.
    D: A fee required to restore driving privileges.
  answer: C
  explanation: Suspension is defined as the TEMPORARY REMOVAL of a person's privilege
    to drive, whereas revocation is the termination of that privilege.
- id: 237
  category: safe_driving_rules
  question: What components make up a vehicle's total stopping distance?
  choices:
    A: Only the distance traveled after the brakes are applied.
    B: The distance traveled while deciding to stop, reacting, and braking.
    C: The distance traveled while reacting and braking only.
    D: The space cushion maintained between two vehicles.
  answer: B
  explanation: Total stopping distance includes the complete distance traveled while
    deciding to stop, then reacting, and finally after brakes are then applied.
- id: 238
  category: signs_and_signals
  question: What does a pentagon-shaped sign indicate?
  choices:
    A: A railroad crossing ahead.
    B: A school zone ahead or a school crossing.
    C: The beginning of a no-passing zone.
    D: A stop sign.
  answer: B
  explanation: A pentagon sign warns of a school zone ahead or marks a school crossing.
- id: 239
  category: safe_driving_rules
  question: What is the absolute speed limit in a school zone?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The manual states that the absolute speed limit in a school zone is
    20 mph.
- id: 240
  category: signs_and_signals
  question: Where are pennant-shaped signs located?
  choices:
    A: At the beginning of a no-passing zone.
    B: At a railroad crossing.
    C: In construction zones.
    D: At a four-way stop.
  answer: A
  explanation: Pennant-shaped signs are located at the beginning of a no-passing zone.
- id: 241
  category: signs_and_signals
  question: What colors are used for construction and maintenance warning signs?
  choices:
    A: Yellow background with black lettering.
    B: White background with black lettering.
    C: Orange background with black lettering.
    D: Red background with white lettering.
  answer: C
  explanation: Construction signs have black lettering on an orange background to
    warn motorists of temporarily dangerous or unusual conditions.
- id: 242
  category: signs_and_signals
  question: When are you permitted to turn right at a solid RED traffic light?
  choices:
    A: At any time without stopping, as long as the way is clear.
    B: Only when a green arrow is also illuminated.
    C: You may never turn right on a red light.
    D: After stopping and yielding to persons and other vehicles, unless a sign prohibits
      it.
  answer: D
  explanation: You can turn right at a RED light unless there is a sign that prohibits
    the turn, but you may do so only after STOPPING AND YIELDING to persons and other
    vehicles.
- id: 243
  category: signs_and_signals
  question: What must you do when approaching a flashing red traffic light?
  choices:
    A: Slow down and proceed with caution.
    B: Come to a complete stop before entering the intersection.
    C: Yield to traffic on the right but do not stop.
    D: Speed up to clear the intersection quickly.
  answer: B
  explanation: A flashing red light has the same meaning as a 'STOP' sign; you must
    come to a complete stop before entering the intersection.
- id: 244
  category: signs_and_signals
  question: What is the proper response when a traffic light turns solid amber (yellow)?
  choices:
    A: Accelerate to get through the intersection before it turns red.
    B: Stop immediately, even if you are already in the intersection.
    C: If possible, you MUST stop before entering the intersection.
    D: Honk your horn and proceed without stopping.
  answer: C
  explanation: At an amber light, if possible, you MUST stop before entering the intersection.
    If you cannot stop safely, you should carefully go through the intersection.
- id: 245
  category: safe_driving_rules
  question: If a minor is operating or riding on an off-road recreational vehicle
    crossing a main traveled roadway, what is required?
  choices:
    A: They must be accompanied by an adult pedestrian.
    B: They must operate the vehicle at night only.
    C: They must wear a helmet in accordance with Wyoming helmet laws.
    D: They must have a Class A commercial driver's license.
  answer: C
  explanation: If the operator is a minor, or if a minor is a rider on an off-road
    recreational vehicle, they shall be operated in accordance with all Wyoming helmet
    laws.
- id: 246
  category: vehicle_information
  question: What is the maximum allowed width for a pedestrian vehicle designed for
    persons with a physical disability?
  choices:
    A: 36 inches
    B: 48 inches
    C: 50 inches
    D: 60 inches
  answer: B
  explanation: According to the manual, in no case shall a pedestrian vehicle exceed
    48 inches in width.
- id: 247
  category: penalties_and_points
  question: Which of the following is considered a moving violation?
  choices:
    A: A parking ticket received while the vehicle is unoccupied.
    B: Driving with an expired vehicle registration.
    C: A conviction for driving in violation of the restriction for corrective lenses
      while the vehicle is in motion.
    D: Failing to pay a reinstatement fee.
  answer: C
  explanation: A moving violation is an act of control or lack of control while the
    vehicle is in motion that results in a conviction, including a conviction for
    driving in violation of the restriction for corrective lenses.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 248
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 249
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 250
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 251
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 252
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 253
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 254
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 255
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 256
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 257
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 258
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 259
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 260
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 261
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 262
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 263
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 264
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 265
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 266
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 267
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 268
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 269
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 270
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 271
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 272
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 273
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 274
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 275
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 276
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 277
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 278
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 279
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 280
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 281
