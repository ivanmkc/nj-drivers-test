- id: 221
  category: signs_and_signals
  question: In Wyoming, what is the unposted speed limit in an 'urban district'?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: According to Wyoming Statute 31-5-301, the speed limit in any urban
    district is 30 mph unless otherwise posted.
- id: 222
  category: signs_and_signals
  question: 'In Wyoming, fines for speeding are doubled when the violation occurs
    in:'
  choices:
    A: A residential area at night
    B: A school zone during school hours
    C: A designated construction zone with workers present
    D: A mountain pass during a snowstorm
  answer: C
  explanation: Wyoming law dictates that fines for speeding and other traffic violations
    are doubled in construction zones when workers are present and signs are posted.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
