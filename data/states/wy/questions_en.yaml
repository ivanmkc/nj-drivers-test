metadata:
  source: 2025 Wyoming Driver's Manual
  total_questions: 256
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Wyoming, what is the minimum age an individual must reach to apply
    for a learner's permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: B
  explanation: According to the Wyoming Driver's Manual, an applicant must be at least
    15 years old to apply for a learner's permit.
- id: 2
  category: license_system
  question: Under Wyoming's GDL laws, an Intermediate Permit holder is restricted
    from driving between what hours?
  choices:
    A: 10:00 PM and 4:00 AM
    B: 11:00 PM and 5:00 AM
    C: Midnight and 6:00 AM
    D: 9:00 PM and 5:00 AM
  answer: B
  explanation: Wyoming law restricts Intermediate Permit holders from driving between
    11:00 PM and 5:00 AM, unless for work, school, or a medical emergency.
- id: 3
  category: license_system
  question: How many passengers under the age of 18 (who are not immediate family
    members) may an Intermediate Permit holder have in the vehicle?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Wyoming GDL regulations state that Intermediate Permit holders may
    not transport more than one passenger under the age of 18 who is not an immediate
    family member.
- id: 4
  category: license_system
  question: If you move to a new residence within Wyoming, how many days do you have
    to notify the Driver Services Program of your change of address?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: Wyoming law requires drivers to notify Driver Services of a change
    of address or name within 10 days.
- id: 5
  category: license_system
  question: 'To meet the vision requirements for a Wyoming driver''s license, your
    visual acuity must be at least:'
  choices:
    A: 20/20 in both eyes
    B: 20/40 in at least one eye
    C: 20/50 in both eyes
    D: 20/30 in the dominant eye
  answer: B
  explanation: To qualify for a Wyoming driver's license, an applicant must have at
    least 20/40 vision in at least one eye, with or without corrective lenses.
- id: 6
  category: license_system
  question: At what age can a Wyoming resident apply for a full, unrestricted driver's
    license if they have NOT completed an approved driver education course?
  choices:
    A: 16 years old
    B: 16 and a half years old
    C: 17 years old
    D: 18 years old
  answer: C
  explanation: In Wyoming, if you have not completed a driver education course, you
    must be at least 17 years old to receive a full, unrestricted license.
- id: 7
  category: license_system
  question: Wyoming may issue a 'Restricted Class RC or RM' license to individuals
    as young as 14 for which of the following reasons?
  choices:
    A: To drive to a part-time job only
    B: Extreme inconvenience or hardship (e.g., living 5+ miles from school)
    C: The applicant has completed a high school racing program
    D: There are no other licensed drivers in the household
  answer: B
  explanation: Wyoming offers a restricted license for 14 and 15-year-olds who can
    prove extreme inconvenience, such as living more than five miles from school or
    having a medical necessity.
- id: 8
  category: license_system
  question: A Wyoming driver's license is typically valid for how many years for individuals
    between the ages of 21 and 64?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: D
  explanation: Standard Wyoming driver's licenses issued to adults are valid for a
    period of 10 years.
- id: 9
  category: license_system
  question: How many moving violation convictions within a 12-month period will result
    in a mandatory suspension of your Wyoming driver's license?
  choices:
    A: 2 violations
    B: 3 violations
    C: 4 violations
    D: 5 violations
  answer: C
  explanation: Under Wyoming law, if you are convicted of 4 moving violations within
    any 12-month period, your driving privileges will be suspended for 90 days.
- id: 10
  category: license_system
  question: When driving with a Wyoming learner's permit, the supervising driver must
    be at least how old?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: The age of the permit holder's legal guardian
  answer: A
  explanation: A learner's permit holder must be accompanied by a licensed driver
    who is at least 18 years of age and occupies the seat beside the driver.
- id: 11
  category: license_system
  question: What is the legal blood alcohol concentration (BAC) limit for a driver
    under the age of 21 in Wyoming?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Wyoming has a 'zero tolerance' policy for underage drinking and driving;
    the legal BAC limit for drivers under 21 is 0.02%.
- id: 12
  category: license_system
  question: To apply for a Wyoming driver's license, how many documents proving Wyoming
    residency must you provide?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have a valid SSN
  answer: B
  explanation: Applicants for a Wyoming driver's license or ID card must provide two
    documents to prove their current Wyoming residential address.
- id: 13
  category: license_system
  question: In Wyoming, your driving privilege may be suspended if you are found to
    be in default on which of the following?
  choices:
    A: Student loans
    B: Credit card debt
    C: Court-ordered child support
    D: Property taxes
  answer: C
  explanation: Wyoming law allows for the suspension of a driver's license if the
    individual is in arrears on court-ordered child support payments.
- id: 14
  category: license_system
  question: What is the minimum age to apply for a Commercial Driver's License (CDL)
    in Wyoming for intrastate (within Wyoming only) commerce?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 25 years old
  answer: B
  explanation: In Wyoming, you must be at least 18 years old to apply for a CDL for
    intrastate use. You must be 21 to drive interstate (across state lines).
- id: 15
  category: license_system
  question: If you are under 18 and applying for a permit or license in Wyoming, who
    must sign your application?
  choices:
    A: Only the applicant
    B: A school principal
    C: A parent or legal guardian
    D: Any licensed driver over 21
  answer: C
  explanation: For any applicant under the age of 18, a parent or legal guardian must
    sign the application form to accept financial responsibility.
- id: 16
  category: license_system
  question: After becoming a resident of Wyoming, how long do you have to apply for
    a Wyoming driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 120 days
    D: One year
  answer: D
  explanation: According to the Wyoming Driver's Manual, new residents must apply
    for a Wyoming driver's license within one year of becoming a resident.
- id: 17
  category: license_system
  question: In Wyoming, what are the minimum liability insurance coverage requirements
    for a single vehicle?
  choices:
    A: $15,000/$30,000/$10,000
    B: $25,000/$50,000/$20,000
    C: $50,000/$100,000/$25,000
    D: $20,000/$40,000/$15,000
  answer: B
  explanation: Wyoming law requires minimum liability coverage of $25,000 for bodily
    injury to one person, $50,000 for bodily injury to two or more persons, and $20,000
    for property damage.
- id: 18
  category: license_system
  question: Before applying for an Intermediate Permit, a Wyoming driver must complete
    how many hours of supervised driving practice?
  choices:
    A: 30 hours (5 at night)
    B: 40 hours (10 at night)
    C: 50 hours (10 at night)
    D: 60 hours (15 at night)
  answer: C
  explanation: Wyoming GDL requirements state that a permit holder must complete 50
    hours of behind-the-wheel driving, including 10 hours of night driving, certified
    by a parent or guardian.
- id: 19
  category: license_system
  question: 'If you change your legal name, you must notify the Wyoming Driver Services
    Program and apply for a new license within:'
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: Wyoming law requires that you notify Driver Services within 10 days
    of any name or address change.
- id: 20
  category: license_system
  question: A Wyoming 'Probationary License' is typically issued to drivers who have
    had their driving privileges suspended for which of the following reasons?
  choices:
    A: Reckless driving
    B: A first-time DUI conviction
    C: Being a habitual violator
    D: Failure to pay child support
  answer: B
  explanation: A Probationary License may be issued to a person whose license is suspended
    for a first-time DUI or for points, allowing them to drive for work, education,
    or health purposes.
- id: 21
  category: license_system
  question: Under Wyoming law, what happens if a parent or legal guardian who signed
    a minor's license application decides to withdraw their signature?
  choices:
    A: The minor is fined $100
    B: The minor's license is cancelled
    C: The minor's license is downgraded to a permit
    D: Nothing happens until the license expires
  answer: B
  explanation: If the person who signed the application for a minor's license requests
    that the license be cancelled, the Wyoming DOT will cancel the license.
- id: 22
  category: license_system
  question: In Wyoming, for how long must an individual hold a Learner's Permit before
    they are eligible to apply for an Intermediate Permit?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Under the Wyoming GDL system, a driver must hold a Learner's Permit
    for at least 6 months before moving to the Intermediate stage.
- id: 23
  category: license_system
  question: Wyoming law requires that male applicants between the ages of 18 and 25
    be registered with the Selective Service System. How is this handled during the
    licensing process?
  choices:
    A: Applicants must provide a registration card
    B: Applicants must register online before arriving
    C: Applying for a license automatically registers the applicant
    D: It is optional and does not affect the license
  answer: C
  explanation: By law, applying for a Wyoming driver's license or ID card serves as
    consent for registration with the Selective Service System for males aged 18 to
    25.
- id: 24
  category: license_system
  question: How often are Wyoming residents eligible to renew their driver's license
    by mail?
  choices:
    A: Every renewal cycle
    B: Every other renewal cycle (once every 8 years)
    C: Only if they are over age 65
    D: Only if they are active duty military
  answer: B
  explanation: Wyoming allows renewal by mail once every 8 years, meaning you must
    appear in person every other renewal cycle to update your photo and vision screening.
- id: 25
  category: license_system
  question: What is the standard fee to reinstate a Wyoming driver's license after
    it has been suspended?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: B
  explanation: The standard reinstatement fee for a suspended Wyoming driver's license
    is $50.
- id: 26
  category: license_system
  question: A Wyoming 'Class C' driver's license authorizes the holder to operate
    which of the following?
  choices:
    A: Any combination of vehicles over 26,001 lbs
    B: Motorcycles only
    C: Single vehicles with a GVWR of less than 26,001 lbs
    D: Commercial vehicles carrying hazardous materials
  answer: C
  explanation: A Class C license is the standard non-commercial license for single
    vehicles with a Gross Vehicle Weight Rating (GVWR) of less than 26,001 lbs.
- id: 27
  category: license_system
  question: 'When applying for or renewing a Wyoming driver''s license, you may also
    register to vote if you are at least:'
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: C
  explanation: Under the 'Motor Voter' law, Wyoming residents who are at least 18
    years old can register to vote at the Driver Services office while applying for
    a license.
- id: 28
  category: license_system
  question: If you lose your Wyoming driver's license, what is the fee for a replacement
    (duplicate) license?
  choices:
    A: $10
    B: $20
    C: $30
    D: $40
  answer: B
  explanation: The fee for a duplicate (replacement) Wyoming driver's license is $20.
- id: 29
  category: license_system
  question: If you fail the Wyoming driving skills test, how long must you wait before
    you are eligible to retake the test?
  choices:
    A: 24 hours
    B: 48 hours
    C: One week
    D: 30 days
  answer: A
  explanation: In Wyoming, if you fail the driving skills test, you must wait at least
    24 hours before you can attempt the test again.
- id: 30
  category: license_system
  question: Which of the following is a requirement for a Wyoming resident to have
    the 'Organ Donor' designation on their license?
  choices:
    A: They must be at least 21 years old
    B: They must pay an additional $5 fee
    C: They must indicate their wish to be a donor on the application
    D: They must provide a written note from a doctor
  answer: C
  explanation: Any person may indicate their wish to be an organ donor on their license
    application; if the applicant is under 18, parental consent is required.
- id: 31
  category: driver_testing
  question: In Wyoming, what is the maximum speed limit on rural interstate highways,
    unless otherwise posted?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: According to the Wyoming Driver's Manual, the maximum speed limit on
    rural interstate highways is 80 mph unless otherwise posted.
- id: 32
  category: driver_testing
  question: When parking your vehicle near a fire hydrant in Wyoming, what is the
    minimum distance you must maintain?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: Wyoming law prohibits parking within 15 feet of a fire hydrant.
- id: 33
  category: driver_testing
  question: In Wyoming, you must signal your intention to turn at least how many feet
    before the turn in urban areas?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: The Wyoming Driver's Manual states that you must signal at least 100
    feet before making a turn.
- id: 34
  category: driver_testing
  question: When driving at night in Wyoming, you must dim your high-beam headlights
    when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Wyoming law requires drivers to dim high beams when an oncoming vehicle
    is within 500 feet.
- id: 35
  category: driver_testing
  question: 'In Wyoming, a written accident report (SR-21) must be filed with the
    Department of Transportation if there is a death, personal injury, or property
    damage to any one person''s property amounting to at least:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: B
  explanation: Wyoming law requires an accident report to be filed if property damage
    is $1,000 or more, or if there is injury or death.
- id: 36
  category: driver_testing
  question: When parking near a stop sign, yield sign, or traffic signal in Wyoming,
    you must be at least how many feet away?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Wyoming law states you cannot park within 30 feet of any flashing beacon,
    stop sign, yield sign, or traffic control signal located at the side of a roadway.
- id: 37
  category: driver_testing
  question: According to Wyoming law, children must be properly restrained in a child
    safety restraint system until they reach what age?
  choices:
    A: 6 years old
    B: 7 years old
    C: 8 years old
    D: 9 years old
  answer: D
  explanation: Wyoming law requires children to be in a child safety restraint system
    until they are 9 years old, unless they have outgrown the system's weight or height
    limits.
- id: 38
  category: driver_testing
  question: 'Under Wyoming''s Implied Consent Law, if you refuse to submit to chemical
    testing for alcohol or drugs for the first time, your driver''s license will be
    suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Under the Implied Consent Law, a first-time refusal to take a chemical
    test results in a 6-month driver's license suspension.
- id: 39
  category: driver_testing
  question: When a school bus is stopped on a four-lane highway with its red lights
    flashing and stop arm extended, which drivers must stop?
  choices:
    A: Only drivers following the bus
    B: Only drivers in the lane next to the bus
    C: Drivers in all lanes, regardless of direction
    D: Only drivers on the opposite side of the highway
  answer: C
  explanation: In Wyoming, on any highway (including four-lane roads) that is not
    separated by a median or physical barrier, traffic in both directions must stop
    for a school bus with flashing red lights.
- id: 40
  category: driver_testing
  question: Wyoming's 'Move Over' law requires drivers to do what when approaching
    a stationary emergency vehicle with flashing lights on a highway with at least
    two lanes in the same direction?
  choices:
    A: Stop completely until signaled to pass
    B: Maintain speed but honk to alert the emergency workers
    C: Merge into the lane farthest from the emergency vehicle if safe to do so
    D: Speed up to pass the scene as quickly as possible
  answer: C
  explanation: Wyoming law requires drivers to move to the farthest lane away from
    emergency, maintenance, or towing vehicles if it is safe to do so.
- id: 41
  category: driver_testing
  question: 'In Wyoming, the speed limit in a school zone is typically:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The standard speed limit in Wyoming school zones is 20 mph when lights
    are flashing or children are present.
- id: 42
  category: driver_testing
  question: 'To maintain a safe following distance behind the vehicle in front of
    you in ideal conditions, the Wyoming Driver''s Manual recommends using the:'
  choices:
    A: One-second rule
    B: Two-second rule
    C: Three-second rule
    D: Four-second rule
  answer: C
  explanation: Wyoming recommends a following distance of at least three seconds to
    allow enough time to react to hazards.
- id: 43
  category: driver_testing
  question: In Wyoming, it is illegal to park your vehicle within how many feet of
    a crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: C
  explanation: Wyoming law prohibits parking within 20 feet of a crosswalk at an intersection.
- id: 44
  category: driver_testing
  question: 'For an adult driver (21 or older) in Wyoming, a first-time DWUI conviction
    can result in a driver''s license suspension of up to:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: A first-time DWUI (Driving While Under the Influence) conviction for
    an adult in Wyoming typically results in a 90-day license suspension.
- id: 45
  category: driver_testing
  question: After becoming a resident of Wyoming, how many days do you have to register
    your vehicle in the state?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: D
  explanation: According to the Wyoming Driver's Manual, new residents have 120 days
    to register their vehicles after establishing residency.
- id: 46
  category: driver_testing
  question: If you fail the Wyoming driving skills (road) test, what is the minimum
    waiting period before you can attempt the test again?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 30 days
  answer: A
  explanation: If a applicant fails the skills test, they must wait at least 24 hours
    before they are eligible to retake it.
- id: 47
  category: driver_testing
  question: 'To meet Wyoming''s vision standards for a driver''s license, an applicant
    must have a combined horizontal field of vision of at least:'
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 140 degrees
  answer: C
  explanation: Wyoming requires a horizontal field of vision of at least 120 degrees
    to qualify for a standard driver's license.
- id: 48
  category: driver_testing
  question: What is the minimum passing score required on the Wyoming written knowledge
    test?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: The Wyoming written knowledge test consists of 25 questions, and a
    score of 80% (20 correct answers) is required to pass.
- id: 49
  category: driver_testing
  question: 'In Wyoming, you must file a ''Traffic Accident Report'' with the Department
    of Transportation if an accident results in property damage of at least:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: B
  explanation: Wyoming law requires a written report for any accident resulting in
    injury, death, or total property damage of $1,000 or more.
- id: 50
  category: driver_testing
  question: 'Wyoming residents who are eligible to renew their license by mail may
    do so only once every:'
  choices:
    A: 4 years
    B: 8 years
    C: 10 years
    D: 12 years
  answer: B
  explanation: Eligible drivers may renew their license by mail once every eight years,
    meaning every other renewal must be done in person.
- id: 51
  category: driver_testing
  question: What is the fine for a first-time conviction of operating a motor vehicle
    in Wyoming without valid liability insurance?
  choices:
    A: Between $50 and $100
    B: Between $100 and $250
    C: Between $250 and $750
    D: Exactly $1,000
  answer: C
  explanation: A first-time conviction for no insurance in Wyoming carries a fine
    ranging from $250 to $750 and/or up to six months in jail.
- id: 52
  category: driver_testing
  question: Wyoming law requires license plates to be displayed on which part(s) of
    most passenger vehicles?
  choices:
    A: Rear only
    B: Front only
    C: Both front and rear
    D: Rear and inside the front windshield
  answer: C
  explanation: Wyoming law requires most vehicles to display license plates on both
    the front and the rear of the vehicle.
- id: 53
  category: driver_testing
  question: 'A standard Wyoming Class C driver''s license allows the holder to tow
    a vehicle with a Gross Vehicle Weight Rating (GVWR) of no more than:'
  choices:
    A: 5,000 lbs
    B: 10,000 lbs
    C: 15,000 lbs
    D: 26,000 lbs
  answer: B
  explanation: A Class C license allows the operation of a single vehicle weighing
    less than 26,001 lbs and towing a vehicle not in excess of 10,000 lbs GVWR.
- id: 54
  category: driver_testing
  question: What is the current fee for obtaining a duplicate Wyoming driver's license
    if yours is lost or destroyed?
  choices:
    A: $5
    B: $15
    C: $25
    D: $45
  answer: B
  explanation: The fee for a duplicate driver's license in Wyoming is $15.
- id: 55
  category: driver_testing
  question: Which of the following is true regarding Wyoming's seat belt law?
  choices:
    A: It is a primary offense; police can pull you over just for not wearing a belt.
    B: It is a secondary offense; you can only be cited if stopped for another violation.
    C: Seat belts are only required for passengers under the age of 12.
    D: Seat belts are only required on interstate highways.
  answer: B
  explanation: Wyoming's seat belt law is a secondary enforcement law, meaning a driver
    must be stopped for another violation before a seat belt citation can be issued.
- id: 56
  category: driver_testing
  question: 'By applying for a Wyoming driver''s license, male applicants under the
    age of 26 are consenting to automatic registration with:'
  choices:
    A: The Wyoming National Guard
    B: The Selective Service System
    C: The Department of Homeland Security
    D: The Wyoming Highway Patrol
  answer: B
  explanation: Wyoming law requires that any male applicant under 26 be registered
    with the Selective Service System when applying for a license or permit.
- id: 57
  category: driver_testing
  question: What is the standard fee to reinstate a Wyoming driver's license that
    was suspended for reasons other than DUI or insurance violations?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: B
  explanation: The standard reinstatement fee for a suspended license in Wyoming is
    $50 (though DUI-related reinstatements may cost more).
- id: 58
  category: driver_responsibility
  question: 'In Wyoming, you must immediately notify the nearest law enforcement agency
    if an accident results in injury, death, or total property damage to an apparent
    extent of at least:'
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: C
  explanation: According to Wyoming law (W.S. 31-5-1106), the driver of a vehicle
    involved in an accident resulting in injury, death, or total property damage of
    $1,000 or more must immediately notify the nearest law enforcement agency.
- id: 59
  category: driver_responsibility
  question: 'Wyoming''s ''Implied Consent'' law means that by driving on Wyoming roadways,
    you have given consent to:'
  choices:
    A: A search of your vehicle's trunk at any time.
    B: A chemical test of your breath, blood, or urine to determine alcohol or drug
      content.
    C: The installation of an ignition interlock device.
    D: Allowing passengers to drink alcohol as long as the driver is sober.
  answer: B
  explanation: Wyoming's Implied Consent law (W.S. 31-6-102) states that any person
    who operates a motor vehicle is deemed to have given consent to a chemical test
    for the purpose of determining the alcohol or controlled substance content of
    their blood.
- id: 60
  category: driver_responsibility
  question: 'In Wyoming, for most passenger vehicles, license plates must be displayed
    on:'
  choices:
    A: The rear of the vehicle only.
    B: The front of the vehicle only.
    C: Both the front and the rear of the vehicle.
    D: The rear window and the front bumper.
  answer: C
  explanation: Wyoming law (W.S. 31-2-204) requires that license plates be conspicuously
    displayed on both the front and rear of most motor vehicles, except for motorcycles,
    trailers, and certain custom vehicles.
- id: 61
  category: driver_responsibility
  question: 'If you are convicted of a first-offense DUI in Wyoming and your BAC was
    0.15% or higher, you are required to:'
  choices:
    A: Forfeit your vehicle to the state.
    B: Operate only vehicles equipped with an ignition interlock device for 6 months.
    C: Serve a mandatory 30 days in state prison.
    D: Permanently lose your driving privileges.
  answer: B
  explanation: Wyoming law requires a first-time DUI offender with a BAC of 0.15%
    or higher to use an ignition interlock device for a period of 6 months after their
    license is reinstated.
- id: 62
  category: driver_responsibility
  question: If you are involved in an accident in Wyoming where the other driver is
    at fault but does not have insurance, which coverage on your own policy would
    typically cover your medical expenses?
  choices:
    A: Comprehensive coverage
    B: Collision coverage
    C: Uninsured Motorist coverage
    D: Liability coverage
  answer: C
  explanation: Uninsured Motorist coverage is designed to protect you if you are involved
    in an accident with a driver who does not carry the state-mandated liability insurance.
- id: 63
  category: driver_responsibility
  question: 'Wyoming''s ''Open Container'' law prohibits the possession of an open
    alcoholic beverage container in the passenger area of a motor vehicle on a public
    highway. This law applies to:'
  choices:
    A: The driver only.
    B: The passengers only.
    C: Both the driver and all passengers.
    D: Only drivers under the age of 21.
  answer: C
  explanation: Wyoming Statute 31-5-235 prohibits any person (driver or passenger)
    from consuming or possessing an open alcoholic beverage container while in the
    passenger area of a motor vehicle on a public highway.
- id: 64
  category: driver_responsibility
  question: What is the penalty for a first-time refusal to submit to a chemical test
    under Wyoming's Implied Consent law?
  choices:
    A: A 90-day license suspension.
    B: A 6-month license suspension.
    C: A 1-year license suspension.
    D: A mandatory 48-hour jail sentence.
  answer: B
  explanation: If a driver refuses to submit to a chemical test as requested by a
    peace officer under the Implied Consent law, their driver's license will be suspended
    for 6 months for a first offense.
- id: 65
  category: driver_responsibility
  question: Under Wyoming law, who is responsible for ensuring that all passengers
    under the age of 18 are properly restrained by a seat belt or child safety restraint
    system?
  choices:
    A: The passengers themselves.
    B: The driver of the vehicle.
    C: The parents of the passengers, even if not present.
    D: Only the front-seat passengers.
  answer: B
  explanation: In Wyoming, the driver is legally responsible for ensuring that all
    passengers under the age of 18 are properly buckled up or secured in an appropriate
    child safety seat.
- id: 66
  category: driver_responsibility
  question: 'If you are convicted of littering on a Wyoming highway, you may be subject
    to a fine of up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: D
  explanation: Littering is a misdemeanor in Wyoming. Conviction can result in a fine
    of up to $750 and/or up to 6 months in jail.
- id: 67
  category: driver_responsibility
  question: If your Wyoming driver's license is suspended because of a DUI, you may
    be required to file an SR-22 form. What is an SR-22?
  choices:
    A: A certificate of vehicle registration.
    B: A proof of future financial responsibility (insurance).
    C: A medical clearance from a doctor.
    D: A record of all moving violations.
  answer: B
  explanation: An SR-22 is a document issued by an insurance company to the state
    certifying that a driver has the minimum required liability insurance. It is often
    required for license reinstatement after a suspension.
- id: 68
  category: driver_responsibility
  question: 'If you fail to pay a court-ordered judgment resulting from a motor vehicle
    accident within 60 days, Wyoming law requires that:'
  choices:
    A: Your vehicle be impounded.
    B: Your driver's license and registration be suspended.
    C: You serve 10 days in the county jail.
    D: Your insurance premiums be doubled by law.
  answer: B
  explanation: Under Wyoming's financial responsibility laws, if a driver fails to
    satisfy a judgment arising from an accident within 60 days, the Department of
    Transportation shall suspend the driver's license and registration.
- id: 69
  category: driver_responsibility
  question: 'When registering a vehicle in Wyoming, the registration typically expires
    on:'
  choices:
    A: December 31st of every year.
    B: The owner's birthday.
    C: The last day of the month one year from the date of registration.
    D: June 30th of every year.
  answer: C
  explanation: Wyoming uses a staggered registration system where the registration
    expires on the last day of the month, one year from the month of the initial registration.
- id: 70
  category: driver_responsibility
  question: 'In Wyoming, you may show proof of financial responsibility (insurance)
    to a law enforcement officer using:'
  choices:
    A: Only a paper card issued by your insurance company.
    B: An electronic image displayed on a mobile device.
    C: A verbal statement of your policy number.
    D: A copy of your most recent insurance premium payment.
  answer: B
  explanation: Wyoming law allows drivers to provide evidence of insurance in either
    a printed (paper) format or an electronic format on a mobile electronic device.
- id: 71
  category: driver_responsibility
  question: New residents to Wyoming must register their vehicles within how many
    days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: Wyoming law requires that you register your vehicle within 30 days
    of becoming a resident or obtaining employment in the state.
- id: 72
  category: driver_responsibility
  question: 'If you are involved in an accident in Wyoming that requires a report,
    and a police officer does not investigate, you must file a written report with
    the Department of Transportation within:'
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: If an accident is not investigated by a law enforcement officer and
    results in injury, death, or $1,000 in damage, the driver must file a written
    report within 10 days.
- id: 73
  category: driver_responsibility
  question: 'If your Wyoming driver''s license is suspended for a lack of liability
    insurance, you will typically be required to maintain an SR-22 financial responsibility
    form for:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Wyoming requires drivers to file and maintain an SR-22 insurance certificate
    for 3 years following a suspension for no insurance or a DUI conviction.
- id: 74
  category: driver_responsibility
  question: Wyoming's 'Open Container' law prohibits which of the following?
  choices:
    A: Possessing an open alcoholic beverage in the passenger area of a vehicle on
      a public highway
    B: Transporting an unopened case of beer in the front seat
    C: Having an empty beer can in the bed of a pickup truck
    D: Transporting wine in a sealed, original container in the passenger area
  answer: A
  explanation: Wyoming law prohibits any person from consuming or possessing an open
    alcoholic beverage while in the passenger area of a motor vehicle upon a public
    highway.
- id: 75
  category: driver_responsibility
  question: Which of the following convictions will result in the MANDATORY revocation
    of your Wyoming driving privileges?
  choices:
    A: A single speeding ticket for 10 mph over the limit
    B: Failure to use a turn signal
    C: Leaving the scene of an accident involving injury or death
    D: A single conviction for following too closely
  answer: C
  explanation: Mandatory revocation occurs for serious offenses, including hit and
    run involving injury or death, homicide by vehicle, or using a motor vehicle in
    the commission of a felony.
- id: 76
  category: driver_responsibility
  question: In Wyoming, a first-time DUI offender with a Blood Alcohol Concentration
    (BAC) of ____ or higher is required to have an Ignition Interlock Device (IID)
    installed for 6 months.
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.12%
    D: 0.15%
  answer: D
  explanation: Wyoming law mandates an Ignition Interlock Device for 6 months even
    for a first offense if the driver's BAC was 0.15% or higher.
- id: 77
  category: driver_responsibility
  question: 'For most passenger vehicles, Wyoming law requires license plates to be
    displayed:'
  choices:
    A: On the rear of the vehicle only
    B: On the front of the vehicle only
    C: On both the front and the rear of the vehicle
    D: In the rear window only
  answer: C
  explanation: 'Wyoming law requires that most vehicles display two license plates:
    one on the front and one on the rear.'
- id: 78
  category: driver_responsibility
  question: What is the maximum penalty for littering on Wyoming highways?
  choices:
    A: A $100 fine
    B: A $250 fine and 10 hours of community service
    C: Up to a $750 fine and/or up to 6 months in jail
    D: Mandatory license revocation for 30 days
  answer: C
  explanation: Littering is illegal in Wyoming and is punishable by a fine of up to
    $750 and/or up to 6 months in jail.
- id: 79
  category: driver_responsibility
  question: 'Under Wyoming law, your driving privileges can be suspended for failing
    to pay court-ordered:'
  choices:
    A: Credit card debt
    B: Child support
    C: Property taxes
    D: Medical bills
  answer: B
  explanation: Wyoming Driver Services may suspend a driver's license if they receive
    notice from the Department of Family Services that the driver is in arrears on
    child support payments.
- id: 80
  category: driver_responsibility
  question: When you sell a vehicle in Wyoming, the buyer must apply for a new title
    in their name within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: D
  explanation: In Wyoming, the purchaser of a vehicle must transfer the title into
    their name within 60 days of the date of sale.
- id: 81
  category: driver_responsibility
  question: 'To reinstate a Wyoming driver''s license after a suspension for a DUI,
    the driver must pay a reinstatement fee of at least:'
  choices:
    A: $25
    B: $50
    C: $105
    D: $250
  answer: C
  explanation: While a standard reinstatement fee is $50, Wyoming law requires a $105
    fee for reinstatements following alcohol-related suspensions.
- id: 82
  category: driver_responsibility
  question: 'If you are involved in an accident with a parked vehicle and the owner
    cannot be found, Wyoming law requires you to:'
  choices:
    A: Wait for at least two hours for the owner to return
    B: Leave a note with your name, address, and an explanation, and notify the police
    C: Drive to the nearest police station within 24 hours
    D: Only leave a note if the damage appears to be over $1,000
  answer: B
  explanation: Wyoming law requires you to stop and try to locate the owner. If they
    cannot be found, you must leave a written notice in a conspicuous place on the
    vehicle and notify the nearest law enforcement agency.
- id: 83
  category: safe_driving_rules
  question: When following another vehicle in Wyoming, what is the recommended minimum
    following distance under ideal driving conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: C
  explanation: The Wyoming Driver's Manual recommends a following distance of at least
    4 seconds to allow enough time to react to hazards.
- id: 84
  category: safe_driving_rules
  question: In Wyoming, you are prohibited from parking within how many feet of a
    fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: Wyoming law states that you may not park a vehicle within 15 feet of
    a fire hydrant.
- id: 85
  category: safe_driving_rules
  question: How many feet before turning in a business or residential district must
    you activate your turn signal?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: In Wyoming, you must signal your intention to turn at least 100 feet
    before the turn when in a business or residential area.
- id: 86
  category: safe_driving_rules
  question: You are prohibited from parking within how many feet of a stop sign, flashing
    beacon, or yield sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Wyoming law prohibits parking within 30 feet of any flashing beacon,
    stop sign, or traffic control signal located at the side of a roadway.
- id: 87
  category: safe_driving_rules
  question: 'In Wyoming, you may not make a U-turn on a curve or near the crest of
    a hill if your vehicle cannot be seen by other drivers approaching from either
    direction within:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 700 feet
    D: 1,000 feet
  answer: B
  explanation: U-turns are prohibited on curves or hills where the vehicle cannot
    be seen by other drivers within 500 feet.
- id: 88
  category: safe_driving_rules
  question: What is the standard speed limit in a Wyoming school zone when children
    are present or the beacon is flashing?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The speed limit in school zones in Wyoming is 20 mph unless otherwise
    posted.
- id: 89
  category: safe_driving_rules
  question: When parking your vehicle parallel to a curb on a level street, your tires
    must be within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: Wyoming law requires that both right wheels of a parallel-parked vehicle
    be within 12 inches of the curb.
- id: 90
  category: safe_driving_rules
  question: 'In Wyoming, you must dim your high beams when following another vehicle
    from behind within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: When following another vehicle, you must dim your high beams when you
    are within 300 feet of that vehicle.
- id: 91
  category: safe_driving_rules
  question: 'When parking a vehicle facing downhill on a two-way street with a curb,
    you should turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the left
  answer: A
  explanation: When parking downhill, you should turn your steering wheel toward the
    curb so that if the vehicle rolls, it will roll into the curb and stop.
- id: 92
  category: safe_driving_rules
  question: In Wyoming, what is the unposted speed limit on rural interstate highways
    for passenger vehicles?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: According to Wyoming law, the speed limit on rural interstate highways
    is 80 mph unless otherwise posted.
- id: 93
  category: safe_driving_rules
  question: Unless otherwise posted, what is the legal speed limit in a Wyoming 'urban
    district' or residential area?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: In Wyoming, the default speed limit in any urban district or residential
    area is 30 mph unless signs indicate otherwise.
- id: 94
  category: safe_driving_rules
  question: When intending to turn, you must signal continuously for at least how
    many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Wyoming law requires drivers to signal their intention to turn for
    at least 100 feet before the actual turn.
- id: 95
  category: safe_driving_rules
  question: 'If you are convicted of speeding in a Wyoming construction zone where
    workers are present, the fine is:'
  choices:
    A: Increased by $100
    B: Tripled
    C: Doubled
    D: The same as a normal ticket
  answer: C
  explanation: Fines for speeding in Wyoming work zones are doubled when workers are
    present and the zone is properly signed.
- id: 96
  category: safe_driving_rules
  question: On a highway with two or more lanes in each direction separated by a median,
    do you have to stop for a school bus with flashing red lights approaching from
    the opposite direction?
  choices:
    A: Yes, you must always stop for a school bus.
    B: No, you do not need to stop if there is a physical median or separation.
    C: Yes, but only if there are children present.
    D: No, but you must slow down to 15 mph.
  answer: B
  explanation: In Wyoming, if you are traveling on a divided highway (separated by
    a median or barrier), you do not need to stop for a school bus that is traveling
    in the opposite direction.
- id: 97
  category: safe_driving_rules
  question: 'Wyoming law requires you to use your headlights whenever you cannot see
    clearly for a distance of at least:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Headlights must be used from sunset to sunrise and at any other time
    when visibility is less than 500 feet due to weather or other conditions.
- id: 98
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane road, you must return to your
    lane before coming within how many feet of an oncoming vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: You must return to your side of the road before coming within 200 feet
    of any vehicle approaching from the opposite direction.
- id: 99
  category: safe_driving_rules
  question: When using hand signals, how do you signal a left turn?
  choices:
    A: Arm extended straight out the window
    B: Arm bent upward at a 90-degree angle
    C: Arm bent downward at a 90-degree angle
    D: Arm waving in a circular motion
  answer: A
  explanation: To signal a left turn using hand signals, the driver should extend
    their left arm horizontally out the window.
- id: 100
  category: defensive_driving
  question: According to the Wyoming Driver's Manual, what is the recommended following
    distance to maintain behind the vehicle in front of you under ideal conditions?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: C
  explanation: The Wyoming Driver's Manual specifically recommends the 'four-second
    rule' to maintain a safe following distance under ideal driving conditions.
- id: 101
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, the Wyoming
    Driver's Manual suggests looking ahead at least how many seconds?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 seconds
  answer: B
  explanation: Safe drivers scan the road 10 to 15 seconds ahead to anticipate hazards
    and traffic flow changes.
- id: 102
  category: defensive_driving
  question: At what speed can hydroplaning (where tires lose contact with the road
    and ride on a thin film of water) begin in Wyoming weather conditions?
  choices:
    A: As low as 25 mph
    B: As low as 35 to 40 mph
    C: Only above 55 mph
    D: Only above 65 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 to 40 mph, especially
    if tires are worn or poorly inflated.
- id: 103
  category: defensive_driving
  question: 'In Wyoming, headlights must be turned on if you cannot see clearly for
    a distance of at least:'
  choices:
    A: 300 feet
    B: 400 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Wyoming law states that headlights must be used from sunset to sunrise
    and whenever visibility is less than 500 feet.
- id: 104
  category: defensive_driving
  question: 'When driving on Wyoming roads in winter, if your vehicle begins to skid,
    you should:'
  choices:
    A: Brake hard immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Stay off the brakes and steer in the direction you want the front of the vehicle
      to go
    D: Shift the car into neutral and pump the brakes rapidly
  answer: C
  explanation: To recover from a skid, you should take your foot off the gas and steer
    in the direction you want the vehicle to go without slamming on the brakes.
- id: 105
  category: defensive_driving
  question: 'Wyoming has a high population of wildlife. If a large animal like a deer
    or elk jumps in front of your vehicle, the manual recommends you should:'
  choices:
    A: Swerve sharply into the other lane to miss it
    B: Brake firmly but do not swerve out of your lane
    C: Speed up to minimize the impact force
    D: Honk your horn continuously and close your eyes
  answer: B
  explanation: Swerving to avoid an animal can often result in a more serious crash
    with another vehicle or a rollover. The safest action is to brake firmly and stay
    in your lane.
- id: 106
  category: defensive_driving
  question: What is the unposted speed limit for unpaved (dirt or gravel) roads in
    Wyoming?
  choices:
    A: 20 mph
    B: 30 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: According to Wyoming state law, the speed limit on unpaved roads is
    30 mph unless a different limit is posted.
- id: 107
  category: defensive_driving
  question: 'If you are driving on a two-lane road in Wyoming and approach a school
    bus with red lights flashing and stop arm extended, you must stop unless:'
  choices:
    A: You are traveling in the opposite direction
    B: The bus is on the opposite side of a median or physical barrier
    C: There are no children visible
    D: You are in a hurry and the bus has been stopped for more than 2 minutes
  answer: B
  explanation: Drivers do not need to stop for a school bus if they are traveling
    in the opposite direction on a highway divided by a median or barrier.
- id: 108
  category: defensive_driving
  question: In Wyoming, when are you allowed to pass a vehicle on the right?
  choices:
    A: Whenever you are in a hurry
    B: Only if the vehicle ahead is making a left turn and there is a paved shoulder
      or second lane
    C: If the vehicle ahead is driving below the speed limit
    D: Passing on the right is never legal in Wyoming
  answer: B
  explanation: You may pass on the right in Wyoming only if the vehicle you are passing
    is making a left turn and there is enough pavement for you to pass safely without
    leaving the road.
- id: 109
  category: defensive_driving
  question: According to Wyoming law, when two vehicles reach an intersection without
    signs or signals at the same time, who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a higher speed
    D: The vehicle that honks first
  answer: B
  explanation: At an uncontrolled intersection, the driver of the vehicle on the left
    must yield the right-of-way to the vehicle on the right.
- id: 110
  category: defensive_driving
  question: 'When entering a roundabout in Wyoming, you must yield the right-of-way
    to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the roundabout
    C: No one; you have the right of way when entering
    D: Only emergency vehicles
  answer: B
  explanation: Drivers entering a roundabout must yield to the traffic already circulating
    within the roundabout.
- id: 111
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in Wyoming, how far
    ahead should you scan the road?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 seconds
  answer: B
  explanation: Wyoming law and safety guidelines suggest scanning the road 10 to 15
    seconds ahead to anticipate hazards and manage traffic flow.
- id: 112
  category: defensive_driving
  question: When following another vehicle at night in Wyoming, at what distance must
    you dim your high-beam headlights?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: You must dim your high beams when following another vehicle within
    300 feet to avoid reflecting glare into the lead driver's rearview mirror.
- id: 113
  category: defensive_driving
  question: At what speed can hydroplaning (tires losing contact with the road due
    to water) begin in Wyoming?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Only above 65 mph
    D: At any speed over 15 mph
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 55 mph.
- id: 114
  category: defensive_driving
  question: When driving in freezing temperatures in Wyoming, which of the following
    road surfaces is likely to freeze first and stay frozen longer?
  choices:
    A: Intersections
    B: Gravel roads
    C: Bridges and overpasses
    D: Tunnels
  answer: C
  explanation: Bridges and overpasses freeze before other road surfaces because they
    are exposed to cold air on both the top and bottom.
- id: 115
  category: defensive_driving
  question: When entering an intersection in Wyoming, in which order should you scan
    for traffic?
  choices:
    A: Right, left, right
    B: Left, right, left
    C: Straight, left, right
    D: Right, straight, left
  answer: B
  explanation: You should look left, then right, then left again. Looking left first
    is crucial because vehicles coming from the left are closer to you.
- id: 116
  category: defensive_driving
  question: 'If a deer or elk suddenly runs in front of your vehicle on a Wyoming
    highway, the safest defensive driving action is usually to:'
  choices:
    A: Swerve sharply into the opposite lane
    B: Swerve off the road into a ditch
    C: Brake firmly and stay in your lane
    D: Speed up to pass the animal before it hits
  answer: C
  explanation: Wyoming safety guidelines advise drivers not to swerve for animals,
    as swerving can lead to a more serious rollover or head-on collision. Brake firmly
    and maintain control of your lane.
- id: 117
  category: defensive_driving
  question: 'When following a large truck or commercial vehicle in Wyoming, you should
    increase your following distance to at least:'
  choices:
    A: 4 seconds
    B: 5 seconds
    C: Between 6 and 8 seconds
    D: 10 seconds
  answer: C
  explanation: Because large trucks require more room to stop and block your view
    of the road ahead, Wyoming recommends increasing following distance to 6-8 seconds.
- id: 118
  category: defensive_driving
  question: 'Wyoming is known for high winds. If you are driving a small vehicle or
    a high-profile vehicle in strong winds, you should:'
  choices:
    A: Speed up to use momentum for stability
    B: Slow down and maintain a firm grip on the steering wheel
    C: Drive as close to the center line as possible
    D: Tailgate a large truck to use it as a windbreak
  answer: B
  explanation: High winds can push vehicles out of their lane. Slowing down and keeping
    a firm grip on the wheel helps maintain control, especially when being passed
    by large trucks.
- id: 119
  category: defensive_driving
  question: 'To check your ''blind spot'' before changing lanes in Wyoming, you must:'
  choices:
    A: Check your rearview mirror
    B: Check your side-view mirror
    C: Turn your head and look over your shoulder
    D: Rely on your vehicle's blind-spot monitoring system
  answer: C
  explanation: Mirrors do not show everything. A 'head check' or looking over your
    shoulder is the only way to ensure the blind spot is clear before moving.
- id: 120
  category: defensive_driving
  question: Which of the following is a recommended item for a Wyoming winter emergency
    driving kit to help with traction if you get stuck in snow?
  choices:
    A: A gallon of gasoline
    B: A bag of sand or cat litter
    C: A can of WD-40
    D: Extra windshield wiper fluid
  answer: B
  explanation: The Wyoming Driver's Manual recommends carrying sand, cat litter, or
    salt to provide traction for tires on ice or snow if the vehicle becomes stuck.
- id: 121
  category: defensive_driving
  question: 'To prevent ''highway hypnosis'' and fatigue during long trips on Wyoming
    interstates, it is recommended to stop and rest every:'
  choices:
    A: 1 hour or 50 miles
    B: 2 hours or 100 miles
    C: 4 hours or 250 miles
    D: Only when you feel your eyes closing
  answer: B
  explanation: Wyoming safety guidelines suggest taking a break every 100 miles or
    every two hours to stay alert and avoid drowsy driving.
- id: 122
  category: alcohol_drugs_health
  question: In Wyoming, a person is considered to be driving under the influence if
    their Blood Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.10%
    D: 0.02%
  answer: B
  explanation: According to Wyoming Statute 31-5-233, it is illegal for any person
    to drive or be in actual physical control of a vehicle with a BAC of 0.08% or
    higher.
- id: 123
  category: alcohol_drugs_health
  question: Under Wyoming's 'Implied Consent' law, by driving on Wyoming roads, you
    have given your consent to which of the following?
  choices:
    A: A search of your vehicle's trunk
    B: A chemical test of your breath, blood, or urine
    C: A review of your medical records
    D: A mandatory 24-hour observation period
  answer: B
  explanation: Wyoming's Implied Consent law means that by operating a motor vehicle,
    you agree to submit to chemical testing of your breath, blood, or urine to determine
    alcohol or drug content if arrested for DUI.
- id: 124
  category: alcohol_drugs_health
  question: What is the maximum fine for a first-offense DUI conviction in Wyoming
    (excluding court costs)?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: A first-offense DUI in Wyoming is punishable by a fine of up to $750,
    imprisonment for up to six months, or both.
- id: 125
  category: alcohol_drugs_health
  question: If you are convicted of a first-offense DUI in Wyoming, for how long will
    your driver's license typically be suspended?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: A first-offense DUI conviction in Wyoming results in a mandatory driver's
    license suspension of 90 days.
- id: 126
  category: alcohol_drugs_health
  question: 'In Wyoming, a driver operating a Commercial Motor Vehicle (CMV) is considered
    legally intoxicated if their BAC is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: For commercial drivers in Wyoming, the legal BAC limit is lower than
    for standard drivers, set at 0.04%.
- id: 127
  category: alcohol_drugs_health
  question: 'If a Wyoming driver refuses to submit to a required chemical test for
    the first time, their license will be suspended for:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Under Wyoming law, the first refusal to submit to a chemical test results
    in an automatic 6-month driver's license suspension.
- id: 128
  category: alcohol_drugs_health
  question: 'In Wyoming, an Ignition Interlock Device (IID) is mandatory for a first-offense
    DUI if the driver''s BAC was at or above:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: Wyoming law requires an Ignition Interlock Device for first-time offenders
    if their BAC was 0.15% or higher at the time of the offense.
- id: 129
  category: alcohol_drugs_health
  question: 'In Wyoming, a person can be charged with ''Child Endangerment'' if they
    are caught driving under the influence with a passenger under the age of:'
  choices:
    A: '12'
    B: '14'
    C: '16'
    D: '18'
  answer: C
  explanation: Wyoming law includes enhanced penalties for DUI if a child under the
    age of 16 is present in the vehicle at the time of the offense.
- id: 130
  category: alcohol_drugs_health
  question: What is the suspension period for a second DUI conviction within a 10-year
    period in Wyoming?
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 3 years
  answer: C
  explanation: A second DUI conviction within 10 years in Wyoming results in a mandatory
    1-year driver's license suspension.
- id: 131
  category: alcohol_drugs_health
  question: Can you be convicted of a DWUI (Driving While Under the Influence) in
    Wyoming if you are driving under the influence of a legally prescribed medication?
  choices:
    A: No, as long as you have a valid prescription
    B: No, the law only applies to illegal drugs and alcohol
    C: Yes, if the medication renders you incapable of safely driving
    D: Yes, but only if you also have alcohol in your system
  answer: C
  explanation: In Wyoming, it is illegal to drive under the influence of any controlled
    substance or drug to a degree which renders the person incapable of safely driving,
    regardless of whether it was legally prescribed.
- id: 132
  category: alcohol_drugs_health
  question: If your Wyoming license is suspended for a DUI, how much is the reinstatement
    fee you must pay to the Department of Transportation?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: B
  explanation: To reinstate a Wyoming driver's license after an alcohol or drug-related
    suspension, the driver must pay a $50 reinstatement fee.
- id: 133
  category: alcohol_drugs_health
  question: Under Wyoming's Administrative Per Se law, how many days do you have to
    request a hearing after receiving a notice of suspension for DUI?
  choices:
    A: 7 days
    B: 10 days
    C: 20 days
    D: 30 days
  answer: C
  explanation: Drivers have 20 days from the date of the notice of suspension to request
    a contested case hearing regarding their license suspension.
- id: 134
  category: alcohol_drugs_health
  question: 'In Wyoming, if you are convicted of a 4th DUI within 10 years, the offense
    is classified as a:'
  choices:
    A: Class C Misdemeanor
    B: Class A Misdemeanor
    C: Felony
    D: Administrative Violation
  answer: C
  explanation: A fourth or subsequent DUI conviction within 10 years in Wyoming is
    a felony offense, punishable by up to 7 years in prison.
- id: 135
  category: alcohol_drugs_health
  question: Which of the following is true regarding Wyoming's 'Zero Tolerance' law
    for drivers under 21?
  choices:
    A: It only applies if the driver is involved in an accident
    B: It sets the legal BAC limit at 0.02% for minors
    C: It only applies to repeat offenders
    D: It allows minors to drive with a BAC up to 0.05% if a parent is present
  answer: B
  explanation: Wyoming's Zero Tolerance law makes it illegal for anyone under the
    age of 21 to operate a motor vehicle with a BAC of 0.02% or higher.
- id: 136
  category: alcohol_drugs_health
  question: In Wyoming, what is the maximum jail sentence for a first-offense conviction
    of Driving While Under the Influence (DWUI)?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: According to Wyoming Statute 31-5-233, a first-offense DWUI conviction
    is punishable by up to 6 months in jail.
- id: 137
  category: alcohol_drugs_health
  question: 'When determining penalties for DWUI in Wyoming, the ''look-back'' period
    for prior convictions is:'
  choices:
    A: 3 years
    B: 5 years
    C: 10 years
    D: The driver's lifetime
  answer: C
  explanation: Wyoming uses a 10-year look-back period to determine if a DWUI is a
    second or subsequent offense.
- id: 138
  category: alcohol_drugs_health
  question: 'In Wyoming, a DWUI charge is considered ''Child Endangerment'' if the
    driver has a passenger under the age of:'
  choices:
    A: '12'
    B: '14'
    C: '16'
    D: '18'
  answer: C
  explanation: Wyoming law imposes enhanced penalties for DWUI if there is a passenger
    in the vehicle under the age of 16.
- id: 139
  category: alcohol_drugs_health
  question: If you are taking a prescription drug, who is responsible for ensuring
    you can safely operate a vehicle?
  choices:
    A: The pharmacist
    B: The doctor who prescribed it
    C: The Wyoming Highway Patrol
    D: You, the driver
  answer: D
  explanation: It is the driver's responsibility to know the effects of any medication
    they take. Being under the influence of a legally prescribed drug is not a defense
    against a DWUI charge in Wyoming.
- id: 140
  category: alcohol_drugs_health
  question: 'A second DWUI conviction within 10 years in Wyoming results in a mandatory
    license suspension of:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 3 years
  answer: C
  explanation: A second DWUI conviction within a 10-year period leads to a mandatory
    1-year suspension of driving privileges in Wyoming.
- id: 141
  category: alcohol_drugs_health
  question: After being served with a notice of suspension for a DWUI, how many days
    does a Wyoming driver have to request a hearing to contest the suspension?
  choices:
    A: 7 days
    B: 10 days
    C: 20 days
    D: 30 days
  answer: C
  explanation: A driver has 20 days from the date of the notice of suspension to request
    an administrative hearing through the Office of Administrative Hearings.
- id: 142
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in the context of driving safety?
  choices:
    A: The recovery time after a long trip
    B: The increased effect caused by combining alcohol and drugs
    C: The ability to focus on multiple hazards at once
    D: The reaction time improvement from caffeine
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs are taken together,
    often resulting in a much greater impairment than either substance would cause
    alone.
- id: 143
  category: alcohol_drugs_health
  question: 'In Wyoming, a third DWUI conviction within 10 years is punishable by
    a mandatory minimum jail term of:'
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: For a third DWUI conviction within 10 years in Wyoming, the law mandates
    a minimum of 30 days in jail, 15 of which must be served consecutively.
- id: 144
  category: alcohol_drugs_health
  question: Which of the following is true regarding marijuana and driving in Wyoming?
  choices:
    A: It is legal to drive if you have a medical card from another state
    B: It is only illegal if you are also drinking alcohol
    C: You can be convicted of DWUI if you are under the influence of marijuana to
      a degree that renders you incapable of safely driving
    D: Marijuana does not affect reaction time
  answer: C
  explanation: In Wyoming, DWUI laws apply to any controlled substance, including
    marijuana, that impairs your ability to drive safely.
- id: 145
  category: penalties_and_points
  question: If a Wyoming driver is convicted of 'Reckless Driving,' what is the maximum
    fine for a first offense?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: A first conviction for reckless driving in Wyoming carries a fine of
    up to $750 and/or up to 6 months in jail.
- id: 146
  category: penalties_and_points
  question: If you are convicted of four moving violations within a 12-month period,
    your Wyoming license will be suspended for how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Wyoming law mandates a 90-day license suspension for drivers who accumulate
    four moving violation convictions within a single 12-month period.
- id: 147
  category: penalties_and_points
  question: If you are required to file an SR-22 insurance form in Wyoming following
    a suspension, how long must you maintain this proof of financial responsibility?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers required to provide proof of financial responsibility (SR-22)
    must generally maintain it for 3 consecutive years from the date of the eligibility
    to reinstate.
- id: 148
  category: penalties_and_points
  question: What is the fine for a driver's first violation of the Wyoming seat belt
    law?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: In Wyoming, the fine for a driver failing to wear a seat belt is $25.
    If a passenger is unbuckled, the fine for that passenger is $10.
- id: 149
  category: penalties_and_points
  question: Under Wyoming law, what happens to the fines for speeding in a designated
    construction zone when workers are present?
  choices:
    A: They are increased by $50
    B: They are doubled
    C: They are tripled
    D: They remain the same but points are doubled
  answer: B
  explanation: Wyoming law dictates that fines for speeding in a construction zone
    are doubled if workers are present and the zone is properly marked.
- id: 150
  category: penalties_and_points
  question: A Wyoming driver's license will be revoked for which of the following
    offenses?
  choices:
    A: A single speeding ticket over 20 mph
    B: Failure to pay a parking ticket
    C: A felony conviction in which a motor vehicle was used
    D: Driving with a broken taillight
  answer: C
  explanation: Wyoming law requires mandatory license revocation for any felony conviction
    where a motor vehicle was used in the commission of the crime.
- id: 151
  category: penalties_and_points
  question: What is the maximum fine for a first-offense conviction of passing a stopped
    school bus with its red lights flashing and stop arm extended in Wyoming?
  choices:
    A: $100
    B: $250
    C: $435
    D: $1,000
  answer: C
  explanation: In Wyoming, the fine for passing a stopped school bus with its lights
    flashing can be up to $435 for a first offense.
- id: 152
  category: penalties_and_points
  question: If you are involved in an accident resulting in injury or death and fail
    to stop at the scene, what is the maximum fine you could face in Wyoming?
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: Leaving the scene of an accident involving injury or death is a serious
    offense in Wyoming, punishable by a fine of up to $5,000 and/or up to 1 year in
    jail.
- id: 153
  category: penalties_and_points
  question: Which of the following is a consequence of being convicted of driving
    while your license is suspended or revoked in Wyoming?
  choices:
    A: A mandatory fine of at least $50
    B: An automatic extension of the suspension for the same period as the original
      suspension
    C: A mandatory 24-hour community service requirement
    D: Permanent loss of driving privileges
  answer: B
  explanation: If convicted of driving while suspended or revoked, the Wyoming Department
    of Transportation will extend the suspension or revocation for an additional period
    equal to the original length.
- id: 154
  category: penalties_and_points
  question: If your Wyoming driver's license is suspended due to a DUI conviction,
    for how many years must you maintain SR-22 financial responsibility insurance
    after your driving privileges are restored?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers convicted of a DUI in Wyoming are required to maintain SR-22
    insurance for 3 years following the date of the suspension.
- id: 155
  category: penalties_and_points
  question: What is the maximum fine for a first-time violation of Wyoming's child
    restraint law (failing to secure a child under age 9 in an appropriate seat)?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: B
  explanation: In Wyoming, a first-time violation of the child restraint law carries
    a fine of up to $50. Subsequent violations can result in higher fines.
- id: 156
  category: penalties_and_points
  question: What is the maximum fine for a first-time violation of Wyoming's open
    container law (possessing an open alcoholic beverage in the passenger area)?
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: A first-time conviction for violating Wyoming's open container law
    is a misdemeanor punishable by a fine of up to $200.
- id: 157
  category: penalties_and_points
  question: 'A first conviction for reckless driving in Wyoming can result in a jail
    sentence of up to:'
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Reckless driving is a serious offense in Wyoming; a first conviction
    can lead to a fine and/or imprisonment for up to 6 months.
- id: 158
  category: penalties_and_points
  question: 'For a driver under the age of 21, a first conviction for driving with
    a BAC of 0.02% or higher results in a mandatory license suspension of:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Under Wyoming's 'Zero Tolerance' policy, a driver under 21 with a BAC
    of 0.02% or higher will face a 90-day license suspension for a first offense.
- id: 159
  category: penalties_and_points
  question: Operating a motor vehicle in Wyoming without valid liability insurance
    can result in a fine of up to how much for a first offense?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: A first-time offense for driving without insurance in Wyoming carries
    a fine ranging from $250 to $750.
- id: 160
  category: penalties_and_points
  question: In Wyoming, using a false name or making a false statement on a driver's
    license application is a felony punishable by up to how many years in prison?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: 10 years
  answer: B
  explanation: Providing false information on a license application is considered
    fraud and is a felony in Wyoming, punishable by up to 2 years in prison.
- id: 161
  category: penalties_and_points
  question: When passing another vehicle on a two-lane road in Wyoming, you must be
    able to see clearly for at least how many feet ahead to ensure the pass is safe
    and legal?
  choices:
    A: 500 feet
    B: 700 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: B
  explanation: The Wyoming Driver's Manual states you should not attempt to pass unless
    you have at least 700 feet of clear visibility.
- id: 162
  category: penalties_and_points
  question: 'A person who is convicted of three or more ''major'' moving violations
    (such as DUI or Reckless Driving) within a 5-year period will be declared a ''Habitual
    Violator'' and lose their license for:'
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanently
  answer: C
  explanation: Wyoming's Habitual Violator law mandates a 5-year license revocation
    for drivers with three major convictions within a 5-year period.
- id: 163
  category: sharing_the_road
  question: Under Wyoming law, when are you NOT required to stop for a school bus
    with flashing red lights?
  choices:
    A: When you are traveling in the opposite direction on a highway with a painted
      turn lane
    B: When you are traveling in the opposite direction on a roadway with four or
      more lanes
    C: When you are traveling in the opposite direction on a road separated by a physical
      barrier or median
    D: When the bus is stopped in a designated 'no-stop' zone
  answer: C
  explanation: In Wyoming, you do not have to stop if you are traveling in the opposite
    direction on a highway that is divided by a median or a physical barrier.
- id: 164
  category: sharing_the_road
  question: 'If you cannot safely move over for an emergency vehicle on a Wyoming
    highway with a speed limit of 45 mph or greater, you must slow down to at least:'
  choices:
    A: 10 mph below the posted speed limit
    B: 15 mph below the posted speed limit
    C: 20 mph below the posted speed limit
    D: The minimum speed limit of 45 mph
  answer: C
  explanation: Per Wyoming Statute 31-5-224, if moving over is not possible, the driver
    must slow down to at least 20 mph below the posted speed limit (if the limit is
    45 mph or higher).
- id: 165
  category: sharing_the_road
  question: In Wyoming, how many bicyclists are legally allowed to ride side-by-side
    (abreast) in a single lane?
  choices:
    A: No more than two
    B: No more than three
    C: Bicyclists must always ride in single file
    D: As many as can fit in the lane
  answer: A
  explanation: Wyoming law states that persons riding bicycles upon a roadway shall
    not ride more than two abreast except on paths or parts of roadways set aside
    for the exclusive use of bicycles.
- id: 166
  category: sharing_the_road
  question: 'When following a large commercial truck, if you cannot see the truck
    driver''s side mirrors, you are:'
  choices:
    A: In the truck's 'No-Zone' (blind spot)
    B: In a safe drafting position
    C: Following at a safe distance of 50 feet
    D: In the truck's 'Clear-Zone'
  answer: A
  explanation: The Wyoming Driver's Manual emphasizes that if you cannot see the driver's
    face in their side-view mirrors, they cannot see you, meaning you are in their
    blind spot or 'No-Zone'.
- id: 167
  category: sharing_the_road
  question: What is the maximum fine for a first-time offense of illegally passing
    a stopped school bus in Wyoming?
  choices:
    A: $150
    B: $250
    C: $435
    D: $1,000
  answer: C
  explanation: Under Wyoming law, the fine for a first offense of passing a stopped
    school bus with flashing red lights can be up to $435.
- id: 168
  category: sharing_the_road
  question: 'When a fire apparatus (fire truck) is responding to an alarm, Wyoming
    law prohibits following it closer than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Wyoming Statute 31-5-1204 prohibits drivers from following fire apparatus
    traveling in response to a fire alarm closer than 500 feet.
- id: 169
  category: sharing_the_road
  question: 'A slow-moving vehicle emblem (an orange triangle with a red border) must
    be displayed on the rear of any vehicle that travels at speeds less than:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The slow-moving vehicle emblem is required for vehicles designed to
    travel at speeds of 25 mph or less.
- id: 170
  category: sharing_the_road
  question: 'In Wyoming, when a pedestrian is crossing the street guided by a service
    animal or carrying a white cane, you must:'
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Proceed slowly if they are not in your direct path
    D: Yield only if there is a marked crosswalk
  answer: B
  explanation: Wyoming law requires drivers to yield the right-of-way to any blind
    pedestrian carrying a clearly visible white cane or accompanied by a guide dog.
- id: 171
  category: sharing_the_road
  question: When a motorcycle is in a lane, how much of the lane width are they entitled
    to use?
  choices:
    A: The left half only
    B: The right half only
    C: The full width of the lane
    D: Only the center portion
  answer: C
  explanation: Motorcycles are entitled to the full use of a lane, and motor vehicle
    drivers should never attempt to share a lane with a motorcycle.
- id: 172
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the driver may need to:'
  choices:
    A: Stay strictly in the right lane
    B: Swing wide to the left to clear the curb
    C: Turn from the left lane
    D: Stop and wait for all traffic to clear both lanes
  answer: B
  explanation: Large trucks have a wide turning radius and often need to swing wide
    to the left to complete a right turn without hitting the curb or other objects.
- id: 173
  category: sharing_the_road
  question: When passing a bicyclist in Wyoming, what is the minimum legal distance
    a motorist must maintain between their vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Wyoming law (WS 31-5-203) requires motorists to leave a safe distance
    when passing a bicycle, which is defined as at least three feet of separation.
- id: 174
  category: sharing_the_road
  question: 'In Wyoming, you are not required to stop for a school bus with flashing
    red lights if you are traveling in the opposite direction and:'
  choices:
    A: The road has four or more lanes
    B: The road is separated by a median or physical barrier
    C: The speed limit is over 55 mph
    D: You are at least 100 feet away
  answer: B
  explanation: Drivers traveling in the opposite direction of a school bus do not
    need to stop if the roadway is separated by a median or other physical barrier.
- id: 175
  category: sharing_the_road
  question: How much following distance should you maintain when traveling behind
    a motorcycle in Wyoming?
  choices:
    A: At least 1 second
    B: At least 2 seconds
    C: At least 4 seconds
    D: At least 10 seconds
  answer: C
  explanation: The Wyoming Driver's Manual recommends a following distance of at least
    four seconds when behind a motorcycle to allow the rider enough space to maneuver
    or stop in an emergency.
- id: 176
  category: sharing_the_road
  question: 'When an emergency vehicle with active sirens and lights approaches you
    from behind on a two-way road, you must:'
  choices:
    A: Stop exactly where you are
    B: Speed up to get out of the way
    C: Drive to the right-hand edge of the road and stop
    D: Move to the left-hand shoulder and stop
  answer: C
  explanation: Wyoming law requires drivers to pull to the right-hand edge or curb
    of the road and stop until the emergency vehicle has passed.
- id: 177
  category: sharing_the_road
  question: 'In Wyoming, bicyclists are legally required to ride:'
  choices:
    A: On the sidewalk only
    B: Against the flow of traffic
    C: As far to the right as practicable
    D: In the center of the lane at all times
  answer: C
  explanation: Bicyclists in Wyoming are required to ride as far to the right side
    of the roadway as practicable, except when turning or avoiding hazards.
- id: 178
  category: sharing_the_road
  question: According to the Wyoming Driver's Manual, what is the most common cause
    of car-motorcycle collisions?
  choices:
    A: Motorcyclists speeding
    B: Car drivers failing to see the motorcycle
    C: Mechanical failure
    D: Poor road conditions
  answer: B
  explanation: The manual states that the most common cause of accidents involving
    motorcycles is the driver of another vehicle failing to see the motorcycle in
    traffic.
- id: 179
  category: sharing_the_road
  question: When a pedestrian is in an unmarked crosswalk at an intersection in Wyoming,
    who has the right-of-way?
  choices:
    A: The motorist
    B: The pedestrian
    C: Whomever arrived at the intersection first
    D: The motorist, because the crosswalk is not marked
  answer: B
  explanation: In Wyoming, motorists must yield the right-of-way to pedestrians crossing
    the roadway within any marked or unmarked crosswalk at an intersection.
- id: 180
  category: vehicle_information
  question: 'In Wyoming, you must use your headlights from sunset to sunrise and whenever
    you cannot see clearly for at least:'
  choices:
    A: 200 feet
    B: 400 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Wyoming law requires headlights to be on from one-half hour after sunset
    to one-half hour before sunrise, and at any other time when visibility is less
    than 500 feet.
- id: 181
  category: vehicle_information
  question: 'According to Wyoming law, tires are considered unsafe and illegal if
    the tread depth is less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires must have at least 2/32 of an inch of tread depth in all major
    grooves to be considered safe and legal for operation in Wyoming.
- id: 182
  category: vehicle_information
  question: Wyoming law requires that window tinting on the front side windows must
    allow at least what percentage of light to pass through?
  choices:
    A: 20%
    B: 28%
    C: 35%
    D: 50%
  answer: B
  explanation: Wyoming Statute 31-5-962 states that the light transmission for windows
    to the immediate right and left of the driver shall not be less than 28%.
- id: 183
  category: vehicle_information
  question: Every motor vehicle in Wyoming must have a service brake system capable
    of stopping the vehicle within how many feet at a speed of 20 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Wyoming equipment standards require that the foot brake (service brake)
    must be able to stop the vehicle within 25 feet when traveling at 20 mph on a
    dry, level pavement.
- id: 184
  category: vehicle_information
  question: Wyoming law requires that every motor vehicle must be equipped with a
    mirror that allows the driver to see at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 150 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: All motor vehicles in Wyoming must have a mirror so located as to reflect
    to the driver a view of the highway for a distance of at least 200 feet to the
    rear.
- id: 185
  category: vehicle_information
  question: In Wyoming, it is illegal to operate a motor vehicle equipped with which
    of the following exhaust modifications?
  choices:
    A: A chrome exhaust tip
    B: A dual exhaust system
    C: A muffler cutout or bypass
    D: A catalytic converter
  answer: C
  explanation: Wyoming law prohibits the use of a muffler cutout, bypass, or similar
    device on a motor vehicle operated on a highway.
- id: 186
  category: vehicle_information
  question: 'In Wyoming, a ''Slow Moving Vehicle'' emblem must be displayed on the
    rear of any vehicle designed to operate at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The triangular 'Slow Moving Vehicle' emblem is required for vehicles
    designed to travel at speeds of 25 mph or less.
- id: 187
  category: vehicle_information
  question: For most standard passenger vehicles registered in Wyoming, how many license
    plates must be displayed?
  choices:
    A: One, on the rear only
    B: One, on the front only
    C: Two, one on the front and one on the rear
    D: Two, both on the rear bumper
  answer: C
  explanation: 'Wyoming law generally requires two license plates to be conspicuously
    displayed on most motor vehicles: one on the front and one on the rear.'
- id: 188
  category: vehicle_information
  question: 'Wyoming law requires every motor vehicle to have a horn that can be heard
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Every motor vehicle must be equipped with a horn in good working order
    capable of emitting sound audible under normal conditions from a distance of not
    less than 200 feet.
- id: 189
  category: vehicle_information
  question: In Wyoming, what is the maximum legal height for a vehicle, including
    the load, unless a special permit is obtained?
  choices:
    A: 12 feet, 6 inches
    B: 13 feet, 6 inches
    C: 14 feet
    D: 15 feet
  answer: C
  explanation: In Wyoming, the maximum height for any vehicle, including its load,
    is 14 feet unless a special permit has been issued.
- id: 190
  category: vehicle_information
  question: When towing a trailer in Wyoming, the drawbar or connection between the
    two vehicles must not exceed how many feet in length?
  choices:
    A: 8 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: Wyoming law specifies that the drawbar or other connection between
    a towing and a towed vehicle shall not exceed 15 feet in length.
- id: 191
  category: vehicle_information
  question: 'According to the Wyoming Driver''s Manual, headlights must be turned
    on from sunset to sunrise and whenever visibility is less than:'
  choices:
    A: 500 feet
    B: 750 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Wyoming law requires headlights to be in use from sunset to sunrise
    and at any other time when, due to insufficient light or unfavorable atmospheric
    conditions, persons and vehicles on the highway are not clearly discernible at
    a distance of 1,000 feet ahead.
- id: 192
  category: vehicle_information
  question: 'To be considered safe and legal in Wyoming, tires must have a minimum
    tread depth of at least:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Wyoming law requires that tires have a tread depth of at least 2/32
    of an inch in any two adjacent major tread grooves.
- id: 193
  category: vehicle_information
  question: 'Under Wyoming law, the service brakes on a passenger vehicle must be
    capable of stopping the vehicle from a speed of 20 mph within a distance of:'
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 50 feet
  answer: B
  explanation: Wyoming equipment standards require that the service brakes on a passenger
    vehicle be able to stop the vehicle within 25 feet when traveling at 20 mph.
- id: 194
  category: vehicle_information
  question: Regarding vehicle exhaust systems, which of the following is illegal under
    Wyoming law?
  choices:
    A: Using a muffler that meets manufacturer specifications
    B: Using a muffler cutout, bypass, or similar device
    C: Having an exhaust pipe that extends to the rear of the vehicle
    D: Using a muffler that reduces engine noise
  answer: B
  explanation: Wyoming law prohibits the use of a muffler cutout, bypass, or similar
    device on any motor vehicle operated on a highway.
- id: 195
  category: vehicle_information
  question: In Wyoming, the windows to the immediate right and left of the driver
    must allow at least what percentage of light to pass through?
  choices:
    A: 20%
    B: 28%
    C: 35%
    D: 50%
  answer: B
  explanation: Wyoming law (W.S. 31-5-962) states that window tinting on the side
    windows must allow at least 28% light transmission.
- id: 196
  category: vehicle_information
  question: 'A Slow Moving Vehicle (SMV) emblem is required in Wyoming for any vehicle
    designed to travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The triangular, fluorescent orange SMV emblem must be displayed on
    the rear of vehicles designed to travel at 25 mph or less.
- id: 197
  category: vehicle_information
  question: 'A motor vehicle''s horn in Wyoming must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Wyoming statutes require every motor vehicle to be equipped with a
    horn capable of emitting sound audible under normal conditions from a distance
    of not less than 200 feet.
- id: 198
  category: vehicle_information
  question: 'Wyoming law requires the rear license plate to be illuminated by a white
    light so that it is clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The rear license plate must be illuminated so that it is visible and
    legible from a distance of 50 feet to the rear.
- id: 199
  category: vehicle_information
  question: Under Wyoming law, turn signal lights must be visible from a distance
    of not less than how many feet in normal sunlight?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Wyoming equipment regulations require that turn signals be visible
    from a distance of at least 100 feet in normal sunlight.
- id: 200
  category: vehicle_information
  question: When towing a trailer or another vehicle in Wyoming, what equipment is
    required in addition to the primary hitch?
  choices:
    A: A red flag
    B: Safety chains
    C: A secondary hitch ball
    D: An auxiliary battery
  answer: B
  explanation: Wyoming law requires safety chains or cables to be used in addition
    to the primary hitch to prevent the trailer from separating if the hitch fails.
- id: 201
  category: vehicle_information
  question: In Wyoming, if you are involved in a crash where damage to property appears
    to be over what amount, you must immediately notify the police?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: B
  explanation: Wyoming law requires immediate notification of law enforcement for
    any crash resulting in injury, death, or total property damage to an apparent
    extent of $1,000 or more.
- id: 202
  category: signs_and_signals
  question: What does a flashing yellow arrow signal mean in Wyoming?
  choices:
    A: Stop and wait for a green arrow.
    B: Turns are permitted, but you must first yield to oncoming traffic and pedestrians.
    C: The signal is about to turn red; clear the intersection immediately.
    D: You have the right-of-way to turn left.
  answer: B
  explanation: A flashing yellow arrow means left turns are allowed, but you must
    yield to oncoming traffic and pedestrians before completing the turn.
- id: 203
  category: signs_and_signals
  question: When using hand signals to indicate a turn, what does it mean when the
    driver's arm is extended downward?
  choices:
    A: Left turn
    B: Right turn
    C: Stop or decrease speed
    D: U-turn
  answer: C
  explanation: In Wyoming, the hand signal for stopping or slowing down is the arm
    extended downward with the palm facing the rear.
- id: 204
  category: signs_and_signals
  question: 'A solid white line between lanes of traffic moving in the same direction
    indicates:'
  choices:
    A: Lane changes are encouraged.
    B: Lane changes are discouraged.
    C: The road is about to end.
    D: You are on a one-way street.
  answer: B
  explanation: A solid white line is used to separate lanes of traffic moving in the
    same direction and indicates that lane changes are discouraged for safety reasons.
- id: 205
  category: signs_and_signals
  question: 'A traffic sign in the shape of a pentagon (five-sided) is used exclusively
    for:'
  choices:
    A: Stop signs
    B: Yield signs
    C: School zones or school crossings
    D: Railroad crossings
  answer: C
  explanation: The pentagon shape is reserved for school zones and school crossing
    signs to alert drivers to the presence of children.
- id: 206
  category: signs_and_signals
  question: 'In Wyoming, you may turn right on a red light after a complete stop EXCEPT:'
  choices:
    A: During nighttime hours.
    B: If there is a sign prohibiting it.
    C: If you are in a residential area.
    D: If you have a passenger under 18.
  answer: B
  explanation: Wyoming law allows a right turn on red after a complete stop and yielding
    to traffic/pedestrians, unless a 'No Turn on Red' sign is posted.
- id: 207
  category: signs_and_signals
  question: 'A steady yellow traffic light means:'
  choices:
    A: Speed up to clear the intersection.
    B: The light is about to turn green.
    C: The light is about to turn red; stop if it is safe to do so.
    D: You have the right-of-way to turn left.
  answer: C
  explanation: A steady yellow light warns that the signal is changing to red. Drivers
    should stop if they can do so safely; otherwise, they should clear the intersection.
- id: 208
  category: signs_and_signals
  question: What is the purpose of a shared center lane marked with solid and broken
    yellow lines on both sides?
  choices:
    A: Passing slower traffic.
    B: Emergency parking only.
    C: Making left turns from either direction.
    D: High-occupancy vehicles only.
  answer: C
  explanation: Shared center turn lanes are reserved for making left turns by vehicles
    traveling in either direction. They should not be used for passing.
- id: 209
  category: signs_and_signals
  question: 'A ''Crossbuck'' sign at a railroad crossing should be treated the same
    as a:'
  choices:
    A: Stop sign
    B: Yield sign
    C: Speed limit sign
    D: No passing zone sign
  answer: B
  explanation: The railroad crossbuck sign is a regulatory sign that requires drivers
    to yield to any approaching trains.
- id: 210
  category: signs_and_signals
  question: 'A diamond-shaped sign with a yellow background is a:'
  choices:
    A: Regulatory sign
    B: Guide sign
    C: Warning sign
    D: Service sign
  answer: C
  explanation: Yellow diamond-shaped signs are warning signs that alert drivers to
    potential hazards or changes in road conditions ahead.
- id: 211
  category: signs_and_signals
  question: 'According to Wyoming''s ''Move Over'' law, when approaching an emergency
    vehicle with flashing lights stopped on the side of a multi-lane highway, you
    must:'
  choices:
    A: Maintain your speed and stay in your lane.
    B: Move to the lane farthest from the emergency vehicle if safe to do so.
    C: Stop immediately in the roadway.
    D: Honk your horn to alert the emergency workers.
  answer: B
  explanation: Wyoming law requires drivers to move to a non-adjacent lane when approaching
    a stationary emergency vehicle with flashing lights, or slow down significantly
    if moving over is not possible.
- id: 212
  category: signs_and_signals
  question: In Wyoming, what does a flashing red traffic light signify?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to turn green
    C: Stop completely and proceed only when safe
    D: Yield to oncoming traffic but do not stop
  answer: C
  explanation: According to the Wyoming Driver's Manual, a flashing red light means
    the same as a stop sign. You must come to a complete stop and proceed only when
    it is safe to do so.
- id: 213
  category: signs_and_signals
  question: When passing a school zone in Wyoming, what is the speed limit when lights
    are flashing or signs are posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Wyoming state law sets the speed limit in school zones at 20 mph when
    the appropriate signs are posted or flashing lights are in operation.
- id: 214
  category: signs_and_signals
  question: What does a solid yellow line on your side of a two-lane road indicate
    in Wyoming?
  choices:
    A: You may pass if no traffic is coming
    B: Construction zone ahead
    C: Passing is prohibited
    D: Shoulder work ahead
  answer: C
  explanation: A solid yellow line on your side of the center line means that passing
    is prohibited for vehicles traveling in your direction.
- id: 215
  category: signs_and_signals
  question: 'To signal a right turn using hand signals, a Wyoming driver should:'
  choices:
    A: Extend the left arm straight out the window
    B: Extend the left arm out and bend it upward at the elbow
    C: Extend the left arm out and bend it downward at the elbow
    D: Extend the right arm straight out the window
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at a 90-degree angle.
- id: 216
  category: signs_and_signals
  question: 'In Wyoming, a pentagon-shaped sign (five sides) always indicates:'
  choices:
    A: A railroad crossing
    B: A stop sign
    C: A school zone or school crossing
    D: A yield sign
  answer: C
  explanation: Pentagon-shaped signs are reserved specifically for school zones and
    school crossings to warn drivers of children in the area.
- id: 217
  category: signs_and_signals
  question: What is the primary meaning of an orange diamond-shaped sign in Wyoming?
  choices:
    A: General warning of road hazards
    B: Construction or maintenance warning
    C: Directional guidance to state parks
    D: Regulatory speed limit
  answer: B
  explanation: Orange is the standard color for construction and maintenance signs
    in Wyoming, used to alert drivers to work zones.
- id: 218
  category: signs_and_signals
  question: 'When approaching a steady yellow traffic light in Wyoming, you should:'
  choices:
    A: Speed up to beat the red light
    B: Stop if you can do so safely before entering the intersection
    C: Stop immediately, even if you are in the middle of the intersection
    D: Treat it like a stop sign
  answer: B
  explanation: A steady yellow light indicates the signal is changing to red. Drivers
    should stop if they can do so safely; otherwise, they should clear the intersection
    cautiously.
- id: 219
  category: signs_and_signals
  question: 'A solid white line painted on the right edge of the roadway is known
    as a:'
  choices:
    A: Stop line
    B: Center line
    C: Fog line
    D: Yield line
  answer: C
  explanation: Solid white lines on the right side of the road are called fog lines.
    They help drivers stay on the road during poor visibility conditions.
- id: 220
  category: signs_and_signals
  question: What does a 'Crossbuck' sign (X-shape) indicate?
  choices:
    A: A four-way intersection
    B: A hospital nearby
    C: A railroad crossing
    D: No passing zone
  answer: C
  explanation: The crossbuck sign is a regulatory sign used at railroad crossings
