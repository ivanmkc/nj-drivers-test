questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima que debe alcanzar una persona para solicitar un
    permiso de aprendizaje en Wyoming?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: B
  explanation: Según el Manual del Conductor de Wyoming, el solicitante debe tener
    al menos 15 años para solicitar un permiso de aprendizaje.
- id: 2
  category: license_system
  question: Según las leyes de Licencia de Conducir Graduada (GDL) de Wyoming, ¿entre
    qué horas tiene restringido conducir el titular de un permiso intermedio?
  choices:
    A: 10:00 PM y 4:00 AM
    B: 11:00 PM y 5:00 AM
    C: Medianoche y 6:00 AM
    D: 9:00 PM y 5:00 AM
  answer: B
  explanation: La ley de Wyoming prohíbe a los titulares de permisos intermedios conducir
    entre las 11:00 PM y las 5:00 AM, a menos que sea por trabajo, escuela o una emergencia
    médica.
- id: 3
  category: license_system
  question: ¿Cuántos pasajeros menores de 18 años (que no sean familiares directos)
    puede llevar en el vehículo el titular de un permiso intermedio?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Las regulaciones de GDL de Wyoming establecen que los titulares de
    permisos intermedios no pueden transportar a más de un pasajero menor de 18 años
    que no sea un familiar directo.
- id: 4
  category: license_system
  question: Si se muda a una nueva residencia dentro de Wyoming, ¿cuántos días tiene
    para notificar al Programa de Servicios al Conductor sobre su cambio de dirección?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: La ley de Wyoming exige que los conductores notifiquen a Servicios
    al Conductor sobre un cambio de dirección o nombre en un plazo de 10 días.
- id: 5
  category: license_system
  question: 'Para cumplir con los requisitos de visión para una licencia de conducir
    de Wyoming, su agudeza visual debe ser de al menos:'
  choices:
    A: 20/20 en ambos ojos
    B: 20/40 en al menos un ojo
    C: 20/50 en ambos ojos
    D: 20/30 en el ojo dominante
  answer: B
  explanation: Para calificar para una licencia de conducir de Wyoming, el solicitante
    debe tener una visión de al menos 20/40 en al menos un ojo, con o sin lentes correctivos.
- id: 6
  category: license_system
  question: ¿A qué edad puede un residente de Wyoming solicitar una licencia de conducir
    completa y sin restricciones si NO ha completado un curso de educación vial aprobado?
  choices:
    A: 16 años
    B: 16 años y medio
    C: 17 años
    D: 18 años
  answer: C
  explanation: En Wyoming, si no ha completado un curso de educación vial, debe tener
    al menos 17 años para recibir una licencia completa y sin restricciones.
- id: 7
  category: license_system
  question: Wyoming puede emitir una licencia 'Clase RC o RM restringida' a personas
    de tan solo 14 años por ¿cuál de los siguientes motivos?
  choices:
    A: Para conducir solo a un trabajo de medio tiempo
    B: Inconveniente extremo o dificultad (por ejemplo, vivir a más de 5 millas de
      la escuela)
    C: El solicitante ha completado un programa de carreras de secundaria
    D: No hay otros conductores con licencia en el hogar
  answer: B
  explanation: Wyoming ofrece una licencia restringida para jóvenes de 14 y 15 años
    que puedan demostrar un inconveniente extremo, como vivir a más de cinco millas
    de la escuela o tener una necesidad médica.
- id: 8
  category: license_system
  question: Una licencia de conducir de Wyoming suele ser válida por ¿cuántos años
    para personas entre las edades de 21 y 64 años?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: D
  explanation: Las licencias de conducir estándar de Wyoming emitidas a adultos son
    válidas por un período de 10 años.
- id: 9
  category: license_system
  question: ¿Cuántas condenas por infracciones de tránsito en movimiento dentro de
    un período de 12 meses resultarán en una suspensión obligatoria de su licencia
    de conducir de Wyoming?
  choices:
    A: 2 infracciones
    B: 3 infracciones
    C: 4 infracciones
    D: 5 infracciones
  answer: C
  explanation: Según la ley de Wyoming, si es condenado por 4 infracciones de tránsito
    en movimiento dentro de cualquier período de 12 meses, sus privilegios de conducir
    serán suspendidos por 90 días.
- id: 10
  category: license_system
  question: Al conducir con un permiso de aprendizaje de Wyoming, ¿qué edad mínima
    debe tener el conductor supervisor?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: La edad del tutor legal del titular del permiso
  answer: B
  explanation: El titular de un permiso de aprendizaje debe estar acompañado por un
    conductor con licencia que tenga al menos 18 años de edad y ocupe el asiento al
    lado del conductor.
- id: 11
  category: license_system
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    un conductor menor de 21 años en Wyoming?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Wyoming tiene una política de "tolerancia cero" para el consumo de
    alcohol y la conducción de menores de edad; el límite legal de BAC para conductores
    menores de 21 años es de 0.02%.
- id: 12
  category: license_system
  question: Para solicitar una licencia de conducir de Wyoming, ¿cuántos documentos
    que demuestren la residencia en Wyoming debe proporcionar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene un SSN válido
  answer: B
  explanation: Los solicitantes de una licencia de conducir o tarjeta de identificación
    de Wyoming deben proporcionar dos documentos para demostrar su dirección residencial
    actual en Wyoming.
- id: 13
  category: license_system
  question: En Wyoming, su privilegio de conducir puede ser suspendido si se encuentra
    en mora con respecto a ¿cuál de los siguientes?
  choices:
    A: Préstamos estudiantiles
    B: Deuda de tarjeta de crédito
    C: Manutención de los hijos ordenada por la corte
    D: Impuestos sobre la propiedad
  answer: C
  explanation: La ley de Wyoming permite la suspensión de la licencia de conducir
    si la persona tiene pagos atrasados en la manutención de los hijos ordenada por
    la corte.
- id: 14
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia de Conducir Comercial
    (CDL) en Wyoming para el comercio intraestatal (solo dentro de Wyoming)?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 25 años
  answer: B
  explanation: En Wyoming, debe tener al menos 18 años para solicitar una CDL para
    uso intraestatal. Debe tener 21 años para conducir de forma interestatal (cruzando
    las fronteras estatales).
- id: 15
  category: license_system
  question: Si es menor de 18 años y solicita un permiso o licencia en Wyoming, ¿quién
    debe firmar su solicitud?
  choices:
    A: Solo el solicitante
    B: El director de una escuela
    C: Un padre o tutor legal
    D: Cualquier conductor con licencia mayor de 21 años
  answer: C
  explanation: Para cualquier solicitante menor de 18 años, un padre o tutor legal
    debe firmar el formulario de solicitud para aceptar la responsabilidad financiera.
- id: 16
  category: license_system
  question: Después de convertirse en residente de Wyoming, ¿cuánto tiempo tiene para
    solicitar una licencia de conducir de Wyoming?
  choices:
    A: 30 días
    B: 60 días
    C: 120 días
    D: Un año
  answer: D
  explanation: De acuerdo con el Manual del Conductor de Wyoming, los nuevos residentes
    deben solicitar una licencia de conducir de Wyoming dentro del plazo de un año
    tras convertirse en residentes.
- id: 17
  category: license_system
  question: En Wyoming, ¿cuáles son los requisitos mínimos de cobertura de seguro
    de responsabilidad civil para un solo vehículo?
  choices:
    A: $15,000/$30,000/$10,000
    B: $25,000/$50,000/$20,000
    C: $50,000/$100,000/$25,000
    D: $20,000/$40,000/$15,000
  answer: B
  explanation: La ley de Wyoming exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones corporales a una persona, $50,000 por lesiones corporales
    a dos o más personas y $20,000 por daños a la propiedad.
- id: 18
  category: license_system
  question: Antes de solicitar un Permiso Intermedio, ¿cuántas horas de práctica de
    conducción supervisada debe completar un conductor de Wyoming?
  choices:
    A: 30 horas (5 de noche)
    B: 40 horas (10 de noche)
    C: 50 horas (10 de noche)
    D: 60 horas (15 de noche)
  answer: C
  explanation: Los requisitos del sistema de licencia graduada (GDL) de Wyoming establecen
    que el titular de un permiso debe completar 50 horas de conducción al volante,
    incluyendo 10 horas de conducción nocturna, certificadas por un padre o tutor.
- id: 19
  category: license_system
  question: 'Si cambia su nombre legal, debe notificar al Programa de Servicios al
    Conductor de Wyoming y solicitar una nueva licencia dentro de:'
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Wyoming exige que notifique a Servicios al Conductor dentro
    de los 10 días posteriores a cualquier cambio de nombre o dirección.
- id: 20
  category: license_system
  question: Una "Licencia de Prueba" (Probationary License) de Wyoming se emite típicamente
    a conductores cuyos privilegios de conducir han sido suspendidos por ¿cuál de
    las siguientes razones?
  choices:
    A: Conducción temeraria
    B: Una primera condena por DUI
    C: Ser un infractor habitual
    D: Falta de pago de la manutención de los hijos
  answer: B
  explanation: Se puede emitir una Licencia de Prueba a una persona cuya licencia
    esté suspendida por una primera infracción de DUI o por acumulación de puntos,
    permitiéndole conducir por motivos de trabajo, educación o salud.
- id: 21
  category: license_system
  question: Según la ley de Wyoming, ¿qué sucede si un padre o tutor legal que firmó
    la solicitud de licencia de un menor decide retirar su firma?
  choices:
    A: El menor es multado con $100
    B: La licencia del menor es cancelada
    C: La licencia del menor se degrada a un permiso
    D: No sucede nada hasta que la licencia expire
  answer: B
  explanation: Si la persona que firmó la solicitud de la licencia de un menor solicita
    que se cancele la licencia, el DOT de Wyoming cancelará la licencia.
- id: 22
  category: license_system
  question: En Wyoming, ¿durante cuánto tiempo debe una persona tener un Permiso de
    Aprendizaje (Learner's Permit) antes de ser elegible para solicitar un Permiso
    Intermedio (Intermediate Permit)?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Bajo el sistema de Licencia de Conducir Graduada (GDL) de Wyoming,
    un conductor debe tener un Permiso de Aprendizaje durante al menos 6 meses antes
    de pasar a la etapa intermedia.
- id: 23
  category: license_system
  question: La ley de Wyoming exige que los solicitantes masculinos de entre 18 y
    25 años estén registrados en el Sistema de Servicio Selectivo. ¿Cómo se maneja
    esto durante el proceso de obtención de la licencia?
  choices:
    A: Los solicitantes deben proporcionar una tarjeta de registro
    B: Los solicitantes deben registrarse en línea antes de llegar
    C: Solicitar una licencia registra automáticamente al solicitante
    D: Es opcional y no afecta la licencia
  answer: C
  explanation: Por ley, solicitar una licencia de conducir o una tarjeta de identificación
    de Wyoming sirve como consentimiento para el registro en el Sistema de Servicio
    Selectivo para hombres de 18 a 25 años.
- id: 24
  category: license_system
  question: ¿Con qué frecuencia son elegibles los residentes de Wyoming para renovar
    su licencia de conducir por correo?
  choices:
    A: En cada ciclo de renovación
    B: Cada dos ciclos de renovación (una vez cada 8 años)
    C: Solo si son mayores de 65 años
    D: Solo si están en servicio militar activo
  answer: B
  explanation: Wyoming permite la renovación por correo una vez cada 8 años, lo que
    significa que debe presentarse en persona cada dos ciclos de renovación para actualizar
    su foto y el examen de la vista.
- id: 25
  category: license_system
  question: ¿Cuál es la tarifa estándar para restablecer una licencia de conducir
    de Wyoming después de haber sido suspendida?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: B
  explanation: La tarifa estándar de restablecimiento para una licencia de conducir
    de Wyoming suspendida es de $50.
- id: 26
  category: license_system
  question: ¿Una licencia de conducir 'Clase C' de Wyoming autoriza al titular a operar
    cuál de los siguientes?
  choices:
    A: Cualquier combinación de vehículos de más de 26,001 libras
    B: Solo motocicletas
    C: Vehículos sencillos con un GVWR de menos de 26,001 libras
    D: Vehículos comerciales que transporten materiales peligrosos
  answer: C
  explanation: Una licencia Clase C es la licencia no comercial estándar para vehículos
    sencillos con una Clasificación de Peso Bruto del Vehículo (GVWR) de menos de
    26,001 libras.
- id: 27
  category: license_system
  question: 'Al solicitar o renovar una licencia de conducir de Wyoming, también puede
    registrarse para votar si tiene al menos:'
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: C
  explanation: Bajo la ley 'Motor Voter', los residentes de Wyoming que tengan al
    menos 18 años pueden registrarse para votar en la oficina de Servicios al Conductor
    mientras solicitan una licencia.
- id: 28
  category: license_system
  question: Si pierde su licencia de conducir de Wyoming, ¿cuál es la tarifa por una
    licencia de reemplazo (duplicado)?
  choices:
    A: $10
    B: $20
    C: $30
    D: $40
  answer: B
  explanation: La tarifa por un duplicado (reemplazo) de la licencia de conducir de
    Wyoming es de $20.
- id: 29
  category: license_system
  question: Si reprueba el examen de habilidades de conducción de Wyoming, ¿cuánto
    tiempo debe esperar antes de ser elegible para volver a tomar el examen?
  choices:
    A: 24 horas
    B: 48 horas
    C: Una semana
    D: 30 días
  answer: A
  explanation: En Wyoming, si reprueba el examen de habilidades de conducción, debe
    esperar al menos 24 horas antes de poder intentar el examen nuevamente.
- id: 30
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un residente de Wyoming
    tenga la designación de 'Donante de Órganos' en su licencia?
  choices:
    A: Debe tener al menos 21 años
    B: Debe pagar una tarifa adicional de $5
    C: Debe indicar su deseo de ser donante en la solicitud
    D: Debe proporcionar una nota escrita de un médico
  answer: C
  explanation: Cualquier persona puede indicar su deseo de ser donante de órganos
    en su solicitud de licencia; si el solicitante es menor de 18 años, se requiere
    el consentimiento de los padres.
- id: 31
  category: driver_testing
  question: ¿Cuál es el límite de velocidad máximo en las autopistas interestatales
    rurales en Wyoming, a menos que se indique lo contrario?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: Según el Manual del Conductor de Wyoming, el límite de velocidad máximo
    en las autopistas interestatales rurales es de 80 mph, a menos que se indique
    lo contrario.
- id: 32
  category: driver_testing
  question: Al estacionar su vehículo cerca de un hidrante de incendios en Wyoming,
    ¿cuál es la distancia mínima que debe mantener?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: La ley de Wyoming prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 33
  category: driver_testing
  question: En Wyoming, ¿con cuántos pies de antelación, como mínimo, debe señalizar
    su intención de girar en áreas urbanas?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: El Manual del Conductor de Wyoming establece que debe señalizar al
    menos 100 pies antes de realizar un giro.
- id: 34
  category: driver_testing
  question: Al conducir de noche en Wyoming, ¿a cuántos pies de un vehículo que viene
    en sentido contrario debe bajar las luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Wyoming exige que los conductores bajen las luces altas cuando
    un vehículo que viene en sentido contrario se encuentra a menos de 500 pies.
- id: 35
  category: driver_testing
  question: 'En Wyoming, se debe presentar un informe de accidente por escrito (SR-21)
    ante el Departamento de Transporte si hay una muerte, lesiones personales o daños
    a la propiedad de cualquier persona que asciendan a al menos:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: B
  explanation: La ley de Wyoming exige que se presente un informe de accidente si
    los daños a la propiedad son de $1,000 o más, o si hay lesiones o muerte.
- id: 36
  category: driver_testing
  question: Al estacionar cerca de una señal de alto, una señal de ceda el paso o
    un semáforo en Wyoming, ¿a cuántos pies de distancia debe estar como mínimo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Wyoming establece que no se puede estacionar a menos de 30
    pies de cualquier baliza intermitente, señal de alto, señal de ceda el paso o
    señal de control de tráfico ubicada al costado de una carretera.
- id: 37
  category: driver_testing
  question: Según la ley de Wyoming, ¿hasta qué edad deben los niños estar sujetos
    adecuadamente en un sistema de retención infantil?
  choices:
    A: 6 años
    B: 7 años
    C: 8 años
    D: 9 años
  answer: D
  explanation: La ley de Wyoming exige que los niños utilicen un sistema de retención
    infantil hasta que cumplan 9 años, a menos que hayan superado los límites de peso
    o altura del sistema.
- id: 38
  category: driver_testing
  question: 'Bajo la Ley de Consentimiento Implícito de Wyoming, si se niega a someterse
    a una prueba química de alcohol o drogas por primera vez, su licencia de conducir
    será suspendida por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Bajo la Ley de Consentimiento Implícito, la primera negativa a realizarse
    una prueba química resulta en una suspensión de la licencia de conducir por 6
    meses.
- id: 39
  category: driver_testing
  question: Cuando un autobús escolar se detiene en una carretera de cuatro carriles
    con sus luces rojas intermitentes y el brazo de parada extendido, ¿qué conductores
    deben detenerse?
  choices:
    A: Solo los conductores que siguen al autobús
    B: Solo los conductores en el carril contiguo al autobús
    C: Los conductores en todos los carriles, independientemente de la dirección
    D: Solo los conductores en el lado opuesto de la carretera
  answer: C
  explanation: En Wyoming, en cualquier carretera (incluidas las de cuatro carriles)
    que no esté separada por una mediana o barrera física, el tráfico en ambas direcciones
    debe detenerse ante un autobús escolar con luces rojas intermitentes.
- id: 40
  category: driver_testing
  question: ¿Qué exige la ley "Move Over" de Wyoming que hagan los conductores al
    acercarse a un vehículo de emergencia estacionario con luces intermitentes en
    una carretera con al menos dos carriles en la misma dirección?
  choices:
    A: Detenerse por completo hasta que se les indique pasar
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Cambiarse al carril más alejado del vehículo de emergencia si es seguro hacerlo
    D: Acelerar para pasar por la escena lo más rápido posible
  answer: C
  explanation: La ley de Wyoming exige que los conductores se muevan al carril más
    alejado de los vehículos de emergencia, mantenimiento o remolque si es seguro
    hacerlo.
- id: 41
  category: driver_testing
  question: 'En Wyoming, el límite de velocidad en una zona escolar es típicamente
    de:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El límite de velocidad estándar en las zonas escolares de Wyoming es
    de 20 mph cuando las luces están parpadeando o hay niños presentes.
- id: 42
  category: driver_testing
  question: 'Para mantener una distancia de seguimiento segura detrás del vehículo
    que está delante de usted en condiciones ideales, el Manual del Conductor de Wyoming
    recomienda utilizar la:'
  choices:
    A: Regla de un segundo
    B: Regla de dos segundos
    C: Regla de tres segundos
    D: Regla de cuatro segundos
  answer: C
  explanation: Wyoming recomienda una distancia de seguimiento de al menos tres segundos
    para permitir suficiente tiempo para reaccionar ante peligros.
- id: 43
  category: driver_testing
  question: ¿En Wyoming, es ilegal estacionar su vehículo a menos de cuántos pies
    de un paso de peatones en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: C
  explanation: La ley de Wyoming prohíbe estacionar a menos de 20 pies de un paso
    de peatones en una intersección.
- id: 44
  category: driver_testing
  question: 'Para un conductor adulto (21 años o más) en Wyoming, una primera condena
    por DWUI (conducir bajo la influencia) puede resultar en una suspensión de la
    licencia de conducir de hasta:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Una primera condena por DWUI (Driving While Under the Influence) para
    un adulto en Wyoming generalmente resulta en una suspensión de la licencia de
    90 días.
- id: 45
  category: driver_testing
  question: Después de convertirse en residente de Wyoming, ¿cuántos días tiene para
    registrar su vehículo en el estado?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: D
  explanation: Según el Manual del Conductor de Wyoming, los nuevos residentes tienen
    120 días para registrar sus vehículos después de establecer la residencia.
- id: 46
  category: driver_testing
  question: Si reprueba el examen de habilidades de conducción (práctico) de Wyoming,
    ¿cuál es el período de espera mínimo antes de poder intentar el examen nuevamente?
  choices:
    A: 24 horas
    B: 48 horas
    C: 7 días
    D: 30 días
  answer: A
  explanation: Si un solicitante reprueba el examen de habilidades, debe esperar al
    menos 24 horas antes de ser elegible para volver a tomarlo.
- id: 47
  category: driver_testing
  question: 'Para cumplir con los estándares de visión de Wyoming para una licencia
    de conducir, un solicitante debe tener un campo de visión horizontal combinado
    de al menos:'
  choices:
    A: 90 grados
    B: 100 grados
    C: 120 grados
    D: 140 grados
  answer: C
  explanation: Wyoming requiere un campo de visión horizontal de al menos 120 grados
    para calificar para una licencia de conducir estándar.
- id: 48
  category: driver_testing
  question: ¿Cuál es la puntuación mínima de aprobación requerida en el examen escrito
    de conocimientos de Wyoming?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: El examen escrito de conocimientos de Wyoming consta de 25 preguntas,
    y se requiere una puntuación del 80% (20 respuestas correctas) para aprobar.
- id: 49
  category: driver_testing
  question: 'En Wyoming, debe presentar un ''Informe de Accidente de Tráfico'' ante
    el Departamento de Transporte si un accidente resulta en daños a la propiedad
    de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: B
  explanation: La ley de Wyoming requiere un informe por escrito para cualquier accidente
    que resulte en lesiones, muerte o daños totales a la propiedad de $1,000 o más.
- id: 50
  category: driver_testing
  question: 'Los residentes de Wyoming que son elegibles para renovar su licencia
    por correo pueden hacerlo solo una vez cada:'
  choices:
    A: 4 años
    B: 8 años
    C: 10 años
    D: 12 años
  answer: B
  explanation: Los conductores elegibles pueden renovar su licencia por correo una
    vez cada ocho años, lo que significa que una de cada dos renovaciones debe realizarse
    en persona.
- id: 51
  category: driver_testing
  question: ¿Cuál es la multa por una primera condena por operar un vehículo motorizado
    en Wyoming sin un seguro de responsabilidad civil válido?
  choices:
    A: Entre $50 y $100
    B: Entre $100 y $250
    C: Entre $250 y $750
    D: Exactamente $1,000
  answer: C
  explanation: Una primera condena por falta de seguro en Wyoming conlleva una multa
    que oscila entre $250 y $750 y/o hasta seis meses de cárcel.
- id: 52
  category: driver_testing
  question: La ley de Wyoming exige que las placas de matrícula se exhiban en ¿qué
    parte(s) de la mayoría de los vehículos de pasajeros?
  choices:
    A: Solo en la parte trasera
    B: Solo en la parte delantera
    C: Tanto en la parte delantera como en la trasera
    D: En la parte trasera y dentro del parabrisas delantero
  answer: C
  explanation: La ley de Wyoming exige que la mayoría de los vehículos exhiban placas
    de matrícula tanto en la parte delantera como en la trasera del vehículo.
- id: 53
  category: driver_testing
  question: 'Una licencia de conducir estándar de Clase C de Wyoming permite al titular
    remolcar un vehículo con una Clasificación de Peso Bruto del Vehículo (GVWR) de
    no más de:'
  choices:
    A: 5,000 lbs
    B: 10,000 lbs
    C: 15,000 lbs
    D: 26,000 lbs
  answer: B
  explanation: Una licencia de Clase C permite la operación de un solo vehículo que
    pese menos de 26,001 lbs y remolcar un vehículo que no exceda las 10,000 lbs de
    GVWR.
- id: 54
  category: driver_testing
  question: ¿Cuál es la tarifa actual para obtener un duplicado de la licencia de
    conducir de Wyoming si la suya se pierde o se destruye?
  choices:
    A: $5
    B: $15
    C: $25
    D: $45
  answer: B
  explanation: La tarifa por un duplicado de la licencia de conducir en Wyoming es
    de $15.
- id: 55
  category: driver_testing
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la ley
    de cinturones de seguridad de Wyoming?
  choices:
    A: Es una infracción primaria; la policía puede detenerlo solo por no usar el
      cinturón.
    B: Es una infracción secundaria; solo puede ser citado si lo detienen por otra
      infracción.
    C: Los cinturones de seguridad solo son obligatorios para pasajeros menores de
      12 años.
    D: Los cinturones de seguridad solo son obligatorios en las autopistas interestatales.
  answer: B
  explanation: La ley de cinturones de seguridad de Wyoming es una ley de aplicación
    secundaria, lo que significa que un conductor debe ser detenido por otra infracción
    antes de que se pueda emitir una citación por el cinturón de seguridad.
- id: 56
  category: driver_testing
  question: 'Al solicitar una licencia de conducir de Wyoming, los solicitantes masculinos
    menores de 26 años aceptan el registro automático en:'
  choices:
    A: La Guardia Nacional de Wyoming
    B: El Sistema de Servicio Selectivo
    C: El Departamento de Seguridad Nacional
    D: La Patrulla de Caminos de Wyoming
  answer: B
  explanation: La ley de Wyoming exige que cualquier solicitante masculino menor de
    26 años sea registrado en el Sistema de Servicio Selectivo al solicitar una licencia
    o permiso.
- id: 57
  category: driver_testing
  question: ¿Cuál es la tarifa estándar para restablecer una licencia de conducir
    de Wyoming que fue suspendida por razones distintas a DUI o infracciones de seguro?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: B
  explanation: La tarifa estándar de restablecimiento para una licencia suspendida
    en Wyoming es de $50 (aunque los restablecimientos relacionados con DUI pueden
    costar más).
- id: 58
  category: driver_responsibility
  question: 'En Wyoming, debe notificar de inmediato a la agencia de aplicación de
    la ley más cercana si un accidente resulta en lesiones, muerte o daños totales
    a la propiedad por un monto aparente de al menos:'
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: C
  explanation: De acuerdo con la ley de Wyoming (W.S. 31-5-1106), el conductor de
    un vehículo involucrado en un accidente que resulte en lesiones, muerte o daños
    totales a la propiedad de $1,000 o más debe notificar de inmediato a la agencia
    de aplicación de la ley más cercana.
- id: 59
  category: driver_responsibility
  question: 'La ley de ''Consentimiento Implícito'' de Wyoming significa que al conducir
    por las carreteras de Wyoming, usted ha dado su consentimiento para:'
  choices:
    A: Un registro del maletero de su vehículo en cualquier momento.
    B: Una prueba química de su aliento, sangre u orina para determinar el contenido
      de alcohol o drogas.
    C: La instalación de un dispositivo de bloqueo de encendido.
    D: Permitir que los pasajeros beban alcohol siempre que el conductor esté sobrio.
  answer: B
  explanation: La ley de Consentimiento Implícito de Wyoming (W.S. 31-6-102) establece
    que se considera que cualquier persona que opera un vehículo motorizado ha dado
    su consentimiento para una prueba química con el fin de determinar el contenido
    de alcohol o sustancias controladas en su sangre.
- id: 60
  category: driver_responsibility
  question: 'En Wyoming, para la mayoría de los vehículos de pasajeros, las placas
    de matrícula deben exhibirse en:'
  choices:
    A: Solo en la parte trasera del vehículo.
    B: Solo en la parte delantera del vehículo.
    C: Tanto en la parte delantera como en la trasera del vehículo.
    D: La ventana trasera y el parachoques delantero.
  answer: C
  explanation: La ley de Wyoming (W.S. 31-2-204) exige que las placas de matrícula
    se exhiban de manera visible tanto en la parte delantera como en la trasera de
    la mayoría de los vehículos motorizados, excepto motocicletas, remolques y ciertos
    vehículos personalizados.
- id: 61
  category: driver_responsibility
  question: 'Si es condenado por una primera ofensa de DUI en Wyoming y su BAC era
    de 0.15% o superior, se le requiere:'
  choices:
    A: Entregar su vehículo al estado.
    B: Operar únicamente vehículos equipados con un dispositivo de interbloqueo de
      encendido durante 6 meses.
    C: Cumplir una condena obligatoria de 30 días en una prisión estatal.
    D: Perder permanentemente sus privilegios de conducir.
  answer: B
  explanation: La ley de Wyoming exige que un infractor de DUI por primera vez con
    un BAC de 0.15% o superior utilice un dispositivo de interbloqueo de encendido
    durante un período de 6 meses después de que se restablezca su licencia.
- id: 62
  category: driver_responsibility
  question: Si se ve involucrado en un accidente en Wyoming donde el otro conductor
    tiene la culpa pero no tiene seguro, ¿qué cobertura de su propia póliza cubriría
    normalmente sus gastos médicos?
  choices:
    A: Cobertura integral (Comprehensive)
    B: Cobertura de colisión (Collision)
    C: Cobertura de conductor no asegurado (Uninsured Motorist)
    D: Cobertura de responsabilidad civil (Liability)
  answer: C
  explanation: La cobertura de conductor no asegurado está diseñada para protegerlo
    si se ve involucrado en un accidente con un conductor que no cuenta con el seguro
    de responsabilidad civil exigido por el estado.
- id: 63
  category: driver_responsibility
  question: 'La ley de "Envase Abierto" (Open Container) de Wyoming prohíbe la posesión
    de un envase de bebida alcohólica abierto en el área de pasajeros de un vehículo
    motorizado en una vía pública. Esta ley se aplica a:'
  choices:
    A: Solo al conductor.
    B: Solo a los pasajeros.
    C: Tanto al conductor como a todos los pasajeros.
    D: Solo a los conductores menores de 21 años.
  answer: C
  explanation: El Estatuto de Wyoming 31-5-235 prohíbe que cualquier persona (conductor
    o pasajero) consuma o posea un envase de bebida alcohólica abierto mientras se
    encuentre en el área de pasajeros de un vehículo motorizado en una vía pública.
- id: 64
  category: driver_responsibility
  question: ¿Cuál es la sanción por negarse por primera vez a someterse a una prueba
    química bajo la ley de Consentimiento Implícito (Implied Consent) de Wyoming?
  choices:
    A: Una suspensión de la licencia por 90 días.
    B: Una suspensión de la licencia por 6 meses.
    C: Una suspensión de la licencia por 1 año.
    D: Una sentencia obligatoria de 48 horas de cárcel.
  answer: B
  explanation: Si un conductor se niega a someterse a una prueba química según lo
    solicitado por un oficial de la paz bajo la ley de Consentimiento Implícito, su
    licencia de conducir será suspendida por 6 meses por una primera ofensa.
- id: 65
  category: driver_responsibility
  question: Según la ley de Wyoming, ¿quién es responsable de garantizar que todos
    los pasajeros menores de 18 años estén debidamente sujetos por un cinturón de
    seguridad o un sistema de sujeción de seguridad para niños?
  choices:
    A: Los propios pasajeros.
    B: El conductor del vehículo.
    C: Los padres de los pasajeros, incluso si no están presentes.
    D: Solo los pasajeros del asiento delantero.
  answer: B
  explanation: En Wyoming, el conductor es legalmente responsable de garantizar que
    todos los pasajeros menores de 18 años estén debidamente abrochados o asegurados
    en un asiento de seguridad infantil apropiado.
- id: 66
  category: driver_responsibility
  question: 'Si es condenado por arrojar basura (littering) en una carretera de Wyoming,
    puede estar sujeto a una multa de hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: D
  explanation: Arrojar basura es un delito menor en Wyoming. Una condena puede resultar
    en una multa de hasta $750 y/o hasta 6 meses de cárcel.
- id: 67
  category: driver_responsibility
  question: Si su licencia de conducir de Wyoming es suspendida debido a un DUI, es
    posible que se le solicite presentar un formulario SR-22. ¿Qué es un SR-22?
  choices:
    A: Un certificado de registro del vehículo.
    B: Un comprobante de responsabilidad financiera futura (seguro).
    C: Una autorización médica de un doctor.
    D: Un registro de todas las infracciones de tránsito en movimiento.
  answer: B
  explanation: Un SR-22 es un documento emitido por una compañía de seguros al estado
    certificando que un conductor tiene el seguro de responsabilidad civil mínimo
    requerido. A menudo se requiere para el restablecimiento de la licencia después
    de una suspensión.
- id: 68
  category: driver_responsibility
  question: 'Si no paga una sentencia judicial resultante de un accidente de vehículo
    motorizado dentro de los 60 días, la ley de Wyoming exige que:'
  choices:
    A: Su vehículo sea confiscado.
    B: Su licencia de conducir y el registro sean suspendidos.
    C: Cumpla 10 días en la cárcel del condado.
    D: Sus primas de seguro se dupliquen por ley.
  answer: B
  explanation: Según las leyes de responsabilidad financiera de Wyoming, si un conductor
    no cumple con una sentencia derivada de un accidente dentro de los 60 días, el
    Departamento de Transporte suspenderá la licencia de conducir y el registro.
- id: 69
  category: driver_responsibility
  question: 'Al registrar un vehículo en Wyoming, el registro normalmente vence el:'
  choices:
    A: 31 de diciembre de cada año.
    B: El día del cumpleaños del propietario.
    C: El último día del mes un año después de la fecha de registro.
    D: 30 de junio de cada año.
  answer: C
  explanation: Wyoming utiliza un sistema de registro escalonado donde el registro
    vence el último día del mes, un año después del mes del registro inicial.
- id: 70
  category: driver_responsibility
  question: 'En Wyoming, puede mostrar un comprobante de responsabilidad financiera
    (seguro) a un oficial de la ley utilizando:'
  choices:
    A: Solo una tarjeta de papel emitida por su compañía de seguros.
    B: Una imagen electrónica mostrada en un dispositivo móvil.
    C: Una declaración verbal de su número de póliza.
    D: Una copia de su pago de prima de seguro más reciente.
  answer: B
  explanation: La ley de Wyoming permite a los conductores proporcionar evidencia
    de seguro ya sea en formato impreso (papel) o en formato electrónico en un dispositivo
    electrónico móvil.
- id: 71
  category: driver_responsibility
  question: ¿Dentro de cuántos días después de establecer su residencia deben registrar
    sus vehículos los nuevos residentes de Wyoming?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: La ley de Wyoming exige que registre su vehículo dentro de los 30 días
    posteriores a convertirse en residente o a obtener empleo en el estado.
- id: 72
  category: driver_responsibility
  question: 'Si usted se ve involucrado en un accidente en Wyoming que requiere un
    informe, y un oficial de policía no realiza una investigación, debe presentar
    un informe por escrito al Departamento de Transporte dentro de:'
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Si un accidente no es investigado por un oficial de la ley y resulta
    en lesiones, muerte o daños por $1,000, el conductor debe presentar un informe
    por escrito dentro de los 10 días.
- id: 73
  category: driver_responsibility
  question: 'Si su licencia de conducir de Wyoming es suspendida por falta de seguro
    de responsabilidad civil, por lo general se le requerirá mantener un formulario
    de responsabilidad financiera SR-22 durante:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Wyoming exige que los conductores presenten y mantengan un certificado
    de seguro SR-22 durante 3 años después de una suspensión por falta de seguro o
    una condena por DUI.
- id: 74
  category: driver_responsibility
  question: ¿Qué prohíbe la ley de "Contenedor Abierto" (Open Container) de Wyoming?
  choices:
    A: Poseer una bebida alcohólica abierta en el área de pasajeros de un vehículo
      en una vía pública
    B: Transportar una caja de cerveza sin abrir en el asiento delantero
    C: Tener una lata de cerveza vacía en la caja de una camioneta (pickup)
    D: Transportar vino en un recipiente original sellado en el área de pasajeros
  answer: A
  explanation: La ley de Wyoming prohíbe que cualquier persona consuma o posea una
    bebida alcohólica abierta mientras se encuentre en el área de pasajeros de un
    vehículo motorizado en una vía pública.
- id: 75
  category: driver_responsibility
  question: ¿Cuál de las siguientes condenas resultará en la revocación OBLIGATORIA
    de sus privilegios de conducir en Wyoming?
  choices:
    A: Una sola multa por exceso de velocidad de 10 mph sobre el límite
    B: No usar una señal de giro
    C: Abandonar la escena de un accidente que involucre lesiones o muerte
    D: Una sola condena por seguir a otro vehículo demasiado cerca
  answer: C
  explanation: La revocación obligatoria ocurre por delitos graves, incluyendo el
    choque y fuga (hit and run) que involucre lesiones o muerte, homicidio por vehículo
    o el uso de un vehículo motorizado en la comisión de un delito grave (felony).
- id: 76
  category: driver_responsibility
  question: En Wyoming, un infractor de DUI por primera vez con una concentración
    de alcohol en sangre (BAC) de ____ o superior debe tener instalado un dispositivo
    de bloqueo de encendido (IID) durante 6 meses.
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.12%
    D: 0.15%
  answer: D
  explanation: La ley de Wyoming exige un dispositivo de bloqueo de encendido durante
    6 meses, incluso para una primera infracción, si el BAC del conductor fue de 0.15%
    o superior.
- id: 77
  category: driver_responsibility
  question: 'Para la mayoría de los vehículos de pasajeros, la ley de Wyoming exige
    que las placas de matrícula se exhiban:'
  choices:
    A: Solo en la parte trasera del vehículo
    B: Solo en la parte delantera del vehículo
    C: Tanto en la parte delantera como en la trasera del vehículo
    D: Solo en la ventana trasera
  answer: C
  explanation: 'La ley de Wyoming exige que la mayoría de los vehículos exhiban dos
    placas de matrícula: una en la parte delantera y otra en la trasera.'
- id: 78
  category: driver_responsibility
  question: ¿Cuál es la sanción máxima por tirar basura en las carreteras de Wyoming?
  choices:
    A: Una multa de $100
    B: Una multa de $250 y 10 horas de servicio comunitario
    C: Hasta una multa de $750 y/o hasta 6 meses de cárcel
    D: Revocación obligatoria de la licencia por 30 días
  answer: C
  explanation: Tirar basura es ilegal en Wyoming y se castiga con una multa de hasta
    $750 y/o hasta 6 meses de cárcel.
- id: 79
  category: driver_responsibility
  question: 'Según la ley de Wyoming, sus privilegios de conducir pueden ser suspendidos
    por no pagar lo ordenado por el tribunal en concepto de:'
  choices:
    A: Deuda de tarjeta de crédito
    B: Manutención infantil
    C: Impuestos sobre la propiedad
    D: Facturas médicas
  answer: B
  explanation: Los Servicios al Conductor de Wyoming pueden suspender la licencia
    de un conductor si reciben un aviso del Departamento de Servicios Familiares de
    que el conductor tiene pagos atrasados de manutención infantil.
- id: 80
  category: driver_responsibility
  question: Cuando vende un vehículo en Wyoming, ¿dentro de cuántos días debe el comprador
    solicitar un nuevo título a su nombre?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: D
  explanation: En Wyoming, el comprador de un vehículo debe transferir el título a
    su nombre dentro de los 60 días posteriores a la fecha de venta.
- id: 81
  category: driver_responsibility
  question: 'Para restablecer una licencia de conducir de Wyoming después de una suspensión
    por un DUI (conducción bajo la influencia), el conductor debe pagar una tarifa
    de restablecimiento de al menos:'
  choices:
    A: $25
    B: $50
    C: $105
    D: $250
  answer: C
  explanation: Aunque la tarifa estándar de restablecimiento es de $50, la ley de
    Wyoming exige una tarifa de $105 para los restablecimientos que siguen a suspensiones
    relacionadas con el alcohol.
- id: 82
  category: driver_responsibility
  question: 'Si usted se ve involucrado en un accidente con un vehículo estacionado
    y no se puede encontrar al propietario, la ley de Wyoming le exige:'
  choices:
    A: Esperar al menos dos horas a que regrese el propietario
    B: Dejar una nota con su nombre, dirección y una explicación, y notificar a la
      policía
    C: Conducir a la estación de policía más cercana dentro de las 24 horas
    D: Solo dejar una nota si el daño parece ser superior a $1,000
  answer: B
  explanation: La ley de Wyoming le exige detenerse e intentar localizar al propietario.
    Si no se puede encontrar, debe dejar un aviso por escrito en un lugar visible
    del vehículo y notificar a la agencia de aplicación de la ley más cercana.
- id: 83
  category: safe_driving_rules
  question: Al seguir a otro vehículo en Wyoming, ¿cuál es la distancia de seguimiento
    mínima recomendada bajo condiciones de conducción ideales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Wyoming recomienda una distancia de seguimiento
    de al menos 4 segundos para permitir suficiente tiempo para reaccionar ante peligros.
- id: 84
  category: safe_driving_rules
  question: En Wyoming, se prohíbe estacionar a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: La ley de Wyoming establece que no se puede estacionar un vehículo
    a menos de 15 pies de un hidrante de incendios.
- id: 85
  category: safe_driving_rules
  question: ¿Cuántos pies antes de girar en un distrito comercial o residencial debe
    activar su señal de giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: En Wyoming, debe indicar su intención de girar al menos 100 pies antes
    del giro cuando se encuentre en un área comercial o residencial.
- id: 86
  category: safe_driving_rules
  question: ¿Se prohíbe estacionar a menos de cuántos pies de una señal de alto, una
    baliza intermitente o una señal de ceda el paso?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Wyoming prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico ubicada al costado
    de una carretera.
- id: 87
  category: safe_driving_rules
  question: 'En Wyoming, no puede realizar un giro en U en una curva o cerca de la
    cima de una colina si su vehículo no puede ser visto por otros conductores que
    se aproximan desde cualquier dirección dentro de:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 700 pies
    D: 1,000 pies
  answer: B
  explanation: Los giros en U están prohibidos en curvas o colinas donde el vehículo
    no pueda ser visto por otros conductores dentro de un rango de 500 pies.
- id: 88
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad estándar en una zona escolar de Wyoming
    cuando hay niños presentes o la baliza está parpadeando?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El límite de velocidad en las zonas escolares en Wyoming es de 20 mph
    (millas por hora) a menos que se indique lo contrario.
- id: 89
  category: safe_driving_rules
  question: Al estacionar su vehículo en paralelo a la acera en una calle nivelada,
    sus neumáticos deben estar a menos de cuántas pulgadas de la acera?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: La ley de Wyoming exige que ambas ruedas derechas de un vehículo estacionado
    en paralelo estén a menos de 12 pulgadas de la acera.
- id: 90
  category: safe_driving_rules
  question: 'En Wyoming, debe bajar sus luces altas cuando siga a otro vehículo desde
    atrás a una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Al seguir a otro vehículo, debe bajar sus luces altas cuando se encuentre
    a menos de 300 pies de ese vehículo.
- id: 91
  category: safe_driving_rules
  question: 'Al estacionar un vehículo cuesta abajo en una calle de doble sentido
    con bordillo (curb), debe girar las ruedas delanteras:'
  choices:
    A: Hacia el bordillo
    B: Lejos del bordillo
    C: Paralelas al bordillo
    D: Hacia la izquierda
  answer: A
  explanation: Al estacionar cuesta abajo, debe girar el volante hacia el bordillo
    para que, si el vehículo rueda, choque contra el bordillo y se detenga.
- id: 92
  category: safe_driving_rules
  question: En Wyoming, ¿cuál es el límite de velocidad no señalizado en las autopistas
    interestatales rurales para vehículos de pasajeros?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: De acuerdo con la ley de Wyoming, el límite de velocidad en las autopistas
    interestatales rurales es de 80 mph, a menos que se indique lo contrario.
- id: 93
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad legal
    en un 'distrito urbano' o zona residencial de Wyoming?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: En Wyoming, el límite de velocidad predeterminado en cualquier distrito
    urbano o zona residencial es de 30 mph, a menos que las señales indiquen lo contrario.
- id: 94
  category: safe_driving_rules
  question: Cuando tenga la intención de girar, ¿debe señalizar continuamente durante
    al menos cuántos pies antes del giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Wyoming exige que los conductores señalicen su intención
    de girar durante al menos 100 pies antes del giro real.
- id: 95
  category: safe_driving_rules
  question: 'Si es declarado culpable de exceso de velocidad en una zona de construcción
    de Wyoming donde hay trabajadores presentes, la multa se:'
  choices:
    A: Incrementa en $100
    B: Triplica
    C: Duplica
    D: Mantiene igual que una multa normal
  answer: C
  explanation: Las multas por exceso de velocidad en las zonas de obras de Wyoming
    se duplican cuando hay trabajadores presentes y la zona está debidamente señalizada.
- id: 96
  category: safe_driving_rules
  question: En una carretera con dos o más carriles en cada dirección separados por
    una mediana, ¿debe detenerse ante un autobús escolar con luces rojas intermitentes
    que se aproxima en la dirección opuesta?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar.
    B: No, no es necesario detenerse si hay una mediana física o separación.
    C: Sí, pero solo si hay niños presentes.
    D: No, pero debe reducir la velocidad a 15 mph.
  answer: B
  explanation: En Wyoming, si viaja por una carretera dividida (separada por una mediana
    o barrera), no es necesario detenerse ante un autobús escolar que viaja en la
    dirección opuesta.
- id: 97
  category: safe_driving_rules
  question: 'La ley de Wyoming exige el uso de los faros delanteros siempre que no
    pueda ver con claridad a una distancia de al menos:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Los faros delanteros deben usarse desde el atardecer hasta el amanecer
    y en cualquier otro momento en que la visibilidad sea inferior a 500 pies debido
    al clima u otras condiciones.
- id: 98
  category: safe_driving_rules
  question: Al adelantar a otro vehículo en una carretera de dos carriles, ¿debe regresar
    a su carril antes de estar a cuántos pies de un vehículo que viene en sentido
    contrario?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Debe regresar a su lado de la carretera antes de estar a menos de 200
    pies de cualquier vehículo que se aproxime en dirección opuesta.
- id: 99
  category: safe_driving_rules
  question: Al usar señales manuales, ¿cómo se indica un giro a la izquierda?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo doblado hacia arriba en un ángulo de 90 grados
    C: Brazo doblado hacia abajo en un ángulo de 90 grados
    D: Brazo moviéndose en forma circular
  answer: A
  explanation: Para señalizar un giro a la izquierda mediante señales manuales, el
    conductor debe extender el brazo izquierdo horizontalmente hacia afuera de la
    ventana.
- id: 100
  category: defensive_driving
  question: Según el Manual del Conductor de Wyoming, ¿cuál es la distancia de seguimiento
    recomendada que debe mantenerse detrás del vehículo que va delante en condiciones
    ideales?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: C
  explanation: El Manual del Conductor de Wyoming recomienda específicamente la 'regla
    de los cuatro segundos' para mantener una distancia de seguimiento segura en condiciones
    de conducción ideales.
- id: 101
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente,
    el Manual del Conductor de Wyoming sugiere mirar hacia adelante al menos ¿cuántos
    segundos?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 25 segundos
    D: 30 segundos
  answer: B
  explanation: Los conductores seguros observan la carretera de 10 a 15 segundos por
    delante para anticipar peligros y cambios en el flujo del tráfico.
- id: 102
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (donde los neumáticos pierden
    contacto con la carretera y se deslizan sobre una fina capa de agua) en las condiciones
    climáticas de Wyoming?
  choices:
    A: Tan baja como 25 mph
    B: Tan baja como 35 a 40 mph
    C: Solo por encima de 55 mph
    D: Solo por encima de 65 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 a 40
    mph, especialmente si los neumáticos están desgastados o mal inflados.
- id: 103
  category: defensive_driving
  question: 'En Wyoming, las luces delanteras deben encenderse si no puede ver con
    claridad a una distancia de al menos:'
  choices:
    A: 300 pies
    B: 400 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Wyoming establece que las luces delanteras deben usarse desde
    el atardecer hasta el amanecer y siempre que la visibilidad sea inferior a 500
    pies.
- id: 104
  category: defensive_driving
  question: 'Al conducir por las carreteras de Wyoming en invierno, si su vehículo
    comienza a derrapar, usted debe:'
  choices:
    A: Frenar fuerte inmediatamente
    B: Girar el volante en la dirección opuesta al derrape
    C: No usar los frenos y girar el volante en la dirección en la que desea que vaya
      la parte delantera del vehículo
    D: Poner el coche en punto muerto y bombear los frenos rápidamente
  answer: C
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que desea que vaya el vehículo sin frenar
    bruscamente.
- id: 105
  category: defensive_driving
  question: 'Wyoming tiene una gran población de vida silvestre. Si un animal grande
    como un ciervo o un alce salta frente a su vehículo, el manual recomienda que
    usted debe:'
  choices:
    A: Virar bruscamente hacia el otro carril para evitarlo
    B: Frenar firmemente pero no virar fuera de su carril
    C: Acelerar para minimizar la fuerza del impacto
    D: Tocar la bocina continuamente y cerrar los ojos
  answer: B
  explanation: Virar bruscamente para evitar a un animal a menudo puede resultar en
    un choque más grave con otro vehículo o un vuelco. La acción más segura es frenar
    firmemente y permanecer en su carril.
- id: 106
  category: defensive_driving
  question: ¿Cuál es el límite de velocidad no señalizado para caminos no pavimentados
    (tierra o grava) en Wyoming?
  choices:
    A: 20 mph
    B: 30 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Según la ley estatal de Wyoming, el límite de velocidad en caminos
    no pavimentados es de 30 mph, a menos que se indique un límite diferente.
- id: 107
  category: defensive_driving
  question: 'Si conduce por una carretera de dos carriles en Wyoming y se acerca a
    un autobús escolar con las luces rojas intermitentes y el brazo de parada extendido,
    debe detenerse a menos que:'
  choices:
    A: Usted viaje en la dirección opuesta
    B: El autobús esté en el lado opuesto de una mediana o barrera física
    C: No haya niños visibles
    D: Usted tenga prisa y el autobús haya estado detenido por más de 2 minutos
  answer: B
  explanation: Los conductores no necesitan detenerse ante un autobús escolar si viajan
    en la dirección opuesta en una carretera dividida por una mediana o barrera física.
- id: 108
  category: defensive_driving
  question: En Wyoming, ¿cuándo se le permite adelantar a un vehículo por la derecha?
  choices:
    A: Siempre que tenga prisa
    B: Solo si el vehículo de adelante está girando a la izquierda y hay un arcén
      pavimentado o un segundo carril
    C: Si el vehículo de adelante conduce por debajo del límite de velocidad
    D: Adelantar por la derecha nunca es legal en Wyoming
  answer: B
  explanation: Puede adelantar por la derecha en Wyoming solo si el vehículo al que
    está adelantando está girando a la izquierda y hay suficiente pavimento para pasar
    con seguridad sin salirse de la carretera.
- id: 109
  category: defensive_driving
  question: Según la ley de Wyoming, cuando dos vehículos llegan al mismo tiempo a
    una intersección sin señales ni semáforos, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda
    B: El vehículo de la derecha
    C: El vehículo que viaja a mayor velocidad
    D: El vehículo que toca la bocina primero
  answer: B
  explanation: En una intersección no controlada, el conductor del vehículo de la
    izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 110
  category: defensive_driving
  question: 'Al entrar en una rotonda en Wyoming, debe ceder el derecho de paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en la rotonda
    C: Nadie; usted tiene el derecho de paso al entrar
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el paso al tráfico
    que ya está circulando dentro de la rotonda.
- id: 111
  category: defensive_driving
  question: ¿Con cuánta anticipación debe observar el camino para evitar la necesidad
    de frenar o girar de último momento en Wyoming?
  choices:
    A: 5 a 10 segundos
    B: 10 a 15 segundos
    C: 20 a 25 segundos
    D: 30 segundos
  answer: B
  explanation: Las leyes y pautas de seguridad de Wyoming sugieren observar el camino
    con 10 a 15 segundos de anticipación para prever peligros y gestionar el flujo
    del tráfico.
- id: 112
  category: defensive_driving
  question: Al seguir a otro vehículo por la noche en Wyoming, ¿a qué distancia debe
    bajar las luces altas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Debe bajar las luces altas cuando siga a otro vehículo a menos de 300
    pies para evitar reflejar el resplandor en el espejo retrovisor del conductor
    de adelante.
- id: 113
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (pérdida de contacto de
    los neumáticos con la carretera debido al agua) en Wyoming?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: Solo por encima de 65 mph
    D: A cualquier velocidad superior a 15 mph
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    Bajo una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 114
  category: defensive_driving
  question: Al conducir en temperaturas bajo cero en Wyoming, ¿cuál de las siguientes
    superficies de la carretera es probable que se congele primero y permanezca congelada
    por más tiempo?
  choices:
    A: Intersecciones
    B: Caminos de grava
    C: Puentes y pasos elevados
    D: Túneles
  answer: C
  explanation: Los puentes y pasos elevados se congelan antes que otras superficies
    de la carretera porque están expuestos al aire frío tanto por arriba como por
    abajo.
- id: 115
  category: defensive_driving
  question: Al entrar en una intersección en Wyoming, ¿en qué orden debe observar
    el tráfico?
  choices:
    A: Derecha, izquierda, derecha
    B: Izquierda, derecha, izquierda
    C: Recto, izquierda, derecha
    D: Derecha, recto, izquierda
  answer: B
  explanation: Debe mirar a la izquierda, luego a la derecha y después a la izquierda
    de nuevo. Mirar a la izquierda primero es crucial porque los vehículos que vienen
    de la izquierda están más cerca de usted.
- id: 116
  category: defensive_driving
  question: 'Si un ciervo o un alce corre repentinamente frente a su vehículo en una
    carretera de Wyoming, la acción de conducción defensiva más segura suele ser:'
  choices:
    A: Virar bruscamente hacia el carril opuesto
    B: Virar fuera de la carretera hacia una zanja
    C: Frenar firmemente y permanecer en su carril
    D: Acelerar para pasar al animal antes de que lo golpee
  answer: C
  explanation: Las pautas de seguridad de Wyoming aconsejan a los conductores no virar
    bruscamente para esquivar animales, ya que esto puede provocar un vuelco más grave
    o una colisión frontal. Frene firmemente y mantenga el control de su carril.
- id: 117
  category: defensive_driving
  question: 'Al seguir a un camión grande o vehículo comercial en Wyoming, debe aumentar
    su distancia de seguimiento a al menos:'
  choices:
    A: 4 segundos
    B: 5 segundos
    C: Entre 6 y 8 segundos
    D: 10 segundos
  answer: C
  explanation: Debido a que los camiones grandes requieren más espacio para detenerse
    y bloquean su visión del camino adelante, Wyoming recomienda aumentar la distancia
    de seguimiento a 6-8 segundos.
- id: 118
  category: defensive_driving
  question: 'Wyoming es conocido por sus fuertes vientos. Si conduce un vehículo pequeño
    o un vehículo de perfil alto con vientos fuertes, debe:'
  choices:
    A: Acelerar para usar el impulso para la estabilidad
    B: Reducir la velocidad y mantener un agarre firme en el volante
    C: Conducir lo más cerca posible de la línea central
    D: Seguir de cerca a un camión grande para usarlo como rompevientos
  answer: B
  explanation: Los vientos fuertes pueden empujar a los vehículos fuera de su carril.
    Reducir la velocidad y mantener un agarre firme en el volante ayuda a mantener
    el control, especialmente cuando es rebasado por camiones grandes.
- id: 119
  category: defensive_driving
  question: 'Para revisar su "punto ciego" antes de cambiar de carril en Wyoming,
    debe:'
  choices:
    A: Revisar el espejo retrovisor
    B: Revisar el espejo lateral
    C: Girar la cabeza y mirar sobre su hombro
    D: Confiar en el sistema de monitoreo de punto ciego de su vehículo
  answer: C
  explanation: Los espejos no lo muestran todo. Un "chequeo con la cabeza" o mirar
    sobre el hombro es la única forma de asegurarse de que el punto ciego esté despejado
    antes de moverse.
- id: 120
  category: defensive_driving
  question: ¿Cuál de los siguientes es un artículo recomendado para un kit de emergencia
    de conducción invernal en Wyoming para ayudar con la tracción si se queda atascado
    en la nieve?
  choices:
    A: Un galón de gasolina
    B: Una bolsa de arena o arena para gatos
    C: Una lata de WD-40
    D: Líquido limpiaparabrisas adicional
  answer: B
  explanation: El Manual del Conductor de Wyoming recomienda llevar arena, arena para
    gatos o sal para proporcionar tracción a los neumáticos sobre hielo o nieve si
    el vehículo se queda atascado.
- id: 121
  category: defensive_driving
  question: 'Para prevenir la ''hipnosis de carretera'' y la fatiga durante viajes
    largos en las carreteras interestatales de Wyoming, se recomienda detenerse y
    descansar cada:'
  choices:
    A: 1 hora o 50 millas
    B: 2 horas o 100 millas
    C: 4 horas o 250 millas
    D: Solo cuando sienta que se le cierran los ojos
  answer: B
  explanation: Las pautas de seguridad de Wyoming sugieren tomar un descanso cada
    100 millas o cada dos horas para mantenerse alerta y evitar conducir con sueño.
- id: 122
  category: alcohol_drugs_health
  question: En Wyoming, se considera que una persona conduce bajo la influencia si
    su concentración de alcohol en sangre (BAC) es igual o superior a ¿qué nivel?
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.10%
    D: 0.02%
  answer: B
  explanation: Según el Estatuto de Wyoming 31-5-233, es ilegal que cualquier persona
    conduzca o tenga el control físico real de un vehículo con un BAC de 0.08% o superior.
- id: 123
  category: alcohol_drugs_health
  question: Bajo la ley de 'Consentimiento Implícito' de Wyoming, al conducir por
    las carreteras de Wyoming, usted ha dado su consentimiento para ¿cuál de los siguientes?
  choices:
    A: Un registro del maletero de su vehículo
    B: Una prueba química de su aliento, sangre u orina
    C: Una revisión de sus registros médicos
    D: Un período de observación obligatorio de 24 horas
  answer: B
  explanation: La ley de Consentimiento Implícito de Wyoming significa que, al operar
    un vehículo motorizado, usted acepta someterse a pruebas químicas de su aliento,
    sangre u orina para determinar el contenido de alcohol o drogas si es arrestado
    por DUI.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es la multa máxima por una condena de DUI por primera vez en Wyoming
    (excluyendo los costos judiciales)?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: Un DUI por primera vez en Wyoming es punible con una multa de hasta
    $750, prisión por hasta seis meses, o ambos.
- id: 125
  category: alcohol_drugs_health
  question: Si es condenado por un DUI por primera vez en Wyoming, ¿por cuánto tiempo
    se suspenderá típicamente su licencia de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Una condena por DUI por primera vez en Wyoming resulta en una suspensión
    obligatoria de la licencia de conducir de 90 días.
- id: 126
  category: alcohol_drugs_health
  question: 'En Wyoming, un conductor que opera un Vehículo Motorizado Comercial (CMV)
    se considera legalmente intoxicado si su BAC es igual o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Para los conductores comerciales en Wyoming, el límite legal de BAC
    es más bajo que para los conductores estándar, establecido en 0.04%.
- id: 127
  category: alcohol_drugs_health
  question: 'Si un conductor de Wyoming se niega a someterse a una prueba química
    requerida por primera vez, su licencia será suspendida por:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Según la ley de Wyoming, la primera negativa a someterse a una prueba
    química resulta en una suspensión automática de la licencia de conducir de 6 meses.
- id: 128
  category: alcohol_drugs_health
  question: 'En Wyoming, un Dispositivo de Bloqueo de Encendido (IID) es obligatorio
    para un DUI por primera vez si el BAC del conductor fue igual o superior a:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: La ley de Wyoming requiere un Dispositivo de Bloqueo de Encendido para
    los infractores por primera vez si su BAC era de 0.15% o superior en el momento
    de la infracción.
- id: 129
  category: alcohol_drugs_health
  question: 'En Wyoming, una persona puede ser acusada de ''Poner en peligro a un
    menor'' (Child Endangerment) si es sorprendida conduciendo bajo la influencia
    con un pasajero menor de:'
  choices:
    A: '12'
    B: '14'
    C: '16'
    D: '18'
  answer: C
  explanation: La ley de Wyoming incluye sanciones mayores por DUI si un niño menor
    de 16 años está presente en el vehículo en el momento de la infracción.
- id: 130
  category: alcohol_drugs_health
  question: ¿Cuál es el período de suspensión por una segunda condena de DUI dentro
    de un período de 10 años en Wyoming?
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 3 años
  answer: C
  explanation: Una segunda condena por DUI dentro de los 10 años en Wyoming resulta
    en una suspensión obligatoria de la licencia de conducir de 1 año.
- id: 131
  category: alcohol_drugs_health
  question: ¿Puede ser condenado por un DWUI (conducir bajo la influencia) en Wyoming
    si conduce bajo la influencia de un medicamento recetado legalmente?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, la ley solo se aplica a drogas ilegales y alcohol
    C: Sí, si el medicamento lo incapacita para conducir de manera segura
    D: Sí, pero solo si también tiene alcohol en su organismo
  answer: C
  explanation: En Wyoming, es ilegal conducir bajo la influencia de cualquier sustancia
    controlada o droga hasta un grado que incapacite a la persona para conducir de
    manera segura, independientemente de si fue recetada legalmente.
- id: 132
  category: alcohol_drugs_health
  question: Si su licencia de Wyoming es suspendida por un DUI, ¿cuánto es el cargo
    por restablecimiento que debe pagar al Departamento de Transporte?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: B
  explanation: Para restablecer una licencia de conducir de Wyoming después de una
    suspensión relacionada con el alcohol o las drogas, el conductor debe pagar un
    cargo por restablecimiento de $50.
- id: 133
  category: alcohol_drugs_health
  question: Según la ley Administrativa Per Se de Wyoming, ¿cuántos días tiene para
    solicitar una audiencia después de recibir un aviso de suspensión por DUI?
  choices:
    A: 7 días
    B: 10 días
    C: 20 días
    D: 30 días
  answer: C
  explanation: Los conductores tienen 20 días a partir de la fecha del aviso de suspensión
    para solicitar una audiencia de caso impugnado con respecto a la suspensión de
    su licencia.
- id: 134
  category: alcohol_drugs_health
  question: 'En Wyoming, si es condenado por un cuarto DUI dentro de un período de
    10 años, la infracción se clasifica como:'
  choices:
    A: Delito menor de Clase C
    B: Delito menor de Clase A
    C: Delito grave (Felony)
    D: Infracción administrativa
  answer: C
  explanation: Una cuarta condena por DUI o posterior dentro de un período de 10 años
    en Wyoming es un delito grave, castigado con hasta 7 años de prisión.
- id: 135
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la ley
    de 'Tolerancia Cero' de Wyoming para conductores menores de 21 años?
  choices:
    A: Solo se aplica si el conductor está involucrado en un accidente
    B: Establece el límite legal de BAC en 0.02% para menores
    C: Solo se aplica a infractores reincidentes
    D: Permite que los menores conduzcan con un BAC de hasta 0.05% si un padre está
      presente
  answer: B
  explanation: La ley de Tolerancia Cero de Wyoming establece que es ilegal que cualquier
    persona menor de 21 años opere un vehículo motorizado con un BAC (concentración
    de alcohol en sangre) de 0.02% o superior.
- id: 136
  category: alcohol_drugs_health
  question: En Wyoming, ¿cuál es la sentencia máxima de cárcel por una condena de
    primera infracción por conducir bajo la influencia (DWUI)?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: De acuerdo con el Estatuto de Wyoming 31-5-233, una condena por DWUI
    por primera vez es castigada con hasta 6 meses de cárcel.
- id: 137
  category: alcohol_drugs_health
  question: 'Al determinar las sanciones por DWUI en Wyoming, el período de revisión
    (look-back) para condenas anteriores es de:'
  choices:
    A: 3 años
    B: 5 años
    C: 10 años
    D: Toda la vida del conductor
  answer: C
  explanation: Wyoming utiliza un período de revisión de 10 años para determinar si
    un DWUI es una segunda infracción o posterior.
- id: 138
  category: alcohol_drugs_health
  question: 'En Wyoming, un cargo de DWUI se considera ''Poner en peligro a un menor''
    (Child Endangerment) si el conductor lleva un pasajero menor de:'
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: La ley de Wyoming impone sanciones agravadas por DWUI si hay un pasajero
    en el vehículo menor de 16 años.
- id: 139
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado, ¿quién es responsable de asegurar
    que puede operar un vehículo de manera segura?
  choices:
    A: El farmacéutico
    B: El médico que lo recetó
    C: La Patrulla de Caminos de Wyoming
    D: Usted, el conductor
  answer: D
  explanation: Es responsabilidad del conductor conocer los efectos de cualquier medicamento
    que tome. Estar bajo la influencia de un medicamento recetado legalmente no es
    una defensa contra un cargo de DWUI en Wyoming.
- id: 140
  category: alcohol_drugs_health
  question: 'Una segunda condena por DWUI dentro de un período de 10 años en Wyoming
    resulta en una suspensión obligatoria de la licencia de:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 3 años
  answer: C
  explanation: Una segunda condena por DWUI dentro de un período de 10 años conlleva
    una suspensión obligatoria de 1 año de los privilegios de conducir en Wyoming.
- id: 141
  category: alcohol_drugs_health
  question: ¿Después de recibir una notificación de suspensión por un DWUI, cuántos
    días tiene un conductor de Wyoming para solicitar una audiencia para impugnar
    la suspensión?
  choices:
    A: 7 días
    B: 10 días
    C: 20 días
    D: 30 días
  answer: C
  explanation: Un conductor tiene 20 días a partir de la fecha de la notificación
    de suspensión para solicitar una audiencia administrativa a través de la Oficina
    de Audiencias Administrativas.
- id: 142
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' en el contexto de la seguridad al conducir?
  choices:
    A: El tiempo de recuperación después de un viaje largo
    B: El aumento del efecto causado por la combinación de alcohol y drogas
    C: La capacidad de concentrarse en múltiples peligros a la vez
    D: La mejora del tiempo de reacción gracias a la cafeína
  answer: B
  explanation: El efecto sinérgico ocurre cuando se consumen alcohol y drogas juntos,
    lo que a menudo resulta en un deterioro mucho mayor que el que causaría cualquiera
    de las sustancias por sí sola.
- id: 143
  category: alcohol_drugs_health
  question: 'En Wyoming, una tercera condena por DWUI dentro de un periodo de 10 años
    es sancionable con una pena mínima obligatoria de cárcel de:'
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Para una tercera condena por DWUI dentro de un periodo de 10 años en
    Wyoming, la ley exige un mínimo de 30 días de cárcel, 15 de los cuales deben cumplirse
    de forma consecutiva.
- id: 144
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la marihuana
    y la conducción en Wyoming?
  choices:
    A: Es legal conducir si tiene una tarjeta médica de otro estado
    B: Solo es ilegal si también está consumiendo alcohol
    C: Puede ser condenado por DWUI si está bajo la influencia de la marihuana en
      un grado que lo incapacite para conducir de manera segura
    D: La marihuana no afecta el tiempo de reacción
  answer: C
  explanation: En Wyoming, las leyes de DWUI se aplican a cualquier sustancia controlada,
    incluida la marihuana, que afecte su capacidad para conducir de manera segura.
- id: 145
  category: penalties_and_points
  question: Si un conductor de Wyoming es condenado por 'Conducción Temeraria' (Reckless
    Driving), ¿cuál es la multa máxima por una primera infracción?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: Una primera condena por conducción temeraria en Wyoming conlleva una
    multa de hasta $750 y/o hasta 6 meses de cárcel.
- id: 146
  category: penalties_and_points
  question: Si es condenado por cuatro infracciones de tránsito en movimiento dentro
    de un período de 12 meses, ¿por cuántos días se suspenderá su licencia de Wyoming?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: La ley de Wyoming exige una suspensión de la licencia de 90 días para
    los conductores que acumulen cuatro condenas por infracciones de tránsito en movimiento
    dentro de un solo período de 12 meses.
- id: 147
  category: penalties_and_points
  question: Si se le requiere presentar un formulario de seguro SR-22 en Wyoming después
    de una suspensión, ¿durante cuánto tiempo debe mantener esta prueba de responsabilidad
    financiera?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores obligados a proporcionar una prueba de responsabilidad
    financiera (SR-22) generalmente deben mantenerla durante 3 años consecutivos a
    partir de la fecha de elegibilidad para la reinstalación.
- id: 148
  category: penalties_and_points
  question: ¿Cuál es la multa por la primera infracción de un conductor a la ley de
    cinturones de seguridad de Wyoming?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: En Wyoming, la multa para un conductor que no usa el cinturón de seguridad
    es de $25. Si un pasajero no lleva puesto el cinturón, la multa para ese pasajero
    es de $10.
- id: 149
  category: penalties_and_points
  question: Según la ley de Wyoming, ¿qué sucede con las multas por exceso de velocidad
    en una zona de construcción designada cuando hay trabajadores presentes?
  choices:
    A: Se incrementan en $50
    B: Se duplican
    C: Se triplican
    D: Se mantienen igual pero los puntos se duplican
  answer: B
  explanation: La ley de Wyoming dicta que las multas por exceso de velocidad en una
    zona de construcción se duplican si hay trabajadores presentes y la zona está
    debidamente señalizada.
- id: 150
  category: penalties_and_points
  question: ¿Por cuál de las siguientes infracciones se revocará la licencia de conducir
    de Wyoming?
  choices:
    A: Una sola multa por exceso de velocidad de más de 20 mph
    B: No pagar una multa de estacionamiento
    C: Una condena por un delito grave (felony) en el que se haya utilizado un vehículo
      motorizado
    D: Conducir con una luz trasera rota
  answer: C
  explanation: La ley de Wyoming exige la revocación obligatoria de la licencia por
    cualquier condena por un delito grave en el que se haya utilizado un vehículo
    motorizado para cometer el crimen.
- id: 151
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera condena por rebasar un autobús
    escolar detenido con sus luces rojas intermitentes y el brazo de parada extendido
    en Wyoming?
  choices:
    A: $100
    B: $250
    C: $435
    D: $1,000
  answer: C
  explanation: En Wyoming, la multa por rebasar un autobús escolar detenido con sus
    luces intermitentes puede ser de hasta $435 por una primera infracción.
- id: 152
  category: penalties_and_points
  question: Si usted está involucrado en un accidente que resulte en lesiones o muerte
    y no se detiene en la escena, ¿cuál es la multa máxima que podría enfrentar en
    Wyoming?
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: Abandonar la escena de un accidente que involucre lesiones o muerte
    es un delito grave en Wyoming, castigado con una multa de hasta $5,000 y/o hasta
    1 año de cárcel.
- id: 153
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una consecuencia de ser condenado por conducir
    mientras su licencia está suspendida o revocada en Wyoming?
  choices:
    A: Una multa obligatoria de al menos $50
    B: Una extensión automática de la suspensión por el mismo período que la suspensión
      original
    C: Un requisito obligatorio de 24 horas de servicio comunitario
    D: Pérdida permanente de los privilegios de conducir
  answer: B
  explanation: Si es condenado por conducir mientras está suspendido o revocado, el
    Departamento de Transporte de Wyoming extenderá la suspensión o revocación por
    un período adicional igual a la duración original.
- id: 154
  category: penalties_and_points
  question: Si su licencia de conducir de Wyoming es suspendida debido a una condena
    por DUI (conducir bajo la influencia), ¿por cuántos años debe mantener el seguro
    de responsabilidad financiera SR-22 después de que se restauren sus privilegios
    de conducir?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores condenados por un DUI en Wyoming deben mantener el
    seguro SR-22 durante 3 años a partir de la fecha de la suspensión.
- id: 155
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera infracción de la ley de sistemas
    de retención infantil de Wyoming (no asegurar a un niño menor de 9 años en un
    asiento apropiado)?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: B
  explanation: En Wyoming, una primera infracción de la ley de sistemas de retención
    infantil conlleva una multa de hasta $50. Las infracciones posteriores pueden
    resultar en multas más altas.
- id: 156
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera infracción de la ley de envases
    abiertos de Wyoming (poseer una bebida alcohólica abierta en el área de pasajeros)?
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: Una primera condena por violar la ley de envases abiertos de Wyoming
    es un delito menor castigado con una multa de hasta $200.
- id: 157
  category: penalties_and_points
  question: 'Una primera condena por conducción temeraria en Wyoming puede resultar
    en una sentencia de cárcel de hasta:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: La conducción temeraria es un delito grave en Wyoming; una primera
    condena puede conllevar una multa y/o encarcelamiento por hasta 6 meses.
- id: 158
  category: penalties_and_points
  question: 'Para un conductor menor de 21 años, una primera condena por conducir
    con un BAC (concentración de alcohol en sangre) de 0.02% o superior resulta en
    una suspensión obligatoria de la licencia de:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Bajo la política de 'Tolerancia Cero' de Wyoming, un conductor menor
    de 21 años con un BAC de 0.02% o superior enfrentará una suspensión de la licencia
    de 90 días por una primera infracción.
- id: 159
  category: penalties_and_points
  question: Operar un vehículo motorizado en Wyoming sin un seguro de responsabilidad
    civil válido puede resultar en una multa de hasta cuánto por una primera infracción?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: Una primera infracción por conducir sin seguro en Wyoming conlleva
    una multa que oscila entre $250 y $750.
- id: 160
  category: penalties_and_points
  question: En Wyoming, usar un nombre falso o hacer una declaración falsa en una
    solicitud de licencia de conducir es un delito grave castigado con hasta cuántos
    años de prisión?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: Proporcionar información falsa en una solicitud de licencia se considera
    fraude y es un delito grave en Wyoming, castigado con hasta 2 años de prisión.
- id: 161
  category: penalties_and_points
  question: Al rebasar a otro vehículo en una carretera de dos carriles en Wyoming,
    ¿debe poder ver con claridad al menos cuántos pies hacia adelante para garantizar
    que el rebase sea seguro y legal?
  choices:
    A: 500 pies
    B: 700 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: B
  explanation: El Manual del Conductor de Wyoming establece que no debe intentar rebasar
    a menos que tenga al menos 700 pies de visibilidad clara.
- id: 162
  category: penalties_and_points
  question: 'Una persona que sea condenada por tres o más infracciones de tránsito
    ''graves'' (como DUI o conducción temeraria) en un período de 5 años será declarada
    ''Infractor Habitual'' y perderá su licencia por:'
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Permanentemente
  answer: C
  explanation: La ley de Infractor Habitual de Wyoming exige la revocación de la licencia
    por 5 años para los conductores con tres condenas graves en un período de 5 años.
- id: 163
  category: sharing_the_road
  question: Según la ley de Wyoming, ¿cuándo NO es obligatorio detenerse ante un autobús
    escolar con luces rojas intermitentes?
  choices:
    A: Cuando viaja en la dirección opuesta en una carretera con un carril de giro
      pintado
    B: Cuando viaja en la dirección opuesta en una calzada con cuatro o más carriles
    C: Cuando viaja en la dirección opuesta en una carretera separada por una barrera
      física o mediana
    D: Cuando el autobús está detenido en una zona designada de 'no detenerse'
  answer: C
  explanation: En Wyoming, no tiene que detenerse si viaja en la dirección opuesta
    en una carretera que está dividida por una mediana o una barrera física.
- id: 164
  category: sharing_the_road
  question: 'Si no puede cambiarse de carril de manera segura para ceder el paso a
    un vehículo de emergencia en una carretera de Wyoming con un límite de velocidad
    de 45 mph o superior, debe reducir la velocidad al menos a:'
  choices:
    A: 10 mph por debajo del límite de velocidad indicado
    B: 15 mph por debajo del límite de velocidad indicado
    C: 20 mph por debajo del límite de velocidad indicado
    D: El límite de velocidad mínimo de 45 mph
  answer: C
  explanation: Según el Estatuto de Wyoming 31-5-224, si no es posible cambiarse de
    carril, el conductor debe reducir la velocidad al menos 20 mph por debajo del
    límite de velocidad indicado (si el límite es de 45 mph o superior).
- id: 165
  category: sharing_the_road
  question: ¿En Wyoming, a cuántos ciclistas se les permite legalmente circular uno
    al lado del otro (en paralelo) en un solo carril?
  choices:
    A: No más de dos
    B: No más de tres
    C: Los ciclistas siempre deben circular en fila india
    D: Tantos como quepan en el carril
  answer: A
  explanation: La ley de Wyoming establece que las personas que montan bicicletas
    en una calzada no deben circular más de dos en paralelo, excepto en senderos o
    partes de calzadas reservadas para el uso exclusivo de bicicletas.
- id: 166
  category: sharing_the_road
  question: 'Al seguir a un camión comercial grande, si no puede ver los espejos laterales
    del conductor del camión, usted se encuentra:'
  choices:
    A: En la 'Zona No' (punto ciego) del camión
    B: En una posición segura de succión (drafting)
    C: Siguiendo a una distancia segura de 50 pies
    D: En la 'Zona Despejada' del camión
  answer: A
  explanation: El Manual del Conductor de Wyoming enfatiza que si no puede ver la
    cara del conductor en sus espejos laterales, él no puede verlo a usted, lo que
    significa que está en su punto ciego o 'Zona No'.
- id: 167
  category: sharing_the_road
  question: ¿Cuál es la multa máxima por una primera infracción por rebasar ilegalmente
    a un autobús escolar detenido en Wyoming?
  choices:
    A: $150
    B: $250
    C: $435
    D: $1,000
  answer: C
  explanation: Según la ley de Wyoming, la multa por una primera infracción por rebasar
    a un autobús escolar detenido con luces rojas intermitentes puede ser de hasta
    $435.
- id: 168
  category: sharing_the_road
  question: 'Cuando un aparato de bomberos (camión de bomberos) responde a una alarma,
    la ley de Wyoming prohíbe seguirlo a una distancia menor de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Estatuto de Wyoming 31-5-1204 prohíbe a los conductores seguir a
    los aparatos de bomberos que viajan en respuesta a una alarma de incendio a una
    distancia menor de 500 pies.
- id: 169
  category: sharing_the_road
  question: 'Se debe exhibir un emblema de vehículo de movimiento lento (un triángulo
    naranja con borde rojo) en la parte trasera de cualquier vehículo que viaje a
    velocidades inferiores a:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio para los
    vehículos diseñados para viajar a velocidades de 25 mph o menos.
- id: 170
  category: sharing_the_road
  question: 'En Wyoming, cuando un peatón cruza la calle guiado por un animal de servicio
    o lleva un bastón blanco, usted debe:'
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Ceder el derecho de paso y tomar precauciones para evitar lesiones
    C: Proceder lentamente si no están en su camino directo
    D: Ceder el paso solo si hay un cruce de peatones marcado
  answer: B
  explanation: La ley de Wyoming exige que los conductores cedan el derecho de paso
    a cualquier peatón ciego que lleve un bastón blanco claramente visible o que esté
    acompañado por un perro guía.
- id: 171
  category: sharing_the_road
  question: ¿Qué parte del ancho del carril tiene derecho a usar una motocicleta cuando
    circula por él?
  choices:
    A: Solo la mitad izquierda
    B: Solo la mitad derecha
    C: El ancho completo del carril
    D: Solo la parte central
  answer: C
  explanation: Las motocicletas tienen derecho al uso completo de un carril, y los
    conductores de vehículos motorizados nunca deben intentar compartir un carril
    con una motocicleta.
- id: 172
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, es posible que el conductor necesite:'
  choices:
    A: Permanecer estrictamente en el carril derecho
    B: Abrirse hacia la izquierda para no golpear el bordillo
    C: Girar desde el carril izquierdo
    D: Detenerse y esperar a que el tráfico despeje ambos carriles
  answer: B
  explanation: Los camiones grandes tienen un radio de giro amplio y a menudo necesitan
    abrirse hacia la izquierda para completar un giro a la derecha sin golpear el
    bordillo u otros objetos.
- id: 173
  category: sharing_the_road
  question: Al adelantar a un ciclista en Wyoming, ¿cuál es la distancia mínima legal
    que un automovilista debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Wyoming (WS 31-5-203) exige que los automovilistas dejen
    una distancia segura al adelantar a una bicicleta, la cual se define como al menos
    tres pies de separación.
- id: 174
  category: sharing_the_road
  question: 'En Wyoming, no es obligatorio detenerse ante un autobús escolar con luces
    rojas intermitentes si usted viaja en la dirección opuesta y:'
  choices:
    A: La carretera tiene cuatro o más carriles
    B: La carretera está separada por una mediana o barrera física
    C: El límite de velocidad es superior a 55 mph
    D: Usted se encuentra a al menos 100 pies de distancia
  answer: B
  explanation: Los conductores que viajan en la dirección opuesta a un autobús escolar
    no necesitan detenerse si la calzada está separada por una mediana u otra barrera
    física.
- id: 175
  category: sharing_the_road
  question: ¿Cuánta distancia de seguimiento debe mantener cuando viaja detrás de
    una motocicleta en Wyoming?
  choices:
    A: Al menos 1 segundo
    B: Al menos 2 segundos
    C: Al menos 4 segundos
    D: Al menos 10 segundos
  answer: C
  explanation: El Manual del Conductor de Wyoming recomienda una distancia de seguimiento
    de al menos cuatro segundos cuando se circula detrás de una motocicleta para permitir
    que el motociclista tenga suficiente espacio para maniobrar o detenerse en una
    emergencia.
- id: 176
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con sirenas y luces activas se le acerca
    por detrás en una carretera de doble sentido, usted debe:'
  choices:
    A: Detenerse exactamente donde está
    B: Acelerar para apartarse del camino
    C: Conducir hacia el borde derecho de la carretera y detenerse
    D: Moverse al arcén izquierdo y detenerse
  answer: C
  explanation: La ley de Wyoming exige que los conductores se detengan en el borde
    derecho o bordillo de la carretera y permanezcan parados hasta que el vehículo
    de emergencia haya pasado.
- id: 177
  category: sharing_the_road
  question: 'En Wyoming, los ciclistas están legalmente obligados a circular:'
  choices:
    A: Solo por la acera
    B: En sentido contrario al tráfico
    C: Tan a la derecha como sea practicable
    D: En el centro del carril en todo momento
  answer: C
  explanation: Los ciclistas en Wyoming deben circular lo más a la derecha posible
    de la calzada, excepto al girar o para evitar peligros.
- id: 178
  category: sharing_the_road
  question: Según el Manual del Conductor de Wyoming, ¿cuál es la causa más común
    de colisiones entre automóviles y motocicletas?
  choices:
    A: Motociclistas a exceso de velocidad
    B: Conductores de automóviles que no ven la motocicleta
    C: Falla mecánica
    D: Malas condiciones de la carretera
  answer: B
  explanation: El manual establece que la causa más común de accidentes que involucran
    motocicletas es que el conductor de otro vehículo no ve la motocicleta en el tráfico.
- id: 179
  category: sharing_the_road
  question: Cuando un peatón se encuentra en un cruce de peatones no marcado en una
    intersección en Wyoming, ¿quién tiene el derecho de paso?
  choices:
    A: El automovilista
    B: El peatón
    C: Quien haya llegado primero a la intersección
    D: El automovilista, porque el cruce no está marcado
  answer: B
  explanation: En Wyoming, los automovilistas deben ceder el derecho de paso a los
    peatones que cruzan la calzada dentro de cualquier cruce de peatones marcado o
    no marcado en una intersección.
- id: 180
  category: vehicle_information
  question: 'En Wyoming, debe usar sus faros delanteros desde el atardecer hasta el
    amanecer y siempre que no pueda ver con claridad durante al menos:'
  choices:
    A: 200 pies
    B: 400 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Wyoming exige que los faros delanteros estén encendidos desde
    media hora después del atardecer hasta media hora antes del amanecer, y en cualquier
    otro momento en que la visibilidad sea inferior a 500 pies.
- id: 181
  category: vehicle_information
  question: 'Según la ley de Wyoming, los neumáticos se consideran inseguros e ilegales
    si la profundidad de la banda de rodadura es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos deben tener al menos 2/32 de pulgada de profundidad
    de la banda de rodadura en todas las ranuras principales para ser considerados
    seguros y legales para su operación en Wyoming.
- id: 182
  category: vehicle_information
  question: La ley de Wyoming exige que el polarizado de las ventanas laterales delanteras
    debe permitir el paso de al menos ¿qué porcentaje de luz?
  choices:
    A: 20%
    B: 28%
    C: 35%
    D: 50%
  answer: B
  explanation: El Estatuto de Wyoming 31-5-962 establece que la transmisión de luz
    para las ventanas a la derecha e izquierda inmediatas del conductor no debe ser
    inferior al 28%.
- id: 183
  category: vehicle_information
  question: Todo vehículo motorizado en Wyoming debe tener un sistema de frenos de
    servicio capaz de detener el vehículo en cuántos pies a una velocidad de 20 mph?
  choices:
    A: 15 pies
    B: 25 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: Los estándares de equipamiento de Wyoming exigen que el freno de pie
    (freno de servicio) debe ser capaz de detener el vehículo en un tramo de 25 pies
    cuando viaja a 20 mph en un pavimento seco y nivelado.
- id: 184
  category: vehicle_information
  question: La ley de Wyoming exige que todo vehículo motorizado debe estar equipado
    con un espejo que permita al conductor ver al menos ¿cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 150 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Todos los vehículos motorizados en Wyoming deben tener un espejo ubicado
    de tal manera que refleje al conductor una vista de la carretera por una distancia
    de al menos 200 pies hacia atrás.
- id: 185
  category: vehicle_information
  question: En Wyoming, ¿es ilegal operar un vehículo motorizado equipado con cuál
    de las siguientes modificaciones de escape?
  choices:
    A: Una punta de escape cromada
    B: Un sistema de escape doble
    C: Un recorte o derivación del silenciador (muffler cutout or bypass)
    D: Un convertidor catalítico
  answer: C
  explanation: La ley de Wyoming prohíbe el uso de un recorte de silenciador, derivación
    o dispositivo similar en un vehículo motorizado operado en una carretera.
- id: 186
  category: vehicle_information
  question: 'En Wyoming, se debe mostrar un emblema de "Vehículo de movimiento lento"
    (Slow Moving Vehicle) en la parte trasera de cualquier vehículo diseñado para
    operar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema triangular de "Vehículo de movimiento lento" es obligatorio
    para los vehículos diseñados para viajar a velocidades de 25 mph o menos.
- id: 187
  category: vehicle_information
  question: Para la mayoría de los vehículos de pasajeros estándar registrados en
    Wyoming, ¿cuántas placas de matrícula se deben mostrar?
  choices:
    A: Una, solo en la parte trasera
    B: Una, solo en la parte delantera
    C: Dos, una en la parte delantera y otra en la trasera
    D: Dos, ambas en el parachoques trasero
  answer: C
  explanation: 'La ley de Wyoming generalmente exige que se exhiban de manera visible
    dos placas de matrícula en la mayoría de los vehículos motorizados: una en la
    parte delantera y otra en la trasera.'
- id: 188
  category: vehicle_information
  question: 'La ley de Wyoming exige que todo vehículo motorizado tenga una bocina
    que se pueda escuchar desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Todo vehículo motorizado debe estar equipado con una bocina en buen
    estado de funcionamiento capaz de emitir un sonido audible en condiciones normales
    desde una distancia no inferior a 200 pies.
- id: 189
  category: vehicle_information
  question: En Wyoming, ¿cuál es la altura máxima legal para un vehículo, incluida
    la carga, a menos que se obtenga un permiso especial?
  choices:
    A: 12 pies, 6 pulgadas
    B: 13 pies, 6 pulgadas
    C: 14 pies
    D: 15 pies
  answer: C
  explanation: En Wyoming, la altura máxima para cualquier vehículo, incluida su carga,
    es de 14 pies, a menos que se haya emitido un permiso especial.
- id: 190
  category: vehicle_information
  question: Al remolcar un tráiler en Wyoming, ¿la barra de tracción o conexión entre
    los dos vehículos no debe exceder cuántos pies de longitud?
  choices:
    A: 8 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: La ley de Wyoming especifica que la barra de tracción u otra conexión
    entre un vehículo remolcador y uno remolcado no debe exceder los 15 pies de longitud.
- id: 191
  category: vehicle_information
  question: 'Según el Manual del Conductor de Wyoming, las luces delanteras deben
    encenderse desde el atardecer hasta el amanecer y siempre que la visibilidad sea
    inferior a:'
  choices:
    A: 500 pies
    B: 750 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: La ley de Wyoming exige el uso de las luces delanteras desde el atardecer
    hasta el amanecer y en cualquier otro momento en que, debido a la falta de luz
    o a condiciones atmosféricas desfavorables, las personas y los vehículos en la
    carretera no sean claramente visibles a una distancia de 1,000 pies hacia adelante.
- id: 192
  category: vehicle_information
  question: 'Para ser considerados seguros y legales en Wyoming, los neumáticos deben
    tener una profundidad mínima de la banda de rodadura de al menos:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Wyoming exige que los neumáticos tengan una profundidad de
    la banda de rodadura de al menos 2/32 de pulgada en cualquiera de las dos ranuras
    principales adyacentes.
- id: 193
  category: vehicle_information
  question: 'Según la ley de Wyoming, los frenos de servicio de un vehículo de pasajeros
    deben ser capaces de detener el vehículo desde una velocidad de 20 mph en una
    distancia de:'
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 50 pies
  answer: B
  explanation: Los estándares de equipamiento de Wyoming exigen que los frenos de
    servicio de un vehículo de pasajeros puedan detener el vehículo en un tramo de
    25 pies cuando circula a 20 mph.
- id: 194
  category: vehicle_information
  question: ¿Cuál de las siguientes opciones es ilegal según la ley de Wyoming en
    relación con los sistemas de escape de los vehículos?
  choices:
    A: Usar un silenciador que cumpla con las especificaciones del fabricante
    B: Usar un recorte de silenciador (muffler cutout), derivación (bypass) o dispositivo
      similar
    C: Tener un tubo de escape que se extienda hasta la parte trasera del vehículo
    D: Usar un silenciador que reduzca el ruido del motor
  answer: B
  explanation: La ley de Wyoming prohíbe el uso de recortes de silenciador (muffler
    cutout), derivaciones (bypass) o dispositivos similares en cualquier vehículo
    motorizado que circule por una carretera.
- id: 195
  category: vehicle_information
  question: En Wyoming, ¿qué porcentaje de luz, como mínimo, deben dejar pasar las
    ventanas situadas a la derecha e izquierda inmediatas del conductor?
  choices:
    A: 20%
    B: 28%
    C: 35%
    D: 50%
  answer: B
  explanation: La ley de Wyoming (W.S. 31-5-962) establece que el polarizado de las
    ventanas laterales debe permitir al menos un 28% de transmisión de luz.
- id: 196
  category: vehicle_information
  question: 'En Wyoming, se requiere un emblema de Vehículo de Movimiento Lento (SMV)
    para cualquier vehículo diseñado para circular a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema triangular de color naranja fluorescente de SMV debe colocarse
    en la parte trasera de los vehículos diseñados para circular a 25 mph o menos.
- id: 197
  category: vehicle_information
  question: 'La bocina de un vehículo motorizado en Wyoming debe ser audible en condiciones
    normales desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los estatutos de Wyoming exigen que todo vehículo motorizado esté equipado
    con una bocina capaz de emitir un sonido audible en condiciones normales desde
    una distancia no inferior a 200 pies.
- id: 198
  category: vehicle_information
  question: 'La ley de Wyoming exige que la placa de matrícula trasera esté iluminada
    por una luz blanca para que sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La placa de matrícula trasera debe estar iluminada de modo que sea
    visible y legible desde una distancia de 50 pies hacia atrás.
- id: 199
  category: vehicle_information
  question: Según la ley de Wyoming, ¿a qué distancia mínima deben ser visibles las
    luces direccionales bajo la luz solar normal?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Las regulaciones de equipamiento de Wyoming exigen que las luces direccionales
    sean visibles desde una distancia de al menos 100 pies bajo la luz solar normal.
- id: 200
  category: vehicle_information
  question: Al remolcar un remolque u otro vehículo en Wyoming, ¿qué equipo se requiere
    además del enganche principal?
  choices:
    A: Una bandera roja
    B: Cadenas de seguridad
    C: Una segunda bola de enganche
    D: Una batería auxiliar
  answer: B
  explanation: La ley de Wyoming exige el uso de cadenas o cables de seguridad además
    del enganche principal para evitar que el remolque se separe si el enganche falla.
- id: 201
  category: vehicle_information
  question: ¿En Wyoming, si usted está involucrado en un choque donde los daños a
    la propiedad parecen ser superiores a qué cantidad, debe notificar inmediatamente
    a la policía?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: B
  explanation: La ley de Wyoming exige la notificación inmediata a las autoridades
    policiales de cualquier choque que resulte en lesiones, muerte o daños totales
    a la propiedad por un valor aparente de $1,000 o más.
- id: 202
  category: signs_and_signals
  question: ¿Qué significa una señal de flecha amarilla intermitente en Wyoming?
  choices:
    A: Detenerse y esperar a una flecha verde.
    B: Se permiten los giros, pero primero debe ceder el paso al tráfico en sentido
      contrario y a los peatones.
    C: La señal está a punto de cambiar a rojo; despeje la intersección de inmediato.
    D: Usted tiene el derecho de paso para girar a la izquierda.
  answer: B
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero debe ceder el paso al tráfico en sentido contrario y a los
    peatones antes de completar el giro.
- id: 203
  category: signs_and_signals
  question: Al usar señales manuales para indicar un giro, ¿qué significa cuando el
    brazo del conductor está extendido hacia abajo?
  choices:
    A: Giro a la izquierda
    B: Giro a la derecha
    C: Detenerse o disminuir la velocidad
    D: Giro en U
  answer: C
  explanation: En Wyoming, la señal manual para detenerse o reducir la velocidad es
    el brazo extendido hacia abajo con la palma hacia atrás.
- id: 204
  category: signs_and_signals
  question: 'Una línea blanca continua entre carriles de tráfico que se mueven en
    la misma dirección indica:'
  choices:
    A: Se recomienda cambiar de carril.
    B: Se desaconseja cambiar de carril.
    C: La carretera está a punto de terminar.
    D: Usted está en una calle de sentido único.
  answer: B
  explanation: Se utiliza una línea blanca continua para separar los carriles de tráfico
    que se mueven en la misma dirección e indica que se desaconseja cambiar de carril
    por razones de seguridad.
- id: 205
  category: signs_and_signals
  question: 'Una señal de tráfico con forma de pentágono (cinco lados) se utiliza
    exclusivamente para:'
  choices:
    A: Señales de alto (Stop)
    B: Señales de ceda el paso (Yield)
    C: Zonas escolares o cruces escolares
    D: Cruces de ferrocarril
  answer: C
  explanation: La forma de pentágono está reservada para las señales de zonas escolares
    y cruces escolares para alertar a los conductores sobre la presencia de niños.
- id: 206
  category: signs_and_signals
  question: 'En Wyoming, usted puede girar a la derecha con luz roja después de una
    parada completa EXCEPTO:'
  choices:
    A: Durante las horas nocturnas.
    B: Si hay una señal que lo prohíba.
    C: Si se encuentra en una zona residencial.
    D: Si tiene un pasajero menor de 18 años.
  answer: B
  explanation: La ley de Wyoming permite girar a la derecha en rojo después de una
    parada completa y ceder el paso al tráfico y a los peatones, a menos que haya
    una señal de 'No girar en rojo' (No Turn on Red) colocada.
- id: 207
  category: signs_and_signals
  question: 'Una luz de tráfico amarilla fija significa:'
  choices:
    A: Acelerar para despejar la intersección.
    B: La luz está a punto de cambiar a verde.
    C: La luz está a punto de cambiar a rojo; deténgase si es seguro hacerlo.
    D: Usted tiene el derecho de paso para girar a la izquierda.
  answer: C
  explanation: Una luz amarilla fija advierte que la señal está cambiando a rojo.
    Los conductores deben detenerse si pueden hacerlo de manera segura; de lo contrario,
    deben despejar la intersección.
- id: 208
  category: signs_and_signals
  question: ¿Cuál es el propósito de un carril central compartido marcado con líneas
    amarillas continuas y discontinuas en ambos lados?
  choices:
    A: Rebasar tráfico más lento.
    B: Solo para estacionamiento de emergencia.
    C: Realizar giros a la izquierda desde cualquier dirección.
    D: Solo para vehículos de alta ocupación.
  answer: C
  explanation: Los carriles centrales de giro compartidos están reservados para que
    los vehículos que viajan en cualquier dirección realicen giros a la izquierda.
    No deben usarse para rebasar.
- id: 209
  category: signs_and_signals
  question: 'Una señal de ''Aspa'' (Crossbuck) en un cruce de ferrocarril debe tratarse
    igual que una:'
  choices:
    A: Señal de alto (Stop)
    B: Señal de ceda el paso (Yield)
    C: Señal de límite de velocidad
    D: Señal de zona de no rebasar
  answer: B
  explanation: La señal de aspa de ferrocarril es una señal reglamentaria que requiere
    que los conductores cedan el paso a cualquier tren que se aproxime.
- id: 210
  category: signs_and_signals
  question: 'Una señal en forma de rombo con fondo amarillo es una:'
  choices:
    A: Señal reglamentaria
    B: Señal de guía
    C: Señal de advertencia
    D: Señal de servicio
  answer: C
  explanation: Las señales amarillas en forma de rombo son señales de advertencia
    que alertan a los conductores sobre posibles peligros o cambios en las condiciones
    de la carretera más adelante.
- id: 211
  category: signs_and_signals
  question: 'De acuerdo con la ley de ''Hacerse a un lado'' (Move Over) de Wyoming,
    al acercarse a un vehículo de emergencia con luces intermitentes detenido a un
    costado de una carretera de varios carriles, usted debe:'
  choices:
    A: Mantener su velocidad y permanecer en su carril.
    B: Cambiarse al carril más alejado del vehículo de emergencia si es seguro hacerlo.
    C: Detenerse inmediatamente en la calzada.
    D: Tocar la bocina para alertar a los trabajadores de emergencia.
  answer: B
  explanation: La ley de Wyoming exige que los conductores se muevan a un carril no
    adyacente al acercarse a un vehículo de emergencia estacionado con luces intermitentes,
    o que reduzcan la velocidad significativamente si no es posible cambiarse de carril.
- id: 212
  category: signs_and_signals
  question: En Wyoming, ¿qué significa una luz de semáforo roja intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: La luz está a punto de cambiar a verde
    C: Detenerse por completo y proceder solo cuando sea seguro
    D: Ceder el paso al tráfico que viene en sentido contrario pero no detenerse
  answer: C
  explanation: Según el Manual del Conductor de Wyoming, una luz roja intermitente
    significa lo mismo que una señal de alto (pare). Debe detenerse por completo y
    proceder solo cuando sea seguro hacerlo.
- id: 213
  category: signs_and_signals
  question: Al pasar por una zona escolar en Wyoming, ¿cuál es el límite de velocidad
    cuando las luces están parpadeando o hay señales colocadas?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: La ley estatal de Wyoming establece el límite de velocidad en las zonas
    escolares en 20 mph cuando se colocan las señales correspondientes o cuando las
    luces intermitentes están en funcionamiento.
- id: 214
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla continua en su lado de una carretera de
    dos carriles en Wyoming?
  choices:
    A: Puede adelantar si no viene tráfico
    B: Zona de construcción más adelante
    C: Está prohibido adelantar
    D: Trabajos en el arcén (hombro) más adelante
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central significa
    que está prohibido adelantar para los vehículos que viajan en su dirección.
- id: 215
  category: signs_and_signals
  question: 'Para indicar un giro a la derecha mediante señales manuales, un conductor
    en Wyoming debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera de la ventana
    B: Extender el brazo izquierdo hacia afuera y doblarlo hacia arriba por el codo
    C: Extender el brazo izquierdo hacia afuera y doblarlo hacia abajo por el codo
    D: Extender el brazo derecho recto hacia afuera de la ventana
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido hacia afuera de la ventana y doblado hacia arriba en un ángulo de 90
    grados.
- id: 216
  category: signs_and_signals
  question: 'En Wyoming, una señal en forma de pentágono (cinco lados) siempre indica:'
  choices:
    A: Un cruce de ferrocarril
    B: Una señal de alto (pare)
    C: Una zona escolar o cruce escolar
    D: Una señal de ceder el paso
  answer: C
  explanation: Las señales en forma de pentágono se reservan específicamente para
    zonas escolares y cruces escolares para advertir a los conductores sobre la presencia
    de niños en el área.
- id: 217
  category: signs_and_signals
  question: ¿Cuál es el significado principal de una señal naranja en forma de diamante
    en Wyoming?
  choices:
    A: Advertencia general de peligros en la carretera
    B: Advertencia de construcción o mantenimiento
    C: Guía direccional hacia parques estatales
    D: Límite de velocidad reglamentario
  answer: B
  explanation: El naranja es el color estándar para las señales de construcción y
    mantenimiento en Wyoming, y se utiliza para alertar a los conductores sobre zonas
    de trabajo.
- id: 218
  category: signs_and_signals
  question: 'Al acercarse a una luz de semáforo amarilla fija en Wyoming, usted debe:'
  choices:
    A: Acelerar para pasar antes de que la luz cambie a roja
    B: Detenerse si puede hacerlo de manera segura antes de entrar en la intersección
    C: Detenerse inmediatamente, incluso si está en medio de la intersección
    D: Tratarla como una señal de alto (pare)
  answer: B
  explanation: Una luz amarilla fija indica que la señal está cambiando a rojo. Los
    conductores deben detenerse si pueden hacerlo de manera segura; de lo contrario,
    deben despejar la intersección con precaución.
- id: 219
  category: signs_and_signals
  question: 'Una línea blanca continua pintada en el borde derecho de la calzada se
    conoce como:'
  choices:
    A: Línea de parada
    B: Línea central
    C: Línea de niebla (fog line)
    D: Línea de ceder el paso
  answer: C
  explanation: Las líneas blancas continuas en el lado derecho de la carretera se
    llaman líneas de niebla. Ayudan a los conductores a permanecer en la carretera
    durante condiciones de poca visibilidad.
- id: 220
  category: signs_and_signals
  question: ¿Qué indica una señal de 'Aspa' o 'Cruz de San Andrés' (forma de X)?
  choices:
    A: Una intersección de cuatro vías
    B: Un hospital cercano
    C: Un cruce de ferrocarril
    D: Zona de no adelantar
  answer: C
  explanation: La señal de aspa (crossbuck) es una señal reglamentaria que se utiliza
    en los cruces de ferrocarril para identificar la ubicación de las vías.
- id: 221
  category: signs_and_signals
  question: ¿En Wyoming, cuál es el límite de velocidad no señalizado en un 'distrito
    urbano'?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: De acuerdo con el Estatuto de Wyoming 31-5-301, el límite de velocidad
    en cualquier distrito urbano es de 30 mph a menos que se indique lo contrario.
- id: 222
  category: signs_and_signals
  question: 'En Wyoming, las multas por exceso de velocidad se duplican cuando la
    infracción ocurre en:'
  choices:
    A: Una zona residencial por la noche
    B: Una zona escolar durante el horario escolar
    C: Una zona de construcción designada con trabajadores presentes
    D: Un paso de montaña durante una tormenta de nieve
  answer: C
  explanation: La ley de Wyoming dicta que las multas por exceso de velocidad y otras
    infracciones de tránsito se duplican en las zonas de construcción cuando hay trabajadores
    presentes y hay señales colocadas.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 223
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 224
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta carretera
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico en sentido contrario.
  id: 225
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debería hacer?
  choices:
    A: Dar una vuelta en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de
    manera segura.
  id: 226
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 227
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Vueltas en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de vuelta en U tachada
    significa que las vueltas en U están prohibidas en este lugar.
  id: 228
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 229
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite la vuelta en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 230
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal amarilla en forma de banderín con letras negras que dice
    "NO PASSING ZONE" (Zona de no rebasar) significa que no se le permite rebasar
    a otros vehículos en esta área. Marca el comienzo de una zona de no rebasar.
  id: 231
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha únicamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "KEEP RIGHT" (Manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 232
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 233
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 234
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 235
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 236
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras "R" es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 237
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de trenes. Significa que debe ceder el paso a los trenes. Si se
    acerca un tren, debe detenerse.
  id: 238
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 239
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa giro a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 240
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero en un sentido y luego en el otro.
  id: 241
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros adelante
    D: Una colina adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 242
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: Un carril que termina
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 243
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente adelante
    B: La carretera se estrecha adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción en el ancho de la carretera y ajuste
    su posición en el carril.
  id: 244
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 245
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación adelante
    D: Construcción de carretera adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 246
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento adelante
    C: 'Tráfico de doble sentido adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 247
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 248
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 249
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) adelante
    B: Un semáforo adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 250
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 251
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde los caminos laterales.
  id: 252
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 253
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 254
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 255
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 256
