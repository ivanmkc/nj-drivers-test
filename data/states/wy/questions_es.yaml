questions:
- id: 1
  category: safe_driving_rules
  question: Según el manual del conductor de Wyoming, la conducción segura implica
    obedecer las normas de tránsito, ser cortés, conducir a la defensiva y ¿qué más?
  choices:
    A: Conducir por debajo del límite de velocidad en todo momento
    B: Asegurarse de que usted y sus pasajeros usen el cinturón de seguridad
    C: Tocar la bocina en las intersecciones
    D: No conducir nunca de noche
  answer: B
  explanation: El manual establece que la conducción segura implica obedecer las normas
    y reglamentos de tránsito, ser cortés en la carretera, conducir a la defensiva
    y asegurarse de que usted y sus pasajeros usen el cinturón de seguridad.
- id: 2
  category: driver_responsibility
  question: ¿Por qué el manual del conductor de Wyoming NO puede utilizarse como una
    expresión real de la ley?
  choices:
    A: Se actualiza con demasiada frecuencia.
    B: No utiliza el lenguaje exacto de la Ley de Vehículos Motorizados de Wyoming.
    C: Está destinado únicamente a conductores de fuera del estado.
    D: Solo se aplica a conductores comerciales.
  answer: B
  explanation: Según el manual, el lenguaje de la Ley de Vehículos Motorizados de
    Wyoming no se utiliza en el manual, por lo que este no puede usarse como una expresión
    real de la ley.
- id: 3
  category: driver_testing
  question: Debido a que el manual del conductor cubre solo los requisitos básicos,
    ¿qué insta el manual a hacer a las personas que están aprendiendo a conducir?
  choices:
    A: Aprovechar las clases locales de educación vial
    B: Conducir solo en estacionamientos vacíos
    C: Esperar hasta los 18 años para obtener la licencia
    D: Leer la Ley de Vehículos Motorizados de Wyoming completa
  answer: A
  explanation: El manual insta a las personas que están aprendiendo a conducir a que
    también aprovechen las clases locales de educación vial, ya que el manual solo
    cubre los requisitos básicos.
- id: 4
  category: driver_testing
  question: Según el índice del manual, ¿cuál de las siguientes es una de las pruebas
    requeridas para obtener una licencia?
  choices:
    A: Prueba de audición
    B: Prueba de reflejos
    C: Examen de la vista
    D: Evaluación psicológica
  answer: C
  explanation: El índice enumera 'Examen de la vista', 'Prueba escrita' y 'Prueba
    de habilidades' en la sección de Pruebas Requeridas.
- id: 5
  category: license_system
  question: Según el índice, ¿a qué edad puede un conductor obtener privilegios de
    conducción completos?
  choices:
    A: '15'
    B: 15 y medio
    C: '16'
    D: 16 y medio
  answer: D
  explanation: El índice incluye una sección para obtener privilegios de conducción
    completos 'A los 16 años y medio'.
- id: 6
  category: license_system
  question: Además de los 16 años y medio, ¿en qué otra edad específica el manual
    incluye una sección para obtener privilegios de conducción completos?
  choices:
    A: '17'
    B: '18'
    C: '19'
    D: '21'
  answer: A
  explanation: El índice incluye una sección para obtener privilegios de conducción
    completos 'A los 17 años'.
- id: 7
  category: license_system
  question: ¿Por qué razón específica menciona el manual la emisión de una licencia
    restringida por edad?
  choices:
    A: Excelencia académica
    B: Inconveniencia extrema
    C: Solo para trabajo agrícola
    D: Emancipación
  answer: B
  explanation: El índice enumera 'Por inconveniencia extrema' bajo la sección de Licencias
    Restringidas por Edad.
- id: 8
  category: alcohol_drugs_health
  question: Según la sección de leyes y problemas de seguridad, ¿qué se identifica
    como la causa principal de los choques?
  choices:
    A: Exceso de velocidad
    B: Conducción distraída
    C: Alcohol
    D: Mal tiempo
  answer: C
  explanation: El índice enumera explícitamente una sección titulada 'El alcohol,
    la causa principal de los choques'.
- id: 9
  category: driver_responsibility
  question: ¿Dónde se pueden encontrar los estatutos reales relacionados con las licencias
    de conducir y los vehículos motorizados?
  choices:
    A: El Manual de Licencia de Conducir de Wyoming
    B: Leyes de Wyoming y Estatutos Relacionados
    C: Las Regulaciones Federales de Seguridad de Autotransportes
    D: El Manual de la Patrulla de Caminos
  answer: B
  explanation: El manual establece que los estatutos relacionados con las licencias
    de conducir y los vehículos motorizados se encuentran en las Leyes de Wyoming
    y Estatutos Relacionados.
- id: 10
  category: penalties_and_points
  question: ¿Cuál de los siguientes dispositivos se enumera en el manual bajo la sección
    sobre la pérdida del privilegio de conducir?
  choices:
    A: Detector de radar
    B: Dispositivo de interbloqueo de encendido
    C: Sistema de navegación GPS
    D: Dispositivo de registro electrónico
  answer: B
  explanation: El índice enumera 'Dispositivos de interbloqueo de encendido' bajo
    la sección sobre la pérdida del privilegio de conducir.
- id: 11
  category: license_system
  question: ¿Qué registro figura como un servicio adicional para conductores/automovilistas
    en el manual del conductor de Wyoming?
  choices:
    A: Registro de Donantes de Órganos y Tejidos de Wyoming
    B: Registro de Votantes de Wyoming
    C: Registro de Armas de Fuego de Wyoming
    D: Registro de Modificación de Vehículos de Wyoming
  answer: A
  explanation: El "Registro de Donantes de Órganos y Tejidos de Wyoming" figura en
    el índice bajo Servicios adicionales para conductores/automovilistas.
- id: 12
  category: safe_driving_rules
  question: ¿Qué sistema de alerta está cubierto específicamente en la sección de
    servicios adicionales para conductores/automovilistas?
  choices:
    A: Sistema de Alerta Silver (Silver Alert System)
    B: Sistema de Alerta AMBER (AMBER Alert System)
    C: Sistema de Alerta Blue (Blue Alert System)
    D: Sistema de Alerta Meteorológica
  answer: B
  explanation: El "Sistema de Alerta AMBER de Wyoming" figura en el índice bajo Servicios
    adicionales para conductores/automovilistas.
- id: 13
  category: license_system
  question: ¿Qué convenio (compact) se analiza en la sección de leyes/temas de seguridad
    del manual?
  choices:
    A: El Convenio de Carreteras Interestatales
    B: El Convenio de Licencias de Conducir (Driver License Compact)
    C: El Convenio de Registro de Vehículos
    D: El Convenio de Infracciones de Tránsito
  answer: B
  explanation: El "Convenio de Licencias de Conducir" (Driver License Compact) figura
    en el índice bajo Leyes/temas de seguridad.
- id: 14
  category: penalties_and_points
  question: ¿Qué formulario o requisito se asocia con las suspensiones, cancelaciones
    y revocaciones de licencias en el manual?
  choices:
    A: W-2
    B: '1099'
    C: SR-22
    D: I-9
  answer: C
  explanation: El índice enumera el "SR-22" en la sección relativa a suspensiones,
    cancelaciones y revocaciones de licencias.
- id: 15
  category: license_system
  question: Si tiene preguntas sobre su licencia de conducir, ¿con qué departamento
    debe comunicarse según el manual?
  choices:
    A: Patrulla de Caminos de Wyoming (Wyoming Highway Patrol)
    B: Departamento de Transporte de Wyoming, Servicios al Conductor (Driver Services)
    C: Departamento de Ingresos de Wyoming
    D: Secretaría de Estado de Wyoming
  answer: B
  explanation: El manual aconseja que, si tiene alguna pregunta, debe comunicarse
    con Servicios al Conductor (Driver Services) del Departamento de Transporte de
    Wyoming.
- id: 16
  category: license_system
  question: ¿Quién NO está obligado a obtener una licencia de conducir de Wyoming
    para conducir legalmente en el estado?
  choices:
    A: Un estudiante a tiempo parcial en un colegio comunitario de Wyoming
    B: Un miembro de las Fuerzas Armadas estacionado en Wyoming que tenga una licencia
      válida de su estado de residencia
    C: Un nuevo residente que ha vivido en Wyoming durante dos años
    D: Cualquier persona mayor de 21 años
  answer: B
  explanation: Los miembros de las Fuerzas Armadas estacionados en Wyoming, y sus
    dependientes, que tengan una licencia válida emitida por su estado de residencia
    no necesitan obtener una licencia de conducir de Wyoming.
- id: 17
  category: license_system
  question: Si tiene una licencia de otro estado miembro del Convenio de Licencias
    de Conducir (Driver License Compact) y se muda a Wyoming, ¿cuánto tiempo tiene
    para entregar su licencia de otro estado?
  choices:
    A: Dentro de los 30 días de residencia
    B: Dentro de los 6 meses de residencia
    C: Dentro de 1 año de residencia
    D: Dentro de 2 años de residencia
  answer: C
  explanation: Cualquier persona con licencia de otro estado que sea miembro del Convenio
    de Licencias de Conducir (Driver License Compact) debe entregar su licencia de
    fuera del estado dentro de un año de residencia en Wyoming.
- id: 18
  category: license_system
  question: ¿Cuál de las siguientes personas es elegible para obtener una licencia
    de conducir de Wyoming?
  choices:
    A: Una persona de 15 años que solicita privilegios de conducción completos
    B: Una persona cuyos privilegios de conducción están suspendidos en otro estado
    C: Una persona que ha sido declarada legalmente incompetente
    D: Un joven de 17 años que ha aprobado todos los exámenes requeridos
  answer: D
  explanation: Las personas menores de 16 años, aquellas con licencias suspendidas
    y aquellas declaradas legalmente incompetentes no pueden obtener una licencia.
    Un solicitante debe tener al menos 17 años para obtener privilegios de conducción
    completos.
- id: 19
  category: license_system
  question: ¿Cuál es la clasificación de peso bruto vehicular (GVWR) máxima de un
    solo vehículo que puede operar con una licencia estándar Clase C no comercial?
  choices:
    A: Menos de 10,000 libras
    B: Menos de 16,000 libras
    C: Menos de 26,001 libras
    D: Menos de 30,000 libras
  answer: C
  explanation: La licencia Clase C autoriza la operación de un solo vehículo o combinación
    de vehículos, excepto motocicletas, con un GVWR inferior a 26,001 libras.
- id: 20
  category: license_system
  question: ¿Qué clase de licencia se emite únicamente para la operación de motocicletas
    en Wyoming?
  choices:
    A: Clase A
    B: Clase C
    C: Clase M
    D: Clase R
  answer: C
  explanation: La licencia clase "M" se emite únicamente para la operación de motocicletas.
- id: 21
  category: license_system
  question: ¿Qué significa el código de restricción 'B' en una licencia de conducir
    de Wyoming?
  choices:
    A: Se requiere transmisión automática
    B: Se requieren lentes correctores
    C: Conducción solo durante el día
    D: Se requiere ayuda mecánica
  answer: B
  explanation: Según los códigos de restricción del manual, 'B' significa lentes correctores.
- id: 22
  category: license_system
  question: Si un conductor tiene el código de restricción 'G' en su licencia, ¿a
    qué está restringido?
  choices:
    A: Conducir solo vehículos con transmisión automática
    B: Conducir solo durante las horas del día
    C: Conducción solo dentro del estado (intrastatal)
    D: Conducir sin pasajeros
  answer: B
  explanation: Según los códigos de restricción, 'G' significa conducir solo durante
    el día.
- id: 23
  category: license_system
  question: ¿A qué edad puede un solicitante obtener un permiso de instrucción en
    Wyoming?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '17'
  answer: B
  explanation: Se puede obtener un permiso de instrucción a los 15 años de edad.
- id: 24
  category: license_system
  question: ¿Qué se requiere para que una persona de 16 años y medio obtenga privilegios
    de conducción completos en Wyoming?
  choices:
    A: Debe haber tenido un permiso de instrucción durante un año.
    B: Debe haber completado un curso de educación vial aprobado y haber tenido una
      licencia intermedia durante seis meses.
    C: Debe aprobar un examen de la vista y conducir solo durante las horas del día.
    D: No puede obtener privilegios de conducción completos hasta que cumpla 18 años.
  answer: B
  explanation: Para obtener privilegios de conducción completos, el solicitante debe
    tener al menos 17 años, o tener 16 años y medio y haber completado un curso de
    educación vial aprobado y haber tenido una licencia intermedia durante seis meses.
- id: 25
  category: license_system
  question: Los solicitantes de una licencia de conducir por primera vez deben proporcionar
    una identificación legal aceptable. ¿Cuál de los siguientes NO figura como un
    documento principal aceptable?
  choices:
    A: Un certificado de nacimiento certificado por el estado
    B: Un pasaporte estadounidense válido
    C: Documentos de inmigración
    D: Una tarjeta de identificación de estudiante de secundaria
  answer: D
  explanation: Los solicitantes por primera vez deben proporcionar un certificado
    de nacimiento certificado por el estado, un pasaporte estadounidense válido o
    documentos de inmigración. Una identificación de estudiante no figura como identificación
    legal aceptable.
- id: 26
  category: driver_responsibility
  question: ¿Cuántos días tiene para notificar al departamento por escrito cuando
    cambia su dirección?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: Cuando los titulares de licencias cambian sus direcciones, deben notificar
    al departamento por escrito dentro de los 10 días posteriores al cambio.
- id: 27
  category: license_system
  question: ¿Cuántos documentos aceptables se deben proporcionar como prueba de que
    usted es residente de Wyoming?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Se deben proporcionar dos de los documentos aceptables de la lista
    como prueba de que usted es residente de Wyoming.
- id: 28
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para los documentos utilizados
    para probar la residencia en Wyoming?
  choices:
    A: Deben mostrar una dirección de apartado postal (P.O. Box).
    B: Deben mostrar una dirección residencial, no un apartado postal (P.O. Box).
    C: Deben estar notarizados por un funcionario estatal.
    D: Deben haber sido emitidos en los últimos 30 días.
  answer: B
  explanation: Los documentos aceptables proporcionados como prueba de residencia
    en Wyoming deben mostrar una dirección residencial, no un apartado postal (P.O.
    Box).
- id: 29
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima requerida en ambos ojos para cumplir
    con los estándares de visión de Wyoming para operar un vehículo motorizado?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Una persona debe tener una agudeza de 20/40 con ambos ojos, ya sea
    con o sin anteojos, para cumplir con los estándares de visión de Wyoming.
- id: 30
  category: driver_testing
  question: Además de la agudeza visual, ¿cuál es el campo de visión horizontal combinado
    mínimo requerido para aprobar el examen de la vista?
  choices:
    A: 90 grados
    B: 100 grados
    C: 120 grados
    D: 140 grados
  answer: C
  explanation: Una persona debe tener un campo de visión horizontal combinado de al
    menos 120 grados para cumplir con los estándares de visión de Wyoming para operar
    un vehículo motorizado.
- id: 31
  category: driver_testing
  question: ¿Si su agudeza visual es peor que 20/40 pero de al menos 20/100, qué se
    le requerirá hacer?
  choices:
    A: Obtener una licencia restringida
    B: Realizar un examen de habilidades de conducción
    C: Conducir solo durante las horas del día
    D: Usar lentes correctivos en todo momento
  answer: B
  explanation: El manual establece que si su agudeza visual es peor que 20/40 pero
    de al menos 20/100, se le requerirá realizar un examen de habilidades de conducción.
- id: 32
  category: driver_testing
  question: ¿Cuántas veces se les permite a los solicitantes de una licencia de conducir
    realizar el examen escrito en un solo día?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Veces ilimitadas
  answer: B
  explanation: A los solicitantes de una licencia de conducir se les permite realizar
    el examen escrito dos veces en un solo día.
- id: 33
  category: driver_testing
  question: Para eximir el examen de habilidades utilizando una tarjeta de certificación
    de educación vial, ¿cuántas horas de instrucción debe haber completado el estudiante?
  choices:
    A: 20 horas de instrucción en el aula y 4 horas de conducción al volante
    B: 30 horas de instrucción en el aula y 6 horas de conducción al volante
    C: 40 horas de instrucción en el aula y 10 horas de conducción al volante
    D: 50 horas de instrucción en el aula y 10 horas de conducción al volante
  answer: B
  explanation: La tarjeta de certificación debe indicar que el estudiante ha completado
    30 horas de instrucción en el aula y seis horas de conducción al volante para
    eximir el examen de habilidades.
- id: 34
  category: license_system
  question: Al operar un vehículo motorizado con un permiso de instrucción, ¿el conductor
    debe estar acompañado por una persona de al menos qué edad?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Al operar un vehículo motorizado con un permiso de instrucción, el
    conductor debe estar acompañado por una persona de 18 años o más que posea una
    licencia de conducir válida para el tipo de vehículo que se está conduciendo.
- id: 35
  category: license_system
  question: Si el titular de una licencia es menor de 21 años y desea una licencia
    de tipo "adulto", ¿cuándo puede renovar su licencia?
  choices:
    A: Dentro de los 120 días anteriores al vencimiento
    B: Dentro de los 90 días del vencimiento
    C: Dentro de los 60 días de su cumpleaños número 21
    D: Dentro de los 30 días de su cumpleaños número 21
  answer: D
  explanation: Si el titular de una licencia es menor de 21 años y desea una licencia
    de tipo "adulto", solo puede renovarla dentro de los 30 días de su cumpleaños
    número 21.
- id: 36
  category: license_system
  question: A los 16 años y medio de edad, se le pueden otorgar privilegios de conducción
    completos a un solicitante si ha tenido una licencia intermedia vigente durante
    al menos ¿cuánto tiempo?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: A los 16 años y medio de edad, se les pueden otorgar privilegios de
    conducción completos a los solicitantes si tienen una licencia intermedia vigente
    que tenga al menos seis meses de antigüedad.
- id: 37
  category: license_system
  question: Para calificar para una licencia restringida debido a un inconveniente
    extremo, ¿un solicitante de 14 a 15 años debe vivir al menos a cuántas millas
    de la escuela y/o el empleo?
  choices:
    A: 2 millas
    B: 5 millas
    C: 10 millas
    D: 15 millas
  answer: B
  explanation: Se puede emitir una licencia restringida a los solicitantes de 14 a
    15 años cuando existe un inconveniente extremo, siempre que vivan a cinco o más
    millas de la escuela y/o el empleo.
- id: 38
  category: license_system
  question: ¿Cuáles son las horas de conducción válidas para una licencia restringida
    emitida por inconveniente extremo?
  choices:
    A: 5 a.m. a 8 p.m.
    B: 6 a.m. a 10 p.m.
    C: 7 a.m. a 7 p.m.
    D: 5 a.m. a 11 p.m.
  answer: A
  explanation: La licencia restringida por inconveniente extremo solo es válida entre
    las 5 a.m. y las 8 p.m. y dentro de un radio de 50 millas de la residencia del
    titular.
- id: 39
  category: license_system
  question: Para obtener una licencia intermedia a los 16 años utilizando un permiso
    de instrucción, ¿cuántas horas de conducción al volante deben ser certificadas
    por un padre o tutor legal?
  choices:
    A: 30 horas, incluyendo 6 horas de conducción nocturna
    B: 40 horas, incluyendo 8 horas de conducción nocturna
    C: 50 horas, incluyendo 10 horas de conducción nocturna
    D: 60 horas, incluyendo 15 horas de conducción nocturna
  answer: C
  explanation: Un solicitante debe haber completado 50 horas de conducción al volante,
    incluyendo 10 horas de conducción nocturna, según lo certificado por un padre
    o tutor legal.
- id: 40
  category: license_system
  question: Los titulares de una licencia intermedia no pueden transportar a más de
    ¿cuántos pasajeros menores de 18 años que no sean miembros de la familia inmediata,
    a menos que estén acompañados por un conductor con licencia de 18 años o más?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Los titulares de licencias intermedias no pueden transportar a más
    de un pasajero menor de 18 años que no sea un miembro de la familia inmediata,
    a menos que también estén acompañados por un conductor con licencia de 18 años
    de edad o más.
- id: 41
  category: license_system
  question: ¿Sin un formulario de excepción aprobado, entre qué horas tiene prohibido
    conducir el titular de una licencia intermedia?
  choices:
    A: 9 p.m. y 5 a.m.
    B: 10 p.m. y 6 a.m.
    C: 11 p.m. y 5 a.m.
    D: Medianoche y 6 a.m.
  answer: C
  explanation: Los titulares de una licencia intermedia no pueden conducir entre las
    11 p.m. y las 5 a.m., a menos que el titular cumpla con los criterios de excepción
    y presente un formulario de excepción completado.
- id: 42
  category: penalties_and_points
  question: ¿Por cuánto tiempo se suspenderá una licencia intermedia por cualquier
    violación de sus disposiciones específicas?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Una licencia intermedia será suspendida por 30 días por cualquier violación
    de estas disposiciones.
- id: 43
  category: license_system
  question: ¿Qué cargo adicional se impone a todas las clases de licencias de conducir
    y pruebas de habilidades de CDL en Wyoming?
  choices:
    A: Un cargo de procesamiento de $2
    B: Un cargo de tecnología de $5
    C: Un cargo administrativo de $10
    D: Un cargo de revisión de registro de $15
  answer: B
  explanation: Se impondrá un cargo de tecnología adicional de $5 a todas las clases
    de licencias de conducir y pruebas de habilidades de CDL.
- id: 44
  category: driver_testing
  question: ¿En qué idioma se administran todos los exámenes escritos de licencia
    de conducir en Wyoming?
  choices:
    A: Inglés y español
    B: Solo en inglés, pero se puede utilizar un intérprete
    C: Cualquier idioma solicitado con 24 horas de antelación
    D: Solo en inglés, y los intérpretes están estrictamente prohibidos
  answer: B
  explanation: Todos los exámenes se administran solo en inglés, por lo que si una
    persona no puede hablar o escribir el idioma inglés, se puede utilizar un intérprete.
- id: 45
  category: license_system
  question: ¿Cuándo vence automáticamente una licencia de conducir intermedia de Wyoming?
  choices:
    A: En el cumpleaños número 18 del titular
    B: 30 días después del cumpleaños número 17 del titular
    C: 6 meses después de su emisión
    D: En el cumpleaños número 21 del titular
  answer: B
  explanation: Según el manual, una licencia intermedia vence automáticamente 30 días
    después del cumpleaños número 17 del titular.
- id: 46
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un criterio requerido para que la División
    de Investigación Criminal (DCI) de Wyoming active una Alerta Amber?
  choices:
    A: El niño secuestrado debe tener 17 años de edad o menos.
    B: El niño debe haber estado desaparecido durante al menos 24 horas.
    C: Se debe conocer la placa del vehículo del sospechoso.
    D: El niño debe tener 12 años de edad o menos.
  answer: A
  explanation: Uno de los criterios que deben cumplirse antes de que la DCI active
    una Alerta Amber es que el niño debe tener 17 años de edad o menos.
- id: 47
  category: safe_driving_rules
  question: Según las estadísticas de Wyoming de 2015-2019, ¿qué porcentaje de las
    muertes por accidentes de tráfico involucró a personas que no llevaban puesto
    el cinturón de seguridad?
  choices:
    A: Exactamente el 25%
    B: Menos del 10%
    C: Más del 50%
    D: Casi el 90%
  answer: C
  explanation: El manual establece que un promedio de 100 personas murieron en las
    carreteras de Wyoming cada año entre 2015 y 2019, y más del 50% de esas víctimas
    no llevaban puesto el cinturón de seguridad.
- id: 48
  category: license_system
  question: ¿Bajo qué condición puede obtener una copia del historial de conducción
    de otra persona en una estación de examen local?
  choices:
    A: Si usted es su empleador
    B: Si presenta una autorización por escrito de la persona cuyo historial se está
      divulgando
    C: Si paga el doble de la tarifa estándar
    D: Si es un agente de seguros con licencia
  answer: B
  explanation: Es posible obtener el historial de conductor de otra persona siempre
    que se presente al examinador una autorización por escrito de la persona cuyo
    historial de conductor se está divulgando.
- id: 49
  category: license_system
  question: ¿La Ley Federal de Protección de la Privacidad del Conductor prohíbe al
    WYDOT proporcionar su información personal para cuál de los siguientes propósitos?
  choices:
    A: Investigaciones policiales
    B: Encuestas, marketing y solicitudes
    C: Divulgación de registros relacionados con accidentes vehiculares
    D: Verificación del estado de la licencia de conducir o del registro
  answer: B
  explanation: La Ley Federal de Protección de la Privacidad del Conductor prohíbe
    al WYDOT proporcionar información personal a individuos y empresas con fines de
    encuestas, marketing y solicitudes.
- id: 50
  category: alcohol_drugs_health
  question: ¿Qué se requiere para que un menor de 18 años se registre como donante
    de órganos y tejidos en su solicitud de licencia de conducir?
  choices:
    A: Una autorización médica de un médico
    B: La firma de un padre o tutor
    C: Un mínimo de 50 horas de experiencia de conducción
    D: Una solicitud por separado enviada por correo al Registro de Donantes
  answer: B
  explanation: Se requiere la firma de un padre o tutor para aprobar una donación
    anatómica para menores de dieciocho (18) años de edad.
- id: 51
  category: vehicle_information
  question: ¿Para que se le otorgue un cartel de discapacidad permanente en Wyoming,
    cuánto tiempo como mínimo debe durar el impedimento físico de una persona?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Los carteles de discapacidad permanente se otorgan a personas que sufren
    impedimentos físicos que deben durar un mínimo de 12 meses.
- id: 52
  category: vehicle_information
  question: ¿Cuál es la duración máxima por la que se puede otorgar un cartel de discapacidad
    temporal?
  choices:
    A: Hasta 3 meses
    B: Hasta 6 meses
    C: Hasta 9 meses
    D: Hasta 12 meses
  answer: B
  explanation: Los carteles temporales pueden otorgarse a personas que sufren un impedimento
    por hasta 6 meses.
- id: 53
  category: vehicle_information
  question: ¿Cuál es la tarifa para que un solicitante obtenga un cartel de discapacidad
    en Wyoming?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: No tiene costo
  answer: D
  explanation: El manual establece explícitamente que los carteles de discapacidad
    están disponibles sin costo para el solicitante.
- id: 54
  category: driver_responsibility
  question: Si decide donar a la Conservación de la Vida Silvestre en su solicitud
    de licencia de conducir, ¿para qué se utilizarán los fondos?
  choices:
    A: Financiar parques estatales y áreas recreativas
    B: Esfuerzos de conservación de la vida silvestre relacionados con el sistema
      de transporte, como cruces de vida silvestre
    C: Pagar los salarios de los guardabosques
    D: Repoblar peces en lagos y ríos locales
  answer: B
  explanation: Los fondos en la cuenta de conservación de la vida silvestre solo se
    utilizarán para proporcionar esfuerzos de conservación de la vida silvestre relacionados
    con el sistema de transporte, incluyendo señalización, corredores de vida silvestre,
    cruces de vida silvestre y cercas para animales.
- id: 55
  category: alcohol_drugs_health
  question: 'Una Suspensión Administrativa Per Se ocurre cuando usted es arrestado
    por conducir bajo la influencia (DWUI) y su prueba química muestra una concentración
    de alcohol de al menos:'
  choices:
    A: 0.02 por ciento
    B: 0.04 por ciento
    C: 0.08 por ciento
    D: 0.15 por ciento
  answer: C
  explanation: Una Suspensión Administrativa Per Se resulta cuando usted ha sido arrestado
    por DWUI y los resultados de su prueba química muestran una concentración de alcohol
    de 0.08 por ciento o superior.
- id: 56
  category: penalties_and_points
  question: ¿Cuál es la duración de una Suspensión Administrativa Per Se por un arresto
    por DWUI?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: La duración de la suspensión para una Suspensión Administrativa Per
    Se es de 90 días.
- id: 57
  category: penalties_and_points
  question: ¿Cuándo comienza oficialmente una Suspensión Administrativa Per Se o descalificación?
  choices:
    A: Inmediatamente en el momento del arresto
    B: 10 días después de la condena judicial
    C: 30 días después de la emisión de la licencia de conducir temporal y el aviso
      de suspensión
    D: 60 días después de que se procesen los resultados de la prueba química
  answer: C
  explanation: El inicio de la suspensión/descalificación es 30 días después de la
    emisión de la licencia de conducir temporal y el aviso de suspensión entregado
    por el oficial en el momento del arresto.
- id: 58
  category: penalties_and_points
  question: 'Para una primera infracción de DWUI, se le requerirá tener una licencia
    de conducir restringida con dispositivo de bloqueo de encendido por 6 meses si
    su concentración de alcohol en sangre (BAC) al momento del arresto fue de:'
  choices:
    A: 0.08% o superior
    B: 0.10% o superior
    C: 0.15% o superior
    D: 0.20% o superior
  answer: C
  explanation: Si su BAC al momento del arresto fue de .15% o superior, se le requerirá
    tener una licencia de conducir restringida con dispositivo de bloqueo de encendido
    por un período de 6 meses antes de ser elegible para cualquier otro tipo de licencia
    de conducir.
- id: 59
  category: penalties_and_points
  question: ¿Cuál es la duración de la suspensión de la licencia de conducir por una
    segunda condena por DWUI dentro de un período de 10 años?
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: De por vida
  answer: C
  explanation: Para una segunda infracción de DWUI (dentro de los 10 años anteriores),
    la duración de la suspensión es de un año.
- id: 60
  category: penalties_and_points
  question: Si es condenado por una cuarta o subsiguiente DWUI que incluya alcohol,
    ¿cuánto tiempo se le requiere tener una licencia de conducir restringida con dispositivo
    de bloqueo de encendido?
  choices:
    A: Dos años
    B: Cinco años
    C: Diez años
    D: De por vida
  answer: D
  explanation: El manual establece que si es condenado por una cuarta o subsiguiente
    DWUI que incluya alcohol, se le requerirá tener una licencia de conducir restringida
    con dispositivo de bloqueo de encendido de por vida (aunque puede solicitar al
    tribunal su eliminación después de 5 años).
- id: 61
  category: alcohol_drugs_health
  question: 'Un conductor menor de 21 años será suspendido por DWUI si tiene el control
    físico real de un vehículo con una concentración de alcohol en sangre (BAC) de
    al menos:'
  choices:
    A: 0.02 por ciento
    B: 0.04 por ciento
    C: 0.08 por ciento
    D: 0.15 por ciento
  answer: A
  explanation: Si usted es menor de 21 años y tiene el control físico real de un vehículo
    con una concentración de alcohol de 0.02 por ciento o más, será suspendido por
    DWUI.
- id: 62
  category: penalties_and_points
  question: ¿Cuál es la duración de la suspensión por una primera infracción de DWUI
    para un conductor joven (Youthful Driver)?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: Seis meses
  answer: C
  explanation: Para una suspensión de conductor joven (menor de 21 años), la duración
    de la suspensión por una primera infracción es de 90 días.
- id: 63
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones resultará en una suspensión por conducción
    temeraria (Reckless Driving)?
  choices:
    A: Conducir sin seguro de responsabilidad civil
    B: Conducir un vehículo con un desprecio deliberado o injustificado por la seguridad
      de las personas o la propiedad
    C: Acumular cuatro infracciones de tránsito en movimiento en un período de 12
      meses
    D: Violar las restricciones de una licencia intermedia
  answer: B
  explanation: Una suspensión por conducción temeraria (Reckless Driving) se produce
    al recibir una condena por conducir un vehículo con un desprecio deliberado o
    injustificado por la seguridad de las personas o la propiedad.
- id: 64
  category: penalties_and_points
  question: ¿Cuál es la duración de la suspensión por una segunda infracción de conducción
    temeraria dentro de los cinco años anteriores?
  choices:
    A: 90 días
    B: Seis meses
    C: Un año
    D: Tres años
  answer: B
  explanation: Para una segunda infracción de conducción temeraria dentro de los cinco
    años anteriores, la duración de la suspensión es de seis meses.
- id: 65
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por una condena por intentar suministrar una bebida
    alcohólica a una persona menor de 21 años mientras opera u ocupa un vehículo motorizado?
  choices:
    A: Una suspensión de 90 días
    B: Una suspensión de seis meses
    C: Una suspensión de un año
    D: Una revocación de tres años
  answer: C
  explanation: La suspensión por transportar licor a un menor (Transporting Liquor
    to a Minor) resulta en una suspensión de un año.
- id: 66
  category: penalties_and_points
  question: 'La suspensión por el Acuerdo de Infractores No Residentes (Non-Resident
    Violator Compact) ocurre cuando un conductor:'
  choices:
    A: No cumple con los términos de una citación de tráfico
    B: Es sorprendido conduciendo sin seguro de responsabilidad civil en otro estado
    C: Acumula demasiados puntos en una licencia de otro estado
    D: Transporta licor a través de las fronteras estatales
  answer: A
  explanation: La suspensión por el Acuerdo de Infractores No Residentes (Non-Resident
    Violator Compact) se produce cuando un tribunal informa al departamento que usted
    no ha cumplido con los términos de una citación de tráfico.
- id: 67
  category: penalties_and_points
  question: ¿Cuántas infracciones de tránsito en movimiento se le permiten dentro
    de un período de 12 meses antes de que se suspenda su privilegio de conducir?
  choices:
    A: Hasta dos
    B: Hasta tres
    C: Hasta cuatro
    D: Hasta cinco
  answer: B
  explanation: Se le permiten hasta tres infracciones de tránsito en movimiento dentro
    de un período de 12 meses. Al recibir la condena por una cuarta infracción de
    movimiento, su privilegio de conducir será suspendido.
- id: 68
  category: penalties_and_points
  question: 'Una suspensión por seguro obligatorio (Compulsory Insurance) permanecerá
    en vigor hasta que el conductor:'
  choices:
    A: Pague una multa de $5,000
    B: Complete una evaluación de alcohol/drogas
    C: Presente un formulario de seguro SR-22 ante el departamento
    D: Apruebe un reexamen de su capacidad de conducción
  answer: C
  explanation: La suspensión por seguro obligatorio (Compulsory Insurance) dura hasta
    que se haya presentado un formulario de seguro SR-22 ante el departamento.
- id: 69
  category: license_system
  question: 'Prestar su licencia de conducir o tarjeta de identificación a otra persona
    para que la use como su identificación puede resultar en:'
  choices:
    A: Una suspensión de 30 días
    B: La cancelación de la tarjeta y/o una suspensión de 90 días
    C: Una suspensión de seis meses
    D: Una revocación de por vida
  answer: B
  explanation: Las acciones de uso ilegal y solicitud falsa (Unlawful Use & False
    Application), como prestar su licencia a otra persona, pueden resultar en la cancelación
    de la tarjeta y/o una suspensión de 90 días.
- id: 70
  category: penalties_and_points
  question: Una suspensión por manutención infantil (Child Support) se activa cuando
    una persona tiene un atraso de $5,000 o más durante ¿cuántos días consecutivos?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Una suspensión por manutención infantil (Child Support) se produce
    tras la notificación de que usted tiene un atraso de $5,000 o más durante 90 días
    consecutivos.
- id: 71
  category: license_system
  question: ¿Cuál es la sanción por una primera condena por infracción de tránsito
    mientras se tiene una licencia restringida de clase RC/RM?
  choices:
    A: Una suspensión de 30 días
    B: Una suspensión de 60 días
    C: Una suspensión de 90 días
    D: Una suspensión de un año
  answer: C
  explanation: Para una suspensión de licencia restringida de clase RC/RM, se impone
    una suspensión de 90 días por la primera infracción.
- id: 72
  category: license_system
  question: 'Violar las restricciones de una licencia intermedia resultará en una
    suspensión de:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: Seis meses
  answer: A
  explanation: La suspensión de la licencia intermedia es el resultado de una violación
    de las restricciones de dicha licencia, y se impone una suspensión de 30 días
    por esta infracción.
- id: 73
  category: penalties_and_points
  question: 'Si es menor de 21 años y es condenado por conducir bajo suspensión, revocación
    o cancelación, sus privilegios de conducir serán suspendidos por:'
  choices:
    A: 30 días
    B: 90 días
    C: Seis meses
    D: Un año
  answer: A
  explanation: Conducir bajo suspensión, revocación o cancelación resulta en una suspensión
    de 30 días de sus privilegios de conducir si es menor de 21 años.
- id: 74
  category: penalties_and_points
  question: ¿Cuánto tiempo dura la suspensión por violar las restricciones de una
    licencia intermedia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: A
  explanation: Según el manual, se impone una suspensión de 30 días por una violación
    de las restricciones de una licencia intermedia.
- id: 75
  category: penalties_and_points
  question: Si su licencia es suspendida debido a un accidente sin seguro, ¿cuál es
    el monto del depósito en efectivo requerido por lesión para ayudar a restablecer
    sus privilegios?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Para restablecer la licencia después de una suspensión por accidente
    sin seguro, una opción es realizar un depósito en efectivo por el monto total
    de los daños a la propiedad, más $25,000 por lesión.
- id: 76
  category: license_system
  question: ¿Cuántas licencias de conducir probatorias se le pueden emitir en un período
    de cinco años?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Ilimitadas
  answer: A
  explanation: El manual establece que solo se le puede emitir una licencia de conducir
    probatoria en un período de cinco años.
- id: 77
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento de la licencia por una suspensión
    por manutención infantil?
  choices:
    A: $5
    B: $25
    C: $50
    D: $100
  answer: A
  explanation: Generalmente, la tarifa de restablecimiento por suspensiones es de
    $50. Sin embargo, la tarifa de restablecimiento por una suspensión por manutención
    infantil es de $5.
- id: 78
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones causará la revocación de su licencia
    de conducir?
  choices:
    A: Primera infracción de conducción temeraria
    B: Abandonar la escena de un accidente con lesiones
    C: Segunda infracción por conducir bajo la influencia (DWUI)
    D: Violar las restricciones de la licencia intermedia
  answer: B
  explanation: Las infracciones que causarán una revocación incluyen abandonar la
    escena de un accidente con lesiones, homicidio por vehículo y una tercera o subsiguiente
    infracción por DWUI o conducción temeraria.
- id: 79
  category: license_system
  question: ¿Durante cuánto tiempo se debe mantener el comprobante de responsabilidad
    financiera (un SR-22) a partir de la fecha en que se requiere?
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cinco años
  answer: C
  explanation: El comprobante de responsabilidad financiera (SR-22) debe mantenerse
    durante tres años a partir de la fecha en que se requiere.
- id: 80
  category: penalties_and_points
  question: ¿Cuándo comienza oficialmente una suspensión o revocación?
  choices:
    A: Inmediatamente después del arresto
    B: 10 días después de la fecha de la infracción
    C: 30 días después de la fecha en que se le envíe por correo o se le entregue
      la orden
    D: 60 días después de su audiencia judicial
  answer: C
  explanation: El inicio de una suspensión/revocación es 30 días después de la fecha
    en que el departamento le envíe la orden por correo o se la entreguen las autoridades
    policiales, o al final de cualquier suspensión que ya figure en su registro.
- id: 81
  category: alcohol_drugs_health
  question: 'Se impone un requisito de seis meses de dispositivo de bloqueo de encendido
    por una primera condena de DWUI si la concentración de alcohol en sangre (BAC)
    del conductor era de al menos:'
  choices:
    A: .08 por ciento
    B: .10 por ciento
    C: .15 por ciento
    D: .20 por ciento
  answer: C
  explanation: Se aplica un requisito de seis meses de dispositivo de bloqueo de encendido
    si se le condena por una primera DWUI y la acción administrativa del departamento
    indica un BAC de .15 por ciento o superior.
- id: 82
  category: alcohol_drugs_health
  question: Si recibe un requisito de dispositivo de bloqueo de encendido de por vida
    por una cuarta o posterior DWUI, ¿después de cuántos años puede solicitar su eliminación?
  choices:
    A: 3 años
    B: 5 años
    C: 7 años
    D: 10 años
  answer: B
  explanation: Para un requisito de dispositivo de bloqueo de encendido de por vida
    (cuarta o posterior DWUI cuando hay alcohol involucrado), puede solicitar la eliminación
    del requisito cinco años después de la fecha de la condena.
- id: 83
  category: safe_driving_rules
  question: ¿Cómo debe usarse correctamente la correa de regazo de un cinturón de
    seguridad?
  choices:
    A: Holgadamente sobre el estómago
    B: Ajustada sobre los huesos de la cadera
    C: Sobre la parte blanda del abdomen
    D: Apretada sobre los muslos
  answer: B
  explanation: La correa de regazo debe colocarse de forma ajustada sobre los huesos
    de la cadera. Nunca debe usarse sobre el estómago o la parte blanda del abdomen.
- id: 84
  category: safe_driving_rules
  question: Según la ley de Wyoming, ¿un niño debe estar debidamente asegurado en
    un sistema de retención infantil hasta que cumpla qué edad?
  choices:
    A: Su sexto cumpleaños
    B: Su séptimo cumpleaños
    C: Su octavo cumpleaños
    D: Su noveno cumpleaños
  answer: D
  explanation: La Guía de Retención Infantil de Wyoming se aplica a niños que no han
    cumplido su noveno cumpleaños.
- id: 85
  category: safe_driving_rules
  question: ¿Cuándo es permisible colocar a un niño en el asiento delantero de un
    vehículo?
  choices:
    A: Cuando el niño prefiere el asiento delantero
    B: Si el vehículo solo tiene una fila de asientos
    C: Cuando el niño está en un asiento para bebés orientado hacia atrás y el airbag
      está activo
    D: Si el conductor es mayor de 21 años
  answer: B
  explanation: Un niño debe estar asegurado en un asiento del vehículo que no sea
    el delantero, excepto en vehículos con una sola fila de asientos, o si todos los
    cinturones de seguridad están siendo utilizados por otros pasajeros infantiles.
- id: 86
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera infracción de la ley de retención
    infantil?
  choices:
    A: $25
    B: $60
    C: $110
    D: $200
  answer: B
  explanation: La sanción por una primera infracción de la ley de retención infantil
    es una multa máxima de $60, la cual puede ser anulada por el tribunal al recibir
    el comprobante de haber adquirido un sistema de retención aprobado.
- id: 87
  category: safe_driving_rules
  question: ¿Cuál de los siguientes vehículos está exento de la ley de retención infantil?
  choices:
    A: Un vehículo de pasajeros no comercial alquilado
    B: Un SUV de propiedad privada
    C: Un vehículo de pasajeros fabricado antes de 1967
    D: Una minivan arrendada (leased)
  answer: C
  explanation: Las exenciones a la ley de retención infantil incluyen vehículos que
    no estaban equipados con cinturones de seguridad en el momento de su fabricación,
    como los vehículos de pasajeros anteriores al año de modelo 1967.
- id: 88
  category: alcohol_drugs_health
  question: 'Un conductor puede solicitar una licencia de conducir restringida 24/7
    en lugar del requisito del dispositivo de bloqueo de encendido si:'
  choices:
    A: Pagan una tarifa adicional de $500
    B: Han recibido una orden del tribunal para participar en el Programa de Sobriedad
      24/7 (24/7 Sobriety Program)
    C: Nunca han tenido una DWUI previa
    D: Presentan una declaración jurada de sobriedad ante notario
  answer: B
  explanation: Un conductor puede solicitar una licencia de conducir restringida 24/7
    si ha recibido una orden del tribunal que le ordena participar en el Programa
    de Sobriedad 24/7 en lugar del requisito del dispositivo de bloqueo de encendido.
- id: 89
  category: safe_driving_rules
  question: Si el asiento de un vehículo tiene reposacabezas, ¿qué tipo de asiento
    elevador (booster) debe usarse y cómo debe ajustarse el reposacabezas?
  choices:
    A: Un elevador de respaldo alto; el reposacabezas en la parte superior de la cabeza
      del niño.
    B: Un asiento elevador de respaldo bajo con posicionamiento de cinturón; el reposacabezas
      a la mitad de la cabeza del niño, detrás de las orejas.
    C: Un elevador de respaldo alto; el reposacabezas retirado por completo.
    D: Un asiento elevador de respaldo bajo con posicionamiento de cinturón; el reposacabezas
      en la base del cuello del niño.
  answer: B
  explanation: 'El manual establece: ''Si hay un reposacabezas disponible, use un
    asiento elevador de respaldo bajo con posicionamiento de cinturón y ajuste el
    reposacabezas a la mitad de la cabeza del niño, detrás de las orejas''.'
- id: 90
  category: safe_driving_rules
  question: Para ajustar correctamente el cinturón de seguridad a un niño, ¿cómo debe
    colocarse la correa de regazo?
  choices:
    A: Alta sobre el estómago
    B: Holgada sobre la cintura
    C: Baja sobre la cadera/parte superior del muslo
    D: Diagonalmente sobre el pecho
  answer: C
  explanation: Para ajustar un cinturón de seguridad, el niño debe mantener la correa
    del hombro ajustada sobre el pecho y la correa de regazo baja sobre la cadera/parte
    superior del muslo.
- id: 91
  category: safe_driving_rules
  question: ¿Cuál de las siguientes personas NO está obligada por ley a usar el cinturón
    de seguridad?
  choices:
    A: Un conductor de entregas de un servicio de mensajería privado
    B: Un trabajador del servicio postal de los EE. UU. que desempeña funciones como
      cartero
    C: Un pasajero en el asiento trasero de un vehículo moderno
    D: Un conductor con una licencia suspendida
  answer: B
  explanation: Las personas que no están obligadas a usar el cinturón de seguridad
    incluyen a cualquier trabajador del servicio postal de los EE. UU. que desempeñe
    funciones como cartero.
- id: 92
  category: license_system
  question: ¿Cuál de los siguientes estados NO es actualmente miembro del Pacto de
    Licencias de Conducir (Driver License Compact)?
  choices:
    A: Wyoming
    B: Texas
    C: California
    D: Georgia
  answer: D
  explanation: El manual señala que todos los estados, excepto Georgia, Massachusetts,
    Michigan, Tennessee y Wisconsin, son actualmente miembros del Pacto de Licencias
    de Conducir (Driver License Compact).
- id: 93
  category: alcohol_drugs_health
  question: Conducir bajo la influencia del alcohol es la causa principal de casi
    ¿qué proporción de los choques en los que alguien muere?
  choices:
    A: Un cuarto
    B: Un tercio
    C: La mitad
    D: Tres cuartos
  answer: C
  explanation: Conducir bajo la influencia del alcohol es la causa principal de CASI
    LA MITAD de los choques en los que alguien muere.
- id: 94
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes NO es uno de los tres factores principales que
    influyen en la concentración de alcohol en sangre (BAC) de una persona?
  choices:
    A: La cantidad de alcohol consumida
    B: El peso corporal de la persona
    C: El tipo de alcohol consumido (por ejemplo, cerveza frente a vino)
    D: El período de tiempo durante el cual se consumió el alcohol
  answer: C
  explanation: 'Los tres factores que influyen en el BAC de una persona son: la cantidad
    de alcohol consumida, el período de tiempo durante el cual se consumió y el peso
    corporal de la persona.'
- id: 95
  category: alcohol_drugs_health
  question: 'Según el manual, 12 onzas de cerveza contienen aproximadamente la misma
    cantidad de alcohol que:'
  choices:
    A: 1 onza de vino
    B: 3 a 5 onzas de vino
    C: 8 onzas de vino
    D: 12 onzas de vino
  answer: B
  explanation: 12 onzas de cerveza, de tres a cinco onzas de vino y una onza y media
    de licor fuerte de 86 grados (86 proof) tienen cada uno aproximadamente media
    onza de alcohol.
- id: 96
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo se tarda en absorber totalmente el alcohol contenido en
    una sola bebida?
  choices:
    A: 10 a 15 minutos
    B: 30 a 40 minutos
    C: 1 hora
    D: 2 horas
  answer: B
  explanation: Los efectos aumentarán con el paso del tiempo, ya que se tarda de 30
    a 40 minutos en absorber totalmente el alcohol contenido en una sola bebida.
- id: 97
  category: alcohol_drugs_health
  question: ¿Cuál es el ÚNICO factor significativo para reducir los niveles de BAC?
  choices:
    A: Beber café
    B: Comer una comida pesada
    C: Hacer ejercicio
    D: El tiempo
  answer: D
  explanation: EL TIEMPO ES EL ÚNICO FACTOR SIGNIFICATIVO PARA REDUCIR LOS NIVELES
    DE BAC. Ducharse, beber café o hacer ejercicio en un esfuerzo por recuperar la
    sobriedad son inútiles.
- id: 98
  category: alcohol_drugs_health
  question: 'Aproximadamente el 90 por ciento del alcohol en su cuerpo es eliminado
    por:'
  choices:
    A: Los riñones
    B: El estómago
    C: El hígado
    D: Los pulmones
  answer: C
  explanation: Aproximadamente el 90 por ciento del alcohol en su cuerpo es eliminado
    por el hígado a una tasa constante de aproximadamente una bebida por hora.
- id: 99
  category: alcohol_drugs_health
  question: Si una persona pesada y una persona delgada beben la misma cantidad de
    alcohol, ¿cómo se compararán probablemente sus niveles de BAC?
  choices:
    A: La persona pesada probablemente tendrá un BAC más bajo.
    B: La persona delgada probablemente tendrá un BAC más bajo.
    C: Ambos tendrán exactamente el mismo BAC.
    D: El BAC de la persona pesada fluctuará más rápidamente.
  answer: A
  explanation: Las personas más pesadas tienen más sangre y fluidos corporales que
    diluyen más el alcohol. Por lo tanto, si una persona pesada y una persona delgada
    beben la misma cantidad, la persona pesada probablemente tendrá un BAC más bajo.
- id: 100
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol la capacidad de un conductor bajo los efectos
    del alcohol para "IDENTIFICAR" peligros?
  choices:
    A: Mejora su visión periférica.
    B: Hace que fijen su visión en un objeto en particular y pierdan la detección
      lateral.
    C: Mejora su capacidad para juzgar distancias.
    D: Hace que escaneen constantemente su entorno.
  answer: B
  explanation: Los conductores bajo los efectos del alcohol tienden a fijar su visión
    en un objeto en particular y no ver otros. La capacidad de detectar personas y
    vehículos a los lados se pierde casi por completo.
- id: 101
  category: alcohol_drugs_health
  question: Debido a una menor capacidad para ejecutar decisiones, ¿cuántos pies adicionales
    conducirá un conductor que ha bebido y viaja a 55 mph antes de que pueda aplicar
    los frenos?
  choices:
    A: 10 pies
    B: 20 pies
    C: 32 pies
    D: 55 pies
  answer: C
  explanation: Debido a esta menor capacidad de ejecución, un conductor que ha bebido,
    viajando a 55 mph, conducirá 32 pies adicionales o más antes de que pueda aplicar
    los frenos.
- id: 102
  category: alcohol_drugs_health
  question: Según el manual, ¿qué estado mental combinado con el alcohol se ha determinado
    que es una de las combinaciones más peligrosas?
  choices:
    A: Euforia
    B: Ansiedad
    C: Fatiga
    D: Ira
  answer: D
  explanation: De hecho, se ha descubierto que la ira y el alcohol son una de las
    combinaciones más peligrosas. El alcohol hace que sea mucho más difícil para las
    personas controlarse a sí mismas.
- id: 103
  category: safe_driving_rules
  question: Si el asiento del vehículo no tiene reposacabezas, ¿qué tipo de asiento
    elevador (booster seat) debe usarse para proporcionar protección para la cabeza
    de un niño?
  choices:
    A: Un asiento elevador de respaldo bajo con posicionador de cinturón
    B: Un asiento elevador de respaldo alto con posicionador de cinturón
    C: Un asiento elevador solo para cinturón de regazo
    D: Un asiento para bebés orientado hacia atrás
  answer: B
  explanation: Si el asiento del vehículo no tiene reposacabezas, use un asiento elevador
    de respaldo alto con posicionador de cinturón para proporcionar protección para
    la cabeza.
- id: 104
  category: alcohol_drugs_health
  question: Bajo la ley de Consentimiento Implícito (Implied Consent) de Wyoming,
    ¿a qué se considera que los conductores han dado su consentimiento?
  choices:
    A: Un registro de su vehículo sin causa probable.
    B: Pruebas químicas para determinar su concentración de alcohol en sangre (BAC).
    C: Una suspensión obligatoria de la licencia por 90 días.
    D: Responder a todas las preguntas de las fuerzas del orden sin un abogado.
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito, se considera que los conductores
    han dado su consentimiento para realizar pruebas químicas para determinar su BAC
    siempre que conduzcan en una calle o carretera pública.
- id: 105
  category: penalties_and_points
  question: ¿Si se somete a una prueba química y su BAC es de 0.08 por ciento o más,
    por cuánto tiempo se suspenderán su licencia de conducir y sus privilegios de
    conducción?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Si se somete a la prueba o pruebas requeridas y su BAC es de 0.08 por
    ciento o más, su licencia de conducir y sus privilegios de conducción se suspenderán
    por 90 días.
- id: 106
  category: alcohol_drugs_health
  question: ¿Puede ser condenado por conducir bajo la influencia (DWUI) con un BAC
    de 0.05 por ciento?
  choices:
    A: No, el límite legal es estrictamente 0.08 por ciento.
    B: Sí, pero solo si es menor de 21 años.
    C: Sí, con otras pruebas de respaldo.
    D: No, a menos que se niegue a una prueba química.
  answer: C
  explanation: Si bien un BAC de 0.08 por ciento o más puede resultar en una condena,
    también puede ser condenado por DWUI con un BAC de 0.05 por ciento y otras pruebas
    de respaldo.
- id: 107
  category: alcohol_drugs_health
  question: ¿Cómo afectan al conductor las pastillas para adelgazar y las pastillas
    para 'mantenerse despierto'?
  choices:
    A: Mejoran la capacidad del conductor para identificar objetos críticos.
    B: Dan una falsa sensación de alerta y a menudo aumentan la toma de riesgos.
    C: Curan permanentemente la fatiga del conductor.
    D: Ralentizan el tiempo de reacción del conductor y causan somnolencia inmediata.
  answer: B
  explanation: Las pastillas para adelgazar y para 'mantenerse despierto' dan a los
    conductores una falsa sensación de alerta y a menudo aumentan la confianza en
    sí mismos, lo que puede llevar a una toma de riesgos excesiva.
- id: 108
  category: safe_driving_rules
  question: Si un oficial de la ley le ordena detenerse, ¿cuál de los siguientes es
    un lugar donde NO debe detener su vehículo?
  choices:
    A: En el lado derecho de la calzada.
    B: En un lugar seguro fuera de la carretera.
    C: En un puente.
    D: En un estacionamiento cercano.
  answer: C
  explanation: Cuando vea las luces rojas y azules y/o escuche la sirena, mantenga
    la calma, reduzca la velocidad y deténgase a la derecha de la calzada en un lugar
    seguro. No se detenga en el carril de circulación, en puentes o contra guardarraíles.
- id: 109
  category: driver_responsibility
  question: ¿Qué debe hacer con sus manos cuando lo detiene un oficial de policía?
  choices:
    A: Mantenerlas en sus bolsillos.
    B: Mantenerlas en el volante para que el oficial pueda verlas.
    C: Meter la mano en la guantera para preparar su registro.
    D: Sacudirlas por la ventana para hacer señas al oficial.
  answer: B
  explanation: Durante una parada de tráfico, debe mantener las manos en el volante
    para que el oficial pueda verlas.
- id: 110
  category: driver_responsibility
  question: Si tiene un arma en su vehículo durante una parada de tráfico, ¿cómo debe
    informárselo al oficial de policía?
  choices:
    A: Señalar la ubicación del arma.
    B: Intentar alcanzar el arma para mostrarle al oficial que es segura.
    C: Informar al oficial sobre el arma y su ubicación sin intentar alcanzarla ni
      señalarla.
    D: Esperar hasta que el oficial registre el vehículo para mencionarlo.
  answer: C
  explanation: Informe al oficial sobre cualquier arma en su vehículo y su ubicación.
    No intente alcanzar ni señalar la ubicación.
- id: 111
  category: sharing_the_road
  question: ¿Qué le exige la ley de Wyoming que haga si se aproxima a un vehículo
    de emergencia con sus luces activadas a un costado de una carretera de dos carriles?
  choices:
    A: Detenerse inmediatamente y esperar a que el vehículo se retire.
    B: Reducir su velocidad al menos 20 mph.
    C: Mantener su velocidad pero tocar la bocina.
    D: Incorporarse al carril más alejado del vehículo.
  answer: B
  explanation: Si se encuentra con un vehículo de emergencia o de mantenimiento con
    sus luces activadas a un costado de la carretera, la ley de Wyoming le exige reducir
    su velocidad al menos 20 mph en una carretera de dos carriles.
- id: 112
  category: sharing_the_road
  question: ¿Qué debe hacer si un vehículo de emergencia con sus luces activadas lo
    está alcanzando para rebasarlo?
  choices:
    A: Acelerar para mantenerse por delante del vehículo de emergencia.
    B: Detenerse en su carril actual de inmediato.
    C: Hacerse a un lado hacia la derecha de la carretera y detenerse hasta que pase.
    D: Moverse al carril izquierdo y reducir la velocidad.
  answer: C
  explanation: Si un vehículo de emergencia con sus luces activadas lo está alcanzando,
    la ley de Wyoming le exige hacerse a un lado hacia la derecha de la carretera
    y detenerse hasta que el vehículo de emergencia haya pasado.
- id: 113
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad legal
    en una zona residencial en Wyoming?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: El límite de velocidad legal en zonas residenciales es de 30 mph, a
    menos que se indique lo contrario mediante señales.
- id: 114
  category: safe_driving_rules
  question: ¿A qué velocidad máxima debe aproximarse a una intersección 'ciega' donde
    su vista está bloqueada por árboles o edificios?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Los árboles, arbustos o edificios en las intersecciones pueden bloquear
    la vista de los vehículos que vienen por los lados. Por lo tanto, aproxímese a
    una intersección 'ciega' a no más de 15 mph.
- id: 115
  category: defensive_driving
  question: ¿Cuánto debe reducir su velocidad al conducir en una carretera cubierta
    de nieve compactada?
  choices:
    A: Al menos entre 5 y 10 mph.
    B: Al menos a la mitad.
    C: Reducir la velocidad al mínimo posible.
    D: Mantener el límite de velocidad indicado.
  answer: B
  explanation: Al conducir sobre nieve compactada, debe reducir su velocidad al menos
    a la mitad.
- id: 116
  category: defensive_driving
  question: ¿Por qué es peligroso conducir a más de 55 mph en una carretera oscura?
  choices:
    A: Sus neumáticos pierden tracción por la noche.
    B: Está 'conduciendo a ciegas' porque no puede detenerse dentro de los 250 pies
      iluminados por sus faros.
    C: Los límites de velocidad se reducen automáticamente a 45 mph por la noche.
    D: Los vehículos que vienen en sentido contrario quedarán cegados por sus faros.
  answer: B
  explanation: Sus luces solo le permitirán ver con claridad a unos 250 pies. Si conduce
    a más de 55 mph en una carretera oscura, realmente está 'conduciendo a ciegas'
    porque no podrá detenerse dentro de los 250 pies delante de usted que están lo
    suficientemente iluminados para ver.
- id: 117
  category: sharing_the_road
  question: ¿Cómo deben tratar los conductores a los ciclistas en una vía pública?
  choices:
    A: Como peatones que deben ceder el paso a los vehículos motorizados.
    B: Como peligros que deben rebasarse lo más rápido posible.
    C: Como tráfico de movimiento lento con el mismo derecho legal de estar en la
      vía.
    D: Como vehículos que solo están permitidos en las aceras.
  answer: C
  explanation: Los ciclistas tienen el mismo derecho legal de estar en una vía pública
    que usted. Todas las bicicletas deben identificarse como tráfico de movimiento
    lento y su velocidad y conducción deben ajustarse para acomodarse a ellos.
- id: 118
  category: safe_driving_rules
  question: ¿Cuándo es el momento adecuado para ajustar su velocidad ante una curva
    en el camino?
  choices:
    A: Antes de entrar en la curva.
    B: Mientras se encuentra en el vértice de la curva.
    C: Al salir de la curva.
    D: Siempre que sienta que los neumáticos pierden su agarre.
  answer: A
  explanation: Ajuste la velocidad ANTES de entrar en una curva. Ir demasiado rápido
    puede romper el agarre que los neumáticos tienen sobre la carretera.
- id: 119
  category: defensive_driving
  question: ¿Qué debe hacer si la lluvia intensa, la nieve o la niebla espesa limitan
    su visibilidad a menos de 100 pies de distancia?
  choices:
    A: Encender las luces altas y mantener su velocidad.
    B: Reducir la velocidad a 20 mph y usar las luces de emergencia.
    C: Salir de la carretera y esperar hasta que se despeje.
    D: Seguir de cerca las luces traseras del vehículo que va delante.
  answer: C
  explanation: El manual establece que cuando no puede ver a más de 100 pies de distancia
    debido a una lluvia intensa, tormenta de nieve o niebla espesa, no puede conducir
    de manera segura a ninguna velocidad y debe salir de la carretera y esperar hasta
    que se despeje.
- id: 120
  category: sharing_the_road
  question: ¿Cómo se clasifican los ciclistas según las leyes de derecho de paso?
  choices:
    A: Como peatones con privilegios especiales.
    B: Como peligros que siempre deben ceder el paso a los vehículos motorizados.
    C: Como vehículos con los mismos derechos y responsabilidades que los vehículos
      motorizados.
    D: Como tráfico de movimiento lento que debe permanecer en la acera.
  answer: C
  explanation: El manual señala que es importante recordar que los ciclistas se clasifican
    como vehículos y se les otorgan los mismos derechos y responsabilidades que tienen
    los operadores de vehículos motorizados.
- id: 121
  category: safe_driving_rules
  question: ¿A quién debe ceder el paso en una intersección que no tiene señales ni
    semáforos?
  choices:
    A: A cualquier conductor que venga por su izquierda.
    B: A cualquier conductor que venga por su derecha.
    C: Al conductor que llegue último a la intersección.
    D: Al vehículo más grande en la intersección.
  answer: B
  explanation: Cuando no hay señales ni semáforos, debe estar atento a cualquier conductor
    que venga por su derecha y cederle el paso, independientemente de quién llegue
    y entre primero a la intersección.
- id: 122
  category: defensive_driving
  question: ¿Dónde es más probable encontrar cambios repentinos en las condiciones
    de la superficie de la carretera, como el hielo negro (black ice)?
  choices:
    A: En los carriles centrales de una autopista de varios carriles.
    B: En plataformas de puentes, pasos elevados y cerca de barreras contra la nieve.
    C: Solo en vecindarios residenciales.
    D: En carreteras de asfalto recién pavimentadas.
  answer: B
  explanation: El hielo negro es invisible y traicionero. El manual advierte que los
    cambios repentinos a condiciones extremadamente heladas ocurren a menudo en plataformas
    de puentes, pasos elevados, en rellenos altos, en cortes profundos y cerca de
    barreras contra la nieve.
- id: 123
  category: safe_driving_rules
  question: ¿Cómo puede determinar si está siguiendo a otro vehículo demasiado de
    cerca en condiciones invernales?
  choices:
    A: Asegurándose de que puede leer claramente su placa de matrícula.
    B: Manteniéndose exactamente a una distancia de dos vehículos detrás de ellos.
    C: Contando 'mil uno', 'mil dos', 'mil tres' y 'mil cuatro' después de que el
      vehículo de adelante pase un punto de referencia.
    D: Verificando si sus faros iluminan el parachoques trasero del otro vehículo.
  answer: C
  explanation: Para verificar su distancia de seguimiento, deje que el vehículo de
    adelante pase un punto de referencia y luego cuente desde 'mil uno' hasta 'mil
    cuatro'. Si su vehículo llega al mismo punto de referencia antes de terminar de
    contar, está siguiendo demasiado de cerca.
- id: 124
  category: vehicle_information
  question: ¿Cuál es la técnica de frenado recomendada si su vehículo tiene frenos
    convencionales (sin ABS) en una carretera resbaladiza?
  choices:
    A: Pisar los frenos con la mayor fuerza posible.
    B: Bombear los frenos una vez cada segundo.
    C: Tocar ligeramente los frenos de forma continua.
    D: Aplicar una presión constante y fuerte sin soltar.
  answer: B
  explanation: Con los frenos convencionales, las ruedas bloqueadas y los derrapes
    suelen ocurrir cuando los conductores los pisan bruscamente. Bombear esos frenos
    una vez cada segundo es una buena regla general.
- id: 125
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a derrapar en una carretera resbaladiza?
  choices:
    A: Pisar los frenos a fondo y girar el volante en línea recta.
    B: Acelerar ligeramente y girar en dirección opuesta al derrape.
    C: Girar suavemente hacia la dirección del derrape y levantar el pie del acelerador.
    D: Poner el vehículo en punto muerto (neutral) y bombear los frenos rápidamente.
  answer: C
  explanation: Si comienza a derrapar, el manual aconseja girar suavemente hacia la
    dirección del derrape y levantar el pie del acelerador hasta que recupere el control.
- id: 126
  category: penalties_and_points
  question: ¿Qué sucede si entra en una intersección con parada de cuatro vías (four-way
    stop) mientras infringe la ley de velocidad?
  choices:
    A: Debe ceder el paso solo a los vehículos que giran a la izquierda.
    B: Pierde cualquier derecho de paso que pudiera haber tenido.
    C: Tiene automáticamente el derecho de paso.
    D: Debe tocar la bocina para advertir a otros conductores.
  answer: B
  explanation: El manual establece que si entra en una intersección mientras infringe
    la ley de velocidad, pierde cualquier derecho de paso que pudiera haber tenido.
- id: 127
  category: safe_driving_rules
  question: ¿En qué dirección se mueve el tráfico dentro de una rotonda?
  choices:
    A: En el sentido de las agujas del reloj.
    B: En sentido contrario a las agujas del reloj.
    C: En un patrón de figura en ocho.
    D: Directo por el centro.
  answer: B
  explanation: El tráfico en una rotonda se mueve a velocidades lentas en sentido
    contrario a las agujas del reloj.
- id: 128
  category: sharing_the_road
  question: ¿Qué debe hacer si se aproxima un vehículo de emergencia con luces intermitentes
    mientras conduce dentro de una rotonda?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda.
    B: Orillarse hacia la isla interior de la rotonda.
    C: Continuar hasta su salida, salir de la rotonda y luego orillarse a la derecha.
    D: Acelerar para salir de la rotonda antes de que entre el vehículo de emergencia.
  answer: C
  explanation: Si ya se encuentra en una rotonda cuando se aproxima un vehículo de
    emergencia, continúe hasta su salida, salga de la rotonda y luego oríllese a la
    derecha para que el vehículo de emergencia pueda pasar.
- id: 129
  category: safe_driving_rules
  question: Al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una carretera con un solo carril en cada dirección, ¿qué debe hacer?
  choices:
    A: Detenerse y esperar a que el vehículo de emergencia apague sus luces.
    B: Reducir su velocidad al menos 20 mph por debajo del límite de velocidad.
    C: Mantener su velocidad pero moverse hacia el borde derecho extremo del carril.
    D: Tocar la bocina para alertar a los trabajadores de emergencia de su presencia.
  answer: B
  explanation: En carreteras con un solo carril en cada dirección, debe reducir su
    velocidad al menos 20 mph por debajo del límite de velocidad al acercarse a un
    vehículo de emergencia estacionado.
- id: 130
  category: sharing_the_road
  question: ¿Bajo cuál de las siguientes circunstancias debe un conductor ceder el
    paso a un peatón?
  choices:
    A: Solo cuando el peatón se encuentra en una zona escolar designada.
    B: Cuando un peatón ciego lleva un bastón blanco claramente visible o utiliza
      un perro guía.
    C: Solo cuando el peatón está cruzando en una intersección con luz verde.
    D: Cuando el peatón está cruzando imprudentemente fuera de un paso de peatones.
  answer: B
  explanation: Los estatutos exigen que un conductor ceda el paso a un peatón cuando
    un peatón ciego lleva un bastón blanco claramente visible o está acompañado por
    un perro guía.
- id: 131
  category: driver_responsibility
  question: ¿Aproximadamente cuánto tiempo le toma a un conductor mover el pie del
    acelerador al freno después de decidir detenerse?
  choices:
    A: 1/4 de segundo.
    B: 1/2 segundo.
    C: 3/4 de segundo.
    D: 1 segundo completo.
  answer: C
  explanation: Según la sección del manual sobre frenado y detención, toma aproximadamente
    3/4 de segundo mover el pie del acelerador al freno.
- id: 132
  category: defensive_driving
  question: Si pierde la orientación mientras conduce en una ventisca a ras de suelo
    (ground blizzard), ¿cuál es una forma recomendada de determinar su posición en
    la carretera?
  choices:
    A: Encender las luces altas para ver a través de la nieve que sopla.
    B: Detener su vehículo inmediatamente y salir a pie para revisar.
    C: Bajar la ventanilla y mirar hacia el lado de sotavento (a favor del viento)
      del automóvil para ver la franja central o el borde de la carretera.
    D: Seguir de cerca el mapa del GPS en su teléfono.
  answer: C
  explanation: Si pierde la orientación en una ventisca a ras de suelo, el manual
    aconseja bajar la ventanilla y mirar hacia el lado de sotavento del automóvil
    para determinar dónde se encuentra en la carretera, utilizando la franja central
    o el borde de la carretera.
- id: 133
  category: safe_driving_rules
  question: A 55 mph, ¿aproximadamente cuánto tiempo le toma detenerse a un vehículo
    pesado con un remolque cargado?
  choices:
    A: Unos 130-140 pies
    B: Unos 190-200 pies
    C: Unos 400 pies
    D: Unos 100 pies
  answer: B
  explanation: Según el manual, un vehículo pesado con un remolque cargado que viaja
    a 55 mph generalmente tardará más de dos tercios de la longitud de un campo de
    fútbol americano (unos 190-200 pies) en detenerse.
- id: 134
  category: sharing_the_road
  question: Al acercarse a un autobús escolar detenido con luces rojas intermitentes
    en una carretera dividida, ¿qué vehículos deben detenerse?
  choices:
    A: Los vehículos que viajan en ambas direcciones
    B: Solo los vehículos que viajan en el mismo lado de la separación que el autobús
    C: Solo los vehículos que viajan en la dirección opuesta al autobús
    D: No se requiere que ningún vehículo se detenga en una carretera dividida
  answer: B
  explanation: El manual establece que en una carretera dividida, solo los vehículos
    que están en el mismo lado de la separación que el autobús escolar deben detenerse.
- id: 135
  category: safe_driving_rules
  question: ¿Dónde se establece explícitamente que no se debe cambiar de carril?
  choices:
    A: En una carretera de varios carriles
    B: Antes o mientras se está en una intersección
    C: Al rebasar un vehículo pesado
    D: En un distrito comercial
  answer: B
  explanation: 'Las reglas adecuadas para cambiar de carril en el manual establecen
    explícitamente: ''No cambie de carril antes o mientras esté en una intersección''.'
- id: 136
  category: signs_and_signals
  question: Como mínimo, ¿con cuánta anticipación antes de una intersección debe señalizar
    su intención de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Todos los conductores deben señalizar al menos 100 pies antes de una
    intersección. A velocidades más altas, es mejor señalizar de 4 a 5 segundos antes
    de girar.
- id: 137
  category: signs_and_signals
  question: ¿Cuál es la señal manual y del brazo correcta para un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia la izquierda
    B: Brazo izquierdo extendido hacia abajo desde el codo
    C: Brazo izquierdo extendido hacia arriba desde el codo
    D: Brazo derecho extendido recto hacia la derecha
  answer: C
  explanation: Las señales deben hacerse con el brazo izquierdo. Para un giro a la
    derecha, la mano y el brazo se extienden hacia arriba desde el codo.
- id: 138
  category: defensive_driving
  question: ¿Cuál es el procedimiento recomendado antes de dar marcha atrás con su
    vehículo?
  choices:
    A: Confiar únicamente en sus espejos retrovisores y laterales
    B: Tocar la bocina tres veces antes de poner la marcha atrás
    C: Revisar detrás de su vehículo caminando por detrás de él
    D: Acelerar rápidamente para minimizar el tiempo que pasa dando marcha atrás
  answer: C
  explanation: El manual aconseja 'revisar detrás de su vehículo caminando por detrás
    de él antes de dar marcha atrás' y no depender de los espejos.
- id: 139
  category: safe_driving_rules
  question: ¿Bajo qué condición puede un conductor exceder legalmente el límite de
    velocidad hasta en 10 millas por hora?
  choices:
    A: Al conducir en una carretera interestatal
    B: Al rebasar a otro vehículo que viaja a menos de la velocidad máxima legal
    C: Al rebasar un camión comercial pesado
    D: Al conducir cuesta abajo en una zona montañosa
  answer: B
  explanation: Un conductor puede exceder el límite de velocidad hasta en 10 millas
    por hora al rebasar a otro vehículo que viaja a menos de la velocidad máxima legal.
- id: 140
  category: safe_driving_rules
  question: ¿Cuándo está permitido rebasar a otro vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante conduce por debajo del límite de velocidad en
      una carretera de dos carriles
    B: Cuando deba conducir fuera de la parte pavimentada de la carretera para hacerlo
    C: Cuando el vehículo al que está rebasando está haciendo un giro a la izquierda
    D: Cuando se encuentra en una zona escolar
  answer: C
  explanation: Puede rebasar por la derecha cuando el vehículo al que está adelantando
    está haciendo un giro a la izquierda, siempre que no se salga del pavimento para
    hacerlo.
- id: 141
  category: sharing_the_road
  question: ¿Qué espacio de separación debe mantener entre su vehículo y un ciclista
    al rebasarlo?
  choices:
    A: Al menos 1 pie
    B: Al menos 2 pies
    C: Al menos 3 pies
    D: Al menos 5 pies
  answer: C
  explanation: Al rebasar a un ciclista, el manual establece que, cuando el espacio
    lo permita, debe mantener al menos 3 pies de separación entre su vehículo y el
    ciclista.
- id: 142
  category: sharing_the_road
  question: Al rebasar un camión grande, ¿cuándo es seguro volver a su carril original?
  choices:
    A: Tan pronto como pase el parachoques delantero del camión
    B: Cuando pueda ver ambos faros delanteros y toda la cabina del camión en su espejo
      retrovisor
    C: Después de haber mantenido su velocidad durante al menos 5 segundos
    D: Cuando el conductor del camión parpadee sus luces altas
  answer: B
  explanation: Debido a que toma más tiempo rebasar a un vehículo grande, debe asegurarse
    de poder ver ambos faros delanteros y toda la cabina del camión en su espejo retrovisor
    antes de volver a su carril.
- id: 143
  category: signs_and_signals
  question: ¿Cuál de los siguientes tiene prioridad sobre los semáforos o las señales
    en una intersección?
  choices:
    A: Una luz amarilla intermitente
    B: Un peatón esperando en la acera
    C: Las indicaciones de un oficial de policía
    D: Una señal de ceder el paso
  answer: C
  explanation: Siempre debe detener su vehículo cuando se lo indique un oficial de
    policía. Las indicaciones de un oficial de policía tienen prioridad sobre los
    semáforos o las señales de tránsito.
- id: 144
  category: sharing_the_road
  question: ¿Cuál es una idea errónea común, pero peligrosa, que tienen los automovilistas
    sobre el campo de visión del conductor de un camión?
  choices:
    A: Tienen grandes puntos ciegos directamente detrás de ellos
    B: No pueden ver los vehículos de pasajeros que circulan justo al lado de sus
      puertas
    C: Debido a que se sientan más alto, pueden verlo todo y reaccionar antes sin
      puntos ciegos
    D: No pueden ver los vehículos que los siguen demasiado cerca
  answer: C
  explanation: Muchos automovilistas creen falsamente que, debido a que el conductor
    de un camión se sienta al doble de altura, puede ver más lejos y reaccionar antes,
    ignorando el hecho de que los vehículos pesados tienen puntos ciegos considerables
    (Zonas No o "No-Zones").
- id: 145
  category: defensive_driving
  question: ¿Cuál de las siguientes es una pista de que un automóvil estacionado podría
    salir frente a usted?
  choices:
    A: Las ruedas delanteras del vehículo están rectas
    B: Sale humo de escape por el tubo de escape
    C: Los faros del vehículo están apagados
    D: El vehículo tiene un parasol en el parabrisas
  answer: B
  explanation: Al conducir cerca de autos estacionados, esté atento a pistas como
    humo de escape saliendo del tubo de escape, luces de freno encendidas, una luz
    de giro parpadeando, luces blancas de reversa encendidas o las ruedas delanteras
    girando hacia afuera.
- id: 146
  category: safe_driving_rules
  question: ¿Qué debe hacer al entrar a una calle desde una entrada privada, un callejón
    o un estacionamiento?
  choices:
    A: Ceder el paso solo a los vehículos que se aproximan por la izquierda
    B: Detener su vehículo antes de entrar a la calle
    C: Tocar la bocina y avanzar sin detenerse
    D: Acelerar rápidamente para incorporarse al tráfico
  answer: B
  explanation: SIEMPRE debe detener su vehículo al entrar a una calle desde una entrada
    privada, callejón, edificio o estacionamiento.
- id: 147
  category: sharing_the_road
  question: ¿Qué es un 'apretón de giro a la derecha' (right-turn squeeze)?
  choices:
    A: Cuando un vehículo de pasajeros intenta rebasar a un camión por la izquierda.
    B: Cuando un vehículo de pasajeros se encuentra en el punto ciego del lado derecho
      de un vehículo pesado que está girando a la derecha.
    C: Cuando dos camiones intentan girar a la derecha al mismo tiempo.
    D: Cuando un vehículo se estaciona demasiado cerca de un cruce de peatones en
      una intersección.
  answer: B
  explanation: Según el manual, un 'apretón de giro a la derecha' ocurre cuando el
    conductor de un vehículo de pasajeros se encuentra en el punto ciego ubicado en
    el lado derecho de un vehículo pesado que está en proceso de girar a la derecha.
- id: 148
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios es ilegal estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: El manual establece que no es legal estacionarse a menos de 15 pies
    de un hidrante de incendios.
- id: 149
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante cuando se estaciona cuesta arriba
    donde hay un bordillo o acera?
  choices:
    A: Hacia el bordillo
    B: Lejos del bordillo
    C: Hacia adelante en línea recta
    D: Hacia la línea central
  answer: B
  explanation: Si se estaciona cuesta arriba donde hay un bordillo, debe poner el
    freno de mano y girar las ruedas en dirección opuesta al bordillo.
- id: 150
  category: defensive_driving
  question: ¿Cuál es el propósito principal de un carril de aceleración en una rampa
    de entrada a la Interestatal?
  choices:
    A: Permitirle rebasar vehículos más lentos antes de incorporarse.
    B: Proporcionar un lugar seguro para estacionar en una emergencia.
    C: Permitirle igualar su velocidad con la del tráfico de la Interestatal.
    D: Obligar al tráfico de la Interestatal a cederle el paso a su vehículo que entra.
  answer: C
  explanation: La rampa de entrada generalmente lo lleva a un carril de aceleración.
    Su propósito es permitirle igualar su velocidad con la del tráfico de la Interestatal.
- id: 151
  category: safe_driving_rules
  question: ¿En condiciones normales, cuál es el margen de espacio mínimo que debe
    dejar entre usted y el vehículo de adelante en la autopista interestatal?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: B
  explanation: El manual aconseja dejar siempre un margen de espacio de al menos dos
    segundos entre usted y el vehículo que va delante. Este espacio debe duplicarse
    o triplicarse cuando el clima es malo o el pavimento está resbaladizo.
- id: 152
  category: defensive_driving
  question: ¿Qué debe hacer si se pasa de su salida en la autopista interestatal?
  choices:
    A: Detenerse y retroceder con cuidado por el arcén derecho.
    B: Dar una vuelta en U a través de la mediana.
    C: Detenerse en el carril derecho y esperar un hueco en el tráfico para retroceder.
    D: Continuar hasta la siguiente salida.
  answer: D
  explanation: Si se pasa de su salida, continúe hasta la siguiente salida. Retroceder
    en la autopista interestatal es peligroso.
- id: 153
  category: safe_driving_rules
  question: Al salir de la autopista interestatal, ¿dónde debe comenzar a reducir
    la velocidad?
  choices:
    A: Una milla antes de la salida mientras aún está en la autopista.
    B: Solo después de entrar en el carril de desaceleración.
    C: Tan pronto como vea la señal de salida.
    D: Justo antes de incorporarse al carril derecho.
  answer: B
  explanation: Al salir de la autopista interestatal, NUNCA debe reducir la velocidad
    en la autopista. Debe REDUCIR LA VELOCIDAD después de entrar en el carril de desaceleración.
- id: 154
  category: defensive_driving
  question: Si tiene una avería de emergencia en la autopista interestatal por la
    noche, ¿qué debe hacer para advertir a los demás conductores?
  choices:
    A: Pararse en el carril de tráfico y agitar los brazos.
    B: Encender las luces de advertencia de emergencia (luces intermitentes) y usar
      bengalas o reflectores.
    C: Mantener todas las luces apagadas para ahorrar la batería del vehículo.
    D: Abrir las puertas del lado del tráfico de su vehículo.
  answer: B
  explanation: En caso de una avería de emergencia, encienda las luces de advertencia
    de emergencia. Por la noche, use bengalas o reflectores. No abra las puertas del
    lado del tráfico.
- id: 155
  category: signs_and_signals
  question: ¿Qué significa cuando se utiliza la palabra 'ONLY' (SOLO) en una señal
    de carril elevada con una flecha?
  choices:
    A: Puede ir en la dirección de la flecha o seguir recto.
    B: Debe ir en la dirección que indica la flecha; no hay otra opción.
    C: Solo los vehículos de alta ocupación pueden usar ese carril.
    D: El carril está reservado solo para vehículos de emergencia.
  answer: B
  explanation: Las señales de carril elevadas le indican la dirección en la que debe
    ir. Cuando se utiliza la palabra 'ONLY', debe ir en la dirección que indica la
    flecha; no hay otra opción.
- id: 156
  category: safe_driving_rules
  question: En una carretera de varios carriles con tres o más carriles en una misma
    dirección, ¿qué carril suele tener el flujo de tráfico más fluido?
  choices:
    A: El carril del extremo izquierdo
    B: El carril del extremo derecho
    C: El carril o carriles centrales
    D: El carril del arcén
  answer: C
  explanation: Cuando hay tres o más carriles en una misma dirección, el carril o
    carriles centrales suelen ser los más fluidos.
- id: 157
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas continuas en el pavimento?
  choices:
    A: El tráfico fluye en direcciones opuestas y se permite rebasar.
    B: El tráfico fluye en la misma dirección y rebasar o cambiar de carril es peligroso.
    C: El tráfico fluye en direcciones opuestas y rebasar es peligroso.
    D: El tráfico fluye en la misma dirección y se permite rebasar libremente.
  answer: B
  explanation: Las líneas blancas separan el tráfico que va en la misma dirección.
    Las líneas blancas continuas indican que rebasar o cambiar de carril es peligroso.
- id: 158
  category: signs_and_signals
  question: ¿Qué tipo de señal se considera que es una señal de cruce de ferrocarril
    (crossbuck)?
  choices:
    A: Una señal de alto
    B: Una señal de advertencia
    C: Una señal de ceda el paso
    D: Una señal reglamentaria de velocidad
  answer: C
  explanation: 'El manual establece explícitamente: ''Las señales de cruce de ferrocarril
    son señales de ceda el paso. Usted está legalmente obligado a ceder el paso a
    los trenes''.'
- id: 159
  category: defensive_driving
  question: Según el manual, ¿cuál es el tipo de choque más frecuente en la autopista
    interestatal?
  choices:
    A: Colisiones frontales
    B: Raspados laterales
    C: Colisiones por alcance (traseras)
    D: Volcamientos
  answer: C
  explanation: El manual establece que las colisiones por alcance son el tipo de choque
    más frecuente en la autopista interestatal, enfatizando la necesidad de mantener
    un margen de espacio adecuado.
- id: 160
  category: safe_driving_rules
  question: Al salir de un espacio de estacionamiento, ¿cuál es el primer paso que
    debe dar?
  choices:
    A: Ceder el paso a los vehículos que se aproximan.
    B: Salir rápidamente al tráfico para evitar bloquear el carril.
    C: Señalizar antes de empezar a moverse.
    D: Verificar si viene alguien, especialmente ciclistas o motociclistas.
  answer: D
  explanation: Para salir de un espacio de estacionamiento, el primer paso indicado
    es 'VERIFICAR si viene alguien. Esté especialmente atento a los ciclistas o motociclistas'.
- id: 161
  category: signs_and_signals
  question: ¿Cómo puede saber si hay más de un conjunto de vías en un cruce de ferrocarril?
  choices:
    A: Una señal debajo de la señal de cruce (crossbuck) indica el número de vías.
    B: La barrera del cruce estará pintada de amarillo.
    C: Habrá dos líneas de parada pintadas en la carretera.
    D: Las luces rojas intermitentes parpadearán el doble de rápido.
  answer: A
  explanation: Según el manual, al cruzar más de un conjunto de vías, habrá una señal
    debajo de la señal de cruce (crossbuck) que indica cuántas hay.
- id: 162
  category: driver_responsibility
  question: ¿Bajo qué circunstancias está legalmente obligado a contactar a la policía
    después de un accidente de tráfico?
  choices:
    A: Solo si alguien fallece.
    B: Si hay un herido, muerte o daños a la propiedad por un monto de $1,000 o más.
    C: Solo si el accidente involucra a un vehículo comercial.
    D: Si los daños a la propiedad son de $500 o más.
  answer: B
  explanation: Debe contactar a la policía si hay un herido, muerte o daños a la propiedad
    por un monto de $1,000 o más.
- id: 163
  category: driver_responsibility
  question: Si se ve involucrado en un accidente y alguien resulta herido, ¿cuándo
    es aceptable mover a la persona herida?
  choices:
    A: Inmediatamente, para llevarla al costado de la carretera.
    B: Solo si le piden que los mueva.
    C: Solo si hay peligro de otro accidente.
    D: Nunca debe mover a una persona herida bajo ninguna circunstancia.
  answer: C
  explanation: 'El manual establece: NO MUEVA A UNA PERSONA HERIDA a menos que haya
    peligro de otro accidente.'
- id: 164
  category: driver_responsibility
  question: ¿Qué debe hacer después de dejar la información requerida en un vehículo
    desatendido que ha dañado?
  choices:
    A: Esperar junto al vehículo hasta que regrese el dueño.
    B: Contactar a la agencia de aplicación de la ley más cercana.
    C: Llamar a su compañía de seguros y abandonar la escena.
    D: Tomar una fotografía del daño y marcharse.
  answer: B
  explanation: Si daña un vehículo desatendido y deja su información, el manual establece
    que también debe contactar a la agencia de aplicación de la ley más cercana.
- id: 165
  category: vehicle_information
  question: ¿Dónde puede encontrar la presión de neumáticos recomendada (psi) para
    su vehículo?
  choices:
    A: En el flanco del propio neumático.
    B: En el manual del propietario del vehículo o en el marco de la puerta del lado
      del conductor.
    C: En la placa de matrícula trasera del vehículo.
    D: En la columna del volante.
  answer: B
  explanation: Debe verificar la presión de los neumáticos utilizando los psi recomendados
    que se encuentran en el manual del propietario del vehículo o en el marco de la
    puerta del lado del conductor del vehículo.
- id: 166
  category: vehicle_information
  question: Al usar la prueba de la moneda de un centavo (penny test) para verificar
    el desgaste de los neumáticos, ¿cómo sabe si tiene una cantidad segura de banda
    de rodadura?
  choices:
    A: Toda la moneda cabe dentro de la ranura.
    B: Puede ver la parte superior del Monumento a Lincoln.
    C: Cualquier parte de la cabeza de Lincoln está cubierta por la banda de rodadura.
    D: La cabeza de Lincoln es completamente visible por encima de la banda de rodadura.
  answer: C
  explanation: Al colocar la cabeza de Lincoln en una de las ranuras, si alguna parte
    de la cabeza de Lincoln queda cubierta por la banda de rodadura, está conduciendo
    con la cantidad segura de banda de rodadura.
- id: 167
  category: sharing_the_road
  question: ¿Qué maniobra de los conductores causa un gran porcentaje de accidentes
    entre automóviles y motocicletas?
  choices:
    A: Seguir a una motocicleta demasiado de cerca.
    B: Girar a la derecha con luz roja.
    C: Girar a la izquierda frente a un motociclista que se aproxima.
    D: Adelantar a una motocicleta en la carretera.
  answer: C
  explanation: Los conductores que giran a la izquierda frente a un ciclista que se
    aproxima causan un gran porcentaje de accidentes entre automóviles y motocicletas
    porque no ven al ciclista o no juzgan correctamente su velocidad.
- id: 168
  category: sharing_the_road
  question: ¿Cuál es el número máximo de motocicletas que pueden circular legalmente
    una al lado de la otra (en paralelo) en el mismo carril?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: No se pueden conducir más de dos motocicletas una al lado de la otra
    en el mismo carril y debe ser con el consentimiento de ambos conductores de motocicletas.
- id: 169
  category: sharing_the_road
  question: Si su vehículo está averiado y debe caminar por una carretera que no tiene
    aceras, ¿por dónde debe caminar?
  choices:
    A: En el lado derecho de la carretera con el flujo del tráfico.
    B: En el centro de la carretera donde sea más visible.
    C: En el lado izquierdo de la carretera de frente al tráfico.
    D: En el lado que tenga el arcén (hombro) más ancho.
  answer: C
  explanation: Si su vehículo está averiado y debe caminar donde no hay aceras, camine
    por el lado izquierdo de la carretera de frente al tráfico.
- id: 170
  category: sharing_the_road
  question: ¿Qué equipo se requiere legalmente en una bicicleta que se use después
    de anochecer?
  choices:
    A: Una luz delantera y reflectores traseros.
    B: Una bocina y un espejo retrovisor.
    C: Señales de giro y luces de freno.
    D: Un chaleco de seguridad reflectante usado por el ciclista.
  answer: A
  explanation: Cualquier bicicleta que se use después de anochecer debe tener una
    luz delantera y reflectores traseros.
- id: 171
  category: signs_and_signals
  question: ¿Qué indica el símbolo de vehículo de movimiento lento en la parte trasera
    de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo realiza paradas frecuentes.
    C: El vehículo no puede viajar a más de 25 millas por hora.
    D: El vehículo es una carga de gran tamaño.
  answer: C
  explanation: Cuando vea el símbolo de vehículo de movimiento lento en la parte trasera
    de un vehículo que va delante, significa que el vehículo no puede viajar a más
    de 25 millas por hora.
- id: 172
  category: sharing_the_road
  question: Según las estadísticas, ¿quién causa la mayoría de los choques fatales
    que involucran a un vehículo pesado (camión) y un vehículo de pasajeros?
  choices:
    A: El conductor del vehículo pesado.
    B: El vehículo de pasajeros.
    C: Las malas condiciones de la carretera.
    D: Fallas mecánicas en el vehículo pesado.
  answer: B
  explanation: Las estadísticas de la Administración Nacional de Seguridad del Tráfico
    en las Carreteras (NHTSA) indican que la mayoría de los choques fatales que involucran
    a un vehículo pesado y uno o más vehículos adicionales son causados por el vehículo
    de pasajeros.
- id: 173
  category: safe_driving_rules
  question: Bajo la Ley de Ceder el Paso (Move Over Law), ¿qué debe hacer al acercarse
    a un vehículo de emergencia detenido con luces intermitentes en una carretera
    interestatal?
  choices:
    A: Detenerse inmediatamente en su carril hasta que el vehículo se retire.
    B: Incorporarse al carril más alejado del vehículo o al menos a un carril de distancia.
    C: Tocar la bocina para alertar a los trabajadores de emergencia de su presencia.
    D: Acelerar para rebasar al vehículo de emergencia lo más rápido posible.
  answer: B
  explanation: Al conducir en una carretera interestatal... el conductor debe incorporarse
    al carril más alejado del vehículo o al menos a un (1) carril de tráfico de distancia
    del vehículo, excepto cuando un oficial de policía indique lo contrario.
- id: 174
  category: safe_driving_rules
  question: ¿Cómo debe reaccionar bajo la Ley de Ceder el Paso (Move Over Law) al
    acercarse a un vehículo de servicios públicos detenido con luces intermitentes
    en una carretera de dos carriles con un límite de velocidad indicado de 55 mph?
  choices:
    A: Mantener su velocidad pero moverse al borde derecho de su carril.
    B: Reducir la velocidad a 20 mph.
    C: Reducir la velocidad a 35 mph.
    D: Detenerse y esperar a que el vehículo de servicios públicos apague sus luces.
  answer: C
  explanation: En una carretera de dos carriles con un límite de velocidad indicado
    de 45 mph o más, el conductor debe reducir la velocidad a una velocidad que sea
    20 mph menor que el límite de velocidad indicado. (55 mph - 20 mph = 35 mph).
- id: 175
  category: sharing_the_road
  question: ¿Por qué nunca debe moverse al mismo carril al lado de una motocicleta?
  choices:
    A: Es ilegal y los encierra a ambos.
    B: El escape de la motocicleta puede dañar la pintura de su vehículo.
    C: Los motociclistas deben circular por el centro del carril en todo momento.
    D: Hace que las luces direccionales de la motocicleta funcionen mal.
  answer: A
  explanation: Nunca se mueva al mismo carril al lado de una motocicleta... No solo
    es ilegal, sino que los encierra a ambos y no le permite una vía de salida.
- id: 176
  category: safe_driving_rules
  question: Al acercarse a un vehículo de emergencia en una carretera de dos carriles
    con un límite de velocidad indicado de 45 mph o más, ¿qué debe hacer si no puede
    cambiar de carril?
  choices:
    A: Detenerse inmediatamente hasta que el vehículo se retire.
    B: Reducir la velocidad a una velocidad que sea 20 mph menor que el límite de
      velocidad indicado.
    C: Mantener su velocidad pero moverse al borde del extremo derecho de la carretera.
    D: Reducir la velocidad a 15 mph independientemente del límite de velocidad indicado.
  answer: B
  explanation: El manual establece que al conducir en una carretera de dos carriles
    con un límite de velocidad indicado de 45 mph o más, el conductor debe reducir
    la velocidad a una velocidad que sea 20 mph menor que el límite de velocidad indicado
    al acercarse a un vehículo de emergencia.
- id: 177
  category: defensive_driving
  question: ¿Durante qué estaciones son más frecuentes las colisiones entre vehículos
    y animales en Wyoming?
  choices:
    A: Verano e invierno
    B: Primavera y verano
    C: Otoño y primavera
    D: Invierno y otoño
  answer: C
  explanation: Aunque los choques pueden ocurrir en cualquier momento, el manual señala
    que son más frecuentes durante el otoño y la primavera, mientras los animales
    migran entre sus hábitats de verano e invierno.
- id: 178
  category: defensive_driving
  question: ¿Por qué debe tener cuidado al encender y apagar sus faros (hacer cambio
    de luces) cuando ve un animal en la carretera más adelante?
  choices:
    A: Hará que el animal embista su vehículo.
    B: Puede cegar temporalmente a los conductores que vienen en sentido contrario.
    C: Puede causar que el animal se "congele" en la carretera directamente adelante.
    D: Es ilegal hacer cambio de luces a la fauna silvestre.
  answer: C
  explanation: El manual aconseja tener cuidado al hacer cambio de luces con los faros
    porque un efecto no deseado puede ser "congelar" al ciervo u otro animal en la
    carretera directamente adelante.
- id: 179
  category: safe_driving_rules
  question: ¿Qué debe hacer si una colisión con un animal parece inevitable?
  choices:
    A: Virar bruscamente hacia la izquierda.
    B: Virar bruscamente hacia la derecha.
    C: Acelerar para minimizar el tiempo de impacto.
    D: No virar bruscamente, sino frenar tan rápido como pueda hacerlo de forma segura.
  answer: D
  explanation: Si una colisión parece inevitable, el manual establece que no debe
    virar bruscamente para evitar al animal, ya que su riesgo de lesiones personales
    puede ser mayor. En su lugar, frene tan rápido como pueda de manera segura mientras
    mantiene su vehículo bajo control.
- id: 180
  category: defensive_driving
  question: En el método IPDE de conducción defensiva, ¿qué hace un conductor durante
    el paso de "Predecir" (Predict)?
  choices:
    A: Predecir lo peor que podría pasar con respecto a un objeto crítico.
    B: Predecir la velocidad exacta del tráfico que viene en sentido contrario.
    C: Predecir cuánto tiempo tomará llegar a su destino.
    D: Predecir las condiciones climáticas para la próxima hora.
  answer: A
  explanation: Según el método IPDE, cuando los conductores defensivos identifican
    un objeto crítico, predicen lo que podría suceder, específicamente prediciendo
    lo peor.
- id: 181
  category: defensive_driving
  question: ¿Según el método IPDE, en qué deben basarse sus decisiones al conducir?
  choices:
    A: Determinar quién tiene el derecho de paso legal.
    B: Demostrar qué conductor tiene la razón o se equivoca.
    C: Qué se puede hacer para prevenir un choque.
    D: Llegar a su destino lo más rápido posible.
  answer: C
  explanation: El manual establece que las decisiones se basan en lo que se puede
    hacer para prevenir un choque, y no en quién tiene la razón o quién se equivoca.
- id: 182
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe un conductor defensivo observar el camino?
  choices:
    A: De 2 a 3 segundos
    B: De 5 a 8 segundos
    C: De 10 a 15 segundos
    D: De 20 a 30 segundos
  answer: C
  explanation: El manual establece que los conductores defensivos observan al menos
    con 10 a 15 segundos de anticipación.
- id: 183
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe dar señales manuales o eléctricas antes
    de girar?
  choices:
    A: Al menos uno o dos segundos
    B: Al menos cuatro o cinco segundos
    C: Al menos diez segundos
    D: Solo cuando otros vehículos sean visibles
  answer: B
  explanation: Para comunicarse con otros conductores, debe dar señales manuales o
    eléctricas al menos cuatro o cinco segundos antes de girar.
- id: 184
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima que debe mantener al conducir
    un automóvil estándar en condiciones normales?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: B
  explanation: El manual establece que si conduce un automóvil, debe mantenerse al
    menos a dos segundos de distancia del vehículo que va delante.
- id: 185
  category: safe_driving_rules
  question: ¿Cuánto debe aumentar su distancia de seguimiento al conducir un automóvil
    en carreteras cubiertas de hielo?
  choices:
    A: Duplicarla a cuatro segundos
    B: Triplicarla a seis segundos
    C: Cuadruplicarla a ocho segundos
    D: Mantenerla en dos segundos pero conducir más lento
  answer: C
  explanation: El manual aconseja cuadruplicar el número de segundos cuando el hielo
    cubre la carretera, lo que significa una distancia de seguimiento de ocho segundos
    para los automóviles.
- id: 186
  category: vehicle_information
  question: En condiciones normales, ¿cuál es la distancia de seguimiento mínima para
    el conductor de un camión con remolque (tractor-trailer)?
  choices:
    A: Dos segundos
    B: Cuatro segundos
    C: Six segundos
    D: Ocho segundos
  answer: C
  explanation: El manual establece que los conductores de autobuses deben mantenerse
    al menos a cuatro segundos de distancia y los conductores de camiones con remolque
    al menos a seis segundos.
- id: 187
  category: defensive_driving
  question: ¿Cuál es una acción recomendada a tomar si otro conductor lo sigue demasiado
    cerca (tailgating)?
  choices:
    A: Pisar los frenos rápidamente para asustarlos.
    B: Aumentar la distancia de seguimiento entre usted y el vehículo que tiene delante.
    C: Acelerar para crear más espacio detrás de usted.
    D: Moverse al carril izquierdo en una autopista de varios carriles.
  answer: B
  explanation: Si alguien lo sigue demasiado cerca, debe proporcionar más tiempo y
    espacio adelante para reaccionar ante emergencias aumentando la distancia de seguimiento
    entre usted y el vehículo que tiene delante.
- id: 188
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una forma recomendada de mantener un margen
    de espacio a los lados de su vehículo?
  choices:
    A: Conducir junto a otros vehículos en calles de varios carriles para igualar
      su velocidad.
    B: Permanecer en los puntos ciegos de otros conductores para que no cambien de
      carril.
    C: Evitar conducir junto a un ciclista durante períodos prolongados de tiempo.
    D: Conducir lo más cerca posible de los vehículos estacionados para dejar espacio
      al tráfico que viene en sentido contrario.
  answer: C
  explanation: Para mantener un margen de espacio a sus lados, el manual recomienda
    evitar conducir junto a un ciclista durante períodos prolongados de tiempo.
- id: 189
  category: defensive_driving
  question: ¿En qué consiste la técnica de conducción defensiva de "separar riesgos"?
  choices:
    A: Tomar múltiples riesgos simultáneamente para superarlos rápidamente.
    B: Tomar los riesgos uno a la vez ajustando su velocidad para manejar los peligros
      por separado.
    C: Salirse completamente de la carretera cuando vea múltiples peligros.
    D: Tocar la bocina hasta que todos los peligros se quiten de su camino.
  answer: B
  explanation: Separar riesgos significa tomar los riesgos uno a la vez siempre que
    sea posible, como tomar la decisión de acelerar o reducir la velocidad para pasar
    los peligros (como corredores y un camión que viene en sentido contrario) uno
    a la vez.
- id: 190
  category: defensive_driving
  question: ¿Qué debe hacer para advertir a otros conductores cuando vea un animal
    en la calzada o cerca de ella?
  choices:
    A: Encender y apagar las luces altas repetidamente.
    B: Encender las luces de emergencia y detenerse en el carril.
    C: Reducir su velocidad y pisar suavemente los frenos.
    D: Desviarse hacia el carril contrario para bloquear el tráfico.
  answer: C
  explanation: Cuando vea un animal en la calzada o cerca de ella, el manual le indica
    que reduzca su velocidad, pise suavemente los frenos para advertir a otros conductores
    y toque la bocina.
- id: 191
  category: defensive_driving
  question: ¿Qué debe hacer cuando no puede separar los riesgos y debe lidiar con
    dos o más al mismo tiempo?
  choices:
    A: Acelerar para pasar ambos riesgos rápidamente.
    B: Llegar a un compromiso dando el mayor espacio al peligro más grave.
    C: Detener su vehículo inmediatamente en su carril.
    D: Tocar la bocina y mantener su posición en el carril.
  answer: B
  explanation: Cuando no pueda separar los riesgos y deba lidiar con dos o más al
    mismo tiempo, llegue a un compromiso dando el mayor espacio al peligro más grave.
- id: 192
  category: safe_driving_rules
  question: Según el manual, ¿cuándo debe usar sus faros delanteros?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes del amanecer.
    B: Solo cuando conduzca por carreteras rurales por la noche.
    C: Desde media hora después de la puesta del sol hasta media hora antes del amanecer.
    D: Siempre que conduzca a más de 55 mph.
  answer: C
  explanation: Los faros delanteros deben usarse desde media hora después de la puesta
    del sol hasta media hora antes del amanecer y en cualquier otro momento en que
    la visibilidad sea inferior a 1,000 pies.
- id: 193
  category: safe_driving_rules
  question: Al acercarse a un vehículo que viene en sentido contrario por la noche,
    ¿a qué distancia debe bajar sus faros delanteros?
  choices:
    A: Al menos 200 pies
    B: Al menos 300 pies
    C: Al menos 400 pies
    D: Al menos 500 pies
  answer: D
  explanation: Debe bajar sus faros delanteros al menos 500 pies (aproximadamente
    de cuatro a cinco segundos) antes de encontrarse con un vehículo que viene en
    sentido contrario.
- id: 194
  category: safe_driving_rules
  question: Cuando sigue a otro vehículo por la noche, ¿a qué distancia de la parte
    trasera del vehículo debe bajar sus luces a la posición más baja (luces cortas)?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Si se encuentra a menos de 300 pies de la parte trasera de un vehículo
    al que se aproxima, baje sus luces a la posición más baja.
- id: 195
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de luces de estacionamiento mientras se conduce?
  choices:
    A: Deben usarse al anochecer antes de que se necesiten los faros delanteros.
    B: Se recomiendan al conducir en niebla densa.
    C: No es legal conducir solo con las luces de estacionamiento cuando se requieren
      los faros delanteros.
    D: Deben usarse cuando se sigue de cerca a otro vehículo por la noche.
  answer: C
  explanation: Nunca use las luces de estacionamiento mientras conduce. No es legal
    conducir solo con las luces de estacionamiento cuando se requieren los faros delanteros.
- id: 196
  category: safe_driving_rules
  question: ¿Qué tipo de faros delanteros debe usar al conducir con niebla?
  choices:
    A: Faros de luz alta
    B: Faros de luz baja
    C: Solo luces de estacionamiento
    D: Solo luces intermitentes de emergencia
  answer: B
  explanation: Al conducir con niebla, debe usar los faros de luz baja.
- id: 197
  category: defensive_driving
  question: ¿Por qué debe tener especial cuidado durante la primera media hora después
    de que comienza a llover?
  choices:
    A: El hidroplaneo (hydroplaning) ocurrirá garantizadamente a cualquier velocidad.
    B: El polvo y el aceite se mezclan con el agua y hacen que la calzada sea resbaladiza.
    C: Los limpiaparabrisas mancharán el vidrio más de lo habitual.
    D: Es más probable que otros conductores usen sus luces altas.
  answer: B
  explanation: Tenga cuidado durante la primera media hora después de que comience
    a llover porque el polvo y el aceite se mezclan con el agua y hacen que la calzada
    sea resbaladiza.
- id: 198
  category: safe_driving_rules
  question: ¿Cuál de la distancia de seguimiento recomendada para los automóviles
    que conducen sobre hielo?
  choices:
    A: Dos segundos
    B: Cuatro segundos
    C: Seis segundos
    D: Ocho segundos
  answer: D
  explanation: Debe cuadruplicar la distancia sobre hielo, lo que significa una distancia
    de seguimiento de ocho segundos para los automóviles.
- id: 199
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones NO debe realizar al conducir sobre nieve
    o hielo?
  choices:
    A: Usar el control de crucero (cruise control).
    B: Equipar su automóvil con neumáticos para nieve o cadenas.
    C: Estar atento al hielo en los puentes y en las zonas sombreadas.
    D: Frenar de forma gradual y suave antes de detenerse.
  answer: A
  explanation: 'Al conducir sobre nieve o hielo, el manual establece explícitamente:
    NO use el control de crucero (cruise control).'
- id: 200
  category: safe_driving_rules
  question: Si queda varado en una zanja durante una tormenta de nieve, ¿qué debe
    hacer para mantenerse a salvo?
  choices:
    A: Salir de su automóvil inmediatamente para buscar ayuda.
    B: Mantener todas las ventanas bien cerradas para atrapar el calor.
    C: Mantener el motor encendido continuamente para mantenerse caliente.
    D: Encender el motor y la calefacción con moderación con una ventana abierta para
      ventilación.
  answer: D
  explanation: Si queda varado en una tormenta de nieve, encienda el motor y la calefacción
    con moderación, y solo con una ventana abierta para ventilación para evitar el
    envenenamiento por monóxido de carbono.
- id: 201
  category: defensive_driving
  question: ¿Si una colisión es inevitable y debe desviarse para evitar chocar de
    frente con un vehículo, cuál es la regla general?
  choices:
    A: Girar a la izquierda
    B: Girar a la derecha
    C: Bloquear los frenos
    D: Acelerar lo más rápido posible
  answer: B
  explanation: Si no es posible evitar una colisión, asegúrese de no chocar de frente
    con el otro vehículo. La regla general es girar a la derecha.
- id: 202
  category: vehicle_information
  question: ¿Qué debe hacer si el pedal del acelerador se queda trabado mientras conduce?
  choices:
    A: Apagar el motor inmediatamente antes de hacer cualquier otra cosa.
    B: Cambiar a punto muerto (neutral) o presionar el embrague (clutch).
    C: Aplicar el freno de mano con toda su fuerza.
    D: Bombear el pedal del acelerador rápidamente.
  answer: B
  explanation: Si el pedal del acelerador se traba, intente liberarlo con el pie.
    Si esto no funciona, presione el embrague o cambie a punto muerto (neutral).
- id: 203
  category: defensive_driving
  question: ¿Cuál es una regla importante que debe recordar si su vehículo comienza
    a derrapar?
  choices:
    A: Frenar bruscamente de inmediato.
    B: Girar el volante bruscamente en la dirección opuesta al derrape.
    C: No aplicar los frenos.
    D: Acelerar para recuperar la tracción.
  answer: C
  explanation: Lo principal que debe recordar en un derrape es mantener la calma y
    no reaccionar de forma exagerada. Debe dejar de hacer lo que sea que haya iniciado
    el derrape y ¡NO APLIQUE LOS FRENOS!
- id: 204
  category: vehicle_information
  question: ¿Cómo debe frenar en una situación de emergencia si su vehículo está equipado
    con frenos antibloqueo (ABS)?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Presionar el pedal del freno con fuerza y mantenerlo presionado.
    C: Tocar ligeramente el pedal del freno para evitar un derrape.
    D: Aplicar el freno de mano en lugar del freno de pedal.
  answer: B
  explanation: En una situación de emergencia, el sistema ABS bombea los frenos por
    el conductor. Todo lo que los conductores deben hacer es presionar el pedal del
    freno con fuerza, mantenerlo presionado y maniobrar para salir del peligro.
- id: 205
  category: vehicle_information
  question: ¿Qué debe hacer si necesita frenar en una emergencia y su vehículo está
    equipado con un sistema de frenos ABS?
  choices:
    A: Bombear los frenos rápidamente para evitar derrapes.
    B: Presionar el pedal del freno con fuerza, mantenerlo presionado y maniobrar
      para salir del peligro.
    C: Quitar la presión constante del pedal del freno para activar el sistema.
    D: Aplicar el freno de mano inmediatamente.
  answer: B
  explanation: Para vehículos con ABS, todo lo que los conductores deben hacer es
    presionar el pedal del freno con fuerza, mantenerlo presionado y maniobrar para
    salir del peligro. Bombear los frenos desactivará o apagará el sistema ABS.
- id: 206
  category: safe_driving_rules
  question: Si los frenos de su vehículo fallan mientras conduce, ¿cuál de las siguientes
    es una acción recomendada?
  choices:
    A: Cambiar a una marcha más alta para ganar impulso.
    B: Girar la llave de encendido a la posición de bloqueo.
    C: Bombear el pedal del freno rápidamente.
    D: Conducir el automóvil al taller más cercano para repararlo.
  answer: C
  explanation: Si los frenos fallan, debe bombear el pedal del freno rápidamente,
    usar el freno de mano, cambiar a una marcha más baja y buscar un lugar para reducir
    la velocidad y detenerse fuera de la calzada. No debe intentar conducir el automóvil
    hasta un taller.
- id: 207
  category: defensive_driving
  question: ¿Cuál es la respuesta correcta si experimenta el reventón de un neumático
    mientras conduce?
  choices:
    A: Frenar fuerte de inmediato.
    B: Retirar el pie del acelerador gradualmente pero no frenar.
    C: Girar el volante bruscamente hacia la derecha.
    D: Acelerar ligeramente para mantener el control del vehículo.
  answer: B
  explanation: Si se le revienta un neumático, debe sujetar el volante con firmeza,
    mantener el automóvil recto y retirar el pie del acelerador gradualmente, pero
    no frene hasta que el automóvil esté bajo control.
- id: 208
  category: defensive_driving
  question: Si un vehículo en sentido contrario aparece de repente en su carril de
    circulación y hay peligro inmediato de colisión, ¿qué debe hacer?
  choices:
    A: Maniobrar fuera de la carretera hacia la izquierda.
    B: Maniobrar fuera de la carretera hacia la derecha.
    C: Detenerse inmediatamente en su carril.
    D: Acelerar para pasar el vehículo rápidamente.
  answer: B
  explanation: Si un vehículo que viene en sentido contrario o que está detenido aparece
    de repente en su carril de circulación y hay peligro inmediato de colisión, MANIOBRE
    FUERA DE LA CARRETERA HACIA LA DERECHA.
- id: 209
  category: vehicle_information
  question: ¿Por qué nunca debe girar la llave de encendido a la posición de bloqueo
    mientras el vehículo está en movimiento?
  choices:
    A: Agotará la batería del vehículo.
    B: Hará que el volante se bloquee y resultará en la pérdida del control.
    C: Dañará permanentemente la transmisión.
    D: Activará el sistema de frenos antibloqueo.
  answer: B
  explanation: Nunca gire la llave de encendido a la posición de bloqueo mientras
    el vehículo esté en movimiento. Eso hará que la dirección se bloquee y, muy posiblemente,
    que se pierda el control del vehículo.
- id: 210
  category: defensive_driving
  question: Si su vehículo se sale de la carretera, ¿cuál es la forma adecuada de
    regresar al pavimento?
  choices:
    A: Frenar fuerte y girar el volante bruscamente de inmediato.
    B: Acelerar para volver a la carretera rápidamente.
    C: Permanecer en el arcén (shoulder), reducir la velocidad gradualmente, verificar
      el tráfico y girar bruscamente hacia el pavimento.
    D: Girar el volante gradualmente hacia el pavimento mientras mantiene la velocidad.
  answer: C
  explanation: Si se sale de la carretera, debe permanecer en el arcén, dejar de acelerar,
    frenar suavemente, verificar el tráfico y luego girar bruscamente hacia el pavimento.
- id: 211
  category: safe_driving_rules
  question: ¿Cómo debe probar y secar sus frenos después de conducir a través de agua
    profunda?
  choices:
    A: Frene suavemente varias veces hasta que estén secos y funcionen correctamente.
    B: Conduzca a alta velocidad para secar las pastillas de freno con el aire.
    C: Bombee los frenos rápidamente durante al menos dos minutos.
    D: Aplique el freno de estacionamiento mientras acelera.
  answer: A
  explanation: Siempre debe probar sus frenos después de conducir a través de agua
    profunda. Frene suavemente varias veces hasta que sus frenos estén secos y funcionen
    correctamente.
- id: 212
  category: safe_driving_rules
  question: Si su vehículo se avería en la autopista interestatal (Interstate), ¿cuál
    de las siguientes acciones NO debe realizar?
  choices:
    A: Encender las luces de emergencia (intermitentes).
    B: Atar un paño blanco a la antena o a la manija de la puerta.
    C: Salir por el lado del vehículo alejado del tráfico.
    D: Caminar por la interestatal para buscar ayuda.
  answer: D
  explanation: Si su vehículo se avería, debe encender las luces de emergencia, salir
    por el lado alejado del tráfico, atar un paño blanco a la antena y NO caminar
    en busca de ayuda si se encuentra en la interestatal.
- id: 213
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un signo de intoxicación por monóxido de carbono?
  choices:
    A: Zumbido en los oídos
    B: Hambre repentina
    C: Ritmo cardíaco acelerado
    D: Visión borrosa
  answer: A
  explanation: Los signos de intoxicación por monóxido de carbono son cansancio, bostezos,
    mareos, náuseas, dolor de cabeza y zumbido en los oídos.
- id: 214
  category: safe_driving_rules
  question: ¿Cuándo es seguro adelantar a otro vehículo en un cruce de carretera y
    vía férrea?
  choices:
    A: Cuando hay múltiples vías.
    B: Cuando las barreras del cruce están totalmente levantadas.
    C: Cuando conduce un vehículo de pasajeros más pequeño.
    D: Nunca es seguro adelantar a otro vehículo en un cruce de carretera y vía férrea.
  answer: D
  explanation: 'El manual establece explícitamente: ''NUNCA adelante a otro vehículo
    en un cruce de carretera y vía férrea''.'
- id: 215
  category: sharing_the_road
  question: ¿Por qué es peligroso incorporarse bruscamente delante de un camión pesado
    después de adelantarlo a alta velocidad cerca de una zona de construcción?
  choices:
    A: El conductor del camión no podrá ver las luces direccionales de su vehículo.
    B: El camión podría chocar su vehículo por detrás porque carece de suficiente
      distancia de frenado.
    C: El camión se verá obligado a acelerar para mantener el flujo del tráfico.
    D: Los trabajadores de la construcción se distraerán con la maniobra.
  answer: B
  explanation: Si se incorpora bruscamente delante de un camión para no quedar atrapado
    detrás de él, el conductor del camión se verá obligado a usar el frenado de emergencia.
    Si no hay suficiente distancia de frenado, el camión chocará su vehículo por detrás.
- id: 216
  category: sharing_the_road
  question: Según el manual, ¿cuáles de los siguientes grupos se consideran peatones?
  choices:
    A: Solo las personas que caminan o trotan.
    B: Caminantes, personas que trotan, patinadores y personas que usan sillas de
      ruedas.
    C: Cualquier persona que opere una bicicleta no motorizada.
    D: Solo las personas que cruzan en pasos de peatones marcados.
  answer: B
  explanation: Los peatones son personas que utilizan y cruzan las vías y caminos
    públicos por medios distintos a los vehículos de motor y las bicicletas. Esto
    incluye, entre otros, a caminantes, personas que trotan, patinadores y personas
    que usan sillas de ruedas.
- id: 217
  category: defensive_driving
  question: ¿Qué sugiere el manual que podría ser la acción más segura si un animal
    representa un peligro en la carretera?
  choices:
    A: Virar bruscamente para evitar al animal a toda costa.
    B: Atropellar al animal para evitar perder el control del vehículo.
    C: Frenar de golpe y detenerse en medio de la carretera.
    D: Tocar la bocina hasta que el animal se mueva.
  answer: B
  explanation: Lamentablemente, lo más seguro para usted y otros conductores que puedan
    estar cerca de usted, puede ser atropellar al animal. Concéntrese en mantener
    el control de su vehículo antes, durante y después de la colisión.
- id: 218
  category: alcohol_drugs_health
  question: ¿Cómo afectan las emociones profundas como el duelo, la rabia o el terror
    la capacidad de una persona para conducir?
  choices:
    A: Aumentan el tiempo de reacción y el estado de alerta del conductor.
    B: Ayudan a los conductores a responder a las situaciones de una manera más razonable.
    C: Superan la capacidad de una persona para pensar con claridad y tomar decisiones
      acertadas.
    D: Solo afectan la conducción si el conductor también está fatigado.
  answer: C
  explanation: Las emociones profundas pueden superar la capacidad de una persona
    para pensar con claridad. Se pierde la capacidad de identificar objetos críticos
    y tomar decisiones acertadas.
- id: 219
  category: safe_driving_rules
  question: ¿Cómo deben compensar los conductores con mala visión lateral mientras
    conducen?
  choices:
    A: Dependiendo totalmente de sus espejos retrovisores.
    B: Mirando hacia los lados moviendo la cabeza además de los ojos.
    C: Conduciendo de 10 a 15 mph más lento que el resto del tráfico.
    D: Tocando la bocina antes de cambiar de carril.
  answer: B
  explanation: Los conductores con mala visión lateral deben mirar hacia los lados
    moviendo la cabeza además de los ojos. Deben tener especial cuidado de mirar hacia
    atrás por encima del hombro al cambiar de carril.
- id: 220
  category: defensive_driving
  question: Si sus ojos no se ajustan rápidamente después de pasar luces brillantes
    deslumbrantes, ¿cuál es una técnica útil?
  choices:
    A: Mirar hacia el lado derecho de la carretera, lejos del resplandor.
    B: Mirar directamente a los faros que vienen en sentido contrario.
    C: Encender la luz interior del techo.
    D: Cerrar un ojo hasta que pase el vehículo.
  answer: A
  explanation: Las personas cuyos ojos no se ajustan rápidamente después de pasar
    luces brillantes deslumbrantes tienen un problema muy serio. Mirar hacia el lado
    derecho de la carretera, lejos del resplandor, puede ayudar.
- id: 221
  category: driver_responsibility
  question: Según la Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA), ¿qué es cierto sobre el uso de teléfonos celulares manos libres al conducir?
  choices:
    A: Son completamente seguros de usar mientras se conduce.
    B: Ofrecen pocos beneficios de seguridad en comparación con los teléfonos de mano.
    C: Reducen el riesgo de choques en un 50%.
    D: Solo son legales para conductores mayores de 21 años.
  answer: B
  explanation: El uso de teléfonos celulares manos libres ofrece pocos beneficios
    de seguridad en comparación con los teléfonos de mano, según la Administración
    Nacional de Seguridad del Tráfico en las Carreteras (NHTSA), porque el proceso
    real de conversar es una de las mayores distracciones para el conductor.
- id: 222
  category: penalties_and_points
  question: ¿Cuál es la ley de Wyoming con respecto al envío de mensajes de texto
    mientras se conduce?
  choices:
    A: Es legal siempre que se utilice un dispositivo de manos libres.
    B: Es legal solo cuando se conduce a menos de 30 mph.
    C: Prohíbe leer o enviar un mensaje de texto mientras se opera un vehículo.
    D: Se permite solo para menores emancipados.
  answer: C
  explanation: La ley de Wyoming prohíbe leer o enviar un mensaje de texto desde un
    teléfono celular u otro dispositivo mientras se opera un vehículo.
- id: 223
  category: safe_driving_rules
  question: Si es absolutamente necesario marcar un número en un teléfono celular
    mientras conduce en una carretera donde está permitido, ¿cuál es el procedimiento
    recomendado?
  choices:
    A: Sostenga el teléfono cerca del volante para poder ver la carretera y el teclado
      simultáneamente.
    B: Marque unos pocos números, vuelva a mirar la carretera y los espejos, y luego
      marque los últimos números.
    C: Pida a un pasajero que sostenga el volante mientras usted marca.
    D: Cámbiese al carril izquierdo para tener más espacio para maniobrar mientras
      marca.
  answer: B
  explanation: Si debe marcar mientras conduce en una carretera en la que se permiten
    las llamadas por teléfono celular, marque unos pocos números, vuelva a mirar la
    carretera y sus espejos para detectar cualquier problema de seguridad que se presente,
    y luego marque los últimos números.
- id: 224
  category: sharing_the_road
  question: ¿Cómo se clasifican legalmente las bicicletas en Wyoming?
  choices:
    A: Como peatones.
    B: Como vehículos motorizados.
    C: Como vehículos que pueden circular por todas las vías públicas.
    D: Como equipo recreativo restringido a las aceras.
  answer: C
  explanation: Clasificadas legalmente como vehículos, las bicicletas pueden circular
    por todas las vías públicas en Wyoming.
- id: 225
  category: defensive_driving
  question: ¿Qué es un "punto ciego" (blind spot)?
  choices:
    A: Un área de la carretera que no tiene alumbrado público.
    B: El área cerca de las esquinas traseras derecha e izquierda del vehículo que
      no se puede ver a través de los espejos retrovisores.
    C: Una condición médica que impide a un conductor conducir de noche.
    D: El espacio directamente frente a un camión comercial grande.
  answer: B
  explanation: Un punto ciego es el área cerca de las esquinas traseras derecha e
    izquierda del vehículo que no se puede ver a través de los espejos retrovisores.
    El conductor debe girar la cabeza para ver estas áreas.
- id: 226
  category: safe_driving_rules
  question: Si no hay marcas de cruce de peatones en la calle, ¿dónde se considera
    que está el cruce de peatones?
  choices:
    A: No hay cruce de peatones si no hay marcas.
    B: En cualquier lugar donde un peatón decida cruzar.
    C: Donde las líneas imaginarias conectarían las aceras a cada lado de la calle
      o carretera.
    D: Exactamente a 10 pies de la intersección.
  answer: C
  explanation: Si no hay marcas, se considera que un cruce de peatones está donde
    las líneas imaginarias conectarían las aceras a cada lado de la calle o carretera.
- id: 227
  category: license_system
  question: ¿Quién califica como un "menor emancipado" según el manual de Wyoming?
  choices:
    A: Cualquier persona menor de 18 años que tenga una licencia de conducir.
    B: Una persona de al menos 17 años de edad que está o estuvo casada, está en el
      ejército o ha sido emancipada por el tribunal de distrito.
    C: Una persona menor de 16 años que conduce hacia y desde la escuela.
    D: Cualquier inmigrante que no sea ciudadano de los Estados Unidos.
  answer: B
  explanation: Un menor emancipado es una persona de al menos 17 años de edad que
    está o estuvo casada, está en el servicio militar de los Estados Unidos o que
    ha sido emancipada por el tribunal de distrito.
- id: 228
  category: safe_driving_rules
  question: ¿A qué se refiere el término "hidroplaneo" (hydroplaning)?
  choices:
    A: Cuando los frenos de un vehículo fallan debido al exceso de humedad.
    B: Cuando los neumáticos de un vehículo ruedan sobre una fina capa de agua en
      lugar de la carretera.
    C: Cuando un conductor pierde el conocimiento debido a la deshidratación.
    D: Cuando un vehículo se sumerge en un cuerpo de agua.
  answer: B
  explanation: El hidroplaneo es cuando los neumáticos de un vehículo ruedan sobre
    una fina capa de agua en lugar de la carretera.
- id: 229
  category: safe_driving_rules
  question: ¿Cuál es la regla legal con respecto a la "mediana" (median) en una carretera?
  choices:
    A: Es legal circular sobre ella solo en caso de emergencia.
    B: Es legal cruzarla si se pasa su salida.
    C: No es legal circular sobre, a través o en la mediana.
    D: Está reservada solo para vehículos de emergencia autorizados.
  answer: C
  explanation: Una mediana es una barrera que separa dos calzadas. No es legal circular
    sobre, a través o en la mediana.
- id: 230
  category: vehicle_information
  question: ¿Cuál es la velocidad máxima que un ciclomotor (moped) es capaz de alcanzar
    para propulsar el vehículo en una superficie de carretera nivelada?
  choices:
    A: 20 millas por hora
    B: 30 millas por hora
    C: 40 millas por hora
    D: 50 millas por hora
  answer: B
  explanation: Un ciclomotor tiene un motor capaz de propulsar el vehículo a una velocidad
    máxima de no más de 30 millas por hora en una superficie de carretera nivelada.
- id: 231
  category: defensive_driving
  question: 'Los conductores con un juicio deficiente de la distancia deben compensarlo:'
  choices:
    A: Permitiendo una mayor distancia de seguimiento para predecir lo que sucede
      de 10 a 15 segundos por delante.
    B: Conduciendo de 10 a 15 mph más lento que el resto del tráfico.
    C: Dependiendo de sus pasajeros para que les digan cuándo rebasar.
    D: Mirando hacia el lado derecho de la carretera.
  answer: A
  explanation: Los conductores con un juicio deficiente de la distancia deben permitir
    una mayor distancia de seguimiento para compensar su incapacidad de predecir con
    precisión lo que sucede de 10 a 15 segundos por delante de ellos.
- id: 232
  category: vehicle_information
  question: Para fines de registro y titulación, ¿cuál de los siguientes se incluye
    en la definición de una 'motocicleta'?
  choices:
    A: Ciclomotores (mopeds)
    B: Vehículos recreativos de tres ruedas para todoterreno
    C: Bicicletas impulsadas únicamente por fuerza humana
    D: Bicicletas motorizadas y scooters
  answer: D
  explanation: Para fines de registro y titulación, el término 'motocicleta' incluye
    bicicletas motorizadas, scooters y vehículos recreativos diseñados principalmente
    para uso todoterreno... pero excluye ciclomotores (mopeds) y vehículos recreativos
    de tres ruedas para todoterreno.
- id: 233
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los vehículos
    multipropósito?
  choices:
    A: Pueden operarse en carreteras interestatales sin restricciones.
    B: No están sujetos a los requisitos de vehículos de movimiento lento.
    C: NO pueden operarse en carreteras interestatales.
    D: Requieren un endoso especial 'M' para conducir.
  answer: C
  explanation: Según el manual, un vehículo multipropósito debe estar registrado y
    tener placas para calles y carreteras, pero NO puede operarse en carreteras interestatales
    y está sujeto a los requisitos de vehículos de movimiento lento.
- id: 234
  category: sharing_the_road
  question: ¿Qué es una 'Zona No' (No-Zone)?
  choices:
    A: Un área designada donde el estacionamiento está estrictamente prohibido.
    B: Un área a cada lado o directamente detrás de un vehículo pesado donde otro
      vehículo no es visible para el conductor.
    C: Una zona escolar donde el límite de velocidad se aplica estrictamente.
    D: Una zona de construcción donde rebasar es ilegal.
  answer: B
  explanation: El manual define una 'Zona No' (No-Zone) como un área a cada lado o
    directamente detrás de un vehículo pesado en la cual otro vehículo no es visible
    para el conductor.
- id: 235
  category: license_system
  question: Según la ley de Wyoming, ¿cuál de los siguientes califica automáticamente
    a una persona como residente?
  choices:
    A: Visitar el estado por más de 30 días.
    B: Tener una licencia de caza o pesca de residente de Wyoming válida.
    C: Alquilar una habitación de hotel para unas vacaciones de fin de semana.
    D: Conducir a través del estado por una carretera interestatal.
  answer: B
  explanation: Una persona se considera residente si posee una licencia de caza o
    pesca de residente de Wyoming válida, entre otros criterios como estar registrado
    para votar o permanecer en la jurisdicción durante 120 días o más.
- id: 236
  category: penalties_and_points
  question: ¿Cuál es la definición de una suspensión de licencia?
  choices:
    A: La cancelación permanente de una licencia de conducir.
    B: La terminación del privilegio de una persona para conducir.
    C: El retiro temporal del privilegio de una persona para conducir.
    D: Una tarifa requerida para restaurar los privilegios de conducción.
  answer: C
  explanation: La suspensión se define como el RETIRO TEMPORAL del privilegio de una
    persona para conducir, mientras que la revocación es la terminación de ese privilegio.
- id: 237
  category: safe_driving_rules
  question: ¿Qué componentes conforman la distancia total de parada de un vehículo?
  choices:
    A: Solo la distancia recorrida después de aplicar los frenos.
    B: La distancia recorrida mientras se decide parar, se reacciona y se frena.
    C: La distancia recorrida solo mientras se reacciona y se frena.
    D: El espacio de seguridad mantenido entre dos vehículos.
  answer: B
  explanation: La distancia total de parada incluye la distancia completa recorrida
    mientras se decide parar, luego se reacciona y, finalmente, después de que se
    aplican los frenos.
- id: 238
  category: signs_and_signals
  question: ¿Qué indica una señal con forma de pentágono?
  choices:
    A: Un cruce de ferrocarril más adelante.
    B: Una zona escolar más adelante o un cruce escolar.
    C: El comienzo de una zona de no rebasar.
    D: Una señal de alto (pare).
  answer: B
  explanation: Una señal de pentágono advierte sobre una zona escolar más adelante
    o marca un cruce escolar.
- id: 239
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad absoluto en una zona escolar?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El manual establece que el límite de velocidad absoluto en una zona
    escolar es de 20 mph.
- id: 240
  category: signs_and_signals
  question: ¿Dónde se ubican las señales con forma de banderín (pennant)?
  choices:
    A: Al comienzo de una zona de no rebasar.
    B: En un cruce de ferrocarril.
    C: En zonas de construcción.
    D: En una parada de cuatro vías.
  answer: A
  explanation: Las señales con forma de banderín se ubican al comienzo de una zona
    de no rebasar.
- id: 241
  category: signs_and_signals
  question: ¿Qué colores se utilizan para las señales de advertencia de construcción
    y mantenimiento?
  choices:
    A: Fondo amarillo con letras negras.
    B: Fondo blanco con letras negras.
    C: Fondo naranja con letras negras.
    D: Fondo rojo con letras blancas.
  answer: C
  explanation: Las señales de construcción tienen letras negras sobre un fondo naranja
    para advertir a los automovilistas sobre condiciones temporales peligrosas o inusuales.
- id: 242
  category: signs_and_signals
  question: ¿Cuándo se le permite girar a la derecha en un semáforo en ROJO fijo?
  choices:
    A: En cualquier momento sin detenerse, siempre que el camino esté despejado.
    B: Solo cuando también esté iluminada una flecha verde.
    C: Nunca se puede girar a la derecha en una luz roja.
    D: Después de detenerse y ceder el paso a personas y otros vehículos, a menos
      que una señal lo prohíba.
  answer: D
  explanation: Puede girar a la derecha en una luz ROJA a menos que haya una señal
    que prohíba el giro, pero solo puede hacerlo después de DETENERSE Y CEDER EL PASO
    a personas y otros vehículos.
- id: 243
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a un semáforo con luz roja intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: Detenerse por completo antes de entrar en la intersección.
    C: Ceder el paso al tráfico de la derecha pero no detenerse.
    D: Acelerar para despejar la intersección rápidamente.
  answer: B
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de "PARE" (STOP); debe detenerse por completo antes de entrar en la intersección.
- id: 244
  category: signs_and_signals
  question: ¿Cuál es la respuesta adecuada cuando un semáforo cambia a ámbar (amarillo)
    fijo?
  choices:
    A: Acelerar para cruzar la intersección antes de que cambie a rojo.
    B: Detenerse inmediatamente, incluso si ya está en la intersección.
    C: Si es posible, DEBE detenerse antes de entrar en la intersección.
    D: Tocar la bocina y continuar sin detenerse.
  answer: C
  explanation: En una luz ámbar, si es posible, DEBE detenerse antes de entrar en
    la intersección. Si no puede detenerse de manera segura, debe cruzar la intersección
    con cuidado.
- id: 245
  category: safe_driving_rules
  question: Si un menor está operando o viajando en un vehículo recreativo todoterreno
    que cruza una vía principal transitada, ¿qué se requiere?
  choices:
    A: Deben estar acompañados por un peatón adulto.
    B: Deben operar el vehículo solo de noche.
    C: Deben usar un casco de acuerdo con las leyes de cascos de Wyoming.
    D: Deben tener una licencia de conducir comercial Clase A.
  answer: C
  explanation: Si el operador es un menor, o si un menor es un pasajero en un vehículo
    recreativo todoterreno, estos deberán operarse de acuerdo con todas las leyes
    de cascos de Wyoming.
- id: 246
  category: vehicle_information
  question: ¿Cuál es el ancho máximo permitido para un vehículo peatonal diseñado
    para personas con una discapacidad física?
  choices:
    A: 36 pulgadas
    B: 48 pulgadas
    C: 50 pulgadas
    D: 60 pulgadas
  answer: B
  explanation: Según el manual, en ningún caso un vehículo peatonal debe exceder las
    48 pulgadas de ancho.
- id: 247
  category: penalties_and_points
  question: ¿Cuál de las siguientes se considera una infracción de tránsito en movimiento?
  choices:
    A: Una multa de estacionamiento recibida mientras el vehículo está desocupado.
    B: Conducir con un registro de vehículo vencido.
    C: Una condena por conducir violando la restricción de lentes correctivos mientras
      el vehículo está en movimiento.
    D: No pagar una tarifa de reinstalación.
  answer: C
  explanation: Una infracción en movimiento es un acto de control o falta de control
    mientras el vehículo está en movimiento que resulta en una condena, incluyendo
    una condena por conducir violando la restricción de lentes correctivos.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) octagonal roja significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 248
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 249
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 250
- image: wrong_way.png
  category: signs_and_signals
  question: ¿Qué debe hacer si ve esta señal?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 251
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Mantenerse a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 252
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 253
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 254
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 255
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona donde está prohibido adelantar.
  id: 256
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse al lado derecho de una isla de tráfico,
    mediana u obstrucción.
  id: 257
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 258
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 259
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 260
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o un cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal fluorescente de color amarillo verdoso en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 261
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (rotonda) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 262
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) se coloca en los cruces de ferrocarril.
    Significa que debe ceder el paso a los trenes. Si se aproxima un tren, debe detenerse.
  id: 263
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 264
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más brusco que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 265
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta (rotonda) más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino curve primero
    hacia un lado y luego hacia el otro.
  id: 266
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 267
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 268
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 269
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con un camellón (mediana) o barrera que separa el tráfico opuesto.
    Manténgase a la derecha.
  id: 270
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción vial más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Prepárese para el
    tráfico de doble sentido.
  id: 271
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de sentido único o de una autopista dividida y se
    encuentre con vehículos que viajan en la dirección opuesta.
  id: 272
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 273
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción vial
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 274
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Prepárese para detenerse
    si la luz está en rojo o amarillo. Esta señal suele colocarse donde el semáforo
    puede no ser visible desde la distancia.
  id: 275
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 276
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 277
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 278
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir una incorporación. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 279
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 280
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de discapacidad válida pueden estacionarse en estos
    espacios. Las infracciones conllevan multas elevadas.
  id: 281
