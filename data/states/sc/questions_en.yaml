metadata:
  source: South Carolina Driver's Manual (December 2025) (dmv.sc.gov)
  total_questions: 281
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What is the maximum gross vehicle weight (GVW) allowed for a vehicle driven
    with a Class D non-commercial license?
  choices:
    A: 10,000 pounds
    B: 16,000 pounds
    C: 26,000 pounds
    D: 36,000 pounds
  answer: C
  explanation: According to the manual, a Class D license allows you to drive non-commercial
    passenger vehicles, such as cars and trucks, which do not exceed 26,000 pounds
    GVW.
- id: 2
  category: license_system
  question: Which class of license allows you to operate non-commercial, single unit
    vehicles that exceed 26,000 pounds GVW?
  choices:
    A: Class D
    B: Class E
    C: Class F
    D: Class G
  answer: B
  explanation: The manual states that a Class E license allows you to operate non-commercial,
    single unit vehicles that exceed 26,000 pounds GVW, such as trucks and motor homes.
- id: 3
  category: license_system
  question: What type of vehicles does a Class F driver's license allow you to drive?
  choices:
    A: Non-commercial passenger vehicles under 26,000 pounds GVW
    B: Non-commercial single unit vehicles over 26,000 pounds GVW
    C: Non-commercial combination vehicles exceeding 26,000 pounds GVW
    D: Two-wheel motorcycles with a detachable sidecar
  answer: C
  explanation: A Class F license allows you to drive non-commercial, combination vehicles
    that exceed 26,000 pounds GVW, such as trucks and motor homes with a towed trailer
    or vehicle.
- id: 4
  category: license_system
  question: What is the minimum age required to obtain a Class G moped license?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: B
  explanation: The manual specifies that the minimum age to obtain a Class G moped
    license is 15.
- id: 5
  category: driver_testing
  question: Which tests are you required to pass in order to get a Class G moped license?
  choices:
    A: Vision and road test
    B: Knowledge and road test
    C: Vision and knowledge test
    D: Vision, knowledge, and road test
  answer: C
  explanation: To get a Class G moped license, you are only required to pass the vision
    and knowledge test.
- id: 6
  category: license_system
  question: Which license class is required to operate a two-wheel motorcycle with
    a detachable sidecar?
  choices:
    A: Class D
    B: Class E
    C: Class F
    D: Class M
  answer: D
  explanation: A Class M license allows you to operate a two-wheel motorcycle, a two-wheel
    motorcycle with a detachable sidecar, or a three-wheel vehicle. Classes D, E,
    and F explicitly exclude two-wheel motorcycles with detachable sidecars.
- id: 7
  category: license_system
  question: If you already hold a valid Class D driver's license, what is required
    for you to legally drive a moped?
  choices:
    A: You must obtain a Class G license.
    B: You must pass an additional road test.
    C: You are not required to obtain a separate license to drive a moped.
    D: You must obtain a Class M license.
  answer: C
  explanation: The manual states that if you have a valid driver's license or permit
    in any of the other four classifications (such as Class D), you are not required
    to obtain a Class G license to drive a moped.
- id: 8
  category: license_system
  question: 'With a Class D driver''s license, you may operate a moped or three-wheel
    vehicle, but you are specifically EXCLUDED from operating:'
  choices:
    A: A passenger car
    B: A non-commercial truck under 26,000 pounds GVW
    C: A two-wheel motorcycle with a detachable sidecar
    D: A non-commercial passenger vehicle
  answer: C
  explanation: The manual notes that with a Class D license, you may operate a moped
    or three-wheel vehicle, but it explicitly excludes a two-wheel motorcycle with
    a detachable sidecar.
- id: 9
  category: license_system
  question: According to the manual, what primary factor determines which class of
    driver's license you will need?
  choices:
    A: The number of passengers the vehicle can hold
    B: The gross vehicle weight rating (GVWR) or gross vehicle weight (GVW)
    C: The age and experience of the driver
    D: The number of axles on the vehicle
  answer: B
  explanation: South Carolina issues licenses based on the gross vehicle weight rating
    (GVWR) or gross vehicle weight (GVW), which determines which class of license
    you will need.
- id: 10
  category: license_system
  question: What is the primary difference between the vehicles allowed under a Class
    E license and a Class F license?
  choices:
    A: Class E is for combination vehicles, while Class F is for single unit vehicles.
    B: Class E is for vehicles under 26,000 pounds, while Class F is for vehicles
      over 26,000 pounds.
    C: Class E is for single unit vehicles over 26,000 pounds, while Class F is for
      combination vehicles over 26,000 pounds.
    D: Class E allows motorcycle operation, while Class F does not.
  answer: C
  explanation: Class E allows the operation of non-commercial, single unit vehicles
    exceeding 26,000 pounds GVW, whereas Class F allows the operation of non-commercial,
    combination vehicles exceeding 26,000 pounds GVW.
- id: 11
  category: driver_responsibility
  question: According to the 'About This Manual' section, what is the purpose of the
    South Carolina Driver's Manual?
  choices:
    A: To provide a complete and identical reproduction of all state motor vehicle
      laws.
    B: To serve as a guide to good driving and help you learn traffic control devices,
      signs, and proper behavior.
    C: To replace the need for a formal driver's education course.
    D: To provide legal advice for fighting traffic violations in court.
  answer: B
  explanation: The manual states its purpose is to be your guide to good driving and
    to help you learn traffic control devices, signs, pavement markings, and proper
    behavior before driving on the highway.
- id: 12
  category: license_system
  question: Which of the following is an example of a vehicle that requires a Class
    F license?
  choices:
    A: A standard passenger car
    B: A moped
    C: A truck or motor home with a towed trailer exceeding 26,000 pounds GVW
    D: A single unit motor home exceeding 26,000 pounds GVW without a trailer
  answer: C
  explanation: Examples of Class F vehicles include trucks and motor homes with a
    towed trailer or vehicle (combination vehicles) that exceed 26,000 pounds GVW.
- id: 13
  category: license_system
  question: Which of the following vehicles would require a Class E driver's license?
  choices:
    A: A non-commercial single unit truck exceeding 26,000 pounds GVW
    B: A non-commercial combination vehicle exceeding 26,000 pounds GVW
    C: A passenger vehicle weighing 15,000 pounds GVW
    D: A two-wheel motorcycle
  answer: A
  explanation: Class E licenses allow you to operate non-commercial, single unit vehicles
    that exceed 26,000 pounds GVW, such as large single-unit trucks and motor homes.
- id: 14
  category: driver_responsibility
  question: According to the manual's disclaimer, why might the information in the
    manual not always be current?
  choices:
    A: Because the manual is only updated once every ten years.
    B: Due to possible legislative changes in federal and state law and SCDMV Policy.
    C: Because the AAMVA Model Driver's License Manual is outdated.
    D: Because state motor vehicle laws are never changed.
  answer: B
  explanation: The disclaimer states that due to possible legislative changes in federal
    and state law and SCDMV Policy, the information in the manual may not always be
    current.
- id: 15
  category: license_system
  question: Which of the following license classes permits the operation of a three-wheel
    vehicle?
  choices:
    A: Class D only
    B: Class M only
    C: Classes D, E, F, and M
    D: Class G only
  answer: C
  explanation: The manual explicitly states that with a Class D, Class E, Class F,
    or Class M license, you are permitted to operate a three-wheel vehicle.
- id: 16
  category: license_system
  question: A Class C Commercial Driver's License (CDL) is required for a single vehicle
    that does not meet Class A or B definitions but is designed to transport how many
    passengers, including the driver?
  choices:
    A: 10 or more
    B: 12 or more
    C: 15 or more
    D: 16 or more
  answer: D
  explanation: The manual states that a Class C CDL is for any single vehicle or combination
    of vehicles that does not meet the definitions of Class A or B, but is designed
    to transport 16 or more passengers, including the driver.
- id: 17
  category: license_system
  question: If you drive a motorcycle and another type of vehicle, how should your
    licensing be handled?
  choices:
    A: You must carry two separate valid driver's licenses.
    B: You must have one driver's license endorsed for both classifications.
    C: You only need a Class M license for both.
    D: You must surrender your regular license to get a motorcycle license.
  answer: B
  explanation: The manual states that it is illegal to have more than one valid driver's
    license. If you drive a motorcycle and another type of vehicle, your single license
    should be endorsed for two classifications.
- id: 18
  category: driver_responsibility
  question: When driving, which of the following documents must you have in your possession?
  choices:
    A: A valid driver's license, vehicle registration, and valid insurance card.
    B: A valid driver's license, birth certificate, and vehicle registration.
    C: A valid insurance card, vehicle registration, and proof of citizenship.
    D: A beginner's permit, social security card, and valid insurance card.
  answer: A
  explanation: When driving you must have a valid driver's license, vehicle registration,
    and valid insurance card in your possession for the class of vehicle you are operating.
- id: 19
  category: driver_testing
  question: If you are driving with a beginner's permit between 6 a.m. and midnight,
    who must be in the front seat with you?
  choices:
    A: Any licensed driver who is at least 18 years old.
    B: A licensed driver who is at least 21 years old with at least one year of driving
      experience.
    C: A parent or legal guardian only.
    D: Any passenger who is at least 21 years old.
  answer: B
  explanation: With a beginner's permit, you may drive from 6 a.m. to midnight if
    a licensed driver who is at least 21 years old and has at least one year of driving
    experience is in the front seat with you.
- id: 20
  category: license_system
  question: Regardless of your age, how long must you hold your beginner's permit
    before you may apply for any type of license?
  choices:
    A: At least 90 days
    B: At least 180 days
    C: At least one year
    D: Until you turn 16
  answer: B
  explanation: You must hold your beginner's permit for at least 180 days, regardless
    of your age, before you may apply for any type of license.
- id: 21
  category: driver_testing
  question: If you are 15 or 16 years old, how many hours of driving practice must
    you complete before applying for your first driver's license?
  choices:
    A: 30 hours, including 5 hours of night driving
    B: 40 hours, including 10 hours of night driving
    C: 50 hours, including 10 hours of night driving
    D: 60 hours, including 15 hours of night driving
  answer: B
  explanation: If you are 15 or 16, you must practice driving for at least 40 hours,
    including ten hours of night driving with an approved individual.
- id: 22
  category: driver_testing
  question: What are the driver's education course requirements for a 15 or 16-year-old
    applying for their first driver's license?
  choices:
    A: Six hours in the classroom and four hours driving
    B: Eight hours in the classroom and six hours driving
    C: Ten hours in the classroom and eight hours driving
    D: Twelve hours in the classroom and ten hours driving
  answer: B
  explanation: A 15 or 16-year-old applying for their first driver's license must
    complete a driver's education course consisting of eight hours in the classroom
    and six hours driving.
- id: 23
  category: license_system
  question: What is the age requirement to be eligible for a conditional license?
  choices:
    A: At least 15, but less than 15 ½
    B: At least 15 ½, but less than 16
    C: At least 16, but less than 16 ½
    D: At least 16 ½, but less than 17
  answer: B
  explanation: If you are at least 15 ½, but less than 16, and have met the requirements
    listed in the section, you are eligible for a conditional license.
- id: 24
  category: safe_driving_rules
  question: Under a conditional or special restricted license, what is the restriction
    regarding passengers under 21 years old when driving without a licensed adult
    who is at least 21?
  choices:
    A: You cannot have any passengers under 21.
    B: You cannot have more than one passenger under 21.
    C: You cannot have more than two passengers under 21.
    D: You cannot have more than three passengers under 21.
  answer: C
  explanation: You cannot have more than two passengers under 21 in the vehicle with
    you unless you are with a licensed adult who is at least 21 (except when transporting
    family members or students to and from school).
- id: 25
  category: safe_driving_rules
  question: During daylight savings time, until what time may a driver with a conditional
    or special restricted license drive alone?
  choices:
    A: 6 p.m.
    B: 8 p.m.
    C: 9 p.m.
    D: Midnight
  answer: B
  explanation: The manual states that you may drive alone from 6 a.m. to 6 p.m., which
    is extended to 8 p.m. during daylight savings time.
- id: 26
  category: penalties_and_points
  question: If you are under 17 and receive six or more points on your record before
    holding your conditional or special restricted license for one year, what is the
    penalty?
  choices:
    A: Your license will be suspended for three months.
    B: Your license will be suspended for six months.
    C: Your license will be revoked permanently.
    D: You must retake the driver's education course.
  answer: B
  explanation: If you are under 17 and receive six or more points on your record before
    you have held your license for one year, your license will be suspended for six
    months.
- id: 27
  category: license_system
  question: What does a special restricted license with a waiver allow a 16-year-old
    to do?
  choices:
    A: Drive by themselves until midnight for work or certain extracurricular activities.
    B: Drive by themselves at any time of day or night.
    C: Transport more than two passengers under 21 without an adult.
    D: Bypass the vision and skills tests entirely.
  answer: A
  explanation: The special restricted license with a waiver allows you to drive by
    yourself until midnight if you work or participate in certain extracurricular
    activities.
- id: 28
  category: license_system
  question: How can a driver with a conditional or special restricted license earn
    full driving privileges before turning 17?
  choices:
    A: By completing an advanced defensive driving course.
    B: By paying a $25 fee at an SCDMV branch.
    C: By keeping the license for one year with no traffic offenses and no at-fault
      collisions.
    D: By passing a secondary road skills test.
  answer: C
  explanation: You will earn full driving privileges at 17, or after keeping your
    conditional or special restricted license for one year, if you received no traffic
    offenses and were not at-fault in any collisions.
- id: 29
  category: license_system
  question: Which of the following is required to obtain a special restricted license
    with a waiver?
  choices:
    A: A letter from your school, church, work, or extracurricular activity explaining
      why you need the waiver.
    B: Proof of at least 60 hours of driving practice.
    C: A certificate showing completion of a defensive driving course.
    D: A written recommendation from a law enforcement officer.
  answer: A
  explanation: To get a special restricted license with a waiver, you must bring a
    letter from your school, church, work, or extracurricular activity that says why
    you need this waiver, among other requirements.
- id: 30
  category: license_system
  question: How long do you have to apply for a South Carolina driver's license after
    permanently moving to the state?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: If you have a valid driver's license or identification (ID) card from
    another state and permanently move to SC, you must apply for an SC license or
    ID within forty-five (45) days of moving.
- id: 31
  category: driver_testing
  question: What will result in an automatic failure during the South Carolina skills
    test?
  choices:
    A: Asking the examiner a question before the test begins
    B: Not using your seat belt
    C: Failing to parallel park perfectly on the first try
    D: Driving a vehicle with a manual transmission
  answer: B
  explanation: You will automatically fail the skills test if you do not use your
    seat belt.
- id: 32
  category: driver_testing
  question: If you fail the skills test on your second attempt, how long must you
    wait before you can be re-tested?
  choices:
    A: 2 business days
    B: 7 calendar days
    C: 14 calendar days
    D: 30 calendar days
  answer: B
  explanation: If you fail the skills test on your second attempt, you must wait seven
    calendar days before you can be re-tested regardless of age or driving experience.
- id: 33
  category: driver_testing
  question: Which type of license does NOT require a skills test in South Carolina?
  choices:
    A: Class D regular license
    B: Motorcycle (Class M) license
    C: Moped license
    D: Commercial driver's license
  answer: C
  explanation: The first test for every type of license includes a vision, knowledge,
    and skills test, except for a moped license. The SCDMV does not require a skills
    test for a moped license.
- id: 34
  category: penalties_and_points
  question: What could happen if you cancel your South Carolina vehicle insurance
    before turning in your SC license plate?
  choices:
    A: You could owe up to $400 in fees.
    B: Your driver's license will be permanently revoked.
    C: You will be required to retake the knowledge test.
    D: You could face up to 30 days in jail.
  answer: A
  explanation: Before you cancel your SC insurance, turn in your SC license plate
    to the SCDMV. If you do not return your plate before you cancel your SC insurance,
    you could owe up to $400 in fees.
- id: 35
  category: license_system
  question: At what age can you earn full driving privileges if you have kept your
    conditional license for one year with no traffic offenses and no at-fault collisions?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: B
  explanation: You will earn full driving privileges at 17, or after keeping your
    conditional or special restricted license for one year, if you received no traffic
    offenses and were not at-fault in any collisions.
- id: 36
  category: driver_testing
  question: What must you do if your out-of-state driver's license has been expired
    for more than nine months when moving to South Carolina?
  choices:
    A: Pay a $400 late fee
    B: Pass the knowledge, skills, and vision tests
    C: Provide a Certificate of Vision Examination from the previous state
    D: Wait 30 calendar days before applying
  answer: B
  explanation: If your out-of-state license is expired for more than nine months,
    you must pass the knowledge, skills, and vision tests before you can get an SC
    license.
- id: 37
  category: license_system
  question: How long is a renewed South Carolina driver's license valid for if a US
    citizen successfully renews it online?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: If you are a US citizen, you may choose to renew your driver's license
    online for an eight-year license.
- id: 38
  category: driver_testing
  question: Which of the following items is NOT allowed in the knowledge test area?
  choices:
    A: Corrective lenses
    B: A cell phone
    C: A valid identification card
    D: A physical copy of your birth certificate
  answer: B
  explanation: Written material or electronic devices of any kind are not allowed
    in the knowledge test area. Examples of electronic devices are a cell phone, laptop,
    and tablet reader.
- id: 39
  category: license_system
  question: What document can active-duty military personnel provide to be exempt
    from the vision screening requirement when renewing a license?
  choices:
    A: A letter from their commanding officer
    B: A Certificate of Vision Examination dated within 36 months
    C: A Leave and Earning Statement (LES) dated within 31 days and a non-expired
      military ID
    D: An International Driving Permit
  answer: C
  explanation: Active-duty military personnel will be exempt from the vision screening
    requirements when providing their Leave and Earning Statement (LES) dated within
    31 days of completing their transaction along with their non-expired military
    ID.
- id: 40
  category: driver_testing
  question: Who is allowed in or around the vehicle during your skills test?
  choices:
    A: Only you and the SCDMV employee
    B: You, the SCDMV employee, and your licensed driver
    C: You, the SCDMV employee, and a parent or guardian
    D: You and any passengers you choose to bring
  answer: A
  explanation: An SCDMV employee will test you. You and the employee are the only
    people allowed in or around the vehicle.
- id: 41
  category: license_system
  question: What is the purpose of an International Driving Permit for visitors from
    non-English speaking countries?
  choices:
    A: It replaces their home country's driver's license.
    B: It serves as a language translation to be used with their valid driver's license.
    C: It grants them commercial driving privileges in South Carolina.
    D: It exempts them from having to carry vehicle liability insurance.
  answer: B
  explanation: An International Driving Permit serves as a language translation to
    be used with your valid driver's license. It is not an actual license but it translates
    your foreign language license into English.
- id: 42
  category: vehicle_information
  question: Which of the following must be in working condition on the vehicle you
    provide for the skills test?
  choices:
    A: Air conditioning
    B: Radio
    C: Defroster
    D: Cruise control
  answer: C
  explanation: 'The vehicle must be safe and have all of the following in working
    condition: Headlights & Brakes, Windshield wipers, Mirrors, Speedometer, Safety
    belts, Turn signals, Defroster, Horn.'
- id: 43
  category: license_system
  question: How will you receive the sleeve that must be wrapped around your license
    to take advantage of full driving privileges?
  choices:
    A: You must pick it up at an SCDMV branch.
    B: It will be given to you by your high school driver's education teacher.
    C: You will receive it in the mail from the SCDMV.
    D: You must purchase it from a third-party tester.
  answer: C
  explanation: You will receive a sleeve in the mail from the SCDMV that is to be
    wrapped around your license. You must keep your license in this sleeve to take
    advantage of your full driving privileges.
- id: 44
  category: license_system
  question: Who is eligible to renew their South Carolina driver's license online
    for an eight-year license?
  choices:
    A: Any resident of South Carolina
    B: Only US citizens
    C: Only non-US citizens
    D: Anyone with a commercial driver's license
  answer: B
  explanation: According to the manual, if you are a US citizen, you may choose to
    renew your driver's license online. If you are not a US citizen, you cannot renew
    your driver's license online.
- id: 45
  category: license_system
  question: To renew your driver's license online, you must not have received more
    than how many points on your driving record in the last two years?
  choices:
    A: Two points
    B: Four points
    C: Five points
    D: Six points
  answer: C
  explanation: One of the requirements to renew your driver's license online is that
    you have not received more than five points on your record in the last two years.
- id: 46
  category: driver_testing
  question: What tests are required if your driver's license has been expired for
    more than nine months?
  choices:
    A: Only a vision test
    B: Only a knowledge test
    C: A vision and knowledge test
    D: A vision, knowledge, and skills test
  answer: D
  explanation: If your driver's license is expired for more than nine months, you
    must visit an SCDMV branch, pass a vision, knowledge, and a skills test, and provide
    current proof of address and identity.
- id: 47
  category: penalties_and_points
  question: How are points on your driving record reduced over time?
  choices:
    A: They are reduced to zero after six months.
    B: They are reduced by half after one year from the violation date.
    C: They are reduced by two points every year.
    D: They remain on your record permanently.
  answer: B
  explanation: Points are reduced by half after one year from the violation date on
    the ticket.
- id: 48
  category: penalties_and_points
  question: If you are 17 or older, at how many points will the SCDMV send you a warning
    letter to drive more carefully?
  choices:
    A: 2 or more points
    B: 4 or more points
    C: 6 or more points
    D: 12 or more points
  answer: C
  explanation: If you are 17 or older and have six or more points on your driving
    record, the SCDMV will send you a letter to drive more carefully.
- id: 49
  category: penalties_and_points
  question: At what point total will a regular driver's license be suspended?
  choices:
    A: 6 or more points
    B: 8 or more points
    C: 10 or more points
    D: 12 or more points
  answer: D
  explanation: If your point total reaches 12 or more, your license will be suspended.
- id: 50
  category: penalties_and_points
  question: 'If you hold a beginner''s permit, conditional, or special restricted
    driver''s license, your driving privileges will be suspended if you accumulate:'
  choices:
    A: 2 or more points
    B: 4 or more points
    C: 6 or more points
    D: 12 or more points
  answer: C
  explanation: If you hold a beginner's permit, conditional or special restricted
    driver's license and you accumulate six or more points, your driving privileges
    will be suspended for having excessive points.
- id: 51
  category: defensive_driving
  question: Which of the following is a requirement for taking a Defensive Driving
    Course to reduce points on your record?
  choices:
    A: The course can be completed online.
    B: The course must be taken before the date of the violation.
    C: The course must be eight hours of classroom training.
    D: You can take the course for a point reduction once every year.
  answer: C
  explanation: The Defensive Driving Course must be eight hours of classroom training,
    cannot be completed online, must be taken after the violation date, and can only
    be used for point reduction once in a three-year period.
- id: 52
  category: defensive_driving
  question: How often can you receive a point reduction for completing a Defensive
    Driving Course?
  choices:
    A: Once every year
    B: Once in a two-year period
    C: Once in a three-year period
    D: Once in a five-year period
  answer: C
  explanation: A reduction in points may only be made one time in a three-year period.
- id: 53
  category: alcohol_drugs_health
  question: 'To be eligible for a six-month provisional driver''s license after a
    first offense DUI (occurring between Oct 1, 2014 and May 18, 2024), your Blood
    Alcohol Concentration (BAC) must have been:'
  choices:
    A: 0.08 percent or less
    B: 0.10 percent or less
    C: 0.14 percent or less
    D: 0.15 percent or greater
  answer: C
  explanation: If the DUI or DUAC violation was on October 1, 2014 or later, you must
    have had a BAC of 0.14 percent or less to be eligible for a provisional license.
- id: 54
  category: alcohol_drugs_health
  question: What program must you be enrolled in to qualify for a provisional driver's
    license after a DUI suspension?
  choices:
    A: Alcohol and Drug Safety Action Program (ADSAP)
    B: National Safety Council's Defensive Driving Course
    C: South Carolina Highway Safety Program
    D: Mothers Against Drunk Driving (MADD) Victim Impact Panel
  answer: A
  explanation: To be eligible for a provisional driver's license, you must be enrolled
    in the Alcohol and Drug Safety Action Program (ADSAP).
- id: 55
  category: license_system
  question: A route-restricted license allows you to drive a non-commercial vehicle
    to which of the following locations?
  choices:
    A: Grocery stores and shopping centers
    B: Recreational parks and gyms
    C: Your place of employment or college
    D: Any location within your home county
  answer: C
  explanation: If you receive a route-restricted license, you may drive to and from
    your place of employment, college, or residence, ADSAP, or a court-ordered drug
    program.
- id: 56
  category: license_system
  question: For a suspension due to an Alcohol Violation or Implied Consent, how many
    route-restricted licenses can you receive in your lifetime?
  choices:
    A: One
    B: Two
    C: Three
    D: Unlimited, as long as you pay the fee
  answer: A
  explanation: You may only receive one route-restricted license in your lifetime
    for certain suspensions, including Alcohol Violation and Implied Consent.
- id: 57
  category: license_system
  question: When renewing your driver's license in person at an SCDMV branch, what
    information must you provide regarding your vehicle?
  choices:
    A: The vehicle identification number (VIN)
    B: The company name of your vehicle insurance
    C: A copy of your vehicle registration
    D: Your vehicle's license plate number
  answer: B
  explanation: To renew at a branch, you must provide the company name of your vehicle
    insurance.
- id: 58
  category: license_system
  question: If you choose to renew your driver's license by mail, how far in advance
    of your expiration date should you mail your application and payment?
  choices:
    A: At least one week
    B: At least two weeks
    C: At least three weeks
    D: At least four weeks
  answer: C
  explanation: Mail your application and payment at least three weeks before your
    expiration date.
- id: 59
  category: penalties_and_points
  question: How much does an approved route restricted license cost?
  choices:
    A: $50
    B: $75
    C: $100
    D: $150
  answer: C
  explanation: According to the manual, if approved, a route restricted license costs
    $100.
- id: 60
  category: alcohol_drugs_health
  question: To be eligible for a Temporary Alcohol License (TAL), within how many
    days must you file for an administrative hearing?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: You may be eligible for a Temporary Alcohol license (TAL) if you have
    a qualifying suspension and have filed for an administrative hearing within 30
    days.
- id: 61
  category: license_system
  question: What must you do with your Temporary Alcohol License (TAL) if your suspension
    is rescinded or overturned?
  choices:
    A: Destroy it immediately
    B: Keep it as a secondary form of ID
    C: Mail it to the US Selective Service
    D: Return it before applying for your regular license
  answer: D
  explanation: The manual states that if your suspension is rescinded or overturned,
    you must return the TAL before you are able to apply for your regular license.
- id: 62
  category: license_system
  question: At what age is the SCDMV required to send a male applicant's information
    to the US Selective Service, unless the credential is surrendered beforehand?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '26'
  answer: B
  explanation: The SCDMV is required to send your information to the US Selective
    Service when you reach the age of 18 unless you physically surrender your credential
    before your 18th birthday.
- id: 63
  category: driver_responsibility
  question: Who makes the final decision regarding organ donation if you choose to
    be an organ donor before your 18th birthday?
  choices:
    A: The SCDMV
    B: The US Selective Service
    C: Your parent or legal guardian
    D: The attending physician
  answer: C
  explanation: If you choose to be an organ donor before your 18th birthday, your
    parent or legal guardian shall make the final decision regarding donation.
- id: 64
  category: safe_driving_rules
  question: According to South Carolina litter laws, how should cigarettes and cigarette
    butts be handled?
  choices:
    A: They are biodegradable and can be thrown out the window
    B: They are considered litter and must be kept inside the vehicle until properly
      disposed of
    C: They can be thrown on the road only if fully extinguished
    D: They are exempt from littering fines
  answer: B
  explanation: Cigarettes and cigarette butts are considered litter and should be
    kept inside your vehicle until they can be disposed of properly.
- id: 65
  category: vehicle_information
  question: What are the minimum requirements to drive a golf cart in South Carolina?
  choices:
    A: 15 years old with a beginner's permit
    B: 16 years old with a valid driver's license
    C: 18 years old with or without a license
    D: 14 years old with a licensed adult
  answer: B
  explanation: You must be at least 16 years old and have a valid driver’s license
    to drive a golf cart.
- id: 66
  category: safe_driving_rules
  question: On what type of roads are you permitted to operate a golf cart during
    the day?
  choices:
    A: Any highway with a speed limit of 45 mph or less
    B: Interstates and primary highways
    C: Secondary streets and highways with posted speed limits of 35 mph or less
    D: Only on private roads and driveways
  answer: C
  explanation: You may operate a golf cart during the day only on secondary streets
    and highways with posted speed limits of thirty-five miles an hour or less.
- id: 67
  category: safe_driving_rules
  question: Why should you avoid using dark or tinted corrective lenses at night?
  choices:
    A: They reflect headlights into the eyes of oncoming drivers
    B: They reduce the light you need to see clearly
    C: They are illegal to wear at any time
    D: They cause eye strain and fatigue
  answer: B
  explanation: You should avoid using dark or tinted corrective lenses at night because
    these types of lenses reduce the light you need to see clearly.
- id: 68
  category: driver_testing
  question: What is the minimum vision standard required to drive in South Carolina?
  choices:
    A: 20/20 corrected in both eyes
    B: 20/30 corrected in one eye
    C: 20/40 corrected in one eye
    D: 20/50 corrected in both eyes
  answer: C
  explanation: The minimum vision standards do not require a greater degree of vision
    than 20/40 corrected in one eye.
- id: 69
  category: driver_testing
  question: How long are standard vision screening certificates valid for, effective
    May 18, 2024?
  choices:
    A: 12 months
    B: 24 months
    C: 36 months
    D: 48 months
  answer: C
  explanation: Effective May 18, 2024, standard vision screening certificates will
    be valid for 36 months.
- id: 70
  category: defensive_driving
  question: How often should you plan to stop and rest during a long trip to avoid
    fatigue?
  choices:
    A: Every 50 miles or 1 hour
    B: Every 100 miles or 2 hours
    C: Every 200 miles or 4 hours
    D: Only when you need to refuel
  answer: B
  explanation: To avoid fatigue, the manual recommends planning to stop about every
    100 miles or 2 hours during long trips.
- id: 71
  category: defensive_driving
  question: If you start feeling tired while driving, what is a recommended way to
    combat fatigue?
  choices:
    A: Drink a large caffeinated beverage and keep driving
    B: Roll down the windows and turn up the radio
    C: Pull off at the next exit or rest area to take a 15 to 20 minute nap
    D: Drive faster to reach your destination sooner
  answer: C
  explanation: If you start feeling tired, stop driving and pull off at the next exit
    or rest area to take a 15 to 20 minute nap or find a place to sleep for the night.
- id: 72
  category: safe_driving_rules
  question: What is South Carolina's law regarding the use of wireless electronic
    communication devices while driving?
  choices:
    A: It is lawful as long as you are driving under 35 mph
    B: It is unlawful if it requires the use of either hand
    C: It is only unlawful for drivers under the age of 18
    D: It is lawful if you are stopped at a red light
  answer: B
  explanation: It is unlawful in SC to use a wireless electronic communication device
    while operating a motor vehicle if it requires the use of either hand.
- id: 73
  category: driver_responsibility
  question: How does the driver's manual define aggressive driving?
  choices:
    A: Driving 10 mph over the posted speed limit
    B: Unintentionally drifting into another lane due to fatigue
    C: Intentionally committing an action that endangers other persons or property
    D: Honking your horn to alert another driver of your presence
  answer: C
  explanation: Aggressive driving occurs when an individual intentionally commits
    an action that endangers other persons or property.
- id: 74
  category: safe_driving_rules
  question: Which of the following best describes aggressive driving?
  choices:
    A: Driving while experiencing extreme emotions
    B: Intentionally committing an action that endangers other persons or property
    C: Driving with a blood alcohol content of 0.02 percent or higher
    D: Failing to check tire pressure monthly
  answer: B
  explanation: Aggressive driving occurs when an individual intentionally commits
    an action that endangers other persons or property.
- id: 75
  category: alcohol_drugs_health
  question: Alcohol and other impairing drugs are involved in approximately what percentage
    of all traffic collisions in which someone is killed each year?
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: Alcohol and other impairing drugs are involved in approximately 40%
    of all traffic collisions in which someone is killed each year.
- id: 76
  category: alcohol_drugs_health
  question: At what Blood Alcohol Content (BAC) level is a driver's vision first impacted?
  choices:
    A: 0.02 percent
    B: 0.05 percent
    C: 0.08 percent
    D: 0.15 percent
  answer: A
  explanation: Vision is impacted at 0.02 percent blood alcohol content (BAC) for
    all drivers.
- id: 77
  category: alcohol_drugs_health
  question: When does alcohol impairment begin?
  choices:
    A: After the second drink
    B: When your BAC reaches 0.05 percent
    C: With the first drink
    D: When your BAC reaches 0.08 percent
  answer: C
  explanation: The manual states that impairment starts with the first drink, and
    even one drink of alcohol can affect a person's ability to operate a motor vehicle.
- id: 78
  category: penalties_and_points
  question: 'If you are under 21 years of age and register a BAC of 0.02 percent or
    greater, your driving privilege will be suspended for at least:'
  choices:
    A: One month
    B: Three months
    C: Six months
    D: One year
  answer: B
  explanation: If you are under 21 years of age and register a BAC of 0.02 percent
    or greater, your privilege to drive will be suspended immediately for at least
    three months.
- id: 79
  category: penalties_and_points
  question: 'If an under-21 driver refuses to take a test for intoxicants, they will
    immediately lose their driving privileges for at least:'
  choices:
    A: Three months
    B: Six months
    C: Nine months
    D: Twelve months
  answer: B
  explanation: If you refuse to take the test(s) for intoxicants, you will immediately
    lose your driving privileges for at least six months.
- id: 80
  category: driver_responsibility
  question: 'South Carolina''s implied consent law means that by getting a driver''s
    license, you have implicitly consented to:'
  choices:
    A: A vehicle search if pulled over for speeding
    B: A lawfully-requested test to determine the alcohol content of your blood, breath,
      or urine
    C: Pay all traffic fines within 30 days
    D: Allow law enforcement to check your medical records
  answer: B
  explanation: SC's implied consent law is based on the principle that when you get
    your driver's license, you have implicitly consented to a lawfully-requested test
    to determine the alcohol content of your blood, breath, or urine if suspected
    of impaired driving.
- id: 81
  category: driver_responsibility
  question: Which state's implied consent law applies if you are arrested for impaired
    driving?
  choices:
    A: The state where you got your license
    B: The state where your vehicle is registered
    C: The state where you were arrested
    D: The state of your primary residence
  answer: C
  explanation: Although implied consent laws vary by state, the law applies to the
    state where you were arrested, not the state where you got your license.
- id: 82
  category: alcohol_drugs_health
  question: Can you be convicted of driving impaired with a BAC of 0.05 percent or
    lower?
  choices:
    A: No, the legal limit is 0.08 percent.
    B: No, unless you are under 21 years of age.
    C: Yes, if it is in combination with drugs, including prescription and over-the-counter
      medications.
    D: Yes, but only if you have a prior DUI conviction.
  answer: C
  explanation: Under the law, you can still be convicted for driving impaired even
    if you have a BAC of only 0.05 or a lower BAC in combination with drugs, including
    prescription and over-the-counter medications.
- id: 83
  category: alcohol_drugs_health
  question: How can over-the-counter drugs like pep pills and diet pills affect your
    driving?
  choices:
    A: They improve your reaction time.
    B: They can make you feel nervous, dizzy, unable to concentrate, and affect your
      vision.
    C: They lower your blood alcohol concentration.
    D: They have no effect on your ability to drive.
  answer: B
  explanation: Pep pills, 'uppers,' and diet pills can make you feel nervous, dizzy,
    unable to concentrate, and may affect your vision.
- id: 84
  category: alcohol_drugs_health
  question: What is the effect of combining alcohol with prescription or over-the-counter
    drugs?
  choices:
    A: The drugs will cancel out the effects of the alcohol.
    B: The combination could multiply the effects of alcohol or have additional effects.
    C: It is safe as long as the drugs were prescribed by a doctor.
    D: It only affects your driving if your BAC is over 0.08 percent.
  answer: B
  explanation: Never drink alcohol while you are taking other drugs, including prescription
    or over-the-counter drugs. These drugs could multiply the effects of alcohol or
    have additional effects of their own.
- id: 85
  category: defensive_driving
  question: What should you do if you are angry or worried before a driving trip?
  choices:
    A: Drive slightly faster to reach your destination sooner.
    B: Turn on the radio to distract yourself.
    C: Give yourself time to cool off and stay off the road until symptoms pass.
    D: Drink a caffeinated beverage to improve your focus.
  answer: C
  explanation: If you are angry or worried, it is best to give yourself time to 'cool
    off'. A short walk or nap may help. It is best to stay off the road until your
    symptoms have passed.
- id: 86
  category: driver_responsibility
  question: Which of the following is a common problem that may face an older driver
    in traffic?
  choices:
    A: Increased physical dexterity
    B: Faster judgment and decision-making
    C: Hearing and eyesight becoming less keen
    D: Heightened awareness of new rules and regulations
  answer: C
  explanation: As age progresses, hearing and eyesight are often less keen, judgment
    may be slower, physical dexterity may be weakened, and they may not realize new
    rules are introduced.
- id: 87
  category: defensive_driving
  question: Which of the following is a sign that an older driver may need to modify
    their driving habits or give up driving?
  choices:
    A: Parking parallel to the curb perfectly on the first try
    B: Taking a long time to get going again after a light turns green
    C: Easily maintaining the pace of other vehicles
    D: Having no trouble judging the distance of approaching vehicles
  answer: B
  explanation: Taking quite a long time to get going again after the light has turned
    green is listed as a common cause of trouble among older drivers that indicates
    it may be time to modify driving habits.
- id: 88
  category: vehicle_information
  question: Where can you find the recommended PSI number for your vehicle's tires?
  choices:
    A: On the tread of the tires
    B: On a sticker located on the inside doorframe of the vehicle
    C: On the vehicle's license plate
    D: On the steering wheel
  answer: B
  explanation: Open your vehicle door. On the inside doorframe, you should see a sticker.
    Make a note of what the PSI number is on the sticker.
- id: 89
  category: vehicle_information
  question: What does PSI stand for when checking your vehicle's tire pressure?
  choices:
    A: Pressure per Square Inch
    B: Pounds per Square Inch
    C: Proportionate Surface Inflation
    D: Pneumatic Standard Index
  answer: B
  explanation: According to the manual, PSI means Pounds per Square Inch, which is
    the measurement for tire pressure.
- id: 90
  category: vehicle_information
  question: What should you do if the number on your tire pressure gauge is higher
    than the recommended PSI number on your vehicle's doorframe?
  choices:
    A: Inflate your tires until the numbers match
    B: Leave the tires as they are
    C: Let air out of your tires
    D: Replace the tires immediately
  answer: C
  explanation: 'The manual states: ''If the number on your gauge is higher than the
    number on the doorframe, let air out of your tires.'''
- id: 91
  category: vehicle_information
  question: When checking your tire tread depth with a penny, what indicates that
    your tires are too worn and should not be driven on?
  choices:
    A: You cannot see Lincoln's head at all
    B: You can see all of Lincoln's head
    C: The penny falls out of the groove
    D: Lincoln's head is completely covered by the tread
  answer: B
  explanation: When placing a penny with Lincoln's head going first into the deepest
    groove, if you can see all of his head, your tires are too worn and need to be
    replaced.
- id: 92
  category: safe_driving_rules
  question: When adjusting your seat before driving, what is the minimum recommended
    distance between your chest and the steering wheel?
  choices:
    A: 5 inches
    B: 10 inches
    C: 12 inches
    D: 15 inches
  answer: B
  explanation: The manual specifies that there should be at least 10 inches between
    your chest and the steering wheel to allow appropriate space for airbag deployment.
- id: 93
  category: safe_driving_rules
  question: How should head restraints be adjusted to properly prevent whiplash?
  choices:
    A: Below the level of your ears
    B: At the base of your neck
    C: So the restraint contacts the back of your head and not below the level of
      your ears
    D: At least two inches above the top of your head
  answer: C
  explanation: Head restraints are designed to prevent whiplash and should be adjusted
    so they contact the back of your head and not below the level of your ears.
- id: 94
  category: safe_driving_rules
  question: To properly set the left side mirror using enhanced mirror settings, where
    should the driver's head be positioned?
  choices:
    A: Directly below the rearview mirror
    B: Resting against the closed window on the left
    C: Leaning over the center console
    D: Pressed against the steering wheel
  answer: B
  explanation: To set the left side mirror, the driver must rest his or her head against
    the closed window on the left and adjust the mirror so the rear edge of the vehicle
    barely shows.
- id: 95
  category: penalties_and_points
  question: Under South Carolina's primary safety belt enforcement law, when can a
    law enforcement officer stop a driver?
  choices:
    A: Only if the driver is speeding
    B: Only if the vehicle is involved in a collision
    C: If the officer has a clear and unobstructed view of a driver or occupant not
      wearing a safety belt
    D: Only at designated safety belt checkpoints
  answer: C
  explanation: Under the primary law, an officer has the authority to stop a driver
    if they have a clear and unobstructed view of a driver or occupant not wearing
    a safety belt or not secured in a child restraint system.
- id: 96
  category: safe_driving_rules
  question: How should the shoulder harness of a safety belt be worn?
  choices:
    A: Under the arm
    B: Behind the back
    C: Across the shoulder and chest with minimal slack
    D: Loosely across the neck and chest
  answer: C
  explanation: A shoulder harness is worn across the shoulder and chest with minimal,
    if any, slack. Wearing it under the arm or behind the back could result in serious
    internal injuries.
- id: 97
  category: safe_driving_rules
  question: Where must you NEVER place a rear-facing child safety seat?
  choices:
    A: In the back seat of a sedan
    B: In a vehicle without air bags
    C: In front of an air bag
    D: In the rear seat behind the driver
  answer: C
  explanation: 'The manual explicitly states: ''You must never place a rear-facing
    child safety seat in front of an air bag.'''
- id: 98
  category: safe_driving_rules
  question: According to South Carolina law, where must children age seven and younger
    sit in the vehicle?
  choices:
    A: In the front passenger seat
    B: In a car seat in the back seat of the vehicle
    C: In any seat as long as they wear a seatbelt
    D: In the cargo area of an SUV
  answer: B
  explanation: Children age seven and younger must sit in a car seat in the back seat
    of the vehicle to avoid injury from an air bag in the event of a collision.
- id: 99
  category: safe_driving_rules
  question: Which child is required to be secured in a booster seat using lap and
    shoulder belts?
  choices:
    A: An infant under age two
    B: A child at least age two who has outgrown their rear-facing seat
    C: A child at least age four who has outgrown their forward-facing car seat
    D: A child at least age 8 or 57 inches tall
  answer: C
  explanation: Children at least age four who have outgrown their forward-facing car
    seat must be secured by a booster seat in a rear seat of the vehicle. Lap and
    shoulder belts must be used.
- id: 100
  category: safe_driving_rules
  question: At what age or height may a child be restrained by an adult safety seat
    belt if they can be secured properly?
  choices:
    A: At least age 6 or 50 inches tall
    B: At least age 7 or 55 inches tall
    C: At least age 8 or 57 inches tall
    D: At least age 10 or 60 inches tall
  answer: C
  explanation: A child at least age 8 or at least 57 inches tall may be restrained
    by an adult safety belt if the child can be secured properly by it.
- id: 101
  category: penalties_and_points
  question: What is the penalty for a driver who fails to properly secure their load?
  choices:
    A: A verbal warning
    B: A felony charge and license suspension
    C: Guilty of a misdemeanor and may face a fine and cleanup costs
    D: Mandatory community service only
  answer: C
  explanation: A driver who fails to properly secure their load is guilty of a misdemeanor
    and may face a fine and the cost to have the substance of their load cleaned up.
- id: 102
  category: safe_driving_rules
  question: When is a load considered securely fastened?
  choices:
    A: When it is covered by a tarp
    B: When nothing can slide, shift, fall, or sift onto the roadway or become airborne
    C: When it weighs less than 500 pounds
    D: When it is tied down with at least one rope
  answer: B
  explanation: A load must be securely fastened and is only considered secure when
    nothing can slide, shift, fall, or sift onto the roadway or become airborne.
- id: 103
  category: driver_testing
  question: Which of the following Advanced Driver Assistance Systems (ADAS) features
    are you NOT allowed to use during your driving test?
  choices:
    A: Back up camera and blind spot warning
    B: Forward collision warning and automatic emergency braking
    C: Lane keeping assistance and back up camera
    D: Parking assist and cruise control
  answer: D
  explanation: 'The manual states: ''When taking your driving test, you will not be
    allowed to use certain safety features, such as parking assist and cruise control.'''
- id: 104
  category: driver_testing
  question: Are you allowed to use safety features like parking assist and cruise
    control during your driving test?
  choices:
    A: Yes, if the vehicle is equipped with them.
    B: No, you will not be allowed to use certain safety features.
    C: Yes, but only the parking assist feature.
    D: No, unless the examiner specifically requests it.
  answer: B
  explanation: 'The manual states: ''When taking your driving test, you will not be
    allowed to use certain safety features, such as parking assist and cruise control.'''
- id: 105
  category: vehicle_information
  question: What should you be aware of regarding your vehicle's safety features in
    adverse weather conditions?
  choices:
    A: They work best in rain, snow, and fog.
    B: They automatically take over the driving task in bad weather.
    C: They may not work properly in conditions such as rain, snow, ice, and fog.
    D: They should be permanently disabled if you live in a snowy climate.
  answer: C
  explanation: The manual advises drivers to 'Be aware that safety features may not
    work properly in certain conditions such as rain, snow, ice, fog, hills, and curves.'
- id: 106
  category: vehicle_information
  question: When starting the engine of a vehicle, where should your right foot be
    placed?
  choices:
    A: On the accelerator pedal
    B: On the clutch pedal
    C: Flat on the floorboard
    D: On the brake pedal
  answer: D
  explanation: According to the manual, 'To start the engine, place your right foot
    on the brake pedal and check the gear selector lever for park.'
- id: 107
  category: safe_driving_rules
  question: How should your foot be positioned when pressing the accelerator to move
    the vehicle?
  choices:
    A: The heel of your foot on the pedal and toes on the floor.
    B: The top of your foot on the pedal and the heel of your foot on the floor.
    C: Your entire foot lifted off the floor and pressing the center of the pedal.
    D: The side of your foot resting gently on the pedal.
  answer: B
  explanation: The manual instructs to 'Accelerate gradually and smoothly with the
    top of your foot on the pedal and the heel of your foot on the floor.'
- id: 108
  category: safe_driving_rules
  question: What is the first step you should take when preparing to stop the vehicle?
  choices:
    A: Shift the gear selector to park.
    B: Check your mirrors for traffic at the rear of your vehicle.
    C: Press the brake pedal with sudden, firm pressure.
    D: Turn on your hazard lights.
  answer: B
  explanation: 'Under the ''Stopping the Vehicle'' section, the first instruction
    is: ''Check your mirrors for traffic at the rear of your vehicle.'''
- id: 109
  category: vehicle_information
  question: Which of the following describes the proper way to grip the steering wheel?
  choices:
    A: Tightly with the palms of your hands.
    B: From the inside of the steering wheel rim.
    C: Firmly but gently using your fingers, with thumbs up along the face of the
      wheel.
    D: With one hand at the 12 o'clock position at all times.
  answer: C
  explanation: 'The manual states: ''Your grip on the steering wheel should be firm
    but gentle. Use your fingers to grip the steering wheel instead of the palms of
    your hands and keep your thumbs up along the face of the steering wheel.'''
- id: 110
  category: safe_driving_rules
  question: What is the recommended hand position on the steering wheel for normal
    driving?
  choices:
    A: Left hand at 10 o'clock and right hand at 2 o'clock.
    B: Left hand at 7 to 9 o'clock and right hand at 3 to 5 o'clock.
    C: Left hand at 11 o'clock and right hand at 1 o'clock.
    D: Left hand at 8 o'clock and right hand on the gear shift.
  answer: B
  explanation: 'The manual recommends: ''Place your left hand at the 7 to 9 o’clock
    position and your right hand at the 3 to 5 o’clock position.'''
- id: 111
  category: defensive_driving
  question: Why is the 2 and 10 o'clock steering wheel hand position no longer recommended?
  choices:
    A: It causes the vehicle to weave in the lane.
    B: It requires too much muscle stress to maintain.
    C: It makes it difficult to reach the turn signals.
    D: It can be dangerous in vehicles equipped with airbags.
  answer: D
  explanation: The manual explicitly states that '2 and 10 o’clock is not recommended
    because it can be dangerous in vehicles equipped with airbags.'
- id: 112
  category: vehicle_information
  question: When should a driver use hand-over-hand steering?
  choices:
    A: When turning the wheel at low speeds, such as at an intersection or when parking.
    B: When driving forward at speeds above 15 mph.
    C: When changing lanes on the highway.
    D: When backing up in a straight line.
  answer: A
  explanation: The manual instructs to 'Use hand-over-hand steering when turning the
    wheel at low speeds, such as at an intersection or when parking the vehicle.'
- id: 113
  category: safe_driving_rules
  question: When is the ONLY time the 12 o'clock hand position on the steering wheel
    is recommended?
  choices:
    A: When driving on lightly traveled rural roads.
    B: When operating the windshield wipers or flashers.
    C: When backing a vehicle to the left or right and the driver has to turn in the
      seat.
    D: When executing a hand-over-hand turn at an intersection.
  answer: C
  explanation: 'The manual states: ''The only time that 12 o’clock is recommended
    is when backing a vehicle to the left or right and the driver has to turn in the
    seat in order to see the path of travel to the rear.'''
- id: 114
  category: safe_driving_rules
  question: What is an important step to take before getting into your vehicle to
    back up?
  choices:
    A: Check behind the vehicle because children and small objects cannot be seen
      from the driver's seat.
    B: Turn on your hazard lights to warn other drivers.
    C: Honk your horn twice to alert pedestrians.
    D: Adjust your rearview mirror to point downwards at the pavement.
  answer: A
  explanation: 'The manual lists the first step for backing up safely as: ''Check
    behind the vehicle before you get in it. Children and small objects cannot be
    seen from the driver’s seat.'''
- id: 115
  category: vehicle_information
  question: When backing up, where should you place your right arm?
  choices:
    A: On the steering wheel at the 3 o'clock position.
    B: On the center console.
    C: Out the passenger side window.
    D: On the back of the passenger seat to the right.
  answer: D
  explanation: When backing up, the manual instructs to 'Place your right arm on the
    back of the passenger seat to the right and look directly through the rear window.'
- id: 116
  category: defensive_driving
  question: Why should you not rely solely on your mirrors when backing up?
  choices:
    A: Mirrors distort the color of objects behind you.
    B: Mirrors do not show the area immediately behind your vehicle.
    C: Mirrors make vehicles appear closer than they actually are.
    D: Mirrors are disabled when the vehicle is shifted into reverse.
  answer: B
  explanation: The manual advises to 'Occasionally check your mirrors when backing
    up but keep in mind that these mirrors do not show the area immediately behind
    your vehicle.'
- id: 117
  category: sharing_the_road
  question: According to the yielding right-of-way rules, who automatically has the
    right-of-way at an intersection?
  choices:
    A: The largest vehicle.
    B: The vehicle traveling at the highest speed.
    C: Pedestrians only.
    D: No one should assume they automatically have the right-of-way.
  answer: D
  explanation: 'The manual states: ''Although yielding right-of-way rules provide
    a guide to determine who should yield the right-of-way, no one should assume he
    or she automatically has the right-of-way.'''
- id: 118
  category: safe_driving_rules
  question: To whom must you yield the right-of-way when approaching an intersection?
  choices:
    A: Only to vehicles approaching from the right.
    B: Only to pedestrians in marked crosswalks.
    C: To pedestrians, bicyclists, and other drivers who are still in the intersection.
    D: To vehicles that arrive at the intersection after you do.
  answer: C
  explanation: 'The manual states: ''You should yield the right-of-way to: pedestrians,
    bicyclists, and other drivers who are still in the intersection.'''
- id: 119
  category: safe_driving_rules
  question: Who should you yield the right-of-way to if you and another driver arrive
    at a four-way intersection controlled by stop signs at the exact same time?
  choices:
    A: The driver on your left
    B: The driver on your right
    C: The driver in the largest vehicle
    D: The driver who flashes their headlights
  answer: B
  explanation: The manual states you should yield the right-of-way to the driver on
    your right at a four-way intersection controlled by stop signs if both of you
    arrive at the intersection at the same time.
- id: 120
  category: safe_driving_rules
  question: When entering a public highway from a driveway or private road, what must
    you do?
  choices:
    A: Yield the right-of-way to drivers already on the public highway.
    B: Sound your horn and proceed without stopping.
    C: Accelerate quickly to merge into traffic.
    D: Expect highway traffic to yield to you.
  answer: A
  explanation: According to the right-of-way rules in the manual, you must yield to
    drivers on a public highway if you are entering the highway from a driveway or
    a private road.
- id: 121
  category: signs_and_signals
  question: What should you do if you are approaching an intersection and the traffic
    light turns yellow?
  choices:
    A: Speed up to clear the intersection before it turns red.
    B: Stop your vehicle and wait for the next green light.
    C: Proceed at your current speed without stopping.
    D: Honk your horn to warn other drivers you are coming through.
  answer: B
  explanation: 'A yellow caution light warns that the signal is about to change to
    red. The manual states: ''Therefore, you should stop your vehicle and wait for
    the next green light.'''
- id: 122
  category: signs_and_signals
  question: Under what conditions is it legally permitted to make a right turn on
    a red traffic light?
  choices:
    A: Only when a sign explicitly permits a right turn on red.
    B: Anytime, without needing to stop first.
    C: After stopping and yielding to pedestrians and other traffic, unless a sign
      prohibits it.
    D: Only between the hours of 6 AM and 6 PM.
  answer: C
  explanation: The manual permits traffic facing a red signal to turn right except
    where a sign prohibits it. However, you must first stop before entering the crosswalk
    and yield right-of-way to pedestrians and other traffic.
- id: 123
  category: signs_and_signals
  question: How should you treat a flashing red traffic light?
  choices:
    A: Treat it as a yield sign and slow down.
    B: Treat it as a stop sign by coming to a complete stop before entering.
    C: Proceed through the intersection without stopping if it is clear.
    D: Pull over to the side of the road and wait for it to turn green.
  answer: B
  explanation: A flashing red traffic light means you must stop behind a stop line,
    crosswalk, or intersection and use the same procedure as you would at a stop sign,
    by coming to a complete stop.
- id: 124
  category: signs_and_signals
  question: What is the typical shape and color of a warning sign?
  choices:
    A: Square and white with black lettering.
    B: Octagonal and red with white lettering.
    C: Diamond-shaped and yellow with black lettering or symbols.
    D: Rectangular and green with white lettering.
  answer: C
  explanation: The manual states that warning signs are usually yellow with black
    lettering or symbols and are typically diamond shaped.
- id: 125
  category: signs_and_signals
  question: What color are work zone signs that alert drivers to construction or maintenance
    ahead?
  choices:
    A: Fluorescent yellow
    B: Orange
    C: Green
    D: Blue
  answer: B
  explanation: Work zone signs are generally diamond- or rectangular-shaped and orange
    with black letters or symbols to alert you to construction, maintenance, or emergency
    operations.
- id: 126
  category: penalties_and_points
  question: What are the potential consequences of endangering a highway worker in
    a work zone?
  choices:
    A: A written warning only.
    B: You may be fined and have points assessed against your driving record.
    C: Immediate suspension of your driver's license for one year.
    D: You will be required to retake the driving skills test.
  answer: B
  explanation: 'The manual explicitly states: ''If you endanger a highway worker you
    may be fined and have points assessed against your driving record.'''
- id: 127
  category: signs_and_signals
  question: What do regulatory signs with a red circle and a red slash over a symbol
    indicate?
  choices:
    A: A hazard is present on the roadway.
    B: You are approaching a school zone.
    C: Certain actions are prohibited.
    D: You must yield the right-of-way.
  answer: C
  explanation: According to the manual, some regulatory signs have a red circle with
    a red slash over a symbol, which prohibit certain actions.
- id: 128
  category: signs_and_signals
  question: Where must you stop at a stop sign if there is no stop line or crosswalk
    present?
  choices:
    A: Exactly parallel to the stop sign.
    B: Ten feet before the intersection.
    C: At the point nearest the intersection where you can see in both directions
      without entering the cross traffic lane.
    D: You do not need to stop if the intersection is clear.
  answer: C
  explanation: 'The manual states: ''If a stop line is not present, then stop at the
    point nearest the intersection where you (the driver) can see in both directions
    without entering the cross traffic lane.'''
- id: 129
  category: signs_and_signals
  question: Which of the following describes the shape and color of a yield sign?
  choices:
    A: A red and white downward-pointing triangle.
    B: A yellow and black diamond.
    C: A white and black rectangle.
    D: A red and white octagon.
  answer: A
  explanation: The manual describes a yield sign as 'a red and white downward-pointing
    triangle with red letters.'
- id: 130
  category: safe_driving_rules
  question: What is the proper use of a shared center lane?
  choices:
    A: For passing slower vehicles.
    B: For through traffic during rush hour.
    C: For parking in emergency situations.
    D: For left turning vehicles from either direction.
  answer: D
  explanation: A Shared Center Lane Left Turn Only sign indicates a lane reserved
    for the use of left turning vehicles from either direction and is not to be used
    for through traffic or passing other vehicles.
- id: 131
  category: defensive_driving
  question: What should you do if your vehicle ever gets stuck on a railroad track?
  choices:
    A: Stay in the vehicle and honk your horn.
    B: Contact the emergency phone number listed on the blue sign and provide the
      crossing information.
    C: Try to push the vehicle off the tracks yourself.
    D: Wait for a train to approach before abandoning the vehicle.
  answer: B
  explanation: 'The manual advises: ''If your vehicle ever gets stuck on a track,
    contact the emergency phone number listed on the blue sign and provide the crossing
    information.'''
- id: 132
  category: signs_and_signals
  question: What do black and white speed limit signs indicate?
  choices:
    A: The minimum speed you must travel.
    B: The recommended speed for hazardous conditions.
    C: The maximum legal speed allowed in ideal conditions.
    D: The speed you should travel in a school zone.
  answer: C
  explanation: Speed Limit Signs are black and white signs that indicate the maximum
    legal speed allowed in ideal conditions.
- id: 133
  category: safe_driving_rules
  question: When you are making a left turn at an intersection, who must you yield
    the right-of-way to?
  choices:
    A: Drivers in the opposing traffic lane.
    B: Drivers turning right from the intersecting road.
    C: Drivers behind you.
    D: No one, left-turning vehicles always have the right-of-way.
  answer: A
  explanation: The manual states that you should yield the right-of-way to 'drivers
    in the opposing traffic lane when you are making a left turn.'
- id: 134
  category: signs_and_signals
  question: What colors are guide signs that provide information on intersecting roads,
    cities, and points of interest?
  choices:
    A: Red, white, or black
    B: Yellow, orange, or fluorescent pink
    C: Green, brown, or blue
    D: White, yellow, or green
  answer: C
  explanation: Guide signs are square or rectangular and are green, brown, or blue.
    They give information on intersecting roads, help direct you to cities and towns,
    and show points of interest.
- id: 135
  category: signs_and_signals
  question: On a state secondary system route marker, what does the first number after
    the letter 'S' represent?
  choices:
    A: The speed limit of the road
    B: The number of the county the road is in
    C: The distance to the nearest interstate
    D: The specific road number
  answer: B
  explanation: On a secondary system road marker, the first number after the letter
    'S' is the number of the county the road is in and the last number is the road
    number.
- id: 136
  category: signs_and_signals
  question: When might you see an Evacuation Route sign being utilized in the coastal
    areas of South Carolina?
  choices:
    A: During a mandatory evacuation for a hurricane
    B: When a road is closed for construction
    C: During a severe winter snowstorm
    D: When school zones are active
  answer: A
  explanation: In the event of a hurricane, a mandatory evacuation may be declared
    for the coastal areas of SC. The Evacuation Route sign indicates the road is used
    as an evacuation route in this type of emergency.
- id: 137
  category: safe_driving_rules
  question: What do white lane markings indicate on a roadway?
  choices:
    A: Passing is prohibited in both directions
    B: Traffic is flowing in two opposite directions
    C: Traffic is flowing in one direction
    D: The lane is reserved for carpools
  answer: C
  explanation: According to the pavement markings section, white lane markings indicate
    a one-direction roadway, whereas yellow markings indicate a two-direction roadway.
- id: 138
  category: safe_driving_rules
  question: If an intersection has both a stop line and a crosswalk, which must you
    obey first?
  choices:
    A: The crosswalk
    B: The stop line
    C: The traffic signal
    D: The pedestrian walkway
  answer: B
  explanation: The manual states that if there is a stop line before the crosswalk,
    the stop line must be obeyed first.
- id: 139
  category: safe_driving_rules
  question: When making a right turn, what should you avoid doing before making the
    turn?
  choices:
    A: Accelerating smoothly into the turn
    B: Swinging wide to the left before making the turn
    C: Turning from the right-most portion of your lane
    D: Looking through the turn to the farthest point
  answer: B
  explanation: When making right turns, you should avoid swinging wide to the left
    before making the turn.
- id: 140
  category: safe_driving_rules
  question: What is the proper procedure when turning from a road with multiple turning
    lanes?
  choices:
    A: Change lanes in the middle of the intersection to find the fastest route
    B: Identify and enter the lane from which you will turn, and stay in that lane
      until the turn is completed
    C: Always turn from the right-most lane regardless of your intended direction
    D: Yield to vehicles in the adjacent turning lane and merge into their lane
  answer: B
  explanation: For multiple lanes turning, you must identify and enter the lane from
    which you will turn and stay in that lane until the turn is completed.
- id: 141
  category: safe_driving_rules
  question: Under what conditions should you use a three-point turnabout?
  choices:
    A: On a busy multi-lane highway
    B: When you missed an exit on the interstate
    C: Only on a two-lane roadway that is not busy when the road is too narrow for
      a U-turn
    D: Whenever you need to reverse direction in a residential driveway
  answer: C
  explanation: A three-point turnabout should only be used on a two-lane roadway that
    is not busy when the road or street is too narrow to make a U-turn and you cannot
    go around the block.
- id: 142
  category: safe_driving_rules
  question: Which of the following must be avoided when performing a three-point turnabout?
  choices:
    A: Checking your blind spots
    B: Using your turn signals
    C: Hitting the curb or driving off the road surface
    D: Placing the vehicle in reverse
  answer: C
  explanation: The three-point turn must be performed without hitting the curb, driving
    off the road surface, or using a side street or driveway.
- id: 143
  category: defensive_driving
  question: Before moving again after stopping at an intersection, in which order
    should you look for crossing traffic?
  choices:
    A: Right, then left, and right again
    B: Left, then right, and left again
    C: Straight ahead, then left, then right
    D: In the rearview mirror, then left, then right
  answer: B
  explanation: Before entering the intersection, you should always look left, then
    right, and left again.
- id: 144
  category: defensive_driving
  question: Why should you not turn into a lane just because an approaching vehicle
    has its turn signal active?
  choices:
    A: Turn signals are often difficult to see in daylight
    B: The driver may plan to turn after passing you or may have forgotten to turn
      the signal off
    C: Approaching vehicles always have the right-of-way to turn first
    D: It is illegal to turn while another vehicle's signal is flashing
  answer: B
  explanation: Do not turn into a lane just because an approaching vehicle has a turn
    signal active. The driver may plan to turn after they go past your vehicle or
    may have forgotten to turn the signal off from a prior turn.
- id: 145
  category: safe_driving_rules
  question: How does a Diverging Diamond Interchange (DDI) differ from a conventional
    interchange?
  choices:
    A: It requires all vehicles to stop at a four-way stop sign
    B: It shifts cross street traffic to the left side of the street between signalized
      crossover intersections
    C: It uses a large circular roundabout instead of traffic lights
    D: It restricts all left turns onto the interstate
  answer: B
  explanation: The primary difference between a DDI and a conventional interchange
    is the design of the directional crossovers, which shifts cross street traffic
    to the left side of the street between the signalized crossover intersections.
- id: 146
  category: safe_driving_rules
  question: What is a primary benefit of a Diverging Diamond Interchange (DDI)?
  choices:
    A: It allows vehicles to travel at highway speeds through the intersection
    B: It eliminates the need for left-turning vehicles to cross the paths of approaching
      through vehicles
    C: It provides a dedicated lane for pedestrians and bicyclists
    D: It allows drivers to bypass traffic signals entirely
  answer: B
  explanation: By shifting cross street traffic to the left side, the DDI eliminates
    the need for left-turning vehicles to cross the paths of approaching through vehicles,
    significantly reducing vehicle-to-vehicle conflict points.
- id: 147
  category: safe_driving_rules
  question: What maneuver is required for drivers on a cross street approaching a
    Restricted Crossing U-turn (RCUT) intersection?
  choices:
    A: Proceed straight across the intersection.
    B: Turn left directly onto the main road.
    C: Turn right onto the main road and then make a u-turn.
    D: Yield and merge into the left lane.
  answer: C
  explanation: The RCUT intersection eliminates left-turn and through movements from
    cross street approaches, requiring drivers to turn right onto the main road and
    then make a u-turn maneuver at a one-way median opening.
- id: 148
  category: safe_driving_rules
  question: In what direction does traffic travel around the raised center island
    of a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a straight line
    D: In a figure-eight pattern
  answer: B
  explanation: A roundabout is a circular intersection where vehicles travel counterclockwise
    around a raised center island.
- id: 149
  category: defensive_driving
  question: Why are roundabouts considered safer than traditional intersections?
  choices:
    A: They allow vehicles to travel at higher speeds.
    B: They eliminate head-on and high-speed right angle collisions.
    C: They require all vehicles to come to a complete stop before entering.
    D: They have multiple traffic signals to control flow.
  answer: B
  explanation: According to the manual, roundabouts are safer than traditional intersections
    because they eliminate head-on and high-speed right angle collisions.
- id: 150
  category: sharing_the_road
  question: What must you do when approaching a school bus that is stopped with its
    red lights flashing and stop arm extended on a two-lane highway?
  choices:
    A: Slow down to 15 mph and pass cautiously.
    B: Stop only if children are visible.
    C: Stop for the entire time the bus is stopped or preparing to stop.
    D: Honk your horn to alert children before passing.
  answer: C
  explanation: You must stop for the entire time a school bus is stopped or preparing
    to stop with its red or amber lights flashing or its stop arm extended, which
    is required on any two-lane highway.
- id: 151
  category: sharing_the_road
  question: Under which condition are you NOT required to stop for a stopped school
    bus?
  choices:
    A: When you are traveling behind the bus on a four-lane highway.
    B: When you are traveling in the opposite direction on a multi-lane highway with
      at least two lanes in each direction.
    C: When you are on a two-lane road and the bus is approaching from the opposite
      direction.
    D: When you are attempting to pass the bus while its amber signals are flashing.
  answer: B
  explanation: A driver does not have to stop upon meeting a stopped school bus when
    traveling in the opposite direction on a multi-lane highway or multi-lane private
    road (defined as having at least two traffic lanes in each direction).
- id: 152
  category: safe_driving_rules
  question: When parking along a roadway, what is the maximum distance your vehicle
    can be from the curb or edge of the pavement?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: When parking along the roadway, you must not park more than 18 inches
    from the curb or edge of pavement.
- id: 153
  category: driver_responsibility
  question: Who is legally allowed to park a vehicle in a designated space for people
    with disabilities?
  choices:
    A: Anyone driving a vehicle with a disability license plate, regardless of passengers.
    B: Anyone who is running a quick errand and will only be parked for a few minutes.
    C: Only the person whose name is on the disability placard registration, or someone
      transporting them.
    D: Any elderly driver over the age of 65.
  answer: C
  explanation: Vehicles displaying a disability license plate or placard may park
    in designated spaces only if that vehicle is driven by or transporting the person
    with the disability whose name is on the license plate registration or placard
    registration certificate.
- id: 154
  category: safe_driving_rules
  question: Which way should you turn your steering wheel when parking headed downhill,
    with or without a curb?
  choices:
    A: To the left
    B: To the right
    C: Keep the wheels straight
    D: Toward the center of the street
  answer: B
  explanation: When parking headed downhill, with or without a curb, you should turn
    your wheels to the right (except when parking left on a one-way street).
- id: 155
  category: safe_driving_rules
  question: How should you position your wheels when parking headed uphill with a
    curb?
  choices:
    A: Turn the wheels to the right.
    B: Keep the wheels perfectly straight.
    C: Turn the wheels to the center of the street with the back of the front tire
      against the curb.
    D: Turn the wheels to the right so the vehicle rolls off the road if brakes fail.
  answer: C
  explanation: When headed uphill with a curb, you should turn your wheels to the
    center of the street with the back of the front tire against the curb.
- id: 156
  category: vehicle_information
  question: If you are parking a vehicle with a manual transmission on a hill, which
    gear should the vehicle be set in?
  choices:
    A: Neutral
    B: Second or third gear
    C: First or reverse
    D: Overdrive
  answer: C
  explanation: When parking on a hill, for a manual transmission, the car should be
    set in first or reverse.
- id: 157
  category: safe_driving_rules
  question: How should you check your 'blind spots' before changing lanes?
  choices:
    A: By looking at your rearview mirror.
    B: By checking your side mirrors.
    C: By turning your head and looking over your shoulder in the direction you plan
      to move.
    D: By activating your turn signal and waiting for a honk.
  answer: C
  explanation: Checking your blind spots is done by turning your head and looking
    over your shoulder in the direction you plan to move.
- id: 158
  category: safe_driving_rules
  question: What is the proper use of the acceleration lane when entering a multi-lane
    highway?
  choices:
    A: To come to a complete stop and wait for a gap in traffic.
    B: To reach the speed of other vehicles before pulling onto the roadway.
    C: To pass slower vehicles that are already on the highway.
    D: To drive at a reduced speed until you merge.
  answer: B
  explanation: You should use the acceleration lane to reach the speed of other vehicles
    before pulling onto the roadway.
- id: 159
  category: safe_driving_rules
  question: When exiting a roadway, where should you adjust your speed to match the
    posted ramp speed?
  choices:
    A: While still in the main travel lane.
    B: After you have completely exited the ramp.
    C: In the deceleration lane.
    D: On the shoulder of the highway.
  answer: C
  explanation: When exiting a roadway, you should maintain your vehicle speed as long
    as you are on the main roadway, then move to the deceleration lane, check for
    the posted speed, and adjust your speed accordingly.
- id: 160
  category: safe_driving_rules
  question: On multi-lane roads, which lane is designated to be used for passing slower
    vehicles?
  choices:
    A: The right-most lane
    B: The left-most lane
    C: The shoulder
    D: The deceleration lane
  answer: B
  explanation: On multi-lane roads, the left-most lane is to be used for passing slower
    vehicles.
- id: 161
  category: safe_driving_rules
  question: Under what circumstances is it permissible to pass another vehicle on
    the shoulder of the road?
  choices:
    A: When the vehicle ahead is turning left.
    B: When the shoulder is paved.
    C: When traffic is backed up and you are exiting soon.
    D: Never; the shoulder is not for through traffic.
  answer: D
  explanation: Never pass on the shoulder, whether it is paved or not. The shoulder
    is an emergency stopping lane and not for through traffic.
- id: 162
  category: safe_driving_rules
  question: How far in advance should you signal your intentions before passing another
    vehicle?
  choices:
    A: At least 50 feet
    B: 100 feet or more
    C: At least 200 feet
    D: 500 feet or more
  answer: B
  explanation: The manual states that when it is safe to pass, you should signal your
    intentions 100 feet or more before passing.
- id: 163
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to return to your original
    lane?
  choices:
    A: When you are parallel to the other vehicle
    B: When you can see the complete front of the passed vehicle in your rearview
      mirror
    C: Immediately after passing their front bumper
    D: When you are 50 feet ahead of the passed vehicle
  answer: B
  explanation: You should continue to pass until the complete front of the passed
    vehicle is visible in your rearview mirror before signaling and steering smoothly
    back into the lane.
- id: 164
  category: defensive_driving
  question: What should you do when another vehicle is passing you?
  choices:
    A: Speed up to prevent them from passing
    B: Move onto the shoulder of the road
    C: Maintain a constant speed and stay in your lane
    D: Brake hard to let them pass quickly
  answer: C
  explanation: When being passed, you should stay in your lane, maintain a constant
    speed to allow the driver to pass, and be on guard.
- id: 165
  category: safe_driving_rules
  question: What is the recommended procedure for a Zipper Merge when you see a 'lane
    closed ahead' sign and traffic is backing up?
  choices:
    A: Merge immediately into the open lane as soon as you see the sign
    B: Stay in your current lane until the point of merge, then take turns easing
      into the open lane
    C: Drive on the shoulder to bypass the traffic
    D: Stop your vehicle and wait for a large gap in the open lane
  answer: B
  explanation: Zipper merging involves staying in your current lane of traffic until
    you reach the point of merge, then taking turns with other drivers to safely ease
    into the open lane.
- id: 166
  category: defensive_driving
  question: Which of the following is a benefit of using the Zipper Merge in heavy
    traffic?
  choices:
    A: It increases the speed of the closed lane
    B: It reduces the overall length of traffic backup by as much as 40%
    C: It allows faster drivers to bypass slower traffic
    D: It eliminates the need to use turn signals
  answer: B
  explanation: The Zipper Merge benefits drivers by reducing the overall length of
    traffic backup by as much as 40%, among other benefits like reducing congestion
    and road rage.
- id: 167
  category: defensive_driving
  question: Ideally, how far ahead should you try to look down your planned path of
    travel?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: 45 to 60 seconds
  answer: C
  explanation: Ideally, you should try to look at what is occurring 20 to 30 seconds
    in front of your vehicle to give yourself time to adjust and plan your driving
    movements.
- id: 168
  category: safe_driving_rules
  question: When should you reduce your speed for a curve?
  choices:
    A: Before entering the curve
    B: While at the apex of the curve
    C: After you begin to lose traction
    D: Only when exiting the curve
  answer: A
  explanation: Always reduce speed before entering a curve to a safe speed. Hard braking
    after entry to a curve could cause the vehicle tires to lose traction.
- id: 169
  category: safe_driving_rules
  question: What causes hydroplaning?
  choices:
    A: Driving too slowly on a wet road
    B: The steering tires riding on a layer of water on top of the road surface
    C: Hard braking on a dry surface
    D: Driving with underinflated tires on gravel
  answer: B
  explanation: Hydroplaning occurs when the steering tires ride on a layer of water
    on top of the road surface, similar to the action of water skis.
- id: 170
  category: defensive_driving
  question: According to the manual, what can happen if you drive through six inches
    of water?
  choices:
    A: It will wash away the underlying road surface
    B: It will reach the bottom of most passenger cars, causing loss of control or
      stalling
    C: It will carry away most sport utility vehicles
    D: It will clean the undercarriage of your vehicle safely
  answer: B
  explanation: Remember, six inches of water will reach the bottom of most passenger
    cars, causing loss of control or possible stalling.
- id: 171
  category: defensive_driving
  question: How much moving water does it take to carry away most vehicles, including
    SUVs and pick-up trucks?
  choices:
    A: Six inches
    B: One foot
    C: Two feet
    D: Three feet
  answer: C
  explanation: Two feet of moving water can carry away most vehicles, including sport
    utility vehicles and pick-up trucks.
- id: 172
  category: safe_driving_rules
  question: 'Total stopping distance is affected by perception time, reaction time,
    and:'
  choices:
    A: Acceleration distance
    B: Braking distance
    C: Following distance
    D: Visual search time
  answer: B
  explanation: 'Several things may affect your stopping distance: Speed, your perception
    time, your reaction time, and braking distance.'
- id: 173
  category: driver_responsibility
  question: What is the average reaction time for an alert driver to move their foot
    from the gas pedal and begin applying the brakes?
  choices:
    A: 1/4 to 1/2 second
    B: 3/4 to 1 second
    C: 1.5 to 2 seconds
    D: 3 to 4 seconds
  answer: B
  explanation: The average driver has a reaction time of 3/4 second to 1 second to
    react by moving their foot from the gas pedal and beginning to apply the brakes.
- id: 174
  category: safe_driving_rules
  question: Under normal conditions, what is the minimum following distance you should
    keep between your vehicle and the vehicle in front of you?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: You should always try to keep a minimum following distance of 4 seconds
    between your vehicle and the vehicle in front.
- id: 175
  category: safe_driving_rules
  question: When is it NOT recommended to use the zipper merge?
  choices:
    A: When traffic is heavy and slow
    B: In a construction zone with backups
    C: When traffic is moving at highway speeds and there are no backups
    D: When a lane is closed ahead and traffic is congested
  answer: C
  explanation: When traffic is moving at highway speeds and there are no backups,
    it makes sense to move sooner to the lane that will remain open rather than using
    the zipper merge.
- id: 176
  category: safe_driving_rules
  question: In which of the following situations should you NOT attempt to pass another
    vehicle?
  choices:
    A: When the vehicle ahead is traveling below the speed limit
    B: Before a highway-railroad crossing or bridge
    C: On a multi-lane highway with clear visibility
    D: When you have signaled your intentions 100 feet in advance
  answer: B
  explanation: Do not attempt to pass when an oncoming vehicle is approaching, when
    your view is blocked by a curve or a hill, while at intersections, or before a
    highway-railroad crossing or bridge.
- id: 177
  category: safe_driving_rules
  question: What is the minimum recommended following distance under normal driving
    conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: C
  explanation: The manual states that you should maintain a minimum following distance
    of 4 seconds.
- id: 178
  category: defensive_driving
  question: In which of the following situations should you increase your following
    distance?
  choices:
    A: When driving on slippery roads.
    B: When following a motorcycle.
    C: When driving in a residential neighborhood.
    D: When passing a bicyclist.
  answer: A
  explanation: You should increase your following distance on slippery roads, at night,
    in fog, or in inclement weather.
- id: 179
  category: defensive_driving
  question: Why should you avoid driving next to other vehicles for long periods of
    time?
  choices:
    A: It decreases your fuel efficiency.
    B: You may be in their blind spot, which reduces the space you need to avoid a
      collision.
    C: It causes unnecessary wear on your tires.
    D: It is illegal on multi-lane highways.
  answer: B
  explanation: Avoid driving next to other vehicles for long periods of time because
    you may be in their blind spot, which reduces the space you may need to avoid
    a collision.
- id: 180
  category: safe_driving_rules
  question: When driving on rainy, snowy, or foggy days, what should you do to make
    your vehicle more visible?
  choices:
    A: Use your high-beam headlights and maintain your speed.
    B: Turn on your hazard lights and drive in the left lane.
    C: Use your low-beam headlights and slow down.
    D: Honk your horn periodically to warn others.
  answer: C
  explanation: On rainy, snowy, or foggy days, you should use your low-beam lights
    and slow down to help other roadway users see you.
- id: 181
  category: sharing_the_road
  question: When is it inappropriate to use your vehicle's horn?
  choices:
    A: When a driver is not paying attention.
    B: When passing a driver who starts to turn into your lane.
    C: When pedestrians appear to be moving into your lane.
    D: When you are near blind pedestrians.
  answer: D
  explanation: You should not use your horn when near blind pedestrians, as using
    it inappropriately could scare or anger another road user.
- id: 182
  category: safe_driving_rules
  question: By state law, how far in advance must you use a turn signal before changing
    lanes or turning?
  choices:
    A: 50 feet or more
    B: 100 feet or more
    C: 200 feet or more
    D: 500 feet or more
  answer: B
  explanation: It is state law that you must use a turn signal 100 feet or more before
    changing lanes, turning left or right, or when merging into traffic.
- id: 183
  category: defensive_driving
  question: What are the three primary options available to a driver to avoid a collision
    or reduce its impact?
  choices:
    A: Braking, steering, or accelerating
    B: Honking, braking, or swerving
    C: Accelerating, signaling, or braking
    D: Steering, honking, or accelerating
  answer: A
  explanation: You have three options to avoid a collision or to reduce its impact.
    These options are braking, steering, or accelerating.
- id: 184
  category: vehicle_information
  question: What is the proper technique for using an anti-lock braking system (ABS)
    in an emergency?
  choices:
    A: Pump the brakes rapidly to avoid skidding.
    B: Press on the brake pedal as hard as you can and keep applying constant pressure.
    C: Lightly tap the brakes until the vehicle comes to a complete stop.
    D: Apply the parking brake while gently pressing the brake pedal.
  answer: B
  explanation: The general guidelines for using ABS are to press on the brake pedal
    as hard as you can and keep applying constant pressure. Do not pump the brakes
    because this will deactivate ABS.
- id: 185
  category: defensive_driving
  question: What should you do first if your vehicle begins to skid?
  choices:
    A: Accelerate quickly to regain traction.
    B: Pump the brakes firmly.
    C: Release pressure from the brake or accelerator.
    D: Steer in the opposite direction of the skid.
  answer: C
  explanation: If your vehicle begins to skid, you should release pressure from the
    brake or accelerator, and look and steer where you want to go.
- id: 186
  category: defensive_driving
  question: How should you react if your vehicle's wheels leave the paved road surface
    due to an uneven drop-off?
  choices:
    A: Jerk the steering wheel sharply to return to the pavement immediately.
    B: Brake hard and stop on the shoulder.
    C: Accelerate to get the wheels back onto the pavement quickly.
    D: Slow down gradually and steer gently back onto the pavement.
  answer: D
  explanation: If your vehicle leaves the paved road surface due to an uneven surface
    drop-off, avoid panic steering. Slow down gradually when safe to do so, and steer
    gently back onto the pavement.
- id: 187
  category: vehicle_information
  question: What should you do if your brakes stop working while driving?
  choices:
    A: Shift into neutral and turn the steering wheel sharply.
    B: Pump the accelerator pedal to build brake fluid pressure.
    C: Pull on the parking brake handle or push the foot pedal slowly to avoid locking
      the rear wheels.
    D: Turn off the engine immediately while still on the roadway.
  answer: C
  explanation: In the event your brakes stop working, use the parking brake. Pull
    on the parking brake handle or push the foot pedal slowly so you will not lock
    the rear wheels and cause a skid.
- id: 188
  category: defensive_driving
  question: What is the recommended action if you experience a tire blowout while
    driving?
  choices:
    A: Brake hard immediately to stop the vehicle.
    B: Grip the steering wheel firmly, keep straight, and slow down gradually without
      braking hard.
    C: Accelerate slightly to maintain control of the vehicle.
    D: Turn the steering wheel sharply in the direction of the blowout.
  answer: B
  explanation: If a tire blows out, grip the steering wheel firmly and keep the vehicle
    going straight. Slow down gradually by taking your foot off the accelerator pedal,
    and do not brake hard.
- id: 189
  category: vehicle_information
  question: If your engine shuts off while you are driving, what should you expect
    regarding the steering wheel?
  choices:
    A: The steering wheel will lock completely and cannot be turned.
    B: The steering wheel will spin freely without resistance.
    C: The steering wheel may be difficult to turn, but it is still able to be turned.
    D: The steering wheel will automatically steer the vehicle to the right.
  answer: C
  explanation: If the engine shuts off while you are driving, keep a strong grip on
    the steering wheel. Be aware that the steering wheel may be difficult to turn,
    but it is still able to be turned.
- id: 190
  category: safe_driving_rules
  question: In which situation should you use your turn signal before reducing your
    speed?
  choices:
    A: When approaching a green traffic light.
    B: When turning off a roadway that does not have separate turning or exiting lanes.
    C: When driving up a steep hill.
    D: When accelerating to merge onto a highway.
  answer: B
  explanation: You should signal before reducing speed when turning off a roadway
    that does not have separate turning or exiting lanes, or when parking or turning
    before an intersection.
- id: 191
  category: defensive_driving
  question: How can you help keep the driver behind you at a safe following distance?
  choices:
    A: By frequently tapping your brakes.
    B: By driving slightly below the speed limit at all times.
    C: By keeping a steady speed, signaling in advance, and keeping more space to
      the front before reducing speed.
    D: By turning on your hazard lights when they get too close.
  answer: C
  explanation: You can help keep the driver behind you at a safe distance by keeping
    a steady speed, signaling in advance, and keeping more space to the front of your
    vehicle before you reduce speed or turn.
- id: 192
  category: defensive_driving
  question: What should you do with emergency flares if your vehicle breaks down on
    the highway?
  choices:
    A: Place them 50 to 100 feet behind the vehicle.
    B: Place them 200 to 300 feet behind the vehicle.
    C: Place them 500 feet in front of the vehicle.
    D: Place them directly next to the driver's door.
  answer: B
  explanation: The manual states that if you have emergency flares, you should place
    them about 200 to 300 feet behind the vehicle to give other drivers time to change
    lanes.
- id: 193
  category: safe_driving_rules
  question: What is the first step you should take if your vehicle's accelerator becomes
    stuck and the vehicle is accelerating out of control?
  choices:
    A: Shift to neutral.
    B: Turn off the engine.
    C: Apply the emergency brake firmly.
    D: Turn on your emergency flashers.
  answer: B
  explanation: If your vehicle is accelerating out of control due to a stuck accelerator,
    the first step listed in the manual is to 'Turn off the engine.'
- id: 194
  category: driver_responsibility
  question: Where can you enter your emergency contact information so that SC law
    enforcement officers can access it in an emergency?
  choices:
    A: Only in person at a local police station.
    B: Through the SCDMV's website.
    C: By writing it on the back of your driver's license.
    D: By calling your insurance company.
  answer: B
  explanation: You can enter your emergency contact information on your SCDMV record
    through the SCDMV's website at dmv.sc.gov.
- id: 195
  category: sharing_the_road
  question: 'When a pedestrian is crossing a street guided by a dog or carrying a
    white cane, you must:'
  choices:
    A: Honk your horn to let them know you are there.
    B: Slow down and proceed with caution.
    C: Come to a complete stop.
    D: Steer around them in the adjacent lane.
  answer: C
  explanation: The manual states that you must always yield the right-of-way to persons
    who are visually impaired, and when they are guided by a dog or carrying a white
    cane, you must come to a complete stop.
- id: 196
  category: sharing_the_road
  question: 'If you are making a right turn on a red light, you must:'
  choices:
    A: Be prepared to yield the right-of-way to pedestrians.
    B: Proceed without stopping if the intersection is clear of cars.
    C: Honk to warn pedestrians to stay on the curb.
    D: Only yield to pedestrians in marked crosswalks.
  answer: A
  explanation: According to the manual, 'When making a right turn on red, you must
    be prepared to yield the right-of-way to pedestrians.'
- id: 197
  category: sharing_the_road
  question: Under which of the following circumstances are you permitted to drive
    on a designated bicycle path or lane?
  choices:
    A: When traffic is backed up and you need to pass.
    B: When you are entering or leaving an alley or driveway.
    C: When you are driving a slow-moving vehicle.
    D: You are never permitted to drive in a bicycle lane.
  answer: B
  explanation: You must not drive on a designated bicycle path or lane unless you
    are entering or leaving an alley or driveway, performing official duties, directed
    by a police officer, or if an emergency situation exists.
- id: 198
  category: sharing_the_road
  question: Why should you avoid sounding your horn close to bicyclists unless there
    is a chance of a collision?
  choices:
    A: It is illegal to honk at bicycles in South Carolina.
    B: It may startle them and cause them to steer into your path.
    C: Bicyclists cannot hear horns over the wind.
    D: It will cause the bicyclist to stop abruptly.
  answer: B
  explanation: 'The manual warns: ''Sounding your horn to alert your presence may
    startle bicyclists and cause them to steer into your path resulting in a collision.'''
- id: 199
  category: sharing_the_road
  question: 'When sharing the road with a motorcycle, you should:'
  choices:
    A: Share the lane to give them more room to maneuver.
    B: Allow the motorcyclist a full lane width.
    C: Drive closely behind them to protect them from other traffic.
    D: Pass them in the same lane if they are riding near the shoulder.
  answer: B
  explanation: 'The manual explicitly states: ''Allow a motorcyclist a full lane width.
    Do not share the lane. The motorcycle needs space for the motorcyclist to react
    to other traffic.'''
- id: 200
  category: sharing_the_road
  question: Why should you wait to be sure a motorcycle is turning before proceeding,
    even if its turn signal is flashing?
  choices:
    A: Motorcycles often make wide turns.
    B: Motorcycle turn signals may not self-cancel.
    C: Motorcyclists frequently change their minds about turning.
    D: The flashing light means the motorcycle is stopping, not turning.
  answer: B
  explanation: The manual advises not to assume a motorcycle is turning because 'Motorcycle
    turn signals may not self-cancel and the motorcyclist may have forgotten to turn
    them off.'
- id: 201
  category: safe_driving_rules
  question: What is the minimum following distance you should allow when following
    a motorcyclist?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: When following a motorcyclist, you should allow for a minimum 4 second
    following distance, or more in wet conditions.
- id: 202
  category: sharing_the_road
  question: What is the 'No Zone' around commercial vehicles?
  choices:
    A: The area where commercial vehicles are prohibited from driving.
    B: The blind spots on the sides, rear, and front of commercial vehicles.
    C: The designated passing lane for large trucks.
    D: The loading and unloading zones for buses.
  answer: B
  explanation: The 'no zone' is the area around commercial vehicles where vehicles
    disappear from the commercial driver's view into blind spots located on the sides,
    rear, and front.
- id: 203
  category: sharing_the_road
  question: How can you tell if you are driving in a large truck's side blind spot?
  choices:
    A: If you are less than 50 feet behind the truck.
    B: If the truck's turn signals are flashing.
    C: If you cannot see the driver's face in the truck's side view mirror.
    D: If you are driving on the left side of the truck.
  answer: C
  explanation: 'The manual provides a rule of thumb for side No Zones: ''If you cannot
    see the driver''s face in the side view mirror, he or she cannot see you.'''
- id: 204
  category: sharing_the_road
  question: How do wet roads, sand, or gravel affect bicyclists compared to motor
    vehicles?
  choices:
    A: These conditions affect bicycles much more than vehicles.
    B: These conditions affect vehicles much more than bicycles.
    C: These conditions affect both equally.
    D: They have no effect on bicycles due to their narrow tires.
  answer: A
  explanation: The manual states to be particularly careful around bicyclists when
    the roadway is wet or covered with sand or gravel, because 'These conditions affect
    bicycles much more than vehicles.'
- id: 205
  category: defensive_driving
  question: If you are driving next to parked or stopped vehicles, what should you
    be particularly aware of regarding pedestrians?
  choices:
    A: Pedestrians will always wait for you to pass before crossing.
    B: Pedestrians can walk out between the parked vehicles.
    C: Pedestrians are not allowed to cross between parked cars.
    D: You should speed up to clear the area quickly.
  answer: B
  explanation: When driving next to parked or stopped vehicles, pedestrians can walk
    out between these vehicles. You should slow down and not pass until you are sure
    there are no pedestrians crossing.
- id: 206
  category: sharing_the_road
  question: How can you determine if a truck driver can see your vehicle while you
    are driving behind or alongside them?
  choices:
    A: If you are within 50 feet of the truck.
    B: If you can see the driver's face in their side view mirror.
    C: If you honk your horn and they wave.
    D: If you are driving in the right lane.
  answer: B
  explanation: According to the manual, if you cannot see the driver's face in the
    side view mirror, he or she cannot see you.
- id: 207
  category: sharing_the_road
  question: Under ideal conditions, what is the minimum stopping distance for a loaded
    truck with good tires and brakes traveling at 55 mph?
  choices:
    A: 150 feet
    B: 200 feet
    C: 335 feet
    D: 400 feet
  answer: C
  explanation: The manual states that a loaded truck under ideal conditions traveling
    at 55 mph requires a minimum of 335 feet before coming to a complete stop.
- id: 208
  category: sharing_the_road
  question: When passing a large vehicle, when is it safe to pull back into the lane
    in front of it?
  choices:
    A: As soon as your rear bumper clears the truck's front bumper.
    B: When you can see the whole front of the vehicle in your rear-view mirror.
    C: When the truck driver flashes their headlights.
    D: After you have maintained your speed for 5 seconds.
  answer: B
  explanation: When passing a large vehicle, you should look for the whole front of
    the vehicle in your rear-view mirror before pulling in front.
- id: 209
  category: sharing_the_road
  question: How far can the blind spot directly behind a large vehicle extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 200 feet
    D: Up to 335 feet
  answer: C
  explanation: Unlike cars, large vehicles have huge blind spots directly behind them
    that extend up to 200 feet.
- id: 210
  category: sharing_the_road
  question: Why should you avoid driving in the right lane when traveling up or down
    steep hills or near truck weigh stations?
  choices:
    A: The right lane is reserved for emergency vehicles only.
    B: Large vehicles use the right lane to drive slowly or re-enter traffic.
    C: The right lane usually ends abruptly.
    D: Speed limits are strictly enforced in the right lane.
  answer: B
  explanation: Large vehicles must drive slowly (approx. 35 mph) on steep hills and
    use the right lane. They also use the right lane to re-enter traffic from weigh
    stations. Avoiding this lane reduces the possibility of a collision.
- id: 211
  category: sharing_the_road
  question: What should you do if a truck or bus is swinging wide to the left to make
    a right turn?
  choices:
    A: Quickly pass the vehicle on the right side.
    B: Honk your horn to warn the driver of your presence.
    C: Squeeze between the truck and the curb to make your turn.
    D: Wait to turn until the truck or bus has completed its turn.
  answer: D
  explanation: If you try to get in between the truck or bus and the curb, you will
    be squeezed in-between the vehicle. To avoid a collision, do not turn until the
    truck or bus has completed its turn.
- id: 212
  category: sharing_the_road
  question: When meeting a truck coming from the opposite direction, why should you
    keep as far as possible to the right side of the roadway?
  choices:
    A: To avoid a side-swept collision and reduce wind turbulence.
    B: To give the truck room to make a U-turn.
    C: To allow vehicles behind you to pass.
    D: To prepare for a sudden stop.
  answer: A
  explanation: Keep as far as possible to the right side of the roadway to avoid a
    side-swept collision and to reduce the wind turbulence between the two vehicles,
    which pushes the vehicles apart.
- id: 213
  category: signs_and_signals
  question: What is the purpose of stop lines at intersections?
  choices:
    A: To indicate where pedestrians should cross.
    B: To set vehicles farther back to give larger vehicles more turning space.
    C: To mark the beginning of a school zone.
    D: To show where you must yield to oncoming traffic.
  answer: B
  explanation: Stop lines help to set you farther back at an intersection to give
    larger vehicles more turning space.
- id: 214
  category: driver_responsibility
  question: What should you do immediately when you see emergency lights behind you
    indicating a traffic stop?
  choices:
    A: Stop in the middle of the road and turn off your engine.
    B: Speed up to find a well-lit parking lot.
    C: Stay calm, activate your turn signal, and pull to the side of the roadway safely.
    D: Exit your vehicle and wait for the officer.
  answer: C
  explanation: When you see emergency lights behind you, stay calm, activate your
    turn signal, and pull to the side of the roadway as soon and safely as possible.
- id: 215
  category: safe_driving_rules
  question: During a traffic stop at night, what action should you take to assist
    the law enforcement officer with visibility?
  choices:
    A: Turn your headlights to high beam.
    B: Turn on your interior lights as soon as you stop.
    C: Shine a flashlight out the window.
    D: Turn off all lights to avoid blinding the officer.
  answer: B
  explanation: If it is nighttime, to assist with visibility, turn on your interior
    lights as soon as you stop to help the officer see inside your vehicle.
- id: 216
  category: driver_responsibility
  question: If a law enforcement officer asks for your documents and they are out
    of reach, what should you do?
  choices:
    A: Quickly reach into your glove compartment to retrieve them.
    B: Tell the officer where they are and ask if you may reach for them.
    C: Refuse to provide them until the officer explains the stop.
    D: Step out of the vehicle to get them from the trunk.
  answer: B
  explanation: If the documents are out of your reach, tell the officer where they
    are and ask if you may reach for them.
- id: 217
  category: penalties_and_points
  question: In South Carolina, what does your acceptance of a traffic ticket document
    signify?
  choices:
    A: An admission of guilt.
    B: A waiver of your right to a court hearing.
    C: It is not considered an admission of guilt.
    D: An agreement to pay the fine immediately.
  answer: C
  explanation: The manual explicitly states, "Your acceptance of a traffic ticket
    document is not considered an admission of guilt."
- id: 218
  category: safe_driving_rules
  question: Under the Move-Over Law, what must you do when approaching a stopped authorized
    emergency vehicle?
  choices:
    A: Stop immediately and wait for the vehicle to leave.
    B: Maintain your speed but honk your horn.
    C: Slow down and make a lane change away from the emergency vehicle if safe.
    D: Accelerate to pass the emergency vehicle quickly.
  answer: C
  explanation: When you approach a stopped authorized emergency vehicle, you must
    slow down and yield the right-of-way by making a lane change into a lane away
    from the authorized emergency vehicle, if safety and traffic conditions permit.
- id: 219
  category: safe_driving_rules
  question: If you are approaching a stopped emergency vehicle and a lane change is
    unsafe, what is the required action?
  choices:
    A: Stop in your lane until traffic clears.
    B: Slow down and proceed with caution while maintaining a safe speed.
    C: Continue at the posted speed limit.
    D: Pull onto the shoulder of the road.
  answer: B
  explanation: If a lane change is unsafe, slow down and proceed with caution while
    maintaining a safe speed for traffic conditions.
- id: 220
  category: signs_and_signals
  question: What does a fluorescent or reflective orange and red triangle displayed
    on the rear of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is an authorized emergency vehicle.
    C: The vehicle is a slow-moving vehicle, such as farm or construction equipment.
    D: The vehicle is broken down and waiting for a tow.
  answer: C
  explanation: A fluorescent or reflective orange and red triangle displayed on the
    rear of a vehicle drawn by animals or are farm or construction equipment means
    it is a slow-moving vehicle.
- id: 221
  category: sharing_the_road
  question: When passing an animal-drawn vehicle or horseback rider, why should you
    avoid using your horn or revving your engine?
  choices:
    A: It is illegal in rural areas.
    B: It may scare the animal and cause a collision.
    C: It will cause the rider to yield the right-of-way.
    D: It violates local noise ordinances.
  answer: B
  explanation: Pass with caution and do not use your horn or 'rev' your vehicle's
    engine because this may scare the animal and cause a collision.
- id: 222
  category: safe_driving_rules
  question: At what distance must you dim your high beam headlights when an oncoming
    vehicle is approaching?
  choices:
    A: 200 feet or more
    B: 300 feet or more
    C: 400 feet or more
    D: 500 feet or more
  answer: D
  explanation: You must dim your high beams when you are 500 feet or more away from
    any oncoming vehicle.
- id: 223
  category: safe_driving_rules
  question: When following another vehicle at night, you should use your low beam
    headlights if you are within what distance of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Use your low beams when following another vehicle that is less than
    200 feet in front of you.
- id: 224
  category: defensive_driving
  question: If an oncoming vehicle comes toward you with its high beams on, where
    should you look to avoid being momentarily blinded?
  choices:
    A: Directly at the oncoming headlights
    B: Toward the center line of the road
    C: Toward the right side of the road
    D: At your rearview mirror
  answer: C
  explanation: If a vehicle comes toward you with its high beams on, glance toward
    the right side of the road to keep from being distracted or momentarily blinded
    by the vehicle's headlights.
- id: 225
  category: safe_driving_rules
  question: Which headlights should you use when driving in fog, rain, or snow?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights
    D: Hazard lights
  answer: B
  explanation: In fog, rain, or snow, use your low beams. Light from your high beams
    may cause glare and make it more difficult to see ahead.
- id: 226
  category: signs_and_signals
  question: What colors are used for work zone signs?
  choices:
    A: Yellow backgrounds with black letters
    B: Orange backgrounds with black letters or symbols
    C: White backgrounds with red letters
    D: Green backgrounds with white letters
  answer: B
  explanation: Work zone signs have orange backgrounds and black letters or symbols.
- id: 227
  category: penalties_and_points
  question: What is a possible penalty for endangering a highway worker in a work
    zone?
  choices:
    A: A mandatory 30-day jail sentence
    B: Immediate license revocation for one year
    C: A fine and points assessed against your driving record
    D: Confiscation of your vehicle
  answer: C
  explanation: If you endanger a highway worker you may be fined and have points assessed
    against your driving record.
- id: 228
  category: defensive_driving
  question: How much should you increase your following distance when driving on unfamiliar
    roadways at night?
  choices:
    A: By at least one additional second
    B: By at least two additional seconds
    C: By at least three additional seconds
    D: By at least four additional seconds
  answer: B
  explanation: Increase your following distance by adding at least one additional
    second for night driving conditions and at least two additional seconds for driving
    on unfamiliar roadways at night.
- id: 229
  category: safe_driving_rules
  question: When approaching a narrow or single-lane bridge, who generally has the
    right-of-way?
  choices:
    A: The larger vehicle
    B: The vehicle traveling at a higher speed
    C: The first driver to arrive at the bridge
    D: The vehicle traveling uphill
  answer: C
  explanation: Take turns crossing a bridge; generally, the first driver to the bridge
    has the right-of-way.
- id: 230
  category: defensive_driving
  question: Which areas of the road tend to freeze first during winter weather?
  choices:
    A: Intersections and crosswalks
    B: Bridges, overpasses, and infrequently traveled roadways
    C: Multi-lane highways
    D: Roads with heavy traffic
  answer: B
  explanation: Be especially careful on bridges, overpasses, and infrequently traveled
    roadways because they tend to freeze first.
- id: 231
  category: vehicle_information
  question: Why is it recommended to keep a full tank of gasoline during winter driving?
  choices:
    A: To increase the vehicle's top speed
    B: To prevent condensation within the gas tank, which may freeze
    C: To improve the fuel efficiency of the engine
    D: To keep the engine running hotter
  answer: B
  explanation: Keep a full tank of gasoline to prevent condensation within your gas
    tank, which may freeze.
- id: 232
  category: vehicle_information
  question: If your vehicle starts to skid and you have an Anti-lock Braking System
    (ABS), how should you apply the brakes?
  choices:
    A: Pump the brakes gently
    B: Apply steady pressure to the brakes
    C: Tap the brakes repeatedly
    D: Avoid using the brakes entirely
  answer: B
  explanation: If you have ABS, do not pump the brakes. Apply steady pressure to the
    brakes. You will feel the brakes pulse, which is normal.
- id: 233
  category: defensive_driving
  question: What should you avoid doing if your vehicle gets stuck in the snow?
  choices:
    A: Turning your wheels from side to side
    B: Using a light touch on the gas
    C: Spinning your wheels
    D: Pouring sand or cat litter in the path of the wheels
  answer: C
  explanation: If your vehicle gets stuck in the snow, do not spin your wheels. This
    will only dig the vehicle in deeper.
- id: 234
  category: vehicle_information
  question: What percentage of a trailer's cargo weight should be placed in the front,
    nearest the towing vehicle?
  choices:
    A: 40 percent
    B: 50 percent
    C: 60 percent
    D: 70 percent
  answer: C
  explanation: According to the manual, sixty percent of the cargo weight of a trailer
    should go in the front (nearest the towing vehicle) and 40 percent in the back
    to reduce the possibility of sway.
- id: 235
  category: defensive_driving
  question: What should you do if your trailer begins to sway or whip while driving?
  choices:
    A: Apply the brakes firmly to regain control
    B: Increase your speed to straighten the trailer out
    C: Steer straight and reduce speed gradually without applying the brakes
    D: Turn the steering wheel sharply in the opposite direction of the sway
  answer: C
  explanation: If the trailer begins to sway or whip, steer straight and reduce speed
    gradually; do not apply the brakes. Never increase speed.
- id: 236
  category: safe_driving_rules
  question: What is the maximum recommended speed for most vehicle-trailer combinations?
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 70 mph
  answer: B
  explanation: The maximum recommended speed for most vehicle-trailer combinations
    is 55 mph. Driving slower saves fuel and reduces your chances of losing control.
- id: 237
  category: vehicle_information
  question: When backing up a trailer, where should you place your hand on the steering
    wheel?
  choices:
    A: At the top of the steering wheel
    B: At the bottom of the steering wheel
    C: On the left side of the steering wheel
    D: On the right side of the steering wheel
  answer: B
  explanation: When backing up a trailer, go slowly. Keep your hand at the bottom
    of the steering wheel. To move the trailer left, move your hand to the left.
- id: 238
  category: defensive_driving
  question: If your trailer starts to jackknife while you are backing up, what is
    the first thing you should do?
  choices:
    A: Turn the steering wheel sharply to the right
    B: Accelerate in reverse
    C: Stop and pull ahead to straighten out
    D: Apply the emergency brake
  answer: C
  explanation: If the trailer starts to jackknife – STOP – and pull ahead to straighten
    out; then start again.
- id: 239
  category: vehicle_information
  question: 'When you begin to hook up a trailer to your vehicle, you should:'
  choices:
    A: Pause halfway through to check your tire pressure
    B: Always finish the process first without pausing to do something else
    C: Leave the safety chains disconnected until you are ready to drive
    D: Load the cargo before connecting the hitch
  answer: B
  explanation: When you begin to hook up a trailer, don’t pause or stop to do something
    else, always finish the process first.
- id: 240
  category: safe_driving_rules
  question: 'When driving a vehicle-trailer combination down a grade, you should:'
  choices:
    A: Slow down BEFORE starting down the hill
    B: Accelerate to maintain momentum
    C: Shift into neutral
    D: Apply the brakes continuously all the way down
  answer: A
  explanation: When going down a grade, slow down BEFORE starting down the hill.
- id: 241
  category: alcohol_drugs_health
  question: How do alcohol and other impairing drugs affect your driving?
  choices:
    A: They improve your ability to focus
    B: They decrease your reaction time
    C: They reduce your judgment
    D: They increase your visual acuity
  answer: C
  explanation: According to the sample knowledge test questions, alcohol and other
    impairing drugs reduce your judgment.
- id: 242
  category: signs_and_signals
  question: What does a yellow dashed line on your side of the roadway mean?
  choices:
    A: Passing is prohibited on both sides
    B: Passing is permitted on your side
    C: Passing is permitted on both sides
    D: You are approaching a no-passing zone
  answer: B
  explanation: A yellow dashed line on your side of the roadway only means passing
    is permitted on your side.
- id: 243
  category: signs_and_signals
  question: What color are regulatory signs?
  choices:
    A: Green
    B: Yellow
    C: Orange
    D: White
  answer: D
  explanation: According to the sample knowledge test questions, regulatory signs
    are white.
- id: 244
  category: sharing_the_road
  question: If a pedestrian is crossing in the middle of the street illegally (jaywalking),
    what must you do?
  choices:
    A: You do not have to stop for them
    B: You must stop for them
    C: You should honk your horn and continue driving
    D: You should swerve into the oncoming lane to avoid them
  answer: B
  explanation: Even if a pedestrian is crossing in the middle of the street, not at
    a crosswalk (also known as jaywalking), and even if it is illegal, you must stop
    for them.
- id: 245
  category: sharing_the_road
  question: 'When sharing the road with a motorcycle, you should remember that motorcycle
    operators have the right to:'
  choices:
    A: Share a traffic lane with a vehicle
    B: Use the shoulder of a roadway
    C: Use a complete traffic lane
    D: Ride on the sidewalk
  answer: C
  explanation: Motorcycle operators have the right to use a complete traffic lane.
- id: 246
  category: sharing_the_road
  question: 'When approaching or passing a bicyclist, you should:'
  choices:
    A: Speed up and quickly pass the bicyclist
    B: Sound your horn to alert your presence
    C: Drive as close to them as possible
    D: Slow down and allow as much space as possible
  answer: D
  explanation: When approaching or passing a bicyclist, you should slow down and allow
    as much space as possible.
- id: 247
  category: safe_driving_rules
  question: 'When driving at night, you should use your high beams when:'
  choices:
    A: Fog, rain, or snow is present
    B: Following another vehicle closely
    C: There is no oncoming traffic approaching
    D: Driving in a well-lit urban area
  answer: C
  explanation: When driving at night use your high beams when there is no oncoming
    traffic approaching.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 248
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 249
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 250
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 251
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 252
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 253
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 254
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 255
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 256
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 257
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 258
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 259
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 260
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 261
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 262
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 263
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 264
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 265
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 266
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 267
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 268
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 269
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 270
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 271
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 272
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 273
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 274
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 275
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 276
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 277
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 278
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 279
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
