metadata:
  source: 2025 South Carolina Driver's Manual
  total_questions: 253
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What is the minimum age to apply for a Beginner's Permit in South Carolina?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 17 years old
  answer: B
  explanation: In South Carolina, an individual must be at least 15 years old to apply
    for a Beginner's Permit.
- id: 2
  category: license_system
  question: How long must a South Carolina driver hold a Beginner's Permit before
    they can apply for a Conditional or Special Restricted license?
  choices:
    A: 90 days
    B: 120 days
    C: 180 days
    D: One year
  answer: C
  explanation: South Carolina law requires drivers to hold their Beginner's Permit
    for at least 180 days before being eligible for a license.
- id: 3
  category: license_system
  question: If you move to a new address within South Carolina, you must notify the
    SCDMV of your change of address within how many days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: South Carolina law requires you to notify the SCDMV of an address or
    name change within 10 days.
- id: 4
  category: license_system
  question: Under a South Carolina Conditional License, during Standard Time, a driver
    under 17 may not drive alone between what hours?
  choices:
    A: 10 PM and 5 AM
    B: Midnight and 6 AM
    C: 6 PM and 6 AM
    D: 8 PM and 6 AM
  answer: C
  explanation: Drivers with a Conditional License may drive alone from 6 AM to 6 PM
    during Standard Time. During Daylight Saving Time, this window extends to 8 PM.
- id: 5
  category: license_system
  question: A South Carolina Beginner's Permit holder must be accompanied by a licensed
    driver in the front seat who is at least how old?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: No age limit, just needs a license
  answer: B
  explanation: The accompanying driver must be at least 21 years old, have at least
    one year of driving experience, and be seated in the front seat.
- id: 6
  category: license_system
  question: How many points accumulated on a South Carolina driving record within
    a two-year period will result in a license suspension?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: In South Carolina, if you reach 12 points or more on your driving record,
    your driver's license will be suspended.
- id: 7
  category: license_system
  question: In South Carolina, what is the point value assigned to a conviction for
    Reckless Driving?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless Driving is a serious offense in South Carolina and carries
    a 6-point penalty against your driving record.
- id: 8
  category: license_system
  question: What is the point penalty for speeding more than 10 mph but less than
    25 mph over the posted limit in South Carolina?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: No points, just a fine
  answer: B
  explanation: Speeding more than 10 mph but less than 25 mph over the limit results
    in 4 points on your SC driving record.
- id: 9
  category: license_system
  question: If you are under 21 years of age, what is the Blood Alcohol Concentration
    (BAC) limit that will trigger an automatic license suspension in South Carolina?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: South Carolina has a 'Zero Tolerance' policy for drivers under 21;
    a BAC of 0.02% or higher results in an automatic suspension.
- id: 10
  category: license_system
  question: Which of the following is the minimum liability insurance coverage required
    in South Carolina for property damage in a single accident?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: South Carolina law requires a minimum of $25,000 for property damage
    liability.
- id: 11
  category: license_system
  question: To obtain a South Carolina driver's license, an applicant under age 18
    must complete how many hours of practice driving with a parent or legal guardian?
  choices:
    A: 30 hours (including 5 at night)
    B: 40 hours (including 10 at night)
    C: 50 hours (including 10 at night)
    D: 60 hours (including 15 at night)
  answer: B
  explanation: Applicants under 18 must certify they have had at least 40 hours of
    driving practice, including 10 hours of night driving.
- id: 12
  category: license_system
  question: If a South Carolina driver is convicted of speeding 25 mph or more over
    the limit, how many points are added to their record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Speeding 25 mph or more over the posted speed limit results in 6 points
    being added to the driver's record.
- id: 13
  category: license_system
  question: A South Carolina Special Restricted License (for 16-year-olds) allows
    driving with how many passengers under age 21 who are not family members, unless
    accompanied by a licensed adult?
  choices:
    A: None
    B: No more than two
    C: No more than three
    D: No limit
  answer: B
  explanation: Drivers with a Special Restricted or Conditional license may not transport
    more than two passengers under age 21 unless they are family members or accompanied
    by a licensed adult aged 21 or older.
- id: 14
  category: license_system
  question: What happens to the points on your South Carolina driving record after
    one year from the date of the violation?
  choices:
    A: They are completely removed
    B: They are reduced by half
    C: They stay until you take a defensive driving course
    D: They are reduced by 2 points
  answer: B
  explanation: In South Carolina, points are reduced by half after one year from the
    date of the violation.
- id: 15
  category: license_system
  question: When applying for a South Carolina license, you must provide proof of
    Social Security number, proof of residency, and what other primary document?
  choices:
    A: Proof of employment
    B: Proof of identity and citizenship/legal presence
    C: High school diploma
    D: A letter of recommendation
  answer: B
  explanation: The SCDMV requires proof of identity, US citizenship/legal presence,
    Social Security number, and two proofs of SC residency.
- id: 16
  category: license_system
  question: What is the minimum visual acuity required in at least one eye, with or
    without corrective lenses, to obtain a South Carolina driver's license?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the South Carolina Driver's Manual, an applicant must
    have at least 20/40 vision in at least one eye to pass the vision screening.
- id: 17
  category: license_system
  question: A standard South Carolina driver's license is typically valid for how
    many years before it must be renewed?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: In South Carolina, a standard Class D driver's license is issued for
    a period of eight years.
- id: 18
  category: license_system
  question: In South Carolina, by applying for a driver's license or ID card, any
    male applicant under the age of 26 is also authorizing the SCDMV to do what?
  choices:
    A: Register them for the military draft (Selective Service)
    B: Enroll them in a mandatory safety course
    C: Share their data with private insurance companies
    D: Automatically register them as an organ donor
  answer: A
  explanation: South Carolina law requires that any male US citizen or immigrant who
    is at least 18 but less than 26 years of age be registered with the Selective
    Service System when applying for a license or ID.
- id: 19
  category: license_system
  question: Under the South Carolina point system, how many points are assessed against
    your driving record for unlawfully passing a stopped school bus?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Unlawfully passing a stopped school bus is a serious offense in South
    Carolina and carries a penalty of 6 points.
- id: 20
  category: license_system
  question: How many points are added to a South Carolina driving record for the offense
    of 'Following too closely'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 0 points (fine only)
  answer: B
  explanation: Under SC Code Section 56-1-720, 'Following too closely' is a 4-point
    violation.
- id: 21
  category: license_system
  question: If you are a new resident to South Carolina and hold a valid driver's
    license from another state, how many days do you have to apply for a South Carolina
    license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: New residents have 90 days to transfer their out-of-state driver's
    license to a South Carolina license.
- id: 22
  category: license_system
  question: Which specific license class is required in South Carolina to operate
    a moped if you do not already possess a Class D, E, or F license?
  choices:
    A: Class M
    B: Class G
    C: Class C
    D: Class H
  answer: B
  explanation: South Carolina issues a Class G license specifically for the operation
    of mopeds.
- id: 23
  category: license_system
  question: If you legally change your name through marriage or court order, you must
    apply for a corrected South Carolina license within how many days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: South Carolina law requires drivers to notify the SCDMV and obtain
    a corrected license within 10 days of a legal name change.
- id: 24
  category: license_system
  question: Under South Carolina's Habitual Offender law, a driver's license will
    be revoked if they accumulate how many 'major' convictions (such as DUI or Reckless
    Driving) within a three-year period?
  choices:
    A: 2 convictions
    B: 3 convictions
    C: 5 convictions
    D: 10 convictions
  answer: B
  explanation: A Habitual Offender is defined as someone who gets 3 or more major
    convictions or 10 or more minor convictions (4 points or more) within a 3-year
    period.
- id: 25
  category: license_system
  question: In South Carolina, which license class is required to operate a non-commercial
    single vehicle with a Gross Vehicle Weight Rating (GVWR) of more than 26,000 pounds?
  choices:
    A: Class D
    B: Class E
    C: Class F
    D: Class M
  answer: B
  explanation: A Class E license is required for non-commercial single vehicles with
    a GVWR over 26,000 pounds, such as large motorhomes.
- id: 26
  category: license_system
  question: How many points are assessed against a South Carolina license for 'Failing
    to yield the right of way'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 1 point
  answer: B
  explanation: Failing to yield the right of way is a 4-point violation in South Carolina.
- id: 27
  category: license_system
  question: If you are a South Carolina resident and your vehicle is not insured,
    you may be required to pay a fee to the Uninsured Motorists Fund. How much is
    this annual fee?
  choices:
    A: No fee is allowed; insurance is mandatory
    B: $300
    C: $550
    D: $1,000
  answer: C
  explanation: South Carolina allows residents to register as an uninsured motorist
    by paying a $550 fee, though this does not provide insurance coverage; it only
    allows the vehicle to be registered.
- id: 28
  category: license_system
  question: Under the South Carolina point system, an 'Improper Turn' conviction results
    in how many points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 0 points
  answer: A
  explanation: An improper turn is categorized as a 2-point violation in South Carolina.
- id: 29
  category: license_system
  question: In South Carolina, if you are convicted of 'Operating a vehicle in a reckless
    manner,' how many points are added to your record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless driving is a 6-point offense in South Carolina.
- id: 30
  category: license_system
  question: Which of the following can lead to the suspension of your South Carolina
    driver's license even if the offense did not occur while driving?
  choices:
    A: Failure to pay child support
    B: Failure to pay property taxes on a vehicle
    C: Failure to pay South Carolina individual income taxes
    D: All of the above
  answer: D
  explanation: The SCDMV has the authority to suspend licenses for non-driving reasons
    including failure to pay child support, vehicle property taxes, and state income
    taxes.
- id: 31
  category: driver_testing
  question: Under South Carolina's Implied Consent Law, if you refuse to submit to
    a chemical test for alcohol or drugs, your driving privileges will be automatically
    suspended for how long?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: According to the South Carolina Driver's Manual, under the Implied
    Consent Law, refusal to take a breath, blood, or urine test results in an automatic
    6-month license suspension.
- id: 32
  category: driver_testing
  question: In South Carolina, what is the maximum speed limit for unpaved roads unless
    otherwise posted?
  choices:
    A: 30 mph
    B: 40 mph
    C: 45 mph
    D: 50 mph
  answer: B
  explanation: South Carolina law states that the maximum speed limit on unpaved roads
    is 40 miles per hour unless a different speed is posted.
- id: 33
  category: driver_testing
  question: In South Carolina, you must signal your intention to turn at least how
    many feet before making the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: South Carolina law requires drivers to provide a continuous signal
    for at least 100 feet before turning or changing lanes.
- id: 34
  category: driver_testing
  question: When parking near a fire hydrant in South Carolina, what is the minimum
    distance you must maintain?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: It is illegal to park within 15 feet of a fire hydrant in South Carolina.
- id: 35
  category: driver_testing
  question: In South Carolina, you must dim your high-beam headlights when you are
    within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: South Carolina law requires drivers to dim their high beams when an
    oncoming vehicle is within 500 feet to prevent blinding the other driver.
- id: 36
  category: driver_testing
  question: According to the South Carolina 'Move Over Law,' what must you do when
    approaching an emergency vehicle with flashing lights stopped on the side of a
    multi-lane highway?
  choices:
    A: Stop immediately in the roadway
    B: Maintain speed but honk your horn
    C: Move into a lane that is not next to the emergency vehicle, if safe to do so
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: The Move Over Law requires drivers to move to a non-adjacent lane or
    slow down significantly if changing lanes is unsafe when passing emergency, recovery,
    or utility vehicles.
- id: 37
  category: driver_testing
  question: 'In South Carolina, if a law enforcement officer does not investigate
    an accident, the driver must file a written report (Form FR-311) if the accident
    resulted in total property damage of at least:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: B
  explanation: If an accident is not investigated by law enforcement and results in
    injury, death, or property damage of $1,000 or more, a report must be filed with
    the SCDMV.
- id: 38
  category: driver_testing
  question: Under South Carolina law, children under what age must be secured in a
    rear-facing child passenger restraint system?
  choices:
    A: Under 1 year old
    B: Under 2 years old
    C: Under 4 years old
    D: Under 5 years old
  answer: B
  explanation: South Carolina law requires children under 2 years of age to be secured
    in a rear-facing child safety seat until the child exceeds the height or weight
    limit allowed by the manufacturer.
- id: 39
  category: driver_testing
  question: In South Carolina, it is illegal to park within how many feet of a stop
    sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Drivers are prohibited from parking within 30 feet of any flashing
    beacon, stop sign, or traffic control signal located at the side of a roadway.
- id: 40
  category: driver_testing
  question: At what speed can hydroplaning (tires losing contact with the road due
    to water) begin in South Carolina weather conditions?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Only above 65 mph
    D: At any speed over 10 mph
  answer: A
  explanation: The South Carolina Driver's Manual warns that hydroplaning can begin
    at speeds as low as 35 mph in heavy rain.
- id: 41
  category: driver_testing
  question: Under the South Carolina point system, how many points are assessed against
    your license for 'Disobeying a traffic control device' (such as a red light)?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Disobeying a traffic control device or a traffic officer's signal results
    in 4 points being added to your South Carolina driving record.
- id: 42
  category: driver_testing
  question: South Carolina law requires motorists to carry a minimum of how much liability
    insurance for bodily injury to one person in any one accident?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: The minimum liability insurance coverage required in South Carolina
    is $25,000 for bodily injury to one person.
- id: 43
  category: driver_testing
  question: In South Carolina, if you fail the road test on your first attempt, how
    long must you wait before you can take the test again?
  choices:
    A: 24 hours
    B: 2 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: According to the SCDMV, if you fail the road test, you must wait two
    days for the first retest, seven days for the second, and 30 days for any subsequent
    failures.
- id: 44
  category: driver_testing
  question: Unless otherwise posted, what is the maximum speed limit in a South Carolina
    urban district?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: In South Carolina, the statutory speed limit is 30 miles per hour in
    urban districts and residential districts unless a different limit is posted.
- id: 45
  category: driver_testing
  question: Under South Carolina law, when are you required to turn on your vehicle's
    headlights in relation to weather conditions?
  choices:
    A: Only when visibility is less than 200 feet
    B: Only after sunset
    C: Whenever your windshield wipers are in continuous use due to rain, sleet, or
      snow
    D: Only when driving on highways during a storm
  answer: C
  explanation: South Carolina law requires drivers to turn on headlights whenever
    windshield wipers are in use due to inclement weather.
- id: 46
  category: driver_testing
  question: If you have accumulated points on your South Carolina driving record,
    you may have a maximum of how many points removed by completing an approved Defensive
    Driving Course?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: Half of your current points
  answer: B
  explanation: South Carolina allows drivers to reduce their point total by 4 points
    upon successful completion of an SCDMV-approved defensive driving course once
    every three years.
- id: 47
  category: driver_testing
  question: When parking near an intersection, you must be at least how many feet
    away from a stop sign, flashing beacon, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: South Carolina law prohibits parking within 30 feet of any flashing
    beacon, stop sign, or traffic control signal located at the side of a roadway.
- id: 48
  category: driver_testing
  question: Under the South Carolina point system, how many points are assessed against
    your license for the violation of 'Driving on the wrong side of the road'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Driving on the wrong side of the road is a 4-point violation in South
    Carolina.
- id: 49
  category: driver_testing
  question: 'When following a fire truck or other fire apparatus responding to an
    alarm, South Carolina law requires you to maintain a minimum following distance
    of:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: It is illegal to follow a fire apparatus closer than 500 feet or to
    park within the block where fire apparatus has stopped in answer to a fire alarm.
- id: 50
  category: driver_testing
  question: To operate a moped on South Carolina public roads, a person must possess
    a valid driver's license or a moped license (Class G). What is the minimum age
    to apply for a Class G license?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: In South Carolina, you must be at least 15 years old to be eligible
    for a moped license (Class G).
- id: 51
  category: driver_testing
  question: To pass the South Carolina vision screening, an applicant must have a
    field of vision of at least how many degrees?
  choices:
    A: 90 degrees
    B: 110 degrees
    C: 120 degrees
    D: 140 degrees
  answer: D
  explanation: SCDMV requires applicants to have a field of vision of at least 140
    degrees to qualify for an unrestricted license.
- id: 52
  category: driver_responsibility
  question: In South Carolina, if you are involved in a traffic accident that results
    in injury or death, or property damage of $1,000 or more, and the accident is
    not investigated by a law enforcement officer, you must file a written report
    (Form FR-309) with the SCDMV within how many days?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: According to the South Carolina Driver's Manual, if an accident is
    not investigated by law enforcement and results in injury, death, or property
    damage of $1,000 or more, you must file a report with the SCDMV within 15 days.
- id: 53
  category: driver_responsibility
  question: What is the minimum South Carolina liability insurance requirement for
    bodily injury to two or more persons in any one accident?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: South Carolina law requires a minimum of $50,000 for bodily injury
    to two or more persons in any one accident.
- id: 54
  category: driver_responsibility
  question: If a South Carolina driver chooses not to carry liability insurance, they
    may pay a yearly fee to the SCDMV to drive as an 'uninsured motorist.' How much
    is this fee?
  choices:
    A: $300
    B: $500
    C: $600
    D: $1,000
  answer: C
  explanation: In South Carolina, a person may register as an uninsured motorist by
    paying a $600 annual fee, though this does not provide insurance coverage; the
    driver remains personally liable for all damages.
- id: 55
  category: driver_responsibility
  question: If your South Carolina automobile insurance is cancelled and you do not
    return your license plate to the SCDMV, you may be required to pay a reinstatement
    fee of up to how much per day?
  choices:
    A: $2
    B: $5
    C: $10
    D: $20
  answer: B
  explanation: If insurance is cancelled and the plate is not returned, South Carolina
    charges a fee of $5 per day for each day the vehicle was uninsured, up to a maximum
    of $200 for the first offense.
- id: 56
  category: driver_responsibility
  question: New residents to South Carolina must register their vehicles within how
    many days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: C
  explanation: South Carolina law requires new residents to register their vehicles
    within 45 days of moving to the state.
- id: 57
  category: driver_responsibility
  question: When selling a vehicle in South Carolina, the seller should complete which
    form to notify the SCDMV that they are no longer responsible for the vehicle?
  choices:
    A: Form FR-10
    B: Form 416 (Notice of Sale)
    C: Form DL-44
    D: Form SR-22
  answer: B
  explanation: Completing Form 416 (Notice of Sale) notifies the SCDMV of the transfer
    of ownership and protects the seller from liability for the vehicle after the
    sale.
- id: 58
  category: driver_responsibility
  question: In South Carolina, how many points can be removed from your driving record
    if you complete an SCDMV-approved defensive driving course?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: A driver may have 4 points removed from their driving record once every
    three years by completing an approved defensive driving course.
- id: 59
  category: driver_responsibility
  question: A first-offense DUI conviction in South Carolina results in a mandatory
    driver's license suspension for how long?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: A first-offense DUI conviction in South Carolina carries a mandatory
    6-month license suspension.
- id: 60
  category: driver_responsibility
  question: In South Carolina, it is illegal to have an open container of beer or
    wine in which of the following locations?
  choices:
    A: The trunk
    B: The glove compartment
    C: The passenger area
    D: A locked luggage rack
  answer: C
  explanation: South Carolina's open container law prohibits having an open container
    of beer or wine in the passenger area of a motor vehicle.
- id: 61
  category: driver_responsibility
  question: If a South Carolina driver is required to provide proof of financial responsibility
    (SR-22) following a conviction, they must usually maintain this filing for how
    many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: An SR-22 certificate of insurance is typically required to be maintained
    for 3 years following a suspension for certain violations like DUI.
- id: 62
  category: driver_responsibility
  question: If you move out of South Carolina, what must you do with your South Carolina
    license plate?
  choices:
    A: Keep it as a souvenir
    B: Transfer it to your new state
    C: Return it to the SCDMV
    D: Destroy it
  answer: C
  explanation: When you move out of state or cancel your insurance, you are required
    by law to return your South Carolina license plate to the SCDMV.
- id: 63
  category: driver_responsibility
  question: Before you can register a vehicle in South Carolina, you must first pay
    what to your county treasurer?
  choices:
    A: A registration fee
    B: Personal property tax
    C: An inspection fee
    D: A road use tax
  answer: B
  explanation: In South Carolina, you must pay the personal property tax on your vehicle
    to the county in which you reside before you can register it with the SCDMV.
- id: 64
  category: driver_responsibility
  question: If you move to South Carolina from another state, how many days do you
    have to register your vehicle with the SCDMV?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: C
  explanation: New residents must register their vehicles within 45 days of establishing
    residency in South Carolina.
- id: 65
  category: driver_responsibility
  question: 'Under South Carolina''s Implied Consent Law, by driving a vehicle in
    the state, you have agreed to:'
  choices:
    A: Carry a minimum of $100,000 in insurance
    B: Submit to chemical tests of your breath, blood, or urine for alcohol or drugs
    C: Allow a search of your vehicle at any time
    D: Maintain a clean driving record for at least five years
  answer: B
  explanation: The Implied Consent Law means that by operating a motor vehicle in
    SC, you consent to testing if an officer suspects you are driving under the influence.
- id: 66
  category: driver_responsibility
  question: If a South Carolina driver is involved in an accident, which form is used
    by the investigating officer to verify insurance coverage?
  choices:
    A: FR-10
    B: SR-22
    C: DL-123
    D: SCDMV-447
  answer: A
  explanation: The FR-10 (Insurance Verification) form is given to drivers at the
    scene of an accident. The driver must have their insurance company complete it
    and return it to the SCDMV.
- id: 67
  category: driver_responsibility
  question: If you sell or transfer your vehicle in South Carolina, what must you
    do with the license plates?
  choices:
    A: Leave them on the vehicle for the new owner
    B: Destroy them immediately
    C: Remove them and return them to an SCDMV office or transfer them to another
      vehicle
    D: Keep them as a souvenir without notifying the state
  answer: C
  explanation: License plates are the property of the state. When a vehicle is sold,
    the plates must be removed and either returned to the SCDMV or transferred to
    another vehicle you own.
- id: 68
  category: driver_responsibility
  question: In South Carolina, how many points are assessed against your driving record
    for 'Failing to give a signal' or 'Giving an improper signal'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: A
  explanation: According to the South Carolina point system, failing to signal or
    giving an improper signal results in 2 points.
- id: 69
  category: driver_responsibility
  question: If your South Carolina driver's license is suspended because of a lapse
    in insurance coverage, what is the reinstatement fee for a first offense?
  choices:
    A: $50
    B: $100
    C: $200
    D: $400
  answer: C
  explanation: The reinstatement fee for a license suspended due to insurance cancellation/lapse
    is $200 in South Carolina.
- id: 70
  category: driver_responsibility
  question: 'A South Carolina driver who is convicted of a first-offense DUI with
    a BAC of 0.15% or higher faces a mandatory license suspension of:'
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A first-offense DUI conviction in South Carolina results in a 6-month
    suspension, regardless of whether the BAC was 0.08% or 0.15% (though higher BACs
    carry stiffer criminal penalties).
- id: 71
  category: driver_responsibility
  question: 'If you are involved in an accident with an unattended vehicle and cannot
    locate the owner, you must leave a note and:'
  choices:
    A: Wait for 24 hours before leaving
    B: Report the accident to the appropriate police authority
    C: Take a photo and do nothing else
    D: Only report it if the damage is over $5,000
  answer: B
  explanation: South Carolina law requires you to leave a note with your information
    and contact the police immediately if you hit an unattended vehicle.
- id: 72
  category: driver_responsibility
  question: If you are required to file an SR-22 (Financial Responsibility) certificate
    in South Carolina, how long must you typically maintain this proof of insurance?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: In South Carolina, drivers required to provide proof of financial responsibility
    (SR-22) must usually maintain it for 3 years.
- id: 73
  category: safe_driving_rules
  question: Under South Carolina law, you must not park within how many feet of a
    fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: South Carolina law prohibits parking a vehicle within 15 feet of a
    fire hydrant.
- id: 74
  category: safe_driving_rules
  question: 'In South Carolina, you are required by law to turn on your headlights
    whenever you are using your:'
  choices:
    A: Windshield wipers continuously due to rain or snow
    B: Hazard lights
    C: Turn signals
    D: Cruise control
  answer: A
  explanation: South Carolina law requires that headlights be turned on when windshield
    wipers are in use as a result of rain, sleet, or snow.
- id: 75
  category: safe_driving_rules
  question: 'In South Carolina, a driver may turn left on a red light ONLY when:'
  choices:
    A: Turning from a two-way street onto a one-way street
    B: Turning from a one-way street onto another one-way street
    C: The intersection is clear of all traffic
    D: It is after midnight and no other cars are present
  answer: B
  explanation: South Carolina law allows a left turn on red only when turning from
    a one-way street onto another one-way street, after coming to a complete stop
    and yielding to traffic and pedestrians.
- id: 76
  category: safe_driving_rules
  question: If you are involved in a traffic accident in South Carolina resulting
    in injury or property damage of ________ or more, you must file a written report
    (Form FR-311) with the SCDMV if the officer does not.
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: South Carolina law requires a written report to be filed if an accident
    results in bodily injury, death, or total property damage to an apparent extent
    of $1,000 or more.
- id: 77
  category: safe_driving_rules
  question: When following another vehicle at night in South Carolina, you must dim
    your high beams when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Drivers in South Carolina must dim their high beams when following
    another vehicle within 200 feet.
- id: 78
  category: safe_driving_rules
  question: How many points are assessed against your South Carolina driving record
    for a conviction of 'Littering' from a motor vehicle?
  choices:
    A: 0 points
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: In South Carolina, a conviction for littering from a motor vehicle
    results in 2 points being added to your driving record.
- id: 79
  category: safe_driving_rules
  question: When approaching a railroad crossing, you must stop within how many feet
    of the nearest rail?
  choices:
    A: Between 5 and 25 feet
    B: Between 10 and 30 feet
    C: Between 15 and 50 feet
    D: Exactly 20 feet
  answer: C
  explanation: South Carolina law requires drivers to stop between 15 and 50 feet
    from the nearest rail at a railroad crossing when signals are flashing or a train
    is approaching.
- id: 80
  category: safe_driving_rules
  question: 'In South Carolina, it is illegal to follow a fire truck or other emergency
    vehicle responding to an alarm closer than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Drivers are prohibited from following a fire apparatus traveling in
    response to a fire alarm closer than 500 feet.
- id: 81
  category: safe_driving_rules
  question: When turning or changing lanes in South Carolina, you must signal at least
    how many feet before the intended maneuver?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Drivers in South Carolina are required to signal their intention to
    turn or change lanes at least 100 feet before the move.
- id: 82
  category: safe_driving_rules
  question: In South Carolina, you are prohibited from passing another vehicle when
    you are within how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: It is illegal to pass another vehicle within 100 feet of an intersection
    or a railroad grade crossing in South Carolina.
- id: 83
  category: safe_driving_rules
  question: On a highway with four or more lanes, when a school bus is stopped with
    its red lights flashing and stop arm extended, which drivers must stop?
  choices:
    A: Only drivers traveling in the same direction as the bus
    B: All drivers in all lanes and directions
    C: Only drivers in the lane directly behind the bus
    D: Only drivers traveling in the opposite direction
  answer: A
  explanation: In South Carolina, on a highway with four or more lanes, only traffic
    following the bus must stop. Traffic traveling in the opposite direction does
    not have to stop, though they should slow down and use caution.
- id: 84
  category: safe_driving_rules
  question: 'South Carolina law requires you to turn on your headlights whenever you
    use your windshield wipers due to rain, sleet, or snow, and also from:'
  choices:
    A: One hour after sunset to one hour before sunrise
    B: Sunset to sunrise
    C: A half-hour after sunset to a half-hour before sunrise
    D: 9:00 PM to 6:00 AM
  answer: C
  explanation: South Carolina law requires headlights to be on from a half-hour after
    sunset to a half-hour before sunrise, and whenever windshield wipers are in use.
- id: 85
  category: safe_driving_rules
  question: In South Carolina, you may not park your vehicle within how many feet
    of a crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Parking is prohibited within 20 feet of a crosswalk at an intersection
    in South Carolina.
- id: 86
  category: safe_driving_rules
  question: When parallel parking in South Carolina, your wheels must be within how
    many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: South Carolina law requires that when parallel parked, the vehicle's
    wheels must be within 18 inches of the curb.
- id: 87
  category: safe_driving_rules
  question: In South Carolina, what is the maximum speed limit in an unposted business
    or residential district?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Unless otherwise posted, the statutory speed limit in business or residential
    districts in South Carolina is 30 mph.
- id: 88
  category: safe_driving_rules
  question: You may not park within how many feet of the entrance to a fire station
    on the same side of the street?
  choices:
    A: 15 feet
    B: 20 feet
    C: 50 feet
    D: 75 feet
  answer: B
  explanation: South Carolina law prohibits parking within 20 feet of the driveway
    entrance to any fire station on the same side of the street.
- id: 89
  category: safe_driving_rules
  question: 'When driving in heavy fog in South Carolina, you should use:'
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    moisture in the air, causing glare and reducing visibility further.
- id: 90
  category: defensive_driving
  question: According to the South Carolina Driver's Manual, what is the minimum following
    distance you should maintain behind the vehicle in front of you under ideal conditions?
  choices:
    A: One car length
    B: Two seconds
    C: Four seconds
    D: 50 feet
  answer: B
  explanation: The South Carolina Driver's Manual recommends the 'two-second rule'
    as the minimum following distance under ideal weather and road conditions.
- id: 91
  category: defensive_driving
  question: In South Carolina, at what speed can hydroplaning begin to occur in heavy
    rain?
  choices:
    A: 55 mph
    B: 45 mph
    C: 35 mph
    D: 25 mph
  answer: C
  explanation: The South Carolina Driver's Manual states that hydroplaning (where
    tires lose contact with the road and ride on water) can begin at speeds as low
    as 35 mph.
- id: 92
  category: defensive_driving
  question: 'Under South Carolina law, you must dim your high-beam headlights when
    following another vehicle within a distance of:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: South Carolina law (Section 56-5-4830) requires drivers to use low
    beams when following another vehicle within 200 feet.
- id: 93
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, the South Carolina
    Driver's Manual suggests you should look how far ahead?
  choices:
    A: 5 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: One city block only
  answer: B
  explanation: The manual advises scanning 10 to 15 seconds ahead of your vehicle
    to identify potential hazards early.
- id: 94
  category: defensive_driving
  question: If you are blinded by the high-beam headlights of an oncoming vehicle
    in South Carolina, where should you look to maintain your lane?
  choices:
    A: At the center line of the road
    B: Directly at the oncoming lights
    C: Toward the right edge of the road
    D: Close your eyes momentarily
  answer: C
  explanation: If blinded by oncoming high beams, the SC manual recommends looking
    toward the right edge of the road or the white line to avoid being fully blinded
    and to stay in your lane.
- id: 95
  category: defensive_driving
  question: 'If your vehicle starts to skid on a slippery South Carolina road, you
    should:'
  choices:
    A: Brake hard immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Turn the steering wheel in the direction the back of the vehicle is skidding
    D: Accelerate to gain traction
  answer: C
  explanation: To recover from a skid, you should take your foot off the gas and turn
    the steering wheel in the direction the rear of the vehicle is sliding.
- id: 96
  category: defensive_driving
  question: If your brakes stop working while driving, what is the first defensive
    action you should take according to the SC manual?
  choices:
    A: Turn off the engine immediately
    B: Shift to neutral
    C: Pump the brake pedal several times
    D: Jump out of the car
  answer: C
  explanation: If your brakes fail, you should first try pumping the brake pedal to
    build up pressure. If that fails, use the parking brake and shift to a lower gear.
- id: 97
  category: defensive_driving
  question: 'In South Carolina, when you are following a large truck, you should increase
    your following distance to:'
  choices:
    A: Allow the truck driver to see you in their side mirrors
    B: Prevent the truck from rolling backward into you
    C: Ensure you can see the truck's front bumper
    D: Both A and B
  answer: D
  explanation: Increasing following distance behind a truck ensures you are not in
    their 'No-Zone' (blind spot) and provides a buffer if the truck rolls back on
    an incline.
- id: 98
  category: defensive_driving
  question: What is the 'Move Over Law' requirement in South Carolina when approaching
    an emergency vehicle with flashing lights on the shoulder?
  choices:
    A: Stop completely in the lane
    B: Maintain speed but honk your horn
    C: Move into an adjacent lane if safe, or reduce speed significantly
    D: Only move over if the emergency vehicle is in your lane
  answer: C
  explanation: South Carolina's Move Over Law requires drivers to move to an adjacent
    lane if possible, or slow down significantly if changing lanes is unsafe when
    passing emergency vehicles.
- id: 99
  category: defensive_driving
  question: 'If you experience a tire blowout while driving on a South Carolina highway,
    you should:'
  choices:
    A: Hit the brakes hard to stop quickly
    B: Hold the steering wheel firmly and keep the vehicle straight
    C: Immediately turn onto the shoulder
    D: Accelerate to keep the tire from shredding
  answer: B
  explanation: In a blowout, you should grip the wheel firmly, take your foot off
    the gas, and let the vehicle slow down gradually before pulling off the road.
    Sudden braking can cause a loss of control.
- id: 100
  category: defensive_driving
  question: When entering a curve in South Carolina, when is the safest time to slow
    down?
  choices:
    A: While you are in the middle of the curve
    B: Just as you are exiting the curve
    C: Before you enter the curve
    D: Only if you feel the tires sliding
  answer: C
  explanation: Defensive driving practice dictates slowing down before entering a
    curve to maintain traction and control throughout the turn.
- id: 101
  category: defensive_driving
  question: 'South Carolina law requires motorists to turn on their headlights whenever
    they are using their:'
  choices:
    A: Hazard lights
    B: Windshield wipers
    C: Turn signals
    D: Air conditioning
  answer: B
  explanation: Under South Carolina law, drivers must turn on their headlights when
    windshield wipers are in use due to rain, sleet, or snow.
- id: 102
  category: defensive_driving
  question: To practice proper defensive driving in South Carolina, how far ahead
    should you scan the road for potential hazards?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: Scanning 10 to 15 seconds ahead allows you to see hazards early and
    provides enough time to adjust your speed or position safely.
- id: 103
  category: defensive_driving
  question: When driving in heavy fog in South Carolina, which lights should you use
    to ensure the best visibility?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the moisture
    in the air, causing glare and making it harder for you to see.
- id: 104
  category: defensive_driving
  question: When approaching an intersection in South Carolina, what is the correct
    scanning sequence to ensure safety?
  choices:
    A: Right, Left, Right
    B: Left, Right, Left
    C: Straight, Left, Right
    D: Left, Straight, Right
  answer: B
  explanation: You should look left, then right, then left again before entering an
    intersection, as vehicles from the left are closer to your path of travel.
- id: 105
  category: defensive_driving
  question: If your South Carolina vehicle is equipped with an Anti-lock Braking System
    (ABS) and you need to stop quickly, how should you apply the brakes?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure without pumping
    C: Lightly tap the brakes
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should press the brake pedal firmly and hold it. Pumping
    the brakes will deactivate the ABS system's effectiveness.
- id: 106
  category: defensive_driving
  question: 'To check your blind spots before changing lanes in South Carolina, you
    should:'
  choices:
    A: Check your rearview mirror only
    B: Check your side mirrors only
    C: Turn your head and look over your shoulder
    D: Rely on your car's blind-spot monitor only
  answer: C
  explanation: Mirrors do not show everything. You must turn your head and perform
    a shoulder check to see vehicles in your blind spots before changing lanes.
- id: 107
  category: defensive_driving
  question: During a South Carolina rainstorm, when are the roads most slippery?
  choices:
    A: After it has been raining for several hours
    B: Just as the rain stops
    C: During the first few minutes of rain
    D: Only when the temperature is below freezing
  answer: C
  explanation: Roads are most slippery during the first few minutes of rain because
    the water mixes with oil and grease on the pavement that hasn't washed away yet.
- id: 108
  category: defensive_driving
  question: In South Carolina, you must have your headlights turned on during which
    of the following times?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From a half-hour after sunset to a half-hour before sunrise
    D: Only when it is completely dark
  answer: C
  explanation: South Carolina law states that headlights must be on from a half-hour
    after sunset until a half-hour before sunrise, and any other time visibility is
    less than 500 feet.
- id: 109
  category: alcohol_drugs_health
  question: Under South Carolina's Implied Consent Law, by driving a vehicle in the
    state, you have agreed to take a chemical test for alcohol or drugs. What is the
    penalty for a first-time refusal to take this test?
  choices:
    A: A fine of $500 and 30 days in jail
    B: Automatic suspension of your driver's license for six months
    C: Automatic suspension of your driver's license for 90 days
    D: A permanent revocation of your driving privileges
  answer: B
  explanation: According to South Carolina's Implied Consent Law (Section 56-5-2950),
    if you refuse to submit to a chemical test, your license will be automatically
    suspended for at least six months for a first offense.
- id: 110
  category: alcohol_drugs_health
  question: In South Carolina, a person 21 years of age or older is considered to
    be driving under the influence (DUI) if their Blood Alcohol Concentration (BAC)
    is at or above what level?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In South Carolina, the legal limit for Blood Alcohol Concentration
    (BAC) for drivers 21 and older is 0.08%.
- id: 111
  category: alcohol_drugs_health
  question: If you are convicted of a first-offense DUI in South Carolina with a BAC
    of less than 0.10%, what is the maximum possible jail sentence?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: For a first-offense DUI conviction in South Carolina with a BAC of
    less than 0.10%, the penalty includes a fine of $400 (plus court costs) or imprisonment
    for 48 hours to 30 days.
- id: 112
  category: alcohol_drugs_health
  question: Under Emma's Law in South Carolina, a first-time DUI offender is required
    to install an Ignition Interlock Device (IID) if their BAC was at or above what
    level?
  choices:
    A: 0.08%
    B: 0.12%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: Emma's Law requires first-time DUI offenders with a BAC of 0.15% or
    higher to install an Ignition Interlock Device (IID) in their vehicle to regain
    driving privileges.
- id: 113
  category: alcohol_drugs_health
  question: According to South Carolina's open container law, where is it legal to
    keep an open container of beer or wine in a motor vehicle?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: In the trunk or luggage area
    D: In the center console
  answer: C
  explanation: South Carolina law prohibits open containers of beer or wine in a motor
    vehicle except in the trunk or luggage area. It is illegal to have an open container
    in the passenger area.
- id: 114
  category: alcohol_drugs_health
  question: If your South Carolina driver's license is suspended for a DUI conviction,
    what program must you complete before you can apply for reinstatement?
  choices:
    A: The South Carolina Defensive Driving Course
    B: The Alcohol and Drug Safety Action Program (ADSAP)
    C: The Victim Impact Panel
    D: The Driver Improvement Clinic
  answer: B
  explanation: South Carolina law requires anyone convicted of DUI or whose license
    is suspended under the Implied Consent Law to complete the Alcohol and Drug Safety
    Action Program (ADSAP) before they can get their license back.
- id: 115
  category: alcohol_drugs_health
  question: When alcohol is consumed, which of the following is typically the first
    ability to be impaired?
  choices:
    A: Vision and hearing
    B: Muscle coordination
    C: Judgment and decision-making
    D: Balance and speech
  answer: C
  explanation: Judgment is the first faculty affected by alcohol. A driver's ability
    to assess risks and make safe decisions is compromised long before physical coordination
    is lost.
- id: 116
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with other drugs, such as prescription
    medications or illegal substances?
  choices:
    A: The effects of the drug are canceled out by the alcohol
    B: The alcohol prevents the drug from entering the bloodstream
    C: It creates a synergistic effect, making the impairment much worse than either
      alone
    D: There is no significant change in impairment levels
  answer: C
  explanation: Mixing alcohol and drugs creates a synergistic effect, meaning the
    combined impact on the central nervous system is greater than the sum of the individual
    effects, leading to severe impairment.
- id: 117
  category: alcohol_drugs_health
  question: If a driver under the age of 21 is caught with a BAC of 0.02% or higher,
    their license will be suspended for how long for a first offense?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: Under South Carolina's Zero Tolerance law, a driver under 21 with a
    BAC of 0.02% or higher will have their license suspended for 3 months for a first
    offense.
- id: 118
  category: alcohol_drugs_health
  question: 'In South Carolina, a ''Felony DUI'' occurs when a driver under the influence
    causes an accident that results in:'
  choices:
    A: Property damage exceeding $5,000
    B: The death of another person or great bodily injury
    C: A high-speed chase with law enforcement
    D: Damage to a state-owned vehicle
  answer: B
  explanation: A Felony DUI in South Carolina is a serious charge applied when a person
    driving under the influence causes great bodily injury or death to another person.
- id: 119
  category: alcohol_drugs_health
  question: Can you be convicted of DUI in South Carolina if you are driving under
    the influence of a legally prescribed medication?
  choices:
    A: No, as long as you have a valid prescription
    B: No, DUI only applies to alcohol and illegal drugs
    C: Yes, if the medication impairs your ability to drive safely
    D: Only if you also have alcohol in your system
  answer: C
  explanation: South Carolina law states that it is unlawful to drive while under
    the influence of any substance—including prescription or over-the-counter drugs—that
    impairs your ability to operate a vehicle safely.
- id: 120
  category: alcohol_drugs_health
  question: Which of the following is the only effective way to reduce your Blood
    Alcohol Concentration (BAC) after drinking?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time for your body to process the alcohol
  answer: D
  explanation: Time is the only factor that will lower BAC. The body processes alcohol
    at a steady rate (roughly one standard drink per hour), and coffee, showers, or
    food do not speed up this process.
- id: 121
  category: alcohol_drugs_health
  question: If you are convicted of DUI in South Carolina, you will be required to
    provide proof of financial responsibility for how many years?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: Drivers convicted of DUI in South Carolina must file an SR-22 certificate
    (proof of financial responsibility) with the SCDMV for three years.
- id: 122
  category: alcohol_drugs_health
  question: 'If you have a medical condition that may affect your ability to drive,
    such as epilepsy or diabetes, you must:'
  choices:
    A: Stop driving immediately and surrender your license
    B: Report the condition to the SCDMV when applying for or renewing your license
    C: Only report the condition if you are involved in an accident
    D: Keep the condition private to avoid license restrictions
  answer: B
  explanation: South Carolina requires drivers to disclose physical or mental conditions
    that may impair their ability to drive safely. The SCDMV may require a medical
    report from a physician.
- id: 123
  category: alcohol_drugs_health
  question: What is the penalty for a driver under 21 who is convicted of purchasing
    or possessing alcohol in South Carolina?
  choices:
    A: A fine only
    B: Mandatory community service only
    C: A mandatory driver's license suspension
    D: There is no penalty if they were not driving at the time
  answer: C
  explanation: In South Carolina, if a person under 21 is convicted of purchasing,
    consuming, or possessing alcohol (even if not in a vehicle), their driver's license
    will be suspended.
- id: 124
  category: alcohol_drugs_health
  question: Under South Carolina's 'Implied Consent' law, what are you agreeing to
    by operating a motor vehicle?
  choices:
    A: To maintain liability insurance at all times
    B: To give blood if you are involved in any accident
    C: To take a breath, blood, or urine test if a law enforcement officer suspects
      you are driving under the influence
    D: To allow a search of your vehicle at any time without a warrant
  answer: C
  explanation: South Carolina's Implied Consent law means that by driving on state
    roads, you have already given consent to be tested for alcohol or drugs if requested
    by an officer who has probable cause.
- id: 125
  category: alcohol_drugs_health
  question: In South Carolina, what is the automatic license suspension period for
    a first-time refusal to submit to a breathalyzer test under the Implied Consent
    law?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 1 year
  answer: B
  explanation: If you refuse to take a chemical test in South Carolina for the first
    time, your driving privileges are automatically suspended for six months.
- id: 126
  category: alcohol_drugs_health
  question: What is the mandatory program that South Carolina drivers must complete
    to reinstate their license after a DUI conviction or an Implied Consent suspension?
  choices:
    A: The South Carolina Defensive Driving Course (SCDDC)
    B: The Alcohol and Drug Safety Action Program (ADSAP)
    C: The Driver Improvement Program (DIP)
    D: The Victim Impact Panel (VIP)
  answer: B
  explanation: South Carolina law requires anyone whose license has been suspended
    for a DUI or an Implied Consent violation to complete the Alcohol and Drug Safety
    Action Program (ADSAP) before they can get their license back.
- id: 127
  category: alcohol_drugs_health
  question: According to South Carolina's 'Emma's Law,' a first-time DUI offender
    with a BAC of _____ or higher must have an Ignition Interlock Device (IID) installed
    in their vehicle.
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.12%
    D: 0.15%
  answer: D
  explanation: Emma's Law requires first-time DUI offenders in South Carolina with
    a BAC of 0.15% or higher to install an Ignition Interlock Device (IID) for six
    months.
- id: 128
  category: alcohol_drugs_health
  question: What is the minimum jail sentence for a first-offense DUI conviction in
    South Carolina if the driver's BAC was less than 0.10%?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 1 week
  answer: B
  explanation: A first-offense DUI conviction in South Carolina carries a minimum
    mandatory sentence of 48 hours in jail, which can sometimes be served as community
    service.
- id: 129
  category: alcohol_drugs_health
  question: 'If you are taking a prescription drug and a doctor has not warned you
    about driving, you should:'
  choices:
    A: Assume it is safe to drive
    B: Check the label for warnings about 'operating heavy machinery' or drowsiness
    C: Only drive if you have a passenger with you
    D: Drive only during daylight hours
  answer: B
  explanation: In South Carolina, you can be convicted of DUI even if the drug is
    legally prescribed. Always check labels for side effects like drowsiness or impaired
    judgment.
- id: 130
  category: alcohol_drugs_health
  question: To apply for a South Carolina driver's license, an individual with a history
    of seizures must typically be seizure-free for at least how long?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: South Carolina medical standards generally require a person with a
    seizure disorder to be seizure-free for 6 months before they can be cleared to
    drive.
- id: 131
  category: alcohol_drugs_health
  question: In South Carolina, if you are convicted of a DUI, how long does the violation
    stay on your driving record for the purpose of counting subsequent offenses?
  choices:
    A: 3 years
    B: 5 years
    C: 10 years
    D: Permanently
  answer: C
  explanation: South Carolina uses a 10-year 'look-back' period for DUI offenses.
    A second DUI within 10 years of the first carries much stiffer penalties.
- id: 132
  category: alcohol_drugs_health
  question: If a South Carolina driver is convicted of a first-offense DUI, their
    license is suspended for 6 months. However, they may be eligible for a 'Provisional
    License' if they meet which criteria?
  choices:
    A: They have no other license suspensions and enroll in ADSAP
    B: They only drive to and from work
    C: They pay a $5,000 fine immediately
    D: They are over the age of 25
  answer: A
  explanation: A first-time DUI offender in SC may be eligible for a provisional license
    if they held a valid license at the time of arrest, have no other suspensions,
    and enroll in the ADSAP program.
- id: 133
  category: penalties_and_points
  question: In South Carolina, how many points are assessed against your driving record
    for the violation of 'Driving too fast for conditions'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 1 point
  answer: A
  explanation: According to the South Carolina point system, 'Driving too fast for
    conditions' is a 2-point violation.
- id: 134
  category: penalties_and_points
  question: If a South Carolina driver accumulates 16 to 17 points on their driving
    record, for how long will their license be suspended?
  choices:
    A: 3 months
    B: 4 months
    C: 5 months
    D: 6 months
  answer: B
  explanation: In South Carolina, a total of 16 or 17 points results in a 4-month
    suspension of driving privileges.
- id: 135
  category: penalties_and_points
  question: A South Carolina driver can reduce their point total by 4 points by completing
    which of the following?
  choices:
    A: A written retake of the permit exam
    B: An SCDMV-approved defensive driving course
    C: One year of driving with no new violations
    D: Paying a $200 'point reduction' fee
  answer: B
  explanation: Drivers may have 4 points removed from their record by successfully
    completing an SCDMV-approved defensive driving course, provided the points were
    on the record prior to the course.
- id: 136
  category: penalties_and_points
  question: In South Carolina, what is the point value for 'Failure to signal' or
    'Giving an improper signal'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 0 points
  answer: A
  explanation: The South Carolina point system assigns 2 points for failing to signal
    or using an improper signal.
- id: 137
  category: penalties_and_points
  question: For a first-offense DUI conviction in South Carolina with a BAC between
    0.08% and 0.10%, what is the possible term of imprisonment?
  choices:
    A: No jail time, fine only
    B: 48 hours to 30 days
    C: 10 days to 90 days
    D: 30 days to 6 months
  answer: B
  explanation: A first-offense DUI conviction with a BAC of at least 0.08% but less
    than 0.10% carries a penalty of 48 hours to 30 days in jail, though public service
    can sometimes be served in lieu of jail.
- id: 138
  category: penalties_and_points
  question: What is the maximum fine for a first-offense seat belt violation in South
    Carolina?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: In South Carolina, the fine for a seat belt violation is no more than
    $25 and no court costs may be assessed.
- id: 139
  category: penalties_and_points
  question: How many points are assessed for 'Shifting lanes without safety' in South
    Carolina?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 3 points
  answer: A
  explanation: Shifting lanes without safety (improper lane change) is a 2-point violation
    in the state of South Carolina.
- id: 140
  category: penalties_and_points
  question: If you accumulate 18 to 19 points on your South Carolina driving record,
    your license will be suspended for how many months?
  choices:
    A: 4 months
    B: 5 months
    C: 6 months
    D: 12 months
  answer: B
  explanation: South Carolina law mandates a 5-month suspension for drivers who accumulate
    18 or 19 points.
- id: 141
  category: penalties_and_points
  question: In South Carolina, how many points are assessed for 'Disobedience to a
    traffic officer'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Disobedience to any officer officially officiating as such and having
    authority to direct traffic is a 4-point violation.
- id: 142
  category: penalties_and_points
  question: In South Carolina, how many points are assessed against your driving record
    for failing to dim your headlights when required?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: No points, only a fine
  answer: A
  explanation: According to the South Carolina point system, operating with improper
    lights or failing to dim lights results in 2 points being added to your driving
    record.
- id: 143
  category: penalties_and_points
  question: If you choose not to purchase liability insurance for your vehicle in
    South Carolina, what is the annual fee you must pay to the SCDMV to register as
    an uninsured motorist?
  choices:
    A: 250 dollars
    B: 400 dollars
    C: 550 dollars
    D: 600 dollars
  answer: D
  explanation: South Carolina allows owners of motor vehicles to pay a $600 annual
    uninsured motorist fee if they do not have liability insurance. This fee does
    not provide insurance protection; it only allows the vehicle to be registered.
- id: 144
  category: penalties_and_points
  question: 'In South Carolina, you must file an accident report (Form FR-309) if
    there is a personal injury, death, or property damage to any one person in the
    amount of:'
  choices:
    A: 500 dollars or more
    B: 750 dollars or more
    C: 1,000 dollars or more
    D: 2,000 dollars or more
  answer: C
  explanation: State law requires you to notify the police immediately and file a
    report if an accident results in injury, death, or property damage of $1,000 or
    more.
- id: 145
  category: penalties_and_points
  question: A South Carolina driver is considered a 'Habitual Offender' if they accumulate
    how many major convictions (such as DUI or Reckless Driving) within a three-year
    period?
  choices:
    A: 2 convictions
    B: 3 convictions
    C: 5 convictions
    D: 10 convictions
  answer: B
  explanation: Under South Carolina law, a Habitual Offender is anyone who accumulates
    three or more major convictions (like DUI, reckless driving, or driving under
    suspension) within a three-year period.
- id: 146
  category: penalties_and_points
  question: What is the fine for a first offense of violating South Carolina's law
    against texting while driving?
  choices:
    A: 25 dollars
    B: 50 dollars
    C: 100 dollars
    D: 200 dollars
  answer: A
  explanation: In South Carolina, the fine for a first offense of texting while driving
    is $25. It is a civil offense and no points are assessed against the driving record.
- id: 147
  category: penalties_and_points
  question: 'If a South Carolina driver accumulates 20 or more points, their license
    will be suspended for:'
  choices:
    A: 3 months
    B: 4 months
    C: 5 months
    D: 6 months
  answer: D
  explanation: The maximum suspension period for point accumulation in South Carolina
    is 6 months, which occurs when a driver reaches 20 or more points.
- id: 148
  category: penalties_and_points
  question: Which of the following violations results in 2 points on a South Carolina
    driving record?
  choices:
    A: Speeding 10 mph or less over the limit
    B: Reckless driving
    C: Passing a school bus
    D: Failing to yield right of way
  answer: A
  explanation: Speeding 10 mph or less over the posted limit is a 2-point violation.
    Reckless driving and passing a school bus are 6 points, and failing to yield is
    4 points.
- id: 149
  category: penalties_and_points
  question: 'In South Carolina, a first-offense DUI conviction with a Blood Alcohol
    Concentration (BAC) of 0.15% or higher requires the mandatory installation of:'
  choices:
    A: A speed governor
    B: An Ignition Interlock Device (IID)
    C: A GPS tracking unit
    D: New brake lights
  answer: B
  explanation: South Carolina law (Emma's Law) requires first-time DUI offenders with
    a BAC of 0.15% or higher to use an Ignition Interlock Device for six months.
- id: 150
  category: penalties_and_points
  question: How many points are assessed against a South Carolina driver for a 'Hit-and-run'
    involving only property damage?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: A hit-and-run conviction that results only in property damage is a
    6-point violation in South Carolina.
- id: 151
  category: penalties_and_points
  question: What is the reinstatement fee for a South Carolina driver's license that
    was suspended solely due to the accumulation of points?
  choices:
    A: 50 dollars
    B: 100 dollars
    C: 200 dollars
    D: 300 dollars
  answer: B
  explanation: To reinstate a license suspended under the point system in South Carolina,
    the driver must pay a $100 reinstatement fee to the SCDMV.
- id: 152
  category: sharing_the_road
  question: In South Carolina, when are you NOT required to stop for a school bus
    with its red lights flashing and stop arm extended?
  choices:
    A: When you are on a two-lane road traveling in the opposite direction
    B: When you are on a highway with four or more lanes and traveling in the opposite
      direction
    C: When the bus is stopped in a turn lane
    D: You must always stop for a school bus regardless of the road type
  answer: B
  explanation: According to South Carolina Code Section 56-5-2770, a driver does not
    need to stop for a school bus when traveling in the opposite direction on a multi-lane
    highway (four or more lanes), regardless of whether there is a median.
- id: 153
  category: sharing_the_road
  question: Under the South Carolina 'Move Over Law,' what is the fine for failing
    to move into an adjacent lane (if safe) when approaching a stationary emergency
    vehicle with flashing lights?
  choices:
    A: Between $50 and $100
    B: Between $100 and $250
    C: Between $300 and $500
    D: Exactly $1,000
  answer: C
  explanation: South Carolina Code Section 56-5-1538 stipulates that a person who
    violates the Move Over Law is guilty of a misdemeanor and, upon conviction, must
    be fined not less than $300 nor more than $500.
- id: 154
  category: sharing_the_road
  question: When passing a bicyclist in South Carolina, what is the minimum safe distance
    a motorist must maintain between their vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: South Carolina Code Section 56-5-3435 requires motorists to maintain
    a safe operating distance when passing a person riding a bicycle, which is defined
    as at least three feet.
- id: 155
  category: sharing_the_road
  question: In South Carolina, at what age is a motorcycle operator or passenger no
    longer legally required to wear a helmet?
  choices:
    A: 16 years of age
    B: 18 years of age
    C: 21 years of age
    D: 25 years of age
  answer: C
  explanation: South Carolina Code Section 56-5-3660 states that it is unlawful for
    any person under the age of 21 to operate or ride upon a two-wheeled motorcycle
    unless they wear a protective helmet approved by the Department of Public Safety.
- id: 156
  category: sharing_the_road
  question: What must a driver do in South Carolina when approaching a pedestrian
    carrying a white cane or using a guide dog?
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Wait for the pedestrian to signal you to pass
    D: Drive around them at a distance of at least 10 feet
  answer: B
  explanation: South Carolina Code Section 56-5-3200 requires drivers to take all
    necessary precautions to avoid injury to any pedestrian guided by a dog or carrying
    a white cane (with or without a red tip).
- id: 157
  category: sharing_the_road
  question: 'When an emergency vehicle with sirens and flashing lights is approaching
    from behind, South Carolina law requires you to:'
  choices:
    A: Stop immediately in your lane
    B: Speed up to get out of the way
    C: Pull to the right edge of the road and stop
    D: Pull to the left edge of the road and stop
  answer: C
  explanation: South Carolina law requires drivers to yield the right-of-way by pulling
    to the right-hand edge or curb of the highway, clear of any intersection, and
    stopping until the emergency vehicle has passed.
- id: 158
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' What are these?
  choices:
    A: Areas where trucks are not allowed to drive
    B: Blind spots where the truck driver cannot see you
    C: Speed-restricted zones for heavy vehicles
    D: Parking areas reserved for tractor-trailers
  answer: B
  explanation: The South Carolina Driver's Manual defines 'No-Zones' as the large
    blind spots around a truck (front, rear, and sides) where the driver's visibility
    is limited and accidents are more likely to occur.
- id: 159
  category: sharing_the_road
  question: 'For a first offense of unlawfully passing a stopped school bus in South
    Carolina, the fine can be as high as:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Under South Carolina Code Section 56-5-2770, a first offense for unlawfully
    passing a stopped school bus carries a fine of not less than $1,000 nor more than
    $2,000, or imprisonment for 30 days.
- id: 160
  category: sharing_the_road
  question: 'When riding a bicycle at night in South Carolina, the bicycle must be
    equipped with a lamp on the front that emits a white light visible from a distance
    of at least:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: South Carolina Code Section 56-5-3470 requires that every bicycle used
    at night must be equipped with a lamp on the front which emits a white light visible
    from a distance of at least 500 feet.
- id: 161
  category: sharing_the_road
  question: 'If you are unable to move into an adjacent lane when approaching a stationary
    emergency vehicle on a South Carolina highway, you must:'
  choices:
    A: Maintain your speed but honk your horn
    B: Slow down to a safe speed for the conditions
    C: Stop completely in your current lane
    D: Turn on your hazard lights and maintain speed
  answer: B
  explanation: Under the South Carolina Move Over Law, if a lane change is not possible
    or safe, the driver must reduce speed to a safe speed for the circumstances and
    in a manner that does not endanger emergency personnel.
- id: 162
  category: sharing_the_road
  question: Is 'lane splitting' (operating a motorcycle between rows of stopped or
    moving vehicles in the same lane) legal in South Carolina?
  choices:
    A: Yes, it is legal at speeds under 20 mph
    B: Yes, it is legal on all multi-lane highways
    C: No, it is illegal
    D: Only if the motorcycle is air-cooled
  answer: C
  explanation: South Carolina Code Section 56-5-3640 prohibits motorcycle operators
    from overtaking and passing in the same lane occupied by the vehicle being overtaken
    and prohibits operating a motorcycle between lanes of traffic.
- id: 163
  category: sharing_the_road
  question: In South Carolina, if there are no sidewalks, where should a pedestrian
    walk?
  choices:
    A: On the right shoulder, with the flow of traffic
    B: On the left shoulder, facing oncoming traffic
    C: In the center of the lane
    D: On whichever side has more shade
  answer: B
  explanation: South Carolina Code Section 56-5-3160 states that where sidewalks are
    not provided, any pedestrian walking along and upon a highway shall, when practicable,
    walk only on the left side of the roadway or its shoulder facing traffic which
    may approach from the opposite direction.
- id: 164
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the driver may:'
  choices:
    A: Turn from the left lane
    B: Swing wide to the left before turning right
    C: Stay as close to the curb as possible
    D: Stop and wait for all traffic to clear both streets
  answer: B
  explanation: Because of their length, large trucks often need to swing wide to the
    left to make a right turn without the rear wheels hitting the curb or other objects.
- id: 165
  category: sharing_the_road
  question: According to South Carolina law, bicyclists may ride no more than ______
    abreast on a roadway.
  choices:
    A: Two
    B: Three
    C: Four
    D: Single file only
  answer: A
  explanation: South Carolina Code Section 56-5-3430 states that persons riding bicycles
    upon a roadway shall not ride more than two abreast except on paths or parts of
    roadways set aside for the exclusive use of bicycles.
- id: 166
  category: sharing_the_road
  question: According to the South Carolina Move Over Law, what must you do when approaching
    a stationary emergency vehicle with flashing lights on a highway with at least
    two lanes traveling in the same direction?
  choices:
    A: Stop completely until the emergency vehicle leaves.
    B: Maintain your speed but move into the lane closest to the emergency vehicle.
    C: Move into a lane that is not adjacent to the emergency vehicle, if it is safe
      to do so.
    D: Increase your speed to pass the emergency vehicle as quickly as possible.
  answer: C
  explanation: SC Code § 56-5-1538 requires drivers to move into a lane not adjacent
    to the stationary emergency vehicle if the highway has at least two lanes in that
    direction and it is safe to do so. If not safe, the driver must slow down.
- id: 167
  category: sharing_the_road
  question: In South Carolina, motorcycle operators and passengers are required by
    law to wear a helmet if they are under what age?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: SC Code § 56-5-3660 requires any person under the age of 21 who operates
    or rides upon a two-wheeled motorcycle to wear a protective helmet approved by
    the Department of Public Safety.
- id: 168
  category: sharing_the_road
  question: 'When following a large commercial truck, if you cannot see the truck
    driver''s side-view mirrors, you are:'
  choices:
    A: In the truck's 'No-Zone' (blind spot).
    B: In a safe drafting position to save fuel.
    C: In the truck driver's clear line of sight.
    D: Required to turn on your high-beam headlights.
  answer: A
  explanation: Large trucks have significant blind spots known as 'No-Zones.' If you
    cannot see the driver's mirrors, the driver cannot see you, increasing the risk
    of a collision.
- id: 169
  category: sharing_the_road
  question: Under South Carolina law, what must a driver do when a pedestrian is crossing
    the street guided by a dog or carrying a white cane (with or without a red tip)?
  choices:
    A: Honk to let them know you are there.
    B: Take the right-of-way if the light is green.
    C: Stop and take necessary precautions to avoid injuring the pedestrian.
    D: Slow down and drive around them closely.
  answer: C
  explanation: SC Code § 56-5-3200 mandates that drivers must take all necessary precautions
    to avoid injury to a blind or partially blind pedestrian carrying a white cane
    or using a guide dog.
- id: 170
  category: sharing_the_road
  question: What is the specific fine range for a first-time violation of the South
    Carolina Move Over Law that does not result in injury?
  choices:
    A: Between $10 and $25
    B: Between $50 and $100
    C: Between $300 and $500
    D: Exactly $1,000
  answer: C
  explanation: SC Code § 56-5-1538 specifies that a person who violates the Move Over
    Law is guilty of a misdemeanor and, upon conviction, must be fined not less than
    $300 nor more than $500.
- id: 171
  category: sharing_the_road
  question: In South Carolina, are bicyclists permitted to ride on the state's interstate
    highway system?
  choices:
    A: Yes, if they stay on the shoulder.
    B: Yes, but only during daylight hours.
    C: No, it is prohibited by law.
    D: Only if they are in a group of five or more.
  answer: C
  explanation: Bicycles are generally prohibited from using fully controlled-access
    highways (interstates) in South Carolina for safety reasons.
- id: 172
  category: sharing_the_road
  question: Which of the following is true regarding 'lane splitting' (operating between
    lanes of traffic) for motorcycles in South Carolina?
  choices:
    A: It is legal when traffic is moving slower than 15 mph.
    B: It is legal only on multi-lane highways.
    C: It is illegal in South Carolina.
    D: It is encouraged to reduce traffic congestion.
  answer: C
  explanation: SC Code § 56-5-3640 states that no person shall operate a motorcycle
    between lanes of traffic or between adjacent lines or rows of vehicles.
- id: 173
  category: sharing_the_road
  question: If you are following a fire apparatus (fire truck) responding to an alarm
    in South Carolina, what is the minimum following distance you must maintain?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: SC Code § 56-5-1960 prohibits following a fire apparatus traveling
    in response to a fire alarm closer than 500 feet.
- id: 174
  category: sharing_the_road
  question: Under South Carolina law, what right-of-way privilege is granted to a
    funeral procession?
  choices:
    A: They must obey all traffic signals like any other vehicle.
    B: The procession has the right-of-way at intersections if the lead vehicle entered
      lawfully.
    C: They only have the right-of-way if escorted by police.
    D: They must yield to all pedestrians but not to other vehicles.
  answer: B
  explanation: SC Code § 56-5-3150 states that a funeral procession has the right-of-way
    at an intersection regardless of traffic control devices if the lead vehicle entered
    the intersection lawfully.
- id: 175
  category: sharing_the_road
  question: 'A slow-moving vehicle emblem is a triangular orange sign. In South Carolina,
    this emblem must be displayed on vehicles designed to travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The slow-moving vehicle emblem (orange triangle with a red border)
    is required on vehicles designed to operate at speeds of 25 mph or less, such
    as farm machinery.
- id: 176
  category: vehicle_information
  question: According to South Carolina law, when must you have your headlights turned
    on?
  choices:
    A: Only between the hours of 10:00 PM and 6:00 AM
    B: Whenever you use your windshield wipers due to inclement weather
    C: Only when driving on rural highways
    D: Only when it is raining hard enough to pull over
  answer: B
  explanation: South Carolina law requires that headlights be turned on from a half-hour
    after sunset to a half-hour before sunrise, and at any time when windshield wipers
    are in use due to rain, sleet, or snow.
- id: 177
  category: vehicle_information
  question: What is the minimum legal tread depth for tires on a passenger vehicle
    in South Carolina?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: South Carolina law mandates that tires must have at least 2/32 (or
    1/16) of an inch of tread depth to be considered safe and legal for operation.
- id: 178
  category: vehicle_information
  question: South Carolina law requires every motor vehicle to have a mirror that
    allows the driver to see the highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Every motor vehicle must be equipped with a mirror so located as to
    reflect to the driver a view of the highway for a distance of at least 200 feet
    to the rear.
- id: 179
  category: vehicle_information
  question: 'Under South Carolina law, a vehicle''s horn must be audible under normal
    conditions from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: South Carolina vehicle equipment regulations state that a horn must
    be capable of emitting sound audible under normal conditions from a distance of
    not less than 200 feet.
- id: 180
  category: vehicle_information
  question: What is the maximum legal window tint darkness allowed on the side windows
    of a vehicle in South Carolina?
  choices:
    A: Must allow at least 20% of light in
    B: Must allow at least 27% of light in
    C: Must allow at least 32% of light in
    D: Must allow at least 50% of light in
  answer: B
  explanation: South Carolina law requires that window tinting on the front, side,
    and rear windows must allow at least 27% light transmission.
- id: 181
  category: vehicle_information
  question: In South Carolina, the service (foot) brake must be capable of stopping
    a vehicle traveling at 20 mph within how many feet?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 40 feet
  answer: C
  explanation: South Carolina equipment standards require that the foot brake must
    be able to stop the vehicle within 30 feet when traveling at a speed of 20 mph.
- id: 182
  category: vehicle_information
  question: If a load extends more than ____ feet beyond the rear of a vehicle in
    South Carolina, a red flag or red light must be attached to the end of the load.
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Whenever a load extends more than four feet beyond the bed or body
    of a vehicle, a red flag (during the day) or a red light (at night) must be displayed
    at the end of the load.
- id: 183
  category: vehicle_information
  question: 'Turn signals on a vehicle in South Carolina must be visible from a distance
    of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: South Carolina law requires that signal lamps used to indicate a turn
    must be visible from a distance of at least 100 feet in normal sunlight.
- id: 184
  category: vehicle_information
  question: Which of the following is true regarding exhaust systems in South Carolina?
  choices:
    A: Muffler cutouts or bypasses are legal for highway use
    B: Every vehicle must have a muffler in good working order to prevent excessive
      noise
    C: Exhaust systems are not inspected or regulated in SC
    D: Loud exhaust is permitted if the vehicle is over 20 years old
  answer: B
  explanation: South Carolina law requires every motor vehicle to be equipped with
    a muffler in good working order to prevent excessive or unusual noise and annoying
    smoke. Muffler cutouts or bypasses are illegal.
- id: 185
  category: vehicle_information
  question: 'In South Carolina, you must turn on your headlights if you cannot see
    persons or vehicles on the highway clearly at a distance of:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Headlights are required in South Carolina whenever visibility is reduced
    to 500 feet or less due to insufficient light or unfavorable atmospheric conditions.
- id: 186
  category: vehicle_information
  question: 'The rear license plate on a vehicle in South Carolina must be illuminated
    so that it is clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: South Carolina law requires a white light to illuminate the rear registration
    plate so that it is clearly legible from a distance of 50 feet to the rear.
- id: 187
  category: vehicle_information
  question: Which of the following equipment is NOT required on all passenger vehicles
    in South Carolina?
  choices:
    A: A working speedometer
    B: Windshield wipers
    C: Fog lights
    D: A rearview mirror
  answer: C
  explanation: While windshield wipers, mirrors, and speedometers are standard safety
    requirements, fog lights are optional equipment and not mandated by South Carolina
    law for all vehicles.
- id: 188
  category: vehicle_information
  question: In South Carolina, what is the penalty for a first offense of driving
    a vehicle that is not covered by the required liability insurance?
  choices:
    A: A $5.00 per day fine and license suspension
    B: Mandatory 30 days in jail
    C: Permanent loss of vehicle registration
    D: There is no penalty if you were not at fault in an accident
  answer: A
  explanation: If you are caught driving without insurance in South Carolina, you
    face a $5.00 per day fine for each day the vehicle was uninsured, and your driver's
    license and registration will be suspended until a $600 reinstatement fee is paid
    and insurance is obtained.
- id: 189
  category: vehicle_information
  question: Under South Carolina law, what is the minimum percentage of light transmission
    allowed for window tinting on the side and rear windows of a passenger car?
  choices:
    A: 20%
    B: 27%
    C: 32%
    D: 35%
  answer: B
  explanation: South Carolina law (Section 56-5-5015) prohibits window tinting that
    reduces light transmission to less than 27%.
- id: 190
  category: vehicle_information
  question: 'Regarding braking systems, South Carolina law requires that every motor
    vehicle must have a parking brake system that is able to:'
  choices:
    A: Stop the car within 30 feet at 20 mph
    B: Hold the vehicle on any grade on which it is operated
    C: Function automatically if the foot brake fails
    D: Only be used when parking on a hill
  answer: B
  explanation: SC Code Section 56-5-4850 specifies that the parking brake must be
    adequate to hold the vehicle on any grade on which it is operated, under all conditions
    of loading.
- id: 191
  category: vehicle_information
  question: 'South Carolina law requires every motor vehicle to be equipped with a
    mirror so located as to reflect to the driver a view of the highway for a distance
    of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: SC Code Section 56-5-4990 requires a rearview mirror that provides
    a view of at least 200 feet to the rear of the vehicle.
- id: 192
  category: vehicle_information
  question: 'Under South Carolina’s Child Passenger Protection Act, children must
    be secured in a rear-facing child safety seat until they are at least:'
  choices:
    A: 1 year old
    B: 2 years old
    C: 3 years old
    D: 4 years old
  answer: B
  explanation: South Carolina law requires children to be in a rear-facing car seat
    until they are at least 2 years of age or have outgrown the seat's height and
    weight limits.
- id: 193
  category: vehicle_information
  question: In South Carolina, a child must be secured in a belt-positioning booster
    seat until they meet which of the following criteria?
  choices:
    A: They are at least 6 years old
    B: They are at least 8 years old or at least 4 feet 9 inches tall
    C: They weigh at least 60 pounds
    D: They are at least 10 years old
  answer: B
  explanation: SC Code Section 56-5-6410 states children must use a booster seat until
    they are 8 years old or reach a height of 4 feet 9 inches.
- id: 194
  category: vehicle_information
  question: What is the civil fine for violating South Carolina's law requiring headlights
    to be on when windshield wipers are in use?
  choices:
    A: No fine, just a warning
    B: $25
    C: $100
    D: $200
  answer: B
  explanation: A violation of the 'wipers on, lights on' law in South Carolina is
    a civil offense punishable by a fine of $25.
- id: 195
  category: vehicle_information
  question: 'South Carolina law requires that every motor vehicle must be equipped
    with a muffler in good working order to prevent:'
  choices:
    A: Any visible smoke
    B: Excessive or unusual noise and annoying smoke
    C: Carbon dioxide emissions
    D: Engine overheating
  answer: B
  explanation: SC Code Section 56-5-5020 requires mufflers to prevent 'excessive or
    unusual noise and annoying smoke.' Muffler cutouts or bypasses are illegal.
- id: 196
  category: signs_and_signals
  question: In South Carolina, what does a flashing yellow traffic light signify?
  choices:
    A: Stop and wait for the light to turn green
    B: Proceed with caution
    C: The light is about to turn red
    D: Yield to all traffic coming from the right only
  answer: B
  explanation: According to the South Carolina Driver's Manual, a flashing yellow
    light means you should slow down and proceed with caution.
- id: 197
  category: signs_and_signals
  question: Which sign shape is used exclusively for 'No Passing' zones in South Carolina
    and is placed on the left side of the road?
  choices:
    A: Diamond
    B: Rectangle
    C: Pennant
    D: Pentagon
  answer: C
  explanation: A pennant-shaped sign is used to mark the beginning of a no-passing
    zone and is uniquely placed on the left side of the road to be visible to drivers
    attempting to pass.
- id: 198
  category: signs_and_signals
  question: Under South Carolina law, when are you allowed to turn left at a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: Whenever there is no oncoming traffic
    D: Only between the hours of 12:00 AM and 5:00 AM
  answer: B
  explanation: In South Carolina, a left turn on red is permitted only when turning
    from a one-way street onto another one-way street after coming to a complete stop
    and yielding to traffic and pedestrians.
- id: 199
  category: signs_and_signals
  question: In South Carolina, what do double solid yellow lines in the center of
    the roadway indicate?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is prohibited from either direction
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines indicate that passing is prohibited for traffic
    moving in both directions.
- id: 200
  category: signs_and_signals
  question: According to the South Carolina Driver's Manual, what is the proper hand
    signal to indicate a right turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals in South Carolina, the driver
    should extend their left arm out the window and bend it upward at the elbow.
- id: 201
  category: signs_and_signals
  question: 'When approaching a school bus with its red lights flashing and stop arm
    extended on a multi-lane highway (four or more lanes) in South Carolina, you must
    stop if:'
  choices:
    A: You are traveling in the opposite direction of the bus
    B: You are traveling in the same direction as the bus
    C: You are on any part of the highway, regardless of direction
    D: The bus is stopped at a designated intersection only
  answer: B
  explanation: SC Code Section 56-5-2770 states that on a highway with four or more
    lanes, a driver does not need to stop for a school bus if they are traveling in
    the opposite direction. However, drivers traveling in the same direction as the
    bus must always stop.
- id: 202
  category: signs_and_signals
  question: In South Carolina, a round-shaped sign is used specifically for which
    of the following?
  choices:
    A: Yield signs
    B: School zones
    C: Railroad advance warning
    D: Stop signs
  answer: C
  explanation: A circular (round) sign is used almost exclusively for railroad advance
    warning to alert drivers that they are approaching a railroad crossing.
- id: 203
  category: signs_and_signals
  question: What does a solid white line painted across a lane at an intersection
    represent in South Carolina?
  choices:
    A: A crosswalk for pedestrians only
    B: A stop line, indicating where to stop for a sign or signal
    C: A lane divider for HOV vehicles
    D: A parking boundary
  answer: B
  explanation: A solid white line across a lane is a stop line. It shows drivers where
    to stop their vehicle when required by a stop sign or traffic signal.
- id: 204
  category: signs_and_signals
  question: In South Carolina, what is the meaning of a pentagon-shaped sign?
  choices:
    A: No Passing Zone
    B: Hospital ahead
    C: School Zone or School Crossing
    D: Public Park ahead
  answer: C
  explanation: A five-sided (pentagon) sign indicates a school zone or a school crossing.
- id: 205
  category: signs_and_signals
  question: In South Carolina, what does a steady yellow 'X' signal above a reversible
    lane mean?
  choices:
    A: The lane is open for all traffic
    B: You should move out of this lane as soon as possible because the signal is
      about to change to a red X
    C: The lane is reserved for emergency vehicles only
    D: You may use the lane for left turns only
  answer: B
  explanation: A steady yellow 'X' over a lane means the direction of the lane is
    changing and you should safely move out of that lane.
- id: 206
  category: signs_and_signals
  question: What is the standard color for regulatory signs, such as those indicating
    speed limits or 'No Parking', in South Carolina?
  choices:
    A: Yellow
    B: Orange
    C: White with black letters
    D: Green
  answer: C
  explanation: Regulatory signs, which inform drivers of laws and regulations, are
    typically rectangular and white with black letters or symbols.
- id: 207
  category: signs_and_signals
  question: If you are approaching an intersection and the traffic signal light changes
    from green to yellow, what should you do according to South Carolina guidelines?
  choices:
    A: Speed up to clear the intersection before it turns red
    B: Stop if you can do so safely
    C: Stop immediately, even if you are in the middle of the intersection
    D: Honk your horn and proceed
  answer: B
  explanation: A steady yellow light means the signal is about to turn red. You should
    stop if you can do so safely; otherwise, proceed with caution through the intersection.
- id: 208
  category: signs_and_signals
  question: In South Carolina, what does a diamond-shaped orange sign signify?
  choices:
    A: General warning of road hazards
    B: Construction or maintenance work zone
    C: Directional guidance to state parks
    D: Upcoming rest area
  answer: B
  explanation: Orange signs are used specifically for construction and maintenance
    work zones to alert drivers to workers and changing road conditions.
- id: 209
  category: signs_and_signals
  question: What do broken white lines on a South Carolina roadway indicate?
  choices:
    A: Traffic is moving in opposite directions; passing is allowed
    B: The edge of the roadway
    C: Traffic is moving in the same direction; lane changes are permitted when safe
    D: A pedestrian crosswalk is ahead
  answer: C
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    Crossing these lines to change lanes is permitted when it is safe to do so.
- id: 210
  category: signs_and_signals
  question: In South Carolina, when you are at a red light and intend to turn right,
    which of the following is true?
  choices:
    A: You may turn right without stopping if no traffic is coming.
    B: You must wait for the light to turn green before turning right.
    C: You may turn right after coming to a complete stop and yielding to pedestrians
      and other traffic, unless a sign prohibits it.
    D: You may only turn right on red if there is a police officer directing traffic.
  answer: C
  explanation: According to the South Carolina Driver's Manual, drivers may turn right
    on a red light after coming to a complete stop and yielding to traffic and pedestrians,
    provided there is no sign posted that says 'No Turn on Red'.
- id: 211
  category: signs_and_signals
  question: If your vehicle's turn signals are not working, what is the correct South
    Carolina hand signal to indicate you are slowing down or stopping?
  choices:
    A: Arm extended straight out the window.
    B: Arm extended upward at a 90-degree angle.
    C: Arm extended downward with the palm facing backward.
    D: Waving your arm in a circular motion.
  answer: C
  explanation: To signal a stop or a decrease in speed using hand signals in South
    Carolina, the driver should extend their left arm downward with the palm of the
    hand facing to the rear.
- id: 212
  category: signs_and_signals
  question: What is the correct hand signal to indicate a right turn in South Carolina?
  choices:
    A: Left arm extended straight out.
    B: Left arm extended upward at a 90-degree angle.
    C: Left arm extended downward.
    D: Right arm extended straight out.
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out the window
    and bent upward at a 90-degree angle.
- id: 213
  category: signs_and_signals
  question: 'In South Carolina, a solid yellow line on your side of the center line
    means:'
  choices:
    A: You may pass if the road ahead is clear.
    B: You are in a construction zone.
    C: Passing is prohibited in your lane.
    D: You must slow down to 25 mph.
  answer: C
  explanation: A solid yellow line on your side of the center line indicates a 'no-passing
    zone'. You must not cross this line to pass other vehicles.
- id: 214
  category: signs_and_signals
  question: What do double solid white lines painted on the pavement indicate in South
    Carolina?
  choices:
    A: You may cross them to change lanes if it is safe.
    B: They separate traffic moving in opposite directions.
    C: Crossing the lines is prohibited.
    D: They indicate a designated parking area.
  answer: C
  explanation: Double solid white lines are used to separate lanes of traffic moving
    in the same direction where crossing the lines is prohibited.
- id: 215
  category: signs_and_signals
  question: When approaching a roundabout in South Carolina, whom must you yield the
    right-of-way to?
  choices:
    A: Traffic entering from the right.
    B: Traffic already inside the roundabout.
    C: No one; traffic inside the circle must yield to you.
    D: Only emergency vehicles.
  answer: B
  explanation: Drivers entering a roundabout must yield the right-of-way to traffic
    already circulating within the roundabout.
- id: 216
  category: signs_and_signals
  question: A pentagon-shaped (five-sided) sign is used exclusively for what purpose
    in South Carolina?
  choices:
    A: Stop signs.
    B: Yield signs.
    C: School zones or school crossings.
    D: Railroad crossings.
  answer: C
  explanation: The pentagon shape is reserved for school zones and school crossing
    signs to alert drivers to the presence of children.
- id: 217
  category: signs_and_signals
  question: Where is a pennant-shaped 'No Passing Zone' sign located on a South Carolina
    road?
  choices:
    A: On the right side of the road at the beginning of the zone.
    B: On the left side of the road at the beginning of the zone.
    C: Overhead above the center of the road.
    D: On the right side of the road at the end of the zone.
  answer: B
  explanation: The pennant-shaped 'No Passing Zone' sign is unique because it is placed
    on the left side of the road to provide additional warning to drivers who may
    be attempting to pass.
- id: 218
  category: signs_and_signals
  question: What does a steady yellow arrow signal mean in South Carolina?
  choices:
    A: You have the right-of-way to turn.
    B: The protected turning period is ending; be prepared to stop or yield.
    C: You may turn only after coming to a complete stop.
    D: Pedestrians are currently crossing.
  answer: B
  explanation: A steady yellow arrow means the 'protected' turning time is ending.
    Drivers should be prepared for the signal to turn red and must yield to any oncoming
    traffic if they continue the turn.
- id: 219
  category: signs_and_signals
  question: When approaching a railroad crossing with a 'crossbuck' sign and no other
    signals, what should you do?
  choices:
    A: Always stop, even if no train is coming.
    B: Speed up to cross the tracks quickly.
    C: Slow down, look, and listen for a train, and yield the right-of-way to any
      approaching train.
    D: Ignore the sign if you do not see a train.
  answer: C
  explanation: A crossbuck sign is a regulatory sign that requires you to yield the
    right-of-way to trains. You should slow down and be prepared to stop if a train
    is approaching.
- id: 220
  category: signs_and_signals
  question: In South Carolina, what color and shape are used for construction and
    maintenance warning signs?
  choices:
    A: Yellow diamond.
    B: Orange diamond.
    C: White rectangle.
    D: Green rectangle.
  answer: B
  explanation: Construction and maintenance warning signs in South Carolina are diamond-shaped
    and orange in color to alert drivers to work zones.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 221
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 222
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 223
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 224
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 225
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 226
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 227
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 228
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
