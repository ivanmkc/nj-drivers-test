questions:
- id: 1
  category: license_system
  question: A partir de mayo de 2025, ¿qué tipo de identificación se requerirá para
    abordar un avión en vuelos nacionales?
  choices:
    A: Una licencia de conducir estándar Clase C
    B: Una licencia de conducir o tarjeta de identificación compatible con REAL ID
    C: Una tarjeta de identificación estándar de California
    D: Una tarjeta de registro de votante
  answer: B
  explanation: El manual establece que a partir de mayo de 2025, su licencia de conducir
    o tarjeta de identificación (ID) debe ser compatible con REAL ID si la utiliza
    para abordar un avión en vuelos nacionales.
- id: 2
  category: license_system
  question: ¿Qué clase de licencia de conducir necesita la mayoría de las personas
    para conducir un vehículo de pasajeros estándar?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase M
  answer: C
  explanation: Según el manual, debe tener la licencia correcta para conducir su tipo
    de vehículo, y la mayoría de las personas necesitan una licencia de conducir Clase
    C no comercial.
- id: 3
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las tarjetas
    de identificación (ID) de California?
  choices:
    A: Le permiten conducir solo durante las horas del día.
    B: Solo se emiten a personas de 18 años o más.
    C: Le permiten conducir si está acompañado por un conductor con licencia.
    D: Se emiten con fines de identificación y no le permiten conducir.
  answer: D
  explanation: El manual especifica que las tarjetas de identificación se emiten con
    fines de identificación a personas elegibles de cualquier edad y no le permiten
    conducir.
- id: 4
  category: license_system
  question: ¿Qué edad debe tener para solicitar un permiso de instrucción si es menor
    de 18 años?
  choices:
    A: Al menos 15 años
    B: Al menos 15½ años
    C: Al menos 16 años
    D: Al menos 16½ años
  answer: B
  explanation: Si es menor de 18 años, deberá tener al menos 15½ años para solicitar
    un permiso de instrucción.
- id: 5
  category: driver_testing
  question: Si es menor de 18 años, ¿cuándo puede empezar a usar su permiso de instrucción
    para practicar la conducción?
  choices:
    A: Inmediatamente después de pasar el examen de conocimientos
    B: Después de haber tenido el permiso durante 30 días
    C: Cuando comience el entrenamiento de conducción al volante con un instructor
      que lo valide
    D: Tan pronto como su padre, madre o tutor firme el permiso
  answer: C
  explanation: Los menores deben esperar para usar su permiso de instrucción hasta
    que comiencen el entrenamiento de conducción al volante con un instructor que
    validará el permiso.
- id: 6
  category: driver_testing
  question: Si es mayor de 18 años y tiene un permiso de instrucción, ¿con quién debe
    practicar la conducción?
  choices:
    A: Cualquier conductor con licencia que tenga al menos 16 años
    B: Un conductor con licencia de California que tenga al menos 18 años
    C: Un conductor con licencia de California que tenga al menos 21 años
    D: Un conductor con licencia de California que tenga al menos 25 años
  answer: B
  explanation: Para obtener su licencia de conducir después de tener su permiso de
    instrucción, debe practicar la conducción con un conductor con licencia de California
    que tenga al menos 18 años (25 años para los menores).
- id: 7
  category: driver_testing
  question: Si es menor de 18 años, ¿quién debe supervisar sus 50 horas de práctica
    de conducción?
  choices:
    A: Un conductor con licencia de California que tenga al menos 18 años
    B: Un conductor con licencia de California que tenga al menos 21 años
    C: Un conductor con licencia de California que tenga al menos 25 años
    D: Cualquier instructor de manejo con licencia, independientemente de su edad
  answer: C
  explanation: Los menores deben practicar la conducción durante al menos 50 horas
    con un conductor con licencia de California que tenga al menos 25 años.
- id: 8
  category: driver_testing
  question: ¿Cuántas horas de práctica de conducción nocturna debe completar un menor
    antes de obtener una licencia de conducir?
  choices:
    A: 5 horas
    B: 10 horas
    C: 15 horas
    D: 20 horas
  answer: B
  explanation: De las 50 horas de práctica de conducción requeridas para los menores,
    diez horas deben ser de noche.
- id: 9
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia de conducir si es menor
    de 18 años?
  choices:
    A: 15½ años
    B: 16 años
    C: 16½ años
    D: 17 años
  answer: B
  explanation: Para obtener una licencia de conducir si es menor de 18 años, debe
    tener al menos 16 años.
- id: 10
  category: driver_testing
  question: ¿Cuánto tiempo debe tener un menor un permiso de instrucción antes de
    programar un examen de conducción al volante?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 9 meses
    D: Al menos 12 meses
  answer: B
  explanation: Los menores deben tener un permiso de instrucción de California o de
    otro estado durante al menos 6 meses (o cumplir 18 años) antes de programar un
    examen de conducción al volante.
- id: 11
  category: driver_responsibility
  question: ¿Si los padres de un menor comparten la custodia compartida, quién debe
    firmar la solicitud de la licencia de conducir para aceptar la responsabilidad
    financiera?
  choices:
    A: Solo el padre con el que el menor vive la mayor parte del tiempo
    B: Cualquiera de los padres puede firmar individualmente
    C: Ambos padres deben firmar
    D: Un juez legal debe firmar
  answer: C
  explanation: El manual establece que si sus padres o tutores comparten su custodia
    compartida, ambos deben firmar para aprobar la solicitud y aceptar la responsabilidad
    financiera.
- id: 12
  category: driver_testing
  question: ¿Qué debe llevar consigo un instructor de una escuela de manejo que un
    estudiante debería pedir ver?
  choices:
    A: Una licencia de conducir comercial especial
    B: Una tarjeta de identificación de instructor
    C: Una carta de autorización del DMV
    D: Un certificado de prueba de seguro
  answer: B
  explanation: Los instructores de educación vial y entrenamiento de conductores deben
    portar una tarjeta de identificación de instructor, y el manual le aconseja que
    pida verla.
- id: 13
  category: license_system
  question: 'Al solicitar un permiso de instrucción de Clase C, la tarifa de solicitud
    es:'
  choices:
    A: Reembolsable si reprueba el examen de conocimientos
    B: Reembolsable si cancela su solicitud
    C: No reembolsable
    D: Exenta para los solicitantes por primera vez
  answer: C
  explanation: Para solicitar un permiso de instrucción de Clase C, uno de los pasos
    es pagar una tarifa de solicitud no reembolsable.
- id: 14
  category: safe_driving_rules
  question: 'Al practicar la conducción con un permiso de instrucción, el conductor
    con licencia que supervisa debe:'
  choices:
    A: Sentarse en el asiento trasero para observar los puntos ciegos del conductor
    B: Sentarse lo suficientemente cerca como para tomar el control del vehículo si
      es necesario
    C: Seguir detrás del aprendiz en un vehículo separado
    D: Ser un instructor de manejo certificado
  answer: B
  explanation: El conductor con licencia de California que supervisa debe sentarse
    lo suficientemente cerca como para tomar el control del vehículo si es necesario.
- id: 15
  category: driver_testing
  question: ¿Cuál de los siguientes exámenes es obligatorio para solicitar un permiso
    de instrucción de Clase C?
  choices:
    A: Un examen de audición
    B: Un examen de la vista
    C: Un examen de aptitud física
    D: Un examen de un curso de conducción defensiva
  answer: B
  explanation: Para solicitar un permiso de instrucción de Clase C, debe aprobar su(s)
    examen(es) de conocimientos y aprobar un examen de la vista.
- id: 16
  category: license_system
  question: Durante los primeros 12 meses de tener una licencia de conducir provisional,
    ¿un menor no puede conducir entre qué horas?
  choices:
    A: 10 p.m. y 5 a.m.
    B: 11 p.m. y 5 a.m.
    C: Medianoche y 6 a.m.
    D: 11 p.m. y 6 a.m.
  answer: B
  explanation: Como conductor provisional, no puede conducir entre las 11 p.m. y las
    5 a.m. durante los primeros 12 meses que tenga su licencia.
- id: 17
  category: license_system
  question: 'Bajo una licencia provisional, no puede conducir con pasajeros menores
    de 20 años a menos que esté acompañado por:'
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Un conductor con licencia que tenga al menos 21 años
    C: Un conductor con licencia de California que tenga al menos 25 años
    D: Un hermano mayor de 18 años
  answer: C
  explanation: No puede conducir con pasajeros menores de 20 años, a menos que su
    padre, madre o tutor u otro conductor con licencia de California (de al menos
    25 años) viaje con usted.
- id: 18
  category: driver_testing
  question: Si un menor reprueba el examen de conocimientos, ¿cuánto tiempo debe esperar
    antes de volver a tomarlo?
  choices:
    A: 3 días
    B: 7 días
    C: 10 días
    D: 14 días
  answer: B
  explanation: Los menores deben esperar siete días para volver a tomar un examen
    de conocimientos reprobado, sin incluir el día del reprobado.
- id: 19
  category: driver_testing
  question: ¿Cuánto tiempo debe esperar un menor para volver a tomar un examen de
    manejo al volante reprobado?
  choices:
    A: 7 días
    B: 10 días
    C: 14 días
    D: 30 días
  answer: C
  explanation: Los menores deben esperar 14 días para volver a tomar un examen de
    manejo al volante reprobado, sin incluir el día del reprobado.
- id: 20
  category: vehicle_information
  question: Durante la inspección previa a la conducción para su examen al volante,
    ¿los neumáticos de su vehículo deben tener al menos cuánta profundidad de dibujo
    uniforme?
  choices:
    A: 1/16 de pulgada
    B: 1/32 de pulgada
    C: 2/32 de pulgada
    D: 1/8 de pulgada
  answer: B
  explanation: Los neumáticos deben tener al menos 1/32 de pulgada de profundidad
    de dibujo uniforme. El uso de un neumático de repuesto temporal (tipo "donut")
    no está permitido durante un examen de manejo.
- id: 21
  category: vehicle_information
  question: 'Para aprobar la inspección previa a la conducción, la bocina de su vehículo
    debe ser lo suficientemente fuerte como para ser escuchada desde una distancia
    de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La bocina debe estar diseñada para el vehículo, en condiciones de funcionamiento
    adecuadas y ser lo suficientemente fuerte como para ser escuchada desde una distancia
    de al menos 200 pies.
- id: 22
  category: driver_testing
  question: ¿Cuál de las siguientes tecnologías de seguridad del vehículo está permitido
    utilizar durante el examen de conducción al volante?
  choices:
    A: Estacionamiento en paralelo automatizado
    B: Sistemas de salida de carril
    C: Control de crucero adaptativo
    D: Cámaras de reversa (backup cameras)
  answer: D
  explanation: La tecnología de seguridad del vehículo, como las cámaras de reversa
    y los monitores de punto ciego, se pueden utilizar en el examen de conducción.
    No se permiten los sistemas avanzados de asistencia al conductor, como el estacionamiento
    en paralelo automatizado, los sistemas de salida de carril y el control de crucero
    adaptativo.
- id: 23
  category: license_system
  question: Si se muda, ¿cuántos días tiene para notificar al DMV su nueva dirección?
  choices:
    A: 5 días
    B: 10 días
    C: 14 días
    D: 30 días
  answer: B
  explanation: Si se muda, debe notificar al DMV su nueva dirección dentro de los
    diez días.
- id: 24
  category: license_system
  question: 'Si se encuentra fuera del estado y no puede renovar su licencia de conducir,
    puede solicitar una extensión de hasta:'
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Si se encuentra fuera del estado y no puede renovar su licencia, puede
    solicitar una extensión de un año de su licencia de conducir.
- id: 25
  category: alcohol_drugs_health
  question: ¿Cuál es la regla con respecto al uso de auriculares o tapones para los
    oídos mientras se conduce en California?
  choices:
    A: Se recomienda para bloquear el ruido de la carretera
    B: Es ilegal usar auriculares o tapones en ambos oídos
    C: Solo es ilegal si está escuchando música
    D: Es legal siempre que el volumen sea bajo
  answer: B
  explanation: Es ilegal usar auriculares o tapones para los oídos en ambos oídos
    mientras conduce, ya que debe ser capaz de escuchar bocinas, sirenas, motocicletas
    o el chirrido de los neumáticos.
- id: 26
  category: alcohol_drugs_health
  question: Los médicos están obligados a informar al DMV sobre los pacientes con
    condiciones médicas que puedan afectar su capacidad para conducir de manera segura
    si el paciente tiene al menos ¿qué edad?
  choices:
    A: 14 años
    B: 16 años
    C: 18 años
    D: 21 años
  answer: A
  explanation: Los médicos están obligados a informar al DMV sobre los pacientes que
    tengan al menos 14 años de edad por condiciones médicas que puedan afectar su
    capacidad para conducir de manera segura, como la pérdida del conocimiento (síncope).
- id: 27
  category: safe_driving_rules
  question: Al utilizar el método de dirección de mano sobre mano (push/pull), ¿dónde
    deben colocarse las manos en el volante?
  choices:
    A: A las 10 y las 2 en punto
    B: A las 9 y las 3 en punto o a las 8 y las 4 en punto
    C: A las 12 y las 6 en punto
    D: A las 7 y las 5 en punto
  answer: B
  explanation: Para utilizar el método de dirección de mano sobre mano, comience con
    las manos a las 9 y las 3 en punto o a las 8 y las 4 en punto.
- id: 28
  category: license_system
  question: Si un conductor provisional necesita conducir durante las horas restringidas
    por una necesidad médica, ¿qué debe llevar consigo?
  choices:
    A: Una nota firmada por su padre, madre o tutor
    B: Una nota firmada por el director de su escuela
    C: Una nota firmada por su médico con la condición médica y la fecha de recuperación
    D: Una pulsera de identificación médica
  answer: C
  explanation: Para una excepción por necesidad médica, debe llevar una nota firmada
    por su médico. La nota debe incluir su condición médica y la fecha estimada de
    recuperación.
- id: 29
  category: driver_testing
  question: ¿Cuál es la política del DMV sobre el uso de un dispositivo de grabación
    de video durante un examen de conducción al volante?
  choices:
    A: Se fomenta para fines de capacitación
    B: Se permite si el examinador lo consiente
    C: Está prohibido y debe apagarse o bloquearse
    D: Solo se permite para grabación de audio
  answer: C
  explanation: El uso de un dispositivo de grabación, incluyendo una grabadora de
    video, está prohibido durante un examen de conducción al volante. Si no se puede
    apagar o desactivar, el solicitante debe bloquearlo.
- id: 30
  category: vehicle_information
  question: Durante la inspección previa a la conducción, ¿cuántos espejos retrovisores
    debe tener su vehículo y dónde debe estar ubicado uno de ellos?
  choices:
    A: Al menos un espejo, ubicado dentro del vehículo
    B: Al menos dos espejos, con uno en el lado izquierdo del vehículo
    C: Al menos tres espejos, que cubran todos los puntos ciegos
    D: Al menos dos espejos, con uno en el lado derecho del vehículo
  answer: B
  explanation: El vehículo debe tener al menos dos espejos retrovisores. Uno de ellos
    debe estar ubicado en el lado izquierdo de su vehículo.
- id: 31
  category: safe_driving_rules
  question: ¿Cuándo es apropiado utilizar el método de dirección de manos sobre manos
    (hand-over-hand)?
  choices:
    A: Al conducir a altas velocidades en la autopista.
    B: Al girar a bajas velocidades, estacionar o cuando necesite recuperarse de un
      derrape.
    C: Al retroceder en línea recta.
    D: Al operar otros controles del vehículo.
  answer: B
  explanation: Según el manual, debe utilizar el método de dirección de manos sobre
    manos al girar a bajas velocidades, estacionar o cuando necesite recuperarse de
    un derrape.
- id: 32
  category: safe_driving_rules
  question: ¿Dónde debe colocar la mano en el volante al girar mientras retrocede?
  choices:
    A: En la posición de las 6 en punto.
    B: En la posición de las 9 en punto.
    C: En la posición de las 12 en punto.
    D: En la posición de las 3 en punto.
  answer: C
  explanation: Al girar mientras retrocede para ver hacia dónde se dirige detrás de
    usted, debe colocar la mano en la posición de las 12 en punto en el volante.
- id: 33
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe señalizar antes de cambiar de carril en una
    autopista?
  choices:
    A: Al menos 100 pies.
    B: Al menos 200 pies.
    C: Al menos tres segundos.
    D: Al menos cinco segundos.
  answer: D
  explanation: El manual establece que debe señalizar al menos cinco segundos antes
    de cambiar de carril en una autopista.
- id: 34
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de las señales de giro?
  choices:
    A: Solo necesita señalizar cuando vea otros vehículos a su alrededor.
    B: Debe señalizar incluso cuando no vea otros vehículos a su alrededor.
    C: Debe señalizar al menos 50 pies antes de girar.
    D: No necesita señalizar al alejarse de la acera.
  answer: B
  explanation: Debe señalizar incluso cuando no vea otros vehículos a su alrededor
    para garantizar una comunicación segura en la carretera.
- id: 35
  category: defensive_driving
  question: Al conducir por carreteras de montaña estrechas, ¿cuándo debe usar la
    bocina para alertar al tráfico que viene en sentido contrario si no puede ver
    al menos a qué distancia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Debe usar la bocina para alertar al tráfico que viene en sentido contrario
    en carreteras de montaña estrechas donde no pueda ver al menos 200 pies adelante.
- id: 36
  category: safe_driving_rules
  question: ¿A qué distancia debe cambiar sus luces altas a luces bajas cuando sigue
    a otro vehículo?
  choices:
    A: A menos de 200 pies
    B: A menos de 300 pies
    C: A menos de 400 pies
    D: A menos de 500 pies
  answer: B
  explanation: Debe cambiar sus luces altas a luces bajas a menos de 500 pies de un
    vehículo que viene hacia usted o a menos de 300 pies de un vehículo al que está
    siguiendo.
- id: 37
  category: safe_driving_rules
  question: ¿Bajo qué condiciones climáticas está legalmente obligado a encender las
    luces bajas?
  choices:
    A: Siempre que la temperatura baje del punto de congelación.
    B: Si necesita usar los limpiaparabrisas debido a la niebla, lluvia o nieve.
    C: Solo cuando conduzca por carreteras de montaña durante el invierno.
    D: Siempre que conduzca en un carril para vehículos con alta ocupación (carpool).
  answer: B
  explanation: Si necesita usar los limpiaparabrisas debido a la niebla, lluvia o
    nieve, debe encender las luces bajas.
- id: 38
  category: safe_driving_rules
  question: ¿Cuál es la regla general para el uso de los faros delanteros en relación
    con la puesta del sol y el amanecer?
  choices:
    A: Enciéndalos 30 minutos después de la puesta del sol y déjelos encendidos hasta
      30 minutos antes del amanecer.
    B: Enciéndalos exactamente al ponerse el sol y apáguelos al amanecer.
    C: Enciéndalos 1 hora después de la puesta del sol y déjelos encendidos hasta
      1 hora antes del amanecer.
    D: Enciéndalos 30 minutos antes de la puesta del sol y déjelos encendidos hasta
      30 minutos después del amanecer.
  answer: A
  explanation: Debe usar sus faros delanteros desde 30 minutos después de la puesta
    del sol hasta 30 minutos antes del amanecer.
- id: 39
  category: defensive_driving
  question: Si necesita detenerse debido a problemas con el vehículo, ¿cuál de las
    siguientes acciones debe evitar?
  choices:
    A: Encender las luces de emergencia (intermitentes).
    B: Salir de la carretera lejos de todo el tráfico.
    C: Detenerse justo después de una colina o al doblar una curva.
    D: Llamar para solicitar asistencia de emergencia en la carretera.
  answer: C
  explanation: No debe detenerse justo después de una colina o al doblar una curva
    porque es posible que otros conductores no vean su vehículo a tiempo para evitar
    una colisión.
- id: 40
  category: signs_and_signals
  question: ¿Qué indica una línea de ceda el paso, que consiste en triángulos blancos
    sólidos en la superficie de la carretera?
  choices:
    A: Un área designada para vehículos compartidos (carpools).
    B: El final de un carril de autopista.
    C: Dónde deben ceder el paso o detenerse los vehículos que se aproximan.
    D: Una barrera que no debe cruzar.
  answer: C
  explanation: Una línea de ceda el paso es una línea de triángulos blancos sólidos
    que indica a los vehículos que se aproximan dónde deben ceder el paso o detenerse.
- id: 41
  category: safe_driving_rules
  question: ¿Cómo debe tratar dos conjuntos de líneas amarillas dobles continuas separadas
    por dos pies o más?
  choices:
    A: Como un carril central para girar a la izquierda.
    B: Como un carril de adelantamiento para vehículos de alta ocupación.
    C: Como una barrera sobre la cual no debe conducir ni cruzar.
    D: Como una zona de apartadero designada.
  answer: C
  explanation: Dos conjuntos de líneas amarillas dobles continuas separadas por dos
    pies o más se consideran una barrera. No conduzca sobre esta barrera, ni realice
    un giro a la izquierda o un giro en U a través de ella.
- id: 42
  category: safe_driving_rules
  question: ¿Qué indican las líneas blancas dobles continuas en la calzada?
  choices:
    A: Una barrera de carril entre un carril de uso regular y uno de uso preferencial
      que nunca debe cruzar.
    B: El centro de una carretera con tráfico en ambos sentidos.
    C: Una zona de adelantamiento en una calle de sentido único.
    D: Un carril central para girar a la izquierda.
  answer: A
  explanation: Las líneas blancas dobles continuas indican una barrera de carril entre
    un carril de uso regular y uno de uso preferencial, como un carril para viajes
    compartidos (carpool). Nunca debe cambiar de carril sobre líneas blancas dobles
    continuas.
- id: 43
  category: safe_driving_rules
  question: Cuando se hace referencia a los carriles de tráfico por número, ¿cuál
    es el carril número 1?
  choices:
    A: El carril del extremo derecho.
    B: El carril izquierdo (o rápido).
    C: El carril central para girar a la izquierda.
    D: Solo el carril para viajes compartidos (carpool).
  answer: B
  explanation: Los carriles de tráfico a menudo se numeran. El carril izquierdo (o
    rápido) se denomina carril número 1.
- id: 44
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima permitida para conducir en un carril central
    para girar a la izquierda?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: C
  explanation: Solo puede conducir durante 200 pies en el carril central para girar
    a la izquierda antes de realizar su giro.
- id: 45
  category: sharing_the_road
  question: ¿Cuándo se le requiere usar una zona o carril de apartadero (turnout)
    para dejar pasar a otros vehículos?
  choices:
    A: Cuando conduce lentamente en una carretera de dos carriles y tres o más vehículos
      lo siguen.
    B: Cuando conduce lentamente en una carretera de dos carriles, adelantar no es
      seguro y cinco o más vehículos lo siguen.
    C: Siempre que necesite detenerse para consultar su sistema de navegación.
    D: Cuando conduce por una autopista y desea salir.
  answer: B
  explanation: Debe usar una zona o carril de apartadero para dejar pasar a otros
    vehículos cuando conduce lentamente en una carretera de dos carriles, donde adelantar
    no es seguro y hay cinco o más vehículos siguiéndolo.
- id: 46
  category: safe_driving_rules
  question: Al conducir lentamente en una carretera de dos carriles donde adelantar
    no es seguro, debe usar una zona o carril de apartadero para dejar pasar a otros
    vehículos si lo siguen al menos ¿cuántos vehículos?
  choices:
    A: Tres
    B: Cuatro
    C: Cinco
    D: Seis
  answer: C
  explanation: Según el manual, debe usar una zona o carril de apartadero para dejar
    pasar a otros vehículos cuando conduce lentamente en una carretera de dos carriles,
    adelantar no es seguro y hay cinco o más vehículos siguiéndolo.
- id: 47
  category: sharing_the_road
  question: Al prepararse para girar, ¿hasta qué distancia antes de la intersección
    puede conducir legalmente en un carril para bicicletas?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: C
  explanation: Es ilegal conducir en un carril para bicicletas a menos que esté girando,
    en cuyo caso puede entrar al carril de bicicletas dentro de los 200 pies previos
    a una intersección.
- id: 48
  category: sharing_the_road
  question: ¿Qué tipo de carril para bicicletas utiliza galones (chevrons) o marcas
    diagonales para proporcionar una mayor separación del tráfico y del estacionamiento
    en la calle?
  choices:
    A: Ciclovía separada
    B: Carril para bicicletas con zona de amortiguamiento (buffered)
    C: Bulevar para bicicletas
    D: Calzada compartida
  answer: B
  explanation: Un carril para bicicletas con zona de amortiguamiento (buffered bike
    lane) utiliza galones o marcas diagonales para proporcionar una mayor separación
    del tráfico y del estacionamiento en la calle.
- id: 49
  category: signs_and_signals
  question: ¿Qué debe hacer si está detenido ante una luz de flecha roja y desea girar
    a la derecha?
  choices:
    A: Girar a la derecha después de detenerse por completo.
    B: Girar a la derecha solo si no hay tráfico aproximándose.
    C: Esperar hasta que la luz cambie a verde antes de realizar su giro.
    D: Ceder el paso a los peatones y luego realizar su giro.
  answer: C
  explanation: No puede girar a la derecha si está detenido ante una luz de flecha
    roja. Debe esperar hasta que la luz cambie a verde antes de realizar su giro.
- id: 50
  category: safe_driving_rules
  question: ¿Es legal conducir su vehículo en un área designada para autobuses de
    tránsito público?
  choices:
    A: Sí, puede conducir en un carril de autobuses si el tráfico es denso.
    B: Sí, pero solo para adelantar a un vehículo lento.
    C: No, siempre es ilegal entrar en un carril de autobuses.
    D: No, pero puede cruzar un carril de autobuses para girar a la derecha.
  answer: D
  explanation: Es ilegal conducir, detenerse, estacionarse o dejar un vehículo en
    un área designada para autobuses de tránsito público. Sin embargo, puede cruzar
    un carril de autobuses para realizar un giro a la derecha.
- id: 51
  category: defensive_driving
  question: ¿Por qué debe mantener las ruedas apuntando hacia adelante mientras espera
    para girar a la izquierda?
  choices:
    A: Ayuda a acelerar más rápido cuando la luz cambia a verde.
    B: Evita que sea empujado hacia el tráfico en sentido contrario si lo golpean
      por detrás.
    C: Indica a otros conductores que está esperando un espacio en el tráfico.
    D: Reduce el desgaste del sistema de dirección asistida de su vehículo.
  answer: B
  explanation: Debe mantener las ruedas apuntando hacia adelante hasta que sea seguro
    comenzar el giro. Si sus ruedas apuntan a la izquierda y un vehículo lo golpea
    por detrás, podría ser empujado hacia el tráfico en sentido contrario.
- id: 52
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias puede realizar legalmente un giro a la izquierda
    con luz roja?
  choices:
    A: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido.
    B: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    C: Al girar desde una calle de un solo sentido hacia una calle de doble sentido.
    D: Nunca puede realizar un giro a la izquierda con luz roja.
  answer: A
  explanation: Puede girar a la izquierda con luz roja cuando gira desde una calle
    de un solo sentido hacia otra calle de un solo sentido, siempre que no haya una
    señal que prohíba el giro.
- id: 53
  category: safe_driving_rules
  question: ¿Nunca debe realizar un giro en U cuando no pueda ver claramente por al
    menos qué distancia en cada dirección?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El manual establece que nunca debe realizar un giro en U cuando no
    pueda ver claramente a 200 pies en cada dirección.
- id: 54
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una afirmación verdadera con respecto a los
    giros en U y las estaciones de bomberos?
  choices:
    A: Puede usar la entrada de una estación de bomberos para dar la vuelta si no
      hay camiones de bomberos presentes.
    B: Puede realizar un giro en U frente a una estación de bomberos solo durante
      las horas del día.
    C: Nunca debe usar la entrada de una estación de bomberos para dar la vuelta.
    D: Puede realizar un giro en U en la entrada de una estación de bomberos si conduce
      un vehículo de emergencia.
  answer: C
  explanation: Nunca debe realizar un giro en U frente a una estación de bomberos,
    y nunca debe usar la entrada de una estación de bomberos para dar la vuelta.
- id: 55
  category: defensive_driving
  question: Al detenerse detrás de otro vehículo en una intersección, ¿cuánto espacio
    debe dejar entre su vehículo y el que está delante?
  choices:
    A: Espacio suficiente para ver sus ruedas traseras.
    B: Exactamente el largo de un automóvil.
    C: Al menos tres segundos de distancia de seguimiento.
    D: Espacio suficiente para ver su parachoques trasero.
  answer: A
  explanation: Al frenar y detenerse detrás de un vehículo, debe dejar suficiente
    espacio para ver sus ruedas traseras.
- id: 56
  category: safe_driving_rules
  question: Al incorporarse a una autopista, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que entra a la autopista.
    B: El tráfico de la autopista.
    C: El vehículo que viaje más rápido.
    D: El vehículo a la derecha.
  answer: B
  explanation: Al incorporarse, el tráfico de la autopista tiene el derecho de paso.
    Debe incorporarse al tráfico de la autopista cuando sea seguro hacerlo.
- id: 57
  category: safe_driving_rules
  question: Al salir de una autopista, ¿durante aproximadamente cuántos segundos debe
    poner la señal antes de salir?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: D
  explanation: Para salir de una autopista de manera segura, debe poner la señal cinco
    segundos (aproximadamente 400 pies) antes de salir.
- id: 58
  category: safe_driving_rules
  question: Al prepararse para girar en una intersección donde no hay una línea de
    límite, ¿dónde debe detener su vehículo?
  choices:
    A: Antes de entrar al cruce de peatones.
    B: En medio del cruce de peatones.
    C: Justo después del cruce de peatones.
    D: En el borde de la carretera que cruza.
  answer: A
  explanation: Si no hay una línea de límite, debe detenerse antes de entrar al cruce
    de peatones. Si no hay un cruce de peatones, deténgase antes de entrar a la intersección.
- id: 59
  category: safe_driving_rules
  question: En un distrito comercial, ¿dónde se le permite realizar un giro en U?
  choices:
    A: En cualquier lugar, siempre que no se acerquen vehículos a menos de 200 pies.
    B: Solo en una intersección o en una carretera dividida donde se proporcione una
      apertura.
    C: Solo frente a una estación de bomberos.
    D: Los giros en U están estrictamente prohibidos en todo el distrito comercial.
  answer: B
  explanation: Nunca puede realizar un giro en U en distritos comerciales, excepto
    en una intersección o en una carretera dividida donde se haya proporcionado una
    apertura.
- id: 60
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe comenzar a poner la señal antes de realizar
    un giro a la derecha o a la izquierda?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Al realizar un giro a la derecha o a la izquierda, debe comenzar a
    poner la señal unos 100 pies antes del giro.
- id: 61
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar antes de salir de una autopista?
  choices:
    A: Tres segundos (aproximadamente 200 pies)
    B: Cinco segundos (aproximadamente 400 pies)
    C: Diez segundos (aproximadamente 800 pies)
    D: Solo cuando comience a girar el volante
  answer: B
  explanation: El manual establece que cuando se encuentre en el carril adecuado,
    debe señalizar cinco segundos (aproximadamente 400 pies) antes de salir de una
    autopista.
- id: 62
  category: safe_driving_rules
  question: ¿Cuánto espacio necesita para incorporarse, entrar o salir del tráfico
    de manera segura en las calles de la ciudad?
  choices:
    A: Una cuadra completa, que son unos 300 pies
    B: Media cuadra, que son unos 150 pies
    C: Un cuarto de cuadra, que son unos 75 pies
    D: Dos cuadras completas, que son unos 600 pies
  answer: B
  explanation: Para incorporarse, entrar o salir del tráfico en las calles de la ciudad,
    necesita un espacio de media cuadra, que son unos 150 pies.
- id: 63
  category: defensive_driving
  question: Al esperar para girar a la izquierda, ¿qué debe hacer si un vehículo que
    viene en sentido contrario tiene encendida la luz direccional derecha?
  choices:
    A: Avanzar de inmediato porque el vehículo está obligado a girar
    B: Tocar la bocina para asegurarse de que lo vean antes de girar
    C: Esperar a que el vehículo comience su giro antes de iniciar su giro a la izquierda
    D: Girar a la derecha en su lugar para evitar una posible colisión
  answer: C
  explanation: El manual aconseja no asumir que un vehículo que viene en sentido contrario
    con la luz direccional derecha encendida va a girar antes de llegar a usted. Debe
    esperar a que el vehículo comience su giro antes de iniciar su giro a la izquierda.
- id: 64
  category: safe_driving_rules
  question: Para rebasar a otro vehículo de manera segura al acercarse a una colina
    o curva, ¿a qué distancia mínima debe estar la colina o curva?
  choices:
    A: Un tercio de milla
    B: Media milla
    C: Un cuarto de milla
    D: Una milla completa
  answer: A
  explanation: Para rebasar de manera segura, el manual establece que una colina o
    curva que se aproxima debe estar al menos a un tercio de milla de distancia.
- id: 65
  category: safe_driving_rules
  question: ¿A cuántos pies de una intersección, puente, túnel o cruce de ferrocarril
    no debe rebasar a otro vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: No rebase a menos de 100 pies de una intersección, puente, túnel, cruce
    de ferrocarril u otra área peligrosa.
- id: 66
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones se le permite rebasar a un vehículo
    por la derecha?
  choices:
    A: Cuando el vehículo de adelante circula por debajo del límite de velocidad
    B: Cuando puede conducir con seguridad fuera de la parte pavimentada de la carretera
      para rebasar
    C: Cuando el conductor delante de usted está girando a la izquierda y usted puede
      rebasar con seguridad por la derecha
    D: Cuando se encuentra en una carretera de dos carriles con tráfico en sentido
      contrario
  answer: C
  explanation: Puede rebasar por la derecha solo cuando el conductor delante de usted
    esté girando a la izquierda y usted pueda rebasar con seguridad por la derecha,
    en una calle de un solo sentido o en una carretera abierta con dos o más carriles
    en su dirección.
- id: 67
  category: sharing_the_road
  question: Si otro vehículo lo está rebasando, ¿qué debe hacer?
  choices:
    A: Acelerar para evitar que lo rebasen
    B: Moverse al carril izquierdo
    C: Reducir la velocidad drásticamente y detenerse en el acotamiento
    D: Mantener su posición en el carril y su velocidad
  answer: D
  explanation: Si un vehículo lo está rebasando o señaliza que planea rebasarlo, permita
    que el vehículo pase manteniendo su posición en el carril y su velocidad.
- id: 68
  category: safe_driving_rules
  question: Cuando haya terminado de estacionarse en paralelo, ¿a cuántas pulgadas
    del bordillo (curb) debe quedar su vehículo y de forma paralela?
  choices:
    A: 12 pulgadas
    B: 18 pulgadas
    C: 24 pulgadas
    D: 36 pulgadas
  answer: B
  explanation: Al enderezar el vehículo durante el estacionamiento en paralelo, este
    debe quedar paralelo y a menos de 18 pulgadas del bordillo.
- id: 69
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar las ruedas delanteras cuando esté estacionado
    cuesta arriba junto a un bordillo?
  choices:
    A: Gire las ruedas delanteras hacia el bordillo (derecha)
    B: Gire las ruedas delanteras en dirección contraria al bordillo (izquierda)
    C: Mantenga las ruedas delanteras apuntando hacia adelante
    D: Gire las ruedas delanteras hacia el acotamiento de la carretera
  answer: B
  explanation: Cuando esté estacionado cuesta arriba, gire las ruedas delanteras en
    dirección contraria al bordillo (hacia la izquierda, hacia el centro de la carretera)
    y deje que el vehículo ruede hacia atrás unos centímetros para que la rueda toque
    suavemente el bordillo.
- id: 70
  category: signs_and_signals
  question: ¿Qué indica un bordillo pintado de amarillo?
  choices:
    A: Se permite estacionar solo por un tiempo limitado
    B: No detenerse, pararse ni estacionarse en ningún momento
    C: Detenerse solo el tiempo suficiente para recoger o dejar pasajeros
    D: Carga y descarga de pasajeros y mercancías
  answer: D
  explanation: Un bordillo amarillo significa que puede cargar y descargar pasajeros
    y mercancías. No debe detenerse más tiempo del indicado, y a los conductores de
    vehículos no comerciales generalmente se les exige permanecer con su vehículo.
- id: 71
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios o de la entrada de una estación
    de bomberos es ilegal estacionar su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: Nunca estacione ni deje su vehículo a menos de 15 pies de un hidrante
    de incendios o de la entrada de una estación de bomberos.
- id: 72
  category: penalties_and_points
  question: Si debe detenerse en una autopista en una emergencia, ¿su vehículo puede
    ser retirado si se deja estacionado por más de cuántas horas?
  choices:
    A: 2 horas
    B: 4 horas
    C: 12 horas
    D: 24 horas
  answer: B
  explanation: Un vehículo que se detiene, se estaciona o se deja parado en una autopista
    por más de cuatro horas puede ser retirado.
- id: 73
  category: driver_responsibility
  question: Durante una parada de las fuerzas del orden, ¿qué debe hacer para reconocer
    que ve al oficial?
  choices:
    A: Encender las luces de emergencia
    B: Encender la señal de giro a la derecha
    C: Agitar la mano por la ventana
    D: Presionar los frenos repetidamente
  answer: B
  explanation: Durante una parada de las fuerzas del orden, debe encender la señal
    de giro a la derecha para reconocer que ve al oficial.
- id: 74
  category: driver_responsibility
  question: Cuando las fuerzas del orden lo detengan, ¿dónde deben colocar sus manos
    el conductor y todos los pasajeros antes de que el oficial haga contacto?
  choices:
    A: En sus bolsillos
    B: A la vista
    C: En el techo del vehículo
    D: Detrás de sus espaldas
  answer: B
  explanation: El manual establece que el conductor y todos los pasajeros deben colocar
    sus manos a la vista antes de que el oficial haga contacto con ellos.
- id: 75
  category: vehicle_information
  question: ¿Cuál de las siguientes es una práctica recomendada para maximizar su
    eficiencia de combustible y reducir las emisiones?
  choices:
    A: Acelerar y frenar lo más rápido posible
    B: Mantener peso extra en su vehículo para una mejor tracción
    C: Aumentar y disminuir la velocidad suavemente mientras conduce a una velocidad
      constante
    D: Usar gasolina premium independientemente de los requisitos de su vehículo
  answer: C
  explanation: Para maximizar la eficiencia de combustible y reducir las emisiones,
    el manual recomienda acelerar y frenar suavemente, conducir a una velocidad constante,
    inflar los neumáticos regularmente, realizar cambios de aceite y eliminar el peso
    extra de su vehículo.
- id: 76
  category: driver_responsibility
  question: ¿Qué debe hacer un oficial de las fuerzas del orden antes de comenzar
    a interrogarlo en relación con una investigación criminal o una infracción de
    tráfico?
  choices:
    A: Pedir su permiso para grabar la interacción
    B: Indicar el motivo de la parada de tráfico o de peatones
    C: Solicitar su estatus migratorio
    D: Registrar su vehículo en busca de armas
  answer: B
  explanation: Los oficiales de las fuerzas del orden deben indicar el motivo de una
    parada de tráfico o de peatones antes de comenzar cualquier interrogatorio relacionado
    con una investigación criminal o una infracción de tráfico, a menos que exista
    una amenaza inminente.
- id: 77
  category: driver_responsibility
  question: Cuando lo detengan las fuerzas del orden, ¿qué documentos debe presentar
    el conductor del vehículo?
  choices:
    A: Licencia de conducir, comprobante de seguro y registro del vehículo
    B: Licencia de conducir, pasaporte y comprobante de seguro
    C: Registro del vehículo, comprobante de seguro y una identificación secundaria
    D: Licencia de conducir y tarjeta de seguro social
  answer: A
  explanation: El conductor de un vehículo detenido debe presentar una licencia de
    conducir, comprobante de seguro y el registro del vehículo cuando sea detenido
    por las fuerzas del orden.
- id: 78
  category: driver_responsibility
  question: En California, ¿quién está legalmente autorizado a preguntarle sobre su
    estatus migratorio durante una parada de tráfico?
  choices:
    A: Solo los oficiales de la patrulla de caminos del estado
    B: Cualquier oficial de las fuerzas del orden local o estatal
    C: Solo los oficiales federales de las fuerzas del orden
    D: A ningún oficial de las fuerzas del orden se le permite preguntar nunca
  answer: C
  explanation: En California, solo los oficiales federales de las fuerzas del orden
    pueden preguntarle sobre su estatus migratorio. La ley de California prohíbe que
    los oficiales estatales y locales pregunten a los conductores o pasajeros sobre
    su estatus migratorio.
- id: 79
  category: driver_responsibility
  question: Si decide grabar una interacción con las fuerzas del orden durante una
    parada de tráfico, ¿qué debe evitar hacer?
  choices:
    A: Dejar claro de inmediato que está grabando
    B: Meter la mano en áreas ocultas para recuperar su dispositivo sin permiso
    C: Negar una solicitud para desbloquear su teléfono celular
    D: Grabar la interacción en un espacio público
  answer: B
  explanation: Usted no tiene derecho a interferir con los deberes legales del oficial,
    y no debe meter la mano en áreas ocultas para recuperar su dispositivo de grabación
    sin el permiso del oficial.
- id: 80
  category: signs_and_signals
  question: ¿Bajo qué condición se le permite girar a la derecha en una luz roja sólida
    del semáforo?
  choices:
    A: Solo si tiene una flecha verde apuntando a la derecha
    B: Siempre que no haya tráfico en sentido contrario, sin detenerse
    C: Si no hay una señal de 'NO TURN ON RED', después de detenerse y ceder el paso
    D: Nunca se le permite girar a la derecha en una luz roja sólida
  answer: C
  explanation: Puede girar a la derecha en una luz roja si no hay una señal de 'NO
    TURN ON RED' (no girar en rojo) colocada, y si se detiene en la línea de parada
    o límite, cede el paso a los peatones y gira cuando sea seguro.
- id: 81
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico con una flecha roja?
  choices:
    A: Puede girar en la dirección de la flecha después de detenerse por completo
    B: DETÉNGASE y no gire ante una flecha roja
    C: Ceda el paso al tráfico que viene en sentido contrario antes de girar
    D: El tiempo de giro protegido está terminando
  answer: B
  explanation: Una flecha roja significa DETENERSE. No gire ante una flecha roja.
    Permanezca detenido hasta que aparezca una luz verde del semáforo o una flecha
    verde.
- id: 82
  category: signs_and_signals
  question: ¿Cómo debe reaccionar al acercarse a una intersección y el semáforo cambia
    a una luz amarilla fija?
  choices:
    A: Acelere para cruzar la intersección antes de que cambie a rojo
    B: Deténgase inmediatamente dondequiera que esté
    C: Deténgase si puede hacerlo de manera segura; de lo contrario, cruce la intersección
      con precaución
    D: Trátela como una señal de ceder el paso y continúe sin detenerse
  answer: C
  explanation: Una luz amarilla del semáforo significa PRECAUCIÓN. La luz está a punto
    de cambiar a rojo. Deténgase si puede hacerlo de manera segura. Si no puede detenerse
    de forma segura, cruce la intersección con precaución.
- id: 83
  category: signs_and_signals
  question: ¿Cuál es la acción correcta a tomar ante una luz amarilla intermitente
    del semáforo?
  choices:
    A: Deténgase por completo y espere a la luz verde
    B: Reduzca la velocidad, esté alerta y continúe con precaución sin detenerse
    C: Trate la intersección como una parada de cuatro vías
    D: Ceda el paso a todo el tráfico a su derecha antes de continuar
  answer: B
  explanation: Una luz amarilla intermitente del semáforo es una advertencia para
    CONTINUAR CON PRECAUCIÓN. Reduzca la velocidad y esté alerta. No es necesario
    detenerse.
- id: 84
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente sobre los giros?
  choices:
    A: Su giro está protegido del resto del tráfico
    B: No puede girar en la dirección de la flecha
    C: Puede girar, pero su giro no está protegido; debe ceder el paso al tráfico
      que viene en sentido contrario
    D: Debe detenerse y esperar a una flecha verde fija
  answer: C
  explanation: Una flecha amarilla intermitente significa que puede girar, pero su
    giro no está protegido del resto del tráfico. Proceda a girar a la izquierda después
    de ceder el paso al tráfico que viene en sentido contrario y continúe con precaución.
- id: 85
  category: signs_and_signals
  question: Tiene una luz verde fija, pero el tráfico está acumulado dentro de la
    intersección. ¿Qué debe hacer?
  choices:
    A: Entre en la intersección y espere a que el tráfico se despeje
    B: Toque la bocina para animar a los vehículos a moverse
    C: No entre en la intersección si no puede cruzarla por completo antes de que
      la luz cambie a rojo
    D: Avance lentamente y circule entre los vehículos detenidos
  answer: C
  explanation: Una luz verde del semáforo significa SIGA, pero no debe entrar en la
    intersección si no puede cruzarla por completo antes de que la luz del semáforo
    cambie a rojo.
- id: 86
  category: signs_and_signals
  question: ¿Qué debe hacer si se acerca a una intersección donde el semáforo no funciona?
  choices:
    A: Ceda el paso al tráfico de la derecha y continúe
    B: Deténgase como si la intersección estuviera controlada por señales de PARE
      (STOP) en todas las direcciones
    C: Reduzca la velocidad a 15 mph y continúe con precaución
    D: Espere a que lleguen las autoridades para dirigir el tráfico
  answer: B
  explanation: Cuando un semáforo no funciona, deténgase como si la intersección estuviera
    controlada por señales de PARE (STOP) en todas las direcciones. Luego, continúe
    con precaución cuando sea seguro hacerlo.
- id: 87
  category: sharing_the_road
  question: Si un peatón está cruzando la calle y la luz de "NO CRUCE" (DON'T WALK)
    comienza a parpadear, ¿qué deben hacer los conductores?
  choices:
    A: Toque la bocina para advertir al peatón que se dé prisa
    B: Avance por el cruce peatonal ya que el tiempo del peatón se ha agotado
    C: Ceda el paso al peatón, incluso si la luz de "NO CRUCE" está parpadeando
    D: Conduzca lentamente alrededor del peatón
  answer: C
  explanation: Los conductores deben ceder el paso a los peatones, incluso si la luz
    de "NO CRUCE" (DON'T WALK) está parpadeando.
- id: 88
  category: signs_and_signals
  question: ¿Dónde debe detenerse por completo al acercarse a una señal de PARE (STOP)?
  choices:
    A: Justo después del cruce peatonal para poder ver el tráfico
    B: Antes de entrar en el cruce peatonal o en la línea de límite
    C: Solo si hay tráfico en sentido contrario
    D: Al menos 20 pies antes de la intersección
  answer: B
  explanation: En una señal de PARE (STOP), deténgase por completo antes de entrar
    en el cruce peatonal o en la línea de límite. Si no hay línea de límite ni cruce
    peatonal, deténgase antes de entrar en la intersección.
- id: 89
  category: vehicle_information
  question: ¿Cuál de los siguientes trámites se puede completar en un quiosco del
    DMV?
  choices:
    A: Realizar un examen escrito de conocimientos para conductores
    B: Presentar el comprobante de seguro y completar la renovación del registro del
      vehículo
    C: Solicitar una licencia de conducir por primera vez
    D: Pagar una multa de tráfico
  answer: B
  explanation: Los quioscos del DMV ofrecen trámites como completar la renovación
    del registro de su vehículo, recibir una tarjeta o calcomanía de registro de reemplazo,
    presentar el comprobante de seguro, solicitar el estado de no operación planificada
    (PNO) y obtener su historial de conductor o del vehículo.
- id: 90
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿cuál es el derecho de un pasajero con
    respecto a una solicitud de identificación?
  choices:
    A: Los pasajeros siempre están obligados legalmente a proporcionar identificación
      de inmediato
    B: Los pasajeros pueden rechazar la solicitud, aunque en algunas circunstancias
      se les puede exigir que se identifiquen
    C: Los pasajeros solo deben proporcionar identificación si están conduciendo
    D: Nunca se requiere que los pasajeros se identifiquen bajo ninguna circunstancia
  answer: B
  explanation: Un oficial puede solicitar los nombres o la identificación de los pasajeros.
    Los pasajeros pueden rechazar esa solicitud, pero en algunas circunstancias se
    les puede exigir que se identifiquen.
- id: 91
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de 5 lados?
  choices:
    A: Se aproxima a un cruce de ferrocarril.
    B: Está cerca de una escuela.
    C: Debe ceder el paso.
    D: Está entrando en una autopista dividida.
  answer: B
  explanation: Según el manual, una señal de 5 lados significa que está cerca de una
    escuela. Debe conducir despacio y detenerse para los niños en el cruce peatonal.
- id: 92
  category: signs_and_signals
  question: ¿De qué le advierte una señal circular amarilla y negra o una señal en
    forma de X?
  choices:
    A: Un camino sinuoso más adelante
    B: Un cruce de peatones
    C: Un cruce de ferrocarril
    D: Una entrada en sentido contrario
  answer: C
  explanation: Una señal circular amarilla y negra o una señal en forma de X indica
    que se está aproximando a un cruce de ferrocarril. Debe mirar, escuchar, reducir
    la velocidad y prepararse para detenerse.
- id: 93
  category: safe_driving_rules
  question: En una intersección en T sin señales de PARE (STOP) o CEDA EL PASO (YIELD),
    ¿quién tiene el derecho de paso?
  choices:
    A: Los vehículos en la carretera que termina.
    B: El vehículo que está girando a la izquierda.
    C: El vehículo a la derecha.
    D: Los vehículos, ciclistas y peatones en la carretera principal (vía continua).
  answer: D
  explanation: En las intersecciones en T sin señales de PARE o CEDA EL PASO, los
    vehículos, ciclistas y peatones en la carretera principal (que continúan recto)
    tienen el derecho de paso.
- id: 94
  category: safe_driving_rules
  question: Si usted y otro vehículo llegan a una intersección sin señales de PARE
    (STOP) o CEDA EL PASO (YIELD) exactamente al mismo tiempo, ¿quién debe ceder el
    paso?
  choices:
    A: El vehículo de la izquierda debe ceder el paso al vehículo de la derecha.
    B: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda.
    C: El vehículo más grande tiene el derecho de paso.
    D: El vehículo que viaja más rápido tiene el derecho de paso.
  answer: A
  explanation: Si un vehículo, peatón o ciclista llega a la intersección al mismo
    tiempo que usted, debe ceder el derecho de paso al vehículo, peatón o ciclista
    a su derecha.
- id: 95
  category: safe_driving_rules
  question: ¿En qué dirección circula el tráfico en una rotonda (glorieta)?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En línea recta
    D: En cualquier dirección que tenga menos tráfico
  answer: B
  explanation: Al usar una rotonda, debe circular en sentido contrario a las agujas
    del reloj.
- id: 96
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida mientras conduce en una rotonda?
  choices:
    A: Detenerse y retroceder con cuidado hasta su salida.
    B: Hacer un giro en U sobre la isla central.
    C: Salir en la siguiente calle disponible y dar la vuelta.
    D: Continuar circulando hasta que regrese a su salida.
  answer: D
  explanation: El manual establece que si se pasa de su salida en una rotonda, debe
    continuar circulando hasta que regrese a su salida.
- id: 97
  category: sharing_the_road
  question: ¿Por qué es peligroso e ilegal rebasar a un vehículo detenido en un cruce
    peatonal?
  choices:
    A: El vehículo detenido podría retroceder repentinamente.
    B: Es posible que no pueda ver a un peatón cruzando la calle.
    C: El vehículo detenido tiene el derecho de paso para girar.
    D: Bloquea la intersección para los vehículos de emergencia.
  answer: B
  explanation: No debe rebasar a un vehículo detenido en un cruce peatonal porque
    es posible que no pueda ver a un peatón cruzando la calle.
- id: 98
  category: sharing_the_road
  question: ¿Qué significa usualmente cuando un peatón ciego retira su bastón y se
    aleja de la intersección?
  choices:
    A: Están esperando a que usted toque la bocina.
    B: Necesitan que usted se detenga y los ayude a cruzar.
    C: Este gesto usualmente significa que usted puede pasar.
    D: Le están advirtiendo de un peligro en la carretera.
  answer: C
  explanation: Cuando una persona ciega retira su bastón y se aleja de la intersección,
    este gesto usualmente significa que usted puede pasar.
- id: 99
  category: safe_driving_rules
  question: Si dos vehículos se encuentran en un camino de montaña empinado y estrecho
    y ninguno puede pasar, ¿qué vehículo tiene el derecho de paso?
  choices:
    A: El vehículo que va cuesta abajo.
    B: El vehículo que va cuesta arriba.
    C: El vehículo que llegó al último.
    D: El vehículo más pesado.
  answer: B
  explanation: Si dos vehículos se encuentran en un camino estrecho y empinado y ninguno
    puede pasar, el vehículo que va cuesta arriba tiene el derecho de paso. El vehículo
    que va cuesta abajo debe retroceder.
- id: 100
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego (Zona Prohibida
    o 'No Zone') de un camión grande?
  choices:
    A: Si no puede ver los espejos laterales del camión, el conductor del camión no
      puede verlo a usted.
    B: Si está conduciendo directamente delante del camión.
    C: Si puede ver la matrícula del camión.
    D: Si está conduciendo en el lado izquierdo del camión.
  answer: A
  explanation: Los vehículos grandes tienen puntos ciegos amplios llamados Zonas Prohibidas
    (No Zones). Si no puede ver los espejos laterales del camión, el conductor del
    camión no puede verlo a usted.
- id: 101
  category: sharing_the_road
  question: ¿Aproximadamente cuántos pies puede tardar un vehículo grande que viaja
    a 55 mph en detenerse por completo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: D
  explanation: Un vehículo grande que viaja a 55 mph puede tardar hasta 400 pies en
    detenerse, en comparación con un vehículo de pasajeros promedio que puede detenerse
    en 300 pies a la misma velocidad.
- id: 102
  category: sharing_the_road
  question: ¿Por qué los vehículos grandes y los conductores de camiones a menudo
    giran de forma amplia para completar un giro?
  choices:
    A: Porque necesitan mantener una velocidad alta al girar.
    B: Porque las ruedas traseras siguen una trayectoria más corta que las ruedas
      delanteras.
    C: Porque sus volantes no pueden girar tan bruscamente como los de los automóviles
      de pasajeros.
    D: Porque la ley les exige utilizar dos carriles al girar.
  answer: B
  explanation: Cuando un vehículo gira, las ruedas traseras siguen una trayectoria
    más corta que las ruedas delanteras. Cuanto más largo sea el vehículo, mayor será
    la diferencia, razón por la cual los vehículos grandes a menudo deben girar de
    forma amplia para completar un giro.
- id: 103
  category: sharing_the_road
  question: Al rebasar un vehículo grande o un camión, ¿por qué lado debe pasar siempre?
  choices:
    A: Por el lado derecho.
    B: Por el lado izquierdo.
    C: Por el acotamiento.
    D: Por el lado que tenga el carril más ancho.
  answer: B
  explanation: 'El manual establece explícitamente: ''Siempre rebase a un vehículo
    grande por el lado izquierdo. Después de rebasar al vehículo grande o camión,
    avance delante de él''.'
- id: 104
  category: sharing_the_road
  question: ¿Bajo qué condiciones es legal conducir a través de una zona de seguridad
    para peatones?
  choices:
    A: Cuando no hay peatones presentes.
    B: Si está haciendo un giro a la derecha.
    C: Al rebasar un autobús detenido.
    D: Bajo ninguna condición.
  answer: D
  explanation: 'Las zonas de seguridad son espacios reservados para los peatones que
    esperan autobuses, tranvías y trolebuses. El manual establece: ''No conduzca a
    través de una zona de seguridad bajo ninguna condición''.'
- id: 105
  category: sharing_the_road
  question: ¿Cuál es el límite de velocidad máximo al pasar un autobús, tranvía o
    trolebús que está detenido en una zona de seguridad o semáforo?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: A
  explanation: Cuando un autobús, tranvía o trolebús se detiene en una zona de seguridad
    o semáforo, puede pasar a no más de 10 mph.
- id: 106
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir detrás de
    un motociclista?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: C
  explanation: Deje una distancia de seguimiento segura de tres segundos. Este espacio
    le ayudará a evitar golpear a un motociclista si frena repentinamente o se cae.
- id: 107
  category: safe_driving_rules
  question: ¿Qué debe hacer si se encuentra en una intersección cuando ve que se aproxima
    un vehículo de emergencia con la sirena y las luces rojas encendidas?
  choices:
    A: Detenerse inmediatamente en medio de la intersección
    B: Orillarse al borde derecho de la intersección y detenerse
    C: Continuar a través de la intersección, luego conducir hacia la derecha tan
      pronto como sea seguro y detenerse
    D: Acelerar para despejar la intersección antes de que llegue el vehículo de emergencia
  answer: C
  explanation: Si se encuentra en una intersección cuando ve un vehículo de emergencia,
    continúe a través de la intersección. Conduzca hacia la derecha tan pronto como
    sea seguro y deténgase.
- id: 108
  category: safe_driving_rules
  question: ¿A cuántos pies de distancia es ilegal seguir a un vehículo de emergencia
    cuando su sirena o luces intermitentes están encendidas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Es contra la ley seguir a menos de 300 pies de cualquier camión de
    bomberos, vehículo policial, ambulancia u otro vehículo de emergencia cuando su
    sirena o luces intermitentes estén encendidas.
- id: 109
  category: signs_and_signals
  question: ¿Qué marca indica un vehículo de movimiento lento, como un vehículo de
    mantenimiento de carreteras, que generalmente viaja a 25 mph o menos?
  choices:
    A: Una luz amarilla intermitente en el techo
    B: Un triángulo naranja y rojo en la parte trasera
    C: Un diamante blanco pintado en la puerta trasera
    D: Una calcomanía de parachoques a rayas rojas y blancas
  answer: B
  explanation: Algunos vehículos de movimiento lento tienen un triángulo naranja y
    rojo en la parte trasera, como los vehículos de mantenimiento de carreteras, que
    generalmente viajan a 25 mph o menos.
- id: 110
  category: safe_driving_rules
  question: 'Los Vehículos Eléctricos de Vecindario (NEV) y los Vehículos de Baja
    Velocidad (LSV) tienen restringido operar en carreteras donde el límite de velocidad
    es mayor a:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Los NEV y LSV alcanzan una velocidad máxima de 25 mph. Tienen restringido
    el acceso a carreteras donde el límite de velocidad es superior a 35 mph.
- id: 111
  category: driver_responsibility
  question: Según las responsabilidades del ciclista, ¿un ciclista debe usar casco
    si es menor de qué edad?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 14 años
  answer: B
  explanation: Como ciclista, debe usar un casco (si es menor de 18 años).
- id: 112
  category: vehicle_information
  question: Al andar en bicicleta de noche, ¿la bicicleta debe estar equipada con
    una lámpara delantera con una luz blanca visible desde qué distancia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Cuando está oscuro, su bicicleta debe tener una lámpara delantera con
    una luz blanca visible desde 300 pies.
- id: 113
  category: sharing_the_road
  question: Si no puede cambiar de carril para rebasar a un ciclista de manera segura,
    ¿cuál es la distancia mínima que debe dejar entre su vehículo y el ciclista?
  choices:
    A: Dos pies
    B: Tres pies
    C: Cuatro pies
    D: Cinco pies
  answer: B
  explanation: Cuando no pueda cambiar de carril para rebasar a un ciclista, deje
    al menos tres pies de distancia entre su vehículo y el ciclista.
- id: 114
  category: safe_driving_rules
  question: Al prepararse para dar una vuelta, ¿cuántos pies antes de comenzar la
    vuelta puede entrar en un carril para bicicletas como máximo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: C
  explanation: Entre en un carril para bicicletas no más de 200 pies antes de comenzar
    una vuelta.
- id: 115
  category: penalties_and_points
  question: ¿Cuál es la posible sanción para un conductor condenado por agredir a
    un trabajador de la carretera?
  choices:
    A: Una multa de hasta $500 y 30 días de cárcel
    B: Una multa de hasta $1,000 y 6 meses de cárcel
    C: Una multa de hasta $2,000 y encarcelamiento por hasta un año
    D: Una multa de hasta $5,000 y revocación de la licencia
  answer: C
  explanation: Cualquier persona condenada por agredir a un trabajador de la carretera
    se enfrenta a multas de hasta $2,000 y encarcelamiento por hasta un año.
- id: 116
  category: sharing_the_road
  question: 'Los ciclistas que viajan más lento que el flujo del tráfico deben circular
    lo más cerca posible de la acera derecha o del borde de la carretera, EXCEPTO
    cuando:'
  choices:
    A: Están circulando en una carretera de dos carriles
    B: Se están preparando para dar una vuelta a la izquierda
    C: Se están aproximando a una intersección con una señal de alto
    D: Están circulando en un vecindario residencial
  answer: B
  explanation: Los ciclistas que viajan más lento que el flujo del tráfico deben circular
    lo más cerca posible de la acera derecha o del borde de la carretera, a menos
    que estén rebasando, preparándose para dar una vuelta a la izquierda, evitando
    un peligro, etc.
- id: 117
  category: penalties_and_points
  question: ¿Bajo qué condición se duplican las multas de tráfico en las zonas de
    construcción o mantenimiento de carreteras?
  choices:
    A: Solo durante las horas nocturnas
    B: Cuando hay trabajadores presentes
    C: Cuando el límite de velocidad se reduce en más de 15 mph
    D: Cuando hay maquinaria pesada operando en el acotamiento
  answer: B
  explanation: Las multas también se duplican en las zonas de construcción o mantenimiento
    de carreteras cuando hay trabajadores presentes.
- id: 118
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a compartir
    la carretera con motocicletas?
  choices:
    A: Es ilegal que las motocicletas compartan carriles con otros vehículos
    B: Debe intentar rebasar a una motocicleta en el mismo carril para ahorrar espacio
    C: Es legal compartir carriles con motocicletas, lo que se conoce como división
      de carril (lane splitting)
    D: Se requiere que las motocicletas circulen por el acotamiento durante el tráfico
      pesado
  answer: C
  explanation: Siempre que sea posible, dele a la motocicleta el carril completo.
    Es legal compartir carriles con motocicletas, esto se conoce como división de
    carril (lane splitting).
- id: 119
  category: safe_driving_rules
  question: ¿Cuál es la sanción por no detenerse ante un autobús escolar con luces
    rojas intermitentes?
  choices:
    A: Una multa de hasta $500 y una suspensión de la licencia por 6 meses.
    B: Una multa de hasta $1,000 y su privilegio de conducir podría ser suspendido
      por un año.
    C: Una advertencia por la primera infracción.
    D: 2 puntos en su historial de conductor y una multa de $250.
  answer: B
  explanation: Si no se detiene ante un autobús escolar con luces rojas intermitentes,
    se le puede multar con hasta $1,000 y su privilegio de conducir podría ser suspendido
    por un año.
- id: 120
  category: safe_driving_rules
  question: Si está remolcando un tráiler en una carretera con cuatro carriles en
    su dirección y no hay carriles lentos marcados, ¿en qué carriles puede conducir?
  choices:
    A: Cualquier carril siempre que conduzca al límite de velocidad.
    B: Solo el carril del extremo izquierdo.
    C: Los dos carriles más cercanos al borde derecho de la carretera.
    D: Los dos carriles centrales.
  answer: C
  explanation: Al remolcar un vehículo o tráiler en una carretera con cuatro o más
    carriles en su dirección y sin carriles marcados, solo puede conducir en los dos
    carriles más cercanos al borde derecho de la carretera.
- id: 121
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una intersección a ciegas?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Una intersección se considera a ciegas si no tiene señales de alto
    en ninguna esquina y su vista está bloqueada. El límite de velocidad para una
    intersección a ciegas es de 15 mph.
- id: 122
  category: vehicle_information
  question: Si la carga sobresale más de 4 pies del parachoques trasero de su vehículo
    durante el día, ¿qué se debe mostrar?
  choices:
    A: Una bandera cuadrada roja o naranja fluorescente de 12 pulgadas.
    B: Dos luces rojas.
    C: Una baliza amarilla intermitente.
    D: Un letrero de 'Carga ancha' (Wide Load).
  answer: A
  explanation: La carga que sobresale más de 4 pies del parachoques trasero del vehículo
    debe mostrar una bandera cuadrada roja o naranja fluorescente de 12 pulgadas.
    Por la noche, debe estar marcada con dos luces rojas.
- id: 123
  category: safe_driving_rules
  question: Cuando un dispositivo de cruce o una persona le advierte que se acerca
    un tren, ¿a qué distancia de la vía más cercana debe detenerse?
  choices:
    A: Al menos 5 pies
    B: Al menos 10 pies
    C: Al menos 15 pies
    D: Al menos 25 pies
  answer: C
  explanation: Cuando los dispositivos de cruce o una persona le advierten que se
    acerca un tren, debe detenerse al menos a 15 pies de la vía más cercana.
- id: 124
  category: penalties_and_points
  question: Como adulto, su licencia puede ser suspendida si su historial de conductor
    muestra ¿cuál de los siguientes totales de puntos?
  choices:
    A: 2 puntos en 12 meses
    B: 3 puntos en 24 meses
    C: 4 puntos en 12 meses
    D: 5 puntos en 36 meses
  answer: C
  explanation: Como adulto, su licencia puede ser suspendida si su historial de conductor
    muestra 4 puntos en 12 meses, 6 puntos en 24 meses u 8 puntos en 36 meses.
- id: 125
  category: penalties_and_points
  question: ¿Cuál es la sanción para una persona condenada por homicidio involuntario
    resultante de evadir a las autoridades durante una persecución?
  choices:
    A: Encarcelamiento en una cárcel del condado por un año o menos.
    B: Encarcelamiento en una prisión estatal por hasta siete años.
    C: Encarcelamiento en una prisión estatal por un mínimo de 4 a 10 años.
    D: Una multa de $10,000 y la revocación permanente de la licencia.
  answer: C
  explanation: Una persona condenada por homicidio involuntario resultante de evadir
    a las autoridades durante una persecución está sujeta a encarcelamiento en una
    prisión estatal por un mínimo de 4 a 10 años.
- id: 126
  category: penalties_and_points
  question: ¿Qué puede suceder si se sorprende a una persona sin licencia conduciendo
    su vehículo?
  choices:
    A: Su vehículo puede ser confiscado (impounded) por 30 días.
    B: Recibirá 2 puntos en su historial de manejo.
    C: Su vehículo será confiscado permanentemente.
    D: Se le requerirá asistir a una escuela para infractores de tráfico.
  answer: A
  explanation: Según el manual, si se sorprende a una persona sin licencia conduciendo
    su vehículo, este puede ser confiscado por 30 días.
- id: 127
  category: driver_responsibility
  question: ¿Con qué frecuencia puede asistir a una escuela para infractores de tráfico
    para que una infracción de un punto no sea reportada a su compañía de seguros?
  choices:
    A: Una vez en cualquier período de 12 meses.
    B: Una vez en cualquier período de 18 meses.
    C: Una vez en cualquier período de 24 meses.
    D: Una vez en cualquier período de 36 meses.
  answer: B
  explanation: Si se le impone una infracción de tráfico de un punto, el juez puede
    ofrecerle la opción de asistir a una escuela para infractores de tráfico. Puede
    hacer esto una vez en cualquier período de 18 meses.
- id: 128
  category: vehicle_information
  question: ¿En qué lugar se le permite colocar un dispositivo electrónico de pago
    de peaje en su parabrisas?
  choices:
    A: Un cuadrado de 7 pulgadas en la esquina inferior de la ventana del lado del
      conductor.
    B: Un cuadrado de 5 pulgadas ubicado en la parte superior central de su parabrisas.
    C: En cualquier lugar del lado del pasajero del parabrisas.
    D: Colgando directamente del espejo retrovisor.
  answer: B
  explanation: Los objetos solo pueden colocarse en lugares específicos, incluyendo
    un cuadrado de 5 pulgadas ubicado en la parte superior central de su parabrisas
    para un dispositivo electrónico de pago de peaje.
- id: 129
  category: driver_responsibility
  question: ¿Cuál es el castigo por tirar o abandonar animales en una carretera?
  choices:
    A: Una multa de hasta $500.
    B: Una multa de hasta $1,000, seis meses de cárcel, o ambos.
    C: Servicio comunitario obligatorio y una multa de $250.
    D: Una advertencia y 1 punto en su historial de conductor.
  answer: B
  explanation: No debe tirar ni abandonar animales en una carretera. Este delito es
    punible con una multa de hasta $1,000, seis meses de cárcel, o ambos.
- id: 130
  category: sharing_the_road
  question: ¿Qué indica una señal en forma de diamante en un camión?
  choices:
    A: El camión transporta una carga de gran tamaño.
    B: El camión circula a baja velocidad.
    C: La carga del camión puede ser peligrosa (gas, explosivos, etc.).
    D: El camión realiza paradas frecuentes.
  answer: C
  explanation: Una señal en forma de diamante en un camión significa que la carga
    del camión puede ser peligrosa (gas, explosivos, etc.). Los vehículos con estas
    señales deben detenerse antes de cruzar las vías del tren.
- id: 131
  category: penalties_and_points
  question: ¿Qué sucede si un menor de edad tiene dos colisiones por las que sea responsable
    o dos condenas por infracciones de tráfico dentro de los primeros 12 meses de
    obtener su licencia?
  choices:
    A: Su licencia se suspende por 6 meses.
    B: No puede conducir durante 30 días a menos que un adulto con licencia, de al
      menos 25 años, lo acompañe.
    C: Su licencia es revocada hasta que cumpla 18 años.
    D: Debe pagar una multa y volver a tomar el examen de conducir.
  answer: B
  explanation: Según el manual, si un menor tiene dos colisiones por las que sea responsable,
    dos condenas por infracciones de tráfico, o una de cada una, no podrá conducir
    durante 30 días a menos que un adulto con licencia, de al menos 25 años de edad,
    lo acompañe.
- id: 132
  category: alcohol_drugs_health
  question: 'Si usted tiene entre 15 y 20 años de edad y es condenado por consumo
    de alcohol o de una sustancia controlada, el tribunal ordenará al DMV que:'
  choices:
    A: Suspenda su privilegio de conducir por un año o retrase su elegibilidad para
      solicitar una licencia.
    B: Revoque su licencia permanentemente.
    C: Le exija instalar un dispositivo de interbloqueo de encendido.
    D: Lo ponga en libertad condicional por 6 meses.
  answer: A
  explanation: El manual establece que por una condena por consumo de alcohol o de
    una sustancia controlada entre los 15 y 20 años de edad, el tribunal ordenará
    al DMV suspender su privilegio de conducir por un año o retrasar su elegibilidad
    para solicitar una licencia de conducir.
- id: 133
  category: driver_responsibility
  question: Si recibe una notificación por correo informándole que se está tomando
    una medida contra su privilegio de conducir, ¿cuántos días tiene para solicitar
    una audiencia administrativa?
  choices:
    A: 10 días desde la fecha de envío
    B: 14 días desde la fecha de envío
    C: 30 días desde la fecha de envío
    D: 60 días desde la fecha de envío
  answer: B
  explanation: Debe solicitar una audiencia dentro de los 10 días posteriores a la
    notificación personal o 14 días a partir de la fecha en que se envió la notificación
    por correo. Si no realiza la solicitud a tiempo, perderá su derecho a una audiencia.
- id: 134
  category: license_system
  question: La mayor parte de la información en su expediente de conductor está disponible
    para el público. ¿Cuál de los siguientes datos se mantiene confidencial?
  choices:
    A: Condenas por infracciones de tráfico
    B: Colisiones por las que sea responsable
    C: Sus condiciones físicas o mentales
    D: Historial de suspensión de la licencia
  answer: C
  explanation: La mayor parte de la información en su expediente de conductor está
    disponible para el público, excepto las condiciones físicas o mentales, la dirección
    y el número de seguro social.
- id: 135
  category: safe_driving_rules
  question: 'Para tener tiempo de reaccionar y evitar maniobras de último momento,
    debe explorar el camino al menos:'
  choices:
    A: 5 segundos por delante de su vehículo
    B: 10 segundos por delante de su vehículo
    C: 15 segundos por delante de su vehículo
    D: 20 segundos por delante de su vehículo
  answer: B
  explanation: Para tener tiempo de reaccionar, evitar maniobras de último momento
    y peligros, mantenga siempre los ojos en movimiento y explore el camino al menos
    10 segundos por delante de su vehículo.
- id: 136
  category: defensive_driving
  question: Si otro vehículo se incorpora delante de usted demasiado cerca, ¿qué debe
    hacer para crear espacio?
  choices:
    A: Tocar la bocina para advertir al conductor
    B: Frenar repentinamente
    C: Virar bruscamente al carril adyacente
    D: Levantar el pie del acelerador
  answer: D
  explanation: Si un vehículo se incorpora delante de usted demasiado cerca, levante
    el pie del acelerador. Esto crea espacio entre usted y el vehículo que va delante.
- id: 137
  category: defensive_driving
  question: ¿Cuál es la mejor manera de manejar a un conductor que lo sigue muy de
    cerca (tailgater) detrás de su vehículo?
  choices:
    A: Tocar los frenos ligeramente para advertirle
    B: Acelerar para aumentar la distancia entre ambos
    C: Mantener su trayectoria y velocidad, luego incorporarse a la derecha cuando
      sea seguro para dejarlo pasar
    D: Encender las luces de emergencia y detenerse
  answer: C
  explanation: Cuando un conductor lo sigue muy de cerca, mantenga su trayectoria
    y velocidad. Luego, cuando sea seguro hacerlo, incorpórese a la derecha para cambiar
    a otro carril y permitir que el conductor pase.
- id: 138
  category: safe_driving_rules
  question: ¿Cuál es la forma adecuada de revisar sus puntos ciegos antes de cambiar
    de carril?
  choices:
    A: Mirar por el espejo retrovisor durante 3 segundos
    B: Girar todo el cuerpo para mirar por la ventana trasera
    C: Mirar por encima de sus hombros derecho e izquierdo a través de las ventanas
      laterales
    D: Confiar únicamente en los espejos laterales
  answer: C
  explanation: Para revisar sus puntos ciegos, mire por encima de sus hombros derecho
    e izquierdo a través de las ventanas laterales. Solo gire la cabeza cuando mire;
    no gire todo el cuerpo ni el volante.
- id: 139
  category: safe_driving_rules
  question: Si los faros delanteros de un vehículo que viene en sentido contrario
    son demasiado brillantes por la noche, ¿hacia dónde debe mirar?
  choices:
    A: Directamente a los faros que vienen en sentido contrario
    B: Hacia el borde derecho de su carril
    C: Hacia la línea central de la carretera
    D: A su espejo retrovisor
  answer: B
  explanation: Si las luces de otro vehículo son demasiado brillantes, no mire directamente
    a los faros que vienen en sentido contrario. En su lugar, mire hacia el borde
    derecho de su carril.
- id: 140
  category: safe_driving_rules
  question: ¿Qué luces debe utilizar cuando conduce bajo la lluvia?
  choices:
    A: Luces altas (high-beam)
    B: Luces bajas (low-beam)
    C: Solo las luces de estacionamiento
    D: Luces de emergencia
  answer: B
  explanation: Cuando esté lloviendo, use las luces bajas de sus faros delanteros.
    No conduzca usando solo las luces de estacionamiento.
- id: 141
  category: vehicle_information
  question: Si su vehículo comienza a derrapar en una superficie resbaladiza, ¿cuál
    es el primer paso que debe tomar?
  choices:
    A: Frenar bruscamente de inmediato
    B: Retirar lentamente el pie del acelerador
    C: Girar el volante en la dirección opuesta al derrape
    D: Poner el vehículo en punto muerto (neutral)
  answer: B
  explanation: Si comienza a derrapar en una superficie resbaladiza, el primer paso
    es retirar lentamente el pie del acelerador. Tampoco debe usar los frenos.
- id: 142
  category: defensive_driving
  question: Al recuperarse de un derrape en una superficie resbaladiza, ¿en qué dirección
    debe girar el volante?
  choices:
    A: En la dirección del derrape
    B: En la dirección opuesta al derrape
    C: Mantener el volante perfectamente recto
    D: Rápidamente de un lado a otro
  answer: A
  explanation: Si comienza a derrapar, debe retirar lentamente el pie del acelerador,
    no usar los frenos y girar el volante en la dirección del derrape.
- id: 143
  category: license_system
  question: Si es menor de edad con una licencia restringida o suspendida, ¿qué sucede
    cuando cumple 18 años?
  choices:
    A: Todas las restricciones y suspensiones se borran de inmediato.
    B: Su historial de manejo se limpia por completo.
    C: Cumplir 18 años no borra ni termina las restricciones, suspensiones o sentencias
      de libertad condicional existentes.
    D: Debe volver a tomar los exámenes escrito y de manejo.
  answer: C
  explanation: 'El manual señala explícitamente: Cumplir 18 años no borra ni termina
    las restricciones, suspensiones o sentencias de libertad condicional existentes.'
- id: 144
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo con una sola luz se dirige hacia usted
    por la noche?
  choices:
    A: Encender y apagar las luces altas para advertirles
    B: Conducir lo más a la derecha posible
    C: Moverse hacia la línea central para darles espacio
    D: Encender las luces de emergencia
  answer: B
  explanation: Cuando un vehículo con una sola luz se dirige hacia usted, conduzca
    lo más a la derecha posible. Podría ser un ciclista, un motociclista o un vehículo
    al que le falta un faro.
- id: 145
  category: vehicle_information
  question: ¿Cuál es la causa más común de un derrape por bloqueo de ruedas?
  choices:
    A: Conducir sobre una placa de hielo negro (black ice)
    B: Acelerar demasiado rápido en pavimento mojado
    C: Frenar demasiado fuerte cuando va demasiado rápido
    D: Girar el volante de forma muy brusca
  answer: C
  explanation: Un derrape por bloqueo de ruedas suele ser causado por frenar demasiado
    fuerte cuando se va demasiado rápido.
- id: 146
  category: vehicle_information
  question: Si su vehículo está equipado con un sistema de frenos antibloqueo (ABS)
    en las cuatro ruedas y entra en un derrape por bloqueo de ruedas, ¿qué debe hacer?
  choices:
    A: Bombear los frenos rápidamente.
    B: Aplicar una presión firme en el pedal del freno.
    C: Retirar el pie del pedal del freno por completo.
    D: Usar el freno de emergencia para detenerse.
  answer: B
  explanation: Según el manual, para salir de un derrape por bloqueo de ruedas si
    su vehículo está equipado con un sistema de frenos antibloqueo (ABS) en las cuatro
    ruedas, debe aplicar una presión firme en el pedal del freno.
- id: 147
  category: vehicle_information
  question: Si sus frenos se mojan, ¿cómo puede secarlos de manera segura?
  choices:
    A: Presionar ligeramente los pedales del acelerador y del freno al mismo tiempo.
    B: Bombear el pedal del freno rápidamente durante un minuto.
    C: Cambiar a una marcha más baja y avanzar por inercia hasta que se sequen.
    D: Detenerse a un lado del camino y esperar a que el sol los seque.
  answer: A
  explanation: 'El manual establece: ''Si sus frenos se mojan, puede secarlos presionando
    ligeramente los pedales del acelerador y del freno al mismo tiempo. Solo haga
    esto hasta que los frenos se sequen''.'
- id: 148
  category: safe_driving_rules
  question: ¿Cómo debe ajustar su velocidad al conducir en una carretera con nieve
    compactada?
  choices:
    A: Reducir su velocidad de 5 a 10 mph.
    B: Reducir su velocidad a no más de 5 mph.
    C: Reducir su velocidad a la mitad.
    D: Mantener su velocidad normal pero aumentar su distancia de seguimiento.
  answer: C
  explanation: Al ajustar su velocidad para diferentes condiciones, el manual especifica
    que en nieve compactada, debe reducir su velocidad a la mitad.
- id: 149
  category: defensive_driving
  question: ¿Cuál de las siguientes áreas de la carretera tiende a congelarse antes
    que el resto del camino?
  choices:
    A: Intersecciones.
    B: Puentes y pasos elevados.
    C: Túneles.
    D: Autopistas de varios carriles.
  answer: B
  explanation: El manual advierte que los puentes y pasos elevados tienden a congelarse
    antes que el resto de la carretera y pueden tener placas de hielo.
- id: 150
  category: safe_driving_rules
  question: 'En una tormenta fuerte de lluvia o nieve, si no puede ver a más de 100
    pies frente a su vehículo, no es seguro conducir a más de:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 30 mph
    D: 45 mph
  answer: C
  explanation: El manual establece que si no puede ver a más de 100 pies en una tormenta
    fuerte de lluvia o nieve, no es seguro conducir a más de 30 mph.
- id: 151
  category: defensive_driving
  question: Si su vehículo comienza a hidroplanear (hydroplane), ¿cuál es la acción
    correcta que debe tomar?
  choices:
    A: Presionar los frenos con firmeza.
    B: Girar el volante bruscamente en la dirección del derrape.
    C: Reducir la velocidad gradualmente y no usar los frenos.
    D: Acelerar ligeramente para recuperar la tracción.
  answer: C
  explanation: Si su vehículo comienza a hidroplanear, debe reducir la velocidad gradualmente
    y no usar los frenos, ya que un frenado repentino puede hacer que pierda el control.
- id: 152
  category: defensive_driving
  question: ¿Cuál es el primer paso que debe tomar si su vehículo se queda atascado
    en la nieve o el lodo?
  choices:
    A: Cambiar a una marcha alta y hacer girar las ruedas.
    B: Cambiar a una marcha baja y mantener las ruedas delanteras rectas.
    C: Colocar tablas o ramas de árboles debajo de las llantas mientras se mueve.
    D: Girar el volante bruscamente de izquierda a derecha.
  answer: B
  explanation: El primer paso indicado en el manual para desatascarse de la nieve
    o el lodo es cambiar a una marcha baja y mantener las ruedas delanteras rectas.
- id: 153
  category: defensive_driving
  question: Al conducir con vientos fuertes, ¿por qué debe evitar el uso del control
    de crucero (cruise control)?
  choices:
    A: Agota la batería del vehículo más rápido.
    B: Le impide mantener el control máximo del acelerador si ocurre una ráfaga.
    C: Hace que el volante se bloquee.
    D: Aplica automáticamente los frenos durante las ráfagas fuertes.
  answer: B
  explanation: El manual aconseja no utilizar el control de crucero (cruise control)
    cuando hay vientos fuertes para que pueda mantener el control máximo del acelerador
    en caso de que ocurra una ráfaga.
- id: 154
  category: safe_driving_rules
  question: Si debe conducir en medio de niebla densa o humo, ¿qué luces debe utilizar?
  choices:
    A: Luces delanteras de alta intensidad (luces altas).
    B: Solo las luces de estacionamiento o las luces antiniebla.
    C: Luces delanteras de baja intensidad (luces bajas).
    D: Solo las luces de emergencia (intermitentes).
  answer: C
  explanation: Al conducir en medio de niebla densa o humo, debe usar las luces bajas.
    Las luces altas se reflejarán y causarán deslumbramiento, y nunca debe conducir
    usando solo las luces de estacionamiento o las antiniebla.
- id: 155
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un oficial de la ley realiza una interrupción del
    tráfico (traffic break) zigzagueando lentamente por los carriles?
  choices:
    A: Acelerar para rebasar al vehículo de patrulla.
    B: Encender las luces de emergencia para advertir a otros conductores.
    C: Frenar repentinamente para detenerse de inmediato.
    D: Moverse al acotamiento y detener su vehículo.
  answer: B
  explanation: Durante una interrupción del tráfico (traffic break) realizada por
    la policía, debe encender las luces de emergencia para advertir a otros conductores
    y disminuir la velocidad gradualmente.
- id: 156
  category: penalties_and_points
  question: 'Usted puede recibir una multa si un pasajero en su vehículo no lleva
    puesto el cinturón de seguridad y es menor de:'
  choices:
    A: 16 años de edad
    B: 18 años de edad
    C: 21 años de edad
    D: 14 años de edad
  answer: A
  explanation: 'El manual establece: ''Si su pasajero es menor de 16 años, usted también
    puede recibir una multa si este no lleva puesto su cinturón de seguridad''.'
- id: 157
  category: driver_responsibility
  question: ¿Cómo debe usar correctamente el cinturón de seguridad una mujer embarazada?
  choices:
    A: Con el cinturón de regazo en la parte alta del abdomen.
    B: Con el cinturón de regazo lo más bajo posible debajo del abdomen.
    C: Sin la correa del hombro.
    D: Con la correa del hombro detrás de la espalda.
  answer: B
  explanation: Si está embarazada, el manual indica que debe usar el cinturón de regazo
    lo más bajo posible debajo del abdomen y colocar la correa del hombro entre los
    senos y a un lado de la protuberancia del abdomen.
- id: 158
  category: safe_driving_rules
  question: 'Un niño debe estar asegurado en un sistema de retención infantil orientado
    hacia atrás si tiene menos de 2 años, mide menos de 3 pies y 4 pulgadas de altura
    y pesa menos de:'
  choices:
    A: 30 libras
    B: 40 libras
    C: 50 libras
    D: 60 libras
  answer: B
  explanation: Los niños menores de 2 años, que pesen menos de 40 libras y midan menos
    de 3 pies y 4 pulgadas de altura deben estar asegurados en un sistema de retención
    infantil orientado hacia atrás.
- id: 159
  category: safe_driving_rules
  question: ¿Bajo qué condición puede un niño en un sistema de retención infantil
    orientado hacia atrás viajar en el asiento delantero de un vehículo equipado con
    bolsas de aire (airbags)?
  choices:
    A: Si el niño tiene más de 1 año.
    B: Si todos los asientos traseros están ocupados por otros niños.
    C: Si el vehículo no tiene asiento trasero.
    D: Nunca pueden viajar en el asiento delantero de un vehículo equipado con bolsas
      de aire.
  answer: D
  explanation: 'El manual señala explícitamente: ''Un niño en un sistema de retención
    infantil orientado hacia atrás no puede viajar en el asiento delantero de un vehículo
    equipado con bolsas de aire (airbags)''.'
- id: 160
  category: safe_driving_rules
  question: ¿A qué edad o estatura se le permite a un niño usar un cinturón de seguridad
    debidamente asegurado que cumpla con los estándares federales en lugar de un sistema
    de retención infantil?
  choices:
    A: 6 años de edad o al menos 4 pies y 5 pulgadas de estatura.
    B: 7 años de edad o al menos 4 pies y 7 pulgadas de estatura.
    C: 8 años de edad o al menos 4 pies y 9 pulgadas de estatura.
    D: 9 años de edad o al menos 5 pies de estatura.
  answer: C
  explanation: Los niños que tienen 8 años de edad o más, o que miden al menos 4 pies
    y 9 pulgadas de estatura, pueden usar un cinturón de seguridad debidamente asegurado
    que cumpla con los estándares federales.
- id: 161
  category: vehicle_information
  question: ¿A qué distancia debe sentarse de la cubierta de la bolsa de aire para
    mantener la seguridad al conducir?
  choices:
    A: Al menos 5 pulgadas
    B: Al menos 10 pulgadas
    C: Al menos 12 pulgadas
    D: Al menos 15 pulgadas
  answer: B
  explanation: El manual establece que debe viajar a una distancia de al menos 10
    pulgadas de la cubierta de la bolsa de aire, medida desde el centro del volante
    hasta el esternón, siempre que pueda mantener el control total de su vehículo.
- id: 162
  category: driver_responsibility
  question: 'Es ilegal dejar a un niño de seis años o menos desatendido en un vehículo,
    a menos que esté supervisado por una persona que tenga al menos:'
  choices:
    A: 10 años de edad
    B: 12 años de edad
    C: 14 años de edad
    D: 16 años de edad
  answer: B
  explanation: El manual especifica que es ilegal dejar a un niño de seis años o menos
    desatendido en un vehículo, pero un niño puede ser dejado bajo la supervisión
    de una persona que tenga al menos 12 años de edad.
- id: 163
  category: safe_driving_rules
  question: ¿Cuál es la Ley de Velocidad Básica (Basic Speed Law) de California?
  choices:
    A: Siempre debe conducir al límite de velocidad indicado.
    B: Nunca debe conducir más rápido de lo que sea seguro para las condiciones actuales
      de la carretera.
    C: Debe conducir 5 mph por debajo del límite de velocidad indicado en condiciones
      de mal tiempo.
    D: Puede exceder el límite de velocidad por 5 mph para rebasar a otro vehículo
      de manera segura.
  answer: B
  explanation: En California, nunca debe conducir más rápido de lo que sea seguro
    para las condiciones actuales de la carretera. Esto se conoce como la Ley de Velocidad
    Básica (Basic Speed Law).
- id: 164
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en una carretera de dos carriles sin división en California?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: A
  explanation: El manual establece que, a menos que se indique lo contrario, el límite
    de velocidad es de 55 mph en una carretera de dos carriles sin división y para
    vehículos que remolcan tráileres.
- id: 165
  category: defensive_driving
  question: Si se encuentra en una carretera de dos carriles con un vehículo que viene
    en sentido contrario a su izquierda y un ciclista adelante a su derecha, ¿cuál
    es la forma más segura de manejar la situación?
  choices:
    A: Acelerar para rebasar al ciclista antes de que llegue el vehículo que viene
      en sentido contrario.
    B: Conducir exactamente entre el vehículo que viene en sentido contrario y el
      ciclista.
    C: Tocar la bocina para que el ciclista se salga de la carretera.
    D: Reducir la velocidad y dejar pasar al vehículo que viene en sentido contrario,
      luego moverse a la izquierda para rebasar al ciclista.
  answer: D
  explanation: En lugar de conducir entre el vehículo y el ciclista, enfrente un peligro
    a la vez. Reduzca la velocidad y deje pasar al vehículo que viene en sentido contrario,
    luego muévase a la izquierda para dejar suficiente espacio (al menos tres pies)
    para rebasar al ciclista.
- id: 166
  category: defensive_driving
  question: ¿Cuál de las siguientes acciones debe realizar si se le revienta un neumático?
  choices:
    A: Frenar en seco inmediatamente para detener el vehículo.
    B: Retirar el pie del acelerador de forma abrupta.
    C: Sujetar el volante con ambas manos y soltar gradualmente el acelerador.
    D: Girar el volante bruscamente hacia el acotamiento de la carretera.
  answer: C
  explanation: Si se le revienta un neumático, debe sujetar el volante con ambas manos,
    mantener su velocidad si es posible y soltar gradualmente el acelerador. Frenar
    repentinamente o retirar el pie del acelerador de forma abrupta puede provocar
    la pérdida del control.
- id: 167
  category: defensive_driving
  question: Si sus ruedas se salen del pavimento, ¿cuál es el primer paso que debe
    tomar?
  choices:
    A: Sujetar el volante con firmeza.
    B: Frenar fuerte para detener el vehículo.
    C: Girar el volante bruscamente hacia la izquierda.
    D: Acelerar para volver al pavimento rápidamente.
  answer: A
  explanation: Si sus ruedas se salen del pavimento, el primer paso es sujetar el
    volante con firmeza, seguido de retirar el pie del acelerador y frenar suavemente.
- id: 168
  category: vehicle_information
  question: ¿Qué debe hacer si conduce en condiciones de calor extremo para prevenir
    o manejar el sobrecalentamiento?
  choices:
    A: Encender la calefacción para extraer el calor del motor.
    B: Apagar el aire acondicionado.
    C: Conducir a altas velocidades para aumentar el flujo de aire al radiador.
    D: Abrir ligeramente las ventanas para evitar que se empañen.
  answer: B
  explanation: En condiciones de calor extremo, debe vigilar el indicador de temperatura,
    evitar conducir a altas velocidades durante periodos prolongados y apagar el aire
    acondicionado.
- id: 169
  category: safe_driving_rules
  question: Si su vehículo deja de funcionar en la autopista y debe salir de él, ¿por
    qué lado debe salir?
  choices:
    A: El lado izquierdo, de cara al tráfico.
    B: El lado derecho, lejos del tráfico.
    C: La puerta del lado del conductor, independientemente de dónde esté estacionado.
    D: La puerta trasera o el área de la cajuela.
  answer: B
  explanation: Si su vehículo queda averiado en la autopista, debe orillarse de manera
    segura en el acotamiento derecho y salir por el lado derecho para estar lejos
    del tráfico si debe salir del vehículo.
- id: 170
  category: driver_responsibility
  question: ¿Cuál de los siguientes servicios proporcionará de forma gratuita la Patrulla
    de Servicio en Autopistas (FSP) de la Patrulla de Caminos de California durante
    las horas de mayor tráfico?
  choices:
    A: Remolcar su vehículo a un servicio de reparación privado.
    B: Recomendar un buen taller de carrocería.
    C: Remolcar una motocicleta averiada.
    D: Pasar corriente a su vehículo si la batería está descargada.
  answer: D
  explanation: La FSP pasará corriente a su vehículo si la batería está descargada,
    proporcionará un galón de gasolina, rellenará su radiador, cambiará un neumático
    desinflado o informará sobre una colisión. No remolcarán a un servicio de reparación
    privado, ni recomendarán talleres, ni remolcarán motocicletas.
- id: 171
  category: defensive_driving
  question: ¿Qué debe hacer inmediatamente si su vehículo se apaga en una vía de tren
    y se aproxima un tren con las luces de advertencia parpadeando?
  choices:
    A: Permanecer en el vehículo y llamar al 911.
    B: Salir del vehículo y correr diagonalmente lejos de las vías en la dirección
      de donde viene el tren.
    C: Salir del vehículo y correr en la misma dirección en la que viaja el tren.
    D: Intentar empujar el vehículo fuera de las vías antes de que llegue el tren.
  answer: B
  explanation: Si se aproxima un tren y las luces de advertencia están parpadeando,
    debe salir inmediatamente de su vehículo, correr lejos de las vías diagonalmente
    en la dirección de donde viene el tren y luego llamar al 911.
- id: 172
  category: safe_driving_rules
  question: ¿Cuál es el requisito legal para los conductores adultos que usan un teléfono
    celular mientras conducen?
  choices:
    A: Pueden sostener el teléfono siempre que estén en una llamada de voz.
    B: Solo deben usar el teléfono celular en modo manos libres.
    C: Pueden enviar mensajes de texto si el vehículo se mueve a menos de 10 mph.
    D: Tienen completamente prohibido usar un teléfono celular, incluso en modo manos
      libres.
  answer: B
  explanation: Conducir mientras se usa un teléfono celular con la mano es inseguro
    e ilegal. Los conductores adultos solo deben usar un teléfono celular en modo
    manos libres cuando sea necesario.
- id: 173
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia se le permite a un menor usar un teléfono celular
    mientras conduce?
  choices:
    A: Cuando usa un dispositivo de manos libres.
    B: Cuando está detenido en un semáforo en rojo.
    C: Para hacer una llamada de asistencia de emergencia.
    D: Cuando se comunica con un padre o tutor.
  answer: C
  explanation: Es contra la ley que un menor use un teléfono celular o un dispositivo
    electrónico inalámbrico mientras conduce, con la excepción de que los menores
    pueden usar un teléfono celular para hacer una llamada de asistencia de emergencia.
- id: 174
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de intoxicación por monóxido de
    carbono?
  choices:
    A: Sudoración excesiva
    B: Zumbido en los oídos
    C: Visión borrosa
    D: Calambres musculares
  answer: B
  explanation: Los síntomas de intoxicación por monóxido de carbono incluyen cansancio,
    bostezos, mareos, náuseas, dolor de cabeza y zumbido en los oídos.
- id: 175
  category: penalties_and_points
  question: ¿Qué sucede si se niega a hacerse una prueba de sangre u orina cuando
    se sospecha que conduce bajo la influencia (DUI)?
  choices:
    A: Se le multará con $1,000.
    B: Su vehículo será confiscado por 30 días.
    C: Su privilegio de conducir será suspendido o revocado por un año.
    D: Se le requerirá instalar un dispositivo de bloqueo de encendido.
  answer: C
  explanation: Si un oficial de la ley sospecha que usted conduce bajo la influencia
    (DUI) y se niega a hacerse una prueba de sangre u orina, el DMV suspenderá o revocará
    su privilegio de conducir por un año.
- id: 176
  category: penalties_and_points
  question: Si tiene entre 13 y 20 años y es condenado por operar una bicicleta bajo
    la influencia del alcohol, ¿cuál es la sanción?
  choices:
    A: Su bicicleta será confiscada.
    B: Debe cumplir una sentencia de cárcel de 6 meses.
    C: Su privilegio de conducir puede ser suspendido o retrasado por un año.
    D: Perderá permanentemente su elegibilidad para una licencia de conducir.
  answer: C
  explanation: Si tiene entre 13 y 20 años y es condenado por operar una bicicleta
    bajo la influencia del alcohol o las drogas, su privilegio de conducir puede ser
    suspendido o retrasado por un año una vez que sea elegible para conducir.
- id: 177
  category: safe_driving_rules
  question: ¿Dónde debe guardar un recipiente de alcohol abierto en su vehículo?
  choices:
    A: En la guantera.
    B: Debajo del asiento del pasajero delantero.
    C: En el maletero o en un lugar donde los pasajeros no se sienten.
    D: En la consola central.
  answer: C
  explanation: Si un recipiente de alcohol está abierto, debe guardarlo en el maletero
    o en un lugar donde los pasajeros no se sienten. Es ilegal guardar un recipiente
    de alcohol abierto en la guantera.
- id: 178
  category: alcohol_drugs_health
  question: Es ilegal que una persona de 21 años o más conduzca con una concentración
    de alcohol en sangre (BAC) de ___ o superior.
  choices:
    A: 0.01%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: Es ilegal que usted conduzca si tiene un BAC de 0.08% o superior si
    es mayor de 21 años.
- id: 179
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    alguien que conduce un vehículo que requiere una licencia de conducir comercial?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Es ilegal conducir con un BAC de 0.04% o superior si conduce un vehículo
    que requiere una licencia de conducir comercial.
- id: 180
  category: penalties_and_points
  question: Si es arrestado por un DUI, ¿cuántos días tiene para solicitar una audiencia
    administrativa del DMV?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Si es arrestado por un DUI, puede solicitar una audiencia administrativa
    del DMV dentro de los 10 días a partir de la fecha de su arresto.
- id: 181
  category: penalties_and_points
  question: ¿Cuánto tiempo permanece una condena por DUI en su historial de conductor?
  choices:
    A: 3 años
    B: 5 años
    C: 7 años
    D: 10 años
  answer: D
  explanation: Todas las condenas por DUI permanecen en su historial de conductor
    durante 10 años.
- id: 182
  category: alcohol_drugs_health
  question: Si es menor de 21 años, ¿cuándo se le permite legalmente llevar una bebida
    alcohólica dentro de un vehículo?
  choices:
    A: Cuando el envase está oculto en la guantera.
    B: Cuando está acompañado por una persona de 21 años o más.
    C: Cuando conduce hacia una fiesta.
    D: Cuando el alcohol está en el asiento trasero.
  answer: B
  explanation: Si es menor de 21 años, no puede llevar ninguna bebida alcohólica dentro
    de un vehículo a menos que una persona de 21 años o más esté con usted (o si trabaja
    para alguien con una licencia de venta de licores fuera del establecimiento).
- id: 183
  category: penalties_and_points
  question: Si es menor de 21 años y lo sorprenden con alcohol en su vehículo sin
    una persona de 21 años o más, ¿cuál es una posible sanción?
  choices:
    A: Su vehículo puede ser confiscado por hasta 30 días.
    B: Será sentenciado a 6 meses de cárcel.
    C: Se le requerirá instalar un dispositivo de interbloqueo de encendido.
    D: Su vehículo será confiscado permanentemente.
  answer: A
  explanation: Si es menor de 21 años y lo sorprenden con alcohol en su vehículo,
    las autoridades pueden confiscar su vehículo por hasta 30 días, y el tribunal
    puede multarlo y suspender su licencia de conducir por un año.
- id: 184
  category: driver_responsibility
  question: ¿Cuál es la cobertura mínima de seguro requerida para daños a la propiedad
    en California?
  choices:
    A: $10,000
    B: $15,000
    C: $30,000
    D: $60,000
  answer: B
  explanation: Su seguro debe cubrir al menos $15,000 por daños a la propiedad, junto
    con $30,000 por una sola muerte/lesión y $60,000 por muerte/lesión de más de una
    persona.
- id: 185
  category: penalties_and_points
  question: ¿Cuál es la sanción si se ve involucrado en una colisión y no tiene la
    cobertura de seguro adecuada?
  choices:
    A: Su privilegio de conducir será suspendido por hasta cuatro años.
    B: Se le multará con $5,000.
    C: Su vehículo será confiscado por un año.
    D: Recibirá una advertencia en su historial de manejo.
  answer: A
  explanation: Su privilegio de conducir será suspendido por hasta cuatro años si
    se ve involucrado en una colisión y no tiene la cobertura de seguro adecuada,
    independientemente de quién haya tenido la culpa.
- id: 186
  category: alcohol_drugs_health
  question: ¿Cómo considera la ley de California el conducir bajo la influencia de
    medicamentos recetados en comparación con las drogas ilegales?
  choices:
    A: Los medicamentos recetados están exentos de las leyes de DUI.
    B: La ley no ve ninguna diferencia si el medicamento afecta su capacidad para
      conducir de manera segura.
    C: Solo se le puede acusar de un DUI por drogas ilegales.
    D: Los medicamentos de venta libre son legales para usar mientras conduce, independientemente
      de sus efectos.
  answer: B
  explanation: La ley no ve ninguna diferencia entre las drogas ilegales y los medicamentos
    que obtiene de un médico o farmacia. Todos pueden afectar su capacidad para conducir
    de manera segura y reaccionar a lo que ve y oye.
- id: 187
  category: safe_driving_rules
  question: La ley que prohíbe los envases abiertos de alcohol en un vehículo NO se
    aplica a los pasajeros de ¿cuál de los siguientes vehículos?
  choices:
    A: Una camioneta pickup
    B: Una furgoneta de entrega comercial
    C: Un autobús, taxi, casa rodante o autocaravana
    D: Un vehículo de transporte compartido (rideshare)
  answer: C
  explanation: La ley relativa a los envases abiertos de alcohol no se aplica si usted
    es pasajero en un autobús, taxi, casa rodante o autocaravana.
- id: 188
  category: alcohol_drugs_health
  question: ¿Puede ser arrestado y condenado por un DUI si su concentración de alcohol
    en sangre (BAC) está por debajo del límite legal?
  choices:
    A: No, solo puede ser arrestado si su BAC está en o por encima del límite legal.
    B: Sí, dependiendo de qué tan afectado se encuentre.
    C: Sí, pero solo si es menor de 21 años.
    D: No, se requiere estrictamente una medición de BAC para cualquier condena por
      DUI.
  answer: B
  explanation: Incluso si su BAC está por debajo de los límites legales, eso no significa
    que sea seguro para usted conducir. Dependiendo de qué tan afectado se encuentre,
    puede ser arrestado y condenado por un DUI incluso sin una medición de BAC.
- id: 189
  category: vehicle_information
  question: Cuando compra un vehículo, ¿cuántos días tiene para transferir la propiedad
    a su nombre?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 20 días
  answer: B
  explanation: Según el manual, cuando compra un vehículo, tiene 10 días para transferir
    la propiedad a su nombre.
- id: 190
  category: vehicle_information
  question: ¿Cuántos días tiene para notificar al DMV después de vender un vehículo?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: A
  explanation: Cuando vende un vehículo, debe notificar al DMV dentro de los cinco
    días completando un Aviso de Transferencia y Relevo de Responsabilidad.
- id: 191
  category: vehicle_information
  question: Si se convierte en residente o consigue un trabajo en California, ¿cuánto
    tiempo tiene para registrar su vehículo de otro estado?
  choices:
    A: 10 días
    B: 15 días
    C: 20 días
    D: 30 días
  answer: C
  explanation: Tiene 20 días para registrar su vehículo después de convertirse en
    residente o conseguir un trabajo en California.
- id: 192
  category: driver_responsibility
  question: 'Debe reportar una colisión al DMV dentro de los 10 días si:'
  choices:
    A: La colisión causó más de $500 en daños a la propiedad.
    B: La colisión causó más de $1,000 en daños a la propiedad o alguien resultó herido
      o falleció.
    C: Usted fue el culpable de la colisión.
    D: La colisión ocurrió en una carretera pública y causó retrasos en el tráfico.
  answer: B
  explanation: Si se ve involucrado en una colisión, debe reportarla al DMV dentro
    de los 10 días si la colisión causó más de $1,000 en daños a la propiedad, o si
    alguien resultó herido o falleció.
- id: 193
  category: driver_responsibility
  question: ¿Qué debe hacer si su vehículo choca contra un auto estacionado y no puede
    encontrar al dueño?
  choices:
    A: Esperar junto al vehículo hasta que el dueño regrese.
    B: Dejar una nota con su nombre, número de teléfono y dirección, y reportar la
      colisión a las autoridades.
    C: Retirarse si no hay daños visibles en el auto estacionado.
    D: Llamar a su compañía de seguros y abandonar la escena de inmediato.
  answer: B
  explanation: Si no puede encontrar al dueño, deje una nota con su nombre, número
    de teléfono y dirección bien sujeta al vehículo o propiedad, y reporte la colisión
    a las autoridades.
- id: 194
  category: safe_driving_rules
  question: Si hiere a un animal con su vehículo, ¿cuál es el procedimiento adecuado?
  choices:
    A: Mover al animal a un lado de la carretera e irse.
    B: Llamar a la sociedad protectora de animales (humane society) o a las autoridades
      más cercanas y no intentar mover al animal herido.
    C: Llevar al animal a la clínica veterinaria más cercana.
    D: Tocar la bocina para alertar a otros y continuar conduciendo.
  answer: B
  explanation: Si mata o hiere a un animal, llame a la sociedad protectora de animales
    o a las autoridades más cercanas. No intente mover a un animal herido.
- id: 195
  category: safe_driving_rules
  question: Si se ve involucrado en una colisión y nadie resulta herido, ¿qué debe
    hacer primero?
  choices:
    A: Dejar su vehículo exactamente donde está y llamar al 911.
    B: Mover su vehículo fuera del tráfico y luego llamar al 911.
    C: Intercambiar información del seguro en medio de la carretera.
    D: Conducir a casa y reportar la colisión en línea.
  answer: B
  explanation: Si se ve involucrado en una colisión, debe mover su vehículo fuera
    del tráfico si nadie está herido. Luego llame al 911.
- id: 196
  category: penalties_and_points
  question: Si recibe un Aviso de Reexamen Prioritario de Conductor, ¿cuánto tiempo
    tiene para contactar al DMV antes de que su privilegio de conducir sea suspendido
    automáticamente?
  choices:
    A: 48 horas
    B: 5 días hábiles
    C: 10 días
    D: 30 días
  answer: B
  explanation: Tiene cinco días hábiles para contactar al DMV para iniciar el proceso
    o su privilegio de conducir será suspendido automáticamente.
- id: 197
  category: driver_testing
  question: ¿Cuál de los siguientes puede ser el motivo para un reexamen de conductor
    del DMV?
  choices:
    A: Que la edad de un conductor llegue a los 70 años.
    B: Una condición física o mental o un historial de manejo deficiente.
    C: Comprar un vehículo nuevo.
    D: Mudarse a una nueva ciudad dentro de California.
  answer: B
  explanation: Una condición física o mental o un historial de manejo deficiente pueden
    ser la base para un reexamen, no la edad del conductor.
- id: 198
  category: license_system
  question: 'Las restricciones de la licencia de conducir, como el uso de anteojos
    o la limitación de la conducción nocturna, se basan en:'
  choices:
    A: La edad del conductor.
    B: El código postal del conductor.
    C: Las condiciones y los hallazgos del examinador, no en la edad.
    D: El tipo de vehículo que posee el conductor.
  answer: C
  explanation: No existen restricciones específicas para personas mayores. Todas las
    restricciones se basan en las condiciones, no en la edad, y se fundamentan en
    los hallazgos y recomendaciones del examinador.
- id: 199
  category: driver_responsibility
  question: Si alguien resulta herido o fallece en una colisión, ¿en qué plazo debe
    presentar un informe a las autoridades?
  choices:
    A: Inmediatamente
    B: 24 horas
    C: 5 días
    D: 10 días
  answer: B
  explanation: Debe presentar un informe a las autoridades dentro de las 24 horas
    posteriores a la colisión si alguien resulta herido o fallece.
- id: 200
  category: driver_responsibility
  question: 'Al presentar un Informe de Accidente de Tráfico Ocurrido en California
    (SR 1) ante el DMV, debe presentar el informe:'
  choices:
    A: Solo si usted causó la colisión.
    B: Solo si la colisión ocurrió en una vía pública.
    C: Independientemente de si usted causó la colisión o no, incluso si ocurrió en
      una propiedad privada.
    D: Solo si las autoridades no hicieron un informe por usted.
  answer: C
  explanation: Usted (o su representante) debe presentar un informe independientemente
    de si causó la colisión o no. Esto se aplica incluso si la colisión ocurrió en
    una propiedad privada.
- id: 201
  category: defensive_driving
  question: ¿Según el manual, cuál de las siguientes es una de las causas más comunes
    de colisiones?
  choices:
    A: Conducir durante las horas del día.
    B: Un vehículo que viaja más rápido o más lento que el flujo del tráfico.
    C: Usar dispositivos de manos libres.
    D: Detenerse en las señales de alto.
  answer: B
  explanation: Las causas más comunes de colisiones incluyen distracciones del conductor,
    velocidad insegura, giros incorrectos y un vehículo que viaja más rápido o más
    lento que el flujo del tráfico.
- id: 202
  category: safe_driving_rules
  question: ¿Qué debe hacer si ve las luces de emergencia (intermitentes) de un vehículo
    más adelante?
  choices:
    A: Aumentar la velocidad para rebasar el vehículo rápidamente.
    B: Encender sus propias luces de emergencia y detenerse inmediatamente.
    C: Reducir la velocidad y pasar con cuidado, ya que puede haber una colisión o
      emergencia.
    D: Tocar la bocina para alertar al conductor.
  answer: C
  explanation: Si ve las luces de emergencia de un vehículo más adelante, reduzca
    la velocidad. Puede haber una colisión u otra emergencia vial. Pase con cuidado.
- id: 203
  category: license_system
  question: Después de realizar una reevaluación del conductor, ¿cuál de las siguientes
    es una acción que el DMV puede tomar?
  choices:
    A: Confiscar el vehículo del conductor.
    B: Emitir una licencia de conducir de término limitado.
    C: Exigir que el conductor compre un vehículo nuevo.
    D: Obligar al conductor a volver a tomar un curso de educación vial.
  answer: B
  explanation: Después de una reevaluación, el DMV puede tomar varias acciones, incluyendo
    emitir una licencia de conducir de término limitado, suspender o revocar los privilegios
    de conducir, o no tomar ninguna acción.
- id: 204
  category: license_system
  question: ¿Cómo determina el DMV si un conductor de edad avanzada necesita que se
    le impongan restricciones en su licencia de conducir?
  choices:
    A: Las restricciones se aplican automáticamente cuando un conductor cumple 70
      años.
    B: Las restricciones se basan enteramente en la edad del conductor.
    C: Las restricciones se basan en las condiciones y los hallazgos del examinador,
      no en la edad.
    D: Las restricciones se basan en la cantidad de años que la persona ha estado
      conduciendo.
  answer: C
  explanation: Según el manual, no existen restricciones específicas para las personas
    mayores. Todas las restricciones se basan en las condiciones, no en la edad, y
    dependen de los hallazgos y recomendaciones del examinador.
- id: 205
  category: safe_driving_rules
  question: ¿Cuál de las siguientes se considera una señal de advertencia de un conductor
    inseguro?
  choices:
    A: Conducir durante las horas del día cuando el tráfico es ligero.
    B: Perderse en lugares familiares.
    C: Instalar un espejo adicional en el lado derecho.
    D: Elegir una ruta bien iluminada para conducir de noche.
  answer: B
  explanation: El manual enumera perderse en lugares familiares, abolladuras y raspaduras
    en el automóvil o la propiedad, y situaciones de riesgo frecuente o colisiones
    como señales de advertencia de un conductor inseguro.
- id: 206
  category: defensive_driving
  question: ¿Cuál es una estrategia que los conductores de edad avanzada pueden considerar
    para adaptarse a sus cambiantes habilidades de conducción?
  choices:
    A: Conducir principalmente en autopistas.
    B: Conducir durante el momento del día en que el tráfico es ligero.
    C: Quitar los espejos exteriores para reducir las distracciones.
    D: Conducir distancias más largas para mantener sus habilidades.
  answer: B
  explanation: Los conductores de edad avanzada pueden considerar varias estrategias
    para mantenerse seguros, incluyendo conducir durante el momento del día en que
    el tráfico es ligero, evitar intersecciones difíciles y limitar la conducción
    a lugares esenciales.
- id: 207
  category: license_system
  question: ¿Qué se requiere si tiene 70 años o más en el momento en que vence su
    licencia de conducir?
  choices:
    A: Debe renovar su licencia de conducir en persona y aprobar un examen de la vista.
    B: Debe volver a tomar el examen de manejo al volante.
    C: Debe entregar su licencia y obtener una tarjeta de identificación para personas
      mayores.
    D: Solo puede renovar su licencia en línea.
  answer: A
  explanation: Si tiene 70 años o más en el momento en que vence su licencia de conducir,
    se requiere que renueve su licencia de conducir en persona y apruebe un examen
    de la vista.
- id: 208
  category: license_system
  question: ¿Aproximadamente cuántos días antes de que venza su licencia de conducir
    envía el DMV un aviso de renovación?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El DMV envía un aviso de renovación a su dirección registrada aproximadamente
    90 días antes de que venza su licencia de conducir.
- id: 209
  category: driver_responsibility
  question: ¿Cuál es la función principal del Enlace Comunitario (Community Liaison)
    del DMV?
  choices:
    A: Representar a los conductores en las audiencias y reevaluaciones del DMV.
    B: Emitir multas de tráfico a conductores inseguros.
    C: Representar los intereses de seguridad pública, enfocándose en las preocupaciones
      de los conductores de edad avanzada y adolescentes.
    D: Administrar exámenes de manejo al volante para personas mayores.
  answer: C
  explanation: La función principal del Enlace Comunitario es representar los intereses
    de seguridad pública para todos los californianos, con un enfoque en abordar las
    preocupaciones de los conductores de edad avanzada y adolescentes.
- id: 210
  category: alcohol_drugs_health
  question: ¿Quién es a menudo responsable de evitar que las personas mayores con
    demencia progresiva conduzcan?
  choices:
    A: El Enlace Comunitario del DMV.
    B: Los cuidadores, médicos y las fuerzas del orden.
    C: El proveedor de seguro de automóvil del conductor.
    D: Los instructores del Programa para Conductores Maduros.
  answer: B
  explanation: Las personas con demencia progresiva eventualmente pierden su capacidad
    para conducir de manera segura. A menudo depende de los cuidadores, médicos y
    las fuerzas del orden evitar que estas personas mayores conduzcan.
- id: 211
  category: safe_driving_rules
  question: El Programa de Mejora para Conductores Mayores (Mature Driver Improvement
    Program) es un curso de ocho horas diseñado para conductores de ¿qué edad?
  choices:
    A: 50 años o más
    B: 55 años o más
    C: 62 años o más
    D: 70 años o más
  answer: B
  explanation: El Programa de Mejora para Conductores Mayores es un curso de ocho
    horas para conductores de 55 años o más.
- id: 212
  category: license_system
  question: ¿Por cuánto tiempo es válido el certificado de finalización del Programa
    de Mejora para Conductores Mayores?
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cinco años
  answer: C
  explanation: Su certificado por completar el Programa de Mejora para Conductores
    Mayores es válido por tres años y puede renovarse completando otro curso de cuatro
    horas.
- id: 213
  category: license_system
  question: ¿A qué edad es elegible para una tarjeta de identificación para personas
    mayores (Senior ID card) sin costo en California?
  choices:
    A: 55 años
    B: 60 años
    C: 62 años
    D: 70 años
  answer: C
  explanation: Si tiene 62 años o más, es elegible para una tarjeta de identificación
    para personas mayores sin costo.
- id: 214
  category: alcohol_drugs_health
  question: ¿Qué significa una concentración de alcohol en sangre (BAC) de 0.10%?
  choices:
    A: Tiene 0.10 gramos de alcohol en 100 mililitros de sangre.
    B: Tiene 0.10 onzas de alcohol en 100 onzas de sangre.
    C: Tiene 1.0 gramos de alcohol en 10 mililitros de sangre.
    D: Tiene 10 gramos de alcohol en 100 mililitros de sangre.
  answer: A
  explanation: Según el glosario, si su BAC es de 0.10%, eso significa que tiene 0.10
    gramos de alcohol en 100 mililitros de sangre.
- id: 215
  category: sharing_the_road
  question: Según el glosario del manual, ¿cuál de los siguientes se considera un
    usuario vulnerable de la vía pública (VRU)?
  choices:
    A: Un conductor de un camión comercial.
    B: Un motociclista.
    C: Una persona con una discapacidad que utiliza una silla de ruedas.
    D: Un pasajero en un vehículo motorizado.
  answer: C
  explanation: Los VRU son usuarios de la vía pública no motorizados, como ciclistas,
    peatones y personas con discapacidades o movilidad y orientación reducidas que
    utilizan una silla de ruedas, un triciclo o un cuadriciclo.
- id: 216
  category: defensive_driving
  question: ¿Cuál es el propósito de la regla de los tres segundos?
  choices:
    A: Determinar cuánto tiempo detenerse en una señal de alto.
    B: Estimar a qué distancia debe seguir a otros vehículos.
    C: Cronometrar cuánto tiempo tiene para ceder el derecho de paso.
    D: Medir el tiempo que se tarda en cruzar una intersección de forma segura.
  answer: B
  explanation: La regla de los tres segundos es una regla de conducción que le ayuda
    a estimar a qué distancia debe seguir a otros vehículos.
- id: 217
  category: safe_driving_rules
  question: ¿Qué significa "ceder el paso" (yield) en la carretera?
  choices:
    A: Acelerar para incorporarse al tráfico de forma segura.
    B: Detenerse por completo en todo momento, independientemente del tráfico.
    C: Esperar, reducir la velocidad y estar preparado para detenerse para permitir
      que otros con el derecho de paso procedan.
    D: Quitar el derecho de paso a otros vehículos para mantener la fluidez del tráfico.
  answer: C
  explanation: Ceder el paso significa esperar, reducir la velocidad y estar preparado
    para detenerse (si es necesario) para permitir que otros vehículos o peatones
    que tengan el derecho de paso procedan.
- id: 218
  category: license_system
  question: Si un conductor de cualquier edad no puede seguir conduciendo de forma
    segura debido a una condición física o mental, ¿qué opción tiene disponible?
  choices:
    A: Puede recibir una licencia restringida solo para conducir durante el día.
    B: Puede ser elegible para canjear su licencia de conducir por una tarjeta de
      identificación sin costo.
    C: Puede hacer que un Enlace Comunitario lo represente en una audiencia del DMV.
    D: Debe tomar el Programa para Conductores Mayores para restablecer su licencia.
  answer: B
  explanation: Los conductores de cualquier edad que no puedan seguir conduciendo
    de forma segura debido a una condición física o mental pueden ser elegibles para
    canjear su licencia de conducir por una tarjeta de identificación sin costo.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que se aproxima
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Revise el tráfico y los peatones antes de proceder.
  id: 219
- image: yield.png
  category: signs_and_signals
  question: ¿Qué requiere que haga esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Proceder sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDER EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar pasar a otros de forma segura.
  id: 220
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida adelante
  answer: C
  explanation: Una señal roja y blanca de DO NOT ENTER (No entrar) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 221
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Deténgase y retroceda o dé la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de WRONG WAY (Sentido contrario) significa
    que está viajando contra el tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 222
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de ONE WAY (Sentido único) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 223
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 224
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 225
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 226
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de NO PASSING ZONE
    (Zona de no rebasar) significa que no se le permite rebasar a otros vehículos
    en esta área. Marca el comienzo de una zona de no rebasar.
  id: 227
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina adelante
  answer: C
  explanation: Una señal reglamentaria blanca de KEEP RIGHT (Manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 228
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 229
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta área
    C: Área de caza adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 230
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de rombo con una figura de peatón advierte
    sobre un cruce de peatones más adelante. Esté preparado para detenerse ante los
    peatones que crucen la calle.
  id: 231
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 232
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 233
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 234
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de rombo?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de rombo con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 235
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 236
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y esté preparado para que el camino
    gire primero en un sentido y luego en el otro.
  id: 237
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 238
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: Inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de rombo de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 239
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción del ancho de la vía y ajuste su
    posición en el carril.
  id: 240
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  id: 241
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Esté preparado para
    el tráfico de doble sentido.
  id: 242
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 243
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 244
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente empinada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente empinada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 245
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un puesto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 246
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 247
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las carreteras
    laterales.
  id: 248
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la autopista desde la carretera lateral.
  id: 249
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril — no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 250
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse momentáneamente o permanecer en ralentí
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 251
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo ciudadanos de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 252
