questions:
- id: 1
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una zona escolar cuando hay niños presentes,
    a menos que se indique lo contrario?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: Según el Manual del Automovilista de California, el límite de velocidad
    es de 25 mph al conducir a menos de 500 pies de una escuela mientras los niños
    están afuera o cruzando la calle, a menos que se indique lo contrario.
- id: 2
  category: safe_driving_rules
  question: 'La "Ley de Velocidad Básica" (Basic Speed Law) de California establece
    que usted debe:'
  choices:
    A: Nunca conducir más rápido que el límite de velocidad señalizado
    B: Nunca conducir más rápido de lo que sea seguro para las condiciones actuales
    C: Siempre conducir al ritmo del tráfico
    D: Mantener su velocidad cerca de la de otros vehículos
  answer: B
  explanation: La Ley de Velocidad Básica establece que nunca debe conducir más rápido
    de lo que sea seguro para las condiciones actuales, independientemente del límite
    de velocidad señalizado.
- id: 3
  category: alcohol_drugs_health
  question: Es ilegal que una persona de 21 años de edad o más conduzca con una concentración
    de alcohol en sangre (BAC) de ___ o más.
  choices:
    A: 0.04%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: La ley de California establece que es ilegal que cualquier persona
    de 21 años o más conduzca con un BAC de 0.08% o más.
- id: 4
  category: sharing_the_road
  question: 'Cuando un autobús escolar con sus luces rojas intermitentes está detenido
    delante de usted en su lado de la carretera, usted debe:'
  choices:
    A: Detenerse hasta que crea que todos los niños han bajado
    B: Detenerse hasta que las luces rojas dejen de parpadear
    C: Cambiar de carril, conducir despacio y pasar con cuidado
    D: Reducir la velocidad a 15 mph al pasar
  answer: B
  explanation: Debe detenerse ante un autobús escolar con luces rojas intermitentes
    y permanecer detenido hasta que las luces dejen de parpadear. No hacerlo puede
    resultar en una multa y la suspensión de la licencia.
- id: 5
  category: sharing_the_road
  question: 'Usted debe ceder el derecho de paso a un vehículo de emergencia:'
  choices:
    A: Conduciendo lo más cerca posible del borde derecho de la carretera y deteniéndose
    B: Moviéndose al carril derecho y conduciendo despacio
    C: Deteniéndose inmediatamente en su carril actual
    D: Acelerando para apartarse de su camino
  answer: A
  explanation: Cuando escuche una sirena o vea luces rojas intermitentes de un vehículo
    de emergencia, debe hacerse a un lado hacia el borde derecho de la carretera y
    detenerse hasta que pase.
- id: 6
  category: driver_responsibility
  question: Bajo la ley de California, ¿cuándo puede usar un teléfono celular de mano
    mientras conduce?
  choices:
    A: Cuando esté detenido en un semáforo en rojo
    B: Solo en una emergencia para solicitar asistencia
    C: Cuando el tráfico se mueva a menos de 15 mph
    D: Cuando esté conduciendo en una carretera rural
  answer: B
  explanation: Solo puede usar un teléfono celular de mano mientras conduce en una
    situación de emergencia para llamar a las autoridades, a un proveedor médico,
    al departamento de bomberos u otros servicios de emergencia.
- id: 7
  category: safe_driving_rules
  question: 'Al estacionar cuesta arriba en una calle de doble sentido sin bordillo,
    las ruedas delanteras deben estar:'
  choices:
    A: Giradas hacia la izquierda (hacia la calle)
    B: Giradas hacia la derecha (lejos de la calle)
    C: Paralelas al borde de la carretera
    D: Apuntando hacia adelante
  answer: B
  explanation: Al estacionar cuesta arriba o cuesta abajo sin bordillo, gire las ruedas
    hacia la derecha (hacia el lado de la carretera) para que el vehículo ruede lejos
    del centro de la carretera si fallan los frenos.
- id: 8
  category: signs_and_signals
  question: 'Un semáforo con luz roja intermitente en una intersección significa:'
  choices:
    A: Reducir la velocidad antes de entrar
    B: Detenerse antes de entrar, luego avanzar cuando sea seguro
    C: Detenerse y esperar la luz verde
    D: Ceder el paso a todo el tráfico antes de entrar
  answer: B
  explanation: Una luz roja intermitente de un semáforo significa "ALTO". Después
    de detenerse, puede avanzar cuando sea seguro, respetando las reglas de derecho
    de paso.
- id: 9
  category: signs_and_signals
  question: 'Dos líneas amarillas continuas en el centro de la calzada significan:'
  choices:
    A: Se permite rebasar desde cualquier dirección
    B: Se permite rebasar solo si usted está en el lado derecho
    C: No se permite rebasar desde ninguna dirección
    D: La carretera se estrecha más adelante
  answer: C
  explanation: Dos líneas amarillas continuas indican que no se permite rebasar. No
    debe conducir sobre estas líneas para rebasar a otros vehículos.
- id: 10
  category: defensive_driving
  question: 'Para evitar seguir a otros vehículos demasiado cerca (tailgating), el
    Manual del Automovilista de California recomienda usar la:'
  choices:
    A: Regla de los 2 segundos
    B: Regla de los 3 segundos
    C: Regla de los 4 segundos
    D: Regla de los 5 segundos
  answer: B
  explanation: Para evitar seguir demasiado cerca, use la "regla de los 3 segundos"
    para asegurarse de tener suficiente espacio para detenerse de manera segura si
    el vehículo de adelante frena repentinamente.
- id: 11
  category: penalties_and_points
  question: 'Debe notificar al DMV dentro de 10 días si está involucrado en una colisión
    que cause:'
  choices:
    A: Cualquier daño al vehículo
    B: Más de $500 en daños
    C: Más de $1,000 en daños o si alguien resulta herido o fallece
    D: Que su vehículo sea remolcado
  answer: C
  explanation: Usted (o su agente de seguros, corredor o representante legal) debe
    reportar una colisión al DMV dentro de 10 días si causó más de $1,000 en daños
    a la propiedad o si alguien resultó herido o falleció.
- id: 12
  category: sharing_the_road
  question: 'Si un peatón está en un cruce de peatones, usted debe:'
  choices:
    A: Tocar la bocina para advertirle
    B: Ceder el derecho de paso al peatón
    C: Conducir alrededor de él con cuidado
    D: Detenerse solo si está en su lado de la carretera
  answer: B
  explanation: Los peatones tienen el derecho de paso en los cruces de peatones marcados
    o no marcados. Usted debe ceder el paso y permitirles cruzar de manera segura.
- id: 13
  category: license_system
  question: 'Con una licencia de conducir básica Clase C, una persona puede conducir:'
  choices:
    A: Un vehículo de 3 ejes si el peso bruto del vehículo (GVW) es inferior a 6,000
      libras
    B: Cualquier vehículo comercial
    C: Un vehículo que remolca dos remolques
    D: Una motocicleta
  answer: A
  explanation: Una licencia de conducir Clase C le permite conducir un vehículo de
    2 ejes con una clasificación de peso bruto vehicular (GVWR) de 26,000 libras o
    menos, o un vehículo de 3 ejes que pese 6,000 libras o menos en bruto.
- id: 14
  category: defensive_driving
  question: 'Al cambiar de carril, debe revisar sus puntos ciegos:'
  choices:
    A: Mirando por el espejo retrovisor
    B: Mirando por los espejos laterales
    C: Girando la cabeza y mirando por encima del hombro
    D: Usando su cámara de reversa
  answer: C
  explanation: Los espejos no muestran sus puntos ciegos. Debe girar la cabeza y mirar
    por encima del hombro para asegurarse de que un carril esté despejado antes de
    cambiar de carril.
- id: 15
  category: safe_driving_rules
  question: ¿Cuál es el principio fundamental de la 'Ley de Velocidad Básica' (Basic
    Speed Law) de California?
  choices:
    A: Nunca puede conducir más rápido que el límite de velocidad indicado.
    B: Nunca puede conducir más rápido de lo que sea seguro para las condiciones actuales.
    C: Siempre debe conducir al ritmo del tráfico, independientemente del límite de
      velocidad.
    D: Debe conducir al menos 10 mph por debajo del límite de velocidad en mal tiempo.
  answer: B
  explanation: La 'Ley de Velocidad Básica' de California establece que nunca puede
    conducir más rápido de lo que sea seguro para las condiciones actuales, independientemente
    del límite de velocidad indicado.
- id: 16
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    un conductor de 21 años de edad o más?
  choices:
    A: 0.04%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Es ilegal que cualquier persona de 21 años de edad o más opere un vehículo
    con una concentración de alcohol en sangre (BAC) de 0.08% o superior.
- id: 17
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una intersección a ciegas?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad para una intersección a ciegas es de 15 mph.
    Una intersección se considera 'a ciegas' si no hay señales de alto en ninguna
    esquina y no puede ver a 100 pies en ninguna dirección durante los últimos 100
    pies antes de cruzar.
- id: 18
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en la mayoría de los distritos
    comerciales o residenciales en California?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: A
  explanation: A menos que se indique lo contrario, el límite de velocidad máximo
    en la mayoría de los distritos comerciales y residenciales es de 25 mph.
- id: 19
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar las ruedas al estacionar cuesta arriba junto a
    una acera?
  choices:
    A: Gire las ruedas hacia la acera.
    B: Gire las ruedas en dirección contraria a la acera.
    C: Mantenga las ruedas perfectamente rectas.
    D: Gire las ruedas paralelas a la calle.
  answer: B
  explanation: Al estacionar cuesta arriba junto a una acera, debe girar las ruedas
    delanteras en dirección contraria a la acera y dejar que su vehículo ruede hacia
    atrás unas pulgadas hasta que la parte trasera de la rueda delantera toque suavemente
    la acera.
- id: 20
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico roja intermitente?
  choices:
    A: Reduzca la velocidad y ceda el paso al tráfico.
    B: Deténgase, luego continúe cuando sea seguro.
    C: Deténgase y espere una luz verde.
    D: La señal de tráfico está descompuesta; proceda con precaución.
  answer: B
  explanation: Una señal de tráfico roja intermitente significa 'ALTO'. Después de
    detenerse, puede continuar cuando sea seguro, respetando las reglas de derecho
    de paso.
- id: 21
  category: signs_and_signals
  question: ¿Qué representan dos juegos de líneas amarillas dobles y continuas que
    están separadas por dos pies o más?
  choices:
    A: Un carril para vehículos compartidos (carpool).
    B: Una zona de rebase.
    C: Una pared sólida; no conduzca sobre ellas ni las cruce.
    D: Un carril central compartido para girar.
  answer: C
  explanation: Dos juegos de líneas amarillas dobles y continuas que están separadas
    por dos pies o más se consideran una barrera. No conduzca sobre esta barrera,
    ni realice un giro a la izquierda o un giro en U (U-turn) a través de ella.
- id: 22
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en un cruce peatonal?
  choices:
    A: Los vehículos tienen el derecho de paso si el peatón cruza imprudentemente
      (jaywalking).
    B: Los peatones siempre tienen el derecho de paso en los cruces peatonales marcados
      o no marcados.
    C: Los vehículos tienen el derecho de paso si el cruce peatonal no está marcado.
    D: Las bicicletas tienen el derecho de paso sobre los peatones.
  answer: B
  explanation: Los peatones tienen el derecho de paso en los cruces peatonales marcados
    o no marcados. Los conductores deben ceder el paso y reducir su velocidad o detenerse
    si es necesario para garantizar la seguridad del peatón.
- id: 23
  category: defensive_driving
  question: ¿Cuál es la distancia mínima de seguimiento recomendada bajo condiciones
    normales de conducción para evitar una colisión por alcance (choque por detrás)?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: Para evitar seguir de cerca (tailgating) y las colisiones por alcance,
    debe usar la "regla de los 3 segundos" para mantener una distancia de seguimiento
    segura bajo condiciones normales de conducción.
- id: 24
  category: driver_responsibility
  question: ¿Cuándo debe reportar una colisión de tráfico al DMV?
  choices:
    A: Solo si alguien fallece.
    B: Dentro de los 10 días si el daño es superior a $1,000 o si alguien resulta
      herido o fallece.
    C: Dentro de los 5 días si el daño es superior a $500.
    D: Solo si la policía no presenta un informe.
  answer: B
  explanation: Usted (o su agente de seguros, corredor o representante legal) debe
    reportar una colisión al DMV dentro de los 10 días si hay más de $1,000 en daños
    a la propiedad de cualquier persona, o si alguien resulta herido (sin importar
    qué tan leve sea) o fallece.
- id: 25
  category: safe_driving_rules
  question: ¿Cuándo es obligatorio encender las luces delanteras de su vehículo?
  choices:
    A: Solo cuando conduzca por carreteras sin iluminación.
    B: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la
      salida del sol.
    C: Desde 1 hora después de la puesta del sol hasta 1 hora antes de la salida del
      sol.
    D: Solo cuando no pueda ver a 500 pies delante de usted.
  answer: B
  explanation: Debe encender sus luces delanteras 30 minutos después de la puesta
    del sol y dejarlas encendidas hasta 30 minutos antes de la salida del sol, o en
    cualquier momento en que no pueda reconocer claramente a una persona o vehículo
    desde una distancia de 1,000 pies.
- id: 26
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un vehículo de emergencia con sirena y luces intermitentes
    se aproxima por detrás?
  choices:
    A: Aumentar la velocidad para mantenerse por delante del vehículo de emergencia.
    B: Detenerse inmediatamente en su carril actual.
    C: Orillarse hacia el borde derecho de la carretera y detenerse.
    D: Moverse al carril izquierdo para dejar que pasen por la derecha.
  answer: C
  explanation: Debe ceder el derecho de paso a cualquier vehículo policial, camión
    de bomberos, ambulancia u otro vehículo de emergencia que utilice una sirena y
    luces rojas. Conduzca hacia el borde derecho de la carretera y deténgase hasta
    que el vehículo o vehículos de emergencia hayan pasado.
- id: 27
  category: signs_and_signals
  question: ¿Qué indica una luz de semáforo amarilla fija?
  choices:
    A: La luz está a punto de cambiar a verde.
    B: 'PRECAUCIÓN: La señal roja está a punto de aparecer.'
    C: Deténgase inmediatamente, independientemente de su posición en la intersección.
    D: Aumente la velocidad para despejar la intersección rápidamente.
  answer: B
  explanation: Una luz de señal de tráfico amarilla fija significa "PRECAUCIÓN". La
    luz roja de la señal de tráfico está a punto de aparecer. Cuando vea la luz amarilla,
    deténgase si puede hacerlo de manera segura. Si no puede detenerse de manera segura,
    cruce la intersección con precaución.
- id: 28
  category: driver_responsibility
  question: Al interactuar con el Asistente Virtual del DMV, ¿qué tipo de información
    debe evitar incluir?
  choices:
    A: Marca y modelo del vehículo
    B: Información personal
    C: Preguntas generales sobre conducción
    D: Comentarios sobre el sitio web
  answer: B
  explanation: 'El Descargo de Responsabilidad General establece: "Al interactuar
    con el Departamento de Vehículos Motorizados (DMV) Virtual Assistant, por favor
    no incluya ninguna información personal".'
- id: 29
  category: license_system
  question: Si surge una discrepancia entre el contenido en inglés y una traducción
    de terceros en el sitio web del DMV, ¿qué versión es legalmente vinculante?
  choices:
    A: La versión traducida
    B: Ambas versiones son igualmente vinculantes
    C: La versión en inglés
    D: Ninguna de las versiones
  answer: C
  explanation: El Descargo de Responsabilidad de Traducción de Terceros señala que
    el contenido en inglés es la fuente oficial, y cualquier discrepancia en la traducción
    "no es vinculante y no tiene efecto legal para fines de cumplimiento o ejecución".
- id: 30
  category: vehicle_information
  question: ¿Cuál de los siguientes es un servicio proporcionado bajo la sección de
    Registro de Vehículos?
  choices:
    A: Unirse al programa piloto de mDL
    B: Enviar comprobante de seguro
    C: Pagar la tarifa de restablecimiento
    D: Pruebas en línea
  answer: B
  explanation: Según el menú de navegación principal, "Enviar comprobante de seguro"
    (Submit Proof of Insurance) aparece como un servicio bajo Registro de Vehículos.
- id: 31
  category: license_system
  question: ¿A qué programa piloto se invita a los usuarios a unirse bajo los servicios
    de Licencias de Conducir e Identificaciones?
  choices:
    A: El Piloto de mDL (mDL Pilot)
    B: El Piloto de Oficina Virtual
    C: El Piloto de Conductor Seguro
    D: El Piloto de Exámenes en Línea
  answer: A
  explanation: El menú de navegación de Licencias de Conducir e Identificaciones incluye
    una opción para 'Unirse al Piloto de mDL (mDL Pilot)'.
- id: 32
  category: penalties_and_points
  question: ¿Cuál de los siguientes cargos relacionados con multas se puede pagar
    a través del sistema de pago en línea del DMV?
  choices:
    A: Multas por exceso de velocidad
    B: Citaciones de estacionamiento
    C: Pago de cheque sin fondos (Dishonored Check Payment)
    D: Cargos administrativos de la corte
  answer: C
  explanation: La sección 'Realizar un pago' enumera explícitamente el 'Pago de cheque
    sin fondos' y 'Pagar cargo de restablecimiento' como opciones de pago en línea.
- id: 33
  category: driver_testing
  question: ¿Qué sección del Manual del Automovilista de California cubre 'El proceso
    de exámenes'?
  choices:
    A: Sección 1
    B: Sección 2
    C: Sección 3
    D: Sección 4
  answer: C
  explanation: 'El índice enumera la ''Sección 3: El proceso de exámenes'' en el Manual
    del Automovilista de California.'
- id: 34
  category: safe_driving_rules
  question: Según el índice del Manual del Automovilista de California, ¿qué sección
    está dedicada a las 'Leyes y reglas de la carretera'?
  choices:
    A: Sección 5
    B: Sección 6
    C: Sección 7
    D: Sección 8
  answer: C
  explanation: 'El índice enumera explícitamente la ''Sección 7: Leyes y reglas de
    la carretera''.'
- id: 35
  category: defensive_driving
  question: ¿Qué sección del Manual del Automovilista de California introduce el tema
    de 'Conducción segura'?
  choices:
    A: Sección 5
    B: Sección 6
    C: Sección 7
    D: Sección 8
  answer: D
  explanation: 'El índice describe la ''Sección 8: Conducción segura'' para el Manual
    del Automovilista de California.'
- id: 36
  category: driver_testing
  question: ¿Qué recursos están disponibles bajo el menú de Exámenes en línea del
    DMV para ayudar a prepararse para un examen de conducir?
  choices:
    A: Instructores virtuales en vivo
    B: Exámenes de práctica y videos instructivos
    C: Simuladores al volante
    D: Servicios de calificación acelerada
  answer: B
  explanation: El menú de Exámenes incluye opciones para 'Exámenes de práctica', 'Videos
    instructivos', 'Manuales del automovilista' y 'Guías especializadas para conductores'.
- id: 37
  category: driver_responsibility
  question: ¿Qué debe hacer un usuario para activar el chatbot del Asistente Virtual
    del DMV?
  choices:
    A: Crear una cuenta MyDMV
    B: Aceptar los avisos legales
    C: Ingresar su número de licencia de conducir
    D: Pagar una tarifa de conveniencia
  answer: B
  explanation: La interfaz del chatbot incluye un estado de error que requiere que
    los usuarios marquen una casilla que dice 'Acepto' los avisos legales para activar
    el Asistente Virtual.
- id: 38
  category: license_system
  question: ¿Cuál de los siguientes estados de casos se puede consultar en línea a
    través del portal del DMV?
  choices:
    A: Estado de caso en la corte de tránsito
    B: Estado de caso de seguridad del conductor
    C: Estado de incautación del vehículo
    D: Estado de la verificación de smog
  answer: B
  explanation: El menú 'Consultar estado' ofrece una opción para verificar el 'Estado
    de caso de seguridad del conductor' entre otros servicios.
- id: 39
  category: license_system
  question: ¿Qué sección del Manual del Automovilista de California cubre 'Cambiar,
    reemplazar y renovar su licencia de conducir'?
  choices:
    A: Sección 1
    B: Sección 2
    C: Sección 3
    D: Sección 4
  answer: D
  explanation: 'El índice enumera la ''Sección 4: Cambiar, reemplazar y renovar su
    licencia de conducir''.'
- id: 40
  category: vehicle_information
  question: Si necesita solicitar un registro de su vehículo, ¿bajo qué menú del DMV
    debería buscar?
  choices:
    A: Registro de vehículos
    B: Licencias de conducir e identificaciones
    C: Consultar estado
    D: Citas
  answer: A
  explanation: '''Solicitar registro de vehículo'' aparece como un servicio bajo el
    menú de navegación de ''Registro de vehículos''.'
- id: 41
  category: license_system
  question: ¿Qué servicio permite a los clientes asegurar un lugar en una oficina
    del DMV sin programar una cita tradicional?
  choices:
    A: Virtual Office (Oficina Virtual)
    B: Get in Line Now (Hacer fila ahora)
    C: MyDMV Fast Track
    D: Online Testing (Exámenes en línea)
  answer: B
  explanation: Bajo el menú 'Appointments' (Citas), el DMV ofrece el servicio 'Get
    in Line Now' (Hacer fila ahora) junto con la programación de citas tradicionales.
- id: 42
  category: license_system
  question: Según el descargo de responsabilidad de traducción, ¿por qué el DMV proporciona
    traducción automática a través de proveedores externos?
  choices:
    A: Para reemplazar la versión en inglés por completo
    B: Solo con fines de información y conveniencia
    C: Para proporcionar documentos legalmente vinculantes en todos los idiomas
    D: Para recopilar datos sobre personas que no hablan inglés
  answer: B
  explanation: 'El descargo de responsabilidad establece: ''La traducción automática
    se proporciona solo con fines de información y conveniencia''.'
- id: 43
  category: driver_responsibility
  question: 'Según el Mensaje del Secretario en el Manual del Automovilista de California,
    conducir o viajar en las carreteras de California se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio
    C: Un requisito para todos los adultos
    D: Un pasatiempo opcional
  answer: B
  explanation: 'El Mensaje del Secretario establece: "Recuerde que conducir o viajar
    es un privilegio y, sobre todo, la seguridad debe ser la prioridad".'
- id: 44
  category: safe_driving_rules
  question: ¿Qué aconseja el Secretario de la Agencia de Transporte del Estado de
    California con respecto al uso del teléfono celular mientras se conduce?
  choices:
    A: Usarlo solo para navegación
    B: Dejarlo a un lado cuando esté al volante o al manubrio
    C: Usar solo dispositivos de manos libres
    D: Es aceptable durante las horas del día
  answer: B
  explanation: El Mensaje del Secretario aconseja explícitamente "dejar a un lado
    ese teléfono celular cuando esté al volante o al manubrio. No opere un vehículo,
    motocicleta o bicicleta mientras esté distraído o incapacitado".
- id: 45
  category: license_system
  question: ¿Dónde puede un californiano comenzar su solicitud de licencia de conducir
    desde la comodidad de su hogar?
  choices:
    A: Llamando a la línea directa del DMV
    B: Visitando el sitio web del DMV en dmv.ca.gov
    C: A través de la barra de herramientas de Google Translate
    D: Enviando un correo electrónico al Secretario de Transporte
  answer: B
  explanation: 'El texto establece: "La solicitud de licencia de conducir se puede
    iniciar desde la comodidad del hogar visitando el sitio web del DMV en dmv.ca.gov".'
- id: 46
  category: driver_testing
  question: ¿En cuántos idiomas está disponible el Manual del Automovilista de California?
  choices:
    A: '3'
    B: '5'
    C: '9'
    D: '12'
  answer: C
  explanation: El Mensaje del Secretario señala que "El Manual del Automovilista de
    California está disponible en nueve idiomas..."
- id: 47
  category: alcohol_drugs_health
  question: 'Según la introducción del manual, operar un vehículo, motocicleta o bicicleta
    mientras está distraído o incapacitado podría significar:'
  choices:
    A: Una citación de tráfico menor
    B: La diferencia entre la vida y la muerte
    C: Una suspensión automática de la licencia
    D: Aumento de las primas de seguro
  answer: B
  explanation: 'El Mensaje del Secretario advierte: "No opere un vehículo, motocicleta
    o bicicleta mientras esté distraído o incapacitado; podría significar la diferencia
    entre la vida y la muerte".'
- id: 48
  category: defensive_driving
  question: ¿Cuál de las siguientes se enumera como una prioridad de seguridad para
    los conductores en el Mensaje del Secretario?
  choices:
    A: Conducir siempre por debajo del límite de velocidad
    B: Ceder el paso solo a vehículos comerciales
    C: Abrocharse siempre el cinturón y prestar atención a los demás
    D: Actualizar a un vehículo más nuevo
  answer: C
  explanation: 'El texto aconseja: "Abrochese siempre el cinturón, siga las leyes
    de tránsito, preste atención a otros conductores, ciclistas y peatones..."'
- id: 49
  category: license_system
  question: ¿Qué versión del sitio web del DMV se considera la fuente oficial y precisa
    para la información y los servicios del programa?
  choices:
    A: La versión en español
    B: La versión traducida por Google
    C: La versión en inglés
    D: La versión en lenguaje de señas americano
  answer: C
  explanation: 'El Descargo de Responsabilidad de Google Translate establece: "Las
    páginas web actualmente en inglés en el sitio web del DMV son la fuente oficial
    y precisa de la información y los servicios del programa que brinda el DMV".'
- id: 50
  category: license_system
  question: Según el descargo de responsabilidad del sitio web del DMV, ¿cuál de las
    siguientes páginas NO se puede traducir con Google Translate?
  choices:
    A: El Mensaje del Secretario
    B: El Glosario
    C: Solicitudes en línea (Online Applications)
    D: La sección de Conducción Segura
  answer: C
  explanation: El descargo de responsabilidad enumera "Formularios, Publicaciones,
    Ubicaciones de oficinas locales, Solicitudes en línea" como páginas que no se
    pueden traducir con Google Translate.
- id: 51
  category: vehicle_information
  question: Debido a la expansión de los servicios en línea del DMV, ¿cuál de los
    siguientes trámites se puede completar en el sitio web del DMV?
  choices:
    A: Verificaciones de smog
    B: Registro de vehículos y renovación de la licencia de conducir
    C: Pruebas de manejo al volante
    D: Exámenes de la vista
  answer: B
  explanation: 'El Mensaje del Secretario establece: "Algunos de estos trámites incluyen
    la renovación de la licencia de conducir, el registro de vehículos y otros".'
- id: 52
  category: driver_responsibility
  question: ¿Qué aconseja el DMV si decide guardar la transcripción de su chat con
    el Asistente Virtual en una computadora pública?
  choices:
    A: Tener precaución
    B: Imprimirla de inmediato
    C: Enviarla por correo electrónico al DMV
    D: Compartirla con el administrador del sitio
  answer: A
  explanation: 'El descargo de responsabilidad del chatbot advierte: "Cuando termine
    su chat, puede guardar la transcripción. Tenga precaución al usar una computadora
    o dispositivo público".'
- id: 53
  category: license_system
  question: Si surgen discrepancias en la traducción del sitio web del DMV, ¿cuál
    es el efecto legal para fines de cumplimiento o aplicación de la ley?
  choices:
    A: El texto traducido reemplaza al texto en inglés
    B: Las discrepancias no son vinculantes y no tienen efecto legal
    C: El usuario está exento de la norma
    D: El DMV debe proporcionar un traductor certificado
  answer: B
  explanation: 'El descargo de responsabilidad establece: "Cualquier discrepancia
    o diferencia creada en la traducción no es vinculante y no tiene efecto legal
    para fines de cumplimiento o aplicación de la ley".'
- id: 54
  category: sharing_the_road
  question: Según el Mensaje del Secretario, ¿a quiénes deben prestar atención los
    conductores para compartir la carretera de manera segura?
  choices:
    A: Solo a otros conductores
    B: Solo a los peatones en los cruces peatonales
    C: A otros conductores, ciclistas y peatones
    D: Solo a los conductores de camiones comerciales
  answer: C
  explanation: El Mensaje del Secretario recuerda a los californianos "prestar atención
    a otros conductores, ciclistas y peatones...".
- id: 55
  category: license_system
  question: ¿Con qué propósito proporciona el DMV servicios de traducción automática
    en su sitio web y chatbot?
  choices:
    A: Para documentación legal oficial
    B: Únicamente con fines de información y conveniencia
    C: Para reemplazar el inglés como idioma oficial
    D: Para garantizar una precisión perfecta para quienes no hablan inglés
  answer: B
  explanation: Los descargos de responsabilidad establecen que "la traducción automática
    se proporciona únicamente con fines de información y conveniencia".
- id: 56
  category: vehicle_information
  question: Según el índice del manual, ¿qué sección cubre la Responsabilidad Financiera,
    los Requisitos de Seguro y las Colisiones?
  choices:
    A: Sección 7
    B: Sección 8
    C: Sección 9
    D: Sección 10
  answer: D
  explanation: 'El índice proporcionado enumera la "Sección 10: Responsabilidad financiera,
    requisitos de seguro y colisiones".'
- id: 57
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso en un cruce peatonal que no tiene señales
    para peatones?
  choices:
    A: Los vehículos, si viajan al límite de velocidad.
    B: Los peatones siempre tienen el derecho de paso en los cruces peatonales.
    C: Los vehículos, si el peatón no está en un cruce peatonal marcado.
    D: Los peatones, pero solo si hacen contacto visual con el conductor.
  answer: B
  explanation: Los peatones tienen el derecho de paso en los cruces peatonales marcados
    o no marcados. Los conductores deben ceder el paso y reducir la velocidad o detenerse
    si es necesario para garantizar la seguridad del peatón.
- id: 58
  category: defensive_driving
  question: Para evitar seguir a otro vehículo demasiado cerca (tailgating), ¿cuánto
    espacio debe dejar entre su vehículo y el vehículo que tiene delante en condiciones
    normales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: B
  explanation: 'Para evitar seguir de cerca, el Manual del Conductor de California
    recomienda usar la "regla de los 3 segundos": cuando el vehículo de adelante pase
    por un punto determinado, cuente tres segundos para garantizar una distancia de
    seguimiento segura.'
- id: 59
  category: vehicle_information
  question: Debe encender sus faros delanteros ___ después de la puesta del sol y
    dejarlos encendidos hasta ___ antes de la salida del sol.
  choices:
    A: 30 minutos; 30 minutos
    B: 1 hora; 1 hora
    C: 15 minutos; 15 minutos
    D: Inmediatamente; inmediatamente
  answer: A
  explanation: La ley de California exige que encienda los faros delanteros 30 minutos
    después de la puesta del sol y los deje encendidos hasta 30 minutos antes de la
    salida del sol.
- id: 60
  category: defensive_driving
  question: ¿Cuál es la mejor manera de revisar sus puntos ciegos antes de cambiar
    de carril?
  choices:
    A: Mirar por el espejo retrovisor.
    B: Mirar por los espejos laterales.
    C: Girar la cabeza y mirar por encima del hombro.
    D: Tocar la bocina para advertir a otros conductores.
  answer: C
  explanation: Para revisar sus puntos ciegos, debe girar la cabeza y mirar por encima
    del hombro en la dirección en la que planea moverse para ver los vehículos que
    no son visibles en sus espejos.
- id: 61
  category: penalties_and_points
  question: ¿Si es condenado por huir de un oficial de la paz en cumplimiento de su
    deber sin causar lesiones corporales, a qué sanciones podría enfrentarse?
  choices:
    A: Hasta 1 año en una cárcel del condado.
    B: Una advertencia y una multa.
    C: Servicio comunitario obligatorio.
    D: Revocación permanente de su licencia.
  answer: A
  explanation: Cualquier persona condenada por provocar una persecución y huir de
    un oficial de la paz es sancionable con encarcelamiento en una cárcel del condado
    por no más de un año.
- id: 62
  category: signs_and_signals
  question: 'Una señal de tres lados, roja y blanca, indica que usted debe:'
  choices:
    A: Detenerse por completo antes de entrar en la intersección.
    B: Ceder el paso al tráfico y a los peatones.
    C: Mantener su velocidad e incorporarse.
    D: Ignorar la señal si no hay otros vehículos visibles.
  answer: B
  explanation: Una señal triangular roja de CEDA EL PASO (YIELD) indica que debe reducir
    la velocidad y estar preparado para detenerse, si es necesario, para dejar pasar
    a cualquier vehículo, ciclista o peatón antes de continuar.
- id: 63
  category: sharing_the_road
  question: 'Al rebasar a un ciclista en un carril de circulación, debe asegurarse
    de que haya suficiente ancho para el ciclista y mantener un espacio libre mínimo
    de:'
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 4 pies
  answer: C
  explanation: La ley de California exige que los conductores dejen una distancia
    de al menos tres pies al rebasar a un ciclista para garantizar su seguridad.
- id: 64
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es legal dar una vuelta en U?
  choices:
    A: En una autopista dividida cruzando una sección divisoria, bordillo o franja
      de terreno.
    B: A través de una línea amarilla doble cuando sea seguro y legal.
    C: En un cruce de ferrocarril.
    D: En una calle de sentido único.
  answer: B
  explanation: Puede dar una vuelta en U a través de una línea amarilla doble cuando
    sea seguro y legal. Es ilegal dar una vuelta en U en una calle de sentido único,
    en un cruce de ferrocarril o a través de una barrera de una autopista dividida.
- id: 65
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años, la ley de ''Tolerancia Cero'' de California establece
    que es ilegal conducir con un BAC de:'
  choices:
    A: 0.01% o superior
    B: 0.04% o superior
    C: 0.05% o superior
    D: 0.08% o superior
  answer: A
  explanation: La ley de Tolerancia Cero de California establece que es ilegal que
    cualquier persona menor de 21 años conduzca con un BAC (concentración de alcohol
    en sangre) de 0.01% o superior.
- id: 66
  category: driver_responsibility
  question: 'Si se ve involucrado en una colisión que resulte en lesiones o muerte,
    debe informarlo al DMV en un plazo de:'
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Usted (o su agente de seguros, corredor o representante legal) debe
    informar la colisión al DMV en un plazo de 10 días si alguien resulta herido o
    muere, o si los daños a la propiedad superan los $1,000.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal roja octagonal de PARE (STOP) significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Revise el tráfico y los peatones antes de continuar.
  id: 67
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 68
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de sentido único donde
    entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 69
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Dar una vuelta en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de sentido único o en
    una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de
    manera segura.
  id: 70
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de sentido único (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 71
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 72
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 73
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 74
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal amarilla en forma de banderín con letras negras que dice
    'NO PASSING ZONE' significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 75
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de 'KEEP RIGHT' (Manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 76
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 77
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 78
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 79
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 80
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla circular?
  choices:
    A: Una glorieta (roundabout) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal amarilla circular con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 81
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 82
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 83
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 84
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta (roundabout) más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino gire primero
    en un sentido y luego en el otro.
  id: 85
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 86
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación (merge) en forma de diamante advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 87
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 88
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 89
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Una zona de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico en ambos
    sentidos.
  id: 90
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de sentido único o de una autopista dividida
    y se encuentre con vehículos que circulan en dirección opuesta.
  id: 91
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 92
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 93
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 94
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 95
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 96
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la carretera desde la calle lateral.
  id: 97
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: 'Se está añadiendo un nuevo carril: no es necesario fusionarse'
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de fusionarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 98
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Permanecer de pie o con el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 99
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para discapacitados válido pueden
    estacionar en estos espacios. Las infracciones conllevan multas elevadas.
  id: 100
- id: 101
  category: license_system
  question: Bajo una licencia de conducir provisional de California, ¿durante cuántos
    meses debe estar acompañado por un padre, tutor u otro conductor con licencia
    de 25 años o más al transportar pasajeros menores de 20 años?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Durante los primeros 12 meses después de obtener su licencia, no puede
    transportar pasajeros menores de 20 años a menos que esté acompañado por un padre
    o tutor con licencia de California, un conductor con licencia de 25 años o más,
    o un instructor de manejo con licencia o certificado.
- id: 102
  category: license_system
  question: Durante los primeros 12 meses de tener una licencia provisional de California,
    ¿entre qué horas se le prohíbe generalmente conducir a menos que esté acompañado
    por un adulto con licencia?
  choices:
    A: 10 p.m. y 5 a.m.
    B: 11 p.m. y 5 a.m.
    C: Medianoche y 6 a.m.
    D: 9 p.m. y 6 a.m.
  answer: B
  explanation: La ley de California prohíbe a los titulares de licencias provisionales
    conducir entre las 11 p.m. y las 5 a.m. durante los primeros 12 meses de su licencia,
    con excepciones específicas por necesidad médica, escolar o laboral.
- id: 103
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar un permiso de aprendizaje
    en California si ha completado tanto la educación vial como el entrenamiento de
    manejo?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 17 años y medio
  answer: B
  explanation: Para solicitar un permiso de instrucción en California, debe tener
    al menos 15 años y medio y haber completado o estar inscrito en un programa aprobado
    de educación vial y entrenamiento de manejo.
- id: 104
  category: license_system
  question: ¿Cuántos días tiene para notificar al DMV de California después de cambiar
    su dirección de residencia?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: La ley de California exige que notifique al DMV dentro de los 10 días
    posteriores al cambio de su dirección de residencia.
- id: 105
  category: license_system
  question: ¿Cuál de los siguientes vehículos se le permite conducir con una licencia
    de conducir estándar Clase C de California?
  choices:
    A: Un vehículo de 2 ejes con una clasificación de peso bruto vehicular (GVWR)
      de 26,000 libras o menos.
    B: Una motocicleta con un desplazamiento de motor superior a 250cc.
    C: Un autobús comercial que transporte a más de 15 pasajeros.
    D: Un vehículo de 3 ejes que pese más de 10,000 libras.
  answer: A
  explanation: Una licencia Clase C le permite conducir un vehículo de 2 ejes con
    una clasificación de peso bruto vehicular (GVWR) de 26,000 libras o menos, o un
    vehículo de 3 ejes que pese 6,000 libras o menos en bruto.
- id: 106
  category: license_system
  question: Al conducir con un permiso de instrucción de California, ¿quién debe estar
    en el asiento delantero con usted en todo momento?
  choices:
    A: Cualquier persona que tenga al menos 18 años.
    B: Una persona que tenga al menos 21 años y posea una licencia de conducir válida
      de California.
    C: Una persona que tenga al menos 25 años y posea una licencia de conducir válida
      de California.
    D: Solo un instructor de manejo certificado o un padre.
  answer: C
  explanation: La ley de California exige que los titulares de permisos estén acompañados
    por una persona que tenga al menos 25 años y posea una licencia de conducir válida
    de California, sentada lo suficientemente cerca como para tomar el control del
    vehículo si es necesario.
- id: 107
  category: license_system
  question: A partir del 7 de mayo de 2025, ¿qué tipo de identificación se requerirá
    para que los residentes de California aborden un vuelo nacional o ingresen a instalaciones
    federales seguras?
  choices:
    A: Una licencia de conducir estándar Clase C.
    B: Una licencia de conducir o tarjeta de identificación que cumpla con REAL ID.
    C: Una tarjeta de seguro social y un certificado de nacimiento.
    D: Una tarjeta de identificación de estudiante de una universidad de California.
  answer: B
  explanation: A partir del 7 de mayo de 2025, el gobierno federal requerirá una REAL
    ID u otro documento aprobado por el gobierno federal (como un pasaporte) para
    abordar vuelos nacionales o ingresar a instalaciones federales seguras.
- id: 108
  category: license_system
  question: ¿Quién es legalmente responsable de cualquier daño financiero si un menor
    con una licencia de conducir de California se ve involucrado en un accidente de
    tráfico?
  choices:
    A: Solo el conductor menor de edad.
    B: El Departamento de Vehículos Motorizados (DMV) de California.
    C: Los padres o tutores que firmaron la solicitud de licencia del menor.
    D: La escuela secundaria o el programa de educación vial del menor.
  answer: C
  explanation: En California, los padres o tutores que firman la solicitud de licencia
    de conducir de un menor aceptan la responsabilidad financiera por la conducción
    de ese menor.
- id: 109
  category: driver_testing
  question: ¿Cuántas veces se le permite a un solicitante reprobar el examen de conocimientos
    de California antes de que su solicitud expire y deba pagarse una nueva tarifa?
  choices:
    A: Dos veces
    B: Tres veces
    C: Cuatro veces
    D: Cinco veces
  answer: B
  explanation: En California, su solicitud de licencia de conducir es válida por 12
    meses y se le permiten tres intentos para aprobar el examen de conocimientos antes
    de que deba presentar una nueva solicitud y pagar la tarifa.
- id: 110
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima requerida para aprobar el examen de
    la vista del DMV de California sin que se coloque una restricción en su licencia?
  choices:
    A: 20/20 en ambos ojos
    B: 20/30 en al menos un ojo
    C: 20/40 en ambos ojos combinados
    D: 20/50 en el ojo más fuerte
  answer: C
  explanation: El estándar de visión del DMV de California es 20/40 con ambos ojos
    combinados, y al menos 20/40 en un ojo y al menos 20/70 en el otro ojo.
- id: 111
  category: driver_testing
  question: ¿Qué documento debe presentar para el vehículo que proporcione para su
    examen de conducir práctico (detrás del volante) de California?
  choices:
    A: El historial de servicio y los registros de mantenimiento del vehículo
    B: Un registro (matrícula) válido y comprobante de responsabilidad financiera
    C: El título original del vehículo o el certificado de propiedad (pink slip)
    D: Una carta notariada del propietario del vehículo
  answer: B
  explanation: Para realizar el examen práctico, el vehículo debe tener un registro
    válido y usted debe mostrar un comprobante de que el vehículo está debidamente
    asegurado (responsabilidad financiera).
- id: 112
  category: driver_testing
  question: Si un menor reprueba el examen de conocimientos de California, ¿cuánto
    tiempo debe esperar antes de ser elegible para realizar el examen nuevamente?
  choices:
    A: Debe esperar 24 horas
    B: Debe esperar 7 días, sin incluir el día en que reprobó
    C: Debe esperar 14 días
    D: Debe esperar 30 días
  answer: B
  explanation: Según el Manual del Automovilista de California, si un menor reprueba
    el examen de conocimientos, debe esperar una semana (7 días) antes de volver a
    realizarlo.
- id: 113
  category: driver_testing
  question: ¿Cuál es la consecuencia para un solicitante que es sorprendido haciendo
    trampa o utilizando una ayuda para el examen durante el examen escrito de California?
  choices:
    A: El solicitante solo debe reiniciar el examen desde el principio
    B: El solicitante será descalificado y el DMV puede tomar medidas contra su privilegio
      de conducir
    C: El solicitante debe esperar 24 horas antes de intentarlo de nuevo
    D: El solicitante debe pagar una multa de $50 pero puede continuar el examen
  answer: B
  explanation: Hacer trampa en un examen del DMV es una ofensa grave; el examen se
    considerará reprobado y el DMV puede suspender o revocar cualquier privilegio
    de conducir o solicitud existente.
- id: 114
  category: driver_testing
  question: Si reprueba el examen de conducir práctico (detrás del volante) de California,
    ¿cuánto tiempo debe esperar antes de poder realizar el examen nuevamente?
  choices:
    A: Una semana
    B: Dos semanas
    C: Un mes
    D: Tres días
  answer: B
  explanation: La ley de California exige que los solicitantes que reprueben el examen
    práctico esperen dos semanas (14 días) antes de poder programar un nuevo examen.
- id: 115
  category: driver_testing
  question: ¿Cuál es la tarifa requerida por cada examen de conducir práctico (detrás
    del volante) adicional si no aprueba en su primer intento?
  choices:
    A: $7
    B: $15
    C: $25
    D: $45
  answer: A
  explanation: Si bien la tarifa de solicitud inicial cubre el primer examen práctico,
    hay una tarifa de $7 por cada examen práctico posterior.
- id: 116
  category: driver_testing
  question: ¿Cuál de los siguientes componentes del vehículo debe funcionar para aprobar
    la verificación de seguridad previa a la conducción durante un examen práctico
    de California?
  choices:
    A: El sistema de aire acondicionado
    B: El radio y los altavoces
    C: La ventana del lado del conductor y el parabrisas
    D: El sistema de control de crucero
  answer: C
  explanation: Durante la verificación previa a la conducción, el examinador se asegura
    de que el parabrisas proporcione una visión sin obstrucciones y que la ventana
    del lado del conductor se baje para hacer señales manuales.
- id: 117
  category: driver_testing
  question: ¿Qué medida tomará el DMV de California si usted no puede aprobar el examen
    de la vista incluso con lentes correctivos?
  choices:
    A: Su licencia será denegada permanentemente
    B: Se le requerirá que un especialista de la visión complete un Informe de Examen
      de la Vista
    C: Se le requerirá realizar un examen especial solo para conducir de noche
    D: Se le otorgará una licencia que solo es válida por 30 días
  answer: B
  explanation: Si no puede cumplir con los estándares de visión, el DMV le proporcionará
    un formulario para que su optometrista u oftalmólogo lo complete para determinar
    si puede conducir de manera segura.
- id: 118
  category: driver_testing
  question: ¿Cuál de los siguientes sucesos durante el examen práctico de California
    resultará en una reprobación inmediata y automática?
  choices:
    A: No usar una señal de giro una vez
    B: Que el examinador tenga que intervenir para evitar una colisión
    C: Conducir a 2 millas por hora por debajo del límite de velocidad
    D: Ajustar sus espejos mientras está detenido en un semáforo en rojo
  answer: B
  explanation: Cualquier acción que requiera que el examinador tome el control del
    vehículo o intervenga para prevenir un peligro se considera un error de conducción
    crítico y resulta en una reprobación automática.
- id: 119
  category: driver_testing
  question: ¿Cuánto tiempo permanece válida una solicitud de licencia de conducir
    de California después de pagar la tarifa inicial?
  choices:
    A: 6 meses
    B: 12 meses
    C: 24 meses
    D: Hasta que el solicitante cumpla 18 años
  answer: B
  explanation: Una solicitud de licencia de conducir de California y la tarifa pagada
    son válidas por exactamente 12 meses a partir de la fecha de la solicitud.
- id: 120
  category: driver_testing
  question: Cuando un adulto con una licencia de conducir válida de otro estado se
    muda a California, ¿qué requisito suele omitir el DMV?
  choices:
    A: El examen de conocimientos
    B: El examen de la vista
    C: El examen de conducir práctico (detrás del volante)
    D: La tarifa de solicitud
  answer: C
  explanation: El DMV de California normalmente omite el examen de conducir para los
    solicitantes que tienen una licencia válida de otro estado de EE. UU., aunque
    aún deben aprobar los exámenes de conocimientos y de la vista.
- id: 121
  category: driver_testing
  question: ¿Quién tiene permiso legal para acompañar a un solicitante en el vehículo
    durante el examen de conducir práctico (detrás del volante) de California?
  choices:
    A: Un padre o tutor con licencia
    B: Un instructor de manejo profesional
    C: Solo el examinador del DMV o personal autorizado
    D: Cualquier conductor con licencia mayor de 25 años
  answer: C
  explanation: Para evitar distracciones y mantener la integridad del examen, solo
    se permite en el vehículo al examinador del DMV (y ocasionalmente a un supervisor
    del DMV para fines de capacitación).
- id: 122
  category: driver_testing
  question: Además del formato escrito estándar, ¿de qué otra manera puede un solicitante
    realizar el examen de conocimientos de California?
  choices:
    A: Haciendo que un amigo traduzca las preguntas
    B: Como un examen de audio a través de auriculares
    C: Realizando un examen oral con un oficial de policía
    D: Presentando un ensayo escrito sobre las leyes de tránsito
  answer: B
  explanation: El DMV de California ofrece exámenes de conocimientos en formatos escritos,
    de pantalla táctil y de audio para adaptarse a diferentes necesidades e idiomas.
- id: 123
  category: driver_testing
  question: Durante la verificación de seguridad previa a la conducción del examen
    práctico de California, ¿qué debe demostrar el solicitante usando su brazo y mano?
  choices:
    A: Cómo comprobar la presión de los neumáticos
    B: Las señales manuales correctas para girar y detenerse
    C: Cómo medir el nivel de aceite
    D: La forma adecuada de sujetar el volante
  answer: B
  explanation: Antes de que comience la parte de conducción, el solicitante debe demostrar
    las señales manuales para girar a la izquierda, girar a la derecha y reducir la
    velocidad o detenerse.
- id: 124
  category: driver_testing
  question: ¿Cuál es la política del DMV de California con respecto a los solicitantes
    con condiciones físicas o mentales que puedan afectar su conducción?
  choices:
    A: Se les prohíbe automáticamente recibir una licencia
    B: Se les puede otorgar una licencia restringida después de una evaluación médica
    C: Solo se les permite conducir durante las horas del día
    D: Deben estar acompañados por un enfermero en todo momento
  answer: B
  explanation: El DMV evalúa cada caso individualmente y puede emitir una licencia
    con restricciones específicas (como 'debe usar lentes correctivos' o 'no conducir
    en autopistas') basándose en informes médicos.
- id: 125
  category: driver_testing
  question: ¿Bajo qué circunstancia podría el DMV de California requerir que un conductor
    vuelva a tomar el examen de conocimientos al renovar su licencia?
  choices:
    A: Si el conductor ha cumplido los 65 años
    B: Si el conductor ha tenido un cambio en su estado civil
    C: Si el conductor ha acumulado demasiados puntos por infracciones de tránsito
    D: Cada vez que se renueva una licencia, independientemente del historial de manejo
  answer: C
  explanation: Aunque muchas renovaciones no requieren un examen, el DMV puede exigir
    un examen de conocimientos si el conductor tiene un mal historial de manejo o
    una condición que justifique una reevaluación.
- id: 126
  category: driver_responsibility
  question: Si se ve involucrado en una colisión de tránsito en California, debe informarlo
    al DMV en un plazo de 10 días si los daños a la propiedad de cualquier persona
    superan ¿qué cantidad?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: C
  explanation: En California, cualquier colisión que resulte en daños a la propiedad
    superiores a $1,000 debe informarse al DMV en un plazo de 10 días utilizando el
    formulario SR-1.
- id: 127
  category: driver_responsibility
  question: ¿Qué documento debe presentarse al DMV de California dentro de los 10
    días posteriores a una colisión que involucre una lesión, una muerte o daños a
    la propiedad que excedan los $1,000?
  choices:
    A: Informe de Accidente de Tráfico Ocurrido en California (SR-1)
    B: Aviso de Transferencia y Relevo de Responsabilidad (NRL)
    C: Verificación de Vehículo (REG 31)
    D: Declaración de Hechos (REG 256)
  answer: A
  explanation: El formulario SR-1 es el Informe oficial de Accidente de Tráfico Ocurrido
    en California que los conductores deben presentar independientemente de quién
    haya tenido la culpa.
- id: 128
  category: driver_responsibility
  question: ¿Cuál es el requisito legal mínimo de California para la cobertura de
    seguro de responsabilidad civil por lesiones o muerte de una sola persona en un
    accidente?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $30,000
  answer: C
  explanation: La ley de California exige un mínimo de $15,000 por lesiones o muerte
    de una sola persona en cualquier accidente.
- id: 129
  category: driver_responsibility
  question: Cuando compra un vehículo a un particular, ¿dentro de cuántos días debe
    transferir la propiedad del vehículo a su nombre ante el DMV?
  choices:
    A: 5 días
    B: 10 días
    C: 20 días
    D: 30 días
  answer: B
  explanation: Los compradores tienen 10 días para notificar al DMV y transferir el
    título del vehículo a su nombre después de comprarlo a un particular.
- id: 130
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un método válido para cumplir con la Ley de
    Responsabilidad Financiera de California además de comprar un seguro de automóvil
    tradicional?
  choices:
    A: Un depósito en efectivo de $35,000 ante el DMV
    B: Una promesa por escrito de pagar cualquier daño
    C: Mantener una cuenta de ahorros con al menos $10,000
    D: Proporcionar una carta notariada de un empleador
  answer: A
  explanation: Los métodos alternativos de responsabilidad financiera incluyen un
    depósito en efectivo de $35,000 ante el DMV, una fianza de $35,000 o un certificado
    de autoseguro emitido por el DMV.
- id: 131
  category: driver_responsibility
  question: ¿Si usted está involucrado en una colisión y no puede proporcionar prueba
    de responsabilidad financiera, por cuánto tiempo puede ser suspendida su licencia
    de conducir de California?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Si usted está en una colisión y no tiene seguro, su privilegio de conducir
    será suspendido por un año.
- id: 132
  category: driver_responsibility
  question: En California, ¿dentro de qué límite de tiempo debe reportar una colisión
    que resulte en lesiones o muerte a la policía local o a la Patrulla de Caminos
    de California (CHP)?
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: B
  explanation: Si una colisión resulta en lesiones o muerte, debe reportarse a las
    autoridades (policía o CHP) dentro de las 24 horas posteriores al accidente.
- id: 133
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por una primera condena por tirar basura en una
    carretera de California?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Tirar basura en una carretera se castiga con una multa de hasta $1,000
    y puede requerir que el infractor recoja basura.
- id: 134
  category: driver_responsibility
  question: Según la ley de California, ¿cuál es la sentencia máxima de cárcel por
    abandonar a un animal en una carretera?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Abandonar a un animal en una carretera es un delito menor castigable
    con una multa de hasta $1,000, 6 meses de cárcel, o ambos.
- id: 135
  category: driver_responsibility
  question: Para la mayoría de los vehículos en California, ¿con qué frecuencia se
    debe proporcionar una certificación de control de contaminación (smog) al DMV
    durante el proceso de renovación del registro?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada cuatro años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: La mayoría de los vehículos en California deben pasar una verificación
    de smog cada dos años (bienal) para la renovación del registro.
- id: 136
  category: safe_driving_rules
  question: ¿Cuándo puede cruzar legalmente un conjunto de líneas amarillas dobles
    continuas para entrar o salir de un carril para vehículos de alta ocupación (HOV)
    en California?
  choices:
    A: Solo en las aberturas designadas marcadas con líneas discontinuas
    B: Siempre que sea seguro hacerlo y el tráfico esté despejado
    C: Para rebasar a un vehículo que viaja por debajo del límite de velocidad
    D: Solo durante las horas que no son de mayor tráfico cuando el carril está abierto
      para todos
  answer: A
  explanation: La ley de California prohíbe cruzar líneas dobles continuas para entrar
    o salir de un carril HOV; debe esperar a un área designada donde las líneas sean
    discontinuas o haya una abertura específica de entrada/salida.
- id: 137
  category: safe_driving_rules
  question: En California, ¿qué indica un bordillo (curb) pintado de verde con respecto
    a las regulaciones de estacionamiento?
  choices:
    A: Puede estacionar por un tiempo limitado, generalmente indicado en un letrero
      o en el bordillo
    B: Puede detenerse solo para recoger o dejar pasajeros
    C: Puede estacionar solo si tiene un cartel de discapacidad válido
    D: Puede detenerse solo para cargar o descargar carga o correo
  answer: A
  explanation: Un bordillo verde significa que puede estacionar por un tiempo limitado.
    Busque un letrero colocado junto a la zona verde o un límite de tiempo pintado
    en el bordillo.
- id: 138
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite a un conductor realizar un giro a la
    izquierda con luz roja en California?
  choices:
    A: De una calle de doble sentido a una calle de sentido único
    B: De una calle de sentido único a otra calle de sentido único
    C: De una calle de sentido único a una calle de doble sentido
    D: Nunca es legal girar a la izquierda con luz roja en California
  answer: B
  explanation: En California, solo puede girar a la izquierda con luz roja cuando
    está girando de una calle de sentido único a otra calle de sentido único, siempre
    que se detenga primero y ceda el paso al tráfico y a los peatones.
- id: 139
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en California para una intersección ciega
    donde no puede ver a 100 pies en ninguna dirección durante los últimos 100 pies
    antes de cruzar?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad para una intersección ciega en California es
    de 15 mph. Una intersección se considera ciega si no hay señales de alto en ninguna
    esquina y no se puede ver a 100 pies en ninguna dirección.
- id: 140
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima que se le permite a un conductor viajar en
    un carril central de giro a la izquierda en California?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: En California, solo puede conducir por 200 pies en el carril central
    de giro a la izquierda. Este carril está reservado para comenzar o completar giros
    a la izquierda o comenzar un giro en U permitido.
- id: 141
  category: safe_driving_rules
  question: ¿Qué sucede con las multas por infracciones de tránsito en California
    cuando la infracción se comete en una zona de construcción o mantenimiento de
    carreteras?
  choices:
    A: Las multas se reducen a la mitad si no hay trabajadores presentes
    B: Las multas siguen siendo las mismas que las infracciones estándar
    C: Las multas se duplican
    D: Las multas se triplican
  answer: C
  explanation: Según el Código de Vehículos de California, las multas por infracciones
    de tránsito cometidas en zonas de construcción o mantenimiento de carreteras cuando
    hay trabajadores presentes están sujetas a ser duplicadas.
- id: 142
  category: safe_driving_rules
  question: Al estacionar un vehículo cuesta arriba en una calle de doble sentido
    con acera (bordillo) en California, ¿cómo deben posicionarse las ruedas delanteras?
  choices:
    A: Giradas hacia la acera
    B: Giradas en dirección contraria a la acera
    C: Paralelas a la acera
    D: Giradas hacia la derecha
  answer: B
  explanation: Al estacionar cuesta arriba contra una acera, gire las ruedas en dirección
    contraria a la acera y deje que el vehículo ruede hacia atrás unos centímetros
    para que la parte trasera de la llanta delantera toque la acera. Esto evita que
    el automóvil ruede hacia el tráfico.
- id: 143
  category: defensive_driving
  question: Para mantener una distancia de seguimiento segura y evitar seguir de cerca
    (tailgating), el Manual del Conductor de California recomienda usar la 'regla
    de los tres segundos' ¿bajo cuál de las siguientes condiciones?
  choices:
    A: Solo al conducir en calles residenciales
    B: Solo al conducir detrás de camiones grandes o motocicletas
    C: Bajo condiciones normales de clima y tráfico
    D: Solo al conducir a velocidades superiores a 65 millas por hora
  answer: C
  explanation: El Manual del Conductor de California recomienda la 'regla de los tres
    segundos' para mantener una distancia de seguimiento segura detrás del vehículo
    que va delante de usted durante condiciones normales de clima y tráfico.
- id: 144
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente,
    ¿cuántos segundos adelante de su vehículo debe observar (escanear) el camino como
    mínimo?
  choices:
    A: 2 a 5 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: 60 segundos
  answer: B
  explanation: Observar de 10 a 15 segundos hacia adelante le permite ver los peligros
    con anticipación y le da suficiente tiempo para reaccionar de manera segura a
    los cambios en el flujo del tráfico.
- id: 145
  category: defensive_driving
  question: De acuerdo con la ley de California, debe encender sus faros delanteros
    si las condiciones climáticas requieren que use ¿cuál de las siguientes funciones
    del vehículo de manera continua?
  choices:
    A: El desempañador
    B: El aire acondicionado
    C: Los limpiaparabrisas
    D: Las luces de emergencia
  answer: C
  explanation: El Código de Vehículos de California exige que los conductores enciendan
    sus faros delanteros siempre que las condiciones climáticas (como lluvia o nieve)
    requieran el uso continuo de los limpiaparabrisas.
- id: 146
  category: defensive_driving
  question: Si su vehículo comienza a deslizarse sobre el agua (hidroplaneo) en una
    carretera mojada y pierde contacto con el pavimento, ¿cuál es la respuesta correcta
    de conducción defensiva?
  choices:
    A: Frenar bruscamente para detener el vehículo lo más rápido posible
    B: Girar el volante bruscamente hacia el acotamiento
    C: Poner el vehículo en punto muerto (neutral) inmediatamente
    D: Reducir la velocidad gradualmente y evitar el uso de los frenos
  answer: D
  explanation: Si experimenta hidroplaneo, debe reducir la velocidad gradualmente
    soltando el acelerador y evitar frenar, ya que esto puede causar que el vehículo
    patine.
- id: 147
  category: defensive_driving
  question: Al conducir de noche en California, debe atenuar sus faros de luz alta
    cuando un vehículo que viene en sentido contrario esté a menos de ¿cuántos pies?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de California exige que los conductores cambien de luces altas
    a luces bajas cuando un vehículo que viene en sentido contrario se encuentre a
    menos de 500 pies para evitar cegar al otro conductor.
- id: 148
  category: defensive_driving
  question: Cuando sigue a otro vehículo de noche, debe atenuar sus faros de luz alta
    cuando se encuentre a menos de ¿cuántos pies de ese vehículo?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: Debe atenuar sus luces altas cuando siga a otro vehículo a menos de
    300 pies para evitar el deslumbramiento en el espejo retrovisor del conductor
    que va adelante.
- id: 149
  category: defensive_driving
  question: Durante el clima frío o gélido, ¿qué partes de la carretera tienen más
    probabilidades de ocultar placas de hielo y congelarse antes que el resto de la
    calzada?
  choices:
    A: Intersecciones con semáforos
    B: Puentes y pasos elevados
    C: Caminos bajo la luz directa del sol
    D: Pendientes pronunciadas cuesta abajo
  answer: B
  explanation: Los puentes y pasos elevados tienden a congelarse antes que el resto
    de la carretera porque el aire circula tanto por encima como por debajo de la
    superficie de la vía, lo que hace que pierda calor más rápido.
- id: 150
  category: defensive_driving
  question: Al conducir con niebla densa o humo durante el día, ¿qué ajuste de luces
    debe usar para aumentar su visibilidad ante otros conductores?
  choices:
    A: Faros de luz alta
    B: Solo luces de estacionamiento
    C: Faros de luz baja
    D: Luces intermitentes de emergencia
  answer: C
  explanation: Se deben usar los faros de luz baja en la niebla porque las luces altas
    se reflejan en la humedad del aire, creando un resplandor que dificulta su visión.
- id: 151
  category: defensive_driving
  question: Si otro conductor lo sigue muy de cerca (tailgating), ¿cuál es la acción
    de conducción defensiva más segura según el Manual del Automovilista de California?
  choices:
    A: Pise los frenos repetidamente para advertir al conductor
    B: Aumente la velocidad para incrementar la distancia entre los vehículos
    C: Reduzca la velocidad gradualmente o muévase a otro carril para permitirle pasar
    D: Encienda las luces de emergencia y mantenga su velocidad
  answer: C
  explanation: La forma más segura de manejar a alguien que lo sigue muy de cerca
    es crear más espacio delante de usted reduciendo la velocidad o moviéndose al
    carril derecho para animarlo a pasar.
- id: 152
  category: defensive_driving
  question: Para evitar derrapar en superficies resbaladizas, ¿cómo debe ajustar su
    comportamiento al conducir?
  choices:
    A: Conduzca en una marcha baja en todo momento
    B: Reduzca la velocidad antes de llegar a curvas e intersecciones
    C: Bombee los frenos rápidamente al acercarse a una parada
    D: Siga al vehículo de adelante más de cerca
  answer: B
  explanation: Reducir la velocidad antes de las curvas e intersecciones disminuye
    el riesgo de perder tracción y derrapar en carreteras resbaladizas.
- id: 153
  category: defensive_driving
  question: Al conducir en una carretera mojada, el Manual del Automovilista de California
    sugiere que debe reducir su velocidad aproximadamente ¿cuánto?
  choices:
    A: De 2 a 3 millas por hora
    B: De 5 a 10 millas por hora
    C: Exactamente la mitad del límite de velocidad indicado
    D: De 15 a 20 millas por hora
  answer: B
  explanation: En una carretera mojada, debe conducir de 5 a 10 mph más lento que
    el límite de velocidad indicado para mantener el control y evitar el hidroplaneo.
- id: 154
  category: defensive_driving
  question: Cuando está detenido en una intersección y la luz cambia a verde, ¿en
    qué orden debe observar el área antes de entrar a la intersección?
  choices:
    A: Derecha, izquierda y derecha otra vez
    B: Hacia adelante, luego a la izquierda
    C: Izquierda, derecha y otra vez a la izquierda
    D: Solo hacia la dirección del tráfico que viene en sentido contrario
  answer: C
  explanation: Debe mirar a la izquierda, a la derecha y otra vez a la izquierda antes
    de entrar en una intersección porque el primer peligro proviene de los vehículos
    que se aproximan por la izquierda.
- id: 155
  category: defensive_driving
  question: Si está conduciendo hacia el sol y experimenta un deslumbramiento significativo,
    ¿cuál es una técnica de conducción defensiva recomendada para mantener la seguridad?
  choices:
    A: Encienda las luces altas para ver a través del resplandor
    B: Mantenga el parabrisas limpio por dentro y por fuera
    C: Mire directamente al sol para ayudar a que sus ojos se ajusten
    D: Conduzca lo más cerca posible del vehículo que tiene delante
  answer: B
  explanation: Un parabrisas limpio ayuda a reducir el deslumbramiento. La suciedad
    y las manchas en el vidrio dispersan la luz y hacen que sea mucho más difícil
    ver cuando se conduce hacia el sol.
- id: 156
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal máximo de concentración de alcohol en la sangre
    (BAC) para una persona que opera un vehículo comercial en California?
  choices:
    A: 0.01%
    B: 0.04%
    C: 0.08%
    D: 0.05%
  answer: B
  explanation: Para los conductores que operan un vehículo que requiere una licencia
    de conducir comercial, el límite legal de BAC es de 0.04% o superior.
- id: 157
  category: alcohol_drugs_health
  question: Por el acto de conducir en las vías públicas de California, usted ha dado
    su consentimiento para someterse a una prueba química del contenido de alcohol
    en su sangre, aliento u orina si lo solicita la policía. ¿Cómo se llama esta ley?
  choices:
    A: La Ley de Responsabilidad Financiera
    B: La Ley de Velocidad Básica
    C: La Ley de Consentimiento Implícito
    D: La Ley de Derecho de Paso
  answer: C
  explanation: La Ley de Consentimiento Implícito establece que al conducir en California,
    usted acepta someterse a una prueba química si es arrestado legalmente por conducir
    bajo la influencia (DUI).
- id: 158
  category: alcohol_drugs_health
  question: Si es arrestado por conducir bajo la influencia (DUI) en California y
    se niega a someterse a una prueba química, ¿cuál es la consecuencia inmediata
    para su privilegio de conducir?
  choices:
    A: Su licencia será suspendida o revocada.
    B: Solo se le dará una advertencia por la primera negativa.
    C: Se le pedirá que pague una multa pequeña y podrá seguir conduciendo.
    D: Su vehículo será confiscado permanentemente por el estado.
  answer: A
  explanation: Negarse a una prueba química después de ser arrestado por DUI resulta
    en una suspensión o revocación administrativa de la licencia por parte del DMV,
    independientemente del resultado judicial.
- id: 159
  category: alcohol_drugs_health
  question: Según la ley de California, ¿dónde es legal llevar un recipiente abierto
    de alcohol en un vehículo si este no tiene cajuela?
  choices:
    A: En la guantera, siempre que esté cerrada con llave.
    B: Debajo del asiento del conductor.
    C: En un área del vehículo que no sea ocupada normalmente por pasajeros.
    D: En la consola central entre los asientos delanteros.
  answer: C
  explanation: Si un vehículo no tiene cajuela, el recipiente abierto de alcohol debe
    guardarse en un área donde los pasajeros no se sienten. Es ilegal llevarlo en
    la guantera.
- id: 160
  category: alcohol_drugs_health
  question: Si actualmente se encuentra en libertad condicional por una condena previa
    por conducir bajo la influencia (DUI) en California, ¿cuál es el límite legal
    de concentración de alcohol en la sangre (BAC) que debe mantener mientras conduce?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.04%
    D: 0.01%
  answer: D
  explanation: Como condición de la libertad condicional por DUI, no debe conducir
    con un BAC de 0.01% o superior en ningún momento.
- id: 161
  category: alcohol_drugs_health
  question: ¿Cómo trata la ley de California el conducir bajo la influencia de medicamentos
    recetados o de venta libre?
  choices:
    A: Es legal siempre que el medicamento haya sido recetado por un médico.
    B: Solo es ilegal si el medicamento es un narcótico.
    C: Es ilegal conducir si el medicamento afecta su capacidad para conducir de manera
      segura.
    D: Es legal siempre que lleve consigo el frasco de la receta.
  answer: C
  explanation: La ley de California no distingue entre el alcohol, las drogas ilegales
    o los medicamentos legales; si una sustancia afecta su conducción, puede ser condenado
    por un DUI (conducir bajo la influencia).
- id: 162
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de mezclar alcohol con otra droga, como un remedio
    para el resfriado o un medicamento recetado, en su capacidad para conducir?
  choices:
    A: El alcohol generalmente anula los efectos de la droga.
    B: El efecto combinado suele ser mucho mayor que la suma de las partes.
    C: No hay un cambio significativo en la capacidad de conducción.
    D: La droga le ayudará a recuperar la sobriedad más rápido después de beber alcohol.
  answer: B
  explanation: Mezclar alcohol y drogas puede causar un efecto sinérgico, lo que significa
    que el deterioro es significativamente peor que si hubiera usado cualquiera de
    las sustancias por separado.
- id: 163
  category: alcohol_drugs_health
  question: ¿Qué permite la ley 'Admin Per Se' de California que haga un oficial de
    policía si usted no pasa o se niega a realizar una prueba de aliento o de sangre?
  choices:
    A: Llevarlo inmediatamente a prisión por un mínimo de un año.
    B: Confiscar su licencia de conducir y emitir un permiso temporal de 30 días.
    C: Cancelar permanentemente el registro de su vehículo en el acto.
    D: Obligarlo a pagar una multa de $5,000 al oficial de inmediato.
  answer: B
  explanation: Bajo la ley Admin Per Se, el oficial toma su licencia de conducir de
    California y le entrega una licencia temporal válida por 30 días mientras el DMV
    revisa su caso.
- id: 164
  category: alcohol_drugs_health
  question: Según la ley de California, ¿cómo debe guardarse la marihuana en un vehículo
    si el conductor o los pasajeros tienen 21 años de edad o más?
  choices:
    A: Se puede guardar en cualquier lugar siempre que sea menos de una onza.
    B: Debe guardarse en un recipiente sellado o en el maletero del vehículo.
    C: Debe guardarse en la guantera en todo momento.
    D: Solo se puede transportar si el conductor tiene una tarjeta de marihuana medicinal.
  answer: B
  explanation: Al igual que el alcohol, la marihuana debe estar en un recipiente que
    no haya sido abierto o debe guardarse en el maletero para evitar violaciones de
    'recipiente abierto'.
- id: 165
  category: alcohol_drugs_health
  question: ¿Cuál es el rango típico de una multa por una primera infracción de DUI
    en California, excluyendo las evaluaciones de penalización y los costos judiciales?
  choices:
    A: $100 a $200
    B: $390 a $1,000
    C: $1,500 a $3,000
    D: $5,000 a $10,000
  answer: B
  explanation: Una primera condena por DUI en California conlleva una multa base de
    $390 a $1,000, aunque los costos totales con las evaluaciones a menudo superan
    los varios miles de dólares.
- id: 166
  category: alcohol_drugs_health
  question: Si tiene una condición médica que pueda afectar su capacidad para conducir
    de manera segura, ¿cuál es su responsabilidad según la ley de California?
  choices:
    A: Debe dejar de conducir inmediatamente y no volver a conducir nunca más.
    B: Debe informar la condición al DMV para una evaluación médica.
    C: Solo necesita informar a su compañía de seguros sobre la condición.
    D: No necesita informar nada siempre que se sienta bien.
  answer: B
  explanation: Los conductores están obligados a informar al DMV sobre condiciones
    como la epilepsia, el Parkinson o cualquier condición que cause lapsos de conciencia
    para evaluar la seguridad al conducir.
- id: 167
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de California, ¿cuál es la responsabilidad
    principal de un conductor designado?
  choices:
    A: Beber solo una bebida alcohólica por hora.
    B: Conducir solo si siente que está por debajo del límite legal.
    C: Permanecer completamente sobrio y proporcionar transporte seguro para los demás.
    D: Monitorear el consumo de alcohol de los demás pasajeros.
  answer: C
  explanation: Un conductor designado es alguien que se mantiene 100% sobrio para
    asegurar que todos en el grupo lleguen a casa de manera segura.
- id: 168
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes factores es la única forma de reducir eficazmente
    su concentración de alcohol en sangre (BAC) después de consumir alcohol?
  choices:
    A: Beber varias tazas de café solo y cargado.
    B: Tomar una ducha muy fría.
    C: Hacer ejercicio o correr para sudar el alcohol.
    D: Darle tiempo a su cuerpo para procesar el alcohol.
  answer: D
  explanation: Solo el tiempo puede reducir el BAC de una persona. El café, las duchas
    frías y el ejercicio no aceleran la capacidad del hígado para procesar el alcohol.
- id: 169
  category: alcohol_drugs_health
  question: En California, ¿qué sucede con las penalizaciones por una condena de DUI
    si había un niño menor de 14 años en el vehículo al momento de la infracción?
  choices:
    A: Las penalizaciones siguen siendo exactamente las mismas.
    B: Al conductor solo se le da una advertencia verbal con respecto al niño.
    C: Las penalizaciones aumentan con una sentencia agravada.
    D: La licencia del conductor se suspende por solo 30 días.
  answer: C
  explanation: Según el Código de Vehículos de California, tener un pasajero menor
    de 14 años durante un DUI es un 'agravante de la sentencia' que conlleva tiempo
    adicional obligatorio en la cárcel.
- id: 170
  category: penalties_and_points
  question: Bajo el Sistema de Tratamiento para Operadores Negligentes (NOTS), la
    licencia de conducir de California será suspendida si reciben ¿cuántos puntos
    en un período de 12 meses?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: En California, el DMV suspenderá su privilegio de conducir si acumula
    4 puntos en 12 meses, 6 puntos en 24 meses u 8 puntos en 36 meses.
- id: 171
  category: penalties_and_points
  question: ¿Según el DMV de California, cuántos puntos en su historial de manejo
    dentro de un período de 24 meses resultarán en la suspensión de la licencia?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 10 puntos
  answer: B
  explanation: Un conductor es considerado un operador negligente y está sujeto a
    la suspensión de su licencia si acumula 6 puntos en un período de 24 meses.
- id: 172
  category: penalties_and_points
  question: ¿Un conductor en California es considerado un operador negligente y se
    le puede suspender la licencia si acumula cuántos puntos en un período de 36 meses?
  choices:
    A: 6 puntos
    B: 7 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: El umbral para la suspensión de un operador negligente durante un período
    de tres años (36 meses) es de 8 puntos.
- id: 173
  category: penalties_and_points
  question: En California, ¿cuántos puntos se añaden a su historial de manejo por
    una condena de conducción temeraria o conducir bajo la influencia (DUI)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Las infracciones más graves, como el choque y fuga, la conducción temeraria
    o el DUI, resultan en la adición de 2 puntos al historial del conductor.
- id: 174
  category: penalties_and_points
  question: Para la mayoría de las condenas por multas de tráfico estándar en California,
    como dar una vuelta en U ilegal o exceso de velocidad, ¿cuántos puntos se añaden
    a su historial de manejo?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 1/2 punto
    D: 3 puntos
  answer: A
  explanation: La mayoría de las condenas de tráfico menores, como el exceso de velocidad
    o no detenerse ante una señal, resultan en 1 punto en su historial de manejo.
- id: 175
  category: penalties_and_points
  question: ¿Cuál es la multa máxima para una persona condenada por fumar en un vehículo
    cuando hay un menor presente en California?
  choices:
    A: Hasta $50
    B: Hasta $100
    C: Hasta $250
    D: Hasta $500
  answer: B
  explanation: Es ilegal fumar en un vehículo en cualquier momento cuando hay un menor
    presente, y la infracción se castiga con una multa de hasta $100.
- id: 176
  category: penalties_and_points
  question: Si una persona es condenada por causar lesiones corporales graves mientras
    intenta evadir a las fuerzas del orden, ¿cuál es la sentencia mínima en una prisión
    estatal?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 10 años
  answer: C
  explanation: Una persona condenada por causar lesiones corporales graves durante
    el transcurso de una persecución policial está sujeta a encarcelamiento en una
    prisión estatal por 3, 5 o 7 años.
- id: 177
  category: penalties_and_points
  question: Si una persona de entre 13 y 21 años es condenada por vandalismo o grafiti,
    ¿por cuánto tiempo puede el tribunal suspender su privilegio de conducir en California?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que cumpla 21 años
  answer: B
  explanation: La ley de California permite que el tribunal suspenda el privilegio
    de conducir por hasta 1 año para las personas condenadas por vandalismo, incluido
    el grafiti.
- id: 178
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan normalmente a su historial de manejo de California
    si se determina que usted es el culpable de un accidente de tráfico?
  choices:
    A: 0 puntos
    B: 1 punto
    C: 2 puntos
    D: 3 puntos
  answer: B
  explanation: Si usted está involucrado en un accidente y se determina que es el
    culpable, el DMV normalmente asigna 1 punto a su historial de manejo.
- id: 179
  category: penalties_and_points
  question: ¿Dentro de cuántos días debe presentar un Informe de Accidente de Tráfico
    Ocurrido en California (SR 1) ante el DMV si hay daños a la propiedad superiores
    a $1,000?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Debe informar un accidente al DMV dentro de los 10 días si alguien
    resultó herido, falleció o si los daños a la propiedad superaron los $1,000.
- id: 180
  category: penalties_and_points
  question: Si no proporciona evidencia de responsabilidad financiera (seguro) cuando
    se ve involucrado en un accidente, ¿cuál es el período de suspensión obligatoria
    de la licencia?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 4 años
  answer: B
  explanation: Si tiene un accidente y no tiene seguro, su privilegio de conducir
    será suspendido por hasta 4 años, pero puede solicitar una licencia restringida
    después de 1 año.
- id: 181
  category: penalties_and_points
  question: ¿Cuál es la consecuencia para un conductor con una licencia provisional
    que recibe su primer accidente 'con culpa' o una condena por infracción de tránsito?
  choices:
    A: Una carta de advertencia del DMV
    B: Una suspensión de la licencia por 30 días
    C: Un curso obligatorio de educación vial
    D: Una multa de $500
  answer: A
  explanation: Por el primer accidente 'con culpa' o condena por una infracción de
    las leyes de tránsito, el DMV envía una carta de advertencia al titular de la
    licencia provisional.
- id: 182
  category: penalties_and_points
  question: Si el titular de una licencia provisional tiene un segundo accidente 'con
    culpa' o una condena por infracción de tránsito dentro de un periodo de 12 meses,
    ¿cuál es la sanción resultante?
  choices:
    A: Una sentencia de 10 días de cárcel
    B: Una restricción de 30 días para conducir solo con un padre o adulto con licencia
    C: Una revocación permanente de la licencia
    D: Una multa de $1,000
  answer: B
  explanation: Después de un segundo accidente 'con culpa' o condena dentro de 12
    meses, el conductor no puede conducir durante 30 días a menos que esté acompañado
    por un padre o adulto con licencia de al menos 25 años de edad.
- id: 183
  category: penalties_and_points
  question: ¿Durante cuántos años permanecen en el registro de conducir de California
    la mayoría de las condenas de tránsito estándar, como el exceso de velocidad o
    los giros ilegales?
  choices:
    A: 1 año
    B: 3 años
    C: 7 años
    D: 10 años
  answer: B
  explanation: La mayoría de las condenas de tránsito y accidentes permanecen en su
    registro durante 36 meses (3 años), aunque algunas infracciones más graves permanecen
    por más tiempo.
- id: 184
  category: penalties_and_points
  question: En California, una condena por conducir a una velocidad superior a 100
    millas por hora resulta en ¿cuántos puntos en su registro de conducir?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Conducir a más de 100 mph es una infracción grave en California y resulta
    en la adición de 2 puntos al registro del conductor.
- id: 185
  category: sharing_the_road
  question: En California, ¿quién tiene el derecho de paso en una intersección donde
    no hay cruces peatonales marcados?
  choices:
    A: Los conductores siempre tienen el derecho de paso sobre los peatones en intersecciones
      no marcadas.
    B: Los peatones tienen el derecho de paso en cada intersección, incluso si el
      cruce peatonal no está marcado.
    C: La persona que llega primero a la intersección siempre tiene el derecho de
      paso.
    D: Los peatones solo tienen el derecho de paso si están usando un cruce peatonal
      designado con líneas pintadas.
  answer: B
  explanation: En California, cada intersección donde las calles se encuentran aproximadamente
    en ángulos rectos tiene un 'cruce peatonal no marcado', y los conductores deben
    ceder el derecho de paso a los peatones.
- id: 186
  category: sharing_the_road
  question: Cuando ve a un peatón ciego con un bastón blanco o un perro guía en una
    esquina, ¿cuál es la distancia recomendada para detener su vehículo del cruce
    peatonal?
  choices:
    A: Debe detenerse al menos a 15 pies de distancia para que el peatón no se asuste
      con su motor.
    B: Debe detenerse a menos de 5 pies del cruce peatonal para que el peatón pueda
      escuchar su motor.
    C: Debe detenerse exactamente en la línea de límite y tocar la bocina para avisarles
      que está allí.
    D: Debe detenerse solo si el peatón ya ha bajado a la calzada.
  answer: B
  explanation: Detenerse a menos de 5 pies del cruce peatonal es importante porque
    los peatones ciegos utilizan el sonido del motor para confirmar que un vehículo
    está detenido y para determinar la dirección del tráfico.
- id: 187
  category: sharing_the_road
  question: De acuerdo con la Ley de Tres Pies para la Seguridad de California, ¿cuál
    es la distancia mínima que un conductor debe mantener al rebasar a un ciclista
    que viaja en la misma dirección?
  choices:
    A: Un conductor debe mantener al menos 2 pies de espacio.
    B: Un conductor debe mantener al menos 3 pies de espacio.
    C: Un conductor debe mantener al menos 5 pies de espacio.
    D: Un conductor debe mantener suficiente espacio para que su espejo lateral no
      toque al ciclista.
  answer: B
  explanation: La ley de California exige que los conductores dejen al menos tres
    pies de espacio libre al rebasar a un ciclista. Si no es posible dejar tres pies,
    el conductor debe reducir la velocidad y rebasar solo cuando sea seguro.
- id: 188
  category: sharing_the_road
  question: Cuando se está preparando para girar a la derecha y hay un carril para
    bicicletas, ¿cuántos pies antes del giro se le permite entrar al carril para bicicletas?
  choices:
    A: Puede entrar al carril 50 pies antes de la intersección.
    B: Puede entrar al carril 100 pies antes de la intersección.
    C: Puede entrar al carril 200 pies antes de la intersección.
    D: Nunca se le permite conducir en un carril para bicicletas, incluso al girar.
  answer: C
  explanation: En California, debe verificar si hay ciclistas y entrar al carril para
    bicicletas no más de 200 pies antes de comenzar su giro a la derecha.
- id: 189
  category: sharing_the_road
  question: ¿Cuál es la ley de California con respecto al 'lane splitting' (división
    de carril) para motociclistas en las carreteras?
  choices:
    A: La división de carril está estrictamente prohibida en todas las autopistas
      de California.
    B: La división de carril solo es legal para el personal de respuesta a emergencias
      en motocicletas.
    C: La división de carril es legal en California si se hace de manera segura y
      prudente.
    D: La división de carril es legal solo cuando el tráfico se mueve a velocidades
      superiores a 50 mph.
  answer: C
  explanation: California es el primer estado en permitir formalmente la división
    de carril (lane splitting), que se define como una motocicleta que circula entre
    filas de vehículos detenidos o en movimiento en el mismo carril.
- id: 190
  category: sharing_the_road
  question: ¿Por qué debe evitar permanecer en las áreas de 'No Zone' (Zona Ciega)
    de un camión grande o vehículo comercial?
  choices:
    A: Los conductores de camiones deben cambiar de carril con frecuencia y podrían
      golpearlo.
    B: La turbulencia del aire del camión hará que su vehículo pierda el control.
    C: Estos son puntos ciegos donde el conductor del camión no puede ver su vehículo.
    D: Es ilegal conducir al lado de un camión por más de 30 segundos en California.
  answer: C
  explanation: Los camiones grandes tienen puntos ciegos extensos llamados 'No Zones'
    en los costados, la parte delantera y la trasera. Si no puede ver la cara del
    conductor del camión en su espejo lateral, él no puede verlo a usted.
- id: 191
  category: sharing_the_road
  question: ¿Qué debe esperar que haga el conductor de un camión grande cuando gira
    a la derecha en una calle con dos carriles en cada dirección?
  choices:
    A: El camión siempre permanecerá en el carril del extremo derecho durante todo
      el giro.
    B: El camión puede necesitar abrirse hacia la izquierda para completar el giro.
    C: El camión se detendrá y esperará a que todo el tráfico se despeje antes de
      girar.
    D: El camión acelerará para asegurar que el remolque libre el bordillo.
  answer: B
  explanation: Debido a su longitud, los camiones grandes a menudo necesitan abrirse
    hacia la izquierda para realizar un giro a la derecha sin que las ruedas traseras
    suban al bordillo.
- id: 192
  category: sharing_the_road
  question: Si conduce en una autopista de varios carriles dividida por una barrera
    física, ¿cuál es la regla para detenerse cuando un autobús escolar en el lado
    opuesto tiene luces rojas intermitentes?
  choices:
    A: Debe detenerse hasta que las luces rojas dejen de parpadear.
    B: Debe reducir la velocidad a 15 mph pero no necesita detenerse.
    C: No es necesario detenerse si el autobús está al otro lado de una barrera física
      o divisor.
    D: Debe detenerse solo si hay niños cruzando la autopista en ese momento.
  answer: C
  explanation: Según la ley de California, no es necesario detenerse ante un autobús
    escolar con luces rojas intermitentes si se encuentra al otro lado de una autopista
    dividida o de varios carriles (dos o más carriles en cada dirección) con una barrera
    física.
- id: 193
  category: sharing_the_road
  question: ¿Cuál es la multa máxima por una primera condena por no detenerse ante
    un autobús escolar con luces rojas intermitentes y un brazo de parada extendido
    en California?
  choices:
    A: Una multa de hasta $100.
    B: Una multa de hasta $250.
    C: Una multa de hasta $500.
    D: Una multa de hasta $1,000.
  answer: D
  explanation: No detenerse ante un autobús escolar con luces rojas intermitentes
    es una infracción grave en California, que conlleva una multa de hasta $1,000
    y una posible suspensión de la licencia por un año.
- id: 194
  category: sharing_the_road
  question: Según la ley 'Move Over' (Hacerse a un lado) de California, ¿qué debe
    hacer un conductor al acercarse a un vehículo de emergencia estacionado con luces
    de emergencia intermitentes en una autopista?
  choices:
    A: Detenerse inmediatamente en el carril de circulación hasta que termine la emergencia.
    B: Cambiarse a un carril que no esté junto al vehículo de emergencia, si es seguro
      hacerlo.
    C: Mantener su velocidad y permanecer en su carril para evitar interrumpir el
      tráfico.
    D: Acelerar para pasar la escena lo más rápido posible.
  answer: B
  explanation: La ley 'Move Over' exige que los conductores se cambien de carril o
    reduzcan la velocidad significativamente al acercarse a vehículos de emergencia
    estacionados, grúas o vehículos marcados del Departamento de Transporte con luces
    intermitentes.
- id: 195
  category: sharing_the_road
  question: En California, ¿es ilegal seguir a menos de cuántos pies de cualquier
    camión de bomberos, vehículo policial o ambulancia que tenga una sirena o luces
    intermitentes encendidas?
  choices:
    A: 100 pies.
    B: 200 pies.
    C: 300 pies.
    D: 500 pies.
  answer: C
  explanation: La ley de California prohíbe seguir a menos de 300 pies de cualquier
    vehículo de emergencia con sirena o luces intermitentes, ya que esto puede interferir
    con su capacidad para maniobrar o responder.
- id: 196
  category: sharing_the_road
  question: ¿Qué indica a otros conductores un triángulo naranja fluorescente con
    un borde rojo en la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo es un vehículo de movimiento lento que viaja a menos de 25 mph.
    C: El vehículo es una carga de gran tamaño que requiere espacio adicional.
    D: El vehículo es un conductor principiante o un conductor en formación.
  answer: B
  explanation: Los tractores agrícolas, los vehículos de mantenimiento de carreteras
    y los carros tirados por animales muestran este emblema para advertir a los conductores
    que el vehículo viaja a velocidades de 25 mph o menos.
- id: 197
  category: sharing_the_road
  question: Si no hay aceras disponibles, ¿en qué dirección debe caminar un peatón
    a lo largo de la calzada?
  choices:
    A: En la misma dirección que el flujo del tráfico.
    B: De frente al tráfico que viene en sentido contrario para poder ver los vehículos
      que se acercan.
    C: En el arcén derecho de la carretera en todo momento.
    D: En el centro del carril para asegurar que sean visibles para los conductores.
  answer: B
  explanation: Los peatones deben caminar de frente al tráfico que viene en sentido
    contrario cuando no hay aceras, ya que esto les permite ver y reaccionar ante
    los vehículos que se acercan desde la dirección opuesta.
- id: 198
  category: vehicle_information
  question: En California, ¿es ilegal conducir un vehículo de pasajeros con neumáticos
    que tengan una profundidad de dibujo inferior a qué cantidad?
  choices:
    A: 1/4 de pulgada
    B: 1/16 de pulgada
    C: 1/32 de pulgada
    D: 1/8 de pulgada
  answer: C
  explanation: Según el Código de Vehículos de California 27465(b), la profundidad
    mínima legal del dibujo para la mayoría de los neumáticos de vehículos de pasajeros
    es de 1/32 de pulgada.
- id: 199
  category: vehicle_information
  question: ¿Cuándo debe encender los faros delanteros durante el día debido a las
    condiciones climáticas en California?
  choices:
    A: Solo cuando llueve lo suficientemente fuerte como para causar una inundación.
    B: Siempre que esté usando los limpiaparabrisas en uso continuo debido a la lluvia
      o la nieve.
    C: Solo cuando la visibilidad sea inferior a 100 pies.
    D: Solo cuando conduzca por una carretera de montaña de dos carriles.
  answer: B
  explanation: La ley de California exige que los conductores enciendan los faros
    de luz de cruce siempre que utilicen los limpiaparabrisas en uso continuo debido
    a la lluvia, la nieve o la niebla.
- id: 200
  category: vehicle_information
  question: En California, ¿dónde se le permite colocar una calcomanía de hasta siete
    pulgadas cuadradas en su parabrisas?
  choices:
    A: En el centro del parabrisas detrás del espejo retrovisor.
    B: En la esquina inferior del parabrisas del lado del pasajero.
    C: En la esquina inferior del parabrisas del lado del conductor.
    D: En cualquier lugar, siempre que no bloquee la vista de la carretera del conductor.
  answer: B
  explanation: La ley de California permite calcomanías de hasta 7 pulgadas cuadradas
    en la esquina inferior del lado del pasajero o de hasta 5 pulgadas cuadradas en
    la esquina inferior del lado del conductor.
- id: 201
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para el sistema de escape de un
    vehículo de pasajeros en California?
  choices:
    A: Debe ser modificado para que sea lo más ruidoso posible por seguridad.
    B: Debe estar equipado con un silenciador y no emitir humo excesivo.
    C: Debe desconectarse al conducir en zonas rurales.
    D: Debe reemplazarse cada 50,000 millas independientemente de su estado.
  answer: B
  explanation: La ley de California exige que todos los vehículos estén equipados
    con un silenciador adecuado para evitar el ruido y el humo excesivos.
- id: 202
  category: vehicle_information
  question: ¿Cuál es el nivel máximo de ruido permitido para un sistema de escape
    de repuesto en un vehículo de pasajeros que pesa menos de 6,000 libras en California?
  choices:
    A: 80 decibelios
    B: 95 decibelios
    C: 110 decibelios
    D: 120 decibelios
  answer: B
  explanation: Según la ley de California, los sistemas de escape de repuesto para
    vehículos de pasajeros no deben exceder un nivel de sonido de 95 decibelios.
- id: 203
  category: vehicle_information
  question: Según el Manual del Automovilista de California, ¿a qué distancia debe
    sentarse del volante para permitir que la bolsa de aire (airbag) se despliegue
    de forma segura?
  choices:
    A: Al menos 5 pulgadas
    B: Al menos 10 pulgadas
    C: Al menos 15 pulgadas
    D: Al menos 20 pulgadas
  answer: B
  explanation: El DMV recomienda sentarse a una distancia de al menos 10 pulgadas
    del volante para evitar lesiones causadas por la bolsa de aire durante su despliegue.
- id: 204
  category: vehicle_information
  question: Según la ley de California, ¿los niños menores de qué edad deben estar
    asegurados en un sistema de retención infantil orientado hacia atrás a menos que
    pesen 40 libras o más?
  choices:
    A: 1 año de edad
    B: 2 años de edad
    C: 4 años de edad
    D: 6 años de edad
  answer: B
  explanation: Los niños menores de 2 años deben estar asegurados en un asiento orientado
    hacia atrás, a menos que pesen 40 libras o más, o midan 40 pulgadas o más de estatura.
- id: 205
  category: vehicle_information
  question: ¿Cuál es la transmisión de luz mínima requerida para el polarizado no
    original (aftermarket) en las ventanas laterales delanteras de un vehículo en
    California?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 88%
  answer: C
  explanation: La ley de California exige que el polarizado no original en las ventanas
    laterales delanteras permita al menos un 70% de transmisión de luz.
- id: 206
  category: vehicle_information
  question: En California, todo vehículo debe estar equipado con un espejo que permita
    al conductor ver la carretera a una distancia de al menos ¿cuántos pies hacia
    atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El Código de Vehículos de California exige espejos que proporcionen
    una visión de la carretera a una distancia de al menos 200 pies hacia atrás.
- id: 207
  category: vehicle_information
  question: ¿Con qué frecuencia deben la mayoría de los vehículos en California someterse
    a una verificación de contaminación (Smog Check) para la renovación del registro?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada cinco años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: En California, la mayoría de los vehículos deben aprobar una inspección
    de smog cada dos años para la renovación del registro.
- id: 208
  category: vehicle_information
  question: ¿Cuándo es legal usar la bocina de su vehículo en California?
  choices:
    A: Para saludar a un amigo en la acera.
    B: Para expresar enojo por el error de otro conductor.
    C: Para advertir a otros conductores de un peligro o para evitar una colisión.
    D: Para avisar al conductor de adelante que el semáforo se ha puesto en verde.
  answer: C
  explanation: La bocina solo debe usarse para advertir a otros conductores sobre
    un peligro de seguridad o cuando sea razonablemente necesario para evitar un accidente.
