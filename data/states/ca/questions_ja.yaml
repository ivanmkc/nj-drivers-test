questions:
- id: 1
  category: license_system
  question: 2025年5月から、国内線の飛行機に搭乗するためにどのような身分証明書が必要になりますか？
  choices:
    A: 標準的なクラスC運転免許証
    B: REAL ID準拠の運転免許証または身分証明書（IDカード）
    C: 標準的なカリフォルニア州身分証明書
    D: 有権者登録カード
  answer: B
  explanation: マニュアルによると、2025年5月以降、国内線の飛行機に搭乗するために運転免許証または身分証明書（IDカード）を使用する場合、それはREAL
    IDに準拠している必要があります。
- id: 2
  category: license_system
  question: 一般的な乗用車を運転するために、ほとんどの人が必要とする運転免許証の区分はどれですか？
  choices:
    A: クラスA
    B: クラスB
    C: クラスC
    D: クラスM
  answer: C
  explanation: マニュアルによると、車両のタイプに応じた正しい免許を所持している必要があり、ほとんどの人は非営利のクラスC運転免許証を必要とします。
- id: 3
  category: license_system
  question: カリフォルニア州の身分証明書（IDカード）に関して、正しいものはどれですか？
  choices:
    A: 日中のみの運転を許可する。
    B: 18歳以上の個人にのみ発行される。
    C: 免許保持者が同乗していれば運転を許可する。
    D: 身分証明を目的として発行され、運転は許可されない。
  answer: D
  explanation: マニュアルには、IDカードは年齢を問わず資格のある人に身分証明を目的として発行されるものであり、運転を許可するものではないと明記されています。
- id: 4
  category: license_system
  question: 18歳未満の場合、仮免許（instruction permit）を申請するには何歳以上である必要がありますか？
  choices:
    A: 少なくとも15歳
    B: 少なくとも15歳半
    C: 少なくとも16歳
    D: 少なくとも16歳半
  answer: B
  explanation: 18歳未満の場合、仮免許（instruction permit）を申請するには、少なくとも15歳半である必要があります。
- id: 5
  category: driver_testing
  question: 18歳未満の場合、いつから仮免許（instruction permit）を使用して運転の練習を開始できますか？
  choices:
    A: 知識テスト（筆記試験）に合格した直後
    B: 仮免許を保持してから30日後
    C: 教官が仮免許を有効化した後、実車による運転訓練を開始したとき
    D: 親または保護者が仮免許に署名した直後
  answer: C
  explanation: 未成年者は、教官が仮免許を有効化し、実車による運転訓練を開始するまで、仮免許を使用して運転の練習をすることはできません。
- id: 6
  category: driver_testing
  question: 18歳以上で仮免許（instruction permit）を持っている場合、誰と一緒に運転の練習をしなければなりませんか？
  choices:
    A: 16歳以上の免許保持者であれば誰でも
    B: 18歳以上のカリフォルニア州免許保持者
    C: 21歳以上のカリフォルニア州免許保持者
    D: 25歳以上のカリフォルニア州免許保持者
  answer: B
  explanation: 仮免許取得後に運転免許証を取得するには、18歳以上のカリフォルニア州免許保持者（未成年の場合は25歳以上）と一緒に運転の練習をする必要があります。
- id: 7
  category: driver_testing
  question: 18歳未満の場合、50時間の運転練習は誰の監督下で行う必要がありますか？
  choices:
    A: 18歳以上のカリフォルニア州免許保持者
    B: 21歳以上のカリフォルニア州免許保持者
    C: 25歳以上のカリフォルニア州免許保持者
    D: 年齢に関わらず免許を持つ教習指導員
  answer: C
  explanation: 未成年者は、25歳以上のカリフォルニア州免許保持者と一緒に、少なくとも50時間の運転練習を行う必要があります。
- id: 8
  category: driver_testing
  question: 未成年者が運転免許証を取得する前に、何時間の夜間運転練習を完了する必要がありますか？
  choices:
    A: 5時間
    B: 10時間
    C: 15時間
    D: 20時間
  answer: B
  explanation: 未成年者に義務付けられている50時間の運転練習のうち、10時間は夜間に行う必要があります。
- id: 9
  category: license_system
  question: 18歳未満の場合、運転免許証を取得できる最低年齢は何歳ですか？
  choices:
    A: 15歳半
    B: 16歳
    C: 16歳半
    D: 17歳
  answer: B
  explanation: 18歳未満の場合、運転免許証を取得するには少なくとも16歳である必要があります。
- id: 10
  category: driver_testing
  question: 未成年者が実技試験（behind-the-wheel drive test）を予約する前に、どのくらいの期間、仮免許（instruction
    permit）を保持している必要がありますか？
  choices:
    A: 少なくとも3ヶ月
    B: 少なくとも6ヶ月
    C: 少なくとも9ヶ月
    D: 少なくとも12ヶ月
  answer: B
  explanation: 未成年者は、実技試験を予約する前に、カリフォルニア州または他州の仮免許を少なくとも6ヶ月間保持している（または18歳になる）必要があります。
- id: 11
  category: driver_responsibility
  question: 未成年者の両親が共同親権（joint custody）を持っている場合、財政的責任を引き受けるために運転免許申請書に署名しなければならないのは誰ですか？
  choices:
    A: ほとんどの時間を一緒に過ごしている親のみ
    B: どちらか一方の親が個別に署名すればよい
    C: 両方の親が署名しなければならない
    D: 法的な裁判官が署名しなければならない
  answer: C
  explanation: マニュアルには、両親または保護者が共同親権を持っている場合、申請を承認し財政的責任を引き受けるために、両者が署名しなければならないと記載されています。
- id: 12
  category: driver_testing
  question: 自動車教習所の教官が携帯しなければならず、生徒が提示を求めるべきものは何ですか？
  choices:
    A: 特別な商用運転免許証
    B: 教官証（IDカード）
    C: DMVからの許可証
    D: 保険加入証明書
  answer: B
  explanation: 運転教育および運転訓練の教官は教官証を携帯しなければならず、マニュアルではその提示を求めるようアドバイスしています。
- id: 13
  category: license_system
  question: クラスCの仮免許（instruction permit）を申請する際、申請料は：
  choices:
    A: 筆記試験に不合格だった場合は返金される
    B: 申請をキャンセルした場合は返金される
    C: 返金不可である
    D: 初めての申請者の場合は免除される
  answer: C
  explanation: クラスCの仮免許を申請する手順の一つとして、返金不可の申請料を支払う必要があります。
- id: 14
  category: safe_driving_rules
  question: 仮免許で運転の練習をする際、同乗して監督する免許保持者は：
  choices:
    A: 運転者の死角を確認するために後部座席に座らなければならない
    B: 必要に応じて車両を制御できるほど近くに座らなければならない
    C: 別の車両で学習者の後ろを走行しなければならない
    D: 認定された自動車教習所の教官でなければならない
  answer: B
  explanation: 監督するカリフォルニア州免許保持者は、必要に応じて車両を制御できるほど近くに座らなければなりません。
- id: 15
  category: driver_testing
  question: クラスCの仮免許を申請するために必要なテストは次のうちどれですか？
  choices:
    A: 聴力検査
    B: 視力検査
    C: 体力検査
    D: 防衛運転講習の試験
  answer: B
  explanation: クラスCの仮免許を申請するには、筆記試験（知識テスト）と視力検査に合格する必要があります。
- id: 16
  category: license_system
  question: 暫定運転免許（provisional driver's license）を取得してから最初の12か月間、未成年者が運転できない時間帯はいつですか？
  choices:
    A: 午後10時から午前5時まで
    B: 午後11時から午前5時まで
    C: 午前0時から午前6時まで
    D: 午後11時から午前6時まで
  answer: B
  explanation: 暫定免許保持者は、免許取得後の最初の12か月間、午後11時から午前5時の間は運転することができません。
- id: 17
  category: license_system
  question: 暫定免許（provisional license）の下では、以下の誰かが同伴しない限り、20歳未満の乗客を乗せて運転することはできません：
  choices:
    A: 18歳以上のすべての免許保持者
    B: 21歳以上の免許保持者
    C: 25歳以上のカリフォルニア州免許保持者
    D: 18歳以上の兄弟姉妹
  answer: C
  explanation: 親、保護者、またはその他のカリフォルニア州免許保持者（25歳以上）が同乗しない限り、20歳未満の乗客を乗せて運転することはできません。
- id: 18
  category: driver_testing
  question: 未成年者が筆記試験（knowledge test）に不合格となった場合、再試験を受けるまでどのくらい待つ必要がありますか？
  choices:
    A: 3日間
    B: 7日間
    C: 10日間
    D: 14日間
  answer: B
  explanation: 未成年者が筆記試験に不合格となった場合、不合格となった当日を除いて7日間待ってから再試験を受ける必要があります。
- id: 19
  category: driver_testing
  question: 未成年者が実技試験（behind-the-wheel drive test）に不合格となった場合、再試験を受けるまでどのくらい待つ必要がありますか？
  choices:
    A: 7日間
    B: 10日間
    C: 14日間
    D: 30日間
  answer: C
  explanation: 未成年者が実技試験に不合格となった場合、不合格となった当日を除いて14日間待ってから再試験を受ける必要があります。
- id: 20
  category: vehicle_information
  question: 実技試験前の運転前点検において、車両のタイヤには少なくともどのくらいの均一な溝の深さ（tread depth）が必要ですか？
  choices:
    A: 1/16インチ
    B: 1/32インチ
    C: 2/32インチ
    D: 1/8インチ
  answer: B
  explanation: タイヤには少なくとも1/32インチの均一な溝の深さが必要です。実技試験中にスペアタイヤ（ドーナツタイヤ）を使用することは認められません。
- id: 21
  category: vehicle_information
  question: 運転前点検に合格するためには、車両のホーンは少なくともどのくらいの距離から聞こえる大きさである必要がありますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: ホーンはその車両専用に設計され、適切に作動する状態で、少なくとも200フィートの距離から聞こえる大きさである必要があります。
- id: 22
  category: driver_testing
  question: 実技試験（路上試験）中に使用が許可されている車両安全技術はどれですか？
  choices:
    A: 自動縦列駐車
    B: 車線逸脱警告システム
    C: アダプティブ・クルーズ・コントロール
    D: バックカメラ
  answer: D
  explanation: バックカメラや死角モニターなどの車両安全技術は、実技試験で使用できます。自動縦列駐車、車線逸脱警告、アダプティブ・クルーズ・コントロールなどの高度運転支援システムの使用は許可されていません。
- id: 23
  category: license_system
  question: 引っ越しをした場合、何日以内にDMVに新しい住所を通知しなければなりませんか？
  choices:
    A: 5日
    B: 10日
    C: 14日
    D: 30日
  answer: B
  explanation: 引っ越しをした場合は、10日以内にDMVに新しい住所を通知しなければなりません。
- id: 24
  category: license_system
  question: 州外に滞在中で運転免許証の更新ができない場合、最大でどのくらいの期間の延長を申請できますか？
  choices:
    A: 30日
    B: 6ヶ月
    C: 1年
    D: 2年
  answer: C
  explanation: 州外に滞在中で更新ができない場合は、運転免許証の1年間の延長を申請することができます。
- id: 25
  category: alcohol_drugs_health
  question: カリフォルニア州での運転中にヘッドセットや耳栓を着用することに関する規則は何ですか？
  choices:
    A: ロードノイズを遮断するために推奨される
    B: 両耳にヘッドセットや耳栓を着用することは違法である
    C: 音楽を聴いている場合のみ違法である
    D: 音量が小さければ合法である
  answer: B
  explanation: 運転中に両耳にヘッドセットや耳栓を着用することは違法です。ホーン、サイレン、オートバイ、またはタイヤのきしむ音を聞き取れる状態でなければならないためです。
- id: 26
  category: alcohol_drugs_health
  question: 医師は、安全な運転能力に影響を与える可能性のある健康状態について、患者が少なくとも何歳以上の場合にDMVに報告する義務がありますか？
  choices:
    A: 14歳
    B: 16歳
    C: 18歳
    D: 21歳
  answer: A
  explanation: 医師は、意識消失などの安全な運転能力に影響を与える可能性のある健康状態について、14歳以上の患者をDMVに報告する義務があります。
- id: 27
  category: safe_driving_rules
  question: 送りハンドル（プッシュプル法）を使用する場合、ハンドル上のどこに手を置くべきですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置、または8時と4時の位置
    C: 12時と6時の位置
    D: 7時と5時の位置
  answer: B
  explanation: 送りハンドルを使用するには、まず手を9時と3時の位置、または8時と4時の位置に置きます。
- id: 28
  category: license_system
  question: 暫定免許（プロビジョナル・ライセンス）保持者が、医療上の必要性から制限時間帯に運転する必要がある場合、何を携帯しなければなりませんか？
  choices:
    A: 親または保護者が署名したメモ
    B: 校長が署名したメモ
    C: 健康状態と回復予定日が記載された、医師が署名したメモ
    D: 医療用IDブレスレット
  answer: C
  explanation: 医療上の必要性による例外として、医師が署名したメモを携帯する必要があります。そのメモには、健康状態と回復見込み日が記載されていなければなりません。
- id: 29
  category: driver_testing
  question: 実技試験（路上試験）中にビデオ録画機器を使用することに関するDMVの方針は何ですか？
  choices:
    A: トレーニング目的で推奨されている
    B: 試験官が同意すれば許可される
    C: 禁止されており、電源を切るか遮蔽しなければならない
    D: 音声録音のみ許可される
  answer: C
  explanation: 実技試験中のビデオレコーダーを含む録音・録画機器の使用は禁止されています。電源を切ることや無効化することができない場合は、受験者がそれを遮蔽しなければなりません。
- id: 30
  category: vehicle_information
  question: 運転前点検において、車両には少なくとも何枚のバックミラーが必要であり、そのうち1枚はどこに設置されていなければなりませんか？
  choices:
    A: 少なくとも1枚、車内に設置
    B: 少なくとも2枚、うち1枚は車両の左側に設置
    C: 少なくとも3枚、すべての死角をカバー
    D: 少なくとも2枚、うち1枚は車両の右側に設置
  answer: B
  explanation: 車両には少なくとも2枚のバックミラーが必要です。そのうちの1枚は、車両の左側に設置されていなければなりません。
- id: 31
  category: safe_driving_rules
  question: ハンドオーバーハンド（交差式）ステアリング操作を行うのが適切なのはいつですか？
  choices:
    A: 高速道路を高速で走行しているとき。
    B: 低速で旋回するとき、駐車するとき、またはスリップから立て直す必要があるとき。
    C: 直線で後退（バック）しているとき。
    D: 他の車両制御装置を操作しているとき。
  answer: B
  explanation: マニュアルによると、低速での旋回、駐車、またはスリップからの立て直しが必要な場合には、ハンドオーバーハンド・ステアリング操作を使用する必要があります。
- id: 32
  category: safe_driving_rules
  question: 後退（バック）しながら旋回する場合、ハンドル上のどこに手を置くべきですか？
  choices:
    A: 6時の位置。
    B: 9時の位置。
    C: 12時の位置。
    D: 3時の位置。
  answer: C
  explanation: 後方の進行方向を確認するために後退しながら旋回する場合、ハンドル上の12時の位置に手を置く必要があります。
- id: 33
  category: safe_driving_rules
  question: 高速道路で車線を変更する場合、どれくらい前から合図を出す必要がありますか？
  choices:
    A: 少なくとも100フィート手前。
    B: 少なくとも200フィート手前。
    C: 少なくとも3秒前。
    D: 少なくとも5秒前。
  answer: D
  explanation: マニュアルには、高速道路で車線を変更する際は、少なくとも5秒前から合図を出すべきであると記載されています。
- id: 34
  category: safe_driving_rules
  question: 方向指示器（ウィンカー）の使用に関して、正しいものはどれですか？
  choices:
    A: 周囲に他の車両が見えるときだけ合図を出せばよい。
    B: 周囲に他の車両が見えないときでも合図を出すべきである。
    C: 曲がる少なくとも50フィート手前で合図を出さなければならない。
    D: 路肩から発進するときは合図を出す必要はない。
  answer: B
  explanation: 道路上での安全なコミュニケーションを確保するため、周囲に他の車両が見えない場合でも合図を出すべきです。
- id: 35
  category: defensive_driving
  question: 狭い山道を走行中、少なくとも前方何フィート先まで見通せない場合に、対向車に警告するためにクラクションを鳴らすべきですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 少なくとも200フィート先が見通せない狭い山道では、対向車に警告するためにクラクションを使用する必要があります。
- id: 36
  category: safe_driving_rules
  question: 他の車両の後ろを走行しているとき、何フィート以内でハイビームをロービームに切り替えなければなりませんか？
  choices:
    A: 200フィート以内
    B: 300フィート以内
    C: 400フィート以内
    D: 500フィート以内
  answer: B
  explanation: 向かってくる車両（対向車）に対しては500フィート以内、自分が追従している車両に対しては300フィート以内で、ハイビームをロービームに切り替えなければなりません。
- id: 37
  category: safe_driving_rules
  question: どのような気象条件下で、ロービームの点灯が法的に義務付けられていますか？
  choices:
    A: 気温が氷点下になったときはいつでも。
    B: 霧、雨、または雪のためにワイパーを使用する必要がある場合。
    C: 冬の間に山道を走行する場合のみ。
    D: カープールレーン（相乗り車線）を走行しているときはいつでも。
  answer: B
  explanation: 霧、雨、または雪のためにワイパーを使用する必要がある場合は、ロービームを点灯しなければなりません。
- id: 38
  category: safe_driving_rules
  question: 日没と日の出に関連するヘッドライトの使用に関する一般的な規則は何ですか？
  choices:
    A: 日没の30分後に点灯し、日の出の30分前まで点灯し続ける。
    B: 日没と同時に点灯し、日の出と同時に消灯する。
    C: 日没の1時間後に点灯し、日の出の1時間前まで点灯し続ける。
    D: 日没の30分前に点灯し、日の出の30分後まで点灯し続ける。
  answer: A
  explanation: 日没の30分後から日の出の30分前までは、ヘッドライトを使用しなければなりません。
- id: 39
  category: defensive_driving
  question: 車両の故障で停車する必要がある場合、次のうち避けるべきことはどれですか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）を点灯させること。
    B: すべての交通から離れた路外に車を出すこと。
    C: 丘の頂上を越えた直後や、カーブを曲がった直後に停車すること。
    D: 緊急ロードサービスに電話すること。
  answer: C
  explanation: 丘の頂上を越えた直後やカーブの直後は、他のドライバーが衝突を避けるのに十分な時間内にあなたの車両を確認できない可能性があるため、停車してはいけません。
- id: 40
  category: signs_and_signals
  question: 路面にある白い三角形の連続で構成される「譲れライン（yield line）」は何を示していますか？
  choices:
    A: カープール（相乗り）専用エリア。
    B: 高速道路の車線の終点。
    C: 接近する車両が譲るか、または停止すべき場所。
    D: 越えてはならない障壁。
  answer: C
  explanation: 譲れライン（yield line）は白い三角形の列で、接近する車両に対して譲るべき場所、または停止すべき場所を示します。
- id: 41
  category: safe_driving_rules
  question: 2フィート（約60cm）以上の間隔がある2組の実線の二重黄線は、どのように扱うべきですか？
  choices:
    A: 中央左折車線として扱う。
    B: 高乗車人数車（HOV）用の追い越し車線として扱う。
    C: その上を走行したり、越えたりしてはいけない障壁として扱う。
    D: 指定された待避所として扱う。
  answer: C
  explanation: 2フィート以上の間隔がある2組の実線の二重黄線は障壁とみなされます。この障壁の上を走行したり、越えたり、これを横切って左折やUターンをしてはいけません。
- id: 42
  category: safe_driving_rules
  question: 路面の実線の二重白線は何を示していますか？
  choices:
    A: 一般車線と優先車線の間の、決して越えてはいけない車線境界。
    B: 双方向通行の道路の中央。
    C: 一方通行の道路の追い越し区間。
    D: 中央左折車線。
  answer: A
  explanation: 実線の二重白線は、一般車線とカープール車線などの優先車線の間の車線境界を示します。実線の二重白線を越えて車線変更をしてはいけません。
- id: 43
  category: safe_driving_rules
  question: 車線が番号で呼ばれる場合、1番車線（Number 1 Lane）はどの車線を指しますか？
  choices:
    A: 一番右側の車線。
    B: 左側の（または追い越し）車線。
    C: 中央左折車線。
    D: カープール車線のみ。
  answer: B
  explanation: 車線はしばしば番号で呼ばれます。左側の（または追い越し）車線が1番車線と呼ばれます。
- id: 44
  category: safe_driving_rules
  question: 中央左折車線を走行することが許可されている最大距離はどれくらいですか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: C
  explanation: 左折する前に中央左折車線を走行できるのは200フィートまでです。
- id: 45
  category: sharing_the_road
  question: 他の車両を先に行かせるために待避所（ターンアウトエリア）または待避車線を使用しなければならないのはどのような時ですか？
  choices:
    A: 2車線道路を低速で走行しており、3台以上の車両が後ろに続いている時。
    B: 2車線道路を低速で走行しており、追い越しが危険な状態で、5台以上の車両が後ろに続いている時。
    C: ナビゲーションシステムを確認するために停車する必要がある時はいつでも。
    D: フリーウェイを走行しており、出口から出たい時。
  answer: B
  explanation: 2車線道路を低速で走行しており、追い越しが危険な状態で、5台以上の車両が後ろに続いている場合は、待避所または待避車線を使用して他の車両を先に行かせなければなりません。
- id: 46
  category: safe_driving_rules
  question: 追い越しが危険な2車線道路を低速で走行している際、少なくとも何台の車両に追従されている場合に、待避所または待避車線を使用して他の車両を先に行かせなければなりませんか？
  choices:
    A: 3台
    B: 4台
    C: 5台
    D: 6台
  answer: C
  explanation: マニュアルによると、2車線道路を低速で走行しており、追い越しが危険な状態で、5台以上の車両が後ろに続いている場合は、待避所または待避車線を使用して他の車両を先に行かせなければなりません。
- id: 47
  category: sharing_the_road
  question: 右左折の準備をする際、交差点の手前どれくらいの距離までであれば、自転車専用レーンを走行することが法的に認められていますか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: C
  explanation: 右左折する場合を除き、自転車専用レーンを走行することは違法です。右左折する場合は、交差点から200フィート以内の範囲で自転車専用レーンに入ることができます。
- id: 48
  category: sharing_the_road
  question: 交通車両や路上駐車との間隔をより広く取るために、シェブロン（山形マーク）や斜線のマーキングを使用している自転車レーンの種類はどれですか？
  choices:
    A: 分離型自転車道
    B: バッファ付き自転車レーン（Buffered bike lane）
    C: 自転車大通り（Bicycle boulevard）
    D: 共有道路
  answer: B
  explanation: バッファ付き自転車レーンは、交通車両や路上駐車との間隔をより広く取るために、シェブロンや斜線のマーキングを使用しています。
- id: 49
  category: signs_and_signals
  question: 赤色の矢印信号で停車しており、右折したい場合はどうしなければなりませんか？
  choices:
    A: 完全に停止した後、右折する。
    B: 接近してくる車両がない場合にのみ右折する。
    C: 信号が緑色に変わるまで待ってから右折する。
    D: 歩行者に道を譲り、その後右折する。
  answer: C
  explanation: 赤色の矢印信号で停車している間は、右折することはできません。信号が緑色に変わるまで待ってから右折する必要があります。
- id: 50
  category: safe_driving_rules
  question: 公共交通機関のバス専用エリアを車両で走行することは合法ですか？
  choices:
    A: はい、交通量が多い場合はバスレーンを走行してもよい。
    B: はい、ただし低速車両を追い越す場合に限る。
    C: いいえ、バスレーンに入ることは常に違法である。
    D: いいえ、ただし右折するためにバスレーンを横切ることはできる。
  answer: D
  explanation: 公共交通機関のバス専用エリアで車両を走行、停車、駐車、または放置することは違法です。ただし、右折するためにバスレーンを横切ることは可能です。
- id: 51
  category: defensive_driving
  question: 左折待ちの間、なぜ車輪をまっすぐ前に向けておく必要があるのですか？
  choices:
    A: 信号が青になった時に加速しやすくなるため。
    B: 後ろから追突された際、対向車線に押し出されるのを防ぐため。
    C: 他のドライバーに交通の切れ間を待っていることを知らせるため。
    D: 車両のパワーステアリングシステムの摩耗を減らすため。
  answer: B
  explanation: 曲がり始めるのに安全な状態になるまで、車輪はまっすぐ前に向けておく必要があります。車輪が左を向いている状態で後ろから追突されると、対向車線に押し出される可能性があるからです。
- id: 52
  category: safe_driving_rules
  question: 法的に赤信号で左折ができるのはどのような状況ですか？
  choices:
    A: 一方通行の道路から別の一方通行の道路へ曲がる時。
    B: 対面通行の道路から一方通行の道路へ曲がる時。
    C: 一方通行の道路から対面通行の道路へ曲がる時。
    D: 赤信号で左折することは決してできない。
  answer: A
  explanation: 禁止の標識がない限り、一方通行の道路から別の一方通行の道路へ左折する場合は、赤信号でも左折することができます。
- id: 53
  category: safe_driving_rules
  question: 各方向に少なくとも何フィート先まで明確に見通せない場合、Uターン（転回）をしてはいけませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: マニュアルには、各方向に200フィート先まで明確に見通せない場合は、決してUターンをしてはならないと記載されています。
- id: 54
  category: safe_driving_rules
  question: Uターンと消防署に関する記述のうち、正しいものはどれですか？
  choices:
    A: 消防車がいない場合は、消防署のドライブウェイ（私道）を使って方向転換してもよい。
    B: 日中のみ、消防署の前でUターンをしてもよい。
    C: 消防署のドライブウェイを使って方向転換をしてはならない。
    D: 緊急車両を運転している場合は、消防署のドライブウェイでUターンをしてもよい。
  answer: C
  explanation: 消防署の前でUターンをしてはならず、また方向転換のために消防署のドライブウェイを使用してはいけません。
- id: 55
  category: defensive_driving
  question: 交差点で他の車両の後ろに停車する際、前の車との間にどの程度のスペースを空けるべきですか？
  choices:
    A: 前の車の後輪が見える程度のスペース。
    B: ちょうど車1台分の長さ。
    C: 少なくとも3秒間の車間距離。
    D: 前の車のリアバンパーが見える程度のスペース。
  answer: A
  explanation: ブレーキをかけて車両の後ろに停車する際は、前の車の後輪が見える程度のスペースを空ける必要があります。
- id: 56
  category: safe_driving_rules
  question: ハイウェイ（高速道路）に合流する際、どちらに優先権がありますか？
  choices:
    A: ハイウェイに入る車両。
    B: ハイウェイを走行中の車両。
    C: より速い速度で走行している車両。
    D: 右側の車両。
  answer: B
  explanation: 合流の際は、ハイウェイを走行中の車両に優先権があります。安全を確認した上で、ハイウェイの交通の流れに合流しなければなりません。
- id: 57
  category: safe_driving_rules
  question: ハイウェイを出る際、出口の約何秒前から合図（ウィンカー）を出すべきですか？
  choices:
    A: 2秒間
    B: 3秒間
    C: 4秒間
    D: 5秒間
  answer: D
  explanation: 安全にハイウェイを出るためには、出口の5秒前（約400フィート手前）から合図を出す必要があります。
- id: 58
  category: safe_driving_rules
  question: 停止線（リミットライン）のない交差点で曲がろうとする際、どこで車両を停止させるべきですか？
  choices:
    A: 横断歩道に入る前。
    B: 横断歩道の真ん中。
    C: 横断歩道を過ぎた直後。
    D: 交差する道路の端。
  answer: A
  explanation: 停止線がない場合は、横断歩道に入る前に停止しなければなりません。横断歩道もない場合は、交差点に入る前に停止してください。
- id: 59
  category: safe_driving_rules
  question: 商業地区（ビジネス地区）において、Uターンが許可されているのはどこですか？
  choices:
    A: 200フィート以内に接近してくる車両がいない限り、どこでも可能。
    B: 交差点、または開口部が設けられている分断されたハイウェイ（中央分離帯のある道路）のみ。
    C: 消防署の前のみ。
    D: 商業地区では、あらゆる場所でUターンが厳格に禁止されている。
  answer: B
  explanation: 商業地区では、交差点、または開口部が設けられている分断されたハイウェイを除き、Uターンをしてはいけません。
- id: 60
  category: safe_driving_rules
  question: 右左折をする際、どのくらい手前から合図（ウィンカー）を出し始めるべきですか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 150フィート
    D: 200フィート
  answer: B
  explanation: 右左折をする際は、曲がる地点の約100フィート手前から合図を出し始める必要があります。
- id: 61
  category: safe_driving_rules
  question: 高速道路を出る際、どのくらい前から合図を出すべきですか？
  choices:
    A: 3秒前（約200フィート）
    B: 5秒前（約400フィート）
    C: 10秒前（約800フィート）
    D: ハンドルを切り始めた時のみ
  answer: B
  explanation: マニュアルによると、適切な車線にいる場合、高速道路を出る5秒前（約400フィート）に合図を出す必要があります。
- id: 62
  category: safe_driving_rules
  question: 市街地の道路で安全に合流、進入、または車列から離脱するには、どのくらいのスペースが必要ですか？
  choices:
    A: 1ブロック分（約300フィート）
    B: 半ブロック分（約150フィート）
    C: 4分の1ブロック分（約75フィート）
    D: 2ブロック分（約600フィート）
  answer: B
  explanation: 市街地の道路で合流、進入、または離脱するには、半ブロック分（約150フィート）のスペースが必要です。
- id: 63
  category: defensive_driving
  question: 左折を待っている際、対向車が右折の合図を出している場合はどうすべきですか？
  choices:
    A: その車両は曲がらなければならないため、すぐに進行する
    B: 自分が曲がる前に相手に気づかせるため、クラクションを鳴らす
    C: その車両が実際に曲がり始めるのを待ってから、左折を開始する
    D: 衝突の可能性を避けるため、代わりに右折する
  answer: C
  explanation: マニュアルでは、右折の合図を出している対向車が、実際に自分の前まで来る前に曲がると決めつけないよう助言しています。その車両が曲がり始めるのを待ってから、左折を開始してください。
- id: 64
  category: safe_driving_rules
  question: 坂道やカーブの手前で他の車両を安全に追い越すには、その坂道やカーブが少なくとも前方どのくらい離れている必要がありますか？
  choices:
    A: 3分の1マイル
    B: 2分の1マイル
    C: 4分の1マイル
    D: 1マイル
  answer: A
  explanation: 安全に追い越しを行うためには、前方の坂道やカーブが少なくとも3分の1マイル先にある必要があるとマニュアルに記載されています。
- id: 65
  category: safe_driving_rules
  question: 交差点、橋、トンネル、または踏切から何フィート以内の場所では、他の車両を追い越してはいけませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: B
  explanation: 交差点、橋、トンネル、踏切、またはその他の危険な場所から100フィート以内では追い越しをしてはいけません。
- id: 66
  category: safe_driving_rules
  question: 以下の条件のうち、車両を右側から追い越すことが許可されるのはどれですか？
  choices:
    A: 前方の車両が制限速度以下で走行しているとき
    B: 追い越すために道路の未舗装部分を安全に走行できるとき
    C: 前方のドライバーが左折しようとしており、右側から安全に追い越せるとき
    D: 対向車がいる2車線の道路にいるとき
  answer: C
  explanation: 右側からの追い越しは、前方のドライバーが左折しようとしていて右側から安全に追い越せる場合、一方通行の道路、または自分の進行方向に2車線以上ある公道でのみ許可されます。
- id: 67
  category: sharing_the_road
  question: 他の車両があなたを追い越そうとしている場合、どうすべきですか？
  choices:
    A: 追い越しを阻止するために加速する
    B: 左側の車線に移動する
    C: 急減速して路肩に寄せる
    D: 車線内の位置と速度を維持する
  answer: D
  explanation: 車両があなたを追い越している最中、または追い越す合図を出している場合は、車線内の位置と速度を維持して、その車両を通過させてください。
- id: 68
  category: safe_driving_rules
  question: 縦列駐車が終わったとき、車両は縁石と平行で、縁石から何インチ以内に収まっている必要がありますか？
  choices:
    A: 12インチ
    B: 18インチ
    C: 24インチ
    D: 36インチ
  answer: B
  explanation: 縦列駐車で車をまっすぐにした際、最終的に車両は縁石と平行になり、縁石から18インチ以内に収まっている必要があります。
- id: 69
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、前輪はどの方向に向けるべきですか？
  choices:
    A: 前輪を縁石の方（右）に向ける
    B: 前輪を縁石とは反対側（左）に向ける
    C: 前輪をまっすぐ前方に向けたままにする
    D: 前輪を道路の路肩の方に向ける
  answer: B
  explanation: 上り坂で駐車する場合は、前輪を縁石とは反対側（左、つまり道路の中央側）に向け、車を数インチ後退させてタイヤを軽く縁石に当てます。
- id: 70
  category: signs_and_signals
  question: 黄色く塗られた縁石は何を示していますか？
  choices:
    A: 限られた時間のみ駐車が可能であること
    B: いかなる時も停車、駐停車、駐車が禁止されていること
    C: 乗客の乗り降りのための短時間の停車のみ可能であること
    D: 乗客の乗り降りや荷物の積み下ろしが可能であること
  answer: D
  explanation: 黄色の縁石は、乗客の乗り降りや荷物の積み下ろしができることを意味します。掲示されている時間を超えて停車してはならず、通常、非商用車のドライバーは車両に付き添っている必要があります。
- id: 71
  category: safe_driving_rules
  question: 消火栓または消防署の出入り口から何フィート以内に車両を駐車することは違法ですか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 25フィート
  answer: B
  explanation: 消火栓または消防署の出入り口から15フィート以内に車両を駐車したり、放置したりしてはいけません。
- id: 72
  category: penalties_and_points
  question: 緊急時にフリーウェイで停車しなければならない場合、車両が何時間以上放置されると撤去される可能性がありますか？
  choices:
    A: 2時間
    B: 4時間
    C: 12時間
    D: 24時間
  answer: B
  explanation: フリーウェイで4時間以上停車、駐車、または放置されている車両は撤去される場合があります。
- id: 73
  category: driver_responsibility
  question: 警察による停車命令（Law Enforcement Stop）を受けた際、警察官に気づいていることを知らせるために何をすべきですか？
  choices:
    A: ハザードランプを点ける
    B: 右側の方向指示器（ウィンカー）を出す
    C: 窓から手を振る
    D: ブレーキを繰り返し踏む
  answer: B
  explanation: 警察による停車命令を受けた際は、警察官に気づいていることを知らせるために、右側の方向指示器（ウィンカー）を出してください。
- id: 74
  category: driver_responsibility
  question: 警察に車を止められた際、警察官が接触してくる前に、運転者とすべての同乗者はどこに手を置くべきですか？
  choices:
    A: ポケットの中
    B: はっきりと見える場所
    C: 車の天井
    D: 背中の後ろ
  answer: B
  explanation: マニュアルには、警察官が接触してくる前に、運転者とすべての同乗者は手をはっきりと見える場所に置くべきであると記載されています。
- id: 75
  category: vehicle_information
  question: 燃費を最大化し、排出ガスを抑えるために推奨される方法は次のうちどれですか？
  choices:
    A: 可能な限り素早く加速・ブレーキを行う
    B: トラクションを高めるために余分な荷物を積んでおく
    C: 一定の速度で走行しながら、滑らかに加速・減速する
    D: 車両の要件に関わらずプレミアムガソリン（ハイオク）を使用する
  answer: C
  explanation: 燃費を最大化し排出ガスを抑えるために、マニュアルでは、滑らかに加速・減速すること、一定の速度で走行すること、定期的にタイヤの空気圧を調整すること、オイル交換を行うこと、そして車両から余分な荷物を降ろすことを推奨しています。
- id: 76
  category: driver_responsibility
  question: 警察官が犯罪捜査や交通違反に関する質問を開始する前に、必ず行わなければならないことは何ですか？
  choices:
    A: やり取りを録音する許可を求める
    B: 交通違反または歩行者の呼び止めの理由を述べる
    C: 移民ステータス（在留資格）を尋ねる
    D: 車内に武器がないか捜索する
  answer: B
  explanation: 差し迫った脅威がある場合を除き、警察官は犯罪捜査や交通違反に関する質問を開始する前に、交通違反または歩行者の呼び止めの理由を述べなければなりません。
- id: 77
  category: driver_responsibility
  question: 警察に止められた際、車両の運転者はどの書類を提示しなければなりませんか？
  choices:
    A: 運転免許証、保険の証明、および車両登録証
    B: 運転免許証、パスポート、および保険の証明
    C: 車両登録証、保険の証明、および予備の身分証明書
    D: 運転免許証と社会保障カード
  answer: A
  explanation: 警察に止められた際、車両の運転者は運転免許証、保険の証明、および車両登録証を提示しなければなりません。
- id: 78
  category: driver_responsibility
  question: カリフォルニア州において、交通取り締まり中にあなたの移民ステータス（在留資格）について尋ねることが法的に許可されているのは誰ですか？
  choices:
    A: 州高速道路巡回隊（ハイウェイパトロール）のみ
    B: 地元または州のすべての警察官
    C: 連邦法執行官のみ
    D: いかなる警察官も尋ねることは許可されていない
  answer: C
  explanation: カリフォルニア州では、連邦法執行官のみが移民ステータスについて尋ねることができます。カリフォルニア州法は、州および地元の警察官が運転者や同乗者に移民ステータスについて尋ねることを禁止しています。
- id: 79
  category: driver_responsibility
  question: 交通取り締まり中に警察官とのやり取りを録音・録画することを選択した場合、避けるべき行動は何ですか？
  choices:
    A: 録音・録画していることをすぐに明確にすること
    B: 許可なくデバイスを取り出すために隠れた場所に手を伸ばすこと
    C: 携帯電話のロック解除の要求を拒否すること
    D: 公共の場所でやり取りを録音・録画すること
  answer: B
  explanation: 警察官の適法な職務執行を妨害する権利はありません。また、警察官の許可なく録音・録画機器を取り出すために隠れた場所に手を伸ばしてはいけません。
- id: 80
  category: signs_and_signals
  question: 赤色の点灯信号で右折が許可されるのは、どのような条件の場合ですか？
  choices:
    A: 右向きの緑色の矢印信号がある場合のみ
    B: 対向車がいなければ、停止せずにいつでも可能
    C: 「NO TURN ON RED」の標識がなく、一時停止して安全を確認した後
    D: 赤信号での右折は決して許可されない
  answer: C
  explanation: 「NO TURN ON RED（赤信号での右折禁止）」の標識が出ていない場合、停止線（または限界線）で停止し、歩行者に道を譲り、安全が確認できれば赤信号でも右折することができます。
- id: 81
  category: signs_and_signals
  question: 赤色の矢印信号は何を意味しますか？
  choices:
    A: 完全に停止した後であれば、矢印の方向に曲がることができる
    B: 停止してください。赤色の矢印信号では曲がってはいけません
    C: 曲がる前に対向車に道を譲る
    D: 保護された右左折時間が終了しようとしている
  answer: B
  explanation: 赤色の矢印は「停止」を意味します。赤色の矢印信号では曲がってはいけません。青信号または青色の矢印信号が表示されるまで停止したままでいてください。
- id: 82
  category: signs_and_signals
  question: 交差点に近づいたときに信号が黄色の点灯に変わった場合、どのように対応すべきですか？
  choices:
    A: 赤に変わる前に交差点を通過できるよう加速する
    B: 場所に関わらず即座に停止する
    C: 安全に停止できる場合は停止し、そうでない場合は注意して交差点を通過する
    D: 譲れ（YIELD）の標識として扱い、停止せずに進む
  answer: C
  explanation: 黄色の信号は「注意」を意味します。信号がまもなく赤に変わることを示しています。安全に停止できる場合は停止してください。安全に停止できない場合は、注意して交差点を通過してください。
- id: 83
  category: signs_and_signals
  question: 黄色の点滅信号ではどのような行動をとるのが正しいですか？
  choices:
    A: 完全に停止し、青信号を待つ
    B: 減速し、注意を払い、停止せずに慎重に進む
    C: 交差点を全方向一時停止として扱う
    D: 進む前に右側のすべての車両に道を譲る
  answer: B
  explanation: 黄色の点滅信号は「注意して進め」という警告です。減速して注意を払ってください。停止する必要はありません。
- id: 84
  category: signs_and_signals
  question: 黄色の点滅矢印は、右左折について何を意味しますか？
  choices:
    A: あなたの右左折は他の交通から保護されている
    B: 矢印の方向に曲がることはできない
    C: 曲がることはできるが、保護されていないため、対向車に道を譲らなければならない
    D: 停止して青色の矢印信号を待たなければならない
  answer: C
  explanation: 黄色の点滅矢印は、曲がることはできますが、他の交通から保護されていないことを意味します。対向車に道を譲った後、注意して進んでください。
- id: 85
  category: signs_and_signals
  question: 信号は青ですが、交差点内まで渋滞しています。どうすべきですか？
  choices:
    A: 交差点に入り、渋滞が解消されるのを待つ
    B: クラクションを鳴らして前の車を動かす
    C: 信号が赤になる前に完全に通り抜けられない場合は、交差点に入らない
    D: ゆっくり進み、停止している車両の間を縫うように走る
  answer: C
  explanation: 青信号は「進め」を意味しますが、信号が赤に変わる前に交差点を完全に通り抜けられない場合は、交差点に入ってはいけません。
- id: 86
  category: signs_and_signals
  question: 信号機が作動していない交差点に近づいた場合、どうしなければなりませんか？
  choices:
    A: 右側の車両に譲ってから進む
    B: 交差点の全方向に一時停止標識（STOP sign）があるものとして停止する
    C: 時速15マイルまで減速し、慎重に進む
    D: 警察官が到着して交通整理を行うのを待つ
  answer: B
  explanation: 信号機が作動していないときは、交差点の全方向に一時停止標識があるものとして停止してください。その後、安全を確認してから慎重に進んでください。
- id: 87
  category: sharing_the_road
  question: 歩行者が道路を横断中に「横断禁止（DON'T WALK）」のライトが点滅し始めた場合、運転者はどうしなければなりませんか？
  choices:
    A: クラクションを鳴らして歩行者に急ぐよう警告する
    B: 歩行者の時間が終了したので、そのまま横断歩道を通過する
    C: 「横断禁止」ライトが点滅していても、歩行者に道を譲る
    D: 歩行者の周りをゆっくり避けて運転する
  answer: C
  explanation: 運転者は、たとえ「横断禁止」ライトが点滅し始めていても、横断中の歩行者に道を譲らなければなりません。
- id: 88
  category: signs_and_signals
  question: 一時停止標識（STOP sign）に近づく際、どこで完全に停止しなければなりませんか？
  choices:
    A: 交通状況が見えるように、横断歩道を少し過ぎた場所
    B: 横断歩道に入る前、または停止線（リミットライン）の手前
    C: 対向車がいる場合のみ停止する
    D: 交差点の少なくとも20フィート手前
  answer: B
  explanation: 一時停止標識では、横断歩道に入る前、または停止線で完全に停止してください。停止線や横断歩道がない場合は、交差点に入る前に停止してください。
- id: 89
  category: vehicle_information
  question: DMVキオスク（自動端末）で完了できる手続きは次のうちどれですか？
  choices:
    A: 運転免許の筆記試験を受ける
    B: 保険の証明書を提出し、車両登録の更新を完了する
    C: 初めての運転免許証を申請する
    D: 交通違反の罰金を支払う
  answer: B
  explanation: DMVキオスクでは、車両登録の更新、登録証やステッカーの再発行、保険証明書の提出、一時登録抹消（PNO）の申請、運転記録や車両記録の取得などの手続きが可能です。
- id: 90
  category: driver_responsibility
  question: 交通検問（トラフィックストップ）の際、身分証明書の提示を求められた同乗者の権利は何ですか？
  choices:
    A: 同乗者は常に法的に即座の身分証明書提示を義務付けられている
    B: 提示を拒否することができるが、状況によっては身元を明らかにするよう求められる場合がある
    C: 運転している場合のみ身分証明書を提示しなければならない
    D: いかなる状況においても身元を明らかにする必要はない
  answer: B
  explanation: 警察官は同乗者の氏名や身分証明書の提示を求めることがあります。同乗者はその要求を拒否できますが、特定の状況下では身元を明らかにするよう義務付けられる場合があります。
- id: 91
  category: signs_and_signals
  question: 五角形の道路標識は何を示していますか？
  choices:
    A: 踏切に近づいています。
    B: 学校の近くにいます。
    C: 優先権を譲らなければなりません。
    D: 分離ハイウェイに入ろうとしています。
  answer: B
  explanation: マニュアルによると、五角形の標識は学校の近くであることを意味します。徐行し、横断歩道にいる子供たちのために停止する必要があります。
- id: 92
  category: signs_and_signals
  question: 黄色と黒の円形の標識、またはX字型の標識は何を警告していますか？
  choices:
    A: この先、曲がりくねった道
    B: 歩行者横断歩道
    C: 踏切
    D: 進入禁止の入り口
  answer: C
  explanation: 黄色と黒の円形の標識またはX字型の標識は、踏切に近づいていることを示しています。目で確認し、音を聞き、速度を落として、停止の準備をしなければなりません。
- id: 93
  category: safe_driving_rules
  question: 一時停止（STOP）や譲れ（YIELD）の標識がない丁字路（T字路）では、誰に優先権がありますか？
  choices:
    A: 突き当たりの道路（行き止まり側の道路）を走行している車両。
    B: 左折する車両。
    C: 右側の車両。
    D: 直進路（通り抜ける道路）上の車両、自転車、および歩行者。
  answer: D
  explanation: 一時停止や譲れの標識がない丁字路では、直進路（そのまま直進し続ける道路）上の車両、自転車、および歩行者に優先権があります。
- id: 94
  category: safe_driving_rules
  question: 一時停止や譲れの標識がない交差点に、あなたともう一台の車両が全く同時に到着した場合、どちらが譲らなければなりませんか？
  choices:
    A: 左側の車両が右側の車両に譲らなければなりません。
    B: 右側の車両が左側の車両に譲らなければなりません。
    C: 大きい車両に優先権があります。
    D: より速く走行している車両に優先権があります。
  answer: A
  explanation: 車両、歩行者、または自転車があなたと同時に交差点に到着した場合、自分の右側にいる車両、歩行者、または自転車に優先権を譲らなければなりません。
- id: 95
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）では、交通はどの方向に進みますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 直線
    D: 交通量が少ない方の向き
  answer: B
  explanation: ラウンドアバウトを利用する際は、反時計回りに進まなければなりません。
- id: 96
  category: safe_driving_rules
  question: ラウンドアバウトを走行中に目的の出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 停止して、慎重に出口までバックする。
    B: 中央島を越えてUターンする。
    C: 次の利用可能な道路で出て、引き返す。
    D: 出口に戻るまでそのまま回り続ける。
  answer: D
  explanation: マニュアルには、ラウンドアバウトで出口を通り過ぎた場合は、その出口に戻るまで回り続けるべきであると記載されています。
- id: 97
  category: sharing_the_road
  question: 横断歩道で停止している車両を追い越すのが危険で違法なのはなぜですか？
  choices:
    A: 停止している車両が突然バックする可能性があるため。
    B: 通りを横断している歩行者が見えない可能性があるため。
    C: 停止している車両に右左折の優先権があるため。
    D: 緊急車両のために交差点を塞いでしまうため。
  answer: B
  explanation: 横断歩道で停止している車両を追い越してはいけません。通りを横断している歩行者が見えない可能性があるからです。
- id: 98
  category: sharing_the_road
  question: 目の不自由な歩行者が杖を引き込み、交差点から離れた場合、通常それは何を意味しますか？
  choices:
    A: あなたがクラクションを鳴らすのを待っている。
    B: あなたに停止して横断を助けてほしいと思っている。
    C: この仕草は通常、あなたが進んでもよいことを意味します。
    D: 道路上の危険をあなたに警告している。
  answer: C
  explanation: 目の不自由な人が杖を引き込み、交差点から離れた場合、この仕草は通常、あなたが進んでもよいことを意味します。
- id: 99
  category: safe_driving_rules
  question: 急で狭い山道で2台の車両が出会い、どちらもすれ違うことができない場合、どちらの車両に優先権がありますか？
  choices:
    A: 下り坂に面している車両。
    B: 上り坂に面している車両。
    C: 後から到着した車両。
    D: より重い車両。
  answer: B
  explanation: 急で狭い道路で2台の車両が出会い、どちらもすれ違うことができない場合、上り坂に面している車両に優先権があります。下り坂に面している車両がバックする必要があります。
- id: 100
  category: sharing_the_road
  question: 大型トラックの死角（ノー・ゾーン）を走行しているかどうかは、どうすれば分かりますか？
  choices:
    A: トラックのサイドミラーが見えない場合、トラックの運転手からもあなたが見えていません。
    B: トラックの真ん前を走行している場合。
    C: トラックのナンバープレートが見える場合。
    D: トラックの左側を走行している場合。
  answer: A
  explanation: 大型車両には「ノー・ゾーン（No Zone）」と呼ばれる大きな死角があります。トラックのサイドミラーが見えない場合、トラックの運転手からもあなたが見えていません。
- id: 101
  category: sharing_the_road
  question: 時速55マイルで走行中の大型車両が完全に停止するまでに、およそ何フィート必要ですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 400フィート
  answer: D
  explanation: 時速55マイルで走行中の大型車両が停止するには最大400フィートかかることがあり、これは同じ速度で300フィート以内に停止できる一般的な乗用車と比較して長くなります。
- id: 102
  category: sharing_the_road
  question: 大型車両やトラックの運転手が、右左折を完了するために大きく膨らんで曲がることが多いのはなぜですか？
  choices:
    A: 曲がっている間も高速を維持する必要があるため。
    B: 後輪が前輪よりも短い経路（内側）をたどるため。
    C: ハンドルを乗用車ほど急に切ることができないため。
    D: 曲がる際に2車線を使用することが法律で義務付けられているため。
  answer: B
  explanation: 車両が曲がるとき、後輪は前輪よりも短い経路をたどります。車両が長ければ長いほどその差は大きくなるため、大型車両は右左折を完了するために大きく膨らんで曲がらなければならないことがよくあります。
- id: 103
  category: sharing_the_road
  question: 大型車両やトラックを追い越す際、常にどちら側から追い越すべきですか？
  choices:
    A: 右側
    B: 左側
    C: 路肩
    D: 車線が広い方
  answer: B
  explanation: マニュアルには次のように明記されています。「大型車両を追い越す際は、常に左側から追い越してください。大型車両やトラックを追い越した後は、その前方に進んでください。」
- id: 104
  category: sharing_the_road
  question: 歩行者安全地帯を走行することが許可されるのは、どのような条件の場合ですか？
  choices:
    A: 歩行者がいないとき。
    B: 右折をするとき。
    C: 停車中のバスを追い越すとき。
    D: いかなる条件でも不可。
  answer: D
  explanation: 安全地帯は、バス、路面電車、トロリーを待つ歩行者のために設けられたスペースです。マニュアルには「いかなる条件であっても、安全地帯を走行してはならない」と記載されています。
- id: 105
  category: sharing_the_road
  question: 安全地帯や信号機で停車しているバス、路面電車、またはトロリーの横を通過する際の最高速度制限は何ですか？
  choices:
    A: 時速10マイル
    B: 時速15マイル
    C: 時速20マイル
    D: 時速25マイル
  answer: A
  explanation: バス、路面電車、またはトロリーが安全地帯や信号機で停車している場合、時速10マイル以下で通過することができます。
- id: 106
  category: safe_driving_rules
  question: オートバイの後ろを走行する際、推奨される車間距離はどれくらいですか？
  choices:
    A: 1秒間
    B: 2秒間
    C: 3秒間
    D: 4秒間
  answer: C
  explanation: 3秒間の安全な車間距離を保ってください。この距離を保つことで、オートバイが急ブレーキをかけたり転倒したりした場合の衝突を避けることができます。
- id: 107
  category: safe_driving_rules
  question: サイレンを鳴らし赤色灯を点灯させた緊急車両が近づいてきたとき、交差点内にいた場合はどうすべきですか？
  choices:
    A: 交差点の真ん中ですぐに停止する
    B: 交差点の右端に寄せて停止する
    C: そのまま交差点を通り抜け、安全が確認でき次第すぐに右側に寄せて停止する
    D: 緊急車両が到着する前に交差点を抜けるよう加速する
  answer: C
  explanation: 交差点内にいるときに緊急車両を見かけた場合は、そのまま交差点を通り抜けてください。その後、安全が確認でき次第すぐに右側に寄せて停止してください。
- id: 108
  category: safe_driving_rules
  question: サイレンや点滅灯を使用している緊急車両の後方を走行する際、何フィート以内に近づくことが法律で禁止されていますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: 消防車、警察車両、救急車、その他の緊急車両がサイレンや点滅灯を使用している場合、その300フィート以内を追従することは法律で禁止されています。
- id: 109
  category: signs_and_signals
  question: 通常時速25マイル以下で走行する道路維持作業車などの低速車両であることを示す標識はどれですか？
  choices:
    A: 屋根の黄色い点滅灯
    B: 背面のオレンジと赤の三角形
    C: テールゲートに描かれた白いひし形
    D: 赤と白のストライプのバンパーステッカー
  answer: B
  explanation: 一部の低速車両（通常時速25マイル以下で走行する道路維持作業車など）の背面には、オレンジと赤の三角形のマークが付いています。
- id: 110
  category: safe_driving_rules
  question: 近隣用電気自動車（NEV）および低速車両（LSV）は、制限速度が時速何マイルを超える道路での走行が制限されていますか？
  choices:
    A: 時速25マイル
    B: 時速35マイル
    C: 時速45マイル
    D: 時速55マイル
  answer: B
  explanation: NEVおよびLSVの最高速度は時速25マイルです。これらの車両は、制限速度が時速35マイルを超える道路での走行が制限されています。
- id: 111
  category: driver_responsibility
  question: 自転車利用者の責任によると、自転車利用者は何歳未満の場合にヘルメットを着用しなければなりませんか？
  choices:
    A: 16歳
    B: 18歳
    C: 21歳
    D: 14歳
  answer: B
  explanation: 自転車利用者として、18歳未満の場合はヘルメットを着用しなければなりません。
- id: 112
  category: vehicle_information
  question: 夜間に自転車に乗る際、自転車にはどのくらいの距離から見える白色のフロントランプを装備しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: 暗い場所では、自転車に300フィート（約91メートル）先から見える白色のフロントランプを装備する必要があります。
- id: 113
  category: sharing_the_road
  question: 自転車を安全に追い越すために車線を変更できない場合、自車と自転車の間に最低限どのくらいの距離を空けなければなりませんか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 5フィート
  answer: B
  explanation: 自転車を追い越すために車線を変更できない場合は、自車と自転車の間に少なくとも3フィート（約0.9メートル）の距離を空けてください。
- id: 114
  category: safe_driving_rules
  question: 右左折の準備をする際、曲がり始める地点の何フィート手前から自転車専用車線（バイクレーン）に入ることができますか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: C
  explanation: 右左折を開始する地点の200フィート（約61メートル）手前以内から自転車専用車線に入ることができます。
- id: 115
  category: penalties_and_points
  question: 道路作業員への暴行で有罪判決を受けた運転者に科される可能性のある罰則は何ですか？
  choices:
    A: 最大500ドルの罰金と30日の拘留
    B: 最大1,000ドルの罰金と6か月の拘留
    C: 最大2,000ドルの罰金と最大1年の禁錮刑
    D: 最大5,000ドルの罰金と免許取り消し
  answer: C
  explanation: 道路作業員への暴行で有罪判決を受けた者は、最大2,000ドルの罰金および最大1年の禁錮刑に処される可能性があります。
- id: 116
  category: sharing_the_road
  question: 交通の流れよりも遅く走行する自転車利用者は、以下の場合を除き、できるだけ右側の縁石または道路の端に寄って走行しなければなりません。
  choices:
    A: 2車線の高速道路を走行しているとき
    B: 左折の準備をしているとき
    C: 一時停止標識のある交差点に近づいているとき
    D: 住宅街を走行しているとき
  answer: B
  explanation: 交通の流れよりも遅く走行する自転車利用者は、追い越し、左折の準備、危険回避などの場合を除き、できるだけ右側の縁石または道路の端に寄って走行しなければなりません。
- id: 117
  category: penalties_and_points
  question: 高速道路の建設または保守区域において、交通違反の罰金が2倍になるのはどのような条件の時ですか？
  choices:
    A: 夜間のみ
    B: 作業員がいるとき
    C: 制限速度が15マイル毎時以上引き下げられているとき
    D: 路肩で重機が稼働しているとき
  answer: B
  explanation: 高速道路の建設または保守区域において、作業員がいる場合は罰金が2倍になります。
- id: 118
  category: sharing_the_road
  question: モーターサイクル（自動二輪車）との道路共有に関する記述のうち、正しいものはどれですか？
  choices:
    A: モーターサイクルが他の車両と車線を共有することは違法である
    B: スペースを節約するため、同じ車線内でモーターサイクルを追い越すべきである
    C: モーターサイクルと車線を共有することは合法であり、これはレーンスプリッティング（すり抜け走行）として知られている
    D: 渋滞時、モーターサイクルは路肩を走行しなければならない
  answer: C
  explanation: 可能な限り、モーターサイクルには車線全体を譲ってください。モーターサイクルと同じ車線を共有することは合法であり、これは「レーンスプリッティング（lane
    splitting）」として知られています。
- id: 119
  category: safe_driving_rules
  question: 赤色のライトを点滅させているスクールバスに対して停止しなかった場合の罰則は何ですか？
  choices:
    A: 最大500ドルの罰金と6か月の免許停止
    B: 最大1,000ドルの罰金、および1年間の運転免許停止の可能性
    C: 初犯の場合は警告
    D: 運転記録に2ポイントの加算と250ドルの罰金
  answer: B
  explanation: 赤色のライトを点滅させているスクールバスに対して停止しなかった場合、最大1,000ドルの罰金が科され、運転免許が1年間停止される可能性があります。
- id: 120
  category: safe_driving_rules
  question: 同一方向に4車線あり、低速車線の指定がない高速道路でトレーラーを牽引している場合、どの車線を走行できますか？
  choices:
    A: 制限速度を守っている限り、どの車線でもよい
    B: 一番左側の車線のみ
    C: 道路の右端に最も近い2車線
    D: 中央の2車線
  answer: C
  explanation: 同一方向に4車線以上あり、車線指定がない道路で車両またはトレーラーを牽引する場合、道路の右端に最も近い2車線のみを走行できます。
- id: 121
  category: safe_driving_rules
  question: 見通しの悪い交差点（ブラインド・インターセクション）の制限速度は？
  choices:
    A: 時速10マイル (10 mph)
    B: 時速15マイル (15 mph)
    C: 時速20マイル (20 mph)
    D: 時速25マイル (25 mph)
  answer: B
  explanation: どの角にも一時停止標識がなく、視界が遮られている交差点は見通しの悪い交差点とみなされます。見通しの悪い交差点の制限速度は時速15マイル（15
    mph）です。
- id: 122
  category: vehicle_information
  question: 日中、荷物が車両の後部バンパーから4フィート以上はみ出している場合、何を表示しなければなりませんか？
  choices:
    A: 12インチの赤色または蛍光オレンジ色の正方形の旗。
    B: 2つの赤色灯。
    C: 黄色の回転灯。
    D: 「Wide Load（幅広荷物）」の標識。
  answer: A
  explanation: 車両の後部バンパーから4フィート以上はみ出す荷物には、12インチの赤色または蛍光オレンジ色の正方形の旗を表示しなければなりません。夜間は、2つの赤色灯で標示する必要があります。
- id: 123
  category: safe_driving_rules
  question: 踏切の装置や係員が列車の接近を警告している場合、最も近い線路からどのくらい離れた場所で停止しなければなりませんか？
  choices:
    A: 少なくとも5フィート
    B: 少なくとも10フィート
    C: 少なくとも15フィート
    D: 少なくとも25フィート
  answer: C
  explanation: 踏切の装置や係員が列車の接近を警告している場合、最も近い線路から少なくとも15フィート離れた場所で停止しなければなりません。
- id: 124
  category: penalties_and_points
  question: 成人の場合、運転記録が以下のどの合計点数に達すると、免許停止になる可能性がありますか？
  choices:
    A: 12ヶ月間に2ポイント
    B: 24ヶ月間に3ポイント
    C: 12ヶ月間に4ポイント
    D: 36ヶ月間に5ポイント
  answer: C
  explanation: 成人の場合、運転記録が12ヶ月間に4ポイント、24ヶ月間に6ポイント、または36ヶ月間に8ポイントに達すると、免許が停止される可能性があります。
- id: 125
  category: penalties_and_points
  question: 追跡中の法執行機関からの逃走に起因する過失致死罪で有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 郡拘置所（county jail）への1年以下の拘禁。
    B: 州刑務所（state prison）への最大7年の拘禁。
    C: 州刑務所（state prison）への最低4年から10年の拘禁。
    D: 10,000ドルの罰金と永久的な免許取消。
  answer: C
  explanation: 追跡中の法執行機関からの逃走に起因する過失致死罪で有罪判決を受けた者は、州刑務所（state prison）への最低4年から10年の拘禁に処されます。
- id: 126
  category: penalties_and_points
  question: 無免許の者があなたの車を運転していて捕まった場合、どうなる可能性がありますか？
  choices:
    A: 車両が30日間押収される可能性がある。
    B: 運転記録に2ポイント加算される。
    C: 車両が永久に没収される。
    D: 交通違反者講習（Traffic Violator School）への出席が義務付けられる。
  answer: A
  explanation: マニュアルによると、無免許の者があなたの車を運転していて捕まった場合、その車両は30日間押収される可能性があります。
- id: 127
  category: driver_responsibility
  question: 1ポイントの違反を保険会社に報告されないようにするために、交通違反者講習（Traffic Violator School）にはどのくらいの頻度で出席できますか？
  choices:
    A: 12ヶ月間に1回。
    B: 18ヶ月間に1回。
    C: 24ヶ月間に1回。
    D: 36ヶ月間に1回。
  answer: B
  explanation: 1ポイントの交通違反を犯した場合、裁判官から交通違反者講習への出席を選択肢として提示されることがあります。これは18ヶ月間に1回行うことができます。
- id: 128
  category: vehicle_information
  question: フロントガラスのどの位置に電子通行料金支払いデバイスを取り付けることが許可されていますか？
  choices:
    A: 運転席側窓の下の角にある7インチ四方の範囲。
    B: フロントガラスの中央最上部にある5インチ四方の範囲。
    C: フロントガラスの助手席側のどこでも。
    D: バックミラーから直接吊り下げる。
  answer: B
  explanation: 物体は特定の場所にのみ取り付けることができ、電子通行料金支払いデバイスの場合は、フロントガラスの中央最上部にある5インチ四方の範囲が含まれます。
- id: 129
  category: driver_responsibility
  question: 高速道路や幹線道路（highway）に動物を捨てたり放置したりした場合の罰則は何ですか？
  choices:
    A: 最大500ドルの罰金。
    B: 最大1,000ドルの罰金、6ヶ月の禁錮、またはその両方。
    C: 義務的な社会奉仕活動と250ドルの罰金。
    D: 警告と運転記録への1ポイント加算。
  answer: B
  explanation: 高速道路や幹線道路に動物を捨てたり放置したりしてはいけません。この犯罪は、最大1,000ドルの罰金、6ヶ月の禁錮、またはその両方で罰せられます。
- id: 130
  category: sharing_the_road
  question: トラックに表示されているひし形の標識は何を示していますか？
  choices:
    A: トラックが規定外の大きな荷物を運んでいる。
    B: トラックが低速で走行している。
    C: トラックの積載物が危険である可能性がある（ガス、爆発物など）。
    D: トラックが頻繁に停車する。
  answer: C
  explanation: トラックにあるひし形の標識は、トラックの積載物が危険である可能性がある（ガス、爆発物など）ことを意味します。これらの標識がある車両は、線路を渡る前に停止しなければなりません。
- id: 131
  category: penalties_and_points
  question: 未成年者が免許取得後の最初の12ヶ月間に、2回の過失による衝突事故を起こすか、交通違反の有罪判決を受けた場合、どうなりますか？
  choices:
    A: 免許が6ヶ月間停止される。
    B: 25歳以上の免許を持つ成人が同乗しない限り、30日間運転することができない。
    C: 18歳になるまで免許が取り消される。
    D: 罰金を支払い、運転免許試験を再受験しなければならない。
  answer: B
  explanation: マニュアルによると、未成年者が2回の過失による衝突事故、2回の交通違反の有罪判決、またはその両方を1回ずつ起こした場合、25歳以上の免許を持つ成人が同乗しない限り、30日間運転することはできません。
- id: 132
  category: alcohol_drugs_health
  question: 15歳から20歳の間で、アルコールまたは規制薬物の使用で有罪判決を受けた場合、裁判所はDMVに対し何を命じますか？
  choices:
    A: 運転特権を1年間停止するか、免許申請の資格取得時期を遅らせる。
    B: 免許を永久に取り消す。
    C: イグニッション・インターロック装置（飲酒運転防止装置）の設置を義務付ける。
    D: 6ヶ月間の保護観察処分にする。
  answer: A
  explanation: マニュアルには、15歳から20歳の間でアルコールまたは規制薬物の使用により有罪判決を受けた場合、裁判所はDMVに対し、運転特権を1年間停止するか、運転免許の申請資格を遅らせるよう命じると記載されています。
- id: 133
  category: driver_responsibility
  question: 運転特権に対して何らかの措置が取られるという通知を郵送で受け取った場合、行政聴聞会を要求するのに何日間の猶予がありますか？
  choices:
    A: 投函日から10日以内
    B: 投函日から14日以内
    C: 投函日から30日以内
    D: 投函日から60日以内
  answer: B
  explanation: 通知を直接手渡された場合は10日以内、郵送された場合はその投函日から14日以内に行政聴聞会を要求しなければなりません。期限内に要求しない場合、聴聞を受ける権利は失われます。
- id: 134
  category: license_system
  question: 運転記録の情報のほとんどは一般に公開されています。次のうち、機密として扱われるものはどれですか？
  choices:
    A: 交通違反の有罪判決
    B: 過失による衝突事故
    C: 身体的または精神的状態
    D: 免許停止の履歴
  answer: C
  explanation: 運転記録にある情報のほとんどは一般に公開されますが、身体的または精神的状態、住所、社会保障番号（SSN）は例外として機密扱いとなります。
- id: 135
  category: safe_driving_rules
  question: 反応する時間を確保し、直前の急な動きを避けるために、少なくともどのくらい先まで道路をスキャンすべきですか？
  choices:
    A: 自車の5秒先
    B: 自車の10秒先
    C: 自車の15秒先
    D: 自車の20秒先
  answer: B
  explanation: 反応する時間を確保し、直前の急な動きや危険を避けるために、常に目を動かし、少なくとも自車の10秒先までの道路状況をスキャンするようにしてください。
- id: 136
  category: defensive_driving
  question: 他の車両が自分の直前に割り込んできた（合流してきた）場合、車間距離を空けるためにどうすべきですか？
  choices:
    A: クラクションを鳴らして運転者に警告する
    B: 急ブレーキをかける
    C: 隣の車線に急ハンドルを切る
    D: アクセルから足を離す
  answer: D
  explanation: 他の車両が自分の直前に割り込んできた場合は、アクセルから足を離してください。これにより、前方の車両との間に安全なスペースが確保されます。
- id: 137
  category: defensive_driving
  question: 後方の車両が車間距離を極端に詰めてきた（あおり運転）場合、どのように対処するのが最善ですか？
  choices:
    A: ブレーキを軽く踏んで警告する
    B: 加速して距離を広げる
    C: 進路と速度を維持し、安全になったら右側に車線変更して道を譲る
    D: ハザードランプをつけて停車する
  answer: C
  explanation: 後方の車両が車間距離を詰めてきたときは、そのままの進路と速度を維持してください。その後、安全を確認した上で右側の車線に移動し、後続車を先に行かせてください。
- id: 138
  category: safe_driving_rules
  question: 車線変更をする前に死角を確認する適切な方法は何ですか？
  choices:
    A: バックミラーを3秒間見る
    B: 体全体を回して後ろの窓から確認する
    C: サイドウィンドウから左右の肩越しに目視する
    D: サイドミラーのみを頼りにする
  answer: C
  explanation: 死角を確認するには、サイドウィンドウから左右の肩越しに目視してください。確認する際は頭だけを動かし、体全体やハンドルを回さないように注意してください。
- id: 139
  category: safe_driving_rules
  question: 夜間、対向車のヘッドライトが眩しすぎる場合、どこを見るべきですか？
  choices:
    A: 対向車のヘッドライトを直視する
    B: 自分の車線の右端の方を見る
    C: 道路の中央線の方を見る
    D: バックミラーを見る
  answer: B
  explanation: 対向車のライトが眩しすぎる場合は、ヘッドライトを直視してはいけません。代わりに、自分の車線の右端に視線を向けてください。
- id: 140
  category: safe_driving_rules
  question: 雨の中を運転する際、どのライトを使用すべきですか？
  choices:
    A: ハイビーム（走行用前照灯）
    B: ロービーム（すれ違い用前照灯）
    C: パーキングライト（駐停車灯）のみ
    D: ハザードランプ
  answer: B
  explanation: 雨天時はロービームを使用してください。パーキングライトのみで走行してはいけません。
- id: 141
  category: vehicle_information
  question: 滑りやすい路面で車両がスリップし始めた場合、まず最初にとるべき行動は何ですか？
  choices:
    A: すぐにブレーキを強く踏む
    B: アクセルペダルからゆっくり足を離す
    C: スリップしている方向とは逆の方向にハンドルを切る
    D: ニュートラルにギアを入れる
  answer: B
  explanation: 滑りやすい路面でスリップし始めた場合、最初のステップはアクセルペダルからゆっくりと足を離すことです。また、ブレーキは使用しないでください。
- id: 142
  category: defensive_driving
  question: 滑りやすい路面でのスリップから立て直す際、ハンドル（ステアリングホイール）はどの方向に切るべきですか？
  choices:
    A: スリップしている方向
    B: スリップしている方向とは逆の方向
    C: ハンドルを完全に真っ直ぐに保つ
    D: 素早く左右に動かす
  answer: A
  explanation: スリップし始めたら、アクセルペダルからゆっくりと足を離し、ブレーキは使わず、スリップしている方向にハンドルを切る必要があります。
- id: 143
  category: license_system
  question: 制限付き免許または免許停止中の未成年者が18歳になった場合、どうなりますか？
  choices:
    A: すべての制限や停止処分が直ちに抹消される。
    B: 運転記録が完全にクリアされる。
    C: 18歳になっても、既存の制限、停止処分、または執行猶予判決が抹消されたり終了したりすることはない。
    D: 筆記試験と実技試験を再受験しなければならない。
  answer: C
  explanation: マニュアルには、18歳になっても既存の制限、停止処分、または執行猶予判決が抹消されたり終了したりすることはないと明記されています。
- id: 144
  category: defensive_driving
  question: 夜間、ライトが1つしか点灯していない車両が前方から走ってきた場合、どうすべきですか？
  choices:
    A: ハイビームを点滅させて警告する
    B: できるだけ右側に寄って走行する
    C: 相手にスペースを空けるため、センターライン寄りに移動する
    D: ハザードランプを点灯させる
  answer: B
  explanation: ライトが1つだけの車両が向かってくる場合は、できるだけ右側に寄って走行してください。それは自転車、オートバイ、またはヘッドライトが片方切れた車両である可能性があります。
- id: 145
  category: vehicle_information
  question: 車輪ロックによるスリップ（locked wheel skid）の最も一般的な原因は何ですか？
  choices:
    A: ブラックアイスバーンの上を走行すること
    B: 濡れた路面で急加速すること
    C: スピードが出すぎている状態でブレーキを強くかけすぎること
    D: ハンドルを急激に切りすぎること
  answer: C
  explanation: 車輪ロックによるスリップは、通常、スピードが出すぎている状態でブレーキを強くかけすぎることで発生します。
- id: 146
  category: vehicle_information
  question: 車両に4輪アンチロック・ブレーキ・システム（ABS）が装備されており、車輪ロックによるスリップが発生した場合、どうすべきですか？
  choices:
    A: ブレーキを素早くポンピング（断続的に踏む）する。
    B: ブレーキペダルをしっかりと踏み続ける。
    C: ブレーキペダルから完全に足を離す。
    D: 非常ブレーキを使用して停止する。
  answer: B
  explanation: マニュアルによると、4輪アンチロック・ブレーキ・システム（ABS）を装備した車両で車輪ロックによるスリップから脱出するには、ブレーキペダルをしっかりと踏み続ける必要があります。
- id: 147
  category: vehicle_information
  question: ブレーキが濡れてしまった場合、どのようにして安全に乾かすことができますか？
  choices:
    A: アクセルペダルとブレーキペダルを同時に軽く踏む。
    B: ブレーキペダルを1分間素早くポンピングする。
    C: 低いギアに入れ、乾くまで惰性で走行する。
    D: 車を停めて、太陽で乾くのを待つ。
  answer: A
  explanation: マニュアルには次のように記載されています。「ブレーキが濡れた場合は、アクセルペダルとブレーキペダルを同時に軽く踏むことで乾かすことができます。これはブレーキが乾くまでのみ行ってください。」
- id: 148
  category: safe_driving_rules
  question: 圧雪路（雪が踏み固められた道路）を走行する際、速度をどのように調整すべきですか？
  choices:
    A: 時速5〜10マイル（mph）減速する。
    B: 時速5マイル（mph）以下まで減速する。
    C: 速度を半分に落とす。
    D: 通常の速度を維持するが、車間距離を広げる。
  answer: C
  explanation: さまざまな状況に合わせて速度を調整する場合、マニュアルでは圧雪路では速度を半分に落とすべきであると規定されています。
- id: 149
  category: defensive_driving
  question: 道路上の以下の場所のうち、他の場所よりも先に凍結しやすいのはどこですか？
  choices:
    A: 交差点。
    B: 橋や高架橋。
    C: トンネル。
    D: 多車線ハイウェイ。
  answer: B
  explanation: マニュアルでは、橋や高架橋は道路の他の部分よりも先に凍結しやすく、凍結箇所がある可能性があると警告しています。
- id: 150
  category: safe_driving_rules
  question: 激しい豪雨や吹雪の中で、車両の前方100フィート先が見えない場合、以下の速度より速く運転するのは安全ではありません：
  choices:
    A: 15 mph
    B: 25 mph
    C: 30 mph
    D: 45 mph
  answer: C
  explanation: マニュアルには、激しい豪雨や吹雪で100フィート（約30メートル）先が見えない場合、時速30マイル（30 mph）より速く運転するのは安全ではないと記載されています。
- id: 151
  category: defensive_driving
  question: ハイドロプレーニング現象が起きた場合、取るべき正しい行動は何ですか？
  choices:
    A: ブレーキを強く踏む。
    B: スリップした方向に急ハンドルを切る。
    C: 徐々に減速し、ブレーキは使用しない。
    D: トラクションを回復させるために、わずかに加速する。
  answer: C
  explanation: ハイドロプレーニング現象が起きた場合は、徐々に減速し、ブレーキは使用しないでください。急ブレーキをかけるとコントロールを失う恐れがあります。
- id: 152
  category: defensive_driving
  question: 車が雪や泥で動けなくなった（スタックした）場合、最初に取るべき行動は何ですか？
  choices:
    A: 高速ギアに入れ、車輪を空転させる。
    B: 低速ギアに入れ、前輪をまっすぐに保つ。
    C: 走行中にタイヤの下に板や木の枝を敷く。
    D: ハンドルを左右に激しく切る。
  answer: B
  explanation: マニュアルに記載されている、雪や泥から抜け出すための最初のステップは、低速ギアに入れ、前輪をまっすぐに保つことです。
- id: 153
  category: defensive_driving
  question: 強風の中を運転する際、クルーズコントロールの使用を避けるべきなのはなぜですか？
  choices:
    A: 車のバッテリーの消耗が早くなるため。
    B: 突風が吹いた際に、アクセルを最大限に制御できなくなるため。
    C: ハンドルがロックされる原因になるため。
    D: 強風時に自動的にブレーキがかかるため。
  answer: B
  explanation: マニュアルでは、突風が発生した際にアクセルを最大限に制御できるように、強風時にはクルーズコントロールを使用しないようアドバイスしています。
- id: 154
  category: safe_driving_rules
  question: 濃霧や煙の中を運転しなければならない場合、どのライトを使用すべきですか？
  choices:
    A: ハイビーム（走行用前照灯）。
    B: パーキングライトまたはフォグランプのみ。
    C: ロービーム（すれ違い用前照灯）。
    D: 非常点滅表示灯（ハザードランプ）のみ。
  answer: C
  explanation: 濃霧や煙の中を運転する際は、ロービームを使用してください。ハイビームは光が反射して眩惑（げんわく）の原因となります。また、パーキングライトやフォグランプのみで運転してはいけません。
- id: 155
  category: sharing_the_road
  question: 警察官が車線をゆっくりと蛇行してトラフィックブレイク（交通遮断）を行っている場合、どうすべきですか？
  choices:
    A: 加速してパトカーを追い越す。
    B: 非常点滅表示灯（ハザードランプ）を点灯させ、他のドライバーに警告する。
    C: 急ブレーキをかけて直ちに停止する。
    D: 路肩に移動して停車する。
  answer: B
  explanation: 警察によるトラフィックブレイクの間は、ハザードランプを点灯させて他のドライバーに警告し、ゆっくりと速度を落としてください。
- id: 156
  category: penalties_and_points
  question: 同乗者がシートベルトを着用しておらず、その同乗者が以下の年齢未満である場合、運転者は違反切符を切られることがあります。
  choices:
    A: 16歳
    B: 18歳
    C: 21歳
    D: 14歳
  answer: A
  explanation: マニュアルには、「同乗者が16歳未満でシートベルトを着用していない場合、運転者も違反切符を切られることがあります」と記載されています。
- id: 157
  category: driver_responsibility
  question: 妊娠中の女性は、どのようにシートベルトを正しく着用すべきですか？
  choices:
    A: 腰ベルトを腹部の高い位置にかける。
    B: 腰ベルトを腹部の下の、できるだけ低い位置にかける。
    C: 肩ベルトを使用しない。
    D: 肩ベルトを背中の後ろに通す。
  answer: B
  explanation: 妊娠している場合、マニュアルでは腰ベルトを腹部の下の、できるだけ低い位置に着用し、肩ベルトは両胸の間を通し、腹部の膨らみの横にくるように配置するよう指示しています。
- id: 158
  category: safe_driving_rules
  question: 2歳未満、身長3フィート4インチ（約102cm）未満で、体重が以下の数値未満の子供は、後ろ向きのチャイルドシート（乳幼児用補助装置）に固定しなければなりません。
  choices:
    A: 30ポンド
    B: 40ポンド
    C: 50ポンド
    D: 60ポンド
  answer: B
  explanation: 2歳未満、体重40ポンド（約18kg）未満、かつ身長3フィート4インチ未満の子供は、後ろ向きのチャイルドシートに固定する必要があります。
- id: 159
  category: safe_driving_rules
  question: エアバッグ装備車の助手席に、後ろ向きのチャイルドシートに座った子供を乗せることができるのは、どのような条件の場合ですか？
  choices:
    A: 子供が1歳を超えている場合。
    B: 後部座席がすべて他の子供で埋まっている場合。
    C: 車両に後部座席がない場合。
    D: エアバッグ装備車の助手席に乗せることは決してできない。
  answer: D
  explanation: マニュアルには、「後ろ向きのチャイルドシートに座った子供を、エアバッグ装備車の助手席に乗せることはできません」と明記されています。
- id: 160
  category: safe_driving_rules
  question: チャイルドシートの代わりに、連邦基準を満たす正しく固定されたシートベルトを使用できるのは、子供が何歳、または身長がどのくらいになってからですか？
  choices:
    A: 6歳、または身長が少なくとも4フィート5インチ。
    B: 7歳、または身長が少なくとも4フィート7インチ。
    C: 8歳、または身長が少なくとも4フィート9インチ。
    D: 9歳、または身長が少なくとも5フィート。
  answer: C
  explanation: 8歳以上、または身長が少なくとも4フィート9インチ（約145cm）の子供は、連邦基準を満たす正しく固定されたシートベルトを使用することができます。
- id: 161
  category: vehicle_information
  question: 運転中、安全を維持するためにエアバッグカバーからどのくらい離れて座るべきですか？
  choices:
    A: 少なくとも5インチ
    B: 少なくとも10インチ
    C: 少なくとも12インチ
    D: 少なくとも15インチ
  answer: B
  explanation: マニュアルには、車両を完全に制御できる限り、ステアリングホイール（ハンドル）の中心から胸骨までを測定して、エアバッグカバーから少なくとも10インチ離れて乗るように記載されています。
- id: 162
  category: driver_responsibility
  question: 6歳以下の子供を車内に放置することは、少なくとも何歳以上の人が付き添っていない限り違法ですか？
  choices:
    A: 10歳
    B: 12歳
    C: 14歳
    D: 16歳
  answer: B
  explanation: マニュアルでは、6歳以下の子供を車内に放置することは違法であると規定されていますが、12歳以上の人の監視下にある場合は放置してもよいとされています。
- id: 163
  category: safe_driving_rules
  question: カリフォルニア州の基本速度法（Basic Speed Law）とは何ですか？
  choices:
    A: 常に掲示されている制限速度で運転しなければならない。
    B: 現在の道路状況に対して安全な速度を超えて運転してはならない。
    C: 悪天候時には掲示されている制限速度より5 mph遅く運転しなければならない。
    D: 他の車両を安全に追い越すために制限速度を5 mph超えてもよい。
  answer: B
  explanation: カリフォルニア州では、現在の道路状況に対して安全な速度を超えて運転してはなりません。これは基本速度法（Basic Speed Law）として知られています。
- id: 164
  category: safe_driving_rules
  question: 別段の掲示がない限り、カリフォルニア州の2車線の分離されていないハイウェイ（two-lane undivided highway）での最高速度制限は何ですか？
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: A
  explanation: マニュアルには、別段の掲示がない限り、2車線の分離されていないハイウェイおよびトレーラーを牽引する車両の速度制限は55 mphであると記載されています。
- id: 165
  category: defensive_driving
  question: 左側に対向車があり、右前方には自転車がいる2車線の道路にいる場合、この状況に対処する最も安全な方法は何ですか？
  choices:
    A: 対向車が来る前に自転車を追い越すために加速する。
    B: 対向車と自転車のちょうど中間を走行する。
    C: 自転車が道路から外れるようにクラクションを鳴らす。
    D: 減速して対向車を通過させ、その後左に寄って自転車を追い越す。
  answer: D
  explanation: 車両と自転車の間を走行するのではなく、一度に一つの危険に対処してください。減速して対向車を通過させ、その後、自転車を追い越すために十分なスペース（少なくとも3フィート）を確保するために左に移動します。
- id: 166
  category: defensive_driving
  question: タイヤがバースト（破裂）した場合、次のうちどれを行うべきですか？
  choices:
    A: すぐにブレーキを強く踏んで車両を停止させる。
    B: 急にアクセルから足を離す。
    C: 両手でステアリングホイールを握り、徐々にアクセルを離す。
    D: 道路の路肩に向かってステアリングホイールを急に切る。
  answer: C
  explanation: タイヤがバーストした場合は、両手でステアリングホイールを握り、可能であれば速度を維持し、徐々にアクセルを離してください。急ブレーキをかけたり、急にアクセルから足を離したりすると、制御不能になる可能性があります。
- id: 167
  category: defensive_driving
  question: 車輪が舗装路から外れてしまった場合、最初にとるべき行動は何ですか？
  choices:
    A: ステアリングホイールをしっかりと握る。
    B: 車両を止めるために強くブレーキをかける。
    C: ステアリングホイールを左に急に切る。
    D: 舗装路に素早く戻るために加速する。
  answer: A
  explanation: 車輪が舗装路から外れた場合、最初のステップはステアリングホイールをしっかりと握ることです。その次にアクセルから足を離し、穏やかにブレーキをかけます。
- id: 168
  category: vehicle_information
  question: 極端な暑さの中で運転しているとき、オーバーヒート状態を防いだり対処したりするために何をすべきですか？
  choices:
    A: エンジンから熱を逃がすためにヒーターを入れる。
    B: エアコン（AC）を切る。
    C: ラジエーターへの風量を増やすために高速で運転する。
    D: 窓が曇らないように少し開ける。
  answer: B
  explanation: 極端な暑さの中では、温度計を監視し、長時間高速で運転することを避け、エアコンを切る必要があります。
- id: 169
  category: safe_driving_rules
  question: フリーウェイで車両が故障し、外に出なければならない場合、どちら側から降りるべきですか？
  choices:
    A: 左側（交通に向かう側）。
    B: 右側（交通から離れる側）。
    C: 駐車場所に関わらず運転席側のドア。
    D: リアハッチまたはトランクエリア。
  answer: B
  explanation: フリーウェイで車両が走行不能になった場合は、安全に右側の路肩に寄せ、車外に出る必要がある場合は交通から離れるように右側から降りる必要があります。
- id: 170
  category: driver_responsibility
  question: カリフォルニア・ハイウェイ・パトロールのフリーウェイ・サービス・パトロール（FSP）が通勤時間帯に無料で提供するサービスは、次のうちどれですか？
  choices:
    A: 車両を民間の修理工場まで牽引する。
    B: 良い自動車修理工場を推薦する。
    C: 故障したオートバイを牽引する。
    D: バッテリーが上がった場合に車両をジャンプスタートさせる。
  answer: D
  explanation: FSPは、バッテリーが上がった場合のジャンプスタート、1ガロンのガソリン提供、ラジエーターの補充、パンクしたタイヤの交換、または衝突事故の報告を行います。民間の修理工場への牽引、工場の推薦、オートバイの牽引は行いません。
- id: 171
  category: defensive_driving
  question: 踏切内で車が立ち往生し、警報機が点滅して列車が近づいている場合、直ちに何をすべきですか？
  choices:
    A: 車内に留まり、911に電話する。
    B: 車から降りて、列車が来る方向に向かって線路から斜めに離れるように走る。
    C: 車から降りて、列車が進む方向と同じ方向に走る。
    D: 列車が到着する前に、車を線路から押し出そうとする。
  answer: B
  explanation: 列車が接近し警報機が点滅している場合は、直ちに車から降りて、列車が来る方向に向かって線路から斜めに離れるように走り、その後911に電話しなければなりません。
- id: 172
  category: safe_driving_rules
  question: 成人ドライバーが運転中に携帯電話を使用する場合の法的要件は何ですか？
  choices:
    A: 音声通話中であれば、携帯電話を手に持ってもよい。
    B: ハンズフリーモードでのみ携帯電話を使用しなければならない。
    C: 車両が時速10マイル（10 mph）未満で走行している場合は、テキストメッセージを送信してもよい。
    D: ハンズフリーモードであっても、携帯電話の使用は完全に禁止されている。
  answer: B
  explanation: 手に持った状態での携帯電話の使用は危険であり、違法です。成人ドライバーは、必要な場合にのみハンズフリーモードで携帯電話を使用すべきです。
- id: 173
  category: safe_driving_rules
  question: 未成年者が運転中に携帯電話を使用することが許可されるのは、どのような状況ですか？
  choices:
    A: ハンズフリー機器を使用しているとき。
    B: 赤信号で停止しているとき。
    C: 緊急援助を求めるために電話をかけるとき。
    D: 親または保護者と連絡を取るとき。
  answer: C
  explanation: 未成年者が運転中に携帯電話や電子ワイヤレス機器を使用することは法律で禁じられていますが、緊急援助を求めるために電話を使用する場合のみ例外として認められます。
- id: 174
  category: alcohol_drugs_health
  question: 次のうち、一酸化炭素中毒の症状はどれですか？
  choices:
    A: 過度の発汗
    B: 耳鳴り
    C: 視界のぼやけ
    D: 筋肉のけいれん
  answer: B
  explanation: 一酸化炭素中毒の症状には、疲労、あくび、めまい、吐き気、頭痛、耳鳴りなどがあります。
- id: 175
  category: penalties_and_points
  question: 飲酒運転（DUI）の疑いがある際に、血液または尿検査を拒否した場合はどうなりますか？
  choices:
    A: 1,000ドルの罰金が科せられる。
    B: 車両が30日間押収される。
    C: 運転免許が1年間停止または取り消される。
    D: イグニッション・インターロック装置（飲酒運転防止装置）の設置が義務付けられる。
  answer: C
  explanation: 法執行官から飲酒運転の疑いをかけられ、血液または尿検査を拒否した場合、DMVは運転免許を1年間停止または取り消します。
- id: 176
  category: penalties_and_points
  question: 13歳から20歳の間で、アルコールの影響下で自転車を運転したことにより有罪判決を受けた場合、どのような罰則がありますか？
  choices:
    A: 自転車が押収される。
    B: 6ヶ月の禁錮刑に服さなければならない。
    C: 運転免許の取得資格が得られてから、免許が1年間停止または延期される場合がある。
    D: 運転免許の取得資格を永久に失う。
  answer: C
  explanation: 13歳から20歳の間で、アルコールや薬物の影響下で自転車を運転し有罪判決を受けた場合、運転資格が得られた時点で、運転免許が1年間停止または延期される場合があります。
- id: 177
  category: safe_driving_rules
  question: 車内のどこに開封済みのアルコール容器を保管しなければなりませんか？
  choices:
    A: グローブボックスの中。
    B: 助手席の下。
    C: トランク、または乗客が座らない場所。
    D: センターコンソールの中。
  answer: C
  explanation: アルコール容器が開封されている場合は、トランクまたは乗客が座らない場所に保管しなければなりません。グローブボックスの中に開封済みのアルコール容器を保管することは違法です。
- id: 178
  category: alcohol_drugs_health
  question: 21歳以上の人が、血中アルコール濃度（BAC）が___以上で運転することは違法です。
  choices:
    A: 0.01%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: 21歳以上の場合、BACが0.08%以上の状態で運転することは違法です。
- id: 179
  category: alcohol_drugs_health
  question: 商業運転免許を必要とする車両を運転する人の、法定血中アルコール濃度（BAC）の制限はいくつですか？
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: 商業運転免許を必要とする車両を運転する場合、BACが0.04%以上の状態で運転することは違法です。
- id: 180
  category: penalties_and_points
  question: 飲酒運転（DUI）で逮捕された場合、DMVの行政聴聞会をリクエストできる期間は何日以内ですか？
  choices:
    A: 5日
    B: 10日
    C: 15日
    D: 30日
  answer: B
  explanation: 飲酒運転（DUI）で逮捕された場合、逮捕された日から10日以内にDMVの行政聴聞会をリクエストすることができます。
- id: 181
  category: penalties_and_points
  question: DUI（酒気帯び・酒酔い運転）の有罪判決は、運転記録にどのくらいの期間残りますか？
  choices:
    A: 3年間
    B: 5年間
    C: 7年間
    D: 10年間
  answer: D
  explanation: すべてのDUIの有罪判決は、10年間運転記録に残ります。
- id: 182
  category: alcohol_drugs_health
  question: 21歳未満の場合、車内にアルコール飲料を持ち込むことが法的に許可されるのはどのような時ですか？
  choices:
    A: 容器がグローブボックスの中に隠されている時。
    B: 21歳以上の人が同伴している時。
    C: パーティーに向かって運転している時。
    D: アルコールが後部座席にある時。
  answer: B
  explanation: 21歳未満の場合、21歳以上の人が同乗している場合（または場外酒類販売免許を持つ人のために働いている場合）を除き、車内にアルコール飲料を持ち込むことはできません。
- id: 183
  category: penalties_and_points
  question: 21歳未満で、21歳以上の同伴者なしに車内でアルコールを所持しているのが見つかった場合、考えられる罰則の1つは何ですか？
  choices:
    A: 車両が最大30日間押収される可能性がある。
    B: 6ヶ月の禁錮刑に処される。
    C: イグニッション・インターロック装置（飲酒運転防止装置）の設置が義務付けられる。
    D: 車両が永久に没収される。
  answer: A
  explanation: 21歳未満で車内にアルコールを所持しているのが見つかった場合、法執行機関は車両を最大30日間押収することができ、裁判所は罰金を科したり、運転免許を1年間停止したりする場合があります。
- id: 184
  category: driver_responsibility
  question: カリフォルニア州で義務付けられている物損事故に対する最低限の保険補償額はいくらですか？
  choices:
    A: $10,000
    B: $15,000
    C: $30,000
    D: $60,000
  answer: B
  explanation: 保険は、物損に対して少なくとも15,000ドル、1人の死亡・負傷に対して30,000ドル、2人以上の死亡・負傷に対して60,000ドルを補償する必要があります。
- id: 185
  category: penalties_and_points
  question: 衝突事故を起こした際に適切な保険に加入していない場合、どのような罰則がありますか？
  choices:
    A: 運転特権が最大4年間停止される。
    B: 5,000ドルの罰金が科せられる。
    C: 車両が1年間押収される。
    D: 運転記録に警告が記載される。
  answer: A
  explanation: 過失の有無にかかわらず、衝突事故を起こした際に適切な保険に加入していない場合、運転特権は最大4年間停止されます。
- id: 186
  category: alcohol_drugs_health
  question: カリフォルニア州法では、処方薬の影響下での運転は違法薬物と比較してどのように扱われますか？
  choices:
    A: 処方薬はDUI法の対象外である。
    B: 薬が安全に運転する能力に影響を与える場合、法律上の違いはない。
    C: DUIで起訴されるのは違法薬物の場合のみである。
    D: 市販薬は、その効果に関わらず運転中に使用しても合法である。
  answer: B
  explanation: 法律では、違法薬物と医師や薬局から入手した薬の間に違いはありません。これらはすべて、安全に運転し、見て聞いたことに反応する能力に影響を与える可能性があります。
- id: 187
  category: safe_driving_rules
  question: 車内でのアルコールの開封済み容器の所持を禁止する法律は、次のどの車両の乗客には適用されませんか？
  choices:
    A: ピックアップトラック
    B: 商用の配送バン
    C: バス、タクシー、キャンピングカー、またはモーターホーム
    D: ライドシェア車両
  answer: C
  explanation: アルコールの開封済み容器に関する法律は、バス、タクシー、キャンピングカー、またはモーターホームの乗客である場合には適用されません。
- id: 188
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）が法定限度を下回っていても、DUIで逮捕され有罪判決を受けることはありますか？
  choices:
    A: いいえ、BACが法定限度以上の場合のみ逮捕される。
    B: はい、障害の程度による。
    C: はい、ただし21歳未満の場合に限る。
    D: いいえ、DUIの有罪判決にはBACの測定が厳密に義務付けられている。
  answer: B
  explanation: BACが法定限度を下回っていても、安全に運転できるとは限りません。障害の程度によっては、BACの測定値がなくてもDUIで逮捕され、有罪判決を受ける可能性があります。
- id: 189
  category: vehicle_information
  question: 車両を購入した場合、自分の名義に所有権を移転するのに何日間の猶予がありますか？
  choices:
    A: 5日間
    B: 10日間
    C: 15日間
    D: 20日間
  answer: B
  explanation: マニュアルによると、車両を購入した場合、10日以内に自分の名義に所有権を移転する必要があります。
- id: 190
  category: vehicle_information
  question: 車両を売却した後、何日以内にDMVに通知する必要がありますか？
  choices:
    A: 5日間
    B: 10日間
    C: 15日間
    D: 30日間
  answer: A
  explanation: 車両を売却したときは、「譲渡通知および責任解除通知（Notice of Transfer and Release of Liability）」に記入して、5日以内にDMVに通知しなければなりません。
- id: 191
  category: vehicle_information
  question: カリフォルニア州の居住者になった場合、または同州で職を得た場合、州外登録車両を登録するまでにどのくらいの期間がありますか？
  choices:
    A: 10日
    B: 15日
    C: 20日
    D: 30日
  answer: C
  explanation: カリフォルニア州の居住者になるか、同州で職を得てから20日以内に車両を登録する必要があります。
- id: 192
  category: driver_responsibility
  question: 以下のどの場合に、10日以内にDMVへ事故報告を行わなければなりませんか？
  choices:
    A: 衝突事故による物損が500ドルを超えた場合。
    B: 衝突事故による物損が1,000ドルを超えた場合、または負傷者や死亡者が出た場合。
    C: 事故の過失が自分にある場合。
    D: 衝突事故が公道で発生し、交通渋滞を引き起こした場合。
  answer: B
  explanation: 衝突事故を起こした場合、物損が1,000ドルを超えるか、負傷者または死亡者が出たときは、10日以内にDMVに報告しなければなりません。
- id: 193
  category: driver_responsibility
  question: 駐車中の車両に衝突し、所有者が見つからない場合はどうすればよいですか？
  choices:
    A: 所有者が戻るまで車両のそばで待つ。
    B: 氏名、電話番号、住所を記載したメモを残し、警察（法執行機関）に事故を報告する。
    C: 駐車車両に目に見える損傷がない場合は、そのまま立ち去る。
    D: 保険会社に電話し、すぐに現場を離れる。
  answer: B
  explanation: 所有者が見つからない場合は、氏名、電話番号、住所を記載したメモを車両または所有物にしっかりと貼り付け、警察に事故を報告してください。
- id: 194
  category: safe_driving_rules
  question: 車両で動物を負傷させた場合、適切な対処法は何ですか？
  choices:
    A: 動物を道路の脇に移動させて立ち去る。
    B: 最寄りの動物愛護協会または警察に連絡し、負傷した動物を動かそうとしない。
    C: 動物を最寄りの動物病院に連れて行く。
    D: クラクションを鳴らして周囲に知らせ、運転を続ける。
  answer: B
  explanation: 動物を死なせたり負傷させたりした場合は、最寄りの動物愛護協会または警察に連絡してください。負傷した動物を動かそうとしないでください。
- id: 195
  category: safe_driving_rules
  question: 衝突事故に巻き込まれ、誰も怪我をしていない場合、まず何をすべきですか？
  choices:
    A: 車両をそのままの場所に放置し、911に通報する。
    B: 車両を交通の邪魔にならない場所に移動させてから、911に通報する。
    C: 道路の真ん中で保険情報を交換する。
    D: 自宅まで運転して帰り、オンラインで事故を報告する。
  answer: B
  explanation: 衝突事故を起こした際、負傷者がいない場合は、車両を交通の邪魔にならない場所に移動させる必要があります。その後、911に通報してください。
- id: 196
  category: penalties_and_points
  question: 「運転者優先再審査通知（Notice of Priority Reexamination of Driver）」を受け取った場合、運転免許が自動的に停止される前に、何日以内にDMVに連絡する必要がありますか？
  choices:
    A: 48時間
    B: 5営業日
    C: 10日
    D: 30日
  answer: B
  explanation: 手続きを開始するために5営業日以内にDMVに連絡する必要があります。連絡がない場合、運転免許は自動的に停止されます。
- id: 197
  category: driver_testing
  question: DMVによる運転者再審査の根拠となり得るのは次のうちどれですか？
  choices:
    A: 運転者の年齢が70歳に達したこと。
    B: 身体的・精神的状態、または不良な運転記録。
    C: 新車を購入したこと。
    D: カリフォルニア州内の別の都市に引っ越したこと。
  answer: B
  explanation: 身体的・精神的状態、または不良な運転記録が再審査の根拠となります。運転者の年齢そのものが根拠になることはありません。
- id: 198
  category: license_system
  question: 眼鏡の使用や夜間運転の制限などの運転免許の制限事項は、何に基づいていますか？
  choices:
    A: 運転者の年齢。
    B: 運転者の郵便番号。
    C: 年齢ではなく、状況と試験官の所見。
    D: 運転者が所有する車両のタイプ。
  answer: C
  explanation: 高齢者に対する特定の制限はありません。すべての制限は年齢ではなく状況に基づいており、試験官の所見と勧告に基づいています。
- id: 199
  category: driver_responsibility
  question: 衝突事故で負傷者または死亡者が出た場合、どのくらいの期間内に警察（法執行機関）に報告しなければなりませんか？
  choices:
    A: 直ちに
    B: 24時間以内
    C: 5日以内
    D: 10日以内
  answer: B
  explanation: 負傷者または死亡者が出た場合、事故から24時間以内に警察に報告しなければなりません。
- id: 200
  category: driver_responsibility
  question: DMVに「カリフォルニア州交通事故報告書（SR 1）」を提出する際、いつ提出する必要がありますか？
  choices:
    A: 自分が事故の原因となった場合のみ。
    B: 公道で事故が発生した場合のみ。
    C: 事故の原因に関わらず、また私有地で発生した場合であっても。
    D: 警察が代わりに報告書を作成しなかった場合のみ。
  answer: C
  explanation: 事故の原因に関わらず、本人（または代理人）が報告書を提出しなければなりません。これは私有地で事故が発生した場合にも適用されます。
- id: 201
  category: defensive_driving
  question: マニュアルによると、衝突事故の最も一般的な原因の一つは次のうちどれですか？
  choices:
    A: 日中の時間帯に運転すること。
    B: 周囲の交通の流れよりも速い、または遅い速度で走行している車両。
    C: ハンズフリー機器の使用。
    D: 一時停止標識で停止すること。
  answer: B
  explanation: 衝突事故の最も一般的な原因には、運転者の不注意、不安全な速度、不適切な右左折、および周囲の交通の流れよりも速い、または遅い速度で走行している車両が含まれます。
- id: 202
  category: safe_driving_rules
  question: 前方に車両の非常点滅表示灯（ハザードランプ）が見えた場合、どうすべきですか？
  choices:
    A: 車両を素早く追い越すために加速する。
    B: 自分のハザードランプを点灯させ、直ちに停止する。
    C: 衝突事故や緊急事態が発生している可能性があるため、減速して注意深く通過する。
    D: 運転者に警告するためにクラクションを鳴らす。
  answer: C
  explanation: 前方に車両のハザードランプが見えた場合は、減速してください。衝突事故やその他の道路上の緊急事態が発生している可能性があります。注意深く通過してください。
- id: 203
  category: license_system
  question: 運転者の再審査（reexamination）を行った後、DMVが取る可能性のある措置は次のうちどれですか？
  choices:
    A: 運転者の車両を没収する。
    B: 期間を限定した運転免許証を発行する。
    C: 運転者に新しい車両の購入を義務付ける。
    D: 運転者に運転教育コースの再受講を強制する。
  answer: B
  explanation: 再審査の結果、DMVは期間を限定した運転免許証の発行、運転資格の停止または取り消し、あるいは何の措置も講じないなど、いくつかの措置を取る場合があります。
- id: 204
  category: license_system
  question: DMVは、高齢ドライバーの免許証に制限を課す必要があるかどうかをどのように判断しますか？
  choices:
    A: 運転者が70歳になると自動的に制限が適用される。
    B: 制限は完全に運転者の年齢に基づいている。
    C: 制限は年齢ではなく、状況と試験官の所見に基づいている。
    D: 制限は、その人が運転してきた年数に基づいている。
  answer: C
  explanation: マニュアルによると、高齢者に対する特定の制限はありません。すべての制限は年齢ではなく状況に基づいており、試験官の所見と勧告に依拠しています。
- id: 205
  category: safe_driving_rules
  question: 不安全な運転者の警告サイン（兆候）とされるのは、次のうちどれですか？
  choices:
    A: 交通量の少ない時間帯に運転すること。
    B: 慣れた場所で道に迷うこと。
    C: 右側に補助ミラーを取り付けること。
    D: 夜間運転のために照明の明るいルートを選ぶこと。
  answer: B
  explanation: マニュアルでは、不安全な運転者の警告サインとして、慣れた場所で道に迷うこと、車や所有物にへこみや擦り傷があること、頻繁に衝突しそうになったり衝突事故を起こしたりすることなどを挙げています。
- id: 206
  category: defensive_driving
  question: 高齢ドライバーが自身の運転能力の変化に適応するために検討できる戦略は何ですか？
  choices:
    A: 主にフリーウェイ（高速道路）を走行する。
    B: 交通量の少ない時間帯に運転する。
    C: 注意散漫を減らすためにサイドミラーを取り外す。
    D: スキルを維持するために長距離を運転する。
  answer: B
  explanation: 高齢ドライバーは、安全を確保するために、交通量の少ない時間帯に運転する、難しい交差点を避ける、運転を必要な場所に限定するなど、いくつかの戦略を検討することができます。
- id: 207
  category: license_system
  question: 運転免許証の有効期限が切れる時点で70歳以上の場合、何が必要ですか？
  choices:
    A: 直接出向いて免許を更新し、視力検査に合格しなければならない。
    B: 実技試験（路上試験）を再受験しなければならない。
    C: 免許証を返納し、高齢者用IDカードを取得しなければならない。
    D: オンラインでのみ免許更新ができる。
  answer: A
  explanation: 運転免許証の有効期限が切れる時点で70歳以上の場合は、直接出向いて免許を更新し、視力検査に合格する必要があります。
- id: 208
  category: license_system
  question: 運転免許証の有効期限が切れる約何日前に、DMVは更新通知を送付しますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 120日
  answer: C
  explanation: DMVは、運転免許証の有効期限が切れる約90日前に、登録されている住所に更新通知を送付します。
- id: 209
  category: driver_responsibility
  question: DMVのコミュニティ・リエゾン（地域連携担当）の主な役割は何ですか？
  choices:
    A: DMVの聴聞会や再審査で運転者を代表すること。
    B: 不安全な運転者に交通違反切符を発行すること。
    C: 高齢ドライバーやティーンエイジャーの懸念事項に焦点を当て、公共の安全利益を代表すること。
    D: 高齢者のための実技試験を実施すること。
  answer: C
  explanation: コミュニティ・リエゾンの主な役割は、すべてのカリフォルニア州民のために公共の安全利益を代表することであり、特に高齢ドライバーやティーンエイジャーの懸念事項への対応に重点を置いています。
- id: 210
  category: alcohol_drugs_health
  question: 進行性の認知症を患う高齢者の運転を止める責任をしばしば負うのは誰ですか？
  choices:
    A: DMVのコミュニティ・リエゾン。
    B: 介護者、医師、および法執行機関。
    C: 運転者の自動車保険会社。
    D: 成熟ドライバー・プログラム（Mature Driver Program）のインストラクター。
  answer: B
  explanation: 進行性の認知症を患う人は、最終的に安全に運転する能力を失います。こうした高齢者の運転を止めるのは、多くの場合、介護者、医師、および法執行機関の役割となります。
- id: 211
  category: safe_driving_rules
  question: 高齢運転者向上プログラム（Mature Driver Improvement Program）は、何歳以上の運転者を対象とした8時間の講習ですか？
  choices:
    A: 50歳以上
    B: 55歳以上
    C: 62歳以上
    D: 70歳以上
  answer: B
  explanation: 高齢運転者向上プログラムは、55歳以上の運転者を対象とした8時間の講習です。
- id: 212
  category: license_system
  question: 高齢運転者向上プログラムの修了証の有効期間はどのくらいですか？
  choices:
    A: 1年
    B: 2年
    C: 3年
    D: 5年
  answer: C
  explanation: 高齢運転者向上プログラムの修了証は3年間有効で、別の4時間の講習を修了することで更新できます。
- id: 213
  category: license_system
  question: カリフォルニア州で、無料のシニア身分証明書（Senior ID card）を取得できるのは何歳からですか？
  choices:
    A: 55歳
    B: 60歳
    C: 62歳
    D: 70歳
  answer: C
  explanation: 62歳以上の方は、無料のシニア身分証明書を取得する資格があります。
- id: 214
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）0.10%とは何を意味しますか？
  choices:
    A: 血液100ミリリットル中に0.10グラムのアルコールが含まれている。
    B: 血液100オンス中に0.10オンスのアルコールが含まれている。
    C: 血液10ミリリットル中に1.0グラムのアルコールが含まれている。
    D: 血液100ミリリットル中に10グラムのアルコールが含まれている。
  answer: A
  explanation: 用語集によると、BACが0.10%であるということは、血液100ミリリットル中に0.10グラムのアルコールが含まれていることを意味します。
- id: 215
  category: sharing_the_road
  question: マニュアルの用語集によると、次のうち「交通弱者（VRU）」とみなされるのはどれですか？
  choices:
    A: 商用トラックの運転手
    B: オートバイの運転者
    C: 車椅子を使用している障がい者
    D: 自動車の同乗者
  answer: C
  explanation: VRU（交通弱者）とは、自転車利用者、歩行者、および車椅子、三輪車、四輪自転車を使用している障がい者や移動・方向定位能力が低下している人など、原動機を持たない道路利用者のことを指します。
- id: 216
  category: defensive_driving
  question: 3秒ルールの目的は何ですか？
  choices:
    A: 一時停止標識で停止すべき時間を決定するため。
    B: 前方の車両との車間距離をどの程度空けるべきか見積もるため。
    C: 優先権を譲る時間を計るため。
    D: 交差点を安全に通過するのにかかる時間を測定するため。
  answer: B
  explanation: 3秒ルールは、前方の車両との車間距離をどの程度空けるべきかを見積もるのに役立つ運転ルールです。
- id: 217
  category: safe_driving_rules
  question: 道路上で「譲れ（yield）」とはどういう意味ですか？
  choices:
    A: 交通の流れに安全に合流するために加速すること。
    B: 交通状況に関わらず、常に完全に停止すること。
    C: 優先権を持つ他者が進行できるように、待ち、減速し、停止する準備をすること。
    D: 交通の流れを維持するために、他の車両から優先権を奪うこと。
  answer: C
  explanation: 譲る（Yield）とは、優先権を持つ他の車両や歩行者が進行できるように、待ち、減速し、（必要に応じて）停止する準備をすることを意味します。
- id: 218
  category: license_system
  question: 年齢に関わらず、身体的または精神的な状態により安全な運転を継続できなくなった運転者には、どのような選択肢がありますか？
  choices:
    A: 日中の運転のみに限定された制限付き免許証を受け取ることができる。
    B: 運転免許証を無料の身分証明書（IDカード）と交換できる場合がある。
    C: DMVの公聴会でコミュニティ・リエゾン（地域連絡係）に代理人を務めてもらうことができる。
    D: 免許を再交付するために高齢運転者プログラムを受講しなければならない。
  answer: B
  explanation: 身体的または精神的な状態により安全な運転を継続できなくなったあらゆる年齢の運転者は、運転免許証を無料の身分証明書（IDカード）と交換できる場合があります。
- image: stop.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 徐行して注意深く進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通状況と歩行者を確認してください。
  id: 219
- image: yield.png
  category: signs_and_signals
  question: この標識は何をすることを求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通の流れに合流する
    C: 減速し、車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」の標識は、減速し、車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 220
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「進入禁止（DO NOT ENTER）」標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路で見られ、進入すると対向車の進路に入ることになります。
  id: 221
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意して走行を続ける
    C: 停止して後退するか引き返す — あなたは逆走しています
    D: 素早くエリアを出るために加速する
  answer: C
  explanation: 赤と白の「進入禁止（WRONG WAY）」標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に引き返すか後退してください。
  id: 222
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方通行 — 左方向へ流れている
    C: 中央分離帯の左側を通行すること
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「一方通行（ONE WAY）」標識は、この通りの交通が矢印の指す一方向にのみ進むことを示しています。
  id: 223
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所でのUターンが禁止されていることを意味します。
  id: 224
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 225
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、その場所での右折が禁止されていることを意味します。
  id: 226
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先道幅が狭くなる
    B: この区間での追い越し禁止
    C: この先対面通行
    D: 右側通行
  answer: B
  explanation: 白黒の「追い越し禁止区間（NO PASSING ZONE）」というペナント型の標識は、このエリアで他の車両を追い越すことが許可されていないことを意味します。これは追い越し禁止区間の始まりを示します。
  id: 227
- image: keep_right.png
  category: signs_and_signals
  question: この標識はドライバーに何を指示していますか？
  choices:
    A: 右側に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先右車線減少
  answer: C
  explanation: 矢印が描かれた白い規制標識「右側通行（KEEP RIGHT）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 228
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。速度制限標識は、理想的な条件下でのそのエリアの法定最高速度を示します。
  id: 229
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園やアニマルパークがある
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先狩猟エリア
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色のひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 230
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先にスクールゾーンあり
    B: この先に歩行者横断路あり
    C: 近くにハイキングコースあり
    D: この先にバス停あり
  answer: B
  explanation: 歩行者の姿が描かれた黄色いひし形の標識は、この先に歩行者横断路があることを警告しています。道路を横断する歩行者のために停止できるよう準備してください。
  id: 231
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 232
- image: railroad_crossing.png
  category: signs_and_signals
  question: この円形の黄色い標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウトあり
    B: 病院区域
    C: この先に踏切あり
    D: 追い越し禁止区域
  answer: C
  explanation: 黒いXと2つのRが描かれた円形の黄色い標識は、この先に踏切があることを知らせる事前警告標識です。速度を落とし、列車の音がしないか目で見て耳で聞いて確認してください。
  id: 233
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型のクロバック（十字型）標識は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 234
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先で行き止まり
    B: 右折必須
    C: この先で右にカーブ
    D: この先に回り道あり
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先の道路がカーブしていることを警告しています。カーブに入る前に速度を落としてください。
  id: 235
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角であることを示す
    B: 大幅な減速が必要な急カーブを警告している
    C: 右折専用であることを意味する
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。このカーブの手前では、より大幅に速度を落とす必要があります。
  id: 236
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に1つのカーブあり
    C: 反対方向に曲がる2つの連続したカーブ
    D: この先にラウンドアバウトあり
  answer: C
  explanation: 背向（はいこう）カーブの標識は、この先に反対方向へ曲がる2つのカーブがあることを警告しています。速度を落とし、道路がまず一方に曲がり、次に反対側に曲がることに備えてください。
  id: 237
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: この先に続く一連のカーブや曲がり角
    D: この先に坂道あり
  answer: C
  explanation: 屈曲あり（ワインディング・ロード）の標識は、この先に一連のカーブや曲がり角が続くことを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 238
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの交通の合流
    C: 中央分離帯のある道路の始まり
    D: 道幅が狭くなり1車線になる
  answer: B
  explanation: 黄色いひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  id: 239
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に橋あり
    B: この先で道幅が狭くなる
    C: 車線の終わり
    D: 中央分離帯の終わり
  answer: B
  explanation: この警告標識は、この先の道幅が狭くなることを示しています。道路の幅が減少することに備え、車線内の位置を調整してください。
  id: 240
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路（分離道路）の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって対向車線が分離された道路（分離道路）になることを警告しています。右側を通行してください。
  id: 241
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 分離道路の始まり
    B: 分離道路が終わり、対面通行に戻る
    C: この先に合流地点あり
    D: この先に道路工事あり
  answer: B
  explanation: この標識は、分離道路が終了することを警告しています。対向車線が中央分離帯で区切られなくなります。対面通行に備えてください。
  id: 242
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 分離道路の始まり
    B: この先に追い越し区間あり
    C: この先に対面通行あり — 車両が両方向に通行します
    D: この先に車線変更あり
  answer: C
  explanation: この標識は、この先が対面通行であることを警告しています。一方通行の道路や分離道路が終わり、反対方向から来る車両と遭遇する可能性があります。
  id: 243
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状態について警告していますか？
  choices:
    A: 路面の凍結
    B: 濡れている時に滑りやすい
    C: この先に曲がりくねった道あり
    D: 路面の凹凸
  answer: B
  explanation: 「スリップ注意（濡れている時に滑りやすい）」の標識は、雨や路面が濡れている時に路面が非常に滑りやすくなることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 244
- image: hill.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 路面の隆起
    B: 路面の凹凸
    C: この先に急な下り坂または勾配あり
    D: 道路工事
  answer: C
  explanation: この標識は、この先に急な下り坂や勾配があることを警告しています。特にトラックや牽引中の場合は、速度を調整し、低いギアにシフトダウンする必要があるかもしれません。
  id: 245
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先に一時停止標識あり
    B: この先に信号機あり
    C: 通学路の横断歩道
    D: 検問所
  answer: B
  explanation: この標識は、この先に信号機があることを警告しています。赤信号や黄信号の場合に停止できるよう準備してください。この標識は、遠くから信号機が見えにくい場所に設置されることが多いです。
  id: 246
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 「譲れ」の標識
    B: 信号機
    C: 一時停止が必要な停止標識
    D: スピードバンプ（段差）
  answer: C
  explanation: この標識は、この先に一時停止標識があることを警告しています。減速を開始し、停止標識の場所で完全に停止できるよう準備してください。
  id: 247
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: この先に踏切あり
    B: この先に十字路または交差点あり
    C: この先に病院あり
    D: 歩行者用横断歩道
  answer: B
  explanation: この標識は、この先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 248
- image: side_road.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: この先に丁字路（T字路）あり
    B: 右側から合流する脇道あり
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は、右側から脇道が合流していることを警告しています。脇道から幹線道路に進入してくる車両に注意してください。
  id: 249
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流している
    B: 車線が減少している
    C: 新しい車線が追加される — 合流の必要なし
    D: 右折必須
  answer: C
  explanation: 「付加車線」の標識は、合流の必要なく新しい車線が幹線道路に加わることを意味します。ランプ（接続路）から進入する車両には、専用の新しい車線が用意されています。
  id: 250
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時の停車
    B: この区域での駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」の標識は、この区域に車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは可能です。
  id: 251
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な身体障害者用掲示証またはナンバープレートを掲示している車両のみ
    D: 身体障害のある乗客を乗せているすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、身体障害者専用の駐車場であることを示しています。有効な身体障害者用駐車掲示証またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 252
