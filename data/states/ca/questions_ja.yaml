- id: 44
  category: safe_driving_rules
  question: カリフォルニア州運輸局長は、運転中の携帯電話の使用についてどのようにアドバイスしていますか？
  choices:
    A: ナビゲーションにのみ使用する
    B: ハンドルやハンドルバーを握っているときは置く
    C: ハンズフリー機器のみを使用する
    D: 日中であれば使用してもよい
  answer: B
  explanation: 長官からのメッセージでは、「ハンドルやハンドルバーを握っているときは、携帯電話を置いてください。注意散漫な状態や、心身が正常でない状態で、自動車、オートバイ、自転車を運転しないでください」と明確にアドバイスしています。
- id: 45
  category: license_system
  question: カリフォルニア州居住者は、自宅にいながらどこで運転免許の申請を開始できますか？
