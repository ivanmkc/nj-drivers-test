questions:
- id: 1
  category: safe_driving_rules
  question: 特に標識がない場合、子供がいる学校区域（スクールゾーン）での制限速度は何マイルですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: カリフォルニア州の運転者用ハンドブックによると、特に標識がない限り、子供が屋外にいたり道路を横断したりしている学校から500フィート以内の場所を走行する場合、制限速度は25
    mphです。
- id: 2
  category: safe_driving_rules
  question: カリフォルニア州の「基本速度法（Basic Speed Law）」が定めている内容はどれですか？
  choices:
    A: 掲示されている制限速度を超えて運転してはならない
    B: 現在の状況において安全な速度を超えて運転してはならない
    C: 常に交通の流れに合わせた速度で運転しなければならない
    D: 他の車両と同じくらいの速度を維持しなければならない
  answer: B
  explanation: 基本速度法（Basic Speed Law）は、掲示されている制限速度に関わらず、現在の状況において安全な速度を超えて運転してはならないと定めています。
- id: 3
  category: alcohol_drugs_health
  question: 21歳以上の人が、血中アルコール濃度（BAC）が何パーセント以上の状態で運転することは違法ですか？
  choices:
    A: 0.04%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: カリフォルニア州法では、21歳以上の人が0.08%以上のBACで運転することを禁止しています。
- id: 4
  category: sharing_the_road
  question: 進行方向の道路脇で、スクールバスが赤色のライトを点滅させて停車している場合、どうしなければなりませんか？
  choices:
    A: すべての子供が降りたと判断できるまで停車する
    B: 赤色のライトの点滅が止まるまで停車する
    C: 車線を変更し、徐行して慎重に追い越す
    D: 追い越す際に15 mphまで減速する
  answer: B
  explanation: 赤色のライトを点滅させているスクールバスに対しては停車しなければならず、ライトの点滅が止まるまで停車し続ける必要があります。これに従わない場合、罰金や免許停止の対象となる可能性があります。
- id: 5
  category: sharing_the_road
  question: 緊急車両に路を譲る（Yield）際、どのようにすべきですか？
  choices:
    A: 道路の右端にできるだけ寄せて停車する
    B: 右側の車線に移動し、徐行する
    C: 現在の車線ですぐに停車する
    D: 邪魔にならないよう速度を上げる
  answer: A
  explanation: 緊急車両のサイレンが聞こえたり、赤色の点滅ライトが見えたりした場合は、道路の右端に寄せて、その車両が通過するまで停車しなければなりません。
- id: 6
  category: driver_responsibility
  question: カリフォルニア州法において、運転中に手持ちの携帯電話を使用できるのはどのような時ですか？
  choices:
    A: 赤信号で停車している時
    B: 助けを呼ぶための緊急時にのみ
    C: 交通の流れが15 mph未満の時
    D: 地方の高速道路を走行している時
  answer: B
  explanation: 運転中に手持ちの携帯電話を使用できるのは、法執行機関、医療機関、消防署、またはその他の緊急サービスに連絡する必要がある緊急事態に限られます。
- id: 7
  category: safe_driving_rules
  question: 縁石のない対面通行の道路で、上り坂に駐車する場合、前輪はどの方向に向けるべきですか？
  choices:
    A: 左側（道路の中央側）
    B: 右側（道路の外側）
    C: 道路の端と平行
    D: まっすぐ前
  answer: B
  explanation: 縁石のない場所で上り坂または下り坂に駐車する場合は、ブレーキが故障した際に車両が道路の中央から離れて転がるよう、車輪を右側（路肩側）に向けてください。
- id: 8
  category: signs_and_signals
  question: 交差点にある赤色の点滅信号は何を意味しますか？
  choices:
    A: 進入前に減速する
    B: 進入前に一時停止し、安全を確認してから進む
    C: 停車して青信号になるのを待つ
    D: 進入前にすべての交通に路を譲る
  answer: B
  explanation: 赤色の点滅信号は「一時停止」を意味します。停止した後、優先権のルールに従い、安全が確認できれば進むことができます。
- id: 9
  category: signs_and_signals
  question: 道路中央にある2本の黄色の実線は何を意味しますか？
  choices:
    A: どちらの方向からも追い越しができる
    B: 右側にいる場合のみ追い越しができる
    C: どちらの方向からも追い越しは禁止されている
    D: この先で道幅が狭くなる
  answer: C
  explanation: 2本の黄色の実線は追い越し禁止を意味します。他の車両を追い越すためにこれらの線を越えて運転することはできません。
- id: 10
  category: defensive_driving
  question: 車間距離を詰めすぎる（Tailgating）のを防ぐために、カリフォルニア州の運転者用ハンドブックが推奨しているのはどのルールですか？
  choices:
    A: 2秒ルール
    B: 3秒ルール
    C: 4秒ルール
    D: 5秒ルール
  answer: B
  explanation: 車間距離を詰めすぎないようにするために「3秒ルール」を使用し、前の車が急ブレーキをかけた場合でも安全に停止できる十分なスペースを確保してください。
- id: 11
  category: penalties_and_points
  question: 以下のいずれかが発生する衝突事故を起こした場合、10日以内にDMV（陸運局）に届け出なければなりません。
  choices:
    A: 車両へのいかなる損傷
    B: 500ドルを超える損害
    C: 1,000ドルを超える損害、または負傷者や死亡者が出た場合
    D: 車両がレッカー移動された場合
  answer: C
  explanation: 1,000ドルを超える物的損害が発生した場合、または負傷者や死亡者が出た場合、あなた（または保険代理人、仲介業者、法的代理人）は10日以内に衝突事故をDMVに報告しなければなりません。
- id: 12
  category: sharing_the_road
  question: 歩行者が横断歩道にいる場合、あなたは以下のことをしなければなりません。
  choices:
    A: 警告のためにクラクションを鳴らす
    B: 歩行者に通行優先権（ライトオブウェイ）を譲る
    C: 注意深く歩行者を避けて運転する
    D: 歩行者が自分の走行車線側にいる場合のみ停止する
  answer: B
  explanation: 歩行者は、標識のある横断歩道でも、標識のない横断歩道でも通行優先権を持っています。運転者は道を譲り、歩行者が安全に横断できるようにしなければなりません。
- id: 13
  category: license_system
  question: 基本的なクラスC（Class C）運転免許証で運転できるのは以下のどれですか？
  choices:
    A: 車両総重量が6,000ポンド未満の3軸車両
    B: すべての商用車
    C: 2台のトレーラーを牽引している車両
    D: オートバイ
  answer: A
  explanation: クラスC運転免許証では、車両総重量定格（GVWR）が26,000ポンド以下の2軸車両、または総重量6,000ポンド以下の3軸車両を運転することができます。
- id: 14
  category: defensive_driving
  question: 車線を変更する際、死角を確認するにはどうすればよいですか？
  choices:
    A: バックミラーを見る
    B: サイドミラーを見る
    C: 頭を回して肩越しに目視する
    D: バックカメラを使用する
  answer: C
  explanation: ミラーだけでは死角を確認することはできません。車線を変更する前に、頭を回して肩越しに目視し、車線が空いていることを確認する必要があります。
- id: 15
  category: safe_driving_rules
  question: カリフォルニア州の「基本速度法（Basic Speed Law）」の根本的な原則は何ですか？
  choices:
    A: 掲示されている制限速度を超えて運転してはならない。
    B: 現在の状況において安全とされる速度を超えて運転してはならない。
    C: 制限速度に関係なく、常に周囲の交通の流れに合わせて運転しなければならない。
    D: 悪天候時には制限速度より少なくとも時速10マイル（10 mph）以上減速して運転しなければならない。
  answer: B
  explanation: カリフォルニア州の「基本速度法」は、掲示されている制限速度に関わらず、現在の状況（天候、視界、交通量など）において安全とされる速度を超えて運転してはならないと定めています。
- id: 16
  category: alcohol_drugs_health
  question: 21歳以上の運転者の法定血中アルコール濃度（BAC）の制限値はいくつですか？
  choices:
    A: 0.04%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: 21歳以上の人が、血中アルコール濃度（BAC）が0.08%以上の状態で車両を運転することは違法です。
- id: 17
  category: safe_driving_rules
  question: 見通しの悪い交差点（ブラインド・インターセクション）での制限速度はいくらですか？
  choices:
    A: 時速10マイル (10 mph)
    B: 時速15マイル (15 mph)
    C: 時速20マイル (20 mph)
    D: 時速25マイル (25 mph)
  answer: B
  explanation: 見通しの悪い交差点での制限速度は時速15マイル（15 mph）です。交差点を通過する直前の100フィートの間、いずれの方向も100フィート先まで見渡せず、かつどの角にも一時停止標識がない場合、その交差点は「見通しが悪い」とみなされます。
- id: 18
  category: safe_driving_rules
  question: カリフォルニア州のほとんどの商業地区または住宅地区における最高速度制限はいくらですか？
  choices:
    A: 時速25マイル (25 mph)
    B: 時速30マイル (30 mph)
    C: 時速35マイル (35 mph)
    D: 時速40マイル (40 mph)
  answer: A
  explanation: 特に標識がない限り、ほとんどの商業地区および住宅地区における最高速度制限は時速25マイル（25 mph）です。
- id: 19
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、車輪をどの方向に向けるべきですか？
  choices:
    A: 車輪を縁石の方に向ける。
    B: 車輪を縁石とは反対の方に向ける。
    C: 車輪を完全に真っ直ぐにする。
    D: 車輪を道路と平行にする。
  answer: B
  explanation: 縁石のある上り坂で駐車する場合、前輪を縁石とは反対側（道路の中央側）に向け、前輪の裏側が縁石に軽く触れるまで車両を数インチ後退させて固定します。
- id: 20
  category: signs_and_signals
  question: 赤色の点滅信号は何を意味しますか？
  choices:
    A: 減速し、他の交通に道を譲る。
    B: 一時停止し、安全を確認してから進む。
    C: 停止し、青信号になるのを待つ。
    D: 信号機が故障しているため、注意して進む。
  answer: B
  explanation: 赤色の点滅信号は「一時停止」を意味します。停止した後、通行優先権のルールに従い、安全を確認した上で進むことができます。
- id: 21
  category: signs_and_signals
  question: 2フィート（約60cm）以上離れた2組の二重の実線の黄色い線は何を表していますか？
  choices:
    A: カープール車線（優先車線）。
    B: 追い越しゾーン。
    C: 固い壁。その上を走行したり、越えたりしてはいけません。
    D: 共有のセンター右左折車線。
  answer: C
  explanation: 2フィート以上離れた2組の二重の実線の黄色い線は、障壁（バリア）とみなされます。この障壁の上を走行したり、越えたり、これを横切って左折やUターンをしてはいけません。
- id: 22
  category: sharing_the_road
  question: 横断歩道では誰に優先権がありますか？
  choices:
    A: 歩行者が乱横断（ジェイウォーク）している場合は、車両に優先権がある。
    B: 標識の有無にかかわらず、横断歩道では常に歩行者に優先権がある。
    C: 横断歩道に標識がない場合は、車両に優先権がある。
    D: 自転車は歩行者より優先権がある。
  answer: B
  explanation: 標識のあるなしにかかわらず、横断歩道では歩行者に優先権があります。運転者は歩行者の安全を確保するため、道を譲り、必要に応じて減速または停止しなければなりません。
- id: 23
  category: defensive_driving
  question: 追突事故を避けるため、通常の運転条件下で推奨される最小の車間距離はどれくらいですか？
  choices:
    A: 1秒
    B: 2秒
    C: 3秒
    D: 5秒
  answer: C
  explanation: 車間距離を詰めすぎることや追突事故を避けるため、通常の運転条件下では安全な車間距離を保つ「3秒ルール」を使用する必要があります。
- id: 24
  category: driver_responsibility
  question: 交通衝突事故をDMV（車両管理局）に報告しなければならないのはいつですか？
  choices:
    A: 死亡者が出た場合のみ。
    B: 損害額が1,000ドルを超えるか、負傷者または死亡者が出た場合、10日以内。
    C: 損害額が500ドルを超える場合、5日以内。
    D: 警察が報告書を作成しない場合のみ。
  answer: B
  explanation: いずれかの人の財産に1,000ドルを超える損害が発生した場合、または（程度にかかわらず）負傷者や死亡者が出た場合、本人（または保険代理人、ブローカー、法的代理人）は10日以内にDMVに事故を報告しなければなりません。
- id: 25
  category: safe_driving_rules
  question: 車両のヘッドライトを点灯しなければならないのはいつですか？
  choices:
    A: 照明のない道路を走行する場合のみ。
    B: 日没の30分後から日の出の30分前まで。
    C: 日没の1時間後から日の出の1時間前まで。
    D: 前方500フィートが見えない場合のみ。
  answer: B
  explanation: 日没の30分後から点灯し、日の出の30分前まで点灯し続けなければなりません。また、1,000フィートの距離から人や車両をはっきりと認識できない場合も常に点灯する必要があります。
- id: 26
  category: sharing_the_road
  question: サイレンを鳴らし、赤色灯を点滅させた緊急車両が後方から接近してきた場合、どうすべきですか？
  choices:
    A: 緊急車両の前を走り続けるために加速する。
    B: 現在の車線ですぐに停止する。
    C: 道路の右端に寄せて停止する。
    D: 左車線に移動し、右側から追い越させる。
  answer: C
  explanation: サイレンと赤色灯を使用している警察車両、消防車、救急車、その他の緊急車両には優先権を譲らなければなりません。道路の右端まで運転して停止し、緊急車両が通過するまで待ってください。
- id: 27
  category: signs_and_signals
  question: 黄色の信号機の点灯は何を示していますか？
  choices:
    A: 信号がまもなく青になる。
    B: 注意：まもなく赤信号が表示される。
    C: 交差点内の位置に関係なく、直ちに停止する。
    D: 交差点を素早く通過するために加速する。
  answer: B
  explanation: 黄色の信号灯は「注意」を意味します。まもなく赤信号が表示されます。黄色の信号を見たときは、安全に停止できる場合は停止してください。安全に停止できない場合は、慎重に交差点を通過してください。
- id: 28
  category: driver_responsibility
  question: DMVのバーチャルアシスタントを利用する際、どのような情報の入力を避けるべきですか？
  choices:
    A: 車両のメーカーとモデル
    B: 個人情報
    C: 一般的な運転に関する質問
    D: ウェブサイトへのフィードバック
  answer: B
  explanation: 一般的な免責事項には次のように記載されています。「車両管理局（DMV）のバーチャルアシスタントとやり取りする際は、個人情報を含めないでください。」
- id: 29
  category: license_system
  question: DMVのウェブサイトで英語の内容と第三者による翻訳の間に不一致が生じた場合、どちらのバージョンに法的拘束力がありますか？
  choices:
    A: 翻訳されたバージョン
    B: 両方のバージョンに等しく拘束力がある
    C: 英語版
    D: どちらのバージョンにもない
  answer: C
  explanation: 第三者翻訳に関する免責事項では、英語の内容が公式な情報源であり、翻訳における不一致は「遵守または執行の目的において拘束力はなく、法的効力も持たない」と記されています。
- id: 30
  category: vehicle_information
  question: 「車両登録（Vehicle Registration）」セクションで提供されているサービスは次のうちどれですか？
  choices:
    A: mDLパイロットに参加する
    B: 保険加入証明を提出する
    C: 登録再開手数料を支払う
    D: オンラインテスト
  answer: B
  explanation: メインナビゲーションメニューによると、「保険加入証明の提出（Submit Proof of Insurance）」は車両登録（Vehicle
    Registration）の下のサービスとしてリストされています。
- id: 31
  category: license_system
  question: 「運転免許証とID」サービスの中で、ユーザーが参加を案内されているパイロットプログラムはどれですか？
  choices:
    A: mDLパイロット
    B: バーチャルオフィス・パイロット
    C: セーフドライバー・パイロット
    D: オンラインテスト・パイロット
  answer: A
  explanation: 「運転免許証とID」のナビゲーションメニューには、「mDLパイロットに参加する」というオプションが含まれています。
- id: 32
  category: penalties_and_points
  question: DMVのオンライン支払いシステムを通じて支払うことができる、罰則関連の費用は次のうちどれですか？
  choices:
    A: スピード違反の罰金
    B: 駐車違反切符
    C: 不渡り小切手の支払い
    D: 裁判所事務手数料
  answer: C
  explanation: 「支払いを行う」セクションには、オンライン支払いオプションとして「不渡り小切手の支払い」と「再交付手数料の支払い」が明記されています。
- id: 33
  category: driver_testing
  question: カリフォルニア州運転者ハンドブックのどのセクションで「試験プロセス」について説明されていますか？
  choices:
