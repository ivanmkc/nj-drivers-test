  explanation: 免責事項には、「翻訳によって生じた相違や違いには拘束力がなく、遵守または執行の目的において法的効力を持ちません」と記載されています。
- id: 54
  category: sharing_the_road
  question: 長官のメッセージによると、道路を安全に共有するために、ドライバーは誰に注意を払わなければなりませんか？
  choices:
    A: 他のドライバーのみ
    B: 横断歩道の歩行者のみ
    C: 他のドライバー、自転車利用者、および歩行者
    D: 商用トラックの運転手のみ
  answer: C
  explanation: 長官のメッセージは、カリフォルニア州民に対し「他のドライバー、自転車利用者、歩行者に注意を払うこと...」を呼びかけています。
- id: 55
  category: license_system
  question: DMVがウェブサイトやチャットボットで機械翻訳サービスを提供している目的は何ですか？
  choices:
    A: 公式な法的文書のため
    B: 情報提供および利便性のみを目的とするため
    C: 英語に代わる公用語とするため
    D: 英語を話さない人に対して完璧な正確性を保証するため
  answer: B
  explanation: 免責事項には、「機械翻訳は情報提供および利便性のみを目的として提供されています」と記載されています。
- id: 56
  category: vehicle_information
  question: ハンドブックの目次によると、「財政責任（賠償責任）、保険要件、および衝突事故」を扱っているのはどのセクションですか？
  choices:
    A: セクション 7
    B: セクション 8
    C: セクション 9
    D: セクション 10
  answer: D
  explanation: 提供された目次には、「セクション 10：財政責任、保険要件、および衝突事故」と記載されています。
- id: 57
  category: safe_driving_rules
  question: 歩行者用信号のない横断歩道では、誰に優先権がありますか？
  choices:
    A: 制限速度で走行している場合は車両
    B: 横断歩道では常に歩行者に優先権がある
    C: 歩行者が標識のない横断歩道にいない場合は車両
    D: ドライバーと目を合わせた場合に限り歩行者
  answer: B
  explanation: 標識の有無にかかわらず、横断歩道では歩行者に優先権があります。ドライバーは歩行者の安全を確保するため、必要に応じて譲歩し、速度を落とすか停止しなければなりません。
- id: 58
  category: defensive_driving
  question: 車間距離を詰めすぎるのを避けるため、通常の条件下では前方の車両との間にどのくらいのスペースを空けるべきですか？
  choices:
    A: 2秒間
    B: 3秒間
    C: 4秒間
    D: 5秒間
  answer: B
  explanation: 車間距離を詰めすぎないようにするため、カリフォルニア州の運転手用ハンドブックでは「3秒ルール」の使用を推奨しています。前方の車両が特定の地点を通過してから、安全な車間距離を確保するために3秒数えます。
- id: 59
  category: vehicle_information
  question: ヘッドライトは、日没の___後に点灯し、日の出の___前まで点灯し続けなければなりません。
  choices:
    A: 30分; 30分
    B: 1時間; 1時間
    C: 15分; 15分
    D: 直後; 直前
  answer: A
  explanation: カリフォルニア州法では、日没の30分後にヘッドライトを点灯し、日の出の30分前まで点灯し続けることが義務付けられています。
- id: 60
  category: defensive_driving
  question: 車線変更の前に死角を確認する最善の方法は何ですか？
  choices:
    A: バックミラー（ルームミラー）を見る
    B: サイドミラーを見る
    C: 首を回して肩越しに目視する
    D: クラクションを鳴らして他のドライバーに警告する
  answer: C
  explanation: 死角を確認するには、ミラーでは見えない車両を確認するために、進もうとする方向に首を回して肩越しに目視する必要があります。
- id: 61
  category: penalties_and_points
  question: 職務中の警察官から逃走し、身体的傷害を負わせなかった罪で有罪判決を受けた場合、どのような罰則が科される可能性がありますか？
  choices:
    A: 郡拘置所への最大1年間の拘禁。
    B: 警告および罰金。
    C: 義務的な社会奉仕活動。
    D: 免許の永久取消。
  answer: A
  explanation: 追跡を引き起こし、警察官から逃走した罪で有罪判決を受けた者は、1年以下の郡拘置所への拘禁に処されます。
- id: 62
  category: signs_and_signals
  question: 赤と白の三角形（三辺）の標識は、何をしなければならないことを示していますか？
  choices:
    A: 交差点に入る前に完全に停止する。
    B: 他の車両や歩行者に路権（優先権）を譲る。
    C: 速度を維持して合流する。
    D: 他の車両が見えない場合は標識を無視する。
  answer: B
  explanation: 赤い三角形の「譲れ（YIELD）」の標識は、徐行し、必要に応じて停止して、進行する前に車両、自転車、または歩行者を通過させる準備をしなければならないことを示しています。
- id: 63
  category: sharing_the_road
  question: 走行車線で自転車を追い越す際、自転車のための十分な幅を確保し、最低でもどのくらいの距離を保たなければなりませんか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 4フィート
  answer: C
  explanation: カリフォルニア州の法律では、自転車の安全を確保するため、自転車を追い越す際に少なくとも3フィート（約0.9メートル）の間隔を空けることが運転者に義務付けられています。
- id: 64
  category: safe_driving_rules
  question: 次の状況のうち、Uターン（転回）をすることが合法なのはどれですか？
  choices:
    A: 分離帯、縁石、または土地の帯を越えて、分離ハイウェイ上で行う場合。
    B: 安全かつ合法な場合に、二重黄線を越えて行う場合。
    C: 踏切で行う場合。
    D: 一方通行の道路で行う場合。
  answer: B
  explanation: 安全かつ合法であれば、二重黄線を越えてUターンをすることができます。一方通行の道路、踏切、または分離ハイウェイの障壁を越えてUターンをすることは違法です。
- id: 65
  category: alcohol_drugs_health
  question: 21歳未満の場合、カリフォルニア州の「ゼロ・トレランス（不寛容）」法に基づき、どの程度の血中アルコール濃度（BAC）で運転することが違法とされていますか？
  choices:
    A: 0.01%以上
    B: 0.04%以上
    C: 0.05%以上
    D: 0.08%以上
  answer: A
  explanation: カリフォルニア州のゼロ・トレランス法では、21歳未満の人が0.01%以上のBACで運転することを違法としています。
- id: 66
  category: driver_responsibility
  question: 負傷者または死亡者が出た衝突事故に巻き込まれた場合、何日以内にDMV（陸運局）に報告しなければなりませんか？
  choices:
    A: 24時間
    B: 5日
    C: 10日
    D: 30日
  answer: C
  explanation: 負傷者や死亡者が出た場合、または1,000ドルを超える物的損害が発生した場合は、本人（または保険代理人、ブローカー、法的代理人）が10日以内にDMVに事故を報告しなければなりません。
- image: stop.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 徐行して注意深く進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「一時停止（STOP）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通状況と歩行者を確認してください。
  id: 67
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何をすることを求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通の流れに合流する
    C: 徐行し、他の車両や歩行者に路権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「譲れ（YIELD）」標識は、徐行し、他の車両や歩行者に路権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 68
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路に進入してはならない
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「進入禁止（DO NOT ENTER）」標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、フリーウェイの出口ランプや一方通行の道路で見られ、進入すると対向車の進路に入ることになります。
  id: 69
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意深く運転を続ける
    C: 停止してバックするか、向きを変える。あなたは逆走しています。
    D: 加速してそのエリアを素早く離れる
  answer: C
  explanation: 赤と白の「逆走（WRONG WAY）」標識は、一方通行の道路やハイウェイのランプを逆方向に走行していることを意味します。直ちに停止し、安全に向きを変えるかバックしてください。
  id: 70
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 一方通行 — 左方向
    C: 中央分離帯の左側を通行すること
    D: 左側に高速道路の出口あり
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、その道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 71
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所での転回（Uターン）が禁止されていることを意味します。
  id: 72
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 73
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 転回（Uターン）禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、その場所での右折が禁止されていることを意味します。
  id: 74
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道幅減少
    B: この区間内での追い越し禁止
    C: この先、対面交通
    D: 右側通行
  answer: B
  explanation: 黄色地に黒文字で「NO PASSING ZONE（追い越し禁止区間）」と書かれたペナント型（三角形）の標識は、そのエリアで他車を追い越すことが禁止されていることを意味します。これは追い越し禁止区間の始まりを示します。
  id: 75
- image: keep_right.png
  category: signs_and_signals
  question: この標識はドライバーに何を指示していますか？
  choices:
    A: 右側に合流すること
    B: 右折専用
    C: 分離帯や障害物の右側を通行すること
    D: この先、右車線終了
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 76
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 白い長方形に黒文字の標識は規制標識です。速度制限標識は、理想的な条件下におけるそのエリアの法定最高速度を示します。
  id: 77
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園またはサファリパークあり
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟区域
    D: 近くに野生動物保護区あり
  answer: B
  explanation: 鹿のシルエットが描かれた黄色のひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 78
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、スクールゾーン
    B: この先、歩行者横断あり
    C: 近くにハイキングコースあり
    D: この先、バス停あり
  answer: B
  explanation: 歩行者の姿が描かれた黄色のひし形の標識は、この先に歩行者横断歩道があることを警告しています。道路を横断する歩行者のために停止できるよう準備してください。
  id: 79
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは通学路の横断
    D: 病院周辺
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断を示しています。速度を落とし、子供に注意してください。
  id: 80
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い円形の標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウト（環状交差点）がある
    B: 病院地帯である
    C: この先に踏切がある
    D: 追い越し禁止区間である
  answer: C
  explanation: 黒いXと2つのRが描かれた黄色い円形の標識は、この先に踏切があることを知らせる予告標識です。速度を落とし、列車の音や姿を確認してください。
  id: 81
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型の鉄道クロスバック標識は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 82
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先で行き止まり
    B: 右折必須
    C: この先右カーブあり
    D: この先回り道あり
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先の道路にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 83
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角であることを示している
    B: 大幅な減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 84
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に単一のカーブあり
    C: 反対方向への2つの連続するカーブあり
    D: この先にラウンドアバウトあり
  answer: C
  explanation: 背向（はいこう）カーブの標識は、この先に反対方向への2つのカーブがあることを警告しています。速度を落とし、道路がまず一方に曲がり、次に反対側に曲がることに備えてください。
  id: 85
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 単一の急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブや曲がり角
    D: この先に坂道
  answer: C
  explanation: 「屈曲あり（ワインディング・ロード）」の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 86
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの交通の合流
    C: 中央分離帯のある道路の始まり
    D: 道幅が狭まり1車線になること
  answer: B
  explanation: 黄色いひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や走行位置を調整する準備をしてください。
  id: 87
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に橋あり
    B: この先道幅減少
    C: 車線終了
    D: 中央分離帯終了
  answer: B
  explanation: この警戒標識は、この先の道幅が狭くなることを示しています。道幅が狭くなることに備え、車線内の位置を調整してください。
  id: 88
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって対向車線と分離されることを警告しています。右側を走行してください。
  id: 89
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある道路の始まり
    B: 中央分離帯が終了し、対面通行に戻る
    C: この先に合流地点あり
    D: この先道路工事中
  answer: B
  explanation: この標識は、中央分離帯のある道路が終了することを警告しています。対向車が中央分離帯で分離されなくなります。対面通行に備えてください。
  id: 90
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 分離ハイウェイの始まり
    B: この先に追い越し区間あり
    C: この先対面通行 — 交通は両方向に進む
    D: この先に車線シフトあり
  answer: C
  explanation: この標識はこの先が対面通行であることを警告しています。一方通行の道路や分離ハイウェイから出て、反対方向から来る車両に遭遇する可能性があります。
  id: 91
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状態を警告していますか？
  choices:
    A: 路面の凍結
    B: 濡れている時に滑りやすい
    C: この先に曲がりくねった道あり
    D: 路面の凹凸
  answer: B
  explanation: 「スリップ注意（濡れている時に滑りやすい）」の標識は、雨や濡れた状態で路面が非常に滑りやすくなる可能性があることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 92
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 路面の隆起
    B: 路面の凹凸
    C: この先に急な下り坂または勾配あり
    D: 道路工事
  answer: C
  explanation: この標識はこの先に急な下り坂や勾配があることを警告しています。特にトラックや牽引中の場合は、速度を調整し、低いギアにシフトする必要があるかもしれません。
  id: 93
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先に一時停止標識あり
    B: この先に信号機あり
    C: 学校の横断歩道
    D: 警察の検問所
  answer: B
  explanation: この標識はこの先に信号機があることを警告しています。赤信号や黄信号の場合に停止できるよう準備してください。この標識は、遠くから信号機が見えにくい場所に設置されることが多いです。
  id: 94
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 譲れ（Yield）の標識
    B: 信号機
    C: 停止しなければならない一時停止標識
    D: スピードバンプ（段差）
  answer: C
  explanation: この標識はこの先に一時停止標識があることを警告しています。減速を開始し、一時停止標識で完全に停止できるよう準備してください。
  id: 95
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に踏切あり
    B: この先に十字路または交差点あり
    C: この先に病院あり
    D: 歩行者横断歩道
  answer: B
  explanation: この標識は、この先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 96
- image: side_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に丁字路（T字路）あり
    B: 右側から合流する脇道あり
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は、右側から脇道が合流していることを警告しています。脇道からハイウェイに進入してくる車両に注意してください。
  id: 97
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流している
    B: 車線が終了する
    C: 新しい車線が追加される — 合流の必要なし
    D: 右折が必要
  answer: C
  explanation: 「付加車線」の標識は、合流を必要とせずに新しい車線がハイウェイに加わることを意味します。ランプ（接続路）から進入する車両には、専用の新しい車線があります。
  id: 98
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時の停車
    B: この区域での駐車
    C: 停車またはアイドリング
    D: 積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」標識は、この区域に車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは可能です。
  id: 99
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはプレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転手
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースを示しています。有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 100
- id: 101
  category: license_system
  question: カリフォルニア州の暫定運転免許（provisional driver's license）において、20歳未満の乗客を同乗させる際、免許を持つ親、保護者、または25歳以上の免許保持者の同伴が必要な期間は何ヶ月間ですか？
  choices:
    A: 6ヶ月
    B: 12ヶ月
    C: 18ヶ月
    D: 24ヶ月
  answer: B
  explanation: 免許取得後の最初の12ヶ月間は、カリフォルニア州の免許を持つ親や保護者、25歳以上の免許保持者、または認可された教習指導員が同伴しない限り、20歳未満の乗客を乗せることはできません。
- id: 102
  category: license_system
  question: カリフォルニア州の暫定免許を取得してから最初の12ヶ月間、免許を持つ成人が同伴しない限り、原則として運転が禁止されている時間帯はいつですか？
  choices:
    A: 午後10時から午前5時まで
    B: 午後11時から午前5時まで
    C: 午前0時から午前6時まで
    D: 午後9時から午前6時まで
  answer: B
  explanation: カリフォルニア州法では、暫定免許保持者は免許取得後の最初の12ヶ月間、午後11時から午前5時までの間の運転を禁止しています。ただし、医療、学校、または仕事上の必要性がある特定の例外を除きます。
- id: 103
  category: license_system
  question: カリフォルニア州で学科教育（driver education）と実技訓練（driver training）の両方を修了している場合、仮免許（learner's
    permit）を申請できる最低年齢は何歳ですか？
  choices:
    A: 15歳
    B: 15歳半
    C: 16歳
    D: 17歳半
  answer: B
  explanation: カリフォルニア州で仮免許（instruction permit）を申請するには、少なくとも15歳半であり、かつ承認された学科教育および実技訓練プログラムを修了しているか、現在受講している必要があります。
- id: 104
  category: license_system
  question: 居住住所を変更した後、カリフォルニア州DMVに通知しなければならない期間は何日以内ですか？
  choices:
    A: 5日以内
    B: 10日以内
    C: 15日以内
    D: 30日以内
  answer: B
  explanation: カリフォルニア州法では、居住住所を変更してから10日以内にDMVに通知することが義務付けられています。
- id: 105
  category: license_system
  question: 標準的なカリフォルニア州クラスC運転免許で運転が許可されている車両は、次のうちどれですか？
  choices:
    A: 車両総重量定格（GVWR）が26,000ポンド以下の2軸車両。
    B: 排気量が250ccを超えるオートバイ。
    C: 15人以上の乗客を運ぶ商用バス。
    D: 重量が10,000ポンドを超える3軸車両。
  answer: A
  explanation: クラスC免許では、GVWRが26,000ポンド以下の2軸車両、または総重量が6,000ポンド以下の3軸車両を運転することができます。
- id: 106
  category: license_system
  question: カリフォルニア州の仮免許（instruction permit）で運転する場合、常に助手席に同乗していなければならないのは誰ですか？
  choices:
    A: 18歳以上のすべての人。
    B: 有効なカリフォルニア州運転免許を持つ21歳以上の人。
    C: 有効なカリフォルニア州運転免許を持つ25歳以上の人。
    D: 認定された教習指導員または親のみ。
  answer: C
  explanation: カリフォルニア州法では、仮免許保持者は、有効なカリフォルニア州運転免許を持つ25歳以上の人が、必要に応じて車両を制御できる位置（助手席）に同乗している必要があります。
- id: 107
  category: license_system
  question: 2025年5月7日以降、カリフォルニア州居住者が国内線への搭乗や連邦政府の重要施設への立ち入りに必要となる身分証明書の種類は何ですか？
  choices:
    A: 標準的なクラスC運転免許証。
    B: REAL ID準拠の運転免許証または身分証明書。
    C: 社会保障カードと出生証明書。
    D: カリフォルニア州の大学が発行した学生証。
  answer: B
  explanation: 2025年5月7日より、連邦政府は国内線への搭乗や連邦政府の重要施設への立ち入りに、REAL IDまたはその他の連邦政府が承認した書類（パスポートなど）を要求します。
- id: 108
  category: license_system
  question: カリフォルニア州の運転免許を持つ未成年者が交通事故を起こした場合、法的に金銭的損害の責任を負うのは誰ですか？
  choices:
    A: 未成年の運転者本人のみ。
    B: カリフォルニア州車両管理局（DMV）。
    C: 未成年の免許申請書に署名した親または保護者。
    D: 未成年の高校または学科教育プログラム。
  answer: C
  explanation: カリフォルニア州では、未成年の運転免許申請書に署名した親または保護者が、その未成年の運転に関する金銭的責任を負うことになります。
- id: 109
  category: driver_testing
  question: カリフォルニア州の筆記試験（knowledge test）において、申請が無効になり再度手数料を支払う必要があるまでに、何回まで不合格が許容されますか？
  choices:
    A: 2回
    B: 3回
    C: 4回
    D: 5回
  answer: B
  explanation: カリフォルニア州では、運転免許の申請は12ヶ月間有効であり、新しい申請書と手数料を提出し直すまでに、筆記試験に3回まで挑戦することができます。
- id: 110
  category: driver_testing
  question: 免許に制限（restriction）が付かずにカリフォルニア州DMVの視力検査に合格するために必要な最低視力はどれくらいですか？
  choices:
    A: 両眼とも20/20
    B: 少なくとも片眼が20/30
    C: 両眼合わせて20/40
    D: 視力の良い方の眼が20/50
  answer: C
  explanation: カリフォルニア州DMVの視力基準は、両眼合わせて20/40であり、かつ少なくとも片眼が20/40以上、もう一方の眼が20/70以上である必要があります。
- id: 111
  category: driver_testing
  question: カリフォルニア州の実技試験（behind-the-wheel driving test）に使用する車両について、提示しなければならない書類はどれですか？
  choices:
    A: 車両の整備履歴およびメンテナンス記録
    B: 有効な車両登録証および財政責任の証明（保険の証明）
    C: 車両の所有権証明書（タイトル）の原本またはピンクスリップ
    D: 車両所有者からの公証済み承諾書
  answer: B
  explanation: 路上試験を受けるには、車両が有効に登録されており、かつその車両が適切に保険に加入していること（財政責任）を証明する必要があります。
- id: 112
  category: driver_testing
  question: 未成年者がカリフォルニア州の筆記試験（知識テスト）に不合格となった場合、再受験資格を得るまでにどのくらいの期間待つ必要がありますか？
  choices:
    A: 24時間待たなければならない
    B: 不合格となった日を除いて、7日間待たなければならない
    C: 14日間待たなければならない
    D: 30日間待たなければならない
  answer: B
  explanation: カリフォルニア州のドライバーズ・ハンドブックによると、未成年者が筆記試験に不合格となった場合、再受験までに1週間（7日間）待つ必要があります。
- id: 113
  category: driver_testing
  question: カリフォルニア州の筆記試験中に不正行為をしたり、試験補助具を使用したりした受験者には、どのような結果が科されますか？
  choices:
    A: 試験を最初からやり直すだけでよい
    B: 失格となり、DMVは運転資格に対して処分を行う場合がある
    C: 再挑戦するまで24時間待たなければならない
    D: 50ドルの罰金を支払えば試験を続行できる
  answer: B
  explanation: DMVの試験での不正行為は重大な違反です。試験は不合格となり、DMVは既存の運転資格や申請を停止または取り消す場合があります。
- id: 114
  category: driver_testing
  question: カリフォルニア州の実技試験（路上試験）に不合格となった場合、再受験までにどのくらいの期間待つ必要がありますか？
  choices:
    A: 1週間
    B: 2週間
    C: 1ヶ月
    D: 3日間
  answer: B
  explanation: カリフォルニア州の法律では、路上試験に不合格となった受験者は、再試験を予約するまでに2週間（14日間）待つことが義務付けられています。
- id: 115
  category: driver_testing
  question: 初回の実技試験で合格できなかった場合、追加の実技試験1回ごとに必要な手数料はいくらですか？
  choices:
    A: $7
    B: $15
    C: $25
    D: $45
  answer: A
  explanation: 初回の申請手数料には1回目の路上試験が含まれていますが、それ以降の追加の実技試験には、1回につき7ドルの再試験料がかかります。
- id: 116
  category: driver_testing
  question: カリフォルニア州の実技試験における運転前安全点検において、正常に機能していなければならない項目は次のうちどれですか？
  choices:
    A: エアコンシステム
    B: ラジオとスピーカー
    C: 運転席側の窓とフロントガラス
    D: クルーズコントロールシステム
  answer: C
  explanation: 運転前点検では、試験官はフロントガラスの視界が遮られていないこと、および手信号のために運転席側の窓が開閉できることを確認します。
- id: 117
  category: driver_testing
  question: 矯正レンズを使用しても視力検査に合格できない場合、カリフォルニア州DMVはどのような対応をとりますか？
  choices:
    A: 免許の交付が永久に拒否される
    B: 視力の専門医に「視力検査報告書（Report of Vision Examination）」を記入してもらうよう求められる
    C: 夜間運転限定の特別試験を受けるよう求められる
    D: 30日間のみ有効な免許証が交付される
  answer: B
  explanation: 視力基準を満たせない場合、DMVは、安全に運転できるかどうかを判断するために、検眼医または眼科医に記入してもらうためのフォームを交付します。
- id: 118
  category: driver_testing
  question: カリフォルニア州の実技試験において、即座に自動的に不合格となるのは次のうちどれですか？
  choices:
    A: 方向指示器（ウィンカー）の使用を1回忘れた場合
    B: 衝突を避けるために試験官が介入せざるを得なかった場合
    C: 制限速度より時速2マイル遅く走行した場合
    D: 赤信号で停止中にミラーを調整した場合
  answer: B
  explanation: 試験官が車両を制御したり、危険を回避するために介入したりする必要がある行為は、重大な運転ミス（critical driving error）とみなされ、自動的に不合格となります。
- id: 119
  category: driver_testing
  question: カリフォルニア州の運転免許申請は、初回の手数料支払い後、どのくらいの期間有効ですか？
  choices:
    A: 6ヶ月
    B: 12ヶ月
    C: 24ヶ月
    D: 申請者が18歳になるまで
  answer: B
  explanation: カリフォルニア州の運転免許申請および支払われた手数料は、申請日からちょうど12ヶ月間有効です。
- id: 120
  category: driver_testing
  question: 有効な他州の運転免許証を持つ成人がカリフォルニア州に転入した場合、通常DMVによって免除される要件はどれですか？
  choices:
    A: 筆記試験（知識テスト）
    B: 視力検査
    C: 実技試験（路上試験）
    D: 申請手数料
  answer: C
  explanation: カリフォルニア州DMVは通常、米国の他州の有効な免許証を保持している申請者に対して実技試験を免除しますが、筆記試験と視力検査には合格する必要があります。
- id: 121
  category: driver_testing
  question: カリフォルニア州の実技試験（路上試験）中、車両に同乗することが法的に許可されているのは誰ですか？
  choices:
    A: 免許を持つ親または保護者
    B: プロの教習指導員
    C: DMVの試験官または許可された職員のみ
    D: 25歳以上の免許保持者
  answer: C
  explanation: 気が散るのを防ぎ、試験の公平性を維持するため、DMVの試験官（およびトレーニング目的のDMVスーパーバイザー）のみが同乗を許されます。
- id: 122
  category: driver_testing
  question: 標準的な筆記形式に加えて、カリフォルニア州の知識試験（学科試験）を受けることができる他の方法はどれですか？
  choices:
    A: 友人に問題を翻訳してもらう
    B: ヘッドホンを使用した音声試験
    C: 警察官による口頭試験
    D: 交通法規に関する小論文の提出
  answer: B
  explanation: カリフォルニア州DMVは、さまざまなニーズや言語に対応するため、筆記、タッチスクリーン、および音声形式で知識試験を提供しています。
- id: 123
  category: driver_testing
  question: カリフォルニア州の路上試験の運転前安全点検において、受験者は腕と手を使って何を実演しなければなりませんか？
  choices:
    A: タイヤの空気圧の確認方法
    B: 右左折および停止のための正しい手信号
    C: オイルレベルの測定方法
    D: ハンドルの適切な握り方
  answer: B
  explanation: 運転試験が始まる前に、受験者は左折、右折、および徐行または停止の手信号を実演する必要があります。
- id: 124
  category: driver_testing
  question: 運転に影響を及ぼす可能性のある身体的または精神的な状態にある受験者に対する、カリフォルニア州DMVの方針は何ですか？
  choices:
    A: 自動的に免許取得が禁止される
    B: 医学的評価の後、限定免許が交付される場合がある
    C: 日中の時間帯のみ運転が許可される
    D: 常に看護師の同乗が必要である
  answer: B
  explanation: DMVは各ケースを個別に評価し、診断書に基づいて特定の制限（「矯正レンズの使用」や「高速道路の運転禁止」など）を付した免許を交付することがあります。
- id: 125
  category: driver_testing
  question: カリフォルニア州DMVが、免許更新時にドライバーに知識試験の再受験を求めるのはどのような状況ですか？
  choices:
    A: ドライバーが65歳に達した場合
    B: ドライバーの婚姻状況に変更があった場合
    C: 交通違反による累積点数が多すぎる場合
    D: 運転記録に関わらず、免許更新のたびに
  answer: C
  explanation: 多くの更新では試験は不要ですが、運転記録が不良な場合や、再評価が必要な状態にある場合、DMVは知識試験を課すことがあります。
- id: 126
  category: driver_responsibility
  question: カリフォルニア州で交通事故を起こした場合、1人あたりの物損額がいくらを超えると、10日以内にDMVに報告しなければなりませんか？
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: C
  explanation: カリフォルニア州では、物損額が$1,000を超える衝突事故が発生した場合、SR-1フォームを使用して10日以内にDMVに報告しなければなりません。
- id: 127
  category: driver_responsibility
  question: 負傷、死亡、または$1,000を超える物損を伴う衝突事故から10日以内に、カリフォルニア州DMVに提出しなければならない書類はどれですか？
  choices:
    A: カリフォルニア州交通事故報告書 (SR-1)
    B: 譲渡通知および責任免除書 (NRL)
    C: 車両確認書 (REG 31)
    D: 事実申立書 (REG 256)
  answer: A
  explanation: SR-1フォームは、過失の有無にかかわらず、ドライバーが提出しなければならないカリフォルニア州の公式な交通事故報告書です。
- id: 128
  category: driver_responsibility
  question: 事故による1人の負傷または死亡に対する、カリフォルニア州の法律で定められた賠償責任保険の最低補償額はいくらですか？
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $30,000
  answer: C
  explanation: カリフォルニア州法では、1回の事故における1人の負傷または死亡に対して、最低$15,000の補償が義務付けられています。
- id: 129
  category: driver_responsibility
  question: 個人から車両を購入した場合、何日以内にDMVで車両の所有権を自分の名義に変更しなければなりませんか？
  choices:
    A: 5日
    B: 10日
    C: 20日
    D: 30日
  answer: B
  explanation: 個人から購入した後、購入者は10日以内にDMVに通知し、車両の名義を自分に変更する必要があります。
- id: 130
  category: driver_responsibility
  question: 従来の自動車保険を購入する以外に、カリフォルニア州の財政責任法（Financial Responsibility Law）を満たす有効な方法は次のうちどれですか？
  choices:
    A: DMVへの$35,000の現金預託
    B: 損害賠償を支払うという書面による約束
    C: 少なくとも$10,000の預金残高がある普通預金口座の維持
    D: 雇用主からの公証済み書面の提出
  answer: A
  explanation: 財政責任を果たす代替方法には、DMVへの$35,000の現金預託、$35,000の保証証券、またはDMV発行の自己保険証明書が含まれます。
- id: 131
  category: driver_responsibility
  question: 衝突事故を起こし、財政的責任（保険など）の証明ができない場合、カリフォルニア州の運転免許証は最長でどのくらいの期間停止されますか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: B
  explanation: 衝突事故を起こした際に保険に加入していない場合、運転特権は1年間停止されます。
- id: 132
  category: driver_responsibility
  question: カリフォルニア州では、負傷者または死亡者が出た衝突事故が発生した場合、何時間以内に地元の警察またはカリフォルニア・ハイウェイ・パトロール（CHP）に報告しなければなりませんか？
  choices:
    A: 12時間
    B: 24時間
    C: 48時間
    D: 72時間
  answer: B
  explanation: 衝突事故により負傷者または死亡者が出た場合は、事故発生から24時間以内に法執行機関（警察またはCHP）に報告しなければなりません。
- id: 133
  category: driver_responsibility
  question: カリフォルニア州の道路で初めてポイ捨ての有罪判決を受けた場合の最大罰金額はいくらですか？
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: ハイウェイでのポイ捨ては、最大1,000ドルの罰金が科せられる可能性があり、違反者はゴミ拾いを命じられることもあります。
- id: 134
  category: driver_responsibility
  question: カリフォルニア州法に基づき、ハイウェイに動物を遺棄した場合の最大禁錮刑はどのくらいですか？
  choices:
    A: 30日
    B: 60日
    C: 6ヶ月
    D: 1年
  answer: C
  explanation: ハイウェイに動物を遺棄することは軽罪であり、最大1,000ドルの罰金、6ヶ月の禁錮、またはその両方が科せられます。
- id: 135
  category: driver_responsibility
  question: カリフォルニア州のほとんどの車両において、登録更新手続き中にDMVへスモッグ検査証明を提出する必要がある頻度はどのくらいですか？
  choices:
    A: 毎年
    B: 2年ごと
    C: 4年ごと
    D: 車両売却時のみ
  answer: B
  explanation: カリフォルニア州のほとんどの車両は、登録更新のために2年ごと（隔年）にスモッグ検査に合格する必要があります。
- id: 136
  category: safe_driving_rules
  question: カリフォルニア州で、HOV車線（高乗車人数車線）に出入りするために、2本の黄色い実線を法的に越えることができるのはどのような時ですか？
  choices:
    A: 破線で示された指定の出入り口のみ
    B: 安全が確認でき交通が遮断されている時はいつでも
    C: 制限速度以下で走行している車両を追い越す時
    D: 通勤時間外で車線が全車両に開放されている時のみ
  answer: A
  explanation: カリフォルニア州法では、HOV車線への出入りのために2本の黄色い実線を越えることは禁止されています。線が破線になっている場所、または特定の出入り口がある指定区域まで待たなければなりません。
- id: 137
  category: safe_driving_rules
  question: カリフォルニア州において、緑色に塗られた縁石は駐車規制に関して何を示していますか？
  choices:
    A: 標識または縁石に表示された制限時間内に限り駐車できる
    B: 乗客の乗り降りのためだけに停車できる
    C: 有効な障害者用プラカードを所持している場合のみ駐車できる
    D: 貨物や郵便物の積み降ろしのためだけに停車できる
  answer: A
  explanation: 緑色の縁石は、限られた時間だけ駐車できることを意味します。緑色地帯の横にある掲示標識、または縁石に塗られた制限時間を確認してください。
- id: 138
  category: safe_driving_rules
  question: カリフォルニア州で、赤信号でも左折が許可されるのはどのような条件の時ですか？
  choices:
    A: 対面交通の道路から一方通行の道路へ曲がる時
    B: 一方通行の道路から別の一方通行の道路へ曲がる時
    C: 一方通行の道路から対面交通の道路へ曲がる時
    D: カリフォルニア州で赤信号での左折が合法になることはない
  answer: B
  explanation: カリフォルニア州では、一方通行の道路から別の一方通行の道路へ左折する場合に限り、一旦停止して交通や歩行者に道を譲った後であれば、赤信号でも左折することができます。
- id: 139
  category: safe_driving_rules
  question: カリフォルニア州において、交差する直前の100フィートの間、どちらの方向も100フィート先まで見通せない「見通しの悪い交差点」での制限速度はいくらですか？
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: カリフォルニア州の見通しの悪い交差点での制限速度は15 mphです。どの角にも一時停止標識がなく、どちらの方向も100フィート先まで見通せない場合、その交差点は見通しが悪いとみなされます。
- id: 140
  category: safe_driving_rules
  question: カリフォルニア州で、中央左折車線を走行することが許可されている最大距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: カリフォルニア州では、中央左折車線を走行できるのは200フィートまでです。この車線は、左折の開始もしくは完了、または許可されたUターンの開始のために予約されています。
- id: 141
  category: safe_driving_rules
  question: カリフォルニア州において、道路の建設または保守区域内で交通違反を犯した場合、罰金はどうなりますか？
  choices:
    A: 作業員がいない場合は罰金が半分に減額される
    B: 通常の違反と同じ金額のままである
    C: 罰金が2倍になる
    D: 罰金が3倍になる
  answer: C
  explanation: カリフォルニア州車両法に基づき、作業員がいる道路建設または保守区域内で交通違反を犯した場合、罰金は2倍になる対象となります。
- id: 142
  category: safe_driving_rules
  question: カリフォルニア州で、縁石のある対面通行の道路において、上り坂を向いて駐車する場合、前輪はどのように配置すべきですか？
  choices:
    A: 縁石の方に向ける
    B: 縁石とは反対の方向に向ける
    C: 縁石と平行にする
    D: 右側に向ける
  answer: B
  explanation: 縁石のある上り坂で駐車する場合は、車輪を縁石とは反対の方向に向け、車を数インチ後退させて前輪の背面が縁石に触れるようにします。これにより、車が車道に転がり出るのを防ぐことができます。
- id: 143
  category: defensive_driving
  question: 安全な車間距離を保ち、あおり運転（テールゲーティング）を避けるために、カリフォルニア州のドライバーズ・ハンドブックでは、どのような条件下で「3秒ルール」を使用することを推奨していますか？
  choices:
    A: 住宅街の道路を走行している時のみ
    B: 大型トラックやオートバイの後ろを走行している時のみ
    C: 通常の天候および交通状況下
    D: 時速65マイル以上で走行している時のみ
  answer: C
  explanation: カリフォルニア州のドライバーズ・ハンドブックでは、通常の天候および交通状況において、前方の車両との安全な車間距離を保つために「3秒ルール」を使用することを推奨しています。
- id: 144
  category: defensive_driving
  question: 直前のブレーキや急なハンドルの必要を避けるために、少なくとも自車の何秒先までの道路をスキャンすべきですか？
  choices:
    A: 2〜5秒先
    B: 10〜15秒先
    C: 20〜30秒先
    D: 60秒先
  answer: B
  explanation: 10〜15秒先をスキャンすることで、危険を早期に発見し、交通の流れの変化に対して安全に反応するための十分な時間を確保できます。
- id: 145
  category: defensive_driving
  question: カリフォルニア州の法律によると、天候により以下のどの機能を継続的に使用する必要がある場合、ヘッドライトを点灯しなければなりませんか？
  choices:
    A: デフロスター（霜取り装置）
    B: エアコン
    C: ワイパー
    D: 非常点滅表示灯（ハザードランプ）
  answer: C
  explanation: カリフォルニア州車両法では、雨や雪などの天候によりワイパーを継続的に使用する必要がある場合、常にヘッドライトを点灯することを義務付けています。
- id: 146
  category: defensive_driving
  question: 濡れた路面で車がハイドロプレーニング現象を起こし、路面との接地を失った場合、防衛運転として正しい対応は何ですか？
  choices:
    A: できるだけ早く停止するために強くブレーキをかける
    B: ハンドルを路肩の方へ急に切る
    C: すぐにギアをニュートラルに入れる
    D: 徐々に減速し、ブレーキの使用を避ける
  answer: D
  explanation: ハイドロプレーニング現象が起きた場合は、アクセルを離して徐々に減速し、スリップの原因となるブレーキ操作は避けるべきです。
- id: 147
  category: defensive_driving
  question: カリフォルニア州で夜間に運転中、対向車が何フィート以内に近づいた時にハイビームをロービームに切り替えなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 1,000フィート
  answer: C
  explanation: カリフォルニア州法では、相手のドライバーの目をくらませないよう、対向車が500フィート以内にいる場合はハイビームをロービームに切り替えることを義務付けています。
- id: 148
  category: defensive_driving
  question: 夜間に他の車両の後ろを走行している場合、その車両から何フィート以内に近づいた時にハイビームをロービームに切り替えなければなりませんか？
  choices:
    A: 100フィート
    B: 300フィート
    C: 500フィート
    D: 600フィート
  answer: B
  explanation: 前方の車両のバックミラーに眩しい光が反射するのを防ぐため、他の車両の後ろを300フィート以内で走行する場合はハイビームをロービームに切り替える必要があります。
- id: 149
  category: defensive_driving
  question: 寒冷または霜の降りる天候において、道路のどの部分が最も氷が隠れやすく、他の路面よりも先に凍結しやすいですか？
  choices:
    A: 信号機のある交差点
    B: 橋や高架橋
    C: 直射日光の当たる道路
    D: 急な下り坂
  answer: B
  explanation: 橋や高架橋は、路面の上下を空気が循環するため熱を失いやすく、他の道路よりも先に凍結する傾向があります。
- id: 150
  category: defensive_driving
  question: 日中に濃霧や煙の中を走行する場合、他のドライバーからの視認性を高めるためにどのライト設定を使用すべきですか？
  choices:
    A: ハイビーム（上向き灯）
    B: パーキングライト（車幅灯）のみ
    C: ロービーム（下向き灯）
    D: 非常点滅表示灯（ハザードランプ）
  answer: C
  explanation: 霧の中ではロービームを使用すべきです。ハイビームは空気中の水分に反射して眩しさを生じさせ、視界をさらに悪くするためです。
- id: 151
  category: defensive_driving
  question: 他のドライバーがあなたの車のすぐ後ろを走行している（あおり運転/車間距離を詰めている）場合、カリフォルニア州運転者ハンドブックに従って、最も安全な防衛運転（ディフェンシブ・ドライビング）の行動は何ですか？
  choices:
    A: ブレーキを繰り返し軽く踏んで、後続のドライバーに警告する
    B: 加速して、車両間の距離を広げる
    C: 徐々に減速するか、別の車線に移動して相手を追い越させる
    D: ハザードランプを点灯し、速度を維持する
  answer: C
  explanation: あおり運転に対処する最も安全な方法は、減速するか右側の車線に移動して追い越しを促し、自分の前方に十分なスペースを確保することです。
- id: 152
  category: defensive_driving
  question: 滑りやすい路面でのスリップを防ぐために、運転行動をどのように調整すべきですか？
  choices:
    A: 常に低いギアで走行する
    B: カーブや交差点に到達する前に減速する
    C: 停止する前にブレーキを素早くポンピング（断続的に踏む）する
    D: 前の車との車間距離をより詰めて走行する
  answer: B
  explanation: カーブや交差点の手前で減速することで、タイヤの摩擦力（トラクション）を失い、滑りやすい路面でスリップするリスクを軽減できます。
- id: 153
  category: defensive_driving
  question: 濡れた路面を走行する場合、カリフォルニア州運転者ハンドブックでは、速度を約どのくらい落とすべきだと提案していますか？
  choices:
    A: 時速2〜3マイル
    B: 時速5〜10マイル
    C: 掲示されている制限速度のちょうど半分
    D: 時速15〜20マイル
  answer: B
  explanation: 濡れた路面では、車両のコントロールを維持し、ハイドロプレーニング現象を避けるために、掲示されている制限速度よりも時速5〜10マイル（mph）遅く走行する必要があります。
- id: 154
  category: defensive_driving
  question: 交差点で停止しており、信号が青になった場合、交差点に進入する前にどの順序で周囲を確認すべきですか？
  choices:
    A: 右、左、そしてもう一度右
    B: 正面、次に左
    C: 左、右、そしてもう一度左
    D: 対向車が来る方向のみ
  answer: C
  explanation: 最初の危険は左側から接近する車両であるため、交差点に入る前に左、右、そしてもう一度左を確認する必要があります。
- id: 155
  category: defensive_driving
  question: 太陽に向かって運転しており、強いまぶしさを感じている場合、安全を維持するために推奨される防衛運転のテクニックは何ですか？
  choices:
    A: まぶしさを突き抜けて見えるようにハイビームを点灯する
    B: フロントガラスの内側と外側を清潔に保つ
    C: 目を慣らすために太陽を直視する
    D: 前の車にできるだけ近づいて走行する
  answer: B
  explanation: 清潔なフロントガラスはまぶしさを軽減するのに役立ちます。ガラスの汚れや筋は光を散乱させ、太陽に向かって走る際に見通しを非常に悪くします。
- id: 156
  category: alcohol_drugs_health
  question: カリフォルニア州で商用車を運転する個人の法定血中アルコール濃度（BAC）の上限はいくつですか？
  choices:
    A: 0.01%
    B: 0.04%
    C: 0.08%
    D: 0.05%
  answer: B
  explanation: 商業運転免許（CDL）を必要とする車両を運転するドライバーの場合、法定BAC制限は0.04%以上で違法となります。
- id: 157
  category: alcohol_drugs_health
  question: カリフォルニア州の公道を運転する行為により、法執行機関から要請された場合、血液、呼気、または尿のアルコール含有量の化学検査を受けることに同意したことになります。この法律は何と呼ばれますか？
  choices:
    A: 財政責任法（Financial Responsibility Law）
    B: 基本速度法（Basic Speed Law）
    C: 黙示の同意法（Implied Consent Law）
    D: 通行優先権法（Right of Way Law）
  answer: C
  explanation: 黙示の同意法（Implied Consent Law）は、カリフォルニア州で運転することにより、DUI（飲酒または薬物影響下の運転）の疑いで適法に逮捕された場合に化学検査を受けることに同意することを定めています。
- id: 158
  category: alcohol_drugs_health
  question: カリフォルニア州でDUI（飲酒または薬物影響下の運転）で逮捕され、化学検査を拒否した場合、運転資格に対する即時の結果はどうなりますか？
  choices:
    A: 免許が停止または取り消される
    B: 初回の拒否については警告のみが与えられる
    C: 少額の罰金を支払い、運転を継続することが求められる
    D: 車両が州によって永久に没収される
  answer: A
  explanation: DUIで逮捕された後に化学検査を拒否すると、裁判の結果に関わらず、DMV（陸運局）によって行政上の免許停止または取り消しが行われます。
- id: 159
  category: alcohol_drugs_health
  question: カリフォルニア州法の下で、トランクのない車両において、開封されたアルコールの容器を車内のどこに置くことが合法ですか？
  choices:
    A: 施錠されている限り、グローブボックスの中
    B: 運転席の下
    C: 通常、乗客が座らない車両のエリア
    D: フロントシートの間のセンターコンソールの中
  answer: C
  explanation: 車両にトランクがない場合、開封されたアルコール容器は乗客が座らない場所に保管しなければなりません。グローブボックスの中に保管することは、たとえ鍵がかかっていても違法です。
- id: 160
  category: alcohol_drugs_health
  question: 現在、カリフォルニア州での以前のDUI（飲酒または薬物影響下の運転）判決により執行猶予中の場合、運転中に維持しなければならない法定血中アルコール濃度（BAC）の制限はいくつですか？
  choices:
    A: 0.08%未満
    B: 0.05%未満
    C: 0.04%未満
    D: 0.01%未満
  answer: D
  explanation: DUI執行猶予の条件として、いかなる時もBAC 0.01%以上で運転してはなりません。
- id: 161
  category: alcohol_drugs_health
  question: カリフォルニア州法では、処方薬や市販薬の影響下での運転はどのように扱われますか？
  choices:
    A: 医師によって処方された薬である限り、合法です。
    B: その薬が麻薬である場合にのみ違法となります。
    C: 薬物が安全に運転する能力に支障をきたす場合、運転することは違法です。
    D: 処方薬の容器を携帯している限り、合法です。
  answer: C
  explanation: カリフォルニア州法では、アルコール、違法薬物、または合法的な薬物を区別しません。何らかの物質が運転に支障をきたす場合、DUI（酒気帯び・薬物影響下運転）で有罪判決を受ける可能性があります。
- id: 162
  category: alcohol_drugs_health
  question: アルコールを風邪薬や処方薬などの他の薬と併用した場合、運転能力にどのような影響がありますか？
  choices:
    A: 通常、アルコールが薬の効果を打ち消します。
    B: 併用による相乗効果は、多くの場合、それぞれの影響を合わせたものよりもはるかに大きくなります。
    C: 運転能力に大きな変化はありません。
    D: 薬を飲むことで、アルコールから早く酔いを覚ますことができます。
  answer: B
  explanation: アルコールと薬物を併用すると相乗効果が起こる可能性があり、どちらか一方の物質のみを使用した場合よりも、運転への支障が著しく悪化することを意味します。
- id: 163
  category: alcohol_drugs_health
  question: カリフォルニア州の「Admin Per Se（行政上の即時免許停止）」法に基づき、呼気または血液検査に不合格だった場合、あるいは拒否した場合、警察官は何をすることができますか？
  choices:
    A: 直ちに最低1年間刑務所に収監する。
    B: 運転免許証を没収し、30日間有効な仮免許証を発行する。
    C: その場で車両登録を永久に抹消する。
    D: 警察官に対して5,000ドルの罰金を即座に支払うよう強制する。
  answer: B
  explanation: Admin Per Se法に基づき、警察官はあなたのカリフォルニア州運転免許証を没収し、DMVがあなたのケースを審査する間、30日間有効な仮免許証を発行します。
- id: 164
  category: alcohol_drugs_health
  question: カリフォルニア州法によると、運転者または同乗者が21歳以上の場合、車内で大麻をどのように保管しなければなりませんか？
  choices:
    A: 1オンス未満であれば、どこに置いても構いません。
    B: 密閉された容器に入れるか、車両のトランクの中に保管しなければなりません。
    C: 常にグローブボックスに入れておかなければなりません。
    D: 運転者が医療大麻カードを持っている場合にのみ運搬できます。
  answer: B
  explanation: アルコールと同様に、大麻は「開栓容器（オープンコンテナ）」違反を避けるため、開封されていない容器に入れるか、トランクに保管しなければなりません。
- id: 165
  category: alcohol_drugs_health
  question: カリフォルニア州におけるDUI（酒気帯び・薬物影響下運転）の初犯の罰金（追徴金や裁判費用を除く）は、通常どのくらいの範囲ですか？
  choices:
    A: 100ドルから200ドル
    B: 390ドルから1,000ドル
    C: 1,500ドルから3,000ドル
    D: 5,000ドルから10,000ドル
  answer: B
  explanation: カリフォルニア州でのDUI初犯の基本罰金は390ドルから1,000ドルですが、追徴金を含めた総額は数千ドルを超えることがよくあります。
- id: 166
  category: alcohol_drugs_health
  question: 安全に運転する能力に影響を及ぼす可能性のある健康状態（持病）がある場合、カリフォルニア州法の下でのあなたの責任は何ですか？
  choices:
    A: 直ちに運転を中止し、二度と運転してはいけません。
    B: 医学的評価を受けるために、その状態をDMVに報告しなければなりません。
    C: 保険会社にその状態を伝えるだけで十分です。
    D: 体調が良いと感じる限り、何も報告する必要はありません。
  answer: B
  explanation: 運転者は、てんかん、パーキンソン病、または意識消失を引き起こす可能性のある状態について、運転の安全性を評価するためにDMVに報告することが義務付けられています。
- id: 167
  category: alcohol_drugs_health
  question: カリフォルニア州の運転者ハンドブックによると、指定運転者（デザイネイテッド・ドライバー）の主な責任は何ですか？
  choices:
    A: 1時間に1杯だけアルコール飲料を飲むこと。
    B: 法定限度内であると感じる場合にのみ運転すること。
    C: 完全にしらふ（無飲酒）の状態を保ち、他の人々に安全な輸送手段を提供すること。
    D: 他の同乗者のアルコール摂取量を監視すること。
  answer: C
  explanation: 指定運転者とは、グループの全員が安全に帰宅できるように、100%しらふ（無飲酒）でいる人のことを指します。
- id: 168
  category: alcohol_drugs_health
  question: 飲酒後、血中アルコール濃度（BAC）を効果的に下げるための唯一の方法は、次のうちどれですか？
  choices:
    A: 濃いブラックコーヒーを数杯飲む。
    B: 非常に冷たいシャワーを浴びる。
    C: 運動やランニングをしてアルコールを汗で流す。
    D: 体がアルコールを分解する時間を待つ。
  answer: D
  explanation: 時間だけが人のBACを下げる唯一の方法です。コーヒー、冷たいシャワー、運動などは、肝臓がアルコールを処理する速度を速めることはありません。
- id: 169
  category: alcohol_drugs_health
  question: カリフォルニア州では、DUI（酒気帯び・薬物影響下運転）の違反時に14歳未満の子供が同乗していた場合、罰則はどうなりますか？
  choices:
    A: 罰則は全く変わりません。
    B: 運転者は子供に関して口頭注意を受けるだけです。
    C: 刑の加重により罰則が強化されます。
    D: 運転免許証は30日間だけ停止されます。
  answer: C
  explanation: カリフォルニア州車両法に基づき、DUIの際に14歳未満の未成年者が同乗していた場合は「刑の加重（sentencing enhancement）」の対象となり、義務的な追加の拘禁刑が科されます。
- id: 170
  category: penalties_and_points
  question: 過失運転者処理システム（NOTS）に基づき、カリフォルニア州の運転免許証が停止されるのは、12ヶ月以内に何ポイントに達した場合ですか？
  choices:
    A: 2ポイント
    B: 3ポイント
    C: 4ポイント
    D: 5ポイント
  answer: C
  explanation: カリフォルニア州では、12ヶ月間に4ポイント、24ヶ月間に6ポイント、または36ヶ月間に8ポイント累積すると、DMVは運転特権を停止します。
- id: 171
  category: penalties_and_points
  question: カリフォルニア州DMVによると、24ヶ月以内に運転記録に何ポイント累積すると免許停止になりますか？
  choices:
    A: 4ポイント
    B: 6ポイント
    C: 8ポイント
    D: 10ポイント
  answer: B
  explanation: 24ヶ月以内に6ポイントを累積した運転者は、不注意な運転者（negligent operator）とみなされ、免許停止の対象となります。
- id: 172
  category: penalties_and_points
  question: カリフォルニア州の運転者が不注意な運転者（negligent operator）とみなされ、免許停止となる可能性があるのは、36ヶ月以内に何ポイント累積した場合ですか？
  choices:
    A: 6ポイント
    B: 7ポイント
    C: 8ポイント
    D: 12ポイント
  answer: C
  explanation: 3年間（36ヶ月）の期間における不注意な運転者による免許停止の基準は8ポイントです。
- id: 173
  category: penalties_and_points
  question: カリフォルニア州において、無謀運転（reckless driving）または酒気帯び・薬物影響下運転（DUI）で有罪判決を受けた場合、運転記録に何ポイント加算されますか？
  choices:
    A: 1ポイント
    B: 2ポイント
    C: 3ポイント
    D: 4ポイント
  answer: B
  explanation: 当て逃げ、無謀運転、DUIなどのより重大な違反は、運転記録に2ポイント加算されます。
- id: 174
  category: penalties_and_points
  question: カリフォルニア州における、不適切なUターンやスピード違反など、ほとんどの標準的な交通違反の有罪判決では、運転記録に何ポイント加算されますか？
  choices:
    A: 1ポイント
    B: 2ポイント
    C: 1/2ポイント
    D: 3ポイント
  answer: A
  explanation: スピード違反や一時停止無視など、ほとんどの軽微な交通違反の有罪判決は、運転記録に1ポイント加算されます。
- id: 175
  category: penalties_and_points
  question: カリフォルニア州で、未成年者が同乗している車内での喫煙で有罪となった場合の最大罰金額はいくらですか？
  choices:
    A: 最大50ドル
    B: 最大100ドル
    C: 最大250ドル
    D: 最大500ドル
  answer: B
  explanation: 未成年者が同乗している場合、車内での喫煙はいかなる時も違法であり、違反した場合は最大100ドルの罰金が科せられます。
- id: 176
  category: penalties_and_points
  question: 法執行機関（警察など）からの逃走を試みている最中に、重大な身体的傷害を負わせた罪で有罪となった場合、州刑務所への最低禁錮期間は何年ですか？
  choices:
    A: 1年
    B: 2年
    C: 3年
    D: 10年
  answer: C
  explanation: 警察の追跡中に重大な身体的傷害を負わせた罪で有罪となった者は、州刑務所に3年、5年、または7年の禁錮に処されます。
- id: 177
  category: penalties_and_points
  question: 13歳から21歳の人が、器物損壊（vandalism）や落書き（graffiti）で有罪となった場合、裁判所はカリフォルニア州の運転免許をどのくらいの期間停止することができますか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 21歳になるまで
  answer: B
  explanation: カリフォルニア州法では、落書きを含む器物損壊で有罪となった個人に対し、裁判所は最大1年間の運転免許停止を命じることができます。
- id: 178
  category: penalties_and_points
  question: カリフォルニア州において、交通事故で過失があると判断された場合、通常、運転記録に何ポイント加算されますか？
  choices:
    A: 0ポイント
    B: 1ポイント
    C: 2ポイント
    D: 3ポイント
  answer: B
  explanation: 事故に関与し、過失があると判断された場合、DMVは通常、運転記録に1ポイントを加算します。
- id: 179
  category: penalties_and_points
  question: 1,000ドルを超える物的損害が発生した場合、何日以内にカリフォルニア州交通事故報告書（SR 1）をDMVに提出しなければなりませんか？
  choices:
    A: 5日以内
    B: 10日以内
    C: 15日以内
    D: 30日以内
  answer: B
  explanation: 負傷者や死者が出た場合、または1,000ドルを超える物的損害が発生した場合は、10日以内にDMVに事故を報告しなければなりません。
- id: 180
  category: penalties_and_points
  question: 事故を起こした際に、財政的責任の証明（保険）を提示できなかった場合、義務付けられている免許停止期間はどのくらいですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 4年
  answer: B
  explanation: 事故を起こした際に保険に加入していない場合、運転免許は最大4年間停止されますが、1年後には制限付き免許を申請できる場合があります。
- id: 181
  category: penalties_and_points
  question: 仮免許（プロビジョナル免許）を持つ運転者が、初めて「過失のある」事故を起こした、または交通違反で有罪判決を受けた場合、どのような結果になりますか？
  choices:
    A: DMV（陸運局）から警告状が届く
    B: 30日間の免許停止
    C: 義務的な運転者教育コースの受講
    D: 500ドルの罰金
  answer: A
  explanation: 初めて「過失のある」事故を起こした、または交通法規違反で有罪判決を受けた場合、DMVは仮免許保持者に対して警告状を送付します。
- id: 182
  category: penalties_and_points
  question: 仮免許保持者が12ヶ月以内に2回目の「過失のある」事故、または交通違反の有罪判決を受けた場合、どのような罰則が科されますか？
  choices:
    A: 10日間の禁錮刑
    B: 30日間、親または免許を持つ成人の同伴がなければ運転できないという制限
    C: 永久的な免許取消
    D: 1,000ドルの罰金
  answer: B
  explanation: 12ヶ月以内に2回目の「過失のある」事故または有罪判決を受けた場合、25歳以上の免許を持つ親または成人が同伴しない限り、30日間運転することができません。
- id: 183
  category: penalties_and_points
  question: 速度超過や不適切な右左折など、ほとんどの標準的な交通違反の記録は、カリフォルニア州の運転記録に何年間残りますか？
  choices:
    A: 1年間
    B: 3年間
    C: 7年間
    D: 10年間
  answer: B
  explanation: ほとんどの交通違反の判決や事故の記録は36ヶ月（3年間）記録に残りますが、より重大な違反の中にはそれ以上の期間残るものもあります。
- id: 184
  category: penalties_and_points
  question: カリフォルニア州において、時速100マイル（約160km/h）を超える速度で走行し有罪判決を受けた場合、運転記録に何ポイント加算されますか？
  choices:
    A: 1ポイント
    B: 2ポイント
    C: 3ポイント
    D: 4ポイント
  answer: B
  explanation: 時速100マイル以上での走行はカリフォルニア州では重大な違反とみなされ、運転記録に2ポイントが加算されます。
- id: 185
  category: sharing_the_road
  question: カリフォルニア州において、横断歩道の白線がない交差点では、誰に優先権がありますか？
  choices:
    A: 標示のない交差点では、常に運転者が歩行者に対して優先権を持つ
    B: 歩行者は、横断歩道の白線がなくても、すべての交差点で優先権を持つ
    C: 交差点に最初に到着した人が常に優先権を持つ
    D: 歩行者は、ペイントされた線がある指定の横断歩道を使用している場合のみ優先権を持つ
  answer: B
  explanation: カリフォルニア州では、道路がほぼ直角に交わるすべての交差点には「標示のない横断歩道」が存在するとみなされ、運転者は歩行者に道を譲らなければなりません。
- id: 186
  category: sharing_the_road
  question: 道路の角で、白い杖を持った、または盲導犬を連れた視覚障害のある歩行者を見かけた際、横断歩道からどの程度の距離で停車することが推奨されますか？
  choices:
    A: 歩行者がエンジンの音に驚かないよう、少なくとも15フィート離れて停車すべきである
    B: 歩行者がエンジンの音を聞き取れるよう、横断歩道から5フィート以内に停車すべきである
    C: 停止線ぴったりに停車し、自分の存在を知らせるためにクラクションを鳴らすべきである
    D: 歩行者がすでに車道に足を踏み入れた場合にのみ停車すべきである
  answer: B
  explanation: 横断歩道から5フィート（約1.5メートル）以内に停車することは重要です。なぜなら、視覚障害のある歩行者はエンジンの音を頼りに車両が停止していることを確認し、交通の方向を判断するためです。
- id: 187
  category: sharing_the_road
  question: カリフォルニア州の「3フィート安全法（Three Feet for Safety Act）」によると、同じ方向に進んでいる自転車を追い越す際、運転者は最低でもどれくらいの距離を保たなければなりませんか？
  choices:
    A: 少なくとも2フィートの間隔を保たなければならない
    B: 少なくとも3フィートの間隔を保たなければならない
    C: 少なくとも5フィートの間隔を保たなければならない
    D: サイドミラーが自転車に触れない程度の十分な間隔を保たなければならない
  answer: B
  explanation: カリフォルニア州の法律では、自転車を追い越す際に少なくとも3フィート（約90センチメートル）の間隔を空けることが義務付けられています。3フィートの間隔を空けることが不可能な場合は、速度を落とし、安全が確認できた時にのみ追い越さなければなりません。
- id: 188
  category: sharing_the_road
  question: 右折の準備をしており、自転車専用レーンがある場合、曲がる手前何フィートから自転車専用レーンに進入することが許可されていますか？
  choices:
    A: 交差点の50フィート手前から進入できる
    B: 交差点の100フィート手前から進入できる
    C: 交差点の200フィート手前から進入できる
    D: 右折時であっても、自転車専用レーンを走行することは決して許可されない
  answer: C
  explanation: カリフォルニア州では、右折を開始する前に自転車がいないか確認し、交差点の200フィート（約60メートル）手前から自転車専用レーンに進入しなければなりません。
- id: 189
  category: sharing_the_road
  question: カリフォルニア州における、道路上でのモーターサイクルによる「レーンスプリッティング（車線分割走行/すり抜け）」に関する法律はどうなっていますか？
  choices:
    A: レーンスプリッティングは、カリフォルニア州のすべての高速道路で厳格に禁止されている
    B: レーンスプリッティングは、モーターサイクルに乗った緊急対応要員にのみ許可されている
    C: レーンスプリッティングは、安全かつ慎重な方法で行われるのであれば、カリフォルニア州では合法である
    D: レーンスプリッティングは、交通の流れが時速50マイル以上で動いている場合にのみ合法である
  answer: C
  explanation: カリフォルニア州は、同じ車線内の停止中または走行中の車両の列の間をモーターサイクルが走行する「レーンスプリッティング」を正式に認めた最初の州です。
- id: 190
  category: sharing_the_road
  question: 大型トラックや商用車の「ノー・ゾーン（No Zone）」と呼ばれるエリアに留まるのを避けるべきなのはなぜですか？
  choices:
    A: トラックの運転手は頻繁に車線変更を義務付けられており、衝突する可能性があるため
    B: トラックからの乱気流により、自車のコントロールを失う可能性があるため
    C: そこはトラックの運転手から自車が見えない死角であるため
    D: カリフォルニア州では、トラックの横を30秒以上並走することは違法であるため
  answer: C
  explanation: 大型トラックには、側面、前方、後方に「ノー・ゾーン」と呼ばれる大きな死角があります。トラックのサイドミラーに運転手の顔が見えない場合、相手からもあなたの車は見えていません。
- id: 191
  category: sharing_the_road
  question: 大型トラックが片側2車線の道路に右折する場合、どのような行動を予想すべきですか？
  choices:
    A: トラックは常に右端の車線を維持して曲がる。
    B: トラックは右折を完了するために、左側に大きく膨らむ必要がある場合がある。
    C: トラックはすべての交通がなくなるまで停止して待つ。
    D: トラックはトレーラーが縁石に乗り上げないよう加速する。
  answer: B
  explanation: 大型トラックはその長さゆえに、後輪が縁石に乗り上げないように右折する際、左側に大きく膨らむ必要があることがよくあります。
- id: 192
  category: sharing_the_road
  question: 物理的な障壁で仕切られた多車線道路を走行中、反対側のスクールバスが赤色灯を点滅させている場合、停止に関するルールはどうなりますか？
  choices:
    A: 赤色灯の点滅が止まるまで停止しなければならない。
    B: 時速15マイル（15 mph）まで減速する必要があるが、停止する必要はない。
    C: バスが物理的な障壁や中央分離帯の反対側にいる場合は、停止する必要はない。
    D: 現在子供が道路を横断している場合にのみ停止しなければならない。
  answer: C
  explanation: カリフォルニア州の法律では、物理的な障壁がある分離道路や多車線道路（各方向に2車線以上）において、スクールバスが反対側にいる場合は、赤色灯が点滅していても停止する必要はありません。
- id: 193
  category: sharing_the_road
  question: カリフォルニア州で、赤色灯を点滅させ停止サイン（ストップアーム）を出しているスクールバスに停止しなかった場合の、初犯の最大罰金はいくらですか？
  choices:
    A: 最大100ドルの罰金。
    B: 最大250ドルの罰金。
    C: 最大500ドルの罰金。
    D: 最大1,000ドルの罰金。
  answer: D
  explanation: 赤色灯を点滅させているスクールバスに停止しないことは、カリフォルニア州では重大な違反であり、最大1,000ドルの罰金と、1年間の免許停止の可能性があります。
- id: 194
  category: sharing_the_road
  question: カリフォルニア州の「ムーブ・オーバー（Move Over）」法に基づき、フリーウェイで緊急車両用ライトを点滅させて停車している緊急車両に近づく際、運転者は何をしなければなりませんか？
  choices:
    A: 緊急事態が終わるまで、走行車線内で直ちに停止する。
    B: 安全であれば、緊急車両に隣接していない車線に移動する。
    C: 交通を乱さないよう、速度を維持して車線にとどまる。
    D: 現場をできるだけ早く通過するために加速する。
  answer: B
  explanation: 「ムーブ・オーバー」法は、停車中の緊急車両、レッカー車、またはライトを点滅させている標識付きの運輸局（DOT）車両に近づく際、車線を移動するか、十分に減速することを運転者に義務付けています。
- id: 195
  category: sharing_the_road
  question: カリフォルニア州では、サイレンを鳴らしているかライトを点滅させている消防車、警察車両、または救急車の後方何フィート以内を走行することは違法ですか？
  choices:
    A: 100フィート。
    B: 200フィート。
    C: 300フィート。
    D: 500フィート。
  answer: C
  explanation: カリフォルニア州法では、サイレンやライトを使用している緊急車両の300フィート以内を追従することを禁止しています。これは、車両の操縦や対応の妨げになる可能性があるためです。
- id: 196
  category: sharing_the_road
  question: 車両の後部にある、赤い縁取りの蛍光オレンジ色の三角形は何を意味していますか？
  choices:
    A: その車両は危険物を運搬している。
    B: その車両は時速25マイル（25 mph）未満で走行する低速車両である。
    C: その車両は追加のスペースを必要とする大型積載物である。
    D: その車両は練習中の教習生または運転者である。
  answer: B
  explanation: 農耕用トラクター、道路維持車両、馬車などは、その車両が時速25マイル以下で走行していることを他の運転者に警告するために、このエンブレムを表示します。
- id: 197
  category: sharing_the_road
  question: 歩道がない場合、歩行者は道路のどちらの方向に向かって歩くべきですか？
  choices:
