metadata:
  source: 2025 California Driver Handbook (dmv.ca.gov)
  total_questions: 252
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: Beginning May 2025, what type of identification will be required to board
    an airplane for domestic flights?
  choices:
    A: A standard Class C driver's license
    B: A REAL ID compliant driver's license or ID card
    C: A standard California Identification Card
    D: A voter registration card
  answer: B
  explanation: The manual states that beginning May 2025, your driver's license or
    identification (ID) card must be REAL ID compliant if you use it to board an airplane
    for domestic flights.
- id: 2
  category: license_system
  question: Which class of driver's license do most people need to drive a standard
    passenger vehicle?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class M
  answer: C
  explanation: According to the manual, you must have the correct license to drive
    your vehicle type, and most people need a noncommercial Class C driver's license.
- id: 3
  category: license_system
  question: Which of the following is true regarding California Identification (ID)
    cards?
  choices:
    A: They allow you to drive only during daylight hours.
    B: They are only issued to individuals 18 years and older.
    C: They permit you to drive if accompanied by a licensed driver.
    D: They are issued for identification purposes and do not permit you to drive.
  answer: D
  explanation: The manual specifies that ID cards are issued for identification purposes
    to eligible persons of any age and they do not permit you to drive.
- id: 4
  category: license_system
  question: How old must you be to apply for an instruction permit if you are under
    18 years old?
  choices:
    A: At least 15 years old
    B: At least 15½ years old
    C: At least 16 years old
    D: At least 16½ years old
  answer: B
  explanation: If you are under 18 years old, you will need to be at least 15½ years
    old to apply for an instruction permit.
- id: 5
  category: driver_testing
  question: If you are under 18, when can you start using your instruction permit
    to practice driving?
  choices:
    A: Immediately after passing the knowledge test
    B: After you have held the permit for 30 days
    C: When you start behind-the-wheel driver training with an instructor who validates
      it
    D: As soon as your parent or guardian signs the permit
  answer: C
  explanation: Minors must wait to use their instruction permit until they start behind-the-wheel
    driver training with an instructor who will validate the permit.
- id: 6
  category: driver_testing
  question: If you are over 18 and have an instruction permit, who must you practice
    driving with?
  choices:
    A: Any licensed driver who is at least 16 years old
    B: A California-licensed driver who is at least 18 years old
    C: A California-licensed driver who is at least 21 years old
    D: A California-licensed driver who is at least 25 years old
  answer: B
  explanation: To get your driver's license after you have your instruction permit,
    you need to practice driving with a California-licensed driver who is at least
    18 years old (25 for minors).
- id: 7
  category: driver_testing
  question: If you are under 18, who must supervise your 50 hours of practice driving?
  choices:
    A: A California-licensed driver who is at least 18 years old
    B: A California-licensed driver who is at least 21 years old
    C: A California-licensed driver who is at least 25 years old
    D: Any licensed driving instructor regardless of age
  answer: C
  explanation: Minors must practice driving for at least 50 hours with a California-licensed
    driver who is at least 25 years old.
- id: 8
  category: driver_testing
  question: How many hours of night driving practice must a minor complete before
    getting a driver's license?
  choices:
    A: 5 hours
    B: 10 hours
    C: 15 hours
    D: 20 hours
  answer: B
  explanation: Of the 50 hours of practice driving required for minors, ten hours
    must be at night.
- id: 9
  category: license_system
  question: What is the minimum age to get a driver's license if you are under 18
    years old?
  choices:
    A: 15½ years old
    B: 16 years old
    C: 16½ years old
    D: 17 years old
  answer: B
  explanation: To get a driver's license if you are under 18 years old, you need to
    be at least 16 years old.
- id: 10
  category: driver_testing
  question: How long must a minor hold an instruction permit before scheduling a behind-the-wheel
    drive test?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 9 months
    D: At least 12 months
  answer: B
  explanation: Minors must have an instruction permit from California or another state
    for at least 6 months (or turn 18 years old) before scheduling a behind-the-wheel
    drive test.
- id: 11
  category: driver_responsibility
  question: If a minor's parents share joint custody, who must sign the driver's license
    application to accept financial responsibility?
  choices:
    A: Only the parent the minor lives with most of the time
    B: Either parent can sign individually
    C: Both parents must sign
    D: A legal judge must sign
  answer: C
  explanation: The manual states that if your parents or guardians share joint custody
    of you, both must sign to approve the application and accept financial responsibility.
- id: 12
  category: driver_testing
  question: What must a driving school instructor carry with them that a student should
    ask to see?
  choices:
    A: A special commercial driver's license
    B: An instructor's ID card
    C: A DMV authorization letter
    D: A proof of insurance certificate
  answer: B
  explanation: Driver education and driver training instructors must carry an instructor's
    ID card, and the manual advises you to ask to see it.
- id: 13
  category: license_system
  question: 'When applying for a Class C instruction permit, the application fee is:'
  choices:
    A: Refundable if you fail the knowledge test
    B: Refundable if you cancel your application
    C: Non-refundable
    D: Waived for first-time applicants
  answer: C
  explanation: To apply for a Class C instruction permit, one of the steps is to pay
    a non-refundable application fee.
- id: 14
  category: safe_driving_rules
  question: 'When practicing driving with an instruction permit, the supervising licensed
    driver must:'
  choices:
    A: Sit in the back seat to observe the driver's blind spots
    B: Sit close enough to take control of the vehicle if needed
    C: Follow behind the learner in a separate vehicle
    D: Be a certified driving instructor
  answer: B
  explanation: The supervising California-licensed driver must sit close enough to
    take control of the vehicle if needed.
- id: 15
  category: driver_testing
  question: Which of the following tests is required to apply for a Class C instruction
    permit?
  choices:
    A: A hearing test
    B: A vision test
    C: A physical fitness exam
    D: A defensive driving course exam
  answer: B
  explanation: To apply for a Class C instruction permit, you must pass your knowledge
    test(s) and pass a vision test.
- id: 16
  category: license_system
  question: During the first 12 months of holding a provisional driver's license,
    a minor cannot drive between what hours?
  choices:
    A: 10 p.m. and 5 a.m.
    B: 11 p.m. and 5 a.m.
    C: Midnight and 6 a.m.
    D: 11 p.m. and 6 a.m.
  answer: B
  explanation: As a provisional driver, you cannot drive between 11 p.m. and 5 a.m.
    during the first 12 months you have your license.
- id: 17
  category: license_system
  question: 'Under a provisional license, you cannot drive with passengers under 20
    years old unless accompanied by:'
  choices:
    A: Any licensed driver over 18 years old
    B: A licensed driver who is at least 21 years old
    C: A California-licensed driver who is at least 25 years old
    D: A sibling over 18 years old
  answer: C
  explanation: You cannot drive with passengers under 20 years old, unless your parent
    or guardian or other California-licensed driver (at least 25 years old) rides
    with you.
- id: 18
  category: driver_testing
  question: If a minor fails the knowledge test, how long must they wait before retaking
    it?
  choices:
    A: 3 days
    B: 7 days
    C: 10 days
    D: 14 days
  answer: B
  explanation: Minors must wait seven days to retake a failed knowledge test, not
    including the day of the failure.
- id: 19
  category: driver_testing
  question: How long must a minor wait to retake a failed behind-the-wheel drive test?
  choices:
    A: 7 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: C
  explanation: Minors must wait 14 days to retake a failed behind-the-wheel drive
    test, not including the day of the failure.
- id: 20
  category: vehicle_information
  question: During the pre-drive inspection for your behind-the-wheel test, your vehicle's
    tires must have at least how much uniformed tread depth?
  choices:
    A: 1/16-inch
    B: 1/32-inch
    C: 2/32-inch
    D: 1/8-inch
  answer: B
  explanation: The tires must have at least 1/32-inch of uniformed tread depth. The
    use of a donut tire is not allowed during a drive test.
- id: 21
  category: vehicle_information
  question: 'To pass the pre-drive inspection, your vehicle''s horn must be loud enough
    to be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The horn must be designed for the vehicle, in proper working condition,
    and loud enough to be heard from a distance of at least 200 feet.
- id: 22
  category: driver_testing
  question: Which of the following vehicle safety technologies is permitted to be
    used during the behind-the-wheel drive test?
  choices:
    A: Automated parallel parking
    B: Lane departure systems
    C: Adaptive cruise control
    D: Backup cameras
  answer: D
  explanation: Vehicle safety technology, such as backup cameras and blind spot monitors,
    may be used on the drive test. Advanced driver assistance systems like automated
    parallel parking, lane departure, and adaptive cruise control are not permitted.
- id: 23
  category: license_system
  question: If you move, how many days do you have to notify the DMV of your new address?
  choices:
    A: 5 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: If you move, you must notify DMV of your new address within ten days.
- id: 24
  category: license_system
  question: 'If you are out-of-state and cannot renew your driver''s license, you
    may request an extension of up to:'
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: If you are out-of-state and cannot renew, you may request a one-year
    extension of your driver's license.
- id: 25
  category: alcohol_drugs_health
  question: What is the rule regarding wearing headsets or earplugs while driving
    in California?
  choices:
    A: It is recommended to block out road noise
    B: It is illegal to wear a headset or earplugs in both ears
    C: It is only illegal if you are listening to music
    D: It is legal as long as the volume is low
  answer: B
  explanation: It is illegal to wear a headset or earplugs in both ears while driving,
    as you must be able to hear horns, sirens, motorcycles, or screeching tires.
- id: 26
  category: alcohol_drugs_health
  question: Physicians are required to report patients to the DMV for medical conditions
    that may affect their ability to drive safely if the patient is at least what
    age?
  choices:
    A: 14 years old
    B: 16 years old
    C: 18 years old
    D: 21 years old
  answer: A
  explanation: Physicians are required to report patients, who are at least 14 years
    old, to DMV for medical conditions that may affect your ability to drive safely,
    such as lapse of consciousness.
- id: 27
  category: safe_driving_rules
  question: When using the hand-to-hand (push/pull) steering method, where should
    your hands be placed on the steering wheel?
  choices:
    A: 10 and 2 o'clock
    B: 9 and 3 o'clock or 8 and 4 o'clock
    C: 12 and 6 o'clock
    D: 7 and 5 o'clock
  answer: B
  explanation: To use the hand-to-hand steering method, start with your hands at 9
    and 3 o'clock or 8 and 4 o'clock.
- id: 28
  category: license_system
  question: If a provisional driver needs to drive during restricted hours for a medical
    need, what must they carry?
  choices:
    A: A note signed by their parent or guardian
    B: A note signed by their school principal
    C: A note signed by their physician with the medical condition and recovery date
    D: A medical ID bracelet
  answer: C
  explanation: For a medical need exception, you must carry a note signed by your
    physician. The note must have your medical condition and date you are expected
    to recover.
- id: 29
  category: driver_testing
  question: What is the DMV's policy on using a video recording device during a behind-the-wheel
    drive test?
  choices:
    A: It is encouraged for training purposes
    B: It is allowed if the examiner consents
    C: It is prohibited and must be powered off or blocked
    D: It is only allowed for audio recording
  answer: C
  explanation: The use of a recording device, including a video recorder, is prohibited
    during a behind-the-wheel drive test. If it cannot be powered off or disabled,
    the applicant must block it.
- id: 30
  category: vehicle_information
  question: During the pre-drive inspection, how many rearview mirrors must your vehicle
    have, and where must one be located?
  choices:
    A: At least one mirror, located inside the vehicle
    B: At least two mirrors, with one on the left side of the vehicle
    C: At least three mirrors, covering all blind spots
    D: At least two mirrors, with one on the right side of the vehicle
  answer: B
  explanation: The vehicle must have at least two rearview mirrors. One of them must
    be on the left side of your vehicle.
- id: 31
  category: safe_driving_rules
  question: When is it appropriate to use the hand-over-hand steering method?
  choices:
    A: When driving at high speeds on the freeway.
    B: When you turn at low speeds, park, or need to recover from a skid.
    C: When you are backing up in a straight line.
    D: When you are operating other vehicle controls.
  answer: B
  explanation: According to the manual, you should use hand-over-hand steering when
    you turn at low speeds, park, or need to recover from a skid.
- id: 32
  category: safe_driving_rules
  question: Where should you place your hand on the steering wheel when turning while
    backing up?
  choices:
    A: At the 6 o'clock position.
    B: At the 9 o'clock position.
    C: At the 12 o'clock position.
    D: At the 3 o'clock position.
  answer: C
  explanation: When turning while backing up to see where you are going behind you,
    you should place your hand at the 12 o'clock position on the steering wheel.
- id: 33
  category: safe_driving_rules
  question: How far in advance must you signal before changing lanes on a freeway?
  choices:
    A: At least 100 feet.
    B: At least 200 feet.
    C: At least three seconds.
    D: At least five seconds.
  answer: D
  explanation: The manual states that you should signal at least five seconds before
    you change lanes on a freeway.
- id: 34
  category: safe_driving_rules
  question: Which of the following is true regarding the use of your turn signals?
  choices:
    A: You only need to signal when you see other vehicles around you.
    B: You should signal even when you do not see other vehicles around you.
    C: You must signal at least 50 feet before you turn.
    D: You do not need to signal when pulling away from the curb.
  answer: B
  explanation: You should signal even when you do not see other vehicles around you
    to ensure safe communication on the road.
- id: 35
  category: defensive_driving
  question: When driving on narrow mountain roads, you should use your horn to alert
    oncoming traffic if you cannot see at least how far ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: You should use your horn to alert oncoming traffic on narrow mountain
    roads where you cannot see at least 200 feet ahead.
- id: 36
  category: safe_driving_rules
  question: At what distance must you dim your high-beam headlights to low beams when
    following another vehicle?
  choices:
    A: Within 200 feet
    B: Within 300 feet
    C: Within 400 feet
    D: Within 500 feet
  answer: B
  explanation: You must dim your high-beam headlights to low beams within 500 feet
    of a vehicle coming toward you or within 300 feet of a vehicle you are following.
- id: 37
  category: safe_driving_rules
  question: Under which weather conditions are you legally required to turn on your
    low-beam headlights?
  choices:
    A: Whenever the temperature drops below freezing.
    B: If you need to use your windshield wipers due to fog, rain, or snow.
    C: Only when driving on mountain roads during the winter.
    D: Whenever you are driving in a carpool lane.
  answer: B
  explanation: If you need to use your windshield wipers due to fog, rain, or snow,
    you must turn on your low-beam headlights.
- id: 38
  category: safe_driving_rules
  question: What is the general rule for using headlights in relation to sunset and
    sunrise?
  choices:
    A: Turn them on 30 minutes after sunset and leave them on until 30 minutes before
      sunrise.
    B: Turn them on exactly at sunset and turn them off at sunrise.
    C: Turn them on 1 hour after sunset and leave them on until 1 hour before sunrise.
    D: Turn them on 30 minutes before sunset and leave them on until 30 minutes after
      sunrise.
  answer: A
  explanation: You must use your headlights beginning 30 minutes after sunset until
    30 minutes before sunrise.
- id: 39
  category: defensive_driving
  question: If you need to stop because of vehicle trouble, which of the following
    should you avoid doing?
  choices:
    A: Turning on your emergency flashers.
    B: Pulling off the road away from all traffic.
    C: Stopping just over a hill or just around a curve.
    D: Calling for emergency roadside assistance.
  answer: C
  explanation: You should not stop just over a hill or just around a curve because
    other drivers may not see your vehicle in time to avoid a collision.
- id: 40
  category: signs_and_signals
  question: What does a yield line, consisting of solid white triangles on the road
    surface, indicate?
  choices:
    A: A designated area for carpools.
    B: The end of a freeway lane.
    C: Where approaching vehicles should yield or stop.
    D: A barrier that you must not cross.
  answer: C
  explanation: A yield line is a line of solid white triangles that shows approaching
    vehicles where to yield or stop.
- id: 41
  category: safe_driving_rules
  question: How should you treat two sets of solid double yellow lines spaced two
    or more feet apart?
  choices:
    A: As a center left turn lane.
    B: As a passing lane for high-occupancy vehicles.
    C: As a barrier that you must not drive on or over.
    D: As a designated turnout area.
  answer: C
  explanation: Two sets of solid double yellow lines spaced two or more feet apart
    are considered a barrier. Do not drive on or over this barrier, make a left turn,
    or make a U-turn across it.
- id: 42
  category: safe_driving_rules
  question: What do double solid white lines indicate on the roadway?
  choices:
    A: A lane barrier between a regular use and a preferential use lane that you must
      never cross.
    B: The center of a road with two-way traffic.
    C: A passing zone on a one-way street.
    D: A center left turn lane.
  answer: A
  explanation: Double solid white lines indicate a lane barrier between a regular
    use and a preferential use lane, such as a carpool lane. You must never change
    lanes over double solid white lines.
- id: 43
  category: safe_driving_rules
  question: When traffic lanes are referred to by number, which lane is the Number
    1 Lane?
  choices:
    A: The far right lane.
    B: The left (or fast) lane.
    C: The center left turn lane.
    D: The carpool lane only.
  answer: B
  explanation: Traffic lanes are often referred to by number. The left (or fast) lane
    is called the Number 1 Lane.
- id: 44
  category: safe_driving_rules
  question: What is the maximum distance you are permitted to drive in a center left
    turn lane?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: C
  explanation: You may only drive for 200 feet in the center left turn lane before
    making your turn.
- id: 45
  category: sharing_the_road
  question: When are you required to use a turnout area or lane to let other vehicles
    pass?
  choices:
    A: When you are driving slowly on a two-lane road and three or more vehicles are
      following you.
    B: When you are driving slowly on a two-lane road, passing is unsafe, and five
      or more vehicles are following you.
    C: Whenever you need to stop to check your navigation system.
    D: When you are driving on a freeway and want to exit.
  answer: B
  explanation: You must use a turnout area or lane to let other vehicles pass when
    you are driving slowly on a two-lane road, where passing is unsafe, and there
    are five or more vehicles following you.
- id: 46
  category: safe_driving_rules
  question: When driving slowly on a two-lane road where passing is unsafe, you must
    use a turnout area or lane to let other vehicles pass if you are being followed
    by at least how many vehicles?
  choices:
    A: Three
    B: Four
    C: Five
    D: Six
  answer: C
  explanation: According to the manual, you must use a turnout area or lane to let
    other vehicles pass when you are driving slowly on a two-lane road, passing is
    unsafe, and there are five or more vehicles following you.
- id: 47
  category: sharing_the_road
  question: When preparing to make a turn, you may legally drive in a bicycle lane
    for up to what distance before the intersection?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: C
  explanation: It is illegal to drive in a bicycle lane unless you are turning, in
    which case you may enter the bike lane within 200 feet of an intersection.
- id: 48
  category: sharing_the_road
  question: Which type of bicycle lane uses chevrons or diagonal markings to provide
    greater separation from traffic and on-street parking?
  choices:
    A: Separated bikeway
    B: Buffered bike lane
    C: Bicycle boulevard
    D: Shared roadway
  answer: B
  explanation: A buffered bike lane uses chevrons or diagonal markings to provide
    greater separation from traffic and on-street parking.
- id: 49
  category: signs_and_signals
  question: What must you do if you are stopped at a red arrow light and want to make
    a right turn?
  choices:
    A: Turn right after coming to a complete stop.
    B: Turn right only if there is no approaching traffic.
    C: Wait until the light changes to green before making your turn.
    D: Yield to pedestrians and then make your turn.
  answer: C
  explanation: You may not turn right if you are stopped at a red arrow light. You
    must wait until the light changes to green before making your turn.
- id: 50
  category: safe_driving_rules
  question: Is it legal to drive your vehicle in an area designated for public transit
    buses?
  choices:
    A: Yes, you may drive in a bus lane if traffic is heavy.
    B: Yes, but only to pass a slow-moving vehicle.
    C: No, it is always illegal to enter a bus lane.
    D: No, but you may cross a bus lane to make a right turn.
  answer: D
  explanation: It is illegal to drive, stop, park, or leave a vehicle in an area designated
    for public transit buses. However, you may cross a bus lane to make a right turn.
- id: 51
  category: defensive_driving
  question: Why should you keep your wheels pointed straight ahead while waiting to
    make a left turn?
  choices:
    A: It helps you accelerate faster when the light turns green.
    B: It prevents you from being pushed into oncoming traffic if you are hit from
      behind.
    C: It signals to other drivers that you are waiting for a gap in traffic.
    D: It reduces wear and tear on your vehicle's power steering system.
  answer: B
  explanation: You should keep your wheels pointed straight ahead until it is safe
    to start your turn. If your wheels are pointed to the left and a vehicle hits
    you from behind, you could be pushed into oncoming traffic.
- id: 52
  category: safe_driving_rules
  question: Under what circumstances may you legally make a left turn against a red
    light?
  choices:
    A: When turning from a one-way street onto a one-way street.
    B: When turning from a two-way street onto a one-way street.
    C: When turning from a one-way street onto a two-way street.
    D: You may never make a left turn against a red light.
  answer: A
  explanation: You may turn left against a red light when you are turning from a one-way
    street onto a one-way street, provided there is no sign prohibiting the turn.
- id: 53
  category: safe_driving_rules
  question: You should never make a U-turn when you cannot see clearly for at least
    what distance in each direction?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The manual states you must never make a U-turn when you cannot see
    clearly for 200 feet in each direction.
- id: 54
  category: safe_driving_rules
  question: Which of the following is a true statement regarding U-turns and fire
    stations?
  choices:
    A: You may use a fire station driveway to turn around if no fire trucks are present.
    B: You may make a U-turn in front of a fire station only during daylight hours.
    C: You may never use a fire station driveway to turn around.
    D: You may make a U-turn in a fire station driveway if you are driving an emergency
      vehicle.
  answer: C
  explanation: You must never make a U-turn in front of a fire station, and you should
    never use a fire station driveway to turn around.
- id: 55
  category: defensive_driving
  question: When stopping behind another vehicle at an intersection, how much space
    should you leave between your vehicle and the one in front of you?
  choices:
    A: Enough space to see their rear wheels.
    B: Exactly one car length.
    C: At least three seconds of following distance.
    D: Enough space to see their rear bumper.
  answer: A
  explanation: When braking and stopping behind a vehicle, you should leave enough
    space to see their rear wheels.
- id: 56
  category: safe_driving_rules
  question: When merging onto a highway, who has the right-of-way?
  choices:
    A: The vehicle entering the highway.
    B: Highway traffic.
    C: Whichever vehicle is traveling faster.
    D: The vehicle on the right.
  answer: B
  explanation: When merging, highway traffic has the right-of-way. You must merge
    into highway traffic when it is safe to do so.
- id: 57
  category: safe_driving_rules
  question: When exiting a highway, you should signal for approximately how many seconds
    before you exit?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: D
  explanation: To exit a highway safely, you should signal five seconds (approximately
    400 feet) before you exit.
- id: 58
  category: safe_driving_rules
  question: When preparing to make a turn at an intersection where there is no limit
    line, where should you stop your vehicle?
  choices:
    A: Before you enter the crosswalk.
    B: In the middle of the crosswalk.
    C: Just past the crosswalk.
    D: At the edge of the intersecting road.
  answer: A
  explanation: If there is no limit line, you must stop before you enter the crosswalk.
    If there is no crosswalk, stop before you enter the intersection.
- id: 59
  category: safe_driving_rules
  question: In a business district, where are you permitted to make a U-turn?
  choices:
    A: Anywhere, as long as no vehicles are approaching within 200 feet.
    B: Only at an intersection or on a divided highway where an opening is provided.
    C: Only in front of a fire station.
    D: U-turns are strictly prohibited everywhere in a business district.
  answer: B
  explanation: You may never make a U-turn in business districts, except at an intersection,
    or on a divided highway where an opening has been provided.
- id: 60
  category: safe_driving_rules
  question: How far in advance should you start signaling before making a right or
    left turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: When making a right or left turn, you should start signaling about
    100 feet before the turn.
- id: 61
  category: safe_driving_rules
  question: How far in advance should you signal before exiting a highway?
  choices:
    A: Three seconds (approximately 200 feet)
    B: Five seconds (approximately 400 feet)
    C: Ten seconds (approximately 800 feet)
    D: Only when you begin to turn the steering wheel
  answer: B
  explanation: The manual states that when in the proper lane, you should signal five
    seconds (approximately 400 feet) before you exit a highway.
- id: 62
  category: safe_driving_rules
  question: How much space do you need to safely merge, enter, or exit traffic on
    city streets?
  choices:
    A: A full block, which is about 300 feet
    B: Half a block, which is about 150 feet
    C: One-quarter of a block, which is about 75 feet
    D: Two full blocks, which is about 600 feet
  answer: B
  explanation: To merge, enter, or exit traffic on city streets, you need a space
    that is half a block, which is about 150 feet.
- id: 63
  category: defensive_driving
  question: When waiting to turn left, what should you do if an oncoming vehicle has
    its right turn signal on?
  choices:
    A: Proceed immediately because the vehicle is required to turn
    B: Honk your horn to ensure they see you before you turn
    C: Wait for the vehicle to start its turn before beginning your left turn
    D: Turn right instead to avoid a potential collision
  answer: C
  explanation: The manual advises not to assume an oncoming vehicle with its right
    turn signal on is turning before it reaches you. You should wait for the vehicle
    to start its turn before beginning your left turn.
- id: 64
  category: safe_driving_rules
  question: To safely pass another vehicle when approaching a hill or curve, the hill
    or curve should be at least how far ahead?
  choices:
    A: One-third of a mile
    B: One-half of a mile
    C: One-quarter of a mile
    D: One full mile
  answer: A
  explanation: To safely pass, the manual states that an approaching hill or curve
    should be at least one-third of a mile ahead.
- id: 65
  category: safe_driving_rules
  question: You must not pass another vehicle if you are within how many feet of an
    intersection, bridge, tunnel, or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Do not pass within 100 feet of an intersection, bridge, tunnel, railroad
    crossing, or other hazardous area.
- id: 66
  category: safe_driving_rules
  question: Under which of the following conditions are you permitted to pass a vehicle
    on the right?
  choices:
    A: When the vehicle ahead is driving below the speed limit
    B: When you can safely drive off the paved part of the road to pass
    C: When the driver ahead of you is turning left and you can safely pass on the
      right
    D: When you are on a two-lane road with oncoming traffic
  answer: C
  explanation: You may pass on the right only when the driver ahead of you is turning
    left and you can safely pass on the right, on a one-way street, or on an open
    highway with two or more lanes going in your direction.
- id: 67
  category: sharing_the_road
  question: If another vehicle is passing you, what should you do?
  choices:
    A: Speed up to prevent them from passing
    B: Move into the left lane
    C: Slow down drastically and pull onto the shoulder
    D: Maintain your lane position and your speed
  answer: D
  explanation: If a vehicle is passing you or signals that they plan on passing, allow
    the vehicle to pass by maintaining your lane position and your speed.
- id: 68
  category: safe_driving_rules
  question: When you have finished parallel parking, your vehicle should be parallel
    and within how many inches of the curb?
  choices:
    A: 12 inches
    B: 18 inches
    C: 24 inches
    D: 36 inches
  answer: B
  explanation: When straightening out during parallel parking, your vehicle should
    end up parallel and within 18 inches of the curb.
- id: 69
  category: safe_driving_rules
  question: How should you turn your front wheels when parked headed uphill next to
    a curb?
  choices:
    A: Turn your front wheels toward the curb (right)
    B: Turn your front wheels away from the curb (left)
    C: Keep your front wheels pointed straight ahead
    D: Turn your front wheels toward the shoulder of the road
  answer: B
  explanation: When parked headed uphill, turn your front wheels away from the curb
    (left-towards the center of the road) and let your vehicle roll back a few inches
    so the wheel gently touches the curb.
- id: 70
  category: signs_and_signals
  question: What does a yellow painted curb indicate?
  choices:
    A: Parking is allowed for a limited time only
    B: No stopping, standing, or parking at any time
    C: Stop only long enough to pick up or drop off passengers
    D: Load and unload passengers and freight
  answer: D
  explanation: A yellow curb means you may load and unload passengers and freight.
    You must not stop longer than the time posted, and drivers of noncommercial vehicles
    are usually required to stay with their vehicle.
- id: 71
  category: safe_driving_rules
  question: It is illegal to park your vehicle within how many feet of a fire hydrant
    or fire station driveway?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Never park or leave your vehicle within 15 feet of a fire hydrant or
    fire station driveway.
- id: 72
  category: penalties_and_points
  question: If you must stop on a freeway in an emergency, your vehicle may be removed
    if it is left standing for more than how many hours?
  choices:
    A: 2 hours
    B: 4 hours
    C: 12 hours
    D: 24 hours
  answer: B
  explanation: A vehicle that is stopped, parked, or left standing on a freeway for
    more than four hours may be removed.
- id: 73
  category: driver_responsibility
  question: During a law enforcement stop, what should you do to acknowledge that
    you see the officer?
  choices:
    A: Turn on your hazard lights
    B: Turn on your right turn signal
    C: Wave your hand out the window
    D: Tap your brakes repeatedly
  answer: B
  explanation: During a Law Enforcement Stop, you should turn on your right turn signal
    to acknowledge that you see the officer.
- id: 74
  category: driver_responsibility
  question: When pulled over by law enforcement, where should the driver and all passengers
    place their hands before the officer makes contact?
  choices:
    A: In their pockets
    B: In clear view
    C: On the ceiling of the vehicle
    D: Behind their backs
  answer: B
  explanation: The manual states that the driver and all passengers should place their
    hands in clear view before the officer makes contact with them.
- id: 75
  category: vehicle_information
  question: Which of the following is a recommended practice to maximize your fuel
    efficiency and lower emissions?
  choices:
    A: Accelerate and brake as quickly as possible
    B: Keep extra weight in your vehicle for better traction
    C: Speed up and slow down smoothly while driving at a steady speed
    D: Use premium gasoline regardless of your vehicle's requirements
  answer: C
  explanation: To maximize fuel efficiency and lower emissions, the manual recommends
    to speed up and slow down smoothly, drive at a steady speed, regularly inflate
    tires, get oil changes, and get rid of extra weight in your vehicle.
- id: 76
  category: driver_responsibility
  question: What must a law enforcement officer do before they begin questioning you
    related to a criminal investigation or traffic violation?
  choices:
    A: Ask for your permission to record the interaction
    B: State the reason for the traffic or pedestrian stop
    C: Request your immigration status
    D: Search your vehicle for weapons
  answer: B
  explanation: Law enforcement officers must state the reason for a traffic or pedestrian
    stop before they begin any questioning related to a criminal investigation or
    traffic violation, unless there is an imminent threat.
- id: 77
  category: driver_responsibility
  question: When stopped by law enforcement, which documents must the driver of the
    vehicle produce?
  choices:
    A: Driver's license, proof of insurance, and vehicle registration
    B: Driver's license, passport, and proof of insurance
    C: Vehicle registration, proof of insurance, and a secondary ID
    D: Driver's license and social security card
  answer: A
  explanation: The driver of a stopped vehicle must produce a driver's license, proof
    of insurance, and vehicle registration when stopped by law enforcement.
- id: 78
  category: driver_responsibility
  question: In California, who is legally permitted to ask you about your immigration
    status during a traffic stop?
  choices:
    A: Only state highway patrol officers
    B: Any local or state law enforcement officer
    C: Only federal law enforcement officers
    D: No law enforcement officer is ever allowed to ask
  answer: C
  explanation: In California, only federal law enforcement officers can ask you about
    your immigration status. California law prohibits state and local officers from
    asking drivers or passengers about their immigration status.
- id: 79
  category: driver_responsibility
  question: If you choose to record an interaction with law enforcement during a traffic
    stop, what should you avoid doing?
  choices:
    A: Making it clear immediately that you are recording
    B: Reaching into concealed areas to retrieve your device without permission
    C: Denying a request to unlock your cellular phone
    D: Recording the interaction in a public space
  answer: B
  explanation: You do not have a right to interfere with the officer's lawful duties,
    and you should not reach into concealed areas to retrieve your recording device
    without the officer's permission.
- id: 80
  category: signs_and_signals
  question: Under what condition are you permitted to make a right turn at a solid
    red traffic signal light?
  choices:
    A: Only if you have a green arrow pointing right
    B: Whenever there is no oncoming traffic, without stopping
    C: If there is no 'NO TURN ON RED' sign, after you stop and yield
    D: You are never permitted to turn right on a solid red light
  answer: C
  explanation: You can turn right at a red light if there is not a NO TURN ON RED
    sign posted, and you stop at the stop or limit line, yield for pedestrians, and
    turn when it is safe.
- id: 81
  category: signs_and_signals
  question: What does a red arrow traffic signal mean?
  choices:
    A: You may turn in the direction of the arrow after coming to a complete stop
    B: STOP, and do not turn at a red arrow
    C: Yield to oncoming traffic before turning
    D: The protected turning time is ending
  answer: B
  explanation: A red arrow means STOP. Do not turn at a red arrow. Remain stopped
    until a green traffic signal light or green arrow appears.
- id: 82
  category: signs_and_signals
  question: How should you react when approaching an intersection and the traffic
    signal changes to a solid yellow light?
  choices:
    A: Speed up to cross the intersection before it turns red
    B: Stop immediately wherever you are
    C: Stop if you can do so safely; otherwise, cautiously cross the intersection
    D: Treat it as a yield sign and proceed without stopping
  answer: C
  explanation: A yellow traffic signal light means CAUTION. The light is about to
    turn red. Stop if you can do so safely. If you cannot stop safely, cautiously
    cross the intersection.
- id: 83
  category: signs_and_signals
  question: What is the correct action to take at a flashing yellow traffic signal
    light?
  choices:
    A: Stop completely and wait for a green light
    B: Slow down, be alert, and proceed with caution without stopping
    C: Treat the intersection as a four-way stop
    D: Yield to all traffic on your right before proceeding
  answer: B
  explanation: A flashing yellow traffic signal light is a warning to PROCEED WITH
    CAUTION. Slow down and be alert. You do not need to stop.
- id: 84
  category: signs_and_signals
  question: What does a flashing yellow arrow indicate about turning?
  choices:
    A: Your turn is protected from other traffic
    B: You cannot turn in the direction of the arrow
    C: You can turn, but your turn is not protected; you must yield to oncoming traffic
    D: You must stop and wait for a solid green arrow
  answer: C
  explanation: A flashing yellow arrow means you can turn, but your turn is not protected
    from other traffic. Proceed to turn left after yielding to oncoming traffic and
    proceed with caution.
- id: 85
  category: signs_and_signals
  question: You have a solid green traffic light, but traffic is backed up into the
    intersection. What should you do?
  choices:
    A: Enter the intersection and wait for traffic to clear
    B: Honk your horn to encourage the vehicles to move
    C: Do not enter the intersection if you cannot get completely across before the
      light turns red
    D: Proceed slowly and weave through the stopped vehicles
  answer: C
  explanation: A green traffic signal light means GO, but you should not enter the
    intersection if you cannot get completely across before the traffic signal light
    turns red.
- id: 86
  category: signs_and_signals
  question: What must you do if you approach an intersection where the traffic light
    is not working?
  choices:
    A: Yield to traffic on the right and proceed
    B: Stop as if the intersection is controlled by STOP signs in all directions
    C: Slow down to 15 mph and proceed cautiously
    D: Wait for law enforcement to arrive and direct traffic
  answer: B
  explanation: When a traffic light is not working, stop as if the intersection is
    controlled by STOP signs in all directions. Then proceed cautiously when it is
    safe to do so.
- id: 87
  category: sharing_the_road
  question: If a pedestrian is crossing the street and the 'DON'T WALK' light begins
    flashing, what must drivers do?
  choices:
    A: Honk to warn the pedestrian to hurry
    B: Proceed through the crosswalk since the pedestrian's time is up
    C: Yield to the pedestrian, even if the DON'T WALK light is flashing
    D: Slowly drive around the pedestrian
  answer: C
  explanation: Drivers must yield to pedestrians, even if the DON'T WALK light is
    flashing.
- id: 88
  category: signs_and_signals
  question: Where must you make a full stop when approaching a STOP sign?
  choices:
    A: Just past the crosswalk so you can see traffic
    B: Before entering the crosswalk or at the limit line
    C: Only if there is oncoming traffic
    D: At least 20 feet before the intersection
  answer: B
  explanation: At a STOP sign, make a full stop before entering the crosswalk or at
    the limit line. If there is no limit line or crosswalk, stop before entering the
    intersection.
- id: 89
  category: vehicle_information
  question: Which of the following transactions can be completed at a DMV Kiosk?
  choices:
    A: Taking a written driver's knowledge test
    B: Submitting proof of insurance and completing vehicle registration renewal
    C: Applying for a first-time driver's license
    D: Paying a traffic ticket citation
  answer: B
  explanation: DMV Kiosks offer transactions such as completing your vehicle registration
    renewal, receiving a replacement registration card or sticker, submitting proof
    of insurance, filing for PNO, and obtaining your driver's or vehicle record.
- id: 90
  category: driver_responsibility
  question: During a traffic stop, what is a passenger's right regarding a request
    for identification?
  choices:
    A: Passengers are always legally required to provide identification immediately
    B: Passengers can decline the request, though under some circumstances they may
      be required to identify themselves
    C: Passengers must only provide identification if they are driving
    D: Passengers are never required to identify themselves under any circumstances
  answer: B
  explanation: An officer may request the names or identification of passengers. Passengers
    can decline that request, but under some circumstances the passengers may be required
    to identify themselves.
- id: 91
  category: signs_and_signals
  question: What does a 5-sided road sign indicate?
  choices:
    A: You are approaching a railroad crossing.
    B: You are near a school.
    C: You must yield the right-of-way.
    D: You are entering a divided highway.
  answer: B
  explanation: According to the manual, a 5-sided sign means you are near a school.
    You should drive slowly and stop for children in the crosswalk.
- id: 92
  category: signs_and_signals
  question: What does a yellow and black circular sign or an X-shaped sign warn you
    about?
  choices:
    A: A winding road ahead
    B: A pedestrian crossing
    C: A railroad crossing
    D: A wrong way entrance
  answer: C
  explanation: A yellow and black circular sign or X-shaped sign indicates that you
    are approaching a railroad crossing. You must look, listen, slow down, and prepare
    to stop.
- id: 93
  category: safe_driving_rules
  question: At a T-intersection without STOP or YIELD signs, who has the right-of-way?
  choices:
    A: Vehicles on the terminating road.
    B: The vehicle that is turning left.
    C: The vehicle on the right.
    D: Vehicles, bicyclists, and pedestrians on the through road.
  answer: D
  explanation: At T-intersections without STOP or YIELD signs, vehicles, bicyclists,
    and pedestrians on the through road (continuing to go straight) have the right-of-way.
- id: 94
  category: safe_driving_rules
  question: If you and another vehicle arrive at an intersection without STOP or YIELD
    signs at the exact same time, who must yield?
  choices:
    A: The vehicle on the left must yield to the vehicle on the right.
    B: The vehicle on the right must yield to the vehicle on the left.
    C: The larger vehicle has the right-of-way.
    D: The vehicle traveling faster has the right-of-way.
  answer: A
  explanation: If a vehicle, pedestrian, or bicyclist gets to the intersection at
    the same time as you, you must give the right-of-way to the vehicle, pedestrian,
    or bicyclist on your right.
- id: 95
  category: safe_driving_rules
  question: In which direction does traffic travel in a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a straight line
    D: Whichever direction has less traffic
  answer: B
  explanation: When using a roundabout, you must travel in a counterclockwise direction.
- id: 96
  category: safe_driving_rules
  question: What should you do if you miss your exit while driving in a roundabout?
  choices:
    A: Stop and carefully back up to your exit.
    B: Make a U-turn over the central island.
    C: Exit at the next available road and turn around.
    D: Continue around until you return to your exit.
  answer: D
  explanation: The manual states that if you miss your exit in a roundabout, you should
    continue around until you return to your exit.
- id: 97
  category: sharing_the_road
  question: Why is it dangerous and illegal to pass a vehicle stopped at a crosswalk?
  choices:
    A: The stopped vehicle might suddenly back up.
    B: You may not be able to see a pedestrian crossing the street.
    C: The stopped vehicle has the right-of-way to turn.
    D: It blocks the intersection for emergency vehicles.
  answer: B
  explanation: You should not pass a vehicle stopped at a crosswalk because you may
    not be able to see a pedestrian crossing the street.
- id: 98
  category: sharing_the_road
  question: What does it usually mean when a blind pedestrian pulls in their cane
    and steps away from the intersection?
  choices:
    A: They are waiting for you to honk your horn.
    B: They need you to stop and help them cross.
    C: This gesture usually means you may go.
    D: They are warning you of a hazard in the road.
  answer: C
  explanation: When a blind person pulls in their cane and steps away from the intersection,
    this gesture usually means you may go.
- id: 99
  category: safe_driving_rules
  question: If two vehicles meet on a steep, narrow mountain road and neither can
    pass, which vehicle has the right-of-way?
  choices:
    A: The vehicle facing downhill.
    B: The vehicle facing uphill.
    C: The vehicle that arrived last.
    D: The heavier vehicle.
  answer: B
  explanation: If two vehicles meet on a steep narrow road and neither vehicle can
    pass, the vehicle facing uphill has the right-of-way. The vehicle facing downhill
    should back up.
- id: 100
  category: sharing_the_road
  question: How can you tell if you are driving in a large truck's blind spot (No
    Zone)?
  choices:
    A: If you cannot see the truck's side mirrors, the truck driver cannot see you.
    B: If you are driving directly in front of the truck.
    C: If you can see the truck's license plate.
    D: If you are driving on the left side of the truck.
  answer: A
  explanation: Large vehicles have large blind spots called No Zones. If you cannot
    see the truck’s side mirrors, the truck driver cannot see you.
- id: 101
  category: sharing_the_road
  question: Approximately how many feet can it take for a large vehicle traveling
    at 55 mph to come to a complete stop?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 400 feet
  answer: D
  explanation: A large vehicle traveling at 55 mph can take up to 400 feet to stop,
    compared to an average passenger vehicle which can stop within 300 feet at the
    same speed.
- id: 102
  category: sharing_the_road
  question: Why do large vehicles and truck drivers often swing wide to complete a
    turn?
  choices:
    A: Because they need to maintain a high speed while turning.
    B: Because the rear wheels follow a shorter path than the front wheels.
    C: Because their steering wheels cannot turn as sharply as passenger cars.
    D: Because they are required by law to use two lanes when turning.
  answer: B
  explanation: When a vehicle turns, the rear wheels follow a shorter path than the
    front wheels. The longer the vehicle, the greater the difference, which is why
    large vehicles must often swing wide to complete a turn.
- id: 103
  category: sharing_the_road
  question: When passing a large vehicle or truck, on which side should you always
    pass?
  choices:
    A: On the right side.
    B: On the left side.
    C: On the shoulder.
    D: Whichever side has a wider lane.
  answer: B
  explanation: 'The manual explicitly states: ''Always pass a large vehicle on the
    left side. After you pass the large vehicle or truck, move ahead of it.'''
- id: 104
  category: sharing_the_road
  question: Under what conditions is it legal to drive through a pedestrian safety
    zone?
  choices:
    A: When no pedestrians are present.
    B: If you are making a right turn.
    C: When passing a stopped bus.
    D: Under no condition.
  answer: D
  explanation: 'Safety zones are spaces set aside for pedestrians waiting for buses,
    streetcars, and trolleys. The manual states: ''Do not drive through a safety zone
    under any condition.'''
- id: 105
  category: sharing_the_road
  question: What is the maximum speed limit when passing a bus, streetcar, or trolley
    that is stopped at a safety zone or traffic light?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: A
  explanation: When a bus, streetcar, or trolley is stopped at a safety zone or traffic
    light, you may pass at no more than 10 mph.
- id: 106
  category: safe_driving_rules
  question: What is the recommended following distance when driving behind a motorcyclist?
  choices:
    A: One-second
    B: Two-second
    C: Three-second
    D: Four-second
  answer: C
  explanation: Allow a safe three-second following distance. This space will help
    you avoid hitting a motorcyclist if they brake suddenly or fall.
- id: 107
  category: safe_driving_rules
  question: What should you do if you are in an intersection when you see an emergency
    vehicle approaching with its siren and red lights on?
  choices:
    A: Stop immediately in the middle of the intersection
    B: Pull over to the right edge of the intersection and stop
    C: Continue through the intersection, then drive to the right as soon as it is
      safe and stop
    D: Speed up to clear the intersection before the emergency vehicle arrives
  answer: C
  explanation: If you are in an intersection when you see an emergency vehicle, continue
    through the intersection. Drive to the right as soon as it is safe and stop.
- id: 108
  category: safe_driving_rules
  question: It is against the law to follow within how many feet of an emergency vehicle
    when its siren or flashing lights are on?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: It is against the law to follow within 300 feet of any fire engine,
    law enforcement vehicle, ambulance, or other emergency vehicle when their siren
    or flashing lights are on.
- id: 109
  category: signs_and_signals
  question: What marking indicates a slow-moving vehicle, such as a road maintenance
    vehicle, that usually travels at 25 mph or less?
  choices:
    A: A flashing yellow light on the roof
    B: An orange and red triangle on the back
    C: A white diamond painted on the tailgate
    D: A red and white striped bumper sticker
  answer: B
  explanation: Some slow-moving vehicles have an orange and red triangle on their
    back, such as road maintenance vehicles, which usually travel at 25 mph or less.
- id: 110
  category: safe_driving_rules
  question: 'Neighborhood Electric Vehicles (NEVs) and Low-speed Vehicles (LSVs) are
    restricted from operating on roads where the speed limit is greater than:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: NEVs and LSVs reach a maximum speed of 25 mph. They are restricted
    from roads where the speed limit is greater than 35 mph.
- id: 111
  category: driver_responsibility
  question: According to bicyclist responsibilities, a bicyclist must wear a helmet
    if they are under what age?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 14 years old
  answer: B
  explanation: As a bicyclist, you must wear a helmet (if under 18 years old).
- id: 112
  category: vehicle_information
  question: When bicycling at night, a bicycle must be equipped with a front lamp
    featuring a white light visible from what distance?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: When it is dark out, your bicycle must have a front lamp with a white
    light visible from 300 feet.
- id: 113
  category: sharing_the_road
  question: If you cannot change lanes to safely pass a bicyclist, what is the minimum
    distance you must allow between your vehicle and the bicyclist?
  choices:
    A: Two feet
    B: Three feet
    C: Four feet
    D: Five feet
  answer: B
  explanation: When you cannot change lanes to pass a bicyclist, allow at least three
    feet between your vehicle and the bicyclist.
- id: 114
  category: safe_driving_rules
  question: When preparing to make a turn, you may enter a bike lane no more than
    how many feet before starting the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: C
  explanation: Enter a bike lane no more than 200 feet before starting a turn.
- id: 115
  category: penalties_and_points
  question: What is the potential penalty for a driver convicted of assaulting a highway
    worker?
  choices:
    A: A fine of up to $500 and 30 days in jail
    B: A fine of up to $1,000 and 6 months in jail
    C: A fine of up to $2,000 and imprisonment for up to one year
    D: A fine of up to $5,000 and license revocation
  answer: C
  explanation: Anyone convicted of assaulting a highway worker faces fines of up to
    $2,000 and imprisonment for up to one year.
- id: 116
  category: sharing_the_road
  question: 'Bicyclists traveling slower than the flow of traffic must ride as close
    as possible to the right curb or edge of the road, EXCEPT when:'
  choices:
    A: They are riding on a two-lane highway
    B: They are preparing to make a left turn
    C: They are approaching an intersection with a stop sign
    D: They are riding in a residential neighborhood
  answer: B
  explanation: Bicyclists traveling slower than the flow of traffic must ride as close
    as possible to the right curb or edge of the road, unless passing, preparing to
    make a left turn, avoiding a hazard, etc.
- id: 117
  category: penalties_and_points
  question: Under what condition are traffic fines doubled in highway construction
    or maintenance zones?
  choices:
    A: Only during nighttime hours
    B: When workers are present
    C: When the speed limit is reduced by more than 15 mph
    D: When heavy machinery is operating on the shoulder
  answer: B
  explanation: Fines are also doubled in highway construction or maintenance zones
    when workers are present.
- id: 118
  category: sharing_the_road
  question: Which of the following statements is true regarding sharing the road with
    motorcycles?
  choices:
    A: It is illegal for motorcycles to share lanes with other vehicles
    B: You should try to pass a motorcycle in the same lane to save space
    C: It is legal to share lanes with motorcycles, which is known as lane splitting
    D: Motorcycles are required to ride on the shoulder during heavy traffic
  answer: C
  explanation: Whenever possible, give a motorcycle the full lane. It is legal to
    share lanes with motorcycles, this is known as lane splitting.
- id: 119
  category: safe_driving_rules
  question: What is the penalty for failing to stop for a school bus with flashing
    red lights?
  choices:
    A: A fine of up to $500 and a 6-month license suspension.
    B: A fine of up to $1,000 and your driving privilege could be suspended for one
      year.
    C: A warning for the first offense.
    D: 2 points on your driver's record and a $250 fine.
  answer: B
  explanation: If you fail to stop for a school bus with flashing red lights, you
    may be fined up to $1,000 and your driving privilege could be suspended for one
    year.
- id: 120
  category: safe_driving_rules
  question: If you are towing a trailer on a highway with four lanes in your direction
    and no marked slow lanes, which lanes may you drive in?
  choices:
    A: Any lane as long as you drive the speed limit.
    B: Only the far-left lane.
    C: The two lanes closest to the right edge of the road.
    D: The two center lanes.
  answer: C
  explanation: When towing a vehicle or trailer on a road with four or more lanes
    in your direction and no marked lanes, you may only drive in the two lanes closest
    to the right edge of the road.
- id: 121
  category: safe_driving_rules
  question: What is the speed limit for a blind intersection?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: An intersection is considered blind if it has no stop signs at any
    corner and your view is blocked. The speed limit for a blind intersection is 15
    mph.
- id: 122
  category: vehicle_information
  question: If cargo extends more than 4 feet from the back-rear bumper of your vehicle
    during the day, what must be displayed?
  choices:
    A: A 12-inch red or fluorescent orange square flag.
    B: Two red lights.
    C: A yellow flashing beacon.
    D: A 'Wide Load' sign.
  answer: A
  explanation: Cargo that extends more than 4 feet from the back-rear bumper of the
    vehicle must display a 12-inch red or fluorescent orange square flag. At night,
    it must be marked with two red lights.
- id: 123
  category: safe_driving_rules
  question: When a crossing device or person warns you that a train is coming, how
    far from the nearest track must you stop?
  choices:
    A: At least 5 feet
    B: At least 10 feet
    C: At least 15 feet
    D: At least 25 feet
  answer: C
  explanation: When the crossing devices or a person warns you a train is coming,
    you must stop at least 15 feet from the nearest track.
- id: 124
  category: penalties_and_points
  question: As an adult, your license may be suspended if your driver's record shows
    which of the following point totals?
  choices:
    A: 2 points in 12 months
    B: 3 points in 24 months
    C: 4 points in 12 months
    D: 5 points in 36 months
  answer: C
  explanation: As an adult, your license may be suspended if your driver's record
    shows 4 points in 12 months, 6 points in 24 months, or 8 points in 36 months.
- id: 125
  category: penalties_and_points
  question: What is the penalty for a person convicted of manslaughter resulting from
    evading law enforcement during a pursuit?
  choices:
    A: Imprisonment in a county jail for one year or less.
    B: Imprisonment in a state prison for up to seven years.
    C: Imprisonment in a state prison for a minimum of 4 to 10 years.
    D: A $10,000 fine and permanent license revocation.
  answer: C
  explanation: A person convicted of manslaughter resulting from evading law enforcement
    during a pursuit is subject to imprisonment in a state prison for a minimum of
    4 to 10 years.
- id: 126
  category: penalties_and_points
  question: What may happen if an unlicensed person is caught driving your vehicle?
  choices:
    A: Your vehicle may be impounded for 30 days.
    B: You will receive 2 points on your driving record.
    C: Your vehicle will be confiscated permanently.
    D: You will be required to attend Traffic Violator School.
  answer: A
  explanation: According to the manual, if an unlicensed person is caught driving
    your vehicle, it may be impounded for 30 days.
- id: 127
  category: driver_responsibility
  question: How often can you attend a traffic violator school to have a one-point
    violation not reported to your insurance company?
  choices:
    A: Once in any 12-month period.
    B: Once in any 18-month period.
    C: Once in any 24-month period.
    D: Once in any 36-month period.
  answer: B
  explanation: If you are given a one-point traffic violation, the judge may offer
    you the choice to attend a traffic violator school. You can do this once in any
    18-month period.
- id: 128
  category: vehicle_information
  question: Where are you permitted to affix an electronic toll payment device on
    your windshield?
  choices:
    A: A 7-inch square on the lower corner of the driver's side window.
    B: A 5-inch square located in the center uppermost portion of your windshield.
    C: Anywhere on the passenger side of the windshield.
    D: Hanging directly from the rearview mirror.
  answer: B
  explanation: Objects may only be affixed in specific locations, including a 5-inch
    square located in the center uppermost portion of your windshield for an electronic
    toll payment device.
- id: 129
  category: driver_responsibility
  question: What is the punishment for dumping or abandoning animals on a highway?
  choices:
    A: A fine of up to $500.
    B: A fine of up to $1,000, six months in jail, or both.
    C: Mandatory community service and a $250 fine.
    D: A warning and 1 point on your driver's record.
  answer: B
  explanation: You must not dump or abandon animals on a highway. This crime is punishable
    by a fine of up to $1,000, six months in jail, or both.
- id: 130
  category: sharing_the_road
  question: What does a diamond-shaped sign on a truck indicate?
  choices:
    A: The truck is carrying an oversized load.
    B: The truck is traveling at a slow speed.
    C: The truck's load may be dangerous (gas, explosives, etc.).
    D: The truck is making frequent stops.
  answer: C
  explanation: A diamond-shaped sign on a truck means that the truck's load may be
    dangerous (gas, explosives, etc.). Vehicles with these signs must stop before
    crossing railroad tracks.
- id: 131
  category: penalties_and_points
  question: What happens if a minor gets two at-fault collisions or traffic violation
    convictions within the first 12 months of obtaining their license?
  choices:
    A: Their license is suspended for 6 months.
    B: They cannot drive for 30 days unless a licensed adult, at least 25 years old,
      rides with them.
    C: Their license is revoked until they turn 18.
    D: They must pay a fine and retake the driving test.
  answer: B
  explanation: According to the manual, if a minor has two at-fault collisions, two
    traffic violation convictions, or one of each, they cannot drive for 30 days unless
    a licensed adult, at least 25 years old, rides with them.
- id: 132
  category: alcohol_drugs_health
  question: 'If you are 15-20 years old and convicted of using alcohol or a controlled
    substance, the court will order the DMV to:'
  choices:
    A: Suspend your driving privilege for one year or delay your eligibility to apply
      for a license.
    B: Revoke your license permanently.
    C: Require you to install an ignition interlock device.
    D: Place you on probation for 6 months.
  answer: A
  explanation: The manual states that for a conviction of using alcohol or a controlled
    substance between ages 15-20, the court will order DMV to suspend your driving
    privilege for one year or delay your eligibility to apply for a driver's license.
- id: 133
  category: driver_responsibility
  question: If you receive a mailed notice that an action is being taken against your
    driving privilege, how many days do you have to request an administrative hearing?
  choices:
    A: 10 days from the date mailed
    B: 14 days from the date mailed
    C: 30 days from the date mailed
    D: 60 days from the date mailed
  answer: B
  explanation: You must request a hearing within 10 days of being served or 14 days
    from the date the notice is mailed. If you do not make a timely request, your
    right to a hearing will be lost.
- id: 134
  category: license_system
  question: Most information on your driver's record is available to the public. Which
    of the following is kept confidential?
  choices:
    A: Traffic violation convictions
    B: At-fault collisions
    C: Your physical or mental conditions
    D: License suspension history
  answer: C
  explanation: Most information in your driver's record is available to the public,
    except physical or mental conditions, address, and social security number.
- id: 135
  category: safe_driving_rules
  question: 'To give yourself time to react and avoid last-minute moves, you should
    scan the road at least:'
  choices:
    A: 5 seconds ahead of your vehicle
    B: 10 seconds ahead of your vehicle
    C: 15 seconds ahead of your vehicle
    D: 20 seconds ahead of your vehicle
  answer: B
  explanation: To give yourself time to react, avoid last minute moves and hazards,
    always keep your eyes moving and scan the road at least 10 seconds ahead of your
    vehicle.
- id: 136
  category: defensive_driving
  question: If another vehicle merges in front of you too closely, what should you
    do to create space?
  choices:
    A: Honk your horn to warn the driver
    B: Brake suddenly
    C: Swerve into the adjacent lane
    D: Take your foot off the accelerator
  answer: D
  explanation: If a vehicle merges in front of you too closely, take your foot off
    the accelerator. This creates space between you and the vehicle ahead.
- id: 137
  category: defensive_driving
  question: What is the best way to handle a tailgater behind your vehicle?
  choices:
    A: Tap your brakes lightly to warn them
    B: Speed up to increase the distance between you
    C: Maintain your course and speed, then merge right when safe to let them pass
    D: Turn on your hazard lights and stop
  answer: C
  explanation: When a tailgater is behind you, maintain your course and speed. Then,
    when safe to do so, merge right to change into another lane and allow the tailgater
    to pass.
- id: 138
  category: safe_driving_rules
  question: What is the proper way to check your blind spots before changing lanes?
  choices:
    A: Look into your rearview mirror for 3 seconds
    B: Turn your whole body to look out the rear window
    C: Look over your right and left shoulders out of your side windows
    D: Rely solely on your side mirrors
  answer: C
  explanation: To check your blind spots, look over your right and left shoulders
    out of your side windows. Only turn your head when you look; do not turn your
    whole body or steering wheel.
- id: 139
  category: safe_driving_rules
  question: If an oncoming vehicle's headlights are too bright at night, where should
    you look?
  choices:
    A: Directly into the oncoming headlights
    B: Toward the right edge of your lane
    C: Toward the center line of the road
    D: At your rearview mirror
  answer: B
  explanation: If another vehicle's lights are too bright, do not look directly into
    the oncoming headlights. Instead, look toward the right edge of your lane.
- id: 140
  category: safe_driving_rules
  question: Which lights should you use when driving in the rain?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: When it is raining, use your low-beam headlights. Do not drive using
    only your parking lights.
- id: 141
  category: vehicle_information
  question: If your vehicle starts to skid on a slippery surface, what is the first
    step you should take?
  choices:
    A: Slam on the brakes immediately
    B: Slowly remove your foot from the accelerator
    C: Turn the steering wheel in the opposite direction of the skid
    D: Shift into neutral
  answer: B
  explanation: If you start to skid on a slippery surface, the first step is to slowly
    remove your foot from the accelerator. You should also not use the brakes.
- id: 142
  category: defensive_driving
  question: When recovering from a slippery surface skid, in which direction should
    you turn the steering wheel?
  choices:
    A: In the direction of the skid
    B: In the opposite direction of the skid
    C: Keep the steering wheel perfectly straight
    D: Rapidly back and forth
  answer: A
  explanation: If you start to skid, you should slowly remove your foot from the accelerator,
    not use the brakes, and turn the steering wheel in the direction of the skid.
- id: 143
  category: license_system
  question: If you are a minor with a restricted or suspended license, what happens
    when you turn 18 years old?
  choices:
    A: All restrictions and suspensions are immediately erased.
    B: Your driving record is completely cleared.
    C: Turning 18 does not erase or end existing restrictions, suspensions, or probation
      sentences.
    D: You must retake the written and driving tests.
  answer: C
  explanation: 'The manual explicitly notes: Turning 18 years old does not erase or
    end existing restrictions, suspensions, or probation sentences.'
- id: 144
  category: defensive_driving
  question: What should you do if a vehicle with only one light is driving toward
    you at night?
  choices:
    A: Flash your high beams to warn them
    B: Drive as far to the right as possible
    C: Move toward the center line to give them room
    D: Turn on your hazard lights
  answer: B
  explanation: When a vehicle with one light drives toward you, drive as far to the
    right as possible. It could be a bicyclist, motorcyclist, or vehicle with a missing
    headlight.
- id: 145
  category: vehicle_information
  question: What is the most common cause of a locked wheel skid?
  choices:
    A: Driving over a patch of black ice
    B: Accelerating too quickly on wet pavement
    C: Braking too hard when you are going too fast
    D: Turning the steering wheel too sharply
  answer: C
  explanation: A locked wheel skid is usually caused by braking too hard when you
    are going too fast.
- id: 146
  category: vehicle_information
  question: If your vehicle is equipped with a four-wheel antilock braking system
    (ABS) and you get into a locked wheel skid, what should you do?
  choices:
    A: Pump the brakes rapidly.
    B: Apply firm pressure on the brake pedal.
    C: Remove your foot from the brake pedal completely.
    D: Use your emergency brake to stop.
  answer: B
  explanation: According to the manual, to get out of a locked wheel skid if your
    vehicle is equipped with a four-wheel antilock braking system (ABS), you should
    apply firm pressure on the brake pedal.
- id: 147
  category: vehicle_information
  question: If your brakes get wet, how can you safely dry them?
  choices:
    A: Lightly press the accelerator and brake pedals at the same time.
    B: Pump the brake pedal rapidly for one minute.
    C: Shift into a lower gear and coast until they dry.
    D: Pull over and wait for the sun to dry them.
  answer: A
  explanation: 'The manual states: ''If your brakes get wet, you can dry them by lightly
    pressing the accelerator and brake pedals at the same time. Only do this until
    the brakes dry.'''
- id: 148
  category: safe_driving_rules
  question: How should you adjust your speed when driving on a road with packed snow?
  choices:
    A: Reduce your speed by 5 to 10 mph.
    B: Reduce your speed to no more than 5 mph.
    C: Reduce your speed by half.
    D: Maintain your normal speed but increase your following distance.
  answer: C
  explanation: When adjusting your speed for different conditions, the manual specifies
    that on packed snow, you should reduce your speed by half.
- id: 149
  category: defensive_driving
  question: Which of the following areas on the road tend to freeze before the rest
    of the road?
  choices:
    A: Intersections.
    B: Bridges and overpasses.
    C: Tunnels.
    D: Multi-lane highways.
  answer: B
  explanation: The manual warns that bridges and overpasses tend to freeze before
    the rest of the road and can have icy spots.
- id: 150
  category: safe_driving_rules
  question: 'In a heavy rainstorm or snowstorm, if you cannot see farther than 100
    feet in front of your vehicle, it is not safe to drive faster than:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 30 mph
    D: 45 mph
  answer: C
  explanation: The manual states that if you cannot see farther than 100 feet in a
    heavy rainstorm or snowstorm, it is not safe to drive faster than 30 mph.
- id: 151
  category: defensive_driving
  question: If your vehicle starts to hydroplane, what is the correct action to take?
  choices:
    A: Apply the brakes firmly.
    B: Steer sharply in the direction of the skid.
    C: Slow down gradually and do not use the brakes.
    D: Accelerate slightly to regain traction.
  answer: C
  explanation: If your vehicle starts to hydroplane, you should slow down gradually
    and do not use the brakes, as sudden braking may cause you to lose control.
- id: 152
  category: defensive_driving
  question: What is the first step you should take if your vehicle gets stuck in the
    snow or mud?
  choices:
    A: Shift into a high gear and spin the wheels.
    B: Shift into a low gear and keep the front wheels straight.
    C: Put boards or tree branches under the tires while moving.
    D: Turn the steering wheel sharply from left to right.
  answer: B
  explanation: The first step listed in the manual for getting unstuck from snow or
    mud is to shift into a low gear and keep the front wheels straight.
- id: 153
  category: defensive_driving
  question: When driving in high winds, why should you avoid using cruise control?
  choices:
    A: It drains the vehicle's battery faster.
    B: It prevents you from maintaining maximum control of the accelerator if a gust
      occurs.
    C: It causes the steering wheel to lock.
    D: It automatically applies the brakes during strong gusts.
  answer: B
  explanation: The manual advises not to use cruise control in high winds so that
    you can maintain maximum control of the accelerator if a gust occurs.
- id: 154
  category: safe_driving_rules
  question: If you must drive in heavy fog or smoke, which lights should you use?
  choices:
    A: High-beam headlights.
    B: Only your parking or fog lights.
    C: Low-beam headlights.
    D: Emergency flashers only.
  answer: C
  explanation: When driving in heavy fog or smoke, you should use your low-beam headlights.
    High-beam headlights will reflect back and cause glare, and you should never drive
    using only your parking or fog lights.
- id: 155
  category: sharing_the_road
  question: What should you do when a law enforcement officer conducts a traffic break
    by slowly weaving across lanes?
  choices:
    A: Speed up to pass the patrol vehicle.
    B: Turn on your emergency flashers to warn other drivers.
    C: Brake suddenly to stop immediately.
    D: Move to the shoulder and stop your vehicle.
  answer: B
  explanation: During a law enforcement traffic break, you should turn on your emergency
    flashers to warn other drivers and slowly decrease your speed.
- id: 156
  category: penalties_and_points
  question: 'You can get a ticket if a passenger in your vehicle is not wearing a
    seat belt and they are under the age of:'
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 14 years old
  answer: A
  explanation: 'The manual states: ''If your passenger is under 16 years old, you
    can also get a ticket if they are not wearing their seat belt.'''
- id: 157
  category: driver_responsibility
  question: How should a pregnant woman properly wear a seat belt?
  choices:
    A: With the lap belt high across the abdomen.
    B: With the lap belt as low as possible under the abdomen.
    C: Without the shoulder strap.
    D: With the shoulder strap behind her back.
  answer: B
  explanation: If you are pregnant, the manual instructs to wear the lap belt as low
    as possible under your abdomen, and place the shoulder strap between your breasts
    and to the side of your abdomen’s bulge.
- id: 158
  category: safe_driving_rules
  question: 'A child must be secured in a rear-facing child passenger restraint system
    if they are under 2 years old, under 3 feet 4 inches tall, and weigh less than:'
  choices:
    A: 30 pounds
    B: 40 pounds
    C: 50 pounds
    D: 60 pounds
  answer: B
  explanation: Children who are under 2 years old, under 40 pounds, and under 3 feet
    4 inches tall must be secured in a rear-facing child passenger restraint system.
- id: 159
  category: safe_driving_rules
  question: Under what condition may a child in a rear-facing child passenger restraint
    system ride in the front seat of an airbag-equipped vehicle?
  choices:
    A: If the child is over 1 year old.
    B: If all rear seats are occupied by other children.
    C: If the vehicle has no rear seat.
    D: They may never ride in the front seat of an airbag-equipped vehicle.
  answer: D
  explanation: 'The manual explicitly notes: ''A child in a rear-facing child passenger
    restraint system may not ride in the front seat of an airbag-equipped vehicle.'''
- id: 160
  category: safe_driving_rules
  question: At what age or height is a child allowed to use a properly secured safety
    belt that meets federal standards instead of a child passenger restraint system?
  choices:
    A: 6 years old or at least 4 feet 5 inches tall.
    B: 7 years old or at least 4 feet 7 inches tall.
    C: 8 years old or at least 4 feet 9 inches tall.
    D: 9 years old or at least 5 feet tall.
  answer: C
  explanation: Children who are 8 years old or older, or at least 4 feet 9 inches
    tall, may use a properly secured safety belt that meets federal standards.
- id: 161
  category: vehicle_information
  question: How far should you sit from the air bag cover to maintain safety while
    driving?
  choices:
    A: At least 5 inches
    B: At least 10 inches
    C: At least 12 inches
    D: At least 15 inches
  answer: B
  explanation: The manual states to ride at least 10 inches from the airbag cover,
    measured from the center of the steering wheel to your breastbone, as long as
    you can maintain full control of your vehicle.
- id: 162
  category: driver_responsibility
  question: 'It is illegal to leave a child who is six years old or younger unattended
    in a vehicle unless they are supervised by a person who is at least:'
  choices:
    A: 10 years old
    B: 12 years old
    C: 14 years old
    D: 16 years old
  answer: B
  explanation: The manual specifies that it is illegal to leave a child who is six
    years old or younger unattended in a vehicle, but a child may be left under the
    supervision of a person who is at least 12 years old.
- id: 163
  category: safe_driving_rules
  question: What is California's Basic Speed Law?
  choices:
    A: You must always drive at the posted speed limit.
    B: You may never drive faster than is safe for the current road conditions.
    C: You must drive 5 mph below the posted speed limit in bad weather.
    D: You may exceed the speed limit by 5 mph to pass another vehicle safely.
  answer: B
  explanation: In California, you may never drive faster than is safe for the current
    road conditions. This is known as the Basic Speed Law.
- id: 164
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit on a two-lane
    undivided highway in California?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: A
  explanation: The manual states that unless otherwise posted, the speed limit is
    55 mph on a two-lane undivided highway and for vehicles towing trailers.
- id: 165
  category: defensive_driving
  question: If you are on a two-lane road with an oncoming vehicle to your left and
    a bicyclist ahead to your right, what is the safest way to handle the situation?
  choices:
    A: Speed up to pass the bicyclist before the oncoming vehicle arrives.
    B: Drive exactly between the oncoming vehicle and the bicyclist.
    C: Honk your horn so the bicyclist moves off the road.
    D: Slow down and let the oncoming vehicle pass, then move to the left to pass
      the bicyclist.
  answer: D
  explanation: Instead of driving between the vehicle and the bicyclist, take one
    danger at a time. Slow down and let the oncoming vehicle pass, then move to the
    left to allow plenty of space (at least three feet) to pass the bicyclist.
- id: 166
  category: defensive_driving
  question: Which of the following should you do if you experience a tire blowout?
  choices:
    A: Slam on the brakes immediately to stop the vehicle.
    B: Abruptly remove your foot from the accelerator.
    C: Hold the steering wheel with both hands and gradually release the accelerator.
    D: Turn the steering wheel sharply toward the shoulder of the road.
  answer: C
  explanation: If you have a tire blowout, you should hold the steering wheel with
    both hands, maintain your speed if possible, and gradually release the accelerator.
    Suddenly braking or abruptly removing your foot from the accelerator can result
    in a loss of control.
- id: 167
  category: defensive_driving
  question: If your wheels drift off the pavement, what is the first step you should
    take?
  choices:
    A: Grip the steering wheel firmly.
    B: Brake hard to stop the vehicle.
    C: Pull the steering wheel sharply to the left.
    D: Accelerate to get back onto the pavement quickly.
  answer: A
  explanation: If your wheels drift off the pavement, the first step is to grip the
    steering wheel firmly, followed by removing your foot from the accelerator and
    braking gently.
- id: 168
  category: vehicle_information
  question: What should you do if you are driving in extreme heat to prevent or handle
    overheating conditions?
  choices:
    A: Turn on the heater to draw heat away from the engine.
    B: Turn off the air conditioner.
    C: Drive at high speeds to increase airflow to the radiator.
    D: Slightly open your windows to keep them from fogging up.
  answer: B
  explanation: In extreme heat, you should watch the temperature gauge, avoid driving
    at high speeds for long periods, and turn off the air conditioner.
- id: 169
  category: safe_driving_rules
  question: If your vehicle stops working on the freeway and you must get out, from
    which side should you exit?
  choices:
    A: The left side, facing traffic.
    B: The right side, away from traffic.
    C: The driver's side door, regardless of where you are parked.
    D: The rear hatch or trunk area.
  answer: B
  explanation: If your vehicle becomes disabled on the freeway, you should safely
    pull over to the right shoulder and exit on the right side so you are away from
    traffic if you must get out of the vehicle.
- id: 170
  category: driver_responsibility
  question: Which of the following services will the California Highway Patrol Freeway
    Service Patrol (FSP) provide for free during commute times?
  choices:
    A: Tow your vehicle to a private repair service.
    B: Recommend a good auto body shop.
    C: Tow a disabled motorcycle.
    D: Jump start your vehicle if the battery is dead.
  answer: D
  explanation: The FSP will jump start your vehicle if the battery is dead, provide
    a gallon of gas, refill your radiator, change a flat tire, or report a collision.
    They will not tow to a private repair service, recommend shops, or tow motorcycles.
- id: 171
  category: defensive_driving
  question: If your vehicle stalls on a railroad track and a train is approaching
    with warning lights flashing, what should you do immediately?
  choices:
    A: Stay in the vehicle and call 911.
    B: Exit the vehicle and run diagonally away from the tracks in the direction the
      train is coming from.
    C: Exit the vehicle and run in the same direction the train is traveling.
    D: Try to push the vehicle off the tracks before the train arrives.
  answer: B
  explanation: If a train is approaching and warning lights are flashing, you must
    immediately exit your vehicle, run away from the tracks diagonally in the direction
    the train is coming from, and then call 911.
- id: 172
  category: safe_driving_rules
  question: What is the legal requirement for adult drivers using a cell phone while
    driving?
  choices:
    A: They may hold the phone as long as they are on a voice call.
    B: They must only use the cell phone in hands-free mode.
    C: They may text if the vehicle is moving under 10 mph.
    D: They are completely prohibited from using a cell phone, even in hands-free
      mode.
  answer: B
  explanation: Driving while using a handheld cell phone is unsafe and illegal. Adult
    drivers should only use a cell phone in hands-free mode when necessary.
- id: 173
  category: safe_driving_rules
  question: Under what circumstance is a minor allowed to use a cell phone while driving?
  choices:
    A: When using a hands-free device.
    B: When stopped at a red light.
    C: To make a call for emergency assistance.
    D: When communicating with a parent or guardian.
  answer: C
  explanation: It is against the law for a minor to use a cell phone or electronic
    wireless device while driving, with the exception that minors may use a cell phone
    to make a call for emergency assistance.
- id: 174
  category: alcohol_drugs_health
  question: Which of the following is a symptom of carbon monoxide poisoning?
  choices:
    A: Excessive sweating
    B: Ringing in the ears
    C: Blurred vision
    D: Muscle cramps
  answer: B
  explanation: Symptoms of carbon monoxide poisoning include tiredness, yawning, dizziness,
    nausea, headache, and ringing in the ears.
- id: 175
  category: penalties_and_points
  question: What happens if you refuse to take a blood or urine test when suspected
    of driving under the influence?
  choices:
    A: You will be fined $1,000.
    B: Your vehicle will be impounded for 30 days.
    C: Your driving privilege will be suspended or revoked for one year.
    D: You will be required to install an ignition interlock device.
  answer: C
  explanation: If a law enforcement officer suspects you of driving under the influence
    and you refuse to take a blood or urine test, the DMV will suspend or revoke your
    driving privilege for one year.
- id: 176
  category: penalties_and_points
  question: If you are between 13 and 20 years old and convicted of operating a bicycle
    under the influence of alcohol, what is the penalty?
  choices:
    A: Your bicycle will be impounded.
    B: You must complete a 6-month jail sentence.
    C: Your driving privilege may be suspended or delayed for one year.
    D: You will permanently lose your eligibility for a driver's license.
  answer: C
  explanation: If you are 13 to 20 years old and convicted of operating a bicycle
    while under the influence of alcohol or drugs, your driving privilege may be suspended
    or delayed for one year once you are eligible to drive.
- id: 177
  category: safe_driving_rules
  question: Where must you keep an opened container of alcohol in your vehicle?
  choices:
    A: In the glove box.
    B: Under the front passenger seat.
    C: In the trunk or a place where passengers do not sit.
    D: In the center console.
  answer: C
  explanation: If an alcohol container is open, you must keep it in the trunk or a
    place where passengers do not sit. It is illegal to keep an open container of
    alcohol in your glove box.
- id: 178
  category: alcohol_drugs_health
  question: It is illegal for a person 21 years of age or older to drive with a Blood
    Alcohol Concentration (BAC) that is ___ or higher.
  choices:
    A: 0.01%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: It is illegal for you to drive if you have a BAC of 0.08% or higher
    if you are over 21 years old.
- id: 179
  category: alcohol_drugs_health
  question: What is the legal Blood Alcohol Concentration (BAC) limit for someone
    driving a vehicle that requires a commercial driver's license?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: It is illegal to drive with a BAC of 0.04% or higher if you drive a
    vehicle that requires a commercial driver's license.
- id: 180
  category: penalties_and_points
  question: If you are arrested for a DUI, how many days do you have to request a
    DMV administrative hearing?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: If you are arrested for a DUI, you may request a DMV administrative
    hearing within 10 days from the date of your arrest.
- id: 181
  category: penalties_and_points
  question: How long does a DUI conviction remain on your driver's record?
  choices:
    A: 3 years
    B: 5 years
    C: 7 years
    D: 10 years
  answer: D
  explanation: All DUI convictions remain on your driver's record for 10 years.
- id: 182
  category: alcohol_drugs_health
  question: If you are under 21 years old, when are you legally allowed to carry an
    alcoholic beverage inside a vehicle?
  choices:
    A: When the container is hidden in the glove box.
    B: When you are accompanied by an individual who is 21 years old or older.
    C: When you are driving to a party.
    D: When the alcohol is in the back seat.
  answer: B
  explanation: If you are under 21, you may not carry any alcohol beverage inside
    a vehicle unless an individual who is 21 years old or older is with you (or if
    you are working for someone with an off-site liquor sales license).
- id: 183
  category: penalties_and_points
  question: If you are under 21 years old and caught with alcohol in your vehicle
    without a person 21 or older, what is one possible penalty?
  choices:
    A: Your vehicle can be impounded for up to 30 days.
    B: You will be sentenced to 6 months in jail.
    C: You will be required to install an ignition interlock device.
    D: Your vehicle will be permanently confiscated.
  answer: A
  explanation: If you are under 21 and caught with alcohol in your vehicle, law enforcement
    can impound your vehicle for up to 30 days, and the court may fine you and suspend
    your driver's license for one year.
- id: 184
  category: driver_responsibility
  question: What is the minimum insurance coverage required for property damage in
    California?
  choices:
    A: $10,000
    B: $15,000
    C: $30,000
    D: $60,000
  answer: B
  explanation: Your insurance must cover at least $15,000 for property damage, along
    with $30,000 for a single death/injury and $60,000 for death/injury to more than
    one person.
- id: 185
  category: penalties_and_points
  question: What is the penalty if you are involved in a collision and do not have
    proper insurance coverage?
  choices:
    A: Your driving privilege will be suspended for up to four years.
    B: You will be fined $5,000.
    C: Your vehicle will be impounded for one year.
    D: You will receive a warning on your driving record.
  answer: A
  explanation: Your driving privilege will be suspended for up to four years if you
    are in a collision and do not have proper insurance coverage, regardless of who
    was at fault.
- id: 186
  category: alcohol_drugs_health
  question: How does California law view driving under the influence of prescription
    medications compared to illegal drugs?
  choices:
    A: Prescription medications are exempt from DUI laws.
    B: The law does not see a difference if the medication affects your ability to
      drive safely.
    C: You can only be charged with a DUI for illegal drugs.
    D: Over-the-counter medications are legal to use while driving regardless of their
      effects.
  answer: B
  explanation: The law does not see a difference between illegal drugs and medications
    you get from a doctor or pharmacy. They can all affect your ability to drive safely
    and react to what you see and hear.
- id: 187
  category: safe_driving_rules
  question: The law prohibiting open containers of alcohol in a vehicle does NOT apply
    to passengers in which of the following vehicles?
  choices:
    A: A pickup truck
    B: A commercial delivery van
    C: A bus, taxi, camper, or motorhome
    D: A rideshare vehicle
  answer: C
  explanation: The law regarding open containers of alcohol does not apply if you
    are a passenger in a bus, taxi, camper, or motorhome.
- id: 188
  category: alcohol_drugs_health
  question: Can you be arrested and convicted of a DUI if your Blood Alcohol Concentration
    (BAC) is below the legal limit?
  choices:
    A: No, you can only be arrested if your BAC is at or above the legal limit.
    B: Yes, depending on how badly you are impaired.
    C: Yes, but only if you are under 21 years old.
    D: No, a BAC measurement is strictly required for any DUI conviction.
  answer: B
  explanation: Even if your BAC is below legal limits, that does not mean it is safe
    for you to drive. Depending on how badly you are impaired, you may be arrested
    and convicted of a DUI even without a BAC measurement.
- id: 189
  category: vehicle_information
  question: When you buy a vehicle, how many days do you have to transfer ownership
    to your name?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 20 days
  answer: B
  explanation: According to the manual, when you buy a vehicle, you have 10 days to
    transfer ownership to your name.
- id: 190
  category: vehicle_information
  question: How many days do you have to notify the DMV after selling a vehicle?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: A
  explanation: When you sell a vehicle, you must notify DMV within five days by completing
    a Notice of Transfer and Release of Liability.
- id: 191
  category: vehicle_information
  question: If you become a resident or get a job in California, how long do you have
    to register your out-of-state vehicle?
  choices:
    A: 10 days
    B: 15 days
    C: 20 days
    D: 30 days
  answer: C
  explanation: You have 20 days to register your vehicle after you become a resident
    or get a job in California.
- id: 192
  category: driver_responsibility
  question: 'You must report a collision to the DMV within 10 days if:'
  choices:
    A: The collision caused more than $500 in property damage.
    B: The collision caused more than $1,000 in damage to property or anyone was injured
      or killed.
    C: You were at fault for the collision.
    D: The collision occurred on a public highway and caused traffic delays.
  answer: B
  explanation: If you are in a collision, you must report it to DMV within 10 days
    if the collision caused more than $1,000 in damage to property, or if anyone was
    injured or killed.
- id: 193
  category: driver_responsibility
  question: What must you do if your vehicle hits a parked car and you cannot find
    the owner?
  choices:
    A: Wait by the vehicle until the owner returns.
    B: Leave a note with your name, phone number, and address, and report the collision
      to law enforcement.
    C: Drive away if there is no visible damage to the parked car.
    D: Call your insurance company and leave the scene immediately.
  answer: B
  explanation: If you cannot find the owner, leave a note with your name, phone number,
    and address securely attached to the vehicle or property, and report the collision
    to law enforcement.
- id: 194
  category: safe_driving_rules
  question: If you injure an animal with your vehicle, what is the proper course of
    action?
  choices:
    A: Move the animal to the side of the road and leave.
    B: Call the nearest humane society or law enforcement and do not try to move the
      injured animal.
    C: Take the animal to the nearest veterinary clinic.
    D: Honk your horn to alert others and continue driving.
  answer: B
  explanation: If you kill or injure an animal, call the nearest humane society or
    law enforcement. Do not try to move an injured animal.
- id: 195
  category: safe_driving_rules
  question: If you are involved in a collision and no one is hurt, what should you
    do first?
  choices:
    A: Leave your vehicle exactly where it is and call 911.
    B: Move your vehicle out of traffic, then call 911.
    C: Exchange insurance information in the middle of the road.
    D: Drive home and report the collision online.
  answer: B
  explanation: If you are in a collision, you should move your vehicle out of traffic
    if no one is hurt. Then call 911.
- id: 196
  category: penalties_and_points
  question: If you receive a Notice of Priority Reexamination of Driver, how long
    do you have to contact the DMV before your driving privilege is automatically
    suspended?
  choices:
    A: 48 hours
    B: 5 working days
    C: 10 days
    D: 30 days
  answer: B
  explanation: You have five working days to contact DMV to initiate the process or
    your driving privilege will be automatically suspended.
- id: 197
  category: driver_testing
  question: Which of the following can be the basis for a DMV driver reexamination?
  choices:
    A: A driver's age reaching 70 years old.
    B: A physical or mental condition or poor driver's record.
    C: Buying a new vehicle.
    D: Moving to a new city within California.
  answer: B
  explanation: A physical or mental condition or poor driver's record can be the basis
    for a reexamination, not a driver's age.
- id: 198
  category: license_system
  question: 'Driver''s license restrictions, such as requiring eyeglasses or limiting
    night driving, are based on:'
  choices:
    A: The driver's age.
    B: The driver's zip code.
    C: Conditions and the examiner's findings, not age.
    D: The type of vehicle the driver owns.
  answer: C
  explanation: There are no specific restrictions for seniors. All restrictions are
    based on conditions, not age, and are based on the examiner's findings and recommendations.
- id: 199
  category: driver_responsibility
  question: If anyone is injured or killed in a collision, you must make a report
    to law enforcement within what time frame?
  choices:
    A: Immediately
    B: 24 hours
    C: 5 days
    D: 10 days
  answer: B
  explanation: You must make a report to law enforcement within 24 hours of the collision
    if anyone is injured or killed.
- id: 200
  category: driver_responsibility
  question: 'When filing a Report of Traffic Accident Occurring in California (SR
    1) with the DMV, you must file the report:'
  choices:
    A: Only if you caused the collision.
    B: Only if the collision happened on a public road.
    C: Whether or not you caused the collision, even if it happened on private property.
    D: Only if law enforcement did not make a report for you.
  answer: C
  explanation: You (or your representative) must file a report whether or not you
    caused the collision. This applies even if the collision happened on private property.
- id: 201
  category: defensive_driving
  question: According to the manual, which of the following is one of the most common
    causes of collisions?
  choices:
    A: Driving during daylight hours.
    B: A vehicle traveling faster or slower than the flow of traffic.
    C: Using hands-free devices.
    D: Stopping at stop signs.
  answer: B
  explanation: The most common causes of collisions include driver distractions, unsafe
    speed, improper turns, and a vehicle traveling faster or slower than the flow
    of traffic.
- id: 202
  category: safe_driving_rules
  question: What should you do if you see a vehicle's emergency flashers ahead?
  choices:
    A: Speed up to pass the vehicle quickly.
    B: Turn on your own emergency flashers and stop immediately.
    C: Slow down and pass carefully, as there may be a collision or emergency.
    D: Honk your horn to alert the driver.
  answer: C
  explanation: If you see a vehicle's emergency flashers ahead, slow down. There may
    be a collision or other road emergency. Pass carefully.
- id: 203
  category: license_system
  question: After conducting a driver reexamination, which of the following is an
    action the DMV may take?
  choices:
    A: Confiscate the driver's vehicle.
    B: Issue a limited term driver's license.
    C: Require the driver to purchase a new vehicle.
    D: Force the driver to retake a driver's education course.
  answer: B
  explanation: Following a reexamination, the DMV may take several actions, including
    issuing a limited term driver's license, suspending or revoking driving privileges,
    or taking no action.
- id: 204
  category: license_system
  question: How does the DMV determine if a senior driver needs restrictions placed
    on their driver's license?
  choices:
    A: Restrictions are automatically applied when a driver reaches age 70.
    B: Restrictions are based entirely on the driver's age.
    C: Restrictions are based on conditions and the examiner's findings, not age.
    D: Restrictions are based on the number of years the person has been driving.
  answer: C
  explanation: According to the manual, there are no specific restrictions for seniors.
    All restrictions are based on conditions, not age, and rely on the examiner's
    findings and recommendations.
- id: 205
  category: safe_driving_rules
  question: Which of the following is considered a warning sign of an unsafe driver?
  choices:
    A: Driving during times of day when traffic is light.
    B: Getting lost in familiar places.
    C: Installing an additional right-side mirror.
    D: Choosing a well-lit route for night driving.
  answer: B
  explanation: The manual lists getting lost in familiar places, dents and scrapes
    on the car or property, and frequent close calls or collisions as warning signs
    of an unsafe driver.
- id: 206
  category: defensive_driving
  question: What is a strategy that senior drivers may consider to adapt to their
    changing driving abilities?
  choices:
    A: Driving primarily on freeways.
    B: Driving during the time of day when traffic is light.
    C: Removing outside mirrors to reduce distractions.
    D: Driving longer distances to maintain their skills.
  answer: B
  explanation: Senior drivers may consider several strategies to stay safe, including
    driving during the time of day when traffic is light, avoiding difficult intersections,
    and limiting driving to essential places.
- id: 207
  category: license_system
  question: What is required if you are 70 years old or older at the time your driver's
    license expires?
  choices:
    A: You must renew your driver's license in person and pass a vision test.
    B: You must retake the behind-the-wheel drive test.
    C: You must surrender your license and obtain a Senior ID card.
    D: You can only renew your license online.
  answer: A
  explanation: If you are 70 years old or older at the time your driver's license
    expires, you are required to renew your driver's license in person and pass a
    vision test.
- id: 208
  category: license_system
  question: Approximately how many days before your driver's license expires does
    the DMV send a renewal notice?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The DMV sends a renewal notice to your address of record about 90 days
    before your driver's license expires.
- id: 209
  category: driver_responsibility
  question: What is the primary function of the DMV's Community Liaison?
  choices:
    A: To represent drivers in DMV hearings and reexaminations.
    B: To issue traffic citations to unsafe drivers.
    C: To represent public safety interests, focusing on the concerns of senior drivers
      and teens.
    D: To administer behind-the-wheel drive tests for seniors.
  answer: C
  explanation: The Community Liaison's primary function is to represent public safety
    interests for all Californians, with a focus on addressing the concerns of senior
    drivers and teens.
- id: 210
  category: alcohol_drugs_health
  question: Who is often responsible for stopping seniors with progressive dementia
    from driving?
  choices:
    A: The DMV Community Liaison.
    B: Caregivers, physicians, and law enforcement.
    C: The driver's auto insurance provider.
    D: Mature Driver Program instructors.
  answer: B
  explanation: Individuals with progressive dementia ultimately lose their ability
    to drive safely. It is often up to caregivers, physicians, and law enforcement
    to stop these seniors from driving.
- id: 211
  category: safe_driving_rules
  question: The Mature Driver Improvement Program is an eight-hour course designed
    for drivers of what age?
  choices:
    A: 50 years old and older
    B: 55 years old and older
    C: 62 years old and older
    D: 70 years old and older
  answer: B
  explanation: The Mature Driver Improvement Program is an eight-hour course for drivers
    55 years old and older.
- id: 212
  category: license_system
  question: How long is the completion certificate for the Mature Driver Improvement
    Program valid?
  choices:
    A: One year
    B: Two years
    C: Three years
    D: Five years
  answer: C
  explanation: Your certificate for completing the Mature Driver Improvement Program
    is valid for three years and can be renewed by completing another four-hour course.
- id: 213
  category: license_system
  question: At what age are you eligible for a no-fee Senior ID card in California?
  choices:
    A: 55 years old
    B: 60 years old
    C: 62 years old
    D: 70 years old
  answer: C
  explanation: If you are 62 years old or older, you are eligible for a no-fee Senior
    ID card.
- id: 214
  category: alcohol_drugs_health
  question: What does a Blood Alcohol Concentration (BAC) of 0.10% mean?
  choices:
    A: You have 0.10 grams of alcohol in 100 milliliters of blood.
    B: You have 0.10 ounces of alcohol in 100 ounces of blood.
    C: You have 1.0 grams of alcohol in 10 milliliters of blood.
    D: You have 10 grams of alcohol in 100 milliliters of blood.
  answer: A
  explanation: According to the glossary, if your BAC is 0.10%, that means you have
    0.10 grams of alcohol in 100 milliliters of blood.
- id: 215
  category: sharing_the_road
  question: According to the manual's glossary, which of the following is considered
    a Vulnerable Road User (VRU)?
  choices:
    A: A driver of a commercial truck.
    B: A motorcyclist.
    C: A person with a disability using a wheelchair.
    D: A passenger in a motor vehicle.
  answer: C
  explanation: VRUs are non-motorized road users, such as cyclists, pedestrians, and
    persons with disabilities or reduced mobility and orientation using a wheelchair,
    tricycle, or quadricycle.
- id: 216
  category: defensive_driving
  question: What is the purpose of the three-second rule?
  choices:
    A: To determine how long to stop at a stop sign.
    B: To estimate how closely you should follow other vehicles.
    C: To time how long you have to yield the right-of-way.
    D: To measure the time it takes to cross an intersection safely.
  answer: B
  explanation: The three-second rule is a driving rule that helps you estimate how
    closely you should follow other vehicles.
- id: 217
  category: safe_driving_rules
  question: What does it mean to 'yield' on the road?
  choices:
    A: To speed up to merge into traffic safely.
    B: To come to a complete stop at all times regardless of traffic.
    C: To wait for, slow down, and be ready to stop to allow others with the right-of-way
      to proceed.
    D: To take the right-of-way from other vehicles to keep traffic flowing.
  answer: C
  explanation: Yield means to wait for, slow down, and be ready to stop (if necessary)
    to allow other vehicles or pedestrians who have right-of-way to proceed.
- id: 218
  category: license_system
  question: If a driver of any age is unable to continue driving safely due to a physical
    or mental condition, what option is available to them?
  choices:
    A: They may receive a restricted license for daytime driving only.
    B: They may be eligible to exchange their driver's license for a no-fee ID card.
    C: They can have a Community Liaison represent them in a DMV hearing.
    D: They must take the Mature Driver Program to reinstate their license.
  answer: B
  explanation: Drivers of any age who are unable to continue driving safely due to
    a physical or mental condition may be eligible to exchange their driver's license
    for a no-fee ID card.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 219
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 220
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
