metadata:
  source: //www.dmv.ca.gov/portal/handbook/california-driver-handbook/:2025 California
    Driver Handbook (dmv.ca.gov)
  total_questions: 208
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: safe_driving_rules
  question: What is the speed limit in a school zone when children are present, unless
    otherwise posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: According to the California Driver's Handbook, the speed limit is 25
    mph when driving within 500 feet of a school while children are outside or crossing
    the street, unless otherwise posted.
- id: 2
  category: safe_driving_rules
  question: 'California''s ''Basic Speed Law'' states that you must:'
  choices:
    A: Never drive faster than the posted speed limit
    B: Never drive faster than is safe for current conditions
    C: Always drive at the flow of traffic
    D: Keep your speed close to other vehicles
  answer: B
  explanation: The Basic Speed Law states you may never drive faster than is safe
    for current conditions, regardless of the posted speed limit.
- id: 3
  category: alcohol_drugs_health
  question: It is illegal for a person 21 years of age or older to drive with a Blood
    Alcohol Concentration (BAC) that is ___ or higher.
  choices:
    A: 0.04%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: California law makes it illegal for anyone 21 or older to drive with
    a BAC of 0.08% or higher.
- id: 4
  category: sharing_the_road
  question: 'When a school bus with its red lights flashing is stopped ahead on your
    side of the road, you must:'
  choices:
    A: Stop until you think all children are unloaded
    B: Stop until the red lights stop flashing
    C: Change lanes, drive slowly, and pass carefully
    D: Slow down to 15 mph as you pass
  answer: B
  explanation: You must stop for a school bus with flashing red lights and remain
    stopped until the lights stop flashing. Failing to do so can result in a fine
    and suspended license.
- id: 5
  category: sharing_the_road
  question: 'You must yield the right-of-way to an emergency vehicle by:'
  choices:
    A: Driving as near to the right edge of the road as possible and stopping
    B: Moving into the right lane and driving slowly
    C: Stopping immediately in your current lane
    D: Speeding up to get out of its way
  answer: A
  explanation: When you hear a siren or see flashing red lights from an emergency
    vehicle, you must pull over to the right edge of the road and stop until it passes.
- id: 6
  category: driver_responsibility
  question: Under California law, when can you use a handheld cell phone while driving?
  choices:
    A: When stopped at a red light
    B: Only in an emergency to call for assistance
    C: When traffic is moving at less than 15 mph
    D: When you are driving on a rural highway
  answer: B
  explanation: You may only use a handheld cell phone while driving in an emergency
    situation to call law enforcement, a medical provider, the fire department, or
    other emergency services.
- id: 7
  category: safe_driving_rules
  question: 'When parking uphill on a two-way street with no curb, your front wheels
    should be:'
  choices:
    A: Turned to the left (toward the street)
    B: Turned to the right (away from the street)
    C: Parallel with the edge of the road
    D: Pointing straight ahead
  answer: B
  explanation: When parking uphill or downhill with no curb, turn your wheels to the
    right (toward the side of the road) so the vehicle will roll away from the center
    of the road if the brakes fail.
- id: 8
  category: signs_and_signals
  question: 'A flashing red traffic light at an intersection means:'
  choices:
    A: Slow down before entering
    B: Stop before entering, then proceed when safe
    C: Stop and wait for the green light
    D: Yield to all traffic before entering
  answer: B
  explanation: A flashing red traffic signal light means 'STOP.' After stopping, you
    may proceed when it is safe, observing the right-of-way rules.
- id: 9
  category: signs_and_signals
  question: 'Two solid yellow lines in the center of the roadway mean:'
  choices:
    A: Passing is permitted from either direction
    B: Passing is permitted only if you are on the right side
    C: No passing is permitted from either direction
    D: The road narrows ahead
  answer: C
  explanation: Two solid yellow lines indicate no passing. You may not drive over
    these lines to pass other vehicles.
- id: 10
  category: defensive_driving
  question: 'To avoid tailgating, the California Driver''s Handbook recommends using
    the:'
  choices:
    A: 2-second rule
    B: 3-second rule
    C: 4-second rule
    D: 5-second rule
  answer: B
  explanation: To avoid tailgating, use the '3-second rule' to ensure you have enough
    space to stop safely if the vehicle in front of you brakes suddenly.
- id: 11
  category: penalties_and_points
  question: 'You must notify the DMV within 10 days if you are in a collision that
    causes:'
  choices:
    A: Any vehicle damage
    B: More than $500 in damage
    C: More than $1,000 in damage or anyone is injured or killed
    D: Your vehicle to be towed
  answer: C
  explanation: You (or your insurance agent, broker, or legal representative) must
    report a collision to the DMV within 10 days if it caused more than $1,000 in
    property damage or if anyone was injured or killed.
- id: 12
  category: sharing_the_road
  question: 'If a pedestrian is in a crosswalk, you must:'
  choices:
    A: Honk your horn to warn them
    B: Yield the right-of-way to the pedestrian
    C: Drive around them carefully
    D: Stop only if they are on your side of the road
  answer: B
  explanation: Pedestrians have the right-of-way in marked or unmarked crosswalks.
    You must yield and allow them to cross safely.
- id: 13
  category: license_system
  question: 'With a basic Class C driver''s license, a person may drive:'
  choices:
    A: A 3-axle vehicle if the Gross Vehicle Weight is less than 6,000 pounds
    B: Any commercial vehicle
    C: A vehicle pulling two trailers
    D: A motorcycle
  answer: A
  explanation: A Class C driver's license allows you to drive a 2-axle vehicle with
    a GVWR of 26,000 lbs. or less, or a 3-axle vehicle weighing 6,000 lbs. or less
    gross.
- id: 14
  category: defensive_driving
  question: 'When changing lanes, you should check your blind spots by:'
  choices:
    A: Looking in your rearview mirror
    B: Looking in your side mirrors
    C: Turning your head and looking over your shoulder
    D: Using your backup camera
  answer: C
  explanation: Mirrors do not show your blind spots. You must turn your head and look
    over your shoulder to ensure a lane is clear before changing lanes.
- id: 15
  category: safe_driving_rules
  question: What is the fundamental principle of California's 'Basic Speed Law'?
  choices:
    A: You may never drive faster than the posted speed limit.
    B: You may never drive faster than is safe for current conditions.
    C: You must always drive at the flow of traffic, regardless of the speed limit.
    D: You must drive at least 10 mph below the speed limit in bad weather.
  answer: B
  explanation: California's 'Basic Speed Law' states that you may never drive faster
    than is safe for current conditions, regardless of the posted speed limit.
- id: 16
  category: alcohol_drugs_health
  question: What is the legal Blood Alcohol Concentration (BAC) limit for a driver
    who is 21 years of age or older?
  choices:
    A: 0.04%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: It is illegal for any person 21 years of age or older to operate a
    vehicle with a Blood Alcohol Concentration (BAC) of 0.08% or higher.
- id: 17
  category: safe_driving_rules
  question: What is the speed limit at a blind intersection?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The speed limit for a blind intersection is 15 mph. An intersection
    is considered 'blind' if there are no stop signs at any corner and you cannot
    see for 100 feet in either direction during the last 100 feet before crossing.
- id: 18
  category: safe_driving_rules
  question: What is the maximum speed limit in most business or residential districts
    in California?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: A
  explanation: Unless otherwise posted, the maximum speed limit in most business and
    residential districts is 25 mph.
- id: 19
  category: safe_driving_rules
  question: How should you turn your wheels when parking uphill next to a curb?
  choices:
    A: Turn your wheels toward the curb.
    B: Turn your wheels away from the curb.
    C: Keep your wheels perfectly straight.
    D: Turn your wheels parallel to the street.
  answer: B
  explanation: When parking uphill next to a curb, you should turn your front wheels
    away from the curb and let your vehicle roll back a few inches until the back
    of the front wheel gently touches the curb.
- id: 20
  category: signs_and_signals
  question: What does a flashing red traffic signal mean?
  choices:
    A: Slow down and yield to traffic.
    B: Stop, then proceed when it is safe.
    C: Stop and wait for a green light.
    D: The traffic signal is broken; proceed with caution.
  answer: B
  explanation: A flashing red traffic signal means 'STOP.' After stopping, you may
    proceed when it is safe, observing the right-of-way rules.
- id: 21
  category: signs_and_signals
  question: What do two sets of solid, double, yellow lines that are two or more feet
    apart represent?
  choices:
    A: A carpool lane.
    B: A passing zone.
    C: A solid wall; do not drive on or over them.
    D: A shared center turn lane.
  answer: C
  explanation: Two sets of solid, double, yellow lines that are two or more feet apart
    are considered a barrier. Do not drive on or over this barrier, make a left turn,
    or a U-turn across it.
- id: 22
  category: sharing_the_road
  question: Who has the right-of-way at a crosswalk?
  choices:
    A: Vehicles have the right-of-way if the pedestrian is jaywalking.
    B: Pedestrians always have the right-of-way in marked or unmarked crosswalks.
    C: Vehicles have the right-of-way if the crosswalk is unmarked.
    D: Bicycles have the right-of-way over pedestrians.
  answer: B
  explanation: Pedestrians have the right-of-way in marked or unmarked crosswalks.
    Drivers must yield and reduce their speed or stop if necessary to ensure the pedestrian's
    safety.
- id: 23
  category: defensive_driving
  question: What is the recommended minimum following distance under normal driving
    conditions to avoid a rear-end collision?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: To avoid tailgating and rear-end collisions, you should use the '3-second
    rule' to maintain a safe following distance under normal driving conditions.
- id: 24
  category: driver_responsibility
  question: When must you report a traffic collision to the DMV?
  choices:
    A: Only if someone is killed.
    B: Within 10 days if the damage is over $1,000 or if anyone is injured or killed.
    C: Within 5 days if the damage is over $500.
    D: Only if the police do not file a report.
  answer: B
  explanation: You (or your insurance agent, broker, or legal representative) must
    report a collision to the DMV within 10 days if there is more than $1,000 in damage
    to the property of any person, or if anyone is injured (no matter how slightly)
    or killed.
- id: 25
  category: safe_driving_rules
  question: When are you required to turn on your vehicle's headlights?
  choices:
    A: Only when driving on unlit roads.
    B: From 30 minutes after sunset until 30 minutes before sunrise.
    C: From 1 hour after sunset until 1 hour before sunrise.
    D: Only when you cannot see 500 feet ahead of you.
  answer: B
  explanation: You must turn on your headlights 30 minutes after sunset and leave
    them on until 30 minutes before sunrise, or anytime you cannot clearly recognize
    a person or vehicle from a distance of 1,000 feet.
- id: 26
  category: sharing_the_road
  question: What should you do when an emergency vehicle with a siren and flashing
    lights approaches from behind?
  choices:
    A: Speed up to stay ahead of the emergency vehicle.
    B: Stop immediately in your current lane.
    C: Pull over to the right edge of the road and stop.
    D: Move to the left lane to let them pass on the right.
  answer: C
  explanation: You must yield the right-of-way to any police vehicle, fire engine,
    ambulance, or other emergency vehicle using a siren and red lights. Drive to the
    right edge of the road and stop until the emergency vehicle(s) have passed.
- id: 27
  category: signs_and_signals
  question: What does a solid yellow traffic light indicate?
  choices:
    A: The light is about to turn green.
    B: 'CAUTION: The red signal is about to appear.'
    C: Stop immediately, regardless of your position in the intersection.
    D: Speed up to clear the intersection quickly.
  answer: B
  explanation: A solid yellow traffic signal light means 'CAUTION.' The red traffic
    signal light is about to appear. When you see the yellow traffic signal light,
    stop if you can do so safely. If you cannot stop safely, cross the intersection
    cautiously.
- id: 28
  category: driver_responsibility
  question: When interacting with the DMV Virtual Assistant, what type of information
    should you avoid including?
  choices:
    A: Vehicle make and model
    B: Personal information
    C: General driving questions
    D: Website feedback
  answer: B
  explanation: 'The General Disclaimer states: ''When interacting with the Department
    of Motor Vehicles (DMV) Virtual Assistant, please do not include any personal
    information.'''
- id: 29
  category: license_system
  question: If a discrepancy arises between the English content and a third-party
    translation on the DMV website, which version is legally binding?
  choices:
    A: The translated version
    B: Both versions are equally binding
    C: The English version
    D: Neither version
  answer: C
  explanation: The Third-Party Translation Disclaimer notes that the English content
    is the official source, and any discrepancies in translation 'are not binding
    and have no legal effect for compliance or enforcement purposes.'
- id: 30
  category: vehicle_information
  question: Which of the following is a service provided under the Vehicle Registration
    section?
  choices:
    A: Join the mDL Pilot
    B: Submit Proof of Insurance
    C: Pay Reinstatement Fee
    D: Online Testing
  answer: B
  explanation: According to the primary navigation menu, 'Submit Proof of Insurance'
    is listed as a service under Vehicle Registration.
- id: 31
  category: license_system
  question: Under the Driver's Licenses & IDs services, which pilot program are users
    invited to join?
  choices:
    A: The mDL Pilot
    B: The Virtual Office Pilot
    C: The Safe Driver Pilot
    D: The Online Testing Pilot
  answer: A
  explanation: The navigation menu for Driver's Licenses & IDs includes an option
    to 'Join the mDL Pilot.'
- id: 32
  category: penalties_and_points
  question: Which of the following penalty-related fees can be paid through the DMV's
    online payment system?
  choices:
    A: Speeding ticket fines
    B: Parking citations
    C: Dishonored Check Payment
    D: Court administrative fees
  answer: C
  explanation: The 'Make a Payment' section explicitly lists 'Dishonored Check Payment'
    and 'Pay Reinstatement Fee' as online payment options.
- id: 33
  category: driver_testing
  question: Which section of the California Driver's Handbook covers 'The Testing
    Process'?
  choices:
    A: Section 1
    B: Section 2
    C: Section 3
    D: Section 4
  answer: C
  explanation: 'The Table of Contents lists ''Section 3: The Testing Process'' in
    the California Driver''s Handbook.'
- id: 34
  category: safe_driving_rules
  question: According to the California Driver's Handbook table of contents, which
    section is dedicated to 'Laws and Rules of the Road'?
  choices:
    A: Section 5
    B: Section 6
    C: Section 7
    D: Section 8
  answer: C
  explanation: 'The Table of Contents explicitly lists ''Section 7: Laws and Rules
    of the Road.'''
- id: 35
  category: defensive_driving
  question: Which section of the California Driver's Handbook introduces the topic
    of 'Safe Driving'?
  choices:
    A: Section 5
    B: Section 6
    C: Section 7
    D: Section 8
  answer: D
  explanation: 'The Table of Contents outlines ''Section 8: Safe Driving'' for the
    California Driver''s Handbook.'
- id: 36
  category: driver_testing
  question: What resources are available under the DMV's online Testing menu to help
    prepare for a driver's test?
  choices:
    A: Live virtual instructors
    B: Practice Tests and How-To Videos
    C: Behind-the-wheel simulators
    D: Expedited grading services
  answer: B
  explanation: The Testing menu includes options for 'Practice Tests,' 'How-To Videos,'
    'Driver Handbooks,' and 'Specialty Driver Guides.'
- id: 37
  category: driver_responsibility
  question: What must a user do to activate the DMV Virtual Assistant chatbot?
  choices:
    A: Create a MyDMV account
    B: Agree to the disclaimers
    C: Enter their driver's license number
    D: Pay a convenience fee
  answer: B
  explanation: The chatbot interface includes an error state that requires users to
    check a box stating 'I agree' to the disclaimers to activate the Virtual Assistant.
- id: 38
  category: license_system
  question: Which of the following case statuses can be checked online through the
    DMV portal?
  choices:
    A: Traffic court case status
    B: Driver Safety Case Status
    C: Vehicle impound status
    D: Smog check status
  answer: B
  explanation: The 'Check Status' menu provides an option to check the 'Driver Safety
    Case Status' among other services.
- id: 39
  category: license_system
  question: Which section of the California Driver's Handbook covers 'Changing, Replacing,
    and Renewing Your Driver’s License'?
  choices:
    A: Section 1
    B: Section 2
    C: Section 3
    D: Section 4
  answer: D
  explanation: 'The Table of Contents lists ''Section 4: Changing, Replacing, and
    Renewing Your Driver’s License.'''
- id: 40
  category: vehicle_information
  question: If you need to request a record of your vehicle, under which DMV menu
    should you look?
  choices:
    A: Vehicle Registration
    B: Driver's Licenses & IDs
    C: Check Status
    D: Appointments
  answer: A
  explanation: '''Request Vehicle Record'' is listed as a service under the ''Vehicle
    Registration'' navigation menu.'
- id: 41
  category: license_system
  question: What service allows customers to secure a place at a DMV office without
    scheduling a traditional appointment?
  choices:
    A: Virtual Office
    B: Get in Line Now
    C: MyDMV Fast Track
    D: Online Testing
  answer: B
  explanation: Under the 'Appointments' menu, the DMV offers a 'Get in Line Now' service
    alongside traditional appointment scheduling.
- id: 42
  category: license_system
  question: According to the translation disclaimer, why does the DMV provide machine
    translation via third-party vendors?
  choices:
    A: To replace the English version entirely
    B: For purposes of information and convenience only
    C: To provide legally binding documents in all languages
    D: To collect data on non-English speakers
  answer: B
  explanation: 'The disclaimer states: ''Machine translation is provided for purposes
    of information and convenience only.'''
- id: 43
  category: driver_responsibility
  question: 'According to the Secretary''s Message in the California Driver''s Handbook,
    driving or riding on California roads is considered:'
  choices:
    A: A constitutional right
    B: A privilege
    C: A requirement for all adults
    D: An optional hobby
  answer: B
  explanation: The Secretary's Message states, "Remember that driving or riding is
    a privilege, and above all, safety must be the priority."
- id: 44
  category: safe_driving_rules
  question: What does the Secretary of the California State Transportation Agency
    advise regarding cell phone use while driving?
  choices:
    A: Only use it for navigation
    B: Put it down when behind the wheel or handlebars
    C: Use hands-free devices only
    D: It is acceptable during daylight hours
  answer: B
  explanation: The Secretary's Message explicitly advises to "put down that cell phone
    when behind the wheel or handlebars. Do not operate a vehicle, motorcycle or bicycle
    while distracted or impaired."
- id: 45
  category: license_system
  question: Where can a Californian start their driver's license application from
    the comfort of their home?
  choices:
    A: By calling the DMV hotline
    B: By visiting the DMV website at dmv.ca.gov
    C: Through the Google Translate toolbar
    D: By emailing the Secretary of Transportation
  answer: B
  explanation: The text states, "The driver’s license application can be started from
    the comfort of home by visiting the DMV website at dmv.ca.gov."
- id: 46
  category: driver_testing
  question: In how many languages is the California Driver's Handbook available?
  choices:
    A: '3'
    B: '5'
    C: '9'
    D: '12'
  answer: C
  explanation: The Secretary's Message notes that "The California Driver’s Handbook
    is available in nine languages..."
- id: 47
  category: alcohol_drugs_health
  question: 'According to the handbook''s introduction, operating a vehicle, motorcycle,
    or bicycle while distracted or impaired could mean:'
  choices:
    A: A minor traffic citation
    B: The difference between life and death
    C: An automatic license suspension
    D: Increased insurance premiums
  answer: B
  explanation: The Secretary's Message warns, "Do not operate a vehicle, motorcycle
    or bicycle while distracted or impaired—it could mean the difference between life
    and death."
- id: 48
  category: defensive_driving
  question: Which of the following is listed as a safety priority for drivers in the
    Secretary's Message?
  choices:
    A: Always driving below the speed limit
    B: Yielding to commercial vehicles only
    C: Always buckling up and paying attention to others
    D: Upgrading to a newer vehicle
  answer: C
  explanation: The text advises to "Always buckle up, follow traffic laws, pay attention
    to other drivers, bicyclists and pedestrians..."
- id: 49
  category: license_system
  question: Which version of the DMV website is considered the official and accurate
    source for program information and services?
  choices:
    A: The Spanish version
    B: The Google Translated version
    C: The English version
    D: The American Sign Language version
  answer: C
  explanation: The Google Translate Disclaimer states, "The web pages currently in
    English on the DMV website are the official and accurate source for the program
    information and services the DMV provides."
- id: 50
  category: license_system
  question: According to the DMV website disclaimer, which of the following pages
    CANNOT be translated using Google Translate?
  choices:
    A: The Secretary's Message
    B: The Glossary
    C: Online Applications
    D: The Safe Driving section
  answer: C
  explanation: The disclaimer lists "Forms, Publications, Field Office Locations,
    Online Applications" as pages that cannot be translated using Google Translate.
- id: 51
  category: vehicle_information
  question: Due to the DMV's expanding online services, which of the following transactions
    can be completed on the DMV website?
  choices:
    A: Smog checks
    B: Vehicle registration and driver's license renewal
    C: Behind-the-wheel driving tests
    D: Vision exams
  answer: B
  explanation: The Secretary's Message states, "Some of these transactions include
    driver’s license renewal, vehicle registration and others."
- id: 52
  category: driver_responsibility
  question: What does the DMV advise if you choose to save your chat transcript with
    the Virtual Assistant on a public computer?
  choices:
    A: Use caution
    B: Print it immediately
    C: Email it to the DMV
    D: Share it with the site administrator
  answer: A
  explanation: The chatbot disclaimer warns, "When your chat is over, you can save
    the transcript. Use caution when using a public computer or device."
- id: 53
  category: license_system
  question: If discrepancies arise in the translation of the DMV website, what is
    the legal effect for compliance or enforcement purposes?
  choices:
    A: The translated text supersedes the English text
    B: The discrepancies are not binding and have no legal effect
    C: The user is exempt from the rule
    D: The DMV must provide a certified translator
  answer: B
  explanation: The disclaimer states, "Any discrepancies or differences created in
    the translation are not binding and have no legal effect for compliance or enforcement
    purposes."
- id: 54
  category: sharing_the_road
  question: According to the Secretary's Message, who must drivers pay attention to
    in order to share the road safely?
  choices:
    A: Only other drivers
    B: Only pedestrians in crosswalks
    C: Other drivers, bicyclists, and pedestrians
    D: Only commercial truck drivers
  answer: C
  explanation: The Secretary's Message reminds Californians to "pay attention to other
    drivers, bicyclists and pedestrians..."
- id: 55
  category: license_system
  question: For what purpose does the DMV provide machine translation services on
    its website and chatbot?
  choices:
    A: For official legal documentation
    B: For purposes of information and convenience only
    C: To replace English as the official language
    D: To guarantee perfect accuracy for non-English speakers
  answer: B
  explanation: The disclaimers state that "Machine translation is provided for purposes
    of information and convenience only."
- id: 56
  category: vehicle_information
  question: According to the handbook's table of contents, which section covers Financial
    Responsibility, Insurance Requirements, and Collisions?
  choices:
    A: Section 7
    B: Section 8
    C: Section 9
    D: Section 10
  answer: D
  explanation: 'The provided table of contents lists "Section 10: Financial Responsibility,
    Insurance Requirements, and Collisions."'
- id: 57
  category: safe_driving_rules
  question: Who has the right-of-way at a crosswalk with no pedestrian signals?
  choices:
    A: Vehicles, if they are traveling at the speed limit.
    B: Pedestrians always have the right-of-way in crosswalks.
    C: Vehicles, if the pedestrian is not in a marked crosswalk.
    D: Pedestrians, but only if they make eye contact with the driver.
  answer: B
  explanation: Pedestrians have the right-of-way in marked or unmarked crosswalks.
    Drivers must yield and reduce speed or stop if necessary to ensure the pedestrian's
    safety.
- id: 58
  category: defensive_driving
  question: To avoid tailgating, how much space should you leave between your vehicle
    and the vehicle in front of you under normal conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: B
  explanation: 'To avoid tailgating, the California Driver Handbook recommends using
    the ''3-second rule'': when the vehicle ahead of you passes a certain point, count
    three seconds to ensure safe following distance.'
- id: 59
  category: vehicle_information
  question: You must turn on your headlights ___ after sunset and leave them on until
    ___ before sunrise.
  choices:
    A: 30 minutes; 30 minutes
    B: 1 hour; 1 hour
    C: 15 minutes; 15 minutes
    D: Immediately; immediately
  answer: A
  explanation: California law requires you to turn on your headlights 30 minutes after
    sunset and leave them on until 30 minutes before sunrise.
- id: 60
  category: defensive_driving
  question: What is the best way to check your blind spots before changing lanes?
  choices:
    A: Look in your rearview mirror.
    B: Look in your side mirrors.
    C: Turn your head and look over your shoulder.
    D: Honk your horn to warn other drivers.
  answer: C
  explanation: To check your blind spots, you must turn your head and look over your
    shoulder in the direction you plan to move to see vehicles that are not visible
    in your mirrors.
- id: 61
  category: penalties_and_points
  question: If you are convicted of fleeing a peace officer on duty without causing
    bodily injury, you may face which of the following penalties?
  choices:
    A: Up to 1 year in a county jail.
    B: A warning and a fine.
    C: Mandatory community service.
    D: Permanent revocation of your license.
  answer: A
  explanation: Any person convicted of causing a pursuit and fleeing a peace officer
    is punishable by imprisonment in a county jail for not more than one year.
- id: 62
  category: signs_and_signals
  question: 'A three-sided, red and white sign indicates that you must:'
  choices:
    A: Stop completely before entering the intersection.
    B: Yield the right-of-way to other traffic and pedestrians.
    C: Maintain your speed and merge.
    D: Ignore the sign if no other vehicles are visible.
  answer: B
  explanation: A three-sided red YIELD sign indicates that you must slow down and
    be ready to stop, if necessary, to let any vehicle, bicyclist, or pedestrian pass
    before you proceed.
- id: 63
  category: sharing_the_road
  question: 'When passing a bicyclist in a travel lane, you must ensure there is enough
    width for the cyclist and maintain a minimum clearance of:'
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 4 feet
  answer: C
  explanation: California law requires drivers to leave a distance of at least three
    feet when passing a bicyclist to ensure their safety.
- id: 64
  category: safe_driving_rules
  question: In which of the following situations is it legal to make a U-turn?
  choices:
    A: On a divided highway by crossing a dividing section, curb, or strip of land.
    B: Across a double yellow line when it is safe and legal.
    C: At a railroad crossing.
    D: On a one-way street.
  answer: B
  explanation: You may make a U-turn across a double yellow line when it is safe and
    legal. It is illegal to make a U-turn on a one-way street, at a railroad crossing,
    or across a divided highway barrier.
- id: 65
  category: alcohol_drugs_health
  question: 'If you are under 21 years of age, California''s ''Zero Tolerance'' law
    states it is illegal to drive with a BAC of:'
  choices:
    A: 0.01% or higher
    B: 0.04% or higher
    C: 0.05% or higher
    D: 0.08% or higher
  answer: A
  explanation: California's Zero Tolerance law makes it illegal for anyone under 21
    to drive with a BAC of 0.01% or higher.
- id: 66
  category: driver_responsibility
  question: 'If you are involved in a collision resulting in an injury or death, you
    must report it to the DMV within:'
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: You (or your insurance agent, broker, or legal representative) must
    report the collision to the DMV within 10 days if someone is injured or killed,
    or if property damage exceeds $1,000.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 67
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 68
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 69
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 70
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 71
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 72
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 73
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 74
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 75
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 76
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 77
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 78
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 79
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 80
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 81
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 82
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 83
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 84
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 85
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 86
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 87
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 88
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 89
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 90
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 91
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 92
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 93
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 94
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 95
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 96
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 97
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 98
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 99
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 100
- id: 101
  category: license_system
  question: Under a California provisional driver's license, for how many months must
    you be accompanied by a licensed parent, guardian, or other licensed driver 25
    years or older when transporting passengers under 20 years old?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: During the first 12 months after you are licensed, you cannot transport
    passengers under 20 years old unless you are accompanied by a California-licensed
    parent or guardian, a licensed driver 25 years old or older, or a licensed or
    certified driving instructor.
- id: 102
  category: license_system
  question: During the first 12 months of holding a California provisional license,
    between what hours are you generally prohibited from driving unless accompanied
    by a licensed adult?
  choices:
    A: 10 p.m. and 5 a.m.
    B: 11 p.m. and 5 a.m.
    C: Midnight and 6 a.m.
    D: 9 p.m. and 6 a.m.
  answer: B
  explanation: California law prohibits provisional licensees from driving between
    11 p.m. and 5 a.m. during the first 12 months of licensure, with specific exceptions
    for medical, school, or work necessity.
- id: 103
  category: license_system
  question: What is the minimum age required to apply for a learner's permit in California
    if you have completed both driver education and driver training?
  choices:
    A: 15 years old
    B: 15 1/2 years old
    C: 16 years old
    D: 17 1/2 years old
  answer: B
  explanation: To apply for an instruction permit in California, you must be at least
    15 1/2 years old and have completed or be enrolled in an approved driver education
    and driver training program.
- id: 104
  category: license_system
  question: How many days do you have to notify the California DMV after you change
    your residence address?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: California law requires you to notify the DMV within 10 days of changing
    your residence address.
- id: 105
  category: license_system
  question: Which of the following vehicles are you permitted to drive with a standard
    California Class C driver's license?
  choices:
    A: A 2-axle vehicle with a gross vehicle weight rating of 26,000 lbs. or less.
    B: A motorcycle with an engine displacement over 250cc.
    C: A commercial bus carrying more than 15 passengers.
    D: A 3-axle vehicle weighing more than 10,000 lbs.
  answer: A
  explanation: A Class C license allows you to drive a 2-axle vehicle with a GVWR
    of 26,000 lbs. or less, or a 3-axle vehicle weighing 6,000 lbs. or less gross.
- id: 106
  category: license_system
  question: When driving with a California instruction permit, who must be in the
    front seat with you at all times?
  choices:
    A: Any person who is at least 18 years old.
    B: A person who is at least 21 years old and has a valid California driver's license.
    C: A person who is at least 25 years old and has a valid California driver's license.
    D: Only a certified driving instructor or a parent.
  answer: C
  explanation: California law requires permit holders to be accompanied by a person
    who is at least 25 years old and has a valid California driver's license, sitting
    close enough to take control of the vehicle if necessary.
- id: 107
  category: license_system
  question: Starting May 7, 2025, what type of identification will be required for
    California residents to board a domestic flight or enter secure federal facilities?
  choices:
    A: A standard Class C driver's license.
    B: A REAL ID compliant driver's license or identification card.
    C: A social security card and a birth certificate.
    D: A student identification card from a California university.
  answer: B
  explanation: Beginning May 7, 2025, the federal government will require a REAL ID
    or another federally approved document (like a passport) to board domestic flights
    or enter secure federal facilities.
- id: 108
  category: license_system
  question: Who is legally responsible for any financial damages if a minor with a
    California driver's license is involved in a traffic accident?
  choices:
    A: Only the minor driver.
    B: The California Department of Motor Vehicles.
    C: The parents or guardians who signed the minor's license application.
    D: The minor's high school or driver education program.
  answer: C
  explanation: In California, the parents or guardians who sign the driver's license
    application for a minor accept financial responsibility for that minor's driving.
- id: 109
  category: driver_testing
  question: How many times is an applicant permitted to fail the California knowledge
    test before their application expires and a new fee must be paid?
  choices:
    A: Two times
    B: Three times
    C: Four times
    D: Five times
  answer: B
  explanation: In California, your driver's license application is valid for 12 months,
    and you are allowed three attempts to pass the knowledge test before you must
    submit a new application and fee.
- id: 110
  category: driver_testing
  question: What is the minimum visual acuity required to pass the California DMV
    vision screening without a restriction being placed on your license?
  choices:
    A: 20/20 in both eyes
    B: 20/30 in at least one eye
    C: 20/40 in both eyes combined
    D: 20/50 in the stronger eye
  answer: C
  explanation: The California DMV vision standard is 20/40 with both eyes combined,
    and at least 20/40 in one eye and at least 20/70 in the other eye.
- id: 111
  category: driver_testing
  question: Which document must you present for the vehicle you provide for your California
    behind-the-wheel driving test?
  choices:
    A: The vehicle's service history and maintenance records
    B: A valid registration and proof of financial responsibility
    C: The original vehicle title or pink slip
    D: A notarized letter from the vehicle owner
  answer: B
  explanation: To take the road test, the vehicle must have a valid registration and
    you must show proof that the vehicle is properly insured (financial responsibility).
- id: 112
  category: driver_testing
  question: If a minor fails the California knowledge test, how long must they wait
    before they are eligible to take the test again?
  choices:
    A: They must wait 24 hours
    B: They must wait 7 days, not including the day of the failure
    C: They must wait 14 days
    D: They must wait 30 days
  answer: B
  explanation: According to the California Driver Handbook, if a minor fails the knowledge
    test, they must wait one week (7 days) before retaking it.
- id: 113
  category: driver_testing
  question: What is the consequence for an applicant who is caught cheating or using
    a testing aid during the California written exam?
  choices:
    A: The applicant is only required to restart the test from the beginning
    B: The applicant will be disqualified and the DMV may take action against their
      driving privilege
    C: The applicant must wait 24 hours before trying again
    D: The applicant must pay a $50 fine but can continue the test
  answer: B
  explanation: Cheating on a DMV exam is a serious offense; the test will be failed
    and the DMV may suspend or revoke any existing driving privilege or application.
- id: 114
  category: driver_testing
  question: If you fail the California behind-the-wheel driving test, how long must
    you wait before you can take the test again?
  choices:
    A: One week
    B: Two weeks
    C: One month
    D: Three days
  answer: B
  explanation: California law requires applicants who fail the road test to wait two
    weeks (14 days) before they can schedule a retest.
- id: 115
  category: driver_testing
  question: What is the required fee for each additional behind-the-wheel driving
    test if you do not pass on your first attempt?
  choices:
    A: $7
    B: $15
    C: $25
    D: $45
  answer: A
  explanation: While the initial application fee covers the first road test, there
    is a $7 retest fee for each subsequent behind-the-wheel exam.
- id: 116
  category: driver_testing
  question: Which of the following vehicle components must be functional to pass the
    pre-drive safety check during a California road test?
  choices:
    A: The air conditioning system
    B: The radio and speakers
    C: The driver's side window and windshield
    D: The cruise control system
  answer: C
  explanation: During the pre-drive check, the examiner ensures the windshield provides
    an unobstructed view and that the driver's side window rolls down for hand signals.
- id: 117
  category: driver_testing
  question: What action will the California DMV take if you are unable to pass the
    vision screening even with corrective lenses?
  choices:
    A: Your license will be permanently denied
    B: You will be required to have a vision specialist complete a Report of Vision
      Examination
    C: You will be required to take a special night-driving-only test
    D: You will be issued a license that is only valid for 30 days
  answer: B
  explanation: If you cannot meet the vision standards, the DMV will provide you with
    a form for your optometrist or ophthalmologist to complete to determine if you
    can drive safely.
- id: 118
  category: driver_testing
  question: Which of the following occurrences during the California road test will
    result in an immediate and automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: The examiner having to intervene to avoid a collision
    C: Driving 2 miles per hour under the speed limit
    D: Adjusting your mirrors while stopped at a red light
  answer: B
  explanation: Any action that requires the examiner to take control of the vehicle
    or intervene to prevent a hazard is considered a critical driving error and results
    in automatic failure.
- id: 119
  category: driver_testing
  question: How long does a California driver's license application remain valid after
    the initial fee is paid?
  choices:
    A: 6 months
    B: 12 months
    C: 24 months
    D: Until the applicant turns 18
  answer: B
  explanation: A California driver's license application and the paid fee are valid
    for exactly 12 months from the date of the application.
- id: 120
  category: driver_testing
  question: When an adult with a valid out-of-state driver's license moves to California,
    which requirement is typically waived by the DMV?
  choices:
    A: The knowledge test
    B: The vision screening
    C: The behind-the-wheel driving test
    D: The application fee
  answer: C
  explanation: The California DMV normally waives the driving test for applicants
    who hold a valid license from another U.S. state, though they must still pass
    the knowledge and vision tests.
- id: 121
  category: driver_testing
  question: Who is legally permitted to accompany an applicant in the vehicle during
    the California behind-the-wheel driving test?
  choices:
    A: A licensed parent or guardian
    B: A professional driving instructor
    C: Only the DMV examiner or authorized personnel
    D: Any licensed driver over the age of 25
  answer: C
  explanation: To avoid distractions and maintain testing integrity, only the DMV
    examiner (and occasionally a DMV supervisor for training purposes) is allowed
    in the vehicle.
- id: 122
  category: driver_testing
  question: In addition to the standard written format, in what other way can an applicant
    take the California knowledge test?
  choices:
    A: By having a friend translate the questions
    B: As an audio test via headphones
    C: By taking an oral exam with a police officer
    D: By submitting a written essay on traffic laws
  answer: B
  explanation: The California DMV offers knowledge tests in written, touch-screen,
    and audio formats to accommodate different needs and languages.
- id: 123
  category: driver_testing
  question: During the pre-drive safety check of the California road test, what must
    the applicant demonstrate using their arm and hand?
  choices:
    A: How to check the tire pressure
    B: The correct hand signals for turning and stopping
    C: How to measure the oil level
    D: The proper way to grip the steering wheel
  answer: B
  explanation: Before the driving portion begins, the applicant must demonstrate the
    hand signals for a left turn, right turn, and slowing or stopping.
- id: 124
  category: driver_testing
  question: What is the California DMV's policy regarding applicants with physical
    or mental conditions that may affect their driving?
  choices:
    A: They are automatically barred from receiving a license
    B: They may be issued a restricted license after a medical evaluation
    C: They are only allowed to drive during daylight hours
    D: They must be accompanied by a nurse at all times
  answer: B
  explanation: The DMV evaluates each case individually and may issue a license with
    specific restrictions (like 'must wear corrective lenses' or 'no freeway driving')
    based on medical reports.
- id: 125
  category: driver_testing
  question: Under what circumstance might the California DMV require a driver to retake
    the knowledge test when they are renewing their license?
  choices:
    A: If the driver has reached the age of 65
    B: If the driver has had a change in their marital status
    C: If the driver has accumulated too many points for traffic violations
    D: Every time a license is renewed, regardless of driving record
  answer: C
  explanation: While many renewals do not require a test, the DMV may require a knowledge
    test if the driver has a poor driving record or a condition that warrants re-evaluation.
- id: 126
  category: driver_responsibility
  question: If you are involved in a traffic collision in California, you must report
    it to the DMV within 10 days if the property damage to any one person is over
    what amount?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: C
  explanation: In California, any collision resulting in property damage over $1,000
    must be reported to the DMV within 10 days using the SR-1 form.
- id: 127
  category: driver_responsibility
  question: Which document must be submitted to the California DMV within 10 days
    of a collision that involves an injury, a death, or property damage exceeding
    $1,000?
  choices:
    A: Report of Traffic Accident Occurring in California (SR-1)
    B: Notice of Transfer and Release of Liability (NRL)
    C: Verification of Vehicle (REG 31)
    D: Statement of Facts (REG 256)
  answer: A
  explanation: The SR-1 form is the official Report of Traffic Accident Occurring
    in California that drivers must file regardless of who was at fault.
- id: 128
  category: driver_responsibility
  question: What is the minimum California legal requirement for liability insurance
    coverage for the injury or death of a single person in an accident?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $30,000
  answer: C
  explanation: California law requires a minimum of $15,000 for a single person's
    injury or death in any one accident.
- id: 129
  category: driver_responsibility
  question: When you purchase a vehicle from a private party, within how many days
    must you transfer the ownership of the vehicle to your name with the DMV?
  choices:
    A: 5 days
    B: 10 days
    C: 20 days
    D: 30 days
  answer: B
  explanation: Buyers have 10 days to notify the DMV and transfer the vehicle's title
    into their name after purchasing from a private party.
- id: 130
  category: driver_responsibility
  question: Which of the following is a valid method of meeting the California Financial
    Responsibility Law besides purchasing traditional automobile insurance?
  choices:
    A: A cash deposit of $35,000 with the DMV
    B: A written promise to pay for any damages
    C: Maintaining a savings account with at least $10,000
    D: Providing a notarized letter from an employer
  answer: A
  explanation: Alternative methods of financial responsibility include a $35,000 cash
    deposit with the DMV, a surety bond for $35,000, or a DMV-issued self-insurance
    certificate.
- id: 131
  category: driver_responsibility
  question: If you are involved in a collision and cannot provide proof of financial
    responsibility, how long may your California driver's license be suspended?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: If you are in a collision and do not have insurance, your driving privilege
    will be suspended for one year.
- id: 132
  category: driver_responsibility
  question: In California, you must report a collision that results in injury or death
    to the local police or California Highway Patrol within what time limit?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: B
  explanation: If a collision results in injury or death, it must be reported to law
    enforcement (police or CHP) within 24 hours of the accident.
- id: 133
  category: driver_responsibility
  question: What is the maximum fine for a first-time conviction of littering on a
    California roadway?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Littering on a highway is punishable by a fine of up to $1,000 and
    may require the offender to pick up trash.
- id: 134
  category: driver_responsibility
  question: Under California law, what is the maximum jail sentence for abandoning
    an animal on a highway?
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Abandoning an animal on a highway is a misdemeanor punishable by a
    fine of up to $1,000, 6 months in jail, or both.
- id: 135
  category: driver_responsibility
  question: For most vehicles in California, how often must a smog certification be
    provided to the DMV during the registration renewal process?
  choices:
    A: Every year
    B: Every two years
    C: Every four years
    D: Only when the vehicle is sold
  answer: B
  explanation: Most vehicles in California are required to pass a smog check every
    two years (biennial) for registration renewal.
- id: 136
  category: safe_driving_rules
  question: When may you legally cross a set of double solid yellow lines to enter
    or exit a High-Occupancy Vehicle (HOV) lane in California?
  choices:
    A: Only at designated openings marked with broken lines
    B: Whenever it is safe to do so and traffic is clear
    C: To pass a vehicle traveling below the speed limit
    D: Only during non-commute hours when the lane is open to all
  answer: A
  explanation: California law prohibits crossing double solid lines to enter or exit
    an HOV lane; you must wait for a designated area where the lines are broken or
    there is a specific entry/exit opening.
- id: 137
  category: safe_driving_rules
  question: In California, what does a green painted curb indicate regarding parking
    regulations?
  choices:
    A: You may park for a limited time, usually shown on a sign or the curb
    B: You may stop only to pick up or drop off passengers
    C: You may park only if you have a valid disabled placard
    D: You may stop only to load or unload freight or mail
  answer: A
  explanation: A green curb means you can park for a limited time. Look for a posted
    sign next to the green zone or a time limit painted on the curb.
- id: 138
  category: safe_driving_rules
  question: Under what condition is a driver permitted to make a left turn against
    a red light in California?
  choices:
    A: From a two-way street onto a one-way street
    B: From a one-way street onto another one-way street
    C: From a one-way street onto a two-way street
    D: It is never legal to turn left on a red light in California
  answer: B
  explanation: In California, you may only turn left against a red light when you
    are turning from a one-way street onto another one-way street, provided you stop
    first and yield to traffic and pedestrians.
- id: 139
  category: safe_driving_rules
  question: What is the California speed limit for a blind intersection where you
    cannot see for 100 feet in either direction during the last 100 feet before crossing?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The speed limit for a blind intersection in California is 15 mph. An
    intersection is considered blind if there are no stop signs at any corner and
    you cannot see 100 feet in either direction.
- id: 140
  category: safe_driving_rules
  question: What is the maximum distance a driver is permitted to travel in a center
    left turn lane in California?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: In California, you may only drive for 200 feet in the center left turn
    lane. This lane is reserved for starting or completing left turns or starting
    a permitted U-turn.
- id: 141
  category: safe_driving_rules
  question: What happens to traffic violation fines in California when the offense
    is committed in a highway construction or maintenance zone?
  choices:
    A: The fines are reduced by half if no workers are present
    B: The fines remain the same as standard violations
    C: The fines are doubled
    D: The fines are tripled
  answer: C
  explanation: Under the California Vehicle Code, fines for traffic violations committed
    in highway construction or maintenance zones when workers are present are subject
    to being doubled.
- id: 142
  category: safe_driving_rules
  question: When parking a vehicle headed uphill on a two-way street with a curb in
    California, how should the front wheels be positioned?
  choices:
    A: Turned toward the curb
    B: Turned away from the curb
    C: Parallel to the curb
    D: Turned to the right
  answer: B
  explanation: When parking uphill against a curb, turn your wheels away from the
    curb and let your vehicle roll back a few inches so the back of the front tire
    touches the curb. This prevents the car from rolling into traffic.
- id: 143
  category: defensive_driving
  question: To maintain a safe following distance and avoid tailgating, the California
    Driver’s Handbook recommends using the 'three-second rule' under which of the
    following conditions?
  choices:
    A: Only when driving on residential streets
    B: Only when driving behind large trucks or motorcycles
    C: Under normal weather and traffic conditions
    D: Only when driving at speeds over 65 miles per hour
  answer: C
  explanation: The California Driver’s Handbook recommends the 'three-second rule'
    to maintain a safe following distance behind the vehicle in front of you during
    normal weather and traffic conditions.
- id: 144
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, you should
    scan the road at least how many seconds ahead of your vehicle?
  choices:
    A: 2 to 5 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: 60 seconds
  answer: B
  explanation: Scanning 10 to 15 seconds ahead allows you to see hazards early and
    gives you enough time to react safely to changes in traffic flow.
- id: 145
  category: defensive_driving
  question: According to California law, you must turn on your headlights if weather
    conditions require you to use which of the following vehicle features continuously?
  choices:
    A: The defroster
    B: The air conditioning
    C: The windshield wipers
    D: The hazard lights
  answer: C
  explanation: California Vehicle Code requires drivers to turn on their headlights
    whenever weather conditions (like rain or snow) require the continuous use of
    windshield wipers.
- id: 146
  category: defensive_driving
  question: If your vehicle starts to hydroplane on a wet road and you lose contact
    with the pavement, what is the correct defensive driving response?
  choices:
    A: Brake hard to stop the vehicle as quickly as possible
    B: Turn the steering wheel sharply toward the shoulder
    C: Shift the vehicle into neutral immediately
    D: Gradually slow down and avoid using the brakes
  answer: D
  explanation: If you hydroplane, you should gradually slow down by releasing the
    accelerator and avoid braking, which can cause the vehicle to skid.
- id: 147
  category: defensive_driving
  question: When driving at night in California, you must dim your high-beam headlights
    when an oncoming vehicle is within how many feet?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: California law requires drivers to dim their high beams to low beams
    when an oncoming vehicle is within 500 feet to avoid blinding the other driver.
- id: 148
  category: defensive_driving
  question: When following another vehicle at night, you must dim your high-beam headlights
    when you are within how many feet of that vehicle?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: You must dim your high beams when following another vehicle within
    300 feet to prevent glare in the lead driver's rearview mirror.
- id: 149
  category: defensive_driving
  question: During cold or frosty weather, which parts of the road are most likely
    to hide spots of ice and freeze before the rest of the roadway?
  choices:
    A: Intersections with traffic lights
    B: Bridges and overpasses
    C: Roads in direct sunlight
    D: Steep downhill grades
  answer: B
  explanation: Bridges and overpasses tend to freeze before the rest of the road because
    air circulates both above and below the road surface, causing it to lose heat
    faster.
- id: 150
  category: defensive_driving
  question: When driving in heavy fog or smoke during the day, which light setting
    should you use to increase your visibility to other drivers?
  choices:
    A: High-beam headlights
    B: Parking lights only
    C: Low-beam headlights
    D: Emergency flashers
  answer: C
  explanation: Low-beam headlights should be used in fog because high beams reflect
    off the moisture in the air, creating a glare that makes it harder for you to
    see.
- id: 151
  category: defensive_driving
  question: If another driver is tailgating you, what is the safest defensive driving
    action to take according to the California Driver's Handbook?
  choices:
    A: Tap your brakes repeatedly to warn the driver
    B: Speed up to increase the distance between the vehicles
    C: Slow down gradually or move to another lane to allow them to pass
    D: Turn on your hazard lights and maintain your speed
  answer: C
  explanation: The safest way to handle a tailgater is to create more space in front
    of you by slowing down or moving to the right lane to encourage them to pass.
- id: 152
  category: defensive_driving
  question: To prevent skidding on slippery surfaces, how should you adjust your driving
    behavior?
  choices:
    A: Drive in a lower gear at all times
    B: Slow down before you reach curves and intersections
    C: Pump your brakes quickly when approaching a stop
    D: Follow the vehicle in front of you more closely
  answer: B
  explanation: Slowing down before curves and intersections reduces the risk of losing
    traction and skidding on slippery roads.
- id: 153
  category: defensive_driving
  question: When driving on a wet road, the California Driver’s Handbook suggests
    you should reduce your speed by approximately how much?
  choices:
    A: 2 to 3 miles per hour
    B: 5 to 10 miles per hour
    C: Exactly half the posted speed limit
    D: 15 to 20 miles per hour
  answer: B
  explanation: On a wet road, you should go 5 to 10 mph slower than the posted speed
    limit to maintain control and avoid hydroplaning.
- id: 154
  category: defensive_driving
  question: When you are stopped at an intersection and the light turns green, in
    which order should you scan the area before entering the intersection?
  choices:
    A: Right, left, and right again
    B: Straight ahead, then left
    C: Left, right, and left again
    D: Only toward the direction of oncoming traffic
  answer: C
  explanation: You should look left, right, and left again before entering an intersection
    because the first danger comes from vehicles approaching from the left.
- id: 155
  category: defensive_driving
  question: If you are driving into the sun and experiencing significant glare, what
    is a recommended defensive driving technique to maintain safety?
  choices:
    A: Turn on your high-beam headlights to see through the glare
    B: Keep your windshield clean inside and out
    C: Look directly at the sun to help your eyes adjust
    D: Drive as close to the vehicle in front of you as possible
  answer: B
  explanation: A clean windshield helps reduce glare. Dirt and streaks on the glass
    scatter light and make it much harder to see when driving toward the sun.
- id: 156
  category: alcohol_drugs_health
  question: What is the maximum legal Blood Alcohol Concentration (BAC) limit for
    an individual operating a commercial vehicle in California?
  choices:
    A: 0.01%
    B: 0.04%
    C: 0.08%
    D: 0.05%
  answer: B
  explanation: For drivers operating a vehicle that requires a commercial driver license,
    the legal BAC limit is 0.04% or higher.
- id: 157
  category: alcohol_drugs_health
  question: By the act of driving on California's public roads, you have given your
    consent to take a chemical test for the alcohol content of your blood, breath,
    or urine if requested by law enforcement. What is this law called?
  choices:
    A: The Financial Responsibility Law
    B: The Basic Speed Law
    C: The Implied Consent Law
    D: The Right of Way Law
  answer: C
  explanation: The Implied Consent Law states that by driving in California, you agree
    to submit to a chemical test if you are lawfully arrested for DUI.
- id: 158
  category: alcohol_drugs_health
  question: If you are arrested for driving under the influence in California and
    refuse to submit to a chemical test, what is the immediate consequence for your
    driving privilege?
  choices:
    A: Your license will be suspended or revoked.
    B: You will only be given a warning for the first refusal.
    C: You will be required to pay a small fine and continue driving.
    D: Your vehicle will be permanently confiscated by the state.
  answer: A
  explanation: Refusing a chemical test after being arrested for DUI results in an
    administrative license suspension or revocation by the DMV, regardless of the
    court outcome.
- id: 159
  category: alcohol_drugs_health
  question: Under California law, where is it legal to keep an open container of alcohol
    in a vehicle if the vehicle does not have a trunk?
  choices:
    A: In the glove compartment, as long as it is locked.
    B: Under the driver's seat.
    C: In an area of the vehicle not normally occupied by passengers.
    D: In the center console between the front seats.
  answer: C
  explanation: If a vehicle has no trunk, an open container of alcohol must be kept
    in an area where passengers do not sit. It is illegal to keep it in the glove
    compartment.
- id: 160
  category: alcohol_drugs_health
  question: If you are currently on probation for a previous DUI conviction in California,
    what is the legal Blood Alcohol Concentration (BAC) limit you must stay below
    while driving?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.04%
    D: 0.01%
  answer: D
  explanation: As a condition of DUI probation, you must not drive with a BAC of 0.01%
    or higher at any time.
- id: 161
  category: alcohol_drugs_health
  question: How does California law treat driving under the influence of prescription
    or over-the-counter medications?
  choices:
    A: It is legal as long as the medication was prescribed by a doctor.
    B: It is only illegal if the medication is a narcotic.
    C: It is illegal to drive if the drug impairs your ability to drive safely.
    D: It is legal as long as you have the prescription bottle with you.
  answer: C
  explanation: California law does not distinguish between alcohol, illegal drugs,
    or legal medications; if a substance impairs your driving, you can be convicted
    of a DUI.
- id: 162
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with another drug, such as a cold
    remedy or prescription medicine, on your driving ability?
  choices:
    A: The alcohol usually cancels out the effects of the drug.
    B: The combined effect is often much greater than the sum of the parts.
    C: There is no significant change in driving ability.
    D: The drug will help you sober up faster from the alcohol.
  answer: B
  explanation: Mixing alcohol and drugs can cause a synergistic effect, meaning the
    impairment is significantly worse than if you had used either substance alone.
- id: 163
  category: alcohol_drugs_health
  question: What does the California 'Admin Per Se' law allow a police officer to
    do if you fail or refuse a breath or blood test?
  choices:
    A: Immediately take you to prison for a minimum of one year.
    B: Confiscate your driver's license and issue a temporary 30-day permit.
    C: Permanently cancel your vehicle registration on the spot.
    D: Force you to pay a $5,000 fine to the officer immediately.
  answer: B
  explanation: Under Admin Per Se, the officer takes your California driver's license
    and gives you a temporary license valid for 30 days while the DMV reviews your
    case.
- id: 164
  category: alcohol_drugs_health
  question: According to California law, how must marijuana be stored in a vehicle
    if the driver or passengers are 21 years of age or older?
  choices:
    A: It can be kept anywhere as long as it is less than one ounce.
    B: It must be kept in a sealed container or in the trunk of the vehicle.
    C: It must be kept in the glove box at all times.
    D: It can only be transported if the driver has a medical marijuana card.
  answer: B
  explanation: Similar to alcohol, marijuana must be in a container that has not been
    opened or must be stored in the trunk to avoid 'open container' violations.
- id: 165
  category: alcohol_drugs_health
  question: What is the typical range for a first-offense DUI fine in California,
    excluding penalty assessments and court costs?
  choices:
    A: $100 to $200
    B: $390 to $1,000
    C: $1,500 to $3,000
    D: $5,000 to $10,000
  answer: B
  explanation: A first-time DUI conviction in California carries a base fine of $390
    to $1,000, though total costs with assessments often exceed several thousand dollars.
- id: 166
  category: alcohol_drugs_health
  question: If you have a medical condition that may affect your ability to drive
    safely, what is your responsibility under California law?
  choices:
    A: You must stop driving immediately and never drive again.
    B: You must report the condition to the DMV for a medical evaluation.
    C: You only need to tell your insurance company about the condition.
    D: You do not need to report anything as long as you feel fine.
  answer: B
  explanation: Drivers are required to report conditions like epilepsy, Parkinson's,
    or any condition causing lapses of consciousness to the DMV for evaluation of
    driving safety.
- id: 167
  category: alcohol_drugs_health
  question: According to the California Driver’s Handbook, what is the primary responsibility
    of a designated driver?
  choices:
    A: To drink only one alcoholic beverage per hour.
    B: To drive only if they feel they are under the legal limit.
    C: To remain completely sober and provide safe transportation for others.
    D: To monitor the alcohol intake of the other passengers.
  answer: C
  explanation: A designated driver is someone who stays 100% sober to ensure everyone
    in the group gets home safely.
- id: 168
  category: alcohol_drugs_health
  question: Which of the following factors is the only way to effectively lower your
    Blood Alcohol Concentration (BAC) after consuming alcohol?
  choices:
    A: Drinking several cups of strong black coffee.
    B: Taking a very cold shower.
    C: Exercising or running to sweat out the alcohol.
    D: Giving your body time to process the alcohol.
  answer: D
  explanation: Only time can lower a person's BAC. Coffee, cold showers, and exercise
    do not speed up the liver's ability to process alcohol.
- id: 169
  category: alcohol_drugs_health
  question: In California, what happens to the penalties for a DUI conviction if there
    was a child under 14 years of age in the vehicle at the time of the offense?
  choices:
    A: The penalties remain exactly the same.
    B: The driver is only given a verbal warning regarding the child.
    C: The penalties are increased with an enhanced sentence.
    D: The driver's license is suspended for only 30 days.
  answer: C
  explanation: Under California Vehicle Code, having a minor passenger under 14 during
    a DUI is a 'sentencing enhancement' that leads to mandatory additional jail time.
- id: 170
  category: penalties_and_points
  question: Under the Negligent Operator Treatment System (NOTS), a California driver's
    license will be suspended if they receive how many points within a 12-month period?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: In California, the DMV will suspend your driving privilege if you accumulate
    4 points in 12 months, 6 points in 24 months, or 8 points in 36 months.
- id: 171
  category: penalties_and_points
  question: According to the California DMV, how many points on your driving record
    within a 24-month period will result in a license suspension?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 10 points
  answer: B
  explanation: A driver is considered a negligent operator and subject to license
    suspension if they accumulate 6 points within a 24-month period.
- id: 172
  category: penalties_and_points
  question: A driver in California is considered a negligent operator and may have
    their license suspended if they accumulate how many points within a 36-month period?
  choices:
    A: 6 points
    B: 7 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: The threshold for a negligent operator suspension over a three-year
    (36-month) period is 8 points.
- id: 173
  category: penalties_and_points
  question: In California, how many points are added to your driving record for a
    conviction of reckless driving or driving under the influence?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: More serious violations, such as hit-and-run, reckless driving, or
    DUI, result in 2 points being added to the driver's record.
- id: 174
  category: penalties_and_points
  question: For most standard traffic ticket convictions in California, such as making
    an illegal U-turn or speeding, how many points are added to your driving record?
  choices:
    A: 1 point
    B: 2 points
    C: 1/2 point
    D: 3 points
  answer: A
  explanation: Most minor traffic convictions, like speeding or failing to stop at
    a sign, result in 1 point on your driving record.
- id: 175
  category: penalties_and_points
  question: What is the maximum fine for a person convicted of smoking in a vehicle
    when a minor is present in California?
  choices:
    A: Up to $50
    B: Up to $100
    C: Up to $250
    D: Up to $500
  answer: B
  explanation: It is illegal to smoke in a vehicle at any time when a minor is present,
    and the violation is punishable by a fine of up to $100.
- id: 176
  category: penalties_and_points
  question: If a person is convicted of causing serious bodily injury while attempting
    to evade law enforcement, what is the minimum state prison sentence?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 10 years
  answer: C
  explanation: A person convicted of causing serious bodily injury during the course
    of a police pursuit is subject to imprisonment in a state prison for 3, 5, or
    7 years.
- id: 177
  category: penalties_and_points
  question: If a person aged 13 to 21 is convicted of vandalism or graffiti, for how
    long may the court suspend their California driving privilege?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until they turn 21
  answer: B
  explanation: California law allows the court to suspend the driving privilege for
    up to 1 year for individuals convicted of vandalism, including graffiti.
- id: 178
  category: penalties_and_points
  question: How many points are typically assigned to your California driving record
    if you are found to be at fault in a traffic accident?
  choices:
    A: 0 points
    B: 1 point
    C: 2 points
    D: 3 points
  answer: B
  explanation: If you are involved in an accident and found to be at fault, the DMV
    typically assigns 1 point to your driving record.
- id: 179
  category: penalties_and_points
  question: Within how many days must you file a Report of Traffic Accident Occurring
    in California (SR 1) with the DMV if there is property damage over $1,000?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: You must report an accident to the DMV within 10 days if anyone was
    injured, killed, or if property damage exceeded $1,000.
- id: 180
  category: penalties_and_points
  question: If you fail to provide evidence of financial responsibility (insurance)
    when involved in an accident, what is the mandatory license suspension period?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 4 years
  answer: B
  explanation: If you are in an accident and do not have insurance, your driving privilege
    will be suspended for up to 4 years, but you may apply for a restricted license
    after 1 year.
- id: 181
  category: penalties_and_points
  question: What is the consequence for a driver with a provisional license who receives
    their first 'at-fault' accident or moving violation conviction?
  choices:
    A: A warning letter from the DMV
    B: A 30-day license suspension
    C: A mandatory driver education course
    D: A $500 fine
  answer: A
  explanation: For the first 'at-fault' accident or conviction of a traffic law violation,
    the DMV sends a warning letter to the provisional licensee.
- id: 182
  category: penalties_and_points
  question: If a provisional licensee receives a second 'at-fault' accident or moving
    violation conviction within 12 months, what is the resulting penalty?
  choices:
    A: A 10-day jail sentence
    B: A 30-day restriction to drive only with a parent or licensed adult
    C: A permanent revocation of the license
    D: A $1,000 fine
  answer: B
  explanation: After a second 'at-fault' accident or conviction within 12 months,
    the driver cannot drive for 30 days unless accompanied by a licensed parent or
    adult at least 25 years old.
- id: 183
  category: penalties_and_points
  question: For how many years do most standard traffic convictions, such as speeding
    or illegal turns, remain on a California driving record?
  choices:
    A: 1 year
    B: 3 years
    C: 7 years
    D: 10 years
  answer: B
  explanation: Most traffic convictions and accidents stay on your record for 36 months
    (3 years), though some more serious violations stay longer.
- id: 184
  category: penalties_and_points
  question: In California, a conviction for driving at a speed greater than 100 miles
    per hour results in how many points on your driving record?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Driving over 100 mph is a serious violation in California and results
    in 2 points being added to the driver's record.
- id: 185
  category: sharing_the_road
  question: In California, who has the right-of-way at an intersection where there
    are no marked crosswalks?
  choices:
    A: Drivers always have the right-of-way over pedestrians at unmarked intersections.
    B: Pedestrians have the right-of-way at every intersection, even if the crosswalk
      is not marked.
    C: The person who arrives at the intersection first always has the right-of-way.
    D: Pedestrians only have the right-of-way if they are using a designated crosswalk
      with painted lines.
  answer: B
  explanation: In California, every intersection where streets meet at approximately
    right angles has an 'unmarked crosswalk,' and drivers must yield the right-of-way
    to pedestrians.
- id: 186
  category: sharing_the_road
  question: When you see a blind pedestrian with a white cane or a guide dog at a
    street corner, what is the recommended distance to stop your vehicle from the
    crosswalk?
  choices:
    A: You should stop at least 15 feet away so the pedestrian is not frightened by
      your engine.
    B: You should stop within 5 feet of the crosswalk so the pedestrian can hear your
      engine.
    C: You should stop exactly at the limit line and honk your horn to let them know
      you are there.
    D: You should stop only if the pedestrian has already stepped into the roadway.
  answer: B
  explanation: Stopping within 5 feet of the crosswalk is important because blind
    pedestrians use the sound of the engine to confirm a vehicle is stopped and to
    determine the direction of traffic.
- id: 187
  category: sharing_the_road
  question: According to the California Three Feet for Safety Act, what is the minimum
    distance a driver must maintain when passing a bicyclist traveling in the same
    direction?
  choices:
    A: A driver must maintain at least 2 feet of space.
    B: A driver must maintain at least 3 feet of space.
    C: A driver must maintain at least 5 feet of space.
    D: A driver must maintain enough space so that their side mirror does not touch
      the bicyclist.
  answer: B
  explanation: California law requires drivers to provide at least three feet of clearance
    when passing a bicyclist. If three feet is not possible, the driver must slow
    down and pass only when safe.
- id: 188
  category: sharing_the_road
  question: When you are preparing to make a right turn and there is a bicycle lane,
    how many feet before the turn are you permitted to enter the bicycle lane?
  choices:
    A: You may enter the lane 50 feet before the intersection.
    B: You may enter the lane 100 feet before the intersection.
    C: You may enter the lane 200 feet before the intersection.
    D: You are never permitted to drive in a bicycle lane, even when turning.
  answer: C
  explanation: In California, you must check for bicyclists and enter the bicycle
    lane no more than 200 feet before starting your right turn.
- id: 189
  category: sharing_the_road
  question: What is the California law regarding 'lane splitting' for motorcyclists
    on roadways?
  choices:
    A: Lane splitting is strictly prohibited on all California highways.
    B: Lane splitting is only legal for emergency responders on motorcycles.
    C: Lane splitting is legal in California if it is done in a safe and prudent manner.
    D: Lane splitting is legal only when traffic is moving at speeds greater than
      50 mph.
  answer: C
  explanation: California is the first state to formally allow lane splitting, which
    is defined as a motorcycle riding between rows of stopped or moving vehicles in
    the same lane.
- id: 190
  category: sharing_the_road
  question: Why should you avoid lingering in the 'No Zone' areas of a large truck
    or commercial vehicle?
  choices:
    A: Truck drivers are required to change lanes frequently and may hit you.
    B: The air turbulence from the truck will cause your vehicle to lose control.
    C: These are blind spots where the truck driver cannot see your vehicle.
    D: It is illegal to drive beside a truck for more than 30 seconds in California.
  answer: C
  explanation: Large trucks have large blind spots called 'No Zones' on the sides,
    front, and rear. If you cannot see the truck driver's face in their side mirror,
    they cannot see you.
- id: 191
  category: sharing_the_road
  question: When a large truck is turning right onto a street with two lanes in each
    direction, what should you expect the truck driver to do?
  choices:
    A: The truck will always stay in the far right lane throughout the turn.
    B: The truck may need to swing wide to the left to complete the turn.
    C: The truck will stop and wait for all traffic to clear before turning.
    D: The truck will speed up to ensure the trailer clears the curb.
  answer: B
  explanation: Because of their length, large trucks often need to swing wide to the
    left to make a right turn without the rear wheels climbing over the curb.
- id: 192
  category: sharing_the_road
  question: If you are driving on a multilane highway divided by a physical barrier,
    what is the rule for stopping when a school bus on the opposite side has flashing
    red lights?
  choices:
    A: You must stop until the red lights stop flashing.
    B: You must slow down to 15 mph but do not need to stop.
    C: You do not need to stop if the bus is on the other side of a physical barrier
      or divider.
    D: You must stop only if there are children currently crossing the highway.
  answer: C
  explanation: Under California law, you do not need to stop for a school bus with
    flashing red lights if it is on the other side of a divided or multilane highway
    (two or more lanes in each direction) with a physical barrier.
- id: 193
  category: sharing_the_road
  question: What is the maximum fine for a first-time conviction of failing to stop
    for a school bus with flashing red lights and an extended stop arm in California?
  choices:
    A: A fine of up to $100.
    B: A fine of up to $250.
    C: A fine of up to $500.
    D: A fine of up to $1,000.
  answer: D
  explanation: Failing to stop for a school bus with flashing red lights is a serious
    offense in California, carrying a fine of up to $1,000 and a potential one-year
    license suspension.
- id: 194
  category: sharing_the_road
  question: Under the California 'Move Over' law, what must a driver do when approaching
    a stationary emergency vehicle with flashing emergency lights on a freeway?
  choices:
    A: Stop immediately in the lane of travel until the emergency is over.
    B: Move to a lane that is not next to the emergency vehicle, if it is safe to
      do so.
    C: Maintain your speed and stay in your lane to avoid disrupting traffic.
    D: Speed up to pass the scene as quickly as possible.
  answer: B
  explanation: The 'Move Over' law requires drivers to move over a lane or slow down
    significantly when approaching stationary emergency vehicles, tow trucks, or marked
    Department of Transportation vehicles with flashing lights.
- id: 195
  category: sharing_the_road
  question: In California, it is illegal to follow within how many feet of any fire
    engine, police vehicle, or ambulance that has a siren or flashing lights on?
  choices:
    A: 100 feet.
    B: 200 feet.
    C: 300 feet.
    D: 500 feet.
  answer: C
  explanation: California law prohibits following within 300 feet of any emergency
    vehicle with a siren or flashing lights, as this can interfere with their ability
    to maneuver or respond.
- id: 196
  category: sharing_the_road
  question: What does a fluorescent orange triangle with a red border on the back
    of a vehicle indicate to other drivers?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is a slow-moving vehicle traveling less than 25 mph.
    C: The vehicle is an oversized load that requires extra room.
    D: The vehicle is a student driver or a driver in training.
  answer: B
  explanation: Farm tractors, road maintenance vehicles, and animal-drawn carts display
    this emblem to warn drivers that the vehicle travels at speeds of 25 mph or less.
- id: 197
  category: sharing_the_road
  question: If there are no sidewalks available, in which direction should a pedestrian
    walk along the roadway?
  choices:
    A: In the same direction as the flow of traffic.
    B: Facing oncoming traffic so they can see approaching vehicles.
    C: On the right-hand shoulder of the road at all times.
    D: In the center of the lane to ensure they are visible to drivers.
  answer: B
  explanation: Pedestrians should walk facing oncoming traffic when there are no sidewalks,
    as this allows them to see and react to vehicles approaching from the opposite
    direction.
- id: 198
  category: vehicle_information
  question: In California, it is illegal to drive a passenger vehicle with tires that
    have a tread depth of less than what amount?
  choices:
    A: 1/4 of an inch
    B: 1/16 of an inch
    C: 1/32 of an inch
    D: 1/8 of an inch
  answer: C
  explanation: According to California Vehicle Code 27465(b), the legal minimum tread
    depth for most passenger vehicle tires is 1/32 of an inch.
- id: 199
  category: vehicle_information
  question: When must you turn on your headlights during the day due to weather conditions
    in California?
  choices:
    A: Only when it is raining hard enough to cause a flood.
    B: Whenever you are using your windshield wipers in continuous use due to rain
      or snow.
    C: Only when visibility is less than 100 feet.
    D: Only when driving on a two-lane mountain road.
  answer: B
  explanation: California law requires drivers to turn on low-beam headlights whenever
    they are using windshield wipers in continuous use due to rain, snow, or fog.
- id: 200
  category: vehicle_information
  question: In California, where are you permitted to place a sticker that is up to
    seven square inches in size on your windshield?
  choices:
    A: In the center of the windshield behind the rearview mirror.
    B: In the lower corner of the windshield on the passenger side.
    C: In the lower corner of the windshield on the driver side.
    D: Anywhere as long as it does not block the driver's view of the road.
  answer: B
  explanation: California law allows stickers up to 7 square inches in the lower corner
    of the passenger side or up to 5 square inches in the lower corner of the driver
    side.
- id: 201
  category: vehicle_information
  question: Which of the following is a requirement for the exhaust system of a passenger
    vehicle in California?
  choices:
    A: It must be modified to be as loud as possible for safety.
    B: It must be equipped with a muffler and not emit excessive smoke.
    C: It must be disconnected when driving in rural areas.
    D: It must be replaced every 50,000 miles regardless of condition.
  answer: B
  explanation: California law requires all vehicles to be equipped with an adequate
    muffler to prevent excessive noise and smoke.
- id: 202
  category: vehicle_information
  question: What is the maximum noise level allowed for a replacement exhaust system
    on a passenger vehicle weighing less than 6,000 pounds in California?
  choices:
    A: 80 decibels
    B: 95 decibels
    C: 110 decibels
    D: 120 decibels
  answer: B
  explanation: Under California law, replacement exhaust systems for passenger vehicles
    must not exceed a sound level of 95 decibels.
- id: 203
  category: vehicle_information
  question: According to the California Driver’s Handbook, how far should you sit
    from the steering wheel to allow the airbag to deploy safely?
  choices:
    A: At least 5 inches
    B: At least 10 inches
    C: At least 15 inches
    D: At least 20 inches
  answer: B
  explanation: The DMV recommends sitting at least 10 inches away from the steering
    wheel to prevent injury from the airbag during deployment.
- id: 204
  category: vehicle_information
  question: Under California law, children under what age must be secured in a rear-facing
    child passenger restraint system unless they weigh 40 pounds or more?
  choices:
    A: 1 year old
    B: 2 years old
    C: 4 years old
    D: 6 years old
  answer: B
  explanation: Children under 2 years old must be secured in a rear-facing seat unless
    they weigh 40 pounds or more or are 40 inches tall or more.
- id: 205
  category: vehicle_information
  question: What is the minimum light transmission required for aftermarket tinting
    on the front side windows of a California vehicle?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 88%
  answer: C
  explanation: California law requires that aftermarket tinting on front side windows
    allow at least 70% light transmission.
- id: 206
  category: vehicle_information
  question: In California, every vehicle must be equipped with a mirror that allows
    the driver to see the road for a distance of at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: California Vehicle Code requires mirrors that provide a view of the
    highway for a distance of at least 200 feet to the rear.
- id: 207
  category: vehicle_information
  question: How often must most vehicles in California undergo a Smog Check for registration
    renewal?
  choices:
    A: Every year
    B: Every two years
    C: Every five years
    D: Only when the vehicle is sold
  answer: B
  explanation: In California, most vehicles are required to pass a smog inspection
    every two years for registration renewal.
- id: 208
  category: vehicle_information
  question: When is it legal to use your vehicle's horn in California?
  choices:
    A: To signal a friend on the sidewalk.
    B: To express anger at another driver's mistake.
    C: To warn other drivers of a hazard or to avoid a collision.
    D: To let a driver in front of you know the light has turned green.
  answer: C
  explanation: The horn should only be used to warn other drivers of a safety hazard
    or when it is reasonably necessary to avoid an accident.
