questions:
- id: 1
  category: driver_responsibility
  question: 'Según la Guía del Conductor de Louisiana, conducir se considera un(a):'
  choices:
    A: Derecho constitucional
    B: Privilegio que conlleva grandes responsabilidades
    C: Requisito para todos los ciudadanos
    D: Pasatiempo solo para el ocio
  answer: B
  explanation: 'El mensaje del Comisionado establece: ''La experiencia de conducir,
    sin embargo, es un privilegio y conlleva grandes responsabilidades''.'
- id: 2
  category: driver_responsibility
  question: ¿Se considera la Guía del Conductor de Louisiana una referencia legal
    oficial de las leyes de tránsito de Louisiana?
  choices:
    A: Sí, contiene todas las leyes oficiales en su totalidad.
    B: No, solo destaca aquellas leyes, prácticas de conducción y procedimientos que
      se utilizan con más frecuencia.
    C: Sí, pero solo para conductores de Clase D y E.
    D: No, está destinada únicamente a conductores de fuera del estado.
  answer: B
  explanation: 'El manual establece explícitamente: ''Esta guía no pretende ser una
    referencia legal oficial de las leyes de tránsito de Louisiana. Solo destaca aquellas
    leyes, prácticas de conducción y procedimientos que utilizará con más frecuencia''.'
- id: 3
  category: safe_driving_rules
  question: ¿Qué les recuerda específicamente el mensaje del Comisionado a los conductores
    con respecto a los cinturones de seguridad?
  choices:
    A: Reemplazarlos cada 5 años.
    B: Abrocharse el cinturón porque los cinturones de seguridad salvan vidas.
    C: Usarlos solo cuando se conduce por la carretera interestatal.
    D: Quitárselos si resultan incómodos.
  answer: B
  explanation: 'El mensaje del Comisionado concluye con el recordatorio: ''Recuerde
    abrocharse el cinturón. Los cinturones de seguridad salvan vidas''.'
- id: 4
  category: driver_responsibility
  question: ¿Por qué el material de la guía del conductor está sujeto a cambios?
  choices:
    A: Para cumplir con las legislaciones estatales y federales enmendadas.
    B: Porque el Comisionado cambia cada año.
    C: Para hacer que el examen escrito sea más difícil para los nuevos conductores.
    D: Porque las señales de tránsito cambian de color con frecuencia.
  answer: A
  explanation: El texto señala que 'el material de esta guía está sujeto a cambios
    para cumplir con las legislaciones estatales y federales enmendadas'.
- id: 5
  category: license_system
  question: Según el Índice, ¿qué capítulo de la guía cubre el Programa de Licencias
    Graduadas (GDL)?
  choices:
    A: Capítulo 1
    B: Capítulo 3
    C: Capítulo 5
    D: Capítulo 7
  answer: A
  explanation: 'El Índice enumera el ''PROGRAMA DE LICENCIAS GRADUADAS'' en el Capítulo
    1: Obtención de una licencia de conducir.'
- id: 6
  category: safe_driving_rules
  question: ¿Cuántos componentes principales se describe que tiene el Sistema de Transporte
    por Carretera en el Capítulo 2?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: El Capítulo 2 del Índice incluye una sección titulada 'TRES COMPONENTES
    PRINCIPALES' bajo el Sistema de Transporte por Carretera.
- id: 7
  category: driver_responsibility
  question: ¿Cuál de los siguientes temas de prevención de fraude se trata en el Capítulo
    6?
  choices:
    A: Fraude de tarjetas de crédito
    B: Robo de identidad
    C: Fraude de seguros de automóviles
    D: Fraude inmobiliario
  answer: C
  explanation: El Índice del Capítulo 6 enumera el 'FRAUDE DE SEGUROS DE AUTOMÓVILES'
    como uno de los temas tratados.
- id: 8
  category: vehicle_information
  question: ¿Cómo se llama la sección de consejos en el Capítulo 6 diseñada para prevenir
    el robo de automóviles?
  choices:
    A: Ciérrelo o piérdalo (Lock It or Lose It)
    B: Estacione con inteligencia (Park Smart)
    C: Llaves seguras
    D: Antirrobo 101
  answer: B
  explanation: El Capítulo 6 incluye una sección titulada 'CONSEJOS PARA PREVENIR
    EL ROBO DE AUTOMÓVILES – “ESTACIONE CON INTELIGENCIA” (PARK SMART)'.
- id: 9
  category: sharing_the_road
  question: Según el Índice, ¿el Capítulo 5 trata sobre compartir la carretera con
    cuáles de los siguientes?
  choices:
    A: Peatones y autobuses escolares
    B: Bicicletas, motocicletas y camiones grandes
    C: Trenes y trenes ligeros
    D: Carruajes tirados por caballos
  answer: B
  explanation: El Capítulo 5 enumera secciones para 'COMPARTIR LA CARRETERA CON BICICLETAS',
    'COMPARTIR LA CARRETERA CON MOTOCICLETAS' y 'COMPARTIR LA CARRETERA CON CAMIONES
    GRANDES'.
- id: 10
  category: sharing_the_road
  question: ¿Qué tipo de vehículos se abordan específicamente en el Capítulo 7 con
    respecto a la conducción por carreteras interestatales y caminos rurales?
  choices:
    A: Vehículos de emergencia
    B: Vehículos de movimiento lento
    C: Autobuses escolares
    D: Camiones de materiales peligrosos
  answer: B
  explanation: El Índice del Capítulo 7 incluye una sección específica titulada 'VEHÍCULOS
    DE MOVIMIENTO LENTO'.
- id: 11
  category: defensive_driving
  question: ¿En el Capítulo 4, qué factor ambiental específico se menciona que afecta
    la conducción?
  choices:
    A: Cambios estacionales
    B: Altas altitudes
    C: Eclipses solares
    D: Campos magnéticos
  answer: A
  explanation: El Capítulo 4 incluye una sección titulada 'CAMBIOS ESTACIONALES Y
    CÓMO AFECTAN LA CONDUCCIÓN'.
- id: 12
  category: defensive_driving
  question: ¿Cuál de los siguientes problemas de comportamiento al conducir se cubre
    específicamente en el Capítulo 5?
  choices:
    A: Enviar mensajes de texto al conducir
    B: Conducción agresiva/Furia al volante (Road rage)
    C: Comer al conducir
    D: Conducir con mascotas
  answer: B
  explanation: El índice del Capítulo 5 enumera 'CONDUCCIÓN AGRESIVA/FURIA AL VOLANTE'
    como un tema.
- id: 13
  category: penalties_and_points
  question: Según el índice, ¿dónde buscaría información sobre la revocación de su
    licencia?
  choices:
    A: Capítulo 1
    B: Capítulo 2
    C: Capítulo 4
    D: Capítulo 6
  answer: A
  explanation: El tema 'REVOCACIÓN DE SU LICENCIA' aparece en el Capítulo 1 del índice.
- id: 14
  category: driver_responsibility
  question: 'La guía está diseñada para proporcionar a los conductores las reglas
    de tránsito, información sobre seguridad y conocimientos para ayudar a:'
  choices:
    A: Aprobar el examen de habilidades viales al primer intento
    B: Tomar mejores decisiones al conducir
    C: Convertirse en un instructor de manejo certificado
    D: Evitar todas las multas de tránsito
  answer: B
  explanation: 'El mensaje del Comisionado establece: ''Esta guía está diseñada para
    proporcionarle las reglas de tránsito, conocimientos para ayudarle a tomar mejores
    decisiones al conducir...'''
- id: 15
  category: defensive_driving
  question: ¿El Capítulo 6 incluye consejos para evitar convertirse en víctima de
    qué tipo específico de accidente?
  choices:
    A: Un accidente de atropello y fuga (hit-and-run)
    B: Un accidente automovilístico provocado
    C: Una colisión múltiple
    D: Un accidente relacionado con el clima
  answer: B
  explanation: El Capítulo 6 del índice incluye la sección 'CONSEJOS PARA EVITAR CONVERTIRSE
    EN VÍCTIMA DE UN ACCIDENTE AUTOMOVILÍSTICO PROVOCADO'.
- id: 16
  category: safe_driving_rules
  question: ¿Cuándo debe llevar consigo su licencia de conducir?
  choices:
    A: Solo cuando conduzca en autopistas interestatales
    B: Siempre que conduzca
    C: Solo cuando conduzca un vehículo comercial
    D: Solo si ha tenido una infracción de tránsito previa
  answer: B
  explanation: 'El manual establece explícitamente: ''Lleve siempre su licencia consigo
    cuando conduzca''.'
- id: 17
  category: license_system
  question: ¿Cuántos días tienen los nuevos residentes de Louisiana para obtener una
    licencia de conducir de Louisiana desde el momento en que se establece la residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según el manual, 'Los nuevos residentes tienen 30 días desde el momento
    en que se establece la residencia para obtener una licencia de Louisiana'.
- id: 18
  category: license_system
  question: ¿Cuánto tiempo se le permite conducir en Louisiana a un no residente que
    posee una licencia válida emitida por otro estado?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El manual establece que los no residentes que poseen una licencia válida
    emitida por otro estado pueden conducir en Louisiana por un período de 90 días.
- id: 19
  category: license_system
  question: ¿Qué debe poseer un estudiante no residente para estar exento de obtener
    una licencia de conducir de Louisiana?
  choices:
    A: Una licencia de conducir válida de su estado de origen y una tarjeta de identificación
      de estudiante vigente
    B: Una tarjeta de identificación de estudiante de Louisiana y un pasaporte
    C: Una carta de su universidad y un certificado de nacimiento
    D: Una licencia de conducir válida de su estado de origen y prueba de seguro de
      Louisiana
  answer: A
  explanation: Los estudiantes no residentes están exentos si 'poseen tanto una licencia
    de conducir válida emitida por su estado de origen como una tarjeta de identificación
    de estudiante vigente'.
- id: 20
  category: license_system
  question: ¿Cuál de las siguientes personas NO está obligada a obtener una licencia
    de conducir de Louisiana?
  choices:
    A: Un nuevo residente que se mudó a Louisiana hace 45 días
    B: Una persona que opera un tractor agrícola temporalmente en la carretera
    C: Un no residente que ha estado conduciendo en el estado durante 100 días
    D: Un residente que conduce un vehículo personal para el comercio
  answer: B
  explanation: El manual enumera las excepciones para obtener una licencia de Louisiana,
    que incluye a 'Cualquier persona que opere un tractor agrícola, implementos agrícolas
    o maquinaria vial temporalmente en la carretera'.
- id: 21
  category: license_system
  question: ¿Una licencia de conducir Clase "E" permite la operación de cualquier
    vehículo motorizado individual por debajo de qué peso bruto del vehículo?
  choices:
    A: 10,001 libras
    B: 15,001 libras
    C: 20,001 libras
    D: 26,001 libras
  answer: A
  explanation: Una licencia Clase "E" permite la operación de "cualquier vehículo
    motorizado individual de menos de 10,001 libras, vehículos recreativos y ciertos
    vehículos de uso agrícola no definidos como vehículos comerciales".
- id: 22
  category: license_system
  question: 'Una licencia de conducir Clase "D" le permite operar un solo vehículo
    utilizado en el comercio con una clasificación de peso bruto del vehículo de:'
  choices:
    A: Menos de 10,001 libras
    B: 10,001 libras o más, pero menos de 26,001 libras
    C: 26,001 libras o más
    D: Exactamente 30,000 libras
  answer: B
  explanation: La Clase "D" permite la operación de cualquier vehículo individual
    utilizado en el comercio que tenga una clasificación de peso bruto del vehículo
    de "10,001 libras o más, pero menos de 26,001 libras".
- id: 23
  category: license_system
  question: 'Bajo una licencia Clase "D", usted puede remolcar un vehículo siempre
    que la clasificación de peso bruto del vehículo remolcado no exceda las:'
  choices:
    A: 5,000 libras
    B: 10,000 libras
    C: 15,000 libras
    D: 26,001 libras
  answer: B
  explanation: Una licencia Clase "D" permite remolcar un vehículo "que no exceda
    las 10,000 libras de clasificación de peso bruto del vehículo", siempre que el
    peso combinado sea inferior a 26,001 libras.
- id: 24
  category: license_system
  question: Si conduce en el comercio interestatal, ¿qué estándares adicionales debe
    cumplir?
  choices:
    A: Estándares físicos del Departamento de Transporte (DOT)
    B: Estándares de visión de la Administración Federal de Aviación (FAA)
    C: Estándares de aptitud física de la Policía Estatal de Louisiana
    D: Estándares de materiales peligrosos (hazmat) de la Licencia de Conducir Comercial
      (CDL)
  answer: A
  explanation: 'El manual señala: "Si conduce en el comercio interestatal, también
    debe cumplir con los estándares físicos del Departamento de Transporte (DOT)".'
- id: 25
  category: license_system
  question: ¿Cuál es el plazo estándar (duración) de una licencia de conducir Clase
    "E" en Louisiana?
  choices:
    A: 2 años
    B: 4 años
    C: 6 años
    D: 8 años
  answer: C
  explanation: Según la tabla de Tarifas para Licencias de Conducir y Tarjetas de
    Identificación, el plazo para una licencia Clase E es de 6 años.
- id: 26
  category: license_system
  question: ¿Cuál es la tarifa total y el plazo para una tarjeta de identificación
    para un solicitante que tiene 60 años de edad o más?
  choices:
    A: $22.00 por 4 años
    B: $0.00 por un plazo de por vida
    C: $11.00 por 2 años
    D: $16.00 por 6 años
  answer: B
  explanation: La tabla de tarifas muestra que una tarjeta de identificación (para
    mayores de 60 años) tiene una tarifa total de $0.00 y es válida por un plazo "de
    por vida".
- id: 27
  category: driver_responsibility
  question: ¿Qué debe hacer si un oficial de la ley le pide ver su licencia de conducir?
  choices:
    A: Está obligado a mostrársela
    B: Solo tiene que mostrarla si cometió una infracción de tránsito
    C: Puede negarse a menos que tengan una orden judicial
    D: Tiene 24 horas para presentarla en una estación de policía
  answer: A
  explanation: 'El manual establece: "Usted está obligado a mostrar su licencia a
    cualquier oficial de la ley o a cualquier oficial que solicite verla".'
- id: 28
  category: license_system
  question: ¿Se puede utilizar una licencia Clase "D" para el transporte de pasajeros
    por alquiler o tarifa?
  choices:
    A: No, solo las licencias Clase "A" permiten el transporte de pasajeros
    B: Sí, siempre que el uso no entre dentro de la definición de vehículos de las
      clases "A", "B" o "C"
    C: Sí, pero solo si el vehículo pesa más de 26,001 libras
    D: No, la Clase "D" es estrictamente para vehículos agrícolas
  answer: B
  explanation: 'El manual establece: "Se puede utilizar una licencia clase ''D'' para
    el transporte de pasajeros por alquiler o tarifa, siempre que el uso de la misma
    no entre dentro de la definición de vehículos de las clases ''A'', ''B'' o ''C''".'
- id: 29
  category: license_system
  question: ¿Quién está exento de pagar la tarifa de manejo de $12.00 en la Oficina
    de Vehículos Motorizados (OMV)?
  choices:
    A: Solicitantes por primera vez menores de 18 años
    B: Solicitantes de 60 años o más que soliciten una tarjeta de identificación o
      un duplicado de la misma
    C: Nuevos residentes que transfieren una licencia de otro estado
    D: Veteranos que presenten un formulario DD-214
  answer: B
  explanation: El manual establece que hay una tarifa de manejo de $12.00, excepto
    para las tarjetas de identificación y los duplicados de tarjetas de identificación
    para solicitantes de 60 años o más.
- id: 30
  category: license_system
  question: ¿Son aceptables las fotocopias de los documentos de identificación al
    solicitar una licencia de conducir de Louisiana?
  choices:
    A: Sí, pero solo si están notarizadas.
    B: Sí, si son claras y legibles.
    C: No, las fotocopias no son aceptables, ya sea que estén notarizadas o no.
    D: Sí, pero solo para documentos secundarios.
  answer: C
  explanation: De acuerdo con los requisitos de identificación, todos los documentos
    deben ser originales o copias certificadas. Las fotocopias no son aceptables,
    ya sea que estén notarizadas o no.
- id: 31
  category: license_system
  question: ¿Cuál de las siguientes es una combinación aceptable de documentos de
    identificación para un solicitante por primera vez?
  choices:
    A: Un documento principal y uno secundario
    B: Tres documentos secundarios
    C: Un documento principal y dos secundarios
    D: Dos documentos secundarios y una identificación con foto
  answer: C
  explanation: Los solicitantes por primera vez deben proporcionar un documento principal
    y dos secundarios, dos documentos principales, o una tarjeta de identificación
    de Louisiana con foto y el número de Seguro Social (SSN) en el archivo.
- id: 32
  category: license_system
  question: Si se ha otorgado la custodia compartida, ¿quién debe firmar la solicitud
    para un solicitante de diecisiete años o menos?
  choices:
    A: Ambos padres deben firmar la solicitud.
    B: Solo el padre domiciliario puede firmar.
    C: Cualquier adulto legal mayor de 21 años.
    D: El padre que no tiene la custodia.
  answer: B
  explanation: El manual especifica que para los solicitantes de diecisiete años o
    menos, solo el padre domiciliario puede firmar si se ha otorgado la custodia compartida.
- id: 33
  category: license_system
  question: ¿Cuánto tiempo tienen los nuevos residentes para obtener una licencia
    de conducir de Louisiana después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes tienen 30 días desde el momento en que se establece
    la residencia para obtener una licencia de Louisiana.
- id: 34
  category: driver_testing
  question: ¿Qué examen deben aprobar todos los solicitantes de una licencia de conducir
    de Louisiana al transferir una licencia de otro estado?
  choices:
    A: Un examen de conocimientos por escrito
    B: Una prueba de habilidades viales
    C: Un examen de la vista
    D: Un curso de conducción defensiva
  answer: C
  explanation: Todos los solicitantes de una licencia de conducir de Louisiana, incluidas
    las transferencias de otros estados, deben aprobar un examen de la vista administrado
    por el personal de la Oficina de Vehículos Motorizados (OMV).
- id: 35
  category: license_system
  question: Para cumplir con la Ley del Servicio Militar Selectivo, ¿quién debe proporcionar
    un número de Seguro Social al solicitar una licencia o identificación?
  choices:
    A: Todos los solicitantes menores de 18 años
    B: Ciudadanos estadounidenses varones o inmigrantes de 15 a 26 años
    C: Todos los solicitantes varones independientemente de su edad
    D: Solo los solicitantes que solicitan una Licencia de Conducir Comercial (CDL)
  answer: B
  explanation: Para cumplir con la Ley del Servicio Militar Selectivo, se requiere
    el número de Seguro Social de todos los ciudadanos estadounidenses varones o inmigrantes
    de 15 a 26 años que soliciten una licencia de conducir o una tarjeta de identificación.
- id: 36
  category: license_system
  question: Para los solicitantes de 15 a 17 años, ¿qué antigüedad máxima puede tener
    el formulario de inscripción escolar requerido?
  choices:
    A: No más de 30 días
    B: No más de 60 días
    C: No más de 90 días
    D: No más de 180 días
  answer: C
  explanation: El formulario de inscripción escolar obtenido de la escuela en la que
    el solicitante está inscrito actualmente no puede tener más de 90 días de antigüedad.
- id: 37
  category: license_system
  question: ¿Cuántos días deben quedar en una VISA/I-94 para que un extranjero no
    inmigrante sea considerado para la emisión de una licencia de conducir?
  choices:
    A: Al menos 30 días
    B: Al menos 60 días
    C: Al menos 90 días
    D: Al menos 180 días
  answer: D
  explanation: Para que se le emita una licencia de conducir o una tarjeta de identificación,
    deben quedar AL MENOS 180 DÍAS en su VISA/I-94 para ser considerado para la emisión.
- id: 38
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para obtener un permiso de aprendizaje
    Clase E en Louisiana?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 17 años de edad
  answer: B
  explanation: El requisito de edad mínima para un permiso de aprendizaje Clase E
    es de quince (15) años, y el solicitante debe completar todas las etapas del Programa
    de Licencias Graduadas (GDL).
- id: 39
  category: license_system
  question: ¿Cuál es la edad mínima para viajar entre estados o para obtener un endoso
    de materiales peligrosos para una licencia Clase A, B o C?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: Para las licencias Clase A, B o C, la edad mínima es de veintiún (21)
    años para viajar entre estados o para obtener un endoso de materiales peligrosos.
- id: 40
  category: license_system
  question: ¿Cuál de los siguientes documentos se clasifica como un documento PRINCIPAL
    aceptable?
  choices:
    A: Tarjeta de identificación universitaria de Louisiana
    B: Tarjeta de Medicare / Medicaid
    C: Certificado de nacimiento original
    D: Foto del anuario de la escuela secundaria
  answer: C
  explanation: Un certificado de nacimiento original figura en la lista de documentos
    principales aceptables. Las otras opciones se consideran documentos secundarios.
- id: 41
  category: license_system
  question: Si se va a transferir a Louisiana pero ha perdido su licencia con foto
    de otro estado, ¿qué debe presentar?
  choices:
    A: Una declaración jurada ante notario de la pérdida de la licencia
    B: Una carta de liquidación (clearance) o un historial de conducción oficial de
      su último estado de residencia
    C: Tres documentos primarios en lugar de los requisitos habituales
    D: Un pasaporte estadounidense válido y un certificado de nacimiento
  answer: B
  explanation: Si no tiene en su poder su licencia con foto de otro estado, debe presentar
    una carta de liquidación o un historial de conducción oficial del estado donde
    tuvo su última licencia.
- id: 42
  category: license_system
  question: ¿Por cuánto tiempo es válida una carta original del 'Programa de Reasentamiento
    de Refugiados' cuando se utiliza como identificación?
  choices:
    A: 15 días a partir de la fecha de emisión
    B: 30 días a partir de la fecha de emisión
    C: 90 días a partir de la fecha de emisión
    D: 180 días a partir de la fecha de emisión
  answer: A
  explanation: Una carta original del 'Programa de Reasentamiento de Refugiados' con
    una foto a color es válida por un período de 15 días a partir de la fecha de emisión.
- id: 43
  category: license_system
  question: ¿Qué significan las siglas de la Ley R.Y.A.N. en el Programa de Licencias
    Graduadas (GDL) de Louisiana?
  choices:
    A: Reduce Youth Accidents Now (Reducir los Accidentes de Jóvenes Ahora)
    B: Restrict Young Adult Navigation (Restringir la Navegación de Adultos Jóvenes)
    C: Regulate Youth Automobile Navigation (Regular la Navegación Automotriz de Jóvenes)
    D: Reduce Young Adult Negligence (Reducir la Negligencia de los Adultos Jóvenes)
  answer: A
  explanation: El Programa de Licencias Graduadas en Louisiana se conoce como la LEY
    R.Y.A.N (Reduce Youth Accidents Now) y fue nombrada en honor a un joven de quince
    años que perdió la vida en un accidente de tráfico.
- id: 44
  category: safe_driving_rules
  question: Según el manual, ¿cuántas veces más probable es que los conductores adolescentes
    de 16 a 19 años choquen en comparación con los conductores mayores?
  choices:
    A: Dos veces más
    B: Tres veces más
    C: Cuatro veces más
    D: Cinco veces más
  answer: C
  explanation: Por cada milla conducida, los conductores adolescentes de 16 a 19 años
    tienen cuatro veces más probabilidades de chocar que los conductores mayores debido
    a la falta de experiencia y la inmadurez del conductor.
- id: 45
  category: license_system
  question: 'Un conductor con un Permiso de Aprendizaje de Etapa 1 está autorizado
    a conducir solo cuando está acompañado por:'
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Un adulto con licencia de al menos 21 años de edad o un hermano de al menos
      18 años de edad
    C: Únicamente un padre o tutor legal
    D: Un conductor con licencia que haya tenido su licencia por al menos 5 años
  answer: B
  explanation: El titular de un Permiso de Aprendizaje de Etapa 1 está autorizado
    a conducir solo con un adulto con licencia de al menos veintiún (21) años de edad
    o un hermano de al menos dieciocho (18) años de edad.
- id: 46
  category: license_system
  question: ¿Cuántas horas de experiencia de conducción al volante debe certificar
    un padre o tutor que ha completado el titular de un permiso de aprendizaje antes
    de pasar a una Licencia Intermedia?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Para pasar a una licencia intermedia se requiere una declaración firmada
    que certifique que el solicitante tiene un mínimo de cincuenta (50) horas de experiencia
    de conducción al volante, incluyendo al menos quince (15) horas de conducción
    nocturna.
- id: 47
  category: license_system
  question: ¿Durante qué horas tiene prohibido conducir el titular de una Licencia
    Intermedia de Etapa 2, a menos que esté acompañado por un adulto con licencia
    de al menos 21 años o un hermano de al menos 18 años?
  choices:
    A: Entre las 10:00 p.m. y las 6:00 a.m.
    B: Entre las 11:00 p.m. y las 5:00 a.m.
    C: Entre la medianoche y las 5:00 a.m.
    D: Entre las 9:00 p.m. y las 6:00 a.m.
  answer: B
  explanation: Un titular de licencia intermedia de Etapa 2 tiene prohibido conducir
    entre las 11:00 p.m. y las 5:00 a.m., a menos que esté acompañado por un adulto
    con licencia calificado o un hermano.
- id: 48
  category: license_system
  question: Entre las 6:00 p.m. y las 5:00 a.m., ¿cuál es la restricción de pasajeros
    para el titular de una Licencia Intermedia de Etapa 2?
  choices:
    A: No se permiten pasajeros en el vehículo.
    B: No pueden transportar a ningún pasajero menor de 18 años.
    C: No pueden transportar a más de un pasajero menor de 21 años que no sea miembro
      de la familia inmediata.
    D: Solo pueden transportar pasajeros que sean mayores de 21 años.
  answer: C
  explanation: Entre las 6:00 p.m. y las 5:00 a.m., un titular de licencia intermedia
    no puede transportar a más de un pasajero menor de veintiún (21) años que no sea
    miembro de la familia inmediata.
- id: 49
  category: driver_responsibility
  question: ¿Cuál de los siguientes datos es obligatorio en su tarjeta de comprobante
    de seguro aceptable?
  choices:
    A: El precio de compra del vehículo
    B: El número de licencia de conducir del asegurado
    C: El número NAIC
    D: El número de placa del vehículo
  answer: C
  explanation: El comprobante de seguro aceptable debe contener el nombre de la compañía,
    el número de póliza, las fechas de vigencia, la descripción del vehículo, el nombre
    de la parte asegurada y el número NAIC.
- id: 50
  category: driver_testing
  question: ¿Cuál es el estándar de visión mínimo requerido para aprobar el examen
    de la vista para una conducción segura?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: El examen de la vista determinará si su visión cumple con los estándares
    mínimos (20/40) para una conducción segura.
- id: 51
  category: license_system
  question: Si necesita lentes correctivos para aprobar el examen de la vista, ¿qué
    código de restricción aparecerá en su licencia?
  choices:
    A: '01'
    B: A
    C: C
    D: '04'
  answer: A
  explanation: Si necesita lentes correctivos para aprobar el examen de la vista,
    su licencia indicará que está obligado a usarlos mientras conduce y mostrará un
    "01" para esta restricción.
- id: 52
  category: driver_testing
  question: ¿Qué porcentaje de preguntas debe responder correctamente para obtener
    una calificación aprobatoria en el examen de conocimientos?
  choices:
    A: 70 por ciento
    B: 75 por ciento
    C: 80 por ciento
    D: 85 por ciento
  answer: C
  explanation: El examen se realiza en una computadora en la mayoría de las oficinas
    y debe responder correctamente el 80 por ciento de estas preguntas para obtener
    una calificación aprobatoria.
- id: 53
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para el vehículo que proporcione
    para la prueba de habilidades viales en la Oficina de Vehículos Motorizados (OMV)?
  choices:
    A: Debe tener transmisión manual.
    B: Debe ser un vehículo de entrenamiento de doble control.
    C: Debe tener un velocímetro en funcionamiento.
    D: Debe haber sido fabricado después del año 2000.
  answer: C
  explanation: El vehículo utilizado para la prueba de habilidades viales debe estar
    en condiciones de conducción seguras, aprobar una inspección de seguridad y el
    velocímetro debe estar en funcionamiento.
- id: 54
  category: driver_testing
  question: ¿Quién tiene permitido estar en el vehículo durante la prueba de habilidades
    viales?
  choices:
    A: Solo el solicitante y el personal de la OMV
    B: El solicitante, el personal de la OMV y un intérprete si corresponde
    C: El solicitante, el personal de la OMV y uno de los padres o tutor
    D: El solicitante, el personal de la OMV y un instructor de manejo
  answer: B
  explanation: Solo el solicitante, el personal de la OMV y el intérprete (si corresponde)
    están permitidos en el vehículo durante la prueba de habilidades viales.
- id: 55
  category: vehicle_information
  question: Según el manual, ¿todos los vehículos fabricados después de qué año deben
    estar equipados con cinturones de seguridad funcionales para ser utilizados en
    el examen de conducir?
  choices:
    A: '1964'
    B: '1970'
    C: '1985'
    D: '1990'
  answer: A
  explanation: El manual establece que todos los vehículos fabricados después de 1964
    deben estar equipados con cinturones de seguridad funcionales para el examen de
    conducir.
- id: 56
  category: license_system
  question: Un solicitante que tenga 18 años de edad o más y no haya ingresado al
    programa de licencia graduada (GDL) debe completar ¿cuál de los siguientes para
    solicitar una licencia completa de Clase E?
  choices:
    A: Un curso de educación vial de 14 horas
    B: Un curso de educación vial de 38 horas O un curso previo a la obtención de
      la licencia de 6 horas y un curso de 8 horas al volante
    C: Un curso de 50 horas al volante
    D: Solo un examen escrito de conocimientos y una evaluación de la vista
  answer: B
  explanation: Los solicitantes de 18 años de edad o más que no hayan ingresado al
    programa de licencia graduada pueden solicitar una licencia completa de Clase
    E al completar un curso de educación vial de 38 horas o un curso previo a la obtención
    de la licencia de 6 horas y un curso de 8 horas al volante.
- id: 57
  category: driver_testing
  question: ¿Cuál de los siguientes resultará en una reprobación automática de la
    prueba de habilidades viales?
  choices:
    A: Pedirle al examinador que repita una instrucción
    B: Una violación de cualquier ley de tránsito
    C: Conducir ligeramente por debajo del límite de velocidad establecido
    D: Realizar más de un intento para estacionar entre autos
  answer: B
  explanation: Reprobará la prueba de habilidades por una violación de cualquier ley
    de tránsito, cualquier acción o incidente peligroso, falta de cooperación, una
    colisión o errores menores acumulados.
- id: 58
  category: driver_testing
  question: ¿Bajo qué condiciones se suspenden las pruebas de habilidades viales administradas
    en la Oficina de Vehículos Motorizados?
  choices:
    A: Durante las horas pico de tráfico
    B: Cuando las temperaturas superan los 95 grados
    C: Durante condiciones climáticas adversas
    D: El día anterior a un feriado estatal
  answer: C
  explanation: Las pruebas de habilidades viales (conducción) administradas en la
    Oficina de Vehículos Motorizados se suspenden durante condiciones climáticas adversas.
- id: 59
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir estándar de Louisiana
    antes de que expire?
  choices:
    A: Cuatro años a partir de la fecha de emisión
    B: Cinco años a partir de su cumpleaños más cercano
    C: Seis años a partir de su cumpleaños más cercano
    D: Diez años a partir de la fecha de emisión
  answer: C
  explanation: Su licencia de conducir expirará seis años después de su cumpleaños
    más cercano.
- id: 60
  category: license_system
  question: ¿Cuántos días le otorga la ley de Louisiana para corregir la dirección
    en su licencia de conducir después de mudarse?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: La ley de Louisiana exige que corrija la dirección en su licencia dentro
    de los 10 días posteriores a una mudanza.
- id: 61
  category: license_system
  question: Si usted es miembro de las fuerzas armadas y presta servicio fuera de
    Louisiana, ¿cuándo vence oficialmente o se considera morosa su licencia de conducir
    después de su baja?
  choices:
    A: Inmediatamente después de la baja
    B: El día 30 después de la baja
    C: El día 61 después de la baja
    D: Seis meses después de la baja
  answer: C
  explanation: La licencia de los miembros de las fuerzas armadas que prestan servicio
    fuera del estado sigue siendo válida durante 60 días después de la baja y se considerará
    vencida/morosa el día 61 después de la baja.
- id: 62
  category: license_system
  question: ¿Quién está obligado a presentar un informe médico detallado de un médico
    y/o especialista en la visión al solicitar una licencia por primera vez?
  choices:
    A: Cualquier persona que use anteojos recetados o lentes de contacto
    B: Toda persona con discapacidad física y personas mayores de 60 años
    C: Cualquier persona menor de 18 años
    D: Personas que hayan reprobado el examen escrito de conocimientos dos veces
  answer: B
  explanation: Toda persona con discapacidad física y las personas mayores de 60 años
    que soliciten una licencia por primera vez deben presentar un informe detallado
    de un médico y/o especialista en la visión.
- id: 63
  category: penalties_and_points
  question: ¿Durante cuánto tiempo se mantienen las condenas por conducir en estado
    de ebriedad (DWI) en su registro público de conducir?
  choices:
    A: 3 años
    B: 5 años
    C: 7 años
    D: 10 años
  answer: D
  explanation: La Oficina de Vehículos Motorizados (OMV) mantiene un registro público
    de todas las condenas de tráfico y colisiones durante cinco años, pero las condenas
    por conducir en estado de ebriedad (DWI) se mantienen durante 10 años.
- id: 64
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones no relacionadas con la conducción
    puede resultar en la pérdida de su privilegio de conducir?
  choices:
    A: No pagar una multa de estacionamiento municipal
    B: No pagar la manutención de los hijos
    C: Cambiar su nombre sin notificar a la OMV dentro de los 5 días
    D: No votar en una elección estatal
  answer: B
  explanation: Puede perder su privilegio de conducir por no pagar la manutención
    de los hijos, así como por no pagar los impuestos estatales sobre la renta.
- id: 65
  category: alcohol_drugs_health
  question: Para los conductores de 21 años de edad o más, ¿qué nivel de concentración
    de alcohol en sangre (BAC) resultará en la revocación de los privilegios de conducir?
  choices:
    A: 0.02% o más
    B: 0.04% o más
    C: 0.06% o más
    D: 0.08% o más
  answer: D
  explanation: Puede perder su privilegio de conducir si los resultados de la prueba
    muestran un nivel de BAC de 0.08% o más para las personas de 21 años de edad o
    más.
- id: 66
  category: penalties_and_points
  question: ¿Cuántas condenas por conducción temeraria dentro de un período de 12
    meses resultarán en la pérdida de su privilegio de conducir?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: C
  explanation: Puede perder su privilegio de conducir por tres condenas de conducción
    temeraria cometidas dentro de un período de 12 meses.
- id: 67
  category: license_system
  question: ¿Cuál es la edad máxima para ser elegible para renovar una licencia Clase
    'D' o 'E' por correo o internet?
  choices:
    A: Menos de 60 años
    B: Menos de 65 años
    C: Menos de 70 años
    D: Menos de 75 años
  answer: C
  explanation: Si usted es residente de Louisiana menor de setenta (70) años con una
    licencia clase 'D' o 'E', puede ser seleccionado para renovar su licencia por
    correo o internet.
- id: 68
  category: driver_responsibility
  question: Cuando un menor solicita un duplicado de la licencia y existe custodia
    compartida, ¿quién está autorizado para firmar la solicitud?
  choices:
    A: Ambos padres deben firmar la solicitud juntos
    B: Solo el padre domiciliario puede firmar por el hijo menor
    C: Cualquier pariente consanguíneo mayor de 21 años
    D: Cualquiera de los padres puede firmar individualmente
  answer: B
  explanation: En el caso de custodia compartida, solo el padre domiciliario puede
    firmar por el hijo menor al solicitar un duplicado de la licencia.
- id: 69
  category: penalties_and_points
  question: ¿Cuál de las siguientes acciones con respecto a un autobús escolar puede
    resultar en la revocación de su licencia de conducir?
  choices:
    A: Rebasar a un autobús escolar que circula al límite de velocidad en la carretera
    B: No detenerse ante un autobús escolar que está cargando o descargando niños
    C: Estacionarse a menos de 50 pies de un autobús escolar estacionado
    D: Conducir detrás de un autobús escolar por más de dos millas
  answer: B
  explanation: Puede perder su privilegio de conducir por no detenerse ante un autobús
    escolar que está cargando o descargando niños.
- id: 70
  category: penalties_and_points
  question: ¿Qué puede pasar con su privilegio de conducir si tiene 16 años y se retira
    de la escuela secundaria antes de graduarse?
  choices:
    A: Debe pagar una multa a la Oficina de Vehículos Motorizados
    B: Se le restringe a conducir solo durante las horas del día
    C: Puede perder su privilegio de conducir
    D: Debe volver a tomar el examen escrito de conocimientos
  answer: C
  explanation: Puede perder su privilegio de conducir por retirarse de la escuela
    antes de graduarse si tiene entre 15 y 18 años de edad, o si se ha determinado
    que se ausenta o llega tarde habitualmente.
- id: 71
  category: penalties_and_points
  question: ¿Bajo qué condición se puede suspender o revocar la licencia de conducir
    de un joven de 15 a 17 años en relación con la asistencia escolar?
  choices:
    A: Obtener una calificación reprobatoria en un curso de Educación Vial.
    B: Retirarse de la escuela antes de la graduación o estar habitualmente ausente
      o llegar tarde.
    C: Ser suspendido de la escuela por un día.
    D: No unirse a una actividad extracurricular.
  answer: B
  explanation: El manual establece que retirarse de la escuela antes de la graduación
    si tiene 15 pero menos de 18 años de edad, o si se determina que está habitualmente
    ausente o llega tarde, es motivo para la suspensión o revocación de la licencia.
- id: 72
  category: penalties_and_points
  question: ¿Cuál de los siguientes problemas financieros puede ser motivo de suspensión
    o revocación de la licencia de conducir en Louisiana?
  choices:
    A: Falta de pago de deudas de tarjetas de crédito.
    B: Falta de pago de impuestos estatales sobre la renta o de la manutención de
      los hijos.
    C: Declararse en bancarrota personal.
    D: Tener un puntaje de crédito bajo.
  answer: B
  explanation: El incumplimiento del pago de la manutención de los hijos y el incumplimiento
    del pago de los impuestos estatales sobre la renta se enumeran explícitamente
    en el manual como motivos para la suspensión o revocación de la licencia de conducir.
- id: 73
  category: driver_responsibility
  question: ¿Quién es responsable de la basura arrojada desde el asiento del pasajero
    de un vehículo?
  choices:
    A: Solo el pasajero que arrojó la basura.
    B: El conductor del vehículo.
    C: El propietario registrado del vehículo, independientemente de quién esté conduciendo.
    D: El departamento de carreteras local.
  answer: B
  explanation: El manual establece que el conductor es responsable de toda la basura
    que provenga del interior del vehículo o de la caja de la camioneta, y el conductor
    puede ser citado por arrojar basura si lo hacen los pasajeros de su vehículo.
- id: 74
  category: penalties_and_points
  question: ¿Cuál es la pena máxima por una condena por arrojar basura de manera grave
    en Louisiana?
  choices:
    A: Una multa de $500 y 10 horas de servicio comunitario.
    B: Una multa de $1,000 y una suspensión de la licencia por 6 meses.
    C: Una multa de $5,000, un año de suspensión de la licencia de conducir, 30 días
      de cárcel y 100 horas de servicio comunitario.
    D: Una multa de $10,000 y la pérdida permanente de los privilegios de conducir.
  answer: C
  explanation: Las sanciones por una condena por arrojar basura pueden llegar hasta
    una multa de $5,000, un año de suspensión de la licencia de conducir, 30 días
    de cárcel Y 100 horas de servicio comunitario.
- id: 75
  category: driver_responsibility
  question: ¿Cuál es el objeto que más se arroja como basura a lo largo de las carreteras
    de Louisiana?
  choices:
    A: Envases de comida rápida.
    B: Envases de refrescos y cerveza.
    C: Bolsas de plástico del supermercado.
    D: Productos de tabaco, principalmente colillas de cigarrillos.
  answer: D
  explanation: Según el manual, los productos de tabaco, principalmente las colillas
    de cigarrillos, son el artículo que más se arroja como basura en las carreteras
    de Louisiana.
- id: 76
  category: driver_responsibility
  question: Según los estudios mencionados en el manual, ¿qué factor es significativo
    para determinar quién tiene más probabilidades de arrojar basura?
  choices:
    A: El género, siendo los hombres más propensos a arrojar basura.
    B: La edad, siendo los menores de 30 años más propensos a arrojar basura.
    C: El género, siendo las mujeres más propensas a arrojar basura.
    D: La edad, siendo los mayores de 50 años más propensos a arrojar basura.
  answer: B
  explanation: Los estudios muestran que la edad, y no el género, es un factor significativo
    en el arrojo de basura. Los menores de 30 años tienen más probabilidades de arrojar
    basura que los mayores.
- id: 77
  category: driver_responsibility
  question: ¿Quién paga la mayor parte del costo económico para limpiar la basura
    en Louisiana?
  choices:
    A: El gobierno estatal paga el 100% del costo.
    B: Las organizaciones de voluntarios pagan el 50% del costo.
    C: Las empresas pagan alrededor del 80% del costo.
    D: Los condenados por arrojar basura pagan el 90% del costo a través de multas.
  answer: C
  explanation: El manual establece que las empresas pagan alrededor del 80% del costo
    de la limpieza de basura, y el gobierno financia el resto.
- id: 78
  category: license_system
  question: ¿Cómo se marca su designación como donante de órganos, ojos y tejidos
    en su licencia de conducir o tarjeta de identificación de Louisiana?
  choices:
    A: Con una estrella azul.
    B: Con una cinta verde.
    C: Con un corazón rojo.
    D: Con una cruz amarilla.
  answer: C
  explanation: Su designación se marcará en la parte frontal de su licencia o tarjeta
    de identificación con un corazón rojo.
- id: 79
  category: license_system
  question: En Louisiana, ¿cuándo se requiere el consentimiento de la familia para
    la donación de órganos si la persona está registrada?
  choices:
    A: Siempre es necesario.
    B: Se requiere solo para menores de edad.
    C: Se requiere si la persona es mayor de 65 años.
    D: Nunca se requiere bajo ninguna circunstancia.
  answer: B
  explanation: El registro de Louisiana permite a los ciudadanos tomar decisiones
    legalmente vinculantes para ser donantes. El consentimiento familiar se requiere
    solo para menores de edad.
- id: 80
  category: driver_responsibility
  question: ¿Cómo afecta el registro como donante de órganos al nivel de atención
    médica que recibe en un hospital?
  choices:
    A: Los médicos no se esforzarán tanto por salvar su vida.
    B: Recibirá tratamientos experimentales.
    C: No afecta su atención médica; el equipo de recuperación solo es llamado después
      de que fallan todos los intentos por salvar su vida.
    D: Se le ubica en una sala especial para posibles donantes.
  answer: C
  explanation: El nivel de atención médica que recibe en cualquier hospital no se
    ve afectado por su decisión de registrarse como donante. El equipo de recuperación
    solo es llamado después de que se hayan realizado todos los intentos para salvar
    su vida.
- id: 81
  category: license_system
  question: ¿Cuál de los siguientes factores se utiliza para determinar cómo se asignan
    los órganos para trasplante?
  choices:
    A: La riqueza del receptor.
    B: La fama o el poder político del receptor.
    C: El estatus de ciudadanía del receptor.
    D: El tipo de sangre, la gravedad de la enfermedad y el tiempo en la lista de
      espera.
  answer: D
  explanation: Los órganos se asignan según el tipo de sangre, el tamaño, el peso,
    la gravedad de la enfermedad, el tiempo en la lista de espera y la ubicación geográfica.
    Es ilegal asignar órganos basándose en la fama, la riqueza, la ciudadanía o el
    poder político.
- id: 82
  category: license_system
  question: Según el manual, ¿cuántas vidas puede salvar potencialmente a través de
    la donación de órganos?
  choices:
    A: Hasta 3 vidas.
    B: Hasta 5 vidas.
    C: Hasta 9 vidas.
    D: Hasta 15 vidas.
  answer: C
  explanation: Usted tiene la capacidad de salvar 9 vidas y mejorar la vida de hasta
    50 personas adicionales a través de la donación de tejidos.
- id: 83
  category: license_system
  question: ¿Qué exige la Ley Nacional de Registro de Votantes de 1993 (Ley Motor
    Voter) a los gobiernos estatales?
  choices:
    A: Exigir que todos los conductores voten en las elecciones estatales.
    B: Permitir que los votantes que califiquen se registren cuando soliciten o renueven
      su licencia de conducir.
    C: Suspender las licencias de las personas que no votan.
    D: Cobrar una tarifa por el registro de votantes en la OMV.
  answer: B
  explanation: Esta legislación exige que los gobiernos estatales permitan el registro
    de los votantes que califiquen cada vez que soliciten o renueven su licencia de
    conducir.
- id: 84
  category: license_system
  question: Si se registra para votar en la OMV y no recibe confirmación en un plazo
    de dos semanas, ¿qué debe hacer?
  choices:
    A: Volver a solicitar su licencia de conducir.
    B: Contactar a la Oficina del Registrador de Votantes local.
    C: Asumir que no es elegible para votar.
    D: Contactar al Departamento de Vida Silvestre y Pesca de Luisiana.
  answer: B
  explanation: Si no recibe la confirmación en un plazo de dos (2) semanas, comuníquese
    con la Oficina del Registrador de Votantes de su localidad.
- id: 85
  category: driver_responsibility
  question: ¿Por qué es incorrecto creer que las colillas de cigarrillo son totalmente
    biodegradables?
  choices:
    A: Están hechas de plástico sólido.
    B: El filtro está hecho de un tipo de acetato que nunca se descompone por completo.
    C: Están recubiertas de una cera impermeable.
    D: Se convierten en vidrio cuando se exponen a la luz solar.
  answer: B
  explanation: Si bien algunas partes del cigarrillo suelen descomponerse en un año,
    otras partes nunca lo hacen porque el filtro está hecho de un tipo de acetato
    que nunca se descompone por completo.
- id: 86
  category: license_system
  question: Si se registra para votar en la OMV y no recibe confirmación, ¿cuánto
    tiempo debe esperar antes de contactar a la Oficina del Registrador de Votantes
    local?
  choices:
    A: Una semana
    B: Dos semanas
    C: Treinta días
    D: Seis meses
  answer: B
  explanation: El manual establece que si no recibe la confirmación en un plazo de
    dos (2) semanas, debe comunicarse con la Oficina del Registrador de Votantes de
    su localidad.
- id: 87
  category: safe_driving_rules
  question: ¿Cuál es el objetivo principal del Sistema de Transporte por Carretera
    (HTS)?
  choices:
    A: Generar ingresos a través de peajes e impuestos
    B: Proporcionar un transporte seguro, rápido y eficiente de personas y mercancías
    C: Eliminar todas las colisiones de tráfico
    D: Promover la fabricación de vehículos motorizados
  answer: B
  explanation: El objetivo del HTS es proporcionar un transporte seguro, rápido y
    eficiente de personas y mercancías a un destino deseado, de una manera ambientalmente
    segura y sólida.
- id: 88
  category: vehicle_information
  question: ¿Cuáles son los tres componentes principales del Sistema de Transporte
    por Carretera?
  choices:
    A: Automóviles, camiones y autobuses
    B: Personas, vehículos y carreteras
    C: Ingeniería, aplicación de la ley y educación
    D: Gobiernos locales, estatales y federales
  answer: B
  explanation: 'El Sistema de Transporte por Carretera consta de tres componentes
    principales: personas, vehículos y carreteras.'
- id: 89
  category: driver_responsibility
  question: Los choques de vehículos motorizados son la principal causa de muerte
    en ¿qué grupo de edad en los EE. UU.?
  choices:
    A: De 1 a 34 años
    B: De 16 a 25 años
    C: De 35 a 50 años
    D: 65 años o más
  answer: A
  explanation: Los choques de vehículos motorizados son la principal causa de muerte
    entre las personas de 1 a 34 años y la principal causa de lesiones para todos
    los grupos de edad (en los EE. UU.).
- id: 90
  category: sharing_the_road
  question: ¿Qué porcentaje de la red de carreteras de casi cuatro millones de millas
    es propiedad de los gobiernos locales?
  choices:
    A: 25 por ciento
    B: 50 por ciento
    C: 75 por ciento
    D: 90 por ciento
  answer: C
  explanation: Los gobiernos locales poseen el 75 por ciento de la red de carreteras
    de casi cuatro millones de millas, aproximadamente la mitad de los puentes del
    país y gestionan el 90 por ciento de los sistemas de tránsito.
- id: 91
  category: license_system
  question: ¿Qué rama del gobierno regula las licencias de conducir, el peso de los
    camiones, las placas de matrícula y los títulos de propiedad de los vehículos?
  choices:
    A: El Departamento de Transporte
    B: El Departamento de Vehículos Motorizados (DMV)
    C: Tribunales de Tránsito
    D: Agencias de Aplicación de la Ley
  answer: B
  explanation: El Departamento de Vehículos Motorizados regula las licencias de conducir,
    el peso y los operadores de camiones, las placas de matrícula, el registro de
    tarifas, los impuestos y los títulos, por nombrar algunos de los elementos que
    controla esta rama del gobierno.
- id: 92
  category: driver_responsibility
  question: ¿Cómo ayuda la rama de ingeniería a gestionar el Sistema de Transporte
    por Carretera (HTS)?
  choices:
    A: Al hacer cumplir las leyes de tránsito y emitir citaciones
    B: Al regular las licencias de conducir y los registros de vehículos
    C: Al hacer del HTS el sistema más seguro y hacer que los vehículos sean más seguros
      y fáciles de operar
    D: Al educar al público a través de programas de educación vial en las escuelas
      secundarias
  answer: C
  explanation: La ingeniería de carreteras trabaja para hacer de nuestro HTS el sistema
    más seguro del mundo y la ingeniería de vehículos trabaja para que los vehículos
    sean más seguros y fáciles de operar.
- id: 93
  category: defensive_driving
  question: ¿Cuál es la causa número uno de muertes de adolescentes?
  choices:
    A: Abuso de drogas
    B: Colisiones de tránsito
    C: Lesiones deportivas
    D: Enfermedades
  answer: B
  explanation: El manual establece que las colisiones de tránsito se han convertido
    en la causa número uno de muertes de adolescentes.
- id: 94
  category: vehicle_information
  question: ¿A qué se debe principalmente la disminución de las muertes por accidentes
    de tránsito por cada 100 millones de millas recorridas en los últimos 40 años?
  choices:
    A: Límites de velocidad más bajos
    B: Menos conductores en la carretera
    C: Cinturones de seguridad, bolsas de aire y características de seguridad mejoradas
      en los vehículos
    D: Aplicación de la ley más estricta
  answer: C
  explanation: La mayor parte de esta disminución se debe a los cinturones de seguridad,
    las bolsas de aire y las características de seguridad mejoradas en los vehículos.
- id: 95
  category: safe_driving_rules
  question: Según el Departamento de Seguridad Pública y Correcciones de Louisiana,
    ¿cuál fue la causa principal de los choques de vehículos motorizados en Louisiana
    en 2010?
  choices:
    A: Exceso de velocidad
    B: No ceder el paso
    C: Seguir demasiado de cerca
    D: Operación descuidada y/o imprudente
  answer: D
  explanation: La lista de las cinco causas principales de choques de vehículos motorizados
    en Louisiana (2010) sitúa la 'Operación descuidada y/o imprudente' como la número
    1.
- id: 96
  category: driver_responsibility
  question: En 2010, ¿cuánto costaron en promedio los choques de vehículos motorizados
    por cada conductor con licencia en Louisiana?
  choices:
    A: $820.00
    B: $1,250.00
    C: $1,855.00
    D: $2,500.00
  answer: C
  explanation: En 2010, las muertes, lesiones y daños a la propiedad en Louisiana
    como resultado de choques de vehículos motorizados costaron en promedio a cada
    conductor con licencia en Louisiana $1,855.00.
- id: 97
  category: sharing_the_road
  question: ¿Qué porcentaje de la carga se transporta por carretera?
  choices:
    A: 40 por ciento
    B: 50 por ciento
    C: 60 por ciento
    D: 75 por ciento
  answer: C
  explanation: El manual establece que el sesenta por ciento de la carga se transporta
    por carretera.
- id: 98
  category: sharing_the_road
  question: ¿Dónde se encuentra el setenta y cinco por ciento de las millas de carretera?
  choices:
    A: En áreas urbanas
    B: En áreas rurales
    C: En áreas suburbanas
    D: En áreas costeras
  answer: B
  explanation: El manual establece que el setenta y cinco por ciento de las millas
    de carretera se encuentran en áreas rurales.
- id: 99
  category: driver_testing
  question: ¿Cuál es el objetivo de educar al público con respecto al Sistema de Transporte
    por Carretera (HTS)?
  choices:
    A: Aumentar los ingresos del estado
    B: Impartir conocimientos sobre las reglas de la carretera e inculcar actitudes
      consistentes con la conducción segura
    C: Reducir el número de conductores con licencia
    D: Fomentar el uso del transporte público
  answer: B
  explanation: El objetivo de educar al público es impartir conocimientos sobre las
    reglas de la carretera, las habilidades básicas involucradas en la operación del
    vehículo, e inculcar y reforzar actitudes consistentes con la conducción segura.
- id: 100
  category: vehicle_information
  question: ¿Cuál de los siguientes factores afecta el desempeño y el manejo de un
    vehículo en la carretera?
  choices:
    A: El color del vehículo
    B: La edad del conductor
    C: La condición del vehículo y si se ha realizado un mantenimiento regular
    D: El número de pasajeros en el vehículo
  answer: C
  explanation: Otro factor en el desempeño del vehículo es la condición del mismo.
    El equipo que tiene, la antigüedad del vehículo y si se ha realizado o no un mantenimiento
    regular en el vehículo, todo afecta su manejo.
- id: 101
  category: safe_driving_rules
  question: 'Según el manual, conducir a una velocidad insegura significa:'
  choices:
    A: Conducir siempre por encima del límite de velocidad indicado.
    B: Conducir demasiado rápido para las condiciones climáticas o de tráfico existentes,
      incluso si se está por debajo del límite.
    C: Conducir un camión comercial grande en una autopista.
    D: Conducir por debajo del límite de velocidad mínimo indicado.
  answer: B
  explanation: El manual establece que las personas que conducen a velocidades inseguras
    pueden estar conduciendo por debajo del límite de velocidad indicado, pero aun
    así demasiado rápido para el clima, las condiciones del tráfico o su propia salud
    física.
- id: 102
  category: vehicle_information
  question: ¿Cómo se numeran las carreteras interestatales para indicar su dirección?
  choices:
    A: Las carreteras con números pares van de norte a sur.
    B: Las carreteras con números impares van de este a oeste.
    C: Las carreteras con números pares van de este a oeste, y las carreteras con
      números impares van de norte a sur.
    D: Los números de las interestatales no indican la dirección.
  answer: C
  explanation: El manual establece que, en el caso de las carreteras interestatales,
    las carreteras con números PARES van de este a oeste, y las carreteras con números
    IMPARES van de norte a sur.
- id: 103
  category: safe_driving_rules
  question: ¿Cuál es la principal diferencia entre una vía de peaje estándar y una
    autopista de peaje (turnpike)?
  choices:
    A: Las autopistas de peaje no cobran tarifas a los vehículos de pasajeros.
    B: Las autopistas de peaje cobran peajes mediante un sistema de boletos donde
      se paga al salir.
    C: Las autopistas de peaje solo se encuentran en Pensilvania.
    D: Las autopistas de peaje son carreteras sin división.
  answer: B
  explanation: El manual explica que una autopista de peaje (turnpike) es un tipo
    de vía de peaje donde los peajes se cobran mediante un sistema de boletos; usted
    recibe un boleto al entrar a la autopista y paga el boleto al salir.
- id: 104
  category: defensive_driving
  question: ¿Cómo se llama la condición en la que el exceso de agua en la carretera
    hace que los neumáticos de un vehículo comiencen a deslizarse sobre la superficie
    del agua?
  choices:
    A: Hidroplaneo (Hydroplaning)
    B: Deslizamiento de la banda de rodadura
    C: Planeo sobre agua
    D: Pérdida de tracción
  answer: A
  explanation: Según el manual, cuando el exceso de agua en la carretera hace que
    los neumáticos de un vehículo comiencen a deslizarse sobre la superficie del agua
    en lugar de agarrarse a la carretera, la condición se denomina hidroplaneo (hydroplaning).
- id: 105
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico con forma de octágono?
  choices:
    A: Ceda el paso (Yield)
    B: Zona de no rebasar
    C: Pare (Stop)
    D: Cruce de ferrocarril
  answer: C
  explanation: El manual establece que la señal con forma de octágono se utiliza exclusivamente
    para las señales de pare (stop), lo que requiere que los conductores disminuyan
    la velocidad y se detengan por completo.
- id: 106
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para las señales de ceda
    el paso (yield)?
  choices:
    A: Una señal en forma de triángulo con la punta hacia abajo
    B: Una señal en forma de triángulo con la punta hacia un lado
    C: Una señal en forma de diamante
    D: Una señal en forma de rectángulo
  answer: A
  explanation: El manual establece que la señal en forma de triángulo con la punta
    hacia abajo se utiliza exclusivamente para las señales de ceda el paso (yield).
- id: 107
  category: signs_and_signals
  question: ¿Para qué se utiliza una señal en forma de triángulo con la punta hacia
    un lado?
  choices:
    A: Ceda el paso (Yield)
    B: Cruce escolar
    C: Zonas de no rebasar
    D: Marcadores de ruta
  answer: C
  explanation: Según el manual, la señal en forma de triángulo con la punta hacia
    un lado se utiliza para indicar zonas de no rebasar.
- id: 108
  category: defensive_driving
  question: Según el manual, ¿aproximadamente qué porcentaje de todos los choques
    ocurren en las intersecciones?
  choices:
    A: 20 por ciento
    B: 30 por ciento
    C: 40 por ciento
    D: 50 por ciento
  answer: C
  explanation: El manual establece que las intersecciones son un peligro para los
    conductores y que aproximadamente el 40 por ciento de todos los choques ocurren
    en las intersecciones.
- id: 109
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las bandas sonoras (rumble strips) en la carretera?
  choices:
    A: Ayudar a que los neumáticos mantengan una mejor tracción bajo la lluvia
    B: Alertar al conductor de que se está desviando de la carretera o dirigiéndose
      a un carril diferente
    C: Obligar a los conductores a reducir su velocidad a 15 mph
    D: Indicar una próxima cabina de peaje
  answer: B
  explanation: El manual explica que las bandas sonoras (rumble strips) alertan al
    conductor de que se está desviando de la carretera o dirigiéndose a un carril
    diferente.
- id: 110
  category: signs_and_signals
  question: Además de las señales y semáforos, ¿las instrucciones de quién debe obedecer
    para el control del tráfico?
  choices:
    A: Agentes de la ley, personal de carreteras o guardias de cruce escolar
    B: Cualquier peatón que cruce la calle
    C: Otros conductores que hagan señales por sus ventanas
    D: Pasajeros en su vehículo
  answer: A
  explanation: El manual establece que el control del tráfico también puede ser proporcionado
    por agentes de la ley, personal de carreteras o guardias de cruce escolar, y usted
    debe obedecer las instrucciones de estas personas.
- id: 111
  category: driver_responsibility
  question: ¿Qué se describe en el manual como la "regla de oro" de la conducción?
  choices:
    A: Ceder siempre el paso a los vehículos más grandes
    B: Tratar a los demás de la manera en que le gustaría ser tratado
    C: Nunca conducir por encima del límite de velocidad indicado
    D: Mantener su vehículo en buen estado en todo momento
  answer: B
  explanation: 'El manual establece que el factor más importante en la regulación
    del sistema de transporte por carretera es el conductor que obedece las leyes
    de tránsito y sigue la "regla de oro" de la conducción: tratar a los demás de
    la manera en que le gustaría ser tratado.'
- id: 112
  category: safe_driving_rules
  question: ¿En qué se diferencia una "Carretera de acceso parcial" de una "Carretera
    de acceso total"?
  choices:
    A: Solo permite el acceso a vehículos comerciales.
    B: Permite el acceso en otras calles, pero no se permiten entradas privadas ni
      otras formas de acceso.
    C: Tiene entradas privadas y cualquier otro tipo de acceso permitido.
    D: Solo es accesible a través de salidas señalizadas.
  answer: B
  explanation: El manual define una Carretera de acceso parcial como aquella que permite
    el acceso en otras calles (probablemente en un semáforo), aunque no se permiten
    entradas privadas (driveways) ni otras formas de acceso.
- id: 113
  category: signs_and_signals
  question: ¿Qué tipo de información se muestra normalmente en una señal de forma
    rectangular?
  choices:
    A: Peligros próximos y zonas de construcción
    B: Advertencias anticipadas de cruce de ferrocarril
    C: Información reglamentaria como límites de velocidad, zonas escolares y estacionamiento
    D: Marcadores de ruta e información turística
  answer: C
  explanation: El manual establece que la forma rectangular se utiliza para señales
    reglamentarias, que incluyen el límite de velocidad, zonas escolares, estacionamiento
    y zonas de carga.
- id: 114
  category: safe_driving_rules
  question: ¿Qué agencia federal tiene la responsabilidad principal de mejorar la
    seguridad vial y educar al público para reducir las muertes en las carreteras?
  choices:
    A: La Administración Nacional de Seguridad del Tráfico en las Carreteras (NHTSA)
    B: La Administración Federal de Carreteras (FHWA)
    C: El Departamento de Transporte (DOT)
    D: La Comisión de Carreteras Interestatales (IHC)
  answer: B
  explanation: El manual establece que la Administración Federal de Carreteras (FHWA)
    es una agencia federal que tiene la responsabilidad principal de mejorar la seguridad
    vial y educar al público.
- id: 115
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de color rosa fluorescente?
  choices:
    A: Puntos de interés recreativo o cultural
    B: Gestión de incidentes, como un choque o un huracán
    C: Advertencias para peatones y ciclistas
    D: Zonas de construcción temporal
  answer: B
  explanation: Según el manual, se utiliza un fondo rosa fluorescente para las señales
    de gestión de incidentes, como un huracán o el cierre de una carretera debido
    a un choque.
- id: 116
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal con fondo amarillo?
  choices:
    A: Pare o no entre
    B: Precaución, esté alerta y prepárese para reducir la velocidad
    C: Zona de construcción más adelante
    D: Ruta de evacuación de emergencia
  answer: B
  explanation: 'El amarillo se utiliza como color de fondo para las señales de advertencia
    y las señales escolares, y significa: Precaución, esté alerta, prepárese para
    reducir la velocidad.'
- id: 117
  category: safe_driving_rules
  question: ¿Cuál es el uso adecuado de un carril central compartido?
  choices:
    A: Se utiliza para rebasar vehículos más lentos.
    B: Está reservado para el tráfico directo durante las horas pico.
    C: Está reservado para vehículos que giran a la izquierda desde cualquier dirección.
    D: Se utiliza como área de estacionamiento designada para vehículos averiados.
  answer: C
  explanation: El manual establece que un Carril Central Compartido Solo para Girar
    a la Izquierda está reservado para el uso de vehículos que giran a la izquierda
    desde cualquier dirección y no debe usarse para el tráfico directo ni para rebasar
    a otros vehículos.
- id: 118
  category: safe_driving_rules
  question: ¿Cuándo se le permite conducir al límite de velocidad máximo señalizado?
  choices:
    A: Solo durante las horas del día
    B: Solo en condiciones de conducción ideales
    C: En todo momento, a menos que una zona escolar esté parpadeando
    D: Solo cuando se encuentre en el carril izquierdo de una carretera de varios
      carriles
  answer: B
  explanation: El manual especifica que el límite máximo debe conducirse solo en condiciones
    de conducción ideales y usted debe reducir su velocidad cuando las condiciones
    climáticas o del tráfico lo requieran.
- id: 119
  category: signs_and_signals
  question: ¿Qué señal se describe como una señal cuadrada con una línea horizontal
    blanca dentro de un círculo rojo?
  choices:
    A: Pare (Stop)
    B: Ceda el paso (Yield)
    C: No entre (Do Not Enter)
    D: Sentido contrario (Wrong Way)
  answer: C
  explanation: Una señal de 'No entre' se describe en el manual como una señal cuadrada
    con una línea horizontal blanca dentro de un círculo rojo, lo que significa que
    no puede entrar.
- id: 120
  category: safe_driving_rules
  question: Si está detenido en un semáforo en rojo y NO hay una señal de 'No girar
    en rojo', ¿qué se le permite hacer?
  choices:
    A: Puede girar a la derecha en rojo después de detenerse y verificar el tráfico
      y los peatones.
    B: Puede girar a la izquierda en rojo si se encuentra en el carril izquierdo.
    C: Debe esperar a la luz verde antes de realizar cualquier giro.
    D: Puede seguir recto a través de la intersección si está despejada.
  answer: A
  explanation: El manual establece que si no hay una señal de 'NO GIRAR EN ROJO' en
    el semáforo, después de detenerse en la línea de parada y verificar el tráfico
    y los peatones, puede girar a la derecha en rojo.
- id: 121
  category: signs_and_signals
  question: ¿Cuál de las siguientes señales suele utilizar un fondo amarillo-verde
    fluorescente?
  choices:
    A: Rutas de evacuación de autopistas
    B: Señales de advertencia para peatones, bicicletas y zonas escolares
    C: Señales de guía para áreas recreativas
    D: Señales de límite de velocidad máxima
  answer: B
  explanation: El amarillo-verde fluorescente se utiliza como color de fondo para
    las señales de advertencia de peatones, bicicletas y zonas escolares.
- id: 122
  category: signs_and_signals
  question: En una señal de destino verde, ¿qué significa si la palabra 'Exit' (Salida)
    está escrita en el lado izquierdo de la señal?
  choices:
    A: El carril de salida o la rampa está a la izquierda.
    B: El carril de salida o la rampa está a la derecha.
    C: La salida está cerrada por construcción.
    D: La salida es solo para vehículos de emergencia.
  answer: A
  explanation: El manual establece que si la palabra 'Exit' (Salida) está escrita
    en el lado izquierdo de una señal de salida, el carril de salida o la rampa se
    encuentra a la izquierda.
- id: 123
  category: safe_driving_rules
  question: ¿Bajo qué condición NO debe ingresar a una intersección?
  choices:
    A: Si el semáforo acaba de ponerse en verde
    B: Si las condiciones del tráfico no le permiten despejar la intersección por
      completo
    C: Si hay peatones esperando en la acera
    D: Si está girando a la derecha con luz verde
  answer: B
  explanation: La regla de 'No bloquear la intersección' establece que no debe ingresar
    a una intersección si las condiciones del tráfico no le permiten despejar la intersección
    por completo.
- id: 124
  category: signs_and_signals
  question: ¿Cuáles son la forma y los colores típicos de la mayoría de las señales
    de advertencia?
  choices:
    A: Cuadradas con letras blancas y negras
    B: De ocho lados y rojas con letras blancas
    C: En forma de diamante y amarillas con letras o símbolos negros
    D: Rectangulares y verdes con letras blancas
  answer: C
  explanation: Las señales de advertencia suelen ser amarillas con letras o símbolos
    negros y tienen forma de diamante.
- id: 125
  category: safe_driving_rules
  question: ¿Qué indica una señal de 'Pass With Care' (Rebase con cuidado)?
  choices:
    A: Está entrando en una zona escolar.
    B: Está al final de una zona de no rebasar y puede rebasar cuando sea seguro.
    C: Debe moverse al carril derecho para permitir que otros lo rebasen.
    D: Rebasar está estrictamente prohibido durante las próximas dos millas.
  answer: B
  explanation: La señal 'Pass With Care' le indica que se encuentra al final de una
    zona de no rebasar y que puede rebasar solo cuando sea seguro hacerlo.
- id: 126
  category: safe_driving_rules
  question: ¿Cuándo debe obedecer el límite de velocidad reducido en una señal de
    'School Speed Limit When Flashing' (Límite de velocidad escolar cuando parpadee)?
  choices:
    A: Entre las 7 AM y las 4 PM
    B: Solo cuando los niños sean visibles en la acera
    C: Solo cuando las luces de la señal estén parpadeando
    D: En todo momento durante el año escolar
  answer: C
  explanation: El manual establece que el límite de velocidad reducido en una zona
    escolar es obligatorio solo cuando las luces parpadean; de lo contrario, debe
    obedecer el límite de velocidad estándar de la vía.
- id: 127
  category: signs_and_signals
  question: ¿Qué tipo de información indica una señal con fondo azul?
  choices:
    A: Servicios para viajeros, señales de información y rutas de evacuación de emergencia
    B: Puntos de interés recreativo o cultural
    C: Leyes específicas que debe obedecer
    D: Posible peligro o riesgos más adelante
  answer: A
  explanation: El azul se utiliza como color de fondo para servicios al viajero, señales
    de información, señales de rutas de evacuación de emergencia y como parte de los
    marcadores de rutas interestatales y algunas estatales.
- id: 128
  category: safe_driving_rules
  question: ¿Por qué algunas carreteras de alta velocidad tienen límites de velocidad
    mínimos?
  choices:
    A: Para animar a los conductores a llegar más rápido a sus destinos
    B: Para que los vehículos más lentos no se conviertan en un peligro para otros
      conductores
    C: Para reducir la cantidad de combustible consumido por los vehículos
    D: Para asegurar que todos los vehículos viajen exactamente a la misma velocidad
  answer: B
  explanation: El manual explica que algunas carreteras de alta velocidad tienen límites
    de velocidad mínimos y usted está legalmente obligado a viajar al menos a esa
    velocidad para no ser un peligro para otros conductores.
- id: 129
  category: signs_and_signals
  question: ¿Qué indican las señales cuadradas o rectangulares verdes o marrones con
    letras blancas?
  choices:
    A: Servicios como hospitales y gasolineras
    B: Dirección y distancia a varios lugares
    C: Incidentes no planificados o desastres naturales
    D: Zonas de construcción de carreteras
  answer: B
  explanation: Las señales de destino son señales cuadradas o rectangulares verdes
    o marrones con letras blancas que muestran la dirección y la distancia a varios
    lugares, como ciudades, aeropuertos y límites estatales.
- id: 130
  category: signs_and_signals
  question: ¿De qué color son las señales de incidentes temporales que se usan para
    advertir a los conductores sobre incidentes no planificados, como derrames de
    materiales peligrosos?
  choices:
    A: Naranja con letras negras
    B: Azul con letras blancas
    C: Rosa fluorescente con letras negras
    D: Amarillo con letras negras
  answer: C
  explanation: Las señales de incidentes son señales temporales de color rosa fluorescente
    con letras negras, que se utilizan para avisarle cuando las carreteras están cerradas
    o desviadas debido a incidentes no planificados.
- id: 131
  category: penalties_and_points
  question: ¿En Louisiana, cuál es la sanción por infracciones de tránsito en zonas
    de construcción?
  choices:
    A: Las multas de tránsito se duplican
    B: Las multas de tránsito se triplican
    C: La licencia de conducir se suspende de inmediato
    D: Los puntos en la licencia se duplican
  answer: A
  explanation: Según el manual, en Louisiana, las multas de tránsito se duplican en
    las zonas de construcción.
- id: 132
  category: signs_and_signals
  question: Al acercarse a una barricada en una zona de obras, ¿qué significan las
    franjas diagonales con inclinación hacia abajo a la derecha?
  choices:
    A: El camino está cerrado más adelante
    B: El conductor debe desviarse a la izquierda
    C: El conductor debe desviarse a la derecha
    D: El conductor debe detenerse por completo
  answer: C
  explanation: Las franjas diagonales en una barricada guían al conductor. Las franjas
    con inclinación hacia abajo a la derecha significan que el conductor debe desviarse
    hacia la derecha.
- id: 133
  category: signs_and_signals
  question: ¿Cómo están dispuestas las luces en un semáforo horizontal en áreas metropolitanas?
  choices:
    A: Verde a la izquierda, amarillo en el centro, rojo a la derecha
    B: Rojo a la izquierda, amarillo en el centro, verde a la derecha
    C: Amarillo a la izquierda, rojo en el centro, verde a la derecha
    D: Rojo arriba, amarillo en el centro, verde abajo
  answer: B
  explanation: En algunas áreas metropolitanas, los semáforos son horizontales, donde
    la luz roja está a la izquierda, la luz amarilla en el centro y la luz verde a
    la derecha.
- id: 134
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a una intersección con una luz amarilla
    intermitente?
  choices:
    A: Detenerse por completo y esperar la luz verde
    B: Acelerar para despejar la intersección rápidamente
    C: Tratarla como una parada de cuatro vías
    D: Reducir la velocidad, buscar tráfico y proceder con precaución
  answer: D
  explanation: Una luz AMARILLA intermitente significa reducir la velocidad, buscar
    cualquier tráfico que entre en la intersección y proceder con precaución.
- id: 135
  category: safe_driving_rules
  question: ¿Bajo qué condición se permite un giro a la izquierda con una luz roja
    fija?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
    C: Al girar desde una calle de un solo sentido hacia una calle de doble sentido
    D: Los giros a la izquierda nunca están permitidos con luz roja
  answer: B
  explanation: Algunos giros a la izquierda pueden estar permitidos en rojo cuando
    se pasa de una calle de un solo sentido a otra calle de un solo sentido. Debe
    ceder el paso a todo el tráfico y a los peatones que crucen por delante o por
    los lados.
- id: 136
  category: safe_driving_rules
  question: ¿Qué indica una línea amarilla doble continua en el centro de la calzada?
  choices:
    A: Puede cruzar las líneas para rebasar a otro vehículo
    B: No puede cruzar estas líneas para rebasar, pero puede cruzarlas para realizar
      un giro
    C: No puede cruzar estas líneas por ningún motivo
    D: La calzada es una calle de un solo sentido
  answer: B
  explanation: Las líneas amarillas dobles continuas se utilizan para marcar el centro
    de la calzada cuando hay cuatro o más carriles de tráfico. No puede cruzar estas
    líneas para rebasar. Puede cruzar estas líneas para realizar un giro.
- id: 137
  category: safe_driving_rules
  question: Según la ley de Louisiana, ¿en qué carril debe circular si conduce a una
    velocidad inferior a la normal del tráfico?
  choices:
    A: El carril izquierdo
    B: El carril central
    C: El carril derecho
    D: Cualquier carril siempre que esté por debajo del límite de velocidad
  answer: C
  explanation: La ley de Louisiana establece que cualquier vehículo que circule a
    una velocidad inferior a la velocidad normal del tráfico deberá circular únicamente
    por el carril derecho.
- id: 138
  category: signs_and_signals
  question: ¿Cuál es el significado de una sola línea blanca continua entre carriles
    de tráfico que se mueven en la misma dirección?
  choices:
    A: El movimiento de carril a carril es peligroso y solo debe hacerse con mucho
      cuidado
    B: Cruzando la línea está estrictamente prohibido por ley
    C: El carril está reservado para vehículos de alta ocupación
    D: Puede cruzar la línea libremente para rebasar vehículos más lentos
  answer: A
  explanation: Las líneas blancas continuas simples indican que el movimiento de carril
    a carril es peligroso. Cuanto más ancha sea la línea, mayor será el peligro. Solo
    puede cruzar una línea blanca continua con mucho cuidado.
- id: 139
  category: signs_and_signals
  question: ¿Qué tipo de señales son azules, cuadradas o rectangulares, y muestran
    la ubicación de áreas de descanso, gasolineras y hospitales?
  choices:
    A: Señales de destino
    B: Señales de servicio
    C: Señales de número de ruta
    D: Señales de incidentes
  answer: B
  explanation: Las señales de servicio son señales azules de forma cuadrada o rectangular
    con letras o símbolos blancos. Muestran la ubicación de diversos servicios como
    áreas de descanso, gasolineras, hoteles u hospitales.
- id: 140
  category: signs_and_signals
  question: ¿Qué indica una señal de advertencia de 'Low Shoulder' (Arcén bajo) en
    una zona de construcción?
  choices:
    A: El puente de adelante tiene poco espacio libre
    B: Hay un desnivel pronunciado desde el borde del pavimento hasta el arcén
    C: Hay trabajadores presentes en el arcén
    D: El arcén está cerrado a todo el tráfico
  answer: B
  explanation: La señal de 'Low Shoulder' indica un desnivel pronunciado desde el
    borde del pavimento hasta el arcén. Si debe abandonar el pavimento, reduzca la
    velocidad y gire con firmeza.
- id: 141
  category: safe_driving_rules
  question: ¿Qué debe hacer al acercarse a un semáforo con luz roja intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse solo si hay tráfico en sentido contrario
    C: Detenerse detrás de la línea de parada o del cruce peatonal y seguir el mismo
      procedimiento que ante una señal de alto (STOP)
    D: Ceder el paso a los vehículos a la derecha y proceder sin detenerse
  answer: C
  explanation: Un semáforo con luz ROJA intermitente significa que debe detenerse
    detrás de una línea de parada, cruce peatonal o intersección antes de entrar y
    seguir el mismo procedimiento que seguiría ante una señal de alto (STOP).
- id: 142
  category: signs_and_signals
  question: ¿Qué indican las marcas rojas en el pavimento o los reflectores rojos?
  choices:
    A: Que hay una zona escolar más adelante
    B: Una calzada en la que no se debe entrar
    C: Un carril de bomberos donde está prohibido estacionar
    D: Que se aproxima un cruce de ferrocarril
  answer: B
  explanation: Las marcas rojas en el pavimento o los reflectores indican una calzada
    en la que no se debe entrar.
- id: 143
  category: signs_and_signals
  question: ¿Qué marcas viales están pintadas en el carril de circulación antes de
    un cruce de ferrocarril?
  choices:
    A: Una 'X' grande y dos letras 'R' con una línea central amarilla continua
    B: Una 'R' grande y una línea central blanca continua
    C: Una línea de parada roja y una 'X' amarilla
    D: Franjas blancas diagonales a lo largo de todo el carril
  answer: A
  explanation: Las marcas de cruce de ferrocarril son marcas blancas pintadas en el
    carril de circulación antes de los cruces ferroviarios. El pavimento está marcado
    con una 'X' grande y dos letras 'R'. Una línea central amarilla continua se extiende
    a lo largo de toda la distancia para evitar el adelantamiento.
- id: 144
  category: safe_driving_rules
  question: Según la ley de Louisiana, ¿cuándo debe circular por el carril de la derecha?
  choices:
    A: Solo cuando conduzca por debajo del límite de velocidad.
    B: En todo momento, a menos que se esté preparando para girar a la izquierda,
      adelantar, o si los carriles de la derecha están congestionados.
    C: Solo en carreteras de varios carriles.
    D: Siempre que conduzca un vehículo comercial.
  answer: B
  explanation: La ley de Louisiana establece que todos los vehículos deben circular
    por el carril de la derecha, a menos que se preparen para girar a la izquierda,
    adelantar a otro vehículo o cuando los carriles de la derecha estén congestionados.
- id: 145
  category: signs_and_signals
  question: ¿Para qué se utiliza el carril central designado con líneas amarillas
    continuas y discontinuas?
  choices:
    A: Adelantar vehículos más lentos.
    B: Solo para estacionamiento de emergencia.
    C: Solo para maniobras de giro a la izquierda.
    D: Solo para maniobras de giro a la derecha.
  answer: C
  explanation: Las marcas de canalización de giro a la izquierda en ambos sentidos
    designan un carril central que puede ser utilizado por vehículos que viajan en
    cualquier dirección ÚNICAMENTE para maniobras de giro a la izquierda. Nunca debe
    usarse para adelantar.
- id: 146
  category: sharing_the_road
  question: ¿Quién tiene la prioridad de paso cuando hay peatones en un cruce peatonal?
  choices:
    A: Los vehículos de motor que circulan en línea recta.
    B: Los peatones.
    C: Los vehículos que giran a la derecha.
    D: Solo las bicicletas.
  answer: B
  explanation: Cuando los peatones están en los cruces peatonales, tienen la prioridad
    de paso sobre los vehículos de motor. Usted debe detenerse ante los peatones en
    los cruces peatonales.
- id: 147
  category: safe_driving_rules
  question: Si descubre que está en un carril que le obliga a girar, pero desea seguir
    recto, ¿qué debe hacer?
  choices:
    A: Detenerse y esperar una oportunidad para cambiar de carril.
    B: Cambiar de carril rápidamente si usa su señal de giro.
    C: Realizar el giro y luego dar la vuelta a la manzana.
    D: Poner el vehículo en reversa y retroceder para salir del carril.
  answer: C
  explanation: Si se encuentra en un carril de giro, detenerse bloquea el tráfico
    y los cambios bruscos de carril son inesperados. Debe realizar el giro, dar la
    vuelta a la manzana y regresar a la calle deseada de manera segura.
- id: 148
  category: safe_driving_rules
  question: En una rotonda, ¿a quién debe ceder el paso el tráfico que entra?
  choices:
    A: Al tráfico que entra por la derecha.
    B: Solo a los peatones.
    C: Al tráfico que ya está circulando.
    D: Al tráfico que entra por la izquierda.
  answer: C
  explanation: En una rotonda, el tráfico cede el paso al tráfico que ya está circulando.
- id: 149
  category: defensive_driving
  question: ¿Qué sucede durante la tercera fase de un choque, cuando 'sus órganos
    internos también chocan'?
  choices:
    A: El vehículo absorbe toda la fuerza del choque.
    B: Su cuerpo es lanzado hacia adelante contra el tablero.
    C: Sus órganos internos chocan contra sus huesos, causando lesiones internas.
    D: Las bolsas de aire se despliegan para proteger el exterior del vehículo.
  answer: C
  explanation: Una vez que su cuerpo se detiene contra el automóvil, la fuerza continúa
    dentro de usted. Su cerebro golpea contra su cráneo y órganos como los riñones
    chocan contra sus huesos, causando lesiones internas.
- id: 150
  category: driver_responsibility
  question: Según el manual, ¿cuál es la infracción de tráfico más común?
  choices:
    A: No ceder el paso.
    B: El exceso de velocidad.
    C: Conducción descuidada.
    D: Seguir a otro vehículo demasiado cerca.
  answer: B
  explanation: Todos los días, las personas infringen las leyes al conducir. La infracción
    de tráfico más común es el exceso de velocidad.
- id: 151
  category: defensive_driving
  question: ¿Según la tercera ley del movimiento de Newton, qué sucede cuando un automóvil
    pesado y uno más ligero chocan?
  choices:
    A: El automóvil más pesado experimenta una fuerza mayor.
    B: Las fuerzas son iguales, pero el cambio de velocidad es mayor en el automóvil
      más ligero.
    C: El automóvil más ligero sufre menos daños.
    D: Las fuerzas son absorbidas completamente por el automóvil más pesado.
  answer: B
  explanation: La tercera ley de Newton nos dice que cada automóvil experimenta la
    misma fuerza durante la colisión, pero el cambio de velocidad será mucho mayor
    en el más ligero de los dos vehículos, lo que resulta en mayores daños para el
    automóvil más ligero.
- id: 152
  category: safe_driving_rules
  question: ¿En qué medida reduce el uso del cinturón de seguridad el riesgo de lesiones
    graves y muertes en accidentes?
  choices:
    A: 10 por ciento.
    B: 25 por ciento.
    C: 50 por ciento.
    D: 90 por ciento.
  answer: C
  explanation: Las personas que usan el cinturón de seguridad reducen su riesgo de
    lesiones graves en un 50 por ciento y también reducen el riesgo de muertes en
    un 50 por ciento.
- id: 153
  category: vehicle_information
  question: ¿Dónde debe colocarse la parte abdominal de su cinturón de seguridad para
    absorber mejor el impacto de un choque?
  choices:
    A: Ajustada a través de sus caderas.
    B: Holgada a través de su estómago.
    C: Alta en su cintura.
    D: A través de la parte superior de sus muslos.
  answer: A
  explanation: Su cinturón de seguridad debe quedar ajustado a través de sus caderas.
    Los huesos de la cadera son fuertes y pueden absorber más el impacto que la región
    abdominal.
- id: 154
  category: defensive_driving
  question: ¿A qué velocidades ocurren el 80% de las muertes en accidentes automovilísticos?
  choices:
    A: A más de 70 millas por hora.
    B: Entre 55 y 65 millas por hora.
    C: A menos de 40 millas por hora.
    D: Exactamente a 50 millas por hora.
  answer: C
  explanation: Según los datos sobre el cinturón de seguridad en el manual, el 80%
    de las muertes ocurren en automóviles que viajan a menos de 40 millas por hora.
- id: 155
  category: defensive_driving
  question: ¿Cuál es la probabilidad real de quedar atrapado en un automóvil en llamas
    o sumergido?
  choices:
    A: Alrededor del 10 por ciento.
    B: Menos de la mitad del uno por ciento.
    C: Exactamente el 5 por ciento.
    D: Más del 20 por ciento.
  answer: B
  explanation: El manual establece que hay menos de la mitad del uno por ciento de
    probabilidades de quedar atrapado en un automóvil en llamas o sumergido.
- id: 156
  category: safe_driving_rules
  question: Si está embarazada, ¿cuál es la forma más segura de usar el cinturón de
    seguridad?
  choices:
    A: Usar solo el cinturón abdominal.
    B: Usar solo el cinturón de hombro.
    C: No usar el cinturón de seguridad para proteger al feto.
    D: Usar tanto el cinturón abdominal como el de hombro.
  answer: D
  explanation: Si está embarazada, usted y su hijo por nacer estarán mucho más seguros
    si usa el cinturón abdominal y el de hombro. Al protegerse de lesiones, protege
    a su hijo por nacer.
- id: 157
  category: defensive_driving
  question: 'Se han registrado muertes de personas sin cinturón a velocidades tan
    bajas como:'
  choices:
    A: 5 mph.
    B: 12 mph.
    C: 20 mph.
    D: 25 mph.
  answer: B
  explanation: El manual señala que se han registrado muertes de personas sin cinturón
    a velocidades tan bajas como 12 mph.
- id: 158
  category: signs_and_signals
  question: Cuando vea flechas blancas pintadas en el carril de tráfico que indican
    más de una dirección, ¿qué debe hacer?
  choices:
    A: Debe seguir recto.
    B: Puede elegir cualquiera de las direcciones indicadas.
    C: Debe girar a la derecha.
    D: Debe detenerse y esperar una señal de flecha verde.
  answer: B
  explanation: Las marcas direccionales indican la dirección en la que debe ir. Donde
    las flechas indican más de una dirección, puede elegir cualquier dirección.
- id: 159
  category: safe_driving_rules
  question: Según el manual, ¿qué porcentaje adicional de vidas se podrían haber salvado
    si todos en un accidente hubieran llevado puesto el cinturón de seguridad?
  choices:
    A: 30%
    B: 40%
    C: 50%
    D: 60%
  answer: D
  explanation: 'El manual establece: ''Si todos los que estuvieron en un accidente
    hubieran llevado puesto su cinturón de seguridad en el momento del choque, se
    podrían haber salvado un 60% más de vidas''.'
- id: 160
  category: safe_driving_rules
  question: ¿Cómo debe usarse correctamente un cinturón abdominal?
  choices:
    A: Holgado a través de los muslos
    B: Ajustado a través de sus caderas y la parte inferior de su abdomen
    C: Apretado a través de la parte superior del estómago
    D: Ajustado a través del pecho y la caja torácica
  answer: B
  explanation: Según el manual, 'Los cinturones abdominales deben abrocharse de forma
    ajustada a través de sus caderas y la parte inferior de su abdomen'.
- id: 161
  category: safe_driving_rules
  question: 'Un niño no puede ser transportado en el asiento delantero de un vehículo
    con una bolsa de aire (airbag) activa si tiene:'
  choices:
    A: 8 años o menos o menos de 80 libras.
    B: 6 años o menos o menos de 60 libras.
    C: 10 años o menos o menos de 100 libras.
    D: 12 años o menos o menos de 90 libras.
  answer: B
  explanation: La ley exige que 'Un niño de 6 años o menos o de menos de 60 libras
    no puede ser transportado en el asiento delantero de un vehículo con una bolsa
    de aire activa'.
- id: 162
  category: safe_driving_rules
  question: ¿Cuál es el requisito de sujeción para niños pasajeros para un bebé desde
    el nacimiento o que pese menos de 20 libras a cualquier edad?
  choices:
    A: Asiento de seguridad para el automóvil aprobado por el gobierno federal, orientado
      hacia adelante
    B: Asiento elevado (booster seat) con sujeciones
    C: Asiento de seguridad para el automóvil aprobado por el gobierno federal, orientado
      hacia atrás
    D: Cinturón de seguridad estándar en el asiento trasero
  answer: C
  explanation: El manual especifica que para un niño desde el 'nacimiento o menos
    de 20 libras a cualquier edad', debe estar en un 'asiento de seguridad para el
    automóvil aprobado por el gobierno federal, orientado hacia atrás'.
- id: 163
  category: safe_driving_rules
  question: Si un niño entra en más de una categoría de edad o peso con respecto a
    los sistemas de sujeción para niños, ¿qué debe hacer?
  choices:
    A: Elegir la categoría basándose estrictamente en la edad
    B: Elegir la categoría basándose estrictamente en el peso
    C: Elegir la categoría menos restrictiva
    D: Elegir la categoría más protectora
  answer: D
  explanation: 'El manual establece: ''Un niño que entra en más de una categoría de
    edad o peso debe elegir la categoría más protectora''.'
- id: 164
  category: safe_driving_rules
  question: ¿Cuál es el lugar más seguro en un automóvil de pasajeros para que se
    sienten los niños menores de 13 años?
  choices:
    A: El asiento del pasajero delantero
    B: El centro del asiento trasero
    C: El lado derecho del asiento trasero
    D: El lado izquierdo del asiento trasero
  answer: B
  explanation: El manual aconseja 'Hacer que todos los niños menores de 13 años se
    sienten en el asiento trasero. El centro del asiento trasero en un automóvil de
    pasajeros es más seguro que el asiento delantero'.
- id: 165
  category: vehicle_information
  question: Debido a la velocidad a la que se despliegan las bolsas de aire (airbags),
    ¿cuáles son las posiciones recomendadas de las manos en el volante?
  choices:
    A: 10 y 2
    B: 11 y 1
    C: 9 y 3 u 8 y 4
    D: 7 y 5 o 12 y 6
  answer: C
  explanation: El manual explica que debido a que las bolsas de aire se despliegan
    a una velocidad de 150 a 200 mph, la posición tradicional de las 10 y las 2 puede
    causar lesiones graves. 'Las posiciones recomendadas son las 9 y 3 o las 8 y 4'.
- id: 166
  category: safe_driving_rules
  question: ¿A qué distancia debe sentarse un conductor de un volante equipado con
    una bolsa de aire (airbag)?
  choices:
    A: Al menos 5 pulgadas
    B: Al menos 10 pulgadas
    C: Al menos 15 pulgadas
    D: Al menos 20 pulgadas
  answer: B
  explanation: Se requiere que los conductores 'se sienten al menos a 10 pulgadas
    de distancia del volante equipado con una bolsa de aire; de lo contrario, la bolsa
    puede explotar contra usted, causando daños graves'.
- id: 167
  category: vehicle_information
  question: ¿En cuál de las siguientes situaciones NO se desplegarán las bolsas de
    aire (airbags)?
  choices:
    A: Cuando otro automóvil lo choca por detrás
    B: Durante una colisión frontal
    C: Durante una colisión casi frontal
    D: Al viajar a más de 50 mph
  answer: A
  explanation: 'El manual establece explícitamente: ''Las bolsas de aire no se despliegan
    cuando otro automóvil lo choca por detrás''.'
- id: 168
  category: vehicle_information
  question: En seguridad automotriz, ¿a qué se refiere el término 'seguridad activa'?
  choices:
    A: Componentes que protegen a los ocupantes durante un choque
    B: Tecnología que ayuda a prevenir un choque
    C: La estructura física del vehículo
    D: El uso de maniquíes de prueba de choque
  answer: B
  explanation: Según el manual, la 'seguridad activa' se refiere a la tecnología que
    ayuda a prevenir un choque.
- id: 169
  category: vehicle_information
  question: ¿Cuál de los siguientes se considera un componente de 'seguridad pasiva'?
  choices:
    A: Sistemas de frenos antibloqueo (ABS)
    B: Sistemas de advertencia de salida de carril
    C: Bolsas de aire (airbags) y cinturones de seguridad
    D: Control de crucero adaptativo
  answer: C
  explanation: El manual establece que la 'seguridad pasiva' se refiere a los componentes
    del vehículo '(principalmente bolsas de aire, cinturones de seguridad y la estructura
    física del vehículo) que ayudan a proteger a los ocupantes durante un choque'.
- id: 170
  category: vehicle_information
  question: ¿Cómo reaccionan las ventanas laterales y traseras de vidrio templado
    cuando reciben un impacto durante una colisión?
  choices:
    A: Permanecen en una sola pieza sólida
    B: Se astillan en fragmentos dentados
    C: Se rompen en gránulos con bordes mínimamente afilados
    D: Absorben el impacto sin romperse
  answer: C
  explanation: El manual explica que 'las ventanas laterales y traseras de vidrio
    templado se rompen en gránulos con bordes mínimamente afilados, en lugar de astillarse
    en fragmentos dentados como lo hace el vidrio ordinario'.
- id: 171
  category: vehicle_information
  question: ¿Cuál es el propósito de las zonas de deformación en un vehículo?
  choices:
    A: Absorber y disipar la fuerza de una colisión lejos del compartimento de pasajeros
    B: Evitar que el techo del vehículo colapse en un vuelco
    C: Mantener el parabrisas en una sola pieza durante un impacto
    D: Alertar al conductor de una salida involuntaria del carril
  answer: A
  explanation: 'El manual establece: ''Las zonas de deformación absorben y disipan
    la fuerza de una colisión, desplazándola y desviándola lejos del compartimento
    de pasajeros y reduciendo la fuerza del impacto sobre los ocupantes del vehículo''.'
- id: 172
  category: sharing_the_road
  question: ¿Qué deben tener los autobuses escolares y los camiones semirremolque
    para una mayor visibilidad por la noche?
  choices:
    A: Sistemas de visión nocturna por infrarrojos
    B: Faros adaptativos
    C: Tiras retrorreflectantes que delinean sus perímetros laterales y traseros
    D: Luces estroboscópicas intermitentes en el techo
  answer: C
  explanation: Según el manual, 'Los autobuses escolares y los camiones semirremolque
    en América del Norte deben llevar tiras retrorreflectantes que delineen sus perímetros
    laterales y traseros para una mayor visibilidad por la noche'.
- id: 173
  category: vehicle_information
  question: Según algunos estudios mencionados en el manual, ¿cómo podría influir
    el color del vehículo en la seguridad?
  choices:
    A: Los autos de colores más oscuros están involucrados en menos accidentes
    B: Los autos de colores más claros parecen estar involucrados en menos accidentes
      que los de colores oscuros
    C: Los autos rojos están involucrados en la mayoría de los accidentes
    D: El color del vehículo no tiene un impacto medible en la seguridad
  answer: B
  explanation: 'El manual señala: ''Algunos estudios indican que el color puede ser
    un factor para determinar la seguridad. Los autos de colores más claros parecen
    estar involucrados en menos accidentes que los de colores oscuros''.'
- id: 174
  category: vehicle_information
  question: Según algunos estudios, ¿qué color de autos parece estar involucrado en
    menos accidentes?
  choices:
    A: Colores más oscuros
    B: Colores más claros
    C: Colores rojos
    D: Autos de varios colores
  answer: B
  explanation: El manual establece que algunos estudios indican que los autos de colores
    más claros parecen estar involucrados en menos accidentes que los de colores oscuros.
- id: 175
  category: vehicle_information
  question: 'Durante una inspección semanal previa al viaje, debe asegurarse de que
    sus neumáticos tengan una profundidad de dibujo mínima de al menos:'
  choices:
    A: 1/32 de pulgada
    B: 1/16 de pulgada
    C: 1/8 de pulgada
    D: 1/4 de pulgada
  answer: B
  explanation: Debe asegurarse de que los neumáticos tengan un dibujo adecuado, que
    es de al menos 1/16 de pulgada de profundidad entre todos los dibujos.
- id: 176
  category: vehicle_information
  question: ¿Cuál de los siguientes se recomienda como una revisión mensual del vehículo
    en lugar de una revisión semanal?
  choices:
    A: Revisar la presión de los neumáticos
    B: Revisar la bocina
    C: Revisar la llanta de repuesto, el gato y el equipo de emergencia
    D: Revisar la tapa del combustible
  answer: C
  explanation: La revisión de la llanta de repuesto, el gato y el equipo de emergencia
    para verificar su operatividad figura en las Revisiones Mensuales Sugeridas, mientras
    que la presión de los neumáticos, la bocina y la tapa del combustible son revisiones
    semanales.
- id: 177
  category: safe_driving_rules
  question: ¿Qué precaución de seguridad debe tomar antes de revisar debajo del capó
    de su vehículo?
  choices:
    A: Mantener el motor en marcha para comprobar la circulación de fluidos
    B: Poner el vehículo en punto muerto sin el freno de estacionamiento
    C: Asegurarse de que el motor se haya enfriado y que el freno de estacionamiento
      esté puesto
    D: Encender las luces de emergencia y las luces altas
  answer: C
  explanation: 'El manual señala que se debe pensar primero en la seguridad: asegúrese
    de que el motor de su vehículo se haya enfriado antes de revisar debajo del capó
    y asegúrese de que el freno de estacionamiento esté puesto.'
- id: 178
  category: defensive_driving
  question: 'Antes de entrar a su vehículo, debe verificar si hay obstáculos en su
    trayectoria de viaje mirando:'
  choices:
    A: Solo delante del vehículo
    B: Solo detrás del vehículo
    C: Delante, debajo y detrás del vehículo
    D: Al techo del vehículo
  answer: C
  explanation: Antes de entrar a su vehículo, debe revisar a su alrededor para detectar
    cualquier obstáculo que pueda interferir con una conducción segura, mirando delante,
    debajo y detrás del vehículo.
- id: 179
  category: safe_driving_rules
  question: ¿Cómo deben estar posicionadas sus rodillas y talones cuando está sentado
    correctamente para conducir?
  choices:
    A: Rodillas bloqueadas rectas y el talón suspendido sobre el suelo
    B: Rodillas ligeramente dobladas y el talón derecho firmemente apoyado en el suelo
    C: Rodillas dobladas en un ángulo de 90 grados con ambos pies planos
    D: Talón izquierdo apoyado firmemente en el pedal del acelerador
  answer: B
  explanation: Sus rodillas siempre deben estar ligeramente dobladas para evitar lesiones
    en un accidente, y su talón derecho debe estar firmemente apoyado en el suelo
    para que pueda cambiar entre los pedales del acelerador y del freno.
- id: 180
  category: safe_driving_rules
  question: 'Al detenerse detrás de otro vehículo, debe detenerse lo suficientemente
    lejos como para poder:'
  choices:
    A: Ver la cara del conductor en su espejo retrovisor
    B: Ver la parte inferior de los neumáticos del vehículo
    C: Leer su placa de matrícula con claridad
    D: Tocar su parachoques si avanza ligeramente
  answer: B
  explanation: Siempre debe detenerse lo suficientemente lejos del vehículo que tiene
    delante para poder ver la parte inferior de sus neumáticos.
- id: 181
  category: safe_driving_rules
  question: ¿Cuál es la técnica adecuada al dar marcha atrás con su vehículo?
  choices:
    A: Confiar totalmente en su espejo retrovisor
    B: Girar la cabeza y mirar hacia atrás
    C: Usar solo los espejos laterales
    D: Tocar la bocina continuamente mientras mira hacia adelante
  answer: B
  explanation: Al dar marcha atrás, debe girar la cabeza y mirar hacia atrás, y no
    limitarse a mirar por el espejo retrovisor.
- id: 182
  category: safe_driving_rules
  question: ¿Qué sucederá si gira el encendido de su vehículo a la posición de "bloqueo"
    (lock) mientras aún está en movimiento?
  choices:
    A: Los frenos fallarán de inmediato
    B: El motor se acelerará
    C: El volante se bloqueará y perderá el control de su vehículo
    D: Las bolsas de aire se desplegarán
  answer: C
  explanation: Nunca gire el encendido de su vehículo a la posición de "bloqueo" (lock)
    mientras esté en movimiento, ya que esto hará que el volante se bloquee si intenta
    girarlo, lo que resultará en una pérdida de control.
- id: 183
  category: driver_responsibility
  question: 'Según el manual, las tres habilidades básicas de la tarea de conducir
    son:'
  choices:
    A: Física, social y mental
    B: Visual, auditiva y táctil
    C: Estratégica, táctica y operativa
    D: Dirección, frenado y aceleración
  answer: A
  explanation: Las tres habilidades básicas de la tarea de conducir son la habilidad
    física (coordinación), la habilidad social (interacción con los demás) y la habilidad
    mental (toma de decisiones).
- id: 184
  category: driver_responsibility
  question: ¿Cuál de las siguientes se considera una "decisión táctica" que puede
    afectar su eficiencia al conducir?
  choices:
    A: Puesta a punto del motor
    B: Selección de la ruta
    C: Marcha en ralentí (idling)
    D: Uso del aire acondicionado
  answer: B
  explanation: Los hábitos de conducción de baja eficiencia se dividen en categorías.
    Las decisiones tácticas incluyen la selección de la ruta, la congestión del tráfico
    y el peso de la carga.
- id: 185
  category: vehicle_information
  question: Antes de arrancar el motor, ¿debe asegurarse de que su automóvil esté
    en qué marcha?
  choices:
    A: Directa (Drive) o reversa
    B: Primera o segunda marcha
    C: Estacionamiento (Park) o neutral
    D: Sobremarcha (Overdrive)
  answer: C
  explanation: Antes de arrancar el motor, debe asegurarse de que su automóvil esté
    en la marcha de estacionamiento (park) o neutral.
- id: 186
  category: driver_responsibility
  question: ¿Cuál es la forma adecuada de desechar el aceite de motor usado o las
    baterías viejas de los vehículos?
  choices:
    A: Tirarlos en la basura doméstica regular
    B: Abandonarlos dentro de su vehículo viejo
    C: Llevarlos a una instalación que acepte baterías o aceite de motor usados
    D: Verter el aceite en un alcantarillado pluvial
  answer: C
  explanation: No es seguro para el medio ambiente simplemente desechar estos artículos.
    Hay muchas instalaciones ubicadas en todo el estado que aceptarán baterías o aceite
    de motor usados.
- id: 187
  category: safe_driving_rules
  question: ¿Cuáles de los siguientes factores son indicadores que tienen el mayor
    potencial para reducir el ahorro de combustible?
  choices:
    A: Selección de la ruta, velocidad y puesta a punto del motor
    B: Uso del aire acondicionado y volumen del radio
    C: Color del vehículo y aerodinámica
    D: Marca de los neumáticos y tinte de las ventanas
  answer: A
  explanation: Según el manual, la selección de la ruta, la velocidad y la puesta
    a punto del motor son indicadores que tienen el mayor potencial para reducir el
    ahorro de combustible.
- id: 188
  category: vehicle_information
  question: 'Mantener los neumáticos inflados correctamente puede mejorar el rendimiento
    de la gasolina hasta en un:'
  choices:
    A: 1.5 por ciento
    B: 3.3 por ciento
    C: 5.0 por ciento
    D: 10 por ciento
  answer: B
  explanation: El manual establece que mantener los neumáticos inflados correctamente
    puede mejorar el rendimiento de la gasolina hasta en un 3.3 por ciento.
- id: 189
  category: vehicle_information
  question: ¿Dónde puede encontrar generalmente la presión correcta de los neumáticos
    para su vehículo?
  choices:
    A: En el volante
    B: En la tapa de la gasolina
    C: En una calcomanía ubicada en el marco de la puerta del lado del conductor
    D: En el flanco (pared lateral) del neumático
  answer: C
  explanation: La presión correcta de los neumáticos para su vehículo se encuentra
    generalmente en una calcomanía ubicada en el marco de la puerta del lado del conductor,
    o en el manual del propietario.
- id: 190
  category: vehicle_information
  question: ¿Qué tipo de neumático es duradero en clima seco pero no es adecuado para
    clima húmedo?
  choices:
    A: Neumático para todas las estaciones
    B: Neumático estándar
    C: Neumático de invierno
    D: Neumático de alto rendimiento (performance)
  answer: D
  explanation: El neumático de alto rendimiento se utiliza para automóviles más rápidos
    y es duradero en clima seco, pero no es adecuado para clima húmedo.
- id: 191
  category: vehicle_information
  question: ¿Por qué no se deben usar neumáticos de invierno en condiciones secas?
  choices:
    A: Reducirán la velocidad máxima del vehículo
    B: Se dañarán en la carretera
    C: Harán que el motor se sobrecaliente
    D: Aumentarán demasiado el consumo de combustible
  answer: B
  explanation: El manual establece que un neumático de invierno no debe usarse en
    condiciones secas, ya que se dañará en la carretera.
- id: 192
  category: defensive_driving
  question: Cuando un neumático se acerca a sus límites de tracción, tiende a deslizarse
    lateralmente. ¿Cómo se llama el ángulo entre la trayectoria real del neumático
    y su trayectoria natural?
  choices:
    A: El ángulo de dirección
    B: El ángulo de deriva (slip angle)
    C: El ángulo de tracción
    D: El ángulo de rotación
  answer: B
  explanation: El ángulo entre la trayectoria real de los neumáticos y su trayectoria
    natural se denomina ángulo de deriva (slip angle), el cual advierte al conductor
    con antelación sobre la pérdida de tracción.
- id: 193
  category: defensive_driving
  question: ¿Qué sucede cuando un vehículo experimenta un "sobreviraje" (over steer)?
  choices:
    A: El coche gira menos de lo esperado
    B: Los neumáticos delanteros pierden tracción antes que los traseros
    C: El coche gira más de lo esperado
    D: El coche se detiene por completo
  answer: C
  explanation: El sobreviraje (over steer) es cuando el coche gira más de lo esperado.
    Ocurre cuando los neumáticos traseros pierden tracción antes que las ruedas delanteras
    al tomar una curva.
- id: 194
  category: defensive_driving
  question: ¿Cuál es la reacción correcta si su vehículo comienza a sobrevirar?
  choices:
    A: Frenar bruscamente de inmediato
    B: Aumentar el ángulo de dirección y acelerar
    C: Reducir suavemente el ángulo de dirección y soltar el acelerador
    D: Tirar del freno de mano
  answer: C
  explanation: Frenar bruscamente solo agravará la situación. La reacción correcta
    ante el sobreviraje es reducir suavemente el ángulo de dirección y soltar el acelerador.
- id: 195
  category: vehicle_information
  question: ¿Qué tipo de vehículo es más propenso al subviraje (under steer)?
  choices:
    A: Vehículos de tracción trasera
    B: Vehículos de tracción delantera
    C: Vehículos de tracción integral (AWD)
    D: Vehículos de tracción en las cuatro ruedas (4WD)
  answer: B
  explanation: Los vehículos de tracción delantera son más propensos al subviraje
    porque los neumáticos delanteros deben manejar tanto la fuerza lateral de giro
    como el par motor.
- id: 196
  category: safe_driving_rules
  question: Al usar la técnica de dirección de manos juntas (empujar/tirar), ¿dónde
    deben sujetar las manos el volante?
  choices:
    A: Mano izquierda entre las 10 y las 11, mano derecha entre la 1 y las 2
    B: Mano izquierda entre las 7 y las 8, mano derecha entre las 4 y las 5
    C: Mano izquierda a las 12, mano derecha a las 6
    D: Mano izquierda entre las 8 y las 9, mano derecha entre las 3 y las 4
  answer: B
  explanation: Al usar la dirección de manos juntas, la mano izquierda sujeta el volante
    entre las 7 y las 8, y la mano derecha sujeta el volante entre las 4 y las 5.
- id: 197
  category: safe_driving_rules
  question: ¿Por qué ya no se recomienda la posición de las manos a las 2 y las 10
    en el volante?
  choices:
    A: Hace que los brazos del conductor se cansen más rápido
    B: Reduce el campo de visión del conductor
    C: Puede ser peligroso en vehículos equipados con bolsas de aire (airbags) en
      el lado del conductor
    D: Dificulta alcanzar la señal de giro
  answer: C
  explanation: La posición de las 2 y las 10 no se recomienda porque puede ser peligrosa
    en vehículos equipados con bolsas de aire.
- id: 198
  category: safe_driving_rules
  question: ¿Cuándo se debe utilizar la técnica de dirección de manos cruzadas (hand-over-hand)?
  choices:
    A: Al conducir en la autopista a más de 50 mph
    B: Al girar el volante a bajas velocidades, como en una intersección o al estacionar
    C: Al realizar maniobras evasivas para evitar un choque
    D: Al operar los controles del vehículo como los limpiaparabrisas o las luces
      de emergencia
  answer: B
  explanation: Utilice la dirección de manos cruzadas al girar el volante a bajas
    velocidades, como en una intersección o al estacionar el vehículo.
- id: 199
  category: defensive_driving
  question: 'Al intentar evadir un problema en la calzada, es fundamental limitar
    el giro del volante a no más de:'
  choices:
    A: 45 grados
    B: 90 grados
    C: 180 grados
    D: 360 grados
  answer: C
  explanation: Es fundamental limitar el giro a no más de 180 grados de dirección
    al intentar evadir un problema en la calzada para evitar la pérdida de tracción.
- id: 200
  category: safe_driving_rules
  question: ¿Cuándo es apropiado conducir con una sola mano?
  choices:
    A: Solo al dar marcha atrás o al operar controles del vehículo que requieren un
      alcance temporal
    B: Al conducir en una autopista recta y vacía
    C: Al realizar un giro cerrado en una intersección
    D: Al conducir un vehículo de transmisión manual en todo momento
  answer: A
  explanation: Use la dirección con una sola mano solo al dar marcha atrás o al operar
    los controles del vehículo (limpiaparabrisas, luces de emergencia, luces, etc.)
    que requieran retirar temporalmente una mano del volante.
- id: 201
  category: safe_driving_rules
  question: ¿Cuál es el único momento en que se recomienda la posición de las manos
    a las 12 en punto en el volante?
  choices:
    A: Al conducir en una carretera recta y abierta
    B: Al retroceder un vehículo hacia la izquierda o hacia la derecha y el conductor
      tiene que girar en el asiento
    C: Al realizar un giro en U cerrado en una zona residencial
    D: Cuando el vehículo comienza a deslizarse sobre el agua (hydroplane) en carreteras
      mojadas
  answer: B
  explanation: Según el manual, el único momento en que se recomiendan las 12 en punto
    es al retroceder un vehículo hacia la izquierda o hacia la derecha y el conductor
    tiene que girar en el asiento para poder ver la trayectoria de desplazamiento.
- id: 202
  category: safe_driving_rules
  question: ¿Cuáles son las tres partes que componen cada curva?
  choices:
    A: El acercamiento, el giro y la recta
    B: El freno, el avance por inercia y la aceleración
    C: La entrada, el ápice (vértice) y la salida
    D: El punto ciego, la curva y la salida
  answer: C
  explanation: 'El manual establece que cada curva se compone de tres partes: la entrada,
    el ápice y la salida.'
- id: 203
  category: defensive_driving
  question: ¿Cómo afecta el duplicar la velocidad de su vehículo a la fuerza de giro?
  choices:
    A: Duplica la fuerza de giro
    B: Triplica la fuerza de giro
    C: Genera cuatro veces la fuerza de giro
    D: Reduce la fuerza de giro a la mitad
  answer: C
  explanation: La carga de giro depende de la velocidad al cuadrado. El manual explica
    que duplicar la velocidad genera cuatro veces la fuerza de giro.
- id: 204
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos en el volante para tomar
    una curva?
  choices:
    A: A las diez y a las dos
    B: A las nueve y a las tres
    C: A las ocho y a las cuatro
    D: Una mano a las doce
  answer: B
  explanation: El plan de 10 puntos para tomar curvas establece que se deben mantener
    ambas manos en el volante a las nueve y a las tres.
- id: 205
  category: vehicle_information
  question: ¿Qué le sucede al vehículo cuando deja de acelerar al entrar en una curva?
  choices:
    A: El peso se transfiere a las ruedas traseras, reduciendo la tracción
    B: El vehículo pierde inmediatamente el control de la dirección
    C: El peso se transfiere hacia adelante, añadiendo peso a las ruedas delanteras
      y ayudando al agarre de la dirección
    D: Los frenos se activan automáticamente para reducir la velocidad del vehículo
  answer: C
  explanation: Dejar de acelerar al girar hace que un poco de peso se transfiera hacia
    adelante, añadiendo peso a las ruedas delanteras y ayudando a que la dirección
    se agarre a la carretera.
- id: 206
  category: defensive_driving
  question: ¿Por qué debe evitar conducir a través de charcos grandes durante las
    lluvias de primavera?
  choices:
    A: Pueden afectar sus frenos, ensuciar su parabrisas o hacer que se deslice sobre
      el agua (hydroplane)
    B: Harán que sus neumáticos se inflen en exceso
    C: Aumentan la capacidad de carga útil de su vehículo
    D: Pueden hacer que su convertidor catalítico se incendie
  answer: A
  explanation: El manual aconseja evitar los charcos grandes porque pueden afectar
    sus frenos, ensuciar su parabrisas o hacer que se deslice sobre el agua (hydroplane).
- id: 207
  category: alcohol_drugs_health
  question: ¿Cómo pueden las alergias primaverales afectar potencialmente su seguridad
    al conducir?
  choices:
    A: Los estornudos hacen que pierda el agarre del volante
    B: Los medicamentos para la alergia de venta libre pueden tener efectos secundarios
      que disminuyen su capacidad de conducción
    C: El polen cubre el parabrisas y los limpiaparabrisas no pueden quitarlo
    D: Los medicamentos para la alergia aumentan su tiempo de reacción de manera positiva
  answer: B
  explanation: El manual advierte que los medicamentos para la alergia de venta libre
    pueden tener efectos secundarios o interactuar con otros medicamentos para disminuir
    su capacidad de conducción.
- id: 208
  category: vehicle_information
  question: ¿A qué se refiere la capacidad de carga útil de un vehículo?
  choices:
    A: La velocidad máxima a la que puede viajar un vehículo cuando está totalmente
      cargado
    B: La cantidad de combustible que el tanque de gasolina puede contener de forma
      segura
    C: El peso máximo de toda la carga y los pasajeros que el vehículo puede transportar
      de forma segura
    D: El límite de remolque del enganche del vehículo
  answer: C
  explanation: La capacidad de carga útil se define en el manual como el peso máximo
    de toda la carga y los pasajeros que el vehículo puede transportar de forma segura.
- id: 209
  category: vehicle_information
  question: ¿Cómo afecta el clima caluroso del verano a la presión de los neumáticos
    de su vehículo?
  choices:
    A: La presión de los neumáticos disminuye una libra por cada aumento de 10 grados
    B: La presión de los neumáticos aumenta aproximadamente una libra por cada aumento
      de 10 grados Fahrenheit
    C: La presión de los neumáticos permanece constante independientemente de la temperatura
      exterior
    D: La presión de los neumáticos cae significativamente, requiriendo un inflado
      diario
  answer: B
  explanation: En los meses calurosos de verano, por cada aumento de 10 grados Fahrenheit
    en la temperatura del aire, la presión de los neumáticos aumenta aproximadamente
    una libra.
- id: 210
  category: safe_driving_rules
  question: ¿Por qué es peligroso estacionar su vehículo cerca de montones de hojas
    secas en el otoño?
  choices:
    A: Las hojas pueden pinchar sus neumáticos
    B: Las hojas pueden ocultar baches profundos
    C: Podría iniciarse un incendio debido al convertidor catalítico de su vehículo
    D: Las hojas desalinearán la parte delantera de su automóvil
  answer: C
  explanation: El manual indica que se debe evitar estacionar el vehículo cerca de
    montones de hojas para prevenir incendios que podrían iniciarse debido al convertidor
    catalítico de su vehículo.
- id: 211
  category: defensive_driving
  question: ¿Según el plan de 10 puntos para tomar curvas, qué es lo principal que
    dirige un automóvil?
  choices:
    A: Las manos del conductor
    B: Los neumáticos delanteros
    C: Los ojos del conductor
    D: La columna de dirección
  answer: C
  explanation: 'El manual enfatiza mirar lo más lejos posible alrededor de la curva,
    afirmando: ''Los ojos son lo principal que dirige un automóvil, no las manos''.'
- id: 212
  category: defensive_driving
  question: ¿Qué peligro al conducir está específicamente asociado con el fin del
    horario de verano en el otoño?
  choices:
    A: El aumento de las temperaturas que provoca reventones de neumáticos
    B: La reducción de la visibilidad en las carreteras, lo que crea condiciones de
      conducción desconocidas
    C: Un aumento en el número de baches
    D: Exceso de polen en las calzadas
  answer: B
  explanation: El fin del horario de verano significa una reducción de la visibilidad
    en las carreteras, lo que puede crear condiciones de conducción desconocidas y
    requiere precaución adicional.
- id: 213
  category: vehicle_information
  question: ¿Qué problema mecánico puede ser causado por conducir sobre baches?
  choices:
    A: Pueden desalinear la parte delantera de su automóvil
    B: Pueden hacer que su convertidor catalítico se sobrecaliente
    C: Pueden inflar demasiado sus neumáticos
    D: Pueden drenar el líquido de la dirección asistida
  answer: A
  explanation: El manual aconseja rodear los baches si es posible porque pueden desalinear
    la parte delantera de su automóvil.
- id: 214
  category: safe_driving_rules
  question: ¿Cuál es la técnica adecuada para la fase de mitad de la curva en un giro?
  choices:
    A: Frenar bruscamente para mantener el control
    B: Aumentar un poco la aceleración para equilibrar el automóvil
    C: Enderezar el volante por completo
    D: Poner el vehículo en punto muerto (neutral)
  answer: B
  explanation: Durante la fase de mitad de la curva, debe aumentar un poco la aceleración,
    solo lo suficiente para equilibrar el automóvil, y seguir mirando hacia el final
    de la curva.
- id: 215
  category: safe_driving_rules
  question: Al alcanzar un control de operación como los limpiaparabrisas o las luces,
    ¿dónde debe permanecer la otra mano?
  choices:
    A: En la posición de las 12 en punto
    B: En las posiciones de las 10 y las 2 en punto
    C: En la posición normal de operación de las 8-9 o las 3-4 en punto
    D: Descansando en su regazo
  answer: C
  explanation: Al alcanzar un control, es importante mantener la otra mano en la posición
    normal de operación del vehículo de las 8-9 o las 3-4 en punto, según el diseño
    del volante.
- id: 216
  category: safe_driving_rules
  question: ¿Qué debe hacer si siente que su vehículo está flotando mientras conduce
    en una carretera con exceso de agua?
  choices:
    A: Frenar bruscamente y dirigirse al acotamiento
    B: Mantener el volante recto y soltar suavemente el pedal del acelerador
    C: Girar el volante de un lado a otro para recuperar la tracción
    D: Acelerar para atravesar el agua rápidamente
  answer: B
  explanation: El manual establece que si siente que está flotando (hidroplaneo o
    hydroplaning), debe mantener el volante recto y soltar suavemente el pedal del
    acelerador hasta que sienta que los neumáticos hacen contacto con la superficie
    de la carretera.
- id: 217
  category: safe_driving_rules
  question: ¿Qué áreas de la carretera es probable que se congelen primero y permanezcan
    heladas por más tiempo que otras calzadas?
  choices:
    A: Intersecciones y pasos de peatones
    B: Tramos de carretera rectos y llanos
    C: Puentes, pasos elevados y áreas sombreadas
    D: Áreas con gran volumen de tráfico
  answer: C
  explanation: El manual aconseja a los conductores tomar precauciones adicionales
    en puentes, pasos elevados y áreas sombreadas, que pueden congelarse primero y
    permanecer heladas por más tiempo que las carreteras estándar.
- id: 218
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si sus ruedas comienzan a bloquearse mientras
    intenta detenerse en clima invernal?
  choices:
    A: Bombear el pedal del acelerador
    B: Poner el vehículo en punto muerto (neutral)
    C: Tirar del freno de emergencia
    D: Dejar de presionar el freno gradualmente
  answer: D
  explanation: De acuerdo con los consejos de conducción en invierno del manual, debe
    detenerse suavemente para evitar derrapar. Si sus ruedas comienzan a bloquearse,
    debe dejar de presionar el freno.
- id: 219
  category: safe_driving_rules
  question: Si queda varado en su vehículo debido a condiciones climáticas severas,
    ¿cuál es el curso de acción más seguro?
  choices:
    A: Salir de su vehículo para buscar ayuda
    B: No salir de su vehículo
    C: Caminar hasta el paso elevado más cercano para refugiarse
    D: Abandonar el automóvil y pedir un aventón
  answer: B
  explanation: El manual establece explícitamente que, en caso de quedar varado debido
    a las condiciones climáticas, no debe abandonar su vehículo y debe confiar en
    sus suministros de emergencia.
- id: 220
  category: driver_responsibility
  question: Según el manual, ¿cuál es la característica de seguridad más importante
    del automóvil?
  choices:
    A: Sistemas de frenos antibloqueo
    B: El conductor
    C: Cinturones de seguridad
    D: Bolsas de aire
  answer: B
  explanation: 'El manual establece: ''La característica de seguridad más importante
    del automóvil es el conductor''.'
- id: 221
  category: defensive_driving
  question: ¿Qué debe hacer si parece que un automóvil que viene en sentido contrario
    está cruzando hacia su carril?
  choices:
    A: Acelerar para pasarlo rápidamente
    B: Girar hacia el carril de ellos para evitarlos
    C: Orillarse a un lado de la carretera, tocar la bocina y encender y apagar las
      luces
    D: Detenerse inmediatamente en su carril y prepararse para el impacto
  answer: C
  explanation: Las pautas del Consejo Nacional de Seguridad (National Safety Council)
    sugieren que si un automóvil que viene en sentido contrario está cruzando hacia
    su carril, debe orillarse a un lado de la carretera, tocar la bocina y encender
    y apagar las luces.
- id: 222
  category: safe_driving_rules
  question: ¿Cómo afecta su seguridad en la carretera el conducir demasiado rápido
    o demasiado lento?
  choices:
    A: Conducir demasiado lento reduce a cero la posibilidad de colisiones
    B: Conducir demasiado rápido o demasiado lento puede aumentar la probabilidad
      de colisiones
    C: Conducir demasiado rápido es peligroso, pero conducir demasiado lento siempre
      es seguro
    D: La velocidad no tiene ningún efecto en la probabilidad de colisiones
  answer: B
  explanation: El manual señala que debe recordar que conducir demasiado rápido o
    demasiado lento puede aumentar la probabilidad de colisiones.
- id: 223
  category: defensive_driving
  question: En la técnica de conducción defensiva SIPDE, ¿qué significa la 'P'?
  choices:
    A: Prevenir (Prevent)
    B: Proteger (Protect)
    C: Predecir (Predict)
    D: Proceder (Proceed)
  answer: C
  explanation: En el acrónimo SIPDE, la 'P' significa Predecir (Predict), lo que significa
    predecir qué peligros podrían entrar potencialmente en conflicto con usted.
- id: 224
  category: defensive_driving
  question: Además de garantizar la seguridad vial, ¿cuáles son otros beneficios de
    la conducción defensiva?
  choices:
    A: Le permite conducir más rápido y llegar antes a sus destinos
    B: Ahorra combustible, reduce las primas de seguro y aumenta la vida útil del
      vehículo
    C: Elimina la necesidad de mantenimiento del vehículo
    D: Garantiza que nunca se verá involucrado en un incidente
  answer: B
  explanation: El manual establece que la conducción defensiva no solo garantiza la
    seguridad vial, sino que también ahorra combustible, reduce el costo de las primas
    de seguro y aumenta la vida útil general del vehículo.
- id: 225
  category: defensive_driving
  question: ¿Qué característica de un conductor defensivo implica mantener una distancia
    de seguimiento segura y no seguir de cerca al vehículo de adelante (tailgating)?
  choices:
    A: Alerta
    B: Anticipación
    C: Juicio
    D: Habilidad
  answer: B
  explanation: Bajo la característica de 'Anticipación', el manual establece que los
    conductores defensivos mantienen una distancia de seguimiento segura y que seguir
    de cerca (tailgating) no permite los segundos necesarios para evitar un posible
    choque.
- id: 226
  category: alcohol_drugs_health
  question: ¿En qué proporción aproximada de todos los accidentes mortales de vehículos
    motorizados el alcohol es un factor determinante?
  choices:
    A: Casi una cuarta parte
    B: Casi un tercio
    C: Casi la mitad
    D: Casi tres cuartas partes
  answer: C
  explanation: Según las pautas del Consejo Nacional de Seguridad (National Safety
    Council) en el manual, el alcohol es un factor en casi la mitad de todos los accidentes
    mortales de vehículos motorizados.
- id: 227
  category: driver_responsibility
  question: ¿Cómo pueden los sentimientos emocionales leves afectar su conducción?
  choices:
    A: Mejoran su tiempo de reacción
    B: No tienen ningún efecto en su capacidad de conducción
    C: Le ayudan a concentrarse mejor en la carretera
    D: Pueden hacerlo temporalmente propenso a sufrir accidentes
  answer: D
  explanation: El manual establece que incluso los sentimientos emocionales leves
    pueden afectar su capacidad de conducción, son difíciles de controlar y pueden
    hacerlo temporalmente propenso a sufrir accidentes.
- id: 228
  category: safe_driving_rules
  question: ¿Cuál es una buena regla general para su velocidad en condiciones de conducción
    con lluvia en relación con sus limpiaparabrisas?
  choices:
    A: No conduzca más rápido de lo que los limpiaparabrisas pueden eliminar el agua
      del parabrisas
    B: Conduzca al límite de velocidad indicado independientemente de la velocidad
      de los limpiaparabrisas
    C: Apague los limpiaparabrisas si conduce a más de 50 mph
    D: Conduzca más rápido para permitir que el viento elimine el agua
  answer: A
  explanation: El manual aconseja que, en condiciones de conducción con lluvia, no
    debe conducir más rápido de lo que los limpiaparabrisas pueden eliminar el agua
    del parabrisas.
- id: 229
  category: defensive_driving
  question: Si nota un automóvil que circula sobre la línea central, zigzaguea y hace
    giros amplios, ¿cuál es la forma más segura de evitarlo?
  choices:
    A: Acelerar y pasarlo por la izquierda
    B: Seguirlo de cerca hasta que se detenga a un lado
    C: Girar a la derecha en la esquina más cercana o salir en la salida más próxima
    D: Encender y apagar las luces altas continuamente hasta que se detenga
  answer: C
  explanation: El manual sugiere evitar a un conductor con facultades disminuidas
    (que puede estar zigzagueando o circulando sobre la línea central) girando a la
    derecha en la esquina más cercana o saliendo en la salida más próxima.
- id: 230
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de neumáticos para nieve?
  choices:
    A: Le permiten conducir sobre nieve o hielo a velocidades normales
    B: Ningún neumático para nieve le permite conducir sobre nieve o hielo a velocidades
      normales
    C: Solo se requieren en las ruedas delanteras
    D: Evitan que se forme hielo en la calzada
  answer: B
  explanation: 'El manual advierte explícitamente: ''Ningún neumático para nieve le
    permite conducir sobre nieve o hielo a velocidades normales''.'
- id: 231
  category: safe_driving_rules
  question: ¿Cuáles son los dos componentes estructurales de la conducción que entran
    en conflicto entre sí?
  choices:
    A: Velocidad y dirección
    B: Previsibilidad e imprevisibilidad
    C: Aceleración y frenado
    D: Libertad y restricción
  answer: B
  explanation: 'Según el manual, la conducción tiene dos componentes estructurales
    que entran en conflicto entre sí: la previsibilidad (que crea seguridad) y la
    imprevisibilidad (que crea peligro).'
- id: 232
  category: driver_responsibility
  question: ¿Qué debe hacer si está preocupado, nervioso, enojado, frustrado o deprimido
    antes de conducir?
  choices:
    A: Conducir más lento que el límite de velocidad establecido
    B: Escuchar música relajante mientras conduce
    C: Dejar que otra persona conduzca
    D: Tomar un sedante suave de venta libre antes de conducir
  answer: C
  explanation: El manual establece que si está preocupado, nervioso, enojado, frustrado
    o deprimido, debe dejar que otra persona conduzca, ya que podría volverse impulsivo
    y correr riesgos.
- id: 233
  category: safe_driving_rules
  question: Para prevenir la fatiga del conductor, ¿con qué frecuencia debe descansar
    un conductor?
  choices:
    A: Cada hora
    B: Cada dos horas
    C: Cada cuatro horas
    D: Solo cuando comience a sentirse cansado
  answer: B
  explanation: Un conductor debe descansar cada dos horas y no conducir más de seis
    u ocho horas al día para prevenir la fatiga del conductor.
- id: 234
  category: safe_driving_rules
  question: ¿Cuál es el número máximo de horas que un conductor debe conducir en un
    solo día para evitar la fatiga?
  choices:
    A: De cuatro a seis horas
    B: De seis a ocho horas
    C: De ocho a diez horas
    D: De diez a doce horas
  answer: B
  explanation: El manual aconseja que un conductor no debe conducir más de seis u
    ocho horas al día para mantenerse física y mentalmente alerta.
- id: 235
  category: defensive_driving
  question: ¿Qué es la "hipnosis de carretera" (highway hypnosis)?
  choices:
    A: Una condición en la que un conductor se queda completamente dormido al volante
    B: Un estado en el que sus sentidos se embotan y sus ojos se quedan fijos en la
      carretera
    C: Una ilusión visual causada por el calor en la superficie de la carretera
    D: Una tendencia a conducir más rápido que el límite de velocidad en carreteras
      abiertas
  answer: B
  explanation: El aburrimiento en viajes largos puede provocar la "hipnosis de carretera",
    que es cuando sus sentidos se embotan, sus ojos se quedan fijos en la carretera
    y usted no está alerta a las situaciones de tráfico.
- id: 236
  category: defensive_driving
  question: ¿Cuál de los siguientes es un factor común en los choques por conducir
    con somnolencia?
  choices:
    A: El choque involucra a varios vehículos en tráfico pesado
    B: El choque ocurre durante la hora pico de la tarde
    C: El conductor intenta una maniobra evasiva repentina
    D: El choque involucra a un solo vehículo que se sale de la calzada
  answer: D
  explanation: Los factores comunes que involucran choques por conducir con somnolencia
    incluyen un solo vehículo que se sale de la calzada, que ocurra tarde en la noche
    o temprano en la mañana, y que el conductor no intente evitar el choque.
- id: 237
  category: safe_driving_rules
  question: ¿Por qué debe evitar consumir grandes cantidades de azúcar y cafeína para
    mantenerse despierto en un viaje largo?
  choices:
    A: Pueden causar visión borrosa inmediata
    B: Promueven el estado de alerta a corto plazo, pero pueden aumentar la somnolencia
      durante períodos más largos
    C: Causan una caída repentina de la presión arterial
    D: Es ilegal consumirlos mientras se opera un vehículo motorizado
  answer: B
  explanation: El azúcar y la cafeína promueven el estado de alerta a corto plazo,
    pero pueden aumentar la somnolencia durante períodos de tiempo más largos.
- id: 238
  category: defensive_driving
  question: ¿Qué tipo de audio se recomienda para ayudarle a mantenerse alerta mientras
    conduce?
  choices:
    A: Música clásica
    B: Música heavy metal
    C: Programas de radio de debate (talk shows)
    D: Ruido blanco
  answer: C
  explanation: El manual sugiere escuchar programas de radio de debate en lugar de
    música, ya que el formato de discusión le ayudará a mantenerse alerta.
- id: 239
  category: defensive_driving
  question: ¿Cuál de los siguientes es una señal de advertencia de conducción con
    somnolencia?
  choices:
    A: Revisar los espejos con demasiada frecuencia
    B: Incapacidad para recordar las últimas millas recorridas
    C: Sujetar el volante con demasiada fuerza
    D: Sentarse completamente derecho en su asiento
  answer: B
  explanation: Las señales de advertencia de conducción con somnolencia incluyen la
    incapacidad de recordar las últimas millas recorridas, saltarse señales de tráfico,
    desviarse del carril y bostezar repetidamente.
- id: 240
  category: driver_responsibility
  question: Según el manual, ¿qué grupo demográfico parece tener un mayor riesgo de
    conducir con somnolencia?
  choices:
    A: Mujeres jóvenes de entre 16 y 29 años
    B: Hombres jóvenes de entre 16 y 29 años
    C: Adultos mayores de 65 años
    D: Conductores de mediana edad de entre 40 y 50 años
  answer: B
  explanation: Los hombres jóvenes de entre 16 y 29 años, así como los trabajadores
    por turnos, parecen tener un mayor riesgo de conducir con somnolencia.
- id: 241
  category: alcohol_drugs_health
  question: ¿Cómo pueden afectar su conducción las pastillas para adelgazar de venta
    libre o los estimulantes ("uppers")?
  choices:
    A: Mejoran su tiempo de reacción y concentración
    B: Le hacen sentir nervioso, mareado e incapaz de concentrarse
    C: Causan somnolencia extrema y sueño profundo
    D: No tienen ningún efecto en sus habilidades de conducción
  answer: B
  explanation: Las pastillas estimulantes ("pep pills"), los estimulantes ("uppers")
    y las pastillas para adelgazar pueden hacerle sentir nervioso, mareado, incapaz
    de concentrarse y pueden afectar su visión.
- id: 242
  category: alcohol_drugs_health
  question: ¿Cómo afectan la conducción los medicamentos recetados como los antidepresivos,
    los analgésicos y los sedantes?
  choices:
    A: Mejoran su agudeza visual
    B: Solo afectan la conducción si se mezclan con drogas ilegales
    C: Pueden afectar los reflejos, el juicio, la visión y el estado de alerta de
      manera similar al alcohol
    D: Es completamente seguro usarlos mientras conduce siempre que sean recetados
      por un médico
  answer: C
  explanation: Algunos medicamentos recetados pueden afectar la conducción y pueden
    influir en sus reflejos, juicio, visión y estado de alerta de manera similar al
    alcohol.
- id: 243
  category: license_system
  question: Si debe renunciar a sus privilegios de conducir debido a una condición
    de salud, ¿qué alternativa está disponible en su oficina local de Vehículos Motorizados?
  choices:
    A: Un permiso de conducir médico restringido
    B: Una licencia temporal por dificultades
    C: Una tarjeta de identificación de Louisiana
    D: Una licencia de chofer
  answer: C
  explanation: Si por alguna razón debe renunciar a sus privilegios de conducir, hay
    una tarjeta de identificación de Louisiana disponible en su oficina local de Vehículos
    Motorizados.
- id: 244
  category: defensive_driving
  question: ¿Cuál es una estrategia recomendada para mantener el control de su conducción
    y evitar la furia al volante?
  choices:
    A: Alterar su horario para evitar conducir durante los períodos de mayor congestión
      vial
    B: Conducir más rápido para salir rápidamente del tráfico pesado
    C: Usar la bocina con frecuencia para comunicarse con otros conductores
    D: Apretar los dientes y sujetar el volante con fuerza para mantener la concentración
  answer: A
  explanation: Para mantener el control de su conducción, debe alterar su horario
    para evitar conducir durante los períodos de mayor congestión vial, relajarse
    y no apretar los dientes.
- id: 245
  category: defensive_driving
  question: ¿Qué debe hacer cuando se enfrente a un conductor agresivo?
  choices:
    A: Hacer contacto visual para demostrar que no se siente intimidado
    B: Acelerar para mantener su posición en el carril de tráfico
    C: Evitar el contacto visual y alejarse, dándoles suficiente espacio
    D: Usar la bocina para castigar al otro conductor por su comportamiento
  answer: C
  explanation: Cuando se enfrente a un conductor agresivo, debe evitar el contacto
    visual y alejarse, dando a los conductores suficiente espacio, y no desafiarlos
    ni usar la bocina para castigarlos.
- id: 246
  category: defensive_driving
  question: ¿Qué debe hacer si un conductor agresivo persiste en seguirlo?
  choices:
    A: Detenerse a un lado de la carretera para resolver el problema.
    B: Conducir a una estación de policía o a un lugar público donde haya testigos
      disponibles.
    C: Conducir directamente a su casa y cerrar las puertas con llave.
    D: Acelerar y zigzaguear entre el tráfico para perderlo.
  answer: B
  explanation: 'El manual establece: ''Conduzca a una estación de policía o a un lugar
    público donde haya testigos disponibles... Sobre todo, no conduzca a casa si alguien
    lo está siguiendo''.'
- id: 247
  category: penalties_and_points
  question: ¿Cómo define el manual del conductor la 'furia al volante' (road rage)?
  choices:
    A: Una reacción emocional normal ante retrasos inesperados en el tráfico.
    B: Una infracción de tráfico estrictamente por exceso de velocidad y seguir de
      cerca al vehículo de adelante.
    C: Un delito penal que ocurre cuando un incidente de tráfico escala a una situación
      mucho más grave, que a menudo implica violencia.
    D: Una técnica de conducción defensiva utilizada para hacer valer el derecho de
      paso.
  answer: C
  explanation: Según el manual, 'La furia al volante es un delito penal. Esto ocurre
    cuando un incidente de tráfico escala a una situación mucho más grave... se responde
    con algún tipo de violencia'.
- id: 248
  category: safe_driving_rules
  question: Para prepararse para las condiciones del tráfico y mantener su automóvil
    en una trayectoria constante, ¿con cuánta anticipación debe mirar hacia adelante?
  choices:
    A: De 2 a 3 segundos de anticipación
    B: De 5 a 8 segundos de anticipación
    C: De 10 a 15 segundos de anticipación
    D: De 20 a 30 segundos de anticipación
  answer: C
  explanation: 'El manual aconseja: ''Mirar de 10 a 15 segundos hacia adelante permitirá
    tener tiempo para prepararse para las condiciones del tráfico. También facilita
    mantener el automóvil en una trayectoria constante''.'
- id: 249
  category: safe_driving_rules
  question: Al conducir en la ciudad, ¿con cuánta anticipación debe observar la carretera?
  choices:
    A: Al menos una cuadra o un semáforo de anticipación
    B: Al menos dos cuadras o dos semáforos de anticipación
    C: Al menos tres cuadras o tres semáforos de anticipación
    D: Al menos un cuarto de milla de anticipación
  answer: B
  explanation: 'El manual especifica: ''En la ciudad, debe mirar al menos dos cuadras
    o dos semáforos hacia adelante''.'
- id: 250
  category: safe_driving_rules
  question: Al conducir en la carretera, ¿cuál es la distancia recomendada que debe
    mirar hacia adelante?
  choices:
    A: Dos cuadras
    B: Tres semáforos
    C: Un cuarto de milla
    D: Media milla
  answer: C
  explanation: Según el manual, 'En la carretera, debe mirar al menos un cuarto de
    milla hacia adelante'.
- id: 251
  category: defensive_driving
  question: ¿Qué se considera un buen 'margen visual' (visual lead) para ayudar a
    identificar problemas potenciales en su trayectoria de viaje?
  choices:
    A: Un área de 5 a 10 segundos por delante
    B: Un área de 10 a 15 segundos por delante
    C: Un área de 20 a 30 segundos por delante
    D: Un área de 30 a 40 segundos por delante
  answer: C
  explanation: 'El manual establece: ''Un margen visual es un área de 20 a 30 segundos
    por delante de la parte frontal del vehículo''.'
- id: 252
  category: vehicle_information
  question: A 60 mph, ¿aproximadamente cuánto tiempo y qué distancia se necesita para
    reaccionar ante un problema y detener el vehículo por completo?
  choices:
    A: De 2 a 3 segundos o 123 pies
    B: De 4 a 5 segundos o 359 pies
    C: De 6 a 7 segundos o 400 pies
    D: De 8 a 10 segundos o 500 pies
  answer: B
  explanation: El manual señala que incluso con buenos neumáticos y pavimento seco,
    'A 60 mph, puede tomar alrededor de 4 a 5 segundos o 359 pies reaccionar ante
    un problema y detener el vehículo'.
- id: 253
  category: vehicle_information
  question: A 30 mph, ¿cuál es el tiempo y la distancia estimados necesarios para
    reaccionar y detener su vehículo?
  choices:
    A: De 2 a 3 segundos o 123 pies
    B: De 4 a 5 segundos o 359 pies
    C: De 1 a 2 segundos o 50 pies
    D: De 3 a 4 segundos o 200 pies
  answer: A
  explanation: Según el manual, 'A 30 mph, puede tomar alrededor de 2 a 3 segundos
    o 123 pies reaccionar ante un problema y detener el vehículo'.
- id: 254
  category: safe_driving_rules
  question: Si conduce a 60 mph, ¿está conduciendo demasiado rápido para su visibilidad
    si no puede ver al menos a qué distancia hacia adelante?
  choices:
    A: 150 pies
    B: 250 pies
    C: 359 pies
    D: 400 pies
  answer: D
  explanation: 'El manual advierte: ''A 60 mph, si no puede ver al menos 400 pies
    hacia adelante, está conduciendo demasiado rápido para su visibilidad''.'
- id: 255
  category: safe_driving_rules
  question: Cuando está detenido en una intersección, ¿en qué orden debe mirar antes
    de entrar?
  choices:
    A: A la derecha, a la izquierda y a la derecha de nuevo
    B: A la izquierda, a la derecha y a la izquierda de nuevo
    C: Hacia adelante, a la izquierda y a la derecha
    D: A la izquierda, hacia adelante y a la derecha
  answer: B
  explanation: 'El manual instruye: ''Si está detenido, mire a la izquierda, a la
    derecha y a la izquierda de nuevo antes de entrar en la intersección''.'
- id: 256
  category: defensive_driving
  question: ¿Qué debe hacer si está detenido en una intersección y su visión de la
    calle transversal está bloqueada?
  choices:
    A: Toque la bocina y avance rápidamente a través de la intersección.
    B: Espere indefinidamente a que el vehículo que bloquea su visión se mueva.
    C: Avance lentamente hasta que pueda ver.
    D: Retroceda y elija una ruta diferente.
  answer: C
  explanation: 'El manual aconseja: ''Si está detenido y su visión del tráfico o de
    una calle transversal está bloqueada, avance lentamente hasta que pueda ver''.'
- id: 257
  category: safe_driving_rules
  question: Al girar a la izquierda en una intersección, ¿a qué vehículos debe ceder
    el paso?
  choices:
    A: Solo a los vehículos que también están girando a la izquierda.
    B: A los vehículos que vienen en sentido contrario que van derecho o que giran
      a la derecha.
    C: A los vehículos que se aproximan por detrás.
    D: Solo a los peatones en el cruce de peatones.
  answer: B
  explanation: 'El manual establece con respecto a los giros a la izquierda: ''Debe
    ceder el paso a los vehículos que vienen en sentido contrario que van derecho
    o que giran a la derecha''.'
- id: 258
  category: defensive_driving
  question: Según el manual, ¿cómo se puede evitar fácilmente el seguir a otro vehículo
    demasiado cerca (tailgating)?
  choices:
    A: Acelerando para igualar el flujo del tráfico.
    B: Tocando los frenos para advertir al conductor de atrás.
    C: Simplemente moviéndose al carril derecho y dejando pasar al conductor más rápido.
    D: Encendiendo las luces de emergencia.
  answer: C
  explanation: 'El manual explica: ''Seguir de cerca (tailgating) es una causa muy
    común de choques y puede evitarse simplemente moviéndose al carril derecho y dejando
    pasar al conductor más rápido''.'
- id: 259
  category: safe_driving_rules
  question: ¿A qué distancia hacia adelante debe mirar cuando conduce en una zona
    urbana?
  choices:
    A: Al menos una cuadra o un semáforo hacia adelante
    B: Al menos dos cuadras o dos semáforos hacia adelante
    C: Al menos tres cuadras o tres semáforos hacia adelante
    D: Al menos un cuarto de milla hacia adelante
  answer: C
  explanation: 'El manual especifica: ''En una zona urbana, debe mirar al menos tres
    cuadras o tres semáforos hacia adelante''.'
- id: 260
  category: signs_and_signals
  question: ¿Cuál es el procedimiento adecuado al acercarse a un cruce de ferrocarril
    a nivel en una carretera?
  choices:
    A: Acelere para despejar las vías lo más rápido posible.
    B: Deténgase por completo en la señal de advertencia redonda, independientemente
      de si viene un tren.
    C: Reduzca la velocidad en la señal de advertencia redonda y mire en cada dirección
      antes de las vías.
    D: Toque la bocina para advertir a los trenes que se aproximan de su llegada.
  answer: C
  explanation: 'El manual instruye a los conductores: ''Acérquese a cualquier cruce
    de ferrocarril a nivel reduciendo la velocidad en la señal de advertencia redonda
    y mirando en cada dirección antes de las vías para asegurarse de que no venga
    un tren''.'
- id: 261
  category: defensive_driving
  question: ¿Qué debe hacer al acercarse a un cruce de ferrocarril a nivel en una
    carretera?
  choices:
    A: Acelerar para cruzar las vías rápidamente antes de que llegue un tren.
    B: Reducir la velocidad ante la señal de advertencia redonda y mirar en ambas
      direcciones antes de las vías.
    C: Detenerse inmediatamente sobre las vías para verificar si vienen trenes.
    D: Tocar la bocina continuamente para advertir a los trenes que se acercan.
  answer: B
  explanation: El manual establece que se debe abordar cualquier cruce de ferrocarril
    a nivel reduciendo la velocidad ante la señal de advertencia redonda y mirando
    en ambas direcciones antes de las vías para asegurarse de que no venga un tren.
- id: 262
  category: safe_driving_rules
  question: Al prepararse para cambiar de carril, ¿qué tan grande debe ser el espacio
    en el tráfico que debe identificar?
  choices:
    A: Un espacio de 2 a 3 segundos
    B: Un espacio de 4 a 5 segundos
    C: Un espacio de 6 a 7 segundos
    D: Un espacio de 8 a 10 segundos
  answer: B
  explanation: Al cambiar de carril, el manual indica a los conductores identificar
    un espacio de 4 a 5 segundos en el tráfico, señalizar y mirar de nuevo en la dirección
    del cambio de carril.
- id: 263
  category: defensive_driving
  question: ¿Cuál es la forma correcta de revisar sus puntos ciegos antes de cambiar
    de carril?
  choices:
    A: Confiar totalmente en su espejo retrovisor central.
    B: Girar la cabeza y mirar por encima del hombro en la dirección en la que planea
      moverse.
    C: Ajustar los espejos exteriores hacia adentro mientras conduce.
    D: Tocar la bocina para alertar a los vehículos que podrían estar en su punto
      ciego.
  answer: B
  explanation: Debe revisar sus puntos ciegos girando la cabeza y mirando por encima
    del hombro en la dirección en la que planea moverse, ya que estas son áreas que
    no puede ver con sus espejos.
- id: 264
  category: vehicle_information
  question: Según el manual, ¿qué espejo se considera el espejo principal?
  choices:
    A: El espejo exterior del lado del conductor
    B: El espejo exterior del lado del pasajero
    C: El espejo retrovisor interior central
    D: El espejo de punto ciego de gran angular
  answer: C
  explanation: 'El manual establece explícitamente: "Recuerde siempre que el espejo
    retrovisor interior central es el espejo principal".'
- id: 265
  category: vehicle_information
  question: ¿Cómo debe posicionar su cabeza al ajustar el espejo del lado del conductor
    para eliminar los puntos ciegos?
  choices:
    A: Coloque su cabeza contra la ventana del lado del conductor.
    B: Mueva su cabeza lo más cerca posible del centro del automóvil.
    C: Inclínese hacia adelante hasta que su pecho toque el volante.
    D: Siéntese perfectamente derecho y centrado en el asiento del conductor.
  answer: A
  explanation: Para ajustar correctamente el espejo del lado del conductor, debe colocar
    su cabeza contra la ventana del lado del conductor y ajustar el espejo de modo
    que apenas pueda ver el lado del conductor de su automóvil.
- id: 266
  category: safe_driving_rules
  question: ¿Cuál es la definición de "distancia de percepción"?
  choices:
    A: La distancia que recorre su vehículo mientras aplica físicamente los frenos.
    B: La distancia recorrida antes de pisar físicamente los frenos en respuesta a
      un peligro.
    C: La distancia que recorre su vehículo desde el momento en que sus ojos ven un
      peligro hasta que su cerebro lo reconoce.
    D: La distancia total mínima que recorre su vehículo hasta que se detiene por
      completo.
  answer: C
  explanation: La distancia de percepción se define como la distancia que recorre
    su vehículo en condiciones ideales desde el momento en que sus ojos ven un peligro
    hasta que su cerebro lo reconoce.
- id: 267
  category: safe_driving_rules
  question: ¿Cuál es el tiempo de reacción promedio de un conductor alerta?
  choices:
    A: 1/4 a 1/2 segundo
    B: 3/4 a 1 segundo
    C: 1.5 a 2 segundos
    D: 3 a 4 segundos
  answer: B
  explanation: Según el manual, el conductor promedio tiene un tiempo de reacción
    de 3/4 de segundo a 1 segundo.
- id: 268
  category: safe_driving_rules
  question: Si duplica su velocidad de 20 mph a 40 mph, ¿cuánto aumenta el impacto
    o la fuerza de choque de su vehículo?
  choices:
    A: Se vuelve 2 veces mayor.
    B: Se vuelve 3 veces mayor.
    C: Se vuelve 4 veces mayor.
    D: Se vuelve 8 veces mayor.
  answer: C
  explanation: El manual establece que cuando se duplica la velocidad de 20 a 40 mph,
    el impacto es 4 veces mayor y la distancia de frenado también es 4 veces más larga.
- id: 269
  category: safe_driving_rules
  question: 'A 60 mph, su distancia total de parada es mayor que la longitud de un:'
  choices:
    A: Campo de baloncesto
    B: Campo de fútbol americano
    C: Pista de bolos
    D: Campo de tenis
  answer: B
  explanation: El manual señala que a 60 mph, su distancia de parada es mayor que
    la de un campo de fútbol americano.
- id: 270
  category: defensive_driving
  question: ¿Qué regla facilita juzgar una distancia de seguimiento segura en condiciones
    ideales?
  choices:
    A: La regla de los 2 segundos
    B: La regla de los 3 segundos
    C: La regla de los 4 segundos
    D: La regla de los 5 segundos
  answer: B
  explanation: Dado que la mayoría de las personas tienen dificultades para juzgar
    las distancias, la "regla de los 3 segundos" facilita el mantenimiento de una
    distancia de seguimiento segura en condiciones ideales.
- id: 271
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones debe aumentar su distancia de seguimiento
    a por lo menos cuatro segundos?
  choices:
    A: Al conducir en una autopista despejada y seca durante el día.
    B: Al seguir a una motocicleta en carreteras mojadas o con hielo.
    C: Al conducir en un vecindario residencial a 20 mph.
    D: Al rebasar a un ciclista en un día soleado.
  answer: B
  explanation: Debe usar la regla de los cuatro segundos al seguir motocicletas, ya
    que las probabilidades de una caída son mayores en carreteras mojadas y con hielo,
    caminos de grava y superficies metálicas.
- id: 272
  category: sharing_the_road
  question: ¿Por qué debe dejar una distancia de seguimiento adicional al conducir
    directamente detrás de camiones grandes o autobuses?
  choices:
    A: Porque viajan a velocidades mucho más altas que los automóviles de pasajeros.
    B: Porque tienen una distancia de frenado más corta que los automóviles de pasajeros.
    C: Porque es posible que los conductores no puedan verlo y el vehículo grande
      bloquea su visión del camino por delante.
    D: Porque están obligados a ceder el paso a los vehículos que vienen detrás.
  answer: C
  explanation: Es posible que los conductores de camiones y autobuses no puedan verlo
    cuando usted está directamente detrás de ellos, y los vehículos grandes también
    bloquean su visión del camino por delante. Retroceder le permite tener más espacio
    para ver.
- id: 273
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo sigue demasiado de cerca?
  choices:
    A: Presione sus frenos repetidamente para advertir al conductor.
    B: Aumente la velocidad para incrementar la distancia entre usted y el otro vehículo.
    C: Muévase a la derecha y permita que el vehículo que viene detrás lo rebase.
    D: Muévase al carril izquierdo y mantenga su velocidad.
  answer: C
  explanation: El manual aconseja que si lo siguen de cerca, debe moverse a la derecha
    y permitir que el vehículo que viene detrás lo rebase.
- id: 274
  category: safe_driving_rules
  question: Si considera absolutamente necesario dar la vuelta en una calle estrecha,
    ¿cuál es el primer paso que debe dar?
  choices:
    A: Detenerse cerca del borde izquierdo del pavimento.
    B: Detenerse cerca del borde derecho del pavimento.
    C: Señalizar un giro a la derecha y retroceder rápidamente.
    D: Tocar la bocina para alertar al tráfico que se aproxima.
  answer: B
  explanation: Al dar la vuelta en una calle estrecha, el primer paso es detenerse
    cerca del borde derecho del pavimento.
- id: 275
  category: defensive_driving
  question: ¿Por qué es especialmente importante revisar sus espejos al bajar una
    colina larga o empinada?
  choices:
    A: Para asegurarse de que su carga esté segura.
    B: Para estar atento a los vehículos, como camiones grandes y autobuses, que puedan
      estar acercándose rápidamente y yendo demasiado rápido.
    C: Para comprobar si sus luces de freno funcionan correctamente.
    D: Para ver si tiene suficiente espacio para dar una vuelta en U.
  answer: B
  explanation: Al bajar una colina larga o empinada, debe revisar sus espejos para
    ver si se acercan vehículos rápidamente, ya que los vehículos (especialmente los
    camiones grandes y autobuses) a menudo aumentan la velocidad al bajar una pendiente
    pronunciada.
- id: 276
  category: safe_driving_rules
  question: ¿Cuándo es apropiado realizar un giro de tres puntos?
  choices:
    A: En cualquier autopista de cuatro carriles cuando se pasa de su salida.
    B: Solo cuando la carretera es demasiado estrecha para dar una vuelta en U y no
      puede dar la vuelta a la manzana.
    C: Siempre que se encuentre en una intersección con una señal de alto.
    D: Cuando esté saliendo de reversa de un espacio de estacionamiento en ángulo.
  answer: B
  explanation: El manual establece que un giro de tres puntos es la forma más difícil
    y peligrosa de realizar un cambio de sentido, y solo debe usarse cuando la carretera
    o calle es demasiado estrecha para dar una vuelta en U y no se puede dar la vuelta
    a la manzana.
- id: 277
  category: vehicle_information
  question: ¿Bajo qué condiciones debe usar el freno de estacionamiento?
  choices:
    A: Solo al estacionar en una colina empinada.
    B: Solo si su automóvil tiene transmisión manual.
    C: Cada vez que estacione su automóvil, independientemente del terreno o del tipo
      de transmisión.
    D: Solo al estacionar en paralelo en una calle con mucho tráfico.
  answer: C
  explanation: El manual especifica que, ya sea que su automóvil sea manual o automático,
    y ya sea que el terreno sea montañoso o plano, debe usar el freno de estacionamiento
    cada vez que se estacione.
- id: 278
  category: vehicle_information
  question: ¿Cuál es la secuencia adecuada para poner el freno de estacionamiento
    y reducir la tensión en el trinquete de estacionamiento de la transmisión?
  choices:
    A: Cambiar a 'park' (estacionamiento), soltar el pedal del freno y luego poner
      el freno de estacionamiento.
    B: Poner el freno de estacionamiento mientras su pie aún está en el pedal del
      freno y antes de cambiar a 'park' (estacionamiento).
    C: Apagar el motor, cambiar a 'park' (estacionamiento) y luego poner el freno
      de estacionamiento.
    D: Cambiar a 'park' (estacionamiento), poner el freno de estacionamiento y luego
      soltar el pedal del freno.
  answer: B
  explanation: Debe poner el freno de estacionamiento mientras su pie aún está en
    el pedal del freno y antes de cambiar a 'park' (estacionamiento). Esta acción
    reduce la tensión en el trinquete de estacionamiento.
- id: 279
  category: safe_driving_rules
  question: ¿Cómo debe colocar las ruedas de su vehículo al estacionar cuesta abajo
    donde hay un bordillo?
  choices:
    A: Gire las ruedas en dirección contraria al bordillo.
    B: Mantenga las ruedas perfectamente rectas.
    C: Gire las ruedas hacia el bordillo.
    D: Gire las ruedas paralelas al borde de la carretera.
  answer: C
  explanation: Al estacionar cuesta abajo donde hay un bordillo, debe girar las ruedas
    hacia el bordillo y cambiar a reversa o 'park' (estacionamiento).
- id: 280
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar las ruedas al estacionar en una colina si no hay
    bordillos?
  choices:
    A: Hacia el borde de la carretera.
    B: Lejos del borde de la carretera.
    C: Hacia adelante en línea recta.
    D: Hacia la línea central.
  answer: A
  explanation: Si no hay bordillos, debe girar las ruedas hacia el borde de la carretera,
    ya sea que esté cuesta arriba o cuesta abajo.
- id: 281
  category: defensive_driving
  question: Al salir de reversa de un espacio de estacionamiento en ángulo, ¿qué debe
    recordar sobre el movimiento de su vehículo?
  choices:
    A: La parte delantera de su automóvil girará en la misma dirección que su giro.
    B: La parte delantera de su automóvil girará en dirección opuesta a la de su giro.
    C: La parte trasera de su automóvil girará en dirección opuesta a la de su giro.
    D: El vehículo se moverá en una línea perfectamente recta hasta que cambie a marcha
      (drive).
  answer: B
  explanation: Antes de salir de reversa de un espacio de estacionamiento en ángulo,
    debe recordar que la parte delantera de su automóvil girará en dirección opuesta
    a la de su giro.
- id: 282
  category: safe_driving_rules
  question: Al estacionarse en paralelo, ¿a qué distancia deben estar las ruedas derechas
    de su vehículo del bordillo (curb) derecho?
  choices:
    A: A menos de 12 pulgadas
    B: A menos de 18 pulgadas
    C: A menos de 24 pulgadas
    D: A menos de 36 pulgadas
  answer: B
  explanation: Según el manual, al estacionarse en paralelo, las ruedas derechas del
    vehículo deben estar a menos de 18 pulgadas del bordillo derecho de la calle.
- id: 283
  category: defensive_driving
  question: ¿Cuál de las siguientes es una pista de que un automóvil estacionado podría
    estar preparándose para salir delante de usted?
  choices:
    A: Las luces de emergencia del vehículo están parpadeando.
    B: El vehículo tiene los faros delanteros apagados.
    C: Sale humo del tubo de escape.
    D: Las ruedas delanteras del vehículo están giradas hacia el bordillo.
  answer: C
  explanation: Al conducir cerca de automóviles estacionados, las pistas de que un
    automóvil puede salir delante de usted incluyen humo saliendo del tubo de escape,
    luces de freno rojas encendidas, luces direccionales parpadeando o luces blancas
    de reversa encendidas.
- id: 284
  category: safe_driving_rules
  question: ¿Es ilegal estacionarse a menos de cuántos pies de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: Es contra la ley estacionarse a menos de 15 pies de un hidrante de
    incendios.
- id: 285
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima legal para estacionarse de un paso de peatones
    en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Es contra la ley estacionarse a menos de 20 pies de un paso de peatones
    en una intersección.
- id: 286
  category: signs_and_signals
  question: ¿Qué indica un bordillo (curb) pintado de rojo?
  choices:
    A: Solo se permiten paradas cortas.
    B: Una zona de carga.
    C: Una restricción para personas con discapacidad.
    D: Restricciones de zona de incendios.
  answer: D
  explanation: Los bordillos pintados indican restricciones de estacionamiento. Un
    bordillo rojo indica restricciones de zona de incendios.
- id: 287
  category: safe_driving_rules
  question: Al rebasar a otro vehículo por la izquierda, ¿debe completar la maniobra
    de rebase antes de estar a cuántos pies de un vehículo que se aproxima?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Debe completar una maniobra de rebase antes de estar a menos de 100
    pies de cualquier vehículo que se aproxime en dirección opuesta.
- id: 288
  category: safe_driving_rules
  question: ¿Cuándo es contra la ley rebasar a otro vehículo por la izquierda?
  choices:
    A: Cuando se encuentra a menos de 100 pies de una intersección o un cruce de ferrocarril.
    B: Cuando se encuentra a menos de 200 pies de un puente o túnel.
    C: Cuando hay una línea amarilla discontinua en su carril.
    D: Cuando conduce en una carretera de varios carriles.
  answer: A
  explanation: Según el manual, es contra la ley rebasar a otro vehículo cuando se
    encuentra a menos de cien pies de una intersección o un cruce de ferrocarril.
- id: 289
  category: safe_driving_rules
  question: ¿Bajo qué condición puede rebasar por la derecha a otro vehículo conduciendo
    fuera de la calzada hacia el acotamiento (shoulder)?
  choices:
    A: Cuando el vehículo de adelante está girando a la izquierda.
    B: Cuando el tráfico está congestionado y se mueve lentamente.
    C: Bajo ninguna circunstancia.
    D: Si el acotamiento está pavimentado y libre de escombros.
  answer: C
  explanation: 'El manual establece: "Nunca puede rebasar por la derecha a otro vehículo
    conduciendo fuera de la calzada hacia el acotamiento de la carretera".'
- id: 290
  category: defensive_driving
  question: Al rebasar a otro vehículo, ¿cuándo se acepta generalmente como seguro
    regresar a su carril correspondiente?
  choices:
    A: Cuando está en paralelo con el otro vehículo.
    B: Tan pronto como pase el parachoques delantero del otro vehículo.
    C: Cuando vea la parte delantera completa del vehículo rebasado en su espejo retrovisor.
    D: Después de que hayan pasado exactamente tres segundos.
  answer: C
  explanation: Una regla aceptada es esperar hasta que vea el otro automóvil en su
    espejo retrovisor, específicamente continuando el rebase hasta que la parte delantera
    completa del vehículo rebasado sea visible.
- id: 291
  category: sharing_the_road
  question: ¿Qué debe hacer si está conduciendo en una carretera de dos carriles y
    otro vehículo está a punto de alcanzarlo y rebasarlo?
  choices:
    A: Aumentar la velocidad para evitar que lo rebasen.
    B: Moverse a la izquierda para bloquear su visión.
    C: Mantener su velocidad y permanecer en el centro de su carril.
    D: Reducir un poco su velocidad y moverse hacia la derecha tanto como sea seguro.
  answer: D
  explanation: Cuando esté a punto de ser alcanzado y rebasado, hágalo lo más seguro
    y fácil posible reduciendo un poco su velocidad y moviéndose hacia la derecha
    tanto como sea seguro en una carretera de dos carriles.
- id: 292
  category: vehicle_information
  question: ¿Cuál es la mejor manera de aumentar la visibilidad al dar marcha atrás
    con su vehículo?
  choices:
    A: Confiar totalmente en su espejo retrovisor.
    B: Girar la cabeza y mirar por la ventana trasera.
    C: Usar solo sus espejos laterales.
    D: Tocar la bocina para advertir a los demás.
  answer: B
  explanation: El manual establece que la mejor manera de aumentar la visibilidad
    al dar marcha atrás es girar la cabeza y mirar por la ventana trasera, y no depender
    de los espejos.
- id: 293
  category: defensive_driving
  question: ¿Por qué las superficies de las carreteras están más resbaladizas inmediatamente
    después de que comienza a llover?
  choices:
    A: El agua se mezcla con la suciedad para crear lodo espeso.
    B: El aceite y la grasa en el pavimento aún no han sido lavados.
    C: Los neumáticos se enfrían y pierden tracción.
    D: La lluvia hace que el asfalto se expanda y se vuelva resbaladizo.
  answer: B
  explanation: Las superficies de las carreteras están más resbaladizas inmediatamente
    después de que comienza a llover porque el aceite y la grasa en el pavimento aún
    no han sido lavados.
- id: 294
  category: defensive_driving
  question: Si su automóvil NO tiene un sistema de frenos antibloqueo (ABS) y se encuentra
    en un derrape, ¿qué debe hacer?
  choices:
    A: Frenar bruscamente de inmediato.
    B: Girar el volante en la dirección opuesta al derrape.
    C: Levantar el pie del acelerador, girar el volante hacia el derrape y evitar
      el uso de los frenos.
    D: Bombear los frenos rápidamente mientras mantiene el volante derecho.
  answer: C
  explanation: Si se encuentra en un derrape, mantenga la calma, levante el pie del
    acelerador y gire con cuidado en la dirección en la que desea que vaya la parte
    delantera del automóvil. Para automóviles sin frenos antibloqueo, evite usar los
    frenos.
- id: 295
  category: safe_driving_rules
  question: ¿A qué velocidad comienza normalmente el hidroplaneo (hydroplaning) parcial?
  choices:
    A: 25 millas por hora
    B: 35 millas por hora
    C: 45 millas por hora
    D: 55 millas por hora
  answer: B
  explanation: El hidroplaneo parcial comienza a unas 35 millas por hora y aumenta
    con la velocidad hasta que los neumáticos pueden perder todo contacto con el pavimento
    a 55 mph.
- id: 296
  category: defensive_driving
  question: ¿Cómo puede recuperarse si su vehículo comienza a hidroplanear (hydroplane)?
  choices:
    A: Frenar con fuerza y girar bruscamente a la derecha.
    B: Acelerar para atravesar la capa de agua.
    C: Mantener las ruedas derechas y reducir la velocidad.
    D: Girar el volante rápidamente de un lado a otro.
  answer: C
  explanation: Para recuperarse del hidroplaneo, mantenga las ruedas derechas y reduzca
    la velocidad. Esto permitirá que los neumáticos y la carretera vuelvan a entrar
    en contacto.
- id: 297
  category: safe_driving_rules
  question: ¿A qué distancia hacia adelante le permitirán ver con claridad las luces
    bajas de sus faros por la noche?
  choices:
    A: De 50 a 100 pies
    B: De 150 a 200 pies
    C: De 250 a 300 pies
    D: De 350 a 400 pies
  answer: B
  explanation: Las luces bajas de sus faros le permitirán ver con claridad a una distancia
    de 150 a 200 pies hacia adelante.
- id: 298
  category: safe_driving_rules
  question: ¿La ley de Louisiana requiere que use las luces bajas de sus faros cuando
    se aproxime a menos de cuántos pies de otro vehículo?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: La ley exige el uso de luces bajas cuando se aproxime a menos de 500
    pies o cuando siga a menos de 200 pies de otro vehículo.
- id: 299
  category: safe_driving_rules
  question: ¿Cuándo exige la ley de Louisiana que tenga encendidos los faros delanteros?
  choices:
    A: Solo entre las 8 PM y las 6 AM.
    B: Entre la puesta del sol y el amanecer, y cuando la precipitación requiera el
      uso de limpiaparabrisas.
    C: Solo cuando se conduce por carreteras rurales sin iluminación.
    D: Siempre que conduzca a más de 55 mph.
  answer: B
  explanation: La ley de Louisiana exige que los faros delanteros estén encendidos
    entre la puesta del sol y el amanecer, y cuando la humedad o la precipitación
    requieran el uso de los limpiaparabrisas.
- id: 300
  category: defensive_driving
  question: ¿Por qué es peligroso acercarse mucho detrás de un camión grande o autobús
    que tiene la intención de rebasar?
  choices:
    A: El camión puede acelerar repentinamente.
    B: Su visión de la carretera por delante puede verse obstruida.
    C: La resistencia del viento reducirá la velocidad de su vehículo.
    D: Es ilegal rebasar camiones grandes en una carretera de dos carriles.
  answer: B
  explanation: No se acerque demasiado detrás del vehículo que pretende rebasar (especialmente
    un camión grande o un autobús). Su visión puede verse obstruida.
- id: 301
  category: defensive_driving
  question: ¿Cuánto debe aumentar su distancia de seguimiento al conducir por carreteras
    desconocidas por la noche?
  choices:
    A: Al menos un segundo adicional.
    B: Al menos dos segundos adicionales.
    C: Al menos tres segundos adicionales.
    D: Al menos cuatro segundos adicionales.
  answer: B
  explanation: Debe aumentar su distancia de seguimiento añadiendo al menos un segundo
    adicional por las condiciones de conducción nocturna y al menos dos segundos adicionales
    por conducir en carreteras desconocidas por la noche.
- id: 302
  category: safe_driving_rules
  question: Según la ley de Luisiana, ¿cuándo debe encender las luces delanteras debido
    a las condiciones climáticas?
  choices:
    A: Cuando la visibilidad sea inferior a 1,000 pies.
    B: Cuando el clima dificulte ver los vehículos con claridad desde una distancia
      de 500 pies.
    C: Solo cuando esté lloviendo o nevando activamente.
    D: Cuando no pueda ver el vehículo que tiene directamente delante.
  answer: B
  explanation: La ley exige que las luces delanteras estén encendidas cuando se conduce
    en condiciones climáticas que dificultan que otras personas vean su vehículo con
    claridad desde una distancia de 500 pies.
- id: 303
  category: defensive_driving
  question: ¿Qué debe hacer si un conductor que se aproxima se niega a bajar sus luces
    delanteras por la noche?
  choices:
    A: Parpadear sus luces altas repetidamente hasta que bajen las suyas.
    B: Mirar directamente a sus luces delanteras para calcular su distancia.
    C: Salirse completamente de la carretera y esperar a que pasen.
    D: Mirar hacia el borde derecho de la carretera como guía y reducir la velocidad.
  answer: D
  explanation: Si un conductor obstinado se niega a bajar las luces, mire hacia el
    borde derecho de la carretera como guía y reduzca la velocidad.
- id: 304
  category: signs_and_signals
  question: ¿Qué indica una señal peatonal intermitente de 'DON'T WALK' (NO CRUCE)?
  choices:
    A: Los peatones no pueden empezar a cruzar, pero los que ya están cruzando pueden
      continuar hasta una zona segura.
    B: Los peatones deben dar la vuelta inmediatamente y regresar a la acera de inicio.
    C: Los vehículos deben detenerse inmediatamente para dejar cruzar a los peatones.
    D: Los peatones tienen el derecho de paso para comenzar a cruzar la calle.
  answer: A
  explanation: Las señales intermitentes de 'DON'T WALK' significan que los peatones
    no pueden comenzar a cruzar la calzada, pero los que ya están cruzando pueden
    continuar hasta la acera, isla de tráfico o zona de seguridad más cercana.
- id: 305
  category: sharing_the_road
  question: ¿Cuál es su responsabilidad como conductor si ve a un peatón cruzando
    la calle ilegalmente (cruce imprudente o 'jaywalking')?
  choices:
    A: Tocar la bocina para advertirles pero mantener su velocidad.
    B: Debe detenerse y cederles el paso en todo momento.
    C: Virar bruscamente hacia el carril contrario para evitarlos.
    D: Usted tiene el derecho de paso, así que proceda con precaución sin detenerse.
  answer: B
  explanation: Debe ceder el paso a los peatones en todo momento. Incluso si no están
    en un cruce de peatones y están cruzando la calle por donde no deben (cruce imprudente),
    lo cual es ilegal, usted debe detenerse por ellos.
- id: 306
  category: safe_driving_rules
  question: ¿Por qué nunca debe rebasar a un vehículo que está detenido en un cruce
    de peatones?
  choices:
    A: El vehículo detenido puede estar preparándose para hacer un giro en U ilegal.
    B: Es ilegal cambiar de carril a menos de 100 pies de una intersección.
    C: Puede bloquear la visión del siguiente conductor o golpear a un peatón que
      esté cruzando la calzada.
    D: El vehículo detenido podría acelerar repentinamente.
  answer: C
  explanation: Si se acerca demasiado a un peatón, puede bloquear la visión del siguiente
    conductor para ver al peatón mientras este cruza la calzada. No debe rebasar a
    un vehículo detenido en un cruce de peatones.
- id: 307
  category: safe_driving_rules
  question: Al caminar por una carretera, ¿en qué dirección deben caminar los peatones?
  choices:
    A: En la misma dirección que el tráfico.
    B: De frente al tráfico cuando sea posible.
    C: Solo en el lado derecho de la carretera.
    D: En la mediana central.
  answer: B
  explanation: Los peatones siempre deben caminar de frente al tráfico cuando sea
    posible y nunca deben entrar en una calzada sin comprobar si viene tráfico en
    sentido contrario.
- id: 308
  category: sharing_the_road
  question: Al detenerse ante un peatón con discapacidad visual en un cruce de peatones,
    ¿por qué no debe detener su automóvil a más de cinco pies del cruce?
  choices:
    A: Para evitar que otros autos lo rebasen.
    B: Porque el peatón utiliza el sonido de su motor como guía.
    C: Para poder dar indicaciones verbales al peatón fácilmente.
    D: Para asegurarse de despejar la intersección rápidamente.
  answer: B
  explanation: No detenga su automóvil a más de cinco pies del cruce de peatones.
    El peatón utiliza el sonido de su motor como guía, así que acérquese al cruce
    para permitir que la persona lo escuche.
- id: 309
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una práctica recomendada al tratar con un peatón
    con discapacidad visual?
  choices:
    A: Tocar la bocina ligeramente para avisarles que está esperando.
    B: Darles indicaciones verbales para ayudarles a cruzar con seguridad.
    C: Detenerse en medio del cruce de peatones para bloquear el resto del tráfico.
    D: No les dé indicaciones verbales, ya que ellos escuchan todos los sonidos del
      tráfico antes de cruzar.
  answer: D
  explanation: No dé indicaciones verbales al peatón. Él escucha todos los sonidos
    del tráfico antes de decidir cruzar la calle.
- id: 310
  category: driver_responsibility
  question: El uso de un teléfono celular mientras se conduce, ¿qué tres tipos de
    distracción implica?
  choices:
    A: Visual, manual y cognitiva.
    B: Visual, auditiva y física.
    C: Manual, auditiva y psicológica.
    D: Cognitiva, física y emocional.
  answer: A
  explanation: 'El uso de un teléfono celular mientras se conduce implica los tres
    tipos de distracción: visual, al apartar la vista de la carretera; manual, al
    quitar las manos del volante; y cognitiva, al apartar la mente y la concentración
    de la conducción.'
- id: 311
  category: safe_driving_rules
  question: Si viaja a 55 mph, ¿qué distancia recorrerá su vehículo durante los 4.6
    segundos que tarda en apartar la vista para leer un mensaje de texto?
  choices:
    A: El largo de un automóvil.
    B: El largo de un autobús escolar.
    C: El largo de un campo de fútbol americano.
    D: Una milla completa.
  answer: C
  explanation: Enviar mensajes de texto hace que el conductor aparte la vista de la
    carretera durante 4.6 segundos. A una velocidad de 55 mph, el vehículo recorre
    la longitud de un campo de fútbol americano en ese lapso de tiempo.
- id: 312
  category: driver_responsibility
  question: Según DISTRACTION.GOV, ¿qué tantas más probabilidades tiene de verse involucrado
    en un accidente automovilístico si envía mensajes de texto mientras conduce?
  choices:
    A: De 2 a 4 veces más probable.
    B: De 5 a 7 veces más probable.
    C: De 8 a 23 veces más probable.
    D: De 25 a 30 veces más probable.
  answer: C
  explanation: Según DISTRACTION.GOV, si envía mensajes de texto mientras conduce,
    tiene de 8 a 23 veces más probabilidades de verse involucrado en un accidente
    automovilístico.
- id: 313
  category: penalties_and_points
  question: ¿Cuál es la ley de Luisiana con respecto al uso de teléfonos celulares
    para conductores de 17 años de edad o menos?
  choices:
    A: Solo pueden usar dispositivos de manos libres.
    B: Se les prohíbe el uso de cualquier tipo de dispositivo de comunicación inalámbrica
      mientras operan un vehículo motorizado.
    C: Pueden usar teléfonos celulares solo durante las horas del día.
    D: Se les permite hacer llamadas telefónicas pero no pueden enviar mensajes de
      texto.
  answer: B
  explanation: La ley de Luisiana prohíbe que cualquier persona de 17 años de edad
    o menos use cualquier tipo de dispositivo de comunicación inalámbrica mientras
    opera un vehículo motorizado.
- id: 314
  category: driver_responsibility
  question: Según el manual, ¿cuál es la principal causa individual de muerte de adolescentes
    como resultado de un accidente automovilístico?
  choices:
    A: Conducir bajo la influencia del alcohol.
    B: Enviar mensajes de texto mientras conduce.
    C: Otro adolescente, generalmente un amigo.
    D: Malas condiciones climáticas.
  answer: C
  explanation: La mayoría de las personas se sorprenderían al descubrir que la principal
    causa individual de muerte de un adolescente como resultado de un accidente automovilístico
    es otro adolescente, generalmente un amigo.
- id: 315
  category: sharing_the_road
  question: Si un peatón con discapacidad visual da un paso atrás y retira su bastón,
    ¿qué le indica esto al conductor?
  choices:
    A: El peatón necesita indicaciones verbales.
    B: El peatón está esperando a que usted toque la bocina.
    C: Es una señal definitiva de que usted debe avanzar.
    D: El peatón dejó caer algo y necesita ayuda.
  answer: C
  explanation: No espere demasiado para que el peatón cruce la calle. Si la persona
    da un paso atrás y retira su bastón, esa es una señal definitiva de que usted
    debe avanzar.
- id: 316
  category: safe_driving_rules
  question: ¿A qué edad comienza a aumentar el riesgo de un accidente fatal para los
    conductores mayores?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: C
  explanation: Según el manual, el riesgo de un accidente fatal comienza a aumentar
    a los 75 años debido en gran medida a una mayor susceptibilidad a las lesiones.
- id: 317
  category: safe_driving_rules
  question: ¿Con qué frecuencia deben los conductores mayores revisarse la vista?
  choices:
    A: Cada seis meses
    B: Al menos una vez al año
    C: Cada dos años
    D: Solo al renovar su licencia
  answer: B
  explanation: El manual recomienda que los conductores mayores se revisen la vista
    al menos una vez al año y que siempre usen los anteojos o lentes de contacto requeridos.
- id: 318
  category: sharing_the_road
  question: Según la ley de Luisiana, ¿quién está obligado a usar un casco aprobado
    al operar o viajar como pasajero en una bicicleta?
  choices:
    A: Todos los ciclistas independientemente de su edad
    B: Niños menores de 12 años
    C: Niños menores de 16 años
    D: Solo los pasajeros de una bicicleta
  answer: B
  explanation: El Estatuto Revisado de Luisiana 32:199 establece que todos los niños
    menores de 12 años deben usar un casco aprobado al operar o viajar como pasajeros
    en una bicicleta.
- id: 319
  category: sharing_the_road
  question: ¿Qué derechos tienen las bicicletas en las vías públicas?
  choices:
    A: Deben ceder el paso a todos los vehículos motorizados en todo momento
    B: Tienen los mismos derechos y deben seguir las mismas leyes de tránsito que
      otros vehículos
    C: Solo se permiten en aceras y ciclovías designadas
    D: Tienen el derecho de paso sobre todo el resto del tráfico
  answer: B
  explanation: Las bicicletas tienen los mismos derechos de uso de las vías públicas
    que los automóviles y deben seguir las mismas leyes de tránsito que otros vehículos.
- id: 320
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima requerida entre un automóvil que rebasa y
    un ciclista que viaja más lento?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies
    D: Cinco pies
  answer: C
  explanation: Debe haber una distancia de tres pies entre el automóvil que rebasa
    y los ciclistas que viajan más lento.
- id: 321
  category: sharing_the_road
  question: ¿Por qué un ciclista podría no circular por el extremo derecho del carril?
  choices:
    A: Para bloquear el tráfico que se mueve más rápido
    B: Para evitar grava, escombros, pavimento en mal estado o rejillas de alcantarillado
    C: Porque se están preparando para girar a la derecha
    D: Para circular al lado del tráfico que viene en sentido contrario
  answer: B
  explanation: Los ciclistas que no circulan por el extremo derecho del carril pueden
    estar intentando evitar grava, escombros, pavimento en mal estado, rejillas de
    alcantarillado y otros obstáculos.
- id: 322
  category: sharing_the_road
  question: ¿Por qué los conductores deben aumentar su distancia de seguimiento detrás
    de los ciclistas?
  choices:
    A: Las bicicletas tienen distancias de frenado más cortas que los automóviles
    B: Las bicicletas tienen más probabilidades de detenerse bruscamente en las intersecciones
    C: Los ciclistas no pueden ver los vehículos que vienen detrás de ellos
    D: Las bicicletas viajan mucho más rápido que los autos
  answer: A
  explanation: Los conductores deben aumentar las distancias de seguimiento detrás
    de los ciclistas porque las distancias de frenado de las bicicletas son más cortas
    que las de los automóviles.
- id: 323
  category: sharing_the_road
  question: ¿Cuál es una causa común de accidentes cuando los conductores giran a
    la derecha cerca de un ciclista?
  choices:
    A: Esperar a que el ciclista pase antes de girar
    B: Cruzarse delante de un ciclista después de haberlo rebasado
    C: Hacer contacto visual con el ciclista
    D: Usar la señal de giro demasiado pronto
  answer: B
  explanation: Girar a la derecha después de rebasar a un ciclista es una causa de
    accidentes. Los conductores no deben cruzarse delante de un ciclista para girar
    a la derecha.
- id: 324
  category: sharing_the_road
  question: 'Las velocidades de las bicicletas son difíciles de juzgar y pueden variar
    desde menos de 10 mph hasta más de:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: C
  explanation: Las velocidades de las bicicletas son difíciles de juzgar. Pueden variar
    desde menos de 10 mph hasta más de 35 mph.
- id: 325
  category: sharing_the_road
  question: Si un conductor abre la puerta de su auto hacia el tráfico y un ciclista
    choca con ella, ¿de quién es la culpa de la colisión?
  choices:
    A: Culpa del ciclista
    B: Culpa del conductor
    C: Ambos comparten la misma culpa
    D: No es culpa de nadie, es un accidente inevitable
  answer: B
  explanation: Al abrir la puerta de su auto hacia el tráfico, primero busque ciclistas.
    Esta colisión es culpa del conductor.
- id: 326
  category: sharing_the_road
  question: ¿Cómo podría reaccionar un ciclista al cruzar las vías del tren?
  choices:
    A: Siempre se detendrán y cruzarán caminando con su bicicleta
    B: Pueden reducir la velocidad y posiblemente zigzaguear para cruzar las vías
    C: Acelerarán para cruzar lo más rápido posible
    D: Circularán por el extremo derecho de las vías
  answer: B
  explanation: Los cruces ferroviarios pueden hacer que los ciclistas reduzcan la
    velocidad y posiblemente zigzagueen para cruzar las vías.
- id: 327
  category: sharing_the_road
  question: Al circular de noche, ¿qué tipo de luces o reflectores debe tener una
    bicicleta?
  choices:
    A: Una luz delantera blanca y una luz o reflector trasero rojo
    B: Una luz delantera amarilla y un reflector trasero blanco
    C: Luces rojas intermitentes tanto en la parte delantera como en la trasera
    D: Solo un reflector blanco en la parte trasera
  answer: A
  explanation: Al circular de noche, las bicicletas deben tener una luz delantera
    blanca y una luz o reflector trasero rojo visible desde atrás.
- id: 328
  category: sharing_the_road
  question: 'Las investigaciones muestran que más de dos tercios de las colisiones
    entre autos y motocicletas son el resultado de:'
  choices:
    A: El motociclista que excede el límite de velocidad
    B: El motociclista que sigue al auto demasiado de cerca
    C: El otro conductor que gira delante de un motociclista
    D: El otro conductor que se detiene demasiado rápido
  answer: C
  explanation: Las investigaciones muestran que más de dos tercios de las colisiones
    entre autos y motocicletas son el resultado de que el otro conductor gira delante
    de un motociclista.
- id: 329
  category: sharing_the_road
  question: ¿Por qué una motocicleta podría parecer que está más lejos y viaja más
    lento de lo que realmente está?
  choices:
    A: Porque las motocicletas tienen faros más tenues
    B: Debido a su perfil pequeño y silueta estrecha
    C: Porque las motocicletas son más silenciosas que los autos
    D: Porque siempre circulan por el centro del carril
  answer: B
  explanation: Las motocicletas presentan una silueta estrecha. El perfil pequeño
    de la motocicleta puede hacer que parezca estar más lejos y viajar más lento de
    lo que realmente está.
- id: 330
  category: sharing_the_road
  question: 'Al conducir cerca de ciclistas, usted debe:'
  choices:
    A: Tocar la bocina ligeramente para avisarles que está allí
    B: Tocar la bocina con fuerza si están en el centro del carril
    C: Nunca toque la bocina cerca de los ciclistas
    D: Usar la bocina solo al rebasarlos
  answer: C
  explanation: 'El manual establece explícitamente: ''No toque la bocina cuando esté
    cerca de ciclistas''.'
- id: 331
  category: sharing_the_road
  question: Al conducir cerca de una motocicleta, ¿a qué parte del carril de tráfico
    tiene derecho la motocicleta?
  choices:
    A: La mitad del carril
    B: El ancho total del carril
    C: Solo la parte izquierda del carril
    D: Solo la parte derecha del carril
  answer: B
  explanation: Según el manual, a las motocicletas se les permite el ancho total de
    un carril para maniobrar, y los conductores deben abstenerse de compartir el carril
    con ellas.
- id: 332
  category: sharing_the_road
  question: ¿Cuál es el lugar más probable para que ocurra una colisión entre un automóvil
    y una motocicleta?
  choices:
    A: En autopistas interestatales
    B: En las intersecciones
    C: En los estacionamientos
    D: En carreteras rurales sinuosas
  answer: B
  explanation: El manual establece que las intersecciones son el lugar más probable
    para que ocurran colisiones entre automóviles y motocicletas, generalmente porque
    el conductor del automóvil no ve la motocicleta.
- id: 333
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada que debe mantener
    al conducir detrás de una motocicleta?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: Al conducir detrás de una motocicleta, debe permitir una distancia
    de seguimiento de al menos cuatro (4) segundos para proporcionar al motociclista
    suficiente espacio para maniobrar o detenerse en una emergencia.
- id: 334
  category: defensive_driving
  question: ¿Por qué debe esperar hasta que la maniobra de un motociclista haya comenzado
    de manera inequívoca antes de asumir sus intenciones?
  choices:
    A: Las señales de giro de las motocicletas suelen ser demasiado tenues para verse.
    B: Las motocicletas no están obligadas a usar señales de giro.
    C: Es posible que las señales de giro no se apaguen automáticamente en una motocicleta.
    D: Los motociclistas usan señales manuales en lugar de señales electrónicas.
  answer: C
  explanation: El manual advierte que no se debe asumir la intención de un motociclista
    porque las señales de giro pueden no apagarse automáticamente en una motocicleta,
    y los motociclistas ocasionalmente olvidan cancelarlas después de un giro.
- id: 335
  category: safe_driving_rules
  question: ¿Cómo debe manejar las luces delanteras de su vehículo al acercarse a
    una motocicleta por la noche?
  choices:
    A: Manténgalas en luz alta para que el motociclista pueda verlo.
    B: Haga destellos repetidamente para advertir al motociclista de su presencia.
    C: Apáguelas momentáneamente al pasar.
    D: Siempre baje la intensidad de sus luces (cambie a luz baja) tal como lo haría
      con otros vehículos.
  answer: D
  explanation: Siempre debe bajar la intensidad de sus luces delanteras ante una motocicleta,
    tal como se requiere para otros vehículos, porque su única luz delantera y trasera
    pueden mezclarse con otras luces, lo que hace que usted juzgue mal la distancia.
- id: 336
  category: vehicle_information
  question: En condiciones despejadas y secas, ¿cuál es la distancia mínima requerida
    para que un camión con remolque (tractor-trailer) cargado que viaja a 55 mph se
    detenga por completo?
  choices:
    A: 150 pies
    B: 200 pies
    C: 290 pies
    D: 400 pies
  answer: C
  explanation: Un camión con remolque cargado con mercancía, neumáticos con clasificación
    de seguridad y frenos debidamente ajustados que viaja a 55 millas por hora en
    una carretera despejada y seca requiere un mínimo de 290 pies para detenerse por
    completo.
- id: 337
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego de un camión grande?
  choices:
    A: Está conduciendo directamente delante del camión.
    B: No puede ver la cara del conductor del camión en uno de sus espejos laterales.
    C: Está conduciendo en el carril izquierdo junto al camión.
    D: Puede ver claramente la matrícula del camión.
  answer: B
  explanation: Si no puede ver la cara de un conductor de camión en uno de sus espejos,
    el conductor no puede verlo a usted y probablemente no sepa que está allí.
- id: 338
  category: defensive_driving
  question: ¿Por qué debe evitar meterse delante de un camión grande para ocupar un
    espacio abierto en el tráfico?
  choices:
    A: El espacio abierto es el margen de seguridad del camión necesario debido a
      su mayor distancia de frenado.
    B: El conductor del camión podría acelerar para cerrar la brecha.
    C: Es ilegal rebasar a un camión por la izquierda.
    D: Los camiones tienen una distancia de frenado más corta que los automóviles
      y podrían chocarlo por detrás.
  answer: A
  explanation: No se meta delante de un camión solo porque vea un espacio abierto.
    Ese espacio es el margen de seguridad del camión debido a su mayor distancia de
    frenado.
- id: 339
  category: sharing_the_road
  question: ¿Qué debe anticipar si está detenido detrás de un camión grande en una
    colina?
  choices:
    A: El camión acelerará mucho más rápido que un automóvil.
    B: El camión puede rodar hacia atrás cuando comience a acelerar.
    C: El camión necesitará retroceder antes de avanzar.
    D: Las luces de freno del camión parpadearán repetidamente.
  answer: B
  explanation: Si un camión se detiene en una colina, rodará hacia atrás cuando comience
    a acelerar. Debe dejar espacio adicional como precaución.
- id: 340
  category: safe_driving_rules
  question: Al rebasar un camión grande en un día ventoso, ¿qué debe hacer para minimizar
    los efectos de la turbulencia?
  choices:
    A: Toque la bocina para alertar al conductor del camión.
    B: Conduzca lo más cerca posible del camión para bloquear el viento.
    C: Manténgase en el borde exterior del carril, lejos del camión, y sujete el volante
      con firmeza.
    D: Acelere y desvíese ligeramente hacia el carril del camión.
  answer: C
  explanation: La turbulencia de un camión en un día ventoso puede hacer que un vehículo
    se desvíe. Para minimizar esto, manténgase en el borde exterior del carril, lejos
    del camión, y sujete el volante con firmeza con ambas manos.
- id: 341
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada entre su vehículo y un
    camión grande en buenas condiciones de la carretera y del clima?
  choices:
    A: 2 a 3 segundos
    B: 4 a 5 segundos
    C: 6 a 7 segundos
    D: 8 a 10 segundos
  answer: B
  explanation: En buenas condiciones de la carretera y del clima, debe dejar un espacio
    de al menos cuatro a cinco (4-5) segundos entre su vehículo y el camión que tiene
    delante.
- id: 342
  category: sharing_the_road
  question: ¿Por qué debe mantener sus luces delanteras en luz de cruce (bajas) al
    seguir a un camión grande por la noche?
  choices:
    A: Las luces altas agotarán la batería de su vehículo más rápido.
    B: Los espejos laterales del camión reflejarán las luces altas directamente a
      los ojos del conductor del camión.
    C: Las luces bajas le facilitan ver las luces de freno del camión.
    D: Las luces altas causarán que las luces traseras del camión deslumbren.
  answer: B
  explanation: Al seguir a un vehículo por la noche, mantenga sus luces delanteras
    en luz de cruce (bajas) porque los numerosos espejos laterales del camión reflejarán
    las luces altas directamente a los ojos del conductor.
- id: 343
  category: defensive_driving
  question: ¿Qué debe hacer para maximizar la visibilidad cuando un camión grande
    viene en sentido contrario en condiciones de humedad?
  choices:
    A: Encender sus luces altas.
    B: Encender sus limpiaparabrisas antes de que el camión lo pase.
    C: Detenerse en el arcén hasta que el camión pase.
    D: Activar sus luces de emergencia.
  answer: B
  explanation: Si se aproxima a un camión que viene en sentido contrario en condiciones
    de humedad, encienda sus limpiaparabrisas antes de que lo pase para asegurar que
    su parabrisas se limpie tan pronto como le caiga cualquier salpicadura.
- id: 344
  category: sharing_the_road
  question: ¿Qué son las "No-Zones" (Zonas Prohibidas) en un camión grande?
  choices:
    A: Áreas donde los camiones no tienen permitido estacionar.
    B: Carriles en la autopista restringidos para el uso de camiones.
    C: Puntos ciegos alrededor de la parte delantera, trasera y laterales del camión.
    D: Estaciones de pesaje donde no se permiten automóviles.
  answer: C
  explanation: Los camiones grandes tienen puntos ciegos, o No-Zones, alrededor de
    la parte delantera, trasera y laterales del camión donde es difícil para el conductor
    ver.
- id: 345
  category: sharing_the_road
  question: ¿Por qué es peligroso rebasar a una motocicleta demasiado rápido o demasiado
    cerca?
  choices:
    A: La motocicleta puede acelerar para competir con usted.
    B: La ráfaga de viento de su vehículo puede hacer que la motocicleta pierda el
      control.
    C: Es posible que el motociclista no escuche su motor.
    D: Es ilegal rebasar a una motocicleta en una carretera de varios carriles.
  answer: B
  explanation: No debe rebasar a una motocicleta demasiado rápido o demasiado cerca
    porque la ráfaga de viento de los vehículos grandes y rápidos puede hacer que
    una motocicleta pierda el control.
- id: 346
  category: sharing_the_road
  question: ¿Cuál es una buena regla general para saber si el conductor de un camión
    puede ver su vehículo?
  choices:
    A: Si se encuentra a menos de 50 pies del camión.
    B: Si puede ver al conductor del camión en el espejo del camión.
    C: Si toca la bocina y ellos no frenan.
    D: Si está conduciendo por el lado derecho del camión.
  answer: B
  explanation: 'El manual establece: "Recuerde, si no puede ver al conductor del camión
    en el espejo del camión, el conductor del camión no puede verlo a usted".'
- id: 347
  category: sharing_the_road
  question: Al rebasar a un camión grande, ¿cuándo es seguro volver a incorporarse
    delante de él?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del camión.
    B: Cuando pueda ver toda la parte delantera del vehículo en su espejo retrovisor.
    C: Cuando el conductor del camión le haga señales con sus luces delanteras.
    D: Después de haber mantenido su velocidad durante al menos 10 segundos.
  answer: B
  explanation: Al rebasar a un camión, debe "buscar toda la parte delantera del vehículo
    en su espejo retrovisor antes de incorporarse delante y mantener la velocidad".
- id: 348
  category: sharing_the_road
  question: ¿Por qué debe evitar quedar entre un camión grande y la acera cuando el
    camión está girando a la derecha?
  choices:
    A: El camión puede acelerar repentinamente.
    B: El camión a veces se abrirá hacia la izquierda para girar a la derecha de forma
      segura, creando una "jugada de apretón" (squeeze play).
    C: El escape del camión es más peligroso en el lado derecho.
    D: Es ilegal rebasar a un camión por la derecha bajo cualquier circunstancia.
  answer: B
  explanation: Los camiones a veces se abren hacia la izquierda para poder girar en
    una esquina. Si intenta meterse entre el camión y la acera, quedará atrapado entre
    ellos y podría sufrir un accidente grave.
- id: 349
  category: driver_responsibility
  question: Si un oficial de policía lo detiene, ¿qué debe hacer con sus manos?
  choices:
    A: Mantenerlas ocultas en su regazo.
    B: Alcanzar inmediatamente la guantera para buscar su registro.
    C: Mantener sus manos visibles.
    D: Agitarlas fuera de la ventana para mostrar que no está armado.
  answer: C
  explanation: Durante una parada de tráfico, el manual instruye explícitamente a
    los conductores a "mantener sus manos visibles".
- id: 350
  category: driver_responsibility
  question: ¿Qué debe hacer si un vehículo sin distintivos con un oficial que no lleva
    uniforme le indica que se detenga en una zona desierta y sin iluminación y usted
    se siente incómodo?
  choices:
    A: Ignorar al oficial y conducir hasta su casa.
    B: Acelerar para escapar del vehículo sin distintivos.
    C: Explicar esto al oficial y preguntar si puede dirigirse a una zona más poblada
      o mejor iluminada.
    D: Detenerse inmediatamente y salir de su vehículo para confrontar al oficial.
  answer: C
  explanation: Si se siente incómodo deteniéndose en un área desierta o que no está
    bien iluminada, debe "explicar esto al oficial y preguntar si puede dirigirse
    a una zona más poblada o mejor iluminada".
- id: 351
  category: signs_and_signals
  question: ¿Qué debe hacer si se aproxima a una intersección donde el semáforo no
    funciona?
  choices:
    A: Ceda el paso al vehículo a su izquierda y continúe sin detenerse.
    B: Trate la intersección como una parada obligatoria para todos los sentidos o
      de cuatro vías.
    C: El vehículo en la vía principal tiene el derecho de paso.
    D: Espere hasta que llegue un oficial de policía para dirigir el tráfico.
  answer: B
  explanation: Cuando un semáforo no funciona en una intersección, la intersección
    debe tratarse como una parada obligatoria para todos los sentidos o de cuatro
    vías.
- id: 352
  category: safe_driving_rules
  question: Según las leyes de la física mencionadas en el manual, ¿qué tan más violento
    es un impacto frontal a 35 mph en comparación con uno a 30 mph?
  choices:
    A: Un cuarto más violento
    B: Un tercio más violento
    C: El doble de violento
    D: Tres veces más violento
  answer: B
  explanation: El manual establece que la gravedad de un choque aumenta de manera
    desproporcionada con la velocidad del vehículo, señalando que 'un impacto frontal
    a 35 mph, por ejemplo, es un tercio más violento que uno a 30 mph'.
- id: 353
  category: safe_driving_rules
  question: ¿Puede ser multado por una infracción de velocidad si conduce al límite
    de velocidad indicado?
  choices:
    A: No, siempre que no exceda el límite indicado, está conduciendo legalmente.
    B: Sí, si viaja demasiado rápido para las condiciones de la vía o del clima.
    C: Sí, pero solo si conduce en una zona escolar.
    D: No, los límites de velocidad tienen en cuenta todas las condiciones climáticas
      posibles.
  answer: B
  explanation: Puede ser multado por viajar demasiado rápido para las condiciones
    cuando supera las limitaciones legales para el entorno. Por ejemplo, conducir
    a 55 mph en una tormenta de nieve no es aceptable, incluso si el límite de velocidad
    indicado permite 55 mph.
- id: 354
  category: safe_driving_rules
  question: ¿Qué le exige la 'Ley General de Velocidad' (General Speed Law)?
  choices:
    A: Siempre debe conducir exactamente al límite de velocidad indicado.
    B: No debe conducir a una velocidad mayor de la que sea razonable para las condiciones.
    C: Debe conducir al menos 10 mph por debajo del límite de velocidad en mal tiempo.
    D: No debe conducir a menos de 45 mph en ninguna autopista.
  answer: B
  explanation: La Ley General de Velocidad establece que no debe conducir a una velocidad
    mayor de la que sea razonable. Debe conducir a una velocidad segura y adecuada
    según el área, la carretera, el tráfico, la luz y las condiciones climáticas.
- id: 355
  category: safe_driving_rules
  question: ¿Cómo define el estado las carreras de aceleración (drag racing)?
  choices:
    A: Conducir a más de 20 mph sobre el límite de velocidad indicado.
    B: Zigzaguear entre el tráfico en una autopista interestatal.
    C: La operación de dos o más vehículos desde un punto, uno al lado del otro, a
      velocidades de aceleración en un intento competitivo de superarse entre sí.
    D: Modificar el motor de un vehículo para exceder las especificaciones de velocidad
      de fábrica.
  answer: C
  explanation: Las carreras de aceleración (drag racing) se definen como la operación
    de dos o más vehículos desde un punto, uno al lado del otro, a velocidades de
    aceleración en un intento competitivo de superarse entre sí.
- id: 356
  category: safe_driving_rules
  question: Al conducir en una carretera de carriles múltiples, ¿cuándo es legal cruzar
    una línea central continua pintada?
  choices:
    A: Al rebasar a un vehículo que se mueve lentamente.
    B: Solo con el propósito de realizar un giro.
    C: Cuando el carril derecho está bloqueado por obras de construcción.
    D: Nunca es legal cruzar una línea central continua pintada.
  answer: B
  explanation: No puede cruzar la línea central continua pintada de ninguna carretera
    de carriles múltiples, excepto con el propósito de realizar un giro.
- id: 357
  category: safe_driving_rules
  question: ¿Cuál es la visibilidad delantera mínima requerida antes de intentar rebasar
    a otro vehículo?
  choices:
    A: Un octavo de milla
    B: Un cuarto de milla
    C: Media milla
    D: Una milla
  answer: B
  explanation: 'El manual establece: ''si no puede ver al menos un cuarto de milla
    adelante, no intente rebasar''.'
- id: 358
  category: safe_driving_rules
  question: ¿Dónde es explícitamente peligroso e ilegal cambiar de carril?
  choices:
    A: En una carretera dividida
    B: Mientras conduce a través de una intersección o se aproxima a ella
    C: En una zona residencial
    D: En una carretera de un solo carril
  answer: B
  explanation: No cambie de carril mientras conduce a través de una intersección o
    se aproxima a ella, ya que esto es peligroso e ilegal.
- id: 359
  category: sharing_the_road
  question: ¿A qué distancia debe detenerse de un autobús escolar que se ha detenido
    para subir o bajar niños?
  choices:
    A: Al menos 15 pies
    B: Al menos 20 pies
    C: Al menos 30 pies
    D: Al menos 50 pies
  answer: C
  explanation: Debe detenerse al menos a treinta pies de un autobús escolar detenido
    que esté subiendo o bajando niños.
- id: 360
  category: sharing_the_road
  question: ¿A qué distancia activará el conductor de un autobús escolar las luces
    amarillas intermitentes antes de una parada de autobús escolar?
  choices:
    A: Al menos 50 pies pero no más de 100 pies
    B: Al menos 100 pies pero no más de 500 pies
    C: Al menos 200 pies pero no más de 600 pies
    D: Exactamente 500 pies
  answer: B
  explanation: Los conductores de autobuses activarán las luces amarillas intermitentes
    del autobús al menos 100 pies pero no más de 500 pies antes de la parada del autobús
    escolar.
- id: 361
  category: safe_driving_rules
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar detenido con
    luces rojas intermitentes?
  choices:
    A: Al circular por una calzada de cuatro carriles no separada por una barrera
    B: Al circular por una calzada de cuatro o cinco carriles separada por un carril
      exclusivo para girar a la izquierda en ambos sentidos
    C: Cuando circula directamente detrás del autobús
    D: Cuando circula en dirección opuesta en una carretera de dos carriles
  answer: B
  explanation: El manual establece que los conductores no están obligados a detenerse
    ante un autobús escolar detenido cuando circulan por calzadas de cuatro o cinco
    carriles que están separadas por un carril exclusivo para girar a la izquierda
    en ambos sentidos.
- id: 362
  category: safe_driving_rules
  question: Según la ley de Luisiana, ¿con cuánta antelación debe señalizar y colocarse
    en el carril adecuado antes de realizar un giro?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: La ley exige que señalice y se coloque en el carril adecuado al menos
    100 pies antes de realizar un giro.
- id: 363
  category: defensive_driving
  question: ¿Por qué debe mantener las ruedas rectas mientras espera para realizar
    un giro a la izquierda?
  choices:
    A: Ayuda a que el sistema de dirección asistida se enfríe.
    B: Evita que sea empujado hacia el tráfico en sentido contrario si lo golpean
      por detrás.
    C: Le permite acelerar más rápido cuando la luz cambia a verde.
    D: Indica a otros conductores que está cediendo el paso.
  answer: B
  explanation: El manual aconseja mantener las ruedas rectas mientras espera para
    girar porque esto evitará que sea empujado hacia el tráfico si lo golpean por
    detrás.
- id: 364
  category: safe_driving_rules
  question: 'No debe intentar dar la vuelta en una colina o en una curva si su vehículo
    no puede ser visto por los conductores que se aproximan a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: No intente dar la vuelta en una colina o en una curva donde su vehículo
    no pueda ser visto por otros conductores que se aproximen desde cualquier dirección
    a menos de 500 pies.
- id: 365
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima que se le permite circular por un carril
    central compartido para girar a la izquierda?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: La ley de Luisiana prohíbe circular por un carril central compartido
    para girar a la izquierda por más de 200 pies.
- id: 366
  category: safe_driving_rules
  question: ¿Cuál es la velocidad recomendada al entrar en una rotonda o glorieta?
  choices:
    A: 5 a 10 mph
    B: 15 a 20 mph
    C: 25 a 30 mph
    D: 35 a 40 mph
  answer: B
  explanation: Al entrar en una rotonda o glorieta, debe negociar una curva cerrada
    y debe reducir su velocidad a aproximadamente 15 a 20 mph.
- id: 367
  category: safe_driving_rules
  question: ¿En qué dirección circulan los vehículos alrededor de una rotonda o glorieta?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En un patrón de figura en ocho
    D: En cualquier dirección que sea más corta hacia la salida
  answer: B
  explanation: Los vehículos circulan en sentido contrario a las agujas del reloj
    alrededor de una isla central elevada en una rotonda o glorieta.
- id: 368
  category: signs_and_signals
  question: ¿Cómo debe señalizar si tiene la intención de girar a la izquierda en
    una rotonda?
  choices:
    A: Señalice hacia la 'izquierda' al acercarse y señalice hacia la 'derecha' una
      vez que haya recorrido las tres cuartas partes del camino para salir.
    B: Señalice hacia la 'izquierda' continuamente hasta que haya salido completamente
      de la rotonda.
    C: No es necesario señalizar al acercarse, pero señalice hacia la 'izquierda'
      para salir.
    D: Señalice hacia la 'derecha' al acercarse y hacia la 'izquierda' al salir.
  answer: A
  explanation: Si tiene la intención de girar a la izquierda, señalice hacia la 'izquierda'
    al acercarse a la glorieta o rotonda. Una vez que haya recorrido las tres cuartas
    partes del camino, señalice hacia la 'derecha' para tomar la salida.
- id: 369
  category: safe_driving_rules
  question: Al tomar una curva, ¿dónde deben estar colocadas sus manos en el volante?
  choices:
    A: A las diez y a las dos
    B: A las nueve y a las tres
    C: A las ocho y a las cuatro
    D: Una mano a las doce
  answer: B
  explanation: El plan de 10 puntos para tomar curvas establece mantener ambas manos
    en el volante a las nueve y a las tres.
- id: 370
  category: vehicle_information
  question: Al tomar una curva, ¿qué es el 'ápice' (apex)?
  choices:
    A: El punto donde comienza el giro.
    B: El punto donde el coche vuelve a circular en línea recta.
    C: El punto donde el coche alcanza el punto más alejado en el interior de la curva.
    D: El punto donde debe aplicar el frenado máximo.
  answer: C
  explanation: Cada curva se compone de tres partes. El ápice es el punto donde el
    coche alcanza el punto más alejado en el interior de la curva.
- id: 371
  category: defensive_driving
  question: ¿Por qué es importante juzgar correctamente su velocidad al tomar una
    curva?
  choices:
    A: Porque la carga de giro depende de la velocidad al cuadrado, lo que significa
      que duplicar su velocidad genera cuatro veces la fuerza de giro.
    B: Porque las velocidades más lentas aumentan la carga de giro en los neumáticos.
    C: Porque las señales de velocidad recomendada son siempre perfectamente exactas.
    D: Porque la fuerza de giro se elimina por completo si frena con fuerza en la
      curva.
  answer: A
  explanation: El manual explica que la carga (o fuerza) de giro depende de la velocidad
    al cuadrado. Duplicar la velocidad genera cuatro veces la fuerza de giro, lo que
    facilita exceder el agarre disponible si se entra demasiado rápido.
- id: 372
  category: safe_driving_rules
  question: Si usted y un conductor que viene en sentido contrario se encuentran en
    una intersección y ambos señalizan giros a la izquierda, ¿cómo deben proceder
    cuando sea seguro?
  choices:
    A: Cada conductor debe girar a la derecha del centro de la intersección.
    B: Cada conductor debe girar a la izquierda del centro de la intersección.
    C: El conductor que llegó primero debe girar a la derecha en su lugar.
    D: Ambos conductores deben seguir recto para evitar una colisión.
  answer: B
  explanation: Si dos vehículos se encuentran en una intersección y ambos señalizan
    giros a la izquierda, el manual indica que 'cuando sea seguro, cada conductor
    debe girar a la izquierda del centro de la intersección'.
- id: 373
  category: safe_driving_rules
  question: ¿Cuál es la forma más eficiente y fluida de entrar en una curva o esquina?
  choices:
    A: Acelerar fuertemente al entrar en la curva
    B: Entrar un poco despacio
    C: Frenar agresivamente mientras gira
    D: Cruzar la línea central para ampliar el giro
  answer: B
  explanation: El manual establece que la forma más eficiente y fluida de tomar una
    curva es entrar en ella un poco despacio, ya que entrar demasiado rápido puede
    causar una pérdida de control.
- id: 374
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe dar una señal de giro continua antes de realizar
    un giro?
  choices:
    A: No menos de 50 pies
    B: No menos de 100 pies
    C: No menos de 200 pies
    D: No menos de 500 pies
  answer: B
  explanation: Una señal de giro a la derecha o a la izquierda debe darse continuamente
    durante no menos de 100 pies antes de realizar el giro.
- id: 375
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo doblado hacia abajo
    C: Brazo izquierdo doblado hacia arriba
    D: Brazo derecho extendido hacia afuera
  answer: C
  explanation: Según el manual, la señal manual para un giro a la derecha es el brazo
    izquierdo doblado hacia arriba.
- id: 376
  category: safe_driving_rules
  question: ¿Cuándo es ilegal parpadear sus señales de giro?
  choices:
    A: Al cambiar de carril en una autopista
    B: Al salir de un espacio de estacionamiento en paralelo
    C: En un solo lado de un vehículo estacionado o averiado
    D: Al reducir la velocidad para detenerse
  answer: C
  explanation: Es ilegal parpadear sus señales de giro en un solo lado de un vehículo
    estacionado o averiado O como señal para que otro vehículo lo pase.
- id: 377
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso según la ley de Louisiana?
  choices:
    A: El conductor a la derecha en una parada de 4 vías
    B: Los peatones en un cruce peatonal
    C: Los vehículos de emergencia con luces intermitentes
    D: La ley no otorga a nadie el derecho de paso; solo dice quién debe cederlo
  answer: D
  explanation: La ley dice quién debe ceder el derecho de paso a otro usuario de la
    vía; no otorga a nadie el derecho de paso.
- id: 378
  category: safe_driving_rules
  question: ¿Qué debe hacer si un semáforo funciona mal en una intersección?
  choices:
    A: Tratar la intersección como una señal de ceda el paso
    B: Tratar la intersección como una parada de 4 vías
    C: El conductor en la carretera principal tiene el derecho de paso
    D: Proceder sin detenerse si el camino está despejado
  answer: B
  explanation: Si un semáforo ha fallado, la intersección se convierte en una intersección
    de parada de 4 vías.
- id: 379
  category: safe_driving_rules
  question: Cuando dos vehículos se aproximan a una intersección de parada de 4 vías
    al mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El conductor de la derecha debe ceder el paso al conductor de la izquierda
    B: El conductor de la izquierda debe ceder el paso al conductor de la derecha
    C: El vehículo que viaja a una velocidad mayor debe ceder el paso
    D: El vehículo que gira a la derecha debe ceder el paso al vehículo que va recto
  answer: B
  explanation: Cuando dos vehículos se aproximan a una intersección al mismo tiempo,
    el conductor de la izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 380
  category: safe_driving_rules
  question: Al conducir por un camino no pavimentado que se cruza con un camino pavimentado,
    ¿qué vehículo debe ceder el paso?
  choices:
    A: El vehículo en el camino pavimentado
    B: El vehículo en el camino no pavimentado
    C: El vehículo que gira a la derecha
    D: El vehículo que viaja más rápido
  answer: B
  explanation: Usted debe ceder el derecho de paso cuando conduzca por un camino no
    pavimentado que se cruza con un camino pavimentado.
- id: 381
  category: safe_driving_rules
  question: ¿Cuál es la distancia de parada requerida desde el riel más cercano de
    un cruce ferroviario cuando se aproxima un tren?
  choices:
    A: A menos de 100 pies pero no menos de 50 pies
    B: A menos de 50 pies pero no menos de 15 pies
    C: A menos de 30 pies pero no menos de 10 pies
    D: A menos de 25 pies pero no menos de 5 pies
  answer: B
  explanation: La ley de Louisiana exige que el conductor de cualquier vehículo motorizado
    se detenga a una distancia de entre 50 pies y 15 pies del riel más cercano de
    un cruce ferroviario cuando se aproxima un tren.
- id: 382
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se apaga (se detiene) en una vía férrea
    en el camino de un tren que se aproxima?
  choices:
    A: Permanecer en el vehículo y llamar al 911
    B: Salir y correr en la misma dirección en la que viaja el tren
    C: Salir y moverse en dirección hacia el tren que se aproxima, alejándose de las
      vías
    D: Intentar empujar el vehículo fuera de las vías antes de que llegue el tren
  answer: C
  explanation: Si su vehículo se apaga en el camino de un tren que se aproxima, salga
    y muévase en dirección hacia el tren que se aproxima, alejándose de las vías.
- id: 383
  category: vehicle_information
  question: Si su vehículo tiene transmisión manual, ¿qué debe hacer al cruzar las
    vías del tren?
  choices:
    A: Cambiar de marcha mientras cruza las vías para mantener la velocidad
    B: Poner punto muerto (neutral) y cruzar las vías por inercia
    C: Cambiar de marcha antes de llegar a las vías y no cambiar de marcha mientras
      las cruza
    D: Acelerar fuertemente y subir de marcha mientras está en las vías
  answer: C
  explanation: Si su vehículo tiene transmisión manual, cambie de marcha antes de
    llegar a las vías y no cambie de marcha mientras las cruza.
- id: 384
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado por ley a detenerse en
    todos los cruces ferroviarios?
  choices:
    A: Automóviles de pasajeros que transporten a más de cuatro personas
    B: Motocicletas y ciclomotores
    C: Autobuses escolares y vehículos que transporten explosivos
    D: Vehículos de emergencia que respondan a una llamada
  answer: C
  explanation: Los conductores de vehículos que transporten pasajeros por contrato,
    autobuses escolares o camiones, o cualquier vehículo que transporte explosivos
    o líquidos inflamables deben detenerse en los cruces ferroviarios.
- id: 385
  category: defensive_driving
  question: ¿Cuánto tiempo le toma detenerse a un tren de carga de 100 vagones que
    viaja a 55 millas por hora?
  choices:
    A: Aproximadamente media milla
    B: Más de una milla
    C: Menos de 500 pies
    D: Exactamente 100 yardas
  answer: B
  explanation: Un tren de carga de 100 vagones que viaja a 55 millas por hora requiere
    más de una milla para detenerse. Esa es la longitud de 18 campos de fútbol americano.
- id: 386
  category: sharing_the_road
  question: Cuando un vehículo de emergencia hace sonar una sirena y tiene luces de
    advertencia intermitentes, ¿qué debe hacer usted?
  choices:
    A: Acelerar para apartarse de su camino
    B: Detenerse inmediatamente en su carril actual
    C: Hacerse a un lado hacia el borde derecho de la calzada, lejos de las intersecciones,
      y detenerse
    D: Hacerse a un lado hacia el borde izquierdo de la calzada y reducir la velocidad
  answer: C
  explanation: Debe ceder el paso a los vehículos de emergencia que hagan sonar una
    sirena y tengan luces de advertencia intermitentes, haciéndose a un lado hacia
    el borde derecho de la calzada, lejos de las intersecciones, y deteniéndose.
- id: 387
  category: safe_driving_rules
  question: ¿Dónde está estrictamente prohibido dar marcha atrás bajo cualquier circunstancia?
  choices:
    A: En una calle de un solo sentido
    B: En el arcén (hombro) o la calzada de cualquier autopista de acceso controlado
    C: En una entrada residencial
    D: En un espacio de estacionamiento en paralelo
  answer: B
  explanation: No se permite dar marcha atrás en el arcén o la calzada de ninguna
    autopista de acceso controlado. También está prohibido en cualquier otro lugar
    a menos que pueda hacerse de manera segura.
- id: 388
  category: safe_driving_rules
  question: ¿Cuál es el número máximo de personas legalmente permitidas para ocupar
    el asiento delantero de un vehículo en movimiento?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Es contra la ley que más de tres personas ocupen el asiento delantero
    de un vehículo en movimiento.
- id: 389
  category: safe_driving_rules
  question: Según la ley de Louisiana, ¿cuál es la edad mínima para que un pasajero
    viaje legalmente en la caja abierta de una camioneta?
  choices:
    A: 10 años de edad
    B: 12 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: B
  explanation: Ninguna persona menor de doce años podrá ser pasajero en la caja abierta
    de una camioneta.
- id: 390
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor cuando participa en un cortejo fúnebre?
  choices:
    A: Tocar la bocina en cada intersección
    B: Conducir con las luces altas encendidas
    C: Tener los faros delanteros encendidos y las luces de emergencia intermitentes
    D: Conducir por el lado izquierdo de la calzada
  answer: C
  explanation: Al participar en un cortejo fúnebre, cada conductor debe tener los
    faros delanteros del vehículo encendidos y las luces de emergencia intermitentes.
- id: 391
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de seguimiento requerida al seguir a un vehículo
    de emergencia que responde a un llamado?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Seguir a vehículos de emergencia que responden a un llamado a una distancia
    menor de 500 pies es ilegal.
- id: 392
  category: safe_driving_rules
  question: Cuando se requiere el uso de los limpiaparabrisas, ¿qué más debe hacer?
  choices:
    A: Encender las luces altas
    B: Encender las luces de emergencia
    C: Encender las luces bajas
    D: Reducir la velocidad a 15 mph
  answer: C
  explanation: La ley de Louisiana exige que tenga encendidas las luces delanteras
    (luces bajas) cuando se requiera el uso de los limpiaparabrisas.
- id: 393
  category: license_system
  question: ¿Entre qué horas tienen prohibido conducir los conductores menores de
    17 años, a menos que estén acompañados por un adulto calificado o un hermano?
  choices:
    A: 9:00 p.m. y 6:00 a.m.
    B: 10:00 p.m. y 5:00 a.m.
    C: 11:00 p.m. y 5:00 a.m.
    D: Medianoche y 6:00 a.m.
  answer: C
  explanation: Los conductores menores de 17 años tienen prohibido conducir entre
    las 11:00 p.m. y las 5:00 a.m., a menos que estén acompañados por un padre con
    licencia, tutor o adulto de al menos 21 años de edad, o un hermano de 18 años
    de edad.
- id: 394
  category: sharing_the_road
  question: Al circular por una vía pública que no esté reservada exclusivamente para
    bicicletas, ¿cuál es el número máximo de ciclistas que pueden circular en paralelo
    (uno al lado del otro)?
  choices:
    A: Uno (en fila india solamente)
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Los ciclistas no deben circular más de dos en paralelo, excepto en
    las vías reservadas para el uso exclusivo de bicicletas.
- id: 395
  category: sharing_the_road
  question: ¿Un niño debe estar asegurado en un asiento de sujeción aprobado para
    ser pasajero en una bicicleta si cumple con cuál de los siguientes criterios?
  choices:
    A: Pesar menos de cuarenta libras o medir menos de cuarenta pulgadas de altura
    B: Pesar menos de cincuenta libras o medir menos de cuarenta y cinco pulgadas
      de altura
    C: Tener menos de cinco años de edad
    D: Tener menos de ocho años de edad
  answer: A
  explanation: Los niños que pesen menos de cuarenta libras o midan menos de cuarenta
    pulgadas de altura deben estar debidamente sentados y asegurados en un asiento
    de sujeción aprobado para ser pasajeros en una bicicleta.
- id: 396
  category: safe_driving_rules
  question: Según la ley de Louisiana, ¿qué debe hacer antes de dejar un vehículo
    motorizado sin vigilancia?
  choices:
    A: Dejar el motor en marcha si se ausentará menos de cinco minutos
    B: Detener el motor, bloquear el encendido, quitar la llave y poner el freno
    C: Encender las luces de emergencia y dejar las llaves en el encendido
    D: Estacionar en la calzada en lugar de en el acotamiento blando
  answer: B
  explanation: Ninguna persona que conduzca o esté a cargo de un vehículo motorizado
    permitirá que este permanezca sin vigilancia sin antes detener el motor, bloquear
    el encendido, quitar la llave y poner el freno de manera efectiva.
- id: 397
  category: penalties_and_points
  question: ¿Cuáles son las posibles sanciones por el robo de combustible de un vehículo
    motorizado?
  choices:
    A: Una advertencia por la primera infracción
    B: Solo una multa
    C: Multa, pérdida de la licencia y posible tiempo en la cárcel
    D: Solo servicio comunitario obligatorio
  answer: C
  explanation: El robo de combustible de vehículos motorizados es un delito castigado
    con multa, pérdida de la licencia y posible tiempo en la cárcel.
- id: 398
  category: defensive_driving
  question: ¿Qué hábito de conducción se recomienda para ayudar a evitar convertirse
    en víctima de un accidente automovilístico provocado?
  choices:
    A: Seguir muy de cerca al vehículo que tiene delante
    B: Evitar seguir de cerca a otros vehículos y dejar mucho espacio
    C: Conducir ligeramente por encima del límite de velocidad
    D: Confiar en las grúas que casualmente aparecen en la escena
  answer: B
  explanation: Para evitar convertirse en víctima de un accidente automovilístico
    provocado, el manual aconseja evitar seguir de cerca al vehículo de adelante y
    dejar siempre mucho espacio entre usted y el vehículo que tiene delante.
- id: 399
  category: vehicle_information
  question: De acuerdo con los consejos de "Park Smart" para prevenir el robo de automóviles,
    ¿cuál de las siguientes acciones NO debe realizar?
  choices:
    A: Poner los objetos de valor en el maletero
    B: Estacionar en áreas bien iluminadas
    C: Esconder un arma de fuego en su vehículo
    D: Usar inmovilizadores de vehículos
  answer: C
  explanation: 'En la sección de "cosas que NO debe hacer" para prevenir el robo de
    automóviles, el manual establece específicamente: "No esconda un arma de fuego
    en su vehículo".'
- id: 400
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso cuando usted se está incorporando a la
    interestatal?
  choices:
    A: El vehículo que se incorpora
    B: El tráfico de la interestatal
    C: El vehículo que se mueve más rápido
    D: Solo los camiones comerciales
  answer: B
  explanation: 'El manual establece: "El tráfico de la interestatal tiene el derecho
    de paso. No siempre puede contar con que otros conductores lo vean o se muevan
    para darle espacio para entrar".'
- id: 401
  category: safe_driving_rules
  question: ¿A qué velocidad debe intentar entrar en la autopista interestatal?
  choices:
    A: 10 mph más lento que el límite de velocidad indicado
    B: A la velocidad del tráfico o cerca de ella
    C: Exactamente a 70 millas por hora
    D: 45 millas por hora
  answer: B
  explanation: 'Al entrar en la autopista interestatal, el manual aconseja: "Entre
    en la autopista interestatal a la velocidad del tráfico o cerca de ella".'
- id: 402
  category: defensive_driving
  question: ¿Qué tan grande debe ser el espacio que necesita al incorporarse al tráfico
    de la autopista interestatal?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: C
  explanation: Según el manual, "Cuando se incorpora al tráfico, necesita un espacio
    de cuatro segundos. Eso les dará, tanto a usted como al vehículo delante del cual
    se incorpore, una distancia de seguimiento de dos segundos".
- id: 403
  category: defensive_driving
  question: ¿Qué debe hacer con su margen de espacio (space cushion) cuando el clima
    es malo o el pavimento está resbaladizo?
  choices:
    A: Mantenerlo exactamente en dos segundos
    B: Reducirlo a la mitad para ver mejor al vehículo de adelante
    C: Mantener una distancia de seguimiento de tres segundos
    D: Duplicar el tiempo de su margen de espacio
  answer: D
  explanation: El manual establece que siempre debe mantener un margen de espacio
    de al menos cuatro segundos entre usted y el vehículo de adelante, y "cuando el
    clima es malo o el pavimento está resbaladizo, debe duplicar ese tiempo".
- id: 404
  category: safe_driving_rules
  question: En una autopista interestatal con tres o más carriles que circulan en
    una dirección, ¿para qué se utiliza principalmente el carril del extremo izquierdo?
  choices:
    A: Salir de la autopista interestatal
    B: Entrar a la autopista interestatal
    C: Circulación normal
    D: Rebasar (adelantar)
  answer: D
  explanation: El manual explica que en una autopista interestatal con tres o más
    carriles, "El carril de la derecha se utiliza para entrar y salir. El carril central
    se utiliza a menudo como carril de 'circulación' y el carril del extremo izquierdo
    es para rebasar".
- id: 405
  category: defensive_driving
  question: ¿Qué debe hacer si alguien lo sigue demasiado de cerca (tailgated) y reducir
    la velocidad no anima al conductor a rebasarlo?
  choices:
    A: Tocar los frenos repetidamente
    B: Hacerse a un lado, detenerse y dejar que el conductor que lo sigue de cerca
      pase
    C: Aumentar la velocidad para incrementar la distancia
    D: Cambiar de carril sin señalizar
  answer: B
  explanation: Si alguien lo sigue demasiado de cerca, el manual aconseja reducir
    la velocidad y animar al conductor a rebasar. "Si esto falla, hágase a un lado,
    deténgase y deje pasar al conductor que lo sigue de cerca".
- id: 406
  category: defensive_driving
  question: ¿Cuál de los siguientes NO es uno de los tres elementos básicos de la
    gestión del espacio?
  choices:
    A: Control de velocidad
    B: Posición en el carril
    C: Distancia de frenado
    D: Comunicación
  answer: C
  explanation: 'Los tres elementos básicos de la gestión del espacio enumerados en
    el manual son: 1. Control de velocidad, 2. Posición en el carril y 3. Comunicación.'
- id: 407
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe verificar que se encuentra en el carril correcto
    para salir de la autopista interestatal?
  choices:
    A: Aproximadamente una milla antes de su salida
    B: 500 pies antes de su salida
    C: Dos millas antes de su salida
    D: Justo cuando vea la rampa de salida
  answer: A
  explanation: 'Al prepararse para salir, el manual establece: "Aproximadamente una
    milla antes de su salida, verifique que esté en el carril correcto para realizar
    la salida".'
- id: 408
  category: safe_driving_rules
  question: ¿Cuál es la acción más segura y legal a tomar si se pasa la salida prevista
    de la autopista interestatal?
  choices:
    A: Detenerse en el arcén (hombro) y retroceder con cuidado
    B: Dar una vuelta en U en la mediana de césped
    C: Continuar hasta la siguiente salida
    D: Detenerse en el carril derecho y esperar a que el tráfico se despeje
  answer: C
  explanation: 'El manual advierte explícitamente: "¡Si se pasa su salida, no se detenga;
    no retroceda!... Continúe hasta la siguiente salida, vuelva a entrar en la autopista
    interestatal y regrese a la salida que desea".'
- id: 409
  category: safe_driving_rules
  question: ¿Cuál es el lugar adecuado para reducir la velocidad al salir de una autopista
    interestatal?
  choices:
    A: En el carril de circulación de la derecha antes de la salida
    B: Completamente en el carril de desaceleración
    C: Una milla antes de la rampa de salida
    D: Mientras cambia de carril para salir
  answer: B
  explanation: 'El manual indica: "Nunca reduzca la velocidad en la propia autopista
    interestatal. Espere hasta estar completamente en el carril de desaceleración
    y luego reduzca su velocidad a la velocidad indicada para la rampa".'
- id: 410
  category: safe_driving_rules
  question: ¿Qué debe hacer para que su vehículo sea más visible cuando conduce por
    carreteras de grava polvorientas?
  choices:
    A: Encender las luces altas (high beam)
    B: Encender las luces de emergencia (hazard lights)
    C: Usar las luces bajas (low beam)
    D: Tocar la bocina periódicamente
  answer: C
  explanation: Durante los períodos secos en carreteras de grava polvorientas donde
    la visión se reduce, "se recomienda utilizar las luces bajas (low beam) para que
    su vehículo sea más visible para los demás..."
- id: 411
  category: defensive_driving
  question: ¿Por qué debe aumentar su distancia de seguimiento al conducir por caminos
    de tierra o grava?
  choices:
    A: Porque toma mucho más tiempo detenerse debido a la pérdida de tracción
    B: Porque sus frenos se sobrecalentarán más rápido
    C: Porque el vehículo se detendrá demasiado rápido
    D: Porque los caminos de tierra siempre son más estrechos que los caminos pavimentados
  answer: A
  explanation: El manual establece que en caminos de grava o tierra, "debe reducir
    su velocidad y aumentar su distancia de seguimiento, ya que tomará mucho más tiempo
    detenerse debido a la pérdida de tracción".
- id: 412
  category: defensive_driving
  question: ¿Cuál es el tipo de choque más frecuente en las carreteras interestatales?
  choices:
    A: Colisiones frontales
    B: Raspaduras laterales (Sideswipes)
    C: Colisiones por alcance (traseras)
    D: Volcamientos
  answer: C
  explanation: Según el manual, "Las colisiones por alcance son el tipo de choque
    más frecuente en las carreteras interestatales".
- id: 413
  category: safe_driving_rules
  question: Si debe incorporarse al tráfico de la interestatal desde una parada total
    en un carril de aceleración corto, ¿aproximadamente cuánta distancia necesitará
    para alcanzar la velocidad de los otros vehículos?
  choices:
    A: Unos 100 pies
    B: Aproximadamente una cuadra completa
    C: Aproximadamente media milla
    D: Aproximadamente la longitud de tres autos
  answer: B
  explanation: 'El manual señala que esta situación es peligrosa, indicando: "Para
    incorporarse al tráfico desde una parada total, necesitará aproximadamente una
    cuadra completa para alcanzar la velocidad de los otros vehículos en la carretera
    interestatal".'
- id: 414
  category: signs_and_signals
  question: ¿Cuánto tiempo debe señalizar su intención antes de realizar una salida
    de la interestatal?
  choices:
    A: Durante aproximadamente dos segundos
    B: Durante aproximadamente tres segundos
    C: Durante aproximadamente cuatro segundos
    D: Durante aproximadamente cinco segundos
  answer: D
  explanation: Al prepararse para salir, el manual instruye a los conductores a "Señalizar
    su intención durante aproximadamente cinco segundos y asegurarse de estar a la
    velocidad adecuada para abandonar el carril de tráfico...".
- id: 415
  category: safe_driving_rules
  question: ¿Qué debe hacer al conducir por caminos de grava durante períodos secos
    para mejorar la visibilidad?
  choices:
    A: Usar las luces altas (luces de carretera)
    B: Usar las luces bajas (luces de cruce)
    C: Encender las luces de emergencia (hazard lights)
    D: Tocar la bocina con frecuencia
  answer: B
  explanation: Durante los períodos secos, los caminos de grava pueden volverse extremadamente
    polvorientos, reduciendo la visión. El manual recomienda usar las luces bajas
    para que su vehículo sea más visible para los demás, reducir la velocidad y aumentar
    la distancia de seguimiento.
- id: 416
  category: defensive_driving
  question: 'Al conducir sobre rejillas abiertas de puentes o puentes de acero, usted
    debe:'
  choices:
    A: Acelerar para cruzar el puente rápidamente
    B: Mantener un agarre firme en el volante y aumentar su distancia de seguimiento
    C: Frenar bruscamente antes de entrar al puente
    D: Moverse al carril izquierdo para evitar la rejilla
  answer: B
  explanation: La tracción para frenar y maniobrar se reduce en las rejillas abiertas
    de los puentes o en los puentes de acero. Debido a esta reducción de la tracción,
    debe mantener un agarre firme en el volante y aumentar su distancia de seguimiento.
- id: 417
  category: safe_driving_rules
  question: 'Antes de llegar a la cima de una colina empinada en un camino rural,
    usted debe:'
  choices:
    A: Moverse al lado izquierdo de la carretera
    B: Mantener su velocidad y tocar la bocina
    C: Reducir la velocidad, moverse al lado derecho de la carretera y estar atento
      a los vehículos que vienen en sentido contrario
    D: Encender las luces altas para advertir al tráfico que viene en sentido contrario
  answer: C
  explanation: Las colinas y curvas en los caminos rurales suelen ser más empinadas
    y cerradas. Antes de llegar a la cima de una colina o entrar en una curva, reduzca
    la velocidad, muévase al lado derecho de la carretera y esté atento a los vehículos
    que vienen en sentido contrario.
- id: 418
  category: signs_and_signals
  question: 'Muchos cruces a nivel de carretera y ferrocarril en caminos rurales están
    marcados únicamente con:'
  choices:
    A: Luces rojas intermitentes y barreras de cruce
    B: Una señal de pare (STOP) y una señal de ceda el paso (YIELD)
    C: Una señal de advertencia y una señal de cruce de ferrocarril blanca en forma
      de X
    D: Una señal de diamante amarilla y un semáforo
  answer: C
  explanation: Muchos cruces a nivel de carretera y ferrocarril en caminos rurales
    están marcados únicamente con una señal de advertencia y una señal de cruce de
    ferrocarril blanca en forma de X, y normalmente no tienen luces ni barreras de
    cruce.
- id: 419
  category: defensive_driving
  question: ¿En qué momentos del día la fauna silvestre está más activa y es más difícil
    de ver?
  choices:
    A: Temprano en la tarde y tarde en la noche
    B: Al anochecer y al amanecer
    C: Medianoche y mediodía
    D: Media mañana y media tarde
  answer: B
  explanation: La fauna silvestre está más activa al anochecer y al amanecer. Este
    es también el momento en que a nuestros ojos les resulta más difícil adaptarse,
    ya que no está completamente oscuro ni completamente iluminado.
- id: 420
  category: sharing_the_road
  question: 'Si un animal doméstico, como una vaca o un caballo, deambula por la carretera,
    usted debe:'
  choices:
    A: Esquivar al animal lo más rápido posible
    B: Tocar la bocina y frenar de manera controlada
    C: Acelerar el motor ruidosamente para asustarlo
    D: Encender y apagar las luces altas repetidamente
  answer: B
  explanation: Si un animal doméstico deambula por la carretera, toque la bocina y
    frene de manera controlada. No asuste al animal ni lo esquive bruscamente, ya
    que esto podría hacer que entre en pánico.
- id: 421
  category: defensive_driving
  question: ¿Qué debe hacer si hay animales salvajes en la carretera?
  choices:
    A: Tocar la bocina y acelerar el motor
    B: Virar bruscamente hacia el tráfico en sentido contrario para evitarlos
    C: Reducir la velocidad o detenerse y pasar lo más lejos posible
    D: Acelerar para asustarlos y que salgan de la carretera
  answer: C
  explanation: Si hay animales salvajes en la carretera, debe reducir la velocidad
    o detenerse, no usar la bocina ni acelerar el motor, y pasar lo más lejos posible
    de los animales.
- id: 422
  category: defensive_driving
  question: ¿Por qué chocar contra un animal grande como un ciervo podría ser la alternativa
    más segura en comparación con virar bruscamente?
  choices:
    A: Virar bruscamente puede causar un choque más grave al enviarlo hacia el tráfico
      en sentido contrario o fuera de la calzada.
    B: Los animales generalmente se apartarán en el último segundo.
    C: Chocar contra el animal causa menos daños al vehículo que frenar bruscamente.
    D: Virar bruscamente es ilegal en zonas rurales.
  answer: A
  explanation: No vire bruscamente hacia el tráfico en sentido contrario ni fuera
    de la calzada para evitar chocar con el animal. Esto puede resultar en un choque
    más grave que si el vehículo colisionara con el animal. Lamentablemente, la alternativa
    más segura puede ser chocar contra el animal.
- id: 423
  category: defensive_driving
  question: ¿Durante qué meses están más activos los animales, lo que requiere precaución
    adicional por parte de los conductores?
  choices:
    A: De enero a marzo
    B: De abril a junio
    C: De julio a septiembre
    D: De octubre a diciembre
  answer: D
  explanation: Debe tener precaución al conducir al amanecer y al anochecer y entre
    los meses de octubre a diciembre, cuando los animales están más activos.
- id: 424
  category: defensive_driving
  question: Si una colisión con un animal es inevitable, ¿qué debe hacer en el momento
    del impacto?
  choices:
    A: Bloquear los frenos para detenerse lo más rápido posible
    B: Quitar el pie del freno para provocar una ligera elevación del vehículo
    C: Virar bruscamente hacia la derecha
    D: Agacharse debajo del volante
  answer: B
  explanation: Si un accidente es inevitable, frene con firmeza, incline el vehículo
    y quite el pie del freno al impactar. Soltar el freno provocará una ligera elevación
    del vehículo, lo que puede evitar que el animal suba hacia el parabrisas.
- id: 425
  category: signs_and_signals
  question: 'Un triángulo naranja y rojo fluorescente o reflectante que se muestra
    en la parte trasera de un vehículo indica:'
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo viaja a menos de 25 mph
    C: El vehículo es un autobús escolar
    D: El vehículo está averiado y no puede moverse
  answer: B
  explanation: Un triángulo naranja y rojo fluorescente o reflectante que se muestra
    en la parte trasera de vehículos tirados por animales, equipos agrícolas o equipos
    de construcción significa que el vehículo viaja a menos de 25 mph.
- id: 426
  category: sharing_the_road
  question: 'Cuando un tractor agrícola necesita hacer un giro a la derecha, el operador
    puede:'
  choices:
    A: Abrirse hacia la izquierda y luego girar a la derecha
    B: Señalizar usando una luz amarilla intermitente
    C: Moverse al arcén derecho antes de girar
    D: Detenerse por completo y esperar a que pase el tráfico
  answer: A
  explanation: La maquinaria agrícola generalmente no tiene señales de giro y, para
    hacer un giro a la derecha, los operadores de maquinaria agrícola pueden abrirse
    hacia la izquierda y luego girar a la derecha.
- id: 427
  category: sharing_the_road
  question: ¿Cuál es el rango de velocidad normal para los vehículos de tracción animal?
  choices:
    A: De 1 a 4 millas por hora
    B: De 5 a 8 millas por hora
    C: De 10 a 15 millas por hora
    D: De 15 a 20 millas por hora
  answer: B
  explanation: Las velocidades normales para los vehículos de tracción animal oscilan
    entre 5 y 8 millas por hora.
- id: 428
  category: sharing_the_road
  question: 'Al acercarse o pasar a un jinete a caballo, NO debe:'
  choices:
    A: Conducir a una velocidad razonable
    B: Mantener una distancia razonable del caballo
    C: Tocar la bocina o acelerar el motor ruidosamente
    D: Pasar con precaución por la izquierda
  answer: C
  explanation: No toque la bocina ni acelere el motor ruidosamente al acercarse o
    pasar a un caballo. Podría asustar al caballo y causar un choque.
- id: 429
  category: sharing_the_road
  question: 'Si conduce un vehículo de movimiento lento y hace que los vehículos detrás
    de usted reduzcan la velocidad significativamente, debe:'
  choices:
    A: Aumentar la velocidad para igualar el flujo del tráfico
    B: Encender las luces de emergencia y permanecer en su carril
    C: Hacerse a un lado de la carretera cuando sea seguro hacerlo y dejar pasar a
      los demás
    D: Hacer señas a los vehículos de atrás para que pasen por la izquierda
  answer: C
  explanation: Si conduce un vehículo de movimiento lento y tiene que conducir tan
    despacio que otros vehículos tienen que reducir la velocidad por detrás, hágase
    a un lado de la carretera cuando sea seguro hacerlo y deje pasar a los otros vehículos.
- id: 430
  category: vehicle_information
  question: ¿Cómo puede afectar el rendimiento de su vehículo o remolque el hecho
    de sobrecargarlo?
  choices:
    A: Mejora la tracción de los neumáticos en carreteras mojadas.
    B: Causa daños a los frenos y daña la suspensión.
    C: Aumenta la eficiencia de combustible de su vehículo.
    D: Hace que el volante vibre a altas velocidades.
  answer: B
  explanation: Según el manual, si un vehículo está sobrecargado, puede causar daños
    a los frenos, dificultando que se detenga o reduzca la velocidad, y puede dañar
    la suspensión.
- id: 431
  category: safe_driving_rules
  question: ¿Cuál es el uso correcto de los faros al conducir bajo un aguacero intenso
    o con niebla?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Luces de emergencia (intermitentes)
  answer: B
  explanation: El manual indica a los conductores que reduzcan la velocidad y enciendan
    las luces bajas cuando conduzcan bajo un aguacero intenso o con niebla.
- id: 432
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra con una niebla tan densa que perjudica
    gravemente su visión?
  choices:
    A: Avanzar lentamente por la carretera a una velocidad de 10 a 20 millas por hora.
    B: Encender las luces altas para atravesar la niebla.
    C: Salir de la carretera y detenerse en el lugar seguro más cercano.
    D: Seguir de cerca al vehículo de adelante para ver sus luces traseras.
  answer: C
  explanation: El manual establece que si la niebla es tan densa que perjudica su
    visión, no debe conducir en absoluto. Si debe conducir, debe reducir la velocidad
    y dirigirse al lugar más cercano para salir de la carretera y detenerse. Avanzar
    lentamente a 10 o 20 mph en la carretera pone en riesgo su vida.
- id: 433
  category: safe_driving_rules
  question: ¿A qué distancia debe atenuar las luces altas cuando se aproxima un vehículo
    en sentido contrario?
  choices:
    A: A una distancia aproximada de una cuadra
    B: A menos de 500 pies
    C: A menos de 1000 pies
    D: Solo cuando el otro conductor haga parpadear sus luces
  answer: A
  explanation: El manual aconseja atenuar las luces altas siempre que se encuentre
    a una distancia aproximada de una cuadra de un vehículo que viene en sentido contrario.
- id: 434
  category: defensive_driving
  question: ¿Qué debe hacer si un conductor que viene en sentido contrario no atenúa
    sus luces altas?
  choices:
    A: Mantener sus luces brillantes encendidas para desquitarse con el otro conductor.
    B: Mirar directamente a los faros que se aproximan para seguir al vehículo.
    C: Mirar hacia el lado derecho de la carretera para evitar ser deslumbrado.
    D: Apagar sus faros momentáneamente para avisar al conductor.
  answer: C
  explanation: Si un conductor no atenúa sus luces, el manual dice que debe mirar
    hacia el lado derecho de la carretera para evitar ser deslumbrado por sus faros,
    y advierte que no debe mantener las luces altas encendidas para "desquitarse"
    con él.
- id: 435
  category: safe_driving_rules
  question: 'Al conducir de noche en zonas rurales, debe aumentar su distancia de
    seguimiento a por lo menos:'
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: En el campo o en zonas más rurales por la noche, el manual establece
    que debe aumentar su distancia de seguimiento a por lo menos cuatro segundos.
- id: 436
  category: defensive_driving
  question: ¿Cuál de las siguientes opciones describe mejor una "condición cerrada"
    (closed condition) en la calzada?
  choices:
    A: Un espacio amplio y abierto sin restricciones alrededor de su automóvil.
    B: Una situación en la que el espacio no está disponible para su trayectoria de
      viaje o su visión está restringida.
    C: Una carretera que ha sido cerrada por obras de construcción.
    D: Una transición de una carretera rural a una calle urbana.
  answer: B
  explanation: El manual define una zona cerrada como aquella que no está disponible
    para la trayectoria de su automóvil, donde hay una restricción a la visión del
    conductor o donde el espacio no está disponible, lo que suele ocurrir en tráfico
    moderado a intenso.
- id: 437
  category: defensive_driving
  question: ¿Por qué el entorno de conducción urbana suele ser más difícil para los
    conductores novatos?
  choices:
    A: Hay menos dispositivos de control de tráfico.
    B: Los límites de velocidad son generalmente más altos que en las autopistas interestatales.
    C: Hay más estímulos que clasificar y ante los cuales reaccionar.
    D: Hay mayormente condiciones abiertas sin restricciones.
  answer: C
  explanation: Según el manual, el entorno de conducción urbana es más difícil para
    el conductor novato porque hay más estímulos que deben clasificarse y ante los
    cuales se debe reaccionar.
- id: 438
  category: driver_responsibility
  question: Al planificar un viaje en el que solo una persona conducirá, ¿cuál es
    el límite de conducción diario recomendado?
  choices:
    A: De 4 a 6 horas
    B: De 6 a 8 horas
    C: De 8 a 10 horas
    D: De 10 a 12 horas
  answer: B
  explanation: El manual establece que si una sola persona se encargará de toda la
    conducción, se debe considerar como límite de 6 a 8 horas de conducción en un
    solo día.
- id: 439
  category: driver_responsibility
  question: 'Si dos o más personas comparten las tareas de conducción en un viaje
    por carretera, el tiempo total de conducción en un día no debe exceder:'
  choices:
    A: De 8 a 9 horas
    B: De 10 a 11 horas
    C: De 12 a 14 horas
    D: De 15 a 16 horas
  answer: B
  explanation: Cuando dos o más personas pueden compartir la conducción, el manual
    especifica que el tiempo total de conducción no debe exceder las 10 a 11 horas.
- id: 440
  category: safe_driving_rules
  question: Al viajar por las autopistas principales, ¿con qué frecuencia debe planear
    tomar un descanso de 10 a 15 minutos?
  choices:
    A: Cada hora
    B: Cada 2 a 3 horas
    C: Cada 4 a 5 horas
    D: Solo cuando se detenga para comer
  answer: B
  explanation: El manual recomienda tomar descansos de 10 a 15 minutos cada 2 a 3
    horas cuando se conduce por autopistas principales.
- id: 441
  category: safe_driving_rules
  question: ¿Por qué debe evitar el uso de lentes de color o gafas de sol al conducir
    de noche?
  choices:
    A: Reflejan la luz hacia los ojos de los conductores que vienen en sentido contrario.
    B: Hacen que sus ojos se ajusten más lentamente y reducen su visión.
    C: Aumentan el resplandor de las luces de la calle.
    D: Magnifican el brillo de las luces altas que vienen en sentido contrario.
  answer: B
  explanation: El manual advierte no usar gafas de sol o lentes de color por la noche
    porque los lentes de color hacen que sus ojos se ajusten aún más lentamente y
    pueden reducir su visión.
- id: 442
  category: vehicle_information
  question: ¿Qué debe hacer al acercarse a su vehículo estacionado antes de arrancar
    el motor?
  choices:
    A: Revisar la presión de los neumáticos con un manómetro.
    B: Mirar delante, debajo y detrás del vehículo para ver si hay objetos en su camino.
    C: Encender los faros para revisar la batería.
    D: Tocar la bocina para advertir a los peatones.
  answer: B
  explanation: Antes de arrancar el motor, el manual aconseja que al acercarse a su
    vehículo estacionado, debe mirar delante, debajo y detrás, buscando cualquier
    objeto en su trayectoria de viaje.
- id: 443
  category: safe_driving_rules
  question: ¿Por qué debe usar las luces bajas en lugar de las luces altas en condiciones
    de niebla, nieve o lluvia intensa?
  choices:
    A: Las luces bajas son más brillantes y atraviesan mejor la precipitación.
    B: Las luces altas se reflejarán, causando resplandor y reduciendo la visibilidad.
    C: Las luces altas agotan la batería del vehículo más rápido en climas fríos.
    D: Las luces bajas activan automáticamente las luces antiniebla del vehículo.
  answer: B
  explanation: El manual indica usar las luces bajas en niebla, nieve o lluvia intensa
    porque la luz de las luces altas se reflejará, causando resplandor y dificultando
    la visión hacia adelante.
- id: 444
  category: driver_responsibility
  question: ¿Cuáles son los tres tipos principales de distracción del conductor?
  choices:
    A: Visual, manual y cognitiva
    B: Física, mental y emocional
    C: Interna, externa y tecnológica
    D: Visual, auditiva y manual
  answer: A
  explanation: El manual identifica los tres tipos principales de distracción como
    Visual (quitar la vista de la carretera), Manual (quitar las manos del volante)
    y Cognitiva (quitar la mente de lo que está haciendo).
- id: 445
  category: driver_responsibility
  question: ¿Por qué se considera que enviar mensajes de texto es la más alarmante
    de todas las distracciones al conducir?
  choices:
    A: Toma la mayor cantidad de tiempo para completarse.
    B: Involucra distracciones visuales, manuales y cognitivas simultáneamente.
    C: Es la distracción más común entre los conductores mayores.
    D: Requiere el uso de ambas manos para escribir.
  answer: B
  explanation: Si bien todas las distracciones pueden poner en peligro la seguridad
    del conductor, enviar mensajes de texto es la más alarmante porque involucra los
    tres tipos de distracción (visual, manual y cognitiva).
- id: 446
  category: driver_responsibility
  question: ¿Por qué es probable que las leyes que prohíben solo el uso de teléfonos
    celulares portátiles sean ineficaces para reducir completamente los riesgos de
    choque?
  choices:
    A: Los conductores seguirán usando sus manos para marcar números.
    B: Los dispositivos de manos libres bloquean la audición del conductor.
    C: La distracción cognitiva aún existe con los teléfonos de manos libres.
    D: Los dispositivos de manos libres causan distracciones visuales graves.
  answer: C
  explanation: El uso de un dispositivo de manos libres puede mantener sus manos en
    el volante, pero no necesariamente su mente en la conducción. La distracción cognitiva
    aún existe con un teléfono de manos libres.
- id: 447
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un paso recomendado a seguir antes de arrancar
    el motor?
  choices:
    A: Revisar sus mensajes de texto por última vez.
    B: Ajustar los cojines del asiento y los espejos.
    C: Encender la radio a un volumen cómodo.
    D: Bajar las ventanillas para escuchar el tráfico exterior.
  answer: B
  explanation: Antes de arrancar el motor, siempre debe ajustar los cojines del asiento
    y los espejos, verificar que los ocupantes lleven puestos los cinturones de seguridad
    y eliminar las distracciones.
- id: 448
  category: safe_driving_rules
  question: Aunque los adolescentes suelen creer que el alcohol y los mensajes de
    texto son las principales causas de un comportamiento inseguro, ¿cuáles son los
    factores principales reales en los choques fatales que involucran a adolescentes?
  choices:
    A: Conducir con somnolencia y la presión de grupo
    B: Velocidades inseguras y el no uso de cinturones de seguridad
    C: Conducir de noche y el mal tiempo
    D: Fallas en el equipo y el diseño de la carretera
  answer: B
  explanation: Según el manual, aunque los adolescentes mencionaron el alcohol y los
    mensajes de texto como los factores más altos, los factores principales reales
    en los choques fatales que involucran a adolescentes son las velocidades inseguras
    y el no uso de cinturones de seguridad.
- id: 449
  category: safe_driving_rules
  question: ¿Cuándo ocurren la mayoría de los accidentes de vehículos motorizados
    de adolescentes?
  choices:
    A: Durante la hora pico de la mañana
    B: En días laborables después de la escuela
    C: Los fines de semana
    D: Durante las vacaciones escolares
  answer: C
  explanation: La mayoría de las muertes de adolescentes debido a un accidente de
    vehículo motorizado ocurren los fines de semana, ya que el 53% de todos los accidentes
    de adolescentes ocurren durante el fin de semana.
- id: 450
  category: safe_driving_rules
  question: ¿Cómo afecta la presencia de pasajeros adolescentes el riesgo de que un
    conductor adolescente muera o resulte herido en un accidente?
  choices:
    A: El riesgo disminuye porque los pasajeros pueden actuar como copilotos.
    B: El riesgo sigue siendo el mismo independientemente de los pasajeros.
    C: El riesgo aumenta exponencialmente con cada pasajero adicional.
    D: El riesgo solo aumenta si los pasajeros no llevan puestos los cinturones de
      seguridad.
  answer: C
  explanation: El riesgo de que un conductor adolescente muera o resulte herido en
    accidentes aumenta si hay un pasajero adolescente involucrado, y el riesgo aumenta
    exponencialmente con cada pasajero adicional.
- id: 451
  category: safe_driving_rules
  question: ¿Cómo se compara la tasa de mortalidad de los conductores de 16 a 19 años
    con la de los conductores de 25 a 29 años?
  choices:
    A: Es la mitad.
    B: Es aproximadamente la misma.
    C: Es el doble.
    D: Es cuatro veces mayor.
  answer: D
  explanation: Hoy en día, los conductores de 16 a 19 años tienen una tasa de mortalidad
    cuatro veces mayor que la de los conductores de 25 a 29 años.
- id: 452
  category: defensive_driving
  question: ¿Cuál de los siguientes NO es uno de los cuatro factores principales que
    contribuyen a la mayoría de las colisiones en los EE. UU.?
  choices:
    A: Falla del equipo
    B: Diseño de la carretera
    C: Lugar de fabricación del vehículo
    D: Comportamiento del conductor
  answer: C
  explanation: Los cuatro factores que contribuyen a la mayoría de las colisiones
    son la falla del equipo, el diseño de la carretera, el mantenimiento deficiente
    de la carretera y el comportamiento del conductor.
- id: 453
  category: defensive_driving
  question: ¿En qué porcentaje de los accidentes de vehículos motorizados el comportamiento
    del conductor es un factor contribuyente?
  choices:
    A: 50%
    B: 75%
    C: 85%
    D: 95%
  answer: D
  explanation: En el 95% de los accidentes de vehículos motorizados hubo algún factor
    de comportamiento del conductor combinado con uno de los otros tres factores que
    causó el accidente.
- id: 454
  category: vehicle_information
  question: Si su vehículo tiene un sistema de frenos manuales (de disco), ¿qué debe
    hacer para detenerse rápidamente en una emergencia?
  choices:
    A: Frenar con fuerza y mantener el pedal presionado firmemente.
    B: Bombear el freno presionando con fuerza, soltando cuando patine y presionando
      de nuevo.
    C: Tocar ligeramente los frenos mientras gira el volante bruscamente.
    D: Poner el vehículo en punto muerto (neutral) y dejar que se detenga por inercia.
  answer: B
  explanation: Si tiene un sistema de frenos manuales, no frene con fuerza y mantenga
    presionado, ya que esto bloquea las ruedas. En su lugar, bombee el freno, presione
    con fuerza, suelte rápidamente cuando el automóvil comience a patinar y vuelva
    a presionar rápidamente.
- id: 455
  category: vehicle_information
  question: ¿Cuál de las siguientes es una afirmación verdadera sobre los Sistemas
    de Frenos Antibloqueo (ABS)?
  choices:
    A: El ABS detiene el automóvil mucho más rápido que los frenos manuales.
    B: El ABS le permite mantener el control y dirigir el automóvil hacia un lugar
      seguro.
    C: Debe bombear los frenos manualmente si su automóvil tiene ABS.
    D: El ABS bloquea las ruedas para evitar que el automóvil patine.
  answer: B
  explanation: El ABS le ayuda a mantener el control y detiene el automóvil en línea
    recta. No detiene el automóvil más rápido, sino que le permite concentrarse en
    dirigir el vehículo hacia un lugar seguro.
- id: 456
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si surge una situación con un niño o una
    mascota mientras conduce?
  choices:
    A: Manejar la situación rápidamente mientras mantiene una mano en el volante.
    B: Pedir a otro pasajero que tome el volante mientras usted se encarga.
    C: Detenerse en un lugar seguro antes de manejar la situación.
    D: Ignorar la situación hasta llegar a su destino final.
  answer: C
  explanation: El manual sugiere que si surge una situación con un niño, debe detenerse
    en un lugar seguro antes de manejarla. Las mascotas también deben estar debidamente
    aseguradas antes de comenzar.
- id: 457
  category: safe_driving_rules
  question: ¿Qué tan probable es que los adolescentes tengan un accidente en su primer
    mes de conducir solos sin la supervisión de los padres?
  choices:
    A: Un 10% más probable
    B: Un 25% más probable
    C: Un 50% más probable
    D: Un 75% más probable
  answer: C
  explanation: Los adolescentes tienen un 50% más de probabilidades de tener un accidente
    en el primer mes de conducir solos sin la supervisión de los padres.
- id: 458
  category: vehicle_information
  question: ¿Cómo puede determinar si su vehículo está equipado con un Sistema de
    Frenos Antibloqueo (ABS) mirando el panel de instrumentos?
  choices:
    A: Sonará una alarma continua cuando el automóvil arranque.
    B: La luz del ABS se iluminará y luego se atenuará al arrancar el vehículo.
    C: El pedal del freno vibrará cuando gire la llave de encendido.
    D: Una luz verde parpadeará continuamente mientras conduce.
  answer: B
  explanation: Puede determinar si tiene ABS revisando su panel de instrumentos. Cuando
    arranque su vehículo, la luz del ABS se iluminará y luego se atenuará.
- id: 459
  category: vehicle_information
  question: ¿Cuál es el beneficio principal de un Sistema de Frenos Antibloqueo (ABS)?
  choices:
    A: Detiene el automóvil mucho más rápido que los frenos estándar.
    B: Le permite concentrarse en dirigir el automóvil hacia un lugar seguro.
    C: Dirige automáticamente el automóvil lejos de los obstáculos.
    D: Evita que el vehículo vuelque.
  answer: B
  explanation: Según el manual, el ABS no detiene el automóvil más rápido. Le permite
    detenerlo donde desee al permitirle concentrarse en dirigir el vehículo hacia
    un lugar seguro.
- id: 460
  category: vehicle_information
  question: ¿Cómo puede saber si el Sistema de Frenos Antibloqueo (ABS) de su vehículo
    no funciona correctamente?
  choices:
    A: La luz indicadora del ABS permanece encendida después de arrancar el vehículo.
    B: La luz indicadora del ABS se ilumina y luego se atenúa.
    C: El pedal del freno se siente inusualmente blando.
    D: El volante vibra al frenar.
  answer: A
  explanation: Al arrancar su vehículo, la luz del ABS se iluminará y luego se atenuará.
    Si la luz permanece encendida, el ABS no está funcionando correctamente.
- id: 461
  category: defensive_driving
  question: Si un choque frontal parece probable y debe salirse de la carretera, ¿qué
    debe hacer?
  choices:
    A: Cruzar al carril de tráfico en sentido contrario.
    B: Bloquear los frenos y derrapar fuera de la carretera.
    C: Elegir chocar contra algo duro para detener el vehículo rápidamente.
    D: Elegir chocar contra algo que ceda, como maleza o arbustos.
  answer: D
  explanation: Si un choque parece probable, salga de la carretera y elija chocar
    contra algo que ceda (como maleza o arbustos) en lugar de algo duro.
- id: 462
  category: defensive_driving
  question: ¿Qué debe hacer si ve un automóvil que viene hacia usted en su carril
    y un choque es probable?
  choices:
    A: Girar hacia el carril izquierdo para evitarlo.
    B: Girar fuera de la carretera hacia el arcén derecho o la cuneta.
    C: Bloquear las ruedas frenando lo más fuerte posible.
    D: Acelerar para pasarlos rápidamente.
  answer: B
  explanation: Si el otro conductor continúa acercándose y un choque es probable,
    gire fuera de la carretera hacia el arcén derecho o la cuneta. No conduzca hacia
    el carril izquierdo.
- id: 463
  category: sharing_the_road
  question: Si otro vehículo intenta adelantarlo pero no puede completar la maniobra
    debido al tráfico en sentido contrario, ¿cómo puede ayudar?
  choices:
    A: Acelerar para evitar que lo adelanten.
    B: Moverse al carril izquierdo para bloquear el tráfico en sentido contrario.
    C: Reducir la velocidad de su vehículo y moverse lo más a la derecha que pueda
      de forma segura.
    D: Tocar la bocina y mantener su velocidad y posición actuales.
  answer: C
  explanation: Si el vehículo que intenta adelantar continúa haciéndolo, usted puede
    ayudar reduciendo la velocidad de su vehículo y moviéndose lo más a la derecha
    que pueda de forma segura.
- id: 464
  category: defensive_driving
  question: Si está a punto de ser golpeado por detrás, ¿cuál es una acción que debe
    tomar para protegerse?
  choices:
    A: Soltar el pedal del freno por completo.
    B: Inclinarse hacia adelante hacia el volante.
    C: Presionar la parte posterior de su cabeza firmemente contra el reposacabezas.
    D: Lanzarse sobre el asiento del pasajero.
  answer: C
  explanation: Si está a punto de ser golpeado por detrás, debe presionar la parte
    posterior de su cabeza firmemente contra el reposacabezas y apoyarse firmemente
    entre el volante y el respaldo del asiento.
- id: 465
  category: defensive_driving
  question: ¿Cómo debe protegerse si está a punto de ser golpeado por delante y NO
    lleva puesto el cinturón de hombro?
  choices:
    A: Usar sus brazos y manos para protegerse la cara.
    B: Lanzarse sobre el asiento para evitar golpearse contra el volante o el parabrisas.
    C: Apoyarse firmemente contra el reposacabezas.
    D: Sujetar firmemente el volante.
  answer: B
  explanation: Si no está usando el cinturón de hombro, láncese sobre el asiento para
    evitar golpearse contra el volante o el parabrisas.
- id: 466
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones sobre los choques por vuelco es verdadera?
  choices:
    A: Es menos probable que resulten en lesiones graves que otros choques.
    B: Una de cada tres muertes de ocupantes de vehículos de pasajeros ocurre en vuelcos.
    C: Ocurren principalmente durante condiciones climáticas extremas.
    D: Los vehículos de pasajeros tienen más probabilidades de volcar que los SUV.
  answer: B
  explanation: Aunque solo uno de cada cuarenta vehículos involucrados en un choque
    reportado por la policía ha volcado, una de cada tres muertes de ocupantes de
    vehículos de pasajeros ocurre en vuelcos.
- id: 467
  category: vehicle_information
  question: ¿Por qué los choques por vuelco son más comunes en los vehículos utilitarios
    deportivos (SUV), furgonetas y camionetas que en los vehículos de pasajeros?
  choices:
    A: Tienen un centro de gravedad más alto, lo que los hace pesados en la parte
      superior.
    B: Generalmente se conducen a velocidades más altas.
    C: Carecen de programas electrónicos de estabilidad.
    D: Tienen neumáticos más pequeños que pierden tracción fácilmente.
  answer: A
  explanation: Los choques por vuelco son más comunes en los SUV, furgonetas, camionetas
    y camiones pequeños que en los vehículos de pasajeros debido a sus centros de
    gravedad más altos, lo que los hace pesados en la parte superior y más propensos
    a volcarse.
- id: 468
  category: defensive_driving
  question: ¿Qué debe hacer para evitar un vuelco si su vehículo sale accidentalmente
    de la superficie pavimentada de la carretera?
  choices:
    A: Girar el volante bruscamente para volver al pavimento.
    B: Frenar fuerte y bloquear las ruedas.
    C: Reducir la velocidad gradualmente y no girar el volante bruscamente.
    D: Acelerar para mantener el control sobre la superficie blanda.
  answer: C
  explanation: Si su vehículo sale de la superficie pavimentada de la carretera, reduzca
    la velocidad gradualmente, pero no gire el volante bruscamente para que el vehículo
    vuelva al pavimento.
- id: 469
  category: defensive_driving
  question: ¿Cuál es el primer paso que debe tomar para salir de un derrape?
  choices:
    A: Bombear los frenos rápidamente.
    B: Quitar el pie del pedal del acelerador.
    C: Girar el volante bruscamente en la dirección opuesta al derrape.
    D: Cambiar a una marcha más baja.
  answer: B
  explanation: Para salir de un derrape, el primer paso es quitar el pie del pedal
    del acelerador.
- id: 470
  category: defensive_driving
  question: Si la parte trasera de su automóvil derrapa hacia la derecha, ¿hacia dónde
    debe girar el volante?
  choices:
    A: Gire las ruedas delanteras hacia la izquierda.
    B: Mantenga el volante perfectamente recto.
    C: Gire las ruedas delanteras hacia la derecha.
    D: Aplique el freno de estacionamiento y gire a la izquierda.
  answer: C
  explanation: Gire las ruedas delanteras solo lo suficiente para que sigan yendo
    recto por la carretera. Si la parte trasera de su automóvil derrapa hacia la derecha,
    gire las ruedas delanteras hacia la derecha.
- id: 471
  category: defensive_driving
  question: ¿Qué debe hacer si nota que su vehículo está hidroplaneando (hydroplaning)?
  choices:
    A: Frenar repentinamente para recuperar la tracción.
    B: Girar el volante bruscamente hacia la derecha.
    C: Levantar el pie del acelerador gradualmente hasta que el auto disminuya la
      velocidad y pueda sentir la carretera de nuevo.
    D: Acelerar ligeramente para atravesar el agua.
  answer: C
  explanation: Si se encuentra hidroplaneando, no frene ni gire bruscamente. Levante
    el pie del acelerador gradualmente hasta que el vehículo disminuya la velocidad
    y pueda sentir el contacto con la carretera nuevamente.
- id: 472
  category: vehicle_information
  question: ¿Cómo ayuda el Programa de Estabilidad Electrónica (ESP) a un conductor
    a mantener el control del vehículo?
  choices:
    A: Dirige automáticamente el vehículo de regreso al pavimento.
    B: Aplica de forma selectiva cualquiera de los frenos del vehículo para reducir
      la posibilidad de un derrape.
    C: Infla los airbags laterales antes de que ocurra un vuelco.
    D: Cambia el vehículo a una marcha más baja durante un derrape.
  answer: B
  explanation: Cuando el ESP detecta problemas de tracción, aplica de forma selectiva
    cualquiera de los frenos del vehículo para reducir la posibilidad de un derrape
    y ayuda al conductor a mantener el control y la estabilidad del vehículo.
- id: 473
  category: defensive_driving
  question: ¿En qué situación podría necesitar acelerar rápidamente para evitar un
    choque?
  choices:
    A: Cuando un vehículo que viene en sentido contrario está en su carril.
    B: Cuando está hidroplaneando en una carretera mojada.
    C: Cuando otro vehículo está a punto de golpearlo por un lado o por detrás.
    D: Cuando se aproxima a una curva cerrada demasiado rápido.
  answer: C
  explanation: A veces puede ser necesario acelerar rápidamente para evitar un choque.
    Este puede ser el caso cuando otro vehículo está a punto de golpearlo por un lado
    o por detrás.
- id: 474
  category: safe_driving_rules
  question: ¿Qué debe hacer si sus ruedas se salen del borde de la carretera y el
    acotamiento (shoulder) es mucho más bajo que el pavimento?
  choices:
    A: Girar inmediatamente el volante de forma brusca para volver a la carretera.
    B: Frenar de golpe y detenerse en el acotamiento.
    C: Reducir la velocidad a unas 10 mph, observar el tráfico y girar las ruedas
      bruscamente hacia el pavimento.
    D: Acelerar para igualar la velocidad del tráfico antes de incorporarse de nuevo.
  answer: C
  explanation: Si el acotamiento es mucho más bajo que el pavimento, debe reducir
    la velocidad a una marcha muy lenta (10 mph), observar el tráfico que viene en
    ambas direcciones y girar las ruedas bruscamente hacia el pavimento.
- id: 475
  category: defensive_driving
  question: Si su vehículo se apaga en una vía de tren y se aproxima un tren, ¿en
    qué dirección debe caminar después de salir del vehículo?
  choices:
    A: Lejos de las vías en la misma dirección en la que viaja el tren.
    B: A lo largo de las vías en dirección al tren que se aproxima.
    C: Directamente lejos de las vías en un ángulo de 90 grados.
    D: A lo largo de las vías alejándose del tren que se aproxima.
  answer: B
  explanation: Debe salir usted y todos los pasajeros y caminar rápidamente a lo largo
    de las vías en dirección al tren que se aproxima, para que no lo golpeen los escombros
    cuando su vehículo sea impactado.
- id: 476
  category: safe_driving_rules
  question: ¿Cuál es la regla más importante que debe recordar si experimenta un reventón
    de neumático?
  choices:
    A: Frenar de golpe inmediatamente para detener el vehículo.
    B: Girar bruscamente hacia el acotamiento de la carretera.
    C: Acelerar ligeramente para mantener el control del vehículo.
    D: No entrar en pánico y no frenar de golpe.
  answer: D
  explanation: 'El manual establece que la regla más importante durante un reventón
    de neumático es: no entrar en pánico y no frenar de golpe.'
- id: 477
  category: vehicle_information
  question: Si el pedal del acelerador se queda atascado mientras conduce, ¿cuál es
    el primer paso que debe tomar?
  choices:
    A: Apagar el motor inmediatamente.
    B: Poner la palanca de cambios en neutral.
    C: Frenar de golpe lo más fuerte posible.
    D: Agacharse con la mano para tirar del pedal hacia arriba.
  answer: B
  explanation: Si el pedal del acelerador se atasca, debe mantener la vista en la
    carretera y, primero, poner la palanca de cambios en neutral.
- id: 478
  category: vehicle_information
  question: ¿Qué debe hacer si sus frenos fallan mientras conduce?
  choices:
    A: Poner el freno de estacionamiento de forma repentina.
    B: Cambiar a neutral y aplicar gradualmente el freno de mano.
    C: Apagar el motor inmediatamente para detener el auto.
    D: Bombear el pedal del acelerador para generar presión de líquido de frenos.
  answer: B
  explanation: Si los frenos fallan, debe cambiar a neutral y aplicar gradualmente
    el freno de mano hasta que el vehículo se detenga. No debe poner el freno de estacionamiento
    de forma repentina, ya que podría perder el control.
- id: 479
  category: vehicle_information
  question: ¿Cuáles son las señales de advertencia de que podría estar experimentando
    la pérdida de una rueda?
  choices:
    A: Un chirrido agudo y vibraciones en el volante.
    B: Vapor saliendo de debajo del capó.
    C: Un ruido de golpeteo y/o que el vehículo tire hacia un lado.
    D: Olor a goma quemada y aceleración repentina.
  answer: C
  explanation: Las señales de advertencia de la pérdida de una rueda son un ruido
    de golpeteo y/o que el vehículo tire hacia un lado.
- id: 480
  category: vehicle_information
  question: Si comienza a salir vapor de debajo del capó de su vehículo, ¿qué NO debe
    hacer?
  choices:
    A: Detenerse a un lado de la carretera.
    B: Apagar el motor.
    C: Esperar a que el motor se enfríe.
    D: Abrir el tapón del radiador inmediatamente.
  answer: D
  explanation: 'Si su sistema de enfriamiento está hirviendo y sale vapor de debajo
    del capó, debe detenerse a un lado, apagar el motor y esperar a que se enfríe.
    El manual establece explícitamente: ''No abra el tapón del radiador''.'
- id: 481
  category: safe_driving_rules
  question: ¿Cuál de los siguientes NUNCA debe usarse para apagar un incendio de gasolina,
    aceite o eléctrico en un vehículo?
  choices:
    A: Tierra
    B: Agua
    C: Arena
    D: Un extintor de incendios químico
  answer: B
  explanation: Al combatir un incendio pequeño en un vehículo, puede usar un extintor
    de incendios químico, tierra, lodo, arena o ropa. Sin embargo, "no debe usar agua
    en un incendio de gasolina, aceite o eléctrico".
- id: 482
  category: vehicle_information
  question: Al pasar corriente a un automóvil con la batería descargada, ¿dónde debe
    conectar el cable negativo de la batería con carga?
  choices:
    A: Al borne positivo de la batería descargada.
    B: Al borne negativo de la batería descargada o al bloque del motor o bastidor.
    C: Al borne positivo de la batería con carga.
    D: Al tapón del radiador del vehículo descargado.
  answer: B
  explanation: Debe conectar el borne negativo de la batería con carga al borne negativo
    de la batería descargada o al bloque del motor o bastidor.
- id: 483
  category: safe_driving_rules
  question: Si su vehículo se avería y usted se encuentra fuera de la carretera de
    forma segura, ¿cómo puede indicar a los oficiales de la ley o a los operadores
    de grúas que necesita ayuda?
  choices:
    A: Pararse en la calzada y hacer señas a los vehículos que pasan.
    B: Atar un paño blanco a la antena del radio o colgarlo por una ventana.
    C: Caminar por la interestatal para encontrar la salida más cercana.
    D: Apagar todas las luces para que la batería no se agote.
  answer: B
  explanation: Para pedir ayuda durante una avería, debe levantar el capó y atar un
    paño blanco a la antena del radio o colgarlo por una ventana. No debe intentar
    hacer señas a otros vehículos.
- id: 484
  category: alcohol_drugs_health
  question: ¿Cuáles son los primeros síntomas de la intoxicación por monóxido de carbono?
  choices:
    A: Bostezos, mareos y malestar estomacal.
    B: Tos, estornudos y ojos llorosos.
    C: Latidos cardíacos rápidos y dificultad para respirar.
    D: Visión borrosa y calambres musculares.
  answer: A
  explanation: Los primeros síntomas de la intoxicación por monóxido de carbono incluyen
    bostezos, mareos y malestar estomacal.
- id: 485
  category: safe_driving_rules
  question: Según el manual, ¿cuánta agua torrencial se necesita para arrastrar a
    la mayoría de los vehículos?
  choices:
    A: 6 pulgadas
    B: 1 pie
    C: 2 pies
    D: 3 pies
  answer: C
  explanation: El manual establece que 6 pulgadas de agua llegarán a la parte inferior
    de la mayoría de los automóviles de pasajeros, pero 2 pies de agua torrencial
    pueden arrastrar a la mayoría de los vehículos.
- id: 486
  category: defensive_driving
  question: Si su vehículo cae al agua, ¿aproximadamente cuánto tiempo flotará en
    la superficie antes de hundirse?
  choices:
    A: De 10 a 20 segundos
    B: De 30 a 60 segundos
    C: De 2 a 3 minutos
    D: De 5 a 10 minutos
  answer: B
  explanation: Si su vehículo cae al agua, solo flotará en la superficie de 30 a 60
    segundos, por lo que debe hacer todo lo posible para salir de inmediato.
- id: 487
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si su vehículo queda sumergido en el
    agua?
  choices:
    A: Esperar a que el automóvil se llene completamente de agua para que la presión
      se iguale.
    B: Llamar al 911 desde su teléfono celular.
    C: Desabrocharse el cinturón de seguridad y bajar la ventanilla.
    D: Romper el parabrisas a patadas.
  answer: C
  explanation: Si su vehículo cae al agua, debe desabrocharse inmediatamente el cinturón
    de seguridad y bajar la ventanilla. No se quede esperando a que el automóvil se
    llene de agua.
- id: 488
  category: vehicle_information
  question: Si experimenta una pérdida de tracción en un vehículo equipado con un
    Programa Electrónico de Estabilidad (ESP), ¿cómo debe maniobrar el volante?
  choices:
    A: Girar bruscamente en la dirección opuesta al derrape.
    B: Dirigir el vehículo hacia la dirección a la que está mirando y evitar maniobras
      bruscas.
    C: Mantener el volante perfectamente recto y aplicar el freno de estacionamiento.
    D: Soltar el volante y permitir que el ESP maniobre por usted.
  answer: B
  explanation: En caso de pérdida de tracción con ESP, debe dirigir el vehículo hacia
    la dirección a la que está mirando y evitar maniobras bruscas.
- id: 489
  category: safe_driving_rules
  question: Si su vehículo queda sumergido en el agua, ¿aproximadamente cuánto tiempo
    tiene para escapar antes de que el automóvil se llene de agua?
  choices:
    A: De 10 a 15 segundos
    B: De 30 a 60 segundos
    C: De 1 a 2 minutos
    D: De 3 a 5 minutos
  answer: B
  explanation: Según el manual, tiene de 30 a 60 segundos para escapar de un vehículo
    sumergido, por lo que debe hacer todo lo posible para salir de inmediato.
- id: 490
  category: safe_driving_rules
  question: Al escapar de un vehículo que se hunde con niños en su interior, ¿a quién
    debe desabrochar primero?
  choices:
    A: Al niño más pequeño
    B: Al niño más pesado
    C: Al niño mayor
    D: A todos los niños al mismo tiempo
  answer: C
  explanation: El manual establece que si hay niños en el automóvil, debe desabrochar
    primero al niño mayor y luego a los más pequeños, ya que los niños mayores requieren
    menos ayuda.
- id: 491
  category: defensive_driving
  question: ¿Qué significa el acrónimo POGO al intentar escapar de un vehículo que
    se hunde?
  choices:
    A: Empujar para abrir, Salir (Push Open, Get Out)
    B: Detenerse a un lado, Ir afuera (Pull Over, Go Outside)
    C: Desabrochar el cinturón de seguridad, Abrir las ventanas, Salir (Pop the seat
      belt open, Open windows, Get Out)
    D: Prepararse, Abrir las puertas, Salir (Prepare, Open doors, Get Out)
  answer: C
  explanation: 'POGO significa: Desabrochar el cinturón de seguridad (Pop the seat
    belt open), Abrir las ventanas rompiéndolas o bajándolas (Open windows), y Salir
    (Get Out).'
- id: 492
  category: vehicle_information
  question: ¿Qué ventana NO debe intentar romper o patear si se encuentra atrapado
    en un vehículo que se hunde?
  choices:
    A: La ventana del lado del conductor
    B: La ventana del lado del pasajero
    C: La ventana lateral trasera
    D: El parabrisas
  answer: D
  explanation: 'El manual establece explícitamente: "No intente romper ni patear el
    parabrisas. Los parabrisas ahora están diseñados con vidrio que no se astilla".'
- id: 493
  category: driver_responsibility
  question: ¿Qué debe hacer si choca contra un vehículo desatendido y causa daños?
  choices:
    A: Esperar junto al vehículo hasta que regrese el dueño.
    B: Notificar a la policía y dejar una nota con su nombre, dirección y número de
      teléfono.
    C: Abandonar la escena de inmediato si no hay heridos.
    D: Llamar a su compañía de seguros y marcharse.
  answer: B
  explanation: Si daña un vehículo o propiedad desatendida, debe notificar a la policía,
    intentar localizar al propietario y dejar su nombre, dirección y número de teléfono
    en una nota.
- id: 494
  category: driver_responsibility
  question: Al brindar primeros auxilios en la escena de un choque, ¿qué debe hacer
    si una persona está sangrando por la parte inferior de la cara o la mandíbula?
  choices:
    A: Girarla hacia un lado.
    B: Hacer que se siente derecha.
    C: Darle muchos líquidos.
    D: Acostarla boca arriba.
  answer: A
  explanation: El manual aconseja que si una persona lesionada está sangrando por
    la parte inferior de la cara o la mandíbula, se debe girar hacia un lado.
- id: 495
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia debe mover a una persona lesionada en la escena
    de un choque?
  choices:
    A: Cuando pida que la muevan.
    B: Solo cuando haya un peligro inmediato que ponga en riesgo su vida.
    C: Para resguardarla de la lluvia o el frío.
    D: Para que pueda sentarse cómodamente en su vehículo.
  answer: B
  explanation: No debe mover a una persona lesionada a menos que haya un peligro inmediato
    que ponga en riesgo su vida, ya que el movimiento podría causar más lesiones.
- id: 496
  category: sharing_the_road
  question: ¿Qué debe hacer cuando se le acerque un vehículo de emergencia autorizado
    que utilice señales auditivas o visuales?
  choices:
    A: Aumentar la velocidad para quitarse del camino.
    B: Detenerse inmediatamente en su carril actual.
    C: Ceder el paso, conducir paralelamente al borde o acera derecha y permanecer
      detenido.
    D: Moverse al carril izquierdo y reducir la velocidad.
  answer: C
  explanation: Si se le acerca un vehículo de emergencia autorizado, siempre debe
    ceder el paso e inmediatamente conducir hasta una posición paralela al borde o
    acera derecha y permanecer detenido hasta que pase.
- id: 497
  category: alcohol_drugs_health
  question: ¿Aproximadamente cuánto tiempo tarda el alcohol en llegar al cerebro después
    de entrar en el estómago?
  choices:
    A: 5 minutos
    B: 20 minutos
    C: 45 minutos
    D: 1 hora
  answer: B
  explanation: Cuando el alcohol entra en el estómago, pasa al torrente sanguíneo
    y llega al cerebro en unos 20 minutos.
- id: 498
  category: alcohol_drugs_health
  question: ¿Cómo se elimina el alcohol del cuerpo?
  choices:
    A: A través del sudor y el ejercicio físico.
    B: A través de los riñones y los pulmones después de ser metabolizado por el hígado.
    C: Bebiendo grandes cantidades de agua y café solo.
    D: Tomando una ducha fría.
  answer: B
  explanation: El alcohol es metabolizado por el hígado y eliminado del cuerpo a través
    de los riñones y los pulmones. El café solo, el ejercicio o una ducha fría no
    le quitarán la borrachera.
- id: 499
  category: alcohol_drugs_health
  question: ¿Por qué es peligroso beber alcohol si se está expuesto a un frío extremo?
  choices:
    A: Eleva demasiado la temperatura interna del cuerpo.
    B: Transfiere la sangre de los órganos vitales a las extremidades, bajando la
      temperatura corporal.
    C: Hace que el corazón lata más rápido y trabaje en exceso.
    D: Evita que el cuerpo sude.
  answer: B
  explanation: El alcohol hace que la sangre se transfiera de los órganos vitales
    a las extremidades. Aunque esto crea una sensación de calor o "rubor", la temperatura
    interna del cuerpo en realidad está bajando, lo que lo hace peligroso ante la
    exposición excesiva al frío.
- id: 500
  category: alcohol_drugs_health
  question: Según el texto, ¿conducir bajo los efectos del alcohol es la principal
    causa individual de muerte en qué grupo de edad?
  choices:
    A: 16 a 24 años
    B: 25 a 34 años
    C: 35 a 50 años
    D: 50 años o más
  answer: A
  explanation: El manual establece que conducir bajo los efectos del alcohol es la
    principal causa individual de muerte entre los jóvenes en el rango de edad de
    16 a 24 años.
- id: 501
  category: safe_driving_rules
  question: Según el Consejo Nacional de Seguridad (National Safety Council), ¿qué
    proporción de conductores se verá involucrada en un choque de vehículos motorizados
    este año?
  choices:
    A: Uno de cada cuatro
    B: Uno de cada ocho
    C: Uno de cada diez
    D: Uno de cada veinte
  answer: B
  explanation: Según el Consejo Nacional de Seguridad, uno de cada ocho conductores
    se verá involucrado en un choque de vehículos motorizados este año.
- id: 502
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    un conductor de 20 años de edad o menos en Luisiana?
  choices:
    A: 0.08%
    B: 0.04%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: En Luisiana, el límite legal de concentración de alcohol en sangre
    (BAC) es de .02 si usted tiene 20 años de edad o menos.
- id: 503
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo le toma al cuerpo eliminar una bebida alcohólica normal
    del sistema circulatorio?
  choices:
    A: Aproximadamente 30 minutos
    B: Aproximadamente una hora
    C: Aproximadamente dos horas
    D: Aproximadamente cuatro horas
  answer: B
  explanation: Al cuerpo le toma aproximadamente una hora eliminar una bebida normal
    del sistema circulatorio.
- id: 504
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima de suspensión de la licencia de conducir por
    una primera condena por conducir bajo los efectos del alcohol (DWI)?
  choices:
    A: 90 días
    B: 180 días
    C: 365 días
    D: Dos años
  answer: C
  explanation: Las sanciones máximas por una primera condena por DWI incluyen la pérdida
    de su licencia de conducir por 365 días.
- id: 505
  category: defensive_driving
  question: ¿Cuál de las siguientes es una acción recomendada si ve a un conductor
    ebrio en la carretera?
  choices:
    A: Hacerle señas al conductor para que se detenga de inmediato.
    B: Seguirlos muy de cerca para leer su placa de matrícula.
    C: Detenerse a un lado de la carretera y llamar al 911 con una descripción completa
      del vehículo.
    D: Intentar rebasarlos rápidamente para salir de su camino.
  answer: C
  explanation: Si ve a un conductor ebrio, debe detenerse a un lado de la carretera
    y llamar al 911, proporcionando una descripción completa del vehículo y su ubicación
    exacta. No debe hacerle señas al conductor para que se detenga.
- id: 506
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es una señal reveladora de que un conductor puede
    estar bajo los efectos del alcohol?
  choices:
    A: Conducir exactamente al límite de velocidad indicado
    B: Realizar paradas repentinas en las señales de tráfico en lugar de reducir la
      velocidad gradualmente
    C: Usar las luces direccionales con mucha antelación a un giro
    D: Conducir con las ventanillas bajas
  answer: B
  explanation: Una parada brusca es una señal reveladora de un conductor que ha bebido,
    ya que puede realizar paradas repentinas en una señal de tráfico o semáforo en
    lugar de reducir la velocidad gradualmente.
- id: 507
  category: penalties_and_points
  question: Según la ley de consentimiento implícito de Luisiana, ¿qué sucede si se
    niega a someterse a una prueba química de alcohol en su primera infracción?
  choices:
    A: Sus privilegios de conducir serán suspendidos por 365 días.
    B: Se le multará con $5,000 de inmediato.
    C: Su vehículo será confiscado y vendido.
    D: Sus privilegios de conducir serán suspendidos por 90 días.
  answer: A
  explanation: Si se niega a someterse a la prueba, sus privilegios de conducir serán
    suspendidos por 365 días en su primera infracción.
- id: 508
  category: alcohol_drugs_health
  question: ¿Aproximadamente cuánto tiempo tardan en desaparecer los efectos de fumar
    un cigarrillo de marihuana?
  choices:
    A: Una hora
    B: De dos a tres horas
    C: De cinco a seis horas
    D: De diez a doce horas
  answer: C
  explanation: Mientras que los efectos de una sola bebida disminuyen en una hora,
    los efectos de fumar un cigarrillo de marihuana tardan de cinco a seis horas en
    desaparecer.
- id: 509
  category: driver_responsibility
  question: 'La ley de envases abiertos de Luisiana prohíbe:'
  choices:
    A: Solo el consumo de alcohol por parte del conductor.
    B: Solo la posesión de un envase de bebida alcohólica abierto en el maletero.
    C: Tanto la posesión de cualquier envase de bebida alcohólica abierto como el
      consumo de cualquier bebida alcohólica en un vehículo.
    D: Transportar bebidas alcohólicas sin abrir en el compartimento de pasajeros.
  answer: C
  explanation: Esta ley prohíbe tanto la posesión de cualquier envase de bebida alcohólica
    abierto como el consumo de cualquier bebida alcohólica en un vehículo.
- id: 510
  category: penalties_and_points
  question: ¿Cuál es el tiempo de cárcel obligatorio por una tercera condena por DWI
    en Luisiana?
  choices:
    A: 48 horas
    B: 10 días
    C: 30 días
    D: 6 meses
  answer: C
  explanation: Una tercera condena por DWI conlleva una pena de 1 a 5 años de prisión
    con 30 días de cárcel obligatorios.
- id: 511
  category: penalties_and_points
  question: 'Si usted se ve involucrado en un choque y no se detiene, no se identifica
    y no presta la ayuda razonable, puede ser acusado de:'
  choices:
    A: Conducción temeraria
    B: Chocar y huir (Hit and run)
    C: Huida de un oficial
    D: Lesión por negligencia vehicular
  answer: B
  explanation: Si usted se ve involucrado o causa un accidente, la ley le exige detenerse,
    identificarse y prestar ayuda razonable. No hacerlo se considera Chocar y Huir
    (Hit and Run Driving) y puede resultar en una multa y tiempo en la cárcel.
- id: 512
  category: alcohol_drugs_health
  question: ¿A qué ritmo puede el cuerpo humano procesar el alcohol por hora?
  choices:
    A: 0.010%
    B: 0.015%
    C: 0.020%
    D: 0.025%
  answer: B
  explanation: El cuerpo puede procesar un 0.015% de alcohol por hora.
- id: 513
  category: penalties_and_points
  question: ¿Qué delito implica causar lesiones corporales graves mientras se opera
    un vehículo bajo la influencia del alcohol o las drogas?
  choices:
    A: Homicidio vehicular
    B: Conducción temeraria
    C: Lesión por negligencia vehicular
    D: Lesión por negligencia vehicular de primer grado
  answer: D
  explanation: La lesión por negligencia vehicular de primer grado consiste en causar
    lesiones corporales graves por parte del operador de cualquier vehículo motorizado...
    cuando el infractor está bajo la influencia del alcohol o las drogas.
- id: 514
  category: driver_responsibility
  question: Después de una condena por DWI o de negarse al consentimiento implícito,
    ¿durante cuánto tiempo debe un conductor mantener la prueba de responsabilidad
    financiera futura (SR-22)?
  choices:
    A: Un año desde la fecha de la condena
    B: Dos años desde la fecha de la condena
    C: Tres años desde la fecha de la condena
    D: Cinco años desde la fecha de la condena
  answer: C
  explanation: La ley le exigirá mantener un SR-22 (prueba de responsabilidad financiera
    futura) durante tres (3) años a partir de la fecha de la condena.
- id: 515
  category: alcohol_drugs_health
  question: ¿Cómo se compara conducir bajo la influencia de drogas con conducir bajo
    la influencia del alcohol según la ley de Louisiana?
  choices:
    A: Las penas por drogas son menos severas que por alcohol.
    B: La ley de Louisiana establece la misma pena por conducir bajo la influencia
      de drogas que por alcohol.
    C: Los medicamentos de venta libre están exentos de las leyes de DUI.
    D: Los delitos por drogas solo resultan en una multa, no en tiempo de cárcel.
  answer: B
  explanation: La ley de Louisiana establece la misma pena por conducir bajo la influencia
    de drogas que por alcohol. Esto incluye medicamentos de venta libre (OTC) y medicamentos
    recetados.
- id: 516
  category: penalties_and_points
  question: Si se niega a realizar una prueba de análisis de alcohol en su primera
    infracción, ¿por cuánto tiempo se suspenderán sus privilegios de conducir?
  choices:
    A: 90 días
    B: 180 días
    C: 365 días
    D: 730 días
  answer: C
  explanation: Según el manual, si se niega a la prueba, sus privilegios de conducir
    serán suspendidos por 365 días en su primera infracción.
- id: 517
  category: alcohol_drugs_health
  question: Si es menor de 21 años y se somete a una prueba que muestra un nivel de
    BAC de 0.02% o más, ¿por cuánto tiempo se suspenderán sus privilegios de conducir
    por una primera infracción?
  choices:
    A: 90 días
    B: 180 días
    C: 365 días
    D: 2 años
  answer: B
  explanation: Si se somete a la prueba y es menor de 21 años, y los resultados de
    la prueba muestran un nivel de BAC de 0.02% o más, sus privilegios de conducir
    serán suspendidos por 180 días por una primera infracción.
- id: 518
  category: penalties_and_points
  question: Cada condena por conducir bajo suspensión hará que su período de suspensión
    se extienda por ¿cuánto tiempo?
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: CADA condena por conducir bajo suspensión hará que su período de suspensión
    se extienda por un año.
- id: 519
  category: vehicle_information
  question: ¿Cuál es la altura máxima permitida para todos los vehículos en Louisiana?
  choices:
    A: 12 pies 6 pulgadas
    B: 13 pies
    C: 13 pies 6 pulgadas
    D: 14 pies
  answer: C
  explanation: La altura máxima es de 13 pies 6 pulgadas para todos los vehículos,
    aunque algunos pasos elevados u otras estructuras tienen un despeje de menos de
    13'6".
- id: 520
  category: safe_driving_rules
  question: Si una carga se extiende cuatro pies o más allá de la plataforma o carrocería
    de un vehículo durante las horas del día, ¿qué debe sujetarse al extremo posterior
    de la carga?
  choices:
    A: Una bandera roja cuadrada de 12 pulgadas
    B: Una linterna eléctrica roja
    C: Una bandera blanca cuadrada de 12 pulgadas
    D: Dos reflectores rojos
  answer: A
  explanation: Si una carga se extiende cuatro pies o más allá de la plataforma o
    carrocería de cualquier vehículo, se debe sujetar una bandera roja de 12 pulgadas
    cuadradas al extremo posterior de la carga durante las horas del día.
- id: 521
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo al jalar o remolcar otro vehículo
    motorizado en Louisiana?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: Al jalar o remolcar otro vehículo motorizado, el límite de velocidad
    es de 45 mph.
- id: 522
  category: sharing_the_road
  question: En carreteras rurales fuera de zonas residenciales o distritos comerciales,
    ¿a qué distancia mínima en pies deben seguirse los conductores de camiones motorizados
    entre sí, excepto para rebasar?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: C
  explanation: En carreteras rurales, fuera de zonas residenciales o distritos comerciales,
    los conductores de camiones motorizados no deben seguirse a menos de 400 pies
    de distancia entre sí, excepto para rebasar.
- id: 523
  category: safe_driving_rules
  question: Al detenerse en un cruce de ferrocarril, ¿cuál es la distancia requerida
    a la que debe detenerse del riel más cercano?
  choices:
    A: A menos de 50 pies pero no a menos de 15 pies
    B: A menos de 30 pies pero no a menos de 10 pies
    C: A menos de 100 pies pero no a menos de 25 pies
    D: Exactamente a 20 pies
  answer: A
  explanation: Debe detenerse a una distancia de entre 50 pies y no menos de 15 pies
    del riel más cercano.
- id: 524
  category: vehicle_information
  question: ¿Con qué tipo de extintor de incendios deben estar equipadas, como mínimo,
    las grúas de remolque?
  choices:
    A: 2-BC
    B: 4-BC
    C: 10-BC
    D: 12-BC
  answer: B
  explanation: Las grúas de remolque deben estar equipadas con al menos un extintor
    de incendios 4-BC capaz de extinguir incendios de líquidos inflamables, completamente
    lleno y en condiciones de funcionamiento.
- id: 525
  category: vehicle_information
  question: ¿Qué dispositivos de advertencia están estrictamente prohibidos para su
    uso por camiones que transportan explosivos, líquidos inflamables o gases comprimidos
    cuando sufren una avería?
  choices:
    A: Linternas eléctricas rojas
    B: Reflectores de emergencia rojos
    C: Bengalas (flares) o fusibles (fuses)
    D: Banderas de tela roja cuadradas de 12 pulgadas
  answer: C
  explanation: Los camiones que transportan explosivos, líquidos inflamables, gases
    comprimidos o que utilizan gas comprimido como combustible deben usar únicamente
    linternas eléctricas rojas o reflectores de emergencia rojos. No se permiten bengalas
    ni fusibles.
- id: 526
  category: safe_driving_rules
  question: Al remolcar otro vehículo, ¿qué longitud no debe exceder generalmente
    la barra de tracción u otra conexión?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: Al remolcar otro vehículo, la barra de tracción u otra conexión debe
    tener la resistencia suficiente para jalar todo el peso remolcado y no debe exceder
    los 15 pies.
- id: 527
  category: vehicle_information
  question: ¿A qué distancia hacia atrás debe reflejar la vista de la carretera el
    espejo retrovisor de un vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Un espejo retrovisor debe reflejar una vista de la carretera a una
    distancia de 200 pies hacia atrás, independientemente de la carga del vehículo.
- id: 528
  category: vehicle_information
  question: 'Todos los remolques o semirremolques deben estar equipados con frenos
    adecuados si tienen una clasificación de peso bruto vehicular de al menos:'
  choices:
    A: 1,000 libras
    B: 2,000 libras
    C: 3,000 libras
    D: 5,000 libras
  answer: C
  explanation: Todos los remolques o semirremolques con una clasificación de peso
    bruto vehicular de 3,000 libras o más deben estar equipados con frenos adecuados
    para detenerlo y sujetarlo.
- id: 529
  category: safe_driving_rules
  question: ¿Qué deben usar los conductores como medio principal para controlar la
    velocidad en pendientes descendentes largas?
  choices:
    A: El freno de estacionamiento
    B: Frenado intermitente (stab braking)
    C: Compresión del motor
    D: El sistema de frenos de emergencia
  answer: C
  explanation: Los conductores deben usar la compresión del motor como medio principal
    para controlar la velocidad en pendientes largas para evitar el uso excesivo de
    los frenos.
- id: 530
  category: vehicle_information
  question: En un sistema de frenos de aire, ¿a qué presión suele estar configurada
    la válvula de seguridad para abrirse y proteger el sistema?
  choices:
    A: 60 psi
    B: 100 psi
    C: 125 psi
    D: 150 psi
  answer: D
  explanation: La válvula de seguridad protege el tanque y el resto del sistema de
    un exceso de presión y suele estar configurada para abrirse a 150 psi.
- id: 531
  category: vehicle_information
  question: 'Una señal de advertencia de baja presión de aire debe encenderse antes
    de que la presión de aire en los tanques caiga por debajo de:'
  choices:
    A: 20 psi
    B: 40 psi
    C: 60 psi
    D: 85 psi
  answer: C
  explanation: Una señal de advertencia visible debe encenderse antes de que la presión
    de aire en los tanques caiga por debajo de 60 psi.
- id: 532
  category: safe_driving_rules
  question: Cuando los frenos de resorte (frenos de estacionamiento) están aplicados,
    ¿qué es lo que NUNCA debe hacer?
  choices:
    A: Girar el volante
    B: Presionar el pedal del freno
    C: Apagar el motor
    D: Tirar de la perilla de control amarilla
  answer: B
  explanation: 'El manual advierte explícitamente: NUNCA PRESIONE EL PEDAL DEL FRENO
    CUANDO LOS FRENOS DE RESORTE ESTÉN APLICADOS. Si lo hace, los frenos podrían dañarse.'
- id: 533
  category: vehicle_information
  question: 'Durante el primer paso de la revisión de los frenos de aire en un vehículo
    sencillo, después de aplicar completamente el freno de pie durante un minuto,
    la presión de aire no debe bajar más de:'
  choices:
    A: 2 libras
    B: 3 libras
    C: 4 libras
    D: 5 libras
  answer: B
  explanation: Durante la revisión de los frenos de aire, debe mantener presionado
    el freno de pie durante un minuto y revisar el manómetro de aire para ver si la
    presión de aire baja más de tres (3) libras en un minuto para un vehículo sencillo.
- id: 534
  category: vehicle_information
  question: Al bombear el pedal (fanning) para reducir la presión de aire durante
    una inspección de frenos de aire, ¿a qué presión aproximada debe cerrarse (saltar
    hacia afuera) la válvula del freno de estacionamiento?
  choices:
    A: 10-20 psi
    B: 20-40 psi
    C: 60-80 psi
    D: 85-100 psi
  answer: B
  explanation: El paso 3 de la revisión de los frenos de aire establece que a medida
    que continúa bombeando para reducir la presión de aire, aproximadamente a 20-40
    psi, la válvula del freno de estacionamiento debe cerrarse (saltar hacia afuera).
- id: 535
  category: defensive_driving
  question: ¿Cuál de las siguientes opciones describe el método de 'frenado de golpe'
    (stab braking) para paradas de emergencia?
  choices:
    A: Presionar el pedal del freno tan fuerte como pueda sin bloquear las ruedas
    B: Bombear el pedal del freno ligeramente para evitar el sobrecalentamiento
    C: Presionar el pedal del freno con fuerza, soltarlo cuando las ruedas se bloqueen
      y volver a aplicarlo por completo cuando las ruedas comiencen a rodar
    D: Usar el freno de estacionamiento y el freno de servicio al mismo tiempo
  answer: C
  explanation: El frenado de golpe (stab braking) consiste en presionar el pedal del
    freno tan fuerte como sea posible, soltar los frenos cuando las ruedas se bloqueen
    y volver a aplicar los frenos por completo tan pronto como las ruedas comiencen
    a rodar.
- id: 536
  category: safe_driving_rules
  question: A 55 mph en pavimento seco, ¿cuántos pies aproximadamente añade la distancia
    de retraso de los frenos de aire a su distancia total de parada?
  choices:
    A: 15 pies
    B: 32 pies
    C: 60 pies
    D: 100 pies
  answer: B
  explanation: El manual establece que la distancia de retraso de los frenos de aire
    a 55 mph en pavimento seco añade unos 32 pies a la distancia total de parada.
- id: 537
  category: safe_driving_rules
  question: 'Debe usar los frenos de estacionamiento cada vez que se estacione, EXCEPTO
    cuando:'
  choices:
    A: Se estacione en una superficie nivelada
    B: Los frenos estén muy calientes por una pendiente pronunciada o muy mojados
      en temperaturas bajo cero
    C: Se estacione por menos de 15 minutos
    D: Su vehículo esté vacío y sin carga
  answer: B
  explanation: Cada vez que se estacione, use los frenos de estacionamiento a menos
    que los frenos estén muy calientes (por haber bajado una pendiente pronunciada)
    o que los frenos estén muy mojados en temperaturas bajo cero.
- id: 538
  category: vehicle_information
  question: Al conectar un remolque a un vehículo, ¿cómo deben colocarse las cadenas
    de seguridad?
  choices:
    A: Arrastrándose por la carretera para conectar a tierra el sistema eléctrico
    B: Estiradas lo más posible para evitar que el remolque se balancee
    C: Cruzadas debajo de la lengüeta del remolque con algo de holgura para permitir
      giros cerrados
    D: Sujetas solo a la parte superior de la bola y el acoplador
  answer: C
  explanation: Las cadenas de seguridad deben tener algo de holgura para permitir
    giros cerrados, pero no deben arrastrarse por la carretera, y deben cruzarse debajo
    de la lengüeta del remolque para ayudar a evitar que la lengüeta caiga a la carretera
    si se separa.
- id: 539
  category: driver_responsibility
  question: Si sus tanques de aire están equipados con drenajes manuales, ¿con qué
    frecuencia debe drenar los tanques usted mismo?
  choices:
    A: Al final de cada día de conducción
    B: Una vez a la semana
    C: Al comienzo de cada mes
    D: Solo cuando se activa la advertencia de baja presión de aire
  answer: A
  explanation: Para los drenajes manuales de los tanques de aire, debe drenar los
    tanques usted mismo al final de cada día de conducción.
- id: 540
  category: vehicle_information
  question: ¿Los sistemas de frenos de aire son una combinación de qué tres sistemas
    de frenado?
  choices:
    A: Hidráulico, mecánico y neumático
    B: De servicio, de estacionamiento y de emergencia
    C: Primario, secundario y auxiliar
    D: Del tractor, del remolque y de desconexión
  answer: B
  explanation: 'Los sistemas de frenos de aire son tres sistemas de frenado combinados:
    el sistema de frenos de servicio, el sistema de frenos de estacionamiento y el
    sistema de frenos de emergencia.'
- id: 541
  category: vehicle_information
  question: ¿Cómo deben estar diseñados los frenos del remolque para funcionar en
    caso de un desprendimiento accidental del vehículo remolcado?
  choices:
    A: Deben emitir una alarma sonora.
    B: Deben aplicarse automáticamente.
    C: Deben bloquear el volante.
    D: Deben liberar toda la presión.
  answer: B
  explanation: El manual establece que los frenos del remolque deben estar diseñados
    y conectados de modo que, en caso de un desprendimiento accidental del vehículo
    remolcado, los frenos se apliquen automáticamente.
- id: 542
  category: vehicle_information
  question: Al seleccionar neumáticos para su remolque, ¿cuál de las siguientes acciones
    debe evitar?
  choices:
    A: Mantener la presión adecuada de los neumáticos.
    B: Mezclar neumáticos de capas diagonales (bias-belted) y radiales.
    C: Comprar el tamaño que se encuentra en el manual del propietario.
    D: Verificar la capacidad de carga.
  answer: B
  explanation: Según el manual, todos los neumáticos del remolque deben ser del mismo
    tipo, tamaño y construcción; no se deben mezclar neumáticos de capas diagonales
    (bias-belted) y radiales.
- id: 543
  category: license_system
  question: Cuando compra un vehículo nuevo en un concesionario de Louisiana, ¿por
    cuánto tiempo es válida la placa temporal de cartón?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: D
  explanation: Al comprar un vehículo nuevo, el concesionario emitirá una placa temporal
    de cartón de 60 días que debe ser claramente visible desde la parte trasera de
    su automóvil.
- id: 544
  category: license_system
  question: Después de comprar un vehículo usado, ¿cuántos días tiene para solicitar
    un título a su nombre?
  choices:
    A: 3 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: El manual establece que tiene cinco días a partir de la fecha de venta
    para solicitar un título a su nombre.
- id: 545
  category: driver_responsibility
  question: ¿Dónde debe guardar el certificado de registro de su vehículo?
  choices:
    A: En una caja de seguridad en casa.
    B: En el vehículo en todo momento.
    C: Con usted en su billetera.
    D: En la Oficina de Vehículos Motorizados (OMV).
  answer: B
  explanation: El certificado de registro es el comprobante de propiedad y debe mantenerse
    en el vehículo en todo momento y presentarse cuando lo solicite la autoridad policial.
- id: 546
  category: penalties_and_points
  question: Si la policía lo detiene y no puede proporcionar un comprobante de seguro,
    ¿qué sucederá?
  choices:
    A: Su licencia de conducir será revocada de inmediato.
    B: Se le confiscará la placa de matrícula de su vehículo.
    C: Se le dará una advertencia de 30 días.
    D: Su vehículo será destruido.
  answer: B
  explanation: Si un oficial de la ley lo detiene y no puede proporcionar un comprobante
    de seguro, se le confiscará la placa de matrícula del vehículo y el vehículo podría
    ser remolcado al depósito.
- id: 547
  category: penalties_and_points
  question: Si se le confisca la placa de matrícula por no proporcionar un comprobante
    de seguro, ¿cuánto tiempo tiene para presentar el comprobante en una oficina de
    Vehículos Motorizados antes de que la placa sea destruida?
  choices:
    A: 24 horas
    B: 3 días calendario (excluyendo fines de semana y feriados legales)
    C: 5 días hábiles
    D: 10 días calendario
  answer: B
  explanation: Tendrá tres (3) días calendario, excluyendo sábados, domingos y feriados
    legales, para presentar el comprobante en una oficina de Vehículos Motorizados
    antes de que la placa sea destruida.
- id: 548
  category: driver_responsibility
  question: Si decide dejar de conducir un vehículo en las carreteras, ¿qué debe hacer
    antes de cancelar su seguro?
  choices:
    A: Vender el vehículo a un concesionario.
    B: Quitar la placa de matrícula y entregarla a la Oficina de Vehículos Motorizados
      (OMV).
    C: Reportar el vehículo como no operativo a su departamento de policía local.
    D: Destruir la placa de matrícula usted mismo.
  answer: B
  explanation: Si decide dejar de conducir un vehículo, debe quitar la placa de matrícula
    y entregarla a la Oficina de Vehículos Motorizados antes de cancelar el seguro
    para evitar sanciones.
- id: 549
  category: license_system
  question: ¿Cuándo vence la placa de matrícula de su vehículo?
  choices:
    A: En su cumpleaños.
    B: El primer día del año.
    C: El último día del mes del año indicado en su registro.
    D: Exactamente un año después de la fecha de compra.
  answer: C
  explanation: La placa de matrícula de su vehículo vence el último día del mes del
    año indicado en su certificado de registro.
- id: 550
  category: vehicle_information
  question: ¿Cuál de las siguientes ciudades opera su propio programa de inspección
    de vehículos motorizados?
  choices:
    A: Baton Rouge
    B: Shreveport
    C: Lafayette
    D: New Orleans
  answer: D
  explanation: El manual señala que la ciudad de New Orleans, la ciudad de Kenner
    y la ciudad de Westwego operan sus propios programas de inspección.
- id: 551
  category: license_system
  question: ¿Por cuánto tiempo se emiten las placas de matrícula estándar para automóviles
    en Louisiana?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 4 años
  answer: B
  explanation: Las placas de automóviles se emiten por un período de 2 años.
- id: 552
  category: license_system
  question: ¿Por cuánto tiempo se emiten las placas de matrícula para camionetas (pickup)
    privadas de uso mínimo que pesan 6000 libras o menos?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 4 años
  answer: D
  explanation: La tarifa de la placa de matrícula para camionetas privadas de uso
    mínimo (6000 libras o menos) es de $10.00 por año, y estas placas para camiones
    se emiten por un período de 4 años.
- id: 553
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por proporcionar información falsa sobre
    su cobertura de seguro?
  choices:
    A: El registro de su vehículo puede ser suspendido, y usted puede ser multado
      y encarcelado.
    B: Se le requerirá tomar un curso de conducción defensiva.
    C: Su vehículo será confiscado permanentemente por el estado.
    D: Solo recibirá una advertencia por escrito.
  answer: A
  explanation: Si proporciona información falsa sobre su cobertura de seguro, el registro
    de su vehículo puede ser suspendido, y también puede ser multado por el tribunal
    y encarcelado.
- id: 554
  category: license_system
  question: Al solicitar un título para un vehículo usado, ¿se requiere una declaración
    federal de odómetro si el vehículo tiene menos de cuántos años de antigüedad?
  choices:
    A: 5 años
    B: 10 años
    C: 15 años
    D: 20 años
  answer: B
  explanation: Debe presentar una declaración federal de odómetro si el vehículo tiene
    menos de 10 años, según lo requiere el Gobierno Federal.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 555
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 556
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 557
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 558
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 559
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 560
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Dar una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 561
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite dar la vuelta en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 562
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín blanco y negro de "ZONA DE NO REBASAR"
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 563
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "MANTÉNGASE A LA DERECHA" (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 564
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 565
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 566
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 567
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 568
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 569
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los pasos a nivel. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 570
- image: curve_right.png
  category: signs_and_signals
  id: 571
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    en la curva.
- image: sharp_turn_right.png
  category: signs_and_signals
  id: 572
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
- image: reverse_curve.png
  category: signs_and_signals
  id: 573
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que el camino gire
    primero en un sentido y luego en el otro.
- image: winding_road.png
  category: signs_and_signals
  id: 574
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
- image: merge.png
  category: signs_and_signals
  id: 575
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
- image: road_narrows.png
  category: signs_and_signals
  id: 576
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Prepárese para una reducción en el ancho de la carretera y ajuste
    su posición en el carril.
- image: divided_highway.png
  category: signs_and_signals
  id: 577
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: El camino termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
- image: divided_highway_ends.png
  category: signs_and_signals
  id: 578
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Una zona de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
- image: two_way_traffic.png
  category: signs_and_signals
  id: 579
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de sentido único o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
- image: slippery_when_wet.png
  category: signs_and_signals
  id: 580
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción en la carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 581
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo
    donde el semáforo puede no ser visible desde la distancia.
  id: 582
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 583
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 584
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 585
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere girar a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir la incorporación de vehículos. El tráfico que entra
    desde la rampa tiene su propio carril nuevo.
  id: 586
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse brevemente o dejar el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 587
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    vigente pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 588
