questions:
- id: 1
  category: license_system
  question: ¿En Louisiana, cuál es la edad mínima requerida para solicitar un Permiso
    de Aprendizaje (Learner's Permit)?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 17 años
  answer: B
  explanation: Según la Guía del Conductor de Louisiana, el solicitante debe tener
    al menos 15 años de edad para ser elegible para un Permiso de Aprendizaje (Learner's
    Permit).
- id: 2
  category: license_system
  question: Para obtener un Permiso de Aprendizaje (Learner's Permit) en Louisiana,
    ¿cuántas horas de instrucción en el aula debe completar un menor?
  choices:
    A: 6 horas
    B: 15 horas
    C: 30 horas
    D: 40 horas
  answer: C
  explanation: La ley de Louisiana exige que los menores completen 30 horas de instrucción
    en el aula y 8 horas de entrenamiento al volante para calificar para un permiso.
- id: 3
  category: license_system
  question: Bajo el Programa de Licencia Graduada (GDL) de Louisiana, ¿entre qué horas
    tiene restringido conducir el titular de una Licencia Intermedia (Intermediate
    License) a menos que esté acompañado por un adulto con licencia?
  choices:
    A: 10:00 PM a 4:00 AM
    B: 11:00 PM a 5:00 AM
    C: Medianoche a 6:00 AM
    D: 9:00 PM a 5:00 AM
  answer: B
  explanation: Los titulares de una Licencia Intermedia en Louisiana no pueden conducir
    entre las 11:00 PM y las 5:00 AM a menos que estén acompañados por un padre, tutor
    o adulto con licencia que tenga al menos 21 años de edad.
- id: 4
  category: license_system
  question: Entre las 6:00 PM y las 5:00 AM, ¿cuántos pasajeros menores de 21 años
    (que no sean familiares directos) puede llevar el titular de una Licencia Intermedia?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Las reglas del GDL de Louisiana establecen que entre las 6:00 PM y
    las 5:00 AM, el titular de una Licencia Intermedia no puede transportar a más
    de un pasajero menor de 21 años que no sea miembro de la familia inmediata.
- id: 5
  category: license_system
  question: Si se muda a una nueva dirección dentro de Louisiana, ¿dentro de cuántos
    días debe notificar el cambio a la Oficina de Vehículos Motorizados (OMV)?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: La ley de Louisiana exige que notifique a la OMV cualquier cambio de
    dirección dentro de un plazo de 10 días.
- id: 6
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia Completa Clase E en
    Louisiana, siempre que el solicitante haya cumplido con todos los requisitos del
    GDL?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: En Louisiana, un conductor es elegible para una Licencia Completa Clase
    E a los 17 años, siempre que haya tenido una Licencia Intermedia durante al menos
    un año y no haya estado involucrado en accidentes con culpa ni infracciones de
    tránsito.
- id: 7
  category: license_system
  question: ¿Por cuántos años es válida normalmente una licencia de conducir estándar
    Clase E de Louisiana antes de que expire?
  choices:
    A: 4 años
    B: 5 años
    C: 6 años
    D: 8 años
  answer: C
  explanation: La mayoría de las licencias de conducir de Louisiana se emiten por
    un período de seis años a partir del cumpleaños más cercano.
- id: 8
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un nuevo residente obtenga
    una licencia de conducir de Louisiana?
  choices:
    A: Deben haber vivido en el estado durante 6 meses
    B: Deben solicitarla dentro de los 30 días posteriores a establecer la residencia
    C: Deben volver a tomar el examen de conducir al volante independientemente del
      estado de su licencia anterior
    D: Deben tener al menos 21 años de edad
  answer: B
  explanation: Los nuevos residentes deben solicitar una licencia de Louisiana dentro
    de los 30 días posteriores a establecer la residencia en el estado.
- id: 9
  category: license_system
  question: Bajo la ley de Louisiana, ¿qué sucede con un solicitante masculino de
    entre 15 y 26 años cuando solicita una licencia de conducir?
  choices:
    A: Se registran automáticamente en la milicia estatal
    B: Se registran automáticamente en el Servicio Selectivo (Selective Service)
    C: Deben pagar un recargo obligatorio de 'conductor joven'
    D: Se les requiere tomar una prueba de drogas obligatoria
  answer: B
  explanation: La ley de Louisiana exige que cualquier solicitante masculino de entre
    15 y 26 años de edad sea registrado en el Sistema del Servicio Selectivo (Selective
    Service System) al solicitar una licencia o tarjeta de identificación.
- id: 10
  category: license_system
  question: ¿Cuál es el nombre del programa de Louisiana que gestiona el proceso de
    licencias graduadas para conductores adolescentes?
  choices:
    A: SAFE Act
    B: R.Y.A.N. Act
    C: LOUIS Act
    D: PELICAN Program
  answer: B
  explanation: La Ley R.Y.A.N. (Reduce Youthful Accidents Now - Reducir Accidentes
    Juveniles Ahora) es el nombre del Programa de Licencia Graduada de Louisiana.
- id: 11
  category: license_system
  question: En Luisiana, si usted es menor de 18 años, ¿quién debe firmar su solicitud
    de licencia para aceptar la responsabilidad financiera?
  choices:
    A: Solo un padre
    B: Un padre o tutor legal
    C: Cualquier adulto mayor de 21 años
    D: El director de una escuela
  answer: B
  explanation: Para los solicitantes menores de 18 años, un padre o tutor legal debe
    firmar la solicitud y aceptar la responsabilidad financiera por las acciones del
    menor al conducir.
- id: 12
  category: license_system
  question: ¿Qué documento NO es obligatorio para solicitar una licencia que cumpla
    con la ley Real ID en Luisiana?
  choices:
    A: Comprobante de número de Seguro Social
    B: Dos comprobantes de residencia
    C: Comprobante de identidad (ej. acta de nacimiento)
    D: Una copia de su diploma de escuela secundaria
  answer: D
  explanation: Un diploma de escuela secundaria no es un requisito para una Real ID.
    Se necesita un comprobante de identidad, el número de Seguro Social (SSN) y dos
    comprobantes de residencia en Luisiana.
- id: 13
  category: license_system
  question: ¿Cuál es la multa mínima por una primera condena por tirar basura (littering)
    en Luisiana?
  choices:
    A: $50
    B: $100
    C: $175
    D: $500
  answer: C
  explanation: En Luisiana, la multa mínima por una primera condena por tirar basura
    es de $175, más 8 horas de servicio comunitario en un programa de reducción de
    basura.
- id: 14
  category: license_system
  question: ¿Cuánto tiempo debe tener un joven de 15 años un permiso de aprendizaje
    (Learner's Permit) antes de poder solicitar una licencia intermedia en Luisiana?
  choices:
    A: 90 días
    B: 180 días
    C: Un año
    D: Hasta que cumpla 16 años
  answer: B
  explanation: Un estudiante debe tener un permiso de aprendizaje durante al menos
    180 días (y tener al menos 16 años) antes de poder avanzar a una licencia intermedia.
- id: 15
  category: license_system
  question: La ley de Luisiana exige que los conductores tengan una cantidad mínima
    de seguro de responsabilidad civil. ¿Cuál es la cobertura mínima requerida por
    lesiones corporales a una persona?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $30,000
  answer: B
  explanation: La ley '15/30/25' de Luisiana exige $15,000 por lesiones corporales
    a una persona, $30,000 por lesiones corporales a más de una persona y $25,000
    por daños a la propiedad.
- id: 16
  category: license_system
  question: Los nuevos residentes de Luisiana deben registrar sus vehículos dentro
    de ¿cuántos días después de establecer su residencia?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Según la Guía del Conductor de Luisiana, los nuevos residentes tienen
    30 días para registrar sus vehículos en el estado.
- id: 17
  category: license_system
  question: Si su licencia de conducir de Luisiana es suspendida por falta de seguro
    de vehículo motorizado, ¿cuál es la tarifa máxima de reinstalación por una tercera
    infracción o subsiguiente?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Las tarifas de reinstalación por suspensiones relacionadas con el seguro
    en Luisiana aumentan con cada infracción, llegando a $500 por una tercera infracción
    o subsiguiente.
- id: 18
  category: license_system
  question: 'Se requiere una licencia de chofer Clase D de Luisiana para cualquier
    persona que opere un vehículo utilizado en el comercio con una clasificación de
    peso bruto vehicular (GVWR) de:'
  choices:
    A: Entre 5,001 y 10,000 libras
    B: Entre 10,001 y 26,000 libras
    C: Exactamente 26,001 libras
    D: Más de 30,000 libras
  answer: B
  explanation: Se requiere una licencia Clase D en Luisiana para la operación de cualquier
    vehículo individual utilizado en el comercio con un GVWR de 10,001 a 26,000 libras.
- id: 19
  category: license_system
  question: Al solicitar una licencia que cumpla con la ley REAL ID en Luisiana, ¿cuántos
    documentos se requieren para demostrar su residencia en Luisiana?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene un pasaporte válido
  answer: B
  explanation: Para obtener una REAL ID en Luisiana, los solicitantes deben proporcionar
    dos documentos que demuestren su dirección residencial física en Luisiana.
- id: 20
  category: license_system
  question: En Luisiana, ¿cuál es la agudeza visual mínima requerida en al menos un
    ojo (con o sin lentes correctores) para obtener una licencia de conducir sin restricciones?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/70
  answer: C
  explanation: Luisiana requiere una agudeza visual mínima de 20/40 en al menos un
    ojo para aprobar el examen de la vista para una licencia sin restricciones.
- id: 21
  category: license_system
  question: ¿Bajo la ley de Louisiana, los privilegios de conducir de un menor pueden
    ser suspendidos por cuál de las siguientes infracciones no relacionadas con la
    conducción?
  choices:
    A: Reprobar un examen de matemáticas
    B: Abandono escolar o ausentismo crónico
    C: Ser castigado por un padre
    D: Faltar a una asamblea escolar
  answer: B
  explanation: La ley de Louisiana permite la suspensión de los privilegios de conducir
    para los menores que abandonan la escuela o se ausentan habitualmente.
- id: 22
  category: license_system
  question: 'Si cambia su nombre debido a matrimonio o una orden judicial, debe solicitar
    una licencia de Louisiana corregida dentro de:'
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Louisiana exige que notifique a la OMV y obtenga una licencia
    corregida dentro de los 30 días posteriores a un cambio de nombre legal.
- id: 23
  category: license_system
  question: ¿Cuál es el propósito principal de la 'Ley R.Y.A.N.' (Reduce Youth Accidents
    Now) en Louisiana?
  choices:
    A: Bajar la edad de conducir a los 14 años
    B: Exigir 30 horas de clase y 8 horas de instrucción al volante para conductores
      adolescentes
    C: Eliminar la necesidad de un examen práctico
    D: Proporcionar autos gratuitos a estudiantes con promedios académicos altos
  answer: B
  explanation: La Ley R.Y.A.N. estableció el requisito de que los adolescentes completen
    un curso formal de educación vial (30 horas de clase/8 horas de conducción) para
    obtener un permiso.
- id: 24
  category: license_system
  question: ¿Cuál de los siguientes se considera un documento 'primario' de identificación
    al solicitar una licencia de Louisiana?
  choices:
    A: Una tarjeta de seguro social
    B: Un acta de nacimiento certificada
    C: Una identificación de la escuela secundaria
    D: Una factura de servicios públicos
  answer: B
  explanation: Un acta de nacimiento certificada es un documento primario. Las tarjetas
    de seguro social y las identificaciones escolares se consideran documentos secundarios
    en Louisiana.
- id: 25
  category: license_system
  question: 'Si un conductor de Louisiana es condenado por tres cargos de conducción
    temeraria dentro de un período de 12 meses, su licencia será:'
  choices:
    A: Suspendida por 30 días
    B: Revocada
    C: Puesta en periodo de prueba
    D: Renovada automáticamente
  answer: B
  explanation: Bajo la ley de Louisiana, la OMV revocará la licencia de cualquier
    persona condenada por tres cargos de conducción temeraria en un solo año.
- id: 26
  category: license_system
  question: En Louisiana, ¿cuál de los siguientes es un documento aceptable para probar
    su número de Seguro Social para una REAL ID?
  choices:
    A: Una tarjeta de Seguro Social original
    B: Una nota escrita a mano de un padre
    C: Una tarjeta de biblioteca
    D: Un acta de nacimiento
  answer: A
  explanation: Una tarjeta de Seguro Social original, un formulario W-2 o un formulario
    1099 que muestre el SSN completo son pruebas aceptables para una REAL ID en Louisiana.
- id: 27
  category: license_system
  question: Los conductores de Louisiana que tienen 17 años y poseen una licencia
    Clase E están sujetos a ¿cuál restricción?
  choices:
    A: No pueden conducir de noche
    B: No pueden llevar pasajeros
    C: Generalmente no tienen restricciones a menos que aún estén en la etapa intermedia
      del GDL
    D: Siempre deben conducir con un padre
  answer: C
  explanation: A los 17 años, un conductor puede graduarse a una Licencia Completa
    Clase E, lo que elimina las restricciones de horario nocturno y de pasajeros de
    la Licencia Intermedia.
- id: 28
  category: license_system
  question: ¿Cuál es el cargo por una 'renovación tardía' de una licencia de conducir
    de Louisiana si ha estado vencida por más de 10 días?
  choices:
    A: $5
    B: $15
    C: $25
    D: $50
  answer: B
  explanation: Louisiana cobra un cargo por demora de $15 además de la tarifa de renovación
    estándar si la licencia ha vencido por 10 días o más.
- id: 29
  category: driver_testing
  question: 'Para aprobar el examen de la vista para una licencia de conducir de Louisiana,
    el solicitante debe tener una agudeza visual mínima de al menos:'
  choices:
    A: 20/20 en ambos ojos
    B: 20/40 en al menos un ojo
    C: 20/50 en ambos ojos
    D: 20/60 en al menos un ojo
  answer: B
  explanation: De acuerdo con la Guía del Conductor de Louisiana, un solicitante debe
    tener al menos una visión de 20/40 en uno o ambos ojos (con o sin lentes correctivos)
    para aprobar el examen de la vista.
- id: 30
  category: driver_testing
  question: Durante el examen práctico de conducción de Louisiana, ¿cuál de las siguientes
    acciones resultará en una reprobación inmediata?
  choices:
    A: No usar una luz de giro una vez
    B: Conducir con una sola mano en el volante
    C: Una violación de cualquier ley de tránsito
    D: Ajustar los espejos mientras está detenido
  answer: C
  explanation: En Louisiana, el examen de habilidades de conducción se termina de
    inmediato por una colisión, una acción peligrosa, una violación de la ley, falta
    de cooperación o negarse a realizar una maniobra.
- id: 31
  category: driver_testing
  question: ¿Cuál es la puntuación mínima aprobatoria requerida en el examen de conocimientos
    (escrito) de Clase E de Louisiana?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: La Oficina de Vehículos Motorizados de Louisiana requiere una puntuación
    mínima del 80% para aprobar la parte de conocimientos del examen de conducir.
- id: 32
  category: driver_testing
  question: 'Bajo la ley de ''Consentimiento Implícito'' de Louisiana, al operar un
    vehículo motorizado, usted ha dado su consentimiento para:'
  choices:
    A: Un registro de su vehículo en cualquier momento
    B: Una prueba química para determinar la concentración de alcohol en sangre (BAC)
    C: Una inspección mecánica de su automóvil al costado de la carretera
    D: Permitir que los pasajeros beban alcohol en el vehículo
  answer: B
  explanation: La ley de Consentimiento Implícito de Louisiana significa que al conducir
    por las carreteras del estado, usted acepta someterse a una prueba química de
    BAC si un oficial de la ley tiene motivos razonables para creer que usted está
    bajo los efectos del alcohol o drogas.
- id: 33
  category: driver_testing
  question: En Louisiana, ¿cuál es el límite legal de concentración de alcohol en
    sangre (BAC) para un conductor menor de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Louisiana tiene una política de 'Tolerancia Cero' para el consumo de
    alcohol y la conducción de menores de edad; el límite legal para conductores menores
    de 21 años es de 0.02%.
- id: 34
  category: driver_testing
  question: Al acercarse a un autobús escolar que está detenido cargando o descargando
    niños en una carretera con un carril de giro exclusivo, ¿a cuántos pies debe detenerse
    del autobús?
  choices:
    A: 10 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Louisiana exige que los conductores se detengan al menos
    a 30 pies de un autobús escolar que esté cargando o descargando niños, a menos
    que se encuentren en una carretera dividida con una barrera física.
- id: 35
  category: driver_testing
  question: 'Si un conductor de Louisiana se niega a someterse a una prueba química
    de intoxicación por primera vez, sus privilegios de conducir serán suspendidos
    por:'
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: B
  explanation: Según la ley de Louisiana, la primera negativa a una prueba química
    resulta en una suspensión automática de los privilegios de conducir por 180 días.
- id: 36
  category: driver_testing
  question: Al rebasar una bicicleta que viaja en la misma dirección en una carretera
    de Louisiana, ¿cuál es la distancia mínima que debe mantener entre su vehículo
    y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La 'Regla de los 3 pies' de Louisiana (RS 32:76.1) exige que los automovilistas
    dejen una distancia de al menos tres pies al rebasar una bicicleta.
- id: 37
  category: driver_testing
  question: En Louisiana, ¿cuál es la multa máxima por una primera condena por estacionarse
    en un espacio designado para personas con discapacidades?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: La ley de Louisiana establece la multa por una primera infracción de
    estacionamiento para personas con discapacidad en no menos de $250 y no más de
    $500.
- id: 38
  category: driver_testing
  question: ¿Cuántos días antes de la fecha de vencimiento se le permite renovar su
    licencia de conducir de Louisiana?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: D
  explanation: A los residentes de Louisiana se les permite renovar su licencia de
    conducir hasta 180 días antes de la fecha de vencimiento real.
- id: 39
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para el vehículo utilizado durante
    la prueba de habilidades viales de Louisiana?
  choices:
    A: Debe ser un sedán de tamaño mediano
    B: Debe tener una calcomanía de inspección de seguridad válida
    C: Debe estar equipado con un sistema de frenado doble
    D: Debe haber sido fabricado en los últimos 10 años
  answer: B
  explanation: El vehículo utilizado para la prueba de manejo debe estar en condiciones
    seguras de funcionamiento y mostrar una calcomanía de inspección de seguridad
    vigente y válida, el registro y el comprobante de seguro.
- id: 40
  category: driver_testing
  question: 'En Louisiana, si es condenado por una violación de la ley ''Move Over''
    (no ceder el paso a un vehículo de emergencia en el arcén), podría enfrentar una
    multa de hasta:'
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: Las violaciones de la ley Move Over de Louisiana (RS 32:125) pueden
    resultar en multas de hasta $200 por una primera infracción.
- id: 41
  category: driver_testing
  question: Al solicitar una licencia de Louisiana, ¿a través de qué organización
    puede registrarse para ser donante de órganos?
  choices:
    A: Cruz Roja (Red Cross)
    B: LOPA (Agencia de Obtención de Órganos de Louisiana)
    C: Departamento de Salud de Louisiana
    D: Donate Life America
  answer: B
  explanation: Louisiana se asocia con LOPA (Agencia de Obtención de Órganos de Louisiana)
    para permitir que los residentes se unan al registro de donantes cuando solicitan
    o renuevan su licencia.
- id: 42
  category: driver_testing
  question: 'La ley de Louisiana exige que sus faros delanteros estén encendidos cuando
    los limpiaparabrisas están en uso debido al mal tiempo. Esto se conoce como la:'
  choices:
    A: Ley de Limpiaparabrisas Encendidos, Luces Encendidas
    B: Ley de Visibilidad
    C: Regulación de Vista Despejada
    D: Regla del Día Lluvioso
  answer: A
  explanation: La ley de Louisiana exige que los conductores tengan sus faros encendidos
    (luces bajas) cuando se requiera el uso de limpiaparabrisas debido a la precipitación.
- id: 43
  category: driver_testing
  question: ¿Cuál es el límite de velocidad máximo en las autopistas interestatales
    de Louisiana en áreas rurales, a menos que se indique lo contrario?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: En Louisiana, el límite de velocidad máximo en las autopistas interestatales
    rurales es de 75 mph, aunque muchas secciones permanecen señalizadas a 70 mph.
- id: 44
  category: driver_testing
  question: Si se ve involucrado en un accidente durante su examen de habilidades
    de conducción en Louisiana que usted podría haber evitado, ¿cuál es el resultado?
  choices:
    A: Recibe una deducción de 10 puntos
    B: Se le permite terminar el examen y luego recibe una advertencia
    C: Reprobación automática del examen
    D: Debe esperar 90 días para volver a realizar el examen
  answer: C
  explanation: Cualquier accidente que el solicitante pudiera haber evitado se registra
    como una reprobación automática durante el examen de habilidades de conducción
    de Louisiana.
- id: 45
  category: driver_testing
  question: 'En Louisiana, se considera que un conductor menor de 21 años conduce
    bajo la influencia (DUI) si su concentración de alcohol en sangre (BAC) es de
    al menos:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Louisiana tiene una política de 'tolerancia cero' para el consumo de
    alcohol y la conducción de menores de edad; el límite legal para conductores menores
    de 21 años es de 0.02%.
- id: 46
  category: driver_testing
  question: En Louisiana, ¿con cuántos pies de antelación debe señalizar su intención
    de girar antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: El Estatuto Revisado de Louisiana 32:104 exige que los conductores
    señalicen un giro continuamente durante no menos de los últimos 100 pies recorridos
    por el vehículo antes de girar.
- id: 47
  category: driver_testing
  question: En Louisiana, ¿es ilegal estacionarse a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: De acuerdo con la ley de Louisiana, no puede estacionar un vehículo
    a menos de 15 pies de un hidrante de incendios.
- id: 48
  category: driver_testing
  question: Al estacionar cerca de una intersección en Louisiana, ¿a cuántos pies
    de distancia debe estar, como mínimo, de un paso de peatones?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: La ley de Louisiana prohíbe estacionarse a menos de 20 pies de un paso
    de peatones en una intersección.
- id: 49
  category: driver_testing
  question: La ley de 'Hacerse a un lado' (Move Over) de Louisiana exige que los conductores
    cambien de carril o reduzcan la velocidad al acercarse a ¿cuál de los siguientes
    en el borde de la carretera?
  choices:
    A: Cualquier vehículo con sus luces de emergencia parpadeando
    B: Solo patrullas de policía
    C: Solo ambulancias y camiones de bomberos
    D: Cualquier vehículo de emergencia, grúa o vehículo de servicios públicos con
      luces intermitentes
  answer: D
  explanation: La ley de Louisiana exige que los conductores se muevan a otro carril
    o reduzcan la velocidad ante todos los vehículos de emergencia, incluidos los
    de policía, bomberos, servicios médicos de emergencia (EMS), grúas y vehículos
    de servicios públicos con luces intermitentes.
- id: 50
  category: driver_testing
  question: En Louisiana, debe bajar sus luces altas (cambiar a luces bajas) cuando
    se encuentre a menos de cuántos pies de un vehículo que viene en dirección contraria?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Louisiana exige que los conductores bajen sus luces altas
    cuando se encuentren a menos de 500 pies de un vehículo que se aproxima en dirección
    opuesta.
- id: 51
  category: driver_testing
  question: ¿Cuál es la distancia de seguimiento recomendada para la mayoría de los
    vehículos de pasajeros en buenas condiciones climáticas en Louisiana?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: La Guía del Conductor de Louisiana recomienda la 'regla de los 3 segundos'
    para mantener una distancia de seguimiento segura detrás del vehículo que está
    frente a usted.
- id: 52
  category: driver_testing
  question: En una carretera de Louisiana con un carril central continuo para girar
    a la izquierda (sin una barrera física), cuando un autobús escolar se detiene
    con las luces rojas intermitentes, ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico en el carril de giro
    C: El tráfico en ambas direcciones
    D: Nadie está obligado a detenerse si hay más de dos carriles
  answer: C
  explanation: En Louisiana, si una carretera está separada solo por un carril de
    giro (y no por una barrera física como una mediana o cuneta), el tráfico en ambas
    direcciones debe detenerse ante un autobús escolar con luces rojas intermitentes.
- id: 53
  category: driver_responsibility
  question: Bajo la ley de seguro de responsabilidad civil obligatorio de Louisiana,
    ¿cuál es la cobertura mínima requerida para daños a la propiedad de terceros en
    un solo accidente?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: D
  explanation: La ley de Louisiana exige una cobertura de '15/30/25'. El '25' representa
    $25,000, que es el requisito legal mínimo para la responsabilidad por daños a
    la propiedad.
- id: 54
  category: driver_responsibility
  question: 'En Louisiana, se debe presentar un informe por escrito (SR-1) al Departamento
    de Seguridad Pública dentro de los 15 días posteriores a un accidente si hay una
    fatalidad, lesiones corporales o daños a la propiedad que excedan los:'
  choices:
    A: $100
    B: $500
    C: $750
    D: $1,000
  answer: B
  explanation: El Estatuto Revisado de Louisiana 32:398 exige que los conductores
    informen inmediatamente a la policía sobre cualquier accidente que resulte en
    lesiones, muerte o daños a la propiedad que superen los $500, y posteriormente
    al DPS si no se realizó un informe policial.
- id: 55
  category: driver_responsibility
  question: Cuando vende un vehículo en Louisiana, debe enviar un 'Aviso de Transferencia'
    (Notice of Transfer) a la Oficina de Vehículos Motorizados (OMV) dentro de ¿cuántos
    días después de la venta?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Para protegerse de la responsabilidad sobre el vehículo después de
    venderlo, la ley de Louisiana exige que el vendedor notifique a la OMV dentro
    de los 10 días posteriores a la fecha de la venta.
- id: 56
  category: driver_responsibility
  question: La ley 'No Pay, No Play' (Si no paga, no juega) de Louisiana generalmente
    impide que los automovilistas sin seguro cobren los primeros ______ de daños a
    la propiedad y los primeros ______ de pérdidas por lesiones personales.
  choices:
    A: $5,000; $5,000
    B: $10,000; $10,000
    C: $25,000; $15,000
    D: $50,000; $25,000
  answer: C
  explanation: Bajo la ley 'No Pay, No Play', los conductores sin seguro no pueden
    cobrar los primeros $15,000 de lesiones corporales ni los primeros $25,000 de
    daños a la propiedad, independientemente de quién haya tenido la culpa.
- id: 57
  category: driver_responsibility
  question: ¿Cuál es la tarifa de reinstalación por una suspensión de privilegios
    de conducir por primera infracción debido a la falta de mantenimiento del seguro
    de responsabilidad civil requerido en Louisiana?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: B
  explanation: Por una primera infracción por no mantener el seguro, la OMV cobra
    una tarifa de reinstalación de $50. Esta tarifa aumenta en infracciones posteriores.
- id: 58
  category: driver_responsibility
  question: En Louisiana, si la policía lo detiene y no puede proporcionar una prueba
    de seguro, el oficial puede emitir un aviso temporal y colocar una calcomanía
    de color ______ en su ventana trasera.
  choices:
    A: Roja
    B: Verde
    C: Amarilla
    D: Azul
  answer: C
  explanation: Si un conductor no puede proporcionar una prueba de seguro, el oficial
    puede emitir una calcomanía amarilla de 'Uso Temporal' (Temporary Use), y el vehículo
    puede ser sujeto a incautación si no se proporciona la prueba dentro de un plazo
    específico.
- id: 59
  category: driver_responsibility
  question: Después de comprar un vehículo a un particular (persona privada) en Louisiana,
    ¿dentro de cuántos días debe el comprador titular y registrar el vehículo para
    evitar multas por retraso?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: La ley de Louisiana exige que el comprador solicite el título y el
    registro dentro de los 20 días posteriores a la fecha de la venta para evitar
    cargos y multas por retraso.
- id: 60
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma legal de prueba de seguro en el estado
    de Louisiana?
  choices:
    A: Una tarjeta de identificación de seguro física
    B: Una imagen de la tarjeta de seguro mostrada en un teléfono inteligente
    C: La página de declaración de la póliza de seguro
    D: Todas las anteriores
  answer: D
  explanation: La ley de Louisiana permite a los conductores mostrar prueba de seguro
    a través de tarjetas físicas, documentos en papel o imágenes electrónicas en un
    dispositivo móvil.
- id: 61
  category: driver_responsibility
  question: 'En Luisiana, su placa de matrícula debe ser claramente visible y estar
    iluminada por una luz blanca para que pueda leerse desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 150 pies
  answer: B
  explanation: La ley de Luisiana exige que la placa de registro trasera esté iluminada
    por una luz blanca que haga que la placa sea claramente legible desde una distancia
    de 50 pies hacia atrás.
- id: 62
  category: driver_responsibility
  question: Si planea cancelar la póliza de seguro de su vehículo en Luisiana, ¿qué
    debe hacer primero para evitar multas y sanciones (flags) en su registro?
  choices:
    A: Notificar a la policía
    B: Esperar a que la póliza expire naturalmente
    C: Entregar la placa de matrícula a la OMV
    D: Vender el vehículo
  answer: C
  explanation: La ley de Luisiana exige que entregue su placa de matrícula a la OMV
    antes de cancelar su póliza de seguro para evitar una sanción ('flag') de seguro
    y las multas subsiguientes.
- id: 63
  category: driver_responsibility
  question: 'En Luisiana, la mayoría de los vehículos de pasajeros deben someterse
    a una inspección de seguridad (brake tag) cada:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Si bien algunos municipios específicos (como Nueva Orleans) tienen
    requisitos de 1 año, la regla general en todo el estado de Luisiana es que las
    calcomanías de inspección son válidas por 2 años.
- id: 64
  category: driver_responsibility
  question: 'Si un conductor de Luisiana se ve involucrado en un accidente y no tiene
    el seguro requerido, se le puede exigir que deposite una fianza de seguridad ante
    el DPS para cubrir posibles daños. Esto se conoce como:'
  choices:
    A: La Ley de Responsabilidad de Seguridad (Safety Responsibility Act)
    B: La Ley del Buen Samaritano
    C: La Ley de Hacerse a un Lado (Move Over Law)
    D: La Ley de Contenedores Abiertos
  answer: A
  explanation: La Ley de Responsabilidad de Seguridad de Luisiana exige que los conductores
    sin seguro depositen una fianza de seguridad o se enfrenten a la suspensión de
    la licencia tras un accidente para garantizar la responsabilidad financiera por
    los daños.
- id: 65
  category: driver_responsibility
  question: Bajo la ley 'Motor Voter', ¿a qué edad puede un residente de Luisiana
    preinscribirse para votar en la Oficina de Vehículos Motorizados (OMV)?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: En Luisiana, puede preinscribirse para votar en la OMV a partir de
    los 16 años, aunque no puede votar realmente hasta los 18 años.
- id: 66
  category: driver_responsibility
  question: ¿En Luisiana, debe presentar un informe oficial de accidente ante el Departamento
    de Seguridad Pública si un accidente resulta en daños a la propiedad que superen
    qué cantidad?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Según la ley de Luisiana, cualquier accidente que involucre lesiones,
    muerte o daños a la propiedad que superen los $500 debe informarse al Departamento
    de Seguridad Pública.
- id: 67
  category: driver_responsibility
  question: En Luisiana, ¿con qué frecuencia deben someterse la mayoría de los vehículos
    motorizados a una inspección de seguridad para recibir una nueva calcomanía de
    inspección ('brake tag')?
  choices:
    A: Cada 6 meses
    B: Cada año o cada dos años, dependiendo de la parroquia y la tarifa pagada
    C: Solo cuando se vende el vehículo
    D: Cada 5 años
  answer: B
  explanation: Luisiana requiere inspecciones de seguridad anuales o bienales (cada
    2 años). Los residentes en ciertas áreas, como Nueva Orleans o Kenner, pueden
    tener requisitos de inspección locales específicos.
- id: 68
  category: driver_responsibility
  question: Si un oficial de la ley de Luisiana lo detiene, ¿cuál de las siguientes
    es una forma aceptable de prueba de seguro?
  choices:
    A: Solo una tarjeta de seguro física
    B: Una versión digital oficial mostrada en un teléfono inteligente
    C: Una declaración verbal del número de póliza
    D: Una nota escrita a mano de un agente de seguros
  answer: B
  explanation: La ley de Luisiana permite a los conductores proporcionar una prueba
    de seguro ya sea en formato de papel físico o en formato electrónico en un dispositivo
    móvil.
- id: 69
  category: driver_responsibility
  question: Bajo la Ley de Consentimiento Implícito de Luisiana, si se niega a someterse
    a una prueba química de alcohol, ¿por cuánto tiempo se suspenderán sus privilegios
    de conducir por una primera infracción?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Al operar un vehículo motorizado en Luisiana, usted da su consentimiento
    implícito para las pruebas. La negativa a realizar la prueba resulta en una suspensión
    de la licencia de 180 días por una primera infracción.
- id: 70
  category: driver_responsibility
  question: ¿Cuál es la pena máxima de cárcel por una condena de DWI (conducir bajo
    los efectos del alcohol) por primera vez para un adulto en Luisiana?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Un DWI por primera vez en Luisiana es un delito menor y conlleva una
    pena de 10 días a 6 meses de cárcel, aunque la sentencia puede suspenderse con
    requisitos de libertad condicional.
- id: 71
  category: driver_responsibility
  question: De acuerdo con la Ley de Seguridad de Niños Pasajeros de Luisiana, ¿hasta
    qué edad deben permanecer los niños en un asiento de seguridad para niños orientado
    hacia atrás?
  choices:
    A: 1 año de edad
    B: 2 años de edad
    C: 4 años de edad
    D: 6 años de edad
  answer: B
  explanation: La ley de Luisiana exige que los niños estén sujetos en un asiento
    de seguridad para niños orientado hacia atrás hasta que tengan al menos 2 años
    de edad o superen los límites de peso/altura establecidos por el fabricante.
- id: 72
  category: driver_responsibility
  question: Si un pasajero en su vehículo arroja basura por la ventana en Luisiana,
    ¿quién es legalmente responsable de la infracción por arrojar basura?
  choices:
    A: Solo el pasajero que arrojó la basura
    B: El conductor del vehículo
    C: El propietario del vehículo, independientemente de quién estuviera conduciendo
    D: Nadie, a menos que un oficial de policía lo vea suceder
  answer: B
  explanation: Según la ley de Luisiana, el conductor es responsable de cualquier
    basura arrojada desde su vehículo, independientemente de quién la haya arrojado.
- id: 73
  category: driver_responsibility
  question: ¿A qué ocupantes de un vehículo de pasajeros se aplica la ley de uso obligatorio
    del cinturón de seguridad de Luisiana?
  choices:
    A: Solo al conductor y a los pasajeros del asiento delantero
    B: Solo a los pasajeros menores de 18 años
    C: A todos los ocupantes, independientemente de su posición en el asiento
    D: Solo al conductor
  answer: C
  explanation: La ley de Luisiana exige que todas las personas en un vehículo de pasajeros
    (automóviles, camionetas, furgonetas) estén debidamente abrochadas, independientemente
    de dónde estén sentadas.
- id: 74
  category: safe_driving_rules
  question: Según la ley de Luisiana, ¿a cuántos pies de un hidrante (toma de agua
    para incendios) no se puede estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: El Estatuto Revisado de Luisiana 32:143 prohíbe estacionar un vehículo
    a menos de 15 pies de un hidrante.
- id: 75
  category: safe_driving_rules
  question: En Luisiana, es ilegal que cualquier conductor use un dispositivo de comunicación
    inalámbrica para enviar mensajes de texto mientras opera un vehículo motorizado.
    Para los conductores menores de 18 años, ¿cuál es la regla con respecto al uso
    del teléfono celular?
  choices:
    A: Pueden usar solo dispositivos de manos libres.
    B: Pueden usar teléfonos celulares para llamadas pero no para mensajes de texto.
    C: Tienen prohibido el uso de cualquier tipo de dispositivo de comunicación inalámbrica
      mientras conducen.
    D: Pueden usar teléfonos celulares solo durante las horas del día.
  answer: C
  explanation: La ley de Luisiana prohíbe que cualquier conductor menor de 18 años
    utilice cualquier dispositivo de comunicación inalámbrica (portátil o de manos
    libres) mientras opera un vehículo motorizado.
- id: 76
  category: safe_driving_rules
  question: 'Al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una carretera de varios carriles, la ley ''Move Over'' (Hacerse a un lado)
    de Luisiana le exige:'
  choices:
    A: Detenerse inmediatamente en su carril.
    B: Mantener la velocidad pero tocar la bocina.
    C: Cambiarse a un carril que no sea adyacente al vehículo, si es seguro hacerlo.
    D: Acelerar para pasar el vehículo rápidamente.
  answer: C
  explanation: La ley RS 32:125 de Luisiana exige que los conductores se muevan a
    un carril que no sea adyacente al vehículo de emergencia o que reduzcan la velocidad
    si cambiar de carril no es seguro.
- id: 77
  category: safe_driving_rules
  question: Según la ley de Luisiana, ¿cuál es la distancia mínima que un automovilista
    debe mantener al rebasar una bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley RS 32:76.1 de Luisiana (la 'Ley de Protección Colin Goodier')
    exige que los automovilistas dejen al menos tres pies de distancia entre su vehículo
    y una bicicleta al rebasarla.
- id: 78
  category: safe_driving_rules
  question: Al detenerse en un cruce de ferrocarril en Luisiana, ¿a cuántos pies del
    riel más cercano debe detener su vehículo?
  choices:
    A: Entre 5 y 25 pies
    B: Entre 10 y 30 pies
    C: Entre 15 y 50 pies
    D: Entre 20 y 100 pies
  answer: C
  explanation: La ley de Luisiana exige que los conductores se detengan entre 15 y
    50 pies del riel más cercano de un cruce de ferrocarril cuando las señales están
    parpadeando o se aproxima un tren.
- id: 79
  category: safe_driving_rules
  question: En Luisiana, ¿cuándo es obligatorio encender los faros delanteros?
  choices:
    A: Solo entre la puesta del sol y el amanecer.
    B: Siempre que conduzca por una carretera de dos carriles.
    C: Siempre que use los limpiaparabrisas debido al clima inclemente.
    D: Solo cuando la visibilidad sea inferior a 100 pies.
  answer: C
  explanation: La ley RS 32:281 de Luisiana exige que los conductores tengan los faros
    encendidos cuando los limpiaparabrisas estén en uso debido a la lluvia, la niebla
    o la nieve.
- id: 80
  category: safe_driving_rules
  question: En Luisiana, ¿un giro a la izquierda con luz roja se permite solo bajo
    cuál de las siguientes condiciones?
  choices:
    A: Desde una calle de doble sentido hacia una calle de un solo sentido.
    B: Desde una calle de un solo sentido hacia otra calle de un solo sentido.
    C: En cualquier intersección si no viene tráfico.
    D: Los giros a la izquierda en rojo nunca están permitidos en Luisiana.
  answer: B
  explanation: La ley RS 32:232 de Luisiana permite un giro a la izquierda en rojo
    solo cuando se gira desde una calle de un solo sentido hacia otra calle de un
    solo sentido, después de detenerse por completo y ceder el paso al tráfico y a
    los peatones.
- id: 81
  category: safe_driving_rules
  question: ¿Qué sucede con la multa estándar si lo sorprenden excediendo el límite
    de velocidad en una zona de obras viales en Luisiana mientras hay trabajadores
    presentes?
  choices:
    A: Se reduce si tiene un historial limpio.
    B: Permanece igual.
    C: Se duplica.
    D: Se triplica.
  answer: C
  explanation: Louisiana RS 32:57 establece que las multas por exceso de velocidad
    u otras infracciones de tránsito se duplican cuando se cometen en una zona de
    obras viales designada.
- id: 82
  category: safe_driving_rules
  question: Según la ley de Luisiana, ¿a cuántos pies de un cruce de peatones en una
    intersección está prohibido estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Louisiana RS 32:143 prohíbe estacionarse a menos de 20 pies de un cruce
    de peatones en una intersección.
- id: 83
  category: safe_driving_rules
  question: Usted conduce por una carretera con una mediana física o barrera que separa
    las direcciones de viaje. Un autobús escolar está detenido en el lado opuesto
    de la mediana con sus luces rojas intermitentes. ¿Qué debe hacer?
  choices:
    A: Detenerse y esperar hasta que las luces dejen de parpadear.
    B: Reducir la velocidad a 15 mph y proceder con precaución.
    C: No es necesario detenerse.
    D: Detenerse solo si hay niños cruzando la mediana.
  answer: C
  explanation: En Luisiana, no es necesario detenerse ante un autobús escolar si viaja
    en la dirección opuesta en una carretera que está dividida por una barrera física
    o mediana (RS 32:80).
- id: 84
  category: safe_driving_rules
  question: Según la 'Ley de Cinturones de Seguridad de Luisiana', ¿quién está obligado
    a usar cinturón de seguridad en un vehículo de pasajeros?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero.
    B: Solo los pasajeros menores de 18 años.
    C: Todos los ocupantes del vehículo, independientemente de su posición en el asiento.
    D: Solo el conductor.
  answer: C
  explanation: Louisiana RS 32:295.1 exige que cada ocupante de un automóvil de pasajeros,
    camioneta o pickup tenga un cinturón de seguridad debidamente abrochado en todo
    momento cuando el vehículo esté en movimiento hacia adelante.
- id: 85
  category: safe_driving_rules
  question: En Luisiana, ¿a cuántos pies de una señal de alto, una baliza intermitente
    o una señal de control de tráfico no se puede estacionar?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: Louisiana RS 32:143 prohíbe estacionarse a menos de 30 pies al aproximarse
    a cualquier baliza intermitente, señal de alto o señal de control de tráfico ubicada
    al costado de una calzada.
- id: 86
  category: safe_driving_rules
  question: ¿Qué regla recomienda la Guía del Conductor de Luisiana para mantener
    una distancia de seguimiento segura detrás del vehículo que va delante de usted?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los tres segundos
    D: La regla de los cinco segundos
  answer: C
  explanation: La Guía del Conductor de Luisiana recomienda una distancia de seguimiento
    mínima de tres segundos para permitir un tiempo de reacción adecuado.
- id: 87
  category: safe_driving_rules
  question: En Luisiana, cuando se aproxima a un autobús escolar que está detenido
    cargando o descargando niños, ¿cuál es la distancia mínima a la que debe detenerse
    del autobús?
  choices:
    A: 10 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Según la Guía del Conductor de Luisiana, debe detenerse al menos a
    30 pies de un autobús escolar detenido que esté cargando o descargando niños.
- id: 88
  category: safe_driving_rules
  question: Cuando tenga la intención de girar, la ley de Luisiana exige que señale
    su intención al menos ¿cuántos pies antes de realizar el giro?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: La ley de Luisiana exige que los conductores den una señal continua
    durante al menos 100 pies antes de girar.
- id: 89
  category: safe_driving_rules
  question: En Luisiana, ¿es ilegal rebasar a otro vehículo cuando se encuentra a
    cuántos pies de una intersección o cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Luisiana prohíbe rebasar a otro vehículo al aproximarse a
    menos de 100 pies de una intersección, cruce de ferrocarril, puente, viaducto
    o túnel.
- id: 90
  category: safe_driving_rules
  question: En Luisiana, ¿no puede estacionar su vehículo a menos de cuántos pies
    de un cruce de peatones en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: La ley de Luisiana prohíbe estacionarse a menos de 20 pies de un cruce
    de peatones en una intersección.
- id: 91
  category: safe_driving_rules
  question: La ley de 'Hacerse a un lado' (Move Over) de Louisiana requiere que los
    conductores hagan ¿qué? al acercarse a un vehículo de emergencia autorizado detenido
    a la orilla de la carretera con luces intermitentes.
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Mantener la velocidad y permanecer en el carril actual
    C: Despejar el carril más cercano al vehículo si es seguro, o reducir la velocidad
    D: Acelerar para rebasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley Move Over de Louisiana exige que los conductores se muevan a
    un carril que no esté adyacente al vehículo de emergencia si es posible, o que
    reduzcan la velocidad a una velocidad segura si no es posible cambiar de carril.
- id: 92
  category: safe_driving_rules
  question: ¿A qué velocidad puede comenzar el hidroplaneo (los neumáticos pierden
    contacto con la superficie de la carretera) en carreteras mojadas en Louisiana?
  choices:
    A: 25 mph
    B: 35 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: Según la Guía del Conductor de Louisiana, el hidroplaneo puede comenzar
    a velocidades tan bajas como 35 mph y se vuelve completo a las 55 mph.
- id: 93
  category: safe_driving_rules
  question: 'La ley de Louisiana exige que sus faros delanteros estén encendidos siempre
    que esté utilizando sus:'
  choices:
    A: Señales de giro
    B: Limpiaparabrisas
    C: Luces de emergencia
    D: Aire acondicionado
  answer: B
  explanation: La ley de Louisiana exige que los conductores tengan encendidos los
    faros delanteros cuando los limpiaparabrisas estén en uso debido a la lluvia,
    la niebla o la nieve.
- id: 94
  category: safe_driving_rules
  question: ¿A cuántos pies de la entrada de una estación de bomberos en el mismo
    lado de la calle está prohibido estacionarse?
  choices:
    A: 15 pies
    B: 20 pies
    C: 50 pies
    D: 75 pies
  answer: B
  explanation: La ley de Louisiana prohíbe estacionarse a menos de 20 pies de la entrada
    de cualquier estación de bomberos en el mismo lado de la calle.
- id: 95
  category: defensive_driving
  question: Según la Guía del Conductor de Louisiana, ¿cuál es la distancia de seguimiento
    recomendada detrás del vehículo que va delante de usted bajo condiciones de conducción
    ideales?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: Louisiana utiliza la 'regla de los tres segundos' para determinar una
    distancia de seguimiento segura. Esta debe aumentarse a cuatro segundos o más
    durante el mal tiempo o en carreteras mojadas.
- id: 96
  category: defensive_driving
  question: Bajo la ley de Louisiana (RS 32:301), ¿cuándo se requiere que los conductores
    tengan encendidos sus faros delanteros?
  choices:
    A: Solo entre la puesta del sol y la salida del sol
    B: Solo cuando la visibilidad es inferior a 1,000 pies
    C: Siempre que los limpiaparabrisas del vehículo estén en uso continuo debido
      a la lluvia o la niebla
    D: Solo cuando se conduce por autopistas
  answer: C
  explanation: La ley de Louisiana exige que los faros estén encendidos cuando los
    limpiaparabrisas están en uso, así como entre la puesta del sol y la salida del
    sol, o cuando la visibilidad es inferior a 500 pies.
- id: 97
  category: defensive_driving
  question: Para evitar el frenado de último minuto o la necesidad de girar repentinamente,
    la Guía del Conductor de Louisiana sugiere observar la carretera ¿con cuánta anticipación?
  choices:
    A: 5 a 8 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: 500 pies
  answer: B
  explanation: Los conductores deben mirar de 10 a 15 segundos hacia adelante para
    identificar posibles peligros a tiempo y permitir tiempo para reaccionar de manera
    segura.
- id: 98
  category: defensive_driving
  question: Al conducir con niebla densa en Louisiana, ¿qué ajuste de luces debe usar
    para garantizar la máxima visibilidad y seguridad?
  choices:
    A: Luces altas (High beams)
    B: Luces bajas (Low beams)
    C: Solo luces de estacionamiento
    D: Solo luces intermitentes de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque la luz de las luces
    altas se refleja en las gotas de agua de la niebla, lo que provoca deslumbramiento
    y dificulta la visión.
- id: 99
  category: defensive_driving
  question: 'En Louisiana, usted NO está obligado a detenerse ante un autobús escolar
    con sus luces rojas intermitentes y el brazo de parada extendido si:'
  choices:
    A: Viaja en la dirección opuesta en una carretera con una mediana física o barrera
    B: Tiene prisa y el autobús está detenido por más de 2 minutos
    C: Viaja en la misma dirección en una carretera de cuatro carriles
    D: El autobús está detenido en una zona residencial
  answer: A
  explanation: Según LA RS 32:80, no tiene que detenerse ante un autobús escolar si
    se encuentra en el lado opuesto de una carretera dividida por una mediana, zanja
    o barrera de concreto.
- id: 100
  category: defensive_driving
  question: En Louisiana, ¿con cuánta anticipación debe señalar su intención de girar
    o cambiar de carril?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: La ley LA RS 32:104 exige que los conductores den una señal de intención
    de girar continuamente durante no menos de los últimos 100 pies recorridos por
    el vehículo antes de girar.
- id: 101
  category: defensive_driving
  question: 'En Louisiana, es ilegal seguir a un vehículo de emergencia (como un camión
    de bomberos) que responde a una alarma a una distancia menor de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley LA RS 32:286 establece que el conductor de cualquier vehículo
    no debe seguir a ningún aparato de bomberos que viaje en respuesta a una alarma
    de incendio a una distancia menor de 500 pies.
- id: 102
  category: defensive_driving
  question: Al conducir cerca de camiones grandes, debe mantenerse fuera de su 'Zona-No'
    (No-Zone). ¿Dónde se encuentran estos puntos ciegos?
  choices:
    A: Solo directamente detrás del camión
    B: Solo en el lado izquierdo del camión
    C: Directamente adelante, directamente atrás y a ambos lados del camión
    D: Solo en el lado derecho del camión
  answer: C
  explanation: La 'Zona-No' se refiere a los grandes puntos ciegos alrededor de un
    camión donde el conductor no puede verlo. Esto incluye la parte delantera, trasera
    y ambos lados.
- id: 103
  category: defensive_driving
  question: 'Si usted está involucrado en una colisión en Louisiana que resulte en
    lesiones, muerte o daños a la propiedad que superen los $500, debe:'
  choices:
    A: Esperar 24 horas antes de informarlo
    B: Informarlo solo si usted tuvo la culpa
    C: Informar inmediatamente el accidente a la policía local, al alguacil (sheriff)
      o a la policía estatal
    D: Solo intercambiar información del seguro y retirarse
  answer: C
  explanation: La ley de Louisiana exige un informe inmediato a la agencia de aplicación
    de la ley más cercana para cualquier accidente que involucre lesiones, muerte
    o daños a la propiedad superiores a $500.
- id: 104
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente
    en Louisiana, ¿con cuánta anticipación debe observar el camino?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: Solo al vehículo que está directamente delante de usted
  answer: B
  explanation: La Guía del Conductor de Louisiana establece que los conductores deben
    mirar de 10 a 15 segundos hacia adelante para tener tiempo de prepararse para
    las condiciones del tráfico y los peligros.
- id: 105
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning) en las condiciones
    climáticas de Louisiana, haciendo que los neumáticos pierdan contacto con la superficie
    de la carretera?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 60 mph
    C: Exactamente a 55 mph
    D: Solo cuando los neumáticos están desgastados
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph,
    y a 50 mph, los neumáticos pueden perder todo contacto con la carretera.
- id: 106
  category: defensive_driving
  question: Si conduce bajo una lluvia intensa o en carreteras resbaladizas en Louisiana,
    ¿cómo debe ajustar su distancia de seguimiento?
  choices:
    A: Mantenerla en 3 segundos
    B: Disminuirla a 2 segundos para mantenerse cerca del vehículo de adelante
    C: Aumentarla a al menos 4 segundos o más
    D: La distancia de seguimiento no importa bajo la lluvia
  answer: C
  explanation: La Guía del Conductor de Louisiana aconseja aumentar la distancia de
    seguimiento durante condiciones climáticas adversas para permitir distancias de
    frenado más largas.
- id: 107
  category: defensive_driving
  question: 'Para revisar sus ''puntos ciegos'' antes de cambiar de carril en Louisiana,
    debe:'
  choices:
    A: Revisar su espejo retrovisor
    B: Revisar sus espejos laterales
    C: Girar la cabeza y mirar por encima del hombro en la dirección en la que planea
      moverse
    D: Tocar la bocina para ver si hay alguien allí
  answer: C
  explanation: Los espejos no lo muestran todo; es necesario realizar una comprobación
    por encima del hombro para ver los vehículos en los puntos ciegos antes de cambiar
    de carril.
- id: 108
  category: defensive_driving
  question: Al observar una intersección en busca de posibles peligros, ¿en qué orden
    debe mirar?
  choices:
    A: Izquierda, luego derecha
    B: Derecha, luego izquierda
    C: Izquierda, derecha, luego a la izquierda otra vez
    D: Solo hacia adelante
  answer: C
  explanation: Las pautas de conducción de Louisiana sugieren mirar a la izquierda,
    luego a la derecha y luego a la izquierda otra vez porque el primer peligro proviene
    de la izquierda.
- id: 109
  category: defensive_driving
  question: 'En Louisiana, las carreteras están más resbaladizas cuando empieza a
    llover por primera vez porque:'
  choices:
    A: El agua está más fría en ese momento
    B: El aceite y la grasa en el pavimento se mezclan con el agua
    C: Los neumáticos todavía están calientes por la conducción en seco
    D: La visibilidad está en su punto más bajo
  answer: B
  explanation: Durante los primeros minutos de lluvia, el aceite y la grasa suben
    a la superficie de la carretera, creando una película muy resbaladiza antes de
    ser lavados por el agua.
- id: 110
  category: defensive_driving
  question: Al entrar en una curva en la carretera, ¿cuál es la técnica de conducción
    defensiva más segura con respecto a su velocidad?
  choices:
    A: Frenar fuerte mientras está en medio de la curva
    B: Acelerar antes de entrar en la curva
    C: Reducir la velocidad antes de entrar en la curva
    D: Mantener su velocidad y frenar solo si siente que el vehículo se desliza
  answer: C
  explanation: Las pautas de seguridad de Louisiana aconsejan a los conductores reducir
    la velocidad antes de entrar en una curva para mantener una mejor tracción y control.
- id: 111
  category: alcohol_drugs_health
  question: Según la ley de "Tolerancia Cero" de Louisiana, ¿cuál es el límite de
    concentración de alcohol en sangre (BAC) para conductores menores de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: B
  explanation: Louisiana tiene una política de Tolerancia Cero para el consumo de
    alcohol y la conducción de menores de edad; el límite legal para cualquier persona
    menor de 21 años es de 0.02%.
- id: 112
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de "Consentimiento Implícito" de Louisiana para
    los conductores?
  choices:
    A: Usted acepta que su vehículo sea registrado en cualquier momento.
    B: Usted acepta someterse a una prueba química de concentración de alcohol en
      sangre si lo solicita un oficial.
    C: Usted acepta portar un seguro de responsabilidad civil mínimo.
    D: Usted acepta permitir que los pasajeros consuman alcohol en su vehículo.
  answer: B
  explanation: Al operar un vehículo motorizado en Louisiana, usted ha dado su "consentimiento
    implícito" para una prueba química (aliento, sangre u orina) para determinar la
    presencia de alcohol o drogas.
- id: 113
  category: alcohol_drugs_health
  question: 'Según la Ley de Contenedores Abiertos de Louisiana, es ilegal:'
  choices:
    A: Tener una bebida alcohólica en el maletero del coche.
    B: Poseer una bebida alcohólica abierta en el área de pasajeros de un vehículo
      motorizado en una vía pública.
    C: Transportar cerveza sin abrir en el asiento trasero.
    D: Beber agua mientras conduce.
  answer: B
  explanation: La ley de Louisiana prohíbe la posesión de un contenedor de bebida
    alcohólica abierto en el área de pasajeros de cualquier vehículo motorizado mientras
    se encuentre en una vía pública.
- id: 114
  category: alcohol_drugs_health
  question: Según la Ley de Peligro para Menores (Child Endangerment Act) de Louisiana,
    las sanciones por DWI aumentan si hay un niño de ¿qué edad o menor en el vehículo?
  choices:
    A: 12 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: A
  explanation: La Ley de Peligro para Menores establece sanciones mayores si una persona
    es condenada por DWI mientras un niño de 12 años o menos es pasajero en el vehículo.
- id: 115
  category: alcohol_drugs_health
  question: 'En Louisiana, si es condenado por una primera ofensa de DWI y su BAC
    era de 0.15% o superior, usted debe:'
  choices:
    A: Perder su vehículo permanentemente.
    B: Instalar un dispositivo de interbloqueo de encendido (IID) durante al menos
      12 meses.
    C: Cumplir una sentencia obligatoria de 1 año de cárcel.
    D: Pagar una multa de al menos $5,000.
  answer: B
  explanation: Para una primera ofensa de DWI con un BAC de 0.15% o superior, la ley
    de Louisiana exige la instalación de un dispositivo de interbloqueo de encendido
    (IID) durante al menos 12 meses.
- id: 116
  category: alcohol_drugs_health
  question: ¿Qué es el "efecto sinérgico" en el contexto de la seguridad al conducir?
  choices:
    A: El efecto de conducir estando cansado.
    B: El efecto combinado del alcohol y las drogas, que es mayor que la suma de sus
      partes.
    C: El efecto de conducir bajo una lluvia intensa.
    D: La mejora de la concentración causada por la cafeína.
  answer: B
  explanation: El efecto sinérgico ocurre cuando se consumen alcohol y drogas (incluso
    las recetadas) al mismo tiempo, lo que multiplica los efectos de deterioro en
    el conductor.
- id: 117
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo le toma al cuerpo procesar y eliminar el alcohol de una
    bebida estándar (por ejemplo, una cerveza de 12 oz)?
  choices:
    A: Unos 15 minutos
    B: Unos 30 minutos
    C: Aproximadamente 1 hora
    D: Unas 3 horas
  answer: C
  explanation: En promedio, el cuerpo humano tarda aproximadamente una hora en procesar
    y eliminar el alcohol contenido en una bebida estándar.
- id: 118
  category: alcohol_drugs_health
  question: En Louisiana, una condena por una segunda ofensa de DWI resulta en una
    sentencia de cárcel mínima obligatoria de ¿cuántas horas?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 96 horas
  answer: B
  explanation: Una condena por una segunda ofensa de DWI en Louisiana conlleva un
    mínimo obligatorio de 48 horas de cárcel, aunque la sentencia puede ser mucho
    más larga.
- id: 119
  category: alcohol_drugs_health
  question: 'Si tiene una condición médica (como epilepsia o diabetes) que pueda afectar
    su capacidad para conducir, la ley de Louisiana le exige:'
  choices:
    A: Dejar de conducir inmediata y permanentemente.
    B: Informar sobre la condición a la Oficina de Vehículos Motorizados (OMV).
    C: Conducir únicamente durante las horas del día.
    D: Llevar a un médico en el coche en todo momento.
  answer: B
  explanation: La ley de Louisiana exige que los conductores informen a la OMV sobre
    cualquier discapacidad física o mental que pueda afectar su capacidad para conducir
    de manera segura.
- id: 120
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la marihuana
    y la conducción en Louisiana?
  choices:
    A: Es legal conducir bajo la influencia de la marihuana si tiene una receta médica.
    B: La marihuana no afecta el tiempo de reacción.
    C: Usted puede ser condenado por un DWI por conducir bajo la influencia de la
      marihuana.
    D: La marihuana solo afecta la conducción si se fuma, no si se ingiere.
  answer: C
  explanation: En Louisiana, un cargo de DWI se aplica al deterioro causado por cualquier
    sustancia, incluidas las drogas ilegales, los medicamentos recetados o la marihuana,
    independientemente de si fue recetada legalmente.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál es la forma principal de "recuperar la sobriedad" antes de conducir
    después de consumir alcohol?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Permitir que el cuerpo procese el alcohol con el tiempo
  answer: D
  explanation: El tiempo es la única forma efectiva de reducir su nivel de alcohol
    en sangre (BAC) y recuperar la sobriedad. El café, las duchas y el ejercicio no
    aceleran la eliminación del alcohol del torrente sanguíneo.
- id: 122
  category: alcohol_drugs_health
  question: 'En Louisiana, si usted se ve involucrado en un choque que resulta en
    una fatalidad y el oficial tiene motivos para creer que usted estaba intoxicado,
    el oficial:'
  choices:
    A: Debe esperar una orden judicial para analizar su sangre.
    B: Solo puede realizarle la prueba si usted está consciente.
    C: Puede usar una fuerza razonable para exigirle que se someta a una prueba química.
    D: No puede realizarle la prueba si tiene un historial de conducción limpio.
  answer: C
  explanation: Según la ley de Louisiana, si un conductor se ve involucrado en una
    colisión que resulte en una fatalidad o lesiones corporales graves, se le puede
    exigir que se someta a una prueba química, y se puede utilizar una fuerza razonable
    si se niega.
- id: 123
  category: alcohol_drugs_health
  question: 'Bajo la ley de "Tolerancia Cero" de Louisiana, se considera que un conductor
    menor de 21 años conduce bajo los efectos del alcohol si su nivel de alcohol en
    sangre (BAC) es igual o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: B
  explanation: Louisiana tiene una política de Tolerancia Cero para menores; un BAC
    de 0.02% o superior para cualquier persona menor de 21 años resulta en un cargo
    por conducir bajo la influencia (DUI).
- id: 124
  category: alcohol_drugs_health
  question: ¿Qué prohíbe la ley de "Contenedor Abierto" de Louisiana?
  choices:
    A: Cualquier bebida alcohólica en el maletero de un automóvil.
    B: Cualquier bebida alcohólica abierta en el área de pasajeros de un vehículo
      motorizado.
    C: Transportar vino sin abrir en el asiento trasero.
    D: Comprar alcohol en una tienda de daiquiris con servicio al auto si el sello
      está intacto.
  answer: B
  explanation: La ley de Louisiana prohíbe la posesión de cualquier contenedor de
    bebida alcohólica abierto en el área de pasajeros de un vehículo motorizado mientras
    se encuentre en una vía pública.
- id: 125
  category: alcohol_drugs_health
  question: Según la ley de Louisiana, ¿se activa una penalización por "Poner en Peligro
    a un Menor" (Child Endangerment) si se comete un DWI con un niño de qué edad o
    menor en el vehículo?
  choices:
    A: 12 años
    B: 13 años
    C: 15 años
    D: 17 años
  answer: A
  explanation: Si una persona es declarada culpable de conducir intoxicada (DWI) y
    un niño de 12 años o menos estaba en el vehículo, la ley exige un tiempo mínimo
    de cárcel que no puede ser suspendido.
- id: 126
  category: alcohol_drugs_health
  question: 'En Louisiana, una condena por DWI por primera vez requiere la instalación
    de un dispositivo de bloqueo de encendido si el BAC del conductor fue igual o
    superior a:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: La ley de Louisiana exige el uso de un dispositivo de bloqueo de encendido
    durante al menos 12 meses en la primera infracción si el BAC del conductor fue
    de 0.15% o superior.
- id: 127
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo permanece una condena por DWI en su registro de conducir
    en Louisiana a efectos de sentencia como reincidente?
  choices:
    A: 3 años
    B: 5 años
    C: 10 años
    D: Permanentemente
  answer: C
  explanation: Louisiana utiliza un "período de limpieza" de 10 años. Las condenas
    por DWI en los últimos 10 años se utilizan para determinar si un cargo actual
    es una segunda, tercera o cuarta infracción.
- id: 128
  category: alcohol_drugs_health
  question: Después de un arresto por DWI en Louisiana, ¿cuántos días tiene para solicitar
    una audiencia administrativa para impugnar la suspensión de su licencia?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Los conductores tienen 30 días a partir de la fecha del arresto para
    solicitar una audiencia administrativa ante el Departamento de Seguridad Pública
    para impugnar la suspensión de la licencia.
- id: 129
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado o de venta libre, ¿cuál es su
    responsabilidad como conductor en Louisiana?
  choices:
    A: Solo es responsable si también consume alcohol.
    B: Debe revisar la etiqueta para ver las advertencias sobre el manejo de maquinaria
      pesada o la conducción.
    C: Puede conducir siempre que se sienta bien.
    D: Los medicamentos recetados nunca resultan en un cargo por DWI.
  answer: B
  explanation: Los conductores son responsables de conocer los efectos secundarios
    de sus medicamentos. Si un medicamento afecta su capacidad para conducir de manera
    segura, puede ser acusado de DWI.
- id: 130
  category: alcohol_drugs_health
  question: 'En Louisiana, una tercera condena por DWI se clasifica como:'
  choices:
    A: Infracción de tráfico
    B: Delito menor (Misdemeanor)
    C: Delito grave (Felony)
    D: Infracción civil
  answer: C
  explanation: Una tercera condena por DWI en Louisiana es un delito grave (felony),
    que conlleva sanciones mucho más severas, incluyendo tiempo de prisión obligatorio
    y la incautación del vehículo.
- id: 131
  category: penalties_and_points
  question: Según la ley de "Consentimiento Implícito" (Implied Consent) de Louisiana,
    ¿cuál es la sanción por negarse por primera vez a someterse a una prueba química
    de intoxicación?
  choices:
    A: Una multa de $1,000 y 30 días de cárcel
    B: Suspensión de los privilegios de conducir por 180 días
    C: Suspensión de los privilegios de conducir por 30 días
    D: Una estancia obligatoria de 48 horas en la cárcel
  answer: B
  explanation: Al operar un vehículo motorizado en Louisiana, usted otorga su consentimiento
    implícito para someterse a pruebas químicas. La negativa a realizar la prueba
    resulta en la suspensión de la licencia por 180 días por una primera infracción.
- id: 132
  category: penalties_and_points
  question: La ley de "No paga, no juega" (No Pay, No Play) de Louisiana impide que
    los conductores sin seguro cobren ¿cuál de los siguientes después de un accidente,
    incluso si el otro conductor tiene la culpa?
  choices:
    A: Los primeros $15,000 de lesiones corporales y los primeros $25,000 de daños
      a la propiedad
    B: Cualquier gasto médico en absoluto
    C: El valor total de su vehículo
    D: Solo los honorarios de la sala de emergencias
  answer: A
  explanation: La ley "No Pay, No Play" (LA R.S. 32:866) prohíbe a los conductores
    sin seguro cobrar los primeros $15,000 en daños por lesiones corporales y los
    primeros $25,000 en daños a la propiedad.
- id: 133
  category: penalties_and_points
  question: ¿En Louisiana, cuál es el cargo por restablecimiento de una licencia de
    conducir suspendida por la PRIMERA infracción de la ley de seguridad de responsabilidad
    civil obligatoria para vehículos motorizados (falta de seguro)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Por una primera infracción de conducir sin seguro, el cargo por restablecimiento
    de la licencia de conducir es de $100.
- id: 134
  category: penalties_and_points
  question: Si un conductor en Louisiana es condenado por rebasar un autobús escolar
    detenido mientras sus luces rojas están parpadeando, ¿cuál es la multa máxima
    por una primera infracción?
  choices:
    A: Hasta $100
    B: Hasta $250
    C: Hasta $500
    D: Hasta $1,000
  answer: C
  explanation: Rebasar un autobús escolar detenido con señales visuales activadas
    es una infracción grave en Louisiana, que conlleva una multa de hasta $500 y/o
    30 días de cárcel por una primera infracción.
- id: 135
  category: penalties_and_points
  question: Según la ley de Louisiana, ¿qué sucede con las multas por exceso de velocidad
    cuando la infracción ocurre en una zona de obras viales designada mientras hay
    trabajadores presentes?
  choices:
    A: Las multas se triplican
    B: Las multas se duplican
    C: La licencia de conducir se suspende automáticamente
    D: La multa se incrementa en un monto fijo de $500
  answer: B
  explanation: La ley de Louisiana exige que las multas por exceso de velocidad se
    dupliquen en las zonas de obras de construcción o mantenimiento cuando hay trabajadores
    presentes.
- id: 136
  category: penalties_and_points
  question: En Louisiana, ¿cuántas horas de servicio comunitario son obligatorias
    por una condena de primera infracción por "arrojar basura de forma simple" (simple
    littering)?
  choices:
    A: 4 horas
    B: 8 horas
    C: 16 horas
    D: 40 horas
  answer: B
  explanation: Bajo la ley LA R.S. 30:2531, una primera condena por arrojar basura
    de forma simple requiere que la persona cumpla 8 horas de servicio comunitario
    en un programa de reducción de basura.
- id: 137
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en la revocación OBLIGATORIA
    de una licencia de conducir de Louisiana?
  choices:
    A: Una sola multa por exceso de velocidad de 10 mph sobre el límite
    B: No usar una señal de giro
    C: Homicidio involuntario (manslaughter) resultante de la operación de un vehículo
      motorizado
    D: Conducir con una luz trasera rota
  answer: C
  explanation: La ley de Louisiana exige la revocación obligatoria de la licencia
    por delitos graves, incluido el homicidio involuntario resultante de la operación
    de un vehículo motorizado.
- id: 138
  category: penalties_and_points
  question: Según la ley de Louisiana, ¿los conductores menores de 18 años tienen
    prohibido usar cuál de los siguientes mientras conducen?
  choices:
    A: Cualquier dispositivo de comunicación inalámbrica, incluidos los de manos libres
    B: Solo teléfonos celulares de mano
    C: Solo dispositivos de mensajes de texto
    D: Radios AM/FM
  answer: A
  explanation: La ley de Louisiana prohíbe que cualquier conductor menor de 18 años
    utilice cualquier dispositivo de comunicación inalámbrica (teléfono celular, computadora
    portátil, etc.), ya sea de mano o manos libres, mientras opera un vehículo motorizado.
- id: 139
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor que no se detiene en un cruce de
    ferrocarril cuando una señal está parpadeando o se aproxima un tren?
  choices:
    A: Una multa de $100 a $500 y/o hasta 30 días de cárcel
    B: Una advertencia verbal por la primera infracción
    C: Confiscación obligatoria del vehículo por 60 días
    D: Pérdida permanente de los privilegios de conducir
  answer: A
  explanation: No detenerse en un cruce de ferrocarril cuando es obligatorio es una
    infracción peligrosa en Louisiana, sancionable con una multa de $100 a $500 y/o
    tiempo de cárcel por una primera infracción.
- id: 140
  category: penalties_and_points
  question: En Louisiana, si usted está involucrado en un choque que resulta en lesiones,
    muerte o daños a la propiedad que superen los $500, ¿dentro de cuántos días debe
    enviar un informe por escrito al DPS?
  choices:
    A: 24 horas
    B: 5 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: La ley de Louisiana exige que se presente un informe por escrito (SR-10)
    ante el Departamento de Seguridad Pública (DPS) dentro de los 15 días si un choque
    resulta en lesiones, muerte o daños a la propiedad de más de $500, a menos que
    un oficial de policía haya investigado y presentado un informe.
- id: 141
  category: penalties_and_points
  question: ¿Cuál es la sanción legal por participar en 'Carreras de aceleración'
    (Drag Racing) en las vías públicas de Louisiana por una primera infracción?
  choices:
    A: Una multa de $50
    B: Una multa de hasta $500 y/o hasta seis meses de cárcel
    C: Revocación obligatoria de la licencia por 5 años
    D: No existe una sanción específica para las carreras
  answer: B
  explanation: Las carreras de aceleración son ilegales en las vías públicas de Louisiana.
    Una primera infracción puede conllevar una multa de hasta $500 y/o encarcelamiento
    de hasta seis meses.
- id: 142
  category: penalties_and_points
  question: Si un conductor de Louisiana es condenado por una segunda infracción de
    DWI dentro de un periodo de 10 años, ¿cuál es el tiempo mínimo obligatorio de
    cárcel?
  choices:
    A: 48 horas
    B: 10 días
    C: 30 días
    D: 90 días
  answer: C
  explanation: Para una segunda condena por DWI en Louisiana, la ley exige un mínimo
    obligatorio de 30 días de cárcel, aunque partes de esta condena pueden suspenderse
    bajo condiciones específicas como servicio comunitario y libertad condicional
    (probation).
- id: 143
  category: penalties_and_points
  question: Si sus privilegios de conducción en Louisiana son suspendidos por no presentar
    un comprobante de seguro, ¿cuál es el cargo por restablecimiento para una primera
    infracción?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: La ley de Louisiana exige un cargo de restablecimiento de $100 por
    la primera infracción de no mantener o no proporcionar el comprobante del seguro
    de vehículo motorizado requerido.
- id: 144
  category: penalties_and_points
  question: 'De acuerdo con la ley de Louisiana, una persona condenada por ''Arrojar
    basura intencionalmente'' (Intentional Littering) por primera vez puede ser multada
    con hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Mientras que el arrojar basura de forma simple tiene mínimos más bajos,
    el arrojar basura intencionalmente en Louisiana puede conllevar una multa de hasta
    $1,000 y 8 horas de servicio comunitario en un programa de reducción de basura.
- id: 145
  category: penalties_and_points
  question: 'Violar la ley de ''Hacerse a un lado'' (Move Over) de Louisiana, que
    exige a los conductores cambiar de carril o reducir la velocidad ante vehículos
    de emergencia en la orilla de la carretera, puede resultar en una multa de hasta:'
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Los conductores que no se cambien de carril o no reduzcan la velocidad
    ante vehículos de emergencia estacionados, grúas o vehículos de servicios públicos
    pueden ser multados con hasta $200.
- id: 146
  category: penalties_and_points
  question: 'Por una primera infracción a la ley de Louisiana contra el envío de mensajes
    de texto al conducir, un conductor puede ser multado con hasta:'
  choices:
    A: $175
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: El estatuto R.S. 32:300.5 de Louisiana establece que una primera infracción
    a la prohibición de enviar mensajes de texto mientras se conduce conlleva una
    multa de hasta $500.
- id: 147
  category: penalties_and_points
  question: En Louisiana, su licencia de conducir será revocada de manera OBLIGATORIA
    por ¿cuál de las siguientes infracciones?
  choices:
    A: No detenerse ante una señal de pare
    B: Homicidio involuntario resultante de la operación de un vehículo motorizado
    C: Una sola multa por exceso de velocidad de 10 mph sobre el límite
    D: No utilizar una señal de giro
  answer: B
  explanation: La ley de Louisiana exige la revocación obligatoria de la licencia
    por delitos graves, incluyendo el homicidio involuntario resultante de la operación
    de un vehículo o cualquier delito grave en el que se utilice un vehículo motorizado.
- id: 148
  category: penalties_and_points
  question: 'Si se suspende una licencia de conducir por una segunda infracción de
    seguro en Louisiana, el cargo por restablecimiento aumenta a:'
  choices:
    A: $150
    B: $250
    C: $350
    D: $500
  answer: B
  explanation: El cargo por restablecimiento para una segunda infracción por no mantener
    el seguro requerido es de $250.
- id: 149
  category: penalties_and_points
  question: ¿Cuál es la multa estándar por una primera infracción a la ley del cinturón
    de seguridad de Louisiana para adultos?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: El estatuto R.S. 32:295.1 de Louisiana establece la multa por una primera
    infracción del uso del cinturón de seguridad en adultos en $50, lo cual incluye
    las costas judiciales.
- id: 150
  category: penalties_and_points
  question: Tras una primera condena por DWI en Louisiana, ¿por cuánto tiempo se suspende
    típicamente la licencia de conducir?
  choices:
    A: 90 días
    B: 180 días
    C: 365 días
    D: 2 años
  answer: C
  explanation: Una primera condena por DWI en Louisiana resulta en una suspensión
    de la licencia de 365 días (1 año).
- id: 151
  category: penalties_and_points
  question: 'Si lo sorprenden usando un dispositivo de comunicación inalámbrica mientras
    conduce por una zona escolar señalizada en Louisiana, la multa por la primera
    infracción puede ser de hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: C
  explanation: La ley de Louisiana prohíbe estrictamente el uso de dispositivos inalámbricos
    portátiles en zonas escolares; una primera infracción puede resultar en una multa
    de hasta $500.
- id: 152
  category: penalties_and_points
  question: 'Hacer una declaración falsa bajo juramento ante la OMV con respecto a
    la información de un vehículo motorizado es un delito que resulta en la suspensión
    de la licencia por:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Proporcionar información falsa o cometer perjurio en relación con la
    propiedad u operación de vehículos motorizados resulta en una suspensión de la
    licencia por 6 meses.
- id: 153
  category: penalties_and_points
  question: 'En Louisiana, si un conductor es declarado culpable de ''carreras de
    velocidad'' (drag racing) en una carretera pública, su licencia será:'
  choices:
    A: Suspendida
    B: Marcada con una advertencia
    C: No se verá afectada si es la primera infracción
    D: Restringida únicamente a la conducción diurna
  answer: A
  explanation: Participar en una carrera o competencia de velocidad (drag racing)
    en una carretera pública es una infracción que conlleva la suspensión de los privilegios
    de conducción.
- id: 154
  category: sharing_the_road
  question: Según la ley 'Move Over' (Hacerse a un lado) de Louisiana, ¿qué debe hacer
    un conductor al acercarse a un vehículo de emergencia autorizado detenido a un
    lado de una carretera de varios carriles con sus luces intermitentes encendidas?
  choices:
    A: Detenerse inmediatamente en el carril de tráfico
    B: Aumentar la velocidad para rebasar el vehículo rápidamente
    C: Cambiarse a un carril que no sea adyacente al vehículo, si es posible
    D: Mantener la velocidad y permanecer en el carril actual
  answer: C
  explanation: La ley RS 32:125 de Louisiana exige que los conductores se muevan a
    un carril que no sea adyacente al vehículo de emergencia si es seguro hacerlo,
    o que reduzcan la velocidad a un nivel seguro si no es posible cambiar de carril.
- id: 155
  category: sharing_the_road
  question: En Louisiana, ¿no es obligatorio detenerse ante un autobús escolar en
    una carretera que está dividida por qué característica?
  choices:
    A: Una línea amarilla doble
    B: Un carril central para girar
    C: Una barrera física o una mediana de césped
    D: Una línea blanca discontinua
  answer: C
  explanation: Los conductores que viajan en la dirección opuesta a un autobús escolar
    no están obligados a detenerse si la calzada está separada por una barrera física
    o un espacio intermedio (como una mediana de césped). Un carril de giro no se
    considera una barrera física.
- id: 156
  category: sharing_the_road
  question: Al seguir a una motocicleta en Louisiana, ¿cuál es la distancia de seguimiento
    recomendada para garantizar la seguridad?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 10 segundos
  answer: C
  explanation: La Guía del Conductor de Louisiana recomienda una distancia de seguimiento
    de al menos 4 segundos cuando se circula detrás de una motocicleta para permitir
    maniobras repentinas o condiciones climáticas adversas.
- id: 157
  category: sharing_the_road
  question: Según la ley de Louisiana, cuando un peatón cruza la calle guiado por
    un perro o lleva un bastón blanco, usted debe detenerse por completo si se encuentra
    a cuántos pies de su vehículo?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: A
  explanation: La ley RS 32:217 de Louisiana establece que los conductores deben detenerse
    por completo cuando un peatón ciego o con discapacidad visual cruza la calle y
    se encuentra a menos de 5 pies de la trayectoria del vehículo.
- id: 158
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima y máxima a la que debe detenerse del riel
    más cercano de un cruce ferroviario en Louisiana cuando se acerca un tren?
  choices:
    A: 5 pies a 25 pies
    B: 10 pies a 30 pies
    C: 15 pies a 50 pies
    D: 20 pies a 100 pies
  answer: C
  explanation: La ley de Louisiana exige que los conductores se detengan entre 15
    y 50 pies del riel más cercano de un cruce ferroviario cuando las señales parpadean
    o se acerca un tren.
- id: 159
  category: sharing_the_road
  question: ¿Qué es la 'No-Zone' (Zona Prohibida) en relación con los camiones grandes
    y autobuses en Louisiana?
  choices:
    A: El área donde los camiones no tienen permitido circular
    B: Los puntos ciegos alrededor de la parte delantera, trasera y los lados del
      camión
    C: La zona de límite de velocidad para vehículos comerciales
    D: El límite de peso para los puentes
  answer: B
  explanation: La 'No-Zone' se refiere a los grandes puntos ciegos alrededor de un
    camión o autobús donde el conductor no puede ver su vehículo. Si no puede ver
    la cara del conductor del camión en su espejo lateral, él no puede verlo a usted.
- id: 160
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, es posible que el camión necesite:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Abrirse ampliamente y usar parte del carril izquierdo para completar el giro
    C: Detenerse y esperar a que el tráfico se despeje en ambas direcciones
    D: Girar únicamente desde el carril izquierdo
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha sin que el remolque golpee la acera u otros
    objetos.
- id: 161
  category: sharing_the_road
  question: 'Cuando una motocicleta esté rebasando su vehículo, usted debe:'
  choices:
    A: Aumentar la velocidad para ayudarle a pasar más rápido
    B: Mantener su velocidad y posición
    C: Moverse al acotamiento de la carretera
    D: Encender las luces altas
  answer: B
  explanation: Al ser rebasado por una motocicleta, debe mantener su velocidad y posición
    en el carril para permitir que el motociclista complete la maniobra de manera
    segura.
- id: 162
  category: sharing_the_road
  question: ¿En Louisiana, qué equipo debe tener obligatoriamente una bicicleta cuando
    se usa de noche?
  choices:
    A: Una campana y una bandera
    B: Una luz delantera blanca y una luz/reflector trasero rojo
    C: Iluminación de neón en el suelo
    D: Solo un reflector trasero
  answer: B
  explanation: La ley RS 32:329 de Louisiana exige que las bicicletas utilizadas de
    noche estén equipadas con una lámpara en la parte delantera que emita una luz
    blanca y un reflector o lámpara roja en la parte trasera.
- id: 163
  category: sharing_the_road
  question: 'Si usted va a girar a la izquierda y un ciclista está entrando en la
    intersección desde la dirección opuesta, usted debe:'
  choices:
    A: Girar rápidamente antes de que llegue el ciclista
    B: Tocar la bocina para advertir al ciclista que se detenga
    C: Ceder el derecho de paso al ciclista
    D: Asumir que el ciclista se detendrá por usted
  answer: C
  explanation: Al igual que con otros vehículos motorizados, debe ceder el paso al
    tráfico que viene en sentido contrario, incluidos los ciclistas, al realizar un
    giro a la izquierda.
- id: 164
  category: sharing_the_road
  question: En una carretera con un carril central exclusivo para girar y sin mediana
    física, ¿qué vehículos deben detenerse ante un autobús escolar con luces rojas
    intermitentes?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico en el carril de giro
    C: El tráfico en ambas direcciones
    D: Nadie está obligado a detenerse si hay tres o más carriles
  answer: C
  explanation: En Louisiana, si no hay una barrera física (como una mediana de concreto
    o una franja de césped), el tráfico en ambas direcciones debe detenerse ante un
    autobús escolar. Un carril central de giro no se considera una barrera.
- id: 165
  category: sharing_the_road
  question: La ley de Louisiana (RS 32:76.1) exige que los automovilistas dejen un
    espacio libre mínimo de ¿cuánto al rebasar una bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: El ancho de la puerta de un automóvil
  answer: B
  explanation: La ley de Louisiana exige que un automovilista deje al menos tres pies
    de espacio libre entre su vehículo y una bicicleta al rebasarla.
- id: 166
  category: sharing_the_road
  question: Con respecto al uso de carriles por parte de motocicletas en Louisiana,
    ¿cuál de las siguientes afirmaciones es VERDADERA?
  choices:
    A: A las motocicletas se les permite 'dividir carriles' (lane split) entre filas
      de autos
    B: Se permite que dos motocicletas circulen una al lado de la otra en un solo
      carril
    C: Las motocicletas siempre deben circular por el acotamiento
    D: A los autos se les permite compartir un carril con una motocicleta
  answer: B
  explanation: La ley de Louisiana permite que dos motocicletas circulen una al lado
    de la otra (en paralelo) en un solo carril, pero la división de carriles (circular
    entre carriles de tráfico) es ilegal.
- id: 167
  category: sharing_the_road
  question: Al compartir la carretera con camiones grandes, ¿dónde se encuentra la
    'Zona Prohibida' (No-Zone) o punto ciego más grande?
  choices:
    A: Directamente detrás del remolque
    B: Directamente delante de la cabina
    C: El lado izquierdo del camión
    D: El lado derecho del camión
  answer: D
  explanation: Aunque los camiones tienen puntos ciegos en todos los lados, el lado
    derecho es la 'Zona Prohibida' (No-Zone) más grande porque se extiende a través
    de varios carriles y hacia más atrás.
- id: 168
  category: sharing_the_road
  question: 'En Louisiana, si ve a un peatón usando un bastón blanco o un perro guía
    en una intersección, usted debe:'
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Cederles el derecho de paso y detenerse por completo
    C: Rodearlos si hay suficiente espacio
    D: Esperar a que le hagan una señal para pasar
  answer: B
  explanation: La ley de Louisiana exige que los conductores se detengan por completo
    y cedan el derecho de paso a cualquier peatón ciego que use un perro guía o lleve
    un bastón blanco.
- id: 169
  category: sharing_the_road
  question: 'Cuando un ciclista circula por una carretera de Louisiana, ellos:'
  choices:
    A: Siempre deben circular por la acera
    B: Están obligados a circular en sentido contrario al tráfico
    C: Tienen los mismos derechos y responsabilidades que los conductores de vehículos
      motorizados
    D: No tienen permitido circular en carreteras con límites de velocidad superiores
      a 35 mph
  answer: C
  explanation: En Louisiana, las bicicletas se consideran vehículos y los ciclistas
    tienen los mismos derechos y deberes que los conductores de vehículos motorizados.
- id: 170
  category: sharing_the_road
  question: Al seguir a un camión grande, ¿cómo puede asegurarse de no estar en el
    punto ciego del conductor?
  choices:
    A: Manteniéndose a menos de 10 pies del parachoques trasero
    B: Haciendo destellos con las luces altas
    C: Asegurándose de que puede ver la cara del conductor en sus espejos laterales
    D: Conduciendo en el carril de la extrema izquierda en todo momento
  answer: C
  explanation: 'La ''regla de oro'' para las Zonas Prohibidas (No-Zones) de los camiones
    es: si no puede ver la cara del conductor del camión en su espejo lateral, él
    no puede verlo a usted.'
- id: 171
  category: sharing_the_road
  question: ¿En Luisiana, quién está legalmente obligado a usar un casco de seguridad
    cuando una motocicleta está en funcionamiento?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros menores de 18 años
    C: Tanto el conductor como cualquier pasajero
    D: Nadie, si tienen $10,000 en seguro médico
  answer: C
  explanation: La ley de Luisiana exige que todos los conductores y pasajeros de motocicletas
    usen un casco de seguridad asegurado con una correa en la barbilla mientras el
    vehículo esté en movimiento.
- id: 172
  category: sharing_the_road
  question: 'Cuando un autobús escolar se detiene en una carretera con una mediana
    física de césped o una barrera de concreto, el tráfico que se mueve en la dirección
    opuesta debe:'
  choices:
    A: Detenerse al menos a 30 pies de distancia
    B: Detenerse solo si hay niños cruzando la mediana
    C: Proceder con precaución y no detenerse
    D: Reducir la velocidad a 15 mph
  answer: C
  explanation: En Luisiana, si una carretera está dividida por una barrera física
    o mediana, el tráfico que viaja en la dirección opuesta a un autobús escolar detenido
    no está obligado a detenerse.
- id: 173
  category: sharing_the_road
  question: 'Al girar a la derecha en una intersección, debe ceder el paso a:'
  choices:
    A: Solo a otros vehículos motorizados
    B: Peatones en el cruce peatonal y ciclistas en el carril de bicicletas
    C: Solo a peatones con bastones blancos
    D: A nadie, ya que los giros a la derecha siempre tienen prioridad
  answer: B
  explanation: Los conductores deben ceder el paso tanto a los peatones en los cruces
    peatonales como a los ciclistas que viajan recto a través de la intersección antes
    de realizar un giro a la derecha.
- id: 174
  category: vehicle_information
  question: Según la ley de Luisiana, ¿cuándo debe encender los faros delanteros mientras
    conduce?
  choices:
    A: Solo entre las 9:00 PM y las 5:00 AM
    B: Siempre que esté usando los limpiaparabrisas debido a la lluvia, neblina o
      nieve
    C: Solo cuando conduzca en carreteras rurales sin iluminación
    D: Solo cuando la visibilidad sea inferior a 200 pies
  answer: B
  explanation: El Estatuto Revisado de Luisiana 32:301 exige que los conductores enciendan
    las luces cuando los limpiaparabrisas estén en uso como resultado de la lluvia,
    neblina, nieve u otras condiciones atmosféricas.
- id: 175
  category: vehicle_information
  question: Al acercarse a un vehículo que viene en dirección contraria en Luisiana,
    ¿a qué distancia debe bajar las luces altas (cambiar a luces bajas)?
  choices:
    A: 200 pies
    B: 350 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Luisiana exige que los conductores bajen las luces altas
    cuando un vehículo que viene en dirección contraria se encuentre a menos de 500
    pies.
- id: 176
  category: vehicle_information
  question: Según la ley de Luisiana, el freno de pie de su vehículo debe ser capaz
    de detener el vehículo a una distancia de cuántos pies cuando viaja a 20 mph?
  choices:
    A: 15 pies
    B: 25 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: La Guía del Conductor de Luisiana establece que el freno de pie debe
    poder detener el vehículo en un espacio de 25 pies cuando se viaja a una velocidad
    de 20 mph.
- id: 177
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura para los
    neumáticos de un vehículo de pasajeros en Luisiana?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Luisiana exige que los neumáticos tengan al menos 2/32 de
    pulgada de profundidad de banda de rodadura en cualquiera de las dos ranuras principales
    adyacentes.
- id: 178
  category: vehicle_information
  question: Para un automóvil de pasajeros estándar en Luisiana, ¿cuál es el polarizado
    máximo legal (transmisión mínima de luz) permitido en las ventanas laterales delanteras?
  choices:
    A: 20%
    B: 32%
    C: 40%
    D: 50%
  answer: C
  explanation: La ley RS 32:361.1 de Luisiana especifica que las ventanas laterales
    delanteras de un automóvil de pasajeros deben permitir al menos un 40% de transmisión
    de luz.
- id: 179
  category: vehicle_information
  question: 'La ley de Luisiana exige que todo vehículo de motor esté equipado con
    un espejo que refleje una vista de la carretera a una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 500 pies hacia atrás
    D: 1,000 pies hacia atrás
  answer: B
  explanation: Todo vehículo de motor debe tener un espejo ubicado de tal manera que
    refleje al conductor una vista de la carretera a una distancia de al menos 200
    pies hacia la parte trasera.
- id: 180
  category: vehicle_information
  question: En Luisiana, si una carga se extiende más de cuántos pies más allá de
    la parte trasera de la caja o carrocería de un vehículo, ¿se debe colocar una
    bandera roja o una luz roja?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: De acuerdo con la ley RS 32:313 de Luisiana, siempre que una carga
    se extienda 4 pies o más más allá de la caja o carrocería de un vehículo, se debe
    mostrar una bandera roja (de día) o una luz roja (de noche) al final de la carga.
- id: 181
  category: vehicle_information
  question: 'Todo vehículo motorizado en Louisiana debe estar equipado con al menos
    dos luces traseras que emitan una luz roja claramente visible desde una distancia
    de:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: El Estatuto Revisado (RS) 32:304 de Louisiana exige que las luces traseras
    sean visibles desde una distancia de 1,000 pies hacia atrás.
- id: 182
  category: vehicle_information
  question: 'En Louisiana, la bocina de un vehículo motorizado debe ser audible en
    condiciones normales desde una distancia no menor a:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Louisiana exige que todo vehículo motorizado esté equipado
    con una bocina en buen estado de funcionamiento capaz de emitir un sonido audible
    en condiciones normales desde una distancia no menor a 200 pies.
- id: 183
  category: vehicle_information
  question: ¿Dónde debe colocarse la calcomanía de inspección de vehículos motorizados
    de Louisiana en un vehículo con parabrisas?
  choices:
    A: En la esquina superior derecha del parabrisas
    B: En la esquina inferior izquierda del parabrisas (lado del conductor)
    C: En la esquina inferior derecha del parabrisas (lado del pasajero)
    D: Detrás del espejo retrovisor
  answer: B
  explanation: En Louisiana, la calcomanía oficial de inspección debe colocarse en
    la esquina inferior izquierda del parabrisas, en el lado del conductor.
- id: 184
  category: vehicle_information
  question: Según la ley de Louisiana, ¿cuál es el polarizado legal máximo (transmisión
    mínima de luz) permitido en las ventanas laterales traseras de un automóvil de
    pasajeros?
  choices:
    A: 12%
    B: 25%
    C: 35%
    D: 50%
  answer: B
  explanation: Para los automóviles de pasajeros en Louisiana, las ventanas laterales
    traseras deben permitir al menos un 25% de transmisión de luz.
- id: 185
  category: vehicle_information
  question: ¿Cuál de los siguientes es ILEGAL tener en su vehículo en Louisiana?
  choices:
    A: Un escape libre (muffler cutout) o derivación (bypass)
    B: Un enganche de remolque
    C: Extensiones de guardabarros (fender flares)
    D: Faros LED
  answer: A
  explanation: El RS 32:352 de Louisiana prohíbe el uso de un escape libre, derivación
    o dispositivo similar en un vehículo motorizado operado en una carretera.
- id: 186
  category: vehicle_information
  question: En Louisiana, si está remolcando un remolque, ¿cuál es la longitud máxima
    de la conexión (barra de remolque o cadena) entre los dos vehículos?
  choices:
    A: 8 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: La ley de Louisiana establece que la conexión entre dos vehículos cualesquiera,
    uno de los cuales remolca al otro, no debe exceder los 15 pies de longitud.
- id: 187
  category: vehicle_information
  question: Según la ley de Louisiana, ¿cuándo debe un conductor encender sus faros
    en relación con las condiciones climáticas?
  choices:
    A: Solo cuando está oscuro afuera
    B: Siempre que los limpiaparabrisas estén en uso debido al clima
    C: Solo durante tormentas eléctricas fuertes
    '0': Solo cuando la visibilidad sea inferior a 100 pies
  answer: B
  explanation: El Estatuto Revisado de Louisiana 32:301 exige que los conductores
    enciendan las luces cuando los limpiaparabrisas estén en uso como resultado de
    lluvia, aguanieve, nieve u otras condiciones atmosféricas.
- id: 188
  category: vehicle_information
  question: En Louisiana, ¿cuál es el porcentaje mínimo de transmisión de luz permitido
    para las ventanas laterales traseras de un automóvil de pasajeros?
  choices:
    A: 40%
    B: 35%
    C: 25%
    D: 12%
  answer: C
  explanation: Las leyes de polarizado de ventanas de Louisiana exigen que las ventanas
    laterales traseras de un automóvil de pasajeros permitan al menos un 25% de transmisión
    de luz.
- id: 189
  category: vehicle_information
  question: ¿Cuál es el límite legal para el polarizado de ventanas en el parabrisas
    trasero (vidrio posterior) de un automóvil de pasajeros en Louisiana?
  choices:
    A: Al menos un 25% de transmisión de luz
    B: Al menos un 12% de transmisión de luz
    C: Al menos un 5% de transmisión de luz
    D: No se permite polarizado en el parabrisas trasero
  answer: B
  explanation: La ley de Louisiana permite que el parabrisas trasero de un automóvil
    de pasajeros tenga un polarizado que permita al menos un 12% de transmisión de
    luz.
- id: 190
  category: vehicle_information
  question: En Louisiana, ¿cualquier remolque o semirremolque con un peso bruto de
    cuántas libras o más debe estar equipado con sus propios frenos?
  choices:
    A: 1,500 libras
    B: 2,000 libras
    C: 3,000 libras
    D: 5,000 libras
  answer: C
  explanation: La ley de Louisiana exige que todo remolque o semirremolque con un
    peso bruto de 3,000 libras o más esté equipado con frenos adecuados para controlar
    el movimiento y para detener y sujetar dicho vehículo.
- id: 191
  category: vehicle_information
  question: 'En Louisiana, las luces traseras deben estar montadas en la parte posterior
    del vehículo y deben ser visibles desde una distancia de:'
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: La ley de Louisiana exige que las luces traseras sean claramente visibles
    desde una distancia de 1,000 pies hacia atrás.
- id: 192
  category: vehicle_information
  question: 'La luz que ilumina la placa de matrícula trasera en Louisiana debe hacer
    que la placa sea legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Louisiana exige que una luz blanca ilumine la placa de matrícula
    trasera para que sea claramente legible desde una distancia de 50 pies.
- id: 193
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico amarilla intermitente en Louisiana?
  choices:
    A: Detenerse por completo y esperar a que la luz cambie
    B: Acelerar para despejar la intersección rápidamente
    C: Reducir la velocidad y proceder con precaución
    D: La luz está averiada; trátela como una parada de cuatro vías
  answer: C
  explanation: Según la Guía del Conductor de Louisiana, una luz amarilla intermitente
    significa que debe reducir la velocidad y proceder con precaución, ya que se está
    acercando a un lugar peligroso.
- id: 194
  category: signs_and_signals
  question: 'Una señal en forma de banderín situada en el lado izquierdo de una carretera
    de dos carriles en Louisiana indica:'
  choices:
    A: Una zona escolar
    B: Una zona de no rebasar (no-passing zone)
    C: Un requisito de ceder el paso
    D: Un cruce de ferrocarril
  answer: B
  explanation: La señal en forma de banderín es única porque se coloca en el lado
    izquierdo de la carretera para advertir a los conductores que están entrando en
    una zona de no rebasar.
- id: 195
  category: signs_and_signals
  question: Cuando un semáforo muestra una luz amarilla fija, ¿cuál es la acción correcta
    para un conductor en Louisiana?
  choices:
    A: Acelerar para ganarle a la luz roja
    B: Detenerse inmediatamente, incluso si está en medio de la intersección
    C: Prepararse para detenerse; la señal está a punto de cambiar a rojo
    D: Continuar a la misma velocidad sin importar la posición
  answer: C
  explanation: Una luz amarilla fija significa que la señal verde está terminando
    y la señal roja se mostrará inmediatamente. Debe detenerse si es seguro hacerlo.
- id: 196
  category: signs_and_signals
  question: En Louisiana, ¿qué indican las líneas blancas sólidas dobles pintadas
    en el pavimento?
  choices:
    A: Puede cruzarlas para cambiar de carril si es seguro
    B: Separación de tráfico que se mueve en direcciones opuestas
    C: Está prohibido cruzar las líneas
    D: Está entrando en un carril para vehículos de alta ocupación (HOV)
  answer: C
  explanation: Las líneas blancas sólidas dobles se utilizan para separar carriles
    de tráfico que se mueven en la misma dirección, y cruzarlas está prohibido por
    la ley de Louisiana.
- id: 197
  category: signs_and_signals
  question: Si se encuentra en una intersección en Louisiana y los semáforos no funcionan,
    ¿cómo debe proceder?
  choices:
    A: Ceder el paso al conductor a su izquierda
    B: Tratar la intersección como una parada de múltiples vías
    C: Mantener la velocidad y proceder con precaución
    D: Esperar a que llegue un oficial de policía antes de avanzar
  answer: B
  explanation: La ley de Louisiana exige que si los semáforos están fuera de servicio,
    la intersección debe tratarse como una parada de múltiples vías (se aplican las
    reglas de parada de cuatro vías).
- id: 198
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal horizontal de color rosa fluorescente
    en Louisiana?
  choices:
    A: Recreación pública y guía escénica
    B: Gestión de incidentes (accidentes, inundaciones o incendios)
    C: Advertencia de cruce de peatones
    D: Zona de construcción de alta velocidad
  answer: B
  explanation: Las señales de color rosa fluorescente se utilizan específicamente
    para la gestión de incidentes para advertir a los conductores de situaciones de
    emergencia temporales como choques o desastres naturales.
- id: 199
  category: signs_and_signals
  question: Según la ley de Louisiana, ¿cuándo se permite un giro a la izquierda con
    luz roja?
  choices:
    A: Nunca; los giros a la izquierda en rojo están estrictamente prohibidos
    B: Solo al girar desde una calle de doble sentido hacia una calle de un solo sentido
    C: Solo al girar desde una calle de un solo sentido hacia otra calle de un solo
      sentido
    D: En cualquier intersección si no viene tráfico
  answer: C
  explanation: La ley de Louisiana permite un giro a la izquierda en rojo solo cuando
    se gira desde una calle de un solo sentido hacia otra calle de un solo sentido,
    después de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 200
  category: signs_and_signals
  question: 'Para señalar un giro a la derecha utilizando señales manuales en Louisiana,
    el conductor debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera de la ventana
    B: Extender el brazo izquierdo hacia afuera y doblarlo hacia arriba por el codo
    C: Extender el brazo izquierdo hacia afuera y doblarlo hacia abajo por el codo
    D: Extender el brazo derecho hacia afuera de la ventana del pasajero
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido por la ventana y doblado hacia arriba en un ángulo de 90 grados.
- id: 201
  category: signs_and_signals
  question: 'Una señal en forma de diamante con fondo naranja en Louisiana indica:'
  choices:
    A: Un requisito reglamentario
    B: Una zona escolar
    C: Una zona de construcción o mantenimiento
    D: Un cruce de ferrocarril más adelante
  answer: C
  explanation: El naranja es el color estándar para las señales de advertencia de
    construcción y mantenimiento en Louisiana.
- id: 202
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla continua en su lado de una línea central
    amarilla discontinua en Louisiana?
  choices:
    A: Se permite rebasar si el camino está despejado
    B: Usted se encuentra en una zona de un solo sentido
    C: Está prohibido rebasar de su lado
    D: Debe girar a la izquierda en la siguiente intersección
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central significa
    que se encuentra en una zona de no rebasar y no puede adelantar legalmente a otros
    vehículos.
- id: 203
  category: signs_and_signals
  question: 'En Louisiana, una señal con forma de triángulo equilátero con la punta
    hacia abajo se utiliza exclusivamente para:'
  choices:
    A: Señales de Pare (Stop)
    B: Señales de Ceda el paso (Yield)
    C: Zonas de No Rebasar
    D: Cruces de ferrocarril (crossbucks)
  answer: B
  explanation: El triángulo equilátero con la punta hacia abajo es la forma específica
    reservada para las señales de Ceda el paso (Yield).
- id: 204
  category: signs_and_signals
  question: ¿Qué significan las líneas blancas transversales (líneas pintadas a través
    de los carriles) en una intersección?
  choices:
    A: Un área de estacionamiento designada
    B: Una línea de parada o un cruce peatonal
    C: Un área de control de velocidad
    D: El final de una carretera
  answer: B
  explanation: Las líneas transversales se utilizan para indicar dónde debe detenerse
    un conductor ante una señal o semáforo (líneas de parada) o por dónde cruzan los
    peatones (pasos peatonales).
- id: 205
  category: signs_and_signals
  question: 'Cuando ve una señal amarilla redonda con una ''X'' negra y las letras
    ''RR'', se está aproximando a:'
  choices:
    A: Un área de descanso
    B: Un camino rural
    C: Un cruce de ferrocarril
    D: Una rotonda
  answer: C
  explanation: La señal amarilla redonda es una señal de advertencia avanzada circular
    para un cruce de ferrocarril.
- id: 206
  category: signs_and_signals
  question: 'Para indicar que está disminuyendo la velocidad o deteniéndose mediante
    señales manuales, usted debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera
    B: Extender el brazo izquierdo hacia afuera y doblarlo hacia arriba
    C: Extender el brazo izquierdo hacia afuera y doblarlo hacia abajo
    D: Agitar la mano de adelante hacia atrás
  answer: C
  explanation: La señal manual para reducir la velocidad o detenerse es el brazo izquierdo
    extendido hacia afuera y doblado hacia abajo a la altura del codo.
- id: 207
  category: signs_and_signals
  question: En Louisiana, ¿cuál es el significado de una señal de tráfico azul?
  choices:
    A: Advertencia general
    B: Información reglamentaria
    C: Servicios para el viajero (comida, gasolina, alojamiento)
    D: Información de construcción
  answer: C
  explanation: Las señales azules proporcionan información sobre los servicios para
    el automovilista, como gasolina, comida, alojamiento, hospitales y parques.
- id: 208
  category: signs_and_signals
  question: ¿Cuál es la forma y ubicación específica de una señal de 'Zona de No Rebasar'
    (No Passing Zone) en Louisiana?
  choices:
    A: Forma de diamante en el lado derecho de la carretera
    B: Forma de banderín (pennant) en el lado izquierdo de la carretera
    C: Forma rectangular en el lado derecho de la carretera
    D: Forma circular en el lado izquierdo de la carretera
  answer: B
  explanation: En Louisiana, la señal de 'No Passing Zone' es una señal de advertencia
    amarilla en forma de banderín colocada en el lado izquierdo de la carretera para
    indicar el inicio de una zona donde está prohibido adelantar.
- id: 209
  category: signs_and_signals
  question: Cuando un semáforo es horizontal en lugar de vertical en Louisiana, ¿en
    qué lado se encuentra la luz roja?
  choices:
    A: En el extremo derecho
    B: En el extremo izquierdo
    C: En el medio
    D: Varía según la parroquia (parish)
  answer: B
  explanation: Cuando los semáforos están dispuestos horizontalmente, la ley de Louisiana
    dicta que la luz roja siempre está en el extremo izquierdo, seguida de la amarilla
    en el medio y la verde a la derecha.
- id: 210
  category: signs_and_signals
  question: En Louisiana, si tiene la intención de girar a la izquierda y está utilizando
    señales manuales, ¿cómo debe colocar su brazo?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo doblado hacia arriba en un ángulo de 90 grados
    C: Brazo doblado hacia abajo en un ángulo de 90 grados
    D: Brazo agitándose en movimiento circular
  answer: A
  explanation: Para indicar un giro a la izquierda mediante señales manuales en Louisiana,
    el conductor debe extender su brazo izquierdo recto hacia afuera de la ventana.
- id: 211
  category: signs_and_signals
  question: ¿Qué indica una línea blanca continua entre dos carriles de tráfico que
    se mueven en la misma dirección?
  choices:
    A: Usted está en una calle de un solo sentido
    B: Debe permanecer en su carril y solo cruzar si es necesario
    C: Rebasar está estrictamente prohibido
    D: El carril es solo para vehículos compartidos (carpools)
  answer: B
  explanation: Una línea blanca continua entre carriles de tráfico que se mueven en
    la misma dirección desaconseja los cambios de carril. Aunque no es estrictamente
    ilegal cruzarla en todos los contextos como una línea doble, significa que debe
    permanecer en su carril a menos que una situación especial requiera un cambio.
- id: 212
  category: signs_and_signals
  question: ¿De qué color son las 'Señales de Servicio' que proporcionan información
    sobre gasolina, comida y alojamiento en Louisiana?
  choices:
    A: Verde
    B: Marrón
    C: Azul
    D: Amarillo
  answer: C
  explanation: Las señales de servicio, que proporcionan indicaciones hacia instalaciones
    como hospitales, gasolineras y hoteles, son azules con letras o símbolos blancos.
- id: 213
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla redonda con una 'X' grande y las letras
    'RR'?
  choices:
    A: Una zona de construcción vial más adelante
    B: Un área de entrega de ruta rural
    C: Un cruce de ferrocarril más adelante
    D: Una calzada restringida
  answer: C
  explanation: La señal amarilla redonda con una 'X' negra y 'RR' es la señal de advertencia
    anticipada para un cruce de ferrocarril.
- id: 214
  category: signs_and_signals
  question: Si se aproxima a un autobús escolar que se ha detenido en una carretera
    con una mediana física (como una barrera de concreto o una franja de césped),
    ¿debe detenerse si viaja en la dirección opuesta?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar
    B: No, no tiene que detenerse si hay una mediana física
    C: Sí, pero solo si el conductor del autobús le hace una señal
    D: No, pero debe reducir la velocidad a 15 mph
  answer: B
  explanation: El estatuto RS 32:80 de Louisiana establece que el conductor de un
    vehículo en una carretera con calzadas separadas no necesita detenerse al encontrarse
    o pasar a un autobús escolar que se encuentra en una calzada diferente (separada
    por una barrera física o zanja).
- id: 215
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de color naranja en forma de diamante?
  choices:
    A: Advertencia general de peligros en la carretera
    B: Guía direccional hacia parques estatales
    C: Advertencia de construcción o mantenimiento
    D: Cruce de zona escolar
  answer: C
  explanation: El naranja es el color estándar para las señales de construcción y
    mantenimiento en Louisiana y en todo EE. UU.
- id: 216
  category: signs_and_signals
  question: ¿Qué tipo de señal es generalmente una señal en forma de rectángulo con
    fondo blanco y letras negras?
  choices:
    A: Señal de advertencia
    B: Señal reglamentaria
    C: Señal de guía
    D: Señal de gestión de incidentes
  answer: B
  explanation: Las señales rectangulares verticales con texto negro sobre fondo blanco
    son señales reglamentarias, como las señales de límite de velocidad, que informan
    a los conductores sobre las leyes y reglamentos de tránsito.
- id: 217
  category: signs_and_signals
  question: En Louisiana, ¿qué significa una doble línea amarilla continua en el centro
    de la calzada?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Está prohibido rebasar desde cualquier dirección
    D: Marca el borde de la calzada
  answer: C
  explanation: Las líneas amarillas dobles continuas indican que rebasar está prohibido
    para el tráfico que se mueve en ambas direcciones.
- id: 218
  category: signs_and_signals
  question: ¿Qué señal manual debe usar para indicar que está disminuyendo la velocidad
    o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho saludando por la ventana
  answer: C
  explanation: La señal manual para detenerse o disminuir la velocidad es el brazo
    izquierdo extendido hacia abajo con la palma de la mano hacia atrás.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 219
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Deténgase por completo
    B: Aumente la velocidad para incorporarse al tráfico
    C: Reduzca la velocidad y ceda el paso al tráfico y a los peatones
    D: Continúe sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen con seguridad.
  id: 220
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRE (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico en sentido contrario.
  id: 221
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 222
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección — la dirección que
    señala la flecha.
  id: 223
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 224
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 225
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 226
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico en ambos sentidos más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 227
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 228
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 229
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 230
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que crucen la calle.
  id: 231
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 232
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 233
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 234
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 235
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 236
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que el camino gire primero
    en un sentido y luego en el otro.
  id: 237
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 238
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: Comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 239
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Esté preparado para una reducción del ancho de la vía y ajuste su
    posición en el carril.
  id: 240
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  id: 241
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido opuesto ya no estará separado por una mediana. Esté preparado para
    el tráfico de doble sentido.
  id: 242
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 243
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 244
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 245
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 246
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 247
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las carreteras
    laterales.
  id: 248
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 249
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: 'Se está añadiendo un nuevo carril: no es necesario incorporarse'
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir una incorporación. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 250
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 251
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válido
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 252
