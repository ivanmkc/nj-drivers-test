  choices:
    A: They can cause immediate blurred vision
    B: They promote short-term alertness but may increase drowsiness over longer periods
    C: They cause a sudden drop in blood pressure
    D: They are illegal to consume while operating a motor vehicle
  answer: B
  explanation: Sugar and caffeine promote short-term alertness but may increase drowsiness
    over longer periods of time.
