metadata:
  source: 2025 Louisiana Driver's Manual
  total_questions: 250
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Louisiana, what is the minimum age required to apply for a Learner's
    Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 17 years old
  answer: B
  explanation: According to the Louisiana Driver's Guide, an applicant must be at
    least 15 years of age to be eligible for a Learner's Permit.
- id: 2
  category: license_system
  question: To obtain a Learner's Permit in Louisiana, a minor must complete how many
    hours of classroom instruction?
  choices:
    A: 6 hours
    B: 15 hours
    C: 30 hours
    D: 40 hours
  answer: C
  explanation: Louisiana law requires minors to complete 30 hours of classroom instruction
    and 8 hours of behind-the-wheel training to qualify for a permit.
- id: 3
  category: license_system
  question: Under the Louisiana Graduated Licensing Program (GDL), an Intermediate
    License holder is restricted from driving between what hours unless accompanied
    by a licensed adult?
  choices:
    A: 10:00 PM to 4:00 AM
    B: 11:00 PM to 5:00 AM
    C: Midnight to 6:00 AM
    D: 9:00 PM to 5:00 AM
  answer: B
  explanation: Intermediate License holders in Louisiana cannot drive between 11:00
    PM and 5:00 AM unless accompanied by a licensed parent, guardian, or licensed
    adult at least 21 years of age.
- id: 4
  category: license_system
  question: Between the hours of 6:00 PM and 5:00 AM, how many passengers under the
    age of 21 (who are not immediate family) can an Intermediate License holder carry?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Louisiana GDL rules state that between 6:00 PM and 5:00 AM, an Intermediate
    License holder may not transport more than one passenger under the age of 21 who
    is not a member of the immediate family.
- id: 5
  category: license_system
  question: If you move to a new address within Louisiana, you must notify the Office
    of Motor Vehicles (OMV) of the change within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: Louisiana law requires that you notify the OMV of any change of address
    within 10 days.
- id: 6
  category: license_system
  question: What is the minimum age to apply for a Class E Full License in Louisiana,
    provided the applicant has met all GDL requirements?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: In Louisiana, a driver is eligible for a Class E Full License at age
    17, provided they have held an Intermediate License for at least one year and
    have not been involved in any at-fault accidents or moving violations.
- id: 7
  category: license_system
  question: A standard Louisiana Class E driver's license is typically valid for how
    many years before it expires?
  choices:
    A: 4 years
    B: 5 years
    C: 6 years
    D: 8 years
  answer: C
  explanation: Most Louisiana driver's licenses are issued for a period of six years
    from the nearest birthday.
- id: 8
  category: license_system
  question: Which of the following is a requirement for a new resident to obtain a
    Louisiana driver's license?
  choices:
    A: They must have lived in the state for 6 months
    B: They must apply within 30 days of establishing residency
    C: They must retake the behind-the-wheel driving test regardless of their previous
      license status
    D: They must be at least 21 years old
  answer: B
  explanation: New residents must apply for a Louisiana license within 30 days of
    establishing residency in the state.
- id: 9
  category: license_system
  question: Under Louisiana law, what happens to a male applicant between the ages
    of 15 and 26 when they apply for a driver's license?
  choices:
    A: They are automatically registered for the state militia
    B: They are automatically registered for the Selective Service
    C: They must pay a mandatory 'young driver' surcharge
    D: They are required to take a mandatory drug test
  answer: B
  explanation: Louisiana law requires that any male applicant between 15 and 26 years
    of age be registered with the Selective Service System when applying for a license
    or ID card.
- id: 10
  category: license_system
  question: What is the name of the Louisiana program that manages the graduated licensing
    process for teen drivers?
  choices:
    A: SAFE Act
    B: R.Y.A.N. Act
    C: LOUIS Act
    D: PELICAN Program
  answer: B
  explanation: The R.Y.A.N. Act (Reduce Youthful Accidents Now) is the name of Louisiana's
    Graduated Licensing Program.
- id: 11
  category: license_system
  question: In Louisiana, if you are under 18, who must sign your license application
    to accept financial responsibility?
  choices:
    A: Only a parent
    B: A parent or legal guardian
    C: Any adult over 21
    D: A school principal
  answer: B
  explanation: For applicants under 18, a parent or legal guardian must sign the application
    and accept financial responsibility for the minor's actions while driving.
- id: 12
  category: license_system
  question: Which document is NOT required to apply for a Real ID-compliant license
    in Louisiana?
  choices:
    A: Proof of Social Security number
    B: Two proofs of residency
    C: Proof of identity (e.g., Birth Certificate)
    D: A copy of your high school diploma
  answer: D
  explanation: A high school diploma is not a requirement for a Real ID. You need
    proof of identity, SSN, and two proofs of Louisiana residency.
- id: 13
  category: license_system
  question: What is the minimum fine for a first-offense littering conviction in Louisiana?
  choices:
    A: $50
    B: $100
    C: $175
    D: $500
  answer: C
  explanation: In Louisiana, the minimum fine for a first-offense littering conviction
    is $175, plus 8 hours of community service in a litter abatement program.
- id: 14
  category: license_system
  question: How long must a 15-year-old hold a Learner's Permit before they can apply
    for an Intermediate License in Louisiana?
  choices:
    A: 90 days
    B: 180 days
    C: One year
    D: Until they turn 16
  answer: B
  explanation: A student must hold a Learner's Permit for at least 180 days (and be
    at least 16) before they can advance to an Intermediate License.
- id: 15
  category: license_system
  question: Louisiana law requires drivers to carry a minimum amount of liability
    insurance. What is the minimum coverage required for bodily injury to one person?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $30,000
  answer: B
  explanation: Louisiana's '15/30/25' law requires $15,000 for bodily injury to one
    person, $30,000 for bodily injury to more than one person, and $25,000 for property
    damage.
- id: 16
  category: license_system
  question: New residents to Louisiana must register their vehicles within how many
    days of establishing residency?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: According to the Louisiana Driver's Guide, new residents have 30 days
    to register their vehicles in the state.
- id: 17
  category: license_system
  question: If your Louisiana driver's license is suspended due to a lack of motor
    vehicle insurance, what is the maximum reinstatement fee for a third or subsequent
    offense?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Reinstatement fees for insurance-related suspensions in Louisiana increase
    with each offense, reaching $500 for a third or subsequent violation.
- id: 18
  category: license_system
  question: 'A Louisiana Class D Chauffeur''s License is required for anyone operating
    a vehicle used in commerce with a Gross Vehicle Weight Rating (GVWR) of:'
  choices:
    A: Between 5,001 and 10,000 pounds
    B: Between 10,001 and 26,000 pounds
    C: Exactly 26,001 pounds
    D: Over 30,000 pounds
  answer: B
  explanation: A Class D license is required in Louisiana for the operation of any
    single vehicle used in commerce with a GVWR of 10,001 to 26,000 pounds.
- id: 19
  category: license_system
  question: When applying for a REAL ID-compliant license in Louisiana, how many documents
    are required to prove your Louisiana residency?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have a valid passport
  answer: B
  explanation: To obtain a REAL ID in Louisiana, applicants must provide two documents
    that prove their physical Louisiana residential address.
- id: 20
  category: license_system
  question: In Louisiana, what is the minimum visual acuity required in at least one
    eye (with or without corrective lenses) to obtain an unrestricted driver's license?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/70
  answer: C
  explanation: Louisiana requires a minimum visual acuity of 20/40 in at least one
    eye to pass the vision test for an unrestricted license.
- id: 21
  category: license_system
  question: Under Louisiana law, a minor's driving privileges can be suspended for
    which of the following non-driving offenses?
  choices:
    A: Failing a math test
    B: Withdrawal from school or chronic absenteeism
    C: Being grounded by a parent
    D: Missing a school assembly
  answer: B
  explanation: Louisiana law allows for the suspension of driving privileges for minors
    who drop out of school or are habitually absent.
- id: 22
  category: license_system
  question: 'If you change your name due to marriage or a court order, you must apply
    for a corrected Louisiana license within:'
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Louisiana law requires that you notify the OMV and obtain a corrected
    license within 30 days of a legal name change.
- id: 23
  category: license_system
  question: What is the primary purpose of the 'R.Y.A.N. Act' (Reduce Youth Accidents
    Now) in Louisiana?
  choices:
    A: To lower the driving age to 14
    B: To mandate 30 hours of classroom and 8 hours of behind-the-wheel instruction
      for teen drivers
    C: To eliminate the need for a road test
    D: To provide free cars to students with high GPAs
  answer: B
  explanation: The R.Y.A.N. Act established the requirement for teenagers to complete
    a formal driver education course (30 hours classroom/8 hours driving) to get a
    permit.
- id: 24
  category: license_system
  question: Which of the following is considered a 'Primary' document for identification
    when applying for a Louisiana license?
  choices:
    A: A social security card
    B: A certified birth certificate
    C: A high school ID
    D: A utility bill
  answer: B
  explanation: A certified birth certificate is a primary document. Social security
    cards and school IDs are considered secondary documents in Louisiana.
- id: 25
  category: license_system
  question: 'If a Louisiana driver is convicted of three counts of reckless driving
    within a 12-month period, their license will be:'
  choices:
    A: Suspended for 30 days
    B: Revoked
    C: Placed on probation
    D: Renewed automatically
  answer: B
  explanation: Under Louisiana law, the OMV will revoke the license of any person
    convicted of three reckless driving charges within a single year.
- id: 26
  category: license_system
  question: In Louisiana, which of the following is an acceptable document to prove
    your Social Security number for a REAL ID?
  choices:
    A: An original Social Security card
    B: A handwritten note from a parent
    C: A library card
    D: A birth certificate
  answer: A
  explanation: An original Social Security card, a W-2 form, or a 1099 form showing
    the full SSN are acceptable proofs for a REAL ID in Louisiana.
- id: 27
  category: license_system
  question: Louisiana drivers who are 17 years old and possess a Class E license are
    subject to which restriction?
  choices:
    A: They cannot drive at night
    B: They cannot have any passengers
    C: They are generally unrestricted unless they are still in the GDL Intermediate
      stage
    D: They must always drive with a parent
  answer: C
  explanation: At age 17, a driver can graduate to a Class E Full License, which removes
    the nighttime and passenger restrictions of the Intermediate License.
- id: 28
  category: license_system
  question: What is the fee for a 'Late Renewal' of a Louisiana driver's license if
    it has been expired for more than 10 days?
  choices:
    A: $5
    B: $15
    C: $25
    D: $50
  answer: B
  explanation: Louisiana charges a $15 late fee in addition to the standard renewal
    fee if the license is expired by 10 days or more.
- id: 29
  category: driver_testing
  question: 'To pass the vision screening for a Louisiana driver''s license, an applicant
    must have a minimum visual acuity of at least:'
  choices:
    A: 20/20 in both eyes
    B: 20/40 in at least one eye
    C: 20/50 in both eyes
    D: 20/60 in at least one eye
  answer: B
  explanation: According to the Louisiana Driver's Guide, an applicant must have at
    least 20/40 vision in one or both eyes (with or without corrective lenses) to
    pass the vision screening.
- id: 30
  category: driver_testing
  question: During the Louisiana road skills test, which of the following actions
    will result in an immediate failure?
  choices:
    A: Failing to use a turn signal once
    B: Driving with only one hand on the wheel
    C: A violation of any traffic law
    D: Adjusting the mirrors while stopped
  answer: C
  explanation: In Louisiana, the road skills test is immediately terminated for a
    collision, a dangerous power/action, a violation of law, lack of cooperation,
    or refusal to perform.
- id: 31
  category: driver_testing
  question: What is the minimum passing score required on the Louisiana Class E knowledge
    (written) test?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: The Louisiana Office of Motor Vehicles requires a minimum score of
    80% to pass the knowledge portion of the driver's examination.
- id: 32
  category: driver_testing
  question: 'Under Louisiana''s ''Implied Consent'' law, by operating a motor vehicle,
    you have given consent to:'
  choices:
    A: A search of your vehicle at any time
    B: A chemical test to determine blood alcohol concentration (BAC)
    C: A roadside mechanical inspection of your car
    D: Allowing passengers to drink alcohol in the vehicle
  answer: B
  explanation: Louisiana's Implied Consent law means that by driving on state roads,
    you agree to submit to a chemical test for BAC if a law enforcement officer has
    reasonable grounds to believe you are impaired.
- id: 33
  category: driver_testing
  question: In Louisiana, what is the legal blood alcohol concentration (BAC) limit
    for a driver under the age of 21?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Louisiana has a 'Zero Tolerance' policy for underage drinking and driving;
    the legal limit for drivers under 21 is 0.02%.
- id: 34
  category: driver_testing
  question: When approaching a school bus that is stopped and loading or unloading
    children on a highway with a dedicated turn lane, how many feet must you stop
    from the bus?
  choices:
    A: 10 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Louisiana law requires drivers to stop at least 30 feet from a school
    bus that is loading or unloading children, unless on a divided highway with a
    physical barrier.
- id: 35
  category: driver_testing
  question: 'If a Louisiana driver refuses to submit to a chemical test for intoxication
    for the first time, their driving privileges will be suspended for:'
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: B
  explanation: Under Louisiana law, a first-offense refusal of a chemical test results
    in an automatic 180-day suspension of driving privileges.
- id: 36
  category: driver_testing
  question: When passing a bicycle traveling in the same direction on a Louisiana
    roadway, what is the minimum distance you must maintain between your vehicle and
    the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Louisiana's '3-Foot Rule' (RS 32:76.1) requires motorists to leave
    a distance of at least three feet when passing a bicycle.
- id: 37
  category: driver_testing
  question: In Louisiana, what is the maximum fine for a first-offense conviction
    of parking in a space designated for persons with disabilities?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Louisiana law sets the fine for a first-offense handicap parking violation
    at no less than $250 and no more than $500.
- id: 38
  category: driver_testing
  question: How many days before the expiration date are you allowed to renew your
    Louisiana driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: D
  explanation: Louisiana residents are permitted to renew their driver's license up
    to 180 days before the actual expiration date.
- id: 39
  category: driver_testing
  question: Which of the following is a requirement for the vehicle used during the
    Louisiana road skills test?
  choices:
    A: It must be a mid-size sedan
    B: It must have a valid safety inspection sticker
    C: It must be equipped with a dual-braking system
    D: It must have been manufactured within the last 10 years
  answer: B
  explanation: The vehicle used for the road test must be in safe operating condition
    and display a current, valid safety inspection sticker, registration, and proof
    of insurance.
- id: 40
  category: driver_testing
  question: 'In Louisiana, if you are convicted of a ''Move Over'' law violation (failing
    to yield to an emergency vehicle on the shoulder), you may face a fine of up to:'
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: Violations of the Louisiana Move Over law (RS 32:125) can result in
    fines up to $200 for a first offense.
- id: 41
  category: driver_testing
  question: When applying for a Louisiana license, you may register to be an organ
    donor through which organization?
  choices:
    A: Red Cross
    B: LOPA (Louisiana Organ Procurement Agency)
    C: Louisiana Health Dept
    D: Donate Life America
  answer: B
  explanation: Louisiana partners with LOPA (Louisiana Organ Procurement Agency) to
    allow residents to join the donor registry when they apply for or renew their
    license.
- id: 42
  category: driver_testing
  question: 'Louisiana law requires that your headlights be on when your windshield
    wipers are in use due to bad weather. This is known as the:'
  choices:
    A: Wipers On, Lights On Law
    B: Visibility Act
    C: Clear Sight Regulation
    D: Rainy Day Rule
  answer: A
  explanation: Louisiana law requires drivers to have their headlights on (low beam)
    when windshield wipers are required due to precipitation.
- id: 43
  category: driver_testing
  question: What is the maximum speed limit on Louisiana interstate highways in rural
    areas, unless otherwise posted?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: In Louisiana, the maximum speed limit on rural interstates is 75 mph,
    though many sections remain posted at 70 mph.
- id: 44
  category: driver_testing
  question: If you are involved in an accident during your Louisiana road skills test
    that you could have prevented, what is the result?
  choices:
    A: You receive a 10-point deduction
    B: You are allowed to finish the test and then receive a warning
    C: Automatic failure of the test
    D: You must wait 90 days to retake the test
  answer: C
  explanation: Any accident that the applicant could have prevented is listed as an
    automatic failure during the Louisiana road skills test.
- id: 45
  category: driver_testing
  question: 'In Louisiana, a driver under the age of 21 is considered to be driving
    under the influence if their blood alcohol concentration (BAC) is at least:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Louisiana has a 'zero tolerance' policy for underage drinking and driving;
    the legal limit for drivers under 21 is 0.02%.
- id: 46
  category: driver_testing
  question: In Louisiana, you must signal your intention to turn at least how many
    feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Louisiana Revised Statute 32:104 requires drivers to signal a turn
    continuously during not less than the last 100 feet traveled by the vehicle before
    turning.
- id: 47
  category: driver_testing
  question: In Louisiana, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: According to Louisiana law, you may not park a vehicle within 15 feet
    of a fire hydrant.
- id: 48
  category: driver_testing
  question: When parking near an intersection in Louisiana, you must be at least how
    many feet away from a crosswalk?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Louisiana law prohibits parking within 20 feet of a crosswalk at an
    intersection.
- id: 49
  category: driver_testing
  question: Louisiana's 'Move Over' law requires drivers to change lanes or slow down
    when approaching which of the following on the roadside?
  choices:
    A: Any vehicle with its hazard lights flashing
    B: Only police cars
    C: Only ambulances and fire trucks
    D: Any emergency vehicle, tow truck, or utility vehicle with flashing lights
  answer: D
  explanation: Louisiana law requires drivers to move over or slow down for all emergency
    vehicles, including police, fire, EMS, tow trucks, and utility service vehicles
    with flashing lights.
- id: 50
  category: driver_testing
  question: In Louisiana, you must dim your high beam headlights when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Louisiana law requires drivers to dim their high beams when they are
    within 500 feet of an oncoming vehicle.
- id: 51
  category: driver_testing
  question: What is the recommended following distance for most passenger vehicles
    in good weather conditions in Louisiana?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Louisiana Driver's Guide recommends the '3-second rule' to maintain
    a safe following distance behind the vehicle in front of you.
- id: 52
  category: driver_testing
  question: On a Louisiana highway with a continuous center left-turn lane (not a
    physical barrier), when a school bus is stopped with red lights flashing, who
    must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic in the turn lane
    C: Traffic in both directions
    D: No one is required to stop if there are more than two lanes
  answer: C
  explanation: In Louisiana, if a highway is separated only by a turn lane (and not
    a physical barrier like a median or ditch), traffic in both directions must stop
    for a school bus with flashing red lights.
- id: 53
  category: driver_responsibility
  question: Under Louisiana's compulsory liability insurance law, what is the minimum
    required coverage for damage to the property of others in a single accident?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: D
  explanation: Louisiana law requires '15/30/25' coverage. The '25' stands for $25,000,
    which is the minimum legal requirement for property damage liability.
- id: 54
  category: driver_responsibility
  question: 'In Louisiana, a written report (SR-1) must be filed with the Department
    of Public Safety within 15 days of an accident if there is a fatality, bodily
    injury, or property damage exceeding:'
  choices:
    A: $100
    B: $500
    C: $750
    D: $1,000
  answer: B
  explanation: Louisiana Revised Statute 32:398 requires drivers to report any accident
    resulting in injury, death, or property damage in excess of $500 to the police
    immediately and subsequently to the DPS if a police report wasn't made.
- id: 55
  category: driver_responsibility
  question: When you sell a vehicle in Louisiana, you must submit a 'Notice of Transfer'
    to the Office of Motor Vehicles within how many days of the sale?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: To protect yourself from liability for the vehicle after it is sold,
    Louisiana law requires the seller to notify the OMV within 10 days of the date
    of sale.
- id: 56
  category: driver_responsibility
  question: Louisiana's 'No Pay, No Play' law generally prevents uninsured motorists
    from collecting the first ______ of property damage and the first ______ of personal
    injury losses.
  choices:
    A: $5,000; $5,000
    B: $10,000; $10,000
    C: $25,000; $15,000
    D: $50,000; $25,000
  answer: C
  explanation: Under the 'No Pay, No Play' law, uninsured drivers cannot collect the
    first $15,000 of bodily injury and the first $25,000 of property damage, regardless
    of who was at fault.
- id: 57
  category: driver_responsibility
  question: What is the reinstatement fee for a first-offense suspension of driving
    privileges due to a failure to maintain required liability insurance in Louisiana?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: B
  explanation: For a first offense of failing to maintain insurance, the OMV charges
    a $50 reinstatement fee. This fee increases for subsequent offenses.
- id: 58
  category: driver_responsibility
  question: In Louisiana, if you are stopped by law enforcement and cannot provide
    proof of insurance, the officer may issue a temporary notice and apply a ______
    sticker to your rear window.
  choices:
    A: Red
    B: Green
    C: Yellow
    D: Blue
  answer: C
  explanation: If a driver cannot provide proof of insurance, the officer can issue
    a yellow 'Temporary Use' sticker, and the vehicle may be subject to impoundment
    if proof isn't provided within a specific timeframe.
- id: 59
  category: driver_responsibility
  question: After purchasing a vehicle from an individual (private party) in Louisiana,
    the buyer must title and register the vehicle within how many days to avoid late
    penalties?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: Louisiana law requires the buyer to apply for a title and registration
    within 20 days of the date of sale to avoid late fees and penalties.
- id: 60
  category: driver_responsibility
  question: Which of the following is a legal form of proof of insurance in the state
    of Louisiana?
  choices:
    A: A physical insurance ID card
    B: An image of the insurance card displayed on a smartphone
    C: The insurance policy declaration page
    D: All of the above
  answer: D
  explanation: Louisiana law allows drivers to show proof of insurance through physical
    cards, paper documents, or electronic images on a mobile device.
- id: 61
  category: driver_responsibility
  question: 'In Louisiana, your license plate must be clearly visible and illuminated
    by a white light so that it can be read from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 150 feet
  answer: B
  explanation: Louisiana law requires the rear registration plate to be illuminated
    by a white light that makes the plate clearly legible from a distance of 50 feet
    to the rear.
- id: 62
  category: driver_responsibility
  question: If you plan to cancel your vehicle's auto insurance policy in Louisiana,
    what must you do first to avoid fines and flags on your record?
  choices:
    A: Notify the police
    B: Wait for the policy to expire naturally
    C: Surrender the license plate to the OMV
    D: Sell the vehicle
  answer: C
  explanation: Louisiana law requires you to surrender your license plate to the OMV
    before you cancel your insurance policy to prevent an insurance 'flag' and subsequent
    fines.
- id: 63
  category: driver_responsibility
  question: 'In Louisiana, most passenger vehicles are required to undergo a safety
    inspection (brake tag) every:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: While some specific municipalities (like New Orleans) have 1-year requirements,
    the general state-wide rule for Louisiana is that inspection stickers are valid
    for 2 years.
- id: 64
  category: driver_responsibility
  question: 'If a Louisiana driver is involved in an accident and does not have the
    required insurance, they may be required to post a security deposit with the DPS
    to cover potential damages. This is known as:'
  choices:
    A: The Safety Responsibility Act
    B: The Good Samaritan Law
    C: The Move Over Law
    D: The Open Container Law
  answer: A
  explanation: The Louisiana Safety Responsibility Act requires uninsured drivers
    to post a security deposit or face license suspension following an accident to
    ensure financial responsibility for damages.
- id: 65
  category: driver_responsibility
  question: Under the 'Motor Voter' law, at what age can a Louisiana resident pre-register
    to vote at the Office of Motor Vehicles?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: In Louisiana, you can pre-register to vote at the OMV starting at age
    16, though you cannot actually vote until you are 18.
- id: 66
  category: driver_responsibility
  question: In Louisiana, you must file an official crash report with the Department
    of Public Safety if an accident results in property damage exceeding what amount?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: According to Louisiana law, any crash involving injury, death, or property
    damage in excess of $500 must be reported to the Department of Public Safety.
- id: 67
  category: driver_responsibility
  question: In Louisiana, how often must most motor vehicles undergo a safety inspection
    to receive a new 'brake tag' (inspection sticker)?
  choices:
    A: Every 6 months
    B: Every year or every two years, depending on the parish and fee paid
    C: Only when the vehicle is sold
    D: Every 5 years
  answer: B
  explanation: Louisiana requires annual or biennial (2-year) safety inspections.
    Residents in certain areas, like New Orleans or Kenner, may have specific local
    inspection requirements.
- id: 68
  category: driver_responsibility
  question: If a Louisiana law enforcement officer stops you, which of the following
    is an acceptable form of proof of insurance?
  choices:
    A: A physical insurance card only
    B: An official digital version displayed on a smartphone
    C: A verbal statement of the policy number
    D: A handwritten note from an insurance agent
  answer: B
  explanation: Louisiana law allows drivers to provide proof of insurance in either
    a physical paper format or an electronic format on a mobile device.
- id: 69
  category: driver_responsibility
  question: Under Louisiana's Implied Consent Law, if you refuse to submit to a chemical
    test for alcohol, your driving privileges will be suspended for how long for a
    first offense?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: By operating a motor vehicle in Louisiana, you imply consent to testing.
    Refusal to take the test results in a 180-day license suspension for a first offense.
- id: 70
  category: driver_responsibility
  question: What is the maximum jail sentence for a first-offense DWI conviction for
    an adult in Louisiana?
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: A first-offense DWI in Louisiana is a misdemeanor and carries a penalty
    of 10 days to 6 months in jail, though the sentence may be suspended with probation
    requirements.
- id: 71
  category: driver_responsibility
  question: According to Louisiana Child Passenger Safety Law, children must remain
    in a rear-facing child safety seat until they reach what age?
  choices:
    A: 1 year old
    B: 2 years old
    C: 4 years old
    D: 6 years old
  answer: B
  explanation: Louisiana law requires children to be restrained in a rear-facing child
    safety seat until they are at least 2 years old or exceed the weight/height limits
    set by the manufacturer.
- id: 72
  category: driver_responsibility
  question: If a passenger in your vehicle throws trash out of the window in Louisiana,
    who is legally responsible for the littering violation?
  choices:
    A: Only the passenger who threw the trash
    B: The driver of the vehicle
    C: The owner of the vehicle, regardless of who was driving
    D: No one, unless a police officer sees it happen
  answer: B
  explanation: Under Louisiana law, the driver is held responsible for any litter
    thrown from their vehicle, regardless of who threw it.
- id: 73
  category: driver_responsibility
  question: Louisiana's mandatory safety belt law applies to which occupants of a
    passenger vehicle?
  choices:
    A: Only the driver and front-seat passengers
    B: Only passengers under the age of 18
    C: All occupants, regardless of seating position
    D: Only the driver
  answer: C
  explanation: Louisiana law requires everyone in a passenger vehicle (cars, vans,
    pickup trucks) to be properly buckled up, regardless of where they are sitting.
- id: 74
  category: safe_driving_rules
  question: Under Louisiana law, you may not park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Louisiana Revised Statute 32:143 prohibits parking a vehicle within
    15 feet of a fire hydrant.
- id: 75
  category: safe_driving_rules
  question: In Louisiana, it is illegal for any driver to use a wireless communication
    device for text messaging while operating a motor vehicle. For drivers under the
    age of 18, what is the rule regarding cell phone use?
  choices:
    A: They may use hands-free devices only.
    B: They may use cell phones for calls but not texting.
    C: They are prohibited from using any type of wireless communication device while
      driving.
    D: They may use cell phones only during daylight hours.
  answer: C
  explanation: Louisiana law prohibits any driver under the age of 18 from using any
    wireless communication device (handheld or hands-free) while operating a motor
    vehicle.
- id: 76
  category: safe_driving_rules
  question: 'When approaching a stationary emergency vehicle with flashing lights
    on a multi-lane highway, Louisiana''s ''Move Over'' law requires you to:'
  choices:
    A: Stop immediately in your lane.
    B: Maintain speed but honk your horn.
    C: Move to a lane that is not adjacent to the vehicle, if safe to do so.
    D: Speed up to pass the vehicle quickly.
  answer: C
  explanation: Louisiana RS 32:125 requires drivers to move over to a lane not adjacent
    to the emergency vehicle or slow down if changing lanes is unsafe.
- id: 77
  category: safe_driving_rules
  question: According to Louisiana law, what is the minimum distance a motorist must
    maintain when passing a bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Louisiana RS 32:76.1 (the 'Colin Goodier Protection Act') requires
    motorists to leave at least three feet of distance between their vehicle and a
    bicycle when passing.
- id: 78
  category: safe_driving_rules
  question: When stopping for a railroad crossing in Louisiana, you must stop your
    vehicle within how many feet from the nearest rail?
  choices:
    A: Between 5 and 25 feet
    B: Between 10 and 30 feet
    C: Between 15 and 50 feet
    D: Between 20 and 100 feet
  answer: C
  explanation: Louisiana law requires drivers to stop within 15 to 50 feet from the
    nearest rail of a railroad crossing when signals are flashing or a train is approaching.
- id: 79
  category: safe_driving_rules
  question: In Louisiana, when are you required to turn on your headlights?
  choices:
    A: Only between sunset and sunrise.
    B: Whenever you are driving on a two-lane highway.
    C: Whenever you are using your windshield wipers due to inclement weather.
    D: Only when visibility is less than 100 feet.
  answer: C
  explanation: Louisiana RS 32:281 requires drivers to have headlights on when windshield
    wipers are in use due to rain, mist, or snow.
- id: 80
  category: safe_driving_rules
  question: In Louisiana, a left turn on a red light is permitted only under which
    of the following conditions?
  choices:
    A: From a two-way street onto a one-way street.
    B: From a one-way street onto another one-way street.
    C: At any intersection if no traffic is coming.
    D: Left turns on red are never permitted in Louisiana.
  answer: B
  explanation: Louisiana RS 32:232 allows a left turn on red only when turning from
    a one-way street onto another one-way street, after coming to a complete stop
    and yielding to traffic and pedestrians.
- id: 81
  category: safe_driving_rules
  question: If you are caught speeding in a Louisiana highway work zone while workers
    are present, what happens to the standard fine?
  choices:
    A: It is reduced if you have a clean record.
    B: It stays the same.
    C: It is doubled.
    D: It is tripled.
  answer: C
  explanation: Louisiana RS 32:57 states that fines for speeding or other traffic
    violations are doubled when committed in a designated highway work zone.
- id: 82
  category: safe_driving_rules
  question: Under Louisiana law, you are prohibited from parking within how many feet
    of a crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Louisiana RS 32:143 prohibits parking within 20 feet of a crosswalk
    at an intersection.
- id: 83
  category: safe_driving_rules
  question: You are driving on a highway with a physical median or barrier separating
    travel directions. A school bus is stopped on the opposite side of the median
    with its red lights flashing. What must you do?
  choices:
    A: Stop and wait until the lights stop flashing.
    B: Slow down to 15 mph and proceed with caution.
    C: You are not required to stop.
    D: Stop only if there are children crossing the median.
  answer: C
  explanation: In Louisiana, you do not have to stop for a school bus if you are traveling
    in the opposite direction on a highway that is divided by a physical barrier or
    median (RS 32:80).
- id: 84
  category: safe_driving_rules
  question: According to the Louisiana 'Louisiana Seat Belt Law,' who is required
    to wear a seat belt in a passenger vehicle?
  choices:
    A: Only the driver and front-seat passengers.
    B: Only passengers under the age of 18.
    C: All occupants of the vehicle, regardless of seating position.
    D: Only the driver.
  answer: C
  explanation: Louisiana RS 32:295.1 requires every occupant in a passenger car, van,
    or pickup truck to have a safety belt properly fastened about his or her body
    at all times when the vehicle is in forward motion.
- id: 85
  category: safe_driving_rules
  question: In Louisiana, you may not park within how many feet of a stop sign, flashing
    beacon, or traffic control signal?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Louisiana RS 32:143 prohibits parking within 30 feet upon the approach
    to any flashing beacon, stop sign, or traffic control signal located at the side
    of a roadway.
- id: 86
  category: safe_driving_rules
  question: The Louisiana Driver's Guide recommends using which rule to maintain a
    safe following distance behind the vehicle in front of you?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The three-second rule
    D: The five-second rule
  answer: C
  explanation: The Louisiana Driver's Guide recommends a minimum following distance
    of three seconds to allow for adequate reaction time.
- id: 87
  category: safe_driving_rules
  question: In Louisiana, when you approach a school bus that is stopped and loading
    or unloading children, what is the minimum distance you must stop from the bus?
  choices:
    A: 10 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: According to the Louisiana Driver's Guide, you must stop at least 30
    feet from a stopped school bus that is loading or unloading children.
- id: 88
  category: safe_driving_rules
  question: When intending to turn, Louisiana law requires you to signal your intent
    at least how many feet before making the turn?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: Louisiana law requires drivers to give a continuous signal for at least
    100 feet before turning.
- id: 89
  category: safe_driving_rules
  question: In Louisiana, it is illegal to pass another vehicle when you are within
    how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Louisiana law prohibits passing another vehicle when approaching within
    100 feet of an intersection, railroad crossing, bridge, viaduct, or tunnel.
- id: 90
  category: safe_driving_rules
  question: In Louisiana, you may not park your vehicle within how many feet of a
    crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Louisiana law prohibits parking within 20 feet of a crosswalk at an
    intersection.
- id: 91
  category: safe_driving_rules
  question: Louisiana's 'Move Over' law requires drivers to do what when approaching
    an authorized emergency vehicle stopped on the roadside with flashing lights?
  choices:
    A: Stop immediately in the lane of travel
    B: Maintain speed and stay in the current lane
    C: Vacate the lane closest to the vehicle if safe, or slow down
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Louisiana's Move Over law requires drivers to move to a lane not adjacent
    to the emergency vehicle if possible, or to slow down to a safe speed if changing
    lanes is not possible.
- id: 92
  category: safe_driving_rules
  question: At what speed can hydroplaning (tires losing contact with the road surface)
    begin on wet roads in Louisiana?
  choices:
    A: 25 mph
    B: 35 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: According to the Louisiana Driver's Guide, hydroplaning can start at
    speeds as low as 35 mph and becomes complete at 55 mph.
- id: 93
  category: safe_driving_rules
  question: 'Louisiana law requires your headlights to be on whenever you are using
    your:'
  choices:
    A: Turn signals
    B: Windshield wipers
    C: Hazard lights
    D: Air conditioning
  answer: B
  explanation: Louisiana law requires drivers to have their headlights on when windshield
    wipers are in use due to rain, mist, or snow.
- id: 94
  category: safe_driving_rules
  question: You are prohibited from parking within how many feet of the entrance to
    a fire station on the same side of the street?
  choices:
    A: 15 feet
    B: 20 feet
    C: 50 feet
    D: 75 feet
  answer: B
  explanation: Louisiana law prohibits parking within 20 feet of the driveway entrance
    to any fire station on the same side of the street.
- id: 95
  category: defensive_driving
  question: According to the Louisiana Driver's Guide, what is the recommended following
    distance behind the vehicle in front of you under ideal driving conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: Louisiana uses the 'three-second rule' to determine a safe following
    distance. This should be increased to four or more seconds during bad weather
    or on wet roads.
- id: 96
  category: defensive_driving
  question: Under Louisiana law (RS 32:301), when are drivers required to have their
    headlights turned on?
  choices:
    A: Only between sunset and sunrise
    B: Only when visibility is less than 1,000 feet
    C: Whenever the vehicle's windshield wipers are in continuous use due to rain
      or mist
    D: Only when driving on highways
  answer: C
  explanation: Louisiana law requires headlights to be on when windshield wipers are
    in use, as well as between sunset and sunrise or when visibility is less than
    500 feet.
- id: 97
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, the Louisiana
    Driver's Guide suggests scanning the road how far ahead?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: 500 feet
  answer: B
  explanation: Drivers should look 10 to 15 seconds ahead to identify potential hazards
    early and allow time to react safely.
- id: 98
  category: defensive_driving
  question: When driving in heavy fog in Louisiana, which light setting should you
    use to ensure maximum visibility and safety?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: Low beams should be used in fog because the light from high beams reflects
    off the water droplets in the fog, causing glare and making it harder to see.
- id: 99
  category: defensive_driving
  question: 'In Louisiana, you are NOT required to stop for a school bus with its
    red lights flashing and stop arm extended if:'
  choices:
    A: You are traveling in the opposite direction on a highway with a physical median
      or barrier
    B: You are in a hurry and the bus is stopped for more than 2 minutes
    C: You are traveling in the same direction on a four-lane road
    D: The bus is stopped in a residential zone
  answer: A
  explanation: According to LA RS 32:80, you do not have to stop for a school bus
    if you are on the opposite side of a divided highway with a median, ditch, or
    concrete barrier.
- id: 100
  category: defensive_driving
  question: In Louisiana, how far in advance must you signal your intention to turn
    or change lanes?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: LA RS 32:104 requires drivers to give a signal of intention to turn
    continuously during not less than the last 100 feet traveled by the vehicle before
    turning.
- id: 101
  category: defensive_driving
  question: 'In Louisiana, it is illegal to follow an emergency vehicle (like a fire
    truck) responding to an alarm closer than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: LA RS 32:286 states that the driver of any vehicle shall not follow
    any fire apparatus traveling in response to a fire alarm closer than 500 feet.
- id: 102
  category: defensive_driving
  question: When driving near large trucks, you should stay out of their 'No-Zone.'
    Where are these blind spots located?
  choices:
    A: Only directly behind the truck
    B: Only on the left side of the truck
    C: Directly in front, directly behind, and on both sides of the truck
    D: Only on the right side of the truck
  answer: C
  explanation: The 'No-Zone' refers to the large blind spots around a truck where
    the driver cannot see you. This includes the front, rear, and both sides.
- id: 103
  category: defensive_driving
  question: 'If you are involved in a collision in Louisiana that results in injury,
    death, or property damage exceeding $500, you must:'
  choices:
    A: Wait 24 hours before reporting it
    B: Report it only if you were at fault
    C: Immediately report the accident to the local police, sheriff, or state police
    D: Only exchange insurance information and leave
  answer: C
  explanation: Louisiana law requires an immediate report to the nearest law enforcement
    agency for any accident involving injury, death, or property damage over $500.
- id: 104
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly in Louisiana,
    how far ahead should you scan the road?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: Only the car directly in front of you
  answer: B
  explanation: The Louisiana Driver's Guide states that drivers should look 10 to
    15 seconds ahead to allow time to prepare for traffic conditions and hazards.
- id: 105
  category: defensive_driving
  question: At what speed can hydroplaning begin in Louisiana weather conditions,
    causing tires to lose contact with the road surface?
  choices:
    A: As low as 35 mph
    B: Only above 60 mph
    C: Exactly 55 mph
    D: Only when tires are bald
  answer: A
  explanation: Hydroplaning can start at speeds as low as 35 mph, and at 50 mph, tires
    may lose all contact with the road.
- id: 106
  category: defensive_driving
  question: If you are driving in heavy rain or on slippery roads in Louisiana, how
    should you adjust your following distance?
  choices:
    A: Keep it at 3 seconds
    B: Decrease it to 2 seconds to stay close to the car ahead
    C: Increase it to at least 4 seconds or more
    D: Following distance does not matter in rain
  answer: C
  explanation: The Louisiana Driver's Guide advises increasing following distance
    during adverse weather conditions to allow for longer stopping distances.
- id: 107
  category: defensive_driving
  question: When scanning an intersection for potential hazards, in what order should
    you look?
  choices:
    A: Left, then right
    B: Right, then left
    C: Left, right, then left again
    D: Straight ahead only
  answer: C
  explanation: Louisiana driving guidelines suggest looking left, then right, then
    left again because the first danger comes from the left.
- id: 108
  category: defensive_driving
  question: 'In Louisiana, roads are most slippery when it first starts to rain because:'
  choices:
    A: The water is colder then
    B: Oil and grease on the pavement mix with the water
    C: Tires are still hot from dry driving
    D: Visibility is at its lowest point
  answer: B
  explanation: During the first few minutes of rain, oil and grease rise to the surface
    of the road, creating a very slippery film before being washed away.
- id: 109
  category: defensive_driving
  question: When entering a curve in the road, what is the safest defensive driving
    technique regarding your speed?
  choices:
    A: Brake hard while in the middle of the curve
    B: Accelerate before entering the curve
    C: Slow down before you enter the curve
    D: Maintain your speed and brake only if you feel the car sliding
  answer: C
  explanation: Louisiana safety guidelines advise drivers to reduce speed before entering
    a curve to maintain better traction and control.
- id: 110
  category: alcohol_drugs_health
  question: Under Louisiana's 'Zero Tolerance' law, what is the BAC limit for drivers
    under the age of 21?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: B
  explanation: Louisiana has a Zero Tolerance policy for underage drinking and driving;
    the legal limit for anyone under 21 is 0.02%.
- id: 111
  category: alcohol_drugs_health
  question: What does Louisiana's 'Implied Consent' law mean for drivers?
  choices:
    A: You agree to have your vehicle searched at any time.
    B: You agree to take a chemical test for blood alcohol concentration if requested
      by an officer.
    C: You agree to carry minimum liability insurance.
    D: You agree to allow passengers to consume alcohol in your vehicle.
  answer: B
  explanation: By operating a motor vehicle in Louisiana, you have given 'implied
    consent' to a chemical test (breath, blood, or urine) to determine the presence
    of alcohol or drugs.
- id: 112
  category: alcohol_drugs_health
  question: 'According to Louisiana''s Open Container Law, it is illegal to:'
  choices:
    A: Have an alcoholic beverage in the trunk of the car.
    B: Possess an open alcoholic beverage in the passenger area of a motor vehicle
      on a public highway.
    C: Transport unopened beer in the backseat.
    D: Drink water while driving.
  answer: B
  explanation: Louisiana law prohibits the possession of an open alcoholic beverage
    container in the passenger area of any motor vehicle while it is on a public highway.
- id: 113
  category: alcohol_drugs_health
  question: Under Louisiana's Child Endangerment Act, penalties for DWI are increased
    if a child of what age or younger is in the vehicle?
  choices:
    A: 12 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: A
  explanation: The Child Endangerment Act provides for enhanced penalties if a person
    is convicted of DWI while a child 12 years of age or younger is a passenger in
    the vehicle.
- id: 114
  category: alcohol_drugs_health
  question: 'In Louisiana, if you are convicted of a first-offense DWI and your BAC
    was 0.15% or higher, you must:'
  choices:
    A: Forfeit your vehicle permanently.
    B: Install an ignition interlock device for at least 12 months.
    C: Serve a mandatory 1-year jail sentence.
    D: Pay a fine of at least $5,000.
  answer: B
  explanation: For a first-offense DWI with a BAC of 0.15% or higher, Louisiana law
    requires the installation of an ignition interlock device (IID) for at least 12
    months.
- id: 115
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in the context of driving safety?
  choices:
    A: The effect of driving while tired.
    B: The combined effect of alcohol and drugs which is greater than the sum of their
      parts.
    C: The effect of driving in heavy rain.
    D: The improved focus caused by caffeine.
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs (even prescription
    ones) are taken together, multiplying the impairment effects on the driver.
- id: 116
  category: alcohol_drugs_health
  question: How long does it take the body to process and eliminate the alcohol from
    one standard drink (e.g., 12 oz beer)?
  choices:
    A: About 15 minutes
    B: About 30 minutes
    C: About 1 hour
    D: About 3 hours
  answer: C
  explanation: On average, it takes the human body approximately one hour to process
    and eliminate the alcohol contained in one standard drink.
- id: 117
  category: alcohol_drugs_health
  question: In Louisiana, a second-offense DWI conviction results in a mandatory minimum
    jail sentence of how many hours?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 96 hours
  answer: B
  explanation: A second-offense DWI conviction in Louisiana carries a mandatory minimum
    of 48 hours in jail, though the sentence can be much longer.
- id: 118
  category: alcohol_drugs_health
  question: 'If you have a medical condition (such as epilepsy or diabetes) that may
    affect your ability to drive, Louisiana law requires you to:'
  choices:
    A: Stop driving immediately and forever.
    B: Report the condition to the Office of Motor Vehicles (OMV).
    C: Only drive during daylight hours.
    D: Keep a doctor in the car at all times.
  answer: B
  explanation: Louisiana law requires drivers to report any physical or mental disability
    that may impair their ability to drive safely to the OMV.
- id: 119
  category: alcohol_drugs_health
  question: Which of the following is true regarding marijuana and driving in Louisiana?
  choices:
    A: It is legal to drive under the influence of marijuana if you have a medical
      prescription.
    B: Marijuana does not affect reaction time.
    C: You can be convicted of a DWI for driving under the influence of marijuana.
    D: Marijuana only affects driving if it is smoked, not if it is ingested.
  answer: C
  explanation: In Louisiana, a DWI charge applies to impairment by any substance,
    including illegal drugs, prescription medications, or marijuana, regardless of
    whether it was legally prescribed.
- id: 120
  category: alcohol_drugs_health
  question: What is the primary way to 'sober up' before driving after consuming alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time for the body to process the alcohol
  answer: D
  explanation: Time is the only effective way to lower your BAC and sober up. Coffee,
    showers, and exercise do not speed up the elimination of alcohol from the bloodstream.
- id: 121
  category: alcohol_drugs_health
  question: 'In Louisiana, if you are involved in a crash resulting in a fatality
    and the officer has reason to believe you were intoxicated, the officer:'
  choices:
    A: Must wait for a court order to test your blood.
    B: Can only test you if you are conscious.
    C: May use reasonable force to require you to submit to a chemical test.
    D: Cannot test you if you have a clean driving record.
  answer: C
  explanation: Under Louisiana law, if a driver is involved in a collision involving
    a fatality or serious bodily injury, they can be required to submit to a chemical
    test, and reasonable force may be used if they refuse.
- id: 122
  category: alcohol_drugs_health
  question: 'Under Louisiana''s ''Zero Tolerance'' law, a driver under the age of
    21 is considered to be driving while intoxicated if their BAC is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: B
  explanation: Louisiana has a Zero Tolerance policy for minors; a BAC of 0.02% or
    higher for anyone under 21 results in a DUI charge.
- id: 123
  category: alcohol_drugs_health
  question: Louisiana's 'Open Container' law prohibits which of the following?
  choices:
    A: Any alcoholic beverage in the trunk of a car.
    B: Any open alcoholic beverage in the passenger area of a motor vehicle.
    C: Transporting unopened wine in the backseat.
    D: Buying alcohol at a drive-through daiquiri shop if the seal is intact.
  answer: B
  explanation: Louisiana law prohibits the possession of any open alcoholic beverage
    container in the passenger area of a motor vehicle while it is on a public highway.
- id: 124
  category: alcohol_drugs_health
  question: Under Louisiana law, a 'Child Endangerment' penalty is triggered if a
    DWI is committed with a child of what age or younger in the vehicle?
  choices:
    A: 12 years old
    B: 13 years old
    C: 15 years old
    D: 17 years old
  answer: A
  explanation: If a person is convicted of DWI and a child 12 years of age or younger
    was in the vehicle, the law mandates minimum jail time that cannot be suspended.
- id: 125
  category: alcohol_drugs_health
  question: 'In Louisiana, a first-offense DWI conviction requires the installation
    of an ignition interlock device if the driver''s BAC was at or above:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: Louisiana law mandates the use of an ignition interlock device for
    at least 12 months on the first offense if the driver's BAC was 0.15% or higher.
- id: 126
  category: alcohol_drugs_health
  question: How long does a DWI conviction stay on your driving record in Louisiana
    for the purpose of sentencing as a repeat offender?
  choices:
    A: 3 years
    B: 5 years
    C: 10 years
    D: Permanently
  answer: C
  explanation: Louisiana uses a 10-year 'cleansing period.' DWI convictions within
    the last 10 years are used to determine if a current charge is a second, third,
    or fourth offense.
- id: 127
  category: alcohol_drugs_health
  question: After an arrest for DWI in Louisiana, how many days do you have to request
    an administrative hearing to contest the suspension of your license?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Drivers have 30 days from the date of the arrest to request an administrative
    hearing with the Department of Public Safety to contest a license suspension.
- id: 128
  category: alcohol_drugs_health
  question: If you are taking a prescription drug or over-the-counter medication,
    what is your responsibility as a Louisiana driver?
  choices:
    A: You are only responsible if you also drink alcohol.
    B: You must check the label for warnings about operating heavy machinery or driving.
    C: You can drive as long as you feel fine.
    D: Prescription drugs never result in a DWI charge.
  answer: B
  explanation: Drivers are responsible for knowing the side effects of their medications.
    If a drug impairs your ability to drive safely, you can be charged with DWI.
- id: 129
  category: alcohol_drugs_health
  question: 'In Louisiana, a third DWI conviction is classified as a:'
  choices:
    A: Traffic infraction
    B: Misdemeanor
    C: Felony
    D: Civil offense
  answer: C
  explanation: A third DWI conviction in Louisiana is a felony offense, carrying much
    harsher penalties, including mandatory prison time and vehicle seizure.
- id: 130
  category: penalties_and_points
  question: Under Louisiana's 'Implied Consent' law, what is the penalty for a first-time
    refusal to submit to a chemical test for intoxication?
  choices:
    A: A fine of $1,000 and 30 days in jail
    B: Suspension of driving privileges for 180 days
    C: Suspension of driving privileges for 30 days
    D: A mandatory 48-hour jail stay
  answer: B
  explanation: By operating a motor vehicle in Louisiana, you imply consent to chemical
    testing. Refusal to take the test results in a 180-day license suspension for
    a first offense.
- id: 131
  category: penalties_and_points
  question: Louisiana's 'No Pay, No Play' law prevents uninsured motorists from collecting
    which of the following after an accident, even if the other driver is at fault?
  choices:
    A: The first $15,000 of bodily injury and the first $25,000 of property damage
    B: Any medical expenses whatsoever
    C: The full value of their vehicle
    D: Emergency room fees only
  answer: A
  explanation: The 'No Pay, No Play' law (LA R.S. 32:866) prohibits uninsured drivers
    from collecting the first $15,000 in bodily injury damages and the first $25,000
    in property damages.
- id: 132
  category: penalties_and_points
  question: In Louisiana, what is the reinstatement fee for a driver's license suspended
    for the FIRST violation of the compulsory motor vehicle liability security law
    (lack of insurance)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: For a first offense of driving without insurance, the reinstatement
    fee for the driver's license is $100.
- id: 133
  category: penalties_and_points
  question: If a driver in Louisiana is convicted of passing a stopped school bus
    while its red lights are flashing, what is the maximum fine for a first offense?
  choices:
    A: Up to $100
    B: Up to $250
    C: Up to $500
    D: Up to $1,000
  answer: C
  explanation: Passing a stopped school bus with activated visual signals is a serious
    violation in Louisiana, carrying a fine of up to $500 and/or 30 days in jail for
    a first offense.
- id: 134
  category: penalties_and_points
  question: According to Louisiana law, what happens to speeding fines when the violation
    occurs in a designated highway work zone while workers are present?
  choices:
    A: The fines are tripled
    B: The fines are doubled
    C: The driver's license is automatically suspended
    D: The fine is increased by a flat $500
  answer: B
  explanation: Louisiana law mandates that speeding fines are doubled in construction
    or maintenance work zones when workers are present.
- id: 135
  category: penalties_and_points
  question: In Louisiana, how many hours of community service are mandatory for a
    first-offense conviction of 'simple littering'?
  choices:
    A: 4 hours
    B: 8 hours
    C: 16 hours
    D: 40 hours
  answer: B
  explanation: Under Louisiana R.S. 30:2531, a first conviction for simple littering
    requires the person to spend 8 hours of community service in a litter abatement
    program.
- id: 136
  category: penalties_and_points
  question: Which of the following violations will result in the MANDATORY revocation
    of a Louisiana driver's license?
  choices:
    A: A single speeding ticket for 10 mph over the limit
    B: Failure to use a turn signal
    C: Manslaughter resulting from the operation of a motor vehicle
    D: Driving with a broken taillight
  answer: C
  explanation: Louisiana law requires the mandatory revocation of a license for serious
    offenses, including manslaughter resulting from the operation of a motor vehicle.
- id: 137
  category: penalties_and_points
  question: Under Louisiana law, drivers under the age of 18 are prohibited from using
    which of the following while driving?
  choices:
    A: Any wireless communication device, including hands-free
    B: Only handheld cell phones
    C: Only texting devices
    D: AM/FM radios
  answer: A
  explanation: Louisiana law prohibits any driver under the age of 18 from using any
    wireless communication device (cell phone, laptop, etc.), whether handheld or
    hands-free, while operating a motor vehicle.
- id: 138
  category: penalties_and_points
  question: What is the penalty for a driver who fails to stop at a railroad crossing
    when a signal is flashing or a train is approaching?
  choices:
    A: A fine of $100 to $500 and/or up to 30 days in jail
    B: A verbal warning for the first offense
    C: Mandatory vehicle impoundment for 60 days
    D: Permanent loss of driving privileges
  answer: A
  explanation: Failing to stop at a railroad crossing when required is a dangerous
    violation in Louisiana, punishable by a fine of $100-$500 and/or jail time for
    a first offense.
- id: 139
  category: penalties_and_points
  question: In Louisiana, if you are involved in a crash that results in injury, death,
    or property damage exceeding $500, you must submit a written report to the DPS
    within how many days?
  choices:
    A: 24 hours
    B: 5 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: Louisiana law requires a written report (SR-10) to be filed with the
    Department of Public Safety within 15 days if a crash results in injury, death,
    or property damage over $500, unless a police officer investigated and filed a
    report.
- id: 140
  category: penalties_and_points
  question: What is the legal penalty for 'Drag Racing' on Louisiana public roads
    for a first offense?
  choices:
    A: A $50 fine
    B: A fine of up to $500 and/or up to six months in jail
    C: Mandatory 5-year license revocation
    D: There is no specific penalty for racing
  answer: B
  explanation: Drag racing is illegal on public roads in Louisiana. A first offense
    can lead to a fine of up to $500 and/or imprisonment for up to six months.
- id: 141
  category: penalties_and_points
  question: If a Louisiana driver is convicted of a second DWI offense within 10 years,
    what is the mandatory minimum jail time?
  choices:
    A: 48 hours
    B: 10 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: For a second DWI conviction in Louisiana, the law requires a mandatory
    minimum of 30 days in jail, though parts of this may be suspended under specific
    conditions like community service and probation.
- id: 142
  category: penalties_and_points
  question: If your Louisiana driving privileges are suspended because you failed
    to provide proof of insurance, what is the reinstatement fee for a first offense?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Louisiana law mandates a $100 reinstatement fee for the first offense
    of failing to maintain or provide proof of required motor vehicle insurance.
- id: 143
  category: penalties_and_points
  question: 'According to Louisiana law, a person convicted of ''Intentional Littering''
    for the first time may be fined up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: While simple littering has lower minimums, intentional littering in
    Louisiana can carry a fine of up to $1,000 and 8 hours of community service in
    a litter abatement program.
- id: 144
  category: penalties_and_points
  question: 'Violating Louisiana''s ''Move Over'' law, which requires drivers to change
    lanes or slow down for emergency vehicles on the roadside, can result in a fine
    of up to:'
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Drivers who fail to move over or slow down for stationary emergency
    vehicles, tow trucks, or utility vehicles can be fined up to $200.
- id: 145
  category: penalties_and_points
  question: 'For a first-time violation of Louisiana''s law against texting while
    driving, a driver can be fined up to:'
  choices:
    A: $175
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Louisiana R.S. 32:300.5 states that a first violation of the prohibition
    against texting while driving carries a fine of up to $500.
- id: 146
  category: penalties_and_points
  question: In Louisiana, your driver's license will be MANDATORILY revoked for which
    of the following offenses?
  choices:
    A: Failure to stop for a stop sign
    B: Manslaughter resulting from the operation of a motor vehicle
    C: A single speeding ticket for 10 mph over the limit
    D: Failure to use a turn signal
  answer: B
  explanation: Louisiana law requires mandatory revocation of a license for serious
    offenses including manslaughter resulting from the operation of a vehicle or a
    felony in which a motor vehicle is used.
- id: 147
  category: penalties_and_points
  question: 'If a driver''s license is suspended for a second insurance violation
    in Louisiana, the reinstatement fee increases to:'
  choices:
    A: $150
    B: $250
    C: $350
    D: $500
  answer: B
  explanation: The reinstatement fee for a second offense of failing to maintain required
    insurance is $250.
- id: 148
  category: penalties_and_points
  question: What is the standard fine for a first-offense violation of Louisiana's
    seat belt law for adults?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: Louisiana R.S. 32:295.1 sets the fine for a first-offense adult seat
    belt violation at $50, which includes court costs.
- id: 149
  category: penalties_and_points
  question: Upon a first conviction for DWI in Louisiana, how long is the driver's
    license typically suspended?
  choices:
    A: 90 days
    B: 180 days
    C: 365 days
    D: 2 years
  answer: C
  explanation: A first-offense DWI conviction in Louisiana results in a license suspension
    of 365 days (1 year).
- id: 150
  category: penalties_and_points
  question: 'If you are caught using a wireless communication device while driving
    through a posted school zone in Louisiana, the first-offense fine can be as high
    as:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: C
  explanation: Louisiana law strictly prohibits the use of handheld wireless devices
    in school zones; a first offense can result in a fine of up to $500.
- id: 151
  category: penalties_and_points
  question: 'Making a false statement under oath to the OMV regarding motor vehicle
    information is a crime that results in license suspension for:'
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Providing false information or committing perjury relative to the ownership
    or operation of motor vehicles results in a 6-month license suspension.
- id: 152
  category: penalties_and_points
  question: 'In Louisiana, if a driver is convicted of ''drag racing'' on a public
    highway, their license will be:'
  choices:
    A: Suspended
    B: Marked with a warning
    C: Unaffected if it's a first offense
    D: Restricted to daytime driving only
  answer: A
  explanation: Participating in a race or speed contest (drag racing) on a public
    highway is a violation that leads to the suspension of driving privileges.
- id: 153
  category: sharing_the_road
  question: Under Louisiana's 'Move Over' law, what must a driver do when approaching
    an authorized emergency vehicle stopped on the side of a multi-lane highway with
    its flashing lights on?
  choices:
    A: Stop immediately in the lane of traffic
    B: Speed up to pass the vehicle quickly
    C: Move to a lane that is not adjacent to the vehicle, if possible
    D: Maintain speed and stay in the current lane
  answer: C
  explanation: Louisiana RS 32:125 requires drivers to move to a lane not adjacent
    to the emergency vehicle if it is safe to do so, or slow down to a safe speed
    if changing lanes is not possible.
- id: 154
  category: sharing_the_road
  question: In Louisiana, you are not required to stop for a school bus on a highway
    that is divided by what feature?
  choices:
    A: A double yellow line
    B: A center turn lane
    C: A physical barrier or a grass median
    D: A dashed white line
  answer: C
  explanation: Drivers traveling in the opposite direction of a school bus are not
    required to stop if the roadway is separated by a physical barrier or an intervening
    space (like a grass median). A turn lane is not considered a physical barrier.
- id: 155
  category: sharing_the_road
  question: When following a motorcycle in Louisiana, what is the recommended following
    distance to ensure safety?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 10 seconds
  answer: C
  explanation: The Louisiana Driver's Guide recommends a following distance of at
    least 4 seconds when behind a motorcycle to allow for sudden maneuvers or weather
    conditions.
- id: 156
  category: sharing_the_road
  question: According to Louisiana law, when a pedestrian is crossing the street guided
    by a dog or carrying a white cane, you must come to a complete stop if they are
    within how many feet of your vehicle?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: A
  explanation: Louisiana RS 32:217 states that drivers must come to a full stop when
    a blind or visually impaired pedestrian is crossing the road and is within 5 feet
    of the vehicle's path.
- id: 157
  category: sharing_the_road
  question: In Louisiana, what is the minimum and maximum distance you must stop from
    the nearest rail of a railroad crossing when a train is approaching?
  choices:
    A: 5 feet to 25 feet
    B: 10 feet to 30 feet
    C: 15 feet to 50 feet
    D: 20 feet to 100 feet
  answer: C
  explanation: Louisiana law requires drivers to stop between 15 and 50 feet from
    the nearest rail of a railroad crossing when signals are flashing or a train is
    approaching.
- id: 158
  category: sharing_the_road
  question: What is the 'No-Zone' in relation to large trucks and buses in Louisiana?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the front, back, and sides of the truck
    C: The speed limit zone for commercial vehicles
    D: The weight limit for bridges
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck or bus
    where the driver cannot see your vehicle. If you cannot see the truck driver's
    face in their side mirror, they cannot see you.
- id: 159
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may need to:'
  choices:
    A: Stay entirely in the right lane
    B: Swing wide and use part of the left lane to complete the turn
    C: Stop and wait for all traffic to clear in both directions
    D: Turn from the left lane only
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn
    without the trailer hitting the curb or other objects.
- id: 160
  category: sharing_the_road
  question: 'When a motorcycle is passing your vehicle, you should:'
  choices:
    A: Speed up to help them pass faster
    B: Maintain your speed and position
    C: Move to the shoulder of the road
    D: Turn on your high beams
  answer: B
  explanation: When being passed by a motorcycle, you should maintain your speed and
    lane position to allow the motorcyclist to complete the maneuver safely.
- id: 161
  category: sharing_the_road
  question: In Louisiana, what equipment is a bicycle required to have when used at
    night?
  choices:
    A: A bell and a flag
    B: A white front light and a red rear light/reflector
    C: Neon ground lighting
    D: Only a rear reflector
  answer: B
  explanation: Louisiana RS 32:329 requires bicycles used at night to be equipped
    with a lamp on the front exhibiting a white light and a red reflector or lamp
    on the rear.
- id: 162
  category: sharing_the_road
  question: 'If you are turning left and a bicyclist is entering the intersection
    from the opposite direction, you should:'
  choices:
    A: Turn quickly before the bicyclist arrives
    B: Honk to warn the bicyclist to stop
    C: Yield the right-of-way to the bicyclist
    D: Assume the bicyclist will stop for you
  answer: C
  explanation: Just like with other motor vehicles, you must yield to oncoming traffic,
    including bicycles, when making a left turn.
- id: 163
  category: sharing_the_road
  question: On a highway with a dedicated center turn lane and no physical median,
    which vehicles must stop for a school bus with flashing red lights?
  choices:
    A: Only traffic following the bus
    B: Only traffic in the turn lane
    C: Traffic in both directions
    D: No one is required to stop if there are three or more lanes
  answer: C
  explanation: In Louisiana, if there is no physical barrier (like a concrete median
    or grass strip), traffic in both directions must stop for a school bus. A center
    turn lane is not considered a barrier.
- id: 164
  category: sharing_the_road
  question: Louisiana law (RS 32:76.1) requires motorists to leave a minimum of how
    much open space when passing a bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: The width of a car door
  answer: B
  explanation: Louisiana law requires that a motorist leave at least three feet of
    open space between their vehicle and a bicycle when passing.
- id: 165
  category: sharing_the_road
  question: Regarding motorcycle lane usage in Louisiana, which of the following is
    TRUE?
  choices:
    A: Motorcycles are allowed to 'lane split' between rows of cars
    B: Two motorcycles are permitted to ride abreast in a single lane
    C: Motorcycles must always ride on the shoulder
    D: Cars are allowed to share a lane with a motorcycle
  answer: B
  explanation: Louisiana law allows two motorcycles to ride side-by-side (abreast)
    in a single lane, but lane splitting (riding between lanes of traffic) is illegal.
- id: 166
  category: sharing_the_road
  question: When sharing the road with large trucks, where is the largest 'No-Zone'
    (blind spot) located?
  choices:
    A: Directly behind the trailer
    B: Directly in front of the cab
    C: The left side of the truck
    D: The right side of the truck
  answer: D
  explanation: While trucks have blind spots on all sides, the right side is the largest
    'No-Zone' because it extends across several lanes and further back.
- id: 167
  category: sharing_the_road
  question: 'In Louisiana, if you see a pedestrian using a white cane or a guide dog
    at an intersection, you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Give them the right-of-way and come to a complete stop
    C: Drive around them if there is enough room
    D: Wait for them to signal you to pass
  answer: B
  explanation: Louisiana law requires drivers to come to a complete stop and yield
    the right-of-way to any blind pedestrian using a guide dog or carrying a white
    cane.
- id: 168
  category: sharing_the_road
  question: 'When a bicyclist is operating on a Louisiana roadway, they:'
  choices:
    A: Must always ride on the sidewalk
    B: Are required to ride against the flow of traffic
    C: Have the same rights and responsibilities as motor vehicle drivers
    D: Are not allowed on roads with speed limits over 35 mph
  answer: C
  explanation: In Louisiana, bicycles are considered vehicles and cyclists have the
    same rights and duties as drivers of motor vehicles.
- id: 169
  category: sharing_the_road
  question: When following a large truck, how can you ensure you are not in the driver's
    blind spot?
  choices:
    A: By staying within 10 feet of the rear bumper
    B: By flashing your high beams
    C: By making sure you can see the driver's face in their side-view mirrors
    D: By driving in the left-most lane at all times
  answer: C
  explanation: 'The ''rule of thumb'' for truck No-Zones is: If you can''t see the
    truck driver''s face in their side-view mirror, they can''t see you.'
- id: 170
  category: sharing_the_road
  question: In Louisiana, who is legally required to wear a safety helmet when a motorcycle
    is in operation?
  choices:
    A: Only the operator
    B: Only passengers under 18
    C: Both the operator and any passenger
    D: No one, if they have $10,000 in medical insurance
  answer: C
  explanation: Louisiana law requires all motorcycle operators and passengers to wear
    a safety helmet secured with a chin strap while the vehicle is in motion.
- id: 171
  category: sharing_the_road
  question: 'When a school bus is stopped on a highway with a physical grass median
    or concrete barrier, traffic moving in the opposite direction must:'
  choices:
    A: Stop at least 30 feet away
    B: Stop only if there are children crossing the median
    C: Proceed with caution and do not stop
    D: Slow down to 15 mph
  answer: C
  explanation: In Louisiana, if a highway is divided by a physical barrier or median,
    traffic traveling in the opposite direction of a stopped school bus is not required
    to stop.
- id: 172
  category: sharing_the_road
  question: 'When turning right at an intersection, you must yield to:'
  choices:
    A: Only other motor vehicles
    B: Pedestrians in the crosswalk and bicyclists in the bike lane
    C: Only pedestrians with white canes
    D: No one, as right turns always have priority
  answer: B
  explanation: Drivers must yield to both pedestrians in crosswalks and bicyclists
    who are traveling straight through the intersection before making a right turn.
- id: 173
  category: vehicle_information
  question: According to Louisiana law, when must you turn on your headlights while
    driving?
  choices:
    A: Only between the hours of 9:00 PM and 5:00 AM
    B: Whenever you are using your windshield wipers due to rain, mist, or snow
    C: Only when driving on unlit rural highways
    D: Only when visibility is less than 200 feet
  answer: B
  explanation: Louisiana Revised Statute 32:301 requires drivers to display lighted
    lamps when windshield wipers are in use as a result of rain, mist, snow, or other
    atmospheric conditions.
- id: 174
  category: vehicle_information
  question: When approaching an oncoming vehicle in Louisiana, at what distance must
    you dim your high beam headlights?
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Louisiana law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet.
- id: 175
  category: vehicle_information
  question: Under Louisiana law, your vehicle's foot brake must be capable of stopping
    the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: The Louisiana Driver's Guide states that the foot brake must be able
    to stop the vehicle within 25 feet when traveling at a speed of 20 mph.
- id: 176
  category: vehicle_information
  question: What is the minimum legal tread depth for tires on a passenger vehicle
    in Louisiana?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Louisiana law requires that tires have at least 2/32 of an inch of
    tread depth in any two adjacent major grooves.
- id: 177
  category: vehicle_information
  question: For a standard passenger car in Louisiana, what is the maximum legal tint
    (minimum light transmission) allowed on the front side windows?
  choices:
    A: 20%
    B: 32%
    C: 40%
    D: 50%
  answer: C
  explanation: Louisiana RS 32:361.1 specifies that the front side windows of a passenger
    car must allow at least 40% light transmission.
- id: 178
  category: vehicle_information
  question: 'Louisiana law requires every motor vehicle to be equipped with a mirror
    that reflects a view of the highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 500 feet to the rear
    D: 1,000 feet to the rear
  answer: B
  explanation: Every motor vehicle must have a mirror so located as to reflect to
    the driver a view of the highway for a distance of at least 200 feet to the rear.
- id: 179
  category: vehicle_information
  question: If a load extends more than how many feet past the rear of a vehicle's
    bed or body in Louisiana, a red flag or red light must be attached?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: According to Louisiana RS 32:313, whenever a load extends 4 feet or
    more beyond the bed or body of a vehicle, a red flag (day) or red light (night)
    must be displayed at the end of the load.
- id: 180
  category: vehicle_information
  question: 'Every motor vehicle in Louisiana must be equipped with at least two tail
    lamps that emit a red light plainly visible from a distance of:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Louisiana RS 32:304 requires tail lamps to be visible from a distance
    of 1,000 feet to the rear.
- id: 181
  category: vehicle_information
  question: 'In Louisiana, a motor vehicle''s horn must be audible under normal conditions
    from a distance of not less than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Louisiana law requires that every motor vehicle be equipped with a
    horn in good working order capable of emitting sound audible under normal conditions
    from a distance of not less than 200 feet.
- id: 182
  category: vehicle_information
  question: Where must the Louisiana motor vehicle inspection sticker be placed on
    a vehicle with a windshield?
  choices:
    A: The upper right corner of the windshield
    B: The lower left corner of the windshield (driver's side)
    C: The lower right corner of the windshield (passenger side)
    D: Behind the rearview mirror
  answer: B
  explanation: In Louisiana, the official inspection sticker must be placed in the
    lower left-hand corner of the windshield on the driver's side.
- id: 183
  category: vehicle_information
  question: Under Louisiana law, what is the maximum legal tint (minimum light transmission)
    allowed on the rear side windows of a passenger car?
  choices:
    A: 12%
    B: 25%
    C: 35%
    D: 50%
  answer: B
  explanation: For passenger cars in Louisiana, the rear side windows must allow at
    least 25% light transmission.
- id: 184
  category: vehicle_information
  question: Which of the following is ILLEGAL to have on your vehicle in Louisiana?
  choices:
    A: A muffler cutout or bypass
    B: A trailer hitch
    C: Fender flares
    D: LED headlights
  answer: A
  explanation: Louisiana RS 32:352 prohibits the use of a muffler cutout, bypass,
    or similar device on a motor vehicle operated on a highway.
- id: 185
  category: vehicle_information
  question: In Louisiana, if you are towing a trailer, what is the maximum length
    of the connection (tow bar or chain) between the two vehicles?
  choices:
    A: 8 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: Louisiana law states that the connection between any two vehicles,
    one of which is towing the other, shall not exceed 15 feet in length.
- id: 186
  category: vehicle_information
  question: In Louisiana, what is the minimum light transmission percentage allowed
    for the rear side windows of a passenger car?
  choices:
    A: 40%
    B: 35%
    C: 25%
    D: 12%
  answer: C
  explanation: Louisiana window tint laws require that the rear side windows of a
    passenger car allow at least 25% light transmission.
- id: 187
  category: vehicle_information
  question: What is the legal limit for window tint on the rear windshield (back glass)
    of a passenger car in Louisiana?
  choices:
    A: At least 25% light transmission
    B: At least 12% light transmission
    C: At least 5% light transmission
    D: No tint is allowed on the rear windshield
  answer: B
  explanation: Louisiana law allows the rear windshield of a passenger car to have
    a tint that permits at least 12% light transmission.
- id: 188
  category: vehicle_information
  question: In Louisiana, any trailer or semi-trailer with a gross weight of how many
    pounds or more must be equipped with its own brakes?
  choices:
    A: 1,500 lbs
    B: 2,000 lbs
    C: 3,000 lbs
    D: 5,000 lbs
  answer: C
  explanation: Louisiana law requires every trailer or semi-trailer with a gross weight
    of 3,000 pounds or more to be equipped with brakes adequate to control the movement
    of and to stop and hold such vehicle.
- id: 189
  category: vehicle_information
  question: 'In Louisiana, tail lamps must be mounted on the rear of the vehicle and
    must be visible from a distance of:'
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: B
  explanation: Louisiana law requires tail lamps to be clearly visible from a distance
    of 1,000 feet to the rear.
- id: 190
  category: vehicle_information
  question: 'The light that illuminates the rear registration plate (license plate)
    in Louisiana must make the plate legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Louisiana law requires a white light to illuminate the rear registration
    plate so that it is clearly legible from a distance of 50 feet.
- id: 191
  category: signs_and_signals
  question: In Louisiana, what does a flashing yellow traffic light signify?
  choices:
    A: Stop completely and wait for the light to change
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: The light is broken; treat it as a four-way stop
  answer: C
  explanation: According to the Louisiana Driver's Guide, a flashing yellow light
    means you should slow down and proceed with caution, as you are approaching a
    hazardous location.
- id: 192
  category: signs_and_signals
  question: 'A pennant-shaped sign found on the left side of a two-lane road in Louisiana
    indicates:'
  choices:
    A: A school zone
    B: A no-passing zone
    C: A yield requirement
    D: A railroad crossing
  answer: B
  explanation: The pennant-shaped sign is unique because it is placed on the left
    side of the road to warn drivers that they are entering a no-passing zone.
- id: 193
  category: signs_and_signals
  question: When a traffic signal is showing a steady yellow light, what is the correct
    action for a Louisiana driver?
  choices:
    A: Accelerate to beat the red light
    B: Stop immediately, even if in the middle of the intersection
    C: Prepare to stop; the signal is about to turn red
    D: Continue through at the same speed regardless of position
  answer: C
  explanation: A steady yellow light means the green signal is being terminated and
    the red signal will be exhibited immediately. You should stop if it is safe to
    do so.
- id: 194
  category: signs_and_signals
  question: In Louisiana, what do double solid white lines painted on the pavement
    indicate?
  choices:
    A: You may cross to change lanes if it is safe
    B: Separation of traffic moving in opposite directions
    C: Crossing the lines is prohibited
    D: You are entering a high-occupancy vehicle (HOV) lane
  answer: C
  explanation: Double solid white lines are used to separate lanes of traffic moving
    in the same direction, and crossing them is prohibited by Louisiana law.
- id: 195
  category: signs_and_signals
  question: If you are at an intersection in Louisiana and the traffic lights are
    not working, how should you proceed?
  choices:
    A: Yield to the driver on your left
    B: Treat the intersection as a multi-way stop
    C: Maintain speed and proceed with caution
    D: Wait for a police officer to arrive before moving
  answer: B
  explanation: Louisiana law requires that if traffic lights are out of service, the
    intersection must be treated as a multi-way stop (four-way stop rules apply).
- id: 196
  category: signs_and_signals
  question: What is the meaning of a horizontal fluorescent pink sign in Louisiana?
  choices:
    A: Public recreation and scenic guidance
    B: Incident management (accidents, floods, or fires)
    C: Pedestrian crossing warning
    D: High-speed construction zone
  answer: B
  explanation: Fluorescent pink signs are used specifically for incident management
    to warn drivers of temporary emergency situations like crashes or natural disasters.
- id: 197
  category: signs_and_signals
  question: Under Louisiana law, when is a left turn on a red light permitted?
  choices:
    A: Never; left turns on red are strictly prohibited
    B: Only when turning from a two-way street onto a one-way street
    C: Only when turning from a one-way street onto another one-way street
    D: At any intersection if no traffic is coming
  answer: C
  explanation: Louisiana law allows a left turn on red only when turning from a one-way
    street onto another one-way street after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 198
  category: signs_and_signals
  question: 'To signal a right turn using hand signals in Louisiana, the driver should:'
  choices:
    A: Extend the left arm straight out the window
    B: Extend the left arm out and bend it upward at the elbow
    C: Extend the left arm out and bend it downward at the elbow
    D: Extend the right arm out the passenger window
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at a 90-degree angle.
- id: 199
  category: signs_and_signals
  question: 'A diamond-shaped sign with an orange background in Louisiana indicates:'
  choices:
    A: A regulatory requirement
    B: A school zone
    C: A construction or maintenance zone
    D: A railroad crossing ahead
  answer: C
  explanation: Orange is the standard color for construction and maintenance warning
    signs in Louisiana.
- id: 200
  category: signs_and_signals
  question: What does a solid yellow line on your side of a broken yellow center line
    mean in Louisiana?
  choices:
    A: Passing is permitted if the road is clear
    B: You are in a one-way zone
    C: Passing is prohibited on your side
    D: You must turn left at the next intersection
  answer: C
  explanation: A solid yellow line on your side of the center line means you are in
    a no-passing zone and cannot legally pass other vehicles.
- id: 201
  category: signs_and_signals
  question: 'In Louisiana, a sign shaped like an equilateral triangle with the point
    facing downward is used exclusively for:'
  choices:
    A: Stop signs
    B: Yield signs
    C: No Passing zones
    D: Railroad crossbucks
  answer: B
  explanation: The downward-pointing equilateral triangle is the specific shape reserved
    for Yield signs.
- id: 202
  category: signs_and_signals
  question: What do white transverse lines (lines painted across the lanes) at an
    intersection signify?
  choices:
    A: A designated parking area
    B: A stop line or crosswalk
    C: A speed trap area
    D: The end of a highway
  answer: B
  explanation: Transverse lines are used to indicate where a driver must stop for
    a signal or sign (stop lines) or where pedestrians cross (crosswalks).
- id: 203
  category: signs_and_signals
  question: 'When you see a round yellow sign with a black ''X'' and the letters ''RR'',
    you are approaching:'
  choices:
    A: A rest area
    B: A rural road
    C: A railroad crossing
    D: A roundabout
  answer: C
  explanation: The round yellow sign is a circular advance warning sign for a railroad
    crossing.
- id: 204
  category: signs_and_signals
  question: 'To signal that you are slowing down or stopping using hand signals, you
    should:'
  choices:
    A: Extend the left arm straight out
    B: Extend the left arm out and bend it upward
    C: Extend the left arm out and bend it downward
    D: Wave your hand back and forth
  answer: C
  explanation: The hand signal for slowing or stopping is the left arm extended out
    and bent downward at the elbow.
- id: 205
  category: signs_and_signals
  question: In Louisiana, what is the meaning of a blue traffic sign?
  choices:
    A: General warning
    B: Regulatory information
    C: Traveler services (food, gas, lodging)
    D: Construction information
  answer: C
  explanation: Blue signs provide information about motorist services such as gas,
    food, lodging, hospitals, and parks.
- id: 206
  category: signs_and_signals
  question: What is the specific shape and location of a 'No Passing Zone' sign in
    Louisiana?
  choices:
    A: A diamond shape on the right side of the road
    B: A pennant shape on the left side of the road
    C: A rectangular shape on the right side of the road
    D: A circular shape on the left side of the road
  answer: B
  explanation: In Louisiana, the 'No Passing Zone' sign is a pennant-shaped yellow
    warning sign placed on the left side of the road to indicate the beginning of
    a zone where passing is prohibited.
- id: 207
  category: signs_and_signals
  question: When a traffic signal is horizontal instead of vertical in Louisiana,
    which side is the red light located on?
  choices:
    A: The far right
    B: The far left
    C: The middle
    D: It varies by parish
  answer: B
  explanation: When traffic signals are arranged horizontally, Louisiana law dictates
    that the red light is always on the far left, followed by yellow in the middle
    and green on the right.
- id: 208
  category: signs_and_signals
  question: In Louisiana, if you intend to turn left and are using hand signals, how
    should you position your arm?
  choices:
    A: Arm extended straight out the window
    B: Arm bent upward at a 90-degree angle
    C: Arm bent downward at a 90-degree angle
    D: Arm waving in a circular motion
  answer: A
  explanation: To signal a left turn using hand signals in Louisiana, the driver must
    extend their left arm straight out of the window.
- id: 209
  category: signs_and_signals
  question: What does a solid white line between two lanes of traffic moving in the
    same direction indicate?
  choices:
    A: You are in a one-way street
    B: You should stay in your lane and only cross if necessary
    C: Passing is strictly prohibited
    D: The lane is for carpools only
  answer: B
  explanation: A solid white line between lanes of traffic moving in the same direction
    discourages lane changes. While not strictly illegal to cross in all contexts
    like a double line, it signifies that you should stay in your lane unless a special
    situation requires a change.
- id: 210
  category: signs_and_signals
  question: What color are 'Service Signs' that provide information about gas, food,
    and lodging in Louisiana?
  choices:
    A: Green
    B: Brown
    C: Blue
    D: Yellow
  answer: C
  explanation: Service signs, which provide directions to facilities like hospitals,
    gas stations, and hotels, are blue with white lettering/symbols.
- id: 211
  category: signs_and_signals
  question: What does a round yellow sign with a large 'X' and the letters 'RR' indicate?
  choices:
    A: A road construction zone ahead
    B: A rural route delivery area
    C: A railroad crossing ahead
    D: A restricted roadway
  answer: C
  explanation: The round yellow sign with a black 'X' and 'RR' is the advance warning
    sign for a railroad crossing.
- id: 212
  category: signs_and_signals
  question: If you are approaching a school bus that has stopped on a highway with
    a physical median (such as a concrete barrier or a grass strip), do you have to
    stop if you are traveling in the opposite direction?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, you do not have to stop if there is a physical median
    C: Yes, but only if the bus driver signals you
    D: No, but you must slow down to 15 mph
  answer: B
  explanation: Louisiana RS 32:80 states that the driver of a vehicle upon a highway
    with separate roadways need not stop upon meeting or passing a school bus which
    is on a different roadway (separated by a physical barrier or ditch).
- id: 213
  category: signs_and_signals
  question: What is the meaning of an orange-colored diamond-shaped sign?
  choices:
    A: General warning of road hazards
    B: Directional guidance to state parks
    C: Construction or maintenance warning
    D: School zone crossing
  answer: C
  explanation: Orange is the standard color for construction and maintenance signs
    in Louisiana and across the US.
- id: 214
  category: signs_and_signals
  question: A sign in the shape of a rectangle with a white background and black letters
    is generally what type of sign?
  choices:
    A: Warning sign
    B: Regulatory sign
    C: Guide sign
    D: Incident management sign
  answer: B
  explanation: Vertical rectangular signs with black text on a white background are
    regulatory signs, such as speed limit signs, which inform drivers of traffic laws
    and regulations.
- id: 215
  category: signs_and_signals
  question: In Louisiana, what does a double solid yellow line in the center of the
    roadway mean?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is prohibited from either direction
    D: It marks the edge of the roadway
  answer: C
  explanation: Double solid yellow lines indicate that passing is prohibited for traffic
    moving in both directions.
- id: 216
  category: signs_and_signals
  question: What hand signal should you use to indicate that you are slowing down
    or stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward with palm facing the rear
    D: Right arm waving out the window
  answer: C
  explanation: The hand signal for stopping or slowing down is the left arm extended
    downward with the palm of the hand facing toward the rear.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 217
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 218
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 219
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 220
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 221
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 222
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 223
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 224
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 225
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 226
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 227
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 228
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 229
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 230
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 231
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 232
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
