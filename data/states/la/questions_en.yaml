  question: What is "highway hypnosis"?
  choices:
    A: A condition where a driver falls completely asleep at the wheel
    B: A state where your senses become dulled and your eyes become fixed on the road
    C: A visual illusion caused by heat on the highway surface
    D: A tendency to drive faster than the speed limit on open roads
  answer: B
  explanation: Boredom on long trips can lead to "highway hypnosis," which is when
