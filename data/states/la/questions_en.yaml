  category: safe_driving_rules
  question: When passing another vehicle on the left, you must complete the passing
    maneuver before coming within how many feet of an approaching vehicle?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: You must complete a passing maneuver before coming within 100 feet
    of any vehicle approaching from the opposite direction.
- id: 288
  category: safe_driving_rules
  question: When is it against the law to pass another vehicle on the left?
  choices:
    A: When you are within 100 feet of an intersection or railroad crossing.
    B: When you are within 200 feet of a bridge or tunnel.
    C: When there is a dashed yellow line in your lane.
    D: When you are driving on a multi-lane highway.
  answer: A
  explanation: According to the manual, it is against the law to pass another vehicle
    when you are within one hundred feet of an intersection or a railroad crossing.
- id: 289
  category: safe_driving_rules
  question: Under what condition may you pass to the right of another vehicle by driving
    off the roadway onto the shoulder?
  choices:
    A: When the vehicle ahead is turning left.
    B: When traffic is backed up and moving slowly.
    C: Under no circumstances.
    D: If the shoulder is paved and clear of debris.
  answer: C
  explanation: 'The manual states: "You may never pass to the right of another vehicle
    by driving off the roadway onto the shoulder of the road."'
- id: 290
  category: defensive_driving
  question: When passing another vehicle, when is it generally accepted as safe to
    return to your proper lane?
  choices:
    A: When you are parallel with the other vehicle.
    B: As soon as you clear the other vehicle's front bumper.
    C: When you see the complete front of the passed vehicle in your rearview mirror.
    D: After exactly three seconds have passed.
  answer: C
  explanation: An accepted rule is to wait until you see the other car in your rear
    view mirror, specifically continuing to pass until the complete front of the passed
    vehicle is visible.
- id: 291
  category: sharing_the_road
  question: What should you do if you are driving on a two-lane highway and another
    vehicle is about to overtake and pass you?
  choices:
    A: Speed up to prevent them from passing.
    B: Move to the left to block their view.
    C: Maintain your speed and stay in the center of your lane.
    D: Slow your speed a little and move over to the right as far as you can safely.
  answer: D
  explanation: When you are about to be overtaken and passed, make it as safe and
    easy as possible by slowing your speed a little and moving over to the right as
    far as you can safely on a two-lane highway.
- id: 292
  category: vehicle_information
  question: What is the best way to increase visibility when backing up your vehicle?
  choices:
    A: Rely entirely on your rearview mirror.
    B: Turn your head and look out the rear window.
    C: Use only your side mirrors.
    D: Honk your horn to warn others.
  answer: B
  explanation: The manual states that the best way to increase visibility when backing
    up is to turn your head and look out the rear window, and not to depend on your
    mirrors.
- id: 293
  category: defensive_driving
  question: Why are road surfaces most slippery immediately after the rain begins
    to fall?
  choices:
    A: The water mixes with dirt to create thick mud.
    B: The oil and grease on the pavement have not yet been washed away.
    C: The tires become cold and lose traction.
    D: The rain causes the asphalt to expand and become slick.
  answer: B
  explanation: Road surfaces are most slippery immediately after the rain begins to
    fall because the oil and grease on the pavement have not yet been washed away.
- id: 294
  category: defensive_driving
  question: If your car does NOT have an anti-lock brake system (ABS) and you find
    yourself in a skid, what should you do?
  choices:
    A: Slam on the brakes immediately.
    B: Steer in the opposite direction of the skid.
    C: Ease your foot off the gas, steer into the skid, and avoid using your brakes.
    D: Pump the brakes rapidly while keeping the steering wheel straight.
  answer: C
  explanation: If you find yourself in a skid, remain calm, ease your foot off the
    gas and carefully steer in the direction you want the front of the car to go.
    For cars without anti-lock brakes, avoid using your brakes.
- id: 295
  category: safe_driving_rules
  question: At what speed does partial hydroplaning typically start?
  choices:
    A: 25 miles per hour
    B: 35 miles per hour
    C: 45 miles per hour
    D: 55 miles per hour
  answer: B
  explanation: Partial hydroplaning starts at about 35 miles per hour, and increases
    with speed until the tires may lose all contact with the pavement at 55 mph.
- id: 296
  category: defensive_driving
  question: How can you recover if your vehicle begins to hydroplane?
  choices:
    A: Brake hard and steer sharply to the right.
    B: Accelerate to push through the layer of water.
    C: Keep your wheels straight and reduce your speed.
    D: Turn your steering wheel rapidly from side to side.
  answer: C
  explanation: To recover from hydroplaning, keep your wheels straight and reduce
    your speed. This will allow the tires and the road to regain contact.
- id: 297
  category: safe_driving_rules
  question: How far ahead will your lower beam headlights let you see clearly at night?
  choices:
    A: 50 to 100 feet
    B: 150 to 200 feet
    C: 250 to 300 feet
    D: 350 to 400 feet
  answer: B
  explanation: Your lower beam headlights will let you see clearly about 150 to 200
    feet ahead.
- id: 298
  category: safe_driving_rules
  question: Louisiana law requires you to use your lower headlight beams when approaching
    within how many feet of another vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You are required by law to use lower headlight beams when approaching
    within 500 feet of or following within 200 feet of another vehicle.
- id: 299
  category: safe_driving_rules
  question: When are you required by Louisiana law to have your headlights on?
  choices:
    A: Only between 8 PM and 6 AM.
    B: Between sunset and sunrise, and when precipitation necessitates the use of
      windshield wipers.
    C: Only when driving on unlit rural roads.
    D: Whenever you are driving over 55 mph.
  answer: B
  explanation: Louisiana law requires headlights to be on between sunset and sunrise,
    and when moisture or precipitation necessitates the use of windshield wipers.
- id: 300
  category: defensive_driving
  question: Why is it dangerous to pull up closely behind a large truck or bus that
    you intend to pass?
  choices:
    A: The truck may suddenly accelerate.
    B: Your vision of the road ahead may be obstructed.
    C: The wind resistance will slow your vehicle down.
    D: It is illegal to pass large trucks on a two-lane road.
  answer: B
  explanation: Do not pull up closely behind the vehicle you intend to pass (especially
    a large truck or bus). Your vision may be obstructed.
- id: 301
  category: defensive_driving
  question: How much should you increase your following distance when driving on unfamiliar
    roadways at night?
  choices:
    A: At least one additional second.
    B: At least two additional seconds.
    C: At least three additional seconds.
    D: At least four additional seconds.
  answer: B
  explanation: You need to increase your following distance by adding at least one
    additional second for night driving conditions and at least two additional seconds
    for driving on unfamiliar roadways at night.
- id: 302
  category: safe_driving_rules
  question: Under Louisiana law, when must you turn on your headlights due to weather
    conditions?
  choices:
    A: When visibility is less than 1,000 feet.
    B: When weather makes it difficult to see vehicles clearly from a distance of
      500 feet.
    C: Only when it is actively raining or snowing.
    D: When you cannot see the vehicle directly in front of you.
  answer: B
  explanation: The law requires that your headlights be on when driving in weather
    conditions that make it difficult for other people to see your vehicle clearly
    from a distance of 500 feet.
- id: 303
  category: defensive_driving
  question: What should you do if an approaching driver refuses to dim their headlights
    at night?
  choices:
    A: Flash your high beams repeatedly until they dim theirs.
    B: Look directly at their headlights to gauge their distance.
    C: Pull completely off the road and wait for them to pass.
    D: Look to the right edge of the road as a guide and slow down.
  answer: D
  explanation: If a stubborn driver refuses to dim the lights, look to the right edge
    of the road as a guide and slow down.
- id: 304
  category: signs_and_signals
  question: What does a flashing 'DON'T WALK' pedestrian signal indicate?
  choices:
    A: Pedestrians may not start crossing, but those already crossing may continue
      to a safe area.
    B: Pedestrians must immediately turn around and go back to the starting sidewalk.
    C: Vehicles must stop immediately to let pedestrians cross.
    D: Pedestrians have the right of way to begin crossing the street.
  answer: A
  explanation: Flashing 'DON'T WALK' signals means that pedestrians may not start
    to cross the roadway but those already crossing may continue to the nearest sidewalk,
    traffic island or safety zone.
- id: 305
  category: sharing_the_road
  question: What is your responsibility as a driver if you see a pedestrian crossing
    the street illegally (jaywalking)?
  choices:
    A: Honk your horn to warn them but maintain your speed.
    B: You must stop and yield to them at all times.
    C: Swerve into the oncoming lane to avoid them.
    D: You have the right of way, so proceed with caution without stopping.
  answer: B
  explanation: You must yield to pedestrians at all times. Even if they are not in
    a crosswalk and crossing the street where they should not be (jaywalking), which
    is illegal, you must stop for them.
- id: 306
  category: safe_driving_rules
  question: Why should you never pass a vehicle that is stopped at a crosswalk?
  choices:
    A: The stopped vehicle may be preparing to make an illegal U-turn.
    B: It is illegal to change lanes within 100 feet of an intersection.
    C: You may block the vision of the next driver or hit a pedestrian crossing the
      roadway.
    D: The stopped vehicle might suddenly accelerate.
  answer: C
  explanation: If you come too close to a pedestrian, you may block the vision of
    the next driver from seeing the pedestrian as he is crossing the roadway. You
    should not pass a vehicle stopped at a crosswalk.
- id: 307
  category: safe_driving_rules
  question: When walking along a roadway, in which direction should pedestrians walk?
  choices:
    A: In the same direction as traffic.
    B: Facing traffic when possible.
    C: On the right side of the road only.
    D: In the center median.
  answer: B
  explanation: Pedestrians should always walk facing traffic when possible and should
    never enter a roadway without checking for oncoming traffic.
- id: 308
  category: sharing_the_road
  question: When stopping for a visually impaired pedestrian at a crosswalk, why should
    you not stop your car more than five feet from the crosswalk?
  choices:
    A: To prevent other cars from passing you.
    B: Because the pedestrian uses the sound of your engine as a guide.
    C: So you can easily give the pedestrian verbal directions.
    D: To ensure you clear the intersection quickly.
  answer: B
  explanation: Don't stop your car more than five feet from the crosswalk. The pedestrian
    uses the sound of your engine as a guide, so drive up to the crosswalk to allow
    the person to hear you.
- id: 309
  category: sharing_the_road
  question: Which of the following is a recommended practice when dealing with a visually
    impaired pedestrian?
  choices:
    A: Honk your horn lightly to let them know you are waiting.
    B: Give them verbal directions to help them cross safely.
    C: Stop in the middle of the crosswalk to block other traffic.
    D: Do not give them verbal directions, as they listen to all traffic sounds before
      crossing.
  answer: D
  explanation: Don't give the pedestrian verbal directions. He listens to all traffic
    sounds before deciding to cross the street.
- id: 310
  category: driver_responsibility
  question: Using a cell phone while driving involves which three types of distraction?
  choices:
    A: Visual, manual, and cognitive.
    B: Visual, auditory, and physical.
    C: Manual, auditory, and psychological.
    D: Cognitive, physical, and emotional.
  answer: A
  explanation: 'Using a cell phone while driving involves all three types of distraction:
    visual, taking your eyes off the road, manual, taking your hands off the wheel,
    and cognitive by taking your mind and focus off your driving.'
- id: 311
  category: safe_driving_rules
  question: If you are traveling at 55 mph, how far will your vehicle travel during
    the 4.6 seconds it takes to look away for a text message?
  choices:
    A: The length of a car.
    B: The length of a school bus.
    C: The length of a football field.
    D: One full mile.
  answer: C
  explanation: Texting causes a driver to look away from the road for 4.6 seconds.
    At a speed of 55 mph, the vehicle travels the length of a football field in that
    time frame.
- id: 312
  category: driver_responsibility
  question: According to DISTRACTION.GOV, how much more likely are you to be involved
    in a car crash if you text while driving?
  choices:
    A: 2 to 4 times more likely.
    B: 5 to 7 times more likely.
    C: 8 to 23 times more likely.
    D: 25 to 30 times more likely.
  answer: C
  explanation: According to DISTRACTION.GOV, if you text while driving you are 8 to
    23 times more likely to be involved in a car crash.
- id: 313
  category: penalties_and_points
  question: What is the Louisiana law regarding cell phone use for drivers 17 years
    of age and under?
  choices:
    A: They may only use hands-free devices.
    B: They are prohibited from using any type of wireless communication device while
      operating a motor vehicle.
    C: They may use cell phones only during daylight hours.
    D: They are allowed to make phone calls but cannot send text messages.
  answer: B
  explanation: Louisiana law prohibits anyone 17 years of age and under from using
    any type of wireless communication device while operating a motor vehicle.
- id: 314
  category: driver_responsibility
  question: According to the manual, what is the biggest single cause of teen death
    as a result of an auto accident?
  choices:
    A: Driving under the influence of alcohol.
    B: Texting while driving.
    C: Another teen, usually a friend.
    D: Poor weather conditions.
  answer: C
  explanation: Most people would be shocked to discover that the biggest single cause
    of a teen death as a result of an auto accident is another teen, usually a friend.
- id: 315
  category: sharing_the_road
  question: If a visually impaired pedestrian takes a step back and pulls in their
    cane, what does this indicate to a driver?
  choices:
    A: The pedestrian needs verbal directions.
    B: The pedestrian is waiting for you to honk your horn.
    C: It is a definite sign that you should go.
    D: The pedestrian dropped something and needs help.
  answer: C
  explanation: Don't wait too long for the pedestrian to cross the street. If the
    person takes a step back and pulls in his cane, that's a definite sign that you
    should go.
- id: 316
  category: safe_driving_rules
  question: At what age does the risk for a fatal crash start increasing for older
    drivers?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: C
  explanation: According to the manual, the risk for a fatal crash starts increasing
    at age 75 due largely to increased susceptibility to injury.
- id: 317
  category: safe_driving_rules
  question: How often should older drivers have their eyes checked?
  choices:
    A: Every six months
    B: At least once a year
    C: Every two years
    D: Only when renewing their license
  answer: B
  explanation: The manual recommends that older drivers have their eyes checked at
    least once a year and always wear required glasses or contacts.
- id: 318
  category: sharing_the_road
  question: According to Louisiana law, who is required to wear an approved helmet
    when operating or riding as a passenger on a bicycle?
  choices:
    A: All riders regardless of age
    B: Children under the age of 12
    C: Children under the age of 16
    D: Only passengers on a bicycle
  answer: B
  explanation: Louisiana Revised Statute 32:199 states that all children under the
    age of 12 must wear an approved helmet when operating or as a passenger on a bicycle.
- id: 319
  category: sharing_the_road
  question: What rights do bicycles have on public roads?
  choices:
    A: They must yield to all motorized vehicles at all times
    B: They have the same rights and must follow the same traffic laws as other vehicles
    C: They are only allowed on sidewalks and designated bike paths
    D: They have the right-of-way over all other traffic
  answer: B
  explanation: Bicycles have the same rights to use public roads as automobiles and
    must follow the same traffic laws as other vehicles.
- id: 320
  category: sharing_the_road
  question: What is the minimum distance required between a passing automobile and
    a slower traveling bicyclist?
  choices:
    A: One foot
    B: Two feet
    C: Three feet
    D: Five feet
  answer: C
  explanation: A three foot distance must be present between the passing automobile
    and slower traveling bicyclists.
- id: 321
  category: sharing_the_road
  question: Why might a bicyclist not travel in the extreme right of the lane?
  choices:
    A: To block faster moving traffic
    B: To avoid gravel, debris, bad pavement, or sewer grates
    C: Because they are preparing to make a right turn
    D: To ride side-by-side with oncoming traffic
  answer: B
  explanation: Bicyclists not traveling in the extreme right of the lane may be trying
    to avoid gravel, debris, bad pavement, sewer grates and other obstacles.
- id: 322
  category: sharing_the_road
  question: Why should drivers increase their following distance behind bicyclists?
  choices:
    A: Bicycles have shorter stopping distances than automobiles
    B: Bicycles are more likely to stall in intersections
    C: Bicyclists cannot see vehicles behind them
    D: Bicycles travel much faster than cars
  answer: A
  explanation: Drivers should increase following distances behind bicyclists because
    bicycle-stopping distances are shorter than automobiles.
- id: 323
  category: sharing_the_road
  question: What is a common cause of accidents when drivers make a right turn near
    a bicyclist?
  choices:
    A: Waiting for the bicyclist to pass before turning
    B: Swinging in front of a bicyclist after overtaking them
    C: Making eye contact with the bicyclist
    D: Using a turn signal too early
  answer: B
  explanation: Making a right turn after overtaking a bicyclist is a cause of accidents.
    Drivers should not swing in front of a bicyclist to make a right turn.
- id: 324
  category: sharing_the_road
  question: 'Bicycle speeds are hard to judge and can vary from under 10 mph to over:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: C
  explanation: Speeds of bicycles are hard to judge. They can vary from under 10 mph
    to over 35 mph.
- id: 325
  category: sharing_the_road
  question: If a driver opens their car door into traffic and a bicyclist collides
    with it, whose fault is the collision?
  choices:
    A: The bicyclist's fault
    B: The driver's fault
    C: Both share equal fault
    D: No one's fault, it is an unavoidable accident
  answer: B
  explanation: When opening your car door into traffic, look first for bicyclists.
    This collision is the driver’s fault.
- id: 326
  category: sharing_the_road
  question: How might a bicyclist react when crossing railroad tracks?
  choices:
    A: They will always stop and walk their bike across
    B: They may slow down and possibly zigzag in order to cross the tracks
    C: They will speed up to cross as quickly as possible
    D: They will ride on the extreme right edge of the tracks
  answer: B
  explanation: Railroad crossings can cause bicyclists to slow down and possibly zigzag
    in order to cross the tracks.
- id: 327
  category: sharing_the_road
  question: When riding at night, what type of lights or reflectors must a bicycle
    have?
  choices:
    A: A white front light and a red rear light or reflector
    B: A yellow front light and a white rear reflector
    C: Flashing red lights on both the front and rear
    D: Only a white reflector on the rear
  answer: A
  explanation: When riding at night, bicycles must have a white front light and a
    red rear light or reflector visible from the rear.
- id: 328
  category: sharing_the_road
  question: 'Research shows that over two-thirds of car/motorcycle collisions are
    the result of:'
  choices:
    A: The motorcyclist speeding
    B: The motorcyclist tailgating the car
    C: The other driver turning in front of a motorcyclist
    D: The other driver stopping too quickly
  answer: C
  explanation: Research shows that over two-thirds of the car/motorcycle collisions
    are the results of the other driver turning in front of a motorcyclist.
- id: 329
  category: sharing_the_road
  question: Why might a motorcycle appear farther away and traveling slower than it
    actually is?
  choices:
    A: Because motorcycles have dimmer headlights
    B: Because of its small profile and narrow silhouette
    C: Because motorcycles are quieter than cars
    D: Because they always ride in the center of the lane
  answer: B
  explanation: Motorcycles present a narrow silhouette. The small profile of the motorcycle
    may make it appear farther away and traveling slower than it actually is.
- id: 330
  category: sharing_the_road
  question: 'When driving near bicyclists, you should:'
  choices:
    A: Tap your horn lightly to let them know you are there
    B: Blow your horn loudly if they are in the center of the lane
    C: Never blow your horn near bicyclists
    D: Use your horn only when passing them
  answer: C
  explanation: 'The manual explicitly states: ''Do not blow your horn when near bicyclists.'''
- id: 331
  category: sharing_the_road
  question: When driving near a motorcycle, how much of the traffic lane is the motorcycle
    entitled to?
  choices:
    A: Half of the lane
    B: The full width of the lane
    C: The left portion of the lane only
    D: The right portion of the lane only
  answer: B
  explanation: According to the manual, motorcycles are allowed the full width of
    a lane in which to maneuver, and drivers should refrain from sharing a lane with
    them.
- id: 332
  category: sharing_the_road
  question: Where is the most likely place for a car and motorcycle collision to occur?
  choices:
    A: On interstate highways
    B: At intersections
    C: In parking lots
    D: On winding rural roads
  answer: B
  explanation: The manual states that intersections are the most likely place for
    car/motorcycle collisions to occur, usually because the car driver does not see
    the motorcycle.
- id: 333
  category: safe_driving_rules
  question: What is the minimum recommended following distance you should maintain
    when driving behind a motorcycle?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: When driving behind a motorcycle, you should allow at least a four
    (4)-second following distance to provide the cyclist enough room to maneuver or
    stop in an emergency.
- id: 334
  category: defensive_driving
  question: Why should you wait until a motorcyclist's maneuver is unmistakably started
    before assuming their intentions?
  choices:
    A: Motorcycle turn signals are often too dim to see.
    B: Motorcycles are not required to use turn signals.
    C: Turn signals may not automatically shut off on a motorcycle.
    D: Motorcyclists use hand signals instead of electronic signals.
  answer: C
  explanation: The manual warns not to assume a cyclist's intention because turn signals
    may not automatically shut off on a motorcycle, and cyclists occasionally forget
    to cancel them after a turn.
- id: 335
  category: safe_driving_rules
  question: How should you handle your vehicle's headlights when approaching a motorcycle
    at night?
  choices:
    A: Keep them on high beam so the motorcyclist can see you.
    B: Flash them repeatedly to warn the motorcyclist of your presence.
    C: Turn them off momentarily as you pass.
    D: Always dim your headlights just as you would for other vehicles.
  answer: D
  explanation: You should always dim your headlights for a motorcycle just as required
    for other vehicles, because their single headlight and tail light can blend into
    other lights, causing you to misjudge distance.
- id: 336
  category: vehicle_information
  question: Under clear, dry conditions, what is the minimum distance required for
    a loaded tractor-trailer traveling at 55 mph to come to a complete stop?
  choices:
    A: 150 feet
    B: 200 feet
    C: 290 feet
    D: 400 feet
  answer: C
  explanation: A tractor trailer loaded with freight, safe-rated tires, and properly
    adjusted brakes traveling at 55 miles per hour on a clear, dry roadway requires
    a minimum of 290 feet to come to a complete stop.
- id: 337
  category: sharing_the_road
  question: How can you tell if you are driving in a large truck's blind spot?
  choices:
    A: You are driving directly in front of the truck.
    B: You cannot see the truck driver's face in one of their side mirrors.
    C: You are driving in the left lane next to the truck.
    D: You can see the truck's license plate clearly.
  answer: B
  explanation: If you cannot see a truck driver's face in one of his mirrors, the
    driver cannot see you and probably does not know you are there.
- id: 338
  category: defensive_driving
  question: Why should you avoid cutting in front of a large truck to fill an open
    space in traffic?
  choices:
    A: The open space is the truck's cushion of safety needed for its longer stopping
      distance.
    B: The truck driver might speed up to close the gap.
    C: It is illegal to pass a truck on the left.
    D: Trucks have a shorter stopping distance than cars and might rear-end you.
  answer: A
  explanation: Do not cut in front of a truck just because you see open space. That
    space is the truck's cushion of safety because of its longer stopping distance.
- id: 339
  category: sharing_the_road
  question: What should you anticipate if you are stopped behind a large truck on
    a hill?
  choices:
    A: The truck will accelerate much faster than a car.
    B: The truck may roll backwards when it begins to accelerate.
    C: The truck will need to back up before moving forward.
    D: The truck's brake lights will flash repeatedly.
  answer: B
  explanation: If a truck is stopped on a hill, it will roll backwards when it begins
    to accelerate. You should leave extra space as a precaution.
- id: 340
  category: safe_driving_rules
  question: When passing a large truck on a windy day, what should you do to minimize
    the effects of turbulence?
  choices:
    A: Honk your horn to alert the truck driver.
    B: Drive as close to the truck as possible to block the wind.
    C: Stay to the outer edge of the lane away from the truck and hold the wheel tightly.
    D: Speed up and swerve slightly into the truck's lane.
  answer: C
  explanation: Turbulence from a truck on a windy day can cause a vehicle to swerve.
    To minimize this, stay to the outer edge of the lane away from the truck and hold
    the wheel tightly with both hands.
- id: 341
  category: safe_driving_rules
  question: What is the recommended following distance between your vehicle and a
    large truck in good road and weather conditions?
  choices:
    A: 2 to 3 seconds
    B: 4 to 5 seconds
    C: 6 to 7 seconds
    D: 8 to 10 seconds
  answer: B
  explanation: In good road and weather conditions you should leave a gap of at least
    four to five (4-5) seconds between your vehicle and the truck in front of you.
- id: 342
  category: sharing_the_road
  question: Why must you keep your headlights on low beam when following a large truck
    at night?
  choices:
    A: High beams will drain your vehicle's battery faster.
    B: The truck's side mirrors will reflect high beams directly into the truck driver's
      eyes.
    C: Low beams make it easier for you to see the truck's brake lights.
    D: High beams will cause the truck's taillights to glare.
  answer: B
  explanation: When following at night, keep your headlights on low beam because the
    truck's many side mirrors will reflect high beam lights right into the driver's
    eyes.
- id: 343
  category: defensive_driving
  question: What should you do to maximize visibility when an oncoming large truck
    is approaching you in wet conditions?
  choices:
    A: Turn on your high beams.
    B: Turn on your windshield wipers before the truck passes you.
    C: Pull over to the shoulder until the truck passes.
    D: Flash your hazard lights.
  answer: B
  explanation: If you are approaching an oncoming truck in wet conditions, turn on
    your wipers before it passes you to ensure your windshield is cleaned as soon
    as any spray is thrown onto it.
- id: 344
  category: sharing_the_road
  question: What are the 'No-Zones' on a large truck?
  choices:
    A: Areas where trucks are not allowed to park.
    B: Lanes on the highway restricted from truck use.
    C: Blind spots around the front, back, and sides of the truck.
    D: Weigh stations where cars are not permitted.
  answer: C
  explanation: Large trucks have blind spots, or No-Zones, around the front, back
    and sides of the truck where it is difficult for the driver to see.
- id: 345
  category: sharing_the_road
  question: Why is it dangerous to pass a motorcycle too fast or too close?
  choices:
    A: The motorcycle may speed up to race you.
    B: The wind blast from your vehicle can blow the motorcycle out of control.
    C: The motorcyclist might not hear your engine.
    D: It is illegal to pass a motorcycle on a multi-lane highway.
  answer: B
  explanation: You should not pass a motorcycle too fast or too close because the
    wind blast of large, fast moving vehicles can blow a motorcycle out of control.
- id: 346
  category: sharing_the_road
  question: What is a good rule of thumb to know if a truck driver can see your vehicle?
  choices:
    A: If you are within 50 feet of the truck.
    B: If you can see the truck driver in the truck's mirror.
    C: If you honk your horn and they do not brake.
    D: If you are driving on the right side of the truck.
  answer: B
  explanation: The manual states, 'Remember, if you can’t see the truck driver in
    the truck’s mirror, the truck driver can’t see you.'
- id: 347
  category: sharing_the_road
  question: When passing a large truck, when is it safe to pull back in front of it?
  choices:
    A: As soon as your rear bumper clears the truck's front bumper.
    B: When you can see the whole front of the vehicle in your rear-view mirror.
    C: When the truck driver flashes their headlights.
    D: After you have maintained your speed for at least 10 seconds.
  answer: B
  explanation: When passing a truck, you should 'Look for the whole front of the vehicle
    in your rear-view mirror before pulling in front and maintaining speed.'
- id: 348
  category: sharing_the_road
  question: Why should you avoid getting between a large truck and the curb when the
    truck is making a right turn?
  choices:
    A: The truck may accelerate suddenly.
    B: The truck will sometimes swing wide to the left to safely turn right, creating
      a 'squeeze play.'
    C: The truck's exhaust is most dangerous on the right side.
    D: It is illegal to pass a truck on the right under any circumstances.
  answer: B
  explanation: Trucks sometimes swing wide to the left to clear a corner. If you try
    to get in between the truck and the curb, you will be squeezed in between them
    and could suffer a serious crash.
- id: 349
  category: driver_responsibility
  question: If you are stopped by a police officer, what should you do with your hands?
  choices:
    A: Keep them hidden in your lap.
    B: Reach into the glove compartment immediately for your registration.
    C: Keep your hands visible.
    D: Wave them outside the window to show you are unarmed.
  answer: C
  explanation: During a traffic stop, the manual explicitly instructs drivers to 'Keep
    your hands visible.'
- id: 350
  category: driver_responsibility
  question: What should you do if an unmarked vehicle with a non-uniformed officer
    signals you to stop in a deserted, unlit area and you feel uncomfortable?
  choices:
    A: Ignore the officer and drive all the way home.
    B: Speed up to escape the unmarked vehicle.
    C: Explain this to the officer and ask if you can proceed to a more populated
      or better illuminated area.
    D: Stop immediately and exit your vehicle to confront the officer.
  answer: C
  explanation: If you are uncomfortable stopping in an area that is deserted or not
    well-lit, you should 'explain this to the officer and ask if you can proceed to
    a more populated or better illuminated area.'
- id: 351
  category: signs_and_signals
  question: What must you do if you approach an intersection where the traffic-control
    signal is not functioning?
  choices:
    A: Yield to the vehicle on your left and proceed without stopping.
    B: Treat the intersection as an all-way or four-way stop.
    C: The vehicle on the major roadway has the right-of-way.
    D: Wait until a police officer arrives to direct traffic.
  answer: B
  explanation: When a traffic-control signal is not functioning at an intersection,
    the intersection shall revert to an all-way or four-way stop.
- id: 352
  category: safe_driving_rules
  question: According to the laws of physics mentioned in the manual, how much more
    violent is a frontal impact at 35 mph compared to one at 30 mph?
  choices:
    A: One-quarter more violent
    B: One-third more violent
    C: Twice as violent
    D: Three times as violent
  answer: B
  explanation: The manual states that crash severity increases disproportionately
    with vehicle speed, noting that 'A frontal impact at 35 mph, for example, is one-third
    more violent than one at 30 mph.'
- id: 353
  category: safe_driving_rules
  question: Can you be cited for a speed violation if you are driving the posted speed
    limit?
  choices:
    A: No, as long as you do not exceed the posted limit, you are driving legally.
    B: Yes, if you are traveling too fast for roadway or weather conditions.
    C: Yes, but only if you are driving in a school zone.
    D: No, speed limits account for all possible weather conditions.
  answer: B
  explanation: You may be cited for traveling too fast for conditions when above the
    legal limitations for the environment. For example, driving 55 mph in a snow storm
    is not acceptable even if the posted speed limit allows for 55 mph.
- id: 354
  category: safe_driving_rules
  question: What does the 'General Speed Law' require you to do?
  choices:
    A: You must always drive exactly at the posted speed limit.
    B: You must not drive at a speed greater than is reasonable for the conditions.
    C: You must drive at least 10 mph below the speed limit in bad weather.
    D: You must not drive slower than 45 mph on any highway.
  answer: B
  explanation: The General Speed Law is that you must not drive at a speed greater
    than is reasonable. You must drive at a safe, appropriate speed depending on the
    area, road, traffic, light, and weather conditions.
- id: 355
  category: safe_driving_rules
  question: How does the state define drag racing?
  choices:
    A: Driving more than 20 mph over the posted speed limit.
    B: Weaving in and out of traffic on an interstate highway.
    C: The operation of two or more vehicles from a point side by side at accelerating
      speeds in a competitive attempt to outdo each other.
    D: Modifying a vehicle's engine to exceed factory speed specifications.
  answer: C
  explanation: Drag racing is defined as the operation of two or more vehicles from
    a point side by side at accelerating speeds in a competitive attempt to outdo
    each other.
- id: 356
  category: safe_driving_rules
  question: When driving on a multiple lane highway, when is it legal to cross a painted
    continuous centerline?
  choices:
    A: When passing a slow-moving vehicle.
    B: Only for the purpose of making a turn.
    C: When the right lane is blocked by construction.
    D: It is never legal to cross a painted continuous centerline.
  answer: B
  explanation: You cannot cross the painted continuous centerline of any multiple
    lane highways except for the purpose of making a turn.
- id: 357
  category: safe_driving_rules
  question: What is the minimum forward visibility required before attempting to pass
    another vehicle?
  choices:
    A: One-eighth of a mile
    B: One-quarter of a mile
    C: One-half of a mile
    D: One mile
  answer: B
  explanation: 'The manual states: ''if you can’t see at least a quarter mile ahead,
    don’t attempt to pass.'''
- id: 358
  category: safe_driving_rules
  question: Where is it explicitly dangerous and illegal to change lanes?
  choices:
    A: On a divided highway
    B: While driving through or approaching an intersection
    C: In a residential area
    D: On a single-lane roadway
  answer: B
  explanation: Do not change lanes while you are driving through an intersection or
    approaching an intersection as this is dangerous and illegal.
- id: 359
  category: sharing_the_road
  question: How far away must you stop from a school bus that is stopped to load or
    unload children?
  choices:
    A: At least 15 feet
    B: At least 20 feet
    C: At least 30 feet
    D: At least 50 feet
  answer: C
  explanation: You must stop at least thirty feet from a stopped school bus that is
    loading or unloading children.
- id: 360
  category: sharing_the_road
  question: At what distance will a school bus driver activate the flashing yellow
    lights before a school bus stop?
  choices:
    A: At least 50 feet but no more than 100 feet
    B: At least 100 feet but no more than 500 feet
    C: At least 200 feet but no more than 600 feet
    D: Exactly 500 feet
  answer: B
  explanation: Bus drivers will activate the flashing yellow lights of the bus at
    least 100 feet but no more than 500 feet before the school bus stop.
- id: 361
  category: safe_driving_rules
  question: When are you NOT required to stop for a stopped school bus with flashing
    red lights?
  choices:
    A: When traveling on a four-lane roadway not separated by a barrier
    B: When traveling on a four-lane or five-lane roadway separated by a dedicated
      two-way left turn lane
    C: When you are traveling directly behind the bus
    D: When you are traveling in the opposite direction on a two-lane road
  answer: B
  explanation: The manual states that drivers are not required to stop for a stopped
    school bus when traveling on four-lane or five-lane roadways which are separated
    by a dedicated two-way left turn lane.
- id: 362
  category: safe_driving_rules
  question: According to Louisiana law, how far in advance must you signal and get
    into the proper lane before making a turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: The law requires that you signal and get into the proper lane at least
    100 feet before making a turn.
- id: 363
  category: defensive_driving
  question: Why should you keep your wheels straight while waiting to make a left
    turn?
  choices:
    A: It helps the power steering system cool down.
    B: It prevents you from being pushed into oncoming traffic if you are hit from
      behind.
    C: It allows you to accelerate faster when the light turns green.
    D: It signals to other drivers that you are yielding the right-of-way.
  answer: B
  explanation: The manual advises to keep your wheels straight while waiting to turn
    because this will prevent you from being pushed into traffic if you are hit from
    behind.
- id: 364
  category: safe_driving_rules
  question: 'You should not attempt to turn around on a hill or in a curve if your
    vehicle cannot be seen by approaching drivers within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Do not attempt to turn around while on a hill or in a curve where your
    vehicle cannot be seen by other drivers approaching from either direction within
    500 feet.
- id: 365
  category: safe_driving_rules
  question: What is the maximum distance you are allowed to travel in a shared center
    left turn lane?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: Louisiana law prohibits traveling in a shared center left turn lane
    for more than 200 feet.
- id: 366
  category: safe_driving_rules
  question: What is the recommended speed when entering a roundabout or traffic circle?
  choices:
    A: 5 to 10 mph
    B: 15 to 20 mph
    C: 25 to 30 mph
    D: 35 to 40 mph
  answer: B
  explanation: When entering a roundabout or traffic circle, you must negotiate a
    sharp curve and should slow your speed to about 15 to 20 mph.
- id: 367
  category: safe_driving_rules
  question: In which direction do vehicles travel around a roundabout or traffic circle?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a figure-eight pattern
    D: Whichever direction is shortest to the exit
  answer: B
  explanation: Vehicles travel counterclockwise around a raised center island in a
    roundabout or traffic circle.
- id: 368
  category: signs_and_signals
  question: How should you signal if you intend to turn left at a roundabout?
  choices:
    A: Signal 'left' on the approach, and signal 'right' once you have traveled three-quarters
      of the way around to exit.
    B: Signal 'left' continuously until you have completely exited the roundabout.
    C: No signal is needed when approaching, but signal 'left' to exit.
    D: Signal 'right' on the approach and 'left' when exiting.
  answer: A
  explanation: If you intend to turn left, signal 'left' on the approach to the traffic
    circle or roundabout. Once you have traveled three quarters of the way around,
    signal 'right' to take the exit.
- id: 369
  category: safe_driving_rules
  question: When cornering, where should your hands be positioned on the steering
    wheel?
  choices:
    A: Ten and two o'clock
    B: Nine and three o'clock
    C: Eight and four o'clock
    D: One hand at twelve o'clock
  answer: B
  explanation: The 10-point plan for cornering states to keep both hands on the wheel
    at nine and three o'clock.
- id: 370
  category: vehicle_information
  question: In cornering, what is the 'apex'?
  choices:
    A: The point where turning begins.
    B: The point where the car is driving straight again.
    C: The point where the car reaches the furthest point on the inside of the turn.
    D: The point where you should apply maximum braking.
  answer: C
  explanation: Every corner is made of three parts. The apex is the point where the
    car reaches the furthest point on the inside of the turn.
- id: 371
  category: defensive_driving
  question: Why is it important to judge your speed correctly when cornering?
  choices:
    A: Because cornering load depends on speed squared, meaning doubling your speed
      generates four times the cornering force.
    B: Because slower speeds increase the cornering load on the tires.
    C: Because advisory speed signs are always perfectly accurate.
    D: Because cornering force is completely eliminated if you brake hard in the curve.
  answer: A
  explanation: The manual explains that cornering load (or force) depends on speed
    squared. Doubling the speed generates four times the cornering force, making it
    easy to exceed available grip if you enter too fast.
- id: 372
  category: safe_driving_rules
  question: If you and an oncoming driver meet at an intersection and both signal
    left turns, how should you proceed when it is safe?
  choices:
    A: Each driver should turn to the right of the center of the intersection.
    B: Each driver should turn to the left of the center of the intersection.
    C: The driver who arrived first must turn right instead.
    D: Both drivers should drive straight to avoid a collision.
  answer: B
  explanation: If two vehicles meet at an intersection and both signal left turns,
    the manual instructs that 'when safe, each driver should turn to the left of the
    center of the intersection.'
- id: 373
  category: safe_driving_rules
  question: What is the most efficient and smoothest way to enter a bend or corner?
  choices:
    A: Accelerate heavily into the curve
    B: Enter a little on the slow side
    C: Brake aggressively while turning
    D: Cross the center line to widen the turn
  answer: B
  explanation: The manual states that the most efficient, smoothest way around a bend
    is to enter it a little on the slow side, as entering too fast may cause a loss
    of control.
- id: 374
  category: safe_driving_rules
  question: How far in advance must you give a continuous turn signal before making
    a turn?
  choices:
    A: Not less than 50 feet
    B: Not less than 100 feet
    C: Not less than 200 feet
    D: Not less than 500 feet
  answer: B
  explanation: A right or left turn signal must be given continuously for not less
    than 100 feet before making the turn.
- id: 375
  category: signs_and_signals
  question: What is the correct hand signal for a right turn?
  choices:
    A: Left arm straight out
    B: Left arm bent downward
    C: Left arm bent up
    D: Right arm straight out
  answer: C
  explanation: According to the manual, the hand signal for a right turn is the left
    arm bent up.
- id: 376
  category: safe_driving_rules
  question: When is it illegal to flash your turn signals?
  choices:
    A: When changing lanes on a highway
    B: When pulling out of a parallel parking space
    C: On just one side of a parked or disabled vehicle
    D: When slowing down to stop
  answer: C
  explanation: It is illegal to flash your turn signals on just one side of a parked
    or disabled vehicle OR as a signal to another vehicle to pass you.
- id: 377
  category: safe_driving_rules
  question: Who has the right-of-way according to Louisiana law?
  choices:
    A: The driver on the right at a 4-way stop
    B: Pedestrians in a crosswalk
    C: Emergency vehicles with flashing lights
    D: The law does not give anyone the right-of-way; it only says who must yield
  answer: D
  explanation: The law says who must yield the right-of-way to another roadway user;
    it does not give anyone the right-of-way.
- id: 378
  category: safe_driving_rules
  question: What should you do if a traffic light malfunctions at an intersection?
  choices:
    A: Treat the intersection as a yield sign
    B: Treat the intersection as a 4-way stop
    C: The driver on the main road has the right-of-way
    D: Proceed without stopping if the road is clear
  answer: B
  explanation: If a traffic light has malfunctioned, the intersection becomes a 4-way
    stop intersection.
- id: 379
  category: safe_driving_rules
  question: When two vehicles approach a 4-way stop intersection at the same time,
    who must yield?
  choices:
    A: The driver on the right must yield to the driver on the left
    B: The driver on the left must yield to the driver on the right
    C: The vehicle traveling at a higher speed must yield
    D: The vehicle turning right must yield to the vehicle going straight
  answer: B
  explanation: When two vehicles approach an intersection at the same time, the driver
    on the left must yield the right-of-way to the vehicle on the right.
- id: 380
  category: safe_driving_rules
  question: When driving on an unpaved road that intersects with a paved road, which
    vehicle must yield?
  choices:
    A: The vehicle on the paved road
    B: The vehicle on the unpaved road
    C: The vehicle turning right
    D: The vehicle traveling faster
  answer: B
  explanation: You must yield the right-of-way when driving on an unpaved road that
    intersects with a paved road.
- id: 381
  category: safe_driving_rules
  question: What is the required stopping distance from the nearest rail of a railroad
    crossing when a train is approaching?
  choices:
    A: Within 100 feet but no less than 50 feet
    B: Within 50 feet but no less than 15 feet
    C: Within 30 feet but no less than 10 feet
    D: Within 25 feet but no less than 5 feet
  answer: B
  explanation: Louisiana law requires that the driver of any motor vehicle must stop
    within 50 feet but no less than 15 feet from the nearest rail of a railroad crossing
    when a train is approaching.
- id: 382
  category: defensive_driving
  question: What should you do if your vehicle stalls on a railroad track in the path
    of an oncoming train?
  choices:
    A: Stay in the vehicle and call 911
    B: Get out and run in the same direction the train is traveling
    C: Get out and move in the direction toward the approaching train away from the
      tracks
    D: Try to push the vehicle off the tracks before the train arrives
  answer: C
  explanation: If your vehicle stalls in the path of an oncoming train, get out and
    move in the direction toward the approaching train away from the tracks.
- id: 383
  category: vehicle_information
  question: If your vehicle has a manual transmission, what should you do when crossing
    railroad tracks?
  choices:
    A: Shift gears while crossing the tracks to maintain speed
    B: Shift into neutral and coast across the tracks
    C: Shift before reaching the tracks and do not change gears while crossing
    D: Accelerate heavily and upshift while on the tracks
  answer: C
  explanation: If your vehicle has a manual transmission, shift before reaching the
    tracks and do not change gears while crossing the tracks.
- id: 384
  category: sharing_the_road
  question: Which of the following vehicles is required by law to stop at all railroad
    crossings?
  choices:
    A: Passenger cars carrying more than four people
    B: Motorcycles and mopeds
    C: School buses and vehicles carrying explosives
    D: Emergency vehicles responding to a call
  answer: C
  explanation: Drivers of vehicles carrying passengers for hire, school buses or trucks,
    or any vehicle carrying explosives or flammable liquids must stop at railroad
    crossings.
- id: 385
  category: defensive_driving
  question: How long does it take for a 100-car freight train traveling at 55 miles
    per hour to stop?
  choices:
    A: About half a mile
    B: More than a mile
    C: Less than 500 feet
    D: Exactly 100 yards
  answer: B
  explanation: A 100 car freight train traveling at 55 miles per hour requires more
    than a mile to stop. That’s the length of 18 football fields.
- id: 386
  category: sharing_the_road
  question: When an emergency vehicle is sounding a siren and flashing warning lights,
    what must you do?
  choices:
    A: Speed up to get out of its way
    B: Stop immediately in your current lane
    C: Pull over to the right edge of the roadway clear of intersections and stop
    D: Pull over to the left edge of the roadway and slow down
  answer: C
  explanation: You must yield the right-of-way to emergency vehicles that are sounding
    a siren and flashing warning lights by pulling over to the right edge of the roadway
    clear of intersections and stopping.
- id: 387
  category: safe_driving_rules
  question: Where is backing up strictly prohibited under any circumstances?
  choices:
    A: On a one-way street
    B: On the shoulder or roadway of any controlled-access highway
    C: In a residential driveway
    D: In a parallel parking space
  answer: B
  explanation: Backing up is not permitted on the shoulder or roadway of any controlled-access
    highway. It is also prohibited at any other place unless it can be done safely.
- id: 388
  category: safe_driving_rules
  question: What is the maximum number of people legally allowed to occupy the front
    seat of a moving vehicle?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: It is against the law for more than three persons to occupy the front
    seat of a moving vehicle.
- id: 389
  category: safe_driving_rules
  question: Under Louisiana law, what is the minimum age for a passenger to legally
    ride in the open bed of a truck?
  choices:
    A: 10 years old
    B: 12 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: No person(s) under the age of twelve years shall be permitted to be
    a passenger in the open bed of a truck.
- id: 390
  category: safe_driving_rules
  question: What must a driver do when participating in a funeral procession?
  choices:
    A: Honk the horn at every intersection
    B: Drive with the high beam headlights on
    C: Have the headlights lighted and emergency lights flashing
    D: Drive on the left side of the roadway
  answer: C
  explanation: While participating in a funeral procession each driver shall have
    the headlights of the vehicle lighted and the emergency lights flashing.
- id: 391
  category: safe_driving_rules
  question: What is the minimum following distance required when following an emergency
    vehicle responding to a call?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Following emergency vehicles responding to a call closer than 500 feet
    is unlawful.
- id: 392
  category: safe_driving_rules
  question: When your windshield wipers are required to be in use, what else must
    you do?
  choices:
    A: Turn on your high beam headlights
    B: Turn on your hazard lights
    C: Turn on your low beam headlights
    D: Reduce your speed to 15 mph
  answer: C
  explanation: Louisiana law requires you have your headlights on (low beam) when
    your windshield wipers are required.
- id: 393
  category: license_system
  question: Between what hours are drivers under the age of 17 prohibited from driving
    unless accompanied by a qualified adult or sibling?
  choices:
    A: 9:00 p.m. and 6:00 a.m.
    B: 10:00 p.m. and 5:00 a.m.
    C: 11:00 p.m. and 5:00 a.m.
    D: Midnight and 6:00 a.m.
  answer: C
  explanation: Operators below age 17 are prohibited from driving between the hours
    of 11:00 p.m. and 5:00 a.m., unless accompanied by a licensed parent, guardian,
    or adult at least 21 years of age or sibling 18 years of age.
- id: 394
  category: sharing_the_road
  question: When riding on a public roadway not exclusively set aside for bicycles,
    what is the maximum number of bicyclists that may ride abreast (side-by-side)?
  choices:
    A: One (single file only)
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Bicyclists must not ride more than two abreast except on roadways set
    aside for exclusive bicycle use.
- id: 395
  category: sharing_the_road
  question: A child must be secured in an approved restraining seat to be a passenger
    on a bicycle if they meet which of the following criteria?
  choices:
    A: Weigh less than forty pounds or are less than forty inches in height
    B: Weigh less than fifty pounds or are less than forty-five inches in height
    C: Are under the age of five
    D: Are under the age of eight
  answer: A
  explanation: Children who weigh less than forty pounds or are less than forty inches
    in height must be properly seated and secured in an approved restraining seat
    to be a passenger upon a bicycle.
- id: 396
  category: safe_driving_rules
  question: According to Louisiana law, what must you do before leaving a motor vehicle
    unattended?
  choices:
    A: Leave the engine running if you will be gone less than five minutes
    B: Stop the motor, lock the ignition, remove the key, and set the brake
    C: Turn on the hazard lights and leave the keys in the ignition
    D: Park on the roadway instead of the soft shoulder
  answer: B
  explanation: No person driving or in charge of any motor vehicle shall permit it
    to stand unattended without first stopping the motor, locking the ignition, removing
    the key, and effectively setting the brake.
- id: 397
  category: penalties_and_points
  question: What are the potential penalties for the theft of motor vehicle fuel?
  choices:
    A: A warning for the first offense
    B: Only a fine
    C: Fine, loss of license, and possible jail time
    D: Mandatory community service only
  answer: C
  explanation: Theft of motor vehicle fuel is a crime punishable by fine, loss of
    license, and possible jail time.
- id: 398
  category: defensive_driving
  question: Which driving habit is recommended to help avoid becoming a victim of
    a staged automobile accident?
  choices:
    A: Tailgating the vehicle in front of you
    B: Avoiding tailgating and leaving plenty of space
    C: Driving slightly above the speed limit
    D: Relying on tow trucks that happen to show up at the scene
  answer: B
  explanation: To avoid becoming a victim of a staged automobile accident, the manual
    advises to avoid tailgating and always give yourself plenty of space between you
    and the vehicle in front of you.
- id: 399
  category: vehicle_information
  question: According to the "Park Smart" tips to prevent automobile theft, which
    of the following should you NOT do?
  choices:
    A: Put valuables in the trunk
    B: Park in well-lighted areas
    C: Hide a firearm in your vehicle
    D: Use vehicle immobilizers
  answer: C
  explanation: 'Under the "DON''T do these things" section for preventing automobile
    theft, the manual specifically states: "Don''t hide a firearm in your vehicle."'
- id: 400
  category: safe_driving_rules
  question: Who has the right of way when you are merging onto the interstate?
  choices:
    A: The merging vehicle
    B: Interstate traffic
    C: The faster moving vehicle
    D: Commercial trucks only
  answer: B
  explanation: The manual states, "Interstate traffic has the right of way. You can’t
    always count on other drivers either seeing you or moving over to give you space
    to enter."
- id: 401
  category: safe_driving_rules
  question: At what speed should you aim to enter the interstate?
  choices:
    A: 10 mph slower than the posted speed limit
    B: At or near the speed of traffic
    C: Exactly 70 miles per hour
    D: 45 miles per hour
  answer: B
  explanation: When entering the interstate, the manual advises to "Enter the interstate
    at or near the speed of traffic."
- id: 402
  category: defensive_driving
  question: How large of a gap do you need when merging into interstate traffic?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: C
  explanation: According to the manual, "When you merge into traffic, you need a gap
    of four seconds. That will give both you and the car you merge in front of a two-second
    following distance."
- id: 403
  category: defensive_driving
  question: What should you do to your space cushion when the weather is bad or the
    pavement is slick?
  choices:
    A: Keep it at exactly two seconds
    B: Reduce it by half to see the vehicle ahead better
    C: Maintain a three-second following distance
    D: Double the time of your space cushion
  answer: D
  explanation: The manual states that you should always keep at least a four seconds
    space cushion between you and the vehicle ahead, and "When the weather is bad
    or the pavement is slick, you should double that time."
- id: 404
  category: safe_driving_rules
  question: On an interstate with three or more lanes traveling in one direction,
    what is the far left lane primarily used for?
  choices:
    A: Exiting the interstate
    B: Entering the interstate
    C: Normal travel
    D: Passing
  answer: D
  explanation: The manual explains that on an interstate with three or more lanes,
    "The right hand lane is used for exiting and entering. The middle is often used
    as the 'travel' lane and the far left lane is for passing."
- id: 405
  category: defensive_driving
  question: What should you do if you are being followed too closely (tailgated) and
    slowing down does not encourage the driver to pass?
  choices:
    A: Tap your brakes repeatedly
    B: Pull over, stop and let the tailgater pass
    C: Speed up to increase the distance
    D: Change lanes without signaling
  answer: B
  explanation: If you are being tailgated, the manual advises to slow down and encourage
    the driver to pass. "If this fails, pull over, stop and let the tailgater pass."
- id: 406
  category: defensive_driving
  question: Which of the following is NOT one of the three basic elements to space
    management?
  choices:
    A: Speed control
    B: Lane position
    C: Braking distance
    D: Communication
  answer: C
  explanation: 'The three basic elements to space management listed in the manual
    are: 1. Speed control, 2. Lane position, and 3. Communication.'
- id: 407
  category: safe_driving_rules
  question: How far in advance should you check to make sure you are in the correct
    lane to exit the interstate?
  choices:
    A: Approximately a mile before your exit
    B: 500 feet before your exit
    C: Two miles before your exit
    D: Right as you see the exit ramp
  answer: A
  explanation: 'When preparing to exit, the manual states: "Approximately a mile before
    your exit, check to make sure you are in the correct lane to make the exit."'
- id: 408
  category: safe_driving_rules
  question: What is the safest and most legal action to take if you miss your intended
    interstate exit?
  choices:
    A: Stop on the shoulder and back up carefully
    B: Make a U-turn in the grassy median
    C: Go on to the next exit
    D: Stop in the right lane and wait for traffic to clear
  answer: C
  explanation: 'The manual explicitly warns: "If you miss your exit, do not stop;
    do not back up!... Go on to the next exit, get back on the interstate and return
    to the exit you want."'
- id: 409
  category: safe_driving_rules
  question: Where is the proper place to slow down when exiting an interstate?
  choices:
    A: In the right-hand travel lane before the exit
    B: Fully in the deceleration lane
    C: One mile before the exit ramp
    D: While changing lanes to exit
  answer: B
  explanation: 'The manual instructs: "Never slow down on the interstate itself. Wait
    until you are fully in the deceleration lane, and then reduce your speed to the
    posted ramp speed."'
- id: 410
  category: safe_driving_rules
  question: What should you do to make your vehicle more visible when driving on dusty
    gravel roads?
  choices:
    A: Turn on your high beam headlights
    B: Turn on your hazard lights
    C: Use low beam headlights
    D: Sound your horn periodically
  answer: C
  explanation: During dry periods on dusty gravel roads where vision is reduced, "It
    is recommended that you use low beam headlights to make your vehicle more visible
    to others..."
- id: 411
  category: defensive_driving
  question: Why must you increase your following distance when driving on dirt or
    gravel roads?
  choices:
    A: Because it takes much longer to stop due to loss of traction
    B: Because your brakes will overheat faster
    C: Because the vehicle will stop too quickly
    D: Because dirt roads are always narrower than paved roads
  answer: A
  explanation: The manual states that on gravel or dirt roads, "you must reduce your
    speed and increase your following distance, since it will take much longer to
    stop due to loss of traction."
- id: 412
  category: defensive_driving
  question: What is the most frequent type of crash on interstates?
  choices:
    A: Head-on collisions
    B: Sideswipes
    C: Rear-end collisions
    D: Rollovers
  answer: C
  explanation: According to the manual, "Rear-end collisions are the most frequent
    type of crashes on the interstates."
- id: 413
  category: safe_driving_rules
  question: If you must enter interstate traffic from a full stop on a short acceleration
    lane, approximately how much distance will you need to get up to the speed of
    other vehicles?
  choices:
    A: About 100 feet
    B: About a full block
    C: About half a mile
    D: About three car lengths
  answer: B
  explanation: 'The manual notes that this situation is dangerous, stating: "To enter
    traffic from a full stop, you will need about a full block to get up to the speed
    of the other vehicles on the interstate highway."'
- id: 414
  category: signs_and_signals
  question: How long should you signal your intention before making an exit from the
    interstate?
  choices:
    A: For approximately two seconds
    B: For approximately three seconds
    C: For approximately four seconds
    D: For approximately five seconds
  answer: D
  explanation: When preparing to exit, the manual instructs drivers to "Signal your
    intention for approximately five seconds and make sure you are at the proper speed
    for leaving the traffic lane..."
- id: 415
  category: safe_driving_rules
  question: What should you do when driving on gravel roads during dry periods to
    improve visibility?
  choices:
    A: Use high beam headlights
    B: Use low beam headlights
    C: Turn on your hazard lights
    D: Sound your horn frequently
  answer: B
  explanation: During dry periods, gravel roads can become extremely dusty, reducing
    vision. The manual recommends using low beam headlights to make your vehicle more
    visible to others, slowing down, and increasing following distance.
- id: 416
  category: defensive_driving
  question: 'When driving over open bridge gratings or steel bridges, you should:'
  choices:
    A: Accelerate to cross the bridge quickly
    B: Keep a firm grip on the steering wheel and increase your following distance
    C: Brake sharply before entering the bridge
    D: Move to the left lane to avoid the grating
  answer: B
  explanation: Traction for braking and steering is reduced on open bridge gratings
    or steel bridges. Due to this reduced traction, you should keep a firm grip on
    the steering wheel and increase your following distance.
- id: 417
  category: safe_driving_rules
  question: 'Before reaching the crest of a steep hill on a rural road, you should:'
  choices:
    A: Move to the left side of the road
    B: Maintain your speed and sound your horn
    C: Slow down, move to the right side of the road, and watch for oncoming vehicles
    D: Turn on your high beams to warn oncoming traffic
  answer: C
  explanation: Hills and curves on rural roads are often steeper and sharper. Before
    reaching the crest of a hill or entering a curve, slow down, move to the right
    side of the road and watch for oncoming vehicles.
- id: 418
  category: signs_and_signals
  question: 'Many highway-railroad grade crossings on rural roads are marked only
    with:'
  choices:
    A: Flashing red lights and crossing gates
    B: A stop sign and a yield sign
    C: A warning sign and a white X-shaped railroad crossing sign
    D: A yellow diamond sign and a traffic signal
  answer: C
  explanation: Many highway-railroad grade crossings on rural roads are marked only
    with a warning sign and a white X-shaped railroad crossing sign and typically
    do not have lights or crossing gates.
- id: 419
  category: defensive_driving
  question: During which times of day is wildlife most active and hardest to see?
  choices:
    A: Early afternoon and late evening
    B: Dusk and dawn
    C: Midnight and noon
    D: Mid-morning and mid-afternoon
  answer: B
  explanation: Wildlife is more active at dusk and dawn. This is also when it is hardest
    for our eyes to adjust as it is neither completely dark nor completely light.
- id: 420
  category: sharing_the_road
  question: 'If a domesticated animal, such as a cow or horse, wanders into the roadway,
    you should:'
  choices:
    A: Swerve around the animal as quickly as possible
    B: Sound your horn and brake in a controlled manner
    C: Rev your engine loudly to scare it away
    D: Flash your high beams repeatedly
  answer: B
  explanation: If a domesticated animal wanders into the roadway, sound your horn
    and brake in a controlled manner. Do not scare the animal or swerve around it,
    which could cause it to panic.
- id: 421
  category: defensive_driving
  question: What should you do if wild animals are on the road?
  choices:
    A: Sound your horn and rev your engine
    B: Swerve into oncoming traffic to avoid them
    C: Slow down or stop and pass as far away as possible
    D: Accelerate to scare them off the road
  answer: C
  explanation: If wild animals are on the road, you should slow down or stop, do not
    use the horn or rev the engine, and pass as far away from the animals as possible.
- id: 422
  category: defensive_driving
  question: Why might hitting a large animal like a deer be the safest alternative
    compared to swerving?
  choices:
    A: Swerving can cause a more serious crash by sending you into oncoming traffic
      or off the roadway.
    B: Animals will usually move out of the way at the last second.
    C: Hitting the animal causes less damage to the vehicle than braking hard.
    D: Swerving is illegal in rural areas.
  answer: A
  explanation: Do not swerve into oncoming traffic or off the roadway to avoid hitting
    the animal. This may result in a more serious crash than if the vehicle collided
    with the animal. Regretfully, the safest alternative may be hitting the animal.
- id: 423
  category: defensive_driving
  question: During which months are animals most active, requiring extra caution from
    drivers?
  choices:
    A: January through March
    B: April through June
    C: July through September
    D: October through December
  answer: D
  explanation: You should use caution when driving at dawn and dusk and between the
    months of October through December, when animals are most active.
- id: 424
  category: defensive_driving
  question: If a collision with an animal is inevitable, what should you do at the
    moment of impact?
  choices:
    A: Lock your brakes to stop as quickly as possible
    B: Take your foot off the brake to cause a slight lift of the vehicle
    C: Swerve sharply to the right
    D: Duck down below the steering wheel
  answer: B
  explanation: If an accident is inevitable, brake firmly, angle the vehicle and take
    your foot off the brake as you impact. The release of the brake will cause slight
    lift of the vehicle, which may stop the animal from rising into your windshield.
- id: 425
  category: signs_and_signals
  question: 'A fluorescent or reflective orange and red triangle displayed on the
    rear of a vehicle indicates:'
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is traveling less than 25 mph
    C: The vehicle is a school bus
    D: The vehicle is broken down and cannot move
  answer: B
  explanation: A fluorescent or reflective orange and red triangle displayed on the
    rear of vehicles drawn by animals, farm equipment or construction equipment means
    the vehicle is traveling less than 25 mph.
- id: 426
  category: sharing_the_road
  question: 'When a farm tractor needs to make a right turn, the operator may:'
  choices:
    A: Pull wide to the left and then turn to the right
    B: Signal using a flashing yellow light
    C: Move onto the right shoulder before turning
    D: Stop completely and wait for traffic to pass
  answer: A
  explanation: Farm machinery usually does not have turn signals and to make a right
    turn, operators of farm machinery may pull wide to the left and then turn to the
    right.
- id: 427
  category: sharing_the_road
  question: What is the normal speed range for animal-drawn vehicles?
  choices:
    A: 1 to 4 miles per hour
    B: 5 to 8 miles per hour
    C: 10 to 15 miles per hour
    D: 15 to 20 miles per hour
  answer: B
  explanation: Normal speeds for animal drawn vehicles range between 5 and 8 miles
    per hour.
- id: 428
  category: sharing_the_road
  question: 'When approaching or passing a horseback rider, you should NOT:'
  choices:
    A: Drive at a reasonable speed
    B: Maintain a reasonable distance away from the horse
    C: Sound your horn or 'rev' your engine loudly
    D: Pass cautiously on the left
  answer: C
  explanation: Do not sound your horn or “rev” your engine loudly when approaching
    or passing a horse. It could scare the horse and cause a crash.
- id: 429
  category: sharing_the_road
  question: 'If you are driving a slow-moving vehicle and causing vehicles behind
    you to slow down significantly, you should:'
  choices:
    A: Speed up to match the flow of traffic
    B: Turn on your hazard lights and stay in your lane
    C: Pull to the side of the roadway when safe to do so and let others pass
    D: Wave the vehicles behind you to pass on the left
  answer: C
  explanation: If you are driving a slow moving vehicle and you have to drive so slowly
    that other vehicles have to reduce speed to the rear, pull to the side of the
    roadway when safe to do so and let the other vehicles pass.
- id: 430
  category: vehicle_information
  question: How can overloading your vehicle or trailer affect its performance?
  choices:
    A: It improves tire traction on wet roads.
    B: It causes harm to your brakes and damages your suspension.
    C: It increases your vehicle's fuel efficiency.
    D: It makes the steering wheel vibrate at high speeds.
  answer: B
  explanation: According to the manual, if a vehicle is overloaded, it can cause harm
    to your brakes making it hard for you to stop or slow down and can damage your
    suspension.
- id: 431
  category: safe_driving_rules
  question: What is the proper headlight usage when driving in a heavy downpour or
    fog?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: The manual instructs drivers to slow down and turn on their low beam
    headlights when driving in a heavy downpour or in fog.
- id: 432
  category: defensive_driving
  question: What should you do if you encounter fog that is so dense it severely impairs
    your vision?
  choices:
    A: Creep along the highway at 10 to 20 miles per hour.
    B: Turn on your high beams to cut through the fog.
    C: Get off the highway and stop at the nearest safe place.
    D: Follow closely behind the vehicle in front of you to see their taillights.
  answer: C
  explanation: The manual states that if fog is so dense it impairs your vision, you
    should not drive at all. If you must drive, you should slow down and drive to
    the nearest place to get off the highway and stop. Creeping at 10 to 20 mph on
    the highway risks your life.
- id: 433
  category: safe_driving_rules
  question: At what distance should you dim your high beam headlights when an oncoming
    vehicle is approaching?
  choices:
    A: Within about a one-block distance
    B: Within 500 feet
    C: Within 1000 feet
    D: Only when the other driver flashes their lights
  answer: A
  explanation: The manual advises to dim your high beams whenever you come within
    about a one-block distance of an oncoming vehicle.
- id: 434
  category: defensive_driving
  question: What should you do if an oncoming driver fails to dim their high beam
    headlights?
  choices:
    A: Keep your bright lights on to get back at the other driver.
    B: Look directly into the oncoming headlights to track the vehicle.
    C: Look toward the right side of the road to avoid being blinded.
    D: Turn off your headlights momentarily to signal the driver.
  answer: C
  explanation: If a driver fails to dim their lights, the manual says to look toward
    the right side of the road to keep from being blinded by their headlights, and
    warns against keeping your brights on to 'get back' at them.
- id: 435
  category: safe_driving_rules
  question: 'When driving at night in rural areas, you should increase your following
    distance to at least:'
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: In the country or more rural areas at night, the manual states you
    should increase your following distance to at least four seconds.
- id: 436
  category: defensive_driving
  question: Which of the following best describes a 'closed condition' on the roadway?
  choices:
    A: A wide, open space with no restrictions around your car.
    B: A situation where space is unavailable for your path of travel or your view
      is restricted.
    C: A roadway that has been shut down for construction.
    D: A transition from a rural highway to an urban street.
  answer: B
  explanation: The manual defines a closed zone as one that is not available for your
    car's path of travel, where there is a restriction to the driver's view, or where
    space is unavailable, typically encountered in moderate to heavy traffic.
- id: 437
  category: defensive_driving
  question: Why is the urban driving environment typically more challenging for novice
    drivers?
  choices:
    A: There are fewer traffic control devices.
    B: The speed limits are generally higher than on interstates.
    C: There are more stimuli to sort out and react to.
    D: There are mostly open conditions with no restrictions.
  answer: C
  explanation: According to the manual, the urban driving environment is more challenging
    to the novice driver because there are more stimuli to be sorted and react to.
- id: 438
  category: driver_responsibility
  question: When planning a trip where only one person will be driving, what is the
    recommended daily driving limit?
  choices:
    A: 4 to 6 hours
    B: 6 to 8 hours
    C: 8 to 10 hours
    D: 10 to 12 hours
  answer: B
  explanation: The manual states that if one person will be doing all of the driving,
    6 to 8 hours of driving in any one day should be considered the limit.
- id: 439
  category: driver_responsibility
  question: 'If two or more people are sharing the driving duties on a road trip,
    the total driving time in one day should not exceed:'
  choices:
    A: 8 to 9 hours
    B: 10 to 11 hours
    C: 12 to 14 hours
    D: 15 to 16 hours
  answer: B
  explanation: When two or more persons can share the driving, the manual specifies
    that total driving time should not exceed 10 to 11 hours.
- id: 440
  category: safe_driving_rules
  question: When traveling on major highways, how often should you plan to take a
    10 to 15 minute break?
  choices:
    A: Every hour
    B: Every 2 to 3 hours
    C: Every 4 to 5 hours
    D: Only when stopping for meals
  answer: B
  explanation: The manual recommends taking 10 to 15 minute breaks every 2 to 3 hours
    when driving on major highways.
- id: 441
  category: safe_driving_rules
  question: Why should you avoid wearing colored glasses or sunglasses when driving
    at night?
  choices:
    A: They reflect light back into the eyes of oncoming drivers.
    B: They cause your eyes to adjust more slowly and reduce your vision.
    C: They increase the glare from streetlights.
    D: They magnify the brightness of oncoming high beams.
  answer: B
  explanation: The manual warns not to wear sunglasses or colored glasses at night
    because colored lenses cause your eyes to adjust even more slowly and can reduce
    your vision.
- id: 442
  category: vehicle_information
  question: What should you do when approaching your parked vehicle before starting
    the engine?
  choices:
    A: Check the tire pressure with a gauge.
    B: Look in front, under, and behind the vehicle for objects in your path.
    C: Turn on the headlights to check the battery.
    D: Honk the horn to warn pedestrians.
  answer: B
  explanation: Before starting your engine, the manual advises that when approaching
    your parked vehicle, you should look in front, under, and behind, scanning for
    any objects in your travel path.
- id: 443
  category: safe_driving_rules
  question: Why should you use low beams instead of high beams in fog, snow, or hard
    rain?
  choices:
    A: Low beams are brighter and cut through precipitation better.
    B: High beams will reflect back, causing glare and reducing visibility.
    C: High beams drain the vehicle's battery faster in cold weather.
    D: Low beams automatically activate the vehicle's fog lights.
  answer: B
  explanation: The manual states to use low beams in fog, snow, or hard rain because
    light from high beams will reflect back, causing glare and making it more difficult
    to see ahead.
- id: 444
  category: driver_responsibility
  question: What are the three main types of driver distraction?
  choices:
    A: Visual, Manual, and Cognitive
    B: Physical, Mental, and Emotional
    C: Internal, External, and Technological
    D: Visual, Auditory, and Manual
  answer: A
  explanation: The manual identifies the three main types of distraction as Visual
    (taking your eyes off the road), Manual (taking your hands off the wheel), and
    Cognitive (taking your mind off what you're doing).
- id: 445
  category: driver_responsibility
  question: Why is texting considered the most alarming of all driving distractions?
  choices:
    A: It takes the longest amount of time to complete.
    B: It involves visual, manual, and cognitive distractions simultaneously.
    C: It is the most common distraction among older drivers.
    D: It requires the use of both hands to type.
  answer: B
  explanation: While all distractions can endanger a driver's safety, texting is the
    most alarming because it involves all three types of distraction (visual, manual,
    and cognitive).
- id: 446
  category: driver_responsibility
  question: Why are laws that ban only handheld cell phone use likely ineffective
    in completely reducing crash risks?
  choices:
    A: Drivers will still use their hands to dial numbers.
    B: Hands-free devices block the driver's hearing.
    C: The cognitive distraction still exists with hands-free phones.
    D: Hands-free devices cause severe visual distractions.
  answer: C
  explanation: Using a hands-free device may keep your hands on the wheel but not
    necessarily your mind on your driving. The cognitive distraction still exists
    with a hands-free phone.
- id: 447
  category: safe_driving_rules
  question: Which of the following is a recommended step to take before starting your
    engine?
  choices:
    A: Check your text messages one last time.
    B: Adjust your seat cushions and mirrors.
    C: Turn on the radio to a comfortable volume.
    D: Roll down the windows to hear outside traffic.
  answer: B
  explanation: Before you start your engine, you should always adjust your seat cushions
    and mirrors, verify occupants are wearing seat belts, and eliminate distractions.
- id: 448
  category: safe_driving_rules
  question: While teens often believe alcohol and texting are the leading causes of
    unsafe behavior, what are the actual top factors for fatal crashes involving teens?
  choices:
    A: Drowsy driving and peer pressure
    B: Unsafe speeds and non-use of seat belts
    C: Nighttime driving and poor weather
    D: Equipment failure and roadway design
  answer: B
  explanation: According to the manual, while teens listed alcohol and texting highest,
    the actual top factors for fatal crashes involving teens are unsafe speeds and
    non-use of seat belts.
- id: 449
  category: safe_driving_rules
  question: When do the majority of teenage motor vehicle accidents occur?
  choices:
    A: During morning rush hour
    B: On weekdays after school
    C: On weekends
    D: During holiday breaks
  answer: C
  explanation: Most teenage deaths due to a motor vehicle accident occur on weekends,
    as 53% of all teen accidents occur on the weekend.
- id: 450
  category: safe_driving_rules
  question: How does the presence of teenage passengers affect the risk of a teen
    driver being killed or injured in an accident?
  choices:
    A: The risk decreases because passengers can act as co-pilots.
    B: The risk remains the same regardless of passengers.
    C: The risk increases exponentially with each additional passenger.
    D: The risk only increases if the passengers are not wearing seat belts.
  answer: C
  explanation: The risk of a teen driver being killed or injured in accidents becomes
    greater if there is a teenage passenger involved, and the risk increases exponentially
    with each additional passenger.
- id: 451
  category: safe_driving_rules
  question: How does the fatality rate of drivers ages 16 to 19 compare to that of
    drivers ages 25 to 29?
  choices:
    A: It is half as high.
    B: It is about the same.
    C: It is twice as high.
    D: It is four times as high.
  answer: D
  explanation: Today, drivers ages 16 to 19 have a fatality rate four times as high
    as that of drivers 25 to 29.
- id: 452
  category: defensive_driving
  question: Which of the following is NOT one of the four main factors that contribute
    to the majority of collisions in the U.S.?
  choices:
    A: Equipment Failure
    B: Roadway Design
    C: Vehicle Manufacturing Location
    D: Driver Behavior
  answer: C
  explanation: The four factors that contribute to the majority of collisions are
    Equipment Failure, Roadway Design, Poor roadway maintenance, and Driver Behavior.
- id: 453
  category: defensive_driving
  question: In what percentage of motor vehicle accidents is driver behavior a contributing
    factor?
  choices:
    A: 50%
    B: 75%
    C: 85%
    D: 95%
  answer: D
  explanation: In 95% of motor vehicle accidents there was some factor of driver behavior
    combined with one of the other three factors that caused the accident to happen.
- id: 454
  category: vehicle_information
  question: If your vehicle has a manual (disc) brake system, what should you do to
    stop quickly in an emergency?
  choices:
    A: Brake hard and hold the pedal down firmly.
    B: Pump the brake by pushing hard, letting up as it skids, and pushing down again.
    C: Lightly tap the brakes while turning the steering wheel sharply.
    D: Shift into neutral and let the vehicle coast to a stop.
  answer: B
  explanation: If you have a manual brake system, do not brake hard and hold, as this
    locks the wheels. Instead, pump the brake, push hard, quickly let up as the car
    begins to skid, and quickly push down again.
- id: 455
  category: vehicle_information
  question: Which of the following is a true statement about Anti-lock Braking Systems
    (ABS)?
  choices:
    A: ABS stops the car much faster than manual brakes.
    B: ABS allows you to maintain control and steer the car to safety.
    C: You must manually pump the brakes if your car has ABS.
    D: ABS locks the wheels to prevent the car from skidding.
  answer: B
  explanation: ABS helps you maintain control and stops the car in a straight line.
    It does not stop the car faster, but enables you to concentrate on steering the
    car to safety.
- id: 456
  category: defensive_driving
  question: What is the recommended action if a situation arises with a child or pet
    while you are driving?
  choices:
    A: Handle the situation quickly while keeping one hand on the wheel.
    B: Ask another passenger to take the wheel while you handle it.
    C: Pull over to a safe location before you handle the situation.
    D: Ignore the situation until you reach your final destination.
  answer: C
  explanation: The manual suggests that if a situation should arise with a child,
    you should pull over to a safe location before you handle it. Pets should also
    be secured properly before you begin.
- id: 457
  category: safe_driving_rules
  question: How much more likely are teens to have an accident in their first month
    of driving alone without parental supervision?
  choices:
    A: 10% more likely
    B: 25% more likely
    C: 50% more likely
    D: 75% more likely
  answer: C
  explanation: Teens are 50% more likely to have an accident in the first month of
    driving alone without parental supervision.
- id: 458
  category: vehicle_information
  question: How can you determine if your vehicle is equipped with an Anti-lock Braking
    System (ABS) by looking at the instrument panel?
  choices:
    A: A continuous warning buzzer will sound when the car starts.
    B: The ABS light will illuminate and then dim when you start the vehicle.
    C: The brake pedal will vibrate when you turn the ignition key.
    D: A green light will flash continuously while driving.
  answer: B
  explanation: You can determine if you have ABS by checking your instrument panel.
    When you start your vehicle, the ABS light will illuminate and then dim.
- id: 459
  category: vehicle_information
  question: What is the primary benefit of an Anti-lock Braking System (ABS)?
  choices:
    A: It stops the car much faster than standard brakes.
    B: It allows you to concentrate on steering the car to safety.
    C: It automatically steers the car away from obstacles.
    D: It prevents the vehicle from rolling over.
  answer: B
  explanation: According to the manual, ABS does not stop the car faster. It enables
    you to stop it where you want to by allowing you to concentrate on steering the
    car to safety.
- id: 460
  category: vehicle_information
  question: How can you tell if your vehicle's Anti-lock Braking System (ABS) is not
    working correctly?
  choices:
    A: The ABS indicator light stays lit after starting the vehicle.
    B: The ABS indicator light illuminates and then dims.
    C: The brake pedal feels unusually soft.
    D: The steering wheel vibrates when braking.
  answer: A
  explanation: When you start your vehicle, the ABS light will illuminate and then
    dim. If the light stays lit, the ABS is not working correctly.
- id: 461
  category: defensive_driving
  question: If a front-end crash seems probable and you must drive off the road, what
    should you do?
  choices:
    A: Cross over into the oncoming traffic lane.
    B: Lock your brakes and skid off the road.
    C: Choose to hit something hard to stop the vehicle quickly.
    D: Choose to hit something that will give way, like brush or shrubs.
  answer: D
  explanation: If a crash looks probable, drive off the road and choose to hit something
    that will give way (such as brush or shrubs) rather than something hard.
- id: 462
  category: defensive_driving
  question: What should you do if you see a car coming toward you in your lane and
    a crash is probable?
  choices:
    A: Steer into the left lane to avoid them.
    B: Steer off the road to the right shoulder or ditch.
    C: Lock your wheels by braking as hard as possible.
    D: Speed up to get past them quickly.
  answer: B
  explanation: If the other driver keeps coming and a crash is probable, steer off
    the road to the right shoulder or ditch. Do not drive into the left lane.
- id: 463
  category: sharing_the_road
  question: If another vehicle is attempting to pass you but cannot complete the pass
    because of oncoming traffic, how can you help?
  choices:
    A: Speed up to prevent them from passing.
    B: Move into the left lane to block oncoming traffic.
    C: Slow your vehicle and move as far to the right as you safely can.
    D: Sound your horn and maintain your current speed and position.
  answer: C
  explanation: If the passing vehicle continues to attempt to pass, you can help by
    slowing your vehicle and moving as far to the right as you can safely.
- id: 464
  category: defensive_driving
  question: If you are about to be hit from the rear, what is one action you should
    take to protect yourself?
  choices:
    A: Release the brake pedal completely.
    B: Lean forward toward the steering wheel.
    C: Press the back of your head firmly against the head rest.
    D: Throw yourself across the passenger seat.
  answer: C
  explanation: If you are about to be hit from the rear, you should press the back
    of your head firmly against the head rest and brace yourself between the steering
    wheel and the seat back.
- id: 465
  category: defensive_driving
  question: How should you protect yourself if you are about to be hit from the front
    and are NOT wearing a shoulder strap?
  choices:
    A: Use your arms and hands to protect your face.
    B: Throw yourself across the seat to keep from hitting the steering wheel or windshield.
    C: Brace yourself firmly against the head rest.
    D: Keep a tight grip on the steering wheel.
  answer: B
  explanation: If you are not using your shoulder strap, throw yourself across the
    seat to keep from hitting the steering wheel or windshield.
- id: 466
  category: safe_driving_rules
  question: Which of the following statements about rollover crashes is true?
  choices:
    A: They are less likely to result in serious injury than other crashes.
    B: One of every three passenger vehicle occupant deaths occurs in rollovers.
    C: They mostly occur during extreme weather conditions.
    D: Passenger vehicles are more likely to roll over than SUVs.
  answer: B
  explanation: Even though only about one of every forty vehicles involved in a police
    reported crash has rolled over, one of every three passenger vehicle occupant
    deaths occur in rollovers.
- id: 467
  category: vehicle_information
  question: Why are rollover crashes more common for sport utility vehicles (SUVs),
    vans, and pickups than for passenger vehicles?
  choices:
    A: They have a higher center of gravity, making them top heavy.
    B: They are generally driven at higher speeds.
    C: They lack electronic stability programs.
    D: They have smaller tires that lose traction easily.
  answer: A
  explanation: Rollover crashes are more common for SUVs, vans, pickups and small
    trucks than for passenger vehicles due to their higher centers of gravity, which
    makes them top heavy and more likely to tip over.
- id: 468
  category: defensive_driving
  question: What should you do to avoid a rollover if your vehicle accidentally leaves
    the paved road surface?
  choices:
    A: Jerk the steering wheel sharply to get back on the pavement.
    B: Brake hard and lock the wheels.
    C: Slow down gradually and do not jerk the steering wheel.
    D: Accelerate to maintain control on the soft surface.
  answer: C
  explanation: If your vehicle leaves the paved road surface, slow down gradually,
    but do not jerk the steering wheel to get the vehicle back on the pavement.
- id: 469
  category: defensive_driving
  question: What is the first step you should take to steer out of a skid?
  choices:
    A: Pump the brakes rapidly.
    B: Take your foot off the gas pedal.
    C: Turn the steering wheel sharply in the opposite direction of the skid.
    D: Shift into a lower gear.
  answer: B
  explanation: To steer out of a skid, the first step is to take your foot off the
    gas pedal.
- id: 470
  category: defensive_driving
  question: If the rear of your car is skidding to the right, how should you steer?
  choices:
    A: Turn the front wheels to the left.
    B: Keep the steering wheel perfectly straight.
    C: Turn the front wheels to the right.
    D: Apply the parking brake and steer left.
  answer: C
  explanation: Turn your front wheels only enough to keep them going straight down
    the road. If the rear of your car is skidding to the right, turn the front wheels
    to the right.
- id: 471
  category: defensive_driving
  question: What should you do if you find your vehicle hydroplaning?
  choices:
    A: Brake suddenly to regain traction.
    B: Turn the steering wheel sharply to the right.
    C: Ease your foot off the gas until the car slows and you can feel the road again.
    D: Accelerate slightly to push through the water.
  answer: C
  explanation: If you find yourself hydroplaning, do not brake or turn suddenly. Ease
    your foot off the gas until the car slows and you can feel the road again.
- id: 472
  category: vehicle_information
  question: How does the Electronic Stability Program (ESP) help a driver maintain
    control of the vehicle?
  choices:
    A: It automatically steers the vehicle back onto the pavement.
    B: It selectively applies any one of the vehicle brakes to reduce the possibility
      of a skid.
    C: It inflates side airbags before a rollover occurs.
    D: It shifts the vehicle into a lower gear during a skid.
  answer: B
  explanation: When ESP senses traction problems, it selectively applies any one of
    the vehicle brakes to reduce the possibility of a skid and helps the driver to
    maintain control and stability of the vehicle.
- id: 473
  category: defensive_driving
  question: In which situation might you need to speed up quickly to avoid a crash?
  choices:
    A: When an oncoming car is in your lane.
    B: When you are hydroplaning on a wet road.
    C: When another car is about to hit you from the side or from behind.
    D: When you are approaching a sharp curve too fast.
  answer: C
  explanation: Sometimes you may need to speed up quickly to avoid a crash. This may
    be the case when another car is about to hit you from the side or from behind.
- id: 474
  category: safe_driving_rules
  question: What should you do if your wheels slip off the edge of the road and the
    shoulder is much lower than the pavement?
  choices:
    A: Immediately turn the steering wheel sharply to get back on the road.
    B: Slam on the brakes and stop on the shoulder.
    C: Slow to about 10 mph, look for traffic, and turn your wheels sharply back onto
      the pavement.
    D: Accelerate to match traffic speed before merging back.
  answer: C
  explanation: If the shoulder is much lower than the pavement, you should slow to
    a very slow speed (10 mph), look for traffic coming in both directions, and turn
    your wheels sharply back onto the pavement.
- id: 475
  category: defensive_driving
  question: If your vehicle stalls on a railroad track and a train is approaching,
    in which direction should you walk after exiting the vehicle?
  choices:
    A: Away from the tracks in the same direction the train is traveling.
    B: Alongside the tracks in the direction toward the approaching train.
    C: Directly away from the tracks at a 90-degree angle.
    D: Alongside the tracks away from the approaching train.
  answer: B
  explanation: You should get all passengers and yourself out and walk quickly alongside
    the tracks in the direction toward the approaching train so that you will not
    be struck by debris when your vehicle is hit.
- id: 476
  category: safe_driving_rules
  question: What is the most important rule to remember if you experience a tire blowout?
  choices:
    A: Immediately slam on the brakes to stop the vehicle.
    B: Steer sharply toward the shoulder of the road.
    C: Accelerate slightly to maintain control of the vehicle.
    D: Do not panic and do not slam on the brakes.
  answer: D
  explanation: 'The manual states that the most important rule during a tire blowout
    is: don''t panic and don''t slam on the brakes.'
- id: 477
  category: vehicle_information
  question: If your gas pedal sticks while driving, what is the first step you should
    take?
  choices:
    A: Turn the ignition off immediately.
    B: Put the gear shift in neutral.
    C: Slam on the brakes as hard as possible.
    D: Reach down with your hand to pull the pedal up.
  answer: B
  explanation: If your gas pedal sticks, you should keep your eyes on the road and
    first put the gear shift in neutral.
- id: 478
  category: vehicle_information
  question: What should you do if your brakes fail while driving?
  choices:
    A: Put your parking brake on suddenly.
    B: Shift into neutral and gradually apply the hand brake.
    C: Turn off the engine immediately to stop the car.
    D: Pump the gas pedal to build brake fluid pressure.
  answer: B
  explanation: If your brakes fail, you should shift into neutral and gradually apply
    the hand brake until the vehicle stops. You should not put your parking brake
    on suddenly as it could cause you to lose control.
- id: 479
  category: vehicle_information
  question: What are the warning signs that you might be experiencing the loss of
    a wheel?
  choices:
    A: A high-pitched squealing noise and steering wheel vibrations.
    B: Steam coming from under the hood.
    C: A thumping noise and/or pulling to one side.
    D: The smell of burning rubber and sudden acceleration.
  answer: C
  explanation: The warning signs for the loss of a wheel are a thumping noise and/or
    pulling to one side.
- id: 480
  category: vehicle_information
  question: If steam begins to come from under the hood of your vehicle, what should
    you NOT do?
  choices:
    A: Pull to the side of the road.
    B: Turn off the engine.
    C: Wait for the engine to cool.
    D: Open the radiator cap immediately.
  answer: D
  explanation: 'If your cooling system is boiling and steam is coming from under the
    hood, you should pull to the side, turn off the engine, and wait for it to cool.
    The manual explicitly states: ''Do not open the radiator cap.'''
- id: 481
  category: safe_driving_rules
  question: Which of the following should NEVER be used to put out a gasoline, oil,
    or electrical fire in a vehicle?
  choices:
    A: Dirt
    B: Water
    C: Sand
    D: A chemical fire extinguisher
  answer: B
  explanation: When fighting a small vehicle fire, you can use a chemical fire extinguisher,
    dirt, mud, sand, or clothing. However, you must 'Do not use water on gasoline,
    oil or an electrical fire.'
- id: 482
  category: vehicle_information
  question: When jump-starting a car with a dead battery, where should you connect
    the negative cable from the live battery?
  choices:
    A: To the positive post of the dead battery.
    B: To the negative post of the dead battery or the engine block or frame.
    C: To the positive post of the live battery.
    D: To the radiator cap of the dead vehicle.
  answer: B
  explanation: You should connect the negative post of the live battery to the negative
    post of the dead battery or to the engine block or frame.
- id: 483
  category: safe_driving_rules
  question: If your vehicle breaks down and you are safely off the road, how can you
    signal to enforcement officers or tow truck operators that you need help?
  choices:
    A: Stand in the roadway and flag down passing vehicles.
    B: Tie a white cloth to the radio antenna or hang it out a window.
    C: Walk along the interstate to find the nearest exit.
    D: Turn off all your lights so the battery doesn't die.
  answer: B
  explanation: To signal for help during a breakdown, you should raise your hood and
    tie a white cloth to the radio antenna or hang it out a window. You should not
    try to flag down other vehicles.
- id: 484
  category: alcohol_drugs_health
  question: What are the early symptoms of carbon monoxide poisoning?
  choices:
    A: Yawning, dizziness, and upset stomach.
    B: Coughing, sneezing, and watery eyes.
    C: Rapid heartbeat and shortness of breath.
    D: Blurred vision and muscle cramps.
  answer: A
  explanation: Early symptoms of carbon monoxide poisoning include yawning, dizziness,
    and an upset stomach.
- id: 485
  category: safe_driving_rules
  question: According to the manual, how much rushing water does it take to carry
    away most vehicles?
  choices:
    A: 6 inches
    B: 1 foot
    C: 2 feet
    D: 3 feet
  answer: C
  explanation: The manual states that 6 inches of water will reach the bottom of most
    passenger cars, but 2 feet of rushing water can carry away most vehicles.
- id: 486
  category: defensive_driving
  question: If your vehicle enters water, approximately how long will it float on
    the surface before sinking?
  choices:
    A: 10 to 20 seconds
    B: 30 to 60 seconds
    C: 2 to 3 minutes
    D: 5 to 10 minutes
  answer: B
  explanation: If your vehicle enters water, it will only float on the surface for
    30 to 60 seconds, so you must make every attempt to get out immediately.
- id: 487
  category: defensive_driving
  question: What is the first thing you should do if your vehicle becomes submerged
    in water?
  choices:
    A: Wait for the car to completely fill with water so the pressure equalizes.
    B: Call 911 on your cellular phone.
    C: Unbuckle your seat belt and roll the window down.
    D: Kick the windshield out.
  answer: C
  explanation: If your vehicle enters water, you should immediately unbuckle your
    seat belt and roll the window down. Do not stay and wait for the car to fill with
    water.
- id: 488
  category: vehicle_information
  question: If you experience traction loss in a vehicle equipped with an Electronic
    Stability Program (ESP), how should you steer?
  choices:
    A: Steer abruptly in the opposite direction of the skid.
    B: Steer the vehicle toward the direction you are looking and avoid abrupt steering.
    C: Hold the steering wheel perfectly straight and apply the parking brake.
    D: Let go of the steering wheel and allow the ESP to steer for you.
  answer: B
  explanation: In traction loss with ESP, you should steer the vehicle toward the
    direction you are looking and avoid abrupt steering.
- id: 489
  category: safe_driving_rules
  question: If your vehicle becomes submerged in water, approximately how much time
    do you have to escape before the car fills with water?
  choices:
    A: 10 to 15 seconds
    B: 30 to 60 seconds
    C: 1 to 2 minutes
    D: 3 to 5 minutes
  answer: B
  explanation: According to the manual, you have 30 to 60 seconds to escape a submerged
    vehicle, so you must make every attempt to get out immediately.
- id: 490
  category: safe_driving_rules
  question: When escaping a sinking vehicle with children inside, who should you unbuckle
    first?
  choices:
    A: The youngest child
    B: The heaviest child
    C: The oldest child
    D: All children at the same time
  answer: C
  explanation: The manual states that if there are children in the car, you should
    unbuckle the oldest child first and then the smaller younger ones, as older children
    require less assistance.
- id: 491
  category: defensive_driving
  question: What does the acronym POGO stand for when trying to escape a sinking vehicle?
  choices:
    A: Push Open, Get Out
    B: Pull Over, Go Outside
    C: Pop the seat belt open, Open windows, Get Out
    D: Prepare, Open doors, Get Out
  answer: C
  explanation: 'POGO stands for: Pop the seat belt open, Open windows by breaking
    or rolling them down, Get Out.'
- id: 492
  category: vehicle_information
  question: Which window should you NOT try to break or kick out if you are trapped
    in a sinking vehicle?
  choices:
    A: The driver's side window
    B: The passenger's side window
    C: The rear side window
    D: The windshield
  answer: D
  explanation: The manual explicitly states, "Do not try to break or kick out the
    windshield. Windshields are now designed with glass that does not shatter."
- id: 493
  category: driver_responsibility
  question: What must you do if you crash into an unattended vehicle and cause damage?
  choices:
    A: Wait by the vehicle until the owner returns.
    B: Notify the police and leave a note with your name, address, and phone number.
    C: Leave the scene immediately if there are no injuries.
    D: Call your insurance company and drive away.
  answer: B
  explanation: If you damage an unattended vehicle or property, you must notify the
    police, attempt to locate the owner, and leave your name, address, and telephone
    number on a note.
- id: 494
  category: driver_responsibility
  question: When providing first aid at a crash scene, what should you do if a person
    is bleeding from the lower part of their face or jaw?
  choices:
    A: Turn them on their side.
    B: Have them sit up straight.
    C: Give them plenty of fluids.
    D: Lay them flat on their back.
  answer: A
  explanation: The manual advises that if an injured person is bleeding from the lower
    part of the face or jaw, you should turn him on his side.
- id: 495
  category: safe_driving_rules
  question: Under what circumstance should you move an injured person at a crash scene?
  choices:
    A: When they ask to be moved.
    B: Only when there is immediate life-threatening danger.
    C: To get them out of the rain or cold.
    D: So they can sit comfortably in your vehicle.
  answer: B
  explanation: You should not move an injured person unless there is immediate life-threatening
    danger, as movement could cause more injury.
- id: 496
  category: sharing_the_road
  question: What must you do when approached by an authorized emergency vehicle making
    use of audible or visual signals?
  choices:
    A: Speed up to get out of the way.
    B: Stop immediately in your current lane.
    C: Yield the right-of-way, drive parallel to the right-hand edge or curb, and
      remain stopped.
    D: Move to the left lane and slow down.
  answer: C
  explanation: If approached by an authorized emergency vehicle, you must always yield
    the right-of-way and immediately drive to a position parallel to the right-hand
    edge or curb and remain stopped until it passes.
- id: 497
  category: alcohol_drugs_health
  question: Approximately how long does it take for alcohol to reach your brain after
    it enters your stomach?
  choices:
    A: 5 minutes
    B: 20 minutes
    C: 45 minutes
    D: 1 hour
  answer: B
  explanation: When alcohol enters your stomach, it goes into your bloodstream and
    reaches your brain in about 20 minutes.
- id: 498
  category: alcohol_drugs_health
  question: How is alcohol eliminated from the body?
  choices:
    A: Through sweat and physical exercise.
    B: Through the kidneys and lungs after being metabolized by the liver.
    C: By drinking large amounts of water and black coffee.
    D: By taking a cold shower.
  answer: B
  explanation: Alcohol is metabolized by your liver and eliminated from your body
    through your kidneys and lungs. Black coffee, exercise, or a cold shower will
    not sober you up.
- id: 499
  category: alcohol_drugs_health
  question: Why is drinking alcohol dangerous if you are exposed to extreme cold?
  choices:
    A: It raises your internal body temperature too high.
    B: It transfers blood from vital organs to the extremities, lowering body temperature.
    C: It causes your heart to beat faster and overwork.
    D: It prevents your body from sweating.
  answer: B
  explanation: Alcohol causes blood to be transferred from the vital organs to the
    extremities. While this creates a "flushed" feeling of warmth, the body's internal
    temperature is actually being lowered, making it dangerous for overexposure to
    cold.
- id: 500
  category: alcohol_drugs_health
  question: According to the text, drunk driving is the leading single cause of death
    among which age group?
  choices:
    A: 16 to 24
    B: 25 to 34
    C: 35 to 50
    D: 50 and older
  answer: A
  explanation: The manual states that drunk driving is the leading single cause of
    death among young people in the age range from 16 to 24.
- id: 501
  category: safe_driving_rules
  question: According to the National Safety Council, what proportion of drivers will
    be involved in a motor vehicle crash this year?
  choices:
    A: One in every four
    B: One in every eight
    C: One in every ten
    D: One in every twenty
  answer: B
  explanation: According to the National Safety Council, one in every eight drivers
    will be involved in a motor vehicle crash this year.
- id: 502
  category: alcohol_drugs_health
  question: What is the legal blood alcohol concentration (BAC) limit for a driver
    who is 20 years of age or younger in Louisiana?
  choices:
    A: 0.08%
    B: 0.04%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: In Louisiana, the legal limit of blood alcohol concentration is .02
    if you are 20 years of age and younger.
- id: 503
  category: alcohol_drugs_health
  question: How long does it take for the body to rid the circulatory system of one
    normal alcoholic drink?
  choices:
    A: About 30 minutes
    B: About one hour
    C: About two hours
    D: About four hours
  answer: B
  explanation: It takes about an hour for the body to get rid of one normal drink
    from the circulatory system.
- id: 504
  category: penalties_and_points
  question: What is the maximum driver's license suspension penalty for a first DWI
    conviction?
  choices:
    A: 90 days
    B: 180 days
    C: 365 days
    D: Two years
  answer: C
  explanation: The maximum penalties for a 1st DWI conviction include the loss of
    your driver's license for 365 days.
- id: 505
  category: defensive_driving
  question: Which of the following is a recommended action if you see a drunk driver
    on the road?
  choices:
    A: Signal the driver to pull over immediately.
    B: Tailgate them closely to read their license plate.
    C: Pull over and call 911 with a complete description of the vehicle.
    D: Attempt to pass them quickly to get out of their way.
  answer: C
  explanation: If you see a drunk driver, you should pull over and call 911, giving
    a complete description of the vehicle and its exact location. You should not signal
    the driver to pull over.
- id: 506
  category: alcohol_drugs_health
  question: Which of the following is a tell-tale sign that a driver may be impaired
    by alcohol?
  choices:
    A: Driving exactly at the posted speed limit
    B: Making sudden stops at traffic signs rather than easing up to them
    C: Using turn signals well in advance of a turn
    D: Driving with the windows rolled down
  answer: B
  explanation: A quick stop is a tell-tale sign of a drinking driver, as they may
    make sudden stops at a traffic sign or light rather than easing up to it.
- id: 507
  category: penalties_and_points
  question: Under Louisiana's implied consent law, what happens if you refuse to submit
    to a chemical test for alcohol on your first offense?
  choices:
    A: Your driving privileges will be suspended for 365 days.
    B: You will be fined $5,000 immediately.
    C: Your vehicle will be seized and sold.
    D: Your driving privileges will be suspended for 90 days.
  answer: A
  explanation: If you refuse to submit to the test, your driving privileges will be
    suspended for 365 days on your first offense.
- id: 508
  category: alcohol_drugs_health
  question: Approximately how long does it take for the effects of smoking one marijuana
    cigarette to wear off?
  choices:
    A: One hour
    B: Two to three hours
    C: Five to six hours
    D: Ten to twelve hours
  answer: C
  explanation: Whereas the effects of a single drink will diminish over an hour, it
    takes five to six hours for the effects of smoking one marijuana cigarette to
    wear off.
- id: 509
  category: driver_responsibility
  question: 'Louisiana''s open container law prohibits:'
  choices:
    A: Only the consumption of alcohol by the driver.
    B: Only the possession of an open alcoholic beverage container in the trunk.
    C: Both the possession of any open alcoholic beverage container and consumption
      of any alcohol beverage in a vehicle.
    D: Transporting unopened alcoholic beverages in the passenger compartment.
  answer: C
  explanation: This law prohibits both the possession of any open alcoholic beverage
    container and consumption of any alcohol beverage in a vehicle.
- id: 510
  category: penalties_and_points
  question: What is the mandatory jail time for a third DWI conviction in Louisiana?
  choices:
    A: 48 hours
    B: 10 days
    C: 30 days
    D: 6 months
  answer: C
  explanation: A 3rd DWI conviction carries a maximum penalty of 1-5 years in prison
    with 30 days mandatory jail time.
- id: 511
  category: penalties_and_points
  question: 'If you are involved in a crash and fail to stop, identify yourself, and
    render reasonable aid, you can be charged with:'
  choices:
    A: Reckless driving
    B: Hit and run driving
    C: Flight from an officer
    D: Vehicle negligent injury
  answer: B
  explanation: If you are involved in or cause an accident, you are required by law
    to stop, identify yourself and render reasonable aid. Failure to do so is Hit
    and Run Driving and may result in a fine and time in jail.
- id: 512
  category: alcohol_drugs_health
  question: At what rate can the human body process alcohol per hour?
  choices:
    A: 0.010%
    B: 0.015%
    C: 0.020%
    D: 0.025%
  answer: B
  explanation: The body can process 0.015% of alcohol per hour.
- id: 513
  category: penalties_and_points
  question: Which offense involves inflicting serious bodily injury while operating
    a vehicle under the influence of alcohol or drugs?
  choices:
    A: Vehicular Homicide
    B: Reckless Driving
    C: Vehicle Negligent Injury
    D: First Degree Vehicle Negligent Injury
  answer: D
  explanation: First degree vehicle negligent injury is inflicting of serious bodily
    injury by an operator of any motor vehicle... when the offender is under the influence
    of alcohol or drugs.
- id: 514
  category: driver_responsibility
  question: After a DWI conviction or an implied consent refusal, how long must a
    driver maintain proof of future financial responsibility (SR-22)?
  choices:
    A: One year from the date of conviction
    B: Two years from the date of conviction
    C: Three years from the date of conviction
    D: Five years from the date of conviction
  answer: C
  explanation: You will be required by law to maintain an SR-22 (proof of future financial
    responsibility) for three (3) years from the date of conviction.
- id: 515
  category: alcohol_drugs_health
  question: How does driving under the influence of drugs compare to driving under
    the influence of alcohol under Louisiana law?
  choices:
    A: The penalties for drugs are less severe than for alcohol.
    B: Louisiana law provides the same penalty for driving under the influence of
      drugs as it does for alcohol.
    C: Over-the-counter medications are exempt from DUI laws.
    D: Drug offenses only result in a fine, not jail time.
  answer: B
  explanation: Louisiana law provides the same penalty for driving under the influence
    of drugs as it does for alcohol. This includes over-the-counter (OTC) and prescribed
    medication.
- id: 516
  category: penalties_and_points
  question: If you refuse to take an alcohol analysis test on your first offense,
    your driving privileges will be suspended for how long?
  choices:
    A: 90 days
    B: 180 days
    C: 365 days
    D: 730 days
  answer: C
  explanation: According to the manual, if you refuse the test, your driving privileges
    will be suspended for 365 days on your first offense.
- id: 517
  category: alcohol_drugs_health
  question: If you are under 21 years of age and submit to a test showing a BAC level
    of 0.02% or more, how long will your driving privileges be suspended for a first
    offense?
  choices:
    A: 90 days
    B: 180 days
    C: 365 days
    D: 2 years
  answer: B
  explanation: If you submit to the test and you are under 21 years of age, and the
    test results show a BAC level of 0.02% or more, your driving privileges will be
    suspended for 180 days for a first offense.
- id: 518
  category: penalties_and_points
  question: Each conviction of driving under suspension will cause your suspension
    period to be extended by how long?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: EACH conviction of driving under suspension will cause your suspension
    period to be extended for one year.
- id: 519
  category: vehicle_information
  question: What is the maximum allowable height for all vehicles in Louisiana?
  choices:
    A: 12 feet 6 inches
    B: 13 feet
    C: 13 feet 6 inches
    D: 14 feet
  answer: C
  explanation: The maximum height is 13 feet 6 inches for all vehicles, though some
    overpasses or other structures have a clearance of less than 13'6".
- id: 520
  category: safe_driving_rules
  question: If a load extends four or more feet past the bed or body of a vehicle
    during daylight hours, what must be attached to the extreme rear of the load?
  choices:
    A: A 12-inch square red flag
    B: A red electric lantern
    C: A 12-inch square white flag
    D: Two red reflectors
  answer: A
  explanation: If a load extends four or more feet past the bed or body of any vehicle,
    a red flag 12 inches square must be attached to the extreme rear of the load during
    daylight hours.
- id: 521
  category: safe_driving_rules
  question: What is the maximum speed limit when pulling or towing another motor vehicle
    in Louisiana?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: When pulling or towing another motor vehicle the speed limit is 45
    mph.
- id: 522
  category: sharing_the_road
  question: On rural highways outside residential areas or business districts, drivers
    of motor trucks must not follow within how many feet of one another except to
    pass?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: C
  explanation: On rural highways, outside residential areas or business districts,
    drivers of motor trucks must not follow within 400 feet of one another except
    to pass.
- id: 523
  category: safe_driving_rules
  question: When stopping at a railroad crossing, what is the required distance you
    must stop from the nearest rail?
  choices:
    A: Within 50 feet but not closer than 15 feet
    B: Within 30 feet but not closer than 10 feet
    C: Within 100 feet but not closer than 25 feet
    D: Exactly 20 feet
  answer: A
  explanation: You must stop within 50 feet but not closer than 15 feet from the nearest
    rail.
- id: 524
  category: vehicle_information
  question: Tow trucks must be equipped with at least what type of fire extinguisher?
  choices:
    A: 2-BC
    B: 4-BC
    C: 10-BC
    D: 12-BC
  answer: B
  explanation: Tow trucks must be equipped with at least one 4-BC fire extinguisher
    capable of extinguishing flammable liquid fires, completely filled and in working
    condition.
- id: 525
  category: vehicle_information
  question: Which warning devices are strictly prohibited for use by trucks carrying
    explosives, flammable liquids, or compressed gases when they break down?
  choices:
    A: Red electric lanterns
    B: Red emergency reflectors
    C: Flares or fuses
    D: 12-inch square red cloth flags
  answer: C
  explanation: Trucks carrying explosives, flammable liquids, compressed gases, or
    using compressed gas as a fuel must use red electric lanterns or red emergency
    reflectors only. Flares or fuses are not allowed.
- id: 526
  category: safe_driving_rules
  question: When towing another vehicle, the draw bar or other connection must generally
    not exceed what length?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: When towing another vehicle, the draw bar or other connection must
    be of sufficient strength to pull all towed weight and must not exceed 15 feet.
- id: 527
  category: vehicle_information
  question: A vehicle's rear view mirror must reflect a view of the highway for what
    distance to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: A rear view mirror must reflect a view of the highway for a distance
    of 200 feet to the rear, regardless of the load of the vehicle.
- id: 528
  category: vehicle_information
  question: 'All trailers or semi-trailers must be equipped with adequate brakes if
    they have a gross vehicle weight rating of at least:'
  choices:
    A: 1,000 pounds
    B: 2,000 pounds
    C: 3,000 pounds
    D: 5,000 pounds
  answer: C
  explanation: All trailers or semi-trailers with a gross vehicle weight rating of
    3,000 pounds or more must be equipped with brakes adequate to stop and hold it.
- id: 529
  category: safe_driving_rules
  question: What should drivers use as the principal means of controlling speed on
    long downgrades?
  choices:
    A: The parking brake
    B: Stab braking
    C: Engine compression
    D: The emergency brake system
  answer: C
  explanation: Drivers should use engine compression as the principal means of controlling
    speed on long grades to avoid excessive use of brakes.
- id: 530
  category: vehicle_information
  question: In an air brake system, the safety valve is usually set to open at what
    pressure to protect the system?
  choices:
    A: 60 psi
    B: 100 psi
    C: 125 psi
    D: 150 psi
  answer: D
  explanation: The safety valve protects the tank and the rest of the system from
    too much pressure and is usually set to open at 150 psi.
- id: 531
  category: vehicle_information
  question: 'A low air pressure warning signal must come on before the air pressure
    in the tanks falls below:'
  choices:
    A: 20 psi
    B: 40 psi
    C: 60 psi
    D: 85 psi
  answer: C
  explanation: A warning signal you can see must come on before the air pressure in
    the tanks falls below 60 psi.
- id: 532
  category: safe_driving_rules
  question: When the spring brakes (parking brakes) are on, what must you NEVER do?
  choices:
    A: Turn the steering wheel
    B: Push the brake pedal down
    C: Turn off the engine
    D: Pull the yellow control knob
  answer: B
  explanation: 'The manual explicitly warns: NEVER PUSH THE BRAKE PEDAL DOWN WHEN
    THE SPRING BRAKES ARE ON. If you do, the brakes could be damaged.'
- id: 533
  category: vehicle_information
  question: 'During step one of the air brake check on a single vehicle, after fully
    applying the foot brake for one minute, the air pressure should drop no more than:'
  choices:
    A: 2 pounds
    B: 3 pounds
    C: 4 pounds
    D: 5 pounds
  answer: B
  explanation: During the air brake check, you must hold the foot brake for one minute
    and check the air gauge to see if the air pressure drops more than three (3) pounds
    in one minute for a single vehicle.
- id: 534
  category: vehicle_information
  question: When fanning off the air pressure during an air brake inspection, at approximately
    what pressure should the parking brake valve close (pop out)?
  choices:
    A: 10-20 psi
    B: 20-40 psi
    C: 60-80 psi
    D: 85-100 psi
  answer: B
  explanation: Step 3 of the air brake check states that as you continue to fan off
    the air pressure, at approximately 20-40 psi, the parking brake valve should close
    (pop out).
- id: 535
  category: defensive_driving
  question: Which of the following describes the 'stab braking' method for emergency
    stops?
  choices:
    A: Pressing the brake pedal as hard as you can without locking the wheels
    B: Pumping the brake pedal lightly to avoid overheating
    C: Pressing the brake pedal hard, releasing when wheels lock, and applying fully
      again when wheels start rolling
    D: Using the parking brake and service brake at the same time
  answer: C
  explanation: Stab braking involves pressing the brake pedal as hard as you can,
    releasing the brakes when the wheels lock up, and putting the brakes on fully
    again as soon as the wheels start rolling.
- id: 536
  category: safe_driving_rules
  question: At 55 mph on dry pavement, the air brake lag distance adds about how many
    feet to your total stopping distance?
  choices:
    A: 15 feet
    B: 32 feet
    C: 60 feet
    D: 100 feet
  answer: B
  explanation: The manual states that the air brake lag distance at 55 mph on dry
    pavement adds about 32 feet to the total stopping distance.
- id: 537
  category: safe_driving_rules
  question: 'You should use your parking brakes any time you park, EXCEPT when:'
  choices:
    A: You are parking on a level surface
    B: The brakes are very hot from a steep grade or very wet in freezing temperatures
    C: You are parking for less than 15 minutes
    D: Your vehicle is empty and unladen
  answer: B
  explanation: Any time you park, use the parking brakes unless the brakes are very
    hot (from having come down a steep grade) or the brakes are very wet in freezing
    temperatures.
- id: 538
  category: vehicle_information
  question: When connecting a trailer to a vehicle, how should the safety chains be
    positioned?
  choices:
    A: Dragging on the road to ground the electrical system
    B: Pulled as tight as possible to prevent any trailer sway
    C: Crossed under the trailer tongue with some slack to permit sharp turns
    D: Attached only to the top of the ball and coupler
  answer: C
  explanation: Safety chains should have some slack to permit sharp turns but should
    not drag on the road, and they should cross under the trailer tongue to help prevent
    the tongue from dropping to the road if it separates.
- id: 539
  category: driver_responsibility
  question: If your air tanks are equipped with manual drains, how often must you
    drain the tanks yourself?
  choices:
    A: At the end of each day of driving
    B: Once a week
    C: At the beginning of each month
    D: Only when the low air pressure warning activates
  answer: A
  explanation: For manual air tank drains, you must drain the tanks yourself at the
    end of each day of driving.
- id: 540
  category: vehicle_information
  question: Air brake systems are a combination of which three braking systems?
  choices:
    A: Hydraulic, mechanical, and pneumatic
    B: Service, parking, and emergency
    C: Primary, secondary, and auxiliary
    D: Tractor, trailer, and breakaway
  answer: B
  explanation: 'Air brake systems are three braking systems combined: the service
    brake system, the parking brake system, and the emergency brake system.'
- id: 541
  category: vehicle_information
  question: How must trailer brakes be designed to function in the event of an accidental
    breakaway from the towed vehicle?
  choices:
    A: They must sound an audible alarm.
    B: They must be automatically applied.
    C: They must lock the steering wheel.
    D: They must release all pressure.
  answer: B
  explanation: The manual states that trailer brakes shall be designed and connected
    so that in case of an accidental breakaway of the towed vehicle, the brakes shall
    be automatically applied.
- id: 542
  category: vehicle_information
  question: When selecting tires for your trailer, which of the following should you
    avoid doing?
  choices:
    A: Maintaining proper tire pressure.
    B: Mixing bias-belted and radial tires.
    C: Buying the size found in the owner's manual.
    D: Checking the load rating.
  answer: B
  explanation: According to the manual, all trailer tires should be the same type,
    size, and construction; you should not mix bias-belted and radial tires.
- id: 543
  category: license_system
  question: When you buy a new vehicle from a Louisiana dealer, how long is the temporary
    cardboard plate valid?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: D
  explanation: When buying a new vehicle, the dealer will issue a 60-day temporary
    cardboard plate which must be clearly visible from the rear of your car.
- id: 544
  category: license_system
  question: After purchasing a used vehicle, how many days do you have to apply for
    a title in your name?
  choices:
    A: 3 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: The manual states that you have five days from the date of sale to
    apply for a title in your name.
- id: 545
  category: driver_responsibility
  question: Where must you keep your vehicle's registration certificate?
  choices:
    A: In a safe deposit box at home.
    B: In the vehicle at all times.
    C: On your person in your wallet.
    D: At the Office of Motor Vehicles.
  answer: B
  explanation: The registration certificate is proof of ownership and must be kept
    in the vehicle at all times and presented when requested by law enforcement.
- id: 546
  category: penalties_and_points
  question: If you are stopped by law enforcement and cannot provide proof of insurance,
    what will happen?
  choices:
    A: Your driver's license will be immediately revoked.
    B: Your vehicle's license plate will be seized.
    C: You will be given a 30-day warning.
    D: Your vehicle will be crushed.
  answer: B
  explanation: If you are stopped by a law enforcement officer and are unable to provide
    proof of insurance, the vehicle's license plate will be seized and the vehicle
    may be impounded.
- id: 547
  category: penalties_and_points
  question: If your license plate is seized for failing to provide proof of insurance,
    how long do you have to provide proof at a Motor Vehicle office before the plate
    is destroyed?
  choices:
    A: 24 hours
    B: 3 calendar days (excluding weekends and legal holidays)
    C: 5 business days
    D: 10 calendar days
  answer: B
  explanation: You will have three (3) calendar days, excluding Saturdays, Sundays
    and legal holidays, to provide the proof at a Motor Vehicle office before the
    plate is destroyed.
- id: 548
  category: driver_responsibility
  question: If you decide to no longer drive a vehicle on the highways, what should
    you do before canceling your insurance?
  choices:
    A: Sell the vehicle to a dealership.
    B: Remove the license plate and surrender it to the Office of Motor Vehicles.
    C: Report the vehicle as non-operational to your local police department.
    D: Destroy the license plate yourself.
  answer: B
  explanation: If you decide to no longer drive a vehicle, you should remove the license
    plate and surrender it to the Office of Motor Vehicles before the insurance is
    canceled to avoid penalties.
- id: 549
  category: license_system
  question: When does your vehicle license plate expire?
  choices:
    A: On your birthday.
    B: On the first day of the year.
    C: On the last day of the month in the year indicated on your registration.
    D: Exactly one year from the date of purchase.
  answer: C
  explanation: Your vehicle license plate expires on the last day of the month in
    the year indicated on your registration certificate.
- id: 550
  category: vehicle_information
  question: Which of the following cities operates its own motor vehicle inspection
    program?
  choices:
    A: Baton Rouge
    B: Shreveport
    C: Lafayette
    D: New Orleans
  answer: D
  explanation: The manual notes that the City of New Orleans, the City of Kenner,
    and the City of Westwego operate their own inspection programs.
- id: 551
  category: license_system
  question: For how long are standard automobile license plates issued in Louisiana?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 4 years
  answer: B
  explanation: Automobile plates are issued for a 2-year period.
- id: 552
  category: license_system
  question: For how long are license plates issued for private minimum-use pickup
    trucks weighing 6000 lbs. or less?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 4 years
  answer: D
  explanation: The license plate fee for private minimum-use pickup trucks (6000 lbs.
    or less) is $10.00 per year, and these truck plates are issued for a 4-year period.
- id: 553
  category: penalties_and_points
  question: What is a potential penalty for providing false information about your
    insurance coverage?
  choices:
    A: Your vehicle registration may be suspended, and you may be fined and jailed.
    B: You will be required to take a defensive driving course.
    C: Your vehicle will be permanently confiscated by the state.
    D: You will only receive a written warning.
  answer: A
  explanation: If you provide false information about your insurance coverage, your
    vehicle registration may be suspended, and you may also be fined by the court
    and jailed.
- id: 554
  category: license_system
  question: When applying for a title for a used vehicle, a Federal Odometer statement
    is required if the vehicle is less than how many years old?
  choices:
    A: 5 years
    B: 10 years
    C: 15 years
    D: 20 years
  answer: B
  explanation: You need to present a Federal Odometer statement if the vehicle is
    less than 10 years old, as required by the Federal Government.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 555
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 556
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 557
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 558
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 559
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 560
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 561
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 562
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 563
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 564
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 565
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 566
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 567
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
