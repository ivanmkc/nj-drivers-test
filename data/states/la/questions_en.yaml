metadata:
  source: 2017 Louisiana Class D & E Driver's Guide (dps.louisiana.gov)
  total_questions: 588
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: 'According to the Louisiana Driver''s Guide, driving is considered a:'
  choices:
    A: Constitutional right
    B: Privilege that comes with great responsibilities
    C: Requirement for all citizens
    D: Hobby for leisure only
  answer: B
  explanation: 'The Commissioner''s message states: ''The driving experience, however,
    is a privilege and comes with great responsibilities.'''
- id: 2
  category: driver_responsibility
  question: Is the Louisiana Driver's Guide considered an official legal reference
    to Louisiana traffic laws?
  choices:
    A: Yes, it contains all official laws in their entirety.
    B: No, it only highlights those laws, driving practices and procedures used most
      often.
    C: Yes, but only for Class D & E drivers.
    D: No, it is only intended for out-of-state drivers.
  answer: B
  explanation: 'The manual explicitly states: ''This guide is not intended to be an
    official legal reference to the Louisiana traffic laws. It only highlights those
    laws, driving practices and procedures that you will use most often.'''
- id: 3
  category: safe_driving_rules
  question: What does the Commissioner's message specifically remind drivers to do
    regarding safety belts?
  choices:
    A: Replace them every 5 years.
    B: Buckle up because safety belts save lives.
    C: Only use them when driving on the interstate.
    D: Remove them if they are uncomfortable.
  answer: B
  explanation: 'The Commissioner''s message concludes with the reminder: ''Remember
    to buckle up. Safety belts save lives.'''
- id: 4
  category: driver_responsibility
  question: Why is the material in the driver's guide subject to change?
  choices:
    A: To comply with amended State and Federal legislations.
    B: Because the Commissioner changes every year.
    C: To make the written test harder for new drivers.
    D: Because road signs change colors frequently.
  answer: A
  explanation: The text notes that 'the material in this guide is subject to change
    to comply with amended State and Federal legislations.'
- id: 5
  category: license_system
  question: According to the Table of Contents, which chapter of the guide covers
    the Graduated Licensing Program?
  choices:
    A: Chapter 1
    B: Chapter 3
    C: Chapter 5
    D: Chapter 7
  answer: A
  explanation: 'The Table of Contents lists the ''GRADUATED LICENSING PROGRAM'' under
    Chapter 1: Getting a Driver''s License.'
- id: 6
  category: safe_driving_rules
  question: The Highway Transportation System is described in Chapter 2 as having
    how many main components?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: Chapter 2 of the Table of Contents includes a section titled 'THREE
    MAIN COMPONENTS' under the Highway Transportation System.
- id: 7
  category: driver_responsibility
  question: Which of the following fraud prevention topics is covered in Chapter 6?
  choices:
    A: Credit card fraud
    B: Identity theft
    C: Automobile insurance fraud
    D: Real estate fraud
  answer: C
  explanation: The Table of Contents for Chapter 6 lists 'AUTOMOBILE INSURANCE FRAUD'
    as one of the topics covered.
- id: 8
  category: vehicle_information
  question: What is the name of the tip section in Chapter 6 designed to prevent automobile
    theft?
  choices:
    A: Lock It or Lose It
    B: Park Smart
    C: Safe Keys
    D: Anti-Theft 101
  answer: B
  explanation: Chapter 6 includes a section titled 'TIPS TO PREVENT AUTOMOBILE THEFT
    – “PARK SMART”'.
- id: 9
  category: sharing_the_road
  question: According to the Table of Contents, Chapter 5 covers sharing the road
    with which of the following?
  choices:
    A: Pedestrians and school buses
    B: Bicycles, Motorcycles, and Big Trucks
    C: Trains and Light Rail
    D: Horse-drawn carriages
  answer: B
  explanation: Chapter 5 lists sections for 'SHARING THE ROAD WITH BICYCLES', 'SHARING
    THE ROAD WITH MOTORCYCLES', and 'SHARING THE ROAD WITH BIG TRUCKS'.
- id: 10
  category: sharing_the_road
  question: Which type of vehicles are specifically addressed in Chapter 7 regarding
    Interstate Driving and Rural Roads?
  choices:
    A: Emergency vehicles
    B: Slow moving vehicles
    C: School buses
    D: Hazardous material trucks
  answer: B
  explanation: The Table of Contents for Chapter 7 includes a specific section titled
    'SLOW MOVING VEHICLES'.
- id: 11
  category: defensive_driving
  question: In Chapter 4, what specific environmental factor is listed as affecting
    driving?
  choices:
    A: Seasonal changes
    B: High altitudes
    C: Solar eclipses
    D: Magnetic fields
  answer: A
  explanation: Chapter 4 includes a section titled 'SEASONAL CHANGES AND HOW THEY
    AFFECT DRIVING'.
- id: 12
  category: defensive_driving
  question: Which of the following behavioral driving issues is specifically covered
    in Chapter 5?
  choices:
    A: Texting while driving
    B: Aggressive driving/Road rage
    C: Eating while driving
    D: Driving with pets
  answer: B
  explanation: The Table of Contents for Chapter 5 lists 'AGGRESSIVE DRIVING/ROAD
    RAGE' as a topic.
- id: 13
  category: penalties_and_points
  question: According to the Table of Contents, where would you look to find information
    on the revocation of your license?
  choices:
    A: Chapter 1
    B: Chapter 2
    C: Chapter 4
    D: Chapter 6
  answer: A
  explanation: The topic 'REVOCATION OF YOUR LICENSE' is listed under Chapter 1 in
    the Table of Contents.
- id: 14
  category: driver_responsibility
  question: 'The guide is designed to provide drivers with the rules of the road,
    information on safety, and knowledge to assist in:'
  choices:
    A: Passing the road skills test on the first try
    B: Making better driving decisions
    C: Becoming a certified driving instructor
    D: Avoiding all traffic tickets
  answer: B
  explanation: 'The Commissioner''s message states: ''This guide is designed to provide
    you with the rules of the road, knowledge to assist you in making better driving
    decisions...'''
- id: 15
  category: defensive_driving
  question: Chapter 6 includes tips to avoid becoming a victim of what specific type
    of accident?
  choices:
    A: A hit-and-run accident
    B: A staged automobile accident
    C: A multi-car pileup
    D: A weather-related accident
  answer: B
  explanation: Chapter 6 of the Table of Contents includes the section 'TIPS TO AVOID
    BECOMING A VICTIM OF A STAGED AUTOMOBILE ACCIDENT'.
- id: 16
  category: safe_driving_rules
  question: When must you carry your driver's license with you?
  choices:
    A: Only when driving on interstate highways
    B: Always when driving
    C: Only when driving a commercial vehicle
    D: Only if you have had a previous traffic violation
  answer: B
  explanation: 'The manual explicitly states: "Always carry your license with you
    when driving."'
- id: 17
  category: license_system
  question: How many days do new residents of Louisiana have to obtain a Louisiana
    driver's license from the time residency is established?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to the manual, "New residents have 30 days from the time
    residency is established to obtain a Louisiana license."
- id: 18
  category: license_system
  question: How long is a non-resident who possesses a valid license issued by another
    state permitted to drive in Louisiana?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The manual states that non-residents who possess a valid license issued
    by another state are permitted to drive in Louisiana for a period of 90 days.
- id: 19
  category: license_system
  question: What must a non-resident student possess to be exempt from obtaining a
    Louisiana driver's license?
  choices:
    A: A valid driver's license from their home state and a current student ID card
    B: A Louisiana student ID card and a passport
    C: A letter from their university and a birth certificate
    D: A valid driver's license from their home state and proof of Louisiana insurance
  answer: A
  explanation: Non-resident students are exempt if they "possess both a valid driver's
    license issued by their home state and a current student ID card."
- id: 20
  category: license_system
  question: Which of the following individuals is NOT required to obtain a Louisiana
    driver's license?
  choices:
    A: A new resident who moved to Louisiana 45 days ago
    B: A person operating a farm tractor temporarily on the highway
    C: A non-resident who has been driving in the state for 100 days
    D: A resident driving a personal vehicle for commerce
  answer: B
  explanation: The manual lists exceptions to obtaining a Louisiana license, which
    includes "Anyone operating a farm tractor, farm implements, or road machinery
    temporarily on the highway."
- id: 21
  category: license_system
  question: A Class "E" driver's license permits the operation of any single motor
    vehicle under what gross vehicle weight?
  choices:
    A: 10,001 pounds
    B: 15,001 pounds
    C: 20,001 pounds
    D: 26,001 pounds
  answer: A
  explanation: A Class "E" license permits the operation of "any single motor vehicle
    under 10,001 pounds, recreational vehicles and certain farm use vehicles not defined
    as commercial vehicle."
- id: 22
  category: license_system
  question: 'A Class "D" driver''s license allows you to operate a single vehicle
    used in commerce with a gross vehicle weight rating of:'
  choices:
    A: Less than 10,001 pounds
    B: 10,001 pounds or more but less than 26,001 pounds
    C: 26,001 pounds or more
    D: Exactly 30,000 pounds
  answer: B
  explanation: Class "D" permits the operation of any single vehicle used in commerce
    having a gross vehicle weight rating of "10,001 pounds or more but less than 26,001
    pounds."
- id: 23
  category: license_system
  question: 'Under a Class "D" license, you may tow a vehicle as long as the towed
    vehicle''s gross vehicle weight rating does not exceed:'
  choices:
    A: 5,000 pounds
    B: 10,000 pounds
    C: 15,000 pounds
    D: 26,001 pounds
  answer: B
  explanation: A Class "D" license allows towing a vehicle "not in excess of 10,000
    pounds gross vehicle weight rating," provided the combined weight is less than
    26,001 pounds.
- id: 24
  category: license_system
  question: If you are driving in interstate commerce, what additional standards must
    you meet?
  choices:
    A: Department of Transportation (DOT) physical standards
    B: Federal Aviation Administration (FAA) vision standards
    C: Louisiana State Police fitness standards
    D: Commercial Driver's License (CDL) hazmat standards
  answer: A
  explanation: 'The manual notes: "If you are driving interstate commerce, you must
    also meet Department of Transportation (DOT) physical standards."'
- id: 25
  category: license_system
  question: What is the standard term (duration) for a Class "E" driver's license
    in Louisiana?
  choices:
    A: 2 Years
    B: 4 Years
    C: 6 Years
    D: 8 Years
  answer: C
  explanation: According to the Fees for Driver's License and Identification Card
    table, the term for a Class E license is 6 Years.
- id: 26
  category: license_system
  question: What is the total fee and term for an Identification Card for an applicant
    who is 60 years of age or older?
  choices:
    A: $22.00 for 4 Years
    B: $0.00 for a Lifetime term
    C: $11.00 for 2 Years
    D: $16.00 for 6 Years
  answer: B
  explanation: The fee table shows that an ID Card (60+) has a total fee of $0.00
    and is valid for a "Lifetime" term.
- id: 27
  category: driver_responsibility
  question: What must you do if a law enforcement officer asks to see your driver's
    license?
  choices:
    A: You are required to show it to them
    B: You only have to show it if you committed a traffic violation
    C: You can refuse unless they have a warrant
    D: You have 24 hours to present it at a police station
  answer: A
  explanation: 'The manual states: "You are required to show your license to any law
    enforcement officer or any officer who may ask to see it."'
- id: 28
  category: license_system
  question: Can a Class "D" license be used for the transportation of passengers for
    hire or fee?
  choices:
    A: No, only Class "A" licenses allow passenger transport
    B: Yes, provided the usage does not fall within the definition of vehicles in
      classes "A", "B", or "C"
    C: Yes, but only if the vehicle weighs more than 26,001 pounds
    D: No, Class "D" is strictly for agricultural vehicles
  answer: B
  explanation: 'The manual states: "A class ''D'' license may be used for transportation
    of passengers for hire or fee provided the usage thereof does not fall within
    the definition of vehicles in classes ''A'', ''B'', or ''C''."'
- id: 29
  category: license_system
  question: Who is exempt from paying the $12.00 handling fee at the Office of Motor
    Vehicles?
  choices:
    A: First-time applicants under the age of 18
    B: Applicants 60 and older applying for an identification card or duplicate identification
      card
    C: New residents transferring an out-of-state license
    D: Veterans presenting a DD-214 form
  answer: B
  explanation: The manual states there is a $12.00 handling fee, except for identification
    cards and duplicate identification cards for applicants 60 and older.
- id: 30
  category: license_system
  question: Are photocopies of identification documents acceptable when applying for
    a Louisiana driver's license?
  choices:
    A: Yes, but only if they are notarized.
    B: Yes, if they are clear and legible.
    C: No, photocopies are not acceptable whether notarized or not.
    D: Yes, but only for secondary documents.
  answer: C
  explanation: According to the identification requirements, all documents must be
    original or certified copies. Photocopies are not acceptable whether notarized
    or not.
- id: 31
  category: license_system
  question: Which of the following is an acceptable combination of identification
    documents for a first-time applicant?
  choices:
    A: One primary and one secondary document
    B: Three secondary documents
    C: One primary and two secondary documents
    D: Two secondary documents and a photo ID
  answer: C
  explanation: First-time applicants are required to provide either one primary and
    two secondary documents, two primary documents, or a Louisiana ID card with a
    photo and SSN on file.
- id: 32
  category: license_system
  question: If joint custody has been awarded, who must sign the application for an
    applicant who is seventeen or under?
  choices:
    A: Both parents must sign the application.
    B: Only the domiciliary parent may sign.
    C: Any legal adult over the age of 21.
    D: The non-custodial parent.
  answer: B
  explanation: The manual specifies that for applicants seventeen and under, only
    the domiciliary parent may sign if joint custody has been awarded.
- id: 33
  category: license_system
  question: How long do new residents have to obtain a Louisiana driver's license
    after establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents have 30 days from the time residency is established to
    obtain a Louisiana license.
- id: 34
  category: driver_testing
  question: What exam must all applicants for a Louisiana driver's license pass when
    transferring an out-of-state license?
  choices:
    A: A written knowledge exam
    B: A road skills test
    C: A vision exam
    D: A defensive driving course
  answer: C
  explanation: All applicants for a Louisiana driver's license, including out-of-state
    transfers, are required to pass a vision exam administered by Office of Motor
    Vehicles personnel.
- id: 35
  category: license_system
  question: To comply with the Military Selective Service Act, who is required to
    provide a Social Security Number when applying for a license or ID?
  choices:
    A: All applicants under the age of 18
    B: Male US citizens or immigrants age 15 to 26
    C: All male applicants regardless of age
    D: Only applicants applying for a Commercial Driver's License
  answer: B
  explanation: In order to comply with the Military Selective Service Act, the Social
    Security Number is required from all male US citizens or immigrants age 15 to
    26 who apply for a driver's license or ID card.
- id: 36
  category: license_system
  question: For applicants ages 15-17, how old can the required school enrollment
    form be?
  choices:
    A: No more than 30 days old
    B: No more than 60 days old
    C: No more than 90 days old
    D: No more than 180 days old
  answer: C
  explanation: The school enrollment form obtained from the school the applicant is
    currently enrolled in cannot be more than 90 days old.
- id: 37
  category: license_system
  question: How many days must remain on a VISA/I-94 for a non-immigrant alien to
    be considered for a driver's license issuance?
  choices:
    A: At least 30 days
    B: At least 60 days
    C: At least 90 days
    D: At least 180 days
  answer: D
  explanation: In order to be issued a driver's license or identification card, there
    must be AT LEAST 180 DAYS remaining on your VISA/I-94 to be considered for issuance.
- id: 38
  category: license_system
  question: What is the minimum age requirement to obtain a Class E learner's permit
    in Louisiana?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 17 years of age
  answer: B
  explanation: The minimum age requirement for a Class E learner's permit is fifteen
    (15) years of age, and the applicant must complete all stages of the Graduated
    Licensing Program.
- id: 39
  category: license_system
  question: What is the minimum age to travel interstate or obtain a hazardous material
    endorsement for a Class A, B, or C license?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: For Class A, B or C licenses, the minimum age is twenty-one (21) to
    travel interstate or obtain a hazardous material endorsement.
- id: 40
  category: license_system
  question: Which of the following documents is classified as an acceptable PRIMARY
    document?
  choices:
    A: Louisiana college ID card
    B: Medicare / Medicaid card
    C: Original certificate of birth
    D: High school yearbook photo
  answer: C
  explanation: An original certificate of birth is listed under acceptable primary
    documents. The other choices are considered secondary documents.
- id: 41
  category: license_system
  question: If you are transferring to Louisiana but have lost your out-of-state picture
    license, what must you submit?
  choices:
    A: A notarized affidavit of a lost license
    B: A letter of clearance or an official driving record from your last state of
      license
    C: Three primary documents instead of the usual requirements
    D: A valid US Passport and a birth certificate
  answer: B
  explanation: If you are not in possession of your out-of-state picture license,
    you must submit either a letter of clearance or an official driving record from
    your last state of license.
- id: 42
  category: license_system
  question: How long is an original 'Refugee Resettlement Program' letter valid for
    when used as identification?
  choices:
    A: 15 days from the date of issue
    B: 30 days from the date of issue
    C: 90 days from the date of issue
    D: 180 days from the date of issue
  answer: A
  explanation: An original 'Refugee Resettlement Program' letter with a color photo
    is valid for a period of 15 days from the date of issue.
- id: 43
  category: license_system
  question: What does the R.Y.A.N. Act stand for in Louisiana's Graduated Licensing
    Program?
  choices:
    A: Reduce Youth Accidents Now
    B: Restrict Young Adult Navigation
    C: Regulate Youth Automobile Navigation
    D: Reduce Young Adult Negligence
  answer: A
  explanation: The Graduated Licensing Program in Louisiana is known as the R.Y.A.N
    ACT (Reduce Youth Accidents Now) and was named for a fifteen-year-old who lost
    his life in a traffic accident.
- id: 44
  category: safe_driving_rules
  question: According to the manual, teenage drivers ages 16-19 are how many times
    more likely to crash than older drivers?
  choices:
    A: Two times
    B: Three times
    C: Four times
    D: Five times
  answer: C
  explanation: Per mile driven, teenage drivers ages 16-19 are four times more likely
    to crash than older drivers due to driver inexperience and immaturity.
- id: 45
  category: license_system
  question: 'A driver with a Stage 1 Learner''s Permit is authorized to drive only
    when accompanied by:'
  choices:
    A: Any licensed driver over the age of 18
    B: A licensed adult at least 21 years of age or a sibling at least 18 years of
      age
    C: A parent or legal guardian only
    D: A licensed driver who has held their license for at least 5 years
  answer: B
  explanation: A Stage 1 Learner's Permit holder is authorized to drive only with
    a licensed adult at least twenty-one (21) years of age or a sibling at least eighteen
    (18) years of age.
- id: 46
  category: license_system
  question: How many hours of behind-the-wheel driving experience must a parent or
    guardian attest that a learner's permit holder has completed before upgrading
    to an Intermediate License?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: Upgrading to an Intermediate license requires a signed statement attesting
    that the applicant has a minimum of fifty (50) hours of behind-the-wheel driving
    experience, including at least fifteen (15) hours of night driving.
- id: 47
  category: license_system
  question: During what hours is a Stage 2 Intermediate License holder prohibited
    from driving unless accompanied by a licensed adult at least 21 or sibling at
    least 18?
  choices:
    A: 10:00 p.m. and 6:00 a.m.
    B: 11:00 p.m. and 5:00 a.m.
    C: Midnight and 5:00 a.m.
    D: 9:00 p.m. and 6:00 a.m.
  answer: B
  explanation: A Stage 2 Intermediate licensee is prohibited from driving between
    the hours of 11:00 p.m. and 5:00 a.m. unless accompanied by a qualified licensed
    adult or sibling.
- id: 48
  category: license_system
  question: Between 6:00 p.m. and 5:00 a.m., what is the passenger restriction for
    a Stage 2 Intermediate License holder?
  choices:
    A: No passengers are allowed in the vehicle.
    B: They may not transport any passengers under the age of 18.
    C: They may not transport more than one passenger under 21 years of age that is
      not a member of the immediate family.
    D: They may only transport passengers who are over the age of 21.
  answer: C
  explanation: Between the hours of 6:00 p.m. and 5:00 a.m., an intermediate licensee
    may not transport more than one passenger under the age of twenty-one (21) years
    of age that is not a member of the immediate family.
- id: 49
  category: driver_responsibility
  question: Which of the following pieces of information is required on your acceptable
    proof of insurance card?
  choices:
    A: The vehicle's purchase price
    B: The driver's license number of the insured
    C: The NAIC number
    D: The vehicle's license plate number
  answer: C
  explanation: Acceptable proof of insurance must contain the name of the company,
    policy number, effective dates, vehicle description, name of the insured party,
    and the NAIC number.
- id: 50
  category: driver_testing
  question: What is the minimum vision standard required to pass the vision screening
    for safe driving?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: The vision screening will determine if your vision meets minimum standards
    (20/40) for safe driving.
- id: 51
  category: license_system
  question: If you need corrective lenses to pass the vision exam, what restriction
    code will be displayed on your license?
  choices:
    A: '01'
    B: A
    C: C
    D: '04'
  answer: A
  explanation: If you need corrective lenses in order to pass the vision exam, your
    license will indicate that you are required to wear them while driving and will
    display an '01' for this restriction.
- id: 52
  category: driver_testing
  question: What percentage of questions must you answer correctly to receive a passing
    score on the knowledge test?
  choices:
    A: 70 percent
    B: 75 percent
    C: 80 percent
    D: 85 percent
  answer: C
  explanation: The exam is given on a computer in most offices and you must correctly
    answer 80 percent of these questions to receive a passing score.
- id: 53
  category: driver_testing
  question: Which of the following is a requirement for the vehicle you provide for
    the road skills test at the Office of Motor Vehicles?
  choices:
    A: It must have a manual transmission.
    B: It must be a dual-control training vehicle.
    C: It must have an operational speedometer.
    D: It must have been manufactured after 2000.
  answer: C
  explanation: The vehicle used for the road skills test must be in safe driving condition,
    pass a safety inspection, and the speedometer must be operational.
- id: 54
  category: driver_testing
  question: Who is permitted in the vehicle during the road skills test?
  choices:
    A: Only the applicant and the OMV staffer
    B: The applicant, the OMV staffer, and an interpreter if applicable
    C: The applicant, the OMV staffer, and one parent or guardian
    D: The applicant, the OMV staffer, and a driving instructor
  answer: B
  explanation: Only the applicant, the OMV staffer, and the interpreter (if applicable)
    are permitted in the vehicle during the road skills test.
- id: 55
  category: vehicle_information
  question: According to the manual, all vehicles manufactured after what year must
    be equipped with functional seat belts to be used for the driving test?
  choices:
    A: '1964'
    B: '1970'
    C: '1985'
    D: '1990'
  answer: A
  explanation: The manual states that all vehicles manufactured after 1964 must be
    equipped with functional seat belts for the driving test.
- id: 56
  category: license_system
  question: An applicant who is 18 years of age or older and has not entered the graduated
    licensing program must complete which of the following to apply for a full Class
    E license?
  choices:
    A: A 14-hour driver's education course
    B: A 38-hour driver's education course OR a 6-hour pre-licensing course and an
      8-hour behind-the-wheel course
    C: A 50-hour behind-the-wheel course
    D: Only a written knowledge test and vision screening
  answer: B
  explanation: Applicants 18 years of age or above who have not entered the graduated
    licensing program may apply for a full Class E license upon completion of a 38-hour
    driver's education course or a 6-hour pre-licensing course and an 8-hour behind-the-wheel
    course.
- id: 57
  category: driver_testing
  question: Which of the following will result in an automatic failure of the road
    skills test?
  choices:
    A: Asking the examiner to repeat an instruction
    B: A violation of any traffic law
    C: Driving slightly below the posted speed limit
    D: Taking more than one attempt to park between cars
  answer: B
  explanation: You will fail the skills test for a violation of any traffic law, any
    dangerous action/incident, lack of cooperation, a collision, or cumulative minor
    mistakes.
- id: 58
  category: driver_testing
  question: Under what conditions are road skills tests administered at the Office
    of Motor Vehicles suspended?
  choices:
    A: During peak traffic hours
    B: When temperatures exceed 95 degrees
    C: During inclement weather
    D: On the day before a state holiday
  answer: C
  explanation: Road skills (driving) tests administered at the Office of Motor Vehicles
    are suspended during inclement weather.
- id: 59
  category: license_system
  question: How long is a standard Louisiana driver's license valid before it expires?
  choices:
    A: Four years from the date of issue
    B: Five years from your nearest birthday
    C: Six years from your nearest birthday
    D: Ten years from the date of issue
  answer: C
  explanation: Your driver's license will expire six years from your nearest birthday.
- id: 60
  category: license_system
  question: How many days does Louisiana law give you to correct the address on your
    driver's license after moving?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: Louisiana law requires you to correct the address on your license within
    10 days after a move.
- id: 61
  category: license_system
  question: If you are a member of the armed forces serving outside Louisiana, when
    does your driver's license officially become expired or delinquent after discharge?
  choices:
    A: Immediately upon discharge
    B: On the 30th day after discharge
    C: On the 61st day after discharge
    D: Six months after discharge
  answer: C
  explanation: The license of members of the armed forces serving outside the state
    remains valid for 60 days after discharge and will be considered expired/delinquent
    on the 61st day after discharge.
- id: 62
  category: license_system
  question: Who is required to submit a detailed medical report from a physician and/or
    vision specialist when applying for a license for the first time?
  choices:
    A: Anyone who wears prescription glasses or contact lenses
    B: Every physically impaired person and persons over the age of 60
    C: Anyone under the age of 18
    D: Persons who have failed the written knowledge test twice
  answer: B
  explanation: Every physically impaired person and persons over the age of 60 applying
    for a license for the first time must submit a detailed report from a physician
    and/or vision specialist.
- id: 63
  category: penalties_and_points
  question: How long are convictions for Driving While Intoxicated (DWI) maintained
    on your public driving record?
  choices:
    A: 3 years
    B: 5 years
    C: 7 years
    D: 10 years
  answer: D
  explanation: The Office of Motor Vehicles keeps a public record of all traffic convictions
    and collisions for five years, but convictions for DWI are maintained for 10 years.
- id: 64
  category: penalties_and_points
  question: Which of the following non-driving offenses can result in the loss of
    your driving privilege?
  choices:
    A: Failure to pay a municipal parking ticket
    B: Failure to pay child support
    C: Changing your name without notifying the OMV within 5 days
    D: Failure to vote in a state election
  answer: B
  explanation: You can lose your driving privilege for failure to pay child support,
    as well as failure to pay state income taxes.
- id: 65
  category: alcohol_drugs_health
  question: For drivers 21 years of age or older, what Blood Alcohol Concentration
    (BAC) level will result in the revocation of driving privileges?
  choices:
    A: 0.02% or more
    B: 0.04% or more
    C: 0.06% or more
    D: 0.08% or more
  answer: D
  explanation: You can lose your driving privilege if test results show a BAC level
    of 0.08% or more for those 21 years of age or older.
- id: 66
  category: penalties_and_points
  question: How many convictions of reckless driving within a 12-month period will
    result in the loss of your driving privilege?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: C
  explanation: You can lose your driving privilege for three convictions of reckless
    driving committed within a 12 month period.
- id: 67
  category: license_system
  question: What is the maximum age to be eligible for renewing a Class 'D' or 'E'
    license by mail or internet?
  choices:
    A: Under 60
    B: Under 65
    C: Under 70
    D: Under 75
  answer: C
  explanation: If you are a Louisiana resident under the age of seventy (70) with
    a class 'D' or 'E' license, you may be selected to renew your license by mail
    or internet.
- id: 68
  category: driver_responsibility
  question: When a minor applies for a duplicate license and there is joint custody,
    who is authorized to sign the application?
  choices:
    A: Both parents must sign the application together
    B: Only the domiciliary parent may sign for the minor child
    C: Any blood relative over the age of 21
    D: Either parent can sign individually
  answer: B
  explanation: In the case of joint custody, only the domiciliary parent may sign
    for the minor child when applying for a duplicate license.
- id: 69
  category: penalties_and_points
  question: Which of the following actions regarding a school bus can result in the
    revocation of your driver's license?
  choices:
    A: Passing a school bus that is driving at the speed limit on the highway
    B: Failure to stop for a school bus loading or unloading children
    C: Parking within 50 feet of a parked school bus
    D: Driving behind a school bus for more than two miles
  answer: B
  explanation: You can lose your driving privilege for failure to stop for a school
    bus loading or unloading children.
- id: 70
  category: penalties_and_points
  question: What may happen to your driving privilege if you are 16 years old and
    withdraw from high school prior to graduation?
  choices:
    A: You must pay a fine to the Office of Motor Vehicles
    B: You are restricted to driving only during daylight hours
    C: You can lose your driving privilege
    D: You must retake the written knowledge test
  answer: C
  explanation: You can lose your driving privilege for withdrawing from school prior
    to graduation if you are 15 but less than 18 years of age or have been determined
    to be habitually absent or tardy.
- id: 71
  category: penalties_and_points
  question: Under what condition can a 15 to 17-year-old's driver's license be suspended
    or revoked regarding school attendance?
  choices:
    A: Getting a failing grade in a Driver's Education course.
    B: Withdrawing from school prior to graduation or being habitually absent or tardy.
    C: Being suspended from school for one day.
    D: Failing to join an extracurricular activity.
  answer: B
  explanation: The manual states that withdrawing from school prior to graduation
    if you are 15 but less than 18 years of age, or being determined to be habitually
    absent or tardy, is grounds for license suspension or revocation.
- id: 72
  category: penalties_and_points
  question: Which of the following financial issues can be grounds for driver's license
    suspension or revocation in Louisiana?
  choices:
    A: Failure to pay credit card debt.
    B: Failure to pay state income taxes or child support.
    C: Declaring personal bankruptcy.
    D: Having a low credit score.
  answer: B
  explanation: Failure to pay child support and failure to pay state income taxes
    are explicitly listed in the manual as grounds for driver's license suspension
    or revocation.
- id: 73
  category: driver_responsibility
  question: Who is responsible for litter thrown from the passenger seat of a vehicle?
  choices:
    A: Only the passenger who threw the litter.
    B: The driver of the vehicle.
    C: The registered owner of the vehicle, regardless of who is driving.
    D: The local highway department.
  answer: B
  explanation: The manual states that the driver is responsible for all litter coming
    from the vehicle’s interior or truck bed, and the driver can be cited for littering
    committed by the passengers in his/her vehicle.
- id: 74
  category: penalties_and_points
  question: What is the maximum penalty for a severe littering conviction in Louisiana?
  choices:
    A: A $500 fine and 10 hours of community service.
    B: A $1,000 fine and a 6-month license suspension.
    C: A $5,000 fine, one year driver's license suspension, 30 days in jail, and 100
      hours of community service.
    D: A $10,000 fine and permanent loss of driving privileges.
  answer: C
  explanation: Penalties for a littering conviction can range up to a $5,000 fine,
    one year driver’s license suspension, 30 days in jail AND 100 hours of community
    service.
- id: 75
  category: driver_responsibility
  question: What is the most littered item along Louisiana roadways?
  choices:
    A: Fast food packaging.
    B: Soft drink and beer containers.
    C: Plastic grocery bags.
    D: Tobacco products, mostly cigarette butts.
  answer: D
  explanation: According to the manual, tobacco products, mostly cigarette butts,
    are the most littered item along Louisiana roadways.
- id: 76
  category: driver_responsibility
  question: According to studies mentioned in the manual, which factor is significant
    in determining who is more likely to litter?
  choices:
    A: Gender, with males being more likely to litter.
    B: Age, with those under 30 being more likely to litter.
    C: Gender, with females being more likely to litter.
    D: Age, with those over 50 being more likely to litter.
  answer: B
  explanation: Studies show that age, and not gender, is a significant factor in littering.
    Those under 30 are more likely to litter than those who are older.
- id: 77
  category: driver_responsibility
  question: Who pays the majority of the economic cost to clean up litter in Louisiana?
  choices:
    A: The state government pays 100% of the cost.
    B: Volunteer organizations pay 50% of the cost.
    C: Businesses pay about 80% of the cost.
    D: Convicted litterers pay 90% of the cost through fines.
  answer: C
  explanation: The manual states that businesses pay about 80% of the cost to clean
    up litter, with the government funding the remainder.
- id: 78
  category: license_system
  question: How is your designation as an organ, eye, and tissue donor marked on your
    Louisiana driver's license or ID card?
  choices:
    A: With a blue star.
    B: With a green ribbon.
    C: With a red heart.
    D: With a yellow cross.
  answer: C
  explanation: Your designation will be marked on the front of your license or ID
    card with a red heart.
- id: 79
  category: license_system
  question: In Louisiana, when is family consent required for organ donation if the
    individual is registered?
  choices:
    A: It is always required.
    B: It is required only for minors.
    C: It is required if the person is over 65.
    D: It is never required under any circumstances.
  answer: B
  explanation: Louisiana’s registry allows citizens to make legally binding decisions
    to be donors. Family consent is required only for minors.
- id: 80
  category: driver_responsibility
  question: How does registering as an organ donor affect the level of medical care
    you receive in a hospital?
  choices:
    A: Doctors will not try as hard to save your life.
    B: You will receive experimental treatments.
    C: It does not affect your medical care; the recovery team is only called after
      all attempts to save your life fail.
    D: You are placed in a special ward for potential donors.
  answer: C
  explanation: The level of medical care you receive in any hospital is not affected
    by your choice to register as a donor. The recovery team is only called in after
    all attempts have been made to save your life.
- id: 81
  category: license_system
  question: Which of the following factors is used to determine how organs are placed
    for transplantation?
  choices:
    A: The recipient's wealth.
    B: The recipient's fame or political power.
    C: The recipient's citizenship status.
    D: Blood type, severity of illness, and time on the waiting list.
  answer: D
  explanation: Organs are placed based on blood type, size, weight, severity of illness,
    time on the waiting list, and geography. It is illegal to allocate organs based
    on fame, wealth, citizenship or political power.
- id: 82
  category: license_system
  question: According to the manual, how many lives can you potentially save through
    organ donation?
  choices:
    A: Up to 3 lives.
    B: Up to 5 lives.
    C: Up to 9 lives.
    D: Up to 15 lives.
  answer: C
  explanation: You have the ability to save 9 lives and heal the lives of up to 50
    additional people through tissue donation.
- id: 83
  category: license_system
  question: What does the National Voter Registration Act of 1993 (The Motor Voter
    Act) require state governments to do?
  choices:
    A: Require all drivers to vote in state elections.
    B: Allow qualifying voters to register when they apply for or renew their driver's
      license.
    C: Suspend the licenses of individuals who do not vote.
    D: Charge a fee for voter registration at the OMV.
  answer: B
  explanation: This legislation requires state governments to allow for registration
    by qualifying voters whenever they apply for or renew their driver’s license.
- id: 84
  category: license_system
  question: If you register to vote at the OMV and do not receive confirmation within
    two weeks, what should you do?
  choices:
    A: Re-apply for your driver's license.
    B: Contact your local Voter Registrar's Office.
    C: Assume you are not eligible to vote.
    D: Contact the Louisiana Department of Wildlife and Fisheries.
  answer: B
  explanation: If you do not receive confirmation within two (2) weeks, please contact
    your local Voter Registrar’s Office.
- id: 85
  category: driver_responsibility
  question: Why is it incorrect to believe that cigarette butts are fully biodegradable?
  choices:
    A: They are made of solid plastic.
    B: The filter is made of a type of acetate that never fully breaks down.
    C: They are coated in a waterproof wax.
    D: They turn into glass when exposed to sunlight.
  answer: B
  explanation: While some parts of the cigarette usually decompose in one year, other
    parts never do because the filter is made of a type of acetate that never fully
    breaks down.
- id: 86
  category: license_system
  question: If you register to vote at the OMV and do not receive confirmation, how
    long should you wait before contacting your local Voter Registrar's Office?
  choices:
    A: One week
    B: Two weeks
    C: Thirty days
    D: Six months
  answer: B
  explanation: The manual states that if you do not receive confirmation within two
    (2) weeks, you should contact your local Voter Registrar's Office.
- id: 87
  category: safe_driving_rules
  question: What is the primary goal of the Highway Transportation System (HTS)?
  choices:
    A: To generate revenue through tolls and taxes
    B: To provide safe, rapid, and efficient transportation of persons and goods
    C: To eliminate all traffic collisions
    D: To promote the manufacturing of motor vehicles
  answer: B
  explanation: The goal of the HTS is to provide safe, rapid and efficient transportation
    of persons and goods to a desired destination, in an environmentally safe and
    sound fashion.
- id: 88
  category: vehicle_information
  question: What are the three major components of the Highway Transportation System?
  choices:
    A: Cars, trucks, and buses
    B: People, vehicles, and roads
    C: Engineering, enforcement, and education
    D: Local, state, and federal governments
  answer: B
  explanation: 'The Highway Transportation System consists of three major components:
    People, Vehicles, and Roads.'
- id: 89
  category: driver_responsibility
  question: Motor vehicle crashes are the leading cause of death among which age group
    in the US?
  choices:
    A: Ages 1-34
    B: Ages 16-25
    C: Ages 35-50
    D: Ages 65 and older
  answer: A
  explanation: Motor vehicle crashes are the leading cause of death among people ages
    1-34 and the leading cause of injury for all age groups (in the US).
- id: 90
  category: sharing_the_road
  question: What percentage of the nearly four million-mile roadway network is owned
    by local governments?
  choices:
    A: 25 percent
    B: 50 percent
    C: 75 percent
    D: 90 percent
  answer: C
  explanation: Local governments own 75 percent of the nearly four million-mile roadway
    network, about half of the nation's bridges and manage 90 percent of the transit
    systems.
- id: 91
  category: license_system
  question: Which branch of government regulates driver's licenses, truck weights,
    license plates, and vehicle titles?
  choices:
    A: The Department of Transportation
    B: The Department of Motor Vehicles
    C: Traffic Courts
    D: Law Enforcement Agencies
  answer: B
  explanation: The Department of Motor Vehicles regulates drivers licenses, truck
    weights and operators, license plates, fees registration, taxes, and titles to
    name a few of the items this branch of government controls.
- id: 92
  category: driver_responsibility
  question: How does the engineering branch help manage the Highway Transportation
    System?
  choices:
    A: By enforcing traffic laws and issuing citations
    B: By regulating driver's licenses and vehicle registrations
    C: By making the HTS the safest system and making vehicles safer and easier to
      operate
    D: By educating the public through high school driver education programs
  answer: C
  explanation: Highway engineering works to make our HTS the safest system in the
    world and vehicle engineering works to make vehicles safer and easier to operate.
- id: 93
  category: defensive_driving
  question: What is the number one cause of teenage deaths?
  choices:
    A: Drug abuse
    B: Traffic collisions
    C: Sports injuries
    D: Illnesses
  answer: B
  explanation: The manual states that traffic collisions have become the number one
    cause of teenage deaths.
- id: 94
  category: vehicle_information
  question: The decrease in traffic deaths per 100 million miles traveled over the
    last 40 years is mostly due to what?
  choices:
    A: Lower speed limits
    B: Fewer drivers on the road
    C: Seat belts, airbags, and improved safety features in vehicles
    D: Stricter law enforcement
  answer: C
  explanation: Most of this decrease is due to seat belts, airbags, and improved safety
    features in vehicles.
- id: 95
  category: safe_driving_rules
  question: According to the Louisiana Department of Public Safety and Corrections,
    what was the leading cause of motor vehicle crashes in Louisiana in 2010?
  choices:
    A: Speeding
    B: Failure to Yield
    C: Following Too Closely
    D: Careless, and/or Reckless Operation
  answer: D
  explanation: The five leading causes of motor vehicles crashes in Louisiana (2010)
    list 'Careless, and/or Reckless Operation' as number 1.
- id: 96
  category: driver_responsibility
  question: In 2010, how much did motor vehicle crashes cost on average for each licensed
    driver in Louisiana?
  choices:
    A: $820.00
    B: $1,250.00
    C: $1,855.00
    D: $2,500.00
  answer: C
  explanation: In 2010 fatalities, injuries, and property damage in Louisiana as a
    result of motor vehicle crashes cost on average each licensed driver in Louisiana
    $1855.00.
- id: 97
  category: sharing_the_road
  question: What percentage of freight is transported on the roads?
  choices:
    A: 40 percent
    B: 50 percent
    C: 60 percent
    D: 75 percent
  answer: C
  explanation: The manual states that sixty percent of freight is transported on the
    roads.
- id: 98
  category: sharing_the_road
  question: Where are seventy-five percent of highway miles located?
  choices:
    A: In urban areas
    B: In rural areas
    C: In suburban areas
    D: In coastal areas
  answer: B
  explanation: The manual states that seventy-five percent of highway miles are in
    rural areas.
- id: 99
  category: driver_testing
  question: What is the goal of educating the public regarding the Highway Transportation
    System?
  choices:
    A: To increase revenue for the state
    B: To impart knowledge of the rules of the road and instill attitudes consistent
      with safe driving
    C: To reduce the number of licensed drivers
    D: To encourage the use of public transportation
  answer: B
  explanation: The goal of educating the public is to impart knowledge of the rules
    of the road; the basic skills involved in vehicle operation, and instill and reinforce
    attitudes consistent with safe driving.
- id: 100
  category: vehicle_information
  question: Which of the following factors affects how a vehicle performs and handles
    on the roadway?
  choices:
    A: The color of the vehicle
    B: The age of the driver
    C: The condition of the vehicle and whether regular maintenance has been performed
    D: The number of passengers in the vehicle
  answer: C
  explanation: Another factor in how the vehicle performs is the condition of the
    vehicle. The equipment it has, the age of the vehicle and whether or not regular
    maintenance has been performed on the vehicle all affect its handling.
- id: 101
  category: safe_driving_rules
  question: 'According to the manual, driving at an unsafe speed means:'
  choices:
    A: Always driving above the posted speed limit.
    B: Driving too fast for existing weather or traffic conditions, even if under
      the limit.
    C: Driving a large commercial truck on a freeway.
    D: Driving below the minimum posted speed limit.
  answer: B
  explanation: The manual states that people who drive at unsafe speeds may be driving
    under the posted speed limit, yet still too fast for existing weather, traffic
    conditions, or their own physical health.
- id: 102
  category: vehicle_information
  question: How are Interstate Highways numbered to indicate their direction?
  choices:
    A: Even numbered highways go North and South.
    B: Odd numbered highways go East and West.
    C: Even numbered highways go East and West, and odd numbered highways go North
      and South.
    D: Interstate numbers do not indicate direction.
  answer: C
  explanation: The manual states that for Interstate Highways, EVEN numbered highways
    go East and West, and ODD numbered highways go North and South.
- id: 103
  category: safe_driving_rules
  question: What is the main difference between a standard toll way and a turnpike?
  choices:
    A: Turnpikes do not charge fees for passenger vehicles.
    B: Turnpikes collect tolls using a ticket system where you pay when you get off.
    C: Turnpikes are only found in Pennsylvania.
    D: Turnpikes are undivided highways.
  answer: B
  explanation: The manual explains that a turnpike is a type of toll way where tolls
    are collected using a ticket system; you get a ticket when you get on the highway
    and pay the ticket when you get off.
- id: 104
  category: defensive_driving
  question: What is the condition called when too much water on the road causes a
    vehicle's tires to start skimming on the surface of the water?
  choices:
    A: Hydroplaning
    B: Tread-skimming
    C: Water-gliding
    D: Traction-loss
  answer: A
  explanation: According to the manual, when too much water on the road causes a vehicle's
    tires to start skimming on the surface of the water instead of gripping the road,
    the condition is called hydroplaning.
- id: 105
  category: signs_and_signals
  question: What does an octagon-shaped traffic sign indicate?
  choices:
    A: Yield
    B: No passing zone
    C: Stop
    D: Railroad crossing
  answer: C
  explanation: The manual states that the octagon shape sign is used exclusively for
    stop signs, requiring drivers to slow down and come to a complete stop.
- id: 106
  category: signs_and_signals
  question: Which sign shape is used exclusively for yield signs?
  choices:
    A: A triangle shaped sign with the point down
    B: A triangle shaped sign with the point sideways
    C: A diamond shaped sign
    D: A rectangle shaped sign
  answer: A
  explanation: The manual states that the triangle shaped sign with the point down
    is used exclusively for yield signs.
- id: 107
  category: signs_and_signals
  question: What is a triangle-shaped sign with the point sideways used to indicate?
  choices:
    A: Yield
    B: School crossing
    C: No passing zones
    D: Route markers
  answer: C
  explanation: According to the manual, the triangle shaped sign with the point sideways
    is used to indicate no passing zones.
- id: 108
  category: defensive_driving
  question: According to the manual, approximately what percentage of all crashes
    occur at intersections?
  choices:
    A: 20 percent
    B: 30 percent
    C: 40 percent
    D: 50 percent
  answer: C
  explanation: The manual states that intersections are a hazard to drivers and that
    about 40 percent of all crashes occur at intersections.
- id: 109
  category: safe_driving_rules
  question: What is the purpose of rumble strips on the highway?
  choices:
    A: To help tires maintain better traction in the rain
    B: To alert the driver that they are veering off the road or heading into a different
      lane
    C: To force drivers to reduce their speed to 15 mph
    D: To indicate an upcoming tollbooth
  answer: B
  explanation: The manual explains that rumble strips alert the driver that he is
    veering off the road or heading into a different lane.
- id: 110
  category: signs_and_signals
  question: In addition to traffic signals and signs, whose directions must you obey
    for traffic control?
  choices:
    A: Law enforcement, highway personnel, or school crossing guards
    B: Any pedestrian crossing the street
    C: Other drivers signaling out their windows
    D: Passengers in your vehicle
  answer: A
  explanation: The manual states that traffic control can also be provided by law
    enforcement, highway personnel or school crossing guards, and you must obey directions
    from these persons.
- id: 111
  category: driver_responsibility
  question: What is described as the "golden rule" of driving in the manual?
  choices:
    A: Always yield to larger vehicles
    B: Treat others the way you would want to be treated
    C: Never drive above the posted speed limit
    D: Keep your vehicle well-maintained at all times
  answer: B
  explanation: The manual states that the most important factor in the regulation
    of the highway transportation system is the driver who obeys traffic laws and
    follows the "golden rule" of driving to treat others the way you would want to
    be treated.
- id: 112
  category: safe_driving_rules
  question: How does a "Partial Access Highway" differ from a "Full Access Highway"?
  choices:
    A: It only allows access to commercial vehicles.
    B: It allows access at other streets, but driveways and other forms of access
      are not allowed.
    C: It has driveways and any other type of access allowed.
    D: It is only accessible via signed exits.
  answer: B
  explanation: The manual defines a Partial Access Highway as one that allows access
    at other streets (probably at a stop light), though driveways and other forms
    of access are not allowed.
- id: 113
  category: signs_and_signals
  question: What type of information is typically displayed on a rectangle-shaped
    sign?
  choices:
    A: Approaching hazards and construction zones
    B: Railroad advance warnings
    C: Regulatory information such as speed limits, school zones, and parking
    D: Route markers and scenic information
  answer: C
  explanation: The manual states that the rectangle shape is used for regulatory signs,
    which include speed limit, school zones, parking and loading zones.
- id: 114
  category: safe_driving_rules
  question: Which federal agency has the chief responsibility of improving roadway
    safety and educating the public to reduce highway fatalities?
  choices:
    A: The National Highway Traffic Safety Administration (NHTSA)
    B: The Federal Highway Administration (FHWA)
    C: The Department of Transportation (DOT)
    D: The Interstate Highway Commission (IHC)
  answer: B
  explanation: The manual states that the Federal Highway Administration (FHWA) is
    a federal agency that has the chief responsibility of improving roadway safety
    and educating the public.
- id: 115
  category: signs_and_signals
  question: What does a florescent pink traffic sign indicate?
  choices:
    A: Points of recreational or cultural interest
    B: Incident management such as a crash or hurricane
    C: Pedestrian and bicycle warnings
    D: Temporary construction zones
  answer: B
  explanation: According to the manual, a florescent pink background is used for incident
    management signs such as a hurricane or a road closure due to a crash.
- id: 116
  category: signs_and_signals
  question: What is the meaning of a sign with a yellow background?
  choices:
    A: Stop or do not enter
    B: Caution, be alert, and prepare to slow down
    C: Construction zone ahead
    D: Emergency evacuation route
  answer: B
  explanation: 'Yellow is used as a background color for warning signs and school
    signs, and it means: Caution, be alert, prepare to slow down.'
- id: 117
  category: safe_driving_rules
  question: What is the proper use of a shared center lane?
  choices:
    A: It is used for passing slower vehicles.
    B: It is reserved for through traffic during rush hour.
    C: It is reserved for left-turning vehicles from either direction.
    D: It is used as a designated parking area for broken-down vehicles.
  answer: C
  explanation: The manual states that a Shared Center Lane Left Turn Only is reserved
    for the use of left turning vehicles from either direction and is not to be used
    for through traffic or passing other vehicles.
- id: 118
  category: safe_driving_rules
  question: When are you allowed to drive at the maximum posted speed limit?
  choices:
    A: Only during daylight hours
    B: Only in ideal driving conditions
    C: At all times unless a school zone is flashing
    D: Only when you are in the left lane of a multilane highway
  answer: B
  explanation: The manual specifies that the maximum limit should be driven only in
    ideal driving conditions and you must reduce your speed when weather or traffic
    conditions require it.
- id: 119
  category: signs_and_signals
  question: Which sign is described as a square sign with a white horizontal line
    inside a red circle?
  choices:
    A: Stop
    B: Yield
    C: Do Not Enter
    D: Wrong Way
  answer: C
  explanation: A 'Do Not Enter' sign is described in the manual as a square sign with
    a white horizontal line inside a red circle, meaning you cannot enter.
- id: 120
  category: safe_driving_rules
  question: If you are stopped at a red light and there is NO 'No Turn on Red' sign,
    what are you permitted to do?
  choices:
    A: You may turn right on red after stopping and checking for traffic and pedestrians.
    B: You may turn left on red if you are in the left lane.
    C: You must wait for the green light before making any turns.
    D: You may proceed straight through the intersection if it is clear.
  answer: A
  explanation: The manual states that if there is not a 'NO TURN ON RED' sign at the
    traffic light, after stopping at the stop line and checking for traffic and pedestrians,
    you may turn right on red.
- id: 121
  category: signs_and_signals
  question: Which of the following signs typically use a florescent yellow-green background?
  choices:
    A: Highway evacuation routes
    B: Pedestrian, bicycle, and school warning signs
    C: Guide signs for recreational areas
    D: Maximum speed limit signs
  answer: B
  explanation: Florescent Yellow-Green is used as a background color for pedestrian,
    bicycle and school warning signs.
- id: 122
  category: signs_and_signals
  question: On a green destination sign, what does it mean if the word 'Exit' is written
    on the left side of the sign?
  choices:
    A: The exit lane or ramp is to the left.
    B: The exit lane or ramp is to the right.
    C: The exit is closed for construction.
    D: The exit is for emergency vehicles only.
  answer: A
  explanation: The manual states that if the word 'Exit' is written on the left side
    of an exit sign, the exit lane or ramp is to the left.
- id: 123
  category: safe_driving_rules
  question: Under what condition must you NOT enter an intersection?
  choices:
    A: If the traffic light has just turned green
    B: If traffic conditions do not permit you to clear the intersection completely
    C: If there are pedestrians waiting on the sidewalk
    D: If you are making a right turn on a green light
  answer: B
  explanation: The 'Do Not Block Intersection' rule states that you must not enter
    an intersection if traffic conditions do not permit you to clear the intersection
    completely.
- id: 124
  category: signs_and_signals
  question: What are the typical shape and colors of most warning signs?
  choices:
    A: Square with white and black lettering
    B: Eight-sided and red with white lettering
    C: Diamond shaped and yellow with black lettering or symbols
    D: Rectangular and green with white lettering
  answer: C
  explanation: Warning signs are usually yellow with black lettering or symbols and
    are diamond shaped.
- id: 125
  category: safe_driving_rules
  question: What does a 'Pass With Care' sign indicate?
  choices:
    A: You are entering a school zone.
    B: You are at the end of a no passing zone and may pass when safe.
    C: You must move to the right lane to allow others to pass.
    D: Passing is strictly prohibited for the next two miles.
  answer: B
  explanation: The 'Pass With Care' sign tells you that you are at the end of a no
    passing zone, and you may pass only when it is safe to do so.
- id: 126
  category: safe_driving_rules
  question: When must you obey the reduced speed limit on a 'School Speed Limit When
    Flashing' sign?
  choices:
    A: Between the hours of 7 AM and 4 PM
    B: Only when children are visible on the sidewalk
    C: Only when the lights on the sign are flashing
    D: At all times during the school year
  answer: C
  explanation: The manual states that the reduced speed limit in a school zone is
    required only when flashing; otherwise, you should obey the roadway's standard
    speed limit.
- id: 127
  category: signs_and_signals
  question: What type of information is indicated by a sign with a blue background?
  choices:
    A: Traveler services, information signs, and emergency evacuation routes
    B: Points of recreational or cultural interest
    C: Specific laws that you must obey
    D: Possible danger or hazards ahead
  answer: A
  explanation: Blue is used as a background color for traveler services, information
    signs, emergency evacuation route signs, and as part of interstate and some state
    route markers.
- id: 128
  category: safe_driving_rules
  question: Why do some high-speed roads have minimum speed limits?
  choices:
    A: To encourage drivers to reach their destinations faster
    B: So that slower vehicles do not become a hazard to other drivers
    C: To reduce the amount of fuel consumed by vehicles
    D: To ensure that all vehicles travel at the exact same speed
  answer: B
  explanation: The manual explains that some high-speed roads have minimum speed limits
    and you are legally required to travel at least this fast so as not to be a hazard
    to other drivers.
- id: 129
  category: signs_and_signals
  question: What do green or brown square or rectangular signs with white lettering
    indicate?
  choices:
    A: Services like hospitals and gas stations
    B: Direction and distance to various locations
    C: Unplanned incidents or natural disasters
    D: Highway construction zones
  answer: B
  explanation: Destination signs are green or brown square or rectangular signs with
    white lettering that show direction and distance to various locations such as
    cities, airports, and state lines.
- id: 130
  category: signs_and_signals
  question: What color are temporary incident signs used to warn drivers of unplanned
    incidents like hazardous material spills?
  choices:
    A: Orange with black lettering
    B: Blue with white lettering
    C: Fluorescent pink with black lettering
    D: Yellow with black lettering
  answer: C
  explanation: Incident signs are temporary signs that are fluorescent pink with black
    lettering, used to let you know when roadways are closed or detoured due to unplanned
    incidents.
- id: 131
  category: penalties_and_points
  question: In Louisiana, what is the penalty for traffic violations in construction
    zones?
  choices:
    A: Traffic fines are doubled
    B: Traffic fines are tripled
    C: The driver's license is immediately suspended
    D: Points on the license are doubled
  answer: A
  explanation: According to the manual, in Louisiana, traffic fines are double for
    construction zones.
- id: 132
  category: signs_and_signals
  question: When approaching a barricade in a work zone, what do diagonal stripes
    sloping downward to the right mean?
  choices:
    A: The road is closed ahead
    B: The driver should bear to the left
    C: The driver should bear to the right
    D: The driver must come to a complete stop
  answer: C
  explanation: The diagonal stripes on a barricade guide the driver. Stripes sloping
    downward to the right mean the driver should bear to the right.
- id: 133
  category: signs_and_signals
  question: How are the lights arranged on a horizontal traffic signal in metropolitan
    areas?
  choices:
    A: Green on the left, yellow in the middle, red on the right
    B: Red on the left, yellow in the middle, green on the right
    C: Yellow on the left, red in the middle, green on the right
    D: Red on the top, yellow in the middle, green on the bottom
  answer: B
  explanation: In some metropolitan areas, traffic lights are horizontal, where the
    red light is on the left, the yellow light is in the middle and the green light
    is on the right.
- id: 134
  category: safe_driving_rules
  question: What should you do if you are approaching an intersection with a flashing
    yellow traffic light?
  choices:
    A: Come to a complete stop and wait for a green light
    B: Speed up to clear the intersection quickly
    C: Treat it as a four-way stop
    D: Slow down, look for traffic, and proceed with caution
  answer: D
  explanation: A flashing YELLOW traffic light means slow down, look for any traffic
    entering the intersection and proceed with caution.
- id: 135
  category: safe_driving_rules
  question: Under what condition is a left turn permitted on a steady red traffic
    light?
  choices:
    A: When turning from a two-way street onto a one-way street
    B: When turning from a one-way street onto another one-way street
    C: When turning from a one-way street onto a two-way street
    D: Left turns are never permitted on a red light
  answer: B
  explanation: Some left turns may be permitted on red when moving from a one-way
    street onto another one-way street. You must yield to all traffic and pedestrians
    crossing in front or to the side.
- id: 136
  category: safe_driving_rules
  question: What does a double solid yellow line in the center of the roadway indicate?
  choices:
    A: You may cross the lines to pass another vehicle
    B: You may not cross these lines to pass, but you may cross them to make a turn
    C: You may not cross these lines for any reason
    D: The roadway is a one-way street
  answer: B
  explanation: Double Solid Yellow lines are used to mark the center of the roadway
    when there are four or more lanes of traffic. You may not cross these lines to
    pass. You may cross these lines to make a turn.
- id: 137
  category: safe_driving_rules
  question: According to Louisiana law, which lane should you travel in if you are
    driving slower than the normal speed of traffic?
  choices:
    A: The left lane
    B: The center lane
    C: The right lane
    D: Any lane as long as you are under the speed limit
  answer: C
  explanation: Louisiana law states that any vehicle traveling at a speed less than
    the normal speed of traffic shall travel in the right lane only.
- id: 138
  category: signs_and_signals
  question: What is the meaning of a single solid white line between lanes of traffic
    moving in the same direction?
  choices:
    A: Movement from lane to lane is hazardous and should only be done with great
      care
    B: Crossing the line is strictly prohibited by law
    C: The lane is reserved for high-occupancy vehicles
    D: You may cross the line freely to pass slower vehicles
  answer: A
  explanation: Single Solid White lines indicate movement from lane to lane is hazardous.
    The wider the line, the greater the hazard. You may cross a solid white line only
    with great care.
- id: 139
  category: signs_and_signals
  question: What type of signs are blue, square or rectangular, and show the location
    of rest areas, gas stations, and hospitals?
  choices:
    A: Destination Signs
    B: Service Signs
    C: Route Number Signs
    D: Incident Signs
  answer: B
  explanation: Service Signs are blue signs that are square or rectangular shaped
    with white lettering or symbols. They show the location of various services such
    as rest areas, gas stations, hotels or hospitals.
- id: 140
  category: signs_and_signals
  question: What does a 'Low Shoulder' warning sign indicate in a construction zone?
  choices:
    A: The bridge ahead has low clearance
    B: There is a sharp drop from the pavement edge to the shoulder
    C: Workers are present on the shoulder
    D: The shoulder is closed to all traffic
  answer: B
  explanation: The 'Low Shoulder' sign indicates a sharp drop from the pavement edge
    to the shoulder. If you must leave the pavement, slow down and steer firmly.
- id: 141
  category: safe_driving_rules
  question: What must you do when approaching a flashing red traffic light?
  choices:
    A: Slow down and proceed with caution
    B: Stop only if there is oncoming traffic
    C: Stop behind the stop line or crosswalk and use the same procedure as a stop
      sign
    D: Yield to vehicles on the right and proceed without stopping
  answer: C
  explanation: A Flashing RED Traffic Light means you must stop behind a stop line,
    crosswalk, or intersection before entering and use the same procedure as you would
    at a stop sign.
- id: 142
  category: signs_and_signals
  question: What do red pavement markings or reflectors indicate?
  choices:
    A: A school zone is ahead
    B: A roadway that must not be entered
    C: A fire lane where parking is prohibited
    D: A railroad crossing is approaching
  answer: B
  explanation: Red Pavement Marking or reflectors indicate a roadway that must not
    be entered.
- id: 143
  category: signs_and_signals
  question: What pavement markings are painted in the traffic lane before a railroad
    crossing?
  choices:
    A: A large 'X' and two 'R's' with a solid yellow center line
    B: A large 'R' and a solid white center line
    C: A red stop line and a yellow 'X'
    D: Diagonal white stripes across the entire lane
  answer: A
  explanation: Railroad Crossing markings are white markings painted in the traffic
    lane before railroad crossings. The pavement is marked with a large 'X' and two
    'R's'. A solid yellow center line extends the entire distance to prevent passing.
- id: 144
  category: safe_driving_rules
  question: According to Louisiana law, when should you travel in the right hand lane?
  choices:
    A: Only when driving under the speed limit.
    B: At all times, unless preparing for a left turn, passing, or if right lanes
      are congested.
    C: Only on multi-lane highways.
    D: Whenever you are driving a commercial vehicle.
  answer: B
  explanation: Louisiana law states that all vehicles should travel in the right hand
    lane unless preparing for a left turn, passing another vehicle, or when right
    hand lanes are congested.
- id: 145
  category: signs_and_signals
  question: What is the designated center lane with solid and dashed yellow lines
    used for?
  choices:
    A: Passing slower vehicles.
    B: Emergency parking only.
    C: Left turn maneuvers only.
    D: Right turn maneuvers only.
  answer: C
  explanation: Two-Way Left Turn Channelization markings designate a center lane that
    may be used by vehicles traveling in either direction for left turn maneuvers
    ONLY. It must never be used for passing.
- id: 146
  category: sharing_the_road
  question: Who has the right of way when pedestrians are in a crosswalk?
  choices:
    A: Motor vehicles traveling straight.
    B: Pedestrians.
    C: Vehicles making a right turn.
    D: Bicycles only.
  answer: B
  explanation: When pedestrians are in crosswalks, they have the right of way over
    motor vehicles. You must stop for pedestrians in crosswalks.
- id: 147
  category: safe_driving_rules
  question: If you discover you are in a lane that requires you to turn, but you wish
    to go straight ahead, what should you do?
  choices:
    A: Stop and wait for a chance to change lanes.
    B: Quickly change lanes if you use your turn signal.
    C: Go ahead and make the turn, then drive around the block.
    D: Put your vehicle in reverse and back out of the lane.
  answer: C
  explanation: If you are in a turn lane, stopping blocks traffic and sudden lane
    changes are unexpected. You must go ahead and make the turn, drive around the
    block, and return to the street you want safely.
- id: 148
  category: safe_driving_rules
  question: In a roundabout, who does entering traffic yield to?
  choices:
    A: Traffic entering from the right.
    B: Pedestrians only.
    C: The circulation traffic.
    D: Traffic entering from the left.
  answer: C
  explanation: In a roundabout, traffic yields to the circulation traffic.
- id: 149
  category: defensive_driving
  question: What happens during the third phase of a crash, when 'your internal organs
    crash too'?
  choices:
    A: The vehicle absorbs all the force of the crash.
    B: Your body is thrown forward against the dashboard.
    C: Your internal organs smash into your bones, causing internal injuries.
    D: The airbags deploy to protect the vehicle's exterior.
  answer: C
  explanation: Once your body stops against the car, the force continues inside you.
    Your brain slams against your skull, and organs like kidneys smash into your bones,
    causing internal injuries.
- id: 150
  category: driver_responsibility
  question: According to the manual, what is the most common traffic violation?
  choices:
    A: Failure to yield.
    B: Speeding.
    C: Careless driving.
    D: Following too closely.
  answer: B
  explanation: Every day, individuals break laws while driving. The most common traffic
    violation is speeding.
- id: 151
  category: defensive_driving
  question: According to Newton's 3rd law of motion, what happens when a heavy car
    and a lighter car collide?
  choices:
    A: The heavier car experiences a greater force.
    B: The forces are equal, but the change in velocity is greater on the lighter
      car.
    C: The lighter car experiences less damage.
    D: The forces are completely absorbed by the heavier car.
  answer: B
  explanation: Newton's 3rd law tells us each car experiences the same force during
    the collision, but the change in velocity will be much greater on the lighter
    of two vehicles, resulting in greater damage to the lighter car.
- id: 152
  category: safe_driving_rules
  question: How much does wearing a safety belt reduce the risk of serious injury
    and fatalities in crashes?
  choices:
    A: 10 percent.
    B: 25 percent.
    C: 50 percent.
    D: 90 percent.
  answer: C
  explanation: People who wear safety belts reduce their risk of serious injury by
    50 percent and also reduce the risk of fatalities by 50 percent.
- id: 153
  category: vehicle_information
  question: Where should the lap portion of your safety belt be worn to best absorb
    the impact of a crash?
  choices:
    A: Snugly across your hips.
    B: Loosely across your stomach.
    C: High on your waist.
    D: Across your upper thighs.
  answer: A
  explanation: Your safety belt should fit snugly across your hips. Your hip bones
    are strong and can absorb more of the impact than your abdominal region.
- id: 154
  category: defensive_driving
  question: At what speeds do 80% of deaths occur in car crashes?
  choices:
    A: Over 70 miles an hour.
    B: Between 55 and 65 miles an hour.
    C: Less than 40 miles an hour.
    D: Exactly 50 miles an hour.
  answer: C
  explanation: According to the safety belt facts in the manual, 80% of deaths occur
    in cars traveling less than 40 miles an hour.
- id: 155
  category: defensive_driving
  question: What is the actual chance of being trapped in a burning or submerged car?
  choices:
    A: About 10 percent.
    B: Less than one-half of one percent.
    C: Exactly 5 percent.
    D: More than 20 percent.
  answer: B
  explanation: The manual states there is less than one-half of one percent chance
    of being trapped in a burning or submerged car.
- id: 156
  category: safe_driving_rules
  question: If you are pregnant, what is the safest way to wear a seat belt?
  choices:
    A: Wear only the lap belt.
    B: Wear only the shoulder belt.
    C: Do not wear a seat belt to protect the unborn child.
    D: Wear both the lap and shoulder belt.
  answer: D
  explanation: If you are pregnant, you and your unborn child are much safer if you
    wear a lap and shoulder belt. By protecting yourself from injury, you protect
    your unborn child.
- id: 157
  category: defensive_driving
  question: 'Non-belted fatalities have been recorded at speeds as low as:'
  choices:
    A: 5 mph.
    B: 12 mph.
    C: 20 mph.
    D: 25 mph.
  answer: B
  explanation: The manual notes that non-belted fatalities have been recorded at speeds
    as low as 12 mph.
- id: 158
  category: signs_and_signals
  question: When you see white arrows painted in the traffic lane indicating more
    than one direction, what must you do?
  choices:
    A: You must go straight.
    B: You may choose any of the indicated directions.
    C: You must turn right.
    D: You must stop and wait for a green arrow signal.
  answer: B
  explanation: Directional Markings indicate the direction you must go. Where arrows
    indicate more than one direction, you may choose any direction.
- id: 159
  category: safe_driving_rules
  question: According to the manual, what percentage of more lives could have been
    saved if everyone in a crash was wearing their seatbelt?
  choices:
    A: 30%
    B: 40%
    C: 50%
    D: 60%
  answer: D
  explanation: 'The manual states: ''If everyone that was in a crash was wearing their
    seatbelt at the time of the crash, 60% more lives could have been saved.'''
- id: 160
  category: safe_driving_rules
  question: How should a lap belt be properly worn?
  choices:
    A: Loosely across the thighs
    B: Snugly across your hips and lower part of your abdomen
    C: Tightly across the upper stomach
    D: Snugly across the chest and ribcage
  answer: B
  explanation: According to the manual, 'Lap belts should be buckled snugly across
    your hips and lower part of your abdomen.'
- id: 161
  category: safe_driving_rules
  question: 'A child may not be transported in the front seat of a vehicle with an
    active airbag if they are:'
  choices:
    A: 8 years or younger or under 80 lbs.
    B: 6 years or younger or under 60 lbs.
    C: 10 years or younger or under 100 lbs.
    D: 12 years or younger or under 90 lbs.
  answer: B
  explanation: The law requires that 'A child 6 years or younger or under 60 lbs.
    may not be transported in the front seat of a vehicle with an active airbag.'
- id: 162
  category: safe_driving_rules
  question: What is the child passenger restraint requirement for an infant from birth
    or weighing less than 20 lbs. at any age?
  choices:
    A: Forward-facing, federally approved car seat
    B: Booster seat with restraints
    C: Rear-facing, federally approved car seat
    D: Standard seat belt in the back seat
  answer: C
  explanation: The manual specifies that for a child from 'Birth or less than 20 lbs.
    at any age', they must be in a 'rear facing, federally approved car seat'.
- id: 163
  category: safe_driving_rules
  question: If a child falls into more than one category for age or weight regarding
    child restraints, what should you do?
  choices:
    A: Choose the category based strictly on age
    B: Choose the category based strictly on weight
    C: Choose the least restrictive category
    D: Choose the more protective category
  answer: D
  explanation: 'The manual states: ''A child that falls into more than one category
    for age or weight must choose the more protective category.'''
- id: 164
  category: safe_driving_rules
  question: Where is the safest place in a passenger car for children under the age
    of 13 to sit?
  choices:
    A: The front passenger seat
    B: The middle of the back seat
    C: The right side of the back seat
    D: The left side of the back seat
  answer: B
  explanation: The manual advises to 'Have all children under the age of 13 sit in
    the back seat. The middle of the back seat in a passenger car is safer than the
    front seat.'
- id: 165
  category: vehicle_information
  question: Because of the speed at which air bags deploy, what are the recommended
    steering wheel hand positions?
  choices:
    A: 10 and 2
    B: 11 and 1
    C: 9 and 3 or 8 and 4
    D: 7 and 5 or 12 and 6
  answer: C
  explanation: The manual explains that because air bags deploy at 150 to 200 mph,
    the traditional 10 and 2 position can cause serious injury. 'The recommended positions
    are 9 and 3 or 8 and 4.'
- id: 166
  category: safe_driving_rules
  question: How far away should a driver sit from a steering wheel equipped with an
    air bag?
  choices:
    A: At least 5 inches
    B: At least 10 inches
    C: At least 15 inches
    D: At least 20 inches
  answer: B
  explanation: Drivers are required to 'Sit at least 10 inches away from the steering
    wheel equipped with an air bag - otherwise the bag can explode into you, causing
    serious harm.'
- id: 167
  category: vehicle_information
  question: In which of the following situations will air bags NOT deploy?
  choices:
    A: When you are rear-ended by another car
    B: During a head-on collision
    C: During a nearly head-on collision
    D: When traveling over 50 mph
  answer: A
  explanation: 'The manual explicitly states: ''Air bags do not deploy when you are
    rear-ended by another car.'''
- id: 168
  category: vehicle_information
  question: In automotive safety, what does the term 'active safety' refer to?
  choices:
    A: Components that protect occupants during a crash
    B: Technology assisting in the prevention of a crash
    C: The physical structure of the vehicle
    D: The use of crash test dummies
  answer: B
  explanation: According to the manual, 'Active safety' refers to technology assisting
    in the prevention of a crash.
- id: 169
  category: vehicle_information
  question: Which of the following is considered a 'passive safety' component?
  choices:
    A: Anti-lock braking systems
    B: Lane departure warning systems
    C: Airbags and seatbelts
    D: Adaptive cruise control
  answer: C
  explanation: The manual states that 'passive safety' refers to components of the
    vehicle '(primarily airbags, seatbelts and the physical structure of the vehicle)
    that help to protect occupants during a crash.'
- id: 170
  category: vehicle_information
  question: How do tempered glass side and rear windows react when impacted during
    a collision?
  choices:
    A: They remain in one solid piece
    B: They splinter into jagged fragments
    C: They break into granules with minimally sharp edges
    D: They absorb the impact without breaking
  answer: C
  explanation: The manual explains that 'Tempered glass side and rear windows break
    into granules with minimally sharp edges, rather than splintering into jagged
    fragments as ordinary glass does.'
- id: 171
  category: vehicle_information
  question: What is the purpose of crumple zones in a vehicle?
  choices:
    A: To absorb and dissipate the force of a collision away from the passenger compartment
    B: To prevent the vehicle's roof from collapsing in a rollover
    C: To keep the windshield in one piece during an impact
    D: To alert the driver of an unintended departure from the lane
  answer: A
  explanation: 'The manual states: ''Crumple zones absorb and dissipate the force
    of a collision, displacing and diverting it away from the passenger compartment
    and reducing the impact force on the vehicle occupants.'''
- id: 172
  category: sharing_the_road
  question: What are school buses and semi-trailer trucks required to have for greater
    visibility at night?
  choices:
    A: Infrared night vision systems
    B: Adaptive headlamps
    C: Retro reflective strips outlining their side and rear perimeters
    D: Flashing strobe lights on the roof
