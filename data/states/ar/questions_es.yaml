  explanation: De acuerdo con el sistema de puntos de Arkansas, acumular de 18 a 23
    puntos en un plazo de 3 años resulta en una suspensión de 6 meses.
- id: 64
  category: driver_responsibility
  question: ¿Cuál es la sanción en Arkansas por negarse por primera vez a someterse
    a una prueba química (alcoholímetro) bajo la Ley de Consentimiento Implícito (Implied
    Consent Law)?
  choices:
    A: Solo una multa de $50
    B: Suspensión de la licencia por 180 días
    C: 48 horas obligatorias en la cárcel
    D: Revocación permanente de la licencia de conducir
  answer: B
  explanation: Negarse a la prueba química en Arkansas resulta en la incautación automática
    de la licencia y una suspensión de 180 días por una primera infracción.
- id: 65
  category: driver_responsibility
  question: Cuando un nuevo residente se muda a Arkansas, debe registrar su vehículo
    dentro de los ________ días posteriores al establecimiento de su residencia.
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Arkansas exige que los nuevos residentes registren sus vehículos
    en la Oficina de Vehículos Motorizados dentro de los 30 días posteriores a su
    mudanza al estado.
- id: 66
  category: driver_responsibility
  question: En Arkansas, las multas de tráfico se ________ si la infracción ocurre
    en una zona de obras viales mientras hay trabajadores presentes.
  choices:
    A: Reducen a la mitad
    B: Mantienen igual
    C: Duplican
    D: Triplican
  answer: C
  explanation: La ley de Arkansas exige que las multas por infracciones de tráfico
    en movimiento se dupliquen cuando se cometen en una zona de obras viales designada
    mientras hay trabajadores presentes.
- id: 67
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las leyes
    del cinturón de seguridad en Arkansas?
  choices:
    A: Los cinturones de seguridad solo son obligatorios para los pasajeros del asiento
      delantero
    B: Arkansas tiene una ley de aplicación secundaria (deben detenerlo por otra razón
      primero)
    C: Arkansas tiene una ley de aplicación primaria (pueden detenerlo únicamente
      por no usar el cinturón de seguridad)
    D: Los cinturones de seguridad son opcionales para conductores mayores de 21 años
  answer: C
  explanation: Arkansas es un estado de aplicación primaria (primary enforcement)
    para el uso del cinturón de seguridad, lo que significa que un oficial de la ley
    puede detener y multar a un conductor únicamente por una infracción del cinturón
    de seguridad.
- id: 68
  category: driver_responsibility
  question: Si se ve involucrado en un choque en Arkansas, la ley le exige proporcionar
    su nombre, dirección y ________ a las otras partes involucradas.
  choices:
    A: Número de Seguro Social
    B: Información de registro y seguro
    C: Tarjeta de registro de votante
    D: Historial de empleo
  answer: B
  explanation: La ley de Arkansas exige que los conductores involucrados en un choque
    intercambien nombres, direcciones, números de registro del vehículo e información
    del seguro.
- id: 69
  category: driver_responsibility
  question: 'En Arkansas, debe presentar un formulario SR-1 (Informe de Accidente
    de Tráfico) si hay lesiones personales, muerte o daños a la propiedad de cualquier
    persona por un monto de:'
  choices:
    A: $500 o más
    B: $750 o más
    C: $1,000 o más
    D: $2,000 o más
  answer: C
  explanation: Según el Manual del Conductor de Arkansas, se debe presentar un informe
    dentro de los 30 días si un accidente involucra lesiones, muerte o daños a la
    propiedad de $1,000 o más para cualquier persona.
- id: 70
  category: driver_responsibility
  question: Si se ve involucrado en un accidente de tráfico en Arkansas que requiere
    un informe SR-1, ¿cuántos días tiene para presentarlo ante la Oficina de Servicios
    al Conductor (Office of Driver Services)?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Arkansas exige que los conductores presenten un informe oficial
    de accidente (SR-1) dentro de los 30 días si el accidente cumple con los umbrales
    de notificación por daños o lesiones.
- id: 71
  category: driver_responsibility
  question: 'Para los conductores de 21 años o más en Arkansas, es ilegal operar un
    vehículo motorizado con un contenido de alcohol en sangre (BAC) de:'
  choices:
    A: 0.04% o superior
    B: 0.06% o superior
    C: 0.08% o superior
    D: 0.10% o superior
  answer: C
  explanation: En Arkansas, el límite legal de BAC para conductores de 21 años o más
