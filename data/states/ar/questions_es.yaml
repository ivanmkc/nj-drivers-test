- id: 60
  category: driver_responsibility
  question: 'En Arkansas, si es condenado por rebasar a un autobús escolar detenido
    que tiene sus luces rojas intermitentes encendidas y el brazo de parada extendido,
    podría enfrentar una multa de hasta:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Rebasar a un autobús escolar detenido es una infracción grave en Arkansas.
    Las multas por una primera infracción oscilan entre $250 y $1,000, y también podría
    enfrentar tiempo en la cárcel.
- id: 61
  category: driver_responsibility
  question: Si vende un vehículo en Arkansas, debe presentar un 'Aviso de Exención
    de Responsabilidad' (Notice of Release of Liability) ante la Oficina de Vehículos
    Motorizados (Office of Motor Vehicle) ¿dentro de cuántos días?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Para protegerse de la responsabilidad por un vehículo que ya no posee,
    la ley de Arkansas le exige notificar a la Oficina de Vehículos Motorizados del
    DFA dentro de los 10 días posteriores a la venta.
- id: 62
  category: driver_responsibility
  question: 'Según la ley de Arkansas, una persona que sea condenada por una primera
    infracción por estacionarse en un espacio designado para personas con discapacidades
    sin el permiso adecuado puede ser multada con un monto de entre:'
  choices:
    A: $50 y $100
    B: $100 y $250
    C: $250 y $500
    D: $500 y $1,000
  answer: C
  explanation: La ley de Arkansas impone una multa de $250 a $500 por la primera condena
    por estacionarse ilegalmente en un espacio de estacionamiento para personas con
    discapacidad.
- id: 63
  category: driver_responsibility
  question: 'Si un conductor de Arkansas acumula de 18 a 23 puntos en su historial
    de manejo dentro de un período de 36 meses, su licencia será suspendida por:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
