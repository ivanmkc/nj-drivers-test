- id: 55
  category: driver_testing
  question: 'En Arkansas, si es condenado por una infracción de tránsito en una zona
    de obras viales cuando hay trabajadores presentes, la multa se:'
  choices:
    A: Reduce a la mitad
    B: Mantiene igual que una multa estándar
    C: Duplica
    D: Triplica
  answer: C
  explanation: La ley de Arkansas dicta que las multas por infracciones de tránsito
    se duplican si ocurren en una zona de obras viales designada mientras hay trabajadores
    presentes.
- id: 56
  category: driver_responsibility
  question: En Arkansas, si se ve involucrado en un accidente de tránsito que resulte
    en muerte, lesiones o daños a la propiedad de ________ o más, debe presentar un
    informe (SR-1) ante la Oficina de Servicios al Conductor (Office of Driver Services).
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: Según el Manual del Conductor de Arkansas, cualquier accidente que
    resulte en lesiones, muerte o daños a la propiedad que superen los $1,000 debe
    informarse a la Oficina de Servicios al Conductor dentro de los 30 días utilizando
    el formulario SR-1.
- id: 57
  category: driver_responsibility
  question: 'Bajo la ley de ''Consentimiento Implícito'' (Implied Consent) de Arkansas,
    al conducir un vehículo motorizado en el estado, usted ha aceptado:'
  choices:
    A: Contar con un seguro mínimo de $50,000 por daños a la propiedad
    B: Someterse a una prueba química de alcohol o drogas si lo solicita un oficial
    C: Permitir que cualquier pasajero menor de 18 años viaje sin cinturón de seguridad
    D: Mantener las luces delanteras encendidas en todo momento mientras conduce
  answer: B
  explanation: La ley de Consentimiento Implícito de Arkansas significa que, al operar
    un vehículo, usted acepta someterse a una prueba de aliento, sangre u orina si
