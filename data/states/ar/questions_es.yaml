- id: 72
  category: driver_responsibility
  question: ¿Cuál es la multa mínima por una condena de primera ofensa por no portar
    el comprobante del seguro de responsabilidad civil requerido en Arkansas?
  choices:
    A: $50
    B: $100
    C: $250
    D: $1,000
  answer: C
  explanation: Una primera ofensa por no mantener o proporcionar un comprobante de
    seguro de responsabilidad civil en Arkansas conlleva una multa que oscila entre
    $250 y $1,000.
- id: 73
  category: driver_responsibility
  question: 'La ley ''Move Over'' (Hacerse a un lado) de Arkansas exige que los conductores
    se muevan al carril más alejado de un vehículo de emergencia con luces intermitentes.
    Si cambiar de carril no es seguro, el conductor debe:'
  choices:
    A: Detenerse por completo hasta que se le indique que puede pasar
    B: Mantener la velocidad pero tocar la bocina para advertir a los trabajadores
      de emergencia
    C: Reducir la velocidad y mantener una velocidad segura para las condiciones
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: C
  explanation: Si un cambio de carril no es posible o no es seguro, la ley de Arkansas
    exige que los conductores reduzcan la velocidad y mantengan una velocidad segura
    hasta que hayan pasado el vehículo de emergencia.
- id: 74
  category: driver_responsibility
  question: En Arkansas, ¿qué sucede con las multas por infracciones de tránsito que
    ocurren en una zona de obras viales cuando hay trabajadores presentes?
  choices:
    A: Se reducen a la mitad
    B: Siguen siendo las mismas que las multas estándar
    C: Se duplican
    D: Se triplican
  answer: C
  explanation: La ley de Arkansas exige que las multas por todas las infracciones
    de tránsito en movimiento se dupliquen si ocurren en una zona de obras viales
    designada mientras hay trabajadores presentes.
- id: 75
  category: driver_responsibility
  question: ¿Cuántos días tiene un nuevo residente para registrar su vehículo después
    de mudarse a Arkansas?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes deben registrar sus vehículos motorizados en
    la Oficina de Vehículos Motorizados de Arkansas dentro de los 30 días posteriores
    al establecimiento de la residencia.
- id: 76
  category: driver_responsibility
  question: Bajo el sistema de puntos de Arkansas, ¿cuántos puntos se asignan al historial
    de un conductor por una condena de 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 3 puntos
    B: 5 puntos
    C: 8 puntos
