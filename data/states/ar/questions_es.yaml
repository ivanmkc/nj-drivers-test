- id: 78
  category: driver_responsibility
  question: 'Una condena por DUI (conducir bajo la influencia) por primera vez en
    Arkansas resulta en la suspensión de la licencia de conducir por un período de:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Para una primera ofensa de DUI en Arkansas, la licencia de conducir
    generalmente se suspende por 6 meses.
- id: 79
  category: driver_responsibility
  question: En Arkansas, ¿cuál es la multa mínima por una primera ofensa de rebasar
    ilegalmente un autobús escolar detenido con sus luces rojas intermitentes?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,500
  answer: B
  explanation: Rebasar un autobús escolar detenido es una infracción grave. Una primera
    ofensa conlleva una multa de no menos de $250 y no más de $1,000, y/o hasta 90
    días de cárcel.
- id: 80
  category: driver_responsibility
  question: ¿Cuál es el rango de multa por una condena de primera ofensa por estacionarse
    ilegalmente en un espacio designado para personas con discapacidades en Arkansas?
  choices:
    A: $50 a $100
    B: $100 a $200
    C: $250 a $500
    D: $500 a $1,000
  answer: C
  explanation: La ley de Arkansas establece la multa por una condena de primera ofensa
    por estacionarse ilegalmente en un espacio para discapacitados en un mínimo de
    $250 y un máximo de $500.
- id: 81
  category: safe_driving_rules
  question: En Arkansas, ¿cuándo es obligatorio encender los faros delanteros?
  choices:
    A: Solo entre la puesta del sol y el amanecer
    B: Siempre que esté utilizando los limpiaparabrisas
    C: Solo cuando la visibilidad sea inferior a 200 pies
    D: Solo en carreteras rurales
  answer: B
  explanation: Según la ley de Arkansas, los conductores deben encender los faros
    delanteros cuando los limpiaparabrisas estén en uso debido a la lluvia, la nieve
    o el aguanieve, así como desde 30 minutos después de la puesta del sol hasta 30
    minutos antes del amanecer.
- id: 82
  category: safe_driving_rules
  question: Al rebasar una bicicleta en Arkansas, ¿cuál es la distancia mínima legal
    que un automovilista debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Arkansas exige que los automovilistas mantengan una distancia
    mínima de tres (3) pies al rebasar a una persona que opera una bicicleta.
- id: 83
  category: safe_driving_rules
  question: Al acercarse a un autobús escolar con las luces rojas intermitentes y
    el brazo de parada extendido en una carretera con un carril central de giro, ¿qué
    debe hacer?
  choices:
    A: Solo el tráfico que sigue al autobús debe detenerse
    B: Solo el tráfico en el carril central debe detenerse
    C: El tráfico en todas las direcciones debe detenerse
    D: Detenerse solo si hay niños presentes en la carretera
  answer: C
  explanation: En Arkansas, el tráfico en todas las direcciones debe detenerse ante
    un autobús escolar con luces rojas intermitentes, a menos que la carretera esté
    dividida por una barrera física o una mediana. Un carril central de giro no se
    considera una barrera física.
- id: 84
  category: safe_driving_rules
  question: 'Según el Manual del Conductor de Arkansas, debe utilizar la "regla de
    los cuatro segundos" para determinar:'
  choices:
    A: Cuánto tiempo esperar en una señal de alto (stop)
    B: Su distancia de seguimiento detrás de otro vehículo
    C: Cuánto tiempo señalizar antes de girar
    D: El tiempo que se tarda en cruzar una intersección
  answer: B
  explanation: El Manual del Conductor de Arkansas recomienda una distancia de seguimiento
    de al menos cuatro segundos para permitir suficiente tiempo para reaccionar ante
    los peligros.
- id: 85
  category: safe_driving_rules
  question: Al estacionar junto a un bordillo (acera) en Arkansas, ¿a cuántas pulgadas
    del bordillo como máximo deben estar sus ruedas?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: La ley de Arkansas exige que, cuando un vehículo esté estacionado,
    sus ruedas deben estar paralelas y a no más de 18 pulgadas del bordillo.
- id: 86
  category: safe_driving_rules
  question: ¿Con cuántos pies de antelación, como mínimo, está obligado a señalizar
    antes de realizar un giro en Arkansas?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: En Arkansas, debe dar una señal continua durante al menos 100 pies
    antes de girar o cambiar de carril.
- id: 87
  category: safe_driving_rules
  question: Según la ley de Arkansas, ¿es ilegal estacionar a menos de cuántos pies
    de una señal de alto (stop)?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El Código de Arkansas § 27-51-1302 prohíbe estacionar a menos de 30
    pies de cualquier baliza intermitente, señal de alto o señal de control de tráfico
    ubicada al costado de una carretera.
- id: 88
  category: safe_driving_rules
  question: Según el Manual del Conductor de Arkansas, ¿a qué velocidad puede comenzar
    el hidroplaneo (hydroplaning)?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El Manual del Conductor de Arkansas establece que el hidroplaneo (donde
    los neumáticos pierden contacto con la carretera y se deslizan sobre el agua)
    puede comenzar a velocidades tan bajas como 35 mph.
- id: 89
  category: safe_driving_rules
  question: En Arkansas, ¿cuál es el límite de velocidad en una zona escolar cuando
    las luces amarillas están parpadeando o hay niños presentes?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: Según el Manual del Conductor de Arkansas, el límite de velocidad en
    una zona escolar es de 25 mph, a menos que se indique lo contrario, cuando las
    luces parpadean o hay niños presentes.
- id: 90
  category: safe_driving_rules
  question: En Arkansas, ¿es ilegal rebasar a otro vehículo a menos de cuántos pies
    de una intersección, cruce de ferrocarril, puente o túnel?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Arkansas prohíbe rebasar a menos de 100 pies de una intersección,
    cruce de ferrocarril, puente, viaducto o túnel donde la vista esté obstruida.
- id: 91
  category: safe_driving_rules
  question: 'La ley estatal de Arkansas exige que los conductores enciendan sus faros
    delanteros siempre que:'
  choices:
    A: El sol esté detrás de ellos
    B: Conduzcan en una autopista
    C: Los limpiaparabrisas estén en uso
    D: Conduzcan en una zona de construcción
  answer: C
  explanation: La ley de Arkansas exige que si los limpiaparabrisas están encendidos,
    los faros delanteros también deben estarlo.
- id: 92
  category: safe_driving_rules
  question: En Arkansas, ¿a cuántos pies de una señal de alto (stop), una señal de
    ceda el paso (yield) o una señal de control de tráfico no se permite estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Arkansas prohíbe estacionar a menos de 30 pies de una señal
    de alto, una señal de ceda el paso o un semáforo.
- id: 93
  category: safe_driving_rules
  question: 'En una carretera de dos carriles (uno en cada dirección), debe detenerse
    ante un autobús escolar con luces rojas intermitentes y el brazo de parada extendido:'
  choices:
    A: Solo si está detrás del autobús
    B: Solo si se aproxima por delante
    C: Independientemente de la dirección en la que viaje
    D: Solo si hay niños cruzando
  answer: C
  explanation: En Arkansas, en una carretera de dos carriles, el tráfico en ambas
    direcciones debe detenerse ante un autobús escolar con luces rojas intermitentes
    y un brazo de parada extendido.
- id: 94
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección no controlada
    (sin señales ni semáforos), ¿qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a mayor velocidad
    D: El conductor en la carretera principal
  answer: B
  explanation: En Arkansas, cuando dos vehículos llegan a una intersección al mismo
    tiempo, el conductor de la izquierda debe ceder el paso al conductor de la derecha.
- id: 95
  category: defensive_driving
  question: Según el Manual del Conductor de Arkansas, ¿cuál es la distancia mínima
    de seguimiento recomendada detrás del vehículo que va delante de usted en condiciones
    ideales?
  choices:
    A: El largo de un vehículo
    B: Dos segundos
    C: Cuatro segundos
    D: Diez pies por cada 10 mph
  answer: B
  explanation: El Manual del Conductor de Arkansas recomienda usar la "regla de los
    dos segundos" para determinar una distancia de seguimiento segura en condiciones
    de conducción ideales.
- id: 96
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar en el último momento en Arkansas,
    ¿con cuánta anticipación debe observar la carretera?
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 30 segundos
  answer: C
  explanation: Las reglas de conducción de Arkansas establecen que debe mirar al menos
    15 segundos hacia adelante —aproximadamente una cuadra de la ciudad o un cuarto
    de milla en la autopista— para prepararse ante posibles peligros.
- id: 97
  category: defensive_driving
  question: En Arkansas, ¿a qué velocidad puede comenzar a ocurrir el hidroplaneo
    (pérdida de contacto de los neumáticos con la carretera) bajo lluvia intensa?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: Exactamente a 45 mph
    D: Solo cuando los neumáticos están desgastados
  answer: A
  explanation: Según el Manual del Conductor de Arkansas, el hidroplaneo puede comenzar
    a velocidades tan bajas como 35 mph, y a 50 mph, los neumáticos pueden perder
    todo contacto con la carretera.
- id: 98
  category: defensive_driving
  question: 'En Arkansas, debe usar las luces bajas (cortas) cuando siga a otro vehículo
    a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: El Manual del Conductor de Arkansas especifica que debe usar las luces
    bajas cuando siga a otro vehículo a menos de 200 pies.
- id: 99
  category: defensive_driving
  question: Al conducir con niebla densa en Arkansas, ¿qué ajuste de luces debe usar
    para mantener la mejor visibilidad?
  choices:
    A: Luces altas (largas)
    B: Luces bajas (cortas)
    C: Solo luces de estacionamiento
    D: Luces de emergencia (intermitentes)
  answer: B
  explanation: En condiciones de niebla, debe usar las luces bajas porque las luces
    altas se reflejan en la niebla y crean un resplandor que dificulta la visión.
- id: 100
  category: defensive_driving
  question: 'La ley "Move Over" (hacerse a un lado) de Arkansas exige que los conductores
    se muevan al carril más alejado de cuál de los siguientes vehículos estacionados:'
  choices:
    A: Solo patrullas de policía con luces intermitentes
    B: Solo ambulancias y camiones de bomberos
    C: Cualquier vehículo autorizado con luces intermitentes, incluyendo grúas y mantenimiento
      de carreteras
    D: Solo autobuses escolares
  answer: C
  explanation: La ley de Arkansas exige que los conductores se muevan a otro carril
    ante cualquier vehículo autorizado detenido en el arcén con sus luces intermitentes
    encendidas, incluyendo personal de emergencia, grúas y vehículos de mantenimiento
    de carreteras.
- id: 101
  category: defensive_driving
  question: 'Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS)
    y necesita detenerse rápidamente en una emergencia, usted debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Presionar el pedal del freno con fuerza y mantenerlo presionado
    C: Cambiar a neutral y usar el freno de emergencia
    D: Tocar ligeramente los frenos para evitar que se bloqueen
  answer: B
  explanation: Con el ABS, debe aplicar una presión constante y firme al pedal del
    freno. Bombear los frenos desactivará el sistema ABS.
- id: 102
  category: defensive_driving
  question: Durante una tormenta de lluvia en Arkansas, ¿cuándo suelen estar las carreteras
    más resbaladizas?
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Justo cuando empieza a llover
    C: Cuando la lluvia se convierte en un aguacero
    D: Después de que la lluvia ha parado y sale el sol
  answer: B
  explanation: Las carreteras están más resbaladizas justo cuando empieza a llover
    porque el agua se mezcla con el aceite y la grasa del pavimento que aún no se
    han lavado.
- id: 103
  category: defensive_driving
  question: 'Si su vehículo comienza a derrapar en una carretera resbaladiza de Arkansas,
    usted debe:'
  choices:
    A: Frenar con fuerza inmediatamente
    B: Girar el volante en la dirección opuesta al derrape
    C: No usar el freno y girar el volante en la dirección en la que la parte trasera
      del vehículo está derrapando
    D: Acelerar para recuperar la tracción
  answer: C
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que se desliza la parte trasera del automóvil
    (la dirección en la que desea que vaya la parte delantera del automóvil).
- id: 104
  category: defensive_driving
  question: 'Para revisar sus ''puntos ciegos'' antes de cambiar de carril en Arkansas,
    usted debe:'
  choices:
    A: Revisar su espejo retrovisor
    B: Revisar sus espejos laterales
    C: Girar la cabeza y mirar por encima del hombro
    D: Reducir la velocidad para que otros autos lo pasen
  answer: C
  explanation: Los espejos no lo muestran todo. Debe girar la cabeza y mirar por encima
    del hombro para asegurarse de que el carril esté despejado antes de moverse.
- id: 105
  category: defensive_driving
  question: 'Al acercarse a un cruce de ferrocarril en Arkansas con una señal de alto
    o semáforo, debe detener su vehículo a cuántos pies del riel más cercano:'
  choices:
    A: De 5 a 25 pies
    B: De 10 a 30 pies
    C: De 15 a 50 pies
    D: De 20 a 100 pies
  answer: C
  explanation: La ley de Arkansas exige que los conductores se detengan entre 15 y
    50 pies del riel más cercano en un cruce de ferrocarril cuando sea necesario detenerse.
- id: 106
  category: defensive_driving
  question: 'Para evitar frenazos de último minuto o la necesidad de girar repentinamente,
    la ley de Arkansas sugiere que debe mirar hacia adelante en la carretera al menos
    a qué distancia:'
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 30 segundos
  answer: C
  explanation: Las pautas de conducción defensiva de Arkansas establecen que debe
    mirar 15 segundos hacia adelante, lo que equivale aproximadamente a una cuadra
    en la ciudad o un cuarto de milla en la carretera.
- id: 107
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (hidroplaning),
    cuando los neumáticos se deslizan sobre una capa de agua, en las carreteras mojadas
    de Arkansas?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: Exactamente a 45 mph
    D: Solo cuando se usa el control de crucero
  answer: A
  explanation: El Manual del Conductor de Arkansas advierte que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph, y a 50 mph, los neumáticos pueden
    perder todo contacto con la carretera.
- id: 108
  category: defensive_driving
  question: 'En una carretera mojada, el Manual del Conductor de Arkansas sugiere
    que debe reducir su velocidad aproximadamente:'
  choices:
    A: 5 mph
    B: 10 mph
    C: 20 mph
    D: 30 mph
  answer: B
  explanation: El Manual del Conductor de Arkansas aconseja que en una carretera mojada,
    debe reducir su velocidad en aproximadamente 10 mph para mantener la tracción.
- id: 109
  category: defensive_driving
  question: Al conducir en carreteras de Arkansas cubiertas de nieve compactada, ¿cuánto
    debe reducir su velocidad?
  choices:
    A: Por 10 mph
    B: Por una cuarta parte
    C: A la mitad
    D: A 15 mph independientemente del límite
  answer: C
  explanation: Para mayor seguridad sobre nieve compactada, el Manual del Conductor
    de Arkansas recomienda reducir la velocidad a la mitad.
- id: 110
  category: defensive_driving
  question: 'Según la ley de Arkansas, al rebasar una bicicleta que viaja en la misma
    dirección, debe dejar una distancia de seguridad de al menos:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: El Código de Arkansas § 27-51-311 requiere que un automovilista deje
    una distancia segura al rebasar una bicicleta, la cual se define como al menos
    tres (3) pies.
- id: 111
  category: defensive_driving
  question: ¿A 50 mph, aproximadamente cuántos pies puede tomar reaccionar y detener
    su vehículo por completo en pavimento seco?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 600 pies
  answer: C
  explanation: El Manual del Conductor de Arkansas establece que a 50 mph, puede tomar
    unos 400 pies reaccionar y detenerse, lo cual es aproximadamente la longitud de
    una cuadra de la ciudad.
- id: 112
  category: defensive_driving
  question: 'Al estacionar su vehículo en una colina en Arkansas, si hay un bordillo
    (curb) y usted está mirando hacia arriba, debe girar sus ruedas:'
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: Hacia la derecha
  answer: B
  explanation: Al estacionar cuesta arriba contra un bordillo, debe girar las ruedas
    en dirección contraria al bordillo para que el vehículo ruede hacia este si los
    frenos fallan.
- id: 113
  category: defensive_driving
  question: 'Al entrar en un túnel en Arkansas, el manual del conductor recomienda
    que usted:'
  choices:
    A: Encienda las luces altas
    B: Encienda sus faros delanteros
    C: Aumente la velocidad para salir rápido
    D: Toque la bocina
  answer: B
  explanation: El Manual del Conductor de Arkansas aconseja a los conductores encender
    los faros al entrar en un túnel para ayudar a que sus ojos se ajusten a los niveles
    de luz más bajos y para que su vehículo sea visible para los demás.
- id: 114
  category: defensive_driving
  question: 'Si está a punto de ser golpeado por detrás mientras está detenido en
    una intersección de Arkansas, usted debe:'
  choices:
    A: Soltarse el cinturón de seguridad
    B: Poner el vehículo en punto muerto (neutral)
    C: Presionar su cabeza contra el reposacabezas y estar listo para aplicar los
      frenos
    D: Acelerar rápidamente hacia la intersección
  answer: C
  explanation: Las pautas de conducción defensiva de Arkansas sugieren que si está
    a punto de ser golpeado por detrás, debe presionar su cabeza contra el reposacabezas
    y estar listo para aplicar los frenos para no ser empujado contra otro vehículo.
- id: 115
  category: alcohol_drugs_health
  question: 'En Arkansas, se considera que está conduciendo ''Bajo la Influencia''
    (DWI) si su concentración de alcohol en sangre (BAC) es igual o superior a:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En Arkansas, es ilegal que cualquier persona de 21 años o más opere
    un vehículo motorizado con un BAC de 0.08% o superior.
- id: 116
  category: alcohol_drugs_health
  question: 'Según la ley de Arkansas, un conductor menor de 21 años puede ser arrestado
    por ''Conducir Bajo la Influencia Siendo Menor de Edad'' (DUI) con una concentración
    de alcohol en sangre (BAC) tan baja como:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Arkansas tiene una política de 'Tolerancia Cero' para menores. Los
    conductores menores de 21 años pueden ser condenados por DUI si su BAC es de 0.02%
    o superior.
- id: 117
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de 'Consentimiento Implícito' (Implied Consent)
    de Arkansas para los conductores?
  choices:
    A: Usted acepta que su vehículo sea registrado en cualquier momento.
    B: Usted acepta proporcionar su información de seguro a otros conductores.
    C: Al conducir por las carreteras de Arkansas, usted ha dado su consentimiento
      para una prueba química de alcohol o drogas.
    D: Usted acepta llevar un botiquín de primeros auxilios en su vehículo.
  answer: C
  explanation: La ley de Consentimiento Implícito significa que al operar un vehículo
    en Arkansas, se considera que usted ha dado su consentimiento para una prueba
    de aliento, sangre u orina si un oficial sospecha que está bajo los efectos del
    alcohol o drogas.
- id: 118
  category: alcohol_drugs_health
  question: 'Si se niega a someterse a una prueba química de alcohol o drogas en Arkansas
    por primera vez, sus privilegios de conducir serán suspendidos por:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Según la ley de Arkansas, la primera vez que se niegue a someterse
    a una prueba química bajo la ley de Consentimiento Implícito, su licencia será
    suspendida por 180 días.
- id: 119
  category: alcohol_drugs_health
  question: Para una condena por primera ofensa de DWI en Arkansas, ¿cuál es el período
    mínimo de tiempo en la cárcel que se puede ordenar?
  choices:
    A: Sin tiempo en la cárcel, solo una multa
    B: 24 horas
    C: 72 horas
    D: 1 semana
  answer: B
  explanation: Una condena por primera ofensa de DWI en Arkansas conlleva una sentencia
    de cárcel que va desde 24 horas hasta un año, aunque el tribunal puede ordenar
    servicio público en lugar de la cárcel.
- id: 120
  category: alcohol_drugs_health
  question: ¿Cuál es el rango de multas por una condena por primera ofensa de DWI
    en Arkansas (excluyendo los costos judiciales)?
  choices:
    A: Entre $50 y $250
    B: Entre $150 y $1,000
    C: Entre $500 y $2,500
    D: Entre $1,000 y $5,000
  answer: B
  explanation: En Arkansas, una condena por primera ofensa de DWI resulta en una multa
    de no menos de $150 y no más de $1,000, más los costos judiciales.
- id: 121
  category: alcohol_drugs_health
  question: 'Para un conductor menor de 21 años, una primera infracción de "DUI para
    menores de edad" (0.02% - 0.08% de BAC) resulta en una suspensión de la licencia
    de:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Una primera infracción de DUI para menores de edad (para personas menores
    de 21 años con un BAC entre 0.02% y 0.08%) resulta en una suspensión de la licencia
    de 90 días.
- id: 122
  category: alcohol_drugs_health
  question: 'La ley de Arkansas prohíbe la posesión de un recipiente de bebida alcohólica
    abierto en:'
  choices:
    A: El maletero de un vehículo
    B: El área de pasajeros de un vehículo motorizado en una vía pública
    C: Una guantera con llave
    D: La caja de una camioneta pickup si está fuera del alcance
  answer: B
  explanation: La ley de recipientes abiertos de Arkansas establece que es ilegal
    poseer un recipiente de bebida alcohólica abierto en el área de pasajeros de un
    vehículo motorizado mientras se encuentra en una vía pública o en el derecho de
    paso de una vía pública.
- id: 123
  category: alcohol_drugs_health
  question: ¿Según el Manual del Conductor de Arkansas, cuánto tiempo le toma al cuerpo
    eliminar el alcohol contenido en una bebida típica?
  choices:
    A: Aproximadamente 30 minutos
    B: Aproximadamente 1 hora
    C: Aproximadamente 2 horas
    D: Aproximadamente 3 horas
  answer: B
  explanation: En promedio, el cuerpo tarda aproximadamente una hora en procesar y
    eliminar el alcohol de una bebida estándar (12 oz de cerveza, 5 oz de vino o 1.5
    oz de licor fuerte).
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de mezclar alcohol con otras drogas, como medicamentos
    recetados o de venta libre?
  choices:
    A: Las drogas anulan el alcohol.
    B: El alcohol anula las drogas.
    C: Puede multiplicar los efectos de ambos, aumentando enormemente el deterioro.
    D: No hay efecto si el medicamento es legal.
  answer: C
  explanation: Mezclar alcohol y drogas puede causar un efecto sinérgico, lo que significa
    que el impacto combinado en su capacidad de conducción es mucho mayor que los
    efectos de cualquiera de las sustancias por sí sola.
- id: 125
  category: alcohol_drugs_health
  question: En Arkansas, ¿puede ser acusado de un DWI por conducir bajo la influencia
    de medicamentos recetados legales?
  choices:
    A: No, siempre que tenga una receta válida.
    B: No, el DWI solo se aplica al alcohol y narcóticos ilegales.
    C: Sí, si el medicamento lo deja "intoxicado" o afecta su capacidad para conducir
      de manera segura.
    D: Sí, pero solo si también está bebiendo alcohol.
  answer: C
  explanation: La ley de Arkansas define "intoxicado" como estar bajo la influencia
    del alcohol, una sustancia controlada o cualquier otra sustancia que afecte sus
    reacciones y habilidades motoras. Esto incluye medicamentos legales recetados
    y de venta libre.
- id: 126
  category: alcohol_drugs_health
  question: 'Para recuperar los privilegios de conducción después de una suspensión
    por DWI en Arkansas, se le puede requerir a un conductor que instale un Dispositivo
    de Interbloqueo de Encendido (IID). Este dispositivo:'
  choices:
    A: Registra la velocidad del vehículo en todo momento.
    B: Evita que el automóvil arranque si el conductor tiene alcohol en su aliento.
    C: Llama automáticamente a la policía si el conductor se desvía bruscamente.
    D: Limita la velocidad máxima del vehículo a 35 mph.
  answer: B
  explanation: Un Dispositivo de Interbloqueo de Encendido (IID) es un alcoholímetro
    conectado al sistema de encendido de un vehículo que evita que el motor arranque
    si detecta un BAC por encima de un límite bajo preestablecido.
- id: 127
  category: alcohol_drugs_health
  question: 'Por ley, los conductores de Arkansas deben informar cualquier condición
    médica que pueda afectar su capacidad para conducir de manera segura a:'
  choices:
    A: Su departamento de policía local
    B: El Departamento de Salud de Arkansas
    C: La Oficina de Servicios al Conductor (Office of Driver Services)
    D: La Oficina del Gobernador
  answer: C
  explanation: Los conductores deben informar las condiciones médicas (como epilepsia,
    pérdida de la visión u otros impedimentos) a la Oficina de Servicios al Conductor
    para garantizar que puedan operar un vehículo motorizado de manera segura.
- id: 128
  category: alcohol_drugs_health
  question: 'Para una primera condena por DWI en Arkansas, la multa ordenada por el
    tribunal puede oscilar entre:'
  choices:
    A: $50 a $250
    B: $150 a $1,000
    C: $500 a $2,500
    D: $1,000 a $5,000
  answer: B
  explanation: El Manual del Conductor de Arkansas establece que una primera condena
    por DWI conlleva una multa que oscila entre $150 y $1,000, además de las costas
    procesales.
- id: 129
  category: alcohol_drugs_health
  question: 'Una primera condena por DWI en Arkansas puede resultar en una sentencia
    de cárcel de:'
  choices:
    A: 24 horas a 1 año
    B: 10 días a 6 meses
    C: 1 mes a 2 años
    D: No es posible una pena de cárcel por una primera infracción
  answer: A
  explanation: En Arkansas, una primera condena por DWI puede llevar a una pena de
    prisión por un período de 24 horas a un año.
- id: 130
  category: alcohol_drugs_health
  question: 'Si un conductor menor de 21 años es condenado por DUI para menores de
    edad por primera vez en Arkansas, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Para una primera infracción de DUI para menores de edad (0.02% a 0.07%
    de BAC), la licencia del conductor será suspendida por 90 días.
- id: 131
  category: alcohol_drugs_health
  question: En Arkansas, ¿por cuánto tiempo como mínimo se le puede exigir a una persona
    condenada por DWI que instale un Dispositivo de Interbloqueo de Encendido (IID)
    por una primera infracción?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: La ley de Arkansas exige que una persona condenada por DWI instale
    un Dispositivo de Interbloqueo de Encendido (IID) durante al menos un año para
    poder obtener privilegios de conducción restringidos.
- id: 132
  category: alcohol_drugs_health
  question: 'Cuando el alcohol se combina con otras drogas, como tranquilizantes o
    medicamentos para el resfriado, el efecto en la capacidad de conducción es:'
  choices:
    A: Reducido porque las drogas se anulan entre sí.
    B: El mismo que beber alcohol solo.
    C: Multiplicado, haciendo que el conductor esté mucho más afectado que con cualquiera
      de las sustancias por separado.
    D: Solo peligroso si las drogas son ilegales.
  answer: C
  explanation: Combinar alcohol con otras drogas crea un efecto sinérgico, lo que
    significa que el impacto combinado es mucho mayor y más peligroso que los efectos
    de cada sustancia individualmente.
- id: 133
  category: alcohol_drugs_health
  question: ¿Qué prohíbe la ley de "Contenedor Abierto" (Open Container) de Arkansas?
  choices:
    A: Tener cualquier contenedor de bebida alcohólica abierto en el área de pasajeros
      de un vehículo motorizado.
    B: Llevar alcohol sin abrir en el maletero de un automóvil.
    C: Transportar alcohol en una bolsa de supermercado en el asiento trasero.
    D: Beber cerveza sin alcohol mientras se conduce.
  answer: A
  explanation: Es ilegal en Arkansas poseer un contenedor abierto de alcohol en el
    área de pasajeros de un vehículo motorizado mientras se circula por una vía pública.
- id: 134
  category: alcohol_drugs_health
  question: 'Además de la suspensión de la licencia y las multas, un conductor de
    Arkansas menor de 21 años condenado por DUI para menores de edad (Underage DUI)
    también debe:'
  choices:
    A: Pagar una sanción civil de $5,000.
    B: Completar una presentación de impacto en las víctimas y trabajo de servicio
      comunitario.
    C: Entregar su vehículo al estado.
    D: Esperar hasta los 25 años para solicitar una licencia sin restricciones.
  answer: B
  explanation: Según la ley de Arkansas, los menores condenados por DUI deben realizar
    trabajos de servicio comunitario y asistir a un programa de impacto en las víctimas.
- id: 135
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma efectiva de "recuperar la sobriedad"
    antes de conducir después de consumir alcohol?
  choices:
    A: Beber varias tazas de café negro cargado.
    B: Tomar una ducha muy fría.
    C: Hacer ejercicio o correr para sudar el alcohol.
    D: Darle tiempo al cuerpo para procesar el alcohol.
  answer: D
  explanation: El tiempo es lo único que le permitirá recuperar la sobriedad. El café,
    las duchas y el ejercicio no aceleran la eliminación del alcohol del torrente
    sanguíneo.
- id: 136
  category: alcohol_drugs_health
  question: 'Si un conductor de Arkansas es condenado por una segunda infracción de
    DWI dentro de los cinco años posteriores a la primera, el período de suspensión
    de la licencia es de:'
  choices:
    A: 180 días
    B: 1 año
    C: 24 meses
    D: Revocación permanente
  answer: C
  explanation: Por una segunda infracción de DWI dentro de un período de cinco años
    en Arkansas, la licencia del conductor será suspendida por 24 meses.
- id: 137
  category: penalties_and_points
  question: Según la ley de Arkansas, ¿cuántos puntos se sumarán al historial de conducción
    de un conductor que es condenado por "Conducción Temeraria" (Reckless Driving)?
  choices:
    A: 3 puntos
    B: 5 puntos
    C: 8 puntos
    D: 14 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción grave en Arkansas
    y conlleva una penalización de 8 puntos en el historial de conducción del infractor.
- id: 138
  category: penalties_and_points
  question: Según la Ley de Consentimiento Implícito (Implied Consent Law) de Arkansas,
    si se niega a realizar una prueba química de alcohol o drogas, ¿por cuánto tiempo
    se suspenderá su licencia por una primera infracción?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Al conducir por las carreteras de Arkansas, usted acepta someterse
    a pruebas químicas. Una primera negativa resulta en una suspensión administrativa
    de la licencia de 180 días.
- id: 139
  category: penalties_and_points
  question: Si es condenado por rebasar ilegalmente un autobús escolar detenido con
    sus luces rojas intermitentes en Arkansas, ¿por cuánto tiempo se suspenderá su
    licencia de conducir por una primera infracción?
  choices:
    A: 7 días
    B: 21 días
    C: 60 días
    D: 6 meses
  answer: B
  explanation: La ley de Arkansas (Ley de Isaac) exige una suspensión de la licencia
    de conducir de 21 días por una primera infracción de rebasar ilegalmente un autobús
    escolar detenido.
- id: 140
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan en un historial de conducción de Arkansas por
    "Abandonar la escena de un accidente" que involucre únicamente daños a la propiedad?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 10 puntos
    D: Automatic Revocation
  answer: B
  explanation: Abandonar la escena de un accidente que involucre daños a la propiedad
    resulta en la asignación de 6 puntos en su historial de conducción de Arkansas.
- id: 141
  category: penalties_and_points
  question: ¿Por cuánto tiempo se suspenderá la licencia de un conductor menor de
    21 años condenado por su primer DUI para menores (BAC de 0.02% o superior)?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: B
  explanation: Una condena por primera ofensa de DUI para menores en Arkansas resulta
    en una suspensión de la licencia de 90 días.
- id: 142
  category: penalties_and_points
  question: 'No ceder el paso o no apartarse para un vehículo de emergencia con luces
    intermitentes (Ley de Apartarse o Move Over Law) en Arkansas puede resultar en
    una multa de hasta:'
  choices:
    A: Hasta $100
    B: Hasta $250
    C: Hasta $500
    D: Hasta $1,000
  answer: C
  explanation: Violar la Ley de Apartarse (Move Over Law) de Arkansas puede resultar
    en una multa de hasta $500, tiempo en la cárcel, o ambos.
- id: 143
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden al historial de conducción de Arkansas por 'Seguir
    demasiado de cerca' (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Seguir demasiado de cerca es una infracción de 3 puntos bajo el sistema
    de puntos de los Servicios al Conductor de Arkansas.
- id: 144
  category: penalties_and_points
  question: En Arkansas, ¿por cuánto tiempo permanecen vigentes los puntos asignados
    a su historial de conducción desde la fecha de la infracción?
  choices:
    A: 12 meses
    B: 24 meses
    C: 36 meses
    D: 60 meses
  answer: C
  explanation: La Oficina de Servicios al Conductor de Arkansas rastrea los puntos
    durante un período de 36 meses (3 años) para determinar las suspensiones de licencias.
- id: 145
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una condena de DWI (Conducir bajo los efectos
    del alcohol o estupefacientes) por primera vez para un conductor adulto en Arkansas?
  choices:
    A: Sin multa mínima
    B: $150
    C: $500
    D: $1,000
  answer: B
  explanation: Para un DWI por primera vez en Arkansas, la multa oscila entre un mínimo
    de $150 y un máximo de $1,000, más los costos judiciales.
- id: 146
  category: penalties_and_points
  question: 'Para un conductor menor de 21 años, la ley de ''Tolerancia Cero'' de
    Arkansas establece el límite de contenido de alcohol en sangre (BAC) en:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Arkansas tiene una ley de 'Tolerancia Cero' para menores. Si un conductor
    menor de 21 años tiene un BAC de 0.02% o superior, puede ser arrestado por DUI.
- id: 147
  category: penalties_and_points
  question: En Arkansas, ¿cuál es la sanción por rebasar un autobús escolar detenido
    mientras sus luces rojas parpadean y el brazo de parada está extendido?
  choices:
    A: Una multa de $50 a $100
    B: Una multa de $250 a $1,000 y/o hasta 90 días de cárcel
    C: Una advertencia verbal por la primera ofensa
    D: Una revocación obligatoria de la licencia por 2 años
  answer: B
  explanation: Rebasar un autobús escolar detenido es una infracción grave en Arkansas.
    Una condena puede conllevar una multa de entre $250 y $1,000, y/o hasta 90 días
    de cárcel.
- id: 148
  category: penalties_and_points
  question: 'Al exceder el límite de velocidad en una zona de obras viales en Arkansas
    mientras hay trabajadores presentes, las multas se:'
  choices:
    A: Reducen a la mitad
    B: Son las mismas que las multas normales por exceso de velocidad
    C: Duplican
    D: Triplican
  answer: C
  explanation: La ley de Arkansas exige que las multas por infracciones de tránsito,
    incluido el exceso de velocidad, se dupliquen cuando se cometen en una zona de
    obras viales mientras hay trabajadores presentes.
- id: 149
  category: penalties_and_points
  question: ¿Cuál es el valor de puntos asignado por exceder el límite de velocidad
    en 15 millas por hora o más sobre el límite establecido en Arkansas?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 8 puntos
  answer: C
  explanation: En el sistema de puntos de Arkansas, exceder el límite de velocidad
    en 15 mph o más resulta en la adición de 5 puntos a su historial de conducción.
- id: 150
  category: penalties_and_points
  question: 'En Arkansas, no ceder el paso a un vehículo de emergencia (violar la
    ley de ''Apartarse'' o ''Move Over'') puede resultar en una multa de hasta:'
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: B
  explanation: Violar la ley de 'Apartarse' (Move Over) de Arkansas, que exige que
    los conductores se muevan al carril más alejado o reduzcan la velocidad ante vehículos
    de emergencia, puede resultar en una multa de hasta $500 y/o tiempo en la cárcel.
- id: 151
  category: penalties_and_points
  question: 'Un conductor de Arkansas que acumule 24 puntos o más en un periodo de
    36 meses tendrá su licencia suspendida por:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Permanentemente
  answer: B
  explanation: El nivel más alto del sistema de puntos de Arkansas activa una suspensión
    de 1 año (12 meses) para los conductores que alcancen 24 puntos o más.
- id: 152
  category: sharing_the_road
  question: 'En Arkansas, NO es obligatorio detenerse ante un autobús escolar con
    luces rojas intermitentes si usted viaja en la dirección opuesta en una carretera
    que está dividida por:'
  choices:
    A: Una línea amarilla discontinua
    B: Una zona verde o una franja central (mediana) de 20 pies de ancho o más
    C: Una línea amarilla doble continua
    D: Un carril central compartido para girar
  answer: B
  explanation: La ley de Arkansas establece que no es necesario detenerse ante un
    autobús escolar si se viaja en la dirección opuesta en una carretera de varios
    carriles dividida por una zona verde o franja central de 20 pies o más.
- id: 153
  category: sharing_the_road
  question: 'Bajo la ley de ''Hacerse a un lado'' (Move Over) de Arkansas, al acercarse
    a un vehículo de emergencia estacionado con luces intermitentes, usted debe:'
  choices:
    A: Mantener la velocidad pero tocar la bocina
    B: Cambiarse al carril más alejado del vehículo si es seguro hacerlo
    C: Detenerse inmediatamente en su carril
    D: Aumentar la velocidad para pasar el vehículo rápidamente
  answer: B
  explanation: La ley de Arkansas exige que los conductores se muevan al carril más
    alejado de un vehículo de emergencia estacionado, o que reduzcan la velocidad
    y mantengan una velocidad segura si no es posible cambiar de carril.
- id: 154
  category: sharing_the_road
  question: 'En Arkansas, si se le declara culpable de rebasar a un autobús escolar
    detenido con sus luces rojas intermitentes, puede ser multado con hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Bajo la ley de Arkansas (Ley de Isaac), la multa por una primera infracción
    de rebasar a un autobús escolar detenido puede oscilar entre $250 y $1,000, y
    puede incluir tiempo en la cárcel.
- id: 155
  category: sharing_the_road
  question: 'Al conducir cerca de un camión comercial grande, las ''Zonas Prohibidas''
    (No-Zones) se refieren a:'
  choices:
    A: Áreas donde no se permite conducir camiones
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: Los tanques de combustible del camión
    D: Zonas de velocidad restringida para vehículos pesados
  answer: B
  explanation: El Manual del Conductor de Arkansas define las 'No-Zones' como los
    grandes puntos ciegos alrededor de un camión donde el conductor no puede ver su
    vehículo.
- id: 156
  category: sharing_the_road
  question: 'En Arkansas, cuando un vehículo de emergencia con sirenas y luces intermitentes
    se aproxima por detrás, usted debe:'
  choices:
    A: Detenerse en su carril actual inmediatamente
    B: Hacerse a la orilla derecha de la carretera y detenerse
    C: Aumentar la velocidad para mantenerse delante de él
    D: Hacerse al arcén izquierdo
  answer: B
  explanation: Cuando un vehículo de emergencia se aproxima con luces y sirenas, la
    ley de Arkansas exige que se mueva hacia el borde derecho de la carretera y se
    detenga hasta que haya pasado.
- id: 157
  category: sharing_the_road
  question: 'Al seguir a una motocicleta en Arkansas, debe permitir una distancia
    de seguimiento de al menos:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 4 a 6 segundos
    D: 10 segundos
  answer: C
  explanation: El Manual del Conductor de Arkansas recomienda una distancia de seguimiento
    de 4 a 6 segundos cuando se está detrás de una motocicleta para permitir maniobras
    o paradas repentinas.
- id: 158
  category: sharing_the_road
  question: 'En Arkansas, al acercarse a un cruce de ferrocarril con una barrera que
    baja o señales intermitentes, debe detener su vehículo a una distancia de:'
  choices:
    A: 5 a 10 pies de las vías
    B: 15 a 50 pies de las vías
    C: 50 a 100 pies de las vías
    D: Exactamente 20 pies de las vías
  answer: B
  explanation: La ley de Arkansas exige que los conductores se detengan entre 15 y
    50 pies del riel más cercano de un cruce de ferrocarril cuando las señales indican
    que se aproxima un tren.
- id: 159
  category: sharing_the_road
  question: 'Cuando un ciclista circula por una carretera de Arkansas, generalmente
    se le exige:'
  choices:
    A: Circular en sentido contrario al tráfico
    B: Circular únicamente por la acera
    C: Seguir las mismas reglas de tránsito que los vehículos motorizados
    D: Circular siempre por el centro del carril
  answer: C
  explanation: En Arkansas, los ciclistas tienen los mismos derechos y responsabilidades
    que los conductores de vehículos motorizados y deben seguir las mismas leyes de
    tránsito.
- id: 160
  category: sharing_the_road
  question: 'En Arkansas, si ve a un peatón con un bastón blanco o un perro guía en
    una intersección, usted debe:'
  choices:
    A: Tocar la bocina para avisarles que está allí
    B: Ceder el derecho de paso y detenerse si es necesario
    C: Conducir alrededor de ellos lentamente
    D: Esperar a que le hagan una señal para pasar
  answer: B
  explanation: La ley de Arkansas exige que los conductores cedan el derecho de paso
    a los peatones ciegos o con discapacidad visual que utilicen un bastón blanco
    o un perro guía.
- id: 161
  category: sharing_the_road
  question: 'Cuando un camión grande está girando a la derecha en una calle con dos
    carriles en cada dirección, el conductor del camión puede necesitar:'
  choices:
    A: Permanecer estrictamente en el carril derecho
    B: Abrirse hacia la izquierda para no golpear el bordillo
    C: Acelerar para completar el giro
    D: Girar únicamente desde el carril izquierdo
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha sin que el remolque golpee el bordillo u otros
    objetos.
- id: 162
  category: sharing_the_road
  question: 'La ley de Arkansas exige que cualquier bicicleta utilizada por la noche
    debe estar equipada con una luz en la parte delantera que emita una luz blanca
    visible desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Código de Arkansas § 27-36-220 exige que las bicicletas que circulen
    de noche tengan una luz blanca delantera visible desde 500 pies y un reflector
    o luz roja trasera visible desde 500 pies.
- id: 163
  category: sharing_the_road
  question: En Arkansas, cuando un autobús escolar se detiene en una carretera de
    varios carriles con sus luces rojas intermitentes y el brazo de parada extendido,
    ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: El tráfico en todos los carriles debe detenerse independientemente de si hay
      una mediana.
    B: El tráfico en todos los carriles debe detenerse a menos que la carretera esté
      dividida por un parque central o mediana.
    C: Solo el tráfico que sigue al autobús debe detenerse.
    D: El tráfico en la dirección opuesta nunca tiene que detenerse en una carretera
      de varios carriles.
  answer: B
  explanation: Según el Manual del Conductor de Arkansas, usted no tiene que detenerse
    si viaja en la dirección opuesta a un autobús escolar en una carretera de varios
    carriles si la carretera está dividida por un parque central o mediana.
- id: 164
  category: sharing_the_road
  question: Bajo la ley de Arkansas (Ley 637), ¿cuál es la distancia mínima que un
    automovilista debe mantener al rebasar y adelantar a una bicicleta que circula
    en la misma dirección?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Arkansas exige que los automovilistas mantengan una distancia
    de al menos tres (3) pies al adelantar a una bicicleta.
- id: 165
  category: sharing_the_road
  question: En Arkansas, ¿qué debe hacer un conductor al acercarse a un peatón que
    lleva un bastón blanco o utiliza un perro guía?
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Ceder el paso y tomar precauciones para evitar lesiones
    C: Rodearlo lentamente si no está en un cruce peatonal
    D: Solo detenerse si el peatón está en una zona escolar marcada
  answer: B
  explanation: La ley de Arkansas exige que los conductores cedan el paso a cualquier
    peatón que sea ciego o tenga una discapacidad visual y que lleve un bastón blanco
    o utilice un perro guía.
- id: 166
  category: sharing_the_road
  question: 'De acuerdo con la Ley 650 de Arkansas (la ley de ''Parada de Seguridad''
    o ''Safety Stop''), una persona que opera una bicicleta puede tratar una señal
    de alto (STOP) como una:'
  choices:
    A: Señal de ceda el paso
    B: Luz verde
    C: Parada obligatoria de 3 segundos
    D: Zona de no detenerse
  answer: A
  explanation: La Ley 650 de Arkansas permite a los ciclistas tratar las señales de
    alto como señales de ceda el paso, lo que significa que deben reducir la velocidad
    y detenerse si es necesario por seguridad, pero pueden continuar sin detenerse
    por completo si el camino está despejado.
- id: 167
  category: sharing_the_road
  question: En Arkansas, ¿quién está legalmente obligado a usar un casco mientras
    opera o viaja en una motocicleta?
  choices:
    A: Todos los conductores independientemente de su edad
    B: Solo los conductores menores de 18 años
    C: Solo los conductores menores de 21 años
    D: Solo el operador, no el pasajero
  answer: C
  explanation: La ley de Arkansas exige que todos los operadores y pasajeros de motocicletas
    menores de 21 años usen casco.
- id: 168
  category: sharing_the_road
  question: Al compartir la carretera con camiones grandes, ¿qué es la 'Zona-No' (No-Zone)?
  choices:
    A: El área donde los camiones no tienen permitido circular
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: El carril directamente a la izquierda del camión
    D: El área dentro de los 50 pies de un cruce de ferrocarril
  answer: B
  explanation: La 'Zona-No' se refiere a los grandes puntos ciegos alrededor de un
    camión donde el conductor no puede ver a otros vehículos. Si no puede ver la cara
    del conductor del camión en sus espejos laterales, él no puede verlo a usted.
- id: 169
  category: sharing_the_road
  question: 'Al adelantar a un camión de remolque grande, no debe reincorporarse al
    carril delante del camión hasta que pueda ver:'
  choices:
    A: La parte superior de la cabina del camión en su espejo lateral
    B: Los faros delanteros del camión en su espejo retrovisor
    C: La señal de giro del camión
    D: La cara del conductor en su espejo lateral
  answer: B
  explanation: Para asegurar que haya suficiente espacio al adelantar a un camión
    grande, no regrese al carril hasta que pueda ver toda la parte delantera del camión
    (ambos faros) en su espejo retrovisor.
- id: 170
  category: sharing_the_road
  question: 'En Arkansas, si usted está girando en una intersección y un peatón está
    cruzando la calle hacia la que usted está girando, usted debe:'
  choices:
    A: Tocar la bocina para advertirle y continuar
    B: Esperar a que el peatón termine de cruzar
    C: Girar rápidamente antes de que llegue a su carril
    D: Solo detenerse si hay un cruce peatonal marcado
  answer: B
  explanation: Los conductores deben ceder el paso a los peatones que cruzan la calle,
    incluso si no hay cruces peatonales marcados o señales.
- id: 171
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima a la que debe detener su vehículo del riel
    más cercano de un cruce de ferrocarril cuando se aproxima un tren?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 25 pies
  answer: C
  explanation: La ley de Arkansas exige que los vehículos se detengan a una distancia
    de entre 15 y 50 pies del riel más cercano de un cruce de ferrocarril cuando una
    señal está parpadeando o se aproxima un tren.
- id: 172
  category: sharing_the_road
  question: 'Según la ley de Arkansas, las bicicletas se consideran:'
  choices:
    A: Peatones
    B: Vehículos motorizados
    C: Vehículos con los mismos derechos y responsabilidades que los vehículos motorizados
    D: Molestias que deben permanecer en la acera
  answer: C
  explanation: En Arkansas, las bicicletas tienen los mismos derechos y responsabilidades
    que los conductores de vehículos motorizados y deben seguir las mismas reglas
    de tránsito.
- id: 173
  category: sharing_the_road
  question: 'Si es condenado por una segunda infracción de rebasar un autobús escolar
    detenido en Arkansas dentro de un periodo de 5 años, su licencia de conducir será
    suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: D
  explanation: Según la ley de Arkansas, una segunda infracción por rebasar ilegalmente
    un autobús escolar dentro de un periodo de cinco años resulta en una suspensión
    obligatoria de la licencia de conducir por seis (6) meses.
- id: 174
  category: vehicle_information
  question: De acuerdo con la ley de Arkansas, ¿cuándo deben los automovilistas encender
    sus faros delanteros en relación con las condiciones climáticas?
  choices:
    A: Solo cuando la visibilidad es inferior a 200 pies
    B: Solo durante aguaceros intensos
    C: Siempre que los limpiaparabrisas estén en uso
    D: Solo después del atardecer
  answer: C
  explanation: El Código de Arkansas § 27-36-204 exige que los faros delanteros se
    enciendan en cualquier momento en que los limpiaparabrisas estén en uso debido
    a la lluvia, el aguanieve o la nieve.
- id: 175
  category: vehicle_information
  question: En Arkansas, ¿entre qué horarios específicos deben estar encendidos los
    faros delanteros de su vehículo?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde 30 minutos después del atardecer hasta 30 minutos antes del amanecer
    C: Desde 1 hora después del atardecer hasta 1 hora antes del amanecer
    D: Solo cuando está lo suficientemente oscuro como para no poder ver a 1,000 pies
      de distancia
  answer: B
  explanation: La ley de Arkansas exige que los faros delanteros se enciendan desde
    media hora después del atardecer hasta media hora antes del amanecer, o cuando
    la visibilidad sea inferior a 500 pies.
- id: 176
  category: vehicle_information
  question: 'Según la ley de Arkansas, un neumático se considera inseguro si la profundidad
    de la banda de rodadura es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/16 de pulgada
  answer: B
  explanation: La ley de Arkansas y las normas de seguridad especifican que los neumáticos
    son inseguros si tienen menos de 2/32 de pulgada de profundidad en la banda de
    rodadura.
- id: 177
  category: vehicle_information
  question: Para un vehículo de pasajeros en Arkansas, ¿cuál es la transmisión de
    luz mínima legal permitida para el polarizado no original (aftermarket) en las
    ventanas laterales delanteras?
  choices:
    A: 20%
    B: 25%
    C: 35%
    D: 50%
  answer: B
  explanation: El Código de Arkansas § 27-37-306 especifica que el polarizado no original
    (aftermarket) en las ventanas laterales delanteras debe permitir al menos un 25%
    de transmisión de luz.
- id: 178
  category: vehicle_information
  question: 'En Arkansas, el polarizado de ventanas no original (aftermarket) en el
    parabrisas solo está permitido:'
  choices:
    A: Si cubre todo el parabrisas y permite el 70% de luz
    B: A lo largo de las 5 pulgadas superiores del parabrisas
    C: Si el conductor tiene una nota del médico para cualquier parte del vidrio
    D: Está estrictamente prohibido en cualquier parte del parabrisas
  answer: B
  explanation: La ley de Arkansas permite el polarizado en el parabrisas solo a lo
    largo de las cinco pulgadas superiores (la línea AS-1), siempre que permita al
    menos un 25% de transmisión de luz.
- id: 179
  category: vehicle_information
  question: 'La ley de Arkansas exige que la placa de matrícula trasera esté iluminada
    por una luz blanca que haga que la placa sea claramente legible desde una distancia
    de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El Código de Arkansas § 27-36-215 exige que una luz trasera o una lámpara
    separada ilumine la placa de matrícula trasera para que sea visible desde 50 pies
    hacia atrás.
- id: 180
  category: vehicle_information
  question: 'Todo vehículo motorizado que circule por las autopistas de Arkansas debe
    estar equipado con una bocina que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El Código de Arkansas § 27-37-202 exige que todo vehículo motorizado
    esté equipado con una bocina en buen estado de funcionamiento capaz de emitir
    un sonido audible en condiciones normales desde una distancia no inferior a 200
    pies.
- id: 181
  category: vehicle_information
  question: 'En Arkansas, el freno de servicio (freno de pie) debe ser capaz de detener
    un vehículo de pasajeros que viaja a 20 mph dentro de una distancia de:'
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 40 pies
  answer: C
  explanation: El Código de Arkansas § 27-37-201 exige que los frenos de servicio
    de un vehículo de pasajeros puedan detener el vehículo en un tramo de 30 pies
    cuando viaja a 20 mph.
- id: 182
  category: vehicle_information
  question: 'La ley de Arkansas exige que todo vehículo motorizado esté equipado con
    un espejo que refleje una vista de la carretera por una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El Código de Arkansas § 27-37-305 exige que los vehículos tengan un
    espejo ubicado para reflejar al conductor una vista de la carretera por una distancia
    de al menos 200 pies hacia atrás.
- id: 183
  category: vehicle_information
  question: 'Bajo la Ley de Protección de Niños Pasajeros de Arkansas, un niño debe
    estar debidamente asegurado en un asiento de seguridad infantil apropiado si:'
  choices:
    A: Es menor de 5 años y pesa menos de 50 libras
    B: Es menor de 6 años y pesa menos de 60 libras
    C: Es menor de 8 años y pesa menos de 80 libras
    D: Es menor de 4 años independientemente de su peso
  answer: B
  explanation: El Código de Arkansas § 27-34-104 exige que los niños menores de 6
    años y que pesen menos de 60 libras estén sujetos en un sistema de asiento de
    seguridad para niños pasajeros.
- id: 184
  category: vehicle_information
  question: 'En Arkansas, las luces de las señales de giro deben ser visibles desde
    una distancia no menor a:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: El Código de Arkansas § 27-36-216 establece que las luces de señalización
    deben ser visibles y comprensibles tanto de día como de noche desde una distancia
    de 100 pies.
- id: 185
  category: vehicle_information
  question: ¿Cuál de los siguientes está PROHIBIDO en un vehículo de pasajeros estándar
    que no sea de emergencia en Arkansas?
  choices:
    A: Una luz roja visible desde la parte delantera del vehículo
    B: Una luz blanca que ilumine la placa de matrícula
    C: Señales de giro de color ámbar en la parte trasera
    D: Una tercera luz de freno en la ventana trasera
  answer: A
  explanation: El Código de Arkansas § 27-36-208 prohíbe que cualquier persona conduzca
    o mueva un vehículo con cualquier lámpara o dispositivo que muestre una luz roja
    visible directamente desde el frente del centro del mismo, a menos que sea un
    vehículo de emergencia autorizado.
- id: 186
  category: vehicle_information
  question: 'La ley de Arkansas con respecto a los sistemas de escape de los vehículos
    establece que:'
  choices:
    A: Los silenciadores son opcionales si el vehículo tiene 25 años o más
    B: Los recortes o derivaciones (bypasses) del silenciador están permitidos en
      carreteras rurales
    C: Todo vehículo debe tener un silenciador en buen estado de funcionamiento para
      evitar ruidos excesivos
    D: Los sistemas de escape pueden modificarse para aumentar el ruido del motor
      por seguridad
  answer: C
  explanation: El Código de Arkansas § 27-37-201 exige que todo vehículo motorizado
    esté equipado con un silenciador en buen estado de funcionamiento para evitar
    ruidos y humos excesivos o inusuales; los recortes y derivaciones están prohibidos.
- id: 187
  category: vehicle_information
  question: Bajo la ley de Arkansas (Ley 560 de 1991), ¿cuál es la 'transmisión neta
    de luz' mínima permitida para el polarizado de las ventanas laterales delanteras?
  choices:
    A: 10%
    B: 25%
    C: 35%
    D: 50%
  answer: B
  explanation: La ley de Arkansas exige que las ventanas laterales delanteras (a la
    izquierda y derecha del conductor) deben permitir al menos un 25% de transmisión
    neta de luz.
- id: 188
  category: vehicle_information
  question: Para los automóviles de pasajeros en Arkansas, ¿cuál es la transmisión
    de luz mínima permitida para las ventanas laterales traseras y la ventana trasera?
  choices:
    A: 5%
    B: 10%
    C: 20%
    D: 25%
  answer: B
  explanation: De acuerdo con las regulaciones de polarizado de ventanas de Arkansas,
    las ventanas laterales traseras y la ventana trasera deben permitir al menos un
    10% de transmisión neta de luz.
- id: 189
  category: vehicle_information
  question: La ley de Arkansas exige que el freno de pie de todo vehículo motorizado
    sea capaz de detener el vehículo en cuántos pies cuando viaja a 20 mph?
  choices:
    A: 15 pies
    B: 25 pies
    C: 45 pies
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de Arkansas establece que el freno de pie debe
    ser capaz de detener el vehículo en un tramo de 25 pies cuando viaja a una velocidad
    de 20 mph.
- id: 190
  category: vehicle_information
  question: 'En Arkansas, la luz que ilumina la placa de matrícula trasera debe hacer
    que la placa sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Arkansas exige una luz blanca para iluminar la placa de matrícula
    trasera de modo que sea visible y legible desde una distancia de 50 pies.
- id: 191
  category: vehicle_information
  question: La ley de Arkansas exige que el espejo retrovisor de su vehículo proporcione
    una visión de la carretera de al menos ¿cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Todo vehículo motorizado debe estar equipado con un espejo colocado
    de tal manera que refleje al conductor una visión de la carretera a una distancia
    de al menos 200 pies hacia atrás.
- id: 192
  category: vehicle_information
  question: En Arkansas, ¿durante qué período de tiempo debe encender los faros delanteros?
  choices:
    A: Desde la puesta del sol hasta la salida del sol
    B: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la
      salida del sol
    C: Desde 1 hora después de la puesta del sol hasta 1 hora antes de la salida del
      sol
    D: Solo cuando esté demasiado oscuro para ver la carretera
  answer: B
  explanation: La ley de Arkansas exige que los faros delanteros se enciendan desde
    30 minutos después de la puesta del sol hasta 30 minutos antes de la salida del
    sol.
- id: 193
  category: vehicle_information
  question: 'De acuerdo con las leyes de equipamiento de vehículos de Arkansas, un
    freno de estacionamiento debe ser capaz de sostener el vehículo:'
  choices:
    A: Solo en superficies planas
    B: En cualquier pendiente en la que se opere
    C: Solo cuando el motor está en marcha
    D: Solo si el vehículo está en 'Park' (estacionamiento)
  answer: B
  explanation: La ley de Arkansas exige que el freno de estacionamiento sea adecuado
    para sostener el vehículo en cualquier pendiente en la que se opere, bajo todas
    las condiciones de carga.
- id: 194
  category: vehicle_information
  question: 'La ley de Arkansas exige que todos los vehículos motorizados estén equipados
    con un silenciador (muffler) para evitar:'
  choices:
    A: Cualquier escape visible
    B: Ruido excesivo o inusual
    C: Emisiones de dióxido de carbono
    D: Sobrecalentamiento del motor
  answer: B
  explanation: La ley de Arkansas exige que cada vehículo motorizado tenga un silenciador
    en buen estado de funcionamiento para evitar 'ruidos excesivos o inusuales' y
    humo molesto.
- id: 195
  category: signs_and_signals
  question: En Arkansas, ¿qué significa una luz de tráfico roja intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: La luz está a punto de ponerse en verde
    C: Lo mismo que una señal de alto (STOP)
    D: Ceder el paso únicamente al tráfico que viene en sentido contrario
  answer: C
  explanation: Según el Manual del Conductor de Arkansas, una luz roja intermitente
    significa lo mismo que una señal de alto. Debe detenerse por completo y luego
    proceder cuando sea seguro hacerlo.
- id: 196
  category: signs_and_signals
  question: Bajo la ley de Arkansas, las multas por infracciones de tránsito en movimiento
    se _________ si la ofensa se comete en una zona de obras viales cuando hay trabajadores
    presentes.
  choices:
    A: Triplican
    B: Duplican
    C: Reducen a la mitad
    D: Mantienen igual pero se suman 5 puntos
  answer: B
  explanation: El Código de Arkansas § 27-50-408 establece que cualquier persona que
    sea declarada culpable de una infracción de tránsito en movimiento en una zona
    de obras viales cuando hay trabajadores presentes, será multada con una cantidad
    doble de la multa normalmente establecida.
- id: 197
  category: signs_and_signals
  question: Un carril central compartido, marcado a cada lado por una línea amarilla
    continua y una línea amarilla discontinua, está reservado para _________ y puede
    ser utilizado por vehículos que viajan en cualquier dirección.
  choices:
    A: Rebasar vehículos más lentos
    B: Estacionamiento de vehículos de emergencia
    C: Realizar giros a la izquierda
    D: Vehículos de alta ocupación únicamente
  answer: C
  explanation: En Arkansas, los carriles centrales compartidos están reservados para
    realizar giros a la izquierda y pueden ser utilizados por vehículos que viajan
    en cualquier dirección. No pueden utilizarse para rebasar.
- id: 198
  category: signs_and_signals
  question: Cuando un conductor de Arkansas extiende su brazo izquierdo por la ventana
    y lo dobla hacia arriba por el codo, ¿qué señal está dando?
  choices:
    A: Giro a la izquierda
    B: Giro a la derecha
    C: Reducción de velocidad o parada
    D: Peligro más adelante
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido hacia afuera y doblado hacia arriba por el codo.
- id: 199
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla redonda con una 'X' negra y las letras
    'RR'?
  choices:
    A: Una zona de construcción de carreteras
    B: Una intersección de camino rural
    C: Un cruce de ferrocarril más adelante
    D: Un área de descanso más adelante
  answer: C
  explanation: La señal amarilla redonda con una 'X' negra y 'RR' es una señal circular
    de advertencia anticipada que indica un cruce de ferrocarril más adelante.
- id: 200
  category: signs_and_signals
  question: 'En Arkansas, una línea blanca continua pintada a través de un carril
    en una intersección se conoce como:'
  choices:
    A: Línea de cedat el paso
    B: Línea de cruce peatonal
    C: Línea de parada (stop line)
    D: Carril para bicicletas
  answer: C
  explanation: Una línea blanca continua a través de un carril en una intersección
    es una línea de parada, que indica dónde debe detener su vehículo ante una señal
    de alto o una luz roja.
- id: 201
  category: signs_and_signals
  question: 'Una señal de tráfico amarilla intermitente en una intersección significa:'
  choices:
    A: Detenerse y esperar la luz verde
    B: Continuar con precaución
    C: Aumentar la velocidad para despejar la intersección
    D: Tratarla como una parada de cuatro vías (four-way stop)
  answer: B
  explanation: Según el Manual del Conductor de Arkansas, una luz amarilla intermitente
    significa que debe reducir la velocidad y continuar con precaución.
- id: 202
  category: signs_and_signals
  question: Las señales de servicio, que proporcionan información sobre gasolina,
    comida o alojamiento, ¿de qué color son en Arkansas?
  choices:
    A: Verde
    B: Marrón
    C: Azul
    D: Naranja
  answer: C
  explanation: Las señales de servicio son azules con letras o símbolos blancos y
    proporcionan indicaciones hacia instalaciones como hospitales, gasolineras y hoteles.
- id: 203
  category: signs_and_signals
  question: ¿Cuál es el significado de una flecha roja encendida en un semáforo en
    Arkansas?
  choices:
    A: Puede girar después de detenerse por completo
    B: Debe detenerse y no puede girar en la dirección de la flecha
    C: La flecha está a punto de cambiar a verde
    D: Ceder el paso a los peatones y luego girar
  answer: B
  explanation: Una flecha roja significa que debe detenerse y no puede girar en la
    dirección que indica la flecha hasta que la luz cambie a una flecha verde o una
    luz verde.
- id: 204
  category: signs_and_signals
  question: En Arkansas, ¿qué indica una señal naranja en forma de diamante?
  choices:
    A: Advertencia general de las condiciones de la carretera
    B: Zona escolar más adelante
    C: Zona de construcción o mantenimiento
    D: Área de recreación pública
  answer: C
  explanation: El color naranja se utiliza específicamente para las señales de zonas
    de trabajo de construcción y mantenimiento.
- id: 205
  category: signs_and_signals
  question: 'Al entrar en una rotonda en Arkansas, debe ceder el paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en el círculo
    C: A nadie; usted tiene el derecho de paso
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: La ley de Arkansas exige que los conductores que entran en una rotonda
    cedan el paso al tráfico que ya está circulando dentro de la intersección.
- id: 206
  category: signs_and_signals
  question: ¿Qué significan las líneas amarillas continuas dobles en el centro de
    la calzada?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Se prohíbe rebasar en ambas direcciones
    D: Tráfico en un solo sentido únicamente
  answer: C
  explanation: Las líneas amarillas continuas dobles indican que no se permite rebasar
    a los vehículos que viajan en cualquier dirección.
- id: 207
  category: signs_and_signals
  question: 'En Arkansas, un bordillo (curb) pintado de amarillo generalmente indica:'
  choices:
    A: Una zona de carga u otra restricción
    B: Un carril de bomberos donde no se permite estacionar
    C: Se permite estacionar por cualquier duración
    D: Solo una parada de autobús escolar
  answer: A
  explanation: 'En la mayoría de las jurisdicciones de Arkansas, un bordillo amarillo
    indica una zona de carga u otras restricciones de estacionamiento. (Nota: El rojo
    generalmente indica una zona de bomberos/prohibido estacionar).'
- id: 208
  category: signs_and_signals
  question: 'Al acercarse a una luz amarilla intermitente en una intersección en Arkansas,
    usted debe:'
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Aumentar la velocidad para despejar la intersección rápidamente
    C: Reducir la velocidad y continuar con precaución
    D: Tratarla como una parada de cuatro vías (four-way stop)
  answer: C
  explanation: Una luz amarilla intermitente en Arkansas indica que debe reducir la
    velocidad y proceder con precaución, ya que no necesita detenerse pero debe mantenerse
    alerta.
- id: 209
  category: signs_and_signals
  question: ¿Cuál es la forma y el color de una señal de zona escolar estándar en
    Arkansas?
  choices:
    A: En forma de diamante y naranja
    B: En forma de pentágono y verde-amarillo fluorescente
    C: Circular y amarilla
    D: Rectangular y blanca
  answer: B
  explanation: Las señales de zona escolar en Arkansas tienen forma de pentágono (cinco
    lados) y suelen ser de color verde-amarillo fluorescente.
- id: 210
  category: signs_and_signals
  question: Según la ley de Arkansas, ¿cuándo se le permite a un conductor girar a
    la izquierda con luz roja?
  choices:
    A: Nunca
    B: Solo al girar desde una calle de un solo sentido hacia otra calle de un solo
      sentido
    C: En cualquier intersección si no viene tráfico
    D: Solo durante situaciones de emergencia
  answer: B
  explanation: En Arkansas, puede girar a la izquierda con luz roja solo cuando gire
    desde una calle de un solo sentido hacia otra calle de un solo sentido, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 211
  category: signs_and_signals
  question: En Arkansas, ¿cuál es el propósito de un carril central compartido marcado
    con líneas amarillas continuas y discontinuas?
  choices:
    A: Rebasar vehículos más lentos
    B: Estacionamiento de emergencia únicamente
    C: Realizar giros a la izquierda únicamente
    D: Vehículos de alta ocupación únicamente
  answer: C
  explanation: Los carriles centrales compartidos están reservados para realizar giros
    a la izquierda y pueden ser utilizados por vehículos que viajan en cualquier dirección,
    pero no pueden usarse para rebasar ni para circular de forma continua.
- id: 212
  category: signs_and_signals
  question: Si las señales de su vehículo no funcionan, ¿cuál es la señal manual correcta
    para 'disminuir la velocidad o detenerse' en Arkansas?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo doblado hacia arriba en un ángulo de 90 grados
    C: Brazo extendido hacia abajo con la palma hacia atrás
    D: Brazo moviéndose en movimiento circular
  answer: C
  explanation: La señal manual estándar para disminuir la velocidad o detenerse es
    el brazo extendido hacia abajo con la palma de la mano orientada hacia atrás.
- id: 213
  category: signs_and_signals
  question: En Arkansas, ¿qué tipo de señal es un letrero rectangular con letras negras
    sobre un fondo blanco?
  choices:
    A: Señal de advertencia
    B: Señal reglamentaria
    C: Señal de servicio
    D: Señal de guía
  answer: B
  explanation: Las señales rectangulares con fondo negro, rojo o blanco son señales
    reglamentarias que informan a los conductores sobre las leyes y regulaciones,
    como los límites de velocidad.
- id: 214
  category: signs_and_signals
  question: ¿Cuál es la forma específica de una señal de 'Ceder el paso' (Yield) utilizada
    en las carreteras de Arkansas?
  choices:
    A: Un triángulo equilátero apuntando hacia arriba
    B: Un triángulo equilátero apuntando hacia abajo
    C: Un rombo
    D: Un octágono
  answer: B
  explanation: Una señal de ceder el paso es un triángulo que apunta hacia abajo,
    generalmente de color rojo y blanco, que indica a los conductores que deben disminuir
    la velocidad y permitir que el resto del tráfico tenga el derecho de paso.
- id: 215
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente para un conductor en Arkansas?
  choices:
    A: Usted tiene el derecho de paso para girar a la izquierda
    B: Debe detenerse y esperar a una flecha verde
    C: Se permiten los giros a la izquierda, pero primero debe ceder el paso al tráfico
      en sentido contrario y a los peatones
    D: La intersección está cerrada para giros a la izquierda
  answer: C
  explanation: Una flecha amarilla intermitente significa que puede girar en la dirección
    de la flecha después de ceder el paso al tráfico que viene en sentido contrario
    y a los peatones.
- id: 216
  category: signs_and_signals
  question: 'En Arkansas, las multas por infracciones de tráfico en movimiento se
    duplican cuando:'
  choices:
    A: Está lloviendo o nevando
    B: La infracción ocurre en una zona de obras viales cuando hay trabajadores presentes
    C: El conductor está usando un teléfono celular
    D: La infracción ocurre por la noche
  answer: B
  explanation: La ley de Arkansas dicta que las multas por infracciones de tráfico
    en movimiento se duplican si ocurren en una zona de obras viales designada mientras
    haya trabajadores presentes.
- id: 217
  category: signs_and_signals
  question: 'Las líneas blancas discontinuas en una carretera de Arkansas separan
    los carriles de tráfico:'
  choices:
    A: Que se mueven en direcciones opuestas
    B: Que se mueven en la misma dirección
    C: Reservados únicamente para bicicletas
    D: Reservados para vehículos de emergencia
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Puede cruzarlas para cambiar de carril cuando
    sea seguro hacerlo.
- id: 218
  category: signs_and_signals
  question: 'Cuando un semáforo cambia de verde a amarillo fijo en Arkansas, significa:'
  choices:
    A: Acelerar para pasar antes de la luz roja
    B: Detenerse inmediatamente, incluso si está en la intersección
    C: La luz está a punto de cambiar a rojo y debe detenerse si es seguro hacerlo
    D: El tráfico en sentido contrario tiene luz verde
  answer: C
  explanation: Una luz amarilla fija advierte que la señal está cambiando a rojo.
    Debe detenerse si puede hacerlo de manera segura; de lo contrario, proceda con
    precaución a través de la intersección.
- id: 219
  category: signs_and_signals
  question: 'En Arkansas, las señales de tráfico azules se utilizan para proporcionar
    información sobre:'
  choices:
    A: Construcción y mantenimiento
    B: Parques estatales y áreas recreativas
    C: Servicios para el automovilista como gasolina, comida y alojamiento
    D: Guía de dirección hacia ciudades
  answer: C
  explanation: Las señales azules son señales de servicio que proporcionan información
    sobre servicios para el automovilista, como hospitales, gasolina, comida y alojamiento.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Disminuir la velocidad y proceder con precaución
    B: Hacer un alto total
    C: Ceder el paso al tráfico en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 220
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 221
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 222
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 223
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 224
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 225
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 226
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 227
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico en ambos sentidos más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 228
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 229
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 230
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 231
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de un peatón
    advierte sobre un cruce de peatones más adelante. Esté preparado para detenerse
    ante los peatones que crucen la calle.
  id: 232
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal pentagonal (de 5 lados) de color amarillo verdoso fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 233
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 234
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de vías férreas. Significa que debe ceder el paso a los trenes.
    Si se aproxima un tren, debe detenerse.
  id: 235
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Se requiere giro a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 236
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 237
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera curve primero
    hacia un lado y luego hacia el otro.
  id: 238
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 239
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico incorporándose desde otra carretera
    C: Comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación (merge) en forma de diamante advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 240
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera se estrecha más adelante.
    Esté preparado para una reducción en el ancho de la vía y ajuste su posición en
    el carril.
  id: 241
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 242
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    de doble sentido.
  id: 243
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de sentido único o de una autopista dividida y se
    encuentre con vehículos que circulan en dirección opuesta.
  id: 244
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 245
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 246
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de pare (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 247
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de pare (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de pare (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de pare.
  id: 248
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 249
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la carretera desde la calle lateral.
  id: 250
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 251
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 252
