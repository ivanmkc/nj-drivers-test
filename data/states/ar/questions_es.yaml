- id: 58
  category: driver_responsibility
  question: 'Si un conductor de Arkansas es condenado por una primera infracción de
    DUI (Conducir Bajo la Influencia) y tiene 21 años de edad o más, su privilegio
    de conducir será suspendido por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Para una primera infracción de DUI en Arkansas para un conductor de
    21 años o más, la licencia generalmente se suspende por 6 meses.
- id: 59
  category: driver_responsibility
  question: 'Al acercarse a un vehículo de emergencia autorizado que esté detenido
    (como una patrulla de policía o una grúa) con las luces intermitentes encendidas
    a un lado de una carretera de Arkansas, la ley de ''Hacerse a un lado'' (Move
    Over) le exige:'
  choices:
    A: Detenerse inmediatamente en el carril de tráfico
    B: Mantener la velocidad pero tocar la bocina para advertir al oficial
    C: Moverse al carril más alejado del vehículo o reducir la velocidad si cambiar
      de carril es inseguro
    D: Aumentar la velocidad para rebasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley de Arkansas exige que los conductores se muevan al carril más
