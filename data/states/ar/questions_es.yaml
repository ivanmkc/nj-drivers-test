questions:
- id: 1
  category: license_system
  question: ¿En Arkansas, cuál es la edad mínima para solicitar un Permiso de Instrucción
    de Aprendiz (Learner's Instruction Permit)?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 14 años y medio de edad
  answer: A
  explanation: Según el Manual del Conductor de Arkansas, una persona puede solicitar
    una Licencia de Aprendiz a los 14 años de edad.
- id: 2
  category: license_system
  question: 'Una persona que opera un vehículo motorizado con un Permiso de Instrucción
    de Arkansas debe estar acompañada por un conductor con licencia que tenga al menos:'
  choices:
    A: 18 años de edad o más
    B: 21 años de edad o más
    C: 25 años de edad o más
    D: Cualquier conductor con licencia independientemente de su edad
  answer: B
  explanation: La ley de Arkansas exige que el titular de un permiso esté acompañado
    por un conductor con licencia que tenga 21 años de edad o más.
- id: 3
  category: license_system
  question: 'Bajo la ley de Licencia de Conducir Graduada (GDL) de Arkansas, se emite
    una Licencia Intermedia a los conductores de entre:'
  choices:
    A: 14 y 16 años
    B: 15 y 17 años
    C: 16 y 18 años
    D: 17 y 21 años
  answer: C
  explanation: Se emite una Licencia Intermedia a los conductores de 16 a 18 años
    de edad que hayan tenido una Licencia de Aprendiz durante al menos seis meses
    sin accidentes ni infracciones de tránsito.
- id: 4
  category: license_system
  question: ¿Cuáles son las restricciones de toque de queda para el titular de una
    Licencia Intermedia de Arkansas?
  choices:
    A: No conducir entre las 10:00 PM y las 5:00 AM
    B: No conducir entre las 11:00 PM y las 4:00 AM
    C: No conducir entre la medianoche y las 6:00 AM
    D: No hay restricciones de toque de queda para las Licencias Intermedias
  answer: B
  explanation: Los titulares de una Licencia Intermedia en Arkansas tienen prohibido
    conducir entre las 11:00 PM y las 4:00 AM, a menos que estén acompañados por una
    persona de 21 años o más, o por actividades específicas como el trabajo o la escuela.
- id: 5
  category: license_system
  question: ¿Cuántos pasajeros menores de edad no emparentados se le permite llevar
    al titular de una Licencia Intermedia de Arkansas?
  choices:
    A: Ninguno
    B: Solo uno
    C: Hasta dos
    D: Hasta tres
  answer: B
  explanation: Las leyes GDL de Arkansas restringen a los titulares de Licencias Intermedias
    a llevar solo un pasajero menor de edad no emparentado, a menos que estén acompañados
    por un conductor con licencia de 21 años o más.
- id: 6
  category: license_system
  question: 'En Arkansas, los conductores menores de 18 años tienen prohibido usar
    un teléfono celular mientras conducen EXCEPTO:'
  choices:
    A: Cuando usan un dispositivo de manos libres
    B: Cuando envían mensajes de texto en un semáforo en rojo
    C: En una emergencia
    D: Cuando hablan con un padre o madre
  answer: C
  explanation: La ley de Arkansas prohíbe a los conductores menores de 18 años usar
    un teléfono celular o cualquier dispositivo de comunicación inalámbrica interactiva
    mientras conducen, incluso con manos libres, excepto en una emergencia.
- id: 7
  category: license_system
  question: 'Los conductores en Arkansas de entre 18 y 20 años tienen permitido usar
    un teléfono celular mientras conducen SOLO si:'
  choices:
    A: Están usando un dispositivo de manos libres
    B: Están en una autopista
    C: Es durante las horas del día
    D: Tienen una licencia completa Clase D
  answer: A
  explanation: La ley de Arkansas permite a los conductores de 18 a 20 años usar un
    teléfono celular para llamadas solo si utilizan un dispositivo de manos libres.
    El envío de mensajes de texto está prohibido para todos los conductores.
- id: 8
  category: license_system
  question: 'Si se muda a Arkansas o cambia su dirección dentro del estado, debe notificar
    a la Oficina de Vehículos Motorizados (OMV) dentro de:'
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: La ley de Arkansas exige que notifique al Departamento de Finanzas
    y Administración (OMV) cualquier cambio de dirección o nombre dentro de un plazo
    de 10 días.
- id: 9
  category: license_system
  question: Para aprobar el examen de la vista de Arkansas, ¿qué agudeza visual debe
    tener un solicitante en al menos un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: El Manual del Conductor de Arkansas establece que los solicitantes
    deben tener una visión de al menos 20/40 en al menos un ojo, con o sin lentes
    correctivos.
- id: 10
  category: license_system
  question: 'Los solicitantes de una licencia de conducir de Arkansas menores de 18
    años deben presentar prueba de:'
  choices:
    A: Empleo
    B: Inscripción en una escuela pública o privada (o GED/Graduación)
    C: Propiedad de un automóvil
    D: Una cuenta de ahorros
  answer: B
  explanation: La ley de Arkansas exige que los solicitantes menores de 18 años presenten
    un comprobante de inscripción escolar, un diploma de escuela secundaria o un certificado
    de GED para ser elegibles para una licencia.
- id: 11
  category: license_system
  question: El examen de conocimientos de Arkansas consta de 25 preguntas. ¿Cuántas
    debe responder correctamente para aprobar?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '22'
  answer: C
  explanation: Para aprobar el examen de conocimientos de Arkansas, debe responder
    correctamente el 80% de las preguntas, lo que equivale a 20 de las 25 preguntas.
- id: 12
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Instrucción de Arkansas antes
    de que expire?
  choices:
    A: 6 meses
    B: 12 meses
    C: 24 meses
    D: Hasta que el solicitante cumpla 16 años
  answer: B
  explanation: Un Permiso de Instrucción de Arkansas es válido por un período de 12
    meses (1 año) a partir de la fecha de emisión.
- id: 13
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    para un vehículo motorizado en Arkansas?
  choices:
    A: $15,000/$30,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$50,000
    D: $10,000/$20,000/$5,000
  answer: B
  explanation: La ley de Arkansas exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones corporales de una persona, $50,000 por lesiones corporales
    de dos o más personas y $25,000 por daños a la propiedad (25/50/25).
- id: 14
  category: license_system
  question: 'Proporcionar información falsa en una solicitud de licencia de conducir
    de Arkansas puede resultar en:'
  choices:
    A: Solo una advertencia verbal
    B: Una multa y/o encarcelamiento y la suspensión de la licencia
    C: El requisito de volver a tomar el examen de conducir
    D: Ninguna sanción si se corrige en un plazo de 30 días
  answer: B
  explanation: Presentar información o documentos falsos es un delito grave en Arkansas
    y puede acarrear multas, tiempo en la cárcel y la suspensión o revocación de los
    privilegios de conducir.
- id: 15
  category: license_system
  question: ¿A qué edad puede un conductor de Arkansas solicitar una licencia Clase
    D sin restricciones (asumiendo que se cumplieron todos los requisitos de GDL)?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: En Arkansas, una vez que un conductor cumple 18 años, es elegible para
    una licencia Clase D regular y sin restricciones, siempre que haya completado
    las etapas del sistema de licencia graduada (GDL) sin infracciones graves.
- id: 16
  category: license_system
  question: Según el Manual del Conductor de Arkansas, ¿cuántos días debe esperar
    para volver a tomar el examen de habilidades (práctico) si no lo aprueba?
  choices:
    A: 2 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: En Arkansas, si no aprueba el examen de conocimientos o el examen de
    habilidades, debe esperar al menos cinco (5) días antes de ser elegible para intentar
    el examen nuevamente.
- id: 17
  category: license_system
  question: Bajo el sistema de puntos de Arkansas, ¿en qué rango de puntos recibirá
    un conductor una carta de advertencia de la Oficina de Servicios al Conductor?
  choices:
    A: De 5 a 8 puntos
    B: De 10 a 13 puntos
    C: De 14 a 17 puntos
    D: De 18 a 23 puntos
  answer: B
  explanation: Arkansas emite una carta de advertencia a los conductores que acumulan
    de 10 a 13 puntos. Acumular 14 o más puntos resulta en una audiencia administrativa
    y una posible suspensión.
- id: 18
  category: license_system
  question: ¿Por cuánto tiempo es válida normalmente una licencia de conducir estándar
    Clase D de Arkansas antes de que deba renovarse?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Según los cambios recientes en la ley de Arkansas, una licencia de
    conducir no comercial estándar se emite por un período de ocho (8) años.
- id: 19
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una licencia Clase MD (Ciclo Impulsado
    por Motor) en Arkansas, que cubre ciclos de entre 50cc y 250cc?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: A
  explanation: En Arkansas, una persona de tan solo 14 años puede recibir una licencia
    Clase MD para ciclos impulsados por motor con una cilindrada de entre 50cc y 250cc.
    Esta licencia vence cuando la persona cumple 16 años.
- id: 20
  category: license_system
  question: Si un conductor de Arkansas acumula de 14 a 17 puntos en su historial
    de manejo dentro de un período de 36 meses, ¿cuál es el período de suspensión
    potencial?
  choices:
    A: 30 días
    B: 60 días
    C: 3 meses
    D: 6 meses
  answer: C
  explanation: La ley de Arkansas dicta que acumular de 14 a 17 puntos resulta en
    una suspensión de 3 meses. De 18 a 23 puntos resulta en una suspensión de 6 meses,
    y 24 o más resulta en una suspensión de 1 año.
- id: 21
  category: license_system
  question: ¿Al solicitar una licencia de conducir de Arkansas, qué significa una
    'Restricción B' en la licencia?
  choices:
    A: Solo conducción diurna
    B: Se requieren lentes correctivos
    C: Sin transmisión manual
    D: Solo transmisión automática
  answer: B
  explanation: El código de restricción 'B' es una designación común en las licencias
    de Arkansas que indica que el conductor debe usar lentes correctivos (anteojos
    o lentes de contacto) al operar un vehículo motorizado.
- id: 22
  category: license_system
  question: ¿Cuántos días tiene un residente de Arkansas que es miembro de las Fuerzas
    Armadas y cuya licencia vence mientras está en servicio activo fuera del estado
    para renovarla después de regresar a AR o ser dado de baja?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: La ley de Arkansas otorga un período de gracia para el personal militar;
    su licencia sigue siendo válida durante 60 días después de su regreso al estado
    o de su baja del servicio.
- id: 23
  category: license_system
  question: 'Una licencia Clase D en Arkansas permite a una persona conducir un vehículo
    no comercial con una Clasificación de Peso Bruto Vehicular (GVWR) de menos de:'
  choices:
    A: 10,001 lbs
    B: 15,000 lbs
    C: 26,001 lbs
    D: 33,000 lbs
  answer: C
  explanation: Una licencia Clase D es la licencia estándar para automóviles y permite
    la operación de vehículos que pesen menos de 26,001 libras, siempre que el vehículo
    no se utilice para fines comerciales ni para transportar materiales peligrosos.
- id: 24
  category: license_system
  question: Para cumplir con la Ley federal REAL ID, ¿con qué símbolo está marcada
    en la esquina superior derecha una licencia de Arkansas que cumple con 'REAL ID'?
  choices:
    A: Un ancla azul
    B: Una estrella dorada
    C: Una 'X' roja
    D: El sello del estado
  answer: B
  explanation: Las licencias de Arkansas que cumplen con REAL ID presentan una estrella
    dorada en la esquina superior derecha para indicar que cumplen con los estándares
    de seguridad federales para abordar vuelos nacionales e ingresar a instalaciones
    federales.
- id: 25
  category: license_system
  question: 'Si un conductor de Arkansas cambia su nombre legal debido a matrimonio
    o una orden judicial, debe llevar los documentos legales a una oficina de rentas
    (Revenue Office) y solicitar un duplicado de la licencia en un plazo de:'
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Arkansas exige que los conductores actualicen la información
    de su licencia, incluidos los cambios de nombre, dentro de los 30 días posteriores
    a que ocurra el cambio.
- id: 26
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para el vehículo utilizado durante
    la prueba de habilidades (manejo) de Arkansas?
  choices:
    A: Debe ser un vehículo de transmisión manual
    B: Debe tener un freno en el lado del pasajero accesible para el examinador
    C: Debe estar debidamente registrado y asegurado
    D: Debe ser un sedán de tamaño mediano
  answer: C
  explanation: Para la prueba de habilidades de Arkansas, el solicitante debe proporcionar
    un vehículo que esté debidamente asegurado, registrado y en condiciones seguras
    de funcionamiento (luces, frenos, neumáticos, etc.).
- id: 27
  category: license_system
  question: En Arkansas, si los padres de un menor están divorciados, ¿quién es la
    única persona autorizada para firmar la solicitud de una licencia o permiso?
  choices:
    A: Cualquiera de los padres, independientemente de la custodia
    B: El padre o madre con custodia certificada
    C: Solo el padre
    D: Solo la madre
  answer: B
  explanation: Para los solicitantes menores de 18 años, la solicitud debe estar firmada
    por un padre o tutor legal. Si los padres están divorciados, debe firmar el padre
    o la madre que tenga la custodia certificada.
- id: 28
  category: license_system
  question: ¿Cuál es la tarifa estándar para una licencia de conducir Clase D de Arkansas
    por 8 años?
  choices:
    A: Sin cargo
    B: Solo lista de espera
    C: $24.00
    D: $40.00
  answer: D
  explanation: La tarifa actual para una licencia de conducir estándar Clase D de
    Arkansas por 8 años es de $40.00.
- id: 29
  category: license_system
  question: Bajo la ley 'Motor Voter' (Votante Motorizado), ¿dónde pueden los residentes
    de Arkansas registrarse para votar o actualizar su registro de votante?
  choices:
    A: Solo en la oficina del Secretario del Condado
    B: En cualquier cuartel de la Policía Estatal
    C: En cualquier Oficina de Rentas (Revenue Office) al solicitar o renovar una
      licencia
    D: Solo en línea a través del sitio web de la Secretaría de Estado
  answer: C
  explanation: La Ley Nacional de Registro de Votantes (Motor Voter) permite a los
    residentes de Arkansas registrarse para votar o actualizar su registro en cualquier
    Oficina de Rentas local durante el proceso de solicitud de la licencia de conducir.
- id: 30
  category: driver_testing
  question: En Arkansas, ¿cuál es la multa máxima por una condena de primera ofensa
    por tirar basura (littering)?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,000
  answer: C
  explanation: Según el Manual del Conductor de Arkansas, una persona condenada por
    tirar basura por primera vez puede ser multada con hasta $1,000 y se le puede
    exigir que realice hasta ocho horas de servicio comunitario.
- id: 31
  category: driver_testing
  question: La ley de Arkansas exige que los conductores enciendan sus faros delanteros
    cuando utilicen los limpiaparabrisas debido a la lluvia, la nieve o la niebla.
    ¿En qué otro momento se deben encender los faros?
  choices:
    A: Desde la puesta del sol hasta la salida del sol
    B: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
    C: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la
      salida del sol
    D: Solo cuando la visibilidad sea inferior a 100 pies
  answer: C
  explanation: La ley de Arkansas exige que los faros delanteros del vehículo se enciendan
    desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la salida
    del sol, y en cualquier momento en que se utilicen los limpiaparabrisas.
- id: 32
  category: driver_testing
  question: En Arkansas, ¿es ilegal estacionar su vehículo a menos de cuántos pies
    de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Arkansas prohíbe estacionar un vehículo a menos de 15 pies
    de un hidrante de incendios.
- id: 33
  category: driver_testing
  question: Al estacionar cerca de una intersección, ¿a qué distancia mínima debe
    estar de una señal de alto, una baliza intermitente o una señal de control de
    tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: En Arkansas, no se puede estacionar a menos de 30 pies de una señal
    de tráfico, señal de alto o baliza intermitente.
- id: 34
  category: driver_testing
  question: Al conducir de noche en Arkansas, debe atenuar sus luces altas cuando
    se encuentre a menos de cuántos pies de un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Arkansas exige que los conductores atenúen las luces altas
    cuando un vehículo que viene en sentido contrario se encuentra a menos de 500
    pies.
- id: 35
  category: driver_testing
  question: 'Al rebasar una bicicleta en Arkansas, un automovilista debe mantener
    una distancia mínima de al menos:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Arkansas exige que los automovilistas dejen al menos tres
    pies de espacio al rebasar a una persona que circula en bicicleta.
- id: 36
  category: driver_testing
  question: 'En Arkansas, una persona menor de 21 años puede ser arrestada por Conducir
    Bajo la Influencia siendo menor de edad (DUI) si su Contenido de Alcohol en Sangre
    (BAC) es igual o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Arkansas tiene una política de 'tolerancia cero' para el consumo de
    alcohol y la conducción de menores de edad; el límite legal para los menores de
    21 años es de 0.02% de BAC.
- id: 37
  category: driver_testing
  question: 'Bajo la Ley de Consentimiento Implícito de Arkansas, si usted se niega
    a someterse a una prueba química de alcohol o drogas a petición de un oficial
    de la ley:'
  choices:
    A: Se le multará con $50 y será liberado
    B: Se le suspenderán sus privilegios de conducción
    C: Solo será penalizado si la prueba hubiera resultado positiva
    D: Puede optar por realizar una prueba escrita en su lugar
  answer: B
  explanation: Al operar un vehículo motorizado en Arkansas, usted otorga su consentimiento
    implícito para realizarse pruebas químicas. Negarse a realizar la prueba resultará
    en la incautación de su licencia de conducir y la suspensión de sus privilegios
    de conducción.
- id: 38
  category: driver_testing
  question: ¿Cuál es la multa mínima por una condena por primera infracción por no
    detenerse ante un autobús escolar con sus luces rojas intermitentes y el brazo
    de parada extendido en Arkansas?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: En Arkansas, la multa por una primera infracción por rebasar ilegalmente
    a un autobús escolar detenido oscila entre $250 y $1,000, y puede incluir tiempo
    en la cárcel.
- id: 39
  category: driver_testing
  question: En Arkansas, ¿cuál es el límite de velocidad predeterminado en un distrito
    urbano a menos que se indique lo contrario?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Según el Manual del Conductor de Arkansas, el límite de velocidad en
    los distritos urbanos es de 30 mph, a menos que se indique lo contrario.
- id: 40
  category: driver_testing
  question: En Arkansas, ¿debe señalizar al menos cuántos pies antes de girar o cambiar
    de carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Arkansas exige que los conductores señalicen su intención
    de girar o cambiar de carril al menos 100 pies antes de realizar la maniobra.
- id: 41
  category: driver_testing
  question: 'Para mantener una distancia de seguimiento segura en condiciones normales,
    el Manual del Conductor de Arkansas recomienda utilizar la:'
  choices:
    A: Regla de un segundo
    B: Regla de dos segundos
    C: Regla de cinco segundos
    '0': Regla de la longitud del vehículo
  answer: B
  explanation: El Manual del Conductor de Arkansas recomienda la "regla de los dos
    segundos" para determinar si está siguiendo al vehículo que tiene delante a una
    distancia segura.
- id: 42
  category: driver_testing
  question: 'Al estacionar su vehículo en una pendiente cuesta abajo con un bordillo,
    debe girar sus ruedas delanteras:'
  choices:
    A: Hacia el bordillo
    B: Lejos del bordillo
    C: Paralelas al bordillo
    D: Hacia la izquierda
  answer: A
  explanation: Al estacionar cuesta abajo, debe girar las ruedas hacia el bordillo
    para que, si el vehículo rueda, lo haga hacia el bordillo y se detenga.
- id: 43
  category: driver_testing
  question: 'De acuerdo con la ley "Move Over" (Hacerse a un lado) de Arkansas, al
    acercarse a un vehículo de emergencia autorizado con luces intermitentes activadas
    a un lado de la carretera, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Aumentar la velocidad para pasar rápidamente
    C: Moverse al carril más alejado del vehículo o reducir la velocidad si cambiar
      de carril no es seguro
    D: Mantener su velocidad y permanecer en su carril actual
  answer: C
  explanation: La ley de Arkansas exige que los conductores se muevan al carril más
    alejado de un vehículo de emergencia con luces intermitentes, o que reduzcan la
    velocidad y mantengan una velocidad segura si no es posible cambiar de carril.
- id: 44
  category: driver_testing
  question: 'Según la ley de Arkansas, un conductor menor de 21 años puede ser acusado
    de conducir bajo la influencia (DUI) si su concentración de alcohol en sangre
    (BAC) es igual o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Arkansas tiene una ley de "Tolerancia Cero" para menores. Cualquier
    conductor menor de 21 años con un BAC de 0.02% o superior puede ser acusado de
    conducir bajo la influencia (DUI).
- id: 45
  category: driver_testing
  question: 'En Arkansas, un conductor adulto (de 21 años o más) se considera legalmente
    intoxicado si su concentración de alcohol en sangre (BAC) es de:'
  choices:
    A: 0.04% o superior
    B: 0.05% o superior
    C: 0.07% o superior
    D: 0.08% o superior
  answer: D
  explanation: Para los conductores de 21 años o más en Arkansas, el límite legal
    de concentración de alcohol en sangre es de 0.08%.
- id: 46
  category: driver_testing
  question: 'La ley de "Consentimiento Implícito" (Implied Consent) de Arkansas significa
    que, al operar un vehículo motorizado, usted ha aceptado:'
  choices:
    A: Contar con un seguro mínimo de $50,000 por daños a la propiedad
    B: Someterse a una prueba química de alcohol o drogas si lo solicita la policía
    C: Permitir que cualquier pasajero use un dispositivo celular
    D: Mantener el registro de su vehículo en la guantera en todo momento
  answer: B
  explanation: La ley de Consentimiento Implícito establece que al conducir en Arkansas,
    usted da su consentimiento para ser sometido a pruebas de alcohol o drogas. La
    negativa resulta en la suspensión de la licencia.
- id: 47
  category: driver_testing
  question: 'En Arkansas, una primera condena por tirar basura (littering) puede resultar
    en servicio comunitario y una multa de hasta:'
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,000
  answer: C
  explanation: Arkansas se toma en serio el tirar basura; una primera condena puede
    conllevar una multa de hasta $1,000 y 8 horas de servicio comunitario.
- id: 48
  category: driver_testing
  question: 'Al estacionar un vehículo cuesta abajo en una calle de doble sentido
    con bordillo, la ley de Arkansas le exige:'
  choices:
    A: Girar las ruedas hacia el bordillo
    B: Girar las ruedas en dirección contraria al bordillo
    C: Mantener las ruedas rectas
    D: Girar las ruedas hacia el centro de la carretera
  answer: A
  explanation: Al estacionar cuesta abajo con bordillo, debe girar las ruedas hacia
    el bordillo para que el vehículo ruede hacia este en lugar de hacia el tráfico
    si fallan los frenos.
- id: 49
  category: driver_testing
  question: 'Al seguir a otro vehículo desde atrás por la noche en Arkansas, debe
    bajar las luces altas cuando se encuentre a menos de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Debe bajar las luces altas cuando siga a otro vehículo a menos de 200
    pies para evitar el deslumbramiento en el espejo retrovisor del conductor delantero.
- id: 50
  category: driver_testing
  question: 'Cuando un autobús escolar se detiene con sus luces rojas intermitentes
    y el brazo de parada extendido en una carretera sin mediana, los conductores deben:'
  choices:
    A: Detenerse solo si viajan en la misma dirección que el autobús
    B: Reducir la velocidad a 15 mph y pasar con precaución
    C: Detenerse independientemente de la dirección en la que viajen
    D: Detenerse solo si hay niños cruzando en ese momento
  answer: C
  explanation: En Arkansas, todo el tráfico debe detenerse ante un autobús escolar
    con luces rojas intermitentes y el brazo de parada extendido, a menos que se viaje
    por una carretera dividida con una mediana de 20 pies o más.
- id: 51
  category: driver_testing
  question: ¿Según el Manual del Conductor de Arkansas, a qué velocidad pueden sus
    neumáticos comenzar a perder contacto con la carretera (hidroplaneo) durante una
    lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El manual de Arkansas establece que el hidroplaneo puede comenzar a
    velocidades tan bajas como 35 mph, y los neumáticos pueden perder todo contacto
    con la carretera a 50 mph.
- id: 52
  category: driver_testing
  question: En Arkansas, ¿con cuántos pies de antelación, como mínimo, debe señalizar
    su intención de girar antes del giro real?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: La ley de Arkansas exige que los conductores señalicen un giro o cambio
    de carril con al menos 100 pies de antelación.
- id: 53
  category: driver_testing
  question: En Arkansas, ¿está prohibido estacionar a menos de cuántos pies de un
    cruce peatonal en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Las regulaciones de Arkansas prohíben estacionar un vehículo a menos
    de 20 pies de un cruce peatonal en una intersección.
- id: 54
  category: driver_testing
  question: 'Al usar señales manuales para indicar un giro a la izquierda, un conductor
    de Arkansas debe:'
  choices:
    A: Extender el brazo izquierdo por la ventana y apuntar recto hacia afuera
    B: Extender el brazo izquierdo hacia afuera y apuntar hacia arriba
    C: Extender el brazo izquierdo hacia afuera y apuntar hacia abajo
    D: Mover el brazo izquierdo en movimiento circular
