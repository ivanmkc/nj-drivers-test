questions:
- id: 1
  category: penalties_and_points
  question: Según la ley de Arkansas, ¿cuál es la multa por una primera infracción
    por arrojar basura?
  choices:
    A: No menos de $50 y no más de $500
    B: No menos de $100 y no más de $1,000
    C: No menos de $200 y no más de $2,000
    D: Una multa fija de $1,000
  answer: B
  explanation: Una persona condenada por una primera infracción por arrojar basura
    será multada con una cantidad no inferior a cien dólares ($100) ni superior a
    mil dólares ($1,000).
- id: 2
  category: driver_responsibility
  question: Si se arroja basura desde un vehículo motorizado (que no sea un autobús
    motorizado), ¿quién se presume que ha cometido el acto bajo evidencia prima facie?
  choices:
    A: El pasajero sentado más cerca de la ventana
    B: El propietario registrado del vehículo
    C: El conductor del vehículo motorizado
    D: Todos los ocupantes del vehículo por igual
  answer: C
  explanation: Si el acto de arrojar, tirar o depositar basura se realizó desde un
    vehículo motorizado, excepto un autobús motorizado, se considerará evidencia prima
    facie de que el acto fue realizado por el conductor del vehículo motorizado.
- id: 3
  category: penalties_and_points
  question: ¿Cuál es la sanción por no pagar las multas impuestas por una condena
    por arrojar basura?
  choices:
    A: Su vehículo será confiscado por 30 días
    B: Será sentenciado a 100 horas de servicio comunitario
    C: Su licencia de conducir será suspendida por seis (6) meses
    D: Enfrentará una sentencia obligatoria de 30 días de cárcel
  answer: C
  explanation: Cualquier persona condenada por una infracción de arrojar basura que
    no pague las multas impuestas verá suspendida su licencia de conducir por seis
    (6) meses por el Departamento de Finanzas y Administración.
- id: 4
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por desechar ilegalmente
    un electrodoméstico inoperante en el derecho de vía de una carretera pública?
  choices:
    A: Una multa de $500 y 50 horas de servicio comunitario
    B: Una multa de $1,000 y 100 horas de servicio comunitario
    C: Una multa de $2,000 y 24 horas de servicio comunitario
    D: Un delito menor de Clase A con hasta 1 año de cárcel
  answer: B
  explanation: Cualquier persona que viole la disposición relativa al desecho de ciertos
    artículos (como electrodomésticos) será culpable de un delito menor no clasificado
    por una primera infracción, multada con $1,000 y sentenciada a 100 horas de servicio
    comunitario.
- id: 5
  category: defensive_driving
  question: ¿Qué debe hacer si le ordenan detenerse pero no está seguro de si se trata
    de un oficial de policía real?
  choices:
    A: Acelerar y conducir hasta la estación de policía más cercana
    B: Detenerse inmediatamente en el carril de tráfico y cerrar sus puertas con llave
    C: Activar su señal de giro, detenerse en un lugar bien iluminado, llamar al 9-1-1
      y solicitar confirmación
    D: Ignorar el vehículo y continuar conduciendo hacia su destino
  answer: C
  explanation: Si no está seguro de que lo está deteniendo un oficial de policía real,
    active su señal de giro, deténgase en el lugar bien iluminado más cercano, llame
    al 9-1-1 y solicite la confirmación de un oficial de policía.
- id: 6
  category: safe_driving_rules
  question: Al detenerse para un oficial de la ley, ¿en cuál de los siguientes lugares
    debe evitar detenerse?
  choices:
    A: El lado derecho de la carretera
    B: Un estacionamiento bien iluminado
    C: Puentes o pasos elevados
    D: Un acotamiento designado de la carretera
  answer: C
  explanation: 'El manual indica que debe detenerse en el lugar seguro más cercano
    fuera del carril de tráfico y advierte específicamente: "No se detenga en puentes
    o pasos elevados".'
- id: 7
  category: safe_driving_rules
  question: Si la policía lo detiene por la noche, ¿qué acción debe tomar para ayudar
    al oficial?
  choices:
    A: Apagar sus faros por completo
    B: Encender las luces interiores
    C: Salir del vehículo con una linterna
    D: Encender y apagar las luces altas repetidamente
  answer: B
  explanation: Si lo detienen por la noche, encienda las luces interiores para que
    el oficial pueda verlo con mayor claridad.
- id: 8
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿qué tres documentos está obligado a proporcionar
    por la ley de Arkansas cuando el oficial los solicite?
  choices:
    A: Licencia de conducir, comprobante de seguro y registro del vehículo
    B: Licencia de conducir, tarjeta de seguro social y registro del vehículo
    C: Comprobante de seguro, título del vehículo y licencia de conducir
    D: Licencia de conducir, certificado de nacimiento y comprobante de seguro
  answer: A
  explanation: De acuerdo con las leyes de Arkansas, se requiere que proporcione su
    licencia de conducir, comprobante de seguro y registro del vehículo cuando el
    oficial lo solicite.
- id: 9
  category: safe_driving_rules
  question: Si tiene un arma en su vehículo durante una parada de tráfico, ¿cuál es
    el procedimiento adecuado?
  choices:
    A: Alcanzar rápidamente el arma para entregársela al oficial
    B: Esconder el arma debajo del asiento antes de que el oficial se acerque
    C: Informar al oficial sobre el arma, su tipo y ubicación, y no intentar alcanzarla
    D: No decir nada sobre el arma a menos que el oficial registre el vehículo
  answer: C
  explanation: Asegúrese de informar al oficial si hay un arma en el vehículo, el
    tipo de arma y la ubicación. No debe intentar alcanzar el arma y siempre debe
    seguir las instrucciones del oficial.
- id: 10
  category: penalties_and_points
  question: ¿Qué significa firmar una citación de tráfico?
  choices:
    A: Es una admisión de culpabilidad por la infracción de tráfico
    B: Es una promesa de comparecer ante el tribunal o pagar la multa antes de la
      fecha de la audiencia
    C: Renuncia a su derecho de impugnar la citación en el tribunal
    D: Le da permiso al oficial para registrar su vehículo
  answer: B
  explanation: Firmar una citación no es una admisión de culpabilidad. Es una promesa
    de comparecer ante el tribunal en el momento designado o de pagar la multa antes
    de la fecha de la audiencia.
- id: 11
  category: sharing_the_road
  question: Según la ley de Arkansas, ¿qué debe hacer al rebasar un vehículo autorizado
    que se encuentra detenido a un lado de la carretera?
  choices:
    A: Detenerse inmediatamente y esperar a que el oficial le indique que puede pasar
    B: Tocar la bocina para alertar al oficial de su presencia
    C: Mantener su velocidad y permanecer en su carril actual
    D: Moverse al carril más alejado, o reducir su velocidad si cambiar de carril
      no es seguro
  answer: D
  explanation: La ley de Arkansas exige que se mueva al carril o posición más alejada
    del vehículo autorizado al pasar. Si no es seguro o no es posible cambiar de carril,
    debe reducir su velocidad.
- id: 12
  category: driver_testing
  question: ¿Qué tipo de cita debe seleccionar un ciudadano no estadounidense con
    documentos de inmigración para permitir más tiempo con el examinador?
  choices:
    A: Examen de licencia de conducir para diferencias de aprendizaje
    B: Examen de licencia de conducir/permiso de instrucción de motocicleta
    C: Solicitantes de conocimientos de licencia de conducir comercial
    D: Prueba de habilidades de licencia de conducir y motocicleta
  answer: B
  explanation: 'Bajo ''Examen de licencia de conducir/permiso de instrucción de motocicleta'',
    el manual establece: ''Si usted no es ciudadano de los EE. UU. y tiene documentos
    de inmigración, seleccione este tipo de cita. Esto le permitirá tener más tiempo
    con el examinador''.'
- id: 13
  category: driver_testing
  question: ¿Qué adaptación se proporciona al programar un 'Examen de licencia de
    conducir para diferencias de aprendizaje'?
  choices:
    A: Un examen escrito en varios idiomas
    B: Un examen oral con un examinador
    C: Una exención de la prueba de habilidades de conducción
    D: Un examen de conocimientos con libro abierto
  answer: B
  explanation: El tipo de cita 'Examen de licencia de conducir para diferencias de
    aprendizaje' le permitirá programar un examen oral con un examinador.
- id: 14
  category: license_system
  question: ¿Qué se requiere antes de poder realizar la parte de conducción de la
    Prueba de Habilidades de Motocicleta?
  choices:
    A: Debe tener una licencia Clase D durante al menos un año
    B: Debe haber completado el Examen de Conocimientos y la motocicleta debe ser
      transportada o conducida por alguien con un endoso 'M'
    C: Debe presentar un certificado de un curso de seguridad en motocicleta aprobado
    D: Primero debe aprobar un examen de habilidades comerciales
  answer: B
  explanation: 'Para la Prueba de Habilidades de Licencia de Conducir y Motocicleta,
    el manual establece: ''Motocicletas: debe tener un Examen de Conocimientos completado
    y su motocicleta debe ser transportada al centro de pruebas o conducida por una
    persona con un endoso "M"''.'
- id: 15
  category: vehicle_information
  question: ¿Bajo qué condición NO se requiere que un vehículo comercial que transporta
    desechos esté cubierto?
  choices:
    A: Cuando viaja a velocidades inferiores a 35 mph
    B: Cuando transporta predominantemente material metálico cargado de manera que
      se evite su caída
    C: Cuando el vehículo viaja menos de 10 millas hasta el sitio de disposición
    D: Cuando el conductor opera su propio camión personal para uso comercial
  answer: B
  explanation: 'El manual establece: ''Sin embargo, no se requerirá que ningún vehículo
    que transporte predominantemente material metálico esté cubierto si está cargado
    de una manera que evite que el material se caiga o se desprenda del vehículo''.'
- id: 16
  category: driver_testing
  question: ¿Cuál es el nombre de la aplicación oficial de exámenes ofrecida por la
    Policía Estatal de Arkansas?
  choices:
    A: AR DMV Practice
    B: AR Driver Testing
    C: Arkansas Road Rules
    D: ASP Driving Prep
  answer: B
  explanation: Según la introducción del manual, la Policía Estatal de Arkansas ofrece
    una aplicación de exámenes llamada 'AR Driver Testing'.
- id: 17
  category: driver_testing
  question: ¿Cuál es la relación de la Policía Estatal de Arkansas con los sitios
    web de terceros que ofrecen exámenes de práctica?
  choices:
    A: Ellos respaldan todos los exámenes de práctica de terceros.
    B: No están asociados con sitios web de terceros que ofrecen exámenes de práctica.
    C: Exigen que los solicitantes utilicen sitios web de terceros.
    D: Se asocian con sitios web de terceros seleccionados para las pruebas oficiales.
  answer: B
  explanation: 'La introducción del manual establece explícitamente: ''La Policía
    Estatal de Arkansas no está asociada con sitios web de terceros que ofrecen exámenes
    de práctica''.'
- id: 18
  category: license_system
  question: ¿Cuál de los siguientes se enumera como un tipo de licencia graduada en
    Arkansas?
  choices:
    A: Licencia Comercial Clase A
    B: Licencia de Chofer
    C: Licencia Intermedia
    D: Licencia por Dificultad (Hardship License)
  answer: C
  explanation: El índice enumera la 'Licencia Intermedia' bajo la sección de 'Tipos
    de Licencias Graduadas'.
- id: 19
  category: license_system
  question: ¿Qué tipo de vehículo le permite operar una licencia Clase M?
  choices:
    A: Ciclo impulsado por motor
    B: Bicicleta motorizada
    C: Motocicleta
    D: Casa rodante (Motorhome)
  answer: C
  explanation: El índice enumera explícitamente la licencia 'Clase M' como una 'Licencia
    (de Motocicleta)'.
- id: 20
  category: license_system
  question: ¿Qué formulario específico se requiere para los solicitantes de licencia
    de conducir menores de 18 años, junto con la firma de un padre o tutor legal?
  choices:
    A: ASP-33 Declaración Jurada de los Padres y Responsabilidad Financiera y Aceptación
    B: ASP-10 Certificado de Educación Vial
    C: DMV-18 Formulario de Consentimiento para Menores
    D: AR-55 Solicitud de Licencia Provisional
  answer: A
  explanation: El índice enumera el formulario 'ASP-33 Declaración Jurada de los Padres
    y Responsabilidad Financiera y Aceptación' bajo los requisitos para solicitantes
    menores de 18 años.
- id: 21
  category: safe_driving_rules
  question: ¿Cuál de los siguientes temas se clasifica bajo 'Ley de Arkansas' en el
    Capítulo 1 del manual?
  choices:
    A: Regla de giro a la derecha en rojo
    B: Protección contra el humo de segunda mano
    C: Carril central compartido
    D: Puntos ciegos
  answer: B
  explanation: 'La ''Protección contra el humo de segunda mano'' se enumera en el
    Capítulo 1: Ley de Arkansas en el índice de contenidos.'
- id: 22
  category: sharing_the_road
  question: ¿En qué capítulo del manual encontraría información sobre cómo evitar
    la 'Zona No' (No-Zone)?
  choices:
    A: 'Capítulo 3: Conducción general'
    B: 'Capítulo 4: Conducción segura'
    C: 'Capítulo 6: Camiones de remolque'
    D: 'Capítulo 9: Emergencias'
  answer: C
  explanation: '''Cómo evitar la Zona No de los camiones de remolque'' se enumera
    en el Capítulo 6: Camiones de remolque en el índice de contenidos.'
- id: 23
  category: vehicle_information
  question: ¿Cuál de las siguientes se enumera como una emergencia específica del
    vehículo en el Capítulo 9?
  choices:
    A: Quedarse sin gasolina
    B: Acelerador defectuoso
    C: Limpiaparabrisas roto
    D: Batería descargada
  answer: B
  explanation: El 'Acelerador defectuoso' se enumera específicamente bajo Emergencias
    del Vehículo en el Capítulo 9 del índice de contenidos.
- id: 24
  category: driver_testing
  question: De acuerdo con las Pautas del examen de habilidades (Capítulo 10), ¿cuál
    de los siguientes es una parte obligatoria de la inspección de su vehículo?
  choices:
    A: Revisar el radio
    B: Inspeccionar el sistema de escape
    C: Ajustar el aire acondicionado
    D: Revisar la guantera
  answer: B
  explanation: El 'Sistema de escape' se enumera bajo 'Inspección de su vehículo'
    en el Capítulo 10 del índice de contenidos.
- id: 25
  category: license_system
  question: ¿Qué significa una licencia Clase MD en el sistema de licencias de Arkansas?
  choices:
    A: Licencia para tareas medianas (Medium Duty)
    B: Licencia de ciclo impulsado por motor (Motor driven Cycle)
    C: Licencia de conductor médico
    D: Licencia de moto de cross motorizada
  answer: B
  explanation: El índice de contenidos enumera la 'Licencia Clase MD (Ciclo impulsado
    por motor)' bajo los tipos de licencias.
- id: 26
  category: alcohol_drugs_health
  question: '¿Cuál de las siguientes condiciones de salud se enumera específicamente
    en la sección ''Salud'' del Capítulo 8: Aptitud para conducir?'
  choices:
    A: Asma
    B: Epilepsia
    C: Artritis
    D: Migrañas
  answer: B
  explanation: La 'Epilepsia' se enumera como un subtema bajo 'Salud' en el Capítulo
    8 del índice de contenidos.
- id: 27
  category: driver_testing
  question: Según la introducción, ¿cuáles son las dos partes de los exámenes para
    las que este manual le ayuda a prepararse y aprobar?
  choices:
    A: Los exámenes de vista y audición
    B: Los exámenes físicos y psicológicos
    C: Los exámenes de conocimientos y de habilidades (parte de conducción)
    D: Los exámenes escritos y orales
  answer: C
  explanation: La introducción establece que el manual 'le ayudará a prepararse y
    aprobar la parte de conocimientos y de habilidades (parte de conducción) de los
    exámenes'.
- id: 28
  category: safe_driving_rules
  question: ¿Bajo qué sección se analizan las 'Glorietas' (Roundabouts) en el Capítulo
    3 del manual?
  choices:
    A: Estacionamiento
    B: Derecho de paso
    C: Carriles múltiples
    D: Rebasar
  answer: B
  explanation: En el índice de contenidos del Capítulo 3, las 'Glorietas' se enumeran
    como una subsección bajo 'Derecho de paso'.
- id: 29
  category: signs_and_signals
  question: ¿Cuál de las siguientes se clasifica como una 'Señal de control de tráfico'
    en el Capítulo 2?
  choices:
    A: Señal de aspa (Cross Buck)
    B: Señal de No Entrar
    C: Línea de niebla
    D: Carril central compartido
  answer: B
  explanation: La 'Señal de No Entrar' se enumera bajo 'Señales de control de tráfico'
    en el Capítulo 2 del índice de contenidos.
- id: 30
  category: driver_testing
  question: ¿Qué lista de verificación específica se menciona bajo las 'Pautas de
    desempeño' en el Capítulo 10?
  choices:
    A: Lista de verificación de inspección previa al viaje
    B: Lista de verificación de habilidades 1-2-3
    C: Lista de verificación de conducción segura
    D: Lista de verificación de preparación para emergencias
  answer: B
  explanation: La 'Lista de verificación de habilidades 1-2-3' se enumera bajo 'Pautas
    de desempeño' en el Capítulo 10 del índice de contenidos.
- id: 31
  category: driver_testing
  question: ¿De acuerdo con la Ley (ACT) 1289 de 2015, cuál es la tarifa requerida
    por cada examen escrito?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: No hay tarifa para el examen escrito
  answer: A
  explanation: La Ley (ACT) 1289 de 2015 requiere una tarifa de $5.00 por cada examen
    escrito, la cual se suma al costo de su licencia de conducir.
- id: 32
  category: license_system
  question: ¿Cuántos días tiene un nuevo residente de Arkansas para obtener una licencia
    de conducir de Arkansas?
  choices:
    A: 10 días calendario
    B: 15 días calendario
    C: 30 días calendario
    D: 60 días calendario
  answer: C
  explanation: Dentro de los treinta (30) días calendario de convertirse en residente,
    cualquier persona que sea residente de este estado deberá obtener una licencia
    de conducir de Arkansas.
- id: 33
  category: license_system
  question: ¿A cuál de las siguientes personas se le permite conducir en las carreteras
    de Arkansas con una licencia válida de otro estado sin obtener una licencia de
    Arkansas?
  choices:
    A: Un nuevo residente que ha vivido en Arkansas por 45 días
    B: Un no residente que ha estado físicamente presente en el estado por 8 meses
    C: Un estudiante universitario que asiste a clases y es considerado no residente
    D: Cualquier persona mayor de 21 años
  answer: C
  explanation: Los estudiantes que asisten a clases y son considerados no residentes
    bajo las reglas que regulan el pago de la matrícula (por ejemplo, estudiantes
    universitarios o de intercambio) pueden conducir siempre que tengan una licencia
    válida de otro estado.
- id: 34
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción después de aprobar
    el examen de conocimientos?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 4 años
  answer: C
  explanation: El permiso de instrucción se emitirá por 2 (dos) años a partir de la
    fecha en que se aprobó el examen de conocimientos.
- id: 35
  category: safe_driving_rules
  question: Al conducir con un permiso de instrucción, ¿el conductor debe estar acompañado
    por un conductor con licencia que tenga al menos qué edad?
  choices:
    A: 18 años de edad
    B: 19 años de edad
    C: 21 años de edad
    D: 25 años de edad
  answer: C
  explanation: El solicitante con un permiso de instrucción puede conducir con un
    conductor con licencia de veintiún (21) años de edad o más, que esté ocupando
    el asiento al lado del conductor.
- id: 36
  category: vehicle_information
  question: 'Una licencia estándar Clase D le permite operar un vehículo con una clasificación
    de peso bruto (GVWR) inferior a:'
  choices:
    A: 10,000 libras
    B: 16,000 libras
    C: 26,001 libras
    D: 32,000 libras
  answer: C
  explanation: Las licencias Clase D pueden operar un automóvil u otro vehículo de
    cuatro ruedas con una clasificación de peso bruto (GVWR) inferior a 26,001 libras.
- id: 37
  category: license_system
  question: 'Para solicitar una licencia de aprendizaje (Learner''s License), el solicitante
    NO debe haber estado involucrado en un accidente de tráfico ni haber sido condenado
    por una infracción de tráfico grave dentro de los anteriores:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: B
  explanation: Para recibir una licencia de aprendizaje, el solicitante no puede estar
    involucrado en ningún accidente de tráfico ni ser condenado por una infracción
    de tráfico grave dentro de los seis (6) meses anteriores a la solicitud.
- id: 38
  category: safe_driving_rules
  question: ¿Un conductor con una licencia intermedia (Intermediate License) NO puede
    operar un vehículo motorizado con más de cuántos pasajeros menores de edad no
    emparentados, a menos que esté acompañado por un conductor con licencia de 21
    años o más?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Un conductor con una licencia intermedia no debe operar un vehículo
    motorizado con más de un (1) pasajero menor de edad no emparentado, a menos que
    esté acompañado por un conductor con licencia de veintiún (21) años o más.
- id: 39
  category: safe_driving_rules
  question: ¿Entre qué horas tiene prohibido conducir un conductor con una licencia
    intermedia, a menos que esté acompañado por un conductor con licencia de 21 años
    o más o que conduzca a una actividad exenta?
  choices:
    A: 10:00 pm y 5:00 am
    B: 11:00 pm y 4:00 am
    C: Medianoche y 6:00 am
    D: 9:00 pm y 6:00 am
  answer: B
  explanation: Un conductor con una licencia de conducir intermedia no puede operar
    un vehículo motorizado entre las 11:00 pm y las 4:00 am, a menos que esté acompañado
    por un conductor con licencia de veintiún (21) años de edad o más, o que conduzca
    hacia o desde una actividad escolar, actividad de la iglesia, trabajo o una emergencia.
- id: 40
  category: driver_responsibility
  question: ¿Cuáles son las restricciones de teléfono celular para un conductor de
    Clase D que tiene entre 18 y 21 años de edad?
  choices:
    A: Pueden usar un teléfono de mano para cualquier propósito.
    B: Pueden usar un dispositivo de manos libres para comunicación interactiva, pero
      no pueden enviar mensajes de texto.
    C: Tienen completamente prohibido el uso de cualquier dispositivo inalámbrico.
    D: Pueden enviar mensajes de texto solo cuando están detenidos en un semáforo
      en rojo.
  answer: B
  explanation: Un conductor de Clase D que tenga al menos dieciocho (18) pero menos
    de veintiún (21) años de edad puede usar un teléfono inalámbrico de manos libres
    o un dispositivo para comunicación interactiva mientras conduce. Los mensajes
    de texto no están permitidos independientemente de la edad.
- id: 41
  category: driver_testing
  question: 'El examen de habilidades de motocicleta para una licencia Clase M puede
    ser exonerado si el solicitante completa con éxito:'
  choices:
    A: Un curso de conducción defensiva en línea
    B: Un curso para motociclistas de la Motorcycle Safety Foundation (MSF)
    C: 50 horas de conducción supervisada
    D: Un programa de capacitación para conductores comerciales
  answer: B
  explanation: El examen de habilidades de motocicleta puede ser exonerado al completar
    con éxito un curso para motociclistas de la Motorcycle Safety Foundation (MSF).
- id: 42
  category: license_system
  question: ¿Cuál es la edad mínima requerida para que se le otorgue una licencia
    Clase M (Motocicleta) sin restricciones?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: C
  explanation: 'Licencia Clase M (Motocicleta): Esta licencia es una licencia de motocicleta
    sin restricciones que se otorga a personas de dieciséis (16) años de edad o más
    para operar una motocicleta en vías públicas.'
- id: 43
  category: license_system
  question: 'Una licencia Clase MD (Ciclos Impulsados por Motor) es una licencia restringida
    que se otorga a personas con edades comprendidas entre:'
  choices:
    A: 14 y 16
    B: 16 y 18
    C: 15 y 17
    D: 18 y 21
  answer: A
  explanation: 'Clase MD (Ciclos Impulsados por Motor): Esta licencia es una licencia
    restringida que se otorga a personas de entre catorce (14) y dieciséis (16) años
    de edad.'
- id: 44
  category: license_system
  question: ¿Cuál de las siguientes situaciones impediría que una persona obtenga
    una licencia de conducir de Arkansas?
  choices:
    A: Tener 18 años de edad
    B: Tener una licencia de conducir física válida de otro estado
    C: Tener juicios pendientes por una infracción de tráfico en movimiento
    D: Ser miembro de las Fuerzas Armadas en servicio activo
  answer: C
  explanation: Una persona puede obtener una licencia de conducir si... No tiene juicios
    pendientes por una infracción de tráfico en movimiento.
- id: 45
  category: driver_responsibility
  question: Según el manual, ¿qué grupo de edad tiene permitido legalmente enviar
    mensajes de texto mientras conduce?
  choices:
    A: Conductores mayores de 18 años
    B: Conductores mayores de 21 años
    C: Conductores con una licencia Clase D
    D: No se permiten mensajes de texto independientemente de la edad
  answer: D
  explanation: El manual establece explícitamente en la sección de la Licencia Clase
    D que 'No se permiten mensajes de texto independientemente de la edad'.
- id: 46
  category: license_system
  question: ¿Cuál es el desplazamiento máximo del motor que una persona con una licencia
    Clase MD (Impulsada por Motor) tiene restringido operar?
  choices:
    A: 50 centímetros cúbicos o menos
    B: 150 centímetros cúbicos o menos
    C: 250 centímetros cúbicos o menos
    D: 500 centímetros cúbicos o menos
  answer: C
  explanation: Según el manual, la licencia MD está restringida a la operación de
    motocicletas con un desplazamiento de 250 centímetros cúbicos o menos.
- id: 47
  category: driver_testing
  question: ¿Por cuánto tiempo es válido el examen de conocimientos del conductor
    después de haber sido completado con éxito?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: El manual establece que el examen de conocimientos será válido por
    1 (un) año.
- id: 48
  category: driver_testing
  question: ¿Cómo puede un solicitante exonerar el examen de habilidades de vehículos
    impulsados por motor al solicitar una licencia Clase MD?
  choices:
    A: Al poseer una licencia Clase D válida durante al menos un año
    B: Al completar con éxito un curso para motociclistas de la Motorcycle Safety
      Foundation (MSF)
    C: Al aprobar el examen escrito de conocimientos con una puntuación perfecta
    D: Al aprobar un examen de la vista con una visión de 20/20 sin corrección
  answer: B
  explanation: El examen de habilidades de vehículos impulsados por motor puede ser
    exonerado al completar con éxito un curso para motociclistas de la Motorcycle
    Safety Foundation (MSF). El certificado debe entregarse dentro de los 90 días.
- id: 49
  category: license_system
  question: ¿A qué tamaño de motor restringe la operación de una bicicleta motorizada
    o motocicleta un Certificado de Bicicleta Motorizada (MB)?
  choices:
    A: 50 centímetros cúbicos o menos
    B: 100 centímetros cúbicos o menos
    C: 150 centímetros cúbicos o menos
    D: 250 centímetros cúbicos o menos
  answer: A
  explanation: Un Certificado de Bicicleta Motorizada restringe la operación de una
    bicicleta motorizada o motocicleta con un desplazamiento de cincuenta (50) centímetros
    cúbicos o menos.
- id: 50
  category: driver_testing
  question: ¿Cuál es el campo de visión mínimo requerido para un solicitante de licencia
    de conducir con dos ojos funcionales?
  choices:
    A: 90 grados
    B: 105 grados
    C: 120 grados
    D: 140 grados
  answer: D
  explanation: El manual requiere que su campo de visión sea de 140 grados para una
    persona con dos (2) ojos funcionales.
- id: 51
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima sin corrección requerida para recibir
    una licencia de conducir sin restricciones en Arkansas?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/70
  answer: C
  explanation: Se requiere una agudeza visual mínima sin corrección de 20/40 para
    obtener una licencia sin restricciones.
- id: 52
  category: driver_testing
  question: ¿Cuál de los siguientes países tiene un acuerdo de reciprocidad con Arkansas
    y está exento de los exámenes de conducir?
  choices:
    A: México
    B: Alemania
    C: Japón
    D: Reino Unido
  answer: B
  explanation: Alemania figura en el manual como uno de los países exentos de exámenes
    debido a un acuerdo de reciprocidad, junto con Manitoba (Canadá), Francia, Taiwán
    y Corea del Sur.
- id: 53
  category: license_system
  question: ¿Cuántos documentos principales se requieren para un solicitante de licencia
    de conducir de 18 años o más si NO proporciona un documento secundario?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Los solicitantes mayores de dieciocho años deben presentar dos documentos
    principales; O un documento principal y un documento secundario.
- id: 54
  category: license_system
  question: ¿Cuál de los siguientes se considera un documento secundario aceptable
    para solicitantes de 18 años o más?
  choices:
    A: Un formulario W-2
    B: Una declaración de impuestos del IRS de los últimos 2 años
    C: Una tarjeta de cruce fronterizo
    D: Una tarjeta tribal
  answer: B
  explanation: Una declaración de impuestos del IRS de los últimos 2 años es un documento
    secundario aceptado. El manual señala específicamente que el formulario W-2, las
    tarjetas de cruce fronterizo y las tarjetas tribales no son aceptables.
- id: 55
  category: license_system
  question: Para los solicitantes menores de 18 años, ¿cuál de las siguientes afirmaciones
    es verdadera con respecto a su documento de identificación principal?
  choices:
    A: Un certificado de nacimiento del hospital es el documento principal preferido.
    B: Los ciudadanos estadounidenses (menores) no pueden usar un pasaporte estadounidense
      como documento principal.
    C: Una fotocopia del certificado de nacimiento es aceptable si está notariada.
    D: Se acepta un certificado de nacimiento extranjero traducido como documento
      principal.
  answer: B
  explanation: 'El manual establece explícitamente para los solicitantes menores de
    18 años: ''Los ciudadanos estadounidenses (menores) no pueden usar un pasaporte
    estadounidense como documento principal''.'
- id: 56
  category: license_system
  question: ¿Qué tipo de certificado de nacimiento NO se acepta para un menor que
    solicita una licencia de conducir?
  choices:
    A: Un certificado de nacimiento original de EE. UU.
    B: Una copia certificada de un certificado de nacimiento de EE. UU.
    C: Un certificado de nacimiento de hospital
    D: Un certificado de nacimiento en el extranjero
  answer: C
  explanation: El manual establece que para los menores, 'No se aceptarán certificados
    de nacimiento de hospitales ni tarjetas de registro de nacimiento'.
- id: 57
  category: penalties_and_points
  question: Según la ley de Arkansas, ¿cuál es la multa máxima por una infracción
    del cinturón de seguridad, excluyendo los costos o cargos judiciales?
  choices:
    A: $15.00
    B: $25.00
    C: $50.00
    D: $100.00
  answer: B
  explanation: Cualquier persona que viole la ley del cinturón de seguridad estará
    sujeta a una multa que no excederá los veinticinco dólares ($25.00), además de
    cualquier costo o cargo judicial.
- id: 58
  category: safe_driving_rules
  question: 'De acuerdo con la Ley de Protección de Niños Pasajeros (Child Passenger
    Protection Act), un niño debe estar asegurado en un asiento de seguridad para
    niños si tiene menos de seis (6) años y pesa menos de:'
  choices:
    A: 40 libras
    B: 50 libras
    C: 60 libras
    D: 80 libras
  answer: C
  explanation: Un niño que tenga menos de seis (6) años y que pese menos de sesenta
    (60) libras deberá estar sujeto en un asiento de seguridad para niños.
- id: 59
  category: safe_driving_rules
  question: ¿Hasta qué edad deben todos los niños usar sistemas de retención de seguridad
    adecuados mientras un vehículo está en movimiento?
  choices:
    A: Menores de 12 años
    B: Menores de 15 años
    C: Menores de 16 años
    D: Menores de 18 años
  answer: B
  explanation: El manual establece que todos los niños menores de quince (15) años
    deben usar sistemas de retención de seguridad adecuados mientras el vehículo esté
    en movimiento.
- id: 60
  category: safe_driving_rules
  question: 'Bajo la Ley de Protección contra el Humo de Segunda Mano para Niños (Protection
    from Secondhand Smoke for Children Act), es ilegal fumar tabaco a sabiendas en
    un vehículo motorizado si un pasajero es un niño menor de:'
  choices:
    A: 6 años
    B: 10 años
    C: 14 años
    D: 18 años
  answer: C
  explanation: Una persona no debe fumar tabaco a sabiendas en ningún vehículo motorizado
    en el que un niño menor de catorce (14) años sea pasajero.
- id: 61
  category: penalties_and_points
  question: ¿Cuál es la multa máxima para un pasajero del asiento delantero que infringe
    la ley del cinturón de seguridad?
  choices:
    A: $10.00
    B: $25.00
    C: $50.00
    D: $100.00
  answer: B
  explanation: Según el manual, cualquier persona que infrinja la ley del cinturón
    de seguridad estará sujeta a una multa que no excederá los veinticinco dólares
    ($25.00), más cualquier costo o cargo judicial.
- id: 62
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera condena por arrojar basura en Arkansas?
  choices:
    A: Una multa de hasta $500 y 4 horas de servicio comunitario
    B: Una multa de hasta $1,000 y no más de 8 horas de servicio comunitario
    C: Una multa de hasta $2,000 y 24 horas de servicio comunitario
    D: Una multa de hasta $100 y sin servicio comunitario
  answer: B
  explanation: Tras la condena, los infractores por primera vez por arrojar basura
    están sujetos a una multa de hasta $1,000 y no más de ocho horas de servicio comunitario.
- id: 63
  category: safe_driving_rules
  question: Cuando se deja un vehículo afuera en el calor, ¿cuánto aumenta la temperatura
    interior cada nueve minutos?
  choices:
    A: 5 grados
    B: 10 grados
    C: 15 grados
    D: 20 grados
  answer: C
  explanation: El manual establece que por cada nueve (9) minutos, la temperatura
    interior de un vehículo aumenta quince (15) grados.
- id: 64
  category: safe_driving_rules
  question: ¿Qué debe hacer si se encuentra en una intersección cuando se aproxima
    un vehículo de emergencia con sus luces intermitentes y sirenas?
  choices:
    A: Detenerse inmediatamente en medio de la intersección
    B: Retroceder para salir de la intersección
    C: Orillarse al borde derecho mientras aún está en la intersección
    D: Cruzar la intersección antes de orillarse
  answer: D
  explanation: Si se encuentra en una intersección cuando se aproxima un vehículo
    de emergencia, debe continuar y cruzar la intersección antes de orillarse en el
    borde derecho de la carretera.
- id: 65
  category: sharing_the_road
  question: Bajo la Ley de Moverse al Carril de al Lado (Move Over Law), ¿qué debe
    hacer un conductor en una carretera de varios carriles al acercarse a un vehículo
    de las fuerzas del orden detenido con sus luces encendidas?
  choices:
    A: Detenerse inmediatamente en su carril actual
    B: Cambiarse al carril más alejado del vehículo detenido siempre que sea posible
    C: Mantener su carril pero reducir la velocidad a 10 mph
    D: Tocar la bocina para reconocer al oficial
  answer: B
  explanation: La ley de Arkansas exige que cualquier vehículo motorizado en una carretera
    de varios carriles se mueva, siempre que sea posible, al carril más alejado de
    cualquier vehículo de las fuerzas del orden detenido con sus luces encendidas.
- id: 66
  category: sharing_the_road
  question: ¿Cuándo NO se requiere que los conductores se detengan ante un autobús
    escolar con sus luces rojas intermitentes?
  choices:
    A: Cuando el autobús escolar está en el mismo carril de tráfico
    B: Al acercarse por un carril de circulación opuesto separado por una mediana
      de 20 pies o más de ancho
    C: Al acercarse por un carril de circulación opuesto separado por una mediana
      de menos de 10 pies de ancho
    D: Cuando el conductor está operando un vehículo motorizado comercial
  answer: B
  explanation: No se requiere que los conductores se detengan si el autobús escolar
    se aproxima por un carril de circulación opuesto separado por una mediana de veinte
    (20) pies o más de ancho.
- id: 67
  category: safe_driving_rules
  question: ¿En cuál de los siguientes lugares los autobuses escolares siempre están
    obligados a detenerse?
  choices:
    A: Todos los cruces peatonales
    B: Todas las rampas de entrada a la autopista
    C: Todos los cruces de ferrocarril
    D: Todas las intersecciones con una señal de ceda el paso
  answer: C
  explanation: Según el manual, los autobuses escolares están obligados a detenerse
    en todos los cruces de ferrocarril.
- id: 68
  category: penalties_and_points
  question: Bajo la Ley de Isaac (Isaac's Law), ¿cuál es la sanción si un conductor
    rebasa ilegalmente a un autobús escolar detenido y causa negligentemente la muerte
    de otra persona?
  choices:
    A: Delito menor de Clase A
    B: Delito grave de Clase C
    C: Delito grave de Clase B
    D: Una multa de $1,000 y 90 días de cárcel
  answer: B
  explanation: La Ley de Isaac establece que una persona que infrinja esta ley está
    sujeta a un Delito Grave de Clase C por homicidio negligente si causa negligentemente
    la muerte de otra persona.
- id: 69
  category: driver_responsibility
  question: ¿Dónde debe exhibirse el Certificado Especial de discapacidad en el vehículo?
  choices:
    A: Sujeto a la placa de matrícula trasera
    B: Colgado del espejo retrovisor o en el tablero
    C: En la ventana del lado del conductor
    D: Guardado dentro de la guantera
  answer: B
  explanation: Las personas con Certificados Especiales deben exhibir el certificado
    colgado del espejo retrovisor o en el tablero.
- id: 70
  category: driver_responsibility
  question: ¿Qué se debe comprar por $5.00 cuando una persona con discapacidad obtiene
    un certificado especial o una placa de matrícula especial?
  choices:
    A: Un marco de placa de matrícula especializado
    B: Un formulario de autorización médica
    C: Una tarjeta de identificación con foto
    D: Un registro de vehículo secundario
  answer: C
  explanation: Cuando una persona con discapacidad obtiene un certificado especial
    o una placa de matrícula especial, se debe comprar una tarjeta de identificación
    con foto por $5.00.
- id: 71
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por el uso ilegal del certificado
    especial para personas con discapacidad de otra persona?
  choices:
    A: Un mínimo de $100 sin exceder los $500
    B: Un mínimo de $250 sin exceder los $1000
    C: Una suspensión de la licencia de conducir por 6 meses
    D: Una advertencia y la confiscación del certificado
  answer: A
  explanation: Cualquier persona que utilice ilegalmente el certificado especial de
    otra persona ha cometido fraude. La sanción por una primera infracción es un mínimo
    de $100.00 sin exceder los $500.
- id: 72
  category: driver_responsibility
  question: ¿Cuándo debe devolverse un Certificado Especial para personas con discapacidad
    al Departamento de Vehículos Motorizados (DMV)?
  choices:
    A: Dentro de los 10 días posteriores a la compra de un vehículo nuevo
    B: Dentro de los 30 días posteriores a una mudanza o en caso de fallecimiento
    C: Cada año en el cumpleaños de la persona con discapacidad
    D: Dentro de los 60 días posteriores a un cambio en la condición médica
  answer: B
  explanation: Los Certificados Especiales deben devolverse al Departamento de Vehículos
    Motorizados, División Especial, dentro de los treinta (30) días posteriores a
    una mudanza o en caso de fallecimiento.
- id: 73
  category: sharing_the_road
  question: Si un autobús escolar se detiene con sus luces rojas intermitentes en
    una carretera separada por una mediana que tiene menos de 20 pies de ancho, ¿quién
    está obligado a detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico en los carriles opuestos
    C: Todos los carriles de tráfico
    D: Solo los vehículos motorizados comerciales
  answer: C
  explanation: Si la mediana es de menos de 20 pies, todos los carriles de tráfico
    deben detenerse ante un autobús escolar que tenga sus luces rojas intermitentes
    encendidas.
- id: 74
  category: safe_driving_rules
  question: En un día de 90 grados, ¿cuánto tiempo tarda la temperatura dentro de
    un vehículo en alcanzar la temperatura del exterior?
  choices:
    A: 2 minutos
    B: 5 minutos
    C: 10 minutos
    D: 15 minutos
  answer: B
  explanation: El manual establece que, en un día de 90 grados, la temperatura dentro
    de un vehículo alcanza la del exterior en cinco minutos.
- id: 75
  category: defensive_driving
  question: Según el manual, ¿cuánto aumentaron los choques en zonas de obras en Arkansas
    entre 2018 y 2021?
  choices:
    A: Más del 25%
    B: Más del 50%
    C: Más del 70%
    D: Más del 90%
  answer: C
  explanation: De 2018 a 2021, los choques en zonas de obras aumentaron más del 70%
    en Arkansas.
- id: 76
  category: safe_driving_rules
  question: Según investigaciones nacionales, ¿qué tan probable es que los adolescentes
    distraídos que envían mensajes de texto mientras conducen se vean involucrados
    en un choque?
  choices:
    A: 5 veces más probable
    B: 10 veces más probable
    C: 23 veces más probable
    D: 50 veces más probable
  answer: C
  explanation: Investigaciones nacionales han encontrado que los adolescentes distraídos
    que envían mensajes de texto mientras conducen tienen 23 veces más probabilidades
    de verse involucrados en un choque.
- id: 77
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un ejemplo de una "zona de obras móvil"?
  choices:
    A: Un proyecto de reemplazo de un puente que dura dos años
    B: Una cuadrilla de mantenimiento de carreteras pintando franjas en la calzada
    C: Una estación de pesaje permanente
    D: Una ruta de desvío a través de un vecindario residencial
  answer: B
  explanation: Una zona de obras móvil existe donde el trabajo se realiza por un período
    corto o se desplaza a velocidades lentas con paradas periódicas, como una cuadrilla
    de mantenimiento de carreteras pintando franjas en la calzada, retirando escombros
    o tapando baches.
- id: 78
  category: vehicle_information
  question: ¿Qué color de luces intermitentes ha autorizado recientemente la Legislatura
    de Arkansas para su uso en vehículos de construcción y mantenimiento de carreteras
    para indicar una zona de obras activa?
  choices:
    A: Luces azules
    B: Luces rojas
    C: Luces verdes
    D: Luces moradas
  answer: C
  explanation: La Legislatura de Arkansas autorizó recientemente el uso de luces verdes
    intermitentes en vehículos de construcción y mantenimiento de carreteras para
    indicar una zona de obras activa.
- id: 79
  category: signs_and_signals
  question: ¿Qué formas y colores de fondo se utilizan normalmente para las señales
    de zonas de obras?
  choices:
    A: Circulares o triangulares con fondo rojo o azul
    B: De diamante o rectangulares con fondo naranja, blanco o negro
    C: Octogonales con fondo rojo
    D: En forma de banderín con fondo amarillo
  answer: B
  explanation: Las señales de zona de obras pueden tener forma de diamante o rectangular,
    y el fondo puede ser naranja, blanco o negro con letras o símbolos blancos o negros.
- id: 80
  category: penalties_and_points
  question: ¿Cuál es la sanción por recibir una citación por una infracción de tránsito
    en movimiento en una zona de obras cuando hay trabajadores presentes?
  choices:
    A: La multa se reduce a la mitad
    B: La multa se duplica
    C: La licencia de conducir se revoca de inmediato
    D: El conductor debe asistir a la escuela de tránsito sin pagar multa
  answer: B
  explanation: Si un conductor recibe una citación por cualquier infracción de tránsito
    en movimiento en una zona de obras cuando hay trabajadores presentes, pagará el
    doble de la multa.
- id: 81
  category: penalties_and_points
  question: 'Dependiendo de la infracción de tráfico, las multas duplicadas en una
    zona de obras de Arkansas pueden llegar a ser de hasta:'
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: D
  explanation: Dependiendo de la infracción de tráfico, las multas duplicadas en una
    zona de obras pueden llegar a ser de hasta $5,000.
- id: 82
  category: driver_responsibility
  question: ¿Se considera una infracción de tráfico en movimiento el hecho de sostener
    el teléfono para buscar direcciones o navegar por las redes sociales mientras
    se conduce por una zona de obras?
  choices:
    A: No, siempre que conduzca por debajo del límite de velocidad
    B: Sí, a menos que esté detenido en un semáforo en rojo
    C: Sí, si no puede usar una conexión de manos libres, no debe usar su teléfono
    D: No, el uso de una aplicación de GPS o mapas está exento de la norma
  answer: C
  explanation: Sostener el teléfono para atender una llamada, enviar un mensaje de
    texto, buscar direcciones o navegar por las redes sociales cuenta como una infracción
    de tráfico en movimiento. Si no puede usar una conexión de manos libres mientras
    conduce, no use su teléfono.
- id: 83
  category: safe_driving_rules
  question: ¿Cómo se utilizan normalmente las cámaras de control de velocidad en las
    zonas de obras de las autopistas interestatales de Arkansas?
  choices:
    A: Envían automáticamente las multas por correo al propietario registrado sin
      intervención policial
    B: Un oficial se sitúa al final de la zona de obras para observar las infracciones
      en la cámara y detener al infractor cuando sale
    C: Solo se utilizan por la noche cuando no hay trabajadores presentes
    D: Sustituyen a todas las señales de advertencia en la zona de obras
  answer: B
  explanation: Las cámaras de control de velocidad permiten que un oficial se sitúe
    al final de una zona de obras, utilice la cámara para observar las infracciones
    dentro de la zona y detenga de forma segura al infractor cuando este sale.
- id: 84
  category: defensive_driving
  question: Al acercarse a una zona de obras con carriles cerrados más adelante, ¿cuándo
    debe cambiarse al carril correcto?
  choices:
    A: En el punto exacto donde termina el carril
    B: Tan pronto como sea seguro hacerlo, idealmente una milla o más antes del cierre
    C: Solo después de pasar el primer barril de construcción
    D: Inmediatamente después de que el señalero (flagger) le indique que pase
  answer: B
  explanation: Si ve cierres de carriles más adelante, debe incorporarse temprano
    cambiándose al carril correcto tan pronto como sea seguro hacerlo, idealmente
    una milla o más antes del cierre.
- id: 85
  category: sharing_the_road
  question: Según la ley 'Move Over' (hacerse a un lado), ¿qué debe hacer si no es
    seguro o es imposible cambiar de carril para alejarse de un vehículo detenido
    con luces intermitentes?
  choices:
    A: Detenerse por completo en su carril hasta que el vehículo se retire
    B: Tocar la bocina para alertar a los trabajadores y mantener su velocidad
    C: Reducir su velocidad a un nivel seguro para las condiciones o a la velocidad
      legalmente obligatoria
    D: Acelerar para rebasar el vehículo detenido lo más rápido posible
  answer: C
  explanation: Si cambiarse de carril no es seguro o es imposible, la ley 'Move Over'
    exige que reduzca su velocidad a un nivel seguro para las condiciones o a la velocidad
    legalmente obligatoria.
- id: 86
  category: sharing_the_road
  question: Además de los vehículos de policía, bomberos y ambulancias, ¿cuáles de
    los siguientes vehículos están cubiertos por la ley 'Move Over' de Arkansas?
  choices:
    A: Autobuses escolares y autobuses de transporte público
    B: Vehículos del Departamento de Transporte de Arkansas (ARDOT), vehículos de
      servicios públicos, vehículos de construcción y grúas
    C: Cualquier vehículo de pasajeros estacionado en el arcén (hombro)
    D: Camiones de reparto y vehículos postales
  answer: B
  explanation: Arkansas ha ampliado la ley 'Move Over' para incluir otros vehículos
    con luces intermitentes, como los vehículos del ARDOT, vehículos de servicios
    públicos, vehículos de construcción y grúas.
- id: 87
  category: signs_and_signals
  question: Al transitar por una zona de obras, ¿qué relación tienen las instrucciones
    de un señalero (flagger) con otras señales o dispositivos de tráfico?
  choices:
    A: Las instrucciones del señalero deben ignorarse si contradicen un semáforo
    B: Las instrucciones del señalero prevalecen sobre cualquier otra señal o dispositivo
      de tráfico
    C: Las instrucciones del señalero son solo sugerencias y no son legalmente vinculantes
    D: Las instrucciones del señalero solo se aplican a los vehículos comerciales
  answer: B
  explanation: Siempre debe obedecer las señales o indicaciones del señalero. Sus
    instrucciones prevalecen sobre cualquier otra señal o dispositivo de tráfico.
- id: 88
  category: safe_driving_rules
  question: Cuando un señalero (flagger) le indique que se detenga en una zona de
    obras, ¿a qué distancia del señalero debe detener su vehículo?
  choices:
    A: Justo al lado del señalero para poder escuchar sus instrucciones
    B: Al menos a la distancia de un vehículo del señalero
    C: Al menos a 100 pies de distancia del señalero
    D: Exactamente a la distancia de tres vehículos
  answer: B
  explanation: Al detenerse ante un señalero, debe hacerlo en el lugar designado,
    o al menos a la distancia de un vehículo del señalero, y esperar las instrucciones
    para continuar.
- id: 89
  category: safe_driving_rules
  question: ¿Qué límite de velocidad debe obedecer si conduce por una zona de obras
    y no hay límites de velocidad reducidos publicados?
  choices:
    A: 45 mph
    B: 15 mph por debajo del límite de velocidad normal
    C: El límite de velocidad normalmente publicado
    D: 25 mph
  answer: C
  explanation: Si no hay límites de velocidad reducidos publicados dentro de la zona
    de obras, los conductores deben obedecer el límite de velocidad normalmente publicado.
- id: 90
  category: signs_and_signals
  question: ¿Cómo se marcan normalmente las zonas de obras móviles en la parte trasera
    de los vehículos del Departamento de Transporte de Arkansas (ARDOT)?
  choices:
    A: Con un letrero que dice 'Pass With Care' (Rebase con cuidado)
    B: Con un letrero que indica 'Work Zone – Fines Double' (Zona de obras – Multas
      se duplican)
    C: Con una señal de ceda el paso triangular roja y blanca
    D: Con un letrero que dice 'End of Work Zone' (Fin de la zona de obras)
  answer: B
  explanation: Los vehículos de trabajo en una zona de obras móvil tendrán letreros
    en la parte trasera que indican 'Work Zone – Fines Double' (Zona de obras – Multas
    se duplican).
- id: 91
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor si está detenido en una intersección controlada
    cuando la luz cambia a verde?
  choices:
    A: Avanzar inmediatamente para reclamar el derecho de paso
    B: Permitir que el tráfico opuesto que ya se encuentra en la intersección despeje
      antes de avanzar
    C: Tocar la bocina para advertir a otros conductores antes de avanzar
    D: Girar a la derecha en verde sin verificar si hay peatones
  answer: B
  explanation: El manual establece que si un conductor está detenido en una intersección
    controlada con luz verde, el conductor debe permitir que el tráfico opuesto que
    ya se encuentra en la intersección despeje antes de avanzar.
- id: 92
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente en un semáforo?
  choices:
    A: Los giros a la izquierda están protegidos y el tráfico opuesto debe detenerse
    B: La señal se está preparando para cambiar a rojo
    C: Se permiten los giros a la izquierda, pero los conductores deben ceder el paso
      al tráfico que viene en sentido contrario y a los peatones
    D: No puede girar en la dirección de la flecha
  answer: C
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero los conductores deben ceder el paso al tráfico que viene
    en sentido contrario y a los peatones, y luego avanzar con precaución.
- id: 93
  category: signs_and_signals
  question: ¿Cómo debe tratar un conductor un semáforo con luz roja intermitente?
  choices:
    A: De la misma manera que una señal de ceder el paso
    B: De la misma manera que una señal de alto (stop)
    C: Reducir la velocidad y avanzar con precaución
    D: Detenerse solo si hay peatones presentes
  answer: B
  explanation: Según el manual, una luz roja intermitente es lo mismo que una señal
    de alto. El conductor debe detenerse por completo y luego avanzar solo cuando
    sea seguro hacerlo.
- id: 94
  category: safe_driving_rules
  question: Al tener la intención de girar a la derecha con luz roja, ¿qué debe hacer
    primero un conductor?
  choices:
    A: Reducir la velocidad a 10 mph y ceder el paso al tráfico
    B: Hacer una parada completa y verificar el tráfico opuesto y los peatones
    C: Tocar la bocina para alertar a los peatones en el cruce peatonal
    D: Avanzar sin detenerse si el carril está despejado
  answer: B
  explanation: Al acercarse a una intersección con luz roja y tener la intención de
    girar a la derecha, se debe realizar una parada completa y verificar el tráfico
    opuesto antes de girar. Los conductores también deben buscar peatones.
- id: 95
  category: defensive_driving
  question: 'Si se aproxima a una señal de alto y hay obstáculos que bloquean su vista
    de la intersección, usted debe:'
  choices:
    A: Atravesar la intersección a una velocidad muy lenta
    B: Tocar la bocina y conducir a través de la intersección
    C: Hacer una parada completa y avanzar un poco para ver
    D: Ceder el paso sin detenerse y mirar hacia ambos lados
  answer: C
  explanation: Si se aproxima a una señal de alto y hay obstáculos que bloquean su
    vista, debe hacer una parada completa y avanzar un poco para ver. Puede avanzar
    cuando sea seguro hacerlo.
- id: 96
  category: safe_driving_rules
  question: Si un juez del condado no ha establecido un límite de velocidad en una
    carretera del condado, ¿cuál es el límite de velocidad predeterminado?
  choices:
    A: 30 mph
    B: 40 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Si un juez del condado no ha establecido un límite de velocidad en
    una carretera del condado dentro de su jurisdicción, el límite de velocidad será
    de cuarenta millas por hora (40 m.p.h.).
- id: 97
  category: penalties_and_points
  question: 'El exceso de velocidad de más de 15 mph sobre el límite de velocidad
    indicado en una carretera del condado se considera un:'
  choices:
    A: Felonía de Clase A
    B: Delito menor de Clase B
    C: Delito menor de Clase C
    D: Solo una infracción de advertencia
  answer: C
  explanation: Una persona que sea declarada culpable de exceso de velocidad de más
    de quince millas por hora (15 m.p.h.) sobre el límite de velocidad indicado en
    una carretera del condado es culpable de un delito menor de Clase C.
- id: 98
  category: penalties_and_points
  question: ¿Cuál es la posible sanción para un conductor que no cede el paso en una
    señal de ceder el paso?
  choices:
    A: Una multa de hasta $500 y 30 días de cárcel
    B: Una multa de hasta $1000 y la suspensión de su licencia de conducir por 180
      días
    C: Una multa de $250 y escuela de tráfico obligatoria
    D: Suspensión de su licencia de conducir por 1 año
  answer: B
  explanation: Un conductor que no ceda el paso podría recibir una multa de hasta
    $1000 y la suspensión de su licencia de conducir por 180 días.
- id: 99
  category: signs_and_signals
  question: ¿Qué indica un triángulo naranja reflectante con borde rojo?
  choices:
    A: Hay una zona de construcción más adelante
    B: El vehículo transporta materiales peligrosos
    C: El vehículo viaja más lento que la velocidad normal del tráfico
    D: Se está aproximando a una señal de ceder el paso
  answer: C
  explanation: Un triángulo naranja reflectante con borde rojo es una señal de vehículo
    de movimiento lento, que advierte a otros usuarios de la vía que el vehículo viaja
    más lento que la velocidad normal del tráfico.
- id: 100
  category: signs_and_signals
  question: ¿Cuál es el color y la forma típicos de una señal de advertencia?
  choices:
    A: Rectángulo blanco con letras negras
    B: Octágono rojo con letras blancas
    C: Amarilla con letras o símbolos negros, mayormente en forma de diamante
    D: Rectángulo verde con letras blancas
  answer: C
  explanation: Las señales de advertencia son amarillas con letras o símbolos negros,
    y la mayoría tiene forma de diamante. Advierten al conductor que reduzca la velocidad
    y se prepare para detenerse o proporcionan información sobre un peligro.
- id: 101
  category: signs_and_signals
  question: En una señal de reglamentación, ¿qué significa un círculo rojo con una
    franja diagonal roja sobre un símbolo?
  choices:
    A: La maniobra es recomendada pero no obligatoria
    B: El conductor tiene prohibido realizar esa maniobra en particular
    C: La carretera está cerrada más adelante
    D: Ceda el paso al tráfico que viene en sentido contrario antes de realizar la
      maniobra
  answer: B
  explanation: Un círculo rojo con una franja roja sobre el símbolo indica que el
    conductor tiene prohibido (no se le permite) realizar una maniobra en particular,
    como un giro hacia una dirección específica o la prohibición de dar vuelta en
    U.
- id: 102
  category: vehicle_information
  question: Si su vehículo está equipado con una transmisión manual, ¿qué se recomienda
    al cruzar vías del ferrocarril?
  choices:
    A: Cambiar a una marcha más alta para cruzar rápidamente
    B: Poner punto muerto (neutral) y cruzar las vías por inercia
    C: No cambiar de marcha al cruzar las vías para evitar que el motor se apague
    D: Reducir la marcha mientras está en las vías para mantener el control
  answer: C
  explanation: Si su vehículo está equipado con una transmisión manual, es prudente
    no cambiar de marcha al cruzar las vías para evitar la posibilidad de que el motor
    se apague.
- id: 103
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado por ley a detenerse en
    todos los cruces ferroviarios?
  choices:
    A: Automóviles de pasajeros
    B: Motocicletas
    C: Autobuses escolares
    D: Camionetas que remolcan remolques
  answer: C
  explanation: El manual establece explícitamente que los autobuses escolares deben
    detenerse en todos los cruces ferroviarios.
- id: 104
  category: defensive_driving
  question: ¿Qué debe hacer si las barreras del cruce ferroviario comienzan a bajar
    cuando usted ya ha comenzado a cruzar las vías?
  choices:
    A: Detenerse inmediatamente en las vías y dar marcha atrás
    B: Continuar avanzando incluso si eso significa que romperá la barrera
    C: Poner su vehículo en estacionamiento (P) y salir del vehículo
    D: Detenerse y esperar a que la barrera vuelva a subir
  answer: B
  explanation: Si las barreras comienzan a bajar cuando usted empieza a cruzar, continúe
    avanzando incluso si eso significa que romperá la barrera. No es seguro detenerse
    en las vías.
- id: 105
  category: signs_and_signals
  question: ¿Qué indica una señal blanca en forma de 'X' con letras negras en un cruce
    ferroviario?
  choices:
    A: Es una señal de advertencia anticipada para reducir la velocidad
    B: Marca el cruce a nivel y requiere que usted ceda el derecho de paso al tren
    C: Indica que el cruce no tiene trenes activos
    D: Significa que debe detenerse independientemente de si viene un tren
  answer: B
  explanation: La señal de aspa (Cross Buck) es una señal blanca en forma de 'X' con
    letras negras. Esta señal marca el cruce a nivel y requiere que usted ceda el
    derecho de paso al tren.
- id: 106
  category: signs_and_signals
  question: ¿Qué indica una señal de EXENTO (EXEMPT) en un cruce ferroviario?
  choices:
    A: El cruce solo es utilizado por trenes de pasajeros de alta velocidad.
    B: Usted está exento del límite de velocidad en esta zona.
    C: El cruce ha sido abandonado o su uso ha sido descontinuado.
    D: Solo los vehículos comerciales deben detenerse en este cruce.
  answer: C
  explanation: Una señal de EXENTO (EXEMPT) significa que el cruce ha sido abandonado
    o su uso ha sido descontinuado, y usted debe seguir el procedimiento local sobre
    detenerse.
- id: 107
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla doble continua en el centro de la calzada?
  choices:
    A: Se permite rebasar a los vehículos que viajan en cualquier dirección.
    B: Se prohíbe rebasar a los vehículos que viajan en cualquier dirección.
    C: El carril está designado como un carril central compartido para girar.
    D: Usted está viajando en una calle de un solo sentido.
  answer: B
  explanation: Una línea amarilla doble continua en el centro de la calzada significa
    que está prohibido rebasar para los vehículos que viajan en cualquier dirección.
- id: 108
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia puede un conductor cruzar una línea amarilla doble
    continua?
  choices:
    A: Para rebasar a un vehículo lento si el camino adelante está despejado.
    B: Para girar hacia una entrada privada si no se aproxima tráfico en sentido contrario.
    C: Para dar una vuelta en U en cualquier intersección.
    D: Nunca está permitido cruzar una línea amarilla doble continua.
  answer: B
  explanation: El manual establece que un conductor puede cruzar una línea amarilla
    continua para girar hacia una entrada privada si no se aproxima tráfico en sentido
    contrario al lugar del giro planeado.
- id: 109
  category: safe_driving_rules
  question: 'En Arkansas, NO está permitido usar el carril central compartido para
    girar a la izquierda como un:'
  choices:
    A: Carril de aceleración.
    B: Maniobra para acceder a los carriles de tráfico.
    C: Carril para realizar un giro a la izquierda desde una calle transversal.
    D: Carril para realizar un giro a la izquierda desde una entrada privada.
  answer: A
  explanation: En Arkansas, está permitido utilizar un carril de giro central para
    incorporarse a los carriles de tráfico, excepto que no está permitido usar el
    carril central de giro a la izquierda como carril de aceleración.
- id: 110
  category: defensive_driving
  question: Si se pasa de su giro o salida mientras conduce, ¿cuál es la acción más
    segura y legal a tomar?
  choices:
    A: Dar marcha atrás con cuidado en el carril de circulación.
    B: Detenerse en el carril de circulación y esperar a que el tráfico se despeje
      antes de retroceder.
    C: Conducir por el acotamiento (hombro) para retroceder hasta su salida.
    D: No dé marcha atrás; continúe hasta un área de retorno segura.
  answer: D
  explanation: Nunca dé marcha atrás con un vehículo en ningún carril de circulación,
    es ilegal y peligroso. Si se pasa de su giro o salida, no dé marcha atrás; continúe
    hasta un área de retorno segura.
- id: 111
  category: safe_driving_rules
  question: ¿En una carretera con tres o más carriles que circulan en la misma dirección,
    en qué carril debe permanecer excepto al rebasar?
  choices:
    A: El carril izquierdo
    B: El carril central
    C: El carril derecho
    D: El carril central compartido
  answer: C
  explanation: En una carretera con tres o más carriles que circulan en la misma dirección,
    permanezca en el carril derecho excepto para rebasar.
- id: 112
  category: safe_driving_rules
  question: 'Cuando no hay señales ni marcas en el carril para controlar los giros,
    el conductor debe girar hacia:'
  choices:
    A: El carril más alejado de la dirección de viaje.
    B: El carril más cercano a la dirección de viaje.
    C: El carril central independientemente de la dirección.
    D: El carril de tráfico opuesto para hacer un giro amplio.
  answer: B
  explanation: Cuando no hay señales ni marcas en el carril para controlar los giros,
    el conductor debe girar hacia el carril más cercano a la dirección de viaje.
- id: 113
  category: defensive_driving
  question: ¿Qué debe hacer si lo siguen demasiado de cerca en una carretera de varios
    carriles?
  choices:
    A: Frenar repentinamente para advertir al conductor detrás de usted.
    B: Moverse al carril a su derecha cuando esté despejado.
    C: Aumentar la velocidad para incrementar la distancia entre los vehículos.
    D: Moverse al carril del extremo izquierdo.
  answer: B
  explanation: Si lo siguen demasiado de cerca en una carretera de varios carriles,
    debe moverse al carril a su derecha cuando esté despejado.
- id: 114
  category: sharing_the_road
  question: ¿A cuál de los siguientes peatones se le debe dar el derecho de paso absoluto?
  choices:
    A: Peatones que cruzan fuera de un paso de peatones marcado.
    B: Peatones que llevan un bastón blanco o usan un perro guía.
    C: Peatones que caminan por el lado derecho de la calzada.
    D: Peatones que cruzan una intersección con luz verde.
  answer: B
  explanation: Se debe dar el derecho de paso absoluto a los peatones que lleven un
    bastón blanco o utilicen un perro guía.
- id: 115
  category: safe_driving_rules
  question: 'Al realizar un giro a la izquierda en una intersección, el conductor
    debe ceder el paso a:'
  choices:
    A: Vehículos que giran a la derecha desde la calle transversal.
    B: Peatones en la acera detrás de ellos.
    C: Vehículos que vienen en sentido contrario y circulan recto.
    D: Vehículos que se aproximan por detrás.
  answer: C
  explanation: Los conductores que giran a la izquierda deben ceder el paso a los
    vehículos que vienen en sentido contrario y circulan recto.
- id: 116
  category: safe_driving_rules
  question: En una intersección donde no hay señal de alto (stop) ni semáforo, ¿qué
    vehículo tiene el derecho de paso?
  choices:
    A: El vehículo que se aproxima por la izquierda.
    B: El vehículo que se aproxima por la derecha.
    C: El vehículo que circula a mayor velocidad.
    D: El vehículo que realiza un giro a la izquierda.
  answer: B
  explanation: En una intersección donde no hay señal de alto ni semáforo, los conductores
    deben ceder el paso a los vehículos que se aproximan por la derecha.
- id: 117
  category: safe_driving_rules
  question: En una señal de alto de "TODAS LAS DIRECCIONES" (ALL WAY), si varios vehículos
    llegan en diferentes momentos, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo a la derecha.
    B: El vehículo a la izquierda.
    C: El conductor que llegue primero a la intersección.
    D: El vehículo más grande.
  answer: C
  explanation: En las señales de alto de "3 VÍAS", "4 VÍAS" y "TODAS LAS DIRECCIONES",
    el conductor que llega primero a la intersección pasa primero, después de hacer
    una parada completa.
- id: 118
  category: safe_driving_rules
  question: ¿Cuándo se le permite a un conductor entrar en una intersección?
  choices:
    A: Tan pronto como la luz cambie a verde, incluso si el tráfico está congestionado.
    B: Solo si puede atravesarla sin tener que detenerse.
    C: Cuando necesite bloquear la intersección para esperar un giro.
    D: Siempre que se aproxime por la derecha.
  answer: B
  explanation: Los conductores no pueden entrar en una intersección a menos que puedan
    atravesarla sin tener que detenerse. Debe esperar hasta que el tráfico se despeje
    para no bloquear la intersección.
- id: 119
  category: sharing_the_road
  question: 'Al rebasar a un vehículo que circula en la misma dirección, usted debe:'
  choices:
    A: Ceder el paso al vehículo que está siendo rebasado.
    B: Tocar la bocina para advertirle que disminuya la velocidad.
    C: Rebasar por el acotamiento si el carril izquierdo está bloqueado.
    D: Asumir el derecho de paso absoluto sobre el vehículo más lento.
  answer: A
  explanation: Los conductores que rebasan a un vehículo que circula en la misma dirección
    deben ceder el paso al vehículo que está siendo rebasado, incluso si el vehículo
    está disminuyendo la velocidad o deteniéndose.
- id: 120
  category: sharing_the_road
  question: ¿Quién debe ceder el paso cuando un vehículo está rebasando a otro vehículo
    que circula en la misma dirección?
  choices:
    A: El vehículo que está siendo rebasado
    B: El vehículo que está rebasando
    C: Ambos vehículos deben disminuir la velocidad y ceder el paso
    D: Ninguno de los vehículos está obligado a ceder el paso
  answer: B
  explanation: Según el manual, los conductores que rebasan a un vehículo que circula
    en la misma dirección deben ceder el paso al vehículo que está siendo rebasado,
    ya que este puede intentar girar a la izquierda o aproximarse a un peligro.
- id: 121
  category: safe_driving_rules
  question: ¿Al estacionar en paralelo, cuál es la distancia máxima a la que debe
    estar su vehículo del bordillo (acera)?
  choices:
    A: 12 pulgadas
    B: 18 pulgadas
    C: 24 pulgadas
    D: 30 pulgadas
  answer: B
  explanation: El manual establece que al estacionar en paralelo, su vehículo debe
    estar a 18 pulgadas o menos del bordillo.
- id: 122
  category: safe_driving_rules
  question: ¿Qué debe hacer con las ruedas de su vehículo al estacionar en una colina?
  choices:
    A: Girar las ruedas bruscamente hacia el tráfico
    B: Mantener las ruedas perfectamente rectas
    C: Girar las ruedas bruscamente en dirección opuesta al tráfico
    D: Girar las ruedas ligeramente hacia el centro de la carretera
  answer: C
  explanation: Al estacionar en una colina, debe girar las ruedas bruscamente en dirección
    opuesta al tráfico para evitar que el automóvil ruede hacia la circulación.
- id: 123
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios es ilegal estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: El manual especifica que no debe estacionar a menos de quince (15)
    pies de un hidrante de incendios.
- id: 124
  category: safe_driving_rules
  question: ¿A cuántos pies de una señal de tráfico, señal de alto (stop) o señal
    de ceda el paso está prohibido estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Los conductores no deben estacionar a menos de treinta (30) pies de
    una señal de tráfico, señal de alto o señal de ceda el paso.
- id: 125
  category: safe_driving_rules
  question: ¿A qué distancia debe estacionar de un cruce de ferrocarril?
  choices:
    A: Al menos 15 pies
    B: Al menos 20 pies
    C: Al menos 30 pies
    D: Al menos 50 pies
  answer: D
  explanation: El manual establece que no debe estacionar a menos de cincuenta (50)
    pies de un cruce de ferrocarril.
- id: 126
  category: signs_and_signals
  question: ¿Qué indica un bordillo (acera) pintado de rojo?
  choices:
    A: Una zona de carga
    B: Una zona de incendios
    C: Solo estacionamiento para personas con discapacidad
    D: Estacionamiento de corta duración
  answer: B
  explanation: Según la sección de zonas de estacionamiento restringido, un bordillo
    rojo significa una zona de incendios.
- id: 127
  category: vehicle_information
  question: ¿Dónde debe ajustarse la correa inferior del cinturón de seguridad?
  choices:
    A: A través de la región abdominal
    B: A través de la parte superior de los muslos
    C: A través de las rodillas
    D: A través de la línea de la cintura
  answer: B
  explanation: La correa inferior debe ajustarse para que pase por la parte superior
    de los muslos y no por la región abdominal, a fin de distribuir adecuadamente
    la fuerza hacia el área pélvica.
- id: 128
  category: vehicle_information
  question: ¿Por qué es peligroso que los cinturones de seguridad se tuerzan?
  choices:
    A: El cinturón de seguridad se desabrochará automáticamente durante una parada
      repentina
    B: La presión en una colisión tiene menos superficie sobre la cual distribuirse
    C: Hará que las bolsas de aire (airbags) se desplieguen incorrectamente
    D: Impide que el conductor alcance el volante
  answer: B
  explanation: Si los cinturones se tuercen, la presión que se produciría en una colisión
    tiene menos superficie sobre la cual distribuirse, lo que disminuye su eficacia.
- id: 129
  category: safe_driving_rules
  question: ¿Qué técnica deben usar los conductores para controlar el volante al realizar
    un giro cerrado, como en una intersección?
  choices:
    A: Dirección con una sola mano
    B: La técnica de giro con la palma
    C: La técnica de mano sobre mano
    D: La técnica de agarre por debajo
  answer: C
  explanation: Al realizar un giro cerrado, como en las esquinas de una intersección,
    los conductores deben usar la técnica de 'mano sobre mano' para controlar el volante.
- id: 130
  category: safe_driving_rules
  question: ¿Qué puede suceder si presiona el pedal del acelerador demasiado rápido,
    especialmente en pavimento mojado?
  choices:
    A: El motor se sobrecalentará inmediatamente
    B: Las ruedas motrices pueden patinar o hacer que su vehículo se deslice
    C: Los frenos se bloquearán
    D: El volante se pondrá rígido
  answer: B
  explanation: Presionar el pedal del acelerador demasiado rápido puede hacer que
    las ruedas motrices patinen o que su vehículo se deslice, especialmente si el
    pavimento está mojado.
- id: 131
  category: driver_responsibility
  question: Enviar o leer un mensaje de texto aparta la vista de la carretera durante
    5 segundos. A 55 mph, ¿esto equivale a conducir qué distancia a ciegas?
  choices:
    A: La longitud de una cancha de baloncesto
    B: La longitud de un campo de fútbol americano completo
    C: Una milla completa
    D: 500 pies
  answer: B
  explanation: A 55 mph, apartar la vista de la carretera durante 5 segundos para
    enviar o leer un mensaje de texto es como conducir la longitud de un campo de
    fútbol americano completo con los ojos cerrados.
- id: 132
  category: safe_driving_rules
  question: Al salir de su vehículo estacionado en una calle, ¿de qué lado debe intentar
    salir siempre?
  choices:
    A: El lado de la calle
    B: El lado de la acera (curbside)
    C: El lado del conductor
    D: El lado con más tráfico
  answer: B
  explanation: El manual aconseja salir siempre del vehículo por el lado de la acera,
    si es posible, para evitar bajar hacia el tráfico.
- id: 133
  category: defensive_driving
  question: ¿Cuál es una consecuencia potencial de frenar rápidamente y hacer una
    parada repentina?
  choices:
    A: Mejora la eficiencia de combustible de su vehículo
    B: Hace que su vehículo patine y pierda el control
    C: Alerta a otros conductores para que lo rebasen de forma segura
    D: Evita el desgaste de las pastillas de freno
  answer: B
  explanation: Frenar rápidamente puede hacer que su vehículo patine y que usted pierda
    el control, lo que dificulta que otros eviten chocar contra su vehículo.
- id: 134
  category: safe_driving_rules
  question: Según la ley de Arkansas, ¿cuáles son las restricciones de uso de teléfonos
    celulares para conductores menores de 18 años?
  choices:
    A: Se les permite usar únicamente dispositivos de manos libres.
    B: Se les permite enviar mensajes de texto pero no hacer llamadas telefónicas.
    C: No se permite el uso de teléfonos celulares, incluidos los dispositivos de
      manos libres.
    D: Pueden usar teléfonos celulares si un padre o tutor está en el vehículo.
  answer: C
  explanation: El manual establece que para los conductores menores de dieciocho (18)
    años, no se permite el uso de teléfonos celulares, y tampoco se permite el uso
    de dispositivos de manos libres.
- id: 135
  category: defensive_driving
  question: Apartar la mente de la conducción se considera ¿qué tipo de distracción?
  choices:
    A: Visual
    B: Manual
    C: Cognitiva
    D: Auditiva
  answer: C
  explanation: El manual define una distracción 'Cognitiva' como apartar la mente
    de la conducción.
- id: 136
  category: safe_driving_rules
  question: ¿A qué distancia hacia adelante debe mirar en la carretera cuando conduce
    en la ciudad para evitar frenar a último momento?
  choices:
    A: Un cuarto de milla
    B: Una cuadra de la ciudad
    C: Dos cuadras de la ciudad
    D: 500 pies
  answer: B
  explanation: Para evitar frenar a último momento, debe mirar hacia adelante en la
    carretera al menos una (1) cuadra cuando conduzca en la ciudad.
- id: 137
  category: defensive_driving
  question: Para practicar una buena conducción defensiva, ¿cuántos segundos hacia
    adelante debe mirar en la carretera?
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 20 segundos
  answer: C
  explanation: El manual establece que debe mirar al menos quince (15) segundos hacia
    adelante para evitar frenazos de último momento o giros repentinos.
- id: 138
  category: safe_driving_rules
  question: ¿Cuándo se le permite girar a la derecha con luz roja en Arkansas?
  choices:
    A: En cualquier momento, siempre que ceda el paso al tráfico.
    B: Después de hacer una parada completa, a menos que haya una señal que lo prohíba.
    C: Solo si está girando hacia una calle de un solo sentido.
    D: Nunca se permiten los giros a la derecha en rojo.
  answer: B
  explanation: Puede girar a la derecha con luz roja después de hacer una parada completa,
    a menos que haya una señal que prohíba el 'giro a la derecha en rojo'.
- id: 139
  category: defensive_driving
  question: ¿Qué debe hacer si se detiene en una intersección y su vista de la calle
    transversal está bloqueada?
  choices:
    A: Esperar a que otro conductor toque la bocina antes de avanzar.
    B: Retroceder para obtener un ángulo de visión más amplio.
    C: Avanzar lentamente hasta que pueda ver claramente el tráfico que se aproxima.
    D: Acelerar rápidamente a través de la intersección.
  answer: C
  explanation: Si se detiene en una intersección y su vista de una calle transversal
    está bloqueada, avance lentamente hasta que pueda ver cualquier tráfico que se
    aproxime.
- id: 140
  category: safe_driving_rules
  question: Al cambiar de carril, ¿por qué debe mirar por encima del hombro en la
    dirección en la que planea moverse?
  choices:
    A: Para revisar sus puntos ciegos, que son las esquinas traseras de su vehículo.
    B: Para asegurarse de que sus espejos laterales estén ajustados correctamente.
    C: Para ver si el conductor detrás de usted está disminuyendo la velocidad.
    D: Para revisar si se aproximan vehículos de emergencia desde adelante.
  answer: A
  explanation: Debe mirar por encima del hombro porque sus espejos retrovisores y
    laterales no le permitirán ver los vehículos en sus puntos ciegos, que son las
    esquinas traseras de su vehículo.
- id: 141
  category: safe_driving_rules
  question: ¿Cuál es la técnica adecuada para dar marcha atrás con su vehículo en
    línea recta?
  choices:
    A: Confiar plenamente en su espejo retrovisor.
    B: Usar solo los espejos laterales para guiarse.
    C: Colocar el brazo derecho sobre el respaldo del asiento y mirar directamente
      a través de las ventanas trasera y laterales.
    D: Mantener ambas manos en el volante y mirar hacia adelante.
  answer: C
  explanation: Al dar marcha atrás, debe colocar el brazo derecho sobre el respaldo
    del asiento y girar el cuerpo para poder mirar directamente a través de las ventanas
    trasera y laterales. No dependa de sus espejos.
- id: 142
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una regla para lidiar con los puntos ciegos?
  choices:
    A: Conducir un poco por detrás de otros vehículos.
    B: Permanecer en el punto ciego de otro conductor al rebasar.
    C: Nunca permanecer al lado de un vehículo grande, como un camión con remolque
      o un autobús.
    D: Igualar la velocidad del vehículo que está a su lado para mantenerse visible.
  answer: C
  explanation: 'Los consejos sobre puntos ciegos del manual establecen específicamente:
    ''Nunca permanezca al lado de un vehículo grande, como un camión con remolque
    o un autobús''.'
- id: 143
  category: safe_driving_rules
  question: Según la ley de Arkansas, ¿cuándo debe encender las luces delanteras durante
    el día?
  choices:
    A: Al conducir por la carretera interestatal.
    B: Cuando sea necesario usar los limpiaparabrisas.
    C: Al conducir por una zona escolar.
    D: Al rebasar a un camión grande.
  answer: B
  explanation: La ley de Arkansas exige que los conductores enciendan las luces delanteras
    cuando sea necesario usar los limpiaparabrisas, como en días de lluvia, nieve
    o niebla.
- id: 144
  category: safe_driving_rules
  question: ¿En qué momentos del día está legalmente obligado a encender las luces
    delanteras?
  choices:
    A: Una hora después de la puesta del sol y una hora antes de la salida del sol.
    B: Media hora después de la puesta del sol y media hora antes de la salida del
      sol.
    C: Solo cuando esté completamente oscuro afuera.
    D: De 8:00 PM a 6:00 AM.
  answer: B
  explanation: Debe encender las luces delanteras 1/2 hora (30 minutos) después de
    la puesta del sol, 1/2 hora (30 minutos) antes de la salida del sol, o en cualquier
    momento en que no pueda ver claramente a una distancia de 500 pies.
- id: 145
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones sobre las luces de estacionamiento
    es verdadera en Arkansas?
  choices:
    A: Deben usarse al conducir con niebla densa.
    B: Son obligatorias al conducir al amanecer o al atardecer.
    C: Es ilegal conducir usando solo las luces de estacionamiento.
    D: Pueden usarse como sustituto de las luces bajas.
  answer: C
  explanation: El manual establece que las luces de estacionamiento son para vehículos
    estacionados y es ilegal en Arkansas conducir usando solo las luces de estacionamiento.
- id: 146
  category: safe_driving_rules
  question: ¿Cuándo debe cambiar de luces altas a luces bajas ante un vehículo que
    viene en sentido contrario?
  choices:
    A: A menos de 200 pies
    B: A menos de 300 pies
    C: A menos de 400 pies
    D: A menos de 500 pies
  answer: D
  explanation: Debe bajar las luces altas siempre que se encuentre a menos de 500
    pies de un vehículo que se aproxime en sentido contrario.
- id: 147
  category: defensive_driving
  question: ¿Por qué debería usar las luces bajas al conducir con niebla, nieve o
    lluvia intensa?
  choices:
    A: Las luces bajas son más brillantes que las luces altas.
    B: La luz de las luces altas se reflejará, causando deslumbramiento y dificultando
      la visión.
    C: Las luces bajas activan automáticamente las luces intermitentes de emergencia.
    D: Las luces altas agotan la batería del vehículo más rápido en climas fríos.
  answer: B
  explanation: Al conducir con niebla, nieve o lluvia intensa, debe usar las luces
    bajas porque la luz de las luces altas se reflejará, causando deslumbramiento
    y dificultando la visión de la carretera.
- id: 148
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones NO debe usar la bocina de su vehículo?
  choices:
    A: Para alertar a un conductor que se está metiendo en su carril.
    B: Para advertir a un peatón que está a punto de cruzar la calle.
    C: Para saludar a un amigo que ve en la carretera.
    D: Cuando pierde el control de su vehículo.
  answer: C
  explanation: El manual enumera explícitamente 'Para saludar a un amigo en la carretera'
    como una situación en la que no debe usar la bocina.
- id: 149
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe señalizar su intención de girar?
  choices:
    A: Al menos 50 pies antes del giro
    B: Al menos 100 pies antes del giro
    C: Al menos 150 pies antes del giro
    D: Al menos 200 pies antes del giro
  answer: B
  explanation: Según el manual, si es posible, debe señalizar sus intenciones de girar
    al menos 100 pies antes de realizar el giro.
- id: 150
  category: safe_driving_rules
  question: ¿Cuándo debe activar la luz de giro si planea girar justo después de una
    intersección?
  choices:
    A: Al menos 100 pies antes de llegar a la intersección
    B: Mientras se encuentra en medio de la intersección
    C: Justo después de pasar por la intersección
    D: Solo después de haberse detenido por completo
  answer: C
  explanation: El manual establece que si planea girar después de una intersección,
    la señal debe activarse justo después de pasar por la intersección para que otros
    conductores no piensen que va a girar en la intersección misma.
- id: 151
  category: vehicle_information
  question: ¿Cuál es la distancia total de frenado estimada para un automóvil de pasajeros
    promedio que viaja a 55 millas por hora?
  choices:
    A: 124 pies
    B: 225 pies
    C: 300 pies
    D: 400 pies
  answer: B
  explanation: El manual señala que el automóvil de pasajeros promedio que viaja a
    55 millas por hora puede detenerse en una distancia total de 225 pies.
- id: 152
  category: defensive_driving
  question: ¿Por qué es peligroso frenar mientras se conduce por una curva?
  choices:
    A: Hace que los frenos se sobrecalienten rápidamente.
    B: Aumenta los puntos ciegos de su vehículo.
    C: Puede hacer que el vehículo derrape.
    D: Hace que el volante se bloquee.
  answer: C
  explanation: El manual aconseja reducir la velocidad antes de una curva porque frenar
    en una curva puede hacer que el vehículo derrape.
- id: 153
  category: safe_driving_rules
  question: ¿Cómo debe ajustar su velocidad al conducir en una carretera cubierta
    de nieve compacta?
  choices:
    A: Reduzca su velocidad en 10 mph.
    B: Reduzca su velocidad a la mitad.
    C: Reduzca la velocidad hasta avanzar por inercia.
    D: Mantenga el límite de velocidad indicado.
  answer: B
  explanation: Según el manual, en nieve compacta, debe reducir su velocidad a la
    mitad.
- id: 154
  category: defensive_driving
  question: ¿Bajo qué condición el hielo en la carretera es generalmente más resbaladizo?
  choices:
    A: Cuando las temperaturas están muy por debajo del punto de congelación.
    B: Cuando el hielo está cerca del punto de congelación.
    C: Cuando ha estado congelado durante varios días.
    D: Cuando está cubierto por una capa de nieve seca.
  answer: B
  explanation: El manual establece que cuando el hielo está cerca del punto de congelación,
    puede ser más resbaladizo que a temperaturas muy por debajo del punto de congelación.
- id: 155
  category: defensive_driving
  question: ¿Por qué el pavimento puede estar particularmente resbaladizo durante
    los primeros minutos cuando empieza a llover en un día caluroso?
  choices:
    A: La lluvia enfría las llantas, reduciendo su agarre.
    B: El agua se mezcla con la tierra para crear lodo profundo.
    C: El calor hace que el aceite del asfalto suba a la superficie de la carretera.
    D: El cambio repentino de temperatura hace que el asfalto se agriete.
  answer: C
  explanation: Cuando empieza a llover en un día caluroso, el calor hace que el aceite
    del asfalto suba a la superficie de la carretera, lo que hace que las condiciones
    sean más resbaladizas hasta que la lluvia lo lave.
- id: 156
  category: safe_driving_rules
  question: ¿A qué velocidad pueden sus llantas perder toda tracción con la carretera
    durante una lluvia intensa, causando que su vehículo experimente hidroplaneo (hydroplaning)?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 50 mph
  answer: D
  explanation: El manual establece que, en caso de lluvia intensa, sus llantas pueden
    perder toda tracción con la carretera a 50 mph, un proceso llamado hidroplaneo
    (hydroplaning).
- id: 157
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si su vehículo comienza a hidroplanear?
  choices:
    A: Frenar de golpe inmediatamente.
    B: Girar el volante bruscamente hacia la derecha.
    C: Quitar lentamente el pie del acelerador.
    D: Acelerar para atravesar el agua.
  answer: C
  explanation: Si su vehículo comienza a hidroplanear, el manual le indica que retire
    lentamente el pie del acelerador y mantenga el volante recto.
- id: 158
  category: sharing_the_road
  question: ¿Cuál es el procedimiento adecuado para incorporarse a una carretera de
    alta velocidad?
  choices:
    A: Conducir hasta el final de la rampa y detenerse antes de entrar.
    B: Entrar a una velocidad mucho más lenta que el tráfico para estar seguro.
    C: Usar la rampa para alcanzar la velocidad de los otros vehículos antes de entrar
      en la carretera.
    D: Esperar a que el tráfico de la carretera principal se detenga y le deje entrar.
  answer: C
  explanation: Al incorporarse al tráfico, debe usar la rampa para alcanzar la velocidad
    de los otros vehículos antes de entrar en la carretera. No debe conducir hasta
    el final de la rampa y detenerse.
- id: 159
  category: safe_driving_rules
  question: ¿Cuándo debe comenzar a reducir la velocidad si va a salir de una carretera
    de alta velocidad por una rampa de salida?
  choices:
    A: 500 pies antes de la rampa de salida.
    B: Solo después de haber entrado en la rampa de salida.
    C: Tan pronto como encienda su luz direccional.
    D: Mientras todavía se encuentra en el flujo principal del tráfico.
  answer: B
  explanation: El manual establece que si la carretera por la que viaja tiene rampas
    de salida, no reduzca la velocidad hasta que haya entrado en la rampa de salida.
- id: 160
  category: signs_and_signals
  question: Los tractores agrícolas y los vehículos tirados por animales suelen viajar
    a velocidades de 25 mph o menos. ¿Qué debe ser visible desde la parte trasera
    de estos vehículos?
  choices:
    A: Una luz amarilla intermitente
    B: Una señal de vehículo de movimiento lento
    C: Una bandera blanca
    D: Un diamante de advertencia de peligro
  answer: B
  explanation: Los tractores agrícolas, los vehículos tirados por animales y los vehículos
    de mantenimiento de carreteras suelen viajar a 25 mph o menos y deben tener una
    señal de vehículo de movimiento lento visible desde la parte trasera.
- id: 161
  category: safe_driving_rules
  question: Por la noche, sus faros le permiten ver a unos 400 pies de distancia.
    ¿Cuál es la velocidad máxima recomendada para asegurar que pueda detenerse dentro
    de esta distancia?
  choices:
    A: 40 mph
    B: 50 mph
    C: 60 mph
    D: 70 mph
  answer: B
  explanation: Sus faros le permiten ver a unos 400 pies de distancia. El manual establece
    que debe conducir a una velocidad que le permita detenerse dentro de esta distancia,
    que es de aproximadamente 50 mph.
- id: 162
  category: safe_driving_rules
  question: Si la lluvia intensa o la niebla limitan su visibilidad a menos de 200
    pies de distancia, ¿cuál es la velocidad máxima a la que debe conducir?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: Si no puede ver a más de 200 pies de distancia debido a la lluvia o
    la niebla, el manual establece que no debe conducir a más de 30 mph.
- id: 163
  category: defensive_driving
  question: ¿Qué secciones de la calzada suelen ser de las primeras en desarrollar
    condiciones de hielo durante el clima frío?
  choices:
    A: Túneles y pasos inferiores
    B: Pasos elevados y puentes
    C: Intersecciones en zonas céntricas
    D: Caminos con gran volumen de tráfico
  answer: B
  explanation: El manual señala que los pasos elevados y los puentes pueden convertirse
    en algunas de las primeras secciones de las carreteras en desarrollar condiciones
    de hielo.
- id: 164
  category: safe_driving_rules
  question: Si no puede ver a más de 200 pies de distancia debido a la lluvia o la
    niebla, ¿cuál es la velocidad máxima a la que debe conducir?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: El manual establece que si no puede ver a más de 200 pies de distancia
    debido a la lluvia o la niebla, no debe conducir a más de 30 mph.
- id: 165
  category: defensive_driving
  question: ¿Qué regla debe utilizar para determinar si está conduciendo demasiado
    rápido para las condiciones actuales?
  choices:
    A: La regla de los dos segundos
    B: La regla de dividir la diferencia
    C: La regla de la distancia visual de cuatro segundos
    D: La regla de rebase de diez segundos
  answer: C
  explanation: Para determinar si está conduciendo demasiado rápido para las condiciones,
    el manual aconseja utilizar la "Regla de la distancia visual de cuatro segundos".
    Si llega a un objeto estacionario antes de contar hasta cuatro mil uno, va demasiado
    rápido.
- id: 166
  category: penalties_and_points
  question: ¿Puede recibir una multa de tráfico por conducir al límite de velocidad
    indicado?
  choices:
    A: No, siempre que no exceda el límite indicado.
    B: Sí, si viaja demasiado rápido para las condiciones actuales de la carretera,
      como hielo o lluvia.
    C: Sí, pero solo si conduce en una zona escolar.
    D: No, porque los límites de velocidad tienen en cuenta todas las condiciones
      climáticas.
  answer: B
  explanation: Según el manual, los conductores deben ajustar su velocidad a las condiciones
    actuales de la carretera. Incluso si conduce al límite de velocidad, puede recibir
    una multa por viajar demasiado rápido para las condiciones.
- id: 167
  category: safe_driving_rules
  question: ¿Cuál es la regla recomendada para determinar si está siguiendo a otro
    vehículo demasiado de cerca en condiciones normales?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los cuatro segundos
    D: La regla de los diez segundos
  answer: B
  explanation: Los choques por alcance son causados por conductores que siguen demasiado
    de cerca. El manual establece que se debe usar la "regla de los dos (2) segundos"
    para determinar si se está siguiendo demasiado de cerca.
- id: 168
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones debería aumentar su distancia de
    seguimiento a una regla de cuatro segundos?
  choices:
    A: Al conducir por carreteras resbaladizas
    B: Al seguir a una motocicleta
    C: Al seguir a un vehículo que remolca una casa rodante
    D: Todas las anteriores
  answer: D
  explanation: El manual enumera varias situaciones en las que se necesita más espacio
    (una regla de cuatro segundos), incluyendo carreteras resbaladizas, seguir motocicletas
    y seguir a conductores que no pueden ver su vehículo, como aquellos que remolcan
    casas rodantes.
- id: 169
  category: defensive_driving
  question: ¿Qué debe hacer si alguien le sigue demasiado de cerca (tailgating) y
    no hay un carril derecho al cual moverse?
  choices:
    A: Toque sus frenos rápidamente para advertir al conductor detrás de usted.
    B: Aumente la velocidad para incrementar la distancia entre sus vehículos.
    C: Espere hasta que el camino de adelante esté despejado y reduzca su velocidad
      para dejarlos pasar.
    D: Encienda sus luces de emergencia y deténgase por completo en su carril.
  answer: C
  explanation: Si no hay un carril derecho al cual moverse cuando alguien le sigue
    demasiado de cerca, el manual aconseja esperar hasta que el camino de adelante
    esté despejado y reducir la velocidad para permitir que el conductor que le sigue
    pase a su alrededor. Nunca debe reducir la velocidad demasiado rápido.
- id: 170
  category: defensive_driving
  question: ¿A qué se refiere la "regla de dividir la diferencia" (split difference
    rule)?
  choices:
    A: Dividir su distancia de frenado a la mitad en carreteras mojadas.
    B: Dirigir un curso intermedio entre dos peligros, dejando más espacio para el
      más peligroso.
    C: Dividir su atención por igual entre el camino de adelante y sus espejos retrovisores.
    D: Cambiar de carril a mitad de una intersección.
  answer: B
  explanation: La "regla de dividir la diferencia" es cuando se divide la diferencia
    entre dos peligros, dirigiendo un curso intermedio. Si uno parece más peligroso,
    se deja más espacio en el lado del peligro más grave.
- id: 171
  category: sharing_the_road
  question: 'Al rebasar a un peatón o ciclista, usted debe:'
  choices:
    A: Compartir el carril con ellos si el carril es lo suficientemente ancho.
    B: Tocar la bocina para avisarles que está rebasando en el mismo carril.
    C: Esperar hasta que sea seguro rebasar en el carril contiguo.
    D: Acelerar para rebasarlos lo más rápido posible.
  answer: C
  explanation: 'El manual establece explícitamente: ''No comparta el carril con un
    peatón o ciclista; espere hasta que sea seguro rebasar en el carril contiguo''.'
- id: 172
  category: safe_driving_rules
  question: ¿Qué tan grande debe ser el espacio que necesita al incorporarse al tráfico,
    entrar en una carretera o cambiar de carril?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Diez segundos
  answer: C
  explanation: Al cambiar de carril, entrar en una carretera o incorporarse a otro
    carril de circulación, el manual indica que debe mantener un espacio de cuatro
    (4) segundos.
- id: 173
  category: safe_driving_rules
  question: Al cruzar el tráfico, ¿cuándo es seguro detenerse a mitad del camino en
    un divisor central (mediana)?
  choices:
    A: Siempre, siempre que use su luz direccional.
    B: Solo cuando el divisor central sea lo suficientemente grande para que su vehículo
      entre sin sobresalir.
    C: Solo si conduce un automóvil compacto.
    D: Nunca; debe cruzar todos los carriles de tráfico a la vez.
  answer: B
  explanation: Detenerse a mitad de la carretera es seguro cuando hay un divisor central
    lo suficientemente grande para que entre su vehículo. Nunca debe detenerse en
    un divisor central demasiado pequeño para su vehículo donde este pueda sobresalir
    hacia el tráfico.
- id: 174
  category: safe_driving_rules
  question: Si tiene la luz verde pero el tráfico está bloqueando la intersección
    más adelante, ¿qué debe hacer?
  choices:
    A: Entrar en la intersección para reclamar su derecho de paso.
    B: Tocar la bocina hasta que el tráfico se mueva.
    C: No comience a cruzar la intersección hasta que el tráfico se haya despejado.
    D: Avanzar lentamente para obligar a los otros autos a moverse.
  answer: C
  explanation: Incluso con luz verde, no comience a cruzar la intersección hasta que
    el tráfico esté despejado. Podría quedarse atrapado en la intersección cuando
    la luz cambie a rojo y bloquear el tráfico, lo que puede resultar en una multa.
- id: 175
  category: defensive_driving
  question: ¿Por qué debe esperar para girar hasta que un vehículo que se aproxima
    con la luz direccional encendida realmente comience a girar?
  choices:
    A: Es posible que el conductor tenga la intención de girar después de su calle
      o que haya olvidado apagar la señal.
    B: El vehículo que se aproxima siempre tiene el derecho de paso, incluso si está
      girando.
    C: Las luces direccionales suelen ser invisibles a la luz del día, lo que las
      hace poco fiables.
    D: Es ilegal girar al mismo tiempo que otro vehículo.
  answer: A
  explanation: No gire solo porque un vehículo que se aproxima tiene encendida una
    luz direccional. El conductor puede tener la intención de girar más allá de la
    calle donde usted se encuentra, o puede haber olvidado apagar la señal. Espere
    hasta que el conductor comience a girar.
- id: 176
  category: safe_driving_rules
  question: A una velocidad de 55 mph, ¿aproximadamente cuántos segundos necesita
    para rebasar a otro vehículo de manera segura?
  choices:
    A: 2 segundos
    B: 4 segundos
    C: 7 segundos
    D: 10 segundos
  answer: D
  explanation: El manual establece que a una velocidad de 55 mph, se necesitan unos
    diez (10) segundos para rebasar, lo que significa que necesita un espacio de diez
    segundos en el tráfico que viene en sentido contrario.
- id: 177
  category: safe_driving_rules
  question: A 55 mph, ¿cuánta distancia necesita para rebasar a otro vehículo de manera
    segura?
  choices:
    A: 400 pies
    B: 800 pies
    C: Más de 1600 pies o 1/3 de milla
    D: 1 milla
  answer: C
  explanation: A 55 mph, usted y el vehículo que viene en sentido contrario recorrerán
    más de 800 pies en diez segundos. Esto significa que un conductor necesitará más
    de 1600 pies o 1/3 de milla para rebasar de manera segura.
- id: 178
  category: defensive_driving
  question: Si está adelantando a una bicicleta y un vehículo viene en sentido contrario
    al mismo tiempo, ¿qué debe hacer?
  choices:
    A: Acelerar para rebasar la bicicleta antes de que el vehículo llegue a usted.
    B: Reducir la velocidad y dejar que el vehículo que viene en sentido contrario
      pase antes de rebasar la bicicleta.
    C: Acercarse más a la bicicleta para darle más espacio al vehículo que viene en
      sentido contrario.
    D: Tocar la bocina para que la bicicleta se salga de la carretera.
  answer: B
  explanation: Cuando sea posible, enfrente los peligros potenciales uno a la vez.
    Si está adelantando a una bicicleta y se aproxima un vehículo en sentido contrario,
    debe reducir la velocidad y dejar que el vehículo pase antes de rebasar la bicicleta.
- id: 179
  category: safe_driving_rules
  question: ¿A qué distancia de una colina o curva no deben los conductores rebasar
    nunca a otro vehículo?
  choices:
    A: 1/4 de milla
    B: 1/2 milla
    C: 1/3 de milla
    D: 1 milla
  answer: C
  explanation: Cada vez que su vista esté bloqueada por una colina o una curva, siempre
    debe asumir que un vehículo podría venir hacia usted y nunca rebasar a menos de
    1/3 de milla de una curva o colina.
- id: 180
  category: safe_driving_rules
  question: Al rebasar a otro vehículo por la noche, ¿cómo puede saber si es seguro
    volver al carril de circulación?
  choices:
    A: Cuando esté a 100 pies por delante del vehículo
    B: Cuando pueda ver ambos faros delanteros del vehículo rebasado en su espejo
      retrovisor
    C: Cuando el vehículo rebasado parpadee sus faros
    D: Cuando pueda ver el vehículo en su espejo lateral
  answer: B
  explanation: Por la noche, cuando pueda ver ambos faros delanteros del vehículo
    que rebasó en su espejo retrovisor, es seguro volver al carril de circulación.
- id: 181
  category: safe_driving_rules
  question: Según la ley de Arkansas, conducir en el carril izquierdo de una carretera
    de carriles múltiples está restringido ÚNICAMENTE para rebasar, ¿con cuál de las
    siguientes excepciones?
  choices:
    A: Cuando conduce exactamente al límite de velocidad
    B: Cuando se está preparando para salir de la carretera de carriles múltiples
      por la izquierda
    C: Cuando conduce un vehículo comercial
    D: Cuando hay tráfico pesado en el carril derecho
  answer: B
  explanation: Las excepciones a la regla de rebasar por el carril izquierdo incluyen
    cuando un vehículo se prepara para salir de la carretera de carriles múltiples
    por la izquierda, o cuando otros carriles están cerrados o no son seguros.
- id: 182
  category: sharing_the_road
  question: ¿Cuánta distancia puede necesitar un camión de remolque (tractor-trailer)
    completamente cargado que viaja a 55 mph para detenerse por completo?
  choices:
    A: Aproximadamente 225 pies
    B: Menos de 150 pies
    C: Más de 335 pies
    D: Exactamente 100 pies
  answer: C
  explanation: Un camión de remolque completamente cargado que viaja a 55 millas por
    hora puede tardar más de 335 pies (la longitud de un campo de fútbol americano)
    en detenerse por completo.
- id: 183
  category: sharing_the_road
  question: ¿Por qué los conductores de camiones de remolque a menudo se abren hacia
    la izquierda antes de realizar un giro a la derecha?
  choices:
    A: Para tener una mejor vista del tráfico que viene en sentido contrario
    B: Porque las ruedas traseras siguen una trayectoria más corta que las ruedas
      delanteras
    C: Para evitar que otros vehículos los rebasen
    D: Porque el mecanismo de dirección requiere un ángulo más amplio
  answer: B
  explanation: Las ruedas traseras de cualquier vehículo que gira siguen una trayectoria
    más corta que las ruedas delanteras, lo que marca una mayor diferencia en los
    vehículos más largos. Deben abrirse a la izquierda como primer paso en un giro
    a la derecha.
- id: 184
  category: sharing_the_road
  question: Un camión de remolque tiene un punto ciego grave en la parte delantera
    de la cabina. ¿A qué distancia puede desaparecer un automóvil de la vista del
    conductor del camión en este punto ciego delantero?
  choices:
    A: Hasta 10 pies
    B: Hasta 20 pies
    C: Hasta 50 pies
    D: Hasta 100 pies
  answer: B
  explanation: Un automóvil puede desaparecer hasta 20 pies delante de la cabina de
    un camión de remolque debido a los graves puntos ciegos.
- id: 185
  category: sharing_the_road
  question: ¿Hasta dónde se extiende el punto ciego en la parte trasera de un camión
    de remolque?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 150 pies
    D: Hasta 200 pies
  answer: D
  explanation: Un automóvil puede desaparecer en el punto ciego hasta 200 pies detrás
    del camión.
- id: 186
  category: sharing_the_road
  question: ¿Cuál es una excelente regla que los automovilistas deben recordar al
    compartir la carretera con un camión de remolque?
  choices:
    A: Si puede ver los faros del camión, el conductor puede verlo a usted
    B: Si no puede ver al conductor del camión en el espejo lateral del camión, el
      conductor no puede verlo a usted
    C: Los camiones siempre tienen el derecho de paso
    D: Siempre rebase a un camión por el lado derecho
  answer: B
  explanation: 'Una excelente regla para los automovilistas que comparten la carretera
    con un camión de remolque es: ''si no puede ver al conductor del camión en el
    espejo lateral del camión, el conductor no puede verlo a usted''.'
- id: 187
  category: sharing_the_road
  question: ¿Por qué ocurre una gran cantidad de colisiones entre automóviles y camiones
    en las intersecciones?
  choices:
    A: Los camiones no están obligados a detenerse ante los semáforos en rojo
    B: Los automóviles intentan rebasar a los camiones por la derecha
    C: El tamaño de un camión de remolque puede hacer que parezca que viaja a una
      velocidad más lenta de la real
    D: Los conductores de camiones no pueden ver los semáforos con claridad
  answer: C
  explanation: Una gran cantidad de colisiones ocurren en las intersecciones porque
    el conductor del automóvil no se da cuenta de qué tan cerca está el camión o qué
    tan rápido se aproxima, ya que su tamaño lo hace parecer más lento.
- id: 188
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las bicicletas
    en la carretera?
  choices:
    A: Las bicicletas deben circular de frente al tráfico que viene en sentido contrario
    B: Las bicicletas deben circular por el lado derecho de la carretera con el resto
      del tráfico
    C: No se permite que las bicicletas compartan carriles de tráfico con los automóviles
    D: Las bicicletas siempre deben circular por la acera
  answer: B
  explanation: Las bicicletas tienen los mismos derechos y responsabilidades que otros
    vehículos y deben circular por el lado derecho de la carretera con el resto del
    tráfico, no de frente a él.
- id: 189
  category: sharing_the_road
  question: ¿Por qué un ciclista podría moverse hacia el centro del carril al pasar
    junto a autos estacionados?
  choices:
    A: Para prepararse para un giro a la derecha
    B: Para evitar ser lastimado por personas que bajan de los autos o abren las puertas
      de los mismos
    C: Para evitar que el tráfico los rebase
    D: Porque el lado derecho de la carretera está reservado para peatones
  answer: B
  explanation: Cuando los ciclistas pasan junto a autos estacionados, tienden a moverse
    hacia el centro del carril para evitar lastimar o ser lastimados por personas
    que bajan de los autos.
- id: 190
  category: sharing_the_road
  question: ¿Cuál es la causa más común de una colisión entre un vehículo motorizado
    y una bicicleta?
  choices:
    A: Un ciclista que se pasa un semáforo en rojo
    B: Un conductor que gira a la izquierda frente a una bicicleta que se aproxima
      o que gira a la derecha cruzándose en su camino
    C: Un conductor que choca por detrás a un ciclista en una señal de alto
    D: Un ciclista que se desvía hacia el carril izquierdo
  answer: B
  explanation: La causa más común de una colisión es un conductor que gira a la izquierda
    frente a una bicicleta que se aproxima o que gira a la derecha, cruzándose en
    el camino de la bicicleta.
- id: 191
  category: sharing_the_road
  question: ¿Si está a punto de adelantar a una bicicleta en una carretera estrecha
    y cree que el ciclista no sabe que usted se acerca, cuál es la mejor acción a
    tomar?
  choices:
    A: Hacer sonar la bocina continuamente hasta que se muevan
    B: Acelerar el motor ruidosamente
    C: Tocar la bocina suave y brevemente como señal
    D: Pasarlos lo más cerca posible
  answer: C
  explanation: Si cree que el ciclista no sabe que usted se acerca en una carretera
    estrecha, toque la bocina suave y brevemente como señal. No haga sonar la bocina
    con fuerza ni asuste al ciclista.
- id: 192
  category: sharing_the_road
  question: Si ve a un ciclista con un banderín rojo o naranja sujeto a su bicicleta,
    ¿qué indica esto?
  choices:
    A: El ciclista lleva carga de gran tamaño.
    B: El ciclista es principiante.
    C: El ciclista tiene una discapacidad auditiva.
    D: La bicicleta transporta materiales peligrosos.
  answer: C
  explanation: Según el manual, un banderín rojo o naranja sujeto a una bicicleta
    es un símbolo que indica que el ciclista tiene una discapacidad auditiva, y los
    conductores deben reducir la velocidad.
- id: 193
  category: sharing_the_road
  question: ¿Bajo cuál de las siguientes condiciones se le permite a un ciclista el
    uso completo del carril de tráfico?
  choices:
    A: Cuando el carril es demasiado estrecho para que un automóvil y una bicicleta
      lo compartan de manera segura.
    B: Cuando el ciclista circula de noche.
    C: Cuando el ciclista viaja por debajo del límite de velocidad.
    D: Cuando el ciclista circula en un vecindario residencial.
  answer: A
  explanation: Se le debe permitir a un ciclista el uso completo del carril cuando
    este sea demasiado estrecho para que tanto un automóvil como una bicicleta compartan
    el carril de manera segura.
- id: 194
  category: sharing_the_road
  question: Según las investigaciones, ¿cuál es la causa más común de choques entre
    automóviles y motocicletas en las intersecciones?
  choices:
    A: Una motocicleta chocando por detrás a un automóvil.
    B: El conductor de un automóvil girando a la izquierda frente a una motocicleta.
    C: Una motocicleta intentando adelantar a un automóvil por la derecha.
    D: El conductor de un automóvil no deteniéndose ante un semáforo en rojo.
  answer: B
  explanation: El manual establece que el choque más común entre automóviles y motocicletas
    ocurre en una intersección cuando el conductor de un automóvil realiza un giro
    a la izquierda frente a una motocicleta (Incumplimiento de ceder el paso).
- id: 195
  category: sharing_the_road
  question: ¿Por qué debería esperar para ver si una motocicleta realmente va a girar
    antes de continuar, incluso si su luz direccional está parpadeando?
  choices:
    A: Las luces direccionales de las motocicletas suelen estar mal cableadas.
    B: Las señales de las motocicletas no se cancelan automáticamente y el conductor
      puede haber olvidado apagarla.
    C: Los motociclistas suelen utilizar las luces direccionales para indicar que
      están reduciendo la velocidad.
    D: Es ilegal avanzar mientras la luz direccional de una motocicleta está activa.
  answer: B
  explanation: No se deje engañar por una luz direccional parpadeante. Las señales
    de las motocicletas no se cancelan automáticamente y los conductores olvidan apagarlas.
    Debe esperar y ver si la motocicleta va a girar antes de continuar.
- id: 196
  category: sharing_the_road
  question: ¿Cómo debe tratar un conductor el espacio de una motocicleta en un carril
    de tráfico?
  choices:
    A: Compartir el carril con la motocicleta si el carril es lo suficientemente ancho.
    B: Permitir a la motocicleta el ancho completo del carril y no intentar compartir
      el carril.
    C: Forzar a la motocicleta hacia el borde derecho del carril.
    D: Adelantar a la motocicleta dentro del mismo carril para ahorrar espacio.
  answer: B
  explanation: 'El manual instruye a los conductores a permitir al motociclista el
    ancho completo del carril y establece: "No intente compartir el carril con una
    motocicleta".'
- id: 197
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir detrás de
    una motocicleta?
  choices:
    A: Al menos dos segundos.
    B: Al menos tres segundos.
    C: Al menos de cuatro a seis segundos.
    D: Al menos de ocho a diez segundos.
  answer: C
  explanation: Los conductores deben permitir una mayor distancia de seguimiento,
    al menos de cuatro (4) a seis (6) segundos, cuando sigan a una motocicleta para
    que el motociclista tenga suficiente tiempo para maniobrar o detenerse en una
    emergencia.
- id: 198
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    de la licencia de conducir en Arkansas?
  choices:
    A: Visión 20/20 en ambos ojos.
    B: Visión 20/40 en al menos un ojo.
    C: Visión 20/50 en ambos ojos.
    D: Al menos visión 20/70 en al menos un ojo.
  answer: D
  explanation: Arkansas requiere que apruebe un examen de la vista antes de obtener
    una licencia de conducir. Debe tener al menos una visión de veinte-setenta (20/70)
    en al menos un ojo, con o sin lentes correctivos.
- id: 199
  category: license_system
  question: ¿Qué significa una restricción 'B' en su licencia de conducir de Arkansas?
  choices:
    A: Está restringido a conducir únicamente durante las horas del día.
    B: Debe conducir con lentes correctivos.
    C: Se requiere que tenga un adulto con licencia en el vehículo.
    D: No puede conducir en autopistas interestatales.
  answer: B
  explanation: Si tiene una restricción 'B' en su licencia de conducir, debe conducir
    con sus anteojos (lentes correctivos). Un conductor puede ser multado por no usarlos.
- id: 200
  category: safe_driving_rules
  question: ¿Por qué los conductores deben evitar el uso de anteojos o lentes de contacto
    oscuros o teñidos por la noche?
  choices:
    A: Reflejan los faros que vienen en sentido contrario y causan ceguera temporal.
    B: Reducen demasiada luz, la cual es necesaria para ver el camino por delante.
    C: Es ilegal usarlos mientras se conduce en cualquier momento.
    D: Distorsionan los colores de las señales de tráfico.
  answer: B
  explanation: Los conductores deben evitar los anteojos o lentes de contacto oscuros
    o teñidos por la noche porque este tipo de lentes reducen demasiada luz, y la
    luz es necesaria para ver el camino por delante.
- id: 201
  category: sharing_the_road
  question: ¿Cuál de las siguientes condiciones de la carretera puede representar
    un peligro importante para un motociclista y hacer que cambie repentinamente de
    velocidad o posición?
  choices:
    A: Marcas de carril recién pintadas.
    B: Baches, grava y cruces de ferrocarril.
    C: Bandas sonoras (rumble strips) en el arcén.
    D: Señales de carretera elevadas.
  answer: B
  explanation: Los motociclistas pueden cambiar repentinamente de velocidad o ajustar
    su posición en reacción a las condiciones de la carretera, como baches, grava,
    cruces de ferrocarril y superficies mojadas o resbaladizas.
- id: 202
  category: sharing_the_road
  question: ¿Qué equipo debe tener un ciclista al circular de noche para mejorar la
    visibilidad?
  choices:
    A: Una luz delantera y un reflector trasero.
    B: Un chaleco de seguridad de alta visibilidad.
    C: Una luz estroboscópica amarilla intermitente.
    D: Una bocina que se pueda escuchar a 200 pies de distancia.
  answer: A
  explanation: Los ciclistas que circulan de noche presentan problemas de visibilidad
    y deben contar con la iluminación adecuada, específicamente una luz delantera
    y un reflector trasero.
- id: 203
  category: driver_responsibility
  question: Debido a que la conducción segura depende de qué tan bien vea, ¿con qué
    frecuencia recomienda el manual que los conductores se sometan a un examen de
    la vista con un especialista?
  choices:
    A: Cada seis meses.
    B: Cada año.
    C: Cada dos años.
    D: Cada cinco años.
  answer: B
  explanation: El manual establece que, debido a que la conducción segura depende
    de qué tan bien vea, los conductores deben hacerse revisar la vista cada año por
    un especialista.
- id: 204
  category: sharing_the_road
  question: ¿Cómo pueden afectar los vientos fuertes a un motociclista?
  choices:
    A: Aumentan la eficiencia de combustible de la motocicleta.
    B: Pueden desplazar una motocicleta a través de un carril completo si el conductor
      no está preparado.
    C: Hacen que el motor de la motocicleta se apague.
    D: Evitan que las señales de giro de la motocicleta funcionen.
  answer: B
  explanation: Una ráfaga de viento fuerte puede desplazar una motocicleta a través
    de un carril completo si el conductor no está preparado para ello. Las ráfagas
    de viento de los camiones grandes también pueden ser un peligro.
- id: 205
  category: sharing_the_road
  question: Si un carril está marcado y señalizado solo para el uso de bicicletas,
    ¿cuándo puede un conductor usar ese carril?
  choices:
    A: Al rebasar a un vehículo más lento.
    B: Al prepararse para dar una vuelta a la derecha.
    C: Al estacionarse por menos de 5 minutos.
    D: Los conductores NUNCA deben usar ese carril como carril de giro, carril de
      rebase o para estacionarse.
  answer: D
  explanation: Si el carril está marcado y señalizado solo para uso de bicicletas,
    los conductores NUNCA deben usar ese carril como carril de giro, carril de rebase
    o para estacionarse.
- id: 206
  category: defensive_driving
  question: ¿Qué tipo de comida se recomienda antes de partir en un viaje largo para
    ayudar a prevenir la fatiga?
  choices:
    A: Una comida grande y completa
    B: Una comida rica en azúcar
    C: Una comida ligera
    D: Ninguna comida en absoluto
  answer: C
  explanation: El manual aconseja a los conductores ingerir comidas ligeras antes
    de la salida, señalando que las comidas grandes y completas tienden a causar somnolencia.
- id: 207
  category: alcohol_drugs_health
  question: ¿Bajo qué condiciones puede conducir una persona con epilepsia en Arkansas?
  choices:
    A: Si está bajo el cuidado de un médico y no ha tenido convulsiones durante un
      año.
    B: Si no ha tenido convulsiones durante seis meses.
    C: Si solo conduce durante las horas del día.
    D: A las personas con epilepsia nunca se les permite conducir en Arkansas.
  answer: A
  explanation: Según el manual, en Arkansas, se puede conducir con epilepsia si se
    está bajo el cuidado de un médico y no se han tenido convulsiones durante un año.
- id: 208
  category: driver_responsibility
  question: ¿Qué debe hacer si está enojado o emocionado antes de planear conducir?
  choices:
    A: Encender la radio para distraerse mientras conduce.
    B: Conducir un poco más rápido para llegar antes a su destino.
    C: Dar un paseo corto y mantenerse fuera de la carretera hasta que se haya calmado.
    D: Beber una bebida con cafeína antes de ponerse al volante.
  answer: C
  explanation: El manual establece que si está enojado o emocionado, debe darse tiempo
    para calmarse o tranquilizarse, como dar un paseo corto, pero mantenerse fuera
    de la carretera hasta que se haya calmado.
- id: 209
  category: alcohol_drugs_health
  question: ¿En qué porcentaje aproximado de accidentes de tráfico en los que muere
    alguien está involucrado el alcohol?
  choices:
    A: 15 por ciento
    B: 25 por ciento
    C: 38 por ciento
    D: 50 por ciento
  answer: C
  explanation: El manual establece que el alcohol está involucrado en aproximadamente
    el treinta y ocho (38) por ciento de los accidentes de tráfico en los que alguien
    muere.
- id: 210
  category: alcohol_drugs_health
  question: Después de consumir alcohol, ¿cuánto tiempo tarda en llegar al cerebro?
  choices:
    A: De 5 a 10 minutos
    B: De 15 a 40 minutos
    C: De 1 a 2 horas
    D: Inmediatamente después del consumo
  answer: B
  explanation: Según el manual, el alcohol en el torrente sanguíneo llega al cerebro
    en un periodo de quince (15) a cuarenta (40) minutos.
- id: 211
  category: alcohol_drugs_health
  question: ¿Cuál es la primera capacidad de conducción que se ve afectada por el
    alcohol?
  choices:
    A: Los reflejos
    B: La visión
    C: El tiempo de reacción
    D: El juicio
  answer: D
  explanation: 'El manual establece explícitamente: "La primera capacidad de conducción
    que se ve afectada por el alcohol es el juicio".'
- id: 212
  category: alcohol_drugs_health
  question: ¿A qué ritmo elimina el alcohol el cuerpo humano?
  choices:
    A: Una bebida por hora
    B: Dos bebidas por hora
    C: Una bebida cada dos horas
    D: Tres bebidas por hora
  answer: A
  explanation: El manual establece que el cuerpo elimina el alcohol a un ritmo de
    una (1) bebida por hora.
- id: 213
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes métodos le ayudará a recuperar la sobriedad rápidamente?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio al aire libre
    D: Solo el tiempo le hará recuperar la sobriedad
  answer: D
  explanation: El manual enfatiza que no hay forma de recuperar la sobriedad rápidamente.
    El café, el aire fresco, el ejercicio o una ducha fría no ayudarán; lo único que
    le hará recuperar la sobriedad es el tiempo.
- id: 214
  category: penalties_and_points
  question: ¿Cuál es una consecuencia de negarse a realizar una prueba de alcohol
    cuando lo ordena un oficial de la ley?
  choices:
    A: Se le dará una advertencia.
    B: Puede perder su licencia de conducir.
    C: Se le obligará a hacerse un análisis de sangre en su lugar.
    D: Recibirá un punto en su historial de conducción.
  answer: B
  explanation: 'El manual establece: "Puede perder su licencia de conducir si se niega
    a realizar una prueba de alcohol".'
- id: 215
  category: penalties_and_points
  question: 'En Arkansas, será arrestado por conducir en estado de ebriedad (DWI)
    con una concentración de alcohol de al menos:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.06%
    D: 0.08%
  answer: D
  explanation: Será arrestado por conducir en estado de ebriedad con una concentración
    de alcohol de 0.08% o más en el aliento o la sangre.
- id: 216
  category: penalties_and_points
  question: ¿Cuál es la multa potencial por una primera condena por una infracción
    relacionada con el alcohol?
  choices:
    A: $50 a $100
    B: $150 a $1000
    C: $2000 a $5000
    D: Exactamente $500
  answer: B
  explanation: Si es declarado culpable de una infracción por alcohol en la primera
    condena, se le multará con entre $150 y $1000, además de las costas judiciales.
- id: 217
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años, puede ser arrestado por conducir bajo la influencia
    siendo menor de edad (DUI) si su concentración de alcohol es de al menos:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.06%
    D: 0.08%
  answer: A
  explanation: El manual establece que puede ser arrestado por conducir bajo la influencia
    siendo menor de edad si su concentración de alcohol en el aliento o en la sangre
    es de 0.02%.
- id: 218
  category: penalties_and_points
  question: Si una persona menor de 21 años es condenada por comprar o estar en posesión
    de alcohol, ¿qué pasará con sus privilegios de conducción?
  choices:
    A: Se le requerirá que tome un curso de conducción defensiva.
    B: Recibirá una carta de advertencia.
    C: Sus privilegios de conducción serán suspendidos, revocados o descalificados.
    D: Se le instalará un dispositivo de bloqueo de encendido.
  answer: C
  explanation: El manual establece que a cualquier persona menor de veintiún (21)
    años condenada por comprar o estar en posesión de alcohol se le suspenderán, revocarán
    o descalificarán sus privilegios de conducción.
- id: 219
  category: alcohol_drugs_health
  question: ¿Cómo pueden afectar su conducción los medicamentos de venta libre para
    el resfriado o las alergias?
  choices:
    A: Aumentan su concentración.
    B: Pueden causarle somnolencia y afectar sus habilidades de conducción.
    C: Mejoran su tiempo de reacción.
    D: No tienen ningún efecto en la capacidad de conducción.
  answer: B
  explanation: El manual advierte que muchos medicamentos de venta libre para el dolor
    de cabeza, los resfriados, la fiebre del heno u otras alergias pueden causar somnolencia
    y afectar las habilidades de conducción de una persona.
- id: 220
  category: alcohol_drugs_health
  question: ¿Qué debe hacer antes de conducir si está tomando medicamentos con o sin
    receta?
  choices:
    A: Beber una bebida con cafeína para mantenerse alerta.
    B: Revisar la etiqueta para ver las advertencias o preguntar a su médico sobre
      los efectos secundarios.
    C: Conducir solo durante las horas del día.
    D: Tomar la mitad de la dosis recomendada.
  answer: B
  explanation: El manual establece que algunos medicamentos con y sin receta pueden
    perjudicar la conducción, por lo que debe revisar la etiqueta para ver las advertencias
    o preguntar a su médico o farmacéutico sobre los posibles efectos secundarios
    antes de conducir.
- id: 221
  category: alcohol_drugs_health
  question: Según el manual, ¿cuál es un efecto comprobado de la marihuana en los
    conductores?
  choices:
    A: Aumenta la concentración y el estado de alerta.
    B: Detiene el deterioro causado por otras drogas.
    C: Hace que los conductores cometan más errores y tengan problemas para adaptarse
      al resplandor.
    D: Mejora los reflejos y el juicio.
  answer: C
  explanation: Los estudios han demostrado que las personas que consumen marihuana
    cometen más errores, tienen más problemas para adaptarse al resplandor y son arrestadas
    por infracciones de tráfico más que otros conductores.
- id: 222
  category: driver_responsibility
  question: ¿Cómo afectará su decisión de convertirse en donante de órganos la calidad
    de la atención de emergencia que reciba?
  choices:
    A: El personal de emergencia priorizará la preservación de órganos sobre salvar
      su vida.
    B: No influirá en la calidad de la atención de emergencia ni en el tratamiento
      médico que reciba.
    C: Recibirá tratamientos médicos experimentales.
    D: Será trasladado a un hospital especializado en trasplantes de inmediato.
  answer: B
  explanation: La decisión de convertirse en donante de órganos o tejidos no influirá
    en la calidad de la atención de emergencia o el tratamiento médico que pueda recibir
    un donante. Las donaciones de órganos solo pueden ocurrir después de que se hayan
    realizado todos los esfuerzos posibles para salvar la vida del donante.
- id: 223
  category: license_system
  question: ¿Dónde se imprime la designación de "Donante de órganos" para las personas
    que eligen participar?
  choices:
    A: En el reverso del registro del vehículo.
    B: En el frente de la licencia de conducir de Arkansas.
    C: En una tarjeta separada que se guarda en la guantera.
    D: Solo en el recibo de la licencia de conducir.
  answer: B
  explanation: Las palabras "Organ Donor" (Donante de órganos) se imprimirán en el
    frente de la licencia de conducir de Arkansas para aquellas personas que elijan
    participar como donantes de órganos registrados.
- id: 224
  category: defensive_driving
  question: ¿Cuál es el primer paso que debe tomar si sus frenos dejan de funcionar
    repentinamente?
  choices:
    A: Cambiar a reversa inmediatamente.
    B: Apagar el motor.
    C: Bombear el pedal del freno varias veces.
    D: Tirar del freno de mano tan fuerte y rápido como sea posible.
  answer: C
  explanation: Si sus frenos dejan de funcionar, el primer paso es bombear el pedal
    del freno varias veces. Esto a menudo generará suficiente presión de frenado para
    permitirle detenerse.
- id: 225
  category: defensive_driving
  question: 'Si experimenta el reventón repentino de un neumático mientras conduce,
    debe:'
  choices:
    A: Frenar bruscamente para detenerse rápido.
    B: Sujetar el volante con firmeza y mantener el vehículo recto.
    C: Girar el volante bruscamente hacia el arcén.
    D: Acelerar para mantener el control del vehículo.
  answer: B
  explanation: Si tiene un reventón repentino de un neumático, debe sujetar el volante
    con firmeza y mantener el vehículo recto, luego reducir la velocidad gradualmente
    quitando el pie del acelerador.
- id: 226
  category: vehicle_information
  question: ¿Qué sucede con la dirección y el frenado si el motor falla mientras conduce?
  choices:
    A: Tanto el volante como los frenos se bloquearán por completo.
    B: El volante será difícil de girar y es posible que deba presionar muy fuerte
      el pedal del freno.
    C: La dirección se volverá muy floja y los frenos se volverán muy sensibles.
    D: El vehículo aplicará automáticamente el freno de emergencia.
  answer: B
  explanation: Si su motor falla, debe mantener un agarre firme en el volante porque
    la dirección puede ser difícil de girar. Los frenos seguirán funcionando, pero
    es posible que deba presionar el pedal del freno con mucha fuerza.
- id: 227
  category: defensive_driving
  question: ¿Qué debe hacer si su motor sigue funcionando cada vez más rápido debido
    a un acelerador defectuoso?
  choices:
    A: Cambiar rápidamente a punto muerto (neutral) y salir de la carretera.
    B: Apagar el motor inmediatamente mientras aún está en el carril.
    C: Aplicar el freno de mano abruptamente.
    D: Cambiar a una marcha más baja y bombear el pedal del acelerador.
  answer: A
  explanation: Si el motor sigue funcionando cada vez más rápido, mantenga la vista
    en la carretera, cambie rápidamente a punto muerto (neutral), salga de la carretera
    cuando sea seguro hacerlo y apague el motor.
- id: 228
  category: defensive_driving
  question: Al intentar evitar una colisión, ¿cuáles son las tres opciones principales
    de un conductor?
  choices:
    A: Detenerse, Girar y Acelerar.
    B: Frenar, Tocar la bocina y Dar un volantazo.
    C: Poner reversa, Detenerse y Girar.
    D: Acelerar, Tocar la bocina y Encender las luces altas.
  answer: A
  explanation: 'Para evitar una colisión, los conductores tienen tres opciones: (1)
    Detenerse, (2) Girar y (3) Acelerar.'
- id: 229
  category: vehicle_information
  question: ¿Cómo debe frenar en una emergencia si su vehículo está equipado con un
    Sistema de Frenos Antibloqueo (ABS)?
  choices:
    A: Bombee el pedal del freno rápidamente.
    B: Presione el pedal del freno lo más fuerte que pueda y manténgalo presionado.
    C: Aplique una ligera presión al pedal del freno para evitar que las ruedas se
      bloqueen.
    D: Pise el pedal del freno, suéltelo y gire el volante.
  answer: B
  explanation: Con el sistema ABS, si necesita detenerse rápidamente, presione el
    pedal del freno lo más fuerte que pueda y manténgalo presionado. No suelte el
    pedal del freno.
- id: 230
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos en el volante para mantener
    el control al girar rápidamente para evitar una colisión?
  choices:
    A: A las 8 y a las 4.
    B: A las 9 y a las 3.
    C: A las 10 y a las 2.
    D: Una mano a las 12.
  answer: C
  explanation: El manual establece que la mejor manera de sujetar el volante es colocar
    las manos en las posiciones de las 10 y las 2.
- id: 231
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones podría ser necesario acelerar para
    evitar una colisión?
  choices:
    A: Al acercarse a una curva cerrada.
    B: Cuando otro vehículo está a punto de golpearlo por el lado o por detrás.
    C: Al conducir sobre hielo o nieve.
    D: Cuando su vehículo comienza a derrapar.
  answer: B
  explanation: A veces es mejor acelerar para evitar una colisión. Es posible que
    desee acelerar cuando otro vehículo esté a punto de golpearlo por el lado o por
    detrás.
- id: 232
  category: safe_driving_rules
  question: ¿Cuál es la causa de la gran mayoría de los derrapes de vehículos?
  choices:
    A: Conducir con neumáticos desinflados.
    B: Sistemas de frenos antibloqueo defectuosos.
    C: Conductores que viajan demasiado rápido para las condiciones.
    D: Falla repentina del motor.
  answer: C
  explanation: El manual establece explícitamente que la gran mayoría de los derrapes
    son causados por conductores que viajan demasiado rápido para las condiciones.
- id: 233
  category: driver_responsibility
  question: ¿Qué debe hacer si pasa por un accidente de tráfico pero no está involucrado
    y la ayuda de emergencia ya ha llegado?
  choices:
    A: Detener su vehículo para ver si puede ayudar.
    B: Concentrarse en su conducción y seguir avanzando.
    C: Detenerse a un lado y tomar fotos para evidencia.
    D: Estacionarse cerca y caminar hacia la escena.
  answer: B
  explanation: No se detenga en un accidente a menos que esté involucrado o que la
    ayuda de emergencia no haya llegado. Concéntrese en su conducción y siga avanzando
    para que su vehículo no bloquee el paso de los vehículos de rescate.
- id: 234
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un accidente de tráfico con un
    vehículo estacionado?
  choices:
    A: Dejar una nota en el parabrisas y marcharse.
    B: Intentar localizar al propietario del vehículo.
    C: Esperar dentro de su automóvil hasta que llegue la policía.
    D: Llamar a su compañía de seguros y abandonar la escena.
  answer: B
  explanation: Según el manual, en caso de verse involucrado en un choque con un vehículo
    estacionado, debe intentar localizar al propietario.
- id: 235
  category: driver_responsibility
  question: Según la ley de Arkansas, ¿cuándo debe un conductor notificar inmediatamente
    a la policía después de un accidente?
  choices:
    A: Solo si alguien muere.
    B: Si hay algún daño a la propiedad, independientemente del monto.
    C: Si alguien resulta herido, muere o los daños a la propiedad superan los $1000.
    D: Solo si el accidente involucra a un vehículo comercial.
  answer: C
  explanation: El manual establece que si alguna persona resulta herida, muere o tiene
    daños a la propiedad que superan los $1000, el conductor debe notificar a la policía
    de inmediato.
- id: 236
  category: safe_driving_rules
  question: Si se ve involucrado en un accidente de tráfico, ¿por qué debería apagar
    el encendido de los vehículos accidentados?
  choices:
    A: Para ahorrar energía de la batería para las luces de emergencia.
    B: Para evitar que el motor se sobrecaliente.
    C: Para evitar que la radio distraiga a los socorristas.
    D: Para prevenir un incendio en caso de que se haya derramado combustible.
  answer: D
  explanation: El manual aconseja apagar el encendido de los vehículos accidentados
    y no fumar cerca de ellos porque podría haberse derramado combustible, lo que
    podría causar un incendio.
- id: 237
  category: driver_responsibility
  question: Al asistir a una persona herida en la escena de un accidente, ¿qué debe
    hacer para evitar que entre en estado de shock?
  choices:
    A: Darle una taza de agua tibia.
    B: Moverla al costado de la carretera de inmediato.
    C: Cubrir a la persona con una manta o ropa abrigada.
    D: Elevar su cabeza y pecho.
  answer: C
  explanation: Para evitar que una persona herida entre en estado de shock, el manual
    indica cubrir a la persona con una manta o ropa abrigada, como un abrigo o chaqueta.
- id: 238
  category: driver_responsibility
  question: ¿Cuál es la forma adecuada de manejar una hemorragia grave en la escena
    de un accidente?
  choices:
    A: Aplicar un torniquete por encima de la herida.
    B: Aplicar presión directa sobre la herida.
    C: Lavar la herida con agua embotellada.
    D: No tocar la herida hasta que lleguen los paramédicos.
  answer: B
  explanation: El manual establece que si hay una hemorragia, se debe aplicar presión
    directa sobre la herida, ya que incluso una hemorragia grave casi siempre se puede
    detener o retrasar de esta manera.
- id: 239
  category: driver_responsibility
  question: ¿Cuándo se requiere que informe un accidente a la Oficina de Servicios
    al Conductor (Office of Driver Services)?
  choices:
    A: Si el daño a la propiedad de una persona es superior a $3000, o si hay un herido
      o fallecido.
    B: Si el daño a la propiedad supera los $1000, independientemente de las lesiones.
    C: Solo si no se llamó a la policía a la escena.
    D: Dentro de los 10 días posteriores a cualquier colisión que involucre a otro
      vehículo.
  answer: A
  explanation: Debe informar el accidente a la Oficina de Servicios al Conductor si
    hay un herido, un fallecido o daños a la propiedad de más de $3000 a la propiedad
    de una persona.
- id: 240
  category: driver_responsibility
  question: ¿Cuántos días tiene para presentar un informe de accidente ante la Oficina
    de Servicios al Conductor (Office of Driver Services) si cumple con los requisitos
    de informe?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: El manual establece que debe presentar el informe del accidente dentro
    de los treinta (30) días posteriores al accidente.
- id: 241
  category: vehicle_information
  question: ¿A qué distancia del volante debe posicionarse para mantener un margen
    de seguridad claro con respecto a las bolsas de aire del conductor?
  choices:
    A: 5 pulgadas
    B: 10 pulgadas
    C: 15 pulgadas
    D: 20 pulgadas
  answer: B
  explanation: Colocarse a 10 pulgadas de la bolsa de aire del conductor proporciona
    un margen de seguridad claro, medido desde el centro del volante hasta el esternón.
- id: 242
  category: vehicle_information
  question: ¿Cómo debe un conductor revisar adecuadamente sus puntos ciegos antes
    de cambiar de carril?
  choices:
    A: Confiar totalmente en el espejo retrovisor.
    B: Ajustar los espejos laterales para que apunten directamente a los puntos ciegos.
    C: Mirar por encima del hombro en la dirección en la que se mueve el vehículo.
    D: Mirar el reflejo en la ventana del pasajero.
  answer: C
  explanation: Los espejos no muestran objetos en los puntos ciegos. Para revisar
    adecuadamente sus puntos ciegos, debe mirar por encima del hombro en la dirección
    en la que se mueve el vehículo.
- id: 243
  category: vehicle_information
  question: ¿Cuál de los siguientes es un indicador de un posible problema con los
    frenos?
  choices:
    A: Un olor desagradable durante un frenado brusco.
    B: El volante vibrando a altas velocidades.
    C: El motor acelerando ruidosamente al acelerar.
    D: Un chirrido al girar el volante.
  answer: A
  explanation: Los indicadores de un posible problema con los frenos incluyen un ruido
    debajo del vehículo al presionar el pedal, un olor desagradable durante un frenado
    brusco o presionar el pedal con poca acción de frenado.
- id: 244
  category: vehicle_information
  question: ¿Con qué frecuencia se deben reemplazar generalmente las escobillas de
    los limpiaparabrisas?
  choices:
    A: Cada 3 meses.
    B: Cada 6 meses a un año.
    C: Cada 2 a 3 años.
    D: Solo cuando dejen de funcionar por completo.
  answer: B
  explanation: Las escobillas de los limpiaparabrisas deben reemplazarse cada seis
    (6) meses a un año o tan pronto como note una diferencia en la visibilidad al
    conducir.
- id: 245
  category: vehicle_information
  question: ¿Qué define a un 'neumático frío' al verificar la presión de inflado de
    los neumáticos?
  choices:
    A: Un neumático que ha sido conducido en clima gélido.
    B: Un neumático que no ha sido conducido durante al menos tres horas.
    C: Un neumático que ha estado estacionado a la sombra.
    D: Un neumático que ha sido conducido por menos de 10 millas.
  answer: B
  explanation: El término frío no se refiere a la temperatura exterior. Un neumático
    frío es aquel que no ha sido conducido durante al menos tres horas.
- id: 246
  category: vehicle_information
  question: ¿A qué profundidad de la banda de rodadura se considera generalmente que
    los neumáticos no son seguros y necesitan ser reemplazados?
  choices:
    A: 1/2 de pulgada
    B: 1/4 de pulgada
    C: 1/8 de pulgada
    D: 1/16 de pulgada
  answer: D
  explanation: En general, los neumáticos no son seguros y deben reemplazarse cuando
    la banda de rodadura se desgasta hasta 1/16 de pulgada.
- id: 247
  category: driver_responsibility
  question: Si está ayudando en la escena de un accidente, ¿cuándo es aceptable darle
    algo de beber a una persona herida?
  choices:
    A: Si están conscientes y piden agua.
    B: Si muestran signos de shock.
    C: No debe darles nada de beber hasta que llegue el personal médico.
    D: Solo si tiene agua embotellada disponible.
  answer: C
  explanation: 'El manual establece explícitamente: ''No dé nada de beber a los heridos,
    ni siquiera agua, hasta que el personal médico esté en la escena''.'
- id: 248
  category: vehicle_information
  question: ¿Cómo debe ajustar el espejo retrovisor lateral del conductor?
  choices:
    A: Coloque la cabeza contra la ventana lateral izquierda y ajuste el espejo de
      modo que apenas pueda ver el costado del automóvil.
    B: Coloque la cabeza sobre la consola central y ajuste el espejo para ver todo
      el carril detrás de usted.
    C: Ajústelo para que pueda ver toda la ventana trasera sin mover la cabeza.
    D: Inclínelo hacia abajo para que pueda ver los neumáticos traseros.
  answer: A
  explanation: Para ajustar el espejo retrovisor lateral del conductor, coloque la
    cabeza contra la ventana lateral izquierda y ajuste el espejo de modo que apenas
    pueda ver el costado del automóvil en el lado derecho del espejo.
- id: 249
  category: vehicle_information
  question: ¿Cómo puede usar una moneda de un centavo (penny) para verificar si su
    vehículo necesita neumáticos nuevos?
  choices:
    A: Coloque la moneda con la cabeza de Lincoln hacia arriba; si ve su barbilla,
      necesita neumáticos nuevos.
    B: Coloque la moneda con la cabeza de Lincoln al revés; si puede ver la parte
      superior de su cabeza, necesita neumáticos nuevos.
    C: Coloque la moneda plana en la banda de rodadura; si se cae, necesita neumáticos
      nuevos.
    D: Frote la moneda en el neumático; si deja una marca, necesita neumáticos nuevos.
  answer: B
  explanation: Según el manual, si coloca una moneda de un centavo en la banda de
    rodadura con la cabeza de Lincoln al revés y frente a usted, y puede ver la parte
    superior de la cabeza de Lincoln, es hora de comprar neumáticos nuevos.
- id: 250
  category: safe_driving_rules
  question: ¿Por qué se recomienda abrir ocasionalmente una ventana durante el invierno
    mientras se conduce?
  choices:
    A: Para evitar que el motor se sobrecaliente.
    B: Para evitar que el parabrisas se agriete en climas fríos.
    C: Para reducir el riesgo de que se filtren gases de escape tóxicos en el vehículo
      en movimiento.
    D: Para mejorar la eficiencia de combustible del vehículo.
  answer: C
  explanation: Durante el invierno, es una buena idea abrir ocasionalmente una ventana
    para permitir que el aire fresco llene la cabina, lo que reduce cualquier riesgo
    de que se filtren gases de escape tóxicos en el vehículo en movimiento.
- id: 251
  category: vehicle_information
  question: ¿Qué debe asegurarse siempre de que esté puesto antes de arrancar el motor
    de su vehículo?
  choices:
    A: El aire acondicionado
    B: El freno de estacionamiento
    C: El control de crucero
    D: Las luces de emergencia
  answer: B
  explanation: El manual establece que siempre debe asegurarse de que el freno de
    estacionamiento esté puesto antes de arrancar el motor.
- id: 252
  category: driver_testing
  question: Al presentarse para su examen de habilidades, ¿cuál de los siguientes
    debe traer?
  choices:
    A: Una fotocopia laminada de su permiso de instrucción.
    B: Un conductor con licencia válida que tenga al menos 18 años.
    C: Comprobante de seguro vigente y registro del vehículo.
    D: Una copia certificada de su historial de manejo.
  answer: C
  explanation: Los solicitantes deben traer su permiso de instrucción original, un
    conductor con licencia válida de 21 años o más, seguro vigente (en papel o electrónico)
    y el registro del vehículo.
- id: 253
  category: driver_testing
  question: ¿Cuál de las siguientes condiciones del vehículo hará que un examinador
    se niegue a administrar una prueba de habilidades?
  choices:
    A: El vehículo tiene una llanta de repuesto temporal (tipo "dona").
    B: El vehículo tiene alfombrillas de papel.
    C: El radio del vehículo no funciona.
    D: El vehículo tiene una transmisión manual.
  answer: A
  explanation: No se realizará una prueba de habilidades si los neumáticos están tan
    desgastados que resultan inseguros, y el manual establece explícitamente que no
    se permiten llantas de repuesto temporales (donas) en el vehículo.
- id: 254
  category: driver_testing
  question: Durante la parte de controles del vehículo de la prueba de habilidades,
    ¿cuántos controles fallidos se permiten antes de reprobar el examen?
  choices:
    A: Uno (1)
    B: Dos (2)
    C: Tres (3)
    D: Cuatro (4)
  answer: C
  explanation: Si el solicitante no puede localizar un control, se marca como una
    infracción. Se permiten tres (3) controles fallidos antes de que se repruebe el
    examen.
- id: 255
  category: driver_testing
  question: ¿Cuántos intentos fallidos en la misma categoría en la prueba de manejo
    resultarán en un examen reprobado?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Un total de dos intentos fallidos en la misma categoría constituirá
    un examen reprobado (por ejemplo, realizar una segunda parada incompleta o "rolling
    stop").
- id: 256
  category: penalties_and_points
  question: ¿Cuál es la sanción impuesta por una falla automática durante la prueba
    de manejo?
  choices:
    A: Una sanción de una semana
    B: Una sanción de dos semanas
    C: Una sanción de treinta días
    D: Una sanción de seis meses
  answer: C
  explanation: De acuerdo con las pautas de desempeño, a las fallas automáticas se
    les impone una sanción de treinta días.
- id: 257
  category: license_system
  question: ¿Por cuánto tiempo es válido el permiso de instrucción de Arkansas?
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Cuatro años
  answer: C
  explanation: El manual establece que el permiso es válido por dos (2) años y no
    se puede renovar.
- id: 258
  category: license_system
  question: ¿Se puede extender un permiso de instrucción si vence durante un período
    de clima inclemente?
  choices:
    A: Sí, hasta por 30 días.
    B: Sí, pero solo si la prueba de habilidades ya estaba programada.
    C: No, los permisos no se pueden extender por ningún motivo.
    D: No, a menos que sea aprobado por un oficial de la policía estatal.
  answer: C
  explanation: 'El manual establece explícitamente: "Los permisos no se pueden extender
    por ningún motivo, debido a las inclemencias del tiempo. ¡Sin excepciones!"'
- id: 259
  category: vehicle_information
  question: Se rechazará un vehículo para el examen de habilidades si el polarizado
    de la ventana delantera es más oscuro de ¿qué porcentaje?
  choices:
    A: 10%
    B: 15%
    C: 25%
    D: 50%
  answer: C
  explanation: Se rechazará el polarizado de ventanas más oscuro del 25% en la parte
    delantera y más oscuro del 10% en la parte trasera.
- id: 260
  category: driver_testing
  question: ¿Bajo cuál de las siguientes condiciones climáticas NO se cancelará una
    prueba de manejo?
  choices:
    A: Lluvia
    B: Tormentas eléctricas severas
    C: Niebla
    D: Aguanieve o nieve
  answer: A
  explanation: Una prueba de manejo no se cancela debido a la lluvia. Sin embargo,
    las pruebas no se administran en caso de tormentas eléctricas severas, niebla,
    aguanieve o nieve.
- id: 261
  category: driver_testing
  question: ¿Quién tiene permitido conducir al solicitante al centro de exámenes si
    no es el conductor acompañante de 21 años?
  choices:
    A: Cualquier persona con un permiso de aprendizaje.
    B: Un conductor sin restricciones con una licencia Clase D válida, de 16 años
      o más.
    C: Solo un conductor comercial.
    D: El solicitante puede conducir solo.
  answer: B
  explanation: Un conductor sin restricciones con una licencia Clase D válida, de
    (16) años o más, puede conducir al solicitante al centro de exámenes.
- id: 262
  category: vehicle_information
  question: Durante la inspección del vehículo para una prueba de habilidades, ¿se
    rechazará un vehículo si la franja de tinte del parabrisas mide más de cuántas
    pulgadas desde el centro del parabrisas?
  choices:
    A: 3 pulgadas
    B: 4 pulgadas
    C: 5 pulgadas
    D: 6 pulgadas
  answer: C
  explanation: Cualquier franja que mida más de 5 pulgadas desde el centro del parabrisas
    será rechazada.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 263
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 264
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 265
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 266
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    hacia la que apunta la flecha.'
  id: 267
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 268
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 269
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 270
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín de color blanco y negro que dice NO
    PASSING ZONE (zona de no rebasar) significa que no se le permite rebasar a otros
    vehículos en esta área. Marca el inicio de una zona de no rebasar.
  id: 271
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de KEEP RIGHT (manténgase a la derecha)
    con una flecha significa que debe mantenerse al lado derecho de una isla de tráfico,
    mediana u obstrucción.
  id: 272
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 273
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 274
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 275
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 276
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 277
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 278
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 279
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa giro a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 280
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero en un sentido y luego en el otro.
  id: 281
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros adelante
    D: Una colina adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 282
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: Un carril que termina
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 283
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente adelante
    B: La carretera se estrecha adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera adelante se vuelve
    más estrecha. Prepárese para una reducción en el ancho de la vía y ajuste su posición
    en el carril.
  id: 284
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera adelante se convierte en una autopista
    dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase a
    la derecha.
  id: 285
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación adelante
    D: Construcción de carretera adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico en ambos
    sentidos.
  id: 286
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de rebase adelante
    C: 'Tráfico en ambos sentidos adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 287
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 288
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 289
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) adelante
    B: Un semáforo adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo adelante. Prepárese para detenerse
    si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde el semáforo
    puede no ser visible desde la distancia.
  id: 290
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 291
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 292
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 293
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 294
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse o dejar el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) en rojo y blanco significa
    que no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 295
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 296
