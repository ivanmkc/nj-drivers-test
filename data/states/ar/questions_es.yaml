- id: 77
  category: driver_responsibility
  question: En Arkansas, ¿cuántos puntos se agregan a su historial de manejo por exceder
    el límite de velocidad de 15 a 30 millas por hora sobre el límite indicado?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 8 puntos
  answer: C
  explanation: El sistema de puntos de Arkansas asigna 5 puntos por condenas por exceso
