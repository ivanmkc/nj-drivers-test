metadata:
  source: Arkansas Driver License Study Guide, Volume 1 - Edition 10 (dps.arkansas.gov)
  total_questions: 296
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: penalties_and_points
  question: According to Arkansas law, what is the fine for a first offense of littering?
  choices:
    A: Not less than $50 and not more than $500
    B: Not less than $100 and not more than $1,000
    C: Not less than $200 and not more than $2,000
    D: A flat fine of $1,000
  answer: B
  explanation: A person convicted of a first offense of littering shall be fined in
    an amount of not less than one hundred dollars ($100) and not more than one thousand
    dollars ($1,000).
- id: 2
  category: driver_responsibility
  question: If litter is thrown from a motor vehicle (other than a motor bus), who
    is presumed to have committed the act under prima facie evidence?
  choices:
    A: The passenger sitting nearest to the window
    B: The registered owner of the vehicle
    C: The driver of the motor vehicle
    D: All occupants of the vehicle equally
  answer: C
  explanation: If the throwing, dumping, or depositing of litter was done from a motor
    vehicle, except a motor bus, it shall be prima facie evidence that the act was
    done by the driver of the motor vehicle.
- id: 3
  category: penalties_and_points
  question: What is the penalty for failing to pay fines assessed for a littering
    conviction?
  choices:
    A: Your vehicle will be impounded for 30 days
    B: You will be sentenced to 100 hours of community service
    C: Your driver's license will be suspended for six (6) months
    D: You will face a mandatory 30-day jail sentence
  answer: C
  explanation: Any person convicted of a littering violation who fails to pay assessed
    fines shall have his or her driver's license suspended for six (6) months by the
    Department of Finance and Administration.
- id: 4
  category: penalties_and_points
  question: What is the penalty for a first offense of illegally discarding an inoperative
    household appliance upon a public highway right-of-way?
  choices:
    A: A $500 fine and 50 hours of community service
    B: A $1,000 fine and 100 hours of community service
    C: A $2,000 fine and 24 hours of community service
    D: A Class A misdemeanor with up to 1 year in jail
  answer: B
  explanation: Any person who violates the provision regarding discarding certain
    items (like household appliances) shall be guilty of an unclassified misdemeanor
    for a first offense, fined $1,000, and sentenced to 100 hours of community service.
- id: 5
  category: defensive_driving
  question: What should you do if you are being pulled over but are unsure if it is
    an actual police officer?
  choices:
    A: Speed up and drive to the nearest police station
    B: Stop immediately in the lane of traffic and lock your doors
    C: Activate your turn signal, pull to a well-lit location, dial 9-1-1, and request
      confirmation
    D: Ignore the vehicle and continue driving to your destination
  answer: C
  explanation: If you are unsure you are being stopped by an actual police officer,
    activate your turn signal, pull to the nearest well-lit location, dial 9-1-1,
    and request a police officer confirmation.
- id: 6
  category: safe_driving_rules
  question: When pulling over for a law enforcement officer, which of the following
    locations should you avoid stopping on?
  choices:
    A: The right side of the road
    B: A well-lit parking lot
    C: Bridges or overpasses
    D: A designated highway shoulder
  answer: C
  explanation: 'The manual states to pull to the closest safest spot out of the traffic
    lane and specifically warns: "Do not stop on bridges or overpasses."'
- id: 7
  category: safe_driving_rules
  question: If you are stopped by law enforcement at night, what action should you
    take to assist the officer?
  choices:
    A: Turn off your headlights completely
    B: Turn on your interior lights
    C: Step out of the vehicle with a flashlight
    D: Flash your high beams repeatedly
  answer: B
  explanation: If you are stopped at night, turn on the interior lights, so that the
    officer can see you more clearly.
- id: 8
  category: driver_responsibility
  question: During a traffic stop, which three documents are you required by Arkansas
    law to provide when requested by the officer?
  choices:
    A: Driver's license, proof of insurance, and vehicle registration
    B: Driver's license, social security card, and vehicle registration
    C: Proof of insurance, vehicle title, and driver's license
    D: Driver's license, birth certificate, and proof of insurance
  answer: A
  explanation: In accordance with Arkansas laws, you are required to provide your
    driver's license, proof of insurance, and vehicle registration when requested
    by the officer.
- id: 9
  category: safe_driving_rules
  question: If you have a weapon in your vehicle during a traffic stop, what is the
    proper procedure?
  choices:
    A: Quickly reach for the weapon to hand it to the officer
    B: Hide the weapon under the seat before the officer approaches
    C: Inform the officer of the weapon, its type and location, and do not reach for
      it
    D: Keep quiet about the weapon unless the officer searches the vehicle
  answer: C
  explanation: Be sure to inform the officer if there is a weapon in the vehicle,
    the type of weapon, and the location. You should not reach for the weapon and
    always follow the officer's instructions.
- id: 10
  category: penalties_and_points
  question: What does signing a traffic citation mean?
  choices:
    A: It is an admission of guilt for the traffic violation
    B: It is a promise to appear in court or pay the fine before the court date
    C: It waives your right to contest the citation in court
    D: It gives the officer permission to search your vehicle
  answer: B
  explanation: Signing a citation is not an admission of guilt. It is a promise to
    appear in court at the designated time or to pay the fine before the court date.
- id: 11
  category: sharing_the_road
  question: According to Arkansas Law, what must you do when passing an authorized
    vehicle stopped on the side of the road?
  choices:
    A: Stop immediately and wait for the officer to wave you past
    B: Honk your horn to alert the officer of your presence
    C: Maintain your speed and stay in your current lane
    D: Move to the farthest lane away, or reduce your speed if changing lanes is unsafe
  answer: D
  explanation: Arkansas Law requires that you move to the farthest lane or position
    away from the authorized vehicle as you pass. If it is unsafe or not possible
    to change lanes, you must reduce your speed.
- id: 12
  category: driver_testing
  question: Which appointment type should a non-U.S. citizen with immigration documents
    select to allow more time with the examiner?
  choices:
    A: Driver's License Test for Learning Differences
    B: Driver's License/Motorcycle Instruction Permit Test
    C: Commercial Driver's License Knowledge Applicants
    D: Driver's License and Motorcycle Skills Test
  answer: B
  explanation: 'Under ''Driver''s License/Motorcycle Instruction Permit Test'', the
    manual states: ''If you are a non-U.S. Citizen and have immigration documents,
    please select this appointment type. This will allow you more time with the examiner.'''
- id: 13
  category: driver_testing
  question: What accommodation is provided when scheduling a 'Driver's License Test
    for Learning Differences'?
  choices:
    A: A written test in multiple languages
    B: An oral test with an examiner
    C: A waiver for the driving skills test
    D: An open-book knowledge exam
  answer: B
  explanation: The 'Driver's License Test for Learning Differences' appointment type
    will allow you to schedule an oral test with an examiner.
- id: 14
  category: license_system
  question: What is required before you can take the driving portion of the Motorcycle
    Skills Test?
  choices:
    A: You must have a Class D license for at least one year
    B: You must have completed the Knowledge Exam and have the motorcycle transported
      or driven by someone with an 'M' endorsement
    C: You must present a certificate from an approved motorcycle safety course
    D: You must pass a commercial skills exam first
  answer: B
  explanation: 'For the Driver''s License and Motorcycle Skills Test, the manual states:
    ''Motorcycles- You must have a completed Knowledge Exam and your motorcycle must
    be transported to the testing center or driven by a person with an "M" endorsement.'''
- id: 15
  category: vehicle_information
  question: Under what condition is a commercial vehicle hauling refuse NOT required
    to be covered?
  choices:
    A: When traveling at speeds below 35 mph
    B: When hauling predominantly metallic material loaded in a manner that prevents
      it from falling
    C: When the vehicle is traveling less than 10 miles to the disposal site
    D: When the driver is operating their own personal truck for commercial use
  answer: B
  explanation: 'The manual states: ''However, no vehicle hauling predominately metallic
    material shall be required to be covered if it is loaded in a manner which will
    prevent the material from falling or dropping from the vehicle.'''
- id: 16
  category: driver_testing
  question: What is the name of the official testing application offered by the Arkansas
    State Police?
  choices:
    A: AR DMV Practice
    B: AR Driver Testing
    C: Arkansas Road Rules
    D: ASP Driving Prep
  answer: B
  explanation: According to the introduction of the manual, the Arkansas State Police
    offers a testing APP called 'AR Driver Testing'.
- id: 17
  category: driver_testing
  question: What is the Arkansas State Police's relationship with third-party websites
    offering practice tests?
  choices:
    A: They endorse all third-party practice tests.
    B: They are not associated with third-party websites offering practice tests.
    C: They require applicants to use third-party websites.
    D: They partner with select third-party websites for official testing.
  answer: B
  explanation: The manual's introduction explicitly states, 'The Arkansas State Police
    is not associated with third-party websites offering practice tests.'
- id: 18
  category: license_system
  question: Which of the following is listed as a type of graduated license in Arkansas?
  choices:
    A: Class A Commercial License
    B: Chauffeur's License
    C: Intermediate License
    D: Hardship License
  answer: C
  explanation: The Table of Contents lists the 'Intermediate License' under the 'Types
    of Graduated Licenses' section.
- id: 19
  category: license_system
  question: What type of vehicle does a Class M license permit you to operate?
  choices:
    A: Motor driven Cycle
    B: Motorized Bicycle
    C: Motorcycle
    D: Motorhome
  answer: C
  explanation: The Table of Contents explicitly lists the 'Class M' license as a '(Motorcycle)
    License'.
- id: 20
  category: license_system
  question: What specific form is required for driver's license applicants under age
    18, alongside the signature of a parent or legal guardian?
  choices:
    A: ASP-33 Parent Affidavit and Financial Responsibility and Acceptance
    B: ASP-10 Driver Education Certificate
    C: DMV-18 Minor Consent Form
    D: AR-55 Provisional License Application
  answer: A
  explanation: The Table of Contents lists the 'ASP-33 Parent Affidavit and Financial
    Responsibility and Acceptance' under the requirements for Applicants Under Age
    18.
- id: 21
  category: safe_driving_rules
  question: Which of the following topics is categorized under 'Arkansas Law' in Chapter
    1 of the manual?
  choices:
    A: Right on Red Rule
    B: Protection from Secondhand Smoke
    C: Shared Center Lane
    D: Blind Spots
  answer: B
  explanation: '''Protection from Secondhand Smoke'' is listed under Chapter 1: Arkansas
    Law in the Table of Contents.'
- id: 22
  category: sharing_the_road
  question: In which chapter of the manual would you find information about avoiding
    the 'No-Zone'?
  choices:
    A: 'Chapter 3: General Driving'
    B: 'Chapter 4: Safe Driving'
    C: 'Chapter 6: Tractor Trailer Rigs'
    D: 'Chapter 9: Emergencies'
  answer: C
  explanation: '''Avoiding the Tractor Trailer No-Zone'' is listed under Chapter 6:
    Tractor Trailer Rigs in the Table of Contents.'
- id: 23
  category: vehicle_information
  question: Which of the following is listed as a specific vehicle emergency in Chapter
    9?
  choices:
    A: Running out of gas
    B: Faulty Accelerator
    C: Broken windshield wiper
    D: Dead battery
  answer: B
  explanation: '''Faulty Accelerator'' is specifically listed under Vehicle Emergencies
    in Chapter 9 of the Table of Contents.'
- id: 24
  category: driver_testing
  question: According to the Skills Test Guidelines (Chapter 10), which of the following
    is a required part of inspecting your vehicle?
  choices:
    A: Checking the radio
    B: Inspecting the exhaust system
    C: Adjusting the air conditioning
    D: Checking the glove compartment
  answer: B
  explanation: The 'Exhaust System' is listed under 'Inspecting Your Vehicle' in Chapter
    10 of the Table of Contents.
- id: 25
  category: license_system
  question: What does a Class MD license stand for in the Arkansas licensing system?
  choices:
    A: Medium Duty License
    B: Motor driven Cycle License
    C: Medical Driver License
    D: Motorized Dirt-bike License
  answer: B
  explanation: The Table of Contents lists 'Class MD (Motor driven Cycle) License'
    under the types of licenses.
- id: 26
  category: alcohol_drugs_health
  question: 'Which of the following health conditions is specifically listed under
    the ''Health'' section of Chapter 8: Driving Fitness?'
  choices:
    A: Asthma
    B: Epilepsy
    C: Arthritis
    D: Migraines
  answer: B
  explanation: '''Epilepsy'' is listed as a sub-topic under ''Health'' in Chapter
    8 of the Table of Contents.'
- id: 27
  category: driver_testing
  question: According to the introduction, what are the two parts of the exams that
    this manual helps you prepare for and pass?
  choices:
    A: The vision and hearing exams
    B: The physical and psychological exams
    C: The knowledge and skill (driving portion) exams
    D: The written and oral exams
  answer: C
  explanation: The introduction states the manual will 'help you prepare and pass
    the knowledge and skill (driving portion) part of the exams.'
- id: 28
  category: safe_driving_rules
  question: Under which section are 'Roundabouts' discussed in Chapter 3 of the manual?
  choices:
    A: Parking
    B: Right of Way
    C: Multiple Lanes
    D: Passing
  answer: B
  explanation: In the Table of Contents for Chapter 3, 'Roundabouts' is listed as
    a sub-section under 'Right of Way'.
- id: 29
  category: signs_and_signals
  question: Which of the following is categorized as a 'Traffic Control Sign' in Chapter
    2?
  choices:
    A: Cross Buck Sign
    B: Do Not Enter Sign
    C: Fog Line
    D: Shared Center Lane
  answer: B
  explanation: The 'Do Not Enter Sign' is listed under 'Traffic Control Signs' in
    Chapter 2 of the Table of Contents.
- id: 30
  category: driver_testing
  question: What specific checklist is mentioned under the 'Performance Guidelines'
    in Chapter 10?
  choices:
    A: Pre-trip Inspection Checklist
    B: 1-2-3 Skills Checklist
    C: Safe Driving Checklist
    D: Emergency Preparedness Checklist
  answer: B
  explanation: The '1-2-3 Skills Checklist' is listed under 'Performance Guidelines'
    in Chapter 10 of the Table of Contents.
- id: 31
  category: driver_testing
  question: According to ACT 1289 of 2015, what is the fee required for each written
    examination?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: There is no fee for the written examination
  answer: A
  explanation: ACT 1289 of 2015 requires a $5.00 fee for each written examination,
    which is added to the cost of your driver's license.
- id: 32
  category: license_system
  question: How many days does a new resident of Arkansas have to obtain an Arkansas
    driver's license?
  choices:
    A: 10 calendar days
    B: 15 calendar days
    C: 30 calendar days
    D: 60 calendar days
  answer: C
  explanation: Within thirty (30) calendar days of becoming a resident, any person
    who is a resident of this state shall obtain an Arkansas driver's license.
- id: 33
  category: license_system
  question: Which of the following individuals is permitted to drive on Arkansas roadways
    with a valid out-of-state license without obtaining an Arkansas license?
  choices:
    A: A new resident who has lived in Arkansas for 45 days
    B: A non-resident who has been physically present in the state for 8 months
    C: A college student attending classes who is considered a non-resident
    D: Anyone over the age of 21
  answer: C
  explanation: Students attending classes who are considered non-residents under rules
    regulating the payment of tuition (e.g., College or Exchange Students) can drive
    provided they have a valid license from another state.
- id: 34
  category: license_system
  question: How long is an Instruction Permit valid for after passing the knowledge
    exam?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 4 years
  answer: C
  explanation: The instruction permit will be issued for 2 (two) years from the date
    of the passed knowledge exam.
- id: 35
  category: safe_driving_rules
  question: When driving with an Instruction Permit, the driver must be accompanied
    by a licensed driver who is at least what age?
  choices:
    A: 18 years of age
    B: 19 years of age
    C: 21 years of age
    D: 25 years of age
  answer: C
  explanation: The applicant with an instruction permit may drive with a licensed
    driver twenty-one (21) years of age or older, who is occupying a seat beside the
    driver.
- id: 36
  category: vehicle_information
  question: 'A standard Class D License allows you to operate a vehicle with a gross
    weight rating (GVWR) under:'
  choices:
    A: 10,000 pounds
    B: 16,000 pounds
    C: 26,001 pounds
    D: 32,000 pounds
  answer: C
  explanation: Class D Licenses may operate an automobile or other four-wheel vehicle
    with a gross weight rating (GVWR) under 26,001 pounds.
- id: 37
  category: license_system
  question: 'To apply for a Learner''s License, the applicant must NOT have been involved
    in a traffic crash or convicted of a serious traffic violation within the preceding:'
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: B
  explanation: To receive a Learner's License, the applicant cannot be involved in
    any traffic crash or be convicted of a serious traffic violation within the preceding
    six (6) months prior to application.
- id: 38
  category: safe_driving_rules
  question: A driver with an Intermediate License may NOT operate a motor vehicle
    with more than how many unrelated minor passengers, unless accompanied by a licensed
    driver 21 or older?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: A driver with an intermediate license shall not operate a motor vehicle
    with more than one (1) unrelated minor passenger unless accompanied by a licensed
    driver twenty-one (21) years or older.
- id: 39
  category: safe_driving_rules
  question: Between what hours is a driver with an Intermediate License prohibited
    from driving, unless accompanied by a licensed driver 21 or older or driving to
    an exempt activity?
  choices:
    A: 10:00 pm and 5:00 am
    B: 11:00 pm and 4:00 am
    C: Midnight and 6:00 am
    D: 9:00 pm and 6:00 am
  answer: B
  explanation: A driver with an intermediate driver's license cannot operate a motor
    vehicle between the hours of 11:00 pm and 4:00 am unless accompanied by a licensed
    driver twenty-one (21) years of age or older, driving to and from a school activity,
    church activity, job, or an emergency.
- id: 40
  category: driver_responsibility
  question: What are the cell phone restrictions for a Class D driver who is between
    18 and 21 years of age?
  choices:
    A: They may use a hand-held phone for any purpose.
    B: They may use a hands-free device for interactive communication, but cannot
      text.
    C: They are completely prohibited from using any wireless device.
    D: They may text only when stopped at a red light.
  answer: B
  explanation: A Class D driver who is at least eighteen (18) but less than twenty-one
    (21) years of age may use a hands-free wireless telephone or device for interactive
    communication while driving. Text messages are not allowed regardless of age.
- id: 41
  category: driver_testing
  question: 'The motorcycle skill exam for a Class M license can be waived if the
    applicant successfully completes:'
  choices:
    A: An online defensive driving course
    B: A Motorcycle Safety Foundation Riders Course
    C: 50 hours of supervised driving
    D: A commercial driver training program
  answer: B
  explanation: The motorcycle skill exam can be waived with the successful completion
    of a Motorcycle Safety Foundation Riders Course.
- id: 42
  category: license_system
  question: What is the minimum age required to be issued a non-restricted Class M
    (Motorcycle) License?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 18 years of age
  answer: C
  explanation: Class M (Motorcycle) License- This license is a non-restricted motorcycle
    license issued to persons sixteen (16) years of age or older to operate a motorcycle
    on public roadways.
- id: 43
  category: license_system
  question: 'A Class MD (Motor Driven Cycles) license is a restricted license issued
    to persons between the ages of:'
  choices:
    A: 14 and 16
    B: 16 and 18
    C: 15 and 17
    D: 18 and 21
  answer: A
  explanation: Class MD (Motor Driven Cycles) - This license is a restricted license
    issued to persons between fourteen (14) and sixteen (16) years of age.
- id: 44
  category: license_system
  question: Which of the following would prevent an individual from obtaining an Arkansas
    driver's license?
  choices:
    A: Being 18 years of age
    B: Having a valid hard copy driver's license from another state
    C: Having judgments pending for a moving traffic violation
    D: Being a member of the Armed Forces on active duty
  answer: C
  explanation: An individual may obtain a driver's license if... You have no judgments
    pending for a moving traffic violation.
- id: 45
  category: driver_responsibility
  question: According to the manual, which age group is legally permitted to send
    text messages while driving?
  choices:
    A: Drivers over 18
    B: Drivers over 21
    C: Drivers with a Class D license
    D: Text messages are not allowed regardless of age
  answer: D
  explanation: The manual explicitly states under the Class D License section that
    'Text messages are not allowed regardless of age.'
- id: 46
  category: license_system
  question: What is the maximum engine displacement a person with a Class MD (Motor
    Driven) License is restricted to operating?
  choices:
    A: 50 cubic centimeters or less
    B: 150 cubic centimeters or less
    C: 250 cubic centimeters or less
    D: 500 cubic centimeters or less
  answer: C
  explanation: According to the manual, the MD License is restricted to operating
    motorcycles displacing 250 cubic centimeters or less.
- id: 47
  category: driver_testing
  question: How long is a driver's knowledge exam valid for after it has been successfully
    completed?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: The manual states that the knowledge exam will be valid for 1 (one)
    year.
- id: 48
  category: driver_testing
  question: How can an applicant waive the motor-driven skill exam when applying for
    a Class MD License?
  choices:
    A: By holding a valid Class D license for at least one year
    B: By successfully completing a Motorcycle Safety Foundation Riders Course
    C: By passing the written knowledge exam with a perfect score
    D: By passing a vision test with 20/20 uncorrected vision
  answer: B
  explanation: The motor-driven skill exam can be waived with the successful completion
    of a Motorcycle Safety Foundation Riders Course. The certificate must be returned
    within 90 days.
- id: 49
  category: license_system
  question: A Motorized Bicycle (MB) Certificate restricts the operation of a motorized
    bicycle or motorcycle to what engine size?
  choices:
    A: 50 cubic centimeters or less
    B: 100 cubic centimeters or less
    C: 150 cubic centimeters or less
    D: 250 cubic centimeters or less
  answer: A
  explanation: A Motorized Bicycle Certificate restricts the operation of a motorized
    bicycle or motorcycle displacing fifty (50) centimeters or less.
- id: 50
  category: driver_testing
  question: What is the minimum field of vision required for a driver's license applicant
    with two functional eyes?
  choices:
    A: 90 degrees
    B: 105 degrees
    C: 120 degrees
    D: 140 degrees
  answer: D
  explanation: The manual requires that your field of vision must be 140 degrees for
    a person with two (2) functional eyes.
- id: 51
  category: driver_testing
  question: What is the minimum uncorrected visual acuity required to receive an unrestricted
    driver's license in Arkansas?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/70
  answer: C
  explanation: A minimum uncorrected visual acuity of 20/40 is required for an unrestricted
    license.
- id: 52
  category: driver_testing
  question: Which of the following countries has a reciprocal agreement with Arkansas
    and is exempt from driver testing?
  choices:
    A: Mexico
    B: Germany
    C: Japan
    D: United Kingdom
  answer: B
  explanation: Germany is listed in the manual as one of the countries exempt from
    testing due to a reciprocal agreement, along with Manitoba (Canada), France, Taiwan,
    and South Korea.
- id: 53
  category: license_system
  question: How many primary documents are required for a driver's license applicant
    age 18 and older if they do NOT provide a secondary document?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Applicants over the age of eighteen must have either Two Primary Documents;
    OR One Primary and One Secondary document.
- id: 54
  category: license_system
  question: Which of the following is considered an acceptable secondary document
    for applicants age 18 and older?
  choices:
    A: A W-2 Form
    B: An IRS Tax Return within the last 2 years
    C: A Border Crossing Card
    D: A Tribal Card
  answer: B
  explanation: An IRS Tax Return within the last 2 years is an accepted secondary
    document. The manual specifically notes that a W-2 Form, Border Crossing Cards,
    and Tribal Cards are not acceptable.
- id: 55
  category: license_system
  question: For applicants under the age of 18, which of the following is true regarding
    their primary identification document?
  choices:
    A: A hospital birth certificate is the preferred primary document.
    B: U.S. citizens (minors) cannot use a U.S. passport as a primary document.
    C: A photocopied birth certificate is acceptable if it is notarized.
    D: A translated foreign birth certificate is accepted as a primary document.
  answer: B
  explanation: 'The manual explicitly states for applicants under 18: ''U.S. citizens
    (minors) cannot use a U.S. passport as a primary document.'''
- id: 56
  category: license_system
  question: Which type of birth certificate is NOT accepted for a minor applying for
    a driver's license?
  choices:
    A: An original U.S. birth certificate
    B: A certified copy of a U.S. birth certificate
    C: A hospital birth certificate
    D: A Birth Abroad Certificate
  answer: C
  explanation: The manual states that for minors, 'No hospital birth certificates
    or birth registration cards will be accepted.'
- id: 57
  category: penalties_and_points
  question: Under Arkansas law, what is the maximum fine for a seat belt violation,
    excluding court costs or fees?
  choices:
    A: $15.00
    B: $25.00
    C: $50.00
    D: $100.00
  answer: B
  explanation: Any person who violates the seat belt law shall be subject to a fine
    not to exceed twenty-five dollars ($25.00), and any court costs or fees.
- id: 58
  category: safe_driving_rules
  question: 'According to the Child Passenger Protection Act, a child must be secured
    in a child passenger safety seat if they are under six (6) years of age and weigh
    less than:'
  choices:
    A: 40 pounds
    B: 50 pounds
    C: 60 pounds
    D: 80 pounds
  answer: C
  explanation: A child who is less than six (6) years of age and who weighs less than
    sixty (60) pounds shall be restrained in a child passenger safety seat.
- id: 59
  category: safe_driving_rules
  question: Up to what age must all children wear appropriate safety restraints while
    a vehicle is in motion?
  choices:
    A: Under the age of 12
    B: Under the age of 15
    C: Under the age of 16
    D: Under the age of 18
  answer: B
  explanation: The manual states that all children under the age of fifteen (15) must
    wear appropriate safety restraints while the vehicle is in motion.
- id: 60
  category: safe_driving_rules
  question: 'Under the Protection from Secondhand Smoke for Children Act, it is illegal
    to knowingly smoke tobacco in a motor vehicle if a passenger is a child under
    the age of:'
  choices:
    A: 6 years
    B: 10 years
    C: 14 years
    D: 18 years
  answer: C
  explanation: A person shall not knowingly smoke tobacco in any motor vehicle in
    which a child who is less than fourteen (14) years of age is a passenger.
- id: 61
  category: penalties_and_points
  question: What is the maximum fine for a front-seat passenger who violates the safety
    belt law?
  choices:
    A: $10.00
    B: $25.00
    C: $50.00
    D: $100.00
  answer: B
  explanation: According to the manual, any person who violates the safety belt law
    shall be subject to a fine not to exceed twenty-five dollars ($25.00), plus any
    court costs or fees.
- id: 62
  category: penalties_and_points
  question: What is the penalty for a first-time littering conviction in Arkansas?
  choices:
    A: A fine of up to $500 and 4 hours of community service
    B: A fine of up to $1,000 and not more than 8 hours of community service
    C: A fine of up to $2,000 and 24 hours of community service
    D: A fine of up to $100 and no community service
  answer: B
  explanation: Upon conviction, first offenders of littering are subject to a fine
    of up to $1,000 and not more than eight hours of community service.
- id: 63
  category: safe_driving_rules
  question: When a vehicle is left outside in the heat, how much does the interior
    temperature increase every nine minutes?
  choices:
    A: 5 degrees
    B: 10 degrees
    C: 15 degrees
    D: 20 degrees
  answer: C
  explanation: The manual states that for every nine (9) minutes, the interior temperature
    of a vehicle increases fifteen (15) degrees.
- id: 64
  category: safe_driving_rules
  question: What should you do if you are in an intersection when an emergency vehicle
    approaches with its flashing lights and sirens?
  choices:
    A: Stop immediately in the middle of the intersection
    B: Reverse out of the intersection
    C: Pull over to the right edge while still in the intersection
    D: Drive through the intersection before pulling over
  answer: D
  explanation: If you are in an intersection when an emergency vehicle approaches,
    you should go ahead and drive through the intersection before pulling over to
    the right edge of the road.
- id: 65
  category: sharing_the_road
  question: Under the Move Over Law, what must a driver do on a multilane highway
    when approaching a stopped law enforcement vehicle with its lights turned on?
  choices:
    A: Stop immediately in their current lane
    B: Move over to the farthest lane away from the stopped vehicle whenever possible
    C: Maintain their lane but reduce speed to 10 mph
    D: Honk their horn to acknowledge the officer
  answer: B
  explanation: Arkansas law requires any motor vehicle on a multilane highway to move
    over, whenever possible, to the farthest lane away from any stopped law enforcement
    vehicle with its lights turned on.
- id: 66
  category: sharing_the_road
  question: When are drivers NOT required to stop for a school bus with its red lights
    flashing?
  choices:
    A: When the school bus is in the same lane of traffic
    B: When approaching along an opposite lane of travel separated by a median 20
      feet or more in width
    C: When approaching along an opposite lane of travel separated by a median less
      than 10 feet in width
    D: When the driver is operating a commercial motor vehicle
  answer: B
  explanation: Drivers are not required to stop if the school bus is approaching along
    an opposite lane of travel separated by a median twenty (20) feet or more in width.
- id: 67
  category: safe_driving_rules
  question: At which of the following locations are school buses always required to
    stop?
  choices:
    A: All pedestrian crosswalks
    B: All highway on-ramps
    C: All railroad crossings
    D: All intersections with a yield sign
  answer: C
  explanation: According to the manual, school buses are required to stop at all railroad
    crossings.
- id: 68
  category: penalties_and_points
  question: Under Isaac's Law, what is the penalty if a driver illegally passes a
    stopped school bus and negligently causes the death of another person?
  choices:
    A: Class A Misdemeanor
    B: Class C Felony
    C: Class B Felony
    D: A $1,000 fine and 90 days in jail
  answer: B
  explanation: Isaac's Law states that a person who violates this law is subject to
    a Class C Felony for negligent homicide if he or she negligently causes the death
    of another person.
- id: 69
  category: driver_responsibility
  question: Where must a handicap Special Certificate be displayed in the vehicle?
  choices:
    A: Attached to the rear license plate
    B: Hanging from the rearview mirror or the dashboard
    C: On the driver's side window
    D: Kept inside the glove compartment
  answer: B
  explanation: Individuals with Special Certificates must display the certificate
    hanging from the rearview mirror or the dashboard.
- id: 70
  category: driver_responsibility
  question: What must be purchased for $5.00 when a disabled person obtains a special
    certificate or special license plate?
  choices:
    A: A specialized license plate frame
    B: A medical clearance form
    C: A photo identification card
    D: A secondary vehicle registration
  answer: C
  explanation: When a disabled person obtains a special certificate or special license
    plate, a photo identification card must be purchased for $5.00.
- id: 71
  category: penalties_and_points
  question: What is the penalty for a first offense of illegally using another person's
    handicap special certificate?
  choices:
    A: A minimum of $100 not to exceed $500
    B: A minimum of $250 not to exceed $1000
    C: A 6-month driver's license suspension
    D: A warning and confiscation of the certificate
  answer: A
  explanation: Anyone who illegally uses another person's special certificate has
    committed fraud. The penalty for a first offense is a minimum of $100.00 not to
    exceed $500.
- id: 72
  category: driver_responsibility
  question: When must a handicap Special Certificate be returned to the Department
    of Motor Vehicles?
  choices:
    A: Within 10 days of purchasing a new vehicle
    B: Within 30 days of moving or in case of death
    C: Every year on the disabled person's birthday
    D: Within 60 days of a change in medical condition
  answer: B
  explanation: Special Certificates must be returned to the Department of Motor Vehicles,
    Special Division within thirty (30) days of moving or in case of death.
- id: 73
  category: sharing_the_road
  question: If a school bus stops with its red lights flashing on a road separated
    by a median that is less than 20 feet wide, who is required to stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic in the opposing lanes
    C: All lanes of traffic
    D: Only commercial motor vehicles
  answer: C
  explanation: If the median is less than 20 feet, all lanes of traffic must stop
    for a school bus with its red lights flashing.
- id: 74
  category: safe_driving_rules
  question: On a 90-degree day, how long does it take for the temperature inside a
    vehicle to reach the temperature of the outdoors?
  choices:
    A: 2 minutes
    B: 5 minutes
    C: 10 minutes
    D: 15 minutes
  answer: B
  explanation: The manual states that within five minutes on a 90-degree day, the
    temperature within a vehicle reaches that of the outdoors.
- id: 75
  category: defensive_driving
  question: According to the manual, by how much did Work Zone crashes rise in Arkansas
    from 2018 to 2021?
  choices:
    A: More than 25%
    B: More than 50%
    C: More than 70%
    D: More than 90%
  answer: C
  explanation: From 2018 to 2021, Work Zone crashes rose by more than 70% in Arkansas.
- id: 76
  category: safe_driving_rules
  question: According to national research, how much more likely are distracted teens
    who are texting while driving to be involved in a crash?
  choices:
    A: 5 times more likely
    B: 10 times more likely
    C: 23 times more likely
    D: 50 times more likely
  answer: C
  explanation: National research has found that distracted teens who are texting while
    driving are 23 times more likely to be involved in a crash.
- id: 77
  category: safe_driving_rules
  question: Which of the following is an example of a 'Mobile' Work Zone?
  choices:
    A: A bridge replacement project lasting two years
    B: A highway maintenance crew painting stripes on the roadway
    C: A permanent weigh station
    D: A detour route through a residential neighborhood
  answer: B
  explanation: A Mobile Work Zone exists where work is performed for a short period
    or travels at slow speeds with periodic stops, such as a highway maintenance crew
    painting stripes on the roadway, removing debris, or patching potholes.
- id: 78
  category: vehicle_information
  question: What color of flashing lights has the Arkansas Legislature recently authorized
    for use on roadway construction and maintenance vehicles to indicate an active
    Work Zone?
  choices:
    A: Blue lights
    B: Red lights
    C: Green lights
    D: Purple lights
  answer: C
  explanation: The Arkansas Legislature recently authorized the use of flashing green
    lights on roadway construction and maintenance vehicles to indicate an active
    Work Zone.
- id: 79
  category: signs_and_signals
  question: What shapes and background colors are typically used for Work Zone signs?
  choices:
    A: Circular or triangular with a red or blue background
    B: Diamond or rectangular with an orange, white, or black background
    C: Octagonal with a red background
    D: Pennant-shaped with a yellow background
  answer: B
  explanation: Work Zone signs may be diamond or rectangular shaped, and the background
    may be orange, white, or black with white or black letters or symbols.
- id: 80
  category: penalties_and_points
  question: What is the penalty for receiving a citation for a moving traffic violation
    in a Work Zone when workers are present?
  choices:
    A: The fine is reduced by half
    B: The fine is doubled
    C: The driver's license is immediately revoked
    D: The driver must attend traffic school with no fine
  answer: B
  explanation: If a driver receives a citation for any moving traffic violation in
    a Work Zone when workers are present, they will pay double the fine.
- id: 81
  category: penalties_and_points
  question: 'Depending on the traffic violation, doubled fines in an Arkansas Work
    Zone can be as high as:'
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: D
  explanation: Depending on the traffic violation, doubled fines in a Work Zone can
    be as high as $5,000.
- id: 82
  category: driver_responsibility
  question: Is holding your phone to look up directions or scroll social media while
    driving through a Work Zone considered a moving traffic violation?
  choices:
    A: No, as long as you are driving under the speed limit
    B: Yes, unless you are stopped at a red light
    C: Yes, if you can’t use a hands-free connection, you should not use your phone
    D: No, using a GPS or map application is exempt from the rule
  answer: C
  explanation: Holding your phone to take a call, send a text, look up directions,
    or scroll social media counts as a moving traffic violation. If you can't use
    a hands-free connection while driving, then don't use your phone.
- id: 83
  category: safe_driving_rules
  question: How are speed enforcement cameras typically utilized in Arkansas Interstate
    Work Zones?
  choices:
    A: They automatically mail tickets to the registered owner without police involvement
    B: An officer is positioned at the end of the Work Zone to observe violations
      on camera and pull over the violator as they exit
    C: They are only used at night when workers are not present
    D: They replace all warning signs in the Work Zone
  answer: B
  explanation: Speed enforcement cameras allow an officer to be positioned at the
    end of a Work Zone, use the camera to observe violations within the Work Zone,
    and safely pull over the violator as they exit.
- id: 84
  category: defensive_driving
  question: When approaching a Work Zone with lane closures ahead, when should you
    change to the correct lane?
  choices:
    A: At the exact point where the lane ends
    B: As soon as it is safe to do so, ideally a mile or more before the closure
    C: Only after passing the first construction barrel
    D: Immediately after the flagger waves you through
  answer: B
  explanation: If you see lane closures ahead, you should merge early by changing
    to the correct lane as soon as it's safe to do so, ideally a mile or more before
    the closure.
- id: 85
  category: sharing_the_road
  question: Under the 'Move Over' law, what should you do if it is unsafe or impossible
    to change lanes away from a stationary vehicle with flashing lights?
  choices:
    A: Stop completely in your lane until the vehicle leaves
    B: Honk your horn to alert the workers and maintain your speed
    C: Reduce your speed to a safe level for conditions or a legally mandated speed
    D: Accelerate to pass the stationary vehicle as quickly as possible
  answer: C
  explanation: If moving over is unsafe or impossible, the Move Over law requires
    you to reduce your speed to a safe level for conditions or a legally mandated
    speed.
- id: 86
  category: sharing_the_road
  question: In addition to police, fire, and ambulance vehicles, which of the following
    vehicles are covered by the Arkansas 'Move Over' law?
  choices:
    A: School buses and public transit buses
    B: Arkansas Department of Transportation (ARDOT) vehicles, utility vehicles, construction
      vehicles, and tow trucks
    C: Any passenger vehicle parked on the shoulder
    D: Delivery trucks and postal vehicles
  answer: B
  explanation: Arkansas has expanded the Move Over law to include other vehicles with
    flashing lights such as ARDOT vehicles, utility vehicles, construction vehicles,
    and tow trucks.
- id: 87
  category: signs_and_signals
  question: When navigating a Work Zone, how do a flagger's instructions relate to
    other traffic signals or devices?
  choices:
    A: Flagger instructions should be ignored if they contradict a traffic light
    B: Flagger instructions overrule any other traffic signals or devices
    C: Flagger instructions are only suggestions and not legally binding
    D: Flagger instructions only apply to commercial vehicles
  answer: B
  explanation: You must always obey the flagger's signals or signs. Their instructions
    overrule any other traffic signals or devices.
- id: 88
  category: safe_driving_rules
  question: When instructed to stop by a flagger in a Work Zone, how far away from
    the flagger should you stop your vehicle?
  choices:
    A: Right next to the flagger so you can hear their instructions
    B: At least a car length away from the flagger
    C: At least 100 feet away from the flagger
    D: Exactly three car lengths away
  answer: B
  explanation: When stopping for a flagger, you should stop at the designated location,
    or at least a car length away from the flagger, and wait for directions to proceed.
- id: 89
  category: safe_driving_rules
  question: What speed limit should you obey if you are driving through a Work Zone
    and there are no reduced speed limits posted?
  choices:
    A: 45 mph
    B: 15 mph below the normal speed limit
    C: The normally posted speed limit
    D: 25 mph
  answer: C
  explanation: If there are no reduced speed limits posted within the work zone, drivers
    should obey the normally posted speed limit.
- id: 90
  category: signs_and_signals
  question: How are Mobile Work Zones typically marked on the back of Arkansas Department
    of Transportation (ARDOT) vehicles?
  choices:
    A: With a sign that reads 'Pass With Care'
    B: With a sign indicating 'Work Zone – Fines Double'
    C: With a red and white triangular yield sign
    D: With a sign that reads 'End of Work Zone'
  answer: B
  explanation: Work vehicles in a Mobile Work Zone will have signs on the back indicating
    'Work Zone – Fines Double.'
- id: 91
  category: safe_driving_rules
  question: What must a driver do if they are stopped at a controlled intersection
    when the light turns green?
  choices:
    A: Proceed immediately to claim the right-of-way
    B: Allow opposing traffic already in the intersection to clear before proceeding
    C: Honk to warn other drivers before moving forward
    D: Turn right on green without checking for pedestrians
  answer: B
  explanation: The manual states that if a driver is stopped at a controlled intersection
    on a green light, the driver must allow opposing traffic already in the intersection
    to clear before proceeding.
- id: 92
  category: signs_and_signals
  question: What does a flashing yellow arrow on a traffic light indicate?
  choices:
    A: Left turns are protected and opposing traffic must stop
    B: The signal is getting ready to turn red
    C: Left turns are permitted, but drivers must yield to oncoming traffic and pedestrians
    D: You may not turn in the direction of the arrow
  answer: C
  explanation: A flashing yellow arrow means left turns are permitted, but drivers
    must yield to oncoming traffic and pedestrians, then proceed with caution.
- id: 93
  category: signs_and_signals
  question: How should a driver treat a flashing red traffic light?
  choices:
    A: The same as a yield sign
    B: The same as a stop sign
    C: Slow down and proceed with caution
    D: Stop only if pedestrians are present
  answer: B
  explanation: According to the manual, a flashing red light is the same as a stop
    sign. A driver must come to a complete stop, and then proceed only when it is
    safe.
- id: 94
  category: safe_driving_rules
  question: When intending to turn right on a red light, what must a driver do first?
  choices:
    A: Slow down to 10 mph and yield to traffic
    B: Make a complete stop and check for opposing traffic and pedestrians
    C: Honk the horn to alert pedestrians in the crosswalk
    D: Proceed without stopping if the lane is clear
  answer: B
  explanation: When approaching an intersection with a red light and intending to
    turn right, a complete stop and a check for opposing traffic must be made before
    turning right. Drivers must also look for pedestrians.
- id: 95
  category: defensive_driving
  question: 'If you are approaching a stop sign and obstacles are blocking your view
    of the intersection, you should:'
  choices:
    A: Proceed through the intersection at a very slow speed
    B: Sound your horn and drive through the intersection
    C: Make a complete stop and pull forward to see
    D: Yield without stopping and look both ways
  answer: C
  explanation: If you are approaching a stop sign and obstacles are blocking your
    view, you should make a complete stop and pull forward to see. You may proceed
    when safe to do so.
- id: 96
  category: safe_driving_rules
  question: If a county judge has not established a speed limit on a county road,
    what is the default speed limit?
  choices:
    A: 30 mph
    B: 40 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: If a county judge has not established a speed limit on a county road
    within their jurisdiction, the speed limit shall be forty miles per hour (40 m.p.h.).
- id: 97
  category: penalties_and_points
  question: 'Speeding in excess of 15 mph over the posted speed limit on a county
    road is considered a:'
  choices:
    A: Class A felony
    B: Class B misdemeanor
    C: Class C misdemeanor
    D: Warning offense only
  answer: C
  explanation: A person who is found guilty of speeding in excess of fifteen miles
    per hour (15 m.p.h.) over the posted speed limit on a county road is guilty of
    a Class C misdemeanor.
- id: 98
  category: penalties_and_points
  question: What is the potential penalty for a driver who fails to yield at a yield
    sign?
  choices:
    A: A fine of up to $500 and 30 days in jail
    B: A fine of up to $1000 and suspension of their driver's license for 180 days
    C: A fine of $250 and mandatory traffic school
    D: Suspension of their driver's license for 1 year
  answer: B
  explanation: A driver who fails to yield could receive a fine of up to $1000 and
    suspension of their driver's license for 180 days.
- id: 99
  category: signs_and_signals
  question: What does a reflective orange triangle bordered with red indicate?
  choices:
    A: A construction zone is ahead
    B: The vehicle is carrying hazardous materials
    C: The vehicle is traveling slower than the normal speed of traffic
    D: You are approaching a yield sign
  answer: C
  explanation: A reflective orange triangle bordered with red is a Slow Moving Vehicle
    Sign, which warns other road users that the vehicle is traveling slower than the
    normal speed of traffic.
- id: 100
  category: signs_and_signals
  question: What is the typical color and shape of a warning sign?
  choices:
    A: White rectangle with black lettering
    B: Red octagon with white lettering
    C: Yellow with black lettering or symbols, mostly diamond-shaped
    D: Green rectangle with white lettering
  answer: C
  explanation: Warning signs are yellow with black lettering or symbols, and most
    are diamond-shaped. They warn a driver to slow down and be prepared to stop or
    provide information about a hazard.
- id: 101
  category: signs_and_signals
  question: On a regulation sign, what does a red circle with a red diagonal slash
    over a symbol mean?
  choices:
    A: The maneuver is recommended but not required
    B: The driver is prohibited from executing that particular maneuver
    C: The road is closed ahead
    D: Yield to oncoming traffic before making the maneuver
  answer: B
  explanation: A red circle with a red slash over the symbol indicates a driver is
    prohibited (not allowed) from executing a particular maneuver such as a turn toward
    a particular direction or no U-Turn.
- id: 102
  category: vehicle_information
  question: If your vehicle is equipped with a manual transmission, what is recommended
    when crossing railroad tracks?
  choices:
    A: Shift to a higher gear to cross quickly
    B: Shift to neutral and coast across the tracks
    C: Do not shift gears when crossing the tracks to avoid an engine stall
    D: Downshift while on the tracks to maintain control
  answer: C
  explanation: If your vehicle is equipped with a manual transmission, it is wise
    not to shift gears when crossing the tracks to avoid the possibility of an engine
    stall.
- id: 103
  category: sharing_the_road
  question: Which of the following vehicles are required by law to stop at all railroad
    crossings?
  choices:
    A: Passenger cars
    B: Motorcycles
    C: School buses
    D: Pickup trucks towing trailers
  answer: C
  explanation: The manual explicitly states that school buses are required to stop
    at all railroad crossings.
- id: 104
  category: defensive_driving
  question: What should you do if the railroad crossing gates begin to come down as
    you are already beginning to cross the tracks?
  choices:
    A: Stop immediately on the tracks and reverse
    B: Keep going even if it means you will break the gate
    C: Put your vehicle in park and exit the vehicle
    D: Stop and wait for the gate to go back up
  answer: B
  explanation: If the gates begin to come down as you begin to cross, keep going even
    if it means you will break the gate. It is unsafe to stop on the tracks.
- id: 105
  category: signs_and_signals
  question: What does a white 'X' shaped sign with black letters at a railroad crossing
    indicate?
  choices:
    A: It is an advance warning sign to slow down
    B: It marks the grade crossing and requires you to yield the right-of-way to the
      train
    C: It indicates that the crossing has no active trains
    D: It means you must stop regardless of whether a train is coming
  answer: B
  explanation: The Cross Buck Sign is a white 'X' shaped sign with black letters.
    This sign marks the grade crossing and requires you to yield the right-of-way
    to the train.
- id: 106
  category: signs_and_signals
  question: What does an EXEMPT sign at a railroad crossing indicate?
  choices:
    A: The crossing is only used by high-speed passenger trains.
    B: You are exempt from the speed limit in this zone.
    C: The crossing has been abandoned or its use discontinued.
    D: Only commercial vehicles must stop at this crossing.
  answer: C
  explanation: An EXEMPT sign means that the crossing has been abandoned or its use
    discontinued, and you should follow your local procedure about stopping.
- id: 107
  category: signs_and_signals
  question: What does a solid double yellow line in the center of the roadway mean?
  choices:
    A: Passing is permitted for vehicles traveling in either direction.
    B: Passing is prohibited for vehicles traveling in either direction.
    C: The lane is designated as a shared center turn lane.
    D: You are traveling on a one-way street.
  answer: B
  explanation: A solid double yellow line in the center of the roadway means passing
    is prohibited for vehicles traveling in either direction.
- id: 108
  category: safe_driving_rules
  question: Under what circumstance may a driver cross a solid double yellow line?
  choices:
    A: To pass a slow-moving vehicle if the road ahead is clear.
    B: To turn into a driveway if there is no opposing traffic approaching.
    C: To make a U-turn at any intersection.
    D: It is never permissible to cross a solid double yellow line.
  answer: B
  explanation: The manual states that a driver may cross a solid yellow line to turn
    into a driveway if there is no opposing traffic approaching the planned turn site.
- id: 109
  category: safe_driving_rules
  question: 'In Arkansas, it is NOT permissible to use the shared center left turn
    lane as a(n):'
  choices:
    A: Acceleration lane.
    B: Maneuver to gain access to traffic lanes.
    C: Lane for making a left turn from an intersecting street.
    D: Lane for making a left turn from a driveway.
  answer: A
  explanation: In Arkansas, it is permissible to utilize a center turn lane to merge
    into traffic lanes, except it is not permissible to use the center left turn lane
    as an acceleration lane.
- id: 110
  category: defensive_driving
  question: If you miss your turn or exit while driving, what is the safest and most
    legal action to take?
  choices:
    A: Back up carefully in the travel lane.
    B: Stop in the travel lane and wait for traffic to clear before reversing.
    C: Drive on the shoulder to back up to your exit.
    D: Do not back up; proceed to a safe turnaround area.
  answer: D
  explanation: Never back a vehicle in any travel lane, it is illegal and unsafe.
    If you miss your turn or exit, do not back up; proceed to a safe turnaround area.
- id: 111
  category: safe_driving_rules
  question: On a road with three or more lanes traveling in the same direction, which
    lane should you remain in except when passing?
  choices:
    A: The left lane
    B: The center lane
    C: The right lane
    D: The shared center lane
  answer: C
  explanation: On a road with three or more lanes traveling in the same direction
    remain in the right lane except to pass.
- id: 112
  category: safe_driving_rules
  question: 'When there are no signs or lane markings to control turning, a driver
    should turn into:'
  choices:
    A: The lane furthest from the direction of travel.
    B: The lane closest to the direction of travel.
    C: The center lane regardless of direction.
    D: The opposite lane of traffic to make a wide turn.
  answer: B
  explanation: When there are no signs or lane markings to control turning, a driver
    should turn into the lane closest to the direction of travel.
- id: 113
  category: defensive_driving
  question: What should you do if you are being followed too closely on a multi-lane
    roadway?
  choices:
    A: Brake suddenly to warn the driver behind you.
    B: Move into the lane to your right when clear.
    C: Speed up to increase the distance between vehicles.
    D: Move into the far-left lane.
  answer: B
  explanation: If you are being followed too close on a multi-lane roadway, you should
    move into the lane to your right when clear.
- id: 114
  category: sharing_the_road
  question: Which of the following pedestrians must be given absolute right-of-way?
  choices:
    A: Pedestrians crossing outside of a marked crosswalk.
    B: Pedestrians carrying a white cane or using a guide dog.
    C: Pedestrians walking on the right side of the roadway.
    D: Pedestrians crossing an intersection with a green light.
  answer: B
  explanation: Pedestrians carrying a white cane or using a guide dog must be given
    absolute right of way.
- id: 115
  category: safe_driving_rules
  question: 'When making a left turn at an intersection, a driver must yield to:'
  choices:
    A: Vehicles turning right from the intersecting street.
    B: Pedestrians on the sidewalk behind them.
    C: Oncoming cars traveling straight ahead.
    D: Vehicles approaching from the rear.
  answer: C
  explanation: Drivers turning left must yield to oncoming cars traveling straight
    ahead.
- id: 116
  category: safe_driving_rules
  question: At an intersection where there is no stop sign or traffic signal, which
    vehicle has the right-of-way?
  choices:
    A: The vehicle approaching from the left.
    B: The vehicle approaching from the right.
    C: The vehicle traveling at a higher speed.
    D: The vehicle making a left turn.
  answer: B
  explanation: At an intersection where there is no stop sign or traffic signal, drivers
    must yield to vehicles approaching from the right.
- id: 117
  category: safe_driving_rules
  question: At an "ALL WAY" stop sign, if multiple vehicles arrive at different times,
    who has the right-of-way?
  choices:
    A: The vehicle on the right.
    B: The vehicle on the left.
    C: The driver reaching the intersection first.
    D: The largest vehicle.
  answer: C
  explanation: At "3 WAY," "4 WAY," and "ALL WAY" stop signs, the driver reaching
    the intersection first goes first, after making a complete stop.
- id: 118
  category: safe_driving_rules
  question: When is a driver permitted to enter an intersection?
  choices:
    A: As soon as the light turns green, even if traffic is backed up.
    B: Only if they can get through it without having to stop.
    C: When they need to block the intersection to wait for a turn.
    D: Whenever they are approaching from the right.
  answer: B
  explanation: Drivers may not enter an intersection unless they can get through it
    without having to stop. You should wait until traffic clears so that you are not
    blocking the intersection.
- id: 119
  category: sharing_the_road
  question: 'When passing a vehicle traveling in the same direction, you must:'
  choices:
    A: Yield to the vehicle being passed.
    B: Honk your horn to warn them to slow down.
    C: Pass on the shoulder if the left lane is blocked.
    D: Assume absolute right-of-way over the slower vehicle.
  answer: A
  explanation: Drivers passing a vehicle traveling in the same direction must yield
    to the vehicle being passed, even if the vehicle is slowing or coming to a stop.
- id: 120
  category: sharing_the_road
  question: Who must yield when a vehicle is passing another vehicle traveling in
    the same direction?
  choices:
    A: The vehicle being passed
    B: The passing vehicle
    C: Both vehicles must slow down and yield
    D: Neither vehicle is required to yield
  answer: B
  explanation: According to the manual, drivers passing a vehicle traveling in the
    same direction must yield to the vehicle being passed, because it may attempt
    to turn left or approach a hazard.
- id: 121
  category: safe_driving_rules
  question: When parallel parking, what is the maximum distance your vehicle should
    be from the curb?
  choices:
    A: 12 inches
    B: 18 inches
    C: 24 inches
    D: 30 inches
  answer: B
  explanation: The manual states that when parallel parking, your vehicle should be
    18 inches or less from the curb.
- id: 122
  category: safe_driving_rules
  question: What should you do with your vehicle's wheels when parking on a hill?
  choices:
    A: Turn the wheels sharply toward traffic
    B: Keep the wheels perfectly straight
    C: Turn the wheels sharply away from traffic
    D: Turn the wheels slightly toward the center of the road
  answer: C
  explanation: When parking on a hill, you should turn the wheels sharply away from
    traffic to prevent the car from rolling into traffic.
- id: 123
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: The manual specifies that you must not park within fifteen (15) feet
    of a fire hydrant.
- id: 124
  category: safe_driving_rules
  question: You are prohibited from parking within how many feet of a traffic signal,
    stop sign, or yield sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Drivers must not park within thirty (30) feet of a traffic signal,
    stop sign, or yield sign.
- id: 125
  category: safe_driving_rules
  question: How far away must you park from a railroad crossing?
  choices:
    A: At least 15 feet
    B: At least 20 feet
    C: At least 30 feet
    D: At least 50 feet
  answer: D
  explanation: The manual states that you must not park within fifty (50) feet of
    a railroad crossing.
- id: 126
  category: signs_and_signals
  question: What does a red painted curb indicate?
  choices:
    A: A loading zone
    B: A fire zone
    C: Handicapped parking only
    D: Short-term parking
  answer: B
  explanation: According to the restricted parking zones section, a red curb means
    a fire zone.
- id: 127
  category: vehicle_information
  question: Where should the lower strap of a seat belt be adjusted to fit?
  choices:
    A: Across the abdominal region
    B: Across the upper thighs
    C: Across the knees
    D: Across the waistline
  answer: B
  explanation: The lower strap should be adjusted so it fits across the upper thighs
    and not the abdominal region to properly distribute force to the pelvic area.
- id: 128
  category: vehicle_information
  question: Why is it dangerous if your seat belts become twisted?
  choices:
    A: The seat belt will unlatch automatically during a sudden stop
    B: The pressure in a collision has less surface area on which to be distributed
    C: It will cause the airbags to deploy improperly
    D: It prevents the driver from reaching the steering wheel
  answer: B
  explanation: If the belts become twisted, the pressure that would occur in a collision
    has less surface area on which to be distributed, decreasing their effectiveness.
- id: 129
  category: safe_driving_rules
  question: What technique should drivers use to control the steering wheel when executing
    a sharp turn, such as at an intersection?
  choices:
    A: One-handed steering
    B: The palm-turning technique
    C: The hand-over-hand technique
    D: The underhand grip technique
  answer: C
  explanation: When executing a sharp turn, such as around corners of an intersection,
    drivers should use the 'hand-over-hand' technique to control the steering wheel.
- id: 130
  category: safe_driving_rules
  question: What can happen if you depress the gas pedal too fast, especially on wet
    pavement?
  choices:
    A: The engine will immediately overheat
    B: The drive wheels can spin or cause your vehicle to slide
    C: The brakes will lock up
    D: The steering wheel will become stiff
  answer: B
  explanation: Depressing the gas pedal too fast can cause the drive wheels to spin
    or cause your vehicle to slide, especially if the pavement is wet.
- id: 131
  category: driver_responsibility
  question: Sending or reading a text takes your eyes off the road for 5 seconds.
    At 55 mph, this is equivalent to driving what distance blind?
  choices:
    A: The length of a basketball court
    B: The length of an entire football field
    C: One full mile
    D: 500 feet
  answer: B
  explanation: At 55 mph, taking your eyes off the road for 5 seconds to send or read
    a text is like driving the length of an entire football field with your eyes closed.
- id: 132
  category: safe_driving_rules
  question: When exiting your parked vehicle on a street, which side should you always
    try to exit from?
  choices:
    A: The street side
    B: The curbside
    C: The driver's side
    D: The side with the most traffic
  answer: B
  explanation: The manual advises to always exit the vehicle on the curbside, if possible,
    to avoid stepping into traffic.
- id: 133
  category: defensive_driving
  question: What is a potential consequence of braking quickly and making a sudden
    stop?
  choices:
    A: It improves your vehicle's fuel efficiency
    B: It causes your vehicle to skid and lose control
    C: It alerts other drivers to pass you safely
    D: It prevents wear and tear on your brake pads
  answer: B
  explanation: Braking quickly can cause your vehicle to skid and cause you to lose
    control, making it difficult for others to avoid hitting your vehicle.
- id: 134
  category: safe_driving_rules
  question: According to Arkansas law, what are the cell phone restrictions for drivers
    under the age of 18?
  choices:
    A: They are allowed to use hands-free devices only.
    B: They are allowed to text but not make phone calls.
    C: Cell phone use is not allowed, including hands-free devices.
    D: They may use cell phones if a parent or guardian is in the vehicle.
  answer: C
  explanation: The manual states that for drivers under eighteen (18) years of age,
    cell phone use is not allowed, and the use of hands-free devices is also not allowed.
- id: 135
  category: defensive_driving
  question: Taking your mind off of driving is considered which type of distraction?
  choices:
    A: Visual
    B: Manual
    C: Cognitive
    D: Auditory
  answer: C
  explanation: The manual defines a 'Cognitive' distraction as taking your mind off
    driving.
- id: 136
  category: safe_driving_rules
  question: How far ahead should you look down the road when driving in the city to
    avoid last-minute braking?
  choices:
    A: One-quarter mile
    B: One city block
    C: Two city blocks
    D: 500 feet
  answer: B
  explanation: To avoid last-minute braking, you should look down the road at least
    one (1) city block when driving in the city.
- id: 137
  category: defensive_driving
  question: To practice good defensive driving, how many seconds ahead should you
    be looking down the road?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 20 seconds
  answer: C
  explanation: The manual states that you should be looking at least fifteen (15)
    seconds ahead to avoid last-minute braking or sudden turns.
- id: 138
  category: safe_driving_rules
  question: When are you permitted to turn right on a red light in Arkansas?
  choices:
    A: Anytime, as long as you yield to traffic.
    B: After making a complete stop, unless there is a sign prohibiting it.
    C: Only if you are turning onto a one-way street.
    D: Right turns on red are never permitted.
  answer: B
  explanation: You may turn right on a red light after making a complete stop, unless
    there is a sign prohibiting 'right on red'.
- id: 139
  category: defensive_driving
  question: What should you do if you are stopped at an intersection and your view
    of the cross street is blocked?
  choices:
    A: Wait for another driver to honk before proceeding.
    B: Back up to get a wider angle of view.
    C: Ease forward until you can clearly see approaching traffic.
    D: Accelerate quickly through the intersection.
  answer: C
  explanation: If stopped at an intersection and your view of a cross street is blocked,
    ease forward until you can see any approaching traffic.
- id: 140
  category: safe_driving_rules
  question: When changing lanes, why must you look over your shoulder in the direction
    you plan to move?
  choices:
    A: To check your blind spots, which are the rear corners of your vehicle.
    B: To ensure your side mirrors are properly adjusted.
    C: To see if the driver behind you is slowing down.
    D: To check for emergency vehicles approaching from ahead.
  answer: A
  explanation: You must look over your shoulder because your rearview and side mirrors
    will not allow you to see vehicles in your blind spots, which are the rear corners
    of your vehicle.
- id: 141
  category: safe_driving_rules
  question: What is the proper technique for backing up your vehicle in a straight
    line?
  choices:
    A: Rely entirely on your rearview mirror.
    B: Use only your side mirrors to guide you.
    C: Place your right arm over the back of the seat and look directly through the
      rear and side windows.
    D: Keep both hands on the wheel and look straight ahead.
  answer: C
  explanation: When backing, you should place your right arm over the back of the
    seat and turn your body so you can look directly through the rear and side windows.
    Do not depend on your mirrors.
- id: 142
  category: sharing_the_road
  question: Which of the following is a rule for dealing with blind spots?
  choices:
    A: Drive slightly in the rear of other vehicles.
    B: Stay in another driver's blind spot when passing.
    C: Never stay alongside a large vehicle such as a tractor-trailer or bus.
    D: Match the speed of the vehicle next to you to stay visible.
  answer: C
  explanation: The manual's Blind Spot Tips specifically state to 'Never stay alongside
    a large vehicle such as a tractor-trailer or bus.'
- id: 143
  category: safe_driving_rules
  question: According to Arkansas law, when must you turn on your headlights during
    the day?
  choices:
    A: When driving on the interstate.
    B: When your windshield wipers are needed.
    C: When driving through a school zone.
    D: When passing a large truck.
  answer: B
  explanation: Arkansas law requires drivers to turn on their headlights when windshield
    wipers are needed, such as on rainy, snowy, or foggy days.
- id: 144
  category: safe_driving_rules
  question: At what times of day are you legally required to turn on your headlights?
  choices:
    A: One hour after sunset and one hour before sunrise.
    B: A half hour after sunset and a half hour before sunrise.
    C: Only when it is completely dark outside.
    D: From 8:00 PM to 6:00 AM.
  answer: B
  explanation: You must turn on your headlights a 1/2 hour (30 minutes) after sunset,
    a 1/2 hour (30 minutes) before sunrise, or anytime you cannot see clearly within
    500 feet.
- id: 145
  category: safe_driving_rules
  question: Which of the following statements about parking lights is true in Arkansas?
  choices:
    A: They should be used when driving in heavy fog.
    B: They are required when driving at dawn or dusk.
    C: It is illegal to drive using only parking lights.
    D: They can be used as a substitute for low-beam headlights.
  answer: C
  explanation: The manual states that parking lights are for parked cars and it is
    illegal in Arkansas to drive using only parking lights.
- id: 146
  category: safe_driving_rules
  question: When must you dim your high-beam headlights for an oncoming vehicle?
  choices:
    A: Within 200 feet
    B: Within 300 feet
    C: Within 400 feet
    D: Within 500 feet
  answer: D
  explanation: You must dim your high beams whenever you come within 500 feet of an
    oncoming vehicle.
- id: 147
  category: defensive_driving
  question: Why should you use your low-beam headlights when driving in fog, snow,
    or heavy rain?
  choices:
    A: Low beams are brighter than high beams.
    B: The light from high beams will reflect, causing glare and making it more difficult
      to see.
    C: Low beams activate your emergency flashers automatically.
    D: High beams drain the vehicle's battery faster in cold weather.
  answer: B
  explanation: When driving in fog, snow, or heavy rain, you should use low beams
    because the light from high beams will reflect, causing glare and making it more
    difficult to see the road.
- id: 148
  category: safe_driving_rules
  question: In which of the following situations should you NOT use your vehicle's
    warning horn?
  choices:
    A: To alert a driver who is moving into your lane.
    B: To warn a pedestrian who is about to walk into the street.
    C: To greet a friend you see on the road.
    D: When you lose control of your vehicle.
  answer: C
  explanation: The manual explicitly lists 'To greet a friend on the road' as a situation
    where you should not use your horn.
- id: 149
  category: safe_driving_rules
  question: How far in advance should you signal your intention to turn?
  choices:
    A: At least 50 feet before the turn
    B: At least 100 feet before the turn
    C: At least 150 feet before the turn
    D: At least 200 feet before the turn
  answer: B
  explanation: According to the manual, if possible, you should signal your intentions
    to turn at least 100 feet before the turn.
- id: 150
  category: safe_driving_rules
  question: When should you activate your turn signal if you plan to turn just beyond
    an intersection?
  choices:
    A: At least 100 feet before reaching the intersection
    B: While you are in the middle of the intersection
    C: Just after you pass through the intersection
    D: Only after you have come to a complete stop
  answer: C
  explanation: The manual states that if you plan to turn beyond an intersection,
    the signal should be activated just after you pass through the intersection so
    other drivers do not think you are turning at the intersection.
- id: 151
  category: vehicle_information
  question: What is the estimated total stopping distance for an average passenger
    car traveling at 55 miles per hour?
  choices:
    A: 124 feet
    B: 225 feet
    C: 300 feet
    D: 400 feet
  answer: B
  explanation: The manual notes that the average passenger car traveling at 55 miles
    per hour can stop within a total of 225 feet.
- id: 152
  category: defensive_driving
  question: Why is it dangerous to brake while driving through a curve?
  choices:
    A: It causes the brakes to overheat quickly.
    B: It increases your vehicle's blind spots.
    C: It can cause the vehicle to skid.
    D: It makes the steering wheel lock up.
  answer: C
  explanation: The manual advises to slow down before a curve because braking in a
    curve can cause the vehicle to skid.
- id: 153
  category: safe_driving_rules
  question: How should you adjust your speed when driving on a road covered in packed
    snow?
  choices:
    A: Reduce your speed by 10 mph.
    B: Cut your speed in half.
    C: Slow to a coast.
    D: Maintain the posted speed limit.
  answer: B
  explanation: According to the manual, on packed snow, you should cut your speed
    in half.
- id: 154
  category: defensive_driving
  question: Under which condition is ice on the highway generally the most slippery?
  choices:
    A: When temperatures are well below freezing.
    B: When the ice is near the freezing point.
    C: When it has been frozen for several days.
    D: When it is covered by a layer of dry snow.
  answer: B
  explanation: The manual states that when ice is near the freezing point, it can
    be more slippery than at temperatures well below freezing.
- id: 155
  category: defensive_driving
  question: Why can pavement be particularly slippery for the first few minutes when
    it starts to rain on a hot day?
  choices:
    A: The rain cools the tires, reducing their grip.
    B: The water mixes with dirt to create deep mud.
    C: Heat causes the oil in the asphalt to surface on the roadway.
    D: The sudden temperature change causes the asphalt to crack.
  answer: C
  explanation: When it starts to rain on a hot day, heat causes the oil in the asphalt
    to surface on the roadway, making conditions more slippery until the rain washes
    it away.
- id: 156
  category: safe_driving_rules
  question: At what speed can your tires lose all traction with the road during heavy
    rain, causing your vehicle to hydroplane?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 50 mph
  answer: D
  explanation: The manual states that in heavy rain, your tires can lose all traction
    with the road at 50 mph, a process called hydroplaning.
- id: 157
  category: defensive_driving
  question: What is the first thing you should do if your vehicle begins to hydroplane?
  choices:
    A: Slam on the brakes immediately.
    B: Turn the steering wheel sharply to the right.
    C: Slowly take your foot off the gas pedal.
    D: Accelerate to push through the water.
  answer: C
  explanation: If your vehicle begins to hydroplane, the manual instructs you to slowly
    take your foot off the gas pedal and keep the steering wheel straight.
- id: 158
  category: sharing_the_road
  question: What is the proper procedure for merging onto a high-speed roadway?
  choices:
    A: Drive to the end of the ramp and stop before entering.
    B: Enter at a much slower speed than traffic to be safe.
    C: Use the ramp to reach the speed of other vehicles before pulling onto the road.
    D: Wait for the main road traffic to stop and let you in.
  answer: C
  explanation: When merging with traffic, you should use the ramp to reach the speed
    of other vehicles before you pull onto the road. You should not drive to the end
    of the ramp and stop.
- id: 159
  category: safe_driving_rules
  question: When should you begin to slow down if you are exiting a high-speed roadway
    with an exit ramp?
  choices:
    A: 500 feet before the exit ramp.
    B: Only after you have moved onto the exit ramp.
    C: As soon as you turn on your turn signal.
    D: While you are still in the main flow of traffic.
  answer: B
  explanation: The manual states that if the road you are traveling has exit ramps,
    do not slow down until you have moved onto the exit ramp.
- id: 160
  category: signs_and_signals
  question: Farm tractors and animal-drawn vehicles usually travel at speeds of 25
    mph or less. What should be visible from the rear of these vehicles?
  choices:
    A: A flashing yellow light
    B: A slow-moving vehicle sign
    C: A white flag
    D: A hazard warning diamond
  answer: B
  explanation: Farm tractors, animal-drawn vehicles, and roadway maintenance vehicles
    usually travel 25 mph or less and should have a slow-moving vehicle sign visible
    from the rear.
- id: 161
  category: safe_driving_rules
  question: At night, your headlights allow you to see about 400 feet ahead. What
    is the recommended maximum speed to ensure you can stop within this distance?
  choices:
    A: 40 mph
    B: 50 mph
    C: 60 mph
    D: 70 mph
  answer: B
  explanation: Your headlights let you see about 400 feet ahead. The manual states
    you should drive at a speed that allows you to stop within this distance, which
    is around 50 mph.
- id: 162
  category: safe_driving_rules
  question: If heavy rain or fog limits your visibility to less than 200 feet ahead,
    what is the maximum speed you should drive?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: If you cannot see more than 200 feet ahead because of rain or fog,
    the manual states you should not drive faster than 30 mph.
- id: 163
  category: defensive_driving
  question: Which sections of the roadway are typically among the first to develop
    icy conditions during cold weather?
  choices:
    A: Tunnels and underpasses
    B: Overpasses and bridges
    C: Intersections in downtown areas
    D: Roads with heavy traffic volume
  answer: B
  explanation: The manual notes that overpasses and bridges can become some of the
    first sections of roadways to develop icy conditions.
- id: 164
  category: safe_driving_rules
  question: If you cannot see more than 200 feet ahead because of rain or fog, what
    is the maximum speed you should drive?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: The manual states that if you cannot see more than 200 feet ahead because
    of rain or fog, you should not drive faster than 30 mph.
- id: 165
  category: defensive_driving
  question: Which rule should you use to determine if you are driving too fast for
    the current conditions?
  choices:
    A: The Two Second Rule
    B: The Split Difference Rule
    C: The Four Second Sight Distance Rule
    D: The Ten Second Passing Rule
  answer: C
  explanation: To determine if you are driving too fast for the conditions, the manual
    advises using the 'Four Second Sight Distance Rule.' If you reach a stationary
    object before counting to four-one-thousand, you are going too fast.
- id: 166
  category: penalties_and_points
  question: Can you receive a traffic ticket for driving the posted speed limit?
  choices:
    A: No, as long as you are not exceeding the posted limit.
    B: Yes, if you are traveling too fast for current road conditions like ice or
      rain.
    C: Yes, but only if you are driving in a school zone.
    D: No, because speed limits account for all weather conditions.
  answer: B
  explanation: According to the manual, drivers must adjust their speed to current
    road conditions. Even if you are driving the speed limit, you can get a ticket
    for traveling too fast for the conditions.
- id: 167
  category: safe_driving_rules
  question: What is the recommended rule to determine if you are following another
    vehicle too closely under normal conditions?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The four-second rule
    D: The ten-second rule
  answer: B
  explanation: Rear-end crashes are caused by drivers following too close. The manual
    states to use the 'two (2) second rule' to determine if you are following too
    close.
- id: 168
  category: defensive_driving
  question: In which of the following situations should you increase your following
    distance to a four-second rule?
  choices:
    A: When driving on slippery roads
    B: When following a motorcycle
    C: When following a vehicle pulling a camper
    D: All of the above
  answer: D
  explanation: The manual lists several situations where you need more space (a four-second
    rule), including slippery roads, following motorcycles, and following drivers
    who cannot see your vehicle, such as those pulling campers.
- id: 169
  category: defensive_driving
  question: What should you do if you are being tailgated and there is no right lane
    to move into?
  choices:
    A: Tap your brakes quickly to warn the driver behind you.
    B: Speed up to increase the distance between your vehicles.
    C: Wait until the path ahead is clear and reduce your speed to let them pass.
    D: Turn on your hazard lights and come to a complete stop in your lane.
  answer: C
  explanation: If there is no right lane to move into when being tailgated, the manual
    advises to wait until the path ahead is clear and reduce speed to allow the tailgater
    to drive around you. You should never slow down too quickly.
- id: 170
  category: defensive_driving
  question: What does the 'split difference rule' refer to?
  choices:
    A: Splitting your braking distance in half on wet roads.
    B: Steering a middle course between two hazards, leaving more room for the more
      dangerous one.
    C: Dividing your attention equally between the road ahead and your rearview mirrors.
    D: Changing lanes halfway through an intersection.
  answer: B
  explanation: The 'split difference rule' is when you split the difference between
    two hazards, steering a middle course. If one appears more dangerous, you leave
    more room on the side of the more dangerous hazard.
- id: 171
  category: sharing_the_road
  question: 'When passing a pedestrian or bicyclist, you should:'
  choices:
    A: Share the lane with them if the lane is wide enough.
    B: Honk your horn to let them know you are passing in the same lane.
    C: Wait until it is safe to pass in the adjoining lane.
    D: Speed up to pass them as quickly as possible.
  answer: C
  explanation: 'The manual explicitly states: ''Do not share a lane with a pedestrian
    or bicyclist; wait until it is safe to pass in the adjoining lane.'''
- id: 172
  category: safe_driving_rules
  question: How large of a gap do you need when merging with other traffic, entering
    a roadway, or changing lanes?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Ten seconds
  answer: C
  explanation: When changing lanes, entering a roadway, or merging with another travel
    lane, the manual states you should keep a four (4) second gap.
- id: 173
  category: safe_driving_rules
  question: When crossing traffic, when is it safe to stop halfway across the road
    in a median divider?
  choices:
    A: Always, as long as you use your turn signal.
    B: Only when the median divider is large enough for your vehicle to enter without
      sticking out.
    C: Only if you are driving a compact car.
    D: Never; you must cross all lanes of traffic at once.
  answer: B
  explanation: Stopping halfway across the road is safe when there is a median divider
    large enough for your vehicle to enter. You should never stop in a median divider
    too small for your vehicle where it may stick out into traffic.
- id: 174
  category: safe_driving_rules
  question: If you have a green light but traffic is blocking the intersection ahead,
    what should you do?
  choices:
    A: Proceed into the intersection to claim your right-of-way.
    B: Honk your horn until the traffic moves out of the way.
    C: Do not start across the intersection until the traffic is clear.
    D: Edge forward slowly to force the other cars to move.
  answer: C
  explanation: Even with a green light, do not start across the intersection until
    traffic is clear. You could get caught in the intersection when the light changes
    to red and block traffic, which can result in a ticket.
- id: 175
  category: defensive_driving
  question: Why should you wait to turn until an approaching vehicle with its turn
    signal on actually starts to turn?
  choices:
    A: The driver may intend to turn beyond your street or may have forgotten to turn
      the signal off.
    B: The approaching vehicle always has the right-of-way, even if it is turning.
    C: Turn signals are often invisible in daylight, making them unreliable.
    D: It is illegal to turn at the same time as another vehicle.
  answer: A
  explanation: Do not turn because an approaching vehicle has a turn signal on. The
    driver may intend on turning beyond the street where you are sitting, or may have
    forgotten to turn the signal off. Wait until the driver starts to turn.
- id: 176
  category: safe_driving_rules
  question: At a speed of 55 mph, approximately how many seconds do you need to pass
    another vehicle safely?
  choices:
    A: 2 seconds
    B: 4 seconds
    C: 7 seconds
    D: 10 seconds
  answer: D
  explanation: The manual states that at a speed of 55 mph, you need about ten (10)
    seconds to pass, which means you need a ten-second gap in oncoming traffic.
- id: 177
  category: safe_driving_rules
  question: At 55 mph, how much distance do you need to safely pass another vehicle?
  choices:
    A: 400 feet
    B: 800 feet
    C: Over 1600 feet or 1/3 of a mile
    D: 1 mile
  answer: C
  explanation: At 55 mph you and your oncoming vehicle(s) will travel over 800 feet
    in ten seconds. This means a driver will need over 1600 feet or 1/3 of a mile
    to safely pass.
- id: 178
  category: defensive_driving
  question: If you are overtaking a bicycle and an oncoming vehicle is approaching
    at the same time, what should you do?
  choices:
    A: Speed up to pass the bicycle before the vehicle reaches you.
    B: Slow down and let the oncoming vehicle pass before you pass the bicycle.
    C: Move closer to the bicycle to give the oncoming vehicle more room.
    D: Sound your horn so the bicycle moves off the road.
  answer: B
  explanation: When possible, take potential hazards one at a time. If you are overtaking
    a bicycle and an oncoming vehicle is approaching, you should slow down and let
    the vehicle pass before you pass the bicycle.
- id: 179
  category: safe_driving_rules
  question: Drivers should never pass another vehicle if they are within what distance
    of a hill or curve?
  choices:
    A: 1/4 of a mile
    B: 1/2 of a mile
    C: 1/3 of a mile
    D: 1 mile
  answer: C
  explanation: Anytime your view is blocked by a hill or a curve, you should always
    assume an oncoming vehicle could be coming toward you and never pass within a
    1/3 mile of a curve or hill.
- id: 180
  category: safe_driving_rules
  question: When passing another vehicle at night, how can you tell it is safe to
    return to the driving lane?
  choices:
    A: When you are 100 feet ahead of the vehicle
    B: When you can see both headlights of the passed vehicle in your rear-view mirror
    C: When the passed vehicle flashes its headlights
    D: When you can see the vehicle in your side mirror
  answer: B
  explanation: At night, when you can see both headlights of the vehicle you passed
    in your rear-view mirror, it is safe to return to the driving lane.
- id: 181
  category: safe_driving_rules
  question: Under Arkansas law, driving in the left lane of a multilane highway is
    restricted to passing ONLY, with which of the following exceptions?
  choices:
    A: When you are driving the exact speed limit
    B: When you are preparing to exit the multilane highway on the left
    C: When you are driving a commercial vehicle
    D: When there is heavy traffic in the right lane
  answer: B
  explanation: Exceptions to the left-lane passing rule include when a vehicle is
    preparing to exit the multilane highway on the left, or when other lanes are closed
    or unsafe.
- id: 182
  category: sharing_the_road
  question: How much distance may a fully loaded tractor-trailer traveling at 55 mph
    need to come to a complete stop?
  choices:
    A: About 225 feet
    B: Less than 150 feet
    C: More than 335 feet
    D: Exactly 100 feet
  answer: C
  explanation: A fully loaded tractor-trailer traveling at 55 miles per hour may take
    more than 335 feet (the length of a football field) to come to a complete stop.
- id: 183
  category: sharing_the_road
  question: Why do tractor-trailer drivers often swing out to the left before making
    a right turn?
  choices:
    A: To get a better view of oncoming traffic
    B: Because the rear wheels follow a shorter path than the front wheels
    C: To block other vehicles from passing
    D: Because the steering mechanism requires a wider angle
  answer: B
  explanation: Any turning vehicle's rear wheels follow a shorter path than the front
    wheels, making a greater difference for longer vehicles. They must swing left
    as the first step in a right turn.
- id: 184
  category: sharing_the_road
  question: A tractor-trailer has a serious blind spot in the front of the cab. How
    far can a car disappear from the truck driver's view in this front blind spot?
  choices:
    A: Up to 10 feet
    B: Up to 20 feet
    C: Up to 50 feet
    D: Up to 100 feet
  answer: B
  explanation: A car can disappear up to 20 feet in front of the cab of a tractor-trailer
    due to serious blind spots.
- id: 185
  category: sharing_the_road
  question: How far does the blind spot extend in the rear of a tractor-trailer?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 150 feet
    D: Up to 200 feet
  answer: D
  explanation: A car can disappear in the blind spot up to 200 feet in the rear of
    the truck.
- id: 186
  category: sharing_the_road
  question: What is an excellent rule for motorists to remember when sharing the road
    with a tractor-trailer?
  choices:
    A: If you can see the truck's headlights, the driver can see you
    B: If you can't see the truck driver in the tractor side mirror, the driver can't
      see you
    C: Trucks always have the right-of-way
    D: Always pass a truck on the right side
  answer: B
  explanation: An excellent rule for motorists sharing the road with a tractor-trailer
    is, 'if you can't see the truck driver in the tractor side mirror, the driver
    can't see you.'
- id: 187
  category: sharing_the_road
  question: Why do a large number of car-truck collisions take place at intersections?
  choices:
    A: Trucks are not required to stop at red lights
    B: Cars try to pass trucks on the right
    C: The size of a tractor-trailer can make it appear to be traveling at a slower
      speed than reality
    D: Truck drivers cannot see traffic lights clearly
  answer: C
  explanation: A large number of collisions happen at intersections because the driver
    of the car does not realize how close the truck is or how quickly it is approaching,
    as its size makes it appear slower.
- id: 188
  category: sharing_the_road
  question: Which of the following statements is true regarding bicycles on the road?
  choices:
    A: Bicycles are required to travel facing oncoming traffic
    B: Bicycles must travel on the right-hand side of the road with other traffic
    C: Bicycles are not allowed to share lanes of traffic with cars
    D: Bicycles must always ride on the sidewalk
  answer: B
  explanation: Bicycles have the same rights and responsibilities as other vehicles
    and are required to travel on the right-hand side of the road with other traffic,
    not facing it.
- id: 189
  category: sharing_the_road
  question: Why might a bicyclist move toward the center of the lane when passing
    parked cars?
  choices:
    A: To prepare for a right turn
    B: To avoid being injured by people getting out of cars or opening car doors
    C: To block traffic from passing them
    D: Because the right side of the road is reserved for pedestrians
  answer: B
  explanation: When cyclists are passing parked cars, they tend to move toward the
    center of the lane to avoid injuring or being injured by people getting out of
    cars.
- id: 190
  category: sharing_the_road
  question: What is the most common cause of a collision between a motor vehicle and
    a bicycle?
  choices:
    A: A bicyclist running a red light
    B: A driver turning left in front of an oncoming bicycle or turning right across
      its path
    C: A driver rear-ending a bicyclist at a stop sign
    D: A bicyclist swerving into the left lane
  answer: B
  explanation: The most common cause of a collision is a driver turning left in front
    of an oncoming bicycle or turning right, across the path of the bicycle.
- id: 191
  category: sharing_the_road
  question: If you are about to pass a bicycle on a narrow road and you think the
    rider does not know you are coming, what is the best action to take?
  choices:
    A: Blast your horn continuously until they move
    B: Rev your engine loudly
    C: Tap your horn gently and briefly as a signal
    D: Pass them as closely as possible
  answer: C
  explanation: If you think the rider doesn't know you're coming on a narrow road,
    tap your horn gently and briefly as a signal. Don't blast your horn or startle
    the rider.
- id: 192
  category: sharing_the_road
  question: If you see a bicyclist with a red or orange pennant flag attached to their
    bike, what does this indicate?
  choices:
    A: The rider is carrying oversized cargo.
    B: The rider is a beginner.
    C: The rider has impaired hearing.
    D: The bicycle is carrying hazardous materials.
  answer: C
  explanation: According to the manual, a red or orange pennant flag attached to a
    bike is a symbol indicating that the rider has impaired hearing, and drivers should
    slow down.
- id: 193
  category: sharing_the_road
  question: Under which of the following conditions is a bicyclist allowed full use
    of the traffic lane?
  choices:
    A: When the lane is too narrow for both a car and a bicycle to safely share.
    B: When the bicyclist is riding at night.
    C: When the bicyclist is traveling below the speed limit.
    D: When the bicyclist is riding in a residential neighborhood.
  answer: A
  explanation: A bicyclist should be allowed full use of the lane when the lane is
    too narrow for both a car and a bicycle to safely share the lane.
- id: 194
  category: sharing_the_road
  question: According to research, what is the most common cause of crashes between
    cars and motorcycles at intersections?
  choices:
    A: A motorcycle rear-ending a car.
    B: A car driver turning left in front of a motorcycle.
    C: A motorcycle attempting to pass a car on the right.
    D: A car driver failing to stop at a red light.
  answer: B
  explanation: The manual states that the most common crash between cars and motorcycles
    is at an intersection when the driver of a car is making a left turn in front
    of a motorcycle (Failure to Yield Right of Way).
- id: 195
  category: sharing_the_road
  question: Why should you wait to see if a motorcycle is actually going to turn before
    proceeding, even if their turn signal is flashing?
  choices:
    A: Motorcycle turn signals are often wired incorrectly.
    B: Motorcycle signals do not automatically cancel, and the rider may have forgotten
      to turn it off.
    C: Motorcyclists frequently use turn signals to indicate they are slowing down.
    D: It is illegal to proceed while a motorcycle's turn signal is active.
  answer: B
  explanation: Don't be fooled by a flashing turn signal. Motorcycle signals don't
    automatically cancel, and riders forget to turn them off. You should wait and
    see if the motorcycle is going to turn before you proceed.
- id: 196
  category: sharing_the_road
  question: How should a driver treat a motorcycle's space in a traffic lane?
  choices:
    A: Share the lane with the motorcycle if the lane is wide enough.
    B: Allow the motorcycle a full lane width and do not attempt to share the lane.
    C: Force the motorcycle to the right edge of the lane.
    D: Pass the motorcycle within the same lane to save space.
  answer: B
  explanation: The manual instructs drivers to allow the motorcyclist a full lane
    width and states, "Do not attempt to share the lane with a motorcycle."
- id: 197
  category: safe_driving_rules
  question: What is the recommended following distance when driving behind a motorcycle?
  choices:
    A: At least two seconds.
    B: At least three seconds.
    C: At least four to six seconds.
    D: At least eight to ten seconds.
  answer: C
  explanation: Drivers should allow more following distance, at least four (4) to
    six (6) seconds, when following a motorcycle so the motorcyclist has enough time
    to maneuver or stop in an emergency.
- id: 198
  category: driver_testing
  question: What is the minimum vision requirement to pass the driver's license vision
    test in Arkansas?
  choices:
    A: 20/20 vision in both eyes.
    B: 20/40 vision in at least one eye.
    C: 20/50 vision in both eyes.
    D: At least 20/70 vision in at least one eye.
  answer: D
  explanation: Arkansas requires that you pass a vision test before you get a driver's
    license. You must have at least twenty-seventy (20/70) vision in at least one
    eye, with or without corrective lenses.
- id: 199
  category: license_system
  question: What does a 'B' restriction on your Arkansas driver's license mean?
  choices:
    A: You are restricted to driving during daylight hours only.
    B: You must drive with corrective lenses.
    C: You are required to have a licensed adult in the vehicle.
    D: You cannot drive on interstate highways.
  answer: B
  explanation: If you have a restriction 'B' on your driver's license, you must drive
    with your eyewear (corrective lenses). A driver can be ticketed for failing to
    wear them.
- id: 200
  category: safe_driving_rules
  question: Why should drivers avoid wearing dark or tinted glasses or contact lenses
    at night?
  choices:
    A: They reflect oncoming headlights and cause temporary blindness.
    B: They cut down too much light, which is needed to see the road ahead.
    C: They are illegal to wear while driving at any time.
    D: They distort the colors of traffic signals.
  answer: B
  explanation: Drivers should avoid dark or tinted glasses/contact lenses at night
    because these types of lenses cut down too much light, and light is needed to
    see the road ahead.
- id: 201
  category: sharing_the_road
  question: Which of the following road conditions may pose a major hazard to a motorcyclist
    and cause them to suddenly change speed or position?
  choices:
    A: Freshly painted lane markings.
    B: Potholes, gravel, and railroad crossings.
    C: Rumble strips on the shoulder.
    D: Overhead highway signs.
  answer: B
  explanation: Motorcyclists may suddenly change speed or adjust their position in
    reaction to road conditions such as potholes, gravel, railroad crossings, and
    wet or slippery surfaces.
- id: 202
  category: sharing_the_road
  question: What equipment is a bicyclist required to have when riding at night to
    improve visibility?
  choices:
    A: A front light and a rear reflector.
    B: A high-visibility safety vest.
    C: A flashing yellow strobe light.
    D: A horn that can be heard from 200 feet away.
  answer: A
  explanation: Bicyclists riding at night present visibility problems and are required
    to have proper illumination, specifically a front light and a rear reflector.
- id: 203
  category: driver_responsibility
  question: Because safe driving depends on how well you see, how often does the manual
    recommend drivers have their eyes checked by an eye specialist?
  choices:
    A: Every six months.
    B: Every year.
    C: Every two years.
    D: Every five years.
  answer: B
  explanation: The manual states that because safe driving depends on how well you
    see, drivers should have their eyes checked every year by an eye specialist.
- id: 204
  category: sharing_the_road
  question: How can strong winds affect a motorcyclist?
  choices:
    A: They increase the motorcycle's fuel efficiency.
    B: They can move a motorcycle across an entire lane if the rider isn't prepared.
    C: They cause the motorcycle's engine to stall.
    D: They prevent the motorcycle's turn signals from functioning.
  answer: B
  explanation: A strong gust of wind can move a motorcycle across an entire lane if
    the rider isn't prepared for it. Wind gusts from large trucks can also be a hazard.
- id: 205
  category: sharing_the_road
  question: If a lane is marked and signed for bicycle use only, when may a driver
    use that lane?
  choices:
    A: When passing a slower vehicle.
    B: When preparing to make a right turn.
    C: When parking for less than 5 minutes.
    D: Drivers must NEVER use that lane as a turning lane, passing lane, or for parking.
  answer: D
  explanation: If the lane is marked and signed for bicycle use only, drivers must
    NEVER use that lane as a turning lane, passing lane or for parking.
- id: 206
  category: defensive_driving
  question: What type of meal is recommended prior to departing on a long trip to
    help prevent fatigue?
  choices:
    A: A large, full meal
    B: A meal high in sugar
    C: A light meal
    D: No meal at all
  answer: C
  explanation: The manual advises drivers to eat light meals prior to departure, noting
    that large, full meals tend to cause drowsiness.
- id: 207
  category: alcohol_drugs_health
  question: Under what conditions may a person with epilepsy drive in Arkansas?
  choices:
    A: If they are under the care of a doctor and seizure-free for one year.
    B: If they have been seizure-free for six months.
    C: If they only drive during daylight hours.
    D: People with epilepsy are never allowed to drive in Arkansas.
  answer: A
  explanation: According to the manual, in Arkansas, you may drive with epilepsy if
    you are under the care of a doctor and seizure-free for one year.
- id: 208
  category: driver_responsibility
  question: What should you do if you are angry or excited before you plan to drive?
  choices:
    A: Turn on the radio to distract yourself while driving.
    B: Drive slightly faster to get to your destination sooner.
    C: Take a short walk and stay off the road until you have calmed down.
    D: Drink a caffeinated beverage before getting behind the wheel.
  answer: C
  explanation: The manual states that if you are angry or excited, you should give
    yourself time to calm down or cool off, such as taking a short walk, but stay
    off the road until you have calmed down.
- id: 209
  category: alcohol_drugs_health
  question: Alcohol is involved in approximately what percentage of traffic crashes
    in which someone is killed?
  choices:
    A: 15 percent
    B: 25 percent
    C: 38 percent
    D: 50 percent
  answer: C
  explanation: The manual states that alcohol is involved in approximately thirty-eight
    (38) percent of traffic crashes in which someone is killed.
- id: 210
  category: alcohol_drugs_health
  question: After consuming alcohol, how long does it take for it to reach the brain?
  choices:
    A: 5 to 10 minutes
    B: 15 to 40 minutes
    C: 1 to 2 hours
    D: Immediately upon consumption
  answer: B
  explanation: According to the manual, alcohol in the bloodstream reaches the brain
    in fifteen (15) to forty (40) minutes.
- id: 211
  category: alcohol_drugs_health
  question: What is the first driving ability to be affected by alcohol?
  choices:
    A: Reflexes
    B: Vision
    C: Reaction time
    D: Judgment
  answer: D
  explanation: The manual explicitly states, "The first driving ability to be affected
    by alcohol is judgment."
- id: 212
  category: alcohol_drugs_health
  question: At what rate does the human body rid itself of alcohol?
  choices:
    A: One drink per hour
    B: Two drinks per hour
    C: One drink every two hours
    D: Three drinks per hour
  answer: A
  explanation: The manual states that the body rids itself of alcohol at a rate of
    one (1) drink per hour.
- id: 213
  category: alcohol_drugs_health
  question: Which of the following methods will help sober you up quickly?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising in fresh air
    D: Only time will sober you up
  answer: D
  explanation: The manual emphasizes that there is no way to sober up quickly. Coffee,
    fresh air, exercise, or a cold shower will not help; the only thing that will
    sober you up is time.
- id: 214
  category: penalties_and_points
  question: What is a consequence of refusing to take an alcohol test when instructed
    by a law enforcement officer?
  choices:
    A: You will be given a warning.
    B: You can lose your driver's license.
    C: You will be forced to take a blood test instead.
    D: You will receive a point on your driving record.
  answer: B
  explanation: The manual states, "You can lose your driver’s license if you refuse
    to take an alcohol test."
- id: 215
  category: penalties_and_points
  question: 'In Arkansas, you will be arrested for driving while intoxicated (DWI)
    with an alcohol concentration of at least:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.06%
    D: 0.08%
  answer: D
  explanation: You will be arrested for driving while intoxicated with an alcohol
    concentration of 0.08% or more in the breath or blood.
- id: 216
  category: penalties_and_points
  question: What is the potential fine for a first conviction of an alcohol violation?
  choices:
    A: $50 to $100
    B: $150 to $1000
    C: $2000 to $5000
    D: Exactly $500
  answer: B
  explanation: If found guilty of an alcohol violation for the first conviction, you
    will be fined from $150 to $1000, in addition to court costs.
- id: 217
  category: alcohol_drugs_health
  question: 'If you are under 21, you can be arrested for Underage Driving Under the
    Influence if your alcohol concentration is at least:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.06%
    D: 0.08%
  answer: A
  explanation: The manual states you can be arrested for Underage Driving Under the
    Influence if your alcohol concentration is 0.02% breath or blood alcohol concentration.
- id: 218
  category: penalties_and_points
  question: If a person under 21 years of age is convicted of purchasing or being
    in possession of alcohol, what will happen to their driving privileges?
  choices:
    A: They will be required to take a defensive driving course.
    B: They will receive a warning letter.
    C: Their driving privileges will be suspended, revoked, or disqualified.
    D: They will have an ignition interlock device installed.
  answer: C
  explanation: The manual states that any person under twenty-one (21) years of age
    convicted of purchasing or being in possession of alcohol will have their driving
    privileges suspended, revoked, or disqualified.
- id: 219
  category: alcohol_drugs_health
  question: How can over-the-counter drugs for colds or allergies affect your driving?
  choices:
    A: They increase your concentration.
    B: They can make you drowsy and affect your driving skills.
    C: They improve your reaction time.
    D: They have no effect on driving ability.
  answer: B
  explanation: The manual warns that many over-the-counter drugs for headaches, colds,
    hay fever, or other allergies can make a person drowsy and affect their driving
    skills.
- id: 220
  category: alcohol_drugs_health
  question: What should you do before driving if you are taking prescription or nonprescription
    drugs?
  choices:
    A: Drink a caffeinated beverage to stay alert.
    B: Check the label for warnings or ask your doctor about side effects.
    C: Only drive during daylight hours.
    D: Take half the recommended dosage.
  answer: B
  explanation: The manual states that some prescription and nonprescription drugs
    may impair driving, so you should check the label for warnings or ask your doctor
    or pharmacists for possible side effects before driving.
- id: 221
  category: alcohol_drugs_health
  question: According to the manual, what is a proven effect of marijuana on drivers?
  choices:
    A: It increases concentration and alertness.
    B: It stops impairment from other drugs.
    C: It causes drivers to make more mistakes and have trouble adjusting to glare.
    D: It improves reflexes and judgment.
  answer: C
  explanation: Studies have shown that people who use marijuana make more mistakes,
    have more trouble adjusting to glare, and get arrested for traffic violations
    more than other drivers.
- id: 222
  category: driver_responsibility
  question: How will your decision to become an organ donor affect the quality of
    emergency care you receive?
  choices:
    A: Emergency personnel will prioritize organ preservation over saving your life.
    B: It will not influence the quality of emergency care or medical treatment you
      receive.
    C: You will receive experimental medical treatments.
    D: You will be transferred to a specialized transplant hospital immediately.
  answer: B
  explanation: The decision to become an organ or tissue donor will not influence
    the quality of emergency care or medical treatment an organ donor might receive.
    Organ donations may only occur after every effort has been made to save the donor's
    life.
- id: 223
  category: license_system
  question: Where is the "Organ Donor" designation printed for individuals who choose
    to participate?
  choices:
    A: On the back of the vehicle registration.
    B: On the front of the Arkansas driver's license.
    C: On a separate card kept in the glove compartment.
    D: On the driver's license receipt only.
  answer: B
  explanation: The words "Organ Donor" will be printed on the front of the Arkansas
    driver's license for those individuals who choose to participate as registered
    organ donors.
- id: 224
  category: defensive_driving
  question: What is the first step you should take if your brakes suddenly stop working?
  choices:
    A: Shift into reverse immediately.
    B: Turn off the ignition.
    C: Pump the brake pedal several times.
    D: Pull the parking brake as hard and fast as possible.
  answer: C
  explanation: If your brakes stop working, the first step is to pump the brake pedal
    several times. This will often build up enough brake pressure to allow you to
    stop.
- id: 225
  category: defensive_driving
  question: 'If you experience a sudden tire blowout while driving, you should:'
  choices:
    A: Slam on the brakes to stop quickly.
    B: Hold the steering wheel tightly and keep the vehicle going straight.
    C: Turn the steering wheel sharply toward the shoulder.
    D: Accelerate to maintain control of the vehicle.
  answer: B
  explanation: If you have a sudden tire blowout, you should hold the steering wheel
    tightly and keep the vehicle going straight, then slow gradually by taking your
    foot off the gas pedal.
- id: 226
  category: vehicle_information
  question: What happens to your steering and braking if your engine fails while driving?
  choices:
    A: Both the steering wheel and brakes will lock completely.
    B: The steering will be difficult to turn and you may have to push very hard on
      the brake pedal.
    C: The steering will become very loose and the brakes will become highly sensitive.
    D: The vehicle will automatically apply the emergency brake.
  answer: B
  explanation: If your engine fails, you should keep a strong grip on the steering
    wheel because steering may be difficult to turn. The brakes will still work but
    you may have to push very hard on the brake pedal.
- id: 227
  category: defensive_driving
  question: What should you do if your motor keeps running faster and faster due to
    a faulty accelerator?
  choices:
    A: Quickly shift to neutral and pull off the road.
    B: Turn off the engine immediately while still in the lane.
    C: Apply the parking brake abruptly.
    D: Shift into a lower gear and pump the gas pedal.
  answer: A
  explanation: If the motor keeps running faster and faster, keep your eyes on the
    road, quickly shift to neutral, pull off the road when safe to do so, and turn
    off the engine.
- id: 228
  category: defensive_driving
  question: When trying to avoid a collision, what are a driver's three main options?
  choices:
    A: Stop, Turn, and Speed Up.
    B: Brake, Honk, and Swerve.
    C: Reverse, Stop, and Turn.
    D: Accelerate, Honk, and Flash headlights.
  answer: A
  explanation: 'In avoiding a collision, drivers have three options: (1) Stop, (2)
    Turn, and (3) Speed Up.'
- id: 229
  category: vehicle_information
  question: How should you brake in an emergency if your vehicle is equipped with
    an Antilock Braking System (ABS)?
  choices:
    A: Pump the brake pedal rapidly.
    B: Press on the brake pedal as hard as you can and keep pressing on it.
    C: Apply light pressure to the brake pedal to avoid locking the wheels.
    D: Step on the brake pedal, let up, and turn the steering wheel.
  answer: B
  explanation: With ABS, if you need to stop quickly, press on the brake pedal as
    hard as you can and keep pressing on it. Do not let up on the brake pedal.
- id: 230
  category: safe_driving_rules
  question: What is the recommended hand position on the steering wheel to maintain
    control when turning quickly to avoid a collision?
  choices:
    A: 8 o'clock and 4 o'clock.
    B: 9 o'clock and 3 o'clock.
    C: 10 o'clock and 2 o'clock.
    D: One hand at 12 o'clock.
  answer: C
  explanation: The manual states that the best way to grip the steering wheel is to
    place your hands at 10 o'clock and 2 o'clock positions.
- id: 231
  category: defensive_driving
  question: In which of the following situations might it be necessary to speed up
    to avoid a collision?
  choices:
    A: When approaching a sharp curve.
    B: When another vehicle is about to hit you from the side or behind.
    C: When driving on ice or snow.
    D: When your vehicle begins to skid.
  answer: B
  explanation: Sometimes it is best to speed up to avoid a collision. You may want
    to accelerate when another vehicle is about to hit you from the side or from behind.
- id: 232
  category: safe_driving_rules
  question: What is the cause of the vast majority of vehicle skids?
  choices:
    A: Driving with underinflated tires.
    B: Faulty antilock braking systems.
    C: Drivers traveling too fast for the conditions.
    D: Sudden engine failure.
  answer: C
  explanation: The manual explicitly states that the vast majority of skids are caused
    by drivers traveling too fast for the conditions.
- id: 233
  category: driver_responsibility
  question: What should you do if you pass a traffic crash but are not involved and
    emergency help has already arrived?
  choices:
    A: Stop your vehicle to see if you can help.
    B: Focus on your driving and keep moving.
    C: Pull over and take photos for evidence.
    D: Park nearby and walk to the scene.
  answer: B
  explanation: Do not stop at a crash unless you are involved, or emergency help has
    not arrived. Focus on your driving and keep moving so your vehicle does not block
    the way for rescue vehicles.
- id: 234
  category: driver_responsibility
  question: What should you do if you are involved in a traffic crash with a parked
    vehicle?
  choices:
    A: Leave a note on the windshield and drive away.
    B: Try to locate the owner of the vehicle.
    C: Wait inside your car until the police arrive.
    D: Call your insurance company and leave the scene.
  answer: B
  explanation: According to the manual, in case you are involved in a crash with a
    parked vehicle, you must try to locate the owner.
- id: 235
  category: driver_responsibility
  question: Under Arkansas law, when must a driver immediately notify the police after
    a crash?
  choices:
    A: Only if someone is killed.
    B: If there is any property damage, regardless of the amount.
    C: If anyone is injured, killed, or property damage exceeds $1000.
    D: Only if the crash involves a commercial vehicle.
  answer: C
  explanation: The manual states that if any person is injured, killed, or has property
    damage exceeding $1000, a driver must notify the police immediately.
- id: 236
  category: safe_driving_rules
  question: If you are involved in a traffic crash, why should you turn off the ignition
    of the wrecked vehicles?
  choices:
    A: To save battery power for the hazard lights.
    B: To prevent the engine from overheating.
    C: To stop the radio from distracting emergency responders.
    D: To prevent a fire in case fuel has spilled.
  answer: D
  explanation: The manual advises to turn off the ignition of wrecked vehicles and
    not to smoke near them because fuel could have spilled, which could cause a fire.
- id: 237
  category: driver_responsibility
  question: When assisting an injured person at a crash scene, what should you do
    to prevent them from going into shock?
  choices:
    A: Give them a warm cup of water.
    B: Move them to the side of the road immediately.
    C: Cover the individual with a blanket or warm clothing.
    D: Elevate their head and chest.
  answer: C
  explanation: To prevent an injured person from going into shock, the manual instructs
    to cover the individual with a blanket or warm clothing such as a coat or jacket.
- id: 238
  category: driver_responsibility
  question: What is the proper way to handle severe bleeding at a crash scene?
  choices:
    A: Apply a tourniquet above the wound.
    B: Supply direct pressure to the wound.
    C: Wash the wound with bottled water.
    D: Leave the wound alone until paramedics arrive.
  answer: B
  explanation: The manual states that if there is bleeding, you should supply direct
    pressure to the wound, as even severe bleeding can almost always be stopped or
    slowed this way.
- id: 239
  category: driver_responsibility
  question: When are you required to report an accident to the Office of Driver Services?
  choices:
    A: If property damage to one person's property is more than $3000, or there is
      an injury or death.
    B: If property damage exceeds $1000, regardless of injuries.
    C: Only if the police were not called to the scene.
    D: Within 10 days of any collision involving another vehicle.
  answer: A
  explanation: You must report the accident to the Office of Driver Services if there
    is an injury, a death, or property damage of more than $3000 to one person's property.
- id: 240
  category: driver_responsibility
  question: How many days do you have to file an accident report with the Office of
    Driver Services if it meets the reporting requirements?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The manual states that you must file the accident report within thirty
    (30) days of the accident.
- id: 241
  category: vehicle_information
  question: To maintain a clear margin of safety regarding driver airbags, how far
    should you position yourself from the steering wheel?
  choices:
    A: 5 inches
    B: 10 inches
    C: 15 inches
    D: 20 inches
  answer: B
  explanation: Placing yourself 10 inches from your driver airbag provides a clear
    margin of safety, measured from the center of the steering wheel to your breastbone.
- id: 242
  category: vehicle_information
  question: How should a driver properly check their blind spots before changing lanes?
  choices:
    A: Rely entirely on the rearview mirror.
    B: Adjust the side mirrors to point directly at the blind spots.
    C: Glance over the shoulder in the direction the vehicle is moving.
    D: Look at the reflection in the passenger's window.
  answer: C
  explanation: Mirrors do not display objects in blind spots. To properly check your
    blind spots, you should glance over the shoulder in the direction in which the
    vehicle is moving.
- id: 243
  category: vehicle_information
  question: Which of the following is an indicator of a potential brake issue?
  choices:
    A: A foul smell during heavy braking.
    B: The steering wheel vibrating at high speeds.
    C: The engine revving loudly when accelerating.
    D: A squeaking noise when turning the steering wheel.
  answer: A
  explanation: Indicators of a potential brake issue include a noise from underneath
    the vehicle when the pedal is depressed, a foul smell during heavy braking, or
    depressing the pedal with little breaking action.
- id: 244
  category: vehicle_information
  question: How often should windshield wiper blades generally be replaced?
  choices:
    A: Every 3 months.
    B: Every 6 months to a year.
    C: Every 2 to 3 years.
    D: Only when they completely stop working.
  answer: B
  explanation: Wiper blades should be replaced every six (6) months to a year or as
    soon as you notice a difference in driving visibility.
- id: 245
  category: vehicle_information
  question: What defines a 'cold tire' when checking tire inflation pressure?
  choices:
    A: A tire that has been driven in freezing weather.
    B: A tire that has not been driven on for at least three hours.
    C: A tire that has been parked in the shade.
    D: A tire that has been driven for less than 10 miles.
  answer: B
  explanation: The term cold does not relate to the outside temperature. A cold tire
    is one that has not been driven on for at least three hours.
- id: 246
  category: vehicle_information
  question: At what tread depth are tires generally considered unsafe and in need
    of replacement?
  choices:
    A: 1/2 of an inch
    B: 1/4 of an inch
    C: 1/8 of an inch
    D: 1/16 of an inch
  answer: D
  explanation: In general, tires are not safe and should be replaced when the tread
    is worn down to 1/16 of an inch.
- id: 247
  category: driver_responsibility
  question: If you are assisting at a crash scene, when is it acceptable to give an
    injured person something to drink?
  choices:
    A: If they are conscious and ask for water.
    B: If they are showing signs of shock.
    C: You should not give them anything to drink until medical personnel arrive.
    D: Only if you have bottled water available.
  answer: C
  explanation: 'The manual explicitly states: ''Do not give the injured anything to
    drink, even water, until medical personnel is on the scene.'''
- id: 248
  category: vehicle_information
  question: How should you adjust your driver's side-view mirror?
  choices:
    A: Place your head against the left side window and set the mirror so you can
      barely see the side of the car.
    B: Position your head above the center console and set the mirror to see the entire
      lane behind you.
    C: Adjust it so you can see the entire rear window without moving your head.
    D: Angle it downward so you can see the rear tires.
  answer: A
  explanation: To adjust the driver's side-view mirror, place your head against the
    left side window and set the mirror so you can just barely see the side of the
    car on the mirror's right side.
- id: 249
  category: vehicle_information
  question: How can you use a penny to check if your vehicle needs new tires?
  choices:
    A: Place the penny with Lincoln's head upright; if you see his chin, you need
      new tires.
    B: Place the penny with Lincoln's head upside down; if you can see the top of
      his head, you need new tires.
    C: Place the penny flat in the tread; if it falls out, you need new tires.
    D: Rub the penny on the tire; if it leaves a mark, you need new tires.
  answer: B
  explanation: According to the manual, if you place a penny in the tread with Lincoln's
    head upside down and facing you, and you can see the top of Lincoln's head, you
    are ready for new tires.
- id: 250
  category: safe_driving_rules
  question: Why is it recommended to occasionally open a window during the winter
    while driving?
  choices:
    A: To prevent the engine from overheating.
    B: To keep the windshield from cracking in cold weather.
    C: To reduce the risk of toxic exhaust fumes filtering into the moving vehicle.
    D: To improve the vehicle's fuel efficiency.
  answer: C
  explanation: During the winter, it is a good idea to occasionally open a window
    to allow fresh air to fill the cabin, which reduces any risk of toxic exhaust
    fumes filtering into the moving vehicle.
- id: 251
  category: vehicle_information
  question: What should you always make sure is set before starting the engine of
    your vehicle?
  choices:
    A: The air conditioning
    B: The parking brake
    C: The cruise control
    D: The hazard lights
  answer: B
  explanation: The manual states that you should always make sure your parking brake
    is set before starting the engine.
- id: 252
  category: driver_testing
  question: When appearing for your skills exam, which of the following must you bring?
  choices:
    A: A laminated photocopy of your instruction permit.
    B: A valid licensed driver who is at least 18 years old.
    C: Current proof of insurance and vehicle registration.
    D: A certified copy of your driving record.
  answer: C
  explanation: Applicants must bring their original instruction permit, a valid licensed
    driver 21 or older, current insurance (paper or electronic), and vehicle registration.
- id: 253
  category: driver_testing
  question: Which of the following vehicle conditions will cause an examiner to refuse
    to administer a skills test?
  choices:
    A: The vehicle has a donut spare tire on it.
    B: The vehicle has paper floor mats.
    C: The vehicle's radio does not work.
    D: The vehicle has a manual transmission.
  answer: A
  explanation: A skills test will not be given if the tires are worn so badly as to
    be unsafe, and the manual explicitly states that no donut spares are allowed on
    the vehicle.
- id: 254
  category: driver_testing
  question: During the vehicle controls portion of the skills test, how many missed
    controls are allowed before the test is failed?
  choices:
    A: One (1)
    B: Two (2)
    C: Three (3)
    D: Four (4)
  answer: C
  explanation: If the applicant cannot locate a control, it is marked as an infraction.
    You are allowed three (3) missed controls before the test is failed.
- id: 255
  category: driver_testing
  question: How many missed attempts in the same category on the road test will result
    in a failed exam?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: A total of two missed attempts in the same category will constitute
    a failed exam (for example, acquiring a second rolling stop).
- id: 256
  category: penalties_and_points
  question: What is the penalty imposed for an automatic failure during the road test?
  choices:
    A: A one-week penalty
    B: A two-week penalty
    C: A thirty-day penalty
    D: A six-month penalty
  answer: C
  explanation: According to the performance guidelines, automatic failures are imposed
    a thirty-day penalty.
- id: 257
  category: license_system
  question: How long is the Arkansas instruction permit valid?
  choices:
    A: Six months
    B: One year
    C: Two years
    D: Four years
  answer: C
  explanation: The manual states that the permit is valid for two (2) years and cannot
    be renewed.
- id: 258
  category: license_system
  question: Can an instruction permit be extended if it expires during a period of
    inclement weather?
  choices:
    A: Yes, for up to 30 days.
    B: Yes, but only if the skills test was already scheduled.
    C: No, permits cannot be extended for any reason.
    D: No, unless approved by a state trooper.
  answer: C
  explanation: 'The manual explicitly states: "Permits cannot be extended for any
    reason, due to inclement weather. No Exceptions!"'
- id: 259
  category: vehicle_information
  question: A vehicle will be denied for the skills exam if the front window tint
    is darker than what percentage?
  choices:
    A: 10%
    B: 15%
    C: 25%
    D: 50%
  answer: C
  explanation: Window tint darker than 25% on the front and darker than 10% in the
    back will be denied.
- id: 260
  category: driver_testing
  question: Under which of the following weather conditions will a road test NOT be
    canceled?
  choices:
    A: Rain
    B: Severe thunderstorms
    C: Fog
    D: Sleet or snow
  answer: A
  explanation: A road test is not canceled due to rain. However, tests are not administered
    in severe thunderstorms, fog, sleet, or snow.
- id: 261
  category: driver_testing
  question: Who is permitted to drive the applicant to the test center if they are
    not the 21-year-old accompanying driver?
  choices:
    A: Any person with a learner's permit.
    B: An unrestricted driver with a valid Class D license, 16 years and older.
    C: A commercial driver only.
    D: The applicant can drive themselves alone.
  answer: B
  explanation: An unrestricted driver with a valid Class D, (16) years and older,
    may drive the applicant to the test center.
- id: 262
  category: vehicle_information
  question: During the vehicle inspection for a skills test, a vehicle will be denied
    if the windshield tint brow measures more than how many inches from the center
    of the windshield?
  choices:
    A: 3 inches
    B: 4 inches
    C: 5 inches
    D: 6 inches
  answer: C
  explanation: Any brow measuring more than 5 inches from the center of the windshield
    will be denied.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 263
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 264
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 265
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 266
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 267
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 268
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 269
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 270
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 271
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 272
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 273
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 274
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 275
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 276
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 277
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 278
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 279
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 280
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 281
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
