metadata:
  source: 2025 Arkansas Driver's Manual
  total_questions: 252
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Arkansas, what is the minimum age to apply for a Learner's Instruction
    Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 14 and a half years old
  answer: A
  explanation: According to the Arkansas Driver's Manual, an individual may apply
    for a Learner's License at the age of 14.
- id: 2
  category: license_system
  question: 'A person operating a motor vehicle with an Arkansas Instruction Permit
    must be accompanied by a licensed driver who is at least:'
  choices:
    A: 18 years of age or older
    B: 21 years of age or older
    C: 25 years of age or older
    D: Any licensed driver regardless of age
  answer: B
  explanation: Arkansas law requires that a permit holder be accompanied by a licensed
    driver who is 21 years of age or older.
- id: 3
  category: license_system
  question: 'Under the Arkansas Graduated Driver License (GDL) law, an Intermediate
    License is issued to drivers between the ages of:'
  choices:
    A: 14 and 16
    B: 15 and 17
    C: 16 and 18
    D: 17 and 21
  answer: C
  explanation: An Intermediate License is issued to drivers 16 to 18 years of age
    who have held a Learner's License for at least six months with no accidents or
    traffic violations.
- id: 4
  category: license_system
  question: What are the curfew restrictions for an Arkansas Intermediate License
    holder?
  choices:
    A: No driving between 10:00 PM and 5:00 AM
    B: No driving between 11:00 PM and 4:00 AM
    C: No driving between Midnight and 6:00 AM
    D: There are no curfew restrictions for Intermediate Licenses
  answer: B
  explanation: Intermediate License holders in Arkansas are prohibited from driving
    between 11:00 PM and 4:00 AM, unless accompanied by a person 21 or older, or for
    specific activities like work or school.
- id: 5
  category: license_system
  question: How many unrelated minor passengers is an Arkansas Intermediate License
    holder permitted to carry?
  choices:
    A: None
    B: Only one
    C: Up to two
    D: Up to three
  answer: B
  explanation: Arkansas GDL laws restrict Intermediate License holders to carrying
    only one unrelated minor passenger unless accompanied by a licensed driver 21
    or older.
- id: 6
  category: license_system
  question: 'In Arkansas, drivers under the age of 18 are prohibited from using a
    cell phone while driving EXCEPT:'
  choices:
    A: When using a hands-free device
    B: When texting at a red light
    C: In an emergency
    D: When talking to a parent
  answer: C
  explanation: Arkansas law prohibits drivers under 18 from using a cell phone or
    any interactive wireless communication device while driving, even hands-free,
    except in an emergency.
- id: 7
  category: license_system
  question: 'Drivers in Arkansas between the ages of 18 and 20 are permitted to use
    a cell phone while driving ONLY if:'
  choices:
    A: They are using a hands-free device
    B: They are on a highway
    C: It is during daylight hours
    D: They have a full Class D license
  answer: A
  explanation: Arkansas law allows drivers aged 18 to 20 to use a cell phone for calls
    only if they use a hands-free device. Texting is prohibited for all drivers.
- id: 8
  category: license_system
  question: 'If you move to Arkansas or change your address within the state, you
    must notify the Office of Motor Vehicle (OMV) within:'
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: Arkansas law requires that you notify the Department of Finance and
    Administration (OMV) of any change of address or name within 10 days.
- id: 9
  category: license_system
  question: To pass the Arkansas vision screening, an applicant must have at least
    what visual acuity in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: The Arkansas Driver's Manual states that applicants must have at least
    20/40 vision in at least one eye, with or without corrective lenses.
- id: 10
  category: license_system
  question: 'Applicants for an Arkansas driver''s license under the age of 18 must
    provide proof of:'
  choices:
    A: Employment
    B: Enrollment in a public or private school (or GED/Graduation)
    C: Car ownership
    D: A savings account
  answer: B
  explanation: Arkansas law requires applicants under 18 to show proof of enrollment
    in school, a high school diploma, or a GED certificate to be eligible for a license.
- id: 11
  category: license_system
  question: The Arkansas knowledge test consists of 25 questions. How many must you
    answer correctly to pass?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '22'
  answer: C
  explanation: To pass the Arkansas knowledge test, you must answer 80% of the questions
    correctly, which is 20 out of 25 questions.
- id: 12
  category: license_system
  question: An Arkansas Instruction Permit is valid for how long before it expires?
  choices:
    A: 6 months
    B: 12 months
    C: 24 months
    D: Until the applicant turns 16
  answer: B
  explanation: An Arkansas Instruction Permit is valid for a period of 12 months (1
    year) from the date of issuance.
- id: 13
  category: license_system
  question: What are the minimum liability insurance requirements for a motor vehicle
    in Arkansas?
  choices:
    A: $15,000/$30,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$50,000
    D: $10,000/$20,000/$5,000
  answer: B
  explanation: Arkansas law requires minimum liability coverage of $25,000 for bodily
    injury of one person, $50,000 for bodily injury of two or more people, and $25,000
    for property damage (25/50/25).
- id: 14
  category: license_system
  question: 'Providing false information on an Arkansas driver''s license application
    can result in:'
  choices:
    A: A verbal warning only
    B: A fine and/or imprisonment and license suspension
    C: A requirement to retake the driving test
    D: No penalty if corrected within 30 days
  answer: B
  explanation: Submitting false information or documents is a serious offense in Arkansas
    and can lead to fines, jail time, and the suspension or revocation of driving
    privileges.
- id: 15
  category: license_system
  question: At what age can an Arkansas driver apply for an unrestricted Class D license
    (assuming all GDL requirements were met)?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: In Arkansas, once a driver reaches age 18, they are eligible for a
    regular, unrestricted Class D license, provided they have completed the GDL stages
    without major violations.
- id: 16
  category: license_system
  question: According to the Arkansas Driver's Manual, how many days must you wait
    to retake the skills (road) test if you fail it?
  choices:
    A: 2 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: In Arkansas, if you fail either the knowledge test or the skills test,
    you must wait at least five (5) days before you are eligible to attempt the test
    again.
- id: 17
  category: license_system
  question: Under the Arkansas point system, at what point range will a driver receive
    a warning letter from the Office of Driver Services?
  choices:
    A: 5 to 8 points
    B: 10 to 13 points
    C: 14 to 17 points
    D: 18 to 23 points
  answer: B
  explanation: Arkansas issues a warning letter to drivers who accumulate 10 to 13
    points. Accumulating 14 or more points results in an administrative hearing and
    potential suspension.
- id: 18
  category: license_system
  question: For how long is a standard Arkansas Class D driver's license typically
    valid before it must be renewed?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: As of recent Arkansas law changes, a standard non-commercial driver's
    license is issued for a period of eight (8) years.
- id: 19
  category: license_system
  question: What is the minimum age to apply for a Class MD (Motor-Driven Cycle) license
    in Arkansas, which covers cycles between 50cc and 250cc?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: A
  explanation: In Arkansas, a person as young as 14 years old may be issued a Class
    MD license for motor-driven cycles displacement between 50cc and 250cc. This license
    expires on the person's 16th birthday.
- id: 20
  category: license_system
  question: If an Arkansas driver accumulates 14 to 17 points on their driving record
    within a 36-month period, how long is the potential suspension period?
  choices:
    A: 30 days
    B: 60 days
    C: 3 months
    D: 6 months
  answer: C
  explanation: Arkansas law dictates that accumulating 14 to 17 points results in
    a 3-month suspension. 18 to 23 points results in a 6-month suspension, and 24
    or more results in a 1-year suspension.
- id: 21
  category: license_system
  question: When applying for an Arkansas driver's license, what does a 'Restriction
    B' on the license signify?
  choices:
    A: Daylight driving only
    B: Corrective lenses required
    C: No manual transmission
    D: Automatic transmission only
  answer: B
  explanation: Restriction code 'B' is a common designation on Arkansas licenses indicating
    that the driver is required to wear corrective lenses (glasses or contacts) while
    operating a motor vehicle.
- id: 22
  category: license_system
  question: An Arkansas resident who is a member of the Armed Forces and has a license
    that expires while on active duty outside the state has how many days to renew
    it after returning to AR or being discharged?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: Arkansas law provides a grace period for military personnel; their
    license remains valid for 60 days after their return to the state or discharge
    from duty.
- id: 23
  category: license_system
  question: 'A Class D license in Arkansas allows a person to drive a non-commercial
    vehicle with a Gross Vehicle Weight Rating (GVWR) of less than:'
  choices:
    A: 10,001 lbs
    B: 15,000 lbs
    C: 26,001 lbs
    D: 33,000 lbs
  answer: C
  explanation: A Class D license is the standard license for automobiles and allows
    the operation of vehicles weighing less than 26,001 pounds, provided the vehicle
    is not used for commercial purposes or carrying hazardous materials.
- id: 24
  category: license_system
  question: To comply with the federal REAL ID Act, an Arkansas 'REAL ID' compliant
    license is marked with what symbol in the top right corner?
  choices:
    A: A blue anchor
    B: A gold star
    C: A red 'X'
    D: The state seal
  answer: B
  explanation: Arkansas REAL ID compliant licenses feature a gold star in the upper
    right-hand corner to indicate they meet federal security standards for boarding
    domestic flights and entering federal facilities.
- id: 25
  category: license_system
  question: 'If an Arkansas driver changes their legal name due to marriage or a court
    order, they must bring the legal documents to a revenue office and apply for a
    duplicate license within:'
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Arkansas law requires drivers to update their license information,
    including name changes, within 30 days of the change occurring.
- id: 26
  category: license_system
  question: Which of the following is a requirement for the vehicle used during the
    Arkansas skills (road) test?
  choices:
    A: It must be a manual transmission vehicle
    B: It must have a passenger-side brake reachable by the examiner
    C: It must be currently registered and insured
    D: It must be a mid-sized sedan
  answer: C
  explanation: For the Arkansas skills test, the applicant must provide a vehicle
    that is properly insured, registered, and in safe working condition (lights, brakes,
    tires, etc.).
- id: 27
  category: license_system
  question: In Arkansas, if a minor's parents are divorced, who is the only person
    authorized to sign the application for a license or permit?
  choices:
    A: Either parent, regardless of custody
    B: The parent with certified custody
    C: The father only
    D: The mother only
  answer: B
  explanation: For applicants under 18, the application must be signed by a parent
    or legal guardian. If the parents are divorced, the parent with certified custody
    must sign.
- id: 28
  category: license_system
  question: What is the standard fee for an 8-year Arkansas Class D driver's license?
  choices:
    A: No fee
    B: Wait list only
    C: $24.00
    D: $40.00
  answer: D
  explanation: The current fee for a standard 8-year Arkansas Class D driver's license
    is $40.00.
- id: 29
  category: license_system
  question: Under the 'Motor Voter' law, where can Arkansas residents register to
    vote or update their voter registration?
  choices:
    A: Only at the County Clerk's office
    B: At any State Police troop headquarters
    C: At any Revenue Office when applying for or renewing a license
    D: Only online via the Secretary of State website
  answer: C
  explanation: The National Voter Registration Act (Motor Voter) allows Arkansas residents
    to register to vote or update their registration at any local Revenue Office during
    the driver's license application process.
- id: 30
  category: driver_testing
  question: In Arkansas, what is the maximum fine for a first-offense conviction of
    littering?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,000
  answer: C
  explanation: According to the Arkansas Driver's Manual, a person convicted of littering
    for the first time can be fined up to $1,000 and may be required to perform up
    to eight hours of community service.
- id: 31
  category: driver_testing
  question: Arkansas law requires drivers to turn on their headlights when using windshield
    wipers due to rain, snow, or fog. When else must headlights be turned on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: Only when visibility is less than 100 feet
  answer: C
  explanation: Arkansas law requires that vehicle headlights be turned on from 30
    minutes after sunset until 30 minutes before sunrise, and anytime windshield wipers
    are in use.
- id: 32
  category: driver_testing
  question: In Arkansas, it is illegal to park your vehicle within how many feet of
    a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Arkansas law prohibits parking a vehicle within 15 feet of a fire hydrant.
- id: 33
  category: driver_testing
  question: When parking near an intersection, you must be at least how many feet
    away from a stop sign, flashing beacon, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: In Arkansas, you cannot park within 30 feet of a traffic signal, stop
    sign, or flashing beacon.
- id: 34
  category: driver_testing
  question: When driving at night in Arkansas, you must dim your high beam headlights
    when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Arkansas law requires drivers to dim high beams when an oncoming vehicle
    is within 500 feet.
- id: 35
  category: driver_testing
  question: 'When passing a bicycle in Arkansas, a motorist must maintain a minimum
    distance of at least:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Arkansas law requires motorists to provide at least three feet of space
    when passing a person riding a bicycle.
- id: 36
  category: driver_testing
  question: 'In Arkansas, a person under the age of 21 can be arrested for Underage
    Driving Under the Influence (DUI) if their Blood Alcohol Content (BAC) is at or
    above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Arkansas has a 'zero tolerance' policy for underage drinking and driving;
    the legal limit for those under 21 is 0.02% BAC.
- id: 37
  category: driver_testing
  question: 'Under Arkansas''s Implied Consent Law, if you refuse to submit to a chemical
    test for alcohol or drugs at the request of a law enforcement officer:'
  choices:
    A: You will be fined $50 and released
    B: Your driving privileges will be suspended
    C: You will only be penalized if the test would have been positive
    D: You can choose to take a written test instead
  answer: B
  explanation: By operating a motor vehicle in Arkansas, you imply consent to chemical
    testing. Refusal to take the test will result in the seizure of your driver's
    license and suspension of driving privileges.
- id: 38
  category: driver_testing
  question: What is the minimum fine for a first-offense conviction of failing to
    stop for a school bus with its red lights flashing and stop arm extended in Arkansas?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: In Arkansas, the fine for a first offense of illegally passing a stopped
    school bus ranges from $250 to $1,000, and may include jail time.
- id: 39
  category: driver_testing
  question: In Arkansas, what is the default speed limit in an urban district unless
    otherwise posted?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: According to the Arkansas Driver's Manual, the speed limit in urban
    districts is 30 mph unless otherwise posted.
- id: 40
  category: driver_testing
  question: In Arkansas, you must signal at least how many feet before you turn or
    change lanes?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Arkansas law requires drivers to signal their intention to turn or
    change lanes at least 100 feet before the maneuver.
- id: 41
  category: driver_testing
  question: 'To maintain a safe following distance under normal conditions, the Arkansas
    Driver''s Manual recommends using the:'
  choices:
    A: One-second rule
    B: Two-second rule
    C: Five-second rule
    D: Car-length rule
  answer: B
  explanation: The Arkansas Driver's Manual recommends the 'two-second rule' to determine
    if you are following the vehicle in front of you at a safe distance.
- id: 42
  category: driver_testing
  question: 'When parking your vehicle on a downhill slope with a curb, you should
    turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the left
  answer: A
  explanation: When parking downhill, you should turn your wheels toward the curb
    so that if the vehicle rolls, it will roll into the curb and stop.
- id: 43
  category: driver_testing
  question: 'According to Arkansas''s ''Move Over'' law, when approaching an authorized
    emergency vehicle with activated flashing lights on the side of the road, you
    must:'
  choices:
    A: Stop immediately in your lane
    B: Speed up to pass quickly
    C: Move to the farthest lane away from the vehicle or slow down if changing lanes
      is unsafe
    D: Maintain your speed and stay in your current lane
  answer: C
  explanation: Arkansas law requires drivers to move to the farthest lane away from
    an emergency vehicle with flashing lights, or slow down and maintain a safe speed
    if a lane change is not possible.
- id: 44
  category: driver_testing
  question: 'Under Arkansas law, a driver under the age of 21 can be charged with
    a DUI if their blood alcohol concentration (BAC) is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Arkansas has a 'Zero Tolerance' law for minors. Any driver under 21
    with a BAC of 0.02% or higher can be charged with Driving Under the Influence.
- id: 45
  category: driver_testing
  question: 'In Arkansas, an adult driver (21 or older) is considered legally intoxicated
    if their blood alcohol concentration (BAC) is:'
  choices:
    A: 0.04% or higher
    B: 0.05% or higher
    C: 0.07% or higher
    D: 0.08% or higher
  answer: D
  explanation: For drivers 21 and older in Arkansas, the legal limit for blood alcohol
    concentration is 0.08%.
- id: 46
  category: driver_testing
  question: 'Arkansas''s ''Implied Consent'' law means that by operating a motor vehicle,
    you have agreed to:'
  choices:
    A: Carry a minimum of $50,000 in property damage insurance
    B: Submit to a chemical test for alcohol or drugs if requested by law enforcement
    C: Allow any passenger to use a cellular device
    D: Keep your vehicle registration in the glove box at all times
  answer: B
  explanation: The Implied Consent law states that by driving in Arkansas, you give
    consent to be tested for alcohol or drugs. Refusal results in license suspension.
- id: 47
  category: driver_testing
  question: 'In Arkansas, a first-time conviction for littering can result in community
    service and a fine of up to:'
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,000
  answer: C
  explanation: Arkansas takes littering seriously; a first conviction can lead to
    a fine of up to $1,000 and 8 hours of community service.
- id: 48
  category: driver_testing
  question: 'When parking a vehicle facing downhill on a two-way street with a curb,
    Arkansas law requires you to:'
  choices:
    A: Turn your wheels toward the curb
    B: Turn your wheels away from the curb
    C: Keep your wheels straight
    D: Turn your wheels toward the center of the road
  answer: A
  explanation: When parking downhill with a curb, you must turn your wheels toward
    the curb so the vehicle will roll into the curb rather than into traffic if the
    brakes fail.
- id: 49
  category: driver_testing
  question: 'When following another vehicle from behind at night in Arkansas, you
    must dim your high beams when you are within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: You must dim your high beams when following another vehicle within
    200 feet to prevent glare in the lead driver's rearview mirror.
- id: 50
  category: driver_testing
  question: 'When a school bus is stopped with its red lights flashing and stop arm
    extended on a roadway without a median, drivers must:'
  choices:
    A: Stop only if traveling in the same direction as the bus
    B: Slow down to 15 mph and pass with caution
    C: Stop regardless of which direction they are traveling
    D: Stop only if there are children currently crossing
  answer: C
  explanation: In Arkansas, all traffic must stop for a school bus with red lights
    flashing and stop arm extended, unless traveling on a divided highway with a median
    of 20 feet or more.
- id: 51
  category: driver_testing
  question: According to the Arkansas Driver's Manual, at what speed can your tires
    start to lose contact with the road (hydroplane) during heavy rain?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Arkansas manual states that hydroplaning can begin at speeds as
    low as 35 mph, and tires may lose all contact with the road at 50 mph.
- id: 52
  category: driver_testing
  question: In Arkansas, you should signal your intention to turn at least how many
    feet before the actual turn?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: Arkansas law requires drivers to signal a turn or lane change at least
    100 feet in advance.
- id: 53
  category: driver_testing
  question: In Arkansas, you are prohibited from parking within how many feet of a
    crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Arkansas regulations prohibit parking a vehicle within 20 feet of a
    crosswalk at an intersection.
- id: 54
  category: driver_testing
  question: 'When using hand signals to indicate a left turn, an Arkansas driver should:'
  choices:
    A: Extend the left arm out the window and point it straight out
    B: Extend the left arm out and point it upward
    C: Extend the left arm out and point it downward
    D: Wave the left arm in a circular motion
  answer: A
  explanation: To signal a left turn using hand signals, the driver should extend
    their left arm straight out the window.
- id: 55
  category: driver_testing
  question: 'In Arkansas, if you are convicted of a moving violation in a highway
    work zone when workers are present, the fine is:'
  choices:
    A: Reduced by half
    B: The same as a standard ticket
    C: Doubled
    D: Tripled
  answer: C
  explanation: Arkansas law dictates that fines for moving violations are doubled
    if they occur in a designated highway work zone while workers are present.
- id: 56
  category: driver_responsibility
  question: In Arkansas, if you are involved in a traffic crash that results in death,
    injury, or property damage of ________ or more, you must file a report (SR-1)
    with the Office of Driver Services.
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: According to the Arkansas Driver's Manual, any accident resulting in
    injury, death, or property damage in excess of $1,000 must be reported to the
    Office of Driver Services within 30 days using form SR-1.
- id: 57
  category: driver_responsibility
  question: 'Under the Arkansas ''Implied Consent'' law, by driving a motor vehicle
    in the state, you have agreed to:'
  choices:
    A: Carry a minimum of $50,000 in property damage insurance
    B: Submit to a chemical test for alcohol or drugs if requested by an officer
    C: Allow any passenger under 18 to ride without a seatbelt
    D: Keep your headlights on at all times while driving
  answer: B
  explanation: The Arkansas Implied Consent law means that by operating a vehicle,
    you consent to a breath, blood, or urine test if a law enforcement officer suspects
    you are driving under the influence.
- id: 58
  category: driver_responsibility
  question: 'If an Arkansas driver is convicted of a first-offense DUI (Driving Under
    the Influence) and is 21 years of age or older, their driving privilege will be
    suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: For a first DUI offense in Arkansas for a driver 21 or older, the license
    is typically suspended for 6 months.
- id: 59
  category: driver_responsibility
  question: 'When approaching a stationary authorized emergency vehicle (like a police
    car or tow truck) with flashing lights on the side of an Arkansas highway, the
    ''Move Over'' law requires you to:'
  choices:
    A: Stop immediately in the lane of traffic
    B: Maintain speed but honk to warn the officer
    C: Move to the farthest lane away from the vehicle or slow down if changing lanes
      is unsafe
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Arkansas law requires drivers to move to the farthest lane away from
    stationary emergency vehicles or slow down significantly if moving over is not
    possible or safe.
- id: 60
  category: driver_responsibility
  question: 'In Arkansas, if you are convicted of passing a stopped school bus that
    has its red lights flashing and stop arm extended, you may face a fine of up to:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Passing a stopped school bus is a serious offense in Arkansas. Fines
    for a first offense range from $250 to $1,000, and you may also face jail time.
- id: 61
  category: driver_responsibility
  question: If you sell a vehicle in Arkansas, you must submit a 'Notice of Release
    of Liability' to the Office of Motor Vehicle within how many days?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: To protect yourself from liability for a vehicle you no longer own,
    Arkansas law requires you to notify the DFA Office of Motor Vehicle within 10
    days of the sale.
- id: 62
  category: driver_responsibility
  question: 'Under Arkansas law, a person who is convicted of a first offense for
    parking in a space designated for persons with disabilities without a proper permit
    can be fined between:'
  choices:
    A: $50 and $100
    B: $100 and $250
    C: $250 and $500
    D: $500 and $1,000
  answer: C
  explanation: Arkansas law imposes a fine of $250 to $500 for the first conviction
    of illegally parking in a disabled parking space.
- id: 63
  category: driver_responsibility
  question: 'If an Arkansas driver accumulates 18 to 23 points on their driving record
    within a 36-month period, their license will be suspended for:'
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: According to the Arkansas point system, accumulating 18 to 23 points
    within 3 years results in a 6-month suspension.
- id: 64
  category: driver_responsibility
  question: In Arkansas, what is the penalty for a first-time refusal to submit to
    a chemical test (breathalyzer) under the Implied Consent Law?
  choices:
    A: A $50 fine only
    B: License suspension for 180 days
    C: Mandatory 48 hours in jail
    D: Permanent revocation of the driver's license
  answer: B
  explanation: Refusing the chemical test in Arkansas results in an automatic license
    seizure and a suspension of 180 days for a first offense.
- id: 65
  category: driver_responsibility
  question: When a new resident moves to Arkansas, they must register their vehicle
    within ________ days of establishing residency.
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: New residents are required by Arkansas law to register their vehicles
    with the Office of Motor Vehicle within 30 days of moving to the state.
- id: 66
  category: driver_responsibility
  question: In Arkansas, traffic fines are ________ if the violation occurs in a highway
    work zone while workers are present.
  choices:
    A: Reduced by half
    B: Stay the same
    C: Doubled
    D: Tripled
  answer: C
  explanation: Arkansas law mandates that fines for moving traffic violations are
    doubled when committed in a designated highway work zone when workers are present.
- id: 67
  category: driver_responsibility
  question: Which of the following is true regarding seat belt laws in Arkansas?
  choices:
    A: Seat belts are only required for front-seat passengers
    B: Arkansas has a secondary enforcement law (you must be pulled over for something
      else first)
    C: Arkansas has a primary enforcement law (you can be pulled over solely for not
      wearing a seat belt)
    D: Seat belts are optional for drivers over the age of 21
  answer: C
  explanation: Arkansas is a primary enforcement state for seat belts, meaning a law
    enforcement officer can stop and ticket a driver solely for a seat belt violation.
- id: 68
  category: driver_responsibility
  question: 'In Arkansas, you must file an SR-1 (Report of Traffic Accident) if there
    is a personal injury, death, or property damage to any one person in the amount
    of:'
  choices:
    A: $500 or more
    B: $750 or more
    C: $1,000 or more
    D: $2,000 or more
  answer: C
  explanation: According to the Arkansas Driver's Manual, a report must be filed within
    30 days if an accident involves injury, death, or property damage of $1,000 or
    more to any one person.
- id: 69
  category: driver_responsibility
  question: If you are involved in a traffic accident in Arkansas that requires an
    SR-1 report, how many days do you have to file it with the Office of Driver Services?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Arkansas law requires drivers to file a formal accident report (SR-1)
    within 30 days if the accident meets the reporting thresholds for damage or injury.
- id: 70
  category: driver_responsibility
  question: 'For drivers aged 21 or older in Arkansas, it is illegal to operate a
    motor vehicle with a blood alcohol content (BAC) of:'
  choices:
    A: 0.04% or higher
    B: 0.06% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: In Arkansas, the legal limit for BAC for drivers 21 and older is 0.08%.
- id: 71
  category: driver_responsibility
  question: What is the minimum fine for a first-offense conviction of failing to
    carry proof of required liability insurance in Arkansas?
  choices:
    A: $50
    B: $100
    C: $250
    D: $1,000
  answer: C
  explanation: A first offense for failing to maintain or provide proof of liability
    insurance in Arkansas carries a fine ranging from $250 to $1,000.
- id: 72
  category: driver_responsibility
  question: 'Arkansas''s ''Move Over'' law requires drivers to move to the farthest
    lane away from an emergency vehicle with flashing lights. If changing lanes is
    unsafe, the driver must:'
  choices:
    A: Stop completely until signaled to pass
    B: Maintain speed but honk to warn the emergency workers
    C: Slow down and maintain a safe speed for the conditions
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: If a lane change is not possible or is unsafe, Arkansas law requires
    drivers to slow down and maintain a safe speed until they have passed the emergency
    vehicle.
- id: 73
  category: driver_responsibility
  question: In Arkansas, what happens to the fines for traffic violations occurring
    in a highway work zone when workers are present?
  choices:
    A: They are reduced by half
    B: They stay the same as standard fines
    C: They are doubled
    D: They are tripled
  answer: C
  explanation: Arkansas law mandates that fines for all moving traffic violations
    are doubled if they occur in a designated highway work zone while workers are
    present.
- id: 74
  category: driver_responsibility
  question: How many days does a new resident have to register their vehicle after
    moving to Arkansas?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents must register their motor vehicles with the Arkansas
    Office of Motor Vehicles within 30 days of establishing residency.
- id: 75
  category: driver_responsibility
  question: Under the Arkansas point system, how many points are assessed against
    a driver's record for a conviction of 'Reckless Driving'?
  choices:
    A: 3 points
    B: 5 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Reckless driving is a serious offense in Arkansas and results in 8
    points being added to the driver's record.
- id: 76
  category: driver_responsibility
  question: In Arkansas, how many points are added to your driving record for speeding
    15 to 30 miles per hour over the posted limit?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 8 points
  answer: C
  explanation: The Arkansas point system assigns 5 points for speeding convictions
    where the speed was 15-30 mph over the limit.
- id: 77
  category: driver_responsibility
  question: 'A first-offense DUI conviction in Arkansas results in a driver''s license
    suspension for a period of:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: For a first DUI offense in Arkansas, the driver's license is typically
    suspended for 6 months.
- id: 78
  category: driver_responsibility
  question: In Arkansas, what is the minimum fine for a first offense of illegally
    passing a stopped school bus with its red lights flashing?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,500
  answer: B
  explanation: Passing a stopped school bus is a serious violation. A first offense
    carries a fine of no less than $250 and no more than $1,000, and/or up to 90 days
    in jail.
- id: 79
  category: driver_responsibility
  question: What is the fine range for a first-offense conviction of illegally parking
    in a space designated for persons with disabilities in Arkansas?
  choices:
    A: $50 to $100
    B: $100 to $200
    C: $250 to $500
    D: $500 to $1,000
  answer: C
  explanation: Arkansas law sets the fine for a first-offense conviction of illegally
    parking in a disabled space at a minimum of $250 and a maximum of $500.
- id: 80
  category: safe_driving_rules
  question: In Arkansas, when are you required to turn on your headlights?
  choices:
    A: Only between sunset and sunrise
    B: Whenever you are using your windshield wipers
    C: Only when visibility is less than 200 feet
    D: Only on rural highways
  answer: B
  explanation: According to Arkansas law, drivers must turn on their headlights when
    windshield wipers are in use due to rain, snow, or sleet, as well as from 30 minutes
    after sunset to 30 minutes before sunrise.
- id: 81
  category: safe_driving_rules
  question: When passing a bicycle in Arkansas, what is the minimum legal distance
    a motorist must maintain between their vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Arkansas law requires motorists to provide a minimum of three (3) feet
    of distance when passing a person operating a bicycle.
- id: 82
  category: safe_driving_rules
  question: When approaching a school bus with its red lights flashing and stop arm
    extended on a highway with a center turn lane, what must you do?
  choices:
    A: Only traffic following the bus must stop
    B: Only traffic in the center lane must stop
    C: Traffic in all directions must stop
    D: Stop only if there are children present on the road
  answer: C
  explanation: In Arkansas, traffic in all directions must stop for a school bus with
    red lights flashing, unless the highway is divided by a physical barrier or median.
    A center turn lane is not considered a physical barrier.
- id: 83
  category: safe_driving_rules
  question: 'According to the Arkansas Driver''s Manual, you should use the ''four-second
    rule'' to determine:'
  choices:
    A: How long to wait at a stop sign
    B: Your following distance behind another vehicle
    C: How long to signal before turning
    D: The time it takes to cross an intersection
  answer: B
  explanation: The Arkansas Driver's Manual recommends a following distance of at
    least four seconds to allow enough time to react to hazards.
- id: 84
  category: safe_driving_rules
  question: When parking along a curb in Arkansas, your wheels must be no more than
    how many inches from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: Arkansas law requires that when a vehicle is parked, its wheels must
    be parallel to and within 18 inches of the curb.
- id: 85
  category: safe_driving_rules
  question: You are required to signal at least how many feet before making a turn
    in Arkansas?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: In Arkansas, you must give a continuous signal for at least 100 feet
    before turning or changing lanes.
- id: 86
  category: safe_driving_rules
  question: Under Arkansas law, it is illegal to park within how many feet of a stop
    sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Arkansas Code § 27-51-1302 prohibits parking within 30 feet of any
    flashing beacon, stop sign, or traffic control signal located at the side of a
    roadway.
- id: 87
  category: safe_driving_rules
  question: According to the Arkansas Driver's Manual, at what speed can hydroplaning
    begin?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Arkansas Driver's Manual states that hydroplaning (where tires
    lose contact with the road and ride on top of water) can start at speeds as low
    as 35 mph.
- id: 88
  category: safe_driving_rules
  question: In Arkansas, what is the speed limit in a school zone when the yellow
    lights are flashing or children are present?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: According to the Arkansas Driver's Manual, the speed limit in a school
    zone is 25 mph unless otherwise posted when lights are flashing or children are
    present.
- id: 89
  category: safe_driving_rules
  question: In Arkansas, it is illegal to pass another vehicle within how many feet
    of an intersection, railroad crossing, bridge, or tunnel?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Arkansas law prohibits passing within 100 feet of an intersection,
    railroad crossing, bridge, viaduct, or tunnel where the view is obstructed.
- id: 90
  category: safe_driving_rules
  question: 'Arkansas state law requires drivers to turn on their headlights whenever:'
  choices:
    A: The sun is behind them
    B: Driving on a highway
    C: Windshield wipers are in use
    D: Driving in a construction zone
  answer: C
  explanation: Arkansas law requires that if your windshield wipers are on, your headlights
    must be on as well.
- id: 91
  category: safe_driving_rules
  question: In Arkansas, you are not allowed to park within how many feet of a stop
    sign, yield sign, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Arkansas law prohibits parking within 30 feet of a stop sign, yield
    sign, or traffic signal.
- id: 92
  category: safe_driving_rules
  question: 'On a roadway with two lanes (one in each direction), you must stop for
    a school bus with red lights flashing and the stop arm extended:'
  choices:
    A: Only if you are behind the bus
    B: Only if you are approaching from the front
    C: Regardless of which direction you are traveling
    D: Only if there are children crossing
  answer: C
  explanation: In Arkansas, on a two-lane road, traffic in both directions must stop
    for a school bus with flashing red lights and an extended stop arm.
- id: 93
  category: safe_driving_rules
  question: When two vehicles reach an uncontrolled intersection (no signs or signals)
    at the same time, which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver on the main road
  answer: B
  explanation: In Arkansas, when two vehicles reach an intersection at the same time,
    the driver on the left must yield to the driver on the right.
- id: 94
  category: defensive_driving
  question: According to the Arkansas Driver's Manual, what is the recommended minimum
    following distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: One car length
    B: Two seconds
    C: Four seconds
    D: Ten feet for every 10 mph
  answer: B
  explanation: The Arkansas Driver's Manual recommends using the 'two-second rule'
    to determine a safe following distance under ideal driving conditions.
- id: 95
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in Arkansas, how
    far ahead should you scan the road?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 30 seconds
  answer: C
  explanation: Arkansas driving rules state that you should look at least 15 seconds
    ahead—about one city block or a quarter-mile on the highway—to prepare for potential
    hazards.
- id: 96
  category: defensive_driving
  question: In Arkansas, at what speed can hydroplaning (tires losing contact with
    the road) begin to occur in heavy rain?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: At exactly 45 mph
    D: Only when tires are bald
  answer: A
  explanation: According to the Arkansas Driver's Manual, hydroplaning can start at
    speeds as low as 35 mph, and at 50 mph, your tires may lose all contact with the
    road.
- id: 97
  category: defensive_driving
  question: 'In Arkansas, you should use your low beam headlights when following another
    vehicle within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: The Arkansas Driver's Manual specifies that you should use low beams
    when following another vehicle closer than 200 feet.
- id: 98
  category: defensive_driving
  question: When driving in heavy fog in Arkansas, which light setting should you
    use to maintain the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Emergency flashers
  answer: B
  explanation: In fog, you should use low beams because high beams reflect off the
    fog and create a glare, making it harder to see.
- id: 99
  category: defensive_driving
  question: Arkansas's 'Move Over' law requires drivers to move to the farthest lane
    away from which of the following stationary vehicles?
  choices:
    A: Only police cars with flashing lights
    B: Only ambulances and fire trucks
    C: Any authorized vehicle with flashing lights, including tow trucks and highway
      maintenance
    D: Only school buses
  answer: C
  explanation: Arkansas law requires drivers to move over for any authorized vehicle
    stopped on the shoulder with its lights flashing, including emergency responders,
    tow trucks, and DOT vehicles.
- id: 100
  category: defensive_driving
  question: 'If your vehicle is equipped with Anti-lock Braking System (ABS) and you
    need to stop quickly in an emergency, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Press the brake pedal hard and keep holding it
    C: Shift to neutral and use the emergency brake
    D: Lightly tap the brakes to avoid locking
  answer: B
  explanation: With ABS, you should apply steady, firm pressure to the brake pedal.
    Pumping the brakes will deactivate the ABS system.
- id: 101
  category: defensive_driving
  question: During a rainstorm in Arkansas, when are the roads typically the most
    slippery?
  choices:
    A: After it has been raining for several hours
    B: Just as it starts to rain
    C: When the rain turns into a downpour
    D: After the rain has stopped and the sun comes out
  answer: B
  explanation: Roads are most slippery just as it starts to rain because the water
    mixes with oil and grease on the pavement that hasn't washed away yet.
- id: 102
  category: defensive_driving
  question: 'If your vehicle begins to skid on a slippery Arkansas road, you should:'
  choices:
    A: Brake hard immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Stay off the brake and turn the steering wheel in the direction the rear of
      the vehicle is skidding
    D: Accelerate to regain traction
  answer: C
  explanation: To recover from a skid, you should take your foot off the gas and steer
    in the direction the rear of the car is sliding (the direction you want the front
    of the car to go).
- id: 103
  category: defensive_driving
  question: 'To check your ''blind spots'' before changing lanes in Arkansas, you
    should:'
  choices:
    A: Check your rearview mirror
    B: Check your side mirrors
    C: Turn your head and look over your shoulder
    D: Slow down so other cars pass you
  answer: C
  explanation: Mirrors do not show everything. You must turn your head and look over
    your shoulder to ensure the lane is clear before moving.
- id: 104
  category: defensive_driving
  question: When approaching a railroad crossing in Arkansas with a stop sign or signal,
    you must stop your vehicle within how many feet from the nearest rail?
  choices:
    A: 5 to 25 feet
    B: 10 to 30 feet
    C: 15 to 50 feet
    D: 20 to 100 feet
  answer: C
  explanation: Arkansas law requires drivers to stop between 15 and 50 feet from the
    nearest rail at a railroad crossing when a stop is required.
- id: 105
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, Arkansas law
    suggests you should look down the road at least how far ahead?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 30 seconds
  answer: C
  explanation: Arkansas defensive driving guidelines state you should look 15 seconds
    ahead, which is about one city block in the city or a quarter-mile on the highway.
- id: 106
  category: defensive_driving
  question: At what speed can hydroplaning (tires riding on a film of water) begin
    to occur on wet Arkansas roads?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Exactly 45 mph
    D: Only when using cruise control
  answer: A
  explanation: The Arkansas Driver's Manual warns that hydroplaning can start at speeds
    as low as 35 mph, and at 50 mph, tires may lose all contact with the road.
- id: 107
  category: defensive_driving
  question: 'On a wet road, the Arkansas Driver''s Manual suggests you should reduce
    your speed by about:'
  choices:
    A: 5 mph
    B: 10 mph
    C: 20 mph
    D: 30 mph
  answer: B
  explanation: The Arkansas Driver's Manual advises that on a wet road, you should
    reduce your speed by about 10 mph to maintain traction.
- id: 108
  category: defensive_driving
  question: When driving on Arkansas roads covered in packed snow, how much should
    you reduce your speed?
  choices:
    A: By 10 mph
    B: By one-fourth
    C: By half
    D: To 15 mph regardless of the limit
  answer: C
  explanation: For safety on packed snow, the Arkansas Driver's Manual recommends
    cutting your speed in half.
- id: 109
  category: defensive_driving
  question: 'Under Arkansas law, when passing a bicycle traveling in the same direction,
    you must leave a safe distance of at least:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Arkansas Code § 27-51-311 requires a motorist to leave a safe distance
    when passing a bicycle, which is defined as at least three (3) feet.
- id: 110
  category: defensive_driving
  question: At 50 mph, it can take about how many feet to react and bring your vehicle
    to a complete stop on dry pavement?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 600 feet
  answer: C
  explanation: The Arkansas Driver's Manual states that at 50 mph, it can take about
    400 feet to react and stop, which is roughly the length of a city block.
- id: 111
  category: defensive_driving
  question: 'When parking your vehicle on a hill in Arkansas, if there is a curb and
    you are facing uphill, you should turn your wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the right
  answer: B
  explanation: When parking uphill against a curb, you should turn your wheels away
    from the curb so the vehicle will roll into the curb if the brakes fail.
- id: 112
  category: defensive_driving
  question: 'When entering a tunnel in Arkansas, the driver''s manual recommends that
    you:'
  choices:
    A: Turn on your high beams
    B: Turn on your headlights
    C: Speed up to exit quickly
    D: Honk your horn
  answer: B
  explanation: The Arkansas Driver's Manual advises drivers to turn on headlights
    when entering a tunnel to help your eyes adjust to the lower light levels and
    make your vehicle visible to others.
- id: 113
  category: defensive_driving
  question: 'If you are about to be hit from the rear while stopped at an Arkansas
    intersection, you should:'
  choices:
    A: Release your seatbelt
    B: Shift into neutral
    C: Press your head against the head restraint and be ready to apply your brakes
    D: Accelerate quickly into the intersection
  answer: C
  explanation: Arkansas defensive driving guidelines suggest that if you are about
    to be hit from the rear, you should press your head against the head restraint
    and be ready to apply your brakes so you are not pushed into another vehicle.
- id: 114
  category: alcohol_drugs_health
  question: 'In Arkansas, you are considered to be driving ''Under the Influence''
    (DWI) if your blood alcohol concentration (BAC) is at or above:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In Arkansas, it is illegal for anyone 21 years of age or older to operate
    a motor vehicle with a BAC of 0.08% or higher.
- id: 115
  category: alcohol_drugs_health
  question: 'Under Arkansas law, a driver under the age of 21 can be arrested for
    ''Underage Driving Under the Influence'' (DUI) with a blood alcohol concentration
    (BAC) as low as:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Arkansas has a 'Zero Tolerance' policy for minors. Drivers under 21
    can be convicted of DUI if their BAC is 0.02% or higher.
- id: 116
  category: alcohol_drugs_health
  question: What does the Arkansas 'Implied Consent' law mean for drivers?
  choices:
    A: You consent to have your vehicle searched at any time.
    B: You agree to provide your insurance information to other drivers.
    C: By driving on Arkansas roads, you have given consent to a chemical test for
      alcohol or drugs.
    D: You agree to carry a first-aid kit in your vehicle.
  answer: C
  explanation: The Implied Consent law means that by operating a vehicle in Arkansas,
    you are deemed to have given consent to a breath, blood, or urine test if an officer
    suspects you are impaired.
- id: 117
  category: alcohol_drugs_health
  question: 'If you refuse to submit to a chemical test for alcohol or drugs in Arkansas
    for the first time, your driving privileges will be suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: Under Arkansas law, the first time you refuse to submit to a chemical
    test under the Implied Consent law, your license will be suspended for 180 days.
- id: 118
  category: alcohol_drugs_health
  question: For a first-offense DWI conviction in Arkansas, what is the minimum period
    of jail time that may be ordered?
  choices:
    A: No jail time, only a fine
    B: 24 hours
    C: 72 hours
    D: 1 week
  answer: B
  explanation: A first-offense DWI conviction in Arkansas carries a jail sentence
    ranging from 24 hours to one year, though the court may order public service instead
    of jail.
- id: 119
  category: alcohol_drugs_health
  question: What is the range of fines for a first-offense DWI conviction in Arkansas
    (excluding court costs)?
  choices:
    A: Between $50 and $250
    B: Between $150 and $1,000
    C: Between $500 and $2,500
    D: Between $1,000 and $5,000
  answer: B
  explanation: In Arkansas, a first-offense DWI conviction results in a fine of no
    less than $150 and no more than $1,000, plus court costs.
- id: 120
  category: alcohol_drugs_health
  question: 'For a driver under 21, a first-offense ''Underage DUI'' (0.02% - 0.08%
    BAC) results in a license suspension of:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: A first-offense Underage DUI (for those under 21 with a BAC between
    0.02% and 0.08%) results in a 90-day license suspension.
- id: 121
  category: alcohol_drugs_health
  question: 'Arkansas law prohibits the possession of an open alcoholic beverage container
    in:'
  choices:
    A: The trunk of a vehicle
    B: The passenger area of a motor vehicle on a public highway
    C: A locked glove compartment
    D: The bed of a pickup truck if it is out of reach
  answer: B
  explanation: Arkansas's open container law makes it illegal to possess an open alcoholic
    beverage container in the passenger area of a motor vehicle while on a public
    highway or the right-of-way of a public highway.
- id: 122
  category: alcohol_drugs_health
  question: According to the Arkansas Driver's Manual, how long does it take for the
    body to rid itself of the alcohol contained in one typical drink?
  choices:
    A: About 30 minutes
    B: About 1 hour
    C: About 2 hours
    D: About 3 hours
  answer: B
  explanation: On average, it takes about one hour for the body to process and eliminate
    the alcohol from one standard drink (12 oz beer, 5 oz wine, or 1.5 oz hard liquor).
- id: 123
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with other drugs, such as prescription
    or over-the-counter medications?
  choices:
    A: The drugs cancel out the alcohol.
    B: The alcohol cancels out the drugs.
    C: It can multiply the effects of both, greatly increasing impairment.
    D: There is no effect if the medication is legal.
  answer: C
  explanation: Mixing alcohol and drugs can cause a synergistic effect, meaning the
    combined impact on your driving ability is much greater than the effects of either
    substance alone.
- id: 124
  category: alcohol_drugs_health
  question: In Arkansas, can you be charged with a DWI for driving under the influence
    of legal prescription drugs?
  choices:
    A: No, as long as you have a valid prescription.
    B: No, DWI only applies to alcohol and illegal narcotics.
    C: Yes, if the drug renders you 'intoxicated' or impairs your ability to drive
      safely.
    D: Yes, but only if you are also drinking alcohol.
  answer: C
  explanation: Arkansas law defines 'intoxicated' as being under the influence of
    alcohol, a controlled substance, or any other substance that impairs your reactions
    and motor skills. This includes legal prescription and over-the-counter drugs.
- id: 125
  category: alcohol_drugs_health
  question: 'To regain driving privileges after a DWI suspension in Arkansas, a driver
    may be required to install an Ignition Interlock Device (IID). This device:'
  choices:
    A: Records the vehicle's speed at all times.
    B: Prevents the car from starting if the driver has alcohol on their breath.
    C: Automatically calls the police if the driver swerves.
    D: Limits the vehicle's maximum speed to 35 mph.
  answer: B
  explanation: An Ignition Interlock Device (IID) is a breathalyzer connected to a
    vehicle's ignition system that prevents the engine from starting if it detects
    a BAC above a pre-set low limit.
- id: 126
  category: alcohol_drugs_health
  question: 'Arkansas drivers are required by law to report any medical condition
    that may affect their ability to drive safely to:'
  choices:
    A: Their local police department
    B: The Arkansas Department of Health
    C: The Office of Driver Services
    D: The Governor's Office
  answer: C
  explanation: Drivers must report medical conditions (such as epilepsy, vision loss,
    or other impairments) to the Office of Driver Services to ensure they can safely
    operate a motor vehicle.
- id: 127
  category: alcohol_drugs_health
  question: 'For a first-offense DWI conviction in Arkansas, the court-ordered fine
    can range from:'
  choices:
    A: $50 to $250
    B: $150 to $1,000
    C: $500 to $2,500
    D: $1,000 to $5,000
  answer: B
  explanation: The Arkansas Driver's Manual states that a first-offense DWI conviction
    carries a fine ranging from $150 to $1,000, in addition to court costs.
- id: 128
  category: alcohol_drugs_health
  question: 'A first-offense DWI conviction in Arkansas may result in a jail sentence
    of:'
  choices:
    A: 24 hours to 1 year
    B: 10 days to 6 months
    C: 1 month to 2 years
    D: No jail time is possible for a first offense
  answer: A
  explanation: In Arkansas, a first-offense DWI conviction can lead to imprisonment
    for a period of 24 hours to one year.
- id: 129
  category: alcohol_drugs_health
  question: 'If a driver under 21 is convicted of Underage DUI for the first time
    in Arkansas, their license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: For a first-offense Underage DUI (0.02% to 0.07% BAC), the driver's
    license will be suspended for 90 days.
- id: 130
  category: alcohol_drugs_health
  question: In Arkansas, a person convicted of DWI may be required to install an Ignition
    Interlock Device (IID) for a period of at least how long for a first offense?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Arkansas law requires a person convicted of DWI to have an Ignition
    Interlock Device installed for at least one year to have restricted driving privileges.
- id: 131
  category: alcohol_drugs_health
  question: 'When alcohol is combined with other drugs, such as tranquilizers or cold
    medicine, the effect on driving ability is:'
  choices:
    A: Reduced because the drugs cancel each other out.
    B: The same as drinking alcohol alone.
    C: Multiplied, making the driver much more impaired than with either drug alone.
    D: Only dangerous if the drugs are illegal.
  answer: C
  explanation: Combining alcohol with other drugs creates a synergistic effect, meaning
    the combined impact is much greater and more dangerous than the effects of each
    substance individually.
- id: 132
  category: alcohol_drugs_health
  question: Arkansas's 'Open Container' law prohibits which of the following?
  choices:
    A: Having any open alcoholic beverage container in the passenger area of a motor
      vehicle.
    B: Carrying unopened alcohol in the trunk of a car.
    C: Transporting alcohol in a grocery bag in the back seat.
    D: Drinking non-alcoholic beer while driving.
  answer: A
  explanation: It is illegal in Arkansas to possess an open container of alcohol in
    the passenger area of a motor vehicle while on a public highway.
- id: 133
  category: alcohol_drugs_health
  question: 'In addition to license suspension and fines, an Arkansas driver under
    21 convicted of Underage DUI must also:'
  choices:
    A: Pay a $5,000 civil penalty.
    B: Complete a victim impact presentation and public service work.
    C: Forfeit their vehicle to the state.
    D: Wait until age 25 to apply for an unrestricted license.
  answer: B
  explanation: Under Arkansas law, minors convicted of DUI are required to complete
    public service work and attend a victim impact program.
- id: 134
  category: alcohol_drugs_health
  question: Which of the following is the only effective way to 'sober up' before
    driving after consuming alcohol?
  choices:
    A: Drinking several cups of strong black coffee.
    B: Taking a very cold shower.
    C: Exercising or running to sweat out the alcohol.
    D: Giving the body time to process the alcohol.
  answer: D
  explanation: Time is the only thing that will sober you up. Coffee, showers, and
    exercise do not speed up the elimination of alcohol from the bloodstream.
- id: 135
  category: alcohol_drugs_health
  question: 'If an Arkansas driver is convicted of a second DWI offense within five
    years of the first, the license suspension period is:'
  choices:
    A: 180 days
    B: 1 year
    C: 24 months
    D: Permanent revocation
  answer: C
  explanation: For a second DWI offense within a five-year period in Arkansas, the
    driver's license will be suspended for 24 months.
- id: 136
  category: penalties_and_points
  question: Under Arkansas law, a driver who is convicted of 'Reckless Driving' will
    have how many points added to their driving record?
  choices:
    A: 3 points
    B: 5 points
    C: 8 points
    D: 14 points
  answer: C
  explanation: Reckless driving is considered a serious violation in Arkansas and
    carries a penalty of 8 points on the offender's driving record.
- id: 137
  category: penalties_and_points
  question: Under the Arkansas Implied Consent Law, if you refuse to take a chemical
    test for alcohol or drugs, your license will be suspended for how long for a first
    offense?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: By driving on Arkansas roads, you consent to chemical testing. A first-time
    refusal results in an administrative license suspension of 180 days.
- id: 138
  category: penalties_and_points
  question: If you are convicted of illegally passing a stopped school bus with its
    red lights flashing in Arkansas, your driver's license will be suspended for how
    long for a first offense?
  choices:
    A: 7 days
    B: 21 days
    C: 60 days
    D: 6 months
  answer: B
  explanation: Arkansas law (Isaac's Law) mandates a 21-day driver's license suspension
    for a first offense of illegally passing a stopped school bus.
- id: 139
  category: penalties_and_points
  question: How many points are assessed on an Arkansas driving record for 'Leaving
    the Scene of an Accident' involving property damage only?
  choices:
    A: 3 points
    B: 6 points
    C: 10 points
    D: Automatic Revocation
  answer: B
  explanation: Leaving the scene of an accident involving property damage results
    in 6 points on your Arkansas driving record.
- id: 140
  category: penalties_and_points
  question: For a driver under 21 convicted of their first Underage DUI (0.02% BAC
    or higher), how long will their license be suspended?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: B
  explanation: A first-offense Underage DUI conviction in Arkansas results in a license
    suspension of 90 days.
- id: 141
  category: penalties_and_points
  question: 'Failure to yield or move over for an emergency vehicle with flashing
    lights (Move Over Law) in Arkansas can result in a fine of up to:'
  choices:
    A: Up to $100
    B: Up to $250
    C: Up to $500
    D: Up to $1,000
  answer: C
  explanation: Violating the Arkansas Move Over Law can result in a fine of up to
    $500, jail time, or both.
- id: 142
  category: penalties_and_points
  question: How many points are added to an Arkansas driving record for 'Following
    Too Closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Following too closely is a 3-point violation under the Arkansas Driver
    Services point system.
- id: 143
  category: penalties_and_points
  question: In Arkansas, points assigned to your driving record remain valid for how
    long from the date of the violation?
  choices:
    A: 12 months
    B: 24 months
    C: 36 months
    D: 60 months
  answer: C
  explanation: The Arkansas Office of Driver Services tracks points over a 36-month
    (3-year) period to determine license suspensions.
- id: 144
  category: penalties_and_points
  question: What is the minimum fine for a first-offense DWI (Driving While Intoxicated)
    conviction for an adult driver in Arkansas?
  choices:
    A: No minimum fine
    B: $150
    C: $500
    D: $1,000
  answer: B
  explanation: For a first-offense DWI in Arkansas, the fine ranges from a minimum
    of $150 to a maximum of $1,000, plus court costs.
- id: 145
  category: penalties_and_points
  question: 'For a driver under the age of 21, Arkansas''s ''Zero Tolerance'' law
    sets the Blood Alcohol Content (BAC) limit at:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Arkansas has a 'Zero Tolerance' law for minors. If a driver under 21
    has a BAC of 0.02% or higher, they can be arrested for DUI.
- id: 146
  category: penalties_and_points
  question: In Arkansas, what is the penalty for passing a stopped school bus while
    its red lights are flashing and the stop arm is extended?
  choices:
    A: A fine of $50 to $100
    B: A fine of $250 to $1,000 and/or up to 90 days in jail
    C: A verbal warning for the first offense
    D: A mandatory 2-year license revocation
  answer: B
  explanation: Passing a stopped school bus is a serious violation in Arkansas. Conviction
    can lead to a fine between $250 and $1,000, and/or up to 90 days in jail.
- id: 147
  category: penalties_and_points
  question: 'When speeding in an Arkansas highway work zone while workers are present,
    the fines are:'
  choices:
    A: Reduced by half
    B: The same as normal speeding fines
    C: Doubled
    D: Tripled
  answer: C
  explanation: Arkansas law mandates that fines for traffic violations, including
    speeding, are doubled when committed in a highway work zone while workers are
    present.
- id: 148
  category: penalties_and_points
  question: What is the point value assigned for speeding 15 miles per hour or more
    over the posted limit in Arkansas?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 8 points
  answer: C
  explanation: In the Arkansas point system, speeding 15 mph or more over the limit
    results in 5 points being added to your driving record.
- id: 149
  category: penalties_and_points
  question: 'In Arkansas, failing to yield to an emergency vehicle (violating the
    ''Move Over'' law) can result in a fine of up to:'
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: B
  explanation: Violating the Arkansas 'Move Over' law, which requires drivers to move
    to the farthest lane or slow down for emergency vehicles, can result in a fine
    of up to $500 and/or jail time.
- id: 150
  category: penalties_and_points
  question: 'An Arkansas driver who accumulates 24 or more points within a 36-month
    period will have their license suspended for:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Permanently
  answer: B
  explanation: The highest tier of the Arkansas point system triggers a 1-year (12-month)
    suspension for drivers who reach 24 points or more.
- id: 151
  category: sharing_the_road
  question: 'In Arkansas, you are NOT required to stop for a school bus with flashing
    red lights if you are traveling in the opposite direction on a highway that is
    divided by:'
  choices:
    A: A broken yellow line
    B: A parkway or a median strip 20 feet wide or more
    C: A double solid yellow line
    D: A shared center turn lane
  answer: B
  explanation: Arkansas law states that you do not have to stop for a school bus if
    you are traveling in the opposite direction on a multi-lane highway divided by
    a parkway or median strip of 20 feet or more.
- id: 152
  category: sharing_the_road
  question: 'Under the Arkansas ''Move Over'' law, when approaching a stationary emergency
    vehicle with flashing lights, you must:'
  choices:
    A: Maintain speed but honk your horn
    B: Move to the farthest lane away from the vehicle if safe to do so
    C: Stop immediately in your lane
    D: Speed up to pass the vehicle quickly
  answer: B
  explanation: Arkansas law requires drivers to move to the farthest lane away from
    a stationary emergency vehicle, or slow down and maintain a safe speed if a lane
    change is not possible.
- id: 153
  category: sharing_the_road
  question: 'In Arkansas, if you are found guilty of passing a stopped school bus
    with its red lights flashing, you can be fined up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Under Arkansas law (Isaac's Law), the fine for a first offense of passing
    a stopped school bus can range from $250 to $1,000, and may include jail time.
- id: 154
  category: sharing_the_road
  question: 'When driving near a large commercial truck, ''No-Zones'' refer to:'
  choices:
    A: Areas where trucks are not allowed to drive
    B: The blind spots around the front, rear, and sides of the truck
    C: The truck's fuel tanks
    D: Speed-restricted zones for heavy vehicles
  answer: B
  explanation: The Arkansas Driver's Manual defines 'No-Zones' as the large blind
    spots around a truck where the driver cannot see your vehicle.
- id: 155
  category: sharing_the_road
  question: 'In Arkansas, when an emergency vehicle with sirens and flashing lights
    is approaching from behind, you should:'
  choices:
    A: Stop in your current lane immediately
    B: Pull over to the right edge of the road and stop
    C: Speed up to stay ahead of it
    D: Pull over to the left shoulder
  answer: B
  explanation: When an emergency vehicle is approaching with lights and sirens, Arkansas
    law requires you to pull over to the right edge of the road and stop until it
    has passed.
- id: 156
  category: sharing_the_road
  question: 'When following a motorcycle in Arkansas, you should allow a following
    distance of at least:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 to 6 seconds
    D: 10 seconds
  answer: C
  explanation: The Arkansas Driver's Manual recommends a following distance of 4 to
    6 seconds when behind a motorcycle to allow for sudden maneuvers or stops.
- id: 157
  category: sharing_the_road
  question: 'In Arkansas, when approaching a railroad crossing with a lowering gate
    or flashing signals, you must stop your vehicle within:'
  choices:
    A: 5 to 10 feet from the tracks
    B: 15 to 50 feet from the tracks
    C: 50 to 100 feet from the tracks
    D: Exactly 20 feet from the tracks
  answer: B
  explanation: Arkansas law requires drivers to stop between 15 and 50 feet from the
    nearest rail of a railroad crossing when signals indicate a train is approaching.
- id: 158
  category: sharing_the_road
  question: 'When a bicyclist is riding on an Arkansas roadway, they are generally
    required to:'
  choices:
    A: Ride against the flow of traffic
    B: Ride on the sidewalk only
    C: Follow the same rules of the road as motor vehicles
    D: Always ride in the center of the lane
  answer: C
  explanation: In Arkansas, bicyclists have the same rights and responsibilities as
    motor vehicle drivers and must follow the same traffic laws.
- id: 159
  category: sharing_the_road
  question: 'In Arkansas, if you see a pedestrian with a white cane or a guide dog
    at an intersection, you must:'
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and stop if necessary
    C: Drive around them slowly
    D: Wait for them to signal you to pass
  answer: B
  explanation: Arkansas law requires drivers to yield the right-of-way to blind or
    visually impaired pedestrians using a white cane or a guide dog.
- id: 160
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck driver may need to:'
  choices:
    A: Stay strictly in the right lane
    B: Swing wide to the left to clear the curb
    C: Speed up to complete the turn
    D: Turn from the left lane only
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn
    without the trailer hitting the curb or other objects.
- id: 161
  category: sharing_the_road
  question: 'Arkansas law requires that any bicycle used at night must be equipped
    with a lamp on the front that emits a white light visible from a distance of at
    least:'
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Arkansas Code § 27-36-220 requires bicycles operated at night to have
    a front white light visible from 500 feet and a rear red reflector or light visible
    from 500 feet.
- id: 162
  category: sharing_the_road
  question: In Arkansas, when a school bus is stopped on a multi-lane highway with
    its red lights flashing and stop arm extended, which of the following is true?
  choices:
    A: Traffic in all lanes must stop regardless of a median.
    B: Traffic in all lanes must stop unless the highway is divided by a parkway or
      median.
    C: Only traffic following the bus must stop.
    D: Traffic in the opposite direction never has to stop on a multi-lane road.
  answer: B
  explanation: According to the Arkansas Driver's Manual, you do not have to stop
    if you are traveling in the opposite direction of a school bus on a multi-lane
    highway if the highway is divided by a parkway or median.
- id: 163
  category: sharing_the_road
  question: Under Arkansas law (Act 637), what is the minimum distance a motorist
    must maintain when overtaking and passing a bicycle traveling in the same direction?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Arkansas law requires motorists to provide a distance of at least three
    (3) feet when passing a bicycle.
- id: 164
  category: sharing_the_road
  question: In Arkansas, what must a driver do when approaching a pedestrian carrying
    a white cane or using a guide dog?
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Drive around them slowly if they are not in a crosswalk
    D: Only stop if the pedestrian is in a marked school zone
  answer: B
  explanation: Arkansas law requires drivers to yield the right-of-way to any pedestrian
    who is blind or visually impaired and carrying a white cane or using a guide dog.
- id: 165
  category: sharing_the_road
  question: 'According to Arkansas Act 650 (the ''Safety Stop'' law), a person operating
    a bicycle may treat a stop sign as a:'
  choices:
    A: Yield sign
    B: Green light
    C: Mandatory 3-second stop
    D: No-stop zone
  answer: A
  explanation: Arkansas Act 650 allows cyclists to treat stop signs as yield signs,
    meaning they must slow down and stop if required for safety, but may proceed without
    a full stop if the way is clear.
- id: 166
  category: sharing_the_road
  question: In Arkansas, who is legally required to wear a helmet while operating
    or riding on a motorcycle?
  choices:
    A: All riders regardless of age
    B: Only riders under the age of 18
    C: Only riders under the age of 21
    D: Only the operator, not the passenger
  answer: C
  explanation: Arkansas law requires all motorcycle operators and passengers under
    the age of 21 to wear a helmet.
- id: 167
  category: sharing_the_road
  question: When sharing the road with large trucks, what is the 'No-Zone'?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the front, back, and sides of the truck
    C: The lane directly to the left of the truck
    D: The area within 50 feet of a railroad crossing
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck where
    the driver cannot see other vehicles. If you cannot see the truck driver's face
    in their side mirrors, they cannot see you.
- id: 168
  category: sharing_the_road
  question: 'When passing a large tractor-trailer, you should not pull back in front
    of the truck until you can see:'
  choices:
    A: The top of the truck's cab in your side mirror
    B: The truck's headlights in your rearview mirror
    C: The truck's turn signal
    D: The driver's face in your side mirror
  answer: B
  explanation: To ensure enough space when passing a large truck, do not move back
    into the lane until you can see the entire front of the truck (both headlights)
    in your rearview mirror.
- id: 169
  category: sharing_the_road
  question: 'In Arkansas, if you are turning at an intersection and a pedestrian is
    crossing the street you are turning into, you must:'
  choices:
    A: Honk to warn them and proceed
    B: Wait for the pedestrian to finish crossing
    C: Turn quickly before they reach your lane
    D: Only stop if there is a marked crosswalk
  answer: B
  explanation: Drivers must yield to pedestrians crossing the street, even if there
    are no marked crosswalks or signals.
- id: 170
  category: sharing_the_road
  question: What is the minimum distance you should stop your vehicle from the nearest
    rail of a railroad crossing when a train is approaching?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 25 feet
  answer: C
  explanation: Arkansas law requires vehicles to stop within 15 to 50 feet from the
    nearest rail of a railroad crossing when a signal is flashing or a train is approaching.
- id: 171
  category: sharing_the_road
  question: 'Under Arkansas law, bicycles are considered:'
  choices:
    A: Pedestrians
    B: Motor vehicles
    C: Vehicles with the same rights and responsibilities as motor vehicles
    D: Nuisances that must stay on the sidewalk
  answer: C
  explanation: In Arkansas, bicycles have the same rights and responsibilities as
    drivers of motor vehicles and must follow the same rules of the road.
- id: 172
  category: sharing_the_road
  question: 'If you are convicted of a second offense of passing a stopped school
    bus in Arkansas within 5 years, your driver''s license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: D
  explanation: Under Arkansas law, a second offense of illegally passing a school
    bus within five years results in a mandatory driver's license suspension for six
    (6) months.
- id: 173
  category: vehicle_information
  question: According to Arkansas law, when are motorists required to turn on their
    headlights in relation to weather conditions?
  choices:
    A: Only when visibility is less than 200 feet
    B: Only during heavy downpours
    C: Whenever windshield wipers are in use
    D: Only after sunset
  answer: C
  explanation: Arkansas Code § 27-36-204 requires that headlights be turned on any
    time windshield wipers are in use due to rain, sleet, or snow.
- id: 174
  category: vehicle_information
  question: In Arkansas, between what specific times must your vehicle's headlights
    be turned on?
  choices:
    A: From sunset to sunrise
    B: From 30 minutes after sunset to 30 minutes before sunrise
    C: From 1 hour after sunset to 1 hour before sunrise
    D: Only when it is dark enough that you cannot see 1,000 feet ahead
  answer: B
  explanation: Arkansas law requires headlights to be turned on from one-half hour
    after sunset to one-half hour before sunrise, or when visibility is less than
    500 feet.
- id: 175
  category: vehicle_information
  question: 'Under Arkansas law, a tire is considered unsafe if the tread depth is
    less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/16 of an inch
  answer: B
  explanation: Arkansas law and safety standards specify that tires are unsafe if
    they have less than 2/32 of an inch of tread depth.
- id: 176
  category: vehicle_information
  question: For a passenger vehicle in Arkansas, what is the minimum legal light transmission
    allowed for aftermarket tinting on the front side windows?
  choices:
    A: 20%
    B: 25%
    C: 35%
    D: 50%
  answer: B
  explanation: Arkansas Code § 27-37-306 specifies that aftermarket tinting on the
    front side windows must allow at least 25% light transmission.
- id: 177
  category: vehicle_information
  question: 'In Arkansas, aftermarket window tinting on the windshield is only allowed:'
  choices:
    A: If it covers the entire windshield and allows 70% light
    B: Along the top 5 inches of the windshield
    C: If the driver has a doctor's note for any portion of the glass
    D: It is strictly prohibited on any part of the windshield
  answer: B
  explanation: Arkansas law allows tinting on the windshield only along the top five
    inches (the AS-1 line), provided it allows at least 25% light transmission.
- id: 178
  category: vehicle_information
  question: 'Arkansas law requires that the rear license plate must be illuminated
    by a white light that makes the plate clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Arkansas Code § 27-36-215 requires a tail lamp or a separate lamp to
    illuminate the rear registration plate so it is visible from 50 feet to the rear.
- id: 179
  category: vehicle_information
  question: 'Every motor vehicle operated on Arkansas highways must be equipped with
    a horn that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Arkansas Code § 27-37-202 requires every motor vehicle to be equipped
    with a horn in good working order capable of emitting sound audible under normal
    conditions from a distance of not less than 200 feet.
- id: 180
  category: vehicle_information
  question: 'In Arkansas, the service brake (foot brake) must be capable of stopping
    a passenger vehicle traveling at 20 mph within a distance of:'
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 40 feet
  answer: C
  explanation: Arkansas Code § 27-37-201 requires that the service brakes on a passenger
    vehicle be able to stop the vehicle within 30 feet when traveling at 20 mph.
- id: 181
  category: vehicle_information
  question: 'Arkansas law requires every motor vehicle to be equipped with a mirror
    that reflects a view of the highway for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Arkansas Code § 27-37-305 requires vehicles to have a mirror located
    to reflect to the driver a view of the highway for a distance of at least 200
    feet to the rear.
- id: 182
  category: vehicle_information
  question: 'Under the Arkansas Child Passenger Protection Act, a child must be properly
    secured in an appropriate child safety seat if they are:'
  choices:
    A: Under 5 years of age and weigh less than 50 pounds
    B: Under 6 years of age and weigh less than 60 pounds
    C: Under 8 years of age and weigh less than 80 pounds
    D: Under 4 years of age regardless of weight
  answer: B
  explanation: Arkansas Code § 27-34-104 requires children under 6 years of age and
    weighing less than 60 pounds to be restrained in a child passenger safety seat
    system.
- id: 183
  category: vehicle_information
  question: 'In Arkansas, turn signal lights must be visible from a distance of not
    less than:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Arkansas Code § 27-36-216 states that signal lamps must be visible
    and understandable during both day and night from a distance of 100 feet.
- id: 184
  category: vehicle_information
  question: Which of the following is PROHIBITED on a standard non-emergency passenger
    vehicle in Arkansas?
  choices:
    A: A red light visible from the front of the vehicle
    B: A white light illuminating the license plate
    C: Amber turn signals on the rear
    D: A third brake light in the rear window
  answer: A
  explanation: Arkansas Code § 27-36-208 prohibits any person from driving or moving
    a vehicle with any lamp or device displaying a red light visible from directly
    in front of the center thereof, unless it is an authorized emergency vehicle.
- id: 185
  category: vehicle_information
  question: 'Arkansas law regarding vehicle exhaust systems states that:'
  choices:
    A: Mufflers are optional if the vehicle is 25 years or older
    B: Muffler cutouts or bypasses are permitted on rural highways
    C: Every vehicle must have a muffler in good working order to prevent excessive
      noise
    D: Exhaust systems may be modified to increase engine noise for safety
  answer: C
  explanation: Arkansas Code § 27-37-201 requires every motor vehicle to be equipped
    with a muffler in good working order to prevent excessive or unusual noise and
    smoke; cutouts and bypasses are prohibited.
- id: 186
  category: vehicle_information
  question: Under Arkansas law (Act 560 of 1991), what is the minimum 'net light transmission'
    allowed for window tint on the front side windows?
  choices:
    A: 10%
    B: 25%
    C: 35%
    D: 50%
  answer: B
  explanation: Arkansas law requires that the front side windows (to the left and
    right of the driver) must allow at least 25% net light transmission.
- id: 187
  category: vehicle_information
  question: For passenger cars in Arkansas, what is the minimum light transmission
    allowed for the rear side windows and the back window?
  choices:
    A: 5%
    B: 10%
    C: 20%
    D: 25%
  answer: B
  explanation: According to Arkansas window tint regulations, the rear side windows
    and the back window must allow at least 10% net light transmission.
- id: 188
  category: vehicle_information
  question: Arkansas law requires that every motor vehicle's foot brake must be able
    to stop the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 45 feet
    D: 50 feet
  answer: B
  explanation: The Arkansas Driver's Manual states that the foot brake must be capable
    of stopping the vehicle within 25 feet when traveling at a speed of 20 mph.
- id: 189
  category: vehicle_information
  question: 'In Arkansas, the light that illuminates the rear license plate must make
    the plate clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Arkansas law requires a white light to illuminate the rear license
    plate so that it is visible and legible from a distance of 50 feet.
- id: 190
  category: vehicle_information
  question: Arkansas law requires that your vehicle's rearview mirror must provide
    a view of the highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Every motor vehicle must be equipped with a mirror so located as to
    reflect to the driver a view of the highway for a distance of at least 200 feet
    to the rear.
- id: 191
  category: vehicle_information
  question: In Arkansas, you must turn on your headlights during what time period?
  choices:
    A: From sunset to sunrise
    B: From 30 minutes after sunset to 30 minutes before sunrise
    C: From 1 hour after sunset to 1 hour before sunrise
    D: Only when it is too dark to see the road
  answer: B
  explanation: Arkansas law requires headlights to be turned on from 30 minutes after
    sunset until 30 minutes before sunrise.
- id: 192
  category: vehicle_information
  question: 'According to Arkansas vehicle equipment laws, a parking brake must be
    able to hold the vehicle:'
  choices:
    A: Only on flat surfaces
    B: On any grade on which it is operated
    C: Only when the engine is running
    D: Only if the vehicle is in 'Park'
  answer: B
  explanation: Arkansas law requires that the parking brake must be adequate to hold
    the vehicle on any grade on which it is operated, under all conditions of loading.
- id: 193
  category: vehicle_information
  question: 'Arkansas law requires all motor vehicles to be equipped with a muffler
    to prevent:'
  choices:
    A: Any visible exhaust
    B: Excessive or unusual noise
    C: Carbon dioxide emissions
    D: Engine overheating
  answer: B
  explanation: Arkansas law requires every motor vehicle to have a muffler in good
    working order to prevent 'excessive or unusual noise' and annoying smoke.
- id: 194
  category: signs_and_signals
  question: In Arkansas, what does a flashing red traffic light signify?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to turn green
    C: The same as a stop sign
    D: Yield to oncoming traffic only
  answer: C
  explanation: According to the Arkansas Driver's Manual, a flashing red light means
    the same as a stop sign. You must come to a complete stop, then proceed when it
    is safe to do so.
- id: 195
  category: signs_and_signals
  question: Under Arkansas law, fines for moving traffic violations are _________
    if the offense is committed in a highway work zone when workers are present.
  choices:
    A: Tripled
    B: Doubled
    C: Reduced by half
    D: Stay the same but add 5 points
  answer: B
  explanation: Arkansas Code § 27-50-408 states that any person who is convicted of
    a moving traffic violation in a highway work zone when workers are present shall
    be fined in an amount double the fine normally assessed.
- id: 196
  category: signs_and_signals
  question: A shared center lane, marked on each side by a solid yellow line and a
    dashed yellow line, is reserved for _________ and can be used by vehicles traveling
    in either direction.
  choices:
    A: Passing slower vehicles
    B: Emergency vehicle parking
    C: Making left turns
    D: High-occupancy vehicles only
  answer: C
  explanation: In Arkansas, shared center lanes are reserved for making left turns
    and can be used by vehicles traveling in either direction. They cannot be used
    for passing.
- id: 197
  category: signs_and_signals
  question: When an Arkansas driver extends their left arm out the window and bends
    it upward at the elbow, what signal are they giving?
  choices:
    A: Left turn
    B: Right turn
    C: Slowing or stopping
    D: Hazard ahead
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out and bent upward at the elbow.
- id: 198
  category: signs_and_signals
  question: What does a round yellow sign with a black 'X' and the letters 'RR' indicate?
  choices:
    A: A road construction zone
    B: A rural road intersection
    C: A railroad crossing ahead
    D: A rest area ahead
  answer: C
  explanation: The round yellow sign with a black 'X' and 'RR' is a circular advance
    warning sign indicating a railroad crossing ahead.
- id: 199
  category: signs_and_signals
  question: 'In Arkansas, a solid white line painted across a lane at an intersection
    is known as a:'
  choices:
    A: Yield line
    B: Crosswalk line
    C: Stop line
    D: Bicycle lane
  answer: C
  explanation: A solid white line across a lane at an intersection is a stop line,
    indicating where you must stop your vehicle for a stop sign or red light.
- id: 200
  category: signs_and_signals
  question: 'A flashing yellow traffic signal at an intersection means:'
  choices:
    A: Stop and wait for a green light
    B: Proceed with caution
    C: Speed up to clear the intersection
    D: Treat it as a four-way stop
  answer: B
  explanation: According to the Arkansas Driver's Manual, a flashing yellow light
    means you should slow down and proceed with caution.
- id: 201
  category: signs_and_signals
  question: Service signs, which provide information on gas, food, or lodging, are
    what color in Arkansas?
  choices:
    A: Green
    B: Brown
    C: Blue
    D: Orange
  answer: C
  explanation: Service signs are blue with white letters or symbols and provide directions
    to facilities like hospitals, gas stations, and hotels.
- id: 202
  category: signs_and_signals
  question: What is the meaning of a lighted red arrow on a traffic signal in Arkansas?
  choices:
    A: You may turn after coming to a complete stop
    B: You must stop and may not turn in the direction of the arrow
    C: The arrow is about to turn green
    D: Yield to pedestrians, then turn
  answer: B
  explanation: A red arrow means you must stop and you cannot turn in the direction
    the arrow is pointing until the light changes to a green arrow or a green light.
- id: 203
  category: signs_and_signals
  question: In Arkansas, what does a diamond-shaped orange sign indicate?
  choices:
    A: General warning of road conditions
    B: School zone ahead
    C: Construction or maintenance zone
    D: Public recreation area
  answer: C
  explanation: Orange is used specifically for construction and maintenance work zone
    signs.
- id: 204
  category: signs_and_signals
  question: 'When entering a roundabout in Arkansas, you must yield the right-of-way
    to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; you have the right-of-way
    D: Only emergency vehicles
  answer: B
  explanation: Arkansas law requires drivers entering a roundabout to yield to traffic
    already circulating within the intersection.
- id: 205
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the roadway mean?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is prohibited in both directions
    D: One-way traffic only
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    vehicles traveling in either direction.
- id: 206
  category: signs_and_signals
  question: 'In Arkansas, a curb painted yellow usually indicates:'
  choices:
    A: A loading zone or other restriction
    B: A fire lane where no parking is allowed
    C: Parking is allowed for any duration
    D: A school bus stop only
  answer: A
  explanation: 'In most Arkansas jurisdictions, a yellow curb indicates a loading
    zone or other parking restrictions. (Note: Red usually indicates a fire zone/no
    parking).'
- id: 207
  category: signs_and_signals
  question: 'When approaching a flashing yellow light at an intersection in Arkansas,
    you should:'
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: Treat it as a four-way stop
  answer: C
  explanation: A flashing yellow light in Arkansas indicates that you should slow
    down and proceed with caution, as you do not need to stop but must stay alert.
- id: 208
  category: signs_and_signals
  question: What is the shape and color of a standard Arkansas school zone sign?
  choices:
    A: Diamond-shaped and orange
    B: Pentagon-shaped and fluorescent yellow-green
    C: Circular and yellow
    D: Rectangular and white
  answer: B
  explanation: School zone signs in Arkansas are pentagon-shaped (five-sided) and
    are typically fluorescent yellow-green in color.
- id: 209
  category: signs_and_signals
  question: Under Arkansas law, when is a driver permitted to turn left on a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: At any intersection if no traffic is coming
    D: Only during emergency situations
  answer: B
  explanation: In Arkansas, you may turn left on a red light only when turning from
    a one-way street onto another one-way street, after coming to a complete stop
    and yielding to traffic and pedestrians.
- id: 210
  category: signs_and_signals
  question: In Arkansas, what is the purpose of a shared center lane marked with solid
    and dashed yellow lines?
  choices:
    A: Passing slower vehicles
    B: Emergency parking only
    C: Making left turns only
    D: High-occupancy vehicles only
  answer: C
  explanation: Shared center lanes are reserved for making left turns and can be used
    by vehicles traveling in either direction, but they cannot be used for passing
    or through travel.
- id: 211
  category: signs_and_signals
  question: If your vehicle's signals are not working, what is the correct hand signal
    for 'slow or stop' in Arkansas?
  choices:
    A: Arm extended straight out the window
    B: Arm bent upward at a 90-degree angle
    C: Arm extended downward with palm facing the rear
    D: Arm waving in a circular motion
  answer: C
  explanation: The standard hand signal for slowing or stopping is the arm extended
    downward with the palm facing toward the rear.
- id: 212
  category: signs_and_signals
  question: In Arkansas, a rectangular sign with black letters on a white background
    is what type of sign?
  choices:
    A: Warning sign
    B: Regulatory sign
    C: Service sign
    D: Guide sign
  answer: B
  explanation: Rectangular signs with black, red, or white backgrounds are regulatory
    signs that inform drivers of laws and regulations, such as speed limits.
- id: 213
  category: signs_and_signals
  question: What is the specific shape of a 'Yield' sign used on Arkansas roads?
  choices:
    A: An equilateral triangle pointing up
    B: An equilateral triangle pointing down
    C: A diamond
    D: An octagon
  answer: B
  explanation: A yield sign is a downward-pointing triangle, usually red and white,
    which instructs drivers to slow down and let other traffic have the right-of-way.
- id: 214
  category: signs_and_signals
  question: What does a flashing yellow arrow mean for a driver in Arkansas?
  choices:
    A: You have the right-of-way to turn left
    B: You must stop and wait for a green arrow
    C: Left turns are allowed, but you must first yield to oncoming traffic and pedestrians
    D: The intersection is closed to left turns
  answer: C
  explanation: A flashing yellow arrow means you may turn in the direction of the
    arrow after yielding to oncoming traffic and pedestrians.
- id: 215
  category: signs_and_signals
  question: 'In Arkansas, fines for moving traffic violations are doubled when:'
  choices:
    A: It is raining or snowing
    B: The violation occurs in a highway work zone when workers are present
    C: The driver is using a cell phone
    D: The violation occurs at night
  answer: B
  explanation: Arkansas law dictates that fines for moving traffic violations are
    doubled if they occur in a designated highway work zone while workers are present.
- id: 216
  category: signs_and_signals
  question: 'Broken white lines on an Arkansas roadway separate lanes of traffic:'
  choices:
    A: Moving in opposite directions
    B: Moving in the same direction
    C: Reserved for bicycles only
    D: Reserved for emergency vehicles
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    You may cross them to change lanes when it is safe to do so.
- id: 217
  category: signs_and_signals
  question: 'When a traffic signal turns from green to steady yellow in Arkansas,
    it means:'
  choices:
    A: Speed up to beat the red light
    B: Stop immediately, even if you are in the intersection
    C: The light is about to turn red and you should stop if it is safe to do so
    D: Oncoming traffic has a green light
  answer: C
  explanation: A steady yellow light warns that the signal is changing to red. You
    should stop if you can do so safely; otherwise, proceed with caution through the
    intersection.
- id: 218
  category: signs_and_signals
  question: 'In Arkansas, blue traffic signs are used to provide information regarding:'
  choices:
    A: Construction and maintenance
    B: State parks and recreation areas
    C: Motorist services such as gas, food, and lodging
    D: Directional guidance to cities
  answer: C
  explanation: Blue signs are service signs that provide information about motorist
    services like hospitals, gas, food, and lodging.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 219
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 220
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 221
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 222
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 223
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 224
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 225
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 226
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 227
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 228
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 229
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 230
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 231
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 232
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 233
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 234
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
