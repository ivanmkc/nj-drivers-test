metadata:
  source: NWT Driver Handbook
  total_questions: 229
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In the Northwest Territories, what is the minimum age required to apply
    for a Class 7 learner's license?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: According to the NWT Driver's Guide, an applicant must be at least
    15 years of age to apply for a Class 7 learner's license.
- id: 2
  category: license_system
  question: A Class 7 learner must be accompanied by a co-driver who has held a valid
    Class 5 license (not probationary) for at least how long?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: The supervising driver for a Class 7 learner must have held a valid
    Class 5 license (or higher) for at least two years.
- id: 3
  category: license_system
  question: Under the NWT Graduated Driver Licensing (GDL) program, Class 7 drivers
    are prohibited from driving during which hours?
  choices:
    A: Midnight to 5:00 AM
    B: 10:00 PM to 6:00 AM
    C: 11:00 PM to 6:00 AM
    D: 9:00 PM to 7:00 AM
  answer: C
  explanation: Class 7 learner drivers in the Northwest Territories are restricted
    from driving between the hours of 11:00 PM and 6:00 AM.
- id: 4
  category: license_system
  question: What is the maximum allowable Blood Alcohol Concentration (BAC) for a
    driver in the NWT Graduated Driver Licensing (GDL) program?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Drivers in the GDL program (both Class 7 and Class 5P) must maintain
    a zero alcohol level while operating a motor vehicle.
- id: 5
  category: license_system
  question: How long must a driver hold a Class 5P (Probationary) license before they
    are eligible for a full Class 5 license?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: A driver must remain in the probationary stage (Class 5P) for a minimum
    of 12 months without any suspensions before graduating to a full Class 5 license.
- id: 6
  category: license_system
  question: In the Northwest Territories, a driver with a GDL license will receive
    a suspension notice after accumulating how many demerit points?
  choices:
    A: 5 points
    B: 7 points
    C: 10 points
    D: 15 points
  answer: B
  explanation: For drivers in the GDL program, a suspension occurs when 7 demerit
    points are accumulated. For fully licensed drivers, the limit is 15 points.
- id: 7
  category: license_system
  question: A fully licensed (non-GDL) driver in the NWT will face a license suspension
    if they accumulate how many demerit points within a two-year period?
  choices:
    A: 7 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: D
  explanation: A fully licensed driver who accumulates 15 or more demerit points within
    a two-year period will have their driving privileges suspended.
- id: 8
  category: license_system
  question: While a Class 7 learner is driving, who is permitted to sit in the front
    passenger seat?
  choices:
    A: Any family member
    B: Only the qualified supervising driver
    C: The supervising driver and one other person
    D: Anyone, as long as the supervisor is in the back seat
  answer: B
  explanation: The only person permitted in the front seat of a vehicle operated by
    a Class 7 learner is the qualified supervising driver.
- id: 9
  category: license_system
  question: If you change your name or address, you must notify the Registrar of Motor
    Vehicles within how many days?
  choices:
    A: 7 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: NWT law requires drivers to notify the Registrar of Motor Vehicles
    of any change to their name or address within 15 days.
- id: 10
  category: license_system
  question: What is the passenger restriction for a driver with a Class 5P (Probationary)
    license?
  choices:
    A: No passengers are allowed
    B: Only one passenger is allowed
    C: Passengers are limited to the number of functioning seat belts in the vehicle
    D: Only immediate family members are allowed
  answer: C
  explanation: Under the GDL program, Class 5P drivers are restricted to carrying
    only as many passengers as there are seat belts in the vehicle.
- id: 11
  category: license_system
  question: Which of the following license classes is required to operate a motorcycle
    in the Northwest Territories?
  choices:
    A: Class 4
    B: Class 5
    C: Class 6
    D: Class 7
  answer: C
  explanation: A Class 6 license is specifically required to operate a motorcycle
    in the Northwest Territories.
- id: 12
  category: license_system
  question: What is the minimum age to obtain a Class 5P (Probationary) license in
    the NWT?
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: A driver must be at least 16 years old and have held a Class 7 license
    for at least 12 months to apply for a Class 5P license.
- id: 13
  category: license_system
  question: If a Class 5P driver has their license suspended, what happens to their
    12-month probationary period?
  choices:
    A: It continues as normal
    B: It is reduced by the length of the suspension
    C: The 12-month period is reset and must be started over
    D: The driver is automatically bumped back to Class 7
  answer: C
  explanation: In the NWT GDL program, if a probationary driver's license is suspended,
    the 12-month probationary period is reset and must be completed again from the
    start after the suspension ends.
- id: 14
  category: license_system
  question: When driving a motor vehicle in the Northwest Territories, you must carry
    which of the following documents?
  choices:
    A: A valid driver's license only
    B: A valid driver's license and vehicle registration
    C: A valid driver's license and insurance certificate
    D: A valid driver's license, vehicle registration, and insurance certificate
  answer: D
  explanation: Drivers must have their valid driver's license, valid vehicle registration,
    and valid insurance certificate in the vehicle at all times while operating it.
- id: 15
  category: license_system
  question: To maintain a Class 1, 2, 3, or 4 commercial license in the Northwest
    Territories, how often must a driver under the age of 45 submit a medical report?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 3 years
    D: Every 5 years
  answer: D
  explanation: In the NWT, drivers with commercial licenses (Classes 1, 2, 3, and
    4) must submit a medical report every 5 years until age 45, every 2 years from
    age 45 to 65, and annually after age 65.
- id: 16
  category: license_system
  question: Which endorsement must be added to an NWT driver's license to legally
    operate a vehicle equipped with air brakes?
  choices:
    A: Endorsement A
    B: Endorsement B
    C: Endorsement S
    D: Endorsement X
  answer: A
  explanation: The 'A' endorsement is required in the Northwest Territories for any
    driver operating a vehicle equipped with air brakes.
- id: 17
  category: license_system
  question: A person who moves to the Northwest Territories and holds a valid driver's
    license from another Canadian province must apply for an NWT license within how
    many days of becoming a resident?
  choices:
    A: 14 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents of the NWT must exchange their out-of-territory driver's
    license for an NWT license within 30 days of establishing residency.
- id: 18
  category: license_system
  question: If your NWT driver's license has been expired for more than ______, you
    must pass both the written and road tests again to be relicensed.
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: If a driver's license has been expired for more than two years, the
    applicant is treated as a new driver and must complete the knowledge and practical
    examinations.
- id: 19
  category: license_system
  question: To apply for a Class 6 (Motorcycle) learner's permit in the NWT, an applicant
    must already hold at least which class of license?
  choices:
    A: Class 1
    B: Class 5P
    C: Class 7
    D: No prior license is required
  answer: C
  explanation: To obtain a Class 6 learner's permit, you must be at least 15 years
    old and already hold a valid Class 7 (Learner) license or higher.
- id: 20
  category: license_system
  question: What is the minimum age requirement to apply for a Class 1, 2, 3, or 4
    driver's license in the Northwest Territories?
  choices:
    A: 16 years
    B: 18 years
    C: 19 years
    D: 21 years
  answer: B
  explanation: While a person can get a learner's permit at 15, they must be at least
    18 years old to apply for any professional/commercial class license (Classes 1
    through 4).
- id: 21
  category: license_system
  question: A visitor to the Northwest Territories may drive a motor vehicle using
    their valid out-of-territory license for a maximum period of how many months?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 12 months
  answer: B
  explanation: Visitors to the NWT are permitted to drive for up to three months using
    a valid license from another jurisdiction.
- id: 22
  category: license_system
  question: To exit the Graduated Driver Licensing (GDL) program and obtain a full
    Class 5 license, a Class 5P driver must be suspension-free for at least how long?
  choices:
    A: The last 6 months of the probationary period
    B: The last 12 months of the probationary period
    C: The entire 2-year GDL period
    D: 3 months
  answer: B
  explanation: To graduate to a full Class 5 license, the driver must have completed
    the 12-month probationary (5P) stage without any license suspensions.
- id: 23
  category: license_system
  question: 'If a driver''s license is suspended due to a first-time accumulation
    of demerit points, the suspension period is typically:'
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: A first-time suspension for reaching the demerit point limit (6 for
    GDL, 15 for full) in the NWT results in a 30-day (one month) license suspension.
- id: 24
  category: license_system
  question: Which license class is required to operate a bus with a seating capacity
    of more than 24 passengers?
  choices:
    A: Class 2
    B: Class 3
    C: Class 4
    D: Class 5
  answer: A
  explanation: A Class 2 license is required to operate any bus with a seating capacity
    of more than 24 passengers (including the driver).
- id: 25
  category: license_system
  question: When applying for an NWT driver's license, which of the following must
    be proven by the applicant?
  choices:
    A: Legal name and date of birth
    B: Northwest Territories residency
    C: Right to be in Canada
    D: All of the above
  answer: D
  explanation: Applicants must provide documentation proving their legal name, date
    of birth, NWT residency, and their legal right to be in Canada.
- id: 26
  category: license_system
  question: What is the minimum vision standard required to obtain a Class 5 license
    in the Northwest Territories?
  choices:
    A: 20/20 in both eyes
    B: 20/40 in the better eye
    C: 20/60 in both eyes
    D: 20/100 in one eye
  answer: B
  explanation: The minimum vision requirement for a Class 5 license in the NWT is
    a visual acuity of 20/40 in the better eye, with or without corrective lenses.
- id: 27
  category: license_system
  question: If you are a co-driver (supervisor) for a Class 7 learner, what is the
    maximum Blood Alcohol Concentration (BAC) you are permitted to have?
  choices:
    A: '0.00'
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: C
  explanation: In the NWT, the person supervising a learner driver (the co-driver)
    must have a BAC of less than 0.05.
- id: 28
  category: license_system
  question: Which license class allows the holder to operate a vehicle with 3 or more
    axles, such as a dump truck, but NOT a semi-trailer truck?
  choices:
    A: Class 1
    B: Class 2
    C: Class 3
    D: Class 4
  answer: C
  explanation: A Class 3 license allows for the operation of a single vehicle with
    3 or more axles, or a 3-axle vehicle towing a trailer not equipped with air brakes.
- id: 29
  category: driver_testing
  question: To meet the vision standards for a driver's license in the Northwest Territories,
    an applicant must have a minimum visual acuity of what in their better eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to NWT driver licensing standards, an applicant must have
    a minimum visual acuity of 20/40 in at least one eye, with or without corrective
    lenses.
- id: 30
  category: driver_testing
  question: If you fail your initial road test in the Northwest Territories, what
    is the minimum waiting period before you are eligible to attempt the test again?
  choices:
    A: 24 hours
    B: 7 days
    C: 14 days
    D: 30 days
  answer: C
  explanation: In the Northwest Territories, if an applicant fails a road test, they
    must wait a minimum of 14 days before they can retake the examination.
- id: 31
  category: driver_testing
  question: During a road test in the NWT, which of the following will result in an
    immediate automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: An action that requires the examiner to take control of the vehicle to avoid
      a collision
    C: Driving 2 km/h under the speed limit
    D: Adjusting the mirrors while stopped at a red light
  answer: B
  explanation: Any dangerous action, traffic law violation, or instance where the
    examiner must intervene to prevent an accident results in an immediate failure
    of the road test.
- id: 32
  category: driver_testing
  question: In the Northwest Territories, how many demerit points are assigned to
    your driving record for exceeding the speed limit by 1 to 15 km/h?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: The NWT demerit point system assigns 2 points for speeding 1 to 15
    km/h over the posted limit.
- id: 33
  category: driver_testing
  question: What is the minimum amount of Third Party Liability insurance coverage
    required for a motor vehicle registered in the Northwest Territories?
  choices:
    A: $50,000
    B: $100,000
    C: $200,000
    D: $500,000
  answer: C
  explanation: The Motor Vehicles Act of the Northwest Territories requires all registered
    vehicles to carry a minimum of $200,000 in Third Party Liability insurance.
- id: 34
  category: driver_testing
  question: Unless otherwise posted, what is the maximum speed limit on a primary
    highway outside of a municipality in the Northwest Territories?
  choices:
    A: 70 km/h
    B: 80 km/h
    C: 90 km/h
    D: 100 km/h
  answer: B
  explanation: In the NWT, the default speed limit for highways outside of municipal
    boundaries is 80 km/h unless signs indicate otherwise.
- id: 35
  category: driver_testing
  question: 'In the Northwest Territories, you must report a motor vehicle accident
    to the police immediately if the total property damage appears to exceed:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Under NWT law, accidents involving injury, death, or property damage
    exceeding $2,000 must be reported to the nearest police service.
- id: 36
  category: driver_testing
  question: How many demerit points are recorded against your NWT driver's license
    for failing to remain at the scene of an accident?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 9 points
  answer: C
  explanation: Failing to remain at the scene of an accident is a serious offense
    in the NWT and carries a penalty of 7 demerit points.
- id: 37
  category: driver_testing
  question: What is the passing score for the Class 7 written knowledge test in the
    Northwest Territories?
  choices:
    A: 70% (14 out of 20)
    B: 75% (15 out of 20)
    C: 80% (16 out of 20)
    D: 90% (18 out of 20)
  answer: C
  explanation: To pass the NWT written knowledge test, an applicant must correctly
    answer at least 16 out of 20 questions (80%).
- id: 38
  category: driver_testing
  question: In the Northwest Territories, a fully licensed driver found with a Blood
    Alcohol Concentration (BAC) between 0.05 and 0.08 will face an immediate roadside
    license suspension of how long for a first offense?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: A
  explanation: Fully licensed drivers in the 'warn' range (0.05 to 0.08 BAC) are subject
    to an immediate 24-hour license suspension for a first occurrence.
- id: 39
  category: driver_testing
  question: When taking a road test in an NWT municipality, what is the speed limit
    in a school zone when children are present or during school hours?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: The standard speed limit for school zones in the Northwest Territories
    is 30 km/h unless otherwise posted.
- id: 40
  category: driver_testing
  question: How many demerit points are assigned for failing to stop for a school
    bus that has its red lights flashing and stop arm extended?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failing to stop for a school bus with flashing red lights is a major
    safety violation in the NWT and results in 6 demerit points.
- id: 41
  category: driver_testing
  question: In the NWT, if you are convicted of driving while using a handheld electronic
    device (distracted driving), how many demerit points are added to your record?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Distracted driving, such as using a handheld cell phone while operating
    a vehicle, carries a penalty of 3 demerit points in the Northwest Territories.
- id: 42
  category: driver_testing
  question: Before beginning a road test in the NWT, the examiner will perform a vehicle
    safety check. Which of the following would cause the test to be cancelled?
  choices:
    A: The vehicle has a small crack in the windshield that does not obstruct vision
    B: The vehicle is not washed
    C: The brake lights are not functioning
    D: The fuel tank is only half full
  answer: C
  explanation: For a road test to proceed, the vehicle must be in safe mechanical
    condition. Non-functioning brake lights are a safety violation that will result
    in the cancellation of the test.
- id: 43
  category: driver_testing
  question: To pass the vision test for a standard Class 5 license in the Northwest
    Territories, what is the minimum required visual acuity in your better eye (with
    or without corrective lenses)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to NWT driver licensing standards, an applicant must have
    a minimum visual acuity of 20/40 in the better eye to qualify for a driver's license.
- id: 44
  category: driver_testing
  question: Unless otherwise posted, what is the maximum speed limit in a school zone
    within the Northwest Territories when children are present?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: The standard speed limit in school zones in the Northwest Territories
    is 30 km/h, unless signs indicate otherwise.
- id: 45
  category: driver_testing
  question: How many demerit points are recorded against your NWT driving record for
    a conviction of 'Failing to stop for a school bus'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failing to stop for a school bus with its red lights flashing is a
    serious offense in the NWT and carries a penalty of 4 demerit points.
- id: 46
  category: driver_testing
  question: In the Northwest Territories, what is the minimum amount of third-party
    liability insurance coverage required by law?
  choices:
    A: $100,000
    B: $200,000
    C: $500,000
    D: $1,000,000
  answer: B
  explanation: The Motor Vehicles Act of the NWT requires all vehicles to carry a
    minimum of $200,000 in third-party liability insurance.
- id: 47
  category: driver_testing
  question: Between which dates are studded tires permitted for use on vehicles in
    the Northwest Territories?
  choices:
    A: October 1 to April 30
    B: September 1 to May 31
    C: November 1 to March 31
    D: September 15 to June 15
  answer: B
  explanation: In the NWT, studded tires are legally allowed on highways from September
    1st to May 31st inclusive.
- id: 48
  category: driver_testing
  question: When driving on NWT highways outside of a municipality, what is the law
    regarding headlight use?
  choices:
    A: Headlights must be on only between sunset and sunrise.
    B: Headlights must be on only during periods of poor visibility.
    C: Low beam headlights must be turned on at all times.
    D: Headlights are only required if the vehicle is not equipped with DRLs.
  answer: C
  explanation: In the Northwest Territories, drivers are required to have their low
    beam headlights turned on at all times when driving on highways.
- id: 49
  category: driver_testing
  question: 'In the Northwest Territories, a U-turn is prohibited on a curve or near
    the crest of a hill where the driver cannot be seen by other traffic within:'
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: NWT traffic laws prohibit U-turns on curves or hills where there is
    less than 150 meters of clear visibility in both directions.
- id: 50
  category: driver_testing
  question: When parking a vehicle on a public road in the NWT, you must not park
    within how many meters of a fire hydrant?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 10 meters
  answer: C
  explanation: It is illegal to park a vehicle within 5 meters of a fire hydrant in
    the Northwest Territories.
- id: 51
  category: driver_testing
  question: How many demerit points are assigned to a driver's record for a conviction
    of 'Careless Driving' in the Northwest Territories?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: Careless driving is a major offense in the NWT and results in 6 demerit
    points being added to the driver's record.
- id: 52
  category: driver_testing
  question: When approaching a steady yellow light at an intersection in the NWT,
    what must a driver do?
  choices:
    A: Speed up to clear the intersection before it turns red.
    B: Stop before entering the intersection unless the stop cannot be made in safety.
    C: Stop immediately, even if in the middle of the intersection.
    D: Proceed through as if it were a green light.
  answer: B
  explanation: A yellow light means the signal is about to turn red. Drivers must
    stop before the intersection unless they are already in it or cannot stop safely.
- id: 53
  category: driver_responsibility
  question: In the Northwest Territories, who is legally responsible for ensuring
    that a passenger under the age of 16 is properly wearing a seatbelt?
  choices:
    A: The passenger
    B: The driver of the vehicle
    C: The owner of the vehicle
    D: The passenger's parents, even if they are not in the vehicle
  answer: B
  explanation: The driver is responsible for ensuring that all passengers under the
    age of 16 are properly secured by a seatbelt or an appropriate child restraint
    system.
- id: 54
  category: driver_responsibility
  question: When you sell a vehicle in the Northwest Territories, what should you
    do with the license plates?
  choices:
    A: Leave them on the vehicle for the new owner
    B: Return them to the nearest RCMP detachment
    C: Remove them and keep them for your own future use or return them to an issuing
      office
    D: Give them to the new owner to be destroyed
  answer: C
  explanation: In the NWT, license plates are issued to the owner, not the vehicle.
    When a vehicle is sold, the seller must remove the plates.
- id: 55
  category: driver_responsibility
  question: What is the consequence for an NWT driver who is caught operating a motor
    vehicle without valid insurance?
  choices:
    A: A verbal warning for the first offense
    B: A mandatory 24-hour impoundment only
    C: A heavy fine and a mandatory license suspension
    D: There is no penalty if insurance is purchased within 48 hours
  answer: C
  explanation: Operating an uninsured vehicle is a serious offense in the NWT, carrying
    significant fines and a mandatory suspension of driving privileges.
- id: 56
  category: driver_responsibility
  question: If you are involved in an accident where someone is injured, what is your
    first legal responsibility?
  choices:
    A: Drive to the nearest police station to report it
    B: Remain at the scene and render all reasonable assistance
    C: Call your insurance agent immediately
    D: Move the vehicles off the road before checking for injuries
  answer: B
  explanation: Under the NWT Motor Vehicles Act, drivers involved in an accident must
    remain at the scene, provide their information, and render all reasonable assistance
    to any person injured.
- id: 57
  category: driver_responsibility
  question: In the NWT, vehicle registration expires annually. How is the expiry date
    determined for individuals?
  choices:
    A: On the owner's birthday
    B: On December 31st of every year
    C: Based on the first letter of the owner's last name
    D: Exactly one year from the date the vehicle was purchased
  answer: C
  explanation: The Northwest Territories uses a staggered registration system where
    the expiry month is determined by the first letter of the owner's surname.
- id: 58
  category: driver_responsibility
  question: If an NWT driver fails to pay a court-ordered judgment for damages resulting
    from a motor vehicle accident, what action will the Registrar take?
  choices:
    A: Increase the driver's insurance premiums
    B: Suspend the driver's license until the judgment is satisfied
    C: Seize the driver's vehicle permanently
    D: Issue a 30-day warning notice
  answer: B
  explanation: The Registrar of Motor Vehicles has the authority to suspend the license
    of any driver who fails to satisfy a judgment for damages arising from a motor
    vehicle accident.
- id: 59
  category: driver_responsibility
  question: 'If a peace officer determines that a vehicle is in such a dangerous condition
    that it may cause an accident, they have the authority to:'
  choices:
    A: Issue a warning and allow the driver to continue for 48 hours
    B: Order the vehicle to be removed from the highway immediately
    C: Fine the driver $50 and let them go
    D: Only the owner can decide if the vehicle is too dangerous to drive
  answer: B
  explanation: Peace officers in the NWT have the authority to order unsafe vehicles
    off the road to ensure public safety.
- id: 60
  category: driver_responsibility
  question: Which of the following is a requirement for a vehicle to be legally operated
    on NWT highways?
  choices:
    A: The vehicle must have a fire extinguisher
    B: The vehicle must be registered and display valid license plates
    C: The driver must have a copy of the vehicle's bill of sale at all times
    D: The vehicle must have a GPS tracking device
  answer: B
  explanation: All motor vehicles on NWT highways must be registered with the Department
    of Infrastructure and must display valid license plates.
- id: 61
  category: driver_responsibility
  question: 'In the NWT, if you are convicted of driving while your license is suspended,
    the minimum additional suspension period is usually:'
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Driving while suspended is a serious violation. In addition to fines,
    it typically results in a further 6-month suspension of driving privileges.
- id: 62
  category: driver_responsibility
  question: What happens to the demerit points on your NWT driving record after two
    years from the date of the conviction?
  choices:
    A: They remain on your record forever
    B: They are reduced by half
    C: They are removed from your record
    D: They double in value
  answer: C
  explanation: In the Northwest Territories, demerit points are removed from your
    driving record two years after the date of the conviction.
- id: 63
  category: driver_responsibility
  question: Under the Northwest Territories demerit point system, how many points
    are assigned for 'Failing to remain at the scene of an accident'?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 9 points
  answer: C
  explanation: Failing to remain at the scene of an accident is a serious offense
    in the NWT and results in 7 demerit points being added to the driver's record.
- id: 64
  category: driver_responsibility
  question: In the NWT, the driver of a vehicle is legally responsible for ensuring
    that all passengers under what age are properly restrained by seatbelts or child
    safety seats?
  choices:
    A: Under 12 years of age
    B: Under 14 years of age
    C: Under 16 years of age
    D: Under 18 years of age
  answer: C
  explanation: The driver is responsible for ensuring that all passengers under the
    age of 16 are properly secured in the vehicle.
- id: 65
  category: driver_responsibility
  question: 'If a driver is caught operating a vehicle while their NWT driver''s license
    is suspended, the vehicle will be impounded for a period of:'
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: Under the NWT Motor Vehicles Act, driving while suspended leads to
    an automatic 30-day vehicle impoundment, regardless of whether the driver owns
    the vehicle.
- id: 66
  category: driver_responsibility
  question: What is the maximum fine for a first-time offense of operating a motor
    vehicle without valid insurance in the Northwest Territories?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: C
  explanation: Operating an uninsured vehicle is a serious offense in the NWT, carrying
    a fine of up to $2,500 for a first offense, plus a victim fine surcharge.
- id: 67
  category: driver_responsibility
  question: When you purchase a vehicle in the Northwest Territories, you must notify
    the Registrar and register the transfer of ownership within how many days?
  choices:
    A: 24 hours
    B: 7 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: The NWT Motor Vehicles Act requires that a transfer of vehicle ownership
    be registered with the Registrar of Motor Vehicles within 7 days of the transaction.
- id: 68
  category: driver_responsibility
  question: In the Northwest Territories, if a court judgment is issued against you
    for damages resulting from a motor vehicle accident and you fail to pay it, what
    happens?
  choices:
    A: Your vehicle is sold at auction
    B: Your driver's license and vehicle registration are suspended
    C: You are required to retake your driving test
    D: Nothing happens until you renew your license
  answer: B
  explanation: The Registrar has the authority to suspend the driver's license and
    vehicle registration of any person who fails to satisfy a judgment for damages
    caused by a motor vehicle.
- id: 69
  category: driver_responsibility
  question: Where must the certificate of registration for a motor vehicle be kept
    while the vehicle is being operated in the NWT?
  choices:
    A: In the vehicle
    B: At the owner's residence
    C: At the owner's place of business
    D: In the owner's wallet
  answer: A
  explanation: The certificate of registration (or a copy) must be carried in the
    vehicle at all times while it is being operated on a highway.
- id: 70
  category: driver_responsibility
  question: 'When a peace officer requests proof of financial responsibility (insurance),
    the driver must:'
  choices:
    A: Provide it within 48 hours
    B: Provide it within 7 days
    C: Produce it immediately
    D: Mail it to the police station
  answer: C
  explanation: Drivers in the NWT must be able to produce a valid insurance card immediately
    upon the request of a peace officer.
- id: 71
  category: driver_responsibility
  question: 'It is the driver''s responsibility to ensure that the vehicle''s windows
    are clear of snow and ice. Failure to do so can result in a fine for:'
  choices:
    A: Stunting
    B: Operating a vehicle with an obstructed view
    C: Insecure load
    D: Distracted driving
  answer: B
  explanation: The NWT Motor Vehicles Act requires that a driver have a clear view
    to the front, sides, and rear. Driving with snow or ice obstructing the windows
    is a safety violation.
- id: 72
  category: safe_driving_rules
  question: In the Northwest Territories, what is the speed limit within a municipality
    unless otherwise posted?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: According to the NWT Driver's Basic Handbook, the standard speed limit
    within a municipality is 50 km/h unless signs indicate a different limit.
- id: 73
  category: safe_driving_rules
  question: When parking your vehicle in the Northwest Territories, what is the minimum
    distance you must maintain from a fire hydrant?
  choices:
    A: 2 metres
    B: 3 metres
    C: 5 metres
    D: 10 metres
  answer: C
  explanation: NWT driving regulations state that you must not park a vehicle within
    5 metres of a fire hydrant.
- id: 74
  category: safe_driving_rules
  question: Under NWT law, a U-turn is prohibited on a curve or near the crest of
    a hill if the driver cannot see clearly for at least how many metres in both directions?
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: The NWT Driver's Basic Handbook specifies that U-turns are illegal
    where visibility is obstructed within 150 metres in either direction.
- id: 75
  category: safe_driving_rules
  question: What is the recommended following distance behind another vehicle under
    normal driving conditions in the Northwest Territories?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 1 car length for every 10 km/h
  answer: B
  explanation: The NWT handbook recommends a minimum following distance of at least
    2 seconds behind the vehicle in front of you under ideal conditions.
- id: 76
  category: safe_driving_rules
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended, how far away must you stop your vehicle?
  choices:
    A: 3 metres
    B: 5 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: In the Northwest Territories, you must stop your vehicle no closer
    than 5 metres from the front or back of a school bus when its red lights are flashing.
- id: 77
  category: safe_driving_rules
  question: When driving in a city or town in the NWT, how far in advance must you
    signal before making a turn?
  choices:
    A: 15 metres
    B: 30 metres
    C: 50 metres
    D: 100 metres
  answer: B
  explanation: In urban areas (cities or towns), you are required to signal at least
    30 metres before turning. In rural areas, this distance increases to 150 metres.
- id: 78
  category: safe_driving_rules
  question: In the Northwest Territories, it is illegal to park your vehicle within
    how many metres of a stop sign or a crosswalk?
  choices:
    A: 3 metres
    B: 5 metres
    C: 8 metres
    D: 10 metres
  answer: B
  explanation: The NWT Driver's Basic Handbook states that you must not park within
    5 metres of a stop sign, a yield sign, or a crosswalk.
- id: 79
  category: safe_driving_rules
  question: When an emergency vehicle (ambulance, fire truck, or police car) approaches
    you from any direction with its siren or lights flashing, what must you do?
  choices:
    A: Speed up to get out of the way
    B: Stop immediately exactly where you are
    C: Move to the right edge of the road and stop
    D: Move to the left edge of the road and stop
  answer: C
  explanation: Drivers must immediately drive to the right-hand curb or edge of the
    road, clear of any intersection, and stop until the emergency vehicle has passed.
- id: 80
  category: safe_driving_rules
  question: 'According to the NWT ''Move Over'' law, when passing a stopped emergency
    vehicle with flashing lights on a highway with a speed limit of 100 km/h, you
    must slow down to at least:'
  choices:
    A: 80 km/h
    B: 70 km/h
    C: 60 km/h
    D: 50 km/h
  answer: C
  explanation: In the NWT, if the posted speed limit is 60 km/h or higher, you must
    slow to 60 km/h when passing stopped emergency vehicles with flashing lights.
    If the limit is under 60 km/h, you must slow to the posted limit.
- id: 81
  category: safe_driving_rules
  question: When stopping at a railway crossing in the Northwest Territories, what
    is the minimum distance you should stop from the nearest rail?
  choices:
    A: 2 metres
    B: 5 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: Drivers must stop no closer than 5 metres and no further than 15 metres
    from the nearest rail at a railway crossing.
- id: 82
  category: safe_driving_rules
  question: When parking a vehicle facing uphill on a two-way road with a curb, how
    should the front wheels be turned?
  choices:
    A: To the right (toward the curb)
    B: To the left (toward the center of the road)
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn the wheels to the left so that
    if the vehicle rolls, the back of the front tire will hit the curb and stop the
    car.
- id: 83
  category: safe_driving_rules
  question: 'In the Northwest Territories, you must turn on your headlights whenever
    visibility is reduced to less than:'
  choices:
    A: 100 metres
    B: 150 metres
    C: 200 metres
    D: 300 metres
  answer: B
  explanation: The NWT Driver's Basic Handbook requires the use of headlights whenever
    you cannot see clearly for a distance of 150 metres.
- id: 84
  category: safe_driving_rules
  question: In the Northwest Territories, how far away from a fire hydrant must you
    park?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 10 meters
  answer: B
  explanation: Under NWT regulations, you are prohibited from parking within 3 meters
    of a fire hydrant.
- id: 85
  category: safe_driving_rules
  question: When approaching a school bus from either direction on an undivided highway
    with its red lights flashing, how far from the bus must you stop?
  choices:
    A: 3 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: In the NWT, drivers must stop at least 5 meters from a school bus when
    its red lights are flashing and the stop arm is extended.
- id: 86
  category: safe_driving_rules
  question: When turning in a city or town, how far in advance should you signal your
    intention to turn?
  choices:
    A: 15 meters
    B: 30 meters
    C: 50 meters
    D: 100 meters
  answer: B
  explanation: The NWT Driver's Guide specifies that you should signal at least 30
    meters before making a turn in urban areas.
- id: 87
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when following another
    vehicle under normal conditions in the NWT?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: One car length for every 10 km/h
  answer: B
  explanation: The NWT uses the 'two-second rule' as the minimum safe following distance
    under ideal driving conditions.
- id: 88
  category: safe_driving_rules
  question: You are prohibited from parking within how many meters of a stop sign
    or yield sign?
  choices:
    A: 3 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: In the Northwest Territories, you must not park within 5 meters of
    a stop sign, yield sign, or a marked crosswalk.
- id: 89
  category: safe_driving_rules
  question: When driving at night, you must dim your high beam headlights when an
    oncoming vehicle is within what distance?
  choices:
    A: 150 meters
    B: 200 meters
    C: 300 meters
    D: 500 meters
  answer: C
  explanation: NWT law requires drivers to switch to low beams when an oncoming vehicle
    is within 300 meters to avoid blinding the other driver.
- id: 90
  category: safe_driving_rules
  question: When following another vehicle at night, at what distance must you dim
    your high beam headlights?
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 300 meters
  answer: C
  explanation: You must dim your high beams to low beams when following another vehicle
    within 150 meters.
- id: 91
  category: safe_driving_rules
  question: When parking a vehicle facing uphill on a street with a curb, which way
    should you turn your front wheels?
  choices:
    A: To the right (toward the curb)
    B: To the left (away from the curb)
    C: Keep them straight
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn the wheels to the left so that
    if the vehicle rolls, the back of the front tire will hit the curb and stop the
    car.
- id: 92
  category: safe_driving_rules
  question: U-turns are prohibited in the Northwest Territories in which of the following
    locations?
  choices:
    A: On a curve
    B: Near the crest of a hill where visibility is less than 150 meters
    C: Where a sign prohibits it
    D: All of the above
  answer: D
  explanation: U-turns are illegal on curves, near hillcrests with limited visibility,
    and anywhere signs prohibit the maneuver.
- id: 93
  category: safe_driving_rules
  question: When passing a bicycle, what is the recommended minimum distance you should
    maintain between your vehicle and the cyclist?
  choices:
    A: 0.5 meters
    B: 1 meter
    C: 2 meters
    D: 3 meters
  answer: B
  explanation: The NWT Driver's Guide recommends giving cyclists at least 1 meter
    of space when passing.
- id: 94
  category: safe_driving_rules
  question: In the Northwest Territories, you are not allowed to pass another vehicle
    within how many meters of a railway crossing?
  choices:
    A: 15 meters
    B: 30 meters
    C: 50 meters
    D: 100 meters
  answer: B
  explanation: Passing is prohibited within 30 meters of a railway crossing in the
    Northwest Territories.
- id: 95
  category: safe_driving_rules
  question: 'When an emergency vehicle with sirens and flashing lights is approaching
    from either direction on a two-way road, you must:'
  choices:
    A: Speed up to get out of the way
    B: Stop exactly where you are
    C: Pull to the right edge of the roadway and stop
    D: Pull to the left edge of the roadway and stop
  answer: C
  explanation: Drivers must immediately pull to the right-hand curb or edge of the
    road and stop until the emergency vehicle has passed.
- id: 96
  category: defensive_driving
  question: To practice proper scanning, the NWT Driver's Handbook suggests drivers
    should look how far ahead of their vehicle?
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 12 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Expert drivers scan the road 12 to 15 seconds ahead of their vehicle
    to anticipate hazards and prepare for changes in traffic.
- id: 97
  category: defensive_driving
  question: In the Northwest Territories, 'ice fog' is a common winter hazard. What
    is the safest way to drive through it?
  choices:
    A: Turn on high beam headlights to see further
    B: Use low beam headlights and reduce speed
    C: Maintain speed but honk your horn frequently
    D: Drive with only your parking lights on
  answer: B
  explanation: Ice fog reflects light back at the driver; high beams make visibility
    worse. You should use low beams, reduce speed, and watch for taillights ahead.
- id: 98
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet road, what should you do?
  choices:
    A: Brake hard to regain traction
    B: Accelerate to move through the water faster
    C: Ease off the gas pedal and steer in the direction you want to go
    D: Turn the steering wheel sharply to the left
  answer: C
  explanation: If hydroplaning, do not brake. Ease off the accelerator to slow down
    until the tires regain contact with the road, and keep the steering wheel straight
    or steer gently in the desired direction.
- id: 99
  category: defensive_driving
  question: When driving on gravel roads common in the NWT, why should you increase
    your following distance beyond the standard two seconds?
  choices:
    A: To avoid dust clouds that reduce visibility
    B: To prevent windshield damage from flying stones
    C: Because stopping distances are longer on gravel
    D: All of the above
  answer: D
  explanation: Gravel roads offer less traction, create dust that obscures vision,
    and present a risk of flying stones. Increasing following distance addresses all
    these hazards.
- id: 100
  category: defensive_driving
  question: In the NWT, if you encounter a Wood Bison on the highway, what is the
    safest defensive driving action?
  choices:
    A: Honk your horn loudly to scare it away
    B: Slow down or stop, and wait for the animal to move off the road
    C: Flash your high beams and drive around it quickly
    D: Get out of the car to direct the animal off the road
  answer: B
  explanation: Bison are large, unpredictable, and common on NWT highways. Drivers
    should slow down, be patient, and give them plenty of space to move off the road
    on their own.
- id: 101
  category: defensive_driving
  question: When driving in winter conditions, what is 'black ice'?
  choices:
    A: Ice mixed with dirt from the road
    B: A thin, transparent layer of ice that looks like a wet road
    C: Ice that only forms at night
    D: Snow that has been packed down by tires
  answer: B
  explanation: Black ice is a thin, nearly invisible layer of ice that forms on the
    road surface, often appearing as a harmless wet patch. It is extremely slippery.
- id: 102
  category: defensive_driving
  question: 'If you are driving a vehicle without Anti-lock Brakes (ABS) and need
    to stop quickly on a slippery road, you should:'
  choices:
    A: Lock the brakes and hold them until you stop
    B: Use 'threshold braking' (apply firm, steady pressure just short of locking)
    C: Shift the vehicle into neutral and use the emergency brake
    D: Pump the brakes as fast as possible
  answer: B
  explanation: For vehicles without ABS, threshold braking is the most effective way
    to stop quickly on slippery surfaces without losing steering control.
- id: 103
  category: defensive_driving
  question: When a large truck is turning right at an intersection, what should a
    defensive driver be aware of?
  choices:
    A: The truck will always stay in the right-most lane
    B: The truck may need to swing wide to the left to clear the curb
    C: The truck can stop much faster than a car
    D: The truck has no blind spots on the right side
  answer: B
  explanation: Large vehicles have a wide turning radius and may need to move into
    the left lane to complete a right turn. Never try to pass a truck on the right
    at an intersection.
- id: 104
  category: defensive_driving
  question: What is the 'blind spot' of a vehicle?
  choices:
    A: The area directly in front of the hood
    B: The area to the left and right rear of the vehicle not visible in mirrors
    C: The area blocked by the rearview mirror
    D: The area visible only when using high beams
  answer: B
  explanation: Blind spots are areas around your vehicle that you cannot see in your
    mirrors. You must turn your head to check these areas before changing lanes.
- id: 105
  category: defensive_driving
  question: In the NWT, when are you required by law to have your headlights turned
    on?
  choices:
    A: Only between 11:00 PM and 5:00 AM
    B: From one-half hour after sunset to one-half hour before sunrise
    C: Only when it is snowing or raining
    D: Only when driving on unpaved highways
  answer: B
  explanation: Headlights must be used from one-half hour after sunset to one-half
    hour before sunrise, and any other time visibility is reduced to less than 150
    metres.
- id: 106
  category: defensive_driving
  question: When driving on a two-lane highway in the NWT and being passed by another
    vehicle, what should you do?
  choices:
    A: Speed up to prevent them from passing
    B: Move to the left to see oncoming traffic better
    C: Stay in your lane and maintain or slightly reduce your speed
    D: Turn on your high beams to help the other driver see
  answer: C
  explanation: When being passed, you should help the other driver by maintaining
    a steady speed and staying in your lane. If the pass is difficult, slightly reducing
    speed can help the driver return to the lane safely.
- id: 107
  category: defensive_driving
  question: Why is the road surface most slippery during the first few minutes of
    a rainfall?
  choices:
    A: The water cools the tires, reducing grip
    B: Rain mixes with oil and grease on the road to create a slippery film
    C: The rain creates a vacuum between the tire and the road
    D: The road surface expands when it gets wet
  answer: B
  explanation: At the beginning of a rainstorm, the water mixes with oil, dust, and
    rubber deposits on the road surface, creating a very slick emulsion before it
    is washed away.
- id: 108
  category: defensive_driving
  question: When driving on NWT highways, how far ahead should you scan the road to
    identify potential hazards?
  explanation: Expert drivers scan the road 12 to 15 seconds ahead to anticipate problems
    before they become emergencies.
  choices:
    A: 5 seconds
    B: 8 seconds
    C: 12 to 15 seconds
    D: 30 seconds
  answer: C
- id: 109
  category: defensive_driving
  question: If you encounter 'black ice' while driving on an NWT highway, what is
    the safest action to take?
  choices:
    A: Brake hard immediately
    B: Accelerate to gain traction
    C: Ease off the accelerator and steer in the direction you want to go
    D: Shift the vehicle into neutral and pump the brakes rapidly
  answer: C
  explanation: On black ice, you should avoid sudden braking or steering. Ease off
    the gas and steer calmly in the desired direction of travel.
- id: 110
  category: defensive_driving
  question: When driving on gravel roads, which are common in the NWT, what is a primary
    safety concern regarding following distance?
  choices:
    A: Gravel provides better traction than asphalt
    B: Dust clouds can severely reduce visibility and stones can crack windshields
    C: Tires stay cooler on gravel, allowing for higher speeds
    D: There are no speed limits on gravel roads
  answer: B
  explanation: On gravel roads, you should increase following distance because of
    reduced traction, dust that obscures vision, and the risk of flying stones.
- id: 111
  category: defensive_driving
  question: In the Northwest Territories, if you see a bison or moose on or near the
    road, what is the safest defensive driving practice?
  choices:
    A: Honk your horn loudly to scare it away
    B: Flash your high beams repeatedly
    C: Slow down or stop, as wildlife behavior is unpredictable
    D: Speed up to pass the animal before it moves onto the road
  answer: C
  explanation: Wildlife like bison and moose are common in the NWT. You should slow
    down or stop and wait for them to clear the area, as they may suddenly bolt into
    your path.
- id: 112
  category: defensive_driving
  question: When driving in heavy fog in the NWT, which lights should you use?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: No lights are necessary during the day
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the fog particles,
    creating a 'white wall' effect that reduces visibility further.
- id: 113
  category: defensive_driving
  question: During NWT winters, when the temperature is near freezing (0°C), why can
    roads be more dangerous than at -30°C?
  choices:
    A: Tires melt at 0°C
    B: Ice is more slippery at temperatures near the freezing point
    C: Visibility is always worse at 0°C
    D: Brakes do not work at 0°C
  answer: B
  explanation: Ice is most slippery when it is melting or near the freezing point
    (0°C) because a thin layer of water forms on top of the ice.
- id: 114
  category: defensive_driving
  question: If an oncoming vehicle's high beams are blinding you at night, where should
    you look to maintain your lane?
  choices:
    A: Directly at the oncoming headlights
    B: At the center line of the road
    C: To the right edge of the road or the white shoulder line
    D: Close your eyes momentarily
  answer: C
  explanation: To avoid being blinded by oncoming glare, guide your vehicle by looking
    toward the right edge of the roadway until the vehicle has passed.
- id: 115
  category: defensive_driving
  question: What is the recommended following distance when driving behind a large
    commercial vehicle or in poor weather conditions in the NWT?
  choices:
    A: 2 seconds
    B: At least 4 seconds
    C: One car length
    D: 10 metres
  answer: B
  explanation: In poor weather, on gravel, or when following large vehicles that block
    your view, you should increase your following distance to at least 4 seconds.
- id: 116
  category: defensive_driving
  question: When entering a curve, what is the best defensive driving technique to
    maintain control?
  choices:
    A: Brake hard while in the middle of the curve
    B: Accelerate before entering the curve
    C: Slow down before entering the curve and accelerate slightly as you exit
    D: Maintain a constant high speed throughout the curve
  answer: C
  explanation: The safest way to negotiate a curve is to slow down to a safe speed
    before entering it, then gently accelerate as you come out of the curve.
- id: 117
  category: defensive_driving
  question: 'In the NWT, if your vehicle is equipped with Anti-lock Braking System
    (ABS) and you need to stop quickly on a slippery surface, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, continuous pressure to the brake pedal
    C: Use the emergency brake only
    D: Shift to neutral and turn off the engine
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. The system will automatically
    'pump' the brakes for you to prevent lock-up.
- id: 118
  category: defensive_driving
  question: When scanning an intersection for hazards, in what order should you look?
  choices:
    A: Right, then left
    B: Straight ahead only
    C: Left, center, right, and left again
    D: Right, center, left
  answer: C
  explanation: You should look left, center, right, and then left again. The first
    danger is usually from the left as that traffic is closest to you.
- id: 119
  category: alcohol_drugs_health
  question: In the Northwest Territories, what is the 'Warning' range for Blood Alcohol
    Concentration (BAC) for fully licensed drivers?
  choices:
    A: 0.02 to 0.05
    B: 0.05 to 0.08
    '0': 0.08 to 0.10
    D: 0.04 to 0.06
  answer: B
  explanation: For fully licensed drivers in the NWT, a BAC between 0.05 and 0.08
    is considered the 'Warning' range, which carries administrative penalties.
- id: 120
  category: alcohol_drugs_health
  question: What is the immediate administrative license suspension period for a fully
    licensed driver caught with a BAC in the 'Warning' range (0.05 to 0.08) for the
    first time?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 30 days
  answer: A
  explanation: A first-time offense for a BAC in the 0.05 to 0.08 range results in
    an immediate 24-hour administrative license suspension.
- id: 121
  category: alcohol_drugs_health
  question: In the Northwest Territories, what is the administrative license suspension
    period for a driver who provides a breath sample over 0.08 or refuses to provide
    a sample?
  choices:
    A: 24 hours
    B: 30 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Drivers who blow over 0.08 or refuse a demand for a breath/blood sample
    receive an immediate 90-day administrative license suspension.
- id: 122
  category: alcohol_drugs_health
  question: For a first-time offense of having a BAC over 0.08, how long will the
    driver's vehicle be impounded at the roadside?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: In the NWT, a first-time offense for a BAC over 0.08 (or refusal to
    provide a sample) results in a mandatory 30-day vehicle impoundment.
- id: 123
  category: alcohol_drugs_health
  question: If a driver is convicted of a first-time Criminal Code impaired driving
    offense in the NWT, what is the minimum court-ordered driving prohibition?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: A first-time Criminal Code conviction for impaired driving carries
    a minimum federal driving prohibition of 1 year.
- id: 124
  category: alcohol_drugs_health
  question: Under NWT law, who is responsible for ensuring a driver is medically fit
    to operate a motor vehicle?
  choices:
    A: Only the driver's doctor
    B: Only the Registrar of Motor Vehicles
    C: Only the driver
    D: Both the driver and their healthcare professional
  answer: D
  explanation: Both the driver (who must report changes in health) and healthcare
    professionals (who must report conditions that make driving unsafe) share the
    responsibility for medical fitness to drive.
- id: 125
  category: alcohol_drugs_health
  question: What is the penalty for a third offense within five years of driving with
    a BAC in the 'Warning' range (0.05 to 0.08)?
  choices:
    A: 30-day license suspension
    B: 90-day license suspension
    C: 6-month license suspension
    D: Permanent revocation
  answer: A
  explanation: A third 'Warning' range offense (0.05 to 0.08) within five years results
    in a 30-day administrative license suspension.
- id: 126
  category: alcohol_drugs_health
  question: If you are taking prescription or over-the-counter medication, what is
    your legal responsibility before driving?
  choices:
    A: You can drive as long as you don't feel 'high'
    B: You must wait 24 hours after any dose
    C: You must know the effects of the drug and ensure it does not impair your ability
      to drive
    D: You only need to worry if the bottle has a red skull and crossbones
  answer: C
  explanation: Drivers are legally responsible for ensuring any medication they take
    does not impair their ability to operate a vehicle safely.
- id: 127
  category: alcohol_drugs_health
  question: 'In the NWT, if a driver refuses to provide a breath sample to a peace
    officer, the legal consequences are:'
  choices:
    A: Less severe than a DUI conviction
    B: The same as having a BAC over 0.08
    C: A simple fine with no license suspension
    D: Only applicable if an accident occurred
  answer: B
  explanation: Refusing to provide a breath or blood sample is a criminal offense
    that carries the same penalties as driving with a BAC over 0.08.
- id: 128
  category: alcohol_drugs_health
  question: When a driver is issued an immediate 24-hour suspension for alcohol or
    drugs, where is the vehicle usually taken?
  choices:
    A: It must be left at the roadside for 24 hours
    B: It is impounded at the driver's expense
    C: The police officer must drive it to the driver's home
    D: It is sold at auction immediately
  answer: B
  explanation: When a license is suspended at the roadside for impairment, the vehicle
    is impounded, and the driver is responsible for all towing and storage costs.
- id: 129
  category: alcohol_drugs_health
  question: A co-driver supervising a Class 7 learner in the NWT must maintain a BAC
    below what level?
  choices:
    A: 0.00 (Zero tolerance)
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: C
  explanation: The supervising co-driver for a learner must have a BAC of less than
    0.05. If they exceed this, they are not considered a legal supervisor.
- id: 130
  category: alcohol_drugs_health
  question: How does fatigue affect a driver's performance compared to alcohol?
  choices:
    A: Fatigue has no measurable effect on reaction time
    B: Fatigue only affects older drivers
    C: Fatigue can impair judgment and coordination similarly to alcohol
    D: Fatigue is easily cured by turning up the radio
  answer: C
  explanation: Fatigue is a form of impairment that can significantly slow reaction
    times and decrease awareness, similar to the effects of alcohol or drugs.
- id: 131
  category: alcohol_drugs_health
  question: If a driver's license is suspended due to an alcohol-related conviction,
    what is a common requirement for reinstatement in the NWT?
  choices:
    A: Completing an approved alcohol education or 'Planning Ahead' program
    B: Waiting 10 years before reapplying
    C: There are no requirements other than waiting out the time
    D: Buying a new vehicle
  answer: A
  explanation: Drivers with alcohol-related suspensions are often required to complete
    an alcohol education program (like 'Planning Ahead') and pay reinstatement fees
    before getting their license back.
- id: 132
  category: alcohol_drugs_health
  question: In the Northwest Territories, a fully licensed driver (non-GDL) will face
    an immediate 24-hour roadside license suspension if their Blood Alcohol Concentration
    (BAC) is within which 'Warn Range'?
  choices:
    A: 0.02% to 0.04%
    B: 0.05% to 0.08%
    C: 0.08% to 0.10%
    D: 0.01% to 0.05%
  answer: B
  explanation: In the NWT, the 'Warn Range' for fully licensed drivers is between
    0.05% and 0.08% BAC. Reaching this level results in an immediate 24-hour license
    suspension for a first offense.
- id: 133
  category: alcohol_drugs_health
  question: Under NWT law, what is the immediate license suspension period for a driver
    who is charged with having a BAC over 0.08 (Criminal Code level)?
  choices:
    A: 24 hours
    B: 30 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Drivers charged with a BAC over 0.08 or refusing a breath sample face
    an immediate 90-day administrative license suspension.
- id: 134
  category: alcohol_drugs_health
  question: If a driver is charged with impaired driving (BAC over 0.08) for the first
    time in the NWT, for how long is their vehicle typically impounded at the roadside?
  choices:
    A: 24 hours
    B: 3 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: For a first-time offense of driving with a BAC over 0.08, the vehicle
    is subject to a 3-day roadside impoundment.
- id: 135
  category: alcohol_drugs_health
  question: In the Northwest Territories, what is the penalty for a driver in the
    Graduated Driver Licensing (GDL) program who is found with any amount of alcohol
    or drugs in their system?
  choices:
    A: A 24-hour suspension
    B: A 30-day suspension and the GDL 'clock' resets
    C: A 7-day suspension and a $500 fine
    D: A warning for the first offense
  answer: B
  explanation: NWT has zero tolerance for GDL drivers. If caught with any alcohol
    or drugs, they face an immediate 30-day suspension and must restart their current
    GDL stage from the beginning.
- id: 136
  category: alcohol_drugs_health
  question: Which of the following is a legal requirement for drivers in the NWT regarding
    medical conditions?
  choices:
    A: Only drivers over 65 must report medical conditions.
    B: Drivers must report any medical condition that may affect their ability to
      safely operate a vehicle to the Registrar.
    C: Medical conditions only need to be reported if you are involved in an accident.
    D: Only commercial drivers (Class 1-4) are required to report medical conditions.
  answer: B
  explanation: All drivers in the NWT are legally required to report any disease or
    disability that may interfere with the safe operation of a motor vehicle to the
    Registrar of Motor Vehicles.
- id: 137
  category: alcohol_drugs_health
  question: In the NWT, if a driver refuses to provide a breath, blood, or oral fluid
    sample upon legal demand by a peace officer, what are the consequences?
  choices:
    A: A 24-hour suspension only.
    B: The same penalties as driving with a BAC over 0.08.
    C: A fine of $100 and a warning.
    D: No penalty if it is the driver's first time being stopped.
  answer: B
  explanation: Refusing to provide a sample is a criminal offense and results in the
    same immediate 90-day suspension and vehicle impoundment as having a BAC over
    0.08.
- id: 138
  category: alcohol_drugs_health
  question: What is the NWT's policy regarding cannabis use for drivers in the Graduated
    Driver Licensing (GDL) program?
  choices:
    A: They may have up to 2 nanograms of THC in their blood.
    B: They are allowed to drive if they have a medical prescription.
    C: There is a zero-tolerance policy for cannabis (THC) for all GDL drivers.
    D: Cannabis is only restricted for GDL drivers under the age of 19.
  answer: C
  explanation: GDL drivers in the NWT are subject to zero tolerance for cannabis.
    Any detectable amount of THC will result in an immediate 30-day suspension.
- id: 139
  category: alcohol_drugs_health
  question: If you are a fully licensed driver in the NWT and receive a third 'Warn
    Range' (0.05 to 0.08) BAC suspension within two years, how long is the suspension?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: A third 'Warn Range' offense within a two-year period results in an
    immediate 30-day license suspension.
- id: 140
  category: alcohol_drugs_health
  question: When taking prescription or over-the-counter medication, what is the driver's
    responsibility in the NWT?
  choices:
    A: To drive only during daylight hours.
    B: To read the label or ask a pharmacist/doctor if the medication affects driving
      ability.
    C: To wait at least one hour after taking any pill before driving.
    D: Medications are not considered drugs under NWT impaired driving laws.
  answer: B
  explanation: Drivers must ensure any medication they take does not impair their
    ability to drive. Many medications cause drowsiness or slowed reaction times,
    which can lead to impaired driving charges.
- id: 141
  category: alcohol_drugs_health
  question: In the NWT, if a driver is convicted of impaired driving, they may be
    required to participate in which program before their license is fully reinstated?
  choices:
    A: The High-Speed Pursuit Course
    B: The Alcohol and Drug Education Program
    C: The Mandatory Winter Driving Workshop
    D: The Mechanical Inspection Program
  answer: B
  explanation: Drivers convicted of impaired driving offenses in the NWT are typically
    required to complete an approved alcohol and drug education or 'remedial' program
    before they can regain their driving privileges.
- id: 142
  category: alcohol_drugs_health
  question: Under the NWT's Ignition Interlock Program, what must a participant do
    to start their vehicle?
  choices:
    A: Enter a PIN code.
    B: Provide a breath sample into a device that measures alcohol.
    C: Wait for a 5-minute timer to expire.
    D: Scan their driver's license.
  answer: B
  explanation: An Ignition Interlock device requires the driver to provide a breath
    sample. If the device detects alcohol above a pre-set limit, the vehicle's engine
    will not start.
- id: 143
  category: alcohol_drugs_health
  question: 'In the NWT, if a driver is found to be impaired by a combination of alcohol
    and drugs, the penalties are:'
  choices:
    A: Reduced because the effects cancel each other out.
    B: The same as if only alcohol was consumed.
    C: Subject to more severe Criminal Code penalties due to the combined impairment.
    D: Only applicable if the driver is over 21.
  answer: C
  explanation: Combining alcohol and drugs significantly increases impairment. Under
    the Criminal Code, there are specific, often more severe, penalties for having
    prohibited levels of both alcohol and THC in the blood simultaneously.
- id: 144
  category: penalties_and_points
  question: For a fully licensed driver in the NWT, how long is the first license
    suspension for accumulating 15 or more demerit points within a two-year period?
  choices:
    A: 14 days
    B: 1 month
    C: 3 months
    D: 6 months
  answer: B
  explanation: If a fully licensed driver accumulates 15 or more demerit points, the
    first suspension period is one month.
- id: 145
  category: penalties_and_points
  question: Under NWT law, what is the demerit point penalty for using a hand-held
    electronic device (distracted driving) while operating a vehicle?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Distracted driving, such as using a hand-held cell phone, results in
    3 demerit points being added to the driver's record in the NWT.
- id: 146
  category: penalties_and_points
  question: If you are convicted of driving 51 km/h or more over the posted speed
    limit in the NWT, how many demerit points will be added to your record?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: Speeding more than 50 km/h over the limit is a major offense in the
    NWT and results in 6 demerit points.
- id: 147
  category: penalties_and_points
  question: 'A peace officer in the NWT can issue an immediate 24-hour roadside suspension
    if they have reasonable grounds to believe a driver has a Blood Alcohol Concentration
    (BAC) of at least:'
  choices:
    A: '0.01'
    B: '0.05'
    C: '0.08'
    D: '0.10'
  answer: B
  explanation: In the NWT, a 24-hour roadside suspension can be issued to fully licensed
    drivers if their BAC is 0.05 or higher.
- id: 148
  category: penalties_and_points
  question: How many demerit points are assigned to an NWT driver for failing to wear
    a seatbelt?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failing to wear a seatbelt or failing to ensure a passenger under 16
    is properly restrained results in 2 demerit points.
- id: 149
  category: penalties_and_points
  question: In the Northwest Territories, a vehicle can be immediately seized and
    impounded for how many days if the driver is caught racing or performing a stunt?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: C
  explanation: Under NWT regulations, vehicles involved in racing or stunting are
    subject to an immediate 7-day impoundment.
- id: 150
  category: penalties_and_points
  question: If a fully licensed driver accumulates 15 demerit points for a second
    time within a two-year period, how long will their license be suspended?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: For a second suspension within two years due to demerit points, the
    suspension period increases to 3 months.
- id: 151
  category: penalties_and_points
  question: Failing to stop for a stop sign in the NWT results in how many demerit
    points?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Disobeying a stop sign or a red light results in 3 demerit points being
    added to your driving record.
- id: 152
  category: penalties_and_points
  question: How many demerit points are assigned for failing to stop for a signal
    or gate at a railway crossing in the NWT?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: Failing to stop at a railway crossing when a signal or gate is activated
    is a 5-point offense in the Northwest Territories.
- id: 153
  category: penalties_and_points
  question: If a fully licensed driver in the NWT is convicted of failing to remain
    at the scene of an accident, how many demerit points will be added to their record?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 10 points
  answer: C
  explanation: Failing to remain at the scene of an accident is a serious offense
    in the NWT and carries a penalty of 7 demerit points.
- id: 154
  category: penalties_and_points
  question: In the Northwest Territories, what is the penalty for a driver caught
    speeding at more than 50 km/h over the posted speed limit?
  choices:
    A: 2 demerit points
    B: 4 demerit points
    C: 6 demerit points
    D: 8 demerit points
  answer: C
  explanation: Speeding more than 50 km/h over the limit in the NWT results in 6 demerit
    points being added to the driver's record.
- id: 155
  category: penalties_and_points
  question: If a driver's Blood Alcohol Concentration (BAC) is between 0.05% and 0.08%
    (the 'Warn Range'), what is the immediate roadside penalty for a first offense
    in the NWT?
  choices:
    A: A 24-hour roadside license suspension
    B: A 7-day license suspension
    C: A 30-day license suspension
    D: Permanent revocation of the license
  answer: A
  explanation: Drivers in the NWT found with a BAC in the 'warn range' (0.05 to 0.08)
    are subject to an immediate 24-hour roadside license suspension.
- id: 156
  category: penalties_and_points
  question: Which of the following violations carries a penalty of 6 demerit points
    in the Northwest Territories?
  choices:
    A: Following too closely
    B: Careless driving
    C: Failing to yield to a pedestrian
    D: Improper passing
  answer: B
  explanation: Careless driving is considered a major violation in the NWT and is
    penalized with 6 demerit points.
- id: 157
  category: penalties_and_points
  question: How long do demerit points remain on a driver's record in the Northwest
    Territories?
  choices:
    A: 1 year from the date of the offense
    B: 2 years from the date of conviction
    C: 3 years from the date of conviction
    D: 5 years from the date of the offense
  answer: B
  explanation: Demerit points are removed from an NWT driving record two years after
    the date of the conviction for the offense.
- id: 158
  category: penalties_and_points
  question: If a driver is convicted of 'Racing' on an NWT highway, how many demerit
    points are added to their license?
  choices:
    A: 5 points
    B: 7 points
    C: 10 points
    D: 15 points
  answer: C
  explanation: Racing a motor vehicle on a highway is a major offense in the NWT and
    carries a penalty of 10 demerit points.
- id: 159
  category: penalties_and_points
  question: What is the penalty for a driver who is caught operating a vehicle while
    their driver's license is under suspension?
  choices:
    A: A verbal warning only
    B: The vehicle is seized and impounded for 30 days
    C: A mandatory 5-year driving ban
    D: The driver must retake the Class 7 knowledge test
  answer: B
  explanation: In the NWT, if you are caught driving while your license is suspended,
    the vehicle you are driving will be seized and impounded for 30 days, regardless
    of who owns it.
- id: 160
  category: penalties_and_points
  question: How many demerit points are assigned for 'Following too closely' in the
    Northwest Territories?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Following another vehicle too closely (tailgating) results in 4 demerit
    points in the NWT.
- id: 161
  category: penalties_and_points
  question: A fully licensed driver who receives a second demerit point suspension
    within two years will have their license suspended for how long?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: In the NWT, a second suspension within a two-year period for accumulating
    demerit points results in a 3-month (90-day) suspension.
- id: 162
  category: penalties_and_points
  question: In the NWT, how many demerit points are assigned for failing to yield
    the right-of-way to a pedestrian in a crosswalk?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failing to yield to a pedestrian in a crosswalk results in 3 demerit
    points on an NWT driver's record.
- id: 163
  category: sharing_the_road
  question: In the Northwest Territories, when you approach a school bus from either
    the front or the rear that has its red lights flashing, how far back must you
    stop your vehicle?
  choices:
    A: 5 meters
    B: 10 meters
    C: 15 meters
    D: 25 meters
  answer: C
  explanation: According to the NWT Driver's Guide, drivers must stop at least 15
    meters away from a school bus when its red lights are flashing and/or its stop
    arm is extended.
- id: 164
  category: sharing_the_road
  question: Under the NWT Motor Vehicles Act, how many demerit points are assigned
    to a driver's record for failing to stop for a school bus with flashing red lights?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failing to stop for a school bus with flashing red lights is a serious
    offense in the Northwest Territories and results in 4 demerit points.
- id: 165
  category: sharing_the_road
  question: In the Northwest Territories, if you are driving on a highway with a posted
    speed limit of 60 km/h or higher, what speed must you slow down to when passing
    a stopped emergency vehicle with its lights flashing?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 60 km/h
    D: 80 km/h
  answer: C
  explanation: Under the 'Slow Down, Move Over' laws, if the speed limit is 60 km/h
    or higher, you must slow to 60 km/h. If the limit is under 60 km/h, you must slow
    to 30 km/h.
- id: 166
  category: sharing_the_road
  question: When following a fire truck that is responding to an alarm, what is the
    minimum following distance you must maintain?
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: It is illegal to follow within 150 meters of a fire appliance (fire
    truck) that is responding to an emergency call.
- id: 167
  category: sharing_the_road
  question: Large commercial vehicles have 'No-Zones.' What does this term refer to?
  choices:
    A: Areas where trucks are not allowed to drive
    B: Blind spots around the truck where the driver cannot see other vehicles
    C: Loading zones for heavy equipment
    D: High-wind areas on NWT highways
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots behind, in front of,
    and on both sides of a commercial vehicle where the driver's visibility is limited.
- id: 168
  category: sharing_the_road
  question: When a school bus is stopped on a highway divided by a median, do vehicles
    traveling in the opposite direction (on the other side of the median) need to
    stop?
  choices:
    A: Yes, they must always stop
    B: No, they are not required to stop
    C: Yes, but only if the bus driver signals them
    D: No, but they must slow down to 10 km/h
  answer: B
  explanation: On a highway divided by a median, only vehicles approaching the bus
    from the rear or from the front on the same side of the median are required to
    stop for the flashing red lights.
- id: 169
  category: sharing_the_road
  question: If you see a pedestrian with a white cane or a guide dog at a crosswalk,
    what does this indicate, and what should you do?
  choices:
    A: The pedestrian is a senior; give them extra time
    B: The pedestrian is visually impaired; stop and give them the right-of-way
    C: The pedestrian is a service worker; proceed with caution
    D: The pedestrian is training a dog; do not honk
  answer: B
  explanation: A white cane or guide dog indicates the pedestrian is visually impaired.
    Drivers must exercise extreme caution and yield the right-of-way to ensure their
    safety.
- id: 170
  category: sharing_the_road
  question: Why is it dangerous to pull out closely in front of a large truck, especially
    in NWT winter conditions?
  choices:
    A: Trucks have much longer braking distances than passenger cars
    B: The truck driver might get angry
    C: Trucks have better traction and might hit you from behind
    D: It is illegal to pass trucks in the winter
  answer: A
  explanation: Large trucks are much heavier than cars and require a significantly
    longer distance to come to a complete stop, especially on icy or snow-covered
    NWT roads.
- id: 171
  category: sharing_the_road
  question: In the Northwest Territories, what are the standard hours for school zone
    speed limits unless otherwise posted?
  choices:
    A: 8:00 AM to 5:00 PM on school days
    B: 8:30 AM to 3:30 PM on school days
    C: 8:00 AM to 4:30 PM on school days
    D: 7:30 AM to 9:00 PM every day
  answer: C
  explanation: While local bylaws may vary slightly, the standard school zone hours
    in the NWT are 8:00 AM to 4:30 PM on days when school is in session.
- id: 172
  category: sharing_the_road
  question: When a large truck is turning right at an intersection, why might it swing
    wide into the left lane before turning?
  choices:
    A: The driver is trying to see traffic better
    B: Trucks are required by law to use two lanes for all turns
    C: To clear the curb with the rear wheels because of the vehicle's length
    D: To warn other drivers to stay back
  answer: C
  explanation: Because of their length, large vehicles must swing wide to the left
    to complete a right turn without the rear wheels climbing over the curb or hitting
    objects.
- id: 173
  category: sharing_the_road
  question: When riding a bicycle at night in the NWT, what equipment is legally required
    on the bicycle?
  choices:
    A: A bell and a white flag
    B: A white front light and a red rear light or reflector
    C: Yellow reflectors on the spokes only
    D: A high-visibility vest
  answer: B
  explanation: For night riding, a bicycle must be equipped with a headlamp emitting
    a white light to the front and a red tail lamp or red reflector to the rear.
- id: 174
  category: sharing_the_road
  question: What should a driver do if they are being passed by a large commercial
    vehicle on a two-lane highway?
  choices:
    A: Speed up so the truck doesn't have to pass
    B: Move as far to the right as possible and maintain or slightly reduce speed
    C: Brake hard to let the truck in quickly
    D: Stay in the center of the lane and use high beams
  answer: B
  explanation: When being passed, you should stay to the right and help the other
    driver pass safely by maintaining a steady speed or slowing down slightly.
- id: 175
  category: sharing_the_road
  question: At an intersection where there are no marked crosswalks or stop lines,
    do pedestrians still have the right-of-way?
  choices:
    A: No, they must wait for a gap in traffic
    B: Yes, there is an 'unmarked crosswalk' at every intersection
    C: Only if they are crossing with a group
    D: Only during daylight hours
  answer: B
  explanation: Under the NWT Motor Vehicles Act, an unmarked crosswalk exists at every
    intersection unless signs prohibit crossing. Drivers must yield to pedestrians
    in these areas.
- id: 176
  category: sharing_the_road
  question: What is the demerit point penalty in the Northwest Territories for failing
    to stop for a school bus with flashing red lights?
  choices:
    A: 2 demerit points
    B: 3 demerit points
    C: 4 demerit points
    D: 6 demerit points
  answer: D
  explanation: Failing to stop for a school bus is considered a serious offense in
    the NWT and results in 6 demerit points being added to your driving record.
- id: 177
  category: sharing_the_road
  question: In the Northwest Territories, what is the minimum distance you must maintain
    when following an emergency vehicle that has its lights or sirens activated?
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 300 meters
  answer: C
  explanation: It is illegal and dangerous to follow an emergency vehicle too closely.
    You must maintain a minimum following distance of 150 meters.
- id: 178
  category: sharing_the_road
  question: When passing a cyclist on a road in the NWT, what is the best practice
    for safety?
  choices:
    A: Honk your horn to warn them you are passing
    B: Pass as closely as possible to stay in your lane
    C: Change lanes to pass if possible, or leave at least one meter of space
    D: Cyclists must pull over to the shoulder to let all cars pass first
  answer: C
  explanation: Drivers should treat cyclists as slow-moving vehicles. When passing,
    you should change lanes if safe or provide at least one meter of clearance between
    your vehicle and the cyclist.
- id: 179
  category: sharing_the_road
  question: At an intersection where a pedestrian is crossing the street in an unmarked
    crosswalk, who has the right of way?
  choices:
    A: The motorist, because the crosswalk is not marked
    B: The pedestrian
    C: Whoever arrived at the intersection first
    D: The motorist, but only if they are turning right
  answer: B
  explanation: In the NWT, pedestrians have the right of way at all intersections,
    whether the crosswalk is marked with paint or is an 'unmarked' extension of the
    sidewalk.
- id: 180
  category: sharing_the_road
  question: When following a large commercial truck, why should you increase your
    following distance compared to following a car?
  choices:
    A: Trucks can stop much faster than cars
    B: To allow the truck driver to see you in their rear-view mirrors
    C: To prevent the truck from rolling backward into you
    D: Because trucks are required to drive 20 km/h below the limit
  answer: B
  explanation: 'Large trucks have significant blind spots directly behind them. If
    you follow too closely, the driver cannot see you. A good rule is: if you can''t
    see the truck''s side mirrors, the driver can''t see you.'
- id: 181
  category: sharing_the_road
  question: In NWT municipalities like Yellowknife, what is the standard speed limit
    in a school zone during school days (08:00 to 16:30) unless otherwise posted?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: The standard speed limit in school zones in the NWT is 30 km/h during
    designated hours to protect children and pedestrians.
- id: 182
  category: sharing_the_road
  question: According to NWT regulations, what equipment must a bicycle have when
    being operated on a highway at night?
  choices:
    A: A bell or horn only
    B: A white light on the front and a red light or reflector on the rear
    C: A yellow light on the front and a white light on the rear
    D: Reflective tape on the pedals only
  answer: B
  explanation: For safety and visibility, bicycles operated at night must be equipped
    with a front white light and a rear red light or red reflector.
- id: 183
  category: sharing_the_road
  question: If you are stopped at a red light and an emergency vehicle with sirens
    approaches from behind, what should you do?
  choices:
    A: Run the red light to get out of the way
    B: Stay where you are; do not move into the intersection against a red light
    C: Turn right immediately, even if it's unsafe
    D: Back up into the car behind you
  answer: B
  explanation: You should never move into an intersection against a red light to clear
    a path for an emergency vehicle. Wait until the light turns green or the vehicle
    finds another way around.
- id: 184
  category: sharing_the_road
  question: 'When following a motorcycle, you should maintain a larger following distance
    than usual because:'
  choices:
    A: Motorcycles are much heavier than cars
    B: Motorcycles can stop very quickly and are easily hidden in blind spots
    C: Motorcycles are required to travel slower than the speed limit
    D: Motorcyclists are not allowed to use mirrors
  answer: B
  explanation: Motorcycles can stop more quickly than cars in some conditions and
    are harder to see. Increasing your following distance gives you more time to react
    if the motorcyclist brakes or swerves to avoid a hazard.
- id: 185
  category: sharing_the_road
  question: In the NWT, what is the 'Move Over' law requirement when passing a stopped
    emergency vehicle or tow truck with its lights flashing on a highway?
  choices:
    A: Maintain your speed but honk your horn
    B: Stop completely until the emergency vehicle leaves
    C: Slow down and move to the non-adjacent lane if it is safe to do so
    D: Speed up to pass the scene as quickly as possible
  answer: C
  explanation: The 'Move Over' law requires drivers to slow down and, if there is
    more than one lane for traffic in that direction, move into the lane further away
    from the stopped emergency vehicle or tow truck.
- id: 186
  category: sharing_the_road
  question: Which of the following is a common cause of collisions between cars and
    motorcycles at intersections?
  choices:
    A: The car driver turning left in front of an oncoming motorcycle
    B: The motorcycle driver traveling too slowly
    C: The car driver following the motorcycle too closely
    D: The motorcycle driver not using their headlights
  answer: A
  explanation: A very common collision occurs when a car driver turns left at an intersection,
    failing to see or misjudging the speed of an oncoming motorcycle.
- id: 187
  category: vehicle_information
  question: In the Northwest Territories, you must dim your high beam headlights when
    you are within how many meters of an oncoming vehicle?
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 300 meters
  answer: B
  explanation: According to the NWT Motor Vehicles Act, drivers must switch to low
    beams when an oncoming vehicle is within 150 meters to avoid blinding the other
    driver.
- id: 188
  category: vehicle_information
  question: Under NWT vehicle equipment regulations, which windows are prohibited
    from having aftermarket window tint applied?
  choices:
    A: The rear window only
    B: The rear side windows only
    C: The windshield and the windows to the direct left and right of the driver
    D: All windows are allowed to have tint as long as it is not 'limo' dark
  answer: C
  explanation: NWT regulations prohibit the application of any tinting film to the
    windshield or the side windows located to the left and right of the driver.
- id: 189
  category: vehicle_information
  question: 'Every motor vehicle in the Northwest Territories must be equipped with
    a tail lamp that emits a red light visible from a distance of at least:'
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: NWT equipment regulations specify that tail lamps must be clearly visible
    from a distance of at least 150 meters to the rear.
- id: 190
  category: vehicle_information
  question: If a vehicle's load or construction obstructs the driver's view through
    the interior rear-view mirror, what equipment is required?
  choices:
    A: A passenger to act as a spotter
    B: A wide-angle interior mirror
    C: An exterior mirror on both the left and right sides of the vehicle
    D: A rear-facing camera system
  answer: C
  explanation: If the interior mirror is obstructed, the vehicle must be equipped
    with exterior mirrors on both the left and right sides to provide a clear view
    of the highway to the rear.
- id: 191
  category: vehicle_information
  question: How many demerit points will be recorded against your driving record for
    failing to wear a seatbelt in the Northwest Territories?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: In the NWT, a conviction for failing to wear a seatbelt results in
    2 demerit points being added to the driver's record.
- id: 192
  category: vehicle_information
  question: NWT law requires that every motor vehicle (other than a motorcycle) be
    equipped with how many separate braking systems?
  choices:
    A: One primary system
    B: Two, a service brake and a parking/emergency brake
    C: Three, including an engine brake
    D: Four, one for each wheel
  answer: B
  explanation: 'Vehicles must have two independent braking systems: the service brake
    (foot brake) and a parking or emergency brake.'
- id: 193
  category: vehicle_information
  question: 'A motor vehicle''s horn must be capable of emitting sound audible under
    normal conditions from a distance of at least:'
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: NWT vehicle equipment regulations require a horn to be audible from
    a distance of at least 60 meters.
- id: 194
  category: vehicle_information
  question: 'The rear license plate on a vehicle must be illuminated by a white light
    so that it is clearly legible from a distance of:'
  choices:
    A: 10 meters
    B: 15 meters
    C: 25 meters
    D: 50 meters
  answer: B
  explanation: The NWT Motor Vehicles Act requires the rear license plate to be illuminated
    and legible from a distance of 15 meters.
- id: 195
  category: vehicle_information
  question: In the Northwest Territories, mudguards or fenders are required for which
    wheels of a motor vehicle or trailer?
  choices:
    A: The front wheels only
    B: The rear wheels only
    C: All four wheels
    D: Only vehicles with oversized tires require them
  answer: B
  explanation: NWT regulations require that the rear wheels of every motor vehicle
    and trailer be equipped with mudguards or fenders to reduce spray and debris.
- id: 196
  category: vehicle_information
  question: What is the maximum legal height allowed for a vehicle, including its
    load, in the Northwest Territories without a special permit?
  choices:
    A: 3.8 meters
    B: 4.2 meters
    C: 4.5 meters
    D: 5.0 meters
  answer: B
  explanation: The maximum height for a vehicle and its load in the NWT is 4.2 meters.
    Anything exceeding this requires an oversize permit.
- id: 197
  category: vehicle_information
  question: In the Northwest Territories, during what time period must a vehicle's
    headlights be turned on?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: From sunset to sunrise
    C: From one-half hour after sunset to one-half hour before sunrise
    D: Only when it is raining or snowing
  answer: C
  explanation: According to the NWT Motor Vehicles Act, headlights must be used from
    one-half hour after sunset to one-half hour before sunrise, and at any other time
    when visibility is reduced to 60 meters or less.
- id: 198
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle in
    the Northwest Territories?
  choices:
    A: 1.0 millimeter
    B: 1.6 millimeters
    C: 2.5 millimeters
    D: 3.2 millimeters
  answer: B
  explanation: Tires are considered unsafe and illegal if the tread depth is less
    than 1.6 millimeters (approximately 2/32 of an inch).
- id: 199
  category: vehicle_information
  question: 'In the NWT, brake lights (stop lamps) must be visible in normal sunlight
    from a distance of at least:'
  choices:
    A: 15 meters
    B: 30 meters
    C: 60 meters
    D: 100 meters
  answer: B
  explanation: Brake lights must be functional and visible from at least 30 meters
    away in normal sunlight.
- id: 200
  category: vehicle_information
  question: Regarding window tinting in the Northwest Territories, which of the following
    is true?
  choices:
    A: Any amount of tint is allowed on the windshield
    B: No tinting is allowed on the windshield or the windows to the left and right
      of the driver
    C: Tinting is allowed on all windows as long as it is factory installed
    D: Only 50% tint is allowed on the front side windows
  answer: B
  explanation: NWT regulations prohibit the use of sun-screening material (tint) on
    the windshield and the side windows to the immediate left and right of the driver.
- id: 201
  category: vehicle_information
  question: What is the requirement for a vehicle's exhaust system in the NWT?
  choices:
    A: It must be loud enough to warn pedestrians
    B: It must be equipped with a muffler that prevents excessive noise and smoke
    C: Mufflers are optional for vehicles registered outside of Yellowknife
    D: Exhaust pipes must point toward the sidewalk
  answer: B
  explanation: Every motor vehicle must be equipped with a muffler in good working
    order to prevent excessive or unusual noise and annoying smoke.
- id: 202
  category: vehicle_information
  question: 'The parking brake of a vehicle must be capable of holding the vehicle:'
  choices:
    A: On a level surface only
    B: Only when the engine is running
    C: On any grade (hill) on which it is operated
    D: For at least 10 minutes
  answer: C
  explanation: The parking brake must be a separate mechanism capable of holding the
    vehicle stationary on any grade on which it is operated, regardless of the load.
- id: 203
  category: vehicle_information
  question: 'Turn signal lamps must be visible from a distance of not less than:'
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: A
  explanation: Turn signal lamps must be visible to the front and rear from a distance
    of at least 30 meters.
- id: 204
  category: vehicle_information
  question: 'In the NWT, every motor vehicle equipped with a windshield must also
    have:'
  choices:
    A: A defrosting system and functional wipers
    B: A protective metal screen
    C: Self-cleaning glass
    D: A spare windshield in the trunk
  answer: A
  explanation: Vehicles must have functional windshield wipers and a defrosting/defogging
    system to maintain a clear view for the driver, which is especially critical in
    NWT winter conditions.
- id: 205
  category: signs_and_signals
  question: When approaching a flashing red traffic light at an intersection, what
    must a driver do?
  choices:
    A: Slow down and proceed with caution without stopping
    B: Stop completely and wait for the light to turn solid green
    C: Stop completely and proceed only when it is safe to do so
    D: Treat it as a yield sign and only stop if other traffic is present
  answer: C
  explanation: A flashing red light must be treated the same as a stop sign. You must
    come to a complete stop and proceed only when safe.
- id: 206
  category: signs_and_signals
  question: What does a solid yellow line on your side of the center line indicate
    on an NWT highway?
  choices:
    A: Passing is permitted if the road ahead is clear
    B: You are on a one-way street
    C: Passing is prohibited
    D: You must turn left at the next intersection
  answer: C
  explanation: A solid yellow line on your side of the center line means that passing
    is prohibited because it is unsafe.
- id: 207
  category: signs_and_signals
  question: To signal a right turn using hand signals, how should the driver's arm
    be positioned?
  choices:
    A: Left arm extended straight out the window
    B: Left arm out and bent upward at the elbow
    C: Left arm out and bent downward at the elbow
    D: Right arm extended straight out the window
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out and bent
    upward at a 90-degree angle.
- id: 208
  category: signs_and_signals
  question: When you see a triangular yield sign, what is the legal requirement?
  choices:
    A: Always come to a complete stop regardless of traffic
    B: Speed up to merge into the flow of traffic quickly
    C: Slow down or stop if necessary to give the right-of-way to other traffic
    D: Stop only if there are pedestrians in the crosswalk
  answer: C
  explanation: A yield sign means you must slow down and be prepared to stop to let
    any vehicle or pedestrian with the right-of-way pass before you proceed.
- id: 209
  category: signs_and_signals
  question: 'In the Northwest Territories, a flashing green light at an intersection
    usually indicates:'
  choices:
    A: An advanced green for left turns
    B: A pedestrian-activated signal
    C: The traffic signal is malfunctioning
    D: You must stop and proceed with caution
  answer: B
  explanation: In many northern jurisdictions, a flashing green light indicates a
    pedestrian-activated signal; drivers should be prepared for the light to change
    to yellow and then red shortly after.
- id: 210
  category: signs_and_signals
  question: What do double solid white lines painted on a roadway indicate?
  choices:
    A: Changing lanes is prohibited
    B: Passing is allowed if safe
    C: The road is a one-way street
    D: You are entering a high-speed zone
  answer: A
  explanation: Double solid white lines indicate that lane changes are prohibited
    and you must stay in your current lane.
- id: 211
  category: signs_and_signals
  question: If you are at an intersection with a red light and a green arrow pointing
    right, what are you permitted to do?
  choices:
    A: Wait for the red light to turn green before turning
    B: Turn right only after coming to a full stop
    C: Proceed in the direction of the arrow after yielding to pedestrians and other
      traffic
    D: Proceed in the direction of the arrow without slowing down
  answer: C
  explanation: A green arrow with a red light means you may proceed in the direction
    of the arrow, but you must first yield to pedestrians and other vehicles already
    in the intersection.
- id: 212
  category: signs_and_signals
  question: In the Northwest Territories, what color are the signs used to indicate
    temporary construction or maintenance work ahead?
  choices:
    A: Yellow
    B: Red
    C: Orange
    D: Fluorescent Green
  answer: C
  explanation: Orange signs are used to warn drivers of temporary conditions such
    as construction, maintenance, or utility work on the road.
- id: 213
  category: signs_and_signals
  question: What is the general meaning of a diamond-shaped traffic sign?
  choices:
    A: Stop or Yield
    B: Regulatory (must obey)
    C: Warning or Caution
    D: Information and Direction
  answer: C
  explanation: Diamond-shaped signs are warning signs that alert drivers to potential
    hazards or changes in road conditions ahead.
- id: 214
  category: signs_and_signals
  question: 'A large white ''X'' painted on the pavement of a roadway usually indicates:'
  choices:
    A: A pedestrian crosswalk
    B: A no-parking zone
    C: A railway crossing ahead
    D: An upcoming intersection
  answer: C
  explanation: A large white 'X' on the pavement is a warning that you are approaching
    a railway crossing.
- id: 215
  category: signs_and_signals
  question: What does a flashing yellow traffic light mean?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: The intersection is closed to all traffic
  answer: C
  explanation: A flashing yellow light warns drivers to slow down and proceed through
    the intersection with caution.
- id: 216
  category: signs_and_signals
  question: According to NWT driving rules, where is a U-turn prohibited even if there
    is no sign forbidding it?
  choices:
    A: On any residential street
    B: On a curve or near the crest of a hill where visibility is less than 150 metres
    C: At any intersection with traffic lights
    D: In a cul-de-sac
  answer: B
  explanation: U-turns are illegal on curves or hills where you cannot be seen by
    other drivers approaching from either direction within 150 metres.
- id: 217
  category: signs_and_signals
  question: In the Northwest Territories, what must you do when approaching a flashing
    red traffic light?
  choices:
    A: Slow down and proceed with caution
    B: Stop and wait for the light to turn green
    C: Stop, yield to cross traffic and pedestrians, and proceed when it is safe
    D: Yield to traffic on the right only
  answer: C
  explanation: According to the NWT Driver's Guide, a flashing red light means the
    same as a stop sign. You must come to a complete stop and proceed only when it
    is safe to do so.
- id: 218
  category: signs_and_signals
  question: What does a flashing yellow (amber) traffic light indicate in the Northwest
    Territories?
  choices:
    A: Stop and wait for the light to change
    B: Slow down and proceed with caution
    C: Speed up to clear the intersection quickly
    D: The light is about to turn red
  answer: B
  explanation: A flashing yellow light is a cautionary signal indicating you should
    slow down and be prepared to stop if necessary, but you do not need to come to
    a full stop if the way is clear.
- id: 219
  category: signs_and_signals
  question: Which hand signal is the correct way to indicate a right turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm out the window and bent upward at the elbow
    C: Left arm out the window and pointed toward the ground
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at a 90-degree angle.
- id: 220
  category: signs_and_signals
  question: 'A solid yellow line next to a broken yellow line on the pavement means:'
  choices:
    A: Passing is prohibited for vehicles on both sides
    B: Passing is allowed for vehicles on both sides
    C: Passing is allowed only for the vehicle with the broken line on its side
    D: Passing is allowed only for the vehicle with the solid line on its side
  answer: C
  explanation: In the NWT, a broken line on your side of the road means you may pass
    if it is safe. A solid line on your side means passing is prohibited.
- id: 221
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the roadway indicate?
  choices:
    A: Passing is permitted in either direction
    B: Passing is prohibited in either direction
    C: Passing is permitted during daylight hours only
    D: The lane is reserved for emergency vehicles
  answer: B
  explanation: Double solid yellow lines mean that passing is strictly prohibited
    for traffic moving in either direction.
- id: 222
  category: signs_and_signals
  question: When you see a 'Yield' sign, what are you required to do?
  choices:
    A: Come to a complete stop regardless of traffic
    B: Speed up to merge with traffic
    C: Slow down and stop if necessary to let other vehicles or pedestrians pass
    D: Always stop and wait for 3 seconds
  answer: C
  explanation: A yield sign means you must slow down and give the right-of-way to
    traffic in the intersection or on the connecting road. You only stop if traffic
    conditions require it.
- id: 223
  category: signs_and_signals
  question: What does a steady green arrow pointing left combined with a red light
    mean?
  choices:
    A: You must stop and wait for a full green light
    B: You may turn left, as it is a protected turn
    C: You may turn left only after coming to a complete stop
    D: You must yield to all oncoming traffic before turning left
  answer: B
  explanation: A green arrow means you have a 'protected' turn in the direction of
    the arrow. Oncoming traffic is stopped by a red light.
- id: 224
  category: signs_and_signals
  question: In the NWT, what does a white diamond marking on a specific lane indicate?
  choices:
    A: The lane is for high-speed traffic only
    B: The lane is reserved for specific vehicles like buses or carpools
    C: The lane is closed for construction
    D: The lane is for emergency parking only
  answer: B
  explanation: A white diamond on the pavement indicates a reserved lane, often for
    buses, taxis, or high-occupancy vehicles (HOV).
- id: 225
  category: signs_and_signals
  question: Which hand signal indicates that a driver is slowing down or stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm out and bent upward
    C: Left arm out and bent downward
    D: Right arm waving out the window
  answer: C
  explanation: The hand signal for stopping or slowing down is the left arm extended
    out the window and bent downward at the elbow.
- id: 226
  category: signs_and_signals
  question: What is the primary color of signs used to warn drivers of construction
    or maintenance ahead?
  choices:
    A: Yellow
    B: Red
    C: Orange
    D: Green
  answer: C
  explanation: In the NWT and across Canada, orange is the standard background color
    for construction and maintenance warning signs.
- id: 227
  category: signs_and_signals
  question: At a four-way stop, if two vehicles arrive at the same time at right angles
    to each other, who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling on the wider road
    D: The vehicle traveling at a higher speed
  answer: B
  explanation: When two vehicles arrive at a four-way stop at the same time, the driver
    on the left must yield the right-of-way to the driver on the right.
- id: 228
  category: signs_and_signals
  question: What does a steady yellow (amber) light mean at an intersection?
  choices:
    A: Speed up to clear the intersection before the red light
    B: Stop if you can do so safely; otherwise, proceed with caution
    C: You have the right-of-way to turn left
    D: Stop and wait for the light to turn green
  answer: B
  explanation: A steady yellow light means the signal is about to turn red. You must
    stop before entering the intersection unless you are so close that stopping would
    be unsafe.
