questions:
- id: 1
  category: license_system
  question: Aux Territoires du Nord-Ouest, quel est l'âge minimum requis pour demander
    un permis d'apprenti conducteur de classe 7 ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    D: 18 ans
  answer: B
  explanation: Selon le Guide du conducteur des TNO, un demandeur doit avoir au moins
    15 ans pour demander un permis d'apprenti conducteur de classe 7.
- id: 2
  category: license_system
  question: Un apprenti conducteur de classe 7 doit être accompagné d'un co-conducteur
    qui détient un permis de classe 5 valide (non probatoire) depuis au moins combien
    de temps ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: B
  explanation: Le conducteur superviseur d'un apprenti de classe 7 doit détenir un
    permis de classe 5 valide (ou supérieur) depuis au moins deux ans.
- id: 3
  category: license_system
  question: Dans le cadre du programme de permis de conduire progressif (GDL) des
    TNO, il est interdit aux conducteurs de classe 7 de conduire pendant quelles heures
    ?
  choices:
    A: De minuit à 5 h 00
    B: De 22 h 00 à 6 h 00
    C: De 23 h 00 à 6 h 00
    D: De 21 h 00 à 7 h 00
  answer: C
  explanation: Aux Territoires du Nord-Ouest, les apprentis conducteurs de classe
    7 ont l'interdiction de conduire entre 23 h 00 et 6 h 00.
- id: 4
  category: license_system
  question: Quel est le taux d'alcoolémie (BAC) maximal autorisé pour un conducteur
    participant au programme de permis de conduire progressif (GDL) des TNO ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Les conducteurs du programme GDL (classe 7 et classe 5P) doivent maintenir
    un taux d'alcoolémie de zéro lorsqu'ils conduisent un véhicule à moteur.
- id: 5
  category: license_system
  question: Pendant combien de temps un conducteur doit-il détenir un permis de classe
    5P (probatoire) avant d'être admissible à un permis complet de classe 5 ?
  choices:
    A: 6 mois
    B: 12 mois
    C: 18 mois
    D: 24 mois
  answer: B
  explanation: Un conducteur doit rester à l'étape probatoire (classe 5P) pendant
    au moins 12 mois sans aucune suspension avant d'obtenir un permis complet de classe
    5.
- id: 6
  category: license_system
  question: Aux Territoires du Nord-Ouest, un conducteur titulaire d'un permis GDL
    recevra un avis de suspension après avoir accumulé combien de points d'inaptitude
    ?
  choices:
    A: 5 points
    B: 7 points
    C: 10 points
    D: 15 points
  answer: B
  explanation: Pour les conducteurs du programme GDL, une suspension survient lorsque
    7 points d'inaptitude sont accumulés. Pour les conducteurs détenant un permis
    complet, la limite est de 15 points.
- id: 7
  category: license_system
  question: Un conducteur détenant un permis complet (non GDL) aux TNO fera l'objet
    d'une suspension de permis s'il accumule combien de points d'inaptitude sur une
    période de deux ans ?
  choices:
    A: 7 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: D
  explanation: Un conducteur détenant un permis complet qui accumule 15 points d'inaptitude
    ou plus sur une période de deux ans verra ses privilèges de conduite suspendus.
- id: 8
  category: license_system
  question: Lorsqu'un apprenti de classe 7 conduit, qui est autorisé à s'asseoir sur
    le siège passager avant ?
  choices:
    A: Tout membre de la famille
    B: Uniquement le conducteur superviseur qualifié
    C: Le conducteur superviseur et une autre personne
    D: N'importe qui, tant que le superviseur est sur le siège arrière
  answer: B
  explanation: La seule personne autorisée sur le siège avant d'un véhicule conduit
    par un apprenti de classe 7 est le conducteur superviseur qualifié.
- id: 9
  category: license_system
  question: Si vous changez de nom ou d'adresse, vous devez en aviser le registraire
    des véhicules automobiles dans un délai de combien de jours ?
  choices:
    A: 7 jours
    B: 10 jours
    C: 15 jours
    D: 30 jours
  answer: C
  explanation: La loi des TNO exige que les conducteurs informent le registraire des
    véhicules automobiles de tout changement de nom ou d'adresse dans les 15 jours.
- id: 10
  category: license_system
  question: Quelle est la restriction concernant les passagers pour un conducteur
    titulaire d'un permis de classe 5P (probatoire) ?
  choices:
    A: Aucun passager n'est autorisé
    B: Un seul passager est autorisé
    C: Le nombre de passagers est limité au nombre de ceintures de sécurité fonctionnelles
      dans le véhicule
    D: Seuls les membres de la famille immédiate sont autorisés
  answer: C
  explanation: Dans le cadre du programme GDL, les conducteurs de classe 5P ne peuvent
    transporter que le nombre de passagers correspondant au nombre de ceintures de
    sécurité dans le véhicule.
- id: 11
  category: license_system
  question: Laquelle des classes de permis suivantes est requise pour conduire une
    motocyclette dans les Territoires du Nord-Ouest ?
  choices:
    A: Classe 4
    B: Classe 5
    C: Classe 6
    D: Classe 7
  answer: C
  explanation: Un permis de classe 6 est spécifiquement requis pour conduire une motocyclette
    dans les Territoires du Nord-Ouest.
- id: 12
  category: license_system
  question: Quel est l'âge minimum pour obtenir un permis de classe 5P (probatoire)
    dans les TNO ?
  choices:
    A: 15 ans
    B: 16 ans
    C: 17 ans
    D: 18 ans
  answer: B
  explanation: Un conducteur doit avoir au moins 16 ans et avoir détenu un permis
    de classe 7 pendant au moins 12 mois pour demander un permis de classe 5P.
- id: 13
  category: license_system
  question: Si le permis d'un conducteur de classe 5P est suspendu, qu'advient-il
    de sa période de probation de 12 mois ?
  choices:
    A: Elle se poursuit normalement
    B: Elle est réduite de la durée de la suspension
    C: La période de 12 mois est réinitialisée et doit être recommencée
    D: Le conducteur est automatiquement rétrogradé à la classe 7
  answer: C
  explanation: Dans le cadre du programme de permis de conduire progressif (GDL) des
    TNO, si le permis d'un conducteur probatoire est suspendu, la période de probation
    de 12 mois est réinitialisée et doit être recommencée depuis le début après la
    fin de la suspension.
- id: 14
  category: license_system
  question: Lorsque vous conduisez un véhicule à moteur dans les Territoires du Nord-Ouest,
    quels documents devez-vous avoir sur vous ?
  choices:
    A: Un permis de conduire valide uniquement
    B: Un permis de conduire valide et le certificat d'immatriculation du véhicule
    C: Un permis de conduire valide et le certificat d'assurance
    D: Un permis de conduire valide, le certificat d'immatriculation du véhicule et
      le certificat d'assurance
  answer: D
  explanation: Les conducteurs doivent avoir en tout temps dans le véhicule leur permis
    de conduire valide, le certificat d'immatriculation valide du véhicule et le certificat
    d'assurance valide lorsqu'ils l'utilisent.
- id: 15
  category: license_system
  question: Pour conserver un permis commercial de classe 1, 2, 3 ou 4 dans les Territoires
    du Nord-Ouest, à quelle fréquence un conducteur de moins de 45 ans doit-il soumettre
    un rapport médical ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 3 ans
    D: Tous les 5 ans
  answer: D
  explanation: Aux TNO, les conducteurs titulaires d'un permis commercial (classes
    1, 2, 3 et 4) doivent soumettre un rapport médical tous les 5 ans jusqu'à l'âge
    de 45 ans, tous les 2 ans de 45 à 65 ans, et chaque année après 65 ans.
- id: 16
  category: license_system
  question: Quelle mention (avenant) doit être ajoutée à un permis de conduire des
    TNO pour conduire légalement un véhicule équipé de freins à air ?
  choices:
    A: Mention A
    B: Mention B
    C: Mention S
    D: Mention X
  answer: A
  explanation: La mention « A » est requise dans les Territoires du Nord-Ouest pour
    tout conducteur exploitant un véhicule équipé de freins à air.
- id: 17
  category: license_system
  question: Une personne qui s'installe dans les Territoires du Nord-Ouest et qui
    détient un permis de conduire valide d'une autre province canadienne doit demander
    un permis des TNO dans les combien de jours suivant l'établissement de sa résidence
    ?
  choices:
    A: 14 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Les nouveaux résidents des TNO doivent échanger leur permis de conduire
    hors territoire contre un permis des TNO dans les 30 jours suivant l'établissement
    de leur résidence.
- id: 18
  category: license_system
  question: Si votre permis de conduire des TNO est expiré depuis plus de ______,
    vous devez repasser l'examen écrit et l'examen de conduite pour obtenir un nouveau
    permis.
  choices:
    A: 6 mois
    B: 1 an
    C: 2 ans
    D: 5 ans
  answer: C
  explanation: Si un permis de conduire est expiré depuis plus de deux ans, le demandeur
    est considéré comme un nouveau conducteur et doit réussir les examens théoriques
    et pratiques.
- id: 19
  category: license_system
  question: Pour demander un permis d'apprenti conducteur de classe 6 (motocyclette)
    aux TNO, quelle classe de permis le demandeur doit-il déjà détenir au minimum
    ?
  choices:
    A: Classe 1
    B: Classe 5P
    C: Classe 7
    D: Aucun permis préalable n'est requis
  answer: C
  explanation: Pour obtenir un permis d'apprenti de classe 6, vous devez avoir au
    moins 15 ans et déjà détenir un permis valide de classe 7 (apprenti) ou d'une
    classe supérieure.
- id: 20
  category: license_system
  question: Quel est l'âge minimum requis pour demander un permis de conduire de classe
    1, 2, 3 ou 4 dans les Territoires du Nord-Ouest ?
  choices:
    A: 16 ans
    B: 18 ans
    C: 19 ans
    D: 21 ans
  answer: B
  explanation: Bien qu'une personne puisse obtenir un permis d'apprenti à 15 ans,
    elle doit avoir au moins 18 ans pour demander un permis de classe professionnelle
    ou commerciale (classes 1 à 4).
- id: 21
  category: license_system
  question: Un visiteur aux Territoires du Nord-Ouest peut conduire un véhicule automobile
    en utilisant son permis valide de l'extérieur du territoire pendant une période
    maximale de combien de mois ?
  choices:
    A: 1 mois
    B: 3 mois
    C: 6 mois
    D: 12 mois
  answer: B
  explanation: Les visiteurs aux TNO sont autorisés à conduire pendant une période
    allant jusqu'à trois mois en utilisant un permis valide d'une autre juridiction.
- id: 22
  category: license_system
  question: Pour sortir du programme de permis de conduire progressif (GDL) et obtenir
    un permis complet de classe 5, un conducteur de classe 5P doit n'avoir subi aucune
    suspension pendant au moins combien de temps ?
  choices:
    A: Les 6 derniers mois de la période de probation
    B: Les 12 derniers mois de la période de probation
    C: Toute la période de 2 ans du GDL
    D: 3 mois
  answer: B
  explanation: Pour obtenir un permis complet de classe 5, le conducteur doit avoir
    terminé l'étape probatoire de 12 mois (5P) sans aucune suspension de permis.
- id: 23
  category: license_system
  question: 'Si le permis d''un conducteur est suspendu en raison d''une première
    accumulation de points d''inaptitude, la période de suspension est généralement
    de :'
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 90 jours
  answer: C
  explanation: Une première suspension pour avoir atteint la limite de points d'inaptitude
    (6 pour le GDL, 15 pour le permis complet) aux TNO entraîne une suspension de
    permis de 30 jours (un mois).
- id: 24
  category: license_system
  question: Quelle classe de permis est requise pour conduire un autobus ayant une
    capacité de plus de 24 passagers ?
  choices:
    A: Classe 2
    B: Classe 3
    C: Classe 4
    D: Classe 5
  answer: A
  explanation: Un permis de classe 2 est requis pour conduire tout autobus ayant une
    capacité de plus de 24 passagers (incluant le conducteur).
- id: 25
  category: license_system
  question: Lors d'une demande de permis de conduire des TNO, lequel des éléments
    suivants doit être prouvé par le demandeur ?
  choices:
    A: Nom légal et date de naissance
    B: Résidence aux Territoires du Nord-Ouest
    C: Droit de séjour au Canada
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: Les demandeurs doivent fournir des documents prouvant leur nom légal,
    leur date de naissance, leur résidence aux TNO et leur droit légal de séjour au
    Canada.
- id: 26
  category: license_system
  question: Quelle est la norme de vision minimale requise pour obtenir un permis
    de classe 5 aux Territoires du Nord-Ouest ?
  choices:
    A: 20/20 dans les deux yeux
    B: 20/40 dans le meilleur œil
    C: 20/60 dans les deux yeux
    D: 20/100 dans un œil
  answer: B
  explanation: L'exigence de vision minimale pour un permis de classe 5 aux TNO est
    une acuité visuelle de 20/40 dans le meilleur œil, avec ou sans lentilles correctrices.
- id: 27
  category: license_system
  question: Si vous êtes un co-conducteur (superviseur) pour un apprenti conducteur
    de classe 7, quel est le taux d'alcoolémie (BAC) maximal que vous êtes autorisé
    à avoir ?
  choices:
    A: 0,00
    B: 0,02
    C: 0,05
    D: 0,08
  answer: C
  explanation: Aux TNO, la personne qui supervise un apprenti conducteur (le co-conducteur)
    doit avoir un taux d'alcoolémie (BAC) inférieur à 0,05.
- id: 28
  category: license_system
  question: Quelle classe de permis permet au titulaire de conduire un véhicule à
    3 essieux ou plus, comme un camion à benne basculante, mais PAS un camion semi-remorque
    ?
  choices:
    A: Classe 1
    B: Classe 2
    C: Classe 3
    D: Classe 4
  answer: C
  explanation: Un permis de classe 3 permet de conduire un véhicule simple à 3 essieux
    ou plus, ou un véhicule à 3 essieux remorquant une remorque non équipée de freins
    à air.
- id: 29
  category: driver_testing
  question: Pour satisfaire aux normes de vision pour un permis de conduire aux Territoires
    du Nord-Ouest, un demandeur doit avoir une acuité visuelle minimale de combien
    dans son meilleur œil ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Selon les normes de délivrance des permis de conduire des TNO, un demandeur
    doit avoir une acuité visuelle minimale de 20/40 dans au moins un œil, avec ou
    sans lentilles correctrices.
- id: 30
  category: driver_testing
  question: Si vous échouez à votre examen de conduite initial aux Territoires du
    Nord-Ouest, quel est le délai d'attente minimal avant de pouvoir tenter l'examen
    à nouveau ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: C
  explanation: Aux Territoires du Nord-Ouest, si un demandeur échoue à un examen de
    conduite, il doit attendre un minimum de 14 jours avant de pouvoir repasser l'examen.
- id: 31
  category: driver_testing
  question: Lors d'un examen pratique dans les TNO, lequel des éléments suivants entraînera
    un échec automatique immédiat ?
  choices:
    A: Oublier d'utiliser un clignotant une seule fois
    B: Une action qui oblige l'examinateur à prendre le contrôle du véhicule pour
      éviter une collision
    C: Conduire à 2 km/h sous la limite de vitesse
    D: Régler les rétroviseurs pendant un arrêt à un feu rouge
  answer: B
  explanation: Toute action dangereuse, infraction au code de la route ou situation
    où l'examinateur doit intervenir pour prévenir un accident entraîne un échec immédiat
    à l'examen pratique.
- id: 32
  category: driver_testing
  question: Aux Territoires du Nord-Ouest, combien de points d'inaptitude sont inscrits
    à votre dossier de conduite pour un dépassement de la limite de vitesse de 1 à
    15 km/h ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: Le système de points d'inaptitude des TNO attribue 2 points pour un
    excès de vitesse de 1 à 15 km/h au-dessus de la limite affichée.
- id: 33
  category: driver_testing
  question: Quel est le montant minimum de l'assurance responsabilité civile (envers
    les tiers) requis pour un véhicule à moteur immatriculé aux Territoires du Nord-Ouest
    ?
  choices:
    A: 50 000 $
    B: 100 000 $
    C: 200 000 $
    D: 500 000 $
  answer: C
  explanation: La Loi sur les véhicules automobiles des Territoires du Nord-Ouest
    exige que tous les véhicules immatriculés détiennent une assurance responsabilité
    civile minimale de 200 000 $.
- id: 34
  category: driver_testing
  question: Sauf indication contraire, quelle est la limite de vitesse maximale sur
    une route principale à l'extérieur d'une municipalité aux Territoires du Nord-Ouest
    ?
  choices:
    A: 70 km/h
    B: 80 km/h
    C: 90 km/h
    D: 100 km/h
  answer: B
  explanation: Aux TNO, la limite de vitesse par défaut pour les routes situées à
    l'extérieur des limites municipales est de 80 km/h, à moins que des panneaux n'indiquent
    le contraire.
- id: 35
  category: driver_testing
  question: 'Aux Territoires du Nord-Ouest, vous devez signaler immédiatement un accident
    de la route à la police si les dommages matériels totaux semblent dépasser :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: Selon la loi des TNO, les accidents impliquant des blessures, un décès
    ou des dommages matériels supérieurs à 2 000 $ doivent être signalés au service
    de police le plus proche.
- id: 36
  category: driver_testing
  question: Combien de points d'inaptitude sont inscrits à votre permis de conduire
    des TNO pour avoir omis de rester sur les lieux d'un accident ?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 9 points
  answer: C
  explanation: Le délit de fuite (omission de rester sur les lieux d'un accident)
    est une infraction grave aux TNO et entraîne une pénalité de 7 points d'inaptitude.
- id: 37
  category: driver_testing
  question: Quelle est la note de passage pour l'examen théorique écrit de classe
    7 aux Territoires du Nord-Ouest ?
  choices:
    A: 70 % (14 sur 20)
    B: 75 % (15 sur 20)
    C: 80 % (16 sur 20)
    D: 90 % (18 sur 20)
  answer: C
  explanation: Pour réussir l'examen théorique écrit des TNO, un candidat doit répondre
    correctement à au moins 16 questions sur 20 (80 %).
- id: 38
  category: driver_testing
  question: Aux Territoires du Nord-Ouest, un conducteur titulaire d'un permis complet
    ayant un taux d'alcoolémie (BAC) compris entre 0,05 et 0,08 fera face à une suspension
    immédiate de son permis sur le bord de la route de quelle durée pour une première
    infraction ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: A
  explanation: Les conducteurs titulaires d'un permis complet se situant dans la zone
    d'avertissement (0,05 à 0,08 de BAC) sont passibles d'une suspension immédiate
    de permis de 24 heures pour une première occurrence.
- id: 39
  category: driver_testing
  question: Lors d'un examen pratique dans une municipalité des TNO, quelle est la
    limite de vitesse dans une zone scolaire lorsque des enfants sont présents ou
    pendant les heures de classe ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: La limite de vitesse standard pour les zones scolaires aux Territoires
    du Nord-Ouest est de 30 km/h, sauf indication contraire.
- id: 40
  category: driver_testing
  question: Combien de points d'inaptitude sont attribués pour avoir omis de s'arrêter
    pour un autobus scolaire dont les feux rouges clignotent et dont le bras d'arrêt
    est déployé ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: L'omission de s'arrêter pour un autobus scolaire dont les feux rouges
    clignotent est une infraction majeure à la sécurité aux TNO et entraîne 6 points
    d'inaptitude.
- id: 41
  category: driver_testing
  question: Dans les Territoires du Nord-Ouest (TNO), si vous êtes reconnu coupable
    de conduite tout en utilisant un appareil électronique portatif (conduite distraite),
    combien de points d'inaptitude sont ajoutés à votre dossier ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: La conduite distraite, comme l'utilisation d'un téléphone portable
    tenu à la main pendant la conduite d'un véhicule, entraîne une pénalité de 3 points
    d'inaptitude dans les Territoires du Nord-Ouest.
- id: 42
  category: driver_testing
  question: Avant de commencer un examen de conduite dans les TNO, l'examinateur effectuera
    une vérification de la sécurité du véhicule. Lequel des éléments suivants entraînerait
    l'annulation de l'examen ?
  choices:
    A: Le véhicule présente une petite fissure dans le pare-brise qui n'obstrue pas
      la vision
    B: Le véhicule n'est pas lavé
    C: Les feux de freinage ne fonctionnent pas
    D: Le réservoir de carburant n'est qu'à moitié plein
  answer: C
  explanation: Pour qu'un examen de conduite puisse avoir lieu, le véhicule doit être
    dans un état mécanique sûr. Des feux de freinage non fonctionnels constituent
    une infraction à la sécurité qui entraînera l'annulation de l'examen.
- id: 43
  category: driver_testing
  question: Pour réussir le test de vision pour un permis de classe 5 standard dans
    les Territoires du Nord-Ouest, quelle est l'acuité visuelle minimale requise pour
    votre meilleur œil (avec ou sans lentilles correctrices) ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Selon les normes de délivrance des permis de conduire des TNO, un demandeur
    doit avoir une acuité visuelle minimale de 20/40 dans le meilleur œil pour être
    admissible à un permis de conduire.
- id: 44
  category: driver_testing
  question: Sauf indication contraire, quelle est la limite de vitesse maximale dans
    une zone scolaire dans les Territoires du Nord-Ouest lorsque des enfants sont
    présents ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: La limite de vitesse standard dans les zones scolaires des Territoires
    du Nord-Ouest est de 30 km/h, à moins que des panneaux n'indiquent le contraire.
- id: 45
  category: driver_testing
  question: Combien de points d'inaptitude sont inscrits à votre dossier de conduite
    des TNO pour une condamnation pour « omission de s'arrêter pour un autobus scolaire
    » ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire dont les feux
    rouges clignotent est une infraction grave dans les TNO et entraîne une pénalité
    de 4 points d'inaptitude.
- id: 46
  category: driver_testing
  question: Dans les Territoires du Nord-Ouest, quel est le montant minimum de l'assurance
    responsabilité civile exigé par la loi ?
  choices:
    A: 100 000 $
    B: 200 000 $
    C: 500 000 $
    D: 1 000 000 $
  answer: B
  explanation: La Loi sur les véhicules automobiles des TNO exige que tous les véhicules
    soient couverts par une assurance responsabilité civile d'un montant minimum de
    200 000 $.
- id: 47
  category: driver_testing
  question: Entre quelles dates les pneus cloutés sont-ils autorisés sur les véhicules
    dans les Territoires du Nord-Ouest ?
  choices:
    A: Du 1er octobre au 30 avril
    B: Du 1er septembre au 31 mai
    C: Du 1er novembre au 31 mars
    D: Du 15 septembre au 15 juin
  answer: B
  explanation: Dans les TNO, les pneus cloutés sont légalement autorisés sur les routes
    du 1er septembre au 31 mai inclusivement.
- id: 48
  category: driver_testing
  question: Lorsque vous conduisez sur les routes des TNO à l'extérieur d'une municipalité,
    quelle est la loi concernant l'utilisation des phares ?
  choices:
    A: Les phares ne doivent être allumés qu'entre le coucher et le lever du soleil.
    B: Les phares ne doivent être allumés que pendant les périodes de mauvaise visibilité.
    C: Les phares de croisement doivent être allumés en tout temps.
    D: Les phares ne sont obligatoires que si le véhicule n'est pas équipé de feux
      de jour (DRL).
  answer: C
  explanation: Dans les Territoires du Nord-Ouest, les conducteurs sont tenus d'allumer
    leurs phares de croisement en tout temps lorsqu'ils circulent sur les grandes
    routes.
- id: 49
  category: driver_testing
  question: 'Dans les Territoires du Nord-Ouest, un demi-tour est interdit dans une
    courbe ou près du sommet d''une côte où le conducteur ne peut pas être vu par
    les autres usagers de la route à moins de :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Le code de la route des TNO interdit les demi-tours dans les courbes
    ou sur les côtes lorsqu'il y a moins de 150 mètres de visibilité dégagée dans
    les deux directions.
- id: 50
  category: driver_testing
  question: Lorsque vous stationnez un véhicule sur une voie publique dans les TNO,
    vous ne devez pas vous garer à moins de combien de mètres d'une borne d'incendie
    ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: C
  explanation: Il est illégal de stationner un véhicule à moins de 5 mètres d'une
    borne d'incendie dans les Territoires du Nord-Ouest.
- id: 51
  category: driver_testing
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    pour une condamnation de « conduite imprudente » dans les Territoires du Nord-Ouest
    ?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: La conduite imprudente est une infraction majeure dans les TNO et entraîne
    l'ajout de 6 points d'inaptitude au dossier du conducteur.
- id: 52
  category: driver_testing
  question: À l'approche d'un feu jaune fixe à une intersection dans les TNO, que
    doit faire un conducteur ?
  choices:
    A: Accélérer pour dégager l'intersection avant qu'elle ne passe au rouge.
    B: S'arrêter avant d'entrer dans l'intersection, à moins que l'arrêt ne puisse
      être effectué en toute sécurité.
    C: S'arrêter immédiatement, même s'il se trouve au milieu de l'intersection.
    D: Continuer comme s'il s'agissait d'un feu vert.
  answer: B
  explanation: Un feu jaune signifie que le signal est sur le point de passer au rouge.
    Les conducteurs doivent s'arrêter avant l'intersection, à moins qu'ils n'y soient
    déjà engagés ou qu'ils ne puissent s'arrêter en toute sécurité.
- id: 53
  category: driver_responsibility
  question: Dans les Territoires du Nord-Ouest, qui est légalement responsable de
    s'assurer qu'un passager de moins de 16 ans porte correctement sa ceinture de
    sécurité ?
  choices:
    A: Le passager
    B: Le conducteur du véhicule
    C: Le propriétaire du véhicule
    D: Les parents du passager, même s'ils ne sont pas dans le véhicule
  answer: B
  explanation: Le conducteur est responsable de s'assurer que tous les passagers de
    moins de 16 ans sont correctement attachés par une ceinture de sécurité ou un
    dispositif de retenue pour enfants approprié.
- id: 54
  category: driver_responsibility
  question: Lorsque vous vendez un véhicule dans les Territoires du Nord-Ouest, que
    devez-vous faire des plaques d'immatriculation ?
  choices:
    A: Les laisser sur le véhicule pour le nouveau propriétaire
    B: Les retourner au détachement de la GRC le plus proche
    C: Les retirer et les conserver pour votre propre usage futur ou les retourner
      à un bureau de délivrance
    D: Les donner au nouveau propriétaire pour qu'il les détruise
  answer: C
  explanation: Dans les TNO, les plaques d'immatriculation sont délivrées au propriétaire
    et non au véhicule. Lorsqu'un véhicule est vendu, le vendeur doit retirer les
    plaques.
- id: 55
  category: driver_responsibility
  question: Quelle est la conséquence pour un conducteur des TNO qui est pris à conduire
    un véhicule à moteur sans assurance valide ?
  choices:
    A: Un avertissement verbal pour la première infraction
    B: Une mise en fourrière obligatoire de 24 heures seulement
    C: Une amende importante et une suspension obligatoire du permis de conduire
    D: Il n'y a pas de sanction si l'assurance est achetée dans les 48 heures
  answer: C
  explanation: La conduite d'un véhicule non assuré est une infraction grave dans
    les TNO, entraînant des amendes importantes et une suspension obligatoire du permis
    de conduire.
- id: 56
  category: driver_responsibility
  question: Si vous êtes impliqué dans un accident où quelqu'un est blessé, quelle
    est votre première responsabilité légale ?
  choices:
    A: Se rendre au poste de police le plus proche pour signaler l'accident
    B: Rester sur les lieux et prêter toute l'assistance raisonnable
    C: Appeler immédiatement votre agent d'assurance
    D: Déplacer les véhicules hors de la route avant de vérifier s'il y a des blessés
  answer: B
  explanation: En vertu de la Loi sur les véhicules automobiles des TNO, les conducteurs
    impliqués dans un accident doivent rester sur les lieux, fournir leurs renseignements
    et prêter toute l'assistance raisonnable à toute personne blessée.
- id: 57
  category: driver_responsibility
  question: Dans les TNO, l'immatriculation des véhicules expire annuellement. Comment
    la date d'expiration est-elle déterminée pour les particuliers ?
  choices:
    A: Le jour de l'anniversaire du propriétaire
    B: Le 31 décembre de chaque année
    C: En fonction de la première lettre du nom de famille du propriétaire
    D: Exactement un an après la date d'achat du véhicule
  answer: C
  explanation: Les Territoires du Nord-Ouest utilisent un système d'immatriculation
    échelonné où le mois d'expiration est déterminé par la première lettre du nom
    de famille du propriétaire.
- id: 58
  category: driver_responsibility
  question: Si un conducteur des TNO ne paie pas un jugement ordonné par le tribunal
    pour des dommages résultant d'un accident de véhicule à moteur, quelle mesure
    le registraire prendra-t-il ?
  choices:
    A: Augmenter les primes d'assurance du conducteur
    B: Suspendre le permis de conduire jusqu'à ce que le jugement soit satisfait
    C: Saisir le véhicule du conducteur de façon permanente
    D: Émettre un avis d'avertissement de 30 jours
  answer: B
  explanation: Le registraire des véhicules automobiles a le pouvoir de suspendre
    le permis de tout conducteur qui ne satisfait pas à un jugement pour des dommages
    découlant d'un accident de véhicule à moteur.
- id: 59
  category: driver_responsibility
  question: 'Si un agent de la paix détermine qu''un véhicule est dans un état si
    dangereux qu''il peut causer un accident, il a le pouvoir de :'
  choices:
    A: Donner un avertissement et permettre au conducteur de continuer pendant 48
      heures
    B: Ordonner le retrait immédiat du véhicule de la route
    C: Donner une amende de 50 $ au conducteur et le laisser partir
    D: Seul le propriétaire peut décider si le véhicule est trop dangereux pour être
      conduit
  answer: B
  explanation: Les agents de la paix dans les TNO ont le pouvoir d'ordonner le retrait
    des véhicules dangereux de la route pour assurer la sécurité publique.
- id: 60
  category: driver_responsibility
  question: Laquelle des conditions suivantes est requise pour qu'un véhicule puisse
    circuler légalement sur les routes des TNO ?
  choices:
    A: Le véhicule doit être muni d'un extincteur
    B: Le véhicule doit être immatriculé et arborer des plaques d'immatriculation
      valides
    C: Le conducteur doit avoir en tout temps une copie de l'acte de vente du véhicule
    D: Le véhicule doit être équipé d'un dispositif de repérage GPS
  answer: B
  explanation: Tous les véhicules à moteur circulant sur les routes des TNO doivent
    être immatriculés auprès du ministère de l'Infrastructure et doivent arborer des
    plaques d'immatriculation valides.
- id: 61
  category: driver_responsibility
  question: 'Aux TNO, si vous êtes reconnu coupable de conduite pendant que votre
    permis est suspendu, la période de suspension supplémentaire minimale est généralement
    de :'
  choices:
    A: 3 mois
    B: 6 mois
    C: 1 an
    D: 2 ans
  answer: B
  explanation: Conduire pendant une suspension est une infraction grave. En plus des
    amendes, cela entraîne généralement une suspension supplémentaire de 6 mois des
    privilèges de conduite.
- id: 62
  category: driver_responsibility
  question: Qu'advient-il des points d'inaptitude sur votre dossier de conduite des
    TNO deux ans après la date de la condamnation ?
  choices:
    A: Ils restent sur votre dossier indéfiniment
    B: Ils sont réduits de moitié
    C: Ils sont supprimés de votre dossier
    D: Ils doublent de valeur
  answer: C
  explanation: Dans les Territoires du Nord-Ouest, les points d'inaptitude sont supprimés
    de votre dossier de conduite deux ans après la date de la condamnation.
- id: 63
  category: driver_responsibility
  question: Selon le système de points d'inaptitude des Territoires du Nord-Ouest,
    combien de points sont attribués pour un « défaut de rester sur les lieux d'un
    accident » ?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 9 points
  answer: C
  explanation: Le défaut de rester sur les lieux d'un accident est une infraction
    grave aux TNO et entraîne l'ajout de 7 points d'inaptitude au dossier du conducteur.
- id: 64
  category: driver_responsibility
  question: Aux TNO, le conducteur d'un véhicule est légalement responsable de s'assurer
    que tous les passagers de moins de quel âge sont correctement attachés par une
    ceinture de sécurité ou un siège de sécurité pour enfant ?
  choices:
    A: Moins de 12 ans
    B: Moins de 14 ans
    C: Moins de 16 ans
    D: Moins de 18 ans
  answer: C
  explanation: Le conducteur est responsable de s'assurer que tous les passagers de
    moins de 16 ans sont correctement attachés dans le véhicule.
- id: 65
  category: driver_responsibility
  question: 'Si un conducteur est pris en train de conduire un véhicule alors que
    son permis de conduire des TNO est suspendu, le véhicule sera mis en fourrière
    pour une période de :'
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: C
  explanation: En vertu de la Loi sur les véhicules automobiles des TNO, la conduite
    pendant une suspension entraîne une mise en fourrière automatique du véhicule
    de 30 jours, que le conducteur soit ou non le propriétaire du véhicule.
- id: 66
  category: driver_responsibility
  question: Quelle est l'amende maximale pour une première infraction de conduite
    d'un véhicule à moteur sans assurance valide dans les Territoires du Nord-Ouest
    ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 500 $
    D: 5 000 $
  answer: C
  explanation: Conduire un véhicule non assuré est une infraction grave aux TNO, passible
    d'une amende allant jusqu'à 2 500 $ pour une première infraction, plus une suramende
    compensatoire pour les victimes.
- id: 67
  category: driver_responsibility
  question: Lorsque vous achetez un véhicule dans les Territoires du Nord-Ouest, vous
    devez aviser le registraire et enregistrer le transfert de propriété dans un délai
    de combien de jours ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 15 jours
    D: 30 jours
  answer: B
  explanation: La Loi sur les véhicules automobiles des TNO exige qu'un transfert
    de propriété de véhicule soit enregistré auprès du registraire des véhicules automobiles
    dans les 7 jours suivant la transaction.
- id: 68
  category: driver_responsibility
  question: Dans les Territoires du Nord-Ouest, si un jugement du tribunal est rendu
    contre vous pour des dommages résultant d'un accident de véhicule à moteur et
    que vous ne le payez pas, qu'arrive-t-il ?
  choices:
    A: Votre véhicule est vendu aux enchères
    B: Votre permis de conduire et l'immatriculation de votre véhicule sont suspendus
    C: Vous devez repasser votre examen de conduite
    D: Rien ne se passe jusqu'au renouvellement de votre permis
  answer: B
  explanation: Le registraire a le pouvoir de suspendre le permis de conduire et l'immatriculation
    du véhicule de toute personne qui ne satisfait pas à un jugement pour des dommages
    causés par un véhicule à moteur.
- id: 69
  category: driver_responsibility
  question: Où doit être conservé le certificat d'immatriculation d'un véhicule à
    moteur pendant que le véhicule est utilisé aux TNO ?
  choices:
    A: Dans le véhicule
    B: Au domicile du propriétaire
    C: Au lieu de travail du propriétaire
    D: Dans le portefeuille du propriétaire
  answer: A
  explanation: Le certificat d'immatriculation (ou une copie) doit se trouver dans
    le véhicule en tout temps lorsqu'il circule sur une route.
- id: 70
  category: driver_responsibility
  question: 'Lorsqu''un agent de la paix demande une preuve de responsabilité financière
    (assurance), le conducteur doit :'
  choices:
    A: La fournir dans les 48 heures
    B: La fournir dans les 7 jours
    C: La présenter immédiatement
    D: L'envoyer par la poste au poste de police
  answer: C
  explanation: Les conducteurs aux TNO doivent être en mesure de présenter une carte
    d'assurance valide immédiatement à la demande d'un agent de la paix.
- id: 71
  category: driver_responsibility
  question: 'Il incombe au conducteur de s''assurer que les vitres du véhicule sont
    exemptes de neige et de glace. Le non-respect de cette consigne peut entraîner
    une amende pour :'
  choices:
    A: Conduite acrobatique
    B: Conduite d'un véhicule avec une vue obstruée
    C: Chargement mal arrimé
    D: Conduite distraite
  answer: B
  explanation: La Loi sur les véhicules automobiles des TNO exige que le conducteur
    ait une vue dégagée vers l'avant, les côtés et l'arrière. Conduire avec de la
    neige ou de la glace obstruant les vitres est une infraction à la sécurité.
- id: 72
  category: safe_driving_rules
  question: Aux Territoires du Nord-Ouest, quelle est la limite de vitesse à l'intérieur
    d'une municipalité, sauf indication contraire ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: Selon le Guide de base du conducteur des TNO, la limite de vitesse
    standard à l'intérieur d'une municipalité est de 50 km/h, à moins que des panneaux
    n'indiquent une limite différente.
- id: 73
  category: safe_driving_rules
  question: Lorsque vous stationnez votre véhicule aux Territoires du Nord-Ouest,
    quelle est la distance minimale à respecter par rapport à une borne d'incendie
    ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: C
  explanation: Le règlement sur la conduite aux TNO stipule que vous ne devez pas
    stationner un véhicule à moins de 5 mètres d'une borne d'incendie.
- id: 74
  category: safe_driving_rules
  question: Selon la loi des TNO, un demi-tour est interdit dans une courbe ou près
    du sommet d'une côte si le conducteur ne peut pas voir clairement sur au moins
    combien de mètres dans les deux directions ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Le Guide de base du conducteur des TNO précise que les demi-tours sont
    illégaux lorsque la visibilité est obstruée à moins de 150 mètres dans l'une ou
    l'autre direction.
- id: 75
  category: safe_driving_rules
  question: Quelle est la distance de suivi recommandée derrière un autre véhicule
    dans des conditions de conduite normales aux Territoires du Nord-Ouest ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 4 secondes
    D: La longueur d'une voiture pour chaque 10 km/h
  answer: B
  explanation: Le guide des TNO recommande une distance de suivi minimale d'au moins
    2 secondes derrière le véhicule qui vous précède dans des conditions idéales.
- id: 76
  category: safe_driving_rules
  question: Lorsqu'un autobus scolaire est arrêté avec ses feux rouges clignotants
    et son bras d'arrêt déployé, à quelle distance devez-vous arrêter votre véhicule
    ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Aux Territoires du Nord-Ouest, vous devez arrêter votre véhicule à
    au moins 5 mètres de l'avant ou de l'arrière d'un autobus scolaire lorsque ses
    feux rouges clignotent.
- id: 77
  category: safe_driving_rules
  question: Lorsque vous conduisez dans une ville ou un village aux TNO, combien de
    distance à l'avance devez-vous signaler avant d'effectuer un virage ?
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 50 mètres
    D: 100 mètres
  answer: B
  explanation: Dans les zones urbaines (villes ou villages), vous devez signaler au
    moins 30 mètres avant de tourner. Dans les zones rurales, cette distance passe
    à 150 mètres.
- id: 78
  category: safe_driving_rules
  question: Aux Territoires du Nord-Ouest, il est illégal de stationner votre véhicule
    à moins de combien de mètres d'un panneau d'arrêt ou d'un passage pour piétons
    ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 8 mètres
    D: 10 mètres
  answer: B
  explanation: Le Guide de base du conducteur des TNO stipule que vous ne devez pas
    vous stationner à moins de 5 mètres d'un panneau d'arrêt, d'un panneau de cédez
    le passage ou d'un passage pour piétons.
- id: 79
  category: safe_driving_rules
  question: Lorsqu'un véhicule d'urgence (ambulance, camion de pompiers ou voiture
    de police) s'approche de vous de n'importe quelle direction avec sa sirène ou
    ses feux clignotants, que devez-vous faire ?
  choices:
    A: Accélérer pour dégager la voie
    B: S'arrêter immédiatement exactement là où vous êtes
    C: Se ranger sur le bord droit de la route et s'arrêter
    D: Se ranger sur le bord gauche de la route et s'arrêter
  answer: C
  explanation: Les conducteurs doivent immédiatement se diriger vers la bordure ou
    le bord droit de la route, à l'écart de toute intersection, et s'arrêter jusqu'à
    ce que le véhicule d'urgence soit passé.
- id: 80
  category: safe_driving_rules
  question: 'Selon la loi sur le « corridor de sécurité » (Move Over) des TNO, lorsque
    vous dépassez un véhicule d''urgence arrêté avec ses feux clignotants sur une
    autoroute où la limite de vitesse est de 100 km/h, vous devez ralentir à au moins
    :'
  choices:
    A: 80 km/h
    B: 70 km/h
    C: 60 km/h
    D: 50 km/h
  answer: C
  explanation: Aux TNO, si la limite de vitesse affichée est de 60 km/h ou plus, vous
    devez ralentir à 60 km/h lorsque vous dépassez des véhicules d'urgence arrêtés
    avec des feux clignotants. Si la limite est inférieure à 60 km/h, vous devez ralentir
    à la limite affichée.
- id: 81
  category: safe_driving_rules
  question: Lorsque vous vous arrêtez à un passage à niveau dans les Territoires du
    Nord-Ouest, quelle est la distance minimale à laquelle vous devez vous arrêter
    du rail le plus proche ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Les conducteurs doivent s'arrêter à une distance d'au moins 5 mètres
    et d'au plus 15 mètres du rail le plus proche à un passage à niveau.
- id: 82
  category: safe_driving_rules
  question: Lorsque vous stationnez un véhicule face à la montée sur une route à deux
    sens avec une bordure de trottoir, comment les roues avant doivent-elles être
    tournées ?
  choices:
    A: Vers la droite (vers la bordure)
    B: Vers la gauche (vers le centre de la route)
    C: Parallèles à la bordure
    D: Cela n'a pas d'importance
  answer: B
  explanation: Lors d'un stationnement en montée avec une bordure, tournez les roues
    vers la gauche de sorte que si le véhicule recule, l'arrière du pneu avant heurtera
    la bordure et arrêtera la voiture.
- id: 83
  category: safe_driving_rules
  question: 'Dans les Territoires du Nord-Ouest, vous devez allumer vos phares chaque
    fois que la visibilité est réduite à moins de :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Le Guide de base du conducteur des TNO exige l'utilisation des phares
    chaque fois que vous ne pouvez pas voir clairement à une distance de 150 mètres.
- id: 84
  category: safe_driving_rules
  question: Dans les Territoires du Nord-Ouest, à quelle distance d'une borne d'incendie
    devez-vous vous stationner ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: B
  explanation: Selon la réglementation des TNO, il est interdit de stationner à moins
    de 3 mètres d'une borne d'incendie.
- id: 85
  category: safe_driving_rules
  question: Lorsque vous approchez d'un autobus scolaire de n'importe quelle direction
    sur une route non divisée alors que ses feux rouges clignotent, à quelle distance
    de l'autobus devez-vous vous arrêter ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Aux TNO, les conducteurs doivent s'arrêter à au moins 5 mètres d'un
    autobus scolaire lorsque ses feux rouges clignotent et que son bras d'arrêt est
    déployé.
- id: 86
  category: safe_driving_rules
  question: Lorsque vous tournez dans une ville ou une municipalité, combien de temps
    à l'avance devez-vous signaler votre intention de tourner ?
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 50 mètres
    D: 100 mètres
  answer: B
  explanation: Le Guide du conducteur des TNO précise que vous devez signaler votre
    intention au moins 30 mètres avant d'effectuer un virage en zone urbaine.
- id: 87
  category: safe_driving_rules
  question: Quelle est la distance minimale que vous devez maintenir lorsque vous
    suivez un autre véhicule dans des conditions normales aux TNO ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 4 secondes
    D: La longueur d'une voiture pour chaque 10 km/h
  answer: B
  explanation: Les TNO utilisent la « règle des deux secondes » comme distance de
    sécurité minimale à maintenir dans des conditions de conduite idéales.
- id: 88
  category: safe_driving_rules
  question: Il est interdit de se stationner à moins de combien de mètres d'un panneau
    d'arrêt ou d'un panneau de cédez le passage ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Dans les Territoires du Nord-Ouest, vous ne devez pas vous stationner
    à moins de 5 mètres d'un panneau d'arrêt, d'un panneau de cédez le passage ou
    d'un passage pour piétons marqué.
- id: 89
  category: safe_driving_rules
  question: Lorsque vous conduisez de nuit, vous devez passer de vos feux de route
    aux feux de croisement lorsqu'un véhicule venant en sens inverse se trouve à quelle
    distance ?
  choices:
    A: 150 mètres
    B: 200 mètres
    C: 300 mètres
    D: 500 mètres
  answer: C
  explanation: La loi des TNO exige que les conducteurs passent aux feux de croisement
    lorsqu'un véhicule venant en sens inverse se trouve à moins de 300 mètres pour
    éviter d'éblouir l'autre conducteur.
- id: 90
  category: safe_driving_rules
  question: Lorsque vous suivez un autre véhicule de nuit, à quelle distance devez-vous
    passer de vos feux de route aux feux de croisement ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 300 mètres
  answer: C
  explanation: Vous devez passer de vos feux de route aux feux de croisement lorsque
    vous suivez un autre véhicule à moins de 150 mètres.
- id: 91
  category: safe_driving_rules
  question: Lorsque vous stationnez un véhicule en pente ascendante sur une rue avec
    une bordure de trottoir, dans quelle direction devez-vous tourner vos roues avant
    ?
  choices:
    A: Vers la droite (vers la bordure)
    B: Vers la gauche (à l'opposé de la bordure)
    C: Les garder droites
    D: Cela n'a pas d'importance
  answer: B
  explanation: Lorsque vous stationnez en montée avec une bordure de trottoir, tournez
    les roues vers la gauche de sorte que si le véhicule recule, l'arrière du pneu
    avant heurtera la bordure et arrêtera la voiture.
- id: 92
  category: safe_driving_rules
  question: Les demi-tours sont interdits dans les Territoires du Nord-Ouest dans
    lequel des endroits suivants ?
  choices:
    A: Dans un virage
    B: Près du sommet d'une côte où la visibilité est inférieure à 150 mètres
    C: Là où un panneau l'interdit
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: Les demi-tours sont illégaux dans les virages, près des sommets de
    collines avec une visibilité limitée, et partout où la signalisation interdit
    la manœuvre.
- id: 93
  category: safe_driving_rules
  question: Lorsque vous dépassez une bicyclette, quelle est la distance minimale
    recommandée que vous devez maintenir entre votre véhicule et le cycliste ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 2 mètres
    D: 3 mètres
  answer: B
  explanation: Le Guide du conducteur des TNO recommande de laisser aux cyclistes
    au moins 1 mètre d'espace lors d'un dépassement.
- id: 94
  category: safe_driving_rules
  question: Dans les Territoires du Nord-Ouest, il est interdit de dépasser un autre
    véhicule à moins de combien de mètres d'un passage à niveau ?
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 50 mètres
    D: 100 mètres
  answer: B
  explanation: Le dépassement est interdit à moins de 30 mètres d'un passage à niveau
    dans les Territoires du Nord-Ouest.
- id: 95
  category: safe_driving_rules
  question: 'Lorsqu''un véhicule d''urgence avec sirènes et feux clignotants s''approche
    de l''une ou l''autre direction sur une route à deux sens, vous devez :'
  choices:
    A: Accélérer pour libérer le passage
    B: S'arrêter exactement là où vous êtes
    C: Se ranger sur le bord droit de la chaussée et s'arrêter
    D: Se ranger sur le bord gauche de la chaussée et s'arrêter
  answer: C
  explanation: Les conducteurs doivent immédiatement se ranger vers la bordure droite
    ou le bord de la route et s'arrêter jusqu'à ce que le véhicule d'urgence soit
    passé.
- id: 96
  category: defensive_driving
  question: Pour pratiquer un balayage visuel adéquat, le Guide du conducteur des
    TNO suggère que les conducteurs regardent à quelle distance devant leur véhicule
    ?
  choices:
    A: 2 à 5 secondes
    B: 5 à 8 secondes
    C: 12 à 15 secondes
    D: 20 à 30 secondes
  answer: C
  explanation: Les conducteurs experts balaient la route du regard 12 à 15 secondes
    devant leur véhicule pour anticiper les dangers et se préparer aux changements
    de circulation.
- id: 97
  category: defensive_driving
  question: Dans les Territoires du Nord-Ouest, le « brouillard givrant » est un danger
    hivernal courant. Quelle est la manière la plus sûre de conduire à travers celui-ci
    ?
  choices:
    A: Allumer les feux de route pour voir plus loin
    B: Utiliser les feux de croisement et réduire la vitesse
    C: Maintenir la vitesse mais klaxonner fréquemment
    D: Conduire avec seulement les feux de stationnement allumés
  answer: B
  explanation: Le brouillard givrant réfléchit la lumière vers le conducteur ; les
    feux de route aggravent la visibilité. Vous devez utiliser les feux de croisement,
    réduire votre vitesse et surveiller les feux arrière devant vous.
- id: 98
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une route mouillée,
    que devez-vous faire ?
  choices:
    A: Freiner brusquement pour regagner de l'adhérence
    B: Accélérer pour traverser l'eau plus rapidement
    C: Relâcher la pédale d'accélérateur et diriger le volant dans la direction où
      vous voulez aller
    D: Tourner le volant brusquement vers la gauche
  answer: C
  explanation: En cas d'aquaplanage, ne freinez pas. Relâchez l'accélérateur pour
    ralentir jusqu'à ce que les pneus reprennent contact avec la route, et gardez
    le volant droit ou dirigez-le doucement dans la direction souhaitée.
- id: 99
  category: defensive_driving
  question: Lorsque vous conduisez sur des routes de gravier courantes aux TNO, pourquoi
    devriez-vous augmenter votre distance de suivi au-delà des deux secondes standard
    ?
  choices:
    A: Pour éviter les nuages de poussière qui réduisent la visibilité
    B: Pour éviter les dommages au pare-brise causés par les projections de pierres
    C: Parce que les distances de freinage sont plus longues sur le gravier
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: Les routes de gravier offrent moins d'adhérence, créent de la poussière
    qui obscurcit la vision et présentent un risque de projections de pierres. L'augmentation
    de la distance de suivi permet de faire face à tous ces dangers.
- id: 100
  category: defensive_driving
  question: Aux TNO, si vous rencontrez un bison des bois sur la route, quelle est
    l'action de conduite défensive la plus sûre ?
  choices:
    A: Klaxonner bruyamment pour l'effrayer
    B: Ralentir ou s'arrêter, et attendre que l'animal quitte la route
    C: Faire des appels de phares et le contourner rapidement
    D: Sortir de la voiture pour diriger l'animal hors de la route
  answer: B
  explanation: Les bisons sont imposants, imprévisibles et fréquents sur les routes
    des TNO. Les conducteurs doivent ralentir, être patients et leur laisser beaucoup
    d'espace pour qu'ils quittent la route d'eux-mêmes.
- id: 101
  category: defensive_driving
  question: En conduisant dans des conditions hivernales, qu'est-ce que la « glace
    noire » ?
  choices:
    A: De la glace mélangée à de la saleté provenant de la route
    B: Une couche de glace fine et transparente qui ressemble à une route mouillée
    C: De la glace qui ne se forme que la nuit
    D: De la neige qui a été compactée par les pneus
  answer: B
  explanation: La glace noire est une couche de glace fine et presque invisible qui
    se forme sur la surface de la route, apparaissant souvent comme une plaque mouillée
    inoffensive. Elle est extrêmement glissante.
- id: 102
  category: defensive_driving
  question: 'Si vous conduisez un véhicule sans freins antiblocage (ABS) et que vous
    devez vous arrêter rapidement sur une route glissante, vous devriez :'
  choices:
    A: Bloquer les freins et les maintenir ainsi jusqu'à l'arrêt
    B: Utiliser le « freinage dégressif » (appliquer une pression ferme et constante
      juste avant le blocage)
    C: Mettre le véhicule au point mort et utiliser le frein d'urgence
    D: Pomper les freins aussi vite que possible
  answer: B
  explanation: Pour les véhicules sans ABS, le freinage dégressif est le moyen le
    plus efficace de s'arrêter rapidement sur des surfaces glissantes sans perdre
    le contrôle de la direction.
- id: 103
  category: defensive_driving
  question: Lorsqu'un gros camion tourne à droite à une intersection, de quoi un conducteur
    prudent doit-il être conscient ?
  choices:
    A: Le camion restera toujours dans la voie la plus à droite
    B: Le camion peut avoir besoin de dévier largement vers la gauche pour éviter
      la bordure du trottoir
    C: Le camion peut s'arrêter beaucoup plus vite qu'une voiture
    D: Le camion n'a pas d'angles morts sur le côté droit
  answer: B
  explanation: Les véhicules de grande taille ont un rayon de braquage large et peuvent
    avoir besoin de s'engager dans la voie de gauche pour effectuer un virage à droite.
    N'essayez jamais de dépasser un camion par la droite à une intersection.
- id: 104
  category: defensive_driving
  question: Qu'est-ce que l'« angle mort » d'un véhicule ?
  choices:
    A: La zone située directement devant le capot
    B: La zone à l'arrière gauche et droite du véhicule qui n'est pas visible dans
      les rétroviseurs
    C: La zone bloquée par le rétroviseur intérieur
    D: La zone visible uniquement lors de l'utilisation des feux de route
  answer: B
  explanation: Les angles morts sont des zones autour de votre véhicule que vous ne
    pouvez pas voir dans vos rétroviseurs. Vous devez tourner la tête pour vérifier
    ces zones avant de changer de voie.
- id: 105
  category: defensive_driving
  question: Aux TNO, quand la loi vous oblige-t-elle à allumer vos phares ?
  choices:
    A: Uniquement entre 23 h 00 et 5 h 00
    B: D'une demi-heure après le coucher du soleil à une demi-heure avant le lever
      du soleil
    C: Uniquement lorsqu'il neige ou qu'il pleut
    D: Uniquement lors de la conduite sur des routes non pavées
  answer: B
  explanation: Les phares doivent être utilisés d'une demi-heure après le coucher
    du soleil à une demi-heure avant le lever du soleil, et à tout autre moment où
    la visibilité est réduite à moins de 150 mètres.
- id: 106
  category: defensive_driving
  question: Lorsque vous conduisez sur une route à deux voies aux TNO et qu'un autre
    véhicule vous dépasse, que devriez-vous faire ?
  choices:
    A: Accélérer pour l'empêcher de passer
    B: Vous déplacer vers la gauche pour mieux voir la circulation en sens inverse
    C: Rester dans votre voie et maintenir ou réduire légèrement votre vitesse
    D: Allumer vos feux de route pour aider l'autre conducteur à voir
  answer: C
  explanation: Lorsque vous êtes dépassé, vous devriez aider l'autre conducteur en
    maintenant une vitesse constante et en restant dans votre voie. Si le dépassement
    est difficile, réduire légèrement la vitesse peut aider le conducteur à revenir
    dans la voie en toute sécurité.
- id: 107
  category: defensive_driving
  question: Pourquoi la surface de la route est-elle la plus glissante pendant les
    premières minutes d'une averse ?
  choices:
    A: L'eau refroidit les pneus, réduisant l'adhérence
    B: La pluie se mélange à l'huile et à la graisse sur la route pour créer une pellicule
      glissante
    C: La pluie crée un vide entre le pneu et la route
    D: La surface de la route se dilate lorsqu'elle est mouillée
  answer: B
  explanation: Au début d'une averse, l'eau se mélange à l'huile, à la poussière et
    aux dépôts de caoutchouc sur la surface de la route, créant une émulsion très
    glissante avant d'être évacuée par l'eau.
- id: 108
  category: defensive_driving
  question: Lorsque vous conduisez sur les routes des TNO, à quelle distance devant
    vous devriez-vous scruter la route pour identifier les dangers potentiels ?
  choices:
    A: 5 secondes
    B: 8 secondes
    C: 12 à 15 secondes
    D: 30 secondes
  answer: C
  explanation: Les conducteurs experts scrutent la route de 12 à 15 secondes à l'avance
    pour anticiper les problèmes avant qu'ils ne deviennent des urgences.
- id: 109
  category: defensive_driving
  question: Si vous rencontrez de la « glace noire » en conduisant sur une route des
    TNO, quelle est la mesure la plus sûre à prendre ?
  choices:
    A: Freiner brusquement immédiatement
    B: Accélérer pour gagner de la traction
    C: Relâcher l'accélérateur et diriger le véhicule dans la direction où vous voulez
      aller
    D: Mettre le véhicule au point mort et pomper les freins rapidement
  answer: C
  explanation: Sur la glace noire, vous devez éviter les freinages ou les coups de
    volant brusques. Relâchez l'accélérateur et dirigez calmement le véhicule dans
    la direction souhaitée.
- id: 110
  category: defensive_driving
  question: Lors de la conduite sur des routes de gravier, qui sont courantes aux
    TNO, quelle est la principale préoccupation de sécurité concernant la distance
    de suivi ?
  choices:
    A: Le gravier offre une meilleure traction que l'asphalte
    B: Les nuages de poussière peuvent réduire considérablement la visibilité et les
      pierres peuvent fissurer les pare-brise
    C: Les pneus restent plus froids sur le gravier, ce qui permet des vitesses plus
      élevées
    D: Il n'y a pas de limites de vitesse sur les routes de gravier
  answer: B
  explanation: Sur les routes de gravier, vous devriez augmenter la distance de suivi
    en raison de la traction réduite, de la poussière qui obscurcit la vision et du
    risque de projections de pierres.
- id: 111
  category: defensive_driving
  question: Aux Territoires du Nord-Ouest, si vous voyez un bison ou un orignal sur
    la route ou à proximité, quelle est la pratique de conduite préventive la plus
    sûre ?
  choices:
    A: Klaxonner bruyamment pour l'effrayer
    B: Faire des appels de phares à plusieurs reprises
    C: Ralentir ou s'arrêter, car le comportement de la faune est imprévisible
    D: Accélérer pour dépasser l'animal avant qu'il ne s'engage sur la route
  answer: C
  explanation: Les animaux sauvages comme les bisons et les orignaux sont courants
    aux TNO. Vous devez ralentir ou vous arrêter et attendre qu'ils quittent la zone,
    car ils peuvent soudainement bondir sur votre trajectoire.
- id: 112
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais aux TNO, quels feux devriez-vous
    utiliser ?
  choices:
    A: Les feux de route (pleins phares)
    B: Les feux de croisement (codes)
    C: Les feux de position uniquement
    D: Aucun feu n'est nécessaire pendant la journée
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard. Les
    feux de route se reflètent sur les particules de brouillard, créant un effet de
    « mur blanc » qui réduit davantage la visibilité.
- id: 113
  category: defensive_driving
  question: Pendant les hivers aux TNO, lorsque la température est proche du point
    de congélation (0 °C), pourquoi les routes peuvent-elles être plus dangereuses
    qu'à -30 °C ?
  choices:
    A: Les pneus fondent à 0 °C
    B: La glace est plus glissante à des températures proches du point de congélation
    C: La visibilité est toujours pire à 0 °C
    D: Les freins ne fonctionnent pas à 0 °C
  answer: B
  explanation: La glace est plus glissante lorsqu'elle fond ou qu'elle est proche
    du point de congélation (0 °C) car une fine couche d'eau se forme à la surface
    de la glace.
- id: 114
  category: defensive_driving
  question: Si les feux de route d'un véhicule venant en sens inverse vous éblouissent
    la nuit, où devriez-vous regarder pour maintenir votre position dans la voie ?
  choices:
    A: Directement vers les phares du véhicule en approche
    B: Vers la ligne centrale de la route
    C: Vers le bord droit de la route ou la ligne blanche d'accotement
    D: Fermer les yeux momentanément
  answer: C
  explanation: Pour éviter d'être ébloui par les phares adverses, guidez votre véhicule
    en regardant vers le bord droit de la chaussée jusqu'à ce que le véhicule soit
    passé.
- id: 115
  category: defensive_driving
  question: Quelle est la distance de suivi recommandée lorsque vous conduisez derrière
    un gros véhicule commercial ou dans de mauvaises conditions météorologiques aux
    TNO ?
  choices:
    A: 2 secondes
    B: Au moins 4 secondes
    C: Une longueur de voiture
    D: 10 mètres
  answer: B
  explanation: Par mauvais temps, sur le gravier ou lorsque vous suivez de gros véhicules
    qui bloquent votre vue, vous devriez augmenter votre distance de suivi à au moins
    4 secondes.
- id: 116
  category: defensive_driving
  question: En abordant un virage, quelle est la meilleure technique de conduite préventive
    pour garder le contrôle ?
  choices:
    A: Freiner fort au milieu du virage
    B: Accélérer avant d'entrer dans le virage
    C: Ralentir avant d'entrer dans le virage et accélérer légèrement en sortant
    D: Maintenir une vitesse élevée constante tout au long du virage
  answer: C
  explanation: La façon la plus sûre de négocier un virage est de ralentir à une vitesse
    sécuritaire avant d'y entrer, puis d'accélérer doucement en sortant du virage.
- id: 117
  category: defensive_driving
  question: 'Aux TNO, si votre véhicule est équipé d''un système de freinage antiblocage
    (ABS) et que vous devez vous arrêter rapidement sur une surface glissante, vous
    devriez :'
  choices:
    A: Pomper les freins rapidement
    B: Appliquer une pression ferme et continue sur la pédale de frein
    C: Utiliser uniquement le frein d'urgence
    D: Passer au point mort et couper le moteur
  answer: B
  explanation: Avec l'ABS, vous devez appliquer une pression ferme et constante. Le
    système « pompera » automatiquement les freins pour vous afin d'empêcher le blocage
    des roues.
- id: 118
  category: defensive_driving
  question: Lorsque vous surveillez une intersection pour détecter des dangers, dans
    quel ordre devriez-vous regarder ?
  choices:
    A: À droite, puis à gauche
    B: Tout droit uniquement
    C: À gauche, au centre, à droite, puis à gauche de nouveau
    D: À droite, au centre, à gauche
  answer: C
  explanation: Vous devez regarder à gauche, au centre, à droite, puis à nouveau à
    gauche. Le premier danger vient généralement de la gauche, car ce trafic est le
    plus proche de vous.
- id: 119
  category: alcohol_drugs_health
  question: Aux Territoires du Nord-Ouest, quelle est la plage d'« avertissement »
    pour le taux d'alcoolémie (BAC) pour les conducteurs titulaires d'un permis complet
    ?
  choices:
    A: 0,02 à 0,05
    B: 0,05 à 0,08
    C: 0,08 à 0,10
    D: 0,04 à 0,06
  answer: B
  explanation: Pour les conducteurs titulaires d'un permis complet aux TNO, un taux
    d'alcoolémie (BAC) compris entre 0,05 et 0,08 est considéré comme la plage d'«
    avertissement », ce qui entraîne des sanctions administratives.
- id: 120
  category: alcohol_drugs_health
  question: Quelle est la période de suspension administrative immédiate du permis
    pour un conducteur titulaire d'un permis complet pris avec un taux d'alcoolémie
    (BAC) dans la plage d'« avertissement » (0,05 à 0,08) pour la première fois ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 7 jours
    D: 30 jours
  answer: A
  explanation: Une première infraction pour un taux d'alcoolémie compris entre 0,05
    et 0,08 entraîne une suspension administrative immédiate du permis de 24 heures.
- id: 121
  category: alcohol_drugs_health
  question: Aux Territoires du Nord-Ouest, quelle est la période de suspension administrative
    du permis pour un conducteur qui fournit un échantillon d'haleine supérieur à
    0,08 ou qui refuse de fournir un échantillon ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 90 jours
    D: 1 an
  answer: C
  explanation: Les conducteurs qui soufflent plus de 0,08 ou refusent une demande
    d'échantillon d'haleine ou de sang reçoivent une suspension administrative immédiate
    de permis de 90 jours.
- id: 122
  category: alcohol_drugs_health
  question: Pour une première infraction liée à un taux d'alcoolémie (BAC) supérieur
    à 0,08, pendant combien de temps le véhicule du conducteur sera-t-il mis en fourrière
    sur le bord de la route ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 45 jours
  answer: C
  explanation: Aux TNO, une première infraction pour un taux d'alcoolémie supérieur
    à 0,08 (ou le refus de fournir un échantillon) entraîne une mise en fourrière
    obligatoire du véhicule pendant 30 jours.
- id: 123
  category: alcohol_drugs_health
  question: Si un conducteur est reconnu coupable d'une première infraction de conduite
    avec facultés affaiblies en vertu du Code criminel aux TNO, quelle est l'interdiction
    de conduire minimale ordonnée par le tribunal ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 1 an
    D: 2 ans
  answer: C
  explanation: Une première condamnation en vertu du Code criminel pour conduite avec
    facultés affaiblies entraîne une interdiction de conduire fédérale minimale d'un
    an.
- id: 124
  category: alcohol_drugs_health
  question: En vertu de la loi des TNO, qui est responsable de s'assurer qu'un conducteur
    est médicalement apte à conduire un véhicule automobile ?
  choices:
    A: Uniquement le médecin du conducteur
    B: Uniquement le registraire des véhicules automobiles
    C: Uniquement le conducteur
    D: À la fois le conducteur et son professionnel de la santé
  answer: D
  explanation: Le conducteur (qui doit signaler tout changement de santé) et les professionnels
    de la santé (qui doivent signaler les conditions rendant la conduite dangereuse)
    partagent la responsabilité de l'aptitude médicale à la conduite.
- id: 125
  category: alcohol_drugs_health
  question: Quelle est la sanction pour une troisième infraction en cinq ans de conduite
    avec un taux d'alcoolémie (BAC) dans la zone d'avertissement (« Warning ») (0,05
    à 0,08) ?
  choices:
    A: Suspension de permis de 30 jours
    B: Suspension de permis de 90 jours
    C: Suspension de permis de 6 mois
    D: Révocation permanente
  answer: A
  explanation: Une troisième infraction dans la zone d'avertissement (0,05 à 0,08)
    en cinq ans entraîne une suspension administrative de permis de 30 jours.
- id: 126
  category: alcohol_drugs_health
  question: Si vous prenez des médicaments sur ordonnance ou en vente libre, quelle
    est votre responsabilité légale avant de conduire ?
  choices:
    A: Vous pouvez conduire tant que vous ne vous sentez pas « gelé »
    B: Vous devez attendre 24 heures après toute dose
    C: Vous devez connaître les effets du médicament et vous assurer qu'il n'altère
      pas votre capacité à conduire
    D: Vous ne devez vous inquiéter que si le flacon porte une tête de mort rouge
  answer: C
  explanation: Les conducteurs sont légalement responsables de s'assurer que tout
    médicament qu'ils prennent n'altère pas leur capacité à conduire un véhicule en
    toute sécurité.
- id: 127
  category: alcohol_drugs_health
  question: 'Aux TNO, si un conducteur refuse de fournir un échantillon d''haleine
    à un agent de la paix, les conséquences juridiques sont :'
  choices:
    A: Moins graves qu'une condamnation pour conduite avec facultés affaiblies (DUI)
    B: Les mêmes que pour un taux d'alcoolémie supérieur à 0,08
    C: Une simple amende sans suspension de permis
    D: Applicables uniquement si un accident s'est produit
  answer: B
  explanation: Le refus de fournir un échantillon d'haleine ou de sang est une infraction
    criminelle qui entraîne les mêmes sanctions que la conduite avec un taux d'alcoolémie
    supérieur à 0,08.
- id: 128
  category: alcohol_drugs_health
  question: Lorsqu'un conducteur reçoit une suspension immédiate de 24 heures pour
    alcool ou drogue, où le véhicule est-il généralement emmené ?
  choices:
    A: Il doit être laissé sur le bord de la route pendant 24 heures
    B: Il est mis en fourrière aux frais du conducteur
    C: L'agent de police doit le conduire au domicile du conducteur
    D: Il est vendu aux enchères immédiatement
  answer: B
  explanation: Lorsqu'un permis est suspendu sur le bord de la route pour facultés
    affaiblies, le véhicule est mis en fourrière et le conducteur est responsable
    de tous les frais de remorquage et d'entreposage.
- id: 129
  category: alcohol_drugs_health
  question: Un accompagnateur supervisant un apprenti conducteur de classe 7 aux TNO
    doit maintenir un taux d'alcoolémie (BAC) inférieur à quel niveau ?
  choices:
    A: 0,00 (Tolérance zéro)
    B: 0,02
    C: 0,05
    D: 0,08
  answer: C
  explanation: L'accompagnateur supervisant un apprenti doit avoir un taux d'alcoolémie
    inférieur à 0,05. S'il dépasse ce seuil, il n'est pas considéré comme un superviseur
    légal.
- id: 130
  category: alcohol_drugs_health
  question: Comment la fatigue affecte-t-elle les performances d'un conducteur par
    rapport à l'alcool ?
  choices:
    A: La fatigue n'a aucun effet mesurable sur le temps de réaction
    B: La fatigue n'affecte que les conducteurs plus âgés
    C: La fatigue peut altérer le jugement et la coordination de manière similaire
      à l'alcool
    D: La fatigue se soigne facilement en montant le son de la radio
  answer: C
  explanation: La fatigue est une forme d'affaiblissement des facultés qui peut ralentir
    considérablement les temps de réaction et diminuer la vigilance, de manière similaire
    aux effets de l'alcool ou de la drogue.
- id: 131
  category: alcohol_drugs_health
  question: Si un permis de conduire est suspendu en raison d'une condamnation liée
    à l'alcool, quelle est l'exigence courante pour le rétablissement du permis aux
    TNO ?
  choices:
    A: Réussir un programme d'éducation sur l'alcool agréé ou le programme « Planning
      Ahead »
    B: Attendre 10 ans avant de présenter une nouvelle demande
    C: Il n'y a aucune exigence autre que d'attendre la fin du délai
    D: Acheter un nouveau véhicule
  answer: A
  explanation: Les conducteurs dont le permis est suspendu pour des raisons liées
    à l'alcool doivent souvent suivre un programme d'éducation sur l'alcool (comme
    « Planning Ahead ») et payer des frais de rétablissement avant de récupérer leur
    permis.
- id: 132
  category: alcohol_drugs_health
  question: Aux Territoires du Nord-Ouest, un conducteur titulaire d'un permis complet
    (non-GDL) s'expose à une suspension immédiate de permis de 24 heures sur le bord
    de la route si son taux d'alcoolémie (BAC) se situe dans quelle « zone d'avertissement
    » ?
  choices:
    A: 0,02 % à 0,04 %
    B: 0,05 % à 0,08 %
    C: 0,08 % à 0,10 %
    D: 0,01 % à 0,05 %
  answer: B
  explanation: Aux TNO, la « zone d'avertissement » pour les conducteurs titulaires
    d'un permis complet se situe entre 0,05 % et 0,08 % d'alcoolémie (BAC). Atteindre
    ce niveau entraîne une suspension immédiate du permis de 24 heures pour une première
    infraction.
- id: 133
  category: alcohol_drugs_health
  question: Selon la loi des TNO, quelle est la période de suspension immédiate du
    permis pour un conducteur accusé d'avoir un taux d'alcoolémie (BAC) supérieur
    à 0,08 (niveau du Code criminel) ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 90 jours
    D: 1 an
  answer: C
  explanation: Les conducteurs accusés d'avoir un taux d'alcoolémie supérieur à 0,08
    ou de refuser de fournir un échantillon d'haleine font l'objet d'une suspension
    administrative immédiate de leur permis de 90 jours.
- id: 134
  category: alcohol_drugs_health
  question: Si un conducteur est accusé de conduite avec facultés affaiblies (taux
    d'alcoolémie supérieur à 0,08) pour la première fois aux TNO, pendant combien
    de temps son véhicule est-il généralement mis en fourrière sur le bord de la route
    ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 30 jours
    D: 45 jours
  answer: B
  explanation: Pour une première infraction de conduite avec un taux d'alcoolémie
    supérieur à 0,08, le véhicule fait l'objet d'une mise en fourrière immédiate de
    3 jours.
- id: 135
  category: alcohol_drugs_health
  question: Aux Territoires du Nord-Ouest, quelle est la sanction pour un conducteur
    du programme de permis de conduire progressif (GDL) chez qui on trouve toute trace
    d'alcool ou de drogue dans l'organisme ?
  choices:
    A: Une suspension de 24 heures
    B: Une suspension de 30 jours et la remise à zéro de la période du programme GDL
    C: Une suspension de 7 jours et une amende de 500 $
    D: Un avertissement pour la première infraction
  answer: B
  explanation: Les TNO appliquent une tolérance zéro pour les conducteurs du programme
    GDL. S'ils sont pris avec de l'alcool ou de la drogue, ils font face à une suspension
    immédiate de 30 jours et doivent recommencer leur étape actuelle du programme
    GDL depuis le début.
- id: 136
  category: alcohol_drugs_health
  question: Laquelle des conditions suivantes est une exigence légale pour les conducteurs
    des TNO concernant les problèmes de santé ?
  choices:
    A: Seuls les conducteurs de plus de 65 ans doivent signaler leurs problèmes de
      santé.
    B: Les conducteurs doivent signaler au registraire tout problème de santé susceptible
      d'affecter leur capacité à conduire un véhicule en toute sécurité.
    C: Les problèmes de santé ne doivent être signalés que si vous êtes impliqué dans
      un accident.
    D: Seuls les conducteurs commerciaux (classes 1 à 4) sont tenus de signaler leurs
      problèmes de santé.
  answer: B
  explanation: Tous les conducteurs des TNO sont légalement tenus de signaler au registraire
    des véhicules automobiles toute maladie ou tout handicap susceptible de nuire
    à la conduite sécuritaire d'un véhicule à moteur.
- id: 137
  category: alcohol_drugs_health
  question: Aux TNO, si un conducteur refuse de fournir un échantillon d'haleine,
    de sang ou de fluide oral à la demande légale d'un agent de la paix, quelles sont
    les conséquences ?
  choices:
    A: Une suspension de 24 heures seulement.
    B: Les mêmes sanctions que pour la conduite avec un taux d'alcoolémie supérieur
      à 0,08.
    C: Une amende de 100 $ et un avertissement.
    D: Aucune sanction s'il s'agit de la première fois que le conducteur est arrêté.
  answer: B
  explanation: Le refus de fournir un échantillon est une infraction criminelle et
    entraîne la même suspension immédiate de 90 jours et la même mise en fourrière
    du véhicule qu'un taux d'alcoolémie supérieur à 0,08.
- id: 138
  category: alcohol_drugs_health
  question: Quelle est la politique des TNO concernant la consommation de cannabis
    pour les conducteurs du programme de permis de conduire progressif (GDL) ?
  choices:
    A: Ils peuvent avoir jusqu'à 2 nanogrammes de THC dans le sang.
    B: Ils sont autorisés à conduire s'ils ont une prescription médicale.
    C: Il existe une politique de tolérance zéro pour le cannabis (THC) pour tous
      les conducteurs GDL.
    D: Le cannabis n'est restreint que pour les conducteurs GDL de moins de 19 ans.
  answer: C
  explanation: Les conducteurs GDL aux TNO sont soumis à une tolérance zéro pour le
    cannabis. Toute quantité détectable de THC entraînera une suspension immédiate
    de 30 jours.
- id: 139
  category: alcohol_drugs_health
  question: Si vous êtes un conducteur titulaire d'un permis complet aux TNO et que
    vous recevez une troisième suspension pour « zone d'avertissement » (0,05 à 0,08
    d'alcoolémie) en moins de deux ans, quelle est la durée de la suspension ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: C
  explanation: Une troisième infraction dans la « zone d'avertissement » sur une période
    de deux ans entraîne une suspension immédiate du permis de 30 jours.
- id: 140
  category: alcohol_drugs_health
  question: Lors de la prise de médicaments sur ordonnance ou en vente libre, quelle
    est la responsabilité du conducteur aux TNO ?
  choices:
    A: Conduire uniquement pendant les heures de clarté.
    B: Lire l'étiquette ou demander à un pharmacien ou à un médecin si le médicament
      affecte la capacité de conduire.
    C: Attendre au moins une heure après avoir pris une pilule avant de conduire.
    D: Les médicaments ne sont pas considérés comme des drogues en vertu des lois
      sur la conduite avec facultés affaiblies des TNO.
  answer: B
  explanation: Les conducteurs doivent s'assurer que tout médicament qu'ils prennent
    n'altère pas leur capacité de conduire. De nombreux médicaments provoquent de
    la somnolence ou ralentissent les temps de réaction, ce qui peut mener à des accusations
    de conduite avec facultés affaiblies.
- id: 141
  category: alcohol_drugs_health
  question: Aux Territoires du Nord-Ouest (TNO), si un conducteur est reconnu coupable
    de conduite avec facultés affaiblies, à quel programme pourrait-il devoir participer
    avant que son permis ne soit entièrement rétabli ?
  choices:
    A: Le cours de poursuite à haute vitesse
    B: Le programme de sensibilisation à l'alcool et aux drogues
    C: L'atelier obligatoire sur la conduite hivernale
    D: Le programme d'inspection mécanique
  answer: B
  explanation: Les conducteurs reconnus coupables d'infractions de conduite avec facultés
    affaiblies aux TNO doivent généralement suivre un programme agréé de sensibilisation
    à l'alcool et aux drogues ou un programme « de rattrapage » avant de pouvoir récupérer
    leurs privilèges de conduite.
- id: 142
  category: alcohol_drugs_health
  question: Dans le cadre du programme d'antidémarreurs avec éthylomètre des TNO,
    que doit faire un participant pour démarrer son véhicule ?
  choices:
    A: Saisir un code PIN.
    B: Fournir un échantillon d'haleine dans un appareil qui mesure le taux d'alcool.
    C: Attendre la fin d'une minuterie de 5 minutes.
    D: Numériser son permis de conduire.
  answer: B
  explanation: Un dispositif d'antidémarreur exige que le conducteur fournisse un
    échantillon d'haleine. Si l'appareil détecte un taux d'alcool supérieur à une
    limite préétablie, le moteur du véhicule ne démarrera pas.
- id: 143
  category: alcohol_drugs_health
  question: 'Aux TNO, si un conducteur est reconnu coupable de facultés affaiblies
    par une combinaison d''alcool et de drogues, les sanctions sont :'
  choices:
    A: Réduites parce que les effets s'annulent mutuellement.
    B: Les mêmes que si seul de l'alcool avait été consommé.
    C: Sujettes à des peines plus sévères du Code criminel en raison de l'affaiblissement
      combiné.
    D: Applicables uniquement si le conducteur a plus de 21 ans.
  answer: C
  explanation: La combinaison d'alcool et de drogues augmente considérablement l'affaiblissement
    des facultés. En vertu du Code criminel, il existe des peines spécifiques, souvent
    plus sévères, pour le fait d'avoir simultanément des taux prohibés d'alcool et
    de THC dans le sang.
- id: 144
  category: penalties_and_points
  question: Pour un conducteur titulaire d'un permis complet aux TNO, quelle est la
    durée de la première suspension de permis pour avoir accumulé 15 points d'inaptitude
    ou plus sur une période de deux ans ?
  choices:
    A: 14 jours
    B: 1 mois
    C: 3 mois
    D: 6 mois
  answer: B
  explanation: Si un conducteur titulaire d'un permis complet accumule 15 points d'inaptitude
    ou plus, la première période de suspension est d'un mois.
- id: 145
  category: penalties_and_points
  question: Selon la loi des TNO, quelle est la sanction en points d'inaptitude pour
    l'utilisation d'un appareil électronique portatif (conduite distraite) au volant
    d'un véhicule ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: La conduite distraite, comme l'utilisation d'un téléphone cellulaire
    tenu à la main, entraîne l'ajout de 3 points d'inaptitude au dossier du conducteur
    aux TNO.
- id: 146
  category: penalties_and_points
  question: Si vous êtes reconnu coupable d'avoir conduit à 51 km/h ou plus au-dessus
    de la limite de vitesse affichée aux TNO, combien de points d'inaptitude seront
    ajoutés à votre dossier ?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: Un excès de vitesse de plus de 50 km/h au-dessus de la limite est une
    infraction majeure aux TNO et entraîne 6 points d'inaptitude.
- id: 147
  category: penalties_and_points
  question: 'Un agent de la paix aux TNO peut imposer une suspension immédiate de
    24 heures sur le bord de la route s''il a des motifs raisonnables de croire qu''un
    conducteur a un taux d''alcoolémie (BAC) d''au moins :'
  choices:
    A: 0,01
    B: 0,05
    C: 0,08
    D: 0,10
  answer: B
  explanation: Aux TNO, une suspension de 24 heures sur le bord de la route peut être
    imposée aux conducteurs titulaires d'un permis complet si leur taux d'alcoolémie
    est de 0,05 ou plus.
- id: 148
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués à un conducteur des TNO
    pour ne pas avoir porté sa ceinture de sécurité ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Le fait de ne pas porter sa ceinture de sécurité ou de ne pas s'assurer
    qu'un passager de moins de 16 ans est correctement attaché entraîne 2 points d'inaptitude.
- id: 149
  category: penalties_and_points
  question: Aux Territoires du Nord-Ouest, un véhicule peut être immédiatement saisi
    et mis en fourrière pendant combien de jours si le conducteur est pris en train
    de faire une course ou une acrobatie ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: C
  explanation: En vertu des règlements des TNO, les véhicules impliqués dans des courses
    ou des conduites acrobatiques font l'objet d'une mise en fourrière immédiate de
    7 jours.
- id: 150
  category: penalties_and_points
  question: Si un conducteur titulaire d'un permis complet accumule 15 points d'inaptitude
    pour la deuxième fois sur une période de deux ans, pendant combien de temps son
    permis sera-t-il suspendu ?
  choices:
    A: 1 mois
    B: 3 mois
    C: 6 mois
    D: 1 an
  answer: B
  explanation: Pour une deuxième suspension en deux ans en raison des points d'inaptitude,
    la période de suspension passe à 3 mois.
- id: 151
  category: penalties_and_points
  question: Le fait de ne pas s'arrêter à un panneau d'arrêt aux TNO entraîne combien
    de points d'inaptitude ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Le fait de ne pas respecter un panneau d'arrêt ou un feu rouge entraîne
    l'ajout de 3 points d'inaptitude à votre dossier de conduite.
- id: 152
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour avoir omis de s'arrêter
    à un signal ou à une barrière à un passage à niveau aux TNO ?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: Le fait de ne pas s'arrêter à un passage à niveau lorsqu'un signal
    ou une barrière est activé est une infraction de 5 points dans les Territoires
    du Nord-Ouest.
- id: 153
  category: penalties_and_points
  question: Si un conducteur titulaire d'un permis complet aux TNO est reconnu coupable
    d'avoir omis de rester sur les lieux d'un accident, combien de points d'inaptitude
    seront ajoutés à son dossier ?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 10 points
  answer: C
  explanation: Le fait de ne pas rester sur les lieux d'un accident est une infraction
    grave aux TNO et entraîne une pénalité de 7 points d'inaptitude.
- id: 154
  category: penalties_and_points
  question: Dans les Territoires du Nord-Ouest, quelle est la sanction pour un conducteur
    pris en flagrant délit d'excès de vitesse de plus de 50 km/h au-dessus de la limite
    affichée ?
  choices:
    A: 2 points d'inaptitude
    B: 4 points d'inaptitude
    C: 6 points d'inaptitude
    D: 8 points d'inaptitude
  answer: C
  explanation: Un excès de vitesse de plus de 50 km/h au-dessus de la limite aux TNO
    entraîne l'ajout de 6 points d'inaptitude au dossier du conducteur.
- id: 155
  category: penalties_and_points
  question: Si le taux d'alcoolémie (BAC) d'un conducteur se situe entre 0,05 % et
    0,08 % (la « zone d'avertissement »), quelle est la sanction immédiate sur la
    route pour une première infraction aux TNO ?
  choices:
    A: Une suspension immédiate du permis de 24 heures
    B: Une suspension de permis de 7 jours
    C: Une suspension de permis de 30 jours
    D: La révocation permanente du permis
  answer: A
  explanation: Les conducteurs des TNO dont le taux d'alcoolémie (BAC) se situe dans
    la « zone d'avertissement » (0,05 à 0,08) sont passibles d'une suspension immédiate
    du permis de conduire de 24 heures sur le bord de la route.
- id: 156
  category: penalties_and_points
  question: Laquelle des infractions suivantes entraîne une pénalité de 6 points d'inaptitude
    dans les Territoires du Nord-Ouest ?
  choices:
    A: Suivre de trop près
    B: Conduite imprudente
    C: Omission de céder le passage à un piéton
    D: Dépassement inapproprié
  answer: B
  explanation: La conduite imprudente est considérée comme une infraction majeure
    aux TNO et est sanctionnée par 6 points d'inaptitude.
- id: 157
  category: penalties_and_points
  question: Pendant combien de temps les points d'inaptitude restent-ils au dossier
    d'un conducteur dans les Territoires du Nord-Ouest ?
  choices:
    A: 1 an à compter de la date de l'infraction
    B: 2 ans à compter de la date de la condamnation
    C: 3 ans à compter de la date de la condamnation
    D: 5 ans à compter de la date de l'infraction
  answer: B
  explanation: Les points d'inaptitude sont retirés du dossier de conduite des TNO
    deux ans après la date de la condamnation pour l'infraction.
- id: 158
  category: penalties_and_points
  question: Si un conducteur est reconnu coupable de « course » sur une route des
    TNO, combien de points d'inaptitude sont ajoutés à son permis ?
  choices:
    A: 5 points
    B: 7 points
    C: 10 points
    D: 15 points
  answer: C
  explanation: Faire la course avec un véhicule à moteur sur une route est une infraction
    majeure aux TNO et entraîne une pénalité de 10 points d'inaptitude.
- id: 159
  category: penalties_and_points
  question: Quelle est la sanction pour un conducteur qui est pris à conduire un véhicule
    alors que son permis de conduire est suspendu ?
  choices:
    A: Un simple avertissement verbal
    B: Le véhicule est saisi et mis en fourrière pendant 30 jours
    C: Une interdiction de conduire obligatoire de 5 ans
    D: Le conducteur doit repasser l'examen théorique de classe 7
  answer: B
  explanation: Aux TNO, si vous êtes pris à conduire alors que votre permis est suspendu,
    le véhicule que vous conduisez sera saisi et mis en fourrière pendant 30 jours,
    peu importe à qui il appartient.
- id: 160
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour avoir « suivi de trop
    près » dans les Territoires du Nord-Ouest ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Suivre un autre véhicule de trop près (talonner) entraîne 4 points
    d'inaptitude aux TNO.
- id: 161
  category: penalties_and_points
  question: Un conducteur titulaire d'un permis complet qui reçoit une deuxième suspension
    pour points d'inaptitude en l'espace de deux ans verra son permis suspendu pendant
    combien de temps ?
  choices:
    A: 1 mois
    B: 3 mois
    C: 6 mois
    D: 1 an
  answer: B
  explanation: Aux TNO, une deuxième suspension au cours d'une période de deux ans
    pour accumulation de points d'inaptitude entraîne une suspension de 3 mois (90
    jours).
- id: 162
  category: penalties_and_points
  question: Aux TNO, combien de points d'inaptitude sont attribués pour avoir omis
    de céder le passage à un piéton dans un passage pour piétons ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Le fait de ne pas céder le passage à un piéton dans un passage pour
    piétons entraîne l'inscription de 3 points d'inaptitude au dossier du conducteur
    des TNO.
- id: 163
  category: sharing_the_road
  question: Dans les Territoires du Nord-Ouest, lorsque vous approchez d'un autobus
    scolaire par l'avant ou par l'arrière dont les feux rouges clignotent, à quelle
    distance devez-vous arrêter votre véhicule ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 25 mètres
  answer: C
  explanation: Selon le Guide du conducteur des TNO, les conducteurs doivent s'arrêter
    à au moins 15 mètres d'un autobus scolaire lorsque ses feux rouges clignotent
    et/ou que son bras d'arrêt est déployé.
- id: 164
  category: sharing_the_road
  question: En vertu de la Loi sur les véhicules automobiles des TNO, combien de points
    d'inaptitude sont inscrits au dossier d'un conducteur pour avoir omis de s'arrêter
    devant un autobus scolaire dont les feux rouges clignotent ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire dont les feux
    rouges clignotent est une infraction grave dans les Territoires du Nord-Ouest
    et entraîne 4 points d'inaptitude.
- id: 165
  category: sharing_the_road
  question: Dans les Territoires du Nord-Ouest, si vous conduisez sur une route où
    la limite de vitesse affichée est de 60 km/h ou plus, à quelle vitesse devez-vous
    ralentir en dépassant un véhicule d'urgence arrêté dont les gyrophares clignotent
    ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 60 km/h
    D: 80 km/h
  answer: C
  explanation: En vertu des lois « Ralentissez, tassez-vous », si la limite de vitesse
    est de 60 km/h ou plus, vous devez ralentir à 60 km/h. Si la limite est inférieure
    à 60 km/h, vous devez ralentir à 30 km/h.
- id: 166
  category: sharing_the_road
  question: Lorsque vous suivez un camion de pompiers qui répond à une alarme, quelle
    est la distance de suivi minimale que vous devez maintenir ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Il est illégal de suivre à moins de 150 mètres un véhicule d'incendie
    (camion de pompiers) qui répond à un appel d'urgence.
- id: 167
  category: sharing_the_road
  question: Les gros véhicules commerciaux ont des « zones de danger » (No-Zones).
    À quoi ce terme fait-il référence ?
  choices:
    A: Zones où les camions ne sont pas autorisés à circuler
    B: Angles morts autour du camion où le conducteur ne peut pas voir les autres
      véhicules
    C: Zones de chargement pour l'équipement lourd
    D: Zones de vents violents sur les routes des TNO
  answer: B
  explanation: La « zone de danger » fait référence aux angles morts importants situés
    à l'arrière, à l'avant et des deux côtés d'un véhicule commercial où la visibilité
    du conducteur est limitée.
- id: 168
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire est arrêté sur une route divisée par un terre-plein
    central, les véhicules circulant dans la direction opposée (de l'autre côté du
    terre-plein) doivent-ils s'arrêter ?
  choices:
    A: Oui, ils doivent toujours s'arrêter
    B: Non, ils ne sont pas tenus de s'arrêter
    C: Oui, mais seulement si le conducteur de l'autobus leur fait signe
    D: Non, mais ils doivent ralentir à 10 km/h
  answer: B
  explanation: Sur une route divisée par un terre-plein central, seuls les véhicules
    s'approchant de l'autobus par l'arrière ou par l'avant du même côté du terre-plein
    sont tenus de s'arrêter pour les feux rouges clignotants.
- id: 169
  category: sharing_the_road
  question: Si vous voyez un piéton avec une canne blanche ou un chien-guide à un
    passage pour piétons, qu'est-ce que cela indique et que devez-vous faire ?
  choices:
    A: Le piéton est une personne âgée ; accordez-lui plus de temps
    B: Le piéton est malvoyant ; arrêtez-vous et cédez-lui le passage
    C: Le piéton est un travailleur de service ; procédez avec prudence
    D: Le piéton entraîne un chien ; ne klaxonnez pas
  answer: B
  explanation: Une canne blanche ou un chien-guide indique que le piéton est malvoyant.
    Les conducteurs doivent faire preuve d'une prudence extrême et céder le passage
    pour assurer leur sécurité.
- id: 170
  category: sharing_the_road
  question: Pourquoi est-il dangereux de se rabattre de près devant un gros camion,
    surtout dans les conditions hivernales des TNO ?
  choices:
    A: Les camions ont des distances de freinage beaucoup plus longues que les voitures
      de tourisme
    B: Le conducteur du camion pourrait se fâcher
    C: Les camions ont une meilleure traction et pourraient vous percuter par l'arrière
    D: Il est illégal de dépasser des camions en hiver
  answer: A
  explanation: Les gros camions sont beaucoup plus lourds que les voitures et nécessitent
    une distance nettement plus longue pour s'immobiliser complètement, surtout sur
    les routes glacées ou enneigées des TNO.
- id: 171
  category: sharing_the_road
  question: Dans les Territoires du Nord-Ouest, quelles sont les heures standard pour
    les limites de vitesse en zone scolaire, sauf indication contraire ?
  choices:
    A: De 8 h 00 à 17 h 00 les jours d'école
    B: De 8 h 30 à 15 h 30 les jours d'école
    C: De 8 h 00 à 16 h 30 les jours d'école
    D: De 7 h 30 à 21 h 00 tous les jours
  answer: C
  explanation: Bien que les règlements municipaux puissent varier légèrement, les
    heures standard des zones scolaires aux TNO sont de 8 h 00 à 16 h 30 les jours
    où l'école est en session.
- id: 172
  category: sharing_the_road
  question: Lorsqu'un gros camion tourne à droite à une intersection, pourquoi peut-il
    s'engager largement dans la voie de gauche avant de tourner ?
  choices:
    A: Le conducteur essaie de mieux voir la circulation
    B: La loi oblige les camions à utiliser deux voies pour tous les virages
    C: Pour éviter que les roues arrière ne montent sur le trottoir en raison de la
      longueur du véhicule
    D: Pour avertir les autres conducteurs de rester en retrait
  answer: C
  explanation: En raison de leur longueur, les gros véhicules doivent effectuer un
    virage large vers la gauche pour réussir un virage à droite sans que les roues
    arrière ne montent sur la bordure du trottoir ou ne heurtent des objets.
- id: 173
  category: sharing_the_road
  question: Lorsque vous circulez à bicyclette la nuit dans les TNO, quel équipement
    est légalement requis sur le vélo ?
  choices:
    A: Une sonnette et un drapeau blanc
    B: Un phare blanc à l'avant et un feu rouge ou un réflecteur à l'arrière
    C: Des réflecteurs jaunes sur les rayons uniquement
    D: Un gilet haute visibilité
  answer: B
  explanation: Pour la conduite de nuit, une bicyclette doit être équipée d'un phare
    émettant une lumière blanche vers l'avant et d'un feu arrière rouge ou d'un réflecteur
    rouge vers l'arrière.
- id: 174
  category: sharing_the_road
  question: Que doit faire un conducteur s'il est dépassé par un gros véhicule commercial
    sur une route à deux voies ?
  choices:
    A: Accélérer pour que le camion n'ait pas à dépasser
    B: Se déplacer le plus possible vers la droite et maintenir ou réduire légèrement
      sa vitesse
    C: Freiner brusquement pour laisser le camion s'insérer rapidement
    D: Rester au centre de la voie et utiliser les feux de route
  answer: B
  explanation: Lorsqu'on vous dépasse, vous devez rester à droite et aider l'autre
    conducteur à dépasser en toute sécurité en maintenant une vitesse constante ou
    en ralentissant légèrement.
- id: 175
  category: sharing_the_road
  question: À une intersection où il n'y a pas de passages pour piétons marqués ni
    de lignes d'arrêt, les piétons ont-ils toujours la priorité ?
  choices:
    A: Non, ils doivent attendre une brèche dans la circulation
    B: Oui, il existe un « passage pour piétons non marqué » à chaque intersection
    C: Seulement s'ils traversent en groupe
    D: Seulement pendant les heures de clarté
  answer: B
  explanation: En vertu de la Loi sur les véhicules automobiles des TNO, un passage
    pour piétons non marqué existe à chaque intersection, à moins que des panneaux
    n'interdisent la traversée. Les conducteurs doivent céder le passage aux piétons
    dans ces zones.
- id: 176
  category: sharing_the_road
  question: Quelle est la pénalité en points d'inaptitude dans les Territoires du
    Nord-Ouest pour avoir omis de s'arrêter pour un autobus scolaire dont les feux
    rouges clignotent ?
  choices:
    A: 2 points d'inaptitude
    B: 3 points d'inaptitude
    C: 4 points d'inaptitude
    D: 6 points d'inaptitude
  answer: D
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire est considéré
    comme une infraction grave aux TNO et entraîne l'ajout de 6 points d'inaptitude
    à votre dossier de conduite.
- id: 177
  category: sharing_the_road
  question: Dans les Territoires du Nord-Ouest, quelle est la distance minimale que
    vous devez maintenir lorsque vous suivez un véhicule d'urgence dont les gyrophares
    ou les sirènes sont activés ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 300 mètres
  answer: C
  explanation: Il est illégal et dangereux de suivre un véhicule d'urgence de trop
    près. Vous devez maintenir une distance de suivi minimale de 150 mètres.
- id: 178
  category: sharing_the_road
  question: Lors du dépassement d'un cycliste sur une route dans les TNO, quelle est
    la meilleure pratique pour la sécurité ?
  choices:
    A: Klaxonner pour l'avertir que vous dépassez
    B: Passer aussi près que possible pour rester dans votre voie
    C: Changer de voie pour dépasser si possible, ou laisser au moins un mètre d'espace
    D: Les cyclistes doivent se ranger sur l'accotement pour laisser passer toutes
      les voitures en premier
  answer: C
  explanation: Les conducteurs doivent traiter les cyclistes comme des véhicules lents.
    Lors du dépassement, vous devez changer de voie si c'est sécuritaire ou laisser
    un dégagement d'au moins un mètre entre votre véhicule et le cycliste.
- id: 179
  category: sharing_the_road
  question: À une intersection où un piéton traverse la rue dans un passage pour piétons
    non marqué, qui a la priorité ?
  choices:
    A: L'automobiliste, car le passage n'est pas marqué
    B: Le piéton
    C: La personne qui est arrivée à l'intersection en premier
    D: L'automobiliste, mais seulement s'il tourne à droite
  answer: B
  explanation: Aux TNO, les piétons ont la priorité à toutes les intersections, que
    le passage pour piétons soit marqué par de la peinture ou qu'il s'agisse d'un
    prolongement « non marqué » du trottoir.
- id: 180
  category: sharing_the_road
  question: Lorsque vous suivez un gros camion commercial, pourquoi devriez-vous augmenter
    votre distance de suivi par rapport à celle que vous garderiez derrière une voiture
    ?
  choices:
    A: Les camions peuvent s'arrêter beaucoup plus vite que les voitures
    B: Pour permettre au conducteur du camion de vous voir dans ses rétroviseurs extérieurs
    C: Pour empêcher le camion de reculer sur vous
    D: Parce que les camions sont obligés de rouler à 20 km/h sous la limite
  answer: B
  explanation: 'Les gros camions ont des angles morts importants directement derrière
    eux. Si vous suivez de trop près, le conducteur ne peut pas vous voir. Une bonne
    règle est la suivante : si vous ne voyez pas les rétroviseurs latéraux du camion,
    le conducteur ne peut pas vous voir.'
- id: 181
  category: sharing_the_road
  question: Dans les municipalités des TNO comme Yellowknife, quelle est la limite
    de vitesse standard dans une zone scolaire pendant les jours d'école (de 08 h
    00 à 16 h 30), sauf indication contraire ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: La limite de vitesse standard dans les zones scolaires aux TNO est
    de 30 km/h pendant les heures désignées afin de protéger les enfants et les piétons.
- id: 182
  category: sharing_the_road
  question: Selon les règlements des TNO, de quel équipement un vélo doit-il être
    muni lorsqu'il circule sur une route la nuit ?
  choices:
    A: Un avertisseur sonore ou un klaxon seulement
    B: Un phare blanc à l'avant et un feu rouge ou un réflecteur à l'arrière
    C: Un phare jaune à l'avant et un phare blanc à l'arrière
    D: Du ruban réfléchissant sur les pédales seulement
  answer: B
  explanation: Pour des raisons de sécurité et de visibilité, les vélos circulant
    la nuit doivent être équipés d'un phare blanc à l'avant et d'un feu rouge ou d'un
    réflecteur rouge à l'arrière.
- id: 183
  category: sharing_the_road
  question: Si vous êtes arrêté à un feu rouge et qu'un véhicule d'urgence avec sirènes
    s'approche par derrière, que devez-vous faire ?
  choices:
    A: Brûler le feu rouge pour dégager la voie
    B: Rester où vous êtes ; ne vous engagez pas dans l'intersection contre un feu
      rouge
    C: Tourner immédiatement à droite, même si c'est dangereux
    D: Reculer dans la voiture derrière vous
  answer: B
  explanation: Vous ne devez jamais vous engager dans une intersection contre un feu
    rouge pour dégager le passage à un véhicule d'urgence. Attendez que le feu passe
    au vert ou que le véhicule trouve un autre moyen de contourner.
- id: 184
  category: sharing_the_road
  question: 'Lorsque vous suivez une motocyclette, vous devez maintenir une distance
    de sécurité plus grande que d''habitude parce que :'
  choices:
    A: Les motocyclettes sont beaucoup plus lourdes que les voitures
    B: Les motocyclettes peuvent s'arrêter très rapidement et sont facilement cachées
      dans les angles morts
    C: Les motocyclettes sont tenues de circuler plus lentement que la limite de vitesse
    D: Les motocyclistes ne sont pas autorisés à utiliser des rétroviseurs
  answer: B
  explanation: Les motocyclettes peuvent s'arrêter plus rapidement que les voitures
    dans certaines conditions et sont plus difficiles à voir. Augmenter votre distance
    de sécurité vous donne plus de temps pour réagir si le motocycliste freine ou
    dévie pour éviter un danger.
- id: 185
  category: sharing_the_road
  question: Aux TNO, quelle est l'exigence de la loi sur le corridor de sécurité («
    Move Over ») lorsque vous dépassez un véhicule d'urgence ou une dépanneuse arrêté
    avec ses gyrophares allumés sur une route ?
  choices:
    A: Maintenir votre vitesse mais klaxonner
    B: S'arrêter complètement jusqu'à ce que le véhicule d'urgence parte
    C: Ralentir et se déplacer vers la voie non adjacente si cela peut se faire en
      toute sécurité
    D: Accélérer pour dépasser la scène le plus rapidement possible
  answer: C
  explanation: La loi sur le corridor de sécurité exige que les conducteurs ralentissent
    et, s'il y a plus d'une voie de circulation dans cette direction, qu'ils se déplacent
    dans la voie la plus éloignée du véhicule d'urgence ou de la dépanneuse arrêté.
- id: 186
  category: sharing_the_road
  question: Laquelle des situations suivantes est une cause fréquente de collisions
    entre voitures et motocyclettes aux intersections ?
  choices:
    A: Le conducteur de la voiture tournant à gauche devant une motocyclette qui arrive
      en sens inverse
    B: Le motocycliste circulant trop lentement
    C: Le conducteur de la voiture suivant la motocyclette de trop près
    D: Le motocycliste n'utilisant pas ses phares
  answer: A
  explanation: Une collision très courante se produit lorsqu'un conducteur de voiture
    tourne à gauche à une intersection, ne voyant pas ou évaluant mal la vitesse d'une
    motocyclette qui arrive en sens inverse.
- id: 187
  category: vehicle_information
  question: Dans les Territoires du Nord-Ouest, à quelle distance d'un véhicule venant
    en sens inverse devez-vous passer des feux de route aux feux de croisement ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Selon la Loi sur les véhicules automobiles des TNO, les conducteurs
    doivent passer aux feux de croisement lorsqu'un véhicule arrivant en sens inverse
    se trouve à moins de 150 mètres pour éviter d'éblouir l'autre conducteur.
- id: 188
  category: vehicle_information
  question: Selon les règlements sur l'équipement des véhicules des TNO, sur quelles
    vitres est-il interdit d'appliquer une pellicule teintée après l'achat ?
  choices:
    A: La lunette arrière seulement
    B: Les vitres latérales arrière seulement
    C: Le pare-brise et les vitres situées directement à la gauche et à la droite
      du conducteur
    D: Toutes les vitres peuvent être teintées tant qu'elles ne sont pas de type «
      limousine » (très sombres)
  answer: C
  explanation: Les règlements des TNO interdisent l'application de toute pellicule
    teintée sur le pare-brise ou sur les vitres latérales situées à gauche et à droite
    du conducteur.
- id: 189
  category: vehicle_information
  question: 'Chaque véhicule à moteur dans les Territoires du Nord-Ouest doit être
    équipé d''un feu arrière qui émet une lumière rouge visible d''une distance d''au
    moins :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Les règlements sur l'équipement des TNO précisent que les feux arrière
    doivent être clairement visibles d'une distance d'au moins 150 mètres vers l'arrière.
- id: 190
  category: vehicle_information
  question: Si le chargement ou la construction d'un véhicule obstrue la vue du conducteur
    dans le rétroviseur intérieur, quel équipement est requis ?
  choices:
    A: Un passager pour servir de guide
    B: Un rétroviseur intérieur grand angle
    C: Un rétroviseur extérieur sur les côtés gauche et droit du véhicule
    D: Un système de caméra de recul
  answer: C
  explanation: Si le rétroviseur intérieur est obstrué, le véhicule doit être équipé
    de rétroviseurs extérieurs sur les côtés gauche et droit pour offrir une vue claire
    de la route vers l'arrière.
- id: 191
  category: vehicle_information
  question: Combien de points d'inaptitude seront inscrits à votre dossier de conduite
    pour avoir omis de porter votre ceinture de sécurité dans les Territoires du Nord-Ouest
    ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Aux TNO, une condamnation pour défaut de port de la ceinture de sécurité
    entraîne l'ajout de 2 points d'inaptitude au dossier du conducteur.
- id: 192
  category: vehicle_information
  question: La loi des TNO exige que tout véhicule automobile (autre qu'une motocyclette)
    soit équipé de combien de systèmes de freinage distincts ?
  choices:
    A: Un seul système principal
    B: 'Deux : un frein de service et un frein de stationnement ou d''urgence'
    C: Trois, incluant un frein moteur
    D: Quatre, soit un pour chaque roue
  answer: B
  explanation: 'Les véhicules doivent être équipés de deux systèmes de freinage indépendants
    : le frein de service (frein au pied) et un frein de stationnement ou d''urgence.'
- id: 193
  category: vehicle_information
  question: 'Le klaxon d''un véhicule automobile doit être capable d''émettre un son
    audible dans des conditions normales à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Les règlements sur l'équipement des véhicules des TNO exigent qu'un
    klaxon soit audible à une distance d'au moins 60 mètres.
- id: 194
  category: vehicle_information
  question: 'La plaque d''immatriculation arrière d''un véhicule doit être éclairée
    par une lumière blanche de manière à être clairement lisible à une distance de
    :'
  choices:
    A: 10 mètres
    B: 15 mètres
    C: 25 mètres
    D: 50 mètres
  answer: B
  explanation: La Loi sur les véhicules automobiles des TNO exige que la plaque d'immatriculation
    arrière soit éclairée et lisible à une distance de 15 mètres.
- id: 195
  category: vehicle_information
  question: Dans les Territoires du Nord-Ouest, des garde-boue ou des ailes sont requis
    pour quelles roues d'un véhicule automobile ou d'une remorque ?
  choices:
    A: Les roues avant seulement
    B: Les roues arrière seulement
    C: Les quatre roues
    D: Seuls les véhicules équipés de pneus surdimensionnés en ont besoin
  answer: B
  explanation: Les règlements des TNO exigent que les roues arrière de chaque véhicule
    automobile et remorque soient équipées de garde-boue ou d'ailes pour réduire les
    éclaboussures et les débris.
- id: 196
  category: vehicle_information
  question: Quelle est la hauteur maximale légale autorisée pour un véhicule, y compris
    son chargement, dans les Territoires du Nord-Ouest sans permis spécial ?
  choices:
    A: 3,8 mètres
    B: 4,2 mètres
    C: 4,5 mètres
    D: 5,0 mètres
  answer: B
  explanation: La hauteur maximale d'un véhicule et de son chargement aux TNO est
    de 4,2 mètres. Tout ce qui dépasse cette limite nécessite un permis pour véhicule
    hors normes.
- id: 197
  category: vehicle_information
  question: Dans les Territoires du Nord-Ouest, pendant quelle période les phares
    d'un véhicule doivent-ils être allumés ?
  choices:
    A: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    B: Du coucher au lever du soleil
    C: D'une demi-heure après le coucher du soleil à une demi-heure avant le lever
      du soleil
    D: Uniquement lorsqu'il pleut ou qu'il neige
  answer: C
  explanation: Selon la Loi sur les véhicules automobiles des TNO, les phares doivent
    être utilisés d'une demi-heure après le coucher du soleil à une demi-heure avant
    le lever du soleil, et à tout autre moment où la visibilité est réduite à 60 mètres
    ou moins.
- id: 198
  category: vehicle_information
  question: Quelle est la profondeur de sculpture minimale légale des pneus pour un
    véhicule de tourisme dans les Territoires du Nord-Ouest ?
  choices:
    A: 1,0 millimètre
    B: 1,6 millimètre
    C: 2,5 millimètres
    D: 3,2 millimètres
  answer: B
  explanation: Les pneus sont considérés comme dangereux et illégaux si la profondeur
    de la bande de roulement est inférieure à 1,6 millimètre (environ 2/32 de pouce).
- id: 199
  category: vehicle_information
  question: 'Aux TNO, les feux de freinage (feux d''arrêt) doivent être visibles à
    la lumière normale du soleil à une distance d''au moins :'
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 60 mètres
    D: 100 mètres
  answer: B
  explanation: Les feux de freinage doivent être fonctionnels et visibles à une distance
    d'au moins 30 mètres à la lumière normale du soleil.
- id: 200
  category: vehicle_information
  question: En ce qui concerne les vitres teintées dans les Territoires du Nord-Ouest,
    laquelle des affirmations suivantes est vraie ?
  choices:
    A: N'importe quel degré de teinte est autorisé sur le pare-brise
    B: Aucune teinte n'est autorisée sur le pare-brise ou sur les vitres à gauche
      et à droite du conducteur
    C: La teinte est autorisée sur toutes les vitres à condition qu'elle soit installée
      en usine
    D: Seule une teinte de 50 % est autorisée sur les vitres latérales avant
  answer: B
  explanation: Les règlements des TNO interdisent l'utilisation de matériaux pare-soleil
    (teinte) sur le pare-brise et les vitres latérales situées immédiatement à gauche
    et à droite du conducteur.
- id: 201
  category: vehicle_information
  question: Quelle est l'exigence relative au système d'échappement d'un véhicule
    aux TNO ?
  choices:
    A: Il doit être assez bruyant pour avertir les piétons
    B: Il doit être équipé d'un silencieux qui empêche le bruit et la fumée excessifs
    C: Les silencieux sont facultatifs pour les véhicules immatriculés à l'extérieur
      de Yellowknife
    D: Les tuyaux d'échappement doivent être dirigés vers le trottoir
  answer: B
  explanation: Tout véhicule à moteur doit être équipé d'un silencieux en bon état
    de fonctionnement pour éviter les bruits excessifs ou inhabituels et la fumée
    gênante.
- id: 202
  category: vehicle_information
  question: 'Le frein de stationnement d''un véhicule doit être capable de maintenir
    le véhicule :'
  choices:
    A: Sur une surface plane uniquement
    B: Uniquement lorsque le moteur tourne
    C: Sur n'importe quelle pente sur laquelle il est utilisé
    D: Pendant au moins 10 minutes
  answer: C
  explanation: Le frein de stationnement doit être un mécanisme distinct capable de
    maintenir le véhicule immobile sur n'importe quelle pente sur laquelle il est
    utilisé, quelle que soit la charge.
- id: 203
  category: vehicle_information
  question: 'Les clignotants doivent être visibles d''une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: A
  explanation: Les clignotants doivent être visibles à l'avant et à l'arrière d'une
    distance d'au moins 30 mètres.
- id: 204
  category: vehicle_information
  question: 'Aux TNO, tout véhicule automobile équipé d''un pare-brise doit également
    avoir :'
  choices:
    A: Un système de dégivrage et des essuie-glaces fonctionnels
    B: Un écran métallique de protection
    C: Un verre autonettoyant
    D: Un pare-brise de rechange dans le coffre
  answer: A
  explanation: Les véhicules doivent être équipés d'essuie-glaces fonctionnels et
    d'un système de dégivrage/désembuage pour maintenir une vue claire pour le conducteur,
    ce qui est particulièrement critique dans les conditions hivernales des TNO.
- id: 205
  category: signs_and_signals
  question: En approchant d'un feu de signalisation rouge clignotant à une intersection,
    que doit faire un conducteur ?
  choices:
    A: Ralentir et avancer avec prudence sans s'arrêter
    B: S'arrêter complètement et attendre que le feu devienne vert fixe
    C: S'arrêter complètement et ne repartir que lorsqu'il peut le faire en toute
      sécurité
    D: Le traiter comme un panneau de cédez le passage et ne s'arrêter que si d'autres
      véhicules sont présents
  answer: C
  explanation: Un feu rouge clignotant doit être traité de la même manière qu'un panneau
    d'arrêt. Vous devez marquer un arrêt complet et ne repartir que lorsque la voie
    est libre.
- id: 206
  category: signs_and_signals
  question: Que signifie une ligne jaune continue de votre côté de la ligne médiane
    sur une route des TNO ?
  choices:
    A: Le dépassement est autorisé si la route devant est libre
    B: Vous êtes sur une rue à sens unique
    C: Le dépassement est interdit
    D: Vous devez tourner à gauche à la prochaine intersection
  answer: C
  explanation: Une ligne jaune continue de votre côté de la ligne médiane signifie
    que le dépassement est interdit car il est dangereux.
- id: 207
  category: signs_and_signals
  question: Pour signaler un virage à droite à l'aide de signaux manuels, comment
    le bras du conducteur doit-il être positionné ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre
    B: Le bras gauche sorti et plié vers le haut au niveau du coude
    C: Le bras gauche sorti et plié vers le bas au niveau du coude
    D: Le bras droit tendu horizontalement par la fenêtre
  answer: B
  explanation: Le signal manuel pour un virage à droite est le bras gauche tendu vers
    l'extérieur et plié vers le haut à un angle de 90 degrés.
- id: 208
  category: signs_and_signals
  question: Lorsque vous voyez un panneau triangulaire « Cédez le passage », quelle
    est l'obligation légale ?
  choices:
    A: Toujours marquer un arrêt complet quel que soit le trafic
    B: Accélérer pour s'insérer rapidement dans le flux de la circulation
    C: Ralentir ou s'arrêter si nécessaire pour céder le passage aux autres usagers
    D: S'arrêter uniquement s'il y a des piétons dans le passage pour piétons
  answer: C
  explanation: Un panneau de cédez le passage signifie que vous devez ralentir et
    être prêt à vous arrêter pour laisser passer tout véhicule ou piéton ayant la
    priorité avant de continuer.
- id: 209
  category: signs_and_signals
  question: 'Aux Territoires du Nord-Ouest, un feu vert clignotant à une intersection
    indique généralement :'
  choices:
    A: Un feu vert avancé pour les virages à gauche
    B: Un signal activé par les piétons
    C: Que le feu de signalisation est défectueux
    D: Que vous devez vous arrêter et avancer avec prudence
  answer: B
  explanation: Dans de nombreuses juridictions du Nord, un feu vert clignotant indique
    un signal activé par les piétons ; les conducteurs doivent s'attendre à ce que
    le feu passe au jaune, puis au rouge peu de temps après.
- id: 210
  category: signs_and_signals
  question: Que signifient les doubles lignes blanches continues peintes sur une chaussée
    ?
  choices:
    A: Le changement de voie est interdit
    B: Le dépassement est autorisé si sécuritaire
    C: La route est à sens unique
    D: Vous entrez dans une zone à grande vitesse
  answer: A
  explanation: Les doubles lignes blanches continues indiquent que les changements
    de voie sont interdits et que vous devez rester dans votre voie actuelle.
- id: 211
  category: signs_and_signals
  question: Si vous êtes à une intersection avec un feu rouge et une flèche verte
    pointant vers la droite, qu'êtes-vous autorisé à faire ?
  choices:
    A: Attendre que le feu rouge passe au vert avant de tourner
    B: Tourner à droite seulement après avoir marqué un arrêt complet
    C: Avancer dans la direction de la flèche après avoir cédé le passage aux piétons
      et aux autres véhicules
    D: Avancer dans la direction de la flèche sans ralentir
  answer: C
  explanation: Une flèche verte accompagnée d'un feu rouge signifie que vous pouvez
    avancer dans la direction de la flèche, mais vous devez d'abord céder le passage
    aux piétons et aux autres véhicules déjà engagés dans l'intersection.
- id: 212
  category: signs_and_signals
  question: Dans les Territoires du Nord-Ouest, de quelle couleur sont les panneaux
    utilisés pour indiquer des travaux de construction ou d'entretien temporaires
    ?
  choices:
    A: Jaune
    B: Rouge
    C: Orange
    D: Vert fluorescent
  answer: C
  explanation: Les panneaux orange sont utilisés pour avertir les conducteurs de conditions
    temporaires telles que des travaux de construction, d'entretien ou de services
    publics sur la route.
- id: 213
  category: signs_and_signals
  question: Quelle est la signification générale d'un panneau de signalisation en
    forme de losange ?
  choices:
    A: Arrêt ou Cédez le passage
    B: Réglementation (obligation d'obéir)
    C: Avertissement ou Danger
    D: Information et direction
  answer: C
  explanation: Les panneaux en forme de losange sont des panneaux d'avertissement
    qui alertent les conducteurs de dangers potentiels ou de changements dans les
    conditions de la route à venir.
- id: 214
  category: signs_and_signals
  question: 'Un grand « X » blanc peint sur la chaussée d''une route indique généralement
    :'
  choices:
    A: Un passage pour piétons
    B: Une zone de stationnement interdit
    C: Un passage à niveau (chemin de fer) à venir
    D: Une intersection prochaine
  answer: C
  explanation: Un grand « X » blanc sur la chaussée est un avertissement indiquant
    que vous approchez d'un passage à niveau.
- id: 215
  category: signs_and_signals
  question: Que signifie un feu jaune clignotant ?
  choices:
    A: S'arrêter et attendre que le feu passe au vert
    B: Accélérer pour dégager l'intersection rapidement
    C: Ralentir et avancer avec prudence
    D: L'intersection est fermée à toute circulation
  answer: C
  explanation: Un feu jaune clignotant avertit les conducteurs de ralentir et de traverser
    l'intersection avec prudence.
- id: 216
  category: signs_and_signals
  question: Selon les règles de conduite des TNO, où est-il interdit de faire un demi-tour
    (virage en U), même s'il n'y a pas de panneau l'interdisant ?
  choices:
    A: Sur n'importe quelle rue résidentielle
    B: Dans une courbe ou près du sommet d'une colline où la visibilité est inférieure
      à 150 mètres
    C: À toute intersection munie de feux de circulation
    D: Dans un cul-de-sac
  answer: B
  explanation: Les demi-tours sont illégaux dans les courbes ou sur les collines où
    vous ne pouvez pas être vu par les autres conducteurs arrivant de l'une ou l'autre
    direction à moins de 150 mètres.
- id: 217
  category: signs_and_signals
  question: Dans les Territoires du Nord-Ouest, que devez-vous faire à l'approche
    d'un feu rouge clignotant ?
  choices:
    A: Ralentir et avancer avec prudence
    B: S'arrêter et attendre que le feu passe au vert
    C: S'arrêter, céder le passage à la circulation transversale et aux piétons, puis
      avancer quand cela est sécuritaire
    D: Céder le passage uniquement à la circulation venant de la droite
  answer: C
  explanation: Selon le Guide du conducteur des TNO, un feu rouge clignotant a la
    même signification qu'un panneau d'arrêt. Vous devez marquer un arrêt complet
    et ne repartir que lorsque vous pouvez le faire en toute sécurité.
- id: 218
  category: signs_and_signals
  question: Que indique un feu jaune (ambre) clignotant dans les Territoires du Nord-Ouest
    ?
  choices:
    A: S'arrêter et attendre que le feu change
    B: Ralentir et avancer avec prudence
    C: Accélérer pour dégager l'intersection rapidement
    D: Le feu est sur le point de passer au rouge
  answer: B
  explanation: Un feu jaune clignotant est un signal de prudence indiquant que vous
    devez ralentir et être prêt à vous arrêter si nécessaire, mais vous n'avez pas
    besoin de marquer un arrêt complet si la voie est libre.
- id: 219
  category: signs_and_signals
  question: Quel signal manuel est la manière correcte d'indiquer un virage à droite
    ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre
    B: Le bras gauche sorti par la fenêtre et plié vers le haut au niveau du coude
    C: Le bras gauche sorti par la fenêtre et pointé vers le sol
    D: Le bras droit tendu horizontalement par la fenêtre
  answer: B
  explanation: Pour signaler un virage à droite à l'aide de signaux manuels, le conducteur
    doit sortir son bras gauche par la fenêtre et le plier vers le haut à un angle
    de 90 degrés.
- id: 220
  category: signs_and_signals
  question: 'Une ligne jaune continue à côté d''une ligne jaune pointillée sur la
    chaussée signifie :'
  choices:
    A: Le dépassement est interdit pour les véhicules des deux côtés
    B: Le dépassement est autorisé pour les véhicules des deux côtés
    C: Le dépassement est autorisé uniquement pour le véhicule ayant la ligne pointillée
      de son côté
    D: Le dépassement est autorisé uniquement pour le véhicule ayant la ligne continue
      de son côté
  answer: C
  explanation: Aux TNO, une ligne pointillée de votre côté de la route signifie que
    vous pouvez dépasser si cela est sécuritaire. Une ligne continue de votre côté
    signifie que le dépassement est interdit.
- id: 221
  category: signs_and_signals
  question: Que signifient les doubles lignes jaunes continues au centre de la chaussée
    ?
  choices:
    A: Le dépassement est autorisé dans les deux sens
    B: Le dépassement est interdit dans les deux sens
    C: Le dépassement est autorisé uniquement pendant la journée
    D: La voie est réservée aux véhicules d'urgence
  answer: B
  explanation: Les doubles lignes jaunes continues signifient que le dépassement est
    strictement interdit pour la circulation circulant dans les deux sens.
- id: 222
  category: signs_and_signals
  question: Lorsque vous voyez un panneau « Cédez le passage » (Yield), que devez-vous
    faire ?
  choices:
    A: S'arrêter complètement, peu importe la circulation
    B: Accélérer pour s'insérer dans la circulation
    C: Ralentir et s'arrêter si nécessaire pour laisser passer les autres véhicules
      ou les piétons
    D: Toujours s'arrêter et attendre 3 secondes
  answer: C
  explanation: Un panneau de cédez le passage signifie que vous devez ralentir et
    accorder la priorité à la circulation dans l'intersection ou sur la route de raccordement.
    Vous ne vous arrêtez que si les conditions de circulation l'exigent.
- id: 223
  category: signs_and_signals
  question: Que signifie une flèche verte fixe pointant vers la gauche combinée à
    un feu rouge ?
  choices:
    A: Vous devez vous arrêter et attendre un feu vert complet
    B: Vous pouvez tourner à gauche, car il s'agit d'un virage protégé
    C: Vous ne pouvez tourner à gauche qu'après un arrêt complet
    D: Vous devez céder le passage à toute la circulation venant en sens inverse avant
      de tourner à gauche
  answer: B
  explanation: Une flèche verte signifie que vous bénéficiez d'un virage « protégé
    » dans la direction de la flèche. La circulation venant en sens inverse est arrêtée
    par un feu rouge.
- id: 224
  category: signs_and_signals
  question: Aux TNO (NWT), qu'indique un marquage en forme de losange blanc sur une
    voie spécifique ?
  choices:
    A: La voie est réservée uniquement à la circulation à grande vitesse
    B: La voie est réservée à des véhicules spécifiques comme les autobus ou le covoiturage
    C: La voie est fermée pour cause de travaux
    D: La voie est réservée uniquement au stationnement d'urgence
  answer: B
  explanation: Un losange blanc sur la chaussée indique une voie réservée, souvent
    pour les autobus, les taxis ou les véhicules multioccupants (VMO/HOV).
- id: 225
  category: signs_and_signals
  question: Quel signal manuel indique qu'un conducteur ralentit ou s'arrête ?
  choices:
    A: Bras gauche tendu horizontalement
    B: Bras gauche sorti et plié vers le haut
    C: Bras gauche sorti et plié vers le bas
    D: Bras droit agitant par la fenêtre
  answer: C
  explanation: Le signal manuel pour s'arrêter ou ralentir consiste à sortir le bras
    gauche par la fenêtre et à le plier vers le bas au niveau du coude.
- id: 226
  category: signs_and_signals
  question: Quelle est la couleur principale des panneaux utilisés pour avertir les
    conducteurs de travaux de construction ou d'entretien à venir ?
  choices:
    A: Jaune
    B: Rouge
    C: Orange
    D: Vert
  answer: C
  explanation: Aux TNO et partout au Canada, l'orange est la couleur de fond standard
    pour les panneaux d'avertissement de construction et d'entretien.
- id: 227
  category: signs_and_signals
  question: À un arrêt multidirectionnel (quatre directions), si deux véhicules arrivent
    en même temps à angle droit l'un de l'autre, qui a la priorité ?
  choices:
    A: Le véhicule à gauche
    B: Le véhicule à droite
    C: Le véhicule circulant sur la route la plus large
    D: Le véhicule circulant à la vitesse la plus élevée
  answer: B
  explanation: Lorsque deux véhicules arrivent en même temps à un arrêt multidirectionnel,
    le conducteur de gauche doit céder la priorité au conducteur de droite.
- id: 228
  category: signs_and_signals
  question: Que signifie un feu jaune (ambre) fixe à une intersection ?
  choices:
    A: Accélérer pour dégager l'intersection avant le feu rouge
    B: S'arrêter si vous pouvez le faire en toute sécurité ; sinon, avancer avec prudence
    C: Vous avez la priorité pour tourner à gauche
    D: S'arrêter et attendre que le feu passe au vert
  answer: B
  explanation: Un feu jaune fixe signifie que le signal est sur le point de passer
    au rouge. Vous devez vous arrêter avant d'entrer dans l'intersection, à moins
    d'être si près que l'arrêt serait dangereux.
- id: 229
  category: signs_and_signals
  question: Un marquage au sol en forme de « X » indique généralement quel type de
    danger à venir ?
  choices:
    A: Un carrefour
    B: Une zone hospitalière
    C: Un passage à niveau (chemin de fer)
    D: Un passage pour piétons
  answer: C
  explanation: Un grand « X » peint sur la chaussée est un avertissement indiquant
    que vous approchez d'un passage à niveau.
