  question: Why is it dangerous to try to 'squeeze' between a commercial vehicle and
    the curb at an intersection?
  choices:
    A: Commercial vehicles often swing wide to safely make turns and cannot see cars
      directly beside them.
    B: The curb lane is legally reserved for bicycles and mopeds only.
    C: Commercial vehicles accelerate much faster than cars when turning.
    D: It is illegal for passenger vehicles to drive in the right lane near intersections.
  answer: A
  explanation: Large commercial truck and bus drivers sometimes need to swing wide
    to safely make a turn. They cannot see cars directly behind or beside them, making
    the 'squeeze play' an invitation to disaster.
- id: 234
  category: sharing_the_road
  question: Under Nevada law, when may motorcycles be operated two abreast in a single
    traffic lane?
  choices:
    A: At all times, regardless of the drivers' consent.
    B: Only when traveling under 30 mph.
    C: With the mutual consent of the drivers.
    D: Motorcycles are never allowed to ride side by side.
  answer: C
  explanation: Per NRS 486.351 (3), motorcycles and mopeds may be operated no more
    than two abreast in a single traffic lane with the consent of the drivers.
- id: 235
  category: safe_driving_rules
  question: Why is it especially important to dim your headlights when approaching
    a motorcycle?
  choices:
    A: High beams will cause the motorcycle's engine to stall.
    B: The blinding effect of high beams can be far more dangerous to motorcyclists
      because they use balance to steer.
    C: Motorcycle headlights are not as bright as car headlights.
    D: High beams reflect off the motorcycle's mirrors and blind the driver behind
      them.
  answer: B
  explanation: Because motorcyclists use their balance to steer their vehicles, the
    blinding effect of high beams can be far more dangerous to them than to drivers
    of cars or large commercial trucks.
- id: 236
  category: vehicle_information
  question: In Nevada, a moped is defined as having a maximum speed of how many miles
    per hour on a flat surface?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Nevada defines mopeds based on motor size, horsepower, and a 30 miles
    per hour maximum speed on a flat or near-flat surface.
- id: 237
  category: safe_driving_rules
  question: 'Moped operators must remain in the extreme right-hand lane of any road
    EXCEPT when:'
  choices:
    A: The moped is traveling at its maximum speed.
    B: Preparing to make a left turn within one-quarter mile.
    C: Driving in a residential neighborhood.
    D: The operator is wearing a brightly colored helmet.
  answer: B
  explanation: Moped operators must remain in the extreme right-hand lane unless there
    is a single lane of traffic, they are preparing to make a left turn (within one-quarter
    mile), it is unsafe, or directed by a police officer.
- id: 238
  category: safe_driving_rules
  question: When are you NOT required to stop for a school bus displaying a flashing
    red signal?
  choices:
    A: When you are traveling in the opposite direction on a divided highway.
    B: When you are traveling in the opposite direction on a two-lane road.
    C: When you are running late for an emergency.
    D: When the school bus is stopped at a railroad crossing.
  answer: A
  explanation: 'There is one exception to the rule of stopping for a school bus with
    flashing red lights: on divided highways, you are only required to stop when you
    are traveling in the same direction as the school bus.'
- id: 239
  category: penalties_and_points
  question: What penalty may a motorist face for causing even a minor collision with
    a bicycle or intentionally interfering with its movement?
  choices:
    A: A verbal warning from a police officer.
    B: A mandatory defensive driving course.
    C: A charge of reckless driving and a driver's license suspension.
    D: A permanent revocation of their vehicle registration.
  answer: C
  explanation: Motorists who cause even a minor collision with a bicycle or pedestrian
    or who intentionally interfere with the movement of a bicycle may be charged with
    reckless driving. Penalties include a driver's license suspension.
- id: 240
  category: safe_driving_rules
  question: Under what circumstance is a motorist allowed to drive in a designated
    bicycle lane?
  choices:
    A: When passing a slower vehicle on the right.
    B: When traffic is heavily congested.
    C: When entering or leaving an alley or driveway.
    D: When preparing to park on the opposite side of the street.
  answer: C
  explanation: Motorists may not stop, park or drive on a designated bicycle path
    or lane unless they are entering or leaving an alley or driveway, performing official
    duties, are directed by a police officer, or an emergency situation exists.
- id: 241
  category: safe_driving_rules
  question: 'In Nevada, it is illegal for anyone under the age of 18 to ride in the
    bed of a pickup truck on a paved highway UNLESS:'
  choices:
    A: They are wearing a seatbelt fastened to the truck bed.
    B: The vehicle is being used while farming or ranching.
    C: The truck is traveling under 25 mph.
    D: They are accompanied by an adult in the truck bed.
  answer: B
  explanation: Anyone under the age of 18 may not ride in the bed of a flatbed or
    pickup truck on a paved highway in Nevada. Exceptions include being driven in
    an authorized parade or if the vehicle is being used while farming or ranching.
- id: 242
  category: sharing_the_road
  question: What should you keep in mind regarding a motorcycle's turn signals?
  choices:
    A: They are usually brighter than a car's turn signals.
    B: They are not self-canceling on most motorcycles.
    C: They are only required on the rear of the motorcycle.
    D: They automatically activate when the motorcycle leans.
  answer: B
  explanation: Turn signals are not self-canceling on most motorcycles. Before you
    make a lane change or turn that depends on a motorcycle's path, be sure you know
    what the motorcyclist is doing.
- id: 243
  category: sharing_the_road
  question: Which of the following is a cyclist NOT allowed to do while riding?
  choices:
    A: Wear brightly colored clothing.
    B: Ride in a traffic lane.
    C: Use their right arm to signal a right turn.
    D: Wear a headset or cellular phone earpiece.
  answer: D
  explanation: According to the manual's 'Cyclists Should Not...' section, cyclists
    should not wear a headset (headphones, cellular phone earpiece, etc.) when riding.
- id: 244
  category: sharing_the_road
  question: What must a driver do if they are turning right and a pedestrian is crossing
    the street on a green light?
  choices:
    A: Honk to warn the pedestrian to move faster.
    B: Proceed carefully if there is enough room to go around.
    C: Yield to the pedestrian.
    D: The pedestrian must yield to the turning vehicle.
  answer: C
  explanation: The manual states that when a traffic signal turns green, drivers must
    yield to persons who are still crossing the street, and pedestrians have the right
    of way over motorists making a right-hand turn.
- id: 245
  category: safe_driving_rules
  question: According to the manual, where does a crosswalk exist?
  choices:
    A: Only where painted white lines are present on the road.
    B: Anywhere two streets intersect, even if it is not painted or marked.
    C: Only at intersections controlled by traffic signals or stop signs.
    D: Only in designated school zones.
  answer: B
  explanation: The manual specifies that a crosswalk exists anywhere two streets intersect,
    even at a 'T' intersection, and exists even if it is not painted or marked.
- id: 246
  category: safe_driving_rules
  question: If a vehicle ahead of you is slowing down or stopped at an intersection,
    what is it illegal for you to do?
  choices:
    A: Stop behind the vehicle and wait.
    B: Honk your horn to alert the driver.
    C: Overtake the vehicle before determining why it slowed or stopped.
    D: Turn on your hazard lights.
  answer: C
  explanation: It is illegal for motorists to overtake any vehicle that is slowing
    down or stopped until the motorist slows down enough to determine why the other
    vehicle has slowed or stopped.
- id: 247
  category: sharing_the_road
  question: Why should you not stop your car more than five feet from a crosswalk
    when a blind or visually impaired pedestrian is waiting?
  choices:
    A: The pedestrian uses the sound of your engine as a guide.
    B: It blocks the view of other drivers approaching the intersection.
    C: It is illegal to stop that far back from any intersection.
    D: The pedestrian needs to be able to touch your car with their cane.
  answer: A
  explanation: The manual advises not to stop your car more than five feet from the
    crosswalk because a pedestrian who is blind or visually impaired uses the sound
    of your engine as a guide.
- id: 248
  category: sharing_the_road
  question: How does a blind or visually impaired pedestrian indicate that you can
    proceed?
  choices:
    A: By waving their hand at your vehicle.
    B: By making direct eye contact with you.
    C: By taking a step back and pulling in their cane.
    D: By pointing their cane at your vehicle.
  answer: C
  explanation: The manual states that if a blind or visually impaired pedestrian takes
    a step back and pulls in their cane, they are letting you know you can go.
- id: 249
  category: vehicle_information
  question: What is the maximum total length of a vehicle combination that a non-commercial
    Class C driver may tow?
  choices:
    A: 50 feet
    B: 60 feet
    C: 70 feet
    D: 80 feet
  answer: C
  explanation: Non-commercial Class C drivers may tow a single vehicle or a combination
    of vehicles with a gross vehicle weight rating (GVWR) of 10,000 pounds or less
    and a total length of no more than 70 feet.
- id: 250
  category: vehicle_information
  question: What does Gross Combination Weight (GCW) refer to?
  choices:
    A: The total weight of a single vehicle plus its load.
    B: The maximum safe weight a tire can carry at a specified pressure.
    C: The total weight of a powered unit plus trailer(s) plus the load.
    D: The weight transmitted to the ground by one set of axles.
  answer: C
  explanation: Gross combination weight (GCW) is defined as the total weight of a
    powered unit plus trailer(s) plus the load.
- id: 251
  category: vehicle_information
  question: What is a consequence of having too much weight on the steering axle of
    a towing vehicle?
  choices:
    A: The drive wheels may spin easily due to poor traction.
    B: It can make steering difficult and cause damage to the steering axle and tires.
    C: The vehicle will gain too much speed on uphill grades.
    D: The trailer is more likely to overturn on turns.
  answer: B
  explanation: Improper weight balance can make handling unsafe. Too much weight on
    the steering axle can make steering difficult and cause damage to the steering
    axle and tires.
- id: 252
  category: vehicle_information
  question: What happens if there is too little weight on the driving axles of a towing
    vehicle?
  choices:
    A: The steering axle will be damaged.
    B: The vehicle will have poor traction and the drive wheels may spin easily.
    C: The trailer will become top-heavy.
    D: The brakes will fail immediately.
  answer: B
  explanation: The manual states that too little weight on the driving axles can cause
    poor traction and the drive wheels may spin easily.
- id: 253
  category: vehicle_information
  question: When hitching a trailer to a vehicle using a ball-and-hitch coupler, how
    should the safety chains be configured?
  choices:
    A: Attached and crossed.
    B: Hanging loosely to touch the ground.
    C: Attached only to the right side of the hitch.
    D: Wrapped tightly around the ball attachment.
  answer: A
  explanation: When hitching a trailer, you must make sure the safety chains are attached
    and crossed, and not tangled, pinched, or dragging.
- id: 254
  category: sharing_the_road
  question: If there is no sidewalk available, where should pedestrians walk?
  choices:
    A: On the right side of the road moving with traffic.
    B: In the center of the road.
    C: On the side of the road facing the traffic.
    D: Pedestrians are not allowed on roads without sidewalks.
  answer: C
  explanation: 'The manual states: ''If there is a sidewalk, pedestrians should use
    it. If there is no sidewalk, pedestrians should walk on the side of the road facing
    the traffic.'''
- id: 255
  category: sharing_the_road
  question: If a crossing guard is present at a crosswalk, when may a motorist proceed?
  choices:
    A: As soon as the guard lowers their stop sign.
    B: When the guard is completely out of the crosswalk.
    C: When the children have crossed, even if the guard is still in the road.
    D: After coming to a complete stop for 3 seconds.
  answer: B
  explanation: If a crossing guard is present, motorists must wait until the guard
    is completely out of the crosswalk before proceeding.
- id: 256
  category: sharing_the_road
  question: Which of the following is a recommended action when encountering a blind
    or visually impaired pedestrian?
  choices:
    A: Give them verbal directions to help them cross safely.
    B: Honk lightly to let them know your vehicle is there.
    C: Wait 3-4 seconds to give them time to decide if they want to cross.
    D: Stop in the middle of the crosswalk to block other traffic for them.
  answer: C
  explanation: The manual suggests giving blind or visually impaired pedestrians time
    to decide if they want to cross the street, noting that waiting 3-4 seconds is
    a good rule of thumb. It explicitly says do NOT give verbal direction, honk, or
    stop in the middle of a crosswalk.
- id: 257
  category: defensive_driving
  question: What are two things a driver can do to prevent a trailer rollover?
  choices:
    A: Go fast around turns and keep cargo piled high.
    B: Go slowly around turns and keep the cargo as close to the ground as possible.
    C: Overload the front axle and use a fifth-wheel hitch.
    D: Put the heaviest items on top and brake firmly in curves.
  answer: B
  explanation: 'The manual states there are two things a driver can do to prevent
    a rollover: Go slowly around turns, and keep the cargo as close to the ground
    as possible.'
- id: 258
  category: vehicle_information
  question: What is a disadvantage of using a fifth-wheel hitch?
  choices:
    A: It is highly unstable and prone to weight distribution issues.
    B: It takes up most of the space in the bed of the truck.
    C: It cannot be used with electric lines or safety chains.
    D: It requires the trailer to have a completely flat front end.
  answer: B
  explanation: According to the manual, a disadvantage to a fifth-wheel hitch is that
    it takes up most of the space in the bed of the truck and requires that the remaining
    space behind the hitch assembly is kept clear for turning corners.
- id: 259
  category: safe_driving_rules
  question: What must you do before backing your vehicle under a fifth-wheel trailer?
  choices:
    A: Make sure the trailer brakes are locked.
    B: Disconnect all electric lines.
    C: Ensure the release arm is in the closed position.
    D: Empty the truck bed completely.
  answer: A
  explanation: 'The manual states: ''Before backing your vehicle under the trailer,
    make sure the trailer brakes are locked.'''
- id: 260
  category: safe_driving_rules
  question: After beginning an extended trip, within how many miles should you inspect
    the trailer and load-securing devices again?
  choices:
    A: 10 miles
    B: 100 miles
    C: 50 miles
    D: 200 miles
  answer: C
  explanation: The manual advises to 'Inspect the trailer and the load-securing devices
    again within 50 miles after beginning an extended trip.'
- id: 261
  category: safe_driving_rules
  question: During an extended trip, how often should you make needed adjustments
    and inspect the trailer after the initial 50-mile check?
  choices:
    A: Every 3 hours or 150 miles
    B: Every 2 hours or 100 miles
    C: Every 4 hours or 200 miles
    D: Every 5 hours or 250 miles
  answer: A
  explanation: After the initial 50-mile check, you should 'Make any needed adjustments
    and inspect again after you have driven for 3 hours or 150 miles.'
- id: 262
  category: vehicle_information
  question: How does the weight of a heavy vehicle affect its stopping distance?
  choices:
    A: Empty trucks require greater stopping distances because they have less traction.
    B: Fully loaded trucks require much greater stopping distances than empty trucks.
    C: The weight of the vehicle has no effect on its stopping distance.
    D: Empty trucks stop faster because the brakes have less weight to absorb.
  answer: A
  explanation: The manual explains that brakes, tires, springs, and shock absorbers
    on heavy vehicles are designed to work best when fully loaded. 'Empty trucks actually
    require greater stopping distances because they have less traction.'
- id: 263
  category: safe_driving_rules
  question: When backing a vehicle with a trailer, which direction should you initially
    turn the steering wheel?
  choices:
    A: In the direction you want the trailer to go.
    B: Keep the steering wheel perfectly straight.
    C: Turn the wheel sharply to the right regardless of direction.
    D: In the opposite direction you want the trailer to go.
  answer: D
  explanation: When backing with a trailer, the manual instructs to 'turn the steering
    wheel in the opposite direction. Once the trailer starts to turn, you must turn
    the wheel the other way to follow the trailer.'
- id: 264
  category: defensive_driving
  question: Why is backing toward the right side with a trailer considered very dangerous?
  choices:
    A: The trailer is more likely to disconnect from the hitch.
    B: The steering wheel locks when turning right in reverse.
    C: You cannot see as well on the right side.
    D: It causes the trailer brakes to fail.
  answer: C
  explanation: 'The manual states: ''Backing toward the right side is very dangerous
    because you can’t see as well. If you back and turn toward the driver’s side,
    watch the rear of your vehicle by looking out the side window.'''
- id: 265
  category: safe_driving_rules
  question: If you see your trailer getting off course while backing, how should you
    correct the drift?
  choices:
    A: Accelerate to straighten the trailer out.
    B: Apply the trailer brakes immediately.
    C: Turn the top of the steering wheel opposite to the drift.
    D: Turn the top of the steering wheel in the direction of the drift.
  answer: D
  explanation: To correct drift immediately, 'As soon as you see the trailer getting
    off course, correct it by turning the top of the steering wheel in the direction
    of the drift.'
- id: 266
  category: safe_driving_rules
  question: If you are driving a large vehicle that must swing wide to make a right
    turn, how should you execute the turn?
  choices:
    A: Turn wide as you complete the turn, keeping the rear close to the curb.
    B: Turn wide to the left as you start the turn.
    C: Back up before making the turn to get a better angle.
    D: Swing into the oncoming traffic lane before starting the turn.
  answer: A
  explanation: 'The manual advises: ''If driving a vehicle that cannot make the right
    turn without swinging into another lane, turn wide as you complete the turn. Keep
    the rear of your trailer close to the curb.'''
- id: 267
  category: defensive_driving
  question: Why should you NOT turn wide to the left as you start a right turn with
    a large vehicle?
  choices:
    A: It will cause the trailer to off-track into the curb.
    B: It requires too much steering effort and may lock the wheels.
    C: A following driver may think you are turning left and try to pass you on the
      right.
    D: The trailer's safety chains may break from the tension.
  answer: C
  explanation: 'The manual warns: ''Don’t turn wide to the left as you start the turn.
    A following driver may think you are turning left and try to pass you on the right.
    You could crash into the other vehicle as you complete your turn.'''
- id: 268
  category: safe_driving_rules
  question: When making a left turn with a large vehicle, why should you reach the
    center of the intersection before starting the turn?
  choices:
    A: To allow oncoming traffic to pass on your right.
    B: To trigger the traffic light sensors in the intersection.
    C: To give pedestrians more time to cross the street.
    D: To prevent the left side of your vehicle from hitting another vehicle due to
      off-tracking.
  answer: D
  explanation: On a left turn, make sure you have reached the center of the intersection
    before you start the turn because 'If you turn too soon, the left side of your
    vehicle may hit another vehicle due to off-tracking.'
- id: 269
  category: safe_driving_rules
  question: If there are two turning lanes for a left turn, which lane should a driver
    of a large vehicle take?
  choices:
    A: The right-hand turn lane.
    B: The inside (left-hand) turn lane.
    C: Whichever lane has less traffic.
    D: The lane closest to the center line.
  answer: A
  explanation: 'The manual states: ''If there are two turning lanes, always take the
    right hand turn lane. Do not start in the inside lane because you may have to
    swing right to make the turn.'''
- id: 270
  category: vehicle_information
  question: How does the load of a trailer affect its overhead clearance?
  choices:
    A: A loaded trailer is higher than an empty one.
    B: The load has no effect on the height of the trailer.
    C: An empty trailer is higher than a loaded one.
    D: A loaded trailer is wider, but the height remains the same.
  answer: C
  explanation: According to the manual, 'The weight of a vehicle changes its height.
    An empty trailer is higher than a loaded one.'
- id: 271
  category: defensive_driving
  question: Why should you not assume that the posted height at bridges and overpasses
    is always correct?
  choices:
    A: Repaving or packed snow may have reduced the clearance since the height was
      posted.
    B: Signs are often vandalized or outdated.
    C: Bridges expand significantly in hot weather, lowering the clearance.
    D: The posted height only applies to passenger cars, not commercial vehicles.
  answer: A
  explanation: 'The manual warns: ''Do not assume that the height posted at bridges
    and overpasses is correct. Repaving or packed snow may have reduced the clearances
    since the height was posted.'''
- id: 272
  category: vehicle_information
  question: Which of the following hazards can cause a heavily loaded vehicle to drag
    or get hung up underneath?
  choices:
    A: Freshly painted crosswalks.
    B: Rumble strips on the highway.
    C: Wet asphalt.
    D: Railroad tracks sticking up several inches.
  answer: D
  explanation: The manual notes that space underneath can be very small when heavily
    loaded, and 'Railroad tracks can stick up several inches... Don’t take a chance
    on getting hung up halfway across.'
- id: 273
  category: vehicle_information
  question: When towing a combination of vehicles, where must the heaviest vehicle
    be placed?
  choices:
    A: In the rear position
    B: In the first position behind the towing vehicle
    C: In the middle position
    D: It does not matter as long as it is secured
  answer: B
  explanation: When towing a combination of vehicles, the heaviest vehicle must always
    be in the first position behind the towing vehicle. The lighter vehicle should
    be in the rear.
- id: 274
  category: defensive_driving
  question: How does the stopping distance of a large combination vehicle change when
    it is empty compared to when it is fully loaded?
  choices:
    A: It takes less time to stop when empty.
    B: It takes longer to stop when empty.
    C: The stopping distance is exactly the same.
    D: It cannot be determined without knowing the speed.
  answer: B
  explanation: Large combination vehicles that are empty take longer to stop than
    when they are fully loaded. When lightly loaded, stiff suspension springs and
    strong brakes give poor traction.
- id: 275
  category: safe_driving_rules
  question: What is the correct action to take if your trailer's wheels lock up and
    it begins to skid?
  choices:
    A: Apply the trailer hand brake immediately.
    B: Steer sharply in the opposite direction.
    C: Release the brakes to get traction back.
    D: Accelerate to pull the trailer straight.
  answer: C
  explanation: To recover from a trailer skid, you should release the brakes to get
    traction back. Do not use the trailer hand brake, as the brakes on the trailer
    wheels caused the skid in the first place.
- id: 276
  category: defensive_driving
  question: What is the earliest and best way to recognize that your trailer has started
    to skid?
  choices:
    A: Feeling a pull on the steering wheel
    B: Hearing the tires squeal
    C: Seeing it in your mirrors
    D: Feeling the vehicle slow down abruptly
  answer: C
  explanation: The earliest and best way to recognize that the trailer has started
    to skid is by seeing it in your mirrors. Any time the brakes are applied hard,
    check the mirrors.
- id: 277
  category: driver_responsibility
  question: What is the minimum liability insurance coverage required for bodily injury
    or death of one person in any one crash in Nevada?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The state of Nevada requires minimum coverage of $25,000 for bodily
    injury or death of one person in any one crash.
- id: 278
  category: penalties_and_points
  question: Which of the following is a potential penalty for a lapse of vehicle insurance
    coverage in Nevada?
  choices:
    A: A mandatory 6-month jail sentence
    B: Confiscation of the vehicle
    C: A reinstatement fee and fines starting at $250
    D: Permanent revocation of your driver's license
  answer: C
  explanation: If a registration is suspended for a lapse of insurance, the driver
    will be required to pay a reinstatement fee and applicable fines starting at $250
    and totaling up to $1,750.
- id: 279
  category: driver_responsibility
  question: If you are in a crash that is NOT investigated by law enforcement, under
    what circumstances must you submit a Report of Crash Form (SR-1)?
  choices:
    A: Only if the crash involves a commercial vehicle
    B: If the crash causes $750 or more in damages or anyone is injured
    C: If the crash causes $1,000 or more in damages
    D: Only if the other driver does not have insurance
  answer: B
  explanation: If you are in a crash that is not investigated by law enforcement and
    the crash causes $750 or more in damages or anyone is injured, you must complete
    and send a Report of Crash Form (SR-1).
- id: 280
  category: driver_responsibility
  question: How many days do you have to submit a Report of Crash Form (SR-1) to the
    DMV if it is required?
  choices:
    A: 3 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: You must complete and send a Report of Crash Form (SR-1) within 10
    days to the Nevada Department of Motor Vehicles.
- id: 281
  category: safe_driving_rules
  question: What should you do if you are involved in a crash with only property damage
    (no injuries) and your vehicle can be moved safely?
  choices:
    A: Leave the vehicles exactly where they are until police arrive.
    B: Move to a location that does not obstruct traffic and return to the scene.
    C: Drive home and report the crash online.
    D: Wait in the middle of the road with your hazard lights on.
  answer: B
  explanation: If there is only damage to a vehicle or other property (no injuries)
    and the vehicle can be moved safely, move to a location that does not obstruct
    traffic and return to the scene.
- id: 282
  category: driver_responsibility
  question: What must you do if you crash into an unattended vehicle?
  choices:
    A: Leave the scene immediately if there is no visible damage.
    B: Wait by the vehicle for up to one hour.
    C: Give the owner your information either in person or by leaving a note.
    D: Call a tow truck to remove the unattended vehicle.
  answer: C
  explanation: If the crash involves an unattended vehicle or other property, you
    must give the owner your name, address, driver license number, registration and
    insurance information, either in person or by leaving a note.
- id: 283
  category: penalties_and_points
  question: How does the Nevada DMV handle traffic violations that occur in other
    states?
  choices:
    A: They are ignored as long as you pay the fine in the other state.
    B: They are added to your Nevada driving record.
    C: They only affect your record if they involve a DUI.
    D: They are placed on a separate out-of-state driving record.
  answer: B
  explanation: Information about traffic crashes and convictions becomes part of your
    driving record. Even traffic violations that occur in other states are added to
    your Nevada driving record.
- id: 284
  category: alcohol_drugs_health
  question: How long do convictions related to DUI (Driving Under the Influence) stay
    on your Nevada driving record?
  choices:
    A: 3 years
    B: 5 years
    C: 7 years
    D: 10 years
  answer: C
  explanation: Most violations are reportable to your insurance company for three
    years. Convictions related to DUI (Driving Under the Influence) stay on your record
    for seven years.
- id: 285
  category: penalties_and_points
  question: Under the Nevada demerit point system, your license will be suspended
    if you receive how many points in any 12-month period?
  choices:
    A: 6 or more points
    B: 8 or more points
    C: 10 or more points
    D: 12 or more points
  answer: D
  explanation: If you receive 12 or more points in any 12-month period, your license
    will be suspended.
- id: 286
  category: penalties_and_points
  question: If you have accumulated between three and 11 demerit points, how can you
    have three points removed from your record?
  choices:
    A: By paying a $150 fine to the DMV
    B: By completing a traffic safety course at a DMV-approved school
    C: By driving violation-free for 6 months
    D: By retaking the written driving test
  answer: B
  explanation: If you have accumulated between three and 11 points, you may have three
    points removed by completing a traffic safety course at a school approved by the
    DMV.
- id: 287
  category: penalties_and_points
  question: How many demerit points accumulated in a 12-month period will result in
    a driver's license suspension in Nevada?
  choices:
    A: 8 or more
    B: 10 or more
    C: 12 or more
    D: 15 or more
  answer: C
  explanation: According to the manual, if you receive 12 or more points in any 12-month
    period, your license will be suspended.
- id: 288
  category: penalties_and_points
  question: How many demerit points are assigned to your driving record for reckless
    driving?
  choices:
    A: '4'
    B: '6'
    C: '8'
    D: '10'
  answer: C
  explanation: The manual states that reckless driving is assigned 8 demerit points
    on your driving record.
- id: 289
  category: penalties_and_points
  question: What happens to your demerit points if you are convicted of a major traffic
    offense, such as a DUI?
  choices:
    A: You receive 12 points.
    B: You receive 8 points.
    C: You receive 6 points.
    D: No demerit points are assigned, but your license is revoked.
  answer: D
  explanation: A conviction of a major traffic offense, such as DUI or causing substantial
    bodily harm, will result in your license being revoked. These offenses are not
    assigned demerit points.
- id: 290
  category: alcohol_drugs_health
  question: 'Under Nevada law, it is unlawful to drive with an amount of marijuana
    in your blood greater than:'
  choices:
    A: 2 nanograms per milliliter
    B: 5 nanograms per milliliter
    C: 8 nanograms per milliliter
    D: 10 nanograms per milliliter
  answer: A
  explanation: It is unlawful for any person to drive with an amount of marijuana
    in their system greater than two nanograms per milliliter of blood.
- id: 291
  category: alcohol_drugs_health
  question: Under Nevada's Implied Consent Law, what is the penalty for failing to
    submit to a blood, breath, or urine test on your first offense?
  choices:
    A: License revoked for 90 days
    B: License revoked for 185 days
    C: License revoked for 1 year
    D: License revoked for 3 years
  answer: C
  explanation: If you fail to submit to these tests, your license will be revoked
    and you will not be eligible for a license for a period of one year for a first
    offense.
- id: 292
  category: alcohol_drugs_health
  question: Under the Illegal Per Se Law, what administrative action is taken if a
    driver under 21 years of age has an alcohol concentration of .02%?
  choices:
    A: Driver license is suspended for 90 days
    B: Driver license is revoked for 185 days
    C: Driver license is revoked for 1 year
    D: Driver license is revoked for 3 years
  answer: B
  explanation: For a .02% alcohol concentration for drivers under 21 years of age,
    the administrative penalty is that the driver license is revoked for 185 days.
- id: 293
  category: penalties_and_points
  question: What is the minimum jail sentence or residential confinement for a second
    DUI offense within 7 years?
  choices:
    A: 2 days
    B: 10 days
    C: 30 days
    D: 6 months
  answer: B
  explanation: For a second DUI offense within 7 years, the criminal action includes
    a jail sentence or residential confinement of 10 days to 6 months.
- id: 294
  category: penalties_and_points
  question: What is the prison sentence for a DUI causing death or serious injury?
  choices:
    A: 1 to 6 years
    B: 2 to 10 years
    C: 2 to 20 years
    D: 5 to 25 years
  answer: C
  explanation: For a DUI causing death or serious injury, the criminal action includes
    a prison sentence of 2 to 20 years.
- id: 295
  category: alcohol_drugs_health
  question: If you hold a Commercial Driver License (CDL), what alcohol concentration
    will trigger an Illegal Per Se administrative revocation?
  choices:
    A: .02% or more
    B: .04% or more but less than .08%
    C: .06% or more
    D: .10% or more
  answer: B
  explanation: An Administrative Illegal Per Se Action applies for an alcohol concentration
    of .04% or more but less than .08% if you hold a commercial driver license.
- id: 296
  category: alcohol_drugs_health
  question: How can DUI offenders immediately reinstate their driving privileges?
  choices:
    A: By paying a $1,000 fine
    B: By completing 200 hours of community service
    C: By installing an ignition interlock device at their own expense
    D: By attending a 3-month treatment program
  answer: C
  explanation: The driving privileges of DUI offenders can be immediately reinstated
    if a driver license with an ignition interlock restriction is issued and an ignition
    interlock device is installed in any vehicle the motorist operates at his or her
    own expense.
- id: 297
  category: driver_responsibility
  question: Which of the following actions regarding your Nevada driver's license
    is illegal?
  choices:
    A: Signing up for a free online DMV account
    B: Lending your license to someone else
    C: Checking your license expiration date online
    D: Printing your driver history
  answer: B
  explanation: It is illegal to alter your license in any way, lend it to someone
    else or use another person’s license.
- id: 298
  category: penalties_and_points
  question: How many demerit points are assigned for following too closely?
  choices:
    A: '2'
    B: '4'
    C: '6'
    D: '8'
  answer: B
  explanation: According to the partial list of traffic violations, following too
    closely is assigned 4 demerit points.
- id: 299
  category: alcohol_drugs_health
  question: What is required by the court for a driver under the age of 18 who is
    found to have been driving under the influence?
  choices:
    A: A minimum 1-year prison sentence
    B: Lifetime disqualification from driving
    C: Evaluation for alcohol or drug abuse
    D: A $2,000 fine
  answer: C
  explanation: A driver under the age of 18 who is found by juvenile court to have
    been driving under the influence will be required by the court to undergo evaluation
    for alcohol or drug abuse.
- id: 300
  category: penalties_and_points
  question: What is the fine range for a first DUI offense?
  choices:
    A: $100 to $300
    B: $400 to $1,000
    C: $750 to $1,000
    D: $2,000 to $5,000
  answer: B
  explanation: For a first DUI offense, the criminal action includes a fine of $400
    to $1,000.
- id: 301
  category: alcohol_drugs_health
  question: What is a court requirement for a driver under the age of 21 who is convicted
    of a DUI?
  choices:
    A: Permanent loss of driving privileges
    B: Undergo evaluation for alcohol or drug abuse
    C: A minimum of 30 days in jail
    D: Surrender of the vehicle's title
  answer: B
  explanation: A driver under the age of 21 who is convicted of a DUI will be required
    by the court to undergo evaluation for alcohol or drug abuse.
- id: 302
  category: alcohol_drugs_health
  question: Nevada's open container law does NOT apply to which of the following areas?
  choices:
    A: The passenger area of a standard pickup truck
    B: The back seat of a standard passenger car
    C: The living quarters of a motor home or house trailer
    D: The trunk of any vehicle
  answer: C
  explanation: Nevada's open container law does not apply to the living quarters of
    motor homes or house trailers, or to the passenger areas of commercial buses,
    limousines or taxis.
- id: 303
  category: penalties_and_points
  question: If you are found guilty of a DUI offense, what will the court consider
    as an aggravating factor in determining your sentence?
  choices:
    A: Having passengers under the age of 15 in the vehicle
    B: Driving a vehicle manufactured before 1968
    C: Having an out-of-state driver's license
    D: Driving during daylight hours
  answer: A
  explanation: If you are found guilty of a DUI offense and you had passengers under
    the age of 15 in the vehicle you were driving, the court will consider that as
    an aggravating factor in determining your sentence.
- id: 304
  category: penalties_and_points
  question: If you plead or are found guilty of a DUI and a chemical test was conducted,
    what additional fine will the court impose?
  choices:
    A: $25
    B: $60
    C: $100
    D: $250
  answer: B
  explanation: If you plead guilty or are found guilty of DUI and a chemical test
    was conducted, the court will impose an additional $60 fine to cover the costs
    of the chemical analysis.
- id: 305
  category: defensive_driving
  question: Which of the following driving behaviors is a clue that a driver may be
    under the influence of alcohol or drugs?
  choices:
    A: Driving with the flow of traffic
    B: Using turn signals before changing lanes
    C: Driving at night with headlights off
    D: Stopping at a red light
  answer: C
  explanation: Driving at night with headlights off is listed in the manual as one
    of the clues to driving under the influence of alcohol or drugs.
- id: 306
  category: safe_driving_rules
  question: How can you report a suspected drunk driver or highway emergency on a
    cellular phone anywhere in Nevada?
  choices:
    A: Dial *DUI (*384)
    B: Dial *NHP (*647)
    C: Dial *SOS (*767)
    D: Dial *911 (*911)
  answer: B
  explanation: You can report a suspected drunk driver or any highway emergency on
    a cellular phone anywhere in Nevada by dialing *NHP (*647).
- id: 307
  category: penalties_and_points
  question: A driver's license will be suspended if they accumulate how many demerit
    points in a 12-month period?
  choices:
    A: 6 or more
    B: 8 or more
    C: 10 or more
    D: 12 or more
  answer: D
  explanation: A point suspension occurs when a driver accumulates 12 or more demerit
    points against their license in a 12-month period.
- id: 308
  category: penalties_and_points
  question: Your driver's license and vehicle registration will be suspended if you
    do not have liability insurance and are involved in a crash with more than what
    amount in damage?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: B
  explanation: If a crash occurs with more than $750 in damage (personal injury or
    property damage) and you do not have liability insurance, your driver license
    and vehicle registration are suspended.
- id: 309
  category: penalties_and_points
  question: Which of the following non-driving offenses can result in a person losing
    their driving privileges in Nevada?
  choices:
    A: Truancy from school
    B: Being found guilty of a graffiti violation
    C: Violating a city noise ordinance
    D: Failing a high school class
  answer: B
  explanation: A person's license can be suspended or revoked if they are found guilty
    of a graffiti violation.
- id: 310
  category: vehicle_information
  question: How long do new residents have to register their vehicles after establishing
    residency in Nevada?
  choices:
    A: 10 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Drivers must register their vehicles within 30 days of establishing
    residency in Nevada or at the time they obtain a driver license, whichever occurs
    earlier.
- id: 311
  category: vehicle_information
  question: Which of the following statements is true regarding vehicle liability
    insurance for new Nevada residents?
  choices:
    A: Out-of-state insurance is accepted for the first 90 days.
    B: Out-of-state insurance is not accepted.
    C: Insurance is optional if the vehicle is paid off.
    D: You can use out-of-state insurance if your provider is nationally recognized.
  answer: B
  explanation: Out-of-state insurance is not accepted. You must either notify your
    insurance carrier that you have moved or purchase a new policy in Nevada.
- id: 312
  category: vehicle_information
  question: What must you do on the same day if you cancel your Nevada vehicle insurance
    and do not obtain new insurance?
  choices:
    A: Park the vehicle in a private garage
    B: Notify the local police department
    C: Cancel your Nevada vehicle registration and surrender your license plates
    D: Apply for a non-operational permit
  answer: C
  explanation: If a driver cancels their Nevada insurance and does not obtain new
    insurance, they must cancel their Nevada vehicle registration and surrender their
    license plates on the same day.
- id: 313
  category: vehicle_information
  question: Which of the following vehicles is exempt from the Emission Control Vehicle
    Inspection Report (Smog Check) in Clark and Washoe counties?
  choices:
    A: A gasoline-powered vehicle from model year 2010
    B: A diesel-powered vehicle from model year 2005
    C: A hybrid-electric vehicle that is up to five model years old
    D: A gasoline-powered vehicle from model year 1995
  answer: C
  explanation: Hybrid-electric vehicles that are up to five model years old are exempt
    from the smog check requirement.
- id: 314
  category: license_system
  question: What happens to a driver's license following a suspension or revocation
    period?
  choices:
    A: It is automatically reinstated and mailed to the driver.
    B: The driver must reapply at a DMV office and pay reinstatement fees.
    C: The driver must retake the driving skills test only.
    D: The driver's insurance company will reinstate it automatically.
  answer: B
  explanation: Licenses are not automatically reinstated following suspension or revocation.
    Drivers must reapply at a DMV office, present required documents, meet requirements,
    and pay reinstatement fees.
- id: 315
  category: license_system
  question: What slogan does the Nevada DMV use to encourage customers to use their
    website instead of visiting an office?
  choices:
    A: Skip the wait, update your plate
    B: Get online, not in line
    C: Drive safe, save time
    D: Your DMV, anytime
  answer: B
  explanation: The manual encourages customers to save time with the slogan 'GET ONLINE,
    NOT IN LINE' by visiting dmv.nv.gov.
- id: 316
  category: license_system
  question: Approximately how many online services does the Nevada DMV offer?
  choices:
    A: Exactly ten
    B: More than a dozen
    C: More than two dozen
    D: Over fifty
  answer: C
  explanation: According to the manual, 'The Nevada DMV offers more than two dozen
    online services.'
- id: 317
  category: license_system
  question: Which of the following is explicitly listed as an online service offered
    by the Nevada DMV?
  choices:
    A: Address changes
    B: Vision tests
    C: Driving exams
    D: Vehicle inspections
  answer: A
  explanation: The manual states that online services include 'address changes, movement
    permits and personalized plate orders.'
- id: 318
  category: vehicle_information
  question: What type of permit can be obtained through the Nevada DMV's online services?
  choices:
    A: Concealed carry permits
    B: Movement permits
    C: Construction permits
    D: Commercial parking permits
  answer: B
  explanation: The manual lists 'movement permits' as one of the services available
    online.
- id: 319
  category: vehicle_information
  question: If you want to order personalized license plates, how does the Nevada
    DMV recommend you do it?
  choices:
    A: By calling the Highway Patrol
    B: Through their online services
    C: By visiting a local police station
    D: By mailing a paper form
  answer: B
  explanation: The manual includes 'personalized plate orders' among the online services
    offered at dmv.nv.gov.
- id: 320
  category: license_system
  question: In which of the following cities can you schedule an in-person appointment
    at a Nevada DMV office?
  choices:
    A: Elko
    B: Henderson
    C: Winnemucca
    D: Ely
  answer: B
  explanation: The manual states you can schedule an appointment at offices in 'Carson
    City, Henderson, Las Vegas and Reno.'
- id: 321
  category: license_system
  question: What notification service does the Nevada DMV provide for scheduled appointments?
  choices:
    A: Automated phone calls
    B: Text reminders
    C: Postal mail reminders
    D: Push notifications via a mobile app
  answer: B
  explanation: When you schedule an appointment, the manual notes, 'We’ll send you
    text reminders.'
- id: 322
  category: license_system
  question: What is a benefit of scheduling an appointment before visiting the DMV
    in person?
  choices:
    A: You receive a discount on your registration fees
    B: You do not have to take a vision test
    C: There is a separate check-in line once you arrive
    D: You are guaranteed to pass your driving test
  answer: C
  explanation: The manual states that if you schedule an appointment, 'there is a
    separate check-in line once you arrive.'
- id: 323
  category: vehicle_information
  question: What vehicle-related item can be printed on the spot at a DMV NOW Kiosk?
  choices:
    A: Vehicle titles
    B: License plate decals
    C: Smog check certificates
    D: Insurance cards
  answer: B
  explanation: According to the manual, 'Kiosks print license plate decals and driver
    histories on the spot.'
- id: 324
  category: license_system
  question: Besides license plate decals, what else can you print at a DMV NOW Kiosk?
  choices:
    A: Driver histories
    B: Birth certificates
    C: Voter registration cards
    D: Passport applications
  answer: A
  explanation: The manual explicitly states that kiosks print 'license plate decals
    and driver histories on the spot.'
- id: 325
  category: license_system
  question: Which payment method is explicitly mentioned as being accepted by many
    DMV NOW Kiosks?
  choices:
    A: Personal checks
    B: Cryptocurrency
    C: Cash
    D: Money orders
  answer: C
  explanation: The manual notes regarding DMV NOW Kiosks that 'Many accept cash.'
- id: 326
  category: license_system
  question: Where should you look online to find the location of a DMV NOW Kiosk?
  choices:
    A: dmv.nv.gov/locations
    B: dmv.nv.gov/kiosk
    C: nv.gov/dmv-kiosk
    D: dmv.nv.gov/appointments
  answer: B
  explanation: The manual directs users to 'See dmv.nv.gov/kiosk for locations.'
- id: 327
  category: safe_driving_rules
  question: Which of the following organizations is acknowledged for contributing
    to the Nevada driver's manual?
  choices:
    A: Motorcycle Safety Foundation
    B: National Pedestrian Society
    C: Nevada Trucking Association
    D: American Red Cross
  answer: A
  explanation: The 'Motorcycle Safety Foundation' is listed among the organizations
    and agencies acknowledged for their contributions and assistance.
- id: 328
  category: license_system
  question: Which of the following cities is listed as a location where you can schedule
    a DMV appointment?
  choices:
    A: Sparks
    B: Carson City
    C: Boulder City
    D: Mesquite
  answer: B
  explanation: The manual lists Carson City, Henderson, Las Vegas, and Reno as offices
    where you can schedule an appointment.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 329
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 330
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 331
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 332
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 333
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 334
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 335
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 336
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 337
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 338
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 339
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 340
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 341
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 342
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 343
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 344
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
