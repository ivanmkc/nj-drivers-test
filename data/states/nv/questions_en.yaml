metadata:
  source: Nevada Driver's Handbook (dmv.nv.gov)
  total_questions: 346
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_testing
  question: What material is the knowledge test for your Nevada driver's license based
    on?
  choices:
    A: The Nevada Revised Statutes only
    B: The information in the Nevada Driver's Handbook
    C: Federal driving guidelines
    D: The driver's education course textbook
  answer: B
  explanation: According to the handbook's introduction, the knowledge test for your
    Nevada license is based on the information in this manual.
- id: 2
  category: driver_responsibility
  question: If you need to find the exact wording of specific traffic laws, what should
    you refer to?
  choices:
    A: The Nevada Driver's Handbook
    B: The Nevada Revised Statutes (NRS)
    C: The Department of Transportation manual
    D: The local police department guidelines
  answer: B
  explanation: The handbook states that it does not give the exact wording of traffic
    laws. For specific laws, you must refer to the Nevada Revised Statutes (NRS).
- id: 3
  category: driver_responsibility
  question: Where can you find copies of the Nevada Revised Statutes (NRS)?
  choices:
    A: Only at the DMV office
    B: In public libraries and online
    C: Exclusively at the state capitol
    D: Only by purchasing them from the state printer
  answer: B
  explanation: The introduction specifies that NRS copies are available in public
    libraries and online at leg.state.nv.us/law1.html.
- id: 4
  category: sharing_the_road
  question: According to the key changes in the 2024 edition of the handbook, what
    new information was added regarding pedestrians?
  choices:
    A: Information on school zone crossing guards
    B: Information on blind pedestrians
    C: Information on jaywalking penalties
    D: Information on pedestrian right-of-way at roundabouts
  answer: B
  explanation: The 'Key Changes in This Edition' section notes that information on
    blind pedestrians was added to page 67.
- id: 5
  category: license_system
  question: What does the acronym 'DAC' stand for in the Nevada Driver's Handbook?
  choices:
    A: Driver Authorization Card
    B: Driving Assessment Course
    C: Department of Automobile Control
    D: Driver Awareness Certification
  answer: A
  explanation: The Table of Contents for Chapter 1 lists 'Driver Authorization Card
    (DAC)' as a section.
- id: 6
  category: license_system
  question: What does the acronym 'CDL' stand for in the licensing classifications?
  choices:
    A: Certified Driver License
    B: Commercial Driver License
    C: Class D License
    D: City Driver License
  answer: B
  explanation: The Table of Contents for Chapter 1 includes a section titled 'Commercial
    Driver License (CDL)'.
- id: 7
  category: license_system
  question: According to the handbook's key changes, what information was added to
    page 20?
  choices:
    A: Medical Indicators
    B: Organ Donors
    C: Veteran Designation
    D: Identification Cards
  answer: A
  explanation: The 'Key Changes in This Edition' section states that information on
    Medical Indicators was added to page 20.
- id: 8
  category: safe_driving_rules
  question: Which of the following topics is covered under 'Freeway Driving' in Chapter
    3?
  choices:
    A: Roundabouts
    B: High-Occupancy Vehicle Lanes
    C: Passing Bicyclists
    D: U-Turns
  answer: B
  explanation: The Table of Contents lists 'High-Occupancy Vehicle Lanes' as a sub-topic
    under 'Freeway Driving' in Chapter 3.
- id: 9
  category: safe_driving_rules
  question: In which chapter of the Nevada Driver's Handbook will you find information
    about 'Unattended Children and Pets'?
  choices:
    A: Chapter 1 - Getting Your Nevada Driver's License
    B: Chapter 2 - Buckle Up
    C: Chapter 3 - Driving Safely
    D: Chapter 4 - Special Driving Conditions
  answer: B
  explanation: The Table of Contents shows that 'Unattended Children and Pets' is
    located in Chapter 2 - Buckle Up.
- id: 10
  category: driver_responsibility
  question: What is the primary purpose of the Nevada Driver's Handbook?
  choices:
    A: To provide the exact legal wording of all traffic laws
    B: To serve as a comprehensive legal defense guide
    C: To provide information on the knowledge, skills, abilities, and attitudes needed
      to drive safely
    D: To replace the Nevada Revised Statutes
  answer: C
  explanation: 'The introduction states: ''As you read, you will find information
    on the knowledge, skills, abilities and attitudes you need to drive safely.'''
- id: 11
  category: sharing_the_road
  question: Which of the following is listed as a sub-topic under 'Passing Another
    Vehicle' in Chapter 3?
  choices:
    A: Passing Bicyclists
    B: Passing on the Shoulder
    C: Passing in a School Zone
    D: Passing Emergency Vehicles
  answer: A
  explanation: The Table of Contents for Chapter 3 lists 'Passing Bicyclists' and
    'Passing Parked Vehicles' immediately following 'Passing Another Vehicle'.
- id: 12
  category: license_system
  question: Where is the Nevada Department of Motor Vehicles headquarters located
    according to the handbook?
  choices:
    A: Las Vegas
    B: Reno
    C: Carson City
    D: Henderson
  answer: C
  explanation: The title page lists the Department of Motor Vehicles address as 555
    Wright Way, Carson City, Nevada 89711-0400.
- id: 13
  category: license_system
  question: Which of the following topics is included in Chapter 1, 'Getting Your
    Nevada Driver's License'?
  choices:
    A: Anti-Lock Braking Systems
    B: Human Trafficking – No Child for Sale
    C: Cell Phones and Texting
    D: Ramp Meters
  answer: B
  explanation: The Table of Contents lists 'Human Trafficking – No Child for Sale'
    under Chapter 1.
- id: 14
  category: driver_responsibility
  question: What does the handbook state about its coverage of traffic laws?
  choices:
    A: It gives the exact wording of all traffic laws
    B: It discusses every traffic law in Nevada
    C: It does not give the exact wording of traffic laws and does not discuss all
      of them
    D: It is the only legally binding document for traffic laws in Nevada
  answer: C
  explanation: 'The introduction explicitly states: ''However, this handbook does
    not give the exact wording of traffic laws and it does not discuss all of them.'''
- id: 15
  category: license_system
  question: How many days do drivers moving into Nevada from another state have to
    apply for a Nevada driver's license?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: According to the manual, drivers moving into Nevada from another state
    must apply for a license within 30 days after becoming a resident.
- id: 16
  category: license_system
  question: Which of the following individuals living or working in Nevada is NOT
    required to get a Nevada driver's license?
  choices:
    A: A part-time worker from another state
    B: A military member stationed in Nevada
    C: A college student who just established residency
    D: A new resident who moved from a foreign country
  answer: B
  explanation: The manual states that you need a Nevada driver license if you live
    or work in Nevada, excluding border state employees or military members stationed
    in Nevada.
- id: 17
  category: license_system
  question: What is the minimum age requirement to apply for a Nevada driver's license?
  choices:
    A: 15 years old
    B: 15 and a half years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: To get a Nevada license, you must complete an application form, visit
    a full-service DMV office, and be at least 16 years old.
- id: 18
  category: license_system
  question: For which of the following documents is a Social Security Number NOT necessary
    to obtain in Nevada?
  choices:
    A: A commercial driver's license
    B: A Driver Authorization Card (DAC)
    C: A standard driver's license
    D: A motorcycle license
  answer: B
  explanation: The manual explicitly states that a Social Security Number is not necessary
    to obtain a Driver Authorization Card (DAC).
- id: 19
  category: license_system
  question: How long is a first-time Nevada driver's license valid for persons under
    the age of 65?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: A first-time Nevada driver license issued to persons under age 65 will
    be valid for eight years.
- id: 20
  category: license_system
  question: What is the validity period of a driver's license for individuals aged
    65 and older in Nevada?
  choices:
    A: 2 years
    B: 4 years
    C: 6 years
    D: 8 years
  answer: B
  explanation: According to the manual, driver licenses for individuals aged 65 and
    older are valid for four years.
- id: 21
  category: license_system
  question: How long are Nevada Identification Cards valid for?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: The manual states that Identification Cards are valid for eight years.
- id: 22
  category: license_system
  question: If you present limited-term immigration documents with no departure date
    provided by the Department of Homeland Security (DHS), when will your Nevada driver's
    license expire?
  choices:
    A: In 1 year
    B: In 4 years
    C: In 8 years
    D: On your next birthday
  answer: A
  explanation: If limited-term immigration documents are used, the expiration of your
    driver license will coincide with the departure date verified by DHS, or one year
    if no date is provided by DHS.
- id: 23
  category: driver_responsibility
  question: What responsibility does a co-signer take on when signing the application
    for a driver under 18 years old?
  choices:
    A: They must ride in the passenger seat at all times.
    B: They share liability for any damages caused by the minor's negligence or willful
      misconduct while driving.
    C: They must pay for the minor's vehicle registration.
    D: They are required to take a written test alongside the minor.
  answer: B
  explanation: If you are under 18 years old, a co-signer must sign your application.
    The co-signer shares liability for any damages caused by the minor's negligence
    or willful misconduct while driving.
- id: 24
  category: license_system
  question: How many driver's licenses or identification cards may a resident of Nevada
    hold at one time?
  choices:
    A: One driver's license and one ID card
    B: Only one driver's license or identification card
    C: Up to two driver's licenses from different states
    D: One commercial license and one standard license
  answer: B
  explanation: A resident of Nevada may hold only one driver's license or identification
    card.
- id: 25
  category: license_system
  question: What happens to your out-of-state driver's license when you apply for
    a Nevada license?
  choices:
    A: It is destroyed by the DMV.
    B: It is sent back to your previous state.
    C: You are allowed to keep it as a valid secondary ID.
    D: It must be surrendered, voided, and then returned to you.
  answer: D
  explanation: If you have a license or identification card from another jurisdiction,
    you must surrender it. All surrendered licenses and identification cards will
    be voided and returned to you.
- id: 26
  category: driver_testing
  question: Which test is mandatory for all new residents applying for a Nevada driver's
    license, even if other tests are waived?
  choices:
    A: A written knowledge test
    B: A driving skills test
    C: A vision test
    D: A hearing test
  answer: C
  explanation: Your vision will be tested when you apply for your Nevada driver's
    license. All other tests may be waived if certain criteria apply.
- id: 27
  category: driver_testing
  question: For a new Nevada resident, written and driving tests may be waived if
    they have had fewer than how many moving violations in the past 4 years?
  choices:
    A: '1'
    B: '2'
    C: '3'
    D: '4'
  answer: C
  explanation: All other tests may be waived if you have had fewer than 3 moving violations
    in the past 4 years.
- id: 28
  category: license_system
  question: On what day does a standard first-time Nevada driver's license typically
    expire?
  choices:
    A: On the anniversary of the issue date
    B: On December 31st of the expiration year
    C: On your birthday
    D: Exactly 8 years from the date you applied
  answer: C
  explanation: A first-time Nevada driver license issued to persons under age 65 will
    be valid for eight years and expires on your birthday.
- id: 29
  category: license_system
  question: Which of the following is NOT explicitly listed as a requirement to provide
    proof of when applying for a Nevada driver's license?
  choices:
    A: Full legal name
    B: Nevada residency
    C: Age
    D: High school diploma or equivalent
  answer: D
  explanation: To get a Nevada license, you must provide proof of your full legal
    name, age, Social Security Number (if issued), and Nevada residency. A high school
    diploma is not required.
- id: 30
  category: driver_testing
  question: Under what condition may the driving tests (other than the vision test)
    be waived when applying for a Nevada driver's license?
  choices:
    A: You have had no DUI convictions within the past 7 years.
    B: You are at least 18 years old.
    C: You have had fewer than 5 moving violations in the past 4 years.
    D: You surrender a foreign passport.
  answer: A
  explanation: Tests may be waived if you meet several criteria, including having
    no DUI convictions within the past 7 years, being age 21 or older, and having
    fewer than 3 moving violations in the past 4 years.
- id: 31
  category: license_system
  question: Who is NOT required to obtain a Nevada driver's license to drive in the
    state?
  choices:
    A: A new resident who just moved to Nevada permanently.
    B: An active-duty member of the U.S. Armed Forces with a valid home state license.
    C: A person whose out-of-state license is currently suspended.
    D: A 15-year-old out-of-state tourist.
  answer: B
  explanation: You do not need a Nevada license if you are an active-duty member of
    the U.S. Armed Forces and you have a valid license from your home state.
- id: 32
  category: license_system
  question: If your driving privilege is currently suspended or revoked in another
    state, what can you qualify for in Nevada?
  choices:
    A: A restricted Nevada driver's license
    B: A temporary driving permit
    C: An identification card
    D: A Driver Authorization Card
  answer: C
  explanation: If your driving privilege is suspended or revoked in another state,
    you will not be allowed a Nevada license until the issue is resolved, but you
    may qualify for an identification card during this period.
- id: 33
  category: license_system
  question: Which of the following is an acceptable document to prove your Social
    Security Number?
  choices:
    A: A handwritten paystub
    B: A W-2 form with your full SSN
    C: A hospital-issued birth certificate
    D: A Medicare card
  answer: B
  explanation: Acceptable evidence of a Social Security Number includes a Social Security
    Card, a W-2 (with full SSN), IRS Form 1099, or a printed paystub with full legal
    name. Handwritten paystubs are not acceptable.
- id: 34
  category: license_system
  question: How is a Real ID compliant Nevada driver's license or ID card marked?
  choices:
    A: With a silver hologram of the state seal
    B: With a gold Nevada outline and a star cutout
    C: With the phrase 'FEDERAL ID APPROVED'
    D: With a red border around the photograph
  answer: B
  explanation: Real ID licenses or ID cards are marked with a gold Nevada outline
    and a star cutout, indicating the card meets federal identification standards.
- id: 35
  category: license_system
  question: What phrase is marked on a standard Nevada driver's license or ID card
    that does not meet federal identification standards?
  choices:
    A: NOT FOR REAL ID PURPOSES
    B: STATE USE ONLY
    C: LIMITED TERM
    D: UNVERIFIED IDENTITY
  answer: A
  explanation: Standard licenses or ID cards are marked with the phrase 'NOT FOR REAL
    ID PURPOSES' indicating the card does not meet federal identification standards.
- id: 36
  category: license_system
  question: How many documents proving Nevada residency must applicants present to
    meet Real ID requirements?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: To meet the new Real ID requirements, applicants must present two documents
    proving Nevada residency, such as utility bills or bank statements.
- id: 37
  category: license_system
  question: How long is a Nevada Driver Authorization Card (DAC) valid for?
  choices:
    A: Two years
    B: Four years
    C: Six years
    D: Eight years
  answer: B
  explanation: A Driver Authorization Card is valid for four years and will expire
    on your birthday.
- id: 38
  category: license_system
  question: How must all renewals and address changes for a Driver Authorization Card
    (DAC) be completed?
  choices:
    A: Online through the DMV website
    B: By mailing a form to the DMV
    C: Over the phone
    D: In person
  answer: D
  explanation: For a Driver Authorization Card, all renewals and address changes must
    be completed in person.
- id: 39
  category: license_system
  question: Which of the following is true regarding a Driver Authorization Card (DAC)?
  choices:
    A: It is valid for boarding commercial aircraft.
    B: It can be used to determine eligibility for state benefits.
    C: It is not valid for federal or state identification purposes.
    D: It is marked with a gold Nevada outline and a star cutout.
  answer: C
  explanation: A Driver Authorization Card is not valid for federal or state identification
    purposes and cannot be used to determine eligibility for any benefits, licenses
    or services issued or provided by the State of Nevada.
- id: 40
  category: license_system
  question: What is required if you present a document in a foreign language to the
    Nevada DMV?
  choices:
    A: It must be accompanied by an abstract translation.
    B: It must be translated to English by a DMV-approved translator.
    C: It must be notarized by a foreign consulate.
    D: It must be translated by the applicant.
  answer: B
  explanation: Any document in a foreign language must be properly translated to English
    by a DMV-approved translator before it can be accepted. Abstract translations
    will not be accepted.
- id: 41
  category: license_system
  question: If your name is different from what is on your proof of identity document,
    what must you present?
  choices:
    A: A handwritten letter explaining the name change
    B: A notarized affidavit from a family member
    C: Legal documentation such as a marriage certificate or court order
    D: A utility bill showing your new name
  answer: C
  explanation: If your name is different, you will be asked to present legal documentation
    reflecting your name change, such as a marriage certificate, divorce decree, spouse's
    death certificate, adoption record or court order.
- id: 42
  category: license_system
  question: How many documents must an applicant present to prove their Nevada residency
    status?
  choices:
    A: One original document
    B: Two original or certified copies
    C: Three original or certified copies
    D: Four documents of any kind
  answer: B
  explanation: Every applicant must present an original or certified copy of any two
    approved documents which reflect a residential address in Nevada to prove residency.
- id: 43
  category: driver_testing
  question: What is the fee for an initial knowledge or skills test in Nevada?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $25.00
  answer: D
  explanation: A $25.00 fee is charged for all initial knowledge and/or skills tests
    administered.
- id: 44
  category: driver_testing
  question: What will result in an automatic failure during your driving skills test?
  choices:
    A: Using the windshield wipers
    B: Using a cellular phone
    C: Asking the examiner a question
    D: Stopping on a grade
  answer: B
  explanation: The manual states that the use of a cellular phone during a drive test
    will result in automatic failure.
- id: 45
  category: driver_testing
  question: Who is allowed to ride in the vehicle with you during your road test?
  choices:
    A: A parent or legal guardian
    B: A licensed driving instructor
    C: A language translator
    D: No passengers or animals are allowed
  answer: D
  explanation: Passengers and animals are not allowed in the vehicle during the road
    test.
- id: 46
  category: driver_testing
  question: Which of the following vehicle features are you NOT allowed to use during
    your driving test?
  choices:
    A: Turn signals
    B: Windshield wipers
    C: Parking assist and cruise control
    D: Brakes and headlights
  answer: C
  explanation: When taking your driving test, you will not be allowed to use certain
    safety features such as parking assist, cruise control, etc.
- id: 47
  category: penalties_and_points
  question: 'If you are under 18, your license may be revoked for 185 days if a test
    indicates your blood alcohol concentration (BAC) is:'
  choices:
    A: At least 0.01% but less than 0.05%
    B: At least 0.02% but less than 0.08%
    C: At least 0.04% but less than 0.10%
    D: At least 0.08% but less than 0.15%
  answer: B
  explanation: A young driver's license may be revoked for 185 days if a blood, breath
    or urine test indicates at least 0.02% but less than 0.08% by weight of alcohol
    in the blood.
- id: 48
  category: penalties_and_points
  question: What is the penalty for a young driver's first offense of habitual truancy?
  choices:
    A: License suspended for at least 30 days but not more than 6 months
    B: License suspended for exactly 1 year
    C: License revoked for 185 days
    D: License suspended for up to 2 years
  answer: A
  explanation: For a first offense of habitual truancy, a young driver's license will
    be suspended for at least 30 days but not more than 6 months or have issuance
    delayed for 30 days.
- id: 49
  category: penalties_and_points
  question: 'If a driver under 18 is found guilty of handling or possessing a firearm
    in violation of NRS 202.300 for the first time, their license will be:'
  choices:
    A: Suspended for 30 days
    B: Revoked for 185 days
    C: Suspended or issuance delayed for up to one year
    D: Suspended or issuance delayed for two years
  answer: C
  explanation: For a first offense of handling or possessing a firearm in violation
    of NRS 202.300, your license will be suspended or issuance delayed for up to one
    year.
- id: 50
  category: driver_testing
  question: What color ink must be used to complete the Beginning Driver Experience
    Log?
  choices:
    A: Red or black ink
    B: Blue or black ink
    C: Pencil only
    D: Any color ink
  answer: B
  explanation: The Beginning Driver Experience Log must be completed in blue or black
    ink before arriving for your drive test.
- id: 51
  category: license_system
  question: How recent must the signature and date be on the DMV-301 Certification
    of Attendance form when submitted?
  choices:
    A: Within the previous 14 days
    B: Within the previous 30 days
    C: Within the previous 60 days
    D: Within the previous 90 days
  answer: C
  explanation: The DMV-301 form must be signed and dated within the previous 60 days
    from which the form is being submitted.
- id: 52
  category: driver_testing
  question: If you are not within 30 miles of a DMV-approved school and cannot access
    the internet, how many hours of behind-the-wheel experience must you complete?
  choices:
    A: 40 hours
    B: 50 hours
    C: 80 hours
    D: 100 hours
  answer: D
  explanation: If you are not within 30 miles of a DMV-approved school and it is not
    possible to access the internet, you need to complete 100 hours of behind-the-wheel
    driving experience.
- id: 53
  category: driver_testing
  question: If you are applying for a motorcycle license and must complete the 100
    hours of driving experience, what is the rule regarding driving in the dark?
  choices:
    A: 10 hours must be completed in the dark.
    B: 20 hours must be completed in the dark.
    C: Half of the hours must be completed in the dark.
    D: All 100 hours must be completed during daylight hours only.
  answer: D
  explanation: If you are applying for a motorcycle license, all 100 hours of driving
    experience must be completed during daylight hours only.
- id: 54
  category: penalties_and_points
  question: What is the penalty for a driver under 18 who is found guilty of participating
    in an unauthorized speed contest?
  choices:
    A: License suspended for 30 days
    B: License suspended for 90 days
    C: License suspended for not less than six months but not more than two years
    D: License revoked permanently
  answer: C
  explanation: Your license may be suspended for a period of not less than six months
    but not more than two years if found guilty of participating in, or organizing,
    an unauthorized speed contest.
- id: 55
  category: driver_testing
  question: How much is the fee for any knowledge or skills retests needed before
    you can get your license?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $25.00
  answer: B
  explanation: A $10 fee is charged for any retests needed before you can get your
    license.
- id: 56
  category: safe_driving_rules
  question: Between what hours is a minor prohibited from operating a motor vehicle,
    unless driving to or from a scheduled event?
  choices:
    A: 9 p.m. and 6 a.m.
    B: 10 p.m. and 5 a.m.
    C: 11 p.m. and 5 a.m.
    D: Midnight and 6 a.m.
  answer: B
  explanation: The manual states that a minor shall not operate a motor vehicle between
    the hours of 10 p.m. and 5 a.m. unless driving to or from a scheduled event.
- id: 57
  category: license_system
  question: 'For the first 6 months after receiving their driver''s license, 16 and
    17-year-old drivers are not allowed to carry passengers under the age of 18 EXCEPT
    for:'
  choices:
    A: School classmates
    B: Immediate family members
    C: Co-workers
    D: Passengers with a valid driver's license
  answer: B
  explanation: Applicants who are 16 or 17 years old will not be allowed to carry
    passengers under the age of 18 (except for immediate family members) for the first
    6 months they drive.
- id: 58
  category: license_system
  question: 'When driving with a Class C Instruction Permit, you must be accompanied
    by a licensed driver who is seated beside you, has at least one year of licensed
    driving experience, and is at least:'
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 19 years old
  answer: B
  explanation: When driving with a Class C Instruction Permit, you must be accompanied
    by a licensed driver who is 21 years of age or older, has at least one year of
    licensed driving experience, and is seated beside you.
- id: 59
  category: driver_testing
  question: Which of the following is a requirement for the supervising driver when
    you are driving with a Class M (Motorcycle) Instruction Permit?
  choices:
    A: They must follow closely behind you in a car or truck.
    B: They must be riding as a passenger on your motorcycle.
    C: They must be in direct visual supervision while riding on a motorcycle.
    D: They must be at least 18 years old with six months of driving experience.
  answer: C
  explanation: You must be in direct visual supervision of a licensed motorcycle driver
    on a motorcycle who is 21 years of age or older. The supervising driver is not
    allowed to be in a car or truck.
- id: 60
  category: license_system
  question: Which driver's license classification allows you to drive a single vehicle
    with a Gross Vehicle Weight Rating (GVWR) over 26,000 pounds and tow a vehicle
    under 10,000 pounds?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class M
  answer: B
  explanation: A Class B license allows you to drive a single vehicle with a Gross
    Vehicle Weight Rating (GVWR) over 26,000 pounds and may tow a vehicle under 10,000
    pounds.
- id: 61
  category: license_system
  question: What does Restriction G on a Nevada driver's license indicate?
  choices:
    A: Driver needs to wear glasses or contact lenses
    B: Yearly vision examination required
    C: Daylight driving only
    D: Additional rearview mirrors required
  answer: C
  explanation: According to the restrictions list in the manual, Restriction G means
    'Daylight driving only'.
- id: 62
  category: license_system
  question: If you are 18 years of age or older, how long is a motorcycle instruction
    permit valid for?
  choices:
    A: Six months
    B: One year
    C: Two years
    D: Five years
  answer: A
  explanation: Motorcycle instruction permits issued to persons 18 years of age or
    older are valid for six months and may be renewed only once every five years.
- id: 63
  category: driver_testing
  question: What is the penalty for failing the motorcycle skills test administered
    by the DMV two or more times?
  choices:
    A: A mandatory 30-day waiting period before retaking the test
    B: Permanent denial of future motorcycle instruction permits
    C: Revocation of your Class C driver's license
    D: Required completion of an approved motorcycle safety course
  answer: B
  explanation: Failing the motorcycle skills test administered by the DMV two or more
    times will result in a permanent denial of future motorcycle instruction permits
    per NRS 483.280.
- id: 64
  category: driver_responsibility
  question: Prior to receiving a driver's license, minors must remain free of any
    at-fault crashes, moving violation convictions, and alcohol or drug convictions
    for how many months?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Minors must remain free of any at-fault crashes, moving violation convictions
    and any type of alcohol or drug conviction for six months prior to receiving a
    driver's license.
- id: 65
  category: license_system
  question: The Endorsement F provides a Commercial License exemption for which of
    the following groups?
  choices:
    A: Taxi and ride-share drivers
    B: Delivery drivers operating within 50 miles
    C: Firefighters while operating fire equipment
    D: Drivers transporting placarded amounts of hazardous materials
  answer: C
  explanation: Endorsement F is a Commercial License exemption for firefighters while
    operating fire equipment, farmers under specific conditions, and military driving
    military vehicles on active duty.
- id: 66
  category: vehicle_information
  question: When driving a Class C vehicle, the combination of the towing vehicle
    and the towed vehicle(s) may not exceed what maximum length?
  choices:
    A: 50 feet
    B: 60 feet
    C: 70 feet
    D: 80 feet
  answer: C
  explanation: Under the Class C and Endorsement J sections, the manual states that
    the combination of vehicles may not exceed 70 feet in length.
- id: 67
  category: safe_driving_rules
  question: Which of the following is a restriction when driving with a motorcycle
    instruction permit?
  choices:
    A: You may only drive on limited-access highways.
    B: You may carry a maximum of one passenger.
    C: You may drive during daylight hours only.
    D: You must ride within 30 miles of your home.
  answer: C
  explanation: When driving with a motorcycle instruction permit, you may drive during
    daylight hours only. You may not carry passengers or drive on freeways or other
    high-speed roadways.
- id: 68
  category: license_system
  question: A commercial motor vehicle requires a Commercial Driver License (CDL)
    if it is designed to carry how many passengers, including the driver?
  choices:
    A: 8 or more
    B: 10 or more
    C: 12 or more
    D: 16 or more
  answer: D
  explanation: A commercial motor vehicle is defined as one that has a GVWR/GCWR of
    26,001 pounds or more, is designed to carry 16 or more passengers including the
    driver, or is carrying hazardous materials.
- id: 69
  category: license_system
  question: What type of driver's license is required to operate a moped in Nevada?
  choices:
    A: Only a Class M license is acceptable.
    B: Any classification of Nevada driver's license.
    C: A Class C license with an Endorsement J.
    D: A Commercial Driver License (CDL).
  answer: B
  explanation: 'The manual states: ''You may operate a moped if you have a Nevada
    driver license (any classification) or you may apply for a Class M license with
    an accompanying restriction that will allow you to operate a moped only.'''
- id: 70
  category: license_system
  question: Whose responsibility is it to renew a Nevada driver's license on or before
    its expiration date?
  choices:
    A: The DMV
    B: The driver
    C: The postal service
    D: The local police department
  answer: B
  explanation: Although a renewal notice is mailed to the address on file, it is your
    responsibility to renew on or before your expiration date.
- id: 71
  category: license_system
  question: How does Nevada handle driver's license expiration dates for military
    personnel?
  choices:
    A: They are automatically extended for five years.
    B: They never expire while on active duty.
    C: Nevada does not automatically extend the expiration date.
    D: They are extended until 30 days after discharge.
  answer: C
  explanation: Nevada does not automatically extend the license expiration date for
    military personnel. Active-duty military personnel who are temporarily out-of-state
    may renew through the mail.
- id: 72
  category: license_system
  question: Under Nevada law, how many days do you have to notify the DMV of an address
    or name change?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Under Nevada law, you are required to notify the DMV of any address
    or name change within 30 days.
- id: 73
  category: license_system
  question: If you hold a commercial driver's license (CDL), how must you complete
    an address change?
  choices:
    A: Online at the DMV website
    B: By mailing the DMV-22 form
    C: Over the phone
    D: In person
  answer: D
  explanation: Address changes must be completed in person if you hold a commercial
    driver license.
- id: 74
  category: license_system
  question: Which of the following is required to change your name on your Nevada
    driver's license?
  choices:
    A: You must complete the change online.
    B: You must mail a written request to the DMV.
    C: You must make the change in person at a local DMV office.
    D: You must wait until your license is up for renewal.
  answer: C
  explanation: Name changes must be made in person at a local DMV office. You will
    be asked to complete an application and provide acceptable legal documentation.
- id: 75
  category: license_system
  question: Under what special circumstances might a restricted license be issued
    to a 14- or 15-year-old?
  choices:
    A: If they have maintained a 4.0 GPA
    B: If they have demonstrated family hardship or need to drive to school
    C: If they are enrolled in a driver's education course
    D: If they are employed part-time
  answer: B
  explanation: Restricted licenses may be issued, under special circumstances, to
    drivers age 14 and 15 who have demonstrated family hardship or who need to drive
    to and from school.
- id: 76
  category: penalties_and_points
  question: 'A restricted license may be issued to an individual whose license is
    suspended or revoked if they have served at least:'
  choices:
    A: One-quarter of their required suspension or revocation period.
    B: Half of their required suspension or revocation period.
    C: Three-quarters of their required suspension or revocation period.
    D: 30 days of their required suspension or revocation period.
  answer: B
  explanation: Restricted licenses may be issued to individuals who have served half
    of their required suspension or revocation periods.
- id: 77
  category: license_system
  question: How long is a standard Nevada identification card valid for before it
    expires?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: A Nevada identification card is valid for eight years and expires on
    your birthday unless limited-term immigration documents are presented.
- id: 78
  category: license_system
  question: What is the minimum age required to obtain a Nevada identification card?
  choices:
    A: 10 years old
    B: 12 years old
    C: 14 years old
    D: 16 years old
  answer: A
  explanation: If you want a Nevada identification card, you must be at least 10 years
    old.
- id: 79
  category: penalties_and_points
  question: What happens if you receive 12 or more demerits in a 12-month period while
    holding a Nevada identification card?
  choices:
    A: Your identification card will be permanently revoked.
    B: You will be required to reinstate your driving privileges before you are eligible
      to receive a driver's license.
    C: You will be fined $1,000 and face jail time.
    D: The demerits are ignored because you do not hold a driver's license.
  answer: B
  explanation: If you receive 12 or more demerits in a 12-month period while holding
    an ID card, you will be required to reinstate your driving privileges before you
    are eligible to receive a driver license.
- id: 80
  category: driver_responsibility
  question: How can a driver add a medical indicator to their Nevada driver's license
    or ID card?
  choices:
    A: By verbally informing the DMV clerk during renewal.
    B: By presenting a completed Confidential Physician Report (DMV Form DLD-7).
    C: By showing a prescription bottle with their name on it.
    D: By paying an additional $15 fee at the time of issuance.
  answer: B
  explanation: You must present a completed Confidential Physician Report (DMV Form
    DLD-7) indicating one of the medical codes that is listed on the form to add a
    medical indicator.
- id: 81
  category: driver_responsibility
  question: What is required for a minor to become an organ donor on their Nevada
    driver's license?
  choices:
    A: They must wait until they turn 18.
    B: A parent or guardian must sign an affidavit on the DMV-002 application.
    C: They must pay a special registration fee.
    D: They must provide a doctor's note approving the donation.
  answer: B
  explanation: Minors who wish to be organ donors may have a parent or guardian sign
    an affidavit on the DMV-002 application indicating the parent or guardian understands
    they cannot amend or revoke the donation.
- id: 82
  category: driver_responsibility
  question: If you are a registered organ donor and are taken to a hospital sick or
    injured, what is the medical staff's first priority?
  choices:
    A: To contact the organ donation registry.
    B: To save your life.
    C: To notify your family of your donor status.
    D: To prepare for organ harvesting.
  answer: B
  explanation: Your life always comes first. If you are sick or injured and taken
    to a hospital, the priority is always to save your life.
- id: 83
  category: driver_responsibility
  question: Which of the following is listed as a potential red flag for sex trafficking?
  choices:
    A: Traveling alone with excessive luggage
    B: Not being in control of their own identification documents
    C: Asking for directions to the nearest police station
    D: Driving a vehicle with out-of-state license plates
  answer: B
  explanation: 'Sex Trafficking Red Flags include: Lack of knowledge of whereabouts,
    not in control of own identification documents (ID/passport), restricted communication,
    and a fearful or submissive demeanor.'
- id: 84
  category: driver_responsibility
  question: What should you do if you suspect someone is a victim of human trafficking?
  choices:
    A: Confront the suspected trafficker directly.
    B: Alert the victim to your suspicions.
    C: Attempt a citizen's arrest.
    D: Report the suspicious activity to the U.S. Department of Homeland Security
      without confronting the trafficker.
  answer: D
  explanation: Do not at any time attempt to confront a suspected trafficker directly
    or alert a victim to your suspicions. Report suspected human trafficking to the
    U.S. Department of Homeland Security.
- id: 85
  category: penalties_and_points
  question: What is the reinstatement fee for an alcohol or controlled substance related
    offense, excluding the victim's fee?
  choices:
    A: $35.00
    B: $75.00
    C: $120.00
    D: $155.00
  answer: C
  explanation: The manual states that the reinstatement fee for an alcohol or controlled
    substance related offense is $120.00 (with an additional $35.00 victim's fee).
- id: 86
  category: license_system
  question: How much does it cost to change only your address on your driver's license?
  choices:
    A: $3.25
    B: $8.25
    C: $10.00
    D: $17.25
  answer: A
  explanation: The fee schedule indicates that a 'Change of address only' costs $3.25.
- id: 87
  category: vehicle_information
  question: If your vehicle is a 1970 model or newer, what type of seat belts must
    it have?
  choices:
    A: Lap-type seat belts for front seat passengers only
    B: Lap-type seat belts for each passenger and shoulder harnesses for the front
      seat
    C: Shoulder harnesses for every passenger in the vehicle
    D: Lap-type seat belts only for passengers under age 18
  answer: B
  explanation: If a vehicle is a 1970 model or newer, it must have lap-type seat belts
    for each passenger and shoulder harnesses for use in the front seat.
- id: 88
  category: safe_driving_rules
  question: At what age are passengers required to wear safety belts if the vehicle
    is equipped with them, assuming they do not require a child restraint system?
  choices:
    A: Age 4 and older
    B: Age 6 and older
    C: Age 8 and older
    D: Age 12 and older
  answer: B
  explanation: The manual states that the driver and any passengers age six and older
    must wear safety belts if the vehicle is equipped with them.
- id: 89
  category: safe_driving_rules
  question: 'Under Nevada law, children must be in an approved child restraint system
    if they are:'
  choices:
    A: Under age 5 and less than 40 inches tall
    B: Under age 6 and less than 57 inches tall
    C: Under age 7 and less than 60 inches tall
    D: Under age 8 and less than 50 inches tall
  answer: B
  explanation: Children under age six and those who measure less than 57 inches tall
    must be in an approved child restraint system pursuant to NRS 484B.157.
- id: 90
  category: safe_driving_rules
  question: Where and how must a child under the age of two be secured in a motor
    vehicle?
  choices:
    A: In a forward-facing child restraint system in the back seat
    B: In a rear-facing child restraint system in the back seat
    C: In a rear-facing child restraint system in the front seat
    D: In a booster seat in the back seat
  answer: B
  explanation: Children under the age of two must be secured in a rear-facing child
    restraint system in the back seat of the motor vehicle.
- id: 91
  category: driver_responsibility
  question: 'It is illegal to leave a child aged 7 or younger unattended in a vehicle
    if there is a significant risk, UNLESS they are supervised by a person who is
    at least:'
  choices:
    A: 10 years old
    B: 12 years old
    C: 14 years old
    D: 16 years old
  answer: B
  explanation: Never leave a child aged 7 or younger unattended in a vehicle if conditions
    present a significant risk, unless supervised by and within sight of a person
    at least 12 years old.
- id: 92
  category: driver_responsibility
  question: What is the legal classification for the offense of leaving a dog or cat
    unattended in a vehicle during periods of extreme heat or cold?
  choices:
    A: A civil infraction
    B: A misdemeanor offense
    C: A gross misdemeanor offense
    D: A felony offense
  answer: B
  explanation: The manual notes that violations of the laws regarding unattended children
    and pets in vehicles are misdemeanor offenses.
- id: 93
  category: penalties_and_points
  question: Which of the following is a potential penalty for failing to properly
    restrain a child under age six who measures less than 57 inches?
  choices:
    A: Vehicle impoundment
    B: Mandatory jail time
    C: Suspension of your driver's license
    D: Permanent revocation of your driver's license
  answer: C
  explanation: Failure to restrain children under age six and those measuring less
    than 57 inches may result in fines, community service, and/or the suspension of
    your driver's license.
- id: 94
  category: defensive_driving
  question: Why should you never put an infant in the front seat if the car has a
    passenger side airbag?
  choices:
    A: The airbag can explode from the dashboard at 200 mph and smash into the safety
      seat
    B: The infant will block the driver's view of the right side mirror
    C: The airbag will fail to deploy if the seat is pushed too far back
    D: Front seats do not have the proper anchors for child safety seats
  answer: A
  explanation: In a crash, the airbag explodes from the dashboard at 200 mph, smashing
    through the safety seat into the back of the baby's head.
- id: 95
  category: safe_driving_rules
  question: If an older child must ride in the front seat of a vehicle equipped with
    airbags, what should you do?
  choices:
    A: Deactivate the passenger side airbag
    B: Move the vehicle seat back as far as possible
    C: Have the child sit on a thick cushion
    D: Use only the lap belt without the shoulder harness
  answer: B
  explanation: Older children may ride in the front if necessary, but the vehicle
    seat should be moved back as far as possible to protect the head from contact
    with a rapidly inflating airbag.
- id: 96
  category: defensive_driving
  question: According to the 'Getting Ready to Drive' section, what should you do
    before starting the engine?
  choices:
    A: Turn on the radio to check for traffic updates
    B: Adjust the driver's seat to improve visibility
    C: Rev the engine to warm it up
    D: Check the tire pressure
  answer: B
  explanation: Before you start the engine, you should adjust the driver's seat to
    improve visibility and so all controls can be comfortably reached.
- id: 97
  category: penalties_and_points
  question: What is required to reinstate a suspended, revoked, or canceled license?
  choices:
    A: Payment of a reinstatement fee, original license fee, and applicable testing
      fees
    B: Payment of a reinstatement fee only
    C: Completion of a defensive driving course
    D: A court order from a judge
  answer: A
  explanation: Any license suspension, revocation, or cancellation requires payment
    of the reinstatement fee, the fee for an original license, and any applicable
    testing fees.
- id: 98
  category: driver_responsibility
  question: Who is authorized to use reasonable force to rescue a dog or cat left
    unattended in a vehicle during extreme temperatures?
  choices:
    A: Any concerned citizen
    B: Only the vehicle's owner
    C: Law enforcement, firefighters, and other officials
    D: Animal shelter volunteers only
  answer: C
  explanation: It is illegal to leave a dog or cat unattended in a vehicle during
    extreme heat or cold. Law enforcement, firefighters, and other officials may use
    reasonable force to rescue the animal.
- id: 99
  category: vehicle_information
  question: How can a driver use the 'penny test' to check tire wear?
  choices:
    A: Place a penny flat on the tire sidewall.
    B: Place Lincoln's head into one of the grooves.
    C: Drop a penny from one foot above the tire.
    D: Rub the penny against the tire tread to check for friction.
  answer: B
  explanation: According to the manual, to check for wear using the penny test, you
    should select a point where the tread appears lowest and place Lincoln's head
    into one of the grooves.
- id: 100
  category: vehicle_information
  question: Where can you find the recommended pounds per square inch (psi) for your
    vehicle's tires?
  choices:
    A: On the tire's sidewall only.
    B: In the vehicle owner's manual or the driver's side door jamb.
    C: On the steering wheel column.
    D: Under the hood on the engine block.
  answer: B
  explanation: The manual states to check tire pressure using the recommended psi
    located in the vehicle owner's manual or the driver's side door jamb of the vehicle.
- id: 101
  category: signs_and_signals
  question: What does a brown highway sign indicate?
  choices:
    A: Driver services such as food and lodging.
    B: Road construction or repair warning.
    C: Recreation and scenic area information.
    D: General warning.
  answer: C
  explanation: Standard sign colors dictate that brown means recreation and scenic
    area information.
- id: 102
  category: signs_and_signals
  question: What is the meaning of a pennant-shaped traffic sign?
  choices:
    A: School zone.
    B: Yield right-of-way.
    C: No passing.
    D: Railroad crossing ahead.
  answer: C
  explanation: According to the standard shapes section, a pennant (which is shaped
    like a flag) means 'no passing'.
- id: 103
  category: safe_driving_rules
  question: How should you proceed at a four-way stop?
  choices:
    A: The largest vehicle always has the right-of-way.
    B: Allow vehicles that reach the intersection before you to go first.
    C: Proceed immediately without stopping if the intersection is clear.
    D: Honk to indicate you are proceeding first.
  answer: B
  explanation: 'The manual states: ''At a four-way stop, wait for other vehicles already
    in the intersection. Allow vehicles that reach the intersection before you to
    go first. Wait your turn!'''
- id: 104
  category: sharing_the_road
  question: What must you do when approached by an emergency vehicle using a siren
    and red lights?
  choices:
    A: Stop immediately in the intersection.
    B: Speed up to stay ahead of the emergency vehicle.
    C: Drive to the right edge of the road and stop.
    D: Move to the left lane and slow down.
  answer: C
  explanation: You must drive to the right edge of the road and stop until the emergency
    vehicle has passed. You should never stop in an intersection.
- id: 105
  category: penalties_and_points
  question: What is the consequence of traffic violations in work zones?
  choices:
    A: Increased traffic fines.
    B: Immediate license suspension.
    C: Mandatory community service.
    D: Confiscation of the vehicle.
  answer: A
  explanation: The manual explicitly states that violations in work zones result in
    increased traffic fines.
- id: 106
  category: signs_and_signals
  question: What must a driver do when approaching an intersection where the traffic
    control lights are not working?
  choices:
    A: Treat the intersection as a yield sign.
    B: Come to a full stop before proceeding through the intersection.
    C: Proceed at the normal speed limit if no other cars are visible.
    D: Wait for a police officer to arrive before crossing.
  answer: B
  explanation: When traffic control lights are not working, drivers must come to a
    full stop before proceeding through the intersection.
- id: 107
  category: signs_and_signals
  question: What is the proper response to a steady yellow traffic light if you are
    already in the intersection?
  choices:
    A: Stop immediately where you are.
    B: Back up out of the intersection.
    C: Speed up to 'beat the light.'
    D: Continue moving and clear the intersection safely.
  answer: D
  explanation: 'If a driver is already in the intersection during a steady yellow
    light, they should continue moving and clear it safely. The manual warns: ''DO
    NOT speed up to beat the light.'''
- id: 108
  category: signs_and_signals
  question: What does a flashing red traffic light mean?
  choices:
    A: Proceed with caution without stopping.
    B: Come to a full stop, as it has the same meaning as a stop sign.
    C: Yield to oncoming traffic but do not stop.
    D: The traffic light is about to turn green.
  answer: B
  explanation: A flashing red light means that drivers must come to a full stop. The
    signal has the same meaning as a stop sign.
- id: 109
  category: signs_and_signals
  question: What does a flashing yellow arrow mean?
  choices:
    A: Drivers must yield to oncoming traffic and pedestrians before completing the
      turn.
    B: Drivers have a protected turn and do not need to yield.
    C: Drivers cannot make the movement shown by the arrow.
    D: The signal is broken and drivers must wait for a green light.
  answer: A
  explanation: A flashing yellow arrow means drivers must yield to oncoming traffic
    and pedestrians. They may complete the turn when it is safe to do so.
- id: 110
  category: safe_driving_rules
  question: Under what condition may a driver make a left turn at a red light?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from a one-way street onto another one-way street that has traffic
      moving to the left.
    C: At any intersection between the hours of midnight and 6 AM.
    D: A left turn on red is never permitted under any circumstances.
  answer: B
  explanation: Drivers may make a left turn at a red light only when turning from
    a one-way street onto another one-way street that has traffic moving to the left.
- id: 111
  category: signs_and_signals
  question: Which shape is used exclusively for school zones and school crossings?
  choices:
    A: Octagon
    B: Diamond
    C: Pentagon
    D: Circle
  answer: C
  explanation: A pentagon (5 sides) is the standard shape used for school zones and
    school crossings.
- id: 112
  category: safe_driving_rules
  question: When approaching a yield sign, what must you do regarding vehicles making
    a U-turn from an intersection?
  choices:
    A: Honk to warn them you are proceeding.
    B: Yield the right-of-way to them.
    C: Proceed first, as U-turning vehicles must yield to all traffic.
    D: Stop and wait for a green light.
  answer: B
  explanation: The manual states that at a yield sign, you must 'Yield the right-of-way
    to vehicles making a U-turn from an intersection.'
- id: 113
  category: sharing_the_road
  question: How should a pedestrian respond to a green turn arrow at an intersection?
  choices:
    A: They may cross immediately because vehicles must yield to them.
    B: They should cross quickly before the arrow turns yellow.
    C: They are not to cross unless a pedestrian signal or police officer allows them
      to do so.
    D: They may cross only if they are in a marked crosswalk.
  answer: C
  explanation: 'The manual states: ''Pedestrians facing a green turn arrow are not
    to cross unless a pedestrian signal or police officer allows them to do so.'''
- id: 114
  category: signs_and_signals
  question: What should a pedestrian do if the 'Don't Walk' signal is flashing without
    a countdown timer and they have not yet entered the roadway?
  choices:
    A: Proceed quickly across the roadway.
    B: Yield to vehicles and then cross.
    C: Do not proceed across the roadway.
    D: Cross only if they are in a marked crosswalk.
  answer: C
  explanation: According to the manual, while the Don't Walk indication is flashing
    but is not accompanied by a countdown timer, a pedestrian may not proceed across
    the roadway.
- id: 115
  category: safe_driving_rules
  question: According to the manual, where do the majority of pedestrian fatalities
    occur?
  choices:
    A: At four-way stops
    B: Between intersections (mid-block)
    C: In school zones
    D: At railroad crossings
  answer: B
  explanation: The manual notes that the majority of pedestrian fatalities occur between
    intersections (mid-block).
- id: 116
  category: signs_and_signals
  question: What is the meaning of solid white lines when they separate lanes of traffic?
  choices:
    A: They separate traffic moving in opposite directions and passing is allowed.
    B: They separate traffic moving in the same direction and you should not change
      lanes or pass.
    C: They indicate a center turn lane.
    D: They mean you may pass when it is safe to do so.
  answer: B
  explanation: When solid white lines separate lanes of traffic moving in the same
    direction, drivers should not change lanes or pass.
- id: 117
  category: safe_driving_rules
  question: What is the maximum distance a driver may travel in a center turn lane
    before making a left-hand turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: C
  explanation: Drivers may not travel more than 200 feet in a center turn lane before
    making a left-hand turn.
- id: 118
  category: safe_driving_rules
  question: If a train is coming and there is a stop sign at the railroad crossing,
    how far from the tracks must a driver stop?
  choices:
    A: At least 5 feet
    B: At least 10 feet
    C: At least 15 feet
    D: At least 50 feet
  answer: C
  explanation: If there is a stop sign at the crossing and a train is coming, drivers
    must stop at least 15 feet from the tracks.
- id: 119
  category: safe_driving_rules
  question: Which of the following is a rule you must follow when driving across railroad
    tracks?
  choices:
    A: Always shift to a lower gear while crossing.
    B: Do not shift gears while crossing the tracks.
    C: Stop on the tracks to check for trains.
    D: Accelerate rapidly to cross as fast as possible.
  answer: B
  explanation: The manual explicitly states that you should not shift gears while
    crossing railroad tracks.
- id: 120
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when parking near the nearest
    rail of a railroad?
  choices:
    A: 15 feet
    B: 25 feet
    C: 50 feet
    D: 100 feet
  answer: C
  explanation: You must never park within 50 feet of the nearest rail of a railroad.
- id: 121
  category: penalties_and_points
  question: What is the penalty in Nevada for violating the direction of a school
    crossing guard?
  choices:
    A: A warning for the first offense
    B: A misdemeanor
    C: A felony
    D: A license suspension of 30 days
  answer: B
  explanation: Violating the direction of a school crossing guard is a misdemeanor
    in Nevada.
- id: 122
  category: safe_driving_rules
  question: Under which condition is a U-turn permitted in a school zone in Nevada?
  choices:
    A: When children are present but on the sidewalk
    B: When the crossing guard waves you through
    C: On a day when no school is in session
    D: During the half hour before school begins
  answer: C
  explanation: Nevada law prohibits U-turns in a school zone except when there are
    no children present, it is a day when no school is in session, outside of designated
    school hours, or when signs indicate the zone is not in effect.
- id: 123
  category: driver_responsibility
  question: What is the leading cause of crashes in Nevada?
  choices:
    A: Speeding
    B: Driving under the influence
    C: Distracted driving
    D: Failure to yield the right-of-way
  answer: D
  explanation: The manual states that failure to yield the right-of-way is the leading
    cause of crashes in Nevada.
- id: 124
  category: safe_driving_rules
  question: At an intersection where there are no traffic signs or signals, which
    vehicle should usually go first?
  choices:
    A: The vehicle on your left
    B: The vehicle on your right
    C: The vehicle traveling the fastest
    D: The vehicle turning left
  answer: B
  explanation: At an intersection where there are no traffic signs or signals, the
    vehicle on your right should usually go first.
- id: 125
  category: safe_driving_rules
  question: What must you do when an emergency vehicle approaching from any direction
    is sounding a siren or using flashing lights?
  choices:
    A: Stop immediately in your current lane.
    B: Speed up to clear the intersection quickly.
    C: Drive to the right side of the road, clear of any intersection, and stop.
    D: Pull into the center turn lane and slow down.
  answer: C
  explanation: You must immediately drive to the right side of the road, clear of
    any intersection, and stop until the emergency vehicle has passed.
- id: 126
  category: sharing_the_road
  question: Who has the right-of-way on a highway when on foot and using a guide dog
    or carrying a white cane?
  choices:
    A: Only pedestrians in a marked crosswalk
    B: A person who is blind or visually impaired
    C: Vehicles traveling at the posted speed limit
    D: Emergency vehicles only
  answer: B
  explanation: A person who is blind or visually impaired, on foot and using a guide
    dog or carrying a white cane, has the right-of-way on a highway.
- id: 127
  category: safe_driving_rules
  question: If you are turning left at an intersection, how do right-of-way rules
    apply to a vehicle going straight ahead that is already in the intersection?
  choices:
    A: You have the right-of-way because you are turning.
    B: The vehicle going straight ahead has the right-of-way.
    C: The vehicle on the left always has the right-of-way.
    D: Whoever entered the intersection fastest has the right-of-way.
  answer: B
  explanation: A vehicle going straight ahead that is already in the intersection
    has the right-of-way over one turning left.
- id: 128
  category: sharing_the_road
  question: What must a driver do when encountering a blind person using a white cane
    or guide dog on the road?
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and come to a full stop if necessary
    C: Drive around them slowly
    D: Proceed at the normal speed limit
  answer: B
  explanation: According to the manual, a driver must yield the right-of-way, come
    to a full stop if necessary, and take precautions to avoid a crash when encountering
    a blind or visually impaired person using a guide dog or white cane.
- id: 129
  category: safe_driving_rules
  question: What is the speed limit in business and residential areas in Nevada unless
    otherwise posted?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The manual states that the speed limit is 25 mph in business and residential
    areas and school zones.
- id: 130
  category: safe_driving_rules
  question: Under Nevada's Basic Rule for driving, what does a 'reasonable or proper'
    speed mean?
  choices:
    A: You can drive up to 10 mph over the speed limit if the weather is clear.
    B: You must always drive exactly at the posted speed limit.
    C: You must consider traffic, weather, visibility, and road conditions in addition
      to posted limits.
    D: You should drive at the speed of the fastest vehicle on the road.
  answer: C
  explanation: Nevada's Basic Rule means that in addition to posted speed limits,
    drivers must consider the amount of traffic, weather, visibility, road surface
    conditions, and the type of road.
- id: 131
  category: safe_driving_rules
  question: What must you do if you are driving slower than other traffic on a road
    with two or more lanes moving in the same direction?
  choices:
    A: Move to the right and allow other drivers to pass.
    B: Stay in the left lane to control the flow of traffic.
    C: Turn on your hazard lights and maintain your lane.
    D: Speed up to match the fastest vehicle.
  answer: A
  explanation: The manual states that when there are two or more lanes of traffic
    moving in the same direction, slower traffic must move to the right and allow
    other drivers to pass.
- id: 132
  category: safe_driving_rules
  question: When entering a freeway using a merge or acceleration lane, what should
    you do?
  choices:
    A: Stop at the end of the ramp and wait for a gap in traffic.
    B: Accelerate to or near the speed of freeway traffic and look for an opening.
    C: Drive slowly until you are fully in the right lane.
    D: Expect freeway traffic to yield the right-of-way to you.
  answer: B
  explanation: When entering a freeway, you should use the merge or acceleration lane
    to look for an opening, use your turn signal, and accelerate to or near the speed
    of freeway traffic. You should not stop before merging unless necessary.
- id: 133
  category: defensive_driving
  question: How far ahead should you look down the road when driving on a freeway?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: 45 to 60 seconds
  answer: C
  explanation: The manual advises drivers to stay alert and look ahead much farther
    down the road on freeways—at least 20 to 30 seconds.
- id: 134
  category: signs_and_signals
  question: What does a driver need to do when a freeway entrance is equipped with
    an active ramp meter?
  choices:
    A: Treat it as a yield sign and merge without stopping.
    B: Pull up to the stop line, stop at the red light, and wait for the green light.
    C: Stop only if there is traffic approaching in the right lane.
    D: Bypass the meter by driving on the shoulder.
  answer: B
  explanation: If a freeway entrance has ramp meters switched on, you must pull up
    to the stop line, stop at a red light, wait for the green light, and then proceed.
- id: 135
  category: safe_driving_rules
  question: Which of the following vehicles is permitted to use a High Occupancy Vehicle
    (HOV) ramp meter bypass lane without stopping?
  choices:
    A: A single-occupant electric car
    B: A carpool vehicle with two or more people
    C: A truck with two or more axles
    D: A single-occupant taxi
  answer: B
  explanation: If you are in a carpool of two or more people, you may use the HOV
    ramp meter bypass lane without stopping.
- id: 136
  category: signs_and_signals
  question: What does a yellow X with the word 'MERGE' indicate on a lane use control
    signal?
  choices:
    A: The lane is open and you can drive the posted speed limit.
    B: You can use the lane but should exercise caution due to slow traffic.
    C: The lane is ending and you should prepare to safely merge into another open
      lane.
    D: The lane is closed and you cannot drive in it under any circumstances.
  answer: C
  explanation: A yellow X with MERGE means the lane is ending and the driver should
    prepare to safely merge into another open lane.
- id: 137
  category: signs_and_signals
  question: What action must you take if you see a red X with the word 'CLOSED' over
    your lane?
  choices:
    A: Slow down and proceed with caution.
    B: Stop immediately in the lane.
    C: Safely merge into another open lane because you cannot drive in the closed
      lane.
    D: Increase your speed to pass the closed section quickly.
  answer: C
  explanation: A red X with CLOSED means drivers cannot drive in the lane under the
    red X. For the driver's safety and the safety of others, drivers must safely merge
    into another open lane.
- id: 138
  category: sharing_the_road
  question: Which of the following is true regarding High-Occupancy Vehicle (HOV)
    lanes in Nevada?
  choices:
    A: Pets count toward the 2+ persons requirement.
    B: Motorcycles are eligible to use the lane even with only one person.
    C: Electric cars with only one person are always eligible.
    D: Trucks with 2+ axles are eligible if they have 2+ persons.
  answer: B
  explanation: The rules of HOV lanes state that motorcycles are eligible (even with
    1 person). Pets do not count, electric cars need 2+ persons, and trucks with 2+
    axles are not eligible even with 2+ persons.
- id: 139
  category: penalties_and_points
  question: What is the fine for violating the High-Occupancy Vehicle (HOV) lane rules
    in Nevada?
  choices:
    A: $100
    B: $150
    C: $250
    D: $500
  answer: C
  explanation: The manual indicates that the fine for an HOV lane violation is $250.
- id: 140
  category: safe_driving_rules
  question: What is the typical speed limit on rural interstate freeways in Nevada?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70+ mph
    D: 80 mph
  answer: C
  explanation: The manual lists '70+ mph' as the example speed limit for rural interstate
    freeways in Nevada.
- id: 141
  category: safe_driving_rules
  question: When driving on a freeway with several lanes in each direction, what is
    the extreme left lane intended for?
  choices:
    A: Slower traffic
    B: Faster traffic
    C: Merging traffic
    D: Exiting traffic
  answer: B
  explanation: On freeways with several lanes in each direction, drivers should leave
    the extreme left lane for faster traffic.
- id: 142
  category: signs_and_signals
  question: What does a down green arrow with the word 'OPEN' signify on a freeway
    lane control signal?
  choices:
    A: Drivers must exit the freeway from this lane.
    B: Drivers are allowed to drive the posted speed limit in the lane below the arrow.
    C: The lane is reserved for High Occupancy Vehicles only.
    D: Drivers must slow down and prepare to merge right.
  answer: B
  explanation: A down green arrow with OPEN means drivers are allowed to drive the
    posted speed limit in the lane below the green arrow.
- id: 143
  category: signs_and_signals
  question: What does a double solid white line indicate when driving near a carpool
    (HOV) lane?
  choices:
    A: You can enter or exit the carpool lane at any time.
    B: You cannot cross the lines to enter or exit the carpool lane.
    C: The carpool lane is currently closed to all traffic.
    D: Only motorcycles and emergency vehicles may cross the lines.
  answer: B
  explanation: According to the manual, a double solid white line means that you cannot
    cross the lines to enter or exit the car pool lane.
- id: 144
  category: safe_driving_rules
  question: Which of the following vehicles is NOT eligible to use an HOV (carpool)
    lane?
  choices:
    A: A motorcycle
    B: An emergency vehicle responding to an emergency
    C: A passenger vehicle with 3 people
    D: A vehicle with more than 2 axles
  answer: D
  explanation: The rules of HOV lanes state that vehicles with more than 2 axles (or
    vehicle-trailer combinations) are not eligible to use them.
- id: 145
  category: safe_driving_rules
  question: What should you do if you miss your freeway exit ramp?
  choices:
    A: Pull onto the shoulder and carefully back up to the exit.
    B: Make a U-turn at the next available median crossing.
    C: Go to the next exit, get back on the freeway in the opposite direction, and
      return to the exit.
    D: Stop in the right lane and wait for a gap in traffic before backing up.
  answer: C
  explanation: 'The manual explicitly states: ''If you miss the exit ramp, never turn
    around or back up. Go to the next exit, get back on the freeway in the opposite
    direction, and return to the exit.'''
- id: 146
  category: vehicle_information
  question: How should you properly use four-wheel anti-lock brakes (ABS) in an emergency
    situation?
  choices:
    A: Pump the brakes rapidly to avoid skidding.
    B: Push the brake pedal down hard, hold it down firmly, and steer.
    C: Press the brake pedal lightly and apply the parking brake.
    D: Turn the steering wheel hard in one direction while braking.
  answer: B
  explanation: For four-wheel ABS, the manual instructs drivers to 'push the brake
    pedal down hard, hold it down firmly and steer in the direction you want the car
    to go.'
- id: 147
  category: vehicle_information
  question: What will happen if you pump the brakes on a vehicle equipped with an
    anti-lock braking system (ABS)?
  choices:
    A: The vehicle will stop much faster.
    B: It will disengage or 'turn off' the ABS.
    C: The steering wheel will lock up.
    D: The rear wheels will skid sideways.
  answer: B
  explanation: Drivers should be aware that removing steady pressure from the brake
    pedal or pumping the brakes will disengage, or 'turn off,' the ABS.
- id: 148
  category: defensive_driving
  question: What is the number one crash type on Nevada's streets and highways?
  choices:
    A: Head-on collisions
    B: Side-swipe collisions
    C: Rear-end collisions
    D: Intersection T-bone collisions
  answer: C
  explanation: The manual states that the rear-end collision is the number one crash
    type on Nevada's streets and highways.
- id: 149
  category: safe_driving_rules
  question: According to highway safety studies, what is a normal driver's reaction
    time?
  choices:
    A: 0.5 to 1 second
    B: 1 to 1.5 seconds
    C: 2 to 2.5 seconds
    D: 3 to 4 seconds
  answer: C
  explanation: Highway safety studies show normal reaction times are 2 to 2.5 seconds.
- id: 150
  category: safe_driving_rules
  question: If you double your speed from 30 mph to 60 mph, how does your braking
    distance change?
  choices:
    A: It stays the same.
    B: It becomes twice as long.
    C: It becomes three times as long.
    D: It becomes four times as long.
  answer: D
  explanation: The most important point for any driver to remember is that if you
    double your speed, your braking distance does not become twice as long; it becomes
    four times as long.
- id: 151
  category: defensive_driving
  question: At what speeds do most cars begin to lose traction and hydroplane in heavy
    rainfall?
  choices:
    A: Between 15 and 25 mph
    B: Between 25 and 35 mph
    C: Between 35 and 55 mph
    D: Between 55 and 75 mph
  answer: C
  explanation: Most cars will begin to lose traction and hydroplane between speeds
    of 35 and 55 mph in heavy rainfall.
- id: 152
  category: defensive_driving
  question: How far ahead should you look when driving at freeway speeds?
  choices:
    A: At least 5 to 10 seconds
    B: At least 12 seconds
    C: At least 20 to 30 seconds
    D: At least 45 seconds
  answer: C
  explanation: When you are driving at freeway speeds you need to look ahead at least
    20 to 30 seconds.
- id: 153
  category: defensive_driving
  question: What is the minimum recommended following distance if you are driving
    40 mph or less?
  choices:
    A: One second
    B: Two seconds
    C: Four seconds
    D: Seven seconds
  answer: B
  explanation: If you are driving 40 mph or less, stay at least two seconds behind
    the vehicle in front of you. This is a minimum following distance.
- id: 154
  category: defensive_driving
  question: In what order should you look when approaching an intersection?
  choices:
    A: Right, left, and right again
    B: Left, right, and straight ahead
    C: Left, right, and left again
    D: Straight ahead, left, and right
  answer: C
  explanation: When approaching an intersection, you should look left, right, and
    left again just before entering the intersection.
- id: 155
  category: driver_responsibility
  question: When is it permissible to use a handheld cellular phone to report an emergency
    while driving?
  choices:
    A: At any time, as long as you are driving under the speed limit.
    B: Only if stopping the vehicle would be inadvisable, impractical, or dangerous.
    C: Only when driving in the right-hand lane.
    D: It is never permissible under any circumstances.
  answer: B
  explanation: You may use the device to report an emergency if stopping the vehicle
    would be inadvisable, impractical or dangerous.
- id: 156
  category: vehicle_information
  question: How do you know if your anti-lock braking system (ABS) is NOT working?
  choices:
    A: The brake pedal feels unusually soft when pressed.
    B: The vehicle pulls to one side when braking.
    C: The ABS symbol stays lighted on the dashboard long after the car has started.
    D: The steering wheel vibrates when you start the engine.
  answer: C
  explanation: You will know your ABS is not working if the ABS symbol stays lighted
    on the dashboard long after the car has started.
- id: 157
  category: safe_driving_rules
  question: What three things must occur in order to stop your vehicle?
  choices:
    A: Perception, reaction, and braking
    B: Acceleration, deceleration, and braking
    C: Observation, signaling, and braking
    D: Perception, steering, and braking
  answer: A
  explanation: 'To stop your vehicle, three things must occur: seeing the reason to
    stop (perception), sending the message to your foot (reaction), and pushing the
    brake pedal (braking).'
- id: 158
  category: safe_driving_rules
  question: What should you do if you are stopped by law enforcement at night?
  choices:
    A: Step out of the vehicle immediately to speak with the officer
    B: Turn off your headlights and wait in the dark
    C: Turn on the interior light to assist with good communication
    D: Reach into the glove compartment to retrieve your registration
  answer: C
  explanation: The manual states that if you are stopped at night, you should turn
    on the interior light because good lighting assists good communication.
- id: 159
  category: driver_responsibility
  question: When stopped by a law enforcement officer, where should you keep your
    hands?
  choices:
    A: In your lap or pockets
    B: In plain view at all times, preferably on the steering wheel
    C: Resting on the window sill
    D: Behind your head
  answer: B
  explanation: Drivers are instructed to keep their hands in plain view at all times
    (preferably on the steering wheel) and refrain from making any sudden movements.
- id: 160
  category: safe_driving_rules
  question: In which direction does all traffic move around a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: Both clockwise and counterclockwise
    D: Straight through the center island
  answer: B
  explanation: According to the manual, all traffic moves in ONE DIRECTION around
    the roundabout - COUNTERCLOCKWISE.
- id: 161
  category: vehicle_information
  question: Who is permitted to use the truck apron provided around the center island
    of a roundabout?
  choices:
    A: Cars passing slower traffic
    B: Bicyclists who are uncomfortable in the main lane
    C: Large commercial trucks and trailers
    D: Pedestrians crossing the intersection
  answer: C
  explanation: The manual specifies that large commercial trucks and trailers are
    permitted to use the truck apron to negotiate the tight turning radius, and that
    cars should not use it.
- id: 162
  category: sharing_the_road
  question: Where should pedestrians walk when navigating a roundabout?
  choices:
    A: Across the central island
    B: In the circulatory roadway with the vehicles
    C: On the raised pavement of the truck apron
    D: Always stay in the designated crosswalks
  answer: D
  explanation: The manual explicitly states for pedestrians to 'Always stay in the
    designated crosswalks' and 'Never cross to the central island.'
- id: 163
  category: signs_and_signals
  question: If your vehicle's turn signals are temporarily out of order, what is the
    proper hand signal for a right turn?
  choices:
    A: Extend left arm horizontally out of open window
    B: Extend left arm downward, with palm of hand to the rear
    C: Extend left arm with elbow bent upward at about a 90-degree angle
    D: Extend right arm horizontally out of the passenger window
  answer: C
  explanation: The manual states the hand signal for a right turn is to extend the
    left arm with the elbow bent upward at about a 90-degree angle.
- id: 164
  category: safe_driving_rules
  question: How far ahead must you signal your turn on open highways?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: D
  explanation: Drivers must signal their turn at least 100 feet ahead on city streets
    or 300 feet (30 car lengths) on open highways.
- id: 165
  category: defensive_driving
  question: When waiting to make a left turn, how should you position your vehicle's
    wheels?
  choices:
    A: Pointed straight ahead until you begin to actually complete the turn
    B: Turned slightly to the left to prepare for the turn
    C: Turned slightly to the right to avoid oncoming traffic
    D: Pointed toward the nearest curb
  answer: A
  explanation: 'The manual instructs: ''When turning left, keep your wheels pointed
    straight ahead until you begin to actually complete the turn.'''
- id: 166
  category: safe_driving_rules
  question: In which of the following locations is it illegal to make a U-turn?
  choices:
    A: Across a double yellow line when it is safe and legal
    B: At an intersection on a green traffic signal light
    C: At or on a railroad crossing
    D: On a divided highway if an opening is provided in the center divider
  answer: C
  explanation: The manual lists 'At or on a railroad crossing' under the 'Illegal
    U-Turns' section.
- id: 167
  category: safe_driving_rules
  question: When is it legal to make a U-turn in a school zone in Nevada?
  choices:
    A: At any time as long as you yield to pedestrians
    B: Only when children are present in the zone
    C: When it is a day when no school is in session
    D: During the half hour before the next school session begins
  answer: C
  explanation: Nevada law prohibits U-turns in a school zone except under specific
    conditions, one of which is 'when it is a day when no school is in session.'
- id: 168
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane road, when is it safe to pull
    back into your lane?
  choices:
    A: As soon as your front bumper is ahead of the passed vehicle
    B: When you can see the vehicle you passed in your rear-view mirror
    C: After you have traveled exactly 100 feet past the vehicle
    D: When the driver of the passed vehicle honks their horn
  answer: B
  explanation: 'The manual states: ''After you have passed, pull back into your lane
    when you can see the vehicle you passed in your rear-view mirror.'''
- id: 169
  category: safe_driving_rules
  question: What is a strict rule regarding your speed when passing another vehicle?
  choices:
    A: You may exceed the speed limit by up to 10 mph to pass quickly
    B: You should never exceed the speed limit to pass
    C: You must accelerate to at least 15 mph over the speed of the vehicle you are
      passing
    D: You may exceed the speed limit only on divided highways
  answer: B
  explanation: 'The manual explicitly states: ''you should never exceed the speed
    limit to pass''.'
- id: 170
  category: sharing_the_road
  question: How should a bicyclist navigate a roundabout if they are comfortable riding
    in traffic?
  choices:
    A: Ride on the truck apron to stay out of the way of cars
    B: Take the lane and circulate with the vehicles
    C: Ride in the opposite direction of traffic to maintain visibility
    D: Dismount and walk the bike in the circulatory roadway
  answer: B
  explanation: For bicyclists comfortable riding in traffic, the manual advises to
    'take the lane and circulate with the vehicles, making sure to yield to traffic
    in the circle when entering.'
- id: 171
  category: signs_and_signals
  question: What does it mean when a driver extends their left arm downward, with
    the palm of the hand to the rear?
  choices:
    A: They are preparing to turn left
    B: They are preparing to turn right
    C: They are slowing or stopping
    D: They are signaling a vehicle to pass them
  answer: C
  explanation: The manual defines the hand signal for 'Slowing or stop' as extending
    the left arm downward, with the palm of the hand to the rear.
- id: 172
  category: safe_driving_rules
  question: When preparing to pass on a two-lane road in a business or residential
    area, how far ahead must you turn on your left signal?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: When passing on a two-lane road, you must turn your left signal light
    on 100 feet ahead in business or residential areas.
- id: 173
  category: safe_driving_rules
  question: When passing on a two-lane road outside of business or residential areas,
    how far ahead should you signal?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: When passing on a two-lane road, turn your left signal light on 300
    feet ahead in areas other than business or residential areas.
- id: 174
  category: safe_driving_rules
  question: In which of the following situations is it illegal to pass another vehicle
    on a two-lane road?
  choices:
    A: When there is a broken yellow line in your lane
    B: At or within 100 feet of a street crossing
    C: When the vehicle ahead is traveling below the speed limit
    D: When you can see clearly ahead and there is no oncoming traffic
  answer: B
  explanation: You must not pass on a two-lane road at or within 100 feet of a street
    crossing.
- id: 175
  category: safe_driving_rules
  question: 'It is generally illegal to travel in the far left lane below the speed
    limit when being overtaken, EXCEPT when you are:'
  choices:
    A: Driving on a rural highway
    B: Preparing for a left turn at an intersection
    C: Driving a commercial vehicle
    D: Traveling in a marked bicycle lane
  answer: B
  explanation: The rule against traveling in the far left lane below the speed limit
    while being overtaken does not apply when preparing for a left turn at an intersection.
- id: 176
  category: safe_driving_rules
