    C: To alert emergency services if a crash occurs.
    D: To record video of the vehicle's surroundings for insurance purposes.
  answer: B
  explanation: The manual states the primary purpose of Driver Assistance Systems
    technologies is 'to perform a component of the driving function in specific circumstances...
