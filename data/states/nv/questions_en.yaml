  question: How should you turn your wheels when parked headed uphill next to a curb?
  choices:
    A: Turn front tires toward the curb
    B: Turn front tires away from the curb
    C: Keep front tires perfectly straight
    D: Turn rear tires toward the curb
  answer: B
  explanation: When headed uphill and there is a curb, turn your front tires away
    from the curb.
- id: 183
  category: safe_driving_rules
  question: You may not park your car within how many feet of a fire hydrant in a
    place where parallel parking is permitted?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: You may not park your car within 15 feet of a fire hydrant in a place
    where parallel parking is permitted.
- id: 184
  category: safe_driving_rules
  question: It is illegal to park your vehicle within how many feet of the nearest
    rail of a railroad?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: D
  explanation: You may not park your car within 50 feet of the nearest rail of a railroad.
- id: 185
  category: defensive_driving
  question: If you have car trouble and must use an emergency stopping area on a freeway,
