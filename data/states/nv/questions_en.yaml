  choices:
    A: Check your blind spots before changing lanes
    B: Use your turn signal
    C: Drive off the paved portion of the highway
    D: Pass if the street is marked for two or more lanes in your direction
  answer: C
  explanation: Never pass on the right when doing so would result in driving off the
    paved portion of the highway.
- id: 177
  category: sharing_the_road
  question: If an adjacent lane does not exist, what is the minimum safe distance
