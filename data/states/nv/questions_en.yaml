  choices:
    A: Check their mirrors and look over their shoulders.
    B: Wait for the blind spot monitor to automatically steer the car.
    C: Honk their horn to alert vehicles in the blind spot.
    D: Turn off the blind spot monitor.
  answer: A
  explanation: The manual states, 'The driver should always check their mirrors and
