- id: 190
  category: vehicle_information
  question: What is a key characteristic of Advanced Driver Assistance Systems (ADAS)?
  choices:
    A: They are designed to completely replace the need for a human driver.
    B: They assist the driver but do not drive the vehicle by themselves.
    C: They allow the driver to sleep while traveling on freeways.
    D: They are only active when the vehicle is traveling above 50 mph.
  answer: B
  explanation: The manual states that ADAS technologies 'assist the driver but do
    not drive the vehicle by themselves.'
- id: 191
  category: vehicle_information
  question: 'Most vehicle warning systems are considered ''passive,'' which means
    they:'
  choices:
    A: Automatically steer the vehicle away from danger.
    B: Apply the brakes forcefully to prevent a crash.
    C: Warn the driver of a potential issue but do not automatically prevent a problem
      or crash.
    D: Only operate when the vehicle is in reverse.
  answer: C
  explanation: The manual explains that most warning technologies are passive, 'meaning
    they warn the driver of a potential issue but do not automatically prevent a problem
    or crash.'
- id: 192
  category: defensive_driving
  question: Even if your vehicle is equipped with a back-up warning system or rear
    camera, what must you still do when backing up?
  choices:
    A: Rely entirely on the dashboard display screen.
