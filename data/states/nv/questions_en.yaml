metadata:
  source: 2025 Nevada Driver's Manual
  total_questions: 260
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Nevada, what is the minimum age at which a person can apply for an
    instruction permit?
  choices:
    A: 15 years old
    B: 15 1/2 years old
    C: 16 years old
    D: 14 1/2 years old
  answer: B
  explanation: According to the Nevada Driver's Handbook, a person must be at least
    15 1/2 years old to apply for an instruction permit.
- id: 2
  category: license_system
  question: A Nevada instruction permit holder must be accompanied by a licensed driver
    who is at least how old?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: B
  explanation: The supervising driver must be at least 21 years old, have at least
    one year of licensed driving experience, and be seated next to the permit holder.
- id: 3
  category: license_system
  question: 'For the first six months after receiving a Nevada driver''s license,
    a driver under 18 may not transport any passengers under the age of 18, except
    for:'
  choices:
    A: School friends
    B: Co-workers
    C: Immediate family members
    D: No exceptions are allowed
  answer: C
  explanation: Nevada law prohibits drivers under 18 from carrying passengers under
    18 (except immediate family) for the first six months of licensure.
- id: 4
  category: license_system
  question: What is the statewide curfew for Nevada drivers under the age of 18?
  choices:
    A: 9 PM to 6 AM
    B: 10 PM to 5 AM
    C: 11 PM to 5 AM
    D: Midnight to 6 AM
  answer: B
  explanation: Drivers under 18 are generally not allowed to drive between 10 PM and
    5 AM unless traveling to or from a scheduled event like school or work.
- id: 5
  category: license_system
  question: To apply for a Nevada driver's license, a minor must complete how many
    hours of supervised driving practice?
  choices:
    A: 30 hours total, 5 at night
    B: 40 hours total, 10 at night
    C: 50 hours total, 10 at night
    D: 100 hours total, 20 at night
  answer: C
  explanation: Nevada requires 50 hours of supervised experience, 10 of which must
    be at night, documented in a DMV-approved log.
- id: 6
  category: license_system
  question: New Nevada residents must obtain a Nevada driver's license within how
    many days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Nevada law requires new residents to transfer their out-of-state license
    to a Nevada license within 30 days.
- id: 7
  category: license_system
  question: If you change your address within Nevada, you must notify the DMV within
    how many days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Nevada law requires you to notify the DMV of an address or name change
    within 30 days.
- id: 8
  category: license_system
  question: What is the minimum vision requirement to obtain a Nevada driver's license
    without restrictions?
  choices:
    A: 20/20 in both eyes
    B: 20/40 in both eyes
    C: 20/50 in one eye
    D: 20/100 in both eyes
  answer: B
  explanation: Nevada requires a minimum vision of 20/40 in both eyes. If you need
    glasses or contacts to achieve this, a restriction will be placed on your license.
- id: 9
  category: license_system
  question: In Nevada, your driver's license will be suspended if you accumulate how
    many points within a 12-month period?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: The Nevada DMV will suspend your license for 6 months if you receive
    12 or more demerit points in any 12-month period.
- id: 10
  category: license_system
  question: What are the minimum liability insurance requirements for a motor vehicle
    in Nevada?
  choices:
    A: 15/30/10
    B: 25/50/20
    C: 50/100/50
    D: 10/20/10
  answer: B
  explanation: Nevada requires minimum liability coverage of $25,000 for bodily injury
    to one person, $50,000 for bodily injury to two or more people, and $20,000 for
    property damage.
- id: 11
  category: license_system
  question: A Nevada instruction permit is valid for how long from the date of issuance?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until the applicant turns 18
  answer: B
  explanation: A Nevada instruction permit is valid for one year from the date it
    is issued.
- id: 12
  category: license_system
  question: Which class of Nevada driver's license is required to operate standard
    passenger cars and trucks?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class M
  answer: C
  explanation: Class C is the standard driver's license for cars, vans, and pickups
    with a Gross Vehicle Weight Rating (GVWR) of less than 26,001 pounds.
- id: 13
  category: license_system
  question: In Nevada, a minor's driver's license can be suspended for which of the
    following non-driving reasons?
  choices:
    A: Habitual truancy from school
    B: Failure to pay library fines
    C: Low grades in physical education
    D: Failure to participate in extracurricular activities
  answer: A
  explanation: Nevada law allows for the suspension of a minor's license or the delay
    of issuance for habitual truancy or certain alcohol/drug-related offenses.
- id: 14
  category: license_system
  question: 'When registering a vehicle in Nevada, you must provide evidence of insurance.
    This insurance must be issued by:'
  choices:
    A: Any insurance company in the United States
    B: A company licensed to do business in Nevada
    C: A company based in the owner's previous state of residence
    D: The federal government
  answer: B
  explanation: Nevada requires insurance to be provided by a company authorized to
    do business in the state of Nevada.
- id: 15
  category: license_system
  question: To obtain a Nevada 'Real ID' compliant license, which of the following
    must you provide?
  choices:
    A: Proof of identity, Social Security number, and two proofs of Nevada residency
    B: Only a birth certificate
    C: Only a utility bill
    D: A verbal statement of residency
  answer: A
  explanation: Federal Real ID requirements adopted by Nevada require proof of identity
    (like a passport or birth certificate), Social Security number, and two documents
    proving Nevada residential address.
- id: 16
  category: license_system
  question: In Nevada, if you complete a DMV-approved traffic safety school, how many
    demerit points will be removed from your driving record?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Under Nevada law, completing an approved traffic safety school will
    result in a 3-point reduction from your driving record, but this can only be done
    once every 12 months.
- id: 17
  category: license_system
  question: Most Nevada driver's licenses issued to residents between the ages of
    16 and 64 are valid for how many years?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: In Nevada, standard driver's licenses for residents aged 16 to 64 are
    typically issued for a period of 8 years.
- id: 18
  category: license_system
  question: For individuals who cannot meet the legal presence requirements for a
    standard Nevada license, the state offers which alternative document for driving
    purposes?
  choices:
    A: Temporary Driving Permit
    B: Driver Authorization Card (DAC)
    C: Non-Resident Driving Certificate
    D: Limited Purpose License
  answer: B
  explanation: The Driver Authorization Card (DAC) is available to Nevada residents
    who cannot meet the proof of identity/legal presence requirements for a standard
    or Real ID license.
- id: 19
  category: license_system
  question: In the Nevada demerit point system, how long do points remain on your
    driver's record from the date of conviction?
  choices:
    A: 6 months
    B: 12 months
    C: 24 months
    D: 36 months
  answer: B
  explanation: Demerit points remain on your Nevada driving record for 12 months from
    the date of the conviction.
- id: 20
  category: license_system
  question: If your Nevada driver's license has been expired for more than ________,
    you will be required to retake the vision, knowledge, and skills tests.
  choices:
    A: 30 days
    B: 6 months
    C: One year
    D: Two years
  answer: C
  explanation: If a Nevada license is expired for one year or more, the applicant
    must retake all required tests (vision, written, and driving).
- id: 21
  category: license_system
  question: In Nevada, driving 1 to 10 miles per hour over the posted speed limit
    results in how many demerit points?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: A
  explanation: Nevada's point system assigns 1 demerit point for speeding 1-10 mph
    over the limit.
- id: 22
  category: license_system
  question: Under Nevada law, a conviction for 'Reckless Driving' results in how many
    demerit points being added to your record?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Reckless driving is a serious offense in Nevada and carries a penalty
    of 8 demerit points.
- id: 23
  category: license_system
  question: To maintain their Nevada driving privilege, a minor under the age of 18
    must meet which of the following school-related requirements?
  choices:
    A: Maintain a 3.0 GPA
    B: Have no more than 5 unexcused absences
    C: Meet a minimum 90% school attendance record
    D: Be enrolled in at least two extracurricular activities
  answer: C
  explanation: Nevada law requires minors to maintain at least 90% school attendance
    to keep their driver's license or permit.
- id: 24
  category: license_system
  question: 'In Nevada, a first-time DUI offender with a BAC of 0.08% or higher is
    generally required to install an Ignition Interlock Device (IID) for a minimum
    of:'
  choices:
    A: 30 days
    B: 90 days
    C: 185 days
    D: One year
  answer: C
  explanation: Nevada law requires most first-time DUI offenders to install an IID
    for 185 days (approximately 6 months) as a condition of reinstating their driving
    privilege.
- id: 25
  category: license_system
  question: A Nevada motorcycle instruction permit (Class M) is valid for how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until the driver turns 21
  answer: B
  explanation: A Nevada motorcycle instruction permit is valid for one year from the
    date of issuance.
- id: 26
  category: license_system
  question: What is the minimum age to apply for a Commercial Learner's Permit (CLP)
    in Nevada?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: An applicant must be at least 18 years old to apply for a Commercial
    Learner's Permit in Nevada.
- id: 27
  category: license_system
  question: If you receive a traffic citation in Nevada and fail to appear in court
    or pay the fine, what action will the DMV take?
  choices:
    A: Issue a double fine
    B: Suspend your driver's license
    C: Impound your vehicle
    D: Require you to retake the driving test
  answer: B
  explanation: The Nevada DMV will suspend your driver's license if you fail to appear
    in court for a traffic citation or fail to pay the required fines.
- id: 28
  category: license_system
  question: To have the 'VETERAN' designation printed on a Nevada driver's license,
    what must the applicant provide to the DMV?
  choices:
    A: A letter from their commanding officer
    B: A valid military ID card
    C: A DD-214 or other proof of honorable discharge
    D: Evidence of current enrollment in the VA
  answer: C
  explanation: Nevada veterans must provide a DD-214 or other official documentation
    showing an honorable discharge to receive the veteran designation on their license.
- id: 29
  category: license_system
  question: At what demerit point total does the Nevada DMV first send a warning letter
    to a driver regarding their record?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: A
  explanation: The Nevada DMV sends a warning letter to drivers who have accumulated
    between 3 and 11 points on their record.
- id: 30
  category: license_system
  question: In Nevada, if a driver is convicted of 'Failure to yield the right-of-way',
    how many demerit points are assigned to their driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failure to yield the right-of-way is a 4-point violation in the Nevada
    demerit point system.
- id: 31
  category: driver_testing
  question: If you fail the Nevada written knowledge test, how soon are you permitted
    to retake it?
  choices:
    A: Immediately
    B: The next business day
    C: After 7 days
    D: After 30 days
  answer: B
  explanation: According to the Nevada DMV, if you fail the knowledge test, you may
    take it again as soon as the next business day. Retakes are subject to additional
    testing fees.
- id: 32
  category: driver_testing
  question: When arriving for your Nevada skills (road) test, which of the following
    must you provide for the vehicle you are using?
  choices:
    A: A vehicle inspection certificate from a private mechanic
    B: A bill of sale dated within the last 30 days
    C: Valid registration and evidence of Nevada liability insurance
    D: The vehicle's title (pink slip)
  answer: C
  explanation: For the Nevada road test, the vehicle must be properly registered and
    insured. You must present the registration card and evidence of Nevada liability
    insurance at the time of the test.
- id: 33
  category: driver_testing
  question: In the Nevada demerit point system, how many points are assessed against
    your driving record for a conviction of Reckless Driving?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Reckless Driving is considered a major traffic offense in Nevada and
    results in 8 demerit points being added to the driver's record.
- id: 34
  category: driver_testing
  question: What is the Blood Alcohol Concentration (BAC) limit for a driver operating
    a commercial motor vehicle in Nevada?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: While the legal limit for standard drivers is 0.08%, the limit for
    commercial drivers (CDL holders) in Nevada is 0.04%.
- id: 35
  category: driver_testing
  question: 'In Nevada, a driver under the age of 21 is considered to be driving under
    the influence if their Blood Alcohol Concentration (BAC) is at least:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Nevada has a 'Zero Tolerance' policy for minors. Drivers under 21 years
    of age are prohibited from driving with a BAC of 0.02% or higher.
- id: 36
  category: driver_testing
  question: How many demerit points are assigned to a Nevada driver for 'Passing a
    school bus when signals are flashing'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Illegally passing a school bus that has its red lights flashing and
    stop arm extended results in 4 demerit points in Nevada.
- id: 37
  category: driver_testing
  question: In Nevada, a first offense for using a handheld wireless communications
    device while driving is not a moving violation. However, a second offense within
    7 years will result in how many demerit points?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Under NRS 484B.165, a second or subsequent conviction for using a handheld
    device while driving within a 7-year period is considered a moving violation and
    carries 4 demerit points.
- id: 38
  category: driver_testing
  question: Making an illegal U-turn in Nevada will result in how many demerit points
    being added to your driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: The Nevada DMV assigns 3 demerit points for convictions related to
    making an illegal U-turn.
- id: 39
  category: driver_testing
  question: In the Nevada demerit point system, 'Careless Driving' carries a penalty
    of how many points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Careless Driving is penalized with 6 demerit points in Nevada, which
    is slightly less than the 8 points for Reckless Driving.
- id: 40
  category: driver_testing
  question: Failure to yield the right-of-way to an emergency vehicle (violating the
    'Move Over' law) in Nevada results in how many demerit points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Failure to yield to an emergency vehicle is a moving violation that
    carries 4 demerit points in Nevada.
- id: 41
  category: driver_testing
  question: If your Nevada license is suspended for a DUI or other high-point violations,
    you may be required to maintain an SR-22 financial responsibility certificate
    for how long?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: Nevada law typically requires drivers to maintain an SR-22 (Certificate
    of Financial Responsibility) for 3 years following the reinstatement of a license
    after certain suspensions.
- id: 42
  category: driver_testing
  question: A Nevada motorcycle instruction permit holder is subject to which of the
    following restrictions?
  choices:
    A: May only drive during daylight hours
    B: May not carry passengers
    C: May not drive on freeways or high-speed highways
    D: All of the above
  answer: D
  explanation: Nevada motorcycle permit holders are restricted to daylight hours only,
    are prohibited from carrying passengers, and may not drive on freeways or limited-access
    highways.
- id: 43
  category: driver_testing
  question: 'In Nevada, a conviction for graffiti (vandalism) can result in the suspension
    of your driver''s license for up to:'
  choices:
    A: 30 days
    B: 90 days
    C: 1 year
    D: 2 years
  answer: D
  explanation: Under NRS 206.330, a court may suspend a person's Nevada driver's license
    for 6 months to 2 years for a conviction involving graffiti.
- id: 44
  category: driver_testing
  question: How many demerit points are assessed for speeding 41 miles per hour or
    more over the posted speed limit in Nevada?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: In Nevada, speeding 41 mph or more over the limit is the highest tier
    of speeding violations and carries 5 demerit points.
- id: 45
  category: driver_testing
  question: To pass the Nevada knowledge (written) test, what is the minimum score
    required?
  choices:
    A: 70% (35 out of 50 questions correct)
    B: 75% (38 out of 50 questions correct)
    C: 80% (40 out of 50 questions correct)
    D: 85% (43 out of 50 questions correct)
  answer: C
  explanation: The Nevada DMV knowledge test consists of 50 multiple-choice questions.
    A passing score is 80%, which means you must answer at least 40 questions correctly.
- id: 46
  category: driver_testing
  question: When taking the Nevada skills (road) test, which of the following is the
    applicant responsible for providing?
  choices:
    A: A vehicle with a valid registration and proof of insurance
    B: A vehicle provided by the DMV for a fee
    C: A vehicle with at least one working brake light
    D: A vehicle with a temporary permit only
  answer: A
  explanation: Applicants must provide their own vehicle for the road test. The vehicle
    must be properly registered, insured, and in safe operating condition (including
    working lights, brakes, and tires).
- id: 47
  category: driver_testing
  question: In Nevada, how many demerit points are assigned to your driving record
    for a conviction of 'Reckless Driving'?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 10 points
  answer: C
  explanation: Under the Nevada demerit point system, Reckless Driving is a major
    violation that carries 8 demerit points.
- id: 48
  category: driver_testing
  question: If you are convicted of speeding 11 to 20 miles per hour over the posted
    limit in Nevada, how many demerit points will be added to your license?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Nevada assigns 2 demerit points for speeding 11-20 mph over the limit.
    (1-10 mph over is 1 point; 21-30 mph over is 3 points).
- id: 49
  category: driver_testing
  question: Under Nevada's 'Implied Consent' law, what happens if you refuse to submit
    to a chemical test of your breath, blood, or urine when requested by an officer?
  choices:
    A: You will be given a warning for the first refusal
    B: Your driver's license will be revoked for at least one year
    C: You will be required to pay a $100 fine and continue driving
    D: Your vehicle will be impounded for 30 days but you keep your license
  answer: B
  explanation: By driving in Nevada, you have given consent to chemical testing. Refusal
    results in the immediate seizure of your license and a revocation period of at
    least one year.
- id: 50
  category: driver_testing
  question: 'If you are involved in a traffic crash in Nevada that results in property
    damage of $750 or more, and the crash was not investigated by law enforcement,
    you must report it to the DMV within:'
  choices:
    A: 24 hours
    B: 48 hours
    C: 5 days
    D: 10 days
  answer: D
  explanation: If a crash is not investigated by a law enforcement officer and involves
    injury or property damage of $750 or more, you must complete and submit a Report
    of Traffic Accident (SR-1) to the DMV within 10 days.
- id: 51
  category: driver_testing
  question: In Nevada, you must dim your high-beam headlights when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Nevada law requires drivers to switch to low-beam headlights when within
    500 feet of an oncoming vehicle.
- id: 52
  category: driver_testing
  question: The Nevada Driver's Handbook recommends a following distance of at least
    how many seconds behind the vehicle in front of you?
  choices:
    A: 1 second
    B: 2 to 4 seconds
    C: 5 to 7 seconds
    D: 10 seconds
  answer: B
  explanation: Nevada recommends a following distance of at least 2 to 4 seconds to
    allow enough time to react to hazards or sudden stops.
- id: 53
  category: driver_testing
  question: 'In Nevada, U-turns are generally prohibited in business districts except:'
  choices:
    A: During nighttime hours
    B: When there is no traffic for 500 feet
    C: At intersections or on divided highways where an appropriate opening exists
    D: If the vehicle is less than 20 feet long
  answer: C
  explanation: In Nevada, U-turns are prohibited in business districts except at intersections
    or on divided highways where an appropriate opening or sign is provided.
- id: 54
  category: driver_testing
  question: When a school bus is stopped on a divided highway with a physical median
    or barrier, which vehicles are required to stop for the bus's flashing red lights?
  choices:
    A: Vehicles in all lanes and both directions
    B: Only vehicles traveling in the same direction as the bus
    C: Only vehicles traveling in the opposite direction of the bus
    D: No vehicles are required to stop on a divided highway
  answer: B
  explanation: In Nevada, if a physical barrier or median separates the roadway, only
    traffic traveling in the same direction as the school bus must stop. On undivided
    roads, traffic in both directions must stop.
- id: 55
  category: driver_testing
  question: Nevada's 'Move Over' law requires drivers to move into an adjacent lane
    (if safe) or slow down when approaching which type of stationary vehicle with
    flashing lights?
  choices:
    A: Emergency vehicles only
    B: Tow trucks only
    C: Utility and NDOT vehicles only
    D: All of the above
  answer: D
  explanation: Nevada law requires drivers to decrease speed and, if possible, move
    to a non-adjacent lane when passing any stationary emergency vehicle, tow truck,
    or utility vehicle with flashing lights.
- id: 56
  category: driver_testing
  question: According to Nevada law, who is required to wear a seat belt in a moving
    motor vehicle?
  choices:
    A: Only the driver and front-seat passengers
    B: Only passengers under the age of 18
    C: The driver and all passengers in all seating positions
    D: Only the driver
  answer: C
  explanation: In Nevada, the driver and all passengers age 6 or older (or weighing
    over 60 pounds) must wear a seat belt if the vehicle is equipped with them.
- id: 57
  category: driver_responsibility
  question: What is the fine for a first-time offense of a Nevada registered vehicle
    having an insurance lapse of 1 to 30 days (with no prior lapses)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Nevada law mandates a $250 fine for the first insurance lapse of a
    vehicle registration, in addition to reinstatement fees.
- id: 58
  category: driver_responsibility
  question: When you sell or trade in your vehicle in Nevada, what must you do with
    the license plates?
  choices:
    A: Leave them on the vehicle for the new owner
    B: Destroy them immediately
    C: Keep them and surrender them to the DMV within 60 days if not transferred to
      another vehicle
    D: Keep them and surrender them to the DMV within 1 year
  answer: C
  explanation: In Nevada, license plates stay with the owner, not the vehicle. You
    must remove them and either transfer them to another vehicle or surrender them
    to the DMV within 60 days.
- id: 59
  category: driver_responsibility
  question: In urban areas of Clark and Washoe counties, most gasoline-powered vehicles
    are exempt from emissions (smog) testing for how many years after their initial
    registration?
  choices:
    A: The first year only
    B: The first two years
    C: The first five years
    D: They are never exempt
  answer: B
  explanation: New vehicles are exempt from emissions testing for their first two
    registration years in Nevada.
- id: 60
  category: driver_responsibility
  question: 'Under Nevada''s ''Implied Consent'' law, by driving a vehicle you have
    agreed to:'
  choices:
    A: Always carry a passenger
    B: Submit to a chemical test of your breath, blood, or urine if requested by an
      officer
    C: Allow any person to borrow your vehicle
    D: Pay for any damages you cause regardless of fault
  answer: B
  explanation: The Implied Consent law means that by operating a vehicle on Nevada's
    roads, you have given consent to chemical testing for alcohol or drugs if an officer
    has reasonable grounds to believe you are driving under the influence.
- id: 61
  category: driver_responsibility
  question: Under the Nevada demerit point system, how many points are assessed for
    'Following too closely'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Following too closely is a 4-point violation in the Nevada demerit
    point system.
- id: 62
  category: driver_responsibility
  question: How many demerit points are added to your Nevada driving record for speeding
    11–20 miles per hour over the posted limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Speeding 11–20 mph over the limit results in 2 demerit points in Nevada.
- id: 63
  category: driver_responsibility
  question: In Nevada, it is illegal to smoke tobacco in a vehicle if a child of what
    age is present?
  choices:
    A: Under 6 years old
    B: Under 12 years old
    C: Under 18 years old
    D: Under 21 years old
  answer: C
  explanation: Nevada law (NRS 202.2491) prohibits smoking in a vehicle when a child
    under the age of 18 is present.
- id: 64
  category: driver_responsibility
  question: What is the base fine for a first-time conviction of using a handheld
    cell phone while driving in Nevada?
  choices:
    A: $25
    B: $50
    C: $150
    D: $250
  answer: B
  explanation: The base fine for a first offense of using a handheld wireless communications
    device while driving is $50. Fines increase for subsequent offenses.
- id: 65
  category: driver_responsibility
  question: In Nevada, who is responsible for ensuring that all passengers under the
    age of 18 are wearing a seat belt or are in an appropriate child restraint system?
  choices:
    A: The passenger themselves
    B: The passenger's parents, even if they aren't in the car
    C: The driver
    D: No one; it is optional for passengers in the back seat
  answer: C
  explanation: The driver is responsible for ensuring all passengers under 18 are
    properly restrained. Nevada law requires seat belts for all occupants.
- id: 66
  category: driver_responsibility
  question: Nevada's 'Open Container' law prohibits the possession of an open container
    of an alcoholic beverage in which part of the vehicle?
  choices:
    A: The trunk only
    B: The passenger area
    C: The glove compartment only
    D: Behind the rear seat in a hatchback
  answer: B
  explanation: It is illegal to have an open container of an alcoholic beverage in
    the passenger area of a motor vehicle on a public highway.
- id: 67
  category: driver_responsibility
  question: In Nevada, if you are involved in a traffic accident that causes property
    damage of $_______ or more, you must file a Report of Traffic Accident (SR-1)
    with the DMV.
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: According to Nevada law, any accident resulting in bodily injury or
    property damage of $750 or more must be reported to the DMV using the SR-1 form.
- id: 68
  category: driver_responsibility
  question: If a Nevada driver is involved in a reportable accident, within how many
    days must the Report of Traffic Accident (SR-1) be submitted to the DMV?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: Nevada law requires drivers to submit the SR-1 Report of Traffic Accident
    within 10 days of the occurrence if there is injury, death, or damage exceeding
    $750.
- id: 69
  category: driver_responsibility
  question: Under the Nevada LIVE program, what is the fine for a first-time insurance
    lapse of 1 to 30 days?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: For a first-time insurance lapse of 1 to 30 days, Nevada imposes a
    $250 fine in addition to reinstatement fees.
- id: 70
  category: driver_responsibility
  authorized_by: NV DMV
  question: If your Nevada vehicle registration is suspended due to a lapse in insurance,
    what is the standard reinstatement fee for a first offense?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: To reinstate a registration suspended for an insurance lapse in Nevada,
    the owner must pay a $250 reinstatement fee plus any applicable fines.
- id: 71
  category: driver_responsibility
  question: In Nevada, if your insurance lapse exceeds 90 days, you are required to
    maintain an SR-22 certificate for how long?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: If a Nevada driver has an insurance lapse of more than 90 days, they
    must file an SR-22 (Certificate of Financial Responsibility) for three years.
- id: 72
  category: driver_responsibility
  question: In which Nevada counties is a smog check (emissions test) generally required
    for vehicle registration?
  choices:
    A: All Nevada counties
    B: Only Clark and Washoe counties
    C: Only Clark and Elko counties
    D: Only Carson City and Washoe counties
  answer: B
  explanation: Emissions testing is required in Clark and Washoe counties for most
    gasoline and diesel-powered vehicles.
- id: 73
  category: driver_responsibility
  question: If the Nevada LIVE system cannot verify your insurance, the DMV will send
    a verification request. How many days do you have to respond before your registration
    is suspended?
  choices:
    A: 10 days
    B: 15 days
    C: 20 days
    D: 30 days
  answer: B
  explanation: If the Nevada LIVE system fails to verify insurance, the DMV sends
    a notice. You must provide proof of coverage within 15 days to avoid suspension.
- id: 74
  category: driver_responsibility
  question: 'If you collide with an unattended vehicle in Nevada and cannot find the
    owner, you must:'
  choices:
    A: Wait for at least two hours for the owner to return
    B: Leave a note with your name, address, and vehicle information in a conspicuous
      place
    C: Drive to the nearest police station within 48 hours
    D: Call a tow truck to move the other vehicle
  answer: B
  explanation: Nevada law requires you to locate the owner or leave a written notice
    with your contact information and vehicle details in a secure, visible location
    on the unattended vehicle.
- id: 75
  category: driver_responsibility
  question: If you are involved in an accident in Nevada and do not have liability
    insurance, what may the DMV require you to do to cover potential damages?
  choices:
    A: Perform 100 hours of community service
    B: Deposit a security (cash or bond) with the DMV
    C: Surrender your vehicle to the state
    D: Pay a $5,000 flat fee to the victim
  answer: B
  explanation: Under Nevada's financial responsibility laws, if you are uninsured
    at the time of an accident, you may be required to deposit a security with the
    DMV to cover potential unsatisfied judgments.
- id: 76
  category: driver_responsibility
  question: What is the fine for a third or subsequent insurance lapse within a five-year
    period in Nevada?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: D
  explanation: A third or subsequent insurance lapse within five years results in
    a $1,000 fine, a $250 reinstatement fee, and a minimum 30-day driver's license
    suspension.
- id: 77
  category: driver_responsibility
  question: 'To register a vehicle in Nevada, your insurance policy must be issued
    by:'
  choices:
    A: Any insurance company in the United States
    B: An insurance company licensed to do business in Nevada
    C: A federally owned insurance provider
    D: A company based in your previous state of residence
  answer: B
  explanation: Nevada law requires that your motor vehicle insurance be provided by
    a company authorized to write policies in the State of Nevada.
- id: 78
  category: driver_responsibility
  question: 'If you move out of Nevada, you must return your Nevada license plates
    to the DMV:'
  choices:
    A: Immediately upon arriving in the new state
    B: Only if the plates are personalized
    C: Within 60 days of the move
    D: Before you cancel your Nevada insurance
  answer: D
  explanation: In Nevada, you must return your license plates to the DMV before or
    at the same time you cancel your Nevada insurance policy to avoid being flagged
    for a lapse.
- id: 79
  category: driver_responsibility
  question: In Nevada, which of the following is an acceptable way to show evidence
    of insurance to a law enforcement officer?
  choices:
    A: A printed insurance card only
    B: An electronic image displayed on a mobile device
    C: A verbal statement of the policy number
    D: A copy of the vehicle's title
  answer: B
  explanation: Nevada law allows drivers to present evidence of insurance in either
    printed form or as an electronic image on a mobile device.
- id: 80
  category: driver_responsibility
  question: 'When a Nevada resident purchases a vehicle from a Nevada dealer, the
    dealer provides a document that allows the vehicle to be driven for 30 days. This
    is called a:'
  choices:
    A: Bill of Sale
    B: Certificate of Title
    C: Electronic Report of Sale (EROS)
    D: Temporary Driver Permit
  answer: C
  explanation: Nevada dealers issue an Electronic Report of Sale (EROS), which acts
    as temporary registration for 30 days until the owner completes the permanent
    registration process.
- id: 81
  category: safe_driving_rules
  question: In Nevada, what is the maximum distance you may travel in a shared center
    turn lane before making a turn?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: According to the Nevada Driver's Handbook, you may not travel more
    than 200 feet in a center turn lane before making a left-hand turn.
- id: 82
  category: safe_driving_rules
  question: In Nevada, U-turns are prohibited in business districts except at which
    of the following locations?
  choices:
    A: In the middle of a block
    B: Only in residential areas
    C: At intersections or where signs specifically permit them
    D: U-turns are never allowed in business districts
  answer: C
  explanation: Nevada law (NRS 484B.403) states that U-turns are prohibited in business
    districts except at intersections or on a divided highway where an appropriate
    opening or sign is provided.
- id: 83
  category: safe_driving_rules
  question: When parking near a fire hydrant in Nevada, what is the minimum required
    distance you must maintain?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Nevada law prohibits parking within 15 feet of a fire hydrant.
- id: 84
  category: safe_driving_rules
  question: 'When passing a bicycle in Nevada on a road with two or more lanes traveling
    in the same direction, the driver must:'
  choices:
    A: Honk to warn the cyclist and stay in the lane
    B: Move to the lane to the left if safe and possible
    C: Pass within 2 feet of the cyclist
    D: Wait behind the cyclist until they signal you to pass
  answer: B
  explanation: Nevada's '3-foot rule' (NRS 484B.270) requires motorists to move into
    the lane to the left if there is more than one lane in the same direction. If
    not, they must pass with at least 3 feet of space between the vehicle and the
    bicycle.
- id: 85
  category: safe_driving_rules
  question: When parallel parking on a Nevada street, your vehicle's wheels must be
    within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: In Nevada, when parking on a public street, your vehicle must be parallel
    to and within 18 inches of the curb.
- id: 86
  category: safe_driving_rules
  question: 'In Nevada school zones, speed limits are strictly enforced and are generally
    set at:'
  choices:
    A: 10 or 20 mph
    B: 15 or 25 mph
    C: 20 or 30 mph
    D: 25 or 35 mph
  answer: B
  explanation: Nevada school zone speed limits are typically 15 or 25 mph and are
    in effect during the times posted or while beacons are flashing.
- id: 87
  category: safe_driving_rules
  question: 'According to Nevada law, headlights must be turned on from:'
  choices:
    A: Sunset to sunrise
    B: One hour after sunset to one hour before sunrise
    C: A half hour after sunset to a half hour before sunrise
    D: When visibility is less than 1,000 feet
  answer: C
  explanation: Nevada law requires headlights to be on from a half hour after sunset
    to a half hour before sunrise, or whenever visibility is insufficient to clearly
    see persons or vehicles at a distance of 1,000 feet.
- id: 88
  category: safe_driving_rules
  question: 'If you are convicted of speeding in a Nevada highway work zone when workers
    are present:'
  choices:
    A: Your license is automatically revoked
    B: The fine is doubled
    C: You must serve 48 hours of community service
    D: The fine is tripled
  answer: B
  explanation: Under Nevada law, fines for speeding and other traffic violations are
    doubled in designated work zones when workers are present.
- id: 89
  category: safe_driving_rules
  question: 'To signal a right turn using hand and arm signals, a Nevada driver should:'
  choices:
    A: Extend the left arm and hand straight out
    B: Extend the left arm and hand downward
    C: Extend the left arm and hand upward
    D: Extend the right arm and hand upward
  answer: C
  explanation: The standard hand signal for a right turn is the left arm and hand
    extended upward at a 90-degree angle.
- id: 90
  category: safe_driving_rules
  question: 'The Nevada Driver''s Handbook recommends maintaining a following distance
    of at least:'
  choices:
    A: One second
    B: Two seconds
    C: Five seconds
    D: One car length for every 10 mph
  answer: B
  explanation: The Nevada Driver's Handbook recommends a following distance of at
    least two seconds under normal driving conditions.
- id: 91
  category: safe_driving_rules
  question: When entering a roundabout in Nevada, who has the right-of-way?
  choices:
    A: Traffic entering the roundabout
    B: Traffic already in the roundabout
    C: The vehicle on the right
    D: The vehicle traveling at the highest speed
  answer: B
  explanation: Drivers entering a roundabout must yield the right-of-way to traffic
    already circulating within the roundabout.
- id: 92
  category: safe_driving_rules
  question: 'When parking a vehicle headed uphill on a two-way street with a curb,
    you should turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the right
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    so that if the vehicle rolls, the back of the front tire will hit the curb and
    stop the car.
- id: 93
  category: safe_driving_rules
  question: What is the maximum speed limit allowed on certain designated sections
    of rural interstate highways in Nevada?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: While many Nevada freeways are 65 or 70 mph, certain rural sections
    of I-80 have a posted speed limit of 80 mph.
- id: 94
  category: safe_driving_rules
  question: In Nevada, when you are signaling to make a turn in a business or residential
    district, you must signal continuously for at least how many feet before turning?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: According to the Nevada Driver's Handbook, you must signal at least
    100 feet ahead on city streets and 300 feet ahead on open highways.
- id: 95
  category: safe_driving_rules
  question: Under Nevada law, what is the minimum distance you must maintain when
    passing a bicycle traveling in the same direction?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Nevada law (NRS 484B.270) requires motorists to move into the lane
    to the left if possible, or leave at least 3 feet of space between the vehicle
    and the bicycle.
- id: 96
  category: safe_driving_rules
  question: What is the penalty for speeding in a designated temporary traffic control
    zone (work zone) in Nevada?
  choices:
    A: A flat $500 surcharge
    B: Mandatory license suspension for 30 days
    C: Fines may be doubled
    D: Community service is required
  answer: C
  explanation: Under Nevada law (NRS 484B.600), a person who commits certain traffic
    violations in a work zone, including speeding, may be subject to a fine that is
    double the amount usually imposed.
- id: 97
  category: safe_driving_rules
  question: In Nevada, you may not park your vehicle within how many feet of a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: The Nevada Driver's Handbook specifies that parking is prohibited within
    15 feet of a fire hydrant.
- id: 98
  category: safe_driving_rules
  question: 'When approaching a school bus from either direction that is stopped with
    its red lights flashing and stop arm extended on a road with no physical median,
    you must:'
  choices:
    A: Slow down to 15 mph and pass with caution
    B: Stop only if you are traveling in the same direction as the bus
    C: Stop and remain stopped until the bus driver signals you to proceed
    D: Stop and remain stopped until the bus flashing lights are turned off
  answer: D
  explanation: In Nevada, you must stop for a school bus with flashing red lights
    on any road unless it is a divided highway with a physical barrier and the bus
    is on the opposite side. You must stay stopped until the lights are turned off.
- id: 99
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in a business or residential
    area in Nevada?
  choices:
    A: 15 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: The default speed limit for business and residential areas in Nevada
    is 25 mph unless signs indicate otherwise.
- id: 100
  category: safe_driving_rules
  question: When two vehicles reach an uncontrolled intersection (no signs or signals)
    at the same time, which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling on the wider road
    D: The driver traveling at the higher speed
  answer: B
  explanation: In Nevada, at an intersection where there are no traffic signs or signals,
    the driver on the left must yield the right-of-way to the driver on the right.
- id: 101
  category: safe_driving_rules
  question: You are required to use your headlights in Nevada when visibility is reduced
    to how many feet or less?
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: B
  explanation: Nevada law requires headlights to be turned on from a half hour after
    sunset to a half hour before sunrise, and whenever persons or vehicles cannot
    be clearly seen at a distance of 1,000 feet.
- id: 102
  category: defensive_driving
  question: According to the Nevada Driver's Handbook, how far ahead should you scan
    the road to identify potential hazards?
  choices:
    A: 5 seconds
    B: 12 seconds
    C: 20 seconds
    D: 30 seconds
  answer: B
  explanation: Nevada law and the driver's manual recommend looking at least 12 seconds
    ahead to allow enough time to react to changing conditions.
- id: 103
  category: defensive_driving
  question: In Nevada, what is the recommended minimum following distance behind the
    vehicle in front of you under ideal driving conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 5 seconds
    D: 10 seconds
  answer: B
  explanation: The Nevada Driver's Handbook suggests a minimum following distance
    of at least 2 seconds, which should be increased to 4 seconds or more at higher
    speeds or in bad weather.
- id: 104
  category: defensive_driving
  question: 'In Nevada, you must dim your high-beam headlights when following another
    vehicle within a distance of:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: When following another vehicle from behind, you must switch to low
    beams when you are within 300 feet of that vehicle.
- id: 105
  category: defensive_driving
  question: If you encounter a severe dust storm while driving on a Nevada highway,
    what is the safest defensive driving action to take?
  choices:
    A: Turn on your high beams and continue at a slower speed.
    B: Stop in the middle of the travel lane and turn on hazard lights.
    C: Pull off the road as far as possible, turn off all lights, and take your foot
      off the brake.
    D: Speed up to get through the dust cloud as quickly as possible.
  answer: C
  explanation: In Nevada dust storms, you should pull off the road, turn off all lights
    (including brake lights) so other drivers don't follow you off the road thinking
    you are still on the highway, and wait for visibility to improve.
- id: 106
  category: defensive_driving
  question: Hydroplaning can begin at speeds as low as _____ mph in Nevada if there
    is enough water on the road.
  choices:
    A: 25 mph
    B: 35 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: Hydroplaning (where tires lose contact with the road and 'surf' on
    water) can start at speeds as low as 35 mph.
- id: 107
  category: defensive_driving
  question: 'When passing a bicycle in Nevada, motorists are required by law to maintain
    a minimum distance of at least:'
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: Nevada's '3-Foot Rule' requires motorists to leave at least three feet
    of space between their vehicle and the bicycle when passing.
- id: 108
  category: defensive_driving
  question: 'In Nevada, if you are driving on a highway with two or more lanes in
    the same direction and approach a stopped emergency vehicle with flashing lights,
    you must:'
  choices:
    A: Stop immediately in your lane.
    B: Move to a lane that is not next to the emergency vehicle, if safe to do so.
    C: Maintain your speed and stay in your lane.
    D: Speed up to pass the scene quickly.
  answer: B
  explanation: Nevada's 'Move Over' law requires drivers to move into an adjacent
    lane (away from the emergency vehicle) if it is safe to do so, or slow down if
    moving over is not possible.
- id: 109
  category: defensive_driving
  question: 'If your vehicle begins to skid on a slippery Nevada road, you should:'
  choices:
    A: Slam on the brakes immediately.
    B: Steer in the opposite direction of the skid.
    C: Steer in the direction you want the front of the vehicle to go.
    D: Shift the car into neutral and turn off the engine.
  answer: C
  explanation: To recover from a skid, you should take your foot off the gas and steer
    in the direction you want the vehicle to go.
- id: 110
  category: defensive_driving
  question: In Nevada, what is the demerit point value for 'Reckless Driving'?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Reckless driving is a major traffic offense in Nevada and results in
    8 demerit points being added to your driving record.
- id: 111
  category: defensive_driving
  question: When driving on a Nevada highway, what is the minimum distance a truck
    or a vehicle towing another vehicle must maintain from another such vehicle?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Nevada law requires trucks or vehicles towing other vehicles to maintain
    at least 500 feet of space between them on open highways to allow other vehicles
    to pass safely.
- id: 112
  category: defensive_driving
  question: 'In Nevada, if you are convicted of speeding in a designated school zone
    or a pedestrian safety zone, the fine is:'
  choices:
    A: Reduced by half.
    B: The same as a normal speeding ticket.
    C: Doubled.
    D: Replaced by community service only.
  answer: C
  explanation: Nevada law mandates that fines for traffic violations (like speeding)
    are doubled when committed in a school zone or a pedestrian safety zone.
- id: 113
  category: defensive_driving
  question: 'To avoid ''highway hypnosis'' during long trips on Nevada interstates,
    you should:'
  choices:
    A: Stare at the center line of the road.
    B: Keep your eyes moving and scan the road every few seconds.
    C: Listen to very loud music for the entire trip.
    D: Drink coffee every 30 minutes.
  answer: B
  explanation: Defensive driving involves keeping your eyes moving and scanning the
    environment to stay alert and avoid the trance-like state known as highway hypnosis.
- id: 114
  category: defensive_driving
  question: 'In Nevada, you must use your headlights whenever you cannot see objects
    clearly at a distance of:'
  choices:
    A: 500 feet
    B: 750 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Nevada law requires headlights to be turned on from a half-hour after
    sunset to a half-hour before sunrise, and whenever visibility is less than 1,000
    feet.
- id: 115
  category: defensive_driving
  question: At what speeds can hydroplaning begin to occur on Nevada roads during
    heavy rain?
  choices:
    A: At speeds as low as 35 mph
    B: Only at speeds above 55 mph
    C: Only at speeds above 65 mph
    D: Hydroplaning only occurs in standing water, regardless of speed
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    tires can lose all contact with the road at 55 mph.
- id: 116
  category: defensive_driving
  question: 'If your vehicle is equipped with Anti-lock Braking System (ABS) and you
    need to stop quickly on a slippery Nevada road, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Lightly tap the brakes to avoid locking
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. Do not pump the brakes,
    as this will turn the ABS system off and on.
- id: 117
  category: defensive_driving
  question: 'When entering a roundabout in Nevada, you must yield the right-of-way
    to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: Traffic exiting the circle
    D: No one; traffic entering has the right-of-way
  answer: B
  explanation: In Nevada roundabouts, traffic entering must yield to traffic already
    circulating in the roundabout.
- id: 118
  category: defensive_driving
  question: Nevada's 'Move Over' law requires drivers to do what when approaching
    a stopped emergency vehicle with flashing lights?
  choices:
    A: Stop immediately in the lane of travel
    B: Decrease speed and move to a non-adjacent lane if safe to do so
    C: Maintain speed but honk to alert the emergency workers
    D: Speed up to pass the scene as quickly as possible
  answer: B
  explanation: Nevada law requires drivers to decrease speed and, if possible, move
    to a lane that is not next to the emergency vehicle.
- id: 119
  category: defensive_driving
  question: In Nevada school zones, speed limits are strictly enforced during which
    of the following times?
  choices:
    A: Only when children are physically present on the sidewalk
    B: During the hours posted on the signs or when yellow lights are flashing
    C: Only between 8:00 AM and 3:00 PM
    D: Only during the first and last month of the school year
  answer: B
  explanation: School zone speed limits are in effect during the times posted on the
    signs or while the beacon lights are flashing.
- id: 120
  category: defensive_driving
  question: When driving in heavy fog in Nevada, which lights should you use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: Low beams are best for fog because high beams reflect off the fog and
    create glare, making it harder to see.
- id: 121
  category: defensive_driving
  question: When driving near large commercial trucks (semi-trucks) in Nevada, you
    should avoid the 'No-Zone.' What is the 'No-Zone'?
  choices:
    A: The area directly in front of the truck
    B: The area directly behind the truck
    C: The areas on both sides of the truck where the driver cannot see you
    D: All of the above
  answer: D
  explanation: 'The ''No-Zone'' refers to the large blind spots around a commercial
    truck: the front, the rear, and both sides.'
- id: 122
  category: alcohol_drugs_health
  question: For a first DUI offense in Nevada, for how long is the driver's license
    typically revoked?
  choices:
    A: 30 days
    B: 90 days
    C: 185 days
    D: 1 year
  answer: C
  explanation: A first-offense DUI conviction in Nevada results in a driver's license
    revocation period of 185 days.
- id: 123
  category: alcohol_drugs_health
  question: In Nevada, a driver can be charged with a DUI if their blood contains
    how much Marijuana (THC)?
  choices:
    A: Any detectable amount
    B: 2 nanograms per milliliter
    C: 5 nanograms per milliliter
    D: 10 nanograms per milliliter
  answer: B
  explanation: Nevada law sets the prohibited limit for Marijuana (THC) at 2 nanograms
    per milliliter of blood.
- id: 124
  category: alcohol_drugs_health
  question: Which of the following is true regarding Nevada's open container law?
  choices:
    A: It is legal if the driver is not the one drinking
    B: It is legal if the container is in the glove box
    C: It is illegal to have an open container of an alcoholic beverage in the passenger
      area of a motor vehicle on a public highway
    D: It only applies to drivers under the age of 21
  answer: C
  explanation: Nevada law prohibits the possession of an open container of an alcoholic
    beverage in the passenger area of a motor vehicle while on a public highway.
- id: 125
  category: alcohol_drugs_health
  question: If a Nevada driver refuses to submit to a required chemical test for alcohol
    or drugs, what is the immediate consequence?
  choices:
    A: A $500 fine only
    B: Their license will be seized and revoked
    C: They will be required to attend 10 hours of traffic school
    D: There is no immediate consequence until they go to court
  answer: B
  explanation: If you refuse a chemical test, the officer can seize your license and
    your driving privileges will be revoked, often for a longer period than a standard
    DUI failure.
- id: 126
  category: alcohol_drugs_health
  question: In addition to license revocation and fines, what is a mandatory requirement
    for a first-offense DUI conviction in Nevada?
  choices:
    A: Permanent loss of vehicle
    B: Attendance at a Victim Impact Panel
    C: Retaking the high school equivalency exam
    D: A 5-year prison sentence
  answer: B
  explanation: Nevada law requires first-time DUI offenders to attend a Victim Impact
    Panel and a Nevada-approved DUI school.
- id: 127
  category: alcohol_drugs_health
  question: 'In Nevada, a DUI conviction that causes ''substantial bodily harm'' or
    death to another person is classified as:'
  choices:
    A: A misdemeanor
    B: A gross misdemeanor
    C: A Category B felony
    D: A civil infraction
  answer: C
  explanation: A DUI resulting in death or substantial bodily harm is a Category B
    felony in Nevada, carrying significant prison time and fines.
- id: 128
  category: alcohol_drugs_health
  question: If you are taking a prescription drug, who is responsible for ensuring
    you are fit to drive in Nevada?
  choices:
    A: The pharmacist only
    B: The doctor only
    C: The driver
    D: The police
  answer: C
  explanation: It is the driver's responsibility to know the effects of any medication
    they take. Driving while impaired by prescription drugs is treated the same as
    driving while impaired by alcohol.
- id: 129
  category: alcohol_drugs_health
  question: Under Nevada law, if a driver is convicted of a DUI, they may be required
    to install what device in their vehicle to regain driving privileges?
  choices:
    A: A GPS tracker
    B: A speed governor
    C: An Ignition Interlock Device (IID)
    D: A dash camera
  answer: C
  explanation: Nevada requires many DUI offenders to install an Ignition Interlock
    Device, which prevents the car from starting if alcohol is detected on the driver's
    breath.
- id: 130
  category: alcohol_drugs_health
  question: What is the minimum fine for a first-offense DUI in Nevada (excluding
    court costs)?
  choices:
    A: $100
    B: $400
    C: $1,000
    D: $2,500
  answer: B
  explanation: The fine for a first-offense DUI in Nevada ranges from $400 to $1,000,
    plus additional court costs and fees.
- id: 131
  category: alcohol_drugs_health
  question: If you have a medical condition that may affect your ability to drive
    safely, such as epilepsy, what must you do in Nevada?
  choices:
    A: Surrender your license immediately
    B: Report the condition to the DMV and provide a medical report from a physician
    C: Only drive during daylight hours
    D: Nothing, as long as you feel fine
  answer: B
  explanation: Nevada requires drivers with certain medical conditions to report them
    to the DMV. A physician must clear the driver to ensure they can operate a vehicle
    safely.
- id: 132
  category: alcohol_drugs_health
  question: In Nevada, how many DUI convictions within a 7-year period result in the
    offense being treated as a felony?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: A third DUI conviction within a 7-year period in Nevada is classified
    as a Category B felony.
- id: 133
  category: alcohol_drugs_health
  question: In Nevada, at what Blood Alcohol Concentration (BAC) level is it illegal
    for a driver 21 years of age or older to operate a motor vehicle?
  choices:
    A: 0.02% or higher
    B: 0.05% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: In Nevada, the legal limit for Blood Alcohol Concentration (BAC) is
    0.08% for drivers age 21 and older.
- id: 134
  category: alcohol_drugs_health
  question: 'For a driver under the age of 21, Nevada law considers it a DUI if their
    Blood Alcohol Concentration (BAC) is at least:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Nevada has a zero-tolerance policy for minors; a BAC of 0.02% or higher
    will result in a DUI for drivers under 21.
- id: 135
  category: alcohol_drugs_health
  question: 'If a Nevada driver is convicted of a DUI and a passenger under the age
    of 15 was in the vehicle, the court will consider this:'
  choices:
    A: A reason to dismiss the case
    B: An aggravating factor that may increase penalties
    C: A minor infraction
    D: Irrelevant to the sentencing
  answer: B
  explanation: Having a passenger under age 15 in the vehicle during a DUI is considered
    an aggravating factor in Nevada, which can lead to harsher sentencing.
- id: 136
  category: alcohol_drugs_health
  question: As of recent Nevada law, what device must be installed in a vehicle for
    at least 185 days following a first DUI conviction?
  choices:
    A: A GPS tracker
    B: An Ignition Interlock Device (IID)
    C: A speed governor
    D: An automatic emergency braking system
  answer: B
  explanation: Nevada requires the installation of an Ignition Interlock Device (IID)
    for all DUI convictions, including first offenses, for a minimum of 185 days.
- id: 137
  category: alcohol_drugs_health
  question: Which of the following is a mandatory requirement for a first-time DUI
    offender in Nevada?
  choices:
    A: Attending a Victim Impact Panel
    B: Permanent loss of driving privileges
    C: A minimum of 5 years in prison
    D: Forfeiture of the vehicle to the state
  answer: A
  explanation: First-time DUI offenders in Nevada are required to pay a fine, attend
    DUI school, and attend a Victim Impact Panel.
- id: 138
  category: alcohol_drugs_health
  question: 'In Nevada, a third DUI conviction within a 7-year period is classified
    as:'
  choices:
    A: A civil infraction
    B: A Category E Felony
    C: A Category B Felony
    D: A misdemeanor
  answer: C
  explanation: A third DUI offense within 7 years in Nevada is a Category B felony,
    punishable by 1 to 6 years in prison and a fine of $2,000 to $5,000.
- id: 139
  category: alcohol_drugs_health
  question: 'Nevada''s ''Open Container'' law prohibits:'
  choices:
    A: Any alcohol in the trunk of a car
    B: Unopened bottles of wine in the passenger area
    C: Open alcoholic beverages in the passenger area of a vehicle on a public highway
    D: Transporting alcohol if you are over 21
  answer: C
  explanation: It is illegal in Nevada to have an open container of an alcoholic beverage
    in the passenger area of a motor vehicle while on a public highway.
- id: 140
  category: alcohol_drugs_health
  question: Can you be convicted of a DUI in Nevada for driving under the influence
    of legally prescribed medication?
  choices:
    A: No, if the medication was prescribed by a doctor
    B: No, as long as you have the prescription bottle with you
    C: Yes, if the medication impairs your ability to drive safely
    D: Yes, but only if you also consumed alcohol
  answer: C
  explanation: In Nevada, you can be charged with a DUI for any substance that impairs
    your driving, including prescription or over-the-counter drugs.
- id: 141
  category: alcohol_drugs_health
  question: 'If you refuse to submit to a required chemical test in Nevada, your driver''s
    license will be revoked for at least:'
  choices:
    A: 90 days
    B: 185 days
    C: 1 year
    D: 3 years
  answer: C
  explanation: Refusing a chemical test results in an immediate administrative revocation
    of your license for 1 year for a first refusal.
- id: 142
  category: alcohol_drugs_health
  question: 'A DUI conviction that results in the death or serious bodily injury of
    another person in Nevada is punishable by:'
  choices:
    A: 2 to 20 years in prison
    B: A maximum of 6 months in jail
    C: Community service only
    D: A $500 fine
  answer: A
  explanation: DUI causing death or substantial bodily harm is a Category B felony
    in Nevada, carrying a prison sentence of 2 to 20 years.
- id: 143
  category: alcohol_drugs_health
  question: 'If you have a medical condition that may affect your ability to drive,
    such as epilepsy or a heart condition, Nevada law requires you to:'
  choices:
    A: Stop driving immediately and forever
    B: Report the condition to the DMV when applying for or renewing a license
    C: Only drive during daylight hours
    D: Keep a doctor in the car at all times
  answer: B
  explanation: Nevada requires drivers to disclose physical or mental conditions that
    may interfere with safe driving. The DMV may require a medical professional's
    evaluation.
- id: 144
  category: penalties_and_points
  question: Which of the following violations carries the highest number of demerit
    points (8 points) in the state of Nevada?
  choices:
    A: Careless driving
    B: Reckless driving
    C: Failure to yield to a pedestrian
    D: Passing a school bus when signals are flashing
  answer: B
  explanation: Reckless driving is considered a major violation in Nevada and is assigned
    8 demerit points.
- id: 145
  category: penalties_and_points
  question: Under Nevada's Implied Consent Law, what is the penalty for a first-time
    refusal to submit to a breath, blood, or urine test requested by a police officer?
  choices:
    A: A $500 fine only
    B: License revocation for 90 days
    C: License revocation for 1 year
    D: License suspension for 30 days
  answer: C
  explanation: Under Nevada law, if you refuse a chemical test, your driver's license
    will be revoked for 1 year for a first offense.
- id: 146
  category: penalties_and_points
  question: In Nevada, traffic fines are ________ in designated highway work zones
    when workers are present.
  choices:
    A: Tripled
    B: Reduced by half
    C: Doubled
    D: Increased by a flat $500 fee
  answer: C
  explanation: Nevada law mandates that traffic fines are doubled for violations committed
    in work zones.
- id: 147
  category: penalties_and_points
  question: In Nevada, how many demerit points are issued for 'Following too closely'
    (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Following too closely is a 4-point violation in the Nevada demerit
    point system.
- id: 148
  category: penalties_and_points
  question: What is the standard fine for a first-time seat belt violation in Nevada?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: A
  explanation: In Nevada, the fine for failing to wear a seat belt is $25.
- id: 149
  category: penalties_and_points
  question: 'A first DUI conviction in Nevada may include a jail sentence ranging
    from:'
  choices:
    A: 24 hours to 30 days
    B: 2 days to 6 months
    C: 10 days to 1 year
    D: 6 months to 2 years
  answer: B
  explanation: A first-offense DUI in Nevada carries a potential jail sentence of
    2 days to 6 months.
- id: 150
  category: penalties_and_points
  question: In Nevada, failing to stop for a school bus with its red lights flashing
    results in how many demerit points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Failure to stop for a school bus is a 4-point violation in Nevada.
- id: 151
  category: penalties_and_points
  question: Under Nevada law, how many demerit points are issued for a second or subsequent
    conviction of using a handheld cell phone while driving?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: While the first offense for using a handheld device is not treated
    as a moving violation (no points), a second or subsequent conviction results in
    4 demerit points.
- id: 152
  category: penalties_and_points
  question: How many demerit points are assigned for failing to yield the right-of-way
    to a pedestrian in a crosswalk in Nevada?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Failing to yield the right-of-way to a pedestrian results in 4 demerit
    points on your Nevada driving record.
- id: 153
  category: penalties_and_points
  question: In Nevada, if you are convicted of 'Aggressive Driving,' how many points
    are added to your record?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 10 points
  answer: B
  explanation: Aggressive driving is a specific offense in Nevada that carries a penalty
    of 6 demerit points.
- id: 154
  category: penalties_and_points
  question: 'If a Nevada driver refuses to submit to a required chemical test for
    alcohol or drugs under the Implied Consent Law, their license will be revoked
    for at least:'
  choices:
    A: 90 days
    B: 185 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: Under Nevada's Implied Consent Law, refusing a chemical test results
    in an immediate seizure of your license and a revocation period of 1 year for
    a first offense.
- id: 155
  category: penalties_and_points
  question: What is the demerit point penalty for passing a school bus when its red
    lights are flashing and stop arm is extended?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Passing a school bus illegally in Nevada is a serious violation that
    results in 4 demerit points.
- id: 156
  category: penalties_and_points
  question: In Nevada, if your insurance coverage lapses for 1 to 30 days for the
    first time, what is the required reinstatement fee?
  choices:
    A: $100
    B: $251
    C: $500
    D: $750
  answer: B
  explanation: For a first-time insurance lapse of 1 to 30 days, Nevada requires a
    $251 reinstatement fee. Fines are added if the lapse exceeds 30 days or for repeat
    offenses.
- id: 157
  category: penalties_and_points
  question: Following a DUI conviction in Nevada, for how many years must a driver
    typically maintain an SR-22 (Proof of Financial Responsibility) certificate?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Nevada law requires drivers to maintain SR-22 insurance for 3 years
    following a license reinstatement after a DUI or other major violations.
- id: 158
  category: penalties_and_points
  question: In Nevada, what happens to the fine for a speeding violation occurring
    in a designated highway work zone when workers are present?
  choices:
    A: The fine is tripled
    B: The fine is doubled
    C: The fine is increased by $1,000
    D: The fine remains the same but points are doubled
  answer: B
  explanation: Nevada law mandates that fines for traffic violations, including speeding,
    are doubled in highway work zones and pedestrian safety zones.
- id: 159
  category: penalties_and_points
  question: How many demerit points are assigned for participating in a 'contest of
    speed' (street racing) on a Nevada public street?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Participating in a speed contest or street racing is categorized similarly
    to reckless driving and results in 8 demerit points.
- id: 160
  category: sharing_the_road
  question: You are driving on a Nevada highway with a physical median barrier. A
    school bus is stopped on the opposite side of the median with its red lights flashing
    and stop arm extended. Do you need to stop?
  choices:
    A: Yes, you must always stop for a school bus with flashing red lights.
    B: Yes, but only if there are children present.
    C: No, you are not required to stop if the highway is divided by a physical barrier.
    D: No, but you must slow down to 15 mph.
  answer: C
  explanation: In Nevada, if a highway is divided by a physical barrier or median,
    vehicles traveling in the opposite direction of a school bus are not required
    to stop.
- id: 161
  category: sharing_the_road
  question: Under Nevada's 'Move Over' law, what must you do when approaching a stationary
    emergency vehicle with flashing lights on the roadside?
  choices:
    A: Stop immediately in your lane.
    B: Maintain your speed but honk to alert the emergency workers.
    C: Decrease speed and, if safe/possible, move to a lane that is not adjacent to
      the emergency vehicle.
    D: Speed up to pass the scene as quickly as possible.
  answer: C
  explanation: Nevada law (NRS 484B.607) requires drivers to decrease speed to less
    than the posted limit and move to a non-adjacent lane if it is safe to do so when
    approaching stationary emergency or utility vehicles.
- id: 162
  category: sharing_the_road
  question: Which of the following is TRUE regarding motorcycle lane splitting in
    Nevada?
  choices:
    A: It is legal at speeds under 30 mph.
    B: It is legal only on HOV lanes.
    C: It is illegal for a motorcycle to drive between lanes of traffic.
    D: It is legal if the motorcyclist is wearing a helmet.
  answer: C
  explanation: In Nevada, lane splitting (driving between two lanes of traffic) is
    illegal for motorcycles (NRS 486.351).
- id: 163
  category: sharing_the_road
  question: 'When following a large commercial truck in Nevada, if you cannot see
    the truck driver''s face in their side-view mirrors, you are:'
  choices:
    A: In the 'No-Zone' (blind spot).
    B: At a safe following distance.
    C: In the truck's 'Safe-Zone'.
    D: Ready to pass the truck.
  answer: A
  explanation: Large trucks have significant blind spots known as 'No-Zones.' If you
    cannot see the driver in their side mirrors, they cannot see you.
- id: 164
  category: sharing_the_road
  question: In Nevada, what is the penalty for the first offense of overtaking or
    passing a school bus that has its red lights flashing?
  choices:
    A: A fine of $100 and 1 demerit point.
    B: A fine of $250 to $500 and 4 demerit points.
    C: Mandatory 30-day jail sentence.
    D: Permanent revocation of the driver's license.
  answer: B
  explanation: Passing a school bus with flashing red lights is a serious offense
    in Nevada, carrying a fine of $250 to $500 and 4 demerit points for the first
    offense.
- id: 165
  category: sharing_the_road
  question: 'When a cyclist is using a travel lane in Nevada, they are generally required
    to ride:'
  choices:
    A: On the sidewalk instead.
    B: Against the flow of traffic.
    C: As near to the right side of the highway as practicable.
    D: In the exact center of the lane at all times.
  answer: C
  explanation: Cyclists in Nevada must ride as near to the right side of the highway
    as practicable, except when turning left or avoiding hazards (NRS 484B.763).
- id: 166
  category: sharing_the_road
  question: In Nevada, it is illegal to follow within how many feet of a fire apparatus
    (fire truck) that is responding to an alarm?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Nevada law (NRS 484B.700) prohibits drivers from following a fire engine
    responding to an alarm closer than 500 feet.
- id: 167
  category: sharing_the_road
  question: When a pedestrian is crossing a highway in a crosswalk, who has the right-of-way
    in Nevada?
  choices:
    A: The vehicle, because it is larger.
    B: The pedestrian, and vehicles must yield.
    C: The vehicle, unless the pedestrian is in a school zone.
    D: The pedestrian, but only if the crosswalk is marked with paint.
  answer: B
  explanation: In Nevada, drivers must yield the right-of-way to pedestrians in both
    marked and unmarked crosswalks at intersections.
- id: 168
  category: sharing_the_road
  question: 'Nevada law requires all motorcycle drivers and passengers to wear:'
  choices:
    A: Protective leather jackets.
    B: Reflective vests.
    C: Protective helmets.
    D: Gloves and boots.
  answer: C
  explanation: NRS 486.231 requires all riders and passengers on motorcycles and mopeds
    to wear protective helmets that meet safety standards.
- id: 169
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may often:'
  choices:
    A: Turn from the left lane.
    B: Swing wide to the left to complete the turn.
    C: Stop and wait for all traffic to clear the intersection.
    D: Turn from the sidewalk.
  answer: B
  explanation: Large trucks need more space to turn. They often swing wide to the
    left to clear the curb when making a right turn.
- id: 170
  category: sharing_the_road
  question: 'In Nevada, if you are driving on a road with only one lane in your direction
    and you need to pass a bicycle, you must:'
  choices:
    A: Honk and wait for the cyclist to pull over.
    B: Pass in the same lane with at least 1 foot of clearance.
    C: Move to the left into the lane of oncoming traffic if it is safe to do so to
      provide the 3-foot buffer.
    D: Wait until the road widens to at least three lanes.
  answer: C
  explanation: If there is only one lane in the direction of travel, Nevada law requires
    you to move to the left to pass a cyclist safely, provided it is safe to enter
    the oncoming lane.
- id: 171
  category: sharing_the_road
  question: 'If you see a pedestrian using a white cane or a guide dog at an intersection,
    you must:'
  choices:
    A: Honk your horn to let them know you are there.
    B: Yield the right-of-way and stop your vehicle.
    C: Drive around them as quickly as possible.
    D: Yelp instructions out of your window.
  answer: B
  explanation: Nevada law requires drivers to yield the right-of-way to blind pedestrians
    using a white cane or a service animal.
- id: 172
  category: sharing_the_road
  question: 'When a school bus in Nevada displays flashing amber (yellow) lights,
    it means:'
  choices:
    A: The bus is about to stop and you should prepare to stop.
    B: The bus is speeding up.
    C: You must stop immediately.
    D: The bus is having mechanical trouble.
  answer: A
  explanation: Flashing amber lights on a school bus indicate the bus is preparing
    to stop to load or unload children. Drivers should slow down and prepare to stop.
- id: 173
  category: sharing_the_road
  question: When passing a bicycle in Nevada, what is the minimum distance you must
    maintain between your vehicle and the bicycle if there is no adjacent lane to
    move into?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Nevada law requires motorists to move into an adjacent lane to the
    left if possible. If not, you must pass with at least 3 feet of space between
    your vehicle and the bicycle.
- id: 174
  category: sharing_the_road
  question: In Nevada, what is the legal status of 'lane splitting' (driving between
    rows of stopped or moving vehicles in the same lane) for motorcycles?
  choices:
    A: It is legal at speeds under 30 mph
    B: It is legal only during heavy traffic congestion
    C: It is illegal
    D: It is legal if the motorcycle is air-cooled
  answer: C
  explanation: Nevada law prohibits motorcycles from 'lane splitting' or 'filtering'
    between rows of vehicles in the same lane.
- id: 175
  category: sharing_the_road
  question: What is the minimum following distance you should maintain behind a motorcycle
    in Nevada to ensure safety?
  choices:
    A: At least 1 second
    B: At least 2 seconds
    C: At least 4 seconds
    D: At least 10 seconds
  answer: C
  explanation: The Nevada Driver's Handbook recommends a following distance of at
    least 4 seconds behind motorcycles because they can stop much faster than cars.
- id: 176
  category: sharing_the_road
  question: 'When a pedestrian is crossing a street guided by a service animal or
    carrying a white cane, Nevada law requires drivers to:'
  choices:
    A: Honk to let them know you are there
    B: Come to a full stop and yield the right-of-way
    C: Drive around them slowly
    D: Only stop if there is a marked crosswalk
  answer: B
  explanation: Nevada law requires drivers to yield the right-of-way and come to a
    full stop for any blind person using a service animal or carrying a white cane.
- id: 177
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' Where is the largest blind spot
    located on a commercial truck?
  choices:
    A: Directly in front of the cab
    B: On the left side of the trailer
    C: Directly behind the trailer
    D: On the right side of the trailer
  answer: D
  explanation: While trucks have blind spots on all sides, the right-side blind spot
    is the largest and most dangerous 'No-Zone'.
- id: 178
  category: sharing_the_road
  question: Under Nevada law, which of the following is true regarding helmets for
    motorcycle riders?
  choices:
    A: Helmets are only required for riders under 21
    B: Helmets are only required on highways
    C: Both drivers and passengers are required to wear helmets
    D: Helmets are optional if the rider has 5 years of experience
  answer: C
  explanation: Nevada law requires both motorcycle operators and passengers to wear
    protective helmets that meet safety standards.
- id: 179
  category: sharing_the_road
  question: If a Nevada driver is convicted of 'Aggressive Driving' (a series of acts
    including speeding and failing to yield), how many demerit points are assigned?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Aggressive driving is a serious offense in Nevada and results in 6
    demerit points being added to the driver's record.
- id: 180
  category: sharing_the_road
  question: 'When a bicycle is traveling on a roadway in Nevada, the cyclist is generally
    required to:'
  choices:
    A: Ride against the flow of traffic
    B: Ride as near to the right side of the road as practicable
    C: Stay on the sidewalk at all times
    D: Only ride in designated bike lanes
  answer: B
  explanation: Cyclists in Nevada are required to ride as far to the right as practicable,
    except when turning left or avoiding hazards.
- id: 181
  category: sharing_the_road
  question: 'When a funeral procession is led by a vehicle with flashing amber lights
    in Nevada, other drivers must:'
  choices:
    A: Yield the right-of-way to the entire procession
    B: Only yield to the lead vehicle
    C: Pass the procession on the right
    D: Honk to signal they are passing
  answer: A
  explanation: Nevada law grants funeral processions the right-of-way. Drivers should
    not intersect the procession or pass unless they can do so safely without interference.
- id: 182
  category: vehicle_information
  question: 'In Nevada, you must turn on your headlights when there is insufficient
    light or whenever persons or vehicles cannot be clearly seen at a distance of:'
  choices:
    A: 500 feet
    B: 750 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: According to the Nevada Driver's Handbook, headlights must be used
    when visibility is less than 1,000 feet.
- id: 183
  category: vehicle_information
  question: 'Under Nevada law, it is illegal to operate a vehicle with tires that
    have a tread depth of less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Nevada law (NRS 484D.560) specifies that tires are considered unsafe
    if the tread depth is less than 2/32 of an inch.
- id: 184
  category: vehicle_information
  question: In Nevada, every passenger car must be equipped with a service brake system
    that can stop the vehicle within how many feet at a speed of 20 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 50 feet
  answer: B
  explanation: The Nevada Driver's Handbook states that the service brake must be
    capable of stopping a passenger vehicle traveling at 20 mph within 25 feet.
- id: 185
  category: vehicle_information
  question: Nevada law requires that your vehicle's rearview mirror must allow you
    to see the highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Nevada equipment regulations require a rearview mirror that provides
    a view of the highway for at least 200 feet to the rear of the vehicle.
- id: 186
  category: vehicle_information
  question: In which of the following Nevada counties is emissions testing generally
    required for vehicle registration renewal?
  choices:
    A: All Nevada counties
    B: Only Clark and Washoe counties
    C: Only Clark, Washoe, and Elko counties
    D: Only Carson City
  answer: B
  explanation: Emissions testing is required for most vehicles in the urban areas
    of Clark (Las Vegas) and Washoe (Reno) counties.
- id: 187
  category: vehicle_information
  question: According to Nevada law, the window tint on the front side windows of
    a vehicle must allow at least what percentage of light to pass through?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: NRS 484D.440 states that the front side windows must have a light transmittance
    of not less than 35 percent, plus or minus 7 percent.
- id: 188
  category: vehicle_information
  question: 'In Nevada, a motor vehicle''s horn must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Nevada equipment standards require that a horn must be heard from a
    distance of not less than 200 feet.
- id: 189
  category: vehicle_information
  question: 'Nevada law requires a white light to illuminate the rear license plate
    so that it is clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The Nevada Driver's Handbook specifies that the rear license plate
    must be illuminated by a white light so it can be seen from 50 feet.
- id: 190
  category: vehicle_information
  question: 'In Nevada, turn signal lights must be visible in normal sunlight from
    a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Nevada equipment regulations state that turn signals must be visible
    from at least 300 feet in normal sunlight.
- id: 191
  category: vehicle_information
  question: Nevada law requires that all motor vehicles (except motorcycles and mopeds)
    manufactured after what year be equipped with shoulder harness safety belts for
    the front seats?
  choices:
    A: '1960'
    B: '1968'
    C: '1975'
    D: '1984'
  answer: B
  explanation: Nevada law requires lap belts for 1968 and newer models, and shoulder
    harnesses for 1970 and newer models (though 1968 is the general standard for belt
    requirements in the handbook).
- id: 192
  category: vehicle_information
  question: 'In Nevada, if your vehicle is equipped with a windshield, it must also
    have:'
  choices:
    A: A defroster
    B: Wipers in good working order
    C: A sun strip at the bottom
    D: A protective coating
  answer: B
  explanation: Nevada law requires that every windshield be equipped with a device
    for cleaning rain, snow, or other moisture (wipers) that is maintained in good
    working order.
- id: 193
  category: vehicle_information
  question: Except for authorized emergency vehicles, Nevada law prohibits any vehicle
    from displaying which color light visible from directly in front of the center
    of the vehicle?
  choices:
    A: White
    B: Amber
    C: Red
    D: Yellow
  answer: C
  explanation: NRS 484D.200 prohibits non-emergency vehicles from displaying a red
    light visible from directly in front of the vehicle.
- id: 194
  category: vehicle_information
  question: According to the Nevada Driver's Handbook, when must your vehicle's headlights
    be turned on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From a half hour after sunset to a half hour before sunrise
    D: Only when it is raining or snowing
  answer: C
  explanation: Nevada law requires headlights to be turned on from a half hour after
    sunset to a half hour before sunrise, or whenever persons or vehicles cannot be
    clearly seen at a distance of 1,000 feet.
- id: 195
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle in
    Nevada?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Nevada law requires that tires have a minimum tread depth of at least
    2/32 of an inch in every major groove.
- id: 196
  category: vehicle_information
  question: 'Nevada law prohibits window tinting on the front side windows that reduces
    light transmission to less than:'
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: NRS 484D.440 states that non-reflective window tint on the front side
    windows must allow at least 35% of light to pass through (plus or minus 7%).
- id: 197
  category: vehicle_information
  question: 'Every motor vehicle in Nevada must be equipped with a horn that can be
    heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Nevada law requires a horn that is audible under normal conditions
    from a distance of not less than 200 feet.
- id: 198
  category: vehicle_information
  question: 'In Nevada, the tail lamp that illuminates the rear license plate must
    make the plate clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The rear license plate must be illuminated by a white light so that
    it can be read from a distance of 50 feet to the rear.
- id: 199
  category: vehicle_information
  question: When driving on a Nevada highway, you must signal your intention to turn
    at least how many feet before the turn?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: In Nevada, you must signal at least 100 feet before turning in business
    or residential areas, and at least 300 feet on open highways.
- id: 200
  category: vehicle_information
  question: Under Nevada law, what is the requirement for windshield wipers?
  choices:
    A: They are only required if the vehicle is used for commercial purposes
    B: They must be manually operated by the driver
    C: They must be maintained in good working order and be able to clear rain/snow
    D: They are only required in Washoe County
  answer: C
  explanation: Every motor vehicle with a windshield must be equipped with power-driven
    wipers maintained in good working order to clear rain, snow, or other moisture.
- id: 201
  category: vehicle_information
  question: In Nevada, if a vehicle is equipped with safety belts, who is required
    to wear them?
  choices:
    A: Only the driver
    B: Only the driver and front-seat passengers
    C: The driver and all passengers 6 years of age or older
    D: Only passengers under the age of 18
  answer: C
  explanation: Nevada law requires the driver and all passengers age 6 or older (or
    weighing over 60 pounds) to wear safety belts if the vehicle is equipped with
    them.
- id: 202
  category: vehicle_information
  question: 'In Nevada, trucks and trailers must be equipped with mudguards (fenders)
    if they have a manufacturer''s gross vehicle weight rating of more than:'
  choices:
    A: 10,000 pounds
    B: 15,000 pounds
    C: 20,000 pounds
    D: 26,000 pounds
  answer: D
  explanation: Nevada law (NRS 484D.435) requires mudguards or fenders on the rear
    wheels of every motor vehicle with a GVWR of more than 26,000 pounds.
- id: 203
  category: signs_and_signals
  question: In Nevada, what does a flashing yellow arrow signal mean?
  choices:
    A: Stop and wait for a green arrow
    B: The signal is about to turn red; clear the intersection
    C: Yield to oncoming traffic and pedestrians, then proceed with caution in the
      direction of the arrow
    D: You have the right-of-way to turn left
  answer: C
  explanation: According to the Nevada Driver's Handbook, a flashing yellow arrow
    means you may turn in the direction of the arrow after yielding to oncoming traffic
    and pedestrians.
- id: 204
  category: signs_and_signals
  question: In Nevada, what is the standard speed limit in a school zone when signs
    are flashing or during posted hours?
  choices:
    A: 10 mph
    B: 15 or 25 mph
    C: 20 mph
    D: 30 mph
  answer: B
  explanation: Nevada school zone speed limits are typically 15 or 25 mph and are
    in effect during the times posted or when the yellow lights are flashing.
- id: 205
  category: signs_and_signals
  question: Under Nevada law, when are you allowed to make a U-turn in a business
    district?
  choices:
    A: Anywhere, as long as it is safe
    B: Only at an intersection or on a divided highway where an appropriate opening
      exists
    C: Never in a business district
    D: Only in the middle of a block if there are no cars coming
  answer: B
  explanation: NRS 484B.403 prohibits U-turns in business districts except at an intersection
    or on a divided highway where an appropriate opening exists.
- id: 206
  category: signs_and_signals
  question: What does a solid white line painted on the pavement between lanes of
    traffic indicate?
  choices:
    A: You are in a one-way street
    B: Lane changes are discouraged; you should stay in your lane
    C: You must turn in the direction of the arrow
    D: Traffic is moving in opposite directions
  answer: B
  explanation: In Nevada, a solid white line indicates that lane changes are discouraged
    for safety reasons, though not strictly illegal like a double solid white line.
- id: 207
  category: signs_and_signals
  question: In Nevada, what does a 'Red X' over a traffic lane indicate?
  choices:
    A: The lane is for emergency vehicles only
    B: You must come to a complete stop in that lane
    C: You must not drive in this lane
    D: The lane is about to close; merge immediately
  answer: C
  explanation: A Red X signal over a lane means the lane is closed to traffic in your
    direction and you must not use it.
- id: 208
  category: signs_and_signals
  question: When approaching a railroad crossing in Nevada, you must stop your vehicle
    within how many feet from the nearest rail if a signal is flashing?
  choices:
    A: Between 5 and 25 feet
    B: Between 10 and 30 feet
    C: Between 15 and 50 feet
    D: Exactly 20 feet
  answer: C
  explanation: NRS 484B.553 requires drivers to stop between 15 and 50 feet from the
    nearest rail of a railroad crossing when warning signals are active.
- id: 209
  category: signs_and_signals
  question: In Nevada, what is the meaning of a 'yield' sign?
  choices:
    A: Slow down and be prepared to stop if necessary to let other drivers or pedestrians
      pass
    B: Always come to a full stop before proceeding
    C: Speed up to merge with traffic
    D: You have the right-of-way over all other traffic
  answer: A
  explanation: A yield sign means you must slow down and yield the right-of-way to
    any vehicle or pedestrian in the intersection or approaching so closely as to
    constitute a hazard.
- id: 210
  category: signs_and_signals
  question: Which of these is the correct action to take when approaching a roundabout
    in Nevada?
  choices:
    A: Always stop before entering the roundabout
    B: Yield to traffic already in the roundabout and to your left
    C: Yield to traffic entering from your right
    D: Speed up to find a gap in traffic
  answer: B
  explanation: Nevada law requires drivers entering a roundabout to yield the right-of-way
    to traffic already circulating within the roundabout, which will be coming from
    the left.
- id: 211
  category: signs_and_signals
  question: 'In Nevada, a curb painted blue indicates:'
  choices:
    A: Loading zone for commercial vehicles
    B: Parking for disabled persons with a valid permit only
    C: No parking or stopping at any time
    D: Passenger drop-off and pick-up only
  answer: B
  explanation: A blue curb designates parking spaces for persons with disabilities
    who have a valid placard or license plate.
- id: 212
  category: signs_and_signals
  question: When can you legally turn left on a red light in Nevada?
  choices:
    A: Never
    B: From a one-way street onto another one-way street after stopping and yielding
    C: From a two-way street onto a one-way street
    D: At any intersection if no traffic is coming
  answer: B
  explanation: NRS 484B.307 allows a left turn on red only when turning from a one-way
    street onto another one-way street, after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 213
  category: signs_and_signals
  question: In Nevada, what do double solid yellow lines in the center of the road
    mean?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on your side
    C: Vehicles moving in either direction are prohibited from passing
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines mean that passing is not allowed for vehicles
    traveling in either direction.
- id: 214
  category: signs_and_signals
  question: What is the meaning of a diamond-shaped orange sign on a Nevada road?
  choices:
    A: Regulatory sign (e.g., speed limit)
    B: Service sign (e.g., gas or lodging)
    C: Construction or maintenance warning
    D: Recreational area guidance
  answer: C
  explanation: Orange diamond-shaped signs are used specifically to warn drivers of
    construction and maintenance zones.
- id: 215
  category: signs_and_signals
  question: In Nevada, if you are driving on a road with a 'HOV 2+' sign, what does
    this indicate?
  choices:
    A: The lane is for vehicles with 2 or more occupants during specific hours
    B: The speed limit is 20 mph higher in this lane
    C: Only heavy-duty trucks with 2 axles are allowed
    D: The lane is for emergency vehicles with 2 sirens
  answer: A
  explanation: HOV stands for High Occupancy Vehicle. In Nevada (common in Las Vegas),
    HOV 2+ lanes are reserved for vehicles with at least two people during the hours
    specified on the signs.
- id: 216
  category: signs_and_signals
  question: When you see a steady yellow arrow pointing left at a Nevada intersection,
    what should you do?
  choices:
    A: The 'protected' turning time is ending; be prepared to stop
    B: You have the right-of-way to turn left
    C: Stop immediately, even if you are in the intersection
    D: Turn left quickly before the light changes
  answer: A
  explanation: A steady yellow arrow means the signal is about to change to red. If
    you are already in the intersection, you should complete your turn safely. If
    you have not entered, you must stop.
- id: 217
  category: signs_and_signals
  question: If your vehicle's turn signals fail, what is the correct hand signal for
    a right turn in Nevada?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended out and bent upward at the elbow
    C: Left arm extended out and bent downward at the elbow
    D: Right arm extended straight out the window
  answer: B
  explanation: For a right turn, the driver should extend their left arm out the window
    and bend it upward at the elbow, forming an 'L' shape.
- id: 218
  category: signs_and_signals
  question: In Nevada school zones, when are the reduced speed limits (usually 15
    or 25 mph) in effect?
  choices:
    A: Only when children are present on the sidewalk
    B: During school hours only
    C: On school days from 7:00 AM to 4:00 PM
    D: When the signs are flashing or during the times listed on the sign
  answer: D
  explanation: Nevada law states that school zone speed limits are in effect when
    the yellow lights on the signs are flashing or during the specific time periods
    posted on the signs.
- id: 219
  category: signs_and_signals
  question: What does a flashing red light at a Nevada intersection mean?
  choices:
    A: Slow down and proceed if the way is clear
    B: Stop and wait for a green light
    C: Come to a full stop and proceed only when it is safe
    D: The signal is broken; ignore it and follow the right-of-way rules
  answer: C
  explanation: A flashing red light has the same meaning as a stop sign. You must
    come to a complete stop, yield to cross traffic and pedestrians, and proceed when
    safe.
- id: 220
  category: signs_and_signals
  question: 'In Nevada, double solid yellow lines on the highway signify:'
  choices:
    A: Passing is permitted from either side
    B: Passing is prohibited in both directions
    C: You may pass if there is no oncoming traffic
    D: The road is under construction
  answer: B
  explanation: Double solid yellow lines mean that vehicles moving in either direction
    are prohibited from passing. You may only cross these lines to make a left turn
    into or from a driveway or alley.
- id: 221
  category: signs_and_signals
  question: What is the shape and color of a standard 'Yield' sign in Nevada?
  choices:
    A: A red octagon with white lettering
    B: A yellow diamond with black lettering
    C: A downward-pointing triangle that is red and white
    D: A white rectangle with black lettering
  answer: C
  explanation: Yield signs in Nevada and across the US are equilateral triangles pointing
    downward, with a red border and a white interior.
- id: 222
  category: signs_and_signals
  question: 'A diamond-shaped symbol painted on a Nevada highway lane indicates:'
  choices:
    A: The lane is for emergency vehicles only
    B: The lane is reserved for High Occupancy Vehicles (HOV)
    C: The lane is ending soon
    D: A railroad crossing is ahead
  answer: B
  explanation: The diamond symbol marks HOV lanes, which are reserved for vehicles
    with a specific number of occupants, buses, or motorcycles during certain hours.
- id: 223
  category: signs_and_signals
  question: 'When a pedestrian signal shows a flashing ''Don''t Walk'' or ''Upraised
    Hand'' in Nevada, a pedestrian should:'
  choices:
    A: Run to the other side of the street
    B: Not start to cross the street
    C: Stop in the middle of the street and wait for the next signal
    D: Turn back to the curb they just left
  answer: B
  explanation: If the signal is flashing, pedestrians who have already started to
    cross should continue to the other side. Pedestrians who have not yet entered
    the street must not start crossing.
- id: 224
  category: signs_and_signals
  question: In Nevada, regulatory signs that provide information about laws and regulations
    are typically what shape and color?
  choices:
    A: Diamond-shaped and yellow
    B: Circular and blue
    C: Rectangular and white with black or red lettering
    D: Pentagon-shaped and fluorescent green
  answer: C
  explanation: Regulatory signs, such as speed limits or 'No U-Turn' signs, are usually
    vertical rectangles with a white background and black or red markings.
- id: 225
  category: signs_and_signals
  question: What is the Nevada hand signal for slowing down or stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm extended out and bent upward
    C: Left arm extended out and bent downward
    D: Right arm waving back and forth
  answer: C
  explanation: To signal slowing or stopping using hand signals, the driver should
    extend their left arm out the window and bend it downward at the elbow.
- id: 226
  category: signs_and_signals
  question: 'In Nevada, orange-colored signs are used to warn drivers of:'
  choices:
    A: Nearby parks or recreation areas
    B: Motorist services like gas or lodging
    C: Road construction or maintenance zones
    D: School zones
  answer: C
  explanation: Orange is the standard color for warning signs in construction and
    maintenance work zones. Drivers should be alert for workers and equipment.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 227
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 228
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 229
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 230
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 231
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 232
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 233
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 234
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
