  question: Which camera technology helps drivers park by showing a virtual bird’s-eye
    view above the vehicle?
  choices:
    A: Rear Cross-Traffic Alert
    B: Surround-View Monitor
    C: Curve Speed Warning
    D: Forward Collision Warning
  answer: B
  explanation: The Surround-View Monitor or Around-View Monitor System helps drivers
    park 'by showing the vehicle’s surroundings through a virtual bird’s-eye view
    above the vehicle.'
- id: 195
  category: vehicle_information
  question: 'Detection technologies generally alert the driver to bicycles, pedestrians,
    or obstacles when driving at low speeds of around:'
  choices:
    A: 10 mph
    B: 25 mph
    C: 40 mph
    D: 55 mph
  answer: B
  explanation: The manual notes these systems alert the driver when an obstacle has
    been detected 'while driving at low speeds - generally around 25 mph.'
- id: 196
