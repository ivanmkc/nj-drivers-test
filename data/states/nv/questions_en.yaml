  question: What will an Automatic Emergency Braking System do if it senses stopped
    traffic ahead and the driver fails to respond?
  choices:
    A: It will urgently apply the brakes.
    B: It will steer the vehicle into the adjacent lane.
    C: It will turn on the hazard lights and honk the horn.
    D: It will accelerate to clear the hazard quickly.
