  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: If an adjacent lane does not exist, pass to the left of the bicycle
    at a safe distance, which must be at least three feet.
- id: 178
  category: safe_driving_rules
  question: What is the legal parking position regarding the distance of your wheels
    from the curb?
  choices:
    A: Within 12 inches
    B: Within 18 inches
    C: Within 24 inches
    D: Within 30 inches
  answer: B
  explanation: The legal parking position is with the front and rear wheels within
    18 inches of the curb.
- id: 179
  category: safe_driving_rules
  question: When parked, your vehicle should be visible for at least how far in each
    direction?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Your vehicle should be visible for 200 feet (about 20 car lengths)
    in each direction when parked.
- id: 180
  category: vehicle_information
  question: Why must you never turn your vehicle's ignition to the 'lock' position
    while it is still in motion?
  choices:
    A: It will immediately drain the battery
    B: It will cause the engine to overheat
    C: It will cause the steering to lock and you will lose control
    D: It will permanently damage the transmission
  answer: C
  explanation: Never turn your vehicle's ignition to the 'lock' position while it
    is still in motion. This will cause the steering to lock if you try to turn the
