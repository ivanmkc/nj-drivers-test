  question: When is it acceptable to stop your vehicle on a freeway?
  choices:
    A: When you need to check your map or GPS.
    B: Only for an emergency.
    C: When you want to take a phone call.
    D: If you miss your exit and need to back up.
  answer: B
  explanation: 'The manual strictly states: ''DO NOT STOP ON A FREEWAY EXCEPT FOR
    AN EMERGENCY.'''
- id: 187
  category: safe_driving_rules
  question: If you have car trouble on the freeway and must stop, what should you
    do to warn other traffic?
  choices:
    A: Honk your horn continuously.
    B: Turn on your four-way flashers.
    C: Stand in the lane and wave your arms.
    D: Turn off all your lights so you are not a distraction.
  answer: B
  explanation: If you have car trouble, you should move to the shoulder or emergency
    stopping area and 'Turn on your four-way flashers to warn other traffic.'
- id: 188
  category: penalties_and_points
  question: What is the minimum fine for illegally parking in a space marked with
    the international symbol of access?
  choices:
    A: $100
    B: $150
